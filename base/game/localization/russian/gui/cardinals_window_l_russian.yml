 theocratic_elective_pious: "Благочестивый"
 theocratic_elective_pious_desc: "#flavor Коллегия должна выдвинуть из своих рядов наиболее достойного — кардинала, чья жизнь уже подобна житиям святых.#!\n\nЧтобы стать #EMP благочестивым#! кандидатом, необходимо превосходить всех прочих [Concept('cardinal', 'кардиналов')|E] в святости. В первую очередь учитывается [Concept('piety_level', 'уровень набожности')|E], за ним следует навык [Concept('learning', 'учёности')|E] и жизнь, проведённая в #TOOLTIP:GAME_TRAIT,lifestyle_scholar,[Situation.GetID] #L поисках истины#!#!, #TOOLTIP:GAME_TRAIT,pilgrim,[Situation.GetID] #L паломничествах#!#! или #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[Situation.GetID] #L мистических озарениях#!#!. Любой имеющийся у вас [Concept('sin', 'грех')|E] весит больше, чем даёт [Concept('virtue', 'добродетель')|E].[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "Популист"
 theocratic_elective_populist_desc: "#flavor Папа, не пользующийся поддержкой паствы, ничего не стоит. Коллегия выдвинет кандидата, которого уже чествуют на улицах.#!\n\nЧтобы стать кандидатом-#EMP популистом#!, необходимо превосходить всех прочих [Concept('cardinal', 'кардиналов')|E] в известности. Повышайте [Concept('prestige_level', 'уровень репутации')|E] и навык [Concept('diplomacy', 'дипломатии')|E], заведите [Concept('friends', 'друзей')|E] в [Concept('college_of_cardinals', 'коллегии кардиналов')|E], разделяйте [Concept('tenet_popularity', 'популярные')|E] [Concept('personal_tenets', 'личные принципы')|E] и используйте [Concept('decision', 'решение')|E] «[GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName]».[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "Влиятельный"
 theocratic_elective_powerful_desc: "#flavor Недругов у престола святого Петра не меньше, чем сторонников, посему коллегия выдвинет прелата, способного править решительно.#!\n\nЧтобы стать #EMP влиятельным#! кандидатом, необходимо превосходить всех прочих [Concept('cardinal', 'кардиналов')|E] в мирском могуществе. Распространяйте своё [Concept('rite', 'течение')|E] в новых [Concept('counties', 'графствах')|E], удерживайте [Concept('holy_sites', 'святые места')|E], повышайте [Concept('dynasty_prestige_level', 'уровень величия')|E] своей династии — или воспользуйтесь [Concept('character_interaction', 'взаимодействием персонажа')|E] #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#!, чтобы попросту купить голоса выборщиков.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
