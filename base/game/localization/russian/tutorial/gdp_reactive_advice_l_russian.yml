l_russian:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "Потребности зданий"
 action_reactive_advice_building_needs: "Совет: $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "Ваши [Concept('buildings', 'здания')|E] [Concept('needs', 'нуждаются')|E] в [Concept('trade_goods', 'товарах')|E], поставляемых с местного [Concept('market', 'рынка')|E]. Откройте, чтобы узнать как удовлетворять потребности зданий."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "Если вы хотите получить максимум выгоды от [Concept('buildings', 'зданий')|E] своего [Concept('domain', 'домена')|E], убедитесь, что они получают необходимые [Concept('trade_goods', 'товары')|E].\n\nДавайте посмотрим, как это сделать!"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "Для начала взглянем на ваш [Concept('domain', 'домен')|E]."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Откройте вкладку «Домен» в окне «Держава» (выделено)"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "Это все [Concept('holdings', 'владения')|E] вашего [Concept('domain', 'домена')|E].\n\n[Concept('county', 'Графства')|E], в которых находятся владения, являются частью [Concept('market', 'рынка')|E]. На рынках ведётся обмен всеми [Concept('goods', 'товарами')|E], которые производятся и потребляются [Concept('buildings', 'зданиями')|E]."
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "Теперь давайте внимательно рассмотрим одно из ваших [Concept('holdings', 'владений')|E]."
 reactive_advice_building_needs_step_open_county_view_prompt: "Щёлкните по одному из ваших владений (выделено)"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "Это [Concept('districts', 'районы')|E] вашего [Concept('holding', 'владения')|E]. В каждом районе находятся [Concept('buildings', 'здания')|E], которые производят и потребляют [Concept('goods', 'товары')|E]."
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "В качестве примера можно рассмотреть [Concept('needs', 'потребности')|E] [Concept('holding_district', 'района вашего владения')|E]."
 reactive_advice_building_needs_step_open_district_view_prompt: "Щёлкните по району владения (выделено)#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "Здесь указаны эффекты каждого [Concept('building', 'здания')|E] в [Concept('district', 'районе')|E].\n\nДля активации некоторых эффектов необходимо потреблять [Concept('trade_goods', 'товары')|E] с [Concept('market', 'рынка')|E] этого [Concept('county', 'графства')|E].\n\nНапример, [Concept('holding_district', 'район владения')|E] обеспечивает [Concept('holding', 'владение')|E] [Concept('food_supply', 'продовольствием')|E], если [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l] и [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon|l] подходят для удовлетворения потребности.\n\nНеудовлетворение [Concept('need', 'потребности')|E] не влечёт никаких негативных последствий, а все здания приносят пользу, даже если не имеют доступа к необходимым им товарам."
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "Зачастую требуется не конкретный [Concept('trade_good', 'товар')|E], а любое сочетание товаров нужной [Concept('trade_category_short', 'категории')|E]. Например, в [Concept('building', 'здании')|E] могут требоваться [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l], а это значит, что сгодятся как [GetTradeGoodType('trade_good_grain').GetNameWithIcon|l], так и [GetTradeGoodType('trade_good_millet').GetNameWithIcon|l] или [GetTradeGoodType('trade_good_rice').GetNameWithIcon|l].\n\nКроме того, некоторые [Concept('needs', 'потребности')|E] можно удовлетворять неоднократно, каждый раз получая эффект при достижении необходимого количества."
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "Итак, [Concept('buildings', 'зданиям')|E] нужны [Concept('trade_goods', 'товары')|E], но откуда они берутся? \n\nКаждый товар, потребляемый в [Concept('county', 'графстве')|E], поступает с [Concept('market', 'рынка')|E] этого графства."
 reactive_advice_building_needs_step_open_market_view_prompt: "Откройте рынок графства (выделено)#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "Это [Concept('market', 'рынок')|E] [Concept('county', 'графства')|E]. Обычно рынок включает в себя все [Concept('counties', 'графства')|E] одного [Concept('duchy', 'герцогства')|E]."
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "Здесь перечислены все [Concept('trade_good', 'товары')|E], а также указано, в [Concept('surplus', 'избытке')|E] они или же [Concept('need', 'потребность')|E] в них не удовлетворена.\n\nЕсли есть неудовлетворённые потребности (#N отрицательный баланс#!), это значит, что не у всех [Concept('buildings', 'зданий')|E] [Concept('market', 'рынка')|E] [Concept('needs', 'потребности')|E] удовлетворены.\n\nЕсли наблюдается избыток (#P положительный баланс#!), значит, потребность всех [Concept('buildings', 'зданий')|E] рынка в этом товаре удовлетворена, и товар можно экспортировать по [Concept('trade_routes', 'торговым путям')|E].\n\n#I Щёлкните по товарам, чтобы просмотреть их статус на рынке и на карте.#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "Если есть неудовлетворённая [Concept('need', 'потребность')|E], вы можете попробовать удовлетворить их разными способами:\n\n$BULLET_WITH_TAB$Построить на [Concept('market', 'рынке')|E] [Concept('buildings', 'здания')|E], которые производят этот [Concept('trade_good', 'товар')|E].\n$BULLET_WITH_TAB$Организовать [Concept('distribution_route', 'маршрут распределения')|E] между двумя рынками вашей [Concept('realm', 'державы')|E].\n$BULLET_WITH_TAB$Поручить одному из ваших [Concept('client_merchants', 'торговцев-клиентов')|E] привезти товары.\n\nОднако удовлетворить все потребности бывает непросто, и порой лучше оставить потребности неудовлетворёнными."
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Очередь строительства"
 action_reactive_advice_construction_queue: "Совет: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "Вы добавили строительство в очередь. Откройте, чтобы узнать, как управлять строительством."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "Вы добавили строительство в очередь!\n\nДаже если сейчас [Concept('building', 'здание')|E] вам не по карману, вы всё равно можете добавить его в очередь, и оно будет построено при первой возможности.\n\nДавайте взглянем на вашу очередь."
 reactive_advice_construction_queue_intro_prompt: "Откройте окно «$BUILD_QUEUE_WINDOW_TITLE$» (выделено)"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "Это всё строительство, добавленное вами в очередь во всех ваших [Concept('holdings', 'владениях')|E].\n\nКак только вы сможете заплатить необходимую цену, и будут выполнены прочие условия, сумма будет автоматически уплачена, и начнётся строительство.\n\nСтроительство ведётся согласно очереди, но вы можете перетаскивать здания, чтобы поменять очерёдность."
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "Если вы хотите накопить [Concept('gold', 'золото')|E] или другой ресурс, вы можете зарезервировать его здесь.\n\nУказанное количество не будет расходоваться на строительство в очереди, благодаря чему у вас всегда будут накопления на экстренный случай."
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "Вот и всё, что нужно знать об очереди строительства, удачи!"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Торговые пути"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "Пока одни трудятся в полях, а другие наживаются на бедняках, вы получаете прибыль от торговли [Concept('goods', 'товарами')|E].\n\n[Concept('trade_routes', 'Торговые пути')|E] — основной источник [Concept('gold', 'золота')|E] для [Concept('merchants', 'торговцев')|E] и [Concept('republics', 'республик')|E]."
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "Сначала определитесь с [Concept('trade_good', 'товаром')|E], которым будете торговать.\n\nМы подобрали для вас несколько рекомендуемых вариантов, но вы можете просмотреть весь список товаров, если ищете что-то конкретное."
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "На карте показаны все [Concept('markets', 'рынки')|E], на которых торгуют выбранным вами [Concept('trade_good', 'товаром')|E].\n\nДля торговли нужно соединить рынок с [Concept('surplus', 'избытком')|E] товара (#trade_surplus бирюзовый#!) с местом, где есть [Concept('need', 'потребность')|E] в нём (#trade_need золотой#!).\n\nЕсли на рынке много других [Concept('merchants', 'торговцев')|E], вы сможете торговать лишь частью имеющихся там товаров. Доступный объём ограничен вашей [Concept('competitiveness', 'конкурентоспособностью')|E].\n\nПокупая дешевле и продавая дороже, вы сможете получать больше прибыли.\n\n#I Щёлкайте по рынкам, чтобы добавлять их в торговый путь или удалять из него.#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "По мере добавления [Concept('markets', 'рынков')|E] к вашему [Concept('route', 'торговому пути')|E] здесь появляются [Concept('good', 'товары')|E], которые можно перевозить по этому маршруту.\n\nКрайний слева — ваш [Concept('primary_good', 'основной товар')|E]. Торговля им приносит [Concept('trade_expertise', 'познания в торговле')|E], которые со временем открывают различные преимущества в зависимости [Concept('trade_category', 'категории товаров')|E].\n\n#I Если вы перевозите по торговому пути несколько товаров, вы можете перетащить другой товар на первое место, чтобы назначить его основным.#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "Существуют определённые ограничения как на типы перевозимых [Concept('goods', 'товаров')|E], так и на их общий [Concept('capacity', 'объём')|E].\n\nПовысить лимиты можно, построив соответствующие [Concept('company_buildings_short', 'здания')|E] в вашей [Concept('company', 'компании')|E]."
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "Аналогичным образом, протяжённость путей ограничена их [Concept('trade_route_length', 'длиной')|E], а число остановок на [Concept('markets', 'рынках')|E] не может превышать установленный предел."
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "И, наконец, вы можете назначить одного из своих [Concept('associates', 'помощников')|E] [Concept('trader', 'торговцем')|E]. Он будет улучшать различные аспекты вашего [Concept('route', 'торгового пути')|E] в зависимости от порученной ему задачи."
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "По мере развития своей [Concept('company', 'компании')|E] вы сможете получать доступ к новым [Concept('routes', 'торговым путям')|E], увеличивать их протяжённость и объём торговли.\n\nТак вы сможете зарабатывать всё больше [Concept('gold', 'золота')|E]!"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Жизнь торговца"
 action_reactive_advice_merchant_introduction: "Совет: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "Итак вы — [Concept('merchant', 'торговец')|E]! Откройте этот урок, чтобы ознакомиться с основами торговли."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "Итак вы — [Concept('merchant', 'торговец')|E]!\n\nНесмотря на то что [Concept('trade', 'торговля')|E] — основа вашей [Concept('company', 'компании')|E], коммерция не ограничивается лишь умением зарабатывать деньги."
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "Для начала разберёмся, как ваша [Concept('company', 'компания')|E] может расти и процветать в долгосрочной перспективе."
 reactive_advice_merchant_introduction_open_overview_prompt: "Откройте вкладку «Обзор» в окне «Держава» (выделено)"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "Перед вами [Concept('company_size', 'размер')|E] вашей компании — основной показатель её могущества.\n\nПо мере расширения вашей компании, на вас станут всё чаще обращать внимание [Concept('rulers', 'правители')|E] более высокого [Concept('rank', 'ранга')|E], в том числе [Concept('kings', 'короли')|E] и [Concept('emperors', 'императоры')|E]."
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "А это [Concept('domicile', 'имение')|E] вашей [Concept('company', 'компании')|E] — место, откуда ведётся вся её деятельность.\n\nЗдесь вы можете тратить [Concept('gold', 'золото')|E] и [Concept('prestige', 'престиж')|E] на возведение [Concept('domicile_buildings', 'построек в имении')|E], которые помогут улучшить вашу компанию."
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "Это [Concept('company_purpose', 'специфика вашей компании')|E]. Она определяет её специализацию.\n\nПо умолчанию выбрана специализация «Торговец», но вы можете выбрать другое направление: [Concept('artifacts', 'артефакты')|E], предметы роскоши или выдачу займов."
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "Впрочем, даже став [Concept('merchant', 'торговцем')|E], вам придётся считаться с властью местных властителей."
 reactive_advice_merchant_introduction_open_patronage_prompt: "Откройте вкладку «$MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$» (выделено)"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "Это ваш [Concept('merchant_patron', 'покровитель')|E] — [Concept('ruler', 'правитель')|E] [Concept('holding', 'владения')|E], на территории которого располагается ваше [Concept('domicile', 'имение')|E].\n\nВы обязаны платить налоги своему покровителю, но эти отношения могут приносить и определённую выгоду.\n\nНапример, вы можете изменить [Concept('client_contract', 'клиентский договор')|E], чтобы попросить покровителя поддержать вашу торговлю или облегчить заключение [Concept('marriages', 'браков')|E] с дворянами."
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "Скорее всего, вы не единственный [Concept('merchant', 'торговец')|E]-[Concept('client', 'клиент')|E] вашего [Concept('merchant_patron', 'покровителя')|E].\n\nДругие клиенты также будут вести торговлю из того же места, что и вы, однако особую [Concept('charter', 'хартию')|E] сможет получить лишь один из клиентов. Она позволит расширить торговые возможности благодаря особым [Concept('decisions', 'решениям')|E]."
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "И, наконец, пора поговорить о самом главном — как зарабатывать деньги."
 reactive_advice_merchant_introduction_open_trade_prompt: "Откройте вкладку «Торговые пути» в окне «Торговля» (выделено)"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "Это ваши [Concept('trade_routes', 'торговые пути')|E] — основной источник [Concept('gold', 'золота')|E].\n\nПо мере развития вашей компании вы сможете открывать новые торговые пути большей протяжённостью и перевозить по ним больше [Concept('goods', 'товаров')|E]. Это позволит вам зарабатывать ещё больше золота."
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "Такова стезя [Concept('merchant', 'торговца')|E]: зарабатывайте [Concept('gold', 'золото')|E] благодаря своим [Concept('trade_routes', 'торговым путям')|E], а затем вкладывайте его в увеличение вашего [Concept('prestige', 'престижа')|E] и [Concept('company_size', 'размера компании')|E].\n\nКомпании, которыми владеют ответственные и организованные торговцы, в конечном счёте превзойдут компании даже самых богатых [Concept('rulers', 'правителей')|E]!"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "Направление компании"
 action_reactive_advice_company_direction: "Совет: $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "Со временем [Concept('company_direction', 'направление вашей компании')|E] может сместиться. Откройте этот урок, чтобы узнать об этом подробнее."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "Цели у [Concept('merchants', 'торговцев')|E] бывают разными. [Concept('gold', 'Золото')|E] — это власть, но некоторые ценят семью и знатное происхождение выше богатства."
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "[Concept('company_direction', 'Направление вашей компании')|E] — одна из составляющих вашего [Concept('house', 'дома')|E]. Давайте рассмотрим её подробнее."
 reactive_advice_company_direction_open_house_prompt: "Выберите ваш дом (выделено)"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "Перейдите во вкладку «[Concept('sentiment', 'Направление компании')|E]»."
 reactive_advice_company_direction_open_direction_tab_prompt: "Откройте вкладку «Направление компании» (выделено)"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "Это [Concept('company_direction', 'направление вашей компании')|E]. Изначально курс вашей компании находится в [Concept('company_sentiment_independent', 'балансе')|E], но со временем он может сместиться в сторону [Concept('company_sentiment_divided', 'ненасытности')|E] или [Concept('company_sentiment_concerted', 'благородства')|E].\n\nБраки с представителями [Concept('noble', 'знатных')|E] [Concept('houses', 'домов')|E] смещают курс вашей компании в сторону благородства, а браки с другими [Concept('merchants', 'торговцами')|E] — в сторону ненасытности."
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Поддержать строительство"
 action_reactive_advice_sponsor_construction: "Совет: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "Вы можете поддержать строительство [Concept('buildings', 'зданий')|E] во [Concept('holdings', 'владениях')|E] других [Concept('characters', 'персонажей')|E]. Откройте этот урок, чтобы узнать о том, как это сделать."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "Теперь вы можете поддержать улучшение [Concept('buildings', 'зданий')|E] во [Concept('holdings', 'владениях')|E] других [Concept('characters', 'персонажей')|E]."
 reactive_advice_sponsor_construction_select_holding_prompt: "Выберите владение на карте"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "А теперь выберите один из его [Concept('districts', 'районов')|E]."
 reactive_advice_sponsor_construction_open_district_prompt: "Выберите район (выделено)"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "Здесь вы можете поддержать строительство! Помните, однако, что вы можете лишь #EMP улучшать#! [Concept('buildings', 'здания')|E] и только в обычных [Concept('districts', 'районах')|E].\n\nОсновная цель подобной поддержки — увеличить [Concept('surplus', 'излишек')|E] или [Concept('need', 'потребность')|E] в определённом [Concept('trade_good', 'товаре')|E] на [Concept('market', 'рынке')|E] этого [Concept('holding_possessive', 'владения')|E]. Это позволит соединить рынок с одним из ваших [Concept('profit_routes', 'прибыльных маршрутов')|E] и увеличить доход в [Concept('gold', 'золоте')|E]."
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Республиканская политика"
 action_reactive_advice_republican_politics: "Совет: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "Вы — часть [Concept('republic', 'республики')|E]. Откройте этот урок, чтобы ознакомиться с тонкостями её политики."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "Как [Concept('house_head', 'глава дома')|E], вы являетесь частью добродетельной [Concept('republic', 'республики')|E]!\n\nА как глава [Concept('patrician_family', 'патрицианской семьи')|E], вы участвуете в управлении наравне с другими благородными домами — пусть и в рамках лишь отчасти демократической системы. При этом чтобы влиять на судьбу республики, необязательно быть её [Concept('ruler', 'правителем')|E], достаточно располагать [Concept('gold', 'золотом')|E] и влиянием."
 reactive_advice_republican_politics_intro_prompt: "Откройте вкладку «Обзор» в окне «Республика» (выделено)"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "Как и их граждане, не все [Concept('republics', 'республики')|E] равны. У каждой республики есть свой [Concept('title_tier', 'уровень титула')|E] и свой тип [Concept('republic_administration', 'администрации')|E]. Они показаны здесь.\n\nЧтобы повысить уровень титула республики и тем самым её могущество, [Concept('ruler', 'правитель')|E] может вложить [Concept('prestige', 'престиж')|E] и средства из [Concept('treasury', 'казны')|E].\n\nДействующий правитель может также изменить администрацию, тем самым задав новый общий курс республики."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "Раз уж речь зашла о [Concept('ruler', 'правителе')|E], то вот он!\n\nВ отличие от тирании, свойственной другим [Concept('governments', 'правительствам')|E], в [Concept('republic', 'республике')|E] правитель избирается и только на ограниченный срок.\n\nВпрочем, ничто не мешает тому же правителю переизбраться, так что нередко именно он считается главным претендентом на победу в выборах."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "Власть [Concept('ruler', 'правителя')|E] уравновешивается [Concept('assembly', 'собранием')|E]. Давайте рассмотрим его подробнее."
 reactive_advice_republican_politics_open_assembly_prompt: "Откройте вкладку «Собрание» (выделено)"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "Власть [Concept('ruler', 'правителя')|E] не безгранична: любые изменения [Concept('law', 'закона')|E] или [Concept('republic_decree_short', 'указа')|E] требуют одобрения [Concept('assembly', 'собрания')|E]. При этом члены собрания могут и сами предлагать изменения.\n\nЧленами собрания, как правило, являются представители [Concept('patrician_families', 'патрицианских семей')|E] [Concept('republic', 'республики')|E]. У них нет идеологии в современном понимании, но у каждой есть своя [Concept('house_ambition', 'амбиция дома')|E], которая определяет её позицию при голосовании.\n\nСтоит помнить, что республика не обязана следовать демократическим принципам, предполагающим плюрализм мнений и неизбежные разногласия. По мере принятия новых законов баланс власти между собранием и правителем может меняться."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "Поскольку [Concept('assembly', 'собрание')|E] обычно состоит из представителей [Concept('patrician_families', 'патрицианских семей')|E], давайте поговорим о них подробнее."
 reactive_advice_republican_politics_open_families_prompt: "Откройте вкладку «Семейства» (выделено)"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "Перед вами [Concept('patrician_families', 'патрицианские семьи')|E] [Concept('republic', 'республики')|E].\n\nУ каждой семьи, включая вашу, есть собственный [Concept('patrician_rating', 'ранг патриция')|E]. Ваш ранг повышается по мере роста доходов от [Concept('trade', 'торговли')|E], а также при получении мест в [Concept('assembly', 'собрании')|E] или [Concept('council', 'совете')|E] [Concept('ruler', 'правителя')|E].\n\nВысокий ранг патриция усиливает эффекты [Concept('house_ambition', 'амбиции дома')|E] и даже открывает возможность свергнуть правительство!"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "Судьба [Concept('republic', 'республики')|E] в ваших руках.\n\nИ вам решать, как будет устроено правление: сосредоточите ли вы власть в руках собственной семьи или разделите её с другими?\n\nПо мере роста доходов от ваших [Concept('trade_routes', 'торговых путей')|E] повышается и ваш [Concept('patrician_rating', 'ранг патриция')|E], а вместе с ним — ваша власть и влияние."
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "Здесь вы можете создавать собственные [Concept('distribution_routes', 'маршруты распределения')|E].\n\nМаршруты распределения позволяют вам перевозить [Concept('trade_goods', 'товары')|E] для удовлетворения [Concept('needs', 'потребностей')|E] на [Concept('markets', 'рынках')|E], расположенных в пределах вашей [Concept('realm', 'державы')|E]."
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "[Concept('distribution_route', 'Маршрут распределения')|E] может перевозить [Concept('trade_goods', 'товары')|E] в любом количестве, однако для перевозки доступны только товары, считающиеся [Concept('basic_trade_goods', 'основными')|E]. Они представлены здесь.\n\nПоэтому вам не нужно выбирать, какой именно товар перевозить.\n\n#I Вы можете выбрать любой основной товар, чтобы увидеть его [Concept('market_balance', 'рыночный баланс')|E] на карте#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "На карте под названием каждого [Concept('market', 'рынка')|E] отображаются [Concept('basic_trade_goods', 'основные товары')|E], имеющиеся в [Concept('surplus', 'излишке')|E]. Это означает, что их можно перемещать с этого рынка в другие места."
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "Аналогичным образом здесь отображаются неудовлетворённые [Concept('needs', 'потребности')|E]. Это означает, что на этот [Concept('market', 'рынок')|E] можно перемещать [Concept('basic_trade_goods', 'основные товары')|E]."
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "[Concept('distribution_route', 'Маршрут распределения')|E] может связывать не более двух [Concept('markets', 'рынков')|E], при этом [Concept('goods', 'товары')|E] по нему перевозятся в обоих направлениях.\n\nКогда вы добавите к маршруту два рынка, в выделенном окне можно будет увидеть, как удовлетворяются [Concept('needs', 'потребности')|E].\n\nПоскольку маршрут проходит через вашу [Concept('realm', 'державу')|E], вам не нужно платить ни [Concept('buy_price', 'цену покупки')|E], ни [Concept('tolls', 'сборы')|E].\n\n#I Чтобы добавить рынок к маршруту или удалить его из маршрута, щёлкните по нему на карте#!"
