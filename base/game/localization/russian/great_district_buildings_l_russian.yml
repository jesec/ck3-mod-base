 building_type_republic_civic_hospital_01: "Светская больница"
 building_type_republic_civic_hospital_01_desc: "Больничные палаты содержатся на средства общины и укомплектованы за её счёт. Здесь принимают заболевших вместо того чтобы бросать их умирать на улице. Ведь здоровый гражданин приносит пользу городу."
 republic_civic_hospital_01: "Светская больница"
