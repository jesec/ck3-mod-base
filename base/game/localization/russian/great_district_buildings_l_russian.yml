 building_type_republic_weigh_house_01: "Общественная палата мер и весов"
 building_type_republic_weigh_house_01_desc: "Городские весы и меры с официальными печатями хранятся под замком, а присягнувшие на верность чиновники следят за их точностью. Каждый товар взвешивают за установленную плату, и ни один купец не вправе оспорить результат."
 republic_weigh_house_01: "Общественная палата мер и весов"
