 building_type_republic_civic_ward_01: "Административная палата"
 building_type_republic_civic_ward_01_desc: "Это ведомство надзирает за городскими стройками: закупает материалы, оформляет разрешения и ведёт документацию. Оно следит, чтобы все работы шли по графику и не выходили за рамки бюджета."
