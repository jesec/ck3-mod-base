 building_type_republic_league_chapter_house_01: "Дом собраний лиги"
 building_type_republic_league_chapter_house_01_desc: "Здесь находятся покои для послов из союзных городов, надёжное хранилище и зал для переговоров. Когда лига собирает совет, её делегаты встречаются здесь, а заключённые соглашения связывают гавани, разделённые тысячами километров."
