 republic_loggia_04: "$republic_loggia_01$ IV"
 republic_loggia_05: "$republic_loggia_01$ V"
 building_type_republic_statute_hall_01: "Законодательная палата"
 building_type_republic_statute_hall_01_desc: "Здесь хранят и переписывают законы общины, и каждый год зачитывают их вслух. Ни один магистрат не сможет сослаться на незнание закона, а ни один горожанин — заявить, что его не предупредили."
 republic_statute_hall_01: "Законодательная палата"
