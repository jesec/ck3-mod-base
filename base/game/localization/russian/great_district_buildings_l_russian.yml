 building_type_republic_podesta_residence_01: "Резиденция подесты"
 building_type_republic_podesta_residence_01_desc: "Подеста — оплачиваемый магистрат, приглашённый из другого города на строго определённый срок. Он живёт за общественный счёт и не имеет права владеть здесь собственностью. Чуждый местным родственным связям, он не тяготеет ни к одной из сторон в спорах."
