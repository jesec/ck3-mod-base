 building_type_republic_council_chamber_01: "Большая палата совета"
 building_type_republic_council_chamber_01_desc: "Здесь хватает скамей для всех полноправных граждан, внесённых в городские списки. Советники спорят о налоговых ведомостях, утверждают годовые бюджеты и тянут жребий, распределяя городские должности."
 republic_council_chamber_01: "Большая палата совета"
