 building_type_republic_basilica_01: "Величественная базилика"
 building_type_republic_basilica_01_desc: "Величественная базилика — центр религиозной жизни города. Но управляет ею не духовенство, а городские власти. Больше всех от этого выигрывают богатые патрицианские семьи, вложившие средства в её строительство."
