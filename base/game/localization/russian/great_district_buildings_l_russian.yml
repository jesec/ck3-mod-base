 building_type_republic_debt_office_01: "Служба государственного долга"
 building_type_republic_debt_office_01_desc: "Город занимает деньги у собственных граждан и платит им за это проценты. Долговые доли свободно переходят из рук в руки, как любой другой товар. Вырученные средства поддерживают казну на плаву и позволяют вовремя платить наёмным отрядам."
 republic_debt_office_01: "Служба государственного долга"
