 ##### Great Plaza District Buildings #####
 republic_great_plaza_district: "Район большой торговой площади"
 republic_great_plaza_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$@government_type_republic![republic_government|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[civic_tax_i][civic_tax_short|E] и [urban_tax_i][urban_tax|El]"
 republic_great_plaza_district_desc_flavor: "Место, где республика устраивает работу своего правительства и управляет городскими делами."
 republic_great_plaza_district_rome_name: "Римский форум"
 building_type_pb_republic_city_hall_01: "$republic_great_plaza_district$"
 building_type_pb_republic_city_hall_01_desc: "Ратуша — центр городского управления. Здесь мэр и другие чиновники собираются, чтобы обсуждать дела города и принимать решения."
 pb_republic_city_hall_01: "Ратуша"
