 building_type_republic_loggia_01: "Общественная галерея"
 building_type_republic_loggia_01_desc: "Крытая галерея с аркадами тянется вдоль площади. В её тени купцы заключают сделки, нотариусы устраивают свои столы между колоннами, а в дождливую погоду здесь укрывается чуть ли не весь город."
 republic_loggia_01: "Общественная галерея"
