 building_type_republic_clock_tower_01: "Башня с часами"
 building_type_republic_clock_tower_01_desc: "Механическое чудо возвышается над крышами и отбивает каждый час. Община с гордостью показывает его приезжим, а распорядок купцов отныне зависит не от солнца, а от городских властей."
