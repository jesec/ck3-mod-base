 survey_office_05: "$building_type_survey_office_01$ V"
 building_type_verderers_hall_01: "Палата лесников"
 building_type_verderers_hall_01_desc: "В палате лесничих правосудие вершится по особым лесным законам. Здесь свои суды и свои служители, а без разрешения нельзя даже собирать хворост."
 verderers_hall_01: "$building_type_verderers_hall_01$"
 verderers_hall_02: "$building_type_verderers_hall_01$ II"
