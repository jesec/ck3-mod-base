 ducal_chase_02: "$building_type_ducal_chase_01$ II"
 ducal_chase_03: "$building_type_ducal_chase_01$ III"
 ducal_chase_04: "$building_type_ducal_chase_01$ IV"
 ducal_chase_05: "$building_type_ducal_chase_01$ V"
 royal_chase_01: "Монаршие угодья"
 royal_chase_02: "$royal_chase_01$ II"
 royal_chase_03: "$royal_chase_01$ III"
 royal_chase_04: "$royal_chase_01$ IV"
 royal_chase_05: "$royal_chase_01$ V"
 building_type_courts_of_commons_01: "Суды простолюдинов"
 building_type_courts_of_commons_01_desc: "Простолюдины решают здесь свои споры без участия правителя. Это не стоит казне ни гроша и не даёт мелким обидам перерасти в серьёзные распри."
 courts_of_commons_01: "$building_type_courts_of_commons_01$"
