 ### Staple District ###
 building_type_staple_district_01: "Герцогский склад"
 building_type_staple_district_01_desc: "Каждый тюк товара, проданный на этом герцогском складе, взвешивают и опечатывают. Любые товары без герцогской печати, обнаруженные в других областях герцогства, немедленно конфискуют."
 staple_district_01: "$building_type_staple_district_01$"
 staple_district_02: "$building_type_staple_district_01$ II"
 staple_district_03: "$building_type_staple_district_01$ III"
 staple_district_04: "$building_type_staple_district_01$ IV"
 building_type_staple_court_01: "Торговый суд"
 building_type_staple_court_01_desc: "Купцы обращаются в этот суд, чтобы уладить споры о долгах, договорах и грузах. Здешние судьи разбираются в торговом деле и потому выносят решения без лишних проволочек."
 staple_court_01: "$building_type_staple_court_01$"
 staple_court_02: "$building_type_staple_court_01$ II"
