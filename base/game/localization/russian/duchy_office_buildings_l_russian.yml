 building_type_admiralty_court_01_desc: "По законам, которые вершит адмиралтейский суд, груз с потерпевшего крушение корабля по-прежнему принадлежит его владельцу, если хотя бы одно живое существо, пусть даже кошка, спаслось с тонущего судна."
 admiralty_court_01: "$building_type_admiralty_court_01$"
 admiralty_court_02: "$building_type_admiralty_court_01$ II"
