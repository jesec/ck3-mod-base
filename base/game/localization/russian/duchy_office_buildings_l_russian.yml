 staple_court_04: "$building_type_staple_court_01$ IV"
 staple_court_05: "$building_type_staple_court_01$ V"
 building_type_court_of_the_towns_01: "Городской суд"
 building_type_court_of_the_towns_01_desc: "Каждый город направляет в этот суд своих представителей. Они привозят запечатанное письмо, в котором чётко указано, на какие условия им дозволено согласиться, и отступать от них нельзя."
 court_of_the_towns_01: "$building_type_court_of_the_towns_01$"
 court_of_the_towns_02: "$building_type_court_of_the_towns_01$ II"
 court_of_the_towns_03: "$building_type_court_of_the_towns_01$ III"
 court_of_the_towns_04: "$building_type_court_of_the_towns_01$ IV"
 court_of_the_towns_05: "$building_type_court_of_the_towns_01$ V"
 court_of_the_towns_republic_effect_desc: "Поскольку у вас [Concept('republic', 'республика')|E], [Concept('councillor_tasks', 'задания')|E] вашего [Concept('steward', 'управляющего')|E] получают #P +4%#! к эффективности за каждый уровень:\n$BULLET_WITH_TAB$[GetCouncilTaskType('task_republic_trade_logistics').GetName]\n$BULLET_WITH_TAB$[GetCouncilTaskType('task_republic_market_oversight').GetName]"
 building_type_alnagers_office_01: "Канцелярия алнажера"
 building_type_alnagers_office_01_desc: "Сукно, не прошедшее проверку в этой канцелярии, конфискуют. Порой его даже сжигают на рыночной площади, чтобы это увидели все."
 alnagers_office_01: "$building_type_alnagers_office_01$"
 alnagers_office_02: "$building_type_alnagers_office_01$ II"
 alnagers_office_03: "$building_type_alnagers_office_01$ III"
 alnagers_office_04: "$building_type_alnagers_office_01$ IV"
 alnagers_office_05: "$building_type_alnagers_office_01$ V"
