 verderers_hall_05: "$building_type_verderers_hall_01$ V"
 building_type_colonization_office_01: "Канцелярия по делам переселенцев"
 building_type_colonization_office_01_desc: "Здесь переселенцы могут получить участок необработанной земли, семена на первый год и освобождение от податей на несколько лет, пока не обживутся."
