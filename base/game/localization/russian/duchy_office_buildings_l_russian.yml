 building_type_grain_exchange_01: "Зерновая биржа"
 building_type_grain_exchange_01_desc: "Каждую меру для зерна на этой бирже сверяют с официальным образцом, который хранится под замком в здании биржи. Купцов, уличённых в использовании уменьшенной меры, штрафуют на месте."
