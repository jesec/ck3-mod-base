 ### Bailiwick District ###
 building_type_bailiwick_01: "Зал суда"
 building_type_bailiwick_01_desc: "Все разбирательства в этом суде записывают в судебные книги. Благодаря им пристав может положить конец спору из-за поля, просто огласив решение, вынесенное десятилетия назад."
 bailiwick_01: "$building_type_bailiwick_01$"
 bailiwick_02: "$building_type_bailiwick_01$ II"
 bailiwick_03: "$building_type_bailiwick_01$ III"
 bailiwick_04: "$building_type_bailiwick_01$ IV"
 building_type_survey_office_01: "Межевальная палата"
 building_type_survey_office_01_desc: "Землемеры из этой палаты обходят поля герцогства с верёвками и шестами, измеряя каждый надел. Так можно определить, сколько урожая приносит земля, и обложить её справедливым налогом."
 survey_office_01: "$building_type_survey_office_01$"
