 colonization_office_04: "$building_type_colonization_office_01$ IV"
 colonization_office_05: "$building_type_colonization_office_01$ V"
 building_type_ducal_chase_01: "Герцогские угодья"
 building_type_ducal_chase_01_desc: "Эти герцогские охотничьи угодья предназначены для развлечения знати. В лесах и на лугах водятся олени и кабаны, на которых правитель и его гости могут охотиться в своё удовольствие."
