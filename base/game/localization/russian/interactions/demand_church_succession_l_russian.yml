l_russian:
 demand_church_succession_interaction: "Потребовать церковное наследование"
 demand_church_succession_religious_head_interaction: "Издать указ о церковном наследовании"
 demand_church_succession_interaction_desc: "Если [recipient.GetTitledFirstName] покинет сей бренный мир без законного наследника, земли, которыми [Select_CString(recipient.IsFemale, 'она', 'он')] владеет, перейдут владетелю титула [actor.GetPrimaryTitle.GetName] как [Concept('fallback_heir', 'резервному наследнику')|E]."
 demand_church_succession_religious_head_interaction_desc: "Воспользоваться властью [Concept('head_of_faith', 'главы')|E] #L [actor.GetFaith.GetName|l]ой#! [Concept('faith', 'конфессии')|E] и распорядиться, что держава, которой правит [recipient.GetTitledFirstName], в случае, если [Select_CString(recipient.IsFemale, 'она', 'он')] умрёт, не оставив наследника, отойдёт титулу [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_target_in_reach: "[Concept('realm', 'Держава')|E], которой [Select_CString(recipient.IsLocalPlayer, 'правите', 'правит')] [recipient.GetShortUIName], не граничит с [Concept('realm', 'державой')|E], которой [Select_CString(actor.IsLocalPlayer, 'правите', 'правит')] [actor.GetShortUIName], и не входит в [Select_CString(actor.IsLocalPlayer, 'ваш', Select_CString(actor.IsFemale, 'её', 'его'))] [Concept('archdiocese', 'архидиоцез')|E]"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName] уже [Select_CString(recipient.IsFemale, 'пообещала', 'пообещал')], что [Select_CString(recipient.IsFemale, 'ей', 'ему')] будет наследовать другой священник как [Concept('fallback_heir', 'резервный наследник')|E]"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName] владеет своим [Concept('primary_title', 'первым титулом')|E] на условиях [Concept('elective_succession', 'выборного')|E] или [Concept('advanced_succession', 'расширенного наследования')|E]"
 demand_church_succession_recently_refused_tt: "[recipient.GetTitledFirstName] недавно [Select_CString(recipient.IsFemale, 'отвергла', 'отверг' )] требование перейти на церковное наследование, в течение 10 лет от [Select_CString(recipient.IsFemale, 'неё', 'него' )] нельзя потребовать этого снова"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Потребовать церковное наследование"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.GetTitledFirstName] требует, чтобы в случае, если [recipient.GetTitledFirstName] умрёт без наследника, [Select_CString(recipient.IsFemale, 'её', 'его')] держава отошла титулу [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale, 'неотделима', 'неотделим')] от [Concept('faith', 'конфессии')|E]"
 demand_church_succession_actor_toast_desc: "Если [Select_CString(recipient.IsFemale, 'она', 'он')] умрёт без наследника, [actor.GetPrimaryTitle.GetName] унаследует [Select_CString(recipient.IsFemale, 'её', 'его')] державу."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName] [Select_CString(puppet_or_actor.IsLocalPlayer, 'привязали', Select_CString(puppet_or_actor.IsFemale, 'привязала', 'привязал'))] персонажа [recipient.GetTitledFirstName] к [Concept('faith', 'вере')|E]"
 demand_church_succession_actor_toast_desc_puppeteer: "Если [Select_CString(recipient.IsFemale, 'она', 'он')] умрёт без наследника, [puppet_or_actor.GetPrimaryTitle.GetName] унаследует [Select_CString(recipient.IsFemale, 'её', 'его')] державу."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "По милости [actor.GetFaith.HighGodNamePossessive] Мы пишем вам по вопросу наследования."
 demand_church_succession.0001.desc.archbishop: "Из своего архидиоцеза, опекающего ваши земли, я пишу по вопросу наследования."
 demand_church_succession.0001.desc.bishop: "Ваш пастырь пишет вам по вопросу наследования."
 demand_church_succession.0001.desc.head_of_faith_generic: "Как [actor.GetTitleAsNameNoTooltip|l] веры, я пишу вам по вопросу наследования."
 demand_church_succession.0001.desc.theocrat_generic: "От алтаря [actor.GetFaith.HighGodNamePossessive] пишу я вам по вопросу наследования."
 demand_church_succession.0001.flavour.zealous: "\n\nНе поймите превратно:"
 demand_church_succession.0001.flavour.ambitious: "\n\nБудем честны:"
 demand_church_succession.0001.flavour.deceitful: "\n\nНесомненно, вы будете жить спокойно, узнав:"
 demand_church_succession.0001.flavour.greedy: "\n\nСкажу прямо:"
 demand_church_succession.0001.flavour.compassionate: "\n\nПростите мою настойчивость, [recipient.GetTitledFirstName], но"
 demand_church_succession.0001.flavour.default: "\n\nПозвольте мне сказать прямо:"
 demand_church_succession.0001.recipient.elderly_childless: "колыбель у вашего очага пустует, вы последний представитель своего рода. Верные подождут и, со временем, унаследуют."
 demand_church_succession.0001.recipient.childless: "у вас нет живых детей. Если [actor.GetFaith.HighGodName] ничего не изменит, ваши земли послужат вере."
 demand_church_succession.0001.recipient.one_child: "единственное дитя стоит между вами и концом. Если [actor.GetFaith.HighGodName] приберёт его, верующие возьмут бразды правления."
 demand_church_succession.0001.recipient.default: "время не щадит никого. В случае, если с вами что-то произойдёт, ваши земли перейдут нам и будут управляться во имя [actor.GetFaith.HighGodNamePossessive]."
 demand_church_succession.0001.a: "Так написано. И так будет."
 demand_church_succession.0001.b: "Тогда стоит обзавестись наследником."
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip] [Select_CString(actor.IsFemale, 'перешла', 'перешёл')] черту."
 demand_church_succession.0001.c.tt: "Вы отметаете договорённость о [Concept('fallback_heir_title', 'титуле резервного наследника')|E]. В течение десяти лет от вас не смогут снова потребовать перейти на церковное наследование, но [actor.GetTitledFirstName] не скоро забудет это оскорбление"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "Ваши требования прочитаны и отклонены. Мои земли никогда не отойдут церкви. Следите за своим алтарём, [actor.GetTitledFirstName], а я присмотрю за своими землями."
 demand_church_succession.0002.a: "Я не забуду вашего нахальства."
 demand_church_succession_fertility_modifier: "Стремление зачать наследника"
 demand_church_succession_fertility_modifier_desc: "Этот персонаж вознамерился не дать церкви прибрать к рукам свои земли и удвоил свои усилия на брачном ложе."
 defied_church_succession_opinion: "Отклонили мои притязания на наследование"
 meddling_church_opinion: "Вмешательство в моё наследование"
