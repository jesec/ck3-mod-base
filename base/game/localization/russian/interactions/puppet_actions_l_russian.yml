l_russian:
 puppet_excommunicate_interaction: "#D Excommunicate via your Puppet#!"
 actor_secondary_puppet_excommunicate_interaction: "$theological_agent_puppet$"
 theological_agent_puppet: "Державный священник — марионетка"
 theological_agent_puppet_desc: "[Concept('puppet', 'Марионеточный')|E] [Concept('realm_priest', 'державный священник')|E] выступает в роли вашего голоса в церкви, позволяя вам голосовать на [Concept('ecumenical_councils', 'вселенских соборах')|E] и создавать [Concept('rites', 'течения')|E]."
 puppet_type_no_candidates: "У вас нет доступных [Concept('puppets', 'марионеток')|E] типа «[PuppetType.GetName|V]»"
 puppet_action_description_puppet_action_give_gift: "Использовать [Concept('interaction', 'взаимодействие')|E] «#V [GetPlayer.GetPlayerInteractionName('gift_interaction')]#!», чтобы обменять [Concept('gold', 'золото')|E] на [Concept('opinion', 'мнение')|E] другого [Concept('character', 'персонажа')|E]"
 puppet_action_description_puppet_action_ask_excommunicate_character: "Использовать [Concept('interaction', 'взаимодействие')|E] «#V [GetPlayer.GetPlayerInteractionName('request_excommunication_interaction')]#!», чтобы убедить [Concept('head_of_faith', 'главу конфессии')|E] [Concept('excommunicate', 'отлучить')|E] [Concept('character', 'персонажа')|E]-грешника"
 puppet_action_description_puppet_trigger_can_create_faith: "Создать новую [Concept('faith', 'конфессию')|E]"
 puppet_action_description_puppet_trigger_can_create_rite: "Создать новое [Concept('rite', 'течение')|E]"
 puppet_action_description_puppet_action_command_murder: "Использовать [Concept('interaction', 'взаимодействие')|E] «#V [GetPlayer.GetPlayerInteractionName('start_murder_interaction')]#!» в отношении выбранного [Concept('character', 'персонажа')|E]"
 puppet_action_description_puppet_action_request_elevation: "Использовать [Concept('interaction', 'взаимодействие')|E] «#V [GetPlayer.GetPlayerInteractionName('request_elevation_interaction')]#!», чтобы попросить [Concept('head_of_faith', 'главу конфессии')|E] о более престижном [Concept('clerical_title', 'церковном титуле')|E]"
 request_clerical_region_title_cannot_request_hof_see_tt: "Нельзя запросить [Concept('clerical_title', 'церковный титул')|E], которым владеет [Concept('head_of_faith', 'глава конфессии')|E]"
 request_clerical_region_title_capital_region_tt: "Ваша [Concept('capital', 'столица')|E] должна находиться в [Concept('clerical_region', 'церковном округе')|E], который вы запрашиваете"
 higher_piety_level_than_hof: "[Concept('piety_level', 'Уровень набожности')|E] выше, чем у [Concept('head_of_faith_possessive', 'главы конфессии')|E]"
 lower_piety_level_than_hof: "[Concept('piety_level', 'Уровень набожности')|E] ниже, чем у [Concept('head_of_faith_possessive', 'главы конфессии')|E]"
 is_puppet_action_valid_first: "Вы обладаете [Concept('puppet', 'марионеткой')|E], которая позволяет: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 is_puppet_action_valid_third: "[CHARACTER.GetShortUIName|U] обладает [Concept('puppet', 'марионеткой')|E], которая позволяет: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 is_puppet_action_valid_global: "Обладает [Concept('puppet', 'марионеткой')|E], которая позволяет: [PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]"
 not_is_puppet_action_valid_first: "Вы #bold не#! обладаете [Concept('puppet', 'марионеткой')|E], которая позволяет: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 not_is_puppet_action_valid_third: "[CHARACTER.GetShortUIName|U] #bold не#! обладает [Concept('puppet', 'марионеткой')|E], которая позволяет: [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 not_is_puppet_action_valid_global: "#bold Не#! обладает [Concept('puppet', 'марионеткой')|E], которая позволяет: [PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]"
 request_elevation_interaction: "Попросить о возвышении"
 request_elevation_interaction_desc: "Обратиться к [Concept('head_of_faith', 'главе конфессии')|E] с просьбой получить свободный или удерживаемый одним из [Concept('superior', 'вышестоящих')|E] [Concept('clerical_title', 'церковный титул')|E] в вашем [Concept('clerical_region', 'церковном округе')|E]"
 request_elevation_interaction_notification: "[target.GetNameNoTier] нуждается в достойном пастыре. Даруйте эту должность мне, и я наставлю паству на путь истинный."
 request_elevation_cannot_unseat_player_tt: "Нельзя сместить [Concept('holder', 'владетеля')|E] [Concept('clerical_title', 'церковного титула')|E], которым правит другой игрок"
 request_elevation_interaction_toast_title: "Возвышение!"
 request_elevation_interaction_toast_title_puppeteer: "[puppet_or_actor.GetShortUIName] [Select_CString(puppet_or_actor.IsLocalPlayer, 'возвысились', Select_CString(puppet_or_actor.IsFemale, 'возвысилась', 'возвысился'))]!"
 request_ecclesiastical_title_expansion_interaction: "Попросить о расширении церковного титула"
 request_ecclesiastical_title_expansion_interaction_desc: "Попросить [Concept('head_of_faith', 'главу конфессии')|E] включить соседнее [Concept('duchy', 'герцогство')|E] в ваш [Concept('clerical_region', 'церковный округ')|E]\n\nВсе [Concept('de_jure', 'де-юре')|E] графства выбранного [Concept('duchy', 'герцогства')|E] войдут в ваш [Concept('clerical_region', 'церковный округ')|E]"
 request_ecclesiastical_title_expansion_interaction_notification: "Верующим из земли [target.GetNameNoTier] не хватает духовного лидера. Эти земли должны стать частью моего архидиоцеза к вящей славе [actor.GetFaith.HighGodNamePossessive]."
 request_ecclesiastical_title_expansion_accepted_tt: "Церковный титул расширен"
 recipient_secondary_request_ecclesiastical_title_expansion_interaction: "Владетель"
 puppet_action_description_puppet_action_request_ecclesiastical_title_expansion: "Использовать [Concept('interaction', 'взаимодействие')|E] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_expansion_interaction')]#!, чтобы попросить [Concept('head_of_faith', 'главу конфессии')|E] включить соседнее [Concept('duchy', 'герцогство')|E] в ваш [Concept('clerical_region', 'церковный округ')|E]"
 request_ecclesiastical_title_merger_interaction: "Попросить о слиянии церковных титулов"
 request_ecclesiastical_title_merger_interaction_desc: "Попросить [Concept('head_of_faith', 'главу конфессии')|E] разрешить поглощение вашим [Concept('capital_possessive', 'столичным')|E] [Concept('clerical_region_possessive', 'церковным округом')|E] соседнего"
 request_ecclesiastical_title_merger_interaction_notification: "Паства из земли [target.GetNameNoTier] сбивается с пути и нуждается в твёрдой руке, тогда как моя паства процветает. Передайте мне эту епархию, ведь один верный пастырь позаботится о пастве лучше."
 request_ecclesiastical_title_merger_accepted_tt: "Слияние церковных титулов"
 request_ecclesiastical_title_merger_absorbed_tt: "Церковный титул потерян"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "Нет подходящих [Concept('clerical_region', 'церковных округов')|E] — ваш [Concept('clerical_region', 'церковный округ')|E] должен граничить хотя бы с одним [Concept('clerical_region', 'округом')|E] той же конфессии"
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "Использовать [Concept('interaction', 'взаимодействие')|E] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#!, чтобы попросить [Concept('head_of_faith', 'главу конфессии')|E] объединить соседний [Concept('clerical_region', 'церковный округ')|E] с вашим"
 rival_ecclesiastical_title_merged: "[CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsLocalPlayer, 'поглотили', Select_CString(CHARACTER.IsFemale, 'поглотила', 'поглотили' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'ваш ', '')][Concept('clerical_title', 'церковный титул')|E][Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', Concatenate(' персонажа ',TARGET_CHARACTER.GetShortUIName))]."
 request_ecclesiastical_title_creation_interaction: "Попросить о создании церковного титула"
 request_ecclesiastical_title_creation_interaction_desc: "Обратиться к [Concept('head_of_faith', 'главе конфессии')|E] с просьбой создать новый [Concept('clerical_title', 'церковный титул')|E] в вашей [Concept('realm', 'державе')|E]\n\nВы сами выбираете [Concept('title', 'титул')|E], которому он будет принадлежать, и его первого [Concept('holder', 'владетеля')|E]\n\n#weak Новый [Concept('clerical_region', 'церковный округ')|E] охватит все [Concept('de_jure', 'де-юре')|E] [Concept('county', 'графства')|E] [Concept('de_jure', 'де-юре')|E] [Concept('kingdom', 'королевства')|E], к которому относится этот титул, если они ещё не входят в состав другого [Concept('clerical_region', 'церковного округа')|E]#!"
 request_ecclesiastical_title_creation_interaction_notification: "Верующие в моих землях получают наставления издалека от чужаков, которые их не знают. Разрешите создать новую кафедру там, где я укажу, и она ни в чём не будет нуждаться."
 request_ecclesiastical_title_creation_accepted_tt: "Создаётся [new_title.GetNameNoTooltip]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "У вас нет [Concept('title', 'титула')|E] уровня [Concept('duchy', 'герцогства')|E] или выше, в [Concept('de_jure', 'де-юре')|E] [Concept('capital', 'столице')|E] которого можно было бы создать [Concept('clerical_region', 'церковный округ')|E]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "У персонажа [puppet_or_actor.GetShortUINameNoTooltip] нет [Concept('title', 'титула')|E] уровня [Concept('duchy', 'герцогства')|E] или выше, в [Concept('de_jure', 'де-юре')|E] [Concept('capital', 'столице')|E] которого можно было бы создать [Concept('clerical_region', 'церковный округ')|E]"
 pam_new_clerical_region_invalid_anchor_tt: "[Concept('de_jure', 'Де-юре')|E] [Concept('capital', 'столица')|E] этого [Concept('title', 'титула')|E] должна следовать [Concept('faith', 'конфессии')|E] просящего, а также находиться в его [Concept('realm', 'державе')|E] и не в другом [Concept('clerical_region', 'церковном округе')|E]"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "Нужен кандидат из [Concept('clergy', 'духовенства')|E], у которого ещё нет [Concept('clerical_region', 'церковного округа')|E]"
 recipient_secondary_request_ecclesiastical_title_creation_interaction: "Владетель"
 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "Использовать [Concept('interaction', 'взаимодействие')|E] «#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#!», чтобы обратиться к [Concept('head_of_faith', 'главе конфессии')|E] с просьбой об основании нового [Concept('title', 'титула')|E] [Concept('clerical_region', 'церковного округа')|E] в [Concept('title', 'титуле')|E] на ваш выбор"
 request_create_new_ecclesiastical_title_effect_tt: "Создан новый [Concept('clerical_title', 'церковный титул')|E] в [Concept('de_jure', 'де-юре')|E] [Concept('capital', 'столице')|E] королевства [target_kingdom.GetName]. Он включает все [Concept('de_jure', 'де-юре')|E] [Concept('county', 'графства')|E] этого [Concept('de_jure', 'де-юре')|E] [Concept('kingdom', 'королевства')|E], которые ещё не состоят в [Concept('clerical_region', 'церковном округе')|E], и передан [Select_CString(new_ecclesiastical_holder.IsLocalPlayer, 'вам', Concatenate('персонажу ', new_ecclesiastical_holder.GetShortUIName))]"
 request_ecclesiastical_title_split_interaction: "Попросить о разделении церковного титула"
 request_ecclesiastical_title_split_interaction_desc: "Попросить [Concept('head_of_faith', 'главу конфессии')|E] выделить новый церковный [Concept('title', 'титул')|E] из существующего [Concept('clerical_region', 'церковного округа')|E]\n\nЕсли вы светский [Concept('ruler', 'правитель')|E], титул будет основан в вашей [Concept('capital', 'столице')|E] и передан выбранному вами [Concept('holder', 'владетелю')|E]; если вы церковный землевладелец, вы будете назначены первым [Concept('holder', 'владетелем')|E] титула\n\n#weak Разделение соответствует границам держав: новый [Concept('title', 'титул')|E] охватывает [Concept('counties', 'графства')|E] в пределах этого [Concept('clerical_region', 'церковного округа')|E], принадлежащие вам (или, если вы часть духовенства, вашему [Concept('liege', 'сюзерену')|E]), поэтому более крупная [Concept('realm', 'держава')|E] получит больше#!"
 request_ecclesiastical_title_split_interaction_notification: "Ни один пастырь не может присматривать за такой большой паствой. Нужно создать новую кафедру на этих землях, и ни одна душа на этих землях не останется без присмотра."
 clerical_title_split_tt: "Из [Concept('clerical_region', 'церковного округа')|E], которым управляет [puppet_superior.GetName], и [Concept('realm', 'державы')|E], которой правит [puppet_liege.GetTitledFirstName], будет выделен новый церковный титул, и [new_ecclesiastical_holder.GetName] станет его первым [Concept('holder', 'владетелем')|E]"
 request_ecclesiastical_title_split_effect_tt: "Из округа [split_source_clerical_region.GetName] выделяется новый [Concept('clerical_title', 'церковный титул')|E], охватывающий [Concept('realm', 'державу')|E], которой правит [puppet_or_actor.GetTitledFirstName], и новым владетелем этого титула [Select_CString(new_ecclesiastical_holder.IsLocalPlayer, 'станете', 'станет')] [new_ecclesiastical_holder.GetShortUIName]"
 request_ecclesiastical_title_split_accepted_tt: "Отделён церковный титул"
 request_ecclesiastical_title_split_lost_tt: "Церковный округ урезан"
 actor_secondary_request_ecclesiastical_title_split_interaction: "Новый владетель"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "Текущий владетель"
 pam_split_no_region_to_split_tt: "В вашей [Concept('realm', 'державе')|E] должна быть часть [Concept('clerical_region', 'церковного округа')|E], которую можно отделить"
 pam_split_no_region_to_split_tt_puppeteer: "В [Concept('realm', 'державе')|E] персонажа [puppet_or_actor.GetShortUINameNoTooltip] должна быть часть [Concept('clerical_region', 'церковного округа')|E], которую можно отделить"
 pam_split_capital_is_region_seat_tt: "[Select_CString(puppet_or_actor.IsLocalPlayer, 'Ваша ', '')][Concept('capital', Select_CString(puppet_or_actor.IsLocalPlayer, 'столица', 'Столица'))|E][Select_CString(puppet_or_actor.IsLocalPlayer, '', Concatenate(' персонажа ', puppet_or_actor.GetShortUIName))] не может быть [Concept('clerical_region_capital', 'столицей церкового округа')|E] в разделяемом [Concept('clerical_region', 'округе')|E]"
 pam_split_no_eligible_holder_tt: "Требуется подходящий [Concept('holder', 'владетель')|E] для нового [Concept('clerical_title', 'церковного титула')|E]"
 pam_split_too_small_tt: "Новый [Concept('clerical_region', 'церковный округ')|E] будет слишком маленьким — он должен включать в себя хотя бы #V 3#! [Concept('counties', 'графства')|E]"
 pam_split_liege_capital_is_region_seat_tt: "[Concept('capital', 'Столица')|E] вашего [Concept('liege', 'сюзерена')|E] не может быть [Concept('clerical_region_capital', 'столицей церковного округа')|E] в разделяемом [Concept('clerical_region', 'округе')|E]"
 pam_split_larger_than_superior_tt: "Новый [Concept('clerical_region', 'церковный округ')|E] не может быть больше, чем часть, принадлежащая нынешнему [Concept('holder', 'владетелю')|E]"
 pam_split_region_is_religious_head_seat_tt: "Разделяемый [Concept('clerical_region', 'церковный округ')|E] не может быть кафедрой [Concept('head_of_faith', 'главы конфессии')|E] или [Concept('head_of_rite', 'лидера течения')|E]"
 request_clerical_elector_title_interaction: "Попросить кафедру"
 request_clerical_elector_title_interaction_desc: "Обратиться к [Concept('head_of_faith', 'главе конфессии')|E] с просьбой назначить вас [Concept('cardinal', 'кардиналом')|E]. Ваш [Concept('head_of_faith', 'глава конфессии')|E] станет вашим [Concept('superior', 'вышестоящим')|E] иерархом"
 request_clerical_elector_title_interaction_notification: "Я словом и делом поддерживаю веру и прошу разрешения сослужить ей ещё большую службу. Даруйте мне красную шапку, и можете быть уверены, в чью поддержку будет звучать мой голос в коллегии."
 request_clerical_elector_title_interaction_toast: "Дарована кафедра"
 request_clerical_elector_title_interaction_decline_toast: "[recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsLocalPlayer, 'отклонили', Select_CString(recipient.IsFemale, 'отклонила', 'отклонил' ))] [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашу просьбу', Concatenate('просьбу персонажа ',puppet_or_actor.GetShortUINameNoTooltip))] о предоставлении [Concept('cardinalate', 'кафедры')|E]"
 request_clerical_elector_title_interaction_accept_tt: "[recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsLocalPlayer, 'приняли', Select_CString(recipient.IsFemale, 'приняла', 'принял' ))] [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашу просьбу', Concatenate('просьбу персонажа ',puppet_or_actor.GetShortUINameNoTooltip))] о предоставлении [Concept('cardinalate', 'кафедры')|E]"
 external_theological_agent_puppet: "Духовный правитель — марионетка"
 external_clerical_puppet: "[external_clerical_puppet|E]"
 has_relation_external_clerical_puppet: "Уже [external_clerical_puppet|El]"
 external_theological_agent_puppet_desc: "Духовная [Concept('puppet', 'марионетка')|E] находится за пределами вашей [Concept('realm', 'державы')|E]. Ей могут быть [Concept('archbishops', 'архиепископы')|E], [Concept('cardinals', 'кардиналы')|E] или [Concept('head_of_faith', 'глава конфессии')|E]. Это влиятельная марионетка, способная [Concept('excommunicate', 'отлучать от церкви')|E]."
 external_ruler_puppet: "Светский правитель — марионетка"
 external_ruler_puppet_desc: "[Concept('ruler', 'Правитель')|E], поддерживающий вас по любви, из страха или из обязательств. Прикажите марионетке вести [Concept('scheme', 'происки')|E] в ваших интересах, чтобы её [Concept('realm', 'держава')|E] служила вам."
