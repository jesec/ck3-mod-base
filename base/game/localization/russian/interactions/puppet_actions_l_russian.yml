 spiritual_puppeteer_modifier_secular_desc: "$spiritual_puppeteer_modifier_cleric_desc$"
 dreadful_puppeteer_modifier: "В подчинении у порочного хозяина"
 dreadful_puppeteer_modifier_desc: "Душа этого персонажа осквернена тёмными желаниями, возможно его личными… а, возможно, навязанными ему кем-то другим."
 beloved_puppeteer_modifier: "Доверие к другому"
 beloved_puppeteer_modifier_desc: "Своенравный хозяин дёргает за ниточки сердца этого персонажа, но тот от любви считает, что это всё к лучшему."
 deranging_puppeteer_modifier: "Манипуляция до безумия"
 deranging_puppeteer_modifier_desc: "Искажённый и измученный разум этого персонажа стал игрушкой некой высшей силы, побуждающей его творить странные вещи."
 puppet_modifier_removal.t: "Влияние кукловода заканчивается"
 modifier_removed_when_puppeting_ends_tt: "#weak #EMP [Concept('modifiers', 'Модификаторы')|E] [Concept('puppet', 'кукловода')|E] сохраняются до тех пор, пока [recipient.GetShortUIName] остаётся вашей [Concept('puppet', 'марионеткой')|E]"
 IS_LOYAL: "[recipient.GetShortUIName] обладает свойством «[GetTrait('loyal').GetName( GetNullCharacter )]»: $VALUE|=+0$"
 YOUR_GENDER_REASON: "Недавнее подчинение [Select_CString(actor.IsFemale, 'женщине', 'мужчине' )]: $VALUE|=+0$"
 FORMER_PUPPET_REASON: "В прошлом ваша марионетка: $VALUE|=+0$"
 SUCCESSION_RELATION_HEIR: "Наследник"
 pam_interactions_events.0120.opening: "[recipient.GetFirstName], #L [recipient.GetFaith.GetReligion.GetName|l]ий#! светоч!"
 pam_interactions_events.0120.desc_religious_head_actor: "Несомненно, со времён первых людей и до наших дней не было никого, кто мог бы сравниться с вами, [recipient.GetTitleAsName|l]! Для меня честь исполнять ваши приказы.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "Я не могу вести верующих в одиночку. Даже [recipient.GetTitleAsName|l], [Select_CString(recipient.IsFemale, 'первая', 'первый' )] среди народа [recipient.GetFaith.HighGodNamePossessive], не может не подчиняться правилам этого мира. И поэтому я помогу и подчинюсь вам, о [actor.GetTitleAsName|l].\n\n"
 pam_interactions_events.0120.desc: "Могу ли я считать благословением свой долг направлять души по воле [recipient.GetFaith.HighGodNamePossessive] и по вашему распоряжению? Я постараюсь делать всё возможное.\n\n"
 pam_interactions_events.0120.desc_lunacy: "Ибо я боюсь, что мой дух умирает… и только ваши слова могут принести мне покой…\n\n"
 pam_interactions_events.0120.desc_dread: "Давайте уничтожим тех, кто этого заслуживает: тех, кто лишён благодати [recipient.GetFaith.HighGodNamePossessive]… совсем как я.\n\n"
 pam_interactions_events.0120.desc_piety: "Ибо [recipient.GetFaith.HighGodName] дарует нам священную цель!\n\n"
 pam_interactions_events.0120.desc_friendly: "[Select_CString(actor.IsFemale, 'Моя', 'Мой' )] [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] может расчитывать на мою любовь, на моё безграничное доверие, и с их помощью я преодолею грядущие невзгоды.\n\n"
 pam_interactions_events.0120.desc_skill: "Под вашим умелым руководством… я рассчитываю сыграть роль в великих событиях.\n\n"
 pam_interactions_events.0120.outro: "Какие из ваших молитв будут услышаны?"
 pam_interactions_events.0120.a: "Каждая их моих молитв, о [recipient.GetTitleAsNameNoTooltip|l]!"
 pam_interactions_events.0121.opening: "О [Select_CString(ROOT.Char.IsFemale, 'досточтимая', 'досточтимый' )] [ROOT.Char.GetTitleAsName|l]!"
 pam_interactions_events.0121.desc_honor: "Я забуду о своей гордости как [recipient.GetTitleAsName|l] державы [recipient.GetPrimaryTitle.GetNameNoTier] и буду внимательно прислушиваться к вашим советам.\n\n"
 pam_interactions_events.0121.desc: "[recipient.GetTitleAsName|U] державы [recipient.GetPrimaryTitle.GetNameNoTier] сыграет свою роль в ваших политических играх и поможет вам вмешиваться в дела этого бренного мира.\n\n"
 pam_interactions_events.0121.desc_lunacy: "Как вы верно подметили, при моём дворе полно болтунов и лжецов. Мои сны омрачены. Лишь ваши слова имеют хоть какой-то смысл, лишь ваши лекарства могут исцелить меня…\n\n"
 pam_interactions_events.0121.desc_dread: "Я оружие в вашей руке, не ведающее сомнений и колебаний.\n\n"
 pam_interactions_events.0121.desc_piety: "Освободите меня от моих тревог и покажите мне, как я могу обрести любовь [recipient.GetFaith.HighGodNamePossessive]!\n\n"
 pam_interactions_events.0121.desc_friendly: "[Select_CString(actor.IsFemale, 'Моя', 'Мой' )] [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], я верю вам безоговорочно и клянусь, что не подведу вас.\n\n"
 pam_interactions_events.0121.desc_skill: "Надеюсь, столь пристальное внимание к делам моей державы означает, что вы не допустите моего провала.\n\n"
 pam_interactions_events.0121.outro: "Давайте исполним ваши планы."
 pam_interactions_events.0121.a: "Хоть [Select_CString(recipient.IsFemale, 'она', 'он')] и [recipient.GetTitleAsNameNoTooltip], [Select_CString(recipient.IsFemale, 'она', 'он')] всё равно служит своей церкви."
