 find_mason_character_tier_3_tt: "Вы, один из ваших [Concept('courtiers', 'придворных')|E] или ваш [Concept('steward', 'управляющий')|E] с #V 20#! или более ед. [Concept('stewardship', 'управления')|E] можете найти каменщика с подходящими навыками"
 gain_mason_character_tt: "Вы или ваш текущий [Concept('dynast', 'глава династии')|E] получаете [Concept('courtier', 'придворного')|E] с высоким [Concept('stewardship', 'навыком управления')|E]"
 cathedral_county_gains_bonus_modifier: "[Concept('county', 'Графство')|E] с [Concept('grand_cathedral', 'великим собором')|E] на #high 50 лет#! получает модификатор «[GetModifier('grand_cathedral_bonus_modifier').GetNameWithTooltip]»"
 cathedral_county_poi_bonus: "[Concept('point_of_interest', 'Точка интереса')|E] [Concept('grand_cathedral', 'великого собора')|E] получает дополнительный эффект на ваше усмотрение"
 grand_cathedral_bonus_modifier: "Великолепный собор"
 grand_cathedral_bonus_modifier_desc: "Местный собор поражает размерами и сложностью исполнения. Через его умиротворённые портики и величавые пролёты течёт непрерывный поток паломников."
 cathedral_domicile_desc: "@grand_cathedral_gp! $cathedral_domicile_gain_tt$"
 cathedral_master_mason_title_tt: "Планирование собора подстёгивает культурный прогресс"
 cathedral_fascination_progress_tt: "Ваша [Concept('culture', 'культура')|E] получает #high 5%#! прогресса текущего [Concept('cultural_fascination', 'культурного интереса')|E]"
 custom.every_christian_courtier: "Каждый [Concept('courtier', 'придворный')|E]-#high христианин#!"
 cathedral_bells_reward_tt: "Каждый #high христианский#! [Concept('ruler', 'правитель')|E] в [Concept('archdiocese', 'архидиоцезе')|E] [Concept('grand_cathedral', 'великого собора')|E] и все его #high христианские#! [Concept('courtiers', 'придворные')|E] потеряют @stress_icon![Concept('stress', 'стресс')|E] и получат духовную реализацию"
 city_or_temple_holding_in_domain_req_tt: "В любом [Concept('holding', 'владении')|E] вашего [Concept('domain', 'домена')|E] есть [Concept('city_holding', 'городские')|E] или [Concept('temple_holding', 'храмовые владения')|E]"
 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$: священные фрески для провинции [province.GetNameNoTooltip]"
 pam_great_projects_events.0002.desc: "Священники могут толковать слово Божие, но именно святые образы показывают пастве истину и славу Господню.\n\nМне удалось собрать средства и найти иконописцев — осталось только решить, какие сцены из Писания будут украшать своды, стены и потолки."
 pam_great_projects_events.0002.a: "Трое волхвов при рождении Христа."
 pam_great_projects_events.0002.b: "Святой Иероним в пустыне со львом."
 pam_great_projects_events.0002.c: "Авраам и Лот уходят из Египта в Ханаан."
 pam_great_projects_events.0002.d: "Благовещение Пресвятой Девы Марии."
 pam_great_projects_events.0002.e: "Святой Августин с сердцем, объятым пламенем божественного знания."
 pam_great_projects_events.0002.f: "Христос омывает ноги апостолов."
 pam_great_projects_events.0002.mystic_xp: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать больше [Concept('trait_level_track_xp', 'опыта свойства')|E] для персонажей со [Concept('trait', 'свойством')|E] «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]»"
 pam_great_projects_events.0002.scholar_xp: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать [Concept('trait_level_track_xp', 'опыт свойства')|E] для персонажей со [Concept('trait', 'свойством')|E] «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]»"
 pam_great_projects_events.0002.pilgrim_xp: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать [Concept('trait_level_track_xp', 'опыт свойства')|E] для персонажей со [Concept('trait', 'свойством')|E] «[GetTrait('pilgrim').GetName( GetNullCharacter )]»"
 pam_great_projects_events.0002.piety: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать @piety_icon![Concept('piety', 'благочестие')|E]"
 pam_great_projects_events.0002.learning_xp: "Когда [Concept('grand_cathedral', 'величественный собор')|E] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать @skill_learning_icon![Concept('lifestyle_experience', 'жизненный опыт')|E] [Concept('learning', 'учёности')|E] и [Concept('spiritual_fulfillment', 'духовную реализацию')|E] верующим"
 pam_great_projects_events.0002.stress_loss: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать @stress_loss_icon![Concept('stress_loss', 'снижение стресса')|E]"
 cathedral_stained_glass_contributor_tt: "Ваш [Concept('prestige_level', 'уровень репутации')|E] — [GetPrestigeLevelName('(int32)2')] или выше, [Concept('piety_level', 'уровень набожности')|E] — [GetPietyLevelName('(int32)3')] или выше, либо вы владеете [Concept('title', 'титулом')|E] уровня [Concept('kingdom', 'королевства')|E]"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: яркие цвета над провинцией [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.desc: "#EMP «Светлым будет то, что едино со светом, и светлым будет благородное дело, пронизанное новым сиянием»#!, — говорит [religion_buddy.GetTitledFirstName], впервые взглянув на цветное стекло, заигравшее на солнце.\n\n[Select_CString(glazier.IsFemale, 'Стекольщица', 'Стекольщик')] [glazier.GetTitledFirstName] [Select_CString(glazier.IsFemale, 'разложила', 'разложил')] на выбеленных столах кусочки [Glossary('цветного стекла', 'POT_METAL_GLOSS')], чтобы мы могли лучше рассмотреть возможные узоры и композиции.\n\nЯ объявляю: «Это окно будет видно и из нефа, и со всей провинции [province.GetNameNoTooltip]. На нём надо изобразить...»"
 pam_great_projects_events.0003.a: "Древо Иессеево, утверждающее законность династии [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.a.flavor: "[Glossary('Древо Иессеево', 'TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Когда [Concept('grand_cathedral', 'величественный собор')|E] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать @dynasty_prestige_icon![Concept('dynasty_prestige', 'признание')|E] членам [Concept('dynasty', 'династии')|E], посещающим его в качестве руководителей [Concept('travel', 'путешествия')|E]"
 pam_great_projects_events.0003.b: "Образ благоволителя, с моим портретом и гербом."
 pam_great_projects_events.0003.b.tt: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать @prestige_icon![Concept('prestige', 'престиж')|E] посетителям"
 pam_great_projects_events.0003.c: "Сцены чудес, явленных паломникам, чтобы привлекать верующих из далёких земель."
 pam_great_projects_events.0003.c.tt: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать повышенный [Concept('trait_level_track_xp', 'опыт свойства')|E] для персонажей со [Concept('trait', 'свойством')|E] «[GetTrait('pilgrim').GetName( GetNullCharacter )]»"
 pam_great_projects_events.0003.d: "Богоматерь, перед которой будет вечно гореть светильник."
 pam_great_projects_events.0003.d.flavor: "Он должен будет следить за тем, чтобы [blessed_mary.GetTitledFirstName], изображённая в стекле, всегда озарялась светом масляной лампы и свечей."
 pam_great_projects_events.0003.d.tt: "Когда [Concept('grand_cathedral', 'величественный собор')|E] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет @stress_loss_icon![Concept('stress_loss', 'снижать стресс')|E] и давать [Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 pam_great_projects_events.0003.d.dulia.tt: "Догмат «[GetTenetType('tenet_dulia').GetBaseName]» в качестве [Concept('personal_tenet', 'личного принципа')|E] даёт больше [Concept('spiritual_fulfillment', 'духовной реализации')|E] при посещении"
 pam_great_projects_events.0003.e: "Цикл мученичества от руки короля."
 pam_great_projects_events.0003.e.tt: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать ревностным посетителям @piety_icon![Concept('piety', 'благочестие')|E] и and @stress_loss_icon![Concept('stress_loss', 'снижение стресса')|E]."
 pam_great_projects_events.0003.e.owner_msg.title: "Мученичество в стекле"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName] [Select_CString(contributor.IsFemale, 'заказала', 'заказал')] для [Concept('grand_cathedral', 'величественного собора')|E] цикл витражей, посвящённых мученичеству. Эта тема пробуждает в вас ещё более глубокую веру."
 TREE_OF_JESSE_GLOSS: "Древо Иессеево изображает родословную Христа, восходящую от лежащего Иессея, отца Давида. На витражах церковных окон библейская царская линия могла соотноситься с правящей династией, подчёркивая божественное происхождение власти. Особенно примечательные примеры сохранились в Шартре и Сен-Дени."
 POT_METAL_GLOSS: "Цветное стекло получают, добавляя оксиды металлов прямо на этапе плавления. Благодаря этому цвет пронизывает стекло насквозь, а не остаётся лишь на поверхности. Стекольные мастера разрезают остывшие стеклянные панели на куски и раскладывают их на выбеленных досках, чтобы увидеть, как сквозь них будет проходить свет, прежде чем приступать к сборке витража."
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: первый камень установлен"
 pam_great_projects_events.0005.desc.intro: "Первый камень установлен! Как дуб вырастает из жёлудя, так и резиденция, откуда будет править [owner.GetTitledFirstName], превратится в нравоучительный монумент. Каждый камень, каждая доска будет излучать славу [ROOT.Char.GetFaith.HighGodNamePossessive], которую смогут лицезреть все [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] державы [owner.GetPrimaryTitle.GetNameNoTier] и христианского мира.\n\nБлагородное решение поддержать строительство будут прославлять звон колоколов и молитвы верующих."
 pam_great_projects_events.0005.desc.contributor: "\n\nСтоит отметить, что [optional_contributor.GetTitledFirstName] своим вкладом ещё сильнее обессмертит наш проект — [cathedral_building.GetName] воссияет в веках."
 pam_great_projects_events.0005.desc.outro: "Начнем великое строительство!"
 pam_great_projects_events.0005.a: "«Наши дети увидят его завершение»."
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: стройка по божественному замыслу"
 pam_great_projects_events.0006.desc.intro_architect: "[Select_CString(architect.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] указывает на"
 pam_great_projects_events.0006.desc.intro_no_architect: "Я окидывают взглядом"
 pam_great_projects_events.0006.desc.intro: "ряд деревянных кольев. Между ними натянуты верёвки, очерчивающие контуры огромного креста — будущего крестообразного здания."
 pam_great_projects_events.0006.desc.steward_founder: "\n\nМне доводилось видеть такое во время обучения!\n\n«Должно быть, вы используете $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n«Но как спланировать столь грандиозное сооружение?» — спрашиваю я."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n«Мы используем $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "[Glossary('ad quadratum', 'AD_QUADRATUM_GLOSS')]! Господь даровал нам божественный порядок: с помощью квадратов мы можем рассчитать пропорции здания, рядом с которым даже [ROOT.Char.Custom('ResidenceBuilding')|l] покажется жалкой халупой!»"
 pam_great_projects_events.0006.desc.foundations: "\n\nЯ вижу, что скоро начнут копать котлован под фундамент."
 pam_great_projects_events.0006.a: "Выкопайте крипту для предков династии [founder.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0006.a.tt: "В [Select_CString(owner.IsLocalPlayer, 'вашем ', '')][Concept('cathedral_complex', 'соборном комплексе')|E][Select_CString(owner.IsLocalPlayer, '', Concatenate(' персонажа ', owner.GetShortUIName))] построено здание «[GetDomicileBuilding('cathedral_crypt_01').GetName|V]» в честь [Concept('dynasty', 'династии')|E] [founder.GetDynastyName]"
 pam_great_projects_events.0006.b: "Удлините неф, чтобы вместить больше паломников."
 pam_great_projects_events.0006.b.tt: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать повышенный [Concept('trait_level_track_xp', 'опыт свойства')|E] «[GetTrait('pilgrim').GetName( GetNullCharacter )]» и @piety_icon![Concept('piety', 'благочестие')|E] посещающим его паломникам"
 pam_great_projects_events.0006.c: "Да направит Бог ваше строительство."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#! на латыни означает «по квадрату». Средневековые мастера-каменщики размечали место будущей постройки с помощью простых пропорциональных систем. За основу они брали соотношение длины стороны квадрата и его диагонали. Форма прямоугольника, составленного из этих двух величин, считалась гармоничной. Из этого единого исходного элемента мастер мог выводить целую последовательность больших и меньших квадратов и прямоугольников, и все части плана при этом оставались согласованными."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: своды под небосводом"
 pam_great_projects_events.0007.desc.intro_architect: "[Select_CString(architect.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] ведёт меня сквозь настоящий лес балок. Леса вокруг собора сами напоминают деревянную церковь, становясь опорой для каменщиков, что неустанно трудятся над каменными сводами."
 pam_great_projects_events.0007.desc.intro_no_architect: "Я прохожу сквозь настоящий лес балок. Леса вокруг собора сами напоминают деревянную церковь, поддерживая каменщиков, что трудятся над сводами."
 pam_great_projects_events.0007.desc.architect: "\n\n«Когда своды будут готовы, они защитят молящихся от непогоды и вознесут наши молитвы к небесам!»"
 pam_great_projects_events.0007.desc.architect_says: " — говорит [architect.GetSheHe]."
 pam_great_projects_events.0007.desc.outro: "\n\nМой взгляд останавливается на завершённом пролёте свода. Его каменные рёбра напоминают мне о великой рыбе, проглотившей Иону. Такова сила Дома Божьего: оказавшись под его сводами, можно словно перенестись на морское дно — или вознестись к самым звёздам."
 pam_great_projects_events.0007.a: "Нужно украсить своды изображением ночного неба."
 pam_great_projects_events.0007.a.tt: "Когда [grand_cathedral|El] будет завершён, его [Concept('point_of_interest', 'точка интереса')|E] будет давать повышенный [Concept('trait_level_track_xp', 'опыт свойства')|E] для персонажей со [Concept('trait', 'свойством')|E] «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]»"
 pam_great_projects_events.0007.b: "Устроить проповедь о покаянии, подобном покаянию Ионы."
 pam_great_projects_events.0007.b.tt: "Ваша [Concept('faith', 'конфессия')|E] получает @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! ед. [Concept('fervor', 'рвения')|E]"
 pam_great_projects_events.0007.c: "Пусть каменщики продолжают работать."
 fervor_gain_cathedral_jonah_sermon: "На стройке [Concept('grand_cathedral', 'величественного собора')|E] проведена проповедь о покаянии"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: отливая глас Божий"
 pam_great_projects_events.0008.desc.intro: "Строительство идёт полным ходом, но собору недостаёт голоса, который мог бы созывать верующих со все уголков державы [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName] говорит, что мы должны отлить огромный бронзовый колокол!"
 pam_great_projects_events.0008.desc.no_architect: "\n\nМы должны отлить колокол!"
 pam_great_projects_events.0008.desc.need_bell: "Дело это рискованное и весьма дорогостоящее — государственная казна ещё не оправилась от одних только расходов на материалы."
 pam_great_projects_events.0008.desc.plague_named: "\n\nУвы, колокольных дел мастер пал жертвой поветрия, что зовётся «[epidemic.GetName]»."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nУвы, колокольных дел мастер пал жертвой недавнего поветрия."
 pam_great_projects_events.0008.desc.outro: "Его [Select_CString(bell_maker_son.IsFemale, 'дочь', 'сын')], [bell_maker_son.GetFirstName], уверяет меня, что отец передал [Select_CString(bell_maker_son.IsFemale, 'ей', 'ему')] тайные знания перед самой смертью и что [Select_CString(bell_maker_son.IsFemale, 'она способна', 'он способен')] отлить колокол."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName], [Select_CString(bell_maker_son.IsFemale, 'молодая и честолюбивая', 'молодой и честолюбивый' )] бронзовых дел [Select_CString(bell_maker_son.IsFemale, 'мастерица', 'мастер' )], [Select_CString(bell_maker_son.IsFemale, 'обученная', 'обученный' )] местным умельцем, ступает вперёд. [bell_maker_son.GetSheHe|U] рвётся доказать своё мастерство и выковать колокол, достойный даже такого грандиозного сооружения, как #L [owner.GetPrimaryTitle.GetAdjective|l]ий#! [cathedral_building.GetName]."
 pam_great_projects_events.0008.a: "Если [Select_CString(bell_maker_son.IsFemale, 'она', 'он')] потерпит неудачу, я [Select_CString(bell_maker_son.IsFemale, 'её', 'его')] казню."
 pam_great_projects_events.0008.a.tt: "Если отлить колокол не выйдет, [bell_maker_son.GetShortUIName] будет [Select_CString(bell_maker_son.IsFemale, 'казнена', 'казнён')]"
 pam_great_projects_events.0008.belltower_may.tt: "В [Select_CString(owner.IsLocalPlayer, 'вашем ', '')][Concept('cathedral_complex', 'соборном комплексе')|E][Select_CString(owner.IsLocalPlayer, '', Concatenate(' персонажа ', owner.GetShortUIName))] можно построить здание «[GetDomicileBuilding('cathedral_belltower_02').GetName|V]»"
 pam_great_projects_events.0008.aa: "Если [Select_CString(bell_maker_son.IsFemale, 'она', 'он')] потерпит неудачу, я сдеру с [Select_CString(bell_maker_son.IsFemale, 'неё', 'него')] кожу."
 pam_great_projects_events.0008.b: "Возможно, [Select_CString(bell_maker_son.IsFemale, 'она', 'он')] станет рукой Господа."
 pam_great_projects_events.0008.b.tt: "Вы верите, что [bell_maker_son.GetShortUIName] сможет отлить колокол"
 pam_great_projects_events.0008.b.flavor: "Разве не был Давид лишь юным пастухом, когда сразил Голиафа?"
 pam_great_projects_events.0008.c: "Найти того, кто справится наверняка, даже если это не потомок мастера."
 pam_great_projects_events.0008.duel.success: "Отливка прошла успешно! В [Select_CString(owner.IsLocalPlayer, 'вашем ', '')][Concept('cathedral_complex', 'соборном комплексе')|E][Select_CString(owner.IsLocalPlayer, '', Concatenate(' персонажа ', owner.GetShortUIName))] появится здание «[GetDomicileBuilding('cathedral_belltower_02').GetName|V]»"
 pam_great_projects_events.0008.duel.failure: "Отлить колокол не удалось... Теперь нужно решить, что делать дальше"
 pam_cathedral_bell_casting_duel: "[Select_CString(CHARACTER.IsLocalPlayer, 'Ваша ', '')][Concept('learning', Select_CString(CHARACTER.IsLocalPlayer, 'учёность', 'Учёность'))|E][Select_CString(CHARACTER.IsLocalPlayer, '', Concatenate(' персонажа ', CHARACTER.GetShortUIName))]"
