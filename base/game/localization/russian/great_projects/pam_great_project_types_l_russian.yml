 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: и Бог молвил"
 pam_great_projects_events.0009.desc.body: "Я наблюдаю, как [bell_maker_son.GetFirstName] мечется туда-сюда, руководя рабочими.\n\n[Select_CString(bell_maker_son.IsFemale, 'Она', 'Он')] то и дело спорит со старой отцовской бригадой, оспаривая их советы и на каждом шагу настаивая на своём: где рыть литейную яму, какую глину выбрать для формы и как топить печи."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] и я наблюдаем, как [bell_maker_son.GetFirstName] мечется туда-сюда, руководя рабочими.\n\n[Select_CString(bell_maker_son.IsFemale, 'Она', 'Он')] то и дело спорит со старой отцовской бригадой, оспаривая их советы и на каждом шагу настаивая на своём: где рыть литейную яму, какую глину выбрать для формы и как топить печи."
 pam_great_projects_events.0009.desc.success_end: "\n\nРасплавленная бронза вливается в форму, словно сам Бог направляет её своей рукой, и выходит из неё без единого изъяна. Колокол поднимают на башню, и его голос разносится над всей округой, чтобы слышали все [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n«Придите в дом Господень!»"
 pam_great_projects_events.0009.a: "Пусть [province.Custom('GetTerrainType')|l] провинции [province.GetNameNoTooltip] услышат глас Божий."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: мрачное знамение!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nРасплавленная бронза с шипением вливается в форму и выходит из неё целой. Колокол поднимают и отводят назад, но, когда язык ударяет по стенке, вместо чистого звона раздаётся лишь глухой стук — а следом треск. Мрачное знамение!"
 pam_great_projects_events.0010.a: "Обещания следует выполнять."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U] [Select_CString(bell_maker_son.IsFemale, 'казнена', 'казнён')]"
 pam_great_projects_events.0010.b: "Такой позор — сам по себе достаточное наказание."
 pam_great_projects_events.0010.b.faith: "Я верю, что у Господа ещё есть на [Select_CString(bell_maker_son.IsFemale, 'неё', 'него')] планы."
 pam_great_projects_events.0010.c: "Переплавить бронзу. Выковать из неё что-нибудь острое."
 pam_great_projects_events.0010.c.tt: "Треснувший колокол переплавят в орудие пытки, и [bell_maker_son.GetShortUIName] станет его первой жертвой. Отныне мастера, что зовут [founder.GetCapitalLocation.GetNameNoTooltip] своим домом, будут знать цену некомпетенетности."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Вместо этого вы получаете [Concept('experience', 'опыт')|E] воплощения [Concept('intrigue_lifestyle', 'коварных планов')|E]"
 pam_great_projects_events.0010.d: "Пусть это будет уроком смирения."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: словно рукой Господа"
 pam_great_projects_events.0011.desc.intro: "Проверяя, как строится [cathedral_building.GetName] в провинции [province.GetNameNoTooltip], я слышу оглушительный скрежет огромного деревянного механизма."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] указывает на гигантское колесо, внутри которого шагают двое рабочих."
 pam_great_projects_events.0011.desc.no_architect: "\n\nВскоре я нахожу источник шума: гигантское колесо, внутри которого шагают двое рабочих."
 pam_great_projects_events.0011.desc.outro: "\n\nСловно самой рукой Божьей, его канаты и блоки поднимают на строящуюся крышу огромные куски [Glossary('обтёсанного камня', 'ASHLAR_GLOSS')] и вёдра с раствором. Я с изумлением смотрю на возносящийся груз, под тяжестью которого рабочие на площадке внизу наверняка бы надорвали спины."
 pam_great_projects_events.0011.a: "Мы, [founder.GetCulture.GetNameNoTooltip|l], должны поучиться у этого великого колеса."
 pam_great_projects_events.0011.a.tt: "Ваша [Concept('culture', 'культура')|E] получает @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! прогресса текущего [Concept('cultural_fascination', 'культурного интереса')|E]"
 pam_great_projects_events.0011.b: "[founder.GetCapitalLocation.GetNameNoTooltip] во многом выиграет от такого изобретения!"
 pam_great_projects_events.0011.c: "Впечатляет, но подобные дела лучше оставить Господу."
 ASHLAR_GLOSS: "Тщательно обтёсанный и ровный каменный блок, которому заранее придают нужную форму на земле. Для строительства соборов требовалось точное планирование: камни должны были идеально совпадать друг с другом, когда их поднимут на высоту."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: высшее призвание"
 pam_great_projects_events.0013.desc: "Глухие удары плотницких молотков разносятся над нами, давая представление об акустике, которая вскоре наполнит храм голосами, несущими верующим Слово Божие.\n\n[architect.GetFirstName] объясняет: «Здесь будет скромная галерея, откуда каноники будут вести богослужение, — наша собственная [Glossary('кантория', 'CANTORIA_GLOSS')]! Ведь обращаться к Господу нам следует иным голосом, нежели к людям». Затем [Select_CString(architect.IsFemale, 'она', 'он')] подзывает к себе юного певчего по имени [choir_boy.GetFirstName].\n\nМальчик проворно взбирается на леса и выводит ангельскую ноту. Она разносится под сводами и проникает в меня, заставляет почувствовать, будто сам Бог прошёл сквозь моё тело."
 pam_great_projects_events.0013.a: "Расширить галерею — чем больше голосов, тем лучше."
 pam_great_projects_events.0013.b: "Этот ангелочек должен украсить мой двор."
 pam_great_projects_events.0013.castrato: "Этот голос следует сберечь для божьей кантории."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U] будет [Select_CString(choir_boy.IsFemale, 'оскоплена', 'оскоплён' )], чтобы [choir_boy.GetHerHis] голос не сломался"
 pam_great_projects_events.0013.c: "Весь этот спектакль — лишь уловка, чтобы вытянуть из меня деньги!"
 pam_great_projects_events.0013.d: "Я в потрясении и поспешу откланяться."
 CANTORIA_GLOSS: "Кантория — это возвышенная певческая галерея в церкви, обычно расположенная над хором или возле средокрестия. Оттуда певчие, а позднее и органисты, сопровождали богослужение."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: Его неизменная любовь"
 pam_great_projects_events.0012.desc: "Западный фасад завершён! Его портал готов принять верующих, которые войдут через [Glossary('притвор', 'NARTHEX_GLOSS')]. Вполне вероятно, что [cathedral_building.GetName] будет строиться целую жизнь, но добрые христиане #L [owner.GetPrimaryTitle.GetAdjective|l]ой#! державы должны верить в будущее и в неизменную любовь Господа. Я начинаю проповедь…\n\n#EMP «[ROOT.Char.Custom('RandomBibleQuote')]»#!\n\n…оставляю им этот урок из Священного Писания."
 NARTHEX_GLOSS: "Притвор — входное помещение церкви между западными дверями и нефом. Здесь верующие собирались перед входом в священное пространство, а в некоторых более строгих течениях во время мессы здесь оставались кающиеся и готовящиеся к крещению."
 pam_great_projects_events.0012.a: "«Блаженны миротворцы...»"
 pam_great_projects_events.0012.a.flavor: "«[Glossary('...ибо они будут наречены сынами Божиими.', 'MATTHEW_5_9_GLOSS')]»"
 pam_great_projects_events.0012.a.tt: "Все #L [owner.GetFaith.GetName|l]ие#! [Concept('county', 'графства')|E] во владении [owner.GetPrimaryTitle.GetNameNoTier] получают модификатор «[GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]» на #V 10 лет#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "«Пойди к муравью, ленивец...»"
 pam_great_projects_events.0012.b.flavor: "«[Glossary('...посмотри на действия его и будь мудрым.', 'PROVERBS_6_6_GLOSS')]»"
 pam_great_projects_events.0012.b.tt: "Все #L [owner.GetFaith.GetName|l]ие#! [Concept('county', 'графства')|E] во владении [owner.GetPrimaryTitle.GetNameNoTier] получают модификатор «[GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]» на #V 10 лет#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "«Умоляю вас, братия...»"
 pam_great_projects_events.0012.c.flavor: "«[Glossary('...именем Господа нашего Иисуса Христа, чтобы все вы говорили одно, и не было между вами разделений, но чтобы вы соединены были в одном духе и в одних мыслях.', '1_CORINTHIANS_1_10_GLOSS')]»"
 pam_great_projects_events.0012.c.tt: "Все #L [owner.GetFaith.GetName|l]ие#! [Concept('county', 'графства')|E] во владении [owner.GetPrimaryTitle.GetNameNoTier] получают модификатор «[GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]» на #V 10 лет#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "«Всегда радуйтесь. Непрестанно молитесь...»"
 pam_great_projects_events.0012.d.flavor: "«[Glossary('...За всё благодарите: ибо такова о вас воля Божия во Христе Иисусе. Духа не угашайте. Пророчества не уничижайте.', '1_THESSALONIANS_5_16_20_GLOSS')]»"
 pam_great_projects_events.0012.d.tt: "Все #L [owner.GetFaith.GetName|l]ие#! [Concept('county', 'графства')|E] во владении [owner.GetPrimaryTitle.GetNameNoTier] получают модификатор «[GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]» на #V 10 лет#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "«Посему и мы, имея вокруг себя такое облако свидетелей...»"
 pam_great_projects_events.0012.e.flavor: "«[Glossary('...свергнем с себя всякое бремя и запинающий нас грех и с терпением будем проходить предлежащее нам поприще.', 'HEBREWS_12_1_GLOSS')]»"
 pam_great_projects_events.0012.e.tt: "Все #L [owner.GetFaith.GetName|l]ие#! [Concept('county', 'графства')|E] во владении [owner.GetPrimaryTitle.GetNameNoTier] получают модификатор «[GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V]» на #V 10 лет#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "«Длань свою она открывает бедному...»"
 pam_great_projects_events.0012.f.flavor: "«[Glossary('...и руку свою подаёт нуждающемуся.', 'PROVERBS_31_20_GLOSS')]»"
 pam_great_projects_events.0012.f.tt: "Все #L [owner.GetFaith.GetName|l]ие#! [Concept('county', 'графства')|E] во владении [owner.GetPrimaryTitle.GetNameNoTier] получают модификатор «[GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V]» на #V 10 лет#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak #L [owner.GetFaith.GetName]ие#!#! [Concept('rulers', 'правители')|E] в [Concept('archdiocese', 'архидиоцезе')|E] будут [Concept('behave', 'вести себя')|e] более благородно и милосердно#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak #L [owner.GetFaith.GetName]ие#!#! [Concept('rulers', 'правители')|E] в [Concept('archdiocese', 'архидиоцезе')|E] будут [Concept('behave', 'вести себя')|e] более прилежно и энергично#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak #L [owner.GetFaith.GetName]ие#!#! [Concept('rulers', 'правители')|E] в [Concept('archdiocese', 'архидиоцезе')|E] будут [Concept('behave', 'вести себя')|e] более общительно и благородно#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak #L [owner.GetFaith.GetName]ие#!#! [Concept('rulers', 'правители')|E] в [Concept('archdiocese', 'архидиоцезе')|E] будут [Concept('behave', 'вести себя')|e] более милосердно и менее скупо#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak #L [owner.GetFaith.GetName]ие#!#! [Concept('rulers', 'правители')|E] в [Concept('archdiocese', 'архидиоцезе')|E] будут [Concept('behave', 'вести себя')|e] более ревностно и уверенно в конфессии#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak #L [owner.GetFaith.GetName]ие#!#! [Concept('rulers', 'правители')|E] в [Concept('archdiocese', 'архидиоцезе')|E] будут [Concept('behave', 'вести себя')|e] более ревностно и энергично#!"
 pam_cathedral_west_portal_sermon_toast: "Проповедь в соборе владения [owner.GetPrimaryTitle.GetNameNoTier]"
 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: вершины шпилей"
 pam_great_projects_events.0020.desc: "Наконец-то на вершины шпилей устанавливаются кресты, подобные тому, на котором много лет назад распяли Христа на [Glossary('Голгофе','GOLGOTHA_GLOSS')]. Они напоминают нам о Его муках ради нашего спасения и обещают, что каждое воскресенье кровь Его будет смывать с нас грехи наши.\n\nС начала строительства сыновья стали отцами, а отцы постарели и упокоились в могилах. Но их благородный труд, их пот и кровь остались увековечены в камне.\n\nИмперии падут, но [cathedral_building.GetName] провинции [province.GetName] будет стоять вечным символом любви Бога."
 pam_great_projects_events.0020.a: "Приходите помолиться с нами издалека и окрест!"
 GOLGOTHA_GLOSS: "«Голгофа» происходит от латинского #EMP Calvariae locus#!, «лобное место». Это был холм в форме черепа в римском Иерусалиме, и именно там произошло распятие Иисуса. Казнь проходила за пределами городских стен, недалеко от места, где он был похоронен. В настоящий момент холм является частью храма Гроба Господня. Рядом располагается [GetBuilding('dome_of_the_rock_01').GetName|V]."
 poi_grand_cathedral_visit: "Посещение собора во владении [province.GetNameNoTooltip]"
 great_project_base_contribution_cost_desc: "Базовая стоимость"
 pam_mass_rite_send_missionaries_value_desc: "За [Concept('county', 'графство')|E] в выбранном [Concept('duchy', 'герцогстве')|E] #weak (@gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_send_missionaries_value')|-0] каждое)#!"
 pam_mass_rite_construct_new_shrines_value_desc: "За [Concept('county', 'графство')|E] в выбранном [Concept('duchy', 'герцогстве')|E] #weak (@gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_construct_new_shrines_value')|-0] каждое)#!"
 pam_mass_rite_integrate_existing_rituals_value_desc: "За [Concept('county', 'графство')|E] в выбранном [Concept('duchy', 'герцогстве')|E] #weak (@gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_integrate_existing_rituals_value')|-0] каждое)#!"
 pam_mass_rite_promote_faithful_relocation_value_desc: "За [Concept('county', 'графство')|E] в выбранном [Concept('duchy', 'герцогстве')|E] #weak (@gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_promote_faithful_relocation_value')|-0] каждое)#!"
 great_project_type_pam_mass_rite_conversion: "Массовое обращение"
 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "При достаточных средствах мы можем привести к свету Господа не отдельных язычников, а целые языческие [Concept('realms', 'державы')|E]. Под нашим наставлением они познают самое праведное [Concept('rite', 'течение')|E], [christendom|El] же расширит свои владения."
 great_project_type_pam_mass_rite_conversion_desc_generic: "При достаточных средствах мы можем распространить верования нашей конфессии не только на отдельных новообращённых, но и на целые [Concept('realms', 'державы')|E], пребывающие во власти враждебных [Concept('faiths', 'конфессий')|E]. Под нашим наставлением местные жители познают праведное [Concept('rite', 'течение')|E], а мы станем сильнее."
