l_russian:
 great_project_type_pam_cathedral_01: "Построить величественный собор"
 great_project_type_pam_cathedral_01_desc: "Воздвигнуть сияющий крест над каменными стенами, над величественными куполами и высокими башнями! Принести чудесный свет с Небес на Землю, чтобы он озарил священный престол прелата и алтарь.\n\nПосле многих лет благородного труда великий маяк воссияет, указывая путь верующим во всех концах света."
 great_project_type_pam_cathedral_02: "Построить готический величественный собор"
 great_project_type_pam_cathedral_02_desc: "Пусть стрельчатые арки устремятся ввысь, а витражи вспыхнут всеми красками!\n\nПодобно Лазарю, этот благородный собор воспрянет, чтобы повести нас в новую эпоху."
 great_project_type_pam_cathedral_03: "Построить пламенеющий величественный собор"
 great_project_type_pam_cathedral_03_desc: "Пусть узорчатый каменный декор и причудливое кружево резьбы венчают собор священным пламенем, возвещая о новом величии этого славного сооружения!\n\nПостройка дополнительных сооружений превратит существующий #TOOLTIP:BUILDING,great_project_cathedral_02 #L готический величественный собор#!#! в #TOOLTIP:BUILDING,great_project_cathedral_03 #L пламенеющий величественный собор#!#!, чьи шпили даруют верующим приют в эти тёмные времена."
 is_in_archdiocese_capital_county: "Находится в столичном [Concept('county', 'графстве')|E] своего [Concept('archdiocese', 'архидиоцеза')|E]"
 cathedral_or_upgraded_special_building_tt: "[Concept('building', 'Здание')|E] [Concept('great_project', 'грандиозного проекта')|E] «[GetBuilding('great_project_cathedral_01').GetName|V]» построено в выбранном [Concept('barony', 'баронстве')|E]"
 cathedral_under_construction_building_tt: "[Concept('building', 'Здание')|E] [Concept('great_project', 'грандиозного проекта')|E] «[GetBuilding('great_project_cathedral_under_construction').GetName|V]» построено в выбранном [Concept('barony', 'баронстве')|E]"
 cathedral_domicile_gain_tt: "Владелец [Concept('cathedral_complex', 'соборного комплекса')|E] в выбранном [Concept('barony', 'баронстве')|E] получает [Concept('domicile_building', 'постройку в имении')|E] «[GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName]»"
