 generic_badge_protection_desc: "Крепкий значок паломника, полученный во владении [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. По слухам, способен оберегать своего владельца."
 generic_badge_prosperity_desc: "Блестящий значок паломника, полученный во владении [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. По слухам, способен приносить владельцу благополучие."
 generic_badge_virility_desc: "Ярко сияющий значок паломника, полученный во владении [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. По слухам, наделяет владельца мужской силой."
 generic_badge_wisdom_desc: "Загадочный значок паломника, полученный во владении [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]. По слухам, наделяет владельца мудростью и склоняет его к созерцаниям."
