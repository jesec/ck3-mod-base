l_russian:
 #Pilgrim Badges
 maria_conch_name: "Раковина Девы Марии"
 maria_conch_description: "Значок, получаемый за отправление в паломничество."
 maria_conch_description_protection: "Значок, получаемый за отправление в паломничество во владение [badge_location.GetProvince.GetBaronyNameExplicitly]. Оберегает владельца."
 maria_conch_description_prosperity: "Значок, получаемый за отправление в паломничество во владение [badge_location.GetProvince.GetBaronyNameExplicitly]. Приносит благополучие."
 santiago_badge_name: "Гребешок Святого Иакова"
 santiago_badge_description: "Значок паломника в виде большого гребешка. Символизирует прохождение паломником пути Святого Иакова из Камино в Сантьяго к святыне в городе Сантьяго-де-Компостела."
 jerusalem_badge_name: "Иерусалимский крест"
 jerusalem_badge_description: "Изящный значок паломника в виде равностороннего креста. Символизирует паломничество в священный город Иерусалим."
 rome_badge_name: "Ключи Царства Небесного"
 rome_badge_description: "Значок паломника в виде ключей с изображением святых Петра и Павла с нимбами вокруг голов. Символизирует паломничество в священный город Рим."
