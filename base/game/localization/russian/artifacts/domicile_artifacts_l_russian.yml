 creature_type_lion_desc: "Царь зверей, символ отваги, посажен на цепь. Он бродит по своей клетке из стороны в сторону, насколько позволяют его оковы."
 creature_type_caracal_desc: "Большое животное, похожее на кошку. Оно бродит по загону и рвёт в клочья любые украшения, повешенные на клетку."
 creature_type_lynx_desc: "Пугливая и массивная кошка. Животное лежит на земле, прижав уши, пока глаза лихорадочно изучают окрестности."
 creature_type_tiger_desc: "Грозное создание, царь горных зверей. Его легко прогневать и заставить показать клыки, чтобы напугать гостей."
 creature_type_leopard_desc: "Гибкое, грациозное и смертоносное животное. Это терпеливый и умный хищник, способный на невероятные прыжки."
 creature_type_bear_desc: "Свирепый медведь бродит туда-сюда в непрерывных поисках еды. Его массивные лапы с равной лёгкостью ломают кости и ветки."
 creature_type_elephant_desc: "Обманчиво спокойный гигант. Его хобот весьма гибок, что удивляет и забавляет гостей."
 creature_type_peacock_desc: "Гордая и почтенная птица с характерным криком. Украшение любого сада."
 creature_type_parrot_desc: "Яркое существо, умеющее копировать человеческую речь, что изрядно веселит гостей."
 creature_type_crane_desc: "Легкокрылая и благородная птица, символ удачи и вечной молодости."
 creature_type_cockatoo_desc: "Пёстрая птица с ярким хохолком и внимательными, умными глазами."
 creature_type_monkey_desc: "Этот общительный примат является очаровательным компаньоном, а его манеры и поведение удивительно похожи на человеческие."
 creature_type_lion_reforged_desc: "Царь зверей, символ отваги. $creature_history_entry$"
