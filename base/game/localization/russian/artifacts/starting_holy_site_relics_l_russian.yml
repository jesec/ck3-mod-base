l_russian:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "Кости Святого Петра"
 artifact_relic_peter_bones_desc: "Кости апостола Петра, главного апостола и первого римского епископа."
 artifact_relic_paul_bones_name: "Кости Святого Павла"
 artifact_relic_paul_bones_desc: "Кости апостола Павла, принявшего мученическую смерть на Сальвиевых водах."
 artifact_relic_crown_of_thorns_name: "Терновый венец"
 artifact_relic_crown_of_thorns_desc: "Терновый венец, надетый на голову Христа перед Распятием."
 artifact_relic_baptist_arm_name: "Правая рука Иоанна Крестителя"
 artifact_relic_baptist_arm_desc: "Правое предплечье Иоанна Крестителя, которым, как считается, он крестил Христа в Иордане."
 artifact_relic_true_cross_name: "Фрагмент Истинного Креста"
 artifact_relic_true_cross_desc: "Щепа от креста, на котором распяли Христа, в позолоченном реликварии."
 artifact_relic_bones_of_james_name: "Кости Святого Иакова"
 artifact_relic_bones_of_james_desc: "Кости апостола Якова Старшего, привлекающие паломников со всего христианского мира."
 artifact_relic_mark_name: "Голова Святого Марка"
 artifact_relic_mark_desc: "Отсечённая голова евангелиста Марка, основателя александрийской церкви."
 artifact_relic_lance_antioch_name: "Святое копьё Антиохии"
 artifact_relic_lance_antioch_desc: "Железный наконечник копья, который, как считается, вонзили в подреберье Христа."
 artifact_relic_tabot_name: "Табот Завета"
 artifact_relic_tabot_desc: "Освящённая каменная скрижаль с изображением Ковчега Завета, почитаемая как самая священная из реликвий Эфиопии."
 artifact_relic_nine_saints_name: "Кости девяти святых"
 artifact_relic_nine_saints_desc: "Кости девяти святых — сирийских монахов, которые бежали от халкидонских противоречий в Аксум и основали первые эфиопские монастыри, распространив миафизитское христианство в нагорьях."
 artifact_relic_thomas_name: "Реликвии апостола Фомы"
 artifact_relic_thomas_desc: "Кости и окровавленный наконечник копья апостола Фомы, который принёс веру в Кералу и принял там мученическую смерть."
 artifact_relic_augustine_pallium_name: "Паллий Святого Августина"
 artifact_relic_augustine_pallium_desc: "Паллий, который носил Августин Кентерберийский, первый архиепископ и апостол англичан."
 artifact_relic_three_magi_name: "Реликвии трёх волхвов"
 artifact_relic_three_magi_desc: "Кости трёх волхвов, следовавших за Вифлеемской звездой."
 artifact_relic_becket_name: "Реликвии Святого Томаса Бекета"
 artifact_relic_becket_desc: "Окровавленные одежды и череп Томаса Бекете, принявшего мученическую смерть в собственном соборе в 1170 году и вскоре ставшего величайшим святым английских христиан."
 artifact_relic_ursula_name: "Кости Святой Урсулы"
 artifact_relic_ursula_desc: "Кости Урсулы и сопровождавших её дев-мучениц, извлечённые из кладбищ Кёльна."
 artifact_relic_ignatius_name: "Кости Святого Игнатия"
 artifact_relic_ignatius_desc: "Кости Игнатия, второго патриарха Антиохии и ученика апостола Иоанна, принявшего мученическую смерть в Риме в правление императора Траяна."
 # Islamic
 artifact_relic_black_stone_name: "Фрагмент Чёрного камня"
 artifact_relic_black_stone_desc: "Полированный чёрный осколок Чёрного камня Каабы, поцелованный самим Пророком и почитаемый каждый паломником, совершающим Хадж."
 artifact_relic_dhulfiqar_name: "Зульфикар"
 artifact_relic_dhulfiqar_desc: "Меч Пророка с раздвоенным лезвием, по слухам подаренный им Али и почитаемый уммой как символ божественного права на власть."
 artifact_relic_buraq_footprint_name: "След Бурака"
 artifact_relic_buraq_footprint_desc: "Камень со следом копыта, оставленным Бураком, когда Пророк вознёсся на небеса с Камня Основания в Иерусалиме."
 artifact_relic_sword_of_ali_name: "Меч Али"
 artifact_relic_sword_of_ali_desc: "Клинок, с которым Али ибн Абу Талиб, предположительно, сражался в битвах при Бадре и Сиффине."
 artifact_relic_abu_hanifa_turban_name: "Тюрбан Абу Ханифы"
 artifact_relic_abu_hanifa_turban_desc: "Тюрбан богослова Абу Ханифы ан-Нумана, основателя ханафитского мазхаба, — опора суннитской юриспруденции для каждого ханафитского паломника."
 artifact_relic_prophet_sandals_name: "Сандалии Пророка"
 artifact_relic_prophet_sandals_desc: "Кожаные сандалии, по слухам принадлежавшие Пророку. Правоверные ремесленники по всей умме создали их неисчислимые копии в форме налов."
 # Jewish
 artifact_relic_western_wall_name: "Камень из Западной стены"
 artifact_relic_western_wall_desc: "Обработанный камень из западной подпорной стены основания Второго храма — того немногого, что уцелело после разрушения храма римлянами в 70 году н. э."
 artifact_relic_tablets_name: "Фрагмент Скрижалей"
 artifact_relic_tablets_desc: "Обломок камня, по слухам, отпавший от Скрижалей Завета на горе Синай, когда Моисей в ярости разбил их."
 # Buddhist
 artifact_relic_bodhi_leaf_name: "Листок дерева Бодхи"
 artifact_relic_bodhi_leaf_desc: "Сохранённый лист дерева Бодхи из Бодх-Гае, под которым Будда обрёл просветление."
 artifact_relic_vajrasana_name: "Фрагмент Ваджрасаны"
 artifact_relic_vajrasana_desc: "Полированный фрагмент Ваджрасаны — алмазного трона под деревом Бодхи, на котором Будда сидел неподвижно, пока не обрёл просветление."
 artifact_relic_dhamek_name: "Шарира ступы Дхамек"
 artifact_relic_dhamek_desc: "Священная реликвия Будды из Сарнатха, где он научил дхарме своих первых последователей."
 artifact_relic_jowo_name: "Джово Шакьямуни"
 artifact_relic_jowo_desc: "Освящённое изображение молодого Будды, привезённое из Китая и почитаемое тибетцами как самая священная из статуй."
 artifact_relic_sacred_tooth_name: "Священный зуб Будды"
 artifact_relic_sacred_tooth_desc: "Левый клык Будды, перевезённый из Калинги в IV веке, — опора царской власти, обладание которой возвышает правителя над всеми остальными."
 # Hindu
 artifact_relic_lingam_name: "Лингам Вишнаватха"
 artifact_relic_lingam_desc: "Священный фрагмент шива-лингама из великого храма Варанаси, самого священного города на Ганге."
 artifact_relic_trishul_name: "Тришула Шивы"
 artifact_relic_trishul_desc: "Трезубец, по слухам принадлежавший самому Шиве, — символ власти бога над созданием, поддержанием и разрушением."
 artifact_relic_krishna_stone_name: "Камень рождения Кришны"
 artifact_relic_krishna_stone_desc: "Потёртый камень из Кришна джанмабхуми в Матхуре — того самого места, которое предание называет местом рождения Кришны."
 artifact_relic_rama_footprint_name: "Отпечаток Рамы"
 artifact_relic_rama_footprint_desc: "Камень с отпечатком ноги самого Рамы, привезённый с его родины, из Айодхьи."
 # Jain
 artifact_relic_palitana_tirtha_name: "Тиртха Палитана"
 artifact_relic_palitana_tirtha_desc: "Священный камень с холмов Шатрунджаи в Палитане, самой священной тиртхе в джайнской традиции."
 artifact_relic_parshvanatha_paduka_name: "Чаран Падука Паршванатхи"
 artifact_relic_parshvanatha_paduka_desc: "Чаран Падука — камень с отпечатком ступней двадцать третьего тиртханкары Паршванатхи."
 artifact_relic_shikharji_nishidhi_name: "Нишидхи тиртханкаров"
 artifact_relic_shikharji_nishidhi_desc: "Памятные стелы нишидхи с вершин горы Саммет-Шикхар, где двадцать из двадцати четырёх тиртханкаров обрели мокшу, — самой священной тиртхи джайнизма."
 # Zoroastrian
 artifact_relic_atash_bahram_name: "Угли Адур-Фарнбага"
 artifact_relic_atash_bahram_desc: "Тлеющие угли, берущие начало от великого Аташ Бахрама, священного огня жрецов. За ними до сих пор присматривают в огненном храме."
 # Norse
 artifact_relic_yggdrasil_branch_name: "Ветвь Иггдрасиля"
 artifact_relic_yggdrasil_branch_desc: "Ветвь, по слухам, упавшая со священного дерева из храма в Уппсале, где до сих пор висят тела принесённых в жертву."
 # Slavic
 artifact_relic_perun_idol_name: "Идол Перуна"
 artifact_relic_perun_idol_desc: "Деревянный идол бога грома Перуна, верховного бога славян, возведённый князем Владимиром."
 # Tengri
 artifact_relic_suldetug_name: "Знамя сулд-туг"
 artifact_relic_suldetug_desc: "Чёрное знамя из хвоста яка, духовный сосуд бога войны, который несут перед степными ханами."
 # Shinto
 artifact_relic_yata_kagami_name: "Зеркало Ята"
 artifact_relic_yata_kagami_desc: "Бронзовое зеркало, традиционно считающееся одним из трёх божественных сокровищ императора Японии. Считается, что с его помощью удалось выманить из пещеры солнечную богиню Аматэрасу."
 artifact_relic_shin_no_mihashira_name: "Син-но Михасира"
 artifact_relic_shin_no_mihashira_desc: "Щепа Син-но Михасира — священного центрального столба, вкопанного под внутренним святилищем Найку, считающимся самым тайным и священным из мистерий Исэ и обновляемом при каждом сикинэн сэнгу."
 # Confucian
 artifact_relic_kong_tomb_name: "Плита на могиле Куна"
 artifact_relic_kong_tomb_desc: "Вырезанная из камня плита на могиле Конфуция в Цюйфу, которую члены семьи Кун почитают на протяжении многих поколений."
 artifact_relic_analects_name: "«Лунь юй» Конфуция"
 artifact_relic_analects_desc: "Ранняя копия «Лунь юй» — собрания изречений Учителя Куна — на бамбуковых дощечках, которую изучали многие поколения китайских учёных."
 # Hellenic
 artifact_relic_athena_promachos_name: "Фрагмент Афины Промахос"
 artifact_relic_athena_promachos_desc: "Бронзовый фрагмент колоссальной статуи Афины, некогда возвышавшейся над Акрополем."
 # West African
 artifact_relic_opa_oranmiyan_name: "Опа Оранмийян"
 artifact_relic_opa_oranmiyan_desc: "Гранитный посох легендарного царя Оранмийяна, отправившегося на священную землю Ифе, родину йоруба."
 artifact_relic_oshe_shango_name: "Оше Шанго"
 artifact_relic_oshe_shango_desc: "Оше Шанго, двусторонний топор, изготовленный по образу двух грозовых камней бога грома Шанго. Жрецы держат его над головой во время исступлённых танцев."
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "Священный идол"
 artifact_misc_relic_idol_desc: "Резной идол, являющийся физическим воплощением божества на время ритуалов."
 artifact_misc_relic_stele_name: "Каменная плита предков"
 artifact_misc_relic_stele_desc: "Каменная плита с вырезанными именами династии жрецов — свидетельство преемственности поколений."
 artifact_misc_relic_mask_name: "Ритуальная маска"
 artifact_misc_relic_mask_desc: "Церемониальная маска, надеваемая во время самых главных ритуалов, — вместилище божественного присутствия."
 artifact_misc_relic_banner_name: "Священное знамя"
 artifact_misc_relic_banner_desc: "Освящённое знамя, реявшее над всеми великими ритуалами в этом священном месте. Его ткань пропиталась дымом подношений."
