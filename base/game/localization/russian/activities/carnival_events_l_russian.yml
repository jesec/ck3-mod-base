 carnival.1009.customloc09: "Бронник"
 ## Event - the duel
 carnival.1010.t: "Поединок"
 carnival.1010.desc: "Толпа расступается, освобождая место для двух незнакомцев в масках. Обнажив клинки, они напряжённо кружат друг вокруг друга. В глазах неизвестных пылает ненависть, они явно собираются биться не до первой крови…"
 carnival.1010.a.desc: "\n\nЯ останусь лишь ещё одной безликой маской в толпе."
 carnival.1010.b.desc: "Меня заметили, и толпа ждёт, стану ли я вмешиваться."
 carnival.1010.a: "Позвать стражу — пусть остановят поединок."
 carnival.1010.b: "Убедить соперников остановиться."
 carnival.1010.c: "Велеть им остановиться."
 carnival.1010.d: "Пусть дерутся."
 cooltip.carnival.1010_duel_diplomacy_success: "Вы останавливаете поединок"
 cooltip.carnival.1010_duel_diplomacy_fail: "Вам не удаётся остановить поединок"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName|U] проигрывает в поединке, [duelist_02.GetSheHe] может быть [Select_CString(duelist_02.IsFemale, 'ранена или убита', 'ранен или убит')]."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName|U] проигрывает в поединке, [duelist_01.GetSheHe] может быть [Select_CString(duelist_01.IsFemale, 'ранена или убита', 'ранен или убит')]."
 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName|U] побеждает в поединке"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName|U] побеждает в поединке"
 carnival.1010_duel_guards_success.desc: "Прибегают стражники"
 carnival.1010_duel_guards_fail.desc: "Стражники появляются слишком поздно"
 carnival.1010_duel_guards_success_toast: "Стражники разнимают соперников"
 carnival.1010_duel_guards_failure_toast: "Стражники появляются слишком поздно, чтобы остановить поединок"
 carnival.1010_duel_diplomacy_success_toast: "Вы остановили поединок"
 carnival.1010_duel_diplomacy_fail_toast: "Вам не удалось остановить поединок"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName|U] [Select_CString(duelist_01.IsFemale, 'была ранена', 'был ранен')] на поединке"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName|U] [Select_CString(duelist_01.IsFemale, 'была убита', 'был убит')] на поединке"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName|U] [Select_CString(duelist_02.IsFemale, 'была ранена', 'был ранен')] на поединке"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName|U] [Select_CString(duelist_02.IsFemale, 'была убита', 'был убит')] на поединке"
 carnival.1010.duel_stop.log_title: "Прекращение поединка"
