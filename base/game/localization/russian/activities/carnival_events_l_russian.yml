 ## GLOSS
 carnival_GLOSS: "Слово «карнавал» происходит от латинского выражения «carnis levare», буквально означающего «отказ от мяса». Карнавал был последней возможностью попировать вволю перед наступлением Великого поста."
 carnival_patria_GLOSS: "#EMP Patria#! — латинское слово, означающее «родина» или «отечество». В Средние века понятие #EMP patria#! выражало чувство гордости и принадлежности к родной провинции, городу или республике."
 murder_bow_name: "[murder_bow.GetName]"
 normal_bow_name: "охотничий лук"
