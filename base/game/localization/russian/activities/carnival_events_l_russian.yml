 ## Event - Dead End
 carnival.1111.t: "Это конец"
 carnival.1111.desc: "Я отчаянно борюсь с одним из убийц, и тут шею пронзает острая боль — его напарник поразил меня сзади! Ноги подкашиваются, земля устремляется навстречу. Силы быстро покидают моё тело, с каждым выдохом на губах появляются кровавые пузыри…"
 carnival.1111.a: "Это не должно было закончиться вот так…"
