 ## Event - Gracious Host
 carnival.1011.t: "[Select_CString(ROOT.Char.IsFemale, 'Гостеприимная хозяйка', 'Гостеприимный хозяин')]"
 carnival.1011.desc: "Карнавал — это отличная возможность продемонстрировать моё богатство и изысканный вкус простому народу. [house_member01.GetFirstNameNoTooltip] предлагает обсудить, кому следует отправить приглашения во дворец. У [Select_CString(house_member01.IsFemale, 'неё', 'него')] есть парочка соображений, но решать в конечном счёте мне."
 carnival.1011.a: "Мы украсим дворец сверху донизу, не жалея средств!"
 carnival.1011.b: "Откроем ворота для бедных горожан!"
 carnival.1011.c: "Только самые видные горожане получат приглашения."
 carnival.1011.d: "Дворец будет открыт только для родни."
 ## Event - Puppet theater
 carnival.1012.t: "Кукольный театр"
 carnival.1012.desc: "Простолюдины обожают кукольный театр, они внимают дурацким и похабным спектаклям с почти детским восторгом. Уродливые марионетки непрерывно совокупляются, дерутся, ругаются и попадают в самые невообразимые ситуации.\n\nКарнавал в городе [carnival_location.GetName] неизменно привлекает множество кукольников. Их представления пользуются бешеной популярностью, однако [carnival_host.GetFaith.PriestNeuterPlural|l] недовольны грубым и непристойным характером спектаклей."
 carnival.1012.a: "Я собираюсь тайно посетить их выступление."
 carnival.1012.b: "Заплачу кукольникам, пусть поставят пьесу моего собственного сочинения!"
 carnival.1012.c: "Я хочу посетить выступление и не [Select_CString(ROOT.Char.IsFemale, 'намерена', 'намерен')] ни от кого скрываться!"
 carnival.1012.d: "Ввести скрытую цензуру и убедить кукольников поумерить пыл."
 carnival.1012.e: "Запретить это вульгарное зрелище!"
 ## Event - The Mask Maker
 carnival.1013.t: "[Select_CString(mask_maker.IsFemale, 'Резчица', 'Резчик')] масок"
 carnival.1013.desc: "Проходя через опустевший дворик, я замечаю [Select_CString(mask_maker.IsFemale, 'пожилую женщину', 'пожилого мужчину')], [Select_CString(mask_maker.IsFemale, 'занятую', 'занятого')] вырезанием маски.\n\nРядом стоит прилавок с [Select_CString(mask_maker.IsFemale, 'её', 'его')] продукцией, там выложены целые ряды разнообразных масок великолепной работы."
 carnival.1013.a: "Покупаю всё! Буду раздавать их всем, кого встречу."
 carnival.1013.b: "Дать [Select_CString(mask_maker.IsFemale, 'резчице', 'резчику')] денег на открытие собственной лавки."
 carnival.1013.c: "Купить себе изысканную маску."
 carnival.1013.d: "Купить себе жуткую маску."
 carnival.1013.maskmaker_workshop.log_title: "Вложение средств в лавку масок"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName|U] [Select_CString(carnival_main.IsLocalPlayer, 'помогли', Select_CString(carnival_main.IsFemale, 'помогла', 'помог' ))] мастеру открыть лавку масок"
 ## Event - Holy Fools
 carnival.1014.t: "Святые шуты"
 carnival.1014.desc: "По улице медленно движется пародия на религиозную процессию. Её участники открыто насмехаются над духовенством, глумливо изображая священников, монахов и даже святейших глав нашей веры."
 carnival.1014_2.a.desc: "\n\nЯ остаюсь [Select_CString(ROOT.Char.IsFemale, 'неузнанной', 'неузнанным')] в толпе."
 carnival.1014_2.b.desc: "\n\nГорожане ждут моей реакции."
 carnival.1014.a: "Незаметно позвать стражу, чтобы разогнать этот шабаш."
 carnival.1014.b: "Осудить греховодников!"
 carnival.1014.c: "Присоединиться к насмешкам."
 carnival.1014.d: "Скрыться в толпе."
 carnival.1014.e: "Давно я так не [Select_CString(ROOT.Char.IsFemale, 'хохотала', 'хохотал')]!"
 cooltip.carnival.1014.non_believer: "#weak #EMP Снижение [Concept('stress', 'стресса')|E] из-за вашего [Concept('secret', 'тайного')|E] отсутствия веры#!#!"
 carnival.1014.secret.tt.toast: "Вы понимаете, что в глубине души никогда не были религиозны"
 carnival.1014.mockery.tt.toast: "Вы испытываете чувство вины, смешанное с облегчением"
 ## Event - The Cat
 carnival.1015.t: "Кошка"
 carnival.1015.desc: "Весь вечер за мной по пятам ходит маленькая тень. За каждым поворотом меня встречает взгляд изумрудных глаз и хриплое #EMP «мяу»#!.\n\n«Кажется, у вас появился новый друг», — посмеивается [observer_01.GetTitledFirstName], когда кошка в очередной раз начинает тереться о мою ногу."
 carnival.1015.a: "Похоже, эта встреча была предначертана!"
 carnival.1015.b: "Думаю, вы нравитесь ей больше."
 carnival.1015.c: "[family_member01.GetTitledFirstName|U] обрадуется новому спутнику."
 carnival.1015.adopt_cat.log_title: "Приручённая кошка"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName|U] [Select_CString(carnival_main.IsLocalPlayer, 'приручили', Select_CString(carnival_main.IsFemale, 'приручила', 'приручил' ))] кошку"
 ## Event - Lover's mask
 carnival.1016.t: "Любовь под маской"
 carnival.1016.desc: "Город [carnival_location.GetName] охвачен праздничным безумием, патриции и простолюдины, скрыв своё положение под масками, веселятся как равные. Отовсюду доносится музыка, из таверн на улицы вываливаются группы гуляк.\n\nКто-то слегка касается моего плеча. Обернувшись, я вижу [Select_CString(woo_character.IsFemale, 'женщину', 'мужчину')], [Select_CString(woo_character.IsFemale, 'её', 'его')] лицо скрыто под маской. [Select_CString(woo_character.IsFemale, 'Таинственная незнакомка', 'Таинственный незнакомец')] принимает эффектную позу и с кокетливым смешком отводит маску в сторону. Это [woo_character.GetNameNoTooltip].\n\n#EMP «Ну здравствуйте, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой')] [ROOT.Char.GetLadyLord]. Не хотите ли провести со мной этот вечер? Как двое совершенно незнакомых людей, решивших насладиться карнавалом…»#! — с демонстративным поклоном говорит [woo_character.GetSheHe]."
 carnival.1016.a: "Какой приятный сюрприз! Что ж, показывай дорогу, #EMP «[Select_CString(woo_character.IsFemale, 'незнакомка', 'незнакомец')]»#!."
 carnival.1016.b: "Я буду [Select_CString(ROOT.Char.IsFemale, 'рада', 'рад')] #BOLD дружескому#! обществу."
 carnival.1016.c: "Нам стоит и дальше оставаться незнакомыми людьми."
 ## Event - In candle light
 carnival.1017.t: "В мерцании свечей"
 carnival.1017.desc: "Снаружи не утихает шум карнавала, но внутри таверны царит тишина и покой. В углу зала в неверном мерцании свечей [Select_CString(intent_target.IsFemale, 'устроилась', 'устроился')] [intent_target.GetNameNoTooltip], [intent_target.GetSheHe] сосредоточенно читает книгу.\n\nЯ точно знаю, что остроумная беседа быстро расположит [Select_CString(intent_target.IsFemale, 'её', 'его')] ко мне."
 carnival.1017.a: "Впечатлить [Select_CString(intent_target.IsFemale, 'её', 'его')] моими познаниями в литературе."
 carnival.1017.b: "Рассказать [Select_CString(intent_target.IsFemale, 'ей', 'ему')] пару увлекательных историй, чтобы [intent_target.GetSheHe] [Select_CString(intent_target.IsFemale, 'позабыла', 'позабыл')] о своей книге."
 carnival.1017.c: "Спросить, можно ли почитать [Select_CString(intent_target.IsFemale, 'её', 'его')] книгу, когда [intent_target.GetSheHe] закончит."
 carnival.1017.a.tt.failure.desc: "А, это подходящая книга для недалёких умов"
 carnival.1017.a.tt.success.desc: "Она напоминает мне о другой книге"
 carnival.1017.b.tt.success.desc: "Отвлечь [Select_CString(intent_target.IsFemale, 'её', 'его')] от чтения"
 carnival.1017.a.tt.success.toast: "[intent_target.GetTitledFirstName|U] [Select_CString(intent_target.IsFemale, 'заинтригована', 'заинтригован')] вашей эрудицией"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName|U] находит ваше общество невыносимо скучным"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName|U] напрочь забывает о своей книге"
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName|U] продолжает увлечённо читать"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName|U] предпочитает книгу вашему обществу"
 carnival.1017.c.tt.toast: "Обсудив интересную книгу, вы и [intent_target.GetTitledFirstName] сближаетесь"
 ## Event - Flowers & song
 carnival.1018.t: "Любовь и игры"
 carnival.1018.desc: "Огромная толпа собралась посмотреть на состязания в силе и ловкости. Под восторженные вопли зрителей участники соревнуются в борьбе, беге и перетягивании каната. На площади царит дружеская, радостная атмосфера.\n\n[intent_target.GetTitledFirstName|U] явно [Select_CString(intent_target.IsFemale, 'увлечена', 'увлечён')] этим праздником телесного совершенства, и я замечаю, что [intent_target.GetSheHe] не отрывает глаз от [Select_CString(contender.IsFemale, 'одной женщины', 'одного человека')]. [contender.GetTitledFirstName] безраздельно владеет [Select_CString(intent_target.IsFemale, 'её', 'его')] вниманием. Если я хочу добиться [Select_CString(intent_target.IsFemale, 'её', 'его')] расположения, придётся как-то превзойти [Select_CString(contender.IsFemale, 'соперницу', 'соперника')]."
 carnival.1018.a: "Я одолею [Select_CString(contender.IsFemale, 'её', 'его')] на борцовском ринге!"
 carnival.1018.b: "Быть может, я смогу убедить [Select_CString(contender.IsFemale, 'её', 'его')] поддаться?"
 carnival.1018.c: "Надо высмеять [Select_CString(contender.IsFemale, 'её', 'его')] так, чтобы [intent_target.GetTitledFirstNameNoTooltip] [Select_CString(intent_target.IsFemale, 'услышала', 'услышал')]."
 carnival.1018.d: "Я не желаю участвовать в этих состязаниях."
 carnival.1018.a.success.desc: "[contender.GetTitledFirstNameNoTooltip|U] уступает вам в борьбе"
 carnival.1018.a.success.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] [Select_CString(intent_target.IsFemale, 'впечатлена', 'впечатлён')] вашей силой"
 carnival.1018.a.failure: "Вас укладывают на обе лопатки"
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] немедленно забывает о вашем существовании"
 carnival.1018.b.success: "Вам удаётся обставить всё очень убедительно"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] восхищается вашим триумфом"
 carnival.1018.b.failure: "Все понимают, что поединок подстроен"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] называет вас [Select_CString(ROOT.Char.IsFemale, 'обманщицей', 'обманщиком' )]"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip] [Select_CString(intent_target.IsFemale, 'позабавлена и заинтригована', 'позабавлен и заинтригован' )]"
 ## Event - A mask in the crowd
 carnival.1019.t: "Маски в толпе"
 carnival.1019.desc: "Куда бы я ни [Select_CString(ROOT.Char.IsFemale, 'шла', 'шёл' )], на глаза то и дело попадается одна и та же маска. Застывшая ухмылка шута постоянно маячит в поле зрения, то появляясь среди бесконечного моря других масок, то снова исчезая. Неужели за мной следят? От одной мысли по спине пробегает холодок.\n\nЯ сворачиваю в переулок, но незнакомцы в масках идут следом. Ясно, что они замышляют недоброе!"
 carnival.1019.a: "Подготовить засаду."
 carnival.1019.b: "Заманить их к стражникам."
 carnival.1019.c: "Позвать на помощь."
 cooltip.carnival.1019.tt.assassination_success: "Вы убиваете преследователя"
 cooltip.carnival.1019.tt.assassination_fended: "Вы раните преследователя"
 cooltip.carnival.1019.tt.assassination_captured: "Ваш преследователь арестован"
 cooltip.carnival.1019.tt.assassination_scream: "Услышав ваши крики, убийцы разбегаются"
 carnival.1019.tt.assassination_success.desc: "Вы сразили преследователя"
 carnival.1019.tt.assassination_fended.desc: "Вы отбились от преследователя"
 carnival.1019.tt.assassination_wounded.desc: "Вы ранены"
 carnival.1019.tt.assassination_killed.desc: "Преследователь убивает вас"
 carnival.1019.tt.assassination_gotaway.desc: "Вам удаётся сбежать"
 carnival.1019.tt.assassination_cornered.desc: "Вас загоняют в угол"
 carnival.1019.tt.assassination_captured.desc: "Стражники хватают убийцу"
 carnival.1019.tt.assassination_fended_toast: "Пырнув преследователя, вы скрываетесь в переулках"
 carnival.1019.tt.assassination_wounded_toast: "Преследователь ранит вас и скрывается во тьме"
 carnival.1019.tt.assassination_success_toast: "[Select_CString(murder_01.IsFemale, 'Неудавшаяся', 'Неудавшийся' )] убийца [murder_01.GetFirstNameNoTooltip] [Select_CString(murder_01.IsFemale, 'мертва', 'мёртв' )]"
 carnival.1019.tt.assassination_gotaway_toast: "Вам удаётся скрыться от преследователей"
 carnival.1019.tt.assassination_captured_toast: "Убийца [murderer_01.GetFirstNameNoTooltip] [Select_CString(murderer_01.IsFemale, 'брошена', 'брошен' )] в темницу"
 ## Event - Thundering hooves
 carnival.1020.t: "Гром копыт"
 carnival.1020.desc: "Я замечаю, что [murder_victim.GetNameNoTooltip] и [murder_victim.GetHerHis] [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip] покидают пир.\n\nС трудом придерживая коня, я выжидаю, пока [murder_victim.GetFirstNameNoTooltip] заканчивает прощаться с хозяином. Жертва даже не подозревает о нависшей над ней смертельной угрозе, которая уже перебирает копытами чуть дальше по улице…\n\nМомент выбран как нельзя удачно, но есть риск, что пострадают ни в чём не повинные люди."
 carnival.1020.a: "Я разрублю их пополам на полном скаку!"
 carnival.1020.b: "Скачи, [ROOT.Char.Custom('WarhorseStoryName')]! Сейчас они узнают, что я — [Select_CString(ROOT.Char.IsFemale, 'женщина, которую', 'человек, которого' )] стоило бояться!"
 carnival.1020.c: "[murder_victim.GetFirstNameNoTooltip] погибнет под копытами. Трагическая случайность, не более."
 carnival.1020.d: "Я приказываю наёмным подручным загнать добычу."
 carnival.1020.e: "Не сегодня, риск слишком велик."
 carnival.1020.tt.horse.hit.desc: "Жертва погибает под копытами"
 carnival.1020.tt.horse.miss.desc: "Лошадь проносится мимо цели"
 carnival.1020.tt.horse.hit.toast: "Жертва погибла под копытами"
 carnival.1020.tt.horse.miss.toast: "Лошадь пронеслась мимо цели"
 carnival.1020.murder_horse.log_title: "Взбесившийся конь"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName|U] [Select_CString(carnival_main.IsLocalPlayer, 'затоптали', Select_CString(carnival_main.IsFemale, 'затоптала', 'затоптал' ))] [Select_CString(murder_victim.IsLocalPlayer, 'вас', Concatenate('персонажа ', murder_victim.GetShortUIName))] своим боевым конём по имени [carnival_main.Custom('WarhorseStoryName')]"
 carnival.1020.accident.log_title: "Трагическая случайность"
 carnival.1020.accident.log: "В результате несчастного случая [murder_victim.GetShortUIName] [Select_CString(murder_victim.IsLocalPlayer, 'погибли', Select_CString(murder_victim.IsFemale, 'погибла', 'погиб' ))] под копытами лошади."
 carnival.1020.both_accident.log_title: "Трагическая случайность"
