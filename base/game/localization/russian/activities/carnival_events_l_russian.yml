 ## Event - The Arrow
 carnival.1021.t: "Стрела"
 carnival.1021.desc: "В моём укрытии царит тишина, лишь доски поскрипывают под ногами. Сквозь ставни доносится приглушённый шум улицы. Внизу, во дворе, прохаживается [murder_victim.GetFirstNameNoTooltip]. [murder_victim.GetSheHe|U] даже не подозревает о моём присутствии… и о том, что в руках у меня [SCOPE.Custom('UniqueBowOrJustBow')].\n\nРядом переминается [bandit_01.GetFirstNameNoTooltip] — я [Select_CString(ROOT.Char.IsFemale, 'привлекла', 'привлёк' )] [Select_CString(bandit_01.IsFemale, 'эту разбойницу', 'этого громилу' )] на случай, если потребуется лишняя пара рук.\n\nЯ натягиваю тетиву, и тут [murder_victim.GetFirstNameNoTooltip] вскидывает голову и что-то высматривает в соседних окнах!"
 carnival.1021.a: "Я стреляю, пока [murder_victim.GetSheHe] меня не [Select_CString(murder_victim.IsFemale, 'заметила', 'заметил' )]."
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip], стреляй. Я позабочусь о нашем отходе."
 carnival.1021.c: "Надо пригнуться! Дождёмся другого подходящего случая."
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip] убивает не того человека"
 carnival.1021.tt.arrow.hit.desc: "Стрела попадает прямо в цель"
 carnival.1021.tt.arrow.miss.desc: "Стрела летит мимо, а ваша жертва замечает вас"
 carnival.1021.tt.thug.arrow.hit.desc: "Стрела попадает прямо в цель"
 carnival.1021.tt.thug.arrow.miss.desc: "Стрела поражает другую цель"
 carnival.1021.tt.arrow.hit.toast: "Стрела попала в цель"
 carnival.1021.tt.arrow.miss.toast: "Стрела прошла мимо цели, а вас заметили!"
 carnival.1021.tt.thug.arrow.hit.toast: "Стрела наёмного бандита попала в цель"
 carnival.1021.tt.thug.arrow.miss.toast: "Стрела наёмного бандита поразила другую цель!"
 carnival.1021.arrow.log_title: "Неизвестный стрелок"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip] [Select_CString(murder_victim.IsFemale, 'погибла', 'погиб' )] от стрелы, выпущенной неопознанным убийцей"
 ## Event - Procession of My Own
 carnival.1022.t: "Моя личная процессия"
 carnival.1022.desc: "Карнавал проводится на деньги городской казны и в интересах всех жителей; и хотя средств обычно хватает, помощь со стороны состоятельных и предприимчивых граждан может сделать празднество по-настоящему великолепным.\n\nВнеся свой вклад в организацию карнавала, в глазах простонародья я уподоблюсь благородным патрициям былых времён, а мои конкуренты лопнут от зависти. В конце концов, знатные мужи городов-государств древности никогда не стеснялись своего богатства! Если профинансировать роскошную процессию, обо мне заговорит весь город!\n\nОсталось решить, #BOLD чему посвятить шествие#!."
 carnival.1022.a: "#BOLD Прекрасная#! процессия, которая восславит мои достижения!"
 carnival.1022.b: "#BOLD Грозное#! шествие, внушающее страх и уважение!"
 carnival.1022.c: "#BOLD Религиозная#! процессия, демонстрирующая моё благочестие!"
 carnival.1022.d: "Если более разумные способы потратить моё золото."
 custom.carnival.1022.guestopinion: "Каждый гость на карнавале"
 custom.zealot_carnival.1022.guestopinion: "Каждый гость-[GetVassalStance( 'zealot' ).GetTextIcon|l] на карнавале"
 ## Event - Legacy in marble
 carnival.1023.t: "Наследие в мраморе"
 carnival.1023.desc: "С самого детства я [Select_CString(ROOT.Char.IsFemale, 'заслушивалась', 'заслушивался' )] историями о древних городах-государствах, чьи патриции славились как меценаты и покровители искусств. И хотя оставшиеся от них величественные здания давно лежат в руинах, их красота продолжает вдохновлять всё новые поколения. Покровительствуя современным мастерам, я могу встать в один ряд с прославленными мужами древности.\n\nПодумать только: моя репутация будет жить в веках, когда мои кости давно истлеют!\n\nПусть люди любуются красотой, изваянной из мрамора, камня и дерева и раскрашенной во все цвета радуги! Во имя [Glossary( '#bold Patria#!', 'carnival_patria_GLOSS' )], в память о наших славных предках и к вящему престижу дома [ROOT.Char.GetDynastyHouseName]!"
 carnival.1023.a: "Устроим конкурс среди молодых мастеров."
 carnival.1023.b: "Надо сделать новые росписи и украшения для городской площади."
 carnival.1023.c: "Закажем группу статуй, изображающих основателей нашего города."
 carnival.1023.d: "Погодите, искусство не может стоить так дорого…"
 ## Event - Whispers behind the mask
 carnival.1024.t: "Шёпот из-под маски"
 carnival.1024.desc: "В бурном веселье карнавала стираются все условности, и люди легко забывают о приличиях. Никогда не знаешь, что за человек скрывается под маской — и что он вспомнит наутро.\n\n[hook_target.GetTitledFirstNameNoTooltip|U] [Select_CString(hook_target.IsFemale, 'нырнула', 'нырнул' )] в разгул с головой. [hook_target.GetSheHe|U] хохочет во всё горло, пляшет со всеми, кто [Select_CString(hook_target.IsFemale, 'ей', 'ему' )] приглянётся, и поглощает еду и выпивку так, словно завтрашний день никогда не наступит. [Select_CString(hook_target.IsFemale, 'Ей', 'Ему' )] наплевать, кто может подслушать [hook_target.GetHerHis] речи. [hook_target.GetHerHis|U] танцы уже граничат с непристойными, и [hook_target.GetSheHe] совершенно не замечает, что я #BOLD пристально наблюдаю за [Select_CString(hook_target.IsFemale, 'ней', 'ним' )] из-под маски#!.\n\n #BOLD Я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы уберечь [hook_target.GetHerHis] от позора… или воспользоваться ситуацией в своих интересах, сделав [hook_target.GetHerHis] своим должником.#!"
 carnival.1024.a: "Я буду приглядывать за [Select_CString(hook_target.IsFemale, 'ней', 'ним')] как [Select_CString(ROOT.Char.IsFemale, 'подруга', 'друг' )]."
 carnival.1024.b: "Жаль будет, если впоследствии кто-то призовёт [hook_target.GetHerHis] к ответу…"
 carnival.1024.c: "Лучше предупредить [hook_target.GetHerHis] семейство."
 carnival.1024.d: "Пусть [hook_target.GetTitledFirstNameNoTooltip] [Select_CString(hook_target.IsFemale, 'сама', 'сам')] расплачивается за своё безрассудство."
 carnival.1025.t: "Безделушки и невиданные звери"
 carnival.1025.into_desc: "Я останавливаюсь у палатки чужеземного торговца. На прилавке разложены всевозможные диковинки, привезённые из далёких стран, рядом стоят клетки с экзотическими животными. Запахи и звуки, исходящие от этого зверинца, невозможно описать словами.\n\n«Милости прошу, подходите поближе! Таких чудес вы ещё не видывали!» — зазывает торговец, указывая на свои товары.\n\n«У меня есть [merchant_trinket.GetName] превосходного качества! А это [merchant_creature.GetName|l] —"
 carnival_1025_creature_lion_desc: "африканская мантикора, чудовище-людоед из легенд!»"
 carnival_1025_creature_caracal_desc: "миниатюрное воплощение ярости!»"
 carnival_1025_creature_lynx_desc: "он взбирается на дерево за считанные секунды, а его моча содержит кристаллы, обладающие волшебными свойствами!»"
 carnival_1025_creature_tiger_desc: "чудовище-людоед из персидских легенд!»"
 carnival_1025_creature_leopard_desc: "прямиком со страниц старинных манускриптов!»"
 carnival_1025_creature_bear_desc: "он умеет стоять на передних лапах и жонглировать камнями размером с голову!»"
 carnival_1025_creature_elephant_desc: "творение безумного алхимика!»"
 carnival_1025_creature_peacock_desc: "порождение пламени!»"
 carnival_1025_creature_parrot_desc: "он умеет разговаривать и петь псалмы!»"
 carnival_1025_creature_cockatoo_desc: "настоящая редкость!»"
 carnival_1025_creature_crane_desc: "посмотрите, какая грациозная!»"
 carnival_1025_creature_monkey_desc: "тварь прямиком из преисподней!»"
 carnival.1025.a: "«Потрясающе! Я возьму эту вещь»."
 carnival.1025.b_1: "«Невероятно! Я покупаю ваше животное»."
 carnival.1025.b_2: "«По-моему, это просто [merchant_creature.Custom('GetCarnival1025RealBeastName')|l]»."
 carnival.1025.c: "Я только посмотрю, благо это ничего не стоит."
 carnival.1025.embarrassed_merchant: "Торговец, краснея от стыда, предлагает вам скидку."
