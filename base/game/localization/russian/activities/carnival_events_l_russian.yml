l_russian:
 ## Event - Carnival Opening
 carnival.1001.t: "Время чудес"
 carnival.1001.desc: "Приготовления окончены.\n\nВдоль бульваров реют пёстрые флаги, по извилистым аллеям и улицам владения [carnival_location.GetName] тянутся шествия, на площадях собираются целые толпы. Богатые и бедные, прекрасные и уродливые — среди моря масок мы все равны.\n\nЭто будет чудесное представление!"
 carnival.1001.a: "Пора надеть маску. [Glossary( '#bold Carnis levare!#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "И как вы будете меня искать, наёмные убийцы?"
 carnival.1001.c: "Маска скроет любой шрам, любой дефект…"
 ## Event - Carnival Closing
 carnival.1002.t: "Назад к обыденности"
 carnival.1002.desc: "На каждой улице видны следы прошедшего карнавала. Усталые гуляки медленно расползаются по домам, а канавы усеяны брошенными масками и праздничными украшениями. На время отбросив сословные различия, весь город пировал, танцевал, играл и смеялся, как одна семья.\n\nКакое-то время карнавальный дух ещё будет витать в воздухе, напоминая нам о том, кто мы есть. Но скоро всему городу придётся вернуться к обычной жизни с её суровыми порядками, тяжким трудом и множеством обязательств… пока карнавальная ночь не наступит снова."
 carnival.1002.a: "Пора вернуться к делам."
 carnival.1002.b: "Ну почему каждый день не может быть похож на карнавал?"
 carnival.1002.c: "Хорошо, что на улицы вернулся порядок."
 ## Event - A chance for mischief
 carnival.1003.t: "Повод для шалости"
 carnival.1003.desc: "Сегодня особняк дома [house_target.GetDynastyHouseName] выглядит особенно шикарно. Стены убраны драпировкой из [house_target.Custom('RegionalFabric')], повсюду стоят [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')], бесчисленные слуги носятся по своим делам, пока [house_target.GetName] с важным видом рисуется перед своими прихлебателями. Как же хочется поставить их на место…\n\nПодобная шалость будет как раз в духе карнавала, разве нет?\n\nНадо заплатить парочке негодяев, чтобы они…"
 carnival.1003.a: "Забросали [Select_CString(house_target.IsFemale, 'хозяйку', 'хозяина')] дома тухлыми яйцами!"
 carnival.1003.b: "Пробежали по дворцу, переодевшись чертями."
 carnival.1003.c: "Нарисовали на заборе похабные изображения [Select_CString(house_target.IsFemale, 'её', 'его')] семейства."
 carnival.1003.d: "Нет, я не стану этого делать."
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName|U] [Select_CString(house_member.IsLocalPlayer, 'стыдитесь', 'стыдится')] выходить на улицу"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName|U] [Select_CString(house_member.IsLocalPlayer, 'теряете', 'теряет')] рассудок"
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUIName|U] вне себя от ярости"
 carnival.1003.throw_eggs_log_title: "Дом забросали яйцами"
 carnival.1003.throw_eggs_log: "Особняк дома [house_target.GetDynastyHouseName] забросали яйцами"
 carnival.1003.mischief.insanity.log_title: "Буйные черти"
 carnival.1003.mischief.insanity.log: "Увидав переодетых чертями негодяев, [house_member.GetShortUIName] [Select_CString(house_member.IsLocalPlayer, 'лишились', Select_CString(house_member.IsFemale, 'лишилась', 'лишился' ))] рассудка"
 carnival.1003.mischief.irritable.log_title: "Буйные черти"
 carnival.1003.mischief.irritable.log: "Увидав переодетых чертями негодяев, [house_member.GetShortUIName] [Select_CString(house_member.IsLocalPlayer, 'разозлились', Select_CString(house_member.IsFemale, 'разозлилась', 'разозлился' ))] до крайности"
 carnival.1003.mischief.reclusive.log_title: "Буйные черти"
 carnival.1003.mischief.reclusive.log: "Увидав переодетых чертями негодяев, [house_member.GetShortUIName] [Select_CString(house_member.IsLocalPlayer, 'спрятались', Select_CString(house_member.IsFemale, 'спряталась', 'спрятался' ))] от окружающих"
 ## Event - House Relations
 carnival.1004.t: "Особые отношения"
 carnival.1004.desc: "Пока город [carnival_location.GetName] раздирают внутренние распри, у него нет будущего. Пора мне найти общий язык с могущественными домами, определяющими местную политику.\n\nЗаметив, что [other_house_leader01.GetName] [Select_CString(other_house_leader01.IsFemale, 'осталась одна', 'остался один')] на пиру, я отвожу [Select_CString(other_house_leader01.IsFemale, 'её', 'его')] в сторонку и пытаюсь объяснить, сколько выгод нам обоим принесут хорошие отношения между домами [ROOT.Char.GetDynastyHouseName] и [other_house_leader01.GetDynastyHouseName]."
 carnival.1004.a: "Наша казна полна, а карманы набиты доверху!"
 carnival.1004.b: "Деловое сотрудничество послужит нашим общим интересам."
 carnival.1004.c: "Вашему дому далеко до семейства [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 carnival.1004.d: "Пусть отношения между нашими домами остаются как прежде."
 ## Event - Prank a friend
 carnival.1005.t: "Дружеская шутка"
 carnival.1005.desc: "Карнавал — самый подходящий повод, чтобы хорошенько подшутить над другом. Беззлобно, разумеется.\n\nЯ замечаю, что [bystander.GetName] и [Select_CString(friend.IsFemale, 'моя подруга', 'мой друг')] [friend.GetName] заняты разговором, и в голове тут же возникает целый ворох занимательных идей!"
 carnival.1005.a: "Вызвать их на поединок на деревянных палках!"
 carnival.1005.b: "Столкнуться с [Select_CString(friend.IsFemale, 'ней', 'ним')], оставаясь [Select_CString(ROOT.Char.IsFemale, 'неузнанной', 'неузнанным')], и заговорить на вымышленном языке."
 carnival.1005.c: "Я забросаю их крашеными яйцами, где вместо содержимого — духи!"
 carnival.1005.d: "Нет, я не стану веселиться за счёт других."
 carnival.1005.tt.stick_success.desc: "Вы веселитесь на славу, устроив шуточный поединок"
 carnival.1005.tt.stick_failure.desc: "Вы слишком агрессивно размахиваете палкой"
 carnival.1005.tt.success.desc: "Ваша шутка смешит всех присутствующих"
 carnival.1005.tt.failure.desc: "Объекты вашей шутки называют вас [Select_CString(ROOT.Char.IsFemale, 'неотёсанной кобылой', 'неотёсанным ослом')]"
 carnival.1005.tt.disguise_success.desc: "Вам удаётся позабавить окружающих"
 carnival.1005.tt.disguise_failure.desc: "Ваша шутка вызывает раздражение окружающих"
 carnival.1005.tt.success.toast: "Ваша шутка рассмешила всех присутствующих"
 carnival.1005.tt.failure.toast: "Жертвы вашей шутки назвали вас [Select_CString(ROOT.Char.IsFemale, 'неотёсанной ослицей', 'неотёсанным ослом')]"
 carnival.1005.tt.egg_success.toast: "[Select_CString(friend.IsFemale, 'Ваша подруга оценила', 'Ваш друг оценил')] ароматный сюрприз"
 carnival.1005.tt.egg_failure.toast: "[Select_CString(friend.IsFemale, 'Вашу подругу', 'Вашего друга')] аж передёрнуло от запаха."
 ## Event - The entertainer
 carnival.1006.t: "Уличные музыканты"
 carnival.1006.desc: "Карнавал привлекает множество уличных исполнителей, ищущих возможности подзаработать. Остановившись послушать выступление музыкальной труппы, я [Select_CString(ROOT.Char.IsFemale, 'была заворожена', 'был заворожён')] их историями, рассказанными через музыку."
 carnival.1006.a: "Я заплачу музыкантам, чтобы пели песни во славу моего величия!"
 carnival.1006.b: "Пришлю посредника, чтобы нанять на службу самых лучших из труппы."
 carnival.1006.c: "Надо попросить, чтобы сыграли что-нибудь популярное."
 carnival.1006.d: "Закружить [Select_CString(dancer_character.IsFemale, 'стоящую рядом женщину', 'стоящего рядом мужчину')] в танце!"
 cooltip.carnival.1006.bawdy_song.tt: "Просит сыграть непристойную песню"
 cooltip.carnival.1006.patriotic_song.tt: "Просит сыграть песню о [Glossary( '#bold Patria!#!', 'carnival_patria_GLOSS' )]"
 cooltip.carnival.1006.spiritual_song.tt: "Просит сыграть благочестивую песню"
 carnival.1006.tt.dance_success.desc: "[dancer_character.GetWomanMan] принимает приглашение потанцевать"
 carnival.1006.tt.dance_failure.desc: "[dancer_character.GetWomanMan] отказывается танцевать"
 carnival.1006.tt.dance_success.toast: "Вы и [dancer_character.GetFirstNameNoTooltip] кружитесь в танце"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip] не хочет танцевать с вами."
 carnival.1006.bawdy_song.tt.toast: "Вы слушаете непристойную песню!"
 carnival.1006.patriotic_song.tt.toast: "Вы слушаете песню о [Glossary( '#bold Patria!#!', 'carnival_patria_GLOSS' )]"
 carnival.1006.spiritual_song.tt.toast: "Вы слушаете благочестивую песню!"
 carnival.1006.recruit_entertainer.log_title: "Нанятый исполнитель"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip] [Select_CString(carnival_main.IsFemale, 'взяла', 'взял')] на службу исполнителя по имени [entertainer_character.GetFirstNameNoTooltip]"
 ## Event - Learning to juggle
 carnival.1007.t: "Искусство жонглирования"
 carnival.1007.desc: "Бульвары города [carnival_location.GetName] заполонили менестрели, шуты и циркачи. Я не могу оторвать глаз от выступлений жонглёров — разве можно не восхищаться тем, с какой лёгкостью они удерживают в воздухе по нескольку ножей и мячей?\n\nЗаметив мой интерес, один из жонглёров предлагает мне испытать удачу — просто забавы ради.\n\n«Один мяч, два или сразу три — сколько вы сможете удержать, не дав им упасть на землю, [ROOT.Char.Custom('MistressMaster')]?»"
 carnival.1007.a: "Клянусь, я смогу удержать в воздухе три мяча!"
 carnival.1007.b: "Мне хватит и двух мячей."
 carnival.1007.c: "Как насчёт двух ножей?"
 carnival.1007.d: "Я не стану заниматься такими глупостями."
 carnival.1007.juggling_success.tt.toast: "Успешное жонглирование"
 carnival.1007.juggling_fail.tt.toast: "Мячи упали"
 carnival.1007.juggling_athletic.tt.toast: "Жонглирование — отличная тренировка для ума и для тела"
 carnival.1007.juggling_k.success.tt.toast: "Успешное жонглирование ножами"
 carnival.1007.juggling_k.fail.tt.toast: "Порез от жонглирования ножами"
 carnival.1007.blademaster.log_title: "Тяга к ножам"
 carnival.1007.blademaster.log: "После жонглирования ножами [carnival_main.GetFirstNameNoTooltip] испытывает постоянное желание поиграть с острым клинком"
 ## Event - A wild dance
 carnival.1008.t: "Бешеный танец"
 carnival.1008.desc: "Над центральной площадью разносится зажигательная музыка. Под взрывы смеха бесчисленное множество танцующих в масках кружат хороводы, непрерывно меняясь партнёрами.\n\nЯ гляжу на них со стороны, и ноги сами так и рвутся в пляс!"
 carnival.1008.a: "«Я дам золото лучшим танцорам!»"
 carnival.1008.b: "Я буду танцевать до упаду!"
 carnival.1008.c: "Отдамся на волю танца, пусть ведёт меня куда ему угодно."
 carnival.1008.d: "Я просто порадуюсь за других."
 carnival.1008.strong.tt.toast: "Пляшущие ноги"
 carnival.1008.exhausted.tt.toast: "Танцы вас совершенно вымотали!"
 carnival.1008.hurt.tt.toast: "Вы поранились во время танцев!"
 ## Event - A drink with a craftsman
 carnival.1009.t: "Собутыльник-[craftsman_character.Custom('CraftsmanDescOption')|l]"
 carnival.1009.desc: "Я захожу пропустить стаканчик в одно из питейных заведений на улице ремесленников. Ко мне подсаживается [Select_CString(craftsman_character.IsFemale, 'женщина', 'мастер')]-[craftsman_character.Custom('CraftsmanDescOption')|l], и между нами быстро завязывается беседа.\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.GetSheHe|U] [Select_CString(craftsman_character.IsFemale, 'поражена', 'поражён')] до глубины души, что [Select_CString(carnival_host.IsFemale, 'сама', 'сам')] [carnival_host.GetTitleAsNameNoTooltip|l] [Select_CString(carnival_host.IsFemale, 'снизошла', 'снизошёл')] до их трактира."
 carnival.1009.1_b.desc: "Моё лицо скрывает маска, так что можно не бояться, что [craftsman_character.GetSheHe] меня узнает."
 carnival.1009.2_a.desc: "Я с интересом выслушиваю [Select_CString(craftsman_character.IsFemale, 'её', 'его')] жалобы на городские власти. [Select_CString(craftsman_character.IsFemale, 'Женщина убеждена', 'Мастер убеждён')], что во всех [Select_CString(craftsman_character.IsFemale, 'её', 'его')] бедах [Select_CString(carnival_host.IsFemale, 'виновата', 'виноват')] лично [carnival_host.GetTitleAsNameNoTooltip|l]."
 carnival.1009.2_b.desc: "Я с интересом слушаю, как [craftsman_character.GetSheHe] нахваливает городские власти. [Select_CString(craftsman_character.IsFemale, 'Женщина', 'Мастер')] заявляет, что [carnival_host.GetTitleAsNameNoTooltip|l] — лучшее, что случилось с этим городом за последние десятилетия, и поднимает кружку за кружкой за [Select_CString(carnival_host.IsFemale, 'её', 'его')] здравие."
 carnival.1009.2_c.desc: "[craftsman_character.GetSheHe|U] очень [Select_CString(craftsman_character.IsFemale, 'довольна', 'доволен')] тем, как управляется город, и нахваливает меня не переставая."
 carnival.1009.2_d.desc: "[craftsman_character.GetSheHe|U] всё больше молчит, а потом угрюмо признаёт, что в последнее время дела в городе идут не очень."
 carnival.1009.a: "[Select_CString(craftsman_character.IsFemale, 'Её', 'Его')] откровенность меня тронула. Буду стараться изо всех сил."
 carnival.1009.b: "Пошлю за стражей — пусть преподадут урок [Select_CString(craftsman_character.IsFemale, 'этой', 'этому')] невеже."
 carnival.1009.c: "«Ну так сделайте с этим что-нибудь, советник!»"
 carnival.1009.d: "Пора признаться, кто перед [Select_CString(craftsman_character.IsFemale, 'ней', 'ним')] сидит, и пообещать больше делать для города."
 carnival.1009.e: "Первая искренняя похвала за несколько месяцев."
 carnival.1009.f: "Я так и [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал')]! Только не надо утомлять меня делами города."
 carnival.1009.g: "Как и следовало ожидать. Пора бы уже поставить памятник в мою честь."
 carnival.1009.h: "Надо, чтобы [craftsman_character.Custom('CraftsmanDescOption')|l] [Select_CString(craftsman_character.IsFemale, 'высказалась', 'высказался')] начистоту."
 carnival.1009.i: "«Враждебные силы исподтишка вредят нашей республике, друг»."
 carnival.1009.j: "«Думаю, моё усердие достойно вознаграждения!»"
 carnival.1009.k: "«Наши успехи — это заслуга всей республики!»"
 carnival.1009.l: "Я киваю и продолжаю пить, а то [ROOT.Char.Custom('RegionalDrink')|l] стынет."
 carnival.1009.m: "Я здесь не для того, чтобы болтать. Я ищу драки!"
 carnival.1009.n: "«Научи меня своему ремеслу, [craftsman_character.Custom('CraftsmanDescOption')|l]!»"
 carnival.1009.o: "Предложить [Select_CString(craftsman_character.IsFemale, 'ей', 'ему')] работу через посредника."
 carnival.1009.p: "«Сегодня я угощаю, друг»."
 custom.carnival.1009.spreading_ill_rumors: "Каждый [Concept('courtier', 'придворный')|E] иной [Concept('culture', 'культуры')|E] или [Concept('faith', 'конфессии')|E]"
 custom.carnival.1009.shared_praise: "Каждый [Concept('courtier', 'придворный')|E]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U] [Select_CString(craftsman_character.IsLocalPlayer, 'получили', Select_CString(craftsman_character.IsFemale, 'получила', 'получил' ))] #V ремесленное#! [Concept('inspiration', 'вдохновение')|E]"
 carnival.1009.drunk.tt.toast: "Вы напиваетесь в стельку"
 carnival.1009.tasty.tt.toast: "М-м, какой вкус!"
 carnival.1009.skillup.tt.toast: "Вы кое-чему научились у мастера ремесла"
 carnival.1009.patron.tt.toast: "Приобретён помощник"
 carnival.1009.councilor.log_title: "Новый советник"
 carnival.1009.councilor.log: "[craftsman_character.GetShortUIName|U] [Select_CString(craftsman_character.IsLocalPlayer, 'назначены', Select_CString(craftsman_character.IsFemale, 'назначена', 'назначен' ))] на должность [Concept('councillor', 'советника')|E]"
 carnival.1009.recruiting.log_title: "[Select_CString(craftsman_character.IsFemale, 'Нанята', 'Нанят')] мастер-[craftsman_character.Custom('CraftsmanDescOption')|l]"
 carnival.1009.recruiting.log: "[carnival_main.GetFirstNameNoTooltip] [Select_CString(carnival_main.IsFemale, 'взяла', 'взял')] [Select_CString(craftsman_character.IsLocalPlayer, 'вас на службу', Concatenate('на службу мастера по имени ', craftsman_character.GetShortUIName))]"
 carnival.1009.learning_trade.log_title: "Урок от мастера ремесла"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip] [Select_CString(carnival_main.IsFemale, 'запомнила', 'запомнил')] наставления, которые [Select_CString(carnival_main.IsFemale, 'ей', 'ему')] [Select_CString(craftsman_character.IsFemale, 'преподала', 'преподал')] мастер-[craftsman_character.Custom('CraftsmanDescOption')|l]"
