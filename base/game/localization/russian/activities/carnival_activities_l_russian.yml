l_russian:
 activity_carnival: "Карнавал"
 activity_carnival_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U][Select_CString(ACTIVITY.GetOwner.IsLocalPlayer, 'карнавал', ' устраивает карнавал')]"
 activity_carnival_owner: "Устроитель"
 activity_carnival_desc: "Развлеките и успокойте горожан, устроив яркий карнавал! Подарите себе и своим подданным возможность забыть о сословиях и различиях, скрыть их под масками, веселиться и пировать!\n\nКаждый будет рад восславить историю и культуру вашей республики. Это отличная возможность показать свое богатство на зависть соперникам или затеряться в толпе и узнать подлинные мысли и тревоги народа."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$Можно получить [prestige_i][Concept('prestige', 'престиж')|E]\n$BULLET_WITH_TAB$Можно получить [piety_i][Concept('piety', 'благочестие')|E]\n$BULLET_WITH_TAB$[opinion_i|E][Concept('opinion', 'Мнение')|E] [Concept('activity_guest_short', 'гостей')|E] об участниках может улучшиться\n$BULLET_WITH_TAB$[stress_loss_i][Concept('stress', 'Стресс')|E] участников может уменьшиться\n$BULLET_WITH_TAB$Можно повысить [control_i|E][Concept('control', 'контроль')|E] в [Concept('county', 'графстве')|E]\n$BULLET_WITH_TAB$Можно повысить [prosperity_i|E][Concept('prosperity', 'процветание')|E] в [Concept('county', 'графстве')|E]\n$BULLET_WITH_TAB$Можно улучшить [popular_opinion_i|E][Concept('popular_opinion', 'народное мнение')|E]\n"
 activity_carnival_guest_help_text: "Карнавал — отличная возможность найти новых талантливых простолюдинов, завязать деловые знакомства или просто снизить [stress_loss_i][Concept('stress', 'стресс')|E]"
 activity_carnival_province_desc: "Вы устраиваете карнавал во владении [ROOT.Province.GetName]"
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Участники могут получить [Concept('prestige', 'престиж')|E]\n$BULLET_WITH_TAB$ Участники могут улучшить [Concept('opinion', 'мнение')|E] о других участниках\n$BULLET_WITH_TAB$ Участники могут уменьшить [stress_loss_i][Concept('stress', 'стресс')|E]"
 activity_carnival_conclusion_desc: "[GetActivityType( 'activity_carnival' ).GetName] завершён."
 activity_carnival_selection_tooltip: "Порадуйте народ весельем в масках\n\nОжидаемые награды:\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$[control_i|E] [control|E]\n$BULLET_WITH_TAB$[prosperity_i|E] [prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]"
 carnival_decoration_basic: "Простые декорации"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ Получение [Concept('prestige', 'престижа')|E] снижено\n\n#weak Город и без того красив, так ведь?#!"
 carnival_decoration_extensive: "Обильные декорации"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$ Получение [Concept('prestige', 'престижа')|E] на среднем уровне\n\n#weak Украсить город цветами, тканями и декорациями, которые перенесут горожан в страну чудес.#!"
 carnival_decoration_extravagant: "Экстравагантные декорации"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ Получение [Concept('prestige', 'престижа')|E] существенно увеличено\n\n#weak Перевернуть город с ног на голову, не жалеть средств на превращение улиц и площадей в страну чудес.#!"
 carnival_entertainment_basic: "Простые развлечения"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ Получение [Concept('popular_opinion', 'народного мнения')|E] снижено\n\n#weak Хватит парочки жонглёров и певца.#!"
 carnival_entertainment_extensive: "Обильные развлечения"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ Получение [Concept('popular_opinion', 'народного мнения')|E] на среднем уровне\n\n#weak Нанять труппу актёров, жонглёров, шутов и бардов для развлечения толпы.#!"
 carnival_entertainment_extravagant: "Экстравагантные развлечения"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ Получение [Concept('popular_opinion', 'народного мнения')|E] существенно увеличено\n\n#weak Заполнить площади артистами со всего света, чтобы поразить и удивить народ самыми разными экзотическими искусствами.#!"
 go_incognito_intent: "Пойти инкогнито"
 go_incognito_intent_desc: "Присоединиться к карнавалу в маске, чтобы незаметно смешаться с толпами.\n#EMP #low Узнать [secret_i] [Concept('secrets', 'секреты')|E] и действовать анонимно."
 flaunt_wealth_intent: "Блеснуть богатством"
 flaunt_wealth_intent_desc: "Нарядиться в богатые одежды и щедро разбрасываться деньгами при каждой возможности.\n#EMP #low Рост [prestige_i] [Concept('prestige', 'престижа')|E] и [popular_opinion_i] [Concept('popular_opinion', 'народного мнения')|E]"
 activity_carnival_host_an_a: "$host_activity_a$"
 carnival_base_cost: "Базовая стоимость"
 activity_carnival_destination_selection: ""
 carnival_option_decoration: "Карнавальные декорации"
 carnival_option_entertainment: "Карнавальные развлечения"
 carnival_phase: "$activity_carnival$"
 carnival_phase_desc: "Видеть свой народ, озаренный улыбками и смехом, — уже само по себе есть безмерная радость."
 carnival_conc_reward_title: "Карнавал завершается"
 carnival_conc_reward: "[ROOT.Char.GetShortUINameNoTooltip] [Select_CString(ROOT.Char.IsLocalPlayer, 'организовали', Select_CString(ROOT.Char.IsFemale, 'организовала', 'организовал' ))] хорошо удавшийся карнавал"
