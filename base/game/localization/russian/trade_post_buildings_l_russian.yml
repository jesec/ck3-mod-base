 trade_lodgings_05: "$building_type_trade_lodgings_01$ V"
 # Warehouse #
 building_type_trade_warehouse_01: "Склад"
 building_type_trade_warehouse_01_desc: "На каждом ящике, хранящемся на складе, стоит клеймо его владельца, и ни один груз не покинет склад без печати смотрителя."
 trade_warehouse_01: "$building_type_trade_warehouse_01$"
 trade_warehouse_02: "$building_type_trade_warehouse_01$ II"
