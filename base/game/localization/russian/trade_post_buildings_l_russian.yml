 trade_watchtower_05: "$building_type_trade_watchtower_01$ V"
 # Shipyard #
 building_type_trade_shipyard_01: "Верфь"
 building_type_trade_shipyard_01_desc: "Корабельные мастера верфи ремонтируют повреждённые суда, используя всё, что удаётся найти на местном рынке, поэтому каждый ремонт отличается от предыдущего."
 trade_shipyard_01: "$building_type_trade_shipyard_01$"
 trade_shipyard_02: "$building_type_trade_shipyard_01$ II"
