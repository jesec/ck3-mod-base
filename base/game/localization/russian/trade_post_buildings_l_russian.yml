 building_type_trade_secure_storeroom_01_desc: "В хранилище размещают самые ценные товары торгового поста. Стражникам щедро платят за охрану от воров и ещё щедрее — за то, чтобы они не задавали лишних вопросов."
 trade_secure_storeroom_01: "$building_type_trade_secure_storeroom_01$"
