 ##### Trade Post District #####
 trade_post_location_district: "Район торгового поста"
 trade_post_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods_i][Concept('trade_goods', 'Товары')|E]\n$BULLET_WITH_TAB$@trade_market_icon![Concept('trade_market', 'Торговый рынок')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('gold', 'Золото')|E]\n$BULLET_WITH_TAB$[alliance_i][Concept('alliance', 'Союз')|E]\n\n#low Открывает#!\n$BULLET_WITH_TAB$Позволяет @trade_route_icon!начинать [Concept('trade_routes', 'торговые пути')|E] с этого @trade_market_icon![Concept('trade_market', 'рынка')|E]"
 trade_post_location_district_desc_flavor: "Крупный торговый центр, где республики и состоятельные патриции предлагают и покупают товары и услуги."
 # Trade Office #
 building_type_pb_trade_office_01: "Торговая контора"
 building_type_pb_trade_office_01_desc: "Служащие торговой конторы регистрируют каждый груз, скрепляют печатями каждый договор и отправляют отчёты на родину с каждым отплывающим судном."
 pb_trade_office_01: "$building_type_pb_trade_office_01$"
 pb_trade_office_02: "$building_type_pb_trade_office_01$ II"
 pb_trade_office_03: "$building_type_pb_trade_office_01$ III"
 pb_trade_office_04: "$building_type_pb_trade_office_01$ IV"
 # Counting House #
 building_type_trade_counting_house_01: "Счётная палата"
 building_type_trade_counting_house_01_desc: "Служащие счётной палаты ведут учёт всех доходов и обязательств торгового поста, вплоть до последней монеты."
 trade_counting_house_01: "$building_type_trade_counting_house_01$"
 trade_counting_house_02: "$building_type_trade_counting_house_01$ II"
 trade_counting_house_03: "$building_type_trade_counting_house_01$ III"
 trade_counting_house_04: "$building_type_trade_counting_house_01$ IV"
 trade_counting_house_05: "$building_type_trade_counting_house_01$ V"
 # Treasury #
 building_type_trade_treasury_01: "Казначейство"
 building_type_trade_treasury_01_desc: "Через казначейство проходят монеты из десятков разных земель. Каждую взвешивают и сравнивают по стоимости с другими. Казначей распознаёт фальшивую монету по звону."
 trade_treasury_01: "$building_type_trade_treasury_01$"
 trade_treasury_02: "$building_type_trade_treasury_01$ II"
 trade_treasury_03: "$building_type_trade_treasury_01$ III"
 trade_treasury_04: "$building_type_trade_treasury_01$ IV"
 trade_treasury_05: "$building_type_trade_treasury_01$ V"
 # Recruitment Office #
 building_type_trade_recruitment_office_01: "Вербовочный пункт"
 building_type_trade_recruitment_office_01_desc: "На вербовочном пункте набирают солдат, моряков и стражников на службу на торговом посту сроком на сезон или на год."
 trade_recruitment_office_01: "$building_type_trade_recruitment_office_01$"
 trade_recruitment_office_02: "$building_type_trade_recruitment_office_01$ II"
 trade_recruitment_office_03: "$building_type_trade_recruitment_office_01$ III"
 trade_recruitment_office_04: "$building_type_trade_recruitment_office_01$ IV"
 trade_recruitment_office_05: "$building_type_trade_recruitment_office_01$ V"
 # Office of Foreign Stipendiaries #
 building_type_trade_mercenary_office_01: "Палата иноземных наёмников"
 building_type_trade_mercenary_office_01_desc: "Командиры наёмных отрядов обращаются в палату, чтобы договориться о жалованье, условиях службы и доле добычи. Каждый пункт договора оформляется в письменном виде, поскольку стороны друг другу не доверяют."
 trade_mercenary_office_01: "$building_type_trade_mercenary_office_01$"
 trade_mercenary_office_02: "$building_type_trade_mercenary_office_01$ II"
