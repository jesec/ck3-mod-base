 trade_shipyard_05: "$building_type_trade_shipyard_01$ V"
 # Merchant Guesthouse #
 building_type_trade_lodgings_01: "Купеческое подворье"
 building_type_trade_lodgings_01_desc: "Подворье предлагает приезжим купцам чистую постель, сундук с замком и горячую трапезу. Друзья торговой компании платят по справедливой цене, а все остальные — вдвое больше."
 trade_lodgings_01: "$building_type_trade_lodgings_01$"
 trade_lodgings_02: "$building_type_trade_lodgings_01$ II"
 trade_lodgings_03: "$building_type_trade_lodgings_01$ III"
