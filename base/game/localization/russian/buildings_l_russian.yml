 building_type_al_azhar_university: "Университет аль-Азхар"
 building_type_al_azhar_university_desc: "$building_type_generic_university_desc$\n\nУниверситет аль-Азхар получил свое имя в честь Фатимы, дочери Мухаммада, которую также звали «аль-Захра» (то есть «Освящающая»)."
 al_azhar_university: "$building_type_al_azhar_university$"
 al_azhar_university_desc: "$building_type_al_azhar_university_desc$"
 building_type_sankore_university: "Университет Санкоре"
 building_type_sankore_university_desc: "$building_type_generic_university_desc$\n\nУниверситет Санкоре изначально был мечетью, которая превратилась в учебное заведение после того, как имамы начали покупать книги у странствующих торговцев и собрали изрядную библиотеку."
 sankore_university: "$building_type_sankore_university$"
 sankore_university_desc: "$building_type_sankore_university_desc$"
 building_type_siena_university: "Университет Сиены"
 building_type_siena_university_desc: "$building_type_generic_university_desc$\n\nРасходы этого тосканского университета и его преподавателей оплачивает сама Сиена, которая ввела специальный налог на домовладельцев, сдающих квартиры студентам."
 siena_university: "$building_type_siena_university$"
 siena_university_desc: "$building_type_siena_university_desc$"
 building_type_nalanda_university: "Университет Наланды"
 building_type_nalanda_university_desc: "$building_type_generic_university_desc$\n\nУниверситет Наланды хранит кладезь ведической мудрости и привлекает студентов даже из далеких земель Китая и Тибета."
 nalanda_university: "$building_type_nalanda_university$"
 nalanda_university_desc: "$building_type_nalanda_university_desc$"
 building_type_rammelsberg_mines_01: "Рудник Раммельсберг"
 building_type_rammelsberg_mines_01_desc: "У подножия горы Раммельсберг построен богатый и весьма желанный во все времена серебряный рудник."
 rammelsberg_mines_01: "Поселение у Раммельсберга"
 rammelsberg_mines_01_desc: "Небольшой шахтерский поселок вырос неподалеку от рудоносных жил. Его жители уже приступили к добыче руды, но пока что буквально скребут по поверхности, не углубляясь в недра."
 rammelsberg_mines_02: "Рудник Раммельсберг"
 rammelsberg_mines_02_desc: "Поселение разрастается, растут и объемы добываемой руды. Благодаря умелым инженерам можно построить настоящий рудник."
 rammelsberg_mines_03: "Большой рудник Раммельсберг"
 rammelsberg_mines_03_desc: "Растут объемы производства, а вместе с ними — и сам рудник. Появляются новые входы и создаются все более глубокие и широкие шахты."
 rammelsberg_mines_04: "Комплекс рудников в Раммельсберге"
 rammelsberg_mines_04_desc: "Когда объемы добываемой руды выросли, вокруг поселения возникло несколько литейных цехов и плавилен. Искусство обработки металла местные жители впитывали с молоком матери, и вскоре слава об их мастерстве гремела по всему известному миру."
