 building_type_ratnapura_mines_01: "Ратнапурские рудники"
 building_type_ratnapura_mines_01_desc: "Ратнапура, город драгоценных камней — один из главных мировых источников рубинов и сапфиров. Веками эти богатства добывались и продавались торговцам Индийского субконтинента, Юго-Восточной Азии и Китая."
 ratnapura_mines_01: "Ратнапурские копи"
 ratnapura_mines_01_desc: "$building_type_ratnapura_mines_01_desc$"
 ratnapura_mines_02: "Ратнапурский рудник"
 ratnapura_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу драгоценных камней."
 ratnapura_mines_03: "Большой ратнапурский рудник"
 ratnapura_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадаются крупные камни."
 ratnapura_mines_04: "Комплекс рудников в Ратнапуре"
 ratnapura_mines_04_desc: "Добыча драгоценных камней достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_mogok_mines_01: "Шахты долины Могоу"
 building_type_mogok_mines_01_desc: "Долина Могоу славится своими рубинами и сапфирами, а также менее ценными камнями, в частности шпинелью и гранатом.\nНо еще сильнее, чем количество камней, «долину рубинов» отличает их качество. Добытые из земли насыщенно-красные камни переливаются в лучах солнца ярче любых других."
 mogok_mines_01: "Копи Могоу"
 mogok_mines_01_desc: "$building_type_mogok_mines_01_desc$"
 mogok_mines_02: "Шахта Могоу"
 mogok_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу драгоценных камней."
 mogok_mines_03: "Большая шахта Могоу"
 mogok_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадаются крупные камни."
 mogok_mines_04: "Комплекс рудников в Могоу"
 mogok_mines_04_desc: "Добыча драгоценных камней достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_zawar_mines_01: "Заварские рудники"
 building_type_zawar_mines_01_desc: "Уже несколько тысяч лет заварские рудники служат крупным источником свинца, цинка и серебра. Эти залежи уникальны не только объемом руд но и их четким разделением, что облегчает добычу определенного металла."
