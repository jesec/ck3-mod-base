 building_type_pansjhir_mines_01: "Панджшерские рудники"
 building_type_pansjhir_mines_01_desc: "Панджшерская долина известна, как источник серебра и изумрудов еще со времен Александра Македонского. Индуистские, буддистские, а потом и мусульманские династии добывали здесь серебро и чеканили монету."
