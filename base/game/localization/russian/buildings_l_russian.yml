 building_type_performance_stage_1: "$performance_stage$"
 building_type_performance_stage_1_desc: "На этих подмостках актеры разыгрывают старинные легенды и скабрезные истории, а порой и высмеивают местного лорда, почти не скрывая, о ком речь. Самому лорду обычно не смешно."
