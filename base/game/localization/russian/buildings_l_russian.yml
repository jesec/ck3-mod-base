 building_type_chihu_mines_01: "Железные рудники Чиху"
 building_type_chihu_mines_01_desc: "Рудники Чиху действуют со времен эпохи Троецарствия — в те годы там ковалось оружие для царства У. Богатые залежи железа и меди служат источником сырья для производства оружия и чеканки монет."
