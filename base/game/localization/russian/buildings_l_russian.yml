 building_type_mozu_tombs_desc: "$mozu_tombs_desc$"
 mozu_tombs: "Курганы Модзу"
 mozu_tombs_desc: "По преданию, расположенные в Модзу курганы в форме замочных скважин являются местом погребения императоров древности. Они служат ориентиром для кораблей, заходящих в близлежащую бухту, и напоминают морякам о былых временах."
 building_type_trosky_castle_01: "$trosky_castle_01$"
 building_type_trosky_castle_01_desc: "$trosky_castle_01_desc$"
 trosky_castle_01: "Замок Троски"
 trosky_castle_01_desc: "Замок Троски построен между двумя базальтовыми скальными образованиями, оставшимися после давно потухшего вулкана. Название замка происходит от формы скалы, напоминающей руины рухнувшего замка."
