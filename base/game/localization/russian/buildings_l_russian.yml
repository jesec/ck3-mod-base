 building_type_great_project_cathedral_02_desc: "$great_project_cathedral_02_desc$"
 great_project_cathedral_02: "Готический величественный собор"
 great_project_cathedral_02_desc: "[GetBuildingType('great_project_cathedral_01').GetName] и прежде поражал величием, а теперь высокие своды и окна с ажурными переплётами устремляют взор к небесам. Каменное кружево и стрельчатые арки венчают кровлю, преображённую в духе новой эпохи.\n\nЭффекты [Concept('building', 'здания')|E]: [GetDomicileBuilding('ecclesiastical_domicile_main_03').GetName] в [Concept('cathedral_complex', 'соборном комплексе')|E]"
 building_type_great_project_cathedral_03: "$great_project_cathedral_03$"
 building_type_great_project_cathedral_03_desc: "$great_project_cathedral_03_desc$"
 great_project_cathedral_03: "Пламенеющий готический величественный собор"
 great_project_cathedral_03_desc: "[GetBuildingType('great_project_cathedral_02').GetName] и без того поражал великолепием. Ажурные узоры, напоминающие языки пламени, и каменные завитки сделали его одним из великих храмов христианского мира.\n\nЭффекты [Concept('building', 'здания')|E]: [GetDomicileBuilding('ecclesiastical_domicile_main_04').GetName] в [Concept('cathedral_complex', 'соборном комплексе')|E]"
 only_one_charities_tt: "В [Concept('province', 'провинции')|E] нет другой #V бесплатной столовой#!: можно построить только одну — в #V религиозном анклаве#! или #V гильдейском районе#!"
 only_one_hospitals_tt: "В [Concept('province', 'провинции')|E] нет другой #V больницы#!: можно построить только одну — в #V религиозном анклаве#! или #V гильдейском районе#!"
 only_one_notary_tt: "В [Concept('province', 'провинции')|E] нет другой #V нотариальной конторы#!: можно построить только одну — в #V бюрократическом#! или в #V гильдейском районе#!"
 only_one_court_of_law_tt: "В [Concept('province', 'провинции')|E] нет другого #V суда#!: можно построить только один — в #V бюрократический районе#! или в #V гильдейском районе#!"
