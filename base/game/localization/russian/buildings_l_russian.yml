 building_type_generic_silver_mines_01: "Серебряные рудники"
 building_type_generic_silver_mines_01_desc: "Богатый серебряный рудник, постоянный источник драгоценного серебра."
 generic_silver_mines_01: "Поселение у серебряного рудника"
