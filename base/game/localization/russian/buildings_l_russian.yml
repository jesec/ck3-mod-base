 building_type_itoigawa_mines_01: "Итоигавские нефритовые рудники"
 building_type_itoigawa_mines_01_desc: "У подножия горы Медзе находится ущелье, через которое протекает река Котакигава. В нем добывают нефрит ярко-зеленого цвета — самый прекрасный в регионе, а может, и во всём мире."
