 building_type_brothels_1: "$brothels$"
 building_type_brothels_1_desc: "В этих домах без лишнего шума занимаются древнейшим ремеслом — как во всех городах с незапамятных времен. Здешние женщины знают столько городских тайн, сколько совету и не снилось."
