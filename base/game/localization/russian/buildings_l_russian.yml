 water_temples_4: "$water_temples$ IV"
 water_temples_5: "$water_temples$ V"
 building_water_temples_01: "Запруды и полевые святилища субака"
 building_water_temples_01_desc: "Небольшие запруды и земляные каналы соединяют рисовые чеки; в святилище совершают подношения и ведут учёт работ. Начинают приносить стабильные излишки, как и положено по обряду."
 building_water_temples_02: "Совет святилищ субака"
 building_water_temples_02_desc: "Несколько святилищ координируют работу расширенного «субака» по календарю распределения воды; споры и вопросы ремонта решаются сообща, что улучшает управление и урожаи."
 building_water_temples_03: "Сеть водных храмов"
 building_water_temples_03_desc: "Настоящая цепь водных храмов курирует синхронизированные циклы посадок и парования земель; вредителей становится меньше, производство растёт, а ритуальное благочестие крепнет."
 building_water_temples_04: "Обширные ландшафты водных храмов"
 building_water_temples_04_desc: "Всей системой орошения заведуют собрания при храмах; многочисленные террасы, шлюзы и регулярные празднества превращают эту провинцию в благочестивую житницу."
 building_type_stilted_granaries_01: "Свайные амбары"
 building_type_stilted_granaries_01_desc: "Крытые амбары, стоящие на четырёх или более сваях; идеальны для защиты от грызунов, хранения дани и снабжения дружин."
 building_stilted_granaries_01: "Амбар на столбах"
 building_stilted_granaries_01_desc: "Простой амбар на четырёх столбах, где в сухости хранится зерно и дань; деревенская стража в походе питается лучше."
 building_stilted_granaries_02: "Ряд амбаров"
 building_stilted_granaries_02_desc: "Ряд свайных амбаров с защитой от крыс и крытыми лестницами. Поступления зерна становятся стабильнее, а ополчение восстанавливается быстрее."
 building_stilted_granaries_03: "Резные свайные амбары"
 building_stilted_granaries_03_desc: "Резьба символизирует изобилие; управители совмещают запасы и пайки для более долгих походов."
 building_stilted_granaries_04: "Амбарный двор"
 building_stilted_granaries_04_desc: "Огороженный комплекс со сторожевой вышкой и учётным сараем; продовольственная безопасность стабилизирует всю округу."
 building_type_kora_kora_yards_01: "Верфи кора-кора"
 building_type_kora_kora_yards_01_desc: "Клановые навесы для каноэ и спуски для боевых каноэ с балансиром."
 kora_kora_yards: "$building_type_kora_kora_yards_01$"
 building_type_kora_kora_yards_1: "$kora_kora_yards$"
 building_type_kora_kora_yards_1_desc: "$building_type_kora_kora_yards_01_desc$"
 kora_kora_yards_1: "$kora_kora_yards$"
 kora_kora_yards_2: "$kora_kora_yards$ II"
 kora_kora_yards_3: "$kora_kora_yards$ III"
 kora_kora_yards_4: "$kora_kora_yards$ IV"
 kora_kora_yards_5: "$kora_kora_yards$ V"
 building_kora_kora_yards_01: "Навесы для каноэ"
 building_kora_kora_yards_01_desc: "Крытые спуски для вёсельных балансиров; команды тренируются для набегов на побережье и перемещения между островами."
 building_kora_kora_yards_02: "Клановая верфь"
 building_kora_kora_yards_02_desc: "Запасы древесины, волокон для такелажа и балансиров ускоряют постройку и ремонт; налётчики привозят трофеи и товары для меновой торговли."
 building_kora_kora_yards_03: "Верфь кора-кора"
 building_kora_kora_yards_03_desc: "Увеличенные корпуса, боевые платформы и сигнальные барабаны; патрулирование побережья и сезонные экспедиции становятся неотъемлемой частью жизни (и источником дохода)."
 building_kora_kora_yards_04: "Большой арсенал военных каноэ"
 building_kora_kora_yards_04_desc: "Хозяева верфей держат целые флотилии; спусковые дорожки, такелажные мастерские и плацы для сбора войск вселяют страх в соседей."
 building_type_idjang_forts_01: "Крепости иджанг"
 building_type_idjang_forts_01_desc: "Террасные племенные цитадели, укреплённые пункты на отрогах или холмах."
 idjang_forts: "$building_type_idjang_forts_01$"
 building_type_idjang_forts_1: "$idjang_forts$"
