 nishapur_mines_02: "Нишапурский рудник"
 nishapur_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу бирюзы."
 nishapur_mines_03: "Большой нишапурский рудник"
 nishapur_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадается высококачественная бирюза."
 nishapur_mines_04: "Комплекс рудников в Нишапуре"
 nishapur_mines_04_desc: "Добыча бирюзы достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_verespatak_mines_01: "Верешпатакские рудники"
 building_type_verespatak_mines_01_desc: "Золото в Трансильвании добывали еще во времена Римской империи. Настало время возобновить добычу."
