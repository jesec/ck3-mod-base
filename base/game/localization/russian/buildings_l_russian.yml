 bathhouses: "Бани"
 building_type_bathhouses_1: "$bathhouses$"
 building_type_bathhouses_1_desc: "Благодаря печам под полом вода в банях не остывает весь день. Для многих горожан час, проведенный здесь, — единственная за неделю возможность как следует отдохнуть."
