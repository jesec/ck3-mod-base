 building_type_taghaza_mines_01: "Соляные копи Тегазы"
 building_type_taghaza_mines_01_desc: "Из соляных копей Тегазы поступает большая часть соли Магриба и Западной Африки."
 taghaza_mines_01: "Тегазские копи"
 taghaza_mines_01_desc: "$building_type_taghaza_mines_01_desc$"
 taghaza_mines_02: "Тегазская шахта"
 taghaza_mines_02_desc: "Поселение разрастается, растут и объемы добываемой соли. Благодаря умелым инженерам можно построить настоящую шахту."
 taghaza_mines_03: "Большая тегазская шахта"
 taghaza_mines_03_desc: "Растут объемы производства, а вместе с ними — и сам шахтный комплекс. Появляются новые входы, и создаются всё более глубокие и широкие шахты."
 taghaza_mines_04: "Тагазский шахтный комплекс"
 taghaza_mines_04_desc: "Добыча соли растет, и к копям стекаются купцы и мастера со всего мира."
 building_type_ijil_mines_01: "Иджильские соляные копи"
 building_type_ijil_mines_01_desc: "Иджильские копи — одни из старейших соляных копей Африки и во многих смыслах один из первых перевалочных пунктов торговой сети, пересекающей всю Сахару."
 ijil_mines_01: "Иджильские копи"
 ijil_mines_01_desc: "$building_type_ijil_mines_01_desc$"
 ijil_mines_02: "Иджильская шахта"
 ijil_mines_02_desc: "Поселение разрастается, растут и объемы добываемой соли. Благодаря умелым инженерам можно построить настоящую шахту."
 ijil_mines_03: "Большая иджильская шахта"
 ijil_mines_03_desc: "Растут объемы производства, а вместе с ними — и сам шахтный комплекс. Появляются новые входы, и создаются всё более глубокие и широкие шахты."
 ijil_mines_04: "Иджилский шахтный комплекс"
 ijil_mines_04_desc: "Добыча соли растет, и к копям стекаются купцы и мастера со всего мира."
 building_type_turda_mines_01: "Турдские соляные копи"
 building_type_turda_mines_01_desc: "Крупные соляные копи Турды столетиями играют важную роль в экономике Трансильвании. Копи и соляной рынок — большой источник дохода для этих земель."
 turda_mines_01: "Турдские копи"
 turda_mines_01_desc: "$building_type_turda_mines_01_desc$"
 turda_mines_02: "Турдская шахта"
 turda_mines_02_desc: "Поселение разрастается, растут и объемы добываемой соли. Благодаря умелым инженерам можно построить настоящую шахту."
 turda_mines_03: "Большая турдская шахта"
 turda_mines_03_desc: "Растут объемы производства, а вместе с ними — и сам шахтный комплекс. Появляются новые входы, и создаются всё более глубокие и широкие шахты."
 turda_mines_04: "Турдский шахтный комплекс"
 turda_mines_04_desc: "Добыча соли растет, и к копям стекаются купцы и мастера со всего мира."
 building_type_wieliczka_mines_01: "Соляные копи в Величке"
 building_type_wieliczka_mines_01_desc: "Здешних обширных запасов соли хватит для снабжения всего региона. Её добыча обеспечит ему процветание на многие поколения."
 wieliczka_mines_01: "Копи в Величке"
 wieliczka_mines_01_desc: "$building_type_wieliczka_mines_01_desc$"
