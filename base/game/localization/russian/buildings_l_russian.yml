 building_type_phnom_dek_mines_01_desc: "Пномдек или «железная гора» — один из наиболее богатых источников железа в Юго-Восточной Азии, где этот металл встречается редко. В местных кузнях можно создать достаточно оружия и инструментов для целой империи."
