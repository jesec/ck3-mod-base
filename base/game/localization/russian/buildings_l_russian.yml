 building_type_hpakant_mines_01: "Пхаканские нефритовые рудники"
 building_type_hpakant_mines_01_desc: "У подножия лесистых холмов, где протекают извилистые реки и высятся известняковые хребты, тут и там мерцают нефритовые прожилки. Многие годы эти залежи, о которых не знали ни путешественники, ни купцы, были источником ценного зеленого камня для местных жителей."
