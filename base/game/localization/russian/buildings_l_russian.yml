 building_type_suvarnadvipa_mines_01_desc: "Суварнадвипа — «золотой остров», где расположен горный хребет Барисан. В его пещерах находятся большие залежи ценного металла. У подножия Барисана разбросаны небольшие поселки, где живут шахтеры, занимающиеся поиском и добычей золота."
