 building_type_zigong_mines_01: "Соляные шахты в Цзылюцзине и Гунцзине"
 building_type_zigong_mines_01_desc: "Вот уже тысячи лет, со времен династии Шан, здесь добывают соль из земных недр. Благодаря уникальным условиям местная добыча соли остается важнейшим фактором региональной экономики."
 zigong_mines_01: "Поселение у шахты в Цзылюцзине и Гунцзине"
