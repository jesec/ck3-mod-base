 building_type_trepca_mines_01_desc: "Трепча, расположенная на склонах Копаоника, — район, где добыча серебра велась с древнеримских времен. В раннем средневековье рудники были закрыты, но здесь до сих пор находятся очень богатые залежи драгоценных металлов."
