 NOT_holy_site_muslim_christian_or_holy_site_trigger: "Владетель должен либо быть мусульманином или христианином, либо считать это место [Concept( 'holy_site', 'святыней' )|E]"
 NOT_holy_site_muslim_or_zoroastrian_or_holy_site_trigger: "Владетель должен либо быть мусульманином или зороастрийцем, либо считать это место [Concept( 'holy_site', 'святыней' )|E]"
