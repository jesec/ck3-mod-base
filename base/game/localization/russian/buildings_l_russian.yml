 building_type_generic_gold_mines_01: "Золотые рудники"
 building_type_generic_gold_mines_01_desc: "Невероятно ценный и редкий золотой рудник, желанная добыча для любого из местных дворян."
 generic_gold_mines_01: "Поселение у золотых рудников"
