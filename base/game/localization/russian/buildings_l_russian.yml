 building_type_jiaodong_mines_01: "Цзяодунские рудники"
 building_type_jiaodong_mines_01_desc: "На полуострове Цзяодун находятся огромные запасы золота, которые еще предстоит освоить. Со временем полуостров станет одним из крупнейших горнодобывающих районов Китая."
