 building_type_great_project_cathedral_01_desc: "$great_project_cathedral_01_desc$"
 great_project_cathedral_01: "Романский величественный собор"
 great_project_cathedral_01_desc: "Один из первых каменных соборов, ставший кафедрой епископа и маяком для христианских паломников. Под тяжёлыми скруглёнными арками и величественными сводами верующих ждут святые реликвии и алтари.\n\nЭффекты [Concept('building', 'здания')|E]: [GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName] в [Concept('cathedral_complex', 'соборном комплексе')|E]"
 building_type_great_project_cathedral_under_construction: "Собор"
 building_great_project_cathedral_under_construction: "Строительство собора"
 building_great_project_cathedral_under_construction_desc: "Среди кранов и строительных лесов высится незавершённое строение из грубого камня, которое однажды станет религиозным центром."
