 building_type_powder_magazine_01: "Производитель пороха"
 building_type_powder_magazine_01_desc: "Порох требует особых условий производства, хранения и обслуживания, в противном случае он попросту приходит в негодность. Прежде чем нанимать войска, использующие порох, необходимо построить специальные сооружения для хранения этого вещества."
 powder_magazine_01: "Пороховой склад"
 building_powder_magazine_01_desc: "Склад, в котором можно безопасно хранить порох, защищая его от воздействия внешней среды и сводя к минимуму вероятность взрыва."
 building_powder_magazine_02: "Контора по перевозке пороха"
 building_powder_magazine_02_desc: "Специальные чиновники будут следить за надлежащим хранением и перевозкой опасного вещества."
 building_powder_magazine_03: "Серная шахта"
 building_powder_magazine_03_desc: "Запасы серы в земле огромны, но добывать их в больших объемах бывает нелегко. Шахта на месте серных залежей поможет обеспечит стабильное поступление ценного минерала."
 building_powder_magazine_04: "Селитровая мастерская"
 building_powder_magazine_04_desc: "Селитра — важный компонент для создания пороха. Чтобы производить ее в больших количествах и не спалить при этом все вокруг, нужны опытные мастеровые и подготовленная мастерская."
 building_powder_magazine_05: "Пороховые погреба"
 building_powder_magazine_05_desc: "Для хранения пороха нужны специальные укрепленные помещения, расположенные вдали от населенных районов и важных сооружений."
 building_powder_magazine_06: "Сторожка"
 building_powder_magazine_06_desc: "Порох сам по себе опасен, но, если он попадет к кому не следовало, опасность увеличится многократно. Следует выделить специальную охрану, что убережет порох от любопытных глаз."
 building_powder_magazine_07: "Мастерская по очистке пороха"
 building_powder_magazine_07_desc: "Отдельное здание, в котором разные компоненты объединяются в порох. Если случится несчастный случай, пострадать должно только это здание."
 building_powder_magazine_08: "Мастерская по производству ручниц"
 building_powder_magazine_08_desc: "Ручницы бывают ненадежны и порой раскалываются при стрельбе. Нужно раздобыть лучшее оборудование и нанять лучших мастеров, чтобы производить оружие высочайшего качества."
 powder_magazine_1_effect_desc: "$unlocks_building_desc$ ([Concept('gunpowder', 'порох')|E]) — предел вербовки [Concept('men_at_arms', 'профессионалов')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
 powder_magazine_2_effect_desc: "$unlocks_building_desc$ ([Concept('gunpowder', 'порох')|E]) — предел вербовки [Concept('men_at_arms', 'профессионалов')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_2')|0]#!"
 powder_magazine_3_effect_desc: "$unlocks_building_desc$ ([Concept('gunpowder', 'порох')|E]) — предел вербовки [Concept('men_at_arms', 'профессионалов')|E]: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 building_type_mandala_capital_01: "Главный храмовый комплекс"
 building_type_mandala_capital_01_desc: "Это [Concept('great_project','сооружение')|E] — не просто храм. Это памятник, который будет служить свидетельством нашего упорства и #EMP величия#!. Такой храм поистине достоин нашего праведного божественного девараджа."
 mandala_capital_01: "Украшенный храм"
 mandala_capital_01_desc: "Этот богато украшенный храм служит местом поклонения и молитв правящему девараджу."
 mandala_capital_02: "Величественный храм"
 mandala_capital_02_desc: "Изначальное здание главного храма было расширено, что позволило добавить дополнительные святилища, а также новые убранства и украшения."
 mandala_capital_03: "Храмовый участок"
 mandala_capital_03_desc: "К храму были добавлены новые залы, чтобы освоить прилегающую к нему территорию.\nТеперь внутри располагаются несколько святилищ для поклонения, а также помещения для прихожан, слуг и жрецов."
 mandala_capital_04: "Великий храмовый комплекс"
 mandala_capital_04_desc: "Храмовый комплекс достиг размера небольшой деревни и теперь способен в значительной степени обеспечивать себя всем необходимым.\nК храму был добавлен небольшой реликварий и зеркальные пруды, простирающиеся с востока на запад и символизирующие связь с духовным миром."
 mandala_capital_05: "Божественный храмовый дворец"
 mandala_capital_05_desc: "Последним дополнением к храмовому дворцу стали роскошные покои божественного девараджа. Теперь это настоящее архитектурное чудо.\nПутешественники приезжают отовсюду, лишь бы своими глазами увидеть великолепные памятники, украшения и реликвии, которыми славится этот храм."
 building_type_wulingyuan_01: "$wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$wulingyuan_01_desc$"
 wulingyuan_01: "Улинъюань"
 wulingyuan_01_desc: "В этом горном районе находятся тысячи огромных столбов из песчаника, возвышающихся над землей на сотни метров. Помимо необычных столбов здесь также есть множество других географических особенностей, включая ущелья, ручьи, небольшие озера и пещеры."
 building_type_leshan_giant_buddha_01: "$leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$leshan_giant_buddha_01_desc$"
 leshan_giant_buddha_01: "Статуя Будды в Лэшане"
 leshan_giant_buddha_01_desc: "Эта статуя Будды, высеченная в скале, обращена к месту слияния рек Миньцзян и Дадухэ, как бы приветствуя уставших от долгой дороги путников."
 building_type_yungang_grottoes_01: "$yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$yungang_grottoes_01_desc$"
 yungang_grottoes_01: "Гроты Юньган"
 yungang_grottoes_01_desc: "Большой комплекс храмовых гротов, состоящий из нескольких десятков крупных и сотен мелких пещер, внутри которых располагаются десятки тысяч статуй Будды."
 building_type_wudang_mountain_temples_01: "$wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$wudang_mountain_temples_01_desc$"
 wudang_mountain_temples_01: "Храмы в горах Уданшань"
 wudang_mountain_temples_01_desc: "Горы Уданшань входят в число священных гор, почитаемых в даосизме. Здесь находятся крупные храмовые комплексы, известные своими школами боевых искусств, в частности тайцзицюань."
 building_type_shaolin_monastery_01: "$shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$shaolin_monastery_01_desc$"
 shaolin_monastery_01: "Монастырь Шаолинь"
 shaolin_monastery_01_desc: "Шаолинь наиболее известен как место, где зародился один из стилей кунг-фу. Кроме освоения боевых искусств, послушники этого монастыря также изучают буддизм и переводят религиозные тексты."
 building_type_lingyin_temple_01: "$lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$lingyin_temple_01_desc$"
 lingyin_temple_01: "Храм Линъин"
 lingyin_temple_01_desc: "Храм Линъин был основан индийским монахом в 328 году н. э. для распространения буддизма. С тех пор храм стал значительно больше: на его территории находится несколько павильонов, большое количество гротов и пагод, а также общежития для размещения нескольких тысяч монахов."
 building_type_giant_wild_goose_pagoda_01: "$giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$giant_wild_goose_pagoda_01_desc$"
 giant_wild_goose_pagoda_01: "Большая пагода диких гусей"
 giant_wild_goose_pagoda_01_desc: "Большая пагода диких гусей была построена в 652 году н. э. для хранения буддистских текстов, фигурок и реликвий. Позже к изначальным пяти ярусам добавили еще пять, после чего пагода претерпела несколько реконструкций, которые в итоге сократили количество ярусов до семи."
 building_type_kaifeng_palace_01: "$kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$kaifeng_palace_01_desc$"
 kaifeng_palace_01: "Императорский дворец в Кайфыне"
 kaifeng_palace_01_desc: "Императорский дворец в Кайфыне был построен вскоре после того, как династия Сун объявила этот город своей столицей. Теперь в стенах дворца заседают сильные и опытные правители, которые гарантируют процветание не только города, но и всего королевства."
 kaifeng_examination_cost_bonus_desc: "Стоимость [Concept('activity', 'проведения')|E] [GetActivityType('activity_imperial_examination').GetTextIcon]#TOOLTIP:ACTIVITY_TYPE,activity_imperial_examination #L государственного экзамена#!#!, если это [Concept('barony', 'баронство')|E] является [Concept('realm_capital', 'столицей державы')|E]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuildingType('kaifeng_palace_01').GetName]"
 building_type_forbidden_city_01: "$forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$forbidden_city_01_desc$"
 forbidden_city_01: "Запретный город"
 forbidden_city_01_desc: "Запретный город — это огромный императорский дворец, состоящий из почти тысячи отдельных зданий. Весь комплекс окружен высокой стеной и глубоким рвом, защищающим правительство и чиновников, работающих во дворце."
 building_type_qianling_mausoleum_01: "$qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$qianling_mausoleum_01_desc$"
 qianling_mausoleum_01: "Мавзолей Цяньлин"
 qianling_mausoleum_01_desc: "В мавзолее Цяньлин захоронены император Гао-цзун, его жена и императрица У Цзэтянь, а также другие члены семьи Ли. Курган окружен прямоугольной стеной, а многочисленные каменные статуи, украшающие территорию мавзолея, являются одной из его главных достопримечательностей."
 building_type_quanzhou_seaport_01: "$quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$quanzhou_seaport_01_desc$"
 quanzhou_seaport_01: "Морской порт Цюаньчжоу"
 quanzhou_seaport_01_desc: "Порт Цюаньчжоу привлекает иноземных торговцев со всех концов света. Здесь бывали купцы из Аравии и Анатолии, Японии и Кореи и всех земель между ними. Наплыв торговых кораблей способствует процветанию местных предприятий и делает Цюаньчжоу главной верфью региона."
 building_type_angkor_wat_01: "$angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$angkor_wat_01_desc$"
 angkor_wat_01: "Ангкор-Ват"
 angkor_wat_01_desc: "Ангкор-Ват — это огромный храмовый комплекс, посвященный богу Вишну. Его конструкция олицетворяет пики горы Меру — дома дэвов в индуистской мифологии. Комплекс окружен внушительным рвом и имеет несколько галерей, украшенных религиозными фресками, рельефами и скульптурами."
 building_type_citadel_thang_long_01: "Цитадель Тханглонг" #昇龍
 building_type_citadel_thang_long_01_desc: "$citadel_thang_long_01_desc$"
 citadel_thang_long_01: "Цитадель Дайла"
 citadel_thang_long_01_desc: "Хорошо укрепленная крепость, которая служит пунктом дислокации для местных армий и помогает отражать нападения вражеских войск."
 citadel_thang_long_02: "Императорская цитадель Тханглонг" #昇龍
 citadel_thang_long_02_desc: "Императорская цитадель одновременно служит крепостью и резиденцией монарха. Этот комплекс включает три зоны: основное укрепление, императорский город и Запретный город."
 building_type_po_klong_garai_01: "$po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$po_klong_garai_01_desc$"
 po_klong_garai_01: "Храм По-Клонг-Гарай"
 po_klong_garai_01_desc: "Храм По-Клонг-Гарай — настоящий шедевр чамской архитектуры. Считается, что он был построен и назван в честь легендарного короля. Храм состоит из трех кирпичных башен, самую высокую из которых украшает скульптура бога Шивы."
 building_type_dau_temple_01: "$dau_temple_01$"
 building_type_dau_temple_01_desc: "$dau_temple_01_desc$"
 dau_temple_01: "Храм Дау"
 dau_temple_01_desc: "Почитаемый храм в Люилау, отмечающий место, где впервые собрались монахи из далёких земель. Кирпичная пагода, реликвии и мумифицированные наставники, остающиеся там, воплощают века преданности буддизму."
 building_type_liuhe_pagoda_01: "$liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$liuhe_pagoda_01_desc$"
 liuhe_pagoda_01: "Пагода Шести Гармоний"
 liuhe_pagoda_01_desc: "Величественная пагода, воздвигнутая правителями, чтобы усмирить приливы и воздать почести Будде. Она возвышается над землёй, символизируя гармонию между человеком и Небом."
 building_type_muaro_jambi_01: "$muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$muaro_jambi_01_desc$"
 muaro_jambi_01: "Комплекс Муаро-Джамби"
 muaro_jambi_01_desc: "Расположенный вдоль реки Хари, обширный кирпичный комплекс Муаро-Джамби защищал как торговлю, так и веру. Будучи оплотом Шривиджаи, он предоставлял убежище правителям и служил местом сбора армий в сердце Суматры."
 building_type_hanging_temple_01: "$hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$hanging_temple_01_desc$"
 hanging_temple_01: "Сюанькун-сы"
 hanging_temple_01_desc: "Сюанькун-сы — это монастырь, висящий на отвесной скале горы Хэн. Согласно легенде, много веков назад его строительство начал монах по имени Ляожань. Деревянные залы монастыря, стоящие на сваях, содержат святилища буддийских, даосских и конфуцианских мудрецов, смешивая верования и с изящным спокойствием бросая вызов высоте."
 building_type_pagoda_of_fogong_temple_01: "$pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$pagoda_of_fogong_temple_01_desc$"
 pagoda_of_fogong_temple_01: "Пагода Шакьямуни храма Фогун"
 pagoda_of_fogong_temple_01_desc: "Пагода храма Фогун — это высокая деревянная пагода, построенная без единого гвоздя. Девятиэтажное сооружение хранит священные реликвии и статуи, а продуманная конструкция остаётся чудом инженерной мысли и символом веры."
 building_type_plain_of_jars_01: "$plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$plain_of_jars_01_desc$"
 plain_of_jars_01: "Долина кувшинов"
 plain_of_jars_01_desc: "Долина кувшинов — это обширное плато, усеянное гигантскими каменными сосудами, чьё предназначение окутано тайной. Некогда использовавшиеся в древних обрядах, они сохранились как наследие забытого народа, вызывая благоговейный трепет и почтение у местных жителей."
 building_type_dieng_plateau_01: "$dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$dieng_plateau_01_desc$"
 dieng_plateau_01: "Плато Диенг"
 dieng_plateau_01_desc: "Плато Диенг — это окутанная туманами вулканическая низменность, усыпанная серными озёрами и испускающими газ дырами в земле. Тут и там по ней разбросаны древние храмы, а ритуальные легенды заставляют и бояться, и почитать это священное нагорье, где некогда обитали древние боги добра и зла."
 building_type_mount_apo_01: "$mount_apo_01$"
 building_type_mount_apo_01_desc: "$mount_apo_01_desc$"
 mount_apo_01: "Гора Апо"
 mount_apo_01_desc: "Возвышаясь над озером Венадо, гора Апо носит имя, которое на языке лумадов означает «почитаемый старейшина». Это сокращённая форма имени Апо Сандава, духа священной горы, также называемого «Старейшина Сандава» или «Дедушка Сандава». Обряды для Апо Сандавы проводит шаман племени, который считается проводником для духов предков."
 building_type_besakih_temple_01: "$besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$besakih_temple_01_desc$"
 besakih_temple_01: "Храм Бесаких"
 besakih_temple_01_desc: "Известный как «Главный храм Бали», Бесаких является самым значимым и священным индуистским храмовым комплексом острова. Он расположен на склонах горы Агунг, самого высокого вулкана и священной горы Бали. Это религиозное и культурное сердце острова, где проводятся грандиозные церемонии."
 building_type_gongsanseong_fortress_01: "$gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$gongsanseong_fortress_01_desc$"
 gongsanseong_fortress_01: "Крепость Консансон"
 gongsanseong_fortress_01_desc: "Крепость Консансон венчает холмы над рекой Кымган. Она была построена как королевская цитадель Пэкче, и её длинные стены и каменные ворота защищали как правителей, так и подданных, будучи горным оплотом династической власти и защиты."
 building_type_krakatoa_01: "$krakatoa_01$"
 building_type_krakatoa_01_desc: "$krakatoa_01_desc$"
 krakatoa_01: "Кракатау"
 krakatoa_01_desc: "Кракатау — мощный вулкан, расположенный на Малайском архипелаге."
 building_type_borobudur_01: "$borobudur_01$"
 building_type_borobudur_01_desc: "$borobudur_01_desc$"
 borobudur_01: "Боробудур"
 borobudur_01_desc: "Боробудур — это огромный буддийский храм, представляющий собой восьмиярусную ступу, выполненную в форме мандалы. Храм украшен тысячами сложных рельефов и сотнями статуй Будды."
 building_type_hoshi_ryokan_01: "$hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$hoshi_ryokan_01_desc$"
 hoshi_ryokan_01: "Рекан Хоси"
 hoshi_ryokan_01_desc: "Хоси — традиционная японская гостиница, которой на протяжении многих поколений управляет одна семья. Здесь путники могут отдохнуть, перекусить и искупаться в горячем источнике."
 building_type_celestial_great_barracks_01: "Великие казармы"
 building_type_celestial_great_barracks_01_desc: "Эта огромная крепость с казармами обеспечивает местного наместника солдатами для пополнения армий и значительно усиливает оборону окрестных земель. После расширения она превращается в полноценный город-крепость. Когда гражданские чиновники не справляются, город-крепость берёт на себя управление провинцией, её оборону и снабжение."
 celestial_great_barracks_01: "$building_type_celestial_great_barracks_01$"
 building_celestial_great_barracks_01_desc: "Эти огромные казармы позволяют местному правительству содержать здесь крупное войско, а крепость облегчает оборону окружающих земель."
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] не военный [Concept('governor', 'губернатор')|E]"
 celestial_great_barracks_great_project_only_desc: "Можно построить только после завершения [Concept('great_project', 'грандиозного проекта')|E] «[GetGreatProjectType('construct_great_barracks').GetName]»"
 building_type_the_great_wall_01: "$the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$the_great_wall_01_desc$"
 the_great_wall_01: "Великая стена"
 the_great_wall_01_desc: "Это самый старый участок Великой стены, большая часть которого была построена в период Цинь. С годами камни заметно источились, однако укрепление по-прежнему выполняет свою роль."
 building_type_the_great_wall_02: "$the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$the_great_wall_02_desc$"
 the_great_wall_02: "Великая стена"
 the_great_wall_02_desc: "Во время правления династии Хань стена была значительно расширена на запад, простираясь через горы и пустыни на многие сотни километров."
 building_type_the_great_wall_03: "$the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$the_great_wall_03_desc$"
 the_great_wall_03: "Великая стена"
 the_great_wall_03_desc: "Династии Вэй, Ци и Суй достраивали стену в V–VI веках н. э., совершенствуя некоторые ее участки с помощью улучшенных укреплений."
 building_type_the_great_wall_04: "$the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$the_great_wall_04_desc$"
 the_great_wall_04: "Великая стена"
 the_great_wall_04_desc: "Эта гигантская стена — поистине внушительное сооружение, которое многократно расширялось с момента его основания в III веке до н. э. Ныне же стена простирается на тысячи километров, а вдоль нее расположено множество сторожевых башен, казарм и застав. Едва ли каким-то варварам под силу преодолеть такое серьёзное препятствие..."
 building_type_the_great_wall_shanhai_pass: "$the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 the_great_wall_shanhai_pass: "$the_great_wall_04$"
 the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 the_great_wall_liaodong: "$the_great_wall_04$"
 the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 special_building_improve_silk_road: "Когда эта [Concept('special_building', 'особая постройка')|E] будет завершена, она приблизит [Concept('situation_sub_region', 'область')|E] [sub_region_temp.GetName] к [Concept('situation_phase', 'фазе ситуации')|E] [Concept('silk_road', 'Шелкового пути')|E] «[Concept('situation_silk_road_phase_exceptional_bounty', 'Исключительная награда')|E]» #weak (если она еще не наступила)#!"
 building_type_herat_bazaar_01: "$herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$herat_bazaar_01_desc$"
 herat_bazaar_01: "Базар Герата"
 herat_bazaar_01_desc: "Герат славится своими оживленными рынками еще со времен древних Ахеменидов, когда этот регион был известен под названием #italic Арейа#!. Бесчисленные караваны, которые проходят через город, называют его жемчужиной Хорасана."
 herat_bazaar_02: "Большой базар Герата"
 herat_bazaar_02_desc: "На рынках Герата кипит жизнь, и сегодня жемчужина Хорасана сверкает ярче, чем самые изысканные драгоценности на монарших коронах."
 building_type_tabriz_bazaar_01: "$tabriz_bazaar_01$"
 building_type_tabriz_bazaar_01_desc: "$tabriz_bazaar_01_desc$"
 tabriz_bazaar_01: "Базар Тебриза"
 tabriz_bazaar_01_desc: "Старинный рынок Тебриза с незапамятных времён служит крупным центром торговли. Его стены украшены цветной плиткой и штукатуркой, которые свидетельствуют о богатстве и престиже этого древнего места."
 tabriz_bazaar_02: "Большой базар Тебриза"
 tabriz_bazaar_02_desc: "С годами древний рынок Тебриза ничуть не утратил своей оживлённости, а напротив, стал ещё более пышным и многолюдным базаром."
 building_type_gurganj_bazaar_01: "$gurganj_bazaar_01$"
 building_type_gurganj_bazaar_01_desc: "$gurganj_bazaar_01_desc$"
 gurganj_bazaar_01: "Базар Гургенча"
 gurganj_bazaar_01_desc: "Оживлённый город Гургенч называют вратами степи. Он славится обилием торговцев и путешественников, стремящихся заработать или завоевать богатства в приграничных землях."
 gurganj_bazaar_02: "Большой базар Гургенча"
 gurganj_bazaar_02_desc: "Под палящим солнцем кочевники, торговцы и авантюристы зарабатывают богатства, и поток экзотических монет хуанди из далекого Китая поддерживает торговлю."
 building_type_lhasa_market_01: "$lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$lhasa_market_01_desc$"
 lhasa_market_01: "Тхром Лхасы"
 lhasa_market_01_desc: "На главном перекрестке между Индией и Китаем в тени величественного дворца Потала торговцы на все лады привлекают внимание путешественников."
 lhasa_market_02: "Обширный тхром Лхасы"
 lhasa_market_02_desc: "Нет ничего нового под солнцем, так утверждают торговцы Лхасы, и нет таких безделушек и драгоценностей, каких бы они не видели на Шелковом пути."
 building_type_changan_market_01: "$changan_market_01$"
 building_type_changan_market_01_desc: "$changan_market_01_desc$"
 changan_market_01: "Рынок Чанъаня"
 changan_market_01_desc: "Рынки великого города Чанъаня, #EMP «долгого мира»#!, полны торговцев всех мастей, и почти вся торговля с Китаем так или иначе проходит через них."
 changan_market_02: "Большой рынок Чанъаня"
 changan_market_02_desc: "Богатых торговцев из Чанъаня больше не удивляют никакие сокровища — они уже успели повидать самые изысканные драгоценности этого мира, и даже приобрести некоторые из них."
 building_type_dunhuang_market_01: "$dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$dunhuang_market_01_desc$"
 dunhuang_market_01: "Рынок Дуньхуана"
 dunhuang_market_01_desc: "Город Дуньхуан стоит на берегах реки Шулэ и служат вратами между коридором Хэси и Таримской впадиной и является важной остановкой для всех, кто путешествует между ними."
 dunhuang_market_02: "Большой рынок Дуньхуана"
 dunhuang_market_02_desc: "Опаленные солнцем улицы Дуньхуана видели лишь вялое движение бесчисленных навьюченных верблюдов, мулов и людей, движущихся на восток и на запад."
 building_type_lahur_bazaar_01: "$lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$lahur_bazaar_01_desc$"
 lahur_bazaar_01: "Базар Лахора"
 lahur_bazaar_01_desc: "Старый город Лахор возник рядом с двумя крупными рынками, которые были окружены жилищами и длинной глиняной стеной. Торговля в этом месте процветает с древних времен, и, вероятно, в обозримом будущем город продолжит расти и развиваться."
 lahur_bazaar_02: "Большой базар Лахора"
 lahur_bazaar_02_desc: "Через Лахор рекой текут богатства. Местные рынки изобилуют самыми разными товарами, а в глазах торговцев проглядывается огромная жизненная мудрость, накопленная за годы общения с бесчисленным множеством покупателей и караванщиков."
 building_type_hamadan_bazaar_01: "Базар Хамадана"
 building_type_hamadan_bazaar_01_desc: "$hamadan_bazaar_01_desc$"
 hamadan_bazaar_01: "Базар Хамадана"
 hamadan_bazaar_01_desc: "Хамадан, являющийся родиной древнего мидийского народа, стал центром торговли задолго до того, как клинопись и глиняные таблички вышли из употребления. С тех пор за прилавками местного рынка стояли сотни поколений купцов, продававших здесь свои товары."
 hamadan_bazaar_02: "Большой базар Хамадана"
 hamadan_bazaar_02_desc: "Рынок Хамадана процветает, принося городу огромные богатства, каких он не знавал за всю свою долгую историю."
 building_type_sunday_bazaar_01: "Воскресный базар"
 building_type_sunday_bazaar_01_desc: "$sunday_bazaar_01_desc$"
 sunday_bazaar_01: "Воскресный базар"
 sunday_bazaar_01_desc: "Местные жители шутят, что деньги еще даже не были изобретены, а в Кашгаре уже был воскресный базар. Прогуливаясь среди местных прилавков, у многих возникает ощущение, что это место и вправду существует с самого начала времен."
 sunday_bazaar_02: "Большой воскресный базар"
 sunday_bazaar_02_desc: "Воскресный базар Кашгара существует уже многие века, однако прошлые поколения торговцев и не могли мечтать о том богатстве, которым это место славится сегодня."
 building_type_mount_fuji_01: "Гора Фудзи"
 building_type_mount_fuji_01_desc: "Одинокая снежная вершина Фудзи-сан отмечает собой путь в восточную Японию. Слава о ней ходит по всем островам, гора манит к себе путников и паломников, дарует спокойствие всякому, кто любуется ей. Фудзи — одна из главных гор в синтоизме, на ней обитает ее богиня #EMP Коноханасакуя-химэ#!, символ сакуры и мимолетности жизни."
 mount_fuji_01: "$building_type_mount_fuji_01$"
 mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 building_type_waterworks_01: "Водопользование"
 building_type_waterworks_01_desc: "Вода — основа жизни. Стабильный источник воды и ее эффективное использование необходимы для поддержания сильной державы и сильной власти."
 waterworks_01: "Искусственные пруды"
 building_waterworks_01_desc: "Первым шагом в водопользовании является наличие этой самой воды. Простое углубление, обложенное глиной, создает естественный резервуар для накопления запасов воды."
 building_waterworks_02: "Резервуары"
 building_waterworks_02_desc: "Более глубокие колодцы, менее проницаемое покрытие и простые крыши — одного этого достаточно для создания мест, где воду можно хранить в большем количестве, дольше и с меньшим риском загрязнения или испарения."
 building_waterworks_03: "Горизонтальные каналы"
 building_waterworks_03_desc: "Наличие рвов между местами хранения воды делает ее более доступной для нужд народа. Это помогает снизить риск затопления во время изобилия воды и при этом обеспечивает водой людей, скот и растения во время засух. При правильном планировании по таким каналам даже смогут ходить небольшие лодки."
 building_waterworks_04: "Ирригационные баки"
 building_waterworks_04_desc: "С помощью насыпей любой холм, любую неровность или перепад высоты можно превратить в место для хранения воды. Если соединить их каналами, можно будет перенаправлять воду между такими открытыми хранилищами, что обеспечивает куда больший контроль над объемом хранящейся воды и ее использованием."
 building_waterworks_05: "Ступенчатые колодцы"
 building_waterworks_05_desc: "Контроль воды можно совместить с простым копанием колодцев и вырыть в земле поистине выдающиеся сооружения, в которых всегда будет какое-то количество воды. Эти подземные резервуары можно соединить с наземными шлюзами и каналами, чтобы наполнить их водой или перенаправить воду туда, где она нужнее."
 building_waterworks_06: "Шлюзы на канале"
 building_waterworks_06_desc: "С помощью ворот и сливов можно контролировать даже глубины каналов. Накопленную за этими шлюзами воду можно использовать, чтобы сделать каналы судоходными для барж и небольших кораблей, тем самым превратив их в удобные транспортные артерии."
 building_waterworks_07: "Искусственные озера"
 building_waterworks_07_desc: "Колоссальный резервуар способен вмещать колоссальное количество воды. Питаемые реками и каналами искусственные озера могут обеспечить водой обширные пахотные земли и множество деревень. Благодаря своим размерам такие озера считаются символами престижа и могут служить местами поклонения и центрами управления."
 building_waterworks_08: "Системы притоков и стоков"
 building_waterworks_08_desc: "Благодаря трубам и насосам вода может течь и вверх, и вниз, что позволяет поднимать воду на высочайшие башни и смывать отходы в глубочайшие выгребные ямы. Не должно быть мест, страдающих от нехватки воды, а любые излишки должны отводиться до того, как они обернутся потопом."
 building_type_spice_plantation_01: "Плантации пряностей"
 building_type_spice_plantation_01_desc: "Лучшие ароматы и самые изысканные вкусы можно получить с помощью растений, произрастающих в нескольких отдельных регионах мира. Редкость и качество делают их крайне привлекательными культурами. Главное, чтобы они могли расти на этой земле."
 building_spice_plantation_01: "Добыча пряностей"
 building_spice_plantation_01_desc: "Некоторые деревья, кусты и цветы являются естественными источниками пряностей. Самое сложное #italic найти#! эти растения."
 building_spice_plantation_02: "Возделанные пряные рощи"
 building_spice_plantation_02_desc: "Самые востребованные пряности можно культивировать при правильных условиях, с применением правильного труда под правильным надзором правильных надзирающих."
 building_spice_plantation_03: "Пряные сады"
 building_spice_plantation_03_desc: "Посадка растений ровными рядами на большой площади позволит год за годом получать предсказуемое количество пряностей."
 building_spice_plantation_04: "Сушка пряностей"
 building_spice_plantation_04_desc: "Если рядом с плантациями выделить место под просушку пряностей до их отправки, то куда большая часть урожая не успеет испортиться перед отправкой, что сэкономит нам немало денег."
 building_spice_plantation_05: "Мельницы пряностей"
 building_spice_plantation_05_desc: "Молотые пряности рискуют быстрее испортиться, но их гораздо удобнее хранить. Мельницы также могут помочь с отсеиванием, что повысит чистоту продукта."
 building_spice_plantation_06: "Поместья пряностей"
 building_spice_plantation_06_desc: "Объединив жилища рабочих, дома для обработки и склады пряностей на участке вблизи места их произрастания, мы сможем добывать и продавать куда больше пряностей с меньшими затратами."
 building_spice_plantation_07: "Обработка земли под плантации"
 building_spice_plantation_07_desc: "Саму землю можно изменить, чтобы увеличить площади для выращивания урожая. Террасы и каналы открывают новые возможности выращивать больше растений."
 building_spice_plantation_08: "Промышленное производство пряностей"
 building_spice_plantation_08_desc: "При правильном руководстве всю землю можно использовать для производства самых дорогих пряностей. Каждое посаженное дерево, каждый выращенный куст, каждый собранный лист и каждый высушенный орех — это еще одна монета в казну."
 building_type_examination_hall_01: "Зал для экзаменов"
 building_type_examination_hall_01_desc: "Государственные экзамены нельзя провести, если нет места для их проведения. Местный губернатор обязан удостовериться, что у чиновников есть все необходимые ресурсы, чтобы должным образом провести экзамены, а экзаменуемые получают всю необходимую поддержку и не имеют возможностей жульничать."
 examination_hall_01: "$building_type_examination_hall_01$"
 building_examination_hall_01_desc: "Для испытания кандидатов на государственные должности необходимо место, где это испытание можно провести. Отдельная комната для сдачи экзаменов — это не так уж и много, но надо же с чего-то начинать."
 examination_hall_02: "$building_type_examination_hall_01$ II"
 building_examination_hall_02_desc: "Краткая молитва может укрепить уверенность экзаменуемых куда лучше, чем вся учеба и подготовка в мире."
 examination_hall_03: "$building_type_examination_hall_01$ III"
 building_examination_hall_03_desc: "Комплекс лекториев, залов для экзаменов, кабинетов и хранилищ обеспечивает всё необходимое для проведения любой части государственного экзамена надлежащим образом и с должной эффективностью."
 examination_hall_04: "$building_type_examination_hall_01$ IV"
 examination_hall_05: "$building_type_examination_hall_01$ V"
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "Снижены затраты на [Concept('activities', 'проведение')|E] [GetActivityType('activity_imperial_examination').GetTextIcon] #TOOLTIP:ACTIVITY_TYPE,activity_imperial_examination #L государственного#!#! и [GetActivityType('activity_local_examination').GetTextIcon] #TOOLTIP:ACTIVITY_TYPE,activity_local_examination #L провинциального экзамена#!#! в этом [Concept('holding', 'владении')|E]: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "В этом месте есть $building_type_examination_hall_01$"
 building_can_benefit_requirements: "#S Если вы отвечаете требованиям:#!\n"
 rebuilding_grants_full_benefits: "#S После [Concept('rebuilding', 'восстановления')|E]:#!\n"
 building_requirements_header: "#S Требования:#!\n"
 building_fallback: "#S Если вы не отвечаете требованиям:#!\n"
 building_effects_header: "#S Эффекты:#!\n"
 building_type_citadel_shrine_01: "Святилище-цитадель"
 building_type_citadel_shrine_01_desc: "$building_type_temple_citadel_01$ требует места, где можно было бы поклоняться богам. Святость, исходящая из святилища, дарует покой любой измученной душе, хоть гражданской, хоть солдатской."
 building_citadel_shrine_01: "Башня-прасада"
 building_citadel_shrine_01_desc: "$building_type_temple_citadel_01$ увенчан прасадой, что придает святилищу узнаваемый силуэт и позволяет любоваться им издалека."
 building_citadel_shrine_02: "Шпиль-пранг"
 building_citadel_shrine_02_desc: "Пранг, богато украшенный резьбой, возвышается над строением, визуально добавляя высоты. Им приятно любоваться во время молитвы, безмолвной или произносимой вслух."
 building_citadel_shrine_03: "Божественная скульптурная группа"
 building_citadel_shrine_03_desc: "Статуи неотрывно смотрят в пространство, размышляя о вечности и порой пробуждая самые разные эмоции в верующих."
 building_citadel_shrine_04: "Статуи сингх"
 building_citadel_shrine_04_desc: "$building_type_temple_citadel_01$ и те, кто пришел туда, находятся под защитой яростных стражей-львов со злобным оскалом и глазами навыкате."
 building_citadel_shrine_05: "Стражи-наги"
 building_citadel_shrine_05_desc: "Эти семиголовые змеи, искусно вырезанные из песчаника и украшенные мандалами на груди, обеспечивают мир и процветание обитателям святилища."
 building_citadel_shrine_06: "Барельефы"
 building_citadel_shrine_06_desc: "Посетители часто останавливаются, чтобы рассмотреть в мельчайших подробностях эти барельефы, изображающие как яростные битвы, так и божественные миры и мифы о сотворении."
 building_citadel_shrine_07: "Реликварии"
 building_citadel_shrine_07_desc: "$building_type_temple_citadel_01$ — настоящий клад, самая большая коллекция различных религиозных статус и объектов."
 building_citadel_shrine_08: "Изображение девараджи"
 building_citadel_shrine_08_desc: "Божественное Существо, застывшее в величественной позе, принимает молитвы и поклонения от верующих, даруя им за это свое благословение."
 building_type_sacred_pool_01: "Священный пруд"
 building_type_sacred_pool_01_desc: "У такого большого водоема может быть много предназначений, но очевидно, что с ходом времен визуальный феномен, отражаемый в нем, становится по-настоящему трансцендентным. Подобные пруды дают не только воду, но и защиту, они играют большую роль в жизни местных обитателей."
 sacred_pool_01: "Пруд с лотосом"
 building_sacred_pool_01_desc: "Гармоничный пруд, поражающий зрителей своей красотой и спокойствием. У него проводятся разные события духовного толка."
 sacred_pool_02: "Священный водоем"
 building_sacred_pool_02_desc: "Став больше, этот священный водоём привлекает к себе живность. Животный и растительный мир символизируют собой круговорот жизни."
 building_sacred_pool_03: "Бассейн"
 building_sacred_pool_03_desc: "Здесь проводятся церемонии и ритуалы. Этот водоем олицетворяет собой роскошь местного правителя."
 building_sacred_pool_04: "Ров"
 building_sacred_pool_04_desc: "$building_type_sacred_pool_01$ окружает собой место поклонения и дает обитателям защиту от потенциального противника, а с ней и спокойствие."
 building_sacred_pool_05: "Малый барай"
 building_sacred_pool_05_desc: "Львы-стражи охраняют спокойные воды барая от любых захватчиков."
 sacred_pool_06: "Барай"
 building_sacred_pool_06_desc: "$sacred_pool_06$, протянувшийся с востока на запад, — величественное зрелище. Статуи змей следят за его внешним периметром."
 building_sacred_pool_07: "Большой барай"
 building_sacred_pool_07_desc: "Этот величественный водоем, окруженный статуями, пышной растительностью и роскошной природой, дает местным жителям прохладу и воду в периоды изнурительной жары."
 building_sacred_pool_08: "Священный барай"
 building_sacred_pool_08_desc: "Путники и прочие прохожие часто пораженно останавливаются перед этим рукотворным водоемом: он настолько широк, что едва можно различить другой берег. Такой размах — завет божественной природы барая."
 building_type_vihara_halls_01: "Вихары"
 building_type_vihara_halls_01_desc: "Здание, построенное, чтобы укрывать монахов в сезон дождей. Место тихой медитации, молитвы и отдыха. Расширение чертогов свидетельствует об упорстве и преданности монахов своему делу."
 vihara_halls_01: "Святилище для молитвы"
 building_vihara_halls_01_desc: "$vihara_halls_01$ предлагает посетителям место для поклонения и размышления."
 building_vihara_halls_02: "Библиотека писаний"
 building_vihara_halls_02_desc: "В стенах библиотеки хо трай хранятся как старинные, так и новые писания. Посетители могут просвещаться и духовно обогащаться, сколько душе угодно."
 building_vihara_halls_03: "Молельни с колоннами"
 building_vihara_halls_03_desc: "Величественные колоннады возвышаются над молельнями, на колонны нанесены религиозные рисунки и витиеватые надписи."
 building_vihara_halls_04: "Мандапа"
 building_vihara_halls_04_desc: "Этот зал с колоннами так огромен, что отлично подходит для публичных ритуалов и прочих религиозных церемоний."
 building_vihara_halls_05: "Павильон-шала"
 building_vihara_halls_05_desc: "Павильон, окруженный зеленью. Его красота может сравниться лишь с его же духовностью."
 building_vihara_halls_06: "Камни сима"
 building_vihara_halls_06_desc: "$building_type_vihara_halls_01$ включает в себя и специальные пограничные камни сима, они помогают служителям определить подходящие размеры для зала, где монахи будут отправлять свои религиозные ритуалы."
 vihara_halls_07: "Колокольня"
 building_vihara_halls_07_desc: "$building_type_vihara_halls_01$ венчает величественная колокольня, она блестит на солнце днём и видна издалека ночью."
 building_vihara_halls_08: "Великие чертоги"
 building_vihara_halls_08_desc: "Большие и удобные чертоги привлекают странствующих монахов из далеких земель. Эти монахи помогают обмениваться идеями и распространять священное учение в соседние царства."
 building_type_itsukushima_jinja_01: "$itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$itsukushima_jinja_01_desc$"
 itsukushima_jinja_01: "Святилище Ицукусима" #厳島神社
 itsukushima_jinja_01_desc: "Галереи святилища Ицукусима-дзиндзя, возведенного в VI веке в честь синтоистских богинь моря и бурь, высятся над водой и смотрят на знаменитые ворота-тории, которые словно парят над заливом Мацусима."
 itsukushima_jinja_02: "$itsukushima_jinja_01$"
 itsukushima_jinja_02_desc: "$itsukushima_jinja_01_desc$"
 building_type_heian_palace_01: "$heian_palace_01$"
 building_type_heian_palace_01_desc: "$heian_palace_01_desc$"
 heian_palace_01: "Дворец Хэйан" #平安宮
 heian_palace_01_desc: "Обширный дворцовый комплекс, возведенный при императоре Камму в центре его великого города Хэйан-кё («Мирной столицы»), вмещает в себя императорский двор и резиденцию, а также здания министерств Японии. Его коридоры полны церемониальности, политики и интриг, старинные благородные семьи сражаются там за влияние."
 building_type_ise_jingu_01: "$ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$ise_jingu_01_desc$"
 ise_jingu_01: "Святилище Исэ" #伊勢神宮
 ise_jingu_01_desc: "Святилище Исэ-дзингу посвящено богине Солнца #EMP Аматэрасу#!, оно считается одной из главных святынь синтоизма. Святилище вмещает в себя императорские регалии Ямато, распоряжается в нем главная жрица-сайгу, выбираемая из членов семьи императора."
 building_type_kofuku_ji_01: "$kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$kofuku_ji_01_desc$"
 kofuku_ji_01: "Храм Кофуку" #興福寺
 kofuku_ji_01_desc: "Храм Кофуку-дзи, чья история восходит к VII веку, — один из Семи великих храмов Нары, он числится среди самых старых и важных центров буддистской мысли во всей Японии."
 building_type_enryaku_ji_01: "$enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$enryaku_ji_01_desc$"
 enryaku_ji_01: "Храм Энряку" #延暦寺
 enryaku_ji_01_desc: "Основанный монахом Сайтё в конце VIII века, Энряку-дзи расположен на горе Хиэй, откуда открывается вид на город Хэйан-кё, ныне известный как Киото. Этот храм является центром японской школы буддизма Тэндай."
 building_type_dazaifu_01: "$dazaifu_01$"
 building_type_dazaifu_01_desc: "$dazaifu_01_desc$"
 dazaifu_01: "Контора Дадзайфу" #興福寺
 dazaifu_01_desc: "Город Дадзайфу — административный центр императорской власти на далеком острове Кюсю. Губернаторство Дадзайфу, основанное для надзора за обороной острова, управления делами внешней торговли и приема иностранных послов, — популярная ступень в карьере амбициозных бюрократов."
 building_type_chinjufu_01: "$chinjufu_01$"
 building_type_chinjufu_01_desc: "$chinjufu_01_desc$"
 chinjufu_01: "Округ Тиндзюфу" #鎮守府
 chinjufu_01_desc: "Тиндзюфу, изначально расположенный в Таге, — укрепленный центр императорской власти в северной Японии. Им заведует специальный командир, отвечающий за оборону и налогообложение в этих землях."
 building_type_hakata_port_01: "$hakata_port_01$"
 building_type_hakata_port_01_desc: "$hakata_port_01_desc$"
 hakata_port_01: "Порт Хаката" #博多
 hakata_port_01_desc: "С самых ранних дней Ямато портовый город Хаката на северном берегу Кюсю служил морскими воротами, оживленным центром под управлением учреждения Дадзайфу, где торговцы продавали товары из далеких земель, а иностранные делегации впервые ступали на землю Японии."
 building_hakata_port_02: "$hakata_port_01$"
 building_hakata_port_02_desc: "$hakata_port_01_desc$"
 building_type_hwangnyongsa_01: "$hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$hwangnyongsa_01_desc$"
 hwangnyongsa_01: "Храм Хваннёнса" #皇龍寺 (황룡사)
 hwangnyongsa_01_desc: "Храм Хваннёнса, достроенный в VII веке (название означает «храм желтого дракона»), — обширный комплекс, возведенный при правителе корейского государства Силла Чинхыне как центр буддистского учения и влияния. В нем находится одна из самых высоких пагод в мире."
 building_type_white_deer_grotto_academy_01: "$white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$white_deer_grotto_academy_01_desc$"
 white_deer_grotto_academy_01: "Академия «Грот Белого оленя»"
 white_deer_grotto_academy_01_desc: "Эта академия, основанная отшельником Ли Бо в месте обитания белых оленей, стала важным центром неоконфуцианства."
 building_type_shigu_academy_01: "$shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$shigu_academy_01_desc$"
 shigu_academy_01: "Академия Шигу"
 shigu_academy_01_desc: "Эта классическая академия, расположенная на тихих хунаньских холмах, была настоящим центром поэзии и философии, где обучались великие мыслители и литераторы. В эпоху Сун ее преподаватели стали хранителями традиций империи Тан."
 building_type_culai_academy_01: "$culai_academy_01$"
 building_type_culai_academy_01_desc: "$culai_academy_01_desc$"
 culai_academy_01: "Академия Цулай"
 culai_academy_01_desc: "Ученые построили эту академию на северном склоне горы Цулай, чтобы изучать конфуцианские тексты в тишине и уединении. В ее залах великие умы спорили об идеальном государстве, вдохновляясь гармонией природы."
 building_type_lize_academy_01: "$lize_academy_01$"
 building_type_lize_academy_01_desc: "$lize_academy_01_desc$"
 lize_academy_01: "Академия Лицзэ"
 lize_academy_01_desc: "На речном берегу, заросшем тростником, находится академия Лицзэ — северный бастион конфуцианства в эпоху территориальных потрясений."
 building_type_maoshan_academy_01: "$maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$maoshan_academy_01_desc$"
 maoshan_academy_01: "Академия Маошань"
 maoshan_academy_01_desc: "Академия, в которой изучают священные тексты и практикуют различные обряды и медитацию, что резко контрастирует с подходом к обучению в конфуцианских академиях эпохи Сун."
 building_type_tiantai_monasteries_01: "$tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc: "$tiantai_monasteries_01_desc$"
 tiantai_monasteries_01: "Тяньтайские монастыри"
 tiantai_monasteries_01_desc: "Академия, где преподают философию буддистской школы Тяньтай и практикуют медитацию."
 building_type_jizu_shan_temples_01: "$jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc: "$jizu_shan_temples_01_desc$"
 jizu_shan_temples_01: "Храмы на горе Цзицзу Шань"
 jizu_shan_temples_01_desc: "Комплекс буддистских монастырей, построенный в горах. Оплот эзотерического буддизма. Паломники сравнивали его с индийским Пиком Грифов."
 building_type_nanhua_temple_01: "$nanhua_temple_01$"
 building_type_nanhua_temple_01_desc: "$nanhua_temple_01_desc$"
 nanhua_temple_01: "Храм Наньхуа"
 nanhua_temple_01_desc: "Резиденция шестого патриарха чань-буддизма Хуэйнэна, которая по сей день остается оживленным центром учения чань."
 building_type_byeokran_port_01: "$byeokran_port_01$"
 building_type_byeokran_port_01_desc: "$byeokran_port_01_desc$"
 byeokran_port_01: "Порт Пёкран" #碧瀾渡 (벽란도)
 byeokran_port_01_desc: "Порт Пёкран, расположенный к западу от города Кэсон в устье реки Ресон — самый простой способ для иностранных путников и товаров попасть на Корейский полуостров, минуя северные границы и горные хребты."
 building_type_sado_mines_01: "$sado_mines_02$" #佐渡金山
 building_type_sado_mines_01_desc: "$sado_mines_01_desc$"
 sado_mines_01: "Золотые копи Садо"
 sado_mines_01_desc: "Отдаленный остров Садо издавна служил местом ссылки. Никто и не подозревал, что под землей там таятся такие богатые залежи золота."
 sado_mines_02: "Золотой рудник Садо"
 sado_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу золота."
 sado_mines_03: "Большой золотой рудник Садо"
 sado_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадаются золотые жилы."
 sado_mines_04: "Комплекс золотых рудников Садо"
 sado_mines_04_desc: "Добыча золота достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_tada_mines_01: "$tada_mines_02$" #多田銀銅山遺
 building_type_tada_mines_01_desc: "$tada_mines_01_desc$"
 tada_mines_01: "Медные копи Тады"
 tada_mines_01_desc: "Под деревней Тада, расположившейся в горах Хоусэцу, ждут своего обнаружения богатые залежи ценных металлов. Говорят, что именно там добыли металл для облицовки большого будды в храме Тодай-дзи."
 tada_mines_02: "Медный рудник Тады"
 tada_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу меди."
 tada_mines_03: "Большой медный рудник Тады"
 tada_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадаются медные жилы."
 tada_mines_04: "Комплекс медных рудников Тады"
 tada_mines_04_desc: "Добыча меди достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_tsushima_mines_01: "$tsushima_mines_02$" #対馬銀山
 building_type_tsushima_mines_01_desc: "$tsushima_mines_01_desc$"
 tsushima_mines_01: "Серебряные копи Цусимы"
 tsushima_mines_01_desc: "Остров Цусима известен своими залежами серебра, открытыми в конце VII века, в правление императора Тэмму. Пирит Японского моря, богатый галенитом, таит в себе большие богатства."
 tsushima_mines_02: "Серебряный рудник Цусимы"
 tsushima_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу серебра."
 tsushima_mines_03: "Большой серебряный рудник Цусимы"
 tsushima_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадаются серебряные жилы."
 tsushima_mines_04: "Комплекс серебряных рудников Цусимы"
 tsushima_mines_04_desc: "Добыча серебра достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_koganeyama_mines_01: "$koganeyama_mines_02$"
 building_type_koganeyama_mines_01_desc: "$koganeyama_mines_01_desc$"
 koganeyama_mines_01: "Золотые копи Кинка"
 koganeyama_mines_01_desc: "Остров Кинка и святилище Коганэяма на нем знамениты тем, что там были впервые в Японии обнаружены залежи золота — в виде золотой пыли. Святилище, основанное императором Сёму в VIII веке, посвящено #EMP Канаяме#!, богу рудного дела."
 koganeyama_mines_02: "Золотой рудник Кинка"
 koganeyama_mines_02_desc: "Рудники расширились, и в дело вступили инженеры, сумевшие ускорить добычу золота."
 koganeyama_mines_03: "Большой золотой рудник Кинка"
 koganeyama_mines_03_desc: "Среди многочисленных рудников выросла деревня, и теперь рабочим чаще попадаются золотые жилы."
 koganeyama_mines_04: "Комплекс золотых рудников Кинка"
 koganeyama_mines_04_desc: "Добыча золота достигла практически промышленных масштабов, и количество рабочих теперь исчисляется тысячами. Поток сокровищ из рудников кажется бесконечным."
 building_type_mount_baekdu_01: "Пэктусан"
 building_type_mount_baekdu_01_desc: "По преданию, все горы Корейского полуострова произошли от горы Пэктусан. Её величественные склоны почитаются как священные среди многих племен и религий региона."
