 building_type_capital_bureau_01: "Столичный магистрат"
 building_type_capital_bureau_01_desc: "Отдельная ветвь власти, ресурсы которой используются для управления столицей. В этих стенах обретается множество служащих и воинов, готовых исполнять приказы эпарха."
 building_capital_bureau_01: "Суд"
 building_capital_bureau_01_desc: "Процветание и богатство города зиждется на власти закона, а проявлять эту власть можно только в суде."
 building_capital_bureau_02: "Караульное помещение"
 building_capital_bureau_02_desc: "Здесь располагается большой отряд служителей закона, задача которых — защищать город от преступников и арестовывать тех, кто нарушает закон."
 building_capital_bureau_03: "Пожарная управа"
 building_capital_bureau_03_desc: "Любой густонаселенной местности всегда угрожают пожары. Хорошо обученная пожарная команда сумеет погасить пламя до того, как оно распространится."
 building_capital_bureau_04: "Управление гильдий"
 building_capital_bureau_04_desc: "Благодаря надзору чиновников многочисленные городские гильдии сохраняют эффективность, поддерживают качество товаров и следуют всем необходимым процедурам."
 building_capital_bureau_05: "Судебное ведомство"
 building_capital_bureau_05_desc: "Большому и растущему городу не обойтись без обширного судебного ведомства. Целая армия чиновников, служащих и судей без устали следит за законом и порядком."
 building_capital_bureau_06: "Городская тюрьма"
 building_capital_bureau_06_desc: "Хотя в городе может быть несколько мелких арестантских, только с большой тюрьмой появляется уверенность, что для каждого нарушителя закона найдется камера."
 building_capital_bureau_07: "Торговый совет"
 building_capital_bureau_07_desc: "Торговля — слишком прибыльное дело, чтобы оставлять ее вне власти закона. Благодаря контролю над пошлинами и прибывающими в город товарами, мы сможем лучше распоряжаться столичной провизией и, возможно, даже заработаем немного золота."
 building_capital_bureau_08: "Городской дворец"
 building_capital_bureau_08_desc: "Большая и величественная резиденция, способная затмить большинство дворцов. Благодаря ней, главный управляющий находится близко и всегда доступен. Хотя город никогда не спит, управляющему сон необходим."
 capital_bureau_custom_effect_desc: "#low Доступно:#!\nувеличение [Concept('aptitude', 'пригодности')|E] [Concept('court_position', 'придворной должности')|E] «[GetCourtPositionType('eparch_court_position').GetName()]»"
 #ACH
 building_type_oath_warriors_building_01: "Военные наделы"
 building_type_oath_warriors_building_01_desc: "Сюзерен этих земель во время коронации принес обет позаботиться о воинах."
 oath_warriors_building_01: "Хозяйства ветеранов"
 oath_warriors_building_01_desc: "В награду за долгую военную службу аристократы получают земельные наделы, что побуждает многих из них хранить верность своему господину."
 oath_warriors_building_02: "Поместья военных"
 oath_warriors_building_02_desc: "Воины-аристократы, которым удается выжить на поле боя, получают в свое распоряжение весьма обширные земли, которые позволяют им жить с комфортом и набирать необходимое количество рекрутов."
 oath_warriors_building_03: "Деревенские лены"
 oath_warriors_building_03_desc: "Офицеры получают местные деревни в свои личные владения, что позволяет им приумножать свое богатство и военную мощь за счет других сословий."
 oath_warriors_building_04: "Обширные владения военных"
 oath_warriors_building_04_desc: "Значительная часть налогов от местных поселений и прилегающих к ним земель отходит мелким военным аристократам, которые ими владеют. На эти деньги они, среди прочего, содержат свои могучие дружины."
 building_type_oath_faithful_building_01: "Религиозные монументы"
 building_type_oath_faithful_building_01_desc: "Сюзерен этих земель во время коронации принес обет позаботиться о верующих."
 oath_faithful_building_01: "Придорожные святилища"
 oath_faithful_building_01_desc: "Небольшие укрытия вдоль дорог, где располагаются простые иконы для молитв."
 oath_faithful_building_02: "Священные врата"
 oath_faithful_building_02_desc: "Над входом в поселение и на его улицах красуются религиозные произведения искусства, которые внушают прохожим благоговение и чувство безопасности."
 oath_faithful_building_03: "Храмовые убежища"
 oath_faithful_building_03_desc: "Местные храмовые комплексы были дополнены садами и тихими уединенными местами, в которых расположены колодцы с пресной водой."
 oath_faithful_building_04: "Монументальные площади"
 oath_faithful_building_04_desc: "Внушительные средства были вложены в создание огромных центральных площадей, которые украшены предметами религиозного искусства, а также отличаются особой чистотой и отсутствием какой-либо торговли. Здесь же местные жители могут запастись чистой водой."
 building_type_oath_poor_building_01: "Государственные богадельни"
 building_type_oath_poor_building_01_desc: "Сюзерен этих земель во время коронации принес обет позаботиться о бедняках."
 oath_poor_building_01: "Благотворительные обычаи"
 oath_poor_building_01_desc: "Во время религиозных праздников власти призывают состоятельных людей отдавать излишки еды и других благ малоимущим."
 oath_poor_building_02: "Ночлежки"
 oath_poor_building_02_desc: "Здесь вдовам, пожилым и наиболее бедным людям предоставляют скромное жилье и питание."
 oath_poor_building_03: "Милосердное духовенство"
 oath_poor_building_03_desc: "Более обеспеченные священнослужители за свой счет содержат богадельни и другие общественные заведения, где помогают обездоленным."
 oath_poor_building_04: "Благотворительные учреждения"
 oath_poor_building_04_desc: "В нашей державе нуждающиеся обеспечены всем необходимым: приюты предоставляют жилье бездомным, больницы заботятся о больных и стариках, а бедные крестьяне получают щедрые пособия."
