 building_type_tavern_street_1: "$tavern_street$"
 building_type_tavern_street_1_desc: "В трактирах на этой длинной улице путники, рабочие и свободные от службы стражники спускают свои кровные. Выпивка здесь редко бывает хорошей, зато всегда дешевая — а большего и не надо."
