 building_type_public_execution_site_1: "$public_execution_site$"
 building_type_public_execution_site_1_desc: "В день повешения на площади не протолкнуться. Горожане приходят ради правосудия, остаются ради зрелища, а домой возвращаются с твёрдым намерением взяться за ум. Примерно на неделю."
