l_russian:
 rule_empire_faith_gate: "Титулы империй только для организованных конфессий"
 setting_empire_faith_gate_on: "#high Включено#!"
 setting_empire_faith_gate_no_hof_exempt: "#high Включено#!, кроме конфессий без главы"
 setting_empire_faith_gate_off: "Отключено"
 setting_empire_faith_gate_on_desc: "Для создания [Concept('titles', 'титулов')|E] [Concept('empire', 'империй')|E] необходимы [Concept('organized', 'организованная')|E] [Concept('faith', 'конфессия')|E] и одобрение [Concept('head_of_faith', 'главы конфессии')|E]. Касается [Concept('feudal', 'феодальных')|E], [Concept('clan', 'клановых')|E] и [Concept('tribal', 'племенных')|E] [Concept('rulers', 'правителей')|E]."
 setting_empire_faith_gate_no_hof_exempt_desc: "Для создания [Concept('titles', 'титулов')|E] [Concept('empire', 'империй')|E] необходимы [Concept('organized', 'организованная')|E] [Concept('faith', 'конфессия')|E] и одобрение [Concept('head_of_faith', 'главы конфессии')|E], причём [Concept('faiths', 'конфессии')|E] без [Concept('head_of_faith', 'главы')|E] не нуждаются в одобрении. Касается [Concept('feudal', 'феодальных')|E], [Concept('clan', 'клановых')|E] и [Concept('tribal', 'племенных')|E] [Concept('rulers', 'правителей')|E]."
 setting_empire_faith_gate_off_desc: "Кто угодно может создавать [Concept('titles', 'титулы')|E] [Concept('empire', 'империй')|E] при выполнении стандартных условий."
 empire_faith_gate_organized_faith_required: "Для создания [Concept('empire', 'империи')|E] ваша [Concept('faith', 'конфессия')|E] должна быть [Concept('organized', 'организованной')|E]"
 empire_faith_gate_hof_spiritual_good_terms: "Необходимы хорошие отношения с [Concept('head_of_faith', 'главой конфессии')|E]"
 empire_faith_gate_hof_temporal_is_hof: "Вы [Concept('head_of_faith', 'глава конфессии')|E]"
 empire_faith_gate_hof_temporal_good_terms: "[Concept('opinion', 'Мнение')|E] [Concept('head_of_faith', 'главы конфессии')|E] о вас должно быть положительным"
 empire_faith_gate_powerful_vassals_approve: "[Concept('opinion', 'Мнение')|E] большинства [Concept('powerful_vassals', 'могущественных вассалов')|E] о вас должно быть положительным #weak ([THIS.Char.MakeScope.ScriptValue('powerful_vassals_positive_opinion_value')|0]/[THIS.Char.MakeScope.ScriptValue('powerful_vassals_count_value')|0])#!"
 empire_faith_gate_contested_legitimacy_applied: "Оспариваемая империя"
 empire_faith_gate_contested_legitimacy_applied_desc: "[Concept('empires', 'Империи')|E], которыми [Select_CString(THIS.Char.IsLocalPlayer, 'правите', Select_CString(SCOPE.sC('efg_other_emperor').IsLocalPlayer, 'правите', 'правят' ))] [THIS.Char.GetShortUIName] и [SCOPE.sC('efg_other_emperor').GetShortUIName], теперь спорят за верховенство."
 empire_faith_gate_create_title_contested_warning_1: "@warning_icon! #warning Создание этой [Concept('empire', 'империи')|E] через 3 года даст вам [Concept('modifier', 'модификатор')|E] «[GetModifier( 'multi_empire_same_faith_penalty_1' ).GetNameWithTooltip|L]», поскольку уже существует другая независимая [Concept('empire', 'империя')|E] вашей [Concept('faith', 'конфессии')|E].#!"
 empire_faith_gate_create_title_contested_warning_2: "@warning_icon! #warning Создание этой [Concept('empire', 'империи')|E] через 3 года даст вам [Concept('modifier', 'модификатор')|E] «[GetModifier( 'multi_empire_same_faith_penalty_2' ).GetNameWithTooltip|L]», поскольку уже существует несколько других независимых [Concept('empires', 'империй')|E] вашей [Concept('faith', 'конфессии')|E].#!"
 empire_faith_gate_create_title_contested_warning_3: "@warning_icon! #warning Создание этой [Concept('empire', 'империи')|E] через 3 года даст вам [Concept('modifier', 'модификатор')|E] «[GetModifier( 'multi_empire_same_faith_penalty_3' ).GetNameWithTooltip|L]», поскольку уже существует множество других независимых [Concept('empires', 'империй')|E] вашей [Concept('faith', 'конфессии')|E].#!"
 empire_faith_gate_create_title_contested_warning_1_inline: "\n\n$empire_faith_gate_create_title_contested_warning_1$"
 empire_faith_gate_create_title_contested_warning_2_inline: "\n\n$empire_faith_gate_create_title_contested_warning_2$"
 empire_faith_gate_create_title_contested_warning_3_inline: "\n\n$empire_faith_gate_create_title_contested_warning_3$"
 EXCOMMUNICATION_CONTESTED_EMPIRE: "Существует несколько [Concept('empires', 'империй')|E] нашей [Concept('faith', 'конфессии')|E]: $VALUE|=+0$"
 efg_contested_empire_rivalry: "Новая [Concept('empire', 'империя')|E] той же [Concept('faith', 'конфессии')|E] спровоцировала соперничество."
 efg_contested_empire_rivalry_corresponding: "Новая [Concept('empire', 'империя')|E] той же [Concept('faith', 'конфессии')|E] спровоцировала соперничество."
 dissolve_empire_war: "Распустить империю"
 DISSOLVE_EMPIRE_WAR_NAME: "Распустить империю, которой правит [DEFENDER.GetShortUINameNotMe]"
 dissolve_empire_war_desc: "Объявить войну за роспуск [Concept('empire', 'империи')|E] [Concept('excommunicated', 'отлучённого')|E] [Concept('ruler', 'правителя')|E] нашей [Concept('faith', 'конфессии')|E]."
 dissolve_empire_war_victory_desc: "[Concept('excommunicated', 'Отлучённый')|E] [Concept('emperor', 'император')|E] теряет [Concept('title', 'титул')|E] [Concept('empire', 'империи')|E], сам титул уничтожается."
 dissolve_empire_war_victory_desc_defender: "[Concept('empire', 'Империя')|E] расформирована. [Concept('title', 'Титул')|E] [Concept('empire', 'империи')|E] уничтожен."
 dissolve_empire_war_white_peace_desc: "Война заканчивается ничем. Ни одна из сторон не получила преимущества."
 dissolve_empire_war_white_peace_desc_defender: "Война за роспуск [Concept('empire', 'империи')|E] заканчивается безрезультатно."
 dissolve_empire_war_defeat_desc: "Попытка роспуска [Concept('empire', 'империи')|E] провалилась."
 dissolve_empire_war_defeat_desc_attacker: "Попытка роспуска [Concept('empire', 'империи')|E] провалилась. Теперь нас ждут последствия."
 dissolve_empire_war_defeat_desc_defender: "Попытка роспуска [Concept('empire', 'империи')|E] была отбита."
 dissolve_empire_war_invalidated_no_excommunication: "Защитник больше не [Concept('excommunicated', 'в отлучении')|E]."
 dissolve_empire_war_invalidated_no_empire: "Защитник больше не владеет [Concept('title', 'титулом')|E] [Concept('empire', 'империи')|E]."
 game_concept_dissolve_empire_casus_belli: "$dissolve_empire_war$"
 game_concept_dissolve_empire_casus_belli_desc: "[Concept('casus_belli', 'Казус белли')|E], позволяющий [Concept('ruler', 'правителю')|E] той же [Concept('faith', 'конфессии')|E] объявить [Concept('war', 'войну')|E] [Concept('excommunicated', 'отлученному')|E] [Concept('emperor', 'императору')|E] и в случае победы уничтожить [Concept('title', 'титул')|E] [Concept('empire', 'империи')|E]."
 multi_empire_same_faith_penalty_1: "Спорное верховенство"
 multi_empire_same_faith_penalty_1_desc: "Другой [Concept('emperor', 'император')|E] той же [Concept('faith', 'конфессии')|E] оспаривает верховенство нашей [Concept('empire', 'империи')|E]"
 multi_empire_same_faith_penalty_2: "Оспариваемое верховенство"
 multi_empire_same_faith_penalty_2_desc: "Несколько [Concept('emperors', 'императоров')|E] той же [Concept('faith', 'конфессии')|E] оспаривают верховенство нашей [Concept('empire', 'империи')|E]"
 multi_empire_same_faith_penalty_3: "Разделённое верховенство"
 multi_empire_same_faith_penalty_3_desc: "Множество [Concept('emperors', 'императоров')|E] той же [Concept('faith', 'конфессии')|E] оспаривают верховенство нашей [Concept('empire', 'империи')|E]"
 action_efg_request_excommunication: "@hof_icon! Слишком много империй вашей конфессии"
 action_efg_request_excommunication_label: "@hof_icon! Слишком много империй вашей конфессии"
 action_efg_request_excommunication_desc: "[recipient.GetShortUIName|U] правит соперничающей [Concept('empire', 'империей')|E] вашей [Concept('faith', 'конфессии')|E], оспаривая ваше право называться единственным истинным [Concept('emperor', 'императором')|E].\n\n#help Попросить, чтобы [secondary_recipient.GetShortUIName], [Concept('head_of_faith', 'глава конфессии')|E], [Select_CString(secondary_recipient.IsFemale, 'отлучила', 'отлучил' )] [Select_CString(recipient.IsFemale, 'ее', 'его')]. [Concept('excommunicated', 'Отлучённого')|E] императора можно атаковать с [Concept('casus_belli', 'казус белли')|E] «[dissolve_empire_casus_belli|E]», что позволит уничтожить [Concept('empire', 'империю')|E].#!"
 action_efg_request_excommunication_click: "#I Щёлкните, чтобы открыть «$request_excommunication_interaction$»#!"
 action_efg_request_excommunication_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNoTooltip]"
 action_efg_request_excommunication_combined_group_name: "@hof_icon! Слишком много империй вашей конфессии"
 action_efg_request_excommunication_combined_group_label: "@hof_icon! Слишком много империй вашей конфессии"
 action_efg_request_excommunication_combined_group_description: "Несколько соперничающих [Concept('emperors', 'императоров')|E] вашей [Concept('faith', 'конфессии')|E] оспаривают ваше право называться единственным истинным [Concept('emperor', 'императором')|E].\n\n#help Попросить, чтобы [secondary_recipient.GetShortUIName], [Concept('head_of_faith', 'глава конфессии')|E], [Select_CString(secondary_recipient.IsFemale, 'отлучила', 'отлучил' )] их. [Concept('excommunicated', 'Отлучённого')|E] императора можно атаковать с казус белли «[dissolve_empire_casus_belli|E]», что позволит уничтожить [Concept('empire', 'империю')|E].#!"
 empire_faith_gate_panel_organized_faith: "Вы принадлежите к [Concept('organized', 'организованной')|E] [Concept('faith', 'конфессии')|E]"
 empire_faith_gate_panel_hof_approval: "У вас есть одобрение [Concept('head_of_faith', 'главы конфессии')|E]"
 empire_faith_gate_panel_vassals_approve: "Большинство ваших [Concept('powerful_vassals', 'могущественных вассалов')|E] вас поддерживают"
 empire_faith_gate_reformation_piety_level: "[Concept('piety_level', 'Уровень набожности')|E] должен быть не ниже, чем [GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]"
 empire_faith_gate_reformation_tribal_authority: "Требуется абсолютный авторитет вождя"
 empire_faith_gate_reformation_holy_site: "Не меньше трёх [Concept('holy_sites', 'святых мест')|E] принадлежат персонажам этой [Concept('faith', 'конфессии')|E]"
 empire_faith_gate.0002.t: "Истинный император"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUIName] претендует на императорское достоинство, которое должно принадлежать лишь мне. Если ничего не предпринять, единоверцы вскоре усомнятся в моей [Concept('legitimacy', 'легитимности')|E]."
 empire_faith_gate.0002.a: "Распространите весть. [efg_primary_rival.GetHerHis|U] не переживет мою."
 empire_faith_gate.0002.b: "У нашей веры лишь один истинный император. Я."
 empire_faith_gate.0002.c: "Я ударю в подходящий момент."
 efg_contested_wrath: "Рыцарская пропаганда"
 efg_contested_wrath_desc: "Решение использовать наших рыцарей для утверждения нашей имперской легитимности против соперничающей империи наполняет наших воинов силой и приносит уважение народа."
 efg_divine_mandate: "Божественные притязания"
 efg_divine_mandate_desc: "Провозглашение божественной власти над всеми земными соперниками привлечёт верующих на нашу сторону."
 efg_contested_patience: "Терпеливое укрепление"
 efg_contested_patience_desc: "Мы обратили основное внимание на собственные земли. Держава крепчает, пока мы выжидаем подходящего момента для нанесения удара."
