l_russian:
 elevate_holy_site_decision: "Возвысить святое место"
 elevate_holy_site_decision_desc: "Возвысить [Concept('holy_site', 'святое место')|E] #L [ROOT.Char.GetFaith.GetName|l]ой#! веры до [Concept('eminent_holy_site', 'знаменитого')|E]."
 elevate_holy_site_decision_tooltip: "Возвысить выбранное [Concept('holy_site', 'святое место')|E] до [Concept('eminent_holy_site', 'знаменитого святого места')|E] #L [ROOT.Char.GetFaith.GetName|l]ой#! веры."
 elevate_holy_site_decision_confirm: "Возвысить святое место"
 elevate_holy_site_decision_target_in_realm_or_head_of_faith: "Святое место [selected_item.GetName] должно находиться в [Concept('realm', 'державе')|E], которой [Select_CString(actor.IsLocalPlayer, 'правите', 'правит')] [actor.GetShortUIName], или [actor.GetUIName] [Select_CString(actor.IsLocalPlayer, 'должны', Select_CString(actor.IsFemale, 'должна', 'должен' ))] быть [Concept('head_of_faith', 'главой')|E] #L [actor.GetFaith.GetName|l]ой#! конфессии."
 elevate_holy_site_decision_county_holder_correct_faith: "[Concept('county', 'Графство')|E] со святым местом [selected_item.GetName] должно находиться в руках #L [actor.GetFaith.GetName|l]ого#! [Concept('ruler', 'правителя')]"
 elevate_holy_site_decision_under_eminent_holy_sites_max: "У #L [faith.GetName|l]ой#! веры меньше [faith.GetReligion.GetType.GetEminentHolySitesMax] [Concept('eminent_holy_site', 'знаменитых святых мест')|E]"
 demote_holy_site_decision: "Понизить святое место"
 demote_holy_site_decision_desc: "Понизить [Concept('eminent_holy_site', 'знаменитое святое место')|E] #L [ROOT.Char.GetFaith.GetName|l]ой#! веры до [Concept('holy_site', 'обычного')|E]."
 demote_holy_site_decision_tooltip: "Понизить выбранное [Concept('eminent_holy_site', 'знаменитое святое место')|E] #L [ROOT.Char.GetFaith.GetName|l]ой#! веры до [Concept('holy_site', 'обычного')|E]."
 demote_holy_site_decision_confirm: "Понизить святое место"
 demote_holy_site_decision_above_eminent_holy_sites_min: "У #L [faith.GetName|l]ой#! веры больше [faith.GetReligion.GetType.GetEminentHolySitesMin] [Concept('eminent_holy_site', 'знаменитых святых мест')|E]"
 abandon_holy_site_decision: "Покинуть святое место"
 abandon_holy_site_decision_desc: "Покинуть [Concept('holy_site', 'святое место')|E] #L [ROOT.Char.GetFaith.GetName|l]ой#! веры, полностью разорвав его связь с [Concept('faith', 'конфессией')|E]."
 abandon_holy_site_decision_tooltip: "Вычеркнуть выбранное [Concept('holy_site', 'святое место')|E] из #L [ROOT.Char.GetFaith.GetName|l]ой#! веры."
 abandon_holy_site_decision_confirm: "Покинуть святое место"
 adopt_holy_site_decision: "Объявить святым местом"
 adopt_holy_site_decision_desc: "Объявить существующее [Concept('holy_site', 'святое место')|E] в вашей [Concept('realm', 'державе')|E] частью #L [ROOT.Char.GetFaith.GetName|l]ой#! веры."
 adopt_holy_site_decision_tooltip: "Добавить выбранное [Concept('holy_site', 'святое место')|E] к числу #L [ROOT.Char.GetFaith.GetName|l]их#! святынь."
 adopt_holy_site_decision_confirm: "Объявить святым местом"
 adopt_holy_site_decision_not_already_a_holy_site: "[selected_item.GetName] ещё не является #L [actor.GetFaith.GetName|l]им#! [Concept('holy_site', 'святым местом')|E]"
 adopt_holy_site_decision_shared_or_syncretic_faith: "[selected_item.GetName] почитается хотя бы одной [Concept('faith', 'конфессией')|E] той же [Concept('religion', 'религии')|E], что и [actor.GetFaith.GetAdjective|l], или синкретичной с этой конфессией, и при этом [actor.GetFaith.GetAdjective|l] не считает эту конфессию [Concept('faith_hostile', 'врагами')|E] или [Concept('faith_evil', 'воплощением зла')|E]"
 adopt_holy_site_decision_active_site: "[selected_item.GetName] — [Concept('holy_site', 'святое место')|E] существующей [Concept('faith', 'конфессии')|E], то есть конфессии, исповедуемой хотя бы в одном [Concept('county', 'графстве')|E]."
 adopt_holy_site_decision_under_holy_sites_max: "У #L [faith.GetName|l]ой#! веры меньше [faith.GetReligion.GetType.GetHolySitesMax] [Concept('holy_sites', 'святых мест')|E]"
 adopt_holy_site_in_realm: "[selected_item.GetName] находится в пределах вашей [Concept('realm', 'державы')|E]"
 abandon_holy_site_decision_above_holy_sites_min: "У #L [faith.GetName|l]ой#! веры больше [faith.GetReligion.GetType.GetHolySitesMin] [Concept('holy_sites', 'святых мест')|E]"
 manage_holy_sites_hof_or_puppet_tt: "Вы должны выполнять одно из условий:\n#indent_newline:3 $EFFECT_LIST_BULLET$Быть [Concept('head_of_faith', 'главой')|E] своей [Concept('faith', 'конфессии')|E]#!\n#indent_newline:3 $EFFECT_LIST_BULLET$Контролировать [Concept('head_of_faith', 'главу')|E] своей [Concept('faith', 'конфессии')|E] как [Concept('clerical_puppet', 'священника-марионетку')|E] или [Concept('external_clerical_puppet', 'церковную марионетку')|E]#!"
 manage_holy_sites_realm_priest_puppet_tt: "У вашей [Concept('faith', 'конфессии')|E] нет [Concept('head_of_faith', 'главы')|E], поэтому требуется [Concept('clerical_puppet', 'священник-марионетка')|E]"
 manage_holy_sites_piety_level_tt: "У вашей [Concept('faith', 'конфессии')|E] нет [Concept('head_of_faith', 'главы')|E], поэтому требуется [Concept('piety_level', 'уровень набожности')|E] не ниже чем @piety_level_4_icon_christian![GetModifier( 'piety_level_4' ).GetNameWithTooltip|l]"
 holy_site_kingdom_already_used_tt: "Нельзя, чтобы ваша [Concept('faith', 'конфессия')|E] в прошлом создавала или принимала [Concept('holy_site', 'святое место')|E] в де-юре [Concept('kingdom', 'королевстве')|E] этого [Concept('barony', 'баронства')|E]"
 holy_site_creation_on_cooldown_tt: "Нельзя, чтобы вы недавно основывали другое [Concept('holy_site', 'святое место')|E]"
 ai_remove_enshrined_artifact_decision: "#D AI Remove Enshrined Artifacts#!"
