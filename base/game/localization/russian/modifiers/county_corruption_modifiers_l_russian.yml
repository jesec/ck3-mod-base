l_russian:
 county_corruption_inefficient_tax_collection_modifier: "Неумелый сбор налогов"
 county_corruption_inefficient_tax_collection_modifier_desc: "[county_corruption|E]\nВ этом графстве не удается наладить сбор налогов"
 county_corruption_inefficient_tax_collection_modifier_2: "Систематическое уклонение от налогов"
 county_corruption_inefficient_tax_collection_modifier_2_desc: "[county_corruption|E]\nУклонение от уплаты налогов стало в этом графстве повсеместным"
 county_corruption_inefficient_tax_collection_modifier_3: "Крах налоговой системы"
 county_corruption_inefficient_tax_collection_modifier_3_desc: "[county_corruption|E]\nСбор налогов в этом графстве практически прекратился"
 county_corruption_deserting_levies_modifier: "Дезертиры-ополченцы"
 county_corruption_deserting_levies_modifier_desc: "[county_corruption|E]\nВ этом графстве ополченцы массово сбегают из войска"
 county_corruption_deserting_levies_modifier_2: "Массовое дезертирство"
 county_corruption_deserting_levies_modifier_2_desc: "[county_corruption|E]\nОполченцы в этом графстве массово бегут из армии"
 county_corruption_deserting_levies_modifier_3: "Крах системы ополчения"
 county_corruption_deserting_levies_modifier_3_desc: "[county_corruption|E]\nСистема ополчения в этом графстве полностью развалилась"
 county_corruption_smuggling_ring_modifier: "Шайка контрабандистов"
 county_corruption_smuggling_ring_modifier_desc: "[county_corruption|E]\nКонтрабандисты процветают в этом графстве"
 county_corruption_smuggling_ring_modifier_2: "Укоренившиеся контрабандисты"
 county_corruption_smuggling_ring_modifier_2_desc: "[county_corruption|E]\nКонтрабандисты создали в этом графстве обширную сеть"
 county_corruption_smuggling_ring_modifier_3: "Повсеместная контрабанда"
 county_corruption_smuggling_ring_modifier_3_desc: "[county_corruption|E]\nПочти все ценные товары в этом графстве проходят мимо сборщиков налогов"
 county_corruption_bandits_rampant_modifier: "Расцвет бандитизма"
 county_corruption_bandits_rampant_modifier_desc: "[county_corruption|E]\nБандиты свободно разгуливают по этому графству"
 county_corruption_bandits_rampant_modifier_2: "Бандитские шайки"
 county_corruption_bandits_rampant_modifier_2_desc: "[county_corruption|E]\nМогущественные банды разбойников поделили между собой земли этого графства"
 county_corruption_bandits_rampant_modifier_3: "Бесчинство бандитов"
 county_corruption_bandits_rampant_modifier_3_desc: "[county_corruption|E]\nРазбойники в этом графстве ведут себя так, словно оно принадлежит им"
 county_corruption_inefficient_census_modifier: "Бесполезная перепись"
 county_corruption_inefficient_census_modifier_desc: "Правители этого графства не имеют ни малейшего представления о том, сколько народу здесь проживает"
 county_corruption_inefficient_census_modifier_2: "Крах системы учёта"
 county_corruption_inefficient_census_modifier_2_desc: "Власти графства утратили сведения о большей части населения и владений"
 county_corruption_inefficient_census_modifier_3: "Административная слепота"
 county_corruption_inefficient_census_modifier_3_desc: "Никто не знает, кто здесь живёт, чем они владеют и, что хуже всего, сколько они должны"
 county_corruption_lack_of_sheriffs_modifier: "Нехватка шерифов"
 county_corruption_lack_of_sheriffs_modifier_desc: "[county_corruption|E]\nНе хватает шерифов, чтобы управлять всеми землями в этом графстве"
 county_corruption_lack_of_sheriffs_modifier_2: "Беззаконие"
 county_corruption_lack_of_sheriffs_modifier_2_desc: "[county_corruption|E]\nПоддержание правопорядка в большей части графства полностью прекратилось"
 county_corruption_lack_of_sheriffs_modifier_3: "Неуправляемое графство"
 county_corruption_lack_of_sheriffs_modifier_3_desc: "[county_corruption|E]\nВласть над этим графством существует лишь на словах"
 county_corruption_lack_of_courts_modifier: "Недоверие к судам"
 county_corruption_lack_of_courts_modifier_desc: "[county_corruption|E]\nНедостаточно судов, чтобы вершить правосудие по всем крестьянским делам"
 county_corruption_lack_of_courts_modifier_2: "Пренебрежение законом"
 county_corruption_lack_of_courts_modifier_2_desc: "[county_corruption|E]\nЖители этого графства почти перестали обращать внимание на законы своих правителей"
 county_corruption_lack_of_courts_modifier_3: "Крах системы правосудия"
 county_corruption_lack_of_courts_modifier_3_desc: "[county_corruption|E]\nВ этом графстве полностью утрачено уважение к закону и суду"
 county_corruption_thieves_guild_modifier: "Расцвет воровства"
 county_corruption_thieves_guild_modifier_desc: "[county_corruption|E]\nВоры свободно орудуют по всему графству"
 county_corruption_thieves_guild_modifier_2: "Разбойничьи шайки"
 county_corruption_thieves_guild_modifier_2_desc: "[county_corruption|E]\nПреступники распространили своё пагубное влияние по всему графству"
 county_corruption_thieves_guild_modifier_3: "Гильдия воров"
 county_corruption_thieves_guild_modifier_3_desc: "[county_corruption|E]\nГильдия воров фактически контролирует торговлю и передвижения в этом графстве"
 county_corruption_unsafe_highways_modifier: "Небезопасные тракты"
 county_corruption_unsafe_highways_modifier_desc: "[county_corruption|E]\nЕздить по дорогам в этом графстве опаснее, чем бродить ночью по лесу"
 county_corruption_unsafe_highways_modifier_2: "Опасные дороги"
 county_corruption_unsafe_highways_modifier_2_desc: "[county_corruption|E]\nДороги этого графства внушают страх каждому путнику"
 county_corruption_unsafe_highways_modifier_3: "Непроходимые дороги"
 county_corruption_unsafe_highways_modifier_3_desc: "[county_corruption|E]\nДороги этого графства стали совершенно непроходимы для честного народа"
 county_corruption_uncooperative_guilds_modifier: "Гильдии не хотят сотрудничать"
 county_corruption_uncooperative_guilds_modifier_desc: "[county_corruption|E]\nМестные гильдии противятся сотрудничеству с правителями этого графства"
 county_corruption_uncooperative_guilds_modifier_2: "Строптивые гильдии"
 county_corruption_uncooperative_guilds_modifier_2_desc: "[county_corruption|E]\nГильдии активно препятствуют любым действиям властей в этом графстве"
 county_corruption_uncooperative_guilds_modifier_3: "Мятежные гильдии"
 county_corruption_uncooperative_guilds_modifier_3_desc: "[county_corruption|E]\nГильдии открыто восстали против правителя графства"
 county_corruption_lackluster_administration_modifier: "Неэффективная администрация"
 county_corruption_lackluster_administration_modifier_desc: "[county_corruption|E]\nПравитель графства больше не способен содержать местную администрацию"
 county_corruption_lackluster_administration_modifier_2: "Ослабевшее управление"
 county_corruption_lackluster_administration_modifier_2_desc: "[county_corruption|E]\nАдминистрация этого графства почти перестала выполнять свои обязанности"
 county_corruption_lackluster_administration_modifier_3: "Крах системы управления"
 county_corruption_lackluster_administration_modifier_3_desc: "[county_corruption|E]\nДаже те немногие чиновники, что ещё оставались в этом графстве, оставили свои должности"
 county_corruption_roaming_bandits_modifier: "Бродячие разбойники"
 county_corruption_roaming_bandits_modifier_desc: "[Concept('county_corruption', 'Коррупция в графстве')|E]\nШайки бандитов нападают на всякого, кто проезжает это графство!"
 county_corruption_roaming_bandits_modifier_2: "Нашествие разбойников"
 county_corruption_roaming_bandits_modifier_2_desc: "[county_corruption|E]\nБезжалостные разбойники заполонили каждый уголок этого графства"
 county_corruption_roaming_bandits_modifier_3: "Разбойничий террор"
 county_corruption_roaming_bandits_modifier_3_desc: "[county_corruption|E]\nСвирепые разбойники безнаказанно хозяйничают в этом графстве, наводя ужас на честной народ"
 county_corruption_wild_beast_attacks_modifier: "Нападения диких зверей"
 county_corruption_wild_beast_attacks_modifier_desc: "[Concept('county_corruption', 'Коррупция в графстве')|E]\nКрупные стаи диких зверей в этом графстве утаскивают как овец, так и их пастухов"
 county_corruption_wild_beast_attacks_modifier_2: "Нашествие диких зверей"
 county_corruption_wild_beast_attacks_modifier_2_desc: "[county_corruption|E]\nДикие звери чрезмерно расплодились по всему графству"
 county_corruption_wild_beast_attacks_modifier_3: "Нашествие хищников"
 county_corruption_wild_beast_attacks_modifier_3_desc: "[county_corruption|E]\nКрупные хищники свободно бродят по этому графству, охотясь как на скот, так и на его хозяев"
 county_corruption_upset_shepherds_modifier: "Разгневанные пастухи"
 county_corruption_upset_shepherds_modifier_desc: "[Concept('county_corruption', 'Коррупция в графстве')|E]\nПастухи в этом графстве разгневаны и намеренно дурно обращаются со своими стадами"
 county_corruption_upset_shepherds_modifier_2: "Мятежные пастухи"
 county_corruption_upset_shepherds_modifier_2_desc: "[county_corruption|E]\nПастухи этого графства открыто не подчиняются своему правителю"
 county_corruption_upset_shepherds_modifier_3: "Крах пастушеского уклада"
 county_corruption_upset_shepherds_modifier_3_desc: "[county_corruption|E]\nПастушеский уклад жизни в этом графстве полностью пришёл в упадок"
 county_corruption_rogue_warriors_modifier: "Воины-отступники"
 county_corruption_rogue_warriors_modifier_desc: "[Concept('county_corruption', 'Коррупция в графстве')|E]\nОрды воинов нападают на всякого, кто живет в этом графстве, и грабят всех подряд"
 county_corruption_rogue_warriors_modifier_2: "Отряды отступников"
 county_corruption_rogue_warriors_modifier_2_desc: "[county_corruption|E]\nОтступники объединились в военные отряды и наводят смуту в этом графстве"
 county_corruption_rogue_warriors_modifier_3: "Мятежные военачальники"
 county_corruption_rogue_warriors_modifier_3_desc: "[county_corruption|E]\nЭто графство поделили между собой мелкие военачальники, которые не признают ничьей власти"
 county_corruption_unruly_nomads_modifier: "Непокорные кочевники"
 county_corruption_unruly_nomads_modifier_desc: "[Concept('county_corruption', 'Коррупция в графстве')|E]\nКочевники, живущие в этом графстве, не подчиняются никому и склонны к конфликтам"
 county_corruption_unruly_nomads_modifier_2: "Непокорные кочевники"
 county_corruption_unruly_nomads_modifier_2_desc: "[county_corruption|E]\nКочевники этого графства почти не признают никого, кроме своих сородичей"
 county_corruption_unruly_nomads_modifier_3: "Мятежные кочевники"
 county_corruption_unruly_nomads_modifier_3_desc: "[county_corruption|E]\nКочевники по всему графству вот-вот поднимут открытое восстание"
 escalate_county_corruption.message: "Коррупция усиливается"
