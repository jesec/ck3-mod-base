l_russian:
 unity_antagonistic_maa_modifier: "Верные армейские офицеры"
 unity_antagonistic_maa_modifier_desc: "Представители этого дома объединили свои ресурсы, чтобы укрепить войска в своих армиях.\n\n"
 unity_competitive_spies_modifier: "Сеть интриг"
 unity_competitive_spies_modifier_desc: "Представители этого дома делятся друг с другом сведениями об интригах и используют сеть шпионов, доступную только членам дома.\n\n"
 unity_competitive_spies_landless_merchant_modifier: "Сеть интриг"
 unity_competitive_spies_landless_merchant_modifier_desc: "Представители этого дома делятся друг с другом сведениями об интригах и используют сеть шпионов, доступную только членам дома.\n\n"
 unity_impassive_tax_modifier: "Улучшенная администрация"
 unity_impassive_tax_modifier_desc: "Представители этого дома обладают более эффективной администрацией.\n\n"
 unity_friendly_bailiff_modifier: "Навязанные бейлифы"
 unity_friendly_bailiff_modifier_desc: "Представители этого дома сотрудничают со своим сюзереном ради снижения коррупции в державе.\n\n"
 unity_harmonious_placation_modifier: "Спокойствие"
 unity_harmonious_placation_modifier_desc: "Представители этого дома подтвердили право этого сюзерена править в гармонии.\n\n"
 unity_house_organized_for_war_modifier: "Подготовка к войне"
 unity_house_organized_for_war_modifier_desc: "Представители этого дома ведут войну в едином порыве.\n[rulers|E] примут следующий [Concept( 'economical_archetype', 'экономический архетип' )|E]: [warlike_i|E][ai_warlike_personality|L]"
 unity_house_focused_on_economy_modifier: "Поощрение экономики"
 unity_house_focused_on_economy_modifier_desc: "Представители этого дома активно и с энтузиазмом развивают свою экономику.\n[rulers|E] примут следующий [Concept( 'economical_archetype', 'экономический архетип' )|E]: [builder_i][ai_economical_boom_personality|L]"
 unity_house_focused_on_diplomacy_modifier: "Дипломатические усилия"
 unity_house_focused_on_diplomacy_modifier_desc: "Представители этого дома сообща работают над распространением своего влияния."
 fp3_unity_promoted_prosperity_modifier: "Поддерживается процветание"
 fp3_unity_promoted_prosperity_modifier_desc: "Представители этого дома сотрудничают для развития своих земель."
 fp3_unity_improved_logistics_modifier: "Общая логистика армии"
 fp3_unity_improved_logistics_modifier_desc: "Представители этого дома используют общие логистику и припасы."
 unity_family_business_landless_merchant_modifier: "Слаженное семейное дело"
 unity_family_business_landless_merchant_modifier_desc: "В усадьбе этого дома кипит жизнь: члены семьи неукоснительно и усердно исполняют всякое указание.\n\n"
 unity_regional_networks_landless_merchant_modifier: "Региональные торговые связи"
 unity_regional_networks_landless_merchant_modifier_desc: "Глава дома признал и свёл воедино разрозненные деловые интересы своих родичей.\n\n"
 unity_merchant_development_modifier: "Поощрение развития"
 unity_merchant_development_modifier_desc: "Обосновавшиеся в этом графстве купцы продвигают его городское развитие.\n\n"
 unity_merchant_bailiffs_modifier: "Городские бейлифы"
 unity_merchant_bailiffs_modifier_desc: "Обосновавшиеся в этом графстве купцы продвигают соблюдение закона и порядка.\n\n"
 unity_merchant_prosperity_modifier: "Поддержка общины"
 unity_merchant_prosperity_modifier_desc: "Местные купцы проявляют щедрость, направляя свои богатства на благо всей общины."
 MODIFIER_DEFINITION_VALUE_PER_MERCHANT_UNITY_MEMBER: "\t#weak Усиление за каждого члена [Concept('house', 'дома')|E]#!"
 MODIFIER_DEFINITION_MAIN_DESC_HOUSE_UNITY_LANDESS_MERCHANT: "Этот модификатор усиливается за каждого члена [Concept('house', 'дома')|E], который является независимым [Concept('merchant', 'торговцем')|E] или обладает [Concept('court_position', 'положением при дворе')|E] (#bold $MULTIPLIER|0$#!/#bold 10#!)"
 unity_promoting_diligence_modifier: "Поддерживает усердие"
 unity_promoting_diligence_modifier_desc: "От членов этого дома требуют полной самоотдачи: вести торговые книги, искать любую возможность получить преимущество, оттачивая своё мастерство в торговле и приумножая прибыль компании.\n\n"
 unity_promoting_excess_modifier: "Поддерживает излишества"
 unity_promoting_excess_modifier_desc: "Члены этого дома не жалеют средств на изысканные удовольствия, поддерживая свою репутацию и приумножая престиж компании.\n\n"
