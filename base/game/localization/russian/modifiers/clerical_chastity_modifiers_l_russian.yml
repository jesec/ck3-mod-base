l_russian:
 clerical_chastity_vow_modifier: "Духовный обет целомудрия"
 clerical_chastity_vow_modifier_desc: "Этот персонаж был вынужден дать обет целомудрия по требованию священника и против своей воли. Пока обет действует, он не может соблазнять других персонажей или ухаживать за ними."
 clerical_chastity_renounced_vow_clergy_disapproval_modifier: "Нарушен священный обет"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier_desc: "Этот персонаж отказался от публично принесённого обета целомудрия, и теперь [Concept('clergy', 'духовенство')|E] с подозрением относится к нему."
