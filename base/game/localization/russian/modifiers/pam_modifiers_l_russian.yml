l_russian:
 christian_fulfillment_level_0: "Обречённость"
 christian_fulfillment_level_1: "Забвение"
 christian_fulfillment_level_2: "Тревоги"
 christian_fulfillment_level_3: "Покаяние"
 christian_fulfillment_level_4: "Избавление"
 christian_fulfillment_level_5: "Успокоение"
 christian_fulfillment_level_6: "Благодать"
 default_fulfillment_level_0: "Смятение"
 default_fulfillment_level_1: "Осмысление"
 default_fulfillment_level_2: "Прилежание"
 default_fulfillment_level_3: "Набожность"
 default_fulfillment_level_4: "Умиротворение"
 industrious_junior_members_modifier: "Трудолюбивые новички"
 foolish_convert_modifier: "Опрометчивое обращение"
 foolish_convert_modifier_desc: "Этот персонаж по глупости обратился в [Concept('rite', 'течение')|E] с совершенно иной системой верований и теперь с огромным трудом привыкает к новой духовной жизни."
 reckless_convert_modifier: "Безрассудное обращение"
 reckless_convert_modifier_desc: "Этот персонаж без должной подготовки обратился в [Concept('rite', 'течение')|E] с иной системой верований и теперь с трудом привыкает к новой духовной жизни."
 informed_convert_modifier: "Подготовленное обращение"
 informed_convert_modifier_desc: "Этот персонаж обратился в [Concept('rite', 'течение')|E] с иной системой верований, перед этим тщательно подготовившись к испытаниям, которые принесёт это решение."
 study_faith_learning_mannerism: "Изучение обрядов"
 study_faith_learning_mannerism_desc: "Хотя это и не столь эффективно, изучение внешних ритуалов и обрядов, присущих [Concept('rite', 'течению')|E], может принести ощутимую пользу в будущем."
 study_faith_newfound_coherence: "Новообретённое понимание"
 study_faith_newfound_coherence_desc: "Противоречия, встречавшиеся при изучении этого [Concept('rite', 'течения')|E], оказались не преградой, а подспорьем. Сопоставляя различия между двумя системами верований, вы начинаете лучше понимать подлинный смысл [Concept('core_tenets', 'догматов')|E] и [Concept('doctrines', 'доктрин')|E] цели ваших изысканий."
 study_faith_cautious_studies: "Осторожное изучение"
 study_faith_cautious_studies_desc: "Это [Concept('rite', 'течение')|E] лучше изучать размеренно, не торопясь перекладывать непривычные суждения в более понятные формы и свыкаясь с чуждым образом мышления."
 study_faith_slow_and_steady: "Трудности изучения"
 study_faith_slow_and_steady_desc: "Этого персонажа захлестнул поток незнакомых обрядов, и ему приходится прикладывать немалые усилия, чтобы уложить всё в голове."
 study_faith_cramming_side_studies: "Крайняя увлечённость изучением"
 study_faith_cramming_side_studies_desc: "Этот персонаж настолько погружён во внутреннее устройство [Concept('rite', 'течения')|E], что его то и дело застают строчащим заметки об изученном… даже во время занятий чем-то иным."
 followers_of_dead_faith_scheme_modifier: "Утраченное знание"
 followers_of_dead_faith_scheme_modifier_desc: "Эта [Concept('faith', 'конфессия')|E] больше не практикуется открыто, и её последователей чрезвычайно трудно отыскать."
 appealing_theology_modifier: "Привлекательное богословие"
 appealing_theology_modifier_desc: "Этому персонажу попался чужеземный богословский текст, который ему очень понравился."
 suspicions_of_heresy_modifier: "Подозрение в ереси"
 suspicions_of_heresy_modifier_desc: "Этого персонажа часто видят с чужеземными богословскими текстами, и собратья по вере начинают сомневаться в его благочестивости."
 monastic_onslaught_modifier: "Монашеское основание"
 monastic_onslaught_modifier_desc: "Монашеский орден, щедро поддерживаемый мирским покровителем, подстёгивает местную экономику."
 pam_monastic_order_improvement_modifier: "Помощь монахов"
 pam_monastic_order_improvement_modifier_desc: "Монашеский орден помогает этому графству делом и советом."
 pam_military_order_improvement_modifier: "Благословлённое оружие"
 pam_military_order_improvement_modifier_desc: "Воины священного ордена обучают местное ополчение и укрепляют дисциплину в этом графстве."
 pam_tithes_or_mercy_harsh_tithes_modifier: "Навязанная десятина"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "После принудительного изъятия десятины местные жители обижены на своего сюзерена."
 pam_tithes_or_mercy_show_mercy_modifier: "Мягкая десятина"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "Поблажки при сборе налогов способствовали росту доверия со стороны местных жителей."
 pam_blissful_harmony_gospel_modifier: "Проповедь хорошей жизни"
 pam_blissful_harmony_gospel_modifier_desc: "В проповедях этого правителя прославляют мир, благочестие и упорядоченную жизнь."
 pam_blissful_harmony_restless_ambition_modifier: "Неуёмные амбиции"
 pam_blissful_harmony_restless_ambition_modifier_desc: "Моменты покоя вызывают у этого персонажа беспокойство и стремление к большему."
 pam_stone_for_god_estate_build_discount_modifier: "Камни для дома Божьего"
 pam_stone_for_god_estate_build_discount_modifier_desc: "Благодаря своему внимательному архитектурному взору этот персонаж получил доступ к камню."
 pam_relocating_faithfuls_to_frontiers: "Переселение верующих на границы"
 pam_relocating_faithfuls_to_frontiers_desc: "В этом графстве поощряется переселение членов того же [Concept('rite', 'течения')|E] в другие [Concept('realm', 'державы')|E], чтобы принести туда свет истинной веры."
 pam_moving_faithfuls_to_frontiers: "Переселение верующих"
 pam_moving_faithfuls_to_frontiers_desc: "В это графство прибывают последователи другой [Concept('faith', 'конфессии')|E], чтобы проповедовать свою веру.\n#weak Благодаря этому [Concept('interaction', 'взаимодействие')|E] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! становится дешевле.#!"
 pam_building_new_shrines: "Строительство новых святилищ"
 pam_building_new_shrines_desc: "В это графство прибывают последователи другой [Concept('faith', 'конфессии')|E], чтобы строить новые святилища.\n#weak Благодаря этому [Concept('interaction', 'взаимодействие')|E] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! становится дешевле.#!"
 pam_grand_cathedral_started_modifier: "Начато строительство величественного собора"
 pam_grand_cathedral_started_modifier_desc: "Этот персонаж накопил ресурсы, необходимые для начала строительства величественного собора. Этот проект, обещающий затянуться на несколько поколений, сам по себе является отличным свидетельством набожности."
 pam_grand_cathedral_completed_modifier: "Завершено строительство величественного собора"
 pam_grand_cathedral_completed_modifier_desc: "Этот персонаж накопил ресурсы, необходимые для завершения строительства величественного собора. Этот проект, обещающий затянуться на несколько поколений, является отличным свидетельством набожности."
 pam_grand_cathedral_02_started_modifier: "Расширено строительство величественного собора"
 pam_grand_cathedral_02_started_modifier_desc: "Этот персонаж накопил ресурсы, необходимые для возвышения величественного собора. Этот проект, обещающий затянуться на несколько поколений, является отличным свидетельством набожности."
 pam_grand_cathedral_02_completed_modifier: "Завершено расширение величественного собора"
 pam_grand_cathedral_02_completed_modifier_desc: "Этот персонаж наблюдал за расширением величественного собора."
 pam_grand_cathedral_family_contributed_south_modifier: "Финансирование молельни величественного собора"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "Представитель этой династии выделил средства на возведение молельни величественного собора. Этот проект, обещающий затянуться на несколько поколений, является отличным свидетельством набожности."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Покровитель склепа собора"
 pam_cathedral_founder_crypt_modifier_desc: "Этот персонаж оплатил строительство склепа своей династии под величественным собором."
 pam_cathedral_bell_cracked_lesson_modifier: "Уроки треснувшего колокола"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Каменщики этого графства работают более вдумчиво после того, как опозорились с отливкой неисправного колокола."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Использование бронзы для пыток"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Куски от неудачно выплавленного колокола собора были переделаны в инструменты устрашения. И первым их на себе опробовал мастер, занимавшийся отливкой колокола. Теперь ремесленники знают цену провала."
 pam_cathedral_treadwheel_crane_modifier: "Ступальный кран"
 pam_cathedral_treadwheel_crane_modifier_desc: "В столице был возведён большой ступальный кран для строительной площадки собора."
 pam_cathedral_cantoria_scam_modifier: "Раскрытая уловка"
 pam_cathedral_cantoria_scam_modifier_desc: "После раскрытого подлога строители работают более расчётливо и споро."
 pam_cathedral_famed_choir_boy_modifier: "Ангельский голос при дворе"
 pam_cathedral_famed_choir_boy_modifier_desc: "Мальчик из хора с неземным голосом стал украшением этого двора."
 pam_cathedral_sermon_peace_county_modifier: "Молитва о мире"
 pam_cathedral_sermon_peace_county_modifier_desc: "Проповедь правителя у входа в новый собор успокоила жителей этого графства, и паломники могут без опаски путешествовать по его дорогам."
 pam_cathedral_sermon_peace_ruler_modifier: "Наставления о мире"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "Этого правителя тронула служба в соборе, посвящённая миру Христа."
 pam_cathedral_sermon_diligence_county_modifier: "Молитва об усердии"
 pam_cathedral_sermon_diligence_county_modifier_desc: "Проповедь правителя у входа в новый собор подстегнула работу строителей церкви и каменщиков."
 pam_cathedral_sermon_diligence_ruler_modifier: "Наставления о труде"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "Этого правителя тронула служба в соборе, посвящённая богоугодному труду."
 pam_cathedral_sermon_unity_county_modifier: "Молитва о единстве"
 pam_cathedral_sermon_unity_county_modifier_desc: "Проповедь правителя у входа в новый собор укрепила послушность общин этого графства."
 pam_cathedral_sermon_unity_ruler_modifier: "Наставления о согласии"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "Этого правителя тронула служба в соборе, посвящённая христианскому братству."
 pam_cathedral_sermon_charity_county_modifier: "Молитва о щедрости"
 pam_cathedral_sermon_charity_county_modifier_desc: "Проповедь правителя у входа в новый собор развязала кошельки и согрела сердца жителей этого графства."
 pam_cathedral_sermon_charity_ruler_modifier: "Наставления о щедрости"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "Этого правителя тронула служба в соборе, посвящённая милосердию и открытости."
 pam_cathedral_sermon_perseverance_county_modifier: "Молитва об упорстве"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "Проповедь правителя у входа в новый собор укрепила благочестивые устремления и упорядоченное развитие этого графства."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Наставления о фанатизме"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "Этого правителя тронула служба в соборе, посвящённая приверженности вере."
 pam_cathedral_sermon_rejoice_county_modifier: "Молитва о радости"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "Проповедь правителя у входа в новый собор наполнила сердца верующих надеждой в любовь Господа."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Наставления о радости"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "Этого правителя тронула служба в соборе, посвящённая утешению в Боге."
 pam_cardinal_order_improve_development_modifier: "Кардинальское распоряжение повышать развитие"
 pam_cardinal_order_improve_development_modifier_desc: "По велению начальства кардинал способствует развитию местного архидиоцеза."
 pam_cardinal_order_convert_faith_modifier: "Кардинальское распоряжение менять конфессию"
 pam_cardinal_order_convert_faith_modifier_desc: "По велению начальства кардинал способствует обращению в другую конфессию в местном архидиоцезе и соседних землях.\n\n$EFFECT_LIST_BULLET$[Concept('convert_county', 'Смена конфессии')|E] в этом [Concept('county', 'графстве')|E]: #P +25%#!"
 pam_cardinal_order_increase_control_modifier: "Кардинальское распоряжение усиливать контроль над графством"
 pam_cardinal_order_increase_control_modifier_desc: "По велению начальства кардинал способствует усмирению населения в местном архидиоцезе."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Распоряжение подогревать культурный интерес"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "По велению начальства кардинал способствует ускоренному изучению новых технологий."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Кардинальское распоряжение улучшать сопротивляемость поветриям"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "По велению начальства кардинал направляет ресурсы Церкви на помощь в противодействии поветриям."
 pam_cardinal_order_improve_legitimacy_modifier: "Кардинальское распоряжение повышать легитимность"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "По велению начальства кардинал способствует укреплению легитимности правителей в местном архидиоцезе."
 pam_cardinal_order_undermine_legitimacy_modifier: "Кардинальское распоряжение подрывать легитимность"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "По велению начальства кардинал подрывает легитимность правителей в местном архидиоцезе."
 heathen_mandate_modifier: "Язычники проповедуют легитимность"
 heathen_mandate_modifier_desc: "Священники языческого правителя претендуют на души, населяющие эту землю. Свои притязания они подкрепляют своей ложной верой."
 pam_recently_baptized_at_domicile_modifier: "Недавнее крещение"
 pam_recently_baptized_at_domicile_modifier_desc: "Этот персонаж был крещён в баптистерии соборного комплекса архидиоцеза."
 pam_khachkar_ancestral_county: "Хачкар в честь предков"
 pam_khachkar_ancestral_county_custom_desc: "Воздвигнуто для правителя по имени [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed], заказчик — [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetHerHis] [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"
 pam_denied_new_pope_modifier: "Непризнание нового папы"
 pam_denied_new_pope_modifier_desc: "Этот персонаж отказался признать недавно избранного папу."
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "Освященное положение"
 pam_dulia_relic_piety_per_dread_modifier: "Аура мученика"
 pam_dulia_relic_piety_per_knight_modifier: "Благословение войска"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Милость утешения"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Помазание святыми"
 pam_dulia_relic_learning_per_piety_modifier: "Блистательная набожность"
 pam_dulia_relic_monthly_piety_modifier: "Источник милости"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "Арбитр веры"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "Этот персонаж разрешил спор о формулировке символа веры ещё до того, как Вселенский собор начал её обсуждение."
 pam_ecumenical_council_primacy_upheld_modifier: "Поддержание верховенства"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "Этого персонажа спросили на совете, кому должна подчиняться церковь, на что он дал свой чёткий и исчерпывающий ответ."
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "Новый посредник"
 pam_dulia_new_saint_modifier_desc: "Этот персонаж вдохновлён причислением другого человека к лику святых."
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "Паломник всех святынь"
 pam_pilgrim_of_every_holy_site_modifier_desc: "Этот персонаж посетил каждую святыню, которую признаёт его конфессия."
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "Сохранённые узы"
 tenet_harmonious_society_five_bonds_modifier_desc: "Правитель и подданный, родитель и дитя, муж и жена, старший и младший, друг и друг. Этот персонаж поддерживает одно из этих взаимоотношений в гармонии."
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "Апостольское преемство"
 tenet_apostolic_succession_episcopate_modifier_desc: "Этот персонаж принадлежит к конфессии, в которой преемственность епископов восходит к первым апостолам через непрерывную череду рукоположений, что придаёт им легитимность."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Увеличивается с каждым [Concept('theocratic_vassal', 'теократическим вассалом')|E] (максимум [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "Хоры верных"
 tenet_divine_liturgy_choirs_modifier_desc: "В каждой церкви, принадлежащей этому персонажу, в одно и то же время поются одни и те же слова, и так было всегда на памяти ныне живущих."
 modifier_definition_value_per_held_temple: "\t#weak Увеличивается с каждым [Concept('temple_holding', 'храмовым владением')|E] (максимум [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "Должные церемонии"
 tenet_divine_liturgy_officiant_modifier_desc: "Этот персонаж крайне серьёзно относится к божественной литургии своей конфессии."
 tenet_divine_liturgy_schola_cantorum_modifier: "Schola Cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "При дворе сюзерена, содержащего школу песнопения, всегда найдётся красноречивый священнослужитель."
 tenet_pentarchy_holy_site_modifier: "Патриарший престол"
 tenet_pentarchy_holy_site_modifier_desc: "Святое место этого графства процветает благодаря заботам верующих."
 tenet_polyamory_new_beloved_modifier: "Светится от новой любви"
 tenet_polyamory_new_beloved_modifier_desc: "Этот персонаж витает в облаках от новой любви."
 modifier_definition_value_per_chaplain_learning: "\t#weak Увеличивается в зависимости от [Concept('learning', 'учености')|E] [Concept('court_chaplain', 'придворного капеллана')|E] (максимум [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "Долг наказания"
 tenet_purgatory_sin_penalty_modifier_desc: "Грех, в котором покаялись — это прощённый грех, но это не отменяет положенного наказания. То, что не уплачено в этой жизни, переходит в следующую, и верующие прекрасно видят, какой путь избрал этот персонаж."
 tenet_original_sin_sinners_insight_modifier: "Понимание греха"
 tenet_original_sin_sinners_insight_modifier_desc: "Тот, кто несёт в себе тяжесть греха, знает, где именно он скрывается в других."
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "Окропленная кровью"
 pam_holy_weapon_1_artifact_modifier_desc: "Эта [Concept('holy_relic', 'реликвия')|E] принесла победу в бою с врагами [Concept('faith', 'веры')|E]. Верующие начали подмечать это."
 pam_holy_weapon_2_artifact_modifier: "Прошедшая войну"
 pam_holy_weapon_2_artifact_modifier_desc: "После множества побед против других [Concept('religions', 'религий')|E] стало невозможно списывать всё на удачу."
 pam_holy_weapon_3_artifact_modifier: "Известная реликвия"
 pam_holy_weapon_3_artifact_modifier_desc: "Слава опережает её. Фанатики воодушевляются при виде её."
 pam_holy_weapon_4_artifact_modifier: "Инструмент Провидения"
 pam_holy_weapon_4_artifact_modifier_desc: "Обладатель этой реликвии служит проводником воли бога, а его спутники сражаются с ещё большим рвением."
 # Challenge Head of Faith war aftermath
 pam_house_schismatic_sponsor_modifier: "Покровитель-схизматик"
 pam_house_schismatic_sponsor_modifier_desc: "Этот дом поддержал [Concept('challenger_hof', 'соперничающего главу конфессии')|E], который потерпел неудачу."
 pam_house_martyred_pontiff_modifier: "Мученик дома"
 pam_house_martyred_pontiff_modifier_desc: "Представитель этого дома погиб в результате войны за [Concept('head_of_faith', 'главенство в конфессии')|E]."
 pam_deposed_pontiff_modifier: "Свергнутый глава конфессии"
 pam_deposed_pontiff_modifier_desc: "Этого персонажа свергли с поста [Concept('head_of_faith', 'главы конфессии')|E]"
 pam_ch_hof_sacred_bloodguilt_modifier: "Повинность в смерти"
 pam_ch_hof_sacred_bloodguilt_modifier_desc: "Этот персонаж совершил убийство в ходе войны за [Concept('head_of_faith', 'главенство в конфессии')|E]."
 pam_ch_hof_penitent_road_modifier: "Епитимья"
 pam_ch_hof_penitent_road_modifier_desc: "В результате войны за [Concept('head_of_faith', 'главенство в конфессии')|E] этот персонаж был осуждён и поклялся исполнить епитимью."
 pam_blessed_passing_modifier: "Благословенная смерть"
 pam_blessed_passing_modifier_desc: "Предшественник этого персонажа ушёл из жизни в ходе благословенного ритуала, и это благословение передалось и ему тоже."
