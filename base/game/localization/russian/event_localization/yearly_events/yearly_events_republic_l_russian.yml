l_russian:
 yearly_republic.1001.t: "Лучше ложись спать"
 yearly_republic.1001.desc: "Время близится к полночи, но я по-прежнему сижу за бумагами и в который раз просматриваю торговые книги. За этим занятием меня и находит [Select_CString(spouse_target.IsFemale, 'моя жена', 'мой муж')] — [spouse_target.GetTitledFirstName|l].\n\n«[Select_CString(ROOT.Char.IsFemale, 'Любимая', 'Любимый')], прошу тебя, лучше ложись спать! — произносит [Select_CString(spouse_target.IsFemale, 'она', 'он')] жалобным голосом. — Ведь поработать можно будет и завтра…».\n\n«Или так, — задумавшись, говорит [spouse_target.GetFirstNameNoTooltip]. — Хочешь, я помогу тебе с заботами?»."
 yearly_republic.1001.a: "Это очень мило. Принеси, пожалуйста, побольше свечей."
 yearly_republic.1001.b: "Отстань! Мне очень многое нужно сделать."
 yearly_republic.1001.c: "Пока ты рядом, весь мир может подождать."
 yearly_republic.1001.communal: "Мнение всех [Concept('vassals', 'вассалов')|E] о #value вас#! повышается на #P 10#! ед."
 yearly_republic.1002.t: "Трудный брак"
 yearly_republic.1002.desc: "Мой брак приносит мне только несчастья: я и [spouse_target.GetTitledFirstName|l], кажется, не ладим вообще ни в чём, и [Select_CString(spouse_target.IsFemale, 'она', 'он')], несомненно, никогда не упускает случая написать родным о моих «недостатках».\n\nМои расчёты на то, что этот брак укрепит мои деловые связи с домом [spouse_target.GetDynastyHouseName], пошли прахом: при каждой встрече с посредниками и клиентами этой фамилии я вижу в их глазах только недоверие.\n\nЕсли ничего не изменится, эта неприязнь будет, подобно гниющей ране, только ухудшаться и когда-нибудь окончательно и бесповоротно отравит отношения между нашими семьями."
 yearly_republic.1002.a: "[spouse_target.GetFirstNameNoTooltip] и [Select_CString(spouse_target.IsFemale, 'её', 'его')] дом ещё будут мне благодарны — я попросту куплю их признательность."
 yearly_republic.1002.b: "Я подделаю [Select_CString(spouse_target.IsFemale, 'её', 'его')] письма так, чтобы в них была только хвала в мой адрес."
 yearly_republic.1002.c: "[ROOT.Char.GetFaith.random_GoodGodNames] мне в свидетели, я исправлюсь и стану лучше!"
 yearly_republic.1002.d: "Пусть думают что хотят."
 yearly_republic.1002.tt.falsifying_success.desc: "Подделать супружеские письма, чтобы выставить себя в более выгодном свете"
 yearly_republic.1002.falsifying_success.toast: "Семейство [spouse_target.GetDynastyHouseName] убеждено, что вы исправились"
 yearly_republic.1002.tt.falsifying_failure.desc: "Неудачно попытаться подделать письма"
 yearly_republic.1002.falsifying_failure.toast: "Мнение семейства [spouse_target.GetDynastyHouseName] о вас становится только хуже"
 yearly_republic.1002.tt.impress_spouse_success.desc: "Ваша супруга или супруг под впечатлением от ваших стараний"
 yearly_republic.1002.impress_spouse_success.toast: "Семейство [spouse_target.GetDynastyHouseName] одобряет ваши старания"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "Ваша супруга или супруг не впечатляется вашими стараниями"
 yearly_republic.1002.impress_spouse_failure.toast: "Семейство [spouse_target.GetDynastyHouseName] считает, что вы — пропащий человек"
 yearly_republic.1003.t: "Маргинальная честь"
 yearly_republic.1003.desc: "«Ты что, с ума [Select_CString(rook_01.IsFemale, 'сошла', 'сошёл')] — драться посреди улицы? Хочешь, чтобы наши дома тоже друг с другом воевать начали? Да ты посмотри на себя, ты же [Select_CString(rook_01.IsFemale, 'вся', 'весь')] в крови!» — вскрикивает [Select_CString(spouse_target.IsFemale, 'моя жена', 'мой муж')] [spouse_target.GetTitledFirstName|l], но [Select_CString(rook_01.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', rook_01)] [rook_01.GetTitledFirstName|l] лишь посмеивается, не обращая внимания на капающую из раны кровь.\n\n«Ничего, [Select_CString(rook_02.IsFemale, 'моей противнице', 'моему противнику')] досталось сильнее! Сейчас [Select_CString(rook_02.IsFemale, 'эта', 'этот')] [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))] [rook_02.GetFirstName] хромает домой [Select_CString(rook_02.IsFemale, 'вся опозоренная', 'весь опозоренный')]».\n\nПроклятые шайки! Эти юнцы шатаются по улицам с оружием, задираются на прохожих, ввязываются в драки и совершают прочие дурные поступки просто ради забавы.\n\n«Пустяки, обычная драка. Не переживай, [rook_01.Custom2('RelationToMeShort', spouse_target)]: я защищаю честь нашей семьи, чтобы никто не посмел клеветать на нас»."
 yearly_republic.1003.a: "Ничего, вырастет — поумнеет."
 yearly_republic.1003.b: "Очевидно, [Select_CString(rook_02.IsFemale, 'виновница', 'виновник')] здесь — [rook_02.GetNameNoTooltip]. Мы требуем компенсации!"
 yearly_republic.1003.c: "Мы пошлём семейству [rook_02.GetDynastyHouseNameNoTooltip], чтобы задобрить его."
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "Ваши обвинения против нашего дома беспочвенны, нелепы и лишены всяких оснований.\n\nОт нас вы не получите ничего. А если всё же решите продолжить этот спор, придётся иметь дело с нашими клинками."
 yearly_republic.1004.b.desc: "Я, как [other_house_character_01.GetDynastyHouseName] и глава дома, искренне сожалею, что между нашими семьями возникло столь неприятное недоразумение. Приношу свои извинения за случившееся и прошу принять этот дар в знак примирения."
 yearly_republic.1004.a: "Они ещё пожалеют, что отнеслись ко мне так неуважительно!"
 yearly_republic.1004.b: "Хорошо, возмещения ущерба добьёмся позже."
 yearly_republic.1004.c: "Мы согласны с тем, что это справедливо."
 yearly_republic.1004.d: "Пусть на этом закончится вражда между нами."
 yearly_republic.1005.t: "Народ требует остановиться"
 yearly_republic.1005.desc: "[capital_01.GetName] вновь пожинает плоды раздора между моим домом и семейством [other_house_character_01.GetDynastyHouseName]: наши извозчики сцепились на узкой улице, поспорив, кто кого должен пропустить, и теперь пройти или проехать не может вообще никто. Обратить внимание на эту несущественную ссору пришлось только тогда, когда у моей двери собралась негодующая толпа.\n\n«Хватит! — кричит кто-то. — Как вы прикажете нам жить, если [ROOT.Char.GetDynastyHouseName] и [other_house_character_01.GetDynastyHouseNameNoTooltip] постоянно между собой грызутся? Не втягивайте весь город в свои распри!».\n\n[Select_CString(house_member_01.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] [house_member_01.GetTitledFirstName|l] презрительно фыркает: «С какой стати они будут нам указывать, как себя вести?»."
 yearly_republic.1005.a: "Нет, [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] [Select_CString(house_member_01.IsFemale, 'моя', 'мой')]. [other_house_character_01.GetDynastyHouseNameNoTooltip] и я должны договориться."
 yearly_republic.1005.b: "Благодаря своему красноречию я переложу вину на дом [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.c: "Стража! Прогоните эту шваль подальше!"
 yearly_republic.1005.tt.oratory_blame.desc: "Поразить толпу своим красноречием"
 yearly_republic.1005.tt.oratory_blame.toast: "Вы переложили вину на случившееся на дом [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Потонуть в насмешках толпы"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "Вам не удалось переложить вину на дом [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "Вы совершенно правы. Пора сесть за стол переговоров и дать голос рассудку — ради тех, кто будет жить после нас, и ради блага республики. Мы готовы встретиться с вами."
 yearly_republic.1006.b.desc: "Увы, пока что мы не видим достойных причин позволить вам открыто лгать нам в лицо. Очевидно, что вы всего лишь ищете удобную возможность причинить нам вред. Переговоров не будет."
 yearly_republic.1006.a: "Прекрасно!"
 yearly_republic.1006.b: "Проклятье!"
 yearly_republic.1007.t: "[ROOT.Char.GetDynastyHouseNameNoTooltip] и [other_house_character_01.GetDynastyHouseNameNoTooltip] ослабляют напряжённость"
 yearly_republic.1007.desc: "Встреча проходит на нейтральной территории, в одном из городских заведений. Я сажусь за стол; напротив меня сидит [other_house_character_01.GetTitledFirstName]. Воздух словно звенит от напряжения. Наши люди заполонили помещение и расселись по разные стороны, словно два войска перед битвой. Под плащами у многих наверняка спрятаны кинжалы.\n\n«Итак, — сухо произносит [other_house_character_01.GetFirstNameNoTooltip]. — Говорите».\n\nКаждый взор сейчас повёрнут ко мне. Я собираюсь с мыслями и начинаю."
 yearly_republic.1007.a: "Вражда вредит нашим делам."
 yearly_republic.1007.b: "Мы с вами — [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l]. Нам следует заключить мир."
 yearly_republic.1007.c: "Пролилась кровь; так пусть же кровь и станет связующими нас узами."
 yearly_republic.1007.d: "Пусть за нас выскажется сталь — здесь и сейчас!"
 yearly_republic.1007.tt.detente_business.desc: "[other_house_character_01.GetShortUINameNoTooltip] находит ваши доводы убедительными"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip] [Select_CString(other_house_character_01.IsFemale, 'убеждена', 'убеждён')]"
 yearly_republic.1007.tt.detente_business_failure.desc: "[other_house_character_01.GetShortUINameNoTooltip] не находит ваши доводы убедительными"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip] [Select_CString(other_house_character_01.IsFemale, 'убеждена', 'убеждён')] не полностью"
 yearly_republic.1007.detente_business.change.desc: "Оба дома соглашаются уладить разногласия из деловых соображений."
 yearly_republic.1007.piety.change.desc: "Оба дома соглашаются уладить разногласия ради [ROOT.Char.GetFaith.HighGodNamePossessive]."
 yearly_republic.1007.detente_marriage.change.desc: "Оба дома соглашаются уладить разногласия с помощью брака."
 yearly_republic.1007.duel_win.desc: "Вы побеждаете в поединке"
 yearly_republic.1007.duel_win.toast: "[other_house_character_01.GetShortUINameNoTooltip] [Select_CString(other_house_character_01.IsFemale, 'заколота', 'заколот')] вами"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip] побеждает в поединке"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip] закалывает вас"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip] [Select_CString(other_house_character_01.IsFemale, 'ранена или убита', 'ранен или убит')]"
 yearly_republic.1007.duel_loss.custom: "Вы получаете ранение или умираете"
 yearly_republic.1007.c.tt.suitable_pair: "В обоих домах есть не состоящие в браке выходцы; они могут заключить брак друг с другом"
 house_relation_reason_falsify_good_desc: "Получены письма с похвалами в адрес главы дома"
 house_relation_reason_falsify_bad_desc: "Выяснилось, что письма подделаны главой дома"
 house_relation_reason_thorny_desc: "Несчастливый брак приводит к раздору"
 house_relation_reason_bribery_good_desc: "Супруг или супруга купается в золоте и драгоценностях"
 house_relation_reason_street_combat_desc: "Драка на улице между молодыми отпрысками глав домов"
 house_relation_reason_business_argument_desc: "Обсуждены выгоды от ведения дел"
 house_relation_reason_house_blamed_desc: "Обвинены в народных возмущениях"
 house_relation_reason_houses_aligned_desc: "Объединены усилия на встрече с близкими по духу домами"
 house_relation_reason_cooperation_desc: "Упрочнено взаимодействие между домами"
 demand_reparation_for_fight_desc: "Отправить письмо с требованием компенсации"
 pay_reparation_for_fight_desc: "Отправить письмо с подарком и извинениями"
 offer_a_sitdown_desc: "Отправить письмо с предложением уменьшить напряжённость"
 yearly_republic.1008.t: "Волки в купеческой шкуре"
 yearly_republic.1008.desc: "До меня дошли любопытные сведения.\nОдин из капитанов торговых судов, которого [Select_CString(other_patrician_01.IsFemale, 'наняла', 'нанял')] к себе на службу [other_patrician_01.GetTitledFirstName|l], во время рейсов по Средиземноморью промышляет грабежом, а захваченные товары продаёт, чтобы набить себе кошель. Подлинный волк в овечьей шкуре!\n\nНеизвестно, получает ли свою долю [other_patrician_01.GetFirstNameNoTooltip], однако членам собрания, чьи корабли и грузы страдают от пиратских набегов, это вряд ли будет важно."
 yearly_republic.1008.a: "Немедленно нанять этого капитана себе."
 yearly_republic.1008.b: "Угрожать капитану, пока [Select_CString(bandit_01.IsFemale, 'та', 'тот')] не согласится делиться добычей."
 yearly_republic.1008.c: "Пригрозить раскрыть тайну; выгодно иметь рычаг давления над таким человеком, как [other_patrician_01.GetFirstNameNoTooltip]."
 yearly_republic.1009.t: "Секреты в салоне"
 yearly_republic.1009.desc: "Я провожу день в уютном салоне, которым заведует [patrician_spouse_01.GetTitledFirstName|l].\n\nПодле меня сидит [Select_CString(relation_01.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName|l], и мы коротаем время за приятной беседой, в чём неплохо помогает [patrician_spouse_01.Custom('GetExpensiveDrink')|l]. Вдруг я замечаю, как на стене, около большой ширмы шевелится тень. Присмотревшись, я понимаю: за ширмой кто-то короткими и точными движениями что-то пишет. [relation_01.GetFirstNameNoTooltip] замолкает — и рука немедленно останавливается. Каждое наше слово здесь записывается.\n\nПохоже, хозяева салона — [patrician_spouse_01.GetFirstNameNoTooltip] и [Select_CString(patrician_spouse_01.IsFemale, 'её', 'его')] [Select_CString(patrician_husband_01.IsFemale, 'жена', 'муж')] [patrician_husband_01.GetTitledFirstName|l] — шпионят за посетителями."
 yearly_republic.1009.a: "Нужно каждого предупредить об этой подлости!"
 yearly_republic.1009.a.tt: "Мнение о #value вас#! повышается на #P 20#! ед., а о персонажах [patrician_spouse_01.GetShortUINameNoTooltip] и [patrician_husband_01.GetShortUINameNoTooltip] — понижается на #N 25#! ед."
 yearly_republic.1009.b: "Замечательная идея! Надо сделать у себя так же."
 yearly_republic.1009.c: "Прибегнуть к шантажу, сказав, что вам известен секрет, который скрывают [patrician_spouse_01.GetFirstNameNoTooltip|l] и [Select_CString(patrician_spouse_01.IsFemale, 'её', 'его')] [Select_CString(patrician_spouse_01.IsFemale, 'жена', 'муж')]."
 yearly_republic.1009.c.success.desc: "Перехитрить [Select_CString(patrician_spouse_01.IsFemale, 'её', 'его')]"
 yearly_republic.1009.c.success.toast: "Вы получаете сильное влияние на персонажа [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip] оказывается хитрее вас"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip] теперь ближе к тому, чтобы стать [Select_CString(patrician_husband_01.IsFemale, 'вашей соперницей', 'вашим соперником')]"
 yearly_republic.1009.flavor: "Кто знает, какие тайны удастся подслушать?"
 yearly_republic.1009.b.secret_learned: "Ваши шпионы узнали секрет"
 yearly_republic.1010.t: "Патриции под крышей"
 yearly_republic.1010.desc: "Во время неспешной прогулки ко мне подходит [Select_CString(relation_01.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName|l] и, понизив голос, шепчет:\n\n«Посол [ambassador_01.GetFirstName] [Select_CString(ambassador_01.IsFemale, 'вернулась', 'вернулся')] из поездки по области [ambassador_mission_location_01.GetName] и сегодня вечером будет докладывать на закрытом заседании совета во дворце».\n\nВздохнув, [relation_01.GetSheHe] качает головой: «Только представь, как хорошо пошла бы наша торговля, если бы мы узнали обо всём раньше собрания!»\n\n[relation_01.GetFirstNameNoTooltip] продолжает говорить, а я смотрю на крышу далёкого дворца. В голову закрадывается одна мысль…"
 yearly_republic.1010.a: "Мы снимем черепицу с крыши дворца и подслушаем."
 yearly_republic.1010.b: "Может быть, [ambassador_01.GetFirstNameNoTooltip] согласится всё рассказать, если проявить убедительность?"
 yearly_republic.1010.c: "Со временем всё узнаем."
 yearly_republic.1010.a.success.desc: "Вы подслушиваете доклад"
 yearly_republic.1010.a.success.toast: "Вы подслушиваете доклад"
 yearly_republic.1010.a.mixed.desc: "Вы падаете с крыши"
 yearly_republic.1010.a.mixed.toast: "Вы падаете с крыши"
 yearly_republic.1010.a.failure.desc: "Вы падаете на пол помещения"
 yearly_republic.1010.a.failure.toast: "Вы падаете на пол помещения"
 yearly_republic.1010.a.mixed.custom: "Вы и [relation_01.GetShortUIName] получаете [Concept('trait', 'свойство')|E] «[GetTrait('wounded_1').GetName( GetNullCharacter )|LV]»"
 yearly_republic.1010.a.failure.custom: "[Concept('opinion', 'Мнение')|E] персонажа [republic_ruler.GetShortUIName|U] о вас и персонаже [relation_01.GetShortUIName] снижается на #N 25#! ед. #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW Преступление — [republic_ruler.GetShortUIName] имеет право заключить вас обоих в тюрьму#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip] не против взятки"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip] считает ваш вопрос оскорбительным"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip] делится с вами докладом"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip] отказывается брать взятку"
 yearly_republic.1011.t: "Вызов на совет"
 yearly_republic.1011.desc: "Меня вновь вызывают на один из многочисленных закрытых советов, без которых не может существовать республика.\n\nЭто обязательство отнимает у меня драгоценное время, которое можно было бы уделить семье и делам, однако я, будучи патрицием, не могу отказаться без уважительной причины или разрешения от собрания."
 yearly_republic.1011.a: "Я попрошу своего врача подтвердить, что болезнь приковала меня к постели."
 yearly_republic.1011.b: "У меня болеет [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)] — я имею право остаться дома."
 yearly_republic.1011.c: "Я попрошу собрание о разрешении, которое на 5 лет освободит меня от этой обязанности."
 yearly_republic.1011.d: "Я не стану уклоняться от выполнения долга."
 yearly_republic.1011.c.success.desc: "Собрание даёт разрешение"
 yearly_republic.1011.c.success.toast: "Собрание дало вам разрешение"
 yearly_republic.1011.c.failure.desc: "Собрание отказывается выдать разрешение"
 yearly_republic.1011.c.failure.toast: "Собрание отказалось выдать разрешение"
 yearly_republic.1012.t: "[ROOT.Char.GetTitleAsNameNoTooltip] и шествие"
 yearly_republic.1012.desc: "На глазах затаившей дыхание толпы разворачивается величественное зрелище: процессия, главной фигурой в которой выступает [ROOT.Char.GetTitleAsName|l], выходит из дворцовых ворот на городские улицы.\n\nВпереди шествуют чиновники — каждый в соответствии со своим положением и знатностью. За ними появляюсь я, [ROOT.Char.GetTitleAsNameNoTooltip|l], в лучшем парадном платье. Над толпой несут знаки моей власти, чтобы народ смог разглядеть их получше.\nСледом идут патриции, выстроенные по знатности своих домов.\n\nКаждый на своём месте. Мы — воплощение иерархии республики, её величия, и пусть никто из созерцающих это торжественное зрелище не посмеет в нас усомниться."
 yearly_republic.1012.a: "За республику! За народ!"
 yearly_republic.1012.b: "Слава собранию!"
 yearly_republic.1012.c: "Всё это — воплощение моей славы!"
 yearly_republic.1012.c.tt: "В течение следующих #V 10#! лет принятие [Concept('succession_law', 'закона о наследовании')|E] «$republican_despot_succession_law$» стоит на #P 50%#! меньше [Concept('prestige', 'престижа')|E]"
 yearly_republic.1013.t: "Обручение с морем"
 yearly_republic.1013.desc: "[Glossary( '#bold Бучинторо#!', 'BUCENTAUR_GLOSS' )] минует последние острова лагуны, и передо мной раскидывается солёная гладь Адриатики. [bishop_01.GetTitledFirstName] подаёт мне церемониальное кольцо и отступает.\nЯ поднимаю кольцо, показывая его собравшимся сановникам, и, следуя древнему обычаю, бросаю его в зелёные волны.\n\n«[Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )]!» — провозглашаю я, и толпа на борту отвечает громкими возгласами. Так совершается союз нашей республики с морем — источником её богатства и могущества."
 yearly_republic.1013.a: "Мы правим морями!"
 yearly_republic.1013.b: "Глупый и бессмысленный ритуал."
 yearly_republic.1013.c: "Я иду, любовь моя!"
 yearly_republic.1013.d: "Я буду хранить верность морю!"
 yearly_republic.1014.t: "Согласование интересов"
 yearly_republic.1014.desc: "Главы домов, ведомых единым устремлением (и это, конечно, [faction_head_01.GetHouse.GetHouseAspiration.GetName]), все как один откликнулись на приглашения, которые [Select_CString(faction_head_01.IsFemale, 'разослала', 'разослал')] [faction_head_01.GetTitledFirstName|l].\n\n«Друзья мои! Сегодня как никогда важно держаться вместе. Только общие и согласованные интересы помогут нам выстоять, иначе другие силы, что действуют в нашей любимой республике, рассорят и сокрушат нас».\n\nСпоры продолжаются до глубокой ночи. Разногласий хватает, но сильный голос способен сгладить их и помочь домам выступить единым фронтом."
 yearly_republic.1014.a: "«Нам всем следует присоединиться к гвельфам»."
 yearly_republic.1014.b: "«Нам всем следует присоединиться к гибеллинам»."
 yearly_republic.1014.c: "«Укрепим узы, что связывают наши дома»."
 yearly_republic.1014.d: "«Пора положить конец соперничеству между нами»."
 yearly_republic.1014.e: "«Нужно согласовать наши деловые интересы»."
 yearly_republic.1014.e.tt: "Все [Concept('patricians', 'патриции')|E] с [Concept('house_ambition', 'амбицией дома')|E] «[faction_head_01.GetHouse.GetHouseAspiration.GetName]» на 2 года получают модификатор «[GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip]»"
 yearly_republic.1014.a.tt: "Все [Concept('patricians', 'патриции')|E] с [Concept('house_ambition', 'амбицией дома')|E] «[faction_head_01.GetHouse.GetHouseAspiration.GetName]» становятся участниками [Concept('situation_participant_group', 'группы')|E] «[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName]»"
 yearly_republic.1014.b.tt: "Все [Concept('patricians', 'патриции')|E] с [Concept('house_ambition', 'амбицией дома')|E] «[faction_head_01.GetHouse.GetHouseAspiration.GetName]» становятся участниками [Concept('situation_participant_group', 'группы')|E] «[GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName]»"
 yearly_republic.1014.c.tt: "[Concept('house_relations', 'Отношения между домами')|E] всех [Concept('patricians', 'патрициев')|E] с [Concept('house_ambition', 'амбицией дома')|E] «[faction_head_01.GetHouse.GetHouseAspiration.GetName]» улучшаются"
 yearly_republic.1014.d.tt: "Всё соперничество и вражда между [Concept('patricians', 'патрициями')|E] с [Concept('house_ambition', 'амбицией дома')|E] «[faction_head_01.GetHouse.GetHouseAspiration.GetName]» заканчивается"
 yearly_republic.1014.tt.align_guelphs_success.desc: "Собрание удалось убедить, и все дома посвящают себя делу гвельфов"
 yearly_republic.1014.align_guelphs_success.toast: "Дома принимают сторону гвельфов"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "Спор заходит в тупик, и дома решают держаться каждый сам по себе"
 yearly_republic.1014.align_guelphs_failure.toast: "Дома остаются разделёнными"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "Собрание удалось убедить, и все дома посвящают себя делу гибеллинов"
 yearly_republic.1014.align_ghibellines_success.toast: "Дома принимают сторону гибеллинов"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "Спор заходит в тупик, и дома решают держаться каждый сам по себе"
 yearly_republic.1014.align_ghibellines_failure.toast: "Дома остаются разделёнными"
 yearly_republic.1014.d.toast: "Старые обиды похоронены"
 yearly_republic.1014.e.toast: "Дома объединяют свои интересы"
 yearly_republic.1015.t: "Голоса за золото"
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName|U] застаёт меня во время неторопливой прогулки по рынку. Приблизившись с приветливой улыбкой, [Select_CString(patrician.IsFemale, 'она', 'он')] произносит, понизив голос:\n\n«До чего же тоскливы голосования на собрании! Так приятно немного от них отвлечься. Порой я просто не знаю, за что голосовать. А ваш же ум подобен маяку в тумане: он всегда укажет путь растерявшимся и погрязшим в столь запутанных политических делах», — с этими словами [Select_CString(patrician.IsFemale, 'она', 'он')] трагически вздыхает.\n\n«Вот только сейчас у меня пустоват кошель. Как же бедному лодочнику понять, куда править, когда начнётся очередное голосование?»"
 yearly_republic.1015.a: "Просто назовите свою цену."
 yearly_republic.1015.c: "Голосовать за мои предложения нужно по моим заслугам."
 yearly_republic.1016.t: "Принудительное голосование"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U] — отвратительное и наглое существо, обладающее, тем не менее, правом голоса на собрании. И [Select_CString(patrician.IsFemale, 'её', 'его')] можно было бы «убедить» отдать этот голос в мою пользу.\n\nДостаточно лишь слегка надавить на [Select_CString(patrician.IsFemale, 'неё', 'него')], чтобы дать понять, чем неизбежно чреват отказ такому человеку, как я."
 yearly_republic.1016.a: "Навредить [Select_CString(patrician.IsFemale, 'её', 'его')] деловым интересам."
 yearly_republic.1016.b: "Нанять разбойников, чтобы те поймали и избили [Select_CString(patrician.IsFemale, 'её', 'его')] придворного."
 yearly_republic.1016.c: "Поджечь [Select_CString(patrician.IsFemale, 'её', 'его')] дом."
 yearly_republic.1016.d: "Я покажу [Select_CString(patrician.IsFemale, 'ей', 'ему')], что такое страх!"
 yearly_republic.1016.e: "Пусть голосует так, как [Select_CString(patrician.IsFemale, 'ей', 'ему')] велит совесть."
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip] клянётся голосовать так же, как вы"
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip] получит урок, который послужит другим незабываемым примером."
 yearly_republic.1017.t: "Цари-философы"
 yearly_republic.1017.desc: "Ужин затянулся далеко за полночь. Вино льётся рекой, языки становятся всё развязнее.\nНаша компания — я, [debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName] — успела обсудить, кажется, всё на свете.\n\nЯ невольно ловлю себя на мысли, что беседую с одними из самых образованных патрициев республики. Какое достойное общество! Пожалуй, таких людей можно убедить занять мою сторону на следующем собрании — вескими доводами и блеском мысли."
 yearly_republic.1017.a: "Моё ораторское мастерство убедит их."
 yearly_republic.1017.b: "Здравость моего рассудка поразит их."
 yearly_republic.1017.c: "Возможно, лучше будет слушать и мотать на ус."
 yearly_republic.1017.a.success.desc: "Выступить убедительнее, чем главный оратор — [debater_orator.GetFirstNameNoTooltip]"
 yearly_republic.1017.a.success.toast: "Вы расположили к себе собравшихся"
 yearly_republic.1017.a.failure.desc: "Стать предметом обсуждения главного оратора — это [debater_orator.GetFirstNameNoTooltip]"
 yearly_republic.1017.a.failure.toast: "Собравшиеся остаются глухи к вашим словам"
 yearly_republic.1017.b.success.desc: "Привести доводы более убедительные, чем у образца учёности — это [debater_scholar.GetFirstNameNoTooltip]"
 yearly_republic.1017.b.success.toast: "Вы убедили собравшихся"
 yearly_republic.1017.b.failure.desc: "Проиграть логический спор образцу учёности — это [debater_scholar.GetFirstNameNoTooltip]"
 yearly_republic.1017.b.failure.toast: "Ваш аргумент признают несостоятельным"
 yearly_republic.1017.c.toast: "Ночь внимания"
 yearly_republic.1017.c.tt: "Есть небольшая вероятность, что ночная беседа оставит на вашей душе глубокий отпечаток"
 yearly_republic.1017.c.insight.toast: "Беседа оставила отпечаток"
 yearly_republic.1018.t: "Дары приносящие"
 yearly_republic.1018.desc: "У моих ворот неожиданно появляется [Select_CString(benefactor_01.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName]. После тёплых приветствий и сердечных объятий [benefactor_01.GetFirstNameNoTooltip] ведёт меня на улицу, где стоит доверху нагруженная всевозможными товарами и диковинками телега.\n\n«Прости, что [Select_CString(benefactor_01.IsFemale, 'явилась', 'явился')] без предупреждения. Я [Select_CString(benefactor_01.IsFemale, 'проезжала', 'проезжал')] мимо и [Select_CString(benefactor_01.IsFemale, 'подумала', 'подумал')], что тебе интересно будет посмотреть, что я [Select_CString(benefactor_01.IsFemale, 'привезла', 'привёз')] из путешествия. Представляешь, это [new_curio.GetType]!».\n\nС этими словами [Select_CString(benefactor_01.IsFemale, 'она', 'он')] откидывает полог с телеги, и моему взору является… да, это действительно [new_curio.GetName]."
 yearly_republic.1018.a: "«Спасибо, [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]!»"
 yearly_republic.1018.b: "Может, за эту вещицу получится выручить неплохую сумму?"
 yearly_republic.1018_domicile_curio_sold_tt: "[new_curio.GetName] вскоре уходит покупателю."
 yearly_republic.1019.t: "Внимание к деталям"
 yearly_republic.1019.desc: "Я и [Select_CString(benefactor_01.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName] прогуливаемся по улочкам, любуясь тем, как выглядит сегодня [event_location_01.GetName]. Здесь всегда найдётся что-то интересное, что можно обсудить.\n\n«Ты только посмотри! Ну кто так хранит товары? [target_city.GetNameNoTooltip] и то лучше знает, как надо. Знаешь, [ROOT.Char.GetFirstNameNoTooltip], у окружающих можно многому научиться — стоит лишь быть немного внимательнее»."
 yearly_republic.1019.a: "«Расскажи о своих странствиях. Удалось тебе узнать, что такое [experience_trade_category_01.GetNameNoTooltip]?»"
 yearly_republic.1019.b: "«Давай лучше поговорим о делах. Вот, например, [experience_trade_category_02.GetNameNoTooltip] — как этим лучше торговать?»"
 yearly_republic.1019.c: "Нужно и правда быть внимательнее."
 yearly_republic.1020.t: "Сделка в бане"
 yearly_republic.1020.desc: "«…Ведь дела лучше всего идут с теми, кому доверяешь».\n\nС этими словами [house_benefactor_01.GetFirstName] выливает себе на голову ушат воды и поворачивается ко мне. [Select_CString(house_benefactor_01.IsFemale, 'Её', 'Его')] лицо серьёзно как никогда. «Наша семья глубоко уважает вашу, [ROOT.Char.GetFirstName]».\n\nПар в бане застилает мне глаза, а горячая вода приятно расслабляет мышцы.\n\n«Вы всегда были добры к дому [house_benefactor_01.GetDynastyHouseNameNoTooltip]. Думаю, пора укреплять наши узы. Ведь если действовать сообща, то обе наши семьи только выиграют»."
 yearly_republic.1020.a: "«Нужно расширять охват. Обменяемся посредниками и связями за границей»."
 yearly_republic.1020.b: "«Обменяемся опытом — тогда мы оба станем мудрее»."
 ## GLOSS
 BUCENTAUR_GLOSS: "«Бучинторо» — позолоченная галера дожа Венеции, управляемая гребцами Арсенала. Использовалась только в торжественных церемониях."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! — в переводе с латыни: «обручаемся с тобою, море, в знак постоянного и действительного владычества»."
