l_russian:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "Найден [target.GetAdherentNameNoTooltip|l]!"
 study_faith_outcome.0010.desc: "Мои осторожные расспросы и мелкие взятки наконец принесли свои плоды! И вот [study_faith_target.GetShortUIName] стоит передо мной, уверяя, что [Select_CString(study_faith_target.IsFemale, 'она', 'он' )] настоящий [target.GetAdherentName|l].\n\n"
 study_faith_outcome.0010.desc.in_realm: "Не так давно я [Select_CString(ROOT.Char.IsFemale, 'попросила', 'попросил' )], чтобы к моему двору пришёл настоящий [target.GetAdherentName|l] из нашей державы. И вот [study_faith_target.GetShortUIName] [Select_CString(study_faith_target.IsFemale, 'ответила', 'ответил' )] на мой призыв и [Select_CString(study_faith_target.IsFemale, 'предстала', 'предстал' )] передо мной.\n\n"
 study_faith_outcome.0010.d.intimidated: "«Что я могу для вас сделать, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsName|l]?» — спрашивает [Select_CString(study_faith_target.IsFemale, 'она', 'он' )] дрожащим голосом. Стражники с недоверием смотрят на [Select_CString(study_faith_target.IsFemale, 'неё', 'него' )], готовые в любой момент пресечь [Select_CString(study_faith_target.IsFemale, 'её', 'его' )] колдовство."
 study_faith_outcome.0010.d.safe: "«Что я могу для вас сделать, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsName|l]?» — спрашивает [Select_CString(study_faith_target.IsFemale, 'она', 'он' )] слегка испуганно. Стражники с любопытством разглядывают [Select_CString(study_faith_target.IsFemale, 'её', 'его' )]: они слышали о моих изысканиях."
 study_faith_outcome.0010.a: "Поведай мне о [target.GetNameNoTooltip|l]ой вере."
 study_faith_outcome.0010.b: "Забудь. Мне от тебя ничего не нужно."
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName] будет [Select_CString(study_faith_target.IsFemale, 'отпущен', 'отпущена' )] на свободу и сможет жить так, как считает нужным"
 study_faith_outcome.0101.t: "Знакомство с учением [actor.GetFaith.HighGodNamePossessive]"
 study_faith_outcome.0101.desc: "Благодаря глубокому изучению #L [actor.GetRite.GetName|l]ой#! веры [Select_CString(actor.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|l] [actor.GetName] [Select_CString(actor.IsFemale, 'стала мне более понятна', 'стал мне более понятен' )] как человек, и, самое главное, теперь я ясно вижу путь, который указывает мне [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0101.a: "Пожалуй, моя душа готова к обращению."
 study_faith_outcome.0101.b: "Я не оставлю [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 study_faith_outcome.0102.desc: "Я благодарю вас за то терпение и великодушие, которые вы проявили, помогая мне преодолеть моё невежество. Теперь я могу с уверенностью заявить, что в моём сердце живёт [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0102.a: "Для меня это было единственно правильным решением."
 study_faith_outcome.0103.desc: "[recipient.GetFaith.GoodGodNames] может рассчитывать на мою абсолютную верность. Что бы ни случилось, я не оставлю #L [recipient.GetRite.GetName|l]ую#! веру!"
 study_faith_outcome.0103.a: "Непослушание чревато серьёзными последствиями…"
 study_faith_outcome.0111.t: "Трудности с изучением [actor.GetRite.GetNameNoTooltip|l]ой веры"
 study_faith_outcome.0111.desc: "Несмотря на все мои усилия, изучение #L [actor.GetRite.GetName|l]ой#! веры лишь привело меня в тупик! Мне совершенно непонятна воля [actor.GetFaith.HighGodNamePossessive], и я уже начинаю опасаться, что [Select_CString(actor.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|l] [actor.GetFirstName] попросту заблуждается в своих убеждениях."
 study_faith_outcome.0111.a: "Возможно, понимание придёт после обращения…"
 study_faith_outcome.0111.b: "Я буду учиться вдвое усерднее."
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$: прорыв"
 study_faith_outcome.1000.desc: "После долгого и упорного труда всё наконец встало на свои места. Бесчисленные часы изучения писаний, бессонные ночи отправления обрядов, бесконечное постижение #L [target.GetFaith.GetName|l]ого#! богословия… Всё это позволило мне вникнуть в самые глубины #L [target.GetRite.GetName|l]ой#! веры!\n\nВо время учёбы образцом для меня [Select_CString(target.IsFemale, 'была', 'был')] [target.GetTitledFirstName|l], и теперь, кажется, я начинаю понимать, почему [target.GetRite.GetAdjective|l] привлекает к себе столь многих людей."
 study_faith_outcome.1000.a: "Мне под силу познать любое верование!"
 study_faith_outcome.1000.b: "Теперь [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l] кажется мне разумнее, чем моя собственная вера…"
 study_faith_outcome.1200.t: "$study_faith$: понимание догмата"
 study_faith_outcome.1200.desc: "Стены моего кабинета стали свидетелями моего скромного триумфа: я начинаю понемногу понимать тонкости такого загадочного #L [target.GetRite.GetName|l]ого#! понятия, как «[discovered_tenet.GetName( target.GetRite )|l]». И хотя для этого приходится несколько напрягать воображение, я всё же могу представить, как [target.GetTitledFirstName|l] со своими родственниками совершает этот диковинный обряд.\n\nКонечно, это лишь небольшой шаг в изучении [target.GetRite.GetNameNoTooltip|l]ой веры и мне ещё предстоит долгий путь, однако мой труд определённо приносит свои плоды."
 study_faith_outcome.1200.a: "Я хочу узнать ещё больше о [target.GetRite.GetNameNoTooltip|l]их практиках!"
 study_faith_outcome.1200.b: "Удивительно. Даже интересно, какое отношение к этому имеет [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )|l]."
 study_faith_outcome.1200.c: "Мне всё это не нравится…"
 study_faith_outcome.1400.t: "$study_faith$: [target.GetRite.GetNameNoTooltip|l]ие обычаи"
 study_faith_outcome.1400.desc: "Чтобы в полной мере понять, что такое [target.GetRite.GetAdjective|l], нужно изучить не только метафизические основы этой религии, но и её влияние на нашу повседневную жизнь.\n\nПосле долгих размышлений о таком понятии, как «[discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )|l]», я наконец-то начинаю представлять, какое отношение оно имеет к #L [target.GetRite.GetName|l]им#! обрядам в целом."
 study_faith_outcome.1400.alt1.desc: "\n\nБолее того, теперь и [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )|l] — уже не такая загадка, как прежде: мне стали понятны некоторые тонкости!"
 study_faith_outcome.1400.alt2.desc: "\n\nЭто лишь малая часть большой головоломки, но даже такие небольшие открытия понемногу приближают меня к пониманию [target.GetRite.GetNameNoTooltip|l]ой веры."
 study_faith_outcome.1400.a: "Полезные знания, но на этом нельзя останавливаться."
 study_faith_outcome.1400.b: "Я буду день и ночь заниматься исследованиями."
 study_faith_outcome.1400.c: "Надо попросить, чтобы [target.GetShortUINameNoTooltip] [Select_CString(target.IsFemale, 'рассказала', 'рассказал')] мне что-нибудь ещё."
 study_faith_outcome.1500.t: "$study_faith$: предел моих знаний"
 study_faith_outcome.1500.desc: "В ходе долгого и кропотливого изучения #L [target.GetRite.GetName|l]ой#! веры мне открылось о ней всё, что только доступно непосвящённому человеку. Если у этого [Concept('rite', 'течения')|E] и остались какие-то тайны, то о них известно лишь его последователям, которые передают свои сокровенные знания из уст в уста и старательно берегут их от посторонних.\n\nТак или иначе, можно с уверенностью сказать, что теперь я знаю об этом учении практически всё."
 study_faith_outcome.1500.a: "Это предел моих знаний."
 study_faith_outcome.1500.toast: "$study_faith$: итоги"
 study_faith_outcome.1500.toast.desc: "Вы изучили все [Concept('core_tenet', 'догматы')|E] и [Concept('doctrine', 'доктрины')|E] #L [target.GetRite.GetName|l]ого#! [Concept('rite', 'течения')|E], которые в принципе доступны непосвящённому в него человеку."
 study_faith_scheme_stays_active: "[Concept('scheme', 'Происки')|E] остаются активными"
 study_faith_outcome.3000.t: "$study_faith$: продолжить учебу?"
 study_faith_outcome.3000.desc: "К несчастью, [target.GetTitledFirstName|l] больше не со мной. Жаль! С [Select_CString(target.IsFemale, 'её', 'его')] помощью было гораздо проще постигать тонкости #L [target.GetFaith.GetName|l]ой#! веры.\n\nВпрочем, это не повод прерывать учёбу. Нужно лишь найти новый пример для подражания!"
 study_faith_outcome.3000.alt1.desc: "К сожалению, оказалось, что [target.GetTitledFirstName|l] — весьма [Select_CString(target.IsFemale, 'посредственная наставница', 'посредственный наставник')] в вопросах #L [target.GetFaith.GetName|l]ой#! веры.\n\nВпрочем, это не повод прерывать учёбу. Нужно лишь найти новый пример для подражания!"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] — вот у кого в сердце горит религиозный огонь!"
 study_faith_outcome.3000.b: "Может, [potential_continuation_target_2.GetTitledFirstNameNoTooltip|l]? [Select_CString(potential_continuation_target_2.IsFemale, 'Она', 'Он')] неплохо разбирается в вопросах богословия."
 study_faith_outcome.3000.c: "Может, [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d: "О, мне как раз нужен был повод прекратить учебу! Ура!"
 study_faith_scheme_retains_progress: "[Concept('scheme', 'Происки')|E] сохраняют весь достигнутый прогресс"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U] изучает течение!"
 child_studied_faith_desc: "Ваш ребёнок узнал больше о #L [target.GetRite.GetName|l]ом#! [Concept('rite', 'течении')|E]"
 child_studied_faith_invalidated_title: "Происки вашего ребёнка («Изучить течение») прекращены"
 child_studied_faith_invalidated_desc: "[Concept('scheme', 'Происки')|E] вашего ребёнка «[GetScheme('study_faith').GetTypeName]» отменены"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$: юношеская легкость"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: легкость ввиду опыта"
 study_faith_ongoing.1000.desc.young: "Я изучаю #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ую#! веру и делаю невероятные успехи — кажется, будто во всём мире никто настолько не отдаётся учёбе!"
 study_faith_ongoing.1000.desc.theologian: "Я изучаю #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ую#! веру и делаю неплохие успехи. Очевидно, эта конфессия во многом схожа с другими в самых основополагающих вопросах!"
 study_faith_ongoing.1000.desc: "\n\n«#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!»\n\nВозможно, в моём изложении эти слова звучат несколько иначе, но главное — я чувствую, что в своих попытках истолковать писания начинаю постигать духовную основу.\n\nЕсли я и дальше буду прикладывать те же усилия, вскоре [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l] раскроет мне свои тайны!"
 study_faith_ongoing.1000.a: "Я посвящу этому #EMP все#! свое время!"
 study_faith_ongoing.1000.b: "Есть и другие дела, которым нужно уделить время..."
 study_faith_ongoing.1010.t: "$study_faith$: личные беседы"
 study_faith_ongoing.1010.desc: "#EMP «[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]»#!\n\nУслышав рядом шаги, я поднимаю глаза и откладываю в сторону рукопись, посвящённую #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! вере. Надо мной [Select_CString(lover_target.IsFemale, 'склонилась', 'склонился')] [lover_target.GetFirstName]; в [Select_CString(lover_target.IsFemale, 'её', 'его')] глазах горит желание.\n\n«Это что-то про религию? [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]?» — интересуется [Select_CString(lover_target.IsFemale, 'она', 'он')].\n\n«Как отрадно, что при дворе есть кто-то, кто тоже верит в высшие силы! Да ещё и [ROOT.Char.GetTitleTierName|l]! Может быть, обсудим эти писания подробнее в… личной беседе?»"
 study_faith_ongoing.1010.a: "Удалимся в мои покои, где нам никто не помешает."
 study_faith_ongoing.1010.b: "Не мешай мне заниматься, [lover_target.Custom('GetDerogatoryNonbeliever')|l]!"
 study_faith_ongoing.1010.c: "Уйди, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Сосредоточиться мешаешь!"
 study_faith_ongoing.1010.c.tt: "#EMP Вы захлопываете дверь прямо перед [Select_CString(lover_target.IsFemale, 'её', 'его')] лицом и возвращаетесь к занятиям#!"
 study_faith_ongoing.1011.t: "$study_faith$: ложный след"
 study_faith_ongoing.1011.desc: "Мои давние опасения подтвердились: нескольких невинных на первый взгляд вопросов оказалось достаточно, чтобы вскрылась ложь, которую [Select_CString(scheme.GetTargetCharacter.IsFemale, 'лила', 'лил')] мне в уши [scheme.GetTargetCharacter.GetTitledFirstName|l]. Я больше не верю [Select_CString(scheme.GetTargetCharacter.IsFemale, 'её', 'его')] сладким речам: очевидно, что приверженность этого человека #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! вере неискренна!\n\nИ хотя отодвинуть завесу лжи было по-своему любопытно, [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip|l] всё-таки требует тщательного изучения. Пожалуй, мне понадобится помощник, который будет веровать искренне…"
 study_faith_ongoing.1011.a: "[scheme.GetTargetCharacter.GetShortUINameNoTooltip] больше не тот человек, на которого можно положиться."
 study_faith_ongoing.1011.b: "Если [Select_CString(scheme.GetTargetCharacter.IsFemale, 'ей', 'ему')] удавалось так долго скрывать свою неверность, то, возможно, и я тоже смогу…"
 study_faith_ongoing.1011.c: "Так во что же [scheme.GetTargetCharacter.GetShortUINameNoTooltip] тогда верит #EMP по-настоящему#!?"
 study_faith_ongoing.1011.c.tt: "Я постараюсь выяснить, во что [Select_CString(scheme.GetTargetCharacter.IsFemale, 'она', 'он')] верит на самом деле."
 study_faith_ongoing.1012.t: "$study_faith$: древние обряды"
 study_faith_ongoing.1012.desc: "Мои стремления выяснить, какую же всё-таки веру исповедует [scheme.GetTargetCharacter.GetTitledFirstName|l], принесли неожиданные плоды: [Select_CString(scheme.GetTargetCharacter.IsFemale, 'она', 'он')] не просто не придерживается [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]ой конфессии — [Select_CString(scheme.GetTargetCharacter.IsFemale, 'она', 'он')] справляет диковинные, давно позабытые обряды совсем иной религии, которая называется [actual_faith.GetAdjective|l] и скорее напоминает… колдовство.\n\nЭта новость стала для меня подлинным потрясением. Может, из этого получится извлечь какую-то выгоду?"
 study_faith_ongoing.1012.a: "Так-так, это весьма #EMP любопытно#!."
 study_faith_ongoing.1012.b: "Мне понадобится новый наставник."
 study_faith_ongoing.1012.b.tt: "Вы попытаетесь найти похожего наставника, чтобы и дальше изучать [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]ую веру"
 study_faith_ongoing.1012.c: "Это мне нравится гораздо больше, чем [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]!"
 study_faith_ongoing.1012.c.tt: "Теперь вы будете изучать [actual_faith.GetNameNoTooltip|l]ую веру"
 study_faith_ongoing.1013.t: "$study_faith$: скорее лицедей, чем тайновидец"
 study_faith_ongoing.1013.desc: "Мои стремления выяснить, какую же всё-таки веру исповедует [scheme.GetTargetCharacter.GetTitledFirstName|l], окончились неудачей. За личиной [Select_CString(scheme.GetTargetCharacter.IsFemale, 'праведницы', 'праведника')] скрывается человек, взирающий на мир исключительно приземлённо; человек, для которого богословие — пустой звук.\n\nМожет быть, [scheme.GetTargetCharacter.GetFaith.GetAdjective|l] для [Select_CString(scheme.GetTargetCharacter.IsFemale, 'неё', 'него')] — просто средство достижения собственных целей и влияния, а может, способ обезопаситься?\n\nКак бы то ни было, очевидно, что [Select_CString(scheme.GetTargetCharacter.IsFemale, 'эта женщина', 'этот человек')] совершенно не верит собственным словам."
 study_faith_ongoing.1013.a: "Пустая трата времени! [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] — это не для меня."
 study_faith_ongoing.1020.t: "$study_faith$: местный верующий"
 study_faith_ongoing.1020.desc: "Кажется, [faith_helper.GetTitledFirstName|l] [Select_CString(faith_helper.IsFemale, 'прослышала', 'прослышал')], что я изучаю #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ую#! веру. [Select_CString(faith_helper.IsFemale, 'Она', 'Он')] хорошо [Select_CString(faith_helper.IsFemale, 'знакома', 'знаком')] с сопутствующими обрядами, поскольку [Select_CString(faith_helper.IsFemale, 'родилась и выросла', 'родился и вырос')] в этих краях, а потому предлагает помочь с учёбой.\n\n«В награду я прошу лишь сущий пустяк, [ROOT.Char.Custom('FormOfAddressForLiege')]», — говорит [Select_CString(faith_helper.IsFemale, 'она', 'он')] и [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "Если поможете, получите это золото."
 study_faith_ongoing.1020.b: "Услуга за услугу?"
 study_faith_ongoing.1020.c: "О, как #EMP благородно#! с вашей стороны предложить мне бесплатную помощь!"
 study_faith_ongoing.1020.d: "Спасибо, но я справлюсь самостоятельно."
 study_faith_ongoing.1020.c.success: "Лесть возымела действие: [faith_helper.GetFirstNameNoTooltip] соглашается вам помочь"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] [Select_CString(faith_helper.IsFemale, 'разгадала', 'разгадал')] вашу уловку"
 study_faith_ongoing.1030.t: "$study_faith$: «[scheme.GetTargetCharacter.GetFaith.ReligiousText|U]» давних времён"
 study_faith_ongoing.1030.desc: "Ко мне подходит [chosen_peasant.GetWomanMan|l] с жадной улыбкой на лице.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], правда ли, что вы изучаете #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ую#! веру? У моего отца есть прекрасная вещь, которая вам наверняка понравится: „[scheme.GetTargetCharacter.GetFaith.ReligiousText]!“ Он говорил, что привёз это писание из места, которое называется [holy_site.GetNameNoTier]».\n\n«Мне оно ни к чему: я не умею читать. Но если хотите, я могу отдать его вам — за звонкую монету, конечно!»"
 study_faith_ongoing.1030.a: "Весьма удачно. Возьмите мое золото."
 study_faith_ongoing.1030.b: "Это вовсе не такая редкость, как вам кажется…"
 study_faith_ongoing.1030.b.flavor: "Попытаться выторговать эту вещь повыгоднее"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] соглашается"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] [Select_CString(chosen_peasant.IsFemale, 'оскорблена', 'оскорблен' )] вашим предложением"
 study_faith_ongoing.1030.c: "Стража! Немедленно отобрать у [Select_CString(chosen_peasant.IsFemale, 'неё', 'него' )] эти поганые писания!"
 study_faith_ongoing.1030.d: "Я не потерплю мошенников! Прочь отсюда!"
 study_faith_ongoing.1040.t: "$study_faith$:: восхищение"
 study_faith_ongoing.1040.desc: "Мне улыбнулась удача! Сразу в нескольких письмах [target.GetTitledFirstName|l] лично [Select_CString(target.IsFemale, 'похвалила', 'похвалил' )] мои старания в изучении тонкостей #L [scheme.GetTargetCharacter.GetFaith.GetName]ой#! веры. Более того, [Select_CString(target.IsFemale, 'она заявила', 'он заявил' )], что я — самая выдающаяся фигура [ROOT.Char.GetFaith.GetNameNoTooltip|l]ого мира, когда-либо изучавшая [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]ое писание!\n\nПриятно, что мои старания не проходят даром."
 study_faith_ongoing.1040.a: "Писцы! Отправьте в ответ заверения в моей признательности."
 study_faith_ongoing.1040.b: "[target.GetFirstNameNoTooltip] — настоящий светоч своей веры…"
 study_faith_ongoing.1040.c: "Пф! Меня интересует лишь одно мнение — #EMP мое собственное!#!"
 study_faith_ongoing.1050.t: "$study_faith$: здесь пахнет вредительством"
 study_faith_ongoing.1050.desc: "Пол моего кабинета усыпан рваными — моими же — заметками о непонятных и иногда даже противоречивых заветах #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! веры. В этих клочках — месяцы кропотливого труда. Одинокий листок, зацепившийся за окно, намекает: часть записей выбросили на улицу.\n\nНеужели всё придётся начинать сначала?!\n\nЯ #EMP принюхиваюсь#!… Что это за запах? Приторный, напоминающий благовония или сандал с примесью чего-то цветочного. Перед глазами тут же всплывает чьё-то самодовольное лицо. Я хорошо знаю, кому оно принадлежит: это [Select_CString(sabotage_rival.IsFemale, 'моя', 'мой' )] [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)|l][Select_CString(sabotage_rival.IsFemale, 'ая', 'ый' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))] [sabotage_rival.GetTitledFirstName|l]. Это [Select_CString(sabotage_rival.IsFemale, 'она захотела', 'он захотел' )] погубить мои старания…"
 study_faith_ongoing.1050.a: "Мои записи... нет! Столько трудов насмарку!"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] заслуживает #EMP СМЕРТИ!#!"
 study_faith_ongoing.1050.c: "Ха-ха! Я всегда делаю #EMP запасные копии!#!"
 study_faith_ongoing.1060.t: "$study_faith$: невежественное толкование"
 study_faith_ongoing.1060.desc: "Мне предстоит пройти своего рода экзамен, принимать который будет [Select_CString(offended_character.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', offended_character)] [offended_character.GetTitledFirstName|l]. Чтобы убедить [Select_CString(offended_character.IsFemale, 'ее', 'его' )], что [scheme.GetTargetCharacter.GetFaith.GetAdjective|l] для меня словно открытая книга, мне придется своими словами пересказать отрывок из книги «[scheme.GetTargetCharacter.GetFaith.ReligiousText|U]». #EMP «…И тогда [offended_character.GetFaith.PriestNeuter|l] поднимет… кажется, эта вещь называется [target.Custom('GetAccessory')|l]… и [target.Custom('FormOfAddressForLiege')] сможет сорвать [target.GetCurrentLocation.Custom('get_region_flower_type_plural')]…»#!.\n\n«Что за чушь! Если тебя послушать, то получается, что мои [offended_character.GetFaith.PriestNeuterPlural|l] — все сплошь [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))]ые люди, а [offended_character.GetFaith.HighGodName] — [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!».\n\nВозможно, я еще не совсем хорошо понимаю тонкости #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! веры…"
 study_faith_ongoing.1060.a: "Прошу вас, возьмите вот это в знак моего раскаяния."
 study_faith_ongoing.1060.b: "Я всего лишь превозношу добродетели, которые несут в мир [offended_character.GetFaith.PriestNeuterPlural|l]!"
 study_faith_ongoing.1060.c: "Знаете что?! Да, [offended_character.GetFaith.HighGodName] — действительно #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!"
 study_faith_ongoing.1060.d: "Я всего лишь хочу лучше понять, что такое [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]!"
 study_faith_ongoing.1060.b.success: "Ваша хитрость сработала: теперь [Select_CString(offended_character.IsFemale, 'ей', 'ему' )] кажется, что вы не нанесли оскорбление, а напротив, сказали, что [offended_character.GetFaith.PriestNeuterPlural|l] — #EMP прекрасные люди#!"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] раскрывает ваш обман"
 study_faith_ongoing.1060.d.success: "Вам удается объяснить, что это было недоразумение"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] вам не верит"
 study_faith_ongoing.1070.t: "$study_faith$: грязные мифы"
 study_faith_ongoing.1070.desc: "Подарок, который [Select_CString(target.IsFemale, 'прислала', 'прислал' )] мне [target.GetTitledFirstName|l], — сборник мифологических текстов, накопившихся за те времена, что существует [scheme.GetTargetCharacter.GetFaith.GetAdjective|l], — всерьёз взбудоражил двор. Придворные без стеснения заглядывают мне через плечо и читают самые интересные отрывки вслух.\n\nПоначалу мне казалось, что всё это — лишь злая шутка [ROOT.Char.GetFaith.EvilGodNamesPossessive], однако, изучив некоторые особенно будоражащие меня отрывки повнимательнее, я понимаю: передо мной — эротическое произведение.\n\nКак ещё объяснить, почему здесь упоминается «[ROOT.Char.Custom('ObjectifiedFeature')] [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive]»?! [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "Стража, избавьте меня от проклятой книги!"
 study_faith_ongoing.1070.b: "Вы смеете насмехаться надо мной? #EMP Выпороть всех.#!"
 study_faith_ongoing.1070.c: "Ну, что ж, полагаю, в этом #EMP есть#! определенный педагогический смысл..."
 study_faith_ongoing.1080.t: "$study_faith$: замечательный наставник"
 study_faith_ongoing.1080.desc: "[Select_CString(court_tutor.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] не жалеет сил и времени, чтобы помочь мне постичь все тонкости #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! веры.\n\nТакой самоотверженный подход к наставничеству не может не вдохновлять! У [Select_CString(court_tutor.IsFemale, 'неё', 'него' )] под рукой всегда найдётся тот или иной текст [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]ого толка, а если я захочу обсудить выученное и мне понадобится [scheme.GetTargetCharacter.GetFaith.PriestNeuter|l], долго ждать не придется.\n\nБез [Select_CString(court_tutor.IsFemale, 'её', 'его' )] помощи мне ни за что не удалось бы достичь таких высот."
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], ты заслуживаешь награды!"
 study_faith_ongoing.1080.b: "[court_tutor.GetSheHe|U] хорошо выполняет свою работу."
 study_faith_ongoing.1090.t: "$study_faith$: непостижимо!"
 study_faith_ongoing.1090.desc.intro: "#L [scheme.GetTargetCharacter.GetFaith.GetName]ое#! богословие — непостижимая уму наука!"
 study_faith_ongoing.1090.tenet.desc: "В частности, [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )] остаётся для меня загадкой."
 study_faith_ongoing.1090.doctrine.desc: "В частности, [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )] остаётся для меня загадкой."
 study_faith_ongoing.1090.desc.main: "\n\nУ меня сейчас голова лопнет! Едва в неё входит одно понятие, как другое сразу же выталкивает его в бездну забвения."
 study_faith_ongoing.1090.friend.desc: "\n\n«Держись, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom('ComplimentAdjective')][Select_CString(ROOT.Char.IsFemale, 'ая подруга', 'ый друг' )], я в тебя верю!»\n\nК счастью, [helpful_friend.GetTitledFirstName] всегда рядом и помогает мне разобраться в хитросплетениях этих чуждых учений. Как же мне повезло."
 study_faith_ongoing.1090.no_friend.desc: "\n\nМожет, мне пора передохнуть?"
 study_faith_ongoing.1090.a: "[helpful_friend.GetFirstNameNoTooltip] всегда подскажет и поможет!"
 study_faith_ongoing.1090.b: "Я преодолею любые хитросплетения!"
 study_faith_ongoing.1090.c: "Нужно просто ненадолго отложить книги в сторону..."
 study_faith_ongoing.1090.d: "Это безнадежно!"
 study_faith_ongoing.1100.t: "$study_faith$: [target.GetFaith.GetNameNoTooltip]ий [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|l]"
 study_faith_ongoing.1100.desc: "О моём внимании к #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ому#! учению ходит множество слухов.\n\nМеня называют не иначе как [target.GetFaith.GetNameNoTooltip]ий [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|l], и подобный титул сбивает с толку..."
 study_faith_ongoing.1100.a: "Одна умная речь, и меня полюбят и мой народ, и [target.GetFaith.GetAdherentNamePluralNoTooltip|l]!"
 study_faith_ongoing.1100.b: "Мои изыскания — это мое дело. Не отвлекайте меня!"
 study_faith_ongoing.1100.c: "Не сомневаюсь, [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] это оценит!"
 study_faith_ongoing.1100.a.success: "Вы произносите потрясающую речь"
 study_faith_ongoing.1100.a.success.tt: "Все [root_scope.GetFaith.GetNameNoTooltip|l]ие или [target.GetFaith.GetNameNoTooltip|l]ие придворные и гости"
 study_faith_ongoing.1100.a.failure: "Вы выставляете себя на посмешище"
 study_faith_ongoing.1110.t: "$study_faith$: манящая [target.GetFaith.GetNameNoTooltip|l]ая поэзия"
 study_faith_ongoing.1110.desc: "Ах, «[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] и [poet_location.Custom('GetTerrainTypePlural')|U]», что [Select_CString(the_poet.IsFemale, 'написала', 'написал' )] [the_poet.GetFirstName] из владения [poet_location.GetCounty.GetName]. Подлинное собрание #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! поэзии!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nВозможно, поэзия станет окном в веру?"
 study_faith_ongoing.1110.a: "Я попробую писать [target.GetFaith.GetNameNoTooltip|l]ую поэзию!"
 study_faith_ongoing.1110.b: "Оценит ли [Select_CString(lover_to_be.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip] мою #EMP романтическую#! поэму?"
 study_faith_ongoing.1110.c: "Я оценю религиозную составляющую поэмы."
 study_faith_ongoing.1110.a.success: "Вы обнаруживаете у себя талант к стихосложению"
 study_faith_ongoing.1110.a.failure: "Ваши попытки писать стихи просто убоги"
 study_faith_ongoing.1120.t: "$study_faith$: еретические сказания"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n«[ROOT.Char.GetTitleTierName] изучает байки чужой веры? Как вам не стыдно?!» — восклицает [Select_CString(zealot.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName].\n\n«Если ваши недоброжелатели узнают о вашем увлечении еретическими идеями, они сделают всё возможное, чтобы заклеймить вас еретиком!»\n\nВозможно, идиоты и враги неправильно поймут мой выбор #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ой#! литературы."
 study_faith_ongoing.1120.a: "Нет! Это... #EMP авторитетные [target.GetFaith.GetNameNoTooltip|l]ие теологические трактаты!#!"
 study_faith_ongoing.1120.b: "Как вы смеете обвинять меня в ереси?! Ну я вам!"
 study_faith_ongoing.1120.c: "Вы правы. [ROOT.Char.GetTitleTierName] не может читать подобные тексты."
 study_faith_ongoing.1120.d: "Пусть люди думают что хотят. Эти тексты весьма поучительны!"
 study_faith_ongoing.1120.a.success: "[zealot.GetFirstNameNoTooltip] верит вам"
 study_faith_ongoing.1120.a.failure: "Ваш интерес к еретическим текстам становится общеизвестным"
 study_faith_ongoing.1120.b.tt: "#V Поединок!#! [zealot.GetFirstName] поплатится за свою заносчивость!\n#weak Поединок не насмерть.#!\nЕсли вы победите, то получите [prestige_i] [prestige|El] и [modifier|El] для [Concept('scheme', 'происков')|E]. Если вы проиграете, то станете посмешищем.\n\nВаша [prowess|El]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] персонажа [zealot.GetFirstName]: [prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "Мой поединок с персонажем [zealot.GetFirstNameNoTooltip] отменён"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "«Сдаюсь! Простите, о вашем слабоумии не может быть и речи! Пощадите!» — кричит [zealot.GetTitledFirstName].\n\nБудет [Select_CString(zealot.IsFemale, 'ей', 'ему' )] урок, как оскорблять #EMP меня#!."
 study_faith_ongoing.1123.a: "Знаешь, что говорит в таких случаях Умница [ROOT.Char.Custom('GetAnimalType')|U]? «Не обижай тех, кто умнее!»"
 study_faith_ongoing.1123.b: "За свою дерзость ты сгниешь в темнице!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName] плюёт на землю рядом с вами.\n\n«И это — [ROOT.Char.GetTitleTierName|l]? Смотреть противно. А теперь сделайте одолжение, избавьтесь от этих пустых книжонок»."
 study_faith_ongoing.1124.a: "Это помешает учебе..."
 study_faith_ongoing.1130.t: "$study_faith$: наслаждения веры"
 study_faith_ongoing.1130.desc: "«О, [Select_CString(ROOT.Char.IsFemale, 'моя дорогая', 'мой дорогой' )] [ROOT.Char.GetFirstNameNoTooltip]! Ты действительно познаешь моё драгоценное #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ое#! учение? Как же приятно, что ты хочешь лучше меня понять!» — говорит [lover_to_help.GetTitledFirstName] и [lover_to_help.Custom('quirk_pos_pp')].\n\n«Мне будет приятно помочь тебе #EMP любым#! возможным способом»."
 study_faith_ongoing.1130.a: "Я приму любую помощь!"
 study_faith_ongoing.1130.b: "Я могу придумать один очень приятный способ."
 study_faith_ongoing.1130.c: "Предпочту учиться в одиночестве."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] — хороший учитель, хотя и любит пофлиртовать"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] учит вас таким необычным и чувственным элементам теологии, что вы не в силах понять, как они сочетаются с верой в целом"
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip] слишком много флиртует и не даёт дельных советов"
 study_faith_ongoing.1140.t: "$study_faith$: направляющая рука"
 study_faith_ongoing.1140.desc: "«Похвально, что ты изучаешь #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ую#! теологию. Хорошо, когда [ROOT.Char.GetTitleTierName] в ней разбирается», — восклицает [Select_CString(close_one_to_help.IsFemale, 'моя', 'мой' )] [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName].\n\n«[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]ие обряды знакомы мне с детства. Хочешь, я помогу, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?»"
 study_faith_ongoing.1140.a: "Можешь объяснить мне суть этого догмата?"
 study_faith_ongoing.1140.b: "Хочешь впредь приходить ко мне на занятия?"
 study_faith_ongoing.1200.t: "$study_faith$: языческая гончая"
 study_faith_ongoing.1200.desc: "В стремлении разгадать тайны #L [scheme.GetTargetCharacter.GetFaith.GetName|l]ого#! учения я веду упорядоченные записи. Для меня это единственный способ разобраться в хаосе иной системы воззрений. Увы, кажется, они решили от меня убежать.\n\n[ROOT.Char.Custom('DogStoryName')] тычется мне в руку знакомым влажным носом. Я перевожу взгляд на собаку в надежде хоть немного забыть о тревоге.\n\n[ROOT.Char.Custom('DogStorySheHe')|U] смотрит на меня и гордо виляет своим хвостом. И только в этот момент я понимаю, что в зубах [ROOT.Char.Custom('DogStorySheHe')|l] крепко сжимает мои записи..."
 study_faith_ongoing.1200.a: "Ну как на тебя злиться?"
 study_faith_ongoing.1200.b: "Хочешь погулять? Пойдем."
 study_faith_ongoing.1200.c: "Это не игрушка! #EMP Плохая#! собака!"
 study_faith_ongoing.1300.t: "$study_faith$: обучение на практике"
 study_faith_ongoing.1300.desc: "Мы проезжаем владение [ROOT.Char.GetCurrentLocation.GetTitle.GetName] и замечаем, что местные затеяли [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]ий праздник. К нам подходит [interlocutor.GetWomanMan|l] и приглашает принять участие, хоть мы и [ROOT.Char.GetFaith.GetAdherentNamePlural|l].\n\nМои спутники пытаются вмешаться, опасаясь, что это может оказаться ловушкой.\n\nНо мне плевать на опасность. Я не могу представить себе лучшей возможности лично узнать об [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]ом учении!"
 study_faith_ongoing.1300.a: "Ведите!"
 study_faith_ongoing.1300.a.flavor: "Это небольшой [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]ий ритуал, что тут может быть плохого?"
 study_faith_ongoing.1300.b: "Спор о нюансах [Select_CString(interlocutor.IsFemale, 'её', 'его' )] веры поможет мне многое понять."
 study_faith_ongoing.1300.b.flavor: "Вы надеетесь, что [interlocutor.GetFirstNameNoTooltip] согласится на дружеские дебаты"
 study_faith_ongoing.1300.b.success: "Вы и [interlocutor.GetFirstNameNoTooltip] затеяли дебаты"
 study_faith_ongoing.1300.b.failure: "[interlocutor.GetFirstNameNoTooltip] никак не может понять, чего вы хотите"
 study_faith_ongoing.1300.c: "«Отправляйтесь с нами во владение [next_destination.GetNameNoTooltip]!»"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "Как мотылёк не знает учений о звёздах, но находит пламя, так и душе не нужно знать имени божественного, чтобы быть поглощённой им."
 holy_text_indeterminate_quote_2: "Когда пустынный ветер сотрёт следы тирана, песок вспомнит лишь следы жаждущих и благих."
 holy_text_indeterminate_quote_3: "Река не выбирает, какие камни шлифовать, но в своём терпеливом течении делает каждый из них достойным короны."
 holy_text_indeterminate_quote_4: "Испей из источника знаний, и он сломит тебе спину."
 holy_text_indeterminate_quote_5: "Гора склонилась, но не перед царями или армиями, а перед ребёнком, что осмелился задать ей вопрос."
 holy_text_indeterminate_quote_6: "Потаённый сперва нашёптывает сомнения, чтобы, когда ты наконец дал ответ, ты сам пришёл к своей вере."
 holy_text_indeterminate_quote_7: "Каждая ложь пред алтарём возвращается дымом, но каждая честная слеза падает семенем в небесных садах."
 holy_text_indeterminate_quote_8: "Не проклинай тьму, окутывающую твой путь, её предназначение в том, чтобы твоё собственное пламя осмелилось разгореться."
 holy_text_indeterminate_quote_9: "Светозарному не нужны молитвы гордеца, но он отмечает тихие благодеяния вдали от чужих взоров."
 holy_text_indeterminate_quote_10: "Когда мир бы поделён на «твой» и «мой», божество рассмеялось, ибо в его глазах он был «нашим»."
