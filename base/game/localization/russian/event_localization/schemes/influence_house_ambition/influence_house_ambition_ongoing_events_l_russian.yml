l_russian:
 influence_house_ambition_ongoing.1001.tt: "Сочувствующий слушатель"
 influence_house_ambition_ongoing.1001.desc: "Возможно, [target.GetFirstName] переменится во мнении и сможет взглянуть на мир моими глазами, если в [Select_CString(target.IsFemale, 'её', 'его')] окружении мне удастся найти хотя бы одного человека, готового ко мне прислушаться.\n\nНужно постараться найти приятного собеседника с хорошо подвешенным языком. Будет также неплохо, если такой собеседник окажется недурен — или недурна — собой.\n\nСтараясь не выдать себя, я расспрашиваю о придворных, с которыми [Select_CString(target.IsFemale, 'знакома', 'знаком')] [target.GetFirstName], и выписываю два имени: [target_associate_01.GetFirstName] и [target_associate_02.GetFirstName]."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip] поможет мне добиться своего."
 influence_house_ambition_ongoing.1001.b: "Возможно, [target_associate_02.GetFirstNameNoTooltip] станет для меня ключиком к своему властителю."
 influence_house_ambition_ongoing.1001.c: "Нет. Достаточно будет и моих слов."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip] приводит убедительный довод от вашего имени"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip] не может составить убедительный довод"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip] приводит убедительный довод от вашего имени"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip] не может составить убедительный довод"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "Хочет денег за помощь."
 influence_house_ambition_ongoing.1001.cooltip.relation: "Ничего не просит взамен."
 influence_house_ambition_ongoing.1001.cooltip.lewd: "Предложить… иную награду"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "Просит об обязательстве взамен."
 influence_house_ambition_ongoing.1002.tt: "Жёсткие переговоры"
 influence_house_ambition_ongoing.1002.desc: "С каждым днём я всё больше сомневаюсь, что [target.GetFirstName] вообще воспринимает меня всерьёз. Меня кормят неопределёнными обещаниями, заставляют ждать и терпеть бесконечные разглагольствования.\n\nПора, наконец, высказать своё недовольство — может, не напрямую, но так, чтобы [target.GetFirstName] [Select_CString(target.IsFemale, 'поняла', 'понял')] раз и навсегда: [ROOT.Char.GetTitleAsNameNoTooltip|l] не потерпит столь наплевательского отношения!"
 influence_house_ambition_ongoing.1002.a: "Навредить [Select_CString(target.IsFemale, 'её', 'его')] деловым интересам."
 influence_house_ambition_ongoing.1002.b: "Нанять разбойников, чтобы те поймали и избили [Select_CString(target.IsFemale, 'её', 'его')] придворного."
 influence_house_ambition_ongoing.1002.c: "Поджечь [Select_CString(target.IsFemale, 'ей', 'ему')] дом."
 influence_house_ambition_ongoing.1002.d: "Я покажу [Select_CString(target.IsFemale, 'ей', 'ему')], что такое страх!"
 influence_house_ambition_ongoing.1002.e: "Я ещё какое-то время подожду."
