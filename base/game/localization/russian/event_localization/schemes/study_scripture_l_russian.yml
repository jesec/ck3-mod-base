l_russian:
 study_scripture_outcome.10.t: "$study_scripture_title$правило учения"
 study_scripture_outcome.10.desc: "На кафедре лежат раскрытые книги: тексты #L [ROOT.Char.GetFaith.GetName|l]ого#! учения, переписанные терпеливой рукой. Свеча мерцает, с трудом отгоняя тьму. Внизу [ROOT.Char.GetFaith.HouseOfWorship|l], как обычно, полнится верующими, что терпеливо ждут.\n\n"
 study_scripture_outcome.10.desc_quote: "На самой верхней странице кто-то из прежних читателей подчеркнул один-единственный отрывок: #EMP «[ROOT.Char.Custom('RandomStudyVerseFragment')]»#!\n\nСколько же времени я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] посвятить священным писаниям?"
 study_scripture_outcome.10.desc_generic: "Сколько же времени я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] посвятить священным писаниям?"
 study_scripture_outcome.10.a: "Пусть мир снаружи подождёт."
 study_scripture_outcome.10.b: "Учение и [ROOT.Char.Custom('StudyOfficesWord')] должны совмещаться."
 study_scripture_outcome.10.c: "Я буду читать, следуя велению духа."
 no_change_study_scripture_tt: "Прогресс ваших [Concept('scheme', 'происков')|E] «[GetScheme('study_scripture').GetTypeName]» остаётся неизменным"
 study_scripture_outcome.110.t: "$study_scripture_title$священная страница"
 study_scripture_outcome.110.desc: "Я разбираю великие #L [ROOT.Char.GetFaith.GetName|l]ие#! тексты строка за строкой. Воск стекает к основанию свечи, а на полях моей рукописи спорят друг с другом кролики и улитки.\n\n"
 study_scripture_outcome.110.desc_quote: "Один отрывок обращается прямо к моей душе:\n#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]»#!\n\nЕсли я собираюсь стать пастырем последователей [ROOT.Char.GetFaith.HighGodNamePossessive], именно эти слова я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] хранить в своём сердце."
 study_scripture_outcome.110.desc_generic: "Если я собираюсь стать пастырем последователей [ROOT.Char.GetFaith.HighGodNamePossessive], именно эти слова я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] хранить в своём сердце."
 study_scripture_outcome.110.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] учиться, чего бы мне это ни стоило."
 study_scripture_outcome.110.b: "Однажды понимание придёт само собой."
 study_scripture_outcome.120.t: "$study_scripture_title$длинный комментарий"
 study_scripture_outcome.120.desc: "Прежде чем возглавить свою паству, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] научиться управлять собой. Передо мной лежит толкование священных текстов, что [Select_CString(commentary_writer.IsFemale, 'составила', 'составил')] [commentary_writer.GetTitledFirstName] — густое, как заросли терновника, и столь же колючее. Каждая разобранная строка открывает ещё три новых.\n\nТолько благодаря дисциплине я смогу преуспеть."
 study_scripture_outcome.120.a: "Я буду искать в тексте более глубокий смысл."
 study_scripture_outcome.120.b: "Час за часом, шаг за шагом."
 study_scripture_outcome.120.c: "Хватит и одной страницы за ночь."
 scholar_xp_high_tt: "Вы значительно углубляете свои познания"
 scholar_xp_low_tt: "Вы немного углубляете свои познания"
 study_scripture_outcome.130.t: "$study_scripture_title$терпение на полях"
 study_scripture_outcome.130.desc: "Почему же смысл до меня всё никак не доходит? Я читаю этот отрывок уже в четвёртый раз, но он словно дразнит меня, сжимаясь в кулак. Я мягко прислоняюсь лбом к столу.\n\n«Я [Select_CString(tutor.IsFemale, 'принесла', 'принёс')] тебе свечу», — говорит из дверного проёма [Select_CString(tutor.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', tutor)] [tutor.GetFirstName]. — «Ах, старые толкования. Я хорошо знаю эти записи. Не хочешь почитать их вместе?»\n\nЯ поднимаю взгляд. Возможно, именно помощь со стороны мне сейчас и нужна."
 study_scripture_outcome.130.a: "Научи меня. Я не настолько [Select_CString(ROOT.Char.IsFemale, 'горда', 'горд')], чтобы отказываться от знаний."
 study_scripture_outcome.130.b: "Посиди со мной немного; тексты могут подождать."
 study_scripture_outcome.140.t: "$study_scripture_title$проповедь перед паствой"
 study_scripture_outcome.140.desc: "Я закрываю книгу со вздохом. Здесь записано всё учение, и всё же, когда [preacher.GetTitledFirstName] в последний раз [Select_CString(preacher.IsFemale, 'читала', 'читал')] проповедь передо мной, в [Select_CString(preacher.IsFemale, 'её', 'его')] словах не было ни домыслов, ни умозаключений — лишь простая истина [ROOT.Char.GetFaith.HighGodNamePossessive]. Паства плакала. #EMP Я#! [Select_CString(ROOT.Char.IsFemale, 'плакала', 'плакал')]."
 study_scripture_outcome.140.a: "Есть учение, а есть умение донести его до людей. Я овладею и тем, и другим."
 study_scripture_outcome.140.b: "Моё призвание — страницы книг, а не [ROOT.Char.Custom('StudyPulpitWord')]."
 study_scripture_outcome.150.t: "$study_scripture_title$дела мирские"
 study_scripture_outcome.150.desc: "«Пойдём со мной», — говорит [Select_CString(steward_scope.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )] [steward_scope.GetFirstName], держа под мышкой счётную книгу и жестом приглашая меня выйти на свежий утренний воздух.\n\n«Поля при храме, мельница, амбары для десятины... Отметь, какие из них полны, в каких есть прорехи, а какие полнятся лишь обещаниями. Одной благодатью сыт не будешь»."
 study_scripture_outcome.150.a: "Научи меня вести учёт."
 study_scripture_outcome.150.b: "Прогулка хотя бы немного прояснит мои мысли."
 study_scripture_outcome.160.t: "$study_scripture_title$образованная компания"
 study_scripture_outcome.160.desc: "Мои занятия свели меня в переписке с интересным человеком: [colleague.GetTitledFirstName] славится своим благочестием далеко за пределами [Select_CString(colleague.IsFemale, 'её', 'его')] обители."
 study_scripture_outcome.160.desc_distant: "Мы обмениваемся письмами о делах веры — задаём вопросы, спорим, исправляем ошибки друг друга. Почерк у [Select_CString(colleague.IsFemale, 'неё', 'него')] ужасный, но рассуждает она безупречно."
 study_scripture_outcome.160.a: "Давайте как следует разберёмся в этом споре."
 study_scripture_outcome.160.b: "Учёному человеку надлежит знать, как управляется его духовенство."
 study_scripture_outcome.160.c: "Вернёмся к книгам и продолжим вместе."
 piety_gain_high_tt: "Значительное повышение благочестия"
 piety_gain_low_tt: "Небольшое повышение благочестия"
 study_scripture_outcome.170.t: "$study_scripture_title$письмо с печатью"
 study_scripture_outcome.170.desc: "[Select_CString(letterman.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', letterman)] [letterman.GetFirstName] бережно вносит письмо, словно это святыня. Судя по печати, его [Select_CString(senior.IsFemale, 'отправила сама', 'отправил сам')] [senior.GetTitledFirstName].\n\n«Слухи о ваших занятиях дошли дальше, чем вы думаете. Вере всегда нужны пастыри, которые умеют читать. Продолжайте в том же духе и можете быть уверены в моей милости».\n\n"
 study_scripture_outcome.170.desc_quote: "В конце письма стоит всего один стих, отделённый от остального текста:\n#EMP «[ROOT.Char.Custom('RandomBibleQuoteShort')]»#!"
 study_scripture_outcome.170.desc_generic: "В конце письма — благословение именем [ROOT.Char.GetFaith.HighGodNamePossessive], написанное крупнее остального текста."
 study_scripture_outcome.170.a: "Я составлю достойный ответ."
 study_scripture_outcome.170.b: "Быть может, тогда [Select_CString(senior.IsFemale, 'она', 'он')] похвалит мою учёность более... публично?"
 study_scripture_outcome.170.c: "Нужно прочитать его ещё раз — помедленнее."
 study_scripture_outcome.171.t: "$study_scripture_title$письма верующим"
 study_scripture_outcome.171.desc: "Мне приходят письма со всех уголков #L [ROOT.Char.GetFaith.GetName|l]ого#! мира. Священнослужители спорят из-за одного-единственного слова в литургии, сельские [ROOT.Char.GetFaith.PriestNeuterPlural] страшатся собственных сомнений, учёный просит вынести суждение о переводе, правильность которого уже некому подтвердить. Моей печати достаточно, чтобы положить конец этим спорам.\n\n"
 study_scripture_outcome.171.desc_quote: "В сегодняшнем письме мне с надеждой цитируют писание:\n#EMP «[ROOT.Char.Custom('RandomBibleQuoteShort')]»#!\n\nСтопка писем на моём столе неуклонно растёт. А вместе с ней, пусть и незаметно, растёт моя учёность."
 study_scripture_outcome.171.desc_generic: "Стопка писем на моём столе неуклонно растёт. А вместе с ней, пусть и незаметно, растёт моя учёность."
 study_scripture_outcome.171.a: "Отвечу всем. Для того и нужен пастырь."
 study_scripture_outcome.171.b: "Пусть переписчики разошлют мои ответы по всем уголкам [ROOT.Char.GetFaith.GetNameNoTooltip|l]ого мира."
 study_scripture_outcome.171.c: "Сегодня я [Select_CString(ROOT.Char.IsFemale, 'ученица', 'ученик')]. Письма подождут."
 study_scripture_outcome.172.t: "$study_scripture_title$пастырское послание"
 study_scripture_outcome.172.desc: "Сегодня вечером я изучаю письма, которые пастыри отправляют в далёкие приходы: проповеди и наставления в каждой общине звучат по-своему.\n\nМои мысли обращаются к верующим владения [pastoral_county.GetNameNoTier], которым правит [pastoral_lord.GetTitledFirstName]. У них есть там церковь. Они далеко, и им, возможно, тяжело без моих наставлений... Быть может, пришло время написать им?\n\nЯ беру перо. #EMP «Верующим владения [pastoral_county.GetNameNoTier]...»#!"
 study_scripture_outcome.172.a: "Отправить письмо."
 study_scripture_outcome.172.b: "Составление этого письма многому меня научило. Этого достаточно."
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName] отправляет письмо жителям владения [pastoral_county.GetNameNoTier]"
 study_scripture_outcome.180.t: "$study_scripture_title$освобождение"
 study_scripture_outcome.180.desc: "Я начинаю читать, напрягшись и стиснув зубы в ожидании очередного испытания, которое придётся вынести.\n\n"
 study_scripture_outcome.180.desc_confession: "Но где-то между первой и последней страницей моя душа не выдерживает. Я вслух выплёскиваю всё, что так долго носил в себе, на суд лишь [ROOT.Char.GetFaith.HighGodNamePossessive]. Тяжёлое бремя спадает с моих плеч.\n\nВпервые за много месяцев я ясно осознаю, что делать дальше."
 study_scripture_outcome.180.desc_generic: "Но где-то между первой и последней страницей груз с грохотом падает с моих плеч. Застилавшая мой разум пелена рассеялась.\n\nВпервые за много месяцев я ясно осознаю, что делать дальше."
 study_scripture_outcome.180.a: "Итак, что же прочесть теперь..."
 study_scripture_outcome.190.t: "$study_scripture_title$покровительство учёным"
 study_scripture_outcome.190.desc: "Учёность тоже не обходится без политики. Переписанная книга, отправленная в нужный совет; способный чтец, приглашённый за нужный стол; моё имя, с теплом произнесённое в нужных залах...\n\nЯ усердно тружусь. Но усердие, которого никто не замечает, — напрасно."
 study_scripture_outcome.190.a: "Я прослежу, чтобы на синоде услышали моё имя."
 study_scripture_outcome.190.b: "Я попрошу богословов поделиться записями."
 study_scripture_outcome.190.c: "Мистики должны узнать о моих трудах."
 study_scripture_outcome.190.d: "Моё благочестие говорит само за себя."
 study_scripture_outcome.200.t: "$study_scripture_title$провидение"
 study_scripture_outcome.200.desc: "Бывают страницы, на которых буквы уступают место чему-то совершенно иному. [GetTrait('lifestyle_mystic').GetName( mystic )|l], [Select_CString(mystic.IsFemale, 'известная', 'известный')] как [mystic.GetTitledFirstName], пишет о тьме, что сияет ярче солнца, о молитве, что продолжается даже когда иссякают слова. #L [ROOT.Char.GetFaith.GetName|l]ое#! учение говорит, что такие двери существуют для тех, кто осмелится в них постучать.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'читала', 'читал')], пока не догорела свеча. И потом ещё долго [Select_CString(ROOT.Char.IsFemale, 'сидела и прислушивалась', 'сидел и прислушивался')] к темноте."
 study_scripture_outcome.200.a: "В той темноте что-то ждало меня. Я отыщу это."
 study_scripture_outcome.200.b: "Испытывайте меня, тайны. Я вас не страшусь."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] заслуживает лестного письма."
 study_scripture_outcome.200.d: "Я запомню эту дверь, но продолжу изучать более понятные вещи."
 study_scripture_outcome.300.t: "$study_scripture_title$ночное бдение"
 study_scripture_outcome.300.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] холодеет и погружается в тишину. Час между последней и первой службой никому не принадлежит, поэтому я [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал')] его своим: в этот час есть лишь свеча и полная тайн тьма, сомкнувшаяся вокруг её пламени.\n\nВ тишине что-то скрывается. Оно терпеливо ждёт. Сегодня ночью и я буду [Select_CString(ROOT.Char.IsFemale, 'терпелива', 'терпелив')]."
 study_scripture_outcome.300.a: "Глубже. Я проникну ещё глубже."
 study_scripture_outcome.300.b: "Час тишины — а потом спать."
 study_scripture_outcome.300.c: "Я уже достаточно несу своё бдение."
 study_scripture_outcome.100.t: "$study_scripture_title$вопрос наследования"
 study_scripture_outcome.100.desc: "Наступает ночь, и я раскладываю перед собой каноны избрания. Их страницы освещены слабым светом. Кого можно избрать, кто вправе избирать, какие прецеденты устояли, а какие были нарушены — всё это здесь, стоит лишь набраться терпения и прочесть.\n\nСтарики умирают. Конклавы собираются. А кардиналы помнят тех, кто знал закон, когда это имело значение."
 study_scripture_outcome.100.a: "Однажды вопрос будет задан. И ответом стану я."
 study_scripture_outcome.100.b: "Мудрость не даётся сразу. Амбиции могут подождать."
 study_scripture_outcome.100.c: "Лучше пойти поспать..."
 pam_ss_papabile_tt: "Вы получаете #P +10#! к [Concept('papabile_score', 'приоритету')|E] в вопросе папской преемственности"
 study_scripture_outcome.101.t: "$study_scripture_title$долгожданное откровение"
 study_scripture_outcome.101.desc: "Ответ приходит ко мне за остывшим ужином, между одним кусочком и следующим. Наконец я понимаю, как следует читать этот отрывок:\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]»#!\n\nПоколения [Glossary('толкователей', 'GLOSS_EXEGETE')] спорили над этими словами. Теперь же их смысл кажется мне совершенно ясным. Осталось лишь решить, что делать с моим толкованием."
 study_scripture_outcome.101.desc_generic: "Поколения [Glossary('толкователей', 'GLOSS_EXEGETE')] спорили над этими словами. Теперь же их смысл кажется мне совершенно ясным. Осталось лишь решить, что делать с моим толкованием."
 study_scripture_outcome.101.a: "Я произнесу проповедь об этом на ближайшем празднике."
 study_scripture_outcome.101.b: "Я тихо передам это знание учёным."
 study_scripture_outcome.101.c: "Ответ был дарован мне в тишине; в тишине я его и оставлю."
 GLOSS_EXEGETE: "Толкователь (экзегет) — человек, занимающийся экзегезой: специалист или учёный, искусный в критическом разборе, толковании и объяснении текстов, особенно религиозных писаний."
 study_scripture_outcome.102.t: "$study_scripture_title$ясность учения"
 study_scripture_outcome.102.desc: "На протяжении многих лет доктрины #L [ROOT.Char.GetFaith.GetName|l]ой#! конфессии полнили мой разум, но смысл некоторых из них мне до сих пор не был ясен.\n\n"
 study_scripture_outcome.102.desc_tenet: "Сегодня ночью мне наконец открылся истинный смысл догмата «[pam_ss_clarity_tenet.GetBaseName|U]»: чего он требует, что прощает и где пролегают его границы. Теперь я понимаю его достаточно хорошо, чтобы защитить перед любым учёным и объяснить даже ребёнку."
 study_scripture_outcome.102.desc_generic: "Сегодня ночью мне наконец открылся истинный смысл этих учений: чего они требуют, что прощают и где пролегают их границы. Теперь я понимаю их достаточно хорошо, чтобы защитить перед любым учёным и объяснить даже ребёнку."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]»#!"
 study_scripture_outcome.102.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] записать эти мысли, пока они ещё свежи."
 study_scripture_outcome.102.b: "Радости от такого откровения вполне достаточно."
 study_scripture_outcome.102.c: "Утро вечера мудренее, даже для откровений."
 study_scripture_outcome.121.t: "$study_scripture_title$наставничество"
 study_scripture_outcome.121.desc: "Я обнаруживаю, что [Select_CString(student_courtier.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )] [student_courtier.GetTitledFirstName], всё ещё в библиотеке — время уже за полночь, и все свечи давно должны были погаснуть. [Select_CString(student_courtier.IsFemale, 'Она склонилась', 'Он склонился')] над книгой, во много раз превосходящей её нынешние познания.\n\n«П-прошу прощения, [ROOT.Char.Custom('FormOfAddressForLiege')]», — запинается [Select_CString(student_courtier.IsFemale, 'она', 'он')], испуганно вздрогнув. «Я... я просто [Select_CString(student_courtier.IsFemale, 'хотела', 'хотел')] освоить этот том...»\n\nЯ вспоминаю, как много в своё время [Select_CString(ROOT.Char.IsFemale, 'отдала', 'отдал')] бы за наставника, который действительно #EMP прочёл#! бы ту книгу, что лежала передо мной."
 study_scripture_outcome.121.a: "Мы разберём его как следует — вместе."
 study_scripture_outcome.121.b: "Я возьму [Select_CString(student_courtier.IsFemale, 'её', 'его')] обучение на своё попечение."
 study_scripture_outcome.121.c: "Пусть учится [Select_CString(student_courtier.IsFemale, 'сама', 'сам')]. Это закаляет характер."
 study_scripture_outcome.122.t: "$study_scripture_title$катехизис"
 study_scripture_outcome.122.desc: "Мои труды принесли плоды. Сегодня [ROOT.Char.Custom('ResidenceBuilding')] полнится членами моей семьи, которых я [Select_CString(ROOT.Char.IsFemale, 'собрала', 'собрал')] здесь, дабы посвятить их в тайны, что хранит мой священный текст — [ROOT.Char.GetFaith.ReligiousText].\n\nЯ читаю. Они слушают. Вскоре следуют вопросы — одни простые, другие на удивление проницательные. Похоже, не только во мне живёт жажда священного знания."
 study_scripture_outcome.122.a: "Каждый познает его, строка за строкой. Таков мой долг."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] обладает острым умом. Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] научить [Select_CString(pupil.IsFemale, 'её', 'его')] большему."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] [Select_CString(stray.IsFemale, 'задержалась', 'задержался')] после окончания. Дверь открыта."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] [Select_CString(devout.IsFemale, 'узнала', 'узнал')] достаточно. [Select_CString(devout.IsFemale, 'Она', 'Он')] получит моё благословение."
 study_scripture_outcome.123.t: "$study_scripture_title$[ROOT.Char.Custom('StudySeminaryWord')|U]?"
 study_scripture_outcome.123.desc: "Паломники и торговцы разнесли молву о моих занятиях и сегодня привели ко мне того, кто желает учиться у меня. [aspirant.GetTitledFirstName] стоит у моих ворот — [Select_CString(aspirant.IsFemale, 'уставшая', 'уставший')] от долгой дороги, но [Select_CString(aspirant.IsFemale, 'исполненная', 'исполненный')] решимости, с зажатой в дрожащих руках книгой.\n\n«Говорят, вы и впрямь читаете то, о чём проповедуете. Научите меня — и я буду служить вам»."
 study_scripture_outcome.123.a: "Что ж. Начнём с азов веры."
 study_scripture_outcome.123.b: "Мой двор вам не [ROOT.Char.Custom('StudySeminaryWord')]."
 study_scripture_outcome.400.t: "$study_scripture_title$лечение для лекаря"
 study_scripture_outcome.400.desc: "Этот отрывок заставляет меня задуматься. Осуждаемое в нём тревожно напоминает мне [Select_CString(ROOT.Char.IsFemale, 'саму', 'самого')] себя.\n\n"
 study_scripture_outcome.400.desc_generic: "Текст не называет моё имя — и всё же явственно говорит обо мне. «Это я, [penance_sin.GetName( ROOT.Char )]», — написано там, ясно и беспощадно, будто автор знал меня лично."
 study_scripture_outcome.400.desc_end: "\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог')] бы закрыть книгу и больше не читать. Но чувство вины никуда не денется."
 study_scripture_outcome.400.a: "От этого есть лишь одно лекарство. Покаяние."
 study_scripture_outcome.400.b: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] продолжить чтение, чего бы мне это ни стоило."
 study_scripture_outcome.400.c: "Святые проповедуют. Грешники правят."
 study_scripture_outcome.410.t: "$study_scripture_title$странные комментарии"
 study_scripture_outcome.410.desc: "Эту рукопись я [Select_CString(ROOT.Char.IsFemale, 'одолжила', 'одолжил')], и прежний читатель, похоже, оставил на полях собственные мысли: возражения, молитвы и заметки об учении, которое он называет «[pam_ss_margin_tenet.GetBaseName]».\n\nМне стоило бы игнорировать эти каракули, но вместо этого ловлю себя на том, что перечитываю их по два раза."
 study_scripture_outcome.410.a: "Можно перечитать и в третий раз — теперь помедленнее."
 study_scripture_outcome.410.b: "Такие очевидные ошибки заслуживают подобающего опровержения."
 study_scripture_outcome.410.c: "Надо сжечь рукопись — эту страницу и все остальные!"
 study_scripture_outcome.430.t: "$study_scripture_title$учение и сердце"
 study_scripture_outcome.430.desc: "Среди всех учений, что воплощает в себе [ROOT.Char.GetFaith.GetAdjective|l], одно стоит для меня выше прочих: «[pam_ss_heart_tenet.GetBaseName]». Я следую этому догмату ещё с тех пор, когда не [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог')] отстоять его перед другими. Сегодня ночью я обращаю внимание к нему, пытаясь отыскать изъяны.\n\n"
 study_scripture_outcome.430.desc_quote: "Писания единым голосом отвечают:\n#EMP «[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]»#!\n\nИзъянов здесь никогда не было."
 study_scripture_outcome.430.desc_generic: "Писания отвечают единым голосом — древнее и увереннее всего, что мне доводилось слышать. Изъянов здесь никогда не было."
 study_scripture_outcome.430.a: "Я верю в это учение. Пусть [ROOT.Char.Custom('StudyParishWord')] увидит, что я живу согласно ему."
 study_scripture_outcome.430.b: "Я напишу текст в его защиту."
 study_scripture_outcome.430.c: "Но если всмотреться глубже, у любого учения найдутся изъяны..."
 pam_ss_spread_tenet_tt: "Ваш текст в защиту догмата «[pam_ss_heart_tenet.GetBaseName]» может убедить до #V трёх#! [Concept('rulers', 'правителей')|E] принять его"
 pam_ss_conviction_spread_tt: "$study_scripture_title$принятие личного принципа"
 study_scripture_outcome.1000.t: "$study_scripture_title$пастырь, получивший укор"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U] не повышает голоса. [Select_CString(senior.IsFemale, 'Ей', 'Ему')] это ни к чему.\n\n«Мне говорят, что твои книги пылятся без дела. Пастырь, который не желает учиться, ведёт своих подопечных бесцельной дорогой. Тебе было дано больше, чем многим другим — что же ты [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал')] с этим даром?»\n\nТишина после этих слов оказывается тяжелее любого крика."
 study_scripture_outcome.1000.desc_letter: "На письме стоит печать, по которой ясно, что его [Select_CString(senior.IsFemale, 'отправила', 'отправил')] [senior.GetTitledFirstName], и каждая строка его ложится на сердце тяжёлым камнем:\n\n«До меня дошли вести, что твои занятия пришли в упадок. Пастырь, который не желает учиться, ведёт своих подопечных по ложному пути. Тебе было дано больше, чем многим другим. Я надеюсь услышать о тебе нечто большее».\n\nПодписи нет. Печати достаточно."
 study_scripture_outcome.1000.desc_dream: "Во сне я стою в огромной библиотеке, где каждая книга носит моё имя, но все страницы в них чисты. Фигура, знакомая мне по сотням священных образов, закрывает последнюю из них — бережно, как закрывают глаза усопшему.\n\n«Тебе было дано больше, чем многим другим», — говорит святой. Я просыпаюсь, но слова эти всё ещё звучат в моей комнате."
 study_scripture_outcome.1000.a: "Отныне я буду стараться изо всех сил."
 study_scripture_outcome.1000.b: "Я больше не могу нести это бремя. С меня хватит."
 study_scripture_outcome.1000.c: "Довольно. Мне нужен отдых."
 never_study_scripture_again_tt: "Больше вы #N никогда#! не сможете взяться за [Concept('scheme', 'происки')|E] «[GetScheme('study_scripture').GetTypeName]»"
 study_scripture_outcome.1010.t: "$study_scripture_title$книга — лучший подарок"
 study_scripture_outcome.1010.desc: "[sender.GetTitledFirstName|U] [Select_CString(sender.IsFemale, 'прислала', 'прислал')] мне свёрток."
 study_scripture_outcome.1010.end_christian: "Лента отмечает именно тот отрывок, который мне никак не удавалось постичь:\n\n#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]»#!\n\nЩедрый дар — и весьма полезный."
 study_scripture_outcome.1010.end: "Внутри лежит искусно переплетённая молитвенная книга, чьи страницы заполнены молитвами, толкованиями и тщательно выполненными украшениями.\n\nЩедрый дар — и весьма полезный. Быть может, ответы, что так долго ускользали от меня, уже лежат на этих страницах."
 study_scripture_outcome.1010.a: "Я найду этому дару достойное применение."
 study_scripture_outcome.1010.b: "Прекрасная книга. Она будет хорошо смотреться на моей полке."
 pam_ss_devotional_book_name: "Молитвенная книга"
 pam_ss_devotional_book_description: "Украшенный священными текстами и толкованиями фолиант, переписанный и позолочённый с явным благоговением. Лента отмечает тот отрывок, который получателю более всего необходимо было прочесть."
 study_scripture_outcome.1020.t: "$study_scripture_title$умерщвление плоти"
 study_scripture_outcome.1020.desc: "Сегодня ночью тексты вновь одолевают меня — как прошлой ночью и ночью перед ней. Мой взгляд скользит по страницам, а разум полнится мыслями об ужине, о постели — о чём угодно, лишь бы не об учении.\n\nВсё дело в моём теле. Древние аскеты знали это: удобство — самый коварный слуга [ROOT.Char.GetFaith.DevilNamePossessive], а голод закаляет душу. Сначала нужно обуздать плоть, и лишь тогда мой дух сможет возвыситься."
 study_scripture_outcome.1020.a: "Бич очистит мой разум."
 study_scripture_outcome.1020.b: "Уморить тело голодом, чтобы насытить душу."
 study_scripture_outcome.1020.c: "Или лучше поужинать, поспать, и завтра попробовать снова."
 study_scripture_outcome.1030.t: "$study_scripture_title$уединение в монастыре"
 study_scripture_outcome.1030.desc: "Мои занятия зашли в тупик. Тот же стол, та же свеча, те же неудачи. Я решаю, что может мне поможет [Select_CString(counselor.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', counselor )] [counselor.GetTitledFirstName], чья набожность не знает равных.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "«Вы принесли с собой слишком много стен», — говорит [counselor.GetFirstNameNoTooltip], указывая на голую келью, единственный светильник и тишину. «Старые отшельники знали: убери всё лишнее — и останется лишь то, что искал»."
 study_scripture_outcome.1030.desc_monastery: "«Вы читаете как правитель», — говорит [counselor.GetFirstNameNoTooltip] без тени укора. «Покоряете страницы одну за другой, считаете их, словно налоги. Здесь мы можем читать одну и ту же строку целую неделю, пока она сама не начнёт читать нас»."
 study_scripture_outcome.1030.a: "Нужно организовать благословение для моих занятий."
 study_scripture_outcome.1030.b: "Тогда я буду читать одну и ту же строку две недели."
 study_scripture_outcome.1030.c: "Я помолюсь над этими словами — и оставлю всё как есть."
 study_scripture_outcome.1040.t: "$study_scripture_title$вторая пара рук"
 study_scripture_outcome.1040.desc_acolyte: "Я не [Select_CString(ROOT.Char.IsFemale, 'просила', 'просил')] о помощи. Но всё равно [Select_CString(ROOT.Char.IsFemale, 'получила', 'получил')] её. [Select_CString(helper.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], [Select_CString(helper.IsFemale, 'разобрала', 'разобрал')] мои записи, [Select_CString(helper.IsFemale, 'нашла', 'нашёл')] нужный комментарий и [Select_CString(helper.IsFemale, 'подрезала', 'подрезал')] свечу. [helper.GetSheHe|U] незаметно [Select_CString(helper.IsFemale, 'изучила', 'изучил')] мои привычки — даже знает, какие отрывки заставляют меня тяжело вздыхать.\n\n«Отдохнувшему человеку легче молиться», — просто говорит [helper.GetSheHe], ставя рядом с моими записями горячее блюдо."
 study_scripture_outcome.1040.desc_partner: "[Select_CString(helper.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], проскальзывает внутрь, забирает рукопись из моих рук и вслух читает строку. Слова святы. Прости меня, [ROOT.Char.GetFaith.HighGodName], но сегодня ночью передо мной нечто ещё более святое — [helper.GetHerHis] [helper.Custom('ObjectifiedFeature')].\n\n«Позволь мне помочь», — шепчет [helper.GetSheHe], подойдя так близко, что мы разделили тепло одной свечи. «Я очень этого хочу»."
 study_scripture_outcome.1040.a: "Тогда читай мне до рассвета. Мы всё закончим."
 study_scripture_outcome.1040.b: "Тогда проведём ближайший час вместе."
 study_scripture_outcome.1040.c: "Твоей доброты уже достаточно."
 study_scripture_outcome.1040.d: "Подойди ближе, свеча освещает совсем мало..."
 study_scripture_outcome.1050.t: "$study_scripture_title$тёмная ночь души"
 study_scripture_outcome.1050.desc: "Я слишком [Select_CString(ROOT.Char.IsFemale, 'зачиталась', 'зачитался')]. Где-то за полночь ответы начали уступать место вопросам, а уверенность — сомнениям.\n\n"
 study_scripture_outcome.1050.desc_quote: "Я не [Select_CString(ROOT.Char.IsFemale, 'первая', 'первый')], кто сталкивается с подобной тишиной. #EMP «Боже мой, Боже мой! По что ты меня оставил?»#!\n\nВ густой тишине горит одинокая свеча. Что же теперь?"
 study_scripture_outcome.1050.desc_generic: "Испокон веков святых боролись с подобными сомнениями — в час, когда [ROOT.Char.GetFaith.HighGodName] затаивает дыхание и не объясняет, почему молчит.\n\nВ густой тишине горит одинокая свеча. Что же теперь?"
 study_scripture_outcome.1050.a: "Сомнение — такой же текст, как и всякий другой."
 study_scripture_outcome.1050.b: "Возможно, молчание и есть ответ."
 study_scripture_outcome.1050.c: "За пределы слов, за пределы сомнений — навстречу тайне."
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, 'Сёстры', 'Братья' )] по Уставу"
 study_scripture_outcome.1060.desc_house: "Мне тяжело, мои занятия едва ли приносят плоды. И [order_head.GetPrimaryTitle.GetNameNoTier|l], чей орден расположился в графстве [order_house_county.GetNameNoTier], уже в курсе. Сегодня их повозка со скрипом въехала в мой двор: переписанные толкования, ящик свечей и письмо, на котором [Select_CString(order_head.IsFemale, 'поставила', 'поставил')] свою печать [order_head.GetTitledFirstName].\n\n«Пока существует Устав, ни один пастырь не учится в одиночестве. Скажите лишь слово — и мы поможем всем, чем можем»."
 study_scripture_outcome.1060.desc_far: "Вести о моих трудностях разнеслись далеко — даже [order_head.GetPrimaryTitle.GetNameNoTier|l] уже в курсе. Сегодня их повозка со скрипом въехала в мой двор: переписанные толкования, ящик свечей и письмо, на котором [Select_CString(order_head.IsFemale, 'поставила', 'поставил')] свою печать [order_head.GetTitledFirstName].\n\n«Пока существует Устав, ни один пастырь не учится в одиночестве. Скажите лишь слово — и мы поможем всем, чем можем»."
 study_scripture_outcome.1060.a: "Моя благодарность каждому, чьими руками были переписаны эти книги."
 study_scripture_outcome.1060.b: "Пришлите ко мне одного из ваших учёных священнослужителей."
 study_scripture_outcome.1060.c: "Да снизойдёт на них благословение [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_ss_lettered_brother_tt: "#EMP Образованный священник#! ордена присоединяется к вашему [Concept('court', 'двору')|E]"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U] [Select_CString(lettered_brother.IsFemale, 'прибыла', 'прибыл')] из ордена [order_head.GetPrimaryTitle.GetNameNoTier|l]"
