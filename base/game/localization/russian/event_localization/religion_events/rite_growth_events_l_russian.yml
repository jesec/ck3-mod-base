l_russian:
 rite_growth.0010.t: "Новое [origin_faith.GetReligion.GetNameNoTooltip|l]ое течение"
 rite_growth.0010.desc.intro.relation: "Во главе нового течения стоит [Select_CString(founder.IsFemale, 'ваша', 'ваш')] [GetPlayer.Custom2('RelationToMeShort', founder.Self)|l] [founder.GetFirstName],"
 rite_growth.0010.desc.intro.descriptor_archbishop: "Во главе нового течения стоит #L [founder.GetCulture.GetCollectiveNoun|l]ий#! архиепископ [founder.GetFirstName],"
 rite_growth.0010.desc.intro.descriptor_ruler: "Во главе нового течения стоит [founder.GetTitledFirstName|l],"
 rite_growth.0010.desc.opener.archbishopric: "[Select_CString(founder.IsFemale, 'которая', 'который')] заведует владением [founder_clerical_title.GetNameNoTier].\n\n"
 rite_growth.0010.desc.opener.lands: "[Select_CString(founder.IsFemale, 'которая', 'который')] правит #L [founder.GetPrimaryTitle.GetAdjective|l]ими#! землями.\n\n"
 rite_growth.0010.desc.divergence.minor: "Это течение, известное среди его последователей как [new_rite.GetAdjective|l], лишь незначительно отличается от #L [source_rite.GetName|l]их#! порядков."
 rite_growth.0010.desc.divergence.moderate: "Это течение, известное среди его последователей как [new_rite.GetAdjective|l], заметно отличается от #L [source_rite.GetName|l]их#! порядков."
 rite_growth.0010.desc.divergence.major: "Это течение, известное среди его последователей как [new_rite.GetAdjective|l], представляется большинству #L [source_rite.GetName|l]их#! верующих совершенно чуждым и едва ли не еретическим."
 rite_growth.0010.desc.differing.tenet: "При этом наиболее явное расхождение — догмат «[differing_tenet.GetBaseName]»."
 rite_growth.0010.desc.differing.doctrine: "При этом наиболее явное расхождение — доктрина «[differing_doctrine.GetDescriptiveName]»."
 rite_growth.0010.desc.differing.fallback: "При этом богословские расхождения полны тонкостей, и им сложно подобрать какое-то конкретное название."
 rite_growth.0010.desc.outro.wildfire: "\n\nНесмотря на это, к новому учению примыкает всё больше и больше приверженцев из #L [origin_faith.GetName|l]их#! общин."
 rite_growth.0010.a: "Я не отступлю от [ROOT.Char.GetRite.GetNameNoTooltip|l]ой веры."
 rite_growth.0010.b: "Я с радостью приму [new_rite.GetNameNoTooltip|l]ое учение!"
 rite_growth.0010.c: "Как по мне, это самая настоящая ересь…"
 counties_and_court_converts: "#L [source_rite.GetName]ие#! [Concept('counties', 'графства')|E] и [Concept('courtiers', 'придворные')|E] обратятся в #L [new_rite.GetName|l]ую#! веру"
 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNoTooltip] принимает течение"
 rite_growth.0011.notification.desc: "[convert_ruler.GetTitledFirstName] присоединяется к персонажу [founder.GetTitledFirstName] и начинает исповедовать #L [new_rite.GetName|l]ую#! веру"
 iberian_struggle_blocks_holy_war_tt: "Нельзя объявлять [Concept('holy_war', 'священную войну')|E] во время [Concept('iberian_struggle', 'иберийской борьбы')|E]"
