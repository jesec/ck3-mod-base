l_russian:
 holy_order_hired_message: "Нанят духовно-рыцарский орден"
 holy_order.hired_message: "[actor.GetUIName] [Select_CString(actor.IsFemale, 'призвала', 'призвал' )] орден «[holy_order.GetName]»"
 holy_order_hired_by_enemy_message: "Вражеский духовно-рыцарский орден"
 holy_order.hired_by_enemy: "[actor.GetUIName] [Select_CString(actor.IsFemale, 'призвала', 'призвал' )] орден «[holy_order.GetName]», и теперь он выступает против нас"
 holy_order.destroyed_message: "Титул [title.GetName] был уничтожен."
 holy_order_expanded: "Духовно-рыцарский орден расширяется"
 holy_order.new_lease: "[holy_order.GetName] берет в аренду баронство [barony.GetName] у персонажа [former_holder.GetTitledFirstName]"
 monastic_holy_order_expanded: "Монашеский орден расширяется"
 holy_order.0001.t: "Духовно-рыцарский орден"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] [Select_CString(recipient.IsFemale, 'готова', 'готов')] уезжать: все вещи собраны, свита наготове. Нам остаётся только попрощаться.\n\n"
 holy_order.0001.desc_demand: "«Наверное, что-то почётное в этом есть — поехать и умереть за землю, где живут язычники, которых я даже в глаза не [Select_CString(recipient.IsFemale, 'видела', 'видел')]… — бормочет [Select_CString(recipient.IsFemale, 'она', 'он')]. — Вот [actor.GetPrimaryTitle.GetNameNoTier] — это да, за такое умереть не жалко…»\n\n[Select_CString(recipient.IsFemale, 'Она', 'Он')] взбирается на лошадь и обращается ко мне: «Куда прикажете отправляться?»"
 holy_order.0001.desc: "«Итак, [ROOT.Char.Custom('FormOfAddressForLiege')], какому ордену прикажете служить горячей молитвой и острым мечом?»"
 holy_order.0001.desc_relation: "«Мой меч жаждет крови поганых язычников, [recipient.Custom2('RelationToMeShort', ROOT.Char)]! Но куда мне отправляться? Где ждёт меня [recipient.Custom('SisterBrother')] по вере?»"
 holy_order.0001.a: "Вас возьмет на службу [holy_order_1.GetName]."
 holy_order.0001.b: "[holy_order_2.GetName] — вот где ваше место."
 holy_order.0001.c: "[holy_order_3.GetName] возьмет вас к себе."
 holy_order.0001.d: "Пусть теперь с вами разбирается [holy_order_4.GetName]."
 holy_order.0001.e: "Это было ошибкой, ваше место здесь!"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'приняли', Select_CString(recipient.IsFemale, 'приняла', 'принял' ))] предложение [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))] вступить в духовно-рыцарский орден"
 holy_order.0002.desc_angry: "Отныне моя судьба — исполнять волю [ROOT.Char.GetFaith.HighGodNamePossessive], как раньше мне приходилось исполнять вашу волю. Такова моя священная клятва."
 holy_order.0002.desc: "Я отвечу на призыв служить высшим силам. Благодарю вас, что наставили меня на путь истинный."
 holy_order.0002.a_demand: "Замечательно. А теперь перестаньте трепать языком: [ROOT.Char.GetFaith.PositiveAfterLife] ждёт."
 holy_order.0002.a: "Наверняка вы хорошо проявите себя на службе [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'приняли', Select_CString(recipient.IsFemale, 'приняла', 'принял' ))] монашество по просьбе [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))]"
 char_interaction.0001.opening_low_piety: "Чтобы столь [ROOT.GetCharacter.Custom('GetSinfulShameful')] существо, как вы, пыталось проникнуть в священный орден [ROOT.Char.GetFaith.HighGodNamePossessive]?.. Задумайтесь об искуплении своей души, прежде чем гнаться за земными богатствами."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "Мне говорили, что вы алчете золота, и [order.GetName] ответит на ваши просьбы."
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName] улыбается мне!"
 holy_order.0200.b: "Но... Но мне нужны деньги!"
 holy_order.0202.second_time: "Я вновь напоминаю, что вы задолжали моему ордену порядка #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! золотых."
 holy_order.0202.opening: "Вы должны моему ордену порядка #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! золотых."
 holy_order.0202.desc: "Если вы не вернете нам золото, мы найдем иные способы возместить ущерб. Способы эти, без сомнения, одобрит [ROOT.Char.GetFaith.HighGodName], однако же вам они могут не понравиться."
 holy_order.0202.a: "Разумеется, я выполню условия нашего соглашения."
 holy_order.0202.a_no: "Я заплачу! Просто дайте мне время, чтобы найти золото..."
 holy_order.0202.a._not.tt: "@warning_icon! #X Недостаточно [gold_i]золота#!"
 holy_order.0202.b_christian: "Разве терпение не добродетель?"
 holy_order.0202.b: "Мы собратья по вере... Пожалуйста, дайте мне больше времени!"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip] дает вам еще 5 лет"
 holy_order.0202.c: "Возможно, мы можем придумать другой способ расплатиться?.."
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip] потребует от вас что-нибудь#!"
 holy_order.0202.d: "В моих руках это золото принесет больше пользы!"
 holy_order.0203.desc: "Я, как и [ROOT.Char.GetFaith.HighGodNameAlternate], не одобряю клятвопреступников. В искупление своей вины вы передадите нам провинцию [province.GetName], чтобы мы и дальше могли нести волю [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0203.a: "Конечно, [province.GetNameNoTierNoTooltip] перейдет вам."
 holy_order.0203.b: "Это нелепое требование!"
 holy_order.0204.desc: "Я, как и [ROOT.Char.GetFaith.HighGodNameAlternate], не одобряю тех, кто нарушает слово. В искупление вашей вины [Select_CString(child.IsFemale, 'ваша', 'ваш' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))][child.GetTitledFirstName] отправится к нам, нести волю [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0204.a: "Я... я отправлю [child.GetHerHis]."
 holy_order.0204.a.tt: "Ваш долг ордену выплачен"
 holy_order.0205.desc: "Вся эта история с займом стала постыдной демонстрацией вашей жадности. Я сделаю так, что [ROOT.Char.GetFaith.ReligiousHeadName] узнает об этом!"
 holy_order.0205.a: "Проклятье!"
 holy_order_letter.opening: "Дорогой слуга [ROOT.Char.GetFaith.HighGodNameAlternatePossessive],"
 holy_order.1001.intro: "Наши отважные единоверцы массово прибывают в орден [holy_order.GetName], готовые посвятить свои смертные тела служению ради #L [ROOT.Char.GetFaith.GetName|l]ой#! веры. В связи с этим нам нужно больше земель, где смогут разместиться наши [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]."
 holy_order.1001.end: "\n\n[target_barony.GetName] идеально подходит для наших задач. Можем ли мы взять эти земли в аренду во исполнение высшей цели?"
 holy_order.1001.a: "Ваша просьба исполнена. Во имя [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 holy_order.1001.b: "Возможно, [alternative_barony.GetNameNoTierNoTooltip] тоже подойдет для ваших целей?"
 holy_order.1001.c: "Нет, я не передам вам эту землю."
 holy_order.1011.intro: "Во владении [target_barony.GetName] есть много хорошей земли, а также [grandmaster.GetFaith.HouseOfWorship|l], где мои [Select_CString(grandmaster.IsFemale, 'сёстры', 'братья' )] могли бы исполнять свой духовный долг."
 holy_order.1011.end: "\n\nМожете ли вы предоставить нам эти территории, дабы орден [holy_order.GetName] мог основать там свой монастырь?"
 holy_order.1011.a: "Я разрешаю ордену взять землю [target_barony.GetNameNoTierNoTooltip] в аренду."
 holy_order.1011.b: "Мне кажется, [alternative_barony.GetNameNoTierNoTooltip] — более спокойное место."
 holy_order.1011.c: "Боюсь, вашим [Select_CString(grandmaster.IsFemale, 'сёстрам', 'братьям' )] придётся найти себе другое место."
 holy_order.2001.t: "Божественная цель"
 holy_order.2001.desc: "Когда [Select_CString(child.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] подходит ко мне, я сразу же понимаю, что [child.GetSheHe] хочет обсудить что-то очень важное.\n\n«Моя жизнь всегда будет протекать в тени других, [ROOT.Char.Custom('MotherFather')]. Позволь мне вступить в орден [holy_order.GetName] и нести слово [child.GetFaith.HighGodNamePossessive]. Я давно думаю об этом, и я знаю, что действительно хочу этого»."
 holy_order.2001.a: "Пусть [child.GetFaith.HighGodNameAlternate] ведет тебя, [child.Custom('DaughterSon')] [Select_CString(child.IsFemale, 'моя', 'мой' )]."
 holy_order.2001.b: "Нет, у меня есть планы на тебя, пусть и не столь грандиозные."
 holy_order.2002.desc: "Когда [Select_CString(sibling.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] [sibling.GetTitledFirstName] сообщает мне о своих планах, я понимаю, что [sibling.GetSheHe] это долго [Select_CString(sibling.IsFemale, 'обдумывала', 'обдумывал' )].\n\n«Здесь меня мало что ждет, и, если уж мне предначертано служить кому-то, пусть это будет [sibling.GetFaith.HighGodName]. Я вступаю в орден [holy_order.GetName]»."
 holy_order.2002.a: "Я понимаю твой выбор, [sibling.Custom('SisterBrother')]."
 holy_order.2002.b: "Разумеется, ты этого #EMP не#! сделаешь!"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "Истинные воины, которые могли бы защитить #L [grandmaster.GetFaith.GetName|l]ую#! веру, будут нужны всегда.\nОбладая многими талантами и ничтожными шансами унаследовать хоть что-либо, [Select_CString(child.IsFemale, 'ваша', 'ваш' )] [child.Custom('DaughterSon')] [child.GetTitledFirstName], как мне кажется, разумно распорядится своей жизнью, вступив в орден [holy_order_scope.GetName]. С нами [child.GetSheHe] будет тренироваться, учиться и сделает честь вашему имени."
 holy_order.2003.a: "[Select_CString(child.IsFemale, 'Она', 'Он' )] будет жить как истинный [child.GetFaith.GetAdherentName|l]."
 holy_order.2003.child_joins_order: "[child.GetFirstName] получает качество «[GetTrait('order_member').GetName( child.Self )]» и присоединяется ко двору персонажа [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b: "Возможно, у вас может учиться [alternative_child.GetFirstNameNoTooltip]?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName] получает качество «[GetTrait('order_member').GetName( alternative_child.Self )]» и присоединяется ко двору персонажа [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.c: "[Select_CString(child.IsFemale, 'Ее', 'Его' )] место здесь, со мной."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "Моя жизнь была посвящена учению [child.GetFaith.HighGodNameAlternatePossessive], но [child.GetFaith.HighGodNameSheHe] не призывает совершенно отречься от собственной семьи.\n\n[grandmaster.GetTitledFirstName] [Select_CString(grandmaster.IsFemale, 'позволила', 'позволил' )] мне вернуться к старой жизни и вновь стать частью вашего [ROOT.Char.Custom('GetCourt_RU_Gen')]."
 holy_order.2004.a: "Добро пожаловать домой, [child.Custom('DaughterSon')] [Select_CString(child.IsFemale, 'моя', 'мой' )]!"
 holy_order.2004.b: "Нет. Тебе здесь больше не место."
 holy_order.2005.t: "Возвращение домой"
 holy_order.2005.desc: "[child.GetTitledFirstName] остается у нас дольше обычного. Только после того, как [Select_CString(child.IsFemale, 'моя', 'мой' )] [child.Custom('DaughterSon')] [Select_CString(child.IsFemale, 'уединилась', 'уединился' )] на несколько дней, беспрестанно поглощая еду и оскорбляя слуг, мы стали спрашивать о дне [Select_CString(child.IsFemale, 'ее', 'его' )] возвращения в орден [holy_order.GetName] и, увы, услышали весьма решительный ответ.\n\n«Разве ты не знаешь, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName] [Select_CString(grandmaster.IsFemale, 'была', 'был' )] столь [Select_CString(grandmaster.IsFemale, 'щедра', 'щедр' )], что [Select_CString(grandmaster.IsFemale, 'освободила', 'освободил' )] меня от обязательств! Я наконец останусь дома, с моей семьей»."
 holy_order.2005.a: "О, то есть, ты... собираешься остаться?"
 holy_order.destroyed_title: "Духовно-рыцарский орден распущен"
 holy_order.2010.t: "Новый монашеский орден"
 holy_order.2010.desc: "Отшельники, тайновидцы и разочарованные старыми орденами послушники, собравшиеся во владении [barony.GetNameNoTier], трудились не покладая рук, чтобы на необжитой земле возник достойный новый дом. Во главе зародившегося в этих краях ордена [Select_CString(leader.IsFemale, 'встала', 'встал' )] [leader.Custom('SisterBrother')|l] [leader.GetFirstName] — [leader.GetPrimaryTitle.GetName|l]. Но никто ещё не спросил #EMP моего#! августейшего мнения. Я собираюсь предложить новому ордену священный завет, который ляжет в основу его бытия.\n\nЧто будут воспевать этот хор праведников? Как будет трудиться, о чём размышлять, что описывать? И главное: кто станет их наставником?"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )] и [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5: "[tenet_5.GetName( order_rite )] и [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6: "[tenet_6.GetName( order_rite )] и [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d: "[tenet_1.GetName( order_rite )] и [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.e: "[tenet_2.GetName( order_rite )] и [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f: "[tenet_3.GetName( order_rite )] и [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]."
 monastic_tenet_pick_tt: "Главным [Concept('core_tenet', 'догматом')|E], которого будет придерживаться [monastic_order.GetName], станет «[tenet_pick.GetName( order_rite )]»."
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName] выступает за догмат «[tenet_pick.GetName( order_rite )]»"
 founded_monastic_order_modifier: "Основан монашеский орден"
 founded_monastic_order_modifier_desc: "Благодаря мудрости правителя был основан новый монашеский орден — посредник между мирским и божественным."
 pick_becomes_monastic_order_leader_tt: "[monastic_order.GetName]: [chosen_leader.GetShortUIName] становится [Select_CString(chosen_leader.IsFemale, 'новой', 'новым' )] [Concept('ruler', 'главой')|E]"
 pick_remains_monastic_order_leader_tt: "[monastic_order.GetName]: [chosen_leader.GetShortUIName] остаётся [Concept('ruler', 'главой')|E]"
 holy_order.2009.t: "Строительство монастыря"
 holy_order.2009.desc: "[province.GetTerrain.GetNameNoTooltip|U], где царит необычайная тишина, вскоре преобразится: в месте, так полюбившемся #L [province.GetCulture.GetCollectiveNoun|l]ому#! народу, я закладываю первый камень будущего монастыря. Пока что здесь не на что смотреть, но в будущем [province.GetName] сможет по праву гордиться своей святыней.\n\nТруженики и священнослужители, не чурающиеся простых ремёсел, возводят стены, в которых когда-то зазвучат торжественные песнопения. Почтенные монахи, среди которых и [potential_leader.Custom('SisterBrother')|l] [potential_leader.GetName], также прибыли на стройку и уже составляют планы размещения часовен и трапезных.\n\nВсего через каких-то несколько лет здесь зародится новый орден. Но если камень и [ROOT.Char.Custom('GetWritingMaterial')|l] вечны, то человек — нет; ордену понадобятся новые послушники."
 holy_order.2009.a: "Новым орденом должны руководить те, кто пользуется моей поддержкой."
 holy_order.2009.b: "Многие монахи недовольны своими нынешними орденами…"
 holy_order.2009.b.tt: "…и с радостью уйдут от своих настоятелей, если предложить им возможность самим составлять уставы."
 holy_order.2009.c: "Мы соберем непреклонных аскетов и пылкую молодежь."
 monastic_order_creation_increased_spiritual_fulfillment: "[Concept('interactions', 'Взаимодействия')|E] с [Concept('monastic_holy_order', 'монашеским орденом')|E] будут приносить больше [Concept('spiritual_fulfillment', 'духовной реализации')|E] в течение #high 50#! лет"
 monastic_founder_become_saint_tt: "После смерти [chosen_leader.GetShortUIName] получит черту «[GetTrait('saint').GetName( chosen_leader.Self )]», если [Select_CString(chosen_leader.IsFemale, 'её', 'его' )] [Concept('trait_level_track_xp', 'опыт свойства')|E] «[GetTrait('devoted').GetName( chosen_leader.Self )]» превышает #high 65#!, либо если [Concept('piety_level', 'уровень набожности')|E] составляет не менее @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]"
 holy_order.2020.t: "Монашеские обеты"
 holy_order.2020.desc: "По моему настоянию [recipient.GetFirstName], [Select_CString(recipient.IsFemale, 'облаченная', 'облаченный')] в новую мантию, навсегда оставляет светские заботы. [ROOT.Char.Custom('ResidenceBuilding')|U], где я заседаю; [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l], которые мне служат; знать, постоянно плетущая заговоры, — всё это останется за стенами монастыря: отныне всё, что [Select_CString(recipient.IsFemale, 'она', 'он')] будет знать, — это [archabbot.GetPrimaryTitle.GetName].\n\nКак и другие [recipient.Custom('SistersBrothers')|l], [recipient.GetFirstNameNoTooltip] клянется в верности и преданности святой общине, в готовности трудиться денно и нощно во имя [recipient.GetFaith.HighGodNamePossessive], поскольку [recipient.GetFaith.PositiveAfterLife|l] — место, куда могут попасть только самоотверженные в своем служении.\n\nМестом проживания для [Select_CString(recipient.IsFemale, 'нее', 'него')] будет служить либо [archabbot.GetCapitalLocation.GetName], либо одно из святилищ ордена. Там [recipient.GetFirstNameNoTooltip] начнет новую жизнь, преисполненную учения и созерцания."
 holy_order.2020.aa: "Ордену всегда нужны прилежные люди."
 holy_order.2020.aa.tt: "[recipient.GetFirstNameNoTooltip] — опытный и трудолюбивый управляющий. Такое сочетание качеств творит чудеса."
 holy_order.2020.a: "Ордену всегда нужны мудрые послушники."
 holy_order.2020.a.tt: "[recipient.GetFirstNameNoTooltip] обладает широкими познаниями; нигде в мире им больше не найдётся достойного применения, кроме как здесь."
 holy_order.2020.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))|U] их покровителя — не [recipient.Custom('GirlBoy')|l] для чёрной работы…"
 holy_order.2020.c: "[recipient.GetFirstNameNoTooltip] наверняка обрадуется и будет весьма [Select_CString(recipient.IsFemale, 'признательна', 'признателен')] «пожертвованию»."
 holy_order.2020.d: "Теперь [Select_CString(recipient.IsFemale, 'её', 'его')] жизнь целиком отдана ордену."
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'вступили', Select_CString(recipient.IsFemale, 'вступила', 'вступил' ))] в монашеский орден по просьбе [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))]"
 take_vows_improve_education_learning_tt: "@skill_learning_icon![Concept('education', 'Учёба')|E] с упором на [Concept('learning', 'учёность')|E] будет результативнее"
 take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon![Concept('education', 'Учёба')|E] с упором на [Concept('stewardship', 'управление')|E] будет результативнее"
 recently_joined_holy_order_desc: "[recipient.GetShortUIName] [Select_CString(recipient.IsFemale, 'вступила', 'вступил')] в орден за последние 5 лет"
 child_in_holy_order_desc: "[recipient.GetShortUIName] — ребенок, обещанный ордену"
 custom.every_domain_monastic_order: "Каждый [Concept('monastic_holy_order', 'монашеский орден')|E] в вашем [Concept('domain', 'домене')|E]"
 order_gains_minor_tenet_popularity_tt: "Их [Concept('core_tenet', 'догмат')|E] получает #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! [Concept('tenet_popularity', 'популярности')|E]"
 new_order_gains_minor_tenet_popularity_tt: "Ваш новый [Concept('monastic_holy_order', 'монашеский орден')|E] увеличит [Concept('tenet_popularity', 'популярность')|E] своего [Concept('core_tenet', 'догмата')|E] на #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#!"
 holy_order.2030.t: "Пожертвование: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "[recipient.GetTitledFirstName] непременно оценит такой щедрый жест: в [Select_CString(recipient.IsFemale, 'её', 'его')] монастыри только что прибыли обозы с моими богатствами. Этого пожертвования должно хватить на всё: вспашку земель, перепись священных текстов, даже удовлетворение мирских потребностей, которые [recipient.GetPrimaryTitle.GetName] наверняка испытывает…\n\n…И, возможно, даже на тысячу молитв за мою бессмертную душу. Ибо монахи всю жизнь проводят в молитвах, а поэтому, как говорят, они настолько праведны, что у [ROOT.Char.GetFaith.random_GoodGodNames|U] больше милости и снисхождения к ним, чем к простым людям.\n\n#EMP [actor.GetFaith.HighGodName|U], слышно ли, как они произносят в молитвах моё имя?#!"
 holy_order.2030.desc_desperate_plea: "#EMP Знают ли там, наверху, как мне пришлось унижаться и пресмыкаться, словно последней твари, лишь бы вымолить себе прощение?#!"
 holy_order.2030.desc_huge_donation: "#EMP Знают ли там, наверху, с какими богатствами мне пришлось расстаться?..#!"
 holy_order.2030.a: "Чем больше людей ратует за моё спасение, тем лучше."
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'приняли', Select_CString(recipient.IsFemale, 'приняла', 'принял' ))] пожертвование монашескому ордену от [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))]"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U]!"
 holy_order.2031.desc: "После долгих раздумий и молитв с большим сожалением сообщаю, что никакое пожертвование не сподвигнет моих монахов вымаливать у [recipient.GetFaith.HighGodNamePossessive] спасение твоей души. Боюсь, здесь бессильны даже мы."
 holy_order.2031.a: "Тьфу! Хотя бы у меня остались деньги."
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'отклонили', Select_CString(recipient.IsFemale, 'отклонила', 'отклонил' ))] пожертвование монашескому ордену от [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))]"
 already_has_monastic_lease_tt: "[target.GetNameNoTier] уже [Concept('leased', 'сдаётся в аренду')|E] [Concept('monastic_holy_order', 'монашескому ордену')|E]"
 lease_title_to_existing_monastic_order_interaction: "Пожаловать монастырь"
 lease_title_to_existing_monastic_order_interaction_desc: "[recipient.GetPrimaryTitle.GetName|U] [Concept('lease', 'получает в аренду')|E] [Concept('temple_holding', 'храмовые владения')|E]. Арендодатель получает [Concept('spiritual_fulfillment', 'духовную реализацию')|E], [Concept('piety', 'благочестие')|E] и более широкий доступ к ордену"
 INTERACTION_LEASE_DONATION: "Приобрести дополнительные владения"
 no_valid_temple_holdings_to_lease_tt: "В вашем [Concept('domain', 'домене')|E] нет [Concept('temple_holdings', 'храмовых владений')|E], которые можно было бы [Concept('lease', 'сдать в аренду')|E]"
 monastic_onslaught_modifier_tt: "[target_county.GetName] получает модификатор «[GetModifier('monastic_onslaught_modifier').GetNameWithTooltip]» на #high 20 лет#!"
 holy_order.2040.opening: "[actor.GetFirstName], о покровитель, которому подчиняется [actor.GetPrimaryTitle.GetNameNoTier]!"
 holy_order.2040.desc: "Свершилось. Отделение, что находится в земле [recipient.GetPrimaryTitle.GetNameNoTier], сольётся воедино с храмом [actor.GetFaith.HouseOfWorship|l] из владения [target.GetNameNoTier]. Именно там [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier] будет хранить древние тексты из библиотек, которыми располагает [recipient.GetCapitalLocation.GetName].\n\n"
 holy_order.2040.desc_nuns: "Именно там наши [recipient.GetFaith.DevoteeFemalePlural|l] будут воспевать от вашего имени молитвы, чтобы добиться милости [actor.GetFaith.HighGodNamePossessive]."
 holy_order.2040.desc_monks: "Именно там наши [recipient.GetFaith.DevoteeMalePlural|l] будут воспевать от вашего имени молитвы, чтобы добиться милости [actor.GetFaith.HighGodNamePossessive]."
 holy_order.2040.desc_huge_donation: "Так орден благодарит вас за благородное пожертвование."
 holy_order.2040.desc_rite: "\n\nЗнайте, что капитул будет придерживаться #L [recipient.GetRite.GetName|l]ого#! течения, как и любое другое отделение нашего ордена."
 holy_order.2040.a: "Пусть ваш орден знает только процветание!"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'приняли', Select_CString(recipient.IsFemale, 'приняла', 'принял' ))] предложение [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))] взять в аренду баронство"
 holy_order.2041.opening: "[actor.GetFirstName], о владыка, [Select_CString(actor.IsFemale, 'которой', 'которому')] подчиняется [actor.GetPrimaryTitle.GetNameNoTier]!"
 holy_order.2041.desc: "Мы, последователи [recipient.GetFaith.HighGodNamePossessive], чистые сердцем и душой, несущие этому бренному миру священное знание о том, что есть [recipient.GetFaith.PositiveAfterLife|l]… боимся, что [actor.GetPrimaryTitle.GetNameNoTier] сегодня переживает тяжелейший недуг, перед которым бессильны даже наши молитвы.\n\nПока душа вашей державы не начнёт стремиться к благодати [recipient.GetFaith.HighGodNamePossessive], [recipient.GetPrimaryTitle.GetName] и [target.GetNameNoTier] навсегда останутся разлучёнными."
 holy_order.2041.a: "Их «чистота» — это просто блажь!"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'отклонили', Select_CString(recipient.IsFemale, 'отклонила', 'отклонил' ))] предложение [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ',puppet_or_actor.GetShortUIName))] взять в аренду баронство"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial [monastic_order.GetName] окажется [Concept('holy_order_vicinity', 'поблизости')|E]. Будут доступны [Concept('interactions', 'взаимодействия')|E] с ним#!"
 holy_order.2050.t: "Во владении [barony.GetNameNoTierNoTooltip] возникает движение"
 holy_order.2050.desc: "«Продолжают ли [target_order.GetName] страдать… как это делали пустынные отшельники?» — с этих слов [clerical_helper.GetName] начинает каждое из своих пламенных посланий.\n\n«Облачает ли [target_lessee.GetTitledFirstName] себя в золото? — вопрошают на службах реформаторов во владении [barony.GetNameNoTier] и продолжают: — #EMP Новый путь! Новый Свод!»#!\n\nМонастырь стремительно превращается в средоточие благочестивых реформ и возмущения. Его обитатели уже едва ли видят себя частью [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip|l]их земель и вряд ли одобряют бессмысленные рассуждения о догмате «[target_order_tenet.GetName( founder.GetRite )]». Но их реформаторский дух требуется направить к одному принципу и общему согласию."
 msg_order_movement_took_monastery.t: "[chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip]ое движение"
 movement_took_monastery_notification_3_tt: "Орден «[new_holy_order.GetName]» отнял владение [barony.GetNameNoTier] и другие [Concept('leases', 'арендованные наделы')|E] у ордена «[target_order.GetName]»"
 movement_took_monastery_notification_2_tt: "Орден «[new_holy_order.GetName]» отнял владения [barony.GetNameNoTier] и [lease_2.GetNameNoTier] у ордена «[target_order.GetName]»"
 movement_took_monastery_notification_tt: "Орден «[new_holy_order.GetName]» теперь [Concept('lease', 'арендует')|E] владение [barony.GetNameNoTier] вместо ордена «[target_order.GetName]»"
 movement_took_monastery_patron_notification_tt: "[founder.GetShortUIName] [Select_CString(founder.IsFemale, 'одобрила', 'одобрил' )] этот реформированный [Concept('monastic_holy_order', 'монашеский орден')|E]"
