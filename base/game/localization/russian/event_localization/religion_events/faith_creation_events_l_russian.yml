l_russian:
 faith_creation.1001.t.schism: "[reformed_faith.GetNameNoTooltip]ий раскол"
 faith_creation.1001.t.reformation: "[reformed_faith.GetNameNoTooltip]ая реформация"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetAdjective] переживает новый раскол. [reformer.GetTitledFirstName] и [Select_CString(reformer.IsFemale, 'её', 'его' )] последователи ушли от своей #L [old_faith.GetName|l]ой#! веры, и теперь #L [old_rite.GetName|l]ий#! обряд, которого они когда-то придерживались, лёг в основу их нового учения."
 faith_creation.1001.desc.reformation: "[reformer.GetTitledFirstName], [Select_CString(reformer.IsFemale, 'которую', 'которого' )] уважают многие [reformed_faith.GetAdherentNamePlural|l], [Select_CString(reformer.IsFemale, 'организовала', 'организовал' )] религиозное движение, к которому примкнули [reformer.Custom('DefaultPriestTitlePlural')|l] со всей земли. Они намерены собрать все свои верования и обряды воедино, дабы сформулировать официальную доктрину, которая станет основой их веры."
 faith_creation.1001.desc.schism.personal: "#L [old_faith.GetName]ие#! [old_faith.AltPriestTermPlural|l] сбились с пути, а значит, они больше не могут вести нас. Те [reformer.Custom('DefaultPriestTitlePlural')|l], которые разделяют это мнение, присоединились ко мне и приняли #L [old_rite.GetName|l]ое#! учение, тем самым окончательно отделившись от нашей прежней конфессии."
 faith_creation.1001.desc.reformation.personal: "Благодаря моим усилиям наиболее влиятельные [reformer.Custom('DefaultPriestTitle')|l] со всех краёв света наконец-то собрались вместе, дабы совместить все наши верования и обряды и сформулировать новую доктрину, которая станет основой нашей веры."
 faith_creation.1001.desc.schism.personal.hof: "[old_hof.GetTitledFirstName] и #L [old_faith.GetName|l]ие#! [old_faith.AltPriestTermPlural|l], что сбивают с пути правоверных людей, окончательно потеряли моё уважение. Теперь те [reformer.Custom('DefaultPriestTitlePlural')|l], которые разделяют моё мнение, присоединились ко мне и приняли #L [old_rite.GetName|l]ое#! учение, тем самым окончательно разорвав все связи с #L [old_faith.GetName|l]ой#! конфессией."
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName] более не признаёт ту духовную власть, которой обладает [old_hof.GetTitledFirstName]. [Select_CString(reformer.IsFemale, 'Она и её', 'Он и его' )] последователи ушли от #L [old_faith.GetName|l]ой#! веры и основали независимое от какой-либо церкви течение, в основу которого лёг #L [old_rite.GetName|l]ий#! обряд."
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\nПылкие [reformer.Custom('DefaultPriestTitlePlural')|l] уже говорят о том, что им нужны [reformed_faith.GHWNamePlural], чтобы распространить их новую веру по всему миру, и"
 faith_creation.1001.desc.outlook.pacifism: "\n\nЭти [reformed_faith.GetNameNoTooltip|l]ие [reformer.Custom('DefaultPriestTitlePlural')] осудили насилие и кровопролитие, заявляя, что войны ведут лишь к страданиям и ненависти, и"
 faith_creation.1001.desc.outlook.dogmatic: "\n\nЭти [reformer.Custom('DefaultPriestTitlePlural')|l] объявили, что [reformed_faith.GetAdjectiveNoTooltip|l] — единственная истинная вера, и"
 faith_creation.1001.desc.outlook.accepting: "\n\nЭти [reformed_faith.GetNameNoTooltip|l]ие [reformer.Custom('DefaultPriestTitlePlural')] призывают ко взаимопомощи и терпимости даже в отношениях с неверующими, и"
 faith_creation.1001.desc.outlook.fallback: "\n\nЭти [reformed_faith.GetNameNoTooltip|l]ие [reformer.Custom('DefaultPriestTitlePlural')] спокойно и прагматично относятся к другим конфессиям и"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "заявляют, что единственный способ почтить [reformed_faith.HighGodNamePossessive] — устроить человеческое жертвоприношение!"
 faith_creation.1001.desc.belief.indulgent: "призывают последователей потакать плотским желаниям и жить полной жизнью."
 faith_creation.1001.desc.belief.incest: "разрешают близким родственникам вступать в брак, заявляя, что семейные узы священны, а такие браки благословенны."
 faith_creation.1001.desc.belief.aniconism: "отказываются использовать какие-либо религиозные символы, заявляя, что простые изображения не в силах передать величие [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.ascetic: "призывают к нестяжанию среди своих последователей, утверждая, что стремление к материальным благам мешает духовному самосовершенствованию."
 faith_creation.1001.desc.belief.spirits: "попросили духов направить верующих в эти непростые времена."
 faith_creation.1001.desc.belief.superstition: "официально приняли множество древних предрассудков и мифологических историй в качестве официальной доктрины."
 faith_creation.1001.desc.belief.nature: "выказывают невероятное почтение к самой природе и защищают ее от тех, кто хотел бы использовать ее ради личной выгоды."
 faith_creation.1001.desc.belief.community: "сформировали закрытые сообщества, объединившие культурные традиции различных последователей. Туда входят [reformed_faith.GetAdherentNamePluralNoTooltip|l], которые с неохотой принимают чужаков."
 faith_creation.1001.desc.belief.pain: "учат, что плоть необходимо укрощать посредством боли и лишений. По их мнению, страдания очищают душу и позволяют верующим приблизиться к истинному познанию [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.iconoclasm: "требуют низвергнуть и сжечь все без исключения идолы и жертвенники ложных богов."
 faith_creation.1001.desc.belief.militant: "считают, что верующие — это прежде всего воины, которые должны отстаивать истинность своего учения с мечом в руках."
 faith_creation.1001.desc.belief.veneration: "почитают покойных святых как заступников людей перед Богом, поклоняясь их мощам и вознося к ним свои молитвы."
 faith_creation.1001.desc.belief.sacraments: "считают, что приобщиться к благодати можно лишь посредством священных обрядов, проводить которые должны исключительно рукоположенные священники."
 faith_creation.1001.desc.belief.penance: "учат, что всякая душа рождается во грехе и что очистить её можно только через искреннюю исповедь и раскаяние."
 faith_creation.1001.desc.belief.christology: "утверждают, что разрешили одну из главных богословских проблем и изложили саму природу Бога в словах, которые близки и понятны каждому верующему."
 faith_creation.1001.desc.belief.rebirth: "считают, что наши души застряли в череде перерождений, обстоятельства которых зависят от наших деяний в прошлой жизни."
 faith_creation.1001.desc.belief.learning: "ценят знания превыше всего. По их мнению, изучение мира позволяет верующему приблизиться к пониманию сакрального разума [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.law: "почитают священный закон превыше всего, настаивая на неукоснительном его исполнении."
 faith_creation.1001.desc.belief.missionary: "клянутся нести своё священное учение всем народам, дабы каждая живая душа могла прийти ко свету."
 faith_creation.1001.desc.belief.hierarchy: "учат, что всё так или иначе занимает своё законное место во вселенной. По их мнению, настоящая гармония возможна лишь тогда, когда каждая душа соблюдает порядок, установленный свыше."
 faith_creation.1001.desc.belief.charity: "просят верующих в любой беде проявлять сострадание, помогая бедным, больным и странникам в нужде."
 faith_creation.1001.desc.belief.family: "считают, что родственные связи священны. По их мнению, почитание предков и воспитание множества детей — это само по себе служение высшей цели."
 faith_creation.1001.desc.belief.sacred_sites: "возводят величественные каменные памятники, дабы они многие века служили символами их веры и благочестия."
 faith_creation.1001.desc.belief.worldly: "смотрят на веру весьма прагматично. По их мнению, порой звонкая монета и своевременное молчание приносят не меньшую духовную пользу, чем молитвы."
 faith_creation.1001.desc.belief.syncretic: "перенимают верования своих соседей, уверенно полагая, что к истине может вести целое множество путей."
 faith_creation.1001.desc.belief.fallback: "просят всех последователей оставить в прошлом старые распри и объединиться ради блага новой веры."
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip] [Select_CString(reformer.IsFemale, 'решила', 'решил' )] лично возглавить зарождающееся [reformed_faith.GetNameNoTooltip|l]ое движение и [Select_CString(reformer.IsFemale, 'приняла', 'принял' )] титул «[reformed_faith.ReligiousHeadName]» — это высший сан, который [reformer.GetSheHe], скорее всего, передаст своему наследнику."
 faith_creation.1001.desc.temporal.personal: "\n\nЯ хочу лично возглавить зарождающееся [reformed_faith.GetNameNoTooltip|l]ое движение и принять титул «[reformed_faith.ReligiousHeadName]», высшую должность, которую затем унаследуют мои преемники."
 faith_creation.1001.desc.spiritual: "\n\n[reformed_faith.GetNameNoTooltip]ие [reformer.Custom('DefaultPriestTitlePlural')|l] решили, что [reformed_hof.GetFirstNameNoTooltip] теперь [reformed_faith.ReligiousHeadName|l]. Именно [Select_CString(reformed_hof.IsFemale, 'она', 'он' )] будет разрешать внутренние споры внутри нашей конфессии и определять порядки и обряды, относительно которых будут оцениваться все остальные [reformed_faith.GetNameNoTooltip|l]ие течения."
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformed_faith.GetNameNoTooltip]ие [reformer.Custom('DefaultPriestTitlePlural')|l] решили, что [Select_CString(reformed_hof.IsFemale, 'текущая', 'текущий' )] [reformed_faith.ReligiousHeadName|l] [reformed_hof.GetFirstNameNoTooltip] [Select_CString(reformed_hof.IsFemale, 'должна', 'должен' )] сохранить свою должность. Именно [Select_CString(reformed_hof.IsFemale, 'она', 'он' )] будет разрешать внутренние споры внутри нашей конфессии и определять порядки и обряды, относительно которых будут оцениваться все остальные [reformed_faith.GetNameNoTooltip|l]ие течения."
 faith_creation.1001.desc.no_head: "\n\nЗарождающееся учение решило не назначать главу религии. Вместо этого течения смогут сами устанавливать свои порядки, а [reformer.Custom('DefaultPriestTitlePlural')|l] будут отвечать лишь за свои общины."
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip] с нетерпением ожидают, когда исполнится пророчество и придет [reformed_faith.ReligiousHeadName], великий лидер, который объединит их и начнет новый золотой век [reformed_faith.GetNameNoTooltip|l]ой веры."
 faith_creation.1001.o.frightened: "[ROOT.Char.GetFaith.random_GoodGodNames], защити! Пусть эти кровожадные [second.Custom('GetUnbelieverNamePlural')] не тронут нас!"
 faith_creation.1001.o.heretical: "Эти еретики заплатят за свои преступления против [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 faith_creation.1001.o.crusader: "Начнется [ROOT.Char.GetFaith.GHWName], и тогда эти [second.Custom('GetUnbelieverNamePlural')] узнают свое место!"
 faith_creation.1001.o.interested: "Надо посматривать, что там происходит..."
 faith_creation.1001.o.uninterested: "Не важно, во что верят эти [second.Custom('GetUnbelieverNamePlural')]."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Получены бесплатные действия (#V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!), позволяющие создать, понизить, возвысить, принять или оставить [Concept('holy_sites', 'святые места')|E]"
 faith_creation.1001.o.personal: "Мир узрит, что [ROOT.Char.GetFaith.HighGodName] любит нас!"
 faith_creation.1002.t: "Отколовшееся течение"
 faith_creation.1002.t.new_faith: "Наша собственная вера"
 faith_creation.1002.desc.intro.founder: "Молитва за молитвой и догмат за догматом моё #L [old_rite.GetName|l]ое#! учение постепенно отдалялось от #L [old_faith.GetName|l]ой#! веры, и теперь оно стало по-настоящему самостоятельным течением."
 faith_creation.1002.desc.intro.member: "Молитва за молитвой и догмат за догматом [founder.GetTitledFirstName] [Select_CString(founder.IsFemale, 'формировала', 'формировал' )] наше #L [old_rite.GetName|l]ое#! учение, всё больше удаляя его от #L [old_faith.GetName|l]ой#! веры, и теперь оно стало по-настоящему самостоятельным течением."
 faith_creation.1002.desc.intro.observer: "Молитва за молитвой и догмат за догматом [founder.GetTitledFirstName] [Select_CString(founder.IsFemale, 'формировала', 'формировал' )] своё #L [old_rite.GetName|l]ое#! учение, всё больше удаляя его от #L [old_faith.GetName|l]ой#! веры, и теперь оно стало по-настоящему самостоятельным течением."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName] [Select_CString(old_hof.IsFemale, 'объявила', 'объявил' )] свой приговор: заблудшая паства будет полностью отлучена от церкви."
 faith_creation.1002.desc.anathema.no_hof: "\n\n#L [old_faith.GetName]ие#! [old_faith.AltPriestTermPlural|l] объявили свой приговор: заблудшая паства будет полностью отлучена от церкви."
 faith_creation.1002.desc.new_head.personal: "У меня не остаётся другого выбора, кроме как взять на себя бремя ответственности и встать во главе #L [new_faith.GetName|l]ого#! течения как его [new_faith.ReligiousHeadName|l]."
 faith_creation.1002.desc.new_head.founder: "Впрочем, [founder.GetFirstNameNoTooltip] не [Select_CString(founder.IsFemale, 'растерялась и встала', 'растерялся и встал' )] во главе #L [new_faith.GetName|l]ого#! течения как его [new_faith.ReligiousHeadName|l]."
 faith_creation.1002.desc.new_head.other: "Теперь [new_hof.GetTitledFirstName] стоит во главе #L [new_faith.GetName|l]ого#! течения как его [new_faith.ReligiousHeadName|l]."
 faith_creation.1002.desc.new_head.none: "У нового течения нет единого лидера: его [new_faith.AltPriestTermPlural|l] сами выбирают свой путь."
 faith_creation.1002.desc.outro.new_faith: "\n\nС этого момента у нас своя вера и свой закон. Однако наше движение по-прежнему молодо, а потому #L [old_faith.GetName|l]ие#! фанатики могут в любой момент перейти от слов к делу и пойти на нас войной."
 faith_creation.1002.desc.outro.old_faith: "\n\nВсе графства, придерживающиеся #L [old_rite.GetName|l]ого#! учения, оказались в одночасье отторгнуты от #L [old_faith.GetName|l]ой#! веры. Они нам больше не братья, и не исключено, что однажды мы встретимся с ними на поле боя."
 faith_creation.1002.a: "Наконец-то мы обрели собственную веру."
 faith_creation.1002.a.founder: "Мы сами избрали свой путь."
 faith_creation.1002.b: "Они навечно останутся еретиками."
 faith_creation.1002.b.hof: "Скоро они узнают, как суров мир вне наших объятий."
 faith_creation.1002.consequences.tt: "Теперь [new_faith.GetAdjective|l] является самостоятельной [Concept('faith', 'конфессией')|E]:\n$EFFECT_LIST_BULLET$все [Concept('followers', 'последователи')|E] и [Concept('counties', 'графства')|E] прежнего [Concept('rite', 'течения')|E] переходят в новую конфессию\n$EFFECT_LIST_BULLET$[new_faith.GetAdjective|l] и [old_faith.GetAdjective|l] становятся [Concept('faith_hostility', 'враждебными')|E] друг к другу, что позволяет исповедующим их странам объявлять друг другу [Concept('holy_wars', 'священные войны')|E]\n$EFFECT_LIST_BULLET$теперь у этих двух конфессий будут разные [Concept('head_of_faith', 'главы')|E]"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetAdjective] получает бесплатные действия (#V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!), позволяющие создать, понизить, возвысить, принять или оставить [Concept('holy_sites', 'святые места')|E]"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetAdjective] теряет #TOOLTIP:DOCTRINE,special_doctrine_ecumenical_christian #L экуменизм#!#!"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip] теперь [faith.ReligiousHeadName|U]!"
 faith_creation.1010.desc.start: "Хотя никто не сомневался в истинности нашей веры, в те годы, когда мы обходились без духовного лидера, нам пришлось тяжело. Но теперь это испытание подошло к концу, и"
 faith_creation.1010.desc.temporal.personal: "[faith.AltPriestTermPlural] наконец-то согласились признать, что я [faith.ReligiousHeadName|U]."
 faith_creation.1010.desc.temporal: "[HoF.GetTitledFirstName] наконец [Select_CString(HoF.IsFemale, 'добилась', 'добился' )] того, чтобы [faith.AltPriestTermPlural] признали, что [HoF.GetSheHe] [faith.ReligiousHeadName|U]."
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural], собравшись, постановили, что [HoF.GetFirstName] — [faith.ReligiousHeadName|l] и [Select_CString(HoF.IsFemale, 'хранительница', 'хранитель' )] господствующего течения."
 faith_creation.1010.desc.end: "\n\nТеперь, когда верующие собрались под единым знаменем, похоже, [faith.GetNameNoTooltip|l] вступает в золотой век."
 faith_creation.1010.desc.end.personal: "\n\nТеперь, когда верующие собрались под моим знаменем, я приведу [faith.GetNameNoTooltip|l] в золотой век!"
 faith_creation.1010.a: "Да славится [faith.HighGodName]!"
 faith_creation.1011.message.title: "Учрежден титул главы религии"
 faith_creation.1011.message.desc: "#L [faith.GetName]ие#! [faith.AltPriestTermPlural] пришли к соглашению. Теперь их [Concept( 'head_of_faith', 'глава конфессии' )|E] — [faith.ReligiousHeadName|U] [HoF.GetFirstName]"
 faith_creation.1021.t: "Течение внутри конфессии"
 faith_creation.1021.t.founder: "Наше собственное течение"
 faith_creation.1021.desc.intro.founder: "[new_rite.GetAdjective] становится полноценным учением, и его последователи во всём прислушиваются ко мне. Мы по-прежнему [old_faith.GetAdherentNamePlural|l], но уже не принадлежим к #L [source_rite.GetName|l]ому#! течению."
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName] основал внутри #L [old_faith.GetName|l]ой#! конфессии новое течение, получившее название «[new_rite.GetAdjective|l]». Его последователи также исповедуют #L [old_faith.GetName|l]ую#! веру, но соблюдают собственные обряды и порядки."
 faith_creation.1021.desc.divergence.minor: "\n\nЭто учение отличается от #L [source_rite.GetName|l]ого#! канона лишь в мелких деталях."
 faith_creation.1021.desc.divergence.moderate: "\n\nПри этом некоторые положения этого учения кажутся чуждыми большинству #L [source_rite.GetName|l]их#! верующих."
 faith_creation.1021.desc.divergence.major: "\n\nПри этом многие практики этого учения разительно отличаются от #L [source_rite.GetNameNoTooltip|l]их#!, что закономерно вызывает подозрения."
 faith_creation.1021.desc.differing.tenet: "Наиболее явное расхождение — догмат «[differing_tenet.GetBaseName]»."
 faith_creation.1021.desc.differing.doctrine: "Наиболее явное расхождение — доктрина «[differing_doctrine.GetDescriptiveName]»."
 faith_creation.1021.desc.differing.fallback: "Однако расхождений довольно много, и среди них сложно выделить наиболее важные."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nТак или иначе, мы оставили господствующее течение, по которому [old_faith.GetAdjectiveNoTooltip|l] судит обо всех остальных. Если наши братья сочтут это решение самонадеянным — пусть будет так."
 faith_creation.1021.desc.outro.founder.branch: "\n\nМы и прежде были ветвью, теперь же мы полностью отделились и сами выбираем свой путь."
 faith_creation.1021.desc.outro.observer: "\n\nВ нашей вере новые течения не редкость. Приживётся ли оно, завянет ли или перерастёт в ересь — покажет лишь время."
 faith_creation.1021.a.founder: "Мы будем развиваться не спеша, доверяя наши истины лишь самым верным."
 faith_creation.1021.b.founder: "Пусть вся держава узнает о нашем течении."
 faith_creation.1021.a: "Если вера живёт и развивается, она всегда обрастает новыми течениями."
 faith_creation.1021.b: "Всякая ересь начинается с новых идей…"
