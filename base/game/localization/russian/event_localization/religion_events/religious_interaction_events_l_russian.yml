 ### Literalist Debate by Ewan Cowhig Croft ###
 ##############################################
 religious_interaction.2400.t: "Великий спор"
 religious_interaction.2400.desc: "Дрожащим от страха голосом [Select_CString(recipient.IsFemale, 'она', 'он' )] зачитывает мне гневное письмо, в котором [puppet_or_actor.GetTitledFirstName] вызывает меня на публичный спор о добродетелях и пороках нашей общей конфессии: [Select_CString(actor.IsFemale, 'она', 'он' )] сомневается, что я следую догматам, на которых зиждется [recipient.GetFaith.GetAdjectiveNoTooltip|l].\n\nСлуга заикается, проглатывая слова, поскольку тон письма ясно даёт понять, какого [puppet_or_actor.GetShortUINameNoTooltip] мнения о моём благочестии."
 religious_interaction.2400.a: "Вот собака! Вызов принят!"
 religious_interaction.2400.a.tt_success: "[puppet_or_actor.GetShortUINameNoTooltip] [Select_CString(puppet_or_actor.IsFemale, 'унижена', 'унижен' )] в ходе публичных дебатов"
 religious_interaction.2400.a.tt_fail: "[puppet_or_actor.GetShortUINameNoTooltip] успешно ставит под сомнение мою веру"
 religious_interaction.2400.b: "Я не стану марать имя [recipient.GetFaith.HighGodNamePossessive] этим фарсом."
 religious_interaction.2400.b.tt: "[puppet_or_actor.GetShortUINameNoTooltip] узнает об этом"
 religious_interaction.2400.b_turned_down: "[recipient.GetShortUIName|U] не принимает мой вызов на дебаты"
 religious_interaction.2400.b_turned_down_puppeteer: "[recipient.GetShortUIName|U] не [Select_CString(recipient.IsLocalPlayer, 'принимаете', 'принимает' )] [Select_CString(puppet_or_actor.IsLocalPlayer, 'ваш вызов', Concatenate('вызов персонажа ',puppet_or_actor.GetShortUIName))] на дебаты"
 used_literalist_debate_modifier: "Недавние дебаты"
 used_literalist_debate_modifier_desc: "Этот персонаж недавно начал дебаты об основах своей веры."
 literally_debated_modifier: "Недавние дебаты"
 literally_debated_modifier_desc: "Этого персонажа недавно втянули в дебаты об основах веры."
 religious_interaction.2401.desc_intro: "Я и мой оппонент встречаемся в большом зале во владении [debate_locale.GetNameNoTierNoTooltip] за неустойчивыми столами всего в футе друг от друга в окружении толпы возбужденных зрителей. Приглушенный шепот проносится по толпе, и все затихают, ожидая начала дебатов.\n\n"
 religious_interaction.2401.desc_won: "Всего через час [recipient.GetTitledFirstName] сдаётся: я успешно ставлю под сомнение [Select_CString(recipient.IsFemale, 'её', 'его' )] благочестие и представление о добродетелях. Я наношу удар по самой [Select_CString(recipient.IsFemale, 'её', 'его' )] вере в [puppet_or_actor.GetFaith.HighGodNamePossessive]. Толпа неистовствует, и [recipient.GetTitledFirstNameNoTooltip] бежит из зала после обрушившегося на [Select_CString(recipient.IsFemale, 'неё', 'него' )] града тухлых яиц и заплесневелой капусты."
 religious_interaction.2401.desc_lost: "[recipient.GetTitledFirstName] немедленно идет в нападение, не оставляя мне шансов оправдаться, и вскоре толпа определяет победителя.\n\nНесколько мгновений я храбро стою под градом из гнилых овощей; когда же кто-то из крестьян кидает мне в голову живую курицу, мне приходится отступить."
 religious_interaction.2401.a_won: "Воистину, [puppet_or_actor.GetFaith.HighGodName] любит меня."
 religious_interaction.2401.a_lost: "Эти люди не понимают [actor.GetFaith.GetReligion.GetNameNoTooltip|l]ую веру!"
 religious_interaction.2402.desc_won: "Хотя [puppet_or_actor.GetTitledFirstName] [Select_CString(puppet_or_actor.IsFemale, 'вызывала', 'вызывал' )] меня на дебаты с полной уверенностью в собственной победе, [Select_CString(puppet_or_actor.IsFemale, 'её', 'его' )] решимость стремительно тает под натиском моих уничижительных слов и благочестивой критики. Вскоре присоединяется толпа, и мой оппонент бежит из зала под градом из гнилых овощей и одного особенно яростного петуха."
 religious_interaction.2402.desc_lost: "Несмотря на все мои усилия, [puppet_or_actor.GetTitledFirstName] не [Select_CString(puppet_or_actor.IsFemale, 'растерялась', 'растерялся' )] и тут же [Select_CString(puppet_or_actor.IsFemale, 'завоевала', 'завоевал' )] симпатии толпы своими вескими доводами. [Select_CString(puppet_or_actor.IsFemale, 'Она', 'Он' )] продолжает нападать на меня, более часа перечисляя все мои мыслимые грехи и даже выражая сомнение в том, что я искренне почитаю [recipient.GetFaith.HighGodNamePossessive].\n\nВ конечном счёте я отступаю под градом гнилых овощей, который обрушивает на меня толпа."
 religious_interaction.2403.desc: "[victim.GetTitledFirstName] не имеет ни малейшего шанса. Хотя [victim.GetSheHe] считает, что [Select_CString(victim.IsFemale, 'готова', 'готов' )], я отмахиваюсь от [victim.GetHerHis] жалких притязаний, как от мух. От каждого моего довода [victim.GetFirstNameNoTooltip] вздрагивает, как от удара. Вскоре становится настолько очевидным, что [victim.GetSheHe] не может защитить свою точку зрения, что даже толпа смолкает.\n\n«...И именно поэтому, — говорю я, драматически воздевая руку и указывая пальцем в противоположный конец комнаты, — вы никогда...»\nЯ останавливаюсь, осознав, что [victim.GetFirstNameNoTooltip] отчаянно пытается вздохнуть, стискивая"
 religious_interaction.2403.conclusion_either: "свою грудь."
 religious_interaction.2403.conclusion_man: "свою руку."
 religious_interaction.2403.conclusion_woman: "свой живот."
 religious_interaction.2403.a.low_compassion: "«Я смотрю, вы выбрали путь труса»."
 religious_interaction.2403.a.zealous: "«Похоже, [ROOT.Char.GetFaith.PantheonTerm] на моей стороне»."
 religious_interaction.2403.a.stubborn: "«Эй, это еще не всё!»"
 religious_interaction.2403.a: "«Вы... вы в порядке?»"
 religious_interaction.2403.a.tt: "[victim.GetShortUIName] [Concept( 'character_death_dies', 'умирает' )|E] от сердечного приступа"
 religious_interaction.2500.desc: "Когда люди, подобные тебе, прозревают... Это [ROOT.Char.GetFaith.HighGodNameAlternate] шлет нам знамение! Приветствуем тебя в лоне истинной веры."
 religious_interaction.2500.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'приняли', Select_CString(recipient.IsFemale, 'приняла', 'принял' ))] [Select_CString(puppet_or_actor.IsLocalPlayer, 'ваше предложение', Concatenate('предложение персонажа ',puppet_or_actor.GetShortUIName))] обратиться в другую конфессию во время войны"
 religious_interaction.2500.a: "Да восславится [ROOT.Char.GetFaith.HighGodName]!"
 religious_interaction.2501.desc: "Ты думаешь, [recipient.GetFaith.HighGodName] поверит этим жалким политическим ужимкам и отвратит карающую длань? Да ты шутишь!"
 religious_interaction.2501.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'отклонили', Select_CString(recipient.IsFemale, 'отклонила', 'отклонил' ))] [Select_CString(puppet_or_actor.IsLocalPlayer, 'ваше предложение', Concatenate('предложение персонажа ',puppet_or_actor.GetShortUIName))] обратиться в другую конфессию во время войны"
