 TITLE_TIER_REASON: "[Select_CString(puppet_or_actor.IsLocalPlayer, 'Ваш ', '')][Concept('title_tier', Select_CString(puppet_or_actor.IsLocalPlayer, 'уровень', 'Уровень'))|E][Select_CString(puppet_or_actor.IsLocalPlayer, '', Concatenate(' персонажа ', puppet_or_actor.GetShortUIName))]: $VALUE|=+0$"
