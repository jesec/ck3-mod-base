l_russian:
 gdp_travel_events.1000.t: "$travel_danger_prefix$: нестерпимая жара"
 gdp_travel_events.1000.desc: "Бескрайние пески, уходящие далеко за горизонт, и палящее солнце, от которого сам воздух плавится и превращает пустынное море в обманчивый мираж, — вот всё, что [ROOT.Char.GetCurrentLocation.GetName] может нам предложить. Обливаясь потом от невыносимого зноя, мы решаем устроить привал, после чего [Select_CString(entourage_member_one.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))|l] [entourage_member_one.GetFirstName] поворачивается ко мне с широко раскрытыми глазами.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], не переживайте из-за жары. Милостью [entourage_member_one.GetFaith.HighGodNamePossessive] прошлой ночью мне явилось чудесное видение! Неподалёку есть оазис, и я точно знаю, где его искать»."
 gdp_travel_events.1000.a: "А по-моему, он в другой стороне!"
 gdp_travel_events.1000.b: "Что ж, попробуем. Других вариантов у нас нет."
 gdp_travel_events.1000.b.success: "Оазис оказался настоящим. Славься, [entourage_member_one.GetFaith.HighGodName]!"
 gdp_travel_events.1000.b.failure: "Это был всего лишь очередной мираж"
 gdp_travel_events.1000.c: "Я не стану доверять каким-то бредовым видениям."
 low_caravaneer_experience_reason_tooltip: "Требуется #V 100#! ед. [Concept('trait_level_track_xp', 'опыта')|E] на пути развитии свойства «$trait_track_caravaneer$» ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])"
 gdp_travel_events.1010.t: "Потерявшиеся путники"
 gdp_travel_events.1010.desc: "Ближе к вечеру наш караван решает разбить лагерь неподалёку от [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')|l] [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]. Едва мы успеваем устроиться поудобнее на ночлег, как вдруг позади раздаётся голос.\n\n«Прошу прощения, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Мы с моей семьёй отбились от нашего каравана. Нам особо нечего предложить, но я не задумываясь пожертвую чем угодно, лишь бы [Select_CString(traveler_child.IsFemale, 'моя дочь', 'мой сын' )] мог провести эту ночь в безопасности»."
 gdp_travel_events.1010.a: "Не нужно денег. Чувствуйте себя как дома."
 gdp_travel_events.1010.b: "Мы можем дать вам приют… за скромную плату."
 gdp_travel_events.1010.c: "#EMP Чем угодно#!, говоришь…"
 gdp_travel_events.1010.d: "У нас и так хватает голодных ртов."
 gdp_travel_events.1020.t: "Дорожные истории"
 gdp_travel_events.1020.desc.intro: "[journey_start.GetName], откуда мы начали своё путешествие, уже далеко позади, о чём лишний раз напоминает боль в пояснице. С каждым шагом, что делает мой [ROOT.Char.Custom('GetDonkeyDromedary')|l], седло всё сильнее натирает мне зад, а здешние [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')|l] всё больше мозолят глаза. В свою очередь, [Select_CString(associate.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))|l] [associate.GetFirstName] не подаёт никаких признаков усталости. [Select_CString(associate.IsFemale, 'Она', 'Он' )] подъезжает ко мне поближе, явно желая что-то сказать.\n\n"
 gdp_travel_events.1020.desc.caravaneer: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U], на днях я [Select_CString(associate.IsFemale, 'разговаривала', 'разговаривал' )] с караванщиком из провинции [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], и он поведал мне о невероятном устройстве для навигации…»"
 gdp_travel_events.1020.desc.artisan: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U], а вы знали, что [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|l] используется для создания потрясающих текстильных красок? Если тщательно истолочь лепестки этого цветка…»"
 gdp_travel_events.1020.desc.creditor: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U], хотите занимательный факт? В некоторых местах грабить людей абсолютно #EMP законно#!, если жертва не отдаёт вам долг. Сразу вспоминаю, как однажды мы с моими двоюродными братьями…»"
 gdp_travel_events.1020.desc.war_profiteer: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U], между прочим, [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')|l], что лежит перед нами, — место великой битвы. Говорят, именно здесь погиб легендарный мечник, который пробивался сквозь ряды врагов, словно [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')|l]…»"
 gdp_travel_events.1020.a: "Любопытно, продолжай."
 gdp_travel_events.1020.b: "Как по мне, [ROOT.Char.Custom('my_subject_of_interest')|l] — более интересная тема для разговора."
 gdp_travel_events.1020.c: "Я предпочитаю ехать в тишине."
 gdp_travel_events.1020.b.success: "Вы меняете тему разговора"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip] не хочет вас слушать"
 gdp_travel_events.1030.t: "Гадкие сплетни"
 gdp_travel_events.1030.desc: "[Select_CString(ambitious_associate.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))|l] [ambitious_associate.GetFirstName] осторожно подходит ко мне и смотрит по сторонам на случай, если кто-то нас подслушивает. Затем [Select_CString(ambitious_associate.IsFemale, 'она', 'он' )] наклоняется поближе и шепчет:\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], я [Select_CString(ambitious_associate.IsFemale, 'слышала', 'слышал' )] о вашем партнёре весьма нелестные вещи. В компании поговаривают, что [current_partner.GetFirstName] #EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!. Если это правда, то [Select_CString(current_partner.IsFemale, 'её', 'его' )] однозначно нужно наказать!\n\nИ на мой скромный взгляд, было бы справедливо наградить того, кто сообщил вам эти вести…»"
 gdp_travel_events.1030.a: "Мне нужно знать правду!"
 gdp_travel_events.1030.a.unity_loss.desc: "Вы узнали страшную правду о своём партнёре"
 gdp_travel_events.1030.b: "Я не люблю сплетни."
 gdp_travel_events.1030.b.unity_gain.desc: "Вы не стали верить грязным слухам о своём партнёре"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ заброшенный колодец"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName] заглядывает в старый колодец и морщит нос.\n\nЗа колодцем давно никто не ухаживает: кладка поросла мхом, ведро прогнило насквозь, а вода смердит так, что даже умирающий от жажды человек подумает дважды, прежде чем сделать глоток.\n\nОднако наши бурдюки обмякли, воды в них почти не осталось. Жажда становится всё мучительнее."
 gdp_travel_events.1040.a: "Подумаешь, немного грязи — ничего от неё не будет!"
 gdp_travel_events.1040.b: "Я знаю, как очистить воду."
 gdp_travel_events.1040.c: "Будем тщательно беречь оставшуюся воду."
 gdp_travel_events.1040.d: "Путь предстоит долгий, и жажда будет тяжёлой."
 gdp_travel_events.1040.e: "Разве что один глоток…"
 gdp_travel_events.1040.e.critical_failure.tt: "Вы начинаете хворать ещё сильнее."
 gdp_travel_events.1040.e.success: "Воду можно пить без вреда для себя."
 gdp_travel_events.1040.e.success.desc: "Вы пьёте из колодца и чувствуете, как вода освежает вас."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ поваленные деревья"
 gdp_travel_events.1050.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')|U] во владении [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] встречает нас следами недавней бури: вырванные с корнем деревья стихия сбросила прямо на дорогу. Местные труженики уже рубят стволы и ветки, однако расчистить путь удастся ещё не скоро.\n\nЗдесь есть объездная дорога, однако [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')], где она пролегает, — опасная местность: покосившиеся деревья вот-вот рухнут вслед за уже упавшими."
 gdp_travel_events.1050.x: "Мой славный жеребец [ROOT.Char.Custom('WarhorseStoryName')] оттащит всё это в сторону!"
 gdp_travel_events.1050.a: "Значит, мне можно и потрудиться как следует."
 gdp_travel_events.1050.b: "Из их работы можно почерпнуть что-то полезное."
 gdp_travel_events.1050.c: "Попытаемся найти объездной путь."
 gdp_travel_events.1050.d: "Подождём, пока рабочие закончат."
 gdp_travel_events.1050.c.success: "Вы объезжаете поваленные деревья."
 gdp_travel_events.1050.c.failure: "В глуши вы получаете ранение."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ крысы в трюме"
 gdp_travel_events.1060.desc: "Трюм корабля кишит крысами, жадно пожирающими нашу провизию. Одни говорят, что виноваты мы сами: крышки закрыты неплотно, а мешки прохудились. Другие считают, что дело в невероятном количестве грызунов.\n\nКак бы то ни было, эту войну мы стремительно проигрываем. Нужно срочно что-то делать, пока мерзкие твари не сожрали все запасы и не оставили нас ни с чем."
 gdp_travel_events.1060.x: "Кошки — лучшие крысоловы. [ROOT.Char.Custom('CatStoryName')] с ними справится."
 gdp_travel_events.1060.a: "«Принесите мне гарпун и крепкую сеть!»"
 gdp_travel_events.1060.b: "Сейчас я вам покажу, как нужно правильно хранить припасы!"
 gdp_travel_events.1060.c: "Возьмём курс на порт и пополним запасы."
 gdp_travel_events.1060.d: "Приказываю каждому заняться отловом крыс!"
 gdp_travel_events.1060.b.tt: "У вас должно быть не менее #V 25#! ед. [Concept('expertise', 'познаний')|E] в категории «[GetTradeGoodCategory('trade_category_cereals').GetName]»"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ мишень на спине"
 gdp_travel_events.1070.desc: "Над горизонтом взметается пыль, и в следующий же миг на вершину холма выскакивает шайка головорезов. Их кони резко встают на дыбы.\n\n«Стоять! — кричит нам вожак. — Отдавай золото по-хорошему, [ROOT.Char.GetTitleAsNameNoTooltip|l], и тогда никто не пострадает»."
 gdp_travel_events.1070.a: "«Болваны! В этих землях меня охраняет [ROOT.Char.GetSuzerain.GetShortUIName]!»"
 gdp_travel_events.1070.a.success: "Разбойники дают вам пройти, услышав имя покровителя"
 gdp_travel_events.1070.b: "«Попробуйте-ка отнимите!»"
 gdp_travel_events.1070.b.success: "Вы отгоняете разбойников"
 gdp_travel_events.1070.b.failure: "Разбойники отнимают у вас золото"
 gdp_travel_events.1070.c: "«Забирайте, только пропустите нас»."
 gdp_travel_events.2000.t: "Кривая башня"
 gdp_travel_events.2000.desc: "Неужели мне мерещится? Или у меня кружится голова, хотя стою я твёрдо? Нет, зрение меня не обманывает, пусть и трудно поверить глазам. #EMP Великая [GetBuildingType('tower_of_pisa').GetNameNoTooltip] и правда накренилась#!!\n\n«Почва тут такая, [ROOT.Char.Custom('FormOfAddressForLiege')], что скисшее молоко и то твёрже, — произносит мастер-каменщик [mason.GetFirstName], подойдя ко мне. — Мы и на четверть её возвести не успели, как она наклонилась. Но всё-таки, как видите, достроили».\n\n«Красивое зрелище, правда?»."
 gdp_travel_events.2000.a: "Может быть, такая #EMP необычная#! башня начнёт привлекать путников?.."
 gdp_travel_events.2000.b: "Вы либо гениальны, либо безумны. Как бы то ни было — я вас нанимаю!"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip],"
 gdp_travel_events.2002.desc: "Наши мастера с гордостью сообщают, что величественная [GetBuildingType('tower_of_pisa').GetNameNoTooltip] наконец достроена.\n\nНо из Пизы доходят странные вести: путешественники рассказывают о сооружении, #EMP совершенно#! не похожем на какие-либо другие башни. Я боюсь, что строители допустили страшную оплошность…"
 gdp_travel_events.2002.a: "Я хочу увидеть их творение собственными глазами."
 gdp_travel_events.2002.b: "Мне всё равно. Главное, чтобы она не падала."
