l_russian:
 culture_notification.0010.t: "Традиция забыта"
 culture_notification.0010.desc: "[Concept('tradition', 'Традиция')|E] «[tradition.GetName]» забыта #L [this_player.GetCulture.GetCollectiveNoun|l]ой#! [Concept('culture', 'культурой')|E]"
 culture_notification.0011.t: "Традиция принята"
 culture_notification.0011.desc: "[Concept('tradition', 'Традиция')|E] «[tradition.GetName]» принята #L [this_player.GetCulture.GetCollectiveNoun|l]ой#! [Concept('culture', 'культурой')|E]"
 culture_notification.1001.t: "Гибридная культура: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "Из #L [parent_1.GetCulture.GetCollectiveNoun|l]ой#! и #L [parent_2.GetCulture.GetCollectiveNoun|l]ой#! культур [founder.GetTitledFirstName] создает новую #V #L [new_culture.GetCulture.GetCollectiveNoun|l]ую#!#! [Concept( 'hybrid_culture', 'гибридную культуру' )|E]."
 culture_notification.1011.t: "[new_culture.GetCollectiveNounNoTooltip]ая гибридизация"
 culture_notification.1011.intro: "Со временем [parent_1.GetCollectiveNoun|l]ий и [parent_2.GetCollectiveNoun|l]ий народ сближаются, и появляется новая культура — [new_culture.GetCollectiveNoun|l]ая.\n\n"
 culture_notification.1011.blend: "[parent_1.GetCollectiveNounNoTooltip]ая традиция «[tradition_1.GetName]» [parent_2.GetCollectiveNounNoTooltip|l]ая традиция «[tradition_2.GetName]» смешиваются друг с другом. Так формируется новая культура."
 culture_notification.1011.blend_fallback: "При этом обе культуры вносят одинаковый вклад: [new_culture.GetCollectiveNounNoTooltip|l]ая культура гармонично сочетает их в равных пропорциях."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "#L [new_culture.GetCollectiveNoun]ая#! [Concept( 'hybrid_culture', 'гибридная культура' )|E] возникла при смешении #L [parent_1.GetCollectiveNoun|l]ой#! и #L [parent_2.GetCollectiveNoun|l]ой#! [Concept( 'cultures', 'культур' )|E]."
 culture_notification.1101.t: "Культура отделена: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName] [Select_CString(founder.IsFemale, 'создала', 'создал' )] #V #L [new_culture.GetCollectiveNoun|l]ую#!#! культуру, [Concept( 'divergent_culture', 'отделившуюся' )|E] от #L [parent_1.GetCollectiveNoun|l]ой#!"
 culture_notification.1111.t: "[new_culture.GetCollectiveNounNoTooltip]ие различия"
 culture_notification.1111.intro: "Изменения диалекта, появление новых обычаев… Сперва процесс слияния едва заметен. Со временем он набирает силу, и ныне [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], где проживает немало выходцев из [parent_1.GetCollectiveNoun|l]ой культуры, наблюдает рождение нового сообщества, которое называет себя [new_culture.GetCollectiveNoun|l]им.\n\n"
 culture_notification.1111.tradition.new: "Постепенно традиции предков заменяются новой, [new_tradition.GetCollectiveNoun|l]ой."
 culture_notification.1111.tradition.lost: "[parent_1.GetCollectiveNounNoTooltip]ая традиция «[lost_tradition.GetName]» отброшена за ненужностью."
 culture_notification.1111.ethos.bellicose: "В опасном и враждебном мире [new_culture.GetNameNoTooltip|l]ий народ все больше уповает на силу оружия и усваивает новый принцип — [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.bureaucratic: "Похоже, [new_culture.GetNameNoTooltip|l]ий народ начинают проявлять интерес к многословным законам, длинным хроникам и запутанным договорам. Так формируется новый принцип — [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.courtly: "Похоже, [new_culture.GetNameNoTooltip|l]ий народ начинает проявлять интерес к этикету и церемониям. Так формируется новый принцип — [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.communal: "[new_culture.GetNameNoTooltip]ому народу повезло с соседями. Со временем их связи только крепнут. Так формируется новый принцип — [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.stoic: "В опасном и непредсказуемом мире [new_culture.GetNameNoTooltip|l]ий народ все больше уповает на твёрдость духа и усваивает новый принцип — [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.spiritual: "В поисках ответов [new_culture.GetNameNoTooltip|l]ий народ обращается к религии. Так формируется новый принцип — [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.egalitatian: "В [new_culture.GetNameNoTooltip|l]ом обществе на первый план выходят личные заслуги, а это значит, что оно стало [new_culture.GetEthos.GetName|l]им."
 culture_notification.1111.ethos.unchanged: "Их мировоззрение осталось прежним, но политические разногласия и границы раскололи народ надвое."
 culture_notification.1111.outro.other: "\n\n[founder.GetTitledFirstName] возглавляет культурное возрождение. Хитрость, уговоры… На что только не пойдёшь ради власти?"
 culture_notification.1111.outro.founder: "\n\n[new_culture.GetCollectiveNounNoTooltip]ий народ знает, что теперь его будущее зависит от меня. Люди ждут от меня решений."
 culture_notification.1111.a.other: "Посмотрим, как будет развиваться ситуация."
 culture_notification.1111.a.founder: "В новый век, в новую эпоху, с новым народом!"
 culture_notification_tooltip: "#L [new_culture.GetCollectiveNoun]ая#! [Concept( 'divergent_culture', 'отделившаяся культура' )|E] откололась от #L [parent_1.GetCollectiveNoun|l]ой#! [Concept( 'culture', 'культуры' )|E]."
