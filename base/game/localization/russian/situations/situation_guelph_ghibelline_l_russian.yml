 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main' )]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "Лидер [Concept('guelphs', 'гвельфов')|E] в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]».\n\nВо время [Concept('situation_phase', 'фаз')|E]-прелюдий «[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]» и «[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]» $religiousheadname_pope$ возглавляет [Concept('guelphs', 'гвельфов')|E], и борьба развивается по историческому сценарию. [Concept('decisions', 'Решения')|E] лидера стану доступны после завершения прелюдии и начала открытого конфликта.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "Лидер [Concept('guelphs', 'гвельфов')|E] в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]».\n\nЭтому лидеру доступны уникальные [Concept('decisions', 'решения')|E], позволяющие повлиять на конфликт:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! и #V $guelph_ghibelline_conflict_decision$#! для смещения [Concept('situation', 'ситуации')|E] между спокойными и [Concept('situation_phase', 'фазами')|E] и фазами конфликта\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#! для завершения ситуации в пользу [Concept('guelphs', 'гвельфов')|E] при наличии преимущества\n$BULLET_WITH_TAB$Решение уйти в отставку и передать лидерство подходящему стороннику$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "$ghibelline$ — глава"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "Лидер [Concept('ghibellines', 'гибеллинов')|E] в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]».\n\nВо время [Concept('situation_phase', 'фаз')|E]-прелюдий «[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]» и «[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]» правитель державы [GetTitleByKey('e_hre').GetName] возглавляет [Concept('ghibellines', 'гибеллинов')|E], и борьба развивается по историческому сценарию. [Concept('decisions', 'Решения')|E] лидера стану доступны после завершения прелюдии и начала открытого конфликта.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "Лидер [Concept('ghibellines', 'гибеллинов')|E] в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]».\n\nЭтому лидеру доступны уникальные [Concept('decisions', 'решения')|E], позволяющие повлиять на конфликт:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! и #V $guelph_ghibelline_conflict_decision$#! для смещения [Concept('situation', 'ситуации')|E] между спокойными и [Concept('situation_phase', 'фазами')|E] и фазами конфликта\n$BULLET_WITH_TAB$#V $ghibelline_victory_decision$#! для завершения ситуации в пользу [Concept('ghibellines', 'гибеллинов')|E] при наличии преимущества\n$BULLET_WITH_TAB$Решение уйти в отставку и передать лидерство подходящему стороннику$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_member: "$guelph$ — сторонник"
 guelph_ghibelline_participant_group_guelph_member_desc: "Сторонник [Concept('guelph', 'гвельфов')|E] в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName] [situation|E]»."
 guelph_ghibelline_participant_group_ghibelline_member: "$ghibelline$ — сторонник"
 guelph_ghibelline_participant_group_ghibelline_member_desc: "Сторонник [Concept('ghibelline', 'гибеллинов')|E] в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName] [situation|E]»."
 guelph_ghibelline_participant_group_undecided: "Не определился"
 guelph_ghibelline_participant_group_undecided_desc: "Не определившийся участник в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName] [situation|E]». Определённые усилия могут привлечь его на ту или иную сторону.\n\n#BOL Не может#! вызвать срабатывание [Concept('situation_catalysts','катализаций')|E][situation_catalysts|E] и менее склонен к [Concept('gg_involvement', 'вовлечённости')|E]."
 guelph_ghibelline_participant_group_outsider: "Чужак"
 guelph_ghibelline_participant_group_outsider_desc: "Посторонний человек в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName] [situation|E]». Обычно это безземельные авантюристы и наёмники.\n\n#BOL Не может#! вызвать срабатывание [Concept('situation_catalysts','катализаций')|E][situation_catalysts|E] или быть [Concept('gg_involvement', 'вовлечён')|E] в ситуацию."
 guelph_ghibelline_all: "Текущая [Concept('situation_phase_phase', 'фаза')|E] [Concept('guelph_ghibelline_situation', 'ситуации «Гвельфы и гибеллины»')|E]"
 guelph_ghibelline_guelph_leader: "[Concept('situation_phase', 'Фаза')|E] [Concept('guelph_ghibelline_situation', 'ситуации «Гвельфы и гибеллины»')|E] #weak ($PARTICIPANT_GROUP$)#!"
 guelph_ghibelline_guelph_member: "[Concept('situation_phase', 'Фаза')|E] [Concept('guelph_ghibelline_situation', 'ситуации «Гвельфы и гибеллины»')|E] #weak ($PARTICIPANT_GROUP$)#!"
 guelph_ghibelline_ghibelline_leader: "[Concept('situation_phase', 'Фаза')|E] [Concept('guelph_ghibelline_situation', 'ситуации «Гвельфы и гибеллины»')|E] #weak ($PARTICIPANT_GROUP$)#!"
