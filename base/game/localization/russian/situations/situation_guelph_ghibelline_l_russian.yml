 guelph_ghibelline_sub_region_core_desc: "Все [Concept('counties', 'графства')|E] в итальянских и германских [Concept('kingdoms', 'королевствах')|E] титула [GetTitleByKey('e_hre').GetDefinitiveName|l], в которых идёт противостояние [Concept('guelphs', 'гвельфов')|E] и [Concept('ghibellines', 'гибеллинов')|E]"
 #Participant Groups
 gg_leader_group_help: "#help \n\nОтсутствие лидера у любой из сторон приведёт к тому, что ситуация разрешится в пользу противоположной.#!"
