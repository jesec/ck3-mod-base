 precursor_situation_leader_help: "#help Эта [Concept('situation_phase_phase', 'фаза')|E] становится возможной, если правитель державы [GetTitleByKey('e_hre').GetDefinitiveName|l] — [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('ghibelline_leader').GetName], а $religiousheadname_pope$ — [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('guelph_leader').GetName].#!"
 situation_guelph_ghibelline_phase_in_nomine_domini: "Папское возрождение"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "Эта [Concept('situation_phase', 'фаза ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]» представляет собой относительно спокойный период, который мало влияет на жизни её участников.\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "По истечении примерно [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1' ), 'г.', 'л.' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1' ), 'мес.', 'мес.' ) )], произойдёт эскалация, и ситуация перейдёт в [Concept('situation_phase_phase', 'фазу')|E] «[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]»"
 gg_nomine_domini_transition_desc: "Хотя большинство принципов диктата папы (…)"
 dictatus_papae: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "Диктат папы"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "Эта [Concept('situation_phase', 'фаза ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]» представляет собой эскалацию после предыдущей фазы «[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName]».\n\nТеперь отношения между монархами и их церковными вассалами обостряются, поскольку вассалы вынуждены выбирать: $religiousheadname_pope$ претендует на высшую власть, но их сюзерены стремятся сохранить свой суверенитет.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "По истечении примерно [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), 'г.', 'л.' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), 'мес.', 'мес.' ) )], произойдёт эскалация, и ситуация перейдёт в [Concept('situation_phase_phase', 'фазу')|E] «[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]» или «[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]»"
 gg_dictatus_papae_transition_desc: "Хотя большинство принципов диктата папы (…)"
 ad_interim: "$situation_guelph_ghibelline_phase_ad_interim$"
 ad_interim_desc: "$situation_guelph_ghibelline_phase_ad_interim_desc_short$"
 situation_guelph_ghibelline_phase_ad_interim: "Вормсский конкордат"
 situation_guelph_ghibelline_phase_ad_interim_desc_short: "Эта [Concept('situation_phase', 'фаза ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]» является переломным моментом, когда [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName] и [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName] решают, какой будет следующая фаза, [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] или [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]…\n\n$precursor_situation_leader_help$"
 agitation: "$situation_guelph_ghibelline_phase_agitation$"
 agitation_desc: "$situation_guelph_ghibelline_phase_agitation_desc_short$"
 situation_guelph_ghibelline_phase_agitation: "Агитация"
 situation_guelph_ghibelline_phase_agitation_desc_short: "Эта [Concept('situation_phase', 'фаза ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]» отличается частыми конфликтами, в которой стороны враждуют и борются за влияние.\n\nЕсли сила одной из групп превысит 70%, ситуация перейдёт в одну из следующих фаз:\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
 guelph_advantage: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_advantage_desc: "$situation_guelph_ghibelline_phase_guelph_advantage_desc_short$"
 situation_guelph_ghibelline_phase_guelph_advantage: "Преимущество гвельфов"
 situation_guelph_ghibelline_phase_guelph_advantage_desc_short: "Эта [Concept('situation_phase', 'фаза ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]» означает, что [Concept('guelphs', 'гвельфы')|E] побеждают в [Concept('situation_phase_phase', 'конфликте')|E].\n\n$guelphs$ получают дополнительные преимущества, но те, кому досталась огромная власть, не должны расслабляться, чтобы её не упустить…"
