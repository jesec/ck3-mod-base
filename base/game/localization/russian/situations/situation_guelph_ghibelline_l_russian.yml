 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "«Во имя Господа» — эту буллу папа Николай II обнародовал 13 апреля 1059 года. Она положила начало решительным переменам в порядке папских выборов. Главным новшеством стало отстранение светских государей от участия в избрании и утверждении папы — отныне единственными выборщиками становились кардиналы-епископы."
 DICTATUS_PAPAE_GLOSS: "Диктат папы — свод из двадцати семи тезисов о верховной власти, принадлежащей папе. Папа Григорий VII продиктовал его в 1075 году — как раз в то время, когда разгоралась борьба за инвеституру."
