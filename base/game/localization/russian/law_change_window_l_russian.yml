 LAW_CHANGE_WINDOW_CLAN_CHANGE_LAW_BUTTON_TOOLTIP: "Вы состоите в [Concept( 'clan', 'клане' )|E] и не можете менять [Concept( 'succession_laws', 'законы наследования' )|E] таким образом. [Concept( 'succession_laws', 'Законы наследования' )|E] [Concept( 'clan', 'клана' )|E] определяются его [Concept( 'house_unity_level', 'уровнем единства дома' )|E]."
