 #Food and drink glosses
 ABALONE_GLOSS: "Редкий моллюск с жёсткой мясистой плотью."
 SEA_CUCUMBER_GLOSS: "Мягкое морское животное, считающееся деликатесом в китайской кухне."
 SWALLOW_NEST_GLOSS: "Редкое птичье гнездо, из которого варят изысканный суп."
 ENTREMETS_GLOSS: "Изысканное промежуточное блюдо, которое представляет собой десерт или украшенные яства для развлечения гостей."
 MOCHI_GLOSS: "Жёсткий пирог из толчёного клейкого риса."
 DURIAN_GLOSS: "Крупный тропический фрукт, известный своим резким запахом и нежной мякотью."
 AQUA_VITAE_GLOSS: "Крепкие спиртные напитки, часто используемые в лечебных целях."
 TRIBUTE_CHILLED_TEA_GLOSS: "Отборный чай со льдом или снегом, который дарят знатным особам."
 EMPEROR_TEA_GLOSS: "Изысканный чай, специально отобранный для императорского двора."
 BAIJIU_GLOSS: "Крепкий китайский алкогольный напиток, приготовленный из забродившего зерна."
 HANAKUSA_GLOSS: "Японский алкогольный напиток из смеси различных цветов и листьев."
 PEARL_POWDER_GLOSS: "Дорогой тоник из жемчужного порошка."
 CHRYSANTHEMUM_BEER_GLOSS: "Слабоалкогольный напиток, приправленный цветками хризантемы."
 SHARBAT_GLOSS: "Сладкий фруктовый напиток с пряностями, который обычно подают холодным."
 SAMBUSA_GLOSS: "Жареное тесто с начинкой в виде овощей или пряного мяса."
 PAKHALA_GLOSS: "Холодное восточно-индийское блюдо из сброженного в воде риса."
 PILAU_GLOSS: "Варёный рис со специями, в который также добавляют мясо или овощи."
 PASTILLA_GLOSS: "Традиционный магрибский слоёный пирог с мясом и специями."
 BOTUO_GLOSS: "Густой китайский суп с лапшой или клёцками."
 SPHOUNGATA_GLOSS: "Пышный византийский омлет."
 TARICHOS_GLOSS: "Солёная вяленая рыба, являющаяся неотъемлемой частью византийской кухни."
 BING_GLOSS: "Китайский хлеб наподобие лепёшек или оладий."
 MANTOU_GLOSS: "Мягкая паровая булочка из пшеничной муки, популярная в Китае."
 ZOSUI_GLOSS: "Японская рисовая каша на рыбном бульоне."
 KIMCHI_GLOSS: "Корейское блюдо из квашеных овощей, приправленных солью и специями."
 BUBUR_GLOSS: "Малайская рисовая каша."
