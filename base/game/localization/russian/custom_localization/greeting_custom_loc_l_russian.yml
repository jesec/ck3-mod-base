 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)|U]"
 greeting_supplimentary.negative.tales: "О ваших злодеяниях рассказывают от Ирландии до Катая."
 greeting_supplimentary.negative.greek: "Ваш дурной нрав достоин греческих комедий."
 greeting_supplimentary.negative.insult.1: "Пусть гуморы гниют в вашем теле."
 greeting_supplimentary.negative.insult.2: "Да будет жизнь ваша коротка и жалка."
 greeting_supplimentary.negative.insult.3: "Пусть мудрость избегает вас."
 greeting_supplimentary.negative.insult_muslim.1: "Проклятье на вас до седьмого колена."
 greeting_supplimentary.negative.insult_muslim.2: "Чтоб вас живьем зашили в брюхе мертвого верблюда."
 greeting_supplimentary.negative.insult_muslim.3: "Да уничтожит Аллах ваш дом."
 greeting_supplimentary.negative.insult_muslim.4: "Отродье паршивой собаки."
 greeting_supplimentary.negative.insult_muslim.5: "Пусть шакалы дерутся за твои неупокоенные кости."
 greeting_supplimentary.negative.insult_muslim.6: "Пусть твои колодцы заполнятся песком, а шатры наводнят скорпионы."
 greeting_supplimentary.negative.insult_christian.1: "Да отвернутся от тебя святые."
 greeting_supplimentary.negative.insult_christian.2: "Твоё имя будет навеки вычеркнуто из всех молитв."
 greeting_supplimentary.negative.insult_norse.1: "Пусть твои предки плюют тебе вслед."
 greeting_supplimentary.negative.insult_norse.2: "Твоя смелость ещё более хрупка, чем первый речной лёд."
 greeting_supplimentary.negative.insult_byzantine.1: "От твоего зловония бегут даже константинопольские крысы."
 greeting_supplimentary.negative.insult.4: "Пусть твои поля сгниют, а колодцы пересохнут."
 greeting_supplimentary.negative.insult.unreliable_swine: "Ты — бесчестная свинья."
 greeting_supplimentary.negative.insult.oathbreaker: "Ты умеешь только лгать и предавать."
 greeting_supplimentary.negative.insult_jewish.1: "Да вычеркнет Господь твоё имя из Книги Жизни."
 greeting_supplimentary.negative.insult_zoroastrian.1: "Пусть тьма погасит то пламя, которое ты якобы хранишь."
 greeting_supplimentary.negative.insult_hindu.1: "Ты не знаешь праведного пути, и я не позволю тебе его отыскать."
 greeting_supplimentary.negative.insult_christian.3: "Да разверзнутся под тобой врата ада."
 greeting_supplimentary.negative.insult_norse.3: "После твоей смерти вороны будут долго пировать."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "Благословение вам и вашему дому."
 greeting_supplimentary.positive.flattery.2: "Ваши мудрость и милосердие легендарны."
 greeting_supplimentary.positive.flattery.3: "Мир вам."
 greeting_supplimentary.positive.flattery.4: "Желаю вам гармонии и покоя."
 greeting_supplimentary.positive.flattery.5: "Вашей решительной суровости остается только позавидовать."
 greeting_supplimentary.positive.flattery.6: "О вашем аппетите ходит слава во всем мире."
 greeting_supplimentary.positive.flattery.7: "Ваше доброе имя известно во всех краях."
 greeting_supplimentary.positive.flattery.8: "Пусть ваш род проживёт ещё тысячу лет."
 greeting_supplimentary.positive.flattery.9: "Да укрепит Бог вашу длань."
 greeting_supplimentary.positive.flattery.10: "Мир и процветание вашему дому."
 greeting_supplimentary.positive.flattery.11: "Пусть вам во всём сопутствует удача."
 greeting_supplimentary.positive.flattery_chinese.1: "Да благословят вас Небеса."
 greeting_supplimentary.positive.flattery_chinese.2: "Пусть ваши земли процветают вовеки веков."
 greeting_supplimentary.positive.flattery_chinese.3: "Да будет ваше правление долгим и мудрым."
 greeting_supplimentary.positive.flattery_norse.1: "Да ниспошлют вам боги попутный ветер и большое стадо."
 greeting_supplimentary.positive.flattery_byzantine.1: "Пусть слава Города озарит ваш дом."
 greeting_supplimentary.positive.flattery_jewish.1: "Да подарит Всевышний мир вашему дому."
 greeting_supplimentary.positive.flattery.12: "Ваша мудрость освещает путь тех, кто ищет совета."
 greeting_supplimentary.positive.flattery.13: "Пусть Небеса всегда будут к вам благосклонны."
