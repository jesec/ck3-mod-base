l_russian:
 msg_passive_learned_tenet_abroad_desc: "Наблюдая за тем, как [passive_learn_source.GetTitledFirstName] практикует обряды #L [passive_learn_source.GetRite.GetName|l]ого#! [Concept('rite', 'течения')|E] во владении [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], вы получили [Concept('agnostic_knowledge', 'знание')|E] о [Concept('core_tenet', 'догмате')|E] «[passive_learn_tenet.GetBaseName]»."
 msg_passive_learned_doctrine_abroad_desc: "Наблюдая за тем, как [passive_learn_source.GetTitledFirstName] практикует обряды #L [passive_learn_source.GetRite.GetName|l]ого#! [Concept('rite', 'течения')|E] во владении [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], вы получили [Concept('agnostic_knowledge', 'знание')|E] о [Concept('doctrine', 'доктрине')|E] «[passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]»."
 msg_passive_learned_rite_abroad_desc: "[passive_learn_source.GetTitledFirstNameNoTooltip] [Select_CString(passive_learn_source.IsFemale, 'стала', 'стал' )] для вас источником [Concept('agnostic_knowledge', 'знания')|E] о [Concept('core_tenets', 'догматах')|E] и [Concept('doctrines', 'доктринах')|E] #L [passive_learn_source.GetRite.GetName|l]ого#! [Concept('rite', 'течения')|E]."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "Во владении [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] вы получили [Concept('agnostic_knowledge', 'знание')|E] о [Concept('core_tenet', 'догмате')|E] «[passive_learn_tenet.GetBaseName]» #L [passive_learn_rite.GetName|l]ого#! [Concept('rite', 'течения')|E]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "Во владении [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] вы получили [Concept('agnostic_knowledge', 'знание')|E] о [Concept('doctrine', 'доктрине')|E] «[passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )]» #L [passive_learn_rite.GetName|l]ого#! [Concept('rite', 'течения')|E]."
 rite_travel_events.1000.t: "Путешествующий [passive_learn_rite.GetAdherentNameNoTooltip|l]"
 rite_travel_events.1000.desc: "Наступают сумерки, и к нашему костру присаживается путешествующий [passive_learn_rite.GetAdherentName|l].\n\nТемнеет, [passive_learn_source.Custom('RegionalDrink')] и [passive_learn_source.Custom('RegionalEdibleMeat')] переходят из рук в руки, а мы делимся историями. [Select_CString(passive_learn_source.IsFemale, 'Она', 'Он' )] рассказывает о священных знаниях своего народа; о том, как живут по [passive_learn_rite.GetNameNoTooltip|l]ому обряду. Каждое слово пропитано убеждённостью."
 rite_travel_events.1000.a: "Крайне познавательно."
 rite_travel_events.1000.b: "Пусть присоединится ко мне."
 rite_travel_events.1000.c: "Не собираюсь слушать подобную ересь."
 rite_travel_events.2000.t: "Откровение"
 rite_travel_events.2000.desc: "Вокруг [location.GetTerrain.GetNameNoTooltip|l] владения [location.GetName], и я замечаю собравшуюся толпу.\n\n[Select_CString(passive_learn_source.IsFemale, 'Проповедница', 'Проповедник' )] рассказывает о традиции, известной как [passive_learn_tenet.GetBaseName|l]. Раньше мне не доводилось слышать о подобном, но [Select_CString(passive_learn_source.IsFemale, 'её', 'его' )] слова трогают меня до глубины души.\n\nМне бы пройти мимо. Но вместо этого я слушаю.\n\nЭто… Это истина."
 rite_travel_events.2000.a: "Такова воля [ROOT.Char.GetFaith.HighGodNamePossessive]."
 rite_travel_events.2000.b: "Я не впаду в язычество!"
