l_russian:
 ep1_notifications.0011.t: "Изменение придворного языка"
 ep1_notifications.0011.desc: "Наш [Concept('court_language', 'придворный язык')|E] изменён на [target_character.GetCourtLanguage.GetName|l]. Пусть величие нашего двора растёт!"
 ep1_notifications.0012.t: "Отказ от придворного языка"
 ep1_notifications.0012.desc: "[target_character.GetShortUIName] и [Select_CString(target_character.IsFemale, 'её', 'его' )] двор теперь используют не [observer.GetCourtLanguage.GetName|l], а [target_character.GetCourtLanguage.GetName|l] в качестве [Concept('court_language', 'придворного языка')|E]. Пусть это решение приведёт их к краху!"
 ep1_notifications.0013.t: "Принятие придворного языка"
 ep1_notifications.0013.desc: "[target_character.GetShortUIName] и [Select_CString(target_character.IsFemale, 'её', 'его' )] двор теперь используют [target_character.GetCourtLanguage.GetName|l] в качестве [Concept('court_language', 'придворного языка')|E]. Мудрое решение!"
