l_russian:
 ecumenical_council_events.0001: "Собор во владении [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "[ROOT.Char.GetFaith.HouseOfWorshipPlural] во владении [my_location.GetBaronyNameExplicitly] ярко украсили по этому светлому случаю. Лучшие представители христианского мира отозвались"
 ecumenical_council_events.0001.host: "на мой призыв."
 ecumenical_council_events.0001.dislikes_host: "на призыв, который [Select_CString(host.IsFemale, 'подала', 'подал' )] [Select_CString(host.IsFemale, 'эта', 'этот' )] [host.Custom('InsultAdjective')|l][Select_CString(host.IsFemale, 'ая', 'ый' )] [host.GetTitledFirstName|l]."
 ecumenical_council_events.0001.likes_host: "на призыв, который [Select_CString(host.IsFemale, 'подала', 'подал' )] [Select_CString(host.IsFemale, 'эта', 'этот' )] [host.Custom('ComplimentAdjective')|l][Select_CString(host.IsFemale, 'ая', 'ый' )] [host.GetTitledFirstName|l]."
 ecumenical_council_events.0001.neutral: "на призыв, который [Select_CString(host.IsFemale, 'подала', 'подал' )] [host.GetTitledFirstName|l]."
 ecumenical_council_events.0001.intent_arrived: "\n\nИ я сразу же вижу, что среди присутствующих есть и [intent_target.GetTitledFirstName|l]. Замечательно!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nВот-вот появится [intent_target.GetTitledFirstName|l], достаточно лишь немного подождать…"
 ecumenical_council_events.0001.no_intent_target: "\n\nДостаточно лишь подождать приезда!"
 ecumenical_council_events.0001.a.bad: "Если так надо."
 ecumenical_council_events.0001.a.good: "Святость — наш долг."
 ecumenical_council_events.0002.t: "Призыв"
 ecumenical_council_events.0002.desc_intro: "[host.GetFaith.HouseOfWorship|U] готовится растворить свои двери, и теперь ничто не мешает началу великого труда. Самое время заключать союзы"
 ecumenical_council_events.0002.reformist: "между всеми — и королями, и священниками."
 ecumenical_council_events.schism_crisis_intro: "\n\nНесмотря на тёплые приветствия, молчание между ними красноречивее любых слов. Рим и Константинополь больше не обмениваются любезностями, и любая незабытая обида создаёт ещё одну трещину в Теле Христа."
 ecumenical_council_events.0002.first_tenet: "\n\nВоздух гудит от разговоров. Собравшиеся делают первые шаги: готовятся высказывать свои мнения относительно такого важного вопроса, как [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )|l], и многих других."
 ecumenical_council_events.0002.host: "\n\nЯ широко раскрываю объятия и приглашаю своих детей совместно взяться за это грандиозное предприятие."
 ecumenical_council_events.0002.guest: "\n\n«Добро пожаловать, дети мои. Да наставит нас Господь на пути к решению этой труднейшей задачи!» — с этими словами [host.GetTitledFirstName|l] подзывает нас."
 ecumenical_council_events.0002.a: "Аминь."
 ecumenical_council_events.0010.t: "Наше мнение по вопросу «[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]»"
 ecumenical_council_events.0010.desc.intro: "Предмет первых дебатов — [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )|l]. В рамках действующего канонического закона считается, что это — [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.GetTitledFirstName] помогает собравшимся начать:\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n«Всё больше людей считает, что это — фундаментальная часть их верований», — сообщает [Select_CString(court_chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n«Запрет исповедовать то или иное верование всегда сопряжён с риском, однако в этом случае он более чем оправдан», — успокоительно произносит [Select_CString(court_chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n«Многие до сих пор исповедуют этот обряд. Осудить его — это значит пойти на определённый риск», — с некоторой тревогой говорит [Select_CString(court_chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n«Народ вскоре позабудет про этот обряд. Самое время перестать его поддерживать», — советует [Select_CString(court_chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n«Народ всё чаще совершает этот обряд. Будет разумно задуматься о его поддержке», — предлагает [Select_CString(court_chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n«Этот обряд мало кому известен. Поддерживать его — опасное дело», — предупреждает [Select_CString(court_chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.fallback.explanation: "«Это учение ещё не успело как следует укрепиться в нашей конфессии. Сегодняшнему собору предстоит взвесить все „за“ и „против“»."
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "«Нас спрашивают о поддержании мира [ROOT.Char.GetFaith.HighGodNamePossessive]. Должен ли народ принести клятву щадить церкви, священнослужителей и безоружных в часы грабежа и кровопролития? Можем ли мы сделать так, чтобы никто не брал в руки оружия в дни священных праздников под страхом отлучения от #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви?»"
 ecumenical_council_events.0010.desc.dulia.explanation: "«Нас спрашивают о глубоком почитании святых. Может ли народ считать их мощи священными, отмечать дни памяти и обращаться к святым за заступничеством, но поклоняться при этом только лику [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "«Нас спрашивают: действительно ли при освящении хлеба и вина на алтаре они становятся плотью и кровью Христа?»"
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "«Нас спрашивают: должны ли в духовной жизни сочетаться молитва и работа? Стоит ли считать лень проклятием души? Достоин ли труд в полях или скрипториях того же почитания, что и [ROOT.Char.Custom('GetReligiousRite')]?»"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "«Нас спрашивают, достойна ли Богородица Дева Мария наибольшего почитания среди всех святых»."
 ecumenical_council_events.0010.desc.simony.explanation: "«Нас спрашивают, можно ли священные должности, благословения или священнодействия покупать и продавать за золото»."
 ecumenical_council_events.0010.desc.monophysitism.explanation: "«Нас спрашивают, едина ли природа Христа, поглощено ли его человеческое начало так, что в Слове, ставшем плотию, осталось только божественное»."
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "«Нас спрашивают, должна ли #L [ROOT.Char.GetFaith.GetName|l]ая#! церковь жить так, как предписано в „Деяниях святых апостолов“. Должны ли мы наказать нашим миссионерам нести Слово блуждающим во тьме так, как это делали апостолы?»"
 ecumenical_council_events.0010.desc.purgatory.explanation: "«Нас спрашивают, очищаются ли после смерти души ещё не проклятые, но всё-таки согрешившие при жизни. Могут ли молитвы и обряды, совершаемые живыми, помочь мёртвым предстать перед ликом [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "«Нас спрашивают, считается ли произведение на свет детей священным бременем. Стоит ли верующим наполнять мир своими отпрысками?»"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "«Нас спрашивают, действительно ли власть епископов передаётся им ввиду происхождения их напрямую от апостолов»."
 ecumenical_council_events.0010.desc.confession.explanation: "«Нас спрашивают, должен ли каждый [ROOT.Char.GetFaith.GetAdherentName|l] каяться в грехах перед священником, чтобы добиться отпущения. Стоит ли хранить тайну исповеди за семью печатями?»"
 ecumenical_council_events.0010.desc.original_sin.explanation: "«Нас спрашивают, действительно ли каждая душа с рождения несёт на себе грех Адама. Запятнаны ли мы грехом уже от рождения и нуждаемся ли поэтому в благодати крещения?»"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "«Нас спрашивают, действительно ли святые ангелы занимают иерархию в царстве [ROOT.Char.GetFaith.HighGodNamePossessive], один над другим? Должна ли иерархия #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви отражать небесный порядок?»"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "«Нас спрашивают, стоит ли верующим становиться воинами Христа. Обязаны ли мы браться за меч и защищать #L [ROOT.Char.GetFaith.GetName|l]ую#! церковь, если нас призовут?»"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "«Нас спрашивают, может ли вера стремиться к постижению через разум. Следует ли школам прибегать к диалектике и философии для упорядочивания и отстаивания вероучения?»"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "«Нас спрашивают, является ли Христос в своём человеческом естестве сыном [ROOT.Char.GetFaith.HighGodNamePossessive] по усыновлению»."
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "«Нас спрашивают, обязан ли каждый [ROOT.Char.GetFaith.GetAdherentName|l] любить ближнего своего, даже чужака или врага, чтобы такое чувство было мерилом любви в отношении [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "«Нас спрашивают, действительно ли [ROOT.Char.Custom('GetReligiousRite')|l] и все сопутствующие песнопения, воскурения и обряды — главный путь, способствующий сближению верующих и [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "«Нас спрашивают, соединены ли во Христе божественное и человеческое естества в одной воплощённой природе — нераздельной и без смешения»."
 ecumenical_council_events.0010.desc.hesychasm.explanation: "«Нас спрашивают, могут ли святое безмолвие и простая молитва, повторяемая безустанно, даровать душе созерцание нетварного света [ROOT.Char.GetFaith.HighGodNamePossessive|U]»."
 ecumenical_council_events.0010.desc.anachoresis.explanation: "«Нас спрашивают, свято ли отречение от мира. Действительно ли отшельничество — истинный путь к царству [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "«Нас спрашивают, обогащается ли дух, когда тело подвергается суровым испытаниям: посту, власянице и бичу»."
 ecumenical_council_events.0010.desc.holy_myron.explanation: "«Нас спрашивают, должно ли святое [Glossary( 'миро', 'CHRISM_GLOSS' )], дар Святого Духа, венчать крещение и коронацию»."
 CHRISM_GLOSS: "В переводе с греческого — «умащение». #bold Миро#! — священное благоухающее масло, которым епископ помазывает человека при крещении и таинствах, а иногда — и во время коронации."
 ecumenical_council_events.0010.desc.khachkar.explanation: "«Нас спрашивают, могут ли высеченные из камня кресты быть вечными и зримыми символами веры, отмечающими святые места и могилы усопших»."
 ecumenical_council_events.0010.desc.philanthropia.explanation: "«Нас спрашивают, является ли забота о неимущих непреложным долгом #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви. Стоит ли нам собирать пожертвования и содержать больницы и дома милосердия?»"
 ecumenical_council_events.0010.desc.aniconism.explanation: "«Нас спрашивают, стоит ли изъять из церквей все сакральные изображения. Является ли их почитание на самом деле идолопоклонничеством, поклонением земным образам, отвлекающим наши взоры и мысли от [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "«Нас спрашивают, следует ли искать в Священном Писании сокрытые духовные смыслы. Может ли знание греческого языка и аллегорическое толкование открыть знания, таящиеся между строк?»"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "«Нас спрашивают, является ли крестовый поход во имя святой цели проявлением преданности Христу. Может ли меч защищать паломников и возвращать земли, находящиеся в руках безбожников?»"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "«Нас спрашивают, приближают ли плотские удовольствия душу к божественному. Следует ли чтить желания плоти и поощрять их, а не сторониться как греха?»"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "«Нас спрашивают, едины ли вера и народность у всех, кто славит [ROOT.Char.GetFaith.HighGodNamePossessive]. Должны ли чужаки оставаться вне истинной паствы?»"
 ecumenical_council_events.0010.desc.communion.explanation: "«Нас спрашивают, помогают ли общие священные обряды призвать [ROOT.Char.GetFaith.HighGodNamePossessive]. Нужно ли считать тех, кто в них не участвует, не принадлежащими к истинной пастве?»"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "«Нас спрашивают, может ли очищение души перед смертью смыть с неё всякий грех, и должен ли очистившийся после этого отказаться от пищи и самой жизни, чтобы грех не вернулся»."
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "«Нас спрашивают, должны ли браки заключаться только внутри священного рода — и даже между родственниками, чьё близкое родство #L [ROOT.Char.GetFaith.GetName|l]ая#! церковь сочла бы запретным»."
 ecumenical_council_events.0010.desc.gnosticism.explanation: "«Нас спрашивают, заключается ли спасение в сокровенном знании, доступном лишь посвящённым; в знании, которое высвобождает божественную искру и возвращает её к своему источнику»."
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "«Нас спрашивают, должны ли монахи не владеть никаким имуществом. Следует ли им странствовать между городами, прося милостыню и проповедуя слово [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.pacifism.explanation: "«Нас спрашивают, может ли [ROOT.Char.GetFaith.GetAdherentName|l] найти в жизни место войне. Ложна ли сама идея справедливой войны?»"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "«Нас спрашивают, должна ли #L [ROOT.Char.GetFaith.GetName|l]ая#! церковь управляться коллегиально, пятью патриаршими престолами. Не нарушает ли это первенство главного заступника перед ликом [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "«Нас спрашивают, следует ли хранить веру перед лицом гонений, трудностей и сомнений. Обязаны ли мы сохранять твёрдость духа, чего бы это ни стоило?»"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "«Нас спрашивают, не лучше ли служить во имя [ROOT.Char.GetFaith.HighGodNamePossessive], дав обет бедности, как это сделали апостолы»."
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "«Нас спрашивают, следует ли оставить паству в покое, позволив ей жить по своим обычаям. Должна ли #L [ROOT.Char.GetFaith.GetName|l]ая#! церковь избегать вмешательства в дела чужих и не допускать вмешательств с их стороны?»"
 ecumenical_council_events.0010.desc.adaptive.explanation: "«Нас спрашивают, не вредит ли пастве требование всем без исключения подчиняться нашим обычаям и ограничениям. Покуда сущность веры остаётся неизменной, возможно ли приспосабливать законы к реалиям окружающего мира?»"
 ecumenical_council_events.0010.desc.esotericism.explanation: "«Нас спрашивают, сподвигают ли тайны [ROOT.Char.GetFaith.HighGodNamePossessive] к стремлению познавать окружающий нас мир»."
 ecumenical_council_events.0010.desc.legalism.explanation: "«Нас спрашивают, должна ли священная власть закона распространяться на каждый шаг в жизни исповедующих #L [ROOT.Char.GetFaith.GetName|l]ую#! веру. Стоит ли закон превыше всякого грешника, сколь бы знатным или влиятельным тот ни был?»"
 ecumenical_council_events.0010.desc.literalism.explanation: "«Нас спрашивают, считается ли Священное Писание неизменным и окончательным, будучи единственным вместилищем мудрости [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.reincarnation.explanation: "«Нас спрашивают, проживает ли душа несколько жизней, так, что суд [ROOT.Char.GetFaith.HighGodNamePossessive] проводится над ней не единожды»."
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "«Нас спрашивают, вправе ли учителя #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви выносить обязательные постановления по каждому новому вопросу веры и законов»."
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "«Нас спрашивают, должна ли жизнь каждого исповедующего #L [ROOT.Char.GetFaith.GetName|l]ую#! веру сводиться к борьбе и покорности. Следует ли верующим полностью покоряться воле [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "«Нас спрашивают, может ли добрый [ROOT.Char.GetFaith.GetAdherentName|l], подвергающийся гонениям, солгать, что исповедует другую веру»."
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "«Нас спрашивают, могут ли неверующие оставаться под властью #L [ROOT.Char.GetFaith.GetName|l]ого#! владыки, если будут выплачивать налог в обмен на защиту»."
 ecumenical_council_events.0010.desc.asceticism.explanation: "«Нас спрашивают, можно ли постичь [ROOT.Char.GetFaith.HighGodNamePossessive] путём голода, лишений и жизни в неудобстве»."
 ecumenical_council_events.0010.desc.bhakti.explanation: "«Нас спрашивают, должна ли каждая душа с любовью и преданностью посвятить себя одному из проявлений божественного»."
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "«Нас спрашивают, запрещено ли причинять вред любому живому существу. Нужно ли стараться не навредить даже низшим созданиям и насекомым?»"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "«Нас спрашивают, можно ли постичь [ROOT.Char.GetFaith.HighGodNamePossessive|l] преимущественно путём размышления и познания себя»."
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "«Нас спрашивают, обязывает ли нас священный долг приглашать к столу даже незнакомцев»."
 ecumenical_council_events.0010.desc.adorcism.explanation: "«Нас спрашивают, следует ли почитать и приветствовать духов этого мира, чтобы они помогали нам, а не изгонять их как нечистую силу»."
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "«Нас спрашивают, следует ли совершать подношения нашим предкам и чтить их молитвами, чтобы они оберегали и направляли нас на пути»."
 ecumenical_council_events.0010.desc.astrology.explanation: "«Нас спрашивают, можно ли прочесть по звёздам волю [ROOT.Char.GetFaith.HighGodNamePossessive]. Не таят ли небеса тайны наших судеб?»"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "«Нас спрашивают, является ли удовольствие даром, к которому нужно стремиться как к разновидности поклонения»."
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "«Нас спрашивают, можно ли приносить человеческую жизнь в жертву на алтаре. Стоит ли проливать кровь ради [ROOT.Char.GetFaith.HighGodNamePossessive] и считать это священным подношением?»"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "«Нас спрашивают, обладают ли некоторые души от рождения сакральной силой, не призваны ли они главенствовать над верующими ещё до помазания в #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви?»"
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "«Нас спрашивают, должен ли календарь #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви изобиловать священными празднествами, служащими сплочению верующих»."
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "«Нас спрашивают, следует ли готовиться к родам с помощью священных обрядов. Должно ли место рождения ребёнка быть очищено от скверны, чтобы на мать и дитя снизошло благословение [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "«Нас спрашивают, считать ли священными каждую густую рощу, стремительную речку и орошённую дождём долину. Не на природе ли следует стремиться к постижению [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "«Нас спрашивают, не стоит ли начать молиться непосредственно солнцу. Можно ли считать, что это дарующее жизнь светило для нас — [ROOT.Char.GetFaith.HighGodName]?»"
 ecumenical_council_events.0010.desc.warmonger.explanation: "«Нас спрашивают, стоит ли войну и завоевания считать службой правому делу. Является ли меч самым надёжным способом распространять слово [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "«Нас спрашивают, стоит ли в священные дни устраивать жестокие и кровавые зрелища. Можно ли назвать такое разгулье истинным поклонением перед ликом [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "«Нас спрашивают, святы ли горные вершины и земные корни. Следует ли нам искать [ROOT.Char.GetFaith.HighGodNamePossessive] в горах и на потаённых тропах?»"
 ecumenical_council_events.0010.desc.household_gods.explanation: "«Нас спрашивают, могут ли семейства, исповедующие #L [ROOT.Char.GetFaith.GetName|l]ую#! веру, почитать одновременно богов домашнего очага»."
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "«Нас спрашивают, можно ли внедрить в нашу веру обряды и каноны с далёкого Востока»."
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "«Нас спрашивают, можем ли мы перенять что-либо у учений с Востока — места, где люди живут бок о бок, не объявляя друг друга злом, пусть даже мы не почитаем их богов»."
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "«Нас спрашивают, можно ли разрешить новообращённым сохранять их старые народные обычаи — не отвергать и не осуждать их, а перенимать из них полезное»."
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "«Нас спрашивают, могут ли те, кто не следует за Христом, всё же чтить Его учение и пример, не признавая Его истинным Богом»."
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "«Нас спрашивают, можно ли внедрить законы сарацинов в канон #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви и объединить их учения с Евангелием»."
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "«Нас спрашивают, следует ли #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви принять законы и учения иудеев, даже если мы не разделяем всех их убеждений»."
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "«Нас спрашивают, является ли боль сама по себе священной. Является ли причинение боли благословением, а принятие её — благодатью от [ROOT.Char.GetFaith.HighGodName|U]?»"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "«Нас спрашивают, заключается ли святость в том, чтобы покидать города и жить в дикой природе; в возвращении к первозданному состоянию бытия»."
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "«Нас спрашивают, является ли власть над всем миром живого священной целью. Исполнит ли волю [ROOT.Char.GetFaith.HighGodNamePossessive] обретение власти?»"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "«Нас спрашивают, можно ли вкушать плоть умерших в качестве священного обряда»."
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "«Нас спрашивают, может ли существовать святой обман. Вправе ли верующие лгать и даже верить в собственную ложь, если истина способна подвергнуть веру опасности?»"
 ecumenical_council_events.0010.desc.polyamory.explanation: "«Нас спрашивают, могут ли верующие дарить свою любовь сразу многим и отвергать представления о том, что одна душа вправе целиком претендовать на любовь другой»."
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "«Нас спрашивают, можно ли приносить в жертву человеческую жизнь во время священного обряда. Может ли человек добровольно отдавать себя в жертву, а виновные — приноситься в жертву против воли на алтарях #L [ROOT.Char.GetFaith.GetName|l]ой#! церкви?»"
 ecumenical_council_events.0010.desc.megaliths.explanation: "«Нас спрашивают, следует ли воздвигать великие каменные памятники во славу [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "«Нас спрашивают, должны ли верующие владеть всем имуществом сообща»."
 ecumenical_council_events.0010.desc.pure_land.explanation: "«Нас спрашивают, возможно ли достичь блаженного царства, где нет страданий, одной лишь верой и преданностью, а не богатством, учёностью или знанием обрядов?»"
 ecumenical_council_events.0010.desc.no_mind.explanation: "«Нас спрашивают, можно ли постичь [ROOT.Char.GetFaith.HighGodNamePossessive] путём освобождения разума от мыслей и погружения в безмолвие собственного „я“?»"
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "«Нас спрашивают, действительно ли высокие горы столь возвышенны и святы. Правда ли искать [ROOT.Char.GetFaith.HighGodNamePossessive] лучше всего на вершинах?»"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "«Нас спрашивают, не наступают ли тёмные века, не ходят ли среди нас демоны, принявшие благочестивое обличье. Должны ли мы убивать врагов приходящего в упадок священного закона?»"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "«Нас спрашивают, следует ли забирать головы убитых в качестве священных трофеев»."
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "«Нас спрашивают, является ли стремление к знаниям священным долгом»."
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "«Нас спрашивают, является ли справедливое правление священным долгом, которому должны следовать всякие исповедующие #L [ROOT.Char.GetFaith.GetName|l]ую#! веру владыки»."
 ecumenical_council_events.0010.desc.filial_piety.explanation: "«Нас спрашивают, есть ли в заповедях [ROOT.Char.GetFaith.HighGodNamePossessive] завет почитать своих родителей и старших»."
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "«Нас спрашивают, лежит ли в основе #L [ROOT.Char.GetFaith.GetName|l]ого#! миропорядка общественное согласие, при котором каждый занимает своё место»."
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "«Нас спрашивают, может ли разрушение само по себе быть священным? Следует ли разрушать старое, чтобы исполнить волю [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 ecumenical_council_events.0010.desc.preservation.explanation: "«Нас спрашивают, заключается ли святость в созидании и сохранении уже построенного? Должны ли мы оберегать храмы и строения #L [ROOT.Char.GetFaith.GetName|l]ой#! веры, чтобы они процветали и впредь?»"
 ecumenical_council_events.0010.desc.takamin.explanation: "«Нас спрашивают, является ли могучий медведь сосудом, содержащим божественное? Должны ли охотники считать этого зверя священным и убивать его исключительно с благоговением?»"
 ecumenical_council_events.0010.a_1: "Пусть заменит течение «[current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]»."
 ecumenical_council_events.0010.a_2: "Я исключу течение «[current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]», чтобы остальным стало свободнее."
 ecumenical_council_events.0010.a_3: "Течение «[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]» должно исчезнуть."
 ecumenical_council_events.0010.b: "Эту практику нужно запретить!"
 ecumenical_council_events.0010.c: "Пока что разрешу соблюдение."
 ecumenical_council_events.0010.d: "Нужно по крайней мере признать этот догмат."
 ecumenical_council_events.0011.t: "$ecumenical_council_events.0010.t$"
 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$"
 ecumenical_council_events.0011.desc.outro: "[Select_CString(host.IsFemale, 'Принимающая', 'Принимающий' )] нас [host.GetTitledFirstName|l] провозглашает:\n\n«Моё предложение таково: пусть течение, именуемое „[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]“, будет"
 ecumenical_council_events.0011.desc.permit: "разрешено»."
 ecumenical_council_events.0011.desc.prohibit: "запрещено»."
 ecumenical_council_events.0011.desc.learn: "известно другим»."
 ecumenical_council_events.0011.desc.make_core: "главенствующим, а [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )|l] уйдёт в прошлое»."
 ecumenical_council_events.0011.a: "Я голосую за смену."
 ecumenical_council_events.0011.b: "Я против."
