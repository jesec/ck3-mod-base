 # ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "Престарелые ворчуны"
 ecumenical_council_events.0111.desc: "Неподалёку бездельно бродит кучка седовласых старцев; больше всего на свете их увлекает перебранка.\n\n«Сколько на нашей памяти было соборов, и сколько из них решали так, что лучше бы не собирались вообще! А вместо того чтобы прекратить эти безобразия, они опять собираются что-то решать!» — жалуется [lead_conservative.GetTitledFirstName|l].\n\n«Молчи, [lead_conservative.Custom('RegionalFarmAnimal')]! Ты, похоже, жаловаться перестанешь только когда ляжешь в гроб!» — огрызается в ответ [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0111.support: "В этот раз мы исправим ошибки прошлого!"
 ecumenical_council_events.0111.support_duel: "Выдвинуть старикам доводы в пользу новых решений."
 ecumenical_council_events.0111.support_duel.success: "Они с неохотой соглашаются"
 ecumenical_council_events.0111.support_duel.success_halved: "Некоторые соглашаются"
 ecumenical_council_events.0111.support_duel.failure: "Они продолжают считать, что на соборах творится безобразие"
 ecumenical_council_events.0111.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] говорит правду, надо [Select_CString(lead_conservative.IsFemale, 'её', 'его')] поддержать: хватит с нас ошибок."
 ecumenical_council_events.0111.oppose_duel: "Раздавить стариков силой интеллекта!"
 ecumenical_council_events.0111.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0111.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
