 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]ий дух"
 ecumenical_council_events.0105.desc: "Из множества звучащих здесь языков неожиданно пробиваются знакомые #L [ROOT.Char.GetCulture.GetLanguage.GetCollectiveNoun|l]ие#! слова — это, разумеется, [lead_conservative.GetTitledFirstName|l] докучает нашим родственникам.\n\n«Такие новшества — это не по-нашему, не по-[lead_conservative.GetCulture.GetCollectiveNounNoTooltip|l]и! — настаивает [Select_CString(lead_conservative.IsFemale, 'она', 'он')]».\n\n«Вы бы предпочли, чтобы нас обвинили в том, что церковь пребывает в застое?» — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0105.support: "Вам не давали права говорить за нас всех, [lead_conservative.GetFirstNameNoTooltip]."
 ecumenical_council_events.0105.support_duel: "[lead_conservative.GetCulture.GetCollectiveNounNoTooltip]ий народ славится своей тягой к новшествам."
 ecumenical_council_events.0105.support_duel.success: "Все присутствующие согласились проголосовать за"
