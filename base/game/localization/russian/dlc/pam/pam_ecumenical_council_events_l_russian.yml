 ecumenical_council_events.0101.t: "Речи учёных"
 ecumenical_council_events.0101.desc: "Учёные ведут напряжённый спор, ссылаясь то на один, то на другой стих.\n\n«[lead_conservative.GetFaith.ReligiousText|U] — книга, которая не может врать! — утверждает [lead_conservative.GetTitledFirstName|l]. — Пусть [ec_current_topic.GetName( activity.GetHost.GetRite )|l] остаётся как есть, ни к чему всё менять».\n\n«А вы почитайте, что я вам цитирую! — отвечает [lead_innovator.GetTitledFirstName|l]. — Тогда поймёте, что перемены просятся сами собой!»."
 ecumenical_council_events.0101.support: "Указать, что отрывку недостаёт контекста."
 ecumenical_council_events.0101.support_duel: "Переспорить их, полагаясь на собственные знания."
 ecumenical_council_events.0101.support_duel.success: "Они принимают перемены, возникшие благодаря тексту"
 ecumenical_council_events.0101.support_duel.success_halved: "Возникшие благодаря тексту перемены принимают немногие"
 ecumenical_council_events.0101.support_duel.failure: "Они продолжают утверждать, что текст — это довод против"
 ecumenical_council_events.0101.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] говорит верно: пусть текст остаётся неизменным."
 ecumenical_council_events.0101.oppose_duel: "Поспорить с тем, что перемены возникли благодаря тексту."
 ecumenical_council_events.0101.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0101.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0101.oppose_duel.failure: "Их толкование отрывка остаётся неизменным"
