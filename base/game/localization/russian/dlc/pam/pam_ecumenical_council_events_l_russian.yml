 ecumenical_council_events.0107.t: "Первый собор"
 ecumenical_council_events.0107.desc: "Кучка юных священнослужителей возбуждённо перешёптывается между собой: для многих из них этот собор — первый в их жизни.\n\n«На наших глазах зарождается новое движение! Волею [lead_innovator.GetFaith.HouseholdGodNamePossessive] призываю вас: оставим же свой след в истории церкви, проявим давно забытую смелость!» — произносит [lead_innovator.GetTitledFirstName|l].\n\n«Презренные болваны! Нам следует во всём слушаться отцов церкви, а всякие новшества — от лукавого!» — настаивает в свою очередь [lead_conservative.GetTitledFirstName|l]."
 ecumenical_council_events.0107.support: "Для веры наступает новый рассвет!"
 ecumenical_council_events.0107.support_duel: "Парировать это трусливое консерваторское заявление."
 ecumenical_council_events.0107.support_duel.success: "Их глаза загораются: перспективы манят"
 ecumenical_council_events.0107.support_duel.success_halved: "Некоторые из них обещают поддержку"
 ecumenical_council_events.0107.support_duel.failure: "Они всё так же презрительны"
 ecumenical_council_events.0107.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] говорит верно."
 ecumenical_council_events.0107.oppose_duel: "Осудить подобную дерзость: она попросту опасна."
 ecumenical_council_events.0107.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0107.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0107.oppose_duel.failure: "Они презирают вас за трусость"
