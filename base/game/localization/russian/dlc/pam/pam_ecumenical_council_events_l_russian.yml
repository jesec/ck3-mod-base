 ecumenical_council_debate_outcome_log: "Собор принял следующее решение:"
 ecumenical_council_proposal_set_log_title: "Предложение собора"
 ecumenical_council_proposal_set_log: "На обсуждение собора было выдвинуто предложение:[CHARACTER.GetInvolvedActivity.Custom('GetEcumenicalCouncilProposalSetLog')]"
 msg_ecumenical_council_ruling_title: "Вселенский собор вынес вердикт"
 msg_ecumenical_council_ruling_desc: "[LEFT_CHARACTER.GetTitledFirstName] [Select_CString(LEFT_CHARACTER.IsFemale, 'собрала', 'собрал' )] [Concept('ecumenical_council', 'вселенский собор')|E], и теперь его решения обязательны для всех последователей #L [GetPlayer.GetFaith.GetName|l]ого#! учения — как присутствовавших, так и отсутствовавших"
 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "Голосование собора"
 ecumenical_council_events.0081.desc.innovator_passed: "Мы выступали за перемены и добились своего: наши доводы убедили большую часть присутствующих принять наше предложение."
 ecumenical_council_events.0081.desc.innovator_failed: "К сожалению, собор отклонил наше предложение за нехваткой голосов. В этот раз старые традиции оказались крепче наших аргументов."
 ecumenical_council_events.0081.desc.conservative_passed: "Мы отчаянно отстаивали свои традиции, но предложение реформаторов всё же набрало достаточно голосов. Похоже, теперь нашу веру ждут сомнительные перемены."
 ecumenical_council_events.0081.desc.conservative_failed: "Нам удалось сберечь свои традиции: присутствующие выступили против изменений, а значит, наше течение сохранит свою чистоту."
 ecumenical_council_events.0081.desc.neutral: "Собор выносит свой окончательный вердикт и закрывает обсуждение."
 ecumenical_council_events.0081.a: "Значит, вопрос решён."
 # The court chaplain's report of a council their liege did not attend
 ecumenical_council_events.0082.opening: "[ROOT.GetCharacter.GetTitledFirstName]!"
 ecumenical_council_events.0082.desc: "Духовенство сказало своё слово. Вынесенный в ваше отсутствие вердикт обязателен для нас, и не важно, высказывались мы или нет."
 ecumenical_council_events.0082.desc.unchanged: "Духовенство сказало своё слово, и все их пререкания ничего не изменили. Мы остались при своём."
 ecumenical_council_events.0082.a: "Церковь развивается без меня."
