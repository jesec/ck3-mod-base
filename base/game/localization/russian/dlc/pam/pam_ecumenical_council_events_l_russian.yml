 ecumenical_council_events.0129.t: "Царство страха"
 ecumenical_council_events.0129.desc: "Самые малодушные из собравшихся наблюдают за спорами с широко раскрытыми глазами, дрожа, словно осиновый лист. [lead_conservative.GetTitledFirstName] же настолько [Select_CString(lead_conservative.IsFemale, 'ничтожна', 'ничтожен')], что боится даже моего взгляда.\n\n«Говори, — шепчет [Select_CString(lead_conservative.IsFemale, 'она', 'он')]. — Я ведь знаю, что будет, если отказаться»."
 ecumenical_council_events.0129.support: "Жестокость никогда меня не подводила."
 ecumenical_council_events.0129.support_duel: "Надо удостовериться, что и остальные это понимают."
 ecumenical_council_events.0129.support_duel.success: "Страх вынуждает их склониться перед вами"
 ecumenical_council_events.0129.support_duel.success_halved: "Мало кто подчиняется страху"
 ecumenical_council_events.0129.support_duel.failure: "На смену страху приходит неповиновение"
 ecumenical_council_events.0129.oppose: "Вот так ужас поглощает надежду."
 ecumenical_council_events.0129.oppose_duel: "Я не потерплю неповиновения."
 ecumenical_council_events.0129.oppose_duel.success: "Запуганные подчиняются"
 ecumenical_council_events.0129.oppose_duel.success_halved: "Некоторые из них подчиняются"
 ecumenical_council_events.0129.oppose_duel.failure: "На смену страху приходит неповиновение"
