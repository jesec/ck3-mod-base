 ecumenical_council_events.0120.t: "Имена в хронике"
 ecumenical_council_events.0120.desc: "Часть самых именитых гостей держится в стороне; они озабочены тем, как записанное в хрониках собора отразится на их репутации.\n\n«Моё имя есть едва ли не в каждой хронике. Я совершенно не желаю, чтобы его связывали ещё и с указом, который будут высмеивать даже потомки», — заявляет [lead_conservative.GetTitledFirstName|l].\n\n«История помнит тех, кто устанавливал мир, а не тех, кто боялся замарать руки. Меня она запомнит именно так», — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0120.support: "«Разве мы — не главы церкви?»"
 ecumenical_council_events.0120.support_duel: "«Вы не одни!»"
 ecumenical_council_events.0120.support_duel.success: "Сомневающиеся уступают ходу истории"
 ecumenical_council_events.0120.support_duel.success_halved: "Некоторые уступают ходу истории"
 ecumenical_council_events.0120.support_duel.failure: "Они продолжают избегать известности"
 ecumenical_council_events.0120.oppose: "Я отказываюсь, чтобы моё имя выставляли на посмешище."
 ecumenical_council_events.0120.oppose_duel: "«Болваны устанавливают мир тем, что навязывают другим всяческие издевательства»."
 ecumenical_council_events.0120.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0120.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0120.oppose_duel.failure: "Они не внимают вашему оскорблению"
