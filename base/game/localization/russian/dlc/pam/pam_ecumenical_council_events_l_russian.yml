 # Flavor Events
 ecumenical_council_summons_events.0001.t: "[guest_1.GetTitleAsNameNoTooltip|U] волнуется"
 ecumenical_council_summons_events.0001.desc: "«И эта беда… [guest_1.GetFaith.HighGodName] мне свидетель, она не даёт мне покоя. Я так плохо сплю…» — мучительным шёпотом рассказывает [guest_1.GetTitledFirstName|l].\n\n[Select_CString(guest_1.IsFemale, 'Её', 'Его' )] [Select_CString(guest_2.IsFemale, 'собеседница', 'собеседник' )] [guest_2.GetTitledFirstName|l] кивает: «Прекрасно понимаю. Может быть, [host.GetTitleAsNameNoTooltip|l] что-нибудь подскажет? [Select_CString(host.IsFemale, 'Она', 'Он' )] неплохо разбирается в человеческих душах»."
 ecumenical_council_summons_events.0001.a: "Что же [Select_CString(guest_1.IsFemale, 'её', 'его' )] так взволновало?.."
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Вы узнаете о секрете, который скрывает [guest_1.GetShortUIName]"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip] просто нуждается в дружеском плече."
 ecumenical_council_summons_events.0001.c: "Лучше не знать."
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'утешили', Select_CString(CHARACTER.IsFemale, 'утешила', 'утешил' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] на Вселенском соборе, узнав о переживаниях из-за скрываемого секрета."
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'утешили', Select_CString(TARGET_CHARACTER.IsFemale, 'утешила', 'утешил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] на Вселенском соборе, узнав о переживаниях из-за скрываемого секрета."
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'попались', Select_CString(CHARACTER.IsFemale, 'попалась', 'попался' ))] за попыткой выведать на Вселенском соборе, какой секрет терзает [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUINamePossessive))]."
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'поймали', Select_CString(CHARACTER.IsFemale, 'поймала', 'поймал' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] на попытке выведать [Select_CString(CHARACTER.IsFemale, 'её', 'его' )] секрет на Вселенском соборе."
 ecumenical_council_summons_events.0010.t: "Секрет"
 ecumenical_council_summons_events.0010.desc: "[Select_CString(host.IsFemale, 'Принимающая', 'Принимающий' )] нас [host.GetTitledFirstName|l], похоже, не замечает меня — [Select_CString(host.IsFemale, 'она глубоко погружена', 'он глубоко погружён' )] в свои мысли.\n\n«[host.GetFaith.HighGodName], помилуй меня… — бормочет [Select_CString(host.IsFemale, 'она', 'он' )], пока слуга поправляет [Select_CString(host.IsFemale, 'ей', 'ему' )] одеяние. — Люди распускают слухи о моих… предпочтениях. Чтобы я, [Select_CString(host.IsFemale, 'наместница', 'наместник' )] Христа, [Select_CString(host.IsFemale, 'шла', 'шёл' )] на поводу у столь пагубных склонностей!.. Нельзя, чтобы об этом прослышали кардиналы»."
 ecumenical_council_summons_events.0010.a: "«Похоже, вы в чём-то раскаиваетесь, [host.GetTitleAsNameNoTooltip|l]»."
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Вы узнаете о секрете, который скрывает [host.GetShortUIName]"
 ecumenical_council_summons_events.0010.b: "«[ROOT.Char.Custom('RandomBibleQuoteShort')]»"
 ecumenical_council_summons_events.0010.b.flavor: "Пусть найдёт утешение в Священном Писании!"
 ecumenical_council_summons_events.0010.c: "О некоторых вещах лучше не знать."
 ecumenical_council_summons_events.0020.t: "Трудности со снабжением"
 ecumenical_council_summons_events.0020.desc.intro: "«Если так надо…» — с этими словами [host.GetTitledFirstName|l] делает одному из своих священников жест, показывая, что он свободен.\n\n[Select_CString(host.IsFemale, 'Она', 'Он' )] подзывает меня: «[ROOT.Char.GetTitledFirstNameNoTooltip]!»"
 ecumenical_council_summons_events.0020.desc.caravans: "«Обозы с припасами задерживаются."
 ecumenical_council_summons_events.0020.desc.servants: "«Гостей слишком много — нам не хватает слуг."
 ecumenical_council_summons_events.0020.desc.overcrowded: "«Гостей слишком много — [ROOT.Char.GetCurrentLocation.GetName] не вместит всех прибывших на собор, их просто негде разместить."
 ecumenical_council_summons_events.0020.desc.outro: "Возможно, вы подскажете, как лучше поступить?»"
 ecumenical_council_summons_events.0020.aaa: "«Не беспокойтесь, ваше святейшество. Я наведу порядок в своих владениях»."
 ecumenical_council_summons_events.0020.aa: "#EMP Много#! кто передо мной в долгу…"
 ecumenical_council_summons_events.0020.a: "«Не беспокойтесь, ваше святейшество. Звонкая монета никогда не подводит!»"
 ecumenical_council_summons_events.0020.b: "«У меня много должников. Я обращусь сразу ко всем!»"
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName] запомнит меня как влиятельного кандидата…"
 ecumenical_council_summons_events.0020.c: "Могу предложить лишь скромную молитву…"
 ecumenical_council_summons_events.0020.papabile_tt: "Вы получаете #P +10#! к [Concept('papabile_score', 'приоритету')|E] в вопросе папской преемственности"
 ecumenical_council_summons_events.0030.t: "Во власти стихий"
 ecumenical_council_summons_events.0030.desc.intro: "Чем ближе собор, тем громче воют ветры и тем сильнее хлещет дождь."
 ecumenical_council_summons_events.0030.desc.dry_season: "Такое явление — редкость в это время года."
 ecumenical_council_summons_events.0030.desc.wet_season: "Впрочем, в это время года такие ненастья — обычное зрелище."
 ecumenical_council_summons_events.0030.desc.outro: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] сильно дрожит.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Мой господин' )]… боюсь, я не смогу быть на соборе. Холод пробрал меня до костей… Я этого не вынесу. У меня слишком много слизи…»"
 ecumenical_council_summons_events.0030.aa: "«Мне #EMP много#! доводилось читать об этом недуге!»"
 ecumenical_council_summons_events.0030.a: "Я вызову лучшего врача!"
 ecumenical_council_summons_events.0030.b: "«Я буду молиться за вас»."
 ecumenical_council_summons_events.0030.c: "Жизнь всё расставит по местам."
 ecumenical_council_summons_events.0040.t: "Страх перед публикой"
 ecumenical_council_summons_events.0040.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] нервно меряет шагами двор в ожидании скорого начала собора.\n\nЯ слышу, как [Select_CString(chaplain.IsFemale, 'она', 'он' )] бормочет себе под нос: «Разумеется, [ROOT.Char.GetFaith.ReligiousSymbol|l] — это важный вопрос, конечно, конечно… И [chaplain.CustomFixedRandom('random_learning_topic')|l] тоже заслуживает обсуждения…»"
 ecumenical_council_summons_events.0040.aa: "«Помните, [chaplain.GetFirstNameNoTooltip]: [ROOT.Char.GetFaith.KnowledgeGodName] превыше всего»."
 ecumenical_council_summons_events.0040.aa.flavor: "Возможно, духовные наставления успокоят этого человека."
 ecumenical_council_summons_events.0040.a: "Стоит [Select_CString(chaplain.IsFemale, 'ей', 'ему' )] напомнить, что [Select_CString(chaplain.IsFemale, 'она', 'он' )] представляет и меня в том числе."
 ecumenical_council_summons_events.0040.a.tt.success: "Ваша дипломатия возымела успех"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName] сомневается в ваших намерениях"
 ecumenical_council_summons_events.0040.b: "Я всегда могу воспользоваться своим положением в [Select_CString(chaplain.IsFemale, 'её', 'его' )] пользу…"
 ecumenical_council_summons_events.0040.c: "Молитва всё исправит."
 friend_reassured_at_council: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'обнадёжили', Select_CString(CHARACTER.IsFemale, 'обнадёжила', 'обнадёжил' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] на Вселенском соборе."
 friend_reassured_at_council_corresponding: "[TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'обнадёжили', Select_CString(TARGET_CHARACTER.IsFemale, 'обнадёжила', 'обнадёжил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] на Вселенском соборе."
 ecumenical_council_summons_events.0050.t: "Сомнения в вере"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName] с трудом скрывает улыбку. Очевидно, [Select_CString(pious_guest.IsFemale, 'она', 'он' )] считает, что [non_pious_guest.GetTitledFirstName|l] — презабавнейшее зрелище.\n\n«Скажите, [ROOT.Char.GetTitleAsNameNoTooltip|l], вы тоже это видите? — обращается [Select_CString(pious_guest.IsFemale, 'она', 'он')] ко мне. — Я считаю, что [non_pious_guest.GetFirstNameNoTooltip] заслуживает похвалы! Ведь мне уже начало казаться, что [Select_CString(non_pious_guest.IsFemale, 'эта женщина', 'этот человек' )] умеет заседать только в [Glossary( 'банях', 'BATHHOUSES_GLOSS' )]."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "Подумать только: [Select_CString(non_pious_guest.IsFemale, 'она', 'он' )] смеет заявлять, что [Select_CString(non_pious_guest.IsFemale, 'ей', 'ему' )] послушны все [ROOT.Char.GetFaith.GetAdherentNamePlural|l]»."
 ecumenical_council_summons_events.0050.aaa: "С этой задачей никто не справится лучше, чем [chaplain.GetTitledFirstNameNoTooltip|l]."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Даже удивительно, что [Select_CString(non_pious_guest.IsFemale, 'она соблаговолила', 'он соблаговолил' )] поучаствовать в соборе»."
 ecumenical_council_summons_events.0050.aa: "Добрый пастырь всегда происходит из своей паствы…"
 ecumenical_council_summons_events.0050.a: "«Я могу сделать так, чтобы об этом узнали #EMP все#!… Не безвозмездно, разумеется»."
 ecumenical_council_summons_events.0050.b: "«А откуда #EMP вы#! знаете, кто любит заседать в банях, [pious_guest.GetTitleAsNameNoTooltip|l]?»"
 ecumenical_council_summons_events.0050.c: "Слава тебе, [ROOT.Char.GetFaith.HighGodName], за хоть какое-то веселье."
 BATHHOUSES_GLOSS: "В Средние века считалось, что бани — рассадник разврата: в общественных купальнях было много укромных мест, где посетители могли удовлетворить стремления тела."
 friend_defended_piety_at_ec_reason: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'отстояли', Select_CString(CHARACTER.IsFemale, 'отстояла', 'отстоял' ))] благочестие [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] на Вселенском соборе."
 friend_defended_piety_at_ec_reason_corresponding: "Многие свидетели подтвердили, что [TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'отстояли', Select_CString(TARGET_CHARACTER.IsFemale, 'отстояла', 'отстоял' ))] благочестие [Select_CString(CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', CHARACTER.GetShortUIName))] на Вселенском соборе."
 rival_accused_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'обвинили', Select_CString(TARGET_CHARACTER.IsFemale, 'обвинила', 'обвинил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] в богопротивном поведении на Вселенском соборе."
 rival_accused_at_council_reason_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'подверглись', Select_CString(CHARACTER.IsFemale, 'подверглась', 'подвергся' ))] обвинениям от [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] в богопротивном поведении на Вселенском соборе."
 pam_ecumenical_council_rite_quarrel_defused_tt: "Спор улажен: #P [EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_defused_value')|0]#! прогресса в сторону [Concept('schism', 'раскола')|E]"
 pam_ecumenical_council_rite_quarrel_side_taken_tt: "Выбор стороны: #N +[EmptyScope.ScriptValue('pam_great_schism_progress_rite_quarrel_side_taken_value')|0]#! прогресса в сторону [Concept('schism', 'раскола')|E]"
