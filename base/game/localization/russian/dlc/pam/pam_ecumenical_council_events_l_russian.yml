 ecumenical_council_events.0126.t: "Среди соперников"
 ecumenical_council_events.0126.desc: "Среди собравшихся присутствует и [Select_CString(rival.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMe', rival)] [rival.GetTitledFirstName|l] — далеко не самое приятное зрелище.\n\n«Ты ведь понимаешь, что меня сюда привело? — сердито произносит [Select_CString(rival.IsFemale, 'она', 'он')]. — Говори что хочешь, выбирай кого хочешь… Я всё равно проголосую против тебя»."
 ecumenical_council_events.0126.a: "Голосовать надо умом, а не сердцем."
 ecumenical_council_events.0126.b: "Я превыше пустой злобы."
 ecumenical_council_events.0126.c: "Собор отвлёк [Select_CString(rival.IsFemale, 'её', 'его')]…"
 ecumenical_council_events.0126.c.tt: "[Concept('scheme', 'Происки')|E] будут иметь #P более высокий#! [Concept('success_chance', 'шанс успеха')|E]"
