 ecumenical_council_events.0110.t: "Безудержные устремления"
 ecumenical_council_events.0110.desc: "«Поправка совсем несущественная! — утверждает [lead_innovator.GetTitledFirstName|l]. — Зато если её примут, мы окажемся на хорошем счету, и кто-то из нас впоследствии, возможно, будет называться „[lead_innovator.GetFaith.ReligiousHeadName]“.\n\n«Ваши устремления не знают никаких границ! Вы допрыгаетесь до того, что всех нас погубите!» — язвительно отвечает [lead_conservative.GetTitledFirstName|l]."
 ecumenical_council_events.0110.support: "Нет ничего плохого в устремлениях."
 ecumenical_council_events.0110.support_duel: "Выдвинуть ещё больше аргументов в пользу поправки!"
 ecumenical_council_events.0110.support_duel.success: "Они соглашаются: поправка совсем несущественная"
 ecumenical_council_events.0110.support_duel.success_halved: "Некоторые осознают ценность этого мнения"
 ecumenical_council_events.0110.support_duel.failure: "Ваша жадность всем очевидна"
 ecumenical_council_events.0110.oppose: "Гордыня не доводит до добра"
 ecumenical_council_events.0110.oppose_duel: "Предупредить: честолюбие — это зло!"
 ecumenical_council_events.0110.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0110.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0110.oppose_duel.failure: "Они продолжают настаивать на поправке"
 ecumenical_council_events.0110.conservatives_custom: "Честолюбивые [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size]#!)"
