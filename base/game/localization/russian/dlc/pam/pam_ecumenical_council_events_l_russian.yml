 ecumenical_council_events.0104.t: "Духовенство одной крови"
 ecumenical_council_events.0104.desc: "Священнослужители из числа моих родственников обсуждают, какую сторону должен поддержать дом [ROOT.Char.GetHouse.GetName]. [lead_conservative.GetTitledFirstName] заявляет: «Нельзя, чтобы наш дом разделился. [host.GetTitledFirstName] может не ждать от меня поддержки!».\n\nДождавшись, пока [Select_CString(lead_conservative.IsFemale, 'та', 'тот')] отвернётся, [lead_innovator.GetTitledFirstName|l] делает насмешливый жест, как бы давая понять, что далеко не весь мой род противится нововведениям."
 ecumenical_council_events.0104.support: "Призвать к тому, чтобы дом [ROOT.Char.GetHouse.GetNameNoTooltip] проголосовал за."
 ecumenical_council_events.0104.support_duel: "Расположить к себе противников инноваций."
