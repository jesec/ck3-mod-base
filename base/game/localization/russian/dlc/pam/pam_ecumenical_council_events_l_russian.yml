 ecumenical_council_events.0021.desc.intro: "$ecumenical_council_events.0020.desc.intro$"
 ecumenical_council_events.0021.desc.outro: "[Select_CString(host.IsFemale, 'Принимающая', 'Принимающий' )] нас [host.GetTitledFirstName|l] провозглашает:\n\n«Моё предложение таково: пусть течение, именуемое „[ec_debate_topic_2.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]“, будет"
