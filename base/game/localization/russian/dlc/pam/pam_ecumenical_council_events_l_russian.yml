 ecumenical_council_events.0123.t: "Если будет война"
 ecumenical_council_events.0123.desc: "Я словно на поле брани, где друг напротив друга выстроились ряды воинов: мои союзники препираются друг с другом. Дурной знак.\n\n«У нас с вами только один общий интерес, чёрт бы вас побрал! Не надо просить меня проголосовать — я вам не послушная собачка, [ROOT.Char.GetTitledFirstName|l] не держит меня на поводке!» — огрызается [lead_conservative.GetTitledFirstName|l].\n\n«Тогда что, по-вашему, и я, и [ROOT.Char.GetPrimaryTitle.GetNameNoTier|l] должны думать о союзнике, который не может поддержать словами клятву верности?» — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0123.support: "«Да, мне нужен каждый верный мне человек»."
 ecumenical_council_events.0123.support_duel: "Предупредить, что такой поступок будет считаться бесчестным."
 ecumenical_council_events.0123.support_duel.success: "Ваши союзники поддержат вас"
 ecumenical_council_events.0123.support_duel.success_halved: "Несколько союзников поддержат вас"
 ecumenical_council_events.0123.support_duel.failure: "Ваших союзников не удаётся запугать"
 ecumenical_council_events.0123.oppose: "«Вы должны хранить верность только Писанию»."
 ecumenical_council_events.0123.oppose_duel: "Я буду просить верности… от таких союзников, как [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.oppose_duel.success: "Ваши союзники уступают"
 ecumenical_council_events.0123.oppose_duel.success_halved: "Некоторые союзники уступают"
 ecumenical_council_events.0123.oppose_duel.failure: "Ваших союзников не удаётся заставить перейти в оппозицию"
