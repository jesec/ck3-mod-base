 ecumenical_council_events.0108.t: "Среди друзей"
 ecumenical_council_events.0108.desc: "Мне приятно видеть, что среди собравшихся есть и [Select_CString(friend.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMe', friend)] [friend.GetTitledFirstName|l].\n\n«Ты ведь знаешь, за кого я, — говорит [Select_CString(friend.IsFemale, 'она', 'он')]. — Только скажи — и я тебя поддержу»."
 ecumenical_council_events.0108.a: "Поддержи меня, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b: "Поступай так, как велят собственные убеждения."
 ecumenical_council_events.0108.conservatives_custom: "[Concept('ec_conservatives', 'Консерваторы')|E] из числа ваших [Concept('friends', 'друзей')|E] (#V [feature_conservatives_size]#!)"
