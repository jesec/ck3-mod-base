 pam_rite_quarrel_championed_opinion: "Принятие моей стороны на Вселенском соборе"
 pam_rite_quarrel_slighted_opinion: "Принятие противоположной стороны на Вселенском соборе"
 pam_rite_quarrel_overruled_opinion: "Вердикт против моего течения на Вселенском соборе"
 ecumenical_council_summons_events.0060.t: "Первый среди равных"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.GetTitledFirstName] говорит от имени #L [GetRiteByKey('roman_rite').GetName|l]ого#! течения и не даёт слова другим:\n\n«Каждая церковь подчиняется Риму, и Рим не подчиняется никому!»\n\n[ec_greek_champion.GetTitledFirstName] на пальцах перечисляет пятерых патриархов:\n\n«И кто из них когда-либо склонялся?»"
 ecumenical_council_summons_events.0060.a: "«Успокойтесь, оба. Собор ещё даже не начался»."
 ecumenical_council_summons_events.0060.a.success: "Вы успокаиваете их до того, как присутствующие успевают выбрать сторону"
 ecumenical_council_summons_events.0060.a.failure: "Никто меня не слушает, присутствующие разделяются"
 ecumenical_council_summons_events.0060.b: "Пётр дал ключи, и Рим владеет ими."
 ecumenical_council_summons_events.0060.c: "Рим первый среди равных. Не более."
 ecumenical_council_summons_events.0060.d: "Это моя должность. Вопрос закрыт."
 ecumenical_council_summons_events.0061.t: "И Сына"
 ecumenical_council_summons_events.0061.desc: "«Два слова, — говорит [ec_greek_champion.GetTitledFirstName] из #L [GetRiteByKey('byzantine_rite').GetName|l]ого#! течения. — [GetRiteByKey('roman_rite').GetAdherentNamePlural] добавили в Символ веры два слова, не спросив мнения востока».\n\n«Истине не требуется ничьё разрешение, кроме Божьего», — отвечает [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0061.a: "Символ веры переживал вещи похуже споров."
 ecumenical_council_summons_events.0061.a.success: "О споре забывают до того, как он успевает ожесточиться"
 ecumenical_council_summons_events.0061.a.failure: "Доводы обеих сторон становятся доктринами"
 ecumenical_council_summons_events.0061.b: "Эти слова были добавлены, потому что они истинны."
 ecumenical_council_summons_events.0061.c: "Символ веры составлен собором. И только собор может его изменить."
 ecumenical_council_summons_events.0061.d: "Я здесь определяю Символ веры."
 ecumenical_council_summons_events.0062.t: "Хлеб алтаря"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName] поднимает лепёшку, бледную и тонкую, словно монета, и говорит:\n\n«[GetRiteByKey('roman_rite').GetAdherentNamePlural] никогда не нуждались в большем».\n\n[ec_greek_champion.GetTitledFirstName] кладёт рядом поднявшуюся булку хлеба:\n\n«И что же, получается, [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|l] ошибались со времён апостолов?»"
 ecumenical_council_summons_events.0062.a: "Оба хлеба будут завтра благословлены на моём алтаре, и мы причастимся обоими."
 ecumenical_council_summons_events.0062.a.success: "Оба хлеба съедены, спор утихает"
 ecumenical_council_summons_events.0062.a.failure: "Вечером устанавливаются два алтаря, и никто не переходит между ними"
 ecumenical_council_summons_events.0062.b: "Незаквашенный, как на Тайной вечере."
 ecumenical_council_summons_events.0062.c: "Поднявшийся хлеб для поднявшегося Господа."
 ecumenical_council_summons_events.0062.d: "Хлеб есть хлеб. Важно лишь благословение."
 ecumenical_council_summons_events.0063.t: "Вопрос языка"
 ecumenical_council_summons_events.0063.desc: "Молитвы читаются на латыни. Сидящие на скамьях [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|l] ожидают перевода и получают испорченный. [ec_greek_champion.GetTitledFirstName] ворчит:\n\n«Римляне спорят, словно юристы. Много слов, но мало сути».\n\n«Греки спорят как философы. Ни до чего не договариваясь», — отвечает [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0063.a: "Тогда давайте найдём слова, несущие смысл на обоих языках."
 ecumenical_council_summons_events.0063.a.success: "Найдены фразы, которые не может исказить ни одна из сторон"
 ecumenical_council_summons_events.0063.a.failure: "Обе стороны уходят, уверенные, что другая вела диспут нечестно"
 ecumenical_council_summons_events.0063.b: "Говорите на латыни и говорите прямо."
 ecumenical_council_summons_events.0063.c: "Отцы писали на греческом. Мы осилим чтение на нём."
 ecumenical_council_summons_events.0063.d: "На обоих языках от моего имени. Вопрос закрыт."
