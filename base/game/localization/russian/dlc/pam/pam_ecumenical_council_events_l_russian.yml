 ecumenical_council_events.0112.t: "Болезнь в державе"
 ecumenical_council_events.0112.desc: "«Мне скоро некуда будет складывать покойников! Мы всё никак не могли понять, за что нам ниспослана эта кара от [lead_conservative.GetFaith.HighGodNamePossessive], но сейчас всё очевидно: люди страдают из-за того, что миру противны изменения церковного права», — говорит [lead_conservative.GetTitledFirstName|l].\n\n«Неужели ненависть к собору настолько застила тебе глаза, что ты не видишь спасения у себя под носом? — отвечает [lead_innovator.GetTitledFirstName|l]. — Чтобы унять гнев [lead_innovator.GetFaith.HighGodNamePossessive], нужно принять нашу реформу!»."
 ecumenical_council_events.0112.support: "Это верно. Церковь должна измениться — такова воля [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events.0112.support_duel: "Железная логика наверняка себя оправдает!"
 ecumenical_council_events.0112.support_duel.success: "Многие начинают понимать, как утихомирить Бога"
 ecumenical_council_events.0112.support_duel.success_halved: "Некоторые попытаются задобрить [lead_innovator.GetFaith.HighGodNamePossessive]"
 ecumenical_council_events.0112.support_duel.failure: "Разрушение церковного права — слишком большой риск"
 ecumenical_council_events.0112.oppose: "Перемены разгневают [ROOT.Char.GetFaith.HighGodNamePossessive] ещё больше!"
 ecumenical_council_events.0112.oppose_duel: "Предупредить, что церковное право будет разрушено."
 ecumenical_council_events.0112.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0112.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0112.oppose_duel.failure: "Они всё ещё надеются на перемены"
 ecumenical_council_events.0112.conservatives_custom: "[Concept('ec_conservatives', 'Консерваторы')|E], столкнувшиеся с [Concept('epidemic', 'поветрием')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0112.conservatives_custom_halved: "[Concept('ec_conservatives', 'Консерваторы')|E], столкнувшиеся с [Concept('epidemic', 'поветрием')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0112.innovators_custom: "[Concept('ec_innovators', 'Инноваторы')|E], столкнувшиеся с [Concept('epidemic', 'поветрием')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0112.innovators_custom_halved: "[Concept('ec_innovators', 'Инноваторы')|E], столкнувшиеся с [Concept('epidemic', 'поветрием')|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0113.t: "Боеготовая вера"
 ecumenical_council_events.0113.desc: "В сторонке собрались пострадавшие от нашествия на их земли налётчиков, исповедующих иную веру; их сплотило общее несчастье.\n\n«Пока враги веры жгут мои поля, — провозглашает [lead_conservative.GetTitledFirstName|l], — мы продолжаем вздорить друг с другом, словно бы враг не вонзил меч нам прямо в сердце!»\n\n«От разногласий в догмах толку не больше, чем от сломанного щита, — отвечает [lead_innovator.GetTitledFirstName|l]. — Уладим канон раз и навсегда — и тогда дадим отпор сообща!»."
 ecumenical_council_events.0113.support: "Будет приятно вспомнить, что такое надежда."
 ecumenical_council_events.0113.support_duel: "Устраним раскол, чтобы церковь могла защитить нас!"
 ecumenical_council_events.0113.support_duel.success: "Они соглашаются, и мы будем сражаться совместно"
 ecumenical_council_events.0113.support_duel.success_halved: "Некоторые соглашаются на реформу"
 ecumenical_council_events.0113.support_duel.failure: "Они не помнят, что такое надежда"
 ecumenical_council_events.0113.oppose: "Разве у нас нет более важных дел?"
 ecumenical_council_events.0113.oppose_duel: "Предупредить их, что это легкомысленно."
 ecumenical_council_events.0113.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0113.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0113.oppose_duel.failure: "Они тщетно продолжают хранить надежду"
 ecumenical_council_events.0113.conservatives_custom: "[Concept('besieged', 'Осаждённые')|E] [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size]#!)"
