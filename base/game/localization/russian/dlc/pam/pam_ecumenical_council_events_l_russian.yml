 ecumenical_council_events.0106.t: "Вассальная верность"
 ecumenical_council_events.0106.desc: "Я собираю вассалов в одном из покоев.\n\n«Даже здесь ваш сюзерен властен над вами, — предупреждает собравшихся [lead_conservative.GetTitledFirstName|l]. — Если [ROOT.Char.GetTitleAsName|l] не выскажется в пользу этих новшеств — подлинной ереси, заметьте! — значит, и вам следует промолчать».\n\n«В других обстоятельствах [ROOT.Char.GetTitleAsNameNoTooltip|l] может указывать нам сколько угодно. Но не здесь!» — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0106.desc_innovator: "Я собираю вассалов в одном из покоев.\n\n«Сюзерен заслуживает ответа, — произносит [lead_conservative.GetTitledFirstName|l]. — Однако я боюсь, что здесь [Select_CString(ROOT.Char.IsFemale, 'она бессильна', 'он бессилен')]. Только [lead_conservative.GetFaith.HighGodName] наставляет наши сердца на истинный путь, и только [lead_conservative.GetFaith.HighGodName] вправе указывать нам, за что вести борьбу!».\n\n«Однако то, чего желает [ROOT.Char.GetTitleAsNameNoTooltip|l], вовсе не противоречит тому, чего требует от нас [ROOT.Char.GetFaith.HighGodName], — отвечает [lead_innovator.GetTitledFirstName|l]. — Задумайтесь над своей клятвой — и внемлите [Select_CString(ROOT.Char.IsFemale, 'её', 'его')] мудрости!»."
 ecumenical_council_events.0106.support: "«Поскольку я [ROOT.Char.GetTitleAsNameNoTooltip|l], я несу в этот мир волю [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0106.support_duel: "Потребовать от вассалов верности, в которой они поклялись."
 ecumenical_council_events.0106.support_duel.success: "Они повинуются вам"
 ecumenical_council_events.0106.support_duel.success_halved: "Некоторые соглашаются повиноваться вам"
 ecumenical_council_events.0106.support_duel.failure: "Ваши вассалы хранят верность только одной личности, и это [lead_conservative.GetFaith.HighGodName]"
 ecumenical_council_events.0106.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip] говорит верно: сюзерен здесь бессилен."
 ecumenical_council_events.0106.oppose_duel: "Поспорить с тем, что воля сюзерена не противоречит воле Бога."
 ecumenical_council_events.0106.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0106.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0106.oppose_duel.failure: "Они продолжают держаться своего убеждения"
