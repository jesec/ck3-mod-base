 ecumenical_council_events.0102.t: "Соперничество молитв"
 ecumenical_council_events.0102.desc: "Самые набожные из обсуждающих предложение разделились на два молитвенных круга.\n\n[lead_innovator.GetTitledFirstName] призывает [lead_innovator.GetFaith.HighGodNamePossessive] в свидетели того, что снизошедшие на них откровения — это отражение воли лично [lead_innovator.GetFaith.HighGodNamePossessive]. Второй круг, в котором [lead_conservative.GetTitledFirstName|l] [Select_CString(lead_conservative.IsFemale, 'собрала', 'собрал')] своих последователей, незамедлительно отвечает призывом: «[lead_innovator.GetFaith.random_GoodGodNames], сохрани традиции, которые уже столько десятилетий служат церкви!»."
 ecumenical_council_events.0102.support: "Присоединиться к молящимся за перемены."
 ecumenical_council_events.0102.support_duel: "Проповедовать перемены до тех пор, пока круг не уступит."
 ecumenical_council_events.0102.support_duel.success: "Ваша проповедь склонила сомневающихся на другую сторону"
 ecumenical_council_events.0102.support_duel.success_halved: "Ваша проповедь склонила часть сомневающихся на другую сторону"
 ecumenical_council_events.0102.support_duel.failure: "Их молитвы оказались сильнее вашей проповеди"
