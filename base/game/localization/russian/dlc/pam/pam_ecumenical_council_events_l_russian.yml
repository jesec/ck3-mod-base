 ecumenical_council_events.doctrine.t: "Актуальный вопрос: [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )|l]"
 ecumenical_council_events.doctrine.intro: "Последнее, что предстоит обсудить, — это [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )|l]. [ec_debate_topic_3.GetDescriptiveName( ROOT.GetCharacter.GetFaith )|U] — текущее положение канонического права. [lead_portrait.GetTitledFirstName] начинает:\n\n"
 ecumenical_council_events.doctrine.chaplain_suggestion: "\n\n«[ec_chaplain_pick.GetDescriptiveName( ROOT.GetCharacter.GetFaith )|U] — это то, что наиболее подходит нуждам #L [ROOT.Char.GetFaith.GetName|l]ой#! веры», — советует [court_chaplain.GetName]."
 ecumenical_council_events.0031.t: "$ecumenical_council_events.doctrine.t$"
 ecumenical_council_events.0031.desc.intro: "$ecumenical_council_events.doctrine.intro$"
 ecumenical_council_events.0031.desc.proposal: "«[host.GetTitledFirstName] милостиво предлагает: пусть новой нормой станет [ec_proposed_doctrine.GetDescriptiveName( ROOT.GetCharacter.GetFaith )|l]»."
 ecumenical_council_events.0031.a: "$ecumenical_council_events.0011.a$"
 ecumenical_council_events.0031.b: "$ecumenical_council_events.0011.b$"
 ecumenical_council_events.0040.t: "Окончание собора"
 ecumenical_council_events.0040.desc: "После длительных и тяжёлых обсуждений собор завершается."
 ecumenical_council_events.0040.desc.change: "Под моим руководством мы пересмотрели сами основы #L [ROOT.Char.GetFaith.GetName|l]ой#! веры. Теперь осталось только донести эту славную весть до народных масс!"
 ecumenical_council_events.0040.desc.status_quo: "Мне не удалось добиться, чтобы приняли хотя бы одно предложение. #L [ROOT.Char.GetFaith.GetName]ая#! вера остаётся неизменной."
 ecumenical_council_events.0040.a: "Пора отправляться домой."
 ecumenical_council_events.0041.t: "Окончание собора"
 ecumenical_council_events.0041.desc: "После длительных и тяжёлых обсуждений собор завершается."
 ecumenical_council_events.0041.desc.change: "[host.GetName] умеет убеждать: под [Select_CString(host.IsFemale, 'её', 'его')] руководством оказались пересмотрены сами основы #L [host.GetFaith.GetName|l]ой#! веры. Теперь осталось только донести эту весть до народных масс!"
 ecumenical_council_events.0041.desc.status_quo: "[host.GetName] не [Select_CString(host.IsFemale, 'смогла', 'смог')] добиться, чтобы приняли хотя бы одно предложение. #L [host.GetFaith.GetName]ая#! вера остаётся неизменной."
 ecumenical_council_events.0041.a: "$ecumenical_council_events.0040.a$"
 ecumenical_council_events.schism_crisis_end: "\n\nКаждая делегация уезжает со своим представлением о том, кто пошёл на уступки, а кто предал. Настолько разделённый дом не может стоять вечно."
 # Debate vote resolution: host
 ecumenical_council_events.0080.t: "Голосование собора"
 ecumenical_council_events.0080.desc.passed: "Голоса подсчитаны. [lead_portrait.GetTitledFirstName] делает шаг вперёд:\n\n«Волею Святого духа этот собор подошёл к концу. Голоса поданы. Собор голосует за!»."
 ecumenical_council_events.0080.desc.failed: "Голоса подсчитаны. [lead_portrait.GetTitledFirstName] делает шаг вперёд:\n\n«Волею Святого духа этот собор подошёл к концу. Голоса поданы. Предложение отклоняется. #L [host.GetFaith.GetName]ая#! вера остаётся неизменной»."
 ecumenical_council_events.0080.desc.outcome.passed: "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] теперь — [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.desc.outcome.passed.make_core: ",\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] теперь — основное течение. [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )|U] уходит в прошлое."
 ecumenical_council_events.0080.desc.outcome.failed: "\n\n[ec_current_topic.GetName( ROOT.GetCharacter.GetRite )] — не [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.a: "Значит, вопрос решён."
 first_debate_resolultion_failed_tt: "[activity.MakeScope.Var('current_topic').TenetType.GetNameNoTooltip( activity.GetHost.GetRite )] — [activity.Custom('GetEcumenicalCouncilTenet1Proposal')]: провал предложения"
 second_debate_resolultion_failed_tt: "[activity.MakeScope.Var('current_topic').TenetType.GetNameNoTooltip( activity.GetHost.GetRite )] — [activity.Custom('GetEcumenicalCouncilTenet2Proposal')]: провал предложения"
 third_debate_resolultion_failed_tt: "[activity.MakeScope.Var('current_topic').DoctrineType.GetGroup.GetName( activity.GetHost.GetFaith )] — [activity.Custom('GetEcumenicalCouncilDoctrine1Proposal')]: провал предложения"
