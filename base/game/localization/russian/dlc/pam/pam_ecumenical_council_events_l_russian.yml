 ecumenical_council_events.0109.t: "Тихое недовольство"
 ecumenical_council_events.0109.desc: "Поодаль собрался ещё один совет, значительно меньше основного. Кто-то пытается вдалеке от моих глаз переиначить основы веры?\n\n«Если вы сомневаетесь уже в этом, значит, засомневаетесь и во всём остальном, — предупреждает [lead_conservative.GetTitledFirstName|l]. — Я не стану потворствовать тому, чтобы в доме [lead_conservative.GetFaith.HighGodNamePossessive] возникли разброд и шатания».\n\n«Но разве вам не хочется распрощаться с традициями, которые уже не служат нашему делу?» — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0109.support: "Полезно будет посочувствовать."
 ecumenical_council_events.0109.support_duel: "Я знаю, как заставить прислушиваться даже осторожных…"
 ecumenical_council_events.0109.support_duel.success: "Они не смогут преградить мне путь"
 ecumenical_council_events.0109.support_duel.success_halved: "Некоторые прислушиваются к вам"
 ecumenical_council_events.0109.support_duel.failure: "Они смыкают против вас ряды"
 ecumenical_council_events.0109.oppose: "Не станем наводить здесь беспорядок."
 ecumenical_council_events.0109.oppose_duel: "«Вы всегда стремитесь сеять повсюду хаос, [lead_innovator.GetFirstNameNoTooltip]?»"
 ecumenical_council_events.0109.oppose_duel.success: "Они не посмеют устроить хаос"
 ecumenical_council_events.0109.oppose_duel.success_halved: "Некоторые отрекаются от своего мнения"
 ecumenical_council_events.0109.oppose_duel.failure: "Они по-прежнему желают раздора"
 ecumenical_council_events.0109.conservatives_custom: "Реформаторски настроенные [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0109.conservatives_custom_halved: "Реформаторски настроенные [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size_halved]#!)"
