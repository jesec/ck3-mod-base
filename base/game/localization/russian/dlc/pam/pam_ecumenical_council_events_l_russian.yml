 ecumenical_council_events.0114.t: "Вооружённые верой и сталью"
 ecumenical_council_events.0114.desc.intro: "Как это обычно заведено у познавших войну, прибывшие на собор старые воины коротают время за разговорами.\n\n«[lead_innovator.GetFaith.HighGodNamePossessive] ради, хоть бы они согласились провести перемены. Тогда верующие снова встанут под одно знамя!» — утверждает [lead_innovator.GetTitledFirstName|l].\n\n"
 ecumenical_council_events.0114.desc.conservative: "«Не один [ec_hostile_faith.GetAdherentName|l] полёг под нашими клинками, — заявляет [lead_conservative.GetTitledFirstName|l]. — Разве не лежит на нас уже благословение [lead_conservative.GetFaith.WarGodNamePossessive]?»"
 ecumenical_council_events.0114.desc.conservative_generic: "«Не один враг полёг под нашими клинками, — заявляет [lead_conservative.GetTitledFirstName|l]. — Разве не лежит на нас уже благословение [lead_conservative.GetFaith.WarGodNamePossessive]?»"
 ecumenical_council_events.0114.support: "Мы поднимем новое — благословенное — знамя."
 ecumenical_council_events.0114.support_duel: "Созовём верующих под благословенное знамя [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 ecumenical_council_events.0114.support_duel.success: "Воин должен служить"
 ecumenical_council_events.0114.support_duel.success_halved: "Некоторые соглашаются на службу"
 ecumenical_council_events.0114.support_duel.failure: "Они упрямо держат позиции"
 ecumenical_council_events.0114.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip], [Select_CString(lead_conservative.IsFemale, 'защитница', 'защитник')] православия, говорит верно. Поддержим [Select_CString(lead_conservative.IsFemale, 'её', 'его')]."
 ecumenical_council_events.0114.oppose_duel: "Значит, будет словесный поединок!"
 ecumenical_council_events.0114.oppose_duel.success: "Соратники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0114.oppose_duel.success_halved: "Часть соратников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0114.oppose_duel.failure: "Они тщетно устремятся вперёд"
 ecumenical_council_events.0114.conservatives_custom: "Воинственные [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0114.conservatives_custom_halved: "Воинственные [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0114.innovators_custom: "Воинственные [Concept('ec_innovators', 'инноваторы')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0114.innovators_custom_halved: "Воинственные [Concept('ec_innovators', 'инноваторы')|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0115.t: "Заговоры и средства"
 ecumenical_council_events.0115.desc: "Как ни горько мне это признавать, не все священнослужители с честью заслужили право носить свои облачения. Даже в таких высоких кругах полезно помнить о тех, кто предпочитает тень чистому свету Писания. Стоит лишь немного прислушаться — и из тёмных уголков доносится шёпот…\n\n«Каждая душа чего-то жаждет. И нам, мудрым, следует задуматься, за чей счёт будет утоляться сия жажда, — поучает собравшихся [lead_conservative.GetTitledFirstName|l]. — Бесстыдство в идеях, горячий пыл в реформах… всё это обойдётся очень дорого».\n\n[Select_CString(lead_conservative.IsFemale, 'Ей', 'Ему')] отвечает другая змея: «Думаешь, платить за грядущий хаос придётся #EMP тебе#!? Ведь когда настанет смута, у нас окажутся развязаны руки…»."
 ecumenical_council_events.0115.support: "В хаосе бывает польза."
 ecumenical_council_events.0115.support_duel: "Обсудить открывающиеся возможностями с теми, кому хватит ума прислушаться."
 ecumenical_council_events.0115.support_duel.success: "Жадность влечёт их к вам"
 ecumenical_council_events.0115.support_duel.success_halved: "Некоторые постараются устроить хаос"
 ecumenical_council_events.0115.support_duel.failure: "Они слепы к открывающимся возможностям"
 ecumenical_council_events.0115.oppose: "После этого небольшого пира мы, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l], навсегда останемся голодны."
 ecumenical_council_events.0115.oppose_duel: "Кто не ищет истины в Писании, тот сбился с пути."
 ecumenical_council_events.0115.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0115.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0115.oppose_duel.failure: "Их поглотили ужасные желания"
 ecumenical_council_events.0115.conservatives_custom: "[Concept('ec_conservatives', 'Консерваторы')|E] с высоким навыком [Concept('intrigue', 'интриг')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0115.conservatives_custom_halved: "[Concept('ec_conservatives', 'Консерваторы')|E] с высоким навыком [Concept('intrigue', 'интриг')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0115.innovators_custom: "[Concept('ec_innovators', 'Инноваторы')|E] с высоким навыком [Concept('intrigue', 'интриг')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0115.innovators_custom_halved: "[Concept('ec_innovators', 'Инноваторы')|E] с высоким навыком [Concept('intrigue', 'интриг')|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0116.t: "Кто платит по счетам?"
 ecumenical_council_events.0116.desc: "Собор превратился в счётную контору: несколько управляющих епархиями склонились над клочком пергамента и спорят о цифрах.\n\n«Ещё одного потрясения моя епархия просто не выдержит, — произносит [lead_conservative.GetTitledFirstName|l]. — Приходу нужны книги, [lead_conservative.GetFaith.HouseOfWorshipPlural|l] в деревнях нуждаются во всадниках. Если реформу примут, десятины на всё не хватит».\n\n«А если не примут? — отвечает [lead_innovator.GetTitledFirstName|l]. — Сколько лет подряд мы уже так спорим? Серебро всё равно пропало. Лучше уж потратить остатки на принятие закона, который верующие будут соблюдать»."
 ecumenical_council_events.0116.support: "Вот именно: зачем оплакивать потраченное серебро?"
 ecumenical_council_events.0116.support_duel: "Заявить: поддержка — это денежные вложения!"
 ecumenical_council_events.0116.support_duel.success: "Они с большой неохотой соглашаются на реформу"
 ecumenical_council_events.0116.support_duel.success_halved: "Некоторые соглашаются с этим доводом"
 ecumenical_council_events.0116.support_duel.failure: "Они продолжают жаловаться на расходы"
 ecumenical_council_events.0116.oppose: "Моя епархия не может позволить себе этого потрясения."
 ecumenical_council_events.0116.oppose_duel: "«[ROOT.Char.GetFaith.HighGodNamePossessive] ради, какая финансовая безответственность!»"
 ecumenical_council_events.0116.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], отказываются от своих слов"
 ecumenical_council_events.0116.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], отказываются от своих слов"
 ecumenical_council_events.0116.oppose_duel.failure: "Они не отступаются от своих вложений"
 ecumenical_council_events.0116.conservatives_custom: "[Concept('ec_conservatives', 'Консерваторы')|E] с высоким навыком [Concept('stewardship', 'управления')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0116.conservatives_custom_halved: "[Concept('ec_conservatives', 'Консерваторы')|E] с высоким навыком [Concept('stewardship', 'управления')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0116.innovators_custom: "[Concept('ec_innovators', 'Инноваторы')|E] с высоким навыком [Concept('stewardship', 'управления')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0116.innovators_custom_halved: "[Concept('ec_innovators', 'Инноваторы')|E] с высоким навыком [Concept('stewardship', 'управления')|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0117.t: "Слишком много поправок"
 ecumenical_council_events.0117.desc: "На моих глазах двое опытных переговорщиков правят текст указа на полях, то вычёркивая, то вновь вписывая один из пунктов, словно перед ними — мирный договор.\n\n«Оставь как есть! Иначе половина из них, гляди, уйдёт даже до того, как мы доберёмся до самых сложных вопросов, — говорит [lead_conservative.GetTitledFirstName|l]. — Ты знаешь, чего мне стоило заставить их не разбежаться? Сделай условия помягче, а иначе мы потеряем весь совет».\n\n«И кто тогда будет следить за соблюдением всего этого бардака, когда собор закончится?» — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0117.support: "Наши слова должны быть вескими и ясными."
 ecumenical_council_events.0117.support_duel: "Лучше жёсткий указ, чем неприметный."
 ecumenical_council_events.0117.support_duel.success: "Они соглашаются, что бестолковый указ не будет действовать"
 ecumenical_council_events.0117.support_duel.success_halved: "Некоторые соглашаются, что бестолковый указ не будет действовать"
 ecumenical_council_events.0117.support_duel.failure: "Они по-прежнему боятся отчуждения"
 ecumenical_council_events.0117.oppose: "Ни в коем случае нельзя терять совет!"
 ecumenical_council_events.0117.oppose_duel: "Это не указ, а непонятно что. Его нельзя принимать!"
 ecumenical_council_events.0117.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
 ecumenical_council_events.0117.oppose_duel.success_halved: "Часть сторонников, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступает"
 ecumenical_council_events.0117.oppose_duel.failure: "Они по-прежнему придерживаются своих взглядов"
 ecumenical_council_events.0117.conservatives_custom: "[Concept('ec_conservatives', 'Консерваторы')|E] с высоким навыком [Concept('diplomacy', 'дипломатии')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0117.conservatives_custom_halved: "[Concept('ec_conservatives', 'Консерваторы')|E] с высоким навыком [Concept('diplomacy', 'дипломатии')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0117.innovators_custom: "[Concept('ec_innovators', 'Инноваторы')|E] с высоким навыком [Concept('diplomacy', 'дипломатии')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0117.innovators_custom_halved: "[Concept('ec_innovators', 'Инноваторы')|E] с высоким навыком [Concept('diplomacy', 'дипломатии')|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0118.t: "Традиции далёкого престола"
 ecumenical_council_events.0118.desc: "С группой священнослужителей, прибывших из далёких земель ради поддержания традиций церкви, беседует [lead_conservative.GetTitledFirstName|l] — человек [lead_conservative.GetCulture.GetCollectiveNounNoTooltip|l]ого происхождения и выдающийся член совета.\n\n«Мир, что открывает #L [lead_conservative.GetFaith.GetName|l]ая#! вера, столь же необъятен, сколь велика любовь [lead_conservative.GetFaith.HighGodNamePossessive] к нам, — произносит [Select_CString(lead_conservative.IsFemale, 'она', 'он')]. — И мы искренне надеемся, что целью этого паломничества не станет созерцание того, как [lead_innovator.GetTitledFirstName|l] проповедует отказ от наследия отцов церкви»."
 ecumenical_council_events.0118.support: "Чем труднее паломничество, тем ярче откровение."
 ecumenical_council_events.0118.support_duel: "Убедить их в том, что [lead_innovator.GetFirstNameNoTooltip] прекрасно всё осознаёт."
 ecumenical_council_events.0118.support_duel.success: "Они соглашаются с тем, что традициям отцов ничего не грозит"
 ecumenical_council_events.0118.support_duel.success_halved: "Некоторые соглашаются с тем, что традициям отцов ничего не грозит"
 ecumenical_council_events.0118.support_duel.failure: "Они по-прежнему боятся того, что проповедует [lead_innovator.GetTitledFirstNameNoTooltip|l]"
 ecumenical_council_events.0118.oppose: "«Почтим вашу жертву»."
