 ecumenical_council_events.0122.t: "Пока ещё возможно"
 ecumenical_council_events.0122.desc: "Кучка хворых священников, отойдя подальше от зала собраний, греется в лучах солнца.\n\n«Интересно, успею ли я услышать последние слова собора перед тем, как попасть в царство [lead_conservative.GetFaith.HighGodNamePossessive]… Хотя скорее меня ждёт [lead_conservative.GetFaith.NegativeAfterLife], ведь здесь творится подлинный ужас!» — надтреснутым голосом произносит [lead_conservative.GetTitledFirstName|l].\n\n«Тебе почти нечего терять, [lead_conservative.GetFirstNameNoTooltip|l], но ведь можешь же ты подарить этому миру хоть каплю надежды, и тогда тебя будет ждать [lead_innovator.GetFaith.PositiveAfterLife]?» — отвечает [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0122.support: "«Именем [ROOT.Char.GetFaith.HighGodNamePossessive], задумайтесь: нет ничего ценнее последних часов жизни!»"
 ecumenical_council_events.0122.support_duel: "Нельзя попасть в царство [ROOT.Char.GetFaith.HighGodNamePossessive], если всё время молчать."
 ecumenical_council_events.0122.support_duel.success: "Они соглашаются в последний раз попытаться провести реформу"
 ecumenical_council_events.0122.support_duel.success_halved: "Некоторые соглашаются в последний раз попытаться провести реформу"
 ecumenical_council_events.0122.support_duel.failure: "Они будут увядать с горечью на душе"
 ecumenical_council_events.0122.oppose: "Только от [ROOT.Char.GetFaith.HighGodNamePossessive] зависит, какими будут наши последние минуты."
 ecumenical_council_events.0122.oppose_duel: "«Не будем марать душу этим бременем!»"
 ecumenical_council_events.0122.oppose_duel.success: "Все сторонники, которыми [Select_CString(lead_innovator.IsFemale, 'окружила', 'окружил')] себя [lead_innovator.GetTitledFirstNameNoTooltip|l], уступают"
