 ecumenical_council_events.0103.t: "Цена перемен"
 ecumenical_council_events.0103.desc: "«Ваша непримиримость нас всех погубит!» — вопит [lead_innovator.GetTitledFirstName|l].\n\n«[lead_conservative.GetPrimaryTitle.GetNameNoTooltip] и все верующие будут весьма благодарны, если их [lead_conservative.Custom('GetFaithTemple')|l] возродится усилиями покровителя», — произносит [lead_conservative.GetTitledFirstName|l]."
 ecumenical_council_events.0103.support: "Предложить покровительство."
 ecumenical_council_events.0103.support_duel: "Подробно объяснить, как [Select_CString(lead_conservative.IsFemale, 'её', 'его')] паства только обогатится."
 ecumenical_council_events.0103.support_duel.success: "Они осознали важность инноваций"
 ecumenical_council_events.0103.support_duel.success_halved: "Некоторые осознали важность инноваций"
 ecumenical_council_events.0103.support_duel.failure: "Все по-прежнему не решаются проголосовать"
 ecumenical_council_events.0103.oppose: "Предложить покровительство."
 ecumenical_council_events.0103.oppose_duel: "Предупредить, что инновации — это путь к обеднению [Select_CString(lead_conservative.IsFemale, 'её', 'его')] паствы."
 ecumenical_council_events.0103.oppose_duel.success: "Они приходят в ужас от этого богохульства"
 ecumenical_council_events.0103.oppose_duel.success_halved: "Некоторые воздерживаются от богохульства"
 ecumenical_council_events.0103.oppose_duel.failure: "Все по-прежнему выступают против непримиримости"
 ecumenical_council_events.0103.conservatives_custom: "Мирские [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0103.conservatives_custom_halved: "Мирские [Concept('ec_conservatives', 'консерваторы')|E] (#V [feature_conservatives_size_halved]#!)"
