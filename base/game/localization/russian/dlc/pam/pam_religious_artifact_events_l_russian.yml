l_russian:
 pam_religious_artifact_events.0001.t: "Святое дело"
 pam_religious_artifact_events.0001.desc: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U]! — в мои покои с улыбкой на устах входит [Select_CString(inspiration_owner.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName]. — Мне привиделся сон!»\n\n«Знаете, что мне приснилось? Расчудесное произведение искусства, изящно сработанное, украшенное лучшими драгоценными камнями… и выполненное, разумеется, во славу [ROOT.Char.GetFaith.HighGodNamePossessive|U] — и только во славу [ROOT.Char.GetFaith.HighGodNamePossessive|U]. Прошу вас, дайте мне всё необходимое — и тогда я одарю вас прекрасным артефактом, на который даже [ROOT.Char.GetTitleAsNameNoTooltip|l] будет смотреть, затаив дыхание!»\n\nСмелая просьба — затраты обещают быть серьёзными. Но ведь не каждый день доводится узреть во сне [ROOT.Char.GetFaith.HighGodNamePossessive|U]…"
 pam_religious_artifact_events.0001.aa: "Похоже, вы только спите и видите, как бы залезть в мой кошель!"
 pam_religious_artifact_events.0001.a: "Нет пределов моей набожности!"
 pam_religious_artifact_events.0001.b: "У [ROOT.Char.GetFaith.HighGodNamePossessive|U] нет нужды в безделушках."
 pam_religious_artifact_events.0002.desc: "[Select_CString(inspiration_owner.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] [Select_CString(inspiration_owner.IsFemale, 'пригласила', 'пригласил' )] меня в замковую молельню. Все вопросы отпали, когда [Select_CString(inspiration_owner.IsFemale, 'она', 'он' )] с гордостью [Select_CString(inspiration_owner.IsFemale, 'представила', 'представил' )] мне долгожданное творение.\n\n[newly_created_artifact.GetDesc]"
 pam_religious_artifact_events.0002.a: "Славно получилось, [inspiration_owner.GetFirstNameNoTooltip]!"
 create_artifact_religious_artifact_tooltip: "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'изготовила', 'изготовил' )] вещь [SCOPE.Custom('ArtifactQuality')] качества — это [newly_created_artifact.GetName]"
