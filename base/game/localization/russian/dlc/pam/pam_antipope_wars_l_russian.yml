l_russian:
 PAM_CHALLENGE_HOF_WAR_CB_NAME: "Бросить вызов [Concept('head_of_faith', 'главе конфессии')|E]"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "Поддержанный вами [Concept('challenger_hof', 'соперничающий глава конфессии')|E] захватывает титулы [Concept('head_of_faith_possessive', 'главы конфессии')|E], а [attacker.GetRite.GetAdjective|l] становится [Concept('mainline_rite', 'господствующим течением')|E]."
 pam_challenge_hof_cb_victory_desc_attacker: "Вы захватываете титулы [Concept('head_of_faith_possessive', 'главы конфессии')|E], а [attacker.GetRite.GetAdjective|l] становится [Concept('mainline_rite', 'господствующим течением')|E]."
 pam_challenge_hof_cb_victory_desc: "[Concept('challenger_hof', 'Соперничающий глава конфессии')|E] становится [Concept('head_of_faith', 'главой конфессии')|E]."
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U] остаётся [Concept('head_of_faith', 'главой конфессии')|E]."
 pam_challenge_hof_cb_defeat_desc_attacker: "Ваше противостояние [Concept('head_of_faith', 'главе конфессии')|E] терпит неудачу."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "Война окончена: защитник больше не [Concept('head_of_faith', 'глава конфессии')|E]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "Война окончена: у главы конфессии больше нет соперника."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U] [Select_CString(new_hof.IsLocalPlayer, 'становитесь', 'становится')] [Select_CString(sponsor.IsLocalPlayer, 'вашим ', '')][Concept('vassal', 'вассалом')|E][Select_CString(sponsor.IsLocalPlayer, '', Concatenate(' персонажа ',sponsor.GetShortUIName))]"
 PAM_ANTIKING_WAR_CB_NAME: "Свержение [Concept('challenger_hof', 'соперничающего главы конфессии')|E]"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "Вы свергаете [Concept('challenger_hof', 'соперничающего главу конфессии')|E], которого [Select_CString(defender.IsFemale, 'установила', 'установил' )] [defender.GetShortUIName], и [attacker.GetFaith.GetReligiousHead.GetShortUIName] не забудет об этом."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "Вы свергаете [Concept('challenger_hof', 'соперничающего главу конфессии')|E], которого [Select_CString(defender.IsFemale, 'установила', 'установил' )] [defender.GetShortUIName]."
 pam_antiking_cb_victory_desc: "[Concept('challenger_hof', 'Соперничающий глава конфессии')|E] свергнут."
 pam_antiking_cb_white_peace_desc: "[Concept('challenger_hof', 'Соперничающий глава конфессии')|E] остаётся."
 pam_antiking_cb_defeat_desc_attacker: "Ваша попытка свергнуть [Concept('challenger_hof', 'соперничающего главу конфессии')|E] провалилась."
 pam_antiking_cb_defeat_desc: "[Concept('challenger_hof', 'Соперничающий глава конфессии')|E] выживает."
 msg_pam_antiking_cb_invalidated_message: "Война окончена: защитник больше не поддерживает [Concept('challenger_hof', 'соперничающего главу конфессии')|E]."
 pam_humiliation_cb_papabile_score_loss_tt: "[defender.GetShortUIName|U] [Select_CString(defender.IsLocalPlayer, 'теряете', 'теряет')] #N -25#! ед. [Concept('papabile_score', 'папский приоритет')|E] в наследовании"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'теряете', 'теряет')] #N -25#! ед. [Concept('papabile_score', 'папский приоритет')|E] в наследовании"
 pam_clerical_disgrace_modifier: "Церковный позор"
 pam_clerical_disgrace_modifier_desc: "Этот персонаж был унижен в религиозной войне, что ослабило его [Concept('candidate_score', 'приоритет претензий')|E] на [Concept('clerical_titles', 'церковные титулы')|E]."
 pam_clerical_disgrace_candidacy_penalty_desc: "Унижение в религиозной войне"
 pam_antipope_events.0010.t: "Унижение самозванца"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')] схизматик [pam_ch_hof_challenger.GetTitledFirstName] стоит передо мной на коленях; [Select_CString(pam_ch_hof_challenger.IsFemale, 'она больше не ложная', 'он больше не ложный' )] [ROOT.Char.GetFaith.ReligiousHeadTitleName].\n\nНе желая мириться с поражением, [Select_CString(pam_ch_hof_challenger.IsFemale, 'она', 'он' )] заявляет: «Завет там, где стою я, а не у вас под ногами».\n\nКажется, [Select_CString(pam_ch_hof_challenger.IsFemale, 'её', 'его' )] язык продолжает служить Сатане."
 pam_antipope_events.0010.desc: "[Select_CString(pam_ch_hof_challenger.IsFemale, 'Самозваная', 'Самозваный' )] [pam_ch_hof_challenger.GetTitledFirstName|l] стоит передо мной на коленях; [Select_CString(pam_ch_hof_challenger.IsFemale, 'она больше не ложная', 'он больше не ложный' )] [ROOT.Char.GetFaith.ReligiousHeadTitleName].\n\nНе желая мириться с поражением, [Select_CString(pam_ch_hof_challenger.IsFemale, 'она', 'он' )] заявляет: «И всё равно [ROOT.Char.GetFaith.ReligiousHeadName] это я»."
 pam_antipope_events.0010.a.christian: "Темница заставит [Select_CString(pam_ch_hof_challenger.IsFemale, 'её', 'его' )] покаяться, как Иону."
 pam_antipope_events.0010.a: "Запереть [Select_CString(pam_ch_hof_challenger.IsFemale, 'её', 'его' )] вдали от глаз."
 pam_antipope_events.0010.b.christian: "Казнить [Select_CString(pam_ch_hof_challenger.IsFemale, 'её', 'его' )]. Господь узнает своих."
 pam_antipope_events.0010.b: "Казнить [Select_CString(pam_ch_hof_challenger.IsFemale, 'её', 'его' )]. [ROOT.Char.GetFaith.HighGodName] нас рассудит."
 pam_antipope_events.0010.c: "Проявить милосердие."
 pam_antipope_events.0010.d: "[Select_CString(pam_ch_hof_challenger.IsFemale, 'Она', 'Он' )] прокричит, кто на самом деле [ROOT.Char.GetFaith.ReligiousHeadName|U]."
 pam_challenge_hof_war_random_permanent_harm_tt: "Получает случайную неизлечимую травму"
 pam_antipope_events.0011.t: "Цена покровительства"
 pam_antipope_events.0011.desc.christian: "[pam_ch_hof_sponsor.GetTitledFirstName] своими деньгами [Select_CString(pam_ch_hof_sponsor.IsFemale, 'спровоцировала', 'спровоцировал' )] этот гнусный раскол, в результате которого соперничающий [ROOT.Char.GetFaith.ReligiousHeadName] восстал против #L [ROOT.Char.GetRite.GetName|l]ого#! учения.\n\nПисание сурово к подобным покровителям: [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[Select_CString(pam_ch_hof_sponsor.IsFemale, 'Она', 'Он' )] смотрит на меня снизу вверх, не желая мириться с поражением: «Ты не [ROOT.Char.GetFaith.ReligiousHeadName], а просто лживый монах. Пади, пади, и пусть имя твоё проклинают в веках»."
 pam_antipope_events.0011.desc: "[pam_ch_hof_sponsor.GetTitledFirstName] своим золотом [Select_CString(pam_ch_hof_sponsor.IsFemale, 'способствовала', 'способствовал' )] тому, что появился соперничающий [ROOT.Char.GetFaith.ReligiousHeadName|U], и [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|l] оказались разделены.\n\n[Select_CString(pam_ch_hof_sponsor.IsFemale, 'Она', 'Он' )] смотрит на меня снизу вверх: «Ты не [ROOT.Char.GetFaith.ReligiousHeadName|l]. Ты мошенник»."
 pam_antipope_events.0011.a: "Отнять казну, что поддержала это."
 pam_antipope_events.0011.b: "Казнить [Select_CString(pam_ch_hof_sponsor.IsFemale, 'её', 'его' )]. За согласие приходится платить цену."
 pam_antipope_events.0011.c: "Обрушившийся на [Select_CString(pam_ch_hof_sponsor.IsFemale, 'её', 'его' )] дом позор — достаточное наказание."
 pam_antipope_events.0011.d: "Запороть [Select_CString(pam_ch_hof_sponsor.IsFemale, 'её', 'его' )] кнутом."
 pam_romans_1_32_english: "Делающие такие дела достойны смерти; однако не только их делают, но и делающих одобряют."
 ROMANS_1_32_GLOSS: "#weak Послание к Римлянам 1:32, синодальный перевод#!"
 pam_antipope_events.0012.t: "Суд над свергнутым"
 pam_antipope_events.0012.t.christian: "Приговор солдату Сатаны"
 pam_antipope_events.0012.intro.christian: "[ROOT.Char.GetRite.GetAdjective] подчиняется мне. Ложный [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], стоит передо мной на коленях."
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] подчиняются мне. Ложный [ROOT.Char.GetFaith.ReligiousHeadName|U], [pam_ch_hof_old_hof.GetTitledFirstName], стоит передо мной на коленях."
 pam_antipope_events.0012.intro.sponsor: "[Select_CString(pam_ch_hof_new_hof.IsFemale, 'Новая', 'Новый' )] [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_new_hof.GetFirstName] занимает престол. [Select_CString(pam_ch_hof_new_hof.IsFemale, 'Самозваная', 'Самозваный' )] [pam_ch_hof_old_hof.GetTitledFirstName] стоит передо мной на коленях."
 pam_antipope_events.0012.dialogue.christian: "\n\nНе желая мириться с поражением, [Select_CString(pam_ch_hof_old_hof.IsFemale, 'она', 'он' )] сплёвывает: «Вы мечом захватили престол мира».\n\n«Господь вручил мне всё необходимое для исполнения этого плана», — отвечаю я."
 pam_antipope_events.0012.dialogue: "\n\n[Select_CString(pam_ch_hof_old_hof.IsFemale, 'Она', 'Он' )] произносит: «Вы захватили это мечом».\n\n«И мечом удержу», — отвечаю я."
 pam_antipope_events.0012.a: "Тюремная камера охладит эту гордыню."
 pam_antipope_events.0012.b: "Только у чудовища может быть две головы. Одну надо отсечь."
 pam_antipope_events.0012.c: "Пролито достаточно крови. Пусть уходит с миром."
 pam_antipope_events.0012.d: "[Select_CString(pam_ch_hof_old_hof.IsFemale, 'Она', 'Он' )] прокричит, кто на самом деле [ROOT.Char.GetFaith.ReligiousHeadName|U]."
 pam_antipope_events.0014.t: "Суд надо мной"
 pam_antipope_events.0014.intro.judge: "«Я объявляю, что [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural|l] больше тебе не повинуются», — говорит [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy.christian: "«Ступай и больше не греши», — говорит [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy: "«Уходи. И не ступай впредь на этот путь», — говорит [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.desc.condemned.christian: "\n\nЯ умираю из-за своей любви к справедливости и неприятия беззакония."
 pam_antipope_events.0014.desc.condemned: "\n\nЯ умираю за свои идеалы."
 pam_antipope_events.0014.desc.broken: "\n\n[Select_CString(pam_ch_hof_judge.IsFemale, 'Она', 'Он' )] со своими людьми со смехом избивают плетьми моё тело. От меня остаётся лишь остов, словно зерно, очищенное от шелухи."
 pam_antipope_events.0014.desc.captive.christian: "\n\nМеня поместили в крошечную каморку. Впрочем, мне всегда говорили, что святому человеку большего и не нужно."
 pam_antipope_events.0014.desc.captive: "\n\nМеня поместили в камеру. Большего мне не положено."
 pam_antipope_events.0014.desc.spared.christian: "\n\nПохоже, никто не намерен бросать в меня камни, и мне дозволено уйти. Не стоит растрачивать понапрасну это милосердие."
 pam_antipope_events.0014.desc.spared: "\n\nПохоже, мне дозволено уйти. Не стоит растрачивать понапрасну это милосердие."
 pam_antipope_events.0014.desc.generic: "\n\nПриговор свершился. Дальше всё зависит от меня."
 pam_antipope_events.0014.a: "Пусть все помнят, что мой дом не отвернулся от [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_antipope_events.0014.b: "Им от этого не отмыться."
 pam_antipope_events.0014.b.toast: "Вы запятнаны #TOOLTIP:STATIC_MODIFIER,pam_ch_hof_sacred_bloodguilt_modifier #V #L повинностью в смерти#!#!#!"
 pam_antipope_events.0014.c: "Защитить мой дом от позора."
 pam_antipope_events.0014.d: "Я помирюсь с тем, кто по праву [ROOT.Char.GetFaith.ReligiousHeadName]."
 pam_antipope_events.0014.e: "Я воплощу в жизнь злодейство, которому меня [Select_CString(pam_ch_hof_judge.IsFemale, 'научила', 'научил' )] [pam_ch_hof_judge.GetTitledFirstNameNoTooltip]."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "Я буду ходить босиком до конца своего покаяния."
 pam_antipope_events.0015.opening: "О [ROOT.Char.GetFaith.GetNameNoTooltip|l]ий [ROOT.Char.GetTitledFirstNameNoTooltip]!"
 pam_antipope_events.0015.desc.defender_victory.christian: "Знайте, что [ROOT.Char.GetFaith.ReligiousHeadName|U] может больше не опасаться угрозы схизматиков. Кафедра претендента разрушена, [ROOT.Char.GetRite.GetAdjective|l] торжествует, и пусть ни один князь или прелат не сомневается, кому хранить верность."
 pam_antipope_events.0015.desc.defender_victory: "Знайте, что [ROOT.Char.GetFaith.ReligiousHeadName|U] может больше не опасаться соперника. Кафедра претендента разрушена, [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|l] выстояли, и пусть ни один правитель не сомневается, кому хранить верность."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Знайте, что война окончена. [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] больше не находится под гнётом Сатаны, и [ROOT.Char.GetRite.GetAdjective|l] будет подчиняться мне."
 pam_antipope_events.0015.desc.attacker_victory: "Знайте, что война окончена. [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] теперь в моих руках, и [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip|l] последуют за мной. Пусть верующие знают, что у власти новый [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_antipope_events.0015.a: "Да будет так."
