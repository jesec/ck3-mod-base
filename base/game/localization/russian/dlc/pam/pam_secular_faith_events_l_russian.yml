l_russian:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "Ваши мысли обращены к обряду, не входящему в вашу [Concept('faith', 'конфессию')|E]. Вы получили [Concept('agnostic_knowledge', 'знание')|E] о [Concept('core_tenet', 'догмате')|E] «[pam_sf_seeded_tenet.GetBaseName]»."
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'стали', Select_CString(CHARACTER.IsFemale, 'стала', 'стал' ))] крёстным родителем для [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))], и духовные узы переросли в дружеские."
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'стали', Select_CString(TARGET_CHARACTER.IsFemale, 'стала', 'стал' ))] крёстным родителем для [Select_CString(CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', CHARACTER.GetShortUIName))], и духовные узы переросли в дружеские."
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] сблизились благодаря общим убеждениям в своей конфессии."
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] стали неразлучными друзьями благодаря общим убеждениям в своей конфессии."
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'защитили', Select_CString(CHARACTER.IsFemale, 'защитила', 'защитил' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] от религиозных преследований."
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'защитили', Select_CString(TARGET_CHARACTER.IsFemale, 'защитила', 'защитил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] от религиозных преследований."
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] стали любовниками благодаря общим убеждениям в своей конфессии."
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] стали любовниками после ночи, проведённой в едином священном порыве."
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] обрели в исповедальне больше, чем отпущение грехов, и стали любовниками."
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] стали любовниками после обсуждений тонкостей веры."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U] и [TARGET_CHARACTER.GetShortUIName] стали родственными душами; общие убеждения в конфессии помогли укрепить любовь."
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'продали', Select_CString(CHARACTER.IsFemale, 'продала', 'продал' ))] священную должность [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUINameNoTooltip))] незнакомцу, который мог себе её позволить."
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'продали', Select_CString(TARGET_CHARACTER.IsFemale, 'продала', 'продал' ))] священную должность [Select_CString(CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', CHARACTER.GetShortUINameNoTooltip))] незнакомцу, который мог себе её позволить."
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вынудили', Select_CString(TARGET_CHARACTER.IsFemale, 'вынудила', 'вынудил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] уйти в монастырь и принять священные обеты."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'вынудили', Select_CString(CHARACTER.IsFemale, 'вынудила', 'вынудил' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] уйти в монастырь и принять священные обеты."
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "преподобный отец"
 pam_my_liege_reverend_mother: "преподобная мать"
 pam_my_liege_captain: "капитан"
 pam_my_liege_khan: "великий хан"
 pam_my_liege_khatun: "великая ханум"
 pam_my_liege_chieftain: "мой вождь"
 pam_my_liege_serene_lord: "светлейший лорд"
 pam_my_liege_serene_lady: "светлейшая леди"
 pam_my_liege_lord: "мой господин"
 pam_my_liege_lady: "моя госпожа"
 pam_my_liege_liege: "мой сюзерен"
 pam_secular_faith_events.0001.t: "Священный дым"
 pam_secular_faith_events.0001.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] прохаживается по нефу с кадилом в руках. Благодатный дым взбирается высоко под своды потолка, унося с собой тихие молитвы прихожан.\n\nНа какой-то миг мне кажется, будто [ROOT.Char.GetFaith.PositiveAfterLife] тянет к себе всё живое — и меня в том числе."
 pam_secular_faith_events.0001.a: "Я погружаюсь в молитву."
 pam_secular_faith_events.0001.b: "Этот обряд следует проводить во имя [ROOT.Char.GetFaith.WealthGodNamePossessive]."
 pam_secular_faith_events.0001.c: "Пусть [ROOT.Char.Custom('GetCourt')|l] тоже приобщится к нашей набожности."
 pam_secular_faith_events.0002.t: "Пикуах нефеш"
 pam_secular_faith_events.0002.desc: "[Select_CString(traveler_in_danger.IsFemale, 'Оказавшаяся', 'Оказавшийся')] проездом в моих землях [Select_CString(traveler_in_danger.IsFemale, 'путница', 'путник')] [traveler_in_danger.GetTitledFirstName|l] [Select_CString(traveler_in_danger.IsFemale, 'стала', 'стал')] жертвой шайки бандитов, орудующей во владении [background_terrain_scope.GetName]!\n\nОднако, пусть даже [Select_CString(traveler_in_danger.IsFemale, 'её', 'его')] жизнь в опасности, в Шаббат — святой день [ROOT.Char.GetFaith.HighGodNamePossessive] — запрещается брать в руки оружие. Но если ждать до заката, на месте я найду только хладный труп…\n\nМожно ли сидеть сложа руки, когда человеку грозит смерть?"
 pam_secular_faith_events.0002.a: "Нет ничего важнее жизни. По коням!"
 pam_secular_faith_events.0002.b: "Я прислушаюсь к тому, что мне скажет [Select_CString(chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0002.c: "Я не стану нарушать Шаббат."
 pam_secular_faith_events.0003.t: "Видение в ночи"
 pam_secular_faith_events.0003.desc: "Я просыпаюсь в ужасе. Наверное, всё-таки это не сон: столп огня, взывающий ко мне голос и лицо, забыть которое невозможно…\n\nНеужели мне довелось увидеть пришествие [ROOT.Char.GetFaith.HighGodNamePossessive]? Или [ROOT.Char.GetFaith.HealthGodNamePossessive]? Или даже [ROOT.Char.GetFaith.DevilNamePossessive] в другом обличье…\n\nИли, возможно, просто во мне играет взбудораженная кровь."
 pam_secular_faith_events.0003.a: "Голос нашёптывал мне блаженные истины…"
 pam_secular_faith_events.0003.b: "Это дурной гумор… В книгах наверняка о таком пишут."
 pam_secular_faith_events.0003.c: "Пусть [ROOT.Char.Custom('GetCourt')|l] узнает о моём видении!"
 pam_secular_faith_events.0004.t: "Запретная истина"
 pam_secular_faith_events.0004.desc: "Мне не спится. Меня обуревают сомнения, и я меряю шагами [ROOT.Char.Custom('ResidenceBuildingHallsType')], пока [ROOT.Char.Custom('ResidenceBuilding')] пребывает в сонном забытье.\n\nВ голове у меня лишь одно: [pam_sf_forbidden_tenet.GetBaseName|l], пусть даже моя конфессия относится к этому с осуждением. Но мне не хочется следовать её заветам — мысль, будто в этом веровании есть зерно истины, не даёт мне покоя."
 pam_secular_faith_events.0004.a: "Я буду втайне придерживаться этой истины."
 pam_secular_faith_events.0004.b: "Нет, я не сойду с истинного пути."
 pam_secular_faith_events.0005.t: "При свечах"
 pam_secular_faith_events.0005.desc_intro: "Вечернее чтение рукописей должно успокаивать, однако душу мою будоражит одна-единственная строка.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "В ней описывается завет, что зовётся «[pam_sf_revelation_tenet.GetBaseName|l]», — немыслимый в моей конфессии обряд. Я пытаюсь убедить себя, что это варварское занятие."
 pam_secular_faith_events.0005.desc_doctrine: "В ней описывается доктрина, что зовётся «[pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )|l]», — немыслимое в моей конфессии учение. Я пытаюсь убедить себя в его ошибочности."
 pam_secular_faith_events.0005.desc_end: "И всё-таки при пламени свечей на меня снисходит озарение. Я понимаю, что влечёт к нему других."
 pam_secular_faith_events.0005.a: "Надо перенести эти мысли на бумагу."
 pam_secular_faith_events.0005.b: "Нет ничего дурного в понимании."
 pam_secular_faith_events.0005.c: "Молитва прогонит эти мысли."
 pam_secular_faith_events.0006.t: "Кости святого"
 pam_secular_faith_events.0006.desc: "Во время прогулки по рынку мой взгляд падает на [Select_CString(relic_seller.IsFemale, 'уставшую с дороги паломницу', 'уставшего с дороги паломника')]; в дрожащих руках [Select_CString(relic_seller.IsFemale, 'она', 'он')] сжимает пожелтевшую от старости фалангу.\n\n«Это кость святого! — клянётся [Select_CString(relic_seller.IsFemale, 'она', 'он')]. — Встретилась мне на пути в [GetTitleByKey('c_jerusalem').GetNameNoTier]. Но только в руках такого человека, как [ROOT.Char.GetTitleAsNameNoTooltip|l], она будет в настоящей сохранности…».\n\nОпытный глаз сможет оценить, действительно ли эта кость, которую по невероятному совпадению можно купить, принадлежала святому."
 pam_secular_faith_events.0006.a: "Я хочу оценить товар перед покупкой."
 pam_secular_faith_events.0006.b: "Надо брать!"
 pam_secular_faith_events.0006.c: "Мне не нужны неизвестно чьи кости."
 pam_sf_acquire_relic_tt: "Вы получаете [Concept('artifact', 'артефакт')|E]-реликвию обычной [Concept('rarity', 'редкости')|E]"
 pam_sf_examine_relic_tt: "Вы получаете [Concept('artifact', 'артефакт')|E]-реликвию, [Concept('rarity', 'редкость')|E] которой зависит от вашего [learning_i][Concept('learning_skill', 'навыка учёности')|E]"
 pam_sf_acquire_relic_toast: "Получена священная реликвия"
 pam_sf_fingerbone_relic_name: "Фаланга персонажа по имени [SCOPE.Custom('PamFingerboneSaint')]"
 pam_sf_fingerbone_relic_desc: "Эта пожелтевшая фаланга — предположительно мощи персонажа по имени [SCOPE.Custom('PamFingerboneSaint')], — хранится в небольшом реликварии."
 pam_secular_faith_events.0007.t: "Заносчивость епископа"
 pam_secular_faith_events.0007.desc: "Один мой [defiant_bishop.GetTitleAsNameNoTooltip|l], [defiant_bishop.GetFirstName] — человек крайне честолюбивый. [Select_CString(defiant_bishop.IsFemale, 'Она', 'Он')] обладает обширными связями и тайно считает себя лучше меня. Несколько моих слуг заболело, и мне потребовалось освятить владения.\n\nПрошли дни, прежде чем [Select_CString(defiant_bishop.IsFemale, 'она', 'он')] всё же [Select_CString(defiant_bishop.IsFemale, 'соизволила', 'соизволил')] явиться. «Прошу прощения за задержку, — с усмешкой [Select_CString(defiant_bishop.IsFemale, 'заявила она', 'заявил он')], — но истинный господин, которому я служу, важнее, чем любой [ROOT.Char.GetTitleAsNameNoTooltip|l]»."
 pam_secular_faith_events.0007.a: "Я приму вас с почестями, соответствующими вашему сану."
 pam_secular_faith_events.0007.b: "Просто проведите обряд."
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName] — ваш Господь, но я ваш сюзерен. Вон!"
 pam_secular_faith_events.0008.t: "Бремя греха"
 pam_secular_faith_events.0008.desc: "Свечи догорают, и печальные мысли вновь овладевают мной. Я [penance_sin.GetName( ROOT.Char )|l], а в моей вере это считается грехом.\n\nЯ стараюсь отогнать тяжкие думы, но вина никуда не уходит.\n\n«Обуздайте себя — и тогда освободитесь от бремени». [ROOT.Char.Custom2( 'RelationToMeShort', confessor )] [confessor.GetFirstName] не осуждает меня и не высмеивает. «Встаньте на путь покаяния и не сбивайтесь с него»."
 pam_secular_faith_events.0008.a: "Я поступлю так, как советует [confessor.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0008.b: "Не сейчас. Ещё не время."
 pam_secular_faith_events.0009.t: "Словно Христос"
 pam_secular_faith_events.0009.desc: "Перед моими воротами одиноко стоит [Select_CString(stranger.IsFemale, 'незнакомая нищенка', 'незнакомый нищий')] с протянутой рукой. [Select_CString(stranger.IsFemale, 'Её кожа', 'Его кожа')] сплошь покрыта шрамами.\n\n«Простите, что беспокою вас, [ROOT.Char.Custom('ComplimentAdjective')|l][Select_CString(ROOT.Char.IsFemale, 'ая', 'ый' )] [ROOT.Char.GetTitleAsNameNoTooltip|l], — произносит [Select_CString(stranger.IsFemale, 'неизвестная', 'неизвестный')] с изящным поклоном, — Не найдётся ли у вас что-нибудь для меня, если, конечно, вы сами не бедствуете?»\n\nЭтот человек слишком велеречив для попрошайки. Никогда не знаешь, кто скрывается под лохмотьями."
 pam_secular_faith_events.0009.a: "[ROOT.Char.Custom('ResidenceBuilding')] всегда привечает убогих. Заходи."
 pam_secular_faith_events.0009.b: "Вот тебе ломоть хлеба, и ступай с миром."
 pam_secular_faith_events.0010.t: "[Select_CString(stranger.IsFemale, 'Удивительная гостья', 'Удивительный гость')]"
 pam_secular_faith_events.0010.desc_blessed: "Человек, посетивший мои владения, — не простой бродяга. [Select_CString(stranger.IsFemale, 'Она', 'Он')] цитирует Священное Писание и рассуждает об управлении государством с такой лёгкостью, что мои учёные мужи слушают с раскрытыми ртами.\n\nПохоже, ко мне и впрямь [Select_CString(stranger.IsFemale, 'явилась', 'явился')] [ROOT.Char.GetFaith.HighGodName]. Раз так, [Select_CString(stranger.IsFemale, 'её', 'его')] скитания окончены."
 pam_secular_faith_events.0010.desc_thief: "Я просыпаюсь у холодного очага и вижу, что сундук с драгоценностями пуст.\n\nВот как меня отблагодарили за хлеб и кров!\n\nПопрошайка [Select_CString(stranger.IsFemale, 'исчезла', 'исчез')] под покровом ночи, прихватив с собой мои богатства.\n\nКогда домочадцы пробуждаются, [Select_CString(stranger.IsFemale, 'её', 'его')] уже и след простыл."
 pam_secular_faith_events.0010.a: "Тебя сюда не просто так послали."
 pam_secular_faith_events.0010.b: "Змея пригрелась на моей груди!"
 pam_secular_faith_events.0011.t: "Кающиеся грешники"
 pam_secular_faith_events.0011.desc: "Меня будят не раскаты грома, а свист плетей.\n\nУ входа в [ROOT.Char.Custom('ResidenceBuilding')|l] толпится кучка кающихся грешников с кровоточащими ранами на спинах. По их словам, [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )|l] — это то, что велит нам [ROOT.Char.GetFaith.HighGodName].\n\nДомочадцы выжидающе смотрят на меня."
 pam_secular_faith_events.0011.a: "В этом кроется какой-то глубокий смысл?"
 pam_secular_faith_events.0011.b: "Я подставлю спину, ибо и я не без греха."
 pam_secular_faith_events.0011.c: "Гоните этих безумцев в шею!"
 pam_secular_faith_events.0012.t: "Благословение оружия"
 pam_secular_faith_events.0012.desc: "Мир всегда даётся взаймы.\n\nВ самый разгар пира [ROOT.Char.GetFaith.WarGodNamePossessive] [Select_CString(chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstName] предлагает освятить оружие в моём доме.\n\n«Пусть по высшей милости дом [ROOT.Char.GetHouse.GetBaseName] получит такую же силу, какая была пожалована Давиду для победы над Голиафом», — торжественно произносит [Select_CString(chaplain.IsFemale, 'она', 'он')]."
 pam_secular_faith_events.0012.a: "Благослови мои знамёна и клинки в час нужды."
 pam_secular_faith_events.0012.b: "Лучше попросим о мире."
 pam_secular_faith_events.0012.c: "Ограничимся тихой молитвой."
 pam_secular_faith_events.0013.t: "Предсказание смерти"
 pam_secular_faith_events.0013.desc: "Передо мной стража тащит [Select_CString(prophet.IsFemale, 'служительницу, обвиняемую', 'служителя, обвиняемого')] в подстрекательстве и ворожбе. Внезапно [Select_CString(prophet.IsFemale, 'её', 'его')] внимание привлекает [Select_CString(doomed_soul.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )|l] [doomed_soul.GetTitledFirstName|l].\n\n«Запомните! — кричит [Select_CString(prophet.IsFemale, 'помешанная', 'помешанный')]. — Ещё до новолуния [Select_CString(doomed_soul.IsFemale, 'она', 'он')] будет лежать в земле: так говорит мне [ROOT.Char.GetFaith.HighGodName]. Мне ведомо всё, вплоть до часа кончины!»\n\nОт такой уверенности даже у меня мороз идёт по коже, а [doomed_soul.GetFirstNameNoTooltip] просто в ужасе."
 pam_secular_faith_events.0013.a: "Какими только устами не молвит [ROOT.Char.GetFaith.HighGodName]…"
 pam_secular_faith_events.0013.b: "Прекрати свою дурацкую болтовню!"
 prophecy_foretold_tt: "Вы услышали пророчество. Вдруг оно правдиво?"
 prophecy_foretold_2_tt: "Вы услышали пророчество. Это полная чепуха!"
 pam_secular_faith_events.0014.t: "Судьба пророчества"
 pam_secular_faith_events.0014.desc_fulfilled: "Перед самым новолунием [doomed_soul.GetTitledFirstName] тихо умирает во сне.\n\nЯ не могу отделаться от мысли, что [Select_CString(prophet.IsFemale, 'та служительница оказалась права', 'тот служитель оказался прав')].\n\nЭто и впрямь было пророчество? Или всему виной страх?»"
 pam_secular_faith_events.0014.desc_failed: "Наступило новолуние, но [doomed_soul.GetTitledFirstName] и не думает умирать. Роковой час прошёл, и ничего не случилось.\n\n[Select_CString(prophet.IsFemale, 'Та служительница — или мошенница, или дура', 'Тот служитель — или мошенник, или дурак')]. Ясно одно: [ROOT.Char.GetFaith.HighGodName] [Select_CString(prophet.IsFemale, 'её', 'его')] устами не говорит!"
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nЧто ж, меня облапошили."
 pam_secular_faith_events.0014.a: "[Select_CString(prophet.IsFemale, 'Она настоящая пророчица', 'Он настоящий пророк')]!"
 pam_secular_faith_events.0014.b: "Неисповедимы пути [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0014.c: "Как можно было поверить в это дурацкое предсказание?!"
 pam_secular_faith_events.0014.d: "Стоило серьёзнее отнестись к этому предсказанию…"
 pam_secular_faith_events.0014.e: "Я же говорю, что это [Select_CString(prophet.IsFemale, 'мошенница', 'мошенник')]!"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U] получает религиозное [Concept('inspiration', 'вдохновение')|E]"
 pam_secular_faith_events.0015.t: "Мироточащая икона"
 pam_secular_faith_events.0015.desc: "Говорят, [miracle_church.GetName] хранит нечто потрясающее. [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] отводит меня туда. И действительно: из нарисованных глаз одного святого сочатся благоухающие масла.\n\nВесть о чуде распространяется быстрее лесного пожара, а чудо — явление могущественное и опасное."
 pam_secular_faith_events.0015.a: "Чудо? Это мы ещё проверим."
 pam_secular_faith_events.0015.b: "Откроем двери для всех верующих."
 pam_secular_faith_events.0015.c: "Прибережём благословение для себя."
 pam_secular_faith_events.0015.d: "Моей державе благоволят высшие силы!"
 no_miracles_tt: "Это чудо выглядит подозрительно…"
 pam_secular_faith_events.0016.t: "Цена за службу"
 pam_secular_faith_events.0016.desc_intro: "В [ROOT.Char.Custom('ResidenceBuilding')] входит [ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|l][Select_CString(candidate.IsFemale, 'ая', 'ый')] [Select_CString(candidate.IsFemale, 'женщина', 'мужчина')]. [Select_CString(candidate.IsFemale, 'Она', 'Он')] обращается ко мне с весьма выгодным предложением.\n\n«[Select_CString(old_realm_priest.IsFemale, 'Ваша', 'Ваш')] [old_realm_priest.GetCouncilTitle] [old_realm_priest.GetFirstName] неплохо справляется со своими обязанностями, — елейным голосом произносит [Select_CString(candidate.IsFemale, 'она', 'он')], кладя на стол туго набитый кошель, — Однако я обещаю быть… благодарнее. Возьмите меня вместо [Select_CString(old_realm_priest.IsFemale, 'неё', 'него')] — и заручитесь благословением [ROOT.Char.GetFaith.WealthGodNamePossessive]»."
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nПодумаешь, [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )|l]! Кто ж устоит перед серебром?"
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )] — большой грех. Эти деньги запятнают мою душу."
 pam_secular_faith_events.0016.a: "Что ж, монеты перевешивают вину…"
 pam_secular_faith_events.0016.b: "Справедливая цена. Должность ваша!"
 pam_secular_faith_events.0016.c: "Я не продаюсь."
 pam_secular_faith_events.0017.t: "[ROOT.Char.Custom('GetCourt')|U] и ересь"
 pam_secular_faith_events.0017.desc: "«[accused.GetFirstName] — [Select_CString(accused.IsFemale, 'еретичка', 'еретик')]! — громко шипит [Select_CString(chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstName]. — Разве не видите, что [ROOT.Char.Custom('GetCourt')] уже всецело под [Select_CString(accused.IsFemale, 'её', 'его')] #L [accused.GetRite.GetAdjective]ыми#! чарами? [Select_CString(accused.IsFemale, 'Ей', 'Ему')] следует покаяться и отдаться во власть [ROOT.Char.GetFaith.HighGodNamePossessive]!\n\n[accused.GetFirstNameNoTooltip] всё слышит. [Select_CString(accused.IsFemale, 'Она', 'Он')] сохраняет хладнокровие, хотя такие обвинения глубоко [Select_CString(accused.IsFemale, 'её', 'его')] ранят."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], я помогу вам узреть свет истинной веры."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip] обращается в вашу веру"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName] не внемлет вам"
 pam_secular_faith_events.0017.b: "Что ж, тогда в темницу [Select_CString(accused.IsFemale, 'её', 'его')]!"
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip] под моим покровительством. Этого достаточно."
 pam_secular_faith_events.0018.t: "Божье дитя"
 pam_secular_faith_events.0018.desc: "[Select_CString(pious_child.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )|l] [pious_child.GetFirstName] не походит на других детей. Пока остальные играют, [Select_CString(pious_child.IsFemale, 'она', 'он')] проводит время в часовне.\n\n«Впервые вижу такого ребёнка, — задумчиво произносит [Select_CString(chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName]. — [Select_CString(pious_child.IsFemale, 'Она', 'Он')] молится часы напролёт и плачет во время мессы. Очевидно: это [GetTrait('devoted').GetName( pious_child )|l]!»"
 pam_secular_faith_events.0018.a: "Пусть становится [Select_CString(pious_child.IsFemale, 'служительницей', 'служителем')] [ROOT.Char.GetFaith.HighGodNamePossessive], но остаётся здесь."
 pam_secular_faith_events.0018.b: "Я вверяю [Select_CString(pious_child.IsFemale, 'свою дочь', 'своего сына')] церкви."
 pam_secular_faith_events.0018.c: "Нет, [Select_CString(pious_child.IsFemale, 'её', 'его')] место — дом [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0019.t: "Мир Божий"
 pam_secular_faith_events.0019.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] приносит печальную весть.\n\n«Негоже брату убивать брата пред очами [ROOT.Char.GetFaith.HighGodNamePossessive]! — восклицает [Select_CString(chaplain.IsFemale, 'она', 'он')]. — [feud_attacker.GetTitledFirstName] и [feud_defender.GetTitledFirstName] повздорили друг с другом, а страдает от этого простой люд!»\n\n«Довольно! [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )] примирит их»."
 pam_secular_faith_events.0019.a: "Клянусь именем [ROOT.Char.GetFaith.HighGodNamePossessive], я добьюсь мира!"
 pam_secular_faith_events.0019.b: "Если лорд обнажает клинок, он должен за это ответить."
 pam_secular_faith_events.0019.c: "Вражда между вассалами — это моя забота."
 pam_sf_peace_of_god_ends_wars_tt: "Всякая [Concept('war', 'война')|E] между вашими [Concept('vassals', 'вассалами')|E] завершается [Concept('white_peace', 'миром на условиях «статус-кво»')|E]"
 pam_secular_faith_events.0020.t: "[temple_location.GetNameNoTooltip] и [ROOT.Char.GetFaith.HouseOfWorship|l]"
 pam_secular_faith_events.0020.desc: "Передо мной — [temple_location.GetName]. Вокруг [temple_location.Custom('TerrainTypeProvincePrefix')|l] [temple_location.Custom('TerrainTypeProvince')|l], а впереди гордо возвышается [ROOT.Char.GetFaith.HouseOfWorship|l]: моё первое детище, величие, воплощённое в камне.\n\n[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] прохаживается с кадильницей в руке.\n\n«Это первый, но не последний ваш храм, — произносит [Select_CString(chaplain.IsFemale, 'она', 'он')]. — [ROOT.Char.GetFaith.HouseOfWorship|l] [ROOT.Char.GetFaith.HighGodNamePossessive] будут множиться в наших землях!»"
 pam_secular_faith_events.0020.a: "Начинайте молебен, [chaplain.GetFirstNameNoTooltip]!"
 pam_secular_faith_events.0020.b: "Пусть [ROOT.Char.GetFaith.HouseOfWorship|l] стоит, а [consecrated_county.GetNameNoTierNoTooltip] процветает!"
 pam_secular_faith_events.0020.c: "Я обрету мудрость в этих стенах."
 pam_secular_faith_events.0020.d: "Труд во имя [ROOT.Char.GetFaith.HighGodNamePossessive] только начинается."
 pam_secular_faith_events.0021.t: "Знак с небес"
 pam_secular_faith_events.0021.desc: "Сна ни в одном глазу. Я выхожу в тёмный [ROOT.Char.Custom('GetCourtyard')|l] и задираю голову. Сегодня ночью на небе виднеется [ROOT.Char.Custom('GetPamCelestialOmen')|l].\n\nВ таких знаках всегда скрыт смысл."
 pam_omen_blood_moon: "красная луна"
 pam_omen_star_host: "внезапно возникшее скопление звёзд"
 pam_omen_comet: "двуххвостая комета"
 pam_omen_falling_stars: "звездопад"
 pam_omen_moon_halo: "бледный ореол вокруг луны"
 pam_omen_eclipse: "медный серп поверх луны"
 pam_omen_wandering_star: "яркая бродячая звезда"
 pam_secular_faith_events.0021.a: "Я узнаю, что значит это знамение."
 pam_secular_faith_events.0021.b: "Это символ благословения [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0021.c: "Такой знак предвещает завоевание!"
 pam_secular_faith_events.0021.d: "Не стоит искать ответов в небесах."
 pam_secular_faith_events.0022.t: "Прикосновение коронованной особы"
 pam_secular_faith_events.0022.desc_intro: "[Select_CString(sick_courtier.IsFemale, 'Моя побледневшая', 'Мой побледневший')] [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )], [sick_courtier.GetFirstName] приближается ко мне неверным шагом.\n\n"
 pam_secular_faith_events.0022.desc_ill: "[ROOT.Char.Custom('FormOfAddressForLiege')], [illness_trait.GetName( GetNullCharacter )|l] забирает мои силы, а лечения нет. Даже доктор [physician.GetTitledFirstName] не понимает, что со мной!» — жалуется [Select_CString(sick_courtier.IsFemale, 'она', 'он')].\n\n"
 pam_secular_faith_events.0022.desc_other: "[illness_trait.GetName] забирает мои силы, а лечения нет. Даже [physician.GetTitledFirstName|l] не понимает, что со мной!» — жалуется [Select_CString(sick_courtier.IsFemale, 'она', 'он')].\n\n"
 pam_secular_faith_events.0022.desc_end: "«Говорят, длань коронованной особы способна даровать милость [ROOT.Char.GetFaith.HighGodNamePossessive]. Вы моя последняя надежда»."
 pam_secular_faith_events.0022.a: "Подойдите. Я возложу на вас руки."
 pam_secular_faith_events.0022.b: "Нет… Я благословлю вас на расстоянии."
 pam_sf_kings_touch_gamble_tt: "Возможно, так [sick_courtier.GetFirstName|l] выздоровеет, но я рискую от [Select_CString(sick_courtier.IsFemale, 'неё', 'него')] заразиться…"
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName] оправляется от хвори"
 pam_sf_kings_touch_infected_toast: "Недуг передаётся мне"
 pam_sf_kings_touch_nothing_toast: "Чуда не происходит, и [sick_courtier.GetFirstName|l] не исцеляется"
 pam_secular_faith_events.0023.t: "Странствующий писец"
 pam_secular_faith_events.0023.desc: "Передо мной стоит [Select_CString(scholar.IsFemale, 'тощая женщина', 'тощий мужчина')] с увесистыми томами подмышкой. [Select_CString(scholar.IsFemale, 'Её', 'Его')] пальцы заляпаны чернилами.\n\n«Я [scholar.GetFirstName], писец и учёный человек, — произносит [Select_CString(scholar.IsFemale, 'она', 'он')] и, выдержав паузу, продолжает. — У меня нет ни дома, ни покровителя. Эти руки не годятся для тяжёлого труда, [ROOT.Char.GetTitleAsNameNoTooltip|l]. [ROOT.Char.Custom('GetWritingMaterial')] — вот мой инструмент.\n\n«Молю, предоставьте мне пищу и кров, а за это я буду служить вам верой и правдой!»"
 pam_secular_faith_events.0023.a: "Научите меня тому, что знаете."
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip] нуждается в вас."
 pam_secular_faith_events.0023.c: "Будете заполнять учётные книги."
 pam_secular_faith_events.0023.d: "Такие мне не нужны. Прощайте."
 pam_secular_faith_events.0024.t: "В монастырь"
 pam_secular_faith_events.0024.desc: "[Select_CString(rival_character.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )] [rival_character.GetFirstName] — [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)][Select_CString(rival_character.IsFemale, 'ая', 'ый')] [rival_character.Custom2('InsultNounClumsy', ROOT.Char)] и [rival_character.Custom2('InsultAdjective', ROOT.Char)][Select_CString(rival_character.IsFemale, 'ая', 'ый')] [rival_character.Custom2('InsultNoun', ROOT.Char)]. Поэтому моё настроение мигом поднимается, когда [archbishop.GetTitledFirstName|l] архиепархии [archdiocese.GetName] присылает мне письмо.\n\n«[rival_character.GetFirstName] станет [Select_CString(rival_character.IsFemale, 'прекрасной служительницей', 'прекрасным служителем')] [ROOT.Char.GetFaith.HighGodNamePossessive], — пишет [Select_CString(archbishop.IsFemale, 'она', 'он')]. — Монастырь примет [Select_CString(rival_character.IsFemale, 'её', 'его')] с распростёртыми объятиями».\n\nКогда [ROOT.Char.Custom('GetCourt')|l] от [Select_CString(rival_character.IsFemale, 'неё', 'него')] избавится, о [Select_CString(rival_character.IsFemale, 'ней', 'нём')] быстренько забудут."
 pam_secular_faith_events.0024.a: "Поприветствуем [Select_CString(rival_character.IsFemale, 'новую служительницу', 'нового служителя')] [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 pam_secular_faith_events.0024.b: "Врагов лучше держать на виду."
 pam_secular_faith_events.0025.t: "[Select_CString(ROOT.Char.IsFemale, 'Крёстная мать', 'Крёстный отец')]"
 pam_secular_faith_events.0025.desc: "«Я жажду служить #L [ROOT.Char.GetFaith.GetName|l]ой#! вере как [ROOT.Char.GetRite.GetAdherentName|l], телом и душой, — торжественно произносит [Select_CString(converting_char.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )] [converting_char.GetFirstName]. — Я хочу принять крещение и прошу вас стать [Select_CString(ROOT.Char.IsFemale, 'моей крёстной матерью', 'моим крёстным отцом')]»."
 pam_secular_faith_events.0025.a: "Созовём на обряд весь честной народ!"
 pam_secular_faith_events.0025.b: "Истинная вера не терпит показухи."
 pam_secular_faith_events.0025.c: "Это слишком большая честь."
 pam_secular_faith_events.0026.t: "Одержимая душа"
 pam_secular_faith_events.0026.desc: "[Select_CString(afflicted.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )] [afflicted.GetFirstName] никогда не [Select_CString(afflicted.IsFemale, 'отличалась', 'отличался')] крепостью рассудка, но теперь дела приняли совсем скверный оборот.\n\n«[ROOT.Char.GetFaith.EvilGodNames]! Во мне сидит [ROOT.Char.GetFaith.EvilGodNames]!» — голосит [Select_CString(afflicted.IsFemale, 'она', 'он')], и [ROOT.Char.GetFaith.HouseOfWorship|l] наполняется жутковатым эхом.\n\n[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] резко бледнеет. «[ROOT.Char.Custom('FormOfAddressForLiege')|U], боюсь, [Select_CString(afflicted.IsFemale, 'её', 'его')] душа одержима демонами. Помочь [Select_CString(afflicted.IsFemale, 'ей', 'ему')] может лишь экзорцизм!»"
 pam_secular_faith_events.0026.a: "[Select_CString(afflicted.IsFemale, 'Ему', 'Ей')] нужен доктор."
 pam_secular_faith_events.0026.b: "Я лично проведу обряд."
 pam_secular_faith_events.0026.c: "Тогда это ваша работа."
 pam_secular_faith_events.0026.d: "Уведите [Select_CString(afflicted.IsFemale, 'её', 'его')], пока не началась паника!"
 pam_sf_exorcism_success_toast: "Попытка экзорцизма удалась"
 pam_sf_exorcism_failed_toast: "Попытка экзорцизма провалилась"
 pam_secular_faith_events.0027.t: "Кризис веры"
 pam_secular_faith_events.0027.desc: "«Слышишь ли ты меня, [ROOT.Char.GetFaith.HighGodName]?» — произношу я шёпотом, хотя в глубине души знаю, что высшие силы глухи к мольбам грешников.\n\n«Быть может, я неверно трактую волю [ROOT.Char.GetFaith.HighGodNamePossessive]? Разве [old_tenet.GetName( ROOT.Char.GetRite )|l] — не истинное отражение божественной мудрости?\n\nСвет падает на распятье, и внутри зарождается надежда."
 pam_secular_faith_events.0027.a: "[new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )] — вот чего требует [ROOT.Char.GetFaith.HighGodName]!"
 pam_secular_faith_events.0027.b: "Возможно, [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )|l] подойдёт?"
 pam_secular_faith_events.0027.c: "Меня ждёт погибель. И остальных тоже…"
 pam_secular_faith_events.0028.t: "Покой на душе"
 pam_secular_faith_events.0028.desc: "[ROOT.Char.GetFaith.HouseOfWorship] встречает меня тишиной. Я опускаюсь на колени, и свет [ROOT.Char.GetFaith.HighGodNamePossessive] наполняет мою душу.\n\n[old_tenet.GetName( ROOT.Char.GetRite )] открывает мне истину. Впервые в жизни я ощущаю такое спокойствие! Как не поделиться этим счастьем с другими?"
 pam_secular_faith_events.0028.a: "Я найду благодарных слушателей…"
 pam_secular_faith_events.0028.b: "[forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )] — моя настоящая страсть!"
 pam_secular_faith_events.0028.c: "Где [ROOT.Char.Custom('GetWritingMaterial')|l]? Мне нужно излить свои чувства."
 pam_secular_faith_events.0029.t: "Визит мертвеца"
 pam_secular_faith_events.0029.desc: "«Проснись, [ROOT.Char.GetFirstNameNoTooltip]! — произносит знакомый голос. — «Я, [departed.Custom2( 'RelationToMeShort', root_scope )], [Select_CString(departed.IsFemale, 'явилась', 'явился')] к тебе в час нужды».\n\nЯ вздрагиваю и покрываюсь испариной. Призрак застывает на мгновение, а затем растворяется в воздухе.\n\nЭто что, [Select_CString(departed.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', departed )]?"
 pam_secular_faith_events.0029.a: "[Select_CString(departed.IsFemale, 'Она', 'Он')] присматривает за мной."
 pam_secular_faith_events.0029.b: "Это какое-то предупреждение?"
 pam_secular_faith_events.0029.c: "Игры разума, не более."
 pam_secular_faith_events.0030.t: "Анахорет"
 pam_secular_faith_events.0030.desc: "«Я жажду ощутить близость [ROOT.Char.GetFaith.HighGodNamePossessive], — торжественно произносит [Select_CString(would_be_anchorite.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )] [would_be_anchorite.GetFirstName]. — Мне нужно оказаться в одиночестве, вдали от страстей бренного мира».\n\n[Select_CString(would_be_anchorite.IsFemale, 'Она', 'Он')] задумчиво наблюдает, как [ROOT.Char.Custom('ResidenceBuilding')|l] наполняется светом, и легко касается блика на стене.\n\n[church_scope.GetName] — моё призвание, а [ROOT.Char.GetFaith.HouseOfWorship|l] — прекрасное место. Я хочу уединиться там и посветить остаток жизни молитве»."
 pam_secular_faith_events.0030.a: "Мои каменщики помогут воплотить ваше желание."
 pam_secular_faith_events.0030.b: "Нет, я вам этого не позволю."
 pam_secular_faith_events.0031.t: "Спор учёных"
 pam_secular_faith_events.0031.desc: "«Как можно отрицать, что [tenet_1.GetBaseName|l] исполняет высшую волю?» — возмущается [Select_CString(disputant_one.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )] [disputant_one.GetFirstName].\n\n«Глупости! Очевидно же, что [tenet_2.GetBaseName] приближает нас к божественному! Вас что, ничему не учили?» — парирует [Select_CString(disputant_two.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )] [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.a: "Богословские дебаты? Где тут мои записи?.."
 pam_secular_faith_events.0031.b: "Мне импонирует [tenet_1.GetBaseNameNoTooltip|l]."
 pam_secular_faith_events.0031.c: "Мне ближе [tenet_2.GetBaseNameNoTooltip|l]."
 pam_secular_faith_events.0031.d: "Дискуссии — это то, чем живёт [ROOT.Char.Custom('GetCourt')|l]."
 pam_secular_faith_events.0032.t: "Момент искушения"
 pam_secular_faith_events.0032.desc_food: "Я просыпаюсь, пуская слюни. На кухне жарится [ROOT.Char.Custom('RegionalEdibleMeat')|l] и ждёт своего часа [ROOT.Char.Custom('GetRandomRegionalSmallGame')|l]: [ROOT.Char.Custom('GetFoodDetail')] в начинке источает изысканный аромат. [ROOT.Char.Custom('ResidenceBuildingHallsType')] полнится весёлыми голосами и звоном бокалов, в которых плещется [ROOT.Char.Custom('RegionalDrink')|l].\n\nЯ [vice_trait.GetName( GetNullCharacter )|l], и [ROOT.Char.GetFaith.PriestNeuterPlural|l] обязывают меня соблюдать пост… Но разве [ROOT.Char.GetFaith.HighGodName] осудит меня за маленькую слабость?\n\nЖивот предательски урчит, и моя воля слабнет."
 pam_secular_faith_events.0032.a: "[ROOT.Char.GetFaith.HighGodName] простит меня за это."
 pam_secular_faith_events.0032.b: "Нет. Я не буду объедаться в пост."
 pam_secular_faith_events.0032.c: "Откушу кусочек — никто и не заметит."
 pam_secular_faith_events.0033.t: "Проповеди в постели"
 pam_secular_faith_events.0033.desc: "[Select_CString(believing_spouse.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )|l] [believing_spouse.GetFirstName] — человек глубоко верующий. [believing_spouse.GetRite.GetName] вызывает у [Select_CString(believing_spouse.IsFemale, 'неё', 'него')] столь неподдельный интерес, что наши ночи вдвоём нередко перерастают в проповеди.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom('RomanticComplimentAdjective')][Select_CString(ROOT.Char.IsFemale, 'ая', 'ый' )] [believing_spouse.Custom2( 'RelationToMeShort', root_scope )], а ты знаешь, что [new_tenet.Custom('GetGenericTenetSentence')|l]? Правда #EMP удивительно?#!» — спрашивает [Select_CString(believing_spouse.IsFemale, 'она, нежно прижимаясь ко мне', 'он, крепко прижимая меня к себе')].\n\nЭта [Select_CString(believing_spouse.IsFemale, 'её', 'его')] страсть мила мне так же, как и [Select_CString(believing_spouse.IsFemale, 'её', 'его')] улыбка."
 pam_secular_faith_events.0033.a: "Хм, расскажи ещё…"
 pam_secular_faith_events.0033.b: "Это #EMP ты#! [Select_CString(believing_spouse.IsFemale, 'удивительная', 'удивительный')]. Иди-ка сюда!"
 pam_secular_faith_events.0033.c: "Прости, [Select_CString(believing_spouse.IsFemale, 'моя', 'мой')] [believing_spouse.Custom('RomanticComplimentNoun')|l], но мне надо поспать."
 pam_secular_faith_events.0034.t: "Подкидыш"
 pam_secular_faith_events.0034.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] задерживается, что совсем на [Select_CString(chaplain.IsFemale, 'неё', 'него')] не похоже. [ROOT.Char.GetFaith.HouseOfWorship] почти безмолвствует: тишину нарушает лишь слабое хныканье младенца.\n\n«Смилуйся, [ROOT.Char.GetFaith.HighGodName], — шепчет [chaplain.GetFirstNameNoTooltip], нежно укачивая ребёнка. — Это дитя — [trait_scope.GetName( GetNullCharacter )|l], потому его и бросили… Ни одна душа не заслуживает такой участи».\n\nМладенец сжимает [Select_CString(chaplain.IsFemale, 'её', 'его')] большой палец своей крошечной ручкой."
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName] посылает мне [Select_CString(foundling.IsFemale, 'дочь', 'сына')]."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip] примет [Select_CString(foundling.IsFemale, 'её', 'его')]."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip] вырастит это дитя."
 pam_secular_faith_events.0034.d: "Меня не волнует судьба ребёнка."
 pam_secular_faith_events.0035.t: "Умерщвление плоти"
 pam_secular_faith_events.0035.desc: "Земля забрызгана кровью. Я иду на свист плети и вижу, как [Select_CString(sufferer.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )] [sufferer.GetFirstName] истязает себя, и слёзы текут по [Select_CString(sufferer.IsFemale, 'её', 'его')] щекам.\n\n«Я [sinful_trait.GetName( GetNullCharacter )], и я проигрываю борьбу с грехом, — выдыхает [Select_CString(sufferer.IsFemale, 'она', 'он')]. — Уж лучше эта мука, чем горячка искушения».\n\n«Боль пройдёт, а [ROOT.Char.GetFaith.NegativeAfterLife|l] останется навеки»."
 pam_secular_faith_events.0035.a: "Любопытно… Дайте мне плеть."
 pam_secular_faith_events.0035.b: "Пусть продолжает самобичевание."
 pam_secular_faith_events.0035.c: "Во имя [ROOT.Char.GetFaith.HighGodNamePossessive], прекратите сейчас же!"
 pam_sf_scourge_abandoned_toast: "Акт самоистязания прекращён"
 pam_secular_faith_events.0036.t: "Мудрость [Select_CString(hermit.IsFemale, 'отшельницы', 'отшельника')]"
 pam_secular_faith_events.0036.desc: "Вашего приёма добивается [Select_CString(hermit.IsFemale, 'некая женщина', 'некий мужчина')] в лохмотьях. [Select_CString(hermit.IsFemale, 'Она', 'Он')] называет себя [Select_CString(hermit.IsFemale, 'отшельницей', 'отшельником')] и говорит, что [Select_CString(hermit.IsFemale, 'её', 'его')] дом — [hermit_location.Custom('TerrainTypeProvince')|l] области [hermit_location.GetName].\n\n«Семь ночей [ROOT.Char.GetFaith.HighGodName] не даёт мне уснуть, — решительно заговаривает [Select_CString(hermit.IsFemale, 'она', 'он')]. — Но не в наказание, а дабы наполнить мой разум истинами, которые я [Select_CString(hermit.IsFemale, 'должна', 'должен')] поведать вам».\n\n«Выслушайте меня, а после я вернусь к уединению»."
 pam_secular_faith_events.0036.a: "Какие тайны вы мне откроете?"
 pam_secular_faith_events.0036.b: "Мне нужна ваша мудрость."
 pam_secular_faith_events.0036.c: "Сгинь, попрошайка!"
 pam_secular_faith_events.0037.t: "Сексуальные откровения"
 pam_secular_faith_events.0037.desc_wanderer: "Уже совсем поздно, но [ROOT.Char.Custom('RegionalAlcoholicDrink')|l] льётся рекой. Ко мне придвигается [Select_CString(reveler.IsFemale, 'скиталица', 'скиталец')]."
 pam_secular_faith_events.0037.desc_normal: "Уже совсем поздно, но [ROOT.Char.Custom('RegionalAlcoholicDrink')|l] льётся рекой. Ко мне придвигается [Select_CString(reveler.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', reveler )|l] [reveler.GetFirstName]."
 pam_secular_faith_events.0037.desc: "Теперь моё внимание привлекает лишь [Select_CString(reveler.IsFemale, 'её', 'его')] [reveler.Custom('ObjectifiedFeature')|l].\n\n«Есть молитвы для души, — произносит [Select_CString(reveler.IsFemale, 'она', 'он')], и [Select_CString(reveler.IsFemale, 'её', 'его')] [reveler.Custom('GetClothingArticle')|l] падает на пол, — а есть молитвы для тела. [reveler.Custom('pam_sf_carnal_art')] — мой дар тебе, [ROOT.Char.Custom('RaunchyComplimentNoun')|l]».\n\n[Select_CString(reveler.IsFemale, 'Она', 'Он')] подаёт мне руку. «Наслаждение, которое ты испытаешь, — это даже лучше, чем [ROOT.Char.GetFaith.PositiveAfterLife|l]»."
 pam_secular_faith_events.0037.a: "Задвинь засов. Я жду!"
 pam_secular_faith_events.0037.b: "Прикройся, [Select_CString(reveler.IsFemale, 'бесстыдница', 'бесстыдник')]!"
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "Змеиные кольца"
 pam_sf_carnal_art_2: "Восходящая река"
 pam_sf_carnal_art_3: "Сплетение лоз"
 pam_sf_carnal_art_4: "Сжатые объятия"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "Расщепление бамбука"
 pam_sf_carnal_art_6: "Коварство мары"
 pam_sf_carnal_art_7: "Раскрывающийся лотос"
 pam_sf_carnal_art_8: "Супруга Индры"
 pam_sf_carnal_art_9: "Восставшая кобра"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "Любовный узел"
 pam_sf_carnal_art_11: "Роза и шип"
 pam_sf_carnal_art_12: "Секрет трубадура"
 pam_sf_carnal_art_13: "Потаённое пламя"
 pam_secular_faith_events.0038.t: "Райская пища"
 pam_secular_faith_events.0038.desc: "[Select_CString(reveler.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', reveler )|l] [reveler.GetFirstName] восседает напротив. На столе перед [Select_CString(reveler.IsFemale, 'ней', 'ним')] стоят [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')|l], и [Select_CString(reveler.IsFemale, 'она', 'он')] с ухмылкой накладывает себе очередную тарелку.\n\n«Зачем искать [ROOT.Char.GetFaith.HighGodNamePossessive] с урчащим брюхом? Спелые фрукты, сочное мясо, смех и песни — вот в чём проявляется божественное», — произносит [Select_CString(reveler.IsFemale, 'она', 'он')], поднимая наполненный кубок.\n\n«Мы должны наслаждаться дарами [ROOT.Char.GetFaith.HighGodNamePossessive], [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Отказ от них — великий грех!»"
 pam_secular_faith_events.0038.a: "Может, оно и впрямь так…"
 pam_secular_faith_events.0038.b: "Тогда я устрою пир в честь [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0038.c: "Нет. Вы путаете веру и разврат."
 pam_secular_faith_events.0039.t: "Молитва во тьме"
 pam_secular_faith_events.0039.desc: "[Select_CString(spymaster_scope.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )|l] [spymaster_scope.GetFirstName] подходит ко мне. [Select_CString(spymaster_scope.IsFemale, 'Её', 'Его')] тяготит собственная уловка.\n\n[ROOT.Char.Custom('FormOfAddressForLiege')|l], мы молились вместе, [secret_keeper.GetTitledFirstName|l] и я, и я немного [Select_CString(spymaster_scope.IsFemale, 'солгала', 'солгал')] в надежде, что это развяжет [Select_CString(secret_keeper.IsFemale, 'ей', 'ему')] язык».\n\n«Так и вышло. Прямо там, в обители [ROOT.Char.GetFaith.HighGodNamePossessive], [Select_CString(secret_keeper.IsFemale, 'она созналась', 'он сознался')], что [secret_keeper.Custom('GetSecretCrimeConfessionIndef')|l] — дело [Select_CString(secret_keeper.IsFemale, 'её', 'его')] рук, — [Select_CString(spymaster_scope.IsFemale, 'она', 'он')] переходит на шёпот. — [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )] — вот о чём я веду речь… Быть может, этот обман случился по воле [ROOT.Char.GetFaith.HighGodNamePossessive]?»"
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName] и впрямь действует из тени…"
 pam_secular_faith_events.0039.b: "Это возмутительно! Расскажите, что вам удалось узнать."
 pam_secular_faith_events.0040.t: "Плоть праведных"
 pam_secular_faith_events.0040.desc: "За ужином [Select_CString(scholar.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', scholar )|l] [scholar.GetFirstName] раскрывает потрёпанный том, и начинается очередная лекция.\n\n«[Glossary( 'Исседоны', 'ISSEDONES_GLOSS' )] не хоронили своих мертвецов, [ROOT.Char.Custom('FormOfAddressForLiege')]. Они их поедали! — на одном дыхании выпаливает [Select_CString(scholar.IsFemale, 'она', 'он')]. — Употребить плоть отца с бараниной, а потом сделать реликвию из его золочёного черепа было для них показателем истинной сыновьей любви».\n\n«А знаете, что самое интересное? — усмехается [Select_CString(scholar.IsFemale, 'она', 'он')]. — Даже сам Геродот их не осуждал. #EMP „Обычай,#! — говорил он, — #EMP старше закона”#!»."
 pam_secular_faith_events.0040.a: "О, я достаточно об этом знаю."
 pam_secular_faith_events.0040.b: "Жуткая традиция… Продолжайте!"
 pam_secular_faith_events.0040.c: "Уймитесь ради [ROOT.Char.GetFaith.HighGodNamePossessive]! Весь аппетит отбили."
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "Древнегреческий историк Геродот описывает обычай обитателей отдалённых северных степей. Когда у мужчины умирал отец, его родня забивала скот, смешивала мясо животных с плотью покойника и устраивала торжественный поминальный пир. После череп чистили и золотили, и он становился священной реликвией, которой ежегодно делали подношения. Геродот сравнивал этот обряд с кремацией, практиковавшейся на его родине: не ради осуждения, а чтобы показать силу традиций. У каждого народа своя норма."
 pam_secular_faith_events.0041.t: "Неприкрытая истина"
 pam_secular_faith_events.0041.desc: "Я прогуливаюсь по саду. Как красивы в этом году [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')|l]! Вот только прямо посреди цветника стоит абсолютно [Select_CString(adamite.IsFemale, 'голая незнакомка', 'голый незнакомец')] — не считая листьев, осыпающихся [Select_CString(adamite.IsFemale, 'ей', 'ему')] на плечи, пока [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')|l] одним за другим лишается своих плодов.\n\n«О, [ROOT.Char.GetTitleAsName|l]! Зачем вы прячетесь за одеждой и короной? — спрашивает [Select_CString(adamite.IsFemale, 'она', 'он')], не стесняясь ни меня, ни [ROOT.Char.GetFaith.HighGodNamePossessive]. — Я перенимаю невинность первых людей, которые не стыдились своей наготы».\n\n[Select_CString(adamite.IsFemale, 'Она', 'Он')] впивается зубами во фрукт, и сладкий сок струится по [Select_CString(adamite.IsFemale, 'её', 'его')] телу: «Может, и вам стоило бы»."
 pam_secular_faith_events.0041.a: "Я тоже жажду свободы."
 pam_secular_faith_events.0041.b: "Ешьте, говорите и проваливайте."
 pam_secular_faith_events.0041.c: "В темницу [Select_CString(adamite.IsFemale, 'нарушительницу', 'нарушителя')]!"
 pam_secular_faith_events.0042.t: "Лёгкая дорога"
 pam_secular_faith_events.0042.desc: "[Select_CString(sponsor_character.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )|l] [sponsor_character.GetFirstName] с улыбкой встречает меня в саду и сразу же раскрывает кошель.\n\n[ROOT.Char.Custom('FormOfAddressForLiege')], вам предстоит [GetActivityType( 'activity_pilgrimage').GetName|l]. Позвольте мне оплатить все расходы. В таком путешествии не стоит экономить. Ступайте спокойно и помолитесь за меня».\n\nРаз этот человек так щедр, похоже, он мне всецело доверяет."
 pam_secular_faith_events.0042.a: "Я пройду этот путь с благодарностью в сердце."
 pam_secular_faith_events.0042.b: "Я приму деньги и сохраню их."
 pam_secular_faith_events.0042.c: "Спасибо, но вам эти монеты нужнее."
 pam_sf_pilgrimage_sponsor_tt: "Если [GetActivityType( 'activity_pilgrimage').GetName|l] займёт у вас не дольше #V 7#! лет, [sponsor_character.GetFirstName] получит #P +50#! ко мнению о вас."
 pam_sf_pilgrimage_sponsor_toast: "[Select_CString(sponsor_character.IsFemale, 'Покровительница довольна', 'Покровитель доволен')]"
 pam_secular_faith_events.0043.t: "Чествование [Select_CString(ROOT.Char.IsFemale, 'паломницы', 'паломника')]"
 pam_secular_faith_events.0043.desc: "[Select_CString(holy_man.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )|l] [holy_man.GetFirstName] берёт меня за руки перед алтарём.\n\n«Совершите [GetActivityType( 'activity_pilgrimage').GetName|l], [ROOT.Char.Custom('FormOfAddressForLiege')]. Когда вы вернётесь, [capital_county.GetNameNoTier] узнает о вашем путешествии из моих уст. Людям понравится, что [ROOT.Char.GetTitleAsNameNoTooltip|l] молится за них»."
 pam_secular_faith_events.0043.a: "Значит, в путь."
 pam_secular_faith_events.0043.b: "У меня и мирских дел достаточно."
 pam_sf_extolled_pilgrimage_toast: "Народ ликует"
 pam_secular_faith_events.0044.t: "Благосклонность духовенства"
 pam_secular_faith_events.0044.desc: "[Select_CString(friendly_bishop.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )|l] [friendly_bishop.GetFirstName] подходит ко мне в необычайно хорошем расположении духа.\n\n«У меня сложились весьма дружеские отношения с епископами, аббатами и другими уважаемыми церковными деятелями. Если вам потребуется их мудрость или духовный авторитет, я могу за вас попросить».\n\n[ROOT.Char.GetFaith.PriestNeuterPlural] — народ властолюбивый и своенравный, так что предложение [friendly_bishop.GetFirstNamePossessiveNoTooltip] совсем скоро утратит актуальность."
 pam_secular_faith_events.0044.a: "Тогда попросите за меня."
 pam_secular_faith_events.0044.b: "Ваша дружба — и так большая честь."
 pam_secular_faith_events.0045.t: "Озарение"
 pam_secular_faith_events.0045.desc: "Понимание обрушивается на меня, как гром среди ясного неба.\n\nДоктрины. Догматы. Течения. Верования. Тысячи разрозненных мыслей наконец собираются воедино, и правда предстаёт передо мной."
 pam_secular_faith_events.0045.a: "Судьба готовит меня в лидеры."
 pam_secular_faith_events.0045.b: "Нужно жить моментом."
 pam_secular_faith_events.0046.t: "Общие убеждения"
 pam_secular_faith_events.0046.desc: "[Select_CString(intimate.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', intimate )|l] [intimate.GetFirstName] постоянно твердит, что [shared_tenet.GetName( intimate.GetRite )|l] — единственно верный путь.\n\n«[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )] придаёт смысл всем моим поступкам, — говорит [Select_CString(intimate.IsFemale, 'она', 'он')]. — Больше ничто не имеет для меня такого значения. Кроме тебя, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom('ComplimentAdjective')|l][Select_CString(ROOT.Char.IsFemale, 'ая', 'ый')] [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))|l]».\n\nПо [Select_CString(intimate.IsFemale, 'её', 'его')] щеке стекает слеза: «Просто хочу, чтобы ты [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал')]»."
 pam_secular_faith_events.0046.a: "Общие убеждения укрепят нашу связь!"
 pam_secular_faith_events.0046.b: "Это чувство… похоже на любовь."
 pam_secular_faith_events.0046.c: "Спасибо за доверие."
 pam_secular_faith_events.0047.t: "Присяга [Select_CString(chaplain.IsFemale, 'священнослужительницы', 'священнослужителя')]"
 pam_secular_faith_events.0047.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstName] крестится и склоняется в лёгком поклоне.\n\n«[ROOT.Char.GetFaith.HighGodName] выбирает лишь тех, кто достоин короны. Служа вам, я исполняю высшую волю», — торжественно произносит [Select_CString(chaplain.IsFemale, 'она', 'он')].\n\n«Как я однажды [Select_CString(chaplain.IsFemale, 'приняла', 'принял')] присягу перед ликом [ROOT.Char.GetFaith.HighGodNamePossessive], так я теперь присягаю вам»."
 pam_secular_faith_events.0047.a: "Тогда служите мне верой и правдой."
 pam_secular_faith_events.0047.b: "[ROOT.Char.GetFaith.HighGodName] превыше всего."
 pam_secular_faith_events.0048.t: "Демоны во снах"
 pam_secular_faith_events.0048.desc: "Я просыпаюсь, но не могу пошевелить и пальцем.\n\nПередо мной, зловеще хихикая, вытанцовывает безобразная фигура. Неужто это демон? Мною овладевает страх. «Хе-хе… Бремя твоих грехов велико! Скоро [ROOT.Char.GetFaith.EvilGodNames|l] заберут тебя!»\n\nЯ не знаю, реальность это или иллюзия, но не могу просто так это оставить. Надо попросить прощения у [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0048.a: "Этот сон наверняка что-то значит."
 pam_secular_faith_events.0048.b: "Чепуха какая-то. Буду спать дальше."
 pam_secular_faith_events.0048.c: "[ROOT.Char.GetFaith.HighGodName], спаси меня! Надо срочно покаяться."
 pam_sf_demon_torment_modifier_tt: "Чтобы избавиться от этого модификатора, следует возвести [Concept('holding', 'владение')|E] «[GetBuilding('temple_01').GetName]» или совершить [GetActivityType('activity_pilgrimage').GetName|l]"
 pam_sf_demon_torment_lifted_toast: "Мучения заканчиваются"
 pam_secular_faith_events.0049.t: "Небесная иерархия"
 pam_secular_faith_events.0049.desc: "Звуки, доносящиеся из моей часовни, совсем не похожи на молитву.\n\n«Да,#emp ДА#!, Ваша Светлость! Покажите [Select_CString(lustful_priest.IsFemale, 'этой грешнице', 'этому грешнику')], какое ничтожное место отводит [Select_CString(lustful_priest.IsFemale, 'ей', 'ему')] [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )|l]! — в исступлении кричит [lustful_priest.GetFirstName]. — Я лишь похотливый червь, корчащийся в грязи. #emp НАКАЖИТЕ МЕНЯ!#!»\n\nВо имя [ROOT.Char.GetFaith.HighGodNamePossessive], что там творится?!"
 pam_secular_faith_events.0049.a: "Наверное, это какой-то обряд. Возьму на заметку."
 pam_secular_faith_events.0049.b: "Раз уж это #EMP моя#! часовня, я #emp присоединюсь#!!"
 pam_secular_faith_events.0049.c: "Фу, [lustful_priest.GetFirstNameNoTooltip] — [Select_CString(lustful_priest.IsFemale, 'извращенка', 'извращенец')]?! А это полезно!"
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U][Select_CString(chaplain.IsFemale, 'ая', 'ый')] [chaplain.GetCouncilTitle|l]"
 pam_secular_faith_events.0050.desc: "[ROOT.Char.GetFaith.HouseOfWorship] пустует. Но ни тишина, ни умиротворяющее мерцание свечей не отвлекают меня от нечестивых мыслей.\n\n«Пройдите в исповедальню, [ROOT.Char.Custom('FormOfAddressForLiege')|l], — шёпотом произносит [Select_CString(chaplain.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l]. [Select_CString(chaplain.IsFemale, 'Её', 'Его')] [chaplain.Custom('ObjectifiedFeature')|l] приковывает мой взгляд. — Не стесняйтесь. Говорите, что тяготит вашу душу».\n\n[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )] вызывает благоговение… Но один грех обременяет меня больше остальных. И этот грех — [chaplain.Custom('AdmiredFeature')|l] [chaplain.GetFirstNamePossessive]."
 pam_secular_faith_events.0050.a: "В вашей исповедальне уместятся двое?"
 pam_secular_faith_events.0050.b: "Мною овладели грязные мысли."
 pam_secular_faith_events.0051.t: "Господь Бог"
 pam_secular_faith_events.0051.desc: "#EMP «Я — Господь, твой Бог»,#! — [ROOT.Char.GetFaith.HouseOfWorship|l] наполняется раскатистым голосом. #EMP «Склонись передо мной».#!\n\nЯ падаю на колени. Пелена застилает глаза, и я вытираю с лица кровь.\n\n#EMP «Я, Господь, Бог твой, повелеваю служить мне всем сердцем и всей душою».#! Один голос распадается на сотню, а сотня — на тысячу.#EMP «Если откажешься повиноваться, за такое предательство я прокляну тебя на веки вечные».#!"
 pam_secular_faith_events.0051.a: "Слушаюсь и повинуюсь…"
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Скоро случится что-то ужасное… или прекрасное!#!"
 pam_sf_lord_your_god_tt: "Прошу, [ROOT.Char.GetFaith.HighGodName]… Смилуйся надо мной."
 pam_sf_voice_of_jesus_toast: "Глас Христа"
 pam_sf_stroke_of_god_toast: "Кара Господня"
 pam_secular_faith_events.0052.t: "После кончины"
 pam_secular_faith_events.0052.desc: "[ROOT.Char.GetFaith.HouseOfWorship], где [resting_church.GetNameNoTier|l] раскрывает своё сердце, тонет в величественной тишине. [Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstName] останавливается перед обветшавшими надгробиями тех, кто правил до меня.\n\n«По воле [ROOT.Char.GetFaith.HighGodNamePossessive] вы прожили дольше, чем большинство из них, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. Пора задуматься о похоронах».\n\n«Мы можем увековечить ваш лик в камне. Или вам милее [Glossary( 'простое облачение', 'AD_SUCCURRENDUM_GLOSS' )|l] [Select_CString(ROOT.Char.IsFemale, 'монахини', 'монаха')]?"
 pam_secular_faith_events.0052.a: "Лик в камне… Только помоложе и посимпатичнее."
 pam_secular_faith_events.0052.b: "Хватит и монашеского одеяния."
 pam_secular_faith_events.0052.c: "Я пока не собираюсь умирать."
 pam_sf_effigy_planned_tt: "Если после вашей смерти пройдут [GetActivityType( 'activity_funeral').GetName|l], их организатор получит [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#![Concept('prestige', 'престижа')|E]"
 pam_sf_cowl_burial_planned_tt: "Если после вашей смерти пройдут [GetActivityType( 'activity_funeral').GetName|l], их организатор получит [piety_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#![Concept('piety', 'благочестия')|E]"
 pam_sf_effigy_unveiled_toast: "Вам установили изваяние"
 pam_sf_cowl_burial_toast: "Вас похоронили в монашеском облачении"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "Обряд #G ad succurrendum#!, подразумевающий постриг в монахи прямо на смертном одре, был широко распространён среди средневековых правителей христианского мира. Умирающие короли надеялись, что, если их похоронят не в шелках, а в простом монашеском облачении, они предстанут пред посмертным судом в окружении смиренных братьев, а не сильных мира сего."
 pam_secular_faith_events.0053.t: "Демонстрация святыни"
 pam_secular_faith_events.0053.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstName] аккуратно поднимает крышку реликвария. Внутри лежит [procession_relic.GetName|l] — сокровище моего дома.\n\n«Если прятать святые артефакты под замком, толку от них не будет, [ROOT.Char.Custom('FormOfAddressForLiege')|l], — произносит [Select_CString(chaplain.IsFemale, 'она', 'он')]. — [Glossary( 'Выставление святыни', 'OSTENSION_GLOSS' )] — вот что должно помочь. Покажите эту вещь людям и благословите каждую улицу в ваших владениях»."
 pam_secular_faith_events.0053.a: "Я лично понесу реликварий."
 pam_secular_faith_events.0053.b: "Я совершу обход в одиночку."
 pam_secular_faith_events.0053.c: "Я не смею касаться святыни."
 pam_sf_procession_gamble_tt: "На улице артефакт может пострадать…"
 pam_sf_relic_jostled_toast: "Вас затолкали в толпе"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "Торжественная демонстрация священных реликвий. По большим праздникам артефакты доставали из хранилищ и проносили по улицам и полям, чтобы таящееся в них благословение коснулось каждого встреченного человека. Процессии, несущие такие предметы, неизменно привлекали внимание и деньги."
 pam_secular_faith_events.0054.t: "Таз и тряпица"
 pam_secular_faith_events.0054.desc: "Из таза у моих ног валит пар. Множество глаз устремлено на меня. Кажется, за мной наблюдают все обитатели [ROOT.Char.Custom('GetCourt_RU_1')]. На стуле напротив сидит [pauper.Custom2('dummy_peasant_profession', pauper)]. [Select_CString(pauper.IsFemale, 'Она', 'Он')] явно нервничает. [Select_CString(pauper.IsFemale, 'Её', 'Его')] босые ноги покрывает толстый слой грязи. Запах… непередаваемый.\n\nВ этот вечер сам Спаситель преклонил колени с тряпицей в руке. Пора начинать [Glossary( 'обряд омовения', 'MANDATUM_GLOSS' )].\n\nКак мне поступить: опуститься на колени или нет?"
 pam_secular_faith_events.0054.deviant: "#EMP Я вылижу эти прекрасные ноги языком.#!"
 pam_secular_faith_events.0054.a: "Встать на колени и взять тряпицу в руку."
 pam_secular_faith_events.0054.b: "Встать на колени и поцеловать усталые ноги."
 pam_secular_faith_events.0054.c: "Нет, я не могу… Уберите от меня таз."
 pam_sf_odorous_feet_tt: "Быть может, это обряд приблизит меня к святости… или же меня стошнит от вони"
 pam_sf_odorous_feet_toast: "Тяжёлый смрад"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "Обряд омовения ног получил своё название (Mandatum) от фразы Христа, произнесённой на Тайной вечере: #G «Mandatum novum do vobis»#! — «Новую заповедь даю вам». Каждый год, в четверг перед Пасхой, императоры Константинополя и все западные короли преклоняли колени перед нищими, омывали их ноги тёплой водой и втирали серебро в ладони. На один вечер самый могущественный человек становился слугой избранного христарадника."
 pam_secular_faith_events.0055.t: "Бронзовый глас"
 pam_secular_faith_events.0055.desc: "Старый колокол [bell_church.GetName] пошёл трещинами, и его отлили заново. Сегодня он сверкает на солнце так, что глазам делается больно. Под ним стоит [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] с водой, священным елеем и солью.\n\n«Колокол следует [Glossary( 'окрестить', 'BELL_BAPTISM_GLOSS' )] перед тем, как он начнёт воспевать [ROOT.Char.GetFaith.HighGodNamePossessive], — настаивает [Select_CString(chaplain.IsFemale, 'она', 'он')]. — Омыть, помазать и дать ему имя. И тогда ни буря, ни сам дьявол не смогут заглушить его глас»."
 pam_secular_faith_events.0055.a: "Что ж, да будет так."
 pam_secular_faith_events.0055.b: "У бронзы нет души. Так говорится в капитуляриях."
 pam_secular_faith_events.0055.c: "Быстро благословим его, а потом пусть звонит."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "Раньше церковные колокола крестили так же, как и людей. Их окропляли святой водой, помазывали елеем и называли в честь святых: у некоторых из них даже были крёстные. Хотя в своём #G «Всеобщем увещании»#! от 789 года Карл Великий запретил крестить колокола, этот обычай сохранялся ещё долгое время. Люди считали, что колокольный звон отгоняет бури, град и демонов. Позже на многих колоколах стали отливать фразу #G «Fulgura frango»#!, которая переводится как «Зарницу укрощаю»."
 pam_secular_faith_events.0056.t: "Воробей в зале"
 pam_secular_faith_events.0056.desc: "Из зимней ночной мглы в [ROOT.Char.Custom('ResidenceBuildingHallType')] залетает воробей. Под дружный смех он проносится по залу, сквозь дым от факелов, а потом влетает в открытое [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\n[ROOT.Char.Custom('GetCourt')] оглашается дружным смехом, но [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] не разделяет общего веселья:\n\n«[Glossary( 'Человеческая жизнь', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')], — лишь краткий миг света и тепла посреди мрака. И только [ROOT.Char.GetFaith.HighGodName] знает, что он в себе таит»."
 pam_secular_faith_events.0056.scholar: "Беда говорил то же самое."
 pam_secular_faith_events.0056.a: "Давайте же насладимся этим кратким мигом."
 pam_secular_faith_events.0056.b: "Это же просто птица. Налейте ещё вина."
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "По рассказам Беды, советник короля Эдвина Святого сравнил человеческую жизнь с воробьём, залетевшим в пиршественный зал одной зимней ночной. Он появился из бури, пронёсся по тёплым чертогам и снова исчез во тьме. Советник утверждал, что если новая вера может пролить свет на тайну, скрывающуюся во мраке, то её стоит принять. В итоге Эдвин так и сделал."
 pam_secular_faith_events.0057.t: "Церковный эль"
 pam_secular_faith_events.0057.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] стоит во дворе церкви [ale_church.GetName] посреди столов, за которыми сидит добрая половина прихода, и бочек — видать, [GetBuilding('breweries_01').GetName] работает исправно, — с полной кружкой в руке.\n\n«Наша крыша прохудилась, [ROOT.Char.Custom('FormOfAddressForLiege')], а денег на её починку не хватает. Братья варят пиво и продают его, чтобы накопить на ремонт. Ну и сами, как видите, не чураются [Glossary( 'церковного эля', 'CHURCH_ALE_GLOSS' )]».\n\n«Эль — дело хорошее. Хотите кружечку?»"
 pam_secular_faith_events.0057.a: "Не откажусь. Ради крыши."
 pam_secular_faith_events.0057.b: "Оставьте пиво себе. Я заплачу за крышу."
 pam_secular_faith_events.0057.c: "Как можно пить на святой земле? Вылейте эту дрянь."
 pam_sf_church_ale_gamble_tt: "Вы выпиваете кружку. Потом ещё одну, и ещё… а в приходе пиво крепкое…"
 pam_sf_church_ale_toast: "Утреннее похмелье"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "Во время престольного праздника на церковном дворе продавали эль, сваренный из пожертвованного солода. Вырученные средства шли на нужды церкви: починку протекающей крыши, отливку нового колокола, выпечку хлеба для бедняков. Каждый синод осуждал пьянство на святой земле, но пиво всё равно продолжали варить. Доход деревенских церквей от продажи эля в несколько раз превышал десятину."
 pam_secular_faith_events.0058.t: "Quid Mus Sumit?"
 pam_secular_faith_events.0058.desc: "Ко мне в комнату врывается [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] с лицом, бледным как смерть. В руке [Select_CString(chaplain.IsFemale, 'она', 'он')] аккуратно, словно боясь обжечься, держит серебряный [Glossary( 'ларчик', 'PYX_GLOSS' )].\n\n«Мышь, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ночью она отгрызла замок и съела [Glossary( 'освящённый хлеб', 'RESERVED_HOST_GLOSS' )]!»\n\nОт потрясения [Select_CString(chaplain.IsFemale, 'она', 'он')] едва может говорить: «Учёные задаются вопросом „[Glossary( 'Что съела мышь', 'QUID_MUS_SUMIT_GLOSS' )]?” Так что же? И что мне делать?»"
 pam_secular_faith_events.0058.scholar: "Не волнуйся. Это всего лишь хлеб."
 pam_secular_faith_events.0058.mean: "#EMP Мышь#! полакомилась плотью [ROOT.Char.GetFaith.HighGodNamePossessive]?! Как можно было допустить такое? [ROOT.Char.Custom('GetCourt')] больше не место для тебя!"
 pam_secular_faith_events.0058.a: "Купи ларец с замком понадёжнее."
 pam_secular_faith_events.0058.b: "Значит, теперь эта мышь проклята! Ха!"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! или «Что съела мышь?» — вопрос, который на полном серьёзе обсуждали схоласты. Если мышь съела освящённую облатку, значит ли это, что она отведала божественной плоти? Согласно церковному праву, на священников, которые халатно относятся к выполнению своих обязанностей, накладывают суровую епитимью, но многие богословы считают, что мышь не способна постичь Христа. Для нечестивых созданий гостия — это просто хлеб. И ничего более."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "Небольшой ларец с крышкой — обычно серебряный или позолоченный — где хранятся освящённые облатки. Согласно церковному праву, священник обязан чистить его, своевременно запирать и защищать от нечестивцев и голодных прихожан."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "Хлеб, освящённый на мессе, хранился в церкви. Больные и умирающие могли получить его в любое время. После обряда хлеб считался телом Господним, поэтому его оберегали как реликвию."
 pam_secular_faith_events.0059.t: "День Господен"
 pam_secular_faith_events.0059.desc: "На рассвете мы узнали, что [sighting_province.Custom('GetTerrainTypePlural')] графства [sighting_county.GetBaseNameNoTier] кишат дичью. По слухам, там водится [sighting_county.Custom('GetAnimalAdjective')] [sighting_county.Custom('GetAnimalType')]. Гончие лают, лошади нетерпеливо скребут копытами, но [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] встаёт прямо у ворот.\n\n«Сегодня [Glossary( 'день отдыха', 'LORDS_DAY_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. Колокол прозвонил, скоро начнётся месса!»\n\n«[ROOT.Char.GetFaith.HighGodName] дал вам шесть дней для езды верхом. Зачем вам ещё один?»"
 pam_secular_faith_events.0059.a: "Расседлать лошадей! Послушаем мессу."
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')] ждать не будет. Вперёд!"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "Первый день недели считался святым в память о воскресении Господнем. В этот день церковные соборы запрещали подневольный труд, торговлю и праздные развлечения, а христианские короли закрепили эти ограничения в законах. Тем не менее, многие вельможи полагали, что мужские забавы, как и исповедь — это только их с богом дело."
 pam_secular_faith_events.0060.t: "Беззаботная жизнь"
 pam_secular_faith_events.0060.desc: "Ох, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]! Сколько печалей хранят твои улицы… Я еду по одной из них, размышляя о пустой казне и других своих бедах, и тут замечаю попрошайку.\n\n[Select_CString(hermit.IsFemale, 'Она', 'Он')] танцует, забыв обо всех заботах и тревогах. Кажется, будто этот человек принял своё место в мире и обрёл внутреннюю гармонию. Вот она — душа, свободная от страданий!\n\nВозможно, [Select_CString(hermit.IsFemale, 'ей', 'ему')] известно того, чего не знают другие?"
 pam_secular_faith_events.0060.a: "Чем меньше мы имеем, тем мы свободнее!"
 pam_secular_faith_events.0060.b: "Покрою-ка свою клетку позолотой!"
 pam_secular_faith_events.0060.c: "Нужно поскорее спрятаться от дождя."
