l_russian:
 ecumenical_council_events_josh.0001.t: "Убийство во время повечерия"
 ecumenical_council_events_josh.0001.desc: "Верующие всегда предсказуемы. [murder_target.GetTitledFirstName] склоняется в поклоне, читая [Glossary( 'повечерие', 'COMPLINE_GLOSS' )]; я же терпеливо жду, затаившись в тенях.\n\nДолгая молитва всегда притупляет внимание чтеца. Кроме нас, здесь никого нет, а из одежды — церковной или даже обычной бархатной — получается неплохая удавка…"
 ecumenical_council_events_josh.0001.a: "Затянуть [Select_CString(murder_target.IsFemale, 'ей', 'ему' )] воротник."
 ecumenical_council_events_josh.0001.a.tt: "Немного туговато…"
 ecumenical_council_events_josh.0001.a.tt2: "[Select_CString(murder_target.IsFemale, 'Она', 'Он' )] вырывается из моей хватки"
 ecumenical_council_events_josh.0001.a.toast.success: "Успешное убийство"
 ecumenical_council_events_josh.0001.a.toast.failure: "Безуспешное убийство"
 ecumenical_council_events_josh.0001.a.flavor: "Так долго молятся только грешники…"
 ecumenical_council_events_josh.0001.b: "Нет, нельзя так поступать во время молитвы…"
 COMPLINE_GLOSS: "Повечерие — богослужение, совершаемое после вечерней трапезы. Последняя молитва литургии часов — последовательности ежедневных христианских богослужений."
 ecumenical_council_events_josh.0010.t: "Святой праздник"
 ecumenical_council_events_josh.0010.desc: "Собравшиеся священнослужители преисполнены радости: нет для них ничего более счастливого, чем восславлять тех, кто указывает нам путь. В этом месяце самых больших почестей удостоится [monthly_saint.GetTitledFirstName].\n\n«Во имя [ROOT.Char.GetFaith.HighGodNamePossessive] сегодня мы будем отправлять богослужение»."
 ecumenical_council_events_josh.0010.a: "Посвятить мессу."
 ecumenical_council_events_josh.0010.b: "Я прочитаю проповедь."
 ecumenical_council_events_josh.0010.c: "Просто исполним ещё один псалом или гимн."
 ecumenical_council_events_josh.0011.t: "Как гром"
 ecumenical_council_events_josh.0011.desc: "Я приветствую собравшихся и окидываю взглядом толпу. Мой взор непроизвольно задерживается на великанской фигуре: [guest_giant.GetTitledFirstName] возвышается над остальными, словно гора. Под сводами эхом прокатился [Select_CString(guest_giant.IsFemale, 'её', 'его' )] голос: «Приветствую вас, защитники веры!» Нет, никаких сомнений быть не может.\n\nЭтот громоподобный глас — то, что нужно: чтецам псалмов на [Glossary( 'вечерне', 'VESPER_GLOSS' )] как раз не хватает баса…"
 ecumenical_council_events_josh.0011.a: "Пусть читает нам молитвы во имя [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName] и все собравшиеся поражены."
 ecumenical_council_events_josh.0011.b: "Этот сильный голос скорее пригодится мне на дебатах."
 ecumenical_council_events_josh.0011.b.tt: "На [Select_CString(guest_giant.IsFemale, 'неё', 'него' )] теперь можно положиться"
 ecumenical_council_events_josh.0011.b.tt2: "Довериться [Select_CString(guest_giant.IsFemale, 'ей', 'ему' )] можно будет лишь тогда, когда [Select_CString(guest_giant.IsFemale, 'она', 'он' )] получит свою долю"
 ecumenical_council_events_josh.0011.b.toast.success: "Вы убеждаете [Select_CString(guest_giant.IsFemale, 'её', 'его' )] поддержать вас."
 ecumenical_council_events_josh.0011.b.toast.failure: "[Select_CString(guest_giant.IsFemale, 'Она согласна', 'Он согласен' )] поддержать вас, но просит кое-что взамен."
 ecumenical_council_events_josh.0011.b.flavor: "Если [guest_giant.GetTitledFirstName] будет вовремя выкрикивать одобрения, я непременно одержу верх."
 ecumenical_council_events_josh.0011.c: "[Select_CString(guest_giant.IsFemale, 'Она гостья', 'Он гость' )], а не инструмент."
 ecumenical_council_events_josh.0011.c.flavor: "Позволить [Select_CString(guest_giant.IsFemale, 'ей', 'ему' )] найти своё место среди нас."
 ecumenical_council_events_josh.0011.c.tt: "Вы не требуете, чтобы [guest_giant.GetTitledFirstName] [Select_CString(guest_giant.IsFemale, 'участвовала', 'участвовал' )] в хоровом пении или дебатах"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'решили', Select_CString(TARGET_CHARACTER.IsFemale, 'решила', 'решил' ))] поддержать [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] на Вселенском соборе."
 VESPER_GLOSS: "Вечерня — богослужение, совершаемое вечером. В литургии часов — последовательности ежедневных христианских богослужений — обычно предшествует вечерней трапезе."
 ecumenical_council_events_josh.0012.t: "Кольцо епископа"
 ecumenical_council_events_josh.0012.desc: "С самого начала собора [guest_bishoplover.GetTitledFirstName] и [guest_bishop.GetTitledFirstName|l] неразлучны — не заметить это невозможно. К сегодняшней [Glossary( 'заутрене', 'LAUD_GLOSS' )] [guest_bishoplover.GetFirstName] [Select_CString(guest_bishoplover.IsFemale, 'заявилась', 'заявился' )] с опозданием и в крайне неухоженном виде. А что это такое у [Select_CString(guest_bishoplover.IsFemale, 'неё', 'него' )] на пальце — неужели кольцо? Не так давно его [Select_CString(guest_bishop.IsFemale, 'носила', 'носил' )] [guest_bishop.GetFirstName]… Я мягко указываю на это обстоятельство и вопросительно приподнимаю бровь.\n\nОсознав свою промашку, [guest_bishoplover.GetFirstName], зардевшись, с некоторой запинкой отвечает:\n\n«Прошу, только никому не рассказывайте…»"
 ecumenical_council_events_josh.0012.b: "«Отдай мне кольцо — и я буду молчать»."
 ecumenical_council_events_josh.0012.c: "«Это наше личное дело, [ROOT.Char.GetFaith.HighGodName] нам свидетель»."
 ecumenical_council_events_josh.0012.bishopringname: "Кольцо епископа"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nСимвол принадлежности носителя к апостольскому служению."
 LAUD_GLOSS: "Заутреня — богослужение, совершаемое утром. В литургии часов — последовательности ежедневных христианских богослужений — обычно предшествует утренней трапезе."
 ecumenical_council_events_josh.0013.t: "Модное преступление"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U] сегодня приковывает к себе взгляды собравшихся: [Select_CString(fashion_criminal.IsFemale, 'она облачилась', 'он облачился' )] в новую ризу — несомненно, подарок от обожающей [Select_CString(fashion_criminal.IsFemale, 'её', 'его' )] паствы. С шёлковой столы на нас взирает лик [ROOT.Char.GetFaith.WealthGodNamePossessive].\n\nОт возмущения закипает кровь! Что движет [Select_CString(fashion_criminal.IsFemale, 'этой женщиной', 'этим человеком' )] — открытое пренебрежение к заветам #L [fashion_criminal.GetFaith.GetName|l]ой#! веры или же просто тщеславие?"
 ecumenical_council_events_josh.0013.a: "«Уберите это безобразие с глаз моих!»"
 ecumenical_council_events_josh.0013.b: "«Прочь отсюда! Такие, как ты, недостойны божественной милости!»"
 ecumenical_council_events_josh.0013.b.toast.success: "Вы изгоняете [Select_CString(fashion_criminal.IsFemale, 'её', 'его' )]."
 ecumenical_council_events_josh.0013.b.toast.failure: "[Select_CString(fashion_criminal.IsFemale, 'Ей', 'Ему' )] удаётся остаться в совете."
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'надели', Select_CString(TARGET_CHARACTER.IsFemale, 'надела', 'надел' ))] неподобающую для Вселенского собора одежду."
 ecumenical_council_events_josh.0020.t: "Светоч религиозного пыла"
 ecumenical_council_events_josh.0020.desc.intro: "«Узрите: се — столп #L [ROOT.Char.GetFaith.GetName|l]ой#! веры! Вот так поступают праведники, посвятившие себя служению кресту».\n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: "вспоминает, как [faith_battle_memory.GetDescription]. Безбожникам нельзя давать спуску. Мне приятна такая похвала. Я поднимаю меч и выкрикиваю: «За веру!»"
 ecumenical_council_events_josh.0020.desc.fallback: "открыто признаёт мой вклад в поддержку нашей веры. Получить такую похвалу на глазах у священнослужителей крайне приятно; моё сердце готово выпрыгнуть из груди от радости."
 ecumenical_council_events_josh.0020.a: "«Мы победим — во имя [ROOT.Char.GetFaith.HighGodNamePossessive]!»"
 ecumenical_council_events_josh.0020.a.flavor: "Мои действия не оставили присутствующих священнослужителей равнодушными."
 ecumenical_council_events_josh.0020.b: "Буду нежиться в лучах славы."
 ecumenical_council_events_josh.0021.t: "На свету"
 ecumenical_council_events_josh.0021.desc: "Дебаты тянутся без конца. Высоко стоящее солнце бросило через стекло лучи света; я встаю в образовавшийся на полу круг, и неожиданно все присутствующие поворачиваются ко мне.\n\nБожественный свет придаёт веса моим словам. [council_opponent.GetFirstName], [Select_CString(council_opponent.IsFemale, 'моя соперница', 'мой соперник' )] по дебатам, остаётся в тени; внимать тому, что [Select_CString(council_opponent.IsFemale, 'она', 'он' )] говорит, становится ещё сложнее."
 ecumenical_council_events_josh.0021.a: "[council_opponent.GetFirstName] уступит моим доводам."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U] уходит из [Concept('ec_conservatives', 'консерваторов')|E] и присоединяется к [Concept('ec_innovators', 'инноваторам')|E]"
 ecumenical_council_events_josh.0021.b: "Пусть же собравшиеся узрят свет."
 ecumenical_council_events_josh.0021.b.ct: "До #V 3#! [Concept('ec_conservatives', 'консерваторов')|E] примкнут к [Concept('ec_innovators', 'инноваторам')|E]"
 ecumenical_council_events_josh.0021.c: "Пусть прочувствуют моё великолепие."
 ecumenical_council_events_josh.0021.c.ct: "Добавляет #V 50#! вложение в [Concept('appointment', 'назначение')|E] на [Concept('clerical_title', 'церковный титул')|E]"
 ecumenical_council_events_josh.0022.t: "Сплочённые верой"
 ecumenical_council_events_josh.0022.desc: "[host.GetTitledFirstName|U] [Select_CString(host.IsFemale, 'увидела', 'увидел')] на соборе превосходную возможность сплотить своих последователей перед лицом угрозы извне. Мы собрались втроём: я, [Select_CString(host.IsFemale, 'она', 'он')] и [alliance_target.GetTitledFirstName].\n\n«Ваша вера непоколебима. Так будьте же непоколебимы и вы сами. Осмельтесь встать плечом к плечу супротив всяких напастей»."
 ecumenical_council_events_josh.0022.a: "Пусть церковь благословит наш союз."
 ecumenical_council_events_josh.0022.a.flavor: "Я воспользуюсь своей репутацией у духовенства, чтобы упрочить союз."
 ecumenical_council_events_josh.0022.b: "Мы построим союз на взаимопонимании."
 ecumenical_council_events_josh.0022.b.toast.success: "[Select_CString(alliance_target.IsFemale, 'Она', 'Он')] соглашается заключить союз."
 ecumenical_council_events_josh.0022.b.toast.failure: "[Select_CString(alliance_target.IsFemale, 'Она', 'Он')] считает подобные предложения оскорбительными."
 ecumenical_council_events_josh.0022.b.flavor: "Достаточно будет и того, что я умею очаровывать людей."
 ecumenical_council_events_josh.0022.c: "Собор — не место для такого."
 ecumenical_council_events_josh.0022.c.flavor: "Достаточно будет уважительного поклона."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'отказались', Select_CString(TARGET_CHARACTER.IsFemale, 'отказалась', 'отказался' ))] заключать неприемлемый союз."
 ecumenical_council_events_josh.0023.t: "Помолитесь за меня"
 ecumenical_council_events_josh.0023.desc: "«Мир тебе, и да снизойдёт на тебя Божья благодать», — произносит [host.GetTitledFirstName|l], благословляя подходящих гостей. Вот она, возможность подобраться поближе к этому столпу веры! Если мне удастся убедить [Select_CString(host.IsFemale, 'её', 'его' )] молиться на [Glossary( 'заутрене', 'LAUD_GLOSS' )] в том числе за меня, тогда, возможно, душа моя будет спасена.\n\n«Подвинься! И прекрати нести околесицу. Тут, вообще-то, очередь», — шёпотом произносит [Select_CString(prayer_opponent.IsFemale, 'вставшая', 'вставший' )] у меня за спиной [prayer_opponent.GetFirstName|U]."
 ecumenical_council_events_josh.0023.a: "«Я могу молиться и за вас — за щедрое пожертвование»."
 ecumenical_council_events_josh.0023.b: "Поцеловать подол облачения"
 ecumenical_council_events_josh.0023.b.tt: "Я делаю так, чтобы мою просьбу услышали"
 ecumenical_council_events_josh.0023.b.tt2: "Я нарушаю этикет, и меня отодвигают в сторону"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U] будет молиться за вас."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U] отметает вашу просьбу."
 ecumenical_council_events_josh.0023.c: "Лучше действительно отойти и постараться вести благочестивую жизнь."
 ecumenical_council_events_josh.0024.t: "Красота таинств"
 ecumenical_council_events_josh.0024.desc: "Некоторым из собравшихся совершенно не терпится поговорить о священных таинствах, поделиться собственными их толкованиями и просто попрепираться. Среди таких — и [tenet_target_a.GetName].\n\n«[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], братья мои. Чтите эти заповеди ради [ROOT.Char.GetFaith.HighGodNamePossessive], ищите в них мудрость, и тогда вы постигнете божественное!».\n\nВ толпе раздаются и утихают возгласы. [tenet_target_b.Custom('FormalComplimentAdjective')|U][Select_CString(tenet_target_b.IsFemale, 'ая', 'ый' )] [tenet_target_b.GetTitledFirstName|l] тем временем с упоением читает какой-то незнакомый текст. Единственное, что мне удаётся разобрать, — это «[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )]»."
 ecumenical_council_events_josh.0024.a: "«Говорите, мудрость, [tenet_target_a.GetFirstNameNoTooltip]?»"
 ecumenical_council_events_josh.0024.b: "Весьма любопытная книга."
 ecumenical_council_events_josh.0024.c: "Волей [ROOT.Char.GetFaith.HighGodNamePossessive] я уже на верном пути."
 ecumenical_council_events_josh.0025.t: "Слишком много богословов"
 ecumenical_council_events_josh.0025.desc: "Неподалёку от сборища раздаётся какой-то гам. Новоприбывшие гости отряхивают с плащей дорожную пыль; их вид кажется мне необычным. Прелаты, бросив несколько косых взглядов и о чём-то пошептавшись, делают им знак: идите с нами. [theologian.GetWomanMan|U] во главе кучки незнакомцев громогласно обращается к остальным:\n\n«Мне пришлось проделать долгий и трудный путь ради того, чтобы мои собратья по вере, такие же [theologian.GetFaith.GetAdherentNamePlural|l], как и я, могли стоять рядом со мной. Наши отцы — святые апостолы — были друг другу словно родные братья. Так почему же меня не пускают к вам?»."
 ecumenical_council_events_josh.0025.a: "За вход придётся заплатить…"
 ecumenical_council_events_josh.0025.a.flavor: "Я вполне могу внести [Select_CString(theologian.IsFemale, 'её', 'его' )] имя в список приглашённых — в самом низу."
 ecumenical_council_events_josh.0025.b: "«Ваши учения — настоящий позор!»"
 ecumenical_council_events_josh.0025.c: "«Как интересно. Давайте позже устроим собственный собор»."
 ecumenical_council_events_josh.0025.d: "Вежливо прогнать [Select_CString(theologian.IsFemale, 'её', 'его' )]."
