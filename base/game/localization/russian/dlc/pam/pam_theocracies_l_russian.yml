 treasury_budget_cardinal_reduction_medium: "Умеренное урезание [Concept('treasury_cardinal_budget', 'бюджета кардиналов')|E]"
 treasury_budget_cardinal_reduction_small: "Небольшое урезание [Concept('treasury_cardinal_budget', 'бюджета кардиналов')|E]"
