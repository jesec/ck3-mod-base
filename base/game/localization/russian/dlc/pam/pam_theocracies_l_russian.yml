l_russian:
 only_theocratic_tt: "[Concept('government', 'Правительство')] [Select_CString(THIS.Char.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', THIS.Char.GetShortUIName))] не позволяет назначать [Concept('theocratic', 'священников')|E] #weak ([THIS.Char.GetGovernment.GetName])#!"
 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U] [Select_CString(THIS.Char.IsFemale, 'должна', 'должен' )] быть частью [Concept('clergy', 'духовенства')|E], или у #L [THIS.Char.GetFaith.GetName|l]ой#! веры должна быть [Concept('doctrine', 'доктрина')|E] «$doctrine_theocracy_lay_clergy_name$»"
 can_be_appointed_interaction_can_inherit_tt: "[THIS.Char.GetWomenMen|U] должны иметь возможность наследовать [Concept('titles', 'титулы')|E] #weak (несовместимо со свойствами «[GetTrait('disinherited').GetName( THIS.Char )]», «[GetTrait('gallivanter').GetName( THIS.Char )]» и «[GetTrait('order_member').GetName( THIS.Char )]»)#!"
 theocracy_lease: "Теократическая аренда"
 theocracy_lease_desc: "Это владение [Concept('leased', 'передано в аренду')|E] [Concept('realm_priest', 'державному священнику')|E] той же [Concept('faith', 'конфессии')|E], что и владетель.\n\nАрендатор будет предоставлять [Concept('tax', 'налог')|E] и [Concept('levies', 'ополчение')|E] как своему [Concept('liege', 'сюзерену')|E] (если одобряет), так и [Concept('religious_superior', 'вышестоящему духовному лицу')|E].\n\nВышестоящим духовным лицом считается [Concept('realm_priest', 'державный священник')|E] [Concept('liege', 'сюзерена')|E] при условии, что у них общая конфессия. В ином случае таковым считается [Concept('head_of_faith', 'глава конфессии')|E]."
 ecclesiastical_lease: "Церковная аренда"
 ecclesiastical_lease_desc: "Это владение [Concept('leased', 'передано в аренду')|E] [Concept('realm_priest', 'державному священнику')|E] [Concept('ecclesiastical', 'церковной')|E] [Concept('faith', 'конфессии')|E] владетеля.\n\nАрендатор будет предоставлять [Concept('tax', 'налог')|E] и [Concept('levies', 'ополчение')|E] своему [Concept('liege', 'сюзерену')|E] (если одобряет), [Concept('religious_superior', 'вышестоящему духовному лицу')|E] и непосредственно [Concept('head_of_faith', 'главе конфессии')|E].\n\nВышестоящим духовным лицом считается [Concept('holder', 'владетель')|E] церковного [Concept('clerical_title', 'титула')|E], к которому относится столица сюзерена. В ином случае таковым считается [Concept('head_of_faith', 'глава конфессии')|E]."
 budget_allocation_cardinal_law: "Распределение бюджета кардиналов"
