l_russian:
 pam_clergy_events.0001.t: "Quo nomine vis vocari?"
 pam_clergy_events.0001.desc: "[Select_CString(chaplain.IsFemale, 'Моя', 'Мой')] [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] смотрит на следующую пустую строку в списке преемников святого Петра — важнейшем документе, в котором закреплено наше [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )|l].\n\n#emp «Имя, которое вы выберете, будут вспоминать даже спустя тысячу поколений».#! \n\n[Select_CString(chaplain.IsFemale, 'Она', 'Он')] ставит перо на бумагу и готовится записывать.\n\n#emp «Quo nomine vis vocari?»#!"
 pam_clergy_events.0001.a: "Это имя не забудут во веки веков."
 pam_clergy_events.0003.t: "Новая интерпретация догмата"
 pam_clergy_events.0003.desc: "[pam_recast_pope.GetTitledFirstName] меняет один из догматов [pam_recast_rite.GetNameNoTooltip|l]ого течения: [tenet_to_remove.GetBaseName] уходит в прошлое, и это место занимает [tenet_to_add.GetBaseName]."
 pam_clergy_events.0010.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U] и [Select_CString(actor.IsFemale, 'её', 'его')] воля"
 pam_clergy_events.0010.desc.intro: "Как [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l] я [Select_CString(cardinalate.GetHolder.IsFemale, 'обязана', 'обязан')] исполнять волю [Select_CString(actor.IsFemale, 'Святого Отца', 'Святой Матери')].\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "Как [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l] я высоко ценю то покровительство, которое мне оказывает [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]. [Select_CString(actor.IsFemale, 'Она', 'Он')] всегда поддерживает меня советом и помогает мне выполнять свои обязанности.\n\n"
 pam_clergy_events.0010.desc: "В своей безграничной мудрости [actor.GetTitledFirstName|l] [Select_CString(actor.IsFemale, 'поручила', 'поручил')] мне важную задачу по"
 pam_clergy_events.0010.desc.develop: "развитию общественной инфраструктуры во владении [archdiocese.GetName], дабы местные [recipient.GetFaith.GetAdherentNamePlural|l] были обеспечены всем необходимым."
 pam_clergy_events.0010.desc.convert_faith: "искоренению того лжеучения, которое исповедуют [ROOT.Char.Custom('GetUnbelieverNamePlural')|l] во владении [archdiocese.GetName] и его окрестностях, и их дальнейшему обращению в нашу веру."
 pam_clergy_events.0010.desc.increase_control: "работе с местными жителями во владении [archdiocese.GetName] и наведению там порядка."
 pam_clergy_events.0010.desc.cultural_fascination: "содействию [Select_CString(actor.IsFemale, 'её', 'его')] #L [actor.GetCulture.GetName|l]им#! собратьям в изучении новых технологий."
 pam_clergy_events.0010.desc.epidemic_resistance: "борьбе с распространением болезни во владении [archdiocese.GetName] за счёт тех ресурсов, которыми располагает церковь."
 pam_clergy_events.0010.desc.improve_legitimacy: "повышению легитимности #L [recipient.GetFaith.GetName|l]их#! правителей во владении [archdiocese.GetName]."
 pam_clergy_events.0010.desc.undermine_legitimacy: "подрыву легитимности #L [recipient.GetFaith.GetName|l]их#! правителей во владении [archdiocese.GetName]."
 pam_clergy_events.0010.a: "«Будет исполнено, [actor.Custom('FormOfAddressForLiege')]!»"
 pam_clergy_events.0010.b: "Налоги можно потратить и на более полезные вещи…"
 pam_clergy_events.0030.t: "Habemus Papam"
 pam_clergy_events.0030.t.female: "Habemus Mamam"
 pam_clergy_events.0030.desc: "Над городом [new_pope.GetCurrentLocation.GetName] поднимается белый дым — избран новый [new_pope.GetTitledFirstName|l].\n\n«Святые апостолы Пётр и Павел, на силу и власть которых мы полагаемся, да ходатайствуют за нас пред Господом! И благословение Бога Всемогущего, Отца, и Сына, и Святого Духа, да снизойдёт на вас и пребудет всегда».\n\n«Аминь»."
 pam_clergy_events.0030.a: "Слава престолу святого Петра!"
 pam_clergy_events.0030.b: "Похоже, появился лжепророк."
 pam_clergy_events.0030.b.tt: "[Concept('decision', 'Решение')|E] «[GetDecisionWithKey('declare_antipope_decision').GetName]» дешевле в течение #V 15 лет#!"
 pam_clergy_events.0030.aa: "Кому какое дело до забот церкви?"
 pam_clergy_events.0030.aa.tt: "Последующие события Habemus Papam будут появляться в виде сообщений"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName] избран [Concept('head_of_faith', 'главой конфессии')|E]."
 pam_clergy_events.0040.opening: "[head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]!"
 pam_clergy_events.0040.desc: "Ввиду упадка Священной коллегии и вашего искреннего благочестия мною было принято решение пожаловать вам титул кардинала. Пусть ваша набожность и мудрость послужат делу укрепления церкви в столь трудный час."
 pam_clergy_events.0040.appoint_tt: "Вас назначили [Concept('cardinal', 'кардиналом')|E]"
 pam_clergy_events.0040.a: "Я беру на себя это священное бремя."
 pam_clergy_events.0041.opening: "Кафедре святого Петра:"
 pam_clergy_events.0041.desc: "В коллегии кардиналов не хватает людей. Самые благочестивые [Select_CString(ROOT.Char.IsFemale, 'женщины', 'мужи')] нашей державы покинули коллегию — и на их место до сих пор никто не назначен!\n\nЯ отказываюсь бросать церковь на произвол судьбы. Отныне красная шапка будет моей."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U] провозглашает себя [Concept('cardinal', 'кардиналом')|E]"
 pam_clergy_events.0041.a: "Подобная дерзость не останется без ответа."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "Места в коллегии пустовали, и церковь не могла ждать положенных церемоний. Самые благочестивые из нас уже надели красные шапки, и коллегия вновь стала полноценной.\n\nНадеемся, вы простите нам эту поспешность."
 pam_clergy_events.0042.a: "От полной коллегии больше проку, чем от пустой."
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "Тектонические сдвиги в конфессии"
 pam_clergy_events.0051.desc: "Моя кафедра во владении [county.GetNameNoTier|U] ходит подо мной ходуном. Души, спасению которых была посвящена моя жизнь, теперь называются [new_faith.GetAdherentNamePlural|l] и возносят иные молитвы.\n\nНужно ли мне обратиться, чтобы сохранить контроль? Я смогу заботиться о народе державы [title.GetName], но смогу ли я помочь тем, кто больше не [old_faith.GetAdherentNamePlural|l]? Принесёт ли нам пользу приверженность [new_faith.GetNameNoTooltip|l]ому учению?!"
 pam_clergy_events.0051.a: "Что угодно ради служения моей пастве."
 pam_clergy_events.0051.a.keep_see_tt: "Вы сохраняете контроль над державой [title.GetName]"
 pam_clergy_events.0051.b: "Только другие [old_faith.GetAdherentNamePluralNoTooltip|l] достойны моего служения."
 pam_clergy_events.0051.b.tt: "Все ваши [Concept('landed', 'земельные')|E] [Concept('titles', 'титулы')|E] уничтожены"
 pam_clergy_events.0051.c: "Я принимаю конец моей службы."
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Вы построите [Concept('camp', 'лагерь')|E] [Concept('adventurer', 'авантюристов')|E]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER [Concept('game_over', 'Конец игры')|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "Конец державы [title.GetNameNoTooltip]"
 pam_clergy_events.0052.desc: "Независимо от причин я больше не могу быть пастырем державы [title.GetDefinitiveName]. Когда-то церковь вложила эти земли в мои руки, но теперь они утекли из них."
 pam_clergy_events.0052.a: "Да будет так."
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "[new_prelate.GetDynasty.GetNameNoTooltip] на престоле Святого Петра"
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetFaith.ReligiousHeadName|U] [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.antipope: "[new_prelate.GetDynasty.GetNameNoTooltip] теперь [new_prelate.GetFaith.ReligiousHeadTitleName|U]"
 pam_clergy_events.0060.t.archbishop: "[new_prelate.GetDynasty.GetNameNoTooltip] принимает жезл"
 pam_clergy_events.0060.desc.intro: "Мы стремились направлять христианство, будь то с престола или кафедры. И вот по воле [new_prelate.GetFaith.HighGodNamePossessive|U] династия [new_prelate.GetDynasty.GetName] достигнет новых высот.\n\n"
 pam_clergy_events.0060.desc.pope: "[Select_CString(new_prelate.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] [Select_CString(new_prelate.IsFemale, 'взошла', 'взошёл' )] на престол Святого Петра, став наместником [new_prelate.GetFaith.HighGodNamePossessive] на земле."
 pam_clergy_events.0060.desc.head_of_faith: "[Select_CString(new_prelate.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] теперь владеет титулом [prelate_title.GetDefinitiveName]."
 pam_clergy_events.0060.desc.hof_outro: "Короли и императоры — не более чем дети, играющие в тени [Select_CString(new_prelate.IsFemale, 'святой матери', 'святого отца' )]. Теперь в распоряжении династии [new_prelate.GetDynasty.GetNameNoTooltip] находятся бесчисленные [new_prelate.GetFaith.BishopMalePlural|l]."
 pam_clergy_events.0060.desc.antipope: "Было объявлено, что [Select_CString(new_prelate.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] отныне [new_prelate.GetFaith.ReligiousHeadName|U], притом что есть ещё один. Теперь каждый [new_prelate.GetFaith.GetAdherentName|l] должен решить, кто является представителем [new_prelate.GetFaith.HighGodNamePossessive|U]. А до тех пор души всех верующих в опасности."
 pam_clergy_events.0060.desc.archbishop: "[Select_CString(new_prelate.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] [Select_CString(new_prelate.IsFemale, 'получила', 'получил' )] назначение в державу [prelate_title.GetDefinitiveName]. Десятина, аббатства и рукоположение священников теперь находятся в ведении династии [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\n[Select_CString(new_prelate.IsFemale, 'Она', 'Он' )] придерживается [new_prelate.GetFaith.GetNameNoTooltip|l]ой веры, а не [ROOT.Char.GetFaith.GetNameNoTooltip|l]ой, но мы всё равно семья."
 pam_clergy_events.0060.a: "Благословение как для церкви, так и для династии [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.a.antipope: "Я не планирую унаследовать этот спор."
 pam_clergy_events.0060.b: "Думаю, [prelate_title.GetDefinitiveNameNoTooltip] заслуживает более пристального внимания."
 pam_clergy_events.0060.b.antipope: "Только мне под силу разрешить этот кризис."
 pam_clergy_events.0060.b.tt: "@warning_icon! Вы откажетесь от своего текущего персонажа и в будущем не сможете продолжить игру за него.\n\n#TUT Когда умрёт [new_prelate.GetShortUINameNoTooltip], вы продолжите игру за своего [Concept('player_heir', 'наследника-игрока')|E], который наследует [Concept('ecclesiastical', 'церковную')|E] должность через [Concept('appointment', 'назначение')|E] или выборы, а не по праву [Concept('dynasty', 'крови')|E].#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U] принадлежит к иной конфессии. Вы продолжите игру как [new_prelate.GetFaith.GetAdherentName|l]."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U] занимает свою должность в знак протеста, а не в результате выборов и является целью для всех, кто не признаёт эти притязания."
