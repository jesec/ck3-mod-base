l_russian:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "Религиозные штудии"
 study_scripture_action: "Религиозные изыскания"
 study_scripture_desc: "Я углублюсь в изучение священных текстов — чему учат [GetPlayer.GetFaith.ReligiousText] и доктрины моей веры, и какие тайны лежат за их пределами."
 study_scripture_desc_general: "$study_scripture$ — это [Concept('personal_scheme', 'личные происки')|E], дающие шанс получить [Concept('piety', 'благочестие')|E], [Concept('skill', 'навыки')|E] и [Concept('trait', 'свойство')|E] «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]»."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "Вы улучшаете свои навыки, повышаете благочестие или получаете возможность"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "Вы приняли догмат «[GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]»: $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "Вы приняли догмат «[GetTenetType('tenet_scholasticism').GetBaseName]»: $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "[learning|E] вашего церковного наставника: $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "У вас есть модификатор «[GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip]»: $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "[stress|E] мешает вам сосредоточиться на учёбе: $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "У вас есть свойство «[GetTrait('zealous').GetName( owner )]»: $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "У вас есть свойство «[GetTrait('cynical').GetName( owner )]»: $VALUE|+0=$"
 pam_study_scripture_decision: "[ROOT.Char.GetFaith.ReligiousText|U] — изучить тексты"
 pam_study_scripture_decision_desc: "Ни [ROOT.Char.GetFaith.ReligiousText], ни доктрины #L [ROOT.Char.GetFaith.GetName|l]ой#! веры не появятся сами собой праздному уму. Нужно отложить прочие дела и посвятить свободные часы учёбе: изучать, размышлять и подавать пастве пример стремления к знаниям."
 pam_study_scripture_decision_tooltip: "Начало [Concept('scheme', 'происков')|E] «[GetScheme('study_scripture').GetTypeName]» в отношении себя"
 pam_study_scripture_decision_tt: "Вы начинаете [Concept('scheme', 'происки')|E] «[GetScheme('study_scripture').GetTypeName]» в отношении себя\n\nОжидаемые награды:\n$EFFECT_LIST_BULLET$ [piety_i][piety|E]\n$EFFECT_LIST_BULLET$ [Concept('trait', 'Свойство')|E] «[GetTrait('confucian_education').GetName( GetNullCharacter )]» / [Concept('trait_level_track_xp', 'опыт свойства')|E]\n$EFFECT_LIST_BULLET$ [Concept('skill', 'Навыки')|E] [learning_i][stewardship_i][diplomacy_i] #weak (до 8)#!\n$EFFECT_LIST_BULLET$ Возможности среди [Concept('clergy', 'духовенства')|E]\n\nНедостатки:\n$EFFECT_LIST_BULLET$ Можно получить [stress_i][stress|E]\n$EFFECT_LIST_BULLET$ Сниженный прирост [prestige_i][Concept('prestige', 'престижа')|E]"
 pam_study_scripture_decision_confirm: "Начнём изучение."
 pam_study_scripture_decision_req_tt: "Вы еще не выполняете [Concept('scheme', 'происки')|E] «[GetScheme('study_scripture').GetTypeName]»"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial Ваши текущие [Concept('personal_scheme', 'личные происки')|E] завершатся#!"
 study_scripture_title: "$study_scripture$:"
 study_scripture_outcome_piety: "$study_scripture_title$награда за усердие"
 study_scripture_outcome_fragment_tt: "#EMP \"[owner.Custom('RandomStudyVerseFragment')]\"#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$постижение текстов"
 study_scripture_outcome_mystery: "$study_scripture_title$взгляд за завесу тайн"
 study_scripture_outcome_stress: "$study_scripture_title$утомительная учёба"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "Светильник ноге моей и свет стезе моей…"
 pam_ss_fragment_psalm_119_165: "Велик мир у любящих закон Твой…"
 pam_ss_fragment_proverbs_9_9: "Дай наставление мудрому…"
 pam_ss_fragment_proverbs_4_7: "Главное — мудрость…"
 pam_ss_fragment_joshua_1_8: "Поучайся в ней день и ночь…"
 pam_ss_fragment_matthew_7_7: "Ищите и обрящете…"
 pam_ss_fragment_james_1_5: "Если же у кого из вас недостаёт мудрости…"
 pam_ss_fragment_2_timothy_2_15: "Старайся представить себя Богу достойным…"
 pam_ss_fragment_verbum_domini: "Verbum Domini manet in aeternum…"
 pam_ss_fragment_generic_1: "Тайны углубляются…"
 pam_ss_fragment_generic_2: "Мудрость коренится…"
 pam_ss_fragment_generic_3: "Тексты раскрывают свой смысл…"
 # Faith-flavored vocabulary for StudyParishWord/StudyPulpitWord/StudySeminaryWord/StudyOfficesWord
 pam_ss_word_parish: "приход"
 pam_ss_word_congregation: "паства"
 pam_ss_word_pulpit: "кафедра"
 pam_ss_word_minbar: "минбар"
 pam_ss_word_lectern: "трибуна"
 pam_ss_word_seminary: "семинария"
 pam_ss_word_madrasa: "медресе"
 pam_ss_word_school: "школа"
 pam_ss_word_offices: "службы"
 pam_ss_word_daily_prayers: "ежедневные молитвы"
 pam_ss_word_daily_rites: "ежедневные ритуалы"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "Оставленное учение"
 pam_lapsed_studies_modifier_desc: "Этот персонаж отчаялся познать священные тексты и оставил это занятие."
 pam_renewed_zeal_modifier: "Возрожденное рвение"
 pam_renewed_zeal_modifier_desc: "После сурового нагоняя этот персонаж вновь посвятил себя учёбе.\n[success_chance|E] происков «[GetScheme('study_scripture').GetTypeName]»: #P +10%#!"
 pam_inspired_study_modifier: "Вдохновение учиться"
 pam_inspired_study_modifier_desc: "Продуманный подарок помогает продолжать эти занятия."
 pam_cloistered_rigor_modifier: "Строгость затворничества"
 pam_cloistered_rigor_modifier_desc: "Эти занятия проходят за закрытыми дверями и с неукоснительной строгостью."
 pam_cloistered_rigor_personal_modifier: "Обучение в уединении"
 pam_cloistered_rigor_personal_modifier_desc: "Этот персонаж удалился от мирских дел, чтобы с неукоснительной строгостью погрузиться в священное знания."
 pam_measured_devotion_modifier: "Размеренное усердие"
 pam_measured_devotion_modifier_desc: "Эти занятия идут своим чередом, в специально отведённые для них часы."
 pam_measured_devotion_personal_modifier: "Усердное изучение Писания"
 pam_measured_devotion_personal_modifier_desc: "Этот персонаж с неизменным и размеренным усердием впитывает священные знания."
 pam_mortified_flesh_modifier: "Умерщвление плоти"
 pam_mortified_flesh_modifier_desc: "Пост и ночные бдения обострили ум, помогая в этих занятиях."
 pam_divine_favor_modifier: "Божественное вмешательство"
 pam_divine_favor_modifier_desc: "Эти занятия проходят под благословением свыше."
 pam_devoted_acolyte_modifier: "Преданный помощник"
 pam_devoted_acolyte_modifier_desc: "Преданный помощник заботится обо всём, что необходимо для этих занятий."
 pam_amanuensis_modifier: "Верный писец"
 pam_amanuensis_modifier_desc: "Верный помощник поддерживает безупречный порядок в записях и страницах."
 pam_persistent_devotions_modifier: "Непоколебимое усердие"
 pam_persistent_devotions_modifier_desc: "Неудачи лишь укрепили дисциплину во время этих занятий."
 pam_renowned_exegete_modifier: "Прославленный толкователь"
 pam_renowned_exegete_modifier_desc: "Благодаря чтению священных текстов этот персонаж снискал славу [Glossary('толкователя', 'GLOSS_EXEGETE')]."
 pam_doctrinal_clarity_modifier: "Доступность учения"
 pam_doctrinal_clarity_modifier_desc: "Этот персонаж на редкость ясно видит доктрины своей веры.\n\nПринятие действия «$sway_ruler_to_my_rite_interaction$»: #p +20#!\nПринятие действия «$pam_evangelize_personal_tenet_interaction$»: #p +20#!\nЗатраты [Concept('piety', 'благочестия')|E] на действие «$pam_evangelize_personal_tenet_interaction$»: #p -50%#!"
 pam_known_in_the_synod_modifier: "Известность в синоде"
 pam_known_in_the_synod_modifier_desc: "Среди духовенства часто говорят об учёности этого персонажа."
 pam_assisted_by_theologians_modifier: "Содействие богословов"
 pam_assisted_by_theologians_modifier_desc: "Учёные богословы помогают этому персонажу в его занятиях."
 pam_known_by_mystics_modifier: "Известность среди мистиков"
 pam_known_by_mystics_modifier_desc: "Этот персонаж пользуется доброй славой среди мистиков и созерцателей."
 pam_monastic_copyists_modifier: "Монастырские переписчики"
 pam_monastic_copyists_modifier_desc: "Неутомимые монастырские переписчики предоставляют всё новые тексты для этих занятий."
 pam_charterhouse_silence_modifier: "Тишина картезианской обители"
 pam_charterhouse_silence_modifier_desc: "Дисциплина безмолвных созерцателей помогает сохранять твёрдость в этих занятиях."
 pam_pastoral_letter_county_modifier: "Пастырское послание"
 pam_pastoral_letter_county_modifier_desc: "На каждой службе вслух зачитывают письмо с наставлениями и утешением от далёкого пастыря этой конфессии."
