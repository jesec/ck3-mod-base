l_russian:
 game_concept_puppet: "Марионетка"
 game_concept_puppets: "Марионетки"
 game_concept_puppeted: "Марионетка"
 game_concept_puppeting: "Кукловод"
 game_concept_puppet_type: "Тип марионетки"
 game_concept_puppet_types: "Типы марионеток"
 game_concept_puppet_type_desc: "[Concept('puppet', 'Марионетка')|e] всегда принадлежит к одному из типов, которые определяют, какие действия она может предпринимать от вашего имени.\n\nХотя большинство действий доступны всем марионеткам, у каждого типа есть свои уникальные действия, доступные только ему.\n\nНапример, [Concept('clerical_puppet', 'державный священник — марионетка')|e] может [Concept('excommunicate', 'отлучить')|e] кого-то по вашему требованию, а [Concept('external_ruler_puppet', 'светского правителя — марионетку')|e] можно убедить освободить [Concept('tributary', 'данника')|e] или развестись с [Concept('spouse', 'супругой')|e].\n\nУ вас может быть не более одной марионетки каждого типа."
 game_concept_puppet_desc: "Марионеткой называется [Concept('character', 'персонаж')|E], контролируемый [Concept('puppeteer', 'кукловодом')|E], который может совершать с его помощью особые манипулятивные действия.\n\nДействия с марионеткой открывают двери, которые в ином случае остались бы закрытыми: так, [Concept('clerical_puppet', 'державный священник — марионетка')|E] может от вашего имени просить о [Concept('clerical_titles', 'церковных титулах')|E] или [Concept('excommunication', 'отлучении')|E] неугодных, а [Concept('external_ruler_puppet', 'светского правителя — марионетку')|E] можно убедить освободить [Concept('tributary', 'данника')|E], предоставить независимость территории или развестись с [Concept('spouse', 'супругой')|E].\n\nВыбор доступных действий зависит от [Concept('puppet_type', 'типа марионетки')|E]."
 game_concept_puppeteer: "Кукловод"
 game_concept_puppeteers: "Кукловоды"
 game_concept_puppeteer_possessive: "Кукловода"
 game_concept_puppeteers_possessive: "Кукловодов"
 game_concept_puppeteer_desc: "Кукловодом называется [Concept('character', 'персонаж')|E], контролирующий одну или несколько [Concept('puppets', 'марионеток')|E].\n\nЧерез своих марионеток кукловод может использовать рычаги влияния, недоступные ему самому: к примеру, управлять [Concept('clergy', 'духовенством')|E] или определять политику другой [Concept('realm', 'державы')|E]."
 game_concept_clerical_puppet: "Державный священник-марионетка"
 game_concept_clerical_puppets: "Державные священники — марионетки"
 game_concept_clerical_puppet_desc: "[Concept('realm_priest', 'Державный священник')|E] может быть [Concept('puppet', 'марионеткой')|E] своего [Concept('liege', 'сюзерена')|E].\n\nЧерез него кукловод может вмешиваться в дела соответствующей религиозной [Concept('faith', 'конфессии')|E]: просить её [Concept('head_of_faith', 'главу')|E] о [Concept('clerical_titles', 'церковных титулах')|E] или [Concept('excommunication', 'отлучении')|E] врагов, распоряжаться [Concept('holy_sites', 'святыми местами')|E], учреждать новые [Concept('rite', 'обряды')|E] и созывать [Concept('ecumenical_council', 'вселенские соборы')|E]."
 game_concept_external_clerical_puppet: "Духовный правитель — марионетка"
 game_concept_external_clerical_puppets: "Духовные правители — марионетки"
 game_concept_external_clerical_puppet_desc: "Так называется влиятельный представитель [Concept('clergy', 'духовенства')|E] — к примеру, [Concept('archbishop', 'архиепископ')|E] или даже [Concept('head_of_faith', 'глава конфессии')|E], — который стал [Concept('puppet', 'марионеткой')|E] другого [Concept('ruler', 'правителя')|E].\n\nЧем более высокую должность занимает ваша марионетка, тем больше возможностей она вам даёт: к примеру, глава конфессии может [Concept('excommunicate', 'отлучать')|E] ваших врагов от церкви, назначать [Concept('cardinals', 'кардиналов')|E], предоставлять [Concept('pressed_claim', 'обоснованные претензии')|E] и объявлять [Concept('holy_war', 'священные войны')|E] по вашему приказу."
 game_concept_external_ruler_puppet: "Светский правитель-марионетка"
 game_concept_external_ruler_puppets: "Светские правители — марионетки"
 game_concept_external_ruler_puppet_desc: "Так называется [Concept('ruler', 'правитель')|E], не относящийся к [Concept('clergy', 'духовенству')|E] и являющийся [Concept('puppet', 'марионеткой')|E] другого [Concept('character', 'персонажа')|E].\n\nЧерез марионетку можно вмешиваться в дела другой [Concept('realms', 'державы')|E], например затевая [Concept('schemes', 'происки')|E] или [Concept('imprisonment', 'заключая в тюрьму')|E] неугодных людей.\n\n\nЧтобы обзавестись марионеткой этого типа, воспользуйтесь [Concept('interaction', 'взаимодействием')|E] «#V $make_external_ruler_puppet_interaction$#!», которое становится доступным, если выполнено хотя бы одно из следующих условий:\n$BULLET_WITH_TAB$Вы являетесь [Concept('clergy', 'церковным')|E] [Concept('vassal', 'вассалом')|E] цели\n$BULLET_WITH_TAB$У вас есть свойство «[GetTrait('seducer').GetName( GetNullCharacter )]», а цель является вашей [Concept('lover', 'любовницей')|E]/любовником или [Concept('soulmate', 'родственной душой')|E] и имеет ранг не ниже [Concept('king', 'королевского')|E]\n$BULLET_WITH_TAB$У вас есть свойство «[GetTrait('torturer').GetName( GetNullCharacter )]», а цель содержится у вас в [Concept('dungeon', 'подземелье')|E]\n$BULLET_WITH_TAB$У вас есть свойство «[GetTrait('family_first').GetName( GetNullCharacter )]», а цель состоит с вами в [Concept('close_family', 'близком родстве')|E]\n$BULLET_WITH_TAB$У вас есть свойство «[GetTrait('diplomat').GetName( GetNullCharacter )]», а цель — [Concept('independent_ruler', 'независимый правитель')|E]\n$BULLET_WITH_TAB$У вас есть свойство «[GetTrait('gallant').GetName( GetNullCharacter )]», а цель — ваш [Concept('spouse', 'супруг')|E]\n$BULLET_WITH_TAB$Вы являетесь [Concept('diarch', 'диархом')|E] цели при [Concept('entrenched_regency', 'укоренившемся регентстве')|E]"
 game_concept_ecumenical_council: "Вселенский собор"
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$ — это [Concept('activity', 'занятие')|E], в рамках которого высшее христианское [Concept('clergy', 'духовенство')|E] собирается для обсуждения будущего Церкви.\n\nВ ходе продолжительных дебатов собравшиеся иерархи определяют [Concept('tenet_status', 'статус')|E] спорных [Concept('core_tenets', 'догматов')|E]: их могут провозгласить [Concept('permitted_tenet_status', 'разрешёнными')|E] или [Concept('prohibited_tenet_status', 'запретными')|E], а также возвести в ранг [Concept('core_tenet_status', 'основных')|E]. Таким образом формируются [Concept('doctrines', 'доктрины')|E] [Concept('faith', 'конфессии')|E]."
 game_concept_ecumenical_councils: "Вселенские соборы"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "Раскол"
 game_concept_schism_desc: "Великим расколом называется историческое событие, в ходе которого единая христианская [Concept('faith', 'конфессия')|E] раскололась на [Concept('rite', 'течения')|E] римского и греческого обряда, впоследствии ставшие католичеством и православием.\n\nУгроза такой [Concept('situation', 'ситуации')|E] возникает, когда [Concept('the_christian_church', 'христианская церковь')|E] достигает определённого [Concept('the_christian_church_chapters_short', 'этапа развития')|E]. При этом правители всех держав христианского мира должны выбрать свою сторону. Если раскол не будет преодолён или форсирован с помощью определённых [Concept('decisions', 'решений')|E], в конце главы он станет окончательным и необратимым."
 game_concept_schisms: "Расколы"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "Церковный титул"
 game_concept_clerical_titles: "Церковные титулы"
 game_concept_clerical_title_desc: "[Concept('ecclesiastical', 'Церковный')|E] [Concept('title', 'титул')|E] — это звание представителя [Concept('clergy', 'духовенства')|E], возглавляющего определённый [Concept('clerical_region', 'церковный округ')|E] [Concept('faith', 'конфессии')|E] (для [Concept('christian', 'христианства ')|E] это [Concept('archdiocese', 'архидиоцез')|E]).\n\nОбладатель церковного титула является [Concept('religious_superior', 'вышестоящим духовным лицом')|E] по отношению к [Concept('clergy', 'духовенству')|E] региона и обычно утверждается [Concept('head_of_faith', 'главой конфессии')|E]."
 game_concept_the_christian_church: "Христианская церковь"
 game_concept_the_christian_church_desc: "Христианская церковь — духовная организация, опекающая и наставляющая последователей Иисуса Христа. Церковь представлена [Concept('situation', 'ситуацией')|E], развивающейся на протяжении [Concept('the_christian_church_chapters_short', 'этапов развития')|E].\n\nЦерковь охватывает все [Concept('archdiocese', 'архидиоцезы')|E] мира, и любой [Concept('christian', 'христианский')|E] [Concept('ruler', 'правитель')|E] рангом не ниже [Concept('county', 'графа')|E], чья [Concept('realm', 'держава')|E] хотя бы частично находится на территории архидиоцеза, становится участником этой ситуации, независимо от того, является он светским правителем или членом духовенства."
 game_concept_christendom: "Христианский мир"
 game_concept_christendom_desc: "$game_concept_christendom$ охватывает [Concept('realm', 'державы')|E] всех [Concept('independent', 'независимых')|E] [Concept('christian', 'христианских')|E] [Concept('ruler', 'правителей')|E], являющихся участниками [Concept('situation', 'ситуации')|E] «[the_christian_church|E]»."
 game_concept_christian: "Христианин"
 game_concept_christians: "Христиане"
 game_concept_christian_possessive: "Христианский"
 game_concept_christian_desc: "Последователь христианской [Concept('religion', 'религии')|E]."
 game_concept_papal_bull: "Папская булла"
 game_concept_papal_bulls: "Папские буллы"
 game_concept_bull: "Булла"
 game_concept_bulls: "Буллы"
 game_concept_papal_bull_desc: "Папская булла — это официальное распоряжение [Concept('head_of_faith', 'главы')|E] [Concept('christian', 'христианской')|E] [Concept('faith', 'конфессии')|E], наделённое всей полнотой власти [Concept('the_christian_church', 'христианской церкви')|E].\n\nХристианский [Concept('head_of_faith', 'глава конфессии')|E], обладающий достаточным [Concept('church_authority', 'авторитетом')|E], может издать буллу с помощью [Concept('decision', 'решения')|E] «[GetDecisionWithKey('enact_a_bull_decision').GetName]» и потратить [Concept('piety', 'благочестие')|E], чтобы:\n\n$EFFECT_LIST_BULLET$Объявить [Concept('great_holy_war', 'великую священную войну')|E]\n$EFFECT_LIST_BULLET$Объявить [Concept('rite', 'течение')|E] [Concept('heresy', 'ересью')|E]\n$EFFECT_LIST_BULLET$Объявить [Concept('core_tenet', 'догмат')|E] [Concept('permitted_tenet_status', 'разрешённым')|E] или [Concept('prohibited_tenet_status', 'запретным')|E]"
 game_concept_situation_the_christian_church_phase: "Этап развития христианской церкви"
 game_concept_the_christian_church_chapter_short: "Этап развития церкви"
 game_concept_the_christian_church_chapters_short: "Этапы развития церкви"
 game_concept_situation_the_christian_church_phases: "Этапы развития христианской церкви"
 game_concept_situation_the_christian_church_phase_desc: "Этапы развития церкви — это [Concept('situation_phases', 'фазы ситуации')|E] [Concept('the_christian_church', 'христианской церкви')|E]. Всего существует семь этапов, разделённых на четыре [Concept('the_christian_church_chapter_types', 'церковные эпохи')|E]."
 game_concept_the_christian_church_chapter_type: "Церковная эпоха"
 game_concept_the_christian_church_chapter_types: "Церковные эпохи"
 game_concept_the_christian_church_chapter_type_desc: "В истории [Concept('the_christian_church', 'христианской церкви')|E] существуют четыре эпохи, характеризующие [Concept('situation_the_christian_church_phases', 'этапы её развития')|E].\n\nЦерковные эпохи: [the_christian_church_unstable_short|El], [the_christian_church_crisis_short|El], [the_christian_church_zeal_short|El] и [the_christian_church_stability_short|El]"
 game_concept_the_christian_church_unstable: "Этап нестабильности"
 game_concept_the_christian_church_unstable_short: "Нестабильность"
 game_concept_the_christian_church_unstable_desc: "Для #high этапа нестабильности#! в [Concept('the_christian_church', 'христианской церкви')|E] характерен низкий уровень внутренней дисциплины:\n\n[Concept('rulers', 'Правители')|E] легко переходят в другие [Concept('rite', 'течения')|E], отлучения случаются чаще, а [Concept('gold', 'золото')|E] можно тратить в собственных интересах.\n\nК нестабильным [Concept('the_christian_church_chapters_short', 'этапам')|E] относятся #high Хрупкое единство#! и #high Реформы#!."
 game_concept_the_christian_church_zeal: "Этап фанатизма"
 game_concept_the_christian_church_zeal_short: "Фанатизм"
 game_concept_the_christian_church_zeal_desc: "На #high этапе фанатизма#! энергия церкви направлена вовне:\n\nПроисходят массовые обращения, чаще объявляются [Concept('great_holy_wars', 'великие священные войны')|E], чаще издаются [Concept('papal_bulls', 'буллы')|E], легче даётся обращение в [Concept('faith', 'конфессию')|E].\n\nК [Concept('the_christian_church_chapters_short', 'этапам')|E] фанатизма относятся #high $conversion_phase$#! и #high $crusade_phase$#!."
 game_concept_the_christian_church_stability: "Этап стабильности"
 game_concept_the_christian_church_stability_short: "Стабильность"
 game_concept_the_christian_church_stability_desc: "#high Этап стабильности#! — редкий период благополучия в [Concept('the_christian_church', 'христианской церкви')|E]:\n\nСтроительство в [Concept('temple_holding', 'храмовых владениях')|E] стоит дешевле, развитие величественных соборов происходит быстрее, [Concept('characters', 'персонажи')|E] чаще получают свойство «[GetTrait('devoted').GetName( GetNullCharacter )]», появляется возможность преодолеть Великий раскол.\n\nВ эпоху стабильности входит один этап развития — #high $concord$#!."
 game_concept_the_christian_church_crisis: "Этап кризиса"
 game_concept_the_christian_church_crisis_short: "Кризис"
 game_concept_the_christian_church_crisis_desc: "На #high этапе кризиса#! [Concept('the_christian_church', 'христианская церковь')|E] погружается в хаос:\n\nОтпущение грехов обходится дешевле, [Concept('ecumenical_councils', 'вселенские соборы')|E] созываются чаще, [Concept('rulers', 'правители')|E] могут сами назначать [Concept('court_chaplain', 'придворных капелланов')|E], [Concept('clergy', 'духовенство')|E] может вступить в брак, [Concept('head_of_faith', 'глава конфессии')|E] может отказаться проводить [Concept('anointment', 'помазание')|E], а [Concept('taxes', 'налоги')|E] снижаются.\n\nК [Concept('the_christian_church_chapters_short', 'этапам')|E] кризиса относятся #high $saeculum_obscurum$#! и #high $investiture_crisis$#!."
 game_concept_head_of_rite: "Лидер течения"
 game_concept_head_of_rite_desc: "Ведущий [Concept('character', 'персонаж')|E] религиозного [Concept('rite', 'течения')|E]. Это может быть [Concept('head_of_faith', 'глава конфессии')|E], если течение является её частью, или предводитель [Concept('clerical_region', 'церковного округа')|E], в котором течение имеет больше всего последователей, а при отсутствии такового — [Concept('ruler', 'правитель')|E], контролирующий наибольшее число [Concept('counties', 'графств')|E], в которых присутствует [Concept('rite_possessive', 'течение')|E].\n\nЛидер [Concept('rite_possessive', 'течения')|E] — это единственный, кто может изменять его [Concept('core_tenets', 'догматы')|E] и [Concept('doctrines', 'доктрины')|E], а также обращаться к своей пастве при угрозе церковного [Concept('schism', 'раскола')|E]."
 game_concept_ecclesiastical: "Церковь"
 game_concept_ecclesiastical_government: "Церковное управление"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "Церковное управление — это [Concept('theocratic', 'теократическая')|E] [Concept('government_form', 'форма правления')|E] [Concept('christian', 'христианских')|E] [Concept('clergy', 'духовных')|E] [Concept('rulers', 'правителей')|E], таких как [Concept('bishops', 'епископы')|E] и [Concept('archbishops', 'архиепископы')|E].\n\nБольшинство церковных правителей представлено теократическими [Concept('vassals', 'вассалами')|E], которые [Concept('lease', 'арендуют')|E] свои [Concept('temple_holdings', 'храмовые владения')|E] у светского [Concept('liege', 'сюзерена')|E] и подчиняются [Concept('head_of_faith', 'главе конфессии')|E]. Впрочем, [Concept('bishop', 'епископ')|E], владеющий [Concept('leased', 'неарендованными')|E] [Concept('landed', 'земельными')|E] [Concept('titles', 'титулами')|E], может править самостоятельно как [Concept('independent', 'независимый')|E] церковный [Concept('ruler', 'правитель')|E]. Власть такого правителя над [Concept('vassals', 'вассалами')|E] определяется [Concept('church_authority', 'авторитетом церкви')|E]."
 game_concept_lease_contract: "Договор аренды"
 game_concept_lease_contract_desc: "Юридические положения, согласно которым персонаж [Concept('leasing', 'сдаёт в аренду')|E] титул. Также они определяют, кто является [Concept('religious_superior', 'вышестоящим духовным лицом')|E]."
 game_concept_church_obligations: "Церковные обязательства"
 game_concept_church_obligations_desc: "Церковными обязательствами называются совокупные налоговые обязательства в отношении дохода [Concept('church_holding', 'церковных владений')|E]. Они выплачиваются [Concept('superior', 'вышестоящему')|E] иерарху, [Concept('head_of_faith', 'главе конфессии')|E] и/или местному светскому [Concept('ruler', 'правителю')|E]. Примеры: [Concept('church_centralization', 'централизация церкви')|E] и [Concept('secular_obligations', 'обязательства мирян')|E]."
 game_concept_church_centralization: "Централизация церкви"
 game_concept_minimal_centralization: "Минимальная централизация"
 game_concept_mild_centralization: "Слабая централизация"
 game_concept_strong_centralization: "Сильная централизация"
 game_concept_church_centralization_desc: "Централизация церкви характеризует единство ее иерархических и финансовых структур. С ее усилением увеличиваются денежные потоки от нижних уровней церковной иерархии к верхним.\n\nСуществуют следующие типы централизации церкви:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "Обязательства мирян"
 game_concept_personal_obligations: "Личные обязательства"
 game_concept_fixed_obligations: "Фиксированные обязательства"
 game_concept_secular_obligations_desc: "Обязательства мирян определяют, какая доля дохода [Concept('church_holdings', 'церковных владений')|E] принадлежит местному [Concept('secular_ruler', 'светскому правителю')|E].\n\nСуществуют следующие типы таких обязательств:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nНа некоторых этапах светские правители могут обладать дополнительной властью над местным церквями:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "Вышестоящее духовное лицо"
 game_concept_religious_superiors: "Вышестоящие духовные лица"
 game_concept_superior: "Вышестоящий"
 game_concept_religious_superior_desc: "Вышестоящее духовное лицо — [Concept('character', 'персонаж')|E], в чьей церковной юрисдикции находится один или несколько [Concept('subordinate', 'подчинённых')|E] представителей духовенства в рамках церковной иерархии."
 game_concept_religious_subordinate: "Подчинённое духовное лицо"
 game_concept_religious_subordinates: "Подчинённые духовные лица"
 game_concept_subordinate: "Подчинённый"
 game_concept_subordinates: "Подчинённые"
 game_concept_religious_subordinate_desc: "Подчинённое духовное лицо — [Concept('character', 'персонаж')|E], которым руководит [Concept('religious_superior', 'вышестоящее духовное лицо')|E] в рамках церковной иерархии."
 game_concept_clerical_region: "Церковный округ"
 game_concept_clerical_regions: "Церковные округа"
 game_concept_clerical_region_possessive: "Церковного округа"
 game_concept_clerical_regions_possessive: "Церковных округов"
 game_concept_clerical_region_desc: "Церковный округ — это географический регион, находящийся в юрисдикции [Concept('clerical_title', 'церковного титула')|E]. Любой представитель духовенства в регионе [Concept('subordinate', 'подчиняется')|E] владетелю [Concept('title', 'титула')|E], связанного с этим регионом.\n\n[Concept('ruler', 'Правитель')|E] принадлежит к округу, в котором находится его [Concept('capital', 'столичное')|E] [Concept('county', 'графство')|E], а новый округ создаётся с центром в [Concept('capital', 'столице')|E] [Concept('primary_title', 'первого титула')|E] основателя округа. Церковный округ может охватывать несколько [Concept('realms', 'держав')|E] и иметь в подчинении духовенство из разных государств.\n\nЕдиновременно правитель может владеть только одним церковным округом. При получении нового округа правитель отказывается от всех земель, входивших в состав старого."
 game_concept_clerical_region_capital: "Столица церковного округа"
 game_concept_clerical_region_capitals: "Столицы церковных округов"
 game_concept_clerical_region_capital_desc: "Столица церковного округа — [Concept('county', 'графство')|E], в котором был основан [Concept('clerical_region', 'церковный округ')|E]. В нём находится [Concept('ecclesiastical_estate', 'церковное поместье')|E], являющееся резиденцией владетеля [Concept('clerical_title', 'церковного титула')|E], управляющего округом. В отличие от [Concept('de_jure_capital', 'де-юре столицы')|E], столица округа привязана к округу, и её нельзя перенести."
 clerical_electors: "Церковные выборщики"
 game_concept_archdiocese: "Архидиоцез"
 game_concept_archdioceses: "Архидиоцезы"
 game_concept_archdiocese_desc: "Архидиоцез — это [Concept('christian', 'христианская')|E] версия [Concept('clerical_region', 'церковного округа')|E]; церковный домен, принадлежащий [Concept('archbishop', 'архиепископу')|E] [Concept('clerical_title', 'церковного титула')|E]. Его кафедра находится в столичном [Concept('county', 'графстве')|E], где можно возвести [Concept('grand_cathedral', 'великий собор')|E].\n\n[Concept('christian', 'Христианский')|E] [Concept('ruler', 'правитель')|E] в духовных вопросах подчиняется [Concept('archbishop', 'архиепископу')|E] архидиоцеза, включающего в себя его [Concept('capital', 'столичное')|E] [Concept('county', 'графство')|E], а все территории, входящие в архидиоцезы, относятся к [Concept('situation', 'ситуации')|E] «[the_christian_church|E]»."
 game_concept_grand_cathedral: "Величественный собор"
 game_concept_grand_cathedrals: "Величественные соборы"
 game_concept_grand_cathedral_desc: "Величественный собор — [Concept('great_building', 'грандиозная постройка')|E], возведённая в рамках [Concept('great_project', 'грандиозного проекта')|E] в столице [Concept('archdiocese', 'архидиоцеза')|E], где находится кафедра местного [Concept('archbishop', 'архиепископа')|E].\n\nВозведение первого собора позволяет владетелю стать ещё ближе к Богу: он обретает [Concept('piety', 'благочестие')|E], [Concept('legitimacy', 'легитимность')|E] и [Concept('spiritual_fulfillment', 'духовную реализацию')|E], дополнительную ячейку [Concept('personal_tenet', 'личного принципа')|E] и бонус к [Concept('opinion', 'мнению')|E] [Concept('faith', 'единоверцев')|E]. После постройки он притягивает к себе паломников со всего [Concept('christendom', 'христианского мира')|E], расширяет [Concept('cathedral_complex', 'соборный комплекс')|E] владельца, а в дальнейшем его можно расширить до #TOOLTIP:BUILDING,great_project_cathedral_02 #L готического величественного собора#!#! или #TOOLTIP:BUILDING,great_project_cathedral_03 #L пламенеющего величественного собора#!#!."
 game_concept_monastic_holy_order: "Монашеский орден"
 game_concept_monastic_holy_orders: "Монашеские ордена"
 game_concept_monastic_holy_order_possessive: "Монашеского ордена"
 game_concept_monastic_holy_orders_possessive: "Монашеских орденов"
 game_concept_monastic: "Монашеский"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "Монашеский орден — разновидность [Concept('holy_order', 'священного ордена')|E], посвятившего себя молитвам, богословию и распространению одного [Concept('core_tenet', 'догмата')|E]. Орден относится к [Concept('rite', 'течению')|E] своего основателя и продвигает [Concept('core_tenets', 'догматы')|E] этого [Concept('rite_possessive', 'течения')|E], распространяя их среди верующих.\n\nМонашеский орден возглавляет [Concept('archabbot', 'генеральный аббат')|E], а существует он за счёт [Concept('temple_holdings', 'храмовых владений')|E] и [Concept('gold', 'золота')|E], полученного от [Concept('monastic_order_patrons', 'покровителей')|E]. Орден, в свою очередь, даёт им [Concept('spiritual_fulfillment', 'духовную реализацию')|E] и [Concept('piety', 'благочестие')|E].\n\nЛюбой [Concept('ruler', 'правитель')|E], чья [Concept('faith', 'конфессия')|E] допускает монашество, может учредить орден с помощью [Concept('decision', 'решения')|E] «#high Основать монашеский орден#!»."
 game_concept_monastic_order_patron: "Покровитель монашеского ордена"
 game_concept_monastic_order_patrons: "Покровители монашеских орденов"
 game_concept_monastic_order_patronize: "Покровительствовать"
 game_concept_monastic_order_patronized: "Под покровительством"
 game_concept_monastic_order_patronage: "Покровительство"
 game_concept_monastic_order_patron_desc: "Покровитель монашеского ордена — это [Concept('ecclesiastical', 'церковный')|E] или светский [Concept('ruler', 'правитель')|E] [Concept('title_tier', 'уровнем')|E] от [Concept('duchy', 'герцога')|E] и выше, оказывающий поддержку [Concept('monastic_holy_order', 'монашескому ордену')|E]. Обычно покровителем является основатель ордена. Покровитель дарует ордену мирские богатства, сдаёт в аренду [Concept('temple_holdings', 'храмовые владения')|E] и жертвует [Concept('gold', 'золото')|E] из своей казны.\n\nЗа свою щедрость покровитель получает [Concept('piety', 'благочестие')|E] и [Concept('spiritual_fulfillment', 'духовную реализацию')|E]. Кроме того, он может сделать главу ордена своей [Concept('puppet', 'марионеткой')|E] и заставлять его совершать [Concept('clerical', 'церковные')|E] взаимодействия."
 game_concept_mendicant: "Нищенствующий"
 game_concept_rite: "Течение"
 game_concept_rite_possessive: "Течения"
 game_concept_rites_possessive: "Течений"
 game_concept_rite_desc: "Течением называется ответвление [Concept('faith', 'конфессии')|E], следующее местным религиозным практикам. Возглавляемое [Concept('head_of_rite', 'лидером течения')|E], оно включает в себя определённые [Concept('counties', 'графства')|E] и [Concept('characters', 'персонажей')|E]. В каждой конфессии есть [Concept('mainline_rite', 'господствующее течение')|E], параллельно с которым могут существовать ещё несколько.\n\nКаждое течение проповедует определённые [Concept('core_tenets', 'догматы')|E] и [Concept('doctrines', 'доктрины')|E]. [Concept('permitted_tenet_status', 'Разрешённость')|E] или [Concept('prohibited_tenet_status', 'запретность')|E] каждого отдельного догмата определяет [Concept('mainline_rite', 'господствующее течение')|E] [Concept('faith', 'конфессии')|E]. Чем сильнее [Concept('rite', 'течение')|E] расходится с его оценкой, тем больше степень его [Concept('rite_divergence', 'инообрядчества')|E]: такие течения снижают [Concept('fervor', 'рвение')|E] своей [Concept('faithpossessive', 'конфессии')|E] и способствуют появлению [Concept('heresy', 'ересей')|E], а когда [Concept('divergence', 'отделение')|E] достигает #V 100#!, становятся самостоятельными [Concept('faith', 'конфессиями')|E].\n\nНовые течения могут быть основаны благочестивыми персонажами. [Concept('rulers', 'Правители')|E] могут переходить из одного течения в другое, а изменять догматы самого течения может только его [Concept('head_of_rite', 'лидер')|E]."
 game_concept_rites: "Течения"
 game_concept_archabbot: "Аббат"
 game_concept_archabbot_desc: "Архиаббат — [Concept('ruler', 'правитель')|E] [Concept('monastic_holy_order', 'монашеского ордена')|E] и [Concept('head_of_rite', 'глава')|E] [Concept('rite', 'течения')|E], распространяемого орденом. Архиаббат наставляет членов ордена в изучении, размышлениях и распространении [Concept('core_tenets', 'догматов')|E] течения.\n\nОрден может получать поддержку [Concept('monastic_order_patron', 'покровителя')|E], чьё [Concept('monastic_order_patronage', 'покровительство')|E] служит источником богатства и влияния ордена.\n\nПосле смерти архиаббата его [Concept('titles', 'титулы')|E] переходят преемнику, которым обычно является [Concept('courtier', 'придворный')|E] с наивысшей [Concept('learning', 'учёностью')|E]."
 game_concept_archbishop: "Архиепископ"
 game_concept_archbishops: "Архиепископы"
 game_concept_archbishop_possessive: "Архиепископа"
 game_concept_archbishops_possessive: "Архиепископов"
 game_concept_archbishop_desc: "Архиепископ — это христианский владетель [Concept('archdiocese', 'архидиоцеза')|E], герцогского [Concept('clerical_title', 'церковного титула')|E], [Concept('clerical_region', 'церковный округ')|E] которого может охватывать несколько [Concept('realms', 'держав')|E]. Как [Concept('religious_superior', 'вышестоящее духовное лицо')|E] над [Concept('bishops', 'епископами')|E] и младшими членами [Concept('clergy', 'духовенства')|E] этого округа, архиепископ стоит выше обычного [Concept('bishop', 'епископа')|E] и подчиняется [Concept('head_of_faith', 'главе конфессии')|E]."
 game_concept_bishop: "Епископ"
 game_concept_bishops: "Епископы"
 game_concept_bishop_possessive: "Епископа"
 game_concept_bishops_possessive: "Епископов"
 game_concept_bishop_desc: "$game_concept_bishop$ — это представитель [Concept('clergy', 'духовенства')|E] христианской [Concept('faith', 'конфессии')|E], владеющий [Concept('temple_holdings', 'храмовыми владениями')|E] или арендующий их.\n\nЕпископ проживает в пределах [Concept('archdiocese', 'архидиоцеза')|E] и подчиняется [Concept('archbishop', 'архиепископу')|E] как [Concept('religious_superior', 'вышестоящему духовному лицу')|E]. Безземельный епископ, [Concept('leased', 'арендующий')|E] титулы, служит светскому [Concept('liege', 'сюзерену')|E], тогда как епископ, владеющий [Concept('landed', 'земельными')|E] [Concept('titles', 'титулами')|E] без аренды, может править как [Concept('ecclesiastical', 'церковный')|E] [Concept('ruler', 'правитель')|E]."
 game_concept_rite_divergence: "Инообрядчество"
 game_concept_rite_divergent: "Инообрядческий"
 game_concept_divergence: "Инообрядчество"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "Инообрядчество показывает, в какой степени [Concept('core_tenets', 'догматы')|E] и [Concept('doctrines', 'доктрины')|E] [Concept('rite_possessive', 'течения')|E] отходят от первоначальной [Concept('faith', 'конфессии')|E]. Течение, принимающее [Concept('prohibited_tenet_status', 'запретные')|E] догматы в качестве [Concept('core_tenet_status', 'основных')|E], считается более инообрядческим.\n\nВысокий уровень инообрядчества снижает [Concept('fervor', 'рвение')|E] первоначальной конфессии, способствуя возникновению [Concept('heresy', 'ересей')|E]. Если инообрядчество течения достигает #V 100#!, оно автоматически переходит в статус ереси и становится самостоятельной [Concept('faith', 'конфессией')|E]."
 game_concept_spiritual_fulfillment: "Духовная реализация"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$ — степень внутреннего согласия [Concept('character', 'персонажа')|E] со своей [Concept('faith', 'конфессией')|E].\n\nБазовое значение рассчитывается на основе [Concept('sinful', 'греховных')|E] и [Concept('virtuous', 'добродетельных')|E] [Concept('traits', 'свойств')|E] персонажа.\n\nУровень духовной реализации можно повысить или снизить действиями, которые [Concept('faith', 'конфессия')|E] считает подобающими. Кроме того, можно принять [Concept('personal_tenets', 'личные принципы')|E] в противовес пагубным свойствам."
 game_concept_fulfillment: "Реализация"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "Уровень духовной реализации"
 game_concept_spiritual_fulfillment_levels: "Уровни духовной реализации"
 game_concept_spiritual_fulfillment_level_desc: "[Concept('spiritual_fulfillment', 'Духовная реализация')|E] [Concept('character_possessive', 'персонажа')|E] делится на уровни с пороговыми значениями и своими эффектами.\n\nНизкие уровни делают жизнь более сложной и удешевляют греховные поступки. Высокие уровни упрощают набожность и открывают новые религиозные возможности."
 game_concept_personal_tenet: "Личный принцип"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$ — [Concept('core_tenet','догмат')|E], принимаемый [Concept('ruler', 'правителем')|E] за основу своего духовного развития.\n\nЕсли личный принцип совпадает с [Concept('core_tenet_status','основным')|E] или [Concept('permitted_tenet_status','разрешённым')|E] догматом [Concept('faith', 'конфессии')|E], он повышает [Concept('spiritual_fulfillment', 'духовную реализацию')|E], если же он относится к [Concept('prohibited_tenet_status','запретным')|E] догматам, у правителя появляется [Concept('secret', 'секрет')|E]. Личные принципы также дают дополнительные эффекты и открывают особые механики.\n\nНа количество личных принципов, которым может следовать персонаж, влияют [Concept('piety_level', 'уровень набожности')|E] и [Concept('trait', 'свойство')|E] «[GetTrait('theologian').GetName( GetNullCharacter )]»."
 game_concept_personal_tenets: "Личные принципы"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "Кардинал"
 game_concept_cardinals: "Кардиналы"
 game_concept_cardinal_possessive: "Кардинала"
 game_concept_cardinals_possessive: "Кардиналов"
 game_concept_cardinalate: "Кафедра"
 game_concept_cardinalates: "Кафедры"
 game_concept_cardinal_desc: "Представитель [Concept('clergy', 'духовенства')|E], избранный папой. Помогает папе исполнять волю [Concept('the_christian_church', 'христианской церкви')|E]. После смерти папы члены [Concept('college_of_cardinals', 'коллегии кардиналов')|E] выбирают его преемника, причём каждый из них вправе претендовать на избрание и обладает своим [Concept('papabile_score', 'приоритетом')|E]."
 game_concept_college_of_cardinals: "Коллегия кардиналов"
 game_concept_college_of_cardinals_desc: "Коллегия кардиналов — это совет [Concept('cardinals', 'кардиналов')|E], которые являются советниками папы и избирают следующего [Concept('head_of_faith', 'главу')|E] [Concept('the_christian_church', 'христианской церкви')|E].\n\nКаждый [Concept('cardinal', 'кардинал')|E] является и кандидатом, и выборщиком папства."
 game_concept_papabile_score: "Папский приоритет"
 game_concept_papabile_scores: "Папские приоритеты"
 game_concept_papabile_score_desc: "У каждого члена [Concept('college_of_cardinals', 'коллегии кардиналов')|E] есть папский приоритет, учитывающий [Concept('traits', 'свойства')|E], [Concept('piety_level', 'уровень набожности')|E], [Concept('rite', 'течение')|E] и [Concept('opinion', 'мнение')|E] других кардиналов.\n\n[Concept('cardinals', 'Кардиналы')|E] с максимальным приоритетом с большей вероятностью получат больше голосов во время выборов папы.\n\nПапский приоритет можно увеличить с помощью [Concept('character_interaction', 'взаимодействия')|E] «#high $increase_papabile_score_interaction$#!» и [Concept('decision', 'решения')|E] «[GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]»."
 game_concept_mainline_rite: "Господствующее течение"
 game_concept_mainline_rite_desc: "Господствующее [Concept('rite', 'течение')|E] — совокупность самых распространённых верований [Concept('faith', 'конфессии')|E]. $game_concept_rite$, которое не является господствующим, считается [Concept('rite_divergent', 'инообрядческим')|E].\n\nТо, какое течение считается господствующим, зависит от наличия у конфессии [Concept('head_of_faith', 'главы')|E].\n\nЕсли у конфессии есть официальный глава, его течение считается господствующим. Это значит, что статус может измениться, если место главы займёт преемник, принадлежащий к иному течению, в том числе и [Concept('challenger_hof', 'соперничающий глава конфессии')|E].\n\nПри отсутствии главы конфессии любое течение, распространившееся на больше [Concept('counties', 'графств')|E], чем господствующее, подменяет его при условии, что контролирует хотя бы столько же [Concept('holy_sites', 'святых мест')|E], сколько и замещаемое им течение."
 game_concept_mainline_rites: "Господствующие течения"
 game_concept_mainline_rite_short: "Господствующий"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "Статус догмата"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$ показывает, как [Concept('rite_possessive', 'течение')|E] воспринимает те или иные [Concept('core_tenet', 'догматы')|E] и [Concept('doctrine', 'доктрины')|E]. Всего существует пять уровней отношения к догматам и доктринам, в порядке возрастания важности:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — течение пребывает в неведении о данном догмате или доктрине.\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — течение знает о догмате или доктрине, но относится к нему с безразличием.\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — течение разрешает данную практику.\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — течение категорически запрещает данную практику.\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — течение активно поддерживает догмат.\n\nСтатус догмата или доктрины в глазах течения определяет, можно ли его выбрать при создании или изменении течения и получают ли [Concept('followers', 'последователи')|E] течения духовные штрафы за соответствующую практику.\n\nСтатус догмата отличается от [Concept('tenet_knowledge', 'знания религии')|E] [Concept('character_possessive', 'персонажем')|E] — последнее отражает информированность конкретного индивида, а не отношение течения в целом."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "Неизвестный"
 game_concept_unknown_tenet_status_desc: "Если [Concept('core_tenet', 'догмат')|E] или [Concept('doctrine', 'доктрина')|E] обладают [Concept('tenet_status', 'статусом')|E] «$game_concept_unknown_tenet_status$», это означает, что [Concept('rite', 'течение')|E] ничего о них не знает. [followers|E] течения пребывает в неведении о таких догматах или доктринах и не могут выбрать их при создании нового течения или принять в качестве [Concept('personal_tenet', 'личного принципа')|E]."
 game_concept_known_tenet_status: "Известный"
 game_concept_known_tenet_status_desc: "[tenet_status|E] «$game_concept_known_tenet_status$» означает, что [Concept('rite', 'течение')|E] в курсе данного [Concept('core_tenet', 'догмата')|E] или [Concept('doctrine', 'доктрины')|E], но при этом ни разрешает их, ни запрещает. Такой догмат или доктрину можно использовать при создании или изменении течения, а их [Concept('tenet_status', 'статус')|E] можно поднять до более высокого уровня."
 game_concept_permitted_tenet_status: "Разрешённый"
 game_concept_permit_tenet_status: "Разрешить"
 game_concept_permitted_tenet_status_desc: "[tenet_status|E] «$game_concept_permitted_tenet_status$» означает, что [Concept('rite', 'течение')|E] с одобрением относится к [Concept('core_tenet', 'догмату')|E] или [Concept('doctrine', 'доктрине')|E], хоть и не пропагандирует их. [character|E], относящийся к данному течению, может принять такой догмат в качестве [Concept('personal_tenet', 'личного принципа')|E], не получая духовных штрафов."
 game_concept_prohibited_tenet_status: "Запретный"
 game_concept_prohibit_tenet_status: "Запретить"
 game_concept_prohibited_tenet_status_desc: "[tenet_status|E] «$game_concept_prohibited_tenet_status$» означает, что [Concept('rite', 'течение')|E] категорически запрещает данный [Concept('core_tenet', 'догмат')|E] или [Concept('doctrine', 'доктрину')|E]. Если [Concept('character', 'персонаж')|E], относящийся к данному течению, принимает такой догмат в качестве [Concept('personal_tenet', 'личного принципа')|E], он держит это [Concept('secret', 'в секрете')|E]. Течение, принимающее [Concept('prohibited_tenet_status', 'запретные')|E] [Concept('core_tenets', 'догматы')|E] в качестве [Concept('core_tenet_status', 'основных')|E], сильно [Concept('rite_divergent', 'отдаляется')|E] от первоначальной [Concept('faith', 'конфессии')|E]."
 game_concept_core_tenet_status: "Основной"
 game_concept_core_tenet_status_desc: "[tenet_status|E] «$game_concept_core_tenet_status$» означает, что [Concept('rite', 'течение')|E] активно пропагандирует [Concept('core_tenet', 'догмат')|E] или [Concept('doctrine', 'доктрину')|E], видя в них свои основополагающие принципы. Их эффекты распространяются на всех [Concept('followers', 'последователей')|E] данного течения."
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "Знание религии"
 game_concept_doctrine_knowledge: "Знание доктрин"
 game_concept_rite_knowledge: "Знание течений"
 game_concept_agnostic_knowledge: "Знание"
 game_concept_tenet_knowledge_desc: "Персонажи редко обладают полной информацией обо всех религиозных практиках.\n\nИзвестные персонажу догматы и доктрины можно выбирать при создании [Concept('rite_divergent', 'инообрядческого')|E] течения или принять в качестве [Concept('personal_tenets', 'личных принципов')|E]. Знание всех догматов и доктрин учения облегчает обращение в него.\n\nВам заранее известны все [Concept('core_tenets', 'догматы')|E] и [Concept('doctrines', 'доктрины')|E] вашей [Concept('faith', 'конфессии')|E]. Дополнительные знания можно получить посредством близких отношений, — например, с [Concept('spouses', 'супругами')|E] или с [Concept('friends', 'друзьями')|E], — а также в ходе [Concept('traveling', 'путешествий')|E] и [Concept('activities', 'занятий')|E], либо с помощью [Concept('scheme', 'происков')|E] «Изучить течение»."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "Помещённый в раку"
 game_concept_enshrine: "Помещение в раку"
 game_concept_enshrined_desc: "Помещённая в раку [Concept('holy_relic', 'священная реликвия')|E] активирует бонусы [Concept('holy_site', 'святого места')|E] в зависимости от суммы уровней [Concept('rarity', 'редкости')|E] всех размещённых там артефактов.\n\nТакой артефакт больше не принадлежит персонажу, однако [Concept('holder', 'владетель')|E], [Concept('top_liege', 'верховный сюзерен')|E] или владетель [Concept('clerical_region', 'церковного округа')|E] святого места могут с ним взаимодействовать. Разрушение артефакта прекращается. Помещать можно только священные реликвии вашей [Concept('faith', 'конфессии')|E]. Помещённые в раку реликвии других конфессий не дают бонусов.\n\nРазмещение артефакта в святом месте, как и его изъятие, может требовать ресурсов или приносить награду."
 game_concept_holy_relic: "Священная реликвия"
 game_concept_holy_relics: "Священные реликвии"
 game_concept_holy_relic_desc: "Священная реликвия — [Concept('artifact', 'артефакт')|E], обладающий религиозной значимостью для [Concept('faith', 'конфессии')|E]. Священную реликвию можно [Concept('enshrined', 'поместить')|E] в [Concept('holy_site', 'святое место')|E] конфессии, чтобы получить бонусы.\n\nНекоторые артефакты в силу своей природы являются священными для конфессии, другие же можно [Concept('sanctified', 'освятить')|E], превратив в реликвию."
 game_concept_sanctified: "Освящённый"
 game_concept_sanctify: "Освятить"
 game_concept_sanctifying: "Освящение"
 game_concept_sanctified_desc: "Освящение [Concept('artifact', 'артефакта')|E] превращает его в [Concept('holy_relic', 'священную реликвию')|E] [Concept('faith', 'конфессии')|E]. Один артефакт могут освятить несколько конфессий."
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Церковное поместье"
 game_concept_ecclesiastical_estates: "Церковные поместья"
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$ либо соборный комплекс — это вид [Concept('domicile', 'имения')|E], закреплённого за [Concept('clerical_title', 'церковным титулом')|E] [Concept('archbishop', 'архиепископа')|E] и фактически являющегося его личным владением. При форме правления «[GetGovernment('ecclesiastical_government').GetName]» представители младшего [Concept('clergy', 'духовенства')|E] могут получить такое поместье только вместе с соответствующим [Concept('title', 'титулом')|E].\n\nВ церковном поместье можно возводить [Concept('ecclesiastical_estate_buildings', 'поместные постройки')|E], которые обогащают владетеля, повышают его [Concept('piety', 'благочестие')|E] или способствуют [Concept('spiritual_fulfillment', 'духовной реализации')|E]. Церковное поместье не может изменять свое местоположение, а при наследовании переходит следующему [Concept('holder', 'владетелю')|E] титула."
 game_concept_ecclesiastical_estate_building: "Церковная поместная постройка"
 game_concept_ecclesiastical_estate_buildings: "Церковные поместные постройки"
 game_concept_ecclesiastical_estate_building_desc: "Церковные поместные постройки — особые улучшения [Concept('ecclesiastical_estate', 'церковного поместья')|E].\n\nВладетель титула может построить широкий ассортимент зданий, которые приносят доход, повышают [Concept('piety', 'благочестие')|E], способствуют [Concept('spiritual_fulfillment', 'духовной реализации')|E] или открывают доступ к новым [Concept('decisions', 'решениям')|E], [Concept('interactions', 'взаимодействиям')|E] и так далее."
 game_concept_cathedral_complex: "Соборный комплекс"
 game_concept_cathedral_complexes: "Соборные комплексы"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "Соборная постройка"
 game_concept_cathedral_complex_buildings: "Соборные постройки"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "Канонизирован"
 game_concept_canonized_desc: "[Concept('character', 'Персонаж')|E], после смерти провозглашённый святым или его эквивалентом в другой религии (к примеру, вали или почтенным предком), приобретает [Concept('trait', 'свойство')|E] «[GetTrait('saint').GetName( GetNullCharacter )]».\n\nДобродетельная жизнь может закончиться канонизацией: эта процедура проводится посредством [Concept('decision', 'решение')|E], требует благословения [Concept('head_of_faith', 'глава конфессии')|E] и заканчивается освящением места упокоения святого. Впоследствии туда могут устремиться паломники, а среди останков могут быть обретены [Concept('holy_relics', 'священные реликвии')|E]."
 game_concept_canonization: "Канонизация"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Святость"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "[interaction|E], с помощью которого благодаря вмешательству соответствующего [Concept('ecclesiastical', 'церковного')|E] или [Concept( 'theocratic', 'теократического' )|E] [Concept('ruler', 'правителя')|E] можно перевести [Concept('unpressed_claim', 'слабую претензию')|E] в [Concept('pressed_claim', 'обоснованную')|E]."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "[interaction|E], дающее [Concept('claim', 'претензию')|E] на [Concept('title', 'титул')|E], принадлежащий другому [Concept('ruler', 'правителю')|E]. Требует согласия соответствующего [Concept('ecclesiastical', 'церковного')|E] или [Concept( 'theocratic', 'теократического' )|E] [Concept('character', 'персонажа')|E]."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "[interaction|E], обеспечивающее мирную передачу [Concept('title', 'титула')|E] или [Concept('vassal', 'вассала')|E] от одного [Concept('rulers', 'правителя')|E] другому. Требует согласия выбранного [Concept('ruler', 'правителя')|E], а также посредника.\n\nОтказ, как правило, приводит к снижению [Concept('piety', 'благочестия')|E] и [Concept('legitimacy', 'легитимности')|E] получателя, а также к другим штрафам, выбранных инициатором для принуждения его к согласию.\n\nПосредником во взаимодействии выступает соответствующий [Concept('ecclesiastical', 'церковный')|E] или [Concept( 'theocratic', 'теократический' )|E] правитель. Он может как наложить запрет на само взаимодействие, так и навязать его принятие (если действует [Concept('law', 'закон')|E] «[GetLaw('church_authority_3').GetName]»)."
 game_concept_challenger_hof: "Соперничающий глава конфессии"
 game_concept_antipope: "Антипапа"
 game_concept_challenger_hof_desc: "Соперничающий глава конфессии — соперник [Concept('head_of_faith', 'главы конфессии')|E], восставший против главы [Concept('mainline_rite', 'господствующего течения')|E].\n\n[Concept('ruler', 'Правитель')|E] может поддержать представителя своего [Concept('clergy', 'духовенства')|E] в качестве соперничающего главы конфессии. [Concept('clergy', 'Церковный')|E] [Concept('ruler', 'правитель')|E] или правитель, принадлежащий к [Concept('faith', 'конфессии')|E] со светским духовным лидером, также может объявить себя соперником.\n\nПоддержанный соперничающий глава конфессии принимает [Concept('rite', 'течение')|E] спонсора, становится [Concept('external_clerical_puppet', 'церковной марионеткой')|E] спонсора и подпадает под [Concept('weak_hook', 'слабое влияние')|E].\n\nГлава господствующего течения не может [Concept('excommunicate', 'отлучать')|E] последователей своего соперника: спонсора и его [Concept('vassals', 'вассалов')|E].\n\nПоследователи соперничающего главы конфессии направляют церковные запросы к нему, а не к главе господствующего течения, а также получают следующие [Concept('interactions', 'взаимодействия')|E]:\n$EFFECT_LIST_BULLET$[Concept('petition_antipope_indulgences_interaction', 'Просить антипапу об отпущении грехов')|E]\n$EFFECT_LIST_BULLET$[Concept('petition_antipope_gold_interaction', 'Попросить золото у антипапы')|E]\n\nСоперничающий глава конфессии или его спонсор могут использовать [Concept('casus_belli', 'казус белли')|E] «[Concept('pam_challenge_hof_cb', 'Бросить вызов главе конфессии')|E]» против законного главы конфессии.\n\nВ свою очередь, соперничающие [Concept('kings', 'короли')|E] или правители более высокого ранга той же [Concept('faith', 'конфессии')|E] могут использовать казус белли «[Concept('pam_antiking_cb', 'Свергнуть антипапу')|E]» против спонсора, чтобы свергнуть претендента."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "Бросить вызов главе конфессии"
 game_concept_pam_challenge_hof_cb_desc: "[Concept('casus_belli', 'Казус белли')|E], используемый [Concept('challenger_hof', 'соперничающим главой конфессии')|E] или его спонсором против законного [Concept('head_of_faith', 'главы')|E] своей [Concept('faith', 'конфессии')|E]. Победа приводит к установлению претендента в качестве главы конфессии и делает его [Concept('rite', 'течение')|E] [Concept('mainline_rite', 'господствующим')|E]. Если спонсор выиграл войну и его ранг выше, чем у соперничающего главы конфессии, он делает его своим [Concept('vassal', 'вассалом')|E]."
 game_concept_pam_antiking_cb: "Свергнуть антипапу"
 game_concept_pam_antiking_cb_desc: "[Concept('casus_belli', 'Казус белли')|E], доступный [Concept('christian', 'христианским')|E] [Concept('kings', 'королям')|E] и правителям более высокого ранга, которые не поддерживают [Concept('challenger_hof', 'соперничающего главу конфессии')|E] и не являются им. Война ведётся против [Concept('independent', 'независимого')|E] спонсора той же [Concept('faith', 'конфессии')|E] с целью свергнуть претендента и заручиться благодарностью законного [Concept('head_of_faith', 'главы конфессии')|E]."
 game_concept_petition_antipope_indulgences_interaction: "Просить антипапу об отпущении грехов"
 game_concept_petition_antipope_indulgences_interaction_desc: "[Concept('interaction', 'Взаимодействие')|E], доступное любому стороннику [Concept('challenger_hof', 'соперничающего главы конфессии')|E]. Вы платите [Concept('gold', 'золото')|E] своему антипапе, чтобы получить отпущение грехов и [Concept('piety', 'благочестие')|E] в обход [Concept('head_of_faith', 'главы')|E] [Concept('mainline_rite', 'господствующего течения')|E]. Для спонсора согласие автоматическое."
 game_concept_petition_antipope_gold_interaction: "Попросить золото у антипапы"
 game_concept_petition_antipope_gold_interaction_desc: "[Concept('interaction', 'Взаимодействие')|E], доступное любому стороннику [Concept('challenger_hof', 'соперничающего главы конфессии')|E]. Вы просите [Concept('gold', 'золото')|E] у своего антипапы. Для спонсора согласие автоматическое."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "Это [Concept('decision', 'решение')|E], доступное прелатам и могучим правителям, позволяет подтолкнуть [Concept('the_christian_church', 'христианскую церковь')|E] к выбранному этапу."
 game_concept_tenet_popularity: "Популярность догмата"
 game_concept_tenet_popularity_desc: "[Concept('personal_tenets', 'Личные принципы')|E] практикуются всё чаще по мере того, как распространяются в рамках [Concept('faith', 'конфессии')|E]. Уровень популярности показывает степень распространения [Concept('core_tenet', 'догмата')|E] и вероятность того, что его выберут темой на [Concept('ecumenical_council', 'вселенском соборе')|E] или выпустят [Concept('papal_bull', 'папскую буллу')|E].\n\nЧем выше популярность догмата, тем больше представителей [Concept('clergy', 'духовенства')|E] поддержат его при обсуждении на [Concept('ecumenical_council', 'Вселенском соборе')|E]. Когда популярность достигает значения #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!, [Concept('head_of_faith', 'глава конфессии')|E], почти наверняка, объявит его [Concept('permitted_tenet_status', 'разрешённым')|E] независимо от собственных воззрений."
 game_concept_ecumenical_council_innovator: "Инноватор"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Инноваторы"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Инноваторы — [Concept('activity_guests_short', 'гости')|E] [Concept('ecumenical_council', 'вселенского собора')|E], голосующие вместе с [Concept('activity_host_short', 'устроителем')|E] этого [Concept('activity', 'занятия')|E] за предложенные изменения статуса [Concept('core_tenet', 'догмата')|E] или [Concept('doctrine', 'доктрины')|E].\n\nИм напрямую противостоят [Concept('ec_conservatives', 'консерваторы')|E], голосующие против любых изменений и стремящиеся сохранить статус-кво.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help [Concept('characters', 'Персонажи')|E], имеющие право голоса: [Concept('clergy', 'духовенство')|E], [Concept('rulers', 'правители')|E] с [Concept('clerical_puppet', 'державным священником — марионеткой')|E] и [Concept('activity_host', 'устроитель занятия')|E]#!"
 game_concept_ecumenical_council_conservative: "Консерватор"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Консерваторы"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "Консерваторы — [Concept('activity_guests_short', 'гости')|E] [Concept('ecumenical_council', 'вселенского собора')|E], голосующие против [Concept('activity_host_short', 'устроителя')|E] этого [Concept('activity', 'занятия')|E] и предложенных изменений статуса [Concept('core_tenet', 'догмата')|E] или [Concept('doctrine', 'доктрины')|E].\n\nИм напрямую противостоят [Concept('ec_innovators', 'инноваторы')|E], пытающиеся внести изменения.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[Concept('interaction', 'Взаимодействие')|E], с помощью которого [Concept('ecclesiastical', 'церковные')|E] [Concept('rulers', 'правители')|E] могут расширить свой [Concept('clerical_region', 'церковный округ')|E] в [Concept('de_jure', 'де-юре')|E] [Concept('counties', 'графства')|E] соседнего [Concept('duchy', 'герцогства')|E].\n\nВозможно только с одобрения [Concept('head_of_faith', 'главы конфессии')|E]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[Concept('interaction', 'Взаимодействие')|E], с помощью которого [Concept('ecclesiastical', 'церковные')|E] [Concept('rulers', 'правители')|E] могут убедить светских правителей-[Concept('faith', 'единоверцев')|E] объявить [Concept('holy_war', 'священную войну')|E] правителям враждебной конфессии."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[Concept('interaction', 'Взаимодействие')|E], с помощью которого [Concept('ecclesiastical', 'церковные')|E] [Concept('rulers', 'правители')|E] могут убедить светских правителей-[Concept('faith', 'единоверцев')|E] объявить [Concept('war', 'войну')|E] за [Concept('claim', 'претензии')|E] светскому [Concept('ruler', 'правителю')|E]."
 game_concept_treasury_cardinal_budget: "Бюджет кардиналов"
 game_concept_treasury_cardinal_budget_short: "Кардинал"
 game_concept_treasury_cardinal_budget_benefices: "Бенефиции кардиналов"
 game_concept_treasury_cardinal_budget_desc: "Средства, выделяемые [Concept('cardinals', 'кардиналам')|E] из центральной церковной казны в соответствии с их прямыми и косвенными [Glossary( 'бенефициями', 'CARDINAL_BENEFICES_GLOSS' )]."
 CARDINAL_BENEFICES_GLOSS: "Бенефиции — это местные или отдалённые владения, должности или даже денежные доли папских доходов, которые могут быть переданы представителю духовенства #i in commendam#! (в попечение). Они приносят доход и, как правило, не накладывают прямых административных обязанностей."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[Concept('interaction', 'Взаимодействие')|E], при котором [clerical|E] обменивает комфорт [Concept('spiritual_fulfillment', 'духовной реализации')|E] на [Concept('hook', 'влияние')|E]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "[Concept('interaction', 'взаимодействие')|E], требующее от другого [Concept('character', 'персонаж')|E] принять обеты целомудрия и получить долгосрочный штраф к [Concept('fertility', 'плодовитости')|E]."
 game_concept_military_holy_order: "Духовно-рыцарский орден"
 game_concept_military_holy_orders: "Духовно-рыцарские ордена"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "Духовно-рыцарского ордена"
 game_concept_military_holy_orders_possessive: "Духовно-рыцарских орденов"
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$ — это разновидность [Concept('holy_order', 'священного ордена')|E], которая объединяет воинов, поклявшихся защищать и расширять владения своей [Concept('faith', 'конфессии')|E].\n\nЗа некоторое количество [Concept('piety', 'благочестия')|E] правители-единоверцы могут нанимать такой орден, находясь в состоянии [Concept('war', 'войны')|E] с конфессиями, имеющими статус [Concept('faith_hostile', 'врагов')|L] или [Concept('faith_evil', 'воплощённого зла')|L]. По окончании войны орден прекращает сражаться за правителя.\n\n$game_concept_holy_order$ может иметь [Concept('military_holy_order_patron', 'покровителя')|E], который не обязан платить за наём."
 game_concept_military_holy_order_patron: "Покровитель духовно-рыцарского ордена"
 game_concept_military_holy_order_patronage: "Покровительство духовно-рыцарскому ордену"
 game_concept_military_holy_order_patronize: "Покровительствовать"
 game_concept_military_holy_order_patron_desc: "Покровителем [Concept('military_holy_order', 'духовно-рыцарского ордена')|E] может быть [Concept('ruler', 'правитель')|E] [Concept('title_tier', 'уровнем')|E] от [Concept('duke', 'герцога')|E] и выше, который принадлежит к [Concept('faith', 'конфессии')|E] ордена и [Concept('realm', 'держава')|E] которого контролирует его столицу.\n\nПокровитель может бесплатно пользоваться поддержкой духовно-рыцарского ордена в борьбе с врагами веры, расходуя на это лишь [Concept('piety', 'благочестие')|E].\n\nВ случае передачи столицы ордена покровительство может перейти к [Concept('vassals', 'вассалу')|E] [Concept('title_tier', 'уровнем')|E] от [Concept('duke', 'герцога')|E] и выше."
