l_russian:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] объединяет в себе множество земель, населённых народами самых разных языков и культур, которые далеко не всегда уживаются друг с другом.\n\nОднако сегодня нам как никогда нужна сплочённость. Конец времён уже близок. Три всадника — чума, война и ересь — уже стоят у нашего порога, готовые испытать наше единство.\n\nКак [st_paul.GetName] когда-то [Select_CString(st_paul.IsFemale, 'обращалась', 'обращался' )] к коринфянам с призывом сплотиться, так и мы призываем всех [Concept('christians', 'христиан')|E] проявить единодушие: [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. В противном случае нас всех с головой поглотит ересь, и тогда каждый из нас станет марионеткой в руках Антихриста.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Наши мягкотелые соседи-[Concept('christians', 'христиане')|E] поклоняются жалкому и завистливому богу. Подобно детям, они спорят о природе своего кумира. Они растеряли бдительность, их мечи давно не вкушали крови врагов и затупились в ножнах.\n\nИ эту слабость они стремятся навязать нам, послав в наши земли своих святош. Пожалуй, мы сами заглянем к ним в гости и хорошенько пограбим местные богатства! Тогда, возможно, они вспомнят, каково это — быть действительно сильными."
 pam_the_christian_church.0051.desc.heathen_rulers: "Наши соседи-[Concept('christian', 'христиане')|E] — сборище неотёсанных, постоянно бранящихся между собой народов. Душа у этих последователей [ROOT.Char.GetFaith.HighGodNamePossessive] столь же чиста, сколь и вода в пруду, заросшем илом. Они навсегда застряли в прошлом и не видят, что своими верованиями сами копают себе могилу.\n\nМы заберём их сокровища — сколь бы мало там ни было. Мы покорим их мужчин и женщин — сколь бы ленивыми они ни были."
 pam_the_christian_church.0051.desc.heretic_rulers: "[st_peter.GetName] [Select_CString(st_peter.IsFemale, 'возрыдала', 'возрыдал' )] бы, увидев, какой осёл сегодня занимает названную в [Select_CString(st_peter.IsFemale, 'её', 'его' )] честь кафедру. Этот человек смеет называть нас еретиками только за то, что мы сохранили истинную веру! Если бы Христос вновь спустился на землю, он наверняка бы принял фарисейство и призвал вновь распять нашего Господа.\n\nВзгляните, какой раздор царит среди тех, кто называет Христа Господом! Лжепророк в Риме посеял зерно раздора в хорошо удобренную почву.\n\nНаместник Сатаны на земле стремится сделать нас мучениками. Эту язву давно пора прижечь во имя спасения всех [Concept('christians', 'христиан')|E]!"
 pam_the_christian_church.0051.desc.western: "Влияние епископа Рима уже не то, что прежде. Ответственность за устранение разделившего нашу веру раскола в преддверии Страшного суда ложится на нас."
 pam_the_christian_church.0051.desc.eastern: "Нас окружают враги Христа, и Страшный суд близок. Нужно поскорее найти общий язык с епископом Рима."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nСовет разрешил правителям свободно отстранять прелатов, назначенных церковью."
 pam_the_christian_church.0051.desc.oriental_orthodox: "«[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]». Страшный суд близок. Нужно наставить наших братьев на путь к свету."
 pam_the_christian_church.0051.a: "Да направит нас Христос!"
 pam_the_christian_church.0051.b: "Будем внимательно следить за последователями Христа."
 MIAPHYSITISM_GLOSS: "#bold «Поистине есть одна природа Бога Слова воплощённая!»#! — так провозгласил святой Кирилл Александрийский на Эфесском соборе в 431 году. Эта христологическая доктрина, называемая миафизитством, получила распространение в восточных православных церквях."
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "Из непроглядной тьмы, в которой пребывает [GetSituation('the_christian_church').GetTopSubRegion.GetName], звучит многоголосый хор:\n\n#EMP «Рим хочет быть новым Содомом!»#!\n\n#EMP «Папа — и сводник, и блудница!»#!\n\nДаже те, кто придерживается умеренных взглядов, не могут не признать: церковь давно нуждается в реформах."
 pam_the_christian_church.0052.desc.unreformed_pagan: "Наши малодушные соседи-[Concept('christians', 'христиане')|E] вопят: «Близится конец света! Наш папа — подлинный язычник!»\n\nПо крайней мере в одном они правы. Сделаем же так, чтобы для них конец света наступил поскорее!"
 pam_the_christian_church.0052.desc.heathen_rulers: "[Concept('christians', 'Христиане')|E] вопят: «В церкви наступила смута!»\n\nНаконец-то они признали то, что нам стало известно уже давно. Всё, что остаётся этим глупцам, — надеяться, что когда-нибудь им хватит ума последовать нашему примеру и начать верить в [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nМы заберём их сокровища — сколь бы мало там ни было. Мы покорим их мужчин и женщин — сколь бы ленивыми они ни были."
 pam_the_christian_church.0052.desc.heretic_rulers: "Надо остановить Антихриста, накинувшего на себя мантию святого Петра!"
 pam_the_christian_church.0052.desc.western: "Перемены должны начинаться в Риме. Лишь тогда [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] восстановится."
 pam_the_christian_church.0052.desc.eastern: "Нас окружают враги Христа, и нам придётся либо искоренить пороки, захватившие Рим, либо пасть их жертвами."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "Пусть Господь осветит наш путь!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "Возрадуемся, ибо мы добились значительных успехов! По мере того как дикие язычники принимают учение Христа, [GetSituation('the_christian_church').GetTopSubRegion.GetName] разрастается.\n\nУвы, не каждый из них горит желанием познавать учения церкви. Но отчаиваться не стоит: если слова наших проповедников они пропускают мимо ушей, значит, мы огнём и мечом научим их молиться!\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "[Concept('christians', 'Христиане')|E] посылают в наши края своих священнослужителей. Стоит нам закрыть перед ними ворота, как к нам приходят воины.\n\nХотя многие из нас не отринули [ROOT.Char.GetFaith.HighGodNamePossessive], некоторые видят, что в служении богу-человеку Христу есть определённая польза: если власть назначается свыше, значит, церковь может служить нашим посланником и даже, что особенно приятно, собирать налоги."
 pam_the_christian_church.0053.desc.heathen_rulers: "Наши соседи-[Concept('christians', 'христиане')|E] насильно обращают идолопоклонников, хотя сами заслуживают лишь одного: чтобы им пустили кровь.\n\nНо пока их мечи не рвут нашу плоть, у нас развязаны руки. Мы заберём их сокровища — сколь бы мало там ни было. Мы покорим их мужчин и женщин — сколь бы ленивыми они ни были. Во имя [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 pam_the_christian_church.0053.desc.heretic_rulers: "Римский самозванец надеется обратить язычников в свою ложную веру! Антихристу недостаточно отравлять умы простых [Concept('christians', 'христиан')|E] — он хочет заманить наивных идолопоклонников в свои коварные объятия."
 pam_the_christian_church.0053.desc.western: "Нужно быть внимательными: новорождённых христиан принуждают следовать обрядам #L [ROOT.Char.GetRite.GetName|l]ого#! течения с санкции кафедры Святого Петра."
 pam_the_christian_church.0053.desc.eastern: "В Риме утверждают, что [GetSituation('the_christian_church').GetTopSubRegion.GetName] их не интересует, — они стремятся обратить в иную веру лишь тех, кто проживает в других местах. Тем не менее нельзя терять бдительность, иначе #L [ROOT.Char.GetRite.GetName|l]ая#! вера нашего народа уйдёт в прошлое; или же, что хуже, они поднимут обагрённые языческой кровью мечи против братьев-христиан."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] находится в труднейшем положении, однако церковь ещё можно спасти.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nОднако церковь ещё можно спасти!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Наша вера в Бога непоколебима. Сохранить веру в церковь оказалось сложнее. Духовенство, некогда во всём подражавшее Христу, во многом растеряло независимость и стало рычагом влияния для императоров и королей."
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural] восстают против своих же церковных порядков, надеясь, что их бог не заметит этих междоусобиц. Впрочем, нам от этого только лучше: возможно, пока их священники заняты религиозными распрями, они оставят наши святыни в покое."
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural] подумывают о том, чтобы реформировать свои религиозные порядки. При этом представители каждой ветви уверены, что именно они правильно почитают своего распятого бога. Конечно, будет любопытно послушать их новые лозунги, однако наши топоры наверняка окажутся убедительнее этих бредней."
 pam_the_christian_church.0054.desc.heretic_rulers: "Римские раскольники никак не могут сойтись во мнении по поводу реформации. Очевидно, все эти преобразования — не более чем лицемерный спектакль, который закончится ещё большим закрепощением верующих. Остаётся надеяться, что они перегрызут друг другу глотки и больше не будут вмешиваться в наши дела."
 pam_the_christian_church.0054.desc.western: "Нашу попытку вернуться в прежнее русло некоторые называют реформой. Однако с этим словом следует быть осторожным: народ боится всего нового, а потому отнесётся к изменениям благосклоннее, если представить их как возвращение к прежнему укладу."
 pam_the_christian_church.0054.desc.eastern: "Рим, возомнивший себя центром всего христианского мира, постоянно меняет свои обряды, придумывая всё новые и новые каноны, обеты и упрёки за древние грехи. Мы же пристально следим за этим беспорядком, при необходимости осуждая западные догматы и укрепляя собственные традиции, дабы истинные верующие не сочли римские практики за непреложный закон."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nНаш совет уступил церкви право пожизненного назначения."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nМирские князья требуют от епископов присягать им на верность, рассматривая их как обыкновенных вассалов. В свою очередь, [christianity.GetReligiousHeadTitle.GetName] строго запрещает светским правителям назначать церковных сановников без своего одобрения.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nЗа отсутствием общепризнанного пастыря каждый правитель самостоятельно назначает епископов. Правда, после такого посвящения в сан их сутаны пахнут скорее деньгами, чем благовониями.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] переживает очередной кризис: как оказалось, слухи о противостоянии между церковью и светской властью возникли не на пустом месте."
 pam_the_christian_church.0055.desc.unreformed_pagan: "Пока [christianity.GetAdherentNamePlural|l] спорят о том, кому позволено назначать епископов, их священники заняты более важными делами и потому практически нас не беспокоят. Пусть короли и понтифики хоть сожрут друг друга, лишь бы их миссионеры больше не совались в наши края."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "На фоне борьбы за инвеституру римские власти упрекают светских правителей за самоуправство, однако, будь у них такая возможность, они бы сами не задумываясь заковали наших учителей в кандалы. Сначала выньте бревно из своего глаза, лицемеры, а уже потом обвиняйте других!"
 pam_the_christian_church.0055.desc.western: "Главное, чтобы в ходе этого конфликта королевский скипетр и церковный посох не слились в единое целое…\n\n"
 pam_the_christian_church.0055.desc.eastern: "Западные короли спорят с Римом о кольцах и посохах, тем самым лишь обнажая свои пороки и подрывая репутацию всей церкви.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] испытывает небывалый рост религиозного рвения, и верующие из самых разных стран массово призывают освободить храм Гроба Господня от мусульман. Воины уже готовят кресты к походу, а правители продают ценные реликвии ради наполнения военной казны.\n\nЛюдей охватывает боевой пыл, но стоит только дать ему немного остыть, как он тут же превратится в сомнения и страх.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Воинственные священники говорят о крестовом походе, при этом совершенно пренебрегая благополучием своих земель… Что ж, если они так жаждут утонуть в песках Ближнего Востока, мы не станем им мешать."
 pam_the_christian_church.0056.desc.western: "Воистину, порой мечом можно добиться большего, чем проповедью.\n\n"
 pam_the_christian_church.0056.desc.eastern: "Войска западных держав выступают в Святую землю.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$, за соблюдением которых будет пристально следить [christianity.GetReligiousHeadTitle.GetName].\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nДаже не имея общепризнанного верховного пастыря, верующие неизбежно сами находят общий язык и решают свои споры.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "Церковные междоусобицы наконец-то прекратились, и теперь [GetSituation('the_christian_church').GetTopSubRegion.GetName] вступает в эпоху мира и единства"
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "Разные богословские школы могут сколько угодно обмениваться доводами и аргументами, однако большинство людей всё же воспринимают Божье слово из уст проповедников.\n\nЧто бы ни случилось, мы всегда должны помнить, что наша вера служит простому народу."
 pam_the_christian_church.0057.desc.eastern: "Однако пока мы прославляем Бога в своих песнопениях, столы наших западных собратьев скрипят под тяжестью религиозных трактатов. Мы всегда приветствуем гармонию и согласие, но пусть их богословские прения остаются за пределами наших границ."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "Созван совет"
 pam_the_christian_church.0058.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName], растянувшаяся на много лет, достигает своей кульминации. Созывается совет, который раз и навсегда решит, кто будет назначать священнослужителей — церковь или корона."
 pam_the_christian_church.0058.a: "Да будет решено."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "Собирается совет"
 pam_the_christian_church.0059.desc.located: "Пригласительные письма разосланы. Отцы церкви собрались на совет об инвеституре, который [Select_CString(investiture_convene_host.IsFemale, 'созвала', 'созвал')] [investiture_convene_host.GetTitledFirstName|l]. В месте, что называется [investiture_convene_location.GetName], будет раз и навсегда постановлено, какая же сила в христианском мире будет иметь право назначать священнослужителей, — церковь или корона."
 pam_the_christian_church.0059.desc: "Пригласительные письма разосланы. Отцы церкви собрались на совет об инвеституре. Здесь будет раз и навсегда постановлено, какая же сила в христианском мире будет иметь право назначать священнослужителей, — церковь или корона."
 pam_the_christian_church.0059.a: "Пусть размышляют."
 pam_the_christian_church_not_hof_trigger_tt: "Вы не глава конфессии"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "Вскоре соберётся особый церковный совет, на котором будет определена новая [Concept('doctrine', 'доктрина')|E] назначения священнослужителей вашей [Concept('faith', 'конфессии')|E]"
 pam_the_christian_church.0060.t: "Чтобы не было между вами разделений"
 pam_the_christian_church.0060.desc: "Христианский мир находится на грани. Представители #L [schism_mainline_rite.GetName|l]ого#! течения заявляют о своей преемственности от апостолов; их #L [schism_competitor_rite.GetName|l]ие#! противники отказываются уступать.\n\nХристос предупреждал: [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )] — всякое царство, разделившееся само в себе, опустеет. Если не прижечь эту язву, церкви никогда больше не заговорить единым голосом."
 pam_the_christian_church.0060.a: "Я поддержу [schism_mainline_rite.GetNameNoTooltip|l]ое течение."
 pam_the_christian_church.0060.a.tt: "Способствует [Concept('decision', 'решению')|E] «[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]»"
 pam_the_christian_church.0060.b: "Я поддержу [schism_competitor_rite.GetNameNoTooltip|l]ое течение."
 pam_the_christian_church.0060.b.tt: "Способствует [Concept('decision', 'решению')|E] «[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]»"
 pam_the_christian_church.0060.c: "Две руки лучше одной."
 pam_the_christian_church.0060.c.tt: "Способствует [Concept('decision', 'решению')|E] «[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]»"
 pam_the_christian_church.0061.t: "Великий раскол"
 pam_the_christian_church.0061.desc: "Послы, прибывшие из города [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip], объявили перед алтарём свой приговор:\n\n«Да будут [schism_eastern_faith.GetReligiousHead.GetFirstName], ложно [Select_CString(schism_eastern_faith.GetReligiousHead.IsFemale, 'называемая', 'называемый')] „[schism_eastern_faith.ReligiousHeadName|l]“, и все [Select_CString(schism_eastern_faith.GetReligiousHead.IsFemale, 'её', 'его')] последователи преданы анафеме. Внемлите, еретики: [Glossary( 'маран-афа', 'MARANATHA_GLOSS' )]! Внемлите тако же дьявол и его ангелы и покайтесь!».\n\n«Сей богопротивный документ следует предать анафеме вместе со всеми, чья рука его когда-либо касалась, — писала, переписывала или исправляла!» — отвечает [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nВерующие разделились: с одной стороны — [schism_western_faith.GetAdherentNamePlural|l], с другой — [schism_eastern_faith.GetAdherentNamePlural|l]. Моя же душа навеки принадлежит [ROOT.Char.GetFaith.GetNameNoTooltip|l]ой вере."
 pam_the_christian_church.0061.desc.bystander: "Из владения [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] пришли вести: легаты бросили на алтарь приговор об анафеме, и [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] отвечает им тем же.\n\nТе, кто некогда звали себя единой церковью, разделились, и теперь это [schism_western_faith.GetAdherentNamePlural|l] и [schism_eastern_faith.GetAdherentNamePlural|l]. Их распри никогда меня не касались, и #L [ROOT.Char.GetFaith.GetName|l]ая#! вера от этого не изменится, но наблюдать за этим всё равно неприятно."
 pam_the_christian_church.0061.a: "Да будет так."
 pam_the_christian_church.0061.a.shame: "Весьма прискорбно."
 pam_the_christian_church.0061.a.bystander: "Жаль, что братья ссорятся."
 MARANATHA_GLOSS: "Возглас на арамейском языке, означающий #bold «Господь грядёт!»#! либо #bold «гряди, Господи!»#! (Первое послание к коринфянам, 16:22). С этими словами предают анафеме — изгнанию из церкви до возвращения Господа."
 pam_the_christian_church.0062.t: "Сохранение единства"
 pam_the_christian_church.0062.desc: "Разорвавшую христианский мир надвое рану удалось зашить. [schism_peacemaker.GetTitledFirstName] невероятными усилиями [Select_CString(schism_peacemaker.IsFemale, 'усадила', 'усадил')] глав двух кафедр за общий стол.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus… Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetAdjective|U] сохраняет единство."
 pam_the_christian_church.0062.a: "Слава Господу."
 pam_the_christian_church.0062.a.peacemaker: "Ни одна кафедра не будет выше прочих."
 pam_the_christian_church.0062.b: "Пусть [new_head_of_faith.GetTitledFirstNameNoTooltip] наставляет нас всех."
 pam_the_christian_church.0062.b.self: "Вся паства подчинится мне."
 pam_the_christian_church.0063.t: "[Select_CString(schism_dissenter.IsFemale, 'Оставшаяся', 'Оставшийся' )]"
 pam_the_christian_church.0063.desc: "Меня привлекло к себе #L [ROOT.Char.GetRite.GetName|l]ое#! течение, но [schism_dissenter.GetTitledFirstName] не [Select_CString(schism_dissenter.IsFemale, 'последовала', 'последовал' )] моему примеру и продолжает тревожиться за мою душу и мою бывшую общину:\n\n«Вы нас оставили, — тихо говорит [Select_CString(schism_dissenter.IsFemale, 'она', 'он' )]. — Когда церковь разорвётся надвое… а она разорвётся… мы окажемся по разные стороны раскола»."
 pam_the_christian_church.0063.a: "Один и тот же Бог слышит нас обоих."
 pam_the_christian_church.0063.b: "Позвольте, я покажу вам, чем вызвано моё решение."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip] следует за мной"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip] не внемлет вам"
 pam_the_christian_church.0063.c: "Держите свои страхи при себе."
 pam_the_christian_church.0064.t: "Разверзнется рана"
 pam_the_christian_church.0064.desc.opening.self_mainline: "Я и [schism_competitor_head.GetTitledFirstName] силимся перекричать друг друга."
 pam_the_christian_church.0064.desc.opening.self_competitor: "Я и [schism_mainline_head.GetTitledFirstName] силимся перекричать друг друга."
 pam_the_christian_church.0064.desc.opening: "[schism_mainline_head.GetTitledFirstName] и [schism_competitor_head.GetTitledFirstName] силятся перекричать друг друга."
 pam_the_christian_church.0064.desc: "Я не слышу предложений, как примирить #L [schism_mainline_rite.GetName|l]ое#! течение с #L [schism_competitor_rite.GetName|l]им#!.\n\nПредупреждение из священных текстов стало приговором: [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. Единство #L [christianity.GetName|l]ой#! веры ещё не разрушено, но рана вот-вот разверзнется. И это неминуемо."
 pam_the_christian_church.0064.a: "Боже, не оставь нас."
 pam_the_christian_church.0064.a.tt: "Прогресс Великого раскола достиг порогового значения"
