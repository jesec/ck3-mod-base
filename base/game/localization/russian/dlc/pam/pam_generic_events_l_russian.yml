l_russian:
 pam_generic_events.0001.t: "Учёный богослов"
 pam_generic_events.0001.desc: "Зайдя внутрь, я замечаю, что [ROOT.Char.GetFaith.HouseOfWorship|l] проводит службу. [Select_CString(chaplain.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstName] столь увлечённо читает проповедь, что поначалу даже не замечает моего присутствия.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')]! — восклицает [Select_CString(chaplain.IsFemale, 'она', 'он' )], наконец обращая на меня внимание. — Желаете приобщиться к учению [ROOT.Char.GetFaith.HighGodNamePossessive]? Только скажите, и я помогу вам встать на правильный путь»."
 pam_generic_events.0001.a: "Почему бы и нет."
 pam_generic_events.0001.b: "У меня нет на это времени: держава зовёт."
 pam_generic_events.0002.t: "Хороший ли я человек?"
 pam_generic_events.0002.desc.intro: "Через пару часов после того, как погасли свечи, ко мне в покои проскальзывает [Select_CString(doubting_child.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )]; по щекам у [Select_CString(doubting_child.IsFemale, 'неё', 'него')] струятся слёзы.\n\n«Я ведь хороший человек? — шепчет [Select_CString(doubting_child.IsFemale, 'она', 'он')] мне на ухо. — А то если я живу во грехе…"
 pam_generic_events.0002.desc.sin: "если я — [sinful_trait.GetName( ROOT.Char )|l] #EMP во плоти#!…"
 pam_generic_events.0002.desc.sp: "если у меня на душе так пусто…"
 pam_generic_events.0002.desc.outro: "то как мне попасть в царствие [ROOT.Char.GetFaith.HighGodNamePossessive]?»."
 pam_generic_events.0002.a: "Отбрось всё, что заставляет тебя стыдиться."
 pam_generic_events.0002.b: "Тебя искренне любят."
 pam_generic_events.0002.c: "Значит, помолимся."
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'утешили', Select_CString(CHARACTER.IsFemale, 'утешила', 'утешил' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))], когда [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вы засомневались', Select_CString(TARGET_CHARACTER.IsFemale, 'она засомневалась', 'он засомневался' ))], хороший ли [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вы', Select_CString(TARGET_CHARACTER.IsFemale, 'она', 'он' ))] человек."
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'утешили', Select_CString(TARGET_CHARACTER.IsFemale, 'утешила', 'утешил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', CHARACTER.GetShortUIName))], когда [Select_CString(CHARACTER.IsLocalPlayer, 'вы засомневались', Select_CString(CHARACTER.IsFemale, 'она засомневалась', 'он засомневался' ))], хороший ли [Select_CString(CHARACTER.IsLocalPlayer, 'вы', Select_CString(CHARACTER.IsFemale, 'она', 'он' ))] человек."
 pam_generic_events.0003.t: "Кто ты есть"
 pam_generic_events.0003.desc: "После наступления сумерек [Select_CString(worried_spouse.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )] ждёт меня за оградой, нервно переплетая пальцы сложенных на коленях рук.\n\n«#EMP [sinful_trait.GetName( ROOT.Char )|U]#! — твоё второе имя! — произносит [Select_CString(worried_spouse.IsFemale, 'она', 'он')] приглушённым голосом. — Твои поступки навлекают на нас позор в глазах [ROOT.Char.GetFaith.HighGodNamePossessive]. Разве можно так безответственно относиться к своей вере? Ты что, не понимаешь, по какой кривой дорожке ты идёшь?»."
 pam_generic_events.0003.a: "Ради тебя я непременно исправлюсь."
 pam_generic_events.0003.b: "На всё воля [ROOT.Char.GetFaith.HighGodNamePossessive] — в том числе и на мои поступки."
 pam_generic_events.0003.c: "Ты слишком переживаешь."
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'пообещали', Select_CString(CHARACTER.IsFemale, 'пообещала', 'пообещал' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вам', Concatenate('персонажу ', TARGET_CHARACTER.GetShortUIName))] исправиться и совершить паломничество."
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'пообещали', Select_CString(TARGET_CHARACTER.IsFemale, 'пообещала', 'пообещал' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вам', Concatenate('персонажу ', CHARACTER.GetShortUIName))] исправиться и совершить паломничество."
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'отказались', Select_CString(CHARACTER.IsFemale, 'отказалась', 'отказался' ))] покаяться, когда [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'попросили', Select_CString(TARGET_CHARACTER.IsFemale, 'попросила', 'попросил' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] измениться."
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'отказались', Select_CString(TARGET_CHARACTER.IsFemale, 'отказалась', 'отказался' ))] покаяться, когда [CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsLocalPlayer, 'попросили', Select_CString(CHARACTER.IsFemale, 'попросила', 'попросил' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] измениться."
 pam_generic_events.0004.t: "Свет во тьме"
 pam_generic_events.0004.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] пустует. Между колоннами повисли клочья тумана; пламя свечей подрагивает от движения воздуха. Мне не даёт покоя память о том, как [Select_CString(deceased.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2( 'RelationToMeShort', deceased )], [deceased.GetFirstName] [deceased.GetDeathReasonHideKiller].\n\n[Select_CString(comforter.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2( 'RelationToMeShort', comforter )] [comforter.GetFirstName], придвинувшись ко мне так близко, что мы соприкасаемся рукавами, мягким голосом произносит: «Печаль — это путь, который предстоит проделать каждому, ибо в конце его нас ждёт [ROOT.Char.GetFaith.PositiveAfterLife]»."
 pam_generic_events.0004.a: "Но вина за это лежит на #EMP мне#!!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP В доме Отца Моего обителей много.#!"
 JOHN_14_2_GLOSS: "#weak Евангелие от Иоанна 14:2#!"
 pam_generic_events.0004.c: "Значит, помолимся."
 pam_generic_events.0004.d: "Выпьем вместе на добрую память."
 pam_generic_events.0005.t: "Верный кулак"
 pam_generic_events.0005.desc: "«Да как [Select_CString(clerical_holder.IsFemale, 'она', 'он')] только #EMP смеет#!?!»\n\nС этими гневными словами в зал совета широкими шагами входит [Select_CString(loyal_vassal.IsFemale, 'моя', 'мой')] [loyal_vassal.GetTitledFirstName|l]. Рука [Select_CString(loyal_vassal.IsFemale, 'его', 'её')] лежит на рукояти меча, наполовину выдвинутого из ножен.\n\n«Как [clerical_holder.GetTitledFirstName|l] [Select_CString(clerical_holder.IsFemale, 'посмела', 'посмел')] изгнать вас?! — за этим следует плевок на землю. — Мои люди уже наготове. Только прикажите — и [clerical_region.GetName] поднимется на вашу защиту. Мы нанесём этому человеку визит»."
 pam_generic_events.0005.a: "Ну что же, ступайте."
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName] отправится во владение [clerical_holder.GetCapitalLocation.GetName]. По [Select_CString(loyal_vassal.IsFemale, 'её', 'его')] возвращении вы получите [Concept('dread', 'ужас')|E] и прибавку к [Concept('opinion', 'мнению')|E] [GetVassalStance('belligerent').GetTextIcon]#TOOLTIP:VASSAL_STANCE,belligerent #L воинственных#!#! [Concept('vassal', 'вассалов')|E]."
 pam_generic_events.0005.b: "Есть более хитроумные способы."
 pam_generic_events.0005.b.tt: "Вы получаете #P огромный#! бонус к [Concept('schemes', 'проискам')|E] «[GetScheme('murder').GetTypeName]», направленным против персонажа [clerical_holder.GetShortUIName], на #V 15 лет#!"
 pam_generic_events.0005.c: "Меня учили подставлять другую щёку."
 pam_generic_events.0005.c.tt: "Принятие [Concept('character_interaction', 'взаимодействия персонажа')|E] #V «$declaration_of_repentance_interaction$»#! увеличивается на #P 20#! ед. на #V 10 лет#!"
 pam_generic_events.0005.c.tt2: "Увеличивается вероятность применения к вам [Concept('character_interaction', 'взаимодействия персонажа')|E] #V «$lift_excommunication_interaction$»#! в течение следующих #V 10 лет#!"
 pam_turned_the_other_cheek_accept_reason: "Подставлена другая щека"
 PAM_GENERIC_0005_MURDER_BONUS: "У верного вассала есть люди в домене цели: $VALUE|+0=$"
 pam_generic_events.0007.opening: "[ROOT.Char.GetTitledFirstName]!"
 pam_generic_events.0007.desc: "Дело сделано. [clerical_holder.GetTitledFirstName] не [Select_CString(clerical_holder.IsFemale, 'сумела', 'сумел')] скрыться от нас и теперь лежит в луже собственной крови."
 pam_generic_events.0007.a: "Хорошо."
 pam_generic_events.0008.t: "Голос во тьме"
 pam_generic_events.0008.desc: "Мой живот набух от тяжёлого ужина. Я неловко бреду к своей опочивальне; в глазах всё расплывается, а пол шатается под ногами.\n\nНеожиданно откуда-то доносится голос: «[ROOT.Char.GetTitleAsNameNoTooltip|l], [virtuous_trait.GetName( ROOT.Char )|l] даётся вам на удивление легко… Подобная добродетель угодна Господу».\n\nНеужели это действительно [ROOT.Char.GetFaith.HighGodName] — или же мной овладела болезнь?"
 pam_generic_events.0008.a: "Да! #EMP Да!#!"
 pam_generic_events.0008.b: "Должно быть, это Он!"
 pam_generic_events.0008.c: "Зашевелились древние силы…"
 pam_generic_events.0008.d: "Такое случается, если переесть."
 pam_generic_events.0008.e: "Может, еда была неправильная?.."
 pam_generic_events.0008.f: "На всякий случай лучше помолиться."
 pam_generic_events.0009.t: "Геенна огненная"
 pam_generic_events.0009.desc: "Я резко раскрываю глаза, освобождаясь от кошмара. Сердце бешено колотится в груди; одежда насквозь пропиталась потом.\n\nВо сне мою плоть пожирали языки пламени, и мясо отходило от костей, словно масло. «[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]! [sinful_trait.GetNameNoTooltip( ROOT.Char )|U] требует наказания!» — кричали мне полчища демонов.\n\n[ROOT.Char.GetFaith.NegativeAfterLife|U] так далеко — и одновременно с этим так близко… Каждый вопль в этом хоре — мой собственный."
 pam_generic_events.0009.a: "Бич всегда найдёт путь."
 pam_generic_events.0009.b: "Плоть должна отвечать за плоть."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Очистите руки, грешники, исправьте сердца, двоедушные.#!"
 JAMES_4_8_GLOSS: "#weak Послание Иакова 4:8#!"
 pam_generic_events.0009.d: "[comforting_courtier.GetTitledFirstName] всегда умеет утешить меня беседой."
 pam_generic_events.0009.e: "Это просто сон."
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'обратились', Select_CString(CHARACTER.IsFemale, 'обратилась', 'обратился' ))] за утешением к [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вам', Concatenate('персонажу ', TARGET_CHARACTER.GetShortUIName))] после кошмарного сна."
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'обратились', Select_CString(TARGET_CHARACTER.IsFemale, 'обратилась', 'обратился' ))] за утешением к [Select_CString(CHARACTER.IsLocalPlayer, 'вам', Concatenate('персонажу ', CHARACTER.GetShortUIName))] после кошмарного сна."
 pam_generic_events.0010.t: "Благословенная дичь"
 pam_generic_events.0010.desc: "Вокруг нас простираются обширные [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')|l]. Тишину и покой вскоре нарушает громоподобный стук копыт — [hunting_ruler.GetName] с гордым выражением лица ведёт лошадей галопом.\n\n#EMP «Сто-о-о-ой!#! — [Select_CString(hunting_ruler.IsFemale, 'она', 'он')] поднимает руку в приветственном жесте, и свита останавливается. — Восславим [ROOT.Char.GetFaith.HighGodNamePossessive] за столь добрую погоду — и за дичь, что нам ниспослали сегодня!»."
 pam_generic_events.0010.a: "Позвольте дать вам совет…"
 pam_generic_events.0010.b: "Ваш глаз столь же остёр, сколь ваше копьё."
 pam_generic_events.0010.b.success: "Вашу похвалу принимают с благодарностью"
 pam_generic_events.0010.b.failure: "Ваша похвала не возымела успеха"
 pam_generic_events.0010.b.toast.success: "[Select_CString(hunting_ruler.IsFemale, 'Она', 'Он')] с благодарностью принимает вашу похвалу"
 pam_generic_events.0010.b.toast.failure: "[Select_CString(hunting_ruler.IsFemale, 'Она недовольна', 'Он недоволен')] вашей пустой лестью"
 pam_generic_events.0010.b.tt: "[hunting_ruler.GetTitledFirstName] охотнее согласится на [Concept('character_interaction', 'взаимодействие персонажа')|E] #high «$negotiate_alliance_interaction$»#! в течение #V 10 лет#!"
 pam_generic_events.0010.c: "Слава!"
 pam_generic_events.0010.d: "Позвольте мне взять у вас пару всадников в дорогу."
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'похвалили', Select_CString(CHARACTER.IsFemale, 'похвалила', 'похвалил' ))] умение [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] охотиться"
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'похвалили', Select_CString(TARGET_CHARACTER.IsFemale, 'похвалила', 'похвалил' ))] умение [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))] охотиться."
 pam_praised_hunting_alliance_accept_reason: "Моё умение охотиться похвалили"
 pam_generic_events.0011.t: "Воплощение греха"
 pam_generic_events.0011.desc: "[sinful_courtier.GetTitledFirstName] совершенно не скрывает, что предаётся греху. При дворе ходят слухи, что [sinful_trait.GetName( ROOT.Char )|l] — любимое занятие этого человека. Слуги настолько невзлюбили [Select_CString(sinful_courtier.IsFemale, 'её', 'его')], что стараются лишний раз не оказываться поблизости.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U]! — восклицает [Select_CString(sinful_courtier.IsFemale, 'она', 'он')], когда я вхожу в кабинет, и [sinful_courtier.Custom('quirk_neg_pp')]. — Какая честь пребывать рядом с вами!»."
 pam_generic_events.0011.a: "[sinful_trait.GetNameNoTooltip( ROOT.Char )|U] — это грех, и вы немедленно же избавитесь от него."
 pam_generic_events.0011.b: "Внемлите тем урокам, что мы получили от [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_generic_events.0011.b.success: "Урок идёт впрок"
 pam_generic_events.0011.b.failure: "Поучения бесполезны"
 pam_generic_events.0011.b.toast.success: "[Select_CString(sinful_courtier.IsFemale, 'Она', 'Он')] в полной мере осознаёт тяжесть своего греха"
 pam_generic_events.0011.b.toast.failure: "[Select_CString(sinful_courtier.IsFemale, 'Она', 'Он')] не желает слушать ваши наставления"
 pam_generic_events.0011.c: "Это не идёт на пользу вашей душе…"
 pam_generic_events.0011.c.success: "Вежливые советы помогают смягчить характер"
 pam_generic_events.0011.c.failure: "Ваша мягкость вызывает только презрение"
 pam_generic_events.0011.c.toast.success: "[Select_CString(sinful_courtier.IsFemale, 'Она тронута', 'Он тронут')] вашей заботой"
 pam_generic_events.0011.c.toast.failure: "[Select_CString(sinful_courtier.IsFemale, 'Она', 'Он')] принимает вашу доброту за слабость"
 pam_generic_events.0011.d: "Возможно, всё не так плохо."
