l_russian:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Открывает [Concept('intent', 'намерение')|E] «$praise_the_gods_intent$» во время [Concept('activities', 'проведения')|E] #TOOLTIP:ACTIVITY_TYPE,activity_feast #L пира#!#!"
 praise_the_gods_intent: "Почтить божественное"
 praise_the_gods_intent_desc: "Превратить праздник в торжественное богослужение, чтобы расширить свои духовные познания и обрести новых товарищей."
 praise_the_gods_intent_not_valid_desc: "Вы больше не следуете [Concept('tenet', 'догмату')|E] «[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )]»"
 pam_ritual_celebrations_events.0001.t: "Пир откровения"
 pam_ritual_celebrations_events.0001.desc: "Тарелки пустеют, бокалы наполняются спиртным, и гости один за другим произносят тосты в честь [ROOT.Char.GetFaith.WealthGodNamePossessive]. Скоро по всему залу начинают звучать молитвы, священные истории и богословские дискуссии.\n\nНа этом дружеском празднестве даже начинает казаться, что мы всё-таки можем достичь взаимопонимания — будь то с помощью церковных торжеств или молчаливых молитв."
 pam_ritual_celebrations_events.0001.a: "Пиршества и праздники — вот настоящее богослужение."
 pam_ritual_celebrations_events.0001.b: "Я лучше уединюсь и проведу время за созерцательной молитвой."
 pam_praise_the_gods_revelation_outcome_tt: "В шуме торжества рождается священная истина"
 pam_praise_the_gods_belief_outcome_tt: "Полузабытое учение открывает новые духовные пути"
 pam_praise_the_gods_legend_outcome_tt: "Священные истории с этого вечера превращаются в легенды, которые будут пересказывать ещё многие поколения"
 pam_praise_the_gods_clergy_outcome_tt: "Совместная молитва позволяет вам сблизиться с одним из [Concept('clergy', 'священников')|E] за столом"
 pam_praise_the_gods_scholar_outcome_tt: "Религиозные дискуссии за столом зажгли в гостях искренний интерес к изучению священных текстов"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Каждая произнесённая молитва и притча углубляет ваши религиозные знания"
 pam_praise_the_gods_revelation_toast: "Откровение во время торжества"
 pam_praise_the_gods_belief_toast: "Богословское просветление"
 pam_praise_the_gods_legend_toast: "Священная история становится легендой"
 pam_praise_the_gods_clergy_toast: "Солидарность в почитании [ROOT.Char.GetFaith.WealthGodNamePossessive]"
 pam_praise_the_gods_scholar_toast: "Новая мудрость на пиру"
 pam_praise_the_gods_scholar_xp_toast: "Углубление познаний"
 pam_praise_the_gods_clergy_bond_opinion: "Сближение на религиозном празднике"
 pam_praise_the_gods_log_title: "Почитание божественного"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'приобщались', Select_CString(CHARACTER.IsFemale, 'приобщалась', 'приобщался' ))] к духовным знаниям, слушая молитвы, истории и богословские дискуссии во время пира"
 pam_praise_the_gods_quiet_log_title: "Уединённая молитва"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'покинули', Select_CString(CHARACTER.IsFemale, 'покинула', 'покинул' ))] торжество, чтобы погрузиться в молитву и обрести душевный покой"
