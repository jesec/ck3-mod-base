 pam_interactions_events.0010.opening: "О полноправный защитник, на которого уповает [target.GetNameNoTier]!"
 pam_interactions_events.0010: "Сколь долго ещё народ будет закрывать глаза на волю [actor.GetFaith.HighGodNamePossessive], согласно которой распределяются земли и титулы? Сколь долго [target.GetTierAsNameNoTooltip|l] будет изнемогать, не видя перед собой пастыря — выходца из дома [actor.GetHouse.GetName]?\n\nЯ обращусь с вашей претензией на титул [target.GetNameNoTierNoTooltip] в каждый двор, в каждый совет; буду упоминать её в каждом трактате.\n\nОбещаю: я не допущу, чтобы ваша претензия умерла вместе с вами."
