 pam_interactions_events.0070.t: "Война, от которой выиграет [puppet_or_actor.GetTitleAsNameNoTooltip]"
 pam_interactions_events.0070.desc_intro_pagan: "«Мерзким язычникам, чья земля — [target.GetNameNoTier] — "
 pam_interactions_events.0070.desc_intro_heretic: "«Еретикам #L [recipient.GetFaith.GetName]ой#! веры, чья земля — [target.GetNameNoTier] — "
 pam_interactions_events.0070.desc_intro_infidel: "«#L [recipient.GetFaith.GetName|U]им#! вероотступникам, чья земля — [target.GetNameNoTier] — "
 pam_interactions_events.0070.desc_intro_heathen: "«#L [recipient.GetFaith.GetName|U]им#! безбожникам, чья земля — [target.GetNameNoTier] — "
 pam_interactions_events.0070.desc: "#EMP проклятья, бедствия, смерть от меча!#!», — кричит [puppet_or_actor.GetTitledFirstNameRegnal], и клич этот слышат все вокруг.\n\n«Подними священное знамя [ROOT.Char.GetFaith.random_GoodGodNamePossessive], [ROOT.Char.GetTitledFirstName]! Я взываю к тебе: [recipient.GetTitledFirstName] — не друг нам, [target.GetNameNoTierNoTooltip] — не дом [Select_CString(recipient.IsFemale, 'ей', 'ему' )]! [Select_CString(recipient.IsFemale, 'Её', 'Его' )] [recipient.GetPrimaryTitle.GetAdjective] [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] да заберёт к себе [ROOT.Char.GetFaith.NegativeAfterLife]!»\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "Поистине, [puppet_or_actor.GetTitleAsNameNoTooltip] желает распространить власть [puppet_or_actor.GetFaith.HighGodNamePossessive] повсюду! [Select_CString(puppet_or_actor.IsFemale, 'Она', 'Он' )] клянётся лично отправиться на войну и дать свои войска в моё распоряжение."
 pam_interactions_events.0070.desc_outro_funding_war: "Эти требования подкреплены деньгами: [puppet_or_actor.GetTitleAsNameNoTooltip] открыть свою военную казну, чтобы мои #L [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]ие#! [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] шли в бой, вооружившись не одной лишь верой."
 pam_interactions_events.0070.a: "«С нами [ROOT.Char.GetFaith.WarGodName]! #EMP В бой!#!»"
 pam_interactions_events.0070.b: "Пусть народ, которым правит [recipient.GetTitledFirstNamePossessiveNoTooltip], живёт в мире."
 cultural_acceptance_gain_refused_incited_holy_war: "Светский правитель не дал развязать священную войну"
 pam_interactions_events.0071.t: "Завоевание региона [target.GetNameNoTierNoTooltip] именем [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pam_interactions_events.0071.desc_intro: "В боевых кличах, в песнях, в молитвах о победе — святое слово [ROOT.Char.GetFaith.HighGodNamePossessive] услышит [target.GetTierAsNameNoTooltip|l], где проживают [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]! В городе [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier], в главном доме молитвы [secondary_recipient.GetName] провозглашает священную войну против"
 pam_interactions_events.0071.desc_intro_pagan: "#L [recipient.GetPrimaryTitle.GetAdjective|l]их#! язычников.\n\nПодобно диким зверям, [recipient.GetTitledFirstName] и [Select_CString(recipient.IsFemale, 'её', 'его' )] [recipient.GetCulture.GetName] разбегутся, увидев, как на них идут праведные воины #L [secondary_recipient.GetFaith.GetReligion.GetAdjective|l]ой#! веры!"
 pam_interactions_events.0071.desc_intro_heretic: "#L [recipient.GetPrimaryTitle.GetAdjective|l]их#! еретиков.\n\nПотоками крови [recipient.GetTitledFirstName] и [Select_CString(recipient.IsFemale, 'её', 'его' )] гнусные #L [recipient.GetPrimaryTitle.GetAdjective|l]ие#! еретики будут смыты с этих земель! Так всегда бывает с теми, кто искажает то, что говорит [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0071.desc_intro_infidel: "правителя, чья земля — [recipient.GetPrimaryTitle.GetNameNoTier].\n\n#L [secondary_recipient.GetFaith.GetReligion.GetAdjective|U]ие#! неверные, как и все, кто склонился перед #EMP джихадом#! Пророка, скоро будут покорены!"
 pam_interactions_events.0071.desc_intro_heathen: "правителя, чья земля — [recipient.GetPrimaryTitle.GetNameNoTier].\n\n[ROOT.Char.GetFaith.WarGodName] тому порукой — [Select_CString(secondary_recipient.IsFemale, 'она', 'он' )] сокрушит язычников! И все #L [ROOT.Char.GetFaith.GetReligion.GetName|l]ие#! народы будут глядеть на это в изумлении."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nМои войска не будут при этом бездействовать. Нет! Они отправятся на штурм стен города [recipient.GetCapitalLocation.GetTitle.GetNameNoTier], так же, как и [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l], которыми командует [secondary_recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\n[secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] и не только уже отправляют своих бравых воинов под знаменем, которое несёт [secondary_recipient.GetTitledFirstName]."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nУже одна благосклонность [ROOT.Char.GetFaith.HighGodNamePossessive] обещает, что[secondary_recipient.GetTitledFirstNameNoTooltip] победит — но мои щедрые пожертвования подкрепят [Select_CString(secondary_recipient.IsFemale, 'её', 'его' )] уверенность дополнительно."
 pam_interactions_events.0071.a: "Пусть же вечно завидуют тем, кто погибнет за это благое дело."
