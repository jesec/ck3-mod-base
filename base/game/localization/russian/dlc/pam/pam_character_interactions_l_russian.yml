 target_char_must_be_clerical_subordinate_tt: "Как [Concept('ecclesiastical', 'церковный')|E] или [Concept('theocratic', 'теократический')|E] [Concept('ruler', 'правитель')|E], [target_char.GetShortUIName] [Select_CString(target_char.IsLocalPlayer, 'должны', Select_CString(target_char.IsFemale, 'должна', 'должен' ))] быть [Concept('vassal', 'вассалом')|E], [Concept('subordinate', 'подчинённым')|E] или ниже по отношению к [Select_CString(excommunicator.IsLocalPlayer, 'вам', Concatenate('персонажу ', excommunicator.GetShortUIName))]"
 bishop_excommunication_target_secular_tt: "[Select_CString(target_char.IsLocalPlayer, 'Вы должны', Select_CString(target_char.IsFemale, 'должна', 'должен' ))] удовлетворять одному из следующих условий:\n$EFFECT_LIST_BULLET$Быть прямым или непрямым [Concept('vassal', 'вассалом')|E] [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))]\n$EFFECT_LIST_BULLET$[Concept('ruler', 'Править')|E] территорией рядом с территорией [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))] или в границах того же [Concept('clerical_region', 'церковного округа')|E]\n$EFFECT_LIST_BULLET$Иметь [Concept('court_chaplain', 'придворного капеллана')|E], являющегося прямым или непрямым [Concept('subordinate', 'подчинённым')|E] [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))]\n$EFFECT_LIST_BULLET$Иметь [Select_CString(excommunicator.IsLocalPlayer, 'вас', Concatenate('персонажа ', excommunicator.GetShortUIName))] на службе в роли [Concept('court_chaplain', 'придворного капеллана')|E] — и чтобы у [Select_CString(excommunicator.IsLocalPlayer, 'вас', Concatenate('персонажа ', excommunicator.GetShortUIName))] не было [Concept('superior', 'вышестоящего')|E] персонажа\n$EFFECT_LIST_BULLET$Любой прямой или непрямой [Concept('liege', 'сюзерен')|E] должен иметь на службе [Select_CString(excommunicator.IsLocalPlayer, 'вас', Concatenate('персонажа ', excommunicator.GetShortUIName))] в роли [Concept('court_chaplain', 'придворного капеллана')|E]"
 bishop_excommunication_target_courtier_tt: "[Concept('liege', 'Сюзерен')|E] [Select_CString(target_char.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', target_char.GetShortUIName))] должен быть либо непосредственно [Select_CString(excommunicator.IsLocalPlayer, 'вами', Concatenate('персонажем ', excommunicator.GetShortUIName))], либо прямым или непрямым [Concept('vassal', 'вассалом')|E] [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))], либо находиться в границах [Concept('clerical_region', 'церковного округа')|E] [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))], либо быть [Concept('ruler', 'правителем')|E] по соседству"
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U] [Select_CString(target_char.IsLocalPlayer, 'должны', Select_CString(target_char.IsFemale, 'должна', 'должен' ))] находиться в [Concept('realm', 'державе')|E] [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))], соседнем [Concept('county', 'графстве')|E] или в [Concept('clerical_region', 'церковном округе')|E] [Select_CString(excommunicator.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', excommunicator.GetShortUIName))]"
 can_excommunicate_directly: "[Select_CString(puppet_or_actor.IsLocalPlayer, 'Ваш персонаж', Concatenate('персонаж ', puppet_or_actor.GetShortUIName))] может непосредственно [Concept('excommunicate', 'отлучить')|E] [Select_CString(secondary_recipient.IsLocalPlayer, 'вас', Concatenate('персонажа ', secondary_recipient.GetShortUIName))] от церкви"
 no_valid_excommunicator_tt: "Поскольку в вашей [Concept('faith', 'конфессии')|E] нет [Concept('theocratic', 'теократического')|E] [Concept('head_of_faith', 'главы')|E], [Select_CString(secondary_recipient.IsLocalPlayer, 'вас', Concatenate('персонажа ', secondary_recipient.GetShortUIName))] может [Concept('excommunicated', 'отлучить от церкви')|E] лишь могущественный [Concept('ecclesiastical', 'церковный')|E] [Concept('ruler', 'правитель')|E], удовлетворяющий любому из следующих условий:\n$EFFECT_LIST_BULLET$Является [Concept('liege', 'сюзереном')|E] указанного персонажа или выше\n$EFFECT_LIST_BULLET$[Concept('ruler', 'Правит')|E] соседним с владениями указанного персонажа регионом либо имеет [Concept('realm_capital', 'столицу державы')|E] данного персонажа в своём [Concept('clerical_region', 'церковном округе')|E]\n$EFFECT_LIST_BULLET$Является [Concept('superior', 'вышестоящим')|E] или выше по отношению к [Concept('court_chaplain', 'придворному капеллану')|E] указанного персонажа\n$EFFECT_LIST_BULLET$Является [Concept('court_chaplain', 'придворным капелланом')|E] указанного персонажа и не имеет над собой [Concept('superior', 'вышестоящего')|E]"
 excommunicator_must_be_hof_tt: "Только [Concept('head_of_faith', 'глава конфессии')|E] может [Concept('excommunicate', 'отлучить от церкви')|E] персонажа [target_char.GetName]"
 pam_interactions_events.0072.opening: "О, воплощение зла [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)],"
 pam_interactions_events.0072.desc_joined_war: "я иду к тебе. Как миссионер, чтобы развеять твою тьму светом. Как [puppet_or_actor.GetMotherFather], чтобы достойно наказать тебя.\n\nИ на стороне твоего родителя идёт [secondary_recipient.GetName], воин, которого наделяет силой [puppet_or_actor.GetFaith.GoodGodNames]. [Select_CString(secondary_recipient.IsFemale, 'Её', 'Его' )] войска освободят регион [target.GetNameNoTier] от зла."
 pam_interactions_events.0072.desc: "тебя уже ничто не спасёт. Покаяния не будет.\n\nИ вот — проклятая земля [recipient.GetPrimaryTitle.GetNameNoTier] будет расколота! И вот — слуги, которых ведёт [puppet_or_actor.GetFaith.DevilName], будут убиты! Мною подняты на бой армии праведных, и [secondary_recipient.GetName] уже идёт изничтожить тебя!"
 pam_interactions_events.0072.a: "Чем же мы вызвали гнев [puppet_or_actor.GetFaith.HighGodNamePossessive]? Чем заслужили мы подобные злодеяния?! "
 incite_holy_war_past_tense_tt: "[puppet_or_actor.GetShortUIName] [Select_CString(puppet_or_actor.IsLocalPlayer, 'сделали', Select_CString(puppet_or_actor.IsFemale, 'сделала', 'сделал' ))] так, чтобы [secondary_recipient.GetShortUIName] [Select_CString(secondary_recipient.IsLocalPlayer, 'объявили', Select_CString(secondary_recipient.IsFemale, 'объявила', 'объявил' ))] [Concept('holy_war', 'священную войну')|E] за регион [target.GetName]"
 incite_holy_war_joined_tt: "[puppet_or_actor.GetShortUIName] [Select_CString(puppet_or_actor.IsLocalPlayer, 'присоединились', Select_CString(puppet_or_actor.IsFemale, 'присоединилась', 'присоединился' ))] к [Concept('holy_war', 'священной войне')|E] против [Select_CString(recipient.IsLocalPlayer, 'вас', Concatenate('персонажа ', recipient.GetShortUIName))]"
 not_at_war_for_target_title_or_above_tt: "Вы ведёте [Concept('war', 'войну')|E], направленную на регион [target.GetName], либо на [Concept('title', 'титул')|E] в [Concept('de_jure', 'де-юре')|E] иерархии этого региона"
