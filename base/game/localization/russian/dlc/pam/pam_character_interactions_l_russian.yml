 ecclesiastical_de_jure_shifting_grant_interaction_decline_toast_puppeteer: "[recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsLocalPlayer, 'отклонили', Select_CString(recipient.IsFemale, 'отклонила', 'отклонил' ))] #EMP де-юре#! сдвиг персонажа [Select_CString(puppet_or_actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', puppet_or_actor.GetShortUIName))]"
 no_reason_to_refuse_tt: "Не имеет причин для отказа"
 ecclesiastical_de_jure_shifting_grant_interaction_notification: "Как [puppet_or_actor.GetMotherFather|l] заботится о любимом чаде, так и [puppet_or_actor.GetPrimaryTitle.GetName] пусть заботится о регионе [target.GetName] вечно. Давайте же закрепим эти священные узы в указе."
 pam_interactions_events.0096.opening: "[ROOT.Char.GetFaith.random_GoodGodNames] — сама справедливость!"
 pam_interactions_events.0096.desc: "Сделать так, чтобы [target.GetNameNoTier] и [former_de_jure_liege.GetNameNoTier] разделились — поистине мудрое и праведное решение!\n\nПусть же будет так, как вы повелели: навеки [de_jure_master.GetPrimaryTitle.GetNameNoTier] пусть служит разделом, по одну сторону которого [target.GetTierAsNameNoTooltip], по другую — [ROOT.Char.GetFaith.PositiveAfterLife]. Так верные #L [target.GetAdjectiveNoTooltip|l]ие#! [ROOT.Char.GetFaith.GetAdherentNamePlural|l] найдут путь, который указывает им [ROOT.Char.GetFaith.HighGodName].\n\nЭтот принцип я закреплю в своей священной клятве."
 pam_interactions_events.0096.a: "Путь же это и правда будет гармоничный союз."
 any_available_title_same_tier_or_higher_tt: "Любой из [Concept('titles', 'титулов')|E] [Select_CString(recipient.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', recipient.GetShortUINamePossessive))] имеет [Concept('de_jure', 'де-юре')|E] [Concept('liege', 'сюзеренский')|E] титул без [Concept('holder', 'владетеля')|E], причём [Concept('title_tier', 'уровень титула ')|E] ниже «[Concept('hegemony', 'гегемония')|E]»"
