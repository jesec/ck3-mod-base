 pam_interactions_events.0083.desc: "Знайте, что война, которую ведёте вы и [puppet_or_actor.GetTitledFirstName], привлекла моё внимание, и исход её кажется мне предрешённым. Дальнейшая борьба повлечёт ненужные смерти среди христиан, оттягивая неминуемое поражение, и мне не нужна эта кровь на моих руках.\n\nЯ объявляю, что война выиграна. Те, кто исполнит волю церкви, не останутся без награды."
