 RECIPIENT_HOF_ASK_FOR_GOLD: "Как в дни изобилия, так и в дни нехватки [actor.GetPrimaryTitle.GetNameNoTier] исправно платит священную десятину. Теперь же, когда [actor.GetPrimaryTitle.GetTierAsNameNoTooltip] ощущает особенно сильную нужду, я хочу попросить: пусть [actor.GetFaith.WealthGodName] вознаградит нас за прилежность."
 modifier_provided_by_christian_situation_tt: "#EMP #Weak Причина: [GetSituation('the_christian_church').GetTopSubRegion.GetCurrentPhase.GetName|V1] — [GetSituation('the_christian_church').GetName|V1]#!#!"
 ASK_FOR_INFLUENCE_TEXT: "\n[actor.GetFaith.PriestNeuterPlural|U] влиятельны не только там, где гимнами славится [actor.GetFaith.HighGodName] — их слушают и там, где всё решается шёпотом.\n\nЯ прошу вас: пусть священные губы замолвят словечко за мою семью во дворце правителя."
 custom.every_non_actor_house_vassal: "Любой [Concept('vassal', 'вассал')|E], которого не чтит своим [Concept('house', 'дом')|E] [actor.GetHouse.GetName]   [actor.GetTopLiege.GetPrimaryTitle.GetName]"
 clerical_influence_investment_bonus_tt: "В течение следующих #high 10 лет#! [recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'будете', 'будет')] получать @piety_icon![Concept('piety', 'благочестие')|E] и @prestige_icon![Concept('prestige', 'престиж')|E], когда член [Concept('house', 'дома')|E] [actor.GetHouse.GetName] будет получать [Concept('title', 'титул')|E]"
