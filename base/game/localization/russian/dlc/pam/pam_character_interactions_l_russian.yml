 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal],"
 pam_interactions_events.0050.desc: "[puppet_or_actor.GetFaith.ReligiousText] гласит, что брак есть священный союз. В приземлённом же мире настоящих мужчин и женщин всё бывает... не столь радужно.\n\nВы постановили, что [secondary_recipient.GetTitledFirstName] и я должны сохранять свой брак. Что же нам тогда делать с его обломками?.."
 pam_interactions_events.0050.aa: "Вас тянут на дно желания плоти."
 pam_interactions_events.0050.aa.tt: "Объяснить этой бесчувственной бестолочи, что [Select_CString(puppet_or_actor.IsFemale, 'она должна', 'он должен' )] забыть обо всех желаниях и ожиданиях плоти…"
 pam_interactions_events.0050.a: "Кого ждёт [recipient.GetFaith.PositiveAfterLife]? Тех, кто любит. Тех, кто ценит."
 pam_interactions_events.0050.a.tt: "С вашим наставлением эта почти уже распавшаяся пара сможет найти утешение друг в друге."
 pam_interactions_events.0050.b: "[recipient.GetFaith.GoodGodNames] помнят ваши клятвы — не забывайте их и вы."
 pam_interactions_events.0050.c: "Такая насмешка над священным брачным союзом — богохульство!"
 pam_interactions_events.0050.d: "Молитесь вместе: пусть [recipient.GetFaith.HighGodName] наставит вас."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nВы разорвёте не благословенный союз, а противоестественный инцест!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nНаша #L [puppet_or_actor.GetFaith.GetName|l]ая#! вера говорит мне изгнать из своей постели [Select_CString(secondary_recipient.IsFemale, 'эту женщину', 'этого мужчину' )]."
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nУчтите, что [secondary_recipient.GetFirstNameNoTooltip] обвиняется в полном мужском бессилии..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip] открыто занимается гнусным инцестом, оскверняя наш союз! Какой позор!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip] [Select_CString(secondary_recipient.IsFemale, 'была мне неверна', 'был мне неверен' )], и все об этом знают!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\n[puppet_or_actor.GetFaith.HighGodName] велит, чтобы я сочеталась браком с мужчиной! [secondary_recipient.GetFirstNameNoTooltip] же, скажем так… не имеет важных мужских качеств."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\n[puppet_or_actor.GetFaith.HighGodName] мне в свидетели — [Select_CString(secondary_recipient.IsFemale, 'мой мерзкий', 'моя мерзкая' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] [Select_CString(secondary_recipient.IsFemale, 'пыталась', 'пытался' )] организовать моё убийство!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip] — [Select_CString(secondary_recipient.IsFemale, 'многомужница', 'многоженец' )]! Я лишь одно из тел в [Select_CString(secondary_recipient.IsFemale, 'её', 'его' )] гареме. Освободите меня!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\nРазве [puppet_or_actor.GetFaith.HighGodName] разрешит мне и дальше делить постель с [Select_CString(secondary_recipient.IsFemale, 'мерзкой', 'мерзким' )] #L [secondary_recipient.GetFaith.GetName][Select_CString(secondary_recipient.IsFemale, 'ой', 'им' )]#! [Select_CString(secondary_recipient.IsFemale, 'язычницей', 'язычником' )]?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\nНи для кого не секрет, почему я молю вас об этом! [secondary_recipient.GetFirstNameNoTooltip], [Select_CString(secondary_recipient.IsFemale, 'распутная', 'распутный' )] [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))], мне изменяет."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nНаш брак бесплоден, и надежд на ребёнка нет."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\nВы должны придумать на то какую-нибудь причину, хотя, [puppet_or_actor.GetFaith.HighGodName] мне свидетель, [secondary_recipient.GetFirstNameNoTooltip] так [Select_CString(secondary_recipient.IsFemale, 'ненавистна', 'ненавистен' )] мне, что уже этого должно быть достаточно."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nУ меня нет на то законных оснований, но я верю, что вы, с вашим знанием божественного закона, #EMP найдёте#! основания признать брак недействительным."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\nВы разорвёте не благословенный союз, а противоестественный инцест!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\nНаша #L [puppet_or_actor.GetFaith.GetName|l]ая#! вера говорит мне изгнать [Select_CString(secondary_recipient.IsFemale, 'эту женщину', 'этого мужчину' )], в которой почивает [Select_CString(puppet_or_actor.IsFemale, 'моя', 'мой' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]."
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE_SECONDARY: "\n\nУчтите, что [secondary_recipient.GetFirstNameNoTooltip] обвиняется в полном мужском бессилии..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] открыто занимается гнусным инцестом, оскверняя их союз! Какой позор!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] изменяет в браке, отчего страдает [Select_CString(secondary_actor.IsFemale, 'моя', 'мой' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] — и все об этом знают!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName] велит, чтобы моя [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] сочеталась браком с мужчиной! [secondary_recipient.GetFirstNameNoTooltip] же, скажем так… не имеет важных мужских качеств."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName] мне в свидетели: [Select_CString(secondary_recipient.IsFemale, 'мерзкий', 'мерзкая' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] [Select_CString(secondary_recipient.IsFemale, 'пыталась', 'пытался' )] организовать убийство, жертвой которого [Select_CString(secondary_actor.IsFemale, 'должна была', 'должен был' )] стать [Select_CString(secondary_actor.IsFemale, 'моя', 'мой' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] — [Select_CString(secondary_recipient.IsFemale, 'многомужница', 'многоженец' )]! [Select_CString(secondary_actor.IsFemale, 'Моя', 'Мой' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] — лишь одно из тел в [Select_CString(secondary_recipient.IsFemale, 'её', 'его' )] гареме. Освободите [Select_CString(secondary_actor.IsFemale, 'её', 'его' )]!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH_SECONDARY: "\n\nРазве [puppet_or_actor.GetFaith.HighGodName] разрешит, чтобы [Select_CString(secondary_actor.IsFemale, 'моя', 'мой' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] и дальше [Select_CString(secondary_actor.IsFemale, 'делила', 'делил' )] постель с [Select_CString(secondary_recipient.IsFemale, 'мерзкой', 'мерзким' )] #L [secondary_recipient.GetFaith.GetName]#! #L [Select_CString(secondary_recipient.IsFemale, 'ой', 'им' )]#! [Select_CString(secondary_recipient.IsFemale, 'язычницей', 'язычником' )]?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT_SECONDARY: "\n\nНи для кого не секрет, почему я молю вас об этом! [secondary_recipient.GetFirstNameNoTooltip], [Select_CString(secondary_recipient.IsFemale, 'распутная', 'распутный' )] [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))], изменяет в браке, отчего страдает [Select_CString(secondary_actor.IsFemale, 'моя', 'мой' )] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY_SECONDARY: "\n\nИх брак бесплоден и надежд на ребёнка нет."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED_SECONDARY: "\n\nВы должны придумать на то какую-нибудь причину, хотя, [puppet_or_actor.GetFaith.HighGodName] мне свидетель, [secondary_recipient.GetFirstNameNoTooltip] так [Select_CString(secondary_recipient.IsFemale, 'ненавистна', 'ненавистен' )] нам, что уже этого должно быть достаточно."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED_SECONDARY: "\n\nУ меня нет на то законных оснований, но я верю, что вы, с вашим знанием божественного закона, #EMP найдёте#! основания признать брак недействительным."
 DIVORCE_INDUCEMENTS: "Побуждение к подчинению:"
 cleric_divorce_fuckery_tt: "@alert_icon! #bold #alert_trial Поскольку [puppet_or_actor.GetShortUIName] не [Select_CString(puppet_or_actor.IsLocalPlayer, 'выбрали', Select_CString(puppet_or_actor.IsFemale, 'выбрала', 'выбрал' ))] способа #high побуждения к подчинению#! #weak (см. ниже)#!:#!#!"
 cleric_cause_house_feud_tt: "Может вызвать [Concept('house_feud', 'вражду')|E] между [Concept('houses', 'домами')|E] [divorcer.GetHouse.GetName] и [secondary_recipient.GetHouse.GetName]"
 cleric_force_holy_order_lease_tt: "Может [Concept('lease', 'сдать в аренду')|E] одно из [Concept('holdings', 'владений')|E] [Select_CString(divorcer.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', divorcer.GetShortUIName))] [Concept('holy_order', 'духовно-рыцарскому ордену')|E]"
 cleric_get_hook_tt: "Может получить @hook_on_me_icon![Concept('hook', 'влияние')|E] на [Select_CString(divorcer.IsLocalPlayer, 'вас', Concatenate('персонажа ', divorcer.GetShortUIName))]"
 cleric_get_hook_forcer_tt: "Может получить @hook_on_me_icon![Concept('hook', 'влияние')|E] на [Select_CString(forcing_divorce.IsLocalPlayer, 'вас', Concatenate('персонажа ', forcing_divorce.GetShortUIName))]"
 cleric_put_spouse_in_monastery_tt: "Может вынудить [Select_CString(secondary_recipient.IsLocalPlayer, 'вас', Concatenate('персонажа ', secondary_recipient.GetShortUIName))] получить свойство «[GetTrait('devoted').GetName( secondary_recipient )]»"
 JUSTIFY_DIVORCE_INTERACTION_OPTION: "Оправдание религиозным законом"
 divorce_justified_tt: "Что-либо из перечисленного:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] [Select_CString(secondary_recipient.IsFemale, 'пыталась', 'пытался' )] вас убить\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] — [GetTrait('adulterer').GetName( secondary_recipient )]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] обладает очень низкой [Concept('fertility', 'плодовитостью')|E], и ваш брак бесплоден\n$EFFECT_LIST_BULLET$[Concept('faith', 'Конфессия')|E], к которой принадлежит [secondary_recipient.GetShortUIName], делает [Select_CString(secondary_recipient.IsFemale, 'её', 'его' )] [Concept('faith_hostile', 'врагом')|E] или [Concept('faith_evil', 'воплощённым злом')|E]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] имеет несколько [Concept('spouses', 'супругов или супруг')|E], хотя это запрещено\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] — импотент\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] состоит в [Concept('incestuous', 'кровосмесительной')|E] любовной связи\n$EFFECT_LIST_BULLET$Брак, в котором состоите вы и [secondary_recipient.GetShortUIName], является [Concept('incestuous', 'инцестом')|E]\n$EFFECT_LIST_BULLET$Брак, в котором состоите вы и [secondary_recipient.GetShortUIName] — однополый и потому запрещён"
 divorce_justified_secondary_tt: "Что-либо из перечисленного:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] [Select_CString(secondary_recipient.IsFemale, 'пыталась', 'пытался' )] убить персонажа [secondary_actor.GetShortUIName]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] — [GetTrait('adulterer').GetName( secondary_recipient )]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] обладает очень низкой [Concept('fertility', 'плодовитостью')|E] [fertility|E] и их брак бесплоден\n$EFFECT_LIST_BULLET$[Concept('faith', 'Конфессия')|E], к которой принадлежит [secondary_recipient.GetShortUIName], делает [Select_CString(secondary_recipient.IsFemale, 'её', 'его' )] [Concept('faith_hostile', 'врагом')|E] или [Concept('faith_evil', 'воплощённым злом')|E]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] имеет несколько [Concept('spouses', 'супругов')|E], хотя это запрещено\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] — импотент\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] занимается инцестом на стороне\n$EFFECT_LIST_BULLET$Брак, в котором состоят [secondary_actor.GetShortUIName] и [secondary_recipient.GetShortUIName], является [Concept('incestuous', 'инцестом')|E]\n$EFFECT_LIST_BULLET$Брак, в котором состоят [secondary_actor.GetShortUIName] и [secondary_recipient.GetShortUIName] — однополый и потому запрещён"
 JUSTIFY_DIVORCE_REASON: "Развод оправдан религиозным законом: $VALUE|=+0$"
 must_neighbor_recipient_tt: "[recipient.GetShortUIName] не является вашим соседом и не находится в вашей [Concept('realm', 'державе')|E]"
 pam_interactions_events.0060.t: "Оправдание развода"
 pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName] желает расторгнуть свой брак. Другое дело, что, как бы ни противны друг другу были [Select_CString(puppet_or_actor.IsFemale, 'она', 'он' )] и [secondary_recipient.GetTitledFirstName], они заключили священный союз, свидетель чему [puppet_or_actor.GetFaith.HighGodName], и уважительных причин для его расторжения нет.\n\nМне нужно придумать какую-нибудь ложь, чтобы оправдать объявление брака недействительным. Подобное богохульство, я полагаю, заслуживает определённой компенсации…"
 pam_interactions_events.0060.a: "Этот развод заслуживает... громкого скандала."
 pam_interactions_events.0060.a.tt: "Я не стану придумывать лжи во спасение, я лучше выдвину обвинения — пусть [secondary_recipient.GetFirstNameNoTooltip] оправдывается! [Select_CString(secondary_recipient.IsFemale, 'Её', 'Его' )] семья будет вынуждена выступить в [Select_CString(secondary_recipient.IsFemale, 'её', 'его' )] защиту — и семья, к которой принадлежит [puppet_or_actor.GetFirstNameNoTooltip], тоже должна будет оправдывать своего сородича."
 pam_interactions_events.0060.b: "Пусть [puppet_or_actor.GetTitleAsNameNoTooltip|l] пожертвует землю людям веры."
 pam_interactions_events.0060.b.tt: "Если [lease_order.GetName] получит титул, это ослабит бремя на наших душах..."
 pam_interactions_events.0060.c: "Такое одолжение требует ответного одолжения."
 pam_interactions_events.0060.d: "Объявить, что [secondary_recipient.GetFirstNameNoTooltip] [Select_CString(secondary_recipient.IsFemale, 'должна', 'должен' )] пополнить ряды священнослужителей."
 pam_interactions_events.0060.d.tt: "Если [Select_CString(secondary_recipient.IsFemale, 'она дала', 'он дал' )] обет ордену «[divorcee_joining_order.GetName]» ещё давно, значит, этот брак недействителен! И, опять же кто лучше проследит за тем, чтобы [secondary_recipient.GetFirstNameNoTooltip] [Select_CString(secondary_recipient.IsFemale, 'обустроилась', 'обустроился' )] в своей новой жизни, чем я?"
 pam_interactions_events.0060.e: "Ничего не требовать от несчастливой пары."
