 pam_interactions_events.0011.opening: "[actor.GetTitleAsName], ненасытный человек!"
 pam_interactions_events.0011: "Это послание я пишу тебе с глубочайшей озабоченностью. Разве не находишь ты унизительным столь бесстыдное упорство в попытках завладеть тем, что тебе не принадлежит? Разве не боишься ты рассердить [actor.GetFaith.HighGodNamePossessive] и своих братьев и сестёр по #L [actor.GetFaith.GetReligion.GetName|l]ой#! вере?\n\nКогда [actor.GetFaith.PositiveAfterLife] — или же, если судьба вздумает свершить возмездие, [actor.GetFaith.NegativeAfterLife] — примет к себе твой дух, а [target.GetNameNoTier] вздохнёт спокойно, мы будем молиться, чтобы и в дальнейшем в этих краях царствовал мир."
 pam_interactions_events.0011.a: "Ах ты [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('recipient'))]! Ты смеешь пререкаться со мной?!"
