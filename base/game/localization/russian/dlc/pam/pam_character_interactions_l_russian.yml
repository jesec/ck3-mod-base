 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName], о несправедливо [Select_CString(actor.IsFemale, 'обездоленная', 'обездоленный')] [actor.GetTitledFirstNameNoTooltip|l]!"
 pam_interactions_events.0020_threatened: "Воздержись от страшных кар, от громкого порицания, от грубой силы, что тебе так хочется применить, лишь бы пострадали мои [secondary_recipient.GetFaith.HouseOfWorshipPlural]! Не обрушивай свой гнев на головы #L [secondary_recipient.GetFaith.GetReligion.GetName|l]ого#! народа, ибо твоя решительность тебе ещё пригодится: претензия на титул [target.GetNameNoTier] отныне твоя."
 pam_interactions_events.0020_offer_hook: "Ты обещаешь, что [secondary_recipient.GetPrimaryTitle.GetNameNoTier] будет пользоваться твоим расположением, и эти слова сподвигли меня найти среди старых бумаг подтверждение о твоём праве заявить претензию на титул [target.GetNameNoTier]!"
 pam_interactions_events.0020_indebted: "Пусть я всего лишь [secondary_recipient.GetFaith.PriestNeuter|l], но мне ведомо чувство долга; после долгих поисков мне удалось найти неопровержимое свидетельство того, что ты по праву считаешься наследником титула [target.GetNameNoTier], но тебе отказали в справедливости!"
 pam_interactions_events.0020: "Твоё право заявить претензию на титул [target.GetNameNoTier] — не что иное, как Божий промысел! Твой совет уже должен был получить от меня доказательства этого утверждения."
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal] вряд ли воспримет эту весть благосклонно, однако в глазах [secondary_recipient.GetFaith.FateGodNamePossessive] этот человек — не более чем обманщик."
 pam_interactions_events.0020.a.low_zeal: "Вот так переписывается история…"
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip] принадлежит мне по праву, ниспосланному свыше!"
 pam_interactions_events.0020.a: "Моя претензия заявлена, а [recipient.GetTitledFirstNameNoTooltip|l] может идти к чёрту."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName] оказывает милость: [puppet_or_actor.GetShortUIName] получает претензию на регион [target.GetNameNoTier]"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName]!"
 pam_interactions_events.0021: "Если бы титул [target.GetNameNoTier] действительно предназначался тебе, разве не был бы он вручён волей [secondary_recipient.GetFaith.HighGodNamePossessive] по праву рождения?\n\nНет, [recipient.GetTitledFirstNameRegnal|l] останется при своём: я не стану идти поперёк [Select_CString(recipient.IsFemale, 'её', 'его')] воли и обрекать наши смертные души на вечные муки тем, что лжесвидетельством поддержу твоё чёрное дело.\n\nПомолись, чтобы на тебя снизошло понимание, насколько ошибочны твои поступки."
 pam_interactions_events.0021.a: "[Select_CString(secondary_recipient.IsFemale, 'Она', 'Он')] чувствует себя смело, ведь [secondary_recipient.GetFaith.HouseOfWorship|l] — за надёжными стенами!"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName] отказывает в милости: запрос персонажа [puppet_or_actor.GetShortUIName] на претензию на регион [target.GetNameNoTier] не удовлетворён"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "Владетель того, что принадлежит мне по праву рождения!"
 pam_interactions_events.0022_shrimp: "Хотя я — всего лишь [actor.GetTitleAsName|l], за мной стоит [actor.GetFaith.GetAdjective|l]: [secondary_recipient.GetFaith.AltPriestTermPlural|l] обнаружили, что титул [target.GetName] принадлежит мне по древнему праву кровного наследования."
 pam_interactions_events.0022_shark: "Среди титулов, оказавшихся волею [actor.GetFaith.HighGodNamePossessive] во владении моего #L [actor.Custom('GetTitleTierAdjective')|l]ого#! семейства, есть и [target.GetName]. Так было всегда, хотя известно об этом стало лишь недавно."
 pam_interactions_events.0022: "То, что доподлинно было известно учёным мужам, недавно подтвердилось вновь: титул [target.GetName] по праву принадлежит мне."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal] поддерживает мою претензию своей священной санкцией. [secondary_recipient.GetPrimaryTitle.GetName] в полной мере на моей стороне.\n\nПоэтому отныне я буду молиться, чтобы в один прекрасный день это чудесное владение — [target.GetNameNoTierNoTooltip] — радушно приняло меня как своего хозяина…"
 pam_interactions_events.0022.a: "Эта претензия — ложь, а [secondary_recipient.GetFaith.PriestNeuter|l] занимает свою должность не по праву!"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "О [Select_CString(secondary_recipient.IsFemale, 'святая мать', 'святой отец')]!"
 pam_interactions_events.0023_shrimp: "Если бы только на моей стороне была правомерная претензия! Разве не будет тогда [target.GetName] процветать под моим добродетельным управлением? Разве [Select_CString(recipient.IsFemale, 'эта', 'этот')] [actor.Custom2('InsultAdjective', recipient)][Select_CString(recipient.IsFemale, 'ая', 'ый')] [recipient.GetFirstNameRegnal] не губит свой народ? Молю, пусть свет [actor.GetFaith.HighGodNamePossessive] озарит меня, пусть даже я — всего лишь [actor.GetTitleAsName|l]."
 pam_interactions_events.0023_shark: "Волею [actor.GetFaith.HighGodNamePossessive] я — хозяин и защитник многочисленных земель и народов. Однако [target.GetName] упорно не даётся мне в руки."
 pam_interactions_events.0023: "Правоверные разделились во мнении: некоторые искренне считают, что мне стоит заявить претензию на титул [target.GetName], иные же отрицают, что у меня есть на это право."
 pam_interactions_events.0023_end: "\n\nВпрочем, нет никаких сомнений, что столь учёному человеку не составит никакого труда #EMP обнаружить#! в собраниях документов необходимое подтверждение, что [target.GetNameNoTierNoTooltip] принадлежит мне… и обеспечить санкцию на выдвижение претензии."
 pam_interactions_events.0023.a: "Да будет [target.GetNameNoTierNoTooltip] твоим владением, [Select_CString(actor.IsFemale, 'дочь моя', 'сын мой')]."
 pam_interactions_events.0023.b: "[secondary_recipient.GetTitleAsNameNoTooltip|U] не занимается распространением лжи."
