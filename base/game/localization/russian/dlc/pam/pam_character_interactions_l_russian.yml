 ECCLESIASTICAL_BESTOW_TITLE_NOTIFICATION: "Все #L [recipient.GetFaith.GetName]ие#! верующие вашей державы заслуживают мира и процветания, коими [recipient.GetFaith.HighGodName] благословляет [target.GetTierAsNameNoTooltip]. Для этого я желаю провозгласить титул [target.GetName] и даровать его вам."
