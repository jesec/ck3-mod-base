 spiritual_counsel_ai_recipient_cynical: "[recipient.GetSheHe|U] обладает свойством «[GetTrait('cynical').GetName( GetNullCharacter )]»: $VALUE|=+0$"
 spiritual_counsel_ai_priest_pious: "У вас высокий [Concept('piety_level', 'уровень набожности')|E]: $VALUE|=+0$"
 spiritual_counsel_ai_priest_very_pious: "У вас очень высокий [Concept('piety_level', 'уровень набожности')|E]: $VALUE|=+0$"
 spiritual_counsel_ai_priest_impious: "У вас низкий [Concept('piety_level', 'уровень набожности')|E]: $VALUE|=+0$"
 spiritual_counsel_ai_priest_virtuous: "У вас есть [Concept('virtuous', 'добродетельные')|E] [Concept('traits', 'свойства')|E]: $VALUE|=+0$"
 spiritual_counsel_ai_priest_sinful: "У вас есть [Concept('sinful', 'греховные')|E] [Concept('traits', 'свойства')|E]: $VALUE|=+0$"
 spiritual_counsel_ai_priest_hof: "Вы — мой [Concept('head_of_faith', 'глава конфессии')|E]: $VALUE|=+0$"
