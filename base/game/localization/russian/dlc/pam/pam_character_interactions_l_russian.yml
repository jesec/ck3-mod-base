 valid_request_unformed_title_holy_war_option_tt: "Хотя бы четверть [Concept('de_jure', 'де-юре')|E] [Concept('counties', 'графств')|E] титула [target.GetNameNoTier] должна принадлежать [Concept('rulers', 'правителям')|E], [Concept('faith', 'конфессия')|E] которых является [Concept('faith_hostile', 'враждебной')|E] или [Concept('faith_evil', 'воплощенным злом')|E] с точки зрения #L [puppet_or_actor.GetFaith.GetName|l]ой#! веры"
