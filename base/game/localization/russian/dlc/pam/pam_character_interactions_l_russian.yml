 pam_reaffirm_doctrine_interaction_desc: "Укрепить [Concept('doctrine', 'доктрину')|E] вашего [Concept('rite', 'течения')|E] перед персонажем [recipient.GetShortUIName], побуждая [Select_CString(recipient.IsFemale, 'её', 'его' )] принять эту доктрину в течении «[recipient.GetRite.GetName]»"
