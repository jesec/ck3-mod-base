 make_external_ruler_puppet_as_seducer_tt: "Вы обладаете свойством «[GetTrait('seducer').GetName( GetNullCharacter )]», а [recipient.GetShortUIName] — ваш(а) [Concept('lover', 'любовник/любовница')|E] или [Concept('soulmate', 'родственная душа')|E], если обладает титулом не ниже [Concept('king', 'королевского')|E]"
 make_external_ruler_puppet_as_torturer_tt: "Вы обладаете свойством «[GetTrait('torturer').GetName( GetNullCharacter )]», а [recipient.GetShortUIName] — [Select_CString(recipient.IsFemale, 'узница', 'узник')] в вашем [Concept('dungeon', 'подземелье')|E]"
 make_external_ruler_puppet_as_family_first_tt: "Вы обладаете свойством «[GetTrait('family_first').GetName( GetNullCharacter )]», а [recipient.GetShortUIName] принадлежит к вашему [Concept('house', 'дому')|E]"
 make_external_ruler_puppet_as_diplomat_tt: "Вы обладаете свойством «[GetTrait('diplomat').GetName( GetNullCharacter )]», а [recipient.GetShortUIName] — ваш [Concept('ally', 'союзник')|E]"
 make_external_ruler_puppet_as_schemer_tt: "Вы обладаете свойством «[GetTrait('schemer').GetName( GetNullCharacter )]», а [recipient.GetShortUIName] находится у вас @weak_hook_icon![Concept('hook', 'на крючке')|E] или под @unspent_strong_hook_icon![Concept('strong_hook', 'сильным влиянием')|E], если обладает титулом не ниже [Concept('king', 'королевского')|E]"
