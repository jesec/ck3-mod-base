 DEMAND_DIVORCE_NOTIFICATION: "Мне придётся потребовать, чтобы вы и [secondary_recipient.GetTitledFirstName] расторгли свой брак."
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nВы и [secondary_recipient.GetFirstNameNoTooltip] родственники, об этом знает весь мир. [actor.GetFaith.HighGodName] не потерпит подобного инцеста."
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nВаш союз позорит образ честного брачного ложа, что задаёт [actor.GetFaith.HighGodName]. Такое продолжаться не может."
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip] молится странным богам, но при этом делит с вами ложе. Такой союз необходимо расторгнуть."
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip] [Select_CString(secondary_recipient.IsFemale, 'ушла', 'ушёл' )] от истинной веры, и может увести от неё и вас. Такой союз необходимо расторгнуть."
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\nВсем известно, что [secondary_recipient.GetFirstNameNoTooltip] [Select_CString(secondary_recipient.IsFemale, 'предала', 'предал' )] ваше брачное ложе. Ваш брак себя изжил, его надо расторгнуть."
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] — лишь [Select_CString(secondary_recipient.IsFemale, 'одна', 'один' )] из многих ваших брачных партнёров, чего не терпит [actor.GetFaith.HighGodName]. Такой брак пора завершить."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nУчёные отследили ваши родословные и установили, что вы и [secondary_recipient.GetFirstNameNoTooltip] состоите в слишком близком родстве, чтобы быть мужем и женой. Кровосмешение недопустимо."
