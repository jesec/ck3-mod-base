 pam_reaffirm_doctrine_interaction_notification: "[recipient.GetRite.GetName|U] отходит от былой ортодоксальности доктрины «[actor.GetRite.GetName]». [Select_CString(actor.IsFemale, 'Ваша', 'Ваш' )] [actor.GetTitleAsName|l] побуждает вас всех покаяться! Пусть [recipient.GetFaith.HighGodName] увидит вашу преданность. Пусть [recipient.GetRite.GetAdherentNamePluralNoTooltip] услышат, как верны вы доктрине «[pam_reaffirm_doctrine.GetDescriptiveName( recipient.GetFaith )]»."
