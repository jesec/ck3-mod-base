 refuse_divorce_celibacy_tt: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer, 'можете', 'может')] силой убеждения заставить [Select_CString(puppet_or_actor.IsLocalPlayer, 'вас', Concatenate('персонажа ', puppet_or_actor.GetShortUIName))] получить свойство «[GetTrait('celibate').GetName( GetNullCharacter )]», что даст @skill_learning_icon! [Concept('lifestyle_experience', 'жизненный опыт')|E] [Concept('learning', 'учёности')|E]"
 refuse_divorce_comfort_tt: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer, 'можете', 'может')] дать мудрый совет, в результате которого [Concept('marriage', 'брак')|E] между [Select_CString(puppet_or_actor.IsLocalPlayer, 'вами', Concatenate('персонажем ', puppet_or_actor.GetShortUIName))] и [Select_CString(secondary_recipient.IsLocalPlayer, 'вами', Concatenate('персонажем ', secondary_recipient.GetShortUIName))] укрепится. Это даст прирост [Concept('opinion', 'мнения')|E] и [Concept('spiritual_fulfillment', 'духовной реализации')|E]"
