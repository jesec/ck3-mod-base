 pam_evangelize_recipient_prohibited_selected_tenet_reason: "[recipient.GetShortUIName] боится вашего [Concept('prohibited_tenet_status', 'запретного')|E] [Concept('personal_tenet', 'личного принципа')|E]: $VALUE|=+0$"
