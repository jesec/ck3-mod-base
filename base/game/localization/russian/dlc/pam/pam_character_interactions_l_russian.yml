 pam_interactions_events.0002.opening: "[ROOT.Char.GetTitledFirstNameRegnal]!"
 pam_interactions_events.0002: "Свидетельства вашей власти столь обильны, что валятся у вас из рук и висят на ваших одеждах подобно гирляндам. Так зачем же вам нужен благоговейный хор, что воспевает [recipient.GetFaith.HighGodNamePossessive]? Грубая сила, чёрные дела и омерзительные заговоры — вот с чем вы пришли в этот мир!\n\nСледите за сохранностью своего #L [ROOT.Char.Custom('GetTitleTierAdjective')|l]ого#! убранства сами: рабы [recipient.GetFaith.HighGodNamePossessive] не станут принимать в этом участие."
