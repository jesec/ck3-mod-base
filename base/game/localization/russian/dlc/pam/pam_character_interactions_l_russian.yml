 pam_evangelize_personal_tenet_interaction_prohibited_secret_tooltip: "Если выбранный [Concept('personal_tenet', 'личный принцип')|E] является [Concept('prohibited_tenet_status', 'запретным')|E], [recipient.GetShortUIName] узнает обо всех ваших [Concept('secrets', 'секретных')|E] запретных личных принципах"
 pam_evangelize_personal_tenet_interaction_popularity_tooltip: "[Concept('tenet_popularity', 'Популярность')|E] выбранного [Concept('personal_tenet', 'личного принципа')|E] увеличится на #P +[recipient.MakeScope.ScriptValue('pam_evangelize_tenet_popularity_gain')|+0]#!"
