 ecclesiastical_de_jure_shifting_grant_target_must_border_de_jure_tt: "Эта территория и [Concept('de_jure', 'де-юре')|E] [recipient.GetPrimaryTitle.GetNamePossessive] должны иметь сухопутную или морскую границу"
 ecclesiastical_de_jure_shifting_grant_target_must_border_de_jure_land_tt: "Эта территория и [Concept('de_jure', 'де-юре')|E] [recipient.GetPrimaryTitle.GetNamePossessive] должны иметь сухопутную границу"
