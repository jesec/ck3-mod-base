 pam_interactions_events.0091.opening: "Мой благодетель,"
 pam_interactions_events.0091.desc_hook_theocrat: "своей помощью вы очень обязали меня. В одной моей руке посох пастыря, другую же крепко держит [recipient.GetFaith.HighGodName]. Так и должно быть, ведь я — верный слуга божий! [target.GetNameNoTier] — великий дар и я принимаю его с благодарностью.\n\nПусть же будет известно повсюду: [target.GetTierAsName] принадлежит духовенству, поскольку того желает [ROOT.Char.GetTitledFirstNameRegnal]!"
 pam_interactions_events.0091.desc_hook: "своей помощью вы очень обязали меня. В одной моей руке скипетр правителя, другую же крепко держит [recipient.GetFaith.HighGodName]. Так и должно быть. [target.GetNameNoTier] — великий дар и я принимаю его с благодарностью.\n\nПусть же будет известно повсюду: [target.GetTierAsName] принадлежит мне, поскольку того желает [ROOT.Char.GetTitledFirstNameRegnal]!"
 pam_interactions_events.0091.desc: "своей помощью вы помогли мне свыше всяких ожиданий. Вышние сферы сильны и добры ко мне — а всё [recipient.GetFaith.HighGodName]!\n\n[target.GetName] — благородная земля. Я буду носить титул и править этими владениями скромно и милостиво."
 pam_interactions_events.0091.a: "[target.GetNameNoTierNoTooltip] будет под моим неусыпным надзором."
 pam_interactions_events.0092.opening_theocratic: "[ROOT.Char.GetFaith.PriestNeuter],"
 pam_interactions_events.0092.opening: "Дитя моё,"
 pam_interactions_events.0092.desc_hook: "пока вы благодарите судьбу за щедрый подарок, что вручает вам [recipient.GetFaith.HighGodName] и прелаты, подумайте, насколько вы в действительности подходите для управления регионом [target.GetTierAsName]. Возможно, вам стоит ещё дополнительно показать свою преданность высшим сферам.\n\nЯ помогу вам в этом своим советом. Пусть же [recipient.GetFaith.HighGodName] радуется вашему правлению в регионе [target.GetNameNoTierNoTooltip] — мы должны сделать для этого всё."
 pam_interactions_events.0092.desc: "[target.GetTierAsNameNoTooltip|U] теперь управляется вами!\n\nМой интерес в вашем успехе был велик, молитвы мои были пламенны. Я лишь прошу вас править хорошо, чтобы истинные верующие региона [target.GetNameNoTier] при вас процветали."
 pam_interactions_events.0092.a: "[recipient.GetFaith.PositiveAfterLife] лично даёт право на правление!"
 request_unformed_title_interaction: "Выпросить титул"
 request_unformed_title_interaction_desc: "Попросить, чтобы [recipient.GetShortUIName] [Select_CString(recipient.IsFemale, 'провозгласила', 'провозгласил' )] несозданный вышестоящий [Concept('de_jure', 'де-юре')|E] [Concept('title', 'титул')|E], включающий в себя ваши земли, и [Select_CString(recipient.IsFemale, 'передала', 'передал' )] его вам"
 REQUEST_UNFORMED_TITLE_NOTIFICATION: "[target.GetName] долгое время пустует, хотя земли этого титула фактически давно мои. Провозгласите его создание, и пусть каждый [puppet_or_actor.GetFaith.GetAdherentName|l] в его пределах знает, что я владею им по милости [puppet_or_actor.GetFaith.HighGodNamePossessive] и вашей воле."
 request_unformed_title_no_hegemony_tt: "У [Concept('clergy', 'духовенства')|E] нельзя выпрашивать [Concept('titles', 'титулы')|E] [Concept('title_tier', 'уровня')|E] «[Concept('hegemony', 'Гегемония')|E]»"
 request_unformed_title_tier_range_tt: "Вы можете выпрашивать лишь [Concept('titles', 'титулы')|E] вашего [Concept('title_tier', 'уровня')|E] или одним уровнем выше"
 request_unformed_title_hold_de_jure_vassal_tt: "Вы должны владеть [Concept('title', 'титулом')|E], [Concept('de_jure', 'де-юре')|E] напрямую входящим в титул [target.GetName]"
 request_unformed_title_third_of_de_jure_tt: "Как минимум треть [Concept('counties', 'графства')|E] титула [target.GetNameNoTier] должна находиться в пределах вашей [Concept('realm', 'державы')|E] и исповедовать #L [puppet_or_actor.GetFaith.GetName|l]ую#! веру"
 request_unformed_title_not_clerics_vassal_tt: "Вы не должны быть [Concept('vassal', 'вассалом')|E] персонажа [recipient.GetShortUIName], который может даровать вам [Concept('titles', 'титулы')|E] обычным способом"
