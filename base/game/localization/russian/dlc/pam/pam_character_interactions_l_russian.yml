 legitimized_by_clergy_hook: "Долг легитимности"
 pam_interactions_events.0100.t: "Больше не бастард"
 pam_interactions_events.0100.desc: "[ROOT.Char.GetFaith.HighGodName] и наши добрые единоверцы теперь свидетели: [actor.GetTitledFirstName] [Select_CString(actor.IsFemale, 'объявила', 'объявил' )] меня законным отпрыском. То, чего меня лишили по рождению, духовенство вернуло мне священными ритуалами и росчерком пера.\n\nПусть же никто больше не называет меня бастардом."
 pam_interactions_events.0100.a: "Пятно на репутации стёрто!"
 pam_interactions_events.0101.opening: "Благословен будь твой дом,"
 pam_interactions_events.0101.desc: "С радостью шлю тебе добрые вести. Я объявил, что [Select_CString(recipient.IsFemale, 'твой', 'твоя' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))], [recipient.GetFirstNameNoTooltip] теперь законный отпрыск и [ROOT.Char.GetFaith.HighGodName] тому свидетель.\n\nБольше ни указы, ни досужие сплетни не поразят [Select_CString(recipient.IsFemale, 'её', 'его' )] в правах."
 pam_interactions_events.0101.a: "И впрямь добрые вести."
