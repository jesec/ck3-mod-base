 # player Priest refuses event
 pam_interactions_events.0031.opening: "[Select_CString(actor.IsFemale, 'Моя своенравная дочь', 'Мой своенравный сын')]!"
 pam_interactions_events.0031.desc: "Волею [actor.GetFaith.HighGodNamePossessive] тебе даны губы, чтобы произносить справедливые речи. Волею [actor.GetFaith.HighGodNamePossessive] тебе даны руки, чтобы держать в них меч. Волею [actor.GetFaith.HighGodNamePossessive] миру даны [actor.GetFaith.PriestNeuterPlural|l], чтобы твои уши внимали их мудрости.\n\nНо тебя обуяла жадность. Речи твои несправедливы; руки твои, движимые страхом и сомнениями, не в силах поднять меч, который ты так жаждешь обратить против врага; я знаю, насколько ненавистно тебе слово «[target.GetNameNoTier]».\n\nПоэтому, прошу тебя, внемли моей мудрости и остановись. Пусть [target.GetTierAsName|l] живёт спокойно."
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip] отказывается слушать мои доводы!"
 # Player clergy response event
 pam_interactions_events.0033.opening: "Хранитель порядка на небе и на земле!"
 pam_interactions_events.0033_de_jure: "Я обращаюсь к тебе за помощью и прошу провозгласить, что моя власть по праву распространяется и на титул [target.GetName], что принадлежит мне де-юре. Надели меня своей санкцией — и тогда [recipient.GetName] прислушается к моим доводам без кровопролития.\n\n"
 pam_interactions_events.0033_claim: "Я хочу довести до конца претензию на титул [target.GetNameNoTier]. Надели меня своей святейшей санкцией — и тогда [recipient.GetName] передаст мне своё владение, и [target.GetTierAsName|l] вздохнёт спокойно, зная, что не пролилось ни капли #L [actor.GetFaith.GetName|l]ой#! крови.\n\n"
 pam_interactions_events.0033_threaten: "Если же ты откажешь мне в этой просьбе, то [target.GetNameNoTierNoTooltip] познает всю силу моего страшного гнева, и уже #EMP тебе#! придётся объясняться перед лицом [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0033_succession: "Если ты согласишься выступить от моего имени, обещаю тебе следующее: если я умру как [actor.GetTitleAsName|l] владения [actor.GetPrimaryTitle.GetNameNoTier] и у меня не будет детей — наследников моего рода, то [actor.GetPrimaryTitle.GetNameNoTier] отойдёт церкви."
 pam_interactions_events.0033_pilgrimage: "В обмен на согласие свыше поспособствовать мне в мирских вопросах я обещаю отправиться в паломничество — такой будет моя благодарность за благословение [actor.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0033_use_hook: "Ведь ты, несомненно, помнишь, что твоё нынешнее положение — моя заслуга, а значит, слова, что выводит твоё перо, должны исходить из моих уст?"
 pam_interactions_events.0033_offer_hook: "Поддержка моих начинаний столь благочестивым человеком — непростое обязательство. Помоги мне в мирской политике — а я помогу тебе в делах грядущих."
 pam_interactions_events.0033_donate: "Окажи мне помощь, обогати мою державу землями — и тогда я с большой радостью сделаю тебе пожертвование."
 pam_interactions_events.0033_fallback: "Переговоры о земле и титулах не приведут ни к чему дельному, если только не вмешается святой посредник. Встанешь ли ты на мою сторону?"
 pam_interactions_events.0033.aa: "Да. Дело сделано."
 pam_interactions_events.0033.a: "Повелеваю: владельцем титула [target.GetNameNoTierNoTooltip] [Select_CString(actor.IsFemale, 'должна', 'должен')] быть [actor.GetFirstNameNoTooltip]."
 pam_interactions_events.0033.a.tt: "Пусть [recipient.GetTitledFirstNameNoTooltip|l] получит от меня послание: хвататься за землю, которая [Select_CString(recipient.IsFemale, 'ей', 'ему')] не принадлежит, — это значит совершать преступление перед лицом [secondary_recipient.GetFaith.HighGodNamePossessive]! И, разумеется, [secondary_recipient.GetTitleAsNameNoTooltip|l] того же мнения."
 pam_interactions_events.0033.b: "Я не могу дать санкцию на такое дерзкое требование."
 pam_interactions_events.0033.b.tt: "В мире и так царит порядок. Пусть [recipient.GetTitledFirstNameNoTooltipRegnal|l] и дальше остаётся владетелем титула [target.GetNameNoTierNoTooltip]."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName] [Select_CString(actor.IsLocalPlayer, 'попытаетесь', 'попытается')] убедить [Select_CString(recipient.IsLocalPlayer, 'вас', Concatenate('персонажа ', recipient.GetShortUIName))] передать титул [target.GetName]; эта попытка может потерпеть неудачу#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName] [Select_CString(actor.IsLocalPlayer, 'можете', 'может')] принудить [Select_CString(recipient.IsLocalPlayer, 'вас', Concatenate('персонажа ', recipient.GetShortUIName))] передать титул [target.GetName], однако есть риск неудачи#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'передадите', 'передаст')] [Select_CString(actor.IsLocalPlayer, 'вам', Concatenate('персонажу ', actor.GetShortUIName))] титул [target.GetName] без всякого сопротивления#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold [Concept('law', 'Закон')|E] «[GetLaw('church_authority_3').GetName]» позволяет вам принудить персонажа [recipient.GetShortUIName] передать титул [target.GetName] персонажу [actor.GetShortUIName] без сопротивления#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "Я, святой посредник, настоящим начинаю переговоры."
 pam_interactions_events.0032_intro: "Вы в меру своих сил заботились о том, чтобы вверенное вам владение — [target.GetNameNoTier] — процветало, однако воля [recipient.GetFaith.HighGodNamePossessive] непреклонна: пусть [target.GetTierAsNameNoTooltip] обретёт нового хозяина в лице такого человека, как [actor.GetName]. Прошу вас уступить эту землю мирно и бескровно.\n\n"
 pam_interactions_events.0032_de_jure: "Ибо [target.GetNameNoTierNoTooltip] принадлежит [Select_CString(actor.IsFemale, 'ей', 'ему')] по #EMP де-юре#! праву."
 pam_interactions_events.0032_claim: "Ибо в глазах Всевышнего нет более справедливой претензии на власть над землёй, что зовётся [target.GetNameNoTierNoTooltip], чем у [Select_CString(actor.IsFemale, 'неё', 'него')]."
 pam_interactions_events.0032.aa: "Так, где там моё перо…"
 pam_interactions_events.0032.aa.flavor: "Всему миру я докажу, что по воле [recipient.GetFaith.HighGodNamePossessive] эти грешники и мошенники оказались лишены всяческой [recipient.GetFaith.GetNameNoTooltip|l]ой добродетели. Всё, чем они когда-либо владели или будут владеть, достаётся им лишь по их собственной дерзости."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP Попытка [Select_CString(actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', actor.GetShortUIName))] получить титул [target.GetName] провалилась#!#!#!"
 pam_interactions_events.0032.a: "Если на то будет воля [actor.GetFaith.HighGodNamePossessive], я откажусь от титула [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0032.b: "Нет. Ваши слова неубедительны."
 pam_interactions_events.0032.b.tt: "Если бы только [actor.GetTitledFirstNameNoTooltip|l] и [secondary_recipient.GetTitledFirstNameNoTooltip|l] замолчали по мановению руки…"
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold Может побудить вас принять перехват титула [target.GetName] одним из следующих способов:#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "Переговоры о титуле [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0030.desc_intro_envoy: "На священной земле [Select_CString(secondary_recipient.IsFemale, 'моя посланница', 'мой посланник')] [secondary_recipient.GetTitledFirstNameRegnal|l] приводит мои доводы касательно титула [target.GetNameNoTier]."
 pam_interactions_events.0030.desc_intro: "[secondary_recipient.GetTitledFirstNameRegnal] [Select_CString(secondary_recipient.IsFemale, 'благословила', 'благословил')] меня, и с [Select_CString(secondary_recipient.IsFemale, 'её', 'его')] разрешения (а заодно пользуясь неприкосновенностью на священной земле) я привожу доводы касательно титула [target.GetNameNoTier]."
 pam_interactions_events.0030.desc: "Сначала — мирные слова о необходимости достичь согласия, затем — аккуратные намёки, граничащие с угрозой: в любой момент может начаться война. Затем — провозглашение уготованных мне прав. Затем — много других речей…\n\n"
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed] не откажется от своего владения просто так: [target.GetTierAsNameNoTooltip|l] — слишком ценное приобретение. Уладить земельный вопрос предстоит либо обещаниями, либо угрозами."
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed] не разожмёт свою железную хватку просто так: [vassal.GetName] — слишком ценный человек. Уладить вопрос о передаче вассала придётся либо золотом, либо угрозами."
 pam_interactions_events.0030.a: "Напомнить, что [recipient.GetFirstNameNoTooltip] имеет определённые… обязательства."
 pam_interactions_events.0030.a.flavor: "И что [actor.GetTitleAsNameNoTooltip|l] владения [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] может заставить их исполнять!"
 pam_interactions_events.0030.b: "[ROOT.Char.Custom2('RelationToMe', recipient)|U] мне ни к чему. [target.GetNameNoTierNoTooltip] — вот что мне нужно."
 pam_interactions_events.0030.b.flavor: "Дать понять: если [recipient.GetFirstNameNoTooltip] откажется, то [Select_CString(recipient.IsFemale, 'она', 'он')] сразу станет вам никем."
 pam_interactions_events.0030.c: "Если [Select_CString(recipient.IsFemale, 'она', 'он')] откажется уступать — осквернить священную землю!"
 pam_interactions_events.0030.c.tt: "Обрушить на грешника шквал обвинений! Проклятье на обе ваши головы! [secondary_recipient.GetTitledFirstNameNoTooltip] и все прочие [actor.GetFaith.PriestNeuterPlural|l] позаботятся о том, чтобы [recipient.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale, 'уступила', 'уступил')]!"
 pam_interactions_events.0030.d: "Пригрозить устроить скандал, который может привести к потере легитимности."
 pam_interactions_events.0030.d.flavor: "[recipient.GetTitleAsNameNoTooltip] почти не пользуется уважением, а значит, вряд ли протянет долго, если речь зайдёт о добром имени…"
 pam_interactions_events.0030.e: "Предложить просто купить титул [target.GetTierAsNameNoTooltip]."
 pam_interactions_events.0030.f: "Пусть судят [ROOT.Char.GetFaith.HighGodName] и [recipient.GetFirstNameNoTooltip]."
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold [recipient.GetShortUIName] вряд ли [Select_CString(recipient.IsLocalPlayer, 'согласитесь', 'согласится')] без должных поощрений!#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Без должных поощрений вероятность того, что [recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'согласитесь', 'согласится')], ниже#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "[target.GetNameNoTierNoTooltip] — предмет дискуссий"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal] продолжает вести спор о титуле [target.GetNameNoTier] не только от имени мирского деятеля (это [actor.GetName]), но также, по собственному утверждению, от имени [recipient.GetFaith.HighGodNamePossessive] — законодателя земного порядка, а заодно всех священнослужителей, причастных к #L [recipient.GetFaith.GetName|l]ой#! вере."
 pam_interactions_events.0034.desc_intro: "[actor.GetName] вновь выдвигает доводы в пользу владения титулом [target.GetNameNoTier], в этот раз подкрепляя их заявлением, что за [Select_CString(actor.IsFemale, 'ней', 'ним')] стоит #L [recipient.GetFaith.GetName|l]ая#! вера."
 pam_interactions_events.0034.desc_vassal: "Ничего, что [target.GetHolder.GetName] [Select_CString(target.GetHolder.IsFemale, 'поклялась', 'поклялся')] служить мне верой и правдой до самой смерти. Похоже, верность покупается и продаётся."
 pam_interactions_events.0034.desc_target: "Ничего, что [target.GetTierAsNameNoTooltip] принадлежит мне по праву — в том числе и потому, что за эту землю мне пришлось проливать кровь. В этом мире всё покупается и продаётся."
 pam_interactions_events.0034.desc: "\n\nЗдесь, на священной земле, я воспринимаю беззастенчивое попрание своих прав с полным спокойствием и размышляю над предложениями.\n\n"
 pam_interactions_events.0034.desc_method_hook: "Обещание сделать недействительными обязательства, которые на меня [Select_CString(actor.IsFemale, 'наложила', 'наложил')] [actor.GetTitledFirstNameNoTooltip|l]."
 pam_interactions_events.0034.desc_method_relation: "Полный крах нашего взаимного доверия, дружбы и любви. Сердце этого человека, как утверждает [actor.GetFirstNameNoTooltip], непреклонно; для него нет ничего важнее земельного вопроса.\n\n[Select_CString(actor.IsFemale, 'Она', 'Он')] возненавидит меня на всю оставшуюся жизнь, если не получит своего."
 pam_interactions_events.0034.desc_method_piety: "Угроза, что мои и без того непростые отношения с верой потерпят полнейший крах. Вместе с этим пострадает и репутация, которой пользуется [actor.GetTitledFirstNameNoTooltip|l], однако [Select_CString(actor.IsFemale, 'её', 'его')] благочестие не так много людей подвергает сомнению."
 pam_interactions_events.0034.desc_method_legitimacy: "Серьёзная угроза моей легитимности. Отвратительная перебранка по поводу титула [target.GetNameNoTierNoTooltip] у всех на глазах — это скандал, который выставит на посмешище нас обоих…"
 pam_interactions_events.0034.desc_method_gold: "Куча звонких монет. Как утверждает [actor.GetTitleAsNameNoTooltip|l], [target.GetTierAsNameNoTooltip] более чем стоит этих денег."
 pam_interactions_events.0034.desc_no_method: "#EMP Совершенно ничего#! — только требование титула [target.GetNameNoTier] и расчёт, что меня устрашит если не презрение, с которым ко мне будут относиться [recipient.GetFaith.PriestNeuterPlural|l], то сама война."
 pam_interactions_events.0034.a: "[Select_CString(actor.IsFemale, 'Она', 'Он')] может поднять своё знамя над владением [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0034.b: "Пока я не скончаюсь, [target.GetTierAsNameNoTooltip] будет принадлежать мне."
 pam_interactions_events.0035.t: "Титул [target.GetNameNoTierNoTooltip] приобретён"
 pam_interactions_events.0035.desc_intro: "Поразмыслив немного, [recipient.GetFirstNameNicknamed] уступает. Переговоры о передаче титула [target.GetNameNoTier] оказались быстрыми и плодотворными.\n\nУказ о моих правах, о котором [Select_CString(secondary_recipient.IsFemale, 'объявила', 'объявил')] [secondary_recipient.GetTitledFirstName|l], начал действовать."
 pam_interactions_events.0035.desc_hook: "Обязательства, которые [Select_CString(recipient.IsFemale, 'несла', 'нёс')] передо мной [recipient.GetFirstNameNoTooltip], добросовестно исполнены."
 pam_interactions_events.0035.desc_relation: "Да, пролито немало горьких слёз, а радость ушла навсегда. [recipient.GetFirstNameNoTooltip] никогда не простит мне подлый удар из-за такой вещи, как [target.GetNameNoTierNoTooltip]. Однако…"
 pam_interactions_events.0035.desc_piety: "Таким образом, угрозы, что мы оба — и я, и [recipient.GetFirstNameNoTooltip] — перенесём страшное бесчестье, теперь не нужно претворять в жизнь."
 pam_interactions_events.0035.desc_legitimacy: "Таким образом, угрозы заставить народ осуждать и клеветать теперь не нужно претворять в жизнь."
 pam_interactions_events.0035.desc_gold: "Я охотно выплачиваю запрошенную сумму. Мои счетоводы и кредиторы уже получили распоряжения."
 pam_interactions_events.0035.desc_fallback: "Какой невероятной силой оказались наделены [actor.GetFaith.PriestNeuterPlural|l] #L [actor.GetFaith.GetName|l]ого#! толка — а вместе с ними и я! Не нужно идти ни на кого войной, не нужны солдаты — достаточно лишь одного приказа. Поистине на то воля [actor.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName] поклянётся мне в верности."
 pam_interactions_events.0035.desc: "\n\n[target.GetTierAsNameNoTooltip|U] принадлежит мне."
 pam_interactions_events.0035.a: "Да здравствует [target.GetNameNoTierNoTooltip]! Пусть всюду вьются мои знамёна!"
 pam_interactions_events.0036.t: "В титуле [target.GetNameNoTierNoTooltip] отказано"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName], [Select_CString(recipient.IsFemale, 'которую', 'которого')] окружили удалые солдаты, — им не терпится схватиться за оружие, хотя [secondary_recipient.GetTitledFirstName|l] всячески потворствует миру, — даёт ответ:\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName], [Select_CString(recipient.IsFemale, 'которую', 'которого')] окружили дюжие [recipient.Custom('KnightCulturePluralNoTooltip')|l], — им не терпится схватиться за оружие, хотя [secondary_recipient.GetTitledFirstName|l] всячески потворствует миру, — даёт ответ:\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName], [Select_CString(recipient.IsFemale, 'прибывшая', 'прибывший')] сюда в одиночестве, — настолько [Select_CString(recipient.IsFemale, 'её', 'его')] приободрили старания, с которыми [secondary_recipient.GetTitledFirstName|l] потворствует миру, — даёт однозначный ответ:\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName] в окружении телохранителей и с явным презрением к стараниям, с которыми [secondary_recipient.GetTitledFirstName|l] потворствует миру, даёт ответ:\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName] чувствует себя смело — [Select_CString(recipient.IsFemale, 'её', 'его')] окружили дюжие [recipient.Custom('KnightCulturePluralNoTooltip')|l]. С явным презрением к стараниям, с которыми [secondary_recipient.GetTitledFirstName|l] потворствует миру, [Select_CString(recipient.IsFemale, 'она', 'он')] даёт ответ:\n\n"
 pam_interactions_events.0036.desc_hook: "«Мало что моему сердцу дорого так, как [target.GetNameNoTier], — даже связывающие меня обязательства."
 pam_interactions_events.0036.desc_relation: "«Что мне [actor.GetPrimaryTitle.GetNameNoTier], если [Select_CString(actor.IsFemale, 'местная', 'местный')] [actor.GetTitleAsName|l] плюёт мне в душу и рвёт моё сердце на кусочки? Я больше не желаю слышать от [Select_CString(actor.IsFemale, 'неё', 'него')] ни слова."
 pam_interactions_events.0036.desc_piety: "«[target.GetNameNoTier] так сильно манит тебя, что ты не боишься увязнуть вместе со мной во грехе и обвинениях? Ну что же…"
 pam_interactions_events.0036.desc_legitimacy: "«Веди свои змеиные речи! Пусть [target.GetNameNoTier] со своим народом, а заодно и все другие народы обернутся против нас обоих."
 pam_interactions_events.0036.desc_gold: "«Ты считаешь, что [target.GetNameNoTier] — это товар, который можно купить за золото и серебро? Нет, [target.GetTierAsNameNoTooltip|l] — не фрукты с прилавка. Даже не мечтай о таком простом обмене."
 pam_interactions_events.0036.desc_fallback: "«Может ли так случиться, что [actor.GetTitleAsName|l] и [secondary_recipient.GetTitleAsNameNoTooltip|l] произнесут всего несколько слов — и [target.GetNameNoTier] покорится? Нет, никогда."
 pam_interactions_events.0036.desc_afraid: "Если ко мне прибудут [recipient.GetFaith.PriestNeuterPlural|l] — я приму их. Если прибудут послы — я выйду с ними на переговоры».\n\n«Однако [target.GetTierAsNameNoTooltip|l] не отдаётся просто так»."
 pam_interactions_events.0036.desc_pious: "Пусть приезжают нечистые на руку [recipient.GetFaith.PriestNeuterPlural|l], пусть встречает [target_capital.GetTitle.GetNameNoTier] непрошеных гостей при оружии…»\n\n«Я не откажусь от своего: [target.GetTierAsNameNoTooltip] принадлежит мне по воле [recipient.GetFaith.HighGodNamePossessive]»."
 pam_interactions_events.0036.desc: "Пусть приезжают громогласные [recipient.GetFaith.PriestNeuterPlural|l], пусть встречает [target_capital.GetTitle.GetNameNoTier] непрошеных гостей при оружии — ведь ваши [actor.Custom('GetFighterTermPlural')|l] не расстаются со смертоносным железом…»\n\n«Однако [target.GetTierAsNameNoTooltip] останется при мне. Я не расстаюсь со своими владениями просто так»."
 pam_interactions_events.0036.a_relation: "Да как [Select_CString(recipient.IsFemale, 'она', 'он')] смеет мне отказывать?!"
 pam_interactions_events.0036.a: "Воля, которую высказывает [secondary_recipient.GetTitleAsNameNoTooltip|l], — закон! Перечить ей постыдно."
 clergy_land_transfer_refusal_tt: "Отказ отдавать титул [target.GetName] [Select_CString(actor.IsLocalPlayer, 'вам', Concatenate('персонажу ', actor.GetShortUIName))]"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip|l] владения [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!"
 pam_interactions_events.0037.desc: "Спешу сообщить вам, поскольку сия весть застала врасплох и меня: отныне [actor.GetTitleAsName|l] земли [actor.GetPrimaryTitle.GetNameNoTier] — ваш сюзерен.\n\nТак желает [secondary_recipient.GetTitledFirstNameRegnal|l], под чьим надзором я и [actor.GetTitledFirstNameNicknamed|l] вели переговоры о том, кому завтра будет принадлежать [ROOT.Char.GetPrimaryTitle.GetTierAsName|l]. Ваш прежний сюзерен [recipient.GetPrimaryTitle.GetNameNoTier] не смог бы попрекнуть вас в недостаточной верности — так служите же верой и правдой и новому сюзерену."
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName] теперь ваш [Concept('liege', 'сюзерен')|E]"
 pam_interactions_events.0037.a: "Мой обет больше недействителен. Отныне никто не сможет мне приказывать."
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip] [Select_CString(recipient.IsFemale, 'отказалась', 'отказался')] от сюзеренитета. И если [actor.GetTitledFirstNameNoTooltip|l] желает занять [Select_CString(recipient.IsFemale, 'её', 'его')] место, то пусть лучше прибывает во владение [target.GetNameNoTierNoTooltip] во всеоружии."
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? Это правда?"
 pam_interactions_events.0037.b.tt: "Когда-то на устах моих людей было одно слово — «[recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]». Теперь же, полагаю, их взгляды будет притягивать [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 clergy_transfer_land_third_person_tt: "[recipient.GetTitledFirstNameNoTooltipRegnal] уступает владение [target.GetNameNoTierNoTooltip]"
 clergy_land_transfer_acceptance_tt: "[secondary_recipient.GetTitledFirstNameNoTooltip] посредничает в ваших интересах"
 clergy_land_interaction_recipient_forced_tt: "#P #bold #EMP [recipient.GetShortUIName] не может отказаться. [target.GetName] будет принадлежать вам!#!#!#!"
 clergy_land_interaction_recipient_possible_tt: "#alert_trial Если [recipient.GetShortUIName] #bold [Select_CString(recipient.IsLocalPlayer, 'согласитесь', 'согласится')]#!:#!"
 clergy_land_interaction_recipient_refuse_tt: "#alert_trial Если [recipient.GetShortUIName] #bold [Select_CString(recipient.IsLocalPlayer, 'откажетесь', 'откажется')]#!:#!"
 clergy_land_increased_possibility_hook_tt: "#EMP #weak Согласие более вероятно, поскольку [recipient.GetShortUIName] — благородный человек#!#!"
 clergy_land_increased_possibility_relation_tt: "#EMP Согласие более вероятно, поскольку [recipient.GetShortUIName] — добрый человек#!#!"
 clergy_land_increased_possibility_piety_tt: "#EMP #weak Согласие более вероятно, поскольку [recipient.GetShortUIName] — фанатичный человек#!#!"
 clergy_land_increased_possibility_legitimacy_tt: "#EMP #weak Согласие более вероятно, поскольку [recipient.GetShortUIName] — трусливый человек#!#!"
 clergy_land_increased_possibility_gold_tt: "#EMP #weak Согласие более вероятно, поскольку [recipient.GetShortUIName] — жадный человек#!#!"
 recipient_becomes_potential_rival_tt: "[actor.GetShortUIName|U] [Select_CString(actor.IsLocalPlayer, 'стали', Select_CString(actor.IsFemale, 'стала', 'стал' ))] ближе к [Concept('rivalry', 'соперничеству')|E] с [Select_CString(recipient.IsLocalPlayer, 'вами', Concatenate('персонажем ', recipient.GetShortUIName))]"
 recipient_becomes_rival_tt: "[recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer, 'стали', Select_CString(recipient.IsFemale, 'стала', 'стал' ))] [Concept('rival', 'соперником')|E] [Select_CString(actor.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', actor.GetShortUIName))]"
 clergy_land_request_reduction_tt: "[Concept('rulers', 'Правители')|E] менее охотно будут пользоваться [Concept('interaction', 'взаимодействием')|E] [Concept('ecclesiastic_transfer_land_interaction', '«Договориться о получении земли»')|E] против вас следующие #high 10 лет#!"
 clergy_land_transfer_theocratic_ecclesiastical_tt: "У [Select_CString(target.GetHolder.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', target.GetHolder.GetShortUIName))] не должно быть [Concept('ecclesiastical', 'церковного')|E] или [Concept('theocratic', 'теократического')|E] [Concept('government', 'правительства')|E]"
 clergy_land_transfer_theocratic_ecclesiastical_recipient_tt: "У [Select_CString(recipient.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', recipient.GetShortUIName))] не должно быть [Concept('ecclesiastical', 'церковного')|E] или [Concept('theocratic', 'теократического')|E] [Concept('government', 'правительства')|E]"
 clergy_land_transfer_ai_scholar_tt: "Большой [Concept('trait_level_track_xp', 'опыт свойства')|E] «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]» [Select_CString(recipient.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', recipient.GetShortUIName))] защищает [Select_CString(recipient.IsLocalPlayer, 'вас', Select_CString(recipient.IsFemale, 'её', 'его' ))] от #high договорённости о получении земли#!"
 pam_interactions_events.0039.opening: "[Select_CString(ROOT.Char.IsFemale, 'Моя верная служанка', 'Мой верный слуга')] [ROOT.Char.GetFirstName]!"
 pam_interactions_events.0039.desc: "Спешу сообщить тебе, поскольку сия весть застала врасплох и меня: я отказываюсь от владения [target.GetName]. Отныне им будет править [actor.GetTitleAsName|l] земли [actor.GetPrimaryTitle.GetNameNoTier].\n\n.Так желает [secondary_recipient.GetTitledFirstNameRegnal], под чьим надзором я и [actor.GetTitledFirstNameNicknamed|l] вели переговоры о том, кому завтра будет принадлежать [ROOT.Char.GetPrimaryTitle.GetTierAsName|l]. Возвращайся обратно: тебя ждёт [recipient.GetCapitalLocation.GetTitle.GetNameNoTier], а вскоре — назначение на новое место."
 pam_interactions_events.0039.a: "Похоже, работы мне пока не видать…"
 pam_interactions_events.0039_revoked_governorship_tt: "#high Ваше#! [Concept('governorship', 'губернаторство')|E] отозвано"
 pam_interactions_events.0039_governorship_transfer_tt: "[target.GetName] передаётся персонажу [actor.GetShortUIName]"
 spiritual_counsel_interaction: "Предложить духовный совет"
 spiritual_counsel_interaction_desc: "Предложить, чтобы [recipient.GetShortUIName] [Select_CString(recipient.IsFemale, 'выслушала', 'выслушал')] вас наедине. Вы поделитесь мудростью и выслушаете покаяние, получив взамен [hook_i][Concept('hook', '«крючок»')|E]."
 spiritual_counsel_notification_text: "Присядем ненадолго, [Select_CString(recipient.IsFemale, 'дочь моя', 'сын мой')]. Расскажи мне, что тебя терзает, и я помогу тебе вновь почувствовать в сердце любовь [actor.GetFaith.HighGodNamePossessive]."
 spiritual_counsel_interaction_accept_actor_toast: "[recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsFemale, 'согласилась', 'согласился')] выслушать ваш совет"
