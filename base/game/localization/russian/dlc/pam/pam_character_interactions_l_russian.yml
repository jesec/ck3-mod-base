 pam_interactions_events.0001.opening: "О [Select_CString(ROOT.Char.IsFemale, 'благородная', 'благородный')] [ROOT.Char.GetTitledFirstNameRegnal|l]!"
 pam_interactions_events.0001.hook_intro: "Разумеется, я окажу вам всяческую помощь,"
 pam_interactions_events.0001.intro: "Весьма справедливо и благоразумно надеяться, что [recipient.GetTitleAsName|l] проявит к вам одобрение,"
 pam_interactions_events.0001: "поскольку нет на этой земле такого #L [recipient.GetFaith.GetReligion.GetName|l]ого#! титула, который не был бы дан волей [recipient.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0001.mid: "[recipient.GetFaith.HouseOfWorshipPlural|l] вашей державы все единогласно начнут воспевать вашу власть и заодно — славить имя [recipient.GetFaith.HighGodNamePossessive], ведь на то воля небес, чтобы сошлись предназначенные друг другу [ROOT.Char.GetTitleAsNameNoTooltip|l] и [actor.GetPrimaryTitle.GetNameNoTier]."
 pam_interactions_events.0001.tithe: "\n\nКак только будет выплачена десятина,"
 pam_interactions_events.0001.hook: "\n\nВ знак моего вам одолжения"
 pam_interactions_events.0001.monks: "\n\nВсе монастыри и "
 pam_interactions_events.0001.donate: "\n\nВ знак признательности за ваше пожертвование"
 pam_interactions_events.0001.normal: "\n\nПо моему настоянию"
 pam_interactions_events.0001_disgust: "\n\nНе запятнайте эти добрые слова чёрными делами."
 pam_interactions_events.0001_disapprove: "\n\nПрошу вас отныне поступать так, чтобы хвала не оказалась напрасной."
 pam_interactions_events.0001_approve: "\n\nНаша хвала будет искренней и признательной."
 pam_interactions_events.0001_offer_hook_end: "\n\nПусть не будет забыто это одолжение."
 pam_interactions_events.0001.a.low_zeal: "Как хорошо, что народ убедить проще, чем меня…"
 pam_interactions_events.0001.a.high_zeal: "Сомневаться во мне — это значит сомневаться в словах [ROOT.Char.GetFaith.HighGodNamePossessive]!"
 pam_interactions_events.0001.a: "Титул «[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]» был дан мне волей [ROOT.Char.GetFaith.HighGodNamePossessive]."
