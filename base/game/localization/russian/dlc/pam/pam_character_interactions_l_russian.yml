 pam_interactions_events.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_interactions_events.0111.desc: "Ваши требования прочитаны, в исполнении вам отказано. Кто сопровождает меня по жизни, вас не касается. Служите у своего алтаря, [actor.GetTitledFirstName], а заботу о моём браке оставьте мне."
 pam_interactions_events.0111.a: "Что ж, этот грех ляжет на [Select_CString(recipient.IsFemale, 'её', 'его' )] совесть."
 replace_ecclesiastical_title_holder_interaction: "Заменить архиепископа"
 replace_ecclesiastical_title_holder_interaction_desc: "[recipient.GetShortUIName] будет [Select_CString(recipient.IsFemale, 'смещена', 'смещён' )], а [Select_CString(recipient.IsFemale, 'её', 'его' )] [Concept('clerical_title', 'церковный титул')|E] получит более достойный служитель.\n\n#weak Чтобы сместить [Concept('archbishop', 'архиепископа')|E], следующего другому [Concept('rite', 'течению')|E], нужно превосходить его в [Concept('learning', 'учености')|E] и значительно превосходить в [Concept('piety', 'благочестии')|E]. Такой поступок ослабит [Concept('fervor', 'рвение')|E] вашей [Concept('faith', 'конфессии')|E].#!"
