 pam_interactions_events.0097.opening: "Дитя моё."
 pam_interactions_events.0097.desc: "Ваша просьба исполнена. Титул [target.GetName] пустовал, а местные [ROOT.Char.GetFaith.GetAdherentNamePlural|l] не имели пастыря — не так должны мы славить учение [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nПримите эту ношу смиренно. Церковь помнит о [Concept('title', 'титуле')|E], дарованном церковью."
 pam_interactions_events.0097.desc_holy_war: "Ваша просьба исполнена, ваши обеты записаны и не будут забыты. Титул [target.GetName] ваш, хотя часть его до сих пор подчиняется врагам [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nСтупайте и возьмите то, что и так по праву ваше. Ни один праведный [ROOT.Char.GetFaith.PriestNeuter|l] не усомнится в вашей войне, но спустя пять лет мы спросим о её исходе. Помните, неисполненный обет — нарушенный обет."
