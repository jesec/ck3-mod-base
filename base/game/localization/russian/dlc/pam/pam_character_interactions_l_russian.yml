 valid_request_unformed_title_tt: "Несозданный [Concept('title', 'титул')|E] [Concept('de_jure', 'де-юре')|E] выше одного из ваших должен удовлетворять требованиям:\n$EFFECT_LIST_BULLET$Не иметь [Concept('holder', 'владетеля')|E]\n$EFFECT_LIST_BULLET$Быть вашего [Concept('title_tier', 'уровня')|E] или на один уровень выше\n$EFFECT_LIST_BULLET$Хотя бы треть его [Concept('counties', 'графств')|E] находится в пределах вашей [Concept('realm', 'державы')|E] и исповедует #L [puppet_or_actor.GetFaith.GetName|l]ую#! веру"
