 pam_interactions_events.0090.opening: "О [puppet_or_actor.GetMotherFather|l] державы,"
 pam_interactions_events.0090.desc: "поистине, [recipient.GetFaith.HighGodName] видит, что [recipient.GetPrimaryTitle.GetName] — это земля божия! Вашей милостью я теперь [recipient.GetTitleAsName|l] этих земель, и все, исповедующие #L [recipient.GetFaith.GetName|l]ую#! веру, теперь рады.\n\nЯ стану охранять регион [recipient.GetPrimaryTitle.GetTierAsName] даже ценой собственной жизни. Я буду править своим мечом и скипетром. Я буду издавать мудрые законы. И я буду внимательно слушать вашего совета."
 pam_interactions_events.0090.a: "[actor.GetFaith.HighGodName] оказывает нам милость — теперь перед нами новый [recipient.GetTitleAsNameNoTooltip|l]."
 pam_interactions_events.0090.a.flavor: "И так, милостью божией, [recipient.GetFirstNameNoTooltip] теперь [recipient.GetTitleAsNameNoTooltip|l] — и в большом долгу передо мной."
 has_valid_exclave_duchy_tt: "[Concept('duchies', 'Герцогства')|E], что будут добавлены к [Concept('kingdom', 'королевству')|E] [Select_CString(recipient.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', recipient.GetShortUIName))], должны граничить с герцогством, которое при создании станет [Concept('de_jure', 'де-юре')|E] эксклавом: нестоличным герцогством, больше не граничащим  с другими герцогствами королевства."
