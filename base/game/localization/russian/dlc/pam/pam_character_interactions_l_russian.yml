 ecclesiastical_de_jure_shifting_grant_interaction_desc: "Добавить соседний титул [Concept('title', 'титул')|E] к территории, которой [Concept('de_jure', 'де-юре')|E] управляет [recipient.GetPrimaryTitle.GetNamePossessive]"
