 pam_interactions_events.0094.opening: "Законный [ROOT.Char.GetTitleAsName|l]!"
 pam_interactions_events.0094.desc_conversion: "Пусть [cleric.GetFaith.HighGodName] скажет через нас своё слово региону [target.GetNameNoTier]! Не жалейте нечестивых обитателей тамошних земель, не сдерживайте своих воинов в защите добродетели.\n\n[target.GetTierAsNameNoTooltip] теперь принадлежит вам, вам и править этими территориями. Они покорились Промыслу Божьему, что несёт с собой каждый [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetTitleAsName], #EMP де-юре#! и до скончания времён."
 pam_interactions_events.0094.desc: "Настал благословенный день для тех, кто исповедует #L [cleric.GetFaith.GetName|l]ую#! веру в регионе [target.GetNameNoTooltip]! О, как же долго они ждали воссоединения с братьями и сёстрами в регионе [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nТо, что жило в сердцах жителей региона [target.GetNameNoTooltip], теперь стало законом, как того желает [cleric.GetFaith.HighGodName] и представитель божества на земле, [cleric.GetTitleAsName|l]. Сюзерены многих земель теперь признают, что [target.GetTierAsNameNoTooltip|l] — #EMP де-юре#! держава региона [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip] и [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] связаны навечно."
 pam_interactions_events.0095.opening: "[ROOT.Char.GetTitleAsName] региона [target_county.GetNameNoTier] и разных земель,"
 pam_interactions_events.0095.desc: "тебе благоволит [cleric.GetFaith.HighGodName]! В мудрости своей [cleric.GetFaith.HighGodNameSheHe|U] помещает весь регион [target.GetName] под вечную защиту, которую будет вести [de_jure_master.GetTitleAsName] региона [de_jure_master.GetPrimaryTitle.GetName].\n\nЯ, как [cleric.GetTitleAsName|l], издаю этот указ от имени #L [target.GetAdjectiveNoTooltip|l]их#! служителей веры, а также того желает [de_jure_master.GetTitleAsNameNoTooltip] и те, кто видит мудрость в этом #EMP де-юре#! разделении смертных миров, над которыми властвует [cleric.GetFaith.HighGodName]."
 pam_interactions_events.0095.a: "Проклята будь жадность тех, кто служит #L [de_jure_master.GetFaith.GetName|l]ой#! вере!"
 pam_interactions_events.0095.a_same_faith: "И верно, кто ещё может раздавать державы, как не [ROOT.Char.GetFaith.HighGodName]."
 de_jure_clergy_past_tense_effect_tt: "[de_jure_master.GetPrimaryTitle.GetName] становится [Concept('de_jure', 'де-юре')|E] [Concept('liege', 'сюзереном')|E] региона [target.GetName]"
 recipient_holds_target_de_jure_county_tt: "Как минимум одно [Concept('county', 'графство')|E] региона [target.GetNameNoTier] должно находиться в части [Concept('realm', 'державы')|E] [Select_CString(recipient.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', recipient.GetShortUIName))]"
