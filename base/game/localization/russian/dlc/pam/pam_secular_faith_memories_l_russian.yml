l_russian:
 # Character memories raised by the secular-faith flavor events.
 # Owner = the ruler who remembers; participant role names match the type definitions.
 pam_sf_kings_touch_healing_memory: "больной исцелён прикосновением"
 pam_sf_kings_touch_healing_memory_desc: "Я возлагаю руки на тяжело [Select_CString(healed_subject.IsFemale, 'больную', 'больного')] по имени [healed_subject.GetTitledFirstName], и [healed_subject.GetSheHe] исцеляется."
 pam_sf_kings_touch_healing_memory_desc_second_perspective: "вы возложили руки на тяжело [Select_CString(healed_subject.IsFemale, 'больную', 'больного')] по имени [healed_subject.GetTitledFirstName], и [Select_CString(healed_subject.IsFemale, 'она исцелилась', 'он исцелился')]."
 pam_sf_kings_touch_healing_memory_desc_third_perspective: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'возложила', 'возложил')] руки на тяжело [Select_CString(healed_subject.IsFemale, 'больную', 'больного')] по имени [healed_subject.GetTitledFirstName], и [Select_CString(healed_subject.IsFemale, 'она исцелилась', 'он исцелился')]."
 pam_sf_deliverance_memory: "проведён обряд изгнания"
 pam_sf_deliverance_memory_desc: "[delivered_soul.GetTitledFirstName] [Select_CString(delivered_soul.IsFemale, 'была одержима', 'был одержим')] злым духом, поэтому мне пришлось провести обряд изгнания."
 pam_sf_deliverance_memory_desc_second_perspective: "[delivered_soul.GetTitledFirstName] [Select_CString(delivered_soul.IsFemale, 'была одержима', 'был одержим')] злым духом, поэтому вы провели обряд изгнания."
 pam_sf_deliverance_memory_desc_third_perspective: "[delivered_soul.GetTitledFirstName] [Select_CString(delivered_soul.IsFemale, 'была одержима', 'был одержим')] злым духом, поэтому [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'провела', 'провёл')] обряд изгнания."
 pam_sf_prophecy_fulfilled_memory: "исполнилось пророчество"
 pam_sf_prophecy_fulfilled_memory_desc: "[prophet.GetTitledFirstName] [Select_CString(prophet.IsFemale, 'предупредила', 'предупредил')] меня, что [doomed.GetTitledFirstName] умрёт, и [doomed.GetSheHe] действительно [Select_CString(doomed.IsFemale, 'умерла', 'умер')]."
 pam_sf_prophecy_fulfilled_memory_desc_second_perspective: "[prophet.GetTitledFirstName] [Select_CString(prophet.IsFemale, 'предупредила', 'предупредил')] вас, что [doomed.GetTitledFirstName] умрёт, и [doomed.GetSheHe] действительно [Select_CString(doomed.IsFemale, 'умерла', 'умер')]."
 pam_sf_prophecy_fulfilled_memory_desc_third_perspective: "[prophet.GetTitledFirstName] [Select_CString(prophet.IsFemale, 'предупредила', 'предупредил')] персонажа [owner.GetTitledFirstName], что [doomed.GetTitledFirstName] умрёт, и [doomed.GetSheHe] действительно [Select_CString(doomed.IsFemale, 'умерла', 'умер')]."
