l_russian:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Конфликт инвеститур"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "После вашей победы [defender.GetShortUIName] и [Select_CString(defender.IsFemale, 'её', 'его' )] сторонники были вынуждены принять ваши взгляды на назначение духовенства."
 pam_investiture_conflict_cb_victory_desc_defender: "[defender.GetShortUIName] и [Select_CString(defender.IsFemale, 'её', 'его' )] сторонники одержали победу и навязали вам свои взгляды на назначение духовенства."
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsFemale, 'одержала', 'одержал' )] победу. [defender.GetShortUIName|U] и [Select_CString(defender.IsFemale, 'её', 'его' )] сторонники были вынуждены принять позицию по вопросу назначения духовенства, которой придерживается [attacker.GetShortUIName]."
 pam_investiture_conflict_cb_white_peace_desc: "Конфликт по поводу назначения духовенства закончился ничем: ни одна из сторон не одержала в нём верх."
 pam_investiture_conflict_cb_defeat_desc_attacker: "Потерпев поражение, вы со своими сторонниками вынуждены принять взгляды на назначение духовенства, которых придерживается [defender.GetShortUIName]."
 pam_investiture_conflict_cb_defeat_desc_defender: "После вашей победы [attacker.GetShortUIName] и [Select_CString(attacker.IsFemale, 'её', 'его' )] сторонники были вынуждены принять ваши взгляды на назначение духовенства."
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U] [Select_CString(defender.IsFemale, 'одержала', 'одержал' )] победу. [attacker.GetShortUIName|U] и [Select_CString(attacker.IsFemale, 'её', 'его' )] сторонники были вынуждены принять позицию по вопросу назначения духовенства, которой придерживается [defender.GetShortUIName]."
 msg_pam_investiture_conflict_cb_invalidated_message: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|U] завершилась. Конфликт инвеститур больше не имеет значения."
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "Совет об инвеституре ещё #EMP не#! созван"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "Вы вынуждены уступить"
 pam_investiture_conflict_forced_stance_tt: "Проиграв на поле боя, вы были вынуждены принять сторону победителя на предстоящем совете об инвеституре."
