l_russian:
 pam_curse_enemy_decision: "Проклясть врага"
 pam_curse_enemy_decision_desc: "#F Какой глупец рискнёт бросить мне вызов? Я произнесу его имя перед духами и вложу в слова каждую обиду, каждое оскорбление и каждое проклятье. Пусть глупцы смеются — возмездие скоро настигнет их.#!"
 pam_curse_enemy_decision_tooltip: "Провести ритуал против соперника или противника в одной из ваших [Concept('wars', 'войн')|E]"
 pam_curse_enemy_decision_confirm: "Начать ритуал"
 pam_curse_enemy_decision_valid_target: "У вас есть живой взрослый [Concept('rival', 'соперник')|E], [Concept('nemesis', 'заклятый враг')|E] или враг в войне"
 pam_curse_enemy_decision_selected_target_valid: "Выбранный вами враг всё ещё живой взрослый [Concept('rival', 'соперник')|E], [Concept('nemesis', 'заклятый враг')|E] или враг в войне"
 pam_curse_enemy_decision_no_item_selected: "Враг не выбран"
 pam_seek_war_aid_decision: "Искать помощи в войне"
 pam_seek_war_aid_decision_desc: "#F Война — это не просто испытание оружия и чисел. Я обращусь к духам за откровениями, силами или стойкостью, чтобы мне хватило сил преодолеть предстоящие испытания.#!"
 pam_seek_war_aid_decision_tooltip: "Обратиться к духам за помощью в текущих войнах"
 pam_seek_war_aid_decision_confirm: "Воззвать к духам"
 pam_adorcism_events.0001.t: "Имя перед духами"
 pam_adorcism_events.0001.desc: "В потаённом месте я черчу на земле имя — [pam_adorcism_curse_target.GetTitledFirstName] — и произношу вслух все свои обиды. Ритуал не может переломать кости или сгубить урожай, но его цель не в этом.\n\nКогда я встаю, мой гнев остыл и стал намерением. Каждый слух о [Select_CString(pam_adorcism_curse_target.IsFemale, 'ней', 'нём' )] теперь кажется ниточкой, за которую можно потянуть."
 pam_adorcism_events.0001.a: "Моя цель ясна."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], духи услышали ваше имя и прокляли его. Когда вас настигнет несчастье, помните, что оно произошло по моей воле."
 pam_adorcism_events.0002.desc.default: "\n\nДухи услышали ваше имя и прокляли его. Когда вас настигнет несчастье, помните, что оно произошло по моей воле."
 pam_adorcism_events.0002.a: "Срочно, мне требуется [ROOT.Char.GetFaith.PriestNeuter|l]!"
 pam_adorcism_events.0002.a.flavor: "Проклятье тяготит ваши мысли, и каждая тень кажется дурным знамением."
 pam_adorcism_events.0101.t: "Совет незримого"
 pam_adorcism_events.0101.desc: "Вдали от лагерных костров я возлагаю подношение и прислушиваюсь, пока звуки лагеря за моей спиной затихают. Ветер поднимает пыль, и я не слышу голосов, но всё же ритуал привносит порядок в мои мысли.\n\nНужно решить, какая помощь потребуется мне в будущих кампаниях."
 pam_adorcism_events.0101.a: "Покажите мне путь к победе."
 pam_adorcism_events.0101.b: "Пусть не ослабнет рука на мече."
 pam_adorcism_events.0101.c: "Дайте силы моему войску."
 pam_adorcism_curse_focus_modifier: "Перенаправленный гнев"
 pam_adorcism_curse_focus_modifier_desc: "Этот персонаж назвал цель своей ярости и обрушил её через ритуал."
 pam_adorcism_ill_omen_modifier: "Отмеченный дурным знамением"
 pam_adorcism_ill_omen_modifier_desc: "Представители течения этого персонажа относятся к нему с подозрением из-за слухов о проклятии."
 pam_adorcism_curse_anxiety_modifier: "Страх перед проклятьем"
 pam_adorcism_curse_anxiety_modifier_desc: "Этот персонаж не может прогнать мысль о том, что грядущее несчастье было кем-то ниспослано."
 pam_adorcism_battle_guidance_modifier: "Стратегия, навеянная духами"
 pam_adorcism_battle_guidance_modifier_desc: "Этот персонаж верит, что духи явили благоприятные знамения для битвы."
 pam_adorcism_personal_vigor_modifier: "Вложенный духами пыл"
 pam_adorcism_personal_vigor_modifier_desc: "Обретённая в ходе ритуала уверенность придаёт этому персонажу сил в поединках."
 pam_adorcism_campaign_endurance_modifier: "Войско, поддержанное духами"
 pam_adorcism_campaign_endurance_modifier_desc: "Армии этого персонажа переносят затяжные кампании с новообретённым убеждением."
