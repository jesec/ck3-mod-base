l_russian:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "Глаголица"
 slavic_rite.1000.desc: "«Продолжай, брат [greek_preacher.GetFirstName]», — говорит [court_chaplain.GetActiveCouncilTask.GetPositionName], и [greek_preacher.Custom('MyPriestTitle')], последователь [GetRiteByKey('byzantine_rite').GetAdjective|l]ой веры, повинуется ему.\n\n«Благословенно царство ваше, о [ROOT.Char.GetTitleAsNameNoTooltip]. Мои братья делают всё для вашего народы. Увы, [GetRiteByKey('carolingian_christianity').GetAdherentName|l]ие священники удумали захватить церковную власть и совсем нам житья не дают. [Glossary('Кирилл и Мефодий', 'CYRIL_AND_METHODIUS_GLOSS')] обратились ко мне с просьбой: нельзя ли дать нам чуть больше времени? Нужно придумать, как решить проблему мирно»."
 slavic_rite.1000.a: "Нам нельзя сдаваться. Я рассчитываю на их успех."
 slavic_rite.1000.a_tt: "[Glossary( 'Кирилл и Мефодий', 'CYRIL_AND_METHODIUS_GLOSS' )] — братья, создавшие новую славянскую письменность — скоро сообщат вам о своих дальнейших планах по распространению #L [court_chaplain.GetFaith.GetName|l]ого#! [Concept('rite', 'течения')|E] в вашей державе."
 slavic_rite.1000.b: "Лучше отказаться от новой веры. Не хочется прогневать [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip|l]ое священство."
 slavic_rite.1000.b_tt: "[Glossary('Кирилл и Мефодий', 'CYRIL_AND_METHODIUS_GLOSS')] прекратят работу над созданием нового [Concept('rite', 'течения')|E] и письменности для местных."
 slavic_rite.1000.b_tt_2: "[Concept('story_cycle', 'История')|E] «$story_slavic_rite$» завершится."
 # Travel to Rome Initiation
 slavic_rite.0001.t: "Моравская миссия"
 slavic_rite.0001.desc: "Как хорошо, что [Glossary( 'Кирилл и Мефодий', 'CYRIL_AND_METHODIUS_GLOSS' )] пришли! Надеюсь, они придумали, как умаслить [GetRiteByKey('carolingian_christianity').GetAdherentName|l]ое священство.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip], похоже, единственный способ защитить веру вашего народа — обратиться к вышестоящей власти. Мы планируем отправиться во владение [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly], дабы [pope_scope.GetTitledFirstName] [Select_CString(pope_scope.IsFemale, 'одобрила', 'одобрил' )] нашу миссию».\n\nНадеюсь, эти [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip|l]ие гордецы не посмеют перечить Святому Престолу."
 slavic_rite.0001.a: "Бог в помощь."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName] и [methodius_scope.GetFirstName] отправятся в путь. Если они добьются успеха, по возвращении братьев в ваших владениях может возникнуть новое религиозное движение."
 slavic_rite.0001.b: "Я не отпущу вас с пустыми руками."
 slavic_rite_travel_toast_title: "Кирилл и Мефодий начинают странствие"
 slavic_rite_moravian_mission_gift_sent_tooltip: "Мы отправим подарок во владение [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. По возвращении братья сообщат вам, как местные власти его восприняли."
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "Зарождение #L [methodius_scope.GetRite.GetName|l]ого течения#!"
 slavic_rite.0003.desc: "Мне стало известно, что [methodius_scope.GetFirstNameNoTooltip] пытается обучить жителей [moravia_liege_scope.GetCulture.GetCollectiveNounNoTooltip|l]их земель новым способам отправлять обряды [methodius_scope.GetFaith.GetNameNoTooltip|l]ой веры, в чём [Select_CString(methodius_scope.IsFemale, 'ей', 'ему' )] помогает [moravia_liege_scope.GetTitledFirstNameNoTooltip]. Мои богословы называют это течение «[methodius_scope.GetRite.GetAdjective|l]».\n\nТам, где потерпели неудачу наши попытки уподобить себе местных жителей, возможно, успеха добьётся [methodius_scope.GetFirstNameNoTooltip]: [pope_scope.GetTitledFirstName|l] [Select_CString(pope_scope.IsFemale, 'разрешила', 'разрешил' )] [Select_CString(methodius_scope.IsFemale, 'ей', 'ему' )] попробовать перевести их язык на новую письменность."
 slavic_rite.0003.a: "Посмотрим, улыбнётся ли [Select_CString(methodius_scope.IsFemale, 'ей', 'ему' )] удача."
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]ий деятель [methodius_scope.GetFaith.GetNameNoTooltip|l]ой веры"
 slavic_rite.0004.desc_pagan: "Этим утром придворные поведали мне любопытную новость.\n\n[liege_scope.GetTitledFirstNameNoTooltip] [Select_CString(liege_scope.IsFemale, 'разрешила', 'разрешил' )] [methodius_scope.GetCulture.GetCollectiveNounNoTooltip|l][Select_CString(methodius_scope.IsFemale, 'ой', 'ому' )] [Select_CString(methodius_scope.IsFemale, 'священнослужительнице', 'священнослужителю' )] по имени [methodius_scope.GetFirstName] и дальше распространять в наших землях своё богопротивное учение. Предполагается, что [methodius_scope.GetFaith.GetAdjectiveNoTooltip|l] заметно упростит религиозные порядки для тех [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l]их отступников, которые предпочтут исповедовать эту веру.\n\nВ последнее время всё чаще заводятся разговоры о духовности наших традиций. Возможно, пора наконец задуматься, как следует поступить."
 slavic_rite.0004.desc_chalcedonian: "[Select_CString(liege_scope.IsFemale, 'Наша', 'Наш' )] [liege_scope.GetTitleAsNameNoTooltip|l] [Select_CString(liege_scope.IsFemale, 'объявила', 'объявил' )], что в [Select_CString(liege_scope.IsFemale, 'её', 'его' )] владениях начнёт распространяться [methodius_scope.GetRite.GetAdjectiveNoTooltip]. Мои богословы утверждают, что от этого будет польза, ведь так нам станет удобнее справлять обряды [methodius_scope.GetFaith.GetNameNoTooltip|l]ой веры, и наш уклад при этом не пострадает.\n\nВозможно, стоит присмотреться…"
 slavic_rite.0004.a_pagan: "Мы будем жить так, как завещали предки."
 slavic_rite.0004.b_pagan: "Пожалуй, в этом есть крупица истины…"
 slavic_rite.0004.a_chalcedonian: "Я не собираюсь отклоняться от истинного пути."
 slavic_rite.0004.b_chalcedonian: "Приведите сюда богословов."
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "Омрачённое путешествие"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName], [Select_CString(methodius_scope.IsFemale, 'вернувшаяся', 'вернувшийся' )] из владения [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], стоит передо мной в одиночестве. Когда я спрашиваю, где же [cyril_scope.GetFirstName], на [Select_CString(methodius_scope.IsFemale, 'её', 'его' )] лице появляется тень глубокой скорби.\n\n«Сначала о хорошем, [Select_CString(ROOT.Char.IsFemale, 'милостивая', 'милостивый' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]: [pope_scope.GetTitledFirstName|l] [Select_CString(pope_scope.IsFemale, 'дозволила', 'дозволил' )] нам распространять веру среди [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip|l]ого народа — и в том числе в ваших владениях. У нас уже есть и свои особые подходы, и даже Писание». [Select_CString(methodius_scope.IsFemale, 'Она', 'Он' )] делает глубокий вдох, а затем продолжает: «Но, увы, я [Select_CString(methodius_scope.IsFemale, 'была вынуждена', 'был вынужден' )] оставить своего брата позади. Я брошу все силы на то, чтобы его старания не пропали даром. Да не оставит нас милость [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 slavic_rite.0005.a: "Мы не подведем твоего брата!"
 slavic_rite.0005.b: "Я сочту за честь почтить его наследие."
 pam_cyril_statue_modifier: "Памятник Кириллу"
 pam_brothers_travel_safety_modifier: "Осторожное путешествие"
 slavic_rite.0005.c: "Желаю удачи в твоих начинаниях."
 slavic_rite_mass_conversion_tooltip: "Во всех [Concept('duchies', 'герцогствах')|E] державы [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] будет запланирован [Concept('great_project', 'грандиозный проект')|E] «Массовое обращение», целью которого будет обращение соответствующих [Concept('counties', 'графств')|E] в #L [methodius_scope.GetRite.GetName|l]ую#! веру"
 slavic_rite_moravian_mission_gift_received_tooltip: "Власти владения [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] получили ваш подарок и выразили вам благодарность."
 slavic_rite_ecclesiastical_title_creation_tooltip: "Будет создан $slavic_rite_ecclesiastical_title$, и [methodius_scope.GetFirstName] станет его первым [Concept('holder', 'владетелем')|E]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ Моравия"
 slavic_rite_ecclesiastical_title_name: "Моравия"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "Завершение моравской миссии"
 slavic_rite.0006.desc.brothers_are_dead: "[Glossary('Кирилл и Мефодий', 'CYRIL_AND_METHODIUS_GLOSS')] погибли, и у нас на службе попросту нет достаточно опытных священников, способных продолжить их миссию. Если мы по-прежнему хотим добиться полного обращения нашего народа в новую веру, то нам придётся придумать иные способы."
 slavic_rite.0006.desc.no_longer_christian: "Мне открылось истинное сияние славы. То, что некогда побуждало меня трудиться на благо своего дома и народа, теперь потеряло для меня всякое значение. Оказалось, что судьба уготовила всем нам совершенно другую участь. К счастью, волею [ROOT.Char.GetFaith.HighGodNamePossessive] мы всё-таки нашли правильный путь."
 slavic_rite.0006.desc.no_longer_king: "Недавние события и утрата влиятельного положения преподали мне важный урок: не стоит взваливать на себя непосильную ношу. Теперь у нас нет возможности продолжать моравскую миссию. Но, быть может, когда мы вновь встанем с колен, у нас ещё будет шанс воплотить задуманное в жизнь.\n\nДо тех пор #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]ие#! владения нуждаются в защите, иначе их ждёт та же печальная судьба."
 slavic_rite.0006.desc.no_longer_slav: "Скорее всего, мои предки были бы недовольны моим жизненным выбором.\n\nВпрочем, меня это нисколько не волнует: я лучше них знаю, как править #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]ими#! землями."
 slavic_rite.0006.a.brothers_are_dead: "Видимо, этому не суждено было случиться…"
 slavic_rite.0006.a.no_longer_christian: "Славься, [ROOT.Char.GetFaith.HighGodName]!"
 slavic_rite.0006.a.no_longer_king: "Мне придётся умерить свои амбиции."
 slavic_rite.0006.a.no_longer_slav: "Создание глаголицы принесло моему народу лишь беды."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ с целью обращения державы обернулась неудачей."
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "Держава, объединённая волею [ROOT.Char.GetFaith.HighGodNamePossessive]"
 slavic_rite.0007.desc: "«#italic …дабы проводить нам жизнь тихую и безмятежную\nво всяком благочестии и чистоте.\n\nИбо Твоё есть Царство, и сила, и слава\nвовеки веков и до скончания времён. Аминь#!».\n\n[archdiocese_holder.GetTitledFirstName] заканчивает молитву, как вдруг мою душу охватывает чувство вечного блаженства: мы исполнили свою миссию и донесли Божье слово до всех уголков нашей державы. Да благословит [ROOT.Char.GetFaith.HighGodName] мой дом, [Glossary( 'Кирилла и Мефодия', 'CYRIL_AND_METHODIUS_GLOSS' )] и всех жителей [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]их земель!"
 slavic_rite.0007.a: "Нам было суждено встать на путь света."
 pam_slavic_rite_clergy_opinion_modifier: "Благословенный монарх"
 slavic_rite.0007.b: "Мой народ может преодолеть любые трудности."
 pam_slavic_rite_culture_opinion_modifier: "Народный монарх"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "Тайные проповедники"
 slavic_rite.0010.desc: "[undercover_preacher.GetCulture.GetCollectiveNounNoTooltip][Select_CString(undercover_preacher.IsFemale, 'ая', 'ий' )] [undercover_preacher.Custom('MyPriestTitle')|l] и [Select_CString(undercover_preacher.IsFemale, 'её', 'его' )] свита входят в тронный зал в сопровождении моего капеллана по имени [court_chaplain.GetFirstName]. На их лицах нет ни капли стыда.\n\n«Приветствую вас, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]! Эти лазутчики распространяли в ваших владениях учение [ROOT.Char.GetFaith.HighGodNamePossessive]. При этом они совершенно не признают местную власть: им не внушает уважение ни [court_chaplain_superior.GetTitledFirstName], ни даже лично вы». [Select_CString(court_chaplain.IsFemale, 'Она', 'Он' )] на мгновение останавливается и оглядывает чужеземцев, а затем снова обращается ко мне.\n\n«Судя по всему, они уже довольно долго бродят по нашим землям, пытаясь увлечь за собой ваших подданных и осквернить их души. Как с ними лучше поступить?»"
 slavic_rite.0010.a: "Уходите прочь и никогда не возвращайтесь!"
 slavic_rite.0010.b: "Похоже, наши прошлые предупреждения оказались неубедительны."
 slavic_rite.0010.c: "Ваши хозяева будут недовольны. Впрочем, вам необязательно к ним возвращаться…"
 slavic_rite.0010.c.success: "[Select_CString(undercover_preacher.IsFemale, 'Она', 'Он' )] готов присоединиться к вашему двору"
 slavic_rite.0010.c.failure: "[Select_CString(undercover_preacher.IsFemale, 'Её', 'Его' )] не интересует ваше предложение"
 preacher_recruited.t: "Проповедник нанят"
 preacher_left.t: "Проповедник покинул двор"
 # 0020
 slavic_rite.0020.t: "Разрешение на богоугодное дело"
 slavic_rite.0020.desc: "«Они не хотят как-либо обманывать местных жителей, [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]. В этом отношении [court_chaplain_superior.GetTitledFirstName|l] и [Select_CString(court_chaplain_superior.IsFemale, 'её', 'его' )] странствующие проповедники очень тактичны и осторожны. Более того, они проявили искреннее смирение, попросив меня поговорить с вами вместо них. Если вы разрешите им проповедовать, это сильно упростит им задачу и избавит их последователей от лишних неприятностей».\n\n[court_chaplain.GetTitledFirstName] пытается убедить меня по просьбе остальных, что само по себе достойно уважения. Однако думается мне, что от [Select_CString(court_chaplain.IsFemale, 'её', 'его')] красноречия было бы гораздо больше пользы, если бы вместо этого [Select_CString(court_chaplain.IsFemale, 'она уговаривала', 'он уговаривал')] наших людей отказываться от старых традиций.\n\n«Мне кажется, что таким образом [ROOT.Char.GetFaith.HighGodName] даёт вам возможность встать на верный путь»."
 slavic_rite.0020.a: "Чем скорее мы искореним богомерзкие практики, тем лучше."
 pam_slavic_rite_great_project_speed_modifier: "Поддержка религиозного обращения"
 slavic_rite.0020.b: "Это всё, чем мы можем помочь."
 slavic_rite.0020.c: "Ни в коем случае."
 # 0030
 slavic_rite.0030.t: "Спор между Западом и Востоком"
 slavic_rite.0030.desc: "Лёгкий ветерок нежно колышет листья в саду монастыря, однако кое-что всё-таки нарушает эту идиллию: здесь развернулись религиозные дебаты между священниками, которых [Select_CString(court_chaplain_superior.IsFemale, 'пригласила', 'пригласил' )] [court_chaplain_superior.GetTitledFirstName|l]. Представитель одной стороны одет согласно восточной традиции, другой же принадлежит к западной церкви. Скромные на первый взгляд священники постепенно меняют тон, и их дискуссия становится всё более напряжённой.\n\nОни горячо обсуждают самые разные церковные и богословские вопросы, и с каждым их доводом я лишь сильнее увлекаюсь этими прениями.\n\nЭто больше чем просто разговор. Этот спор отражает одновременно и шаткую гармонию между двумя мирами, и глубокий раскол, который их разделяет."
 slavic_rite.0030.a: "[visiting_byzantine_clergy.GetCulture.GetCollectiveNounNoTooltip][Select_CString(visiting_byzantine_clergy.IsFemale, 'ая', 'ий' )] [visiting_byzantine_clergy.Custom('MyPriestTitle')|l] звучит весьма убедительно."
 slavic_rite.0030.b: "[visiting_carolingian_clergy.GetNameNoTooltip] в чём-то [Select_CString(visiting_carolingian_clergy.IsFemale, 'права', 'прав' )]."
 slavic_rite.0030.c: "Я согласен с обоими. Меня интересуют лишь знания."
 slavic_rite.0030.d: "Наши традиции во всём превосходят эти древние принципы."
