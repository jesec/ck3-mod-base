l_russian:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "Проповедовать догмат"
 spread_personal_tenet_intent_desc: "Вы хотите рассказывать о вашем [Concept('personal_tenet', 'личном принципе')|E] гостям, которые могут тоже принять его, тем самым увеличив [Concept('tenet_popularity', 'популярность догмата')|E]."
 spread_personal_tenet_intent_not_valid_desc: "У вас больше нет [Concept('personal_tenet', 'личного принципа')|E]"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Во время [Concept('activities', 'занятий')|E] с гостями доступно [Concept('intent', 'намерение')|E] #EMP «$spread_personal_tenet_intent$»#!, которое позволяет увеличивать [Concept('tenet_popularity', 'популярность догмата')|E]"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U] [Select_CString(first.IsLocalPlayer, 'убеждаете', 'убеждает')] [Select_CString(second.IsLocalPlayer, 'вас', Concatenate('персонажа ', second.GetShortUINameNoTooltip))]"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U] [Select_CString(first.IsLocalPlayer, 'убеждаете', 'убеждает')] [Select_CString(second.IsLocalPlayer, 'вас', Concatenate('персонажа ', second.GetShortUINameNoTooltip))]"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nНо более всего сердце моё занимает [spread_tenet.GetBaseName] — учение, которое моя собственная конфессия осуждает. Говорить о нём здесь — значит доверить свою судьбу каждому слушающему."
 pam_spread_tenet_option_scripture: "Само Писание говорит за меня."
 pam_spread_tenet_option_preach: "Услышьте же, во что я верю!"
 pam_spread_tenet_option_forbidden: "Истина стоит того, чтобы рискнуть. Подойдите ближе."
 pam_spread_tenet_option_decline: "Пожалуй, в другой раз."
 pam_spread_tenet_forbidden_flavor: "Не всякий, кто меня услышит, желает мне добра..."
 pam_spread_tenet_overheard_toast: "Недружелюбные слушатели"
 pam_spread_tenet_events.0001.t: "Застольная беседа"
 pam_spread_tenet_events.0001.desc: "Стол ломится от яств, [ROOT.Char.Custom('GetExpensiveMeal')] льётся рекой, а зал оглашают тосты и смех.\n\n«Похоже, вы часто размышляете о делах веры, — произносит [pam_spread_listener_1.GetTitledFirstName], склоняясь над блюдами, на которых красиво выложены [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')]. — Расскажите подробнее».\n\nЗа столом воцаряется тишина. Слушатели готовы внимать каждому слову..."
 pam_spread_tenet_events.0101.t: "У костра"
 pam_spread_tenet_events.0101.desc: "Короткая передышка во время охоты. Мы тесно сидим вокруг огня, пока [ROOT.Char.Custom('GetRandomRegionalSmallGame')] жарится на вертеле.\n\n«Такая охота заставляет задуматься о вечном», — тихо произносит [pam_spread_listener_1.GetTitledFirstName], не отрывая взгляда от пламени.\n\nЗдесь лишь мерцание огня, тишина и внимательные слушатели."
 pam_spread_tenet_events.0201.t: "Между поединками"
 pam_spread_tenet_events.0201.desc: "Ристалище пустует в перерыве между состязаниями. Оруженосцы уносят расколотые копья, а зрители укрываются в тени и перекидываются пустяковыми фразами.\n\n«Победители говорят, что за их победой стоит благословение [ROOT.Char.GetFaith.HighGodNamePossessive], а проигравшие винят проклятие [ROOT.Char.GetFaith.DevilNamePossessive]», — шутливо замечает рядом со мной [pam_spread_listener_1.GetTitledFirstName]. — «Но хоть кто-нибудь задумывался, почему?»\n\nЗатишье, скамья бездельничающих знатных господ и вопрос, повисший в воздухе."
 pam_spread_tenet_events.0301.t: "Тост за веру"
 pam_spread_tenet_events.0301.desc: "Кубок за кубком поднимаются в честь молодожёнов и будущих наследников.\n\n«И во славу [ROOT.Char.GetFaith.HighGodNamePossessive], пусть все души будут едины!» — добавляет [pam_spread_listener_1.GetTitledFirstName], и вокруг раздаётся одобрительный гул.\n\nМеня окружают открытые сердца — открытые любви, надежде и вере. Сказанные сейчас слова окажут немалое влияние на них."
 pam_spread_tenet_events.0401.t: "Разговор на поминках"
 pam_spread_tenet_events.0401.desc: "Скорбящие собираются небольшими группами, тихо предаваясь воспоминаниям и разговаривая о судьбе, которая ждёт каждого из нас.\n\n«Все мы однажды туда отправимся», — негромко говорит [pam_spread_listener_1.GetTitledFirstName] у меня за плечом. — «И всё же продолжаем ссориться из-за пустяков».\n\nСкорбь распахивает душу..."
