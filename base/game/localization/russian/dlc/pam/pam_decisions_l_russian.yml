 pam_decision_events.0004.desc: "Годами мне приходилось довольствоваться церковным облачением вместо знамени. Но власть и положение в обществе не обошли меня стороной.\n\nПочему моё наследие должно умереть со мной только потому, что мне не довелось родиться в знатном семействе?"
