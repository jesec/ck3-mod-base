 pam_decision_events.0011.opening: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] всего мира! Да будет известно,"
 pam_decision_events.0011.desc.permitted: "Что отныне догмат, именуемый «[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]», считается допустимым в конфессии учением. Это решение скреплено моей печатью.\n\nПусть каждый, кто исповедовал его втайне, больше не боится осуждения."
 pam_decision_events.0011.desc.prohibited: "Что отныне догмат, именуемый «[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]», строго запрещён. Это решение скреплено моей печатью. Каждый, кто исповедует его, не может считаться истинным верующим."
 pam_decision_events.0011.desc.fallback: "Мною издано провозглашение, касающееся догмата «[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]»."
 pam_decision_events.0011.b: "И всё же я сохраняю верность этому учению…"
 pam_decision_events.0012.opening: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] всего мира! Да будет известно,"
 pam_decision_events.0012.desc: "[bull_issuer.GetTitledFirstName] [Select_CString(bull_issuer.IsFemale, 'объявила', 'объявил')] #L [heresy_rite.GetName|l]ое#! течение ересью.\n\nПусть каждый верующий правитель примет это к сведению."
 pam_decision_events.0012.a: "Да будет так."
 pam_decision_events.0013.opening: "Что ж, [ROOT.Char.GetTitledFirstNameNoTooltip], когда-то [Select_CString(ROOT.Char.IsFemale, 'считавшаяся благочестивой', 'считавшийся благочестивым')]."
 pam_decision_events.0013.desc.intro: "Всё кончено. Течение «[heresy_rite.GetName]» объявлено ересью, а всех его сторонников [bull_issuer.GetFaith.GetAdjective] предаёт анафеме."
 pam_decision_events.0013.desc.outro: "\n\nВыбирай: или ты смиренно преклонишь колена и вернёшься в лоно церкви, или продолжишь упорствовать в своих заблуждениях и будешь [Select_CString(ROOT.Char.IsFemale, 'проклята', 'проклят')]."
 pam_decision_events.0013.a: "Мы с радостью уйдём от вас."
 pam_decision_events.0013.b: "Я не хочу изгнания. Примите моё раскаяние."
 pam_tenet_stance_judgement_personal_permit: "Моя преданность не осталась безответной!"
 pam_tenet_stance_judgement_personal_prohibit: "Нужно молиться вдалеке от посторонних глаз…"
 pam_tenet_stance_judgement_aligned_permit: "Какая радостная весть!"
 pam_tenet_stance_judgement_aligned_prohibit: "Это учение теперь ересь? Всё это происки, источник которых — [ROOT.Char.GetFaith.random_EvilGodName]…"
 pam_tenet_stance_judgement_distant_permit: "Мы приняли новый, незнакомый обряд."
 pam_tenet_stance_judgement_distant_prohibit: "Мы запретили незнакомый обряд."
 pam_tenet_stance_judgement_neutral: "Облик конфессии изменился…"
 fervor_gain_pam_tenet_prohibited: "[pam_tenet_stance_issuer.GetTitledFirstName] [Select_CString(pam_tenet_stance_issuer.IsFemale, 'запретила', 'запретил')] догмат «[pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]»"
