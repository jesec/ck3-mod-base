 pam_bull_events.desc.intro: "Я, [ROOT.Char.GetTitledFirstNameNoTooltip], слуга слуг Господних, обращаюсь к возлюбленным детям моим во Христе:\n\n"
 pam_bull_events.desc.outro: "\n\n#EMP [ROOT.Char.GetCurrentLocation.GetName], [GetCurrentDate.GetStringLong]#!"
 every_theocratic_vassal_tt: "Каждый [Concept('theocracy', 'теократический')|E] или [Concept('ecclesiastical_government', 'церковный')|E] [Concept('vassal', 'вассал')|E] ([THIS.ScriptValue('number_of_theocratic_vassals')|V0])"
 pam_bull_events.0001.t: "Булла года [GetCurrentDate.GetYear]"
 pam_bull_events.0001.desc: "«Я призываю всех вас выйти против неверных, чья земля — [title.GetName], освобождаться от их тирании и забрать из их плена тысячи братьев ваших.\n\nДа прославится тем имя христианское, да не дрогнет смелость ваша, что известна по всему миру»."
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!"
 pam_bull_events.0001.a.flavor: "#EMP Во имя Господа.#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "«Всякий из вас, кто верует в течение, что носит название «[tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l]», да узнает теперь, что [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l] его запрещает»"
 pam_bull_events.0002.desc.tenet_forbidden: "«Доктрине под названием «[tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l]» нет теперь места в наших домах. Всякий, кто исповедует её, да узнает теперь, что нарушает святость церкви и совершает смертный грех»."
 pam_bull_events.0002.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0002.a.flavor: "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0003.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0003.desc: "«Дабы положить конец злокозненной ереси, что носит название «[heresy_rite.GetName|l]», властью своею церковною я объявляю всех её исповедников еретиками и да пребудет на них анафема,"
 pam_bull_events.0003.desc.heresiarch: "а глава их, [heresiarch.GetTitledFirstName], да будет отныне ересиархом»."
 pam_bull_events.0003.desc.no_heresiarch: "что наложена на веки вечные»."
 pam_bull_events.0003.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0003.a.flavor: "$pam_bull_events.0001.a.flavor$"
