 pam_raise_khachkar_decision: "Воздвигнуть хачкар"
 pam_raise_khachkar_decision_desc: "Догмат «[GetTenetType('tenet_khachkar').GetName( ROOT.Char.GetRite )]» учит, что для оказания почестей усопшим лучше всего подходит резной камень. Мне следует воздвигнуть богато украшенный хачкар в память о своей родне. Он объединит живых, мёртвых и землю."
 pam_raise_khachkar_decision_tooltip: "Воздвигнуть [GetModifier('pam_khachkar_ancestral_county').GetName] в одном из ваших [Concept('counties', 'графств')|E]"
 pam_raise_khachkar_decision_confirm: "Запечатлеть в камне"
 pam_raise_khachkar_decision_warning: "@warning_icon!#X Хачкар будет уничтожен, если правитель [Concept('county', 'графства')|E] не будет принадлежать к вашей [Concept('dynasty', 'династии')|E]#!"
