 pam_proclaim_crusade_age_tenet_decision_desc: "Верным сынам церкви пора взять оружие, чтобы защитить христианский мир и вернуть утраченное."
 pam_proclaim_crusade_age_tenet_decision_tooltip: "Принять догмат «[GetTenetType('tenet_armed_pilgrimages').GetBaseName]» или «[GetTenetType('tenet_struggle_submission').GetBaseName]» в качестве [Concept('core_tenet', 'основного догмата')|E] своего [Concept('mainline_rite', 'господствующего течения')|E]."
 pam_proclaim_crusade_age_tenet_decision_confirm: "Пусть верующие отправляются в путь"
 pam_secure_pilgrim_routes_decision: "Защитить паломнические маршруты"
 pam_secure_pilgrim_routes_decision_desc: "Дороги в святых местах становятся опасными. Позволив верующим совершать паломничества с оружием, мы защитим путников и укрепим набожность всего христианского мира."
 pam_secure_pilgrim_routes_decision_tooltip: "Принять [Concept('core_tenet', 'догмат')|E] «[GetTenetType('tenet_armed_pilgrimages').GetBaseName]» в качестве основного"
 pam_secure_pilgrim_routes_decision_confirm: "Пусть дороги станут безопасными"
 pam_secure_pilgrim_routes_decision_select_tt: "Необходимо выбрать [Concept('core_tenet', 'догмат')|E] для замены"
