 pam_decision_last_rites_name: "Получить соборование"
 pam_decision_last_rites_name_low: "Получить соборование"
 pam_decision_last_rites_desc: "#EMP Помилуй меня, [ROOT.Char.GetFaith.HighGodName]! Многократно омой меня от беззакония моего и от греха моего очисти меня.#!\n\nКонец моего бренного существования близок, и я надеюсь очистить свою душу. Защитившись от нечестивого влияния, я обрету хорошую смерть и вечную жизнь в Царстве Небесном."
 pam_decision_last_rites_tooltip: "Приготовить свою душу к переходу в мир иной"
 pam_decision_last_rites_tooltip_sp_effect: "Вы получите [Concept('spiritual_fulfillment', 'духовную реализацию')|E] @spiritual_fulfillment_icon!"
 pam_decision_last_rites_confirm: "Соберитесь у моей постели"
 pam_decision_last_rites_sp_tooltip: "Ваша [spiritual_fulfillment|El] не ниже, чем #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_doctrine_tt: "У [Concept('faith', 'конфессии')|E] должна быть [Concept('doctrine', 'доктрина')|E] «[GetDoctrineType('doctrine_sacraments_central').GetBaseName]»"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X Если вы не получите соборование:\n$BULLET_WITH_TAB$Вы потеряете [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$Каждый #TOOLTIP:VASSAL_STANCE,zealot #L [GetVassalStance( 'zealot' ).GetTextIcon]фанатичный#!#! [Concept('vassal', 'вассал')|E] ([THIS.ScriptValue('number_of_zealot_vassals')|V0]):\n$TAB$$BULLET_WITH_TAB$Снизит [Concept('opinion', 'мнение')|E] о #V вас#! на #N 30#! #!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Возможно, вам придется раскрыть [Concept('secret', 'секрет')|E]"
 pam_decision_events.0005.details: "У вас будут возможности [Concept('lease', 'сдать в аренду')|E] [Concept('titles', 'титулы')|E] или, если у вас нет доступных, пожертвовать [Concept('gold', 'золото')|E] [Concept('monastic_holy_orders', 'монашеским орденам')|E], [Concept('holy_orders', 'священным орденам')|E] или [Concept('the_christian_church', 'церкви')|E] в обмен на выгодные [Concept('modifiers', 'модификаторы')|E] для вашего [Concept('player_heir', 'наследника-игрока')|E]"
 pam_decision_events.0005.t: "Соборование: мой последний час"
 pam_decision_events.0005.desc.healthtrait: "[death_trait.GetName(soon_dead)] — следствие моего греха, и грех приведёт меня к неминуемой смерти."
 pam_decision_events.0005.desc.bad: "Мне с трудом давалось соблюдение заповедей [ROOT.Char.GetFaith.HighGodNamePossessive], и в своей заносчивости я [Select_CString(ROOT.Char.IsFemale, 'пыталась', 'пытался' )] скрыть свой грех от его всевидящего взора.\n\n"
 pam_decision_events.0005.desc.good: "Но, к счастью, я чувствую, что ангелы рядом, оберегают мою душу от демонов, пытающихся забрать её.\n\n"
 pam_decision_events.0005.desc.neutral: "Несмотря на попытки соблюдать заповеди [ROOT.Char.GetFaith.HighGodNamePossessive], стоя на пороге вечности, я волнуюсь, сочтут ли мою душу достойной войти в Царство Небесное?\n\n"
 pam_decision_events.0005.desc.notalone: "Подле меня сидят [Select_CString(fam_or_friend_1.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))] [fam_or_friend_1.GetFirstName] и другие и молятся за мою душу."
 pam_decision_events.0005.desc.alone: "В одиночестве я дрожу от страха, и нет рядом никого, кто помолился бы за мою душу."
 pam_decision_events.0005.desc.outro: "Мой исповедник, держа в руке [Glossary('служебник','SACRAMENTARY_GLOSS')], обращается ко мне: «Не сотвори лжи пред лицом [ROOT.Char.GetFaith.HighGodNamePossessive]!»\n\nДаже царь Давид очистился после исповеди...[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "Меня ждет таинство покаяния."
 pam_decision_events.0005.b: "Дьявол меня забери! Избавьте меня от священника."
 pam_psalm_51_english: "«Тебе, Тебе единому согрешил я и лукавое пред очами Твоими сделал, так что Ты праведен в приговоре Твоём и чист в суде Твоём."
 SACRAMENTARY_GLOSS: "Служебник, или #EMP Литургикон#!, — это книги, использовавшиеся христианскими епископами или священниками в литургических службах. В зависимости от эпохи и региона в них могли быть записаны тексты или песнопения, в том числе и для совершения таинств."
 pam_decision_events.0006.t: "Соборование: мой грех всегда передо мной"
 pam_decision_events.0006.intro: "«Человеку свойственно ошибаться. Но отпущение грехов невозможно без исповеди», — говорит [confessor.GetTitledFirstName]."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\nМои грехи были велики и часты. Моя душа тяжела, в неё вцепились острые пальцы Сатаны, намеревающегося забрать своё.\n\n"
 pam_decision_events.0006.desc.good: "\n\nМоё сердце легко, как легки были мои деяния, соответствующие воле Божьей.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nЯ всего лишь человек, и грехи не обошли меня стороной, несмотря на мои лучшие намерения.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "[my_sinful_trait.GetName(soon_dead)] — как же часто это сбивало меня с пути истинного!"
 pam_decision_events.0006.desc.secret_sin: "[my_secret.GetName] — вот что держало меня в объятиях тьмы крепче любого якоря."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "[my_criminal_trait.GetName(soon_dead)] хуже всего! Меня душит чувство вины."
 pam_decision_events.0006.desc.sin_default: "Мои грехи, хотя они, несомненно, велики, сложно вспомнить. Но они наверняка нахлынут подобно океану, когда [confessor.GetTitledFirstNameNoTooltip] начнёт слушать моё признание."
 pam_decision_events.0006.desc.sin_default_good_sp: "Пусть [ROOT.Char.GetFaith.HighGodName] сокрушит мои кости и изгладит все беззакония мои."
 pam_decision_events.0006.desc.outro: "Мне нужно раскрыть свои грехи и покаяться, иначе меня не допустят к причастию."
 pam_decision_events.0006.a: "«Прости меня, [confessor.GetMotherFather]...»"
 pam_decision_events.0006.b: "Некоторые грехи нужно унести с собой в могилу."
 pam_decision_events.0006.b.flavor: "Вы каетесь в некоторых грехах, но утаиваете секреты, к которым причастны другие."
 pam_decision_events.0007.t: "Соборование: плоть, кровь и елей"
 pam_decision_events.0007.intro: "Перечисление моих грехов завершилось. Одно дело быть должным десять тысяч талантов, иное дело — квадрант.\n\nИсповедник предлагает мне освящённые хлеб и вино."
 pam_decision_events.0007.desc.bad: "Даже сейчас, когда мне предложены тело и кровь Господни, я слышу шёпот демонов, умоляющих меня отдать им душу, чтобы я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] продолжать жить и предаваться земным утехам.\n\n"
 pam_decision_events.0007.desc.good: "Сняв с себя бремя, я шагаю в объятья смерти. Я хочу отведать тела и крови Господних, ибо вскоре окажусь подле него.\n\n"
 pam_decision_events.0007.desc.neutral: "Пусть тело и кровь Господни оберегут меня от демонов, что рыскают подобно волкам в надежде забрать меня до срока.\n\n"
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U] наносит священный елей на мои чело, руки и ноги."
 pam_decision_events.0007.desc.oil.bad: "Моя душа продолжает терзаться тревогами.\n\n"
 pam_decision_events.0007.desc.oil.good: "Моя душа лучится от любви Божьей.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "Моя душа защищена и готова к путешествию.\n\n"
 pam_decision_events.0007.desc.outro: "[Glossary('Viaticum','VIATICUM_GLOSS')] и [Glossary('елеосвещение','UNCTION_GLOSS')] завершены, можно подумать о том, кто будет молиться за меня."
 VIATICUM_GLOSS: "Латинское слово, которое переводится как «провизия в дорогу». Так называется таинство причастия в контексте соборования. Под дорогой подразумевается поиск пути к вечной жизни после смерти."
 UNCTION_GLOSS: "Елеосвещение — это термин, обозначающий помазание больных священным елеем при смерти. Этот обряд должен подготовить умирающего к вечной жизни после смерти."
 pam_decision_events.0007.a: "Пусть за меня помолится [monastic_order.GetName]."
 pam_decision_events.0007.b: "[military_order.GetName] получит мою поддержку."
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip] получит мои богатства, а я — [religious_head.GetHerHis] молитвы."
 pam_decision_events.0007.d: "Хватит и того, что [confessor.GetTitledFirstNameNoTooltip] произнесёт несколько благочестивых слов."
