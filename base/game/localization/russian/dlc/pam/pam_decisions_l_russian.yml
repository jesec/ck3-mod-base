 pam_create_great_schism_effect_tt: "Течение «[old_rite.GetName]» уничтожается. Течения «[roman_rite.GetName]» и «[byzantine_rite.GetName]» возводятся в ранг [Concept('faiths', 'конфессий')|E]"
