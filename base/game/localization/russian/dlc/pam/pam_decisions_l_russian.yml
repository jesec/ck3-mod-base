 only_sub_realm_duchies_tooltip: "Ваше новое [Concept('kingdom', 'королевство')|E] [Concept('de_jure', 'де-юре')|E] заявит права только на [Concept('duchies', 'герцогства')|E], находящиеся в вашем владении или под вашим полным контролем."
 consecrate_kingdom_exclave_duchies_available_tt: "Любые соседние [Concept('duchies', 'герцогства')|E], оказавшиеся эксклавами [Concept('kingdom', 'королевств')|E], которым они принадлежат [Concept('de_jure', 'де-юре')|E]"
 newly_exclaved_kingdoms_decision: "Держава и королевства-эксклавы"
 newly_exclaved_kingdoms_tooltip: "Помимо собственных [Concept('kingdoms', 'королевств')|E] [Concept('realm', 'державы')|E], ваша новая [Concept('empire', 'империя')|E] [Concept('de_jure', 'де-юре')|E] заявит права на королевства, ставшие эксклавами при её создании. К ним относятся нестоличные королевства, утратившие общие границы с другими королевствами своих империй."
 only_sub_realm_kingdoms_decision: "Только собственные королевства"
 only_sub_realm_kingdoms_tooltip: "Ваша новая [Concept('empire', 'империя')|E] [Concept('de_jure', 'де-юре')|E] заявит права только на [Concept('kingdoms', 'королевства')|E], находящиеся в вашем владении или под вашим полным контролем."
 consecrate_kingdom_exclave_kingdoms_available_tt: "Любые соседние [Concept('kingdoms', 'королевства')|E], оказавшиеся эксклавами [Concept('empire', 'империй')|E], которым они принадлежат [Concept('de_jure', 'де-юре')|E]"
 consecrate_kingdom_decision: "Освятить новое королевство"
 consecrate_kingdom_decision_desc_self: "[ROOT.Char.GetFaith.HighGodName] наделяет монархов властью, а я говорю от имени [ROOT.Char.GetFaith.HighGodNamePossessive]. Можно ли найти более достойного владыку для земель истинной веры?"
 consecrate_kingdom_decision_desc: "[ROOT.Char.GetFaith.HighGodName] наделяет монархов властью, а в час нужды может возвышать правителей из рядов самой скромной знати.\n\nСейчас настало именно такое время. Я возложу священную корону на свою непокрытую голову."
 consecrate_kingdom_decision_confirm: "Принять королевские полномочия"
 consecrate_kingdom_decision_tooltip: "Учредить новый [Concept('kingdom', 'королевский')|E] [Concept('title', 'титул')|E], основываясь не на могуществе [Concept('realm', 'державы')], а на решении высших духовных властей"
 consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.GetShortUIName] по-прежнему может отказаться освятить ваше [Concept('kingdom', 'королевство')|E], что приведёт к аннулированию данного [Concept('decision', 'решения')|E]!#!"
 consecrated_king_ai_behavior_large_tt: "#EMP #weak Будет вести себя более ревностно и справедливо#!#!"
 consecrated_king_modifier: "Первый из освящённых монархов"
 consecrated_king_modifier_small: "$consecrated_king_modifier$"
 consecrated_king_modifier_desc: "Образовано священное королевство, монархом которого может стать этот персонаж. Он получит королевские полномочия непосредственно от божества."
 consecrated_king_modifier_small_desc: "$consecrated_king_modifier_desc$"
 pam_decision_events.0030.b.decline: "[religious_authority.GetTitleAsName|U] осуждает ваше королевство"
 pam_decision_events.0030.opening: "[Select_CString(religious_authority.IsFemale, 'Пресвятая мать', 'Пресвятой отец')]!"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName|U] велит, чтобы лишь немногие служили верховными опекунами [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip]их детей, властвуя над прекраснейшими странами Земли.\n\nЯ скромно прошу включить меня в число этих благословенных избранных. Создайте королевство [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], и я стану защищать его от любого зла."
 pam_decision_events.0030.a: "Новое [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] отныне освящено."
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName|U] не имеет таких планов в отношении вас, [king_aspirant.GetFirstNameNoTooltip]..."
 pam_decision_events.0031.t: "[ROOT.Char.GetFaith.GetNameNoTooltip|U]ий [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 pam_decision_events.0031.desc.self_crowning: "Есть ли земля более благословенная, чем [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Какие ещё владения достойны называться королевскими? Не сам ли [ROOT.Char.GetFaith.WarGodName] охранил местных жителей от бед и устроил мой святой престол в этом счастливом краю?\n\nИсполняя волю [ROOT.Char.GetFaith.HighGodNamePossessive], я провозглашаю, что отныне этот край — [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. С этого дня я стану священным хранителем этих земель, а моя воля будет им законом.\n\nСклонитесь, вассалы и верные! Отныне добрые [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural|l] знают, кто их [ROOT.Char.GetTitleAsName]."
 pam_decision_events.0031.desc_three_duchies: "Своим указом [religious_authority.GetTitledFirstNameRegnal] [Select_CString(religious_authority.IsFemale, 'объединила', 'объединил')] мои земли, словно звёзды судьбоносного созвездия в вечно кружащемся небе. Отныне [duchy_1.GetName], [duchy_2.GetName] и [duchy_3.GetName] — это [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l], единая и благословенная держава.\n\nМоя праведная и достойная жизнь вознаграждена: отныне я — [ROOT.Char.GetTitleAsName]! [religious_authority.GetTitleAsNameNoTooltip|U] [Select_CString(religious_authority.IsFemale, 'удостоила', 'удостоил')] меня власти, и теперь я буду править [religious_authority.GetHerHis] именем."
 pam_decision_events.0031.desc: "Согласно указу, который [Select_CString(religious_authority.IsFemale, 'издала', 'издал')] [religious_authority.GetTitledFirstNameRegnal|U], в анналы истории отныне [Select_CString(ROOT.Char.IsFemale, 'вписана новая', 'вписан новый')] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. [ROOT.Char.GetFaith.PriestNeuterPlural|U] и народ восторженно славят меня! Моё [ROOT.Char.GetPrimaryTitle.GetNameNoTier] не попадёт в руки Пока я — [Select_CString(ROOT.Char.IsFemale, 'законная', 'законный')] [ROOT.Char.GetTitleAsName] этой [ROOT.Char.GetFaith.GetAdjective]ой державы, [ROOT.Char.GetPrimaryTitle.GetNameNoTier] не попадёт в руки язычников и еретиков.\n\n[religious_authority.GetTitleAsNameNoTooltip|U],  [Select_CString(religious_authority.IsFemale, 'наделившая', 'наделивший')] меня властью, [Select_CString(religious_authority.IsFemale, 'благословила', 'благословил')] эту скромную державу... и, несомненно, ещё проявит интерес к моим монаршим делам."
 pam_decision_events.0031.a: "Пусть [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], где я правлю, навеки останется в сиянии благословенной любви, которую дарует [ROOT.Char.GetFaith.HighGodName]."
 any_landed_duchy_title_tt: "Как минимум одно ваше [Concept('duchy', 'герцогство')|E] является [Concept('landed', 'землевладельческим')|E] [Concept('title', 'титулом')|E]#weak #EMP (не [Concept('clerical_region', 'церковным округом')|E] и не [Concept('noble_family', 'благородным семейством')|E])#!#!"
 head_of_faith_tt: "У вашей [Concept('faith', 'конфессии')|E] есть [Concept('head_of_faith', 'глава')|E]"
 custom.every_empire_secular_ruler: "Каждый светский [Concept('ruler', 'правитель')|E] в [Concept('de_jure', 'де-юре')|E] [Concept('empire', 'империи')|E] вашей [Concept('realm', 'державы')|E] исповедует ту же [Concept('faith', 'конфессию')|E], что и вы"
