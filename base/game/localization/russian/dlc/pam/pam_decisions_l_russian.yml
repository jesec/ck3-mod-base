 pam_prevented_great_schism_dynasty_modifier: "Хранители единства"
 pam_prevented_great_schism_dynasty_modifier_desc: "Эта династия предотвратила окончательный раскол христианского мира и сохранила церковь единой на много десятилетий вперёд."
 pam_prevented_great_schism_character_modifier: "$pam_prevented_great_schism_dynasty_modifier$"
 pam_prevented_great_schism_character_modifier_desc: "Этот персонаж предотвратил окончательный раскол христианского мира, тем самым обеспечив единство церкви на многие десятилетия вперёд."
 pam_caused_great_schism_dynasty_modifier: "Нарушители единства"
 pam_caused_great_schism_dynasty_modifier_desc: "Эта династия привела христианский мир к окончательному расколу и вынудила течения веры разойтись на много десятилетий вперёд."
 pam_caused_great_schism_character_modifier: "$pam_caused_great_schism_dynasty_modifier$"
 pam_caused_great_schism_character_modifier_desc: "Этот персонаж привёл христианский мир к окончательному расколу, тем самым вынудив верующих разделиться на разные течения на многие десятилетия вперёд."
 pam_mended_great_schism_military_dynasty_modifier: "Блюстители единства"
 pam_mended_great_schism_military_dynasty_modifier_desc: "Эта династия силой объединила древние епархии и устранила раскол, который потряс христианский мир."
 pam_mended_great_schism_military_character_modifier: "$pam_mended_great_schism_military_dynasty_modifier$"
 pam_mended_great_schism_military_character_modifier_desc: "Этот персонаж силой объединил древние епархии и устранил раскол, который потряс христианский мир."
 pam_mended_great_schism_diplomatic_dynasty_modifier: "Примирители христианства"
 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "Эта династия мирным путём убедила соперничающих патриархов вновь объединиться, тем самым устранив раскол, который потряс христианский мир."
 pam_mended_great_schism_diplomatic_character_modifier: "$pam_mended_great_schism_diplomatic_dynasty_modifier$"
 pam_mended_great_schism_diplomatic_character_modifier_desc: "Этот персонаж мирным путём убедил соперничающих патриархов вновь объединиться, тем самым устранив раскол, который потряс христианский мир."
 nick_the_reconciler: "[Select_CString(CHARACTER.IsFemale, 'Мирительница', 'Миритель' )]"
 nick_the_reconciler_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer, 'объединили', Select_CString(CHARACTER.IsFemale, 'объединила', 'объединил' ))] древние епархии и [Select_CString(CHARACTER.IsLocalPlayer, 'устранили', Select_CString(CHARACTER.IsFemale, 'устранила', 'устранил' ))] раскол, который потряс христианский мир."
 nick_the_concordant: "[Select_CString(CHARACTER.IsFemale, 'Поборница', 'Поборник')] Согласия"
 nick_the_concordant_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'сохранила', 'сохранил')] единство вероисповедания в годы расколов и разногласий."
 nick_the_schismat: "Раскольник"
 nick_the_schismat_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'расколола', 'расколол')] христианский мир, из-за чего верующие направились каждый своим путём."
 pam_promulgate_word_of_pious_deeds_decision: "Рассказать миру о благочестивых делах"
 pam_promulgate_word_of_pious_deeds_decision_desc: "Труженики из канцелярии составили славословие, в котором превозносят мои христоподобные заслуги. И хотя доброму христианину не к лицу возвеличивать собственные добродетели, мои приближённые хотят, чтобы все [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|l] узнали, насколько же я праведный человек.\n\nВозможно, в этом случае о том, что я больше других [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин')] занять кафедру Святого Петра, узнает сначала моя держава… а затем — и все остальные."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Увеличить счёт на выборах#! для персонажа [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)] на #P 30#! или повысить шансы на [Concept('canonization', 'канонизацию')|E]"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Выберите одно из двух:\n\t$EFFECT_LIST_BULLET$Потратить [Concept('piety', 'благочестие')|E], чтобы #V увеличить счёт на выборах#! для персонажа [praise_worthy_priest_superior_title.GetName]\n\t$EFFECT_LIST_BULLET$Повысить вероятность того, что в будущем вас [Concept('canonization', 'канонизируют')|E]"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Пусть возносят хвалу!"
 cardinal_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Вы — [Concept('cardinal', 'кардинал')|E]"
 domicile_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "В вашем [Concept('domicile', 'имении')|E] должна быть [Concept('domicile_building', 'постройка')|E] «[GetDomicileBuilding('chancery_01').GetName]» или выше"
 pam_renounce_papal_candidacy_decision: "Отказаться от престола"
 pam_renounce_papal_candidacy_decision_embrace: "Заявить о притязаниях на престол"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Некоторые всю жизнь стремятся занять престол, на котором ныне восседает [ROOT.Char.GetFaith.ReligiousHeadName|l], и мне не раз доводилось видеть, как это стремление портит людей.\n\nЯ сообщу [Concept('cardinal', 'кардиналам')|E], что не собираюсь выдвигать свою кандидатуру на следующих выборах. Моё место здесь, в моей епархии."
 pam_renounce_papal_candidacy_decision_desc_embrace: "Прежде я [Select_CString(ROOT.Char.IsFemale, 'заявила', 'заявил' )], что не буду претендовать на престол, который занимает [ROOT.Char.GetFaith.ReligiousHeadName|l]. Тогда я [Select_CString(ROOT.Char.IsFemale, 'была', 'был' )] моложе, а [ROOT.Char.GetFaith.GetName] — под началом более достойных людей, нежели сейчас.\n\nС тех пор многое изменилось, и теперь я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )] вновь выдвинуть свою кандидатуру на выборах."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Отказаться от своих притязаний на роль следующего [Concept('head_of_faith', 'главы конфессии')|E]"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "Вновь заявить о своих притязаниях на роль следующего [Concept('head_of_faith', 'главы конфессии')|E]"
 pam_renounce_papal_candidacy_decision_renounce_tt: "Вы снимете свою кандидатуру со следующих выборов [Concept('head_of_faith', 'главы конфессии')|E], при этом сохранив своё право голоса"
 pam_renounce_papal_candidacy_decision_embrace_tt: "Вы выдвинете свою кандидатуру на следующих выборах [Concept('head_of_faith', 'главы конфессии')|E]"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "В выборах должен участвовать хотя бы ещё один [Concept('cardinal', 'кардинал')|E]"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "Снять свою кандидатуру"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "Участвовать в выборах"
 pam_decision_events.0015.t: "Рассказать миру о благочестивых делах"
 pam_decision_events.0015.desc.intro.no_praiser: "Мои верные священники распространяют"
 pam_decision_events.0015.desc.intro.praiser: "[Select_CString(my_praiser.IsFemale, 'Моя влиятельная', 'Мой влиятельный')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))] [my_praiser.GetTitledFirstName|l] распространяет"
 pam_decision_events.0015.desc.intro: "славословие, которое составила моя [GetDomicileBuilding('chancery_01').GetName|l]:\n\n«Добродетельные поступки — всё равно что семена, засеиваемые Господом Богом в землю и затем дающие обильный урожай. Пусть каждому будет известно имя [praise_worthy_priest.GetName], ибо [Select_CString(praise_worthy_priest.IsFemale, 'её', 'его')] свершения, для которых нет иного слова, чем „благородство“"
 pam_decision_events.0015.desc.virtuoustrait: "и „[my_virtuous_trait.GetName(praise_worthy_priest)]“"
 pam_decision_events.0015.desc.mid: ", и которые направляет"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]...»"
 pam_decision_events.0015.desc.novirtuoustenet: "Бог…»"
 pam_decision_events.0015.desc.bad: "\n\nНесмотря на хвалебные слова, в глубине души я боюсь, что меня ждёт геенна огненная."
 pam_decision_events.0015.desc.good: "\n\nПоистине я — избранный сосуд Господень, воплощение Его красоты на земле."
 pam_decision_events.0015.desc.neutral: "\n\nНесмотря на хвалебные слова, я понимаю, что только после смерти узнаю, достойна ли моя душа пребывать рядом с Господом."
 pam_decision_events.0015.desc.outro: "\n\n«…Истинно так и есть, что по мере праведных заслуг [Select_CString(praise_worthy_priest.IsFemale, 'её', 'его')] можно судить, что однажды [Select_CString(praise_worthy_priest.IsFemale, 'эта женщина', 'этот человек')] возглавит церковь!»"
 pam_decision_events.0015.b: "«С моим именем связано множество чудес»."
 pam_decision_events.0015.b.flavor: "Зачем стремиться стать папой, если можно попасть в канон?"
 pam_decision_events.0015.b.tt: "#V Увеличить шансы на канонизацию#! после смерти\n#weak Для канонизации необходима [Concept('dynasty', 'династия')|E]#!"
 pam_decision_events.0015.c: "Если Господь хочет, чтобы паства следовала за мной…"
 pam_decision_events.0015.c.flavor: "…то мне придётся не ударить лицом в грязь"
 pam_decision_events.0015.c.tt: "#V Увеличить счёт на выборах#! для персонажа [praise_worthy_priest_superior_title.GetName] на #P 30#!"
 pam_decision_events.0015.d: "Других имён на выборах быть не должно."
 pam_decision_events.0015.d.flavor: "Мне нет равных в благочестии. Победа будет за мной."
 pam_decision_events.0015.d.tt: "#V Увеличить счёт на выборах#! для персонажа [praise_worthy_priest_superior_title.GetName] на #P [praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, чего будет достаточно для первенства среди популистов\nТребуется @piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] ед. [Concept('piety', 'благочестия')|E]"
 pam_evangelize_personal_tenet_decision: "Проповедовать личный принцип"
 pam_evangelize_personal_tenet_decision_desc: "Пусть о моей вере услышат все. Я последую учениям Иисуса и буду проповедовать от Его имени."
 pam_evangelize_personal_tenet_decision_tooltip: "Проповедовать свой [Concept('personal_tenet', 'личный принцип')|E] своим [Concept('subjects', 'субъектам')|E] и [Concept('rulers', 'правителям')|E] в пределах [Concept('clerical_region', 'церковного округа')|E] вашей [Concept('realm_capital', 'столицы')|E], чтобы те приняли их, как свой личный принцип"
 pam_evangelize_personal_tenet_decision_confirm: "Проповедовать принцип «[selected_item.GetNameNoTooltip(actor.GetRite)]» ([GuiScope.SetRoot( actor.MakeScope ).AddScope( 'second', selected_item.MakeScope ).Custom( 'pam_tenet_popularity_status' )|l], #high [actor.GetFaith.GetTenetPopularityScore( selected_item.Self )]#!)"
 pam_evangelize_tenet_select_tt: "Необходимо выбрать '[Concept('personal_tenet', 'личный принцип')|E]"
 pam_evangelize_personal_tenet_decision_no_item_selected: "[Concept('personal_tenet', 'Личный принцип')|E] не выбран"
 pam_evangelize_personal_tenet_religious_authority_tt: "#V Вы#! должны удовлетворять одному из следующих условий:\n$BULLET_WITH_TAB$Быть представителем [Concept('clergy', 'духовенства')|E]\n$BULLET_WITH_TAB$Иметь [Concept('clerical_puppet','священника-марионетку')|E]"
 pam_evangelize_personal_tenet_valid_targets_tt: "В [Concept('clerical_region', 'церковном округе')|E] вашей [Concept('realm_capital', 'столицы')|E] должен быть хотя бы один [Concept('subject', 'субъект')|E] или [Concept('ruler', 'правитель')|E], удовлетворяющий хотя бы одному из следующих условий:\n$BULLET_WITH_TAB$Является [Concept('adult', 'взрослым')|E]\n$BULLET_WITH_TAB$Разделяет вашу [Concept('faith', 'веру')|E]\n$BULLET_WITH_TAB$Имеет такой же [Concept('title_tier', 'уровень')|E], что и у вас, или ниже\n$BULLET_WITH_TAB$Имеет отличный от вашего [Concept('personal_tenet', 'личный принцип')|E]"
