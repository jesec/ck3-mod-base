 pam_cardinal_endow_masses_decision: "Учредить мессы"
 pam_cardinal_endow_masses_decision_desc: "Моя должность с уже наскучившей регулярностью приносит мне огромный доход, однако церковь обязывает меня отчитываться за любой излишек средств.\n\nЯ могу направить лишние деньги на богоугодное дело, учредив специальный фонд. Эти средства пойдут на оплату труда священников, которые будут каждодневно служить мессы за усопших. Разумеется, указ о пожертвовании будет оформлен на бумаге и скреплён печатью, дабы его зачитывали в каждой церкви, которая находится в моём ведении."
 pam_cardinal_endow_masses_decision_tooltip: "Потратить средства из [Concept('treasury', 'казны')|E] в обмен на [Concept('piety', 'благочестие')|E]. [Concept('subordinate', 'Подчинённые')|E] вам представители [Concept('clergy', 'духовенства')|E] также получат [Concept('piety', 'благочестие')|E] и улучшат своё [Concept('opinion', 'мнение')|E] о вас"
