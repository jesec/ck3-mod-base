l_russian:
 pam_invite_syncretic_exiles_decision: "Пригласить изгоев-синкретиков"
 pam_invite_syncretic_exiles_decision_desc: "Изгнанные общины верующих, чью религию мы признаём и уважаем, ищут новый дом, где они смогут чувствовать себя в безопасности. Я могу предложить им поселиться в моих владениях, чтобы они поделились с нами своими обычаями и традициями."
 pam_invite_syncretic_exiles_decision_tooltip: "Пригласить изгнанников признанной вами религии в свои графства, чтобы повысить их [Concept('development', 'развитие')|E] за счёт изменения местной [Concept('faith', 'конфессии')|E] или [Concept('rite', 'течения')|E].\n\nРасходует большое количество [Concept('piety', 'благочестия')|E]."
 pam_invite_syncretic_exiles_decision_confirm: "Пригласить изгнанников"
 pam_invite_syncretic_exiles_decision_effect: "К вам прибудет группа изгнанников, которые смогут поселиться в ваших [Concept('counties', 'графствах')|E] и поспособствовать их [Concept('development', 'развитию')|E] за счёт изменения их [Concept('faith', 'конфессии')|E] или [Concept('rite', 'течения')|E]."
 pam_invite_syncretic_exiles_no_pool: "Нет подходящих религиозных изгнанников, которых можно было бы пригласить"
 SELECT_TENET: "Выбрать догмат"
 REPLACE_TENET: "Заменить догмат"
 SELECT_HOLY_SITE: "Выбрать святое место"
 puppet_cost_desc: "[Character.GetName],"
 pam_decision_confession_name: "Исповедаться"
 pam_decision_confession_name_low: "Покаяться в грехах"
 pam_decision_confession_desc: "Когда человеку становится известно о грузе его вины, он должен признаться в своих грехах."
 pam_decision_confession_tooltip: "Покаяться в грехах"
 pam_decision_confession_tooltip_sp_effect: "Вы получите [Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 pam_decision_confession_tooltip_stress_effect: "Уровень вашего [Concept('stress', 'стресса')|E] понизится"
 pam_decision_confession_confirm: "Пусть придет [ROOT.Char.GetFaith.PriestNeuter|l]"
 sp_confession_decision_tooltip: "Ваша [spiritual_fulfillment|El] не ниже, чем #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_confession_sp_court_chaplain: "У вас есть [Concept('court_chaplain', 'придворный капеллан')|E]"
 pam_decision_events.0001.t: "Признание"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName] терпеливо ждут в пустой капелле.\n\n"
 pam_decision_events.0001.desc.bad: "[Select_CString(chaplain.IsFemale, 'Её', 'Его' )] суровый взгляд именно такой, какой можно было бы ожидать от Отца."
 pam_decision_events.0001.desc.good: "Пусть даже бремя на моих плечах невелико, его всё равно можно облегчить."
 pam_decision_events.0001.desc.neutral: "Словно заблудшая овца, сомневаясь в доброте моего сердца, я подхожу к [Select_CString(chaplain.IsFemale, 'ней', 'нему' )]."
 pam_decision_events.0001.desc.sin.preamble: "\n\nМне известна вина, порождённая моими грехами."
 pam_decision_events.0001.desc.sin.lustful: "Мной управляет похоть."
 pam_decision_events.0001.desc.sin.chaste: "Моё целомудрие стало лишь холодной бронёй, за которой я укрываюсь от мира и долга."
 pam_decision_events.0001.desc.sin.gluttonous: "Я предаюсь неумеренному обжорству."
 pam_decision_events.0001.desc.sin.temperate: "Моя умеренность стала холодностью."
 pam_decision_events.0001.desc.sin.greedy: "Сребролюбие одолело меня и не давало мне помогать нуждающимся."
 pam_decision_events.0001.desc.sin.generous: "Щедрость моя не знала разумных пределов и привела меня к бедности."
 pam_decision_events.0001.desc.sin.lazy: "Лень удерживала меня от молитвы и долга."
 pam_decision_events.0001.desc.sin.diligent: "Моё рвение к труду лишило меня доброты и сочувствия."
 pam_decision_events.0001.desc.sin.wrathful: "Гнев привёл меня ко греху."
 pam_decision_events.0001.desc.sin.calm: "Моё спокойствие — на самом деле безразличие, выдаваемое за добродетель."
 pam_decision_events.0001.desc.sin.patient: "Терпение моё стало трусливым промедлением."
 pam_decision_events.0001.desc.sin.impatient: "Нетерпение привело меня к губительной поспешности."
 pam_decision_events.0001.desc.sin.arrogant: "Гордыня ожесточила моё сердце."
 pam_decision_events.0001.desc.sin.humble: "Ложная скромность заслоняла от меня истину."
 pam_decision_events.0001.desc.sin.deceitful: "Из уст мои исходила ложь, истина же, которой ждали, пряталась."
 pam_decision_events.0001.desc.sin.honest: "Моя необдуманная прямота ранила людей, когда нужен был такт."
 pam_decision_events.0001.desc.sin.craven: "Страх вынудил меня покинуть истину."
 pam_decision_events.0001.desc.sin.brave: "Храбрость моя превзошла осторожность и стала неосмотрительностью."
 pam_decision_events.0001.desc.sin.shy: "Робость не дала мне поступать правильно, когда это было нужно."
 pam_decision_events.0001.desc.sin.gregarious: "Любовь к сборищам помогала мне заглушать голос совести."
 pam_decision_events.0001.desc.sin.ambitious: "Мои амбиции превзошли разум."
 pam_decision_events.0001.desc.sin.content: "Умение довольствовать малым притупило мою страсть к праведности."
 pam_decision_events.0001.desc.sin.arbitrary: "Мне случалось выносить решения, исходя не из справедливости, но из личной прихоти."
 pam_decision_events.0001.desc.sin.just: "Справедливость, вершимая мной, была актом гордыни и безжалостности."
 pam_decision_events.0001.desc.sin.cynical: "Цинизм исказил мою веру."
 pam_decision_events.0001.desc.sin.zealous: "Милосердие во мне уступило фанатизму."
 pam_decision_events.0001.desc.sin.paranoid: "Подозрительность отвернула от меня людей."
 pam_decision_events.0001.desc.sin.trusting: "Истина заслонила от меня неправедность."
 pam_decision_events.0001.desc.sin.compassionate: "Жалость заставляла меня прощать то, что надо осуждать."
 pam_decision_events.0001.desc.sin.callous: "Моё сердце ожесточилось к чужим страданиям."
 pam_decision_events.0001.desc.sin.stubborn: "Упрямство не давало мне услышать чужие советы."
 pam_decision_events.0001.desc.sin.fickle: "Непостоянство лишило веса мои слова."
 pam_decision_events.0001.desc.sin.eccentric: "Мои чудачества отвратили от меня единоверцев."
 pam_decision_events.0001.desc.sin.vengeful: "Месть поглотила мою душу."
 pam_decision_events.0001.desc.sin.forgiving: "Прощение выдавалось мной без меры, даже за самые мерзкие проступки."
 pam_decision_events.0001.desc.sin.sadistic: "Жестокость приносила мне удовольствие."
 pam_decision_events.0001.desc.outro: "\n\n«[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]»"
 pam_decision_events.0001.a: "Прости меня, [chaplain.GetMotherFather], ибо я [Select_CString(ROOT.Char.IsFemale, 'согрешила', 'согрешил' )]."
 pam_john_20_22_english: "Примите Духа Святого. Кому простите грехи, тому простятся; на ком оставите, на том останутся."
 JOHN_20_22_GLOSS: "#weak Евангелие от Иоанна 20:22-23#!"
 pam_decision_act_of_devotion: "Выставить набожность напоказ"
 pam_decision_act_of_devotion_desc: "Глубокая духовная связь, объединяющая меня и [ROOT.Char.GetFaith.HighGodNamePossessive], невероятно сильна. Мне нужно излить её!\n\nПусть соберутся [ROOT.Char.GetFaith.PriestNeuterPlural|l], проведут большую мессу, созовут на неё всех в державе. Пусть все увидят набожность своего сюзерена."
 pam_decision_act_of_devotion_desc_tooltip: "Обменять [Concept('piety', 'благочестие')|E] на [Concept('prestige', 'престиж')|E]"
 pam_decision_act_of_devotion_tooltip_effect: "Вам будут доступны следующие варианты:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! ед. [Concept('prestige', 'престижа')|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! ед. [Concept('prestige', 'престижа')|E] и дополнительный [Concept('prestige_level', 'уровень репутации')|E] в обмен на [Concept('piety_level', 'уровень набожности')|E]"
 pam_decision_act_of_devotion_confirm: "Звоните в колокола!"
 pam_decision_act_of_devotion_sp_tooltip: "Ваша [spiritual_fulfillment|El] не ниже, чем #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "Ваша [Concept('prestige_level', 'репутация')|E] должна быть ниже уровня «[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]»"
 pam_confession_penalty_modifier: "Штраф за исповедь"
 pam_confession_penalty_modifier_desc: "Этот персонаж должен выполнить действие по поручению своего исповедника"
 pam_meddled_in_clerical_appointments_modifier: "Вмешательство в назначение духовенства"
 pam_meddled_in_clerical_appointments_modifier_desc: "Этот [Concept('ruler', 'правитель')|E] насильственно сменил [Concept('holder', 'владетеля')|E] [Concept('clerical_title', 'церковного титула')|E], разозлив тем самым [Concept('clergy', 'духовенство')|E]"
 pam_kowtowed_to_pope_modifier: "Преклонение перед церковью"
 pam_kowtowed_to_pope_modifier_desc: "Этот [Concept('ruler', 'правитель')|E] преклонил колено перед церковью, поклявшись поддержать #EMP духовную и сменяемую#! доктрину на совете, который завершает [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]. Доктрина будет снята, когда совет разрешит противоречие."
 pam_kowtow_to_pope_decision: "Преклониться перед главой религии по имени [ROOT.Char.GetFaith.ReligiousHeadName]"
 pam_kowtow_to_pope_decision_desc: "Корона и епископский жезл не на шутку сцепились за право назначать владетелей церковных титулов. Чем рисковать открытым противостоянием, лучше преклонить колено перед властью, которую олицетворяет [ROOT.Char.GetFaith.ReligiousHeadName|l], и встать рядом с единоверцами, когда будет созван большой совет, чтобы разрешить противоречия."
 pam_kowtow_to_pope_decision_tooltip: "Пообещать поддержать церковь в её стремление назначать духовенство"
 pam_kowtow_to_pope_decision_confirm: "Преклониться"
 pam_kowtow_to_pope_effect_tt: "Вы поддержите #EMP духовную и сменяемую#! на совете, по итогам которого разрешится [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]."
 pam_kowtow_to_pope_not_already_pledged_tt: "Вы ещё не пообещали поддержать церковь"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "У вашей [Concept('faith', 'конфесии')|E] должен быть [Concept('head_of_faith', 'глава')|E]"
 pam_kowtow_to_pope_toast: "Вы преклоняетесь перед главой религии по имени [ROOT.Char.GetFaith.ReligiousHeadName]"
 pam_decision_events.0001.a.confession_random_outcome: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] может вас о чём-то попросить, или вы можете что-нибудь услышать во время исповеди..."
 pam_decision_events.0001.a.piety: "Ваша исповедь кажется искренней"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName] [Select_CString(chaplain.IsFemale, 'узнала', 'узнал' )] новую информацию"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName] не одобряет ваши греховные свойства"
 pam_decision_events.0001.a.courtier_secret: "Вы слушаете, как исповедуется [my_courtier.GetShortUIName]"
 pam_decision_events.0001.a.random_confession: "Вы слышите чужую исповедь"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.GetShortUIName] просит вас отправиться в [Concept('pilgrimage', 'паломничество')|E]"
 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUIName] просит вас нанять кого-нибудь на должность «[GetCourtPositionType('high_almoner_court_position').GetName()]»"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUIName] просит вас не начинать наступательных войн в течение #V 5 лет#!"
 pam_confession_penalty_var.no_war_toast: "Вы обещали не объявлять войн"
 pam_decision_events.0001.a.conversion: "[chaplain.GetShortUIName] просит вас обратить персонажа [target.GetShortUIName]"
 pam_decision_events.0001.a.conversion.toast: "Вы исполнили обещание"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.GetShortUIName] [Select_CString(puppet_or_actor.IsFemale, 'выполнила', 'выполнил' )] своё обещание"
 pam_decision_events.0002.t: "Демонстрация набожности"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName] стоит подле меня, рядом с алтарём. Нежные лучи солнца озаряют"
 pam_decision_events.0002.desc.uncrowned: "мое одеяние словно священную мантию."
 pam_decision_events.0002.desc.crowned: "мою корону словно гало."
 pam_decision_events.0002.desc.mid: "\n\n«[ROOT.Char.Custom('RandomBibleQuote')]...» [my_chaplain.GetHerHis|U] служба всё продолжается,"
 pam_decision_events.0002.desc.bad: "и мне с трудом удается сконцентрироваться на ней."
 pam_decision_events.0002.desc.good: "но собравшиеся, кажется, смотрят только на меня."
 pam_decision_events.0002.desc.neutral: "и я осматриваю собравшихся, ища вдохновлённые лица."
 pam_decision_events.0002.desc.outro: "\n\n«И [Select_CString(ROOT.Char.IsFemale, 'наша мудрая и добродетельная', 'наш мудрый и добродетельный' )] [ROOT.Char.GetNameNoTooltip] проведёт нас через это время невзгод»."
 pam_decision_events.0002.a: "Нужно лично обратиться к толпе."
 pam_decision_events.0002.b: "Хватит простого подтверждения."
 pam_mentor_sp_decision: "Дать духовное наставление"
 pam_mentor_sp_decision_desc: "Мы, те, кто идёт в свете [ROOT.Char.GetFaith.HighGodNamePossessive], должны направлять тех, кто заблудился во тьме, и тех, чья молодость может заставить их сойти с пути истинного в своих мыслях или делах."
 pam_mentor_sp_decision_desc_tooltip: "Помочь ребёнку достичь [Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 pam_mentor_sp_decision_confirm: "Говорите и слушайте."
 pam_mentor_sp_decision_sp_tooltip: "Ваша [spiritual_fulfillment|El] не ниже, чем #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_mentor_sp_decision_tooltip_effect: "Вы увеличите [Concept('spiritual_fulfillment', 'духовную реализацию')|E] своего [Concept('primary_heir', 'первого наследника')|E] или [Concept('favorite_child', 'любимого ребёнка')|E]"
 pam_mentor_sp_decision_valid_child_tt: "Ваш [Concept('child', 'ребёнок')|E] должен:\n$BULLET_WITH_TAB$Исповедовать ту же [Concept('faith', 'конфессию')|E], что и вы\n$BULLET_WITH_TAB$Быть не младше #V 16#! лет\n$BULLET_WITH_TAB$Быть вашим [Concept('primary_heir', 'первым наследником')|E] или [Concept('favorite_child', 'любимым ребёнком')|E]\n$BULLET_WITH_TAB$Иметь [Concept('spiritual_fulfillment', 'духовную реализацию')|E] ниже #V 75#!\n$BULLET_WITH_TAB$Не получать в прошлом духовного наставления"
 pam_mentor_sp_decision_primary_heir_tt: "Ваш [Concept('primary_heir', 'первый наследник')|E] должен:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "Первый наследник"
 pam_mentor_sp_decision_primary_favorite_child_tt: "Ваш [Concept('favorite_child', 'любимый ребёнок')|E] должен:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "Любимый ребенок"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$Исповедовать ту же [Concept('faith', 'конфессию')|E], что и вы\n$BULLET_WITH_TAB$Быть не младше #V 16#! лет\n$BULLET_WITH_TAB$Иметь [Concept('spiritual_fulfillment', 'духовную реализацию')|E] ниже #V 75#!\n$BULLET_WITH_TAB$Не получать в прошлом духовного наставления"
 pam_decision_events.0003.t: "Самый важный урок"
 pam_decision_events.0003.desc.intro: "Наступила ночь, цитадель замерла. [Select_CString(target_child.IsFemale, 'Моя', 'Мой' )] [target_child.Custom('GetDaughterSon')|l] сидит подле меня в нашей личной молельне.\n\nЯ перевожу свой взгляд на [Select_CString(target_child.IsFemale, 'нее', 'него' )]."
 pam_decision_events.0003.desc.bad: "У [Select_CString(target_child.IsFemale, 'неё', 'него' )] тоска на лице, незаинтересованный взгляд, [Select_CString(target_child.IsFemale, 'она', 'он' )] того и гляди уснёт.\n\n«[ROOT.Char.GetMotherFather|U], — нетерпеливо спрашивает [target_child.GetSheHe], — зачем ты меня [Select_CString(ROOT.Char.IsFemale, 'вызвала', 'вызвал' )]?»"
 pam_decision_events.0003.desc.good: "[Select_CString(target_child.IsFemale, 'Её', 'Его' )] глаза ярко горят в свете свечей. [Select_CString(target_child.IsFemale, 'Она', 'Он' )] достойный человек.\n\n«[ROOT.Char.GetMotherFather|U], — спрашивает [Select_CString(target_child.IsFemale, 'она', 'он' )], — неужели я чем-то [Select_CString(target_child.IsFemale, 'провинилась', 'провинился' )] перед тобой?»"
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U][Select_CString(target_child.IsFemale, 'ая', 'ый' )]. И достаточно [Select_CString(target_child.IsFemale, 'взрослая', 'взрослый' )].\n\n«[ROOT.Char.GetMotherFather|U], — спрашивает [target_child.GetSheHe] мягким голосом, — как прожить праведную жизнь?»"
 pam_decision_events.0003.a: "[Select_CString(ROOT.Char.IsFemale, 'Прогнившая', 'Прогнивший' )] [ROOT.Char.GetTitleAsNameNoTooltip|l] отравит свою державу."
 pam_decision_events.0003.b: "Просто... Поступай хорошо."
 grudge_pressured_me_sp: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'затаили', Select_CString(CHARACTER.IsFemale, 'затаила', 'затаил' ))] обиду на [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))] в ответ на настойчивые вопросы о своей духовной реализации."
 grudge_pressured_me_sp_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'стали', Select_CString(CHARACTER.IsFemale, 'стала', 'стал' ))] объектом [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вашей обиды', Concatenate('обиды персонажа ', TARGET_CHARACTER.GetShortUIName))] после настойчивых вопросов о своей духовной реализации."
 pam_decision_events.0003.after_tt: "Вы можете лучше узнать, что за человек [target_child.GetFirstName]..."
 pam_decision_events.0003.secret: "[target_child.GetShortUIName] исповедуется вам"
 pam_decision_events.0003.mystic: "[target_child.GetShortUIName] проявляет существенный интерес к этому вопросу"
