 pam_evangelize_tenet_adopted_message_title: "[tenet_adopter.GetTitledFirstNameNoTooltip] принимает принцип «[pam_evangelize_tenet.GetNameNoTooltip(tenet_adopter.GetRite)]»"
 decision_every_clerical_region_ruler_evangelized_personal_tenet_tt: "Каждый обращённый [Concept('ruler', 'правитель')|E] в церковном округе [clerical_region.GetName] ([evangelized_clerical_region_rulers_count]):\n$BULLET_WITH_TAB$С вероятностью #V [actor.MakeScope.ScriptValue('pam_evangelize_tenet_adoption_chance_value')|0]%#! принимает принцип «[selected_item.GetNameNoTooltip(actor.GetRite)]» в качестве [Concept('personal_tenet', 'личного')|E]"
 pam_evangelize_tenet_adopt_personal_tenet_tt: "Принять принцип «[pam_evangelize_tenet.GetNameNoTooltip(actor.GetRite)]» в качестве [Concept('personal_tenet', 'личного')|E]"
 pam_decision_events.0020.t: "Проповедовать принцип «[selected_item.GetNameNoTooltip(actor.GetRite)]»"
 pam_decision_events.0020.desc: "После мессы в округе [clerical_region.GetName] вокруг меня собрались верующие, пожелавшие подробнее узнать, чему учит [ROOT.Char.GetFaith.HighGodName|U]. Мне показалось, что рассказ о течении «[selected_item.GetName( actor.GetRite )]», которого я придерживаюсь, лучше всего начать со следующей цитаты из книги «[ROOT.Char.GetFaith.ReligiousText|U]»:\n\n«[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]»"
 pam_decision_events.0020.a: "В оставшемся тексте я обращусь к другим лордам."
 pam_decision_events.0020.b: "Дальнейшую проповедь я посвящу своим вассалам."
 pam_decision_events.0020.c: "Раствориться в мудрости книги «[ROOT.Char.GetFaith.ReligiousText|U]»."
 pam_persecute_tenet_decision: "Осудить догмат"
 pam_persecute_tenet_decision_desc: "Не каждое учение достойно того, чтобы о нём вещали с кафедры. Я буду всеми правдами и неправдами очернять эту гадкую доктрину, дабы ни у кого не возникло желания её проповедовать."
 pam_persecute_tenet_decision_tooltip: "Оклеветать [Concept('known_tenet_status', 'известный')|E] вашей [Concept('faith', 'конфессии')|E] [Concept('core_tenet', 'догмат')|E], чтобы снизить его [Concept('tenet_popularity', 'популярность')|E]"
