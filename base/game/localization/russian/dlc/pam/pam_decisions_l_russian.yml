 pam_secure_pilgrim_routes_ai_pilgrimage_tt: "#weak В течение следующих #V 25 лет#!, [GetFaithByKey('catholic').GetAdjective]ие [Concept('rulers', 'правители')|E] будут чаще совершать [Concept('pilgrimages', 'паломничества')|E]#!"
