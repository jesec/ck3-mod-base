 pam_under_legatine_scrutiny_county_modifier_desc: "Папский легат проверяет местные власти и состояние дел в этом графстве"
 pam_decision_events.0008.t: "Собрать десятину"
 pam_decision_events.0008.desc.intro: "[ROOT.Char.GetFaith.HouseOfWorshipPlural|U] в моих владения сидят на полных сундуках. Стоит моей страже войти в храмы, как вскоре раздаётся звон монет.\n\n"
 pam_decision_events.0008.desc.chaplain: "«Неужто [ROOT.Char.GetTitleAsNameNoTooltip|l] получает удовольствие от унижения слуг [ROOT.Char.GetFaith.HighGodNamePossessive]? — возражает [chaplain.GetTitledFirstName]. — В радость ли вам раздевать жилища [ROOT.Char.GetFaith.HighGodHerHis|U] догола, словно #EMP грязную#! шлюху?»"
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] с отвращением отворачиваются. Слуги [ROOT.Char.GetFaith.HighGodNamePossessive] проявляют необычайный интерес к золоту."
 pam_decision_events.0008.a: "Разве щедрость не добродетель?"
 pam_kingdom_of_heaven_decision: "Провозгласить Царство Небесное"
 pam_kingdom_of_heaven_decision_desc: "Пробил час, и мы очутились на пороге Царства Божьего. Покайтесь — и верьте добрым вестям."
 pam_kingdom_of_heaven_decision_tooltip: "Стать [Concept('holder', 'владетелем')|E] нового [Concept('title', 'титула')|E] [Concept('hegemony', 'гегемонии')|E]"
 pam_kingdom_of_heaven_decision_confirm: "Царство близко"
 pam_kingdom_of_heaven_decision_situation_tt: "[Concept('the_christian_church', 'Христианская церковь')|E] находится на [Concept('the_christian_church_chapter_short', 'этапе')|E] #high крестового похода#!"
 pam_kingdom_of_heaven_decision_holy_sites_tt: "Вы контролируете хотя бы #V 3#! [Concept('holy_sites', 'святых места')|E] вашей [Concept('faith', 'конфессии')|E]"
 pam_kingdom_of_heaven_decision_piety_highest_tt: "Ваш [Concept('piety_level', 'уровень набожности')|E] самый высокий среди всех персонажей, придерживающихся вашей [Concept('faith', 'конфессии')|E]"
 pam_kingdom_of_heaven_decision_emperor_hooks_tt: "Отсутствуют независимые [Concept('ruler', 'правители')|E] вашей [Concept('faith', 'конфессии')|E] с титулом уровня [Concept('empire', 'империи')|E] либо каждый из них у вас [Concept('hook', '«на крючке»')|E]"
 pam_kingdom_of_heaven_decision_half_faith_tt: "Не менее половины всех [Concept('counties', 'графств')|E] в мире, придерживающихся вашей [Concept('faith', 'конфессии')|E], находится в пределах вашей [Concept('realm', 'державы')|E]"
 pam_kingdom_of_heaven_decision_hegemony_effect_tt: "Вы становитесь [Concept('holder', 'владетелем')|E] [Concept('hegemony', 'гегемонии')|E] «[GetTitleByKey('h_kingdom_of_heaven').GetName]»"
 pam_kingdom_of_heaven_decision_vassals_effect_tt: "[Concept('rulers', 'Правители')|E], придерживающиеся независимых [Concept('faith', 'конфессий')|E], могут присягнуть вам на верность. Вероятность зависит от их [Concept('piety_level', 'уровня набожности')|E], [Concept('opinion', 'мнения')|E] о вас, а также того, исповедуют ли они ваше [Concept('rite', 'течение')|E]"
 pam_kingdom_of_heaven_decision_subjugation_effect_tt: "Вам становится доступен [Concept('casus_belli', 'казус белли')|E] #high «$tribal_subjugation_cb$»#! против всех входящих в категорию «[THIS.Char.GetFaith.GetAdherentNamePlural|l]»"
 pam_kingdom_of_heaven_decision_de_jure_effect_tt: "[Concept('empires', 'Империи')|E], которыми вы [Concept('hold', 'владеете')|E], а также империи, не имеющие [Concept('holder', 'владетеля')|E], но находящиеся [Concept('completely_control', 'полностью под вашим контролем')|E], станут [Concept('de_jure', 'де-юре')|E] частью региона [GetTitleByKey('h_kingdom_of_heaven').GetName]"
 pam_kingdom_of_heaven_decision_jerusalem_tt: "[GetTitleByKey('c_jerusalem').GetName] входит в вашу [Concept('realm', 'державу')|E]"
 pam_kingdom_of_heaven_decision_hof_tt: "Вы — [Concept('head_of_faith', 'глава конфессии')|E]"
 pam_kingdom_of_heaven.0001.t: "Царство Небесное"
 pam_kingdom_of_heaven.0001.desc: "«Царство Божие подобно тому, как если человек бросит семя в землю, и спит, и встаёт ночью и днём; и как семя всходит и растёт, не знает он».\n\nТело моё отдано Христу. В пальцах у меня — горсть земли с берега реки Иордан.\n\n«Земля сама собою производит сперва зелень, — с этими словами я разжимаю ладонь, и налетевший ветер размётывает землю по воздуху. — Потом колос, — продолжаю я, указав на народ. — Потом полное зерно в колосе». Я поднимаю жезл.\n\n«Когда же созреет плод… немедленно посылает серп, потому что настала жатва»."
 pam_kingdom_of_heaven.0001.a: "Нет, я останусь там, где мне и место, а это — [previous_capital.GetNameNoTooltip]."
 pam_kingdom_of_heaven.0001.b: "Что есть кафедра Святого Петра в сравнении с сидением Христовым?"
 kingdom_of_heaven_lower_vassals_gained_tt: "[Concept('dukes', 'Герцоги')|E] и [Concept('counts', 'графы')|E] ([SCOPE.ScriptValue('kingdom_of_heaven_lower_vassals_gained_value')|V0] чел.) станут вашими [Concept('vassals', 'вассалами')|E]"
 kingdom_of_heaven_lower_de_jure_gained_tt: "[Concept('empires', 'Империи')|E], которыми вы владели, а также империи, не имевшие [Concept('holder', 'владетеля')|E], но находившиеся [Concept('completely_controlled', 'полностью под вашим контролем')|E], станут [Concept('de_jure', 'де-юре')|E] частью региона [GetTitleByKey('h_kingdom_of_heaven').GetName]"
 pam_kingdom_of_heaven_news_title: "Провозглашено Царство Небесное"
 pam_kingdom_of_heaven_news_tt: "[kingdom_of_heaven_founder.GetTitledFirstName] [Select_CString(kingdom_of_heaven_founder.IsFemale, 'провозгласила', 'провозгласил')] [GetTitleByKey('h_kingdom_of_heaven').GetName] и власть над верующими"
 pam_founded_kingdom_of_heaven_modifier: "Кровь Нового Иерусалима"
 pam_proclaim_living_word_decision: "Провозгласить Живое Слово"
 pam_proclaim_living_word_decision_desc: "Единоверцы шепчут, что мне особенно благоволит [ROOT.Char.GetFaith.HighGodName]. Паломники произносят моё имя у придорожных святилищ, [ROOT.Char.GetFaith.PriestNeuterPlural|l] цитируют мои рассуждения, словно заповеди.\n\nПусть же будет провозглашено с каждого алтаря, что через меня в мир приходит Живое Слово."
 pam_proclaim_living_word_decision_tooltip: "Станьте глашатаем своей [Concept('faith', 'веры')|E]"
 pam_proclaim_living_word_decision_confirm: "Пусть же Слово странствует по миру."
 pam_proclaim_living_word_decision_sf_tt: "Ваша [spiritual_fulfillment|El] не ниже, чем #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_proclaim_living_word_decision_archbishop_tt: "Вы [Concept('archbishop', 'архиепископ')|E]"
 pam_proclaim_living_word_decision_puppet_tt: "Одна из ваших [Concept('puppets', 'марионеток')|E] — [Concept('archbishop', 'архиепископ')|E] или выше"
 pam_proclaim_living_word_decision_realm_rite_tt: "Каждое [Concept('county', 'графство')|E] в вашей [Concept('realm', 'державе')|E] следует вашему [Concept('rite', 'течению')|E], и их как минимум #V 5#!"
 pam_proclaim_living_word_decision_effect_tt: "Вам будут доступны следующие варианты:\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_shepherd_of_the_faithful_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_fire_and_sword_modifier' ).GetNameWithTooltip]"
 pam_decision_events.0021.t: "Живое Слово"
 pam_decision_events.0021.desc: "[ROOT.Char.Custom('GetFaithTemple')] полнится народом так, что яблоку негде упасть. Паломники и [ROOT.Char.GetFaith.PriestNeuterPlural|l], бароны и нищие — все стоят плечом к плечу, и всё равно кто-то остаётся за дверями.\n\nМои деяния сосчитаны так, что и не снилось хроникёрам — каждый пройдённый путь, каждое выдержанное бдение, каждая монета, пожертвованная во имя [ROOT.Char.GetFaith.HighGodNamePossessive]. Священнослужитель берёт мою руку и прижимает её к алтарю [ROOT.Char.GetFaith.HighGodNamePossessive]: «Говори, а мы будем слушать».\n\nВоцаряется тишина — все готовы внимать. То, что я скажу, выйдет далеко за пределы этих стен."
 pam_decision_events.0021.a: "Я стану проповедовать милость."
 pam_decision_events.0021.b: "Я понесу Слово огнём и мечом."
 pam_herald_shepherd_of_the_faithful_modifier: "Пастырь верных"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Этот персонаж объявил о своём священном призвании словами милосердия, за что заслужил обожание единоверцев."
 pam_herald_fire_and_sword_modifier: "Огнём и мечом"
 pam_herald_fire_and_sword_modifier_desc: "Этот персонаж объявил о своём священном предназначении, призвав единоверцев к оружию — и недостатка в желающих нет."
 pam_convert_to_theocracy_decision: "Установить теократическую власть"
 pam_convert_to_theocracy_decision_desc: "Сложившееся нынешнее чиноначалие — попрание тех наказов, что достались нам от [ROOT.Char.GetFaith.GoodGodNamePossessive]. Мне открыт единственно верный путь — на нём возможно и возносить хвалу Создателю, и выполнять свой долг перед народом. Этого желает [ROOT.Char.GetFaith.GoodGodName]."
 pam_convert_to_theocracy_decision_confirm: "Взять на себя власть от имени [ROOT.Char.GetFaith.HighGodNamePossessive|U]"
 pam_convert_to_theocracy_decision_tooltip: "Сменить [Concept('government', 'форму правления')|E] на [Concept('theocracy', 'теократию')|E]"
 pam_convert_theocracy_to_feudal_decision: "Восстановить светскую власть"
 pam_convert_theocracy_to_feudal_decision_desc: "Поскольку считается, что я лучше других умею толковать закон [ROOT.Char.GetFaith.HighGodNamePossessive|U], за духовным наставничеством [ROOT.Char.GetFaith.GetAdherentNamePlural|l] обращаются именно ко мне. Увы, на самом деле эта задача мне не по силам; вместо меня ей занимается [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l].\n\nМне же хорошо даются светские вопросы, а значит, пора примерить на себя корону мирского правителя! Пусть народ знает, что власть принадлежит мне; ни [ROOT.Char.GetFaith.PriestNeuterPlural|l], ни даже [ROOT.Char.GetFaith.HighGodName] мне не указ."
 pam_convert_theocracy_to_feudal_decision_tooltip: "Превратить [Concept('realm', 'державу')|E] из [Concept('theocracy', 'теократической')|E] в [Concept('feudal', 'феодальную')|E]"
 pam_convert_theocracy_to_feudal_decision_confirm: "Вернуть державу смертным"
 religious_head_is_not_ecclesiastical: "[Concept('head_of_faith', 'Глава конфессии')|E] — #bold не#! [Concept('ecclesiastical_government', 'церковник')|E]"
 different_rite_than_hof: "Ваше [Concept('rite', 'течение')|E] на [ROOT.Char.GetFaith.GetHeresyThreshold|-0] или более ед. [Concept('rite_divergent', 'отдалено')|E] от [Concept('rite', 'течения')|E] [Concept('head_of_faith_possessive', 'главы конфессии')|E]"
 pam_decision_events.0009.t: "Священная власть"
 pam_decision_events.0009.desc: "В моих руках сияет [ROOT.Char.Custom('ReligiousHeadHeadgear')|l]. Полюбовавшись немного на этот прекрасный убор, я водружаю его на голову и выхожу к народу; собравшиеся [ROOT.Char.GetFaith.GetAdherentNamePlural|l] готовы внимать каждому моему слову.\n\n«Когда-то мы не мыслили себе жизни без ленов и грамот, однако же путь этот ложен: он уводит нас прочь от истины. Отныне только [ROOT.Char.GetFaith.HighGodName] будет указывать нам, по какому закону станет жить [ROOT.Char.GetPrimaryTitle.GetNameNoTier|l]. Каждый из нас, даже я, — всего лишь скромный раб [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 pam_decision_events.0009.a: "[ROOT.Char.Custom('GetFaithTemple')|U] владения [new_capital.GetNameNoTierNoTooltip] — новая столица!"
 church_holding_as_new_capital: "Сделать владение [new_capital.GetName] [Concept('realm_capital', 'столицей державы')|E]"
 pam_decision_events.0009.b: "Этого желает [ROOT.Char.GetFaith.HighGodName]."
 pam_decision_events.0009.liege_msg_title: "Установлена теократия"
 pam_decision_events.0009.liege_msg_desc: "[ROOT.Char.GetShortUIName] [Select_CString(ROOT.Char.IsFemale, 'установила', 'установил')] в своей державе [Concept('theocracy', 'теократию')|E]."
 pam_decision_events.0010.opening: "[theocratic_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_decision_events.0010.desc: "Твоим землям предписано вступить на священный путь, которым уже иду я, и устроить власть так, чтобы это было угодно Божьему замыслу. Этого желает [theocratic_ruler.GetFaith.GoodGodNames]."
 pam_decision_events.0010.a: "Ясно."
 pam_decision_events.0010.b: "Я не стану менять устройство правительства."
