 pam_decision_events.0019.t: "Защита паломников"
 pam_decision_events.0019.desc: "Все [ROOT.Char.GetFaith.GetAdherentNamePlural] должны получить моё послание:\n\n«Дороги к святым местам стали опасны. Знайте же, что отныне верующие вправе совершать паломничество с оружием и защищаться от каждого, кто встанет на их пути к Раю»."
 pam_decision_events.0019.a: "Господи, укрепи силу рук наших."
 pam_decision_events.0018.opening: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] всего мира! Да будет известно,"
 pam_decision_events.0018.desc.armed_pilgrimages: "Решение скреплено моей печатью. Отныне догмат «[GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )|l]» будет одним из основополагающих принципов #L [hof_scope.GetFaith.GetName|l]ой#! конфессии.\n\nПусть каждый правитель нашей веры примет это к сведению."
 pam_decision_events.0018.desc.struggle_submission: "Решение скреплено моей печатью. Отныне догмат «[GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )|l]» будут одним из основополагающих принципов #L [hof_scope.GetFaith.GetName|l]ой#! конфессии.\n\nПусть каждый правитель нашей веры примет это к сведению."
 pam_decision_events.0018.a: "Да будет так."
 pam_decision_events.0017.t: "Воздвигнуть хачкар в честь предков"
 pam_decision_events.0017.desc: "Выбранная мной возвышенность во владении [khachkar_location.GetNameNoTier] идеально подходит для воздвижения каменного креста.\n\nЯ повелю лучшим резчикам по камню изваять шедевр, достойный памяти такого великого человека, как [khachkar_ancestor.GetTitledFirstNameNicknamed]. Это будет крест, украшенный цветами, орнаментами и надписями, повествующими о том, сколь [Select_CString(khachkar_ancestor.IsFemale, 'славной была моя', 'славным был мой')] [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)].\n\nПаломники будут возносить у него молитвы, а всем остальным он напомнит, что мы — законные правители этой земли."
 pam_decision_events.0017.a: "Пусть этот крест простоит века."
 pam_decision_events.0017.b: "Сейчас не время."
 declare_antipope_decision: "Провозгласить понтифика антипапой"
 declare_antipope_decision_desc: "[ROOT.Char.GetRite.GetAdherentNamePlural|U] считают, что [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetName] больше не вправе стоять во главе паствы. Мною будет поставлен новый  [ROOT.Char.GetFaith.ReligiousHeadName|U], отвечающий перед нашей традицией — и лично передо мной."
