 pam_persecute_tenet_decision_toast_tt: "Теперь [Concept('tenet_popularity', 'популярность догмата')|E] находится на уровне «[GuiScope.SetRoot( pam_tenet_persecutor.MakeScope ).AddScope( 'second', pam_persecute_tenet.MakeScope ).Custom( 'pam_tenet_popularity_status' )]»(#high [pam_tenet_persecutor.GetFaith.GetTenetPopularityScore( pam_persecute_tenet.Self )]#!)"
