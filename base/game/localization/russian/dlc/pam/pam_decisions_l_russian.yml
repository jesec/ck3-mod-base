 pam_declare_rite_heresy_decision: "Объявить течение ересью"
 pam_declare_rite_heresy_decision_desc: "Течение, слишком далеко отступившее от истинного пути, следует называть соответствующе.\n\nЯ объявлю его ересью, чтобы верующие знали, чего следует избегать."
 pam_declare_rite_heresy_decision_tooltip: "Выбрать инообрядческое [Concept('rite', 'течение')|E] #L [ROOT.Char.GetFaith.GetAdjective]ой#! религии и объявить его [Concept('heresy', 'ересью')|E]"
 pam_declare_rite_heresy_decision_confirm: "Объявить осуждение"
 pam_declare_rite_heresy_decision_valid_tt: "Должно существовать другое [Concept('rite', 'течение')|E] той же [Concept('faith', 'конфессии')|E], чьё [Concept('rite_divergence', 'отличие')|E] от основного [Concept('rite', 'течения')|E] превышает #V [THIS.ScriptValue('faith_heresy_threshold')|0V]#! ед."
 pam_declare_rite_heresy_decision_valid_zealous_tt: "Должно существовать другое [Concept('rite', 'течение')|E] той же [Concept('faith', 'конфессии')|E], чьё [Concept('rite_divergence', 'отличие')|E] от основного [Concept('rite', 'течения')|E] превышает #V [THIS.ScriptValue('faith_heresy_threshold_times_4_over_5')|0V]#! ед."
 pam_declare_rite_heresy_bull_decision_desc: "Течение, слишком далеко отступившее от истинного пути, следует называть соответствующе.\n\nБудет издана [Concept('papal_bull', 'папская булла')|E], объявляющая его ересью."
