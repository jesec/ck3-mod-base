 pam_unite_miaphysite_churches_decision: "Объединить миафизитские церкви"
 pam_unite_miaphysite_churches_decision_desc: "Несмотря на общую веру, миафизитские церкви уже многие годы живут разрозненно, поскольку в каждой из них главенствует свой иерарх. Впрочем, если эти духовные начальники наконец придут к согласию, то у верующих больше не будет преград на пути к единству."
