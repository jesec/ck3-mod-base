 pam_tenet_stance_can_be_permitted_tt: "Уже считается [Concept('permitted_tenet_status', 'разрешённым')|E] или [Concept('core_tenet_status', 'основным')|E] в вашей [Concept('faith', 'конфессии')|E]"
 pam_tenet_stance_can_be_prohibited_tt: "Уже считается [Concept('prohibited_tenet_status', 'запретным')|E] или [Concept('core_tenet_status', 'основным')|E] в вашей [Concept('faith', 'конфессии')|E]"
 # HoF Tenet Stance — Permit a Tenet decision
 pam_permit_tenet_decision: "Разрешить догмат"
 pam_permit_tenet_decision_desc: "Учение, о котором до нынешнего дня было принято говорить исключительно шёпотом, заслуживает всяческого одобрения. Мы распространим благословение [ROOT.Char.GetFaith.HighGodNamePossessive|U] на [Concept('core_tenet', 'догмат')|E] и сделаем его [Concept('permitted_tenet_status', 'разрешённым')|E]."
 pam_permit_tenet_decision_tooltip: "Одобрить [Concept('permitted_tenet_status', 'разрешение')|E] [Concept('core_tenet', 'догмата')|E] в #L [ROOT.Char.GetFaith.GetName|l]ой#! вере и объявить об этом каждому правителю той же конфессии."
 pam_permit_tenet_decision_confirm: "Распространить благословение [ROOT.Char.GetFaith.HighGodNamePossessive|U]"
 pam_permit_tenet_decision_no_item_selected: "Не выбран [Concept('core_tenet', 'догмат')|E]"
 # HoF Tenet Stance — Forbid a Tenet decision
 pam_prohibit_tenet_decision: "Запретить догмат"
 pam_prohibit_tenet_decision_desc: "Учение, уводящее своих последователей с истинного пути, необходимо называть своим именем. Мы объявим [Concept('core_tenet', 'догмат')|E] [Concept('prohibited_tenet_status', 'запретным')|E], чтобы верующие могли избегать его."
 pam_prohibit_tenet_decision_tooltip: "Обозначить [Concept('core_tenet', 'догмат')|E] как [Concept('prohibited_tenet_status', 'запретный')|E] в #L [ROOT.Char.GetFaith.GetName|l]ой#! вере и объявить об этом каждому правителю той же конфессии."
