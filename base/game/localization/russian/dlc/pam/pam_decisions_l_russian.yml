 pam_antipope_events.0001.desc.intro: "Сторонники течения «[ROOT.Char.GetRite.GetName]» заполнили [ROOT.Char.GetFaith.HouseOfWorship|U].\n\n"
 pam_antipope_events.0001.desc.self: "Я возношу руку к небу. Скоро [pope.GetTitledFirstName] лишится своей незаконной власти, а [Select_CString(pope.IsFemale, 'её', 'его')] обманутую паству возглавлю я."
 pam_antipope_events.0001.desc.sponsor: "«Пусть глашатаи возвестят, что #EMP я#! — [Select_CString(antipope.IsFemale, 'истинная', 'истинный')]  [ROOT.Char.GetFaith.ReligiousHeadName|U]! — ревёт [antipope.GetTitledFirstName]. — Пусть все узнают, что [Select_CString(pope.IsFemale, 'самозванка', 'самозванец')] [pope.GetTitledFirstName] прячется в подвале своего дворца в далёком городе [pope_capital.GetName], а [Select_CString(pope.IsFemale, 'её', 'его')] стадо пропадает без пастыря!»\n\nПотом [Select_CString(antipope.IsFemale, 'она', 'он')] поворачивается ко мне: «Но не бойтесь. [Select_CString(ROOT.Char.IsFemale, 'Благочестивая', 'Благочестивый')] [ROOT.Char.GetTitledFirstName] положит конец вашим горестям — и я вместе с [Select_CString(ROOT.Char.IsFemale, 'ней', 'ним')]»."
 pam_antipope_events.0001.a: "Пусть [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] содрогнётся."
 pam_antipope_events.0002.opening: "О [ROOT.Char.GetFaith.GetNameNoTooltip|l]ий [ROOT.Char.GetTitledFirstNameNoTooltip]!"
 pam_antipope_events.0002.desc.challenger_sponsor: "Знай, что я, [sponsor.GetTitledFirstName], [Select_CString(sponsor.IsFemale, 'возвысила', 'возвысил')] нового пастыря верных по имени [antipope.GetTitledFirstName]."
 pam_antipope_events.0002.desc.antipope_self: "Знай, что я, [sponsor.GetTitledFirstName], буду новым пастырем верных"
 pam_antipope_events.0002.desc.outro: "[Select_CString(antipope.IsFemale, 'Эта', 'Этот')] [ROOT.Char.GetFaith.ReligiousHeadName|U] восстанет против [Select_CString(pope.IsFemale, 'самозванки', 'самозванца')] по имени [pope.GetTitledFirstName] и будет править течением «[antipope.GetRite.GetName]» согласно нашей традиции."
