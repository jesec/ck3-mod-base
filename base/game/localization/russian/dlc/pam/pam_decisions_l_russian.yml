 newly_exclaved_duchies_decision: "Держава и герцогства-эксклавы"
 newly_exclaved_duchies_tooltip: "Помимо собственных [Concept('duchies', 'герцогств')|E] [Concept('realm', 'державы')|E], ваше новое [Concept('kingdom', 'королевство')|E] [Concept('de_jure', 'де-юре')|E] заявит права на герцогства, ставшие эксклавами при его создании. К ним относятся нестоличные герцогства, утратившие общие границы с другими герцогствами своих королевств."
