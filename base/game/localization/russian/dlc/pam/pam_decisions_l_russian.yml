 pam_determine_patron_saint_decision_desc: "Восседая на своих небесных тронах, святые наблюдают за тяготами смертных владык и оценивают наш душевный нрав.\n\nЯ могу выбрать покровителя, добродетель которого определит мой путь, а его заступничество укрепит мою власть в глазах [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] и людей."
 pam_determine_patron_saint_decision_tooltip: "Выбрать покровителя, чьи добродетели станут вам примером"
