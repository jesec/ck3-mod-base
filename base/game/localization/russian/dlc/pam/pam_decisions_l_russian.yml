 pam_secure_pilgrim_routes_incompatible_tenet_tt: "[Concept('core_tenet', 'Догмат')|E] «Пацифизм» несовместим с догматом «[GetTenetType('tenet_armed_pilgrimages').GetBaseName]», поэтому его сначала необходимо заменить на другой"
 pam_secure_pilgrim_routes_decision_remove_tenet_tt: "Течение «[GetPlayer.GetRite.GetName]» больше не считает определённые [Concept('core_tenet', 'догматы')|E] основными"
