 pam_mend_great_schism_decision: "Искоренить Великий раскол дипломатически"
 pam_mend_great_schism_decision_desc: "Нарушение старого союза было ошибкой. Христианский мир должен быть воссоединён! Если склонить влиятельных духовных деятелей на свою сторону, мы непременно вернём старый порядок."
 pam_mend_great_schism_decision_tooltip: "Помирить христианский мир, собрав все [Concept('rites', 'течения')|E] под крылом #L [ROOT.Char.GetFaith.GetName|l]ой#! [Concept('faith', 'веры')|E]"
 pam_mend_great_schism_decision_confirm: "Пусть вернётся старый порядок"
 pam_prevent_great_schism_rite_leader_tt: "Как минимум #V 1#! [Concept('head_of_rite', 'лидер')|E] другого [Concept('rite', 'течения')|E] вашей [Concept('faith', 'конфессии')|E], насчитывающего не менее #V 10#! [Concept('counties', 'графств')|E]-последователей, либо находится у вас [Concept('hooked', 'на крючке')|E], либо вас связывает [Concept('friend', 'дружба')|E] или [Concept('lover', 'любовные отношения')|E]"
 pam_prevent_great_schism_orthodox_hof_tt: "#L [GetFaithByKey('orthodox').GetName]ий#! [Concept('head_of_faith', 'глава конфессии')|E] либо находится у вас [Concept('hooked', 'на крючке')|E], либо является вашей [Concept('puppet', 'марионеткой')|E], либо вас связывает [Concept('friend', 'дружба')|E] или [Concept('lover', 'любовные отношения')|E] #weak ([GetFaithByKey('orthodox').GetReligiousHead.GetShortUIName])#!"
