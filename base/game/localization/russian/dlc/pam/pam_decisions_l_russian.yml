 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] далеко и совершенно не годится на роль главы такой конфессии, как [ROOT.Char.GetFaith.GetName]. Несмотря на всю учёность, которой [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] кичится, [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] попросту не #EMP понимает#! многих тонких истин [ROOT.Char.GetFaith.GetAdjective|l]ой мысли.\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] этого не понимает, зато #EMP я#! понимаю..."
