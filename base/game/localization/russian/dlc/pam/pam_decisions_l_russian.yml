 pam_bull_events.0004.opening: "[ROOT.GetCharacter.GetFaith.GetNameNoTooltip]ий [ROOT.GetCharacter.GetTitledFirstNameNoTooltip]"
 pam_bull_events.0004.desc.crusade: "Я призываю всех вас выйти против неверных, чья земля — [title.GetName]."
 pam_bull_events.0004.desc.heresy: "Да будет известно всякому, что течение, носящее название «[heresy_rite.GetName]», предаётся отныне анафеме, а последователи его объявляются еретиками."
 pam_bull_events.0004.desc.tenet_permitted: "«Те из вас, кто верует в догмат, что носит название „[tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l]“, могут спать спокойно, ибо теперь [bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip] его разрешает»."
 pam_bull_events.0004.desc.tenet_forbidden: "«Доктрине под названием „[tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l]“ больше нет места в наших домах. Всякий, кто исповедует её, нарушает святость церкви и совершает смертный грех»."
