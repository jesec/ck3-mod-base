 pam_rite_heresy_no_antipope_tt: "Среди последователей не должно быть [Concept('challenger_hof', 'соперничающего главы конфессии')|E] и его сторонников"
 pam_rite_heresy_divergence_tt: "[Concept('rite_divergence', 'Отличие')|E] от основного [Concept('rite', 'течения')|E] должно превышать [THIS.ScriptValue('faith_heresy_threshold')|0V] ед."
