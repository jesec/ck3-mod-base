 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "Вы [Concept('head_of_rite', 'возглавляете течение')|E], которое исповедует [recipient.GetShortUIName], но не [Select_CString(recipient.IsFemale, 'её', 'его')] [Concept('liege', 'сюзерен')|E]"
 pam_personal_sacrifice_of_wealth_decision: "Пожертвовать богатство"
 pam_personal_sacrifice_of_wealth_decision_desc: "Предложить часть своего богатства на благочестивые цели и посодействовать развитию графства под вашим покровительством."
 pam_personal_sacrifice_of_wealth_decision_tooltip: "Потратить [Concept('gold', 'золото')|E], чтобы увеличить [Concept('development_growth', 'прирост развития')|E] выбранного [Concept('county', 'графства')|E] и получить [Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 pam_personal_sacrifice_of_wealth_decision_confirm: "Сделать подношение"
 pam_personal_sacrifice_of_wealth_decision_toast: "Совершено благочестивое пожертвование"
 pam_develop_clerical_court_decision: "Обучить свой церковный двор"
 pam_develop_clerical_court_decision_desc_christian: "Бездействующие служащие — плохие слуги [ROOT.Char.GetFaith.HighGodNamePossessive]. Позвольте мне собрать двор, чтобы рукоположить достойных, обучить рукоположенных и пригласить послушников к своим воротам."
 pam_develop_clerical_court_decision_desc: "Бездействующие служащие не увеличивают славу [ROOT.Char.GetFaith.HighGodNamePossessive]. Позвольте мне собрать двор, чтобы возвести достойных в ряды [Concept('clergy', 'духовенства')|E], обучить служителей и пригласить послушников к своим воротам."
 pam_develop_clerical_court_decision_tooltip: "Рукоположить, обучить или нанять [Concept('clergy', 'духовенство')|E] для вашего двора"
 pam_develop_clerical_court_decision_confirm: "Созвать двор"
 pam_develop_clerical_court_decision_tt: "Вы созываете свой двор и выбираете #EMP одно#! из перечисленного:\n$EFFECT_LIST_BULLET$ До [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] мирских [Concept('courtiers', 'придворных')|E] присоединятся к [Concept('clergy', 'духовенству')|E], и за каждого вы получите дополнительное [piety_i][Concept('piety', 'благочестие')|E]\n$EFFECT_LIST_BULLET$ До [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] придворных членов [Concept('clergy', 'духовенства')|E] получат прибавку к [learning_i][Concept('learning', 'учёности')|E] и [Concept('trait', 'свойство')|E] / [Concept('trait_level_track_xp', 'опыт свойства')|E] «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]» или «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]»\n$EFFECT_LIST_BULLET$ До [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] послушников из окрестных земель присоединятся к вашему двору и [Concept('clergy', 'духовенству')|E]\n\nНезависимо от выбранного пути вы получите [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][Concept('piety', 'благочестия')|E]\n\n#weak Размер награды зависит от ваших [Concept('learning', 'учености')|E], [Concept('piety_level', 'уровня набожности')|E] и религиозных [Concept('traits', 'свойств')|E]. Иногда может выпасть редкая возможность#!"
 pam_develop_clerical_court_decision_candidates_tt: "У вас есть [Concept('courtier', 'придворный')|E], которого можно рукоположить или обучить, либо рядом проживает достойный кандидат"
 pam_clerical_court_joins_clergy_tt: "Вступает в ряды #L [pam_clerical_patron.GetFaith.GetName|l]ого#! [Concept('clergy', 'духовенства')|E]"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName] вступает в ряды духовенства"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName] становится мудрее"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName] отвечает на зов"
 pam_oblate_patron_reason: "Знаменитый покровитель неофитов"
 pam_oblate_patron_modifier: "Покровитель неофитов"
 pam_oblate_patron_modifier_desc: "Этот персонаж известен поддержкой призванных на религиозную службу. Обеты становятся дешевле, а родители более охотно расстаются со своими детьми."
 pam_scriptorium_modifier: "Зал писцов"
 pam_scriptorium_modifier_desc: "Этот персонаж содержит зал писцов, чья работа привлекает в столицу образованных людей."
 pam_decision_events.0032.t: "Забота о пастве"
 pam_decision_events.0032.desc.intro.christian: "Я обращаюсь к служителям и духовенству моего дома, оценивая, кого стоит рукоположить, а кому не хватает наставлений."
 pam_decision_events.0032.desc.intro: "Я обращаюсь к #L [ROOT.Char.GetFaith.GetName|l]им#! служителям при своём дворе: кто поступит на службу, а кому требуются наставления?"
 pam_decision_events.0032.desc.pupil: "\n\n[Select_CString(pam_clerical_pupil.IsFemale, 'Моя ученица', 'Мой ученик' )] [pam_clerical_pupil.GetFirstName] возносит молитву, желая проявить себя."
 pam_decision_events.0032.desc.no_pupil: "\n\nОчень немногие из них пошли на службу вере, и я хочу исправить это."
 pam_decision_events.0032.desc.novice: "\n\nЗа пределами моих стен [Select_CString(pam_clerical_pupil.IsFemale, 'подающая надежды незнакомка', 'подающий надежды незнакомец' )] по имени [pam_clerical_novice.GetFirstName] умоляет дать [Select_CString(pam_clerical_pupil.IsFemale, 'ему', 'ей' )] место, чтобы послужить вере."
 pam_decision_events.0032.desc.outro.christian: "\n\nКак мне позаботиться о пастве, вверенной мне по воле [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_decision_events.0032.desc.outro: "\n\nКак мне возвысить вверенных мне по воле [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 pam_decision_events.0032.prodigy: "[Select_CString(pam_clerical_pupil.IsFemale, 'Моя ученица', 'Мой ученик' )] обладает божественным даром!"
 pam_decision_events.0032.oblates: "Пусть все знают, что я привечаю всякого, кто жаждет служить."
 pam_decision_events.0032.piety: "Их набожность укрепляет мою."
 pam_decision_events.0032.novice: "Многообещающая душа — немедленно впустить."
 pam_decision_events.0032.miracle: "Говорят, [Select_CString(pam_clerical_pupil.IsFemale, 'моя ученица', 'мой ученик' )] творит чудеса."
 pam_decision_events.0032.relic.christian: "Этот священных текст должен находиться в моей сокровищнице!"
 pam_decision_events.0032.relic: "Пусть эти писания обогатят мой двор."
 pam_decision_events.0032.language: "Отправить ученика изучить священные тексты."
 pam_decision_events.0032.scriptorium.christian: "Пусть каждое перо скриптория принимается за работу."
 pam_decision_events.0032.scriptorium: "Пусть каждый писарь при моём дворе принимается за работу."
 pam_decision_events.0032.a.christian: "Рукоположить самых достойных при моём дворе."
 pam_decision_events.0032.a: "Возвести самых достойных при моём дворе на службу вере."
 pam_decision_events.0032.a.tt: "До [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] ваших самых учёных светских [Concept('courtiers', 'придворных')|E] #weak (включая родственников)#!:\n$EFFECT_LIST_BULLET$ Вступят в ряды #L [pam_clerical_patron.GetFaith.GetName|l]ого#! [Concept('clergy', 'духовенства')|E]\n$EFFECT_LIST_BULLET$ Получат прибавку к [learning_i][Concept('learning', 'учёности')|E] и [Concept('opinion', 'мнению')|E] о вас\n$EFFECT_LIST_BULLET$ Увеличат ваше [piety_i][Concept('piety', 'благочестие')|E]"
 pam_decision_events.0032.b: "Обучить духовенство, уже находящееся на моём попечении."
 pam_decision_events.0032.b.tt: "До [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] самых учёных представителей вашего придворного [Concept('clergy', 'духовенства')|E]:\n$EFFECT_LIST_BULLET$ Получат прибавку к [learning_i][Concept('learning', 'учёности')|E] #weak ([pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Получат или разовьют [Concept('trait', 'свойство')|E] «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]» или «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]»"
 pam_decision_events.0032.c.named: "[pam_clerical_novice.GetFirstNameNoTooltip] обретёт новый дом, и пусть все знают, что я привечаю послушников."
 pam_decision_events.0032.c: "Пусть все знают, что я привечаю послушников."
 pam_decision_events.0032.c.tt: "До [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] послушников из окрестных земель:\n$EFFECT_LIST_BULLET$ Присоединятся к вашему двору в качестве #L [pam_clerical_patron.GetFaith.GetName|l]ого#! [Concept('clergy', 'духовенства')|E]\n$EFFECT_LIST_BULLET$ Обратятся в ваше [Concept('rite', 'течение')|E]"
 pam_seize_capital_clerical_region_decision: "Захватить церковный округ"
 pam_seize_capital_clerical_region_decision_desc: "Моя столица лежит в пределах [Concept('clerical_region', 'церковного округа')|E], которым я не владею. Ни один [Concept('archbishop', 'архиепископ')|E] не должен верховенствовать над кафедрой, с которой я правлю: этот [Concept('title', 'титул')|E] принадлежит лишь [Concept('head_of_faith', 'главе конфессии')|E]."
 pam_seize_capital_clerical_region_decision_tooltip: "Захватить [Concept('clerical_region', 'церковный округ')|E], к которому относится ваша столица, и свергнуть местного [Concept('archbishop', 'архиепископа')|E], если его кафедра не пустует"
 pam_seize_capital_clerical_region_decision_confirm: "Захватить кафедру"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName] [Select_CString(pam_deposed_archbishop.IsFemale, 'свергнута', 'свергнут' )]"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName] отходит вам"
