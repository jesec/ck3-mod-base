 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "Новый святой"
 pam_saint_events.0003.t_va: "Новый [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_saint_events.0003.desc_saint: "Дело сделано. [saint_candidate.GetFirstName] [Select_CString(saint_candidate.IsFemale, 'причислена', 'причислен')] к лику святых, почитаемых в провинции [consecration_province.GetName]. [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip|U] будут молить [Select_CString(saint_candidate.IsFemale, 'её', 'его')] о благословении."
 pam_saint_events.0003.desc_va: "Дело сделано. [saint_candidate.Custom('PamBlessedOnesOrAncestors')|U] приняли в свои ряды нового кандидата по имени [saint_candidate.GetFirstName]. [Select_CString(saint_candidate.IsFemale, 'Её', 'Его')] останки, [saint_candidate.Custom('PamConsecratedEnshrined')]ые в провинции [consecration_province.GetName], стали объектом поклонения. Пусть [Select_CString(saint_candidate.IsFemale, 'её', 'его')] свет озаряет дорогу многим поколениям наших потомков."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Deo gratias."
 pam_saint_events.0003.a_va: "Мы благодарны."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Члены вашей [Concept('dynasty', 'династии')|E], исповедующие вашу [Concept('faith', 'конфессию')|E], получают #P 20#! ед. [Concept('opinion', 'мнения')|E] о вас на 20 лет"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "В канонизации отказано"
 pam_saint_events.0004.t_va: "В почитании отказано"
 pam_saint_events.0004.desc: "[petition_recipient.GetTitledFirstName|U] [Select_CString(petition_recipient.IsFemale, 'отклонила', 'отклонил')] просьбу [GetPlayer.Custom('PamCanonizeVenerateVerb')] [Select_CString(saint_candidate.IsFemale, 'нашу родственницу', 'нашего родственника')] по имени [saint_candidate.GetFirstName]. В этот раз [GetPlayer.Custom('PamBlessedOnesOrAncestors')|l] не примут [Select_CString(saint_candidate.IsFemale, 'её', 'его')] в свои ряды."
 pam_saint_events.0004.a: "Да будет так."
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "Реликварий готов"
 pam_saint_events.0005.desc: "[extract_site.GetName|U] готовится к торжественному событию: скоро [relic_saint.GetShortUIName], чьи благословенные мощи покоятся здесь, дарует нам священную реликвию.\n\nЦеремония её обретения будет сопровождаться пышными торжествами."
 pam_saint_events.0005.a: "Пусть всё свершится с должным почтением."
 pam_saint_events.0005.a.tt: "Скоро [extract_site.GetName], где покоится [relic_saint.GetShortUIName], дарует нам новую священную [Concept('artifact', 'реликвию')|E]."
 # The relic is drawn
 pam_saint_events.0006.t: "Священная реликвия"
 pam_saint_events.0006.desc_relic: "[extract_site.GetName|U] — место, прославленное [GetPlayer.Custom('PamConsecratedEnshrined')]ыми мощами такого столпа веры, как [relic_saint.GetFirstName]. Сегодня мы извлекли из этих мощей священную реликвию, именуемую #EMP [relic_artifact.GetName]#!. Пусть она во веки веков благословляет верующих моей державы."
 pam_saint_events.0006.desc: "[extract_site.GetName|U] — место, прославленное [GetPlayer.Custom('PamConsecratedEnshrined')]ыми мощами такого столпа веры, как [relic_saint.GetFirstName]. Сегодня мы обрели там священную [Concept('artifact','реликвию')|E], которая станет благословением для нашей державы."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "Gloria Deo!"
 pam_saint_events.0006.a_va: "Мы благодарны."
 pam_saint_events.0006.a.tt: "Реликвия, именуемая «[relic_artifact.GetName]», отныне хранится у вас."
 pam_dulia_relic_dynasty_prestige_tt: "Согласно догмату «[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]»:"
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "Согласно догмату «[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]», все [Concept('ruler', 'правители')|E] вашей [Concept('faith', 'конфессии')|E] получают модификатор «$pam_dulia_new_saint_modifier$» на #EMP 5#! лет"
 pam_dulia_new_saint_message_t: "Новый посредник"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.GetTitledFirstName|U] [Select_CString(pam_new_saint.IsFemale, 'причислена', 'причислен')] к лику святых. Верующие [pam_new_saint.GetFaith.GetAdjective]ого исповедания обрели [Select_CString(pam_new_saint.IsFemale, 'новую заступницу', 'нового заступника')] перед Богом."
 # Relic benefit requirement (can_benefit on pam_saint_relic_template).
 pam_saint_relic_benefit_faith_tt: "У владетеля та же [Concept('religion', 'религия')|E], что и у [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Concatenate('персонажа ', CHARACTER.GetShortUIName))]"
