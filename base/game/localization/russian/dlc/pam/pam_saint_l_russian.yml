 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "Изящный реликварий, в котором хранится святой перст, извлечённый из благословенных останков [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_desc: "Изящный реликварий, в котором хранится святой зуб, извлечённый из благословенных останков [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_desc: "Изящный реликварий, в котором хранится священное ребро, извлечённое из благословенных останков [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hair_desc: "Изящный реликварий, в котором хранится святой локон [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_vestment_desc: "Изящный реликварий, в котором хранится фрагмент одеяний, принадлежавших [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hand_desc: "Изящный реликварий, в котором хранится святая длань, извлечённая из благословенных останков [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_arm_desc: "Изящный реликварий, в котором хранится святая рука, извлечённая из благословенных останков [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_desc: "Изящный реликварий, в котором хранится благословенный череп [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_blood_desc: "Изящный реликварий, в котором хранится флакон со святой кровью [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_heart_desc: "Изящный реликварий, в котором хранится святое сердце [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_effigy_desc: "Священный образ [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe], почитаемый верующими."
 pam_saint_relic_letter_desc: "Изящный реликварий, в котором хранится письмо, написанное рукой [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_drawing_desc: "Известный рисунок, начертанный рукой [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_stationery_desc: "Письменный прибор, принадлежавший [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]. Говорят, что он наделяет мудростью каждого, кто им пишет."
 pam_saint_relic_ash_desc: "Изящный реликварий, в котором хранится святой прах [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_canopic_jar_desc: "Сосуд со внутренностями [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_staff_desc: "Посох, принадлежавший [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_water_filter_desc: "Клочок ткани, через который [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale, 'очищала', 'очищал')] воду во время своих странствий."
 pam_saint_relic_bowl_desc: "Миска, с которой [relic_creator_saint.GetShortUINameNotMe] [Select_CString(relic_creator_saint.IsFemale, 'просила', 'просил')] подаяния в своих странствиях."
 pam_saint_relic_robe_desc: "Изящный реликварий, в котором хранятся святые ризы [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_sword_desc: "Меч, принадлежавший [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]. Говорят, что дарует верующим воинам божественную защиту и силу."
 pam_saint_relic_sarira_desc: "Изящный реликварий, в котором хранится шарира [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_buddhism_desc: "Изящный реликварий, в котором хранится шарира: ушниша [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_finger_buddhism_desc: "Изящный реликварий, в котором хранится шарира: перст [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_buddhism_desc: "Изящный реликварий, в котором хранится шарира: зуб [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_buddhism_desc: "Изящный реликварий, в котором хранится шарира: ребро [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "Талисман, начертанный рукой [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]. Говорят, что он изгоняет зло и исцеляет от болезней."
 pam_saint_relic_pellet_desc: "Флакон с пилюлями бессмертия, которые [Select_CString(relic_creator_saint.IsFemale, 'изготовила', 'изготовил')] [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_footprint_desc: "Изящный реликварий, в котором хранится след стопы [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_afarganyu_desc: "Афарганью, принадлежавший [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_ring_desc: "Святое кольцо, принадлежавшее [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_bracelet_desc: "Святой браслет, принадлежавший [Select_CString(relic_creator_saint.IsFemale, 'праведнице', 'праведнику')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_commentary_desc: "Подборка комментариев к священной книге «[relic_creator_saint.GetFaith.ReligiousText]», которую [Select_CString(relic_creator_saint.IsFemale, 'составила', 'составил')] [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tzitzit_desc: "Благословенная нить из цицит [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe], демонстрирующая [Select_CString(relic_creator_saint.IsFemale, 'её', 'его')] благочестие."
 pam_saint_relic_relic_desc: "Изящный реликварий, в котором хранится священная реликвия [Select_CString(relic_creator_saint.IsFemale, 'праведницы', 'праведника')] по имени [relic_creator_saint.GetShortUINameNotMe]."
 # Buried-saint point of interest
 poi_buried_saint: "Гробница, где покоится [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "Посещение гробницы святого"
 poi_buried_saint.visit_va: "Посещение гробницы предка"
 poi_buried_saint.visit_desc: "Посетив гробницу такой великой личности, как [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], вы исполнились набожности."
 poi_buried_saint.preset_visit_desc: "Вы останавливаетесь у гробницы [visited_saint.GetShortUIName] и отдаёте дань уважения."
 poi_buried_saint.foreign_visit: "Посещение древней гробницы"
 poi_buried_saint.foreign_visit_desc: "Ваша вера не почитает [visited_saint.GetShortUIName], но у этой гробницы есть чему поучиться."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Почтите память святого, получив немного [piety_i|E][Concept('piety', 'благочестия')|E], и получите возможность извлечь священную [Concept('artifact', 'реликвию')|E] с #EMP меньшими#! затратами, чем издалека."
 pam_poi_buried_saint_on_visit_relic_tt: "Почтите память [Select_CString(visited_saint.IsFemale, 'праведницы', 'праведника')] по имени [visited_saint.GetShortUIName] и получите возможность извлечь священную [Concept('artifact', 'реликвию')|E] с #EMP меньшими#! затратами."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Здесь покоится [visited_saint.Custom('PamSaintOrAncestorNoun')|l] [visited_saint.GetShortUIName]. Отдайте должное [Select_CString(visited_saint.IsFemale, 'её', 'его')] памяти."
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "На могиле [Select_CString(visited_saint.IsFemale, 'праведницы', 'праведника')] по имени [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.desc: "Дорога привела меня туда, где покоится [visited_saint.GetShortUIName] — [visited_saint.Custom('PamVeneratedSaintOrAncestor')] моей конфессии. Сам воздух здесь наполнен святостью, а вокруг гробницы на коленях молятся верующие."
 pam_saint_events.0007.a: "Я воздам почести и отправлюсь дальше."
 pam_saint_events.0007.b: "Попробуем извлечь священную реликвию."
 pam_saint_events.0007.b.tt: "Извлечение священной [Concept('artifact', 'реликвии')|E] из останков [Select_CString(visited_saint.IsFemale, 'праведницы', 'праведника')] по имени [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.b.toast: "Священная реликвия извлечена"
 pam_saint_events.0007.b.toast_desc: "С великим благоговением я извлекаю артефакт [relic_artifact.GetName] из останков. Теперь [visited_saint.GetShortUINameNoTooltip] благословит мою [Concept('realm', 'державу')|EU]."
