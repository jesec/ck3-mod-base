 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "Выбрать место упокоения"
 pam_choose_consecration_site_decision_va: "[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]: выбрать место упокоения"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "Я выберу [Concept('ecclesiastical_domicile_building', 'собор')|E] в своей [Concept('realm', 'державе')|E] для освящения и упокоения [Concept('canonized', 'святых')|E] мощей, чтобы верующие могли воздавать им должные почести."
 pam_choose_consecration_site_decision_desc_va: "Я выберу святое место в своей [Concept('realm', 'державе')|E], где упокоится [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')], чтобы верующие могли воздавать должные почести."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "Я выберу [Concept('holy_site', 'Holy Site')|E] своей [Concept('faith', 'конфессии')|E] в своей [Concept('realm', 'державе')|E] для освящения и упокоения [Concept('canonized', 'святых')|E] мощей, чтобы верующие могли воздавать им должные почести."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Я выберу [Concept('holy_site','Holy Site')|E] своей [Concept('faith', 'конфессии')|E] в своей [Concept('realm', 'державе')|E], где упокоится [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')], чтобы верующие могли воздавать должные почести."
 pam_choose_consecration_site_decision_tooltip: "Выберите, где упокоится [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 pam_choose_consecration_site_decision_confirm: "Освятить"
 pam_choose_consecration_site_decision_select_tt: "Выберите место, где упокоится [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "Забрать реликвию"
 pam_extract_relic_decision_desc: "В моей державе покоятся [GetPlayer.Custom('PamConsecratedEnshrined')]ые мощи легендарной фигуры, прославившейся как [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]. Из них мы можем с должным почтением извлечь реликвию, чтобы благословлять верующих."
 pam_extract_relic_decision_tooltip: "Извлечение реликвии из гробницы в ваших владениях, где покоится [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]."
 pam_extract_relic_decision_confirm: "Извлечь реликвию"
 pam_extract_relic_decision_req_saint: "Вы можете извлечь реликвию из гробницы в своей [Concept('realm', 'державе')|EU], где покоится [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]."
 pam_extract_relic_decision_req_saint_count: "На данный момент [CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsFemale, 'даровала', 'даровал' )] нам [CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] из [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] возможных [Concept('artifact', 'реликвий')|E]"
 pam_extract_relic_decision_extract_tt: "Создание священной [Concept('artifact','реликвии')|E] из останков легендарной фигуры, прославившейся как [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_extract_relic_decision_choose_tt: "Выберите гробницу, где покоится [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')], чтобы извлечь из неё священную [Concept('artifact','реликвию')|E]"
 pam_extract_relic_decision_item_valid_tt: "Из этой гробницы, где покоится [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')], ещё можно извлечь священную [Concept('artifact','реликвию')|E]."
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "Прошение отправлено"
 pam_saint_events.0001.desc: "Все деяния, которыми [Select_CString(saint_candidate.IsFemale, 'прославилась', 'прославился')] [saint_candidate.GetFirstName], скрупулёзно записаны, а в провинции [consecration_province.GetName] уже приготовлено место для святых мощей.\n\nДальнейшее зависит уже не от меня: я могу только ждать, когда моё прошение получит [petition_recipient.GetTitledFirstName], и молиться о благополучном исходе."
 pam_saint_events.0001.a: "Будем ждать и молиться."
 pam_saint_events.0001.a.tt_saint: "[petition_recipient.GetTitledFirstName|U] рассмотрит вашу просьбу признать, что [saint_candidate.GetFirstName] является [Concept('canonized',Select_CString(saint_candidate.IsFemale, 'святой', 'святым'))|E], [Select_CString(saint_candidate.IsFemale, 'чтимой', 'чтимым')] в провинции [consecration_province.GetName]. Ответ вы получите позже."
 pam_saint_events.0001.a.tt_va: "[petition_recipient.GetTitledFirstName] получит вашу просьбу признать, что [saint_candidate.GetFirstName] — [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], и разрешить, чтобы [Select_CString(saint_candidate.IsFemale, 'её', 'его')] останки были [GetPlayer.Custom('PamConsecratedEnshrined')]ыми в провинции [consecration_province.GetName]. Ответ вы получите позже."
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "Прошение о канонизации"
 pam_saint_events.0002.t_va: "Прошение о почитании"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName] просит нас признать, что [saint_candidate.GetFirstName] [Select_CString(saint_candidate.IsFemale, 'достойна', 'достоин')] причисления к лику святых и почитания в провинции [consecration_province.GetName]."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName] просит нас признать, что [saint_candidate.GetFirstName] — [saint_candidate.Custom('PamVeneratedSaintOrAncestor')], и разрешить, чтобы [Select_CString(saint_candidate.IsFemale, 'её', 'его')] останки были [GetPlayer.Custom('PamConsecratedEnshrined')]ыми в провинции [consecration_province.GetName]."
 pam_saint_events.0002.desc.traits_1: "\n\nПри жизни [saint_candidate.GetFirstNameNoTooltip] [Select_CString(saint_candidate.IsFemale, 'была известна', 'был известен')] таким качеством, как [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nПри жизни [saint_candidate.GetFirstNameNoTooltip] [Select_CString(saint_candidate.IsFemale, 'была известна', 'был известен')] такими качествами, как [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] и [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nПри жизни [saint_candidate.GetFirstNameNoTooltip] [Select_CString(saint_candidate.IsFemale, 'была известна', 'был известен')] такими качествами, как [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] и [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "В этой душе есть мерцающий огонёк; он невелик, но не всякий святой закалялся большим пламенем.\n\nРешение остаётся за нами."
 pam_saint_events.0002.desc.virtue_1_va: "В этой душе есть мерцающий огонёк; он невелик, но не всякая почтенная душа закалялась большим пламенем.\n\nРешение остаётся за нами."
 pam_saint_events.0002.desc.virtue_2: "[saint_candidate.GetFaith.HighGodName] признаёт свершения этой души: она благодатна, хоть и несовершенна.\n\nРешение остаётся за нами."
 pam_saint_events.0002.desc.virtue_3: "Эта душа воплощает добродетель; мало кому из смертных удаётся настолько приблизиться к божеству.\n\nРешение остаётся за нами."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] — воистину достойный кандидат."
 pam_saint_events.0002.a.dynasty_opinion_tt: "[canonizer.GetShortUIName] и члены [Select_CString(canonizer.IsFemale, 'её', 'его')] [canonizer.GetFaith.GetAdherentName|l]ой [Concept('dynasty', 'династии')|E] получают #P 10#! ед. [Concept('opinion', 'мнения')|E] о вас на 20 лет"
 pam_saint_events.0002.b: "Мы этого не одобрим."
 pam_saint_events.0002.b.dynasty_opinion_tt: "[canonizer.GetShortUIName] и члены [Select_CString(canonizer.IsFemale, 'её', 'его')] [canonizer.GetFaith.GetAdherentName|l]ой [Concept('dynasty', 'династии')|E] теряют #N 10#! ед. [Concept('opinion', 'мнения')|E] о вас на 20 лет"
 # Opinion Modifiers
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
