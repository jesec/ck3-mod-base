 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]!"
 pam_tenet_events.0004.desc.forward_tenet: "Желаю сообщить вам, что [diverged_rite.GetName|l] с недавних пор соблюдает новый догмат: [diverged_added_tenet.GetBaseName|l].\n\nТечение, умеющее направить своих последователей на приличествующий им путь, служит делу укрепления #L [diverged_rite.GetFaith.GetName|l]ой#! веры — такова моя нехитрая мудрость."
 pam_tenet_events.0004.desc.forward_doctrine: "Желаю сообщить вам, что [diverged_rite.GetName|l] теперь официально соблюдает новую доктрину: [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )|l].\n\nТечение, умеющее направить своих последователей на приличествующий им путь, служит делу укрепления #L [diverged_rite.GetFaith.GetName|l]ой#! веры — такова моя нехитрая мудрость."
 pam_tenet_events.0004.desc.backward_tenet: "Желаю сообщить вам, что [diverged_rite.GetName|l] отныне придерживается нового догмата, именуемого «[diverged_added_tenet.GetBaseName|l]».\n\nТеперь мы и [diverged_rite.GetFaith.GetMainRite.GetName|l] почти слились воедино; когда два течения станут неразличимы, #L [diverged_rite.GetFaith.GetName|l]ая#! вера будет процветать как никогда!"
 pam_tenet_events.0004.desc.backward_doctrine: "Желаю сообщить вам, что [diverged_rite.GetName|l] теперь отныне придерживается доктрины, именуемой «[diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )|l]».\n\nТеперь мы и [diverged_rite.GetFaith.GetMainRite.GetName|l] почти слились воедино; когда два течения станут неразличимы, #L [diverged_rite.GetFaith.GetName|l]ая#! вера будет процветать как никогда!"
 pam_tenet_events.0004.a: "Да будет так."
 pam_tenet_events.0004.a.tt.diverged: "[Concept('rite', 'Течение')|E] «[diverged_rite.GetName]» сильнее отделилось от [Concept('mainline_rite', 'господствующего течения')|E] «[diverged_rite.GetFaith.GetMainRite.GetName]». Ежегодная потеря [fervor_i][Concept('fervor', 'рвения')|E] ускорена"
 pam_tenet_events.0004.a.tt.consolidated: "[Concept('rite', 'Течение')|E] «[diverged_rite.GetName]» приблизилось к [Concept('mainline_rite', 'господствующему течению')|E] «[diverged_rite.GetFaith.GetMainRite.GetName]». Ежегодная потеря [fervor_i][Concept('fervor', 'рвения')|E] замедлена"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "Половина всего имущества роздана мной бедным, и душа моя тем самым обогатилась.\n\nТеперь я прошу того же от вас. Кому нечего дать, того простят. Кому есть, что дать, того запомнят."
 pam_tenet_events.0005.a: "Если [redistributing_liege.GetTitleAsNameNoTooltip] может это, то и я могу."
 pam_tenet_events.0005.b: "Мне есть, что дать, но давать я не буду."
 pam_tenet_events.0005.b.tt: "Ваша казна останется нетронутой, ваши [Concept('counties', 'графства')|E] не получат ничего"
 pam_tenet_events.0006.t: "Скрытые учения"
 pam_tenet_events.0006.desc_intro: "Передо мной открыты книги без названия, там рисунки и имена, не предназначенные для чужих глаз и ушей. Там — учение, которого не должны даже касаться верные слуги Божьи. Мне удалось купить себе ночь наедине с этим учением."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName] доходит до порога и останавливается там. «Такие вещи не просто так держат под замком, — шепчет [Select_CString(mystic_witness.IsFemale, 'она', 'он' )]. — То, что ты здесь прочтёшь, останется в твоей голове навсегда»."
 pam_tenet_events.0006.desc_alone: "\n\nНикто при моём дворе не станет изучать эти страницы вместе со мной. Что бы там ни было, я прочту это без стороннего совета."
 pam_tenet_events.0006.a: "Ничто в этих страницах меня не оттолкнёт. Продолжать читать."
 pam_tenet_events.0006.b: "Продолжать, пока не погаснет лампа, и не более того."
 pam_tenet_events.0007.t: "Совет мёртвых"
 pam_tenet_events.0007.desc: "Двери заперты, лампы потушены, мир вокруг меня уменьшается, пока не остаётся лишь небольшой мерцающий огонёк и курящийся дым. Я уже чувствую: [guiding_forebear.GetTitledFirstName] здесь, раскачивается за дымной завесой.\n\nВо тьме я излагаю горестные вести, что не осмеливаюсь передать при свете дня. Духи отвечают не так, как смертные, а замогильным шёпотом, потрескиванием пламени, дуновением невидимого ветерка, образами призраков в дыму.\n\nМне очень нужен ответ и я, что есть сил напрягая зрение, ищу его во всём подряд."
 pam_tenet_events.0007.a: "Поделись со мной мудростью, что направляла тебя."
 pam_tenet_events.0007.b: "Даруй мне мир, чтобы встретить рассвет."
 pam_tenet_events.0008.t: "Напоминание обо мне"
 pam_tenet_events.0008.desc: "Печать, чаша, кольцо, что [Select_CString(remembered_forebear.IsFemale, 'носила моя', 'носил мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))|l] [remembered_forebear.GetTitledFirstName]. Все это положено передо мной и я сижу перед этими предметами так долго, что они уже начинают казаться мне моими.\n\nНичего не появляется. Ничего не сказано. Это не разговор о [Select_CString(remembered_forebear.IsFemale, 'ней', 'нём' )], это напоминание обо мне."
 pam_tenet_events.0008.a: "Это я, [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l] вне всякого сомнения."
 pam_tenet_events.0008.b: "В моём сердце просыпается [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l], и я это чувствую."
 pam_tenet_events.0008.c: "Да, [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l] — это прошлая моя роль, и её же я могу взять в настоящем."
 pam_tenet_events.0008.d: "Эти жизни в прошлом. Я остаюсь собой."
 pam_tenet_events.0009.t: "Открыть сундуки"
 pam_tenet_events.0009.desc_intro: "Сундуки вынесли во двор, а в руку мне вложили ключи."
 pam_tenet_events.0009.desc_witness: "[redistribution_witness.GetTitledFirstName] идёт вдоль рядов.\n\n«Щедрый [ROOT.Char.GetTitleAsNameNoTooltip|l] — всё ещё [ROOT.Char.GetTitleAsNameNoTooltip|l], — говорит [Select_CString(redistribution_witness.IsFemale, 'она', 'он' )]. — Чтобы спастись, щедрого пожертвования недостаточно, надо, чтобы у тебя не осталось вообще ничего»."
 pam_tenet_events.0009.desc_alone: "Никто не вышел и не встал рядом со мной. Управляющие остаются на расстоянии и ждут."
 pam_tenet_events.0009.desc_end: "\n\nСвой личный я могу открыть поворотом руки. Остальные придётся забрать."
 pam_tenet_events.0009.a: "Ломайте замки. Пусть все заберут свою долю."
 pam_tenet_events.0009.flavor: "Ваши состоятельные вассалы будут вынуждены открыть свои сундуки. Ваши графства станут свободнее и командовать ими будет труднее. Те, кто не разделяет этот догмат, будут вас осуждать."
 pam_tenet_events.0009.b: "Минуточку. Жертвовать надо лишь моим личным богатством."
 pam_tenet_events.0009.b.tt: "Вы делитесь лишь тем, что принадлежит вам. Ваши [Concept('vassals', 'вассалы')|E] сохраняют свою казну и никак не осуждают вас."
 pam_tenet_events.0010.t: "Долг плоти"
 pam_tenet_events.0010.desc_intro: "Бич лежит там, где и всегда. Рядом с ним сегодня лежат щипцы и короткий нож, их принесли по моему приказу."
 pam_tenet_events.0010.desc_alone: "\n\nСегодня никто не будет держать для меня лампу. То, что я возьму с этого стола, я возьму без свидетелей."
 pam_tenet_events.0010.a: "Бич, пока не успокоится мой ум."
 pam_tenet_events.0010.b: "Пора мне забыть, как выглядит этот мир."
 pam_tenet_events.0010.c: "Забрать аппетит — вместе с ним пропадёт и грех."
