 pam_theocratic_ruler_events.0014.c.tt: "В следующий раз вам не придётся вносить вклад типа #V «$great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$»#! в [Concept('great_project', 'грандиозный проект')|E] «[GetGreatProjectType('pam_mass_rite_conversion').GetName|V]»"
 pam_theocratic_ruler_events.0014.d: "Разве пастырю пристало идти за стадом?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "Просьба неофита"
 pam_theocratic_ruler_events.0015.t: "Наставление наследников"
 pam_theocratic_ruler_events.0015.desc: "Мне пора выбрать наследника: человека, который будет твёрд и в вере, и в решениях. На это роль претендуют двое: [succession_heir_first.GetTitledFirstName] из первой линии и [succession_heir_second.GetTitledFirstName] — из второй. Сегодня им предстоит прочесть отрывок из Священного Писания.\n\nЯ могу передать свою ношу только одному из них.\n\n«Дети мои по вере! Покажите мне, чему вы научились и как выросли над собой.»"
 pam_theocratic_ruler_events.0015.a: "Пусть читает [succession_heir_first.GetFirstNameNoTooltip]."
 pam_theocratic_ruler_events.0015.b: "Пусть декламирует [succession_heir_second.GetFirstNameNoTooltip]."
 pam_theocratic_ruler_events.0015.c: "Зачитывать текст — дело пастыря."
 pam_theocratic_ruler_events.0015.c.success: "Их декламация не сравнится с вашей"
 pam_theocratic_ruler_events.0015.c.failure: "Вы запинаетесь на отрывке, который они знают наизусть"
 pam_theocratic_ruler_events.0015.c.toast.success: "Они поражены глубиной ваших знаний."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Ваши подчинённые обмениваются недоумёнными взглядами."
