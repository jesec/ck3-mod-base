l_russian:
 pam_theocratic_ruler_events.0001.t: "Наследство для церкви"
 pam_theocratic_ruler_events.0001.desc: "После смерти некий богатый купец оставил церкви наследство, и его сумма оказалась весьма внушительной.\n\n[Select_CString(subordinate_priest.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))|l] [subordinate_priest.GetFirstName] [Select_CString(subordinate_priest.IsFemale, 'принесла', 'принёс' )] мне все соответствующие документы, чтобы услышать моё мнение по этому поводу.\n\n«В завещании сказано, что средства следует направить на укрепление веры людей в учение [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 pam_theocratic_ruler_events.0001.a: "У меня есть подозрения, что [Select_CString(subordinate_priest.IsFemale, 'она присвоила', 'он присвоил' )] себе часть этих средств…"
 pam_theocratic_ruler_events.0001.b: "«Давай вместе обсудим, как церкви лучше поступить»."
 pam_theocratic_ruler_events.0001.c: "Мы положим эти деньги в казну и воздадим благодарность за это щедрое пожертвование."
 pam_theocratic_ruler_events.0001.b.success: "Пути Господни неисповедимы"
 pam_theocratic_ruler_events.0001.b.failure: "[Select_CString(subordinate_priest.IsFemale, 'Священница', 'Священник' )] не внимает вашим доводам"
 pam_theocratic_ruler_events.0001.b.toast.success: "Вы убедили [Select_CString(subordinate_priest.IsFemale, 'её', 'его' )] и забрали наследство себе."
 pam_theocratic_ruler_events.0001.b.toast.failure: "[Select_CString(subordinate_priest.IsFemale, 'Она', 'Он' )] использует это пожертвование во имя [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0002.t: "[Select_CString(foreign_ruler.IsFemale, 'Иностранная путница', 'Иностранный путник' )]"
 pam_theocratic_ruler_events.0002.desc: "До меня дошла весть о том, что из соседней #L [foreign_ruler.GetFaith.GetName|l]ой#! державы к нам [Select_CString(foreign_ruler.IsFemale, 'прибыла', 'прибыл' )] [foreign_ruler.GetFaith.GetName].\n\n[Select_CString(foreign_ruler.IsFemale, 'Она и её', 'Он и его' )] свита держат путь дальше, но планируют по дороге посетить мой двор. Разумеется, с моей стороны ожидается торжественный приём со всеми почестями.\n\nКак мне лучше их встретить?"
 pam_theocratic_ruler_events.0002.a: "Я сделаю им скромный подарок и предложу мир."
 pam_theocratic_ruler_events.0002.b: "«Мне бы искренне хотелось достичь взаимопонимания между нашими народами»."
 pam_theocratic_ruler_events.0002.b.success: "Мне удаётся расположить их к себе за счёт своей учтивости"
 pam_theocratic_ruler_events.0002.b.failure: "Мои слова звучат неубедительно"
 pam_theocratic_ruler_events.0002.b.toast.success: "Благодаря вашему радушию народы становятся терпимее друг к другу"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[Select_CString(foreign_ruler.IsFemale, 'Она', 'Он' )] не верит вашим словам"
 pam_theocratic_ruler_events.0002.b.acceptance: "Тёплый приём"
 pam_theocratic_ruler_events.0002.c: "Язычникам не место в нашей стране."
 TRUCE_PAM_NEIGHBOR_GIFT: "\nПеремирие, основанное на дарах и взаимном уважении соседей"
 pam_theocratic_ruler_events.0003.t: "Обсуждение укрепления границ"
 pam_theocratic_ruler_events.0003.desc: "Тяготы войны вкупе с налётчиками сильно вредят моим владениям. [Select_CString(foreign_ruler.IsFemale, 'Моя верная', 'Мой верный' )] [advisor.GetCouncilTitle|l] [advisor.GetTitledFirstName|l] по первому зову приходит ко мне, и мы вместе обсуждаем возможные решения этой проблемы.\n\n«Быть может, [alliance_target.GetTitledFirstName] придёт к нам на помощь? [Select_CString(alliance_target.IsFemale, 'Она', 'Он' )] тоже возглавляет теократию и при этом исповедует нашу веру. Думаю, эти сходства могут сыграть нам на руку».\n\nСтоит ли мне обращаться за помощью или лучше справиться самостоятельно?"
 pam_theocratic_ruler_events.0003.a: "Отправим к [Select_CString(alliance_target.IsFemale, 'ней', 'нему' )] послов. Мы должны поддерживать друг друга."
 pam_theocratic_ruler_events.0003.a.tt: "Вы и [alliance_target.GetShortUINameNoTooltip] заключаете [Concept('alliance', 'союз')|E]"
 pam_theocratic_ruler_events.0003.b: "Призовём верующих крестьян на защиту границ."
 pam_theocratic_ruler_events.0003.b.army: "Верующие крестьяне"
 pam_theocratic_ruler_events.0003.c: "Отправить помощь и восстановить одно пострадавшее от налёта графство."
 pam_theocratic_ruler_events.0003.d: "Наше спасение в руках [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0004.t: "Братья по соседству"
 pam_theocratic_ruler_events.0004.desc: "Поскольку [monastic_order_head.GetPrimaryTitle.GetName] находится совсем рядом, мне в голову пришла идея: пусть [monastic_order_head.GetTitledFirstName|l] приедет к нам в гости, дабы мы с [Select_CString(monastic_order_head.IsFemale, 'ней', 'ним' )] обсудили укрепление нашего сотрудничества.\n\n«[monastic_order_head.GetFaith.HighGodName], не суди нас за нашу гордыню, но суди по нашему желанию служить тебе», — тихо проговаривает [monastic_order_head.GetTitledFirstNameNoTooltip]."
 pam_theocratic_ruler_events.0004.a: "Прошу, пусть ваши священники благословят мои владения."
 pam_theocratic_ruler_events.0004.b: "[Select_CString(monastic_monk.IsFemale, 'Ваша послушница', 'Ваш послушник' )] [monastic_monk.GetTitledFirstNameNoTooltip|l] [Select_CString(monastic_monk.IsFemale, 'могла', 'мог' )] бы пригодиться мне при дворе."
 pam_theocratic_ruler_events.0004.c: "Давайте вместе вознесём молитвы."
 pam_theocratic_ruler_events.0005.t: "Воины веры"
 pam_theocratic_ruler_events.0005.desc: "[military_order_head.GetPrimaryTitle.GetName] находится прямо в моих владениях, поэтому [military_order_head.GetTitledFirstName|l] без лишних раздумий соглашается посетить мой двор, чтобы обсудить вопросы веры и войны.\n\n«[military_order_head.GetFaith.HighGodName] благословляет не всякий клинок, а лишь тот, который поднимают ради защиты верующих», — говорит [military_order_head.GetTitledFirstNameNoTooltip|l], в то время как [Select_CString(military_order_head.IsFemale, 'её', 'его' )] [Select_CString(order_knight.IsFemale, 'послушница', 'послушник' )] [order_knight.GetTitledFirstName|l] молча кланяется подле [Select_CString(military_order_head.IsFemale, 'неё', 'него' )]."
 pam_theocratic_ruler_events.0005.a: "Мои [ROOT.Char.Custom('GetFighterTermPlural')|l] могут многому научиться у вашего ордена."
 pam_theocratic_ruler_events.0005.b: "Пусть [order_knight.GetTitledFirstNameNoTooltip|l] станет [Select_CString(order_knight.IsFemale, 'моей телохранительницей', 'моим телохранителем' )]."
 pam_theocratic_ruler_events.0005.c: "Давайте поговорим о праведной войне."
 pam_theocratic_ruler_events.0006.t: "Налоги или милосердие"
 pam_theocratic_ruler_events.0006.desc: "[local_peasant_leader.GetTitledFirstName], глава одной из деревень, предстаёт передо мной. Местные жители не заплатили положенный церкви налог, и теперь [Select_CString(local_peasant_leader.IsFemale, 'она', 'он' )] пытается найти этому оправдание, чтобы избежать наказания.\n\n«Зима выдалась крайне тяжёлой, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )], и наши амбары практически пусты», — объясняет [Select_CString(local_peasant_leader.IsFemale, 'она', 'он' )] дрожащим голосом.\n\nВ чём бы ни была истинная причина этой проблемы, у нас есть лишь пара вариантов её решения: либо помиловать крестьян, либо установить в графстве более суровый порядок."
 pam_theocratic_ruler_events.0006.a: "Налоги должны платить все без исключения. Арестовать [Select_CString(local_peasant_leader.IsFemale, 'её', 'его' )]!"
 pam_theocratic_ruler_events.0006.a.tt: "Вы получаете [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0], [local_peasant_leader.GetShortUINameNoTooltip] попадает в тюрьму, а [troubled_county.GetName] получает модификатор «#N Навязанная десятина#!» на 5 лет (#N −20#! ед. [Concept('county_opinion', 'народного мнения')|E])."
 pam_theocratic_ruler_events.0006.b: "Я прощаю их. Несомненно, Богу будет угодно моё милосердие."
 pam_theocratic_ruler_events.0006.b.tt: "Вы получаете [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0], а [troubled_county.GetName] получает модификатор «#P Мягкая десятина#!» на 5 лет (#P +20#! ед. [Concept('county_opinion', 'народного мнения')|E])."
 pam_theocratic_ruler_events.0006.c: "Мой управляющий подвёл меня. Это его вина."
 pam_theocratic_ruler_events.0006.c.tt: "По возможности [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] подпадает под ваше [Concept('hook', 'влияние')|E] (используется самое большое обязательство из доступных). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] ухудшит своё [Concept('opinion', 'мнение')|E] о вас (#N −20#!, снижается в течение 5 лет)."
 pam_theocratic_ruler_events.0007.t: "Счастливая гармония"
 pam_theocratic_ruler_events.0007.desc: "Этим утром я ощущаю невероятный покой. Капельки росы блестят на траве. Ласковое солнце согревает памятники церковного кладбища. Мне некуда торопиться. Даже трудолюбивые пчёлы бросают свои дела, чтобы понежиться в рассветных лучах.\n\nВ моей стране царит порядок. Казна полна золота, а паства относится ко мне с почтением. Даже мой сюзерен [ROOT.Char.GetLiege.GetTitledFirstName] хвалит меня за религиозное рвение."
 pam_theocratic_ruler_events.0007.a: "Покой — это чудесно, но, похоже, у [ROOT.Char.GetFaith.HighGodNamePossessive] на меня другие планы."
 pam_theocratic_ruler_events.0007.b: "Пора воспеть благочестие и праведную жизнь."
 pam_theocratic_ruler_events.0007.c: "Я просто хочу насладиться тишиной."
 pam_theocratic_ruler_events.0008.t: "Крепостные стены"
 pam_theocratic_ruler_events.0008.desc: "С тех пор, как [stone_province.GetName] — замок с #TOOLTIP:BUILDING,curtain_walls_01 #L бастионами и куртинами#!#!, — перешёл ко мне в наследство, я постоянно думаю об этой толстой каменной преграде, возведённой для светского правителя. Разве верующим нужна защита?\n\nВ моём поместье даже нет #ONCLICK:DOMICILE_BUILDING,episcopal_palace_01 #TOOLTIP:DOMICILE_BUILDING,episcopal_palace_01 #L дворца епископа#!#!#!, зато есть примитивные стены, сложенные мирянами."
 pam_theocratic_ruler_events.0008.a: "Я могу использовать излишки камня."
 pam_theocratic_ruler_events.0008.b: "Нужно снести стены и отстроить мой [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]."
 pam_theocratic_ruler_events.0008.c: "Любое творение человека — это овеществлённая молитва."
 pam_theocratic_ruler_events.0008.c.flavor: "У вас есть догмат «[GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]»"
 pam_theocratic_ruler_events.0008.d: "Стены ещё могут понадобиться."
 pam_theocratic_ruler_events.0009.t: "Быть пастырем — дело нелёгкое"
 pam_theocratic_ruler_events.0009.desc: "До меня дошли вести о том, что [heir.GetTitledFirstName] [Select_CString(heir.IsFemale, 'потеряла', 'потерял')] самообладание во время последней проповеди. Люди жалуются на то, что [Select_CString(heir.IsFemale, 'она', 'он')] предъявляет к ним чересчур суровые требования, которые невозможно соблюдать.\n\nПри упоминании прихожан [Select_CString(heir.IsFemale, 'она', 'он')] впадает в ярость:\n\n«Мерзкие грешники! Они не готовы жертвовать собой ради искупления!»"
 pam_theocratic_ruler_events.0009.a: "«Пастырь должен быть спокоен. Поумерь свой пыл.»"
 pam_theocratic_ruler_events.0009.a.success: "Ваш советник беседует с [Select_CString(heir.IsFemale, 'ней', 'ним')]"
 pam_theocratic_ruler_events.0009.a.failure: "Ваши слова не успокаивают [Select_CString(heir.IsFemale, 'её', 'его')]"
 pam_theocratic_ruler_events.0009.a.toast.success: "Советник преуспевает"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Советник терпит неудачу"
 pam_theocratic_ruler_events.0009.b: "Я разочарованно покачиваю головой."
 pam_theocratic_ruler_events.0009.b.flavor: "Я не благословлю [Select_CString(heir.IsFemale, 'её', 'его')] на правление. [Select_CString(heir.IsFemale, 'Она', 'Он')] на эту роль не годится."
 pam_theocratic_ruler_events.0009.c: "«Молитесь и умерщвляйте свою плоть.»"
 pam_theocratic_ruler_events.0010.t: "Меч или посох"
 pam_theocratic_ruler_events.0010.desc: "[ROOT.Char.GetFaith.HighGodName] — мой владыка, и я служу ему и верой, и мечом.\n\nЯ чётко и ясно помню, как [pilgrimage_memory.GetDescription]. И как [battle_memory.GetDescription]. Всё поле боя было усеяно трупами. Мои последователи знают, что я исправно несу свою службу.\n\n[ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName] и [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName] болеют за судьбу нашей державы, но их приоритеты разительно отличаются."
 pam_theocratic_ruler_events.0010.a: "Я больше ценю верный меч."
 pam_theocratic_ruler_events.0010.b: "Я выбираю посох."
 pam_theocratic_ruler_events.0010.c: "Меч и посох сослужат нам отличную службу."
 pam_theocratic_ruler_events.0011.t: "Упокоение павшего рыцаря"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName] почтительно преклоняет передо мной колени и рассказывает о своём родственнике, который пал, защищая [ROOT.Char.GetFaith.HighGodNamePossessive]. \n\n«Он храбро сражался с язычниками, но его раны были слишком серьёзными. Хорошо, что мы хотя бы успели с ним попрощаться.»\n\n«Прошу, похороните его под алтарём, вместе с мечом. Я буду безмерно вам [Select_CString(landed_subject.IsFemale, 'благодарна', 'благодарен')].»"
 pam_theocratic_ruler_events.0011.a: "Оплати гробницу — и пусть лежит здесь."
 pam_theocratic_ruler_events.0011.a.flavor: "Рыцарь будет покоиться внутри церкви."
 pam_theocratic_ruler_events.0011.b: "Отдай нам меч — и мы похороним его в склепе."
 pam_theocratic_ruler_events.0011.b.flavor: "Мы похороним рыцаря без меча."
 pam_theocratic_ruler_events.0011.c: "Воины должны покоиться под открытым небом."
 pam_theocratic_ruler_events.0011.c.flavor: "Рыцаря похоронят за стенами церкви."
 pam_fallen_knight_crusader_sword_name: "Меч крестоносца"
 pam_fallen_knight_crusader_sword_desc: "Клинок рыцаря, который погиб, защищая свою веру. На рукояти оружия выгравирован крест, а лезвие покрыто отметинами от языческих мечей."
 pam_theocratic_ruler_events.0012.t: "Некогда священная роща"
 pam_theocratic_ruler_events.0012.desc: "Лес становится всё гуще, и моя свита замедляет шаг. [grove_subject.GetTitledFirstName] из графства [grove_county.GetNameNoTier] выходит из-за деревьев с распростёртыми руками.\n\n«Если вы хотите завоевать доверие местной паствы, то прислушайтесь к моему совету: [ROOT.Char.GetFaith.HighGodName] щедро одарил эти земли. Постройте храм близ древних рощ владения [grove_province.GetName], и люди сочтут вас достойным пастырем.»"
 pam_theocratic_ruler_events.0012.a: "Природа — мой поводырь."
 pam_theocratic_ruler_events.0012.b: "Покажи мне эти рощи."
 pam_theocratic_ruler_events.0012.b.success: "Позже ваши люди вырубят деревья"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip] раскрывает ваш обман"
 pam_theocratic_ruler_events.0012.b.toast.success: "Древние деревья идут на продажу."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip] рассказывает всем о совершённом святотатстве."
 pam_theocratic_ruler_events.0012.c: "Эти места — обитель дьявола."
 pam_theocratic_ruler_events.0013.t: "Ангельское пение"
 pam_theocratic_ruler_events.0013.desc: "Сегодня на мессе [Select_CString(angelic_singer.IsFemale, 'одна', 'один')] из певчих [Select_CString(angelic_singer.IsFemale, 'поразила', 'поразил')] нас голосом божественной чистоты и красоты.\n\nКогда [angelic_singer.GetTitledFirstName] [Select_CString(angelic_singer.IsFemale, 'запела', 'запел')], верующие замерли от восторга. Последняя нота затихла, но мелодия всё ещё плывёт под церковными сводами."
 pam_theocratic_ruler_events.0013.a: "«Этот голос даровал тебе [ROOT.Char.GetFaith.HighGodName]. Прими обеты и служи ему.»"
 pam_theocratic_ruler_events.0013.a.success: "Ваши слова зажигают веру в [Select_CString(angelic_singer.IsFemale, 'её', 'его')] душе."
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip] не поддастся на уговоры"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip] принимает обеты и присоединяется ко двору."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip] отказывается и уезжает."
 pam_theocratic_ruler_events.0013.b: "Погости у меня. Хочу вновь услышать этот голос."
 pam_theocratic_ruler_events.0013.c: "Пусть поют наши канторы."
 pam_theocratic_ruler_events.0014.t: "Просьба неофита"
 pam_theocratic_ruler_events.0014.desc: "Во время проповеди через толпу прихожан прорывается [convert_peasant.GetTitledFirstName] — [Select_CString(convert_peasant.IsFemale, 'новообращённая', 'новообращённый')] из [convert_peasant.GetCulture.GetNameNoTooltip]их крестьян, исповедующих [neighbour_faith.GetNameNoTooltip].\n\n«Старые традиции отнюдь не изжили себя. Поразмыслите о них на досуге. Уважьте наш народ, и он сплотится вокруг вас из благодарности.»\n\n[Select_CString(convert_peasant.IsFemale, 'Она', 'Он')] ждёт моего благословения и одобрительного кивка."
 pam_theocratic_ruler_events.0014.a: "Пусть не путается под ногами."
 pam_theocratic_ruler_events.0014.a.flavor: "Вы обладаете [Concept('trait', 'свойством')|E] «[GetTrait('arrogant').GetName( GetNullCharacter )]»"
 pam_theocratic_ruler_events.0014.a.acceptance: "Просьба неофита отвергнута"
