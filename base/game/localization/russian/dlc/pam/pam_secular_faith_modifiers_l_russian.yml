l_russian:
 pam_sf_devotion_modifier: "Процветание из набожности"
 pam_sf_devotion_modifier_desc: "Этот персонаж посвятил себя набожности, что принесло ему благочестие и золото."
 pam_sf_grace_modifier: "Обретённая милость"
 pam_sf_grace_modifier_desc: "Этот персонаж удостоился милости — благодарственного дара или тайного обета, укрепившего его дух."
 pam_sf_consolation_modifier: "Душевное спокойствие"
 pam_sf_consolation_modifier_desc: "Этот персонаж пребывает в мире с собой."
 pam_sf_visionary_renown_modifier: "Провозглашённое видение"
 pam_sf_visionary_renown_modifier_desc: "Этот персонаж объявил придворным о ниспосланном свыше видении, укрепив своё положение и авторитет."
 pam_sf_consecrated_arms_modifier: "Освящённый герб"
 pam_sf_consecrated_arms_modifier_desc: "Семейный герб этого персонажа был благословлён во время священного праздника."
 pam_sf_serenity_modifier: "Прославление публичных обрядов"
 pam_sf_serenity_modifier_desc: "Публичные проявления набожности этого персонажа снискали ему расположение духовенства и двора."
 pam_sf_humiliated_modifier: "Унизительные обеты"
 pam_sf_humiliated_modifier_desc: "Этого персонажа вынудили принять монашеские обеты и заточить себя в стенах монастыря."
 pam_sf_promised_acclaim_modifier: "Обещание паломника"
 pam_sf_promised_acclaim_modifier_desc: "Державный священник этого персонажа попросил возвестить жителям столицы о его следующем завершённом паломничестве.\n\nЗавершив паломничество, персонаж получит модификатор «[GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]» в своей [Concept('capital', 'столице')|E] на #V 15#! лет."
 pam_sf_extolled_pilgrimage_county_modifier: "Чествование паломника"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "Весть о паломничестве правителя разносится по этому графству, и его жители гордятся этим подвигом."
 pam_sf_free_feast_discount_desc: "Грядущий пир"
 pam_sf_free_feast_modifier: "Жажда пировать"
 pam_sf_free_feast_modifier_desc: "Вкус священной роскоши пробудил в этом персонаже ещё больший аппетит.\n$EFFECT_LIST_BULLET$Стоимость следующего #TOOLTIP:ACTIVITY_TYPE,activity_feast #L пира#!#!: [gold_i]#P -100%#!\n#weak Тратится с началом пира.#!"
 pam_sf_pilgrimage_funded_modifier: "Оплаченное паломничество"
 pam_sf_pilgrimage_funded_modifier_desc: "Покровитель пообещал взять на себя часть расходов на следующее паломничество этого персонажа.\n$EFFECT_LIST_BULLET$Стоимость #TOOLTIP:ACTIVITY_TYPE,activity_pilgrimage #L паломничества#!#!: [gold_i]#P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "Оплаченное паломничество"
 pam_sf_ear_of_clergy_modifier: "Благосклонность духовенства"
 pam_sf_ear_of_clergy_modifier_desc: "Церковь с большей вероятностью удовлетворит прошения этого персонажа.\n$EFFECT_LIST_BULLET$Принятие #V просьб о претензиях#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V просьб о золоте#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V просьб об отлучении#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V просьб о проповедовании легитимности#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V мольбы о претензиях#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V просьб о поддержке претензий#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V просьб о принуждении к смене власти#!: #P +25#!\n$EFFECT_LIST_BULLET$Принятие #V просьб о статус-кво#!: #P +25#!"
 pam_religious_delirium_modifier: "Религиозный бред"
 pam_religious_delirium_modifier_desc: "Этот персонаж убеждён, что с ним говорят сами небеса.\n$EFFECT_LIST_BULLET$Прирост [Concept('spiritual_fulfillment', 'духовной реализации')|E]: #P +50%#!\n$EFFECT_LIST_BULLET$Снижение [Concept('spiritual_fulfillment', 'духовной реализации')|E]: #N +50%#!"
 pam_sf_church_builder_modifier: "Строитель церквей"
 pam_sf_church_builder_modifier_desc: "После того, как это персонаж возвёл свой первый храм, он может строить церкви немного дешевле и получает постоянную прибавку к благочестию."
 pam_sf_scriptorium_county_modifier: "Писцы за работой"
 pam_sf_scriptorium_county_modifier_desc: "Заседающие здесь учёные ведут записи и составляют отчёты, касающиеся этого владения."
 pam_sf_doctrine_clarity_modifier: "Озарение"
 pam_sf_doctrine_clarity_modifier_desc: "Этого персонажа осенило — на него снизошло настоящее озарение."
 pam_sf_favorable_omen_modifier: "Благоприятное знамение"
 pam_sf_favorable_omen_modifier_desc: "Этот персонаж видит в небесах знаки божественного благоволения, а верующие воодушевлены ниспосланным благословением."
 pam_sf_omen_of_victory_modifier: "Знамение победы"
 pam_sf_omen_of_victory_modifier_desc: "Этот персонаж верит, что небеса обещали ему победу, поэтому бесстрашно ведёт своё войско в бой."
 pam_sf_demon_torment_modifier: "Демонические мучения"
 pam_sf_demon_torment_modifier_desc: "Этот персонаж убеждён, что его преследует демон и что теперь непременно нужно построить [Concept('holding', 'владение')|E] [GetBuilding('temple_01').GetName|l] или отправиться в [GetActivityType('activity_pilgrimage').GetName|l]."
 pam_sf_besieged_by_demons_modifier: "Демонический натиск"
 pam_sf_besieged_by_demons_modifier_desc: "Разум этого персонажа заполонили демоны: день за днём он всё больше впадает в безумие, теряет рассудок и мучается от судорог."
 pam_sf_grief_solace_modifier: "Утешение духа"
 pam_sf_grief_solace_modifier_desc: "Этот персонаж обрёл утешение после того, как, по его словам, ему явился дух."
 pam_sf_grief_warning_modifier: "Предупреждение духа"
 pam_sf_grief_warning_modifier_desc: "Этот персонаж убеждён, что ему явился дух и предупредил об опасности."
 pam_sf_peace_of_god_modifier: "Мир Божий"
 pam_sf_peace_of_god_modifier_desc: "Этот персонаж провозгласил и установил мир Божий во всей державе."
 pam_sf_immured_anchorite_modifier: "Заточённый отшельник"
 pam_sf_immured_anchorite_modifier_desc: "В стенах этого храма заточён отшельник."
 pam_sf_voice_of_jesus_modifier: "Глас Божий"
 pam_sf_voice_of_jesus_modifier_desc: "Этот персонаж услышал божественный голос и преобразился: все его способности обострились, словно его коснулась рука Господа."
 pam_sf_stroke_of_god_modifier: "Кара Господня"
 pam_sf_stroke_of_god_modifier_desc: "Этого персонажа сразил апоплексический удар. Врачи называют это «карой Господней», что поражает мозг, оставляя тело и разум немощными."
 pam_sf_lingering_stench_modifier: "Стойкая вонь"
 pam_sf_lingering_stench_modifier_desc: "Как бы этот персонаж ни старался, он никак не может забыть запах ног нищего, которые ему пришлось мыть."
 pam_sf_site_of_miracle_county_modifier: "Место свершившегося чуда"
 pam_sf_site_of_miracle_county_modifier_desc: "В этом графстве произошло чудо, что привлекает как паломников, так и разбойников."
 pam_sf_consecrated_county_modifier: "Недавнее освящение"
 pam_sf_consecrated_county_modifier_desc: "В этом графстве недавно освятили церковь."
 pam_sf_flagellant_cults_county_modifier: "Культы самобичевателей"
 pam_sf_flagellant_cults_county_modifier_desc: "Кающиеся бросят по улицам этого графства и бичуют себя во искупление грехов."
 pam_sf_relic_procession_county_modifier: "Явление святого"
 pam_sf_relic_procession_county_modifier_desc: "Через это графство торжественно пронесли святую реликвию, и после этого люди стали держаться чуть увереннее."
 pam_sf_blessed_bell_county_modifier: "Крещение колокола"
 pam_sf_blessed_bell_county_modifier_desc: "Церковный колокол этого графства омыли, помазали и нарекли именем. Люди верят, что его звон способен отогнать и бурю, и нечисть."
 pam_sf_church_ale_county_modifier: "Церковный эль"
 pam_sf_church_ale_county_modifier_desc: "Правитель этого графства выпил церковного эля вместе с прихожанами, и с тех пор прихожане только об этом и говорят."
 pam_sf_safe_passage_modifier: "Безопасный путь"
 pam_sf_safe_passage_modifier_desc: "После спасения в дороге этому путнику предоставили сопровождение и помогли безопасно продолжить путь."
 pam_sf_waylaid_road_modifier: "Нападение на дороге"
 pam_sf_waylaid_road_modifier_desc: "Путешествие этого путника обернулось смертельной опасностью, когда на него напали."
 pam_sf_penance_lustful_modifier: "Обуздание похоти"
 pam_sf_penance_lustful_modifier_desc: "Этот персонаж искупает похоть покаянием, подавляя свои желания ценой меньшего числа отпрысков."
 pam_sf_penance_chaste_modifier: "Отказ от воздержания"
 pam_sf_penance_chaste_modifier_desc: "Вопреки собственной природе этот персонаж отказывается от целомудрия, которое его вера считает греховным."
 pam_sf_penance_gluttonous_modifier: "Дни поста"
 pam_sf_penance_gluttonous_modifier_desc: "Этот персонаж постится в искупление чревоугодия, изнуряя тело ради спасения души."
 pam_sf_penance_temperate_modifier: "Нарушение долгого поста"
 pam_sf_penance_temperate_modifier_desc: "Этот персонаж отказывается от умеренности, которую его вера считает греховной, становясь щедрее душой и кошельком."
 pam_sf_penance_greedy_modifier: "Милостыня в покаяние"
 pam_sf_penance_greedy_modifier_desc: "Этот персонаж раздаёт милостыню в искупление жадности, облегчая и свой кошель, и совесть."
 pam_sf_penance_generous_modifier: "Скупость"
 pam_sf_penance_generous_modifier_desc: "Этот персонаж не блещет щедростью, которую его вера считает греховной, навлекая на себя богатство и косые взгляды."
 pam_sf_penance_lazy_modifier: "Труд в покаяние"
 pam_sf_penance_lazy_modifier_desc: "Этот персонаж взялся за изнурительный труд ради искупления лени."
 pam_sf_penance_diligent_modifier: "Обязательный отдых"
 pam_sf_penance_diligent_modifier_desc: "Этот персонаж отказывается от усердности, которую его вера считает греховной, становясь спокойнее ценой продуктивности."
 pam_sf_penance_wrathful_modifier: "Обуздание гнева"
 pam_sf_penance_wrathful_modifier_desc: "Этот персонаж сдерживает свой гнев в знак покаяния, что делает его мягче и притупляет его решимость."
 pam_sf_penance_calm_modifier: "Яростный пыл"
 pam_sf_penance_calm_modifier_desc: "Этот персонаж отказывается от спокойствия, которое его вера считает греховным, и разжигает в себе яростное рвение, что, однако, заставляет его сильнее напрягаться."
 pam_sf_penance_patient_modifier: "Повышенный темп"
 pam_sf_penance_patient_modifier_desc: "Этот персонаж отказывается от терпеливости, которую его вера считает греховной, и постоянно спешит, не находя себе покоя."
 pam_sf_penance_impatient_modifier: "Воспитание терпеливости"
 pam_sf_penance_impatient_modifier_desc: "Ради покаяния этот персонаж учится терпению, и вынужденное ожидание становится для него мучительным."
 pam_sf_penance_arrogant_modifier: "Практика смирения"
 pam_sf_penance_arrogant_modifier_desc: "Ради покаяния этот персонаж смиряет свою гордость, вместе с чем постепенно угасает и его слава."
 pam_sf_penance_humble_modifier: "Горделивая осанка"
 pam_sf_penance_humble_modifier_desc: "Этот персонаж принимает гордость, которую его вера ставит выше смирения, благодаря чему множится его слава, но также растёт тщеславие в глазах окружающих."
 pam_sf_penance_deceitful_modifier: "Обет честности"
 pam_sf_penance_deceitful_modifier_desc: "Этот персонаж дал обет говорить только правду ради искупления лживости, из-за чего ему сложнее юлить."
 pam_sf_penance_honest_modifier: "Искусство притворства"
 pam_sf_penance_honest_modifier_desc: "Этот персонаж учится хитрости, которую его вера ставит выше честности, становясь изворотливее, но теряя доверие окружающих."
 pam_sf_penance_craven_modifier: "Преодоление страха"
 pam_sf_penance_craven_modifier_desc: "Ради покаяния этот персонаж учится противостоять трусости, хотя каждый миг даётся ему с трудом."
 pam_sf_penance_brave_modifier: "Умеренная доблесть"
 pam_sf_penance_brave_modifier_desc: "Этот персонаж меняет доблесть, которую его вера считает греховной, на осторожность, что притупляет его воинский дух."
 pam_sf_penance_shy_modifier: "Вынужденная смелость"
 pam_sf_penance_shy_modifier_desc: "Ради покаяния этот персонаж заставляет себя казаться смелее, чем есть на самом деле, что превращает каждую беседу в настоящее испытание."
 pam_sf_penance_gregarious_modifier: "Молчаливое отстранение"
 pam_sf_penance_gregarious_modifier_desc: "Этот персонаж отказывается от греховных увеселений и молчаливо отстраняется, теряя друзей."
 pam_sf_penance_ambitious_modifier: "Обуздание амбиций"
 pam_sf_penance_ambitious_modifier_desc: "Ради покаяния этот персонаж укрощает свои честолюбивые помыслы, вместе с которыми угасает и его слава."
 pam_sf_penance_content_modifier: "Пробуждение желаний"
 pam_sf_penance_content_modifier_desc: "Этот персонаж разжигает в себе желания и подавляет удовлетворённость, которую его вера считает греховной, и всё сильнее стремится к большему."
 pam_sf_penance_arbitrary_modifier: "Правление по справедливости"
 pam_sf_penance_arbitrary_modifier_desc: "Ради покаяния этот персонаж правит справедливо и беспристрастно, становясь честнее, но беднее."
 pam_sf_penance_just_modifier: "Правление по прихоти"
 pam_sf_penance_just_modifier_desc: "Этот персонаж правит по прихоти, которую его вера ставит выше справедливости, что приносит ему богатство, но лишает любви подданных."
 pam_sf_penance_cynical_modifier: "Возрождение веры"
 pam_sf_penance_cynical_modifier_desc: "Этот персонаж обращается к вере ради искупления цинизма, словно облачаясь в непривычную мантию."
 pam_sf_penance_zealous_modifier: "Умеренное рвение"
 pam_sf_penance_zealous_modifier_desc: "Этот персонаж охлаждает в себе рвение, которое его вера считает чрезмерным, и набожные люди тоже начинают относиться к нему холоднее."
 pam_sf_penance_paranoid_modifier: "Обучение доверию"
 pam_sf_penance_paranoid_modifier_desc: "Ради покаяния этот персонаж учится доверять другим, поэтому ведёт себя более открыто и беззащитно."
 pam_sf_penance_trusting_modifier: "Сердце на замке"
 pam_sf_penance_trusting_modifier_desc: "Этот персонаж остерегается чрезмерно доверять людям, вопреки тому, что требует его вера, поэтому становится осторожнее, но холоднее в глазах окружающих."
 pam_sf_penance_compassionate_modifier: "Подавление милосердия"
 pam_sf_penance_compassionate_modifier_desc: "Этот персонаж подавляет в себе милосердие, которое его вера считает греховным, становясь суровее и внушая страх окружающим."
 pam_sf_penance_callous_modifier: "Воспитание милосердия"
 pam_sf_penance_callous_modifier_desc: "Ради покаяния этот персонаж учится милосердию, становясь мягче и не таким страшным в глазах других людей."
 pam_sf_penance_sadistic_modifier: "Отказ от жестокости"
 pam_sf_penance_sadistic_modifier_desc: "Ради покаяния этот персонаж отрекается от жестокости, и страх, который она вселяла в людей, постепенно сходит на нет."
 pam_sf_penance_stubborn_modifier: "Преодоление упрямства"
 pam_sf_penance_stubborn_modifier_desc: "Ради покаяния этот персонаж учится бороться со своим упрямством, уступая там, где прежде ни за что бы не уступил."
 pam_sf_penance_fickle_modifier: "Постоянство духа"
 pam_sf_penance_fickle_modifier_desc: "Этот персонаж старается обрести постоянство ради искупления своего переменчивого настроения, хотя такое самоограничение его тяготит."
 pam_sf_penance_eccentric_modifier: "Следование обычаям"
 pam_sf_penance_eccentric_modifier_desc: "Ради покаяния этот персонаж отказывается от странных мыслей и учится следовать общепринятым нормам."
 pam_sf_penance_vengeful_modifier: "Практика прощения"
 pam_sf_penance_vengeful_modifier_desc: "Ради покаяния этот персонаж отпускает старые обиды и отказывается от мстительности, из-за чего мягче обращается с пленниками и не так охотно отвечает на нападки."
 pam_sf_penance_forgiving_modifier: "Злопамятность"
 pam_sf_penance_forgiving_modifier_desc: "Этот персонаж надолго запоминает своих обидчиков и ставит месть выше прощения, как того и требует его вера, поэтому становится холоднее и страшнее для окружающих."
 pam_mystical_birthright_spiritual_leader_modifier: "Благоприятное рождение"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Врождённая особенность повлияла на духовное развитие этого персонажа."
 pam_personal_sacrifice_of_wealth_county_modifier: "Благочестивое пожертвование"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "Щедрое подаяние правителя способствует развитию этой державы."
 pam_sf_grinding_modifier: "Бездушный труд"
 pam_sf_grinding_modifier_desc: "Этот персонаж трудится, не жалея себя, но его душа страдает от этого."
