 #Interaction reference tooltips
 pam_estate_interaction_tt_demand_child_as_monk_interaction: "Потребовать, чтобы персонаж отдал вам своего [Concept('child', 'ребёнка')|E], потомка или несовершеннолетнего [Concept('courtier', 'придворного')|E] под своей опекой. Этот ребёнок станет вашим #TOOLTIP:GAME_TRAIT,devoted,$CHARACTER_ID$ #L ревностным#!#! [Concept('courtier', 'придворным')|E] и будет лишён права [Concept('succession', 'наследования')|E]."
 pam_estate_interaction_tt_demand_church_succession_interaction: "Если персонаж покинет сей бренный мир без законного наследника, то я получу его земли как [Concept('fallback_heir', 'резервный наследник')|E]."
 pam_estate_interaction_tt_demand_divorce_interaction: "Потребовать, чтобы персонаж расторг брак под предлогом того, что он оскорбляет [Concept('faith', 'конфессию')|E] — будь то правда или надуманное обвинение."
 pam_estate_interaction_tt_ecclesiastic_consecrate_kingdom_interaction: "Создать новое [Concept('kingdom', 'королевство')|E] для персонажа, взамен получив [Concept('hook', 'рычаг влияния')|E] на него"
 pam_estate_interaction_tt_ecclesiastical_bestow_title_interaction: "Использовать свою духовную власть, чтобы даровать персонажу несуществующий в данный момент [Concept('title', 'титул')|E] и тем самым потенциально повысить его [Concept('rank', 'ранг')|E]"
 pam_estate_interaction_tt_influence_papal_vote_interaction: "Настоять, чтобы персонаж отдал свой голос [Concept('cardinal', 'кардинала')|E] за нужного вам кандидата"
 pam_estate_interaction_tt_pam_evangelize_personal_tenet_interaction: "Проповедовать персонажу свой [Concept('personal_tenet', 'личный принцип')|E], чтобы он также принял его"
