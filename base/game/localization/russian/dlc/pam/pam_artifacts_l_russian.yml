l_russian:
 artifact_pedestal_bible_name: "Библия $artifact_name_prefix$"
 artifact_pedestal_bible_description: "Иллюстрированная Библия в драгоценном переплёте, каждый стих терпеливо и набожно переписан от руки."
 artifact_pedestal_thurible_name: "Кадило $artifact_name_prefix$"
 artifact_pedestal_thurible_description: "Великолепное резное кадило на полированный цепях. При возжигании ото наполняет зал ароматом благовоний, уносящих молитвы к небесам."
 artifact_pedestal_situla_name: "Ситула $artifact_name_prefix$"
 artifact_pedestal_situla_description: "Богато украшенный сосуд для святой воды. Его несут в ходе процессий, чтобы окроплять верующих благословением."
 artifact_pedestal_crozier_name: "Жезл $artifact_name_prefix$"
 artifact_pedestal_crozier_description: "Пастуший посох епископа, изготовленный по образу пастушьего крюка, чтобы вести верующих и возвращать заблудших на путь истинный."
