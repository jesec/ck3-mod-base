 situation_parameter_the_christian_church_ghw_cooldown_reset: "Таймер [Concept('great_holy_war', 'великой священной войны')|E] сбрасывается с началом [Concept('the_christian_church_chapter_short', 'этапа развития церкви')|E]"
 situation_parameter_the_christian_church_better_indulgences: "[Concept('character_interaction', 'Взаимодействие')|E] «#high $seek_indulgences_interaction$#! стоит на #P 25%#! дешевле и приносит больше [Concept('piety', 'благочестия')|E]"
