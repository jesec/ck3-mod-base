 situation_parameter_the_christian_church_reduced_elevation_request_cost: "Стоимость [Concept('character_interaction', 'взаимодействия персонажа')|E] «$request_elevation_interaction$» снижена на #P 25%#!"
 situation_parameter_the_christian_church_cheaper_ecumenical_councils: "Проведение #TOOLTIP:ACTIVITY_TYPE,activity_ecumenical_council#L вселенского собора#!#! обходится дешевле, а вероятность, что он будет проведён, увеличена"
 situation_parameter_the_christian_church_cheaper_religious_wars: "Объявление [Concept('war', 'войны')|E] вида «#V $minor_religious_war$#!», «#V $religious_war$#!» или «#V $major_religious_war$#!» стоит на #P 25%#! дешевле"
 situation_parameter_the_christian_church_incite_holy_war_interaction: "[Concept('character_interaction', 'Взаимодействие')|E] «[ecclesiastic_incite_holy_war_interaction|E]» даёт @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E], обладает сниженными требованиями и гораздо чаще используется [Concept('head_of_faith', 'главой конфессии')|E]"
 situation_parameter_the_christian_church_cheaper_bulls: "[Concept('head_of_faith', 'Глава конфессии')|E] может принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('enact_a_bull_decision').GetName]» за #P 50%#! стоимости"
 situation_parameter_clergy_can_marry: "[Concept('rulers', 'Правители')|E] [Concept('clergy', 'духовенства')|E] могут [Concept('marry', 'вступать в брак')|E]"
 situation_parameter_the_christian_church_county_conversion_bonus: "[Concept('councillor_task', 'Задание совета')|E] «#high $task_conversion$#!» будет продвигаться на #P 50%#! быстрее"
