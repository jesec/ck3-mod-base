 situation_parameter_the_christian_church_free_humiliation_cb: "[Concept('secular_rulers', 'Светские правители')|E] могут бесплатно использовать [Concept('casus_belli', 'казус белли')|E] #high «[GetCasusBelliType('pam_humiliation_cb').GetName]»#!"
 situation_parameter_the_christian_church_easier_claims_from_hof: "[Concept('head_of_faith', 'Глава конфессии')|E] охотнее соглашается на просьбы о предоставлении [Concept('claim', 'претензий')|E]"
