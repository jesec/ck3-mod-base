 the_christian_church_fragile_unity_situation_phase: "$fragile_unity$"
 fragile_unity: "Хрупкое единство"
 fragile_unity_icon: "@pam_the_christian_church_fragile_unity_icon! $fragile_unity$"
 fragile_unity_desc: "Христианскому миру необходим единый престол, который обеспечивал бы всеобщее послушание. Каждый король, епископ и еретик утверждает, что его устами вещает Бог; однако никто не торопится слушать."
 the_christian_church_saeculum_obscurum_situation_phase: "$saeculum_obscurum$"
 saeculum_obscurum: "Темный век"
 saeculum_obscurum_icon: "@pam_the_christian_church_saeculum_obscurum_icon! $saeculum_obscurum$"
 saeculum_obscurum_desc: "Святой престол переживает тёмные времена: папство погрязло в грехе, а вопросы назначения решаются в постели власть имущих."
 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "Обращение"
 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "Эпоха новых крещений. Короли возводят кресты над речными крепостями и рыночными городами, торгаши и королевские армии состязаются за приграничье, а обращения одного-единственного правителя достаточно, чтобы за ним потянулся целый народ."
 reform_phase: "Реформы"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "Духовенство начинает вспоминать, что такое дисциплина, торжество закона и пуританское рвение. Само устройство христианства подвергается глубокому пересмотру, а чистота церкви зачастую измеряется объёмами пролитой крови."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 investiture_crisis: "Борьба за инвеституру"
 investiture_crisis_icon: "@pam_the_christian_church_investiture_crisis_icon! $investiture_crisis$"
 investiture_crisis_desc: "Корона и епископский жезл — два главных противника в борьбе за ключи от Царства Небесного.\n\nСветские покровители одаряют прелатов символами власти, а церковь отказывается признавать их легитимность."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "Следующий совет: [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "Время, оставшееся до того, как [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] достигнет пика и будет разрешена.\n\nПо истечении этого срока будет собран совет об инвеституре, на котором будет обсуждаться [Concept('doctrine', 'доктрина')|E] #TOOLTIP:DOCTRINE,doctrine_clerical_succession_conditional #L условного#!#! назначения духовенства. В зависимости от распределения голосов она будет заменена либо на #TOOLTIP:DOCTRINE,doctrine_clerical_succession_spiritual_fixed_appointment #L духовное и пожизненное#!#! назначение, либо на #TOOLTIP:DOCTRINE,doctrine_clerical_succession_spiritual_appointment #L духовное и сменяемое#!#!. Светские [Concept('rulers', 'правители')|E] могут вынудить [Concept('clergy', 'духовенство')|E] проголосовать иначе, обзаведясь [Concept('puppets', 'марионетками')|E] или воспользовавшись [Concept('casus_belli', 'казус белли')|E] «$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$»."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak Решающая позиция у церкви#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak Решающая позиция у правителей#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak Результат голосования висит на волоске#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "Прогресс [Concept('schism', 'раскола')|E]: [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0] / [Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "Показывает, насколько [GetRiteByKey('roman_rite').GetAdherentNamePlural|l] и [GetRiteByKey('byzantine_rite').GetAdherentNamePlural|l] своими распрями приближают христианскую церковь к [Concept('schism', 'Великому расколу')|E].\n\nЕсли вражда между ними станет непреодолимой, церковь может разделиться. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'christian_faith').GetAdjective] не может назначить [Concept('head_of_faith', 'главу конфессии')|E], пока [Concept('schism', 'Великий раскол')|E] не произойдёт или не будет предотвращён#!\n\n#help Прогресс увеличивается, когда:\n$BULLET_WITH_TAB$#TOOLTIP:ACTIVITY_TYPE,activity_ecumenical_council #L Вселенский собор#!#! голосует за удаление [Concept('core_tenet', 'догмата')|E] или [Concept('doctrine', 'доктрины')|E] из [Concept('rites', 'течения')|E]\n$BULLET_WITH_TAB$Перед дебатами #TOOLTIP:ACTIVITY_TYPE,activity_ecumenical_council #L Вселенского собора#!#! возникает конфликт между двумя течениями\n$BULLET_WITH_TAB$Разгорается [Concept('war', 'война')|E] между [Concept('kings', 'королями')|E] или правителями более высокого ранга, которые принадлежат к разным течениям внутри христианской церкви\n$BULLET_WITH_TAB$[Concept('holy_site', 'Святое место')|E] переходит из одного течения в другое\n$BULLET_WITH_TAB$Понижается статус [Concept('holy_site', 'святого места')|E] какого-либо течения\n$BULLET_WITH_TAB$[Concept('head_of_rite', 'Лидера течения')|E] убивают последователи другого течения#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "Следующий [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName|l] откроет [Concept('decisions', 'решения')|E] «[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]» и «[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]», а также [Concept('interaction', 'взаимодействие')|E] #V «$pam_sway_schism_stance_interaction$»#!"
 pam_great_schism_decision_taken: "[Concept('schism', 'Великий раскол')|E] произошёл или был предотвращён"
