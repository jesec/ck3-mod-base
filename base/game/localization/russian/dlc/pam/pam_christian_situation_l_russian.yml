 situation_parameter_the_christian_church_levy_the_tithes_decision: "Можно принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_levy_the_tithes_decision').GetName]»"
 situation_parameter_the_christian_church_withdraw_funds_from_treasury_decision: "Может принимать [Concept('decision', 'решение')|E] «[GetDecisionWithKey('extract_gold_from_treasury').GetName]»"
