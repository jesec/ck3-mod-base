 situation_parameter_the_christian_church_legatine_mission: "Можно принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_send_legatine_mission_decision').GetName]»"
 situation_parameter_the_christian_church_reform_monastic_endowment: "Можно принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_reform_monastic_endowment_decision').GetName]»"
