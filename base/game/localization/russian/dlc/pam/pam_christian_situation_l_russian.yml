 situation_parameter_the_christian_church_mild_centralization: "Слабая централизация: [Concept('subordinates', 'подчинённые')|E] платят #V 10%#! от дохода с [Concept('church_holding', 'церковных владений')|E] своему [Concept('religious_superior', 'вышестоящему духовному лицу')|E]"
 situation_parameter_the_christian_church_strong_centralization: "Сильная централизация: [Concept('subordinates', 'подчинённые')|E] платят #V 20%#! от дохода с [Concept('church_holding', 'церковных владений')|E] своему [Concept('religious_superior', 'вышестоящему духовному лицу')|E] и #V 1%#! непосредственно [Concept('head_of_faith', 'главе конфессии')|E]"
 situation_parameter_the_christian_church_personal_secular_obligations: "Личные обязательства: светские правители получают до #P 25%#! от дохода [Concept('church_holding', 'церковных владений')|E] в зависимости от мнения [Concept('realm_priest', 'державного священника')|E] и (или) [Concept('hooks', 'влияния')|E] на него"
