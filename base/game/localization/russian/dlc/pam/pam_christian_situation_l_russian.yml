 situation_parameter_the_christian_church_holy_site_poi_bonus: "Посещение мест, считающихся [Concept('holy_sites', 'святыми')|E] в той же [Concept('faith', 'конфессии')|E], даёт [Concept('lifestyle_experience', 'жизненный опыт')|E] [Concept('learning', 'учёности')|E] и опыт свойства «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]»"
 situation_parameter_the_christian_church_conquest_cb_enabled: "[Concept('secular_rulers', 'Светские правители')|E] получают [Concept('casus_belli', 'казус белли')|E] «Завоевание» против [Concept('faith_hostile', 'враждебных')|E] [Concept('faiths', 'конфессий')|E]"
 pam_conquest_cb_hostile_faith_requirement: "Вести завоевательные войны можно только против [Concept('faiths', 'конфессий')|E], считающихся [Concept('faith_hostile', 'враждебными')|E]"
 pam_the_christian_church_cheaper_religious_wars_desc: "[Concept('the_christian_church_chapter_short', 'Этап развития')|E] христианской церкви"
 the_christian_church_military_effects: "Война"
