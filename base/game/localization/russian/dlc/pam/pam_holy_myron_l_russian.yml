l_russian:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "Флакон священного мира"
 pam_holy_myron_artifact_desc_common: "Запечатанный сосуд с освящённым миром: [Glossary('меккский бальзам','pam_myron_gloss_balsam')], пропитанный чистым оливковым маслом. В миро добавлена капелька из предыдущей партии — так цепочка благословлений не прекращается со времён апостолов."
 pam_holy_myron_artifact_desc_masterwork: "Запечатанный сосуд с освящённым миром: [Glossary('меккский бальзам','pam_myron_gloss_balsam')], [Glossary('ладан','pam_myron_gloss_frankincense')] и [Glossary('смирна','pam_myron_gloss_myrrh')], пропитанные чистым оливковым маслом. В миро добавлена капелька из предыдущей партии — так цепочка благословлений не прекращается со времён апостолов."
 pam_holy_myron_artifact_desc_famed: "Запечатанный сосуд с освящённым миром: [Glossary('меккский бальзам','pam_myron_gloss_balsam')], [Glossary('ладан','pam_myron_gloss_frankincense')], [Glossary('смирна','pam_myron_gloss_myrrh')], [Glossary('нард','pam_myron_gloss_spikenard')] и [Glossary('корица','pam_myron_gloss_cinnamon')], пропитанные чистым оливковым маслом. В миро добавлена капелька из предыдущей партии — так цепочка благословлений не прекращается со времён апостолов."
 pam_holy_myron_artifact_desc_illustrious: "Запечатанный сосуд с освящённым миром, изготовленным в полном соответствии с древнейшими рецептами: [Glossary('меккский бальзам','pam_myron_gloss_balsam')], [Glossary('ладан','pam_myron_gloss_frankincense')], [Glossary('смирна','pam_myron_gloss_myrrh')], [Glossary('нард','pam_myron_gloss_spikenard')], [Glossary('корица','pam_myron_gloss_cinnamon')], [Glossary('аир','pam_myron_gloss_calamus')] и [Glossary('кассия','pam_myron_gloss_cassia')], пропитанные чистым оливковым маслом. В миро добавлена капелька из предыдущей партии — так цепочка благословлений не прекращается со времён апостолов."
 pam_holy_myron_charges_line: "Осталось помазаний: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "Меккский бальзам: ароматная смола, источаемая небольшими кустарниками, что выращивают в Иерихоне и Эйн-Геди близ Мёртвого моря. Самое дорогое благовоние древнего мира. Этот главный ингредиент мира, такие кустарники тщательно охраняются и не растут больше нигде."
 pam_myron_gloss_frankincense: "Золотистая смола из узловатых деревьев, что растут почти исключительно на юге Аравии. Её жгут перед алтарями с незапамятных времён, она подслащивает миро, а дым этой смолы уносит молитвы в небо."
 pam_myron_gloss_myrrh: "Горькая, кроваво-красная смола, добываемая из шипастых деревьев юга Аравии и Африканского Рога. В книге Исход она названа среди составляющих священного мира, волхвы подарили её младенцу Иисусу, верующие возложили её на могилу Иисуса."
 pam_myron_gloss_spikenard: "Тяжёлое, сладковатое масло, выжимаемое из корней растения, что растёт лишь на высоких восточных горах и свозится в порты Индии. Им Иисус был помазан в Вифании — его ученики тогда возмутились трате дорогого масла."
 pam_myron_gloss_cinnamon: "Сладкая внутренняя кора деревьев, что растут в Индии и на островах за ней. В книге Исход она названа среди составляющих священного мира. Прежде чем добраться до христианских алтарей, она пересекает полмира."
 pam_myron_gloss_calamus: "Сладкий, ароматный тростник из священного писания, собираемый на восточных болотах. В книге Исход он названа среди составляющих священного мира."
 pam_myron_gloss_cassia: "Грубая кора сродни корице, соскабливаемая с деревьев дальних стран Востока. В книге Исход она названа среди составляющих священного мира."
 ### Modifiers
 pam_holy_myron_vessel_modifier: "Сосуд со священным миром"
 pam_holy_myron_vessel_modifier_desc: "В этом сосуде находится освящённое миро, за владельцем следует шлейф запаха — то благоухает [Glossary('меккский бальзам','pam_myron_gloss_balsam')]."
 pam_holy_myron_vessel_potent_modifier: "Сосуд с благоухающим священным миром"
 pam_holy_myron_vessel_potent_modifier_desc: "В этом сосуде находится миро редкой благодати, сам его аромат говорит о святости — то благоухают [Glossary('ладан','pam_myron_gloss_frankincense')] и [Glossary('нард','pam_myron_gloss_spikenard')]."
 pam_chrismated_artifact_modifier: "Миропомазание"
 pam_chrismated_artifact_modifier_desc: "Этот артефакт умащен святым миром, на нём стойко держится аромат — то благоухает [Glossary('смирна','pam_myron_gloss_myrrh')]."
 pam_chrismated_regalia_modifier: "Миропомазанная регалия"
 pam_chrismated_regalia_modifier_desc: "При коронации этот артефакт был помазан святым миром и сила благословения с тех пор ничуть не ослабла."
 pam_holy_myron_pilgrim_modifier: "Носитель бальзамов"
 pam_holy_myron_pilgrim_modifier_desc: "Этот персонаж странствует в поисках элементов для создания святого мира. Ему нужны [Glossary('бальзам','pam_myron_gloss_balsam')], [Glossary('ладан','pam_myron_gloss_frankincense')] и более редкие благовония. В своих странствиях он крайне осмотрителен."
 pam_chrismated_child_modifier: "Миропомазание"
 pam_chrismated_child_modifier_desc: "Этот персонаж был миропомазан вскоре после рождения, одарён благосклонностью Святого Духа, что хранилась в благословенном масле."
 pam_myron_chrismated_child_modifier: "Помазан священным миром"
 pam_myron_chrismated_child_modifier_desc: "Этот персонаж был миропомазан вскоре после рождения священным миром, лба новорождённого коснулся [Glossary('меккский бальзам','pam_myron_gloss_balsam')]. Такое помазание никогда не утратит силу."
 pam_anointed_with_holy_oil_modifier: "Елеосвящение"
 pam_anointed_with_holy_oil_modifier_desc: "Этот персонаж был миропомазан для укрепления сил. [Glossary('Бальзам','pam_myron_gloss_balsam')] коснулся его лба и рук, чтобы излечить тело и душу, помочь вынести тяготы."
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "Приготовить священное миро"
 pam_prepare_holy_myron_decision_tooltip: "Отправить своего [Concept('court_chaplain', 'придворный капеллан')|E] собрать редкие бальзамы и освятить #V флакон священного мира#!, [Concept('artifact', 'артефакт')|E], расходуемый на священные помазания."
 pam_prepare_holy_myron_decision_desc: "Священное миро нельзя делать из чего попало. В Писании перечислены составляющие: [Glossary('смирна','pam_myron_gloss_myrrh')], сладкая [Glossary('корица','pam_myron_gloss_cinnamon')], [Glossary('аир','pam_myron_gloss_calamus')] и [Glossary('кассия','pam_myron_gloss_cassia')] в чистом оливковом масле. Каждый ингредиент должен быть привезён из тех земель, где он произрастает.\n\nЧем дальше отправится экспедиция, тем богаче будет смесь, что вернётся домой на освящение. Дорога, однако же, обещает быть долгой и опасной — бандиты и болезни могут уменьшить запасы мира или лишить жизни его перевозчика."
 pam_prepare_holy_myron_decision_confirm: "Отправить экспедицию"
 pam_prepare_holy_myron_decision_needs_chaplain: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] должен быть доступным взрослым, не отправленным в данный момент в поход"
 pam_prepare_holy_myron_decision_already_owned: "У вас не должно быть флакона священного мира"
 pam_prepare_holy_myron_decision_journey_underway: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] уже собирает бальзамы"
 pam_prepare_holy_myron_decision_levant_name: "Меккский бальзам"
 pam_prepare_holy_myron_decision_levant_desc: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] собирает вещество, что носит название «[Glossary('Меккский бальзам','pam_myron_gloss_balsam')]», добыть его можно в регионе #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! — это будет экспедиция с одним пунктом назначения, она даст вам самую простую смесь.\n\nДаёт [Concept('common', 'обычный')|E] флакон священного мира."
 pam_prepare_holy_myron_decision_arabia_name: "Бальзам и ладан"
 pam_prepare_holy_myron_decision_arabia_desc: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] собирает следующие ингредиенты: [Glossary('бальзам','pam_myron_gloss_balsam')] в регионе #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, затем [Glossary('ладан','pam_myron_gloss_frankincense')] и [Glossary('смирну','pam_myron_gloss_myrrh')] в регионе #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! — это две остановки по дороге благовоний.\n\nДаёт [Concept('masterwork', 'мастерский')|E] флакон священного мира."
 pam_prepare_holy_myron_decision_india_name: "Все священные ингредиенты"
 pam_prepare_holy_myron_decision_india_desc: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] собирает следующие ингредиенты: [Glossary('бальзам','pam_myron_gloss_balsam')] в регионе #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('ладан','pam_myron_gloss_frankincense')] и [Glossary('смирну','pam_myron_gloss_myrrh')] в регионе #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, а также [Glossary('нард','pam_myron_gloss_spikenard')] и [Glossary('корицу','pam_myron_gloss_cinnamon')] в регионе #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Путь предстоит долгий.\n\nДаёт [Concept('famed', 'известный')|E] флакон священного мира. Если ваш [Concept('court_chaplain', 'придворный капеллан')|E] досконально следует старым рецептам, то с шансом в #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#!, масштабируемым с ростом [Concept('learning', 'учености')|E] капеллана, миро может получиться [Concept('illustrious', 'выдающимся')|E]."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "У вас должна быть возможность выделить [gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] ед. [Concept('gold', 'золота')|E]"
 pam_prepare_holy_myron_decision_afford_india_tt: "У вас должна быть возможность выделить [gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] ед. [Concept('gold', 'золота')|E]"
 pam_prepare_holy_myron_journey_toast: "Экспедиция за священным миром начинается"
 pam_prepare_holy_myron_journey_toast_tt: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] отправляется на поиски ингредиентов для священного мира"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] отправляется в регион #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. По возвращении будет освящён [Concept('common', 'обычный')|E] флакон мира — если путников пощадит дорога."
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] отправляется в регионы #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! и #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. По возвращении будет освящён [Concept('masterwork', 'мастерский')|E] флакон мира — но бандиты и дорожные неурядицы могут убавить запасы благовоний."
 pam_prepare_holy_myron_decision_india_effect_tt: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] отправляется в регионы #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! и #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. По возвращении будет освящён [Concept('famed', 'известный')|E] флакон мира, или, с вероятностью #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#![Concept('illustrious', 'выдающийся')|E] — но бандиты и дорожные неурядицы могут убавить запасы благовоний."
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0011.desc_levant: "Я пишу с берегов Мёртвого моря, где [Glossary('меккский бальзам','pam_myron_gloss_balsam')] сочится из надрезанной коры, словно золотые слёзы. Сбивать цену садовники не желают, но смола того стоит — одна её капля на запястье заполняет ароматом целую комнату. Первый ингредиент добыт."
 pam_holy_myron.0011.desc_arabia: "Дорога за благовониями была длинной, колодцы на ней попадались редко, но в Дофаре оказалось то, что нам и было нужно: [Glossary('ладан','pam_myron_gloss_frankincense')], бледный, словно утренний лёд, и [Glossary('смирна','pam_myron_gloss_myrrh')], тёмная, как застарелая кровь. Караванщики здесь говорят, что лучшей смолы не сыщешь ни в одном порту мира. Мы им поверили и заплатили, не скупясь."
 pam_holy_myron.0011.desc_india: "Морской переход дался нам тяжело, но зато рынки Малабара таили в себе чудеса. Там есть [Glossary('нард','pam_myron_gloss_spikenard')] с высоких гор и [Glossary('корица','pam_myron_gloss_cinnamon')], слаще всего, что мне доводилось пробовать. Мы раздобыли последние ингредиенты. Пора возвращаться домой."
 pam_holy_myron.0011.a: "Пусть же остаток пути будет лёгким."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], случилась беда."
 pam_holy_myron.0012.desc: "Дорогу преградили вооружённые люди. Они называют себя взимателями пошлины, хотя ни один правитель не дал им такого права. Они сосчитали наши сундуки, узнали стоимость груза и готовы пропустить нас дальше беспрепятственно за определённую мзду.\n\nЯ жду вашего решения и внимательно слежу за бальзамами."
 pam_holy_myron.0012.a: "Заплатите им. Миро дороже денег."
 pam_holy_myron.0012.b: "Церковные деньги не должны достаться бандитам."
 pam_holy_myron.0012.b.tt: "Разбойники отнимут часть собранных бальзамов, и у священного мира, что получится в итоге, #N снизится качество#!"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0013.desc: "В дороге меня застала болезнь. Я пишу это письмо трясущейся рукой, а жена трактирщика пытается отпоить меня тремя разными лекарствами, каждое из которых гаже предыдущего. За бальзамы не опасайтесь, они сухие, надёжно запечатаны и охраняются лучше, чем я. Я продолжу путь, как только смогу держаться на ногах."
 pam_holy_myron.0013.a: "Я буду молиться за [Select_CString(myron_chaplain.IsFemale, 'неё', 'него' )]"
 pam_holy_myron_journey_abandoned_toast: "Экспедиция за священным миром прекращена"
 pam_holy_myron.0020.t: "Путешествие закончено"
 pam_holy_myron.0020.desc: "Письмо от торговца приносит мне новости: [myron_chaplain.GetTitledFirstName], [Select_CString(myron_chaplain.IsFemale, 'которая отправлялась', 'который отправлялся' )] по моему приказу в путь за ингредиентами священного мира, [Select_CString(myron_chaplain.IsFemale, 'скончалась', 'скончался' )] вдали от дома. Бальзамы разошлись по чужим рукам, и теперь ни мои деньги, ни [Select_CString(myron_chaplain.IsFemale, 'её', 'его' )] старания не дадут никаких результатов."
 pam_holy_myron.0020.a: "Да упокоит [Select_CString(myron_chaplain.IsFemale, 'её', 'его' )] [ROOT.Char.GetFaith.HighGodName]."
 pam_holy_myron.0100.t: "Освящение мира"
 pam_holy_myron.0100.desc.intro: "[Select_CString(myron_chaplain.IsFemale, 'Замученная', 'Замученный' )] дорогой [myron_chaplain.GetTitledFirstName] наконец возвращается ко мне, и весь двор слышит аромат драгоценного груза раньше, чем видит его. За закрытыми дверями ингредиенты смешиваются и капля старого мира добавляется в новое, как это повелось со времён апостолов.\n\n"
 pam_holy_myron.0100.desc_full: "Все ингредиенты пережили дорогу. Золотистое и ароматное готовое миро переливается во флакон и ставится перед моим алтарём."
 pam_holy_myron.0100.desc_robbed: "Значительная часть ингредиентов была утеряна в пути и смесь оказалась слабее, чем мы надеялись — но освящение довершило то, чего не хватило после путешествия, и флакон так или иначе оказался перед моим алтарём."
 pam_holy_myron.0100.a: "Черёд благословений сохранён."
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "Последнее помазание"
 pam_holy_myron.0200.desc: "Скорбящие расступаются, давая мне пройти к катафалку. Передо мной [pam_holy_myron_artifact.GetName]. На глазах у собравшихся придворных свершится священное помазание и [deceased.GetTitledFirstName] предстанет перед троном, где восседает [ROOT.Char.GetFaith.HighGodName], как [Select_CString(deceased.IsFemale, 'одна', 'один' )] из помазанных. Все, кто сейчас здесь, увидят оказанную [Select_CString(deceased.IsFemale, 'ей', 'ему' )] честь и расскажут о ней другим. И всё же, каждая капля, потраченная на усопших — это та капля, которая не достанется живым."
 pam_holy_myron.0200.a: "[deceased.GetFirstNameNoTooltip] заслуживает помазания."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#! с большей вероятностью будет [Select_CString(deceased.IsFemale, 'причислена', 'причислен' )] к лику святых"
 pam_holy_myron.0200.b: "Миро надо беречь для живых."
 pam_holy_myron.0200.b.tt: "Вы сохраняете святое миро для тех, кого ещё можно благословить"
 ### Spending the oil
 pam_holy_myron_spend_tt: "Потрачена одна порция из вашего флакона священного мира"
 pam_holy_myron_spend_last_tt: "Потрачена #N последняя#! порция из вашего флакона священного мира. Опустевший флакон будет #N утерян#!"
 pam_holy_myron_vessel_spent_toast: "Флакон опустел"
 pam_holy_myron_vessel_spent_tt: "Из флакона вылита последняя капля мира и сам он вам уже не нужен"
 ### Coronation
 pam_holy_myron_coronation_option: "Пусть священное миро благословит эту корону."
 pam_holy_myron_coronation_option.flavor: "Потратить порцию священного мира на ваше собственное помазание."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nПри коронации этот артефакт был помазан святым миром и сила благословения с тех пор ничуть не ослабла."
 pam_holy_myron_coronation_memory: "помазан священным миром"
 pam_holy_myron_coronation_memory_desc: "На моей коронации [anointer.GetTitledFirstName] [Select_CString(anointer.IsFemale, 'помазала', 'помазал' )] меня знаменитым священным миром."
 pam_holy_myron_coronation_memory_desc_second_perspective: "на вашей коронации [anointer.GetTitledFirstName] [Select_CString(anointer.IsFemale, 'помазала', 'помазал' )] вас знаменитым священным миром."
 pam_holy_myron_coronation_memory_desc_third_perspective: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'была помазана', 'был помазан' )] знаменитым священным миром на своей коронации."
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "Помазать артефакт священным миром"
 pam_anoint_artifact_decision_tooltip: "Потратить порцию священного мира, чтобы помазать один из ваших [Concept('artifacts', 'артефактов')|E], сделав его [Concept('sanctified', 'освящённым')|E] без оглядки на принятые у вас догматы"
 pam_anoint_artifact_decision_desc: "Миро не спрашивает дозволения у церкви. Всё, чего оно касается, — будь то клинок, книга, украшение, — становится [Concept('sanctified', 'освящённым')|E] для #L [ROOT.Char.GetFaith.GetName|l]ой#! веры силой самого мира, и ни один догмат или епископ не может этого отменить."
 pam_anoint_artifact_decision_confirm: "Помазать"
 pam_anoint_artifact_decision_no_item_selected: "Не выбран [Concept('artifact', 'артефакт')|E]"
 pam_anoint_artifact_needs_myron_tt: "Нужен #V флакон священного мира#!, в котором ещё осталось миро"
 pam_anoint_artifact_has_eligible_artifact_tt: "Необходимо владеть [Concept('artifact', 'артефактом')|E], который ещё не [Concept('sanctified', 'освящён')|E]"
 pam_anoint_artifact_not_myron_tt: "Нельзя помазать священное миро им же"
 pam_anoint_artifact_not_already_chrismated_tt: "Артефакт не должен быть уже помазанным"
 pam_anoint_artifact_toast: "Помазанный артефакт"
 pam_chrismated_artifact_name: "Помазанный артефакт: [pam_anointed_artifact.GetNameNoTooltip]"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\nПоверхность этой реликвии блестит от покрывающего её священного мира."
 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "Даровать священное миро"
 pam_give_holy_myron_interaction_desc: "Вы наполните чистый флакон священным миром из своего сосуда и даруете его персонажу [recipient.GetShortUIName]. Ваш запас мира уменьшится на одну меру, но вы приобретёте [Concept('piety', 'благочестие')|E] и благодарность персонажа [recipient.GetShortUIName]."
 pam_give_holy_myron_recipient_toast: "Дарование священного мира"
 pam_give_holy_myron_recipient_tt: "Вы получите [Concept('common', 'обычный')|E] флакон священного мира — [Concept('artifact', 'артефакт')|E], содержащий одну меру этого вещества"
 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "Миропомазание новорожденных"
 pam_holy_myron_unction_toast: "Соборование болящих"
 pam_holy_myron.0300.t: "Печать дара духа святого"
 pam_holy_myron.0300.desc: "[Select_CString(child.IsFemale, 'Моя дочь', 'Мой сын' )] [child.GetFirstName] заливается плачем, когда [myron_officiant.GetFaith.PriestNeuter] берёт [Select_CString(child.IsFemale, 'её', 'его' )] на руки, а служки вносят елей.\n\nУ церкви его хватит на всех новорожденных, но у меня есть собственный флакон со священным миром, одна блестящая капля которого станет печатью, скрепляющей судьбу ребёнка."
 pam_holy_myron.0300.desc_twin: "\n\nНо в этот раз миро отметит сразу два младенческих лба — [pam_myron_twin.GetFirstName] лежит рядом в ожидании такой же печати."
 pam_holy_myron.0300.a: "Довольно и церковного елея."
 pam_holy_myron.0300.b: "Без священного мира тут не обойтись."
