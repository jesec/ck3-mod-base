 pam_ephesians_6_11_greek: "[Glossary('Endýsasthe ten panoplían toũ theoũ pròs tò dýnasthai hymãs stẽnai pròs tàs methodeías toũ diabólou', 'EPHESIANS_6_11_GREEK_GLOSS')]" #ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου
 pam_2_timothy_2_3_greek: "[Glossary('Synkakopάthēson hōs kalòs stratiotēs Christoũ Iēsoũ.', '2_TIMOTHY_2_3_GREEK_GLOSS')]" #συνκακοπάθησον ὡς καλὸς στρατιώτης Χριστοῦ Ἰησοῦ.
 pam_1_timothy_6_12_greek: "[Glossary('Agōnízou tòn kalòn agõna tẽs písteōs, epilaboũ tẽs aiōníou zōẽs eis hen eklethēs kaì hōmológēsas ten kalen homologían enopion pollõn martýrōn.', '1_TIMOTHY_6_12_GREEK_GLOSS')]" #ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
 # Scholasticism Tenet
 pam_proverbs_1_7_greek: "[Glossary('Arkhe sophías phóbos Kyríou; sýnesin dè agathen pántes hoi poioũntes auten.','PROVERBS_1_7_GREEK_GLOSS')]" #ἀρχὴ σοφίας φόβος Κυρίου· σύνεσιν δὲ ἀγαθὴν πάντες οἱ ποιοῦντες αὐτήν.
 pam_colossians_2_3_greek: "[Glossary('En ho eisin pántes hoi thēsauroì tẽs sophías kaì gnoseōs apókryphoi.', 'COLOSSIANS_2_3_GREEK_GLOSS')]" #ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας καὶ γνώσεως ἀπόκρυφοι.
 pam_james_1_5_greek: "[Glossary('Ei dé tis hymõn leípetai sophías, aiteítō parà toũ didóntos theoũ pãsin haplõs kaì me oneidízontos, kaì dothesetai auto.', 'JAMES_1_5_GREEK_GLOSS')]" #εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ.
 # Alexandrian Catechism Tenet
 pam_1_corinthians_1_30_greek: "[Glossary('Ex autoũ dè hymeĩs este en Christo Iēsoũ, hòs egenethē sophía hēmĩn apò theoũ, dikaiosýnē te kaì hagiasmos kaì apolýtrōsis', '1_CORINTHIANS_1_30_GREEK_GLOSS')]" #ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη σοφία ἡμῖν ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις
 # Adoptionism Tenet
