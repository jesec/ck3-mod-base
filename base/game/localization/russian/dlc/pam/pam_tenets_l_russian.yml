 tenet_love_thy_neighbour_modifier_desc: "Любовь к ближнему неотделима от любви к Богу, и через дела милосердия и сострадания мы исполняем Божественный закон."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "Divinum Officium" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "Theía Leitourgía" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "Божественная литургия"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "Священная литургия есть небо, явленное на земле, где мы соединяемся с ангелами и святыми в вечном поклонении. Свят, Свят, Свят Господь Саваоф! Вся земля полна славы Его!\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Историческая справка о Divinum Officium','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "В Божественной литургии верующие участвуют в небесном богослужении, выходя за пределы времени и пространства, чтобы предстать перед престолом Божьим вместе с херувимами и серафимами.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Историческая справка о Theía Leitourgía','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "Литургия является высшим выражением веры, где встречаются небо и земля, а верующие вместе с ангелами и святыми участвуют в вечном поклонении Богу.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Историческая справка о Божественной литургии','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "Божественная литургия выросла из древнейших христианских богослужений, а литургии святого Василия и святого Иоанна Златоуста со временем стали основными формами богослужения Восточной церкви. Эти литургии подчёркивали мистическое участие верующих в поклонении небесам: замысловатые обряды, фимиам, святые иконы и церковное пение создавали чувственное переживание присутствия Божественного. Литургия понималась не только как поклонение человека Богу, но и как вхождение верующих в вечное поклонение небесам, выходящее за границы времени и пространства."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "Даёт модификатор «[GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]»"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "Даёт модификатор «[GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]»\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "Ваш [Concept('court_chaplain', 'придворный капеллан')|E] получает #P +2#! к [Concept('learning', 'учёности')|E]"
 tenet_aniconism_latin_name: "Иконоборчество" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "О Господи, Ты один достоин поклонения. Сохрани нас от соблазна идолов, дабы мы поклонялись Тебе в духе и истине — не через рукотворные изображения, но через сердца чистые, вознесённые к Тебе.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Историческая справка об иконоборчестве','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "Почитание изображений не было зафиксировано ни в Священном Писании, ни в предании святых Отцов. Иконоборчество есть истинное учение Церкви, очищающее верующих от поклонения изображениям.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Историческая справка об Eikonomakhía','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "Не сотвори себе кумира и никакого изображения. Поклонение изображениям есть искажение истинной веры.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Историческая справка об Иконоборчестве','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "Избегание, запрещение и уничтожение религиозных изображений имеет глубокие корни в авраамических религиях. В христианстве наиболее значительным проявлением этого стал Первый византийский иконоборческий период (726–843 гг.). Начавшийся с подачи императора Льва III и продолжившийся в царствование императора Константина V, этот период в истории сопровождался массовым уничтожением священных образов и преследованием почитателей икон.\n\nИконоборцы утверждали, что почитание икон нарушает библейский запрет на поклонение идолам. Второй Никейский собор 787 года осудил иконоборчество, указывая на сходство между поклонением Богу посредством икон и посредством письменного Евангелия. В 814 году, при императоре Льве V, иконоборчество возродилось. Подобные иконоборческие настроения позднее появились и в ряде протестантских течений."
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "О, Христе, вечная Премудрость Божия, просвети разум наш, дабы мы могли постигать сокровенные тайны Твоего Священного Писания. Даруй нам очи видеть не только букву, но и дух, животворящий.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Историческая справка о Catechesis Alexandrina','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "Александрийская традиция утверждает, что Божественная мудрость раскрывается через аллегорическое толкование Писания. Христос есть Логос, Божественное слово, через Которое открывается всякая истина.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Историческая справка об Alexandrinē Katēkhēsis','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "Александрийская школа делает особый акцент на аллегорическом истолковании Писания и соединении христианского богословия с греческой философией, стремясь раскрыть сокровенные духовные смыслы, пребывающие за пределами буквального понимания текста.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Историческая справка об Александрийском катехизисе','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "Александрийская богословская школа, основанная в конце II века, была древнейшим христианским учреждением высшего образования. Под руководством Климента Александрийского и Оригена в ней был разработан сложный метод толкования Библии, стремившийся раскрывать аллегорические и духовные смыслы Священного Писания. Школа соединяла христианское богословие с платонической философией, утверждая, что греческая наука проложила дорогу для Евангелия.\n\nЭкзегетические методы и богословские размышления Оригена оказали огромное влияние на восточное христианство, а аллегорический метод Александрийской школы противопоставлялся более буквальному толкованию Евангелия Антиохийской школой."
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "Filius Adoptivus" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "Адопционизм"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "О Отче, призревший на праведного мужа Иисуса и избравший Его Себе, сподоби и нас быть достойными усыновления. Как Ты воздвиг Его из вод и нарёк Возлюбленным Твоим, так воздвигни и нас из уничижения нашего в Божественное семейство Твоё.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Историческая справка о Filius Adoptivus','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "О Боже, возвышающий смиренных и избирающий праведных для Себя, мы прославляем Тебя за таинство усыновления. Как Христос благодатью Твоею был возведён к Божественному сыновству, так и мы да будем причтены к числу чад Твоих.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Историческая справка о Hyiothesía','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "О, Господи, помоги нам уразуметь тайну возвышения Сына Твоего. Сподоби нас следовать примеру Его праведности, дабы и нас нарекли чадами Божьими.\n\n$pam_mark_1_11_default$\n\n[Glossary('Историческая справка об Адопционизме','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "Адопционисты считали, что Иисус родился обычным человеком и лишь позднее был «усыновлён» и принят в Божественное семейство как Сын Божий, обычно связывая этот момент с крещением, когда на него сошёл Святой Дух. Впервые это учение было сформулировано во II веке Феодотом Кожевником, проповедовавшим динамическое монархианство и подчёркивавшим единство Бога.\n\nВ VIII веке учение возникло в Испании благодаря архиепископу Толедо Элипанду и епископу Урхеля Феликсу, проводившим различие между божественной природой Христа как предвечно рождённой и Его человеческой природой как усыновлённой. Франкфуртский собор 794 года осудил испанский адопционизм как ересь. Однако некоторые его идеи позднее оказали влияние на антитринитарные течения."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "[Concept('interaction', 'Взаимодействие')|E] «[adopt|E]» доступно всегда, без необходимости выполнять обычные требования (но цель всё равно должна быть подходящей, и младший партнёр в браке не может усыновлять)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "[Concept('vassals', 'Вассалы')|E] и дети, принадлежащие к этому [Concept('rite', 'течению')|E], не возражают против [Concept('adopt', 'усыновления')|E] (нет штрафа к [Concept('opinion', 'мнению')|E] от #N −10#! до #N −25#!)"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "Вам всегда доступно [Concept('interaction', 'взаимодействие')|E] «[adopt|E]» без необходимости выполнять обычные требования (но цель всё равно должна быть подходящей)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "@legitimacy_icon![Concept('legitimacy', 'Легитимность')|E], @piety_icon![Concept('piety', 'благочестие')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовная реализация')|E] при [Concept('adopt', 'усыновлении или удочерении')|E] [Concept('character', 'персонажа')|E]"
 pam_adoptionism_adopt_sp_toast: "Личный принцип «[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )]»"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "[Concept('interaction', 'Взаимодействие')|E] «[Concept('legitimized_bastard', 'Признать бастарда')|E]» стоит на #P 50%#! меньше @prestige_icon![Concept('prestige', 'престижа')|E], если ваша [Concept('faith', 'конфессия')|E] допускает признание"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "[Concept('interaction', 'Взаимодействие')|E] «[Concept('legitimized_bastard', 'Признать бастарда')|E]» можно использовать по отношению к собственным [Concept('children', 'детям')|E], принадлежащим к другому [Concept('house', 'дому')|E], если ваша [Concept('faith', 'конфессия')|E] допускает признание"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "О, Господи, укрепи руки наши, когда мы принимаем крест в святое имя Твоё. Направь стопы наши на священном пути, дабы мы защищали веру и освобождали святые места из рук неверных.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Историческая справка о Peregrinatio Armata','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "Верующие призваны следовать за Христом, принимая крест не только в духовном смысле, но и буквально вставая на защиту святынь. Вооружённое паломничество есть акт благочестия; путь веры, охраняемый мечом.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Историческая справка об Énoplon Proskýnēma','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "Паломничество к святым местам есть священный долг, и верующие призваны охранять эти святыни и защищать своих собратьев-паломников в том числе, при необходимости, силой оружия.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Историческая справка о Вооруженных паломниках','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "Соединение духовного паломничества к святым местам с военным служением ради их защиты или освобождения. Крестовые походы, начавшиеся в 1095 году после призыва папы Урбана II на Клермонском соборе, стали наиболее организованной формой вооружённого паломничества. Крестоносцы получали полное прощение грехов, а их военная служба рассматривалась как акт покаяния и благочестия.\n\nЭта концепция опиралась на более ранние традиции покаянной войны и защиты христианского мира от внешних угроз, превращая паломничество из мирного странствия в воинствующее выражение веры."
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "Populus Dei" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "Laòs Theoũ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "Мы — род избранный, царственное священство, святой народ, люди, взятые Господом в удел, дабы возвещать совершенства Его и быть достойными звания нашего как народа Господня.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Историческая справка о Populus Dei','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "Призванные из тьмы в чудный Его свет, верующие составляют народ святой, принадлежащий Самому Господу. Наша сущность обретается во Христе, который сделал нас единым телом.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Историческая справка о Laòs Theoũ','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "Верующие соединены как избранный народ Божий, как община, отделённая от остального мира и имеющая общее предназначение и единство во Христе.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Историческая справка о Принадлежности к общине','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "Представление о Церкви как о «Народе Божием» восходит к ветхозаветному образу Израиля как избранного народа Божия, переосмысленному в Новом Завете. Первые христиане считали себя новым Израилем, объединённым не узами крови или происхождения, а верой во Христа.\n\nЭта принадлежность к общине вышла за социальные, этнические и национальные границы, породив всеобщее братство верующих. Догматическая конституция Второго Ватиканского собора «Lumen Gentium» (с лат.  —  «Свет народам») особо выделила образ «Народа Божия» как одно из центральных экклезиологических понятий, подчёркивая странствующий характер Церкви и общее достоинство всех крещёных."
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "Консоламентум"
 tenet_consolamentum_latin_desc: "О, Господи, подвигом добрым мы подвизались, течение совершили, веру сохранили. Прими ныне раба Твоего в утешение Духа Святого, да освободится душа от уз мира сего вещественного.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Историческая справка о Consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "Через возложение рук и молитву верных дух получает божественное утешение. Мы подвизались, течение совершили, веру сохранили.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Историческая справка о Paráklēsis','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "Через священное таинство духовного утешения верующие принимают Святого Духа и подготавливаются к переходу от земной жизни в жизнь будущего века.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Историческая справка о Консоламентуме','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "Консоламентум был главным таинством катарской веры, сочетавшим в себе элементы крещения, миропомазания, рукоположения и соборования. Через возложение рук он, по мнению катаров, даровал Дух Святой и освобождал душу от материального мира.\n\nБольшинство верующих принимали его лишь на смертном одре, а получившие его в здравии именовались «Perfecti» или «Bons Hommes» и посвящали себя жизни в строгой аскезе. Обряд восходил к раннехристианским практикам духовного крещения и, вероятно, испытал на себе влияние восточных богомильских традиций."
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "Hieròs Gámos" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "О, Господи, не для удовлетворения похоти соединены мы в этом священном союзе, но в чистоте сердца и истине. Даруй нам обрести милость и состариться вместе, сохраняя святость наших уз.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Историческая справка о Matrimonium Sacrum','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "Брак в общине верных сохраняет священное родство и поддерживает чистоту перед Богом. Не в похоти, но в истине благословляются такие союзы, дабы муж и жена обрели милость.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Историческая справка о Hieròs Gámos','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "Божественный брак внутри сообщества верных сохраняет духовную чистоту и святость религиозного рода из поколения в поколение.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Историческая справка о Божественном браке','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "Концепция божественного брака, или эндогамии, т. е. заключения браков исключительно внутри религиозной общины, восходит к глубокой древности и встречается во многих традициях. В зороастризме существовала практика браков между ближайшими родственниками («xwedodah»), целью которых было сохранение духовных заслуг и семейного имущества. Подобные союзы должны были обеспечивать религиозную чистоту, укреплять духовную власть и сохранять священные и царские роды.\n\nНесмотря на споры и непонимание со стороны окружающих, сами сторонники этого догмата рассматривали такие браки как исполнение божественных заповедей и средство сохранения святости своей общины."
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "О, премудрость Божия, от веков сокрытая, открой нам тайны мира духовного. Освободи души наши от оков мира материального, дабы мы могли вознестись к полноте света и знания.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Историческая справка о Gnosis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "Подлинное спасение приходит через гнозис — сокровенное знание Божественных тайн, сокрытых от мира материального. Мы возвещаем премудрость Божию в тайне, сокровенную, предопределённую прежде веков ко славе нашей.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Историческая справка о Gnõsis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "Спасение обретается через сокровенное духовное знание, открывающее в человеке божественную искру и путь освобождения от материального мира, сотворённого Демиургом.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Историческая справка о Гностицизме','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "Гностицизм объединяет различные религиозные течения раннехристианской эпохи, проповедовавшие спасение через гнозис, или эзотерическое знание. Гностики обычно рассматривали материальный мир как несовершенное творение низшего божества (Демиурга), пока истинный Бог оставался сокрытым и непостижимым. Считалось, что человеческие души содержат божественные искры, облечённые в материю, освободить которые можно лишь через сокровенное знание.\n\nСреди наиболее известных последователей гностицизма можно выделить Валентина, Василида и Маркиона Синопского. Отцы Церкви, такие как Ириней Лионский и Тертуллиан, в своих трудах опровергали гностические учения, которые они считали еретическим отступлением от апостольской веры."
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "Pax et Bonum" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "Ptōkhoì Kērykes" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "О Господи, как Ты послал апостолов Твоих без золота и серебра, так и мы выходим в нищете, уповая единственно на Твоё провидение. Даруй нам благодать проповедовать Евангелие Твоё в простоте и истине.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Историческая справка о Pax et Bonum','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "Следуя примеру Христа, которому негде было главы преклонить, нищенствующие проповедники добровольно принимают бедность. Не беря ничего в дорогу, они уповают на Божие попечение, распространяя Евангелие.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Историческая справка о Ptōkhoì Kērykes','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "Религиозные ордена, посвятившие себя бедности и проповеди, странствующие налегке и распространяющие веру, полагаясь на божественное провидение во всех своих нуждах.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Историческая справка о нищенствующих проповедниках', 'tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "Первые нищенствующие ордена возникли в XIII веке как ответ на богатство и мирской характер Церкви того времени. Второй Лионский собор 1274 года признал четыре главных ордена: кармелитов, францисканцев Франциска Ассизского, доминиканцев Доминика де Гусмана и августинцев.\n\nВ отличие от традиционных монашеских орденов, владевших общей собственностью, нищенствующие ордена придерживались как личной, так и коллективной бедности и существовали главным образом за счёт милостыни. Их деятельность была сосредоточена в городах, где они проповедовали, придавая особое значение учёности и образованию. Идеал нищенства восходил непосредственно к словам Христа в Евангелии от Матфея (10:9–10), повелевавшего апостолам ничего не брать в дорогу."
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "Quinque Sedes" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "Ибо где верные собраны во имя Христово, там Он посреди них. Существует пять великих епископских престолов: Рим, Константинополь, Александрия, Антиохия и Иерусалим. Это столпы Церкви.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Историческая справка о Quinque Sedes','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "Церковь управляется пятью патриархатами, созданными ещё в апостольские времена. Ибо, где двое или трое собраны во имя Его, там Христос посреди них, а через пентархию Его власть распространяется по всему миру.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Историческая справка о Pentarkhía','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "Вселенская Церковь управляется пятью древними патриаршими престолами, каждый из которых обладает властью над своей областью и сохраняет церковное единство через соборное общение.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Историческая справка о Пентархии','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "Пентархия представляла собой модель церковного управления, признававшую пять главных патриарших престолов: Рим, Константинополь, Александрию, Антиохию и Иерусалим. Утверждённая Халкидонским собором 451 года, она отражала политическое значение этих городов в Римской империи. Каждый патриарх обладал властью в своей области, а споры разрешались на Вселенских соборах.\n\nРим никогда полностью не принимал эту систему, настаивая на верховенстве папской власти, а после падения Александрии в 641 году её незыблемость пошатнулась. После Великого раскола 1054 года пентархия фактически прекратила своё существование. Восточная церковь продолжила чтить идеал пентархии, хотя со временем на Руси, а также в Сербии и других странах были созданы собственные патриархаты."
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "Fides Indefessa" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "Pístis Akatapónētos" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "О, Господи, укрепи веру нашу. Вера же есть осуществление ожидаемого и уверенность в невидимом. Да пребудем мы тверды среди всякого испытания, не ослабевая в преданности Тебе.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Историческая справка о Fides Indefessa','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "Вера есть осуществление ожидаемого и уверенность в невидимом. Через непоколебимое упование верующие преодолевают все испытания и гонения, оставаясь стойкими до самой смерти.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Историческая справка о Pístis Akatapónētos','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "Вера, которую не могут поколебать ни гонения, ни страдания, ни сомнения. Верующие призваны твёрдо стоять в своих убеждениях, невзирая на последствия мира сего.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Историческая справка о Стойкой вере','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "На протяжении всей христианской истории примеры мучеников и исповедников служили образцами для подражания. От первых гонений при Нероне и Диоклетиане до более поздних испытаний, а также миссионеров, отправлявшихся обращать враждебные народы и погибавших за свою проповедь, таких как Адальберт Пражский, христиан призывали сохранять веру до самой смерти.\n\nУбеждение в том, что веру необходимо защищать, хранить и распространять независимо от цены, вдохновляло многочисленные монашеские движения и миссионеров. Предания о святых, переносивших мучения и смерть за свою веру, укрепляли дух верующих и воспринимались как свидетельство верного способа спасти свою душу."
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "Миафизитство"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "Эфесский собор не был «разбойничьим». Ошибка Халкидонского собора должна быть исправлена. Божественная и человеческая природы соединены в единой ипостаси Христа неслитно, неизменно, нераздельно и неразлучно.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Историческая справка о Miaphysitismus','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "Эфесский собор не ошибся, оправдав архимандрита Евтихия и осудив патриарха Флавиана. Христос обладает одной соединённой богочеловеческой природой, всецело божественной и всецело человеческой, соединённой неслитно и неразлучно.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Историческая справка о Miaphysitismós','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "Христос имеет одну единую природу, одновременно божественную и человеческую, неразлучно соединённую в Воплощении.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Историческая справка о Миафизитстве','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "Миафизитство (от др.-греч. mia — #weak единая#! и physis — #weak природа#!) утверждает, что во Христе божественная и человеческая природы соединены в одну составную природу без слияния или разлучения. Главным защитником этого учения был Кирилл Александрийский, употреблявший формулу #weak mia physis tou theou logou sesarkōménē#! (Едина природа воплощённого Слова Бога). В отличие от монофизитства миафизитское учение утверждает полноту как божественного, так и человеческого начал в этом единстве.\n\nХалкидонский собор 451 года отверг эту формулу, утвердив диофизитское учение о двух природах. Это решение противоречило позиции Второго Эфесского собора, осудившего несторианское толкование двух природ. В результате Древневосточные православные церкви (Коптская, Армянская, Эфиопская и Сирийская) отделились от Византийской церкви, сохранив миафизитское богословие до настоящего времени."
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "#TOOLTIP:GAME_TRAIT,honest,$CHARACTER_ID$ #L Честные#!#! [Concept('characters', 'персонажи')|E]: #P +10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E], #P +10#! к [Concept('opinion', 'мнению')|E] [Concept('clergy', 'духовенства')|E]"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "#TOOLTIP:GAME_TRAIT,deceitful,$CHARACTER_ID$ #L Вероломные#!#! [Concept('characters', 'персонажи')|E]: #N −10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E], #N −10#! к [Concept('opinion', 'мнению')|E] [Concept('clergy', 'духовенства')|E]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "[piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! ед. [Concept('piety', 'благочестия')|E] ежегодно, пока ваш [Concept('liege', 'сюзерен')|E] принадлежит к другой [Concept('faith', 'конфессии')|E]"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "Исихазм"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "О, Господи, даруй нам благодать святого безмолвия. Да обрящем мы Тебя, пребывающего во свете неприступном. Научи нас непрестанно молиться, дабы сердца наши стали обителями Твоего присутствия.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Историческая справка о Hesychasmus','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "Господи Иисусе Христе, Сыне Божий, помилуй меня грешного. Через безмолвие тела и ума, через непрестанное повторение Иисусовой молитвы, дозволь мне достичь состояния созерцания, видения несотворенного божественного света.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Историческая справка об Hēsykhasmós','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "Через внутреннее безмолвие, созерцательную молитву и повторение Иисусовой молитвы верующие стремятся к непосредственному общению с Богом и к созерцанию Его несотворённого света.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Историческая справка об Исихазме','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "Исихазм (от др.-греч. #weak hēsykhía#! — «спокойствие») — созерцательная традиция в восточном христианстве, основанная на сердечной молитве и восходящая к египетским отцам-пустынникам IV века. Главной практикой исихазма стало многократное повторение Иисусовой молитва: #weak «Господи Иисусе Христе, Сыне Божий, помилуй меня, грешного»#!, которую часто произносят в согласии с дыханием и сердцебиением.\n\nВ XIV веке святой Григорий Палама защищал исихастов Афона и из созерцание несотворённого света при Преображении Христа на горе Фавор от обвинений в ереси со стороны Варлаама Калабрийского. Константинопольские соборы 1341 и 1351 годов утвердили учение Паламы, закрепив исихазм в православной доктрине."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "#P Увеличен#! прирост @piety_icon![Concept('piety', 'благочестия')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E] за принятие [Concept('decision', 'решения')|E] «[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]» в вашей [Concept('capital', 'столице')|E]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! от [Concept('clergy', 'духовенства')|E] этого [Concept('rite', 'течения')|E] даёт больше @piety_icon![Concept('piety', 'благочестия')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "#TOOLTIP:GAME_TRAIT,patient,$CHARACTER_ID$ #L Терпеливые#!#! [Concept('characters', 'персонажи')|E]: #P +10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E], #P +10%#! к приросту @spiritual_fulfillment_icon! [Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "#TOOLTIP:GAME_TRAIT,impatient,$CHARACTER_ID$ #L Торопливые#!#! [Concept('characters', 'персонажи')|E]: #N −10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E]"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[Concept('characters', 'Персонажи')|E] со свойствами «[GetTrait('journaller').GetName( GetNullCharacter )]», «[GetTrait('contrite').GetName( GetNullCharacter )]», «[GetTrait('confider').GetName( GetNullCharacter )]» и «[GetTrait('flagellant').GetName( GetNullCharacter )]»: #P +10%#! к снижению [Concept('stress', 'стресса')|E], #P +5%#! к приросту @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "Вы получаете @piety_icon![Concept('piety', 'благочестие')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E], когда теряете уровень [Concept('stress', 'стресса')|E] (не чаще чем раз в год)"
 pam_hesychasm_meditation_toast: "От вашего личного принципа «[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]»: бонус за благочестивые размышления дома"
 pam_hesychasm_stillness_toast: "От вашего личного принципа «[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]»: покой в сердце"
 hesychasm_anachoresis_mortification_exclusivity_desc: "Персонажи могут одновременно придерживаться только одного из этих [Concept('core_tenets', 'догматов')|E]: «[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )]», «[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]», «[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]», «[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]»"
 # Anachoresis tenet
 tenet_anachoresis_latin_name: "Vita Eremitica" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "Анахоретство"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "О Господи, как Иисус возведён был Тобой в пустыню для приготовления к Его служению, так и нас возведи в пустыню наших сердец. В уединении и безмолвии да удалимся мы от суеты мира и да обрящем Тебя единого.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Историческая справка об Vita Eremitica','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "Блаженны удаляющиеся от мира, ибо они обрящут Бога в тишине пустыни. Как пророки обитали в пещерах и расселинах, так и служители Христовы ищут уединения, чтобы бороться со страстями.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Историческая справка об Anakhōrēsis','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "Удаляясь от мирской жизни в пустыни, верующие стремятся к духовной чистоте, победе над страстями и более глубокому единению с Богом через молитву и аскезу.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Историческая справка об Анахоретстве','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "Анахоретство (от др.-греч. #weak anakhorēsis#! — «отступать», «уходить») — это практика отшельников, которые покидали общество и уходили в безлюдные места, чтобы посвятить свою жизнь молитве, посту и духовной борьбе с демоническими силами. Движение зародилось в Египте в III веке благодаря святому Павлу Фивейскому, которого традиционно считают первым христианским отшельником. Около 250 года н. э. он бежал от гонений со стороны императора Деция в Фиваидскую пустыню.\n\nАнахоретский образ жизни был широко распространён на протяжении всего Средневековья. Отшельники жили в уединённых кельях при монастырях и получали Евхаристию через небольшое окошко, называвшееся агиоскопом. Наставления вроде английского руководства XIII века Ancrene Wisse («Наставления для анахоретов») устанавливали правила жизни для затворников и затворниц."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "Даёт [Concept('trait', 'свойство')|E] «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]»"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "#P Увеличен#! прирост @piety_icon![Concept('piety', 'благочестия')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E] за принятие [Concept('decision', 'решения')|E] «[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]» вдали от вашей [Concept('capital', 'столицы')|E]"
 religious_decision.0211_anachoresis_tt: "#EMP Из-за вашего [Concept('personal_tenet', 'личного догмата')|E] «[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]»:#!"
 doctrine_parameter_tenet_anachoresis_always_cave_hermit: "Открывает [Concept('court_position', 'придворную должность')|E] «[GetCourtPositionType('cave_hermit_court_position').GetName()]»"
 tenet_anachoresis_always_cave_hermit_name: "[Concept('court_position', 'должность')|E] «[GetCourtPositionType('cave_hermit_court_position').GetName()]»"
 pam_anachoresis_meditation_toast: "От вашего личного принципа «[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )]»: бонус за благочестивые размышления в уединении"
 pam_anachoresis_tenet_title: "[Concept('core_tenet', 'Догмат')|E] «$tenet_anachoresis_default_name$»"
 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "Mortificatio Carnis" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "Умерщвление плоти"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "О, Господи, даруй нам благодать распять нашу плоть со страстями и похотями. Через святое страдание да приобщимся мы к Страстям Христовым и умертвим дела плотские, дабы обрести жизнь истинную.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Историческая справка о Mortificatio Carnis','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "Постом, бдением и умерщвлением плоти рабы Божии укрощают и подчиняют её, дабы дух мог воспарить к небесам.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Историческая справка о Nékrōsis tẽs Sarkós','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "Верующие умерщвляют плоть и её греховные желания, разделяя страдания Христовы ради очищения души и достижения духовного совершенства.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Историческая справка об Умерщвлении плоти','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "[Concept('trait', 'Свойство')|E] «[GetTrait('scarred').GetName( GetNullCharacter )]» даёт @piety_icon![Concept('piety', 'благочестие')|E] и повышает [Concept('opinion', 'мнение')|E] верующих"
 doctrine_parameter_tenet_mortification_revel_bonus: "Прирост @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E], а также [Concept('trait', 'свойство')|E] «[GetTrait('flagellant').GetName( GetNullCharacter )]», когда вы принимаете [Concept('decision', 'решение')|E] «[GetDecisionWithKey('stress_loss_flagellant_decision').GetName]»"
 doctrine_parameter_tenet_mortification_holy_scars: "При принятии этого [Concept('personal_tenet', 'личного принципа')|E] даётся [Concept('trait', 'свойство')|E] «[GetTrait('scarred').GetName( GetNullCharacter )]»"
 doctrine_parameter_tenet_mortification_suffering_sanctifies: "Прирост @piety_icon![Concept('piety', 'благочестия')|E] и потеря [Concept('stress', 'стресса')|E] с каждым полученным ранением"
 doctrine_parameter_tenet_mortification_mortify_flesh: "Можно принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('stress_loss_flagellant_decision').GetName]»"
 pam_mortification_revel_toast: "[Concept('personal_tenet', 'Личный принцип')|E] «[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]»"
 pam_mortification_flagellant_gain_toast: "От вашего личного принципа «[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]»: вы выбрали [GetTrait('flagellant').GetName( GetPlayer.Self )|El]"
 pam_mortification_holy_scars_toast: "От домата «[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]»: бичевание оставило на вашей плоти священные шрамы"
 pam_mortification_suffering_sanctifies_toast: "От домата «[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]»: вы обращаете страдания тела в подношение Богу"
 tenet_mortification_of_the_flesh_historical_desc: "Основанное на призыве святого Павла #weak умертвить дела плотские#! (К Римлянам 8:13) и #weak усмирять тело своё, порабощая его#! (1 Коринфянам 9:27), умерщвление плоти стало одной из важнейших практик христианского аскетизма с древнейших времён. Наиболее радикальными его представителями были столпники: святой Симеон Старший провёл 37 лет на вершине столпа близ Алеппо, пребывая в непрестанной молитве среди палящего зноя и лютого холода.\n\nВ средневековом западном христианстве широкое распространение получило самобичевание, особенно благодаря духовенству, среди которого его проповедовал святой Пётр Дамиани (1007–1072). В XIII–XIV веках движение самобичевателей пополнили группы мирян, проходивших процессиями через города и бичевавших себя в покаяние за грехи во времена эпидемий чумы и бедствий."
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "Qeddus Meron" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "Sanctum Chrisma" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "Hágion Mýron" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "Священное миро"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "Со святым миром, освящённым абуной, верующие принимают печать Духа Святого. Как Дух в образе голубя сошёл на Христа при Его крещении в Иордане, так и Дух нисходит на новокрещёных через это священное помазание, знаменуя их как чад Божьих.\n\n$pam_john_3_5_default$\n\n[Glossary('Историческая справка о Qeddus Meron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "Со святым елеем, освящённым епископом, верующие принимают печать дара Духа Святого. Помазание завершает благодать крещения.\n\n$pam_john_3_5_latin$\n\n[Glossary('Историческая справка о Sanctum Chrisma','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "Святое миро, освящённое патриархом, есть печать дара Духа Святого. Со святым помазанием новопросвящённые принимают полноту даров Духа и становятся храмами Бога Живого.\n\n$pam_john_3_5_greek$\n\n[Glossary('Историческая справка об Hágion Mýron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "Священное миро, или священный елей, — это особым образом освящённое масло, используемое в таинстве миропомазания для запечатления новокрещёных даром Духа Святого и их приобщения к Церкви.\n\n$pam_john_3_5_default$\n\n[Glossary('Историческая справка о Священном миро','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "Священное миро (от греч. #weak mýron#! — «благовонное масло»), используется в таинстве миропомазания (или конфирмации согласно западной терминологии). На Востоке миропомазание совершается сразу после крещения, даже над младенцами, тогда как на Западе оно обычно совершается отдельно епископом. Практика помазания имеет глубокие библейские корни: и #weak Христос#!, и #weak Мессия#! означают #weak «Помазанник»#!.\n\nОсвящение нового мира совершается редко и считается большим событием: в новую смесь всегда добавляется часть предыдущего мира, что создаёт непрерывную преемственность, которая, по преданию, восходит к самим апостолам. Эфиопская традиция утверждает, что рецепт мира (#weak Meron#!) был принесён девятью святыми — сирийскими проповедниками V века, — а его освящение может совершать лишь патриарх, абуна."
 doctrine_parameter_tenet_holy_myron_artifact: "Можно отправить [Concept('court_chaplain', 'придворного капеллана')|E], чтобы тот создал [Concept('artifact', 'артефакт')|E] #V Священное миро#!, приняв [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName]». Его заряды можно тратить на благословение [Concept('artifacts', 'артефактов')|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: "и вашей [Concept('coronation', 'коронации')|E]"
 pam_holy_myron_param_funeral_append: ", а также покойников на [Concept('funerals', 'похоронах')|E]"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Можно дарить заряды вашего [Concept('artifact', 'артефакта')|E] #V Священное миро#! другим правителям, повышая @piety_icon![Concept('piety', 'благочестие')|E] и их [Concept('opinion', 'мнение')|E]"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Ваши новорождённые дети получают [Concept('modifier', 'модификатор')|E] «[GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip]» на #V 16#! лет; заряд [Concept('artifact', 'артефакта')|E] #V Священное миро#! даёт постоянный [Concept('modifier', 'модификатор')|E] «[GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip]»"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "Когда вы [Concept('ill', 'заболеваете')|E]: прирост @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E], потеря [Concept('stress', 'стресса')|E] и [Concept('modifier', 'модификатор')|E] «[GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip]» на #V 2#! года"
 # Khachkar tenet
 tenet_khachkar_armenian_name: "Хачкар" # DO NOT TRANSLATE
 tenet_khachkar_latin_name: "Crux Lapidea" # DO NOT TRANSLATE
 tenet_khachkar_greek_name: "Líthinos Staurós" # DO NOT TRANSLATE
 tenet_khachkar_default_name: "Хачкары"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "Хачкары стоят как вечные свидетели нашей веры. Украшенные искусной резьбой в виде крестов, виноградных лоз и священных символов, хачкары представляют собой молитву, высеченную в камне, прославляющую Крест, которым был спасён мир.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Историческая справка о хачкарах','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "Как армяне воздвигают свои каменные кресты к небесам, так и мы да ознаменуем эту землю символами спасения — Крестом Господа Иисуса Христа.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Историческая справка о Crux Lapidea','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "Каменные изваяния, покрытые священными символами, свидетельствуют о победе Христа и служат вечными памятниками верным.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Историческая справка о Líthinos Staurós','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "Каменные кресты, покрытые искусной резьбой с религиозными мотивами, служат священными памятниками, отмечающими святыни, увековечивающими память почивших и прославляющими божественное провидение.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Историческая справка о Хачкарах','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "Хачкары (от арм. «#weak хач#!» — «крест» и «#weak кар#!» — «камень») представляют собой искусно высеченные каменные стелы с изображением креста, зачастую размещаемого над розеттой или «колесом вечности». Эти уникальные памятники армянской христианской культуры обозначают святые места, хранят память о важных событиях и служат поклонными крестами усопшим.\n\nТрадиция хачкаров возникла в IX веке из обычая сооружать деревянные кресты, которые святой Григорий Просветитель воздвигал на месте языческих храмов после крещения Армении в 301 году. Расцвет этого искусства пришёлся на XII–XIII века, на время царствования династии Закарянов. Каждый из них — уникальная работа таких мастеров, как Момик из Нораванка. Некоторые даже считаются чудотворными и стали местами паломничества."
 doctrine_parameter_tenet_khachkar_decision_unlock: "В течение #V 5#! лет после получения наследства от близкого родственника своей [Concept('dynasty', 'династии')|E] можно принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_raise_khachkar_decision').GetName]»"
