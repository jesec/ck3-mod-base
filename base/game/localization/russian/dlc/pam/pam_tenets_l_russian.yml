 full_tenet_name: "$CUSTOM_NAME$ #weak ($DEFAULT_NAME$)#!"
 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "Каноны Адамнана" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "Pax et Treuga Dei" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "Ekekheiría Theoũ" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "Мир Божий"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "Каноны Адомнана, также именуемые «Закон невинных», представляли собой свод правил, обеспечивавших защиту мирного населения во время войны. Нарушители, а вместе с ними и безучастные наблюдатели, не воспрепятствовавшие злодеяниям, подвергались светским наказаниям и церковным проклятиям.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Историческая справка о Cáin Adomnáin','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "Перемирия надлежит чтить и соблюдать от начала Адвента до октавы Богоявления. А всякий, кто осмелится нарушить перемирие, да будет отлучён от церкви своим епископом.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Историческая справка о Pax et Treuga Dei','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "Ученики Христа, утверждавшего мир всеми своими деяниями, должны быть созидателями мира. Ищущий мира ищет Христа. Без любви к ближним, без мира в сердце ко всем людям нельзя называться подлинным слугой Христа.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Историческая справка об Ekekheiría Theoũ','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "Бессмысленная жестокость по отношению к нашим братьям и сёстрам считается оскорблением Самого Бога.\n\n[Glossary('Историческая справка о Мире Божьем','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "На протяжении всего Средневековья различные христианские течения пытались обуздать насилие с помощью официального свода правил. От ирландских Канонов Адомнана VII века и до французского движения Мира Божьего X века эти усилия были направлены на защиту церковной собственности и духовенства, ограждение мирного населения от притеснений, а также на ограничение войн между знатью определённым временем и местом. Со временем указанные правила стали распространяться и на иноверцев. Так, Канон XXI Третьего Латеранского собора 1179 года распространил систему перемирий на весь христианский мир, а Канон XXVII, напротив, призывал к оружию против катаров, басков и прочих еретиков."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Объявление [Concept('war', 'войны')|E] [Concept('ruler', 'правителю')|E] той же [Concept('faith', 'конфессии')|E] тратит @piety_icon![Concept('piety', 'благочестие')|E]"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "#TOOLTIP:GAME_TRAIT,zealous,[Situation.GetID] #L Фанатичные#!#! [Concept('rulers', 'правители')|E] реже объявляют [Concept('war', 'войны')|E] против той же [Concept('faith', 'конфессии')|E]"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "[Concept('rulers', 'Правители')|E] этого [Concept('rite', 'течения')|E] гораздо реже отвечают на [Concept('interaction', 'взаимодействие')|E] #high $ecclesiastic_incite_holy_war_interaction$#!"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "[Concept('interaction', 'Взаимодействие')|E] #high $purchase_truce_interaction$#! стоит на #P 50%#! меньше и его более охотно принимают"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "Невозможно начать [Concept('raid', 'налет')|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "Каждые #V 5 лет#! [Concept('peace', 'мирной жизни')|E] дают [Concept('rulers', 'правителям')|E] награду, обычно в форме @legitimacy_icon![Concept('legitimacy', 'легитимности')|E]"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "Каждые #V 5 лет#! [Concept('peace', 'мирной жизни')|E] случайный [Concept('skill', 'навык')|E] повышается на #P 1#!"
 doctrine_parameter_tenet_peace_of_god_excommunication: "Основной защитник не тратит @piety_icon![Concept('piety', 'благочестие')|E] на то, чтобы [Concept('excommunicate', 'отлучить')|E] атакующего той же [Concept('faith', 'конфессии')|E]"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "Нарушение [Concept('truce', 'перемирия')|E] внутри [Concept('faith', 'конфессии')|E] приводит к мгновенному [Concept('excommunication', 'отлучению')|E]"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "[Concept('clergy', 'Духовенство')|E] намного охотнее решает споры за землю и титулы и требует за это на #P 25%#! меньше @piety_icon![Concept('piety', 'благочестия')|E], @gold_icon![Concept('gold', 'золота')|E] и @prestige_icon![Concept('prestige', 'престижа')|E]"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: вы ведёте мирную жизнь"
 # Dulia tenet
 tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
 tenet_dulia_default_name: "Почитание святых"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "Те, кто избрал Господа своей твердыней, достойны почитания. Свято их вечное тело, священны их мощи и благословенна память о них.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Историческая справка о Dulia','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "Церковь прославляет тех, кто отличился исключительным служением Богу, от исповедников и жён-мироносиц до юродивых Христа ради, устанавливая для них особое именование и поминовение в определённый день литургического календаря.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Историческая справка об Hagiokatátaxis','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "Пусть всякий, ищущий заступничества святых, обращается к ним с должным благоговением и любовью.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Историческая справка о Почитании святых','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "На заре христианства мученики, принявшие смерть за веру, окружались особым почитанием, а их мощи сохранялись как священные реликвии. С IV века церковь стала прославлять исповедников, засвидетельствовавших свою веру не мученической кончиной, а праведным словом и жизнью.\n\nПервоначально решение о причислении к лику святых принимал местный епископ после изучения жизни подвижника и свидетельств о совершенных им чудесах. Епископ Ульрих Аугсбургский стал первым святым за пределами Рима, канонизацию которого утвердил папа Иоанн XV в 993 году. А уже в 1170 году папа Александр III своим декретом закрепил исключительное право канонизации за римским понтификом."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[Concept('decisions', 'Решения')|E] «[GetDecisionWithKey('pam_canonize_saint_decision').GetName]» и «[GetDecisionWithKey('pam_extract_relic_decision').GetName]» стоят на #P 15%#! меньше @piety_icon![Concept('piety', 'благочестия')|E] и @gold_icon![Concept('gold', 'золота')|E]"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[Concept('artifacts', 'Артефакты')|E] от [Concept('decision', 'решения')|E] «[GetDecisionWithKey('pam_extract_relic_decision').GetName]» несут на себе #P 1#! дополнительное случайное благословение"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "[Concept('decision', 'Решение')|E] «[GetDecisionWithKey('pam_extract_relic_decision').GetName]» по отношению к члену [Concept('dynasty', 'династии')|E] приносит #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! ед. [Concept('dynasty_prestige', 'признания')|E]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Канонизация святого даёт всем [Concept('ruler', 'правителям')|E] [Concept('faith', 'конфессии')|E] модификатор «$pam_dulia_new_saint_modifier$» на #EMP 5#! лет"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "Пресуществление"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "В таинстве Евхаристии освящение хлеба завершается не обращением в ничто, а претворением в Тело Христово. Иначе нельзя было бы объяснить, каким образом Тело Христово начинает пребывать в таинстве. Ибо оно пребывает там не через перемещение в пространстве, поскольку тогда оно перестало бы пребывать на небесах.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Историческая справка о Transubstantiatio','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "Ибо Он присутствует истинно и реально, так что после освящения хлеба и вина хлеб прелагается, пресуществляется, обращается и претворяется в самое истинное Тело Господне.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Историческая справка о Metousíōsis','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "До освящения оно носит иное имя, после же именуется Кровью Христовой. И вы говорите: «Аминь», то есть: «Воистину так».\n\n$pam_luke_22_19_default$\n\n[Glossary('Историческая справка о Пресуществлении','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "Вопрос о природе присутствия Христа в Евхаристии был предметом богословских споров с самых ранних времён существования Церкви. Если божественность хлеба и вина как Тела и Крови Христовых редко подвергалась сомнению, то вопрос об их точной природе привёл к возникновению многочисленных споров, сект и расколов. Католическое толкование получило дальнейшее развитие у Фомы Аквинского в XIII веке и было официально закреплено Четвёртым Латеранским собором 1215 года. Во время мессы сущность хлеба и вина прелагается в Тело и Кровь Христовы, а акциденции (внешние свойства) хлеба и вина остаются неизменными."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Скорость [Concept('fabricate_claim', 'подделки претензии на графство')|E]: #p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "Ora et Labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "Молись и трудись"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "Будь послушен своему настоятелю. С терпением переноси лишения. Принимай даже самые презренные занятия и считай себя недостойным работником.\n#weak Глава VII Устава Святого Бенедикта#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Историческая справка об Ora et Labora','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "Денно и нощно монахи должны непрестанно совершать богослужения. Их сменяющие друг друга хоры и непрерывное пение псалмов прославляют Господа и Орден.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Историческая справка об Akoímētoi','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "Молиться — значит трудиться, а трудиться — значит молиться. Праздность есть враг души, и потому следует проявлять усердие как в помыслах, так и в деяниях.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('Историческая справка о догмате «Молись и трудись»','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "Возникший из Устава Святого Бенедикта девиз #weak Ora et labora#! воплощает монашеский идеал молитвы и труда. Монахи должны были посвящать определённые часы дня общей молитве, благочестивым размышлениям и физическому труду, поскольку такой баланс считался необходимым для духовного роста и поддержания дисциплины. Бенедиктинские монастыри со временем превратились в центры образования, сельского хозяйства и ремёсел и оказали огромное влияние на культурную и экономическую жизнь средневековой Европы."
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "Theotókos" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "Богоматерь"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "Под Твою милость прибегаем, Богородице Дево. Молений наших не презри во скорбях, но от бед избави нас, единая Чистая и Благословенная.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Историческая справка о Hyperdulia','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "Прими нашу молитву и принеси её Сыну Твоему и Богу нашему, да спасёт Тобою души наши. Пресвятая Богородица, спаси нас!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Историческая справка о Theotókos','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "Пресвятая Дева Мария, Богородица, Матерь Милосердия, Царица Небесная.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Историческая справка о Богородице','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "С самых ранних дней христианства Мария, мать Иисуса, занимала особое место — её прославляли и почитали. В 431 году Третий Вселенский собор в Эфесе утвердил за ней титул Богородицы (греч. #weak Theotokos#!) и одновременно осудил предложенный архиепископом Константинопольским Несторием титул Христородицы (греч. #weak Christotokos#!). Святой Иоанн Дамаскин в VIII веке писал, что Дева Мария превознесена над всеми святыми благодаря её уникальной роли в деле спасения. На протяжении веков христианские церкви формулировали и закрепляли в вероучении различные догматы о Деве Марии, включая Непорочное зачатие и Успение."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "[claims|E] женщин более не ослабляются из-за [Concept('gender_laws', 'примогенитуры')|E]"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Открывает [Concept('laws', 'закон')|E] наследования: «[GetLaw('female_preference_law').GetName]»"
 # Simony tenet
 tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
 tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
 tenet_simony_default_name: "Симония"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "Господь Бог создал золото в недрах земли, которую Он нам даровал как милость для Своих избранных.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Историческая справка о Simonia','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "Господь Бог создал золото в недрах земли, которую Он нам даровал как милость для Своих избранных.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Историческая справка о Simōnía','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "Господь Бог создал золото в недрах земли, которую Он нам даровал как милость для Своих избранных.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Историческая справка о Симонии','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "Симония — это практика продажи церковных должностей, реликвий и обрядов. Термин возник от имени самарянского волхва Симона, который #weak околдовывал#! народ и предложил апостолам деньги в обмен на дар Святого Духа.\n\nМногочисленные церковные соборы, от Эльвирского собора 305 года до Тридентского собора 1545 года, решительно осуждали симонию и налагали на нарушителей духовные и канонические наказания. Однако сам факт столь частого осуждения на протяжении веков свидетельствует о том, что она была достаточно распространённым явлением в церкви. Кроме того, она подверглась резкой критике в «95 тезисах» Мартина Лютера и у Данте в «Божественной комедии» («Ад. Песнь 19»): #weak О Симон-волхв, о присных сонм злосчастный, Вы, что святыню божию, Добра Невесту чистую, в алчбе ужасной растлили ради злата и сребра!#!"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[Concept('castle_holdings', 'Замковые')|E] и [Concept('church_holdings', 'церковные владения')|E]: [Concept('tax', 'налог')|E] за каждый уровень @piety_icon![Concept('piety', 'благочестия')|E]: #P +0,1 [gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "Можно обеспечить согласие для [Concept('character_interaction', 'взаимодействия персонажа')|E] #high $take_monastic_vows_interaction$#!, заплатив @gold_icon![Concept('gold', 'золотом')|E]"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "Можно заплатить @gold_icon![Concept('gold', 'золотом')|E] за церковные [Concept('titles', 'титулы')|E] при использовании [Concept('interaction', 'взаимодействия')|E] #high $buy_ecclesiastical_title_interaction$#!"
 tenet_simony_ecclesiastical_purchase_name: "[Concept('interaction', 'взаимодействие')|E] #high $buy_ecclesiastical_title_interaction$#!"
 doctrine_parameter_tenet_simony_gold_donations: "Пожертвования @gold_icon![Concept('gold', 'золота')|E] при обращении к [Concept('clergy', 'духовенству')|E] в #P 5#! раз убедительнее"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "Ежегодный шанс от #P 25%#! до #P 75%#! (чем вы богаче, тем выше) получить #P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! к @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "[Concept('head_of_faith', 'Глава конфессии')|E] всегда принимает @gold_icon![Concept('gold', 'золото')|E], предложенное за отмену [Concept('excommunication', 'отлучения')|E]"
 doctrine_parameter_tenet_simony_personal_gifts: "Подарки снижают [Concept('stress', 'стресс')|E], незначительно увеличивают @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] и вдвое эффективнее улучшают [Concept('opinion', 'мнение')|E]"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "Привечающий синкретизм"
 pam_personal_syncretism_county_modifier_desc: "Местное население уважает личные синкретические традиции правителя и процветает под его властью."
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "Монофизитство"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "Сын един, и едина природа Его, даже если Он мыслится как воспринявший плоть с разумной душой.\n\n$pam_john_1_1_latin$\n\n[Glossary('Историческая справка о Monophysitismus','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "Одна природа Воплощённого Слова.\n\n$pam_john_1_1_greek$\n\n[Glossary('Историческая справка о Monophysitismós','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "Христос обладает лишь одной природой — всецело Божественной.\n\n$pam_john_1_1_default$\n\n[Glossary('Историческая справка о монофизитстве','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "Этот догмат, получивший своё название от греческих слов monos (что означает «#weak единственный#!») и physis (что означает «#weak природа#!»), утверждает, что Иисус Христос обладает лишь одной Божественной природой как воплощённое Слово Божье. Данное учение было осуждено как ересь на Халкидонском соборе в 451 году, однако получило поддержку при императоре Василиске и защиту при Юстиниане I. Оно привело к возникновению целого ряда раскольнических сект: например, к появлению групп акефалов, отвергавших власть Александрийского патриарха, и докетистов, считавших человеческую природу Христа иллюзорной."
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[Concept('characters', 'Персонажи')|E]-#TOOLTIP:GAME_TRAIT,theologian,$CHARACTER_ID$ #L теологи#!#!: #P +10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E], #P +5#! к [Concept('opinion', 'мнению')|E] фанатиков, #P +10%#! к опыту [Concept('lifestyle', 'жизненного пути')|E]"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "#TOOLTIP:GAME_TRAIT,stubborn,$CHARACTER_ID$ #L Упрямые#!#! [Concept('characters', 'персонажи')|E]: #P +10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E], #P +10#! к [Concept('opinion', 'мнению')|E] [Concept('clergy', 'духовенства')|E]"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "#TOOLTIP:GAME_TRAIT,trusting,$CHARACTER_ID$ #L Доверчивые#!#! [Concept('characters', 'персонажи')|E]: #N −10%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E], #N −10#! к [Concept('opinion', 'мнению')|E] [Concept('clergy', 'духовенства')|E]"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "Против других [Concept('faiths', 'конфессий')|E] вашей [Concept('religion', 'религии')|E]: [Concept('convert_county', 'смена конфессии в графстве')|E] происходит на #P 25%#! быстрее, [Concept('characters', 'персонажи')|E] получают #P +20#! к принятию обращения"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "Пламенные проповеди"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "Как Моисей некогда стоял перед фараоном, бесстрашно провозглашая возложенное на него Тобой предназначение, так и наши миссионеры ныне стоят перед людьми.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Историческая справка об Actus Apostolorum','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "Я возвращаю Тебе народ Твой, дарованный мне Тобою. Направляй их Своей крепкою десницею и сохрани под сенью Своих крыл.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Историческая справка о Práxeis tõn Apostólōn','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "Принеси Небесный свет пребывающим во тьме и надежду — пребывающим в отчаянии.\n\n$pam_acts_1_8_default$\n\n[Glossary('Историческая справка о Пламенных проповедях','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "В первые века нашей эры христианство стремительно распространялось, прежде всего, благодаря миссионерским трудам апостолов и первых учеников. Они объехали всю Римскую империю, по пути основывая христианские общины и обращая в новую веру людей самого различного происхождения. Ревностное стремление к проповеди было обусловлено глубокой верой в послание о спасении через Иисуса Христа, в результате чего христианство выросло из небольшой иудейской секты в одну из крупнейших мировых религий.\n\nВ Средние века многие будущие святые и мученики отправлялись в языческие земли и неустанно распространяли христианское учение."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Менее строгие требования к принятию [Concept('decision', 'решения')|E] «[GetDecisionWithKey('zealous_missionary_prep_decision').GetName]», и большее число [Concept('adventurers', 'авантюристов')|E] будет принимать его"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Обращение [Concept('characters', 'персонажей')|E] приносит #P 50#! @legitimacy_icon!; когда ваш [Concept('court_chaplain', 'придворный капеллан')|E] обращает [Concept('county', 'графство')|E], вы получаете #P 100#! @legitimacy_icon! и #P 5#! @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "Обращение [Concept('characters', 'персонажей')|E] приносит #P 3#! ед. @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E] либо #P 10#! за обращение [Concept('ruler', 'правителей')|E]-землевладельцев"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Ваш [Concept('head_of_rite', 'лидер течения')|E] получает #P +25#! к принятию, когда склоняет [Concept('characters', 'персонажей')|E] принять это [Concept('rite', 'течение')|E]"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "Ваше преимущество в [Concept('learning', 'учёности')|E] засчитывается #P дважды#!, когда вы требуете от [Concept('characters', 'персонажей')|E] обратиться"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "Обращение [Concept('ruler', 'правителя')|E] приносит от #P 25#! до #P 1500#! ед. @piety_icon![Concept('piety', 'благочестия')|E] в зависимости от его [Concept('title', 'титула')|E]"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "От догмата «[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]»"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "Чистилище"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "Куда более я страшусь кары внизу. Душа моя исполнена смятения и пребывает в томительном ожидании. Я уже чувствую тяжкое бремя первой террасы.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Историческая справка о Purgatorium','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "И пребывающие в Царствии Небесном не имеют тел, а потому не могут самостоятельно возрастать в Обожении, чему содействуют наши молитвы.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Историческая справка о Kathartērion','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "Окончательное очищение умерших в Состоянии Благодати оставляет в них лишь ту святость, которая им необходима для вхождения в Царствие Небесное.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Историческая справка о Чистилище','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "Хотя представление о душах, пребывающих в переходном состоянии перед попаданием на Небеса, было довольно широко распространено, природа этого состояния зачастую становилась предметом споров. Было ли это реальным местом, состоянием души, просто метафорой или действительно очищающим огнём — богословы и христианские течения считали по-разному. Так, Святая Екатерина Генуэзская описывала его как состояние одновременно радости и добровольного страдания за грехи, а Ориген Александрийский утверждал, что Бог есть всепоглощающий огонь.\n\nКатолическая церковь окончательно закрепила учение о Чистилище на Флорентийском (1439 г.) и Тридентском (1545–1563 гг.) соборах, определив его как временное состояние очищения и подтвердив, что молитвы и добрые дела живых могут облегчить участь пребывающих там душ."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[Concept('sinful', 'Грешные')|E] [Concept('characters', 'персонажи')|E] реже вступают во [Concept('factions', 'фракции')|E] (#N −15#! ед. за каждый совершённый [Concept('sin', 'грех')|E])"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[Concept('sinful', 'Грешные')|E] [Concept('rulers', 'правители')|E] получают на #N 10%#! меньше [Concept('piety', 'благочестия')|E] за каждый совершённый [Concept('sin', 'грех')|E]"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "Срывы из-за [Concept('stress', 'стресса')|E] могут заменить [Concept('sinful', 'греховные')|E] [Concept('traits', 'свойства')|E] [Concept('virtues', 'добродетелями')|E] — чем сильнее срыв, тем вероятнее"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "[Concept('excommunicated', 'Отлучённые')|E] [Concept('characters', 'персонажи')|E] этого [Concept('rite', 'течения')|E] искупляют вину покаянием: #P +25%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E] и #P +10#! к [Concept('opinion', 'мнению')|E] единоверцев"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[Concept('excommunicated_recovery', 'Варианты восстановления')|E] стоят меньше @prestige_icon![Concept('prestige', 'престижа')|E] и не снижают ваш [Concept('prestige_level', 'уровень репутации')|E]"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "Вы получите #P 50#! ед. @piety_icon![Concept('piety', 'благочестия')|E] за каждый [Concept('sin', 'грех')|E] умершего близкого [Concept('family', 'родственника')|E]"
 pam_purgatory_prayers_for_the_dead_toast: "От догмата «[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]»: заупокойные молитвы"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "Crescite et Multiplicamini" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì Plēthýnesthe" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "Плодитесь и размножайтесь"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "Супруги дарят друг другу не только самих себя, но и детей — живое отражение своей любви, живое и неразрывное единство их сущности.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Историческая справка о Crescite et Multiplicamini','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "Вот наследие от Господа: дети; награда от Него — плод чрева.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Историческая справка об Auxánesthe kaì Plēthýnesthe','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "По Божьему замыслу, семья представляет собой сокровенный союз жизни и любви — начинание, которое, подобно всему сотворённому и искуплённому, найдёт своё свершение в Царствии Божьем.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Историческая справка о догмате «Плодитесь и размножайтесь»','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "«Плодитесь и размножайтесь» — библейский завет из книги Бытия (1:28), в котором Бог повелевает Адаму и Еве производить потомство и населять землю."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Ухаживать за супругом или супругой значительно проще, а [Concept('fertility', 'плодовитость')|E] существенно возрастает"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "Можно в любое время развестись с супругом или супругой с низкой [Concept('fertility', 'плодовитостью')|E]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "Новорождённые получают бонус к [Concept('health', 'здоровью')|E] в зависимости от близости отношений между их родителями"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "Воспитание с заботой"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "Воспитание с любовью"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "Воспитание с обожанием"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "Ребёнок, рождённый в любящей семье, получает тепло обоих родителей и расцветает"
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "При рождении и при достижении совершеннолетия:\n$BULLET_WITH_TAB$#V Ребёнок#! получает модификатор «[GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip]» сроком на 2 года.\n$BULLET_WITH_TAB$#V Родители#! получают модификатор «[GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip]» сроком на 2 года."
 tenet_be_fruitful_and_multiply_child_modifier: "Обожание"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "Ревностное почитание плодородия побуждает верующих проявлять больше заботы и внимания как к детям, так и к их родителям."
 tenet_be_fruitful_and_multiply_parent_modifier: "Прославление плодовитости"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "Successio Apostolica" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "Apostolikē Diadokhē" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "Апостольское преемство"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "Первенство чести и власти, дарованное Христом апостолу Петру и сохраняемое его преемниками — римскими понтификами.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Историческая справка о Successio Apostolica','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "Первым епископом Рима, рукоположенным самим апостолом Павлом, был Лин, сын Святой Клавдии.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Историческая справка об Apostolikē Diadokhē','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "Непрерывное преемство епископов от апостолов до настоящего времени, обеспечивающее подлинную передачу веры.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Историческая справка об Апостольском преемстве','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "Доктрина об апостольском преемстве гласит, что епископы получают свою власть через непрерывную череду рукоположений, восходящую к самим апостолам. Во II веке Ириней Лионский использовал апостольское преемство в качестве аргумента против гностических ересей, доказывая, что истинное учение Христа сохраняется через законных епископов Церкви. Начиная с XIII века понтифики носят Перстень Рыбака как символ преемства от Святого Петра. Православная церковь признаёт преемственность западных пап и их роль в раннем христианстве, однако Пётр рассматривается как равный прочим апостолам, а первым епископом Рима считается Лин."
 tenet_apostolic_succession_requires_head_of_faith_tt: "У вашей [Concept('faith', 'конфесии')|E] должен быть [Concept('head_of_faith', 'глава')|E]"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "[Concept('theocratic_vassals', 'Теократические вассалы')|E] той же [Concept('faith', 'конфессии')|E] предъявляют меньше [Concept('legitimacy_expectations', 'требований к легитимности')|E] [Concept('liege', 'сюзерена')|E]"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "Даёт модификатор «[GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]»"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "Продвижение [Concept('cardinal', 'кардинала')|E] повышает его [Concept('papabile_score', 'приоритет')|E] ещё на #P 10#!"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "Когда о вашей @legitimacy_icon![Concept('legitimacy', 'легитимности')|E] проповедует лично [Concept('head_of_faith', 'глава конфессии')|E], вы получаете дополнительную @legitimacy_icon![Concept('legitimacy', 'легитимность')|E]"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "Свержение [Concept('antipope', 'антипапы')|E] повышает @legitimacy_icon![Concept('legitimacy', 'легитимность')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 # Confession tenet
 tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
 tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
 tenet_confession_default_name: "Тайна исповеди"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "Благослови меня, отче, ибо я согрешил. О Всемилостивый Боже, припадая к Твоим стопам, молю Тебя о прощении. Со всей искренностью исповедую Тебе Господу Богу моему и священнику Твоему все мои грехи.\n\n$pam_james_5_16_latin$\n\n[Glossary('Историческая справка о Confessio','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "Боже, услышь мои жалкие слова и уничтожь вросший в меня корень зла наитием Всесвятого и Животворящего Духа!\n\n$pam_james_5_16_greek$\n\n[Glossary('Историческая справка об Exomológēsis','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "Через исповедь грешники могут получить отпущение грехов и примириться с Богом и Церковью.\n\n$pam_james_5_16_default$\n\n[Glossary('Историческая справка о Sacrament of Confession','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "Исповедь грехов на протяжении веков претерпела значительные изменения. На заре христианства публичное покаяние за тяжкие грехи было обычным явлением. Частная исповедь перед священником получила широкое распространение в VI веке, а затем утвердилась во всём западном христианском мире. В 1215 году Четвёртый Латеранский собор сделал ежегодную исповедь обязательной для всех христиан. Тайна исповеди, а именно абсолютная тайна исповеданных грехов, стала определяющей чертой причастия. Священники были готовы принять мученическую смерть, но не нарушить эту тайну."
 doctrine_parameter_tenet_confession_priests_secrets: "Если [Concept('court_chaplain', 'придворный капеллан')|E] вашей [Concept('faith', 'конфессии')|E] тоже исповедуется и относится к вам с симпатией (либо связан сильным влиянием), то эффективность [Concept('councillor_task', 'задания совета')|E] «$task_find_secrets$» для него повышается"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! от [Concept('clergy', 'духовенства')|E] этого [Concept('rite', 'течения')|E] даёт больше @piety_icon![Concept('piety', 'благочестия')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[Concept('schemes', 'Происки')|E] «[GetScheme('study_scripture').GetTypeName]» снижают больше [Concept('stress', 'стресса')|E]"
 doctrine_parameter_tenet_confession_confess_sins_decision: "Можно использовать [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_decision_confession').GetName]»"
 # Original Sin tenet
 tenet_original_sin_latin_name: "Peccatum Originale" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "Propatorikē Hamartía" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "Первородный грех"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "Все люди лишились невинности через прегрешение Адама. Последствия этого для человеческой природы, ослабленной и склонной ко злу, поныне пребывают в человеке и призывают его к духовной борьбе. \n\n$pam_romans_5_12_latin$\n\n[Glossary('Историческая справка о Peccatum Originale','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "Творец и Создатель наш, на нас вина. Адам и Ева, вняв Сатане, совершили богохульство. По самолюбию своему они позволили себя обольстить и тем самым ослабили природу рода людского. Помышление сердца нашего зло.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Историческая справка о Propatorikē Hamartía','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "Весь род людской наследует скверну первородного греха Адама, и лишь благодать Божья через Христа может даровать нам искупление.\n\n$pam_romans_5_12_default$\n\n[Glossary('Историческая справка о Первородном грехе','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "Доктрина первородного греха была впервые подробно сформулирована Святым Августином Иппонийским в начале V века, прежде всего в качестве ответа на еретические взгляды Пелагия, который отрицал наследуемую греховность человека. Блаженный Августин писал, что грех Адама передался всем его потомкам, повредив человеческую природу и сделав невозможным спасение без божественной благодати. В 418 году Карфагенский собор утвердил это учение, и оно стало краеугольным камнем западного христианского богословия. Восточное христианство выработало несколько иное понимание, делая акцент на прародительском грехе, а не на прямо унаследованной вине."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "[Concept('councillor_task', 'Задание совета')|E] по [Concept('promote_culture', 'продвижению культуры')|E] в [Concept('counties', 'графствах')|E], придерживающихся того же [Concept('rite', 'течения')|E], выполняется на #P 25%#! быстрее"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "[Concept('promote_culture', 'Смена культуры')|E] в [Concept('counties', 'графствах')|E], придерживающихся этой [Concept('faith', 'конфессии')|E], потребует на #N 50%#! больше времени, если [Concept('liege', 'сюзерен')|E] принадлежит к другой [Concept('faith', 'конфессии')|E]."
 doctrine_parameter_tenet_original_sin_sinners_insight: "Вы получите #P +10#! к максимальному шансу успеха враждебных [Concept('scheme', 'происков')|E] за каждый ваш [Concept('sin', 'грех')|E]"
 doctrine_parameter_tenet_original_sin_baptism_piety: "При рождении ребёнка вы получаете #P 50#! ед. @piety_icon![Concept('piety', 'благочестия')|E]; новорождённый проходит крещение, получая #P 250#! ед. @piety_icon![Concept('piety', 'благочестия')|E]"
 pam_original_sin_baptism_toast: "От вашего догмата «[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]»: грех новорождённого смыт"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "Hierarchia Caelestis" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "Небесная иерархия"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "Святые ангелы, окружите трон и дом мой. Отец Небесный, да умолкнет по велению ангелов Твоих всякий глас осуждения и страха, восстающий на меня, и да вознесут они молитвы мои ко престолу Твоему.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Историческая справка о Hierarchia Caelestis','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "Стань ангелом-хранителем, мудрым советником и спутником христиан, даруй им просвещение, силу, радость, мир и утешение.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Историческая справка об Ouranía Hierarkhía','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "Ангелы разделяются на девять чинов — от серафимов до простых ангелов. Каждый из них служит Богу согласно своему предназначению и неустанно печётся о роде людском.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Историческая справка о Небесной иерархии','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "Концепция небесной иерархии была систематизирована Псевдо-Дионисием Ареопагитом в V или VI веке в его трактате «О небесной иерархии», или «De Coelesti Hierarchia». Он разделил ангелов на ступени и триады. Так, на высшей ступени располагались серафимы, херувимы и престолы; на средней — господства, силы и власти, а на низшей — начала, архангелы и ангелы.\n\nДанная иерархия оказала огромное влияние на средневековое христианское богословие и применялась как в восточной, так и в западной церквях. Фома Аквинский включил это учение об ангелах в свой труд «Сумма теологии», или «Summa Theologica», а художественные образы небес в средневековом искусстве во многом формировались под его влиянием."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Назначение на [Concept('court_positions', 'придворные должности')|E] персонажей с высокой [Concept('aptitude', 'пригодностью')|E] увеличивает @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] на #P 3#!, а их увольнение или лишение должности снижает её на #N 3#!"
 pam_celestial_hierarchy_hire_sp_toast: "Личный принцип «[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )]»"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "Обладатели [Concept('court_positions', 'придворных должностей')|E], разделяющие [Concept('faith', 'конфессию')|E] [Concept('liege', 'сюзерена')|E], получают [Concept('aptitude', 'пригодность')|E] в зависимости от [Concept('piety_level', 'уровня набожности')|E]"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "[clergy|E] получает #P +20#! к согласию для [Concept('interaction', 'взаимодействий')|E] со светскими [Concept('rulers', 'правителями')|E]"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "[Concept('councillor_task', 'Задание совета')|E], касающееся [Concept('religious_relations', 'религиозных отношений')|E], на #P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')]%#! эффективнее"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "Принятие [Concept('interaction', 'взаимодействий')|E] [Concept('faith', 'единоверцами')|E] увеличивается на #P +10#! за каждый [Concept('piety_level', 'уровень набожности')|E] выше, чем у цели, и снижается на #N −10#! за каждый уровень ниже"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "Взаимодействия [Concept('clergy', 'духовенства')|E] со светским [Concept('ruler', 'правителем')|E]: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "Относительный [Concept('piety_level', 'уровень набожности')|E]: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "Церковный авторитет над светским [Concept('ruler', 'правителем')|E]: $VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "Miles Christi" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "Воины Христовы"
 tenet_miles_christi_latin_desc: "Итак, станьте, препоясав чресла ваши истиною и облекшись в броню праведности. Подвизайтесь добрым подвигом веры, как истинные воины Христовы.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Историческая справка о Miles Christi','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "Всякий верный христианин должен быть готов пострадать за Христа, твёрдо противостоя духовным силам зла и претерпевая испытания с мужеством воина.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Историческая справка о Stratiōtēs Christoũ','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "Верующим надлежит составить духовное воинство, сражаться с грехом и злом, облекшись во всеоружие Божие, и быть готовыми претерпеть страдания во имя Христа, как воины претерпевают за своего военачальника.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Историческая справка о Воинах Христовых', 'tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "Понятие «Воина Христова», или «Miles Christi», уходит корнями в христианскую традицию и восходит к посланиям святого Павла, в которых тот использует военные метафоры для описания духовной жизни. В Средние века это понятие применялось как к буквальному, так и к духовному сражению.\n\nВоенно-монашеские ордена, такие как тамплиеры и госпитальеры, воплощали этот идеал, сочетая монашескую дисциплину с воинским искусством. В трактате «Похвала новому рыцарству», или «De Laude Novae Militiae», Бернард Клервоский прославлял этих воинов-монахов как образец христианской добродетели, сражающихся не ради мирской выгоды, но ради защиты христианства."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Завершение оборонительной [Concept('war', 'войны')|E] на условиях [Concept('white_peace', 'статус-кво')|E] против той же [Concept('faith', 'конфессии')|E] даёт #P 100#! ед. @piety_icon![Concept('piety', 'благочестия')|E] и @legitimacy_icon![Concept('legitimacy', 'легитимность')|E] пропорционально рангам [Concept('title', 'титулов')|E] сторон и увеличивает @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] на #P 5#!"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Командование в победоносной [Concept('battle', 'битве')|E] или успешной [Concept('siege', 'осаде')|E] увеличивает @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] на #P 3#!"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "Победа в [Concept('battles', 'битвах')|E] против других [Concept('religion', 'религий')|E] с использованием оружия, являющегося [Concept('holy_relic', 'священной реликвией')|E], усиливает его свойства четырьмя благословениями; учитывается до #P 50#! побед"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "Милостыня"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "Так как вы сделали это одному из сих братьев и сестёр Моих меньших, то сделали Мне. Милостыня и забота о бедных — не просто гражданская обязанность, но путь приближения к Самому Христу.\n\n[Glossary('Историческая справка о Caritas','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "Греческий термин «Philanthrōpia», означающий любовь к человечеству, нашёл своё наиболее полное выражение в имперских и церковных больницах, приютах и раздаче милостыни в Новом Риме. Накормить голодного и выкупить пленного — значит подражать Христу, который истощил Себя ради нас.\n\n[Glossary('Историческая справка о Philanthrōpía','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "Вера рассматривает щедрые подаяния, заботу о бедных и церковную благотворительность как основной христианский долг, следуя Отцам Церкви и примеру ранних приютов и больниц.\n\n[Glossary('Историческая справка о Милостыне','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "В византийском христианстве понятие «philanthrōpia» обозначало как добродетель всеобщей любви, так и определённые институты — больницы, постоялые дворы, сиротские приюты и раздачу милостыни, чем занимались императоры, епископы и рядовые верующие. Василий Великий, Иоанн Златоуст, а позднее и такие императоры, как Юстиниан I, увязывали легитимность императорской власти с заботой о нуждающихся. Церковь не прославляла войну как путь к святости. Напротив, она утверждала, что богатство и власть оправданы лишь постольку, поскольку служат бедным."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "[GetCourtPositionType('high_almoner_court_position').GetName] может назначаться начиная с ранга [Concept('county', 'графства')|E] и выше"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Оплата выкупа другого [Concept('character', 'персонажа')|E] повышает @piety_icon![Concept('piety', 'благочестие')|E] и даёт @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] пропорционально потраченному @gold_icon![Concept('gold', 'золоту')|E]"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "#TOOLTIP:GAME_TRAIT,generous,$CHARACTER_ID$ #L Щедрые#!#! [Concept('characters', 'персонажи')|E]: #P +10#! к [Concept('opinion', 'мнению')|E] единоверцев, #P +20%#! к [Concept('development_growth', 'приросту развития')|E]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "#TOOLTIP:GAME_TRAIT,greedy,$CHARACTER_ID$ #L Жадные#!#! [Concept('characters', 'персонажи')|E]: #N −10#! к [Concept('opinion', 'мнению')|E] единоверцев, #N −25%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E]"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "Отправка [Concept('gift', 'подарка')|E] [Concept('character', 'персонажу')|E] в [Concept('debt', 'долгах')|E] даёт @prestige_icon![Concept('prestige', 'престиж')|E] и @piety_icon![Concept('piety', 'благочестие')|E]"
 pam_philanthropia_ransom_toast: "От вашего личного принципа «[GetTenetType('tenet_philanthropia').GetName( GetPlayer.GetRite )]»"
 # Scholasticism tenet
 tenet_scholasticism_latin_name: "Sacra Doctrina" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "Схоластика"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "Стремление к познанию есть одно из проявлений поклонения Всевышнему, ибо, постигая творение, мы приближаемся к пониманию Творца. Ищите мудрости — и она будет дарована вам.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Историческая справка о Sacra Doctrina','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "Вера и разум не противоположны, но взаимодополняемы, поскольку Бог даровал человеку ум для поиска истины и сердце для любви к Нему. Через учение и созерцание человек обретает высшее знание.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Историческая справка о Skholastikē','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "Посредством тщательного интеллектуального анализа и диалектического метода веру и разум можно примирить, что ведёт к более глубокому постижению божественной истины.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Историческая справка о Схоластике','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "В средневековых европейских университетах схоластика была основным научным методом и достигла своего расцвета в XII–XIII веках. Она стремилась примирить христианское богословие с классической философией, прежде всего с трудами Аристотеля.\n\nТакие великие схоласты, как Ансельм Кентерберийский, Пьер Абеляр, Альберт Великий и Фома Аквинский, разработали систематические методы богословия, основанные на логической строгости и искусстве диспута. Трактат Фомы Аквинского «Сумма теологии», или «Summa Theologica», остаётся величайшим достижением схоластического метода, представляя собой попытку соединить всё человеческое знание в единой христианской системе."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Посещение [Concept('points_of_interest', 'точек интереса')|E] в #L [GetReligionByKey('judaism_religion').GetName|l]их#!, #L [GetReligionByKey('islam_religion').GetName|l]их#! и #L [GetReligionByKey('zoroastrianism_religion').GetName|l]их#! [Concept('counties', 'графствах')|E] даёт дополнительное @piety_icon![Concept('piety', 'благочестие')|E], [Concept('experience', 'опыт')|E] [Concept('learning', 'учёности')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 doctrine_parameter_tenet_scholasticism_university_bonus: "Завершение #TOOLTIP:ACTIVITY_TYPE,activity_adult_education #L визита в университет#!#! даёт долгосрочный [Concept('modifier', 'модификатор')|E] «[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]»"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[Concept('scheme_success_chance', 'Шанс на успех происков')|E] «[GetScheme('study_scripture').GetTypeName]»: [success_chance_i]#P +10%#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "Ежегодный шанс получить модификатор «[GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]» без обучения. При этом шанс повышается за счёт большой [Concept('learning', 'учёности')|E], высокого [Concept('piety_level', 'уровня благочестия')|E] и знания нескольких языков"
