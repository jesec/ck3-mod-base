 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "Diliges Proximum" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "Возлюби ближнего своего"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "Помоги нам смотреть на других Твоими очами: не судить, а любить и видеть в них, как и в нас самих, дело рук Твоих, которое Ты завершишь в своё время.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Историческая справка о Diliges Proximum','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "Что может быть слаще и прекраснее любви к ближнему? Любовь — блаженство, а ненависть — мучение. На этих двух заповедях утверждается весь закон и пророки: возлюби Господа Бога твоего всем сердцем твоим и возлюби ближнего твоего, как самого себя.\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Историческая справка об Agapēseis tòn Plēsíon','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "Любовь к ближнему неотделима от любви к Богу, и через дела милосердия и сострадания человек исполняет весь Божественный закон.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Историческая справка о догмате «Возлюби ближнего своего»','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "Заповедь о любви к ближнему занимает центральное место в христианской этике. Впервые появившись ещё в книге Левит (19:18), этот догмат был приравнен Христом к любви к Богу как суть всего Божественного закона. Первые Отцы Церкви, например Климент Александрийский и Иоанн Златоуст, подчёркивали, что истинная любовь должна распространяться не только на семью и друзей, но и на всё человечество, включая незнакомцев и врагов. Именно это учение лежало в основе появления христианских благотворительных учреждений, больниц и обычая раздачи милостыни в Средние века."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "[Concept('counties', 'Графства')|E] этой [Concept('faith', 'конфессии')|E] с [Concept('county_opinion', 'народным мнением')|E] #P 60+#! могут получить [Concept('modifier', 'модификатор')|E] «[GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]»"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "[Concept('buildings', 'Здания')|E] «$building_type_hospices_01$» снижают [Concept('travel_danger', 'опасность')|E] в [Concept('county', 'графстве')|E] от #P 3#! до #P 10#! в зависимости от уровня"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "[Concept('buildings', 'Здания')|E] «$building_type_hospices_01$» дают от #P +2#! до #P +10#! к [Concept('epidemic_resistance', 'сопротивляемости поветрию')|E] в [Concept('province', 'провинции')|E] в зависимости от уровня"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "[Concept('scheme_success_chance', 'Шанс на успех происков')|E] «[GetScheme('sway').GetTypeName]» в отношении [Concept('characters', 'персонажей')|E] за пределами вашей [Concept('realm', 'державы')|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "Принятие #high предложения вассалитета#!:#P +15#!"
