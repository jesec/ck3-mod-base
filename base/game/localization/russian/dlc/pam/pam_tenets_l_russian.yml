 pam_luke_1_42_english: "Благословенна Ты между жёнами, и благословен плод чрева Твоего!"
 pam_luke_1_79_english: "Просветить сидящих во тьме и тени смертной, направить ноги наши на путь мира."
 pam_colossians_3_15_english: "И да владычествует в сердцах ваших мир Божий, к которому вы и призваны в одном теле, и будьте дружелюбны."
 pam_matthew_5_9_english: "Блаженны миротворцы, ибо они будут наречены сынами Божиими."
 pam_philippians_4_21_english: "Приветствуйте всякого святого во Христе Иисусе. Приветствуют вас находящиеся со мною братия."
 pam_hebrews_12_1_english: "Посему и мы, имея вокруг себя такое облако свидетелей, свергнем с себя всякое бремя и запинающий нас грех и с терпением будем проходить предлежащее нам поприще."
 pam_acts_7_59_english: "И побивали камнями Стефана, который молился и говорил: «Господи Иисусе! Приими дух мой»."
 pam_luke_22_19_english: "И, взяв хлеб и благодарив, преломил и подал им, говоря: сие есть тело Моё, которое за вас предаётся; сие творите в Моё воспоминание."
 pam_1_corinthians_1_10_english: "Умоляю вас, братия, именем Господа нашего Иисуса Христа, чтобы все вы говорили одно, и #bold не было между вами разделений#!, но чтобы вы соединены были в одном духе и в одних мыслях."
 pam_1_corinthians_10_16_english: "Чаша благословения, которую благословляем, не есть ли приобщение Крови Христовой? Хлеб, который преломляем, не есть ли приобщение Тела Христова?"
 pam_1_corinthians_10_17_english: "Один хлеб, и мы многие одно тело, ибо все причащаемся от одного хлеба."
 pam_john_6_41_english: "Возроптали на Него Иудеи за то, что Он сказал: «Я есмь хлеб, сшедший с небес»."
 pam_1_thessalonians_5_16_20_english: "Всегда радуйтесь. Непрестанно молитесь. За всё благодарите: ибо такова о вас воля Божия во Христе Иисусе. Духа не угашайте. Пророчества не уничижайте."
 pam_1_thessalonians_4_11_english: "И усердно стараться о том, чтобы жить тихо, делать своё дело и работать своими собственными руками, как мы заповедывали вам."
 pam_proverbs_6_6_english: "Пойди к муравью, ленивец, посмотри на действия его и будь мудрым."
 pam_john_19_26_27_english: "Иисус, увидев Матерь и ученика, тут стоящего, которого любил, говорит Матери Своей: Жено! се, сын Твой. Потом говорит ученику: се, Матерь твоя! И с этого времени ученик сей взял Её к себе."
 pam_isaiah_7_14_english: "Итак, Сам Господь даст вам знамение: се, Дева во чреве приимет и родит Сына, и нарекут имя Ему: Еммануил."
 pam_proverbs_31_20_english: "Длань свою она открывает бедному, и руку свою подаёт нуждающемуся."
 pam_revelation_12_1_english: "И явилось на небе великое знамение: жена, облечённая в солнце; под ногами её луна, и на главе её венец из двенадцати звёзд."
 pam_acts_8_18_english: "Симон же, увидев, что через возложение рук Апостольских подаётся Дух Святой, принёс им деньги."
 pam_proverbs_21_20_english: "Вожделенное сокровище и тук — в доме мудрого; а глупый человек расточает их."
 pam_luke_16_11_english: "Итак, если вы в неправедном богатстве не были верны, кто поверит вам истинное?"
 pam_john_10_30_english: "Я и Отец — одно."
 pam_john_1_1_english: "В начале было Слово, и Слово было у Бога, и Слово было Бог."
 pam_hebrews_1_3_english: "Сей, будучи сияние славы и образ ипостаси Его и держа всё словом силы Своей, совершив Собою очищение грехов наших, воссел одесную величия на высоте."
 pam_acts_1_8_english: "Но вы примете силу, когда сойдёт на вас Дух Святой; и будете Мне свидетелями в Иерусалиме и во всей Иудее и Самарии и даже до края земли."
 pam_acts_2_4_english: "И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать."
 pam_acts_2_38_english: "Пётр же сказал им: покайтесь, и да крестится каждый из вас во имя Иисуса Христа для прощения грехов; и получите дар Святого Духа."
 pam_2_macabees_12_44_english: "Ибо, если бы он не надеялся, что павшие в сражении воскреснут, то излишне и напрасно было бы молиться о мёртвых."
 pam_matthew_12_25_english: "Всякое царство, разделившееся само в себе, опустеет; и всякий город или дом, разделившийся сам в себе, не устоит."
 pam_matthew_12_32_english: "Если кто скажет слово на Сына Человеческого, простится ему; если же кто скажет на Духа Святого, не простится ему ни в сем веке, ни в будущем."
 pam_hebrews_12_29_english: "Потому что Бог наш есть огонь поядающий."
 pam_genesis_1_28_english: "И благословил их Бог, и сказал им Бог: плодитесь и размножайтесь, и наполняйте землю, и обладайте ею, и владычествуйте над рыбами морскими, и над птицами небесными, и над всяким животным, пресмыкающимся по земле."
 pam_matthew_19_5_english: "И сказал: посему оставит человек отца и мать и прилепится к жене своей, и будут два одною плотью."
 pam_ephesians_4_3_6_english: "Стараясь сохранять единство духа в союзе мира. Одно тело и один дух, как вы и призваны к одной надежде вашего звания; один Господь, одна вера, одно крещение."
 pam_ephesians_5_25_english: "Мужья, любите своих жён, как и Христос возлюбил Церковь и предал Себя за неё."
 pam_matthew_16_18_english: "И Я говорю тебе: ты — Пётр, и на сем камне Я создам Церковь Мою, и врата ада не одолеют её."
 pam_2_timothy_2_2_english: "И что слышал от меня при многих свидетелях, то передай верным людям, которые были бы способны и других научить."
 pam_titus_1_5_english: "Для того я оставил тебя в Крите, чтобы ты довершил недоконченное и поставил по всем городам пресвитеров, как я тебе приказывал."
 pam_james_5_16_english: "Признавайтесь друг пред другом в проступках и молитесь друг за друга, чтобы исцелиться: много может усиленная молитва праведного."
 pam_1_john_1_9_english: "Если исповедуем грехи наши, то Он, будучи верен и праведен, простит нам грехи наши и очистит нас от всякой неправды."
 pam_john_20_23_english: "Кому простите грехи, тому простятся; на ком оставите, на том останутся."
 pam_romans_5_12_english: "Посему, как одним человеком грех вошёл в мир, и грехом — смерть, так и смерть перешла во всех человеков, потому что в нём все согрешили."
 pam_psalm_51_5_english: "Вот, я в беззаконии зачат, и во грехе родила меня мать моя."
 pam_genesis_3_6_english: "И увидела жена, что дерево хорошо для пищи, и что оно приятно для глаз и вожделенно, потому что даёт знание; и взяла плодов его и ела; и дала также мужу своему, и он ел."
 # Celestial Hierarchy Tenet
 pam_hebrews_1_14_english: "Не все ли они суть служебные духи, посылаемые на служение для тех, которые имеют наследовать спасение?"
 pam_psalm_91_11_english: "Ибо Ангелам Своим заповедает о тебе — охранять тебя на всех путях твоих."
 pam_matthew_18_10_english: "Смотрите, не презирайте ни одного из малых сих; ибо говорю вам, что Ангелы их на небесах всегда видят лицо Отца Моего Небесного."
 # Miles Christi Tenet
 pam_ephesians_6_11_english: "Облекитесь во всеоружие Божие, чтобы вам можно было стать против козней диавольских."
 pam_2_timothy_2_3_english: "Итак, переноси страдания, как добрый воин Иисуса Христа."
 pam_1_timothy_6_12_english: "Подвизайся добрым подвигом веры, держись вечной жизни, к которой ты и призван, и исповедал доброе исповедание перед многими свидетелями."
 # Scholasticism Tenet
 pam_proverbs_1_7_english: "Начало мудрости — страх Господень; глупцы только презирают мудрость и наставление."
 pam_colossians_2_3_english: "В котором сокрыты все сокровища премудрости и ведения."
 pam_james_1_5_english: "Если же у кого из вас недостаёт мудрости, да просит у Бога, дающего всем просто и без упрёков, — и дастся ему."
 # Alexandrian Catechism Tenet
 pam_1_corinthians_1_30_english: "От Него и вы во Христе Иисусе, Который сделался для нас премудростью от Бога, праведностью и освящением и искуплением."
 # Adoptionism Tenet
 pam_mark_1_11_english: "И глас был с небес: Ты Сын Мой возлюбленный, в Котором Мое благоволение."
 pam_romans_1_4_english: "И открылся Сыном Божиим в силе, по духу святыни, через воскресение из мёртвых, о Иисусе Христе, Господе нашем."
 pam_acts_13_33_english: "И мы благовествуем вам, что обетование, данное отцам, Бог исполнил нам, детям их, воскресив Иисуса, как и во втором псалме написано: «Ты Сын Мой: Я ныне родил Тебя»."
 # Love Thy Neighbour Tenet
 pam_matthew_22_39_english: "Вторая же подобная ей: «Возлюби ближнего твоего, как самого себя»."
 pam_luke_10_27_english: "Он сказал в ответ: «Возлюби Господа Бога твоего всем сердцем твоим, и всею душою твоею, и всею крепостию твоею, и всем разумением твоим, и ближнего твоего, как самого себя»."
 pam_galatians_5_14_english: "Ибо весь закон в одном слове заключается: «Люби ближнего твоего, как самого себя»."
 # Divine Liturgy Tenet
 pam_isaiah_6_3_english: "И взывали они друг ко другу и говорили: Свят, Свят, Свят Господь Саваоф! вся земля полна славы Его!"
 pam_psalm_134_2_english: "Воздвигните руки ваши к святилищу и благословите Господа."
 pam_malachi_1_11_english: "Ибо от востока солнца до запада велико будет имя Моё между народами, и на всяком месте будут приносить фимиам имени Моему, чистую жертву; велико будет имя Моё между народами, говорит Господь Саваоф."
 # Aniconism Tenet
 pam_exodus_20_4_english: "Не делай себе кумира и никакого изображения того, что на небе вверху, и что на земле внизу, и что в воде ниже земли."
 # Armed Pilgrimages Tenet
 pam_matthew_16_24_english: "Тогда Иисус сказал ученикам Своим: если кто хочет идти за Мною, отвергнись себя, и возьми крест свой, и следуй за Мною."
 # Communal Identity Tenet
 pam_1_peter_2_9_english: "Но вы — род избранный, царственное священство, народ святой, люди, взятые в удел, дабы возвещать совершенства Призвавшего вас из тьмы в чудный Свой свет."
 # Consolamentum Tenet
 pam_2_timothy_4_7_english: "Подвигом добрым я подвизался, течение совершил, веру сохранил."
 # Divine Marriage Tenet
 pam_tobit_8_7_english: "И ныне, Господи, я беру сию сестру мою не для удовлетворения похоти, но поистине как жену: благоволи же помиловать меня, и дай мне состариться с нею!"
 # Gnosticism Tenet
 pam_1_corinthians_2_7_english: "Но проповедуем премудрость Божию, тайную, сокровенную, которую предназначил Бог прежде веков к славе нашей."
 # Mendicant Preachers Tenet
 pam_matthew_10_9_english: "Не берите с собою ни золота, ни серебра, ни меди в поясы свои."
 # Pentarchy Tenet
 pam_matthew_18_20_english: "Ибо, где двое или трое собраны во имя Моё, там Я посреди них."
 # Unrelenting Faith Tenet
 pam_hebrews_11_1_english: "Вера же есть осуществление ожидаемого и уверенность в невидимом."
 # Hesychasm Tenet
 pam_psalm_46_10_english: "Остановитесь и познайте, что Я — Бог: буду превознесён в народах, превознесён на земле."
 pam_matthew_6_6_english: "Ты же, когда молишься, войди в комнату твою и, затворив дверь твою, помолись Отцу твоему, Который втайне; и Отец твой, видящий тайное, воздаст тебе явно."
 pam_1_kings_19_12_english: "После землетрясения огонь, но не в огне Господь; после огня веяние тихого ветра."
 # Anachoresis Tenet
 pam_matthew_4_1_2_english: "Тогда Иисус возведён был Духом в пустыню, для искушения от диавола, и, постившись сорок дней и сорок ночей, напоследок взалкал."
 pam_hebrews_11_38_english: "Те, которых весь мир не был достоин, скитались по пустыням и горам, по пещерам и ущельям земли."
 pam_luke_5_16_english: "Но Он уходил в пустынные места и молился."
 # Mortification of the Flesh Tenet
 pam_1_corinthians_9_27_english: "Но усмиряю и порабощаю тело моё, дабы, проповедуя другим, самому не остаться недостойным."
 pam_galatians_5_24_english: "Но те, которые Христовы, распяли плоть со страстями и похотями."
 pam_romans_8_13_english: "Ибо если живёте по плоти, то умрёте, а если духом умерщвляете дела плотские, то живы будете."
 # Holy Myron Tenet
 pam_john_3_5_english: "Иисус отвечал: истинно, истинно говорю тебе, если кто не родится от воды и Духа, не может войти в Царствие Божие."
 pam_acts_10_38_english: "Как Бог Духом Святым и силою помазал Иисуса из Назарета, и Он ходил, благотворя и исцеляя всех, обладаемых диаволом, потому что Бог был с Ним."
 pam_2_corinthians_1_21_22_english: "Утверждающий же нас с вами во Христе и помазавший нас есть Бог, который и запечатлел нас и дал залог Духа в сердца наши."
 # Khachkar Tenet
 pam_galatians_6_14_english: "А я не желаю хвалиться, разве только крестом Господа нашего Иисуса Христа, которым для меня мир распят, и я для мира."
 pam_1_corinthians_1_18_english: "Ибо слово о кресте для погибающих юродство есть, а для нас, спасаемых, — сила Божия."
 pam_isaiah_19_19_english: "В тот день жертвенник Господу будет посреди земли Египетской, и памятник Господу у пределов её."
 # Miaphysitism Tenet
 pam_john_1_14_english: "И Слово стало плотию, и обитало с нами, полное благодати и истины; и мы видели славу Его, славу, как Единородного от Отца."
 pam_colossians_2_9_english: "Ибо в Нем обитает вся полнота Божества телесно."
 pam_philippians_2_6_7_english: "Он, будучи образом Божиим, не почитал хищением быть равным Богу; но уничижил Себя Самого, приняв образ раба, сделавшись подобным человекам и по виду став как человек."
 # Philanthropia Tenet
 pam_matthew_25_40_english: "Истинно говорю вам: так как вы сделали это одному из сих братьев Моих меньших, то сделали Мне."
 # Sanctity of Nature Tenet
 pam_psalm_24_1_english: "Господня земля и что наполняет её, вселенная и все живущее в ней."
 # Literalism Tenet
 pam_2_timothy_3_16_english: "Всё Писание богодухновенно и полезно для научения, для обличения, для исправления, для наставления в праведности."
 # Legalism Tenet
 pam_romans_2_13_english: "Потому что не слушатели закона праведны пред Богом, но исполнители закона оправданы будут."
 # Religious Law Tenet
 pam_matthew_18_18_english: "Истинно говорю вам: что вы свяжете на земле, то будет связано на небе; и что разрешите на земле, то будет разрешено на небе."
 # Communal Possessions Tenet
 pam_acts_4_32_english: "У множества же уверовавших было одно сердце и одна душа; и никто ничего из имения своего не называл своим, но всё у них было общее."
 # Ritual Hospitality Tenet
 pam_hebrews_13_2_english: "Страннолюбия не забывайте, ибо через него некоторые, не зная, оказали гостеприимство Ангелам."
 # Ritual Celebrations Tenet
 pam_psalm_150_3_4_english: "Хвалите Его со звуком трубным, хвалите Его на псалтири и гуслях. Хвалите Его с тимпаном и ликами, хвалите Его на струнах и органе."
 # Adaptability Tenet
 pam_1_corinthians_9_22_english: "Для всех я сделался всем, чтобы спасти по крайней мере некоторых."
 # Astrology Tenet
 pam_matthew_2_2_english: "Где родившийся Царь Иудейский? ибо мы видели звезду Его на востоке и пришли поклониться Ему."
 # Warmongering Tenet
 pam_psalm_144_1_english: "Благословен Господь, твердыня моя, научающий руки мои битве и персты мои — брани."
 # Natural Primitivism Tenet
 pam_genesis_2_25_english: "И были оба наги, Адам и жена его, и не стыдились."
 # Auspicious Birthright Tenet
 pam_jeremiah_1_5_english: "Прежде нежели Я образовал тебя во чреве, Я познал тебя, и прежде нежели ты вышел из утробы, Я освятил тебя."
 # Sacred Childbirth Tenet
 pam_psalm_127_3_english: "Вот наследие от Господа: дети; награда от Него — плод чрева."
 # Hedonism Tenet
 pam_ecclesiastes_8_15_english: "И похвалил я веселье; потому что нет лучшего для человека под солнцем, как есть, пить и веселиться: это сопровождает его в трудах во дни жизни его, которые дал ему Бог под солнцем."
 # Pursuit of Power Tenet
 pam_psalm_2_8_english: "Проси у Меня, и дам народы в наследие Тебе и пределы земли во владение Тебе."
 # Sanctioned False Conversions Tenet
 pam_2_kings_5_18_19_english: "когда пойдёт господин мой в дом Риммона для поклонения там и опрётся на руку мою, и поклонюсь я в доме Риммона, то, за моё поклонение в доме Риммона, да простит Господь раба твоего в случае сём. И сказал ему: иди с миром."
