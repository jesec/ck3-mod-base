l_russian:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "Наша остановка — [local_province.Custom('GetTerrainLandPlural')|l] владения [local_county.GetNameNoTierNoTooltip]. Мы достигаем окрестностей посёлка. [local_province.Custom('GetProvinceFoliageDescAdjective')|U] земли вполне подойдут. Мы разбиваем лагерь…"
 gdp_merchant_luxury_contract.0001.desc.locals: "а в ответ на наши неуклюжие расспросы о здешней природе проходящие мимо местные убедительно изображают…"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "а в ответ на наши расспросы проходящие мимо местные живописуют…"
 gdp_merchant_luxury_contract.0001.desc.jungle: "тяжёлое и сладкое благоухание пыльцы."
 gdp_merchant_luxury_contract.0001.desc.mountain: "свежий ветерок в ветвях деревьев."
 gdp_merchant_luxury_contract.0001.desc.desert: "пустынные земли под палящим солнцем."
 gdp_merchant_luxury_contract.0001.desc.plains: "пьянящий аромат полевых цветов."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "грозных кошек."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "коварных кошек."
 gdp_merchant_luxury_contract.0001.desc.bear: "свирепых медведей."
 gdp_merchant_luxury_contract.0001.desc.monkey: "проказливых обезьян."
 gdp_merchant_luxury_contract.0001.desc.elephant: "величавых слонов."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "грозных кошек и свирепых медведей."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "свирепых медведей и величавых слонов."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "грозных кошек и величавых слонов."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "проказливых обезьян и грозных кошек."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "проказливых обезьян и величавых слонов."
 gdp_merchant_luxury_contract.0001.desc.bird: "прекрасных птиц."
 gdp_merchant_luxury_contract.0001.desc.close: "Кажется, мы на правильном пути!"
 gdp_merchant_luxury_contract.0001.a: "Дикая фауна ждёт нас!"
 gdp_merchant_luxury_contract.0001.a.flavor: "Предпочтение отдаётся [martial_i|E][Concept('martial', 'военному делу')|E], [intrigue_i|E][Concept('intrigue', 'интригам')|E] и [prowess_i|E][Concept('prowess', 'доблести')|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "Мы попытаемся раздобыть #V [Concept('domicile_artifact', 'животное')|E]#! в дикой местности"
 gdp_merchant_luxury_contract.0001.b: "Посмотрим, что нам предложит [local_barony.Custom('BaronyTownType')|l]."
 gdp_merchant_luxury_contract.0001.b.flavor: "Предпочтение отдаётся [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E], [stewardship_i|E][Concept('stewardship', 'управлению')|E] и [gold_i|E][Concept('gold', 'золоту')|E]"
 gdp_merchant_luxury_contract.0001.b.tt: "Мы попытаемся раздобыть #V [Concept('domicile_artifact', 'животное')|E]#! в городском центре"
 gdp_merchant_luxury_contract_back_to_town_tt: "[local_barony.Custom('BaronyTownType')] зовёт!"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "Дикая природа зовёт!"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: местный колорит"
 gdp_merchant_luxury_contract.0011.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip] — место для меня новое. Передо мной раскинулись [local_province.Custom('GetProvinceAdjective')|l] улочки, и я брожу по ним, пока впереди не появляется [local_province.Custom('GetRegionalMarketTermGloss')|l]. Мой взгляд падает на [Select_CString(rich_local.IsFemale, 'богато одетую женщину', 'богато одетого мужчину')]. [Select_CString(rich_local.IsFemale, 'Она', 'Он')] ведёт с кем-то оживлённую беседу,"
 gdp_merchant_luxury_contract.0011.cage: "а рядом в клетке мается [rich_local.Custom('GetAnimalType')|l]!"
 gdp_merchant_luxury_contract.0011.shoulder: "а на плече у [Select_CString(rich_local.IsFemale, 'неё', 'него')] сидит [rich_local.Custom('GetAnimalType')|l]!"
 gdp_merchant_luxury_contract.0011.leashed: "а около [Select_CString(rich_local.IsFemale, 'неё', 'него')] на привязи сидит [rich_local.Custom('GetAnimalType')|l]!"
 gdp_merchant_luxury_contract.0011.close: "\n\nОт торговцев поблизости я узнаю, что это #L [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)|l]ая#! местная знаменитость [rich_local.GetTitledFirstName], а дикие и диковинные животные — [Select_CString(rich_local.IsFemale, 'её', 'его')] страсть.\n\nБыть может, мне удастся заключить сделку?"
 gdp_merchant_luxury_contract.0011.a: "«Меня живо интересует [rich_local.Custom('GetAnimalType')|l], [Select_CString(rich_local.IsFemale, 'моя госпожа', 'мой господин')]. Не желаете ли продать мне эту прелесть?"
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.GetTitledFirstName] забирает золото, и [rich_local.Custom('GetAnimalType')|l] достаётся вам"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetTitledFirstName] отвечает вам отказом"
 gdp_merchant_luxury_contract.0011.b: "Я найду такого же зверя самостоятельно…"
 gdp_merchant_luxury_contract.some_other_way: "Вам придётся измыслить другой способ достать зверя"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.GetTitledFirstName] с любопытством рассматривает меня, пока я представляюсь и нахваливаю животное.\n\n"
 gdp_merchant_luxury_contract.0012.success: "Чем дольше я говорю, тем больше смягчается [Select_CString(rich_local.IsFemale, 'её', 'его')] взгляд. [Select_CString(rich_local.IsFemale, 'Она', 'Он')] охотно принимает мои комплименты удивительному зверю и воодушевлённо интересуется, как меня так далеко занесло.\n\nМы быстро согласовываем цену, и [rich_local.Custom('GetAnimalType')|l] внезапно переходит ко мне!"
 gdp_merchant_luxury_contract.0012.failure: "Однако выражение [Select_CString(rich_local.IsFemale, 'её', 'его')] лица вскоре меняется: сперва на озадаченное, а после и вовсе на презрительное. В конце концов [Select_CString(rich_local.IsFemale, 'она', 'он')] резко прерывает мою тираду и жестом приказывает слугам увести меня прочь.\n\nДля [Select_CString(rich_local.IsFemale, 'этой напыщенной', 'этого напыщенного')] тупицы #EMP я#! не более чем [rich_local.Custom('GetAnimalType')|l]…"
 gdp_merchant_luxury_contract.0012.a: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] скоро наполнится пересудами!"
 gdp_merchant_luxury_contract.0012.b: "Эй, я могу предложить больше!"
 gdp_merchant_luxury_contract.0012.c: "Где живёт [Select_CString(rich_local.IsFemale, 'эта проходимка', 'этот проходимец')]? [rich_local.Custom('GetAnimalType')] #EMP будет#! принадлежать мне!"
 gdp_merchant_luxury_contract.0012.c.success: "[rich_local.Custom('GetAnimalType')] толкает вас на воровство"
 gdp_merchant_luxury_contract.0012.c.failure: "Вас чуть не сцапала стража"
 gdp_merchant_luxury_contract.0012.d: "#weak *качаю головой*#! «Ладно, добуду зверя самостоятельно»."
 gdp_merchant_luxury_contract.0012.e: "Всё, с меня хватит…"
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "[rich_local.GetTitledFirstName] имеет много собственности во владении [local_province.GetBaronyNameExplicitlyNoTooltip], так что найти её было легко. Ещё проще оказалось нанять головорезов в местной таверне, согласившихся пробраться туда под покровом ночи.\n\n"
 gdp_merchant_luxury_contract.0013.success: "Мы без труда залезли на чужую территорию и так же играючи покинули её. Не успели мы опомниться, как были уже за несколько улиц от места преступления. Мы затихли, прислушиваясь, нет ли звуков погони.\n\nТишина! Только [rich_local.Custom('GetAnimalType')|l] приглушённо [rich_local.Custom('GetAnimalSoundPresent')|l]!"
 gdp_merchant_luxury_contract.0013.failure: "К сожалению, на этом моё везение закончилось. [rich_local.Custom('GetAnimalType')] исступлённо [rich_local.Custom('GetAnimalSoundPresent')|l], и я еле сбегаю от стражи. А такой был хороший план…\n\nТеперь люди персонажа [rich_local.GetFirstName] бросятся меня искать!"
 gdp_merchant_luxury_contract.0013.a: "[rich_local.GetFirstName] [Select_CString(rich_local.IsFemale, 'должна была', 'должен был')] продать мне зверя!"
 gdp_merchant_luxury_contract.0013.b: "Нужно срочно отсюда валить!"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]: бестиарий"
 gdp_merchant_luxury_contract.0021.desc: "[local_barony.Custom('BaronyTownType')] — настоящий лабиринт, а [local_province.Custom('GetRegionalMarketTermGloss')|l] тут — лабиринт вдвойне. Наконец, я чую знакомую вонь и слышу гомон животных. За видавшим виды прилавком стоит [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)][Select_CString(dealer.IsFemale, 'ая', 'ый')] [Select_CString(dealer.IsFemale, 'женщина', 'мужчина')], а рядом громоздятся [local_province.Custom('GetProvinceAdjective')|l] клетки из [local_province.Custom('GetRandomRegionalWood')|l].\n\n[Select_CString(dealer.IsFemale, 'Торговка', 'Торговец')] замечает мой интерес и нетерпеливо подзывает меня. Кого тут только нет! Моё внимание сразу же привлекает [ROOT.Char.Custom('GetAnimalType')|l]. Что за [ROOT.Char.Custom('GetAnimalFeature')]! Пока я восторгаюсь, рядом протестующе [dealer.Custom('GetAnimalSoundPresent')|l] [dealer.Custom('GetAnimalType')|l]. Это животное, напротив, выглядит довольно-таки неважно…\n\nГлаза [Select_CString(dealer.IsFemale, 'торговки', 'торговца')] загораются жадным блеском."
 gdp_merchant_luxury_contract.0021.a: "«Какая красота… Сколько стоит [ROOT.Char.Custom('GetAnimalType')|l]?»"
 gdp_merchant_luxury_contract.0021.b: "Во владении [local_province.GetBaronyNameExplicitlyNoTooltip] тоже можно поторговаться…"
 gdp_merchant_luxury_contract.0021.b.success_critical: "Вы ловко проворачиваете сделку"
 gdp_merchant_luxury_contract.0021.b.success: "Вы сэкономили пару монет"
 gdp_merchant_luxury_contract.0021.b.failure: "Вы делаете только хуже"
 gdp_merchant_luxury_contract.0021.b.tt: "У вас будет возможность отказаться"
 gdp_merchant_luxury_contract.0021.c: "#weak *показываю пальцем*#! «[dealer.Custom('GetAnimalType')] — вот кто мне нужен!»"
 gdp_merchant_luxury_contract.0021.d: "«Я просто смотрю»."
 task_contract_success_pseudo: "#P Успех:#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "[Select_CString(dealer.IsFemale, 'Торговка', 'Торговец')] хитровато мне подмигивает. После этого мы целую вечность обсуждаем, какого качества у [ROOT.Char.Custom('GetAnimalPossessive')|l] [ROOT.Char.Custom('GetAnimalHide')|l] и насколько задорно это создание [ROOT.Char.Custom('GetAnimalSoundPresent')|l].\n\n"
 gdp_merchant_luxury_contract.0022.success: "Я приструниваю [Select_CString(dealer.IsFemale, 'торговку', 'торговца')] парочкой веских аргументов, и [Select_CString(dealer.IsFemale, 'она', 'он')] здорово сбивает цену, но дальше торговаться уже бессмысленно…"
 gdp_merchant_luxury_contract.0022.neutral: "Похоже, мои аргументы произвели впечатление на [Select_CString(dealer.IsFemale, 'торговку', 'торговца')]. [Select_CString(dealer.IsFemale, 'Она', 'Он')] немного снижает цену, но дальше — ни в какую…"
 gdp_merchant_luxury_contract.0022.failure: "Видимо, я чем-то обижаю [Select_CString(dealer.IsFemale, 'торговку', 'торговца')]. [Select_CString(dealer.IsFemale, 'Она', 'Он')] задирает цену на зверя и заявляет, что это последнее предложение…"
 gdp_merchant_luxury_contract.0022.a: "«По рукам»."
 gdp_merchant_luxury_contract.0022.b: "Вообще [dealer.Custom('GetAnimalType')|l] мне нравится больше…»"
 gdp_merchant_luxury_contract.0022.c: "#weak *качаю головой*#! «Так дело не пойдёт»."
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "Мне наконец удалось достичь желаемого: [ROOT.Char.Custom('GetAnimalType')|l] у меня! Мы надёжно зафиксировали клетку, и караван готовится к отбытию.\n\nЧто ж, встречай нас, [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_luxury_contract.0023.a: "Поехали!"
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: на охоте"
 gdp_merchant_luxury_contract.0041.desc: "Я сворачиваю с тропы, и передо мной — [local_province.Custom('GetTerrainType')|l]. На моём пути — [local_province.Custom('GetProvinceFoliageDesc')|l]. Я осторожно пробираюсь вперёд, надеясь обнаружить признаки присутствия зверя. Но всё тщетно: только крики птиц нарушают зловещую тишину. Я плотнее закутываюсь в плащ.\n\nЯ уже собираюсь идти обратно, как вдруг вижу: [local_province.Custom('GetProvinceGroundDesc')|l], а прямо посерёдке — [ROOT.Char.Custom('GetAnimalTrack')|l]! Сомнений быть не может, и [ROOT.Char.Custom('GetAnimalSound')|l] вдалеке это подтверждает. Где-то тут прячется [ROOT.Char.Custom('GetAnimalType')|l]!"
 gdp_merchant_luxury_contract.0041.a: "Быстрее, пока тварь не сбежала!"
 gdp_merchant_luxury_contract.0041.a.tt: "[THIS.Char.Custom('GetAnimalType')] не может сбросить вас со следа"
 gdp_merchant_luxury_contract.0041.b: "Л-ладно, возвращаемся!"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "Кругом лишь [local_province.Custom('GetProvinceFoliageDesc')|l], но вдруг где-то на периферии зрения мелькает [ROOT.Char.Custom('GetAnimalColor')|l] сполох. Это же [ROOT.Char.Custom('GetAnimalHide')|l] той твари! С дурным предчувствием я оборачиваюсь, и сердце почти выпрыгивает у меня из груди!\n\nПередо мной сидит [ROOT.Char.Custom('GetAnimalType')|l], ещё совсем [ROOT.Char.Custom('GetAnimalChild')|l], и взирает на меня с любопытством, без тени страха. Я осматриваюсь: возможно, поблизости мама или [ROOT.Char.Custom('GetAnimalGroup')|l]? Но нет. Кажется, малыш совсем один."
 gdp_merchant_luxury_contract.0042.a: "Я разыскиваю взрослую особь!"
 gdp_merchant_luxury_contract.0042.a.tt: "[THIS.Char.Custom('GetAnimalType')], взрослая [Concept('artifact', 'особь')|E]… Вы продолжаете поиски"
 gdp_merchant_luxury_contract.0042.b: "Может, поставить ловушку…"
 gdp_merchant_luxury_contract.0042.b.success: "[ROOT.Char.Custom('GetAnimalChild')] становится вашей приманкой"
 gdp_merchant_luxury_contract.0042.b.success.tt: "Вам также достаётся [THIS.Char.Custom('GetAnimalType')|l] (взрослая [Concept('artifact', 'особь')|E])"
 gdp_merchant_luxury_contract.0042.b.failure: "Вам не везёт: [ROOT.Char.Custom('GetAnimalChild')|l] сбегает"
 gdp_merchant_luxury_contract.0042.c: "Пора возвращаться. А #EMP ты#!, кроха, пойдёшь со мной!"
 baby_creature_artifact_name: "[ROOT.Char.Custom('GetAnimalChild')] [baby_creature.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "Передо мной всё так же [local_province.Custom('GetProvinceFoliageDesc')|l]… Вдруг меня ослепляет вспышка. Ужас охватывает меня: это, должно быть, хищник!\n\nК счастью, это всего лишь человек из местных. Он подозрительно осматривает меня, держа лук наготове.\n\n«Кто вам тут понадобился? Ба! Неужели [ROOT.Char.Custom('GetAnimalPlural')|l]? Впервые встречаю таких, как вы»."
 gdp_merchant_luxury_contract.0043.a: "Эй… А вы мне не поможете?"
 gdp_merchant_luxury_contract.0043.b: "Я с радостью с вами поохочусь!"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip] соглашается помочь"
 gdp_merchant_luxury_contract.0043.b.success_tt: "У вас будет больше шансов на успех"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip] отказывается помочь"
 gdp_merchant_luxury_contract.0043.c: "Прочь с дороги!"
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "[ROOT.Char.Custom('GetAnimalChild')] без сопротивления следует за вами на поляну и даёт себя привязать.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName] очень мне помогает, ведь [local_province.Custom('GetTerrainType')|l] — [Select_CString(hunter.IsFemale, 'её', 'его')] родная стихия, и [Select_CString(hunter.IsFemale, 'она', 'он')] знает всех местных обитателей. Вскоре мы нападаем на след [ROOT.Char.Custom('GetAnimalPossessive')|l]."
 gdp_merchant_luxury_contract.0044.desc: "Продвигаться по незнакомой местности тяжело: мы то и дело сбиваемся с пути и блуждаем кругами. Однако достаточно быстро мы находим след [ROOT.Char.Custom('GetAnimalPossessive')|l]!\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "Малыш резвится, тоненько [ROOT.Char.Custom('GetAnimalSoundParticiple')|l]. Вскоре на этот звук является [ROOT.Char.Custom('GetAnimaltype')|l] постарше. Перед нами — [local_province.Custom('GetProvinceFoliageDesc')|l], и оттуда осторожно высовывается зверь. Когда [ROOT.Char.Custom('GetAnimalChild')|l] оказывается почти в зоне его досягаемости, мы активируем ловушку!"
 gdp_merchant_luxury_contract.0044.bait_failure: "План был хорош, да только не задался… Какое-то время тварь сидит, тихонько [ROOT.Char.Custom('GetAnimalSoundParticiple')|l], а потом резко срывается и убегает. Снова только [local_province.Custom('GetProvinceFoliageDesc')|l] — и никого…"
 gdp_merchant_luxury_contract.0044.success: "Вокруг [local_province.Custom('GetProvinceFoliageDesc')|l], поэтому [ROOT.Char.Custom('GetAnimalType')|l] даже не замечает нашего приближения. [ROOT.Char.Custom('GetAnimalColor')] зверь дёргается, отчаянно [ROOT.Char.Custom('GetAnimalSoundParticiple')|l], и увязает в нашей сети!"
 gdp_merchant_luxury_contract.0044.failure: "Но потом всё идёт наперекосяк. [ROOT.Char.Custom('GetAnimalColor')] зверь мгновенно реагирует на наше появление и, [ROOT.Char.Custom('GetAnimalSoundParticiple')|l] от страха, улепётывает прочь. Вокруг лишь [local_province.Custom('GetTerrainLand')|l], и снова ничего."
 gdp_merchant_luxury_contract.0044.a: "Мы отлично сработались!"
 gdp_merchant_luxury_contract.0044.b: "Проклятые твари!"
 gdp_merchant_luxury_contract.0044.c: "Ха, кто тут у нас?"
 gdp_merchant_luxury_contract.0044.d: "Проклятая тварь!"
 gdp_merchant_luxury_contract.0044.e: "Знаете, где находится [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], [hunter.GetFirstNameNoTooltip]?"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: браконьерство"
 gdp_merchant_luxury_contract.0051.desc: "Мы попадаем в [local_province.Custom('GetProvinceGroundDescAdjective')|l] земли, где стоит небольшая деревушка, и расспрашиваем жителей о местной фауне, как вдруг староста просит нас уйти: дескать, тут охотится [rich_local.GetName], и все [rich_local.Custom('GetAnimalPlural')|l] априори принадлежат [Select_CString(rich_local.IsFemale, 'ей', 'ему')].\n\nКогда мы уже собираемся отправляться в путь, появляется [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)][Select_CString(hunter.IsFemale, 'ая', 'ый')] [Select_CString(hunter.IsFemale, 'охотница', 'охотник')]. Вполголоса [Select_CString(hunter.IsFemale, 'она', 'он')] сообщает, что [rich_local.Custom('GetAnimalPlural')|l], которых [Select_CString(rich_local.IsFemale, 'присвоила', 'присвоил')] себе [rich_local.GetTitleAsNamePossessiveNoTooltip|l], — лёгкая добыча. Почему бы не попытаться?\n\nИдея, конечно, дерзкая, но выдастся ли нам ещё такая возможность?"
 gdp_merchant_luxury_contract.0051.a: "[rich_local.Custom('GetAnimalType')]? Так чего же мы ждём?"
 gdp_merchant_luxury_contract.0051.a.flavor: "Местным может из-за нас достаться…"
 gdp_merchant_luxury_contract.0051.a.tt: "[rich_local.GetShortUIName] бдит, но вы попытаетесь добыть животное"
 gdp_merchant_luxury_contract.0051.b: "[rich_local.GetTitleAsNameNoTooltip] это так не оставит…"
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "Вокруг — [local_province.Custom('GetProvinceFoliageDesc')|l] и [local_province.Custom('GetTerrainTypePlural')|l], однако [hunter.GetFirstName] бодро ведёт нас вперёд. Когда мы выходим на поляну, [Select_CString(hunter.IsFemale, 'охотница', 'охотник')] останавливается и прислушивается.\n\n«Тихо! — шипит [Select_CString(hunter.IsFemale, 'она', 'он')]. — Они близко».\n\nПод нашими ногами — [local_province.Custom('GetProvinceGroundDesc')|l]. Внезапно мимо пробегает группа животных, и до нас доносятся крики охотников.\n\nА затем я улавливаю [rich_local.Custom('GetAnimalSound')|l]. Это [rich_local.Custom('GetAnimalType')|l]!"
 gdp_merchant_luxury_contract.0052.a: "Скорее, натягиваем сеть!"
 gdp_merchant_luxury_contract.0052.a.success: "[rich_local.Custom('GetAnimalType')] попадает в ловушку"
 gdp_merchant_luxury_contract.0052.a.neutral: "[rich_local.Custom('GetAnimalType')] уклоняется от ловушки"
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('GetAnimalType')] ранит вас"
 gdp_merchant_luxury_contract.0052.b: "Прячьтесь! Нам крышка!"
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('GetAnimalType')] сбегает"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "Когда мы возвращаемся в деревню, нам навстречу бежит староста. [rich_local.GetTitledFirstName] знает о браконьерах, и тут уже побывали [Select_CString(rich_local.IsFemale, 'её', 'его')] люди!\n\n"
 gdp_merchant_luxury_contract.0053.success: "[rich_local.Custom('GetAnimalType')] тихонько звенит оковами. [hunter.GetFirstName] выглядит [Select_CString(hunter.IsFemale, 'гордой и пристыжённой', 'гордым и пристыжённым')] одновременно."
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName] уныло смотрит под ноги, а остальные жители деревни одаривают [Select_CString(hunter.IsFemale, 'её', 'его')] хмурыми взглядами.\n\nКогда [Select_CString(hunter.IsFemale, 'охотница', 'охотник')] направляется к своему дому, мы наблюдаем следующую сцену: кругом [local_province.Custom('GetProvinceGroundDesc')|l], а [hunter.Custom('GetAnimalType')|l] [hunter.Custom('GetAnimalWalkParticiple')|l] на привязи."
 gdp_merchant_luxury_contract.0053.a: "«Какое удивительное создание…»"
 gdp_merchant_luxury_contract.0053.b: "«[rich_local.GetTitleAsNameNoTooltip] узнает, кто поймал зверя. Я расскажу!»"
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip] [Select_CString(hunter.IsFemale, 'впечатлена', 'впечатлён')] вашей смелостью"
 gdp_merchant_luxury_contract.0053.c: "«Это была ужасная идея…»"
 gdp_merchant_luxury_contract.0053.d: "«И всё же, [hunter.GetFirstNameNoTooltip], мне бы [Select_CString(hunter.IsFemale, 'пригодилась такая опытная охотница', 'пригодился такой опытный охотник')]»."
 gdp_merchant_luxury_contract.0053.e: "«Ты даже не [Select_CString(hunter.IsFemale, 'заикнулась', 'заикнулся')], что у тебя есть [hunter.Custom('GetAnimalType')|l]!»"
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "Кругом лишь [local_province.Custom('GetTerrainLandPlural')|l], однако сегодня утром перед нами наконец предстаёт [local_barony.Custom('BaronyTownType')] владения [local_province.GetBaronyNameExplicitlyNoTooltip]. Туда-то мы и держим путь!"
 gdp_merchant_luxury_contract.1001.desc.locals: "Мы скверно знаем [local_county.GetCountyData.GetCulture.GetLanguage.GetName|l] язык, так что проходящие через ворота жители с трудом нас понимают, но жестами указывают на…"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "Мы недурно знаем [local_county.GetCountyData.GetCulture.GetLanguage.GetName|l] язык, так что проходящие через ворота жители легко нас понимают и рассказывают про…"
 gdp_merchant_luxury_contract.1001.desc.religious: "величественную гробницу владения [religious_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "учебный центр владения [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.fallback: "местный рынок."
 gdp_merchant_luxury_contract.1001.a: "[local_province.Custom('GetRegionalMarketTerm')] — это идея. Там полно всякого."
 gdp_merchant_luxury_contract.1001.a.flavor: "Предпочтение отдаётся [stewardship_i|E][Concept('stewardship', 'управлению')|E] и [gold_i|E][Concept('gold', 'золоту')|E]"
 gdp_merchant_luxury_contract.1001.a.tt: "Мы попытаемся раздобыть #V [Concept('domicile_artifact', 'диковинку')|E]#! на рынке"
 gdp_merchant_luxury_contract.1001.d: "[local_province.Custom('GetRegionalMarketTerm')] нас ждёт!"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "Осмотрим это священное место."
 gdp_merchant_luxury_contract.1001.e.flavor: "Предпочтение отдаётся [piety_i|E][Concept('piety', 'благочестию')|E] и [learning_i|E][Concept('learning', 'учёности')|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "Мы попытаемся раздобыть #V [Concept('domicile_artifact', 'диковинку')|E]#! в священном месте"
 gdp_merchant_luxury_contract.1001.f: "Тут мы многое сможем узнать."
 gdp_merchant_luxury_contract.1001.f.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "Мы попытаемся раздобыть #V [Concept('domicile_artifact', 'диковинку')|E]#! в учебном центре"
 gdp_merchant_luxury_contract.1001.return.religious: "Вернёмся в священное место…"
 gdp_merchant_luxury_contract.1001.return.scholarly: "Отыщем учебный центр…"
 gdp_merchant_luxury_contract.1001.return.urban: "Просто заглянем на рынок…"
 gdp_merchant_luxury_contract.1001.give_up: "Ой, надоело!"
 gdp_merchant_luxury_contract.1001.fallback: "Я не покину владение [local_province.GetBaronyNameExplicitlyNoTooltip] с пустыми руками."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "Обойдя местные [local_province.Custom('GetRegionalMarketTermGlossPlural')|l], вы находите украшение"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: центр торговли"
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetTitle.Custom('BaronyTownType')|U] во владении [local_province.GetBaronyNameExplicitlyNoTooltip] выглядит оживлённо: местные и не местные снуют туда-сюда в поисках товаров. Перед вами — [local_province.Custom('GetRegionalMarketTermGloss')|l], и [local_province.Custom('GetProvinceAdjective')|l] улочки полнятся характерными звуками и запахами.\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "В тёмном углу я замечаю [Select_CString(urchin.IsFemale, 'беспризорницу', 'беспризорника')]. [Select_CString(urchin.IsFemale, 'Её', 'Его')] глазки-бусинки пристально следят за прохожими."
 gdp_merchant_luxury_contract.1101.antiques: "Моё внимание привлекает обшарпанный прилавок, заваленный потускневшим металлом, поделками из [local_province.Custom('GetRandomRegionalWood')|l] и другим старьём. [dealer.Custom('GetYoungMiddleAgedOld')][Select_CString(dealer.IsFemale, 'ая', 'ый')] [Select_CString(dealer.IsFemale, 'торговка', 'торговец')] сразу оживляется."
 gdp_merchant_luxury_contract.1101.bookseller: "За потрёпанным навесом из [ROOT.Char.Custom('RegionalFabric')|l] прямо у стены свалены в кучу древние свитки и фолианты. Здесь хозяйничает [dealer.Custom('GetYoungMiddleAgedOld')|l][Select_CString(dealer.IsFemale, 'ая', 'ый')] [Select_CString(dealer.IsFemale, 'женщина', 'мужчина')]."
 gdp_merchant_luxury_contract.1101.travelers: "На соседней площади устроились седовласые [traveler.GetCulture.GetCollectiveNoun|l]. #L [local_province.GetCulture.GetName]ие#! жители резко контрастируют с ними и в одежде, и в речи."
 gdp_merchant_luxury_contract.1101.tavern: "У таверны напротив шумит толпа, и я вижу, как [Select_CString(gambler.IsFemale, 'женщина', 'мужчина')] хамоватого вида вертит в руках кошель с монетами, которые проиграл [Select_CString(gambler.IsFemale, 'ей', 'ему')] соперник."
 gdp_merchant_luxury_contract.1101.merchant: "Я замечаю хорошо [Select_CString(other_merchant.IsFemale, 'одетую женщину, сетующую', 'одетого мужчину, сетующего')] на то, как медленно караван пробирается через город. Очевидно, это [Select_CString(other_merchant.IsFemale, 'местная торговка', 'местный торговец')], и я проникаюсь к [Select_CString(other_merchant.IsFemale, 'ней', 'нему')] симпатией."
 gdp_merchant_luxury_contract.1101.a: "Есть в этом ребёнке какое-то… #EMP лукавство#!."
 gdp_merchant_luxury_contract.1101.a.flavor: "Предпочтение отдаётся [intrigue_i|E][Concept('intrigue', 'интригам')|E] и [Concept('diplomacy', 'дипломатии')|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "Посмотрим, о чём поведает дитя"
 gdp_merchant_luxury_contract.1101.b: "В таких лавках встречаются любопытные вещицы…"
 gdp_merchant_luxury_contract.1101.b.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [gold_i|E][Concept('gold', 'золоту')|E]"
 gdp_merchant_luxury_contract.1101.b.tt: "Вы пытаетесь купить интересный товар"
 gdp_merchant_luxury_contract.1101.c: "Здесь наверняка завалялась парочка ценных книг."
 gdp_merchant_luxury_contract.1101.c.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [gold_i|E][Concept('gold', 'золоту')|E]"
 gdp_merchant_luxury_contract.1101.c.tt: "Вы пытаетесь купить занятную книгу"
 gdp_merchant_luxury_contract.1101.d: "[traveler.GetCulture.GetCollectiveNounNoTooltip], должно быть, многое повидали."
 gdp_merchant_luxury_contract.1101.d.lingua: "Попрактикуюсь в [traveler.GetCulture.GetLanguage.GetNameNoTooltip]ом языке."
 gdp_merchant_luxury_contract.1101.d.flavor: "Предпочтение отдаётся [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E] и [learning_i|E][Concept('learning', 'учёности')|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "Вы беседуете со странниками"
 gdp_merchant_luxury_contract.1101.e: "Эх, попытаю удачу…"
 gdp_merchant_luxury_contract.1101.e.flavor: "Предпочтение отдаётся [intrigue_i|E][Concept('intrigue', 'интригам')|E] и удаче"
 gdp_merchant_luxury_contract.1101.e.tt: "Посмотрим, что получится выиграть"
 gdp_merchant_luxury_contract.1101.f: "Пообщаться с оппонентом — хорошая мысль."
 gdp_merchant_luxury_contract.1101.f.flavor: "Предпочтение отдаётся [stewardship_i|E][Concept('stewardship', 'управлению')|E] и [prestige_i|E][Concept('prestige_level', 'уровню репутации')|E]"
 gdp_merchant_luxury_contract.1101.f.tt: "Посмотрим, что известно местным торговцам"
 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstName|U] держит глухую оборону. Я пытаюсь завоевать [Select_CString(urchin.IsFemale, 'её', 'его')] доверие, отпуская презрительные замечания в сторону прохожих. Затем в ход идёт [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]: я в красках пересказываю местные истории.\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "Мои рассказы о дальних краях и преимуществах жизни торговцев увлекают [Select_CString(urchin.IsFemale, 'оборванку', 'оборванца')]. Когда я уже собираюсь озвучить своё предложение, [Select_CString(urchin.IsFemale, 'она', 'он')] вдруг заявляет, что продаст мне одну драгоценность, если я возьму [Select_CString(urchin.IsFemale, 'её', 'его')] с собой."
 gdp_merchant_luxury_contract.1102.urchin.success: "Наконец я чувствую, что уже могу говорить прямо, и спрашиваю, сколько [Select_CString(urchin.IsFemale, 'девочка', 'мальчик')] хочет за драгоценность. Хитро ухмыляясь, [Select_CString(urchin.IsFemale, 'она', 'он')] называет цену."
 gdp_merchant_luxury_contract.1102.urchin.failure: "Наконец я чувствую, что уже могу говорить прямо, и спрашиваю, сколько [Select_CString(urchin.IsFemale, 'девочка', 'мальчик')] хочет за драгоценность. Однако [Select_CString(urchin.IsFemale, 'она', 'он')] лишь кривит губы и велит мне проваливать."
 gdp_merchant_luxury_contract.1102.antiques: "Мы долго спорим с [Select_CString(dealer.IsFemale, 'ушлой торговкой', 'ушлым торговцем')] о качестве, возрасте и состоянии товара.\n\nВ результате мы с [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )][Select_CString(dealer.IsFemale, 'ой', 'ым')] [Select_CString(dealer.IsFemale, 'лавочницей', 'лавочником')] не находим компромисса."
 gdp_merchant_luxury_contract.1102.antiques.success: "Признаться, цена неплохая. Гораздо ниже, чем могла бы быть."
 gdp_merchant_luxury_contract.1102.antiques.failure: "Цена меня не сильно радует. По-моему, это надувательство."
 gdp_merchant_luxury_contract.1102.bookseller: "Мы долго спорим с [Select_CString(dealer.IsFemale, 'ушлой торговкой', 'ушлым торговцем')] о ценности, возрасте и состоянии книги.\n\nВ результате мы с [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )][Select_CString(dealer.IsFemale, 'ой', 'ым')] [Select_CString(dealer.IsFemale, 'лавочницей', 'лавочником')] не находим компромисса."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "Странники проникаются ко мне симпатией. По крайней мере, им со мной нескучно. Вскоре мы уже обмениваемся историями из наших приключений."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nНе успеваю я опомниться, как мы уже вместе трапезничаем, смеясь над трудностями, с которыми столкнулись во владении [local_province.GetBaronyNameExplicitly]. Когда приходит пора прощаться, [traveler.GetFirstName] тепло обнимает меня и суёт мне в руку какой-то свёрток."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nЯ делюсь парочкой новостей, но запас тем быстро иссякает. [traveler.GetCulture.GetCollectiveNoun] ясно дают понять, что их тяготит моё общество."
 gdp_merchant_luxury_contract.1102.tavern: "Пока мы разминаемся, кажется, будто наши силы равны. Мы выигрываем по парочке раундов, обмениваясь монетами и колкостями, однако нет сомнений, что [gambler.GetFirstName] — опасный игрок."
 gdp_merchant_luxury_contract.1102.tavern.success: "Похоже, мне сегодня благоволит [merchant.GetFaith.WealthGodName]! Я сразу ловлю удачу за хвост, а [Select_CString(gambler.IsFemale, 'ошарашенная', 'ошарашенный')] [gambler.GetFirstNameNoTooltip], ругаясь, всё сильнее и сильнее проигрывает, а потом и вовсе выбегает на улицу и зашвыривает кости куда подальше!"
 gdp_merchant_luxury_contract.1102.tavern.failure: "Пришлось немного потрудиться, однако в конце концов мне всё-таки удаётся выйти вперёд. [gambler.GetFirstNameNoTooltip] срывается, окончательно потеряв терпение, и я наслаждаюсь заслуженной победой — и выигрышем."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "[Select_CString(gambler.IsFemale, 'Она', 'Он')] почти сразу переходит в беспощадное наступление, не жалея сил, и я проигрываю одну игру за другой. Моё терпение истощается — как и мой кошелёк. Делать нечего — приходится отступать, пока [gambler.GetFirstNameNoTooltip] открыто насмехается надо мной."
 gdp_merchant_luxury_contract.1102.merchant: "В тихом кабинете неподалёку от места, где стоит [local_province.Custom('GetRegionalMarketTermGloss')|l], я и [other_merchant.GetTitledFirstName|l] пространно обсуждаем свои дела, размышляем, как бы получше пустить в ход имеющиеся у нас обоих связи в далёких краях, и бессовестно хвастаем друг перед другом завышенными успехами.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "Мы поладили сразу: оказалось, что [other_merchant.Custom('RegionalDrink')|l] и хлеб отлично способствуют обмену поучительными историями и обсуждению взаимовыгодных дел. На прощание [other_merchant.GetFirstNameNoTooltip], явно не желая расставаться с полюбившимся [Select_CString(other_merchant.IsFemale, 'ей', 'ему')] собеседником, преподносит мне прекрасный подарок — часть своего товара."
 gdp_merchant_luxury_contract.1102.merchant.failure: "Найти общий язык весьма нелегко: каждого из нас раздражает тяга собеседника к хвастовству и нежелание делиться чем-то действительно полезным. Вскоре я удаляюсь, не желая больше тратить время на такие бессодержательные беседы."
 gdp_merchant_luxury_contract.1102.a: "Это весьма неплохо."
 gdp_merchant_luxury_contract.1102.b: "Придётся этим и обойтись…"
 gdp_merchant_luxury_contract.1111.desc: "Я подхожу к [Select_CString(urchin.IsFemale, 'девочке', 'мальчику')]; только [local_province.Custom('GetProvinceAdjective')|l] улицы — свидетели нашего предстоящего разговора. Заметив меня, [Select_CString(urchin.IsFemale, 'она', 'он')] бросает из стороны в сторону взгляд своих пронзительных глаз и уже собирается сказать что-то в своё оправдание, но я даю понять, что меня не стоит бояться, и украдкой подбираюсь поближе к стене, к которой [Select_CString(urchin.IsFemale, 'прислонилась беспризорница', 'прислонился беспризорник')].\n\n[Select_CString(urchin.IsFemale, 'Она', 'Он')] поспешно прячет куда-то сжатую в руке блестящую безделушку — я едва успеваю её заметить — и, сплюнув, произносит: «Чего тебе? Я вообще-то [urchin.GetFirstName], и #EMP я#! тут [Select_CString(urchin.IsFemale, 'главная', 'главный')]!»"
 gdp_merchant_luxury_contract.1111.a: "Ты, похоже, кое в чём смекаешь."
 gdp_merchant_luxury_contract.1111.a.success_critical: "Вы завоёвываете [Select_CString(urchin.IsFemale, 'её', 'его')] доверие"
 gdp_merchant_luxury_contract.1111.a.success: "Вы покупаете [Select_CString(urchin.IsFemale, 'её', 'его')] добычу"
 gdp_merchant_luxury_contract.1111.a.failure: "Вы добиваетесь [Select_CString(urchin.IsFemale, 'её', 'его')] презрения"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "Эту вещь [Select_CString(urchin.IsFemale, 'украла', 'украл' )] [urchin.GetFirstName] на улицах поселения [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip]ое кольцо"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "[local_county.GetAdjectiveNoTooltip]ая брошь"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip]ое ожерелье"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "Старательно изображая равнодушие, я рассматриваю выставленные на продажу товары, стараясь ничем не выдать своего любопытства. Впрочем, насколько убедительно моё поведение — вопрос открытый.\n\nВскоре мой взор падает на одну замечательную вещь, заметно выделяющуюся на фоне остальных. За прошедшие годы она стала подлинной диковинкой даже здесь, в этих краях."
 gdp_merchant_luxury_contract.1121.a: "Давайте обсудим цену…"
 gdp_merchant_luxury_contract.1121.a.success_critical: "Вы сторговываетесь на очень хорошей цене"
 gdp_merchant_luxury_contract.1121.a.success: "Вы сторговываетесь на хорошей цене"
 gdp_merchant_luxury_contract.1121.a.failure: "[Select_CString(dealer.IsFemale, 'Она', 'Он')] не желает идти на уступки"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "[artifact.GetName] из древних времён"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] В бою это оружие совершенно бесполезно: время не пощадило его."
 gdp_merchant_luxury_contract.1121.artifact.bowl: "Древняя [local_province.GetCounty.GetCulture.GetCollectiveNounNoTooltip|l]ая миска"
 gdp_merchant_luxury_contract.1121.artifact.plate: "Древняя [local_province.GetCounty.GetCulture.GetCollectiveNounNoTooltip|l]ая тарелка"
 gdp_merchant_luxury_contract.1121.artifact.urn: "Древняя [local_province.GetCounty.GetCulture.GetCollectiveNounNoTooltip|l]ая урна"
 gdp_merchant_luxury_contract.1131.desc: "Старательно изображая равнодушие, я рассматриваю выставленные на продажу произведения, стараясь ничем не выдать своего любопытства. Впрочем, насколько убедительно моё поведение — вопрос открытый.\n\nВскоре мой взор падает на один замечательный переплёт, заметно выделяющийся на фоне остальных. Я понимаю, что передо мной — редкий, мало кому известный труд."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Эта вещь была куплена у торговца во владении [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1141.desc: "С располагающей улыбкой я подхожу к [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )][Select_CString(traveler.IsFemale, 'ой', 'ому')] [Select_CString(traveler.IsFemale, 'женщине', 'человеку')], явно [Select_CString(traveler.IsFemale, 'возглавляющей', 'возглавляющему')] это сборище. Вся надежда лишь на то, что мы сможем найти общий язык, поскольку каждый из нас здесь на чужбине.\n\n[Select_CString(traveler.IsFemale, 'Она', 'Он')] представляется мне как [traveler.GetFirstName]. Я сообщаю, что меня зовут [merchant.GetNameNoTooltip]. «Наверняка ведь вы слышали обо мне?» — в моих словах только доля шутки."
 gdp_merchant_luxury_contract.1141.a: "Наверное, вам есть что интересного рассказать!"
 gdp_merchant_luxury_contract.1141.a.flavor: "Проверка на [diplomacy_i|E][Concept('diplomacy', 'дипломатию')|E] и [prestige_i|E][Concept('prestige_level', 'уровень репутации')|E]"
 gdp_merchant_luxury_contract.1141.a.success: "Вы и [traveler.GetFirstNameNoTooltip] неплохо ладите"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip] устаёт от вашей компании"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] Это оружие, купленное у торговца во владении [local_province.GetBaronyNameExplicitly], совершенно бесполезно в бою: время не пощадило его."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetCollectiveNounNoTooltip]ая брошь"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ Куплена у путешественников во владении [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1151.desc: "Я отодвигаю занавеску и оказываюсь в грязном притоне, который облюбовали разного рода негодяи и проходимцы. Сидящий в середине комнаты человек, по виду — любитель азартных игр, с улыбкой на лице пересчитывает монеты.\n\nЯ сажусь напротив [Select_CString(gambler.IsFemale, 'неё', 'него')], и [Select_CString(gambler.IsFemale, 'она', 'он')] поднимает на меня оценивающий взгляд. «Сыграть хочешь? — с улыбкой произносит игрок. — Меня зовут [gambler.GetFirstName]. Не расстраивайся слишком сильно, когда проиграешь»."
 gdp_merchant_luxury_contract.1151.a: "Сыграем."
 gdp_merchant_luxury_contract.1151.a.flavor: "Проверка на [intrigue_i|E][Concept('intrigue', 'интриги')|E] и удачу"
 gdp_merchant_luxury_contract.1151.a.success: "Вы дочиста обыгрываете [Select_CString(gambler.IsFemale, 'её', 'его')]"
 gdp_merchant_luxury_contract.1151.a.failure: "Вы выигрываете немного монет"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "Вы проигрываете немного монет"
 gdp_merchant_luxury_contract.1151.artifact.dice: "Приносящие удачу кости"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "Кости, которые в тяжёлом состязании [Select_CString(gambler.IsFemale, 'проиграла', 'проиграл')] [gambler.GetFirstName] — негодяй и азартный игрок из владения [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1161.desc: "Я перебиваю [Select_CString(other_merchant.IsFemale, 'навязчивую купчиху', 'навязчивого купца')] и представляюсь знатным главой: мне подчиняется [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], что располагается во владении [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]; помимо этого, я добавляю, что пока не собираюсь вести здесь дела.\n\nОт [Select_CString(other_merchant.IsFemale, 'собеседницы', 'собеседника')] я узнаю, что [Select_CString(other_merchant.IsFemale, 'её', 'его')] зовут [other_merchant.GetName], [Select_CString(other_merchant.IsFemale, 'её', 'его')] родина — [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly], а здесь [Select_CString(other_merchant.IsFemale, 'она', 'он')] торгует таким товаром, как [merchant_good.GetName|l]. После обмена любезностями [Select_CString(other_merchant.IsFemale, 'купчиха', 'купец')] предлагает устроить меня в местечке неподалёку."
 gdp_merchant_luxury_contract.1161.a: "Мы можем обсудить весьма многое."
 gdp_merchant_luxury_contract.1161.a.flavor: "Проверка на [stewardship_i|E][Concept('stewardship', 'управление')|E] и [prestige_i|E][Concept('prestige_level', 'уровень репутации')|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip] начинает относиться к вам благосклоннее"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip] [Select_CString(other_merchant.IsFemale, 'неумолима', 'неумолим')]"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Образцы тканей"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Образцы [other_merchant.Custom('RegionalFabric')] из владения [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]. Используются купцами при заключении сделок."
 gdp_merchant_luxury_contract.1161.artifact.gem: "Образцы драгоценных камней"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Драгоценные камни из владения [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]. Используются купцами при заключении сделок."
 gdp_merchant_luxury_contract.1161.artifact.gold: "Образцы металлов"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Драгоценные металлы из владения [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]. Используются купцами при заключении сделок."
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: религиозный центр"
 gdp_merchant_luxury_contract.1501.desc: "Следуя тропами бесчисленных паломников и богомольцев, мы наконец приходим во владение [religious_building_province.GetName], где нашему взору предстаёт [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l].\n\n"
 gdp_merchant_luxury_contract.1501.site: "Эта гробница — великолепный памятник непоколебимости #L [religious_building_faith.GetReligion.GetName|l]ой#! веры правителей прошлого, для которых не было иного бога, кроме [religious_building_faith.HighGodNamePossessive]. Изнутри доносится мелодичный шум голосов: идёт служба."
 gdp_merchant_luxury_contract.1501.tombs: "Неподалёку сбились в кучку побитые временем и непогодой каменные надгробия; на каждом из них — [religious_building_faith.ReligiousSymbol|l]. Камень обильно порос мхом, во многих местах видны сколы."
 gdp_merchant_luxury_contract.1501.pilgrim: "Очереди на вход терпеливо ждёт вереница паломников — их одеяния не спутать ни с чем. Часть из них несёт с собой что-то вроде реликвария."
 gdp_merchant_luxury_contract.1501.monks: "В теньке поблизости расположилась кучка монахов. Они предаются созерцанию и тихо переговариваются о чём-то друг с другом. Вокруг всё степенно движется своим чередом."
 gdp_merchant_luxury_contract.1501.keepsake: "На подходе к сооружению я замечаю, что каменная кладка местами разошлась, а по камням пошли трещины. Время оставило здесь свой отпечаток."
 gdp_merchant_luxury_contract.1501.apostate: "В отбрасываемой зданием тени сидит [Select_CString(pilgrim.IsFemale, 'паломница', 'паломник')] с озабоченным выражением на лице. Локти [Select_CString(pilgrim.IsFemale, 'она положила', 'он положил')] на колени, одной рукой подпирает лоб, а в другой держит какую-то книжку."
 gdp_merchant_luxury_contract.1501.a: "Я хочу заглянуть внутрь."
 gdp_merchant_luxury_contract.1501.a.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [piety_i|E][Concept('piety', 'благочестию')|E]"
 gdp_merchant_luxury_contract.1501.a.tt: "Вы видите, что [religious_building_faith.HouseOfWorship] таит внутри"
 gdp_merchant_luxury_contract.1501.b: "В этих гробницах наверняка что-то есть…"
 gdp_merchant_luxury_contract.1501.b.flavor: "Предпочтение отдаётся [intrigue_i|E][Concept('intrigue', 'интригам')|E] и [prowess_i|E][Concept('natural_prowess', 'естественной доблести')|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "Вы возвращаетесь ночью, чтобы ограбить могилу"
 gdp_merchant_luxury_contract.1501.c: "Эти паломники — лёгкая добыча…"
 gdp_merchant_luxury_contract.1501.c.flavor: "Предпочтение отдаётся [intrigue_i|E][Concept('intrigue', 'интригам')|E] и [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "Вы пытаетесь облапошить паломника"
 gdp_merchant_luxury_contract.1501.d: "Я хочу поговорить с монахами."
 gdp_merchant_luxury_contract.1501.d.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [piety_i|E][Concept('piety', 'благочестию')|E]"
 gdp_merchant_luxury_contract.1501.d.tt: "Вы заводите разговор с монахами"
 gdp_merchant_luxury_contract.1501.e: "Никто не заметит, если один камень пропадёт…"
 gdp_merchant_luxury_contract.1501.e.flavor: "Предпочтение отдаётся [intrigue_i|E][Concept('intrigue', 'интригам')|E] и [prowess_i|E][Concept('natural_prowess', 'естественной доблести')|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "Вы пытаетесь украсть кусочек сооружения"
 gdp_merchant_luxury_contract.1501.f: "Похоже, [Select_CString(pilgrim.IsFemale, 'ей', 'ему')] нужна помощь."
 gdp_merchant_luxury_contract.1501.f.flavor: "Предпочтение отдаётся [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E] и [piety_i|E][Concept('piety', 'благочестию')|E]"
 gdp_merchant_luxury_contract.1501.f.tt: "Вы заводите разговор с паломником"
 gdp_merchant_luxury_contract.1502.site: "[priest.Custom('PriestTitle')|U] внимательно смеряет меня взглядом, тщательно прислушиваясь к моим словам и наблюдая за выражением моего лица. Мимо нас один за другим проходят паломники, тихо нашёптывающие молитвы и пожелания."
 gdp_merchant_luxury_contract.1502.site.success: "Наконец [Select_CString(priest.IsFemale, 'она', 'он')] вздыхает: «Не могу отказать в настолько искренней просьбе». [Select_CString(priest.IsFemale, 'Она', 'Он')] достаёт какую-то книгу, задумчиво гладит переплёт, а затем отдаёт её мне.\n\n«Берите, друг мой, и да направит вас слово [religious_building_faith.HighGodNameAlternatePossessive]»."
 gdp_merchant_luxury_contract.1502.site.failure: "Постояв так какое-то время, [Select_CString(priest.IsFemale, 'она', 'он')] хмурится: «Вы ошиблись дверью. Уходите отсюда. Здесь [religious_building_faith.HouseOfWorship|l], здесь мы возносим хвалу высшим силам. Мне некогда тратить время на ваши глупости».\n\nЯ ухожу, чувствуя спиной взгляды обернувшихся паломников."
 gdp_merchant_luxury_contract.1502.pilgrim: "Порасспросив там и тут, я узнаю, что реликвию они принесли с собой в качестве подарка, надеясь, что [pilgrim.GetFaith.HouseOfWorship|l] примет их подношение. Мне сообщают, что эту ценность они приобрели в окрестностях родного города.\n\nЯ изображаю ужас и озабоченность: этих добрых людей самым бесцеремонным образом обманули!\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Они огорчены, но не более. Бросив ящичек на землю около сооружения, они удаляются прочь."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Мои слова возымели самое неожиданное действие: рассерженные паломники швыряют реликвию на землю и разбивают её на кусочки на глазах у изумлённой толпы.\n\nПожалуй, лучше будет уйти…"
 gdp_merchant_luxury_contract.1502.tomb: "Вскрывать гробницы куда сложнее, чем кажется на первый взгляд! В конце концов, приложив невероятные усилия, мы всё-таки сдвигаем крышку с одной из них — той, что попривлекательнее.\n\nЯ утираю со лба пот и вглядываюсь во тьму. Кажется, там что-то есть!.. Осторожно протянув руку внутрь, я вытаскиваю наружу… нечто непонятное.\n\n«Посвети мне!» — нетерпеливым шёпотом произношу я.\n\nВ руках у меня…"
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "украшенная урна превосходной работы!"
 gdp_merchant_luxury_contract.1502.tomb.success: "старая и побитая урна."
 gdp_merchant_luxury_contract.1502.tomb.failure: "…#EMP кость#!?"
 gdp_merchant_luxury_contract.1502.monks: "Монахи — гораздо более интересные собеседники, чем мне казалось! Люди во власяницах охотно делятся со мной любопытнейшими толкованиями и соображениями касательно всего — и того, о чём гласит [monk.GetFaith.ReligiousText], и тайн образа [monk.GetFaith.TricksterGodNamePossessive].\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "Мы замечательно проводим время за беседой, и монахам даже жаль расставаться со мной. На прощание [monk.GetFirstName] одаривает меня тёплой улыбкой и вкладывает что-то мне в ладонь."
 gdp_merchant_luxury_contract.1502.monks.failure: "[monk.GetFirstName], впрочем, не проявляет совершенно никакого интереса к моим словам — они, по мнению этого человека, либо чересчур глупы, либо чересчур скучны. Вскоре мне дают понять, что собеседники мне больше не рады."
 gdp_merchant_luxury_contract.1502.keepsake: "Бросив за спину последний взгляд, я пытаюсь одним лёгким движением руки отломить, поймать и спрятать заинтересовавший меня кусок."
 gdp_merchant_luxury_contract.1502.keepsake.success: "С большим изяществом и грацией я откалываю кусочек стены, прячу его под плащ и иду дальше с беспечным видом. Похоже, никто этого не заметил."
 gdp_merchant_luxury_contract.1502.keepsake.failure: "Попытка не удалась. Я падаю на землю с глухим стуком; боль от удара заставляет меня зашипеть сквозь зубы. Проходящие рядом паломники, не веря своим глазам, переводят взгляды с меня на стену и обратно."
 gdp_merchant_luxury_contract.1502.apostate: "[Select_CString(pilgrim.IsFemale, 'Паломница', 'Паломник')] совершенно не возражает против моего общества. Я подсаживаюсь рядом; в памяти всплывает [merchant.GetFaith.ReligiousText], и я начинаю негромко цитировать стихи из писания. Мои слова действуют успокаивающе, и вскоре [Select_CString(pilgrim.IsFemale, 'несчастная', 'несчастный')] прекращает рыдать.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "Я чувствую, что мои слова проникают [Select_CString(pilgrim.IsFemale, 'ей', 'ему')] в душу, — и действительно, совсем скоро [pilgrim.GetFirstName] заявляет, что хочет уйти отсюда и пойти вместе со мной по пути [merchant.GetFaith.HighGodNameAlternatePossessive]!"
 gdp_merchant_luxury_contract.1502.apostate.success: "Я читаю по памяти — и наблюдаю, как меняется выражение [Select_CString(pilgrim.IsFemale, 'её', 'его')] лица, словно с плеч [Select_CString(pilgrim.IsFemale, 'паломницы', 'паломника')] только что упала тяжёлая ноша.\n\nБез единого слова [Select_CString(pilgrim.IsFemale, 'она', 'он')] поднимается на ноги и уходит вдаль, даже не подобрав с земли потрёпанную книжку."
 gdp_merchant_luxury_contract.1502.apostate.failure: "Не дождавшись, пока я закончу, [Select_CString(pilgrim.IsFemale, 'паломница', 'паломник')] сурово хмурится, и я вижу, как [Select_CString(pilgrim.IsFemale, 'ей', 'им')] овладевает новое чувство — гнев.\n\n[Select_CString(pilgrim.IsFemale, 'Она', 'Он')] кричит во всё горло, что я хочу склонить [Select_CString(pilgrim.IsFemale, 'её', 'его')] к вероотступничеству, и не где-то, а на священной земле, где находится [pilgrim.GetFaith.HouseOfWorship]!.. На крики постепенно сходятся недовольные зеваки."
 gdp_merchant_luxury_contract.1502.a.critical: "Это очень даже сгодится!"
 gdp_merchant_luxury_contract.1502.a: "Это весьма неплохо."
 gdp_merchant_luxury_contract.1502.b: "Придётся этим и обойтись…"
 gdp_merchant_luxury_contract.1511.desc: "Как только заходит солнце и [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l] скрывается во мраке, мы тут же отправляемся к забытым гробницам в надежде поживиться сокровищами усопших.\n\nОпасаясь, что нас заметят, мы специально идём окольными тропами, но в конечном итоге всё же добираемся до кладбища. Здесь царит полная тишина, а местный воздух кажется холоднее."
 gdp_merchant_luxury_contract.1511.a: "Вскроем гробницу, да поскорее!"
 gdp_merchant_luxury_contract.1511.a.flavor: "Проверка на [intrigue_i|E][Concept('intrigue', 'интриги')|E] и [prowess_i|E][Concept('prowess', 'доблесть')|E]"
 gdp_merchant_luxury_contract.1511.a.success_critical: "Вы находите дорогой артефакт"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "Вы находите #V [Concept('domicile_artifact', 'диковинку')|E]#! высокого качества"
 gdp_merchant_luxury_contract.1511.a.success: "Вы находите скромный артефакт"
 gdp_merchant_luxury_contract.1511.a.success.tt: "Вы находите #V [Concept('domicile_artifact', 'диковинку')|E]#! низкого качества"
 gdp_merchant_luxury_contract.1511.a.failure: "Вы не находите ничего ценного"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "Вы находите #V [Concept('domicile_artifact', 'диковинку')|E]#!"
 gdp_merchant_luxury_contract.1511.artifact.urn: "[religious_building_faith.GetAdjectiveNoTooltip]ие погребальные принадлежности"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "Старинная урна, украденная из #L [religious_building_faith.GetName|l]ой#! гробницы (источник: [religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1511.artifact.skull: "Украденный череп"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "Древний череп, украденный из #L [religious_building_faith.GetName|l]ой#! гробницы (источник: [religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1511.artifact.bone: "[priest.Custom('RandomSaintBone')|U] из гробницы"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "Древняя кость, украденная из #L [religious_building_faith.GetName|l]ой#! гробницы (источник: [religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1521.desc: "Я прохожу через массивные двери и оказываюсь в полутёмном, богато украшенном притворе. От здешних благовоний и подношений исходит сильный, но весьма приятный запах.\n\n[Select_CString(priest.IsFemale, 'Местная', 'Местный' )] [priest.Custom('PriestTitle')|l] что-то рассказывает столпившимся вокруг прихожанам. Я сильно выделяюсь из толпы, поэтому [Select_CString(priest.IsFemale, 'она', 'он' )] сразу же замечает меня.\n\n[Select_CString(priest.IsFemale, 'Священнослужительница', 'Священнослужитель' )] [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )|l] устремляется ко мне. «Перед вами [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]. Мы здесь всегда рады гостям».\n\n«Что привело вас сюда? — спрашивает [Select_CString(priest.IsFemale, 'она', 'он' )], с любопытством оглядывая меня. — Скажите, вы соблюдаете [religious_building_faith.GetNameNoTooltip|l]ие заповеди?»"
 gdp_merchant_luxury_contract.1521.a: "[religious_building_faith.GetNameNoTooltip] — это интересно. Я хочу узнать всё что можно!"
 gdp_merchant_luxury_contract.1521.a.flavor: "Проверка на [learning_i|E][Concept('learning', 'учёность')|E] и [piety_i|E][Concept('piety_level', 'уровень набожности')|E]"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')] предлагает мне текст"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')] что-то подозревает"
 gdp_merchant_luxury_contract.1531.desc: "[merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )|U]ые паломники смотрят на меня с подозрением и встают поближе к своей драгоценной реликвии, стараясь спрятать её от моего взгляда.\n\nМожно с уверенностью сказать, что [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip|l] весьма ценят эту вещь и [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] наверняка с интересом будет её обсуждать, когда я вернусь.\n\nДумаю, мне не составит труда убедить этих деревенщин, что их обманул какой-то лотошник или [pilgrim.GetFaith.PriestNeuter|l] без представлений о совести…"
 gdp_merchant_luxury_contract.1531.a: "Очевидно, что это подделка. [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] плюёт на такие — там они водятся сотнями."
 gdp_merchant_luxury_contract.1531.a.success: "Паломники оставляют реликвию"
 gdp_merchant_luxury_contract.1531.a.failure: "Паломники разозлены"
 gdp_merchant_luxury_contract.1541.desc: "Монахи сначала смотрят на меня с подозрением — им непривычны мои чужеземные манеры, однако долго скрывать любопытство у них не получается. Всё недоверие рассыпается окончательно, когда я заявляю, что хочу обсудить богословие.\n\nТе, кто помоложе, слегка робеют, однако [Select_CString(monk.IsFemale, 'главная', 'главный')] среди них — [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )][Select_CString(monk.IsFemale, 'ая', 'ый')] [Select_CString(monk.IsFemale, 'монахиня', 'монах')] по имени [monk.GetFirstName] — приглашает меня в свой круг и начинает осыпать вопросами о странствиях."
 gdp_merchant_luxury_contract.1541.a: "Да, всё это очень интересно, но что вы думаете об учении [monk.GetFaith.WealthGodNamePossessive]?"
 gdp_merchant_luxury_contract.1541.a.flavor: "Проверка на [learning_i|E][Concept('learning', 'учёность')|E] и [piety_i|E][Concept('piety_level', 'уровень набожности')|E]"
 gdp_merchant_luxury_contract.1541.a.success: "Монахам нравится разговор"
 gdp_merchant_luxury_contract.1541.a.failure: "Монахи не впечатлены"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "[religious_building_faith.GetAdjectiveNoTooltip]ие чётки"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "#L [religious_building_faith.GetName]ие#! чётки, полученные в дар от монаха (источник: [religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1541.artifact.icon: "[religious_building_faith.GetAdjectiveNoTooltip]ая икона"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "[SCOPE.Custom('ArtifactArticleWealth')|U]ая икона [SCOPE.Custom('ArtifactQuality')|l] качества, на которой изображается [newly_created_artifact.GetFeatureText('icon_decoration')]. Получена в дар от монаха по имени [monk.GetFirstName] (источник: [religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1551.desc: "Я осторожно оглядываюсь по сторонам и непринуждённо брожу туда-сюда, при этом вежливо улыбаясь прохожим и делая вид, будто я просто любуюсь архитектурой.\n\n[religious_building_district.GetType.GetPrimaryBuildingType.GetName] выглядит крепко, но мне удаётся найти подходящий участок стены, где камень уже достаточно расшатан. К счастью, поблизости почти никого нет."
 gdp_merchant_luxury_contract.1551.a: "Надо только дождаться подходящего мига…"
 gdp_merchant_luxury_contract.1551.a.success: "Вы забираете кусок кладки"
 gdp_merchant_luxury_contract.1551.a.failure: "Вас ловят с поличным"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Священная кладка"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "Небольшой кусок кладки, украденный на память из религиозной святыни (источник: [religious_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1561.desc: "Подойдя несколько поближе, я вижу, что [Select_CString(pilgrim.IsFemale, 'эта паломница', 'этот паломник')], подобно остальным, [Select_CString(pilgrim.IsFemale, 'нагружена', 'нагружен')] вещами, без которых не обойтись в пути, а кожа [Select_CString(pilgrim.IsFemale, 'её', 'его')] опалена безжалостным солнцем.\n\nМне удаётся выведать, что [Select_CString(pilgrim.IsFemale, 'её', 'его')] зовут [pilgrim.GetFirstName] и долгая череда несчастий заставила [Select_CString(pilgrim.IsFemale, 'её', 'его')] утратить веру в [pilgrim.GetFaith.GetNameNoTooltip|l]ое божество — [pilgrim.GetFaith.HighGodNamePossessive]. Восстановить её не помогло даже это паломничество.\n\nЯ замечаю, что в руке у [Select_CString(pilgrim.IsFemale, 'неё', 'него')] потрёпанное, запятнанное слезами писание — [pilgrim.GetFaith.ReligiousText], свидетельство того, насколько трудной бывает душевная борьба."
 gdp_merchant_luxury_contract.1561.a: "[merchant.GetFaith.ReligiousText] даст ответы на любой вопрос…"
 gdp_merchant_luxury_contract.1561.a.flavor: "Проверка на [diplomacy_i|E][Concept('diplomacy', 'дипломатию')|E] и [piety_i|E][Concept('piety_level', 'уровень набожности')|E]"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip] обращается в другую веру"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip] приободряется"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip] в ярости"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "[religious_building_faith.ReligiousText|U] в слезах"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "Личные заметки, которые [Select_CString(pilgrim.IsFemale, 'составила', 'составил')] [pilgrim.GetFaith.GetAdherentNameNoTooltip|l] [pilgrim.GetFirstName] — человек, утративший веру."
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: средоточие знаний"
 gdp_merchant_luxury_contract.1601.desc: "[scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] поражает своими масштабами. На территории этого огромного сооружения многие светлые умы неустанно ищут знания и дискутируют на самые разные темы.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "Рядом в окружении слуг постоянно мельтешит [Select_CString(scholar.IsFemale, 'некая женщина', 'некий человек')], чья [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )]ая душа явно рвётся наружу; при этом [Select_CString(scholar.IsFemale, 'она', 'он')] не забывает отпускать надменные замечания в отношении своих товарищей, искренне считая, что [Select_CString(scholar.IsFemale, 'она', 'он')] здесь [Select_CString(scholar.IsFemale, 'главная', 'главный')]."
 gdp_merchant_luxury_contract.1601.sages: "Под деревом неподалёку в полном безмолвии сидит [Select_CString(sage.IsFemale, 'умудрённая годами женщина', 'умудрённый годами человек')] — то ли размышляя над вопросами вселенской важности, то ли просто задремав."
 gdp_merchant_luxury_contract.1601.library: "Проходя мимо одной из дверей, я бросаю взгляд за порог и вижу грандиозную библиотеку, где в окружении книг и свитков в гордом одиночестве сидит, уткнувшись в какой-то текст, [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )][Select_CString(scholar.IsFemale, 'ая', 'ый')] [Select_CString(scholar.IsFemale, 'женщина', 'человек')] с выражением блаженства на лице."
 gdp_merchant_luxury_contract.1601.physician: "В другой комнате некто с величайшим интересом осматривает омерзительное собрание самых разных образцов: животных, людей, инструментов… Остаётся лишь надеяться, что [Select_CString(physician.IsFemale, 'эта женщина', 'этот человек')] — лекарь."
 gdp_merchant_luxury_contract.1601.student: "Кучка студентов неподалёку, расположившаяся в теньке центрального двора, ведёт жаркий спор — беззлобно, но громко, подкалывая друг друга и смеясь во весь голос."
 gdp_merchant_luxury_contract.1601.botanist: "В тихом уголке я натыкаюсь на комнату, где [Select_CString(botanist.IsFemale, 'некая', 'некий')] [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )][Select_CString(botanist.IsFemale, 'ая', 'ый')] [Select_CString(botanist.IsFemale, 'женщина обустроила', 'человек обустроил')] удивительное собрание растений и животных. Каждый экземпляр здесь тщательно защищён от воздействия стихий и подробно описан."
 gdp_merchant_luxury_contract.1601.a: "Должно быть, это декан."
 gdp_merchant_luxury_contract.1601.a.flavor: "Предпочтение отдаётся [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E] и [prestige_i|E][Concept('prestige_level', 'уровню репутации')|E]."
 gdp_merchant_luxury_contract.1601.a.tt: "Вы подходите к декану"
 gdp_merchant_luxury_contract.1601.b: "[Select_CString(sage.IsFemale, 'Эта старуха', 'Этот старик')] чем-то вызывает у меня интерес…"
 gdp_merchant_luxury_contract.1601.b.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [piety_i|E][Concept('piety_level', 'уровню набожности')|E]"
 gdp_merchant_luxury_contract.1601.b.tt: "Вы подходите к мудрецу"
 gdp_merchant_luxury_contract.1601.c: "Любая библиотека — кладезь знаний."
 gdp_merchant_luxury_contract.1601.c.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "Вы входите в библиотеку"
 gdp_merchant_luxury_contract.1601.d: "Медицина — это поразительно."
 gdp_merchant_luxury_contract.1601.d.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "Вы подходите к врачу"
 gdp_merchant_luxury_contract.1601.e: "С этими студентами не соскучишься."
 gdp_merchant_luxury_contract.1601.e.flavor: "Предпочтение отдаётся [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E] и [prowess_i|E][Concept('natural_prowess', 'естественной доблести')|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "Вы подходите к студентам"
 gdp_merchant_luxury_contract.1601.f: "Удивительная коллекция экземпляров."
 gdp_merchant_luxury_contract.1601.f.flavor: "Предпочтение отдаётся [learning_i|E][Concept('learning', 'учёности')|E] и [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "Вы осматриваете коллекцию"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "Изначально эта вещь хранилась в коллекции учебного заведения (источник: [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName])."
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName] молча слушает меня, пока я привожу один довод за другим. Все они сводятся к одному: я родом из далёких земель, где этот клочок бумаги не имеет совершенно никакого смысла.\n\nЗакончив рассуждать, я замолкаю, чтобы [Select_CString(scholar.IsFemale, 'она смогла', 'он смог')] ответить."
 gdp_merchant_luxury_contract.1602.dean.success: "[Select_CString(scholar.IsFemale, 'Она', 'Он')] широко ухмыляется и подаёт мне официальные документы, удостоверяющие мои… качества."
 gdp_merchant_luxury_contract.1602.dean.failure: "По [Select_CString(scholar.IsFemale, 'её', 'его')] безучастному лицу растекается тень, и меня неловким тоном просят уйти."
 gdp_merchant_luxury_contract.1602.sages: "Мы целую вечность рассуждаем о философии, поднимая даже такие вопросы, о которых мне редко доводится поговорить. Солнце постепенно клонится к закату; гул окружающего мира стихает.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "Наконец [sage.Custom('GetYoungMiddleAgedOld')][Select_CString(sage.IsFemale, 'ая', 'ый' )] [sage.GetWomanMan|l] встаёт, вытаскивает из складок мантии какой-то предмет, передаёт его мне и с многозначительным кивком уходит."
 gdp_merchant_luxury_contract.1602.sages.failure: "Наконец [sage.Custom('GetYoungMiddleAgedOld')][Select_CString(sage.IsFemale, 'ая', 'ый' )] [sage.GetWomanMan|l] встаёт, оправляет мантию и уходит, даже не попрощавшись. Ну что же, по крайней мере, хорошо побеседовали…"
 gdp_merchant_luxury_contract.1602.library: "Я даю понять, что меня интересует, какие книги [Select_CString(scholar.IsFemale, 'она', 'он')] читает. [Select_CString(scholar.IsFemale, 'Собеседница', 'Собеседник')], представившись именем [scholar.GetFirstName], начинает перечислять многочисленные труды; какие-то из них [Select_CString(scholar.IsFemale, 'ей', 'ему')] уже довелось прочитать, а какие-то — только предстоит. При этом [Select_CString(scholar.IsFemale, 'она', 'он')] не забывает интересоваться моим мнением о каждом из этих произведений.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "Проходит совсем немного времени, и вот [scholar.GetFirstNameNoTooltip] уже улыбается от уха до уха, словно ребёнок. Когда мы наконец расстаёмся, [Select_CString(scholar.IsFemale, 'она', 'он')] хитро подмигивает и вручает мне какой-то томик."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip] быстро утрачивает интерес к моим ответам и демонстративно поворачивается ко мне спиной, чтобы снова заняться своими писульками. Мне приходится уйти."
 gdp_merchant_luxury_contract.1602.physician: "Я заявляю о своём неподдельном интересе к анатомии и даже стараюсь подчеркнуть слова делом. [Select_CString(physician.IsFemale, 'Собеседница', 'Собеседник')] подробно рассказывает мне об устройстве человеческого тела, показывая для наглядности ту или иную кость.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "Похоже, объёмы моих познаний [Select_CString(physician.IsFemale, 'её', 'его')] впечатлили. Мне жалуются на бестолковых студентов, а затем вручают подарок."
 gdp_merchant_luxury_contract.1602.physician.failure: "Мои вопросы и неловкие объяснения вызывают у [Select_CString(physician.IsFemale, 'неё', 'него')] только раздражение. На то, чтобы выпроводить меня из комнаты под надуманным предлогом, требуется совсем немного времени."
 gdp_merchant_luxury_contract.1602.student: "Мы весело проводим время в заведении под названием «[student.Custom('GetPubName')]». В окружении юных почитателей, людей весьма разгульного нрава, я рассказываю о своих странствиях и отвечаю на бесчисленные вопросы.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "До самого рассвета мы перемещаемся от одной корчмы к другой. После торжественного прощания у обочины один из моих новых друзей что-то вкладывает мне в ладонь. Вот это ночка!"
 gdp_merchant_luxury_contract.1602.student.failure: "Однако счастье длится недолго: вскоре слушатели устают от моего общества и уходят, оставляя меня в гордом одиночестве в незнакомой мне части города. Вся моя компания — это чаша. Неужели им не понравились мои слова?"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName] с большой охотой рассказывает мне про свою коллекцию и показывает особенно любопытные или красивые экземпляры.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "Похоже, моё любопытство [Select_CString(botanist.IsFemale, 'её', 'его')] воодушевило: [Select_CString(botanist.IsFemale, 'она', 'он')] увлечённо рассказывает, откуда взялась та или иная редкая вещь, а я же с восхищением киваю головой в такт словам.\n\nКогда настаёт время прощаться, мне вручают небольшую вещицу, искренне меня заинтересовавшую."
 gdp_merchant_luxury_contract.1602.botanist.failure: "Я же, к сожалению, не могу в полной мере оценить всю красоту выставленных напоказ предметов, и вскоре [Select_CString(botanist.IsFemale, 'собеседница', 'собеседник')] даёт мне понять, что моё присутствие здесь совершенно не требуется…"
 gdp_merchant_luxury_contract.1602.a: "Буду холить и лелеять эту вещь!"
 gdp_merchant_luxury_contract.1602.b: "Ну, хоть что-то."
 gdp_merchant_luxury_contract.1611.desc: "Поначалу декан относится ко мне прохладно, но сразу же сменяет презрение на милость, стоит только мне упомянуть, что я — успешный торговец из далёкого края, что называется [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]. [Select_CString(scholar.IsFemale, 'Собеседница', 'Собеседник')] торжественно представляется мне как «[scholar.Custom('MistressMaster')|l] [scholar.GetFirstName]».\n\n[Select_CString(scholar.IsFemale, 'Она', 'Он')] приглашает меня в свой кабинет, а по пути показывает различные любопытные особенности местной архитектуры. Затем — долгожданный вопрос: «Итак, [merchant.GetTitledFirstNameNoTooltip|l], чем я могу вам помочь?»"
 gdp_merchant_luxury_contract.1611.a: "Мне бы весьма хотелось получить здесь образование…"
 gdp_merchant_luxury_contract.1611.a.flavor: "Проверка на [diplomacy_i|E][Concept('diplomacy', 'дипломатию')|E] и [prestige_i|E][Concept('prestige_level', 'уровень репутации')|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "Вам выдают почётный диплом"
 gdp_merchant_luxury_contract.1611.a.success: "Вам предлагают почётный диплом, но не бесплатно"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip] [Select_CString(scholar.IsFemale, 'оскорблена', 'оскорблён')]"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Почётный диплом"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "Почётный документ, вручённый деканом известного учебного заведения (источник: [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] во владении [local_province.GetBaronyNameExplicitly])."
 gdp_merchant_luxury_contract.1621.desc: "Я осторожно приближаюсь к [Select_CString(sage.IsFemale, 'мудрой женщине', 'мудрецу')], чтобы не потревожить [Select_CString(sage.IsFemale, 'её', 'его')] покой, однако от неожиданности вспрыгиваю как раз я!\n\n«Не желаете ко мне присоединиться? — спокойно спрашивает [Select_CString(sage.IsFemale, 'она', 'он')], совершенно не шевелясь и даже не раскрывая глаз. — Прошу, присаживайтесь».\n\nЯ соглашаюсь на это щедрое предложение и аккуратно усаживаюсь рядом.\n\n«Меня зовут [sage.GetFirstName], — хрипло произносит [Select_CString(sage.IsFemale, 'собеседница', 'собеседник')]. — Что привело вас сюда?»"
 gdp_merchant_luxury_contract.1621.a: "Я… даже не знаю."
 gdp_merchant_luxury_contract.1621.a.flavor: "Проверка на [learning_i|E][Concept('learning', 'учёность')|E] и [piety_i|E][Concept('piety_level', 'уровень набожности')|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[Select_CString(sage.IsFemale, 'Она', 'Он')] приободряется"
 gdp_merchant_luxury_contract.1621.a.failure: "[Select_CString(sage.IsFemale, 'Она', 'Он')] разочаровывается"
 gdp_merchant_luxury_contract.1631.desc: "Я вхожу в комнату и оказываюсь в окружении сотен, если не тысяч, полок, доверху забитых свитками и пыльными книгами с выцветшими чернилами.\n\nКогда я осторожно приближаюсь к [Select_CString(scholar.IsFemale, 'безмолвной хозяйке', 'безмолвному хозяину')] этого помещения, [Select_CString(scholar.IsFemale, 'она', 'он')] поднимает на меня взор — поначалу полный пренебрежения, но вскоре теплеющий: я, как чужеземец, вызываю у [Select_CString(scholar.IsFemale, 'неё', 'него')] интерес."
 gdp_merchant_luxury_contract.1631.a: "Что это вы такое читаете?"
 gdp_merchant_luxury_contract.1631.a.success: "[Select_CString(scholar.IsFemale, 'Она впечатлена', 'Он впечатлён')] вашими познаниями"
 gdp_merchant_luxury_contract.1631.a.failure: "[Select_CString(scholar.IsFemale, 'Она', 'Он')] считает вас неотёсанной деревенщиной"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "Передо мной разворачивается зловещее зрелище: [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)][Select_CString(physician.IsFemale, 'ая', 'ый')] [physician.GetWomanMan|l] под взором студентов бесцеремонно тычет указкой в бесчисленные кости, человеческие и не только, разложенные аккуратными рядами.\n\nНаконец, заметив меня, [Select_CString(physician.IsFemale, 'она', 'он')] бросает в мою сторону озадаченный взгляд и жестом приглашает присоединиться к обучающимся. Я понимаю, что передо мной — [physician.GetFirstName], и испытываю облегчение: значит, [Select_CString(physician.IsFemale, 'она', 'он')] и правда занимается медициной."
 gdp_merchant_luxury_contract.1641.a: "Скажите, вот эта кость — это ведь [merchant.Custom('RandomSaintBone')|l]?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'впечатлена', 'впечатлён')]"
 gdp_merchant_luxury_contract.1641.a.failure: "[physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'рассержена', 'рассержен')]"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "[physician.Custom('RandomSaintBone')|U] человека"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "Эта кость — наглядное пособие для обучения медицине. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "Человеческий череп"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "Этот череп — наглядное пособие для обучения медицине. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "Я подхожу к собравшимся и представляюсь. Студенты сбиваются вокруг меня в кучку; кто-то открыто посмеивается, но многим искренне любопытно увидеть здесь иностранца.\n\nУзнав, что я — купец-путешественник из земли, что зовётся [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], они тут же теряют интерес ко всему остальному и приглашают меня в расположенную неподалёку питейную, чтобы… угоститься."
 gdp_merchant_luxury_contract.1651.a: "В таверну!"
 gdp_merchant_luxury_contract.1651.a.success: "Вы развлекаете студентов"
 gdp_merchant_luxury_contract.1651.a.failure: "Вы утомляете студентов"
 gdp_merchant_luxury_contract.1661.desc: "Загадочное помещение ошеломляет: впервые в жизни мне доводится видеть такое грандиозное собрание разноцветных цветков, лепестков и листьев, мехов и перьев… Здесь, кажется, природа представлена во всём своём многообразии форм, расцветок и ароматов.\n\nВ чувство меня приводит голос [Select_CString(botanist.IsFemale, 'управляющей', 'управляющего')]: [Select_CString(botanist.IsFemale, 'она', 'он')] представляется как [botanist.GetFirstName] и предлагает мне узнать побольше о своей коллекции."
 gdp_merchant_luxury_contract.1661.a: "Большое спасибо!"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip] ценит ваш интерес"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip] не [Select_CString(botanist.IsFemale, 'впечатлена', 'впечатлён')]"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] зверя, что называется [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "Перо птицы, что называется [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
