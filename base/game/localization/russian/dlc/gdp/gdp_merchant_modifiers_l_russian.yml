l_russian:
 gdp_merchant_starting_capacity_modifier: "Повышенный потенциал"
 gdp_merchant_starting_capacity_modifier_desc: "Компания этого персонажа может транспортировать большие объёмы товаров."
 gdp_voluntary_merchant_modifier: "Вольный торговец"
 gdp_voluntary_merchant_modifier_desc: "Этот персонаж отказался от титулов, чтобы сделать себе имя на поприще торговли."
 gdp_patron_competitiveness_modifier: "Конкурентный стимул"
 gdp_patron_competitiveness_modifier_desc: "Этот персонаж убедил своего покровителя отдать предпочтение ему."
 gdp_romance_fan_modifier: "Безнадёжная романтика"
 gdp_romance_fan_modifier_desc: "Этот персонаж не в силах устоять перед хорошей любовной историей."
 gdp_nepotism_modifier: "Поощрение непотизма"
 gdp_nepotism_modifier_desc: "Этот персонаж считает, что отстаивать интересы семьи нужно любыми способами."
 gdp_merit_modifier: "Поощрение заслуг"
 gdp_merit_modifier_desc: "Этому персонажу безразличен источник доходов."
 gdp_full_attention_modifier: "Сосредоточенность на делах"
 gdp_full_attention_modifier_desc: "Этот персонаж не тратит время на пустяки."
 gdp_responsible_modifier: "Принятие обязательств"
 gdp_responsible_modifier_desc: "Этот персонаж принимает свои обязательства, по крайней мере пока."
 gdp_cooperation_modifier: "Дружественный дом"
 gdp_cooperation_modifier_desc: "Этот персонаж решил сотрудничать с другим домом к обоюдной выгоде."
 gdp_guild_master_inpiration_diplomacy_modifier: "Дипломатическое наставление"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "Этот персонаж обратился за наставлениями к сведущему в дипломатии главе гильдии."
 gdp_guild_master_inpiration_learning_modifier: "Научный совет"
 gdp_guild_master_inpiration_learning_modifier_desc: "Этот персонаж обратился за советом к учёному главе гильдии."
 gdp_guild_master_inpiration_stewardship_modifier: "Финансовое обучение"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "Этот персонаж обратился за обучением к главе гильдии."
 gdp_boasted_market_competence_modifier: "Укрепление уверенности в рынке"
 gdp_boasted_market_competence_modifier_desc: "Когда покровитель попросил этого персонажа изобразить дурака перед знатью, тот сумел обратить ситуацию себе на пользу."
 gdp_driven_by_motivation_modifier: "На поводу у амбиций"
 gdp_driven_by_motivation_modifier_desc: "Этот персонаж прилагает все усилия, чтобы приносить выгоду владельцу компании."
 gdp_promoted_diligence_modifier: "Поддержка усердия"
 gdp_promoted_diligence_modifier_desc: "Глава дома вынудил этого персонажа выложиться по полной ради компании в ущерб собственному благополучию."
 gdp_promoted_excess_modifier: "Поддержка излишеств"
 gdp_promoted_excess_modifier_desc: "Этого персонажа попросили отложить дела и жить роскошной жизнью с целью улучшения репутации и дипломатических связей компании."
 gdp_oasis_of_hope_modifier: "Оазис надежды"
 gdp_oasis_of_hope_modifier_desc: "Во время перехода через пустыню этот отряд чудесным образом обнаружил оазис и сумел восстановить силы."
 gdp_low_morale_entourage_modifier: "Упавшее духом сопровождение"
 gdp_low_morale_entourage_modifier_desc: "Несмотря на изнуряющую жару, этот персонаж решил не останавливаться и продолжил путь через пустыню."
 organize_the_venture_scheme_modifier: "Слаженное предприятие"
 organize_the_venture_scheme_modifier_desc: "Выполнение этой сделки ведётся по более строгому графику и под усиленным надзором."
 merchant_undercut_the_competition_modifier: "Безжалостное сбивание цен"
 merchant_undercut_the_competition_modifier_desc: "Этот персонаж сознательно снижает свою прибыль, чтобы вытеснить соперников с рынка."
 merchant_cornering_the_market_modifier: "Захват рынка"
 merchant_cornering_the_market_modifier_desc: "Этот персонаж использует недавнее давление на конкурентов, чтобы укрепить свои позиции на рынке."
 merchant_public_benefactor_modifier: "Благодетель для народа"
 merchant_public_benefactor_modifier_desc: "Этот персонаж финансирует общественные работы возле штаб-квартиры своей компании, превращая прибыль в народную любовь."
 merchant_private_profit_focus_modifier: "Частная прибыль"
 merchant_private_profit_focus_modifier_desc: "Этот персонаж сосредоточил усилия своей компании на коммерческой выгоде, пожертвовав общественным мнением."
 merchant_sponsored_public_works_county_modifier: "Общественные работы при поддержке купцов"
 merchant_sponsored_public_works_county_modifier_desc: "Это графство получило пользу от покровительства купеческой компании и проводимых ею общественных работ."
 gdp_merge_company_competitiveness_modifier: "Главенствующий торговец"
 gdp_merge_company_competitiveness_modifier_desc: "Этот персонаж упразднил торговые пути соперничающей компании и теперь господствует на этих рынках."
 gdp_merchant_full_larder_modifier: "Полная кладовая"
 gdp_merchant_full_larder_modifier_desc: "Этот персонаж приберёг для собственного стола еду, которой не хватало на голодающем рынке, и с тех пор ни в чём не нуждается."
 gdp_merchant_staying_vigilant: "Бдительность"
 gdp_merchant_staying_vigilant_desc: "Этот персонаж ждёт расплаты за голод, который был вызван его торговыми делами, потому внимательно следит за тенями."
 gdp_merchant_master_craft_tutelage_modifier: "Наставления мастера"
 gdp_merchant_master_craft_tutelage_modifier_desc: "Этот персонаж какое-то время провёл в мастерской искусного ремесленника, постигая его мастерство."
 gdp_thirsty_traveler_modifier: "Жаждущий путник"
 gdp_thirsty_traveler_modifier_desc: "Этому персонажу пришлось долго странствовать без воды."
 gdp_pure_waters_modifier: "Чистая вода"
 gdp_pure_waters_modifier_desc: "Спутники этого персонажа запаслись чистой водой и не испытывают жажды."
 gdp_rationing_water_modifier: "Экономия воды"
 gdp_rationing_water_modifier_desc: "Спутники этого персонажа строго, но разумно расходуют запасы воды. Их продвижение замедлилось, пока они ищут новые источники."
 gdp_workout_modifier: "Усталость"
 gdp_workout_modifier_desc: "Рубка деревьев стала для этого персонажа полезной, хоть и изнурительной тренировкой. Со временем силы вернутся."
 gdp_cat_rats_modifier: "Кошачья лапа"
 gdp_cat_rats_modifier_desc: "Этот персонаж избежал встречи с крысами в путешествии благодаря хвостатому и усатому спутнику."
 gdp_fishing_modifier: "Радости рыбалки"
 gdp_fishing_modifier_desc: "Этот персонаж по личному опыту знает ценность хорошего улова."
 gdp_catch_rats_modifier: "Ловля крыс"
 gdp_catch_rats_modifier_desc: "Этому персонажу доводилось ловить крыс в тёмном и тесном корабельном трюме, рискуя собственным здоровьем."
 dedicated_trade_studies: "Постижение секретов торговли"
 dedicated_trade_studies_desc: "Предпочитая коммерцию государственной службе, этот персонаж посвящает свою жизнь изучению рынков."
 gdp_local_business_modifier: "Местные рынки"
 gdp_local_business_modifier_desc: "Этот персонаж препочитает хорошо знакомые местные рынки погоне за далёкими богатствами шёлкового пути."
 gdp_silk_road_market_foothold_modifier: "Плацдарм на шёлковом пути"
 gdp_silk_road_market_foothold_modifier_desc: "Этот персонаж недавно вывел свою компанию на шёлковый путь и стремится извлечь максимальную выгоду из новых торговых связей."
 tgp_silk_road_interesting_innovations_modifier: "Любопытные инновации"
 tgp_silk_road_interesting_innovations_modifier_desc: "Этот персонаж заинтересовался инновациями на Шёлковом пути и вернулся с новыми знаниями."
 gdp_silk_road_bargain_modifier: "Выгодная сделка на Шёлковом пути"
 gdp_silk_road_bargain_modifier_desc: "Этот персонаж искал возможность заключить особенно выгодную сделку на рынке Шёлкового пути."
 gdp_silk_road_market_investment_modifier: "Вложения в рынок Шёлкового пути"
 gdp_silk_road_market_investment_modifier_desc: "Этот персонаж счёл вложения в рынок на Шёлковом пути выгодным решением."
 gdp_merchant_legacy_3_ennobled_modifier: "Почтенный торговец"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "Выдающаяся деловая хватка этого персонажа и его компании получила признание в высших кругах."
 gdp_merchant_legacy_3_rapacious_modifier: "Тщательная бухгалтерия"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "Этот персонаж тщательно проверяет всю отчётность компании и делится результатами с ключевыми помощниками."
