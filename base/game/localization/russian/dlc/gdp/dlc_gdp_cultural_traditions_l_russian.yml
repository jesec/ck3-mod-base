l_russian:
 tradition_fortune_seekers_name: "Искатели удачи"
 tradition_fortune_seekers_desc: "В этой культуре нет ничего постыдного в том, чтобы покинуть родной дом с пустыми руками. Те, кому мало что суждено унаследовать, отправляются за границу в надежде найти своё место под солнцем. Там они постигают искусство путешествий и узнают цену всякому товару или займу."
 culture_parameter_fortune_seekers_merchant_propensity: "[Concept('characters', 'Персонажи')|E] этой [Concept('culture', 'культуры')|E] чаще становятся [Concept('merchants', 'торговцами')|E]"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "Доступна [Concept('domicile_building', 'постройка в имении')|E] #V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName]#!"
 tradition_saharan_traders_name: "Сахарская торговля"
 tradition_saharan_traders_desc: "Давно известно, что Сахара это не столько барьер, сколько тракт для торговли, связующий Сахель и внутреннюю Западную Африку со Средиземным морем. Эта культура приняла свою роль посредников в этом обмене, и многие её представители всю жизнь проводят в караванах."
 culture_parameter_oasis_villages_building_slot: "[Concept('districts', 'Районы')|E] #V [GetDistrictType('villages_district').GetName]#!, #V [GetDistrictType('religious_community_district').GetName]#! и #V [GetDistrictType('manor_houses_district').GetName]#! в #TOOLTIP:TERRAIN,oasis #L оазисах#!#! получают #P +1#! ячейку [Concept('building', 'здания')|E]"
 culture_parameter_saharan_seasoned_traveler_route_length: "Каждый уровень направления #V $trait_track_danger$#! [Concept('trait', 'свойства')|E] «[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]» даёт #P +1#! к [Concept('trade_route_length', 'длине торгового пути')|E]"
 culture_parameter_saharan_merchant_domicile_buildings: "Доступны [Concept('domicile_buildings', 'постройки в имении')|E] #V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#! и #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#!"
 culture_parameter_caravan_escort_compound_domicile_building: "Доступна [Concept('domicile_building', 'постройка в имении')|E] #V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName]#!"
 tradition_silk_road_traders_name: "Дельцы шёлкового пути"
 tradition_silk_road_traders_desc: "По шёлковому пути непрерывной рекой текут товары между востоком и западом. Шёлк, чай, лаковые изделия, нефрит и множество иных дорогостоящих товаров перевозятся между перевалочными пунктами на долгом пути. Эта торговля изменила людей, проживающих вдоль торгового пути. Богатые города либо напрямую участвуют в торговле на больших расстояниях, либо торгуют с проходящими купцами."
 tradition_monsoon_traders_name: "Муссонные торговцы"
 tradition_monsoon_traders_desc: "Будь то западные нахуды или торговые гильдии и касты востока, торговцы Индийского океана из поколения в поколение перевозят перец, хлопковую ткань и ценные товары между рынками."
 culture_parameter_caravanserai_hospitality: "[Concept('characters', 'Персонажи')|E] этой [Concept('culture', 'культуры')|E] могут использовать [Concept('interaction', 'взаимодействие')|E] #V $host_honored_guest_interaction$#!"
 culture_parameter_stewardship_gain_from_foreign_poi: "Посещение [Concept('point_of_interest', 'точки интереса')|E] в землях другой [Concept('culture', 'культуры')|E] даёт [Concept('lifestyle_experience', 'жизненный опыт')|E] [Concept('stewardship', 'управления')|E]"
 culture_parameter_silk_road_market_expertise: "[Concept('decision', 'Решение')|E] #V $visit_silk_road_market_decision$#! приносит вам больше выгоды"
 culture_parameter_silk_road_oasis_urban_building_slots: "[Concept('districts', 'Районы')|E] #V [GetDistrictType('urban_housing_district').GetName]#! и #V [GetDistrictType('guild_district').GetName]#! в #TOOLTIP:TERRAIN,oasis #L оазисах#!#! получают #P +1#! ячейку [Concept('building', 'здания')|E]"
 culture_parameter_silk_road_market_owner_bonuses: "[Concept('buildings', 'Здания')|E] рынка шёлкового пути платят больше [Concept('commerce_tax', 'налогов с торговли')|E]"
 culture_parameter_silk_road_merchant_domicile_buildings: "Доступны [Concept('domicile_buildings', 'постройки в имении')|E] #V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName]#! и #V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName]#!"
 culture_parameter_monsoon_traveler_trade_bonuses: "Направление #V $trait_track_travel$#! [Concept('trait', 'свойства')|E] «[GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]» даёт дополнительную [competitiveness_i][Concept('trade_competitiveness', 'конкурентоспособность')|E], а направление #V $trait_track_danger$#! — дополнительный [trade_route_capacity_i][Concept('capacity', 'потенциал')|E]"
 culture_parameter_monsoon_port_buildings_settlement_size: "[Concept('buildings', 'Здания')|E] в [Concept('district', 'районе')|E] #V [GetDistrictType('port_district').GetName]#! увеличивают [Concept('settlement_size', 'размер поселения')|E] на #P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#!"
 culture_parameter_monsoon_merchant_domicile_buildings: "Доступны [Concept('domicile_buildings', 'постройки в имении')|E] #V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName]#! и #V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName]#!"
 tradition_binding_oaths_name: "Связанные клятвой"
 tradition_binding_oaths_desc: "Договорённости необходимо соблюдать. Этот народ верит, что заключённый контракт нельзя расторгать, и не терпит клятвопрестеплений."
 culture_parameter_binding_oaths_harsh_break_penalties: "Нарушение [Concept('truce', 'перемирия')|E], осуждение [Concept('creditor', 'ростовщика')|E] или разоблачение свойства «[GetTrait('dealbreaker').GetName( GetNullCharacter )]» приводит к гораздо более серьёзному ухудшению [Concept('opinion', 'мнения')|E] внутри [Concept('culture', 'культуры')|E] и отнимает #N 10%#! [Concept('acumen', 'деловой хватки')|E] [Concept('company', 'компании')|E]"
 culture_parameter_binding_oaths_word_is_trusted: "Другие [Concept('rulers', 'правители')|E] гораздо чаще соглашаются на [Concept('interaction', 'взаимодействие')|E] #V $negotiate_alliance_interaction$#! и отвечают на [Concept('interaction', 'взаимодействие')|E] #V $call_ally_interaction$#!, которое стоит [prestige_i]#P -50%#!"
 culture_parameter_good_faith_traits_more_common: "[Concept('traits', 'Свойства')|E] «[GetTrait('honest').GetName( GetNullCharacter )]» и «[GetTrait('trusting').GetName( GetNullCharacter )]» встречаются гораздо чаще"
 culture_parameter_good_faith_trait_bonuses: "[Concept('traits', 'Свойства')|E] «[GetTrait('honest').GetName( GetNullCharacter )]» и «[GetTrait('trusting').GetName( GetNullCharacter )]» дают дополнительные бонусы"
 culture_parameter_better_stewardship_education: "[Concept('children', 'Дети')|E] этой [Concept('culture', 'культуры')|E] чаще получают хорошее [Concept('education', 'образование')|E] в [Concept('stewardship', 'управлении')|E]"
 binding_oaths_broke_word_modifier: "Клятвопреступления"
 binding_oaths_alliance_accept_reason: "[Concept('tradition', 'Традиция')|E] «[GetCultureTradition('tradition_binding_oaths').GetName]» заставляет вас держать слово: $VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "[Concept('tradition', 'Традиция')|E] «[GetCultureTradition('tradition_binding_oaths').GetName]» заставляет меня уважать наш [Concept('alliance', 'союз')|E]: $VALUE|=+0$"
 culture_parameter_unlock_carnival_activity: "[Concept('republican', 'Республиканские')|E] [Concept('rulers', 'правители')|E] могут проводить [Concept('activity', 'занятие')|E] «[GetActivityType('activity_carnival').GetName]»"
 culture_parameter_merchant_propensity_bonus: "[Concept('characters', 'Персонажи')|E] этой [Concept('culture', 'культуры')|E] чаще становятся [Concept('merchants', 'торговцами')|E]"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line' )]"
 culture_parameter_trade_league_cohesion_bonus_has_dlc: "Каждый [Concept('title', 'титул')|E] этой [Concept('culture', 'культуры')|E], состоящий в [Concept('trade_league', 'торговой лиге')|E] увеличивает её [Concept('league_cohesion', 'сплочённость')|E] на #P 0,02#! в месяц"
 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line' )]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "[Concept('rulers', 'Правители')|E] [Concept('county', 'графского')|E] уровня могут основать [Concept('trade_league', 'торговую лигу')|E]"
 tradition_roman_law_name: "Римский закон"
 tradition_roman_law_desc: "В прошлом римский закон был основой этой земли. В этой культуре до сих пор изучают данный закон, и он распространяется на всё общество. Крестьяне, ремесленники, вдовы, знать, торговцы полагаются на букву закона при разрешении конфликтов."
 culture_parameter_roman_law_cheaper_university: "Отправка [Concept('ward', 'подопечного')|E] в университет и [Concept('activity', 'организация')|E] #TOOLTIP:ACTIVITY_TYPE,activity_adult_education #L визита в университет#!#! стоят #P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#![gold_i]"
 culture_parameter_roman_law_university_bonuses: "Университетские [Concept('buildings', 'здания')|E] дают дополнительные бонусы"
 culture_parameter_roman_law_education_bonuses: "[Concept('education_traits', 'Свойства образования')|E] [Concept('learning', 'учёности')|E] и [Concept('stewardship', 'управления')|E] и пятизвёздочные [Concept('education_traits', 'свойства образования')|E] дают дополнительные бонусы к [competitiveness_i] [Concept('trade_competitiveness', 'конкурентноспособности')|E] и [stewardship_i][Concept('stewardship_skill', 'управлению')|E]."
 culture_parameter_roman_law_legal_buildings_in_guild_district: "Линии [Concept('buildings', 'зданий')|E] #V [GetBuildingType('notary_1').GetName]#! и #V [GetBuildingType('court_of_law_1').GetName]#! можно строить в районе #V [GetDistrictType('guild_district').GetName]#!"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "Линии [Concept('buildings', 'зданий')|E] #V [GetBuildingType('market_court_1').GetName]#!, #V [GetBuildingType('notary_1').GetName]#! и #V [GetBuildingType('court_of_law_1').GetName]#! дополнительно увеличивают [popular_opinion_i] [Concept('popular_opinion', 'народное мнение')|E]"
 culture_parameter_roman_law_notariate_domicile_building: "Доступна [Concept('domicile_building', 'постройка в имении')|E] #V [GetDomicileBuilding('merchant_company_notariate_01').GetName]#!"
 tradition_civic_religion_name: "Гражданская религия"
 tradition_civic_religion_desc: "Этот народ вверяет религиозные вопросы гильдиям и братствам. За всё, от опеки над бедняками до обороны города или строительства церкви, отвечают группы благочестивых граждан."
 culture_parameter_civic_religion_temple_district_restriction: "[Concept('secular_rulers', 'Светским правителям')|E] недоступен [Concept('district', 'район')|E] #V [GetDistrictType('temple_district').GetName]#!"
 culture_parameter_civic_religion_guild_building_slots: "#V [GetDistrictType('guild_district').GetName]#! получает #P +2#! ячейки [Concept('building', 'здания')|E]"
 culture_parameter_civic_religion_guild_charity_buildings: "Линии [Concept('buildings', 'зданий')|E] #V [GetBuildingType('charities_1').GetName]#!, #V [GetBuildingType('hospitals_1').GetName]#!, #V [GetBuildingType('scribe_shop_1').GetName]#! и #V [GetBuildingType('scholarly_guilds_1').GetName]#! можно строить в районе #V [GetDistrictType('guild_district').GetName]#!"
 culture_parameter_civic_religion_basilica: "[Concept('republics', 'Республикам')|E] доступна линия [Concept('building', 'зданий')|E] «[GetBuildingType('republic_basilica_01').GetName|V]» в районе «[GetDistrictType('republic_great_plaza_district').GetName|V]»"
 culture_parameter_civic_religion_cathedral_civic_tax: "[Concept('buildings', 'Здания')|E] соборов также платят [Concept('civic_tax', 'городские налоги')|E]"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "Смена [Concept('personal_tenet', 'личного принципа')|E] даёт меньше [Concept('stress', 'стресса')|E]"
 culture_parameter_civic_religion_education_piety_bonuses: "[Concept('diplomacy', 'Дипломатические')|E] [Concept('education_traits', 'свойства образования')|E] и линия [Concept('traits', 'свойств')|E] «[GetTrait('education_republican_knowledge_3').GetName( GetNullCharacter )]» дают дополнительное [piety_i][Concept('piety', 'благочестие')|E]"
 culture_parameter_civic_religion_trait_piety_bonuses: "[Concept('traits', 'Свойства')|E] «[GetTrait('gregarious').GetName( GetNullCharacter )]» и «[GetTrait('family_first').GetName( GetNullCharacter )]» дают дополнительное [piety_i][Concept('piety', 'благочестие')|E]"
 culture_parameter_unlock_improved_republic_militia: "[Concept('republican', 'Республиканские')|E] [Concept('rulers', 'правители')|E] могут принимать [Concept('law', 'закон')|E] о #V народном ополчении#!"
 tradition_contado_name: "Контадо"
 tradition_contado_desc: "Земли этой культуры покрывает сеть небольших укреплённых городков, зачастую возведённых местными землевладельцами. Полагаясь на арендное земледелие, городские землевладельцы отдаляются от сельской рутины."
 culture_parameter_contado_castello_buildings: "Линию [Concept('buildings', 'зданий')|E] #V [GetBuildingType('castello_1').GetName]#! можно строить в районе #V [GetDistrictType('villages_district').GetName]#!"
 culture_parameter_contado_borghi_buildings: "Линию [Concept('buildings', 'зданий')|E] #V [GetBuildingType('borghi_1').GetName]#! можно строить в районе #V [GetDistrictType('walls_district').GetName]#!"
 culture_parameter_contado_towers_domicile_building: "Доступна [Concept('domicile_building', 'постройка в имении')|E] #V [GetDomicileBuilding('merchant_company_towers_01').GetName]#!"
 tradition_contract_warfare_name: "Война по контракту"
 tradition_contract_warfare_desc: "Эта культура превратила военное дело в нечто большее, чем ополчения и армии горожан. Войска работают по контракту, а офицеры договариваются о целях кампаний с городами и феодалами. Убийство перешло из разряда лично в разряд профессии."
 culture_parameter_unlock_innovation_condottieri: "[Concept('innovation', 'Инновация')|E] #high «$innovation_condottieri$»#! доступна начиная с [Concept('era', 'эпохи')|E] Позднего Средневековья"
 culture_parameter_contract_warfare_single_combat: "[Concept('rulers', 'Правители')|E] со [Concept('commander_trait', 'свойством командира')|E], [Concept('martial', 'военным')|E] [Concept('education_trait', 'образованием')|E] или [Concept('trait', 'свойством')|E] «[GetTrait('brave').GetName( GetNullCharacter )]» могут использовать [Concept('interaction', 'взаимодействие')|E] #V $challenge_to_single_combat_nomadic_interaction$#! в отношении [Concept('characters', 'персонажей')|E] равного или более низкого [Concept('title_tier', 'уровня')|E], не являющихся их [Concept('liege', 'сюзереном')|E]"
 culture_has_university_desc: "Эта [Concept('culture', 'культура')|E] не представлена ни в одном [Concept('county', 'графстве')|E] с университетом"
 cultrad_republic_government_type: "Ваша [Concept('government', 'форма правления')|E] — [GetGovernment( 'republic_government' ).GetName|l]"
 cultrad_has_military_district: "У вас есть [Concept('holding', 'владение')|E], в которое входит #V [GetDistrictType('military_district').GetName]#!"
 culture_in_oasis_desc: "Эта [Concept('culture', 'культура')|E] не распространена ни в одном [Concept('county', 'графстве')|E], где [Concept('terrain', 'тип местности')|E] — [GetTerrain( 'oasis' ).GetName|l]"
 oasis_count_desc: "[Concept('culture', 'Культура')|E] не распространена хотя бы в #V 2#! [Concept('counties', 'графствах')|E] с [Concept('terrain', 'типом местности')|E] «[GetTerrain( 'oasis' ).GetName]»"
 culture_in_silk_road_region_desc: "Эта [Concept('culture', 'культура')|E] не распространена на #ONCLICK:GEOGRAPHICAL_REGION,tgp_silk_road_region #TOOLTIP:GEOGRAPHICAL_REGION,tgp_silk_road_region #L Шёлковом пути#!#!#!"
 silk_road_percentage_desc: "Менее #V 30%#! [Concept('counties', 'графств')|E] этой [Concept('culture', 'культуры')|E] располагается в регионе [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 culture_on_monsoon_coast_desc: "Эта [Concept('culture', 'культура')|E] не распространена ни в одном прибрежном [Concept('county', 'графстве')|E] #ONCLICK:GEOGRAPHICAL_REGION,world_india #TOOLTIP:GEOGRAPHICAL_REGION,world_india #L Индии#!#!#!, #ONCLICK:GEOGRAPHICAL_REGION,world_africa_east #TOOLTIP:GEOGRAPHICAL_REGION,world_africa_east #L Восточной Африки#!#!#! или #ONCLICK:GEOGRAPHICAL_REGION,world_middle_east #TOOLTIP:GEOGRAPHICAL_REGION,world_middle_east #L Ближнего Востока#!#!#!"
 only_one_caravan_trade_tradition: "Нельзя иметь большое одной [Concept('tradition', 'традиции')|E] караванной торговли: «$tradition_saharan_traders_name$» и «$tradition_silk_road_traders_name$» несовместимы"
 only_one_seaborne_trade_tradition: "Нельзя иметь большое одной [Concept('tradition', 'традиции')|E] морской торговли: «$tradition_maritime_mercantilism_name$» и «$tradition_monsoon_traders_name$» несовместимы"
