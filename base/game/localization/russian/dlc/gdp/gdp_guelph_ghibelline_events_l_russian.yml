l_russian:
 guelphs_ghibellines_prefix: "Гвельфы и гибеллины:"
 gdp_guelph_ghibelline.0500.t: "Гвельфы и гибеллины"
 gdp_guelph_ghibelline.0500.intro.all: "Косые взгляды, презрительное фырканье — конфликт, который развязали [pope_scope.GetTitledFirstName] и [ghibelline_leader.GetTitledFirstName], посеял раздор в некогда сплочённых общинах северной Италии.\n\nТе, кого привлекли на свою сторону [ghibelline_leader.GetTitleAsNameNoTooltip|l] и гибеллины, пообещавшие защиту империи, недовольно смотрят на сторонников независимости и папских гвельфов."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "Косые взгляды, презрительное фырканье — абсурдный конфликт, который развязали [ghibelline_leader.GetTitleAsName]-[Select_CString(ghibelline_leader.IsFemale, 'отступница', 'отступник' )] и мои религиозные слуги, посеял раздор в некогда сплочённых общинах северной Италии.\n\nСторонники имперских гибеллинов, мечтающих о безопасности и защите, столкнулись с моими богобоязненными гвельфами, желающими лишь сохранить независимость от тирана.\n\nВместе мы добьёмся того, что [ghibelline_leader.GetTitleAsNameNoTooltip|l] прислушается к голосу разума. В этой битве победит [ROOT.Char.Custom('GetHighestSkillAdjective')]."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "Косые взгляды, презрительное фырканье — абсурдный конфликт между папскими глупцами и мной уже посеял раздор в некогда сплочённых общинах северной Италии.\n\nТе, кого привлекли на свою сторону #EMP мои#! гибеллины, обещая защиту и безопасность, столкнулись с теми, кто выбрал риск и хрупкую независимость, поддержав наивных папских гвельфов.\n\nЯ [ghibelline_leader.GetTitleAsNameNoTooltip|l], и мне уже надоели эти назойливые церковные гвельфы. Они слишком долго подрывают мою власть. Пора указать им на их место…"
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nХвала небесам, [Select_CString(guelph_leader.IsFemale, 'наша предводительница', 'наш предводитель' )], [guelph_leader.GetFirstNameNoTooltip], [Select_CString(guelph_leader.IsFemale, 'согласилась', 'согласился' )] говорить от нашего имени и возглавить борьбу против угнетателей. А я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )] сыграть свою роль."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'убеждена', 'убеждён' )], что [ghibelline_leader.GetTitleAsNameNoTooltip|l] — наша единственная надежда на выживание. Только [Select_CString(ghibelline_leader.IsFemale, 'она способна', 'он способен' )] защитить наш народ и обеспечить безопасность наших владений от тех, кто желает нам зла. Я же обеспечу [Select_CString(ghibelline_leader.IsFemale, 'ей', 'ему' )] полную поддержку своих гибеллинов."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nЯ ещё не [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )], кого поддержать. Нужно тщательно взвесить все за и против — и действовать сугубо в интересах дома [ROOT.Char.GetHouse.GetBaseName]."
 gdp_guelph_ghibelline.0500.a: "Вперёд!"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "Мне стало известно, что [ROOT.Char.Custom('GetGuelphsGhibellines')|l] усилили свои позиции в разгорающемся конфликте — и всё благодаря вашим непрестанным усилиям.\n\nЗнайте, что я глубоко вам [Select_CString(gg_leader.IsFemale, 'признательна', 'признателен' )]."
 gdp_guelph_ghibelline.1000.a: "Благодарю за доверие."
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "Ваши жалкие [actor.Custom('GetGuelphsGhibellines')|l] могут не рассчитывать на мою поддержку."
 gdp_guelph_ghibelline.5000.a: "Как неразумно…"
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U] [Select_CString(actor.IsLocalPlayer, 'сможете', 'сможет')] повторно предложить [Select_CString(recipient.IsLocalPlayer, 'вам', Concatenate('персонажу ', recipient.GetShortUIName))] присоединиться к партии «[actor.Custom('GetGuelphsGhibellines')]» только через несколько лет"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$: Вормсский конкордат"
 gdp_guelph_ghibelline.6500.desc: "Конфликт явно затянулся, и ему не видно конца. После долгих обсуждений писцы представили мне следующее письменное соглашение:\n\n[ghibelline_leader.GetTitleAsNamePossessive|U] откажется от права назначения на церковные должности, но сможет присутствовать при проведении выборов и вмешиваться в случае возникновения споров.\n\nПотирая подбородок, я размышляю, как это повлияет на наше будущее…"
 gdp_guelph_ghibelline.6500.a: "Это удачный компромисс."
 gdp_guelph_ghibelline.6500.b: "Власть папства #EMP превыше всего#!!"
 concordat_of_worms_fulfilled.t: "Вормсский конкордат заключён"
 concordat_of_worms_abandoned.t: "Вормсский конкордат отвергнут"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName|U] [Select_CString(GetTitleByKey('e_hre').GetHolder.IsLocalPlayer, 'решаете', 'решит' )], принять ли соглашение"
 cow_phase_moves_to_agitation.tt: "Ситуация «[GetSituation('guelph_ghibelline').GetName]» завершает этап прелюдии и переходит в фазу «[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]»"
 cow_phase_moves_to_repose.tt: "Ситуация «[GetSituation('guelph_ghibelline').GetName]» завершает этап прелюдии и переходит в фазу «[GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]»"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "Предлагаю на время отложить наши разногласия и договориться о том, как будут проходить назначения на церковные должности.\n\nВ свою очередь, [ROOT.Char.GetTitleAsNameNoTooltip|l] получит право присутствовать на выборах и разрешать спорные случаи."
 gdp_guelph_ghibelline.6505.a: "Полагаю, меня устроит и это…"
 gdp_guelph_ghibelline.6505.b: "Это неприемлемо!"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$: $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "Повсюду говорят, что [hre_kaiser.GetTitleAsName|l] стремится централизовать державу и укрепить свою власть над Северной Италией. Тем временем мои гонцы возвращаются с ответами…"
 gdp_guelph_ghibelline.7000.desc.all: "\n\nВсе, кому я [Select_CString(ROOT.Char.IsFemale, 'писала', 'писал' )], приняли моё приглашение вступить в Ломбардскую лигу.\n\nТеперь мы достаточно сильны, и [hre_kaiser.GetTitleAsName|l] едва ли рискнёт покуситься на наши свободы!"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nМногие из тех, кому я [Select_CString(ROOT.Char.IsFemale, 'писала', 'писал' )], приняли моё приглашение вступить в Ломбардскую лигу.\n\nЕсли [hre_kaiser.GetTitleAsName|l] нападёт, возможно, у нас хватит сил, чтобы выстоять. Будем надеяться, что наши друзья в Церкви не оставят нас в беде…"
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nЛишь немногие выразили согласие присоединиться к Ломбардской лиге, что, безусловно, вызывает беспокойство.\n\n#EMP Но не будем падать духом! C Божьей помощью мы сумеем отстоять новообретённую независимость!#!"
 gdp_guelph_ghibelline.7000.a: "Настало время перемен!"
 gdp_guelph_ghibelline.7000.b: "Наш час пробил!"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$: вступление в Ломбардскую лигу?"
 gdp_guelph_ghibelline.7005.desc: "Кажется, [league_creator.GetTitledFirstName] — всё-таки человек чести.\n\nДо меня дошли новости, что [Select_CString(league_creator, 'она создала', 'он создал' )] союз «[lombard_league_conf.GetName]», и теперь [hre_kaiser.GetTitleAsName|l], возможно, столкнётся с противостоянием.\n\nТакая инициатива вполне разумна, если её цель — стряхнуть оковы империи."
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "Не будем спешить…"
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$: $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "Посланники сообщают, что [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))|l] #EMP [league_creator.GetTitledFirstName]#! выражает недовольство положением дел в городе [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier] и совершает большую подлость, успешно убеждая слабоумных овечек примкнуть к [Select_CString(league_creator, 'ней', 'нему' )]!\n\nОткуда вообще взялась эта #EMP Ломбардская лига#!?!"
 gdp_guelph_ghibelline.7010.a: "Мы не станем терпеть такую наглость!"
 gdp_guelph_ghibelline.7010.b: "У нас других дел хватает."
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName] [Select_CString(league_creator, 'создала', 'создал' )] союз «[league_creator.GetConfederation.GetName]» #weak (текущее число участников: #V [lombard_league_conf.GetMemberCount]#!)#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "Боюсь, Ломбардской лиге придётся обойтись без вашей #EMP великодушной#! помощи."
 gdp_guelph_ghibelline.7015.a: "Хм-м-м…"
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$: достижение компромисса"
 gdp_guelph_ghibelline.8500.desc: "В толпе пробегают шепотки, когда [guelph_leader.GetName] и [ghibelline_leader.GetName], представители гвельфов и гибеллинов, встречаются для подписания соглашения.\n\nКто-то откровенно радуется, кто-то встревожен тем, что приходится поступиться своими взглядами.\n\nПолитики вполголоса беседуют, пока люди расходятся, чтобы, как заведено, подготовиться к ужину."
 gdp_guelph_ghibelline.8500.a: "Наконец-то всё закончилось!"
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "Вижу, вы до сих пор не осознали своих ошибок. Как мы можем пойти на серьёзные уступки, когда вы, [actor.Custom('GetGuelphsGhibellines')], столь глубоко заблуждаетесь?\n\nСитуация была бы смешной, если бы не была такой страшной."
 gdp_guelph_ghibelline.8510.a: "Какое нахальство!"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U] [Select_CString(recipient, 'отклонила', 'отклонил' )] наше предложение разрешить [Concept('situation', 'ситуацию')|E] «[GetSituation('guelph_ghibelline').GetName]»"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "Нельзя отрицать, что этот договор стал достижением дипломатии.\n\n[guelph_leader.GetName] и [ghibelline_leader.GetName] пошли на взаимные уступки и по ряду вопросов добились выгодных для себя решений, однако народное мнение от этого сильно пострадало.\n\nКак долго протянут эти договорённости? Сможем ли мы отбросить прошлое и устремиться к светлому будущему? Покажет только время."
 gdp_guelph_ghibelline.8520.a: "Наверное, это к лучшему."
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$: [ROOT.Char.Custom('GetGuelphGhibelline')|l] побеждают"
 gdp_guelph_ghibelline.9000.desc.guelph: "Борьба окончена. Мы отстояли самое святое: высшую власть, которая наделяет папу правом оберегать и избирать наших духовных пастырей.\n\nК тому же теперь [GetTitleByKey('e_hre').GetName|l] обладает ограниченным влиянием и больше нам не угрожает.\n\nГибеллины, эти #EMP заблудшие овечки#!, даже понять не успели, что произошло."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "Мы наконец отвоевали своё право управлять империей в соответствии с волей [ROOT.Char.GetFaith.HighGodNamePossessive] — решительно и хладнокровно.\n\nК счастью, [GetTitleByKey('e_hre').GetName|l] не окажется в руках этих нерасторопных святош.\n\nПусть гвельфы, так защищающие папу, заботятся о наших душах, а мы займёмся более #EMP важными#! делами."
 gdp_guelph_ghibelline.9000.a: "Да начнётся праздник!"
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$: [ROOT.Char.Custom('GetGuelphGhibelline')|l] проигрывают"
 gdp_guelph_ghibelline.9010.desc.win: "[ROOT.Char.Custom('GuelphGhibellineGetOpposite')] вяло нам противостоят, однако мы снова и снова заручаемся народной поддержкой.\n\nНаш славный лидер [victorious_leader.GetTitledFirstName] и независимые законодатели провозгласили, что [ROOT.Char.Custom('GetGuelphsGhibellines')|l] правы, тем самым раз и навсегда разрешив затянувшуюся #EMP ситуацию#!.\n\nНаконец-то разум восторжествовал в этой части мира!"
 gdp_guelph_ghibelline.9010.desc.lose: "Наша поддержка слабнет, и этого нельзя отрицать.\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')] не обладают ни достаточным влиянием, ни достаточной властью, а вот недалёкие правители-[ROOT.Char.Custom('GuelphGhibellineGetOpposite')|l] сумели заручиться поддержкой #EMP независимых#! законодателей.\n\nЧто ж, [ROOT.Char.Custom('GetGuelphsGhibellines')|l] выйдут из этой борьбы и сосредоточатся на более достижимых целях."
 gdp_guelph_ghibelline.9010.a.win: "Насладимся моментом!"
 gdp_guelph_ghibelline.9010.a.lose: "Вот же #EMP гады#!!"
