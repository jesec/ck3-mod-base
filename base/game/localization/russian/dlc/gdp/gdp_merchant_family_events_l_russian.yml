l_russian:
 gdp_merchant_family.0001.t: "[Select_CString(house_member.IsFemale, 'Сбежавшая невеста', 'Сбежавший жених' )]"
 gdp_merchant_family.0001.desc: "Я слышу в темноте какой-то шорох. Придя на звук, я замечаю, как [Select_CString(house_member.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', house_member)|l] [house_member.GetTitledFirstName] роется в сундуках компании, где хранятся деньги. Рядом с [Select_CString(house_member.IsFemale, 'ней', 'ним' )] стоит [Select_CString(wedding_interest.IsFemale, 'какая-то женщина', 'какой-то мужчина' )] и шёпотом поторапливает [Select_CString(house_member.IsFemale, 'её', 'его' )].\n\n«Что здесь творится?» — спрашиваю я. Пара испуганно оборачивается, держась за руки. Приглядевшись получше, я наконец-то узнаю [Select_CString(wedding_interest.IsFemale, 'незнакомку', 'незнакомца' )]: это никто [Select_CString(wedding_interest.IsFemale, 'иная', 'иной' )], как [wedding_interest.GetTitledFirstName], [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)|l] человека по имени [wedding_interest_house_head.GetTitledFirstName].\n\n«Мы больше не можем здесь оставаться. Вражда между нашими семьями мешает нам быть вместе, поэтому мы решили сбежать», — говорит [house_member.GetTitledFirstNameNoTooltip],"
 gdp_merchant_family.0001.desc.stubborn_outro: "гордо подняв голову и крепко сжав руку [Select_CString(wedding_interest.IsFemale, 'своей возлюбленной', 'своего возлюбленного' )]."
 gdp_merchant_family.0001.desc.fallback_outro: "нехотя отпуская руку [Select_CString(wedding_interest.IsFemale, 'своей возлюбленной', 'своего возлюбленного' )] и подходя ко мне поближе. [Select_CString(house_member.IsFemale, 'Она', 'Он' )] молчит, но в [Select_CString(house_member.IsFemale, 'её', 'его' )] взгляде просматривается отчаянная просьба о помощи."
 gdp_merchant_family.0001.a: "«Я благословляю вас. Берите золото и уходите»."
 gdp_merchant_family.0001.b: "«Как мне уговорить вас двоих остаться?»"
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName] присоединяется к вам"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName] не [Select_CString(wedding_interest.IsFemale, 'впечатлена', 'впечатлён')]"
 gdp_merchant_family.0001.c: "«#EMP Никуда#! вы не пойдёте!»"
 gdp_merchant_family.0002.t: "Кровь не водица"
 gdp_merchant_family.0002.desc_intro: "Я просматриваю последние отчёты о доходах, как вдруг ко мне в кабинет врывается [blood.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n«[Select_CString(water.IsFemale, 'Эта', 'Этот')] [water.Custom('InsultNoun')|l] ведёт себя возмутительно! — рявкает [Select_CString(blood.IsFemale, 'она', 'он')]. — [Select_CString(water.IsFemale, 'Она', 'Он')] вечно рискует и преступает границы, а мы из-за этого выглядим как #L [blood.Custom('InsultAdjective')|l]ые#! олухи."
 gdp_merchant_family.0002.desc_adopted: "Что подумают люди о доме [ROOT.Char.GetHouse.GetName]?»"
 gdp_merchant_family.0002.desc_associate: "Такое поведение непозволительно для сотрудника нашей компании»."
 gdp_merchant_family.0002.desc_outro: "\n\nКогда поток жалоб иссякает, я снова обращаю свой взор на отчёты. Что бы там ни говорили, а [water.GetFirstNameNoTooltip] приносит нам прибыль, и с этим не поспоришь."
 gdp_merchant_family.0002.a: "Пусть [water.GetFirstNameNoTooltip] знает своё место!"
 gdp_merchant_family.0002.a.unity_gain.desc: "вы поставили интересы семьи выше выгоды компании"
 gdp_merchant_family.0002.b: "«Сначала достигни [Select_CString(water.IsFemale, 'её', 'его')] высот, тогда и поговорим»."
 gdp_merchant_family.0002.b.unity_loss.desc: "вы поставили выгоду компании выше интересов семьи"
 gdp_merchant_family.0002.c: "«Мне некогда заниматься вашими склоками…»"
 gdp_merchant_family.0003.t: "Дело чести"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U] подходит ко мне в раздражении.\n\n«Вы не поверите, что мне только что сказали! — начинает [Select_CString(offended.IsFemale, 'она', 'он')]. — [offender.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(offender.IsFemale, 'посчитала', 'посчитал')], что это будет забавно: унизить меня и наш дом заодно».\n\nОскорбление не самое обидное, однако сделано оно намеренно."
 gdp_merchant_family.0003.a: "[ROOT.Char.GetFaith.HighGodName] всё видит! Дом [offender.GetHouse.GetNameNoTooltip] ответит за это!"
 gdp_merchant_family.0003.a.unity_gain.desc: "Вы поддержали оскорблённую семью"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U] публично [Select_CString(target_char.IsFemale, 'оскорбила', 'оскорбил')] дом, главой которого является [target_char.GetShortUIName]"
 gdp_merchant_family.0003.b: "Хорошо, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|l], что это лишь лёгкий подкол…"
 gdp_merchant_family.0003.b.unity_loss.desc: "Вы отказались отвечать на оскорбление"
 gdp_merchant_family.0003.c: "Разберитесь с этим самостоятельно. У меня много дел."
 gdp_merchant_family.0003.c.unity_loss.desc: "Вы проигнорировали оскорбление вашего дома"
 gdp_merchant_family.0004.t: "Подозрительное предложение"
 gdp_merchant_family.0004.desc: "Совершая неспешный променад, я вдруг слышу, как меня окликают через двор: «[ROOT.Char.Custom('FormOfAddressForLiege')], подождите!» Внезапно передо мной возникает [offer_2.GetFullName].\n\nОн говорит елейным голосом: «[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U] хочет сделать одно предложение. Я и [offer.Custom2('YourCharacterIntroduction', ROOT.Char)] вступим в брачный союз и укрепим связь между нашими домами». Я невольно задерживаю дыхание, обдумывая услышанное.\n\n«Итак, что на это скажет [ROOT.Char.Custom('FormOfAddressForLiege')]?»"
 gdp_merchant_family.0004.a: "«[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))] сочтёт это за честь»."
 gdp_merchant_family.0004.b: "«А какая мне с этого выгода?»"
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U] и [target_char.GetShortUIName] заключили взаимовыгодное соглашение"
 gdp_merchant_family.0004.c: "«Мне придётся ответить отказом, но вы можете остаться»."
 gdp_merchant_family.0005.t: "[ROOT.Char.GetHouse.GetNameNoTooltip] и позорное пятно"
 gdp_merchant_family.0005.desc: "Мне сообщили, что [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(wayward.IsFemale, 'потеряла', 'потерял')] важную посылку, за которую самолично [Select_CString(wayward.IsFemale, 'отвечала', 'отвечал')]. Я зову [Select_CString(wayward.IsFemale, 'её', 'его')] в свои покои, чтобы расспросить о случившемся.\n\n«Прошу прощения, [wayward.Custom2('RelationToMe', ROOT.Char)], но моей вины тут нет. Меня пытаются оклеветать мои же родственники!»"
 gdp_merchant_family.0005.a: "«Да чтоб вас, [Select_CString(wayward.IsFemale, 'моя', 'мой')] [wayward.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]!»"
 gdp_merchant_family.0005.a.unity_loss.desc: "Общество осудило члена семьи"
 gdp_merchant_family.0005.b: "«Мы не дадим друг друга в обиду»."
 gdp_merchant_family.0005.b.unity_gain.desc: "Вы сплотились перед лицом трудностей"
 gdp_merchant_family.0005.c: "«Разберитесь с этим»."
 gdp_merchant_family.0010.t: "Последняя капля"
 gdp_merchant_family.0010.desc: "#EMP БАХ!#! Ящики с грохотом валятся на землю, и [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l] изумлённо замирает. Я оборачиваюсь и вижу, что нанятые мной [attacker.GetTitledFirstName] и [defender.GetTitledFirstName] уже собрались драться.\n\n«Я работаю на эту семью в поте лица! — рычит [attacker.GetTitledFirstNameNoTooltip] и [attacker.Custom('quirk_neg_present')] с яростным блеском в глазах. — А [Select_CString(defender.IsFemale, 'эта лентяйка', 'этот лентяй')] бессовестно прохлаждается! Да как [Select_CString(defender.IsFemale, 'её', 'его')] [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] держит? Если вы меня не остановите, то я за себя не отвечаю!»"
 gdp_merchant_family.0010.a: "Моим помощникам не пристало так себя вести."
 gdp_merchant_family.0010.a.tt.success: "Вам удаётся уладить конфликт"
 gdp_merchant_family.0010.a.tt.failure: "Вам не удаётся уладить конфликт"
 gdp_merchant_family.0010.b: "Давайте, покажите, как мы решаем вопросы!"
 gdp_merchant_family.0010.c: "Если [defender.GetTitledFirstNameNoTooltip] пострадает, будут последствия!"
 gdp_merchant_family.0010.d: "Да делайте что хотите!"
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUIName] и [defender.GetShortUIName] решат посоревноваться в [prowess_i][Concept('prowess', 'доблести')|E] и начнут [martial_i][Concept('martial', 'бой')|E] друг с другом! Кто-то из них пострадает.#!"
 merchant_unity_fight_stopped: "Вы пресекли вражду между сотрудниками компании"
 merchant_unity_fight_promoted: "Вы подстегнули вражду между сотрудниками компании"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] побеждает"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[defender.GetFirstName] получает ранение от [Select_CString(attacker.IsFemale, 'ее', 'его' )] руки"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip] побеждает"
 gdp_merchant_family.0010.tt.defender_won.tt: "Защищаясь, [Select_CString(defender.IsFemale, 'она', 'он' )] ранит [Select_CString(attacker.IsFemale, 'соперницу', 'соперника' )]"
 gdp_merchant_family.0015.t: "Деловой осведомитель"
 gdp_merchant_family.0015.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], как всегда, полны народу. Среди мириадов знакомых лиц я внезапно замечаю [Select_CString(tip_giver.IsFemale, 'некую женщину', 'некоего мужчину' )], [Select_CString(tip_giver.IsFemale, 'которая', 'который' )] смотрит на меня с хитрой улыбкой. [Select_CString(tip_giver.IsFemale, 'Она', 'Он' )] отводит меня в сторону и вручает учётную книгу.\n\n«[ROOT.Char.GetTitledFirstName|U]! Вас-то я и [Select_CString(tip_giver.IsFemale, 'искала', 'искал' )]. Я бы [Select_CString(tip_giver.IsFemale, 'хотела', 'хотел' )] поделиться с вами ценными сведениями, которые мне недавно удалось раздобыть. Пусть это станет залогом нашего дальнейшего сотрудничества»."
 gdp_merchant_family.0015.a: "«Вместе мы можем сколотить целое состояние!»"
 gdp_merchant_family.0015.b: "«Позволь мне купить у тебя эту книгу»."
 gdp_merchant_family.0015.b.artifact: "Учётная книга осведомителя"
 gdp_merchant_family.0015.b.artifact.desc: "Тщательно оберегаемая книга, где записаны секретные сведения о доходах, выгодных сделках и деловых контактах"
 gdp_merchant_family.0015.c: "«#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#! может извлечь из этого большую выгоду…»"
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U] и [target_char.GetShortUIName] обменялись ценными сведениями"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsLocalPlayer, 'использовали', Select_CString(char.IsFemale, 'использовала', 'использовал' ))] сведения, которые [Select_CString(target_char.IsFemale, 'предоставила', 'предоставил' )] [target_char.GetShortUIName], против [Select_CString(target_char.IsFemale, 'неё самой', 'него самого' )]"
 gdp_merchant_family.0020.t: "Обмен талантами"
 gdp_merchant_family.0020.desc: "Мой деловой партнёр [house_friend.GetFirstName] опаздывает на нашу очередную встречу. Спустя какое-то время [Select_CString(house_friend.IsFemale, 'она', 'он' )] наконец объявляется, но в этот раз его сопровождает [Select_CString(nepo_hire.IsFemale, 'какая-то женщина', 'какой-то мужчина' )].\n\n«[ROOT.Char.Custom('MistressMaster')|U], это [Select_CString(nepo_hire.IsFemale, 'моя', 'мой' )] [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))|l] [nepo_hire.GetFirstName]."
 gdp_merchant_family.0020.desc.diplomacy: "[Select_CString(nepo_hire.IsFemale, 'Она', 'Он' )] искусный дипломат,"
 gdp_merchant_family.0020.desc.martial: "[Select_CString(nepo_hire.IsFemale, 'Она', 'Он' )] отличный стратег,"
 gdp_merchant_family.0020.desc.stewardship: "[Select_CString(nepo_hire.IsFemale, 'Она', 'Он' )] опытный счетовод,"
 gdp_merchant_family.0020.desc.intrigue: "[Select_CString(nepo_hire.IsFemale, 'Она', 'Он' )] весьма находчивый человек,"
 gdp_merchant_family.0020.desc.learning: "[Select_CString(nepo_hire.IsFemale, 'Она', 'Он' )] очень образованный человек,"
 gdp_merchant_family.0020.desc.outro: "и я [Select_CString(house_friend.IsFemale, 'уверена', 'уверен' )], что под вашим руководством [Select_CString(nepo_hire.IsFemale, 'её', 'его' )] ждёт большое будущее в нашей компании»."
 gdp_merchant_family.0020.a: "«Мы будем рады видеть [Select_CString(nepo_hire.IsFemale, 'её', 'его' )] в наших рядах»."
 gdp_merchant_family.0020.a.unity_loss.desc: "дарование должности в обмен на услугу"
 gdp_merchant_family.0020.b: "«Боюсь, у нас нет места для ещё одного сотрудника»."
 gdp_merchant_family.0020.b.unity_gain.desc: "отказ нанимать постороннего человека"
 gdp_merchant_family.0020.c: "«Твоё предложение для меня оскорбительно»."
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsLocalPlayer, 'приняли', Select_CString(char.IsFemale, 'приняла', 'принял' ))] родственника [Select_CString(target_char.IsLocalPlayer, '', 'персонажа ' )][target_char.GetShortUINamePossessiveOrMy][Select_CString(target_char.IsLocalPlayer, 'его персонажа', '' )] в свою компанию"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsLocalPlayer, 'отказались', Select_CString(char.IsFemale, 'отказалась', 'отказался' ))] принимать родственника [Select_CString(target_char.IsLocalPlayer, '', 'персонажа ' )][target_char.GetUINamePossessiveOrMy][Select_CString(target_char.IsLocalPlayer, 'его персонажа', '' )] в свою компанию"
 gdp_merchant_family.0025.t: "Ничего личного"
 gdp_merchant_family.0025.desc: "Я подписываю последнее торговое соглашение из огромной кипы документов, и мои запястья уже изнывают от боли. Но как только я собираюсь закончить работу и пойти спать, ко мне подходит [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)]. Заметно нервничая, [Select_CString(leaving_associate.IsFemale, 'он', 'она' )] дрожащими руками поднимает перед собой небольшой пергамент и зачитывает его содержимое.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], прошу меня простить, но [rival_poacher.GetPrimaryTitle.GetName] [Select_CString(rival_poacher.IsFemale, 'сделала', 'сделал' )] мне предложение, от которого невозможно было отказаться. Это не ваша вина, просто условия оказались крайне выгодными»."
 gdp_merchant_family.0025.a: "«Считай, что я [Select_CString(ROOT.Char.IsFemale, 'дала', 'дал' )] тебе своё одобрение»."
 gdp_merchant_family.0025.b: "«Твоё место здесь, с нами»."
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U] остаётся в [Concept('company', 'компании')|E]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip] решает остаться"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip] уходит, несмотря на ваши уговоры"
 gdp_merchant_family.0025.c: "«Не забывай, что ты у меня в долгу»."
 gdp_merchant_family.0025.d: "«Уходи, мне всё равно»."
 gdp_merchant_family.0025.d.rival: "«[rival_poacher.GetTitledFirstNameNoTooltip] проклянёт тот день, когда [Select_CString(rival_poacher.IsFemale, 'она перешла', 'он перешёл' )] мне дорогу!»"
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'переманили', Select_CString(TARGET_CHARACTER.IsFemale, 'переманила', 'переманил' ))] [Concept('associate', 'помощника')|E] у [Select_CString(CHARACTER.IsLocalPlayer, '', 'персонажа ' )][CHARACTER.GetUINamePossessiveOrMy][Select_CString(CHARACTER.IsLocalPlayer, 'его персонажа', '' )]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U] добровольно [Select_CString(char.IsLocalPlayer, 'позволили', Select_CString(char.IsFemale, 'позволила', 'позволил' ))] своему [Concept('associate', 'помощнику')|E] перейти в компанию [Select_CString(target_char.IsLocalPlayer, '', 'персонажа ' )][target_char.GetUINamePossessiveOrMy][Select_CString(target_char.IsLocalPlayer, 'его персонажа', '' )]"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U] [Select_CString(target_char.IsLocalPlayer, 'переманили', Select_CString(target_char.IsFemale, 'переманила', 'переманил' ))] [Concept('associate', 'помощника')|E] у компании [char.GetHouse.GetName]"
 gdp_merchant_family.0030.t: "Делу час, потехе время"
 gdp_merchant_family.0030.desc: "Двое моих помощников, [house_member.GetTitledFirstName] и [associate.GetTitledFirstName], возвращаются в штаб-квартиру компании после #EMP крайне затяжного#! обеда. С собой они тащат большой кувшин, в котором звонко плещется [ROOT.Char.Custom('RegionalAlcoholicDrink')|l].\n\n«…А я ему говорю, что этому коту место в свинарнике!» — заканчивает свою историю [house_member.GetTitledFirstNameNoTooltip], отчего [associate.GetTitledFirstNameNoTooltip] разражается раскатистым хохотом.\n\nЕсли я закрою глаза на этот кутёж, то сегодня от них точно не будет никакой пользы."
 gdp_merchant_family.0030.a: "«У меня для вас есть брага получше»."
 gdp_merchant_family.0030.a.flavor: "Всё лучшее для сотрудников"
 gdp_merchant_family.0030.b: "«А ну за работу, лентяи!»"
 gdp_merchant_family.0030.b.flavor: "В компании [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] нет места тунеядцам"
 gdp_merchant_family.0030.c: "Посмотрим, к чему приведёт эта дружба."
 merchant_unity_breaks_encouraged: "приемлет только лучшие напитки, что есть на рынке"
 merchant_unity_breaks_discouraged: "неодобрение перерывов на работе"
 gdp_merchant_family.9000.t: "[Select_CString(ROOT.Char.IsFemale, 'Молодая', 'Молодой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "Я больше не ребёнок — теперь я достаточно [Select_CString(ROOT.Char.IsFemale, 'взрослая', 'взрослый' )], чтобы править как [ROOT.Char.GetTitleAsNameNoTooltip|l], и [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] по праву принадлежит мне. Прежде этот пост [Select_CString(predecessor.IsFemale, 'занимала моя', 'занимал мой')] [ROOT.Char.Custom2('RelationToMeShort', predecessor)] [predecessor.GetFirstName], и мне будет очень непросто [Select_CString(predecessor.IsFemale, 'её', 'его')] заменить.\n\nМои помощники рассчитывают, что я возглавлю семейное дело и отыщу новые торговые пути и выгодные возможности. При этом мне постоянно напоминают, что не стоит пренебрегать их мудростью и опытом.…"
 gdp_merchant_family.9000.a: "[educator.GetTitledFirstNameNoTooltip] всегда поможет мне советом."
 gdp_merchant_family.9000.b: "С чего бы начать…"
 gdp_merchant_family.9000.route_hint_tt: "Теперь вы можете создавать и редактировать [Concept('distribution_routes', 'маршруты распространения')|E]"
 gdp_merchant_family.9010.t: "Осиротевшая компания"
 gdp_merchant_family.9010.desc: "[Select_CString(previous_holder.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', previous_holder)] [previous_holder.GetFirstName] нас [Select_CString(previous_holder.IsFemale, 'покинула', 'покинул')]. Будучи [Select_CString(previous_holder.IsFemale, 'владелицей', 'владельцем')] компании, [previous_holder.GetSheHe] [Select_CString(previous_holder.IsFemale, 'пользовалась', 'пользовался')] огромным авторитетом и всеобщим уважением. Сотрудники опечалены и взволнованы, по коридорам больше не разносится смех, а в кабинетах стихли жаркие споры.\n\n"
 gdp_merchant_family.9010.interim_generated: "Управление компанией временно поручили [Select_CString(interim.IsFemale, 'женщине', 'мужчине')] по имени [interim.GetFirstName]."
 gdp_merchant_family.9010.interim_relation: "Управление компанией временно [Select_CString(interim.IsFemale, 'взяла', 'взял')] на себя [Select_CString(interim.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', interim)], [interim.GetFirstName]."
 gdp_merchant_family.9010.interim: "Управление компанией временно [Select_CString(interim.IsFemale, 'взяла', 'взял')] на себя [interim.GetFirstName], [Select_CString(interim.IsFemale, 'которой', 'которому')] [Select_CString(previous_holder.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', previous_holder)] [Select_CString(previous_holder.IsFemale, 'доверяла как самой', 'доверял как самому')] себе."
 gdp_merchant_family.9010.close: "[interim.GetSheHe|U] будет вести наши дела, пока я не стану достаточно [Select_CString(ROOT.Char.IsFemale, 'взрослой', 'взрослым' )], чтобы возглавить семейный бизнес."
 gdp_merchant_family.9010.a: "Всё так быстро изменилось…"
 gdp_merchant_family.9110.t: "Секреты торговли"
 gdp_merchant_family.9110.desc: "[Select_CString(trader.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', trader)] [trader.GetFirstName] — [Select_CString(trader.IsFemale, 'одна', 'один')] из самых опытных купцов в компании, но [Select_CString(trader.IsFemale, 'её', 'его')] редко можно застать в конторе.\n\n[Select_CString(trader.IsFemale, 'Её', 'Его')] вотчина — [route.GetName|l]. Там [Select_CString(trader.IsFemale, 'она', 'он')] неустанно трудится над тем, чтобы каждый тюк и каждый бочонок попал от продавца к покупателю, а в казну компании сыпались [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')].\n\n«Хороший купец должен присутствовать во многих местах одновременно, — улыбается [Select_CString(trader.IsFemale, 'она', 'он')]. — Он знает все [ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGlossPlural')|l], помнит в лицо каждого торговца. Ему известно, какие заботы беспокоят всякий городок на пути и что на уме у каждого караванщика!»"
 gdp_merchant_family.9110.a: "Когда я возглавлю компанию, я хочу стать таким же купцом, как [trader.GetNameNoTooltip]."
 gdp_merchant_family.9110.b: "«Расскажи мне о караванах!»"
 gdp_merchant_family.9110.b.tt: "Достигнув совершеннолетия, вы получите #V +10#! к [Concept('trait_level_track_xp', 'опыту свойства')|E] #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9110.c: "«[good.Custom('GetTradeGood_RU_Nom')|U]! Я тоже хочу торговать этим товаром!»"
 gdp_merchant_family.9110.c.tt: "Когда вы достигнете совершеннолетия, [merchant.GetPrimaryTitle.GetDefinitiveName] получит #V +450#! к [Concept('trade_expertise', 'познаниям в торговле')|E] товарами категории «[category.GetNameWithIcon]»"
 gdp_merchant_family.9130.t: "Юношеские амбиции"
 gdp_merchant_family.9130.desc: "Я многое [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )], наблюдая за тем, как ведутся дела в нашей компании. Мои помощники стараются почаще вовлекать меня в свою работу, чтобы помочь мне набраться опыта."
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] торгует по всему свету, наши учётные книги полны названий, которые я даже и выговорить-то не могу. Должно быть, эти места находятся очень далеко от владения [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]…"
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] специализируется на редких товарах высшего качества и оказывает особое покровительство [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip|l]им мастерам."
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] не брезгует давать [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] в обмен на будущие услуги. Наши учётные книги заполнены именами видных [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip|l]их жителей — должников, азартных игроков и других бедолаг, нуждающихся в средствах."
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] является серьёзным игроком на [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip|l]ом рынке. Наш торговый дом не специализируется на чём-то конкретном, его интересы обширны и охватывают многие индустрии."
 gdp_merchant_family.9130.a: "Скорей бы встать во главе компании!"
 gdp_merchant_family.9130.a.caravaneer: "Мы пойдём туда, где не ступала нога человека."
 gdp_merchant_family.9130.a.artisan: "Само наше название — это знак качества."
 gdp_merchant_family.9130.a.creditor: "Наше дело — займы."
 gdp_merchant_family.9130.a.tt: "Достигнув совершеннолетия, вы получите #V +5#! к [Concept('trait_level_track_xp', 'опыту свойств')|E] #emp $trait_track_caravaneer$#!, #emp $trait_track_artisan$#! и #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9130.b: "Мир велик и полон потенциала."
 gdp_merchant_family.9130.b.tt: "Достигнув совершеннолетия, вы #P бесплатно#! получите [Concept('company_purpose', 'специфику компании')|E] «[GetLaw('company_purpose_caravaneer').GetName]», а также #V +20#! к [Concept('trait_level_track_xp', 'опыту свойства')|E] #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9130.c: "Милые безделушки способны принести огромные барыши."
 gdp_merchant_family.9130.c.tt: "Достигнув совершеннолетия, вы #P бесплатно#! получите [Concept('company_purpose', 'специфику компании')|E] «[GetLaw('company_purpose_artisan').GetName]», а также #V +20#! к [Concept('trait_level_track_xp', 'опыту свойства')|E] #emp $trait_track_artisan$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 gdp_merchant_family.9130.d: "Рычаги влияния — вот что даёт настоящую власть и настоящие деньги."
 gdp_merchant_family.9130.d.tt: "Достигнув совершеннолетия, вы #P бесплатно#! получите [Concept('company_purpose', 'специфику компании')|E] «[GetLaw('company_purpose_creditor').GetName]», а также #V +20#! к [Concept('trait_level_track_xp', 'опыту свойства')|E] #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!"
 company_purpose_child_blocker_tt: "Вы [Concept('child', 'ребенок')|E]"
 gdp_merchant_family.9140.t: "Основы торговли"
 gdp_merchant_family.9140.desc: "В тесных кабинетах владения [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly] я узнаю о торговых путях, на которых [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] зарабатывает свои богатства — или, по крайней мере, пытается. Сколько же товаров нужно запомнить, сколько городов и селений…\n\n[associate.GetFirstName] отвлекает меня от мечтаний, постучав по столу. «Эй, [ROOT.Char.Custom('GirlBoy')]! [Select_CString(ROOT.Char.IsFemale, 'Какая', 'Какой' )] из тебя будет [ROOT.Char.GetTitleAsNameNoTooltip|l], если ты не научишься нашему делу?»"
 gdp_merchant_family.9140.a: "«Расскажи мне о торговле такими товарами, как [category_1.Custom('GetTradeGoodCategory')|l]»."
 gdp_merchant_family.9140.a.tt: "Когда вы достигнете совершеннолетия, [merchant.GetPrimaryTitle.GetDefinitiveName] получит #V +450#! к [Concept('trade_expertise', 'познаниям в торговле')|E] товарами категории «[category_1.GetNameWithIcon]»"
 gdp_merchant_family.9140.b: "«Меня интересуют такие товары, как [category_2.Custom('GetTradeGoodCategory')|l]»."
 gdp_merchant_family.9140.b.tt: "Когда вы достигнете совершеннолетия, [merchant.GetPrimaryTitle.GetDefinitiveName] получит #V +450#! к [Concept('trade_expertise', 'познаниям в торговле')|E] товарами категории «[category_2.GetNameWithIcon]»"
 gdp_merchant_family.9140.c: "«[category_3.Custom('GetTradeGoodCategory')]… Расскажи мне о перевозке этих товаров»."
 gdp_merchant_family.9140.c.tt: "Когда вы достигнете совершеннолетия, [merchant.GetPrimaryTitle.GetDefinitiveName] получит #V +450#! к [Concept('trade_expertise', 'познаниям в торговле')|E] товарами категории «[category_3.GetNameWithIcon]»"
 gdp_merchant_family.9150.t: "Моя правая рука"
 gdp_merchant_family.9150.desc: "С приближением совершеннолетия за моё обучение [Select_CString(partner.IsFemale, 'взялась', 'взялся' )] [partner.GetFirstName] — давний партнёр нашей компании. Я сопровождаю [Select_CString(partner.IsFemale, 'её', 'его' )] на всех деловых встречах и переговорах, стараясь не пропускать ни слова.\n\nКак-то раз, закончив возиться с учётными книгами, [partner.GetFirstNameNoTooltip] оборачивается ко мне. «Похоже, из тебя будет толк, [Select_CString(ROOT.Char.IsFemale, 'молодая', 'молодой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l], — ухмыляется [partner.GetSheHe], бросая мне монету. — Торговля — дело непростое, но своим благополучием мы обязаны только собственному труду. Чего не может сказать о себе [Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'наша', 'наш' )] [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')][Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'ая', 'ий' )] [ROOT.Char.GetSuzerain.GetTitleAsName|l]»."
 gdp_merchant_family.9150.a: "«Я не подведу компанию. Можете на меня рассчитывать»."
 gdp_merchant_family.9150.b: "«Вы это более чем заслужили, [partner.GetFirstNameNoTooltip]»."
 gdp_merchant_family.9150.b.tt: "[partner.GetShortUIName] на #V 10#! лет получит #p +1#! к [Concept('aptitude', 'пригодности')|E] к должности «[GetCourtPositionType('partner_court_position').GetName()]»"
 gdp_merchant_family.9150.c: "«Но где бы мы были, если бы не [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l]?»"
 gdp_merchant_family.9150.c.tt: "Достигнув совершеннолетия, вы на #V 10#! лет получите [Concept('modifier', 'модификатор')|E] «[GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip]»"
 merchant_childhood_suzerain_modifier: "Радость для покровителя"
 merchant_childhood_suzerain_modifier_desc: "Этот персонаж понимает, насколько важно иметь хорошие отношения с сильными мира сего."
 merchant_childhood_desc: "Купеческое детство"
