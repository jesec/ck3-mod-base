l_russian:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: [patron.Custom('GetRoomPlural')|U], которыми владеет [patron.GetTitleAsNameNoTooltip]"
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName] — [patron.GetWomanMan|l] высокого положения, и за [Select_CString(patron.IsFemale, 'её', 'его')] внимание и попечительство состязается ни много ни мало [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] целиком: дворяне, священники, купцы, простолюдины…\n\nЧтобы наше общество не утратило [Select_CString(patron.IsFemale, 'её', 'его')] благосклонности, действовать нужно прямолинейно, но аккуратно: не давать хитроумным конкурентам обходить нас и не почивать на лаврах, а постоянно напоминать о себе.\n\nПусть [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] регулярно обсуждает наши дела."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: успех!"
 gdp_merchant_patron_contract.0002.desc: "На вечерних банкетах [patron.GetTitledFirstName|l] неизменно внимает каждому моему слову о далёких краях и незримых купеческих сетях, оплетающих мир.\n\nВозвращаться можно спокойно: я знаю наверняка, что [patron.GetFirstNameNoTooltip] считает нас ценными партнёрами и хорошими друзьями.\n\nДобрая слава, которой мы пользуемся во владении [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], растёт, и моё усиливающееся влияние вскоре раскроет мне новые двери."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: провал!"
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName] проявляет всё меньше интереса к моему обществу. Может быть, мне только кажется? Нет, никаких сомнений быть не может: придворные во владении [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] также стали относиться ко мне не столь обходительно, как раньше.\n\nНеужели мои рассказы показались [Select_CString(patron.IsFemale, 'ей', 'ему')] утомительными? Или, возможно, стоило воздержаться от замечаний по поводу превратностей торговли? Где находится та невидимая черта для #EMP noblesse#!, которую не стоит переступать?\n\nКак бы то ни было, сейчас остаётся только одно: вернуться в компанию, постараться смягчить убытки и встать на правильный путь."
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "Впечатлённый покровитель"
 gdp_impressed_patron_modifier_desc: "Покровитель впечатлён стремлением этого купца снискать доверие."
 gdp_impressed_patron_critical_modifier: "Впечатлённый покровитель"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "Пренебрежительный покровитель"
 gdp_dismissive_patron_modifier_desc: "Покровитель разочарован стремлением этого купца снискать доверие."
