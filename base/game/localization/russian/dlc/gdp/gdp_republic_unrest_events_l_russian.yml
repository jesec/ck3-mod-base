l_russian:
 gdp_republic_unrest.0001.t: "Восстание в столице: недовольства"
 gdp_republic_unrest.0001.desc: "Во дворе собралась кучка рабочих и цеховых. Один из них делает шаг вперёд и неуверенно начинает: «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин')], налоги доводят нас до нищеты…».\n\nВсё это я слышу уже не в первый раз. Они не первые и не последние, кто приходит ко мне с подобными жалобами."
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "Стража! Уведите этих… людей."
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "Я не стану вести переговоры с крестьянами."
 gdp_republic_unrest.0001.b.success: "Толпа расходится, не создавая лишних забот"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "Отказ приводит их в ярость"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "Пусть этим займётся совет."
 gdp_republic_unrest.0001.c.success: "На этот раз их удаётся убедить"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "Они распознают попытку оттянуть время"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "В этот раз я пойду на уступку."
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "Восстание в столице: холодный приём"
 gdp_republic_unrest.0011.desc: "Проходя по рынку, я слышу привычный гомон, но сегодня в нём чувствуется что-то неладное. Стоит мне приблизиться, как разговоры стихают. Торговцы замолкают, а прохожие торопятся отвести глаза.\n\nВпервые за много лет меня принимают здесь настолько холодно."
 gdp_republic_unrest.0011.a: "Наверняка мне просто кажется."
 gdp_republic_unrest.0011.b: "Послать кого-нибудь узнать последние слухи."
 gdp_republic_unrest.0011.b.success: "Мои соглядатаи выявляют причину"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "Слухи продолжают ходить"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "Остановлюсь и поговорю с народом."
 gdp_republic_unrest.0011.c.success: "Народ ценит этот жест"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "Никто не хочет разговаривать"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "Раздать всем еду и вино, сколько бы это ни стоило."
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "Восстание в столице: анонимное письмо"
 gdp_republic_unrest.0021.desc: "Войдя утром в кабинет, я обнаруживаю на столе неподписанное письмо без печати. На бумаге в самых ярких выражениях описывается, насколько ужасно теперь живёт [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], и как всё это будет продолжаться, покуда я [ROOT.Char.GetTitleAsName|l]."
 gdp_republic_unrest.0021.a: "Бросить его в камин."
 gdp_republic_unrest.0021.b: "Кто-то очень потрудился над этим посланием. Я хочу знать кто."
 gdp_republic_unrest.0021.b.success: "Автор опознан"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "Автор остаётся неизвестным"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "Я отвечу на это письмо перед общественностью."
 gdp_republic_unrest.0021.c.success: "Общественность благосклонно принимает ответ"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "Ответ вызывает ненависть общественности"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "Восстание в столице: народ выходит на площадь"
 gdp_republic_unrest.0101.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин')], горожане уже несколько дней отказываются уходить с рыночной площади, — докладывает мне один из стражников. — Похоже, их подстрекает некто по имени [demagogue.GetFirstName]».\n\nЗа что я вообще плачу этим бездельникам, если рынок простаивает уже несколько дней, и никто даже не удосужился мне сообщить?"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "Немедленно расчистить площадь!"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "Нужно опозорить этого демагога."
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName] [Select_CString(demagogue.IsFemale, 'опозорена', 'опозорен' )]"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "Мои старания безуспешны"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] поговорю с ними."
 gdp_republic_unrest.0101.c.success: "Толпа начинает расходиться"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "Надо мной громко насмехаются"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "Просто выполните их требования."
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "Восстание в столице: закрытый квартал"
 gdp_republic_unrest.0111.desc: "Мне стало известно, что [closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )] отныне существует особняком: местные жители отказываются признавать наших сборщиков налогов и не подчиняются приказам стражи."
 gdp_republic_unrest.0111.a: "Отправить сборщиков налогов в сопровождении стражников."
 gdp_republic_unrest.0111.b: "Попробуем их перекупить."
 gdp_republic_unrest.0111.b.success: "Они добиваются желаемого"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "Они отказываются идти на переговоры"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "Я отправлюсь туда и поговорю с ними лично."
 gdp_republic_unrest.0111.c.success: "Они прислушиваются"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "Они отказываются слушать"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "Рано или поздно им надоест. Наверное."
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "Восстание в столице: чучело"
 gdp_republic_unrest.0121.desc: "Я иду по улице и вдруг останавливаюсь как [Select_CString(ROOT.Char.IsFemale, 'вкопанная', 'вкопанный' )]: какой-то шутник выставил на всеобщее обозрение уродливое чучело в одежде, подозрительно похожей на мою. Толпа притихла: люди разглядывают чучело, а затем переводят взгляды на меня.\n\n«Как две капли воды!» — выкрикивает кто-то из задних рядов. Толпа взрывается улюлюканием и насмешками."
 gdp_republic_unrest.0121.a: "Немедленно убрать это недоразумение!"
 gdp_republic_unrest.0121.a.flavor: "Я позабочусь о том, чтобы об увиденном никто не говорил."
 gdp_republic_unrest.0121.b: "Выясните, кто за этим стоит."
 gdp_republic_unrest.0121.b.success: "С виновными разобрались"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "Найти виновных не удалось"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "Я затрону этот вопрос публично."
 gdp_republic_unrest.0121.c.success: "Народ прислушивается"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "Толпа насмехается и свистит"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "Это не стоит моего ответа."
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "Восстание в столице: город в огне"
 gdp_republic_unrest.0201.desc: "Я замечаю дым ещё до того, как ко мне подбегает стража. «[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин')], некто [demagogue.GetFirstName] [Select_CString(demagogue.IsFemale, 'убедила', 'убедил' )] народ поджечь один из кварталов. Знали бы вы, как у [Select_CString(demagogue.IsFemale, 'неё', 'него' )] подвешен язык!».\n\nЧто творится с моим городом?"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "Поднять гарнизон. Пусть он наведёт порядок."
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "Скорее, коня мне!"
 gdp_republic_unrest.0201.b.success: "Мятежники разбегаются"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "Мне приходится бежать во дворец"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "Я встречусь с ними на площади."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "Толпа обращает гнев против меня"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "Заплатите им сколько потребуется — хоть всю казну."
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "Восстание в столице: забастовка"
 gdp_republic_unrest.0211.desc: "Стоит мне выйти на рынок, как сразу становится ясно: торговля встала. Никто не зазывает покупателей, прилавки пустуют, в мастерских не слышно стука инструментов.\n\nПохоже, цехи сговорились между собой, и все работники дружно поддержали забастовку."
 gdp_republic_unrest.0211.a: "Приведите цеховых мастеров — попробуем договориться."
 gdp_republic_unrest.0211.a.success: "Согласие достигнуто"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "Они отказываются приходить"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "В этот раз мы им заплатим."
 gdp_republic_unrest.0211.b.success: "Удалось договориться о цене"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "Они выступают против компромисса"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "Заставьте их вернуться к работе. Немедленно!"
 gdp_republic_unrest.0211.d: "Выполните их требования."
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "Восстание в столице: рукопись"
 gdp_republic_unrest.0221.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин')], взгляните, что они начали раздавать народу! — с этими словами один из стражников протягивает мне рукопись. — Эти листки лежат повсюду».\n\nАвтор этих строк определённо не поскупился на нелестные слова в мой адрес и обвинения меня во всевозможных грехах."
 gdp_republic_unrest.0221.a: "Найдите и покарайте того, кто это написал."
 gdp_republic_unrest.0221.a.success: "Источник найден, больше он ничего не напишет"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "Автор остаётся неизвестным"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "Я публично опровергну эти слова."
 gdp_republic_unrest.0221.b.success: "Обвинения звучат всё менее убедительно"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "Народ глумится надо мной"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "Нужно выкупить все экземпляры."
 gdp_republic_unrest.0221.d: "Такие сплетни стихают сами по себе."
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "Восстание в столице: враг у ворот"
 gdp_republic_unrest.0301.desc: "Стража будит меня с тревожным известием: в нашу сторону движется толпа. Я выхожу в коридор и вижу, что дворец опустел, а почти все стражники разбежались.\n\nИз окна прекрасно видна народная масса, надвигающаяся медленно, но неумолимо. Народ кричит и что-то скандирует; очевидно, он жаждет моей крови."
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "Есть лишь [Select_CString(ROOT.Char.IsFemale, 'одна истинная', 'один истинный' )] [ROOT.Char.GetTitleAsNameNoTooltip|l]. Попробуйте, возьмите меня!"
 gdp_republic_unrest.0301.a.success: "Я рублю мятежников до тех пор, пока в залитых кровью стенах дворца не воцаряется тишина. Руки дрожат от напряжения"
 gdp_republic_unrest.0301.a.fail: "Я погибаю от рук толпы"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "Я не дамся им [Select_CString(ROOT.Char.IsFemale, 'живой', 'живым' )]!"
 gdp_republic_unrest.0301.b.success: "Мы со стражниками прорываемся наружу"
 gdp_republic_unrest.0301.b.fail: "Нас слишком мало"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "Я уйду через вход для слуг."
 gdp_republic_unrest.0301.c.success: "Мне удаётся выбраться тайком"
 gdp_republic_unrest.0301.c.fail: "Меня ловят"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "Моему правлению конец."
 gdp_republic_unrest.0301.d.flavor: "Я объявляю о своей отставке из окна, затем выхожу без оружия, молясь, чтобы мне оставили жизнь."
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "Восстание в столице: мёртвая тишина"
 gdp_republic_unrest.0302.desc: "Во дворце воцарилась тишина.\n\nПовсюду разбросаны трупы. Двери, через которые бежали уцелевшие мятежники, так и стоят нараспашку. По крайней мере, руки почти перестали трястись.\n\nЯ всё ещё здесь."
 gdp_republic_unrest.0302.a: "Я… [Select_CString(ROOT.Char.IsFemale, 'жива', 'жив' )]?.."
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "Восстание в столице: новое имя и новая жизнь"
 gdp_republic_unrest.0303.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'жива', 'жив' )].\n\nГород остался позади, здесь меня никто не узнает. У меня больше нет титула, нет дворца — ничего из того, что долгие годы определяло всю мою жизнь.\n\nИ всё же я [Select_CString(ROOT.Char.IsFemale, 'выжила', 'выжил' )] — а это уже кое-что. Куда теперь?"
 gdp_republic_unrest.0303.a: "[destination_a.GetNameNoTierNoTooltip]. Там я начну всё с начала."
 gdp_republic_unrest.0303.a.tt: "Отправиться в область [destination_a.GetNameNoTier] и перенести туда имение"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip] находится достаточно далеко. Там можно восстановить силы."
 gdp_republic_unrest.0303.b.tt: "Отправиться в область [destination_b.GetNameNoTier] и перенести туда имение"
 gdp_republic_unrest.0303.c: "Туда, где никто не знает моего имени. [destination_c.GetNameNoTierNoTooltip], например."
 gdp_republic_unrest.0303.c.tt: "Отправиться в область [destination_c.GetNameNoTier] и перенести туда имение"
 gdp_republic_unrest.0303.d: "Мне некуда идти. Останусь и постараюсь принести хоть какую-то пользу."
 gdp_republic_unrest.0303.tt: "Все [Concept('domicile_buildings', 'постройки в имении')|E] сбрасываются"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.GetTitleAsNameNoTooltip] [Select_CString(old_doge.IsFemale, 'погибла', 'погиб')]"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName] [Select_CString(old_doge.IsFemale, 'мертва', 'мёртв')]. [Select_CString(old_doge.IsFemale, 'Она погибла', 'Он погиб')] во время восстания, и теперь в [Select_CString(old_doge.IsFemale, 'её', 'его')] дворце воцарилась тишина.\n\nОдному лишь Богу известно, что будет дальше."
 gdp_republic_unrest.0304.a: "Это всё меняет."
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.GetTitleAsNameNoTooltip] [Select_CString(old_doge.IsFemale, 'пропала', 'пропал')]"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName] [Select_CString(old_doge.IsFemale, 'исчезла', 'исчез')]. Слуги не нашли ни тела, ни прощальной записки — [Select_CString(old_doge.IsFemale, 'она просто испарилась', 'он просто испарился')] посреди ночи, когда толпа бунтовала у ворот [Select_CString(old_doge.IsFemale, 'её', 'его')] дворца.\n\nОдному лишь Богу известно, что будет дальше."
 gdp_republic_unrest.0305.a: "Это всё меняет."
 gdp_republic_unrest.0306.t: "Восстание в столице: новый город и новая жизнь"
 gdp_republic_unrest.0306.desc: "Многое осталось позади, но я стараюсь не оглядываться.\n\nЗдесь меня ещё никто не знает. Кругом лишь незнакомые рынки и чужие лица, но я чувствую, что в этом городе у меня есть будущее. Я задействую все те немногие ресурсы, что остались у меня от прежней жизни, чтобы заработать денег, найти союзников и снова встать на ноги."
 gdp_republic_unrest.0306.a: "За работу."
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "Восстание в столице: убийца на площади"
 gdp_republic_unrest.0311.desc: "Собравшаяся на рынке толпа расступается передо мной, и шум голосов неожиданно стихает. В следующий миг кто-то бросается на меня с обнажённым клинком.\n\nСтражники слишком далеко, они не успеют на помощь. У меня есть не больше секунды."
 gdp_republic_unrest.0311.a: "Где мой меч?!"
 gdp_republic_unrest.0311.a.success: "Мне удаётся дать отпор убийце"
 gdp_republic_unrest.0311.a.fail: "Стражники не успевают остановить убийцу"
 gdp_republic_unrest.0311.b: "Мне срочно нужно выбраться отсюда."
 gdp_republic_unrest.0311.b.success: "Мне удаётся убежать от убийцы"
 gdp_republic_unrest.0311.b.fail: "Бежать некуда"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "Восстание в столице: угроза миновала"
 gdp_republic_unrest.0312.desc: "В суматохе толпа разбежалась, но мне каким-то чудом удалось остаться в живых.\n\nПодоспевшие стражники расправились с убийцей, и я опускаю взгляд на бездыханное тело. У [Select_CString(assassin.IsFemale, 'неё', 'него')] лицо и руки простого ремесленника.\n\nГде же мне искать спасения, если даже простые горожане готовы меня убить?"
 gdp_republic_unrest.0312.a: "Мне… мне пора домой."
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "Восстание в столице: кровь за кровь"
 gdp_republic_unrest.0321.desc: "Поздно ночью ко мне в кабинет является гонец с письмом.\n\n[Select_CString(heir.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))|l] [Select_CString(heir.IsFemale, 'попала', 'попал' )] в руки мятежников. Если к утру я не уйду, мне вернут [Select_CString(heir.IsFemale, 'её', 'его' )] уже [Select_CString(heir.IsFemale, 'мёртвой', 'мёртвым' )]."
 gdp_republic_unrest.0321.rival: "Мне нет до [Select_CString(heir.IsFemale, 'неё', 'него' )] дела."
 gdp_republic_unrest.0321.a: "Отправить за [Select_CString(heir.IsFemale, 'ней', 'ним' )] стражников."
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U] выживает"
 gdp_republic_unrest.0321.a.success: "Стражники вовремя спасают [Select_CString(heir.IsFemale, 'её', 'его' )]"
 gdp_republic_unrest.0321.a.fail: "Стражники не успели [Select_CString(heir.IsFemale, 'её', 'его' )] спасти"
 gdp_republic_unrest.0321.b: "Стража! Узнайте, где [Select_CString(heir.IsFemale, 'её', 'его' )] держат."
 gdp_republic_unrest.0321.b.success: "Стражникам удаётся [Select_CString(heir.IsFemale, 'её', 'его' )] выследить"
 gdp_republic_unrest.0321.b.fail: "Стражникам не удалось [Select_CString(heir.IsFemale, 'её', 'его' )] найти"
 gdp_republic_unrest.0321.c: "Я заплачу любую цену, пусть только вернут [Select_CString(heir.IsFemale, 'её', 'его' )]!"
 gdp_republic_unrest.0321.d: "Без [Select_CString(heir.IsFemale, 'неё', 'него' )] этот титул ничего не значит."
 gdp_republic_unrest.0321.d.flavor: "Если это поможет [Select_CString(heir.IsFemale, 'её', 'его' )] спасти, то оно того стоит."
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "Восстание в столице: в целости и сохранности"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip] неуверенной поступью входит ко мне в кабинет с лёгкой улыбкой на лице. [Select_CString(heir.IsFemale, 'Она жива', 'Он жив' )], [Select_CString(heir.IsFemale, 'её', 'его' )] жизни ничего не угрожает, — и это главное.\n\nТеперь нужно позаботиться о том, чтобы это не повторилось."
 gdp_republic_unrest.0322.desc.rival: "Ко мне в комнату входит слуга. У него добрые новости — [heir.GetFirstNameNoTooltip] [Select_CString(heir.IsFemale, 'вернулась', 'вернулся' )].\n\nЗамечательно. Значит, порядок наследования не нарушен. Я позабочусь о том, чтобы это не повторилось."
 gdp_republic_unrest.0322.a: "Слава богу, что ты [Select_CString(heir.IsFemale, 'вернулась', 'вернулся' )]!"
 gdp_republic_unrest.0322.a.rival: "Вот и славно. Теперь можно вернуться к делам."
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "Восстание в столице: слишком поздно"
 gdp_republic_unrest.0323.desc: "Ночью кто-то стучит в ворота. Я слышу снаружи голоса, но они быстро затихают.\n\nЕщё на подходе ко двору я понимаю, что произошло. [heir.GetFirstNameNoTooltip] навзничь лежит передо мной на каменном полу: разъярённая толпа показательно отправила [Select_CString(heir.IsFemale, 'её', 'его' )] обезображенное тело домой."
 gdp_republic_unrest.0323.desc.rival: "Ночью кто-то стучит в ворота. Ещё на подходе ко двору я понимаю, что произошло.\n\n[heir.GetFirstNameNoTooltip] навзничь лежит передо мной на каменном полу: разъярённая толпа показательно отправила [Select_CString(heir.IsFemale, 'её', 'его' )] обезображенное тело домой. Я долго стою над [Select_CString(heir.IsFemale, 'ней', 'ним' )], молча взирая на то, что осталось от [Select_CString(heir.IsFemale, 'моей наследницы', 'моего наследника' )]."
 gdp_republic_unrest.0323.a.child: "Что они сделали с [Select_CString(heir.IsFemale, 'моей девочкой', 'моим мальчиком' )]…"
 gdp_republic_unrest.0323.a: "[heir.GetFirstNameNoTooltip], что же они с тобой сделали…"
