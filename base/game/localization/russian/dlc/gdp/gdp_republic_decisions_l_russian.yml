 #City Stroll
 gdp_republic_city_stroll_decision: "Прогуляться по владению [GetPlayer.GetCapitalLocation.GetNameNoTooltip]"
 gdp_republic_city_stroll_decision_desc: "Предсказывать потребности рынка и накапливать богатства на торговле также просто, как не отставать от жизни. А как не отстать от жизни? Достаточно встречаться с горожанами и узнавать, чем живёт [GetPlayer.GetCapitalLocation.GetNameNoTooltip]!"
