 gdp_petition_for_state_protection_decision_desc: "Государство может обеспечить хорошую защиту тем, кого сочтёт достойными."
 gdp_petition_for_state_protection_decision_tooltip: "Государственная защита значительно снизит эффективность [Concept('hostile_scheme', 'агрессивных происков')|E] против защищённого персонажа."
