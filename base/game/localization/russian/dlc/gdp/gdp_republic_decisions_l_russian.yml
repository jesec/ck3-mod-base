l_russian:
 gdp_adopt_republic_government_decision: "Принять республиканские идеалы"
 gdp_adopt_republic_government_decision_desc: "Я наблюдаю за тем, как по улице течёт толпа людей, утомлённых повседневными тяготами, и размышляю, действительно ли наш [ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l]ий образ жизни является единственным возможным для правителя. Могу ли я добиться верности не по праву рождения, а заслужив её одобрением? Возможно, пора принять новые идеалы и изменить наш образ жизни."
 gdp_adopt_republic_government_decision_tooltip: "Принять республиканские идеалы и стать [GetGovernment('republic_government').GetAdjective]им правителем"
 gdp_adopt_republic_government_decision_confirm: "Принять республиканские идеалы"
 liege_has_granted_city_charter: "Ваш [Concept('liege', 'сюзерен')|E] даровал вам городскую хартию"
 liege_has_granted_city_charter_duration: "Ваш [Concept('liege', 'сюзерен')|E] даровал вам городскую хартию #weak (до [GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )])#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X Вы прекратите быть [Concept('elector', 'выборщиком')|E] в державе [GetTitleByKey('e_hre').GetName]#!"
 gdp_adopt_republican_ways_decision: "Принять республиканские обычаи"
 gdp_adopt_republican_ways_decision_desc: "Некогда объединявшие нас собрания не справляются с весом рынков и стен. Для процветания державы [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] нужно отказаться от старых племенных обычаев и дать городу республиканское самоуправление."
 gdp_adopt_republican_ways_decision_tooltip: "Отказаться от [Concept('tribal', 'племенных')|E] обычаев и стать [Concept('republic', 'республикой')|E]"
 gdp_adopt_republican_ways_decision_confirm: "Принять республиканские обычаи"
 gdp_tribal_capital_becomes_city_tt: "[Concept('realm_capital', 'Столица')|E] вашей державы станет [Concept('city_holding', 'городским владением')|E]"
 gdp_other_tribal_holdings_become_castles_tt: "Остальные [Concept('tribal_holdings', 'племенные владения')|E] в державе станут [Concept('castle_holdings', 'замками')|E]"
 gdp_tribal_vassals_will_feudalize_tt: "Ваши [Concept('tribal', 'племенные')|E] [Concept('vassals', 'вассалы')|E] перейдут к [Concept('feudal', 'феодальной')|E] или [Concept('clan', 'клановой')|E] [Concept('government', 'форме правления')|E]"
 convert_to_feudalism_from_republic_decision: "Принять тип правления «[ROOT.Char.Custom('GetTribalReformGovernment')|l]»"
 convert_to_feudalism_from_republic_decision_desc: "Всевозможные собрания и бюрократические процедуры снижают эффективность нашего правительства. Если мы избавимся от этой обузы, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] будет процветать."
 convert_to_feudalism_from_republic_decision_confirm: "Принять тип правления «[ROOT.Char.Custom('GetTribalReformGovernment')|l]»"
 convert_to_feudalism_from_republic_decision_tooltip: "Сменить тип [Concept('government', 'правления')|E]"
 patricians_becomes_merchants_desc: "[Concept('vassals', 'Вассалы')|E]-[Concept('patrician','патриции')|E] станут [Concept('merchants', 'торговцами')|E]"
 gdp_restore_roman_republic_decision: "Восстановить Римскую республику"
 gdp_restore_roman_republic_decision_desc: "Римская республика была светочем свободы и процветания, образцом для подражания. И всё же она пала, как и всё в этом мире. Пришло время возродить её и вернуть ей былую славу!"
 gdp_restore_roman_republic_decision_tooltip: "Восстановить Римскую республику"
 gdp_restore_roman_republic_decision_confirm: "Восстановить Римскую республику"
 restore_roman_republic_make_rome_capital_desc: "При желании вы можете сделать [Concept('realm_capital', 'столицей державы')|E] владение [GetTitleByKey('c_roma_urbs').GetName]"
 assembly_members_appointed_as_senators_desc: "Все члены [Concept('assembly', 'собрания')|E] получат назначение на должности [Concept('republic_senators', 'сенаторов')|E]"
 gdp_popular_mandate_decision: "Обратиться за общественной поддержкой"
 gdp_popular_mandate_decision_desc: "Жители города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] меня обожают. Я могу воспользоваться их хорошим отношением и добиться поддержки продления срока моих полномочий. Голос толпы обладает весом в собрании, а [ROOT.Char.GetTitleAsNameNoTooltip|l] с народной поддержкой имеет больше влияния при подсчёте голосов.\n\nЭто будет стоить мне расположения некоторых, но голосование выигрывается сегодня, а не завтра."
 gdp_popular_mandate_decision_tooltip: "Потратить [Concept('popular_opinion', 'народное мнение')|E] в городе [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], чтобы получить дополнительный голос на следующих [Concept('election', 'выборах')|E]"
 gdp_popular_mandate_decision_confirm: "Собрать сторонников"
 gdp_popular_mandate_no_active_mandate_desc: "У вас не должно быть народной поддержки"
 gdp_civic_labor_decision: "Направить общественные работы"
 gdp_civic_labor_decision_desc: "Поддержка жителей города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — такой же ресурс, как и золото. Я обращусь к горожанам с просьбой поддержать моё строительство своим трудом и знаниями, хотя это и будет стоить мне расположения некоторых."
 gdp_civic_labor_decision_tooltip: "Потратить [Concept('popular_opinion', 'народное мнение')|E] в городе [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], чтобы получить бонусы к строительству в имение, которым владет [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 gdp_civic_labor_decision_confirm: "Обратиться к гражданам"
 gdp_popular_gifts_decision: "Напроситься на покровительство"
 gdp_popular_gifts_decision_desc: "Отношение ко мне жителей города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] открывает передо мной ряд возможностей. Я пущу слух, что [ROOT.Char.GetTitleAsNameNoTooltip|l] выслушивает предложения от великих патрицианских домов. Они будут стараться переплюнуть друг друга, и дворец в любом случае останется в выигрыше."
 gdp_popular_gifts_decision_tooltip: "Потратить [Concept('popular_opinion', 'народное мнение')|E], чтобы заставить богатые патрицианские семейства соперничать за ваше расположение и тем самым получать [Concept('gold', 'золото')|E] и подарки"
 gdp_popular_gifts_decision_confirm: "Пусть поборются"
 gdp_popular_gifts_artifact_tt: "Вы получите в дар случайный [Concept('artifact', 'артефакт')|E]"
 gdp_glorification_decision: "Принять прославление"
 gdp_glorification_decision_desc: "Уважение, что испытывают ко мне жители города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], выходит за рамки политики или популярности. Они хотят почитать меня не как лидера, а как живое воплощение самого города. Я приму это как есть."
 gdp_glorification_decision_tooltip: "Принять городское прославление. Такие почести воздают раз в жизни."
 gdp_glorification_decision_confirm: "Пусть празднуют"
 gdp_glorification_artifact_tt: "Вы получите [Concept('artifact', 'артефакт')|E] #V $gdp_glorification_artifact_name$#!"
 gdp_glorification_artifact_name: "Медальон гражданской славы"
 gdp_glorification_artifact_desc: "Памятный медальон, подаренный жителями города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], чтобы показать, какой любовью у них пользуется [ROOT.Char.GetTitleAsNameNoTooltip|l]."
 gdp_popular_mandate_decision_toast: "Общественная поддержка получена"
 gdp_civic_labor_decision_toast: "Граждане мобилизованы на работы"
 gdp_popular_gifts_decision_toast: "Патриции отвечают на зов"
 gdp_glorification_decision_toast: "Город празднует"
 gdp_fund_alms_decree_decision: "Раздать милостыню в столице"
 gdp_fund_alms_decree_decision_desc: "Я [ROOT.Char.GetTitleAsNameNoTooltip] и [Select_CString(ROOT.Char.IsFemale, 'обязана', 'обязан' )] следить за тем, чтобы у граждан города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] было всё необходимое. Милостыню можно раздавать по разным причинам: помочь нуждающимся, увеличить процветание города и укрепить узы, на которых держится наше общество.\n\nНезависимо от мотивации помощь беднякам — отличный способ заслужить любовь народа."
 gdp_fund_alms_decree_decision_tooltip: "Раздать милостыню беднякам из города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 gdp_fund_alms_decree_decision_confirm: "Раздать милостыню"
 gdp_tax_holiday_decree_decision: "Освобождение от налогов"
 gdp_tax_holiday_decree_decision_desc: "На ближайшие несколько лет налоги с жителей города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] будут снижены. Казна пострадает от этого решения, но одобрение народа того стоит."
 gdp_tax_holiday_decree_decision_tooltip: "Снизить налоги для города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], чтобы повысить [Concept('popular_opinion', 'народное мнение')|E]"
 gdp_tax_holiday_decree_decision_confirm: "Освободить город от налогов"
 gdp_debt_forgiveness_decree_decision: "Прощение долга"
 gdp_debt_forgiveness_decree_decision_desc: "На многих жителях города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] лежит бремя долгов, с которыми они не могут расплатиться. Отменив задолженности перед городом, мы снимем с них это бремя и заслужим их преданность. Не все одобрят такое отношение к казне, но правитель, пользующийся народной поддержкой, твёрдо стоит на ногах."
 gdp_debt_forgiveness_decree_decision_tooltip: "Аннулировать долги жителей города [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] и значительно увеличить [Concept('popular_opinion', 'народное мнение')|E]"
 gdp_debt_forgiveness_decree_decision_confirm: "Отменить долги"
 gdp_debt_forgiveness_upset_patricians_tt: "Каждый [Concept('vassal', 'вассал')|E] без [Concept('house_ambition', 'амбиции дома')|E] «[GetHouseAspiration( 'republic_communal' ).GetName|V]»"
 gdp_debt_forgiveness_pleased_patricians_tt: "Каждый [Concept('vassal', 'вассал')|E] с [Concept('house_ambition', 'амбицией дома')|E] «[GetHouseAspiration( 'republic_communal' ).GetName|V]»"
 gdp_finance_war_decree_decision: "Дать средства на военные нужды"
 gdp_finance_war_decree_decision_desc: "Война — это ужасно и, самое главное, #EMP дорого#!. При необходимости мы можем собрать дополнительные военные налоги, чтобы собрать средства на военные нужды."
 gdp_finance_war_decree_decision_tooltip: "Собрать дополнительные налоги на поддержку текущих войн"
 gdp_finance_war_decree_decision_confirm: "Собрать военный налог"
 finance_war_patrician_tax_name: "Налог с патрициев"
 finance_war_patrician_tax_desc: "$finance_war_patrician_tax_name$"
 finance_war_patrician_tax_tooltip: "Собрать дополнительный налог с [Concept('patricians','патрициев')|E]"
 finance_war_citizen_tax_name: "Налог с граждан"
 finance_war_citizen_tax_desc: "$finance_war_citizen_tax_name$"
 finance_war_citizen_tax_tooltip: "Собрать дополнительный налог с [Concept('counties', 'графств')|E]"
 every_patrician_tt: "Каждый [Concept('patrician','патриций')|E]"
 gdp_war_approval_decree_decision: "Попросить одобрение войны"
 gdp_war_approval_decree_decision_desc: "Объявить [Concept('war', 'войну')|E] можно только с одобрения собрания. Возможно, потребуется кое-кого подмазать, чтобы получить необходимые голоса, но это ради общего блага."
 gdp_war_approval_decree_decision_tooltip: "Попросить у [Concept('assembly', 'собрания')|E] разрешение на объявление [Concept('war', 'войны')|E]"
 gdp_war_approval_decree_decision_confirm: "Попросить одобрение войны"
 gdp_war_approval_decree_decision_effect_desc: "Вы получите разрешение объявить [Concept('war', 'войну')|E]"
 must_have_assembly_approval_declare_war_desc: "У вас #bold нет#! одобрения [Concept('assembly_possessive', 'собрания')|E] на объявление [Concept('war', 'войны')|E]"
 gained_assembly_approval_declare_war_desc: "Вы получили одобрение [Concept('assembly_possessive', 'собрания')|E] на объявление [Concept('war', 'войны')|E]"
 gdp_banishment_approval_decree_decision: "Попросить одобрение изгнания"
 gdp_banishment_approval_decree_decision_named: "Попросить об изгнании персонажа [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_banishment_approval_decree_decision_desc: "Среди нас есть те, кто не может жить по нашим законам, а значит и наши законы на них больше не распространяются. С согласия собрания мы можем [Concept('banish', 'изгнать')|E] их из державы и избавиться от опасных элементов без риска начать смертельную вражду, как могло бы быть, прибегни мы к более решительным мерам."
 gdp_banishment_approval_decree_decision_tooltip: "Попросить у [Concept('assembly', 'собрания')|E] разрешение на [Concept('banish', 'изгнание')|E] обвинённого вами персонажа"
 gdp_banishment_approval_decree_decision_confirm: "Попросить одобрение изгнания"
 gdp_banishment_approval_decree_decision_effect_desc: "Вы получите разрешение [Concept('banish', 'изгнать')|E] персонажа [indicted_character.GetShortUIName]"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "Вы получите разрешение [Concept('banish', 'изгнать')|E] обвинённого вами персонажа"
 must_have_assembly_approval_banishment_desc: "У вас #bold нет#! одобрения [Concept('assembly_possessive', 'собрания')|E] на [Concept('banish', 'изгнание')|E]"
 gained_assembly_approval_banishment_desc: "Вы уже получили одобрение [Concept('assembly_possessive', 'собрания')|E] на [Concept('banish', 'изгнание')|E] персонажа [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_proscription_approval_decree_decision: "Попросить одобрение проскрипции"
 gdp_proscription_approval_decree_decision_named: "Попросить проскрипции семьи [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip]"
 gdp_proscription_approval_decree_decision_desc: "Кровь всегда даёт о себе знать, и родичи предателя так же осквернены и хранят ту же злобу в своих вероломных сердцах. Если собрание согласится, мы сможем [Concept('banish', 'изгнать')|E] всё семейство и избавить себя от этого подлого рода."
 gdp_proscription_approval_decree_decision_tooltip: "Попросить у [Concept('assembly', 'собрания')|E] разрешение на [Concept('banish', 'изгнание')|E] всей семьи обвинённого вами персонажа"
 gdp_proscription_approval_decree_decision_confirm: "Попросить одобрение проскрипции"
 gdp_proscription_approval_decree_decision_effect_desc: "Вы получите разрешение [Concept('banish', 'изгнать')|E] персонажа [indicted_character.GetShortUIName] со всей семьёй"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "Вы получите разрешение [Concept('banish', 'изгнать')|E] всю семью обвинённого вами персонажа"
 must_have_assembly_approval_proscription_desc: "У вас #bold нет#! одобрения [Concept('assembly_possessive', 'собрания')|E] на [Concept('banish', 'изгнание')|E] всей семьи"
 gained_assembly_approval_proscription_desc: "Вы уже получили одобрение [Concept('assembly_possessive', 'собрания')|E] на [Concept('banish', 'изгнание')|E] персонажа [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName] со всей семьёй"
 gdp_execution_approval_decree_decision: "Попросить одобрение казни"
 gdp_execution_approval_decree_decision_named: "Попросить о казни персонажа [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_execution_approval_decree_decision_desc: "Несмотря на благожелательность нашего правления, хватает тех, кто готов подорвать его устои. Эта угроза столь велика, что нам не будет покоя, пока её источник ещё дышит. С одобрения собрания мы можем [Concept('execute', 'казнить')|E] виновного и успокоить народ."
 gdp_execution_approval_decree_decision_tooltip: "Попросить у [Concept('assembly', 'собрания')|E] разрешение на [Concept('execute', 'казнь')|E] обвинённого вами персонажа"
 gdp_execution_approval_decree_decision_confirm: "Попросить одобрение казни"
 gdp_execution_approval_decree_decision_effect_desc: "Вы получите разрешение [Concept('execute', 'казнить')|E] персонажа [indicted_character.GetShortUIName]"
 gdp_execution_approval_decree_decision_effect_no_indicted_desc: "Вы получите разрешение [Concept('execute', 'казнить')|E] обвинённого вами персонажа"
 must_have_assembly_approval_execution_desc: "У вас #bold нет#! одобрения [Concept('assembly_possessive', 'собрания')|E] на [Concept('execute', 'казнь')|E]"
 gained_assembly_approval_execution_desc: "Вы уже получили одобрение [Concept('assembly_possessive', 'собрания')|E] на [Concept('execute', 'казнь')|E] персонажа [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_has_no_valid_indicted_character_desc: "Вы никого #bold не#! обвиняли перед [Concept('assembly', 'собранием')|E]"
 gdp_has_no_valid_indicted_family_desc: "Вы #bold не#! обвиняли главу [Concept('patrician_family', 'патрицианского семейства')|E] перед [Concept('assembly', 'собранием')|E]"
 gdp_indicted_family_head_is_player_desc: "Глава обвинённого [Concept('patrician_family', 'патрицианского семейства')|E] #bold не#! должен быть игроком"
 gdp_overthrow_government_decision: "Свергнуть правительство"
 gdp_overthrow_government_decision_desc: "Руководство этой республики прогнило до самого основания. Настало время вернуть государство на верный путь и свергнуть продажную и безвольную власть. Республиканские ценности вновь должны воцариться в городе [ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nЯ найду единомышленников, и вместе мы свергнем правительство, которое возглавляет [ROOT.Char.GetLiege.GetNameNoTooltip]."
 gdp_overthrow_government_decision_tooltip: "Свергнуть текущее правительство [Concept('republic', 'республики')|E] и занять место правителя"
 gdp_overthrow_government_decision_confirm: "Долой тиранов!"
 you_are_patrician_desc: "Вы — безземельный [Concept('patrician', 'патриций')|E]."
 overthrow_government_effect_tooltip: "#WEAK Это решение начнёт [Concept('hostile_scheme', 'агрессивные происки')|E] с целью свергнуть правительство.#!\n$EFFECT_LIST_BULLET$ Вы можете стать новым [Concept('liege', 'сюзереном')|E]\n$EFFECT_LIST_BULLET$ Ваши [Concept('rivals', 'соперники')|E] и политические враги могут покинуть [Concept('republic', 'республику')|E]\n$EFFECT_LIST_BULLET$ Законы республики изменятся на подходящие вашей амбиции дома без одобрения [Concept('assembly_possessive', 'собрания')|E]\n@alert_icon!#alert_trial Если заговор против государства будет раскрыт, его сочтут серьёзным [Concept('crime', 'преступлением')|E]#!"
 gdp_overthrow_agent_focus_balance: "Сбалансированное распределение [Concept('agent', 'соучастников')|E]"
