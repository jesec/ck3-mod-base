 gdp_enforce_curfew_decree_decision: "Ночной комендантский час"
 gdp_enforce_curfew_decree_decision_desc: "#bold Постановление собрания#!\nОтныне с наступлением ночи вводится строгий комендантский час. Эта мера призвана пресечь преступную деятельность под покровом темноты."
 gdp_enforce_curfew_decree_decision_tooltip: "Ввести ночной комендантский час, чтобы сократить преступность и сорвать преступные замыслы."
 gdp_enforce_curfew_decree_decision_confirm: "Ввести ночной комендантский час"
 gdp_enforce_curfew_decree_decision_effect_desc: "Ночной комендантский час снизит эффективность [Concept('hostile_scheme', 'агрессивных происков')|E] и повысит [Concept('control', 'контроль')|E]"
 gdp_republic_curfew_desc: "Все [Concept('vassals', 'вассалы')|E] в [Concept('capital', 'столице')|E]"
 gdp_sponsor_craft_guild_decision: "Поддержать ремесленную гильдию"
 gdp_sponsor_craft_guild_decision_desc: "В республике признание в качестве ремесленной гильдии даёт немало преимуществ, а поэтому ремесленники многих профессий мечтают получить официальную хартию, составленную и одобренную собранием. Поддержка этого начинания идёт на пользу городу, а патриций, вынесший вопрос на рассмотрение собрания, будет рассматриваться новой гильдией в качестве покровителя."
 gdp_sponsor_craft_guild_decision_tooltip: "Поддержка ремесленной гильдии увеличит [Concept('prosperity_growth', 'прирост процветания')|E] и [Concept('urban_tax', 'налоги с городов')|E] в [Concept('capital', 'столичном')|E] [Concept('county', 'графстве')|E], а также увеличит [Concept('trade_competitiveness', 'конкурентноспособность')|E] вашего [Concept('house_possessive', 'дома')|E] и прирост [Concept('trade_expertise', 'познаний в торговле')|E]"
 gdp_sponsor_craft_guild_decision_confirm: "Поддержка новой ремесленной гильдии"
 gdp_request_noble_magistracy_decision: "Попросить о дворянском магистрате"
 gdp_request_noble_magistracy_decision_desc: "Хотя большинство важных должностей доступно лишь патрициям, есть и должности для дворянских магистратов, которые отлично подойдут молодому и амбициозному патрицию и помогут изучить механизмы государства и накопить репутацию."
 gdp_request_noble_magistracy_decision_tooltip: "Дворянский магистрат для вашего [Concept('heir_possessive', 'наследника')|E] увеличит прирост [Concept('dynasty_prestige', 'признания')|E], прирост [Concept('lifestyle_experience', 'жизненного опыта')|E] и [Concept('opinion', 'мнение')|E], но также увеличит [Concept('stress_gain', 'прирост стресса')|E]"
 gdp_request_noble_magistracy_decision_confirm: "Попросить дворянский магистрат для наследника"
 gdp_request_relief_from_bankruptcy_decision: "Попросить спасти от разорения"
 gdp_request_relief_from_bankruptcy_decision_desc: "Чтобы видные семейства не обнищали, собрание может использовать казну республики для выплат по их долгам и просроченным займам. Так у разорённого патриция появится шанс выкарабкаться со дна финансовой ямы."
 gdp_request_relief_from_bankruptcy_decision_tooltip: "Спасение от разорения приведёт к выплате [Concept('gold', 'золота')|E], которое вы должны, из [Concept('treasury', 'казны')|E] [Concept('republic', 'республики')|E]"
 gdp_request_relief_from_bankruptcy_decision_confirm: "Просьба спасти от разорения"
