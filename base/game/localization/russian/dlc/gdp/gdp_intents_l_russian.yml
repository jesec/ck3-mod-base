l_russian:
 schmooze_intent: "Тесно пообщаться"
 schmooze_intent_desc: "Вы стремитесь обзавестись полезными знакомствами, чтобы облегчить ведение дел и повысить свою [Concept('competitiveness', 'конкурентоспособность')|E]."
 gdp_merchant_schmooze_modifier: "Тесное общение с дворянами"
 gdp_merchant_schmooze_modifier_desc: "Этот персонаж на пиру сумел завести полезные знакомства среди местной знати."
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U] и [TARGET_CHARACTER.GetShortUINameNoTooltip] тесно пообщались"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName] [Select_CString(CHARACTER.IsLocalPlayer, 'воспользовались', Select_CString(CHARACTER.IsFemale, 'воспользовалась', 'воспользовался'))] случаем, чтобы тесно пообщаться с [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вами', Concatenate('персонажем по имени ', TARGET_CHARACTER.GetShortUIName))]."
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U] и представители дворянства тесно пообщались"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName] [Select_CString(CHARACTER.IsLocalPlayer, 'воспользовались', Select_CString(CHARACTER.IsFemale, 'воспользовалась', 'воспользовался'))] случаем, чтобы тесно пообщаться с дворянами"
 gdp_schmooze_events.1000.t: "Тесное общение: [schmoozee.GetFirstNameNoTooltip]"
 gdp_schmooze_events.1000.desc: "Торговец не может упускать случая свести знакомство со знатью. Пара удачных слов или щедрый дар способны склонить дворян на свою сторону — или хотя бы не дать им поддержать соперника.\n\nСтараясь не скатиться ни в откровенную лесть, ни в излишнюю фамильярность, я пытаюсь сделать так, чтобы [Select_CString(schmoozee.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))|l], [schmoozee.GetTitledFirstName], [Select_CString(schmoozee.IsFemale, 'выразила', 'выразил')] ко мне благосклонность."
 gdp_schmooze_events.1000.a: "«Прошу, [Select_CString(schmoozee.IsFemale, 'добрая', 'добрый')] [schmoozee.GetTitleAsNameNoTooltip], примите этот дар»."
 gdp_schmooze_events.1000.b: "«Смиренному торговцу вроде меня остаётся лишь равняться на своих благородных господ»."
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip] [Select_CString(schmoozee.IsFemale, 'польщена', 'польщён')]"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip] закатывает глаза"
 gdp_schmooze_events.1000.c: "«Для меня было честью беседовать с вами»."
 gdp_schmooze_events.1000.d: "«Среди моих товаров немало таких, что по достоинству оценит даже [schmoozee.GetTitleAsNameNoTooltip]!»"
 gdp_schmooze_events.1010.t: "Добродушное соперничество"
 gdp_schmooze_events.1010.feast: "Стол украшают [ROOT.Char.Custom('GetExpensiveMeal')|l] и [ROOT.Char.Custom('RegionalDrink')|l]. [schmoozee.GetName] делит со мной трапезу, и мы по очереди хвалимся успехами своих торговых домов."
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName] отдыхает со мной в тени [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], и мы по очереди хвалимся успехами своих торговых домов."
 gdp_schmooze_events.1010.outro: "\n\nПри всём нашем бахвальстве мы неожиданно обнаруживаем, что во многом смотрим на вещи одинаково. Пожалуй, мы можем быть полезны друг другу."
 gdp_schmooze_events.1010.a: "«За достойную плату я могу уступить вам часть рынка»."
 gdp_schmooze_events.1010.b: "«Возьмите это — и не стойте у нас на пути»."
 gdp_schmooze_events.1010.c: "«Вы поддержите мою репутацию, а я — вашу»."
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip] соглашается"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip] не [Select_CString(schmoozee.IsFemale, 'заинтересована', 'заинтересован')]"
 gdp_schmooze_events.1010.d: "Сейчас неподходящий момент."
 gdp_schmooze_events.1030.t: "Распределение внимания"
 gdp_schmooze_events.1030.feast: "Пир продолжается, и в какой-то момент я обнаруживаю, что рядом сидят [Select_CString(schmoozee_1.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))] [schmoozee_1.GetTitledFirstName] и [Select_CString(schmoozee_2.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))] [schmoozee_2.GetTitledFirstName]. Обгладывая жареную рыбу, они неспешно рассуждают о торговле и искусстве заключать сделки."
 gdp_schmooze_events.1030.hunt: "Охота продолжается, и в какой-то момент я обнаруживаю, что подле меня едут [Select_CString(schmoozee_1.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))] [schmoozee_1.GetTitledFirstName] и [Select_CString(schmoozee_2.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))] [schmoozee_2.GetTitledFirstName]. Пока гончие берут след, они неспешно рассуждают о торговле и искусстве заключать сделки."
 gdp_schmooze_events.1030.outro: "\n\nНаконец, [schmoozee_1.GetFirstNameNoTooltip] обращается ко мне: «Кстати, [schmoozer.GetTitledFirstNameNoTooltip], вы же купец. Неужели вам нечего добавить?»"
 gdp_schmooze_events.1030.a: "«Вы попали в самую точку, [schmoozee_1.GetTitleAsNameNoTooltip|l]»."
 gdp_schmooze_events.1030.b: "«[schmoozee_2.GetTitledFirstNameNoTooltip] весьма [Select_CString(schmoozee_2.IsFemale, 'рассудительна', 'рассудителен')]»."
 gdp_schmooze_events.1030.c: "«Вы оба в равной степени вдохновляете меня»."
 gdp_schmooze_events.1030.c.success: "Они польщены"
 gdp_schmooze_events.1030.c.failure: "Они закатывают глаза"
 gdp_schmooze_events.1030.d: "«Нет, мне совершенно нечего добавить»."
 gdp_schmooze_events.1050.t: "Дела торговые"
 gdp_schmooze_events.1050.feast: "Пир на миг затихает. Гости расходятся по залу, чтобы побеседовать друг с другом, а слуги получают редкую возможность перевести дух."
 gdp_schmooze_events.1050.hunt: "Мы ненадолго останавливаемся, чтобы осмотреть [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')]ие [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')], пока гончие и загонщики устремляются вперёд."
 gdp_schmooze_events.1050.outro: "Мой взгляд невольно выхватывает тех, кто играет заметную роль в торговых делах.\n\n[schmoozee_1.GetTitledFirstName] — человек весьма полезный, если речь идёт о владении [market_1.GetLocationTitle.GetNameNoTier]. [schmoozee_2.GetTitledFirstName] обладает немалым влиянием во владении [market_2.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.three: "Также мне на глаза попадается [schmoozee_3.GetTitledFirstName], [Select_CString(schmoozee_3.IsFemale, 'которая', 'который')] ведёт дела во владении [market_3.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.a: "«[schmoozee_1.GetFirstNameNoTooltip], мне как раз хотелось с вами поговорить!»"
 gdp_schmooze_events.1050.b: "«[schmoozee_2.GetFirstNameNoTooltip], до меня дошли весьма любопытные слухи»."
 gdp_schmooze_events.1050.c: "«[schmoozee_3.GetFirstNameNoTooltip], уделите мне минуту!»"
 gdp_schmooze_events.1050.d: "Торговля и без того процветает."
 gdp_schmooze_events.1060.t: "Борьба за благосклонность"
 gdp_schmooze_events.1060.feast: "Пока слуги обходят столы, вновь наполняя кубки и подавая очередное блюдо,"
 gdp_schmooze_events.1060.hunt: "Пока мы делаем привал, чтобы промочить горло и размять ноги,"
 gdp_schmooze_events.1060.outro: "я замечаю, как [Select_CString(rival.IsFemale, 'моя соперница', 'мой соперник')], [rival.GetName], беззастенчиво втирается в доверие к одному из гостей, которым при ближайшем рассмотрении оказывается [schmoozee.GetName]. [Select_CString(rival.IsFemale, 'Эта скользкая гадюка', 'Этот скользкий тип')] рассыпается перед [Select_CString(schmoozee.IsFemale, 'ней', 'ним')] в похвалах своим торговцам, а моих людей выставляет мошенниками и пустозвонами!"
 gdp_schmooze_events.1060.a: "«Да бросьте! Предприятие дома [rival.GetHouse.GetBaseNameNoTooltip] — жалкое зрелище!»"
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip] выставляет себя на посмешище"
 gdp_schmooze_events.1060.a.failure: "Вы выставляете себя на посмешище"
 gdp_schmooze_events.1060.b: "«Не спешите судить. Наши торговые дела говорят сами за себя»."
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip] принимает вашу сторону"
 gdp_schmooze_events.1060.b.failure: "Ваши доводы звучат неубедительно"
 gdp_schmooze_events.1060.c: "Пусть болтает."
 activity_used_trade_market_luxury_items_modifier: "Повышенный спрос"
 activity_used_trade_market_luxury_items_modifier_desc: "Роскошные товары с этого рынка были перенаправлены купцом на нужды одного из мероприятий."
 activity_used_trade_market_comforts_modifier: "Повышенный спрос"
 activity_used_trade_market_comforts_modifier_desc: "Блага с этого рынка были перенаправлены торговцем на нужды одного из мероприятий."
