l_russian:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]: добиться преимуществ"
 gdp_merchant_scheme_advantage.1000.intro: "Все мои мысли занимает вопрос о том, как лучше развивать нашу компанию во владении [task_contract_location.GetBaronyNameExplicitly]."
 gdp_merchant_scheme_advantage.1000.intro.rival: "Недолго думая я прихожу к выводу, что успешной торговле мешает [Select_CString(rival.IsFemale, 'наша соперница', 'наш соперник' )] [rival.GetTitledFirstName]."
 gdp_merchant_scheme_advantage.1000.intro.partner: "Возможно, мой партнёр [portrait.GetTitledFirstName] придумает какое-нибудь дельное решение?"
 gdp_merchant_scheme_advantage.1000.intro.agent: "Возможно, [Select_CString(portrait.IsFemale, 'моя помощница', 'мой помощник' )] [portrait.GetTitledFirstName] придумает какое-нибудь дельное решение?"
 gdp_merchant_scheme_advantage.1000.intro.trader: "Возможно, мой приказчик [portrait.GetTitledFirstName] придумает какое-нибудь дельное решение?"
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nЕсли [portrait.GetTitledFirstNameNoTooltip] наконец перестанет заниматься ерундой и всерьёз возьмётся за работу, то мы в два счёта решим все наши проблемы…"
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nЕсли все сотрудники компании начнут работать сообща и приложат необходимые усилия, то мы в два счёта решим все наши проблемы…"
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nВозможно, ради блага компании мне стоит [Select_CString(ROOT.Char.IsFemale, 'самой', 'самому' )] засучить рукава и взяться за работу, чтобы наконец сдвинуть дело с мёртвой точки…"
 gdp_merchant_scheme_advantage.1000.a: "«[portrait.GetTitledFirstNameNoTooltip], за что я тебе плачу?»"
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.GetTitledFirstNameNoTooltip] [Select_CString(portrait.IsFemale, 'нагружена', 'нагружен' )] работой"
 gdp_merchant_scheme_advantage.1000.b: "«Нам всем пора заняться делом!»"
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] [Concept('company', 'Компания')|E] нагружена работой"
 gdp_merchant_scheme_advantage.1000.c: "«Придётся всё делать [Select_CString(ROOT.Char.IsFemale, 'самой', 'самому' )]!»"
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] Вы нагружены работой"
 gdp_merchant_scheme_advantage.1000.d.associate: "«[portrait.GetFirstNameNoTooltip] [Select_CString(portrait.IsFemale, 'могла', 'мог' )] бы стараться и побольше»."
 gdp_merchant_scheme_advantage.1000.d.unity: "«Это не компания, а сборище бездельников!»"
 gdp_merchant_scheme_advantage.1000.d.stress: "«Придётся немного попотеть…»"
 gdp_merchant_scheme_advantage.1000.e: "«Ладно, забудем об этом…»"
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName] и я каждый день обсуждаем, как нам лучше всего добиться поставленных целей. При этом мой приказчик постоянно сетует на нехватку рабочей силы во владении [task_contract_location.GetBaronyNameExplicitly].\n\n«Знаешь, — вздыхает [Select_CString(trader.IsFemale, 'она', 'он' )], — есть [Select_CString(recruit.IsFemale, 'одна женщина', 'один мужчина' )], [Select_CString(recruit.IsFemale, 'которая', 'который' )] может нам помочь»."
 gdp_merchant_scheme_advantage.1010.desc.liege: "«[Select_CString(recruit.IsFemale, 'Её', 'Его' )] зовут [recruit.GetFirstName]. [Select_CString(recruit.IsFemale, 'Она', 'Он' )] трудится на службе у человека по имени [recruit_liege.GetTitledFirstName] из компании [recruit_liege.GetPrimaryTitle.GetDefinitiveName]…»"
 gdp_merchant_scheme_advantage.1010.desc.recruit: "«[Select_CString(recruit.IsFemale, 'Её', 'Его' )] зовут [recruit.GetFirstName]. [Select_CString(recruit.IsFemale, 'Она', 'Он' )] работает [Select_CString(recruit.IsFemale, 'представительницей и посредницей', 'представителем и посредником' )] на местном рынке…»"
 gdp_merchant_scheme_advantage.1010.a: "«Я хочу с [Select_CString(recruit.IsFemale, 'ней', 'ним' )] поговорить…»"
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! Вы полагаетесь на своё очарование"
 gdp_merchant_scheme_advantage.1010.b: "«Приведи [Select_CString(recruit.IsFemale, 'её', 'его' )] ко мне, чего бы это ни стоило»."
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! Вы полагаетесь на своё богатство"
 gdp_merchant_scheme_advantage.1010.e: "«Едва ли от [Select_CString(recruit.IsFemale, 'неё', 'него' )] будет какая-то польза»."
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName] и я каждый день обсуждаем, как нам лучше всего добиться поставленных целей. В какой-то момент мой приказчик подмечает, что [charter.GetName|l] может открыть перед нами новые возможности во владении [task_contract_location.GetBaronyNameExplicitly].\n\n«В конце концов, — улыбаясь говорит [trader.GetFirstNameNoTooltip], — [patron.GetTitledFirstName] ведь не зря [Select_CString(patron.IsFemale, 'предоставила', 'предоставил' )] нам этот документ. Почему бы им не воспользоваться?»"
 gdp_merchant_scheme_advantage.1020.a: "«Точно! [patron.GetTitleAsNameNoTooltip] наверняка бы [Select_CString(patron.IsFemale, 'поддержала', 'поддержал' )] такое решение»."
 gdp_merchant_scheme_advantage.1020.b: "«Наша хартия и вправду говорит за себя»."
 gdp_merchant_scheme_advantage.1020.e: "«Сейчас не время для этого…»"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "Добиться преимуществ: потенциал"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "Попытка ускорить эти происки провалилась и привела лишь к замедлению прогресса."
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "Добиться преимуществ: расширение сети"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "Добиться преимуществ: фаза"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "Добиться преимуществ: конкурентоспособность"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "Попытка ускорить эти происки провалилась и привела лишь к сокращению торговли."
 gdp_merchant_scheme_advantage_outcome: "Добиться преимуществ"
 gdp_merchant_scheme_advantage.desc: "попытка получить дополнительные [Concept('opportunity', 'возможности')|E] для [Concept('scheme', 'происков')|E]"
 gdp_merchant_scheme_advantage_add_1_opportunity_tt: "[Concept('scheme', 'Происки')|E] получают #P 1#! [scheme_opportunity_i|E][Concept('scheme_opportunity_opportunity', 'возможность')|E]"
 gdp_merchant_scheme_advantage_add_2_opportunities_tt: "[Concept('scheme', 'Происки')|E] получают #P 2#! [scheme_opportunity_i|E][Concept('scheme_opportunity_opportunity', 'возможности')|E]"
 gdp_merchant_scheme_advantage_subtract_opportunity_tt: "[Concept('scheme', 'Происки')|E] теряют #P 1#! [scheme_opportunity_i|E][Concept('scheme_opportunity_opportunity', 'возможность')|E]"
 house_relation_reason_scheme_push_for_advantage_desc: "[char.GetShortUINameNotMe|U] [Select_CString(char.IsFemale, 'добивалась', 'добивался')] торговых преимуществ в ущерб персонажу [target_char.GetShortUINameNotMe]"
