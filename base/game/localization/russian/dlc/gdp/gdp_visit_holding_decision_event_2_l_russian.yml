l_russian:
 gdp_visit_holding_decision_event.1200.t: "Визит покровителя"
 gdp_visit_holding_decision_event.1200.intro_desc: "[ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|U] [ROOT.Char.GetCurrentLocation.GetName] с первого взгляда поражает меня роскошью. Со всех сторон меня окружают бесценные артефакты и узоры: гобелены из [patron.Custom('RegionalFabric')], статуи и резная мебель. Где-то готовится [patron.Custom('GetExpensiveMeal')] и наполняет ароматом всё помещение.\n\nВ толчее мельтешащих слуг"
 gdp_visit_holding_decision_event.1200.all_available_desc: "моё внимание привлекает [steward.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(steward.IsFemale, 'объявляющая', 'объявляющий')] о моём прибытии. [patron.Custom2('MyCharacterIntroduction', ROOT.Char)|U] стоит неподалёку. Мне нужно привести себя в порядок и озвучить своё предложение."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "моё внимание привлекает [patron.Custom2('MyCharacterIntroduction', ROOT.Char)], жестом [Select_CString(patron.IsFemale, 'приглашающая', 'приглашающий')] подойти ближе. Похоже, основное внимание будет уделено мне. Мне нужно привести себя в порядок и озвучить своё предложение."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "моё внимание привлекает [steward.Custom2('MyCharacterIntroduction', ROOT.Char)], жестом [Select_CString(steward.IsFemale, 'приглашающая', 'приглашающий')] подойти ближе, тогда как [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] попросту отсутствует. Видимо, на меня у [Select_CString(patron.IsFemale, 'неё', 'него')] нет времени. Мне нужно привести себя в порядок и озвучить своё предложение."
 gdp_visit_holding_decision_event.1200.representative_desc: "моё внимание привлекает [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(negotiator.IsFemale, 'ожидающая', 'ожидающий')] встречи со мной. [patron.GetTitledFirstNameNoTooltip], как мне сказали, [Select_CString(patron.IsFemale, 'занята', 'занят')] и не может уделить мне время. Мне нужно привести себя в порядок и озвучить своё предложение."
 gdp_visit_holding_decision_event.1200.none_available_desc: "я безуспешно пытаюсь высмотреть, где стоит [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] или ещё кто-нибудь, к кому можно было бы обратиться, но всё напрасно. Видимо, нужно было договариваться о встрече."
 gdp_visit_holding_decision_event.1200.a: "Я хочу укрепить контроль над [ROOT.Char.GetCurrentLocation.GetCulture.GetCollectiveNounNoTooltip|l]ими рынками."
 gdp_visit_holding_decision_event.1200.a.tt: "Ваше предложение может открыть следующую возможность:$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "Я поищу возможные вложения."
 gdp_visit_holding_decision_event.1200.b.tt: "Поиск возможных вложений может открыть следующие возможности:$gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.c: "Хотя, если подумать…"
 gdp_visit_holding_decision_event.1200.c.tt: "Вернуться и посмотреть, что может предложить [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "[negotiator.GetTitledFirstNameNoTooltip] оказывается под впечатлением от моего списка помощников"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "Названные мной имена ничего не значат"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "Мои слова воспринимают как оскорбление"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "[negotiator.GetTitledFirstNameNoTooltip] соглашается со мной ввиду моих организаторских навыков"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "Мои доводы неубедительны"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "В моих записях находят следы растрат"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "[negotiator.GetTitledFirstNameNoTooltip] поддаётся на увещевания"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip] не верит мне"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip] воспринимает мою ложь как оскорбление"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.GetTitledFirstNameNoTooltip] под впечатлением от моих познаний"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "[negotiator.GetTitledFirstNameNoTooltip] успевает заскучать от моих рассуждение об экономической теории"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "Из-за меня [negotiator.GetTitledFirstNameNoTooltip] чувствует себя [Select_CString(negotiator.IsFemale, 'идиоткой', 'идиотом')]"
 gdp_visit_holding_decision_event.1200.a_martial.success: "[negotiator.GetTitledFirstNameNoTooltip] восхищается моими познаниями в военной логистике"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "Мои слова воспринимают как притязания"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "Мои примеры звучат как угрозы"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.GetTitledFirstNameNoTooltip] под впечатлением от моей силы"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip] зевает"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip] ошибочно принимает демонстрацию силы за угрозу"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "Недавно вы уже запрашивали торговые привилегии. [patron.GetShortUIName] сможет снова принять вас после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "Недавно вы уже обменивали золото на престиж. [patron.GetShortUIName] сможет снова принять вас после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: конкурентный рынок"
 gdp_visit_holding_decision_event.1201.all_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] дружелюбным жестом приглашает меня подойти ближе. Прежде чем приблизиться, я лихорадочно в последний раз перебираю в уме своё предложение. Для торговой компании [ROOT.Char.GetHouse.GetName] жизненно необходимо, чтобы эта сделка состоялась.\n\n Я подхожу, и [patron.GetFirstName] бросает на меня взгляд, полный ощущения собственного превосходства.\n\n «Чётко озвучьте своё предложение, и я, возможно, проявлю снисхождение и рассмотрю его…»"
 gdp_visit_holding_decision_event.1201.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)|U] грозным жестом приглашает меня подойти ближе. Прежде чем приблизиться, я лихорадочно в последний раз перебираю в уме своё предложение. Для торговой компании [ROOT.Char.GetHouse.GetName] жизненно необходимо, чтобы эта сделка состоялась.\n\n Я подхожу, и [patron.GetFirstName] бросает на меня взгляд, полный ощущения собственного превосходства.\n\n «Чётко озвучьте своё предложение, и я, возможно, проявлю снисхождение и рассмотрю его…»"
 gdp_visit_holding_decision_event.1201.steward_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] дружелюбным жестом приглашает меня подойти ближе. Прежде чем приблизиться, я лихорадочно в последний раз перебираю в уме своё предложение. Для торговой компании [ROOT.Char.GetHouse.GetName] жизненно необходимо, чтобы эта сделка состоялась.\n\n «Чётко озвучьте своё предложение, и я оценю, отвечает ли оно интересам [Select_CString(patron.IsFemale, 'госпожи', 'господина')]…»"
 gdp_visit_holding_decision_event.1201.representative_desc: "[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] дружелюбным жестом приглашает меня подойти ближе. Прежде чем приблизиться, я лихорадочно в последний раз перебираю в уме своё предложение. Для торговой компании [ROOT.Char.GetHouse.GetName] жизненно необходимо, чтобы эта сделка состоялась.\n\n «Чётко озвучьте своё предложение, и я оценю, отвечает ли оно интересам [Select_CString(patron.IsFemale, 'госпожи', 'господина')]…»"
 gdp_visit_holding_decision_event.1201.a: "«Позвольте, я подробно распишу предлагаемый контракт…»"
 gdp_visit_holding_decision_event.1201.b: "«Вы человек своего слова, не так ли?»"
 gdp_visit_holding_decision_event.1201.c: "Забудьте."
 gdp_visit_holding_decision_event.1201.c.tt: "Вернуться на аудиенцию и рассмотреть другие возможные предложения"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: предложенные вложения"
 gdp_visit_holding_decision_event.1202.all_available_desc: "Я неподвижно стою, пока [patron.GetFirstName] читает моё предложение. [Select_CString(patron.IsFemale, 'Её', 'Его')] брови слегка нахмуриваются, и [Select_CString(patron.IsFemale, 'она', 'он')] отрывает взгляд от бумаг.\n\n«Так… Понятно. Думаю, что могу выступить поручителем за вас и компанию [ROOT.Char.GetHouse.GetName] на эту сумму. Этого должно хватить, чтобы вы могли приобрести определённый вес, не так ли, [ROOT.Char.GetFirstNameNoTooltip]?»"
 gdp_visit_holding_decision_event.1202.patron_available_desc: "Судя по [negotiator.Custom('ComplimentAdjective')]ому выражению лица, [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] проявляет немалый интерес, выслушивая моё предложение.\n\n«Этого хватит, чтобы придать вам определённый вес, [ROOT.Char.GetFirstNameNoTooltip]»."
 gdp_visit_holding_decision_event.1202.steward_available_desc: "Я терпеливо жду, пока [steward.GetFirstName] читает моё предложение. Явно заинтересовавшись прочитанным, [Select_CString(steward.IsFemale, 'она', 'он')] переводит взгляд на меня.\n\n«Отдам вам должное, это предложение хорошо составлено… Думаю, что могу поручиться за вас и компанию [ROOT.Char.GetHouse.GetName] перед [Select_CString(patron.IsFemale, 'госпожой', 'господином')]»."
 gdp_visit_holding_decision_event.1202.representative_desc: "Я терпеливо жду, пока [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] читает моё предложение. Явно заинтересовавшись прочитанным, [Select_CString(steward.IsFemale, 'она', 'он')] переводит взгляд на меня.\n\n«Это предложение хорошо составлено. [patron.GetTitledFirstNameNoTooltip] не оставит его без внимания»."
 gdp_visit_holding_decision_event.1202.a: "«Мы могли бы договориться…»"
 gdp_visit_holding_decision_event.1202.b: "«Я принимаю ваше предложение»."
 gdp_visit_holding_decision_event.1202.b.success: "Сделка состоялась!"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName] в ближайшее время не желает вас видеть. Попробуйте снова после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]"
 gdp_caught_stealing.tt: "Недавно вас поймали за кражей в святом месте. Вернуться туда можно не раньше [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]"
 gdp_visit_holding_decision_event.1000.b.tt: "Обращение к вашему [Concept('merchant_patron', 'покровителю')|E] может открыть следующие возможности: $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Требуется присутствие вашего [Concept('merchant_patron', 'покровителя')|E] или [Select_CString(patron.IsFemale, 'её', 'его')] представителя"
 gdp_visit_holding_decision_event.1500.t: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] во владении [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "За время моего отсутствия на площади ничего не изменилось. Посередине всё так же возвышается [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l], и лишь тени от домов сменили положение, следуя за движением солнца."
 gdp_visit_holding_decision_event.1500.desc_returned_02: "Я возвращаюсь на залитую солнцем площадь, где стоит [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]. В ноздри бьёт сильный запах благовоний."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "Покинув окутанную полумраком хижину целителя, я щурюсь на ярком солнце. Впереди возвышается [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l], и я направляюсь туда."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "Выйдя за ворота и вновь оказавшись на площади, где стоит [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l], я ощущаю прилив удивительного спокойствия."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "На выходе из садика я чувствую себя так, будто [Select_CString(ROOT.Char.IsFemale, 'сбросила', 'сбросил' )] тяжёлую ношу. Передо мной возвышается [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l], и я снова оглядываю шумную площадь."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "Покинув дом, где работает [merchant_physician_recruit.GetFirstNameNoTooltip], я медленно бреду по переулкам, пока снова не оказываюсь на площади, на которой находится [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]."
 gdp_visit_holding_decision_event.1500.desc: "Посреди площади возвышается [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]. Вокруг снуют торговцы, подмастерья и [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural|l], однако величественное здание посреди людского моря будто излучает умиротворение и покой.\n\nРядом с храмом виднеются яркие вывески целителей, здесь же расположен садик, где можно в тишине поразмыслить о таинствах [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nУ края площади святоша вещает о важности телесного здоровья. Тем временем в хижине целителя меня дожидается [Select_CString(1500_sickly_minor.IsFemale,'больная', 'больной')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName]. [Select_CString(1500_sickly_minor.IsFemale,'Ее', 'Его')] сопроводили сюда, как мы и условились."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nНа самом краю площади [Select_CString(merchant_physician_recruit.IsFemale, 'какая-то женщина', 'какой-то человек' )] увлечённо рассказывает, как телесное здоровье укрепляет здоровье души. Из толпы крестьян раздаются насмешки, но [Select_CString(merchant_physician_recruit.IsFemale, 'она', 'он' )] стоически продолжает свою проповедь."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nВ хижине целителя меня дожидается [1500_sickly_minor.GetFirstName], [Select_CString(1500_sickly_minor.IsFemale,'моя больная', 'мой больной')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))]. [Select_CString(1500_sickly_minor.IsFemale,'Ее', 'Его')] сопроводили сюда, как мы и договорились со слугой в лагере."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\nОдобрительно кивая, [visiting_partner.GetFirstName] внимательно оглядывает площадь в поисках необычных лавок и других достопримечательностей."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nНа площади меня охватывает странное чувство удовлетворения. Глубоко вздохнув, я обдумываю, куда направиться дальше."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName] выглядит немного [Select_CString(visiting_partner.IsFemale, 'уставшей', 'уставшим' )]. «Я не из тех, кто постоянно жалуется, но… надеюсь, мы здесь закончили, [visiting_partner.Custom2('RelationToMe', ROOT.Char)|l]?» — с надеждой говорит [visiting_partner.GetSheHe]."
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'провела', 'провёл' )] немало времени на площади, где стоит [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l], пора уже и честь знать. С этой мыслью я начинаю искать ближайшую улицу, ведущую в сторону центральной площади."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n[Select_CString(merchant_physician_recruit.IsFemale, 'Сторонница', 'Сторонник' )] здорового образа жизни всё ещё продолжает проповедовать свои взгляды, но похоже, что [Select_CString(merchant_physician_recruit.IsFemale, 'её', 'его' )] речь близится к концу."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nНа площади почему-то особенно много детей. А может, они всегда тут играли? Детвора изобретает всё новые и новые шалости, нередко удивляя или возмущая взрослых.\n\nВпрочем, меня сейчас тревожит лишь [1500_sickly_minor.GetFirstName] и [Select_CString(1500_sickly_minor.IsFemale,'ее', 'его')] здоровье. Я оглядываю площадь, раздумывая, куда отправиться дальше."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\n[visiting_partner.GetFirstName] с любопытством изучает прилавок, заполненный крохотными бутылочками с ядами. На этикетке ближайшего флакона написано «[ROOT.Char.Custom('VenomousCreature')|U]».\n\nОт одной мысли об этом зелье у меня мурашки пробегают по коже. Что ж, куда мы направимся теперь?"
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] дотрагивается до моего плеча и показывает на стражников, которые волокут [Select_CString(ROOT.Char.IsFemale, 'какую-то женщину', 'какого-то мужчину' )] в лохмотьях. [Select_CString(ROOT.Char.IsFemale, 'Та', 'Тот' )] вопит, что скоро настанет конец света.\n\nУдивленно подняв брови, я наблюдаю за этой картиной и одновременно размышляю, куда направиться дальше."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\nПосреди площади [visiting_partner.GetFirstName] протягивает мне какое-то сушеное лакомство.\n\nТщательно пережевывая кусочек, я обдумываю наш следующий шаг."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nВ темном уголке на краю площади какой-то торговец пытается убедить [Select_CString(ROOT.Char.IsFemale, 'знатную даму', 'знатного мужчину' )] в целительных свойствах красного песка.\n\nПоглядывая за их спором, я обдумываю свой следующий шаг."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nВозле прилавка с зеркалами из вулканического стекла [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter|l] вертится и так и сяк, с трудом сдерживая радость от возможности полюбоваться на себя.\n\n[Select_CString(ROOT.Char.IsFemale, 'Позабавленная', 'Позабавленный' )] этим зрелищем, я размышляю, куда пойти теперь."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nВозле небольшой колоннады примостился торговец книгами. Он зачитывает вслух фрагменты из текста — кажется, это «[ROOT.Char.Custom('RandomReligiousTextName')]». Слушателей вокруг него немного.\n\nНе обращая на него особого внимания, я оглядываю площадь и размышляю, что делать дальше."
 gdp_visit_holding_decision_event.1500.a: "Я хочу получить благословение целителей."
 gdp_visit_holding_decision_event.1500.a_second: "Я вернусь к целителям."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Возможно, [1500_sickly_minor.GetFirstNameNoTooltip] поправится с помощью целителей."
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip] всё ещё ждёт меня."
 gdp_visit_holding_decision_event.1500.a.tt: "Визит к целителям может открыть следующую возможность:$gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "Вы недавно обращались к лекарям. Повторить это действие можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]"
 gdp_visit_holding_decision_event.1500.b: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] выглядит интригующе."
 gdp_visit_holding_decision_event.1500.b_second: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] стоит повторного посещения."
 gdp_visit_holding_decision_event.1500.b.tt: "Посещение места богослужения может открыть следующие возможности:$gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "Вы недавно посещали местный дом поклонения. Повторить это действие можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]"
 gdp_visit_holding_decision_event.1500.c: "Сады выглядят интересно."
 gdp_visit_holding_decision_event.1500.c_second: "Я ещё раз пройдусь по саду."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ Подумать о вере и снизить [Concept('stress', 'стресс')|E]"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ Поискать припасы"
 gdp_visit_holding_decision_event.1500.c.tt: "Визит в сады может открыть следующие возможности:$gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "Вы недавно посещали сады. Повторить это действие можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]"
 gdp_visit_holding_decision_event.1500.d: "Не проповедник ли там стоит?"
 gdp_visit_holding_decision_event.1500.d_second: "Я и [merchant_physician_recruit.GetFirstNameNoTooltip] ещё не закончили."
 gdp_visit_holding_decision_event.1500.d.tt: "Разговор с врачом может открыть следующую возможность:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "Я займусь другими делами."
 gdp_visit_holding_decision_event.1501.intro: "В хижине [Select_CString(merchant_healer_character.IsFemale, 'целительницы', 'целителя' )] царит полумрак. В воздухе витает странный #EMP запах#! — не то чтобы #EMP неприятный#!, но назойливый.\n\n[merchant_healer_character.GetFirstName] стоит за высоким столом, перемешивая какое-то снадобье."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: [Select_CString(merchant_healer_character.IsFemale, 'целительница', 'целитель' )]"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ Мы входим, и [Select_CString(merchant_healer_character.IsFemale, 'женщина', 'мужчина' )] смотрит на нас с сияющей улыбкой.\n\n«Приветствую в моём скромном жилище! Меня зовут [merchant_healer_character.GetFirstNameNoTooltip]. Чем я могу вам помочь?»"
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "[Select_CString(1500_sickly_minor.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))|l] [1500_sickly_minor.GetFirstName], [Select_CString(1500_sickly_minor.IsFemale, 'которой', 'которому' )] нездоровится, заходит в жилище [Select_CString(merchant_healer_character.IsFemale, 'целительницы', 'целителя' )] вместе со мной. [Select_CString(1500_sickly_minor.IsFemale, 'Она', 'Он' )] слабо кашляет, мне приходится нести [Select_CString(1500_sickly_minor.IsFemale, 'её', 'его' )] вниз на руках.\n\n[Select_CString(merchant_healer_character.IsFemale, 'Целительница', 'Целитель' )] [merchant_healer_character.GetFirstName] поднимается со стула, глядя на нас с тревогой: «Вы нуждаетесь в моих услугах?»"
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "Когда мы заходим в хижину [Select_CString(merchant_healer_character.IsFemale, 'целительницы', 'целителя' )], [merchant_healer_character.GetFirstName] проводит процедуру чистки [Select_CString(ROOT.Char.IsFemale, 'пожилой женщине', 'пожилому мужчине' )]. [visiting_partner.GetFirstName] увлечённо наблюдает за их занятием, глаза [Select_CString(visiting_partner.IsFemale, 'её', 'его' )] возбуждённо блестят: «Вот бы и #EMP мне#! попробовать…»\n\nУслышав ваш разговор, [merchant_healer_character.GetFirstNameNoTooltip] поднимает голову: «Ой, я не [Select_CString(merchant_healer_character.IsFemale, 'заметила', 'заметил' )], что вы здесь. Вас что-то беспокоит?»"
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ Заметив меня, [Select_CString(merchant_healer_character.IsFemale, 'она', 'он' )] удивлённо поднимает бровь: «Вы вернулись! И, похоже, [Select_CString(ROOT.Char.IsFemale, 'целой и невредимой', 'целым и невредимым' )]. Чем я могу помочь на этот раз?»"
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName] отдыхает на мягкой подстилке на печи в углу хижины [Select_CString(merchant_healer_character.IsFemale, 'целительницы', 'целителя' )]. Я наклоняюсь, чтобы проверить [Select_CString(1500_sickly_minor.IsFemale, 'её', 'его' )] дыхание, ласково провожу рукой по [Select_CString(1500_sickly_minor.IsFemale, 'её', 'его' )] волосам.\n\n[merchant_healer_character.GetFirstName] откладывает письменные принадлежности и строго смотрит на меня: «Так о чём был наш уговор?»"
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "Мы снова заходим к [Select_CString(merchant_healer_character.IsFemale, 'целительнице', 'целителю' )] домой. [merchant_healer_character.GetFirstName] перебирает свои травы. Услышав, как мы спускаемся по лестнице, [Select_CString(merchant_healer_character.IsFemale, 'она', 'он' )] поднимает голову: «Что, передумали?»\n\n[visiting_partner.GetFirstNameNoTooltip] переминается с ноги на ногу, [Select_CString(visiting_partner.IsFemale, 'ей', 'ему' )] всё ещё хочется попробовать выполнить процедуру, которую [merchant_healer_character.GetFirstNameNoTooltip] [Select_CString(merchant_healer_character.IsFemale, 'совершала', 'совершал' )] в прошлый раз…"
 gdp_visit_holding_decision_event.1501.desc_returned_01: "Когда я спускаюсь по лестнице в хижину, [merchant_healer_character.GetFirstName] [Select_CString(merchant_healer_character.IsFemale, 'занята', 'занят' )] другим пациентом. Заметив меня, [Select_CString(merchant_healer_character.IsFemale, 'она', 'он' )] велит посетителю пересесть на кровать в глубине комнаты.\n\nЗатем [Select_CString(merchant_healer_character.IsFemale, 'она', 'он' )] задёргивает занавеску из старой простыни: теперь мы можем беседовать наедине, не беспокоя больного.\n\n«Вы вернулись, — спокойно говорит [merchant_healer_character.GetFirstNameNoTooltip]. — Значит, вам всё же нужна моя помощь?»"
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Я снова спускаюсь в полумрак хижины [Select_CString(merchant_healer_character.IsFemale, 'целительницы', 'целителя' )]. [merchant_healer_character.GetFirstName] сидит в глубине помещения, листая какой-то потрёпанный дневник. Издалека не разглядеть, но похоже, что его страницы покрыты изображениями человеческого тела.\n\n[Select_CString(merchant_healer_character.IsFemale, 'Целительница', 'Целитель' )] осторожно закрывает дневник, откладывает его в сторону и смотрит на меня. «Вы снова здесь. Вас всё-таки что-то беспокоит?» — спокойно интересуется [Select_CString(merchant_healer_character.IsFemale, 'она', 'он' )]."
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nУголком глаза я замечаю кучку медицинских приспособлений, среди которых выделяется великолепный рог."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nВ глубине комнаты среди медицинских приспособлений по-прежнему лежит [1500_health_artifact.GetName]."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nВ глубине комнаты виднеется полка с медицинскими приспособлениями, а на ней лежит [1500_health_artifact.GetName]. «Как интересно…» — размышляю я."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nВ глубине комнаты по-прежнему виднеется [1500_health_artifact.GetName]."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "«Меня скорее интересует [1500_health_artifact.GetNameNoTooltip]»."
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "«[1500_sickly_minor.GetFirstNameNoTooltip], [Select_CString(1500_sickly_minor.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))]… [Select_CString(1500_sickly_minor.IsFemale, 'ей', 'ему' )] нужен врач!»"
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Неудачное лечение"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "Лечение не удалось"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "Успешное лечение"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "Когда мы возвращаемся в священные стены, там как раз закончилась проповедь. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] быстро пустеет, [Select_CString(merchant_clergy_character.IsFemale, 'сестра', 'брат' )] [merchant_clergy_character.GetFirstName], вооружившись метлой, убирает грязь и мусор, торопясь подготовить святое место для новых посетителей, нуждающихся в молитве и утешении.\n\n[Select_CString(merchant_clergy_character.IsFemale, 'Она', 'Он' )] встречает меня лёгкой улыбкой: «Добро пожаловать в дом [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]. Не хочешь задержаться и осмотреть наш скромный храм?»"
 gdp_visit_holding_decision_event.1503.desc_returned_02: "Когда я снова возвращаюсь в храм, [Select_CString(merchant_clergy_character.IsFemale, 'сестра', 'брат' )] [merchant_clergy_character.GetFirstName] сидит на скамье перед кафедрой. Кажется, [Select_CString(merchant_clergy_character.IsFemale, 'она', 'он' )] [Select_CString(merchant_clergy_character.IsFemale, 'погружена', 'погружён' )] в молитву.\n\nУслышав шаги, [Select_CString(merchant_clergy_character.IsFemale, 'она', 'он' )] оборачивается в мою сторону: «Должно быть, ты [Select_CString(ROOT.Char.IsFemale, 'устала', 'устал' )], дитя моё. Прошу, дай немного отдыха своим ногам. Чем я могу помочь?»"
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "Миновав высокие двери, я вижу, что [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] почти пустует — на сегодня священнослужители уже закончили со своими делами.\n\nПройдя вглубь центрального зала, я внезапно вижу знакомое лицо — [Select_CString(merchant_clergy_character.IsFemale, 'та', 'тот' )] [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l], [Select_CString(merchant_clergy_character .IsFemale, 'сестра', 'брат' )] [merchant_clergy_character.GetFirstName]. [Select_CString(merchant_clergy_character.IsFemale, 'Она', 'Он' )] подходит ко мне с непроницаемым лицом: «Заблудшее дитя, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] вновь приводит тебя к нашему порогу!»"
 gdp_visit_holding_decision_event.1503.desc: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] поражает воображение. Вступив во врата священного здания, я застываю от восторга, любуясь его роскошным убранством и изящными линиями.\n\nЗаметив моё присутствие, ко мне подходит [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]. «Приветствую тебя, дитя моё, — степенно говорит [Select_CString(merchant_clergy_character.IsFemale, 'она', 'он' )]. — Я [Select_CString(merchant_clergy_character.IsFemale, 'сестра', 'брат' )] [merchant_clergy_character.GetFirstName]. Чем я могу тебе помочь?»"
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "#EMP Наверное#!…"
 gdp_visit_holding_decision_event.1503.b: "«Возможно, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] благословит нашу компанию?»"
 gdp_visit_holding_decision_event.1503.c: "#EMP Мне#! эти пожертвования явно нужнее, чем им."
 gdp_visit_holding_decision_event.1503.c_guarded: "Ещё одно пожертвование, в #EMP мой#! карман."
 gdp_visit_holding_decision_event.1503.c_master_thief: "«Тс-с, [visiting_partner.GetFirstNameNoTooltip]! Смотри в оба!»"
 gdp_visit_holding_decision_event.1503.c.flavor: "Отвлеку их чем-нибудь и стащу немного монет. Делов-то!"
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Хм… Почему-то стража патрулирует эти места чаще, чем остальные…"
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Успешная кража"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "Вам удаётся украсть пожертвования"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "Изгнание!"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "Вас изгоняют из храма"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Священнослужители вызывают стражу"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "Принимая из моих рук пожертвование, [merchant_clergy_character.GetFirstName] внезапно отшатывается. [Select_CString(merchant_clergy_character.IsFemale, 'Её', 'Его' )] глаза буквально вылезают из орбит. «Ты… ты так [Select_CString(ROOT.Char.IsFemale, 'похожа', 'похож' )] на… О [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]!» — потрясённо лепечет [Select_CString(merchant_clergy_character.IsFemale, 'она', 'он' )], не в силах найти нужных слов.\n\nОвладев собой, [merchant_clergy_character.GetFirstNameNoTooltip] выпрямляется во весь рост и торжественно заявляет: «Для меня будет честью отдать #EMP свою#! жизнь ради вас!»"
 gdp_visit_holding_decision_event.1504.desc: "Широко улыбнувшись, [merchant_clergy_character.GetFirstName] склоняется и кладёт руку на моё плечо: «Это очень щедрый дар, дитя моё. Знаю, купцам вроде тебя сложно расстаться с деньгами».\n\nЗадумчиво кивая, [Select_CString(merchant_clergy_character.IsFemale, 'она', 'он' )] убирает руку и выжидающе смотрит мне в глаза."
 gdp_visit_holding_decision_event.1504.a: "«Возможно, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] благословит наши дела?»"
 gdp_visit_holding_decision_event.1504.a_epiphany: "«Мне нужна лишь милость [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]»."
 gdp_visit_holding_decision_event.1504.b: "«Нам #EMP не помешает#! надёжный товарищ»."
 gdp_visit_holding_decision_event.1504.c: "«Единственное, что для меня имеет значение, — это благо ближних моих»."
 gdp_visit_holding_decision_event.1504.c_epiphany: "Мне жаль, сейчас мы не нанимаем."
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: сад"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "В саду, как обычно, царит покой. Редкие посетители негромко беседуют или тихо размышляют о своём, наслаждаясь окружающей природой.\n\nПрислушиваясь к дуновению ветерка в кронах деревьев, я постепенно забываю обо всём на свете."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "В ветвях [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] я замечаю крохотного птенца, готового впервые расправить свои крылья.\n\nЛовко перебравшись через край гнезда, птичка пытается взлететь, однако крылья её путаются, она камнем падает вниз… и тут её заботливо подхватывает порыв ветра. Птенец взмывает в воздух и вольно парит в вышине, и я испытываю удивительное чувство облегчения."
 gdp_visit_holding_decision_event.1505.desc: "Сад окружён живой изгородью, за которой скрываются покрытые деревьями пологие холмики. В листве резвятся белки и редкие птицы.\n\n[Select_CString(ROOT.Char.IsFemale, 'Очарованная', 'Очарованный' )] этой красотой, я ощущаю могущественное присутствие. Неужели благословение [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive] пребывало со мной во всех моих странствиях?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nВпереди [visiting_partner.GetFirstName] снова рассматривает какие-то съедобные растения."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nВпереди по тропинке, в лучах послеполуденного солнца, я вижу ещё больше аппетитных трав и плодов."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nЯ слышу, как за спиной бормочет [visiting_partner.GetFirstName]. [Select_CString(visiting_partner.IsFemale, 'Её', 'Его' )] внимание целиком поглощено малоизвестными съедобными растениями, которые попадаются нам по пути."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nКраем глаза я замечаю съедобные травы и дикорастущие фрукты, благодаря которым сад выглядит ещё краше."
 gdp_visit_holding_decision_event.1505.a: "Как здесь спокойно!"
 gdp_visit_holding_decision_event.1505.a_convert: "Пожалуй, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjectiveNoTooltip|l] — это не так уж плохо."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "Вы предавались размышлениям в саду совсем недавно. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.b: "Жаль будет, если всё это добро пропадёт."
 gdp_visit_holding_decision_event.1505.b_partner: "«[visiting_partner.GetFirstNameNoTooltip], не пора ли пополнить наши запасы?»"
 gdp_visit_holding_decision_event.1505.b_flavor: "Время собирать урожай!"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "Вы собирали плоды в саду совсем недавно. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )]"
 gdp_visit_holding_decision_event.1505.c: "«Так много потайных закоулков, #EMP [visiting_partner.GetFirstNameNoTooltip]#!…»"
 gdp_visit_holding_decision_event.1505.c.flavor: "Просто райский уголок."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "Вы развлекались в этом саду совсем недавно. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )]"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$: врач"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "Дверь в кабинет врача чуть приоткрыта. Через щель я вижу, что [merchant_physician_recruit.GetFirstNameNoTooltip] не [Select_CString(merchant_physician_recruit.IsFemale, 'одна', 'один' )], — сжимая в руках небольшие и невероятно острые ножницы, [Select_CString(merchant_physician_recruit.IsFemale, 'она', 'он' )] склоняется над волосами посетителя, который старается сидеть очень смирно.\n\nТихонько постучав, я захожу внутрь. [merchant_physician_recruit.GetFirstNameNoTooltip] поднимает голову: «Вы так неслышно подкрались… Чего вы хотите?»"
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName] стоит перед домом, осматривая плечо [Select_CString(ROOT.Char.IsFemale, 'какой-то женщины', 'какого-то мужчины' )]. [Select_CString(ROOT.Char.IsFemale, 'Посетительница', 'Посетитель' )] явно страдает от боли.\n\nЗакончив осмотр, [merchant_physician_recruit.GetFirstNameNoTooltip] даёт [Select_CString(ROOT.Char.IsFemale, 'больной', 'больному' )] указания, как лучше лечить повреждённый сустав, а затем поворачивается ко мне: «Снова вы. Чего вы хотите на этот раз?»"
 gdp_visit_holding_decision_event.1507.desc_returned_03: "Тихонько поднявшись по лестнице, ведущей к кабинету врача, я заглядываю в приоткрытую дверь.\n\n[merchant_physician_recruit.GetFirstName] [Select_CString(merchant_physician_recruit.IsFemale, 'занята', 'занят' )] какими-то физическими упражнениями — [Select_CString(merchant_physician_recruit.IsFemale, 'она', 'он' )] ритмично приседает и выпрямляется, затем недолго отдыхает и повторяет странное действие ещё раз. По [Select_CString(merchant_physician_recruit.IsFemale, 'её', 'его' )] лицу стекают капли пота.\n\nПосле нескольких повторений [Select_CString(merchant_physician_recruit.IsFemale, 'она', 'он' )] утирает лоб, делает глоток из бутылки, а затем наконец смотрит на меня: «А вы не сдаётесь, да?»"
 gdp_visit_holding_decision_event.1507_desc_intro: "[merchant_physician_recruit.GetFirstName] шагает вдоль узкой аллеи, поднимается по лестнице и исчезает в своём кабинете. Я неслышно следую за [Select_CString(merchant_physician_recruit.IsFemale, 'ней', 'ним' )]. Комната врача от пола до потолка забита книжными полками, проседающими под тяжестью бесчисленного множества свитков и фолиантов. Все они посвящены здоровью, гуморам и духовности.\n\nРассеянно теребя небольшой амулет, [merchant_physician_recruit.GetFirstNameNoTooltip] садится на единственный в помещении стул, приставленный к столу. Тут [Select_CString(merchant_physician_recruit.IsFemale, 'она', 'он' )] замечает моё присутствие: "
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$«Ой! Кажется, мы уже встречались? Чего вы хотите?»\n\nЯ отвечаю, осторожно выбирая слова:"
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$«Ой! Здравствуйте. Чего вам угодно?»\n\n«Я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )], как ты [Select_CString(merchant_physician_recruit.IsFemale, 'читала', 'читал' )] лекцию тем бедолагам», — начинаю я и после паузы продолжаю:"
 gdp_visit_holding_decision_event.1507.a: "«Хочешь работать на меня?»"
 gdp_visit_holding_decision_event.1507.b: "«Помоги укрепить дух моих помощников!»"
 gdp_visit_holding_decision_event.1507.c: "«Если не #EMP использовать#! умения постоянно, они быстро заржавеют. Присоединяйся к моей компании!»"
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName] [Select_CString(merchant_physician_recruit.IsFemale, 'согласна', 'согласен' )] с вашей мыслью"
 gdp_visit_holding_decision_event.1507.c.failure: "[merchant_physician_recruit.GetShortUIName] явно не [Select_CString(merchant_physician_recruit.IsFemale, 'заинтересована', 'заинтересован' )]"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUIName] поворачивается к вам спиной"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "Вернуться в гильдии и посмотреть, что ещё может предложить [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]"
