 unity_merchant_promote_diligence_decision: "Поддержать усердие"
 unity_merchant_promote_diligence_decision_desc: "Чтобы наша компания закрепилась на рынках, каждый её член должен ставить прибыль выше личного комфорта до тех пор, пока мы не обойдём конкурентов."
 unity_merchant_promote_diligence_decision_tooltip: "Потратить [Concept('prestige', 'престиж')|E] на сдвиг [Concept('company_sentiment', 'направления компании')|E] в сторону [company_sentiment_divided_i][Concept('company_sentiment_divided', 'ненасытности')|E], а также на укрепление [Concept('competitiveness', 'конкурентоспособности')|E] [Concept('company_possessive', 'компании')|E] и развитие навыков членов вашего [Concept('house', 'дома')|E]"
