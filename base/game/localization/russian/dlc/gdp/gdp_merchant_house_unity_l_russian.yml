 unity_merchant_promote_excess_decision_tooltip: "Потратить [Concept('gold', 'золото')|E] на сдвиг [Concept('company_sentiment', 'направления компании')|E] в сторону [company_sentiment_concerted_i][Concept('company_sentiment_concerted', 'благородства')|E] и повышение [Concept('prestige', 'престижа')|E], получаемого членами вашего [Concept('house', 'дома')|E]"
