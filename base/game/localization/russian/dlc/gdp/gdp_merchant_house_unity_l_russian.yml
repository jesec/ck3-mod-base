 merchant_unity_promote_diligence.desc: "[Select_CString(ROOT.Char.IsFemale, 'воспользовалась', 'воспользовался')] своим положением [Concept('house_head', 'главы дома')|E], чтобы призвать членов [Concept('house', 'дома')|E] к усердию в ущерб собственному благополучию"
 merchant_unity_promote_excess.desc: "[Select_CString(ROOT.Char.IsFemale, 'воспользовалась', 'воспользовался')] своим положением [Concept('house_head', 'главы дома')|E], чтобы поддержать излишства среди членов [Concept('house', 'дома')|E] для укрепления репутации компании"
