 gdp_return_trade_envoys_decision: "Отозвать торговых представителей"
 gdp_return_trade_envoys_decision_desc: "Рассредоточение ведёт к слабости. Компании следует обратить внимание на собственные территории. Вместе мы сможем защитить свои драгоценные интересы."
 gdp_return_trade_envoys_decision_tooltip: "Ваши [Concept('traders', 'приказчики')|E] вернутся домой, закончив свои дела на [Concept('trade_routes', 'торговых путях')|E]"
