l_russian:
 merchant_house_unity: "Направление компании"
 rapacious_cs: "Ненасытность"
 rapacious_cs_desc: "#weak Обязанности, налагаемые родством, давно погребены под толщей обид и амбиций. Потребности компании превыше нужд её членов, а во главе угла стоит прибыль.#!"
 opportunistic_cs: "Оппортунизм"
 opportunistic_cs_desc: "#weak Неуправляемая родня недовольна кровной иерархией и ставит личные интересы превыше долга.#!"
 balanced_cs: "Баланс"
 balanced_cs_desc: "#weak Хотя семье требуется формальный лидер, её члены должны обладать возможностью вести свои дела без вмешательства или осуждения.#!"
 grasping_cs: "Скупость"
 grasping_cs_desc: "#weak Репутация компании неотделима от репутации её членов. Чтобы быть ценной частью компании, необходимо работать как над своей репутацией, так и над своим положением в обществе.#!"
 ennobled_cs: "Благородство"
 ennobled_cs_desc: "#weak Благодаря непоколебимой верности, рождённой долгом и уважением, интересы каждого неотделимы от интересов главы. Компанию держат вместе нерушимые семейные узы, и она может стоять наравне со многими благородными семействами.#!"
 house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts: "Члены [Concept('house', 'дома')|E], назначенные [Concept('traders', 'приказчиками')|E], чаще предлагают [Concept('trade_opportunities', 'торговые возможности')|E]"
 house_unity_parameter_unity_risk_of_leaving: "Принятие [Concept('associates', 'помощниками')|E] приглашений ко [Concept('court', 'двору')|E] других [Concept('rulers', 'правителей')|E]: #N +20#!"
 house_unity_parameter_unity_very_high_risk_of_leaving: "Принятие [Concept('associates', 'помощниками')|E] приглашений ко [Concept('court', 'двору')|E] других [Concept('rulers', 'правителей')|E]: #N +50#!"
 house_unity_parameter_unity_deputy_positions_cost_less: "Жалование [Concept('deputy','сотрудника')|E] снижено: #P -50%#!"
 house_unity_parameter_unity_deputy_positions_cost_significantly_less: "Жалованье [Concept('deputy','сотрудника')|E] #EMP значительно#! снижено: #P -85%#!"
 unity_merchant_can_petition_for_noble_standing_tt: "Требуется [Concept('company_sentiment', 'направление компании')|E] «#V #emp $ennobled_cs$#!#!»"
 house_unity_parameter_unity_merchant_can_petition_for_noble_standing: "Можно использовать [Concept('interaction', 'взаимодействие')|E] #V $merchant_procure_estate_interaction$#!, а также вариант #V $merchant_purchase_land_interaction_noble_standing$#! для взаимодействия #V $merchant_purchase_land_interaction$#!"
 unity_merchant_can_request_complete_exploitative_monopolies_tt: "Чтобы попросить о [Concept('complete_monopoly', 'полной')|E] или [Concept('exploitative_monopoly', 'эксплуататорской монополии')|E], компания должна придерживаться [Concept('company_sentiment', 'направления')|E] #V #emp Ненасытность#!#!"
 house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies: "Можно использовать [Concept('interaction', 'взаимодействие')|E] #V $request_trade_monopoly_for_character_interaction$#!, чтобы попросить о [Concept('complete_monopolies', 'полной')|E] или [Concept('exploitative_monopolies', 'эксплуататорской монополии')|E]"
 merchant_steady_hand_low_unity_modifier: "$merchant_house_unity$: твёрдая рука"
 merchant_steady_hand_low_unity_modifier_desc: "Несмотря на раздор в своём доме, этот персонаж уверенно ведёт свою компанию вперёд."
 merchant_house_of_knives_fractious_modifier: "$merchant_house_unity$: дом клинков"
 merchant_house_of_knives_fractious_modifier_desc: "Дом этого персонажа настолько погряз в распрях, что даже невысказанные угрозы имеют вес."
 merchant_house_of_knives_divided_modifier: "$merchant_house_unity$: дом клинков"
 merchant_house_of_knives_divided_modifier_desc: "Дом этого персонажа настолько расколот, что страх остался единственным, что до сих пор объединяет компанию."
 merchant_family_mobilization_promote_diligence_modifier: "$merchant_house_unity$: поддерживает усердие"
 merchant_family_mobilization_promote_diligence_modifier_desc: "Этот персонаж жёсткой рукой направляет дом в сторону более выгодной торговли и эффективной конкуренции."
 unity_regional_networks_decision: "Признать региональные интересы"
 unity_regional_networks_decision_desc: "Члены моего дома яростно отстаивают собственные деловые интересы, но терпимость к внутренней конкуренции пойдёт на пользу компании в целом."
 unity_regional_networks_decision_tooltip: "Позволить членам вашего [Concept('house', 'дома')|E] преследовать свои региональные торговые интересы"
 unity_regional_networks_decision_confirm: "Поощрить свободу торговли"
 unity_family_business_decision: "Формализовать семейный подряд"
 unity_family_business_decision_desc: "Усадьба дома [ROOT.Char.GetHouse.GetName] — сердце нашей торговой сети, и эффективное управление ей является ключом к успеху."
 unity_family_business_decision_tooltip: "Назначьте членов своего [Concept('house', 'дома')|E] управлять [Concept('company', 'компанией')|E] и торговыми сетями"
 unity_family_business_decision_confirm: "Распределить семейные обязанности"
 unity_merchant_prosperity_decision: "Поддержать процветание"
 unity_merchant_prosperity_decision_desc: "Ради собственного благополучия мы должны развивать окрестности владения [ROOT.Char.GetDomicile.GetLocation.GetName], чтобы оно могло поддерживать наши амбиции."
 unity_merchant_prosperity_decision_tooltip: "Поддержать [Concept('prosperity', 'процветание')|E] места, где находится ваша [Concept('company', 'компания')|E]"
 unity_merchant_prosperity_decision_confirm: "Поддержать местное процветание"
 unity_merchant_prosperity_decision_cooldown_tooltip: "[Concept('house', 'Дом')|E] [THIS.Char.GetHouse.GetName] поддерживал процветание в последние #V 10#! лет — Можно использовать повторно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_prosperity_decision_cooldown') )|V]#!"
 unity_required_level_not_met_tooltip: "[THIS.Char.Custom('GetHouseUnityLevelConcept')] не позволяет это сделать"
 unity_merchant_bailiffs_decision: "Поддержать местную власть"
 unity_merchant_bailiffs_decision_desc: "Правители владения [ROOT.Char.GetDomicile.GetLocation.GetName] почти не контролируют эти места. Мы должны вмешаться, чтобы преступники не встали у нас на пути."
 unity_merchant_bailiffs_decision_tooltip: "Укрепить [Concept('county_control', 'контроль над графством')|E], где находится ваша [Concept('company', 'компания')|E]"
 unity_merchant_bailiffs_decision_confirm: "Поддержать контроль на местах"
 unity_merchant_bailiffs_decision_cooldown_tooltip: "[Concept('house', 'Дом')|E] [THIS.Char.GetHouse.GetName] поддерживал контроль в последние #V 10#! лет — Можно использовать повторно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_bailiffs_decision_cooldown') )|V]"
 unity_merchant_bailiffs_decision_control_tooltip: "[THIS.Char.GetDomicile.GetLocation.GetCounty.GetTitle.GetName]: [Concept('county_control', 'контроль над графством')|E] ниже [Concept('control_baseline', 'базового уровня контроля')|E]"
