 merchant_unity_associate_after_company_desc: "[Select_CString(unity_character.IsFemale, 'поставила', 'поставил' )] компанию выше персонажа [unity_target.GetName]"
 merchant_unity_associate_before_company_desc: "[Select_CString(unity_character.IsFemale, 'поставила', 'поставил' )] персонажа [unity_target.GetName] выше компании"
 merchant_unity_associate_unappreciated_desc: "не [Select_CString(unity_character.IsFemale, 'оценила', 'оценил' )] хорошую работу, которую [Select_CString(unity_target.IsFemale, 'проделала', 'проделал' )] [unity_target.GetName]"
 merchant_unity_associate_example_desc: "[Select_CString(unity_character.IsFemale, 'поставила', 'поставил' )] персонажа [unity_target.GetName] в пример компании"
 merchant_unity_strong_leadership_desc: "[Select_CString(unity_character.IsFemale, 'проявила', 'проявил' )] себя как уверенный глава компании"
 merchant_unity_poor_leadership_desc: "[Select_CString(unity_character.IsFemale, 'проявила', 'проявил' )] себя как ненадёжный глава компании"
