l_russian:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]: то, что мы потеряли"
 gdp_guelph_ghibelline_scheme.1000.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'прибыла', 'прибыл' )] во владение [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] в самый разгар ежегодной ярмарки.\n\nНа улицах царит праздничное настроение, отовсюду доносится шум разгульного веселья. Все вокруг носят яркие одеяния, от лотков торговцев доносится восхитительный аромат [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip|l]их блюд — настоящая услада для усталого путника.\n\nВозле соседнего прилавка я замечаю знакомое лицо — это [target.GetTitledFirstName], увлечённо [Select_CString(target.IsFemale, 'рассматривающая', 'рассматривающий' )] разложенные на столе диковинки. Пора пустить в ход всё моё обаяние…"
 gdp_guelph_ghibelline_scheme.1000.a: "«#EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|U]#! только и мечтают о том, чтобы всё это запретить»."
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "Вам удаётся убедить [Select_CString(target.IsFemale, 'собеседницу', 'собеседника' )], что [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l] не принесут ничего хорошего"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName|U] лишь отмахивается от вас"
 gdp_guelph_ghibelline_scheme.1000.b: "«Эта брошь вам очень к лицу, [Select_CString(target.IsFemale, 'дорогая моя', 'друг мой' )]»."
 gdp_guelph_ghibelline_scheme.1000.c: "Я не стану вмешиваться."
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]: слухи разные ходят…"
 gdp_guelph_ghibelline_scheme.1010.desc: "Информаторы сообщают, что [target.GetTitledFirstName], [Select_CString(target.IsFemale, 'наша', 'наш' )] #EMP [Select_CString(target.IsFemale, 'почтенная', 'почтенный' )]#! предводитель [ROOT.Char.Custom('GetGuelphGhibelline')|l]ов, в последнее время сталкивается со множеством проблем и страдает под бременем своих обязанностей.\n\nНесколько своевременных писем нашим сторонникам могут подкрепить этот образ и намекнуть, что это бремя стоит передать кому-то более #EMP достойному#!."
 gdp_guelph_ghibelline_scheme.1010.a: "Немедленно составить письма."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "Шанс успеха зависит от вашей @gg_involvement_icon! [Concept('gg_involvement', 'вовлечённости')|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Ваши письма убеждают множество [ROOT.Char.Custom('GetGuelphsGhibellines_RU_Gen')|l] в ваших выдающихся лидерских качествах"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Ваши письма скорее вредят вашему движениию"
 gdp_guelph_ghibelline_scheme.1010.b: "Из любого представителя дома [ROOT.Char.GetHouse.GetName] получится выдающийся лидер!"
 gdp_guelph_ghibelline_scheme.1010.c: "Откуда мне знать, правда это или нет?"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]: хорошо подвешенный язык"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "Похоже, [target.GetTitledFirstName|U] явно не видит того, что творится у [Select_CString(target.IsFemale, 'неё', 'него' )] перед носом. [Select_CString(court_agent.IsFemale, 'Моя соучастница', 'Мой соучастник' )], [court_agent.GetTitledFirstName], [Select_CString(court_agent.IsFemale, 'связалась', 'связался' )] с группой недовольных вельмож, плетущих козни при [Select_CString(target.IsFemale, 'её', 'его' )] дворе."
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "Похоже, [Select_CString(court_agent.IsFemale, 'моя соучастница', 'мой соучастник' )] [court_agent.GetTitledFirstName] [Select_CString(court_agent.IsFemale, 'нашла', 'нашёл' )] немало благодарных слушателей среди [target.Custom('GetGuelphsGhibellines_RU_Gen')|l], которых не устраивает, что их возглавляет [target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.intro: "Похоже, [target.GetTitledFirstName] и [Select_CString(court_agent.IsFemale, 'моя соучастница', 'мой соучастник' )] [court_agent.GetTitledFirstName] сумели найти общий язык."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\n[court_agent.GetTitledFirstNameNoTooltip|U] уже давно ждёт от меня новых инструкций."
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "Не пора ли воспользоваться их недовольством для осуществления наших планов?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "А не подкрепить ли мне сомнения, что уже вызывает [target.GetFirstNameNoTooltip]?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "Стоит поручить [Select_CString(court_agent.IsFemale, 'ей', 'ему' )] замолвить за нас словечко. [target.GetTitleAsNameNoTooltip|U] [Select_CString(target.IsFemale, 'должна', 'должен' )] понять, что [ROOT.Char.Custom('GetGuelphsGhibellines')|l] действуют в [Select_CString(target.IsFemale, 'её', 'его' )] интересах."
 gdp_guelph_ghibelline_scheme.1020.a: "Лучше я займусь этим лично."
 gdp_guelph_ghibelline_scheme.1020.b: "Эти вероломные мерзавцы дают нам отличную возможность…"
 gdp_guelph_ghibelline_scheme.1020.c: "Пусть [court_agent.GetTitledFirstNameNoTooltip] отрабатывает своё содержание."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName|U] успешно осуществляет ваш замысел"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName|U] действует не слишком эффективно"
 gdp_guelph_ghibelline_scheme.1020.d: "Пусть поработает над моей репутацией."
 gdp_guelph_ghibelline_scheme.1020.prestige: "Запятнанный престиж"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Ваш престиж был слегка запятнан."
 gdp_guelph_ghibelline_scheme.1020.piety: "Запятнанное благочестие"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Ваше благочестие было слегка запятнано."
 gdp_guelph_ghibelline_scheme.1020.e: "Моя вера говорит за себя!"
 gdp_guelph_ghibelline_scheme.1020.f: "Я не стану вмешиваться."
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]: подмазывание"
 gdp_guelph_ghibelline_scheme.1030.desc: "Во время утренней прогулки ко мне подбегает один из слуг, человек проверенный и надёжный:\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleAsNameNoTooltip|l], пришла весточка от наших информаторов. Они говорят, что [target.GetTitledFirstName] не пользуется большим авторитетом, а [Select_CString(target.IsFemale, 'её', 'его' )] [ROOT.Char.Custom('DescribeTargetSkill')] — притча во языцех среди придворных.\n\nБыть может, мы сумеем использовать это в своих интересах?..»"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "Во время утренней прогулки ко мне незаметно приближается [Select_CString(sly_character.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', sly_character )], [sly_character.GetTitledFirstName]:\n\n«[target.GetPrimaryTitle.GetDefinitiveName] под угрозой, и имя этой угрозе — [target.Custom('GetGuelphsGhibellines')|l]. Но пока у власти находится [target.GetTitledFirstName], мы не сможем #EMP спасти#! страну от этих безумцев.\n\nГоворят, что [Select_CString(target.IsFemale, 'её', 'его' )] [ROOT.Char.Custom('DescribeTargetSkill')] — давно уже притча во языцех среди придворных. Почему бы нам публично не усомниться в [Select_CString(target.IsFemale, 'её', 'его' )] достоинствах?»"
 gdp_guelph_ghibelline_scheme.1030.a: "«Мы должны действовать, а не распускать слухи»."
 gdp_guelph_ghibelline_scheme.1030.a.tt: "Шанс успеха зависит от вашей @gg_involvement_icon! [Concept('gg_involvement', 'вовлечённости')|E] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "[target.GetShortUIName|U] [Select_CString(target.IsFemale, 'унижена', 'унижен' )] в глазах собственных придворных"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Ваши усилия напрасны"
 gdp_guelph_ghibelline_scheme.1030.b: "«Воспользуемся этим, чтобы подорвать [Select_CString(target.IsFemale, 'её', 'его' )] положение при дворе»."
 gdp_guelph_ghibelline_scheme.1030.c: "«Надо подлить масла в огонь этих слухов»."
 gdp_guelph_ghibelline_scheme.1030.d: "«Не думаю, что нам стоит этим заниматься»."
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.1262.desc: "Какое счастье! [target.GetTitledFirstName|U] наконец-то раскрывает глаза и поддерживает нас как истинный [owner.Custom('GetGuelphGhibelline')|l].\n\nВсё это время во мне не иссякала уверенность, что [Select_CString(target.IsFemale, 'она', 'он' )] изменит своё мнение."
 scheme_critical_moments.1262.a: "Превосходно!"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.1263.desc: "#EMP Бывают же люди!#!К нашему общему разочарованию, [target.GetTitledFirstName] категорически отвергает все мои соображения и доводы и настаивает на том, что [target.Custom('GetGuelphsGhibellines')|l] правы.\n\nСтоит ли упоминать, что в этот раз мы расстались вовсе #EMP не#! на дружеской ноте?"
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')]#!!"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.1272.desc: "Можно начинать праздновать! [target.GetTitledFirstName] теряет поддержку всё большего числа [owner.Custom('GetGuelphsGhibellines_RU_Gen')|l], которые ищут совета у меня.\n\nУ [Select_CString(target.IsFemale, 'неё', 'него' )] нет иного выбора, кроме как отступиться."
 scheme_critical_moments.1272.a: "Чудесно!"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.1273.desc: "Несмотря на все наши усилия, [target.GetTitledFirstName] остаётся неоспоримым лидером [owner.Custom('GetGuelphsGhibellines_RU_Gen')|l], а имевшаяся у меня поддержка постепенно иссякла."
 scheme_critical_moments.1273.desc.secret: "\n\nХорошо ещё, что [Select_CString(target.IsFemale, 'она', 'он' )] ничего не знает о моих планах."
 scheme_critical_moments.1273.desc.discovered: "\n\nЧто ещё хуже, [Select_CString(target.IsFemale, 'она', 'он' )] знает о моих махинациях и вряд ли забудет о них."
 scheme_critical_moments.1273.a: "Прискорбно…"
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.1282.desc: "Какое счастье! [target.GetTitledFirstName|U] наконец-то раскрывает глаза и поддерживает нас как истинный [owner.Custom('GetGuelphGhibelline')|l].\n\nВсё это время во мне не иссякала уверенность, что [Select_CString(target.IsFemale, 'она', 'он' )] изменит своё мнение."
 scheme_critical_moments.1282.a: "Превосходно!"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.1283.desc: "#EMP Бывают же люди!#!К нашему общему разочарованию, [target.GetTitledFirstName] категорически отвергает все мои соображения и доводы и настаивает на том, что [target.Custom('GetGuelphsGhibellines')|l] правы.\n\nСтоит ли упоминать, что в этот раз мы расстались вовсе #EMP не#! на дружеской ноте?"
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')]#!!"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.1292.desc.intro: "Отличные новости! [target.GetTitledFirstName|U] остаётся не у дел, и на смену приходит [Select_CString(target_character.IsFemale, 'безобидная', 'безобидный' )] [target_character.GetTitledFirstName]!"
 scheme_critical_moments.1292.desc.intro.unknown: "Отличные новости! [target.GetTitledFirstName|U] остаётся не у дел, и на смену приходит один из наших преданных сторонников!"
 scheme_critical_moments.1292.desc: "\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')] могут собой гордиться! Теперь мы можем быть уверены, что [target.GetPrimaryTitle.GetDefinitiveName] будет управляться грамотно и справедливо."
 scheme_critical_moments.1292.desc.discovered: "\n\nОднако моё вмешательство не прошло незамеченным, так что с этого момента стоит быть начеку…"
 scheme_critical_moments.1292.a: "Совершенно верно!"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.1293.desc: "Как говорится, гладко было на бумаге…\n\n#EMP Кто-то спутал нам все планы.#!Конечно, я найду виновника, но сделанного не вернёшь: [target.GetTitledFirstName] ускользает от нас. [target.Custom('GetGuelphGhibelline')] задержатся у власти, но [target.GetPrimaryTitle.GetDefinitiveName] недолго будет страдать от их безумств!"
 scheme_critical_moments.1293.a: "#EMP Проклятье#!!"
