l_russian:
 gdp_carnival_prosperity_modifier: "Карнавальное процветание"
 gdp_carnival_prosperity_modifier_desc: "Эта провинция процветает после успешного карнавала."
 gdp_civic_commitment_modifier: "Поддержка граждан"
 gdp_civic_commitment_modifier_desc: "Этот персонаж посвятил себя улучшению жизни в своей республике."
 gdp_down_to_earth_ruler_modifier: "Приземлённый правитель"
 gdp_down_to_earth_ruler_modifier_desc: "Граждане считают этого персонажа отзывчивым и честным."
 gdp_self_aggrandizing_decorations_modifier: "Декорации для самопревозношения"
 gdp_self_aggrandizing_decorations_modifier_desc: "Этот персонаж воздвиг монументы собственной славе."
 gdp_masked_face_modifier: "Лицо под маской"
 gdp_masked_face_modifier_desc: "На время карнавала этот персонаж скрывает свое лицо под великолепной маской."
 gdp_masked_vigile_modifier: "Бдительность под маской"
 gdp_masked_vigile_modifier_desc: "Этот персонаж воспользовался маской, чтобы шнырять в тенях во время карнавала."
 gdp_order_and_business_modifier: "Порядок и дело"
 gdp_order_and_business_modifier_desc: "Этот персонаж занимается делами и поддерживает порядок."
 gdp_echos_of_carnival_modifier: "Атмосфера карнавала"
 gdp_echos_of_carnival_modifier_desc: "Этот персонаж поддерживает атмосферу карнавала."
 gdp_carnival_basic_celebration_modifier: "Народное развлечение"
 gdp_carnival_basic_celebration_modifier_desc: "Народ удалось развлечь во время карнавала."
 gdp_carnival_extensive_celebration_modifier: "Вдохновлённый народ"
 gdp_carnival_extensive_celebration_modifier_desc: "Карнавал вдохновил народ исполнять свой гражданский долг."
 gdp_carnival_extravagant_celebration_modifier: "Почтительный народ"
 gdp_carnival_extravagant_celebration_modifier_desc: "Народ проникся почтением по отношению к своей республике."
 gdp_masked_paranoia_modifier: "Паранойя под маской"
 gdp_masked_paranoia_modifier_desc: "Этот персонаж столкнулся с убийцами и сумел спастись. Но они всё ещё где-то скрываются."
 gdp_terrifying_procession_modifier: "Ужасающая процессия"
 gdp_terrifying_procession_modifier_desc: "Этот персонаж организовал ужасающую процессию, чтобы напомнить всем — с ним шутки плохи."
 gdp_pious_procession_modifier: "Благочестивая процессия"
 gdp_pious_procession_modifier_desc: "Этот персонаж организовал процессию, чтобы напомнить всем о своём благочестии."
