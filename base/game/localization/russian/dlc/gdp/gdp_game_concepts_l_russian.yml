l_russian:
 # Trade
 game_concept_trade: "Торговля"
 game_concept_trade_desc: "[republics|E], [trade_leagues|El] и [merchants|El] существуют за счет торговли.\n\n[trade_routes|E] отвечают за импорт и экспорт [Concept('goods','товаров')|E] между [Concept('trade_markets','рынками')|E], а [needs|El] и [surpluses|El] определяются [Concept('buildings','зданиями')|E] в [Concept('baronies','баронствах')|E], относящихся к рынку.\n\nВ свою очередь, цена продажи зависит от [Concept('prosperity','процветания')|E] владения, и персонажи, участвующие в торговле, используют [competitiveness|El] и [monopolies|El], чтобы добиться господства на рынках. Чтобы увеличить свою прибыль, участник торговли на рынке, должен пытаться увеличить [Concept('capacity','потенциал')|E] и длину своих путей, а также количество рынков и товаров на пути.\n\nВсе [Concept('government_forms','формы правления')|E], кроме [Concept('adventurers','авантюристов')|E] и [Concept('nomads', 'кочевников')|E], могут вести торговлю."
 game_concept_trade_good: "Товар"
 game_concept_trade_goods: "Товары"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "Товара"
 game_concept_trade_goods_possessive: "Товаров"
 game_concept_good: "Товар"
 game_concept_goods: "Товары"
 game_concept_basic_trade_good: "Базовый товар"
 game_concept_basic_trade_goods: "Базовые товары"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$ — [Concept('trade_goods', 'товары')|E], которые можно перемещать по [Concept('distribution_route', 'раздаточному пути')|E].\n\nВ свою очередь, по [Concept('profit_route', 'прибыльным')|E] и [Concept('commission_route', 'заказным')|E] маршрутам можно перемещать какие угодно товары."
 game_concept_market_toll: "Рыночный сбор"
 game_concept_market_tolls: "Рыночные сборы"
 game_concept_toll: "Пошлина"
 game_concept_tolls: "Пошлины"
 game_concept_market_toll_desc: "$game_concept_market_tolls$ — сборы, взимаемые с каждой сделки по продаже товара на [Concept('trade_market', 'рынке')|E].\n\nИх устанавливает [Concept('market_owner', 'владелец рынка')|E], который и получает все сборы.\n\nРынки с невысокими пошлинами приносят [Concept('merchants', 'купцам')|E] больше прибыли.\n\nРынки с высокими пошлинами увеличивают [Concept('income', 'доход')|E] владельца, но торгующие на таких рынках купцы получают меньше прибыли за продажу товаров, поступающих на рынок по [Concept('profit_route', 'прибыльным маршрутам')|E]. Если пошлины окажутся слишком высокими, купцы могут перейти на другой рынок, где их прибыль будет больше.\n\n[Concept('market_owner', 'Владелец рынка')|E], его [Concept('direct_vassals', 'прямые вассалы')|E], [Concept('tributaries', 'данники')|E] и [Concept('clients', 'клиенты')|E] освобождаются от оплаты пошлин."
 game_concept_good_possessive: "Товара"
 game_concept_goods_possessive: "Товаров"
 game_concept_trade_good_desc: "Товар можно покупать и продавать на [Concept('market','рынке')|E]. По всему миру идет торговля разными товарами, чтобы удовлетворить [Concept('needs','потребности')|E] [Concept('realms','держав')|E]."
 game_concept_trade_category: "Категория товаров"
 game_concept_trade_categories: "Категории товаров"
 game_concept_trade_category_short: "Категория"
 game_concept_trade_categories_short: "Категории"
 game_concept_trade_category_desc: "Категориями называются группы [Concept('trade_goods','товаров')|E]. [trade_markets|E] часто испытывают [Concept('need','потребность')|E] в товарах определенной категории. Для удовлетворения подойдет любой товар из этой категории."
 game_concept_trade_expertise: "Познания в торговле"
 game_concept_expertise: "Познания"
 game_concept_trade_expertise_desc: "Познания в торговле представляют собой практический опыт в торговле товарами из определённой [Concept('trade_category', 'категории')|E]. Он накапливается за продажу [Concept('primary_good', 'основного товара')|E] на действующих [Concept('trade_routes', 'торговых путях')|E]. По мере накопления познаний эта категория начинает приносить больше прибыли. Чем выше [Concept('expertise_levels', 'уровень познаний')|E], тем более существенны бонусы (они зависят от категории)."
 game_concept_trade_expertise_progress: "Прогресс познаний в торговле"
 game_concept_expertise_progress: "Прогресс познаний"
 game_concept_trade_expertise_progress_desc: "Каждая единица [Concept('expertise', 'познаний')|E] увеличивает прогресс персонажа в достижении нового [Concept('expertise_level', 'уровня познаний')|E]."
 game_concept_trade_expertise_level: "Уровень познаний в торговле"
 game_concept_expertise_level: "Уровень познаний"
 game_concept_expertise_levels: "Уровни познаний"
 game_concept_trade_expertise_level_desc: "Уровень познаний показывает опыт [Concept('trade_company', 'компании')|E] в торговле товарами из конкретной [Concept('trade_category', 'категории')|E].\n\nОн повышается по мере увеличения [Concept('expertise_progress', 'прогресса познаний')|E] за счёт активных [Concept('trade_routes', 'торговых путей')|E], и на каждом уровне открываются дополнительные [Concept('trade', 'торговые')|E] бонусы.\n\nВ отсутствие активной торговли товарами из этой категории уровень познаний будет постепенно падать (#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! ед. прогресса познаний за месяц)."
 game_concept_trade_market: "Торговый рынок"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "Торговые рынки"
 game_concept_trade_market_possessive: "Торгового рынка"
 game_concept_trade_markets_possessive: "Торговых рынков"
 game_concept_market: "Рынок"
 game_concept_markets: "Рынки"
 game_concept_market_possessive: "Рынка"
 game_concept_markets_possessive: "Рынков"
 game_concept_trade_market_desc: "Торговый рынок — это торговый центр, объединяющий [Concept('production', 'производство')|E] и [Concept('needs', 'потребности')|E] всех входящих в него [Concept('holdings', 'владений')|E].\n\nНа рынке местное производство сначала идёт на удовлетворение [Concept('needs', 'потребностей')|E] его [Concept('buildings', 'зданий')|E]. Всё оставшееся становится [Concept('surplus', 'излишком')|E], который можно продать, а неудовлетворённые [Concept('needs', 'потребности')|E] придётся покрывать за счёт импорта. [Concept('trade_routes', 'Торговые пути')|E] соединяют рынки между собой и позволяют перемещать [Concept('goods', 'товары')|E] с одного рынка на другой.\n\nВ центре каждого рынка находится [Concept('market_capital', 'столица')|E], принадлежащая его [Concept('market_owner', 'владельцу')|E]. Чем выше [Concept('market_prosperity', 'процветание рынка')|E], тем выгоднее его [Concept('sell_prices', 'цены продажи')|E] для торговцев."
 game_concept_market_prosperity: "Процветание рынка"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$ — средний уровень [Concept('prosperity', 'процветания')|E] во всех [Concept('counties', 'графствах')|E] на [Concept('market', 'рынке')|E].\n\nВместе с уровнем процветания рынка повышается и [Concept('sell_prices', 'цена продажи')|E] [Concept('goods', 'товаров')|E] на рынке, что привлекает больше [Concept('merchants', 'торговцев')|E]."
 game_concept_market_capital: "Столица рынка"
 game_concept_market_capitals: "Столицы рынков"
 game_concept_market_capital_possessive: "Столицы рынка"
 game_concept_market_capitals_possessive: "Столиц рынков"
 game_concept_market_capital_desc: "$game_concept_market_capital$ — [Concept('holding', 'владение')|E] во главе [Concept('market', 'рынка')|E]. Обычно это [Concept('de_jure', 'де-юре')|E] столица [Concept('duchy', 'герцогства')|E], которое охватывает рынок.\n\nИзменить изначальное положение столицы рынка невозможно. Тот, кто владеет этим [Concept('barony', 'баронством')|E], становится [Concept('market_owner', 'владельцем рынка')|E] и контролирует его."
 game_concept_market_owner: "Владелец рынка"
 game_concept_market_owners: "Владельцы рынка"
 game_concept_market_owner_possessive: "Владельца рынка"
 game_concept_market_owners_possessive: "Владельцев рынка"
 game_concept_owner: "Владелец"
 game_concept_owners: "Владельцы"
 game_concept_owner_possessive: "Владельца"
 game_concept_owners_possessive: "Владельцев"
 game_concept_market_owner_desc: "Владелец рынка — это тот, кто владеет [Concept('market_capital', 'столицей')|E] [Concept('market', 'рынка')|E], контроль над которой переходит вместе с владением её [Concept('barony', 'баронством')|E] в результате войны или наследования.\n\nВладелец рынка контролирует рынок: он может создавать связанные с ним [Concept('distribution_routes', 'раздаточные пути')|E], выступает в качестве обязательного партнёра [Concept('commission_routes', 'заказных маршрутов')|E], может устанавливать на рынке [Concept('monopolies', 'монополии')|E] и [Concept('market_toll', 'сборы')|E]."
 game_concept_market_priority: "Приоритет рынка"
 game_concept_market_priorities: "Приоритеты рынка"
 game_concept_market_priority_desc: "$game_concept_market_priority$ — это порядок, в котором [Concept('holdings', 'владения')|E] [Concept('market', 'рынка')|E] обеспечиваются товарами для удовлетворения их [Concept('needs', 'потребностей')|E].\n\nСначала идёт [Concept('market_capital', 'столица рынка')|E], затем остальные владения [Concept('county', 'графства')|E], в котором она находится, а уже затем остальные графства — в порядке убывания [Concept('settlement_size', 'размера')|E] их [Concept('county_capital', 'столиц')|E].\n\nВ пределах каждого графства первой располагается его [Concept('county_capital', 'столица')|E], затем остальные владения, также упорядоченные по [Concept('settlement_size', 'размеру поселения')|E].\n\nВ пределах владений вы можете самостоятельно устанавливать порядок [Concept('districts', 'районов')|E] и [Concept('buildings', 'зданий')|E], чтобы [Concept('needs', 'потребности')|E] нужного вам [Concept('building', 'здания')|E] покрывались своевременно."
 game_concept_market_share: "Доля рынка"
 game_concept_market_shares: "Доли рынка"
 game_concept_market_share_desc: "$game_concept_market_share$ — объём [Concept('trade_good', 'товаров')|E], поставляемых вами на [Concept('market', 'рынок')|E] по [Concept('profit_route', 'прибыльному маршруту')|E]. Зависит от вашей конкурентоспособности.\n\nНапример, если ваша конкурентоспособность в торговле тем или иным товаром такая же, как у всех остальных торговцев вместе взятых, ваша доля рынка составит 50%. Если товаром торгуете только вы, то доля рынка составит 100%.\n\nВ этом случае вы сможете выкупать все [Concept('surplus', 'избытки')|E] или продавать товары, чтобы покрывать [Concept('needs', 'потребности')|E] рынка, — при условии достаточного [Concept('capacity', 'потенциала')|E]."
 game_concept_trade_route: "Торговый путь"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "Торговые пути"
 game_concept_trade_route_possessive: "Торгового пути"
 game_concept_trade_routes_possessive: "Торговых путей"
 game_concept_route: "Путь"
 game_concept_routes: "Пути"
 game_concept_route_possessive: "Путя"
 game_concept_routes_possessive: "Путей"
 game_concept_trade_route_desc: "Торговый путь позволяет [Concept('character', 'персонажу')|E] участвовать в [Concept('trade', 'торговле')|E] ради [Concept('gold', 'золота')|E] или удовлетворения потребностей своей [Concept('realm', 'державы')|E]. Эти пути способствуют обмену [Concept('goods', 'товарами')|E] между [Concept('markets', 'рынками')|E], забирая [Concept('surplus', 'излишек')|E] с одного для удовлетворения [Concept('needs', 'потребностей')|E] другого.\n\nСуществует три типа маршрутов:\n#indent_newline:4     $EFFECT_LIST_BULLET$[Concept('distribution_route', 'Раздаточный путь')|E]: используется правителями с титулом [Concept('dukes', 'герцога')|E] или выше для покрытия [Concept('needs', 'потребностей')|E] своих [Concept('buildings', 'зданий')|E].\n$EFFECT_LIST_BULLET$[Concept('profit_route', 'Прибыльный маршрут')|E]: используется [Concept('merchants', 'торговцами')|E] и правителями [Concept('republican', 'республик')|E] для получения [Concept('gold', 'золота')|E].\n$EFFECT_LIST_BULLET$[Concept('commission_route', 'Заказной маршрут')|E]: схож с прибыльным, но отличается тем, что на время передаётся правителями-землевладельцами купцам, чтобы те могли покрыть потребности. Требует единоразовой предоплаты.#!"
 game_concept_distribution_route: "Раздаточный путь"
 game_concept_distribution_routes: "Раздаточные пути"
 game_concept_distribution: "Раздача"
 game_concept_distribution_route_possessive: "Раздаточного пути"
 game_concept_distribution_routes_possessive: "Раздаточных путей"
 game_concept_distribution_route_desc: "$game_concept_distribution_route$ — разновидность [Concept('trade_route', 'торгового пути')|E], по которому владельцы титулов начиная с [Concept('dukes', 'герцогского')|E] снабжают свои [Concept('realm', 'державы')|E].\n\nТакой путь соединяет два [Concept('markets', 'рынка')|E]. Все [Concept('surplus', 'избытки')|E] с одного рынка используется для покрытия [Concept('needs', 'потребностей')|E] другого. Однако по раздаточным путям можно перевозить только [Concept('basic_trade_goods', 'базовые товары')|E]."
 game_concept_profit_route: "Прибыльный маршрут"
 game_concept_profit_routes: "Прибыльные маршруты"
 game_concept_profit: "Прибыль"
 game_concept_profit_route_possessive: "Прибыльного маршрута"
 game_concept_profit_routes_possessive: "Прибыльных маршрутов"
 game_concept_profit_route_desc: "$game_concept_profit_route$ — это тип [Concept('trade_route', 'торгового пути')|E], с помощью которого [Concept('merchants', 'торговцы')|E] и [Concept('rulers', 'правители')|E] [Concept('republican', 'республик')|E] зарабатывают [Concept('gold', 'золото')|E].\n\nОни закупают [Concept('trade_goods', 'товары')|E] по низкой цене там, где имеется их [Concept('surplus', 'излишек')|E], и перепродают их там, где [Concept('needs', 'потребность')|E] в товаре высока, зарабатывая на разнице между [Concept('buy_price', 'ценой покупки')|E] и [Concept('sell_price', 'ценой продажи')|E]."
 game_concept_trade_route_modifier: "Модификатор торгового пути"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "Модификаторы торгового пути"
 game_concept_trade_route_modifier_desc: "Этот [Concept('modifier', 'модификатор')|E] применяется ко всем [Concept('trade_routes', 'торговым путям')|E] владельца. Целью модификатора могут быть:\n$BULLET_WITH_TAB$[competitiveness_i][trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i][route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i][max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i][max_trade_markets_short|E]"
 game_concept_commission_route: "Заказной маршрут"
 game_concept_commission_route_desc: "$game_concept_commission_route$ — [Concept('trade_route', 'путь')|E], по которому [Concept('merchant', 'торговец')|E] перевозит груз согласно приказам своего [Concept('merchant_patron', 'покровителя')|E].\n\nПокровитель платит торговцу, чтобы тот доставил определённый [Concept('trade_good', 'товар')|E] на нужный [Concept('trade_market', 'рынок')|E] за установленное время.\n\nТорговцу разрешено иметь не более #V 1#! заказного маршрута."
 game_concept_commission_routes: "Заказные маршруты"
 game_concept_commission_route_possessive: "Заказного маршрута"
 game_concept_commission_routes_possessive: "Заказных маршрутов"
 game_concept_commission: "Заказ"
 game_concept_commissions: "Заказы"
 game_concept_commission_possessive: "Заказа"
 game_concept_commissions_possessive: "Заказов"
 game_concept_commissioned_route: "Заказанный маршрут"
 game_concept_commissioned_routes: "Заказанные маршруты"
 game_concept_trade_route_length: "Длина торгового пути"
 game_concept_route_length: "Длина пути"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$ — это максимальное количество [Concept('baronies', 'баронств')|E], которое может охватывать [Concept('profit_route', 'прибыльный маршрут')|E], включая моря и судоходные реки. Длину пути можно увеличить с помощью улучшений [Concept('company_buildings', 'построек компании')|E]."
 game_concept_max_trade_goods: "Максимум товаров"
 game_concept_max_trade_goods_short: "Товары"
 game_concept_max_trade_goods_desc: "$game_concept_max_trade_goods$ — это количество разных типов [Concept('good', 'товаров')|E], которыми можно торговать на [Concept('route', 'пути')|E]. Предел можно увеличить с помощью улучшений [Concept('company_buildings', 'построек компании')|E].\n\nПо [Concept('profit_route', 'прибыльному маршруту')|E] нельзя перевозить более #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#! [Concept('goods', 'товаров')|E] — на это не влияют даже бонусы."
 game_concept_max_trade_markets: "Максимум торговых рынков"
 game_concept_max_trade_markets_short: "Торговые рынки"
 game_concept_max_trade_markets_desc: "$game_concept_max_trade_markets$ определяет количество [Concept('markets', 'рынков')|E], которые [Concept('character', 'персонаж')|E] может выбрать в качестве остановки на [Concept('profit_route', 'прибыльном маршруте')|E]. Предел можно увеличить с помощью улучшений [Concept('company_buildings', 'построек компании')|E]."
 game_concept_trade_route_capacity: "Потенциал торгового пути"
 game_concept_trade_route_capacity_short: "Торговый потенциал"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "Потенциал"
 game_concept_trade_route_capacity_desc: "$game_concept_trade_route_capacity$ определяет количество [Concept('trade_goods', 'товаров')|E], которыми можно единовременно торговать на [Concept('profit_route', 'прибыльном маршруте')|E]. Предел можно увеличить с помощью улучшений [Concept('company_buildings', 'построек компании')|E]."
 game_concept_primary_good: "Основной товар"
 game_concept_primary_goods: "Основные товары"
 game_concept_primary_good_desc: "Один из [Concept('trade_good', 'товаров')|E], которыми [Concept('merchants', 'торговцы')|E] и [Concept('patricians', 'патриции')|E] торгуют на [Concept('trade_routes', 'торговых путях')|E], считается основным.\n\nТорговля им повышает [Concept('trade_expertise', 'познания')|E] в этой [Concept('trade_category', 'категории')|E]."
 game_concept_road: "Дорога"
 game_concept_roads: "Дороги"
 game_concept_road_possessive: "Дороги"
 game_concept_roads_possessive: "Дорог"
 game_concept_road_desc: "[Concept('road', 'Дорога')|E] соединяет два [Concept('markets', 'рынка')|E]; без неё невозможно перемещение товаров по [Concept('trade_routes', 'торговым путям')|E].\n\nТорговые пути, проходящие по дорогам, выигрывают от такого расположения — в основном благодаря тому, что увеличивается их [Concept('trade_route_length', 'длина')|E].\n\nДорога также приносит пользу и [Concept('barony', 'баронству')|E], через которое она проходит: например, по дорогам быстрее перемещаются [Concept('armies', 'армии')|E].\n\nПольза дорог увеличивается пропорционально их [Concept('road_tier', 'уровню')|E]."
 game_concept_road_tier: "Уровень дороги"
 game_concept_road_tiers: "Уровни дорог"
 game_concept_road_tier_short: "Уровень"
 game_concept_road_tier_desc: "Уровень [Concept('road', 'дороги')|E] определяет степень её обустройства — от простой тропы до мощёного тракта.\n\nУровень дороги повышается по мере увеличения объёма проходящей по ней [Concept('trade', 'торговли')|E]. При этом каждый следующий уровень требует более активного использования и временных затрат. С повышением уровня усиливаются и эффекты дороги: растёт [Concept('trade_route_length', 'длина')|E] проходящих по ней [Concept('trade_routes', 'торговых путей')|E], а [Concept('baronies', 'баронства')|E], через которые она пролегает, получают более высокие бонусы.\n\nИзначальный уровень каждой дороги задан на карте. В начале игры отображаются только дороги, уровень которых выше минимального."
 game_concept_building_need: "Потребность здания"
 game_concept_building_needs: "Потребности зданий"
 game_concept_need: "Потребность"
 game_concept_needs: "Потребности"
 game_concept_building_need_desc: "Некоторые [Concept('building', 'здания')|E] нуждаются в [Concept('trade_goods', 'товарах')|E] и приносят бонусы, если эта потребность покрыта.\n\nИм нужны либо конкретные [Concept('good', 'товары')|E], например #weak [GetTradeGoodType('trade_good_wine').GetName|l]#!, либо товары из определённой [Concept('trade_category_short', 'категории')|E], например #weak [GetTradeGoodCategory('trade_category_alcohol').GetName]#!.\n\nВсе потребности покрываются за счёт товаров на местном [Concept('market', 'рынке')|E]. Если на нём отсутствует [Concept('surplus', 'излишек')|E] нужного товара, товары распределяются в соответствии с [Concept('market_priority', 'приоритетом')|E].\n\nЭти потребности не являются обязательными. Если они не будут удовлетворены, это не приведёт ни к каким негативным эффектам."
 game_concept_market_balance: "Рыночный баланс"
 game_concept_market_balances: "Рыночные балансы"
 game_concept_market_balance_short: "Баланс"
 game_concept_market_balances_short: "Балансы"
 game_concept_market_balance_desc: "У каждого [Concept('trade_good', 'товара')|E] или категории [Concept('goods', 'товаров')|E] на [Concept('market', 'рынке')|E] есть показатель баланса.\n\nЕсли баланс положителен, на рынке наблюдается [Concept('surplus', 'излишек')|E].\n\nЕсли баланс отрицателен, рынок не покрывает [Concept('needs', 'потребности')|E] [Concept('buildings', 'зданий')|E]."
 game_concept_trade_surplus: "Излишек на рынке"
 game_concept_trade_surpluses: "Излишки на рынке"
 game_concept_surplus: "Излишек"
 game_concept_surpluses: "Излишки"
 game_concept_trade_surplus_desc: "Если [Concept('production', 'производство')|E] [Concept('trade_good', 'товара')|E] превышает [Concept('need', 'потребность')|E] в нём, на [Concept('market', 'рынке')|E] образуется излишек.\n\nЭто означает, что все потребности [Concept('buildings', 'зданий')|E] на рынке покрываются целиком.\n\nИзлишек товара можно экспортировать на другие рынки по [Concept('trade_routes', 'торговым путям')|E]."
 game_concept_trade_deficit: "Рыночный дефицит"
 game_concept_trade_deficits: "Рыночные дефициты"
 game_concept_deficit: "Дефицит"
 game_concept_deficits: "Дефициты"
 game_concept_trade_deficit_desc: "Если объём [Concept('production', 'производства')|E] или импорта [Concept('trade_good', 'товара')|E] меньше, чем [Concept('needs', 'потребность')|E] в нём, на [Concept('market', 'рынке')|E] образуется дефицит.\n\nЭто означает, что потребности некоторых [Concept('buildings', 'зданий')|E] на рынке не покрываются целиком.\n\nПобороть дефицит можно с помощью импорта по [Concept('trade_routes', 'торговым путям')|E]."
 game_concept_production: "Производство"
 game_concept_productions: "Производство"
 game_concept_trade_goods_production: "Производство товаров"
 game_concept_produced: "Произведено"
 game_concept_production_desc: "По показателю производства можно узнать, какое количество [Concept('trade_good', 'товара')|E] производится [Concept('districts', 'районами')|E] и [Concept('buildings', 'зданиями')|E] каждый месяц.\n\nКогда производство товара на [Concept('market', 'рынке')|E] превышает [Concept('needs', 'потребности' )|E] в нём, появляется [Concept('surplus', 'излишек' )|E], который можно [Concept('trade', 'продать')|E]. Если показатель производства слишком низкий, товара будет не хватать, и потребности рынка останутся неудовлетворёнными."
 game_concept_potential_production: "Потенциал производства"
 game_concept_potential_productions: "Потенциал производства"
 game_concept_potential_production_desc: "Потенциал производсва каждого [Concept('county_possessive', 'графства')|E] определяет, сколько сырьевых [Concept('trade_goods', 'товаров')|E] может быть произведено в [Concept('resource_district', 'ресурсном районе')|E] [Concept('county_capital', 'столицы графства')|E]."
 game_concept_sell_price: "Цена продажи"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "Цена продажи"
 game_concept_sell_price_desc: "[Concept('market_possessive', 'Рыночная')|E] цена продажи — это стоимость [Concept('need', 'востребованного')|E] [Concept('trade_good', 'товара')|E] в [Concept('gold', 'золотых монетах')|E].\n\nВыручка, эквивалентная цене продажи, поступает владельцам [Concept('profit_routes', 'прибыльных маршрутов')|E] за поставку востребованных товаров на рынки посредством этих [Concept('route', 'путей')|E].\n\nВысокая цена продажи выгодна также [Concept('rulers', 'правителям')|E]-[Concept('landed', 'землевладельцам')|E]: чем больше [Concept('merchants', 'торговцев')|E] привлекает рынок, тем выше доход от [Concept('tolls', 'пошлин')|E]; либо же тем выше вероятность, что все потребности будут покрыты.\n\nКаждый продаваемый товар облагается пошлиной, что снижает цену продажи.\n\nКак и [Concept('buy_price', 'цена покупки')|E], цена продажи увеличивается по мере роста [Concept('market_prosperity', 'процветания рынка')|E]."
 game_concept_buy_price: "Цена покупки"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "Цена покупки"
 game_concept_buy_price_desc: "[Concept('market_possessive', 'Рыночная')|E] цена покупки — это стоимость в [Concept('gold', 'золотых монетах')|E] [Concept('trade_good', 'товара')|E], имеющегося в [Concept('surplus', 'излишке')|E].\n\nВладельцы [Concept('profit_routes', 'прибыльных маршрутов')|E] платят цену покупки для того, чтобы поставлять имеющиеся на рынке в излишке товары к себе по своим [Concept('route', 'путям')|E].\n\nКак и [Concept('sell_price', 'цена продажи')|E], цена покупки увеличивается по мере роста [Concept('market_prosperity', 'процветания рынка')|E]."
 game_concept_trade_monopoly: "Торговая монополия"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "Торговые монополии"
 game_concept_monopoly: "Монополия"
 game_concept_monopolies: "Монополии"
 game_concept_trade_monopoly_desc: "В условиях монополии только владелец может покупать и продавать [Concept('goods', 'товары')|E] на [Concept('market', 'рынке')|E].\n\nМонополия может действовать по-разному:\n #indent_newline:4    $EFFECT_LIST_BULLET$Обычная монополия распространяется только на одну [Concept('trade_category', 'категорию')|E], в то время как [Concept('complete_monopoly', 'полная монополия')|E] — на все.\n$EFFECT_LIST_BULLET$При [Concept('exploitative_monopoly', 'эксплуататорской монополии')|E] монополист может выкупать все [Concept('production', 'произведённые')|E] товары, даже если [Concept('needs', 'потребности')|E] не покрыты.\n$EFFECT_LIST_BULLET$Монополистом может быть [Concept('merchant', 'торговец')|E], [Concept('republic', 'республика')|E] или даже [Concept('trade_league', 'торговая лига')|E].#!\n\nСтать монополистом можно с помощью взаимодействия $request_trade_monopoly_for_character_interaction|V$."
 game_concept_complete_monopoly: "Полная монополия"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "Полные монополии"
 game_concept_complete_monopoly_short: "Полная"
 game_concept_complete_monopoly_desc: "$game_concept_complete_monopoly$ распространяется на каждый [Concept('trade_good', 'товар')|E] на [Concept('market', 'рынке')|E] без исключения. По сравнению с обычной [Concept('monopoly', 'монополией')|E] полная монополия не ограничивается только одной [Concept('trade_category', 'категорией')|E]."
 game_concept_exploitative_monopoly: "Эксплуататорская монополия"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "Эксплуататорские монополии"
 game_concept_exploitative_monopoly_short: "Эксплуататорская"
 game_concept_exploitative_monopoly_desc: "$game_concept_exploitative_monopoly$ — разновидность [Concept('monopoly', 'монополии')|E], позволяющая владельцу напрямую покупать [Concept('production', 'производимые')|E] товары с [Concept('market', 'рынка')|E].\n\nВ обычных условиях покупать можно только [Concept('surplus', 'излишки')|E], но монополист-эксплуататор может скупать производимые [Concept('buildings', 'зданиями')|E] товары на рынке ещё до того, как будут покрыты [Concept('building_needs', 'потребности зданий')|E]."
 game_concept_trade_competitiveness: "Торговая конкурентоспособность"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "Конкурентоспособность"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "У каждого [Concept('profit_route', 'прибыльного маршрута')|E] есть конкурентоспособность — показатель доли [Concept('trade_goods', 'товаров')|E], которые через этот маршрут можно поставить на [Concept('market', 'рынок')|E] в условиях конкуренции с такими же маршрутами.\n\nЧем выше ваша конкурентоспособность в отношении того или иного товара, тем больше ваша [Concept('market_share', 'доля рынка')|E].\n\nЕсли на рынке установлена [Concept('monopoly', 'монополия')|E], сравнивать свою конкурентоспособность могут только монополисты."
 game_concept_competitive_pressure: "Конкурентное давление"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "$game_concept_competitive_pressure$ — это кратковременное торговое преимущество, полученное [Concept('merchant','торговцем')|E]. Его можно тратить на уникальные [Concept('decisions','решения')|E] и [Concept('interactions','взаимодействия')|E], чтобы получить особые преимущества на определенных [Concept('trade_routes','торговых путях')|E]."
 game_concept_put_on_notice: "Объявить о намерениях"
 game_concept_put_on_notice_desc: "«$game_concept_put_on_notice$» — [Concept('character_interaction', 'взаимодействие персонажа')|E], для разблокирования которого необходимо [Concept('perk', 'достоинство')|E] «[GetPerk('prepared_conscription_perk').GetName(GetPlayer)]». Вы тратите [competitive_pressure_i][Concept('competitive_pressure', 'конкурентное давление')|E], чтобы воспользоваться [Concept('trade_opportunity', 'торговой возможностью')|E] и вступить в противостояние с [Concept('merchant', 'торговцем')|E] на одном из [Concept('trade_markets', 'рынков')|E] вашего [Concept('trade_route', 'торгового пути')|E]."
 game_concept_ruthless_oversight: "Безжалостный надзор"
 game_concept_ruthless_oversight_desc: "«$game_concept_ruthless_oversight$» — [Concept('character_interaction', 'взаимодействие персонажа')|E], для разблокирования которого необходимо [Concept('perk', 'достоинство')|E] «[GetPerk('fear_tax_perk').GetName(GetPlayer)]». Оно может увеличить [Concept('aptitude', 'пригодность')|E] персонажа к [Concept('court_position', 'должности')|E], повысив при этом наводимый [Concept('dread', 'ужас')|E], понизив общественное [Concept('opinion', 'мнение')|E] и ударив по [Concept('company_sentiment', 'направлению компании')|E]."
 game_concept_request_merchant_charter: "Попросить торговую хартию"
 game_concept_request_merchant_charter_desc: "«$game_concept_request_merchant_charter$» — [Concept('character_interaction', 'взаимодействие персонажа')|E], которое позволяет [Concept('merchant', 'торговцу')|E] запросить у [Concept('merchant_patron', 'покровителя')|E] [Concept('charter', 'хартию')|E], дарующую особые права на местном [Concept('market', 'рынке')|E]."
 game_concept_monopolize_trade: "Монополизировать торговлю"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "$game_concept_monopolize_trade$ — это [Concept('character_interaction', 'взаимодействие')|E], позволяющее [Concept('merchant', 'заплатить')|E] [Concept('gold', 'золото')|E] [Concept('market_owner', 'владельцу рынка')|E] в обмен на [Concept('trade_monopoly', 'монополию')|E]."
 game_concept_trader: "Приказчик"
 game_concept_traders: "Приказчики"
 game_concept_trader_possessive: "Приказчика"
 game_concept_traders_possessive: "Приказчиков"
 game_concept_trader_desc: "$game_concept_trader$ — [Concept('character', 'персонаж')|E], заведующий [Concept('trade_route', 'торговым путём')|E].\n\nНазначить приказчиком можно только [Concept('associate', 'помощника')|E] или [Concept('courtier', 'придворного')|E] владельца пути. Один приказчик может заведовать только одним путём. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\nКаждому из них поручается задача по улучшению определённого аспекта торгового пути. [Concept('aptitude', 'Пригодность')|E] к её выполнению определяется уровнем [Concept('skills', 'навыков')|E].\n\nНа каждом [Concept('trade_market', 'рынке')|E] приказчики занимаются личными [Concept('schemes', 'происками')|E]. Если довести происки до конца не удаётся, приказчик получает [Concept('trait', 'свойство')|E] «[GetTrait('lifestyle_merchant').GetName( GetNullCharacter )]». Если же такое свойство уже присутствует, приказчику начисляется немного [Concept('trait_level_track_xp', 'опыта')|E] случайно выбранного [Concept('trait_level_track', 'направления')|E] свойства «[GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )]»: «$trait_track_caravaneer$», «$trait_track_artisan$» или «$trait_track_creditor$»."
 game_concept_trader_council: "Кроме того, приказчик не может заседать в [Concept('council', 'совете')|E], если не является [Concept('spouse', 'супругом')|E] владельца пути."
 game_concept_trader_council_merchant: "Приказчиками также могут быть [Concept('spouse', 'супруг')|E] или [Concept('deputies', 'сотрудники')|E] владельца пути. Исключение составляют [GetCourtPositionType('partner_court_position').GetName()|l] и [GetCourtPositionType('travel_leader_court_position').GetName()|l]."
 #Merchant
 game_concept_merchant: "Торговец"
 game_concept_merchants: "Торговцы"
 game_concept_merchant_possessive: "Торговца"
 game_concept_merchants_possessive: "Торговцев"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "$game_concept_merchant$ — это [Concept('unlanded', 'безземельный')|E] [Concept('character', 'персонаж')|E], ведущий [Concept('trade', 'торговлю')|E] как представитель [Concept('company', 'компании')|E].\n\nТорговцы стремятся удовлетворить [Concept('building_needs', 'потребности зданий')|E] на [Concept('trade_markets', 'рынках')|E] и укрепляют экономику в погоне за личным богатством и ростом статуса. [Concept('prestige', 'Престиж')|E] для них важнее [Concept('gold', 'золота')|E], ведь он позволяет подняться в глазах [Concept('merchant_patron', 'покровителя')|E] и [Concept('associates', 'помощников')|E] и расширять [Concept('trade_routes', 'торговые пути')|E], чтобы в конечном счёте установить [Concept('trade_monopoly', 'торговую монополию')|E]."
 game_concept_merchant_family: "Торговое семейство"
 game_concept_merchant_families: "Торговые семейства"
 game_concept_merchant_family_possessive: "Торгового семейства"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$ — это [Concept('houses','дома')|E], участвующие в торговле как [Concept('merchants','торговцы')|E] или представители [Concept('republicans','республик')|E]. Семейство владеет [Concept('company','компанией')|E], которой управляет и владеет [Concept('house_head','глава дома')|E], и играет важную роль в [Concept('trade','торговле')|E] и [Concept('prosperity','процветании')|E] державы."
 game_concept_associate: "Помощник"
 game_concept_associates: "Помощники"
 game_concept_associate_possessive: "Помощника"
 game_concept_associates_possessive: "Помощников"
 game_concept_associate_desc: "$game_concept_associates$ — это [Concept('unlanded', 'безземельные')|E] персонажи, входящие в [Concept('company', 'компанию')|E] [Concept('merchant', 'торговца')|E]. Они играют роль, аналогичную [Concept('courtiers', 'придворным')|E] правителей-землевладельцев, могут управлять [Concept('trade_routes', 'торговыми путями')|E] в качестве [Concept('traders', 'приказчиков')|E] и становиться [Concept('deputies', 'сотрудниками')|E]."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "Сотрудник"
 game_concept_deputies: "Сотрудники"
 game_concept_deputy_possessive: "Сотрудника"
 game_concept_deputies_possessive: "Сотрудников"
 game_concept_deputy_desc: "Сотрудники служат [Concept('merchant_families','торговым семействам')|E] и их [Concept('companies','компаниям')|E]. Их роль схожа с ролью [Concept('court_positions','придворных должностей')|E]. Сотрудниками становятся [Concept('associates','помощники')|E] [Concept('company','компании')|E], и их [Concept('aptitude','пригодность')|E] определяет, насколько успешно они справляются со своими заданиями."
 game_concept_company: "Компания"
 game_concept_companies: "Компании"
 game_concept_company_possessive: "Компании"
 game_concept_trade_company: "Торговая компания"
 game_concept_trade_companies: "Торговые компании"
 game_concept_company_desc: "$game_concept_trade_companies$ — отправные точки [Concept('trade_routes', 'торговых путей')|E] для управляющего компанией [Concept('merchant_family_possessive', 'торгового семейства')|E].\n\n#TOOLTIP:GOVERNMENT_TYPE,merchant_government #L Торговые#!#! компании обладают собственными [Concept('domicile', 'имениями')|E]. Если у неё есть [Concept('merchant_patron_possessive', 'покровитель')|E], имение компании обычно расположено в его [Concept('holding', 'владении')|E].\n\nУ компаний есть собственные [Concept('domicile_buildings', 'постройки в имении')|E] — так называемые [Concept('company_buildings', 'постройки компании')|E]. Они дают торговые бонусы и бонусы для всех причастных к торговле. В торговой компании также проживают [Concept('associates', 'помощники')|E], члены семьи и [Concept('knights', 'рыцари')|E], из которых можно набирать [Concept('deputies', 'сотрудников')|E].\n\n#WEAK Как и при [Concept('courts', 'дворах')|E], в торговых компаниях проживают безымянные [Concept('characters', 'персонажи')|E], недостаточно важные, чтобы их упоминать. Впрочем, здесь их меньше.#!"
 game_concept_company_building: "Постройка компании"
 game_concept_company_buildings: "Постройки компании"
 game_concept_company_buildings_short: "Постройки"
 game_concept_company_building_desc: "$game_concept_company_buildings$ — принадлежащие [Concept('company', 'компании')|E] [Concept('domicile_buildings', 'постройки в имении')|E]. В основном они способствуют [Concept('trade', 'торговле')|E]: увеличивают [Concept('capacity', 'потенциал')|E] и [Concept('route_length', 'длину')|E] [Concept('trade_routes', 'торговых путей')|E]. Их бонусы также распространяются на [Concept('max_trade_goods_short', 'товары')|E] и [Concept('max_trade_markets_short', 'рынки')|E] на пути."
 game_concept_usury: "Ростовщичество"
 game_concept_usurer: "Ростовщик"
 game_concept_usurers: "Ростовщики"
 game_concept_usurer_possessive: "Ростовщика"
 game_concept_usurers_possessive: "Ростовщиков"
 game_concept_usurious: "Ростовщический"
 game_concept_interest: "Процент"
 game_concept_usury_desc: "$game_concept_usury$ — предоставление [Concept('gold', 'золота')|E] [Concept('lending', 'взаймы')|E] под процент. От [Concept('doctrine', 'доктрины')|E] [Concept('rite', 'течения')|E] «[GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip]» зависит, считается ли ростовщичество честным занятием или [Concept('sin', 'грехом')|E].\n\nВ державах, где ростовщичество осуждается, [Concept('piety', 'благочестие')|E] [Concept('merchant', 'торговцев')|E] снижается за каждый [Concept('loan', 'заём')|E], выданный посредством [Concept('interaction', 'взаимодействия')|E] «$loan_money_interaction|V$». Владелец [Concept('company', 'компании')|E], чья специфика — $company_purpose_creditor|V$, начинает считаться ростовщиком, как только общественности становится известно, что он ссужает деньги под процент.\n\n#weak Некоторые течения запрещают давать деньги в рост только тем, кто исповедует одну с ростовщиком [Concept('religion', 'религию')|E], и разрешают вести дела с остальными.#!"
 game_concept_loan: "Заём"
 game_concept_loans: "Займы"
 game_concept_loan_possessive: "Займа"
 game_concept_loans_possessive: "Займов"
 game_concept_loaned: "Взято взаймы"
 game_concept_lending: "Выдано взаймы"
 game_concept_loan_desc: "$game_concept_loan$ — сумма [gold_i|E][Concept('gold', 'золота')|E], предоставляемая в долг. По займу могут начисляться проценты.\n\nКак правило, займы берут [Concept('ruler', 'правители')|E], оказавшиеся в [Concept('debt', 'долгу')|E] либо нуждающиеся в дополнительных средствах на [Concept('war', 'войну')|E] или другие статьи расходов.\n\nВыдающий займы ростовщик может объявить о проценте по выплате открыто, попытаться его скрыть, либо вообще выдать беспроцентный заём. Отношение к [Concept('usury', 'ростовщичеству')|E] разнится в зависимости от [Concept('faiths', 'конфессии')|E].\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help Выдача займа — это игра вдолгую: когда умирает либо должник, либо ростовщик, заём переходит к [Concept('heir', 'наследнику')|E] (если таковой есть)#!"
 loan_repayment_help: "#help [Concept('debtor', 'Должник')|E] может выплатить заём, воспользовавшись [Concept('decision', 'решением')|E] «[GetDecisionWithKey('repay_loan_decision').GetName]». [Concept('creditor', 'Заимодавец')|E] может потребовать выплаты займа с помощью [Concept('interaction', 'взаимодействия')|E] #V «$demand_repayment_interaction$»#! по прошествии не менее #V 2#! лет\n\n[Concept('merchants', 'Торговцы')|E], [Concept('company_purpose', 'спецификой компании')|E] которых является «[GetLaw('company_purpose_creditor').GetName]», могут постепенно взыскивать займы, наняв [GetCourtPositionType( 'bailiff_court_position' ).GetName()|l]а или с помощью [Concept('court_position_task', 'поручения придворному')|E] #V $bailiff_collect_loans$#!#!"
 game_concept_merchant_patron: "Покровитель"
 game_concept_merchant_patrons: "Покровители"
 game_concept_merchant_patron_possessive: "Покровителя"
 game_concept_merchant_patron_desc: "$game_concept_merchant_patron$ — [Concept('ruler', 'правитель')|E] [Concept('holding', 'владения')|E], где располагается [Concept('domicile', 'имение')|E] [Concept('merchant_possessive', 'торговца')|E].\n\nТакой торговец считается [Concept('client', 'клиентом')|E] своего покровителя и обязан выплачивать ему [Concept('taxes', 'налоги')|E]."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "Торговец-клиент"
 game_concept_client_merchants: "Торговцы-клиенты"
 game_concept_client_merchant_possessive: "Торговца-клиента"
 game_concept_client: "Клиент"
 game_concept_client_possessive: "Клиента"
 game_concept_clients: "Клиенты"
 game_concept_client_merchant_desc: "$game_concept_client_merchant$ — это [Concept('character', 'персонаж')|E]-[Concept('merchant', 'торговец')|E]. Он владеет [Concept('company', 'компанией')|E] в пределах [Concept('realm', 'державы')|E] [Concept('ruler', 'правителя')|E]-[Concept('landed', 'землевладельца')|E], который становится его [Concept('merchant_patron', 'покровителем')|E].\n\nТорговец-клиент передаёт покровителю часть своих доходов от [Concept('trade', 'торговли')|E]. Он не может вступать в войны или [Concept('faction', 'фракции')|E] против покровителя и не может освободиться, если не перенесёт свою компанию в другое место."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "Захват державы"
 game_concept_seize_realm_cb_desc: "[Concept('casus_belli', 'Казус белли')|E], позволяющий [Concept('merchant', 'торговцу')|E] основать [Concept('republic', 'республику')|E] и стать землевладельцем. Атакующая сторона может использовать [Concept('interaction', 'взаимодействие')|E] «#V $gdp_merchant_seize_realm_call_debtor_interaction$#!», чтобы потратить @unspent_strong_hook_icon! [Concept('strong_hooks', 'сильное влияние')|E] #weak (спасение от разорения или непогашенный заём)#! и заставить [Concept('independent', 'независимого')|E] [Concept('rulers', 'правителя')|E] присоединиться к [Concept('war', 'войне')|E] в качестве [Concept('allies', 'союзника')|E]."
 game_concept_company_purpose: "Специфика компании"
 game_concept_company_purposes: "Специфики компаний"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$ — это принципы, определяющие [Concept('company','компанию')|E] и ее [Concept('merchant_family','торговое семейство')|E].\n\nКомпания может сосредоточиться на кредитовании, семейных связях, качетсве и редкости товаров или на размерах своей торговой сети, преодолевающей расстояния и культурные различия.\n\nКаждая специфика открывает доступ к уникальным [Concept('interactions','взаимодействиям')|E], должностям [Concept('deputy','сотрудников')|E] и [Concept('trade','торговым')|E] бонусам."
 game_concept_trade_acumen: "Деловая хватка торговца"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "Деловая хватка"
 game_concept_trade_acumen_desc: "Деловая хватка показывает, сколько всего [Concept('gold', 'золота')|E] [Concept('merchant', 'торговая')|E] [Concept('company', 'компания')|E] накопила посредством [Concept('trade', 'торговли')|E] во всех [Concept('trade_categories', 'категориях')|E].\n\nДеловая хватка определяет [Concept('company_sizes', 'размер компании')|E]. Её нельзя тратить как ресурс."
 game_concept_company_size: "Размер компании"
 game_concept_company_sizes: "Размеры компаний"
 game_concept_company_size_desc: "$game_concept_company_size$ отражает влияние [Concept('merchant_family_possessive', 'торгового семейства')|E] на [Concept('trade', 'торговлю')|E], и каждый уровень значительно увеличивает [Concept('competitiveness', 'конкурентоспособность')|E] и торговые возможности. Чтобы увеличить размер компании, нужна [Concept('acumen', 'деловая хватка')|E].\n\nСуществует четыре размера: [GetLaw('company_size_small').GetName|l], [GetLaw('company_size_medium').GetName|l], [GetLaw('company_size_large').GetName|l] и [GetLaw('company_size_huge').GetName|l]."
 #Contracts
 game_concept_trade_contract: "Торговый договор"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "Торговые договоры"
 game_concept_trade_contract_possessive: "Торгового договора"
 game_concept_trade_contracts_possessive: "Торговых договоров"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$ позволяют [Concept('companies','компаниям')|E] [Concept('merchant','торговцев')|E] влиять на свои [Concept('trade_routes','торговые пути')|E] или искать богатства в далеких землях.\n\nПервые обозначаются как [trade_opportunities|El], а вторые как [luxury_contracts|El]."
 game_concept_trade_contract_tier: "Уровень торгового договора"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "Уровень"
 game_concept_trade_contract_tier_desc: "[Concept('trade_contract', 'Торговые договоры')|E] подразделяются на уровни; от них зависит как сложность выполнения договора, так и награда. На уровень влияет преимущественно [Concept('prosperity', 'процветание')|E] места, где заключается договор."
 game_concept_luxury_contract: "Эксклюзивный договор"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "Эксклюзивные договоры"
 game_concept_luxury_contract_possessive: "Эксклюзивного договора"
 game_concept_luxury_contracts_possessive: "Эксклюзивным договорам"
 game_concept_luxury_contract_desc: "Эксклюзивные договоры обязывают [Concept('merchant', 'торговые')|E] [Concept('companies', 'компании')|E] отправиться в [Concept('travel', 'путешествие')|E] в отдалённый район и приобрести там [Concept('domicile_artifact', 'артефакт имения')|E].\n\nУ торговцев, [Concept('company_purpose', 'специализирующихся')|E] на караванах, каждый год с некоторой вероятностью появляется возможность заключить такой договор, воспользовавшись [Concept('decision', 'решением')|E] «[GetDecisionWithKey('gdp_visit_holding_decision').GetName]»."
 game_concept_trade_opportunity: "Торговая возможность"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "Торговые возможности"
 game_concept_trade_opportunity_possessive: "Торговой возможности"
 game_concept_trade_opportunities_possessive: "Торговых возможностей"
 game_concept_opportunity: "Возможность"
 game_concept_opportunities: "Возможности"
 game_concept_opportunity_possessive: "Возможности"
 game_concept_opportunities_possessive: "Возможностей"
 game_concept_trade_opportunity_desc: "$game_concept_trade_opportunities$ требуют от [Concept('companies','компаний')|E] [Concept('merchant','торговцев')|E] успешного завершения [Concept('scheme','происков')|E].\n\nОбычно они носят сугубо деловой характер (например, продвижение прибыльных [Concept('trade_goods','товаров')|E]), но могут быть и более враждебными (например, конкуренция с соперничающей семьей за контроль над [Concept('market','рынком')|E]).\n\nЕсли не выполнить свою часть сделки или отказаться от происков, $game_concept_trade_opportunity|l$ будет считаться упущенной."
 game_concept_trade_opportunity_tier: "Уровень торговой возможности"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "Уровень"
 game_concept_trade_opportunity_tier_desc: "$game_concept_trade_opportunity_tier$ соответствует [Concept('prosperity','процветанию')|E] места, к которому привязан договор.\n\nЧем выше уровень, тем выше награда, но в большинстве случаев растет и сложность."
 game_concept_trade_opportunity_scheme: "Происки торговой возможности"
 game_concept_trade_opportunity_schemes: "Происки торговых возможностей"
 game_concept_trade_opportunity_scheme_possessive: "Происков торговой возможности"
 game_concept_trade_opportunity_schemes_possessive: "Происки торговых возможностей"
 game_concept_trade_opportunity_scheme_trade_opportunity: "Торговая возможность"
 game_concept_trade_opportunity_scheme_opportunity: "Возможность"
 game_concept_opportunity_scheme: "Происки возможности"
 game_concept_opportunity_schemes: "Происки возможностей"
 game_concept_opportunity_scheme_possessive: "Происков возможности"
 game_concept_opportunity_schemes_possessive: "Происков возможностей"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "Договор покровителя"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "Договоры покровителя"
 game_concept_patron_contract_possessive: "Договора покровителя"
 game_concept_patron_contracts_possessive: "Договоров покровителя"
 game_concept_patron_contract_desc: "По договорам покровителя [Concept('companies','компании')|E] [Concept('merchant','торговцев')|E] должны успешно завершать [Concept('scheme','происки')|E], направленные на [Concept('merchant_patron','покровителя')|E].\n\nОбычно они завязаны на [Concept('diplomacy', 'дипломатию')|E] и связаны с исполнением пожеланий покровителя (например, разрешением рыночных споров) или с принуждением их исполнить волю торговца (например, изгнать соперничающее торговое семейство).\n\nЕсли не выполнить свою часть сделки или отказаться от происков, $game_concept_patron_contract|l$ тоже будет считаться невыполненным."
 game_concept_patron_contract_scheme: "Происки договора покровителя"
 game_concept_patron_contract_schemes: "Происки договоров покровителя"
 game_concept_patron_contract_scheme_possessive: "Происков договора покровителя"
 game_concept_patron_contract_schemes_possessive: "Происков договоров покровителя"
 game_concept_patron_contract_scheme_patron_contract: "Договор покровителя"
 game_concept_patron_scheme: "Происки покровителя"
 game_concept_patron_schemes: "Происки покровителей"
 game_concept_patron_scheme_possessive: "Происков покровителя"
 game_concept_patron_schemes_possessive: "Происков покровителей"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "Контракт на направление"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "Контракты на направление"
 game_concept_unity_contract_possessive: "Контракта на направление"
 game_concept_unity_contracts_possessive: "Контрактов на направление"
 game_concept_unity_contract_desc: "$game_concept_unity_contracts$ возникают при низком показателе [Concept('company_sentiment', 'направления компании')|E] [Concept('merchant_possessive', 'торговца')|E] и представляют проблему, которую необходимо решить."
 game_concept_domicile_artifact: "Артефакт имения"
 game_concept_domicile_artifacts: "Артефакты имения"
 game_concept_domicile_artifact_desc: "Артефакт имения — это [Concept('artifact', 'артефакт')|E], которые демонстрируется в [Concept('company', 'компании')|E] [Concept('merchant_possessive', 'торговца')|E]. К их числу относятся [Concept('curios', 'диковинки')|E] и [Concept('creatures', 'звери')|E].\n\nДля торговца артефакты имения являются главным источником пассивного прироста [Concept('prestige', 'престижа')|E].\n\nУ [Concept('character', 'персонажа')|E] может быть сколько угодно артефактов, но выставлять напоказ можно ограниченное их количество.\n\nТорговцы могут приобретать артефакты имения за успешно выполненные [Concept('luxury_contracts', 'эксклюзивные договоры')|E]."
 game_concept_menagerie: "Зверинец"
 game_concept_menagerie_creature: "Животное из зверинца"
 game_concept_menagerie_creatures: "Животные из зверинца"
 game_concept_creature: "Животное"
 game_concept_creatures: "Животные"
 game_concept_creature_desc: "Животное — это живой артефакт имения, полученный [Concept('merchants', 'торговцем')|E] при выполнении [Concept('luxury_contracts', 'эксклюзивного договора')|E].\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "Диковинка"
 game_concept_curios: "Диковинки"
 game_concept_curio_desc: "Диковинка — это [Concept('artifact','артефакт')|E] имения редкого типа, полученный [Concept('merchants', 'торговцем')|E] при выполнении [Concept('luxury_contracts', 'эксклюзивного договора')|E].\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "Их можно выставлять как [Concept('domicile_artifact', 'артефакты имения')|E] в [Concept('company', 'компании')|E] для постепенного накопления [Concept('prestige', 'престижа')|E]."
 game_concept_guelph_ghibelline_precursor_situation: "Прелюдия к ситуации «$game_concept_guelph_ghibelline_situation$»"
 game_concept_guelph_ghibelline_precursor_situation_desc: "Прелюдия к [Concept('situation', 'ситуации')|E] «[Concept('guelph_ghibelline_situation', 'Гвельфы и гибеллины')|E]» представляет собой ряд событий, углубляющих противоречия между Священной Римской империей и Папством.\n\n#F Все началось с папской буллы «[Glossary( 'In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS' )]», в которой действовавший папа заявил, что дворянство не должно участвовать в выборах папы. Вместо них этим должны заниматься кардиналы, собравшиеся в Риме.\n\nЗатем, во времена [Glossary( 'Диктата папы', 'DICTATUS_PAPAE_GLOSS' )] и борьбы за инвеституру, папа объявил, что его власть от Бога, и только он может назначать или снимать с должностей священнослужителей. К епископам, назначенным светскими правителями, стали относиться с неодобрением."
 game_concept_guelph_ghibelline_situation: "Гвельфы и гибеллины"
 game_concept_guelph_ghibelline_situation_desc: "Ситуация, возникшая из-за конфликта между папой ([guelphs|E]) и Священной Римской империей ([ghibellines|E]).\n\nСо временем она переросла в спор о том, хотят ли правители Северной Италии, чтобы империя активнее вмешивалась в их дела, или же они предпочтут сохранить независимость."
 game_concept_gg_involvement: "Вовлеченность"
 game_concept_gg_involvement_desc: "Вовлечённость [Concept('ruler', 'правителя')|E] в [Concept('situation', 'борьбу')|E] [Concept('guelph_ghibelline_situation', 'гвельфов и гибеллинов')|E] показывает, насколько ситуация касается персонажа. Лучшим способом получить вовлечённость будут активные действия в отношении противоположной стороны.\n\nК подобным действиям относятся:\n$BULLET_WITH_TAB$[Concept('hostile_schemes', 'Агрессивные происки')|E]\n$BULLET_WITH_TAB$[Concept('interactions', 'Применение')|E] [Concept('torture', 'пыток')|E], [Concept('imprison', 'заключение в тюрьму')|E] или [Concept('execution', 'казнь')|E]\n$BULLET_WITH_TAB$Использование [Concept('scheme', 'происков')|E] «[GetScheme('gg_switch_sides').GetTypeName]», [Concept('interaction', 'взаимодействия')|E] «$gg_recruit_partisan_interaction|V$», [Concept('casus_belli', 'казус белли')|E] «[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]» и др.\n$BULLET_WITH_TAB$Срабатывание [Concept('situation_catalysts', 'катализаций')|E]\n\nВ свою очередь, вовлечённость:\n$BULLET_WITH_TAB$Применяет растущий [Concept('modifier', 'модификатор')|E] «[GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip]» за каждые #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#! ед.\n$BULLET_WITH_TAB$Работает как множитель наград в случае, если ваша сторона завершит ситуацию.\n\n#F Во время [Concept('guelph_ghibelline_precursor_situation', 'прелюдии')|E] нельзя получить вовлечённость, и она медленнее накапливается до начала полноценного конфликта.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "Гвельф"
 game_concept_guelphs: "Гвельфы"
 game_concept_guelph_desc: "Гвельфы — это участники [Concept('situation', 'ситуации')|E] «[Concept('guelph_ghibelline_situation', 'Гвельфы и гибеллины')|E]», выступающие за независимость от Священной Римской империи и божественности власти.\n\n#F Слово «Гвельф» происходит от имени дома Вельф, исторических герцогов Баварии, искаженного народной молвой.#!"
 game_concept_ghibelline: "Гибеллин"
 game_concept_ghibellines: "Гибеллины"
 game_concept_ghibelline_desc: "Гибеллины — это участники [Concept('situation', 'ситуации')|E] «[Concept('guelph_ghibelline_situation', 'Гвельфы и гибеллины')|E]», поддерживающие растущие влияние и контроль Священной Римской империи над враждующими городами-государствами Северной Италии.\n\n#F Слово «Гибеллин» происходит от боевого клича Гогенштауфенов, включавшего упоминание замка Вайблинген, во время осады Вейнсберга.#!"
 game_concept_lombard_league: "Ломбардская лига"
 game_concept_lombard_league_desc: "Лига, созданная североитальянскими городами в противовес растущим попыткам по централизации со стороны Священной Римской империи."
 game_concept_confederation_cohesion: "Сплочённость конфедерации"
 game_concept_cohesion: "Сплочённость"
 game_concept_confederation_cohesion_desc: "Сплочённость [Concept('confederation', 'конфедерации')|E] — мера её единства, варьирующаяся от #V 0#! до #V 100#!. Каждый месяц участники вносят свой вклад в сплочённость — как положительный, так и отрицательный. Чем выше сплочённость, тем меньше становится прирост.\n\nКаждый новый уровень сплочённости даёт участникам всё более существенные преимущества. Конкретные бонусы, а также источники прироста зависят от разновидности конфедерации.\n\nСуществуют следующие типы сплочённости:\n$BULLET_WITH_TAB$[Concept('bloc_cohesion', 'Сплочённость блока')|E]\n$BULLET_WITH_TAB$[Concept('league_cohesion', 'Сплочённость лиги')|E]"
 game_concept_trade_league: "Торговая лига"
 game_concept_trade_league_desc: "$game_concept_trade_league$ — [Concept('confederation', 'конфедерация')|E] [Concept('republics', 'республик')|E], которую их [Concept('rulers', 'правители')|E] могут сформировать или к которой могут присоединиться ради взаимной выгоды в торговле и обороне.\n\nОдин участник получает [Concept('leading_title', 'главный титул')|E] и становится [Concept('trade_league_leader', 'лидером торговой лиги')|E]. Только он может приглашать новых участников или изгонять уже имеющихся. Остальные получают [Concept('member_title', 'титул участника лиги')|E].\n\nЧем выше [Concept('league_cohesion', 'сплочённость лиги')|E], тем существеннее преимущества для её участников."
 game_concept_trade_leagues: "Торговые лиги"
 game_concept_trade_league_short: "Лига"
 game_concept_league_cohesion: "Сплочённость лиги"
 game_concept_league_cohesion_desc: "Сплочённость [Concept('trade_league', 'торговой лиги')|E] — мера её единства. Каждый уровень сплочённости предоставляет всё более существенные бонусы к [Concept('trade', 'торговле')|E] для её участников. Если показатель составляет менее #V 20#! ед., лига недостаточно сплочённая, и её участники не могут присоединяться к [Concept('wars', 'войнам')|E] друг друга или запрашивать [Concept('trade_monopolies', 'торговые монополии')|E].\n\nСплочённость растёт за счёт [Concept('title_tier', 'уровней')|E] титулов участников, их [Concept('capital', 'столиц')|E] и [Concept('opinion', 'мнения')|E] о [Concept('trade_league_leader', 'лидере торговой лиги')|E]. Монополии укрепляют сплочённость, а избыток или, наоборот, нехватка [Concept('trade_league_members_short', 'участников')|E] — ослабляют."
 game_concept_trade_league_leader: "Лидер торговой лиги"
 game_concept_trade_league_leader_desc: "Лидер [Concept('trade_league', 'торговой лиги')|E] — её основатель и официальный глава.\n\nЭто единственный [Concept('trade_league_member_short', 'участник')|E], имеющий право приглашать новых членов лиги и изгонять уже имеющихся. Участники могут выдвинуть претензию на титул лидера. Если лидер покидает лигу, его полномочия переходят другому участнику, чьи [Concept('title_tier', 'уровень титула')|E], [Concept('settlement_size', 'размер')|E] [Concept('capital', 'столицы')|E] и [Concept('prestige', 'престиж')|E] позволяют стать преемником."
 game_concept_trade_league_leader_short: "Лидер"
 game_concept_trade_league_member: "Участник торговой лиги"
 game_concept_trade_league_members: "Участники торговой лиги"
 game_concept_trade_league_member_short: "Участник"
 game_concept_trade_league_members_short: "Участники"
 game_concept_trade_league_member_desc: "Члены [Concept('trade_league', 'торговой лиги')|E] обладают [Concept('member_title', 'титулом участника')|E], создающимся на основе [Concept('primary_title', 'первого титула')|E] входящих в лигу [Concept('republics', 'республик')|E].\n\nОдин участник обладает [Concept('leading_title', 'главным титулом')|E] — это [Concept('trade_league_leader', 'лидер торговой лиги')|E]."
 game_concept_league_focus: "Специализация лиги"
 game_concept_league_focuses: "Специализации лиги"
 game_concept_league_focus_desc: "$game_concept_league_focus$ — [Concept('trade_category', 'категория')|E], которую выбирает [Concept('trade_league_leader', 'лидер')|E] [Concept('trade_league', 'торговой лиги')|E]. Каждый [Concept('holder', 'владетель')|E] [Concept('member_title', 'титула участника')|E] получает бонусы к [Concept('trade_expertise', 'познанию в торговле')|E], [Concept('production', 'производству')|E] и [Concept('sell_price', 'цене продажи')|E], соответствующие этой категории."
 game_concept_patrician: "Патриций"
 game_concept_patricians: "Патриции"
 game_concept_patrician_possessive: "Патриция"
 game_concept_patrician_desc: "Патриций — это [Concept('house_head','глава дома')|E] ведущего [Concept('merchant','торгового')|E] семейства в [Concept('republic','республике')|E]."
 game_concept_patrician_family: "Семья патрициев"
 game_concept_patrician_families: "Семьи патрициев"
 game_concept_patrician_family_short: "Семья"
 game_concept_patrician_family_desc: "Патриции представляют собой [Concept('merchant_family', 'торговые семейства')|E], которые принадлежат к [Concept('republic', 'республиканской')|E] аристократии и пользуются значительным влиянием. Их [Concept('domicile', 'имение')|E] называется [Concept('consortery', 'консортерия')|E].\n\nВ республике с низким [Concept('title_tier', 'титулом')|E], например в [Concept('county', 'графстве')|E], обычно проживает одна такая семья, но чем выше титул, тем их больше."
 game_concept_patrician_rating: "Ранг патриция"
 game_concept_patrician_rating_short: "Ранг"
 game_concept_patrician_rating_desc: "Каждая [Concept('patrician_family', 'семья патрициев')|E] имеет собственный ранг. Он отображает важность и влиятельность конкретного [Concept('patrician', 'патриция')|E] и его семейства в [Concept('republic', 'республике')|E].\n\nВысокий ранг предоставляет [Concept('patrician', 'патрицию')|E] и его [Concept('house', 'дому')|E] определённые бонусы за каждый из трёх уровней ранга. Каждому уровню соответствуют дополнительные преимущества, такие как:\n$BULLET_WITH_TAB$Увеличение [Concept('house_ambition', 'амбиции')|E]\n$BULLET_WITH_TAB$Увеличение вероятности принятия [Concept('interactions', 'взаимодействий')|E]\n$BULLET_WITH_TAB$Увеличение [Concept('governor_salary', 'жалования губернатора')|E]\n\nПовысить ранг можно несколькими способами. Главные факторы, влияющие на ранг:\n$BULLET_WITH_TAB$Доход [Concept('patrician_possessive', 'патриция')|E] от [Concept('trade', 'торговли')|E]\n$BULLET_WITH_TAB$Управление [Concept('republic', 'республикой')|E]\n$BULLET_WITH_TAB$Занятие должности в [Concept('assembly', 'собрании')|E] и [Concept('council', 'совете')|E] [Concept('liege_possessive', 'сюзерена')|E][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$Власть членов [Concept('house', 'дома')|E] над [Concept('clerical_region', 'церковным округом')|E]\n$BULLET_WITH_TAB$Наличие [Concept('modifier', 'модификатора')|E] «[GetModifier('favored_by_pope_modifier').GetNameWithTooltip]»"
 game_concept_patrician_rating_penalties_PAM: "Ранг патриция снижается, если он [Concept('excommunicated', 'отлучён от церкви')|E], признан [Concept('criminal', 'преступником')|E] или обладает модификатором «[GetModifier('scorned_pope_modifier').GetNameWithTooltip]»."
 game_concept_patrician_rating_penalties_NO_PAM: "Ранг патриция снижается, если он [Concept('excommunicated', 'отлучён от церкви')|E] или признан [Concept('criminal', 'преступником')|E]."
 game_concept_consortery: "Консортерия"
 game_concept_consorteries: "Консортерии"
 game_concept_consortery_possessive: "Консортерии"
 game_concept_consortery_desc: "$game_concept_consortery$ — резиденция и [Concept('domicile', 'имение')|E] [Concept('patrician_family', 'семьи патрициев')|E]. Обычно располагается в [Concept('capital', 'столице')|E] их [Concept('liege_possessive', 'сюзерена')|E].\n\nСхожа с [Concept('merchant_possessive', 'торговыми')|E] [Concept('trade_companies', 'торговыми компаниями')|E] тем, что также полагается на [Concept('domicile_buildings', 'постройки в имении')|E], считающиеся [Concept('company_buildings', 'постройками компании')|E], — они помогают семейству конкурировать с другими торговцами.\n\nПереходит по наследству вместе с титулом [Concept('patrician_family', 'семьи патрициев')|E]."
 game_concept_assembly: "Собрание"
 game_concept_assembly_possessive: "Собрания"
 game_concept_assembly_desc: "Собрание — это правительственный орган [Concept('realm', 'державы')|E].\n\nОбязанности членов собрания определяются [Concept('laws', 'законами')|E]. Обычно они голосуют за новые законы и [Concept('republic_decrees', 'республиканские указы')|E]. При некоторых выборных формах [Concept('succession', 'наследования')|E], таких как [GetLaw('republican_elective_succession_law').GetName|l], они также могут голосовать за кандидатов."
 game_concept_republic_senate: "Сенат"
 game_concept_republic_senate_possessive: "Сената"
 game_concept_voting_session: "Голосование"
 game_concept_voting_sessions: "Голосования"
 game_concept_voting_session_desc: "$game_concept_voting_session$ — это процедура, в ходе которой [Concept('assembly', 'собрание')|E] принимает решение по предложенному [Concept('law', 'закону')|E] или [Concept('republic_decree', 'республиканскому указу')|E].\n\nПока идёт голосование, его участники голосуют за или против предложения в зависимости от уровня своего одобрения. Если до окончания голосования предложение получает необходимое число голосов «за», оно принимается и вступает в силу.\n\nПовысить уровень одобрения можно до начала голосования с помощью [Concept('councillor_task', 'заданий советника')|E] и отдельных [Concept('perks', 'достоинств')|E], а для того, чтобы заставить участника проголосовать так, как вам нужно, можно использовать [Concept('hook', 'рычаг влияния')|E]."
 game_concept_republic_decree: "Республиканский указ"
 game_concept_republic_decrees: "Республиканские указы"
 game_concept_republic_decree_short: "Указ"
 game_concept_republic_decrees_short: "Указы"
 game_concept_republic_decree_desc: "Республиканский указ — [Concept('decision', 'решение')|E], которое должно быть одобрено членами [Concept('assembly', 'собрания')|E] [Concept('republic', 'республики')|E].\n\nРеспубликанские указы бывают различных видов, но большинство из них затрагивают [Concept('patricians', 'патрициев')|E], [Concept('realm_capital', 'столицу державы')|E] или республику в целом."
 game_concept_house_ambition: "Амбиция дома"
 game_concept_house_ambitions: "Амбиции дома"
 game_concept_house_ambition_desc: "У каждого [Concept('house','дома')|E] в [Concept('republic','республике')|E] есть амбиция, показывающая, как члены дома хотят повлиять на республику."
 game_concept_republic_administration: "Республиканская администрация"
 game_concept_republic_administration_short: "Администрация"
 game_concept_republic_administrations: "Республиканская администрация"
 game_concept_republic_administration_desc: "Каждая [Concept('republics', 'республика')|E] имеет свою администрацию, которая определяет, на чём она специализируется.\n\nИзменить администрацию может только [Concept('ruler', 'правитель')|E] республики.\n\nНа выбор предлагается несколько разных администраций с уникальными преимуществами\n\n#help Самые распространённые: [GetLaw( 'republic_type_communal' ).GetName|l], [GetLaw( 'republic_type_maritime' ).GetName|l] и [GetLaw( 'republic_type_civic' ).GetName|l].#!"
 game_concept_republic_senator: "Сенатор"
 game_concept_republic_senators: "Сенаторы"
 game_concept_republic_senator_desc: "$game_concept_republic_senator$ — участник [Concept('assembly', 'собрания')|E], назначенный на эту должность по закону «[GetLaw( 'republic_assembly_composition_roman_senate' ).GetName]».\n\nСенаторов назначает [Concept('ruler', 'правитель')|E] [Concept('republic_possessive', 'республики')|E] или цензор.\n\nПредельное количество сенаторов ограничено и зависит от [Concept('law', 'закона')|E] о размере сената."
 game_concept_mercenary_limit: "Лимит наемников"
 game_concept_mercenary_limit_desc: "Лимит наемников определяет, сколько [Concept('mercenaries','наемников')|E] единовременно может нанять [Concept('character','персонаж')|E].\n\nНа лимит наемников влияют:\n$BULLET_WITH_TAB$[Concept('skill','Навык')|E] [martial_i][Concept('martial','военного дела')|E]\n$BULLET_WITH_TAB$[title_tier_i][title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
 # No tooltip versions
