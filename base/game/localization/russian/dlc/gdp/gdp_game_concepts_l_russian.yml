 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"
 game_concept_company_sentiment_divided_desc: "«Ненасытность» — [Concept('company_sentiment_level', 'курс направления компании')|E] с самой жёсткой конкуренцией. Когда [Concept('company', 'компания')|E] выбирает этот курс, каждый член семейства ставит прибыль превыше всего, даже если это ущемляет интересы остальных.\n\n#bold Эффекты этого курса направления компании:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$Мнение [Concept('merchant_patron', 'покровителя')|E]: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i][Concept('competitiveness', 'Конкурентоспособность')|E]: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] #EMP #V $unity_regional_networks_decision$#!#!"
 game_concept_company_sentiment_fractious_desc: "По остроте конкуренции [Concept('company_sentiment_level', 'курс направления компании')|E] «Оппортунизм» уступает лишь курсу «[Concept('rapacious', 'Ненасытность')|E]». Когда [Concept('company', 'компания')|E] выбирает этот курс, члены семейства ставят личные интересы выше долга перед семьёй.\n\n#bold Эффекты этого [Concept('company_sentiment_level', 'курса направления компании')|E]:#!\n$EFFECT_LIST_BULLET$Мнение [Concept('house', 'дома')|E]: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i][Concept('competitiveness', 'Конкурентоспособность')|E]: #P +10%#!\n$EFFECT_LIST_BULLET$[Concept('associates','Помощники')|E] более охотно покинут [Concept('company', 'компанию')|E], став целью [Concept('interaction', 'взаимодействия')|E] «#V Пригласить в компанию#!»\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Организовать сеть интриг#!#!»"
 game_concept_company_sentiment_independent_desc: "«Баланс» занимает среднее положение среди [Concept('company_sentiment_level', 'курсов направления компании')|E]. Когда [Concept('company', 'компания')|E] выбирает этот курс, семейству по-прежнему нужен номинальный глава, но его члены вольны вести собственные дела без вмешательства и осуждения.\n\n#bold Эффекты этого [Concept('company_sentiment_level', 'курса направления компании')|E]:#!\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Дать советы представителям дома#!#!»"
 game_concept_company_sentiment_cooperative_desc: "«Скупость» — [Concept('company_sentiment_level', 'курс направления компании')|E], ориентированный прежде всего на укрепление легитимности. В этом отношении его превосходит лишь курс «[Concept('ennobled', 'Благородство')|E]». Когда [Concept('company', 'компания')|E] выбирает этот курс, её репутация становится неотделима от репутации её членов, и каждый из них должен стремиться укреплять своё доброе имя и повышать положение в обществе.\n\n#bold Эффекты этого [Concept('company_sentiment_level', 'курса направления компании')|E]:#!\n$EFFECT_LIST_BULLET$Мнение [Concept('house', 'дома')|E]: #P +10#!\n$EFFECT_LIST_BULLET$Ежемесячный прирост опыта на [Concept('lifestyle', 'жизненном пути')|E]: #P +5%#!\n$EFFECT_LIST_BULLET$[Concept('prestige', 'Престиж')|E] в месяц: #P +10%#!\n$EFFECT_LIST_BULLET$Члены [Concept('house', 'дома')|E], назначенные [Concept('traders', 'приказчиками')|E], чаще предлагают [Concept('trade_opportunities', 'торговые возможности')|E]\n$EFFECT_LIST_BULLET$Жалование [Concept('deputy','сотрудника')|E] снижено: #P -50%#!\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Поддержать процветание#!#!»\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Поддержать местную власть#!#!»"
 game_concept_company_sentiment_concerted_desc: "«Благородство» — [Concept('company_sentiment_level', 'курс направления компании')|E], при котором укреплению легитимности уделяется наибольшее внимание. Когда [Concept('company', 'компания')|E] выбирает этот курс, верность, основанная на чувстве долга и уважении, объединяет интересы всей компании с интересами её главы, а сама компания может встать вровень со знатными семьями.\n\n#bold Эффекты этого [Concept('company_sentiment_level', 'курса направления компании')|E]:#!\n$EFFECT_LIST_BULLET$Мнение [Concept('house', 'дома')|E]: #P +20#!\n$EFFECT_LIST_BULLET$[Concept('prestige', 'Престиж')|E] в месяц: #P +25%#!\n$EFFECT_LIST_BULLET$Члены [Concept('house', 'дома')|E] могут использовать происки «[GetScheme('befriend').GetTypeName]» в отношении друг друга\n$EFFECT_LIST_BULLET$Члены [Concept('house', 'дома')|E], назначенные [Concept('traders', 'приказчиками')|E], чаще предлагают [Concept('trade_opportunities', 'торговые возможности')|E]\n$EFFECT_LIST_BULLET$Жалованье [Concept('deputy','сотрудника')|E] #EMP значительно#! снижено: #P -85%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Формализовать семейный подряд#!#!»\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Поддержать процветание#!#!»\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] «#EMP #V Поддержать местную власть#!#!»"
 game_concept_company_sentiment_positive_actions: "Легитимизирующие действия"
 game_concept_company_sentiment_positive_actions_desc: "Действия вашей [Concept('company', 'компании')|E], укрепляющие её легитимность, сдвигают [Concept('company_sentiment', 'направление компании')|E] в сторону состояния «[company_sentiment_concerted_i][Concept('company_sentiment_concerted', 'Благородство')|E]».\n\n[Concept('house_heads', 'Главы домов')|E] могут принять [Concept('decision', 'решение')|E] «#V Поддержать излишества#!», чтобы значительно сдвинуть [Concept('company_sentiment', 'направление компании')|E] в сторону состояния «[company_sentiment_concerted_i][Concept('company_sentiment_concerted', 'Благородство')|E]».\n\n#weak Примеры положительных действий:$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "Действия в интересах прибыли"
 game_concept_company_sentiment_negative_actions_desc: "Действия вашей [Concept('company', 'компании')|E] в интересах прибыли сдвигают [Concept('company_sentiment', 'направление компании')|E] в сторону состояния «[company_sentiment_divided_i][Concept('company_sentiment_divided', 'Ненасытность')|E]».\n\n[Concept('house_heads', 'Главы домов')|E] могут принять [Concept('decision', 'решение')|E] «#V Поддержать усердие#!», чтобы значительно сдвинуть [Concept('company_sentiment', 'направление компании')|E] в сторону состояния «[company_sentiment_divided_i][Concept('company_sentiment_divided', 'Ненасытность')|E]».\n\n#weak Примеры действий в интересах прибыли:$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ между домом и дворянским семейством\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ Выполнение просьбы помощника\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ с другим купеческим домом\n$EFFECT_LIST_BULLET$ Пригласить в компанию\n$EFFECT_LIST_BULLET$ Невыполнение просьбы помощника\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$"
 game_concept_republican_army: "Республиканская армия"
 game_concept_republican_armies: "Республиканские армии"
 game_concept_republican_army_desc: "Республиканская армия — [Concept('army', 'армия')|E], которую набирает и содержит [Concept('realm', 'держава')|E] с [Concept('republican', 'республиканской')|E] [Concept('government', 'формой правления')|E].\n\nВ её состав входят только [Concept('title_men_at_arms', 'титулярные профессионалы')|E], а подчиняется она действующему [Concept('liege', 'сюзерену')|E]."
