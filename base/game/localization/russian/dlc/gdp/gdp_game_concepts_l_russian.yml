 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "Хартия — [Concept('artifact', 'артефакт')|E] в виде документа, который [Concept('merchant_patron', 'покровитель')|E] выдаёт одному из своих [Concept('clients', 'клиентов')|E].\n\nКупцам, имеющим при себе хартии с печатью своего покровителя, доступны:\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] #EMP #V Злоупотребить авторитетом хартии#!#!\n$EFFECT_LIST_BULLET$[Concept('decision', 'Решение')|E] #EMP #V Направить местные инвестиции#!#!\n$EFFECT_LIST_BULLET$[Concept('interaction', 'Взаимодействие')|E] #EMP #V Воспользоваться авторитетом покровителя#!#!"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "«$game_concept_make_a_request$» — это [Concept('interaction','взаимодействие')|E], позволяющее попросить [Concept('merchant_patron','покровителя')|E] об услуге, финансовой или иной поддержке."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "«Просьба об изменении договора» — [Concept('interaction', 'взаимодействие')|E], с помощью которого [Concept('vassal', 'вассал')|E], [Concept('tributary', 'данник')|E] или [Concept('client', 'клиент')|E] может договориться со своим [Concept('liege', 'сюзереном')|E] или [Concept('suzerain', 'повелителем')|E] о пересмотре своих обязательств."
 game_concept_leading_title: "Главный титул"
 game_concept_leading_title_desc: "[Concept('title', 'Титул')|E], означающий руководящую должность в конфедерации соответствующего типа, например в [Concept('trade_league', 'торговой лиге')|E].\n\n[Concept('holder', 'Владетель')|E] главного титула является [Concept('trade_league_leader', 'лидером торговой лиги')|E]."
 game_concept_client_contract: "Клиентские договоры"
 game_concept_client_contracts: "Клиентские договоры"
 game_concept_client_contract_desc: "Клиентские договоры регулируют [Concept('obligations', 'обязательства')|E] между [Concept('client', 'клиентом')|E] и его [Concept('merchant_patron', 'покровителем')|E].\n\nСтороны могут договориться о четырёх видах обязательств: доле доходов от [Concept('trade', 'торговли')|E], выплачиваемой покровителю; поддержке покровителя, повышающей [Concept('prestige', 'престиж')|E]; поддержке [Concept('trade_competitiveness', 'конкурентоспособности торговли')|E]; содействии купеческой семье в заключении [Concept('marriages', 'браков')|E].\n\nДоговор переходит по наследству и может быть расторгнут только в том случае, если купец перенесёт свою [Concept('company', 'компанию')|E] в другое [Concept('holding', 'владение')|E]."
 game_concept_member_title: "Титул участника"
 game_concept_member_title_desc: "[Concept('title', 'Титул')|E], означающий участие в конфедерации соответствующего типа, например в [Concept('trade_league', 'торговой лиге')|E]."
 game_concept_company_sentiment: "Направление компании"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "Направление компании"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "Направление"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "Направление компании отражает методы работы [Concept('merchant_family_possessive', 'торгового семейства')|E] и отношение его членов друг к другу.\n\nСуществует несколько [Concept('company_sentiment_levels', 'курсов направления компании')|E]. Каждый из них даёт членам [Concept('house', 'дома')|E] определённые бонусы и штрафы.\n\nНаправление компании меняется в зависимости от действий компании в целом. [Concept('company_sentiment_positive_actions', 'Положительные действия')|E] обычно сдвигают этот показатель в сторону состояния «[company_sentiment_concerted_i][Concept('company_sentiment_concerted', 'Благородство')|E]», а [Concept('company_sentiment_negative_actions', 'отрицательные действия')|E] — в сторону состояния «[company_sentiment_divided_i][Concept('company_sentiment_divided', 'Ненасытность')|E]».\n\n[Concept('house_heads', 'Главы домов')|E] обычно оказывают большее влияние на этот показатель в своём доме, чем остальные его члены."
 game_concept_company_sentiment_level: "Курс направления компании"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "Курсы направления компании"
 game_concept_company_sentiment_level_desc: "Курс — текущее состояние [Concept('company_sentiment', 'направления компании')|E]. Он меняется по мере того, как [Concept('company_sentiment_positive_actions', 'положительные действия')|E] сдвигают этот показатель в сторону состояния «[company_sentiment_concerted_i][Concept('company_sentiment_concerted', 'Благородство')|E]», а [Concept('company_sentiment_negative_actions', 'отрицательные действия')|E] — в сторону состояния «[company_sentiment_divided_i][Concept('company_sentiment_divided', 'Ненасытность')|E]». Каждый курс даёт членам [Concept('house', 'дома')|E] свои бонусы и штрафы.\n\nВсего существует пять курсов:\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i][Concept('company_sentiment_divided', 'Ненасытность')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i][Concept('company_sentiment_fractious', 'Оппортунизм')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i][Concept('company_sentiment_independent', 'Баланс')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i][Concept('company_sentiment_cooperative', 'Скупость')|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i][Concept('company_sentiment_concerted', 'Благородство')|E]"
