 GENERIC_HANSE_NAME: "Ганзейский город [hanse_lead_town.GetName]"
 gdp_burgher.0001.desc: "Мы, [burgher_county.Custom('BurgherPluralNoun')|l] владения [burgher_county.GetNameNoTierNoTooltip] требуем новых привелегий. [burgher_county.Custom('BurgherDemandedPrivilege')] — залог процветания нашего города, которое будет выгодно всей вышей державе."
 gdp_burgher.0001.a: "Ваша просьба разумна. Я поставлю под ней свою печать."
 gdp_burgher.0001.b: "Я отказываюсь!"
 gdp_burgher.0001.opening: "[Select_CString(ROOT.Char.IsFemale, 'Любезная госпожа', 'Любезный господин' )]!"
 gdp_burgher.0010.desc: "Мы, [burgher_county.Custom('BurgherPluralNoun')|l] владения [burgher_county.GetNameNoTierNoTooltip] просим даровать нам право на самоуправление, выбирать своих лидеров и вести дела от своего имени, а иначе мы будем вынуждены взять силой то, чего не получили вашей милостью."
 gdp_burgher.0010.a: "Дать им свободу."
 gdp_burgher.0010.b: "Пусть сразятся за свои #EMP «права»#!."
 gdp_burgher.0020.t: "Свобода города [freed_county.GetNameNoTierNoTooltip]"
 gdp_burgher.0020.desc: "Город [freed_county.GetNameNoTier] завоевал свою независимость, а с ней и право на самоуправление и назначение собственных магистратов.\n\nНо ничего из этого не произошло бы без #EMP моей#! поддержки."
 gdp_burgher.0020.desc.assembly_head: "Город [freed_county.GetNameNoTier] завоевал свою независимость, а с ней и право на самоуправление и назначение собственных магистратов.\n\nНо ничего из этого не произошло бы без #EMP моей#! поддержки."
 gdp_burgher.0020.a: "Я охотно соглашусь принять бремя лидерства."
 gdp_burgher.0020.b: "Я займу своё место среди магнатов."
 gdp_burgher.0020.c: "Их хорошее отношение выгодно само по себе."
 gdp_burgher_agitator_not_republic_head_tt: "Вы #bold не#! должны быть главой [Concept('republic', 'республики')|E]"
 gdp_burgher_agitator_outranks_republic_head_tt: "Вы должны обладать меньшим [Concept('title_tier', 'уровнем титула')|E], чем [burgher_ruler.GetTitledFirstName]"
 gdp_civic_agitation.0001.t: "Пламя свободы вспыхнуло"
 gdp_civic_agitation.0001.desc: "Всё встало на свои места. Жители города [target.GetNameNoTier] загорелись идеей гражданских свобод, подброшенной моими соучастниками, а их лидеры толкают страстные речи на рыночной площади, обличая неподъёмные налоги и несправедливых магистратов.\n\nГоворят, они собирают делегацию к своему правителю, чтобы потребовать права на самоуправление. Вопрос лишь в том, ехать ли с ними мне."
 gdp_civic_agitation.0001.a: "Когда заходишь так далеко, остаётся только идти до конца."
 gdp_civic_agitation.0001.b: "Они должны ехать при оружии, и я дам им его за свой счёт."
 gdp_civic_agitation.0001.c: "Пусть толпа считает это своей идеей. Нужные люди всё знают."
 gdp_civic_agitation.0001.c.exposed: "Наслаждаться моментом и ничего не обещать"
 gdp_civic_agitation_sponsor_joins_war_tt: "В случае отказа правителя [agitated_county.Custom('BurgherPluralNoun')] начнут [Concept('war', 'войну')|E], и вы их поддержите"
 gdp_civic_agitation_sponsor_war_chest_tt: "Вы оплатите отряд профессиональных солдат на случай, если начнётся война"
 gdp_civic_agitation.0002.t: "Пустые траты"
 gdp_civic_agitation.0002.desc: "Мои люди составили список обид, зачитали перед жителями города [target.GetNameNoTier], их лидеры собрались и #EMP ничего не сделали#!.\n\nМои соучастники не знают, что именно произошло. Остаётся только признать очевидное. На мои деньги удалось купить всё необходимое кроме решимости #EMP воспользоваться#! этим."
 gdp_civic_agitation.0002.a: "Я нескоро забуду об этом трусливом вероломстве."
 found_the_hanseatic_league_decision: "Основать Ганзейскую лигу"
 found_the_hanseatic_league_decision_tooltip: "Объединить [Concept('counties', 'графства')|E] вашей [Concept('trade_league', 'торговой лиги')|E] в ещё более могучую торговую конфедерацию"
 found_the_hanseatic_league_decision_confirm: "В согласии мы обретём процветание"
 found_the_hanseatic_league_decision_desc: "Короли воображают, будто власть носит корону и меч. Но мы знаем иную правду. Власть приходит в мехах, от неё пахнет рыбой, а в руках у неё книги учёта с суммами, способными разорить королевства.\n\nПоодиночке нас облагают налогами, грабят, заставляют подчиняться угрозами. Но если мы объединимся, перед нами не устоит ни одна сила в северных морях. Ни одна гавань не откажет нашим кораблям, ни один торговец не сможет перебить цену на наши товары, и ни один князь не посягнёт на наши привилегии."
 found_the_hanseatic_league_cohesion_tt: "[Concept('cohesion', 'Сплоченность')|E] [Concept('trade_league', 'торговой лиги')|E] должна быть не менее #V 95#!"
 found_the_hanseatic_league_members_tt: "В [Concept('trade_league', 'торговой лиге')|E] должно быть не менее #V 4#! участников"
 found_the_hanseatic_league_message_title: "Рождение Ганзы"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U] [Select_CString( hanse_founder.IsLocalPlayer, 'объединили', Select_CString( hanse_founder.IsFemale, 'объединила', 'объединил' ) )] лигу в Ганзейский союз."
 league_needs_liege_consent_tt: "Поскольку вы [Concept('vassal', 'вассал')|E], для присоединения вам требуется согласие [Concept('liege', 'сюзерена')|E] или вольный город"
 gdp_hanseatic.0010.opening: "[the_league.GetName] приветствует вас."
 gdp_hanseatic.0010.desc: "Вы владеете торговыми правами от собственного имени и только в своих интересах.\n\nПодобные личные соглашения подрывают нашу торговлю. Мы просим вас передать эти права нам, чтобы мы могли вместе достичь процветания."
 gdp_hanseatic.0010.a: "[the_league.GetName] получит эти права."
 gdp_hanseatic.0010.b: "Я дарую их городу [hanse_city_title.GetNameNoTier]."
 gdp_hanseatic.0010.c: "Эти права мои #EMP и останутся моими#!."
