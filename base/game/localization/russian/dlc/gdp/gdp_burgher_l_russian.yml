 burgher_war: "$BURGHER_WAR_CB_NAME$"
 BURGHER_WAR_CB_NAME: "Война за гражданские свободы"
 burgher_refusal_revolt_war_tt: "[Concept('faction', 'Фракция')|E] гражданской автономии начинает [Concept('war', 'войну')|E] с [Concept('casus_belli', 'казус белли')|E] #V Война за гражданские свободы#!\nВ случае победы: $burgher_war_victory_desc$"
 burgher_refusal_revolt_war_free_city_tt: "[Concept('faction', 'Фракция')|E] гражданской автономии начинает [Concept('war', 'войну')|E] с [Concept('casus_belli', 'казус белли')|E] #V Война за гражданские свободы#!\nВ случае победы: $burgher_war_victory_free_city_desc$"
 burgher_refusal_revolt_outcome_war_tt: "Города берутся за оружие"
 burgher_refusal_revolt_outcome_calm_tt: "Городам не хватает решимости"
 burgher_civic_league_formed_tt: "[Concept('counties', 'Графства')|E] образуют #V торговую лигу#!"
 burgher_self_rule_free_city_tt: "Новая [Concept('republic', 'республика')|E] изначально имеет: [GetSubjectContractType('republic_government_free_city').GetObligationName('republic_government_free_city_granted')|V]"
 burgher_self_rule_chartered_city_tt: "Новая [Concept('republic', 'республика')|E] изначально имеет: [GetSubjectContractType('republic_government_free_city').GetObligationName('republic_government_free_city_chartered')|V]"
 burgher_self_rule_new_capital_tt: "Новая [Concept('republic', 'республика')|E] размещает [Concept('capital', 'столицу')|E] во владении [burgher_new_capital.GetNameNoTier]"
 BURGHER_WAR_NAME: "[ATTACKER.GetCulture.GetCollectiveNounNoTooltip]ое гражданское восстание"
 burgher_war_victory_desc: "Каждое мятежное [Concept('county', 'графство')|E] становится [Concept('republic', 'республикой')|E] с самоуправлением, получает договор «[GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|V]» и при необходимости переносит свою [Concept('capital', 'столицу')|E] в крупнейший город [Concept('county', 'графства')|E]. Если их три или более, они образуют #V торговую лигу#!"
 burgher_war_victory_free_city_desc: "Каждое мятежное [Concept('county', 'графство')|E] становится [Concept('republic', 'республикой')|E] с самоуправлением, получает договор «[GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|V]» и при необходимости переносит свою [Concept('capital', 'столицу')|E] в крупнейший город [Concept('county', 'графства')|E]. Если их три или более, они образуют #V торговую лигу#!"
 burgher_war_white_peace_desc: "[Concept('faction', 'Фракция')|E] расформирована, ведущее [Concept('county', 'графство')|E] получает небольшие гражданские привилегии. Графства фракции не смогут повторно создать [Concept('faction', 'фракцию')|E] гражданской автономии в следующие [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] л."
 burgher_war_defeat_desc: "[Concept('faction', 'Фракция')|E] расформирована, каждое мятежное [Concept('county', 'графство')|E] теряет все свои гражданские привилегии, а его [Concept('popular_opinion', 'народное мнение')|E] снижается. Графства фракции не смогут повторно создать [Concept('faction', 'фракцию')|E] гражданской автономии в следующие [EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0] л."
 burgher_war_ended_invalid.desc: "Война за гражданские свободы недействительна: у [Concept('faction', 'фракции')|E] гражданской автономии больше нет лидера!"
 civic_privileges_county_modifier: "Гражданские привилегии"
 civic_privileges_county_modifier_desc: "Этому графству было даровано несколько незначительных гражданских привилегий, но ни одна не была вписана в хартию."
 civic_privilege_market_rights_1_county_modifier: "Ограниченные рыночные права"
 civic_privilege_market_rights_1_county_modifier_desc: "Этому графству было даровано право вести торговлю на своём рынке под надзором сюзерена."
 civic_privilege_market_rights_2_county_modifier: "Рыночные права"
 civic_privilege_market_rights_2_county_modifier_desc: "Этому графству были дарованы собственные рыночные дни, свои весы и право оставлять за собой немалую долю в торговле."
 civic_privilege_market_rights_3_county_modifier: "Обширные рыночные права"
 civic_privilege_market_rights_3_county_modifier_desc: "Этому графству был предоставлен почти полный контроль над своим рынком, и сюзерен получает лишь малую долю от торговли."
 civic_privilege_guild_rights_1_county_modifier: "Ограниченные права гильдий"
 civic_privilege_guild_rights_1_county_modifier_desc: "Ремесленникам этого графства было даровано право на организацию, хотя мастера всё равно несут ответ перед двором сюзерена."
 civic_privilege_guild_rights_2_county_modifier: "Права гильдий"
 civic_privilege_guild_rights_2_county_modifier_desc: "Гильдии этого графства получили право задавать собственные стандарты и принимать своих мастеров."
 civic_privilege_guild_rights_3_county_modifier: "Обширные права гильдий"
 civic_privilege_guild_rights_3_county_modifier_desc: "Гильдиям этого графства был дарован почти полный контроль над ремёслами и своей продукцией."
 civic_privilege_tax_exemption_1_county_modifier: "Частичное освобождение от налогов"
 civic_privilege_tax_exemption_1_county_modifier_desc: "Городу этого графства было даровано частичное послабление обязательств перед сюзереном."
 civic_privilege_tax_exemption_2_county_modifier: "Освобождение от налогов"
 civic_privilege_tax_exemption_2_county_modifier_desc: "Город этого графства получил право самостоятельно собирать налоги и определять их размер."
 civic_privilege_tax_exemption_3_county_modifier: "Обширное освобождение от налогов"
 civic_privilege_tax_exemption_3_county_modifier_desc: "Город этого графства освобождён почти от всех налогов и платит почти символическую сумму."
 civic_privilege_militia_charter_1_county_modifier: "Ограниченная военная хартия"
 civic_privilege_militia_charter_1_county_modifier_desc: "Городу этого графства было даровано право содержать собственную стражу при условии, что она не будет выходить за стены города."
 civic_privilege_militia_charter_2_county_modifier: "Военная хартия"
 civic_privilege_militia_charter_2_county_modifier_desc: "Городу этого графства было даровано право собирать собственное ополчение и отправлять на призыв сюзерена меньшее количество войск."
 civic_privilege_militia_charter_3_county_modifier: "Обширная военная хартия"
 civic_privilege_militia_charter_3_county_modifier_desc: "Городу этого графства было даровано право самостоятельно вооружать себя и присылать сюзерену чисто символическое количество солдат."
 burgher_grievance_county_modifier: "Гражданские обиды"
 burgher_grievance_county_modifier_desc: "Требования этого графства были отклонены, и оно отказывается забывать об этом."
 gdp_civic_agitation_county_modifier: "Гражданская агитация"
 gdp_civic_agitation_county_modifier_desc: "Внешние силы начинают настраивать это графство против правителя."
 gdp_civic_agitation_popular_republic_modifier: "Глас народа"
 gdp_civic_agitation_popular_republic_modifier_desc: "Эти происки поддерживает [GetLaw('republic_type_popular').GetName] вместе со своим главой — истинным маяком гражданских свобод."
 bestow_civic_liberties_interaction: "Даровать гражданские свободы"
 bestow_civic_liberties_options_heading: "Даруемая свобода"
 bestow_civic_liberties_option_market_rights: "Рыночные права"
 bestow_civic_liberties_option_guild_rights: "Права гильдий"
 bestow_civic_liberties_option_tax_exemption: "Освобождение от налогов"
 bestow_civic_liberties_option_militia_charter: "Военная хартия"
 bestow_civic_liberties_interaction_desc: "Даровать гражданскую привилегию одному из своих [Concept('counties', 'графств')|E] и увеличить [Concept('popular_opinion', 'народное мнение')|E] в нём"
 bestow_civic_liberties_no_charter_left_tt: "У этого [Concept('county', 'графства')|E] должны оставаться неполученные привилегии"
 agitate_civic_unrest_interaction: "Разжечь гражданские беспорядки"
 agitate_civic_unrest_interaction_desc: "Попытаться разжечь подтолкнуть одно из [Concept('counties', 'графств')|E], правитель которого — [recipient.GetShortUINameNoTooltip], к требованию самоуправления. В случае отказа графство начнёт [Concept('war', 'войну')|E] с [Concept('casus_belli', 'казус белли')|E] #V Война за гражданские свободы#!"
 agitate_civic_unrest_eligible_tt: "У вас должна быть возможность начать [Concept('scheme', 'происки')|E] по #V разжиганию гражданских беспорядков#! в отношении этого [Concept('county', 'графства')|E]"
 revoke_civic_liberties_interaction: "Отнять гражданские свободы"
 revoke_civic_liberties_interaction_desc: "Отнять все гражданские привилегии у одного из ваших [Concept('counties', 'графств')|E] ценой значительного падения [Concept('popular_opinion', 'народного мнения')|E]"
 revoke_civic_liberties_authority_tt: "Ваш [Concept('crown_authority', 'авторитет короны')|E] должен быть не ниже, чем [GetLaw('crown_authority_1').GetName]"
 revoke_civic_liberties_no_privileges_tt: "У этого [Concept('county', 'графства')|E] должна быть гражданская привилегия, которую можно отнять"
 gdp_civic_agitation_scheme: "Разжечь гражданские беспорядки"
 gdp_civic_agitation_scheme_action: "Разжечь гражданские беспорядки в графстве"
 gdp_civic_agitation_scheme_desc: "Я подтолкну добрых людей владения [SCHEME.GetTargetTitle.GetBaseNameNoTier] к требованию права на самоуправление, которого они явно заслуживают!"
 gdp_civic_agitation_scheme_desc_general: "$gdp_civic_agitation_scheme$ — это [Concept('hostile_scheme', 'агрессивные происки')|E] с целью побудить [Concept('county', 'графство')|E] потребовать у своего [Concept('ruler', 'правителя')|E] право на самоуправление. Это [Concept('secret_scheme', 'тайные происки')|E], основанные на [Concept('intrigue', 'интригах')|E], к которым можно привлекать [Concept('agents', 'соучастников')|E].\n\nУспешное разжигание гражданских беспорядков приведёт к тому, что выбранное [Concept('county', 'графство')|E] создаст [Concept('faction', 'фракцию')|E] гражданской автономии. Если [Concept('liege', 'сюзерен')|E] отклонит требования, фракция начнёт [Concept('war', 'войну')|E].\n\nАгитацию в пользу этих происков может вести глава народной республики, а также любой [Concept('merchant', 'торговец')|E]. Каждая [Concept('republic', 'республика')|E], освобождённая ими, станет народной. Главам других [Concept('republic', 'республик')|E] требуется [Concept('patrician_rating', 'ранг патриция')|E] не менее [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V], а [Concept('house_heads', 'главам домов')|E] других [Concept('republican', 'республик')|E] — не менее [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]."
 gdp_civic_agitation_scheme_desc_success: "Выбранное [Concept('county', 'графство')|E] создаёт [Concept('faction', 'фракцию')|E] гражданской автономии и требует самоуправления"
 gdp_civic_agitation_scheme_discovery_desc: "Ваше участие в попытке спровоцировать [Concept('county', 'графство')|E] осталось нераскрытым"
 gdp_civic_agitation_scheme_invalidated_title: "@scheme_icon! Происки по разжиганию гражданских беспорядков завершаются"
 gdp_civic_agitation_scheme_invalidated_desc: "[Concept('scheme', 'Происки')|E] по разжиганию гражданских беспорядков больше не действуют"
 SCHEME_TARGET_COUNTY_POPULAR_OPINION: "[Concept('popular_opinion','Народное мнение')|E]: $VALUE|+0=$"
 SCHEME_TARGET_COUNTY_PROSPERITY: "[Concept('county_prosperity', 'Процветание')|E]: $VALUE|+0=$"
 SCHEME_TARGET_COUNTY_CONTROL: "[Concept('county_control', 'Контроль над графством')|E]: $VALUE|+0=$"
