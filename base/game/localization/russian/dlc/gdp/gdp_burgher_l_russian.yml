 SCHEME_OWNER_LEAGUE_COHESION: "[Concept('league_cohesion', 'Сплочённость')|E] вашей [Concept('trade_league', 'торговой лиги')|E]: $VALUE|+0=$"
 gdp_civic_agitation_odds_target_intrigue: "[Concept('intrigue', 'Навык интриги')|E] [Concept('holder', 'владетеля')|E] титула [target.GetName]"
