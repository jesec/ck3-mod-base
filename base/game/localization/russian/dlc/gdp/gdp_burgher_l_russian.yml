 gdp_caught_agitating_modifier_desc: "Этого персонажа поймали за попыткой разжечь недовольство другим [Concept('ruler', 'правителем')|E]. Естественно, что остальные [Concept('rulers', 'правители')|E] отнеслись к этому с осуждением."
 merchant_civic_advantage_modifier: "Гражданский спонсор"
 merchant_civic_advantage_modifier_desc: "Этот персонаж поддержал стремление к гражданским свободам и снискал расположение народа. Подобные настроения могут обернуться хорошей прибылью."
