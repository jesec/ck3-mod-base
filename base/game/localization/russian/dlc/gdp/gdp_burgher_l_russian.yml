 building_type_hanseatic_kontor_01: "Контора"
 building_type_hanseatic_kontor_01_desc: "Ганзейские торговцы в этой конторе живут по собственным законам и работают допоздна. Ученикам разрешено вступать в брак только по возвращении домой."
