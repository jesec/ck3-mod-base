l_russian:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "Низкое народное мнение: общественные волнения"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "Низкое народное мнение: кризис в городе"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "Высокое народное мнение: благие настроения"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "Высокое народное мнение: процветающий город"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "Экономический застой"
 gdp_popular_opinion_mild_neg_prosperity_desc: "Народное недовольство привело к тому, что горожане неохотно инвестируют в город, замедляя его экономический рост."
 gdp_popular_opinion_mild_neg_taxes: "Уклонение от налогов"
 gdp_popular_opinion_mild_neg_taxes_desc: "Недовольные горожане различными способами уклоняются от уплаты налогов, что сокращает доходы со всех районов."
 gdp_popular_opinion_mild_neg_construction: "Задержки в строительстве"
 gdp_popular_opinion_mild_neg_construction_desc: "Рабочие и ремесленники сотрудничают с большой неохотой, из-за чего увеличиваются затраты и замедляется строительство."
 gdp_popular_opinion_mild_neg_defense: "Незащищённые стены"
 gdp_popular_opinion_mild_neg_defense_desc: "Горожане не желают заступать на службу в гарнизон, из-за чего на стенах города не хватает дозорных."
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "Экономический крах"
 gdp_popular_opinion_severe_neg_prosperity_desc: "Массовые беспорядки подорвали экономику города. Развитие застопорилось, а горожане беднеют на глазах."
 gdp_popular_opinion_severe_neg_taxes: "Налоговый бунт"
 gdp_popular_opinion_severe_neg_taxes_desc: "Жители всех районов прямо отказываются платить налоги, что резко сокращает городские доходы."
 gdp_popular_opinion_severe_neg_construction: "Забастовки строителей"
 gdp_popular_opinion_severe_neg_construction_desc: "Ремесленники и мастера отказываются работать. Строительство стало чрезвычайно медленным и дорогостоящим."
 gdp_popular_opinion_severe_neg_defense: "Дезертиры в гарнизоне"
 gdp_popular_opinion_severe_neg_defense_desc: "Солдаты отказываются нести службу и покидают свои посты. Город остался практически без защиты."
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "Вложения горожан"
 gdp_popular_opinion_mild_pos_prosperity_desc: "Уверенное в своем будущем население охотно способствует долгосрочному процветанию города."
 gdp_popular_opinion_mild_pos_taxes: "Довольные налогоплательщики"
 gdp_popular_opinion_mild_pos_taxes_desc: "Горожане послушно платят налоги, отчего доход со всех районов города увеличивается."
 gdp_popular_opinion_mild_pos_construction: "Общественный энтузиазм"
 gdp_popular_opinion_mild_pos_construction_desc: "Ремесленники стремятся внести свой вклад в развитие города, отчего проводить работы стало быстрее и дешевле."
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "Золотой век процветания"
 gdp_popular_opinion_strong_pos_prosperity_desc: "Город полон оптимизма. Жители и торговцы активно вкладываются в экономику, способствуя устойчивому развитию."
 gdp_popular_opinion_strong_pos_taxes: "Переполненная казна"
 gdp_popular_opinion_strong_pos_taxes_desc: "Жители всех районов искренне гордятся своим городом, даже не помышляя о том, чтобы уклоняться от уплаты налогов."
 gdp_popular_opinion_strong_pos_construction: "Шедевры архитектуры"
 gdp_popular_opinion_strong_pos_construction_desc: "Лучшие мастера борются за честь работать в городе, отчего каждый новый проект осуществляется ещё быстрее и дешевле."
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "Осторожные торговцы"
 gdp_popular_opinion_mild_neg_sell_price_desc: "Волнения в городе насторожили торговцев, отчего они убирают лучшие товары с прилавков и снижают цены на остальные."
 gdp_popular_opinion_mild_neg_capacity: "Сомнения торговцев"
 gdp_popular_opinion_mild_neg_capacity_desc: "Доверие к властям города упало, отчего некоторые торговцы стали меньше появляться на рынке."
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "Паника на рынке"
 gdp_popular_opinion_severe_neg_sell_price_desc: "Цены на рынке резко упали — из-за кризиса в городе торговцы спешат поскорее распродать остатки товара."
 gdp_popular_opinion_severe_neg_capacity: "Уход с рынка"
 gdp_popular_opinion_severe_neg_capacity_desc: "Город решили покинуть видные торговцы, отчего рынок значительно сократился."
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "Уверенные торговцы"
 gdp_popular_opinion_mild_pos_sell_price_desc: "Торговцы чувствуют уверенность в завтрашнем дне, и цены по всему рынку слегка повысились."
 gdp_popular_opinion_mild_pos_capacity: "Растущий рынок"
 gdp_popular_opinion_mild_pos_capacity_desc: "Оптимистичные настроения привлекают в город новых торговцев, отчего емкость рынка постепенно увеличивается."
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "Оживленная торговля"
 gdp_popular_opinion_strong_pos_sell_price_desc: "Благодаря исключительной гражданской гордости местный рынок стал символом качественных товаров и выгодных цен."
 gdp_popular_opinion_strong_pos_capacity: "Процветающий рынок"
 gdp_popular_opinion_strong_pos_capacity_desc: "Престижная репутация города привлекает торговцев со всех уголков мира, отчего емкость рынка значительно увеличилась."
