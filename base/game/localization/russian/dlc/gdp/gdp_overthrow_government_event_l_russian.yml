l_russian:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "Государственный переворот"
 overthrow_government_outcome.1001.desc: "Заговор достиг своей развязки. Настал решающий час. Наши люди уже проникли в казармы городской стражи, собрание и дворец. Стоит мне отдать приказ — и они возьмут под контроль все рычаги власти, сокрушив старый порядок.\n\nЗавтра собранию не останется ничего, кроме как признать новую власть и объявить моих противников врагами государства."
 overthrow_government_outcome.1001.a: "Никакой крови. Никаких изгнанников."
 overthrow_government_outcome.1001.b: "Мои враги заплатят."
 overthrow_government_outcome.1001.c: "Нужно избавиться от всех, кто нам противится."
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "Республика устояла"
 overthrow_government_outcome.1002.desc: "Заговор, который [Select_CString(owner.IsFemale, 'устроила эта коварная', 'устроил этот коварный')] [owner.GetShortUINameNoTooltip] и мои патриции, раскрыт. К счастью, попытка переворота налетела на несокрушимые устои моей власти!\n\nМятежники пытались захватить меня, но моя стража отбила нападение. Несмотря на все их происки, собрание и армия сохранили верность законному правительству."
 overthrow_government_outcome.1002.a: "Арестовать их всех!"
 overthrow_government_outcome.1002.b: "Я разберусь с ними чуть позже."
 overthrow_government_outcome.1002.c: "Я найду в себе силы простить их."
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName] и [Concept('agents', 'соучастники')|E] будут помилованы, перестанут считаться [Concept('criminal', 'преступниками')|E] и больше не будут врагами государства"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "Свержение"
 overthrow_government_outcome.1003.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин')]!» — кричит [craftsman_character.GetShortUINameNoTooltip], врываясь в комнату с таким видом, будто [craftsman_character.GetSheHe] только что [Select_CString(craftsman_character.IsFemale, 'спасалась', 'спасался')] бегством от верной смерти.\n\n«Заговор! Измена! [owner.GetShortUINameNoTooltip] [Select_CString(owner.IsFemale, 'собрала', 'собрал')] сторонников и добивается, чтобы собрание объявило вас врагом государства! Громилы уже идут сюда!»\n\n[craftsman_character.GetSheHe|U] мечется по комнате, словно зверь в клетке. «Что нам делать?» — спрашивает [craftsman_character.GetSheHe]."
 overthrow_government_outcome.1003.b.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин')]!» — кричит [craftsman_character.GetShortUINameNoTooltip], врываясь в комнату с таким видом, будто [craftsman_character.GetSheHe] только что [Select_CString(craftsman_character.IsFemale, 'спасалась', 'спасался')] бегством от верной смерти.\n\n«Заговор! Измена! [owner.GetShortUINameNoTooltip] [Select_CString(owner.IsFemale, 'собрала', 'собрал')] сторонников и добивается, чтобы собрание провозгласило новое правительство. По городу ходят слухи, что вас свергли, но новое правительство помиловало всех своих политических противников».\n\n[craftsman_character.GetSheHe|U] удручённо смотрит на меня. «Что нам делать?» — спрашивает [craftsman_character.GetSheHe]."
 overthrow_government_outcome.1003.a: "Я лично обращусь в собрание, [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] нас рассудит."
 overthrow_government_outcome.1003.b: "Я отправлюсь в изгнание."
 overthrow_government_outcome.1003.c: "Я оставлю политику и стану простым торговцем."
 overthrow_government_outcome.1003.d: "Пока ничего. Таковы превратности политики."
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "Враг государства"
 overthrow_government_outcome.1004.1.desc: "Меня объявили врагом государства!"
 overthrow_government_outcome.1004.2.desc: "\n\nУказ уже вывешивают на рыночных площадях и церковных дверях по всей стране. Теперь в опасности не только моё имущество, но и моя жизнь."
 overthrow_government_outcome.1004.3.desc: "\n\nМеня могут арестовать в любой момент!"
 overthrow_government_outcome.1004.councilor.desc: "\n\nВне всяких сомнений, всё из-за моего заметного положения в совете свергнутого режима."
 overthrow_government_outcome.1004.personal.desc: "\n\nРаз [owner.GetName] считает меня личным врагом, нетрудно догадаться, кто за этим стоит."
 overthrow_government_outcome.1004.political.desc: "\n\nНесомненно, причина в моём положении влиятельного патриция и одного из самых заметных противников политики нового режима, в основе которой лежит [owner.GetHouse.GetHouseAspiration.GetName|l]."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nОчевидно, всё из-за моего участия в заговоре с целью свержения правительства."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "Жребий брошен"
 overthrow_government_outcome.1005.desc: "Собрание замирает в напряжённом ожидании, когда [speaker.GetShortUINameNoTooltip] выходит вперёд и берёт слово.\n\n«Патриции! Да здравствует отечество! Да здравствует наша республика! С болью в сердце сообщаю вам, что [Select_CString(target.IsFemale, 'наша', 'наш')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'лишена', 'лишён')] власти по обвинению в коррупции и измене республике…»\n\nПо залу прокатывается волна возгласов и перешёптываний, но несколько влиятельных патрициев встают и аплодируют.\n\n«Согласно чрезвычайному постановлению, [Select_CString(owner.IsFemale, 'гражданка', 'гражданин')] [owner.GetFirstNameNoTooltip] отныне — [Select_CString(owner.IsFemale, 'наша новая', 'наш новый')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]. [owner.GetSheHe|U] берётся выправить курс государственного корабля».\n\nВсё больше патрициев поднимаются с мест, и аплодисменты становятся громче."
 overthrow_government_outcome.1005.a: "Да здравствует республика!"
 overthrow_government_outcome.1005.b: "Позор! Это измена!"
 government_overthrow_enemies.1001.b.custom: "Следующие патриции объявляются [Concept('criminals', 'преступниками')|E]:\n$EFFECT_LIST_BULLET$Свергнутый [Concept('liege', 'сюзерен')|E] и [Concept('councillors', 'советники')|E]\n$EFFECT_LIST_BULLET$Ваши [Concept('rivals', 'соперники')|E] и [Concept('nemesis', 'заклятые враги')|E]\n$EFFECT_LIST_BULLET$Персонажи с [Concept('opinion', 'мнением')|E] о вас на уровне #N -60#! или ниже\n$EFFECT_LIST_BULLET$[Concept('house_heads', 'Главы домов')|E], связанные с вашим домом [Concept('house_relation', 'отношениями')|E] [Concept('rivalry', 'соперничества')|E]\n$EFFECT_LIST_BULLET$Они могут просить о помиловании в [Concept('assembly', 'собрании')|E] или отправиться в изгнание\n$EFFECT_LIST_BULLET$Исключение составляют ваши [Concept('friends', 'друзья')|E], [Concept('lovers', 'любовники')|E], [Concept('soulmates', 'родственные души')|E] и [Concept('blood_brothers', 'побратимы')|E]"
 government_overthrow_enemies.1001.c.custom: "Следующие патриции объявляются [Concept('criminals', 'преступниками')|E]:\n$EFFECT_LIST_BULLET$Все [Concept('powerful_vassal', 'могущественные вассалы')|E], чьи [Concept('house_ambition', 'амбиции дома')|E] отличаются от амбиций вашего дома\n$EFFECT_LIST_BULLET$Свергнутый [Concept('liege', 'сюзерен')|E] и [Concept('councillors', 'советники')|E]\n$EFFECT_LIST_BULLET$Ваши [Concept('rivals', 'соперники')|E] и [Concept('nemesis', 'заклятые враги')|E]\n$EFFECT_LIST_BULLET$Персонажи с [Concept('opinion', 'мнением')|E] о вас на уровне #N -60#! или ниже\n$EFFECT_LIST_BULLET$[Concept('house_heads', 'Главы домов')|E], связанные с вашим домом [Concept('house_relation', 'отношениями')|E] [Concept('rivalry', 'соперничества')|E]\n$EFFECT_LIST_BULLET$Личные враги ваших [Concept('agents', 'агентов')|E]\n$EFFECT_LIST_BULLET$Они могут просить о помиловании в [Concept('assembly', 'собрании')|E] или отправиться в изгнание"
 government_overthrow_populace.1001.a.custom: "Каждое [Concept( 'county', 'графство' )|E] в вашей [Concept( 'realm', 'державе' )|E]"
 government_overthrow_populace.1001.a.description: "Вы объявляете всеобщую амнистию противникам нового режима."
 government_overthrow_forgiven.tt: "Вам прощены все преступления против государства"
 overthrow_government_outcome.tt.success.desc: "Вы красноречиво отстаиваете свои действия"
 overthrow_government_outcome.tt.success.toast: "Вы доказываете, что действовали из любви к республике"
 overthrow_government_outcome.tt.failure.desc: "Ваша речь остаётся без внимания"
 overthrow_government_outcome.tt.failure.toast: "Вас освистали и выпроводили из собрания"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip] [Select_CString(ROOT.Char.IsLocalPlayer, 'стали', Select_CString(ROOT.Char.IsFemale, 'стала', 'стал'))] простым торговцем"
 overthrow_government_enemy_of_the_state.tt: "Собрание заклеймило вас врагом государства"
 overthrow_government_amnesty.tt: "Собрание объявило всеобщую амнистию для заговорщиков"
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip] [Select_CString(target.IsFemale, 'приказала', 'приказал')] арестовать вас за участие в заговоре против государства"
 overthrow_government_blanket_pardon.tt: "Государственный переворот: помилование"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip] [Select_CString(the_new_dodge.IsFemale, 'объявила', 'объявил')] о помиловании всех своих политических противников."
