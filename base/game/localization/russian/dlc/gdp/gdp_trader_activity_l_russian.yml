 gdp_trader_securing_safe_passage_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_securing_safe_passage_scheme$» [Concept('trader', 'приказчик')|E] заключает соглашения, чтобы сделать путешествие быстрее и безопаснее.\n\n#weak В случае успеха:\n#!Ваш [Concept('trader', 'приказчик')|E] получает бонусы к скорости путешествия и безопасности на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
