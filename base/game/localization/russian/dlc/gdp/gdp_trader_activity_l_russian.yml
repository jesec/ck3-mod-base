 gdp_trader_work_scheme_failure_toast_title: "[trader.GetShortUIName] испытывает трудности на рынке."
 # Trader scheme outcome modifier names and descriptions
 gdp_trader_negotiate_deals_modifier: "Выгодные условия"
 gdp_trader_negotiate_deals_modifier_desc: "На этом рынке удалось добиться выгодных торговых условий, укрепив позиции компании среди конкурентов."
 gdp_trader_capacity_boost_modifier: "Расширение торгового пути"
 gdp_trader_capacity_boost_modifier_desc: "Логистика торгового каравана улучшена, благодаря чему выросла пропускная способность этого торгового пути."
 gdp_trader_lobby_advantages_modifier: "Договорённости с владельцем рынка"
 gdp_trader_lobby_advantages_modifier_desc: "Благодаря особому расположению владельца рынка укрепились конкурентные позиции компании."
 gdp_trader_undermine_competitor_modifier: "Подорванные позиции"
 gdp_trader_undermine_competitor_modifier_desc: "Репутация и положение компании на этом рынке пострадали."
 gdp_trader_safe_passage_modifier: "Безопасный проход"
 gdp_trader_safe_passage_modifier_desc: "Принятые меры обеспечивают более безопасное и быстрое путешествие по этому торговому пути."
 gdp_trader_exploring_new_markets_modifier: "Разведанный рынок"
 gdp_trader_exploring_new_markets_modifier_desc: "Этот рынок был изучен, что позволило получить права на выгодные закупки."
 gdp_trader_studying_local_crafts_modifier: "Ремесленные откровения"
 gdp_trader_studying_local_crafts_modifier_desc: "Благодаря изучению местных мастерских этот приказчик отточил своё ремесло, что повысило прирост жизненного опыта."
 gdp_trader_undivided_focus_modifier: "Полная сосредоточенность"
 gdp_trader_undivided_focus_modifier_desc: "Этот [Concept('trader', 'торговец')|E] [trader|E] может полностью посвятить себя своему делу.\n[Concept('scheme_success_chance', 'Шанс на успех')|E] [Concept('schemes', 'происков')|E] [Concept('trader', 'торговца')|E] увеличивается на #P 15%#!."
 # Merchant trait success chance bonus descs
 gdp_trader_merchant_trait_journeyman_bonus: "Бывалый приказчик"
 gdp_trader_merchant_trait_expert_bonus: "Опытный приказчик"
 gdp_trader_merchant_trait_master_bonus: "Искусный приказчик"
 gdp_trader_house_member_success_bonus: "Член [Concept('house', 'дома')|E]"
 gdp_trader_scheme_shared_rules_tt: "\nЧлены [Concept('house', 'дома')|E] получают #P +10%#! к [Concept('scheme_success_chance', 'шансу на успех происков')|E].\n#weak В случае провала:\n#![Concept('trader', 'Приказчик')|E] получает #N 10#! ед. [Concept('stress', 'стресса')|E]"
 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "Заключение сделок"
 gdp_trader_negotiate_deals_scheme_desc: "Ваш приказчик попытается провести переговоры с местными купцами и чиновниками, чтобы добиться более выгодных условий покупки и продажи на этом рынке.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_negotiate_deals_scheme$» [Concept('trader', 'приказчик')|E] ведёт переговоры с местными купцами и чиновниками, чтобы добиться более выгодных условий покупки и продаж.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_success_title: "Приказчик: заключены сделки"
 gdp_trader_negotiate_deals_scheme_success_desc: "[trader.GetShortUIName] успешно [Select_CString(trader.IsFemale, 'договорилась', 'договорился')] о новой доле на рынках владения [trader.GetCurrentLocation.GetName]."
 gdp_trader_finding_a_deal_scheme: "Заключение сделок"
 gdp_trader_finding_a_deal_scheme_desc: "Ваш приказчик будет искать выгодные возможности и превращать небольшую прибыль в звонкую монету.\n\n#weak В случае успеха:\n#!Вы получаете [gold_i][Concept('gold', 'золото')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_finding_a_deal_scheme$» [Concept('trader', 'приказчик')|E] ищет выгодные возможности и превращает небольшую прибыль в звонкую монету.\n\n#weak В случае успеха:\n#!Вы получаете [gold_i][Concept('gold', 'золото')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_success_title: "Приказчик: заключена выгодная сделка"
 gdp_trader_finding_a_deal_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'заключила', 'заключил')] сделку во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_securing_surplus_scheme: "Поиск излишков"
 gdp_trader_securing_surplus_scheme_desc: "Ваш приказчик попытается найти излишки товаров на этом рынке и организовать их перевозку по торговому пути, что временно увеличит его пропускную способность.\n\n#weak В случае успеха:\n#![Concept('trade_route_capacity', 'Потенциал')|E] этого [Concept('trade_route', 'торгового пути')|E] для вашей [Concept('company', 'компании')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_securing_surplus_scheme$» [Concept('trader', 'приказчик')|E] пытается найти излишки товаров на этом рынке и организовать их перевозку по торговому пути, чтобы временно увеличить его пропускную способность.\n\n#weak В случае успеха:\n#![Concept('trade_route_capacity', 'Потенциал')|E] этого [Concept('trade_route', 'торгового пути')|E] для [Concept('company', 'компании')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_success_title: "Приказчик: найдены излишки"
 gdp_trader_securing_surplus_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'смогла', 'смог')] выжать из ремесленников владения [trader.GetCurrentLocation.GetName] дополнительные товары."
 gdp_trader_appraising_market_scheme: "Оценка рынков"
 gdp_trader_appraising_market_scheme_desc: "Ваш приказчик попытается изучить местные рыночные условия и выявить наиболее выгодные возможности для торговли.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_appraising_market_scheme$» [Concept('trader', 'приказчик')|E] пытается изучить местные рыночные условия и выявить наиболее выгодные возможности для торговли.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_success_title: "Приказчик: проведена оценка рынков"
 gdp_trader_appraising_market_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'обнаружила', 'обнаружил')] новые возможности для ведения дел во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_organizing_caravan_scheme: "Организация караванов"
 gdp_trader_organizing_caravan_scheme_desc: "Ваш приказчик попытается повысить слаженность и эффективность торгового каравана, что позволит перевозить по маршруту больше товаров.\n\n#weak В случае успеха:\n#![Concept('trade_route_capacity', 'Потенциал')|E] этого [Concept('trade_route', 'торгового пути')|E] для вашей [Concept('company', 'компании')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_organizing_caravan_scheme$» [Concept('trader', 'приказчик')|E] повышает слаженность и эффективность торгового каравана, чтобы можно было перевозить по маршруту больше товаров.\n\n#weak В случае успеха:\n#![Concept('trade_route_capacity', 'Потенциал')|E] этого [Concept('trade_route', 'торгового пути')|E] для [Concept('company', 'компании')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_success_title: "Приказчик: организована работа караванов"
 gdp_trader_organizing_caravan_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'нашла', 'нашёл')] более лёгкие упаковочные материалы."
 gdp_trader_exploring_new_markets_scheme: "Расширение рынков"
 gdp_trader_exploring_new_markets_scheme_desc: "Ваш приказчик попытается разведать рынок, на который компания ещё не вышла, и подготовить почву для будущей торговли.\n\n#weak В случае успеха:\n#!Снижение цены покупки на посещённом [Concept('trade_market', 'рынке')|E] на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_exploring_new_markets_scheme$» [Concept('trader', 'приказчик')|E] разведывает рынок, на который компания ещё не вышла, и готовит почву для будущей торговли.\n\n#weak В случае успеха:\n#!Снижение цены покупки на посещённом [Concept('trade_market', 'рынке')|E] на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_success_title: "Приказчик: расширение рынков"
 gdp_trader_exploring_new_markets_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'нашла', 'нашёл')] во владении [trader.GetCurrentLocation.GetNameNoTooltip] продавцов, отдающих товары по дешёвке."
 gdp_trader_identifying_rare_goods_scheme: "Поиск редких товаров"
 gdp_trader_identifying_rare_goods_scheme_desc: "Ваш приказчик попытается найти редкие и роскошные товары, которые можно приобрести на этом рынке в расчёте на солидную прибыль.\n\n#weak В случае успеха:\n#!Вы получаете крупную сумму [gold_i][Concept('gold', 'золота')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_identifying_rare_goods_scheme$» [Concept('trader', 'приказчик')|E] ищет редкие и роскошные товары, которые можно приобрести на этом рынке в расчёте на солидную прибыль.\n\n#weak В случае успеха:\n#!Вы получаете крупную сумму [gold_i][Concept('gold', 'золота')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_success_title: "Приказчик: найдены редкие товары"
 gdp_trader_identifying_rare_goods_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'нашла', 'нашёл')] лавку драгоценных камней во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Diplomacy schemes
 gdp_trader_negotiating_with_ruler_scheme: "Переговоры с дворянами"
 gdp_trader_negotiating_with_ruler_scheme_desc: "Ваш приказчик попытается установить прочные отношения с владельцами рынка.\n\n#weak В случае успеха:\n#![opinion_i][Concept('opinion', 'Мнение')|E] местного правителя о вас повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_negotiating_with_ruler_scheme$» [Concept('trader', 'приказчик')|E] устанавливает прочные отношения с владельцами рынка.\n\n#weak В случае успеха:\n#![opinion_i][Concept('opinion', 'Мнение')|E] местного правителя о вас повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_success_title: "Приказчик: проведены переговоры с дворянами"
 gdp_trader_negotiating_with_ruler_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'произвела', 'произвёл')] прекрасное впечатление на правителя владения [trader.GetCurrentLocation.GetName]."
 gdp_trader_building_connections_scheme: "Налаживание связей"
 gdp_trader_building_connections_scheme_desc: "Ваш приказчик попытается завести прочные связи с местными чиновниками, чтобы получить доступ к складам державы.\n\n#weak В случае успеха:\n#![Concept('trade_route_capacity', 'Потенциал')|E] этого [Concept('trade_route', 'торгового пути')|E] для вашей [Concept('company', 'компании')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_building_connections_scheme$» [Concept('trader', 'приказчик')|E] заводит прочные связи с местными чиновниками, чтобы получить доступ к складам державы.\n\n#weak В случае успеха:\n#![Concept('trade_route_capacity', 'Потенциал')|E] этого [Concept('trade_route', 'торгового пути')|E] для [Concept('company', 'компании')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_success_title: "Приказчик: налажены связи"
 gdp_trader_building_connections_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'уговорила', 'уговорил')] чиновников во владении [trader.GetCurrentLocation.GetNameNoTooltip] пропускать больше товаров."
 gdp_trader_lobbying_advantages_scheme: "Защита интересов компании"
 gdp_trader_lobbying_advantages_scheme_desc: "Ваш приказчик попытается защитить интересы компании перед владельцем рынка, чтобы укрепить положение компании среди конкурентов.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_lobbying_advantages_scheme$» [Concept('trader', 'приказчик')|E] защищает интересы компании перед владельцем рынка, чтобы укрепить положение компании среди конкурентов.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_success_title: "Приказчик: защищены интересы компании"
 gdp_trader_lobbying_advantages_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'добилась', 'добился')] особых привилегий для компании во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_building_reputation_scheme: "Укрепление репутации"
 gdp_trader_building_reputation_scheme_desc: "Ваш приказчик попытается повысить известность и добрую славу компании в этом регионе.\n\n#weak В случае успеха:\n#!Вы получаете [prestige_i][Concept('prestige', 'престиж')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_building_reputation_scheme$» [Concept('trader', 'приказчик')|E] повышает известность и добрую славу компании в регионе.\n\n#weak В случае успеха:\n#!Вы получаете [prestige_i][Concept('prestige', 'престиж')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_success_title: "Приказчик: укреплена репутация"
 gdp_trader_building_reputation_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'прославила', 'прославил')] имя компании во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_championing_patron_scheme: "Защита интересов покровителя"
 gdp_trader_championing_patron_scheme_desc: "Ваш приказчик попытается защитить торговые интересы [Concept('merchant_patron', 'покровителя')|E] на этом рынке.\n\n#weak В случае успеха:\n#![opinion_i][Concept('opinion', 'Мнение')|E] [Concept('merchant_patron', 'покровителя')|E] о вас повышается, и вы получаете немного [prestige_i][Concept('prestige', 'престижа')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_championing_patron_scheme$» [Concept('trader', 'приказчик')|E] защищает торговые интересы [Concept('merchant_patron', 'покровителя')|E] на рынке.\n\n#weak В случае успеха:\n#![opinion_i][Concept('opinion', 'Мнение')|E] [Concept('merchant_patron', 'покровителя')|E] о вас повышается, и вы получаете немного [prestige_i][Concept('prestige', 'престижа')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_success_title: "Приказчик: защищены интересы покровителя"
 gdp_trader_championing_patron_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'укрепила', 'укрепил')] влияние, которым обладает [route_owner.GetSuzerain.GetShortUIName] во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_entertaining_merchants_scheme: "Приём торговцев"
 gdp_trader_entertaining_merchants_scheme_desc: "Ваш приказчик попытается провести встречу с представителями другой торговой компании, чтобы сократить враждебную конкуренцию с соперничающим [Concept('merchant', 'торговцем')|E].\n\n#weak В случае успеха:\n#![opinion_i][Concept('opinion', 'Мнение')|E] соперничающего [Concept('merchant', 'торговца')|E] о вас повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_championing_patron_scheme$» [Concept('trader', 'приказчик')|E] проводит встречу с представителями другой торговой компании, сокращая враждебную конкуренцию с соперничающим [Concept('merchant', 'торговцем')|E].\n\n#weak В случае успеха:\n#![opinion_i][Concept('opinion', 'Мнение')|E] соперничающего [Concept('merchant', 'торговца')|E] о вас повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_success_title: "Приказчик: приняты торговцы"
 gdp_trader_entertaining_merchants_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'добилась', 'добился')] благосклонность со стороны соперничающего [Concept('merchant', 'торговца')|E] во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_hiring_local_talent_scheme: "Поиск местных талантов"
 gdp_trader_hiring_local_talent_scheme_desc: "Ваш приказчик попытается отыскать способных людей, которые присоединятся к компании в качестве [Concept('associates', 'помощников')|E].\n\n#weak В случае успеха:\n#!Ваша [Concept('company', 'компания')|E] нанимает [Concept('associate', 'помощника')|E] из местных$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_hiring_local_talent_scheme$» [Concept('trader', 'приказчик')|E] ищет способных людей, которые присоединятся к компании в качестве [Concept('associates', 'помощников')|E].\n\n#weak В случае успеха:\n#![Concept('company', 'Компания')|E] нанимает [Concept('associate', 'помощника')|E] из местных$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_success_title: "Приказчик: найдены местные таланты"
 gdp_trader_hiring_local_talent_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'наняла', 'нанял')] талантливого человека во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Learning schemes
 gdp_trader_learning_from_locals_scheme: "Изучение местной торговли"
 gdp_trader_learning_from_locals_scheme_desc: "Ваш приказчик попытается погрузиться в местные торговые традиции, чтобы лучше разобраться в товарах этого рынка.\n\n#weak В случае успеха:\n#!Ваша [Concept('company', 'компания')|E] получает [Concept('trade_expertise', 'познания в торговле')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_learning_from_locals_scheme$» [Concept('trader', 'приказчик')|E] погружается в местные торговые традиции, чтобы лучше разобраться в товара рынка.\n\n#weak В случае успеха:\n#![Concept('company', 'Компания')|E] получает [Concept('trade_expertise', 'познания в торговле')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_learning_from_locals_scheme_success_title: "Приказчик: изучена местная торговля"
 gdp_trader_learning_from_locals_scheme_success_desc: "[trader.GetShortUIName] многое [Select_CString(trader.IsFemale, 'узнала', 'узнал')] от торговцев во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_studying_local_crafts_scheme: "Изучение местных ремёсел"
 gdp_trader_studying_local_crafts_scheme_desc: "Ваш приказчик попытается изучить местные мастерские, чтобы лучше разобраться в производящихся здесь товарах.\n\n#weak В случае успеха:\n#!Ваш [Concept('trader', 'приказчик')|E] получает больше [Concept('lifestyle_experience', 'жизненного опыта')|E] в течение #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_studying_local_crafts_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_studying_local_crafts_scheme$» [Concept('trader', 'приказчик')|E] изучает местные мастерские, чтобы лучше разобраться в производящихся там товарах.\n\n#weak В случае успеха:\n#!Ваш [Concept('trader', 'приказчик')|E] получает больше [Concept('lifestyle_experience', 'жизненного опыта')|E] в течение #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_studying_local_crafts_scheme_success_title: "Приказчик: изучены местные ремёсла"
 gdp_trader_studying_local_crafts_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'получила', 'получил')] знания, посетив мастерские во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_appraising_goods_scheme: "Оценка товаров"
 gdp_trader_appraising_goods_scheme_desc: "Ваш приказчик попытается тщательно оценить местные товары, чтобы расширить познания компании в ценообразовании.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_goods_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_appraising_goods_scheme$» [Concept('trader', 'приказчик')|E] тщательно оценивает местные товары, чтобы расширить познания компании в ценообразовании.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] на посещённом [Concept('trade_market', 'рынке')|E] повышается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_goods_scheme_success_title: "Приказчик: проведена оценка товаров"
 gdp_trader_appraising_goods_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'узнала', 'узнал')], как выторговать лучшую цену во владении [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Intrigue schemes
 gdp_trader_undermining_competitor_scheme: "Подрыв позиций конкурентов"
 gdp_trader_undermining_competitor_scheme_desc: "Ваш приказчик попытается подорвать репутацию [Concept('rival', 'соперничающего')|E] торговца на этом рынке.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] [Concept('rival', 'соперничающего')|E] [Concept('merchant', 'торговца')|E] на посещённом [Concept('trade_market', 'рынке')|E] снижается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_undermining_competitor_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_undermining_competitor_scheme$» [Concept('trader', 'приказчик')|E] подрывает репутацию [Concept('rival', 'соперничающего')|E] торговца на рынке.\n\n#weak В случае успеха:\n#![competitiveness_i][Concept('trade_competitiveness', 'Конкурентоспособность торговли')|E] [Concept('rival', 'соперничающего')|E] [Concept('merchant', 'торговца')|E] на посещённом [Concept('trade_market', 'рынке')|E] снижается на #V 5 лет#!$gdp_trader_scheme_shared_rules_tt$"
