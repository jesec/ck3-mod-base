 gdp_trader_undermining_competitor_scheme_success_desc: "[trader.GetShortUIName] [Select_CString(trader.IsFemale, 'выставила', 'выставил')] соперника в невыгодном свете на рынке владения [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_recruiting_informants_scheme: "Вербовка осведомителей"
 gdp_trader_recruiting_informants_scheme_desc: "Ваш приказчик попытается создать сеть местных осведомителей, чтобы получить преимущество на рынке.\n\n#weak В случае успеха:\n#!Вы получаете 1 ед. [Concept('competitive_pressure', 'конкурентного давления')|E]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_recruiting_informants_scheme_desc_general: "Во время [Concept('scheme', 'происков')|E] «$gdp_trader_recruiting_informants_scheme$» [Concept('trader', 'приказчик')|E] создаёт сеть местных осведомителей, чтобы получить преимущество на рынке.\n\n#weak В случае успеха:\n#!Вы получаете 1 ед. [Concept('competitive_pressure', 'конкурентного давления')|E]$gdp_trader_scheme_shared_rules_tt$"
