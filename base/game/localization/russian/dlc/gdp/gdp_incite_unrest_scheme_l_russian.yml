l_russian:
 # Scheme
 gdp_incite_unrest_scheme: "Спровоцировать беспорядки"
 gdp_incite_unrest_scheme_desc: "Посеять среди простого народа столицы смуту и недовольство, настроив его против своего правителя."
 gdp_incite_unrest_scheme_desc_general: "Посеять среди простого народа столицы смуту и недовольство, настроив его против своего правителя."
 gdp_incite_unrest_scheme_action: "Распространение беспорядков"
 GDP_INCITE_UNREST_SUCCESS_DESC: "Подстрекатели сделали своё дело. Народное мнение в столичном графстве сюзерена ухудшится."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "Происки с целью посеять смуту в столице раскрыты."
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "Происки прекращены"
 gdp_incite_unrest_scheme_owner_not_republic: "В нашей державе больше не республиканский строй, поэтому мы не можем продолжать эти происки."
 # Interaction
 gdp_incite_unrest_start_interaction: "Спровоцировать беспорядки"
 gdp_incite_unrest_scheme_interaction_tt_approved: "Тайно распространять недовольство среди простого народа в графстве [recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V], чтобы [recipient.GetTitledFirstNameNoTooltip|V] [Select_CString(recipient.IsFemale, 'лишилась', 'лишился')] [Concept('popular_opinion', 'народной поддержки')|E]."
 gdp_incite_unrest_scheme_start_notification: "Происки начались"
 gdp_incite_unrest_scheme_target_tt: "Кто-то плетёт происки против вас."
 # Success messages
 gdp_incite_unrest_scheme_success_t: "Беспорядки разгораются"
 gdp_incite_unrest_scheme_success_liege_t: "Беспорядки в столице"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "Происки провалились"
 gdp_incite_unrest_scheme_failure_desc: "Нашим агитаторам не удалось посеять беспорядки среди народа, которым правит [scope:target.GetTitledFirstName]. Происки провалены, а подданные остались равнодушны."
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "Заговор раскрыт"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "Подстрекатели выполнили свою работу. По улицам города [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] распространяется недовольство, и [target.GetTitledFirstName] стремительно теряет народное доверие."
 gdp_incite_unrest_scheme_event.0005.a: "Народ можно подтолкнуть ещё дальше."
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "[This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] полнится недовольным ропотом. Кто-то подстрекает простой народ против власти, и голоса недовольных звучат всё громче."
 gdp_incite_unrest_scheme_event.0006.a: "Пора восстановить порядок."
 # County modifier
 gdp_incite_unrest_county_modifier: "Посеяно недовольство"
 gdp_incite_unrest_county_modifier_desc: "Здесь потрудились подстрекатели, которые разожгли недовольство и настроили народ против правителя."
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "Бесчестный заговорщик"
 gdp_caught_inciting_unrest_modifier_desc: "Этого патриция поймали за разжиганием недовольства главой республики. Другие дома и избиратели теперь относятся к этой личности с подозрением."
