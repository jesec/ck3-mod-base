 gdp_trade_good_meat_deficiency_modifier: "Нехватка товара: мясо"
 gdp_trade_good_meat_deficiency_modifier_desc: "В округе, где находится этот персонаж, неожиданно возникла нехватка мяса."
 gdp_trade_good_fish_deficiency_modifier: "Нехватка товара: рыба"
 gdp_trade_good_fish_deficiency_modifier_desc: "В округе, где находится этот персонаж, неожиданно возникла нехватка рыбы."
 gdp_trade_good_cheese_deficiency_modifier: "Нехватка товара: сыр"
 gdp_trade_good_cheese_deficiency_modifier_desc: "В округе, где находится этот персонаж, неожиданно возникла нехватка сыра."
 gdp_trade_good_fruit_deficiency_modifier: "Нехватка товара: фрукты"
 gdp_trade_good_fruit_deficiency_modifier_desc: "В округе, где находится этот персонаж, неожиданно возникла нехватка фруктов."
 gdp_trade_good_oil_deficiency_modifier: "Нехватка товара: масло"
