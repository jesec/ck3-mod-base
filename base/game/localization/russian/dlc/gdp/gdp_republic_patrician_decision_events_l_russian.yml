l_russian:
 city_stroll_prefix: "Прогулка по городу"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: кто нашёл, тот и хозяин"
 gdp_republic_patrician_decision.1000.desc: "Я сворачиваю с главной улицы в переулок и натыкаюсь на местного торговца, который о чём-то беседует со знакомым.\n\n«…И никто так и не пришёл за этим добром», — говорит [Select_CString(local_character.IsFemale, 'она', 'он')], пожимая плечами, и указывает на загромождающие переулок ящики. В каждом из них — [abandoned_trade_good.GetNameNoTooltip|l].\n\nНикто не спешит объявлять груз своей собственностью. Я окидываю ящики оценивающим взглядом. Вот это #EMP удача#!!"
 gdp_republic_patrician_decision.1000.a: "Давайте-ка обеспечим спрос…"
 gdp_republic_patrician_decision.1000.a.flavor: "Ящики разбиты вдребезги, их содержимое ([abandoned_trade_good.GetNameNoTooltip|l]) этого не пережило."
 gdp_republic_patrician_decision.1000.b: "«А ведь это всё моё!»"
 gdp_republic_patrician_decision.1000.c: "«А, [abandoned_trade_good.GetNameNoTooltip|l]! [liege_scope.GetTitledFirstNameNoTooltip] всё ломает голову, куда же это пропало. Благодарю вас»."
 gdp_republic_patrician_decision.1000.d: "Это не моё дело."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: день в саду"
 gdp_republic_patrician_decision.1010.desc: "[city_location.GetTitle.GetNameNoTier|U] вознаграждает любознательных: в лабиринте тесных улочек и переулков мне неожиданно попадается небольшой сад — настоящий оазис, где можно отдохнуть от суеты. Пусть дорожки здесь местами разбиты, а растений немного, но за каждым цветком тщательно ухаживают — садовник вкладывает в своё детище всю душу.\n\nВ тени зелени отдыхают самые разные люди: знатные господа, купцы, простолюдины и рабочие. Здесь каждый может ненадолго забыть о повседневных заботах.\n\nЯ неспешно иду по дорожке, чувствуя, как понемногу отступает усталость и перестают тяготить трудности."
 gdp_republic_patrician_decision.1010.a: "Мы сделаем этот сад по-настоящему великолепным — пусть [city_location.GetTitle.GetNameNoTierNoTooltip] по праву гордится им!"
 gdp_republic_patrician_decision.1010.b: "А это что за цветочек?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "Вы находите примечательные растения"
 gdp_republic_patrician_decision.1010.b.health_plant: "Вы находите полезные травы"
 gdp_republic_patrician_decision.1010.c: "Хочу получше ощутить эту свободу…"
 gdp_republic_patrician_decision.1010.c.flavor: "Буду радоваться жизни — мне некого стесняться!"
 gdp_republic_patrician_decision.1010.c.success: "Вас не замечают"
 gdp_republic_patrician_decision.1010.c.failure: "Вас раскрыли"
 gdp_republic_patrician_decision.1010.d: "Чудесно!"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: великая площадь города [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1020.intro: "Жизнь на площади идёт своим чередом, и никакие указы правительства, никакие происки #L [city_location.GetCounty.GetTitle.GetAdjective|l]ого#! дворянства не могут нарушить её мерный ход."
 gdp_republic_patrician_decision.1020.intro.01: "Неподалёку кто-то готовит на огне еду, и я непроизвольно втягиваю носом чудесный запах. До чего же ароматная вещь — [ROOT.Char.Custom('GetLocalStreetFood')|l]!"
 gdp_republic_patrician_decision.1020.intro.02: "Возмущённый осёл ревёт, огрызаясь на хозяина, который безуспешно пытается отмыть животное от толстого слоя засохшей грязи."
 gdp_republic_patrician_decision.1020.intro.03: "Престарелые горожане неторопливо прогуливаются и время от времени неодобрительно хмыкают — их возмущают цены на хлеб и заносчивость нынешней молодёжи."
 gdp_republic_patrician_decision.1020.intro.04: "Над головой кружат [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l], выжидая возможности ухватить с прилавка кусочек чего-нибудь вкусного."
 gdp_republic_patrician_decision.1020.intro.rain: "После вечернего ливня наступило свежее утро."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nВдалеке я замечаю кучку солдат — очевидно, здесь они впервые, и [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip] для них в новинку. Солдаты держатся настороженно; похоже, они не знают, куда податься. Из обрывков разговоров я понимаю, что они тоже надеются найти нового покровителя."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nНа окраине площади стоит хмурый человек, мрачно косящийся на прохожих. Подойдя ближе, я слышу, как [Select_CString(local_character.IsFemale, 'она', 'он')] сетует, что [Select_CString(local_character.IsFemale, 'упустила', 'упустил')] выгодное торговое соглашение с домом [liege_scope.GetHouse.GetBaseName]. Неужели передо мной уважаемый купец, которому просто не повезло?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nПосреди площади устроившийся на груде ящиков врач заканчивает лекцию о телесных соках и о том, как восстановить равновесие гуморов, в особенности чёрной желчи. Я неуверенно киваю в знак согласия.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nНа прилавке в неприметном уголке я замечаю… ого, да это же [ROOT.Char.Custom('RandomMediumObject')|l]! Превосходная вещь — то, что нужно для моих замыслов, ведь [scheme_to_boost.GetName|l] — это непростое дело…$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nОглядев площадь, я замечаю, как на земле что-то блестит. Прищурившись, я пытаюсь разглядеть, что же это за вещь, и замечаю небольшое украшение, сильно заляпанное грязью.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nНа той стороне площади разворачивается скорбное зрелище: стражники уводят прочь кучку обнищавших крестьян. Один из крестьянских детей разражается душераздирающим плачем — от голода и страха. Зеваки изо всех сил делают вид, будто ничего не замечают."
 gdp_republic_patrician_decision.1020.outro: "\n\n[Select_CString(ROOT.Char.IsFemale, 'Моя служанка', 'Мой слуга')] деликатно прокашливается, давая понять, что пора возвращаться: меня ждут другие дела."
 gdp_republic_patrician_decision.1020.a: "Думаю, один-два голодных рта я накормлю."
 gdp_republic_patrician_decision.1020.b: "Эти солдаты могут мне пригодиться…"
 gdp_republic_patrician_decision.1020.c: "Хм. Умелые торговцы мне не помешают…"
 gdp_republic_patrician_decision.1020.d: "Пусть лучше этот врач работает на меня."
 gdp_republic_patrician_decision.1020.e: "Сначала работа, а отдых потом."
 gdp_republic_patrician_decision.1020.f: "Сейчас, только почищу…"
 gdp_republic_patrician_decision.1020.g: "Сколько надо повидать, со сколькими надо поговорить!"
 gdp_republic_patrician_decision.1020.g.alternate: "[GetPlayer.GetCapitalLocation.GetNameNoTooltip] провожает очередной день."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: гавань города [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1030.desc: "Чем ближе мы подходим к гавани, тем сильнее становится зловоние рыбы и гниющих водорослей. Здесь кипит жизнь: рыбаки, их жёны и дети, бродячие кошки — каждый занят чем-то своим.\n\nПроходя мимо, я слышу, как беседуют двое рыбаков: «…Крючки-то мы новые купили. А вот будь у нас сетей побольше, то и наловили бы сколько…». Заметив меня, они тут же умолкают."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nЯ хмыкаю и киваю."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nЯ хмыкаю и киваю. О мою ногу с громким мурлыканьем начинает тереться бездомная кошка."
 gdp_republic_patrician_decision.1030.a: "«Пожалуй, меня можно убедить закупить новые снасти…»."
 gdp_republic_patrician_decision.1030.a.flavor: "Прибыль можно будет #EMP сетями#! загребать!"
 gdp_republic_patrician_decision.1030.b: "«За сколько вы готовы отдать мне рыбу, если я закуплю большую партию?»."
 gdp_republic_patrician_decision.1030.c: "Киса!"
 gdp_republic_patrician_decision.1030.d: "«Хороший сегодня денёк, не правда ли?»."
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "Во время неспешной прогулки по главной площади моё внимание привлекает [ROOT.Char.Custom('GetGreatProjectDescription')|l]. Да, [liege_scope.GetTitledFirstName|l] любит подобные затеи…\n\nПрораб, похоже, чем-то [Select_CString(local_character.IsFemale, 'озадачена', 'озадачен')]. [Select_CString(local_character.IsFemale, 'Она', 'Он')] сверяется со списком имён и печатей и почёсывает затылок: «Так… щедрое пожертвование… а печать-то повреждена. Кто же наш благодетель?.. Хм…».\n\nПожертвование от неизвестного лица? #EMP Любопытно#!."
 gdp_republic_patrician_decision.1040.a: "«Это я — ваш благодетель! И у нас всё получилось!»."
 gdp_republic_patrician_decision.1040.a.success: "Вы присваиваете себе заслугу"
 gdp_republic_patrician_decision.1040.a.failure: "Вас раскрывают"
 gdp_republic_patrician_decision.1040.b: "«[liege_scope.GetTitledFirstNameNoTooltip] — вот кто благодетель! Замечательно!»."
 gdp_republic_patrician_decision.1040.c: "Это не моё дело."
 gdp_republic_patrician_decision.1040.c.flavor: "Наверняка они сами разберутся."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] получает вклад «[contribution_to_fund.GetName]»"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: выход не удался"
 gdp_republic_patrician_decision.1100.desc: "Хлопнув привычным движением по кошелю, я направляюсь к выходу из кабинета, чтобы немного прогуляться и полюбоваться видами. [city_location.GetTitle.GetNameNoTier] ждёт!\n\n#EMP «Бух!»#! — я ударяюсь лбом в дверь. #EMP Не поддаётся#!, проклятая! Неужели разбухла?..\n\nЯ оглядываюсь. В комнате есть окно, но прыжок с такой высоты наверняка обернётся парой переломов.\n\nНадо подумать."
 gdp_republic_patrician_decision.1100.a: "«Стража! Прислуга! Есть тут кто-нибудь?!»"
 gdp_republic_patrician_decision.1100.a.flavor: "Нет-нет, стены вовсе не сдвигаются… Правда ведь?!"
 gdp_republic_patrician_decision.1100.b: "Под окном много чего, что может смягчить удар!"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "Тело требует разминки!"
 gdp_republic_patrician_decision.1100.d: "Ну… значит, вернусь обратно за стол."
 ##CUSTOM LOC
 custom_gp_expand_great_plaza_name: "Большая торговая площадь"
 custom_gp_expand_great_plaza: "расширение самой площади"
 custom_gp_loggia: "возведение общественной галереи, под изысканными крышами которой разместятся торговцы и нотариусы"
 custom_gp_improved_loggia: "улучшение общественной галереи с добавлением новых стоек"
 custom_gp_statute_hall: "создание законодательной палаты для поддержания порядка в городе"
 custom_gp_improved_statute_hall: "расширение законодательной палаты с добавлением мест для хранения и более удобными рабочими местами служащих"
 custom_gp_council_chamber: "возведение большой палаты совета, способствующей беспрепятственному управлению городом"
 custom_gp_improved_council_chamber: "улучшение большой палаты совета с добавлением новых скамей для большего комфорта"
 custom_gp_debt_office: "создание службы государственного долга, отвечающей за баланс городской казны"
 custom_gp_improved_debt_office: "расширение службы государственного долга с добавлением большего числа сдержек и противовесов в интересах благосостояния городской казны"
 custom_gp_civic_hospital: "основание светской больницы, в которую горожане смогут обратиться в час нужды"
 custom_gp_improved_civic_hospital: "развитие и расширение светской больницы, чтобы горожане оставались здоровыми и продуктивными"
 custom_gp_weigh_house: "создание общественной палаты мер и весов, чтобы препятствовать нечистым на руку торговцам"
 custom_gp_improved_weigh_house: "расширение общественной палаты мер и весов для укрепления безопасности и благосостояния республики"
 custom_gp_clock_tower: "возведение башни с часами, чтобы населению было проще отслеживать ход времени"
 custom_gp_improved_clock_tower: "улучшение башни с часами для придания ей более торжественного вида"
 custom_gp_civic_ward: "возведение административной палаты для контроля за городским строительством"
 custom_gp_improved_civic_ward: "расширение административной палаты для увеличения числа служащих и их возможности отслеживать ведущиеся работы"
 custom_gp_league_chapter_house: "создание дома собраний лиги для организации собраний и ведения дел"
 custom_gp_improved_league_chapter_house: "улучшение дома собраний лиги для повышения комфорта собраний в интересах дипломатии"
 custom_gp_podesta_residence: "возведение резиденции подесты, где будет проживать руководитель местных чиновников"
 custom_gp_improved_podesta_residence: "улучшение резиденции подесты, чтобы вознаградить и поощрить руководителя местных чиновников"
 custom_gp_fountain: "большой фонтан на радость публике и для украшения города"
 custom_gp_improved_fountain: "улучшение большого фонтана за счёт более крупных бассейнов и акведука"
 ##MODIFIERS
 gdp_opportunity_scheme_modifier: "Счастливая случайность"
 gdp_opportunity_scheme_modifier_desc: "Во время этих происков открылась неожиданная удачная возможность."
 gdp_city_stroll_alms_modifier: "Милосердные поступки"
 gdp_city_stroll_alms_modifier_desc: "Этот персонаж пользуется всеобщим расположением за заботу об убогих."
 gdp_armchair_patrician_modifier: "Комнатный патриций"
 gdp_armchair_patrician_modifier_desc: "Этот персонаж предпочёл поработать вместо того, чтобы прогуляться."
 gdp_city_stroll_modifier: "В курсе дел"
 gdp_city_stroll_modifier_desc: "Этот персонаж регулярно гуляет по городу и отлично знает его улицы."
 gdp_patrician_city_investments_modifier: "Городской инвестор"
 gdp_patrician_city_investments_modifier_desc: "Этот персонаж совершает вложения и пожертвования ради развития города.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_republic_investor_patrician_rating_bonus_value')|0=+]"
 gdp_bulk_fish_modifier: "Рыба оптом"
 gdp_bulk_fish_modifier_desc: "Этот персонаж договорился о покупке большой партии рыбы со скидкой."
 gdp_publicly_shamed_modifier: "Публичный позор"
 gdp_publicly_shamed_modifier_desc: "Этот персонаж попытался присвоить себе чужой вклад в проект."
 gdp_shamed_nudity_modifier: "Нагишом"
 gdp_shamed_nudity_modifier_desc: "Этого персонажа застукали в чём мать родила."
 gdp_out_and_about_modifier: "Среди народа"
 gdp_out_and_about_modifier_desc: "Этого персонажа видели блуждающим по улицам своей столицы"
 gdp_city_investments_province_modifier: "Вложения в город"
 gdp_city_investments_province_modifier_desc: "Это владение развивается благодаря вложениям от местных патрициев."
 gdp_trade_good_grain_deficiency_modifier: "Нехватка товара: зерно"
