 action_merchant_company_in_debt: "$company_in_debt_title$"
 action_merchant_company_in_debt_label: "@debt_icon! Ваша компания в долгах"
 action_merchant_company_in_debt_desc: "У вас меньше [gold_i|E]#V [EmptyScope.ScriptValue('company_debt_gold_threshold_value')|0]#! [Concept('gold', 'золотых')|E], из-за чего ваша [Concept('company', 'компания')|E] оказалась [Concept('debt', 'в долгах')|E]!\n\nПока компания остаётся в долгах:\n$BULLET_WITH_TAB$[Concept('company_direction', 'Направление компании')|E] смещается на [EmptyScope.ScriptValue('company_debt_direction_shift_value')|V0] в сторону [company_sentiment_divided_i][Concept('company_sentiment_divided', 'ненасытности')|E] раз в [EmptyScope.ScriptValue('company_debt_direction_interval_months_value')|V0] мес.\n$BULLET_WITH_TAB$Нельзя объявлять [Concept('war', 'войну')|E]\n\nЧем больше ваш долг, тем суровее штрафы. Текущий уровень долга накладывает следующие дополнительные эффекты:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Из-за долгов ваша компания уже потеряла [trade_acumen_i][Concept('acumen', 'деловую хватку')|E], а увеличение [Concept('company_size', 'размера компании')|E] приостановлено. Расплатитесь с долгами, чтобы остановить дальнейшее ухудшение [Concept('company_sentiment', 'направления компании')|E].#!"
