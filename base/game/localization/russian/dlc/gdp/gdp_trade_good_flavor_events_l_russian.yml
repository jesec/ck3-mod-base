l_russian:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "Подсчёт товара"
 gdp_trade_good_flavor.1001.desc: "Перед сном я пересчитываю последнюю партию товара. [tgf_good.Custom('GetTradeGood_RU_Nom')]... все [tgf_good.Custom('GetTradeGoodUnitPlural')] уже нашли своих покупателей. Их было ровно триста двенадцать... если я не ошибаюсь.\n\nПересчитываю ещё раз. На всякий случай."
 gdp_trade_good_flavor.1001.a: "Всё сходится."
 gdp_trade_good_flavor.1001.b: "Учётные книги должны со мной согласиться."
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "Досужие сплетни"
 gdp_trade_good_flavor.1002.desc: "До меня дошли слухи, что [tgf_market_holder.GetTitledFirstName], сидя у себя за столом, [Select_CString(tgf_market_holder.IsFemale, 'похвалила', 'похвалил')] мой товар. Дескать, [tgf_good.Custom('GetTgfGoodLook')|l] — просто заглядение и надо взять ещё. [Select_CString(tgf_market_holder.IsFemale, 'Её', 'Его')] соседи собственными ушами слышали, как [Select_CString(tgf_market_holder.IsFemale, 'она', 'он')] это [Select_CString(tgf_market_holder.IsFemale, 'сказала', 'сказал')].\n\nПохвала всегда приятна. Похвала от постоянного покупателя приятна вдвойне."
 gdp_trade_good_flavor.1002.a: "Это настоящий подарок."
 gdp_trade_good_flavor.1002.b: "Это значит, что [Select_CString(tgf_market_holder.IsFemale, 'она готова', 'он готов')] платить больше."
 gdp_trade_good_flavor.1002.c: "Пусть говорят."
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "Из первых рук"
 gdp_trade_good_flavor.1003.desc: "«#L [tgf_source_culture.GetName]ие#! работники знают своё дело: что ни [tgf_good.Custom('GetTgfGoodSmallest')], то настоящий шедевр, — пишет [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] из графства [tgf_source_county.GetNameNoTier]. — [tgf_good.Custom('GetTradeGood_RU_Nom')|U] что надо, [tgf_good.Custom('GetTgfGoodMade')|l] и никакой халтуры».\n\nДостоверная информация — половина успеха."
 gdp_trade_good_flavor.1003.a: "Каждая подробность стоит денег."
 gdp_trade_good_flavor.1003.b: "Теперь я знаю точную цену этого товара."
 gdp_trade_good_flavor.1003.c: "Торговый люд должен уважать друг друга."
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "Открытая дорога"
 gdp_trade_good_flavor.1004.desc: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] улыбается так, будто уже [Select_CString(tgf_trader.IsFemale, 'потратила', 'потратил')] свою долю. «Дорога полностью открыта, а местные жители уже спрашивают, где [tgf_good.Custom('GetTgfGoodLook')|l]».\n\nХорошие годы проходят быстро. Их надо выжимать досуха."
 gdp_trade_good_flavor.1004.a: "Надо продавать, пока дорога добра."
 gdp_trade_good_flavor.1004.b: "Каждый хороший год — это урок. Он должен быть усвоен."
 gdp_trade_good_flavor.1004.c: "Закупить больше возов!"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "Сны о прибыли"
 gdp_trade_good_flavor.1005.desc: "Мне опять приснилась торговля. [tgf_good.Custom('GetTradeGood_RU_Nom')|U]. Бесчисленные [tgf_good.Custom('GetTradeGoodUnitPlural')] сложены в штабеля до самых стропил, а я смотрю сверху вниз, как мои покупатели дерутся за право платить первым.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "Мне опять приснились [tgf_good.Custom('GetTradeGood_RU_Nom')|l]. Огромные стада заполняют все дороги к рынку, а я скачу впереди и подсчитываю бегущих ко мне покупателей.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "Я просыпаюсь со смехом, а потом беру перо и начинаю записывать цифры. Когда-нибудь я разбогатею!"
 gdp_trade_good_flavor.1005.a: "Почему это должно оставаться сном?"
 gdp_trade_good_flavor.1005.a.tt: "Скоро появится новая [Concept('trade_opportunity', 'торговая возможность')|E]"
 gdp_trade_good_flavor.1005.b: "Цифры сработают. Я заставлю их сработать."
 gdp_trade_good_flavor.1005.c: "Ещё пять минут богатства... Хр-р#DIE1 хр-р#!#DIE2 хр-р...#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "Зачем проверять?"
 gdp_trade_good_flavor.1006.desc: "Когда я вхожу на склад, [Select_CString(tgf_trader.IsFemale, 'приказчица', 'приказчик')] [tgf_trader.GetFirstName] отводит меня в сторонку. «[tgf_good.Custom('GetTradeGood_RU_Nom')|U] из графства [tgf_source_county.GetNameNoTier] — [tgf_good.Custom('GetTgfGoodFlaw')]. Они держали нас за дураков и думали, что мы не проверим!»\n\nОни надеялись меня обмануть, но вместо этого сделали скидку."
 gdp_trade_good_flavor.1006.a: "За плохой товар полагается плохая цена."
 gdp_trade_good_flavor.1006.b: "Сами себя перехитрили."
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "Цена имени"
 gdp_trade_good_flavor.1007.desc: "[Select_CString(tgf_trader.IsFemale, 'Приказчица', 'Приказчик')] [tgf_trader.GetFirstName] [Select_CString(tgf_trader.IsFemale, 'принесла', 'принёс')] мне странные вести из графства [tgf_source_county.GetNameNoTier]. [tgf_good.Custom('GetTradeGood_RU_Nom')|U], [tgf_good.Custom('GetTgfGoodSold')], но все [tgf_source_culture.GetCollectiveNoun|l] спрашивают одно и то же. #EMP [tgf_good.Custom('GetTradeGood_RU_Nom')|U] с клеймом «[ROOT.Char.GetHouse.GetName]»#! — за этот товар они готовы платить, не торгуясь! Почти все запасы распроданы!\n\nОказывается, моё имя стоит денег."
 gdp_trade_good_flavor.1007.a: "Пусть все [tgf_good.Custom('GetTradeGoodUnitPlural')] будут отмечены моим клеймом."
 gdp_trade_good_flavor.1007.b: "Продавай, продавай, продавай!"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "[tgf_good.GetNameNoTooltip|U]: требуется оценка"
 gdp_trade_good_flavor.1008.desc: "[tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'прислала', 'прислал')] мне письмо, заверенное своей печатью. «Мне предложили партию товара. Это [tgf_good.Custom('GetTradeGood_RU_Nom')], примерно [tgf_good.Custom('GetTradeGoodUnit')], но мой эконом совершенно не умеет отличить хороший товар от плохого. Не могли бы вы взглянуть своим опытным глазом?»\n\nЛьстит. Лесть обычно хорошо оплачивается."
 gdp_trade_good_flavor.1008.a: "Истина, взвешенная и отмеренная."
 gdp_trade_good_flavor.1008.b: "Великолепный товар. Лучший, который мне доводилось видеть."
 gdp_trade_good_flavor.1008.c: "Мнение эксперта стоит денег."
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "Учимся считать"
 gdp_trade_good_flavor.1009.desc: "Я захожу на склад. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] на месте. И тут я вижу, как [Select_CString(tgf_heir.IsFemale, 'моя наследница', 'мой наследник')] [tgf_heir.GetFirstName] разглядывает товар с таким видом, будто [tgf_good.Custom('GetTradeGoodUnit')] скрывает в себе монетку.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "Я захожу в загон для [tgf_good.Custom('GetTradeGood_RU_Nom')]. Их там [tgf_good.Custom('GetTradeGoodUnit')]. И тут я замечаю, что [Select_CString(tgf_heir.IsFemale, 'моя наследница', 'мой наследник')] [tgf_heir.GetFirstName] разглядывает их с таким видом, будто у них под шкурами спрятаны монетки.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "Задатки есть. Пора их развивать."
 gdp_trade_good_flavor.1009.a: "Иди сюда. Смотри, как это делается."
 gdp_trade_good_flavor.1009.b: "Теперь пересчитай их. Дважды."
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "Подражатель"
 gdp_trade_good_flavor.1010.desc: "Из графства [tgf_source_county.GetNameNoTier] мне вернули ящик товара, «не соответствующего моим обычным стандартам». Товар оказался не мой: кто-то искусно подделал моё клеймо до последней завитушки.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "Из графства [tgf_source_county.GetNameNoTier] мне вернули небольшую партию скота, «не соответствующую моим обычным стандартам». Животные оказались чужие: кто-то искусно подделал моё клеймо до последней завитушки.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "[Select_CString(tgf_trader.IsFemale, 'Приказчица', 'Приказчик')] [tgf_trader.GetFirstName] [Select_CString(tgf_trader.IsFemale, 'выяснила', 'выяснил')], чья это работа. Это [Select_CString(tgf_rival.IsFemale, 'оказалась', 'оказался')] [tgf_rival.GetFirstName], [tgf_rival.Custom('GetTgfCompanyWord')] [tgf_rival.GetHouse.GetBaseNameNoTooltip]. Надо признать, копировать [Select_CString(tgf_rival.IsFemale, 'она', 'он')] умеет."
 gdp_trade_good_flavor.1010.a: "Покончить с этими подделками любой ценой!"
 gdp_trade_good_flavor.1010.b: "Пусть все дома узнают об этом оскорблении."
 gdp_trade_good_flavor.1010.c: "Этот подражатель делает мне бесплатную рекламу."
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U] [Select_CString(ROOT.Char.IsFemale, 'инициировала', 'инициировал')] разбирательство между домами по поводу подделок, которые выпускает [tgf_rival.GetShortUINameNotMe]."
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U] [Select_CString(char.IsFemale, 'инициировала', 'инициировал')] разбирательство между домами по поводу подделок, которые выпускает [target_char.GetShortUINameNotMe]."
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "Почём нынче [tgf_good.GetNameNoTooltip|l]"
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName|U], [Select_CString(tgf_envoy.IsFemale, 'приказчица', 'приказчик')], [tgf_rival.Custom('GetTgfCompanyWord')] [tgf_rival.GetHouse.GetBaseNameNoTooltip], [Select_CString(tgf_envoy.IsFemale, 'нашла', 'нашёл')] меня на складе и [Select_CString(tgf_envoy.IsFemale, 'положила', 'положил')] на стол тяжёлый кошель. «[Select_CString(tgf_rival.IsFemale, 'Моя госпожа', 'Мой господин')] [tgf_rival.GetFirstName] хочет получить список поставщиков, у которых вы закупаете такой товар, как [tgf_good.Custom('GetTradeGood_RU_Nom')]. Всех до единого. Кошель подкрепляет просьбу».\n\n[Select_CString(tgf_envoy.IsFemale, 'Она', 'Он')] покупает не имена. [Select_CString(tgf_envoy.IsFemale, 'Она', 'Он')] покупает годы моей работы."
 gdp_trade_good_flavor.1011.a: "Имена — это просто чернила. Плати."
 gdp_trade_good_flavor.1011.b: "Моё преимущество не продаётся."
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "Торговое перемирие"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U] — мой прямой конкурент. [Select_CString(tgf_ally.IsFemale, 'Её', 'Его')] товар, как и у меня, [tgf_good.Custom('GetTradeGood_RU_Nom')], а рынок — то же самое графство [tgf_source_county.GetNameNoTier]. Каждый сезон мы сбиваем цены, едва не разоряя друг друга. Но в этот раз [Select_CString(tgf_ally.IsFemale, 'она прислала', 'он прислал')] письмо с предложением прекратить эту практику и есть досыта.\n\nОказывается, мир — это тоже товар, который можно купить."
 gdp_trade_good_flavor.1012.a: "Я соглашусь. Мы будем есть досыта."
 gdp_trade_good_flavor.1012.b: "Я могу голодать дольше [Select_CString(tgf_ally.IsFemale, 'неё', 'него')]."
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U] и [tgf_ally.GetShortUINameNotMe] договорились не сбивать цены."
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U] и [target_char.GetShortUINameNotMe] договорились не сбивать цены."
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "Особая цена"
 gdp_trade_good_flavor.1013.desc: "[tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'прислала', 'прислал')] мне письмо, заверенное своей печатью. «[tgf_good.Custom('GetTradeGood_RU_Nom')|U]. Ты закупаешь этот товар на моём рынке. Если согласишься покупать его только у меня, то я предложу тебе цены, какие и не снились другим торговцам».\n\nЭксклюзивность — другое название ошейника. Но цены приятные."
 gdp_trade_good_flavor.1013.a: "[Select_CString(tgf_market_holder.IsFemale, 'Её', 'Его')] рынок, моя скидка. По рукам."
 gdp_trade_good_flavor.1013.b: "Я не склонюсь перед чужой мошной."
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "Опыт прожитых лет"
 gdp_trade_good_flavor.1014.desc: "К вам [Select_CString(tgf_porter.IsFemale, 'обратилась пожилая грузчица, которая принесла', 'обратился пожилой грузчик, который принёс')] тюк с товаром на склад в графстве [tgf_source_county.GetNameNoTier]. «Прошу прощения, но [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — товар непростой, его надо проверять совсем не так». [Select_CString(tgf_porter.IsFemale, 'Она показала', 'Он показал')] как надо: здесь, здесь и здесь.\n\nКак оказалось, бесчисленные перенесённые [tgf_good.Custom('GetTradeGoodUnitPlural')] научили [Select_CString(tgf_porter.IsFemale, 'её', 'его')] многому."
 gdp_trade_good_flavor.1014.desc.livestock: "К вам [Select_CString(tgf_porter.IsFemale, 'обратилась пожилая пастушка, пригнавшая', 'обратился пожилой пастух, пригнавший')] стадо на рынок в графстве [tgf_source_county.GetNameNoTier]. «Прошу прощения, но [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — скотина непростая, её надо оценивать совсем не так». [Select_CString(tgf_porter.IsFemale, 'Она показала', 'Он показал')] как надо: здесь, здесь и здесь.\n\nКак оказалось, долгая работа на местном рынке научила [Select_CString(tgf_porter.IsFemale, 'её', 'его')] многому."
 gdp_trade_good_flavor.1014.a: "Вот. Мудрость стоит денег."
 gdp_trade_good_flavor.1014.b: "Продолжай. Я слушаю."
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "Ошибка новичка"
 gdp_trade_good_flavor.1015.desc: "Где-то в графстве [tgf_source_county.GetNameNoTier] уличный торговец пьёт за моё здоровье. Казалось бы, [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — совсем простой товар, но цена, которую он с меня содрал, как оказалось, была совершенно непомерной.\n\nЧто ж. Дураки учатся... не быть дураками."
 gdp_trade_good_flavor.1015.a: "Дорогой урок — тоже урок."
 gdp_trade_good_flavor.1015.b: "Хватит. На сегодня дела окончены."
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "Справочник торговца"
 gdp_trade_good_flavor.1016.desc.intro: "Вот и [tgf_good.Custom('GetTradeGood_RU_Nom')] — привезли наконец. Принимая товар, я обнаруживаю в одном из ящиков завёрнутый в кожу томик"
 gdp_trade_good_flavor.1016.desc.intro_livestock: "Вот и [tgf_good.Custom('GetTradeGood_RU_Nom')] — пригнали наконец. Проверяя скот, я обнаруживаю среди упряжи завёрнутый в кожу томик под названием"
 gdp_trade_good_flavor.1016.desc.book_1: "«Практика коммерции»."
 gdp_trade_good_flavor.1016.desc.book_2: "«Книга дорог и рынков»."
 gdp_trade_good_flavor.1016.desc.book_3: "«Зеркало купца»."
 gdp_trade_good_flavor.1016.desc.outro: "Торговец, который нашёл время заполнить его страницы бесчисленными сведениями о мерах, весах и ценах, явно не нуждался во сне.\n\nКто-то потерял своё сокровище. Я им воспользуюсь."
 gdp_trade_good_flavor.1016.a: "Буду читать до рези в глазах."
 gdp_trade_good_flavor.1016.b: "Редкие книги стоят редких денег."
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "Плата за опыт"
 gdp_trade_good_flavor.1017.desc: "На рынке графства [tgf_source_county.GetNameNoTier] один #L [FOUNDER.GetCulture.GetNameNoTooltip|l]ий#! торговец предлагает мне свой товар. [tgf_good.Custom('GetTradeGood_RU_Nom')|U], вроде бы, ничего, вот только [tgf_good.Custom('GetTradeGoodUnit')|l] обычно стоит примерно втрое дешевле. «Ты ведь недавно в этом деле? Вот и плати за опыт».\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "На рынке графства [tgf_source_county.GetNameNoTier] один #L [FOUNDER.GetCulture.GetNameNoTooltip|l]ий#! торговец показывает мне свой товар. [tgf_good.Custom('GetTradeGood_RU_Nom')|U], вроде бы, ничего, вот только [tgf_good.Custom('GetTradeGoodUnit')|l] обычно стоит примерно втрое дешевле. «Ты ведь недавно в этом деле? Вот и плати за опыт».\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "Дерзко. Правильно, но дерзко."
 gdp_trade_good_flavor.1017.a: "Вот тебе монета. Учи меня."
 gdp_trade_good_flavor.1017.b: "Ни за что."
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "Неправильные гири"
 gdp_trade_good_flavor.1018.desc: "[Select_CString(tgf_trader.IsFemale, 'Приказчица', 'Приказчик')] [tgf_trader.GetFirstName] внезапно обнаружила, что [tgf_source_culture.GetCollectiveNoun|l] и [ROOT.Char.GetCulture.GetCollectiveNoun|l] используют разные меры веса для таких товаров, как [tgf_good.Custom('GetTradeGood_RU_Nom')]. Разница невелика, но [tgf_good.Custom('GetTradeGoodUnit')] получается чуть меньше, чем привыкли [tgf_source_culture.GetCollectiveNoun|l].\n\nЧестная ошибка. Что делать дальше, решать мне."
 gdp_trade_good_flavor.1018.a: "Исправить гири. Все до единой."
 gdp_trade_good_flavor.1018.b: "Разница остается в моём кошельке."
 gdp_trade_good_flavor.1018.c: "Взвесить по местному обычаю и громко сказать об этом."
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "Два товара, один покупатель"
 gdp_trade_good_flavor.1019.desc: "[tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'прислала', 'прислал')] мне письмо. «Меня интересуют следующие товары: [tgf_good.Custom('GetTradeGood_RU_Nom')] и [tgf_good_b.Custom('GetTradeGood_RU_Nom')]. Только комплектом — одно не имеет смысла без другого».\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "[tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'прислала', 'прислал')] мне письмо. «Меня интересуют следующие товары: [tgf_good.Custom('GetTradeGood_RU_Nom')] и [tgf_good_b.Custom('GetTradeGood_RU_Nom')]. Прошу отправить их в одной партии».\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "Два товара, один покупатель, одна цена. Люблю такую арифметику."
 gdp_trade_good_flavor.1019.a: "Продажа комплектом — цена за комплект."
 gdp_trade_good_flavor.1019.b: "Только по отдельности. Деньги сейчас стоят дороже, чем деньги потом."
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "Скидка для строителей"
 gdp_trade_good_flavor.1020.desc: "В графстве [tgf_build_county.GetNameNoTier] повсюду поднимаются леса: [tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'затеяла', 'затеял')] грандиозную стройку, материалы для которой поставляю в том числе и я. И сейчас [Select_CString(tgf_market_holder.IsFemale, 'она', 'он')] просит меня продавать такой товар, как [tgf_good.Custom('GetTradeGood_RU_Nom')|l], немного дешевле, пока стены не будут воздвигнуты.\n\nА ведь каждая из этих стен уже наполовину моя."
 gdp_trade_good_flavor.1020.a: "Скидка так скидка."
 gdp_trade_good_flavor.1020.b: "Скидку сделаю. Подарков не будет."
 gdp_trade_good_flavor.1020.c: "Услуга за услугу."
 gdp_trade_good_flavor.1020.d: "Лучший товар я придержу."
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "Знай свой товар"
 gdp_trade_good_flavor.1021.desc: "В каждом деле есть свои мастера, которые #EMP продолжают#! учиться всю жизнь. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] — непростая вещь, заслуживающая тщательного изучения. Сегодня вечером я возьму лампу и буду рассматривать лучшие образцы своего товара, пока не кончится масло.\n\nМне надо выяснить, почему мои [tgf_good.Custom('GetTradeGoodUnitPlural')|l] продаются, а чужие — нет."
 gdp_trade_good_flavor.1021.desc.livestock: "В каждом деле есть свои мастера, которые продолжают учиться всю жизнь. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] — непростые животные, заслуживающие тщательного изучения. Сегодня вечером я возьму фонарь и буду исследовать лучших особей из своего стада от зубов до хвоста.\n\nМне надо выяснить, почему мой скот продаётся, в чужой — нет."
 gdp_trade_good_flavor.1021.desc.books: "В каждом деле есть свои мастера, которые #EMP продолжают#! учиться всю жизнь. Сегодня вечером я возьму лампу и буду читать лучшие книги из своих запасов, пока не кончится масло.\n\nМне надо выяснить, почему мои книги продаются, а чужие — нет."
 gdp_trade_good_flavor.1021.a: "Это будет мой эталон. С ним я буду сравнивать другие товары."
 gdp_trade_good_flavor.1021.b: "Учиться никогда не поздно."
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "Торговое имя"
 gdp_trade_good_flavor.1022.desc: "В графстве [tgf_source_county.GetNameNoTier] меня уже никто не называет по имени. Достаточно сказать «[tgf_good.Custom('GetTgfGoodNickname')]» — и все сразу понимают, о ком идёт речь. #bold Обо мне.#!\n\nКороли награждают титулами, а рынки — подобными прозвищами, которые ещё надо заслужить."
 gdp_trade_good_flavor.1022.a: "Вульгарно. Полезно, но вульгарно."
 gdp_trade_good_flavor.1022.b: "Пускай. Это хорошо для дела."
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "Дефицит поставок"
 gdp_trade_good_flavor.1023.desc: "«Вы скупаете их быстрее, чем мы делаем, — говорит [Select_CString(tgf_foreman.IsFemale, 'смотрительница', 'смотритель')] [tgf_foreman.GetFirstName] из графства [tgf_source_county.GetNameNoTier], пока я наблюдаю, как заказанный мной товар, [tgf_good.Custom('GetTradeGood_RU_Nom')], [tgf_good.Custom('GetTgfGoodMade')]. — Больше работников у меня нет».\n\nРаботники стоят денег, но отказ покупателю может обойтись ещё дороже."
 gdp_trade_good_flavor.1023.a: "Наймите ещё работников. Я заплачу."
 gdp_trade_good_flavor.1023.b: "Иди лучше работать ко мне."
 gdp_trade_good_flavor.1023.c: "Ну-ка, покажи, как это делается."
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "Продано!"
 gdp_trade_good_flavor.1024.desc: "«[tgf_good.Custom('GetTradeGood_RU_Nom')], [tgf_good.Custom('GetTradeGoodUnitPlural')|l], сорок штук!» [tgf_source_province.Custom('GetRegionalMarketTerm')|U] графства [tgf_source_county.GetNameNoTier], как обычно, шумит. Торги в самом разгаре. [tgf_rival.GetFirstName] из дома [tgf_rival.GetHouse.GetBaseNameNoTooltip] поднимает руку, прежде чем аукционист успевает опустить молоток.\n\n[Select_CString(tgf_rival.IsFemale, 'Она', 'Он')] смотрит на меня с улыбкой, считая, что лот уже у [Select_CString(tgf_rival.IsFemale, 'неё', 'него')] в кармане..."
 gdp_trade_good_flavor.1024.a: "Добавлять по одной монете к [Select_CString(tgf_rival.IsFemale, 'её', 'его')] ставкам."
 gdp_trade_good_flavor.1024.b: "Поднимаем, поднимаем, поднимаем... а вот теперь покупай, [tgf_rival.GetFirstNameNoTooltip]!"
 gdp_trade_good_flavor.1024.c: "Пусть [Select_CString(tgf_rival.IsFemale, 'она', 'он')] сделает ставку. Я посмотрю, кто выиграет."
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "Первые в порту"
 gdp_trade_good_flavor.1025.desc: "«У нас один кран на двадцать судов, — говорит [tgf_docks_boss.GetFirstName], [Select_CString(tgf_foreman.IsFemale, 'начальница', 'начальник')] портовых грузчиков графства [tgf_source_county.GetNameNoTier]. — Кто первым выгрузит товар, тому и решать, почём [tgf_good.Custom('GetTradeGood_RU_Nom')] в этом сезоне. И это можешь быть ты».\n\n[Select_CString(tgf_foreman.IsFemale, 'Она', 'Он')] поднимает руку ладонью вверх."
 gdp_trade_good_flavor.1025.a: "Цену назначает тот, кто первый высадится с лодки."
 gdp_trade_good_flavor.1025.b: "Тогда я продам свой товар прямо с палубы."
 gdp_trade_good_flavor.1025.c: "Пусть другие разгружаются первыми. Посмотрим, что они предложат."
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "Оптом и в розницу"
 gdp_trade_good_flavor.1026.desc: "«[tgf_good.Custom('GetTgfGoodSmallest')|U] за раз, так покупают бедняки», — говорит [tgf_stallholder.GetFirstName], [Select_CString(tgf_stallholder.IsFemale, 'хозяйка', 'владелец')] лавки на рынке графства [tgf_source_county.GetNameNoTier]. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] уже на месте. [tgf_good.Custom('GetTradeGoodUnit')|U] этого товара превращается у него в сотню крошечных пакетиков, каждый из которых продаётся чуть дороже себестоимости.\n\n«Ты меня снабжаешь, я тебе плачу»."
 gdp_trade_good_flavor.1026.a: "[tgf_good.Custom('GetTradeGoodUnit')|U] высшего качества в любое время. По рукам."
 gdp_trade_good_flavor.1026.b: "Продать им товар по той цене, которую они могут себе позволить."
 gdp_trade_good_flavor.1026.c: "Забирай всё. Уже заплачено."
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "Рыночный день"
 gdp_trade_good_flavor.1027.desc: "«[tgf_good.Custom('GetTradeGood_RU_Nom')|U]! [tgf_good.Custom('GetTgfGoodLook')|U]! Кому [tgf_good.Custom('GetTradeGood_RU_Nom')|l]?» В графстве [tgf_source_county.GetNameNoTier] рыночный день, а моего зазывалу почти не слышно. А ведь здесь собрались все местные покупатели, да ещё и при деньгах.\n\nЯ хочу, чтобы они отдали эти деньги #EMP мне!#!"
 gdp_trade_good_flavor.1027.a: "Мне нужен лучший зазывала. За любые деньги."
 gdp_trade_good_flavor.1027.b: "Не будем терять время. Я пойду [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] зазывать клиентов."
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "Чужеземная монета"
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], [Select_CString(tgf_buyer.IsFemale, 'клиентка', 'клиент')] из графства [tgf_source_county.GetNameNoTier], хочет заключить сделку: с меня [tgf_good.Custom('GetTradeGood_RU_Nom')|l], с него [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')|l]. «Монета есть монета», — говорит [Select_CString(tgf_buyer.IsFemale, 'она', 'он')].\n\nЯ соглашаюсь и называю курс обмена. [Select_CString(tgf_buyer.IsFemale, 'Она', 'Он')] сразу же перестаёт улыбаться."
 gdp_trade_good_flavor.1028.a: "Ладно. Серебро есть серебро."
 gdp_trade_good_flavor.1028.b: "Хорошо, но курс будет мой."
 gdp_trade_good_flavor.1028.c: "Я лучше возьму в уплату товар. [tgf_good_b.Custom('GetTradeGood_RU_Nom')|U] — неплохой вариант."
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "Годы на дороге"
 gdp_trade_good_flavor.1029.desc: "«Твои товары, [tgf_good.Custom('GetTradeGood_RU_Nom')], ездят по этой дороге уже три года, — говорит [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], поднимая кубок. — И пока за ними [Select_CString(tgf_trader.IsFemale, 'присматривала', 'присматривал')] я, у тебя ни разу ничего не пропало!»\n\nНа самом деле, пропало целых пять грузов. Но пусть в этот раз [Select_CString(tgf_trader.IsFemale, 'она', 'он')] насладится своим триумфом."
 gdp_trade_good_flavor.1029.a: "Ты отлично поработал!"
 gdp_trade_good_flavor.1029.b: "Пусть это продлится ещё три года."
 gdp_trade_good_flavor.1029.c: "Ты пойдёшь дальше. Намного дальше."
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "Приятные моменты"
 gdp_trade_good_flavor.1030.desc: "«Вот, а это [tgf_good.Custom('GetTradeGood_RU_Nom')] дома [ROOT.Char.GetHouse.GetName], — говорит [Select_CString(tgf_buyer.IsFemale, 'покупательница', 'покупатель')] на рынке графства [tgf_source_county.GetNameNoTier], указывая на мои [tgf_good.Custom('GetTradeGoodUnitPlural')]. — [tgf_good.Custom('GetTgfGoodLook')|U]!»\n\n[Select_CString(tgf_buyer.IsFemale, 'Она', 'Он')] даже не подозревает, что [ROOT.Char.GetHouse.GetName] стоит прямо у [Select_CString(tgf_buyer.IsFemale, 'неё', 'него')] за спиной.\n\nЯ могу что-нибудь сказать. Или молча насладиться ситуацией."
 gdp_trade_good_flavor.1030.a: "Промолчать. Послушаем, чего они хотят."
 gdp_trade_good_flavor.1030.b: "Да, это так. Можно было догадаться."
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "Чужие деньги"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] и [tgf_investor_b.GetFirstName], [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] из графства [tgf_source_county.GetNameNoTier], уже много лет покупают у меня такие товары, как [tgf_good.Custom('GetTradeGood_RU_Nom')]. Теперь они хотят войти в долю.\n\n«Доля в твоём деле, — говорит [tgf_investor_a.GetFirstNameNoTooltip], пока [tgf_investor_b.GetFirstNameNoTooltip] отсчитывает монеты. — Мы хорошо платим и почти не задаём вопросов».\n\nВопросы будут. Инвесторы всегда их задают."
 gdp_trade_good_flavor.1031.a: "С вас деньги, с меня прибыль. Точнее, её часть."
 gdp_trade_good_flavor.1031.b: "Это дело останется семейным."
 gdp_tgf_kept_in_family_unity_desc: "Семейное дело сохранено"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "Зал славы"
 gdp_trade_good_flavor.1032.desc: "«Это что, [tgf_good.Custom('GetTradeGood_RU_Nom')|l]?» — говорит каждый, кто входит в парадный зал моего особняка. Да, это лучший мой товар, [tgf_good.Custom('GetTgfGoodLook')|l]. Он специально выложен там, где его точно заметят.\n\nНикто не уйдёт из моего дома, не зная, чем я торгую."
 gdp_trade_good_flavor.1032.desc.livestock: "«Это что, [tgf_good.Custom('GetTradeGood_RU_Nom')|l]?» — говорит каждый, кто входит в парадный зал моего особняка, осторожно глядя под ноги. Да, это мой лучший товар, [tgf_good.Custom('GetTgfGoodLook')|l], стойла которых устроены на само видном месте.\n\nНикто не уйдёт из моего дома, не узнав, чем я торгую. И не проверив обувь."
 gdp_trade_good_flavor.1032.a: "Пусть смотрят. И рассказывают."
 gdp_trade_good_flavor.1032.b: "Берите, это подарок."
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "Богатый опыт"
 gdp_trade_good_flavor.1033.desc: "Мне написал старый поставщик, с которым мы когда-то вели дела: «[tgf_good.Custom('GetTradeGood_RU_Nom')|U] в этом году — высший сорт. Я отложил для тебя немного, не хочешь купить?»\n\nЭти дела давно остались в прошлом, но в таких товарах, как [tgf_good.Custom('GetTradeGood_RU_Nom')], я по-прежнему разбираюсь. И на этом можно заработать."
 gdp_trade_good_flavor.1033.a: "Написать в ответ. Не стоит терять хватку."
 gdp_trade_good_flavor.1033.b: "Мои знания продаются. За деньги."
 gdp_trade_good_flavor.1033.c: "Обойдусь. У меня сейчас другие дела."
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "Дорожные заметки"
 gdp_trade_good_flavor.1034.desc: "[Select_CString(tgf_pilgrim.IsFemale, 'Паломница', 'Паломник')] [tgf_pilgrim.GetFirstName], [Select_CString(tgf_pilgrim.IsFemale, 'встреченная', 'встреченный')] мной на постоялом дворе графства [tgf_source_county.GetNameNoTier], достаёт потрёпанную книжицу. «Здесь каждая дорога, каждый трактир и каждый брод отсюда до самого моря. А на полях выписаны все рынки, где хорошо платят за такие товары, как [tgf_good.Custom('GetTradeGood_RU_Nom')]. Могу продать».\n\nМои приказчики так далеко ещё не забирались."
 gdp_trade_good_flavor.1034.a: "Назови свою цену, паломник."
 gdp_trade_good_flavor.1034.b: "Перепишу её за ночь. Утром верну."
 gdp_trade_good_flavor.1034.c: "Лучше расскажи, что ты [Select_CString(tgf_pilgrim.IsFemale, 'видела', 'видел')] на рынках."
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "Деловой разговор"
 gdp_trade_good_flavor.1035.desc: "«Так всё-таки, чем ты занимаешься?» — [Select_CString(tgf_guest.IsFemale, 'спросила моя гостья', 'спросил мой гость')] [tgf_guest.GetFirstName] на послеобеденной прогулке. Вскоре [Select_CString(tgf_guest.IsFemale, 'она пожалела', 'он пожалел')] о своём вопросе: пока я [Select_CString(ROOT.Char.IsFemale, 'рассказывала', 'рассказывал')] о том, как [tgf_good.Custom('GetTgfGoodMade')|l] [tgf_good.Custom('GetTradeGood_RU_Nom')|l], мы дважды обошли весь рынок.\n\nКак ни странно, [Select_CString(tgf_guest.IsFemale, 'она', 'он')] ни разу меня не [Select_CString(tgf_guest.IsFemale, 'перебила', 'перебил')]. Похоже, у меня появился новый клиент."
 gdp_trade_good_flavor.1035.a: "Обсудим условия за десертом?"
 gdp_trade_good_flavor.1035.b: "Хватит обо мне. Ты вот у кого закупаешься?"
 gdp_trade_good_flavor.1035.c: "Вот, послушай, как мне удалось сколотить своё первое состояние."
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "Упаковка"
 gdp_trade_good_flavor.1036.desc: "«Добавим ещё [tgf_good.Custom('GetTradeGoodUnitPlural')] — по трети в каждую телегу, — говорит [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], комментируя процесс погрузки. — Кое-что, конечно, рассыплется по дороге, покупатели будут ворчать. Но большая часть доедет».\n\n«Большая часть» — это хорошо. А «кое-что» — терпимо."
 gdp_trade_good_flavor.1036.a: "Упаковать плотнее. Пусть все щели заполняет прибыль."
 gdp_trade_good_flavor.1036.b: "Упаковать надёжнее. Покупатели будут судить по первой открытой упаковке."
 gdp_trade_good_flavor.1036.c: "Оставить как есть. До сих пор всё было нормально."
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "Рыночная печать"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "Специальный чиновник, проверяющий качество товаров и точность мер у торговцев. Проверенные товары он заверяет специальной свинцовой или восковой печатью. За каждую такую печать взимается плата, а продавать ткань и другие товары без неё запрещено во иногих городах."
 gdp_trade_good_flavor.1037.desc: "«Товары с печатью лучше продаются. Это все знают, — говорит [tgf_sealer.GetFirstName], [Glossary( 'чиновник', 'TGF_SEALER_GLOSS' )] из графства [tgf_source_county.GetNameNoTier], не поднимая глаз. — А я ставлю печати так, как мне платят, а не так, как меня просят».\n\nМои телеги стоят под солнцем. В них [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — моя потенциальная прибыль."
 gdp_trade_good_flavor.1037.a: "Значит, подождём. Печать есть печать."
 gdp_trade_good_flavor.1037.b: "Вот. Ставь свои печати быстрее."
 gdp_trade_good_flavor.1037.c: "Моё имя лучше любой печати."
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "Посредник"
 gdp_trade_good_flavor.1038.desc: "«Я знаю купцов, о которых вы никогда не слыхали, из городов, где вы никогда не бывали, — говорит человек с хитрым лицом из таверны в графстве [tgf_source_county.GetNameNoTier], наливая мне чашу, которую я не заказывал. — У вас [tgf_good.Custom('GetTradeGood_RU_Nom')|l], у них деньги, а у меня свой небольшой интерес».\n\nТри стороны. И лишь одна из них получает бесплатный напиток."
 gdp_trade_good_flavor.1038.a: "Найдите их. И возьмите свою долю."
 gdp_trade_good_flavor.1038.b: "Спасибо, я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] найду себе покупателей."
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "Подмастерье приказчика"
 gdp_trade_good_flavor.1039.desc: "«[Select_CString(tgf_youth.IsFemale, 'Этот парень', 'Эта девчонка')] считает быстрее меня», — говорит [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')], выталкивая вперёд [Select_CString(tgf_youth.IsFemale, 'тощую девицу', 'тощего юнца')] по имени [tgf_youth.GetFirstName]. Едва я успеваю спросить, почём нынче [tgf_good.Custom('GetTradeGood_RU_Nom')|l], [Select_CString(tgf_youth.IsFemale, 'она', 'он')] уверенно называет цены на обоих наших рынках.\n\nУмного ребёнка содержать дорого. Умный ребёнок, работающий на меня, возместит все расходы с лихвой."
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip] останется со мной."
 gdp_trade_good_flavor.1039.b: "Оставь [Select_CString(tgf_youth.IsFemale, 'её', 'его')] при себе, [tgf_trader.GetFirstNameNoTooltip]. Учи [Select_CString(tgf_youth.IsFemale, 'её', 'его')] как следует."
 gdp_trade_good_flavor.1039.c: "У нас и так хватает ртов."
 gdp_tgf_family_only_unity_desc: "Компания продолжила принадлежать семье"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "Купание в богатстве"
 gdp_trade_good_flavor.1040.desc: "Поздняя ночь. На складе нет никого, кроме меня. Кругом [tgf_good.Custom('GetTgfGoodLook')]. Огромные груды, которые поднимаются выше моей головы. Я зачёрпываю горсть и пропускаю её между пальцев — [tgf_good.Custom('GetTgfGoodSmallest')] за раз.\n\nВ голову закрадывается мысль. А что, если... #EMP нырнуть?#!"
 gdp_trade_good_flavor.1040.a: "Ныряй, как довольная утка!"
 gdp_trade_good_flavor.1040.a.toast: "Жёсткое приземление"
 gdp_trade_good_flavor.1040.b: "Нет. Лучше пересчитать. [tgf_good.Custom('GetTgfGoodSmallest')|U] раз, [tgf_good.Custom('GetTgfGoodSmallest')] два..."
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "Первая продажа"
 gdp_trade_good_flavor.1041.desc: "Я открываю старый сундук и достаю свёрток. Внутри [tgf_good.Custom('GetTradeGood_RU_Nom')|l]. Всего лишь [tgf_good.Custom('GetTgfGoodSmallest')], но это первый товар, который я [Select_CString(ROOT.Char.IsFemale, 'продала', 'продал')] за свою жизнь. Много лет назад я [Select_CString(ROOT.Char.IsFemale, 'выкупила', 'выкупил')] его за двойную цену.\n\nКогда никто не видит, я достаю его и рассказываю, какой долгий путь мы прошли. Каждая заработанная мной монетка — его дитя."
 gdp_trade_good_flavor.1041.a: "В раму — и повесить на стену."
 gdp_trade_good_flavor.1041.b: "Эта вещица помнит, с чего всё начиналось. За неё наверняка хорошо заплатят."
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "Монеты под подушкой"
 gdp_trade_good_flavor.1042.desc: "У меня появилась новая традиция: перед тем как лечь спать, я кладу под подушку туго набитый кошель и желаю ему спокойной ночи. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] — вот что принесло мне богатство.\n\nНикогда прежде мне не доводилось спать на столь твёрдой — и столь дорогой — подушке."
 gdp_trade_good_flavor.1042.a: "Нет в мире подушки милее этой."
 gdp_trade_good_flavor.1042.b: "Деньги не должны лежать без дела. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] — вот что мне нужно, куплю-ка ещё!"
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "Портрет с монетами"
 gdp_trade_good_flavor.1043.desc: "«Вы сидите за столом, по одну сторону — [tgf_good.Custom('GetTradeGood_RU_Nom')|l], по другую — монеты, — произносит [Select_CString(tgf_painter.IsFemale, 'художница', 'художник')] [tgf_painter.GetFirstName] и складывает пальцы, словно обрамляя картину; здесь [Select_CString(tgf_painter.IsFemale, 'она', 'он')] проездом, и [tgf_source_county.GetNameNoTier] для [Select_CString(tgf_painter.IsFemale, 'неё', 'него')] — не более чем возможность подзаработать. — Конечно, я нарисую каждую монету, которую вы [Glossary( 'считаете', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )]».\n\nСчитать — это хорошо. Я уважаю счёт."
 gdp_trade_good_flavor.1043.a: "Прорисуйте каждую монету."
 gdp_trade_good_flavor.1043.b: "Сделайте монеты #EMP побольше#!."
 gdp_trade_good_flavor.1043.c: "Художник — не то же самое, что клиент."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "Купцы и менялы нередко заказывали художникам свои портреты, изображающие их за работой, среди монет и весов. В 1449 году Петрус Кристус изобразил ювелира, взвешивающего кольцо для обручённой пары."
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "Слишком тяжёлый кошель"
 gdp_trade_good_flavor.1044.desc: "«Прикажете привести ещё слугу, [ROOT.Char.Custom('FormOfAddressForLiege')]?» — спрашивает меня [tgf_servant.GetFirstName]. Торговля таким товаром, как [tgf_good.Custom('GetTradeGood_RU_Nom')|l], — прибыльное дело: мой кошель потяжелел настолько, что его вынужден носить слуга.\n\nВозможно, лучше будет погрузить его на телегу."
 gdp_trade_good_flavor.1044.a: "Да. Будете ходить вдвоём — и без спешки."
 gdp_trade_good_flavor.1044.b: "Нет. Везите телегу — и непременно с моим именем!"
 gdp_trade_good_flavor.1044.c: "Сначала пойдём через рынок, [tgf_servant.GetFirstNameNoTooltip]. Там наверняка есть [tgf_good.Custom('GetTradeGood_RU_Nom')]."
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "Богатство и благочестие"
 gdp_trade_good_flavor.1045.desc: "Все мои бухгалтерские книги начинаются одинаково, [Glossary( 'по-старому', 'TGF_DATINI_GLOSS' )]: во имя [ROOT.Char.GetFaith.HighGodNamePossessive] и прибыли. В этом году прибыль особенно обильна: моя рука заполнила сорок страниц, и ни один грош так и не был отдан во славу [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nНо любой купец знает, что партнёру полагается заслуженная доля."
 gdp_trade_good_flavor.1045.a: "Тому, кто выше, полагается его доля."
 gdp_trade_good_flavor.1045.b: "Тихая молитва во славу [ROOT.Char.GetFaith.HighGodNamePossessive] — и снова за счётные книги."
 gdp_trade_good_flavor.1045.c: "Спасибо, [ROOT.Char.GetFaith.HighGodName], что мне так хорошо даются эти дела. Невежливо будет останавливаться."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "Согласно Торе, Библии и Корану, одному египетскому фараону приснилось, будто семь тощих коров пожирают семь тучных. Иосиф истолковал этот сон как предсказание семи лет изобилия, за которыми последуют семь лет голода. По его совету египтяне заранее запасли зерно."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "Франческо Датини, купец из Прато, начинал свои бухгалтерские книги словами: «во имя Бога и прибыли». Он умер одним из богатейших людей Тосканы."
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "Родная кровь"
 gdp_trade_good_flavor.1046.desc: "«[tgf_source_county.GetNameNoTier] — наполовину #L [tgf_source_culture.GetCollectiveNoun|l]ое#! владение, равно как и моя кровь наполовину #L [tgf_source_culture.GetCollectiveNoun|l]ая#!, — сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — Передо мной открывают двери там, где вас не пустили бы на порог. Мне делают скидку те, для кого [ROOT.Char.GetCulture.GetName|l], как вы, — злейший враг».\n\n[tgf_trader.GetFirstNameNoTooltip] не имеет в виду ничего злого. Я же предпочитаю сделать вид, что меня интересуют только цены."
 gdp_trade_good_flavor.1046.a: "С этой минуты переговоры ведёшь ты."
 gdp_trade_good_flavor.1046.b: "Вот. Нельзя, чтобы тебя переманили."
 gdp_trade_good_flavor.1046.c: "Значит, я усвою их порядки."
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "Наплыв на рынок"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.Custom('GetTgfCompanyWord')|U] семейства [tgf_rival.GetHouse.GetBaseNameNoTooltip] в лице такого человека, как [tgf_rival.GetFirstName], торгует себе в убыток: [tgf_source_county.GetNameNoTier] относительно неблизко, и [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — товар, на доставку которого они тратят больше, чем зарабатывают на его продаже. [Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] в ярости.\n\nМеня же обуревает любопытство. Грех не закупиться по такой цене. Грех вдвойне, если закупаться будет кто-то ещё."
 gdp_trade_good_flavor.1047.a: "Если [tgf_rival.GetFirstNameNoTooltip] предлагает свой товар задёшево — я не стану отказываться."
 gdp_trade_good_flavor.1047.b: "Пусть [tgf_rival.GetFirstNameNoTooltip] торгует в убыток. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] на моих прилавках — другой разговор: я не стану снижать цены."
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "Рукопись в кипе"
 gdp_trade_good_flavor.1048.desc: "Чьи-то заботливые руки во владении [tgf_source_county.GetNameNoTier] завернули мой товар — это [tgf_good.Custom('GetTradeGood_RU_Nom')|l], —в страницы старой книги, чтобы уберечь его от сырости. [Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] аккуратно разворачивает «упаковку». «Смотрите, [Glossary( 'книга', 'TGF_HOUSE_OF_WISDOM_GLOSS' )], — даже почти что целая. Кто-то её наверняка хватится».\n\nДеньги уплачены только за товар. Книгу мне отдали бесплатно — и, возможно, её тоже получится продать."
 gdp_trade_good_flavor.1048.a: "Оставлю её себе."
 gdp_trade_good_flavor.1048.b: "Продам её вместе с товаром."
 gdp_trade_good_flavor.1048.c: "Отправлю её обратно во владение [tgf_source_county.GetNameNoTierNoTooltip]."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "Купцы возили через границу не только товары, но и книги. В багдадском Доме мудрости учёные переводили попавшие к ним труды греческих, персидских и индийских мыслителей на арабский язык. Позднее многие из этих сочинений были переведены с арабского на латынь."
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "Купцы вдали от дома"
 gdp_trade_good_flavor.1049.desc: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] пишет мне из владения [tgf_source_county.GetNameNoTier]: «Здесь есть целый #L [ROOT.Char.GetCulture.GetCollectiveNoun|l]ий#! [Glossary( 'квартал', 'TGF_DIASPORA_GLOSS' )], и каждый в нём скучает по дому. Стоит им только услышать знакомое имя „[ROOT.Char.GetHouse.GetBaseNameNoTooltip]“, как вокруг немедленно собирается толпа».\n\nЗначит, на тоске по родине тоже можно заработать."
 gdp_trade_good_flavor.1049.a: "Будем торговать с ними так же, как торгуем у себя на родине."
 gdp_trade_good_flavor.1049.b: "Пусть их старейший дом войдёт в мою компанию."
 gdp_trade_good_flavor.1049.c: "За знакомые вкусы можно и заплатить."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "Оседавшие за границей купцы нередко основывали собственные кварталы: согдийцы селились вдоль Шёлкового пути, венецианцы — в Константинополе, а еврейские торговцы — от Каира до Адена. Через них их земляки на родине вели торговлю с другими странами."
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "[tgf_good.GetNameNoTooltip|U] на пути"
 gdp_trade_good_flavor.1050.desc: "Меня знакомят с человеком по имени [tgf_smuggler.GetFirstName] — [Glossary( 'контрабандистом', 'TGF_SMUGGLER_GLOSS' )] из владения [tgf_source_county.GetNameNoTier], хорошо поднаторевшим в науке торговли: [tgf_good.Custom('GetTradeGoodUnit')|l] товара, что лежит сверху на каждой повозке, — хуже всех остальных, описать это зрелище можно только словами «[tgf_good.Custom('GetTgfGoodFlaw')|l]», поэтому сборщики налогов, которых присылает [tgf_market_holder.GetTitledFirstName|l], быстро теряют интерес.\n\n«В половину рыночной цены, — произносит [tgf_smuggler.GetFirstNameNoTooltip]. — Всё, что ниже, — превосходного качества»."
 gdp_trade_good_flavor.1050.a: "Половина — это моя любимая цена."
 gdp_trade_good_flavor.1050.a.toast: "Молва разносится"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] будет [Select_CString(tgf_market_holder.IsFemale, 'благодарна', 'благодарен')] — за твою голову."
 gdp_trade_good_flavor.1050.c: "Мне всегда нужны люди, умеющие обманывать сборщиков налогов."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "Там, где правители облагали товары пошлинами, всегда находились те, кто умел их обходить. Особенно прибыльной была контрабанда соли — товара, облагавшегося налогом почти повсюду. В Китае эпохи Тан контрабандист Хуан Чао даже сумел поднять восстание и захватить столицу — Чанъань."
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "Небывалые плоды труда"
 gdp_trade_good_flavor.2001.desc: "Из владения [tgf_source_county.GetNameNoTier], откуда ко мне попадает такой товар, как [tgf_good.Custom('GetTradeGood_RU_Nom')|l], поступила весть: #L [tgf_source_culture.GetCollectiveNoun|l]ие#! крестьяне собрали небывалый за последние 20 лет урожай, настолько обильный, что он даже не помещается в амбары.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "Из владения [tgf_source_county.GetNameNoTier], откуда ко мне попадает такой товар, как [tgf_good.Custom('GetTradeGood_RU_Nom')|l], поступила весть: #L [tgf_source_culture.GetCollectiveNoun|l]ие#! пастухи взрастили столько скота, сколько здесь не видели за последние 20 лет. Поголовье настолько обильно, что его невозможно ни прокормить, ни поставить в загоны.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "Удачный год для них — и приятная цена для меня."
 gdp_trade_good_flavor.2001.a: "Пусть празднуют; а мы пока закрепим цены."
 gdp_trade_good_flavor.2001.b: "Нужно отправиться туда и выяснить, как они вырастили такую жатву."
 gdp_trade_good_flavor.2001.b.livestock: "Нужно отправиться туда и выяснить, как они вырастили столько скота."
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "Добыча охотников"
 gdp_trade_good_flavor.2002.desc: "«[tgf_good.Custom('GetTgfGoodGatherers')|U] из владения [tgf_source_county.GetNameNoTier] превзошли сами себя, — сообщает [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — [tgf_good.Custom('GetTradeGood_RU_Nom')|U] в таком количестве, сколько собирают за один сезон, да ещё и превосходного качества — и за один раз. Нам уже поступают предложения».\n\nПродать всё без остатка или оставить себе лучшие экземпляры? Такие трудные вопросы мне по душе."
 gdp_trade_good_flavor.2002.a: "Продать всё, пока цена высока."
 gdp_trade_good_flavor.2002.b: "Лучший экземпляр останется у меня."
 gdp_trade_good_flavor.2002.c: "Заполнить все прилавки! Пусть каждому достанется хоть немного."
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "Хорошая жила"
 gdp_trade_good_flavor.2003.desc: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] только что [Select_CString(tgf_trader.IsFemale, 'побывала', 'побывал')] на дороге, ведущей во владение [tgf_source_county.GetNameNoTier]; на [Select_CString(tgf_trader.IsFemale, 'её', 'его')] лице играет ухмылка. «Обнаружили новую жилу: обильную, совсем близкую к земле. Все рудокопы уже выстроились в очередь — каждый хочет до неё добраться. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] сегодня дешевле некуда. Вернее, есть куда, — надо лишь выкупить жилу».\n\nЯ не знаю таких жил, которые не дорожали бы стремительно."
 gdp_trade_good_flavor.2003.desc.amber: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] только что [Select_CString(tgf_trader.IsFemale, 'побывала', 'побывал')] на дороге, ведущей во владение [tgf_source_county.GetNameNoTier]; на [Select_CString(tgf_trader.IsFemale, 'её', 'его')] лице играет ухмылка. «Осенние ветры к нам благосклонны: [tgf_good.Custom('GetTradeGood_RU_Nom')|l] на берегу в таком количестве, что все уже высыпали с корзинами. Цены сейчас низки, а будут ещё ниже, если платить сборщикам начнём #EMP мы#!».\n\nНужно успеть воспользоваться щедростью моря."
 gdp_trade_good_flavor.2003.a: "Выкупить жилу."
 gdp_trade_good_flavor.2003.a.amber: "Заплатить сборщикам."
 gdp_trade_good_flavor.2003.b: "Начать скупать товар, заполоняя каждую повозку."
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "Секрет того стоит"
 gdp_trade_good_flavor.2004.desc: "«Новый цвет!» — хвастается [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] и показывает мне образец ткани из владения [tgf_source_county.GetNameNoTier]. Местные красильщики клянутся, что секрет производства знают только они.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "«Новый вид глазури!» — хвастается [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] и показывает мне образец из владения [tgf_source_county.GetNameNoTier]. Местные мастера клянутся, что секрет производства знают только они.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "Секреты всегда стоят дорого, но за особенно редкие можно и заплатить."
 gdp_trade_good_flavor.2004.a: "Пусть назовут цену. Этим секретом непременно нужно завладеть."
 gdp_trade_good_flavor.2004.b: "Красиво и интересно. А теперь — к другим делам."
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "Проба товара"
 gdp_trade_good_flavor.2005.desc: "Каждый купец должен знать свой товар, и [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — не исключение. Каждую партию я пробую на вкус трижды: сначала — из чувства ответственности, затем — чтобы убедиться наверняка, и наконец — просто ради удовольствия. К вечеру вся партия словно растворяется в воздухе.\n\nНевероятно вкусно. [tgf_source_culture.GetName|U] наверняка заплатят мне вдвойне."
 gdp_trade_good_flavor.2005.a: "Вдвойне. Именно что вдвойне."
 gdp_trade_good_flavor.2005.b: "М-м… Ну, ещё штучку, — проверить качество."
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "Подобающая одежда"
 gdp_trade_good_flavor.2006.desc: "Хочешь торговать [tgf_good.Custom('GetTradeGood_RU_Inst')|l] — носи [tgf_good.Custom('GetTradeGood_RU_Acc')|l]? Я прибываю на рынок, нарядившись в лучший образец своего товара, и ловлю на себе любопытствующие взгляды.\n\nЯ — лишь посланник. Товар говорит сам за себя."
 gdp_trade_good_flavor.2006.a: "Мне нравится, как всё это сидит. Пусть так и будет."
 gdp_trade_good_flavor.2006.a.tt_furs: "Отныне вы носите меховой плащ"
 gdp_trade_good_flavor.2006.a.tt_leather: "Отныне вы носите кожаный плащ"
 gdp_trade_good_flavor.2006.a.tt_silk: "Отныне вы носите шёлковую мантию"
 gdp_trade_good_flavor.2006.a.tt_textiles: "Отныне вы носите качественный плащ"
 gdp_trade_good_flavor.2006.b: "Я предоставлю слово товару."
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "За чистую монету"
 gdp_trade_good_flavor.2007.desc: "«Новые [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')|l] будут с изображением моего лица, — говорит мне [tgf_market_holder.GetTitledFirstName|l]. — Будет там и ваш товар — [tgf_good.Custom('GetTradeGood_RU_Nom')|l]. Мне нужны постоянные поставки по выгодным ценам».\n\nОт одного человека — лицо, от другого — металл. История запечатлеет нас обоих на одной и той же монете."
 gdp_trade_good_flavor.2007.a: "Пусть будет по выгодным ценам! Отчеканьте для меня первую монету."
 gdp_trade_good_flavor.2007.b: "Монеты есть монеты. Могу предложить только полную цену."
 gdp_trade_good_flavor.2007.c: "По выгодным ценам? Как будто мне больше нечего делать…"
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "В целости"
 gdp_trade_good_flavor.2008.desc: "«Всё на месте, ничего не пропало: в журнале [tgf_good.Custom('GetTradeGoodUnit')|l] — и здесь [tgf_good.Custom('GetTradeGoodUnit')|l], — произносит [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], явно [Select_CString(tgf_trader.IsFemale, 'довольная', 'довольный')] собой. — Не сломалось, не испортилось, не попало в руки ворам. [tgf_good.Custom('GetTradeGood_RU_Nom')|U], как видите, в целости и сохранности».\n\nЭто уже не списать на везение: мой товар — в надёжных руках, и умению так обращаться с ним можно научить и других."
 gdp_trade_good_flavor.2008.a: "Покажите, как вы всё это упаковали."
 gdp_trade_good_flavor.2008.b: "У вас лёгкая рука. Впечатляет."
 gdp_trade_good_flavor.2008.c: "Расскажите покупателям. За целые товары они заплатят больше."
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "Одни видят войско…"
 gdp_trade_good_flavor.2009.desc: "[tgf_market_holder.GetTitledFirstName] отправляется на войну, а война прожорлива: [tgf_good.Custom('GetTradeGood_RU_Nom')|l] для неё — всё равно что дрова для печи. Интенданты скупают всё, что я только могу поставить, и спрашивают, когда придёт следующая партия.\n\nОдни видят войско — я же вижу клиентов."
 gdp_trade_good_flavor.2009.a: "Война всегда платит наперёд."
 gdp_trade_good_flavor.2009.b: "Сначала — привилегии. В письменном виде."
 gdp_trade_good_flavor.2009.c: "Не забывайте, кто вас вооружает."
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "Гильдия напоминает о себе"
 gdp_trade_good_flavor.2010.desc: "#L [tgf_source_culture.GetCollectiveNoun|U]ая#! гильдия из владения [tgf_source_county.GetNameNoTier] направила мне весьма вежливое письмо. Её представители недовольны моими ценами, которые ниже гильдейских, и предлагают мне договориться о новой цене, пока никто не пострадал.\n\nГильдии всегда вежливы — но только единожды."
 gdp_trade_good_flavor.2010.a: "Заплатим пошлину и установим новую цену."
 gdp_trade_good_flavor.2010.b: "Осмелились мне угрожать? Ну пусть попробуют."
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "Правители задают моду"
 gdp_trade_good_flavor.2011.desc: "Молва всегда разносится стремительно. [tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'явилась', 'явился')] перед двором во владении [tgf_source_county.GetNameNoTier] в одежде из моей лавки, и теперь [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — мечта половины придворных.\n\nПравители задают моду, а купцы — цену."
 gdp_trade_good_flavor.2011.a: "Нужно рассказать всем, откуда [tgf_good.Custom('GetTradeGood_RU_Nom')|l]."
 gdp_trade_good_flavor.2011.b: "Нужно задрать цены, пока все любуются."
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "Проба товара"
 gdp_trade_good_flavor.2012.desc: "[tgf_good.Custom('GetTradeGood_RU_Nom')|U], повсюду [tgf_good.Custom('GetTradeGood_RU_Nom')|l]… [tgf_good.Custom('GetTradeGoodUnitPlural')|l] глядят мне прямо в душу. Проклятый месяц. Я глушу мысли в голове лучшими напитками, которые только могу себе позволить.\n\nПроверка качества. В частном порядке, чтобы никто не узнал."
 gdp_trade_good_flavor.2012.a: "Надо проверить всё без исключения."
 gdp_trade_good_flavor.2012.a.toast: "Слишком много образцов"
 gdp_trade_good_flavor.2012.b: "Нет. Нельзя прикасаться к товарам."
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "Мастерский заказ"
 gdp_trade_good_flavor.2013.desc: "«С вас — [tgf_good.Custom('GetTradeGood_RU_Nom')|l], лучший экземпляр, который только есть, — и оплата мастеру», — произносит [tgf_crafter.GetFirstName]. Вряд ли во всём владении [tgf_source_county.GetNameNoTier] сыщется [tgf_good.Custom('GetTgfGoodCrafter')|l] лучше, чем [Select_CString(tgf_crafter.IsFemale, 'она', 'он')]. — «А я вам сделаю такое, чего ещё никто не видывал».\n\nПока моя жадность раздумывает, гордость уже согласна."
 gdp_trade_good_flavor.2013.a: "Хорошо, будет вам оплата. Удивите меня."
 gdp_trade_good_flavor.2013.b: "Моим товарам не нужны украшения."
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "Их блюдо — наш товар"
 gdp_trade_good_flavor.2014.desc: "«Только представьте, что они выдумали. [tgf_source_province.Custom('GetTgfLocalDish')|U] — знаете такое блюдо? Так вот: теперь [tgf_good.Custom('GetTradeGood_RU_Nom')|l] с ваших прилавков — добавка в него, — произносит [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], проглатывая кусочек. — [tgf_source_county.GetNameNoTier] теперь только так и готовит. Повара говорят, что это новый способ, а какой был старый, никто уже и не помнит».\n\nЯ даже не знаю, каково на вкус это загадочное блюдо — [tgf_source_province.Custom('GetTgfLocalDish')|l], но меня распирает гордость."
 gdp_trade_good_flavor.2014.a: "Тогда пусть платят мне за возможность готовить новым способом."
 gdp_trade_good_flavor.2014.b: "Ещё повозок! Повара голодают!"
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "Оплата товаром"
 gdp_trade_good_flavor.2015.desc: "«Нам нужно больше денег», — произносит [tgf_spokesperson.GetFirstName]. От имени этого человека говорят [tgf_good.Custom('GetTgfGoodGatherers')|l] владения [tgf_source_county.GetNameNoTier]. У меня же есть встречное предложение: [tgf_good.Custom('GetTradeGood_RU_Nom')|l].\n\n«Вы же сами всё это собираете, — подмечаю я. — Наверняка вам нравится!».\n\nНет, им не нравится."
 gdp_trade_good_flavor.2015.a: "Надо заплатить им. Деньгами."
 gdp_trade_good_flavor.2015.b: "Выделим им часть прибыли."
 gdp_trade_good_flavor.2015.c: "Платить можно и товаром."
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "Деньги не пахнут"
 gdp_trade_good_flavor.2016.desc: "«Воняет», — произносит покупатель во владении [tgf_source_county.GetNameNoTier], держа мой товар — [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — подальше от себя. Как мне говорят, [tgf_good.Custom('GetTgfGoodFlaw')|l].\n\nЯ беру у покупателя деньги и нюхаю их. Нет, [Glossary( 'ничем не пахнет', 'TGF_PECUNIA_NON_OLET_GLOSS' )]."
 gdp_trade_good_flavor.2016.a: "Будем продавать только тем, у кого насморк."
 gdp_trade_good_flavor.2016.b: "Может, кто-то готов будет заплатить за запах?"
 gdp_trade_good_flavor.2016.c: "Буду весь день держать монеты под носом."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "Согласно преданию, римский император Веспасиан, установивший налог на общественные уборные, в ответ на претензию своего сына поднёс к его носу монету со словами #G pecunia non olet#! — «деньги не пахнут»."
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "Семь тучных лет"
 gdp_trade_good_flavor.2017.desc: "Мне снится семь тучных коров и семь тощих[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]. Я просыпаюсь и, перед тем как приступить к завтраку, провожу подсчёты.\n\nВо сколько бы мне ни обошлись голодные годы, [tgf_good.Custom('GetTradeGood_RU_Nom')|l] — надёжный гарант тучности."
 gdp_trade_good_flavor.2017.a: "Запасём всё без исключения, до последней крохи."
 gdp_trade_good_flavor.2017.b: "Начнём скупать сейчас, пока цены невысоки."
 gdp_trade_good_flavor.2017.c: "Коровы — это не учётные книги. Можно ещё немного поспать."
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "Чей-то скот"
 gdp_trade_good_flavor.2018.desc: "Проснувшись, я узнаю, что мои ворота перекрыты наглухо: [tgf_good.Custom('GetTradeGood_RU_Nom')|l], повсюду [tgf_good.Custom('GetTradeGood_RU_Nom')|l], куда только ни посмотри, а поодаль — [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] с ухмылкой на лице: «Это [Glossary( 'налётчик', 'TGF_CATTLE_RAID_GLOSS' )] [tgf_raider.GetFirstName] шлёт нам привет: [tgf_market_holder.GetTitledFirstName|l] — вот кто настоящий хозяин этого добра. Только не задавайте лишних вопросов. Цена — половина от рыночной».\n\nНа каждом крупе — клеймо: «[tgf_market_holder.GetFirstNameNoTooltip|l]».\n\n«Клейма, — поднимает палец [tgf_trader.GetFirstNameNoTooltip], — всегда можно поменять»."
 gdp_trade_good_flavor.2018.a: "Сделка есть сделка, чьё бы клеймо тут ни стояло."
 gdp_trade_good_flavor.2018.a.toast: "Кто-то узнал клеймо"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U] по своей воле [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'купили', Select_CString(TARGET_CHARACTER.IsFemale, 'купила', 'купил' ))] скот, украденный у [Select_CString(CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', CHARACTER.GetShortUIName))|l]."
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U] по своей воле [Select_CString(CHARACTER.IsLocalPlayer, 'купили', Select_CString(CHARACTER.IsFemale, 'купила', 'купил' ))] скот, украденный у [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вашего персонажа', Concatenate('персонажа ', TARGET_CHARACTER.GetShortUIName))|l]."
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip] будет у меня в долгу."
 gdp_trade_good_flavor.2018.c: "Их нужно побыстрее забить."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "Набеги на соседские стада — не только старинная забава, но и серьёзное дело: в ирландском эпосе Táin Bó Cúailnge («Похищение быка из Куалнге») рассказывается о войне, разгоревшейся из-за одного-единственного быка."
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "Обуянный жаждой двор"
 gdp_trade_good_flavor.2019.desc: "«[tgf_market_holder.GetTitledFirstName] и [Select_CString(tgf_market_holder.IsFemale, 'её', 'его')] двор пьют что угодно, но не [tgf_good.Custom('GetTradeGood_RU_Nom')|l], — сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — Кроме того, от этого двора нам поступил заказ: [tgf_good.Custom('GetTradeGoodUnitPlural')|l] нашего, сорок штук. Вот такие странные дела».\n\nОчевидно, вера, которую исповедует [tgf_market_holder.GetFirstNameNoTooltip], [Glossary( 'запрещает пить', 'TGF_ABU_NUWAS_GLOSS' )]. Зато нам ничто не запрещает завышать цену."
 gdp_trade_good_flavor.2019.a: "Напишем на бочках, что внутри уксус."
 gdp_trade_good_flavor.2019.b: "Удвоим цену — всё равно они никому не пожалуются."
 gdp_trade_good_flavor.2019.b.toast: "Другой поставщик"
 gdp_trade_good_flavor.2019.b.toast_good: "Оплачено полностью"
 gdp_trade_good_flavor.2019.c: "Не хочу рисковать головой. Найдём другого клиента."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "Вино запрещали при многих дворах, но любили почти повсюду. Абу Нувас, придворный поэт халифа Харуна ар-Рашида, посвятил этому напитку несколько поистине великолепных стихотворений."
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "Идеальный круг"
 gdp_trade_good_flavor.3001.desc: "У самых ворот склада мне в нос ударяет запах выдержанного сыра. Исходящий от головы аромат настолько аппетитный, что носильщики приставили к складу охранника — частично в шутку, частично всерьёз.\n\nПродам сыр — и денег будет столько, что я смогу закатить пир. Оставлю на складе — и пиршество уже готово."
 gdp_trade_good_flavor.3001.a: "Защищайте его до последней капли крови!"
 gdp_trade_good_flavor.3001.b: "Купить и продать можно что угодно, даже совершенство."
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "Знаменитая жалоба"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "Самой древней из известных письменных жалоб считается глиняная табличка из Ура возрастом три тысячи лет: в письме некий Нанни жалуется на торговца Эа-насира за то, что тот поставил ему медные слитки низкого качества и грубо обращался с его слугой."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName] пишет, что моя медь никуда не годится, а мои слитки чересчур легки. Всё это верно.\n\n«За кого вы меня держите, что относитесь так [Glossary( 'неучтиво', 'TGF_EA_NASIR_GLOSS' )]?».\n\nЯ держу [Select_CString(tgf_market_holder.IsFemale, 'её', 'его')] за хорошего клиента: мне уже заплатили."
 gdp_trade_good_flavor.3002.a: "Ничего, [Select_CString(tgf_market_holder.IsFemale, 'она', 'он')] ещё ко мне вернётся, как и всегда."
 gdp_trade_good_flavor.3002.a.toast: "Больше никогда"
 gdp_trade_good_flavor.3002.a.toast_good: "Этого было мало"
 gdp_trade_good_flavor.3002.b: "Моя медь превосходного качества. Пусть [Select_CString(tgf_market_holder.IsFemale, 'сама', 'сам')] проверит!"
 gdp_trade_good_flavor.3002.b.toast_bad: "Уличение во лжи"
 gdp_trade_good_flavor.3002.b.toast_good: "Проверка пройдена"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'продали', Select_CString(TARGET_CHARACTER.IsFemale, 'продала', 'продал' ))] [Select_CString(CHARACTER.IsLocalPlayer, 'вам', Concatenate('персонажу ', CHARACTER.GetShortUIName))|l] лёгкие слитки, поклявшись, что они настоящие."
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'продали', Select_CString(CHARACTER.IsFemale, 'продала', 'продал' ))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вам', Concatenate('персонажу ', TARGET_CHARACTER.GetShortUIName))|l] лёгкие слитки, поклявшись, что они настоящие."
 gdp_trade_good_flavor.3002.c: "Лучше будет извиниться и в следующий раз продать хорошие слитки."
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "Оплата перцем"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "Перец ценился почти на вес серебра и нередко служил платой за товары и услуги. В Лондоне, согласно изданным около 1000 года законам короля Этельреда, часть пошлины с немецких купцов взималась перцем."
 gdp_trade_good_flavor.3003.desc: "[Select_CString(tgf_debtor.IsFemale, 'Моя должница', 'Мой должник')] [tgf_debtor.GetFirstName] из владения [tgf_source_county.GetNameNoTier] [Select_CString(tgf_debtor.IsFemale, 'осталась', 'остался')] без гроша в кармане, а потому [Select_CString(tgf_debtor.IsFemale, 'вынуждена', 'вынужден')] расплачиваться [Glossary( 'перцем', 'TGF_PEPPER_GLOSS' )]. [tgf_good.Custom('GetTradeGoodUnit')|U], ещё [tgf_good.Custom('GetTradeGoodUnit')|l], — и вот мой стол благоухает, как прилавок на рынке пряностей.\n\nЯ пересчитываю оплату дважды. Неплохая замена. А ведь в мире много таких, как [tgf_debtor.GetFirstNameNoTooltip]."
 gdp_trade_good_flavor.3003.a: "Отныне я принимаю оплату перцем."
 gdp_trade_good_flavor.3003.b: "Оплата — только деньгами, пусть даже придётся вывернуть карманы."
 gdp_trade_good_flavor.3003.c: "Будешь работать на меня, а долг подождёт."
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "Письмо с жалобами"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "Купеческие письма, веками хранящиеся в архивах, — подобно тем, что сохранились в Каирской генизе (хранилище при синагоге, куда складывали ненужные бумаги), — подробно и обстоятельно повествуют о торговле на Средиземноморье, не скрывая обид и претензий. Больше всех жалуются торговцы льном."
 gdp_trade_good_flavor.3004.desc: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] [Select_CString(tgf_trader.IsFemale, 'продала', 'продал')] во владении [tgf_source_county.GetNameNoTier] все тюки льна по выгодной цене. Об этом гласит [Select_CString(tgf_trader.IsFemale, 'её', 'его')] письмо, и это — единственная строчка, радующая глаз. Остальные сорок строк — сплошные жалобы: на сырость, на носильщиков, на покупателей, даже на качество упаковки.\n\nСначала — дело, а жалобы — потом. Так и должно быть, и ни в коем случае не наоборот."
 gdp_trade_good_flavor.3004.a: "О прибыли — всего одна строчка, но её я читаю дважды."
 gdp_trade_good_flavor.3004.b: "Сорок строк полезных советов."
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "Тонкость"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "Между блюдами на пиру подавали затейливые изделия из сахара и миндальной пасты, призванные поразить гостей: замки, корабли, диковинных зверей… Самые роскошные из них были не столько десертами, сколько политическими заявлениями."
 gdp_trade_good_flavor.3005.desc: "«[tgf_market_holder.GetTitledFirstName] хочет заказать у нас птицу, но не простую: [ROOT.Char.Custom('GetRandomRegionalBird')] из сахара — вот каково [Select_CString(tgf_market_holder.IsFemale, 'её', 'его')] пожелание, — говорит [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — Размером вдвое больше настоящей птицы, и чтобы совсем без перьев. Мы должны управиться к середине лета. Эдакий [Glossary( 'тонкий', 'TGF_SUBTLETY_GLOSS' )] намёк всем пирующим».\n\nСахар когда-нибудь растает, но добрая слава неподвластна времени."
 gdp_trade_good_flavor.3005.a: "Будет сделано. Вдвое больше — значит, вдвое больше."
 gdp_trade_good_flavor.3005.a.success: "Пирующие замолкают"
 gdp_trade_good_flavor.3005.a.failure: "Кривая птица"
 gdp_trade_good_flavor.3005.b: "За заказ к пиру и цены соответствующие."
 gdp_trade_good_flavor.3005.c: "Я торгую сахаром, а не скульптурами."
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "Рой"
 gdp_trade_good_flavor.3006.desc: "Пчёл никто не приглашал — они сами поселились под потолочными балками и теперь безвозмездно производят на моём складе мёд.\n\nБывают в жизни вещи похуже, чем жильцы, расплачивающиеся мёдом. А укусы можно и стерпеть."
 gdp_trade_good_flavor.3006.a: "Бесплатный мёд… Интересно, сколько он будет стоить."
 gdp_trade_good_flavor.3006.a.toast: "Укусили!"
 gdp_trade_good_flavor.3006.b: "Пусть работают. Не буду брать с них плату за жильё."
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "Ещё чайку"
 gdp_trade_good_flavor.3007.desc: "Одну чашку, чтобы распробовать товар. Потом ещё одну — настолько хороша оказалась первая. К полуночи я успеваю трижды пересчитать все доходы и расходы, а заодно написать два письма, и чувствую себя великолепно.\n\nТо ли груз и впрямь превосходный, то ли эта привычка не из доступных."
 gdp_trade_good_flavor.3007.a: "Каждое утро — по чашке."
 gdp_trade_good_flavor.3007.b: "Угостить чаем всю компанию."
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "Пока ещё есть время"
 gdp_trade_good_flavor.3008.desc: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] открывает ящик и морщится: [tgf_good.Custom('GetTradeGood_RU_Nom')|l], похоже, не в том состоянии, которое покупатели сочтут приемлемым. «Проклятый речной туман… Смотрите, какие мягкие. К концу недели останется одна плесень».\n\nСухие фрукты могут храниться годами, влажные — всего несколько дней. Время — деньги."
 gdp_trade_good_flavor.3008.a: "Высушить ещё раз — уже как следует."
 gdp_trade_good_flavor.3008.b: "Пусть ещё побродят. Скажем, что это вино."
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "До глубокой ночи"
 gdp_trade_good_flavor.3009.desc: "Масло в лампе заканчивается раньше, чем я успеваю закончить работу с книгами, и мне приходится жечь собственный товар. [tgf_good.Custom('GetTradeGood_RU_Nom')|U] на продажу? Как бы не так… Не говоря уже о том, что света от моего товара не больше, чем от мутных остатков, которые мы обычно выливаем.\n\nНисколько не ярче. И всё же покупатели платят втрое дороже."
 gdp_trade_good_flavor.3009.a: "Будем продавать так: остатки — для ламп, хорошее масло — на столы."
 gdp_trade_good_flavor.3009.b: "Пусть горит. Книги важнее всего."
 gdp_trade_good_flavor.3009.c: "Пора спать. Маслу тоже нужен отдых."
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "На корню"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "Зерно, купленное «на корню», оплачивали ещё до жатвы, пока оно было неспелым. Цена при этом была значительно ниже той, которую можно было выручить после сбора урожая. Проповедники и знатоки церковного права осуждали такую практику как скрытую форму ростовщичества."
 gdp_trade_good_flavor.3010.desc.condemned: "Проповедники говорят — ростовщичество, счётные книги говорят — скидка."
 gdp_trade_good_flavor.3010.desc.permitted: "Некоторые конфессии говорят — ростовщичество, моя говорит — прозорливость."
 gdp_trade_good_flavor.3010.desc.intro: "«Сейчас оно ещё зелёное, но к лету позолотеет, — произносит [tgf_peasant.GetFirstName] из владения [tgf_source_county.GetNameNoTier]; [Select_CString(tgf_peasant.IsFemale, 'её', 'его')] ноги по колено замызганы грязью. — Коль купите за ту цену, за какую я его отдаю сегодня, [Glossary( 'на корню', 'TGF_IN_THE_BLADE_GLOSS' )], то забирайте хоть весь урожай».\n\n"
 gdp_trade_good_flavor.3010.a: "Урожай следующего года по цене этого."
 gdp_trade_good_flavor.3010.b: "Подожду, пока оно созреет."
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "Десятилетнее просо"
 gdp_trade_good_flavor.3011.desc: "Я заглядываю за новые запасы, и мне открывается неожиданное зрелище: [tgf_good.Custom('GetTradeGoodUnitPlural')|l] проса, забытые и неучтённые, хранящиеся здесь уже много лет. Зерно ничуть не испортилось — просо хорошо хранится.\n\nЗапасы, оставленные мною же в прошлом. Нет наследства лучше."
 gdp_trade_good_flavor.3011.a: "Немедленно продать их — так поступило бы моё «я» из прошлого."
 gdp_trade_good_flavor.3011.b: "Упаковать его в дорогу. Просо хорошо хранится."
 gdp_trade_good_flavor.3011.c: "Пересчитать все запасы на складе."
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "Шлифовать или нет"
 gdp_trade_good_flavor.3012.desc: "Шлифованный рис отличается белизной и лёгкостью, знать охотно ставит его на столы. Нешлифованный — тяжёлый, бурый, но востребованный повсюду. [Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] хочет знать, что ближе моей купеческой душе.\n\nМоей купеческой душе ближе всего деньги."
 gdp_trade_good_flavor.3012.a: "Будем шлифовать. Высшие слои — высокие цены."
 gdp_trade_good_flavor.3012.b: "Будем продавать бурый — дёшево, зато всем сразу."
 gdp_trade_good_flavor.3012.c: "Лучшие зёрна будем шлифовать, остальные — продавать бурыми."
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "Накануне поста"
 gdp_trade_good_flavor.3013.desc: "«Скоро начинается [tgf_source_faith.Custom('GetTgfFastName')]! — торопливым почерком пишет мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] из владения [tgf_source_county.GetNameNoTier]. — Люди неделями не будут есть мясо, а значит, к концу поста изголодаются по нему, словно звери».\n\nГолодный покупатель никогда не торгуется."
 gdp_trade_good_flavor.3013.desc_ramadan: "«Скоро начинается Рамадан! — торопливым почерком пишет мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] из владения [tgf_source_county.GetNameNoTier]. — Люди будут голодать до заката, а после заката — есть только мясо».\n\nГолодный покупатель никогда не торгуется."
 gdp_trade_good_flavor.3013.a: "Я тоже буду поститься. Мясо подождёт."
 gdp_trade_good_flavor.3013.b: "Засолим мясо и будем ждать голодных толп."
 gdp_trade_good_flavor.3013.c: "Продадим всё на последнем пиру накануне поста."
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "В зубы всё-таки смотрят?"
 gdp_trade_good_flavor.3014.desc: "[Select_CString(tgf_dealer.IsFemale, 'Торговка', 'Торговец')] лошадьми [tgf_dealer.GetFirstName|U] клянётся всеми правдами и неправдами: «Четыре года, ну никак не больше пяти. Вы только посмотрите, какая масть!». Масть и правда хороша. Вот только зубы мне почему-то стараются не показывать.\n\nМне хорошо известна народная мудрость про дарёного коня. Но этот конь — не дарёный."
 gdp_trade_good_flavor.3014.a: "Откройте ему рот пошире, я хочу осмотреть зубы."
 gdp_trade_good_flavor.3014.b: "Да хоть двадцать четыре — этот конь будет моим."
 gdp_trade_good_flavor.3014.c: "Я верю вам на слово — и приглашаю поработать на мою компанию."
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "Рынок любит тучность"
 gdp_trade_good_flavor.3015.desc: "«Скот весь исхудал в пути, только рёбра торчат, — сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — [tgf_source_county.GetNameNoTier] вряд ли согласится таких купить. Но [tgf_market_holder.GetTitledFirstName|l] говорит, что неподалёку есть хорошее пастбище, как раз для нашей скотины… Хоть, разумеется, и не бесплатно».\n\nЖир — это деньги. И доходы перекроют любые расходы на траву."
 gdp_trade_good_flavor.3015.a: "Заплатим за траву, продадим тучный скот."
 gdp_trade_good_flavor.3015.b: "Даже исхудавших животных ещё можно продать."
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "Телячья кожа для писарей"
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.GetTitledFirstName] — капеллан, над [Select_CString(tgf_market_holder.IsFemale, 'которой', 'которым')] стоит [tgf_market_holder.GetTitledFirstName|l], — осматривает мою дубильню с едва ли не большим вожделением, чем паломник — святыню. «Если эти шкуры хорошенько выскоблить, священные тексты на них сохранятся и через тысячу лет», — произносит [Select_CString(tgf_market_holder.IsFemale, 'она', 'он')].\n\nЦелую тысячу лет? Неплохо для коров."
 gdp_trade_good_flavor.3016.a: "Я подарю вам самые лучшие шкуры."
 gdp_trade_good_flavor.3016.b: "Значит, пускай хранятся. Мы обеспечим вам поставки."
 gdp_trade_good_flavor.3016.c: "Лучше продадим эти шкуры сапожникам."
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "Скупка руна"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "Цистерцианские аббатства загодя продавали итальянским и фламандским купцам годовой настриг шерсти, получая деньги за руно, которое поставляли только через несколько лет. Многие семейства, заключавшие такие сделки, погрязли в долгах."
 gdp_trade_good_flavor.3017.desc: "«[tgf_abbot.GetTitledFirstName] говорит, что [tgf_abbey.GetNameNoTier] может поставить нам шерсть на несколько лет вперёд, — сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — [Glossary( 'Настриженное за годы руно', 'TGF_WOOL_CLIP_GLOSS' )] мы оплатим сейчас, а поставлять его будут постепенно, по мере стрижки. Да, деньги они просят вперёд».\n\nВесьма далеко идущие замыслы. Впрочем, мы, купцы, тоже поднаторели в этой науке."
 gdp_trade_good_flavor.3017.a: "Деньги сейчас — шерсть на годы вперёд."
 gdp_trade_good_flavor.3017.b: "Я предпочитаю скупать уже готовую шерсть."
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "Баранец"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "Среди учёных и путешественников долгое время считалось, будто далеко на востоке произрастало растение с плодами в виде живых ягнят. Они питались растущей вокруг травой, а когда та заканчивалась, умирали вместе с растением. Вероятно, таким образом пытались объяснить происхождение хлопка — волокна, напоминавшего шерсть."
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName|U] — покупатель во владении [tgf_source_county.GetNameNoTier] — с восторгом вертит в руках пучок хлопка. «Неужели правду говорят, что есть такое растение, которое приносит ягнят, и что они пасутся около этого растения, пока то не засохнет?».\n\nБаранец. Диковинки всегда хорошо продаются."
 gdp_trade_good_flavor.3018.a: "Правда, всё правда. Это очень редкое растение."
 gdp_trade_good_flavor.3018.b: "Нет, просто оно очень пушистое."
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "Сполии"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "Камень из старых построек нередко использовали повторно при возведении новых. Колонны, резные детали и блоки с надписями, выломанные из древних развалин, шли на строительство церквей, стен и домов средневековой Европы."
 gdp_trade_good_flavor.3019.desc: "«Из каменоломни больше не привозят камень, — пишет мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName] из владения [tgf_source_county.GetNameNoTier]. — Теперь его достают из развалин. Не жалеют ничего: ни колонн, ни резьбы».\n\n[Glossary( 'Сполии', 'TGF_SPOLIA_GLOSS' )]. Старый камень можно продавать по новой цене."
 gdp_trade_good_flavor.3019.a: "За древний камень мы заломим соответствующую цену."
 gdp_trade_good_flavor.3019.b: "Самую красивую резьбу пусть привозят мне."
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "Мачтовое дерево"
 gdp_trade_good_flavor.3020.desc: "«[tgf_market_holder.GetTitledFirstName] говорит, что для местных корабелов нет материала более желанного, чем [tgf_good.Custom('GetTradeGood_RU_Nom')|l], что продаём мы, — сообщает [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName]. — Им нужна не просто древесина: на мачты идут самые длинные и крепкие стволы. Уж эти люди хорошо знают, как редко встречается хорошее дерево».\n\nТорговля редкостями не любит спешки."
 gdp_trade_good_flavor.3020.a: "Лучшее дерево — то, которое пойдёт на мой личный корабль."
 gdp_trade_good_flavor.3020.b: "Продано! Мачты всегда идут нарасхват."
 gdp_trade_good_flavor.3020.c: "Пусть подождут. Древесина ещё вырастет в цене."
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "Дым в шатре"
 gdp_trade_good_flavor.3021.t_bhang: "Чашка бханга"
 gdp_trade_good_flavor.3021.t_hashish: "Сладость за закрытыми дверями"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "Геродот писал, что скифы бросали семена конопли на раскалённые камни в закрытых войлочных шатрах и затем с упоением вдыхали дым. Этот обычай ещё долгое время сохранялся среди степных народов."
 gdp_trade_good_flavor.3021.desc: "[Select_CString(tgf_hemp_host.IsFemale, 'Она', 'Он')] бросает семена конопли на раскалённые камни шатра, и в воздух вздымаются клубы дыма. «[Glossary( 'Вдыхай', 'TGF_HEMP_TENT_GLOSS' )] полной грудью, купец. А дела обсудим после этого».\n\nЭто, разумеется, исключительно деловая традиция."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "В «Атхарваведе» бханг — одно из пяти священных растений. Его листья растирают с молоком, топлёным маслом и пряностями, приготовляя напиток для празднеств и подношений Шиве."
 gdp_trade_good_flavor.3021.desc_bhang: "[Select_CString(tgf_hemp_host.IsFemale, 'Она', 'Он')] перетирает листья конопли с молоком и пряностями и подаёт мне чашку получившегося напитка. «Выпей нашего [Glossary( 'бханга', 'TGF_HEMP_BHANG_GLOSS' )], купец. На празднествах его пьют все. Значит, и ты тоже».\n\nОтказаться — значит нанести оскорбление и потерять деньги."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "В XII веке в Египте и Сирии получил распространение гашиш — вещество из смолы конопли, которое добавляли в пищу, в том числе в сладости. Некоторые суфии восхваляли этот наркотик и утверждали, что употребление гашиша — лёгкий способ достигнуть экстаза, в то время как правоведы осуждали его употребление, а правители даже приказывали сжигать конопляные поля."
 gdp_trade_good_flavor.3021.desc_hashish: "[Select_CString(tgf_hemp_host.IsFemale, 'Она', 'Он')] закрывает дверь и аккуратно снимает обёртку со сладости из спрессованной конопляной смолы. «Гляди, купец: это [Glossary( 'гашиш', 'TGF_HEMP_HASHISH_GLOSS' )]. Правоведы не любят его. Но правоведов здесь с нами нет».\n\nГрубо будет отказывать покупателю."
 gdp_trade_good_flavor.3021.desc.intro: "«Как-как? [tgf_good.Custom('GetTradeGood_RU_Nom')|U]? [tgf_good.Custom('GetTgfHempUse')|U]? — [tgf_hemp_host.GetTitledFirstName|l] разражается громким смехом. — Что вы! Здесь всё-таки [tgf_source_county.GetNameNoTier], совсем другие порядки. Это дело мы употребляем иначе».\n\n"
 gdp_trade_good_flavor.3021.a: "Деловые отношения требуют делового подхода. Передать семена."
 gdp_trade_good_flavor.3021.a_bhang: "Деловые отношения требуют делового подхода. Передать чашку."
 gdp_trade_good_flavor.3021.a_hashish: "Деловые отношения требуют делового подхода. Передать сладости."
 gdp_trade_good_flavor.3021.b: "Продадим этот товар. Мне нужно мыслить трезво."
 gdp_trade_good_flavor.3021.a.toast_habit: "Новая привычка"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "Клинок из лучшего железа"
 gdp_trade_good_flavor.3022.desc: "Кузнец [tgf_smith.GetFirstName] из владения [tgf_source_county.GetNameNoTier] взвешивает на ладони мой слиток железа и ухмыляется: «Дайте мне отборные слитки — и я выкую вам клинок, который будет стоить в десять раз дороже самого железа».\n\nВ десять раз? [Select_CString(tgf_smith.IsFemale, 'Она', 'Он')] знает, с какой стороны подойти к купцу."
 gdp_trade_good_flavor.3022.a: "Вот вам слитки. Докажите, что это не пустые слова."
 gdp_trade_good_flavor.3022.b: "Научите меня распознавать хорошие слитки."
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "Заверения огранщика"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "Огранщики занимались не только шлифовкой и обработкой драгоценных камней, но также изучением лапидариев — книг, в которых описываются тайные свойства различных минералов: например, сапфиру приписывали способность защищать от яда, а аметисту — от опьянения."
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U] — [Glossary( 'огранщик', 'TGF_LAPIDARY_GLOSS' )] из владения [tgf_source_county.GetNameNoTier] — внимательно рассматривает на свету один из моих самоцветов. «Будете носить этот камень — и [ROOT.Char.Custom('GetTgfAilment')|l] вам не грозит. Так сказано в книгах».\n\nЖаль, что в книгах ничего не сказано о цене, — по крайней мере, пока."
 gdp_trade_good_flavor.3023.a: "За такое заявление можно запросить соответствующие деньги."
 gdp_trade_good_flavor.3023.b: "Приглашаю работать на мою компанию. Книги возьмите с собой."
 gdp_trade_good_flavor.3023.c: "Не стану спорить с книгами."
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "Джентльменский камень"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U] превосходно разбирается в разновидностях нефрита. [Select_CString(tgf_connoisseur.IsFemale, 'Она', 'Он')] постукивает разложенными на прилавке камушками по зубам, прислушивается к звуку, два камня откладывает в сторону. «Мыльный камень. Очень хороший». Остальные удостаиваются лишь одобрительного кивка.\n\nЗнаток, способный отличить подделку, стоит даже дороже подлинного камня."
 gdp_trade_good_flavor.3024.a: "Разбить подделки. Назвать поставщика."
 gdp_trade_good_flavor.3024.b: "Приглашаю работать на мою компанию. У вас острый глаз."
 gdp_trade_good_flavor.3024.c: "Научите и меня этому приёму с постукиванием."
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "Фарфоровый балласт"
 gdp_trade_good_flavor.3025.desc: "[Select_CString(tgf_trader.IsFemale, 'Моя приказчица', 'Мой приказчик')] [tgf_trader.GetFirstName] весьма [Select_CString(tgf_trader.IsFemale, 'довольна', 'доволен')] [tgf_trader.GetFirstName] собой: «Кораблю был нужен балласт, а [tgf_good.Custom('GetTradeGoodUnitPlural')|l] — как раз достаточно тяжёлый груз. Капитан почти ничего с нас не взял».\n\nНет ничего лучше груза, который платит сам за себя."
 gdp_trade_good_flavor.3025.a: "Вложим сэкономленные деньги в следующую партию груза."
 gdp_trade_good_flavor.3025.b: "Научиться применять груз в качестве балласта."
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "Жгучий сок"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "Лак не высыхает на открытом воздухе. Каждый слой древесной смолы (на хорошее изделие их наносят десятки) должен несколько дней застывать в тёплом влажном помещении. Не затвердевшая смола при соприкосновении с кожей вызывает волдыри."
 gdp_trade_good_flavor.3026.desc: "Новые [tgf_good.Custom('GetTradeGoodUnitPlural')|l] с лаковыми изделиями прибыли ещё до того, как успел [Glossary( 'застыть', 'TGF_LACQUER_CURE_GLOSS' )] последний слой. Поверхность выглядит безупречно: блеск глубокий и ровный — так обычно блестит море. Рука сама тянется проверить, затвердел ли лак.\n\nМастера предупреждают, что смола обжигает кожу. Мне кажется, что они преувеличивают."
 gdp_trade_good_flavor.3026.a: "Построим помещение с высокой влажностью, чтобы лак затвердевал как следует."
 gdp_trade_good_flavor.3026.b: "Коснусь только разок, чтобы убедиться наверняка."
 gdp_trade_good_flavor.3026.b.toast_rash: "Жгучий лак"
 gdp_trade_good_flavor.3026.c: "Пусть затвердевает. В таких вещах спешка противопоказана."
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "Камни для чтения"
 gdp_trade_good_flavor.3027.desc.intro: "[tgf_glassmaker.GetFirstName] — мастер стекольных дел из владения [tgf_source_county.GetNameNoTier] — кладёт на мою счётную книгу два прозрачных гладких камушка, и мелкие цифры тут же увеличиваются прямо на глазах, обретая чёткость и цвет. «Это, друг мой, хорошее средство для стариков — или просто уставших».\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "И старость, и усталость, — мои постоянные спутники. Впервые за много лет я могу разглядеть надписи мелкими буквами."
 gdp_trade_good_flavor.3027.desc.young_eyes: "Старость и усталость — не мой удел. Но теперь я могу разглядеть надписи мелкими буквами."
 gdp_trade_good_flavor.3027.a: "Дайте два. И заверните получше."
 gdp_trade_good_flavor.3027.b: "Пусть [tgf_market_holder.GetTitledFirstNameNoTooltip|l] получит пару таких."
 gdp_trade_good_flavor.3027.c: "Мне нужны не сами камни, а их тайна."
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "Цены в праздничный день"
 gdp_trade_good_flavor.3028.desc.christian: "«Скоро церковные праздники, — сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], только что [Select_CString(tgf_trader.IsFemale, 'вернувшаяся', 'вернувшийся')] из владения [tgf_source_county.GetNameNoTier]. — Каждый хочет благовония, достойные волхвов. И никто не станет считать деньги, когда речь об алтарях».\n\n"
 gdp_trade_good_flavor.3028.desc: "«Скоро церковные праздники, — сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], только что [Select_CString(tgf_trader.IsFemale, 'вернувшаяся', 'вернувшийся')] из владения [tgf_source_county.GetNameNoTier]. — Каждый хочет благовония, достойные величайших святых. И никто не станет считать деньги, когда речь об алтарях».\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "Покупатели, не считающие деньги, — поистине дар от [ROOT.Char.GetFaith.HighGodNamePossessive]."
 gdp_trade_good_flavor.3028.a: "Немного благовоний я зажгу и у себя — в честь праздника."
 gdp_trade_good_flavor.3028.b: "Первую партию мы предоставим храму — естественно, за деньги."
 gdp_trade_good_flavor.3028.c: "Праздничным дням — праздничные цены."
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "Териак"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "Знаменитое снадобье, считавшееся лекарством от всех болезней. Его готовили из десятков ингредиентов (в том числе мяса гадюки и опиума), а затем выдерживали несколько лет. Врачи прописывали териак при отравлениях, чуме и множестве других недугов."
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U] — аптекарь из владения [tgf_source_county.GetNameNoTier] — присылает мне письмо; от бумаги пахнет душистыми травами. «Ваш товар — как раз то, что мне нужно для приготовления [Glossary( 'териака', 'TGF_THERIAC_GLOSS' )]. От отравлений, чумы и прочих хворей!».\n\nПомогает ли это снадобье на самом деле — не моя забота. Моя забота — продать товар."
 gdp_trade_good_flavor.3029.a: "Начать варить териак и продавать его покупателям на торговых путях."
 gdp_trade_good_flavor.3029.b: "Вы получите свои 64 ингредиента — и все от меня."
 gdp_trade_good_flavor.3029.c: "Напишите мне рецепт и сварите пробную дозу."
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "Указы не на бумаге"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "В 1231 году император Фридрих II запретил нотариусам Сицилийского королевства составлять официальные документы на бумаге, посчитав её недостаточно прочной. Для этого годился только пергамент."
 gdp_trade_good_flavor.3030.desc: "«[tgf_market_holder.GetTitledFirstName] [Select_CString(tgf_market_holder.IsFemale, 'учудила', 'учудил')]: [Select_CString(tgf_market_holder.IsFemale, 'её', 'его')] писцам больше нельзя [Glossary( 'составлять документы и указы на бумаге', 'TGF_PAPER_GLOSS' )], — с нескрываемым презрением сообщает мне [Select_CString(tgf_trader.IsFemale, 'моя приказчица', 'мой приказчик')] [tgf_trader.GetFirstName], только что [Select_CString(tgf_trader.IsFemale, 'вернувшаяся', 'вернувшийся')] из владения [tgf_source_county.GetNameNoTier]. — Отныне — только на пергаменте. Монахам подражают, что ли?..».\n\nНичего. Каждое постановление можно оспорить."
 gdp_trade_good_flavor.3030.a: "Оспорим это нововведение. За бумагой будущее."
 gdp_trade_good_flavor.3030.a.success: "Канцелярия переходит на бумагу"
 gdp_trade_good_flavor.3030.a.failure: "Канцелярия продолжает пользоваться пергаментом"
 gdp_trade_good_flavor.3030.b: "Значит, будем продавать им пергамент."
 gdp_trade_good_flavor.3030.c: "Значит, я узнаю, что им действительно нужно."
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "Грюйт или хмель"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "Смесь трав, например восковника (болотного мирта) и тысячелистника, придававшая вкус пиву и помогавшая ему храниться дольше. Перестала использоваться пивоварами после появления хмеля. Во многих странах право на продажу грюйта принадлежало исключительно правителям — они взимали пошлину с каждой сваренной партии."
 gdp_trade_good_flavor.3031.desc: "«Хмель… — шепчет пивовар [tgf_brewer.GetFirstName] из владения [tgf_source_county.GetNameNoTier], [Select_CString(tgf_brewer.IsFemale, 'заворожённая', 'заворожённый')] видом моих бочек. — На хмель налога нет, а пиво будет храниться месяцами». [tgf_source_county.GetNameNoTier] — печальный край: [tgf_market_holder.GetTitledFirstName|l] взимает налог с каждого пивовара, а также обязывает их покупать свой [Glossary( 'грюйт', 'TGF_GRUIT_GLOSS' )].\n\nЗа прогресс всегда приходится платить."
 gdp_trade_good_flavor.3031.a: "Пусть будет хмель. Отправим его в путь."
 gdp_trade_good_flavor.3031.b: "Пусть будет грюйт, как того и желает [tgf_market_holder.GetTitleAsNameNoTooltip|l]."
 gdp_trade_good_flavor.3031.c: "Отправим немного того и немного сего."
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "Корзина фруктов"
 gdp_trade_good_flavor.3032.desc: "[tgf_fruit_province.Custom('get_region_fruit_plural')|U], что произрастают во владении [tgf_source_county.GetNameNoTier], — любимая еда местных жителей: проживающие здесь семьи запасают ароматные плоды целыми корзинами. К сожалению, их редко вывозят дальше соседней деревни.\n\nНо в сушёном виде они продержатся гораздо дольше — и успеют найти покупателя. Я откусываю кусочек и тут же тянусь за счётной книгой."
 gdp_trade_good_flavor.3032.a: "Выяснить, кто и в каком количестве их выращивает."
 gdp_trade_good_flavor.3032.b: "Надо съесть ещё один, чтобы закрепить результат."
