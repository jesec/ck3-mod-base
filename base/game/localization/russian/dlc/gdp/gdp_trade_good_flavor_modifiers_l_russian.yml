l_russian:
 gdp_tgf_heavier_loads_modifier: "Увеличение загрузки повозок"
 gdp_tgf_seven_storehouses_modifier: "Семь складов"
 gdp_tgf_seven_storehouses_modifier_desc: "Этот торговец построил хранилища на трудные времена и следит за тем, чтобы они никогда не были пустыми."
 gdp_tgf_sweet_reputation_modifier: "Слава кондитера"
 gdp_tgf_sweet_reputation_modifier_desc: "Однажды этот торговец прислал на пир к принцу огромную сахарную птицу. Все, кому довелось её отведать, до сих пор вспоминают об этом угощении."
 gdp_tgf_beekeeper_modifier: "Пчеловод"
 gdp_tgf_beekeeper_modifier_desc: "Этот торговец держит пчёл под потолочными балками своего склада. Пчёлы платят ему за кров мёдом, а он узнал о нём больше, чем можно было почерпнуть из любой книги."
 gdp_tgf_alcohol_opportunist_modifier: "Винодел по воле случая"
 gdp_tgf_alcohol_opportunist_modifier_desc: "Однажды груз фруктов по недосмотру этого торговца перебродил и превратился в вино. С тех пор он скупает дешёвые бочки."
 gdp_tgf_two_grades_modifier: "Два сорта масла"
 gdp_tgf_two_grades_modifier_desc: "Этот торговец продаёт мутные остатки масла для светильников, а чистое масло — для трапезы, и берёт за них разную плату."
 gdp_tgf_road_millet_modifier: "Просо в дорогу"
 gdp_tgf_road_millet_modifier_desc: "Этот торговец всегда берёт с собой в дорогу мешок проса. Оно переживёт любые невзгоды, как и тот, кто им запасается."
 gdp_tgf_cheap_rice_modifier: "Дешёвый рис"
 gdp_tgf_cheap_rice_modifier_desc: "На рынках этого графства бурый рис продаётся по низкой цене, поэтому местные жители не знают, что такое голод."
 gdp_tgf_keeps_the_fast_modifier: "Соблюдение поста"
 gdp_tgf_keeps_the_fast_modifier_desc: "Этот торговец торгует мясом круглый год, но пост соблюдает вместе со всеми. Он лучше всех знает, сколько голодные готовы заплатить за еду."
 gdp_tgf_parchment_supplier_modifier: "Поставщик пергамента"
 gdp_tgf_parchment_supplier_modifier_desc: "Лучшие шкуры из лавки этого торговца идут на изготовление пергамента. Где-то на них записывают священные слова."
 gdp_tgf_temple_supplier_modifier: "Поставщик храмовых благовоний"
 gdp_tgf_temple_supplier_modifier_desc: "Именно к этому торговцу храмы обращаются прежде всего за благовониями и иногда возносят молитвы за его душу."
 gdp_tgf_chancery_stationer_modifier: "Поставщик бумаги для канцелярии"
 gdp_tgf_chancery_stationer_modifier_desc: "Этот торговец поставляет бумагу в канцелярию, и каждый писарь, заслышавший об этом, хочет стать его покупателем."
 gdp_tgf_tall_mast_modifier: "Высокая мачта"
 gdp_tgf_tall_mast_modifier_desc: "Этот торговец владеет кораблём с лучшей мачтой на всём побережье, благодаря которой может плавать дальше прежнего."
 gdp_tgf_our_timber_modifier: "Мачты из нашего леса"
 gdp_tgf_our_timber_modifier_desc: "Мачты из леса, заготовленного на этом торговом пути, позволяют кораблям перевозить товары на куда большие расстояния."
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
 gdp_tgf_our_timber_renowned_modifier_desc: "$gdp_tgf_our_timber_modifier_desc$"
 gdp_tgf_heavier_loads_modifier_desc: "Этот торговый путь загружен сверх всякой меры."
 gdp_tgf_builders_rate_castle_full_modifier: "Камень для крепостных стен"
 gdp_tgf_builders_rate_castle_full_modifier_desc: "Камень для замка этого графства поставляется по ценам, установленным для строителей."
 gdp_tgf_builders_rate_castle_small_modifier: "Стены втридорога"
 gdp_tgf_builders_rate_castle_small_modifier_desc: "Камень для замка этого графства обходится недёшево."
 gdp_tgf_builders_rate_church_full_modifier: "Камень для храма"
 gdp_tgf_builders_rate_church_full_modifier_desc: "Камень для стен этого храма поставляется по ценам, установленным для строителей."
 gdp_tgf_builders_rate_church_small_modifier: "Храм втридорога"
 gdp_tgf_builders_rate_church_small_modifier_desc: "Камень для стен этого храма обходится недёшево."
 gdp_tgf_builders_rate_city_full_modifier: "Лес для верфей"
 gdp_tgf_builders_rate_city_full_modifier_desc: "Лес для города этого графства поставляется по ценам, установленным для строителей."
 gdp_tgf_builders_rate_city_small_modifier: "Верфи втридорога"
 gdp_tgf_builders_rate_city_small_modifier_desc: "Лес для города этого графства обходится недёшево."
 gdp_tgf_builders_rate_generic_full_modifier: "Цена для своих"
 gdp_tgf_builders_rate_generic_full_modifier_desc: "Строители этого графства получают камень по выгодной цене."
 gdp_tgf_builders_rate_generic_small_modifier: "Рыночная цена"
 gdp_tgf_builders_rate_generic_small_modifier_desc: "Строители этого графства получают камень по рыночной цене."
 gdp_tgf_keep_the_best_modifier: "Лучшее из имеющегося"
 gdp_tgf_keep_the_best_modifier_desc: "Этот персонаж приберёг лучшие строительные материалы для собственных нужд."
 gdp_tgf_plentiful_stalls_modifier: "Полные прилавки"
 gdp_tgf_plentiful_stalls_modifier_desc: "Торговец завалил прилавки этого графства лучшими дарами леса."
 gdp_tgf_well_supplied_host_modifier: "Войско, обеспеченное всем необходимым"
 gdp_tgf_well_supplied_host_modifier_desc: "Торговец исправно снабжает войска этого персонажа всем необходимым для военных походов."
 gdp_tgf_bee_stung_modifier: "Жертва пчёл"
 gdp_tgf_bee_stung_modifier_desc: "Этот персонаж решил выяснить отношения с пчёлами на складе и пожалел об этом."
 gdp_tgf_awake_and_alert_modifier: "Не смыкая глаз"
 gdp_tgf_awake_and_alert_modifier_desc: "Этот персонаж пьёт чай в огромных количествах, а ночами просиживает над учётными книгами."
 gdp_tgf_tea_drinker_modifier: "Пристрастие к чаю"
 gdp_tgf_tea_drinker_modifier_desc: "Этот персонаж пристрастился к чаю вслед за торговцем, а вместе с этой привычкой обрёл и ясность ума."
 gdp_tgf_well_grazed_meadows_modifier: "Богатые пастбища"
 gdp_tgf_well_grazed_meadows_modifier_desc: "Стада торговца отъелись на местных пастбищах, а трава после них стала ещё зеленее."
 gdp_tgf_lacquer_rash_modifier: "Сыпь от лака"
 gdp_tgf_lacquer_rash_modifier_desc: "Этот персонаж не дождался, пока лак высохнет, и за это поплатился."
 gdp_tgf_curing_room_modifier: "Цех просушки"
 gdp_tgf_curing_room_modifier_desc: "Этот торговец сушит лак во влажном помещении, слой за слоем, и покупатели сразу замечают качественно выполненную работу."
 gdp_tgf_theriac_supply_modifier: "Запасы териака"
 gdp_tgf_theriac_supply_modifier_desc: "Териак, изготовленный из сырья, имеющегося в распоряжении торговца, продаётся на рынках этого графства."
 gdp_tgf_theriac_dose_modifier: "Доза териака"
 gdp_tgf_theriac_dose_modifier_desc: "Этот персонаж принял дозу териака и безоговорочно верит в его целебную силу."
 gdp_tgf_theriac_peddlers_modifier: "Торговцы панацеей"
 gdp_tgf_theriac_peddlers_modifier_desc: "Териак, или панацея, продаётся во всех городах, расположенных вдоль этого пути, так что караваны всегда загружены доверху."
