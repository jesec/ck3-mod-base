 gdp_tgf_bled_by_the_handful_modifier: "Гроши бедняков"
 gdp_tgf_bled_by_the_handful_modifier_desc: "Местные бедняки тратят свои скудные средства на товары торговца, покупая по чуть-чуть, насколько хватит жалких медяков."
 gdp_tgf_market_day_crowds_modifier: "Рыночное столпотворение"
 gdp_tgf_market_day_crowds_modifier_desc: "На местный рынок стекаются покупатели со всего графства."
 gdp_tgf_further_roads_modifier: "Бывалые торговцы"
 gdp_tgf_further_roads_modifier_desc: "Многолетний опыт странствий научил торговцев этого персонажа находить покупателей даже в самых дальних краях."
