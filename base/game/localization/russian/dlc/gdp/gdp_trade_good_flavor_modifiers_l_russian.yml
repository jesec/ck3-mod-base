 gdp_tgf_known_mark_modifier: "Знакомое клеймо"
 gdp_tgf_known_mark_modifier_desc: "Среди покупателей на этом торговом пути особым спросом пользуются товары с клеймом одного торговца."
 gdp_tgf_kept_edge_modifier: "Коммерческие тайны"
 gdp_tgf_kept_edge_modifier_desc: "Этот персонаж не пожелал раскрывать имена своих поставщиков даже за большие деньги."
 gdp_tgf_price_war_modifier: "Предельно низкие цены"
 gdp_tgf_price_war_modifier_desc: "Этот персонаж урезал цены до предела, а вместе с ними сократилась и прибыль его конкурента."
 gdp_tgf_vein_share_modifier: "Финансируемые торговцем разработки"
 gdp_tgf_vein_share_modifier_desc: "Торговец приобрёл долю в горных разработках этого графства и намерен получить всё добытое сырьё без остатка."
 gdp_tgf_ballast_trick_modifier: "Прибыльный балласт"
 gdp_tgf_ballast_trick_modifier_desc: "На этом торговом пути нет бесполезного груза, поскольку даже балласт приносит прибыль."
 gdp_tgf_hop_trader_modifier: "Торговец хмелем"
 gdp_tgf_hop_trader_modifier_desc: "Этот торговец продаёт пиво с добавлением хмеля, которое долго не портится в пути и освобождено от господского налога на грюйт."
