l_russian:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "Кипящий котёл"
 republic_popular_opinion_event.1001.desc: "В последнее время патрициям лучше не попадаться на глаза уличной толпе.\n\nЗаметив, как я тревожно озираюсь по сторонам, [relation_01.GetName] восклицает:\n\n«Да чтоб тебя, [ROOT.Char.GetFullName]! Наши патриции не сидят взаперти! Они гордо выходят на улицы и ведут себя как полноправные граждане!».\n\nКонечно, [Select_CString(relation_01.IsFemale, 'она права', 'он прав' )]. Но [relation_01.GetName] сегодня — не то же самое, что вчера: в городе нарастает напряжение, и зреющее недовольство грозит выплеснуться наружу в любой момент. Протесты и уличные драки стали обычным делом, и остаётся только гадать, что творится после захода солнца."
 republic_popular_opinion_event.1001.a: "«Это верно. Нельзя склонять голову»."
 republic_popular_opinion_event.1001.b: "«Пожалуй, неплохо будет обзавестись телохранителем»."
 republic_popular_opinion_event.1001.c: "«Толпа нас всех растерзает!»."
 republic_popular_opinion_event.1001.d: "«Я им так просто не дамся»."
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "Время недовольства"
 republic_popular_opinion_event.1002.desc_1: "Стоя у окна, я слышу далёкие отзвуки гневных выкриков. [event_location_01.GetName] бурлит от недовольства. Рабочие грозят бросить инструменты и выйти на улицы. С наступлением темноты возмущённый народ крушит и оскверняет символы власти.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "На каждом шагу — одно и то же: понурые лица, препоны, ругательства — негромкие, но едкие."
 republic_popular_opinion_event.1002.desc_control_firm: "Общественность способна лишь на символические знаки протеста, поскольку правительство жёстко и эффективно подавляет любые незаконные сборища."
 republic_popular_opinion_event.1002.desc_control_strained: "Спасибо, [ROOT.Char.GetFaith.HighGodName], что городской страже удалось подавить вспыхнувшие беспорядки. Зачинщики арестованы и каждый день сидят в колодках. Те, кто намеревался воспользоваться хаосом, выявлены, и на них объявлена охота. Порядок удалось сохранить, хотя бы на время."
 republic_popular_opinion_event.1002.desc_control_slipping: "Несмотря на старания городской стражи зачинщикам удалось проскользнуть, и на улицах воцарился хаос. Толпы собираются быстрее, чем мы успеваем их разгонять. Ночь стала царством бандитов и головорезов."
 republic_popular_opinion_event.1002.desc_control_broken: "Правительство утратило контроль за улицами. Городская стража забаррикадировалась в казармах, а банды атакуют патрициев даже на ступенях дворца! Всюду ходят слухи об иноземных агентах и вредителях."
 republic_popular_opinion_event.1002.a: "Я поддержу правительство!"
 republic_popular_opinion_event.1002.b: "Я дам народу понять, что я на его стороне."
 republic_popular_opinion_event.1002.c: "Лучше сидеть тихо и не высовываться."
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "Дух праздника"
 republic_popular_opinion_event.1003.desc: "Ах, [event_location_01.GetTitle.GetName]! Насколько суетливы и полны жизни твои рынки, какие интересные здесь порой бывают беседы! [craftsman_character.GetName] рассказывает мне шутку про своего осла — и я сгибаюсь в три погибели от хохота.\n\nЗа последние месяцы город стал мне как родной. С незнакомцами я разговариваю так же легко, как с домочадцами, а с лиц прохожих никогда не сходит улыбка вопреки всем жизненным тяготам. Осёл радостно ревёт и тычется мне в бок.\n\n«А хорошо у нас собрание потрудилось, да? — произносит [craftsman_character.GetFirstNameNoTooltip], почёсывая осла за ухом. — Может, отметите всё это дело как следует? Ну там, пирушку закатите? Да и гильдии, думаю, в стороне не останутся, помогут кто чем может. И спасибо скажут, и перед городом выслужатся»."
 republic_popular_opinion_event.1003.a: "«Замечательная мысль!»."
 republic_popular_opinion_event.1003.b: "«Бесплатные деньги, говорите?..»."
 republic_popular_opinion_event.1003.c: "«Мне бы скорее хотелось поближе познакомиться с вами»."
 republic_popular_opinion_event.1003.tt: "Ваше следующее [Concept('activity', 'занятие')|E] типа [Concept('feast', '«пир»')|E] #P бесплатно#!."
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "Большие замыслы"
 republic_popular_opinion_event.1004.desc: "Я и [relation_01.GetName] предаёмся отдыху на площади неподалёку от моего дома и наблюдаем за городской суетой. Замечательный денёк: в бокалах — [ROOT.Char.Custom('RegionalDrink')|l], вокруг — снующие по своим делам граждане. Сделав глоток, [relation_01.GetName] довольно вздыхает.\n\n«Поверьте, [ROOT.Char.GetFullName], сейчас самое время ковать железо: вы сами видите, насколько оно горячо! Пора замахнуться на что-нибудь посерьёзнее. При таком настроении в городе, кажется, нам всё по плечу! — с этими словами [Select_CString(relation_01.IsFemale, 'она', 'он' )] поднимет бокал и улыбается. — Ну, за новые возможности и толстые кошельки!».\n\nЯ улыбаюсь в ответ и приподнимаю свой кубок."
 republic_popular_opinion_event.1004.a: "«За приключения в далёких краях!»."
 republic_popular_opinion_event.1004.b: "«За новую любовь!»."
 republic_popular_opinion_event.1004.c: "«За славу и триумфы!»."
 republic_popular_opinion_event.1004.d: "«За родных и друзей!»."
