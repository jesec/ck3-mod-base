l_russian:
 gdp_merchant_activity_events.0001.t: "Голодные гости"
 gdp_merchant_activity_events.0001.desc: "На празднике я всё чаще слышу ворчание голодных и недовольных гостей. На подносах остались одни крошки, и слуги вовсе не спешат наполнить их едой.\n\n[guest.GetTitledFirstName|U] [guest.Custom('quirk_neg_present')] и, поставив рядом с собой пустую чашку, спрашивает: «Кто на этом проклятом банкете отвечает за напитки?»"
 gdp_merchant_activity_events.0001.host: "\n\nВозможно, это мой шанс спасти мероприятие?"
 gdp_merchant_activity_events.0001.guest: "\n\nВозможно, это мой шанс спасти мероприятие, которое устраивает [host.GetTitledFirstName]?"
 gdp_merchant_activity_events.0001.a: "«[Select_CString(ROOT.Char.IsFemale, 'Уверена', 'Уверен' )], [host.GetTitledFirstNameNoTooltip] не поскупится на угощения!»"
 gdp_merchant_activity_events.0001.a.host: "«Хорошо, я #EMP заставлю#! слуг потрудиться!»"
 gdp_merchant_activity_events.0001.b: "Похоже, самое время поторговаться."
 gdp_merchant_activity_events.0001.c: "«Вам стоит быть благодарнее, [guest.GetTitledFirstNameNoTooltip]!»"
 gdp_merchant_activity_events.0001.d: "«Если вам что-то не нравится, проваливайте!»"
 gdp_merchant_activity_events.0001.e: "«Пора открыть склады компании»."
 gdp_merchant_activity_events.0005.t: "Необычная просьба"
 gdp_merchant_activity_events.0005.desc: "[Select_CString(admirer.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))], [admirer.GetTitledFirstName], зовёт меня присоединиться к беседе. Компанию [Select_CString(admirer.IsFemale, 'ей', 'ему' )] составляет [guest.GetTitledFirstName].\n\n[admirer.GetTitledFirstName|U] улыбается мне"
 gdp_merchant_activity_events.0005.desc_esteemed: "с теплотой"
 gdp_merchant_activity_events.0005.desc_fallback: "с задором"
 gdp_merchant_activity_events.0005.desc_outro: "во взгляде и произносит: «Я и [Select_CString(guest.IsFemale, 'моя', 'мой' )] [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))] как раз обсуждали, что вы привезли из дальних стран [luxury_artifact.Custom('GetLuxuryArtifactSentiment')|l]ую вещицу. Как вам удалось раздобыть такую диковинку, как [luxury_artifact.GetName]?»\n\nЯ понимаю, что [Select_CString(admirer.IsFemale, 'благородный муж', 'благородная дама' )] желает позабавиться и развлечь [Select_CString(guest.IsFemale, 'свою собеседницу', 'своего собеседника' )], слушая мой рассказ."
 gdp_merchant_activity_events.0005.a: "«Это было нетрудно…»"
 gdp_merchant_activity_events.0005.b: "«Ради этой „диковинки“ я не раз [Select_CString(ROOT.Char.IsFemale, 'рисковала', 'рисковал' )] жизнью!»"
 gdp_merchant_activity_events.0005.b.success: "Ваше повествование звучит правдоподобно"
 gdp_merchant_activity_events.0005.b.failure: "Вас ловят на лжи"
 gdp_merchant_activity_events.0005.c: "«А теперь послушайте!»"
 gdp_merchant_activity_events.0005.d: "«Это ничто по сравнению с тем, что я продаю во владении [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]»."
 gdp_merchant_activity_events.0010.t: "Подарок с намёком"
 gdp_merchant_activity_events.0010.desc: "Едва возвратившись, [Select_CString(merchant.IsFemale, 'моя', 'мой')] коллега [merchant.GetTitledFirstName] начинает хвастаться своим богатством, сверкая дорогими украшениями и демонстрируя изысканные наряды из [merchant.Custom('RegionalFabric')|l]. Рынки города [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip] полны [good.Custom('GetTradeGoodUnitPlural_RU_Gen')] [good.Custom('GetTradeGood_RU_Gen')|l], доставленных [Select_CString(merchant.IsFemale, 'ею', 'им')] из далёких стран, и [merchant.GetSheHe] не перестаёт нахваливать свой превосходный товар.\n\nЯ замечаю, как [Select_CString(receiver.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', receiver)] [receiver.GetTitledFirstName] принимает от [Select_CString(merchant.IsFemale, 'неё', 'него')] подарок на глазах восторженной толпы."
 gdp_merchant_activity_events.0010.a: "Что ж, я тоже так могу…"
 gdp_merchant_activity_events.0010.b: "«Какой шикарный презент, [merchant.GetTitledFirstNameNoTooltip]!»"
 gdp_merchant_activity_events.0010.b.success: "[merchant.GetFirstNameNoTooltip] выглядит [Select_CString(merchant.IsFemale, 'растерянной', 'растерянным')]"
 gdp_merchant_activity_events.0010.b.failure: "Вы выставляете себя [Select_CString(ROOT.Char.IsFemale, 'глупой', 'глупцом' )]"
 gdp_merchant_activity_events.0010.c: "Да наплевать."
 gdp_merchant_activity_events.0010.d: "«Не стоит бахвалиться перед теми, кто стоит выше вас»."
 gdp_merchant_activity_events.0015.t: "Крестьянская доля"
 gdp_merchant_activity_events.0015.desc: "Тихая и прохладная ночь резко контрастирует со светлыми и натопленными залами, где столы ломятся от еды и напитков.\n\nЯ выхожу на улицу, чтобы подышать свежим воздухом, и вижу толпу бедняков: простолюдины ждут у стены, надеясь заполучить объедки, которые останутся после пиршества."
 gdp_merchant_activity_events.0015.a: "Пусть поедят и порадуются!"
 gdp_merchant_activity_events.0015.b: "Какие нищие? У нас тут сливки общества и [ROOT.Char.Custom('RegionalDrink')|l]!"
 gdp_merchant_activity_events.0015.b.alcohol: "В пекло их, меня ждут сливки общества и [ROOT.Char.Custom('RegionalAlcoholicDrink')|l]!"
 gdp_merchant_activity_events.0015.c: "Вот мои #EMP настоящие#! братья и сёстры."
 gdp_merchant_activity_events.0015.d: "Прочь, жалкие попрошайки!"
 custom.every_attending_noble: "Каждый присутствующий [Concept('character', 'персонаж')|E]-[Concept('noble', 'дворянин')|E]"
 gdp_merchant_activity_events.0020.t: "В глазах смотрящего"
 gdp_merchant_activity_events.0020.desc: "До меня дошла новость, что [Select_CString(other.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))] [other.GetTitledFirstName] по случаю [Select_CString(other.IsFemale, 'надела', 'надел')] изысканный образчик ювелирного мастерства.\n\nЭто [fake_artifact.GetNameNoTooltip|l]! Я нахожу [Select_CString(other.IsFemale, 'благородную даму', 'благородного мужа')] в главном зале: в богатом наряде и c украшением на шее [Select_CString(other.IsFemale, 'она', 'он')] выглядит неотразимо. Когда я подхожу, [other.GetTitledFirstName] [other.Custom('quirk_pos_present')] и произносит: «Вы видели моё последнее приобретение? Как думаете, оно стоило своих денег?»\n\nВ тёплом сиянии свечей драгоценные камни смотрятся очаровательно, однако мой намётанный глаз подмечает целый ряд недостатков."
 gdp_merchant_activity_events.0020.a: "«Вот умора! [Select_CString(other.IsFemale, 'Она', 'Он')] и впрямь думает, что эта поделка чего-то стоит!»"
 gdp_merchant_activity_events.0020.b: "#weak *шёпотом*#! «Позвольте мне избавить вас от этой фальшивки»."
 gdp_merchant_activity_events.0020.b.tt: "Вы получаете [Concept('artifact', 'артефакт')|E], влияющий на [Concept('opinion', 'мнение')|E] о [Concept('attraction', 'привлекательности')|E]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "[other.GetTitledFirstName|U] соглашается. [fake_artifact.GetName] у вас в руках."
 gdp_merchant_activity_events.0020.c: "«Это и правда настоящее сокровище»."
 fake_artifact_name: "Украшение с драгоценными камнями"
 fake_artifact_desc: "Это украшение эффектно блестит, однако при ближайшем рассмотрении становится заметна крайне небрежная огранка камней."
 gdp_merchant_activity_events.0025.t: "Проторённая дорожка"
 gdp_merchant_activity_events.0025.desc: "Среди привычных смеха и болтовни я вдруг различаю странный звук…"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP У-У!#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP КИ-КИ!#!"
 gdp_merchant_activity_events.0025.desc_cont: "Не может быть! [luxury_artifact.Custom('GetDomicileArtifactCreatureType')]! Кто приволок это создание на пир?\n\nЯ пристально всматриваюсь в толпу и наконец нахожу [Select_CString(merchant.IsFemale, 'владелицу: мою', 'владельца: моего')] коллегу по имени [merchant.GetTitledFirstName]. [Select_CString(merchant.IsFemale, 'Торговка', 'Торговец')] ловит мой взгляд, [merchant.Custom('quirk_pos_present')] и произносит: «Я [Select_CString(merchant.IsFemale, 'привезла', 'привёз')] эту прелюбопытнейшую особь из очередного путешествия. Есть в одном месте рыночек, я часто туда заглядываю. Но где он — не скажу. Коммерческая тайна». [merchant.GetTitledFirstName] самодовольно ухмыляется и прикладывает палец к губам."
 gdp_merchant_activity_events.0025.a: "«О, кажется, я знаю это место!»"
 gdp_merchant_activity_events.0025.b: "«Как мне уговорить вас раскрыть секрет?»"
 gdp_merchant_activity_events.0025.b.success: "Вы приводите убедительные аргументы"
 gdp_merchant_activity_events.0025.b.failure: "Вы не можете привести убедительные аргументы"
 gdp_merchant_activity_events.0025.c: "«Я хочу послушать о ваших путешествиях!»"
 gdp_merchant_activity_events.0025.tt.menagerie: "Появится [luxury_contract_i][Concept('luxury_contract', 'эксклюзивный договор')|E] #V $menagerie_acquisition_contract$#!"
 gdp_merchant_activity_events.0025.tt.curio: "Появится [luxury_contract_i][Concept('luxury_contract', 'эксклюзивный договор')|E] #V $find_curio_contract$#!"
