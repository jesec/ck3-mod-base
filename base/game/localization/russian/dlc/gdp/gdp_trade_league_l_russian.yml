l_russian:
 trade_league.1001.t: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 trade_league.1001.desc: "Мы принимаем ваше приглашение в конфедерацию «[ROOT.Char.GetConfederation.GetName]».\n\nПусть удача всегда нам улыбается!"
 trade_league.1001.a: "Отлично"
 msg_trade_league_leadership_changed: "Новый лидер лиги: [actor.GetShortUINameNoTooltip]"
 msg_trade_league_leadership_changed_desc: "[actor.GetUIName|U] [Select_CString(actor.IsLocalPlayer, 'стали', Select_CString(actor.IsFemale, 'стала', 'стал'))] новым [Concept('trade_league_leader', 'лидером торговой лиги')|E] «[league_to_lead.GetName]», которую ранее [Select_CString(recipient.IsLocalPlayer, 'возглавляли', Select_CString(recipient.IsFemale, 'возглавляла', 'возглавлял'))] [recipient.GetUIName]"
 msg_trade_league_leader_succeeded: "Новый лидер лиги: [new_league_leader.GetShortUINameNoTooltip]"
 msg_trade_league_leader_succeeded_desc: "После того как [former_league_leader.GetUIName] [Select_CString(former_league_leader.IsLocalPlayer, 'оставили', Select_CString(former_league_leader.IsFemale, 'оставила', 'оставил'))] свой пост, новым [Concept('trade_league_leader', 'лидером торговой лиги')|E] «[confederation.GetName]» [Select_CString(new_league_leader.IsLocalPlayer, 'стали', Select_CString(new_league_leader.IsFemale, 'стала', 'стал'))] [new_league_leader.GetUIName]"
 msg_trade_league_leader_succeeded_no_predecessor_desc: "[new_league_leader.GetUIName|U] теперь [Concept('trade_league_leader', 'лидер торговой лиги')|E] «[confederation.GetName]»"
