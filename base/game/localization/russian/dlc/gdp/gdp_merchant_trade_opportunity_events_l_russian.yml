 associate_taking_assistance_modifier_desc: "У этого персонажа нет деловой хватки, за что расплачиваются его товарищи."
 ruler_stifles_company_modifier: "Правитель душит торговлю"
 ruler_stifles_company_modifier_desc: "Этот персонаж вызвал гнев местного правителя, который теперь затрудняет ведение дел."
 merchant_prosperity_advice_modifier: "Способствование торговле"
 merchant_prosperity_advice_modifier_desc: "Предложенная купцом политика способствует развитию торговли в этом графстве."
 associate_following_example_modifier: "Подражание примеру"
 associate_following_example_modifier_desc: "У этого персонажа есть пример для подражания: добившийся успеха товарищ по компании."
 associate_setting_example_modifier: "Образец для подражания в компании"
 associate_setting_example_modifier_desc: "Этот персонаж подаёт своим товарищам хороший пример."
 focused_trade_modifier: "Расширенный объём"
 focused_trade_modifier_desc: "Объём поставок по этому маршруту увеличен в ущерб другим."
 sidelined_trade_modifier: "Уменьшенный объём"
 sidelined_trade_modifier_desc: "Объём поставок по этому маршруту уменьшен ради других."
 diverted_trade_modifier: "Перенаправленный объём"
 diverted_trade_modifier_desc: "Объём поставок с этого маршрута перенаправлен в поддержку других."
 investor_scammer_modifier: "Обманщик вкладчиков"
 investor_scammer_modifier_desc: "Этот персонаж прославился тем, что обманывает вкладчиков.\n#weak Маловероятно, что другие будут вкладываться в его начинания.#!"
 investor_scammer_opinion: "Обманщик вкладчиков"
 trade_cooperation_modifier: "Торговое сотрудничество"
 trade_cooperation_modifier_desc: "Этот персонаж работает вместе с конкурентом, чтобы завладеть рынком."
 custom.every_other_associate: "Все прочие [Concept('associate', 'помощники')|E]"
 custom.every_other_trade_route: "Все прочие [Concept('trade_route', 'торговые пути')|E]"
