l_russian:
 gdp_merchant_trade_opportunity.0001.t: "Бросить вызов сопернику: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "[task_contract_target.GetPrimaryTitle.GetName] — настоящая кость в горле, из-за которой страдают наши возможности и прибыль; особенно же страдает [local_market.GetShortName].\n\nНеобходимо как-то разобраться с этими смутьянами, а заодно доказать, что на местных рынках нет других хозяев, кроме нас."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "После долгих разговоров с местными лотошниками и тщательного знакомства с рынками владения [trade_market.GetShortName] мы выяснили, что [target_title.GetName] всё-таки обладает определёнными слабостями.\n\nВ наших руках — возможность подкосить их отношения на местности, перебить цены на самые важные товары и, самое главное, обрушить им не только прибыль, но и репутацию!"
 gdp_merchant_trade_opportunity.0002.a: "Пусть знают, что не стоит переходить нам дорогу."
 gdp_merchant_trade_opportunity.0002.b: "Если мы раскроем свой замысел, они станут нас уважать."
 gdp_merchant_trade_opportunity.0002.b.tt: "Вы должны быть [Concept('friend', 'другом')|E] или [Concept('spouse', 'супругом')|E], либо ваш навык [Concept('diplomacy', 'дипломатии')|E] должен составлять хотя бы [SCOPE.ScriptValue('high_skill_rating')|V0]. Также у вас не должно быть отрицательных [Concept('relation', 'особых отношений')|E] и вы не должны участвовать во [Concept('house_feuding', 'вражде')|E]"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "Наши попытки разобраться, какими же связями обладает [target_title.GetName] во владении [trade_market.GetShortName] и за его пределами, пока что почти бесплодны. Кроме того, наша репутация пострадала, и [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')|l] теперь относится к нам не так благосклонно, как раньше.\n\nМы были недостаточно аккуратны, и теперь дом [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip] чувствует себя только увереннее. Их запутанные цепочки поставок по-прежнему прочны."
 gdp_merchant_trade_opportunity.0003.a: "О [ROOT.Char.GetFaith.WealthGodName]! Мы потеряем прибыль!"
 gdp_merchant_trade_opportunity.0011.t: "Поддержать товары: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "Оживлённые [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] во владении [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] — место яростных стычек между лоточниками и купцами за выгодную торговлю самыми разными товарами.\n\nШум рыночных площадей и толп прохожих заставляет задуматься: как же нам сделать так, чтобы и наш товар начал выделяться по сравнению с другими, чтобы не было отбоя одинаково и от покупателей, и от лавочников?.."
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "Похоже, продвижение товара типа «[trade_good_type.GetNameNoTooltip]» во владении [target_title.GetBaseNameNoTierNoTooltip] начинает приносить свои плоды. Теперь многие специально выискивают на рынках наши «превосходные» товары, благодаря чему наша прибыль в этой области стремительно растёт.\n\nНаши усилия не прошли даром, и покупатели явно не остались равнодушными к тому, как мы нахваливаем и настойчиво продвигаем свою продукцию."
 gdp_merchant_trade_opportunity.0012.a: "Не станем упускать эту возможность."
 gdp_merchant_trade_opportunity.0012.b: "Я уже чую, как в кошельке звенят [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]!"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "Стоит признать, что как бы мы ни приукрашивали качество наших товаров, нам так и не удалось привлечь новых покупателей…\n\nС каждым днём продажи только падают, и мы стремительно теряем доверие людей. В итоге спрос на товары типа «[trade_good_type.GetNameNoTooltip]» во владении [target_title.GetBaseNameNoTierNoTooltip] постепенно сходит на нет."
 gdp_merchant_trade_opportunity.0013.a: "Но ведь у нас [trade_good_type.GetNameNoTooltip|l] #EMP лучше#!, чем где-либо ещё!"
 gdp_merchant_trade_opportunity.0021.t: "Поощрить вложения: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "Любой, кто прогуляется по владению [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip], против своей воли заметит, насколько здесь всё несовершенно: дрянные дороги, тесные и хлипкие склады… даже [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l] не вызывает никакого уважения.\n\nНужно раскрыть местным властям глаза на простую истину: выгода от вложений во много раз перекроет расходы. Однако если этот замысел сорвётся, нам придётся вкладывать собственные средства, чтобы связи в этой местности начали приносить прибыль…"
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "Нам удалось обратить на себя внимание правильных людей — для этого потребовалось расписать недостатки [target_title.GetAdjectiveNoTooltip|l]ой инфраструктуры и преимущества, которые принесут вложения в её улучшение.\n\nСемена уже упали в землю, но ещё не дали всходов; однако [local_ruler.GetTitledFirstName] уже на нашей стороне, и вскоре начнутся работы. Местные торговцы и горожане осторожно начинают поздравлять нас — они предвкушают увеличение объёма торговли."
 gdp_merchant_trade_opportunity.0022.a: "Если хочешь сделать что-то правильно — сделай это сам."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "Наши попытки убедить местные власти в несметном множестве недостатков [target_title.GetAdjectiveNoTooltip|l]ой инфраструктуры оказались совершенно бесплодными. Похоже, тщетно надеяться, что эти болваны к нам прислушаются.\n\nОшибка за ошибкой — так здесь принято вести дела, и пока что всё, чего мы добились своими начинаниями, это озадачили местных чиновников и купцов. Значит, придётся браться за дело самостоятельно…"
 gdp_merchant_trade_opportunity.0023.a: "Сюда непременно должны хлынуть торговые потоки."
 gdp_merchant_trade_opportunity.0023.b: "Здесь живут сплошные тупицы…"
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|U] владения [local_market.GetShortName] даже не пытаются скрывать следы обрушившихся на эту местность несчастий: какие-то лавки заколочены, какие-то — брошены хозяевами… После того как отсюда, не выдержав тяжёлых времён, сбежали купцы, торговые потоки почти пересохли.\n\nЭтим людям необходимо уяснить важный урок: бесполезно заламывать руки и убегать, когда приходит беда, поскольку мир одинаково шаток везде. Нам предстоит восстановить порядок и заполнить освободившуюся нишу."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: успех"
 gdp_merchant_trade_opportunity.0032.desc: "Из-за закрытых дверей на нас смотрят десятки глаз: это жители владения [target_title.GetBaseNameNoTierNoTooltip] так встречают новых гостей. Нам не пришлось долго объяснять, зачем мы сюда прибыли, и вскоре рынок вместе со всеми запасами перешёл к нам.\n\nТе же, кто остался внакладе, с большой неохотой были вынуждены признать, что восстановление порядка и медленное оживление торговли пойдёт этой местности только на пользу."
 gdp_merchant_trade_opportunity.0032.a: "Такое вот выгодное дело…"
 gdp_merchant_trade_opportunity.0032.b: "Мы здесь закончили."
 every_county_province_custom: "Каждое недавно разграбленное [Concept('holding', 'владение')|E] в графстве [saved_county.GetNameNoTier]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: провал"
 gdp_merchant_trade_opportunity.0033.desc: "Похоже, мы были слишком настойчивы: обитатели владения [target_title.GetBaseNameNoTierNoTooltip] ни в какую не согласились пойти нам навстречу. Всё, что мы смогли сделать, — это настроить их против себя.\n\nК недовольным жителям прибились и местные торговцы: они не готовы смириться с тем, что наше господство — неизбежная цена за восстановление порядка и торговых связей!"
 gdp_merchant_trade_opportunity.0033.a: "Бездумные упрямцы!"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|U] владения [local_market.GetShortName] славятся своими многочисленными ремесленниками, которые производят любой нужный народу товар — от верёвок до серебряных изделий.\n\nГильдии тщательно оберегают свои секреты: никто даже не знает, сколько людей трудится в их цехах. Однако, наладив связи, мы вполне можем подобраться поближе к ремесленникам и зарекомендовать себя как надёжные покровители. Возможно, в итоге мы всё-таки узнаем некоторые их тайны, которые затем можно будет обратить в прибыль."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: успех"
 gdp_merchant_trade_opportunity.0042.desc: "[target_title.GetBaseNameNoTierNoTooltip] любит звонкую монету не меньше других: мы поддерживаем самых разных ремесленников, чтобы местные мастера могли и дальше радовать нас своими чудесными товарами.\n\nПокровителей, то есть нас, привечают везде без исключения; мы даже смогли обратить на себя внимание [Select_CString(inspired_artisan.IsFemale, 'известной ремесленницы', 'известного ремесленника')] по имени [inspired_artisan.GetFirstName] — [Select_CString(inspired_artisan.IsFemale, 'ей', 'ему')] нужны средства на изготовление [inspired_artisan.Custom('InspirationArtisanType')|l]."
 gdp_merchant_trade_opportunity.0042.a: "Вложения себя оправдали."
 gdp_merchant_trade_opportunity.0042.b: "Нельзя упускать такую возможность!"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: провал"
 gdp_merchant_trade_opportunity.0043.desc: "Любая наша попытка наладить связи с ремесленникам владения [target_title.GetBaseNameNoTierNoTooltip] неизменно оборачивается неудачей. Местные мастера крайне неохотно берут деньги и при этом не говорят ни слова благодарности.\n\nЧем же мы заслужили такую немилость? Возможно, возникло недопонимание или же постарались наши конкуренты, либо тут просто не любят любопытных. Скорее всего, правды мы уже не узнаем…"
 gdp_merchant_trade_opportunity.0043.a: "Всё равно их товары — дрянь…"
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "[task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|U] владения [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] — лёгкая нажива, это очевидно каждому, кто задержится здесь хотя бы на миг. Они жаждут наших денег; ещё немного — и к нам вот-вот потянутся будущие клиенты, бессильные перед манящим зовом.\n\nКуда проще найти тех, кто будет брать [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')], нежели тех, кто согласится их давать, однако необходимо проявить разборчивость. Мы забрасываем удочку не просто так — на нас уповает [local_market.GetShortName], а чтобы поймать крупную рыбу, потребуются хитрость и терпение."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: успех"
 gdp_merchant_trade_opportunity.0052.desc: "Мы пустили по владению [target_title.GetBaseNameNoTierNoTooltip] слух о предоставлении открытых линий финансирования и совсем скоро получили на удивление скромное приглашение, подписанное как «[debtor.GetTitledFirstName|l]».\n\nПо всей видимости, [Select_CString(debtor.IsFemale, 'благородная дама', 'благородный господин')] желает, чтобы в [Select_CString(debtor.IsFemale, 'её', 'его')] деловых книгах было некоторое… пространство для манёвра. Не нам, простым купцам, ставить под сомнение желания заказчика, занимающего столь высокое положение…"
 gdp_merchant_trade_opportunity.0052.a: "«Давайте немножко поправим записи… #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip] из владения [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]…#!»"
 gdp_merchant_trade_opportunity.0052.b: "«Боюсь, сейчас это невозможно, [Select_CString(debtor.IsFemale, 'миледи', 'милорд')]»."
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: провал"
 gdp_merchant_trade_opportunity.0053.desc: "Мы смогли распустить по владению [target_title.GetBaseNameNoTierNoTooltip] слух о предоставлении открытых линий финансирования — но и только. Местная знать вовсе не спешит пользоваться нашим щедрым предложением.\n\nСложно сказать, что послужило этому причиной: неаккуратный подход к делу, вмешательство других купцов или же, может, власть имущие именно сейчас ни в чём не нуждаются."
 gdp_merchant_trade_opportunity.0053.a: "Ничего, они ещё приползут обратно, как и всегда…"
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "[Select_CString(contract_employer.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))|l] [contract_employer.GetFirstName] [Select_CString(contract_employer.IsFemale, 'принесла', 'принёс')] любопытные вести: [market_owner.GetName] ищет торговцев, которые могут доставить [Select_CString(market_owner.IsFemale, 'ей', 'ему')] крупную партию товара типа «[trade_good_type.GetNameNoTooltip]».\n\n[task_contract_target.GetTitledFirstName] из компании [task_contract_target.GetHouse.GetBaseName] уже самонадеянно [Select_CString(task_contract_target.IsFemale, 'заявила', 'заявил')], что [Select_CString(task_contract_target.IsFemale, 'она', 'он')] без труда справится с этим заказом. Думаю, проявив смекалку, мы вполне можем отбить у [Select_CString(task_contract_target.IsFemale, 'неё', 'него')] этот контракт и поставить [Select_CString(task_contract_target.IsFemale, 'эту', 'этого')] зазнайку на место."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: успех"
 gdp_merchant_trade_opportunity.0062.desc: "Осторожные попытки встроиться в торговые цепочки владения [target_title.GetName] себя оправдали: когда наступил судьбоносный день борьбы за предложение, всё, что [Select_CString(target_title.GetHolder.IsFemale, 'могла', 'мог')] сделать [target_title.GetHolder.GetTitledFirstName], — это в ужасе наблюдать за собственным поражением.\n\n[target_title.GetNameNoTooltip|U] вряд ли скоро восстановит своё доброе имя, а значит, нам следует обернуть наступившую сумятицу себе на пользу."
 gdp_merchant_trade_opportunity.0062.a: "Всё идёт по плану…"
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: провал"
 gdp_merchant_trade_opportunity.0063.desc: "[target_title.GetHolder.GetTitledFirstName|U] вновь оказывается на шаг впереди нас, и даже попытки прибегнуть к коварству оказались тщетны: [target_title.GetNameNoTier] оставляет нас с носом, и приходится с горечью признать это постыдное поражение.\n\nМы уже никогда не узнаем, где именно допустили оплошность, — возможно, мы чересчур возгордились собой или переоценили собственную деловую смекалку. Ясно одно: мы проиграли, и теперь в кошельках пустота, а на сердце — тяжесть."
 gdp_merchant_trade_opportunity.0063.a: "В следующий раз обязательно получится…"
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip|l]"
 gdp_merchant_trade_opportunity.0071.desc: "Очередной груз, на этот раз [trade_good_type.Custom('GetTradeGood')|l]. [Select_CString(contract_employer.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))|l] [contract_employer.GetFirstName] дотошно всё проверяет. Все [trade_good_type.Custom('GetTradeGoodUnitPlural')|l] подвергаются тщательному осмотру на наличие изъянов, которые могли возникнуть из-за грубого обращения.\n\nПрежде чем попасть на прилавок, товары проходят через самых разных людей, которые нередко портят их по собственной глупости или неосторожности. В этом отношении можно многому научиться не только у магнатов, но и у самых мелких уличных торговцев."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: успех"
 gdp_merchant_trade_opportunity.0072.desc: "Обходя [destination.Custom('GetProvinceAdjective')|l] [destination.Custom('GetRegionalMarketTermGlossPlural')|l] и торговые павильоны во владении [destination.GetTitle.GetNameNoTierNoTooltip], мы услышали много интересных историй и почерпнули полезные знания о торговле таким товаром, как [trade_good_type.Custom('GetTradeGood_RU_Nom')|l].\n\nТеперь мы знаем, как правильно хранятся и перевозятся [trade_good_type.Custom('GetTradeGoodUnitPlural')|l], а также лучше разбираемся в процессе отбраковки и сезонных колебаниях спроса. Применив этот новоприобретённый опыт в своей работе, мы легко сможем увеличить свою прибыль где угодно, будь то [local_market.GetName|l] или любой другой."
 gdp_merchant_trade_opportunity.0072.a: "Оказывается, [trade_good_type.Custom('GetTradeGood_RU_Nom')|l] — это целая наука…"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: провал"
 gdp_merchant_trade_opportunity.0073.desc: "Сложно сосчитать, сколько дней мы провели, обходя [destination.Custom('GetProvinceAdjective')|l] [destination.Custom('GetRegionalMarketTermGlossPlural')|l] и торговые павильоны на рынке во владении [destination.GetTitle.GetNameNoTierNoTooltip]. Но сколько бы мы ни общались с купцами, мы так и не узнали ничего дельного о торговле таким товаром, как [trade_good_type.Custom('GetTradeGood_RU_Nom')|l].\n\nМолчаливые торговцы и недружелюбные посредники редко отвечали на наши вопросы иначе, чем с недоумением и откровенным презрением. При этом те крупицы знаний, которые нам всё же удалось выудить, оказались либо бесполезными, либо излишне запутанными и неприменимыми на практике."
 gdp_merchant_trade_opportunity.0073.a: "Мы обойдёмся и без их помощи!"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "[Select_CString(contract_employer.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))|l] [contract_employer.GetFirstName] недовольно закатывает глаза, наблюдая за тем, как [market.GetName|l] планомерно заполняется товарами компании [contract_target.GetPrimaryTitle.GetDefinitiveName].\n\n[contract_target.GetTitledFirstName] с каждым днём наращивает свою торговлю, а [contract_target.GetSuzerain.GetTitledFirstName] оказывает [Select_CString(contract_target.IsFemale, 'ей', 'ему')] в этом всестороннюю поддержку. Нужно как-то разорвать этот деловой тандем, иначе в скором времени нам останется лишь глотать пыль…"
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: успех"
 gdp_merchant_trade_opportunity.0082.desc: "Похоже, мы не зря умасливали посредников и возводили клевету на компанию [target_title.GetDefinitiveName] и их чёртову хартию. Наши усилия наконец принесли свои плоды, и теперь многие купцы убеждены, что [target_title.GetHolder.GetTitledFirstName] — ненадёжный партнёр, с которым не стоит вести никаких дел.\n\nДаже печать, которую [target_title.GetHolder.GetSuzerain.GetTitledFirstName] обычно ставит на [Select_CString(target_title.GetHolder.IsFemale, 'её', 'его')] торговых документах, во многом утрачивает свой вес, от чего этот дуэт явно не будет в восторге."
 gdp_merchant_trade_opportunity.0082.a: "Пусть [ROOT.Char.GetFaith.NegativeAfterLife|l] заберёт их проклятые бумажки!"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: провал"
 gdp_merchant_trade_opportunity.0083.desc: "Как бы усердно мы ни плели интриги против компании [target_title.GetDefinitiveName] и её посредников, мы так и не добились своего. Скрепляя торговые документы своей печатью, [target_title.GetHolder.GetSuzerain.GetTitledFirstName] даёт нашим конкурентам колоссальное преимущество, и мы не в силах ничего им противопоставить.\n\nВ результате [target_title.GetHolder.GetTitledFirstName] по-прежнему пользуется хорошей репутацией, тогда как мы своими коварными происками лишь снискали себе дурную славу…"
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName] улыбается дому [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip], как и прежде…"
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0091.desc: "Я и [Select_CString(associate.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] проходим по запустелым улицам владения [destination.GetBaronyNameExplicitlyNoTooltip]. Его [destination.Custom('GetRegionalMarketTermGlossPlural')|l] сильно пострадали от ужасов войны — куда ни глянь, всюду свирепствуют голод и нищета.\n\nВ переулках слишком много попрошаек — вдов, сирот и инвалидов, — а от заброшенных прилавков исходит аура тоски и отчаяния."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: успех"
 gdp_merchant_trade_opportunity.0092.desc: "Во время своего обхода мы всё-таки встретили нескольких торговцев и ремесленников, которые продолжают работать, несмотря на"
 gdp_merchant_trade_opportunity.0092.war: "посеянные войной голод и разруху."
 gdp_merchant_trade_opportunity.0092.disaster: "учинённые бедствием разрушения."
 gdp_merchant_trade_opportunity.0092.epidemic: "недавние вспышки болезни."
 gdp_merchant_trade_opportunity.0092.closing: "Мы даже сделали у них несколько покупок, чтобы помочь им преодолеть эти непростые времена. Конечно, это лишь небольшой вклад, но в такой ситуации каждая монета имеет значение.\n\nС каждым днём [destination.Custom('GetRegionalMarketTermGloss')|l] владения [destination.GetBaronyNameExplicitlyNoTooltip] понемногу оживает: по улицам ходит больше людей, на прилавках появляются новые товары, а таверны наполняются посетителями.\n\nС каждым днём рынок владения [destination.GetBaronyNameExplicitlyNoTooltip] понемногу оживает: по улицам ходит больше людей, на прилавках появляются новые товары, а таверны наполняются посетителями."
 gdp_merchant_trade_opportunity.0092.a: "Скоро [destination.GetBaronyNameExplicitlyNoTooltip] снова расцветёт."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: провал"
 gdp_merchant_trade_opportunity.0093.desc: "Мы объехали владение [destination.GetBaronyNameExplicitlyNoTooltip] вдоль и поперёк, пытаясь найти хоть каких-то купцов и ремесленников, которые могли бы с нашей поддержкой возродить местную торговлю. К сожалению, наши поиски не увенчались успехом.\n\nТе немногие торговцы, которых мы всё же повстречали, были в основном барыгами и спекулянтами, которые явно не достойны нашей помощи. Наблюдая за этой безысходностью и не имея возможности что-либо исправить, мы и сами начинаем предаваться отчаянию."
 gdp_merchant_trade_opportunity.0093.a: "Здесь мы бессильны…"
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "Оказавшись на #L [destination.GetTitle.GetAdjective|l]их#! улицах, я и [Select_CString(associate.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] открываем рты от изумления. [destination.Custom('GetRegionalMarketTermGloss')|U] воистину поражает воображение — торговые потоки здесь не просто какая-то абстракция, они столь же реальны, как [ROOT.Char.Custom('GroundType')] под ногами.\n\nЭто место буквально кишит купцами, которые, как и мы, ищут выгодных сделок. Разве можно упустить такие возможности?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: успех"
 gdp_merchant_trade_opportunity.0102.desc: "Последние месяцы прошли в постоянных разъездах по всему владению [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] в поисках деловых партнёров и выгодных сделок. Полагаясь на дипломатию и деловое чутьё, мы сумели договориться с множеством местных дельцов и посредников.\n\nНаши усилия не прошли даром, и в будущем сезоне они наверняка вернутся сторицей."
 gdp_merchant_trade_opportunity.0102.a: "Пусть посеянное нами принесёт достойные всходы!"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: Провал"
 gdp_merchant_trade_opportunity.0103.desc: "Мы изъездили владение [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] вдоль и поперёк, но так и не сумели наладить контакты с местными дельцами и посредниками. Поиски деловых партнёров и выгодных сделок ни к чему не привели.\n\nЭто не сулит ничего хорошего в будущем сезоне…"
 gdp_merchant_trade_opportunity.0103.a: "Во имя [ROOT.Char.GetRite.WealthGodNamePossessive]…"
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: Успех"
 gdp_merchant_trade_opportunity.0112.desc: "Мы прочесали город [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] вдоль и поперёк, стараясь понять, кому из высокопоставленных лиц можно всучить взятку или предложить свои услуги. В итоге удача нам улыбнулась: несколько выгодных сделок и договорённостей позволили обеспечить безопасность торговых маршрутов.\n\nТеперь можно перевести дух: бесперебойные поставки товаров в обозримом будущем практически гарантированы."
 gdp_merchant_trade_opportunity.0112.a: "На нас благословение [ROOT.Char.GetRite.WealthGodNamePossessive]!"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: Провал"
 gdp_merchant_trade_opportunity.0113.desc: "Мы прочесали город [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] вдоль и поперёк, стараясь понять, кому из высокопоставленных лиц можно всучить взятку или предложить свои услуги, — но всё было тщетно. Все наши усилия оказались лишь жалкой каплей в этом бушующем море торговли.\n\nОчевидно, что нам не удастся получить место в караване, столь необходимое для наших торговых операций."
 gdp_merchant_trade_opportunity.0113.a: "Что за торговец без каравана?"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "Я и [Select_CString(associate.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] вместе осматриваем перевалочный рынок владения [destination.GetBaronyNameExplicitly]. Торговля здесь не прекращается ни днём, ни ночью, купцы приезжают со всех концов света, а бесчисленное количество товаров переходит из руки в руки, чтобы отправиться в неизведанные края.\n\nМелким рыбёшкам тут не место — здесь заключают крупные оптовые сделки, на которых можно сколотить огромное состояние… или начисто разориться."
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: Успех"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nКаким-то образом мы выбрались из этого гадюшника целыми и невредимыми, да ещё и с внушительной стопкой долговых обязательств, гарантирующих нам в будущем сезоне выгодные цены на покупку такого товара, как [trade_good_type.Custom('GetTradeGood')|l], на рынках владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]."
 gdp_merchant_trade_opportunity.0122.intro: "Дни сливались в бесконечную череду торгов, препирательств и уговоров. На аукционных площадках непрерывно выкрикивали цены, от возбуждённой болтовни и зубовного скрежета ломило голову, под ногами шелестели брошенные расписки, записи и прах загубленных состояний."
 gdp_merchant_trade_opportunity.0122.a: "На этом рынке условия диктует продавец!"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: Провал"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nМы выбрались из этого гадюшника усталыми и измотанными, так и не добившись гарантии хорошей цены на покупку такого товара, как [trade_good_type.Custom('GetTradeGood')|l]. Конкуренты перебили наше предложение…"
 gdp_merchant_trade_opportunity.0123.a: "На этом рынке условия диктует покупатель…"
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$: Успех"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nКаким-то образом мы выбрались из этого гадюшника целыми и невредимыми, да ещё и с внушительной стопкой долговых обязательств, гарантирующих нам в будущем сезоне выгодные цены на продажу такого товара, как [trade_good_type.Custom('GetTradeGood')|l], на рынках владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]."
 gdp_merchant_trade_opportunity.0132.a: "На этом рынке условия диктует покупатель!"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: Провал"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nМы выбрались из этого гадюшника усталыми и измотанными, так и не добившись гарантии хорошей цены на продажу такого товара, как [trade_good_type.Custom('GetTradeGood')|l]. Конкуренты перебили наше предложение…"
 gdp_merchant_trade_opportunity.0133.a: "На этом рынке условия диктует продавец…"
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "Справедливо, что [task_contract_target.GetTitledFirstName] претендует на долю от продаж — в конце концов, [local_market.GetName|l] находится в [Select_CString(task_contract_target.IsFemale, 'её', 'его' )] вотчине, и именно [task_contract_target.GetSheHe] стоит здесь на страже закона и обеспечивает порядок.\n\nНо это не значит, что с [Select_CString(task_contract_target.IsFemale, 'ней', 'ним' )] нельзя #EMP договориться#!. Нужно лишь продемонстрировать, сколько пользы [Select_CString(task_contract_target.IsFemale, 'ей', 'ему' )] от наших торговых маршрутов, и дать понять, какую непосильную ношу [task_contract_target.GetSheHe] взваливает на наши бедные плечи…"
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: Успех"
 gdp_merchant_trade_opportunity.0142.desc: "Мы провели во дворце много дней, рассыпаясь в льстивых речах, уговаривая и убеждая. От деланных улыбок уже сводит скулы, но дело сделано: [task_contract_target.GetTitledFirstName] [Select_CString(task_contract_target.IsFemale, 'пошла', 'пошёл' )] на попятную.\n\nНам удалось добиться снижения пошлины и на какое-то время обеспечить себе дополнительную прибыль."
 gdp_merchant_trade_opportunity.0142.a: "Такова цена ведения дел."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: Провал"
 gdp_merchant_trade_opportunity.0143.desc: "Мы провели во дворце множество дней, рассыпаясь в льстивых речах, уговаривая и убеждая, — но всё было тщетно. От деланных улыбок уже сводило скулы, от поклонов разболелась спина, однако [task_contract_target.GetTitledFirstName] упорно не [Select_CString(task_contract_target.IsFemale, 'поддавалась', 'поддавался' )].\n\nСегодня стражники сухо сообщили, что их [Select_CString(task_contract_target.IsFemale, 'госпожа', 'господин' )] ничем не может нам помочь, и теперь [Select_CString(task_contract_target.IsFemale, 'её', 'его' )] ждут другие дела."
 gdp_merchant_trade_opportunity.0143.a: "[Select_CString(task_contract_target.IsFemale, 'Она же казалась такой сговорчивой', 'Он же казался таким сговорчивым' )]…"
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "[local_market.GetName] полон мытарей и сборщиков пошлин, с самодовольным видом снующих туда и сюда. Шакалы открыто посмеиваются над нами, а в кошелях у них позвякивают [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')|l], отобранные у честных торговцев, — таких, как [associate.GetFirstName] и я.\n\nПошлины, которые [Select_CString(owner.IsFemale, 'установила', 'установил' )] [owner.GetTitledFirstName], давно стали бичом здешней торговли. [owner.GetHerHis|U] алчность толкает нас на скользкую дорожку…"
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: Успех"
 gdp_merchant_trade_opportunity.0152.desc: "Приложив немало стараний, мы сумели наладить нужные контакты с местными проходимцами и обеспечили себе надёжные #EMP запасные#! пути для вывоза товаров.\n\nС каждой партией, покинувшей [trade_market.GetName|l] прямо под носом у ничего не подозревающей стражи, сэкономленные средства будут лишь прибавляться…"
 gdp_merchant_trade_opportunity.0152.a: "Это #EMP наши#! деньги."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: Провал"
 gdp_merchant_trade_opportunity.0153.desc: "[trade_market.GetName] оказался крепким орешком, любые попытки организовать здесь контрабандную сеть терпят крах — из-за нерадивости наших сообщников, из-за бдительности властей, из-за ненадёжности местных негодяев…\n\nВыхода нет, придётся платить и дальше. После всех стараний мы лишь испортили свою репутацию как честных посредников."
 gdp_merchant_trade_opportunity.0153.a: "Надо было просто заплатить пошлину…"
 gdp_merchant_trade_opportunity.1001.t: "Подмазывание"
 gdp_merchant_trade_opportunity.1001.desc: "Наши люди на [task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip|l]ой стороне в последнее время ведут дела с необычайной неохотой. Долго гадать о причинах не пришлось: за подобной переменой стоит [local_ruler.GetTitledFirstName|l] — [Select_CString(local_ruler.IsFemale, 'правительница', 'правитель')] этих земель.\n\nИ действительно, вскоре [Select_CString(local_ruler.IsFemale, 'сия благородная дама', 'сей благородный муж')] посылает к нам гонца с требованием #EMP «доли от вашего дела»#! в [Select_CString(local_ruler.IsFemale, 'её', 'его')] владениях…"
 gdp_merchant_trade_opportunity.1001.a: "#weak Чтоб [Select_CString(local_ruler.IsFemale, 'её', 'его')]#!… Пусть получит свои [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]."
 gdp_merchant_trade_opportunity.1001.b: "Столь #EMP высокочтимый#! ум наверняка сможет войти в наше положение."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip] [Select_CString(local_ruler.IsFemale, 'очарована', 'очарован')]"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip] [Select_CString(local_ruler.IsFemale, 'раздражена', 'раздражён')]"
 gdp_merchant_trade_opportunity.1001.c: "«Отмечу, что [other_merchant.GetPrimaryTitle.GetNameNoTooltip|l] позволяет себе определённые #EMP вольности#!»."
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] попадается на крючок"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] оскорбляется"
 gdp_merchant_trade_opportunity.1001.d: "Ничего, как-нибудь справимся."
 gdp_merchant_trade_opportunity.1011.t: "Взаимная щедрость"
 gdp_merchant_trade_opportunity.1011.desc: "Похоже, что нашими делами во владении [local_market.GetShortName] [Select_CString(local_ruler.IsFemale, 'заинтересовалась местная правительница', 'заинтересовался местный правитель')] — [local_ruler.GetTitledFirstName|l]. Представителей компании пригласили на личный приём.\n\nЯ прибываю на место, и [local_ruler.GetTitleAsNameNoTooltip] улыбается, увидев меня: «Торговля — это благо для всех! Для народа, для знати и вообще каждого, кому [local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] — родной дом! Поделитесь со мною своими печалями, и я постараюсь помочь, чем смогу»."
 gdp_merchant_trade_opportunity.1011.a: "#weak Кхм-кхм…#! «Ваше высокопреосвященство, перевозить товары по обычным маршрутам стало #EMP очень#! трудно…»"
 gdp_merchant_trade_opportunity.1011.b: "«Я считаю, [task_contract_location.Custom('GetRegionalMarketTerm')|l] в этих краях нуждается в обновлении»."
 gdp_merchant_trade_opportunity.1011.b.good: "Ваш совет оказался разумным"
 gdp_merchant_trade_opportunity.1011.b.bad: "Ваш совет оказался никудышным"
 gdp_merchant_trade_opportunity.1011.c: "«[other_merchant.GetPrimaryTitle.GetNameNoTooltip] сильно усложняет нам дела»."
 gdp_merchant_trade_opportunity.1011.c.fallback: "«Конкуренты сильно усложняют нам дела»."
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] занимает вашу сторону"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip] занимает сторону семейства [other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "Состязание в популярности, зависящее от показателей [diplomacy_i|E][Concept('diplomacy', 'дипломатии')|E] и [opinion_i|E][Concept('opinion', 'мнения')|E]"
 gdp_merchant_trade_opportunity.1011.d: "«Да славятся ваше имя и ваши дела во веки веков, о [Select_CString(local_ruler.IsFemale, 'великая', 'великий')] [local_ruler.GetTitleAsNameNoTooltip]»."
 gdp_merchant_trade_opportunity.1021.t: "Общий конкурент"
 gdp_merchant_trade_opportunity.1021.desc: "[target.GetPrimaryTitle.GetName] — место, где на каждом шагу поджидают неприятности и приходится постоянно крутиться. Именно поэтому меня застаёт врасплох незваный гость — [other_merchant.GetTitledFirstName|l] из владения [other_merchant.GetPrimaryTitle.GetName], ещё [Select_CString(other_merchant.IsFemale, 'одна соперница', 'один соперник')] в борьбе за [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] владения [local_market.GetShortName].\n\n«Приветствую, [ROOT.Char.GetTitledFirstNameNoTooltip]! — произносит [Select_CString(other_merchant.IsFemale, 'она', 'он')]. — Говорят, [target.GetTitledFirstName|l] из дома [target.GetHouse.GetNameNoTooltip] ставит тебе палки в колёса. Может, мы как-нибудь поможем друг другу?»"
 gdp_merchant_trade_opportunity.1021.a: "«С удовольствием! Значит, замысел такой…»"
 gdp_merchant_trade_opportunity.1021.b: "«Откуда мне знать, что тебе можно доверять?»"
 gdp_merchant_trade_opportunity.1021.b.good: "Вы приходите к согласию"
 gdp_merchant_trade_opportunity.1021.b.bad: "Вы доходите до конфликта"
 gdp_merchant_trade_opportunity.1021.c: "«Вместе мы здорово усложним жизнь соперникам»."
 gdp_merchant_trade_opportunity.1021.d: "«Ни за что! [other_merchant.GetHouse.GetNameNoTooltip] — семейка даже похуже!»"
 gdp_merchant_trade_opportunity.1031.t: "Профессиональный секрет"
 gdp_merchant_trade_opportunity.1031.desc: "Я перелистываю отчётные документы компании о деятельности во владении [task_contract_location.GetBaronyNameExplicitlyNoTooltip], как вдруг из книг вылетают несколько листов и с шелестом опускаются на землю. Наклонившись, чтобы подобрать их, я замечаю, что [Select_CString(associate.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] смотрит на меня мрачно и при этом боязливо.\n\nБыстренько просмотрев документы, я невольно приподнимаю бровь: понятно, откуда такая тревога. [associate.GetFirstNameNoTooltip] всё это время [Select_CString(associate.IsFemale, 'скрывала', 'скрывал')] от меня сведения, крайне необходимые при ведении дел! И всё это — просто в пику мне?"
 gdp_merchant_trade_opportunity.1031.a: "«Чёрт бы тебя побрал, [associate.GetFirstNameNoTooltip]! Как теперь тебе доверять?!»"
 gdp_merchant_trade_opportunity.1031.b: "«Ну, расскажи, что тебя не устраивает?»"
 gdp_merchant_trade_opportunity.1031.c: "«#EMP ВЫМЕТАЙСЯ!#! Больше ты здесь не работаешь!»"
 gdp_merchant_trade_opportunity.1041.t: "Семейные заслуги"
 gdp_merchant_trade_opportunity.1041.desc: "В компании царит воодушевление и не стихают разговоры о том, как замечательно у нас идут дела во владении [task_contract_location.GetBaronyNameExplicitlyNoTooltip]. Так получилось, что во главе каждого успешного предприятия стоит [Select_CString(associate.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName].\n\nИ хотя [Select_CString(associate.IsFemale, 'её', 'его')] превозносят как подлинного мастера торгового дела, в действительности наши успехи зиждутся на усилиях оставшихся неизвестными тружеников, объединённых связями дома [ROOT.Char.GetHouse.GetNameNoTooltip]."
 gdp_merchant_trade_opportunity.1041.a: "Ты молодец, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1041.b: "Что-то мы слишком мало тебя гоняем."
 gdp_merchant_trade_opportunity.1041.c: "Твоё прилежание — пример всем нам!"
 gdp_merchant_trade_opportunity.1051.t: "Улаживание вопроса"
 gdp_merchant_trade_opportunity.1051.desc: "[task_contract_location.Custom('GetRegionalMarketTermGloss')|U] — место, где порой случаются самые неожиданные встречи. Как, например, сегодняшняя: передо мной внезапно [Select_CString(target.IsFemale, 'возникла', 'возник')] [target.GetTitledFirstName|l] — [Select_CString(target.IsFemale, 'наша давняя', 'наш давний')] #L [target.GetPrimaryTitle.GetAdjective|l][Select_CString(target.IsFemale, 'ая', 'ий')]#! [Select_CString(target.IsFemale, 'соперница', 'конкурент')] собственной персоной! Впрочем, больше всего меня удивило [Select_CString(target.IsFemale, 'её', 'его')] отношение — в каком-то роде уважительное.\n\n«[ROOT.Char.GetTitledFirstNameNoTooltip|U], послушай, — вздыхает [Select_CString(target.IsFemale, 'она', 'он')]. — Скажу тебе прямо: наши интересы здесь расходятся, и если мы и дальше будем воевать, ничего хорошего не выйдет."
 gdp_merchant_trade_opportunity.1051.desc.gold: "Покинь этот рынок, и я щедро заплачу тебе за содействие»."
 gdp_merchant_trade_opportunity.1051.desc.luxury: "Покинь этот рынок, и взамен я дам тебе наводку на крайне интересную сделку в далёких землях»."
 gdp_merchant_trade_opportunity.1051.a: "«Твоя правда. Хорошо, пусть так и будет»."
 gdp_merchant_trade_opportunity.1051.b: "«Любопытное предложение… Думаю, мы сможем договориться»."
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip] уступает"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip] отказывается"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName] устроит [Concept('activity', 'занятие')|E] — #TOOLTIP:ACTIVITY_TYPE,activity_feast #L пир#!#! в вашу честь"
 gdp_merchant_trade_opportunity.1052.t: "Пир отменён"
 trade_opportunity_gain_luxury_contract_tt: "Вы получите [Concept('luxury_contract', 'эксклюзивный договор')|E]"
 gdp_merchant_trade_opportunity.1051.d: "«Ха, неужто дела идут #EMP настолько#! плохо? Ни за что»."
 gdp_merchant_trade_opportunity.1061.t: "На пределе"
 gdp_merchant_trade_opportunity.1061.desc: "[Select_CString(associate.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName|l] в последнее время жалуется, что из-за нашего стремления довести до конца дела во владении [task_contract_location.GetBaronyNameExplicitlyNoTooltip] падает ежедневный товарооборот, и от этого страдают [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l].\n\n«[ROOT.Char.GetTitleAsNameNoTooltip|U], послушай, чем-то придётся поступиться. Нельзя продолжать в том же духе и надеяться, что здесь всё останется гладко: нам не хватает времени и рабочих рук»."
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] не боится трудностей!"
 gdp_merchant_trade_opportunity.1061.a.good: "Всё останется по-прежнему"
 gdp_merchant_trade_opportunity.1061.a.bad: "Не утруждай себя понапрасну"
 gdp_merchant_trade_opportunity.1061.b: "Я прослежу, чтобы прибыль не падала."
 gdp_merchant_trade_opportunity.1061.already_tt: "Уже получено: [associate.GetShortUIName] #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! [Concept('stress', 'стресса')|E], #P +1#! [scheme_opportunity_i|E][Concept('scheme_opportunity_opportunity', 'возможность')|E] для [Concept('scheme', 'происков')|E]"
 gdp_merchant_trade_opportunity.1071.t: "Помеха"
 gdp_merchant_trade_opportunity.1071.desc: "[Select_CString(associate.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetTitledFirstName|l] раздражённо меряет шагами комнату, едва сдерживаясь, чтобы не прихлопнуть докучливую муху, — душевные силы и без того вот-вот сдадут. «А-а-а! — наконец рычит [Select_CString(associate.IsFemale, 'она', 'он')]. — Нет, [ROOT.Char.GetTitleAsNameNoTooltip|l], ну ты посмотри! [task_contract_location.GetBaronyNameExplicitlyNoTooltip] — это замечательно, только из-за тебя у меня почти не осталось никаких средств!»\n\nПробежавшись глазами по распискам и конторским книгам, я с неохотой соглашаюсь. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))|U] вздыхает: «Придётся нам как-то уступать друг другу, иначе наша контора просто не выдержит такой нагрузки»."
 gdp_merchant_trade_opportunity.1071.a: "Мы посвятили себя одной-единственной цели."
 gdp_merchant_trade_opportunity.1071.d: "Оставь этот вопрос мне и занимайся своими делами."
 gdp_merchant_trade_opportunity.1081.t: "В добрых руках"
 gdp_merchant_trade_opportunity.1081.desc: "Почти всеми нашими делами во владении [task_contract_location.GetBaronyNameExplicitlyNoTooltip] сегодня заведует [Select_CString(associate.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName|l] — и результаты не заставляют себя ждать! [associate.GetFirstName] — прирождённый купец; редко у кого встречается столь глубокое внимание к деталям и такая коммерческая жилка.\n\nМне даже почти не приходится проверять расписки или вмешиваться лично."
 gdp_merchant_trade_opportunity.1081.a: "Так держать, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1081.b: "Такие старания надо вознаградить."
 gdp_merchant_trade_opportunity.1081.c: "Пусть вся компания берёт пример!"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip] подаёт пример"
 gdp_merchant_trade_opportunity.1081.c.trigger: "Любой другой [Concept('associate', 'помощник')|E] с навыком [stewardship_i|E][EmptyScope.ScriptValue('medium_skill_rating')|V0]"
 gdp_merchant_trade_opportunity.1081.c.tt: "Навык [Concept('stewardship', 'управления')|E] другого [Concept('associate_possessive', 'помощника')|E] увеличивается на [stewardship_i|E]#P 1#!"
 gdp_merchant_trade_opportunity.1081.d: "Нет семейства лучше, чем [ROOT.Char.GetHouse.GetNameNoTooltip]."
 gdp_merchant_trade_opportunity.1091.t: "Плохая помощь"
 gdp_merchant_trade_opportunity.1091.desc: "[Select_CString(associate.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName|l] [Select_CString(associate.IsFemale, 'взяла', 'взял')] управление нашими делами во владении [task_contract_location.GetBaronyNameExplicitlyNoTooltip] на себя, и теперь я горько жалею об этом.\n\nКаждый день меня чем-то неприятно удивляет: вчера не сошлись суммы, сегодня мне жалуется клиент, которому забыли послать весточку… Нельзя относиться к работе настолько беспечно!"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], давай-ка изучим с тобой отчётность."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip] кое-чему [Select_CString(associate.IsFemale, 'научилась', 'научился')]"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip] совершенно [Select_CString(associate.IsFemale, 'безнадёжна', 'безнадёжен')]"
 gdp_merchant_trade_opportunity.1091.c: "Кому-то придётся взять эту работу на себя."
 gdp_merchant_trade_opportunity.1091.d: "По крайней мере, [Select_CString(associate.IsFemale, 'она', 'он')] старается."
 gdp_merchant_trade_opportunity.1101.t: "Первоначальный капитал"
 gdp_merchant_trade_opportunity.1101.desc: "Для тех, у кого водятся лишние [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] и кому хватает терпения, выдача займов может стать весьма выгодным предприятием. Так вышло, что некий потенциальный инвестор просит меня о встрече во владении [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nПо прибытии меня приветствует [investor.GetTitledFirstName|l] —"
 gdp_merchant_trade_opportunity.1101.ruler: "[Select_CString(investor.IsFemale, 'правительница', 'правитель')], [Select_CString(investor.IsFemale, 'которой', 'которому')] подчиняется [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.1101.courtier: "[Select_CString(investor.IsFemale, 'придворная', 'придворный')] какого-то местного аристократа."
 gdp_merchant_trade_opportunity.1101.adventurer: "очевидно, человек мира; вокруг столпились [Select_CString(investor.IsFemale, 'её', 'его')] последователи."
 gdp_merchant_trade_opportunity.1101.fallback: "[investor.GetWomanMan|l] невнятного происхождения."
 gdp_merchant_trade_opportunity.1101.end: "«Приветствую, [ROOT.Char.GetTitledFirstNameNoTooltip]! — широко улыбается [investor.GetSheHe]. — Я желаю профинансировать [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]ие деловые предприятия. Спросите, чего я хочу взамен? Сейчас вам не стоит об этом беспокоиться»."
 gdp_merchant_trade_opportunity.1101.a: "Можете на нас положиться, [investor.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.1101.c: "Добавьте ещё чуть-чуть — и тогда вы не пожалеете, клянусь честью."
 gdp_merchant_trade_opportunity.1101.d: "Мне приятны ваши слова, однако сейчас мы стараемся обходиться без излишеств."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName] вернётся, чтобы забрать [gold_i|E][interest|0V] (#M ставка 20%#!), через #V 5 лет#!"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "Я желаю получить проценты с тех средств, что были мною вложены в вашу достойнейшую торговую компанию.\n\nЕсли вас не затруднит, я предпочитаю [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]."
 gdp_merchant_trade_opportunity.1102.a: "Пожалуйста, ваши средства. Пусть они сослужат вам добрую службу."
 gdp_merchant_trade_opportunity.1102.b: "Э-э, понимаете ли, [investor.GetFirstNameNoTooltip]… Дела у нас идут не так гладко, как хотелось бы…"
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip] благосклонно относится к вашим оправданиям"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip] чует подвох"
 gdp_merchant_trade_opportunity.1102.d: "Вы не вкладывали в нашу компанию никаких средств."
 gdp_merchant_trade_opportunity.9000.t: "Важные дела во владении [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9000.desc: "Хотя мы уже решили некоторые вопросы, у нас ещё есть незаконченные дела на рынке [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName].\n\nСтоит ли отправляться обратно во владение [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] или лучше задержаться здесь и сперва уладить все наши проблемы?"
 gdp_merchant_trade_opportunity.9000.a: "Кто-то должен этим заняться."
 gdp_merchant_trade_opportunity.9000.b: "Давайте сначала разберёмся с делами."
 gdp_merchant_trade_opportunity.9000.c: "Я лично займусь этим вопросом."
 gdp_merchant_trade_opportunity.9000.d: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] не может ждать."
 gdp_merchant_trade_opportunity.9000.accept_tt: "Контракт «[THIS.TaskContract.GetType.GetName|V]» во владении [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly]: вы принимаете от персонажа [THIS.TaskContract.GetEmployer.GetUIName] [Concept('trade_opportunity', 'торговую возможность')|E] [THIS.TaskContract.GetTaskContractTierValue|V] [Concept('trade_opportunity_tier_tier', 'уровня')|E]"
 gdp_merchant_trade_opportunity.9010.t: "Торговая возможность: [task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "Во владении [task_contract_location.GetBaronyNameExplicitly] есть важное дело, связанное с деятельностью компании."
 gdp_merchant_trade_opportunity.9010.intro: "Здесь, во владении [task_contract_location.GetBaronyNameExplicitly], есть важное дело, связанное с деятельностью компании."
 gdp_merchant_trade_opportunity.9010.desc: "Мне стоит временно передать свои обязанности помощникам до тех пор, пока я не вернусь.\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "Мой [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName] вполне может справиться с этим делом, пока я решаю другие вопросы."
 gdp_merchant_trade_opportunity.9010.partner_busy: "К сожалению, мой [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName] уже [Select_CString(partner.IsFemale, 'занята', 'занят')] другой работой. Вероятно, мне всё же придётся взять это дело под свой контроль…"
 gdp_merchant_trade_opportunity.9010.candidate: "Нужно поскорее найти человека, которому можно доверить столь серьёзное дело, иначе мне придётся уладить его [Select_CString(ROOT.Char.IsFemale, 'самой', 'самому' )]."
 gdp_merchant_trade_opportunity.9010.no_partner: "К сожалению, мне некому доверить столь серьёзное дело, поэтому мне придётся уладить его [Select_CString(ROOT.Char.IsFemale, 'самой', 'самому' )]."
 gdp_merchant_trade_opportunity.9010.a: "Нельзя терять время."
 gdp_merchant_trade_opportunity.9010.c: "[partner.GetFirstNameNoTooltip] знает, что делать."
 gdp_merchant_trade_opportunity.9010.c.no_partner: "Мой партнёр со всем разберётся."
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUIName] уже реализует эту [Concept('trade_opportunity', 'торговую возможность')|E]"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "Ваш партнёр уже реализует другую [Concept('trade_opportunity', 'торговую возможность')|E]"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "Партнёру поручена реализация [Concept('trade_opportunity', 'торговой возможности')|E] по вашему контракту «[task_contract.GetType.GetName|V]»"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M Партнёр будет недоступен до выполнения [Concept('task_contract', 'контракта')|E]#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M Шанс успеха зависит от [Concept('aptitude', 'пригодности')|E] этого персонажа ([THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )] )#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon! #X Если этот персонаж перестанет быть вашим #L [GetCourtPositionType('partner_court_position').GetName|l]ом#!, контракт будет провален#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "Персонажу [THIS.Char.GetShortUIName|U] поручена реализация [Concept('trade_opportunity', 'торговой возможности')|E] по вашему контракту «[task_contract.GetType.GetName]» во владении [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.d: "Возможно, [candidate.GetFirstNameNoTooltip] справится с этой задачей."
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "Наверняка есть кто-то, способный справиться с этой задачей."
 gdp_merchant_trade_opportunity.9010.d.tt: "У вас есть [Concept('associates', 'помощники')|E], которые:\n$EFFECT_LIST_BULLET$не являются [Concept('traders', 'приказчиками')|E]\n$EFFECT_LIST_BULLET$могут стать вашими #L [GetCourtPositionType('partner_court_position').GetName|l]ами#!"
 gdp_merchant_trade_opportunity.9010.e: "Забудем об этом. У меня есть более важные заботы."
 gdp_merchant_trade_opportunity.9010.e.tt: "[Concept('task_contract', 'Контракт')|E] будет отклонён"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "Вы сразу отправляетесь в [Concept('traveling', 'путешествие')|E]. Пункт назначения: [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.tt.start: "Вы сразу приступаете к выполнению [Concept('task_contract', 'контракта')|E]"
 gdp_merchant_trade_opportunity.9020.t: "Торговая возможность: [task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9020.intro: "Мой [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName] наконец-то [Select_CString(partner.IsFemale, 'вернулась', 'вернулся' )] из владения [task_contract_location.GetBaronyNameExplicitly] с вестями о результатах своей работы.\n\n"
 gdp_merchant_trade_opportunity.9020.success: "[Select_CString(partner.IsFemale, 'Она', 'Он' )] с радостью рассказывает о том, как ему удалось ловко решить проблему вопреки множеству трудностей. Этим [Select_CString(partner.IsFemale, 'она не только проявила', 'он не только проявил' )] себя, но и [Select_CString(partner.IsFemale, 'принесла', 'принёс' )] нашей компании большую пользу."
 gdp_merchant_trade_opportunity.9020.failure: "[Select_CString(partner.IsFemale, 'Она', 'Он' )] с неохотой признаёт, что задача оказалась гораздо сложнее, чем предполагалось. Несмотря на все [Select_CString(partner.IsFemale, 'её', 'его' )] старания, наша компания понесла убытки…"
 gdp_merchant_trade_opportunity.9020.a.success: "Ты молодец, [partner.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.9020.a.failure: "Мне стоило взять всё в свои руки…"
 gdp_merchant_trade_opportunity.9050.t: "Упущенная возможность"
 gdp_merchant_trade_opportunity.9050.desc_opening: "Наши перспективные планы сорвались.\n\nТорговая возможность во владении [trade_destination.GetBaronyNameExplicitlyNoTooltip], ради которой и затевалось наше путешествие, от нас ускользнула."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\nТеперь вопрос лишь в том, стоит ли нам продолжать поездку после такой тяжёлой неудачи."
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "Торговый путь, от которого зависела потенциальная сделка, больше не существует."
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_opportunity_route.GetName] больше не проходит через владение [trade_destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "[trade_opportunity_route.GetName] больше не обслуживается приказчиком, от которого зависела эта возможность."
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "Как оказалось, беспорядки закончились сами собой, и [trade_opportunity_route.GetName] снова в безопасности."
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "Поскольку мы больше не считаем себя ремесленниками, будет называть себя таковыми при ведении дел."
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "Поскольку мы больше не считаем себя ростовщиками, будет называть себя таковыми при ведении дел."
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "Со слов проходящих торговцев, компания наших соперников свернула свою деятельность."
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "Похоже, перевалочный пункт, к которому мы следовали, более нам недоступен."
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "В настоящий момент мы больше не платим пошлины, с которыми мы собирались разобраться."
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "Как это часто бывает в непостоянных ситуациях, шёлковый путь уже не тот, каким он был, когда мы начинали своё путешествие. Мы утратили возможность повлиять на него."
 gdp_merchant_trade_opportunity.9050.reason_unknown: "Неясно, что изменилось за это время."
 gdp_merchant_trade_opportunity.9050.a: "Нам больше нечего здесь делать."
 gdp_merchant_trade_opportunity.9050.b: "Посмотрим, что ещё [trade_destination.GetBaronyNameExplicitlyNoTooltip] может нам предложить."
 gdp_merchant_trade_opportunity.9050.b.tt: "Продолжить путешествие и по прибытии #weak посетить владение [trade_destination.GetBaronyNameExplicitly]#!"
 gdp_merchant_trade_opportunity.9050.toast: "Торговая возможность во владении [trade_destination.GetBaronyNameExplicitlyNoTooltip] упущена"
 gdp_merchant_trade_opportunity.9050.toast_route_destroyed: "Торговый путь во владении [trade_destination.GetBaronyNameExplicitlyNoTooltip] уничтожен"
 gdp_merchant_trade_opportunity.9050.toast_desc_route_destroyed: "[Concept('trade_route', 'Торговый путь')|E] этой [Concept('trade_opportunity', 'возможности')|E] больше не существует"
 gdp_merchant_trade_opportunity.9050.toast_desc_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] больше не является [Concept('market', 'рынком')|E], через который проходит [trade_opportunity_route.GetName]."
 gdp_merchant_trade_opportunity.9050.toast_desc_trader_changed: "[trade_opportunity_route.GetName] теперь без [Concept('trader', 'приказчика')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_upheaval_ended: "[trade_opportunity_route.GetName] больше не проходит через [Concept('market', 'рынок')|E], страдающий от мятежа"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_artisan: "У вашей [Concept('company', 'компании')|E] больше нет [Concept('company_purpose', 'специализации')|E] «[GetLaw('company_purpose_artisan').GetName]»"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_creditor: "У вашей [Concept('company', 'компании')|E] больше нет [Concept('company_purpose', 'специализации')|E] «[GetLaw('company_purpose_creditor').GetName]»"
 gdp_merchant_trade_opportunity.9050.toast_desc_competitor_gone: "Соперничающее [Concept('merchant_family', 'торговое семейство')|E] больше не возглавляет [Concept('company', 'компанию')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_charter_gone: "У вашего конкурента больше нет [Concept('charter', 'хартии')|E] [Concept('merchant_patron', 'покровителя')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_entrepot_gone: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] более не имеет [Concept('entrepot_district', 'складского района')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_tolls_ended: "Вы больше не платите [Concept('tolls', 'пошлины')|E] во владении [trade_destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9050.toast_desc_silk_road: "Вы больше не участвуете в торговле на [Concept('silk_road', 'шёлковом пути')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_imprisoned: "Вы [Concept('imprisoned', 'в заключении')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_incapable: "Вы #TOOLTIP:GAME_TRAIT,incapable, #L недееспособны#!#!"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_government: "У вас больше нет [Concept('merchant', 'торговой')|E] [Concept('government', 'формы правления')|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_unknown: "Требования это [Concept('trade_opportunity', 'торговой возможности')|E] больше не выполняются"
