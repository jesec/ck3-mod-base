l_russian:
 #Side Switch Scheme
 gg_switch_sides: "Склонить к дезертирству"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] вскоре поймёт #EMP правильный#! взгляд на ситуацию..."
 gg_switch_sides_desc_general: "[Concept('scheme', 'Происки')|E] «$gg_switch_sides$» — [Concept('political_scheme','политические происки')|E], цель которых — убедить [Concept('scheme_target', 'цель')|E] сменить сторону в [Concept('situation', 'ситуации')|E] «[guelph_ghibelline_situation|E]»"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] присоединяется к #L [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]ам#!"
 gg_switch_sides_invalidated_title: "@scheme_icon! Происки «$gg_switch_sides$» завершаются"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (происки)#!"
 gg_switch_sides_action: "Уговорить"
 scheme_interaction_tt_gg_switch_sides: "Попытаться уговорить персонажа [recipient.GetShortUINameNoTooltip] присоединиться к #L [actor.Custom('GetGuelphGhibellineConcept')|l]ам#!"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip] до сих пор [Select_CString(recipient.IsFemale, 'недовольна', 'недоволен')] из-за вашего предложения стать #L [actor.Custom('GetGuelphGhibellineConcept')|l]ом#!"
 #Claim Leadership Scheme
 gg_claim_leadership: "Захватить лидерство"
 gg_claim_leadership_desc: "[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')] вскоре поймут, кто лучше всего годится на роль их лидера"
 gg_claim_leadership_desc_general: "[Concept('scheme', 'Происки')|E] «$gg_claim_leadership$» — [Concept('political_scheme','политические происки')|E], цель которых — сделать [Concept('scheme_owner', 'интригана')|E] лидером своей стороны в [Concept('situation', 'ситуации')|E] «[guelph_ghibelline_situation|E]». Это [Concept('secret_scheme', 'тайные происки')|E], основанные на [Concept('diplomacy', 'дипломатии')|E]. К ним можно привлекать [Concept('agents', 'соучастников')|E].\n\nЧем выше [Concept('gg_involvement', 'вовлечённость')|E] [Concept('scheme_owner', 'интригана')|E] в сравнении с нынешним лидером, тем выше [Concept('scheme_success_chance', 'шанс на успех происков')|E]. Более высокий [Concept('prestige_level', 'уровень репутации')|E] также помогает."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'становитесь', 'становится')] новым лидером #L [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]ов#!"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "Вы избегаете потери [Concept('prestige', 'престижа')|E] и ухудшения отношений с персонажем [TARGET_CHARACTER.GetShortUIName]"
 gg_claim_leadership_invalidated_title: "@scheme_icon! Происки «$gg_claim_leadership$» завершаются"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (происки)#!"
 gg_claim_leadership_action: "Захватить лидерство"
 scheme_interaction_tt_gg_claim_leadership: "Попытаться захватить лидерство #L [recipient.Custom('GetGuelphGhibellineConcept')|l]ов#! у персонажа [recipient.GetShortUIName]"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "Поддержать колеблющихся"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] станет симпатизировать [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')|l]ам"
 gg_align_undecided_desc_general: "[Concept('scheme', 'Происки')|E] «$gg_align_undecided$» — [Concept('political_scheme','политические происки')|E], цель которых — принудить [Concept('scheme_target', 'цель')|E] поддержать сторону [Concept('scheme_owner', 'интригана')|E] в [Concept('situation', 'ситуации')|E] «[guelph_ghibelline_situation|E]»"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] становится #L [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]ом#!"
 gg_align_undecided_invalidated_title: "@scheme_icon! Происки «$gg_align_undecided$» завершаются"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (происки)#!"
 gg_align_undecided_action: "Привлечь"
 scheme_interaction_tt_gg_align_undecided: "Попытаться привлечь персонажа [recipient.GetShortUIName] на сторону #L [actor.Custom('GetGuelphGhibellineConcept')|l]ов#!"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "Заменить правителя"
 gg_replace_ruler_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] больше нам не требуется — стоит заменить [Select_CString(SCHEME.GetTargetCharacter.IsFemale, 'её', 'его')] кем-то более… #EMP рациональным#!."
 gg_replace_ruler_desc_general: "[Concept('scheme', 'Происки')|E] «$gg_replace_ruler$» — [Concept('political_scheme','политические происки')|E], цель которых — заменить [Concept('scheme_target', 'цель')|E] на правителя, верного стороне [Concept('scheme_owner', 'интригана')|E] в [Concept('situation', 'ситуации')|E] «[guelph_ghibelline_situation|E]»"
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale, 'заменена', 'заменён')] на лоялиста #L [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]а#!"
 GG_REPLACE_RULER_DISCOVERY_DESC: "Вы избегаете потери [Concept('prestige', 'престижа')|E] и ухудшения отношений с персонажем [TARGET_CHARACTER.GetShortUIName]"
 gg_replace_ruler_invalidated_title: "@scheme_icon! Происки «$gg_replace_ruler$» завершаются"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (происки)#!"
 gg_replace_ruler_action: "Заменить"
 scheme_interaction_tt_gg_replace_ruler: "Попытаться заменить персонажа [recipient.GetShortUIName] лояльным #L [actor.Custom('GetGuelphGhibellineConcept')|l]ом#!"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip] до сих пор [Select_CString(recipient.IsFemale, 'недовольна', 'недоволен')] после вашей недавней попытки заменить [Select_CString(recipient.IsFemale, 'её', 'его')]"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "Нельзя заменить лидера стороны «[GetSituation('guelph_ghibelline').GetName]», пока действует [situation_phase_phase|El] «[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]»"
 #Invalidation
 scheme_gg_situation_ended: "[Concept('guelph_ghibelline_situation', 'Ситуация «Гвельфы и гибеллины»')|E] завершилась"
 scheme_owner_not_aligned: "Вы больше не [Concept('guelph', 'гвельф')|E] и не [Concept('ghibelline', 'гибеллин')|E]"
 scheme_target_not_aligned: "[target.GetShortUIName] больше не [Concept('guelph', 'гвельф')|E] и не [Concept('ghibelline', 'гибеллин')|E]"
 scheme_target_not_undecided: "[target.GetShortUIName] больше не [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'undecided' ).GetName|l]"
 scheme_owner_not_in_gg_situation: "Вы больше не участвуете в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]»"
 scheme_target_not_in_gg_situation: "[target.GetShortUIName] больше не участвует в [Concept('situation', 'ситуации')|E] «[GetSituation('guelph_ghibelline').GetName]»"
 scheme_target_already_your_side: "[target.GetShortUIName] уже [target.Custom('GetGuelphGhibellineConcept')|l]"
 scheme_target_is_titleless: "[target.GetShortUIName] больше не владеет титулами"
 scheme_target_might_get_displaced: "[target.GetShortUIName] — главный защитник в [Concept('war', 'войне')|E] «[GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V]»"
 scheme_target_might_get_reinstated: "[target.GetShortUIName] — главный защитник в [Concept('war', 'войне')|E] «[GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|V]»"
 scheme_owner_is_already_leader: "Вы уже лидер #L [owner.Custom('GetGuelphGhibellineConcept')|l]ов#!"
 scheme_target_no_longer_gg_leader: "[target.GetShortUIName] больше не лидер движения «[owner.Custom('GetGuelphsGhibellinesConcept')]»"
