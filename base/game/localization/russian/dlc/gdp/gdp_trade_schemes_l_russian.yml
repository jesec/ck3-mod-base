l_russian:
 gdp_improve_trade_capacity: "Улучшить торговый потенциал"
 gdp_improve_trade_capacity_action: "Улучшить торговый потенциал"
 gdp_improve_trade_capacity_desc: "Мои люди ищут возможности улучшить потенциал моих торговых путей."
 gdp_improve_trade_capacity_desc_general: "«Улучшить торговый потенциал» — это [Concept('trade_scheme', 'торговые происки')|E], в ходе которых [Concept('merchant', 'торговец')|E] или [Concept('patrician', 'патриций')|E] поручает своим людям увеличить [Concept('trade_route_capacity', 'потенциал')|E] одного из своих [Concept('trade_routes', 'торговых путей')|E]."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "[Concept('capacity', 'Потенциал')|E] выбранного [Concept('trade_route', 'торгового пути')|E] повысится на #V 15 лет#!"
 gdp_improve_trade_capacity_invalidated_title: "@scheme_icon! Происки «$gdp_improve_trade_capacity$» завершаются"
 gdp_improve_trade_competitiveness: "Улучшить конкурентоспособность"
 gdp_improve_trade_competitiveness_action: "Улучшить конкурентоспособность"
 gdp_improve_trade_competitiveness_desc: "Мои люди ищут возможности повысить конкурентное преимущество моих торговых путей над прочими."
 gdp_improve_trade_competitiveness_desc_general: "«Улучшить конкурентоспособность» — это [Concept('trade_scheme', 'торговые происки')|E], во время которых [Concept('merchant', 'торговец')|E] или [Concept('patrician', 'патриций')|E] поручает своим людям поработать над увеличением [Concept('trade_competitiveness', 'конкурентоспособности')|E] одного из его [Concept('trade_routes', 'торговых путей')|E]."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "[Concept('competitiveness', 'Конкурентоспособность')|E] выбранного [Concept('trade_route', 'торгового пути')|E] повысится на #V 15 лет#!"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! Происки «$gdp_improve_trade_competitiveness$» завершаются"
 gdp_improve_trade_expertise: "Улучшить познания в торговле"
 gdp_improve_trade_expertise_action: "Улучшить познания в торговле"
 gdp_improve_trade_expertise_desc: "Мои люди ищут возможности улучшить эффективность нашей работы на торговых путях, чтобы мы все знали правильных людей и учились на своих ошибках."
 gdp_improve_trade_expertise_desc_general: "«Улучшить познания в торговле» — это [Concept('trade_scheme', 'торговые происки')|E], во время которых [Concept('merchant', 'торговец')|E] или [Concept('patrician', 'патриций')|E] поручает своим людям поработать над скоростью роста [Concept('trade_expertise', 'познаний в торговле')|E] на одном из его [Concept('trade_routes', 'торговых путей')|E]."
 GDP_IMPROVE_TRADE_EXPERTISE_SUCCESS_DESC: "[Concept('expertise', 'Познания')|E] на выбранном [Concept('trade_route', 'торговом пути')|E] растут быстрее в течение #V 15 лет#!"
 gdp_improve_trade_expertise_invalidated_title: "@scheme_icon! Происки «$gdp_improve_trade_expertise$» завершаются"
 GDP_IMPROVE_TRADE_ROUTES_STAFFED_ROUTES_DESC: "[Concept('trade_routes', 'Торговые пути')|E] с [Concept('trader', 'приказчиком')|E]: $VALUE|+=0$"
 GDP_IMPROVE_TRADE_ROUTES_ESTABLISHED_ROUTES_DESC: "Давно налаженные [Concept('trade_routes', 'торговые пути')|E]: $VALUE|+=0$"
 gdp_improve_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName] больше не владеет [Concept('trade_routes', 'торговыми путями')|E]"
 gdp_improve_trade_routes_owner_has_no_routes: "[owner.GetShortUIName] больше не владеет ни одним [Concept('trade_route', 'торговым путём')|E], который можно было бы улучшить"
 gdp_improve_trade_routes_needs_route_tt: "У вас есть хотя бы один [Concept('trade_route', 'торговый путь')|E]"
 gdp_improve_trade_routes_focused_route_gone: "[Concept('trade_route', 'Торговый путь')|E], над которым [owner.GetShortUIName] [Select_CString(owner.IsLocalPlayer, 'хотели', Select_CString(owner.IsFemale, 'хотела', 'хотел'))] поработать, больше не существует"
 gdp_improve_trade_capacity_decision_success_tt: "В случае успеха [Concept('scheme', 'происков')|E] [selected_item.GetName|l] получит модификатор «[GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip]» на #V 15 лет#!"
 gdp_improve_trade_competitiveness_decision_success_tt: "В случае успеха [Concept('scheme', 'происков')|E] [selected_item.GetName|l] получит модификатор «[GetModifier('gdp_improve_trade_routes_competitiveness_modifier').GetNameWithTooltip]» на #V 15 лет#!"
 gdp_improve_trade_expertise_decision_success_tt: "В случае успеха [Concept('scheme', 'происков')|E] [selected_item.GetName|l] получит модификатор «[GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip]» на #V 15 лет#!"
 gdp_improve_trade_routes_capacity_modifier: "Улучшенная логистика"
 gdp_improve_trade_routes_competitiveness_modifier: "Укоренившиеся интересы"
 gdp_improve_trade_routes_expertise_modifier: "Бывалые приказчики"
 gdp_improve_trade_capacity_decision: "Торговые происки: потенциал"
 gdp_improve_trade_capacity_decision_desc: "Я знаю, что из-за нехватки места наши торговцы просто не могут увезти все товары, которые хотят. Стоит вложить средства и внести необходимые изменения — и со временем мы сможем расширить своё присутствие на всех рынках, которые посещаем."
 gdp_improve_trade_capacity_decision_tooltip: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('gdp_improve_trade_capacity').GetTypeName]» на выбранном [Concept('trade_route', 'торговом пути')|E]"
 gdp_improve_trade_capacity_decision_confirm: "Найдём больше людей и места."
 gdp_improve_trade_capacity_decision_effect_tt: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('gdp_improve_trade_capacity').GetTypeName]», выбрав целью [selected_item.GetName|l]"
 gdp_improve_trade_competitiveness_decision: "Торговые происки: конкурентоспособность"
 gdp_improve_trade_competitiveness_decision_desc: "На некоторых рынках, куда регулярно наведываются мои торговцы, конкуренция особенно ожесточённая. Но стоит дать пару взяток и договориться с местными — и тогда именно моим торговцам будут отдавать предпочтение."
 gdp_improve_trade_competitiveness_decision_tooltip: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('gdp_improve_trade_competitiveness').GetTypeName]» на выбранном [Concept('trade_route', 'торговом пути')|E]"
 gdp_improve_trade_competitiveness_decision_confirm: "Добьёмся более радушного приёма."
 gdp_improve_trade_competitiveness_decision_effect_tt: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('gdp_improve_trade_competitiveness').GetTypeName]», выбрав целью [selected_item.GetName|l]"
 gdp_improve_trade_expertise_decision: "Торговые происки: познания"
 gdp_improve_trade_expertise_decision_desc: "Торговцы сообщают, что на некоторых маршрутах мы раз за разом наступаем на одни и те же грабли. Пора извлечь уроки и наладить торговые пути так, чтобы они работали с максимальной отдачей."
 gdp_improve_trade_expertise_decision_tooltip: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('gdp_improve_trade_expertise').GetTypeName]» на выбранном [Concept('trade_route', 'торговом пути')|E]"
 gdp_improve_trade_expertise_decision_confirm: "Проделаем работу над ошибками."
 gdp_improve_trade_expertise_decision_effect_tt: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('gdp_improve_trade_expertise').GetTypeName]», выбрав целью [selected_item.GetName|l]"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$: успех"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U] наконец работает так, как и должно было быть с самого начала. Купцы докладывают, что теперь мы перевозим больше товаров — именно на это и был расчёт."
 gdp_trade_scheme.0002.a: "Стоило потраченных денег."
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: провал"
 gdp_trade_scheme.0003.desc: "Несмотря на все мои старания, на торговом пути никаких изменений. Это выводит меня из себя, но так уж иногда устроен рынок."
 gdp_trade_scheme.0003.a: "Пора снова браться за счётные книги."
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: успех"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U] наконец приносит ожидаемую прибыль. Моим купцам отдают предпочтение перед конкурентами, и теперь мы зарабатываем куда больше прежнего."
 gdp_trade_scheme.0004.a: "Мы хорошо распорядились одолжениями."
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$: успех"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U] теперь работает куда эффективнее, чем раньше, и количество ошибок тоже сократилось. Эти уроки станут фундаментом для будущего процветания моего дома."
 gdp_trade_scheme.0005.a: "И я построю состояние на этом фундаменте."
 gdp_disrupt_trade_routes: "Нарушить торговые пути"
 gdp_disrupt_trade_routes_action: "Нарушить торговые пути:"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName] торгует на моих рынках. Достаточно дать пару взяток нужным людям и пустить слухи — и один из [Select_CString(SCHEME.GetTargetCharacter.IsFemale, 'её', 'его')] [Concept('trade_routes', 'торговых путей')|E] будет разорён."
 gdp_disrupt_trade_routes_desc_general: "$gdp_disrupt_trade_routes$ — это [Concept('hostile_scheme', 'враждебные происки')|E], во время которых [Concept('merchant', 'торговец')|E] или [Concept('patrician', 'патриций')|E] старается подорвать сеть [Concept('trade_route', 'торговых путей')|E] своего соперника. Они основываются на навыке [Concept('intrigue', 'интриг')|E] и позволяют нанимать [Concept('agents', 'соучастников')|E]."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "Один из [Concept('trade_routes', 'торговых путей')|E] персонажа [TARGET_CHARACTER.GetShortUIName] нарушается на #N 20 лет#!"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "Ваше участие в попытке нарушить [Concept('trade_routes', 'торговые пути')|E] соперника осталось нераскрытым"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "У вас с персонажем [target.GetShortUIName] общий [Concept('trade_market', 'рынок')|E]: $VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! Происки «$gdp_disrupt_trade_routes$» завершаются"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName] больше не владеет [Concept('trade_routes', 'торговыми путями')|E]"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUIName] больше не владеет [Concept('trade_routes', 'торговыми путями')|E]"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUIName] больше не владеет ни одним [Concept('trade_route', 'торговым путём')|E], который можно было бы нарушить"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName] владеет хотя бы одним [Concept('trade_route', 'торговым путём')|E]"
 gdp_disrupt_trade_routes_capacity_modifier: "Нарушенная логистика"
 gdp_disrupt_trade_routes_competitiveness_modifier: "Подпорченная репутация"
 gdp_disrupt_trade_routes_discovered_opinion: "Нарушение моих торговых путей"
 gdp_disrupt_trade_routes_target_notification: "[disrupted_trade_route.GetName]: проблемы"
 gdp_disrupt_trade_routes_target_notification_tt: "На одном из моих [Concept('trade_routes', 'торговых путей')|E] возникли какие-то проблемы. Мои приказчики не могут сказать, что именно пошло не так."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "Один из моих [Concept('trade_routes', 'торговых путей')|E] испытывает трудности, и приказчики выяснили, что за этим стоит [owner.GetShortUIName]."
 gdp_disrupt_trade_routes_target_caught_notification: "Вредительство раскрыто"
 gdp_disrupt_trade_routes_target_caught_tt: "На одном из моих [Concept('trade_routes', 'торговых путей')|E] поймали человека, которого [Select_CString(owner.IsFemale, 'подослала', 'подослал')] [owner.GetShortUIName]. Он выложил всё, что ему приказали сделать."
 start_gdp_disrupt_trade_routes_interaction: "$gdp_disrupt_trade_routes$ #weak (происки)#!"
 start_gdp_disrupt_trade_routes_notification: "$gdp_disrupt_trade_routes$"
 scheme_interaction_tt_gdp_disrupt_trade_routes_approved: "Тайно нарушить работу одного из [Concept('trade_routes', 'торговых путей')|E], которыми владеет [recipient.GetShortUIName]"
 gdp_disrupt_trade_routes_effect_tt: "В случае успеха один из [Concept('trade_routes', 'торговых путей')|E] персонажа [recipient.GetShortUIName] нарушается на #N 20 лет#!"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_balance: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_overseer' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_success: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_shill' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_speed: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_overseer' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_messenger' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 start_gdp_disrupt_trade_routes_interaction.tt.agent_focus_secrecy: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_alibi' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_thief' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_bookkeeper' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]"
 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$: успех"
 gdp_trade_scheme.0012.desc_capacity: "Теперь [disrupted_trade_route.GetName] не сможет перевозить столько товаров, сколько прежде. А [target.GetShortUIName] пусть гадает, откуда в [Select_CString(target.IsFemale, 'её', 'его')] счетах образовалась эта дыра."
 gdp_trade_scheme.0012.desc_competitiveness: "Теперь [disrupted_trade_route.GetName] не будет обладать прежними привилегиями и преимуществами на рынках. [target.GetShortUIName] быстро заметит, как трудно стало получать прибыль."
 gdp_trade_scheme.0012.desc_discovered: "\n\nОднако одного из моих людей поймали, и теперь след может привести ко мне."
 gdp_trade_scheme.0012.a: "Удачи [Select_CString(target.IsFemale, 'этой', 'этому')] тупице."
 gdp_trade_scheme.0012.a_discovered: "Оно того стоило."
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$: провал"
 gdp_trade_scheme.0013.desc: "Несмотря на все мои попытки, [target.GetShortUIName] и [Select_CString(target.IsFemale, 'её', 'его')] торговые пути управляются ничуть не хуже прежнего."
 gdp_trade_scheme.0013.desc_discovered: "\n\nДа ещё и одного из моих приказчиков поймали за грязной работёнкой. Это настоящий позор для моего дома."
 gdp_trade_scheme.0013.a: "Я в бешенстве!"
 gdp_destroyed_republic_opinion: "Уничтожение моей республики"
 gdp_smuggler_opinion: "Контрабанда"
