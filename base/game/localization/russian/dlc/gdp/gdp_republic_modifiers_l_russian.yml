l_russian:
 gdp_founded_republic_modifier: "Основатель республики"
 gdp_founded_republic_modifier_desc: "Этот персонаж основал республику."
 gdp_fund_alms_decree_modifier: "Благотворительность"
 gdp_fund_alms_decree_modifier_desc: "Правители этого города недавно выказали щедрость, раздав милостыню беднякам."
 gdp_taxed_county_modifier: "Плата военного налога"
 gdp_taxed_county_modifier_desc: "Это графство недавно заплатило значительные налоги на поддержание войны."
 gdp_tax_holiday_decree_modifier: "Налоговые послабления"
 gdp_tax_holiday_decree_modifier_desc: "Налоги в этом городе снижены особым указом, чему очень рады его жители."
 gdp_trade_support_modifier: "Поддержка торговли"
 gdp_trade_support_modifier_desc: "Этот персонаж получил поддержку республики в целях улучшения его торговых путей."
 republic_reliable_caravans_modifier: "Надежные караваны"
 republic_reliable_caravans_modifier_desc: "По торговым путям этого персонажа странствуют хорошо организованные караваны."
 republic_premium_contracts_modifier: "Выгодные договоры"
 republic_premium_contracts_modifier_desc: "Этот персонаж продает товары по самым лучшим контрактам."
 republic_inspector_bribery_modifier: "Подкупные инспекторы"
 republic_inspector_bribery_modifier_desc: "Рыночные инспекторы этого персонажа охотно берут взятки."
 gdp_glorification_modifier: "Прославление"
 gdp_glorification_modifier_desc: "Город публично славит этого правителя, украшая его образами и именем улицы и залы собраний.\n\n[Concept('voting_strength', 'Сила голоса')|E] по закону «[GetLaw( 'republican_elective_succession_law' ).GetName]»: +1"
 gdp_civic_labor_modifier: "Общественные работы"
 gdp_civic_labor_modifier_desc: "Жители столицы этого правителя привлекаются к строительству имения. Их труд и опыт позволяют ускорить и удешевить процесс."
 gdp_popular_mandate_modifier: "Общественная поддержка"
 gdp_popular_mandate_modifier_desc: "Этот правитель призвал жителей своей столицы поддержать его дальнейшую власть, что усилило его голос на следующих выборах.\n\n#weak Данный [Concept('modifier', 'модификатор')|E] действует только одни выборы#!\n\n[Concept('voting_strength', 'Сила голоса')|E] по закону «[GetLaw( 'republican_elective_succession_law' ).GetName]»: #P +1#!"
 gdp_patrician_promoted_voter_modifier: "Известная репутация"
 gdp_patrician_promoted_voter_modifier_desc: "Положение этого персонажа в республике укрепилось благодаря успешной кампании по повышению общественного мнения.\n[Concept('voting_strength', 'Сила голоса')|E] по закону «[GetLaw( 'republican_elective_succession_law' ).GetName]»: #P +1#!"
 republic_procedural_advantage_modifier: "Процедурные преимущества"
 republic_procedural_advantage_modifier_desc: "Этот персонаж подготовил все необходимые бумаги, чтобы заручиться поддержкой при следующем собрании."
 gdp_pledged_assembly_vote_modifier: "Обещаны голоса в собрании"
 gdp_pledged_assembly_vote_modifier_desc: "Члены [Concept('assembly', 'собрания')|E] пообещали этому персонажу свои голоса.\n$EFFECT_LIST_BULLET$#V На следующем [Concept('voting_session', 'голосовании')|E] они проголосуют так же, как это персонаж#!"
 gdp_bawdy_song_modifier: "Непристойная песня"
 gdp_bawdy_song_modifier_desc: "Этого персонажа вдохновила похабная лирика."
 gdp_patriotic_song_modifier: "Песня о Patria"
 gdp_patriotic_song_modifier_desc: "Этого персонажа вдохновили строки о любви к [Glossary( '#bold Patria#!', 'carnival_patria_GLOSS' )]."
 gdp_spiritual_song_modifier: "Духовная песня"
 gdp_spiritual_song_modifier_desc: "Этого персонажа вдохновила духовная лирика."
 gdp_rejected_dancefloor_modifier: "Отказ от танца"
 gdp_rejected_dancefloor_modifier_desc: "Этого персонажа отверг потенциальный партнёр по танцу."
 gdp_accepted_dancefloor_modifier: "Согласие на танец"
 gdp_accepted_dancefloor_modifier_desc: "Этот персонаж просил о танце, и его просьба была принята."
 gdp_exquisite_mask_modifier: "Изысканная маска"
 gdp_exquisite_mask_modifier_desc: "Этот персонаж носил изысканную маску во время карнавала."
 gdp_terrifying_mask_modifier: "Жуткая маска"
 gdp_terrifying_mask_modifier_desc: "Этот персонаж носил пугающую маску во время карнавала."
 gdp_slanderous_grafitti_modifier: "Порочащие рисунки"
 gdp_slanderous_grafitti_modifier_desc: "Семью этого персонажа опорочили рисунками на аллеях города."
 gdp_domestic_chaos_modifier: "Домашний бардак"
 gdp_domestic_chaos_modifier_desc: "Имение этого персонажа было перевёрнуто вверх дном."
 gdp_fragrant_egg_modifier: "Пахучее яйцо"
 gdp_fragrant_egg_modifier_desc: "Этого персонажа забрызгало пахучим содержимым брошенного яйца."
 gdp_sympathetic_ear_scheme_modifier: "Сочувствующий слушатель"
 gdp_sympathetic_ear_scheme_modifier_desc: "При дворе этого персонажа нашёлся сочувствующий проискам."
 gdp_insane_arguments_modifier: "Безумные доводы"
 gdp_insane_arguments_modifier_desc: "Этому персонажу привели безумные доводы."
 gdp_fatalistic_arguments_modifier: "Фаталистические доводы"
 gdp_fatalistic_arguments_modifier_desc: "Этому персонажу привели фаталистические доводы."
 gdp_beautiful_arguments_modifier: "Прелестный довод"
 gdp_beautiful_arguments_modifier_desc: "Этот персонаж получил совет от привлекательного человека."
 gdp_ugly_arguments_modifier: "Уродливый довод"
 gdp_ugly_arguments_modifier_desc: "Этот персонаж получил совет от уродливого человека."
 gdp_intellectual_debate_modifier: "Интеллектуальные дебаты"
 gdp_intellectual_debate_modifier_desc: "Опытный полемист привёл этому персонажу свои доводы."
 gdp_advise_of_a_fool_modifier: "Совет дурака"
 gdp_advise_of_a_fool_modifier_desc: "Глупец привёл этому персонажу свои доводы."
 gdp_a_way_with_words_modifier: "Искусство слова"
 gdp_a_way_with_words_modifier_desc: "Умелый оратор привёл этому персонажу свои доводы."
 gdp_sympathetic_ear_scheme_modifier_tt: "Ваши [Concept('scheme', 'происки')|E] получают эффект «[GetModifier('gdp_sympathetic_ear_scheme_modifier').GetNameWithTooltip]»."
 gdp_business_sabotage_modifier: "Деловое вредительство"
 gdp_business_sabotage_modifier_desc: "Дела этого персонажа пострадали от действий конкурента."
 gdp_arson_modifier: "Загадочный пожар"
 gdp_arson_modifier_desc: "Неизвестные преступники подожгли жилище этого персонажа."
 gdp_hardened_position_modifier: "Жёсткая позиция"
 gdp_hardened_position_modifier_desc: "В ответ на запугивание этот персонаж стал ещё твёрже стоять на своём."
 gdp_intimidated_modifier: "В ужасе"
 gdp_intimidated_modifier_desc: "Этого персонажа запугали."
 gdp_trentina_quarantine_county_modifier: "Карантин в порту"
 gdp_trentina_quarantine_county_modifier_desc: "Чтобы воспрепятствовать распространению болезней, в порту был введен карантин."
 gdp_trentina_quarantine_character_modifier: "Карантин в порту"
 gdp_trentina_quarantine_character_modifier_desc: "Этому персонажу мешает вести торговлю карантин в порту."
 gdp_curfew_character_modifier: "Ночной комендантский час"
 gdp_curfew_character_modifier_desc: "Этот персонаж установил ночной комендантский час, благодаря чему на улицах стало спокойнее."
 gdp_state_protection_modifier: "Государственная защита"
 gdp_state_protection_modifier_desc: "Этот персонаж находится под защитой собрания."
 gdp_republic_grieving_parent_modifier: "Скорбь"
 gdp_republic_grieving_parent_modifier_desc: "Наследник этого персонажа пал жертвой разъярённой толпы. Боль утраты еще не утихла."
 gdp_exposed_spy_modifier: "Коварный шпион"
 gdp_exposed_spy_modifier_desc: "Этот персонаж попался на том, что следил за другими."
 gdp_dodging_council_modifier: "Уклонение от обязанностей в совете"
 gdp_dodging_council_modifier_desc: "Этот персонаж нашёл способ улизнуть от исполнения обязанностей в совете и получил больше свободного времени для занятия чем-то другим."
 gdp_exemption_from_council_modifier: "Освобождение от обязанностей в совете"
 gdp_exemption_from_council_modifier_desc: "Этого персонажа освободили от обязанностей в совете, чтобы он мог сосредоточиться на собственных деловых интересах."
 gdp_wedded_to_the_sea_modifier: "Тяга к морям"
 gdp_wedded_to_the_sea_modifier_desc: "Этот персонаж поклялся, что море для него всегда будет важнее республики."
 gdp_learning_from_the_masses: "Уроки жизни"
 gdp_learning_from_the_masses_desc: "Этот персонаж охотно извлекает уроки из наблюдений за повседневной жизнью обычных людей."
 gdp_cooperation_correspondenti_house_modifier: "Корреспонденты"
 gdp_cooperation_correspondenti_house_modifier_desc: "Этот дом наладил сотрудничество с другим торговым домом, расширив возможности своей торговой сети."
 gdp_cooperation_compagnia_house_modifier: "Торговая компания"
 gdp_cooperation_compagnia_house_modifier_desc: "Этот дом наладил сотрудничество с другим торговым домом, чтобы совместно использовать ресурсы и обмениваться опытом."
 gdp_guild_sponsor_house_modifier: "Покровительство ремесленной гильдии"
 gdp_guild_sponsor_house_modifier_desc: "Этот дом поддержал создание новой ремесленной гильдии на собрании и стал её покровителем."
 gdp_ancient_craft_house_modifier: "Старинные мастера"
 gdp_ancient_craft_carpentry_supplies_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_books_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_incense_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_base_metals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_alcohol_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_comforts_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_meat_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_cereals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_consumption_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_jewelry_materials_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_items_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_republic_disgraced_patrician_house_modifier: "Опозоренные патриции"
 gdp_republic_disgraced_patrician_house_modifier_desc: "Представители этого дома привели республику к краху и были с позором изгнаны из общества. Их имя мало что значит для торговцев, и люди отзываются о них с неодобрением."
 gdp_republic_unrest_guild_district_shutdown: "Гильдейский район: закрыто"
 gdp_republic_unrest_guild_district_shutdown_desc: "Гильдии ремесленников закрыли свои двери. Работа в мастерских полностью застопорилась."
 gdp_republic_unrest_market_district_shutdown: "Рыночный район: закрыто"
 gdp_republic_unrest_market_district_shutdown_desc: "Все рыночные лавки опустели. В городе больше никто не ведёт торговлю."
 gdp_republic_unrest_port_district_shutdown: "Портовый район: закрыто"
 gdp_republic_unrest_port_district_shutdown_desc: "Порт был закрыт по распоряжению властей. Перестали поступать доходы от морских перевозок."
 gdp_republic_unrest_bureaucratic_district_shutdown: "Бюрократический район: закрыто"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "В прежде оживленном административном районе воцарилась тишина. Никто не собирает налоги с горожан."
 gdp_republic_unrest_temple_district_shutdown: "Район религиозного анклава: закрыто"
 gdp_republic_unrest_temple_district_shutdown_desc: "Служители религиозного анклава отказываются сотрудничать с властями. В казну больше не поступают благотворительные пожертвования."
 gdp_republic_unrest_entertainment_district_shutdown: "Увеселительный район: закрыто"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "Из увеселительного района полностью пропала жизнь. Городские доходы падают."
 gdp_republic_unrest_urban_housing_district_shutdown: "Жилой район: закрыто"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "Жители целого района отгородились от остального мира. Нарушился весь процесс налогообложения."
 gdp_republic_riot_aftermath: "Последствия беспорядков"
 gdp_republic_riot_aftermath_desc: "В порыве ярости бунтующие сожгли дома и разграбили зернохранилища. Чтобы общество восстановилось, нужно время."
 gdp_republic_uprising_aftermath: "Последствия восстания"
 gdp_republic_uprising_aftermath_desc: "Недовольная толпа разрушительным ураганом прошлась по городу. Порядок в него вернётся ещё не скоро."
 gdp_sponsored_guild_modifier: "Поддержка ремесленной гильдии"
 gdp_sponsored_guild_modifier_desc: "Ремесленникам разрешили создать новую гильдию при поддержке состоятельного покровителя."
 gdp_secret_information_house_modifier: "Дипломатические секреты"
 gdp_secret_information_house_modifier_desc: "Этот дом пользуется преимуществами доступа к тайным дипломатическим переговорам своей республики."
 gdp_ambitions_aligned_house_modifier: "Общие амбиции"
 gdp_ambitions_aligned_house_modifier_desc: "Этот дом преследует те же интересы, что и другие дома со схожими амбициями в республике."
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "Репутация этого дома запятнана потоком гнусной клеветы.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_patrician_slander_rating_penalty_value' )|0=+]\nУровень поддержки члена [Concept('house', 'дома')|E] ([GetLaw('republican_elective_succession_law').GetName]): [EmptyScope.ScriptValue( 'republic_slander_election_value' )|0=+]"
 gdp_patrician_promoted_house_modifier: "Известная репутация"
 gdp_patrician_promoted_house_modifier_desc: "Положение этого дома в республике укрепилось благодаря успешной кампании по повышению общественного мнения.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
 gdp_secured_republic_monopoly_modifier: "Получена монополия республики"
 gdp_secured_republic_monopoly_modifier_desc: "Это персонаж добился монополии для своей республики.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'secured_republic_monopoly_rating_bonus_value' )|0=+]"
 gdp_head_held_high_modifier: "С высоко поднятой головой"
 gdp_head_held_high_modifier_desc: "Этот персонаж с достоинством переносит насмешки и не обращает внимания на издёвки."
 gdp_training_for_the_worst_modifier: "Подготовка к худшему"
 gdp_training_for_the_worst_modifier_desc: "Этот персонаж решил отточить воинское мастерство на случай, если всё пойдёт наперекосяк."
 gdp_fear_of_the_mob_modifier: "Страх перед толпой"
 gdp_fear_of_the_mob_modifier_desc: "Этот персонаж живёт в постоянном страхе перед непостоянством простого народа."
 gdp_champion_of_the_people_modifier: "Защита народа"
 gdp_champion_of_the_people_modifier_desc: "Этот персонаж провозгласил себя защитником простого народа."
 gdp_champion_of_the_state_modifier: "Защита власти"
 gdp_champion_of_the_state_modifier_desc: "Этот персонаж провозгласил себя защитником правящего правительства."
 gdp_guild_sponsored_feast_modifier: "Пир за счёт гильдий"
 gdp_guild_sponsored_feast_modifier_desc: "Городские гильдии устроили пир и пригласили на него этого персонажа, не взяв с него ни гроша."
 gdp_broken_trust_modifier: "Подорванное доверие"
 gdp_broken_trust_modifier_desc: "Этот персонаж воспользовался доверием народа ради собственной выгоды."
 gdp_toast_to_adventure_modifier: "Мечты о приключениях"
 gdp_toast_to_adventure_modifier_desc: "Этот персонаж мечтает о дальних странствиях и захватывающих приключениях."
 gdp_toast_to_romance_modifier: "Мечты о любви"
 gdp_toast_to_romance_modifier_desc: "Этот персонаж мечтает о любви и романтических отношениях."
 gdp_toast_to_glory_modifier: "Мечты о славе"
 gdp_toast_to_glory_modifier_desc: "Этот персонаж мечтает о славе и признании."
 gdp_toast_to_relations_modifier: "Мечты о дружбе"
 gdp_toast_to_relations_modifier_desc: "Этот персонаж мечтает о крепкой дружбе и семейном счастье.\nДоступно [Concept('interaction', 'взаимодействие')|E] «$befriend_interaction$»"
 gdp_republic_bureaucrat_modifier: "Республиканский чиновник"
 gdp_republic_bureaucrat_modifier_desc: "Этот персонаж проявил недюжинные способности в законодательной работе и отлично справился со всей бумажной волокитой.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\nОдобрение [Concept('assembly', 'собрания')|E] во время [Concept('voting_sessions', 'голосования')|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "Законодатель"
 gdp_republic_law_maker_modifier_desc: "Недавно этому персонажу удалось добиться одобрения своего законопроекта в собрании благодаря искусным манёврам или умелому использованию связей.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "Влиятельные торговые посты"
 gdp_dominate_market_trade_post_modifier_desc: "На этот рынок активно влияют торговые посты одного из патрициев."
 gdp_trade_post_charity_modifier: "Благотворительность"
 gdp_trade_post_charity_modifier_desc: "Этот персонаж занимался благотворительностью для простого народа, чтобы помочь больным, беднякам и всем нуждающимся."
 gdp_gather_popular_support_modifier: "Народное признание"
 gdp_gather_popular_support_modifier_desc: "Этот персонаж заручился поддержкой горожан, прославив своё имя и добившись того, чтобы к его голосу прислушивались."
 gdp_gather_popular_support_house_t3_modifier: "Исключительная поддержка семьи со стороны народа"
 gdp_gather_popular_support_house_t3_modifier_desc: "Этот дом пользуется исключительной поддержкой горожан.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\nПоддержка закона «[GetLaw('republican_elective_succession_law').GetName]» членами [Concept('house', 'дома')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "Сильная поддержка семьи со стороны народа"
 gdp_gather_popular_support_house_t2_modifier_desc: "Этот дом пользуется сильной поддержкой горожан.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\nПоддержка закона «[GetLaw('republican_elective_succession_law').GetName]» членами [Concept('house', 'дома')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "Поддержка семьи со стороны народа"
 gdp_gather_popular_support_house_t1_modifier_desc: "Этот дом пользуется поддержкой горожан.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\nПоддержка закона «[GetLaw('republican_elective_succession_law').GetName]» членами [Concept('house', 'дома')|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "Деспотичный мэр"
 gdp_signorial_execute_and_banish_modifier_desc: "Этот персонаж казнил и изгонял граждан республики и даже не думает останавливаться."
 gdp_ambition_promote_scheme_bonus_modifier: "Поддержанные патриции"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "Этот персонаж приложил немало усилий, чтобы укрепить репутацию другого патриция, и заслужил его расположение.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (ранги не складываются)#!"
 gdp_noble_magistrate_modifier: "Почётное место в магистратуре"
 gdp_noble_magistrate_modifier_desc: "Этот персонаж получил невысокую, но почётную должность в магистратуре, чтобы честно и добросовестно служить республике."
 gdp_republic_plaza_prestige_modifier: "Прославленная площадь"
 gdp_republic_plaza_prestige_modifier_desc: "Этот персонаж внёс вклад в создание большую торговую площадь, заслужив престиж и расположение народа."
 gdp_republic_trader_competitiveness_modifier: "Несгибаемость в торговле"
 gdp_republic_trader_competitiveness_modifier_desc: "Этот персонаж — жёсткий и непреклонный торговец, который не уступает в переговорах и всегда вынуждает другую сторону пойти на уступки."
 gdp_republic_plaza_chancery_modifier: "Древесина для канцелярии"
 gdp_republic_plaza_chancery_modifier_desc: "Этот персонаж обустроил архив, предоставив плотницкие инструменты, печатные станки и выдержанную древесину. Излишки он теперь использует в собственном хозяйстве."
 gdp_republic_plaza_scriptorium_modifier: "Хорошо снабжённый скрипторий"
 gdp_republic_plaza_scriptorium_modifier_desc: "Этот персонаж располагает большими запасами качественных чернил и красок, которыми он снабдил переписчиков общины."
 gdp_republic_plaza_magistracy_modifier: "Должностные облачения"
 gdp_republic_plaza_magistracy_modifier_desc: "Этот персонаж за свой счёт купил форму для городских магистратов. Теперь его встречают с почтением везде, где вершат правосудие."
 gdp_republic_plaza_popular_favor_modifier: "Популярная фигура"
 gdp_republic_plaza_popular_favor_modifier_desc: "Этот персонаж умеет воздействовать на толпу и позаботился о том, чтобы все знали, кто оплачивает городские увеселения."
 gdp_republic_plaza_trade_capacity_modifier: "Точный вес и мера"
 gdp_republic_plaza_trade_capacity_modifier_desc: "Товары этого персонажа взвешивают без споров, а объёмы торговли с каждым сезоном только растут."
 gdp_republic_plaza_expertise_modifier: "Хозяин торговой площади"
 gdp_republic_plaza_expertise_modifier_desc: "Этот персонаж держит в руках торговлю города и пользуется влиянием среди многих купцов. Благодаря этому он получает такие сведения о товарах и торговых делах, на сбор которых иначе ушли бы десятилетия."
 gdp_republic_plaza_estate_income_modifier: "Общинный ростовщик"
 gdp_republic_plaza_estate_income_modifier_desc: "Община задолжала этому персонажу деньги, и его счётная палата исправно получает проценты."
 gdp_republic_plaza_physician_modifier: "Благосклонность лекарей"
 gdp_republic_plaza_physician_modifier_desc: "Этот персонаж оплатил запасы трав и лекарств для городских лечебниц, позаботившись о том, чтобы его собственный дом никогда в них не нуждался."
 gdp_republic_plaza_hired_swords_modifier: "Казначей наёмников"
 gdp_republic_plaza_hired_swords_modifier_desc: "Этот персонаж следит за тем, чтобы наёмные отряды получали плату вовремя и сполна, а те в свою очередь не забывают, из чьего кошелька поступают деньги."
 gdp_republic_plaza_organized_worker_modifier: "Организатор работ"
 gdp_republic_plaza_organized_worker_modifier_desc: "Организация работы строителей на масштабных стройках позволила этому персонажу многое узнать о логистике таких проектов."
 gdp_republic_civic_works_labor_modifier: "Организованный труд"
 gdp_republic_civic_works_labor_modifier_desc: "Правительство республики собрало и организовало рабочих, ускорив строительство по всей столице."
 gdp_republic_civic_works_materials_modifier: "Заготовленные материалы"
 gdp_republic_civic_works_materials_modifier_desc: "Скоординированные усилия по закупке и созданию запасов строительных материалов позволили снизить расходы на строительство по всей столице."
 gdp_republic_civic_works_amenities_modifier: "Общественные увеселения"
 gdp_republic_civic_works_amenities_modifier_desc: "Новые бани, фонтаны и места для встреч улучшили настроение горожан."
 gdp_republic_civic_works_market_modifier: "Расширенный рынок"
 gdp_republic_civic_works_market_modifier_desc: "Более обширный и упорядоченный торговый квартал привлёк новых купцов и создал более благоприятные условия для торговли в столице."
 gdp_republic_civic_works_guilds_modifier: "Поддержка ремесленных гильдий"
 gdp_republic_civic_works_guilds_modifier_desc: "Покровительство гильдиям привлекло в столицу искусных мастеров. Их присутствие стимулирует вложения и постепенно улучшает жизнь города."
 gdp_republic_civic_works_labor_character_modifier: "Связи среди рабочих"
 gdp_republic_civic_works_labor_character_modifier_desc: "Организовывая общественные работы, этот правитель наладил связи с опытными мастерами и заказчиками со всей столицы.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "Налаженные поставки"
 gdp_republic_civic_works_materials_character_modifier_desc: "Закупка материалов для общественных работ открыла этому правителю доступ к надёжным поставщикам камня, древесины и прочих припасов по выгодным ценам.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "Покровитель горожан"
 gdp_republic_civic_works_amenities_character_modifier_desc: "Финансирование городских увеселений принесло этому правителю искреннюю благодарность жителей столицы.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "Торговые связи"
 gdp_republic_civic_works_market_character_modifier_desc: "Расширение торгового квартала столицы позволило этому правителю завязать знакомства с купцами и торговцами, которые помнят оказанную им услугу.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "Покровитель ремесленников"
 gdp_republic_civic_works_guilds_character_modifier_desc: "Поддержка ремесленных гильдий помогла этому правителю установить прочные связи с городскими мастерами. Их благодарность укрепляет положение правителя в глазах окружающих.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "Расширение поселения"
 gdp_republic_civic_works_settlement_modifier_desc: "Вложения в городскую инфраструктуру столицы позволили получить больше места для людей, и долго оно пустовать не будет."
 gdp_republic_civic_works_settlement_character_modifier: "Городской инвестор"
 gdp_republic_civic_works_settlement_character_modifier_desc: "Вложив средства в развитие столицы республики, этот правитель теперь может определять, в каком направлении будет развиваться город.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "Общественный порядок"
 gdp_republic_civic_works_order_modifier_desc: "Вложения в городскую стражу и общественную инфраструктуру сделали жизнь в столице спокойнее и упростили управление."
 gdp_republic_civic_works_order_character_modifier: "Хранитель порядка"
 gdp_republic_civic_works_order_character_modifier_desc: "Финансирование мер по поддержанию порядка в столице укрепило за этим правителем репутацию человека, способного обеспечить стабильность и грамотное управление.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "Общественные школы"
 gdp_republic_civic_works_school_modifier_desc: "Это графство получило значительные средства на строительство общественных школ."
 gdp_republic_civic_works_school_character_modifier: "Покровительство школам"
 gdp_republic_civic_works_school_character_modifier_desc: "Этот персонаж профинансировал строительство школ в столице, открыв молодёжи доступ к образованию и знаниям.\n[Concept('patrician_rating', 'Ранг патриция')|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
