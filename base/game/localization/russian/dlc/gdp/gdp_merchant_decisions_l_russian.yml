 merchant_creditor_capstone_decision_fashion_tt: "Представители вашей [Concept('company', 'компании')|E] начинают носить дворянские одежды"
 merchant_creditor_capstone_decision_building_tt: "Вашей [Concept('company', 'компании')|E] становится доступно [Concept('domicile_building_upgrade', 'внутреннее улучшение')|E] «[GetDomicileBuilding('merchant_company_creditor_capstone_01').GetName]» для [Concept('domicile_building', 'постройки в имении')|E] «[GetDomicileBuilding('merchant_company_building_civic_01').GetName]»"
 merchant_creditor_capstone_prestige_effect: "Благодаря [Concept('domicile_building_upgrade', 'внутреннему улучшению')|E] «[GetDomicileBuilding('merchant_company_creditor_capstone_01').GetName]»:"
 merchant_creditor_capstone_company_purpose_trigger: "У вас должна быть [Concept('company_purpose', 'специфика компании')|E] «[GetLaw('company_purpose_creditor').GetName]»"
 merchant_company_caravaneer_capstone_01_tt: "Открывается [Concept('decision', 'решением')|E] «[GetDecisionWithKey( 'merchant_caravaneer_capstone_decision' ).GetName]»"
