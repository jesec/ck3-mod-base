 merchant_artisan_capstone_company_purpose_trigger: "У вас должна быть [Concept('company_purpose', 'специфика компании')|E] «[GetLaw('company_purpose_artisan').GetName]»"
 merchant_creditor_capstone_decision: "Укрепить репутацию ростовщиков"
 merchant_creditor_capstone_decision_desc: "Имя [ROOT.Char.GetHouse.GetNameNoTooltip] стало синонимом честных займов, ведь когда над величайшими домами сгущаются тучи, именно к нам они обращаются в первую очередь."
 merchant_creditor_capstone_decision_tooltip: "Укрепить репутацию #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]их#! [Concept('merchant', 'торговцев')|E] как ростовщиков и поручителей"
