l_russian:
 gdp_repudiate_usurious_loan_decision: "Осудить ростовщический заём"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip] [Select_CString(ROOT.Var('loan_holder').Char.IsFemale, 'составила', 'составил' )] долговую расписку с явно указанными процентами, и наши [ROOT.Char.GetRite.PriestNeuterPlural|l] считают, что подобные договорённости не являются обязательными. Лучше аннулировать этот долг, а не выплачивать его.\n\nЭто не кража. Это [ROOT.Char.GetRite.GetNameNoTooltip|l]ий закон, но каждый торговец отсюда и до моря всё равно будет считать это кражей."
 gdp_repudiate_usurious_loan_decision_tooltip: "Приказать [Concept('clergy', 'духовенству')|E] аннулировать заём, объявив его [Concept('usury', 'ростовщичеством')|E]. Вы сохраните [Concept('gold', 'золото')|E], но потеряете репутацию среди [Concept('merchants', 'торговцев')|E]"
 gdp_repudiate_usurious_loan_decision_confirm: "Греховный контракт ни к чему меня не обязывает!"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "У вас нет средств, чтобы расплатиться по этому [Concept('loan', 'займу')|E]"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "В последнее время вы не осуждали [Concept('creditor', 'ростовщиков')|E]"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X Вероятно, в обозримом будущем [Concept('merchants', 'торговцы')|E] не захотят давать вам взаймы#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "Ваше [Concept('rite', 'течение')|E] должно считать займы грехом, и рядом должен быть [Concept('clergy', 'духовный')|E] правитель вашей [Concept('faith', 'конфессии')|E], способный аннулировать его. Его [Concept('rite', 'течение')|E] также должно считать займы грехом, он не должен быть вашим [Concept('creditor', 'ростовщиком')|E], [Concept('rival', 'соперником')|E] или противником в войне\n#weak Ваш [Concept('head_of_faith', 'глава конфессии')|E], владетель [Concept('clerical_region', 'церковного округа')|E] вашей столицы или текущего местоположения или любой представитель [Concept('clergy', 'духовенства')|E] в державе вашего [Concept('top_liege_possessive', 'верховного сюзерена')|E].#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "[Select_CString(GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).IsFemale, 'Ваша', 'Ваш' )] [Concept('realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|El] [Select_CString(GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).IsFemale, 'должна', 'должен' )] поддерживать вас: #P положительное#! [Concept('opinion', 'мнение')|E] о вас или [Concept('puppet', 'марионетка')|E] на [Concept('strong_hook', 'сильном влиянии')|E]"
 become_merchant_decision: "Становление торговцем"
 become_merchant_decision_desc: "К чему служба при дворе без знания людский обычаев? Желание путешествовать и сближать державы слишком сильно, чтобы ему противиться."
 become_merchant_decision_tooltip: "Отказаться от своих [Concept('titles', 'титулов')|E] и учредить [Concept('merchant', 'торговую')|E] [Concept('company', 'компанию')|E]"
 become_merchant_decision_confirm: "Пришло время торговать!"
 become_merchant_decision_house_head_tt: "Вы должны быть [Concept('house_head', 'главой дома')|E]"
 gdp_recently_became_adventurer_decision_cooldown_tt: "Вы были [Concept('adventurer', 'авантюристом')|E] #V 5 лет#!"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U] больше не будет [Select_CString(repudiating_borrower.IsFemale, 'должна', 'должен' )] [Select_CString(repudiated_lender.IsLocalPlayer, 'вам', Concatenate('персонажу ',repudiated_lender.GetShortUIName))] заём"
 abuse_charter_authority_decision: "Злоупотребить авторитетом хартии"
 abuse_charter_authority_decision_tooltip: "Воспользуйтесь своей [Concept('charter', 'хартией')|E], чтобы зарабатывать [gold_i|E][gold|El] и повышать [competitiveness_i|E][competitiveness|El]"
 abuse_charter_authority_decision_desc: "Я обладаю хартией, которую [Select_CString(ROOT.Char.GetSuzerain.IsFemale, 'скрепила', 'скрепил' )] своей печатью [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] державы [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], благодаря чему [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] может навязывать свою волю на законных основаниях. С поддержкой сюзерена никто не посмеет встать на пути наших интересов."
 abuse_charter_authority_decision_confirm: "[ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] поддерживает меня!"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "Власть [Concept('gurkhan_possessive', 'гурхана')|E] здесь не признаётся"
 abuse_charter_authority_decision.region_already_abused: "На этой территории уже злоупотребляли властью [Concept('gurkhan_possessive', 'гурхана')|E]"
 abuse_charter_authority_decision.nothing_to_abuse: "В этом [Concept('location', 'месте')|E] нет земли, где можно злоупотребить властью"
 gdp_charter_abused_market_modifier: "Злоупотребление властью хартии"
 gdp_charter_abused_market_modifier_desc: "Этот персонаж злоупотребил властью, предоставляемой хартией, в интересах своей компании."
 gdp_charter_abused_market_county_modifier: "Злоупотребление властью хартии"
 gdp_charter_abused_market_county_modifier_desc: "Это графство подверглось эксплуатации со стороны торговой компании, которая использовала хартию ради обогащения."
 gdp_charter_leveraged_market_modifier: "Не у дел из-за держателя хартии"
 gdp_charter_leveraged_market_modifier_desc: "Компания этого персонажа разорилась по вине соперника, получившего хартию из рук правителя державы."
 gdp_charter_charitable_market_county_modifier: "Развитие по мандату хартии"
 gdp_charter_charitable_market_county_modifier_desc: "Торговая компания занялась развитием этого графства, воспользовавшись своей хартией ради прямого вмешательства."
 gdp_decision.1000.t: "Неудовольствие покровителя"
 gdp_decision.1000.desc: "Посланник принёс вести из залов, где правит [patron.GetTitledFirstNameNoTooltipRegnal]. [Select_CString(patron.IsFemale, 'Моя', 'Мой' )] покровитель с каменным лицом [Select_CString(patron.IsFemale, 'выслушала', 'выслушал' )] обвинения в злоупотреблениях со стороны моей компании.\n\nМне сообщили, что магистраты во всех подробностях перечислили наши якобы злоупотребления, и [patron.GetTitleAsNameNoTooltip] постепенно [Select_CString(patron.IsFemale, 'оказалась настроена', 'оказался настроен' )] против меня.\n\n[Select_CString(patron.IsFemale, 'Моя', 'Мой' )] покровитель требует немедленно отметить и объяснить наши действия…"
 gdp_decision.1000.a: "«Охотно отдам себя на ваш суд»."
 gdp_decision.1000.b: "«Наверняка вы понимаете, это было в интересах державы…»"
 gdp_decision.1000.b.success: "Ваш покровитель проявляет милосердие"
 gdp_decision.1000.b.failure: "Ваш покровитель в ярости"
 gdp_decision.1000.a.effects: "Ваш [Concept('merchant_patron', 'покровитель')|E] получает [Concept('imprisonment_reason', 'повод для вашего заточения')|E] и [Concept('execute_reason', 'казни')|E]"
 gdp_decision.1000.a.severe_effects: "Ваш [Concept('merchant_patron', 'покровитель')|E] получает [Concept('imprisonment_reason', 'повод для заточения')|E] и [Concept('execute_reason', 'казни')|E] вас и ваших [Concept('close_family_members', 'близких родственников')|E]"
 gdp_decision.1000.a.survived_patrons_wrath: "Вы пережили гнев [Concept('merchant_patron', 'покровителя')|E], но больше не сможете злоупотребить его властью"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "Я [ROOT.Char.GetTitleAsNameNoTooltip|l], и купцы державы [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] действуют от моего имени, особенно те, кто получил хартии с моей печатью.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$Похоже, один из этих торгашей, [merchant.GetName], злоупотребляет моей милостью и пользуется дарованными привилегиями, чтобы набивать свою мошну в ущерб народу.\n\nПодобные вольности возмутительны, но мне нужно всё взвесить и оценить выгоду, которую такие торговцы приносят державе."
 gdp_decision.1010.a: "[Select_CString(merchant.IsFemale, 'Она', 'Он')] за это ответит!"
 gdp_decision.1010.a.tt: "Другие [Concept('clients', 'клиенты')|E] с вашими [Concept('charters', 'хартиями')|E] будут менее охотно злоупотреблять вашей властью, если [merchant.GetShortUIName] окажется [Concept('imprisoned', 'в заключении')|E]"
 gdp_decision.1010.b: "Прощаю… на первый раз."
 gdp_decision.1010.c: "Эта болтовня о бакалейщиках ниже моего достоинства."
 gdp_decision.1010.c.flavor: "Злоупотребления вашей властью могут продолжиться, но вам больше не будут сообщать об этом."
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]?.. Не помню, чтобы у них была хартия!"
 gdp_decision.1020.t: "Так велит [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1020.opening: "Стоит мне взмахнуть своей хартией, как ворота владения [market_province.GetBaronyNameExplicitly] и двери местных магистратов открываются передо мной. Ведь так велит [patron.GetTitledFirstName].\n\n"
 gdp_decision.1020.market_holder: "[market_holder.GetTitledFirstName], местная шишка, явно [Select_CString(market_holder.IsFemale, 'выказала', 'выказал')] своё неудовольствие, тявкнув, что [patron.GetTitleAsNameNoTooltip] ещё узнает об этом. Но [Select_CString(market_holder.IsFemale, 'её', 'его')] жалобы — пустой звук. Документ нельзя оспорить.\n\n"
 gdp_decision.1020.closing: "Городок в моих руках, и представители компании могут установить контроль над рынком, конфисковать товар, не имеющий нужных документов, и замучить конкурентов ложными жалобами и обвинениями."
 gdp_decision.1020.a: "Никто не встанет у нас на пути."
 gdp_decision.1020.b: "Пусть и [market_holder.GetTitledFirstNameNoTooltip] будет в доле."
 gdp_decision.1020.c: "Пожалуй, не стоит."
 gdp_decision.1020.d: "«Моя #EMP проверка#! окончена. Пока что…»"
 gdp_decision.1020.b.success: "[patron.GetTitleAsNameNoTooltip] не узнает об этом"
 gdp_decision.1020.b.failure: "[patron.GetTitleAsNameNoTooltip] узнает об этом злоупотреблении"
 benevolent_charter_authority_decision: "Направить местные инвестиции"
 benevolent_charter_authority_decision_tooltip: "Воспользоваться [Concept('charter', 'хартией')|E] для развития [building_i|E][Concept('building', 'здания')|E] и повышения местного [prosperity_i|E][Concept('prosperity', 'процветания')|E]"
 benevolent_charter_authority_decision_desc: "[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] державы [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip] дозволяет мне делать прямые инвестиции в державу, на что у обычной торговой компании нет прав."
 benevolent_charter_authority_decision_confirm: "[ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] позволяет мне сделать много хорошего."
 merchant_charter_intervention_county_cooldown: "Вы не вмешивались в дела владения [THIS.Char.GetDomicile.GetLocation.GetName] в последние #V 5#! лет#!"
 gdp_decision.1200.t: "Удовольствие покровителя"
 gdp_decision.1200.desc: "Из чертогов, где правит [patron.GetTitledFirstNameNoTooltipRegnal], до меня дошли вести о множестве хороших слов об инициативе моей компании, прозвучавших перед моим покровителем.\n\nНесколько свидетелей пели дифирамбы, прославляя работу, которую делает [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l].\n\nПосле этого [patron.GetTitleAsNameNoTooltip] [Select_CString(patron.IsFemale, 'отправила', 'отправил')] в компанию письмо, «[Select_CString(ROOT.Char.IsFemale, 'Добрая', 'Добрый')] [ROOT.Char.GetTitledFirstNameNoTooltip], ваши усилия укрепляют державу!»"
 gdp_decision.1200.a: "«Компания рада вам услужить»."
 gdp_decision.1200.b: "«Признание — это хорошо, а награда ещё лучше»."
 gdp_decision.1200.b.flavor: "При всём уважении…"
 gdp_decision.1200.b.success: "Ваш покровитель проявляет щедрость"
 gdp_decision.1200.b.failure: "Ваш покровитель испытывает разочарование"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$Похоже [Select_CString(merchant.IsFemale, 'одна', 'один')] из этих торговцев, человек по имени [merchant.GetName], [Select_CString(merchant.IsFemale, 'воспользовалась', 'воспользовался')] своими привилегиями во благо державы, вложив средства в развитие владения [market_province.GetBaronyNameExplicitlyNoTooltip]!\n\nСтоль достойное поведение заслуживает похвалы, а поощрение наверняка подтолкнёт и других на благие дела."
 gdp_decision.1210.a: "Такие старания надо поощрять."
 gdp_decision.1210.a.tt: "Другие [Concept('clients', 'клиенты')|E] с вашими [Concept('charters', 'хартиями')|E] будут более охотно использовать вашу власть в благих целях"
 gdp_decision.1210.b: "[ROOT.Char.GetFaith.HighGodName] свидетель, честные купцы #EMP и правда#! существуют!"
 gdp_decision.1210.c: "Не лезь ко мне с этим."
 gdp_decision.1210.c.flavor: "Благие дела от вашего имени могут продолжиться, но вам больше не будут сообщать об этом."
 gdp_decision.1220.t: "Так велит [patron.GetTitleAsNameNoTooltip]"
 gdp_decision.1220.opening: "Моё прибытие во владение [market_province.GetBaronyNameExplicitly] с хартией в руках сперва внушает ужас местным магистратам, но вскоре мне удаётся убедить их в благих намерениях моей компании.\n\n"
 gdp_decision.1220.market_holder: "[market_holder.GetTitledFirstName], местная важная шишка, с осторожным интересом прислушивается к моим предложениям и находит выгоды в поощрении производства и торговли среди [Select_CString(market_holder.IsFemale, 'её', 'его')] подданных.\n\n"
 gdp_decision.1220.closing: "После обхода с помощью горожан удаётся найти несколько очевидных мест, где требуются ремонт и улучшения."
 gdp_decision.1220.a: "«Ну и чего мы ждём?»"
 gdp_decision.1220.d: "«Это всё очень интересно, но меня ждут другие дела…»"
 press_the_advantage_decision: "Воспользоваться преимуществом"
 press_the_advantage_decision_desc: "Наши недавние успехи доставили неприятности соперникам и внесли неопределённость на рынки. Пора воспользоваться своими людьми, обязательствами и заработанным влиянием и превратить давление в прибыль."
 press_the_advantage_decision_tooltip: "Потратить [competitive_pressure_i][Concept('competitive_pressure', 'конкурентное давление')|E], чтобы получить [competitiveness_i][Concept('trade_competitiveness', 'конкурентоспособность торговли')|E] на [Concept('trade_route', 'торговом пути')|E] на определённое время"
 press_the_advantage_decision_confirm: "Воспользуемся нашим преимуществом."
 merchant_competitive_pressure_gain_1_tt: "Получить #P 1#![competitive_pressure_i] ед. [Concept('competitive_pressure', 'конкурентного давления')|E]"
 merchant_competitive_pressure_gain_2_tt: "Будет получено [competitive_pressure_i]#P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! ед. [Concept('competitive_pressure', 'конкурентного давления')|E]"
 merchant_competitive_pressure_spend_tt: "Потратить #N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#![competitive_pressure_i] ед. [Concept('competitive_pressure', 'конкурентного давления')|E]"
 merchant_competitive_pressure_spend_cost_tt: "У вас есть хотя бы #V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#![competitive_pressure_i] ед. [Concept('competitive_pressure', 'конкурентного давления')|E]"
 merchant_competitive_pressure_below_max_tt: "Ваше [competitive_pressure_i][Concept('competitive_pressure', 'конкурентное давление')|E] не максимально #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!"
 press_the_advantage_route_not_already_pressed_tt: "У вас есть активный [Concept('trade_route', 'торговый путь')|E], ещё не имеющий модификатора «[GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]»"
 press_the_advantage_selected_route_has_trader_tt: "На выбранном [Concept('trade_route', 'торговом пути')|E] есть [Concept('trader', 'приказчик')|E]"
 press_the_advantage_selected_route_not_already_pressed_tt: "Выбранный [Concept('trade_route', 'торговый путь')|E] ещё не имеет модификатора «[GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]»"
 merchant_competitive_pressure_route_modifier: "Использованное преимущество"
 merchant_competitive_pressure_route_modifier_desc: "Этот торговый путь получает особое внимание со стороны агентов, прекрасно знающих уязвимые места конкурентов."
 choose_specialized_market_decision: "Выбрать специализированный рынок"
 choose_specialized_market_decision_desc: "Компания, хорошо изучившая обычаи рынка, его чиновников и скрытые пути торговли, чувствует себя как дома даже в чужом городе. Сосредоточив усилия наших инспекторов на одном из рынков на наших торговых путях, мы сможем обратить местные знания в коммерческое преимущество."
 choose_specialized_market_decision_tooltip: "Выберите [market_i][Concept('market', 'рынок')|E] на одном из ваших [route_i][Concept('trade_routes', 'торговых путей')|E], чтобы получить бонус от специализации инспектора"
 choose_specialized_market_decision_confirm: "Изучить рынок"
 choose_specialized_market_decision_effect_tt: "Выбранный [market_i][Concept('market', 'рынок')|E] станет вашим спецализированным [market_i][Concept('market', 'рынком')|E]"
 choose_specialized_market_has_valid_market_tt: "У вас есть подходящий [market_i][Concept('market', 'рынок')|E] на [route_i][Concept('trade_routes', 'торговом пути')|E] или в месте, где располагается ваше [Concept('domicile', 'имение')|E]"
 choose_specialized_market_selected_market_has_valid_route_tt: "Выбранный [market_i][Concept('market', 'рынок')|E] находится на одном из ваших [route_i][Concept('trade_routes', 'торговых путей')|E] или в месте, где располагается ваше [Concept('domicile', 'имение')|E]"
 choose_specialized_market_selected_market_is_new_tt: "Выбранный [market_i][Concept('market', 'рынок')|E] ещё не является вашим спецализированным [market_i][Concept('market', 'рынком')|E]"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "Эта компания изучила местные обычаи, чиновников и торговые порядки этого рынка."
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "Эта компания поддерживает на этом рынке тщательно налаженную систему проверок."
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "Эта компания в мельчайших подробностях изучила расположение торговых рядов, складов и негласных соглашений, царящих на этом рынке."
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "Эта компания знает этот рынок так, словно владеет им уже многие годы."
 pious_patronage_decision: "Благочестивое покровительство"
 pious_patronage_decision_desc: "Одного лишь золота недостаточно, чтобы открыть все двери — вера способна на большее. Поддерживая святилища, духовенство и благочестивые дела на рынке, уже связанном с нашими торговыми путями, мы обратим общую веру в залог торгового доверия."
 pious_patronage_decision_tooltip: "Потратить [piety_i][Concept('piety', 'благочестие')|E], чтобы повысить свою [competitiveness_i][Concept('trade_competitiveness', 'конкурентоспособность')|E] на одном из [market_i][Concept('market', 'рынков')|E]"
 pious_patronage_decision_confirm: "Поддержать единоверцев"
 pious_patronage_has_valid_market_tt: "У вас есть [route_i][Concept('trade_route', 'торговый путь')|E], который проходит через подходящий [market_i][Concept('market', 'рынок')|E] и у которого ещё нет модификатора [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip]"
 pious_patronage_selected_market_valid_faith_tt: "Выбранный [market_i][Concept('market', 'рынок')|E] исповедует вашу [Concept('faith', 'конфессию')|E] #weak (или у вас есть достоинство «[GetPerk('prophet_perk').GetName(GetPlayer)]»)#!"
 pious_patronage_selected_market_has_valid_route_tt: "У вас есть [route_i][Concept('trade_route', 'торговый путь')|E], который проходит через выбранный [market_i][Concept('market', 'рынок')|E]"
 pious_patronage_selected_market_no_modifier_tt: "У вас ещё нет модификатора «[GetModifier('pious_patronage_market_modifier').GetNameWithTooltip]» на выбранном [market_i][Concept('market', 'рынке')|E]"
 pious_patronage_different_faith_cost_tt: "У вас есть как минимум [piety_i]#V [EmptyScope.ScriptValue('massive_piety_value')|0]#! ед. [Concept('piety', 'благочестия')|E], чтобы оказать покровительство [market_i][Concept('market', 'рынку')|E] вне вашей [Concept('faith', 'конфессии')|E]"
 pious_patronage_market_modifier: "Благочестивое покровительство"
 pious_patronage_market_modifier_desc: "Эта компания пользуется религиозным покровительством на этом рынке."
 organize_the_venture_decision: "Организовать предприятие"
 organize_the_venture_decision_desc: "Перспективное начинание уже набирает ход. Стоит ужесточить сроки, дать более чёткие указания и задействовать влияние компании — и дело можно будет довести до конца быстрее."
 organize_the_venture_decision_tooltip: "Потратить [competitive_pressure_i][Concept('competitive_pressure', 'конкуретное давление')|E], чтобы ускорить прогресс текущей [Concept('contract_scheme', 'сделки')|E]"
 organize_the_venture_decision_confirm: "Наладить работу"
 merchant_competitive_pressure_organize_venture_spend_tt: "Потратить [competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! ед. [Concept('competitive_pressure', 'конкурентного давления')|E]"
 merchant_competitive_pressure_organize_venture_spend_cost_tt: "У вас есть как минимум [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! ед. [Concept('competitive_pressure', 'конкурентного давления')|E]"
 organize_the_venture_active_contract_scheme_tt: "У вас есть ещё не организованная активная [Concept('contract_scheme', 'сделка')|E]"
 undercut_the_competition_decision: "Подорвать конкуренцию"
 undercut_the_competition_decision_desc: "Прибыли можно восстановить, но утраченный рынок уже не вернуть. Снизив цены и согласившись на меньшую прибыль, мы можем выбить соперников из равновесия."
 undercut_the_competition_decision_tooltip: "[competitive_pressure_i][Concept('competitive_pressure', 'Конкурентное давление')|E] и [competitiveness_i][Concept('trade_competitiveness', 'конкурентоспособность торговли')|E] повысятся, однако цена продажи товаров временно упадёт"
 undercut_the_competition_decision_confirm: "Пожертвовать прибылью"
 undercut_the_competition_no_modifier_tt: "Вы ещё не подрываете конкуренцию"
 set_company_focus_decision: "Выбрать фокус компании"
 set_company_focus_decision_desc: "Одними учётными книгами компания не проживёт. Общественные обязательства, личная выгода и повседневные торговые дела — всё требует внимания, и приходится решать, чему отдать предпочтение."
 set_company_focus_decision_tooltip: "Выбрать текущий фокус для торговой компании"
 set_company_focus_decision_confirm: "Выбрать фокус"
 company_focus_none_name: "Нет фокуса компании"
 company_focus_none_desc: "Отказаться от текущего фокуса компании."
 company_focus_none_tooltip: "" # Deliberately empty
 company_focus_public_works_name: "Общественные работы"
 company_focus_public_works_desc: "Вкладываться в общественные проекты в окрестностях своего [Concept('domicile', 'имения')|E], повышая [popular_opinion_i][Concept('popular_opinion', 'народное мнение')|E] и [prosperity_i][Concept('prosperity', 'процветание')|E] края, а также приобретая [prestige_i][Concept('prestige', 'престиж')|E] и повышая [Concept('opinion', 'мнение')|E] окружающих — ценой части [gold_i][Concept('income', 'дохода')|E]."
 company_focus_public_works_tooltip: "" # Deliberately empty
 company_focus_private_profit_name: "Личная выгода"
 company_focus_private_profit_desc: "Сосредоточиться на собственной прибыли, увеличивая прирост [gold_i][Concept('gold', 'золота')|E] от своего [Concept('domicile', 'имения')|E] и укрепляя [competitiveness_i][Concept('trade_competitiveness', 'конкурентоспособность торговли')|E] — ценой [Concept('opinion', 'мнения')|E] окружающих."
 company_focus_private_profit_tooltip: "" # Deliberately empty
 company_focus_public_works_inactive_tt: "Вы ещё не сосредоточились на общественных работах"
 company_focus_private_profit_inactive_tt: "Вы ещё не сосредоточились на личной выгоде"
 sponsor_public_works_has_domicile_county_tt: "Ваше [Concept('domicile', 'имение')|E] находится в [Concept('county', 'графстве')|E]"
 forge_charter_decision: "Подделать хартию"
 forge_charter_decision_desc: "Наш покровитель не желает влезать в наши дрязги. Придётся брать дело в свои руки, чтобы сохранить конкурентоспособность."
 forge_charter_decision_tooltip: "Подделать [Concept('charter', 'хартию')|E] вашего [Concept('merchant_patron', 'покровителя')|E]"
 forge_charter_decision_confirm: "Мы делаем, что должны."
 forge_charter_artifact_trigger: "Вы не владеете [Concept('artifact', 'артефактом')|E]-[Concept('charter', 'хартией')|E] от вашего [Concept('merchant_patron', 'покровителя')|E] #weak ([patron_temp.GetShortUIName])#!"
 forge_charter_decision_durability_tt: "@warning_icon! #X Поддельные [Concept('artifacts', 'артефакты')|E]-[Concept('charter', 'хартии')|E] отличаются гораздо меньшей [Concept('durability', 'прочностью')|E]#!\n#help Такие [Concept('perks', 'достоинства')|E], как «[GetPerk('accomplished_forger_perk').GetName(GetPlayer)]» и «[GetPerk('digging_for_dirt_perk').GetName(GetPlayer)]», повышают прочность подделок#!"
 forge_charter_decision_warning_tt: "@warning_icon! #X Ваш [Concept('merchant_patron', 'покровитель')|E] будет считать вас [Concept('criminal', 'преступником')|E], если обман раскроется#!"
 gdp_decision.2000.t: "$forge_charter_decision$"
 gdp_decision.2000.desc: "Умело подделанный почерк и хитрые подобия печатей, воска и иных символов официального статуса превращают работу фальсификатора в настоящий шедевр.\n\nНе будет преувеличением заявить, что этот документ способен обмануть даже зоркие глаза тех, кто привык работать с подобными документами. Если не слишком присматриваться…"
 gdp_decision.2000.a: "Нужно соблюдать осторожность."
 invite_merchants_decision: "Привлечь купцов"
 invite_merchants_decision_desc: "Чтобы товары текли в нашу державу, из неё и по её землям, необходимо создать благоприятные условия для купцов."
 invite_merchants_decision_tooltip: "Пригласить [Concept('merchants', 'купцов')|E], чтобы они поселились в вашей [Concept('capital', 'столице')|E], создали [Concept('trade_routes', 'торговые пути')|E] и служили вам [Concept('clients', 'клиентами')|E]."
 invite_merchants_decision_confirm: "Товары должны течь."
 invite_merchants_decision_capital_full_tt: "Менее [EmptyScope.ScriptValue('invite_merchants_max_capital_merchants_value')|0] [Concept('merchants', 'купцов')|E] владеют [Concept('companies', 'компаниями')|E] в вашей [Concept('capital', 'столице')|E]"
 merchant_enticed_title: "Прибывает торговец"
 invite_merchants_decision_effect_1: "Несколько [Concept('merchants', 'купцов')|E] могут переместить свои [Concept('companies','компании')|E] в вашу [Concept('capital', 'столицу')|E]"
 invite_merchants_decision_effect_2: "Любые [Concept('merchants', 'торговцы')|E], ставшие вашими [Concept('client', 'клиентами')|E], получат модификатор «[GetModifier('gdp_enticed_merchant_market_modifier').GetNameWithTooltip]» на своём новом [Concept('market','рынке')|E]"
 gdp_enticed_merchant_market_modifier: "Привлеченный торговец"
 gdp_enticed_merchant_market_modifier_desc: "Компания этого персонажа получила стимул переместиться на этот рынок."
 gdp_decision.3000.opening: "[new_patron.Custom2('AppropriateGreetingPositive', new_client)]"
 gdp_decision.3000.desc: "Я ищу уважаемых и предприимчивых торговцев, вроде вас, которые перенесут дела в державу [new_patron.GetPrimaryTitle.GetDefinitiveName].\n\nВзамен я прослежу за тем, чтобы у вас было преимущество на наших рынках."
 gdp_decision.3000.a: "@move_company_icon! Уже закрываем все счета во владении [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_decision.3000.b: "Нас и здесь неплохо кормят."
 gdp_decision.3000.c: "[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] наш дом, отныне и навеки."
 gdp_decision.3000.c.tt: "Больше никто не будет предлагать вам перенести [Concept('company', 'компанию')|E]"
 gdp_sponsor_merchant_company_decision: "Торговец-спонсор"
 gdp_sponsor_merchant_company_decision_desc: "Торговля — грязное дело, совершенно не подходящее для такой утончённой натуры, как я. Может быть, при дворе найдётся кто-нибудь, кто станет моим личным приказчиком и будет заниматься ей вместо меня?"
 gdp_sponsor_merchant_company_decision_tooltip: "Профинансировать своего [Concept('courtiers', 'придворного')|E], чтобы он основал [Concept('merchant', 'торговую')|E] [Concept('company', 'компанию')|E], которая получит статус вашего [Concept('client', 'клиента')|E]"
 gdp_sponsor_merchant_company_decision_confirm: "Спонсировать новую компанию"
 gdp_sponsor_merchant_company_decision_no_item_selected: "[Concept('courtier', 'Придворный')|E] не выбран"
 gdp_sponsor_merchant_company_decision_cooldown_tt: "Вы спонсировали [Concept('merchant', 'торговую')|E] [Concept('company', 'компанию')|E] в течение последних 5 лет"
 gdp_sponsor_merchant_company_decision_candidate_tt: "В вашей [Concept('capital', 'столице')|E] есть взрослый и здоровый [Concept('courtier', 'придворный')|E], который не является [Concept('lowborn', 'худородным')|E], не [Concept('heir', 'наследует')|E] никаких [Concept('title', 'титулов')|E], а также не является вашим родителем, ребёнком, братом, сестрой, [Concept('spouse', 'супругом')|E] или [Concept('concubine', 'сожителем')|E]"
 gdp_sponsor_merchant_company_decision_effect_tt: "Укажите, сколько [Concept('gold', 'золота')|E] вы вложите в новую [Concept('company', 'компанию')|E], которую возглавит [sponsored_courtier.GetShortUIName|V]. От этой инвестиции будет зависеть начальный [Concept('company_size', 'размер компании')|E]"
 gdp_sponsor_merchant_company_decision_costs_tt: "Стоимость каждого [Concept('company_size', 'размера компании')|E]:\n$BULLET_WITH_TAB$[GetLaw('company_size_small').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_small_value')|0]\n$BULLET_WITH_TAB$[GetLaw('company_size_medium').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_medium_value')|0]\n$BULLET_WITH_TAB$[GetLaw('company_size_large').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_large_value')|0]\n$BULLET_WITH_TAB$[GetLaw('company_size_huge').GetName]: @gold_icon![SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_huge_value')|0]"
 gdp_sponsor_merchant_company_size_small_tt: "Вы обеспечите [GetLaw('company_size_small').GetName] [Concept('company_size', 'размер компании')|E]"
 gdp_sponsor_merchant_company_size_medium_tt: "Вы обеспечите [GetLaw('company_size_medium').GetName] [Concept('company_size', 'размер компании')|E]"
 gdp_sponsor_merchant_company_size_large_tt: "Вы обеспечите [GetLaw('company_size_large').GetName] [Concept('company_size', 'размер компании')|E]"
 gdp_sponsor_merchant_company_size_huge_tt: "Вы обеспечите [GetLaw('company_size_huge').GetName] [Concept('company_size', 'размер компании')|E]"
 gdp_decision.3010.t: "В компании, которой владеет [sponsored_courtier.GetNameNoTooltip]"
 gdp_decision.3010.desc: "«Я горжусь тем, что вы возложили на меня такую ответственность! Я оправдаю все вложенные [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] до единого!»\n\n[sponsored_courtier.GetNameNoTooltip] лучится энтузиазмом, хотя до того, как войти в комнату, [Select_CString( recipient.IsFemale, 'она', 'он' )] даже не [Select_CString( recipient.IsFemale, 'подозревала', 'подозревал' )], что станет моим доверенным приказчиком.\nПохоже, возможность получить начальный капитал для основания собственной компании была [Select_CString( recipient.IsFemale, 'её', 'его' )] заветной мечтой."
 gdp_decision.3010.a: "Для начала я выделю небольшую сумму."
 gdp_decision.3010.b: "Все основные расходы будут покрыты."
 gdp_decision.3010.c: "Внушительный капитал гарантирует успех."
 gdp_decision.3010.d: "Мы не будем экономить!"
 gdp_decision.3010.e: "Мы можем вернуться к этому вопросу позже."
 seek_trade_opportunity_decision: "Искать торговые возможности"
 seek_trade_opportunity_decision_desc: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] придёт к процветанию лишь в том случае, если мы всегда будем стремиться к успеху. Нужно искать новые сделки и не упускать ни единой возможности."
 seek_trade_opportunity_decision_tooltip: "Найти [Concept('trade_opportunity', 'торговую возможность')|E], чтобы укрепить деловую активность на [Concept('trade_route', 'торговом пути')|E] с помощью назначенного [Concept('trader','приказчика')|E]"
 seek_trade_opportunity_decision_confirm: "Загляните под каждый камень."
 seek_trade_opportunity_decision_route_tt: "Любой [Concept('trade_route', 'торговый путь')|E] с назначенным [Concept('trader','приказчиком')|E]"
 seek_trade_opportunity_decision_valid_tt: "На текущих [Concept('trade_routes', 'торговых путях')|E] нельзя создать подходящие [Concept('trade_opportunities', 'торговые возможности')|E]\n#help Все подходящие возможности либо уже созданы, либо восстанавливаются#!"
 seek_trade_opportunity_decision_effect_tt: "[Concept('trade_opportunity', 'Торговая возможность')|E] будет создана на [Concept('market','рынке')|E], находящемся на [Concept('route','пути')|E] с назначенным [Concept('trader','приказчиком')|E]"
 seek_trade_opportunity_decision_effect_perk_tt: "На [Concept('markets','рынках')|E], находящихся на [Concept('trade_routes','торговых путях')|E] с назначенными [Concept('trader','приказчиками')|E], будут созданы две [Concept('trade_opportunities', 'торговые возможности')|E]"
 merchant_caravaneer_capstone_decision: "Укрепить репутацию караванщиков"
 merchant_caravaneer_capstone_decision_desc: "Имя «[ROOT.Char.GetHouse.GetNameNoTooltip]» звучит в каждом селении на каждой дороге, что вьются по миру — на всех возможных языках."
 merchant_caravaneer_capstone_decision_tooltip: "Укрепить репутацию #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]их#! [Concept('merchant', 'торговцев')|E] как опытных караванщиков и надёжных поставщиков"
 merchant_caravaneer_capstone_decision_confirm: "Мы будем лучшими в своём деле"
 merchant_caravaneer_capstone_decision_travelogue_tt: "Вашей [Concept('company', 'компании')|E] станет доступно [Concept('decision', 'решение')|E] «[GetDecisionWithKey( 'merchant_write_travelogue_decision' ).GetName]»"
 merchant_caravaneer_capstone_decision_building_tt: "Вашей [Concept('company', 'компании')|E] становится доступно [Concept('domicile_building_upgrade', 'внутреннее улучшение')|E] «[GetDomicileBuilding('merchant_company_caravaneer_capstone_01').GetName]» для [Concept('domicile_building', 'постройки в имении')|E] «[GetDomicileBuilding('merchant_company_building_trade_01').GetName]»"
 domicile_building_parameter_company_can_commission_travelogues: "Ваша [Concept('company', 'компания')|E] может заказать [Concept('domicile_artifacts', 'артефакт имения')|E] — книгу о путешествиях"
 merchant_caravaneer_capstone_company_purpose_trigger: "У вас должна быть [Concept('company_purpose', 'специфика компании')|E] «[GetLaw('company_purpose_caravaneer').GetName]»"
 merchant_capstone_minimum_company_size_trigger: "[Concept('company_size', 'Размер')|E] вашей [Concept('company_size', 'компании')|E] должен быть как минимум на уровне #TOOLTIP:LAW,company_size_medium #L торгового предприятия#!#!"
 merchant_capstone_trade_expertise_trigger: "У вас должно быть как минимум #V 25#! ед. [Concept('expertise_level', 'познаний в торговле')|E] в какой-либо из категорий [Concept('trade_good', 'товаров')|E]"
 merchant_artisan_capstone_decision: "Укрепить репутацию ремесленников"
 merchant_artisan_capstone_decision_desc: "Под покровительством нашей компании производятся первоклассные товары, и великие правители со всего света прочёсывают рынки в поисках отличительных знаков дома [ROOT.Char.GetHouse.GetNameNoTooltip]."
 merchant_artisan_capstone_decision_tooltip: "Укрепить репутацию #L [ROOT.Char.GetPrimaryTitle.GetAdjective|l]их#! [Concept('merchant', 'торговцев')|E] как покровителей ремесленничества и опытных оценщиков"
