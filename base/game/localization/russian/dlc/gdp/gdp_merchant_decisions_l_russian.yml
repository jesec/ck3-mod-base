 merchant_artisan_capstone_decision_building_tt: "Вашей [Concept('company', 'компании')|E] становится доступно [Concept('domicile_building_upgrade', 'внутреннее улучшение')|E] «[GetDomicileBuilding('merchant_company_artisan_capstone_01').GetName]» для [Concept('domicile_building', 'постройки в имении')|E] «[GetDomicileBuilding('merchant_company_building_production_01').GetName]»"
