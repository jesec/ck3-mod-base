 merchant_write_travelogue_decision: "Написать книгу о путешествиях"
 merchant_write_travelogue_decision_desc: "Каждый житель владения [ROOT.Char.GetSuzerain.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] и всего остального света, будь то крестьянин или [ROOT.Char.GetSuzerain.GetTopLiege.GetTitleAsNameNoTooltip], жаждет услышать истории о далёких землях и удивительных народах."
 merchant_write_travelogue_decision_tooltip: "Начать работу над книгой о путешествиях — [Concept('artifact', 'артефактом')|E], в основу которого ляжет ваш опыт"
 merchant_write_travelogue_decision_confirm: "Я [Select_CString(ROOT.Char.IsFemale, 'повидала', 'повидал' )] такое, во что мало кто поверит"
 merchant_write_travelogue_decision_visited_poi_trigger: "Сначала нужно [Concept('traveled', 'посетить')|E] далёкую [Concept('point_of_interest', 'точку интереса')|E], о которой вы ещё #bold не#! написали книгу"
 travelogue_book_desc: "Будет написана новая книга о путешествии в далёкие земли, о необычных народах, что там обитают, и диковинных товарах, которые там можно найти."
 travelogue_effect_desc: "Этот [Concept('artifact', 'артефакт')|E] повысит [Concept('skills', 'навыки')], [Concept('trait_level_track_xp', 'опыт свойства')|E] и [prestige_i][Concept('prestige', 'престиж')|E]"
 writing_travelogue: "Написание книги о путешествиях"
 writing_travelogue_desc: "Этот персонаж сейчас занят написанием книги о путешествиях, в которой будет описан пережитый им опыт"
 wipe_slate_merchant_decision: "Начать с чистого листа"
 wipe_slate_merchant_decision_desc: "Неужели человек должен всю жизнь страдать за преступления, совершенные от отчаяния? Разве не все [ROOT.Char.GetFaith.GetAdherentNamePlural|l] могут встать на путь искупления?\n\nЕсли потратить достаточно времени, сил и, самое главное, #EMP денег#!, мир позабудет о любых грехах."
 wipe_slate_merchant_decision_tooltip: "Очистить свою репутацию, чтобы избавиться от свойства «[GetTrait('dealbreaker').GetName( GetNullCharacter )]»"
 wipe_slate_merchant_decision_confirm: "Я буду становиться лучше с каждым днем!"
 merchant_spending_spree_decision: "Закупиться от души"
 merchant_spending_spree_decision_desc: "Год за годом я взвешиваю, оцениваю и торгуюсь за товары, предназначенные другим, но не мне. Один день среди лавок с открытым кошелем и возможностью купить любую приглянувшуюся вещь пойдёт мне на пользу."
 merchant_spending_spree_decision_tooltip: "Свободно потратить [Concept('gold', 'золото')|E] на [Concept('market', 'рынке')|E], чтобы снизить [Concept('stress', 'стресс')|E] у себя и своих [Concept('associates', 'помощников')|E] и получить [Concept('prestige', 'престиж')|E] с шансом купить [Concept('domicile_artifact', 'артефакт имения')|E]"
 merchant_spending_spree_decision_tooltip_greedy: "Свободно потратить [Concept('gold', 'золото')|E] на [Concept('market', 'рынке')|E], чтобы снизить [Concept('stress', 'стресс')|E] у своих [Concept('associates_possessive', 'помощников')|E] и получить [Concept('prestige', 'престиж')|E] с шансом купить [Concept('domicile_artifact', 'артефакт имения')|E]"
 merchant_spending_spree_decision_confirm: "Денег не жалеть!"
 merchant_spending_spree_decision_associates_tt: "Ваши [Concept('associates', 'помощники')|E] теряют [stress_loss_i][Abs_CFixedPoint( GetPlayer.MakeScope.ScriptValue('medium_stress_impact_loss') )|P0] ед. [Concept('stress', 'стресса')|E]"
 merchant_spending_spree_decision_associates_tt_past: "Ваши [Concept('associates', 'помощники')|E] потеряли [stress_loss_i][Abs_CFixedPoint( GetPlayer.MakeScope.ScriptValue('medium_stress_impact_loss') )|P0] ед. [Concept('stress', 'стресса')|E]"
 merchant_spending_spree_decision_artifact_tt: "Шанс в #V 25%#! получить [Concept('domicile_artifact', 'артефакт имения')|E]"
 merchant_spending_spree_decision_artifact_gained_tt: "Вы получили [Concept('domicile_artifact', 'артефакт имения')|E]: [spending_spree_artifact.GetName] ([spending_spree_artifact.GetType])"
 craft_artifact_decision: "Создать артефакт"
 craft_artifact_decision_desc: "Одно дело покупать и продавать чужое, но чтобы по-настоящему прославиться, нужно привносить в этот мир новое и чудесное."
 craft_artifact_decision_effect: "К вашему двору прибывает [Concept('project', 'проект')|E]"
 craft_artifact_decision_tooltip: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('craft_artifact').GetTypeName]», чтобы получить [Concept('domicile_artifact', 'артефакт имения')|E]"
 craft_artifact_decision_confirm: "Начать создание артефакта"
