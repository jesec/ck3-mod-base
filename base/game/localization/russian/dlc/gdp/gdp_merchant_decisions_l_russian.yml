 craft_artifact_decision_option_curio_desc: "[AddTextIf( ROOT.Char.GetInventory.HasEquippedArtifactsInSlotType( 'curio' ), Concatenate( '\nСейчас выставлено:\n', ROOT.Char.GetInventory.GetEquippedArtifactsInSlotTypeString( 'curio', 'NEWLINE', 'NEWLINE', 'NEWLINE' ) ) )]"
 craft_curio_tooltip: "#T Диковинка#! \n$DESC$"
 craft_artifact_decision_curio_effect: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('craft_artifact').GetTypeName]», чтобы получить #V диковинку#! для [Concept('domicile_artifact', 'имения')|E]"
 craft_artifact_decision_option_library: "$book$\n#low Принадлежит: [ROOT.Char.GetInventory.GetNumberOfArtifactsForSlotTypeString( 'library' )]#!"
