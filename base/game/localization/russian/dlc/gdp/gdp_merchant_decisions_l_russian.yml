 craft_library_tooltip: "#T $library_slot$#! \n$DESC$"
 craft_artifact_decision_library_effect: "Начать [Concept('scheme', 'происки')|E] «[GetScheme('craft_artifact').GetTypeName]», чтобы получить #V книгу#! для [Concept('domicile_artifact', 'имения')|E]"
 CRAFT_ARTIFACT_DECISION_NEXT_STEP_BUTTON: "Выбрать артефакт"
 craft_artifact: "Создать артефакт"
 craft_artifact_action: "Создать артефакт"
 craft_artifact_desc: "Я попробую создать [Concept('domicile_artifact', 'артефакт имения')|E] [Concept('company', 'компании')|E]."
 craft_artifact_desc_general: "[Concept('scheme', 'Происки')|E] «Создать артефакт» — это [Concept('personal_scheme', 'личные происки')|E], в ходе которых вы и ваша [Concept('company', 'компания')|E] пытаетесь создать совершенно новый [Concept('domicile_artifact', 'артефакт имения')|E]. Главную роль в этих происках играет ваше [Concept('stewardship', 'управление')|E].\n\nНа [Concept('success_chance', 'шанс успеха')|E] влияет множество факторов, но прежде всего — ваш [Concept('stewardship_skill', 'навык «управление»')|E] и [Concept('aptitude', 'пригодность')|E] вашего сотрудника на должности «$antiquarian_merchant$»."
 CRAFT_ARTIFACT_SUCCESS_DESC: "Создать новый [Concept('domicile_artifact', 'артефакт имения')|E]"
 craft_artifact_invalidated_title: "Происки создания артефакта завершаются"
 craft_artifact_scheme.1000.t: "$craft_artifact$: успех"
 craft_artifact_scheme.1000.intro.curio: "Ночь за ночью я провожу в своей мастерской в обществе помощника или представителя местной гильдии, пытаясь что-то сотворить."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nНо сегодня я с уверенностью могу сказать, что работа принесла плоды! При взгляде на результат я невольно улыбаюсь, отмечая следы своего труда. Вопрос лишь в том, где это можно выставить."
 craft_artifact_scheme.1000.intro.library: "Ночь за ночью я сижу в своём кабинете и руками, заляпанными чернилами, пишу в авторском порыве при свете догорающей свечи."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nНо сегодня я с уверенностью могу сказать, что работа принесла плоды! При взгляде на результат я невольно улыбаюсь и думаю о тех, кто прочтёт мои тексты."
 craft_artifact_scheme.1000.desc.curator: "\n\nМой куратор [curator.GetFirstName] с горящими глазами осматривает работу. «Это #EMP подлинное#! достижение, [ROOT.Char.GetTitleAsNameNoTooltip|l]»."
 craft_artifact_scheme.1000.a: "Это того стоило."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nСоздатель: [ROOT.Char.GetTitledFirstName], [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nАвтор: [ROOT.Char.GetTitledFirstName], [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_scheme.2000.t: "$craft_artifact$: провал"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nКаждая попытка воплотить мой замысел разбивалась о неправильные расчёты или неверные движения, и комната завалена остатками неудачных попыток, не подлежащих восстановлению…"
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nКаждое утро пол засыпан смятыми записками, а оставшиеся заметки так или иначе не справляются с задачей претворить в жизнь мои намерения…"
 craft_artifact_scheme.2000.desc.curator: "\n\nКуратор [curator.GetFirstName], вздыхая, осматривает скромные плоды моих трудов. «Может, пора признать поражение?»"
 craft_artifact_scheme.2000.a: "Меня уже тошнит..."
 craft_artifact_scheme.2000.b: "...но моя работа не может пропасть втуне!"
