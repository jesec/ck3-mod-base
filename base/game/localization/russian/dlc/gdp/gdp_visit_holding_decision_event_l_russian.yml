 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "Вы уже во владении"
 gdp_visit_holding_decision_event.1340.t: "Отдых во владении [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1340.desc: "Мир торговли очень утомляет. Приходится обсуждать сделки и изображать фальшивые улыбки — время от времени надо как следует отдыхать от всего этого.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "Здесь, в чайной, я могу ненадолго забыть о заботах компании.\n\nТак приятно просто держать в руках чашечку свежезаваренного чая, от которого поднимается пар, и перекидываться ничего не значащими словами с завсегдатаями, обсуждая новости и последние сплетни."
 gdp_visit_holding_decision_event.1340.hashish: "Здесь, в гашишной, я могу ненадолго забыть о заботах компании.\n\nТак приятно просто сидеть в тишине и прохладе и перекидываться ничего не значащими словами с завсегдатаями, обсуждая новости и последние сплетни."
 gdp_visit_holding_decision_event.1340.drink: "Здесь, в таверне, я могу ненадолго забыть о заботах компании.\n\nТак приятно просто держать в руках кружку, в которой плещется [ROOT.Char.Custom('RegionalAlcoholicDrink')], и перекидываться ничего не значащими словами с завсегдатаями, обсуждая новости и последние сплетни."
 gdp_visit_holding_decision_event.1340.food: "Здесь, в пиршественном зале, я могу ненадолго забыть о заботах компании.\n\nТак приятно просто наслаждаться щедрыми угощениями, среди которых и моё любимое — [ROOT.Char.Custom('FavoriteTreat')], и перекидываться ничего не значащими словами с завсегдатаями, обсуждая новости и последние сплетни."
 gdp_visit_holding_decision_event.1340.bath: "Здесь, в бане, я могу ненадолго забыть о заботах компании.\n\nТак приятно просто нежиться в целительных водах и перекидываться ничего не значащими словами с завсегдатаями, обсуждая новости и последние сплетни."
 gdp_visit_holding_decision_event.1340.a: "Надо бы отдыхать почаще."
