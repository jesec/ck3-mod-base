l_russian:
 gdp_visit_holding_decision: "Посетить владение"
 gdp_visit_holding_decision_tooltip: "$visit_local_settlement_decision_tooltip$\n[ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasWorship')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasWorship')]"
 gdp_visit_holding_decision_confirm: "За дело!"
 gdp_visit_holding_decision_desc: "Кто ищет, тот найдёт возможность. Это [ROOT.Char.Custom('LocalHoldingTypeConcept')|l] [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] полно потенциала! Нас ждут новые клиенты, контракты и сделки."
 gdp_visit_holding_decision_effect_intro: "Вам может выдаться возможность:"
 gdp_visit_holding_decision_effect_artifact: "\n$EFFECT_LIST_BULLET$ Улучшить или купить [artifact_i][artifacts|El]"
 gdp_visit_holding_decision_effect_guild: "\n$EFFECT_LIST_BULLET$ Увеличить свои [skill_i][Concept('skills', 'навыки')|E] или навыки [family_i][Concept('family', 'членов семьи')|E]"
 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$ Увеличить свою [competitiveness_i][Concept('trade_competitiveness', 'конкурентоспособность')|E]"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$ Обменять [gold_i][gold|El] на [prestige_i][prestige|El]"
 gdp_visit_holding_decision_effect_recruit: "\n$EFFECT_LIST_BULLET$ Встретить и нанять новых [associate_i][Concept('associates', 'помощников')|E]"
 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$ Получить [luxury_contract_i][Concept('luxury_contracts', 'эксклюзивные договоры')|E]"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$ Снизить [stress_loss_i][Concept('stress', 'стресс')|E]"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$ $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$ $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$ $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak Места, где ещё остались возможности:#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$Гильдии"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$Рынок"
 VISIT_HOLDING_DECISION_AVAILABLE_DOCKS: "\n$EFFECT_LIST_BULLET$Доки"
 VISIT_HOLDING_DECISION_AVAILABLE_PATRON: "\n$EFFECT_LIST_BULLET$Двор, где правит [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]"
 VISIT_HOLDING_DECISION_AVAILABLE_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 VISIT_HOLDING_DECISION_EXHAUSTED_AREAS_HEADER: "\n#weak Эти места станут вновь доступны через:#!"
 VISIT_HOLDING_DECISION_EXHAUSTED_GUILDS: "\n$EFFECT_LIST_BULLET$Гильдии — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$Рынок — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$Доки — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$Двор, где правит [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "Это [ROOT.Char.Custom('LocalHoldingTypeConcept')|l] не может предложить вам ничего нового. Новые возможности станут доступны после [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "[ROOT.Char.Custom('LocalHoldingTypeCapitalized')] [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1000.desc: "Солнце встаёт, а с ним и [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Утренняя тишина уступает место оживлённой болтовне людей, живущих своей повседневной жизнью. Внимательный наблюдатель сможет найти возможности на каждом углу оживлённых улиц.\n\nКуда бы мне отправиться сегодня?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "Уроки перевалочного пункта"
 gdp_visit_holding_decision_event.1000.a: "Я отправлюсь в гильдии"
 gdp_visit_holding_decision_event.1000.a.tt: "Визит в гильдии может открыть следующие возможности: $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "Вы уже рассмотрели все возможности в гильдиях. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "Вы уже рассмотрели все возможности на рынке. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "Вы уже рассмотрели все возможности в доках. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "Вы уже использовали все возможности, что предлагает двор, где правит [THIS.Char.GetSuzerain.GetTitledFirstNameNoTooltip]. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "У вас нет покровителя, у которого можно просить аудиенции"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "Вы уже рассмотрели все возможности, которые предлагает [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]. Возвращайтесь после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 gdp_visit_holding_caught_stealing.tt: "Недавно вас поймали за кражей в святом месте. Вернуться туда можно не раньше [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]"
 gdp_visit_holding_decision_event.1000.b: "Надеюсь, [patron.GetTitledFirstNameNoTooltip] предоставит мне аудиенцию."
 gdp_visit_holding_decision_event.1000.c: "Отличный день, чтобы сходить на рынок."
 gdp_visit_holding_decision_event.1000.c.tt: "Визит на местный рынок может открыть следующие возможности: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "Отличный день для прогулки в доки."
 gdp_visit_holding_decision_event.1000.e.tt: "Визит в доки может открыть следующие возможности: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] с окрестностями выглядят любопытно."
 gdp_visit_holding_decision_event.1000.f.tt: "Визит в место богослужения может открыть следующие возможности: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_cure$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$ Пожертвовать [gold_i][gold|El], чтобы получить [piety_i][piety|El]"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$ Улучшить свое [Concept('health', 'здоровье')|E] или вылечить [Concept('diseases', 'болезни')|E]"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$ Получить благословение в виде [Concept('character_modifier', 'модификатора персонажа')|E]"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ Украсть [gold_i][gold|El] из пожертвований"
 gdp_visit_holding_decision_event.1000.d: "Думаю, на сегодня с меня хватит дел."
 gdp_visit_holding_decision_event.1000.d.tt: "Пока вернуться домой"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "«Пожалуй, не стоит»."
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Уйти, не исследуя это [ROOT.Char.Custom('LocalHoldingTypeConcept')|l]"
 gdp_visit_holding_decision_event.1000.d.exhausted: "Похоже, тут ещё есть чем заняться…"
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Вернуться домой. Новые возможности станут доступны после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Ваше [Concept('domicile', 'имение')|E] сейчас находится не в державе вашего [Concept('merchant_patrons','покровителя')|E]"
 gdp_visit_holding_decision_event.1110.t: "Посетить гильдии владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1110.desc: "Удары молота по металлу гулко разносятся по улице гильдий. Дальше по улице молодой подмастерье несёт инструменты своего мастера в гончарную мастерскую. Многие поколения гильдии превращали подмастерий в опытных ремесленников.\n\nГильдии могут предложить множество услуг любому торговцу. Куда мне направиться сегодня?"
 gdp_visit_holding_decision_event.1110.a: "Нужно отполировать один из моих артефактов."
 gdp_visit_holding_decision_event.1110.a.tt: "Визит к куратору может открыть следующие возможности:\n$EFFECT_LIST_BULLET$ Улучшение ваших обычных и мастерских @artifact_icon![Concept('artifacts', 'артефактов')|E]"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "Вы недавно пользовались услугами куратора — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "У вас нет мастерских [Concept('artifacts', 'артефактов')|E]"
 gdp_visit_holding_decision_event.1110.b: "Имею желание купить новые оружие и доспехи."
 gdp_visit_holding_decision_event.1110.b.tt: "Посещение кузнеца может открыть следующие возможности:\n$EFFECT_LIST_BULLET$ Покупка обычных, мастерских или знаменитых @artifact_icon![Concept('artifacts', 'артефактов')|E] оружия или брони"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "Вы недавно что-то купили у кузнеца — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.c: "Нужно договориться о встрече с главой гильдии."
 gdp_visit_holding_decision_event.1110.c.tt: "Встреча с главой гильдии может открыть следующие возможности:$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "Вы недавно встречались с главой гильдии — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]"
 gdp_visit_holding_decision_event.1110.d: "Может стоит пойти в другое место?"
 gdp_visit_holding_decision_event.1110.d.tt: "Покинуть пока гильдии"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: куратор"
 gdp_visit_holding_decision_event.1111.desc: "Уже при входе в мастерскую куратора меня встречает многообразие предметов со всех краёв света. У мастерской в противоположном конце помещения стоит [Select_CString(curator.IsFemale, 'склонившаяся над кинжалом женщина, гравирующая', 'склонившийся над кинжалом мужчина, гравирующий')] его рукоять великолепными самоцветами. Пока я рассматриваю одно из выставленных украшений, [Select_CString(curator.IsFemale, 'она', 'он')] отвлекается от своего занятия.\n\n«Ах, потенциальный покупатель! Чем я могу помочь вам, [ROOT.Char.GetTitledFirstNameNoTooltip]?»"
 gdp_visit_holding_decision_event.1111.a: "Возможно, [artifact_target_1.GetNameNoTooltip] выиграет от полировки?"
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName] получит улучшение"
 gdp_visit_holding_decision_event.1111.b: "Пожалуй, [artifact_target_2.GetNameNoTooltip] заслуживает внимания."
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName] получит улучшение"
 gdp_visit_holding_decision_event.1111.c: "Полагаю, [artifact_target_3.GetNameNoTooltip] оставляет желать лучшего."
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName] получит улучшение"
 gdp_visit_holding_decision_event.1111.d: "Пожалуй, зайду попозже…"
 gdp_visit_holding_decision_event.1111.d.tt: "Вернуться в гильдии и посмотреть, что ещё может предложить [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: кузнец"
 gdp_visit_holding_decision_event.1112.desc: "На входе в кузнечную мастерскую меня встречает почти невыносимый жар кузни. Кузнец, [Select_CString(blacksmith.IsFemale, 'ковавшая', 'ковавший')] меч, оборачивается, услышав моё приближение. Утирая со лба смесь пота и сажи, [Select_CString(blacksmith.IsFemale, 'она', 'он')] переключает своё внимание на меня.\n\n«Ну и кто ко мне пожаловал? Не желаете ли приобрести хорошие оружие и доспехи, [ROOT.Char.GetTitleAsNameNoTooltip|l]? У меня лучшее качество в этих краях»."
 gdp_visit_holding_decision_event.1112.a: "[arms_armor_artifact_1.GetNameNoTooltip] станет отличным приобретением."
 gdp_visit_holding_decision_event.1112.b: "Пожалуй, [arms_armor_artifact_2.GetNameNoTooltip] мне не помешает."
 gdp_visit_holding_decision_event.1112.c: "[arms_armor_artifact_3.GetNameNoTooltip] мне не помешает."
 gdp_visit_holding_decision_event.1112.d: "Хотя, если подумать, в другой раз."
 gdp_visit_holding_decision_event.1112.d.tt: "Вернуться в гильдии и посмотреть, что ещё может предложить [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: наставления главы гильдии"
 gdp_visit_holding_decision_event.1113.desc: "Встреча с главой гильдии по имени [guild_master.GetName] пошла на пользу компании [ROOT.Char.GetHouse.GetName]. Время пролетело незаметно в пыльном кабинете, полном бумаг и книг.\n\n[guild_master.GetNameNoTooltip] отлично разбирается в таком вопросе, как [guild_master.Custom('highest_skill_noun')]. И я, и [Select_CString(visiting_associate.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))] [visiting_associate.GetName] с восторгом слушали [Select_CString(guild_master.IsFemale, 'её', 'его' )], надеясь узнать как можно больше."
 gdp_visit_holding_decision_event.1113.a.success: "Вы и [visiting_associate.GetName] легко осваиваете новые знания"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Расшифровка древних манускриптов оказалась непростой задачей"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "Уравнения оказываются слишком сложными, вы и [visiting_associate.GetName] путаетесь в них"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Масштабные дипломатические игры слишком сложны для понимания"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "Вы не усвоили урок."
 gdp_visit_holding_decision_event.1113.a: "«Возможно, я и [visiting_associate.GetNameNoTooltip] могли бы задержаться подольше?»"
 gdp_visit_holding_decision_event.1113.a.child: "Благодаря этому уроку [visiting_associate.GetName] сможет получить лучшее образование"
 gdp_visit_holding_decision_event.1113.b: "«[visiting_associate.GetFirstNameNoTooltip] нуждается в ещё одном уроке»."
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName] даст [Select_CString(visiting_associate.IsFemale, 'ей', 'ему' )] дополнительный урок на тему:"
 gdp_visit_holding_decision_event.1113.c: "«Интересно, нужно немедленно это записать!»"
 gdp_visit_holding_decision_event.1113.c.tt: "Знания, которыми обладает [guild_master.GetName], пригодятся компании [THIS.Char.GetHouse.GetName]"
 gdp_visit_holding_decision_event.1113.d: "На сегодня хватит."
 gdp_visit_holding_decision_event.1113.d.tt: "Вернуться в гильдии и посмотреть, что ещё может предложить [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1300.t: "Посетить рынок владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1300.asia: "Здесь, как и на всех рынках на великом шёлковом пути, хватает дорогих товаров, вроде нефрита, шёлка и чая.\n\nПосреди оживлённой улицы какой-то мужчина аккуратно разгружает хрупкие фарфоровые вазы. Подле него стоит иноземный купец в ярких одеждах, намеревающийся купить одну из них."
 gdp_visit_holding_decision_event.1300.mena_india: "Яркие ткани и узорная керамика красят пыльные улочки. В воздухе разносится приятный запах благовоний и пряностей.\n\nВ тёмном углу стоит лоточник и безуспешно пытается втюхать свои качественные медные тарелки скептически настроенному прохожему. Самое время поторговаться."
 gdp_visit_holding_decision_event.1300.default: "Аромат свежих продуктов смешивается с запахами собравшейся толпы. Лоточники на переполненной площади так и норовят перекричать друг друга.\n\n «[ROOT.Char.Custom('RegionalDrink')|U]! Особое предложение, только сегодня!» «Последний шанс! [ROOT.Char.Custom('RegionalEdibleMeat')|U]! Свежайшее мясо».\n\n"
 gdp_visit_holding_decision_event.monk_hint: "Мужчина выходит из чайной неподалёку, понурив голову и бормоча что-то о дурных предзнаменованиях. Похоже, внутри кто-то предсказывает будущее."
 gdp_visit_holding_decision_event.monk_hint_return: "В чайной стало тише, но [Select_CString(monk.IsFemale, 'монахиня-предсказательница', 'монах-предсказатель' )] всё ещё на месте."
 gdp_visit_holding_decision_event.caravaneer_hint: "По улице тянется вереница потрёпанных караванов. Местные стойла едва справляются с наплывом торговцев."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "Караваны всё ещё стоят на месте. [Select_CString(caravaneer.IsFemale, 'Караванщица', 'Караванщик')] по-прежнему среди вьючных животных и, похоже, чего-то ждёт."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\nГоворят, сегодня один особенно опытный капитан набирает пассажиров на свой корабль."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\nКапитан всё ещё принимает пассажиров, а толпа у корабля ничуть не поредела."
 gdp_visit_holding_decision_event.carnival_jester_hint: "Я невольно слышу, как один торговец жалуется на [Select_CString(carnival_jester.IsFemale, 'уличную артистку, которая', 'уличного артиста, который')] отвлекает его постоянных покупателей."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "[Select_CString(carnival_jester.IsFemale, 'Уличная артистка', 'Уличный артист')] по-прежнему удерживает внимание толпы, и торговцы по соседству этому вовсе не рады."
 gdp_visit_holding_decision_event.cook_hint: "Замечаю, что у многих прохожих в руках [ROOT.Char.Custom('FavoriteTreat')]. От одного из них я слышу, что какой-то пекарь неподалёку раздаёт выпечку бесплатно."
 gdp_visit_holding_decision_event.cook_hint_return: "Пекарь всё ещё не [Select_CString(cook.IsFemale, 'закрыла', 'закрыл' )] свою лавку."
 gdp_visit_holding_decision_event.1300.desc.fallback: "Монеты и товары тут и там переходят из рук в руки. Рынок полон возможностей."
 gdp_visit_holding_decision_event.1300.a: "Интересно, какие вести принесли иноземные купцы?"
 gdp_visit_holding_decision_event.1300.a.tt: "Подслушивание может открыть следующую возможность:$gdp_visit_holding_decision_effect_contracts$"
 gdp_visit_holding_decision_event.1300.a.cooldown.tt: "Вы уже создавали контракты недавно — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1310_has_created_contract_recently') )]"
 gdp_visit_holding_decision_event.1300.b: "Нужно присмотреться к потенциальным осведомителям."
 gdp_visit_holding_decision_event.1300.b.cooldown.tt: "Вы уже пытались недавно нанять помощников — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_recruited_recently') )]"
 gdp_visit_holding_decision_event.1300.b.tt: "Осмотр рынка может открыть следующую возможность:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1300.c: "Может стоит пойти в другое место?.."
 gdp_visit_holding_decision_event.1300.d: "Что уготовила мне судьба?"
 gdp_visit_holding_rare_spawn_alert.tt: "@alert_icon! #alert_trial Этот персонаж появляется редко, вы сможете увидеть его всего один раз в жизни!#!"
 gdp_visit_holding_decision_event.1300.d.tt: "Поговорить с [Select_CString(monk.IsFemale, 'монахиней', 'монахом' )]\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.d_second: "Я всё же выслушаю, что скажет [monk.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1300.c.tt: "Уйти пока с рынка"
 gdp_visit_holding_decision_event.1300.g: "Надо бы взглянуть на караваны."
 gdp_visit_holding_decision_event.1300.g.tt: "Поговорить с [Select_CString(caravaneer.IsFemale, 'караванщицей', 'караванщиком')]\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.g_second: "Караваны ещё ждут."
 gdp_visit_holding_decision_event.1300.h: "[Select_CString(carnival_jester.IsFemale, 'Эта артистка собрала', 'Этот артист собрал')] вокруг себя немало людей."
 gdp_visit_holding_decision_event.1300.h.tt: "Поговорить с [Select_CString(carnival_jester.IsFemale, 'артисткой', 'артистом')]\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.h_second: "Где [carnival_jester.GetFirstNameNoTooltip]? Надо поймать [Select_CString(carnival_jester.IsFemale, 'её', 'его')], пока толпа не разошлась."
 gdp_visit_holding_decision_event.1300.i: "Вкусняшки... да ещё и бесплатно?"
 gdp_visit_holding_decision_event.1300.i.tt: "Поговорить с пекарем\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1300.i_second: "Пекарь всё ещё раздаёт булочки."
 gdp_visit_holding_decision_event.1300.j_tea: "Стоит заглянуть в местную чайную..."
 gdp_visit_holding_decision_event.1300.j_hashish: "Думаю, самое время для гашиша..."
 gdp_visit_holding_decision_event.1300.j_drink: "Стоит заглянуть в местную таверну..."
 gdp_visit_holding_decision_event.1300.j_food: "Думаю, самое время хорошенько перекусить..."
 gdp_visit_holding_decision_event.1300.j_bath: "Стоит заглянуть в местную баню."
 gdp_visit_holding_decision_event.1300.j.tt: "Сбросить накопившийся [stress_loss_i][Concept('stress', 'стресс')|E]"
 gdp_visit_holding_decision_event.1300.j.associate.tt: "[visiting_associate.GetShortUIName] теряет [Concept('stress', 'стресс')|E]"
 gdp_visit_holding_decision_event.1300.j.cooldown.tt: "Недавно вы уже отдыхали — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_relaxed_recently') )]"
 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$: поиск возможностей"
 gdp_visit_holding_decision_event.1310.desc: "В последнее время до меня доходит много историй об иноземных зверях и богатствах. Сегодня я прочешу рынок в поисках кого-нибудь, кто мог бы побольше рассказать мне об этих слухах.\n\nСреди торговцев мне встречается [Select_CString(foreigner.IsFemale, 'женщина', 'мужчина')] со странным иноземным акцентом, гордо [Select_CString(foreigner.IsFemale, 'рассказывающая', 'рассказывающий')] скучающему местному торговцу о своих подвигах в далёких землях. Возможно, это бахвальство, а быть может в [Select_CString(foreigner.IsFemale, 'её', 'его')] историях есть доля правды? Возможно, немного золота хватит, чтобы разговорить [Select_CString(foreigner.IsFemale, 'её', 'его')]…"
 spawn_merchant_contract_interaction_duplicate_tt: "У вас уже есть принятый или доступный [Concept('task_contract', 'контракт')|E] этого типа"
 spawn_merchant_contract_interaction_route_tt: "У вас нет активных [Concept('trade_routes', 'торговых путей')|E] с назначенным [Concept('trader', 'приказчиком')|E]"
 spawn_merchant_contract_interaction_cooldown_tt: "Этот тип [Concept('task_contract', 'контракта')|E] временно недоступен"
 gdp_visit_holding_decision_event.1310.a: "Я хочу больше узнать об этих экзотических животных."
 gdp_visit_holding_decision_event.1310.a.tt: "На карте появится [luxury_contract_i][Concept('luxury_contract', 'эксклюзивный договор')|E] «[Concept('menagerie', 'Зверинец')|E]»"
 gdp_visit_holding_decision_event.1310.b: "Мне было бы любопытно узнать о покупке диковинок."
 gdp_visit_holding_decision_event.1310.b.tt: "На карте появится [luxury_contract_i][Concept('luxury_contract', 'эксклюзивный договор')|E] «[Concept('curio', 'Диковинка')|E]»"
 gdp_visit_holding_decision_event.1310.c: "Лучше вложиться в компанию [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_visit_holding_decision_event.1310.c.tt: "На карте появится [trade_opportunity_i][Concept('trade_opportunity', 'торговая возможность')|E] в зависимости от [Concept('company_purpose', 'специфики компании')|E]"
 gdp_visit_holding_decision_event.1310.d: "Лучше я сегодня займусь чем-нибудь другим…"
 gdp_visit_holding_decision_event.1320.t_market: "$gdp_visit_holding_decision_event.1300.t$: поиск рекрутов"
 gdp_visit_holding_decision_event.1320.t_docks: "$gdp_visit_holding_decision_event.1400.t$: поиск рекрутов"
 gdp_visit_holding_decision_event.1320.desc: "Окинув взглядом толпу, я замечаю троих возможных кандидатов!"
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "Толпа собирается вокруг, заворожённая блеском серебра. Ловкость рук, которую демонстрирует [ROOT.Char.GetName], заставляет людей выстроиться в очередь, словно овец на заклание."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "[Select_CString(ROOT.Char.IsFemale, 'Крепко сложенная', 'Крепко сложенный')] [ROOT.Char.GetFirstName] в потрёпанных доспехах прислоняется к стене и беспокойно подбрасывает кинжал."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName] осматривает прилавки один за другим, тщательно занося всё примечательное в свою учётную книжку."
 gdp_visit_holding_decision_event.1320.traveler.desc: "[ROOT.Char.GetFirstName] в чужеземном наряде пытается уладить спор между двумя торговцами — используя при этом ломаный [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]!"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName] крадётся в тени, прижимая одной рукой свёрток с младенцем и вытягивая другую — в поисках следующей ничего не подозревающей жертвы."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "Склонившись над раненым караванщиком, [ROOT.Char.GetFirstName] быстро готовит целебную припарку из растущих поблизости трав."
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip] — неплохой выбор."
 gdp_visit_holding_decision_event.1320.option.tt: "Вы сможете нанять персонажа [THIS.Char.GetFirstName] в качестве [Concept('associate', 'помощника')|E], сделав следующее:"
 gdp_visit_holding_decision_event.1320.no_gold.tt: ""
 gdp_visit_holding_decision_event.1320.option.money.tt: "$BULLET$Заплатить @gold_icon![Concept('gold', 'золотом')|E]"
 gdp_visit_holding_decision_event.1320.charlatan.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Убедить [Concept('skill_challenge_no_prefix', 'проверкой навыка')|E] @skill_intrigue_icon! [Concept('intrigue', 'интриги')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.hired_muscle.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Убедить [Concept('skill_challenge_no_prefix', 'проверкой навыков')|E] @skill_prowess_icon![Concept('prowess', 'доблести')|E] и @skill_martial_icon![Concept('martial', 'военного дела')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.numerate.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Убедить [Concept('skill_challenge_no_prefix', 'проверкой навыка')|E] @skill_stewardship_icon![Concept('stewardship', 'управления')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.traveler.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Убедить [Concept('skill_challenge_no_prefix', 'проверкой навыка')|E] @skill_diplomacy_icon![Concept('diplomacy', 'дипломатии')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.urchin.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Убедить [Concept('skill_challenge_no_prefix', 'проверкой навыка')|E] @skill_intrigue_icon![Concept('intrigue', 'интриг')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.herbalist.tt: "$gdp_visit_holding_decision_event.1320.option.tt$\n$BULLET$Убедить [Concept('skill_challenge_no_prefix', 'проверкой навыка')|E] @skill_learning_icon![Concept('learning', 'учёности')|E]\n$gdp_visit_holding_decision_event.1320.option.money.tt$"
 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip] выглядит многообещающе."
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip] привлекает моё внимание."
 gdp_visit_holding_decision_event.1320.d: "Меня никто не заинтересовал…"
 gdp_visit_holding_decision_event.1320.d.tt: "Вернуться на рынок и посмотреть, что ещё может предложить [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1320.e: "Меня никто не заинтересовал…"
 gdp_visit_holding_decision_event.1320.e.tt: "Вернуться в доки и посмотреть, что ещё может предложить [THIS.Char.GetCurrentLocation.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1320.tt: "Вернуться и посмотреть, есть ли другие интересные рекруты"
 gdp_visit_holding_decision_event.1321.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1321.t: "Шарлатан"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName] приглашает меня подойти ближе. Взмахнув рукой, [Select_CString(charlatan_recruit.IsFemale, 'она', 'он')] объявляет:\n\n«Что ж… похоже, у нас есть доброволец! Если вы угадаете, какой стороной упадёт монета, вас ждёт щедрая награда».\n\nЛёгким движением запястья [Select_CString(charlatan_recruit.IsFemale, 'она', 'он')] заставляет монету исчезнуть. Толпа молчаливо ждёт, что я буду делать."
 gdp_visit_holding_decision_event.1321.a: "У вас, #EMP очевидно#!, есть фальшивая монета в рукаве."
 gdp_visit_holding_decision_event.1321.a.success: "Вам удаётся разоблачить обман"
 gdp_visit_holding_decision_event.1321.a.failure: "Вам не удаётся разоблачить обман"
 gdp_visit_holding_decision_event.1321.b: "Ловкий обман. Вам стоит работать на меня."
 gdp_visit_holding_decision_event.1321.b.tt: "[charlatan_recruit.GetFirstNameNoTooltip] [Select_CString(charlatan_recruit.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![charlatan_recruit_cost|V0] [Concept('gold', 'золотых')|E], но у вас нет таких денег"
 gdp_visit_holding_decision_event.1321.c: "У меня нет времени на фокусы…"
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1322.t: "Бывалый головорез"
 gdp_visit_holding_decision_event.1322.desc: "Я подхожу ближе и чувствую, как [hired_muscle_recruit.GetFirstName] окидывает меня оценивающим взглядом.\n\n«Ты что, не знаешь, на кого пялишься? [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] не знает лучшего воина, чем я. Наглости тебе не занимать, коль думаешь, что [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] вроде тебя сможет побить меня в драке».\n\n[Select_CString(hired_muscle_recruit.IsFemale,'Она','Он')] зловеще грозит кулаком в мою сторону."
 gdp_visit_holding_decision_event.1322.a: "Я заставлю [Select_CString(hired_muscle_recruit.IsFemale,'её','его')] проглотить свои слова!"
 gdp_visit_holding_decision_event.1322.a.success: "[hired_muscle_recruit.GetFirstName] [Select_CString(hired_muscle_recruit.IsFemale, 'побеждена', 'побеждён')] вами"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName] побеждает вас"
 gdp_visit_holding_decision_event.1322.b: "Сражайся лучше за меня."
 gdp_visit_holding_decision_event.1322.b.tt: "[hired_muscle_recruit.GetFirstNameNoTooltip] [Select_CString(hired_muscle_recruit.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![hired_muscle_recruit_cost|V0] [Concept('gold', 'золотых')|E], но у вас нет таких денег"
 gdp_visit_holding_decision_event.1322.c: "Думаю, мне лучше уйти…"
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1323.t: "Учёный-счетовод"
 gdp_visit_holding_decision_event.1323.desc: "С головой закопавшись в свою книгу, [numerate_recruit.GetFirstName] практически не замечает меня, пока я не подхожу вплотную. [Select_CString(numerate_recruit.IsFemale,'Она', 'Он')] поднимает глаза на меня с задумчивым выражением на лице.\n\n«Вы производите впечатление [Select_CString(ROOT.Char.IsFemale, 'сообразительной женщины', 'сообразительного человека')]. Возможно, вы могли бы помочь мне с моей маленькой проблемой?»\n\n[Select_CString(numerate_recruit.IsFemale,'Она', 'Он')] показывает мне таблицу, аккуратно заполненную числами и подсчётами. Похоже, это учётная книга доходов и расходов прилавков."
 gdp_visit_holding_decision_event.1323.a: "Смотрите, если переместить эти числа сюда…"
 gdp_visit_holding_decision_event.1323.a.success: "Вы решаете уравнение"
 gdp_visit_holding_decision_event.1323.a.failure: "Вам не удаётся решить уравнение"
 gdp_visit_holding_decision_event.1323.b: "Как вы смотрите на то, чтобы вести такие же расчёты для #EMP моей#! компании?"
 gdp_visit_holding_decision_event.1323.b.tt: "[numerate_recruit.GetFirstNameNoTooltip] [Select_CString(numerate_recruit.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![numerate_recruit_cost|V0] [Concept('gold', 'золотых')|E], но у вас нет таких денег"
 gdp_visit_holding_decision_event.1323.c: "Хотя, если подумать…"
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1324.t: "Опытный путешественник"
 gdp_visit_holding_decision_event.1324.desc: "Напряжённость в отношениях между двумя торговцами достигла точки кипения. [traveler_recruit.GetFirstName] пытается смягчить конфликт, подчёркивая это всем своим видом. Несмотря на свой ломанный #L [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|l]ий#!, [Select_CString(traveler_recruit.IsFemale, 'она', 'он' )] отчасти добивается успеха. Достойная попытка для человека, слабо знакомого с местной культурой.\n\nНи один из торговцев не в силах понять, говорит [Select_CString(traveler_recruit.IsFemale, 'она', 'он' )] о качестве, товарах или вовсе о посторонних вещах, и спор затихает сам собой."
 gdp_visit_holding_decision_event.1324.a: "«Позвольте помочь вам найти общий язык»."
 gdp_visit_holding_decision_event.1324.a.success: "Ваше толкование оказалось убедительным"
 gdp_visit_holding_decision_event.1324.a.failure: "Ваше вмешательство пришлось некстати"
 gdp_visit_holding_decision_event.1324.b: "Мне бы пригодился человек с вашим опытом."
 gdp_visit_holding_decision_event.1324.b.tt: "[traveler_recruit.GetFirstNameNoTooltip] [Select_CString(traveler_recruit.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![traveler_recruit_cost|V0] [Concept('gold', 'золотых')|E], но у вас нет таких денег"
 gdp_visit_holding_decision_event.1324.c: "Мне лень…"
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1325.t: "[Select_CString(urchin_recruit.IsFemale, 'Беспризорник', 'Беспризорница')]"
 gdp_visit_holding_decision_event.1325.desc: "Я уже не раз видел подобные уловки, поэтому подхожу к [Select_CString(urchin_recruit.IsFemale, 'девочке', 'мальчику')] осторожно. Но едва я успеваю открыть рот, как худая рука сунула мне в руки свёрток.\n\n— [Select_CString(ROOT.Char.IsFemale, 'Добрая госпожа', 'Добрый господин')], не поделитесь ли едой со мной и малышом?\n\n[Select_CString(urchin_recruit.IsFemale, 'Её', 'Его')] вторая рука уже шарит у меня в кошеле. Свёрток выскальзывает из моих рук и падает на землю. Как я и подозревал, внутри одеяла оказываются лишь три камня. Обман незамысловатый, зато наглости [Select_CString(urchin_recruit.IsFemale, 'девчонке', 'сорванцу')] не занимать."
 gdp_visit_holding_decision_event.1325.a: "А ну прочь от моего кошеля!"
 gdp_visit_holding_decision_event.1325.a.success: "Вам удается поймать вора"
 gdp_visit_holding_decision_event.1325.a.failure: "Вы недостаточно быстры"
 gdp_visit_holding_decision_event.1325.b: "Моей компании как раз не хватает ловких рук."
 gdp_visit_holding_decision_event.1325.b.tt: "[urchin_recruit.GetFirstNameNoTooltip] [Select_CString(urchin_recruit.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![urchin_recruit_cost|V0] [Concept('gold', 'золотых')|E], но у вас нет таких денег"
 gdp_visit_holding_decision_event.1325.c: "С меня хватит!"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1326.t: "[Select_CString(herbalist_recruit.IsFemale, 'Травница', 'Травник')]"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName] не обращает на меня ни малейшего внимания, пока я подхожу ближе. [Select_CString(herbalist_recruit.IsFemale, 'Она', 'Он')] заворожённо следит за движениями пестика, превращающего растёртые ингредиенты в однородную массу.\n\n— Сначала [ROOT.Char.Custom('Abortifacient“)]… Затем, пожалуй, [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type“)]… Для варки — [ROOT.Char.Custom('RegionalDrink')]. Да… должно сработать. Как вы думаете?\n\nПочти не замечая моего присутствия, [Select_CString(herbalist_recruit.IsFemale, 'она', 'он')] поворачивается ко мне и подносит ступку к моему носу. Меня тут же обдаёт резким, едким запахом."
 gdp_visit_holding_decision_event.1326.a: "#EMP Хмм#!, [ROOT.Char.Custom('Abortifacient')] — хороший выбор. Думаю, надо добавить ещё."
 gdp_visit_holding_decision_event.1326.a.success: "Ваш совет оказался полезным"
 gdp_visit_holding_decision_event.1326.a.failure: "Ваш совет оказался бесполезным"
 gdp_visit_holding_decision_event.1326.b: "Мне бы очень пригодился человек с вашими навыками."
 gdp_visit_holding_decision_event.1326.b.tt: "[herbalist_recruit.GetFirstNameNoTooltip] [Select_CString(herbalist_recruit.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![herbalist_recruit_cost|V0] [Concept('gold', 'золотых')|E], но у вас нет таких денег"
 gdp_visit_holding_decision_event.1326.c: "Меня такое не интересует."
 gdp_visit_holding_decision_event.1330.t: "[Select_CString(monk.IsFemale, 'Монахиня', 'Монах' )]"
 gdp_visit_holding_decision_event.1330.desc: "В тихом уголке местной чайной я замечаю [Select_CString(monk.IsFemale, 'монахиню', 'монаха' )]. При свете свечи [Select_CString(monk.IsFemale, 'она', 'он' )] гадает на стеблях тысячелистника, пытаясь докопаться до сокрытого в них смысла. [Select_CString(monk.IsFemale, 'Женщина', 'Мужчина' )] замечает мой интерес и обращается ко мне:\n\n«Вы пришли за мудростью оракула, друг мой? Если ваш разум открыт, а помыслы чисты, Путь откроет вам многое»."
 gdp_visit_holding_decision_event.1330.desc_returned_01: "В чайной стало ещё тише — посетителей почти не осталось. [monk.GetFirstName] всё так же сидит за столом, разложив перед собой стебли тысячелистника. Свеча почти догорела.\n\n[Select_CString(monk.IsFemale, 'она', 'он' )] даже не поднимает глаз."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "Вернувшись, я вижу, как [monk.GetFirstName] собирает стебли в кусок ткани. Пламя свечи дрожит и вот-вот погаснет.\n\n«Вы настойчивы, — замечает [Select_CString(monk.IsFemale, 'она', 'он' )]. — Путь не против повторных визитов. А вы?»"
 gdp_visit_holding_decision_event.1330.a: "Моей компании как раз не хватает образованного спутника."
 gdp_visit_holding_decision_event.1330.a.tt: "[monk.GetFirstNameNoTooltip] [Select_CString(monk.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![monk_recruit_cost|V0] [Concept('gold', 'золотых')|E]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "Расскажите, над чем вы работаете."
 gdp_visit_holding_decision_event.1330.c: "Я кое-что смыслю в небесных делах."
 gdp_visit_holding_decision_event.1330.c.success: "[monk.GetFirstNameNoTooltip] [Select_CString(monk.IsFemale, 'впечатлена', 'впечатлён' )]"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName] уходит с безразличием на лице"
 gdp_visit_holding_decision_event.1330.d: "Пожалуй, в другой раз."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1333.t: "[Select_CString(caravaneer.IsFemale, 'Бывалая караванщица', 'Бывалый караванщик')]"
 gdp_visit_holding_decision_event.1333.desc: "Верблюды жмутся друг к другу, стараясь укрыться под навесом загона. Из их тесной кучки доносятся редкие ворчания, перестук копыт и... #EMP храп#!? Приглядевшись, я замечаю [Select_CString(caravaneer.IsFemale, 'караванщицу, уснувшую', 'караванщика, уснувшего')] прямо на сумках. Услышав мои шаги, [Select_CString(caravaneer.IsFemale, 'она', 'он')] просыпается и спешно вскакивает на ноги, вытирая слюну с лица.\n\n[Select_CString(caravaneer.IsFemale, 'Она', 'Он')] поясняет: «Уверяю вас, хозяин конюшни знает, что я здесь. Я никогда не оставляю животных без присмотра — так они в безопасности, а я могу спать спокойно»."
 gdp_visit_holding_decision_event.1333.desc_returned_01: "Верблюды по-прежнему тесно жмутся друг к другу в загоне. На этот раз [caravaneer.GetFirstName] не спит, а поправляет подпругу своего верблюда.\n\n[Select_CString(caravaneer.IsFemale, 'Она', 'Он')] оглядывается через плечо. «Опять вы»."
 gdp_visit_holding_decision_event.1333.desc_returned_02: "Из загона доносится ворчание, а [caravaneer.GetFirstName] повышает голос: «Если пришли поглазеть на животных, платите».\n\nТеперь [Select_CString(caravaneer.IsFemale, 'она', 'он')] сидит на сумках, [Select_CString(caravaneer.IsFemale, 'готовая', 'готовый')] выдвигаться, и ждёт, собираюсь ли я поговорить с [Select_CString(caravaneer.IsFemale, 'ней', 'ним')] по делу."
 gdp_visit_holding_decision_event.1333.a: "«Я позабочусь о безопасности твоих животных»."
 gdp_visit_holding_decision_event.1333.a.tt: "[caravaneer.GetFirstNameNoTooltip] [Select_CString(caravaneer.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![caravaneer_recruit_cost|V0] [Concept('gold', 'золотых')|E]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "«Какие новости на дороге?»"
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "Вы недавно расспрашивали о дороге — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]"
 gdp_visit_holding_decision_event.1333.c: "«Я кое-что смыслю в организации караванов...»"
 gdp_visit_holding_decision_event.1333.c.success: "[caravaneer.GetFirstNameNoTooltip] [Select_CString(caravaneer.IsFemale, 'впечатлена', 'впечатлён' )]"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName] вместе с животными уходит прочь"
 gdp_visit_holding_decision_event.1333.d: "Пожалуй, в другой раз."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1334.t: "Капитан корабля"
 gdp_visit_holding_decision_event.1334.desc: "На причале собралась толпа мужчин и женщин. Все они обступили [Select_CString(sea_captain.IsFemale, 'видавшую виды морячку', 'видавшего виды моряка' )], надеясь договориться о месте на [Select_CString(sea_captain.IsFemale, 'её', 'его' )] корабле.\n\nЯ слышу, как двое прохожих перешёптываются: «Мы опоздали! Места кончились, [sea_captain.GetTitledFirstName|U] больше никого не возьмёт». Вместо того чтобы обратиться к другому капитану, они предпочитают подождать [Select_CString(sea_captain.IsFemale, 'её', 'его' )] следующего плавания.\n\nКто [Select_CString(sea_captain.IsFemale, 'эта женщина', 'этот человек' )]? И неужели это #EMP золото#! звенит внутри [Select_CString(sea_captain.IsFemale, 'её', 'его' )] деревянной ноги?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "Толпа, которую [Select_CString(sea_captain.IsFemale, 'собрала', 'собрал' )] вокруг себя [sea_captain.GetFirstName], поредела. [Select_CString(sea_captain.IsFemale, 'Она', 'Он' )] по одной опускает монеты в полость деревянной ноги, пока последние просители расходятся.\n\nКапитан даже не оборачивается. «Не [Select_CString(sea_captain.IsFemale, 'думала', 'думал' )], что увижу вас снова»."
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName|U] указывает опоздавшему на другой корабль. Поворачиваясь, [Select_CString(sea_captain.IsFemale, 'она', 'он' )] постукивает деревянной ногой по доскам причала.\n\n«Уже вернулись. Место на корабле ищете или меня?»"
 gdp_visit_holding_decision_event.1334.a: "«Я заплачу вдвое больше остальных»."
 gdp_visit_holding_decision_event.1334.a.tt: "[sea_captain.GetFirstNameNoTooltip] [Select_CString(sea_captain.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![sea_captain_recruit_cost|V0] [Concept('gold', 'золотых')|E]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "«Я не прочь услышать пару историй»."
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "Вы недавно слушали рассказ морского капитана — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]"
 gdp_visit_holding_decision_event.1334.c: "«Торговать чем-нибудь было бы куда прибыльнее»."
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip] [Select_CString(sea_captain.IsFemale, 'убеждена', 'убеждён' )]"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName] отчаливает"
 gdp_visit_holding_decision_event.1334.d: "Пожалуй, в другой раз."
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1335.t: "[Select_CString(carnival_jester.IsFemale, 'Карнавальная артистка', 'Карнавальный артист')]"
 gdp_visit_holding_decision_event.1335.desc: "На углу улицы собралась заворожённая толпа. Представление [Select_CString(carnival_jester.IsFemale, 'одной женщины', 'одного человека')] привлекло покупателей с окрестных торговых рядов и полностью остановило рыночную суету.\n\n[Select_CString(carnival_jester.IsFemale, 'Артистка', 'Артист')] широко раскидывает руки и провозглашает: «Смотрите же, все, кто твердил, будто мои трюки возможны лишь в полумраке карнавальных балаганов! В отличие от вас, мне не нужно прятаться за маской»."
 gdp_visit_holding_decision_event.1335.desc_returned_01: "Толпа всё ещё на месте, но уже поредела. [carnival_jester.GetFirstName] заканчивает очередной пируэт, замечает меня и раскидывает руки, словно моё появление — часть представления.\n\n«На бис?»"
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName] складывает свой реквизит в тканевый мешок.\n\n«Мне начинает казаться, что вам от меня что-то нужно»."
 gdp_visit_holding_decision_event.1335.a: "«Моей компании не помешает ваше проворство»."
 gdp_visit_holding_decision_event.1335.a.tt: "[carnival_jester.GetFirstNameNoTooltip] [Select_CString(carnival_jester.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![carnival_jester_recruit_cost|V0] [Concept('gold', 'золотых')|E]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "«Расскажите побольше об этих карнавалах»."
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "Вы недавно расспрашивали о карнавалах — повторить можно после [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]"
 gdp_visit_holding_decision_event.1335.c: "Наверняка вам больше нечего здесь доказывать?"
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip] [Select_CString(carnival_jester.IsFemale, 'убеждена', 'убеждён' )]"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName] собирает вещи и уходит"
 gdp_visit_holding_decision_event.1335.d: "Пожалуй, в другой раз."
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1336.t: "Пекарь"
 gdp_visit_holding_decision_event.1336.desc_intro: "От ближайшей рыночной лавки тянет сладким запахом — это [ROOT.Char.Custom('FavoriteTreat')]. Все свободные поверхности заставлены корзинами с выпечкой.\n\n[Select_CString(cook.IsFemale, 'Хозяйка', 'Хозяин' )] лавки стоит в стороне, обхватив голову руками. Заметив меня, [Select_CString(cook.IsFemale, 'она', 'он' )] говорит:"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "«Раньше у меня всё [Select_CString(local_noble.IsFemale, 'скупала', 'скупал')] [local_noble.GetTitledFirstNameNoTooltip], но теперь [Select_CString(local_noble.IsFemale, 'она решила', 'он решил')] \"следить за фигурой\" и больше не нуждается в моих услугах». [Select_CString(cook.IsFemale, 'Она', 'Он' )] нервно прикусывает губу. «Вы бы может и смогли продать всю эту выпечку. Но вот я... мне совершенно не хватает на это времени»."
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "«Из замка так и не пришли за моей выпечкой. И теперь у меня её больше, чем я когда-либо смогу продать!»"
 gdp_visit_holding_decision_event.1336.desc_returned_01: "В лавке всё так же пахнет булочками. [cook.GetFirstName] заворачивает очередную порцию выпечки для незнакомца, который за неё даже не заплатил.\n\nУвидев меня, [Select_CString(cook.IsFemale, 'она', 'он' )] вздыхает. «За мной до сих пор так и не прислали. Я не могу вечно раздавать выпечку даром»."
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Корзин стало меньше. [cook.GetFirstName] опирается на прилавок, рукава [Select_CString(cook.IsFemale, 'её', 'его' )] запачканы мукой. [Select_CString(cook.IsFemale, 'Она', 'Он' )] наблюдает, как разбирают последние буханки.\n\n«Если вам нужен пекарь, — говорит она, — скажите, пока лавка не опустела»."
 gdp_visit_holding_decision_event.1336.a: "В моей компании немало голодных ртов."
 gdp_visit_holding_decision_event.1336.a.tt: "[cook.GetFirstNameNoTooltip] [Select_CString(cook.IsFemale, 'пошла', 'пошёл')] бы к вам на службу за @gold_icon![cook_recruit_cost|V0] [Concept('gold', 'золотых')|E]"
