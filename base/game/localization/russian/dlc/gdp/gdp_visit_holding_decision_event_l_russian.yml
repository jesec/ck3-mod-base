 gdp_visit_holding_decision_event.1400.t: "Посетить доки владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1400.intro: "В загруженном порту владения [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] рабочие усердно разгружают товары самых разных форм и размеров."
 gdp_visit_holding_decision_event.1400.asia: "Огрубевшие руки осторожно переносят ящики с шёлком и мешки чайных листьев. Вскоре эти товары отправятся по всему, полному чудес свету, путешествуя на джонках по бурным морям."
 gdp_visit_holding_decision_event.1400.mena_india: "В царящем хаосе какой-то купец изучает товар в разбившихся ящиках. На другом конце порта тщательно опечатывают ящики с пряностями, чтобы те пережили опасное путешествие через океан."
 gdp_visit_holding_decision_event.1400.default: "Мешки с зерном и солью отправляются к далёким берегам. С только что причалившего массивного дубового когга на берег сходит группа иноземных купцов в ярких нарядах."
 gdp_visit_holding_decision_event.1400.outro: "Свежий воздух заполняет мои лёгкие и манит узнать, благоволят ли мне сегодня ветра фортуны.\n\n…Куда бы направиться?\n\n"
 gdp_visit_holding_decision_event.1400.b: "Нужно присмотреться к интересным людям."
 gdp_visit_holding_decision_event.1400.b.tt: "Осмотр доков может открыть следующую возможность:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "Нужно поговорить с этим капитаном."
 gdp_visit_holding_decision_event.1400.d.tt: "Поговорить с капитаном\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "Думаю, [sea_captain.GetFirstNameNoTooltip] заслуживает ещё одного визита."
 gdp_visit_holding_decision_event.1400.c.tt: "Покинуть пока доки"
