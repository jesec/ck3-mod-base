l_russian:
 gdp_tgf_coin_artifact: "Первая монета, которую [Select_CString(tgf_market_holder.IsFemale, 'отчеканила', 'отчеканил')] [tgf_market_holder.GetFirstNameNoTooltip]"
 gdp_tgf_coin_artifact_desc: "На её аверсе [Select_CString(tgf_market_holder.IsFemale, 'изображена', 'изображён')] [tgf_market_holder.GetFirstNamePossessive], а по гурту идёт надпись крошечным шрифтом, который могут разобрать только опытные торговцы: [tgf_coin_merchant.GetFirstName], чьё богатство — [tgf_good.Custom('GetTradeGood_RU_Nom')]."
 gdp_tgf_smith_weapon_axe: "Топор с клеймом «[tgf_smith_patron.GetFirstNameNoTooltip] и [Select_CString(tgf_smith_patron.IsFemale, 'её', 'его')] [tgf_good.Custom('GetTradeGood_RU_Nom')|l]»"
 gdp_tgf_smith_weapon_dagger: "Кинжал с клеймом «[tgf_smith_patron.GetFirstNameNoTooltip] и [Select_CString(tgf_smith_patron.IsFemale, 'её', 'его')] [tgf_good.Custom('GetTradeGood_RU_Nom')|l]»"
 gdp_tgf_smith_weapon_hammer: "Молот с клеймом «[tgf_smith_patron.GetFirstNameNoTooltip] и [Select_CString(tgf_smith_patron.IsFemale, 'её', 'его')] [tgf_good.Custom('GetTradeGood_RU_Nom')|l]»"
 gdp_tgf_smith_weapon_mace: "Булава с клеймом «[tgf_smith_patron.GetFirstNameNoTooltip] и [Select_CString(tgf_smith_patron.IsFemale, 'её', 'его')] [tgf_good.Custom('GetTradeGood_RU_Nom')|l]»"
 gdp_tgf_smith_weapon_spear: "Копьё с клеймом «[tgf_smith_patron.GetFirstNameNoTooltip] и [Select_CString(tgf_smith_patron.IsFemale, 'её', 'его')] [tgf_good.Custom('GetTradeGood_RU_Nom')|l]»"
 gdp_tgf_smith_weapon_sword: "Меч с клеймом «[tgf_smith_patron.GetFirstNameNoTooltip] и [Select_CString(tgf_smith_patron.IsFemale, 'её', 'его')] [tgf_good.Custom('GetTradeGood_RU_Nom')|l]»"
 gdp_tgf_smith_weapon_desc: "[tgf_smith.GetFirstName] из графства [tgf_source_county.GetNameNoTier] [Select_CString(tgf_smith.IsFemale, 'выковала', 'выковал')] это оружие из лучшего слитка, который [Select_CString(tgf_smith_patron.IsFemale, 'сумела', 'сумел')] купить [tgf_smith_patron.GetFirstName]. Кузнец клянётся, что оно стоит в десять раз дороже металла."
 gdp_tgf_reading_stones_artifact_merchant: "Стёкла для чтения, которые [Select_CString(tgf_lens_merchant.IsFemale, 'заказала', 'заказал')] [tgf_lens_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_reading_stones_artifact_lord: "Стёкла для чтения, которые [Select_CString(tgf_market_holder.IsFemale, 'заказала', 'заказал')] [tgf_market_holder.GetFirstNameNoTooltip]"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "Эти две линзы из прозрачного стекла [Select_CString(tgf_glassmaker.IsFemale, 'выточила', 'выточил')] [tgf_glassmaker.GetFirstName] из графства [tgf_source_county.GetNameNoTier]. Ещё Сенека писал, что буквы разбухают, если смотреть на них сквозь круглый сосуд с водой. Теперь даже самый мелкий шрифт в договоре может стать разборчивым."
 gdp_tgf_showpiece_artifact: "Шкафчик, который [Select_CString(tgf_showpiece_merchant.IsFemale, 'заказала', 'заказал')] [tgf_showpiece_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_showpiece_artifact_desc: "В каждом его ящике, который тщательно [Select_CString(tgf_crafter.IsFemale, 'изготовила', 'изготовил')] [tgf_good.Custom('GetTgfGoodCrafter')] [tgf_crafter.GetFirstName], [tgf_good.Custom('GetTradeGood_RU_Nom')] самого высшего сорта, какой только [Select_CString(tgf_showpiece_merchant.IsFemale, 'смогла', 'смог')] найти [tgf_showpiece_merchant.GetFirstName]. Этот шкафчик открыт для покупателей и заперт для всех остальных."
 gdp_tgf_curio_grain: "Сноп лучшего зерна"
 gdp_tgf_curio_grain_desc: "Это зерно собрано на превосходном поле в очень хороший год."
 gdp_tgf_curio_millet: "Кувшин старого проса"
 gdp_tgf_curio_millet_desc: "Прошло уже много лет — а оно всё не портится. Воистину, просо вечно."
 gdp_tgf_curio_rice: "Миска белого риса"
 gdp_tgf_curio_rice_desc: "Очищенный, полированный и слишком красивый, чтобы его есть."
 gdp_tgf_curio_meat: "Идеально засоленное мясо"
 gdp_tgf_curio_meat_desc: "Оно вполне способно пережить своего владельца."
 gdp_tgf_curio_fish: "Сушёная рыбина на подставке"
 gdp_tgf_curio_fish_desc: "Жёсткая, как доска, и очень гордая."
 gdp_tgf_curio_cheese: "Круг зрелого сыра"
 gdp_tgf_curio_cheese_desc: "Лето, в которое его выжали, уже мало кто помнит."
 gdp_tgf_curio_fruit: "Горшочек с фруктами"
 gdp_tgf_curio_fruit_desc: "Засахаренный, запечатанный и сохранённый до лучших времён."
 gdp_tgf_curio_oil: "Фляга масла первого отжима"
 gdp_tgf_curio_oil_desc: "Зелёно-золотистое масло, первым вышедшее из-под пресса в своём году."
 gdp_tgf_curio_honey: "Запечатанный горшочек мёда"
 gdp_tgf_curio_honey_desc: "Эта тёмно-янтарная субстанция старше многих редких вин."
 gdp_tgf_curio_tea: "Брикет прессованного чая"
 gdp_tgf_curio_tea_desc: "Пришедший из далёких садов, он стоит золота по своему весу."
 gdp_tgf_curio_horses: "Чемпионская подкова"
 gdp_tgf_curio_horses_desc: "Продавец клянётся, что носившая её лошадь ни разу не проиграла скачки."
 gdp_tgf_curio_cattle: "Полированный коровий рог"
 gdp_tgf_curio_cattle_desc: "Отполирован до блеска. Отлично подходит для пиров."
 gdp_tgf_curio_silver: "Безупречный серебряный слиток"
 gdp_tgf_curio_silver_desc: "Металл настолько чист, что его можно поцарапать ногтем, но этого никто не посмеет делать."
 gdp_tgf_curio_gold: "Речной самородок"
 gdp_tgf_curio_gold_desc: "Никто не скажет вам, в какой реке его нашли."
 gdp_tgf_curio_iron: "Идеальная железная заготовка"
 gdp_tgf_curio_iron_desc: "Плотная, тёмная и безупречная."
 gdp_tgf_curio_copper: "Блестящий медный круг"
 gdp_tgf_curio_copper_desc: "Он не теряет блеска с того дня, как был отлит в шахте."
 gdp_tgf_curio_beer: "Резная кружка"
 gdp_tgf_curio_beer_desc: "Вмещает ровно одну честную пинту. Как правило, дело ей не огранчивается."
 gdp_tgf_curio_wine: "Легендарное вино"
 gdp_tgf_curio_wine_desc: "Год, в который был собран его виноград, знатоки до сих пор вспоминают шёпотом."
 gdp_tgf_curio_gems: "Неогранённый самоцвет"
 gdp_tgf_curio_gems_desc: "Выглядит как галька, а стоит как деревня."
 gdp_tgf_curio_amber: "Кусок янтаря"
 gdp_tgf_curio_amber_desc: "Камушек медового цвета, внутри которого навеки увязла мушка."
 gdp_tgf_curio_ivory: "Резная слоновая кость"
 gdp_tgf_curio_ivory_desc: "Кончик бивня, который чьи-то терпеливые руки покрыли затейливой резьбой."
 gdp_tgf_curio_jade: "Кусочек речного нефрита"
 gdp_tgf_curio_jade_desc: "Как и подобает нефриту, он приятно холодит руку."
 gdp_tgf_curio_wood: "Кусок фигурной древесины"
 gdp_tgf_curio_wood_desc: "Её текстура подобна текущей воде. За такое дерево резчики будут торговаться до последнего."
 gdp_tgf_curio_hemp: "Идеальный моток верёвки"
 gdp_tgf_curio_hemp_desc: "Эта верёвка настолько гладкая, что на ней даже не видно следов скрутки."
 gdp_tgf_curio_wool: "Золотое руно"
 gdp_tgf_curio_wool_desc: "Не то самое, но близко. По крайней мере, так говорит пастух."
 gdp_tgf_curio_cotton: "Пучок лучшего хлопка"
 gdp_tgf_curio_cotton_desc: "Лёгкий как пёрышко и белый как снег."
 gdp_tgf_curio_flax: "Моток шелковистого льна"
 gdp_tgf_curio_flax_desc: "Этот лён так тонок, что в сумерках его можно принять за шёлк."
 gdp_tgf_curio_textiles: "Отрез мастерской ткани"
 gdp_tgf_curio_textiles_desc: "Эта ткань так плотна, что задерживает дождевую воду."
 gdp_tgf_curio_furs: "Безупречная зимняя шкура"
 gdp_tgf_curio_furs_desc: "Снята в середине зимы, когда мех самый густой."
 gdp_tgf_curio_leather: "Лист выделанной кожи"
 gdp_tgf_curio_leather_desc: "Благодаря умелой обработке эта кожа стала мягкой, словно ткань."
 gdp_tgf_curio_sugar: "Кусок сахарной головы"
 gdp_tgf_curio_sugar_desc: "Самая белая часть сахарной головы, сбережённая для показа."
 gdp_tgf_curio_spices: "Шкатулка редких специй"
 gdp_tgf_curio_spices_desc: "Её открывают раз в год, чтобы доказать, что её содержимое существует."
 gdp_tgf_curio_ceramics: "Безупречная глазированная миска"
 gdp_tgf_curio_ceramics_desc: "Если её ударить, она зазвенит, словно колокольчик. Но делать этого никто не станет."
 gdp_tgf_curio_glass: "Прозрачный стеклянный сосуд"
 gdp_tgf_curio_glass_desc: "В его стенках нет ни единого пузырька. Изготовивший его стеклодув ушёл на покой с гордостью."
 gdp_tgf_curio_jewelry: "Брошь мастерской работы"
 gdp_tgf_curio_jewelry_desc: "Одну только её застёжку делали целый месяц."
 gdp_tgf_curio_lacquerware: "Лакированная шкатулка"
 gdp_tgf_curio_lacquerware_desc: "Тридцать слоёв лака. Выглядит дороже, чем лежащие в ней украшения."
 gdp_tgf_curio_silk: "Кусок безупречного шёлка"
 gdp_tgf_curio_silk_desc: "Гордость ткача, так и не вышедшая на рынок."
 gdp_tgf_curio_incense: "Кусок бледной смолы"
 gdp_tgf_curio_incense_desc: "В необожжённом виде она очень сладкая. В обожжённом может стать ещё слаще, но этого никто не станет делать."
 gdp_tgf_curio_medicaments: "Аптекарский набор"
 gdp_tgf_curio_medicaments_desc: "По одной дозе снадобий от любых болезней."
 gdp_tgf_curio_stone: "Кусочек резного камня"
 gdp_tgf_curio_stone_place: "Резной камень из графства [tgf_source_county.GetNameNoTierNoTooltip]."
 gdp_tgf_curio_stone_desc: "Он старше любого из ныне живущих каменотёсов и обработан так, как им и не снилось."
 gdp_tgf_curio_salt: "Кусок белой соли"
 gdp_tgf_curio_salt_desc: "Эта белоснежная соль совсем не похожа на обычную серую."
 gdp_tgf_curio_alum: "Кристалл квасцов размером с кулак"
 gdp_tgf_curio_alum_desc: "Прозрачный, словно лёд, и терпкий на вкус."
 gdp_tgf_curio_dyes: "Флакон истинного пурпура"
 gdp_tgf_curio_dyes_desc: "Когда-то этот цвет дозволялось носить лишь императорам. Сейчас он тоже по карману только им."
 gdp_tgf_curio_books_paper: "Страница манускрипта"
 gdp_tgf_curio_books_paper_desc: "Безупречная страница из книги, которую никто не может найти."
 gdp_tgf_itinerary_artifact: "Заметки паломника"
 gdp_tgf_itinerary_artifact_desc: "Потрёпанная книжица, в которой аккуратным почерком описаны дороги, трактиры и броды. Некоторые из упомянутых в ней мест не отмечены ни на одной карте."
 gdp_tgf_first_sale_artifact: "[tgf_good.GetNameNoTooltip] — первый товар, который [Select_CString(tgf_first_seller.IsFemale, 'продала', 'продал')] [tgf_first_seller.GetFirstNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "[tgf_good.Custom('GetTgfGoodSmallest')|U] такого простого товара, как [tgf_good.Custom('GetTradeGood_RU_Nom')], выглядит совершенно непримечательно, но именно с этого лота [tgf_first_seller.GetFirstName] [Select_CString(tgf_first_seller.IsFemale, 'начала', 'начал')] свой путь к богатству. Впоследствии [Select_CString(tgf_first_seller.IsFemale, 'она выкупила', 'он выкупил')] его и [Select_CString(tgf_first_seller.IsFemale, 'поместила', 'поместил')] в рамочку. Этот товар больше не продаётся. Скорее всего."
 gdp_tgf_merchant_portrait_artifact: "Портрет торговца"
 gdp_tgf_merchant_portrait_artifact_desc: "Эта картина, изображающая торговца, который пересчитывает монеты за столом, прямо-таки излучает чувство глубокого удовлетворения."
 gdp_tgf_bale_book_artifact: "Книга из трюма"
 gdp_tgf_bale_book_artifact_desc: "Кто-то решил использовать её, чтобы партия товаров не отсырела. По большей части это помогло."
 gdp_tgf_handbook_practice_artifact: "Практика коммерции"
 gdp_tgf_handbook_practice_artifact_desc: "Торговец, который нашёл время заполнить страницы этой книги бесчисленными сведениями о мерах, весах и ценах, явно не нуждался во сне. На полях сделаны пометки другим почерком."
 gdp_tgf_handbook_roads_artifact: "Книга дорог и рынков"
 gdp_tgf_handbook_roads_artifact_desc: "Подробное описание всех дорог между крупнейшими рынками. Из этой книги можно узнать, где собирают пошлины, в каких трактирах вкуснее кормят и какие паромщики любят обманывать."
 gdp_tgf_handbook_mirror_artifact: "Зеркало купца"
 gdp_tgf_handbook_mirror_artifact_desc: "Советы торговцам: у кого покупать, кому доверять, а в первую очередь — кому не доверять ни в коем случае."
