 start_steal_trade_post_local_ruler_hooked_tt: "Местный [Concept('ruler', 'правитель')|E] [local_ruler.GetShortUIName] у вас [Concept('hooked', 'на крючке')|E]: #P +[EmptyScope.ScriptValue('steal_trade_post_local_ruler_success_value')|0]#! к [Concept('scheme_success_chance', 'шансу на успех происков')|E]"
