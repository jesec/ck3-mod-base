 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "Мне почти жаль семейство [target.GetHouse.GetName]: уж больно охотно — даже с #EMP энтузиазмом#! — их слуги и мнимые соратники помогают моим агентам раскрывать самые скандальные семейные тайны. #EMP Почти#!.\n\nУ меня в руках неопровержимые доказательства: [secret_holder.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]!"
 gdp_patrician_find_secrets.0002.a: "[secret_holder.GetHerHis|U] репутация в моих руках."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "Мои агенты перерыли выброшенные бумаги семейства [target.GetHouse.GetName], разговорили прислугу и щедро заплатили всем сплетникам на рынке, но так и не нашли ничего стоящего.\n\nКакие бы тайны ни [Select_CString(target.IsFemale, 'скрывала', 'скрывал')] [target.GetTitledFirstName] за закрытыми дверями, они либо надёжно укрыты от посторонних глаз, либо их не существует вовсе."
 gdp_patrician_find_secrets.0003.desc.outmatched: "Мои агенты пристально следили за каждым шагом семейства [target.GetHouse.GetName], но так и не смогли заглянуть за завесу их тайн. Двери их дома заперты крепче, чем кошель скупца, а слуги так тщательно хранят молчание, что впору усомниться, есть ли у них вообще языки.\n\nКакие бы непотребства ни [Select_CString(target.IsFemale, 'творила', 'творил')] [target.GetTitledFirstName], мы знаем о них не больше, чем раньше."
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]! Всё впустую."
