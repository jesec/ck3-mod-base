 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.8502.desc: "Крупица за крупицей краденные учётные книги, перепроверенные слухи и с трудом выторгованные ценные сведения сложились в единую картину, показывающую, сколько [target.GetPrimaryTitle.GetDefinitiveName|l] имеет покупателей, продавцов и полезных связей.\n\nНет никаких сомнений, что с этими сведениями мы сможем из более выигрышного положения конкурировать за товары, которыми любит торговать [target.GetTitledFirstName]."
 scheme_critical_moments.8502.discovered: "\n\nУвы, теперь знает [target.GetTitledFirstNameNoTooltip], что мы сунули нос в [Select_CString(target.IsFemale, 'её', 'его' )] дела…"
 scheme_critical_moments.8502.a: "Прекрасно!"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U] [Select_CString(scheme.GetOwner.IsLocalPlayer, 'сумели', Select_CString(scheme.GetOwner.IsFemale, 'сумела', 'сумел' ))] украсть рыночные сведения у компании, которой [Select_CString(target.IsLocalPlayer, 'владеете', 'владеет')] [target.GetShortUIName], но [Select_CString(scheme.GetOwner.IsLocalPlayer, 'были раскрыты', Select_CString(scheme.GetOwner.IsFemale, 'была раскрыта', 'был раскрыт' ))]!"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.8503.desc: "Сколько же дней было потрачено на препирательства с лотошниками, сколько долгих ночей проведено за тайными перешёптываниями при свете свечей, и всё напрасно — мы так и не понимаем, как же ведёт свои дела [target.GetPrimaryTitle.GetDefinitiveName|l]…\n\nДаже документы из кабинетов, откуда [target.GetTitledFirstName] управляет делами, оказывались бессмысленными почеркушками или старыми счатами."
 scheme_critical_moments.8503.discovered: "\n\nХуже того, похоже, [target.GetTitledFirstNameNoTooltip] теперь в курсе наших интриг."
 scheme_critical_moments.8503.fallback: "\n\nПо крайней мере можно порадоваться тому, что [target.GetTitledFirstNameNoTooltip] так и не знает о наших происках."
 scheme_critical_moments.8503.a: "Пустая трата времени…"
