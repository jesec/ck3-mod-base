 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.8602.desc: "У магистратов графства [trade_post_county.GetName] есть своя цена, и весьма скромная, как выяснилось. Одна за другой на документах появляются печати, и право владения землями провинции [trade_post_province.GetName] переходит к нам.\n\nК тому времени, как [target.GetTitledFirstName] узнаёт о случившемся, наши управляющие уже выставляют [Select_CString(target.IsFemale, 'её', 'его')] писарей за дверь и закрашивают герб над входом."
 scheme_critical_moments.8602.a: "Неплохая резиденция, и теперь она наша."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.8603.desc: "Все взятки приняты, все обещания нарушены. Магистраты графства [trade_post_county.GetName] прибрали мои деньги к рукам, но даже не удосужились подтвердить моё право собственности.\n\n[target.GetTitledFirstName|U] по-прежнему властвует над этими землями."
 scheme_critical_moments.8603.discovered: "\n\nИ что хуже всего, [target.GetTitledFirstNameNoTooltip] прекрасно знает, кто именно тянулся к [Select_CString(target.IsFemale, 'её', 'его')] кошельку..."
 scheme_critical_moments.8603.fallback: "\n\nНо хотя бы наше участие в этой авантюре осталось не раскрытым."
 scheme_critical_moments.8603.a: "Мы поставили на ненадёжных людей."
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U] [Select_CString(scheme.GetOwner.IsFemale, 'пыталась', 'пытался')] перехватить ваш [Concept('trade_post', 'торговый пост')|E] в провинции [trade_post_province.GetNameNoTooltip], но у [Select_CString(scheme.GetOwner.IsFemale, 'неё', 'него')] ничего не вышло!"
 scheme_critical_moments.8604.t: "Торговый пост перехвачен: [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "Из графства [trade_post_county.GetName] прискакал гонец с дурными вестями: нашего управляющего выставили на улицу, а местные магистраты объявили меня нежеланным гостем и признали другого человека владельцем торгового поста в провинции [trade_post_province.GetName].\n\nГоды торговли, запасы на складах и с таким трудом завоёванное доверие — всё отдано чужим людям по росчерку пера тех, кому мы уже заплатили."
 scheme_critical_moments.8604.discovered: "\n\nТеперь моё место, будто это само собой разумеется, [Select_CString(owner.IsFemale, 'заняла', 'занял')] [owner.GetTitledFirstName]. Мы этого так #EMP не оставим#!!"
 scheme_critical_moments.8604.a: "Выставили нас за наш собственный порог!"
 steal_trade_post_failed_toast: "Попытка перехватить торговый пост"
 steal_trade_post_host_toast: "Торговый пост меняет владельца"
 steal_trade_post_host_toast_desc: "[target.GetShortUIName|U] больше не [Select_CString(target.IsLocalPlayer, 'владеете', 'владеет')] [Concept('trade_post', 'торговым постом')|E] в провинции [trade_post_province.GetName]. Теперь его [Select_CString(owner.IsFemale, 'новая хозяйка', 'новый хозяин')] — [owner.GetShortUIName]."
