 scheme_critical_moments.1142.desc_patrician_self: "Все вложенные в самопродвижение средства потрачены не зря.\n\nМоё положение в моих кругах упрочилось, всё новые и новые люди поддерживают мой [Concept('house', 'дом')|E], и цель близка как никогда!"
 scheme_critical_moments.1142.desc_patrician_other: "Вложенные время и средства оправдались: [target.GetTitledFirstName] теперь пользуется поддержкой.\n\n[Select_CString(target.IsFemale, 'Её', 'Его' )] репутация в [Select_CString(target.IsFemale, 'её', 'его' )] кругах упрочилась, всё новые люди решают оказать [Select_CString(target.IsFemale, 'ей', 'ему' )] поддержку, и [Select_CString(target.IsFemale, 'её', 'его' )] положение в [Concept('republic', 'республике')|E] теперь на ступеньку выше!"
 scheme_critical_moments.1143.desc_patrician_self: "В мою кампанию по самопродвижению вложено столько времени и средств... но этого недостаточно. Никто не считает мой [Concept('house', 'дом')|E] достойным, обещания и взятки ни к чему не привели, так что моё положение не изменилось.\n\nПридётся придумать что-то иное."
