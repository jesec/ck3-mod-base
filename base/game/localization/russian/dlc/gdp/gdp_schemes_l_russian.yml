 steal_trade_post_desc_general: "$steal_trade_post$ — это [Concept('hostile_scheme', 'агрессивные происки')|E] с целью захватить [Concept('trade_post', 'торговый пост')|E] соперничающего [Concept('patrician', 'патриция')|E]. Опираются на [Concept('intrigue', 'интриги')|E] и [Concept('stewardship', 'управление')|E] и позволяют нанимать [Concept('agents', 'соучастников')|E].\n\nУспешная кража приводит к передаче указанного торгового поста от [Concept('scheme_target', 'жертвы происков')|E] к [Concept('scheme_owner', 'интригану')|E]."
