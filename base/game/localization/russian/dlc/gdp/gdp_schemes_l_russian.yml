 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: успех"
 scheme_critical_moments.8402.desc: "В самом сердце города [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] я наблюдаю, как магистраты, которыми заправляет [target_patron.GetTitledFirstName], лениво перебирают кипы документов. Каждый поставленный ими штамп с окончательно подтверждает, что ещё одним активом дома [target.GetHouse.GetName] отныне владеет [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\nБезмятежное спокойствие нарушает лишь сонное жужжание мухи над их головами — до тех пор, пока в зал не врывается [target.GetFirstName].\n\n#EMP «ВЫ!#! — хрипит [Select_CString(target.IsLocalPlayer, 'она', 'он')], с трудом сдерживая ярость. — Как?! #DIE2 Зачем?..#!»"
 scheme_critical_moments.8402.a: "Ничего личного, просто бизнес…"
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: провал"
 scheme_critical_moments.8403.desc: "Несмотря на все наши старания, [target_patron.GetTitledFirstName] [Select_CString(target_patron.IsFemale, 'оказалась глуха', 'оказался глух')] ко всем намёкам, уговорам и попыткам давления, и нам не удалось довести дело до конца, прежде чем [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'заподозрила', 'заподозрил')] неладное.\n\n[target.GetPrimaryTitle.GetDefinitiveName] теперь занимает прочную оборонительную позицию, и мы лишились возможности переиграть этих мерзавцев в судах."
 scheme_critical_moments.8403.discovered: "\n\nА хуже всего то, что [target.GetTitledFirstNameNoTooltip] уже прекрасно понимает, кто за всем этим стоит…"
 scheme_critical_moments.8403.fallback: "\n\nЗато [target.GetTitledFirstNameNoTooltip] явно не догадывается о нашей причастности, и это служит хоть каким-то утешением."
 scheme_critical_moments.8403.a: "Как обычно…"
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U] [Select_CString(scheme.GetOwner.IsLocalPlayer, 'пытались', Select_CString(scheme.GetOwner.IsFemale, 'пыталась', 'пытался' ))] провести враждебное поглощение компании, которой [Select_CString(target.IsLocalPlayer, 'владеете', 'владеет')] [target.GetShortUIName], но [Select_CString(scheme.GetOwner.IsLocalPlayer, 'потерпели', Select_CString(scheme.GetOwner.IsFemale, 'потерпела', 'потерпел' ))] неудачу!"
 scheme_critical_moments.8404.t: "Враждебное поглощение: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "Мы направили всё своё внимание на ежедневные подсчёты и поиск золота среди грязи, но события этого дня показали, что стоило уделять больше внимания другим вопросам.\n\nИз владения [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] прибыло короткое послание с официальным подтверждением сегодняшнего судебного решения. Решения, согласно которому наша компания будет упразднена, а все её активы #EMP конфискованы#!, и контроль над ними получит [owner.GetPrimaryTitle.GetDefinitiveName|l]!\n\nК моменту моего прибытия уже слишком поздно. Если, конечно, у меня вообще было время…\n\n[Select_CString(owner.IsFemale, 'Мерзавка', 'Мерзавец')] [owner.GetTitledFirstName] с ухмылкой смотрит на меня, пока я отчаянно листаю документы, каждый из которых уже [Select_CString(target_patron.IsFemale, 'успела подписать моя покровительница', 'успел подписать мой покровитель')] [target_patron.GetTitledFirstName]!"
 scheme_critical_moments.8404.a: "Как?! #DIE2 За что…#!"
