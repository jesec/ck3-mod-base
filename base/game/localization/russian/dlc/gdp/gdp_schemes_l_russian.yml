 steal_market_insights: "Кража познаний в торговле"
 steal_market_insights_desc: "[SCHEME.GetTargetCharacter.GetPrimaryTitle.GetDefinitiveName|U] может стать целью нашего внедрения, что позволит нам воспользоваться опытом торговли определёнными товарами, которым обладает [SCHEME.GetTargetCharacter.GetShortUIName]."
 steal_market_insights_action: "Украсть познания:"
 steal_market_insights_desc_general: "$steal_market_insights$ — [Concept('hostile_scheme', 'агрессивные происки')|E] с целью украсть [Concept('expertise', 'рыночные знания')|E] у [Concept('merchant', 'торговой')|E] [Concept('company', 'компании')|E] соперника. Опираются на [Concept('intrigue', 'интриги')|E] и [Concept('stewardship', 'управление')|E] и позволяют нанимать [Concept('agents', 'соучастников')|E].\n\nУспешная кража рыночных знаний приводит к тому, что [Concept('company', 'компания')|E] [Concept('scheme_owner_possessive', 'интригана')|E] получает знания во всех [Concept('trade_categories', 'категориях')|E], в которых компания [Concept('scheme_target_possessive', 'цели')|E] превосходит её."
 steal_market_insights_invalidated_title: "@scheme_icon! Происки кражи рыночных знаний завершаются"
 start_steal_market_insights_notification: "$steal_market_insights$"
