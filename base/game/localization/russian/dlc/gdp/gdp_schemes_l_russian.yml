 STEAL_MARKET_INSIGHTS_SUCCESS_DESC: "[Concept('company', 'Компания')|E], которой владеет [CHARACTER.GetShortUIName], получает #V 5#! [Concept('expertise_levels', 'уровней познаний')|E] в каждой [Concept('trade_category_short', 'категории')|E], где её по уровню познаний опережает компания, которой владеет [TARGET_CHARACTER.GetShortUIName]"
 STEAL_MARKET_INSIGHTS_DISCOVERY_DESC: "Совершення вами попытка украсть [Concept('expertise', 'познания')|E] осталась нераскрытой."
