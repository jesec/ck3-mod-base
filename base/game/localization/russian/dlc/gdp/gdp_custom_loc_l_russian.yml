l_russian:
 dinar: "динар"
 dinar_plural: "динары"
 dinar_gloss: "[Glossary('динар', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('динары', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "#bold Динар#!, или #emp денар#!, — золотая монета, введённая Омейядами в VII веке по образцу византийского золотого [Glossary('солида', 'SOLIDUS_GLOSS')]; при этом название своё она получила от серебряного [Glossary('денария', 'DENARIUS_GLOSS')].\n\nДинар получил широкое распространение в арабском мире, его название до сих пор используется для обозначения денежных единиц некоторых современных государств."
 denarius: "денарий"
 denarius_plural: "денарии"
 denarius_gloss: "[Glossary('денарий', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('денарии', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "Изначально #bold денарием#! называлась серебряная монета Римской республики. В эпоху Империи денарий неоднократно подвергался обесцениванию.\n\nТем не менее, термин продолжил употребляться как общее название денег в регионах, находившихся под влиянием Рима. От него произошли названия серебряного [Glossary('денара', 'PENNY_GLOSS')] и арабского золотого [Glossary('динара', 'DINAR_GLOSS')]."
 ducat: "дукат"
 ducat_plural: "дукаты"
 ducat_gloss: "[Glossary('дукат', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('дукаты', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "#bold Дукато#! или #emp догадо#! — золотая монета, появившаяся в Венеции в XIII веке в связи с обесцениванием византийского золотого [Glossary('солида', 'SOLIDUS_GLOSS')]. Её вес соответствовал флорентийскому [Glossary('флорину', 'FLORIN_GLOSS')] и генуэзскому #emp дженовино#!. Название монеты восходит к титулу венецианского #emp дожа#!.\n\nДукат быстро завоевал признание среди купцов. Монета распространилась по всей Европе и за её пределами, став образцом для многих других денежных единиц."
 dirham: "дирхам"
 dirham_plural: "дирхамы"
 dirham_gloss: "[Glossary('дирхам', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('дирхамы', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "#bold Дирхам#!, или #emp драм#!, — серебряная монета, введённая Омейядами в VII веке и получившая распространение во всём арабском мире. Её название восходит к греческой #emp драхме#! — серебряной монете, имевшей широкое хождение в классический и эллинистический периоды.\n\nСо временем дирхам превратился в стандартную единицу измерения веса в мусульманских странах, а его название до сих пор используется для обозначения денежных единиц некоторых современных государств."
 aureus: "аурей"
 aureus_plural: "ауреи"
 aureus_gloss: "[Glossary('аурей', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('ауреи', 'AUREUS_GLOSS')]"
 solidus: "солид"
 solidus_plural: "солиды"
 solidus_gloss: "[Glossary('солид', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('солиды', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "#bold Солид#!, или #emp номисма#! (дословно «монета»), — золотая монета, введённая вместо прежнего римского [Glossary('аурея', 'AUREUS_GLOSS')] в Византии IV века. В XI веке её, в свою очередь, сменил [Glossary('иперпир', 'HYPERPYRON_GLOSS')].\n\nК XIII веку обесценивание солида привело к появлению в итальянских республиках собственных золотых монет, таких как [Glossary('дукато', 'DUCAT_GLOSS')], [Glossary('флорин', 'FLORIN_GLOSS')] и #emp дженовино#!.\n\nВ Северной Европе солид был известен как #emp шиллинг#!, пока денежная реформа Карла Великого в VIII веке не закрепила этот термин за стандартной единицей серебра."
 hyperpyron: "иперпир"
 hyperpyron_plural: "иперпиры"
 hyperpyron_gloss: "[Glossary('иперпир', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('иперпиры', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "#bold Иперпир#! (буквально — «сверхчистый»), известный в Европе под названием #emp безант#!, — золотая монета, введённая в Византии в XI веке на смену прежнему золотому [Glossary('солиду', 'SOLIDUS_GLOSS')].\n\nХотя иперпир в меньшей степени подвергся обесцениванию, нежели #emp солид#!, к XIII веку его стоимость тоже существенно снизилась. Это подтолкнуло итальянские республики к выпуску собственных золотых монет, таких как [Glossary('дукато', 'DUCAT_GLOSS')], [Glossary('флорин', 'FLORIN_GLOSS')] и #emp дженовино#!."
 bezant: "безант"
 bezant_plural: "безанты"
 bezant_gloss: "[Glossary('безант', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('безанты', 'HYPERPYRON_GLOSS')]"
 florin: "флорин"
 florin_plural: "флорины"
 florin_gloss: "[Glossary('флорин', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('флорины', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "#bold Флорин#! — золотая монета, введённая Флорентийской республикой в XIII веке в ответ на обесценивание византийских [Glossary('солида', 'SOLIDUS_GLOSS')] и [Glossary('иперпира', 'HYPERPYRON_GLOSS')]. За ней вскоре последовали генуэзский #emp дженовино#! и венецианский [Glossary('дукат', 'DUCAT_GLOSS')].\n\nКак и #emp дукат#!, флорин получил широкое распространение как средство торговых расчётов, и его копии чеканили монетные дворы по всей Европе. Название флорина сохранилось в венгерском #emp форинте#!."
 penny: "пенни"
 penny_plural: "пенни"
 penny_gloss: "[Glossary('пенни', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('пенни', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "#bold Пфенниг#!, или #emp пенни#!, — серебряная монета установленного стандарта, введённая Карлом Великим в VIII веке по образцу прежнего широко распространённого серебряного [Glossary('денария', 'DENARIUS_GLOSS')] Римской империи.\n\nВскоре этот тип монеты стал повсеместным в разных частях Европы, и такие названия как #emp денар#!, #emp денье#! и #emp динеро#! на века стали взаимозаменяемыми обозначениями серебряных монет такой массы."
 pfennig: "пфенниг"
 pfennig_plural: "пфенниги"
 pfennig_gloss: "[Glossary('пфенниг', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('пфенниги', 'PENNY_GLOSS')]"
 denier: "денье"
 denier_plural: "денье"
 denier_gloss: "[Glossary('денье', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('денье', 'PENNY_GLOSS')]"
 dinero: "динеро"
 dinero_plural: "динеро"
 dinero_gloss: "[Glossary('динеро', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('динеро', 'PENNY_GLOSS')]"
 denaro: "денаро"
 denaro_plural: "денаро"
 denaro_gloss: "[Glossary('денаро', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('денаро', 'PENNY_GLOSS')]"
 denar: "денар"
 denar_plural: "денарии"
 denar_gloss: "[Glossary('денар', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('денарии', 'PENNY_GLOSS')]"
 groschen: "грош"
 groschen_plural: "гроши"
 groschen_gloss: "[Glossary('грош', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('гроши', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "#bold Грош#!, или «толстый пфенниг», — тяжёлая серебряная монета, введённая тирольским герцогом Мейнхардом II в XIII веке в ответ на появление аналогичного венецианского #emp гроссо#!. Изначально грош стоил 12 [Glossary('пфеннигов', 'PENNY_GLOSS')].\n\nВскоре такие монеты принялись чеканить во многих странах Европы. Важными центрами их производства были монетные дворы Кутной Горы в Богемии и Фрайбурга в Мейсене."
 tongbao: "тунбао"
 tongbao_plural: "тунбао"
 tongbao_gloss: "[Glossary('тунбао', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('тунбао', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold Тунбао#! (буквально — «ходящее в обращении сокровище») — название литых монет-[Glossary('цянь', 'QIAN_GLOSS')] из бронзового сплава, впервые выпущенных в VII веке династией Тан.\n\nЭти монеты стали стандартным платёжным средством во всех странах китайской культурной сферы; их до сих пор используют в традиционной китайской медицине и носят как талисманы на удачу."
 qian: "цянь"
 qian_plural: "цяни"
 qian_gloss: "[Glossary('цянь', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('цяни', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold Цянь#!, то есть «деньги», — собирательное название литых монет из медного сплава, широко распространённых в Китае в качестве платёжного средства ещё с периода Сражающихся царств.\n\nКвадратные отверстия в центре цянь имеют технологическое назначение — после отливки монеты нанизываются на стержень и шлифуются для обработки краёв. Кроме того, это позволяет собирать монеты в связки для крупных расчётов, обычно по 1000 штук. Цянь стали образцом для литых монет Японии, Кореи, Вьетнама и других стран."
 mon_coin: "мон"
 mon_coin_plural: "моны"
 mon_coin_gloss: "[Glossary('мон', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('моны', 'QIAN_GLOSS')]"
 tanka: "танка"
 tanka_plural: "танки"
 tanka_gloss: "[Glossary('танка', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('танки', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "#bold Танка#!, или #emp така#!, — серебряная монета, введённая в XIII веке в султанате Дели.\n\nОна имела широкое хождение в Индии и за её пределами, неоднократно копировалась и со временем стала стандартным средством обмена на Шёлковом пути."
 jital: "джитал"
 jital_plural: "джиталы"
 jital_gloss: "[Glossary('джитал', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('джиталы', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold Джитал#! — серебряная монета с изображением быка и всадника, изначально появившаяся в Кабуле в VIII веке.\n\nМонета широко распространилась по соседним регионам, породив множество аналогов. Со временем в серебро начали добавлять медь, и к XVI веку #emp джитал#! стал полностью медной монетой."
 coin: "монета"
 coin_plural: "монеты"
 coin_gloss: "монета"
 coin_gloss_plural: "монеты"
 bazaar: "базар"
 bazaar_plural: "базары"
 bazaar_gloss: "[Glossary('базар', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('базары', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold Базар#! — персидское название рынка, имеющее протоиндоевропейское происхождение. Со временем слово вошло в арабский язык и с тех пор широко используется в Западной Азии, Индии и других регионах."
 khrom: "тхром"
 khrom_plural: "тхромы"
 khrom_gloss: "[Glossary('тхром', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('тхромы', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold Тхром#! — тибетское название рынка, имеющее региональное хождение в землях вдоль Шёлкового пути."
 shuka: "шука"
 shuka_plural: "шуки"
 shuka_gloss: "[Glossary('шука', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('шуки', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold Шука#! — название рынка в языках народов Кавказа. Как и арабское [Glossary('соук', 'SUQ_GLOSS')], слово «шука» произошло из аккадского языка, но посредством сирийского, и изначально обозначало «улицу»."
 suq: "соук"
 suq_plural: "соуки"
 suq_gloss: "[Glossary('соук', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('соуки', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold Соук#! — арабское слово, означающее рынок. Оно пришло из аккадского языка через арамейский и изначально означало «улицу». Теперь оно повсеместно распространено в мусульманском мире."
