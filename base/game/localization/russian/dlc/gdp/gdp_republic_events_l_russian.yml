l_russian:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "Мы наконец-то основали собственную республику! Теперь тираны и их головорезы не заставят нас гнуть ради них спины на полях, и мы больше не прольём ни капли крови из-за их глупых феодальных распрей.\n\nОбъединив усилия, жители нашей скромной общины будут сами вершить свою судьбу и отстаивать свободы, которых они так долго добивались. Пусть наш город станет маяком надежды, а его стены послужат щитом на пути деспотизма и произвола."
 republic_event.0001.a: "Это начало новой эпохи!"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|U]"
 republic_event.0002.desc: "Прежний уклад сослужил нам добрую службу, и мы всегда будем чтить старые обычаи. Однако нашему клану стало тесно в нынешних стенах. Рынки разрастаются, городские стены ширятся, и народ начинает требовать нового порядка.\n\nСегодня [Concept('tribal', 'племенная')|E] форма правления уходит в прошлое. Отныне мы — [Concept('republic', 'республика')|E]. У города будет только один голос — наш."
 republic_event.0002.a: "Город это запомнит"
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "Сим сообщаю, что с этого момента я отзываю ваш торговый пост во владении [actor.GetCapitalLocation.GetBaronyNameExplicitly].\n\nРазумеется, главным бенефициаром этого решения будет [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]. Надеюсь, вы меня поймёте."
 republic_event.0010.a: "Так нельзя! Это #EMP мой#! торговый пост!"
 republic_event.0012.desc: "[trade_post_target_county.GetNameNoTierNoTooltip] больше не желает вас видеть! Я лишаю вас права вести торговлю. Все ваши ценности будут конфискованы, а торговый пост — стёрт с лица земли."
 republic_event.0012.a: "Придётся приютить товары где-то ещё…"
 republic_event.0020.t: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]ая казна"
 republic_event.0020.intro: "Пришло время проверить, каким бюджетом располагает республика."
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U] нахмурившись стоит передо мной, сжимая в руках книгу учета. За спиной у [Select_CString(target.IsFemale, 'нее', 'него' )] целая армия помощников со свитками, томами и выписками.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip|U]. Мы #EMP должны#! обсудить наши расходы и составить новый бюджет казны. Дело не терпит отлагательств"
 republic_event.0020.solo_desc: "Меня окружает целая армия служащих со свитками, томами и выписками. Они ждут, когда я закончу просматривать документы.\n\n"
 republic_event.0020.income_desc: "Наши текущие доходы значительно превышают расходы, и наши средства определённо можно использовать более эффективным образом."
 republic_event.0020.deficit_desc: "Наши расходы слишком велики, и, если ничего не предпринять, казна обанкротится."
 republic_event.0020.fallback_desc: "С принятия предыдущего бюджета прошло уже несколько лет."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U] уже [Select_CString(steward.IsFemale, 'провела', 'провёл' )] ревизию бюджета и [Select_CString(steward.IsFemale, 'доложила', 'доложил' )] мне, что всё в полном порядке. В поправках нет никакой необходимости."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "Передо мной лежит несколько документов, и каждый предлагает свой вариант бюджета казны — где потратить больше, а где затянуть пояса.\n\nКакой я выберу?"
 republic_event.0021.a: "Главное, чтобы каждый получал щедрую оплату за свой труд."
 republic_event.0021.b: "Жалования должны оставаться на умеренном уровне."
 republic_event.0021.c: "Нужно выделить дополнительные средства на нужды государства."
 republic_event.0021.a.info_desc: "Приоритет [Concept('treasury_budget_category', 'статей бюджета')|E]: @gold_icon![Concept('treasury_salary_budget_short', 'жалование')|E]\nБольшинство [Concept('patricians', 'патрициев')|E] одобряют высокие жалования"
 republic_event.0021.b.info_desc: "Приоритет [Concept('treasury_budget_category', 'статей бюджета')|E]: @law_icon!сбалансированный бюджет\nСбалансированный бюджет обеспечивает [Concept('patricians', 'патрициям')|E] достойное жалование и при этом сохраняет в [Concept('treasury', 'казне')|E] часть средств, которые [Concept('liege', 'сюзерен')|E] может потратить на своё усмотрение"
 republic_event.0021.c.info_desc: "Приоритет [Concept('treasury_budget_category', 'статей бюджета')|E]: @treasury_icon!держава\nЧем ниже жалования, тем больше средств [Concept('liege', 'сюзерен')|E] может направить на благо республики"
 republic_event.0030.desc: "С прискорбием сообщаю вам об отмене ваших монопольных привилегий на моих рынках. Торговля должна идти свободно."
 republic_event.0030.a: "Теперь придётся соперничать с другими…"
 republic_event.0040.desc: "С сожалением сообщаю вам, что отныне [actor.GetConfederation.GetName] продолжит деятельность без вашего участия."
 republic_event.0040.a: "Снова конкуренты"
 republic_event.0050.desc: "Собрание владения [title.GetName] сделало выбор, и теперь я [new_holder.GetTitleAsNameNoTooltip]. Этот почётный пост я буду занимать [new_holder.Custom('GetRepublicTermLength')]."
 republic_event.0051.desc: "Меня переизбрали [new_holder.Custom('GetRepublicTermLength')]. Слава владению [title.GetName]."
 republic_term_length_1_desc: "на срок в [EmptyScope.ScriptValue('law_term_length_1_value')|0] лет"
 republic_term_length_2_desc: "на срок в [EmptyScope.ScriptValue('law_term_length_2_value')|0] лет"
 republic_term_length_3_desc: "на срок в [EmptyScope.ScriptValue('law_term_length_3_value')|0] лет"
 republic_term_length_4_desc: "на срок в [EmptyScope.ScriptValue('law_term_length_4_value')|0] лет"
 republic_term_length_5_desc: "на срок в [EmptyScope.ScriptValue('law_term_length_5_value')|0] лет"
 republic_term_length_indefinite_desc: "пожизненно"
 republic_event.0052.desc: "Предложенный мною [new_law.GetNameNoTooltip] представлен почтенным членам собрания.\n\nПредложение будет вынесено на голосование после всестороннего обсуждения."
 republic_event.0053.pass.desc: "Предложение было одобрено. Отныне [new_law.GetNameNoTooltip] становится законом республики!"
 republic_event.0053.rejected.desc: "Предложенный [new_law.GetNameNoTooltip] был отвернут собранием."
 republic_event.law.TT: "#bold Предложен:#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P Принят:#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N Отвергнут:#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold Сохранен:#! [current_law.GetName]"
 republic_event.assembly.response: "Ясно."
 republic_event.assembly.opening: "Сограждане."
 rescind_trade_monopoly_notification_base_desc: "На [Concept('trade_markets', 'рынках')|E] персонажа [actor.GetShortUIName] отменены все [Concept('trade_monopolies', 'торговые монополии')|E], которыми пользуется:"
 rescind_trade_monopoly_notification_confederation_desc: "[recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "Ваша [Concept('company', 'компания')|E]"
 republic_event.0100.t: "Римская республика"
 republic_event.0100.desc: "О Рим! Величественное имя, веками служившее символом, воплощением #EMP идеала#!, к которому стремились целые народы! Лишь моими усилиями мечта многих стала явью.\n\nПо всей державе разносятся ликующие голоса. Отныне граждане — нет, #EMP римляне#!! — смогут вновь с гордостью говорить: мы — средоточие цивилизации. Нам предстоит тяжёлая работа по возрождению идеалов античности, но кто-то же должен стать маяком, который укажет путь сквозь тьму нынешних времён."
 republic_event.0100.a: "Все дороги вновь поведут в Рим."
 republic_event.0100.b: "Рим — это не город. Это идеал."
