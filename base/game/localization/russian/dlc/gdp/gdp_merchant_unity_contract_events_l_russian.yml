l_russian:
 option_boilerplate.tt.partner_aptitude: "#WEAK Результат этого поединка зависит от [Concept('aptitude', 'пригодности')|E] вашего [Concept('deputy_possessive', 'сотрудника')|E]#!"
 option_boilerplate.tt.partner_aptitude.success: "Ваш сотрудник справляется успешно"
 option_boilerplate.tt.partner_aptitude.failure: "Ваш сотрудник не справляется"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: [destination.GetBaronyNameExplicitlyNoTooltip] — край недовольных"
 gdp_merchant_unity_contract.1004.desc: "Письмо, которое [Select_CString(local_ruler.IsFemale, 'послала', 'послал')] мне [local_ruler.GetTitledFirstName|l], достаточно коротко, но при этом содержательно: жители владения [destination.GetBaronyNameExplicitly] недовольны тем, как ведёт себя моя компания, в особенности [trader.GetTitledFirstName|l].\n\nМестные торговцы, предприниматели и граждане как один жалуются на непоследовательный и даже противоречивый подход компании к ведению дел. [local_ruler.GetTitledFirstNameNoTooltip] желает, чтобы поднявшийся ропот поскорее улёгся, а просители замолчали.\n\nНет никаких сомнений, что [trader.GetTitledFirstNameNoTooltip|l] слишком много себе позволяет, пользуясь тем, что здесь не [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], а потому нет такого серьёзного надзора.\n\nЗначит, пора отправляться в путь: [destination.GetBaronyNameExplicitlyNoTooltip] ждёт."
 gdp_merchant_unity_contract.1004.a: "Немедленно собираемся в дорогу."
 gdp_merchant_unity_contract.1004.tt.destination_list: "Вы сразу отправляетесь в путь. Пункт назначения: [destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT Для выполнения [Concept('task_contract', 'контракта')|E]:\n$EFFECT_LIST_BULLET$Вам представится #V 3#! возможности предъявить заверения:\n$TAB$$EFFECT_LIST_BULLET$#V 2#! заверения гарантируют #P успех#!\n$TAB$$EFFECT_LIST_BULLET$#V 3#! заверения гарантируют #P исключительный успех#!\n$TAB$$EFFECT_LIST_BULLET$Если вы дадите #V 1#! заверение, вас может ждать #P успех#!, #P условный успех#! или #N провал#!\n$EFFECT_LIST_BULLET$Возможные проверки:\n$TAB$$EFFECT_LIST_BULLET$Проверка навыка [Concept('stewardship', 'управления')|E]\n$TAB$$EFFECT_LIST_BULLET$Проверка [Concept('aptitude', 'пригодности')|E] [Concept('deputy_possessive', 'сотрудника')|E]: [GetCourtPositionType('partner_court_position').GetName()l]\n$TAB$$EFFECT_LIST_BULLET$Проверка навыка [Concept('diplomacy', 'дипломатии')|E], [Concept('intrigue', 'интриг')|E] или [Concept('learning', 'учёности')|E]#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: городская площадь"
 gdp_merchant_unity_contract.1010.desc.intro: "«Вы, я полагаю, [ROOT.Char.GetTitledFirstNameNoTooltip|l]?» — со вздохом произносит [local_ruler.GetTitledFirstName|l]. Наши свиты встретились друг с другом во владении [destination.GetBaronyNameExplicitly]. Рядом со мной, в окружении стражников, — [Select_CString(trader.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))] [trader.GetTitledFirstName|l]."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "Позади меня скачет [Select_CString(partner.IsFemale, 'моя', 'мой')] [GetCourtPositionType('partner_court_position').GetName()|l] [partner.GetFirstName], [Select_CString(partner.IsFemale, 'готовая', 'готовый')] в любую минуту броситься на помощь."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n«Свидетели подтвердят: этот человек устроил здесь подлинное безобразие, — продолжает [local_ruler.GetFirstNameNoTooltip]. — Надеюсь, вы как можно скорее уладите этот вопрос. Мне некогда этим заниматься!»"
 gdp_merchant_unity_contract.1010.desc.outro: "\n\nМне предлагают поговорить с пострадавшими. С жалобами ко мне обращаются [person_c.GetTitledFirstName] и [person_d.GetTitledFirstName]. [trader.GetFirstNameNoTooltip] бросает на меня красноречивый взгляд, словно желая сказать: «Ну же, [ROOT.Char.GetTitleAsNameNoTooltip], ты ведь всё понимаешь…»"
 gdp_merchant_unity_contract.1010.a: "[local_ruler.GetTitledFirstNameNoTooltip], прошу, соизвольте объяснить мне, что произошло."
 gdp_merchant_unity_contract.1010.a.tt: "Вы немедленно просите, чтобы [THIS.Char.GetTitledFirstName] всё [Select_CString(THIS.Char.IsFemale, 'объяснила', 'объяснил')]"
 gdp_merchant_unity_contract.1010.b: "Если [person_c.GetTitledFirstNameNoTooltip] хочет встречи — так тому и быть."
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip] желает с нами поговорить."
 gdp_merchant_unity_contract.1010.d: "Давайте закончим всё поскорее."
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "Нас сопровождают в личные покои, где проживает [char_current.GetTitleAsName|l], — помещение откровенно нескромное. [Select_CString(char_current.IsFemale, 'Она', 'Он')] проводит меня в комнату — судя по всему, здесь собираются влиятельнейшие люди [destination.GetTitle.Custom('BaronyTownTypePossessive')] — и жестом приглашает сесть."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName] проводит меня в дом, где располагается [Select_CString(char_current.IsFemale, 'её', 'его')] компания. Здесь усердно трудятся помощники, старательно вносящие в книги результаты заключённых за день сделок."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName] руководит городскими доками; целые дни [Select_CString(char_current.IsFemale, 'она', 'он')] проводит в наблюдениях за погрузкой и разгрузкой кораблей на причалах. Всё наблюдаемое, а заодно и выплачиваемые капитанами взносы, тщательно заносится в книги."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName] руководит главным рынком владения [destination.GetTitle.GetBaseNameNoTier] — в частности, следит за тем, чтобы у лотошников были необходимые разрешения, а законы, которые издаёт [local_ruler.GetTitleAsNameNoTooltip|l], не попирались."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "[char_current.GetFirstName] сегодня работает в кузнице. [Select_CString(char_current.IsFemale, 'Она', 'Он')] с великим увлечением стучит молотком по подкове и замечает меня лишь тогда, когда я подхожу совсем близко. Поймав мой взгляд, [Select_CString(char_current.IsFemale, 'она', 'он')] извиняется и подзывает подмастерье, чтобы тот закончил работу."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "[char_current.GetFirstName] сегодня работает на дубильне на окраине города — месте, насквозь пропитавшемся зловонным запахом выделываемой кожи. Впрочем, [Select_CString(char_current.IsFemale, 'она', 'он')] почти не обращает внимания на вонь: кожа идёт нарасхват, а поэтому ради прибыли можно смириться с неудобствами."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "[char_current.GetFirstName] сегодня трудится у себя в мастерской; в воздухе здесь стоит густой аромат [char_current.Custom('GetRandomAppropriateTree')]. Заметив меня, [Select_CString(char_current.IsFemale, 'она', 'он')] тут же откладывает в сторону инструмент, которым вырезает соединения."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName] возглавляет [destination.GetTitle.GetAdjectiveNoTooltip|l]ую городскую стражу, однако вместо того чтобы пребывать на посту, [Select_CString(char_current.IsFemale, 'она', 'он')] дремлет в оружейной. Проснувшись от звука моих шагов, [Select_CString(char_current.IsFemale, 'она', 'он')] тут же предлагает мне сесть и бормочет что-то про пару минуток отдыха."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "«Буду с вами [Select_CString(char_current.IsFemale, 'откровенна', 'откровенен')], [ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip], — произносит [Select_CString(char_current.IsFemale, 'она', 'он')]. — Мне говорят, что [Select_CString(trader.IsFemale, 'эта', 'этот')] [trader.GetWomanMan|l] занимается обманом, а кроме того,"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n«Либо вы наведёте у себя в компании порядок, либо вам придётся вести дела в другом месте»."
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "«Неужели это так трудно? — с улыбкой произносит [Select_CString(char_current.IsFemale, 'она', 'он')]. — Ведь другие ведут дела честно. При всём уважении к вашему предприятию, [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] показывает себя не в лучшем свете…»"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "«Предупреждаю вас, — с улыбкой произносит [Select_CString(char_current.IsFemale, 'она', 'он')]. — [local_ruler.GetTitleAsNameNoTooltip] проявляет невероятное терпение, но всё-таки лучше его не испытывать»."
 gdp_merchant_unity_contract.1011.desc.personality.market: "«У меня здесь трудится много купцов, — с улыбкой произносит [Select_CString(char_current.IsFemale, 'она', 'он')] и широко разводит руки, — но только на #EMP вашего#! (с этими словами [Select_CString(char_current.IsFemale, 'она', 'он')] осуждающе показывает на меня пальцем) мне жалуются изо дня в день»."
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "«Как у нас говорят, — поморщившись, произносит [Select_CString(char_current.IsFemale, 'она', 'он')], — #EMP не бывает дыма без огня#!. И, уж поверьте, от этого вашего купца дыма очень много!»"
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "«Я веду свои дела образцово: мои отчётности безупречны, а отношения с клиентами превосходны. Чрезвычайно жаль, что не все из нас поступают так же…»"
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "«Скажу вам прямо: все мы ходим под взором [char_current.GetFaith.WealthGodNamePossessive], и я стараюсь не гневать высшие силы почём зря. Но если кто-то всё-таки их прогневает…»"
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "«Скрывать не буду, я люблю золото не меньше других, а то даже и побольше! Но нельзя же вести дела, когда тебя постоянно облапошивают»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "«По вам видно, [ROOT.Char.GetTitledFirstNameNoTooltip|l], что вы — [Select_CString(ROOT.Char.IsFemale, 'женщина разумная', 'человек разумный')]. Прошу, поймите, что один из ваших людей поступил с нами несправедливо, а разбираться с последствиями нам не по карману»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "«Я — человек прямой, вокруг да около ходить не люблю. Говорю прямо и от других жду того же. [Select_CString(trader.IsFemale, 'Ваша купчиха', 'Ваш купец')] лжёт. Вот и весь сказ»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "«Да, я понимаю, на первый взгляд может показаться, что деньги текут к нам рекой. Однако я не могу заниматься своим делом, если поставки идут кое-как и [Select_CString(trader.IsFemale, 'ваша купчиха', 'ваш купец')] уже в который раз меня подводит»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "«Я веду дела честно, [ROOT.Char.GetTitledFirstNameNoTooltip], как с подчиненными, так и с власть имущими. Но честность должна быть обоюдной, а то кривая дорожка доведет #EMP кое-кого#! до вражды»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "«Мы с вами занятые люди, поэтому скажу прямо. Людей не прокормишь пустыми обещаниями. Разберитесь с этим поскорее»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "«Не сомневаюсь, что в глубине души [trader.GetFirstName] — замечательный человек, но даже моему терпению приходит конец. Собственно, он пришёл уже давно»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "«Мне интересно, как вы собираетесь поступить. [Select_CString(trader.IsFemale, 'Ваша купчиха нажила', 'Ваш купец нажил')] себе много врагов, причём совершенно зря. А ведь мы просто хотим, чтобы к нам относились по-человечески»."
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "у нас пропала часть груза»."
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "на рынок попали дурные товары»."
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "нам не платят причитающиеся пошлины»."
 gdp_merchant_unity_contract.1011.a: "Попытаться найти разумное оправдание."
 gdp_merchant_unity_contract.1011.b: "Попытаться убедить [Select_CString(char_current.IsFemale, 'её', 'его')] в своей порядочности."
 gdp_merchant_unity_contract.1011.c: "Попытаться сочинить какую-нибудь историю."
 gdp_merchant_unity_contract.1011.d.gold: "«Прошу, возьмите — это за причинённые неудобства»."
 gdp_merchant_unity_contract.1011.d.competitiveness: "«Я непременно всё исправлю»."
 gdp_merchant_unity_contract.1011.e: "«Возможно, мы сможем #EMP договориться#!?»"
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], объяснись."
 gdp_merchant_unity_contract.1011.f.partner_away: "Будь здесь мой [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…"
 gdp_merchant_unity_contract.1011.f.partner_diff: "Будь у меня другой [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…"
 gdp_merchant_unity_contract.1011.f.no_partner: "Будь у меня [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…"
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT Предоставленные вами заверения: [task_contract.MakeScope.Var('assurances_given').GetValue|0V] из возможных #V 3#!#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT Вы поговорили с [task_contract.MakeScope.Var('chars_checked').GetValue|0V] из возможных #V 3#! [Concept('characters', 'персонажей')|E]#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "Вы предоставили #P +1#! заверение"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "Заверение не предоставлено"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Оставляем один в уме здесь — теряем строку там…"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "Так, подождите. Ага. Вот как?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "Глупая ошибка с [Select_CString(char_current.IsFemale, 'ее', 'его' )] стороны"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Последовательная речь"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "Не [Select_CString(char_current.IsFemale, 'такая умная', 'такой умный' )], как хочет казаться"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Умнее вас в полтора раза"
 gdp_merchant_unity_contract.1011.learning.tt.success: "Вы знаете, что искать"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "Вы все осмотрели, но ничего не нашли"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: успех!"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: провал!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: пренебрежение поручением"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "[char_current.GetTitledFirstName], обложившись учётными книгами, выписывает одно нарушение за другим: злоупотребления по службе, куда-то исчезнувшие или преуменьшенные доходы от капиталовложений…"
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "Я долго рассуждаю о добром имени своей компании и о том, что с этим в целом соглашается и [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], поскольку мои слова готовы подтвердить порядочные люди, проживающие в этих краях. Заключённые недавно сделки — это, несомненно, просто погрешность, и про неё можно позабыть, поскольку она не мешает коммерции."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "Я пускаюсь в пространные рассуждения о навалившихся на нас недавно трудностях, перескакиваю с одного вопроса на другой, постоянно отступая от предмета обсуждения, и умалчиваю неудобные подробности. Даже я не разберусь, где истина, а где — ложь."
 gdp_merchant_unity_contract.1012.desc.method.learning: "#EMP Кажется#!, будто разговор длится едва ли не весь день. Мы в подробностях обсудили все деловые вопросы, которыми занимается [char_current.GetTitledFirstName|l] во владении [destination.GetBaronyNameExplicitly]. Всё, что нужно, — спрошено, все ответы даны без утайки."
 gdp_merchant_unity_contract.1012.desc.method.partner: "Допросом занимается [partner.GetFirstName]. [char_current.GetTitledFirstName] едва ли не тонет в нескончаемом потоке вопросов, и [Select_CString(char_current.IsFemale, 'её', 'его')] терпение тает на глазах."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "«Мы будем #EMP крайне#! признательны, если вы проявите понимание», — с этими словами я улыбаюсь, достаю из-за пояса кошель и вываливаю на стол несколько монет. [Select_CString(char_current.IsFemale, 'Собеседница', 'Собеседник')] на миг обмирает; [Select_CString(char_current.IsFemale, 'её', 'его')] взгляд мечется между блестящими кругляшками и моим лицом с приподнятой бровью."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "«[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] глубоко сожалеет, что случившееся недопонимание причинило вам неудобства, — проникновенно произношу я. — Я #EMP лично#! позабочусь о том, чтобы возместить вам убытки»."
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "Всё, что было можно сделать, — сделано. Пора закрыть этот вопрос."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip] смотрит на меня понимающим взглядом и сгребает монеты к себе."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "Оцепенение проходит быстро: [char_current.GetFirstNameNoTooltip] приходит в ярость и указывает мне на дверь."
 gdp_merchant_unity_contract.1012.desc.result.success: "Немножко хитрости здесь, немножко жалоб на превратности купеческой жизни там — и вот [char_current.GetFirstNameNoTooltip] не сразу, но всё-таки соглашается с моими доводами, оправдывающими расхождения. Такова прискорбная действительность торговли между далёкими владениями."
 gdp_merchant_unity_contract.1012.desc.result.failure: "Я стараюсь изо всех сил, однако на каждый мой довод у [Select_CString(char_current.IsFemale, 'неё', 'него')] находится ответ — совет, опровержение или же пример из собственной жизни. Добиться успеха мне не удалось."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "Лучше синица в руках, чем журавль в небе. И теперь прибыль (скорее всего, полученная нечестным путем!) [Select_CString(char_current.IsFemale, 'этой женщины', 'этого человека' )] прекрасно чувствует себя у меня в руках. Пусть даже теперь мы не сможем продолжить расследование в [Select_CString(char_current.IsFemale, 'ее', 'его' )] отношении."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "Надеюсь, в следующем имении нам повезет."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Надеюсь, в следующем имении получится лучше."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "С этим [Select_CString(char_current.IsFemale, 'она', 'он')] не поспорит."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "Только бы мой кошель пережил следующую встречу…"
 gdp_merchant_unity_contract.1012.a: "Далее на очереди — [local_ruler.GetTitledFirstNameNoTooltip|l]."
 gdp_merchant_unity_contract.1012.b: "Вперёд, [person_c.GetTitledFirstNameNoTooltip] ждёт."
 gdp_merchant_unity_contract.1012.c: "Нас ждёт [person_d.GetTitledFirstNameNoTooltip]…"
 gdp_merchant_unity_contract.1012.d: "Покончим с этим поскорее…"
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "Вы продолжаете попытки предоставить заверения"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "Вы решаете, как поступить в сложившейся обстановке"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: разрешение"
 gdp_merchant_unity_contract.1021.desc.intro: "Мы вновь собираемся на городской площади, куда [local_ruler.GetTitledFirstName|l] уже [Select_CString(local_ruler.IsFemale, 'согнала', 'согнал')] ждущих решения истцов и [Select_CString(trader.IsFemale, 'мою купчиху', 'моего купца')]. Последнее слово будет за мной.\n\n[person_c.GetFirstName] и [person_d.GetFirstName] не отрывают от меня глаз, в то время как [trader.GetFirstName] заметно переживает и переминается с ноги на ногу.\n\nЧутьё подсказывает мне, что"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "местные надёжно заняли мою сторону."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "местные в определённой мере удовлетворены моими потугами."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "завоевать доверие местных так и не удалось."
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip] зевает и произносит: «Ну, и что же вы решили касательно"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "пропавшего груза?»"
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "некачественного товара?»"
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "неуплаченных пошлин?»"
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Вы предоставили все возможные заверения и постарались достаточно, чтобы добиться #P исключительного успеха#!, даже если [trader.GetTitledFirstNameNoTooltip|l] не будет [Select_CString(trader.IsFemale, 'наказана', 'наказан')]#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT Вы предоставили достаточно заверений, чтобы с определённой вероятностью добиться #P успеха#!, даже если [trader.GetTitledFirstNameNoTooltip|l] не будет [Select_CString(trader.IsFemale, 'наказана', 'наказан')]#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT Вы не предоставили достаточно заверений, поэтому вполне вероятно, что если [trader.GetTitledFirstNameNoTooltip|l] не будет [Select_CString(trader.IsFemale, 'наказана', 'наказан')], вы натолкнётесь на сопротивление#!"
 gdp_merchant_unity_contract.1021.a: "«Позволю себе повториться: это просто досадное недопонимание»."
 gdp_merchant_unity_contract.1021.a.tt: "Вы считаете свои заверения достаточными"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "Если вы предоставили много заверений"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "Если вы частично предоставили заверения, и местные уступают"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "Если вы не смогли предоставить заверения, и местные недовольны"
 gdp_merchant_unity_contract.1021.b: "Заплатить придется — но половину."
 gdp_merchant_unity_contract.1021.b.tt: "Вы принимаете решение: [local_ruler.GetTitledFirstName|l] в своём праве, но [trader.GetTitledFirstName|l] будет платить меньше требуемого"
 gdp_merchant_unity_contract.1021.c: "«Всё это — сплошной вздор. Клевета и вздор!»"
 gdp_merchant_unity_contract.1021.c.tt: "Вы отрицаете всякую неправоту компании"
 gdp_merchant_unity_contract.1021.d: "«[trader.GetTitledFirstNameNoTooltip] [Select_CString(trader.IsFemale, 'виновна', 'виновен')], и [Select_CString(trader.IsFemale, 'её', 'его')] следует наказать»."
 gdp_merchant_unity_contract.1021.d.tt: "[trader.GetTitledFirstNameNoTooltip] приносится в жертву ради блага компании"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: простое недопонимание"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: улаженный вопрос"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: неулаженный вопрос"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: неудовлетворительно"
 gdp_merchant_unity_contract.1022.desc.success_critical: "Местные жители переглядываются друг с другом и довольно кивают, а [trader.GetFirstName] лучится от радости. Даже [local_ruler.GetTitledFirstName|l] выглядит так, словно у [Select_CString(local_ruler.IsFemale, 'неё', 'него')] с плеч упала целая гора. «Замечательно! Значит, вопрос закрыт!» — громко объявляет [Select_CString(local_ruler.IsFemale, 'она', 'он')].\n\nИстцы рассыпаются передо мной в благодарностях за то, что теперь они могут спокойно спать. Как это ни удивительно, но теперь [destination.GetBaronyNameExplicitlyNoTooltip] только #EMP больше#! доверяет нашей компании."
 gdp_merchant_unity_contract.1022.desc.success_standard: "Местные жители переглядываются друг с другом и задумчиво кивают, а [trader.GetFirstName] не может сдержать улыбки. [local_ruler.GetTitledFirstName] не разделяет их радости, однако явно больше не желает здесь задерживаться. «Итак, значит, вопрос закрыт», — произносит [Select_CString(local_ruler.IsFemale, 'она', 'он')], словно сомневаясь в собственных словах.\n\nИстцы, похоже, в целом согласны с предъявленными доводами, а репутация компании во владении [destination.GetBaronyNameExplicitlyNoTooltip] пока что не пострадала."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "На какой-то миг мне кажется, что [local_ruler.GetTitledFirstName|l] вместе со своими подхалимами сейчас разнесёт моё неубедительное заключение в пух и прах, однако вместо этого повисает неловкая тишина.\n\n«Ну хорошо… — наконец со вздохом произносит [local_ruler.GetTitleAsNameNoTooltip|l], бросая взгляд на недовольных истцов. — Но смотрите, чтобы больше такого не повторялось».\n\nМестные явно сомневаются в моём решении, однако это уже не моя забота — пускай с ними разбирается [trader.GetFirstName]."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "Над площадью повисает тишина, напряжённая и неловкая.\n\nМестные жители бросают друг на друга недобрые взгляды, а их лица, кажется, вот-вот скривятся в злобном оскале.\n\n«И это всё?» — понизив голос, спрашивает [local_ruler.GetTitledFirstName|l]. Истцы согласны: они задаются тем же вопросом.\n\n[trader.GetFirstName] нервно сглатывает слюну и произносит: «Мне крайне неприятно, что так получилось. Но мы ничего не можем поделать, иногда так бывает…»"
 gdp_merchant_unity_contract.1022.a: "Лучше и быть не могло."
 gdp_merchant_unity_contract.1022.b: "Всё хорошо, что хорошо кончается…"
 gdp_merchant_unity_contract.1022.c: "Могло быть и лучше."
 gdp_merchant_unity_contract.1022.d: "Э-э… Кажется, пора уходить."
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: отрицание"
 gdp_merchant_unity_contract.1023.desc: "Истцы сердито перешёптываются друг с другом — они, очевидно, обескуражены. [local_ruler.GetTitleAsName|U] тоже в недоумении, как поступать дальше.\n\n[trader.GetFirstName] при звуках моего голоса выпрямляется, вновь обретая гордость, а я произношу: «Я не допущу, чтобы доброе имя моей компании втаптывали в грязь из-за каких-то пустяков!»\n\nЗадрав нос, я продолжаю: «Вы лишь зря потратили моё время. У меня срочные дела, и [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] не станет ждать!»"
 gdp_merchant_unity_contract.1023.a: "Пора уезжать."
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: на растерзание"
 gdp_merchant_unity_contract.1024.desc: "[local_ruler.GetTitledFirstName|U] с лёгким недоумением на лице подзывает городскую стражу, и [trader.GetFirstName] под звуки ликующей толпы оцепенело наблюдает, как на [Select_CString(trader.IsFemale, 'её', 'его')] руках захлопываются кандалы.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip|U], подожди!» — надломившимся голосом кричит [Select_CString(trader.IsFemale, 'она', 'он')]. Я лениво отмахиваюсь: «Скатертью дорога. Всё равно ты ничего не смыслишь в торговле…»"
 gdp_merchant_unity_contract.1024.a: "Необходимая жертва."
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: впечатляющая прозорливость"
 gdp_merchant_unity_contract.1031.desc: "«[ROOT.Char.GetTitledFirstNameNoTooltip]?»\n\nЯ поднимаю глаза от учётных книг и вижу… отдалённо [Select_CString(hopeful.IsFemale, 'знакомую мне женщину', 'знакомого мне человека')] #L [hopeful.GetCulture.GetCollectiveNoun|l]их#! кровей. Где же мы встречались?..\n\n«Я — [hopeful.GetTitledFirstName|l], [ROOT.Char.GetTitleAsNameNoTooltip|l]. [destination_1.GetBaseNameNoTier], помните? Вы приехали в мой родной городок несколько лет назад и уладили кое-какое недопонимание. Я считаю, вы поступили очень благородно.\n\nКак бы то ни было, в конце концов я [Select_CString(hopeful.IsFemale, 'разорилась', 'разорился')] и ищу новую работу. Возможно, вы найдёте мне… занятие»."
 gdp_merchant_unity_contract.1031.a: "Ну хорошо. Добро пожаловать!"
 gdp_merchant_unity_contract.1031.b: "Компании вы не нужны."
