 associate_request_fulfilled_title: "Обещание помощнику выполнено"
 associate_request_failed_title: "Обещание помощнику нарушено"
 gdp_merchant.3000.t: "Подсказка переводчика"
 gdp_merchant.3000.desc: "[translator.GetTitledFirstName], [Select_CString(translator.IsFemale, 'моя переводчица', 'мой переводчик' )], уже давненько не показывается на глаза — видимо, [Select_CString(translator.IsFemale, 'заперлась', 'заперся' )] у себя и корпит над каким-то текстом на чужом языке. Наконец, [translator.GetSheHe] объявляется в конторе.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip|U], — широко улыбаясь, начинает [translator.GetFirstNameNoTooltip], — я [Select_CString(translator.IsFemale, 'изучала', 'изучал' )] отчёты и [Select_CString(translator.IsFemale, 'оценивала', 'оценивал' )] [market.GetName|l]. Этот [saved_culture.GetLanguage.GetName|l] диалект дался мне нелегко, но в записях было множество ценных сведений о движении товаров местного производства!»"
 gdp_merchant.3000.a: "«[translator.GetFirstNameNoTooltip], я хочу знать всё до последней крупицы»."
 gdp_merchant.3000.a.tt: "[Concept('company', 'Компания')|E] получает [Concept('trade_expertise', 'познания в торговле')|E] всеми [Concept('trade_categories_short', 'категориями товаров')|E], которыми торгует [market.GetName|l]"
 gdp_merchant.3000.b: "«Можешь научить меня этому языку?»"
 gdp_merchant.3000.b.tt: "Ваши [Concept('scheme', 'происки')|E] получают эффект «[GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]»"
 gdp_merchant.3000.c: "«Продай эти сведения тому, кто больше предложит»."
 gdp_merchant.3000.d: "«Тебе нужно совершенствовать свои знания языков»."
 gdp_merchant_translator_buff_modifier: "Наставник-переводчик"
 gdp_merchant.3010.t: "Помощь посредника"
 gdp_merchant.3010.desc: "Моё доверенное лицо, [fixer.GetTitledFirstName], всё время что-то вынюхивает во владении [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. После продолжительного отсутствия [fixer.GetSheHe], наконец, присылает записку с просьбой о встрече. Там сказано, что [Select_CString(fixer.IsFemale, 'ей', 'ему' )] удалось найти кое-что #EMP интересное#!.\n\n"
 gdp_merchant.3010.desc.secret: "Напустив на себя таинственный вид, [fixer.GetFirstNameNoTooltip] усаживается в кресло… и расплывается в широкой улыбке. «Пришлось изрядно потрудиться, но теперь у меня есть твёрдые доказательства того, что [secret_haver.GetName] — [secret.GetName|l]!»"
 gdp_merchant.3010.desc.scheme: "Напустив на себя таинственный вид, [fixer.GetFirstNameNoTooltip] усаживается в кресло. «[ROOT.Char.GetTitleAsNameNoTooltip|U], у меня дурные вести, — с тревогой начинает [fixer.GetSheHe]. — [scheme_owner.GetName] что-то против вас замышляет. [scheme_owner.GetSheHe|U] строит козни против компании!»"
 gdp_merchant.3010.a: "«Полезная информация, но я хочу знать больше»."
 gdp_merchant.3010.b: "«А ты [Select_CString(fixer.IsFemale, 'та ещё хитрюга', 'тот ещё хитрец' )]. А, [fixer.GetFirstNameNoTooltip]?»"
 gdp_merchant.3010.c: "«Я не желаю выслушивать сплетни»."
 gdp_merchant.3010.d: "«Эти сведения пригодятся в нашем деле…»"
 gdp_merchant.3020.t: "Предложение пристава"
 gdp_merchant.3020.desc: "Мой пристав [bailiff.GetTitledFirstName] просматривает списки должников, размышляя, как бы быстрее и эффективнее выбить из них наши [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')].\n\n"
 gdp_merchant.3020.pressure: "«[pressure_debtor_1.GetTitledFirstName|U] так и сидит без денег, но хотя бы для приличия [Select_CString(pressure_debtor_1.IsFemale, 'могла', 'мог' )] бы заплатить процент по займу…» — тихонько рычит [bailiff.GetSheHe].\n\n"
 gdp_merchant.3020.demand: "«Я точно знаю, что [demand_debtor_1.GetTitledFirstName] может вернуть долг… — вздыхает [bailiff.GetFirstNameNoTooltip]. — Просто не хочет. [demand_debtor_1.GetSheHe|U] считает, что это ниже [Select_CString(demand_debtor_1.IsFemale, 'её', 'его' )] достоинства!»\n\n"
 gdp_merchant.3020.third: "«А там ещё [portrait_3.GetTitledFirstName]…» — бормочет себе под нос пристав."
 gdp_merchant.3020.a: "«Ну конечно, [pressure_debtor_1.GetFirstNameNoTooltip] может выплатить #EMP небольшие#! проценты»."
 gdp_merchant.3020.a.tt: "Долг перед вами уменьшится на #V [THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#![gold_i]"
 gdp_merchant.3020.b: "«[demand_debtor_1.GetTitledFirstNameNoTooltip] вконец [Select_CString(demand_debtor_1.IsFemale, 'обнаглела', 'обнаглел' )]. Надави на [Select_CString(demand_debtor_1.IsFemale, 'неё', 'него' )]»."
 gdp_merchant.3020.c: "«[pressure_debtor_2.GetFirstNameNoTooltip] может позволить себе выплатить часть долга»."
 gdp_merchant.3020.d: "«[demand_debtor_2.GetFirstNameNoTooltip] явно тянет с возвратом средств!»"
 gdp_merchant.3020.e: "«Похоже, [pressure_debtor_3.GetFirstNameNoTooltip] [Select_CString(pressure_debtor_3.IsFemale, 'забыла', 'забыл' )] о своих обязательствах. Надо освежить [Select_CString(pressure_debtor_3.IsFemale, 'её', 'его' )] память»."
 gdp_merchant.3020.f: "«[demand_debtor_3.GetFirstNameNoTooltip] зарывается. Пора послать [Select_CString(demand_debtor_3.IsFemale, 'ей', 'ему' )] чёткий сигнал»."
 gdp_merchant.3020.g: "«Предпочту, чтобы они и дальше оставались у меня в долгу»."
 ho_loan_demand_refused_title: "Требование возврата средств отклонено"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName] всё ещё [Select_CString(THIS.Story.GetOwner.IsFemale, 'должна', 'должен' )] вам [outstanding|V0][gold_i]"
 ho_loan_reduced_title: "Долг сокращён"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName] теперь [Select_CString(THIS.Story.GetOwner.IsFemale, 'должна', 'должен' )] вам [outstanding|V0][gold_i]"
 gdp_merchant.3031.t: "Активность агента"
 gdp_merchant.3031.desc: "В последние дни мой рыночный агент, [market_agent.GetTitledFirstName], до глубокой ночи засиживается над учётными книгами, изучая записи в неровном свете догорающих свечей. Сегодня утром [market_agent.GetSheHe] заходит в мой кабинет, моргая покрасневшими от недосыпа глазами.\n\n«[ROOT.Char.GetTitledFirstName|U]! Я [Select_CString(market_agent.IsFemale, 'просмотрела', 'просмотрел' )] счета и могу сказать, что [market.GetName|l] предлагает невиданные возможности, которыми…» #weak *зевает*#! «…было бы глупо не воспользоваться!»"
 gdp_merchant.3031.a: "«Хорошая работа, [market_agent.GetFirstNameNoTooltip]. А теперь иди спать»."
 gdp_merchant.3031.a.tt: "[market.GetName] предлагает новую [Concept('trade_opportunity', 'торговую возможность')|E]: [trade_opportunity.GetType.GetName|V]"
 gdp_merchant.3031.b: "«Забудь про это и сосредоточься на наших нынешних проблемах!»"
 gdp_merchant.3040.t: "Консультация куратора"
 gdp_merchant.3040.desc: "Мой куратор [antiquarian.GetTitledFirstName] внимательно следит за состоянием коллекций, которыми владеет [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]. [antiquarian.GetSheHe|U] не только заботится о сохранности экспонатов, но и развлекает редких гостей занимательными рассказами из истории нашего собрания.\n\nКак-то утром я останавливаюсь полюбоваться диковинками, выставленными в залах компании. Рядом тут же появляется [antiquarian.GetFirstNameNoTooltip]: «[artifact.GetName|U]? Весьма необычный образец, [ROOT.Char.GetTitleAsNameNoTooltip|l]. Иногда я задаюсь мыслью, достоин ли этот предмет храниться в нашей коллекции…»"
 gdp_merchant.3040.b: "«Пора от него избавиться. Найди мне покупателя»."
 gdp_merchant.3040.c: "«Мне кажется, это сокровище нуждается в реставрации»."
 gdp_merchant.3040.c.tt: "[artifact.GetName] и так в идеальном состоянии"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName] — #V животное#!"
 gdp_merchant.3040.d: "«Глупости. Наше собрание безупречно!»"
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "Простые горожане даже не догадываются, какой путь проходит каждый лоскут ткани через знойные пустыни и бурлящие моря, прежде чем попадает на прилавок.\n\nТяжкий труд купцов, моряков и вьючных животных — вот чем живёт [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Даже далёкие города, где никто не знает ни слова по-[ROOT.Char.GetCulture.GetLanguage.GetCollectiveNounNoTooltip|l]и, целиком и полностью зависят от наших поставок."
 gdp_merchant.8000.a: "Мы честно заслужили эту высокую репутацию."
 gdp_merchant.8000.b: "Главное — не забывать, с чего мы начинали."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "Дороже тканей, драгоценных камней и металлов могут быть лишь те чудесные изделия, которые из них кропотливо создают талантливые ремесленники.\n\nГениальные механизмы, изысканные украшения и прочие рукотворные диковинки — это то, чем живёт и дышит [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l], Именно благодаря этим вещам наша компания стала для людей символом качества и надёжности."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "Даже величайший из королей станет бессилен, если лишится своих богатств. К его счастью, мы не дадим ему упасть, а обходительно раскинем под ним наши сети из займов, словно пауки.\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName]. Это название известно при каждом дворе, ведь когда сильным мира сего нужна помощь, они обращаются именно к нам. Но каким бы отчаянным ни было их положение, мы никогда не упустим своей выгоды."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "Книга странствий"
 gdp_merchant.8010.desc: "Лишь немногие могут в своей жизни повидать и испытать столько, сколько довелось мне. Государи, равно как и бедняки, часто не имеют возможности отправиться в далёкие земли, а потому они жаждут услышать истории о том загадочном мире, который остаётся для них недосягаем.\n\nСидя вечерами за столом и вспоминая о своих путешествиях во владении [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier], я задумываюсь о том, какие из них стоит рассказать моим потомкам и случайным читателям."
 gdp_merchant.8010.a: "Я уделю внимание иностранным порядкам и обычаям."
 gdp_merchant.8010.a.tt: "Качество книги будет главным образом зависеть от вашего [Concept('trait_level_track_xp', 'опыта свойств')|E] «[GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|V]» #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#! и «[GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|V]» #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )])#!"
 gdp_merchant.8010.b: "Людям интересны сведения о рынках и советы по торговле."
 gdp_merchant.8010.c: "Я опишу необычные города и чудеса, которые мне повстречались."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "Хотя на это ушло больше времени, чем ожидалось, я наконец заканчиваю работу и с некоторым удовлетворением смотрю на свои записи. Я подробно [Select_CString(ROOT.Char.IsFemale, 'описала', 'описал')] своё путешествие во владение [poi.GetName], дополнив его интересными историями, которые со мной приключились. При этом экзотические [author.Custom('GetTravelogueTopic')|l] удостоились в моём рассказе особого внимания.\n\n"
 gdp_merchant.8011.weak: "Вновь просматривая готовый текст, я понимаю, что мог бы написать гораздо лучше, если бы постарался. [Select_CString(ROOT.Char.IsFemale, 'Разочарованная', 'Разочарованный')] своим сочинением, я откладываю перо в сторону."
 gdp_merchant.8011.mid: "Вновь просматривая готовый текст, я испытываю определённую гордость за свой труд, но в то же время меня не покидает ощущение, что этому сочинению недостаёт чего-то особенного."
 gdp_merchant.8011.great: "Вновь просматривая готовый текст, я невольно хихикаю над собственными словами и с упоением перечитываю отдельные эпизоды, словно я вижу их в первый раз. Можно с уверенностью сказать, что сочинение удалось на славу!"
 gdp_merchant.8011.a: "Я пока оставлю эту книгу себе."
 gdp_merchant.8011.b: "Я сохраню эту книгу в библиотеке компании."
 travelogue_description_full: "Любопытная книга о путешествиях во владении [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier], которую [Select_CString(author.IsFemale, 'написала купчиха', 'написал купец')] по имени [author.GetTitledFirstName]. В ней [Select_CString(author.IsFemale, 'она', 'он')] подробно описывает впечатления, которые на [Select_CString(author.IsFemale, 'неё', 'него')] произвели иностранные [author.Custom('GetTravelogueTopic')|l].\n\n"
 travelogue_name_1: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip] и [Select_CString(author.IsFemale, 'её', 'его' )] странствия"
 travelogue_name_2: "Дорога во владение [poi.GetCounty.GetName]"
 travelogue_name_3: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip], [Select_CString(author.IsFemale, 'странствующая купчиха', 'странствующий купец')]"
 travelogue_name_4: "В стране [poi.GetCounty.GetName]"
 travelogue_name_5: "Приключения во владении [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_6: "Путешествия по [author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip]им землям"
 travelogue_name_7: "Далёкие земли"
 travelogue_name_8: "Туда и обратно"
 travelogue_name_9: "[poi.GetCulture.GetCollectiveNounNoTooltip]их земель"
 travelogue_name_10: "[poi.GetNameNoTierNoTooltip], [poi.GetTitle.Custom('BaronyTownType')|l] тайн"
 travelogue_name_11: "Бесчисленные"
 travelogue_name_12: "Странствия"
 travelogue_name_13: "Путешествия"
 travelogue_name_14: "[author.GetFirstNameNoTooltip] и [Select_CString(author.IsFemale, 'её', 'его' )] приключения"
 travelogue_topic_customs: "обычаи"
 travelogue_topic_markets: "рынки"
 travelogue_topic_places: "места"
 travelogue_description_quality_weak: "Эта книга плохо написана и полна нелепых вымыслов."
 travelogue_description_quality_mid: "В этой книге есть некоторые интересные и познавательные отрывки."
 travelogue_description_quality_great: "Эта мастерски написанная книга по-настоящему увлекает и захватывает читателя."
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: любознательный гость"
 gdp_merchant.8021.suzerain: "[Select_CString(visitor.IsFemale, 'Моя покровительница', 'Мой покровитель' )] [visitor.GetTitledFirstName] [Select_CString(visitor.IsFemale, 'оказала', 'оказал' )] мне большую честь и"
 gdp_merchant.8021.merchant: "[visitor.GetTitledFirstName], [Select_CString(visitor.IsFemale, 'моя коллега и владелица', 'мой коллега и владелец' )] компании [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.laamp: "[visitor.GetTitledFirstName], глава группы путешественников под названием «[visitor.GetPrimaryTitle.GetDefinitiveName]»,"
 gdp_merchant.8021.ruler: "К моему приятному удивлению [Select_CString(visitor.IsFemale, 'местная правительница', 'местный правитель' )] по имени [visitor.GetTitledFirstName]"
 gdp_merchant.8021.fallback: "[Select_CString(visitor.IsFemale, 'Скромная путешественница', 'Скромный путешественник' )] [visitor.GetTitledFirstName]"
 gdp_merchant.8021.desc: "[Select_CString(visitor.IsFemale, 'прибыла', 'прибыл' )] в моё имение с визитом.\n\n[Select_CString(visitor.IsFemale, 'Она', 'Он' )] буквально светится от восторга, с изумлением оглядываясь по сторонам и рассматривая нашу коллекцию.\n\n«[Select_CString(visitor.IsFemale, 'Рада', 'Рад' )] встрече, [ROOT.Char.GetTitledFirstNameNoTooltip]! Я [Select_CString(visitor.IsFemale, 'наслышана', 'наслышан' )] об успехах вашей компании и о тех диковинках, что вы здесь собрали… Можно ли вас попросить…» — [Select_CString(visitor.IsFemale, 'она', 'он' )] останавливается на полуслове, как вдруг [artifact.GetName|l] приковывает к себе всё [Select_CString(visitor.IsFemale, 'её', 'внимание' )].\n\n«Глазам своим не верю!»"
 gdp_merchant.8021.curio: "[Select_CString(visitor.IsFemale, 'Она', 'Он' )] рассматривает артефакт со всех сторон и просит, чтобы вы в подробностях рассказали [Select_CString(visitor.IsFemale, 'ей', 'ему' )] о нём."
 gdp_merchant.8021.library: "[Select_CString(visitor.IsFemale, 'Она', 'Он' )] осторожно перелистывает страницы, попутно заваливая вас разными вопросами."
 gdp_merchant.8021.creature: "[Select_CString(visitor.IsFemale, 'Она', 'Он' )] восхищённо наблюдает за животным, пока оно лакомится своим кормом."
 gdp_merchant.8021.a: "Это и правда потрясающий экспонат."
 gdp_merchant.8021.b: "Хотите, подарю?"
 gdp_merchant.9021.opening: "Приветствую, [Select_CString(merchant.IsFemale, 'достопочтенная', 'достопочтенный' )] [merchant.GetTitledFirstNameNoTooltip]!"
 gdp_merchant.9021.diarch.desc: "Как [commissioner.GetDiarchTitle|l] владения [commissioner.GetName], я бы [Select_CString(commissioner.IsFemale, 'хотела', 'хотел' )] воспользоваться услугами компании [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.9021.no_diarch.desc: "Я бы [Select_CString(commissioner.IsFemale, 'хотела', 'хотел' )] воспользоваться услугами компании [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.9021.desc: "\n\nВидите ли, [trade_market.GetName|l] страдает от нехватки такого товара, как [target.GetName|l]. Обеспечьте регулярные поставки в регион, и я щедро вознагражу вас."
 gdp_merchant.9021.a: "Ваш заказ принят."
 gdp_merchant.9021.b: "При всём уважении, я [Select_CString(ROOT.Char.IsFemale, 'вынуждена', 'вынужден' )] отказать."
 gdp_merchant.9021.b.cooldown_tt: "Вы не сможете получить другой [Concept('commission', 'заказ')|E] в течение #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! лет"
 gdp_merchant.9005.t: "Вытеснение с рынка"
 gdp_merchant.9005.desc_intro: "[Select_CString(courtier.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))|l] [courtier.GetTitledFirstName] врывается в кабинет с ошарашенным видом.\n\n«[Select_CString(expeller.IsFemale, 'Наша покровительница', 'Наш покровитель' )] [expeller.GetTitledFirstName] [Select_CString(expeller.IsFemale, 'велела', 'велел' )] передать вам срочное сообщение, — запыхаясь говорит [Select_CString(courtier.IsFemale, 'она', 'он' )]. — Наша компания должна закрыть все счета и немедленно прекратить свою деятельность во владении [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]!»\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U] [Select_CString(expeller.IsFemale, 'заявила', 'заявил' )], что компания [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] должна прекратить свою деятельность во владении [expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "[expeller.GetTitledFirstNameNoTooltip] [Select_CString(expeller.IsFemale, 'решила', 'решил' )], что мы не оправдали [Select_CString(expeller.IsFemale, 'её', 'его' )] доверия."
 gdp_merchant.9005.desc_body.enemies: "Похоже, [Select_CString(expeller.IsFemale, 'она', 'он' )] и не думает забывать личные обиды."
 gdp_merchant.9005.desc_body.fallback: "Мы так много вложили в это дело…"
 gdp_merchant.9005.a: "Жаль, что до этого дошло."
 gdp_merchant.9005.a.tt: "Ваша [Concept('company', 'компания')|E] покинет [Concept('realm', 'державу')|E], как того [Select_CString(expeller.IsFemale, 'потребовала', 'потребовал' )] [expeller.GetShortUIName]"
 gdp_merchant.9100.t: "Патрицианский дом [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9100.desc: "Мы сумели добиться признания со стороны надменных #L [new_patrician_liege.GetPrimaryTitle.GetAdjective|l]ой#! семейств, а [new_patrician_liege.GetTitledFirstName] [Select_CString(new_patrician_liege.IsFemale, 'получила', 'получил' )] от нас достаточно веские #emp стимулы#!. Теперь ничто не помешает возвышению нашей семьи.\n\nИ вот у меня в руках документы, удостоверяющие, что [ROOT.Char.GetHouse.GetBaseName] — уже не заурядный торговый дом, но почтенное семейство патрициев, имеющее право заседать в [new_patrician_liege.GetPrimaryTitle.GetAdjectiveNoTooltip|l]ом собрании. По закону мы теперь равны даже дому [new_patrician_liege.GetHouse.GetBaseName]!"
 gdp_merchant.9100.a: "С нетерпением жду следующего заседания собрания."
 merchant_patrician_transition_domicile_tt: "Ваши [Concept('domicile_buildings', 'постройки в имении')|E] сохраняются"
 gdp_merchant.9110.t: "Торговый дом [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9110.desc: "С падением республики дом [ROOT.Char.GetHouse.GetBaseName] и другие знатные семейства патрициев утратили прежнее положение во владении [new_merchant_location.GetBaronyNameExplicitly]. Мы превратились в заурядный торговый дом, целиком зависящий от капризов судьбы, а новый правитель, [ROOT.Char.GetSuzerain.GetTitledFirstName], диктует нам свою волю.\n\nЛишившись представительства в собрании и защиты республики, мы вынуждены уповать на #L [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjective|l]ие#! законы — только они позволят нам сохранить хотя бы тень прежнего величия."
 gdp_merchant.9110.a: "Как же до этого дошло…"
 broke_deal_opinion: "Срыв сделки"
 gdp_repudiated_my_loan_opinion: "Отказ вернуть заём"
 gdp_interest_free_loan_opinion: "Ссудили деньги без процентов"
 gdp_usurious_loan_opinion: "Одолжили мне золото под грабительский процент"
 gdp_merchant_unity_intermarriage_desc: "брак с членом другого [Concept('merchant', 'торгового')|E] [Concept('house', 'дома')|E]"
 gdp_merchant_unity_noble_marriage_desc: "брак с членом благородного [Concept('house', 'дома')|E]"
 gdp_merchant.2000.t: "Запустевший рынок: [needed_good.GetNameNoTooltip|l]"
 gdp_merchant.2000.desc.intro: "Проходя по"
 gdp_merchant.2000.desc.disaster: "пострадавшим от бедствия"
 gdp_merchant.2000.desc.war: "истерзанным войной"
 gdp_merchant.2000.desc.plague: "охваченным чумой"
 gdp_merchant.2000.desc.unrest: "хаотичным"
 gdp_merchant.2000.desc.stalls: "улицам владения [starving_province.GetNameNoTooltip], я замечаю, что некогда оживлённые местные [starving_province.Custom('GetRegionalMarketTermGlossPlural')|l] совершенно опустели.\n\nНа прилавках практически нет еды, и лишь несвежие [ROOT.Char.Custom('GetLocalStreetFoodPlural')|l] и гнилые [ROOT.Char.Custom('RegionalRootVegetablePlural')|l] изредка мозолят глаза. Вдоль дорог то и дело встречаются истощённые горожане, которые роются в отбросах в надежде найти что-нибудь съестное."
 gdp_merchant.2000.a: "Мне стоит покрепче держать свой кошель."
 gdp_merchant.2000.b: "Народ обязательно будет искать виноватого."
 gdp_merchant.2000.c: "Это меня не касается."
 gdp_merchant.2010.t: "[craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip] и монополия:"
 gdp_merchant.2010.t.smith: "кузнец"
 gdp_merchant.2010.t.goldsmith: "ювелир"
 gdp_merchant.2010.t.carpenter: "Плотник"
 gdp_merchant.2010.t.tanner: "дубильщик"
 gdp_merchant.2010.t.potter: "гончар"
 gdp_merchant.2010.desc.intro: "[Select_CString(associate.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))|l] [associate.GetFirstName] уже [Select_CString(associate.IsFemale, 'утомила', 'утомил' )] меня разговорами про [Select_CString(craftsman.IsFemale, 'ремесленницу', 'ремесленника' )] по имени [craftsman.GetFirstName], [Select_CString(craftsman.IsFemale, 'которая', 'который' )] живёт во владении [workshop_province.GetName]. До сих пор [Select_CString(craftsman.IsFemale, 'она', 'он' )] меня совершенно не [Select_CString(craftsman.IsFemale, 'интересовала', 'интересовал' )], однако, воочию увидев [Select_CString(craftsman.IsFemale, 'её', 'его' )] изделия, я [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял')], откуда взялся такой ажиотаж.\n\n[craftsman.GetFirstNameNoTooltip] приветствует меня в своей мастерской, не отводя глаз от работы: «Не стесняйтесь, выбирайте. Весь товар на прилавке».\n\nМой взор сразу же падает на"
 gdp_merchant.2010.desc.weapon: "оружие превосходного качества."
 gdp_merchant.2010.desc.chalice: "искусно выкованный потир."
 gdp_merchant.2010.desc.box: "изящную резную деревянную шкатулку."
 gdp_merchant.2010.desc.saddle: "мастерски изготовленное седло."
 gdp_merchant.2010.desc.vase: "богато раскрашенную керамическую вазу."
 gdp_merchant.2010.desc.craftsmanship: "Такое мог изготовить только настоящий мастер."
 gdp_merchant.2010.a: "[Select_CString(craftsman.IsFemale, 'Её', 'Его' )] талант не должен пропадать зря."
 gdp_merchant.2010.b: "[associate.GetFirstNameNoTooltip] [Select_CString(associate.IsFemale, 'могла', 'мог' )] бы у вас кое-чему поучиться."
 gdp_merchant.2010.c: "С вашего позволения я задержусь тут и посмотрю за вашей работой."
 gdp_merchant.2015.t: "[counsel_good.GetNameNoTooltip|U] в цене"
 gdp_merchant.2015.desc: "[Select_CString(patron.IsFemale, 'Моя покровительница', 'Мой покровитель' )], [patron.GetTitledFirstName], внезапно вызывает меня к себе. Зная [Select_CString(patron.IsFemale, 'её', 'его' )] [patron.Custom('quirk_neg_adjective')]ую натуру, я переступаю порог тронного зала с некоторой опаской.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )] [ROOT.Char.GetFirstNameNoTooltip], просветите меня, будьте любезны. Что вы можете поведать о качествах и рыночной стоимости такого товара, как [counsel_good.GetNameNoTooltip|l]?»"
 gdp_merchant.2015.a: "«О, я прекрасно разбираюсь в этой области…»"
 gdp_merchant.2015.a.tt: "У вас должен быть как минимум #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! [Concept('expertise_level', 'уровень познаний в торговле')|E] товарами из [Concept('trade_category_short', 'категории')|E] «[counsel_category.GetName|U]»"
 gdp_merchant.2015.b: "«Ну, я кое-что в этом смыслю…»"
 gdp_merchant.2015.a.monopoly.tt: "Принятие [monopoly_i][Concept('trade_monopoly', 'монополии на торговлю')|E]: [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip] признаёт в вас эксперта"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip] раскрывает ваш обман"
 gdp_merchant.2015.b.monopoly.tt: "Принятие [monopoly_i][Concept('trade_monopoly', 'монополии на торговлю')|E]: [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "«Я стремлюсь к большему, нежели простая торговля»."
 gdp_merchant.2020.t: "Место за столом"
 gdp_merchant.2020.desc: "Впереди вырастает [patron.GetCapitalLocation.GetHolding.GetType.GetName|l] владения [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Сегодня мне выпала немалая честь — [Select_CString(patron.IsFemale, 'моя покровительница', 'мой покровитель' )], [patron.GetTitledFirstName], [Select_CString(patron.IsFemale, 'пригласила', 'пригласил' )] меня на званый ужин. Пока я иду к своему месту, [courtier_1.GetTitledFirstName] буквально прожигает меня полным ненависти взглядом. Перешёптывания придворных едва различимы, но я улавливаю слова «сброд» и «взятка от [Select_CString(ROOT.Char.IsFemale, 'безродной лоточницы', 'безродного лоточника' )]. Голоса смолкают, когда [patron.GetFirstNameNoTooltip] встаёт из-за стола и произносит тост:\n\n«Мои верные спутники, новые друзья и давно потерянные братья! Сегодня вечером я [Select_CString(patron.IsFemale, 'собрала', 'собрал' )] вас, чтобы вы могли насладиться моим гостеприимством. Давайте пировать!»"
 gdp_merchant.2020.a: "«Чудесно. Нам надо делать это почаще!»"
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName|U] [Select_CString(patron.IsLocalPlayer, 'начнете', 'начнет' )] [GetActivityType('activity_feast').GetTextIcon]#TOOLTIP:ACTIVITY_TYPE,activity_feast #L пир#!#! при первой возможности #weak (в течение 1-3 месяцев)#!"
 gdp_merchant.2020.b: "Дом [ROOT.Char.GetHouse.GetBaseNameNoTooltip] добьётся признания, которого мы заслуживаем."
 gdp_merchant.2020.b.unity_gain.desc: "добивается места среди знати для нашего дома"
 gdp_merchant.2020.c: "«Да здравствует [patron.GetTitleAsNameNoTooltip]! А теперь поговорим о делах»."
 gdp_merchant.2020.c.unity_loss.desc: "думает о том, что по-настоящему важно: о деле"
 gdp_merchant.2025.t: "Посредственный купец"
 gdp_merchant.2025.desc: "Когда доходит до дела, [charter_rival.GetTitledFirstName], как обычно, шляется бог знает где. Какое-то время я и [Select_CString(patron.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] [patron.GetTitledFirstName] терпеливо дожидаемся [charter_rival.GetHerHis] появления, а потом садимся просматривать учётные книги за этот месяц без [Select_CString(charter_rival.IsFemale, 'неё', 'него' )].\n\nОтодвинув в сторону разбросанные по столу торговые соглашения, которые мы ещё не успели проверить, [patron.GetFirstNameNoTooltip] поворачивается ко мне:\n\n«[ROOT.Char.GetFirstNameNoTooltip], только между нами… Что #EMP вообще#! за человек [Select_CString(charter_rival.IsFemale, 'эта', 'этот' )] [charter_rival.GetFirstNameNoTooltip]? Что ты о [Select_CString(charter_rival.IsFemale, 'ней', 'нём' )] думаешь? Правильно ли я [Select_CString(patron.IsFemale, 'поступила', 'поступил' )], выдав [Select_CString(charter_rival.IsFemale, 'ей', 'ему' )] хартию?»"
 gdp_merchant.2025.a: "«Возможно, вам стоит передать её мне?»"
 gdp_merchant.2025.a.charter.tt: "Принятие [charter_i][Concept('request_merchant_charter', 'прошения о торговой хартии')|E]: [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "«Я верю вашей безграничной мудрости, [patron.Custom('FormOfAddressForLiege')]»."
 gdp_merchant.2025.b.unity_gain.desc: "демонстрирует веру в мудрость покровителя"
 gdp_merchant.4000.t: "Место в сторонке"
 gdp_merchant.4000.desc.intro: "Явившись на рынок во владении [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], я замечаю, что моих лавочников вытеснили в тёмный переулок возле свинарника. Их прилавки стоят прямо в луже навоза.\n\n"
 gdp_merchant.4000.desc.patron: "Помощники бросаются ко мне с жалобами. Поодаль стоит [Select_CString(market_character.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))], [market_character.GetName], и на губах [Select_CString(market_character.IsFemale, 'её', 'его' )] играет нехорошая ухмылка."
 gdp_merchant.4000.desc.patron_representative: "[patron.GetTitledFirstName|U] [Select_CString(patron.IsFemale, 'прислала', 'прислал' )] сюда [Select_CString(market_character.IsFemale, 'женщину', 'человека' )] по имени [market_character.GetName] — кажется, это [Select_CString(patron.IsFemale, 'её', 'его' )] [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))]. Пока помощники бросаются ко мне с жалобами, [market_character.GetSheHe] стоит поодаль, и на губах [Select_CString(market_character.IsFemale, 'её', 'его' )] играет нехорошая ухмылка."
 gdp_merchant.4000.desc.body: "\n\nЯ подхожу поближе, и [market_character.GetFirstNameNoTooltip] поворачивается ко мне."
 gdp_merchant.4000.desc.body.patron: "«Впредь [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] будет вести свои дела здесь. — [market_character.GetSheHe] кивает в сторону свиней. —"
 gdp_merchant.4000.desc.body.patron_representative: "«Я говорю от имени [Select_CString(patron.IsFemale, 'вашей покровительницы', 'вашего покровителя' )], — судя по блеску в [Select_CString(market_character.IsFemale, 'её', 'его' )] глазах, [market_character.GetSheHe] явно наслаждается произведённым эффектом. —"
 gdp_merchant.4000.desc.outro: "Вы не следуете нашим обычаям и ничего не знаете об учении [Glossary( 'Кун-цзы', 'CONFUCIUS_GLOSS' )]. Пока вы не научитесь, это самое подходящее для вас место»."
 gdp_merchant.4000.b: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] узнать о Пути…"
 gdp_merchant.4000.b.tt: "Ваш следующий #TOOLTIP:ACTIVITY_TYPE,activity_adult_education #L визит в университет#!#! с характеристикой «[GetTrait('confucian_education').GetName(GetNullCharacter)]» стоит на #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#! меньше [Concept('gold', 'золота')|E]"
 gdp_merchant.4000.c: "Я им покажу!.."
 gdp_merchant.4010.t: "Врата учёности"
 gdp_merchant.4010.desc: "К вечеру я могу наконец отдохнуть от рыночной суеты и выпить чашечку чая. Но спокойствие длится недолго: я замечаю, как в мою сторону украдкой поглядывает [Select_CString(student.IsFemale, 'местная учёная', 'местный учёный' )].\n\n«[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] — страшное место! Таких заносчивых людей, как там, ещё поискать, — говорит [Select_CString(student.IsFemale, 'она', 'он' )] своему приятелю. — Каждый считает себя лучше нас, пусть мы и соблюдаем все положенные обряды. Мы честно сдали экзамены, а что умеет [ROOT.Char.GetFirstNameNoTooltip], кроме как наживаться на других?»."
 gdp_merchant.4010.a: "Экзамены не такие уж сложные."
 gdp_merchant.4010.b: "«Как думаете, чей чай вы пьёте?»"
 gdp_merchant.4010.c: "«Как думаете, без кого здесь можно спокойно обойтись?»"
 gdp_merchant.4020.t: "Шелковый путь"
 gdp_merchant.4020.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly|U] встречает меня шумом и гамом. Я оказываюсь в гуще людей и животных, нескончаемым потоком проходящих через ворота. Повсюду тянутся бесчисленные караваны; нагруженные огромными тюками дромадеры, размерами напоминающие слонов, покачиваются из стороны в сторону под тяжестью поклажи.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "Купцы разгружают целые горы товаров — подобное изобилие трудно даже представить.\n\nПрилавки ломятся от еды, и часть съестного уже выбрасывают: невозможно распродать продукты, пока они не испортились."
 gdp_merchant.4020.desc.steady_trading: "Никогда прежде мне не доводилось видеть такого обилия товаров и людей. Народу здесь так много, что все мы сливаемся в единую шумную толпу.\n\nСтоит одному каравану замедлиться, как погонщик тут же пускает в ход кнут."
 gdp_merchant.4020.desc.hardship: "Судя по разговорам — мне удаётся выловить несколько знакомых слов из чужеродных речей — рынок переживает не лучшие времена.\n\nДолжно быть, в сытые годы, когда здесь царило благополучие, прилавки ломились от товаров…"
 gdp_merchant.4020.a: "Этот путь ведёт в будущее."
 gdp_merchant.4030.t: "Далёкие богатства"
 gdp_merchant.4030.desc.intro: "[Select_CString(associate.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] входит в кабинет с восторженным видом. Мне ни за что бы не подумалось, что [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] может вызывать такое же восхищение, что и горы золота.\n\n[Select_CString(associate.IsFemale, 'Она', 'Он' )] вручает мне шкатулку, внутри которой"
 gdp_merchant.4030.desc.silk: "превосходнейший шёлк, тончайший и почти невесомый.\n\n"
 gdp_merchant.4030.desc.spice: "душистый порошок из свежемолотого растения.\n\n«Местные называют его [rumoured_market_owner.Custom('RegionalSpice')]», — поясняет [Select_CString(associate.IsFemale, 'она', 'он' )]."
 gdp_merchant.4030.desc.jade: "драгоценный камень цвета нефрита, отполированный до стеклянной гладкости.\n\n"
 gdp_merchant.4030.desc.ivory: "миниатюрная крепость, вырезанная из слоновой кости.\n\n"
 gdp_merchant.4030.desc.outro: "«Это мне продал один купец, который очень бахвалился своими связями с [rumoured_market_owner.GetCulture.GetNameNoTooltip|l]ими товарищами на Шёлковом пути. [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] — это ничто, здесь мы зарабатываем гроши. Вот [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip] — совсем другое дело: [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')|l] там — настоящая золотая жила»."
 gdp_merchant.4030.a: "«Шёлковый путь, говоришь?»"
 gdp_merchant_4030_a_tt: "Если вы переместите [Concept('company', 'компанию')|E] на рынок города [rumoured_market.GetName] в следующие #V 5#! лет, на этом [Concept('market', 'рынке')|E] в течение #V 10 лет#! будет действовать модификатор «[GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]»"
 gdp_merchant.4030.b: "«Благодарю тебя за продуманный подарок»."
 gdp_merchant.4030.c: "«Мы занимаемся здесь важным делом, [associate.GetFirstNameNoTooltip]»."
 merchant_unity_local_business: "отдано предпочтение местному рынку, а не [Concept('silk_road', 'Шёлковому пути')|E]"
 gdp_merchant.4030.artifact.silk: "Шёлк из владения [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant.4030.artifact.silk.desc: "Отрез тончайшего шёлка с рынков Шёлкового пути — почти невесомого и необычайно гладкого на ощупь."
 gdp_merchant.4030.artifact.spice: "Мешочек специй"
 gdp_merchant.4030.artifact.spice.desc: "Мешочек с ароматной приправой, попавшей сюда с рынков Шёлкового пути."
 gdp_merchant.4030.artifact.jade: "Отполированный нефрит"
 gdp_merchant.4030.artifact.jade.desc: "Камень нефритового цвета с рынков Шёлкового пути, отполированный так, что поверхность на ощупь напоминает стекло."
 gdp_merchant.4030.artifact.ivory: "Крепость из слоновой кости"
 gdp_merchant.4030.artifact.ivory.desc: "Миниатюрная крепость, аккуратно вырезанная из слоновой кости и попавшая сюда с рынков Шёлкового пути."
 gdp_merchant.5000.t: "Тайное стало явным"
 gdp_merchant.5000.desc.debtor: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] не знает покоя: дверь в кабинет распахивается, и внутрь в сопровождении моих помощников входит [Select_CString(accuser.IsFemale, 'моя', 'мой' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))]."
 gdp_merchant.5000.desc.debtor_paranoid: "[Select_CString(accuser.IsFemale, 'Моя', 'Мой' )] [accuser.GetFirstName] ходит легонько, как кошка: тихо скрипнув дверью, [Select_CString(accuser.IsFemale, 'она', 'он' )] прокрадывается в мой кабинет. [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] не знает покоя…"
 gdp_merchant.5000.desc.bishop: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] не знает покоя: на пороге моего кабинета появляются грозные фигуры в капюшонах, а вскоре в сопровождении моих помощников приходит и [accuser.Custom('GetActualBishopTitle')|l] [accuser.GetFirstName]."
 gdp_merchant.5000.desc.clergy: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] не знает покоя: на пороге моего кабинета появляются грозные фигуры в капюшонах, а вскоре в сопровождении моих помощников приходит и [accuser.Custom('PriestTitle')|l] [accuser.GetFirstName]."
 gdp_merchant.5000.desc.steward: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] не знает покоя: дверь в кабинет распахивается, и внутрь в сопровождении моих помощников врывается [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))]. Должно быть, этого человека [Select_CString(debtor.IsFemale, 'послала', 'послал' )]."
 gdp_merchant.5000.desc.break: "\n\n«[ROOT.Char.GetTitledFirstNameNoTooltip], я хочу обсудить с вами один заём. Его получатель, если помните, — это [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'я', debtor.GetTitledFirstName )|l]», — произносит [Select_CString(accuser.IsFemale, 'она', 'он' )]."
 gdp_merchant.5000.desc.accepted: "«Я на дух не переношу лжи. Покажите мне конторские книги, и мы во всём разберёмся»."
 gdp_merchant.5000.desc.discouraged.debtor: "«Напомню вам, что [accuser.GetFaith.Custom('HouseOfWorshipBase')|l] не одобряет ростовщичество. Предлагаю рассчитаться прямо сейчас и не доводить дело до разбирательств»."
 gdp_merchant.5000.desc.shunned.debtor: "«Как только об этом узнают [accuser.Custom('DefaultPriestTitlePlural')|l], вам не сдобровать: вашу лавочку постараются тут же прикрыть. Я же предлагаю вам возможность спастись»."
 gdp_merchant.5000.desc.accepted.steward: "«Ваш покровитель на дух не переносит лжи. Покажите мне конторские книги, и мы поправим все несоответствия в цифрах»."
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "«Вы, как купец, наверняка прекрасно понимаете: ничего в этой жизни не даётся даром. Мы надеемся, что всё получится уладить здесь и сейчас, без лишнего шума. Ни к чему подвергать ваше дело опасности из-за такой оплошности и вредить торговле»."
 gdp_merchant.5000.desc.shunned: "«Ваш подход к ведению дел достоин презрения. Как вы вообще можете называть себя купцом и торговать товарами, которых нет? Просите прощения, иначе вами займётся уже суд»."
 gdp_merchant.5000.a: "«Разве вы не знаете, что лично [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip|l] говорит моими устами?»"
 gdp_merchant.5000.a.debtor: "«Вы же ведь не хотите навредить нашим с вами торговым делам?»"
 gdp_merchant.5000.b: "«Можете забрать наше имущество в счёт возмещения ущерба»."
 gdp_merchant.5000.c: "«Давайте внимательнее посмотрим на вот эти малозаметные строки»."
 gdp_merchant.5000.c.success: "Ваши конторские книги в полном порядке"
 gdp_merchant.5000.c.failure: "В цифрах творится беспорядок"
 gdp_merchant.5000.c.critical: "Проценты плохо замаскированы"
 gdp_merchant.5000.d: "«Пожалуй, я могу отказаться от процентов…»."
 gdp_merchant.5000.e: "«Считайте, что о займе уже забыли»."
 gdp_usury_penance_seized_goods_modifier: "Отобранные караваны"
 gdp_usury_penance_seized_goods_modifier_desc: "Дела этого персонажа идут неважно после того, как стало известно о тайных ссудах под процент."
 gdp_usury_penance_same_faith_scandal_modifier: "Известный ростовщик"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "Этот персонаж пострадал от того, что вскрылось его тайное ростовщичество."
 gdp_usury_penance_forgive_interest_tt: "Тайное начисление [Concept('interest', 'процентов')|E] прощено #weak ([TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsFemale, 'должна', 'должен' )] [gold_i|E]$VALUE|0V$)#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "Замаскированный [Concept('loan', 'заём')|E] продолжает действовать"
 gdp_merchant.5010.t: "Мелкими буквами"
 gdp_merchant.5010.desc: "Мне стало известно, что мой заимодавец [lender.GetFirstName] не вполне честно [Select_CString(lender.IsFemale, 'подошла', 'подошёл' )] к вопросу о погашении займа.\n\nПовторная проверка расчётов выявила в договоре написанные мелкими буквами условия, обязывающие меня выплачивать больше, чем мы договорились изначально.\n\nНесоответствие очевидно. Теперь вопрос лишь в том, стоит ли добиваться справедливости."
 gdp_merchant.5010.a: "Не стоит разглашать этот секрет."
 gdp_merchant.5010.b: "[Select_CString(lender.IsFemale, 'Она', 'Он' )] выплатит мне все проценты."
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U] не получит никаких процентов."
 gdp_merchant.5010.c: "Стоит отказаться от уплаты займа."
 gdp_usury_debtor_discover_interest_tt: "Тайный [Concept('interest', 'процент')|E] — #weak ([gold_i|E]$VALUE|0V$)#!"
 gdp_usury_debtor_keep_secret_tt: "Скрытый [Concept('interest', 'процент')|E] остаётся секретом"
 gdp_usury_debtor_demand_repayment_tt: "Потребовать выплаты тайного [Concept('interest', 'процента')|E]"
 gdp_usury_debtor_inform_creditor_tt: "Персонажу [lender.GetShortUINameNoTooltip] направляется письмо"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ Я требую немедленно выплатить мне проценты, о которых вы умолчали. Впредь даже не пытайтесь меня обманывать."
 gdp_merchant.5020.a: "Весьма досадно."
 gdp_merchant.5020.a.tt: "Скрытые проценты выплачены"
 gdp_usury_penance_interest_paid_back_tt: "Вы больше не должны выплачивать тайный [Concept('interest', 'процент')|E]"
 gdp_merchant.5020.desc_intro: "Мне достаточно было ещё раз ознакомиться с договором, чтобы понять: вы пытаетесь меня обмануть!"
 gdp_usury_debtor_kept_secret_message: "Тайна сохранена"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName] знает о скрытом [Concept('interest', 'проценте')|E], но не будет говорить о нём."
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "Считайте наш договор о займе недействительным. В следующий раз я подумаю дважды перед тем, как принять ваше предложение."
 gdp_merchant.5040.a: "Какая наглость!"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "Мне крайне нелегко об этом писать, но тяготы долгого пути и бесконечные споры на рынках оказались мне не по силам.\n\nПрошу вас войти в моё положение и распорядиться, чтобы компания хотя бы на время вернулась домой."
 gdp_merchant.0060.a: "Если так надо…"
 gdp_merchant.0060.a.tt: "Вы обещаете в течение 2 лет принять решение «[GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName]»."
 gdp_merchant.0060.b: "Придётся потерпеть."
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName] испытывает [Concept('stress', 'стресс')|E] ([stress_i]#N [associate.GetStress|0]#!) и будет набирать его за неудачи в [Concept('schemes', 'происках')|E] на пути."
