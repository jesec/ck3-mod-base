l_russian:
 gdp_merchant.0001.t: "Дорога из золотого кирпича"
 gdp_merchant.0001.desc: "Я теперь свободный человек и захожу на местный рынок по собственным делам. Крики продавцов смешиваются с лязгом и грохотом металла из ближайших мастерских. Улицу заполонили повозки, гружённые товаром: здесь — [ROOT.Char.Custom('RegionalDrink')|l], там — рулоны [ROOT.Char.Custom('RegionalFabric')|l], а то и вовсе [ROOT.Char.Custom('GetRandomRegionalBird')|l].\n\nЗдесь и зародится моя династия."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "С чего бы мне начать?"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "После долгих раздумий я выбираю карьеру торговца. Я сейчас в самом расцвете сил и жажду приключений за границей. Надеюсь, однажды я заключу сделку, которая станет выгодной и для меня, и для вас. А пока [old_primary_title.GetBaseNameNoTierNoTooltip|l] переходит в ваши руки."
 gdp_merchant.0002.a: "Интересный поворот."
 gdp_merchant.0010.t: "Дела семейные"
 gdp_merchant.0010.desc: "После семейной встречи [Select_CString(associate.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName] решительным жестом подзывает меня к себе.\n\n«[associate.Custom2('RelationToMe', ROOT.Char)]!»"
 gdp_merchant.0010.desc.starting: "«Я в этой компании с момента основания…»"
 gdp_merchant.0010.desc.starting_fallback: "«Я работаю на эту семью уже много лет…»"
 gdp_merchant.0010.desc.cont: "Произносит [Select_CString(associate.IsFemale, 'она', 'он')], тщательно подбирая слова."
 gdp_merchant.0010.desc.children: "«Поскольку [Select_CString(heir.IsFemale, 'ваша наследница ещё мала', 'ваш наследник ещё мал')]…»"
 gdp_merchant.0010.desc.no_children: "Поскольку у вас нет взрослых детей…»"
 gdp_merchant.0010.desc.outro: "«Я надеюсь, вы согласитесь меня [Select_CString(associate.IsFemale, 'удочерить', 'усыновить')]. Для меня будет честью представлять ваш дом»."
 gdp_merchant.0010.a: "«Вы мне как [Select_CString(associate.IsFemale, 'дочь', 'сын')]»."
 merchant_adoption_event_tt: "[associate.GetShortUIName] присоединяется к нашему [Concept('house', 'дому')|E]"
 merchant_unity_adoption_loss: "Вы пригласили в ваш [Concept('house', 'дом')|E] помощника"
 gdp_merchant.0010.b: "«Сперва вы должны оправдать моё доверие»."
 gdp_merchant.0010.c: "«Я сообщу о своём решении позже»."
 gdp_merchant.0015.t: "Реалии бизнеса"
 gdp_merchant.0015.desc: "Теперь, когда у нас есть [trade_route.GetNameNoTooltip|l], можно наконец собираться в путь.\n\nПравда, мне ещё предстоит выбрать того, кто будет представлять меня в этом предприятии. [Select_CString(courtier_1.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))] [courtier_1.GetTitledFirstName] — #L [courtier_1.Custom('quirk_pos_adjective')]ый#! человек…"
 gdp_merchant.0015.desc_good_intellect: "среднего ума. Может, [Select_CString(courtier_1.IsFemale, 'она', 'он')] ещё удивит нас скрытыми талантами."
 gdp_merchant.0015.desc_excellent_intellect: "выдающегося ума. Семья будет [Select_CString(courtier_1.IsFemale, 'ею', 'им')] гордиться."
 gdp_merchant.0015.desc_poor_intellect: "небольшого ума. Возможно, эта работа разовьёт [Select_CString(courtier_1.IsFemale, 'её', 'его')] способности."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip] неплохо подойдёт для этой задачи…"
 gdp_merchant.0015.b: "Но вдруг [courtier_2.GetFirstNameNoTooltip] справится лучше?"
 gdp_merchant.0015.c: "Таланты нужны мне здесь."
 gdp_merchant.0015.c.fallback: "Нет, я никого не отпущу."
 gdp_merchant.0015.c.tt: "Ваши товары [Concept('trade_routes','выезжают')|E] без [Concept('trader','торговца')|E]"
 gdp_merchant.0020.t: "Деловой партнёр"
 gdp_merchant.0020.desc: "Успех главы семейного дела напрямую зависит от его правой руки, указывающей ему на новые перспективы."
 gdp_merchant.0020.desc.partner_exists: "[Select_CString(old_holder.IsFemale, 'Моя партнёрша, которая должна', 'Мой партнёр, который должен')] исполнять эту роль, вечно тратит наше время и деньги на бесполезные авантюры."
 gdp_merchant.0020.desc.fallback: "Пока у меня на примете нет человека, который мог бы стать моим партнёром."
 gdp_merchant.0020.desc.body: "Напряжение в компании нарастает. Амбициозные сотрудники всё чаще ссорятся и пытаются себя показать.\n\n"
 gdp_merchant.0020.desc.outro_three: "Среди них — [candidate_2.GetTitledFirstName] и [candidate_3.GetTitledFirstName]. Эти люди наперебой клянутся мне в верности, лишь бы занять вакантное место.\n\n[candidate_1.GetTitledFirstName], очевидно, талантливее, и они сделают всё возможное, чтобы [Select_CString(candidate_1.IsFemale, 'её', 'его')] потеснить."
 gdp_merchant.0020.desc.outro_two: "Среди них — [candidate_2.GetTitledFirstName]. [Select_CString(candidate_2.IsFemale, 'Она готова', 'Он готов')] до одури клясться в вечной верности, лишь бы занять вакантное место.\n\n[candidate_1.GetTitledFirstName], очевидно, талантливее, и [candidate_2.GetTitledFirstName] сделает всё возможное, чтобы [Select_CString(candidate_1.IsFemale, 'её', 'его')] потеснить."
 gdp_merchant.0020.desc.outro_one: "Среди них — [candidate_1.GetTitledFirstName], [Select_CString(candidate_1.IsFemale, 'которая поклялась', 'который поклялся')] в вечной верности, лишь бы занять вакантное место.\n\n[Select_CString(candidate_1.IsFemale, 'Она', 'Он')] сделает всё возможное, чтобы потеснить других претендентов на должность."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip] заслуживает шанса."
 gdp_merchant.0020.a.custom: "Все прочие кандидаты"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip] получит возможность проявить себя."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip] справится лучше остальных."
 gdp_merchant.0020.d: "У этих работников и своих задач достаточно…"
 gdp_merchant.0020.d.custom: "Все кандидаты"
 merchant_unity_partner_gain: "Вы взяли в партнёры члена семьи"
 merchant_unity_partner_loss: "Вы взяли в партнёры постороннего человека"
 gdp_merchant.0025.t: "Знаменитые мастера"
 gdp_merchant.0025.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Милостивая', 'Милостивый' )] [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetFirstNameNoTooltip]», — со стороны ближайшей кожевенной мастерской доносится незнакомый голос. Я иду на звук, стараясь не ступить в грязь, разлившуюся из красильных чанов.\n\nСвернув за угол, я чуть не утыкаюсь лицом в… звериную тушу? «[Select_CString(traveler.IsFemale, 'Добывшая её охотница', 'Добывший её охотник' )] широко улыбается, с гордостью демонстрируя свой трофей.\n\n«[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] — известные мастера, это все знают. Но вы же понимаете, что качество готового изделия напрямую зависит от используемого сырья. А я живу охотой и всегда могу обеспечить самыми лучшими материалами даже таких взыскательных покупателей, как вы»."
 gdp_merchant.0025.a: "«А ты не [Select_CString(traveler.IsFemale, 'думала', 'думал' )] поставить торговлю на широкую ногу?»"
 gdp_merchant.0025.b: "«Продолжай, пожалуйста…»"
 merchant_unity_artisan_recruit_loss: "нанят человек со стороны"
 merchant_unity_artisan_recruit_decline_gain: "сведения о дорогостоящих материалах"
 gdp_merchant.0030.t: "Серьёзная сила"
 gdp_merchant.0030.desc: "«[ROOT.Char.GetTitleAsNameNoTooltip|U]! [Select_CString(ROOT.Char.IsFemale, 'Госпожа', 'Господин' )] [ROOT.Char.GetFirstNameNoTooltip], я здесь!» — доносится громкий голос позади меня.\n\nОбернувшись, я замечаю [Select_CString(traveler.IsFemale, 'женщину-кузнеца', 'кузнеца' )], [traveler.GetSheHe] отчаянно машет мне рукой, стоя у своей наковальни. Подойдя ближе, я не могу не заметить, как [traveler.GetSheHe] играет мышцами и принимает такие позы, чтобы пламя горна идеально подчёркивало [traveler.GetHerHis] мускулатуру…\n\n«Я так давно мечтаю встретиться с вами! У вашей компании #EMP серьёзная#! репутация, вы так безжалостно расправляетесь с конкурентами… Страсть как хочется на вас поработать! У меня стальные кулаки, мечом я тоже владею — сделаю всё, что прикажете!»"
 gdp_merchant.0030.a: "«Мне нравится твой подход»."
 gdp_merchant.0030.b: "«#EMP Э-э#!… Лучше покажи свою продукцию»."
 merchant_unity_creditor_recruit_loss: "нанят человек со стороны"
 merchant_unity_creditor_recruit_decline_gain: "отказ льстивому поклоннику компании"
 gdp_merchant.0035.t: "Репутация, идущая впереди вас"
 gdp_merchant.0035.desc: "Снаружи доносится громкий шум. Отложив учётные книги, я встаю из-за стола и выхожу из конторы на улицу.\n\nУ дверей стоит [Select_CString(traveler.IsFemale, 'женщина', 'мужчина' )] с проницательным взглядом опытного купца, [traveler.GetHerHis] одежда покрыта въевшейся пылью дальних дорог.\n\n«Приветствую вас, [ROOT.Char.GetTitledFirstNameNoTooltip|l], — говорит [traveler.GetSheHe]. — Ваше имя у всех на слуху. Каждый, кого я [Select_CString(traveler.IsFemale, 'повстречала', 'повстречал' )] в дороге, советовал вас разыскать. Я бы [Select_CString(traveler.IsFemale, 'хотела', 'хотел' )] путешествовать от вашего имени. Может, [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] примет меня на службу?»"
 gdp_merchant.0035.a: "«Ты нам отлично подходишь!»"
 gdp_merchant.0035.b: "«Лучше поведай, чем сейчас торгуют в далёких краях»."
 merchant_unity_caravaneer_recruit_loss: "нанят человек со стороны"
 merchant_unity_caravaneer_recruit_decline_gain: "сведения о далёких рынках"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "[ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')] были настроены пессимистично, однако [recipient.GetTitledFirstName] всё же [Select_CString(recipient.IsFemale, 'удовлетворила', 'удовлетворил')] нашу просьбу, и народ возликовал. У нас наконец появится свой город, своя независимая республика!\n\nТеперь я [ROOT.Char.GetTitleAsNameNoTooltip|l] державы [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], и я буду…"
 gdp_merchant.0101.liege: "управлять городом [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] и его окрестностями, но у меня будет сюзерен: [new_liege.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant.0101.independent: "управлять городом [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] и его окрестностями вместе с другими дворянскими семьями от имени народа."
 gdp_merchant.0101.republic: "\n\nПришлось попотеть, но теперь славный дом [ROOT.Char.GetHouse.GetBaseNameNoTooltip] наконец оставит след в истории…"
 gdp_merchant.0101.a: "Для жителей города [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip] наступает новая эпоха!"
 gdp_merchant.0102.desc: "Какое счастье, что вы удовлетворили мою просьбу!\n\nЗолото уже отправлено. Скоро [actor.GetPrimaryTitle.GetName] перейдёт под наше крыло, и мы…"
 gdp_merchant.0102.liege: "будем смиренно править от вашего имени."
 gdp_merchant.0102.top_liege: "будем смиренно править, как пожелает [new_liege.GetTitledFirstName]."
 gdp_merchant.0102.independent: "станем во главе независимого города."
 gdp_merchant.0103.desc: "Что за нелепое предложение! Вы и впрямь полагаете, будто я продаю свои титулы, тем более такому низкородному человеку, как #EMP вы?!#!"
 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "В результате длительных обсуждений [recipient.GetTitledFirstName] всерьёз [Select_CString(recipient.IsFemale, 'заинтересовалась', 'заинтересовался')] моим щедрым предложением объединить наши дома и компании.\n\n[Select_CString(recipient.IsFemale, 'Она', 'Он')] одобрительно кивает:"
 gdp_merchant.0110.desc.personality.ai_honor: "«Кажется, особого выбора у меня нет. Тем не менее я выполню свою часть сделки и буду служить вашим интересам так же верно, как прежде служил своим»."
 gdp_merchant.0110.desc.personality.ai_zeal: "«Я верю, что такова воля [recipient.GetFaith.WealthGodNamePossessive]»."
 gdp_merchant.0110.desc.personality.ai_greed: "«Просмотрев свои учётные книги и сравнив их с вашими, я [Select_CString(recipient.IsFemale, 'вынуждена', 'вынужден' )] признать, что выбора у меня нет»."
 gdp_merchant.0110.desc.personality.ai_compassion: "«Я [Select_CString(recipient.IsFemale, 'посоветовалась', 'посоветовался' )] с компанией. Все считают, что объединение нам только на руку»."
 gdp_merchant.0110.desc.personality.ai_boldness: "«Я принимаю ваше предложение. Надеюсь, это положит конец конкуренции между нами»."
 gdp_merchant.0110.desc.personality.ai_rationality: "«Взвесив все выгоды и сравнив их с вероятными последствиями отказа, я принимаю предложение»."
 gdp_merchant.0110.desc.personality.ai_vengefulness: "«Что ж, вы неплохо разыграли свою партию. Выбора у меня нет. Этот раунд за вами»."
 gdp_merchant.0110.desc.personality.ai_energy: "«Я [Select_CString(recipient.IsFemale, 'согласна', 'согласен' )]. Пусть ваши клерки немедленно составят контракт и пришлют мне на подпись»."
 gdp_merchant.0110.desc.personality.ai_sociability: "«Компания [recipient.GetHouse.GetBaseNameNoTooltip] принимает ваши условия. Мне нравилось вести семейное дело, но цепляться за гордость — занятие бессмысленное»."
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "«После долгих размышлений я [Select_CString(recipient.IsFemale, 'согласилась', 'согласился' )] на ваше предложение об объединении деловых интересов»."
 gdp_merchant.0110.desc.closing: "\n\n«Наши торговые операции будут остановлены. С этого дня имя [recipient.GetHouse.GetBaseNameNoTooltip] будет работать на вашу компанию»."
 gdp_merchant.0110.a: "Рынки компании [recipient.GetHouse.GetBaseNameNoTooltip] теперь наши!"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "Вы забываетесь. [actor.GetPrimaryTitle.GetDefinitiveNameNoTooltip] — не такое уж могущественное предприятие. [recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip] не станет вам подчиняться."
 gdp_merchant.0111.a: "Замысел оказался неудачным."
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "Говорят, [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] отчаянно нуждается в деньгах. Я могу помочь державе выстоять перед лицом трудностей… за ответную услугу, конечно же."
 gdp_purpose_events.0001.a: "Это может сработать…"
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName] рассмотрит ваше предложение."
 gdp_purpose_events.0001.b: "Какая наглость!"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "Я испытываю жизненные трудности и нуждаюсь в финансовой поддержке. Назовите свои условия, и вы получите моё согласие. Просто напишите, что вам нужно."
 gdp_purpose_events.0002.a: "Составить договор ссуды под процент."
 gdp_purpose_events.0002.a.sin: "Составить договор ссуды под ростовщический процент."
 gdp_purpose_events.0002.c: "Составить договор так, чтобы ни у кого не было повода назвать его ростовщическим."
 gdp_purpose_events.0002.d: "Отправить золото, ничего не требуя взамен."
 gdp_purpose_events.0002.b: "Увы, но мне придётся отказать…"
 gdp_purpose_events.0002_notification: "Заём предоставлен"
 gdp_purpose_events.0002_fail_notification: "В займе отказано"
 fund_maa: "Сформировать @stationed_regiment_icon! [Concept('men_at_arms', 'профессиональный')|E] [Concept('regiment', 'полк')|E]"
 fund_mercenaries: "Подписать договор с [mercenary_i|E][Concept('mercenary', 'наёмниками')|E]"
 gdp_purpose_events.0003.desc: "Война истощает вашу державу. Я могу предоставить средства на ваши начинания, но в будущем, [Select_CString(ruler.IsFemale, 'моя', 'мой')] [ruler.GetTitleAsNameNoTooltip], я рассчитываю получить ответную услугу…"
 gdp_purpose_events.0003.a: "Мне пригодится любая помощь!"
 gdp_purpose_events.0003.b: "Какую ещё услугу? Да ни за что!"
 no_thanks.tt: "Вы упускаете эту возможность…"
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "Тяжело это признавать, но моей державе необходима ваша финансовая поддержка в текущей войне. Если вы мне поможете, в будущем я помогу вам."
 gdp_purpose_events.0004.a: "Я могу предложить новый особый полк!"
 gdp_purpose_events.0004.b: "Я могу позолотить кое-кому ручку…"
 gdp_merchant.1002.t: "Основание компании"
 gdp_merchant.1002.desc: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], неброское здание на оживлённой улице… Передо мной на столе лежит пустая учётная книга, а за окном непрерывно гомонит [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l]: зазывают продавцы, торгуются покупатели, скрипят колёса телег, кричат в загонах животные.\n\nВ скромно обставленном кабинете царит полумрак. [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] не благоволит одиночкам — быть может, стоит нанять пару человек?"
 gdp_merchant.1002.a: "Мне нужны люди с коммерческой жилкой."
 gdp_merchant.1002.a.tt: "Вы начинаете с двумя [Concept('associates','помощниками')|E], знающими толк в [Concept('stewardship', 'управлении')|E]"
 gdp_merchant.1002.b: "Мы запугаем наших конкурентов."
 gdp_merchant.1002.b.tt: "Вы начинаете с двумя [Concept('associates','помощниками')|E], искушёнными в [Concept('martial', 'военном деле')|E]"
 gdp_merchant.1002.c: "Хорошие переговорщики заключают выгодные сделки."
 gdp_merchant.1002.c.tt: "Вы начинаете с двумя [Concept('associates','помощниками')|E], владеющими [Concept('diplomacy', 'дипломатией')|E]"
 gdp_merchant.1002.d: "Учёные люди всегда нужны!"
 gdp_merchant.1002.d.tt: "Вы начинаете с двумя [Concept('learning', 'учёными')|E] [Concept('associates','помощниками')|E]"
 gdp_merchant.1002.e: "Хитроумие станет нашим преимуществом."
 gdp_merchant.1002.e.tt: "Вы начинаете с двумя [Concept('associates','помощниками')|E]-[Concept('intrigue', 'интриганами')|E]"
 gdp_merchant.1002.f: "Нет, мне никто не нужен."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial Пока у вас не появятся [Concept('associates','помощники')|E], выполнять [Concept('task_contracts', 'договоры')|E] будет очень трудно или даже невозможно#!"
 gdp_merchant.1002.f.tt.associates: "Изначально у вас нет [Concept('associates','помощников')|E]: только [Concept('family', 'родственники')|E] и [Concept('friends', 'друзья')|E]"
 gdp_merchant.1003.t: "Основание компании"
 gdp_merchant.1003.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] предстаёт передо мной во всём своём многообразии. Здесь ни секунды не проходит без сделок, [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] непрерывно ходят по рукам\n\nОтовсюду доносятся скрип повозок и завывания животных, сидящих в битком набитых загонах. На этом фоне торгуются многочисленные купцы, каждый из которых пытается переиграть своих конкурентов.\n\nВ этом месте можно найти самые разные изделия и продукты — за всем просто не уследить. Возможно, мне будет проще конкурировать с местными купцами, если я сосредоточусь на чём-то одном?"
 gdp_merchant.1003.a: "«Самое важное — это оптовые перевозки»."
 gdp_merchant.1003.b: "«Необходимо заручиться поддержкой, что оказывает нам [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]»."
 gdp_merchant.1003.b.tt: "Будет создан [Concept('patron_contract', 'договор покровителя')|E]"
 gdp_merchant.1003.c: "«Мы — купцы, и для нас нет ничего важнее прибыли»."
 gdp_merchant.1100.t: "Тесная компания"
 gdp_merchant.1100.desc: "[Select_CString(plaintiff.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMe', plaintiff)|l] [plaintiff.GetTitledFirstName] заходит в мой кабинет и осторожно обращается ко мне: «[ROOT.Char.GetFirstNameNoTooltip]… У нас вроде как семейное дело, но мы привлекаем всё больше и больше чужих людей».\n\n«Мне кажется, нам нужно избавиться от лишних сотрудников, иначе [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] скоро превратится в сборище проходимцев»."
 gdp_merchant.1100.a: "«[associate_2.GetFirstNameNoTooltip] уже давно [Select_CString(associate_2.IsFemale, 'стала', 'стал')] обузой»."
 gdp_merchant.1100.b: "«[associate_1.GetFirstNameNoTooltip] нам больше не [Select_CString(associate_1.IsFemale, 'нужна', 'нужен')]»."
 gdp_merchant.1100.c: "«Раз уж ты настаиваешь…»"
 gdp_merchant.1100.d: "«Не говори глупостей. Нам пригодится любая помощь»."
 merchant_overcrowding_ignored_loss: "игнорирование проблемы раздутого штата"
 merchant_overcrowding_fired_gain: "увольнение помощника во избежание раздутого штата"
 merchant_overcrowding_yeet_gain: "увольнение нескольких помощников во избежание раздутого штата"
 gdp_merchant.1200.t: "Просьба помощника"
 gdp_merchant.1200.desc: "Проведя весь день за штудированием учётных книг, я выхожу из кабинета, где меня уже поджидает [Select_CString(requester.IsFemale, 'моя', 'мой')] [ROOT.Char.Custom2('RelationToMe', requester)|l] [requester.GetTitledFirstName]. «[ROOT.Char.Custom2('RelationToMeAddress', requester)]! Я тут [Select_CString(requester.IsFemale, 'хотела', 'хотел')] кое-что спросить…»\n\n"
 gdp_merchant.1200.desc.artifact: "«Под вашим руководством компания постоянно растёт и развивается, и через наши склады то и дело проходят всякие любопытные ценности. Так вот… Вы ведь не будете против, если я оставлю себе одну из них?»"
 gdp_merchant.1200.desc.activity: "«Сотрудники компании работают не покладая рук, и благодаря вашим грамотным решениям мы уже добились хороших результатов. Может, устроим какой-нибудь праздник, чтобы отметить наши успехи?»"
 gdp_merchant.1200.desc.luxury_contract: "«Дела компании идут в гору, и это несомненно ваша заслуга. Но в мире ещё полно неизведанных чудес, на которых мы могли бы заработать…»"
 gdp_merchant.1200.a: "«Я подумаю об этом»."
 gdp_merchant.1200.b: "«Забудь. У меня есть дела поважнее»."
 merchant_associate_request_fulfill_gain: "выполнение просьбы [Concept('associate_possessive', 'помощника')|E]"
 merchant_associate_request_reject_loss: "отклонение просьбы [Concept('associate_possessive', 'помощника')|E]"
 merchant_associate_request_fail_loss: "неспособность выполнить просьбу [Concept('associate_possessive', 'помощника')|E]"
