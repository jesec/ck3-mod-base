 doctrine_parameter_tenet_benevolent_governance_disaster_relief_fulfillment: "Вы получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] за [Concept('great_project_contributions', 'вклады')|E] в устранение последствий [Concept('natural_disaster', 'природного катаклизма')|E] и теряете её, если последствия в вашей [Concept('realm', 'державе')|E] удастся преодолеть без вашей помощи"
