 tenet_christian_syncretism_name: "Христианский синкретизм"
 tenet_christian_syncretism_desc: "Иисус из Назарета не божество, однако, безусловно, личностью он был выдающейся. Мы должны относиться к его учению с уважением."
 doctrine_parameter_christian_syncretic_actor_opinion_active: "Взаимный бонус $VALUE|=+0$ к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] с [Concept('core_tenet', 'догматом')|E] «$tenet_christian_syncretism_name$»"
 doctrine_parameter_christian_syncretic_recipient_opinion_active: "Взаимный бонус $VALUE|=+0$ к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к христианским [Concept('faiths', 'конфессиям')|E], и их [Concept('counties', 'графств')|E]"
 doctrine_parameter_adoptionists_are_unilateral_hostile: "Для прочих $christianity_religion_adj$их [Concept( 'faiths', 'конфессий' )|E] они всего лишь [GetHostilityLevelName( '(int32)2' )|Vl], в то время как менее изысканные $adoptionist_adherent_plural$ — [GetHostilityLevelName( '(int32)3' )|Vl]"
 doctrine_parameter_adoptionists_are_unilateral_evil: "Для других $christianity_religion_adj$их [Concept( 'faiths', 'конфессий' )|E] они — [GetHostilityLevelName( '(int32)3' )|Vl]"
 doctrine_parameter_adoptionists_are_mutual_evil: "Считает, что все прочие $christianity_religion_adherent_plural$ — [GetHostilityLevelName( '(int32)3' )|Vl]. Они отвечают тем же."
 doctrine_parameter_adoptionist_school_removed_on_reformation: "Тончайшие нюансы этого учения #EMP полностью#! утрачены во время [Concept( 'reformation', 'реформации' )|E]"
 doctrine_parameter_adoptionists_attractively_intuitive_theology: "[EmptyScope.ScriptValue('fp2_lyonese_monk_conversion_bonus_root_value')|=+%0] к скорости обращения других #L [GetReligionByKey('christianity_religion').GetName|l]их#! [Concept( 'faiths', 'конфессий' )|E]"
 tenet_islamic_syncretism_name: "Исламский синкретизм"
 tenet_islamic_syncretism_desc: "Слова Пророка справедливы и мудры, и хотя жизнь наша полна других забот, мы не должны забывать о его мыслях и деяниях."
