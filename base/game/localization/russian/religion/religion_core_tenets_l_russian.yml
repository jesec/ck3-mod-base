 tenet_inner_journey_desc: "Только познав себя, можем мы познать мир. Путь к себе важен, долог и труден."
 doctrine_parameter_meditation_mechanics_active: "Персонажи могут [decide|El] стать затворниками и удалиться от мира. Это снижает [stress|El] и увеличивает шанс получить теологическое откровение."
 doctrine_parameter_tenet_inner_journey_meditation_bonus: "@piety_icon![Concept('piety', 'Благочестие')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовная реализация')|E] за принятие [Concept('decision', 'решения')|E] «[GetDecisionWithKey('meditate_in_seclusion_decision').GetName]»"
 doctrine_parameter_tenet_inner_journey_humble_pilgrimage_bonus: "[Concept('pilgrimages', 'Паломничества')|E] с [Concept('activity_option', 'параметром')|E] «#V $pilgrimage_pomp_humble$#!» приносят дополнительное @piety_icon![Concept('piety', 'благочестие')|E]"
 pam_inner_journey_meditation_toast: "От вашего [Concept('personal_tenet', 'личного принципа')|E] «[GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )]»"
 tenet_dharmic_pacifism_name: "Дхармический пацифизм"
 tenet_dharmic_pacifism_desc: "Все мы — часть космического порядка. Любым насилием мы причиняем боль всему миру — и самим себе."
 tenet_bhakti_name: "Бхакти"
 tenet_bhakti_patron_god_name: "Боги-покровители"
 tenet_bhakti_desc: "Смертные не могут удостоиться всей славы божества, но, выбрав один аспект божественного и отдавшись ему без остатка, мы можем приблизиться к божественной славе, насколько это вообще возможно."
 doctrine_parameter_select_personal_god_active: "Властители могут [Concept( 'decide', 'выбрать' )|E] личную аватару для поклонения, получив таким образом соответствующие бонусы и уникальные события"
 doctrine_parameter_select_personal_god_active_personal: "Можно [Concept('decide', 'выбрать')|E] личную аватару для поклонения, снижена стоимость изменения личной аватары"
 tenet_asceticism_name: "Аскетизм"
 tenet_asceticism_desc: "Стремление к материальным благам затмевает божественную истину. Лишь посвятив себя простой жизни, лишённой роскоши, мы сможем достичь духовного просветления."
 doctrine_parameter_tenet_asceticism_inappetetic_trait: "Вы получите [Concept('trait', 'свойство')|E] «[GetTrait('inappetetic').GetName( GetNullCharacter )]»"
 doctrine_parameter_tenet_asceticism_inappetetic_bonus: "[Concept('characters', 'Персонажи')|E] со свойством «[GetTrait('inappetetic').GetName( GetNullCharacter )]» получают #P +1#! [Concept('diplomacy', 'дипломатии')|E], #P +2#! [Concept('learning', 'учёности')|E], #P +10%#! прироста @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E] и #P +10%#! снижения [Concept('stress', 'стресса')|E]"
 doctrine_parameter_tenet_asceticism_comfort_eater_penalty: "[Concept('characters', 'Персонажи')|E] со свойством «[GetTrait('comfort_eater').GetName( GetNullCharacter )]» теряют #N 0,1#! ед. @piety_icon![Concept('piety', 'благочестия')|E] в месяц, а [Concept('opinion', 'мнение')|E] [Concept('faith', 'единоверцев')|E] снижается на #N 5#!"
 tenet_ritual_hospitality_name: "Ритуальное гостеприимство"
 tenet_ritual_hospitality_alternate_name: "Пуджа"
 tenet_ritual_hospitality_desc: "Гостеприимство — одна из величайших человеческих добродетелей. Гость в доме, будь он святым или простым смертным, всегда должен быть окружен почетом и уважением."
 doctrine_parameter_host_honored_guests_active: "[Concept('rulers', 'Правители')|E] могут объявлять других персонажей почётными гостями и тратить @piety_icon![Concept('piety', 'благочестие')|E] на то, чтобы повысить их [Concept('opinion', 'мнение')|E]"
 doctrine_parameter_tenet_ritual_hospitality_artifact_theft_risk: "Увеличен риск кражи [Concept('artifacts', 'артефактов')|E] в вашей державе"
 doctrine_parameter_tenet_ritual_hospitality_court_position_event_discount: "Наём на [Concept('court_positions', 'придворные должности')|E] через события [Concept('decision', 'решения')|E] стоит на #P 25%#! меньше @gold_icon![Concept('gold', 'золота')|E]"
 doctrine_parameter_tenet_ritual_hospitality_invite_to_court_acceptance: "[Concept('characters', 'Персонажи')|E] более охотно будут принимать приглашение к вашему двору"
 doctrine_parameter_tenet_ritual_hospitality_free_guest_recruitment: "Вы бесплатно нанимаете гостей к своему двору"
 doctrine_parameter_tenet_ritual_hospitality_feast_toast_friendship: "Тосты в честь почётных гостей на [Concept('feast', 'пиру')|E] всегда дают возможность подружиться с ними"
 #Pagan tenets
 tenet_warmonger_name: "Разжигание войны"
 tenet_warmonger_desc: "Вера и война идут рука об руку. Того, кто отказывается сражаться во имя божественного, нельзя назвать истинно верующим."
 doctrine_parameter_conquest_cb_enabled: "[rulers|E] имеют [casus_belli|El] «Завоевание» против соседних правителей."
 doctrine_parameter_faith_can_raid: "Разрешено [Concept( 'raiding', 'совершать налеты' )|E] на чужеземные [counties|El] ради грабежа"
 doctrine_parameter_invasion_cb_enabled: "Уважаемые [rulers|El] могут один раз в жизни использовать [casus_belli|El] «Вторжение»"
 doctrine_parameter_great_holy_wars_active_if_reformed: "[head_of_faith|E], если таковой существует, может развязать [Concept( 'great_holy_war', 'Великую священную войну' )|El], если [faith|El] [Concept( 'organized', 'организованная' )|El]"
 doctrine_parameter_clergy_can_fight_personal: "$knight_culture_player_plural$ и [Concept('commanders', 'командиры')|E] могут быть представителями [Concept('clergy', 'духовенства')|E] (если у [Concept('rite', 'течения')|E] нет [Concept('core_tenets', 'догматов')|E] «$tenet_pacifism_name$»)"
 tenet_ancestor_worship_name: "Почитание предков"
 tenet_ancestor_worship_desc: "Наши предки наблюдают за нами с того света, наставляют нас и указывают нам путь. За это мы должны почитать их."
 doctrine_parameter_tenet_ancestor_worship_renown_on_death: "[Concept('rulers', 'Правители')|E] этой [Concept('faith', 'конфессии')|E], умирая, увеличивают [Concept('dynasty_prestige', 'признание')|E] своей [Concept('dynasty', 'династии')|E] в зависимости от своего [Concept('prestige_level', 'уровня репутации')|E] и [Concept('piety_level', 'набожности')|E]"
 doctrine_parameter_tenet_ancestor_worship_seek_ancestral_guidance: "Открывает [Concept('decision', 'решение')|E] «$seek_ancestral_guidance_decision$»"
 tenet_adorcism_name: "Адорцизм"
 tenet_adorcism_desc: "Духи этого мира могут творить великое добро и великое зло. Почитая их, мы можем надеяться, что они будут добры к нам и обрушат зло на наших врагов."
 doctrine_parameter_spirit_possession_active: "Активирует [decision|El] «Попросить духов о помощи»"
 doctrine_parameter_tenet_adorcism_curse_enemy: "Вы можете использовать [Concept('decision', 'решение')|E] «$pam_curse_enemy_decision$» в отношении [Concept('rivals', 'соперников')|E], [Concept('nemeses', 'заклятых врагов')|E] и противников в [Concept('wars', 'войнах')|E]"
 doctrine_parameter_tenet_adorcism_seek_war_aid: "Вы можете использовать [Concept('decision', 'решение')|E] «$pam_seek_war_aid_decision$» во время [Concept('war', 'войны')|E]"
 tenet_ritual_celebrations_name: "Ритуальные празднества"
 tenet_ritual_celebrations_desc: "Восхваление божественного — это восторг, который необходимо разделить со всем нашим сообществом. Массовые празднества, на которых мы почитаем и восхваляем божественное, сближают нас."
 doctrine_parameter_mandatory_feast_attendance: "[Concept('vassals', 'Вассалы')|E] с большей вероятностью прибудут к вам на пир, а при отказе потеряют @piety_icon![Concept('piety', 'благочестие')|E]."
 tenet_sky_burials_name: "Воздушные погребения"
 tenet_sky_burials_desc: "Мертвецов следует не заточать под землю, но отдавать на съедение стервятникам: так умершие могут отблагодарить мир, кормивший их при жизни, и накормить его в ответ."
 doctrine_parameter_sky_burials_active: "[Concept('rulers', 'Правители')|E] могут совершать воздушные погребения предков, получая @piety_icon![Concept('piety', 'благочестие')|E] и одобрение [Concept('vassals', 'вассалов')|E]"
 doctrine_parameter_sky_burials_charnel_grounds: "Можно возводить [Concept('duchy_building', 'герцогские постройки')|E] «[GetBuilding('charnel_grounds_01').GetName]»"
 can_build_towers_of_silence_active_name: "способность использовать [Concept( 'duchy_building', 'постройку' )|E]: [GetBuilding('tower_of_silence_01').GetName]"
 doctrine_parameter_can_build_towers_of_silence_active: "[Concept('vassals', 'Вассалы' )|E] могут воздвигнуть [Concept( 'duchy_building', 'постройку' )|E] [GetBuilding('tower_of_silence_01').GetName], чтобы повысить рвение [Concept( 'county', 'округа' )|E] — #EMP если#! [Concept( 'faith', 'вера' )|E] их [Concept( 'liege', 'сюзерена' )|E] не предусматривает воздушные погребения."
 tenet_sacred_childbirth_name: "Священное рождение"
 tenet_sacred_childbirth_alternate_name: "Кудикис лямти"
 tenet_sacred_childbirth_desc: "Бани, в которых рожают матери, вычищены особыми ритуалами и подготовлены для того, чтобы божество ниспослало свое благословение во время родов."
 doctrine_parameter_safer_childbirths_active: "#P Снижена#! вероятность смерти матери во время беременности и при родах"
 doctrine_parameter_healthier_children_active: "Дети #P реже#! рождаются больными или мертвыми"
 doctrine_parameter_piety_from_childbirth_active: "Родители становятся более @piety_icon![Concept('piety', 'благочестивыми')|E], когда у них рождаются дети"
 doctrine_parameter_free_wet_nurse_court_position: "Открывает [Concept('court_position', 'придворную должность')|E] «#V [GetCourtPositionType('wet_nurse_court_position').GetName()]#!», на которую можно нанимать #P бесплатно#!"
 doctrine_parameter_tenet_sacred_childbirth_offer_bedside_support: "Открывает [Concept('interaction', 'взаимодействие')|E] «$offer_bedside_support_interaction$»"
 doctrine_parameter_tenet_sacred_childbirth_birthing_building_discount: "На строительство бань расходуется на #P 25%#! меньше @gold_icon![Concept('gold', 'золота')|E]"
 tenet_sacred_childbirth_birthing_building_discount_cost_desc: "$tenet_sacred_childbirth_name$"
 piety_from_childbirth_toast: "Священное рождение"
 tenet_sanctity_of_nature_name: "Святость природы"
 tenet_sanctity_of_nature_desc: "Мир природы создан божественной волей, и мы в нем лишь гости. Мы должны уважать и почитать деревья и корни, зверей и растения — и саму землю."
 #This parameter does nothing; it's just here to flag the tenet's nature silently so we can reference it without directly tagging the tenet.
 doctrine_parameter_believes_in_harmony_with_nature_invisible: ""
 doctrine_parameter_tenet_sanctity_of_nature_preserve_wilderness: "Открывает [Concept('decision', 'решение')|E] «$preserve_wilderness_decision$», снижая @travel_danger_icon![Concept('travel_danger', 'опасность')|E] и увеличивая @travel_speed_icon![Concept('travel_speed', 'скорость')|E] в пустых провинциях"
 doctrine_parameter_tenet_sanctity_of_nature_hike: "Доступ к [Concept('activity', 'занятию')|E] «[hike_i|E][hike|E]»"
 doctrine_parameter_tenet_sanctity_of_nature_wilderness_fulfillment: "Путешествие через каждую уникальную провинцию приносит немного @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 tenet_mystical_birthright_name: "Благоприятное рождение"
 tenet_mystical_birthright_alternate: "Талтош шулетес"
 tenet_mystical_birthright_desc: "Каждый из нас рождается со своей судьбой, важнейшая из которых — судьба талтоша, с рождения избранного повелевать магией и стать великим духовным лидером."
 doctrine_parameter_mystic_birthright_active: "Дети могут рождаться со [Concept('trait', 'свойством')|E] «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]» и #V 100#! ед. [Concept('experience', 'опыта')|E]: шанс #V 1%#! (#V 5%#! для ребёнка игрока), но не чаще чем раз в #V 30#! лет; сообщается для всей [Concept('faith', 'конфессии')|E]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_mild: "[Concept('characters', 'Персонажи')|E], страдающие от #TOOLTIP:GAME_TRAIT,lisping,[Situation.GetID] #L шепелявости#!#!, #TOOLTIP:GAME_TRAIT,stuttering,[Situation.GetID] #L заикания#!#! или #TOOLTIP:GAME_TRAIT,clubfooted,[Situation.GetID] #L косолапия#!#!, получают #P +2#! [Concept('learning', 'учёности')|E], #P +5%#! [Concept('toughness', 'выносливости')|E] [Concept('men_at_arms', 'профессионалов')|E] и #P +10%#! к приросту @legitimacy_icon![Concept('legitimacy', 'легитимности')|E]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_severe: "[Concept('characters', 'Персонажи')|E], страдающие от #TOOLTIP:GAME_TRAIT,dwarf,[Situation.GetID] #L карликовости#!#!, #TOOLTIP:GAME_TRAIT,spindly,[Situation.GetID] #L долговязости#!#!, #TOOLTIP:GAME_TRAIT,wheezing,[Situation.GetID] #L хрипов#!#!, #TOOLTIP:GAME_TRAIT,beauty_bad_2,[Situation.GetID] #L уродства#!#!, #TOOLTIP:GAME_TRAIT,albino,[Situation.GetID] #L альбинизма#!#! или #TOOLTIP:GAME_TRAIT,giant,[Situation.GetID] #L гигантизма#!#!, получают #P +3#! [Concept('learning', 'учёности')|E], #P +10%#! [Concept('toughness', 'выносливости')|E] [Concept('men_at_arms', 'профессионалов')|E], #P +20%#! к приросту @legitimacy_icon![Concept('legitimacy', 'легитимности')|E] и #P +10#! [Concept('dread', 'ужаса')|E]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_grave: "[Concept('characters', 'Персонажи')|E], страдающие от #TOOLTIP:GAME_TRAIT,bleeder,[Situation.GetID] #L гемофилии#!#!, #TOOLTIP:GAME_TRAIT,hunchbacked,[Situation.GetID] #L горбатости#!#!, #TOOLTIP:GAME_TRAIT,scaly,[Situation.GetID] #L псориаза#!#! или #TOOLTIP:GAME_TRAIT,beauty_bad_3,[Situation.GetID] #L безобразия#!#!, получают #P +4#! [Concept('learning', 'учёности')|E], #P +20%#! [Concept('toughness', 'выносливости')|E] [Concept('men_at_arms', 'профессионалов')|E], #P +30%#! к приросту @legitimacy_icon![Concept('legitimacy', 'легитимности')|E], #P +20#! [Concept('dread', 'ужаса')|E] и #P +15#! к [Concept('opinion', 'мнению')|E] [Concept('clergy', 'духовенства')|E]"
 tenet_astrology_name: "Астрология"
 tenet_astrology_desc: "Ночное небо — окно в мир непознанного, путь к величайшим тайнам и загадкам нашего мира. Для тех, кто умеет его открывать, звезды становятся открытой книгой."
 doctrine_parameter_divine_the_stars_active: "Позволяет адептам предсказывать будущее по звездам"
 doctrine_parameter_tenet_astrology_divination_bonus: "[Concept('decision', 'Решение')|E] «[GetDecisionWithKey('divine_the_stars_decision').GetName]» даёт больше @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E], и его эффекты дольше сохраняются"
 doctrine_parameter_tenet_astrology_mystic_trait: "Получает [Concept('trait', 'свойство')|E] «[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]»"
 doctrine_parameter_tenet_astrology_albino_omen: "[Concept('characters', 'Персонажи')|E]-#TOOLTIP:GAME_TRAIT,albino,[Situation.GetID] #L альбиносы#!#!: #P +10#! к всеобщему [Concept('opinion', 'мнению')|E], #P +20#! к [Concept('opinion', 'мнению')|E] единоверцев, #P +30%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E]"
 doctrine_parameter_tenet_astrology_scaly_omen: "[Concept('characters', 'Персонажи')|E] с #TOOLTIP:GAME_TRAIT,scaly,[Situation.GetID] #L псориазом#!#!: #P +15#! к [Concept('opinion', 'мнению')|E] от [Concept('attraction', 'привлекательности')|E], #P +10#! к [Concept('opinion', 'мнению')|E] [Concept('vassal', 'вассалов')|E], #P +30%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E]"
 doctrine_parameter_tenet_astrology_auspicious_timing: "[Concept('characters', 'Персонажи')|E] со свойством «[GetTrait('organizer').GetName( GetNullCharacter )]»: #P +10%#! к скорости передвижения"
 tenet_divination_name: "Гадания"
 tenet_divination_desc: "Судьба смертных и будущее мира начертаны в звездах и скрытых знаках. Через ритуалы, сны и предзнаменования опытные гадатели могут выведать эти секреты у духов иного мира."
 tenet_sun_worship_name: "Поклонение солнцу"
 tenet_sun_worship_desc: "Светоч, дарующий жизнь, неугасимое пламя, что правит небесами. Солнце — истинный владыка мира!"
 doctrine_parameter_summer_festivals_active: "Проведение пиров летом повышает @piety_icon![Concept('piety', 'благочестие')|E]"
 doctrine_parameter_trial_by_sun_active: "Заключенных [Concept( 'criminals', 'преступников' )|E] можно приговаривать к Испытанию Солнца"
 doctrine_parameter_tenet_sun_worship_free_hikes: "Ваши [Concept('activities', 'занятия')|E]-[Concept('hike', 'прогулки')|E] не тратят @gold_icon![Concept('gold', 'золото')|E]"
 doctrine_parameter_tenet_sun_worship_desert_pilgrim: "Вы получаете @piety_icon![Concept('piety', 'благочестие')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] при путешествии через #TOOLTIP:TERRAIN,desert #L пустыню#!#!, #TOOLTIP:TERRAIN,desert_mountains #L пустынные горы#!#! или #TOOLTIP:TERRAIN,oasis #L оазис#!#!"
