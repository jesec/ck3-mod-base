 doctrine_parameter_tenet_syncretism_invite_religious_exiles: "Можно использовать [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_invite_syncretic_exiles_decision').GetName]» для [Concept('faiths', 'конфессий')|E] синкретических [Concept('religion', 'религий')|E]"
