 doctrine_parameter_tenet_legalism_title_integration: "Скорость прогресса [Concept('councillor_task', 'задания совета')|E] по интеграции титула: #P +100%#!"
 doctrine_parameter_tenet_legalism_lawful_authority: "Ваши требования по отъёму [Concept('titles', 'титулов')|E], [Concept('imprison', 'заключению в тюрьму')|E] или [Concept('retract', 'отзыву')|E] [Concept('vassals', 'вассалов')|E] чаще принимаются"
