l_russian:
 doctrine_core_tenets_name: "Догматы"
 tenets_name: "Догматы"
 #Abrahamic Tenets
 tenet_communion_name: "Причастие"
 tenet_communion_desc: "Наши ритуалы не просто символы, они обнаруживают присутствие божественного. Те, кто не может или не хочет присоединиться к нам в этих ритуалах, не должны считаться истинно верующими."
 doctrine_parameter_tenet_communion_denied_sacrament: "[Concept('excommunicated', 'Отлучённые')|E] [Concept('characters', 'персонажи')|E] этого [Concept('rite', 'течения')|E] получают #N −25%#! к приросту @piety_icon![Concept('piety', 'благочестия')|E] и #N −10#! к [Concept('opinion', 'мнению')|E] единоверцев"
 doctrine_parameter_tenet_communion_shared_table: "Проведение #TOOLTIP:ACTIVITY_TYPE,activity_feast #L пира#!#! даёт #P +10#! к [Concept('opinion', 'мнению')|E] каждого гостя-[Concept('faith', 'единоверца')|E]"
 doctrine_parameter_excommunication_active: "Духовный [head_of_faith|El] может [excommunicate|El] других персонажей той же [faiths|El]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "Персонажи, принадлежащие к этому [Concept('rite', 'течению')|E], могут принимать [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_decision_last_rites').GetName]»"
 doctrine_parameter_seek_indulgences_active: "Персонажи этого [Concept('rite', 'течения')|E] могут использовать [Concept('interaction', 'взаимодействие')|E] G#high $seek_indulgences_interaction$#!», если у [Concept('faith', 'конфессии')|E] есть [Concept('head_of_faith', 'глава')|E] или [Concept('clerical_regions', 'церковные округа')|E]"
 tenet_armed_pilgrimages_name: "Вооруженные паломники"
 tenet_armed_pilgrimages_desc: "Наши пилигримы путешествуют по миру, чтобы посетить святые места, и мы с радостью возьмем в руки меч, чтобы защитить наших единоверцев."
 doctrine_parameter_cheaper_holy_wars_active: "[Concept('rulers', 'Правители')|E] этого [Concept('rite', 'течения')|E] тратят на #P 20%#! меньше @piety_icon![Concept('piety', 'благочестия')|E] на объявление [Concept('holy_wars', 'священных войн')|E]"
 doctrine_parameter_great_holy_wars_active: "[head_of_faith|E] может развязать [Concept('great_holy_war', 'Великую священную войну')|E]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Если [Concept( 'head_of_faith', 'главы конфессии' )|El] нет, ее последователи получают бонус к эффективности [Concept( 'councillor_task', 'задания советника' )|El] «[convert_county|El]» за каждое [holy_site|El] под контролем"
 doctrine_parameter_pilgrimage_decision_active: "Персонажи этого [Concept('rite', 'течения')|E] получают дополнительный бонус при успешном завершении [Concept('pilgrimage', 'паломничества')|E]"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "Сдача [Concept('holdings', 'владений')|E] в [Concept('leasing', 'аренду')|E] [Concept('holy_orders', 'духовно-рыцарским орденам')|E] приносит больше @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "Монашество"
 tenet_monasticism_desc: "Наслаждение хорошей едой и напитками лишь отвлекает нас от служения божественному. Изоляция в удаленных монастырях — лучший способ избегнуть соблазнов."
 doctrine_parameter_take_vows_active: "[courtiers|E] могут принести обеты и получить свойство «[GetTrait('devoted').GetName( GetNullCharacter )]»."
 doctrine_parameter_devoted_trait_criminal: "[GetTrait('devoted').GetName( GetNullCharacter )] считается [Concept('criminal', 'преступлением')|E]"
 doctrine_parameter_cannot_take_the_vows: "Персонажи, принадлежащие к этому [Concept('rite', 'течению')|E], не могут использовать [Concept('character_interaction', 'взаимодействие персонажа')|E] «#high $take_vows_interaction$#!»"
 tenet_divine_marriage_name: "Божественный брак"
 tenet_divine_marriage_xwedodah: "Хведодах"
 tenet_divine_marriage_desc: "Заключая браки с близкими нам по крови, мы уподобляем свои союзы союзам тех, кто был сотворен первыми. В нашей семье закрепятся хорошие качества, мы заполучим чистоту и силу для вечной борьбы со злом."
 doctrine_parameter_divine_marriage_opinion: "Последователи, вступая в брак с [Concept( 'close_family', 'близким родственником' )|E], получают $VALUE|0+=$ [opinions|El] от [Concept( 'vassal', 'вассалов' )|E] той же [faiths|El]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Если у вас принята [GetDoctrineType('doctrine_monogamy').GetBaseName|l], то при вступлении в брак с [Concept('close_family', 'близким родственником')|E] вы также получите большое количество @piety_icon![Concept('piety', 'благочестия')|E]"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "Вклад [Concept('skills', 'навыков')|E] от [Concept('councillor_tasks', 'задания совета')|E] [Concept('spouse', 'супруга/супруги')|E]: #P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Последователи значительно реже создают или поддерживают [Concept('factions', 'фракции')|E] против [Concept('liege', 'сюзерена')|E], состоящего в браке с их [Concept('close_family', 'близким')|E] или [Concept('extended_family', 'дальним родственником')|E]"
 tenet_pacifism_name: "Пацифизм"
 tenet_pacifism_desc: "Насилие отвратительно и ведет лишь к страданию, боли и сожалению. Стараясь по возможности избегать его, мы сможем построить более крепкое и безопасное общество для истинно верующих. Пацифистские графства растут и процветают при установившемся мире."
 doctrine_parameter_holy_wars_forbidden: "Нельзя объявлять [holy_wars|El] или устраивать [Concept( 'raid', 'налеты' )|E]"
 doctrine_parameter_pacifist_opinion_active: "Мнение пацифистов: $VALUE|+=0$"
 pacifist_opinion_name: "Собрат-пацифист"
 pacifist_county_opinion_name: "Графство собрата-пацифиста"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[opinion|E] других пацифистов: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Правители, не меньше двух лет находящиеся в состоянии мира, будут увеличивать своё @piety_icon![Concept('piety', 'благочестие')|E] на $VALUE|+$ каждый месяц"
 PIETY_LONG_PEACE: "Длительный мир"
 tenet_vows_of_poverty_name: "Обет нестяжания"
 tenet_vows_of_poverty_desc: "Деньги оскверняют сердца и уводят людей от истинной веры. Мы должны избегать материальных богатств и сосредоточиться на том, что поистине важно, выбирая скромные занятия и становясь благочестивее от их завершения."
 doctrine_parameter_vows_of_poverty_active: "[Concept('rulers', 'Правители')|E] могут [Concept('decide', 'решить')|E] принять обет нестяжания, что снизит ежемесячный доход от [Concept('tax', 'налогов')|E], но увеличит получаемое @piety_icon![Concept('piety', 'благочестие')|E]"
 tenet_human_sacrifice_name: "Человеческие жертвоприношения"
 tenet_human_sacrifice_desc: "Жертвоприношение — это лучший способ доказать нашу преданность. Самым ценным из того, что мы можем предложить, является человеческая жизнь."
 doctrine_parameter_human_sacrifice_active: "[Concept('executions', 'Казни')|E] увеличивают @piety_icon![Concept('piety', 'благочестие')|E], а не тратят @piety_icon!его"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[Concept('executions', 'Казни')|E] никогда не тратят @prestige_icon![Concept('prestige', 'престиж')|E] при [Concept('sharing_power', 'передаче полномочий')|E]"
 doctrine_parameter_flower_war_cb_active: "Дает [casus_belli|El] «[flowery_war|El]» против соседних держав"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "[Concept('executions', 'Казни')|E] дают дополнительные @piety_icon![Concept('piety', 'благочестие')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] в зависимости от [Concept('nobility', 'знатности')|E] и [Concept('rank', 'ранга')|E] цели"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Значительно увеличенный шанс пленения персонажей во время [Concept('sieges', 'осады')|E]"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Увеличенный шанс [Concept('imprison', 'заключить в тюрьму')|E] безземельных персонажей"
 tenet_gruesome_festivals_blot_name: "Блот"
 tenet_gruesome_festivals_name: "Жуткие празднества"
 tenet_gruesome_festivals_desc: "Мы все рождаемся в крови. Мы живём за счёт крови нашего скота, наших родных и наших врагов. Вполне естественно, что [ROOT.Rite.GetFaith.PantheonTerm] требуют свою долю."
 gruesome_festivals_active_name: "возможность устраивать грандиозные жертвоприношения"
 doctrine_parameter_gruesome_festivals_active: "Раз в десять лет можно проводить [Concept('activity', 'занятие')|E] «[GetActivityType('activity_gruesome_festival').GetName]», получая @piety_icon![Concept('piety', 'благочестие')|E] и повышая [Concept('county_opinion', 'мнение графств')|E] и подданных той же [Concept('faith', 'конфессии')|E]"
 tenet_volcanic_veneration_name: "Поклонение вулканам"
 tenet_volcanic_veneration_desc: "Немногое сравнится в божественности с новорожденной землёй, извергаемой из пылающих расселин нашей родины. Мы живём на краю катастрофы, нашими судьбами владеет [ROOT.Rite.GetFaith.PantheonTerm]."
 tenet_cthonic_redoubts_name: "Хтонические цитадели"
 tenet_cthonic_redoubts_desc: "Нет пристанища лучше, чем корни земли, нет крепости надежнее, чем ее высокие горы, нет паломничества священнее, чем путь по ее сокрытым тропам. Мы взираем на все сущее с этих вершин и чувствуем истинную тяжесть Божественного."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Скорость [Concept( 'convert_county', 'обращения графств' )|E] в гористой [Concept( 'terrain', 'местности' )|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "Скорость [Concept( 'promote_culture', 'распространения культур' )|E] в гористой [Concept( 'terrain', 'местности' )|E] аналогичной [Concept( 'faith', 'конфессии' )|E]: #P : +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Скорость [Concept( 'convert_county', 'обращения враждебных графств' )|E] в гористой [Concept( 'terrain', 'местности' )|E]: #P +[EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "Эндура"
 tenet_consolamentum_name_alternate: "Ритуальное самоубийство"
 tenet_consolamentum_desc: "В старости или во время болезни мы проводим ритуал очищения души от греха. После этого мы быстро и окончательно прерываем свою жизнь, чтобы грех не успел вновь запятнать нас."
 doctrine_parameter_consolamentum_active: "Последователи могут [Concept( 'decide', 'решить' )|E] добровольно уйти из жизни, если они стары, недееспособны или при смерти. Это не накладывает обычных штрафов за самоубийство"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "Когда последователь умирает по [Concept('decision', 'решению')|E] «[GetDecisionWithKey('initiate_consolamentum_decision').GetName]», наследник получает #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! ед. @piety_icon![Concept('piety', 'благочестия')|E]"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Ваш наследник получит дополнительно #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! ед. @piety_icon![Concept('piety', 'благочестия')|E] и модификатор «$pam_blessed_passing_modifier$» на #P 10#! лет, если вы умрёте по [Concept('decision', 'решению')|E] «[GetDecisionWithKey('initiate_consolamentum_decision').GetName]»"
 tenet_gnosticism_name: "Гностицизм"
 tenet_gnosticism_desc: "В каждом есть некая божественная искра, которая через познание может освободиться и вернуться к своему духовному истоку."
 doctrine_parameter_granting_titles_gives_stress: "Раздача [Concept('titles', 'титулов')|E] снижает [Concept('stress', 'стресс')|E]"
 tenet_mendicant_preachers_name: "Нищенствующее проповедование"
 tenet_mendicant_preachers_desc: "Наши миссионеры странствуют по свету, не имея ничего, кроме одежды. Они живут за счет щедрот простых людей, которым несут слово истинной веры."
 doctrine_parameter_mendicant_preachers_conversion_active: "Скорость обращения графства: #P +33%#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Обращение [Concept('character', 'персонажа')|E] даёт больше @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E]"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "Убеждение [Concept('characters', 'персонажей')|E] другой [Concept('faith', 'конфессии')|E] получит больше шансов на успех"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Гостей ваших [Concept('activities', 'занятий')|E] из другой [Concept('faith', 'конфессии')|E] можно обратить в вашу"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Открывает [Concept('interaction', 'взаимодействие')|E] «#V $attempt_conversion_of_local_ruler_interaction$#!» с [Concept('rulers', 'правителями')|E] в вашем текущем [Concept('location', 'местоположении')|E]"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Открывает [Concept('travel_option', 'вариант путешествия')|E] «[GetTravelOption('adventurers_proselytize_zealously_option').GetName]» без [Concept('perk', 'достоинства')|E] «[GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)]»"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U] принимает #L [first.GetFaith.GetName|l]ую#! веру"
 must_be_in_same_county_tt: "Вы должны находиться в [Concept('county', 'графстве')|E] персонажа"
 tenet_communal_identity_name: "Принадлежность к общине"
 tenet_communal_identity_desc: "Наша вера и наша культура тесно переплетены друг с другом. Подобная практика усиливает нашу связь с общиной, но при этом препятствует включению чужаков."
 doctrine_parameter_same_communal_identity_opinion_active: "#P +10#! [opinions|El] с персонажами той же [faiths|El]"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "На убеждение фракции на [Concept('ecumenical_council', 'вселенском соборе')|E] не тратится @prestige_icon![Concept('prestige', 'престиж')|E]"
 doctrine_parameter_tenet_communal_identity_sway_piety: "Вы получаете #P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! ед. [piety_i][Concept('piety', 'благочестия')|E] каждый раз, когда вы успешно #TOOLTIP:SCHEME_TYPE,sway #L влияете#!#! на представителя своего [Concept('rite', 'течения')|E]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "[Concept('scheme_success_chance', 'Шанс успешного')|E] #TOOLTIP:SCHEME_TYPE,learn_language #L изучения языка#!#! представителя вашего [Concept('rite', 'течения')|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "Изучение [Concept('language', 'языка')|E] представителя вашего [Concept('rite', 'течения')|E] увеличивает @piety_icon![Concept('piety', 'благочестие')|E] и @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 doctrine_parameter_same_culture_conversion_bonus_active: "Скорость обращения в [Concept( 'county', 'графствах' )|El], где есть моя [culture|El]: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Скорость распространения культуры в [Concept( 'county', 'графствах' )|El], где есть моя [faith|El]: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Скорость обращения в [Concept( 'county', 'графствах' )|El], где распространена чужая [culture|El]: #N -50%#!"
 tenet_pentarchy_name: "Экклезиархия"
 tenet_pentarchy_alternate_name: "Пентархия"
 tenet_pentarchy_desc: "Наши святые места — не только места поклонения, но и средоточие власти наших религиозных лидеров."
 tenet_aniconism_name: "Иконоборчество"
 tenet_aniconism_desc: "Идолопоклонничество для многих затмило божественную истину. Мы избавим святые места от икон, чтобы верующие не угодили в дьявольскую западню."
 doctrine_parameter_reforging_artifacts_costs_piety: "[Concept('rulers', 'Правители')|E] этого [Concept('rite', 'течения')|E] должны тратить @piety_icon![Concept('piety', 'благочестие')|E] на [Concept('reforge', 'перековку')|E] или [Concept('repair', 'починку')|E] [Concept('artifacts', 'артефактов')|E]"
 doctrine_parameter_destroying_artifacts_is_pious: "[Concept('rulers', 'Правители')|E] этого [Concept('rite', 'течения')|E] могут ломать [Concept('artifacts', 'артефакты')|E] и получать @piety_icon![Concept('piety', 'благочестие')|E]"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Можно ломать [Concept('artifacts', 'артефакты')|E] и получать @piety_icon![Concept('piety', 'благочестие')|E]"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Осады [Concept('rulers', 'правителей')|E] с [Concept('faith', 'конфессией')|E] без этого [Concept('core_tenet', 'догмата')|E] уничтожают больше [Concept('development', 'развития')|E], чаще повреждают [Concept('artifacts', 'артефакты')|E] и дают @piety_icon![Concept('piety', 'благочестие')|E]"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Вы получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] за разрушение [Concept('artifacts', 'артефактов')|E] и осады против [Concept('faith', 'конфессий')|E] без этого [Concept('core_tenet', 'догмата')|E]"
 pam_aniconism_siege_toast: "От вашего [Concept('personal_tenet', 'личного принципа')|E] «[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]»"
 destroying_artifacts_is_not_pious_tt: "Ваше [Concept('rite', 'течение')|E] не позволяет ломать [Concept('artifacts', 'артефакты')|E] за [Concept('piety', 'благочестие')|E]"
 artifact_is_rarer_than_masterwork_tt: "[Concept( 'rarity', 'Редкость' )|E] этого [Concept( 'artifact', 'артефакта' )|E] выше мастерской"
 tenet_alexandrian_catechism_name: "Александрийский катехизис"
 tenet_alexandrian_catechism_desc: "Александрийская богословская школа традиционно поощряла критическое мышление у богословов и позволяла оспаривать религиозный статус-кво.\n\nИ хотя физически школа была разрушена, мы по-прежнему храним ее обычаи."
 tenet_islamic_rationalism_name: "Исламский рационализм"
 tenet_islamic_rationalism_desc: "В мудрости и справедливости своей [ROOT.Rite.GetFaith.HighGodNameAlternate] не может идти против разума или пренебрегать благом для своих творений. Лишь через непроизвольную причину мы можем надеяться постичь свою роль в великом творении этого божества и отделить добро от зла."
 doctrine_parameter_scholasticism_is_holy: "[Concept('trait', 'Свойство')|E] «[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]» даёт дополнительные бонусы"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Обучаемые дети с [Concept('education_focus', 'фокусом образования')|E] «[Concept('learning', 'Учёность')|E]» при взрослении могут получить [Concept('experience', 'опыт')|E] [Concept('learning_lifestyle', 'пути познания')|E], и чем лучше ваше образование, тем чаще это происходит"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "Скорость обращения графства: #P +25%#!"
 tenet_hedonistic_name: "Гедонизм"
 tenet_hedonistic_desc: "Божественная воля наполнила этот мир удовольствиями, чтобы мы могли предаваться им. Избегать их значит пренебрегать трудом самого создателя."
 doctrine_parameter_piety_from_feasts_active: "Устроив [GetActivityType('activity_feast').GetName|l], вы повышаете @piety_icon![Concept('piety', 'благочестие')|E]"
