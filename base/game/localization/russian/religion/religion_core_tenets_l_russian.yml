 tenet_religious_legal_pronouncements_hisbah: "Хисба"
 tenet_religious_legal_pronouncements_fatwa: "Фетва"
 tenet_religious_legal_pronouncements_halakha: "Галаха"
 tenet_religious_legal_pronouncements_desc: "Границы между теологическими и юридическими спорами тонки, и духовные качества не только можно, но и нужно учитывать в мирских спорах. Правитель может попытаться добиться религиозного осуждения любого взрослого прямого [Concept('vassal', 'вассала')|E] той же [Concept('religion', 'религии')|E], но исход зависит от [Concept('learning', 'учёности')|E] правителя и моральных качеств вассала."
 doctrine_parameter_temporal_condemnation_enabled: "Правители могут попытаться осудить взрослого прямого [Concept('vassals', 'вассала')|E] той же [Concept('religion', 'религии')|E]. Чем [Concept('sinful', 'греховнее')|E] вассал, тем меньше [Concept('learning', 'учёности')|E] требуется правителю, тогда как [Concept('virtuous', 'добродетельные')|E] свойства усложняют задачу."
 doctrine_parameter_temporal_condemnation_criminal: "Успешное осуждение делает вассала [Concept('criminal', 'преступником')|E] и может разрешить отъём его титулов"
