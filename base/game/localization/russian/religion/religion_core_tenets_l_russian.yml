 tenet_eastern_syncretism_name: "Восточный синкретизм"
 tenet_eastern_syncretism_desc: "Мы можем поучиться тому, как различные дхармические религии соседствуют друг с другом. Возможно, они и не следуют истинной вере, но это не делает их нашими врагами."
