 tenet_sinitic_syncretism_name: "Синитский синкретизм"
 tenet_sinitic_syncretism_desc: "Мы можем многое почерпнуть из древних китайских вероучений, которые на протяжении многих веков наставляли наш народ на путь добра и праведности."
 doctrine_parameter_sinitic_syncretic_actor_opinion_active: "Взаимный бонус $VALUE|=+0$ к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] с [Concept('core_tenet', 'догматом')|E] «$tenet_sinitic_syncretism_name$»"
