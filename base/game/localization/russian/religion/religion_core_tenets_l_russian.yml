 doctrine_parameter_islamic_syncretic_recipient_opinion_active: "Взаимный бонус $VALUE|=+0$ к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к исламским [Concept('faiths', 'конфессиям')|E], и их [Concept('counties', 'графств')|E]"
 tenet_jewish_syncretism_name: "Иудейский синкретизм"
 tenet_jewish_syncretism_desc: "Хоть мы и не готовы признать еврейский народ богоизбранным, заключенная в Торе мудрость неоспорима. Мы можем многое почерпнуть из нее."
 doctrine_parameter_jewish_syncretic_actor_opinion_active: "Взаимный бонус $VALUE|=+0$ к [Concept('opinion', 'мнению')|E] персонажей, принадлежащих к [Concept('faiths', 'конфессиям')|E] с [Concept('core_tenet', 'догматом')|E] «$tenet_jewish_syncretism_name$»"
