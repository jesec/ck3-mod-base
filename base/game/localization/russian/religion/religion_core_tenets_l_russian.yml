 doctrine_parameter_tenet_carnal_exaltation_deviancy_virtuous: "Позволяет [Concept('faith', 'конфессии')|E] выбрать [Concept('doctrine', 'доктрину')|E] «[GetDoctrineType('doctrine_deviancy_virtuous').GetBaseName]»"
 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "[Concept('characters', 'Персонажи')|E] со свойствами «[GetTrait('lustful').GetName( GetNullCharacter )]», «[GetTrait('rakish').GetName( GetNullCharacter )]» и «[GetTrait('deviant').GetName( GetNullCharacter )]» получают #P +2#! [Concept('intrigue', 'интриги')|E], #P +2#! [Concept('diplomacy', 'дипломатии')|E] и #P +25%#! [Concept('fertility', 'плодовитости')|E] за свойство"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "[Concept('characters', 'Персонажи')|E] со свойствами «[GetTrait('lustful').GetName( GetNullCharacter )]», «[GetTrait('rakish').GetName( GetNullCharacter )]» и «[GetTrait('deviant').GetName( GetNullCharacter )]» завершают [Concept('schemes', 'происки')|E] «[GetScheme('seduce').GetTypeName]» на #P 20#! дней быстрее за каждое свойство"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "Можно создавать развратные артефакты с помощью [Concept('decision', 'решения')|E] «[GetDecisionWithKey('commission_artifact_decision').GetName]»"
 tenet_polyamory_name: "Полиамория"
 tenet_polyamory_desc: "Наша любовь друг к другу должна быть столь же бескорыстной, как любовь [ROOT.Rite.GetFaith.FertilityGodNamePossessive] к нам. Отринем же дремучую идею об абсолютной власти одного человека над чувствами другого."
 doctrine_parameter_no_unfaithfulness_penalty_active: "Адепты не получают штрафы к [Concept( 'opinion', 'мнению' )|El] или [imprisonment_reasons|El] своих супруг/супругов за внебрачные отношения"
 doctrine_parameter_tenet_polyamory_romance_seduction_scheme_bonus: "[Concept('scheme_success_chance', 'Шанс на успех происков')|E] «[GetScheme('courting').GetTypeName]» и «[GetScheme('seduce').GetTypeName]»: [success_chance_i]#P +35%#!"
 doctrine_parameter_tenet_polyamory_romance_seduction_fulfillment: "Вы теряете [Concept('stress', 'стресс')|E] и получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] за успешные [Concept('schemes', 'происки')|E] «[GetScheme('courting').GetTypeName]» и «[GetScheme('seduce').GetTypeName]»"
 doctrine_parameter_tenet_polyamory_new_beloved: "При получении [Concept('lover', 'любовника/любовницы')|E] или [Concept('soulmate', 'родственной души')|E] вы повышаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] на #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#!, снижаете [Concept('stress', 'стресс')|E] на #P 20#! и получаете модификатор «[GetModifier('tenet_polyamory_new_beloved_modifier').GetNameWithTooltip]» на #V 5#! лет, но не чаще чем раз в год"
 tenet_polyamory_new_beloved_toast: "От вашего [Concept('personal_tenet', 'личного принципа')|E] «[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )]»"
 doctrine_parameter_tenet_carnal_exaltation_seduction_fulfillment: "Вы теряете [Concept('stress', 'стресс')|E] и получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] за успешные [Concept('schemes', 'происки')|E] «[GetScheme('seduce').GetTypeName]»"
 tenet_unrelenting_faith_name: "Беспощадная вера"
 tenet_unrelenting_faith_desc: "Наши убеждения сильны, и мы с радостью будем убивать и умирать за свою веру. Даже если наши шансы ничтожны, мы не сдадимся."
 tenet_unrelenting_faith_zandik_name: "Справедливое восстание"
 tenet_unrelenting_faith_zandik_desc: "Мы не желаем навредить никому и ничему, но, если поставлен под угрозу наш образ жизни, мы будем защищать его с неудержимым рвением."
 tenet_rite_name: "Ритуал"
 tenet_rite_desc: "По большому счету, мы верим в то же самое, что и наши прародители... С чего нам ссориться из-за мелочей, если мы согласны в основах доктрины и, самое главное, в том, кто является непререкаемым авторитетом в спорах?"
 doctrine_parameter_maintains_head_of_faith_on_creation: "Новые [Concept( 'faith', 'конфессии' )|E] сохраняют [Concept( 'head_of_faith', 'главу' )|E] при создании"
