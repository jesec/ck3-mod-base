 tenet_esotericism_kabbalah: "Каббала"
 tenet_esotericism_desc: "Хотя великие тайны божественного находятся за рамками понимания смертных, это не оправдывает невежества. Само существование тайны вынуждает нас искать знание и стремиться понять окружающий мир."
 doctrine_parameter_tenet_esotericism_mystic_education: "Дети с [Concept('education_focus', 'фокусом образования')|E] «[Concept('learning', 'ученость')|E]» при взрослении могут получить много [Concept('experience', 'опыта')|E] [Concept('learning_lifestyle', 'пути познания')|E], если будут успешны в учёбе"
 doctrine_parameter_tenet_esotericism_eccentric_education: "Дети с [Concept('education_focus', 'фокусом образования')|E] «[Concept('learning', 'Учёность')|E]» могут получить свойство «[GetTrait('eccentric').GetName( GetNullCharacter )]»"
 doctrine_parameter_tenet_esotericism_eccentric_bonuses: "[Concept('trait', 'Свойство')|E] «[GetTrait('eccentric').GetName( GetNullCharacter )]» даёт дополнительное @piety_icon![Concept('piety', 'благочестие')|E] и [Concept('opinion', 'мнение')|E] и меньше увеличивает [Concept('stress', 'стресс')|E]"
