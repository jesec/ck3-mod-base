 doctrine_parameter_sanctioned_false_conversion: "Заблудшие [Concept('characters', 'персонажи')|E] и [Concept('counties', 'графства')|E] иногда возвращаются в эту [Concept('faith', 'конфессию')|E]"
 doctrine_parameter_tenet_false_conversion_sanction_elusive: "Вас сложнее [Concept('imprison', 'заключить в тюрьму')|E], и вам проще бежать из [Concept('prison', 'тюрьмы')|E]"
 tenet_tax_nonbelievers_name: "Налогообложение неверных"
 tenet_tax_nonbelievers_desc: "Военная служба только для истинно верующих, тогда как налоги возложены на неверных, поскольку те получают защиту."
