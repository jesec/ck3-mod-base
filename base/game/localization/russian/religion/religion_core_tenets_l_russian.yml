 doctrine_parameter_death_is_glory: "Вероятность смерти или ранения в [Concept('battle', 'бою' )|E]: #N +10%#!"
 doctrine_parameter_sanctioned_assassinations: "При убийстве персонажей другой [Concept( 'faith', 'веры' )|E] посредством [Concept( 'schemes', 'происков' )|E] «[GetScheme('murder').GetTypeName]» не теряется [Concept( 'piety', 'благочестие' )|E]"
 doctrine_parameter_tenet_fp3_fedayeen_other_faith_kill_fulfillment: "Вы получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] за убийство [Concept('characters', 'персонажей')|E] другой [Concept('faith', 'конфессии')|E]"
 #EP3 Tenets
 tenet_household_gods_name: "Боги домашнего очага"
 tenet_household_gods_desc: "Мы почитаем наших #EMP ларов#! и #EMP гениев#! — духов-покровителей, защищающих наши жилища. Но превыше всего мы восхваляем нашего славного императора, чьей душе вверена защита всей державы."
 #BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ для [Concept('temple_holdings', 'храмовых владений')|E]"
 #TGP
 immaterial_harmony_name: "Духовная гармония"
 special_doctrine_immaterial_harmony_name: "Духовная гармония"
 special_doctrine_immaterial_harmony_desc: "Наши обычаи никак не противоречат учениям Будды и других мудрецов. Можно практиковать любое из них или даже все вместе без какого-либо вреда для души."
 tenet_extinction_of_dharma_name: "Смерть Дхармы"
 tenet_extinction_of_dharma_desc: "Демоны бродят по земле в обличии благочестивых и набожных. Срази одного, и приблизишься к Будде на шаг, срази десятерых, и приблизишься к Будде на десять шагов."
 tenet_cranial_trophies_name: "Трофейные черепа"
 tenet_cranial_trophies_desc: "Голова — вместилище души. Если отрубить ее и извлечь содержимое, можно заполучить могучую духовную энергию."
 doctrine_parameter_killing_bestows_heads: "Возможность получить [Concept('artifact', 'трофейный череп')|E], [Concept('executing', 'казнив')|E] иного персонажа, сразив его в [Concept('single_combat_duel', 'поединке')|E] или убив в [Concept('battle', 'битве')|E]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "При получении [Concept('artifact', 'трофейного черепа')|E] убийца получит дополнительное @piety_icon![Concept('piety', 'благочестие')|E] пропорционально @prestige_icon![Concept('prestige', 'престижу')|E] покойного"
 doctrine_parameter_tenet_cranial_trophies_spiritual_fulfillment_from_trophies: "При получении [Concept('artifact', 'трофейного черепа')|E] вы также получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] пропорционально @prestige_icon![Concept('prestige', 'престижу')|E] покойного"
 tenet_benevolent_governance_name: "Благожелательное правление"
 tenet_benevolent_governance_desc: "У правителей народа есть моральная обязанность поддерживать добро и отрекаться от зла. Только следуя этому принципу, правитель может быть по-настоящему справедливым."
 tenet_filial_piety_name: "Почитание родителей"
 tenet_filial_piety_desc: "Почитание родителей и послушание старшим необходимы для воплощения людской добродетели. Пока наши родители живы, мы чинно им прислуживаем, поддерживаем как можем и учимся на их наставлениях. После смерти мы даруем им подобающее погребение, а затем чинно почитаем."
 tenet_harmonious_society_name: "Гармоничное общество"
 tenet_harmonious_society_desc: "Всё должно быть сбалансировано: люди, природа, общество. Сын Неба задает ритм, и мы поддерживаем его напев."
 doctrine_parameter_sway_scheme_better: "[Concept('scheme_success_chance', 'Шанс на успех происков')|E] «[GetScheme('sway').GetTypeName]»: [success_chance_i]#P +15%#!"
 doctrine_parameter_sway_scheme_piety: "Успешные [Concept('schemes', 'происки')|E] #TOOLTIP:SCHEME_TYPE,sway #L влияния#!#! в отношении вашего [Concept('liege', 'сюзерена')|E] или [Concept('vassals', 'вассалов')|E] приносят #P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! ед. [piety_i][Concept('piety', 'благочестия')|E]"
 doctrine_parameter_more_often_zealots: "[Concept('vassals', 'Вассалы')|E] с большей вероятностью будут придерживаться [GetVassalStance( 'zealot' ).GetTextIcon]фанатичных [Concept('vassal_stance', 'взглядов')|E]"
 doctrine_parameter_tenet_harmonious_society_sway_fulfillment: "Вы получаете #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! ед. @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовной реализации')|E], когда успешно завершаете [Concept('scheme', 'происки')|E] #TOOLTIP:SCHEME_TYPE,sway #L влияния#!#! в отношении своего [Concept('liege', 'сюзерена')|E] или [Concept('vassals', 'вассалов')|E]"
 doctrine_parameter_tenet_harmonious_society_five_bonds: "Вы получаете [piety_i][Concept('piety', 'благочестие')|E] и [prestige_i][Concept('prestige', 'престиж')|E] за [Concept('opinion', 'мнение')|E] выше #V 50#! со стороны: [Concept('liege', 'сюзерена')|E] или [Concept('vassal', 'вассала')|E], родителя или взрослого ребёнка, супруги, взрослого сиблинга или [Concept('friend', 'друга')|E]"
 tenet_harmonious_society_sway_boon: "У вашей [Concept('faith', 'конфессии')|E] есть догмат «[GetTenetType('tenet_harmonious_society').GetBaseName]»: $VALUE|+0=$"
 harmonious_society_sway_fulfillment_toast: "Догмат «$tenet_harmonious_society_name$»"
 tenet_pursuit_of_knowledge_name: "Жажда знаний"
 tenet_pursuit_of_knowledge_desc: "Те, кто от природы с рождения одарены знаниями, стоят выше всех. Те, кто сознательно ищут знания, стоят на втором месте. Те же, кто глупы и не стремятся научиться, — низшие среди всех людей."
