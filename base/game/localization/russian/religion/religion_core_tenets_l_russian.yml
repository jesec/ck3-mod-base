 #Additional Tenets
 tenet_ritual_cannibalism_name: "Ритуальный каннибализм"
 tenet_ritual_cannibalism_desc: "Всякий человек несет в себе искру божественного. И потому человеческая плоть священна: ее следует поглощать, а не закапывать или сжигать."
 doctrine_parameter_cannibalism_legal: "[GetTrait('cannibal').GetName( GetNullCharacter )] больше не [criminal|El]"
 doctrine_parameter_tenet_ritual_cannibalism_devour_reward: "Можно съедать [Concept('prisoners', 'узников')|E], чтобы снизить [Concept('stress', 'стресс')|E] и получить @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 doctrine_parameter_tenet_ritual_cannibalism_feast_toast: "В конце #TOOLTIP:ACTIVITY_TYPE,activity_feast #L пира#!#! можно съесть [Concept('honorary_guest', 'почетного гостя')|E]"
 tenet_exaltation_of_pain_name: "Экзальтация от боли"
 tenet_exaltation_of_pain_desc: "Боль — универсальная эмоция, а насилие — универсальный язык. Причинить боль другому значит благословить его, а испытать боль значит обрести милость."
 doctrine_parameter_torturing_prisoners_grants_piety: "Пытки [Concept('prisoners', 'узников')|E] увеличивают @piety_icon![Concept('piety', 'благочестие')|E], а не тратят @piety_icon!его"
 doctrine_parameter_reduced_stress_from_torture: "Последователи не получают [Concept('stress', 'стресс')|E] от пыток и получают от них @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 doctrine_parameter_self_mutilation_active: "Можно [Concept('decide', 'решить')|E] предаться самобичеванию, получив @piety_icon![Concept('piety', 'благочестие')|E] и свойство «[GetTrait('wounded_1').GetName( GetPlayer )]»"
 doctrine_parameter_no_epidemic_fulfillment_loss_active: "Последователи не теряют @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] от [Concept('epidemic', 'поветрий')|E]"
 doctrine_parameter_no_epidemic_fulfillment_loss_personal_active: "Этот персонаж не теряет @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] от [Concept('epidemic', 'поветрий')|E]"
 doctrine_parameter_tenet_exaltation_of_pain_flagellant_trait: "При выборе этого [Concept('personal_tenet', 'личного принципа')|E] вы получите [Concept('trait', 'свойство')|E] «[GetTrait('flagellant').GetName( GetPlayer )]»"
 doctrine_parameter_tenet_exaltation_of_pain_wounded_spiritual_fulfillment: "Получение свойства «[GetTrait('wounded_1').GetName( GetPlayer )]» даёт @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E] в зависимости от тяжести"
 doctrine_parameter_tenet_exaltation_of_pain_wound_courtier_interaction: "Открывает [Concept('interaction', 'взаимодействие')|E] «#V $exaltation_of_pain_wound_courtier_interaction$#!», позволяющее вам ранить [Concept('courtiers', 'придворных')|E], чтобы получить @piety_icon![Concept('piety', 'благочестие')|E]"
 exaltation_of_pain_wounded_spiritual_fulfillment_toast: "Благословение страданием"
 self_mutilation_active_name: "[GetTenetType('tenet_exaltation_of_pain').GetBaseName]"
 self_mutilation_minor_piety_gain_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'получаете', 'получает' )] #P [THIS.ScriptValue('minor_piety_gain')]#! ед. [piety_i] из-за [Concept('personal_tenet', 'личного принципа')|E] «[GetTenetType('tenet_exaltation_of_pain').GetBaseName]»"
 self_mutilation_medium_piety_gain_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'получаете', 'получает' )] #P [THIS.ScriptValue('medium_piety_gain')]#! ед. [piety_i] из-за [Concept('personal_tenet', 'личного принципа')|E] «[GetTenetType('tenet_exaltation_of_pain').GetBaseName]»"
 self_mutilation_major_piety_gain_tt: "[THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'получаете', 'получает' )] #P [THIS.ScriptValue('major_piety_gain')]#! ед. [piety_i] из-за [Concept('personal_tenet', 'личного принципа')|E] «[GetTenetType('tenet_exaltation_of_pain').GetBaseName]»"
 tenet_sacred_shadows_name: "Святая ложь"
 tenet_sacred_shadows_desc: "Ложь — наиболее сложное из существующих искусств. Те, чья ложь кажется правдой, святые. Тот же, кто может успешно лгать самому себе, поистине непобедим."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Последователи получают благочестие, успешно завершая [Concept('intrigue', 'интриганские')|E] [Concept( 'schemes', 'происки' )|E]"
 doctrine_parameter_adherents_more_likely_to_join_schemes: "Последователи с большим энтузиазмом присоединяются к чужим [Concept( 'schemes', 'проискам' )|E]"
 doctrine_parameter_tenet_sacred_shadows_fabricate_hook: "Можно использовать [Concept('scheme', 'происки')|E] «[GetScheme('fabricate_hook').GetTypeName]»"
 doctrine_parameter_tenet_sacred_shadows_intrigue_scheme_fulfillment: "Вы получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E], успешно завершая [Concept('schemes','происки')|E] «[Concept('intrigue','Интриги')|E]»"
 tenet_pursuit_of_power_name: "Жажда власти"
 tenet_pursuit_of_power_desc: "Понятие законности преходяще и зависит от того, в чьих руках эта власть сосредоточена. Это значит, что жажда власти — единственная поистине праведная причина любого действия."
 doctrine_parameter_tenet_pursuit_of_power_war_victory_fulfillment: "Победа в войнах даёт @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E]"
 doctrine_parameter_tenet_pursuit_of_power_become_conqueror: "Открывает [Concept('decision', 'решение')|E] «$pursue_conquerors_mantle_decision$»"
 tenet_pastoral_isolation_name: "Религиозное затворничество"
 tenet_pastoral_isolation_desc: "Мы желаем лишь уединения. Наши практики — наше дело. Они касаются других не больше, чем чужие дела касаются нас."
 doctrine_parameter_unattractive_for_character_conversions: "[Concept('characters', 'Персонажи')|E] охотнее переходят из этой [Concept('faith', 'конфессии')|E] в другие"
 tenet_natural_primitivism_name: "Естественный примитивизм"
 tenet_natural_primitivism_desc: "Цивилизация неестественна. Это богомерзкий плод, что породил человек, пытаясь обуздать необузданное естество. Мы отвергаем одежду, статус, законы и придворный блеск, чтобы жить так, как предписывают [ROOT.Rite.GetFaith.PantheonTerm]: дикими, простыми и свободными."
 doctrine_parameter_naked_adherents_active: "Адепты не носят одежд"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Стоимость закона: #N +50%#!"
 doctrine_parameter_tenet_natural_primitivism_promote_naturism_decision: "Открывает [Concept('decision', 'решение')|E] «#V Принять естественную свободу#!»"
 doctrine_parameter_unlock_jizya_contract: "Разблокирует [Concept( 'vassal_contract', 'вассальный договор' )|E] и [Concept( 'tax_decree', 'налоговый указ' )|E] джизьи"
 #FP3 tenets
 tenet_communal_possessions_name: "Общее владение"
 tenet_communal_possessions_desc: "[ROOT.Rite.GetFaith.HighGodName] желает, чтобы каждый из нас получил равную долю того, что есть на земле. Мы должны делиться всем, в том числе и украденными богатствами сильных мира сего."
 doctrine_parameter_piety_from_gifts_active: "Вы получаете @piety_icon![Concept('piety', 'благочестие')|E] за отправку [Concept('gifts', 'подарков')|E] и дарение [Concept('artifacts', 'артефактов')|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Правители получают @piety_icon![Concept('piety', 'благочестие')|E], заключая брак с [Concept('lowborn', 'худородными')|E] [Concept('characters', 'персонажами')|E], и не теряют при этом @legitimacy_icon![Concept('legitimacy', 'легитимность')|E]"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "Открывает [Concept('decision', 'решение')|E] «$redistribute_realm_wealth_decision$»"
 tenet_sacrificial_ceremonies_name: "Церемонии жертвоприношения"
 tenet_sacrificial_ceremonies_desc: "Человеческие жертвоприношения, как добровольные, так и принудительные, приближают нас к божественному. Предложить себя на роль жертвы значит исполнить обычай и совершить доброе деяние, и столь же добродетельным является принесение в жертву тех, кто совершил непростительные преступления против богов."
 tenet_megaliths_name: "Строительство мегалитов"
 tenet_megaliths_desc: "Поклонение не должно ограничиваться стенами храмов — эти примитивные людские постройки отвлекают от окружающих нас божественных творений. Мы чествуем камень и чистое небо и размещаем камни, дарованные нашими создателями, так, чтобы порадовать их и стать ближе к постижению божественного."
 doctrine_parameter_can_build_megaliths: "Позволяет строить мегалиты в [Concept( 'temple', 'храмовых' )|E] владениях и великие мегалиты в столицах герцогств."
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "Удвоенный опыт за посещение [Concept('points_of_interest', 'точек интереса')|E] — [Concept('buildings', 'зданий')|E]"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "Вы получаете @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'духовную реализацию')|E], завершая строительство на #TOOLTIP:TERRAIN,hills #L холмах#!#!, #TOOLTIP:TERRAIN,terraced_hills#L холмах с террасами#!#!, в #TOOLTIP:TERRAIN,mountains #L горах#!#! и #TOOLTIP:TERRAIN,desert_mountains #L пустынных горах#!#!"
 pam_megaliths_rough_terrain_construction_toast: "От вашего личного догмата «[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )]»"
 province_is_of_a_megalith_faith_tt: "Это [county|El] должно исповедовать [Concept( 'faith', 'конфессию' )|E], которая верит в значимость мегалитов."
 tenet_fp3_fedayeen_name: "Фидаи"
 tenet_fp3_sacred_murder_name: "Священное убийство"
 tenet_fp3_fedayeen_desc: "Когда обычной войны недостаточно, наш долг перед божеством [ROOT.Rite.GetFaith.HighGodNameAlternate] велит нам уничтожать его врагов путём хитрости и обмана. Мы должны не бояться ни смерти, ни боли и быть готовы расстаться с жизнью ради великого дела."
 doctrine_parameter_master_assassin_court_position_unlocked: "Открывает [Concept('court_position', 'придворную должность')|E]: #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()]#!"
