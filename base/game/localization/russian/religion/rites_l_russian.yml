 roman_rite: "Римск"
 roman_rite_adj: "Римское христианство"
 roman_rite_adherent: "Римский христианин"
 roman_rite_adherent_plural: "Римские христиане"
 roman_rite_desc: "Римское христианство представляет собой литургическую традицию Римской церкви, сложившуюся под влиянием латинского богословия, канонического порядка и особым вниманием к дисциплине таинств, церковной иерархии и институциональному единству."
 insular_celtic: "Кельтск"
 insular_celtic_adj: "Кельтское христианство"
 insular_celtic_adherent: "Кельтский христианин"
 insular_celtic_adherent_plural: "Кельтские христиане"
 insular_celtic_desc: "Кельтское христианство отошло от Римской католической церкви несколько веков назад. Теперь исконный колорит ирландской глубинки заметно потускнел под постоянным надзором материковой церкви. Но по сей день кельтское христианство отличает особо трепетное отношение к епитимьям и монашеству и уникальные свадебные обряды, чуждые большинству прочих христианских конфессий."
