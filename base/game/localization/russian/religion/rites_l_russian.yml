 mozarabic_church: "Мосарабск"
 mozarabic_church_adj: "Мосарабизм"
 mozarabic_church_adherent: "Мосараб"
 mozarabic_church_adherent_plural: "Мосарабы"
 mozarabic_church_desc: "Вышедшее из раннеиберийских течений, Мосарабское христианство веками сохраняло определённую независимость от Рима, поскольку находилось под властью ислама. Как следствие длительного сосуществования с другими конфессиями, эту ветвь отличает существенно большая, чем у других, более фундаментальных сект, терпимость к отличиям в доктрине."
 ambrosian_rite: "Амвросианск"
 ambrosian_rite_adj: "Амвросианский обряд"
 ambrosian_rite_adherent: "Амвросианский христианин"
 ambrosian_rite_adherent_plural: "Амвросианские христианине"
 ambrosian_rite_desc: "Амвросианский обряд распространён в Миланском архидиоцезе со времён выдающегося епископа Святого Амвросия, поддерживает собственные литургию, гимны и теологическую традицию, основанную на учении Святого Августина Иппонийского."
 beneventan_rite: "Беневентск"
 beneventan_rite_adj: "Беневентское христианство"
 beneventan_rite_adherent: "Беневентский христианин"
 beneventan_rite_adherent_plural: "Беневентские христиане"
 beneventan_rite_desc: "Литургическая традиция ломбардского юга с центром в Беневенто и великом аббатстве Монтекассино. Характерные песнопения и уставы отличают его от римских практик, и Рим с растущим подозрением наблюдает за этим течением."
 carolingian_christianity: "Каролингск"
 carolingian_christianity_adj: "Каролингское христианство"
 carolingian_christianity_adherent: "Каролингский христианин"
 carolingian_christianity_adherent_plural: "Каролингские христиане"
 carolingian_christianity_desc: "Форма христианства, возникшая во время царствования династии Каролингов и характеризовавшаяся особым вниманием к монашеству и миссионерской деятельности."
 byzantine_rite: "Греческ"
 byzantine_rite_adj: "Греческое христианство"
 byzantine_rite_adherent: "Греко-христианин"
 byzantine_rite_adherent_plural: "Греко-христиане"
 byzantine_rite_desc: "Константинопольский патриархат — один из важнейших центров восточного православия, известный своим богатым богословским наследием и влиянием. Именно из него происходит греческое христианство."
 antiochian_rite: "Антиохийск"
 antiochian_rite_adj: "Антиохийское христианство"
 antiochian_rite_adherent: "Антиохийский христианин"
 antiochian_rite_adherent_plural: "Антиохийские христиане"
 antiochian_rite_desc: "Антиохийский патриархат — одна из древнейших христианских общин, основанная апостолами Петром и Павлом. Его западная сирийская традиция, именуемая яковизмом по имени основателя церкви Иакова Барадея, придерживается миафизитского учения и древней литургии святого Иакова."
 slavic_rite: "Славянск"
 slavic_rite_adj: "Славянское христианство"
 slavic_rite_adherent: "Славянский христианин"
 slavic_rite_adherent_plural: "Славянские христиане"
 slavic_rite_desc: "Принесённое славянским народам Кириллом и Мефодием, это течение христианства включает в себя элементы византийской литургии, адаптированные к славянскому языку и культуре с помощью глаголицы."
 georgian_rite: "Грузинск"
 georgian_rite_adj: "Грузинское христианство"
 georgian_rite_adherent: "Грузинский христианин"
 georgian_rite_adherent_plural: "Грузинские христиане"
 georgian_rite_desc: "Грузинское христианство представляет собой христианские традиции Грузии, отличающиеся особой литургией, церковным наследием и тесной связью с богословием и практикой восточного православия."
 coptic_rite: "Коптск"
 coptic_rite_adj: "Коптское христианство"
 coptic_rite_adherent: "Коптский христианин"
 coptic_rite_adherent_plural: "Коптские христиане"
 coptic_rite_desc: "Коптская церковь ведет свою историю от евангелиста Марка. Именно в этом течении возникли первые христианские монастыри. Кроме того, коптская церковь славится своей давней традицией поддерживать образование и философию."
 ethiopian_rite: "Геэзск"
 ethiopian_rite_adj: "Геэзское христианство"
 ethiopian_rite_adherent: "Геэзский христианин"
 ethiopian_rite_adherent_plural: "Геэзские христиане"
 ethiopian_rite_desc: "Возникшая среди высокогорий Эфиопии и восходящая к Аксумскому царству, эта древняя форма христианства отличается от других церквей александрийской традиции более обширным каноном Священного Писания, богатыми монашескими традициями и особым пониманием завета, связанным с царской Соломоновой династией."
 armenian_rite: "Апостольск"
 armenian_rite_adj: "Апостольское христианство"
 armenian_rite_adherent: "Адепт апостольской церкви"
 armenian_rite_adherent_plural: "Адепты апостольской церкви"
 armenian_rite_desc: "Основанная апостолами Варфоломеем и Фаддеем, Армянская апостольская церковь быстро обзавелась последователями в регионе и привела Армянское царство к статусу первого государства, принявшего христианство в качестве официальной религии."
 apostolic_religious_head_title: "Католикос"
 apostolic_religious_head_title_plural: "Католикосы"
 apostolic_religious_head_title_name: "Церковь"
 # Nabi
 nabi: "Набийск"
 nabi_adj: "Набиизм"
 nabi_adherent: "Наби"
 nabi_adherent_plural: "Анбийя"
 nabi_desc: "Как прямо указано в Священном Коране, наби — это избранник Всемогущего, призванный передать Его послание и напомнить людям о дне, когда они предстанут перед Ним и ответят за свои деяния. Согласно основополагающему вероучению, Пророк Мухаммед был последним наби."
 # Pre madhabs
 sahabah: "Сахабск"
 sahabah_adj: "Сахаба"
 sahabah_adherent: "Асхаб"
 sahabah_adherent_plural: "Асхабы"
 sahabah_desc: "Асхабы, или сподвижники Мухаммеда, — это мусульмане, встречавшие или видевшие его при жизни. Они сыграли важную роль в ранней истории ислама, передаче хадисов, становлении и управлении уммой."
 tabiun: "Табийск"
 tabiun_adj: "Табиитство"
 tabiun_adherent: "Таби"
 tabiun_adherent_plural: "Табиины"
 tabiun_desc: "Табиины — поколение мусульман, следовавших за сподвижниками (асхабами) Пророка Мухаммеда и воспринимавших их учение с чужих слов до появления суннитских мазхабов."
 # Sunni
 hanafi: "Ханафитск"
 hanafi_adj: "Ханафизм"
 hanafi_adherent: "Ханафит"
 hanafi_adherent_plural: "Ханафиты"
 hanafi_desc: "Ханафитский мазхаб вырос из трудов правоведа и богослова Абу Ханифы, который систематизировал применение рационального рассуждения. Ханафитская методологическая основа вынесения правовых предписаний проистекала из Корана, Сунны, единого мнения богословов и суждения по аналогии."
 hanbali: "Ханбалитск"
 hanbali_adj: "Ханбализм"
 hanbali_adherent: "Ханбалит"
 hanbali_adherent_plural: "Ханбалиты"
 hanbali_desc: "Ханбалитский мазхаб — наименьшая из четырёх основных суннитских школ исламского права, основанная на учении Ахмада ибн Ханбаля. В отличие от других мазхабов, ханбалиты отвергают стремление к полной кодификации и систематизации права, считая Коран и хадисы главнейшими источниками при вынесении правовых предписаний."
 maliki: "Маликитск"
 maliki_adj: "Маликизм"
 maliki_adherent: "Маликит"
 maliki_adherent_plural: "Маликиты"
 maliki_desc: "Маликитский мазхаб — одна из четырёх основных суннитских школ исламского права в суннитском исламе. Основанный Маликом ибн Анасом в VIII веке, этот мазхаб отличается от прочих суннитских школ прежде всего подходом к источникам правовых предписаний."
 shafii: "Шафиитск"
 shafii_adj: "Шафиизм"
 shafii_adherent: "Шафиит"
 shafii_adherent_plural: "Шафииты"
 shafii_desc: "Шафиитский мазхаб был основан в начале IX века и назван по имени исламского богослова и правоведа Мухаммада ибн Идриса аш-Шафии, ещё при жизни прозванного «отцом мусульманской юриспруденции». Основу шафиитского учения составляет положение о том, что каждому действию верующего, регулируемому правом, соответствует норма в Ниспосланном законе или шариате."
 #Ismaili
 ismaili: "Исмаилитск"
 ismaili_adj: "Исмаилизм"
 ismaili_adherent: "Исмаилит"
 ismaili_adherent_plural: "Исмаилиты"
 ismaili_desc: "Шиитское течение, полагающее, что род истинных имамов, наделённых божественным знанием и непогрешимостью, идёт через Исмаила ибн Джафара. Они также известны как «семеричники», поскольку Исмаил был седьмым имамом после Мухаммеда."
 #Qarmatians
 qarmatian: "Карматск"
 qarmatian_adj: "Карматизм"
 qarmatian_adherent: "Кармат"
 qarmatian_adherent_plural: "Карматы"
 qarmatian_desc: "Ветвь исмаилизма, включившая в себя элементы зороастризма. Волей бога предначертано, чтобы имамов было семь, и больше не будет имамов, пока седьмой имам Мухаммед ибн Исмаил не вернется, чтобы вести верующих."
 #Nizari
 nizari: "Низаритск"
 nizari_adj: "Низаризм"
 nizari_adherent: "Низарит"
 nizari_adherent_plural: "Низариты"
 nizari_desc: "Рационалистическая конфессия, подчёркивающая необходимость разумной интерпретации Корана и хадисов. Титул имама переходит по наследству, и его можно проследить по линии наследования до Али."
 #Zayidi
 zayidi: "Зейдитск"
 zayidi_adj: "Зейдизм"
 zayidi_adherent: "Зейдит"
 zayidi_adherent_plural: "Зейдиты"
 zayidi_desc: "Истинный имам не безупречен, но его определяет готовность бороться с порчей и злом. Зейдиты отличаются своей убежденностью в том, что Зейд ибн Али был законным наследником имамата из-за его восстания против Омейядов."
 #Imamism (Twelver)
 imami: "Имамитск"
 imami_adj: "Имамизм"
 imami_adherent: "Имамит"
 imami_adherent_plural: "Имамиты"
 imami_desc: "Имамиты верят, что двенадцати имамам было предначертано вести умму и что двенадцатый имам Заман ждет своего часа, чтобы вернуться и возглавить мусульман в Судный день."
 islam_ayatollah: "аятолла"
 islam_ayatollah_plural: "аятоллы"
 ghulat: "Ихтилафийск"
 ghulat_adj: "Ихтилафизм"
 ghulat_adherent: "Ихтилафит"
 ghulat_adherent_plural: "Ихтилафиты"
 ghulat_desc: "Ихтилафи верят в божественную природу праведных имамов, начиная с Али. Бог не только возвел их в сан и вдохновил их, но и отчасти вошел в них, управляя их делами и через них — уммой."
 alawite: "Алавитск"
 alawite_adj: "Алавизм"
 alawite_adherent: "Алавит"
 alawite_adherent_plural: "Алавиты"
 alawite_desc: "Алавитское религиозное учение скрытно, и Коран — лишь один из их священных текстов. Помимо веры в род имамов, начинающийся от Али, алавиты также верят в реинкарнацию и в то, что все живые существа были звездами, сброшенными с неба, а теперь должны вновь заслужить свое место на небе, прожив череду праведных жизней."
 #Alevis
 alevi: "Алевитск"
 alevi_adj: "Алевизм"
 alevi_adherent: "Алевит"
 alevi_adherent_plural: "Алевиты"
 alevi_desc: "Алевиты считают себя преемниками двенадцати имамов, но также следуют традициям, перечисленным в их собрании священных текстов, буйруке. В традиции алевитов бог есть истина, а Мухаммед и Али — его проявления в мире."
 alevi_house_of_worship: "джемеви"
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural: "джемеви"
 alevi_religious_text: "Буйрук"
 alevi_religious_text_2: "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3: "$alevi_religious_text$" # Optional translation alt
 #Ibadi (Muhakkima)
 ibadi: "Мухаккимитск"
 ibadi_adj: "Мухаккимизм"
 ibadi_adherent: "Мухаккимит"
 ibadi_adherent_plural: "Мухаккимиты"
 ibadi_desc: "Мухаккимиты верят, что исламскому сообществу при отсутствии подходящих кандидатов не нужны халифы или имамы. Они не признают преемников Али и Абу Бакра, считая их исключительно светскими лидерами, и подчёркивают роль праведного поведения и согласия."
 #Azariqa
 azariqa: "Азракитск"
 azariqa_adj: "Азракизм"
 azariqa_adherent: "Азракит"
 azariqa_adherent_plural: "Азракиты"
 azariqa_desc: "Не признавая достойных преемников Мухаммеда, азракиты считают своим правом и обязанностью бороться против любого лидера, не разделяющего ценности их веры. Причем в их глазах любой, с кем возникли малейшие различия в интерпретации веры, становится неверным."
 #Najdat
 najdat: "Надждитск"
 najdat_adj: "Надждизм"
 najdat_adherent: "Надждит"
 najdat_adherent_plural: "Надждиты"
 najdat_desc: "Последователи надждитской ветви хариджитов считают, что лидер мусульман может избираться в результате консенсуса верующих. Лидеры не безупречны, но сам бог приводит их к власти руками сообщества."
 #Sufri
 sufri: "Суфритск"
 sufri_adj: "Суфризм"
 sufri_adherent: "Суфрит"
 sufri_adherent_plural: "Суфриты"
 sufri_desc: "Суфриты верят, что наставления и повеления бога можно понять через интерпретацию его слова, а не по наследству. Воля бога становится волеизъявлением уммы, если члены уммы хорошо понимают Коран."
 #Hafizi
 hafizi: "Хафизитск"
 hafizi_adj: "Хафизм"
 hafizi_adherent: "Хафизит"
 hafizi_adherent_plural: "Хафизиты"
 hafizi_desc: "Хафизиты прежде всего поддерживают того, кого считают истинным халифом, противясь любым попыткам свержения. В случае поражения они поднимают восстание за правое дело, а в победе с гордостью следуют воле своего лидера."
