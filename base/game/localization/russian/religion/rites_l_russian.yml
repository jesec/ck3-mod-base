l_russian:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "[Character.GetFullName] [Select_CString(Character.IsLocalPlayer, 'основали', Select_CString(Character.IsFemale, 'основала', 'основал' ))] [Rite.GetNameNoTooltip|l]ое течение во владении [Character.GetCurrentLocation.GetTitle.GetName] [GetCurrentDate.GetStringLong] в качестве одного из течений #L [Faith.GetName|l]ой#! конфессии. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "[Character.GetFullName] [Select_CString(Character.IsLocalPlayer, 'основали', Select_CString(Character.IsFemale, 'основала', 'основал' ))] [Rite.GetNameNoTooltip|l]ое течение [GetCurrentDate.GetStringLong] в качестве одного из течений #L [Faith.GetName|l]ой#! конфессии. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "Это течение сохраняет особое внимание набожности в рамках своей родительской конфессии."
 generic_rite_focus_tenet_aniconism: "Это течение отвергает священные изображения и проповедует почитание через отсутствие образов, сдержанность и святость неизобразимого божественного."
 generic_rite_focus_tenet_alexandrian_catechism: "Это течение высоко ценит учёное наставление, утончённость доктрины и терпеливое вразумление верующих."
 generic_rite_focus_tenet_armed_pilgrimages: "Это течение рассматривает священную войну и вооружённое паломничество как священные обязанности истово верующих."
 generic_rite_focus_tenet_carnal_exaltation: "Это течение почитает желание и телесное наслаждение как дары, отмеченные святостью."
 generic_rite_focus_tenet_communal_identity: "Это течение тесно связывает поклонение с общим обычаем, совместной жизнью и обособленной общинной самобытностью."
 generic_rite_focus_tenet_communion: "Это течение основано на общей преданности, милостыне и общении со своим духовным главой."
 generic_rite_focus_tenet_consolamentum: "Это течение возлагает надежду на последнее очищение через отречение и безбоязненное приготовление к смерти."
 generic_rite_focus_tenet_divine_marriage: "Это течение сакрализует одновременно и брачный союз, и верховную власть, усматривая в священных узах брака отражение божественного порядка."
 generic_rite_focus_tenet_gnosticism: "Это течение ищет сокровенные истины за покровом мира, вверяя спасение священному знанию."
 generic_rite_focus_tenet_mendicant_preachers: "Это течение распространяет веру через странствующих проповедников, смиренное свидетельство и неустанное наставление."
 generic_rite_focus_tenet_pacifism: "Это течение превозносит сдержанность и мир, считая бессмысленное кровопролитие тяжким грехом души."
 generic_rite_focus_tenet_pentarchy: "Это течение высоко ценит древние престолы власти и упорядоченное попечение о вере в целом."
 generic_rite_focus_tenet_unrelenting_faith: "Это течение прославляет горячую ревностность, твёрдую решимость и готовность сражаться за святыни."
 generic_rite_focus_tenet_vows_of_poverty: "Это течение почитает святую бедность, призывая верующих отвергнуть излишества и жить в скромности."
 generic_rite_focus_tenet_pastoral_isolation: "Это течение ограждает свою паству от внешнего мира, отвергая саму идею уступок в вопросах веры."
 generic_rite_focus_tenet_rite: "Это течение придаёт большое значение литургии, церковному чину и сохранению священного предания."
 generic_rite_focus_tenet_adaptive: "Это течение умеет подстраиваться под любые изменяющиеся условия, воспринимая местные обычаи и сохраняя при этом суть своей веры."
 generic_rite_focus_tenet_esotericism: "Это течение высоко ценит сокровенную мудрость, посвящение и истины, открываемые лишь приготовленным."
 generic_rite_focus_tenet_legalism: "Это течение видит святость в ясном законе, надлежащем судопроизводстве и дисциплинированном устроении жизни."
 generic_rite_focus_tenet_literalism: "Это течение ревностно хранит священные слова, отвергая вольные толкования и вынужденные уступки прошлого."
 generic_rite_focus_tenet_reincarnation: "Это течение считает путь души цикличным, где каждая жизнь определяет следующую."
 generic_rite_focus_tenet_religious_legal_pronouncements: "Это течение признаёт за священным законом и каноническими постановлениями непреходящую духовную силу."
 generic_rite_focus_tenet_struggle_submission: "Это течение учит, что вера доказывается борьбой, завоеванием и покорением безбожников."
 generic_rite_focus_tenet_false_conversion_sanction: "Это течение допускает сокрытие убеждений и внешнее приспособление, если того требуют выживание или польза дела."
 generic_rite_focus_tenet_tax_nonbelievers: "Это течение возлагает на неверных бремя дани, утверждая священную иерархию через мирские повинности."
 generic_rite_focus_tenet_asceticism: "Это течение стремится к святости через самоотречение, дисциплину и терпеливое обуздание желаний."
 generic_rite_focus_tenet_bhakti: "Это течение ставит во главу угла искреннее благочестие, постулируя, что если полностью довериться богу с любовью, то душа окажется к нему ближе всего."
 generic_rite_focus_tenet_dharmic_pacifism: "Это течение высоко ценит непричинение вреда и сдержанность, считая мир более высокой дисциплиной по сравнению с гневом."
 generic_rite_focus_tenet_inner_journey: "Это течение обращается внутрь себя, стремясь к пробуждению через созерцание, дисциплину и преображение самого себя."
 generic_rite_focus_tenet_ritual_hospitality: "Это течение считает гостеприимство священной обязанностью, связывающей хозяина и гостя узами священного обычая."
 generic_rite_focus_tenet_adorcism: "Это течение чтит духов с благоговением, стремясь снискать их благосклонность и отвратить их гнев."
 generic_rite_focus_tenet_ancestor_worship: "Это течение обращается к почитаемым предкам за наставлением, благословением и неразрывной связью между живыми и мёртвыми."
 generic_rite_focus_tenet_astrology: "Это течение усматривает знамения в движении небесных светил, полагая, что звёзды являются вестниками откровений о порядке, судьбе и времени."
 generic_rite_focus_tenet_hedonistic: "Это течение допускает пиршества, излишества и освящение наслаждений как часть общего поклонения."
 generic_rite_focus_tenet_human_sacrifice: "Это течение рассматривает кровавую жертву как страшный, но священный договор между смертными и божеством."
 generic_rite_focus_tenet_mystical_birthright: "Это течение считает, что судьба отмечает некоторые души от рождения, даруя им священную силу и духовное величие."
 generic_rite_focus_tenet_ritual_celebrations: "Это течение превозносит общинные празднества и священные торжества как высшую форму поклонения."
 generic_rite_focus_tenet_sacred_childbirth: "Это течение окружает рождение благоговением, считая материнство и новую жизнь священными деяниями."
 generic_rite_focus_tenet_sanctity_of_nature: "Это течение видит святость в живом мире, почитая рост, плодородие и неукрощённую природу."
 generic_rite_focus_tenet_sun_worship: "Это течение чтит солнце как животворный знак порядка, сияния и божественного благоволения."
 generic_rite_focus_tenet_warmonger: "Это течение прославляет завоевания и воинскую доблесть, призывая верующих проявить себя в военных походах."
 generic_rite_focus_tenet_gruesome_festivals: "Это течение допускает страшные пиршества, превращая страх, кровь и представления в священное действо."
 generic_rite_focus_tenet_cthonic_redoubts: "Это течение почитает горные вершины и сокрытые уголки земли как места особой святости."
 generic_rite_focus_tenet_household_gods: "Это течение ставит в центр вероучения дом, вверяя очаг, род и повседневное поклонение божественному попечению."
 generic_rite_focus_tenet_sinitic_syncretism: "Это течение вплетает в своё вероучение синитские философские принципы, предпочитая гармонию разделению."
 generic_rite_focus_tenet_eastern_syncretism: "Это течение охотно воспринимает восточные учения, усматривая в чужой мудрости отблески священной истины."
 generic_rite_focus_tenet_unreformed_syncretism: "Это течение широко заимствует древние практики, вплетая старые обряды в новое священное целое."
 generic_rite_focus_tenet_christian_syncretism: "Это течение переосмысляет христианское вероучение в рамках собственной священной системы, не отвергая его полностью."
 generic_rite_focus_tenet_islamic_syncretism: "Это течение заимствует элементы исламской веры и обычаев, находя полезную истину в откровении, дарованном мусульманам."
 generic_rite_focus_tenet_jewish_syncretism: "Это течение включает в своё вероучение иудейскую традицию, закон и предание."
 generic_rite_focus_tenet_exaltation_of_pain: "Это течение рассматривает боль как способ очищения и раскрытия поклонения через терпение и принятие страдания."
 generic_rite_focus_tenet_natural_primitivism: "Это течение с недоверием относится к чрезмерной цивилизованности, воздавая честь более суровому и первозданному образу жизни."
 generic_rite_focus_tenet_pursuit_of_power: "Это течение благословляет честолюбие и мирское владычество, считая власть достойным орудием сакрального."
 generic_rite_focus_tenet_ritual_cannibalism: "Это течение превращает поедание человеческой плоти в систему запретных ритуалов и ужаса перед божеством."
 generic_rite_focus_tenet_sacred_shadows: "Это течение облекает себя в тайну, возвеличивая сокрытие, сумерки и всё, что утаено от большинства."
 generic_rite_focus_tenet_polyamory: "Это течение благословляет полигамию, отказываясь ограничивать священную близость одним союзом."
 generic_rite_focus_tenet_sacrificial_ceremonies: "Это течение ставит во главу вероучения торжественные подношения, соединяя жертву с заветом и благоволением."
 generic_rite_focus_tenet_megaliths: "Это течение отмечает священное несокрушимым камнем, доверяя изваяниям хранить память и благоговение."
 generic_rite_focus_tenet_fp3_fedayeen: "Это течение возвеличивает скрытность, проникновение и насилие, сопряжённое с самопожертвованием, во имя высшей цели."
 generic_rite_focus_tenet_communal_possessions: "Это течение с неодобрением взирает на индивидуальное богатство и призывает верующих к общему владению имуществом."
 generic_rite_focus_tenet_pure_land: "Это течение возлагает надежду на благодатное царство за пределами страдания, достигаемое через веру, память и поклонение."
 generic_rite_focus_tenet_no_mind: "Это течение стремится к ясности за пределами цепляющегося разума и требует от верующих дисциплины для достижения состояния пустого и чистого осознания."
 generic_rite_focus_tenet_mountain_worship: "Это течение рассматривает любые возвышенности в качестве мест наиболее близких к божественному, превращая горные вершины в объекты почитания."
 generic_rite_focus_tenet_extinction_of_dharma: "Это течение считает, что мир поражён скверной, а потому оправдывает беспощадное насилие в деле защиты истины."
 generic_rite_focus_tenet_cranial_trophies: "Это течение рассматривает останки павших врагов в качестве священного доказательства победы и устрашающей славы."
 generic_rite_focus_tenet_pursuit_of_knowledge: "Это течение возводит учение в ранг священного труда, основанного на поиске истины через обретение новых знаний, спор и дисциплинированный научный поиск."
 generic_rite_focus_tenet_benevolent_governance: "Это течение измеряет святость справедливым правлением, упорядоченным попечением о делах государственных и заботой о державе."
 generic_rite_focus_tenet_filial_piety: "Это течение учит почитанию родителей и старших и считает такое почитание основой нравственного и священного порядка."
 generic_rite_focus_tenet_harmonious_society: "Это течение ценит равновесие, благопристойность и общественную гармонию как отражение космического порядка."
 generic_rite_focus_tenet_sacred_destruction: "Это течение рассматривает священное разрушение как способ очищения, превращая уничтожение в орудие сакрального обновления."
 generic_rite_focus_tenet_preservation: "Это течение высоко ценит стойкость, преемственность и бережное сохранение вверенного."
 generic_rite_focus_tenet_takamin: "Это течение относится к медведю и родственным силам дикой природы с почтением, благоговением и осторожным уважением."
 generic_rite_focus_tenet_peace_of_god: "Это течение стремится сдерживать насилие, устанавливая священные пределы дозволенного кровопролития."
 generic_rite_focus_tenet_dulia: "Это течение почитает святых и святые примеры, преклоняясь перед их памятью, не приравнивая их к божественному."
 generic_rite_focus_tenet_transubstantiation: "Это течение рассматривает святые таинства как подлинно преображающие и основное средоточие божественного присутствия."
 generic_rite_focus_tenet_ora_et_labora: "Это течение соединяет молитву с трудом и утверждает, что дисциплинированная работа сама может стать формой поклонения."
 generic_rite_focus_tenet_hyperdulia: "Это течение проповедует особое почитание наисвятейшего заступника, ставя его выше обычных святых."
 generic_rite_focus_tenet_simony: "Это течение признает, что священный сан, покровительство и земное богатство нелегко отделить друг от друга."
 generic_rite_focus_tenet_monophysitism: "Это течение провозглашает единство природы Христа, отвергая попытки разделить его естество."
 generic_rite_focus_tenet_acts_of_apostles: "Это течение создано по образу апостольской общины, милосердия и совместной жизни первых верующих."
 generic_rite_focus_tenet_purgatory: "Это течение утверждает, что многие души проходят очищение после смерти, прежде чем вступить в совершенное блаженство."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "Это течение возводит семью и произведение потомства в ранг священных обязанностей."
 generic_rite_focus_tenet_apostolic_succession: "Это течение считает, что власть зиждется на непрерывной цепи рукоположений, ведущей своё начало от самих апостолов."
 generic_rite_focus_tenet_confession: "Это течение высоко ценит открытое покаяние и отпущение грехов, считая, что исповеданный грех становится началом исцеления."
 generic_rite_focus_tenet_original_sin: "Это течение считает человеческую слабость изначальной, утверждая, что ни одна душа не входит в мир незатронутой."
 generic_rite_focus_tenet_celestial_hierarchy: "Это течение считает, что вселенная упорядочена по священным чинам, где нахождение на той или иной ступени в иерархии отражает божественный замысел."
 generic_rite_focus_tenet_miles_christi: "Это течение считает верующих святыми воинами, призванными защищать истину с дисциплинированным рвением."
 generic_rite_focus_tenet_scholasticism: "Это течение укрепляет веру через рассуждения, толкование и примирение разума и веры."
 generic_rite_focus_tenet_adoptionism: "Это течение придаёт особое значение превознесению и божественному сыновству и отвергает вечное различие."
 generic_rite_focus_tenet_love_thy_neighbour: "Это течение считает, что в основе повседневной религиозной жизни должны быть милосердие и любовь к ближнему."
 generic_rite_focus_tenet_divine_liturgy: "Это течение возвышает торжественную литургию, считая упорядоченное богослужение наиболее ясным окном в божественное."
 generic_rite_focus_tenet_miaphysitism: "Это течение утверждает нераздельное единство божественного и человеческого в тайне Христовой."
 generic_rite_focus_tenet_hesychasm: "Это течение стремится к единению через молчание, покой и внутреннее повторение святой молитвы."
 generic_rite_focus_tenet_anachoresis: "Это течение проповедует отрешение от мира и поиск святости в уединении, преодолении лишений и удалении от людей."
 generic_rite_focus_tenet_mortification_of_the_flesh: "Это течение ищет святость через телесные тяготы, подчиняя плоть духовному назначению человека."
 generic_rite_focus_tenet_holy_myron: "Это течение придаёт особое значение святому помазанию, считая священный елей печатью божественной благодати."
 generic_rite_focus_tenet_khachkar: "Это течение освящает высеченные из камня кресты и памятники, считая их свидетельством сакральности."
 generic_tenet_focus_fallback: "Этот догмат уделяет особое внимание набожности в рамках своей родительской конфессии."
 generic_tenet_focus_tenet_aniconism: "[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )] отвергает священные изображения и проповедует почитание через отсутствие образов, сдержанность и святость неизобразимого божественного."
 generic_tenet_focus_tenet_alexandrian_catechism: "[GetTenetType('tenet_alexandrian_catechism').GetName( GetPlayer.GetRite )] высоко ценит учёное наставление, утончённость доктрины и терпеливое вразумление верующих."
 generic_tenet_focus_tenet_armed_pilgrimages: "[GetTenetType('tenet_armed_pilgrimages').GetName( GetPlayer.GetRite )] рассматривает военного дела и охрану дорог к святым местам как священный долг верующих."
 generic_tenet_focus_tenet_carnal_exaltation: "[GetTenetType('tenet_carnal_exaltation').GetName( GetPlayer.GetRite )] почитает желание и телесное наслаждение как дары, отмеченные святостью."
 generic_tenet_focus_tenet_communal_identity: "[GetTenetType('tenet_communal_identity').GetName( GetPlayer.GetRite )] тесно связывает поклонение с общим обычаем, совместной жизнью и обособленной общинной самобытностью."
 generic_tenet_focus_tenet_communion: "[GetTenetType('tenet_communion').GetName( GetPlayer.GetRite )] основано на общей преданности, милостыне и братстве со своим духовным главой."
 generic_tenet_focus_tenet_consolamentum: "[GetTenetType('tenet_consolamentum').GetName( GetPlayer.GetRite )] возлагает надежду на последнее очищение через отречение и безбоязненное приготовление к смерти."
 generic_tenet_focus_tenet_divine_marriage: "[GetTenetType('tenet_divine_marriage').GetName( GetPlayer.GetRite )] сакрализует одновременно и брачный союз, и верховную власть, усматривая в священных узах брака отражение небесного порядка."
 generic_tenet_focus_tenet_gnosticism: "[GetTenetType('tenet_gnosticism').GetName( GetPlayer.GetRite )] ищет сокровенные истины за покровом мира, вверяя спасение священному знанию."
 generic_tenet_focus_tenet_mendicant_preachers: "[GetTenetType('tenet_mendicant_preachers').GetName( GetPlayer.GetRite )] распространяет веру через странствующих священников, смиренное свидетельство и неустанное наставление."
 generic_tenet_focus_tenet_pacifism: "[GetTenetType('tenet_pacifism').GetName( GetPlayer.GetRite )] превозносит сдержанность и мир, считая бессмысленное кровопролитие тяжким грехом души."
 generic_tenet_focus_tenet_pentarchy: "[GetTenetType('tenet_pentarchy').GetName( GetPlayer.GetRite )] высоко ценит древние престолы власти и упорядоченное попечение о вере в целом."
 generic_tenet_focus_tenet_unrelenting_faith: "[GetTenetType('tenet_unrelenting_faith').GetName( GetPlayer.GetRite )] прославляет горячую ревностность, твёрдую решимость и готовность сражаться за святыни."
 generic_tenet_focus_tenet_vows_of_poverty: "[GetTenetType('tenet_vows_of_poverty').GetName( GetPlayer.GetRite )] почитает святую бедность, призывая верующих отвергнуть излишества и жить в скромности."
 generic_tenet_focus_tenet_pastoral_isolation: "[GetTenetType('tenet_pastoral_isolation').GetName( GetPlayer.GetRite )] ограждает свою паству от внешнего мира, отвергая саму идею уступок в вопросах веры."
 generic_tenet_focus_tenet_adaptive: "[GetTenetType('tenet_adaptive').GetName( GetPlayer.GetRite )] умеет подстраиваться под любые изменяющиеся условия, воспринимая местные обычаи и сохраняя при этом суть своей веры."
 generic_tenet_focus_tenet_esotericism: "[GetTenetType('tenet_esotericism').GetName( GetPlayer.GetRite )] высоко ценит сокровенную мудрость, посвящение и истины, открываемые лишь приготовленным."
 generic_tenet_focus_tenet_legalism: "[GetTenetType('tenet_legalism').GetName( GetPlayer.GetRite )] видит святость в ясном законе, надлежащем судопроизводстве и дисциплинированном устроении жизни."
 generic_tenet_focus_tenet_literalism: "[GetTenetType('tenet_literalism').GetName( GetPlayer.GetRite )] ревностно хранит священные слова, отвергая вольные толкования и вынужденные уступки прошлого."
 generic_tenet_focus_tenet_reincarnation: "[GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )] считает путь души цикличным, где каждая жизнь определяет следующую."
 generic_tenet_focus_tenet_religious_legal_pronouncements: "[GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )] наделяет священные законы и торжественные суждения духовной властью."
 generic_tenet_focus_tenet_struggle_submission: "[GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )] учит, что вера доказывается борьбой, завоеванием и покорением безбожников."
 generic_tenet_focus_tenet_false_conversion_sanction: "[GetTenetType('tenet_false_conversion_sanction').GetName( GetPlayer.GetRite )] допускает сокрытие убеждений и внешнее приспособление, если того требуют выживание или польза дела."
 generic_tenet_focus_tenet_tax_nonbelievers: "[GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )] возлагает на неверных бремя дани, утверждая священную иерархию через мирские повинности."
 generic_tenet_focus_tenet_asceticism: "[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )] стремится к святости через самоотречение, дисциплину и терпеливое обуздание желаний."
 generic_tenet_focus_tenet_bhakti: "[GetTenetType('tenet_bhakti').GetName( GetPlayer.GetRite )] ставит во главу угла искреннее благочестие, постулируя, что если полностью довериться богу с любовью, то душа окажется к нему ближе всего."
 generic_tenet_focus_tenet_dharmic_pacifism: "[GetTenetType('tenet_dharmic_pacifism').GetName( GetPlayer.GetRite )] высоко ценит непричинение вреда и сдержанность, считая мир более высокой дисциплиной по сравнению с гневом."
 generic_tenet_focus_tenet_inner_journey: "[GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )] обращается внутрь себя, стремясь к пробуждению через созерцание, дисциплину и преображение самого себя."
 generic_tenet_focus_tenet_ritual_hospitality: "[GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )] считает гостеприимство в отношении незнакомцев священной обязанностью, связывающей хозяина и гостя узами священного обычая."
 generic_tenet_focus_tenet_adorcism: "[GetTenetType('tenet_adorcism').GetName( GetPlayer.GetRite )] чтит духов с благоговением, стремясь снискать их благосклонность и отвратить их гнев."
 generic_tenet_focus_tenet_ancestor_worship: "[GetTenetType('tenet_ancestor_worship').GetName( GetPlayer.GetRite )] обращается к почитаемым предкам за наставлением, благословением и неразрывной связью между живыми и мёртвыми."
 generic_tenet_focus_tenet_astrology: "[GetTenetType('tenet_astrology').GetName( GetPlayer.GetRite )] усматривает знамения в движении небесных светил, полагая, что звёзды являются вестниками откровений о порядке, судьбе и времени."
 generic_tenet_focus_tenet_hedonistic: "[GetTenetType('tenet_hedonistic').GetName( GetPlayer.GetRite )] допускает пиршества, излишества и освящение наслаждений как часть общего поклонения."
 generic_tenet_focus_tenet_human_sacrifice: "[GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )] рассматривает кровавую жертву как страшный, но священный договор между смертными и божеством."
 generic_tenet_focus_tenet_mystical_birthright: "[GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )] считает, что судьба отмечает некоторые души от рождения, даруя им священную силу и духовное величие."
 generic_tenet_focus_tenet_ritual_celebrations: "[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )] превозносит общинные празднества и священные торжества как высшую форму поклонения."
 generic_tenet_focus_tenet_sacred_childbirth: "[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )] окружает рождение детей благоговением, считая материнство и новую жизнь священными деяниями."
 generic_tenet_focus_tenet_sanctity_of_nature: "[GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )] видит божественное в живом мире, почитая рост, плодородие и неукрощённую природу."
 generic_tenet_focus_tenet_sun_worship: "[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )] чтит пылающий диск в небе как животворный знак порядка, сияния и божественного благоволения."
 generic_tenet_focus_tenet_warmonger: "[GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )] прославляет завоевания и воинскую доблесть, призывая верующих проявить себя в бою."
 generic_tenet_focus_tenet_gruesome_festivals: "[GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )] допускает страшные пиршества, превращая страх, кровь и представления в священное действо."
 generic_tenet_focus_tenet_cthonic_redoubts: "[GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )] почитает горные вершины и сокрытые уголки земли как места особой святости."
 generic_tenet_focus_tenet_household_gods: "[GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )] ставит в центр вероучения дом, вверяя очаг, род и повседневное поклонение божественному попечению."
 generic_tenet_focus_tenet_sinitic_syncretism: "[GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )] вплетает в своё вероучение китайские философские принципы, предпочитая гармонию разделению."
 generic_tenet_focus_tenet_eastern_syncretism: "[GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )] охотно воспринимает учения далёких земель, усматривая в чужой мудрости отблески священной истины."
 generic_tenet_focus_tenet_unreformed_syncretism: "[GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )] широко заимствует древние практики, вплетая старые обряды в новое священное целое."
 generic_tenet_focus_tenet_christian_syncretism: "[GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )] переосмысляет учение Христа в рамках собственной священной системы, не отвергая его полностью."
 generic_tenet_focus_tenet_islamic_syncretism: "[GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )] заимствует элементы исламской веры и обычаев, находя полезную истину в откровении, дарованном мусульманам."
 generic_tenet_focus_tenet_jewish_syncretism: "[GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )] включает в своё вероучение иудейскую традицию, закон и предание."
 generic_tenet_focus_tenet_exaltation_of_pain: "[GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )] рассматривает телесные муки как способ очищения и раскрытия поклонения через терпение и принятие страдания."
 generic_tenet_focus_tenet_natural_primitivism: "[GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )] с недоверием относится к чрезмерной цивилизованности, воздавая честь более суровому и первозданному образу жизни."
 generic_tenet_focus_tenet_pursuit_of_power: "[GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )] благословляет честолюбие и мирское владычество, считая власть достойным орудием сакрального."
 generic_tenet_focus_tenet_ritual_cannibalism: "[GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )] превращает поедание человеческой плоти в систему запретных ритуалов и ужаса перед божеством."
 generic_tenet_focus_tenet_sacred_shadows: "[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )] облекает себя в тайну, возвеличивая сокрытие, сумерки и всё, что утаено от большинства."
 generic_tenet_focus_tenet_polyamory: "[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )] благословляет полигамию, отказываясь ограничивать священную близость одним союзом."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "[GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )] превращает торжественные подношения в основу обряда, привязывая их к клятвам и благодати."
 generic_tenet_focus_tenet_megaliths: "[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )] отмечает священное несокрушимым камнем, доверяя изваяниям хранить память и благоговение."
 generic_tenet_focus_tenet_fp3_fedayeen: "[GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )] возвеличивает скрытность, проникновение и насилие, сопряжённое с самопожертвованием, во имя высшей цели."
 generic_tenet_focus_tenet_communal_possessions: "[GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )] с неодобрением взирает на индивидуальное богатство и призывает верующих к общему владению имуществом."
 generic_tenet_focus_tenet_pure_land: "[GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )] возлагает надежду на благодатное царство за пределами страдания, достигаемое через веру, память и поклонение."
 generic_tenet_focus_tenet_no_mind: "[GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )] стремится к ясности за пределами цепляющегося разума и требует от верующих дисциплины для достижения состояния пустого и чистого осознания."
 generic_tenet_focus_tenet_mountain_worship: "[GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )] рассматривает любые возвышенности в качестве мест наиболее близких к божественному, превращая горные вершины в объекты почитания."
 generic_tenet_focus_tenet_extinction_of_dharma: "[GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )] считает, что мир поражён скверной, а потому оправдывает беспощадное насилие в деле защиты истины."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] рассматривает останки павших врагов в качестве священного доказательства победы и устрашающей славы."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "[GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )] возводит учение в ранг священного труда, основанного на поиске истины через обретение новых знаний, спор и дисциплинированный научный поиск."
 generic_tenet_focus_tenet_benevolent_governance: "[GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )] измеряет святость справедливым правлением, упорядоченным попечением о делах государственных и заботой о державе."
 generic_tenet_focus_tenet_filial_piety: "[GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )] учит почитанию родителей и старших и считает такое почитание основой нравственного и священного порядка."
 generic_tenet_focus_tenet_harmonious_society: "[GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )] ценит равновесие, благопристойность и общественное согласие как отражение космического порядка."
 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )] рассматривает священное разрушение как способ очищения, превращая уничтожение в орудие обновления."
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )] высоко ценит стойкость, преемственность и бережное сохранение вверенного."
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )] относится к медведю и родственным силам дикой природы с почтением, благоговением и осторожным уважением."
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )] стремится сдерживать насилие, устанавливая священные пределы дозволенного кровопролития."
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] почитает благословенных умерших и святые примеры, дорожа памятью о них, но не приравнивая их к божественному."
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )] рассматривает святые таинства как подлинно преображающие и основное средоточие божественного присутствия."
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )] объединяет набожность и труд, считая, что работа сама по себе становится формой почитания."
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )] проповедует особое почитание наисвятейшего заступника, ставя его выше обычных святых."
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )] признает, что священный сан, покровительство и земное богатство нелегко отделить друг от друга."
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )] провозглашает единство природы Христа, отвергая попытки разделить его естество."
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )] создано по образу апостольской общины, милосердия и совместной жизни первых верующих."
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )] утверждает, что многие души проходят очищение после смерти, прежде чем вступить в совершенное блаженство."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )] возводит семью и произведение потомства в ранг священных обязанностей."
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )] считает, что власть зиждется на непрерывной цепи рукоположений, ведущей своё начало от первых учеников."
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )] высоко ценит открытое покаяние и отпущение грехов, считая, что исповеданный грех становится началом исцеления."
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )] считает человеческую слабость изначальной, утверждая, что ни одна душа не входит в мир незапятнанной."
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )] считает, что вселенная упорядочена по священным чинам, где нахождение на той или иной ступени в иерархии отражает божественный замысел."
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )] считает верующих святыми воинами, призванными защищать истину с дисциплинированным рвением."
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )] укрепляет веру через рассуждения, толкование и примирение разума и веры."
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] придаёт особое значение превознесению и божественному сыновству и отвергает вечное различие."
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )] считает, что в основе повседневной религиозной жизни должны быть милосердие и щедрость."
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )] возвышает торжественные обряды, считая упорядоченное богослужение лучшим способом постичь сакральное."
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )] утверждает нераздельное единство божественного и человеческого в тайне Христовой."
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )] стремится к единению через молчание, покой и внутреннее повторение святой молитвы."
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )] проповедует отрешение от мира и поиск святости в уединении, преодолении лишений и удалении от людей."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )] ищет святость через телесные тяготы, подчиняя примитивные страсти духовному назначению человека."
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )] придаёт особое значение ритуалу помазания, считая священный елей печатью божественной благодати."
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )] освящает высеченные из камня кресты и памятники, считая их свидетельством сакральности."
