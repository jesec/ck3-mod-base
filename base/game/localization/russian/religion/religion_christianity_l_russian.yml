 cathar: "Катарск"
 cathar_adj: "Катаризм"
 cathar_adherent: "Катар"
 cathar_adherent_plural: "Катары"
 cathar_desc: "Катары проповедуют, что все сущее было создано Сатаной и потому осквернено грехом, а единственный способ достичь спасения — отвергнуть материальный мир и все мирские желания вместе с ним."
 cathar_priest_male: "совершенный"
 cathar_priest_male_plural: "совершенные"
 cathar_priest_female: "совершенная"
 cathar_priest_female_plural: "совершенные"
 cathar_priest_neuter: "совершенный"
 cathar_priest_neuter_plural: "совершенные"
 waldensian: "Вальденск"
 waldensian_adj: "Вальденсизм"
 waldensian_adherent: "Вальденс"
 waldensian_adherent_plural: "Вальденсы"
 waldensian_desc: "Вальденсы утверждают, что накопление богатств препятствует спасению, и проповедуют апостольскую бедность как путь к совершенству. Вальденсы полагают, что священники не должны иметь ни титулов, ни земель."
 lollard: "Лоллардск"
 lollard_adj: "Лоллардизм"
 lollard_adherent: "Лоллард"
 lollard_adherent_plural: "Лолларды"
 lollard_desc: "Лолларды отвергают многие общепринятые христианские таинства вроде крещения и исповеди и считают, что Библия — единственно правильный источник христианских доктрин. Лолларды уверены, что все учения, которые не основаны на Писании напрямую, в корне неверны."
 hussite: "Гуситск"
 hussite_adj: "Гуситство"
 hussite_adherent: "Гусит"
 hussite_adherent_plural: "Гуситы"
 hussite_desc: "Это богемское реформистское движение, рождённое из убеждённости в том, что Рим отошёл от заветов апостолов. Гуситы требуют разрешить мирянам причащаться не только хлебом, но и вином, проводить богослужение на местном языке и конфисковать у духовенства накопленные богатства и мирские блага."
 joachimite: "Иоахимистск"
 joachimite_adj: "Иоахимизм"
 joachimite_adherent: "Иоахимит"
 joachimite_adherent_plural: "Иоахимиты"
 joachimite_desc: "Апокалиптическое мистическое учение, разделяющее Писание и историю на три эпохи — Отца, Сына и неизбежную эпоху Святого Духа, когда на смену институту церкви придёт философствующий орден босых нищенствующих проповедников."
 bosnian_church: "Крстянск"
 bosnian_church_adj: "Крстянство"
 bosnian_church_adherent: "Крстянин"
 bosnian_church_adherent_plural: "Крстяне"
 bosnian_church_desc: "Крстянство давно процветает на боснийских горах, вдали от своих знаменитых предтеч — католичества и православия. Они настолько малочисленны и исповедуют столь свободные нравы, что собратья по религии чаще всего относятся к крстянам с долей презрения — если вообще знают об их существовании."
