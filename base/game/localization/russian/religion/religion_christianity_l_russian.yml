 adoptionist: "Адопционистск"
 adoptionist_adj: "Адопционизм"
 adoptionist_adherent: "Адопционист"
 adoptionist_adherent_plural: "Адопционисты"
 adoptionist_desc: "Иберийский осколок адопционизма вырос из сочетания независимого мышления, возникшего в Архиепископстве Толедо и соседних епархиях, североафриканского пуританства прошлых веков и учений нескольких крайне харизматичных ересиархов начала девятого столетия.\n\nИ хотя он принимает различные формы, варьирующиеся от довольно изощренных до абсолютно грубых, объединяющим началом этой доктрины является отрицание божественной сущности Иисуса Христа."
 adoptionist_religious_head_title: "Архиепископ"
 adoptionist_religious_head_title_female: "Архиепископесса"
 adoptionist_religious_head_title_name: "Архиепископат"
 conversos: "Конверсск"
 conversos_adj: "Конверсо"
 conversos_adherent: "Конверсо"
 conversos_adherent_plural: "Конверсо"
 conversos_desc: "Конверсо — выходцы из еврейских общин, насильно обращенные в христианство. Они приняли новую веру, но по сей день помнят старые обычаи и поддерживают тех, кто до сих пор их придерживается."
 #Orthodox-Group Faiths
 orthodox: "Православно-христианск"
 orthodox_adj: "Православие"
 orthodox_adherent: "Православный"
 orthodox_adherent_plural: "Православные"
 orthodox_desc: "Восточная православная церковь убеждена, что ее епископы — подлинные преемники учеников Христа и что только ее учение хранит исконную литургическую традицию и не отошло от изначального христианства."
 orthodox_religious_head_title: "Патриарх"
 orthodox_religious_head_title_female: "Матриарх"
 orthodox_religious_head_title_name: "Патриархат"
 bogomilist: "Богомильск"
 bogomilist_adj: "Богомильство"
 bogomilist_adherent: "Богомил"
 bogomilist_adherent_plural: "Богомилы"
 bogomilist_desc: "Избирая духовных лидеров из простого народа, богомилы отвергают всю мирскую атрибутику и институты власти. Они призывают вернуться к ранним формам духовного учения, какие практиковали Христос и его ученики."
 bogomilist_priest: "выбранный"
 bogomilist_priest_plural: "выбранные"
 paulician: "Павликианск"
 paulician_adj: "Павликианство"
 paulician_adherent: "Павликианин"
 paulician_adherent_plural: "Павликиане"
 paulician_desc: "Отвергая божественность Христа и рассматривая поклонение кресту как пережиток язычества, павликиане утверждали, что стремятся возродить истинный облик христианства, как его представлял Павел из Тарса."
