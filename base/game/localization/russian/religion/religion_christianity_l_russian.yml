 iconoclast: "Иконоборческ"
 iconoclast_adj: "Иконоборчество"
 iconoclast_adherent: "Иконоборец"
 iconoclast_adherent_plural: "Иконоборцы"
 iconoclast_desc: "Полагая, что использование любых религиозных символов нарушает вторую заповедь не создавать кумиров, иконоборцы стремятся уничтожить существующую религиозную иконографию и препятствуют созданию новой."
 #Eastern-Group Faiths
 miaphysitism: "Коптск"
 miaphysitism_adj: "Коптское христианство"
 miaphysitism_adherent: "Коптский христианин"
 miaphysitism_adherent_plural: "Коптские христиане"
 miaphysitism_desc: "Коптская церковь ведет свою историю от евангелиста Марка. Именно в этом течении возникли первые христианские монастыри. Кроме того, коптская церковь славится своей давней традицией поддерживать образование и философию."
 coptic_religious_head_title: "$christianity_religious_head_title$"
 coptic_religious_head_title_female: "$christianity_religious_head_title_female$"
 coptic_religious_head_title_name: "$christianity_religious_head_title_name$"
 armenian_apostolic: "Апостольск"
 armenian_apostolic_adj: "Апостольское христианство"
 armenian_apostolic_adherent: "Адепт апостольской церкви"
 armenian_apostolic_adherent_plural: "Адепты апостольской церкви"
 armenian_apostolic_desc: "Основанная апостолами Варфоломеем и Фаддеем, Армянская апостольская церковь быстро обзавелась последователями в регионе и привела Армянское царство к статусу первого государства, принявшего христианство в качестве официальной религии."
 east_christian_health_god_name: "Св. Самуил"
 east_christian_health_god_name_possessive: "Св. Самуила"
 east_christian_fertility_god_name: "Св. Марина"
 east_christian_fertility_god_name_possessive: "Св. Марины"
 east_christian_wealth_god_name: "Св. Матфей"
 east_christian_wealth_god_name_possessive: "Св. Матфея"
 east_christian_household_god_name: "Св. Иосиф"
