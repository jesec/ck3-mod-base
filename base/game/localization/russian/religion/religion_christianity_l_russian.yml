 catholic_adherent: "Католик"
 catholic_adherent_plural: "Католики"
 catholic_desc: "Римская Католическая церковь утверждает, что Иисус даровал ключи от Царства небесного святому Петру и что Папа — законный преемник святого Петра — обладает верховной духовной властью над всем христианским миром."
