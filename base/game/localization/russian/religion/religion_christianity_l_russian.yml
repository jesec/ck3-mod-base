 east_christian_knowledge_god_name: "Св. Марк"
 east_christian_knowledge_god_name_possessive: "Св. Марка"
 east_christian_war_god_name: "Св. Морис"
 east_christian_war_god_name_possessive: "Св. Мориса"
 nestorian: "Несторианск"
 nestorian_adj: "Несторианство"
 nestorian_adherent: "Несторианин"
 nestorian_adherent_plural: "Несториане"
 nestorian_desc: "В своем учении о двух природах Иисуса Христа, божественной и человеческой, несторианство было объявлено ересью большинством христианских конфессий. Несмотря на это, ее уникальный облик привлек множество последователей в таких далеких восточных регионах, как Китай, Индия и даже Монголия."
 nestorian_religious_head_title: "Патриарх"
 nestorian_religious_head_title_female: "Матриарх"
 nestorian_religious_head_title_name: "Патриархат"
 messalian: "Мессалианск"
 messalian_adj: "Мессалианство"
 messalian_adherent: "Мессалианин"
 messalian_adherent_plural: "Мессалиане"
 messalian_desc: "Полагая, что сущность Бога можно понять только телесными ощущениями, мессалиане отвергают традиционные христианские таинства и вместо этого стремятся познать Бога напрямую через менее традиционные способы поклонения."
 messalian_priest: "совершенный"
 messalian_priest_plural: "совершенные"
 adamites: "Адамитск"
 adamites_adj: "Адамитство"
 adamites_adherent: "Адамит"
 adamites_adherent_plural: "Адамиты"
 adamites_desc: "Адамиты проповедовали возвращение к невинности Адама и Евы через избавление от одежды. Общины адамитов зачастую жили в распутстве, утверждая, что невинность не позволяет применять к ним понятия добра и зла."
