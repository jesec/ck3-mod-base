 dhyana: "Дхьянск"
 dhyana_adj: "Дхьяна"
 dhyana_adherent: "Дхьяна-буддист"
 dhyana_adherent_plural: "Дхьяна-буддисты"
 dhyana_desc: "Дхьяна-буддизм уделяет особое внимание глубоким медитациям как единственному пути к просветлению. Полного понимания можно достичь лишь через внутреннее созерцание и размышления, а не через изучение текстов."
 vinaya: "Винайск"
 vinaya_adj: "Виная"
 vinaya_adherent: "Виная-буддист"
 vinaya_adherent_plural: "Виная-буддисты"
 vinaya_desc: "Приверженцы виная-буддизма предъявляют к себе и друг к другу строгие моральные и этические требования, ибо только самодисциплина может заложить основу для обретения высшей мудрости."
 pundarika: "Пундарикск"
 pundarika_adj: "Пундарика"
 pundarika_adherent: "Пундарика-буддист"
 pundarika_adherent_plural: "Пундарика-буддисты"
 pundarika_desc: "В пундарика-буддизме превыше всего почитается Сутра лотоса. Эта школа делает упор на мантры и сложные обряды, проистекающие из смешения тантрических и эзотерических учений, пришедших в Китай по Шелковому пути."
 sukhavati: "Сукхаватск"
 sukhavati_adj: "Сукхавати"
 sukhavati_adherent: "Сукхавати-буддист"
 sukhavati_adherent_plural: "Сукхавати-буддисты"
 sukhavati_desc: "Сукхавати, Буддизм Чистой земли, учит, что традиционные пути обретения просветления больше не работают. Однако, взывая к состраданию Амитабхи через повторение его имени, любой — и монах, и мирянин — может возродиться в его Чистой земле после смерти."
 yogacara: "Йогачарск"
 yogacara_adj: "Йогачара"
 yogacara_adherent: "Йогачара-буддист"
 yogacara_adherent_plural: "Йогачара-буддисты"
 yogacara_desc: "Последователи буддизма йогачары ставят под сомнение всё, что большинство людей на протяжении всей своей жизни принимают как должное. Материальный мир для них — лишь отражение их собственного сознания."
 avatamsaka: "Аватамсакск"
 avatamsaka_adj: "Аватамсака"
 avatamsaka_adherent: "Аватамсака-буддист"
 avatamsaka_adherent_plural: "Аватамсака-буддисты"
 avatamsaka_desc: "Последователи буддизма аватамсаки считают главным источником истины сутру цветочной гирлянды, где говорится о бесконечности миров, о целых вселенных в одной пылинке."
 mantrayana: "Мантраянск"
 mantrayana_adj: "Мантраяна"
 mantrayana_adherent: "Мантраяна-буддист"
 mantrayana_adherent_plural: "Мантраяна-буддисты"
 mantrayana_desc: "Последователи буддизма мантраяны углубляются в постижение сокровенных истин и ускоряют свое духовное развитие при помощи разнообразных тайных ритуалов и мистических инструментов."
 maitreya: "Майтрейск"
 maitreya_adj: "Майтрея"
 maitreya_adherent: "Майтреянист"
 maitreya_adherent_plural: "Майтреянисты"
 maitreya_desc: "Эра Будды Шакьямуни закончилась, в мир явился Будда Майтрея. Во всяком случае, так верят те, кто почитает Майтрею как предреченного спасителя. Мир можно спасти только через разрушение старого порядка."
 maitreya_religious_head_title: "Иерарх" #教主
 maitreya_religious_head_title_name: "Религиозный орден"
 acharya: "Ачарск"
 acharya_adj: "Ачарья"
 acharya_adherent: "Ачарья-буддист"
 acharya_adherent_plural: "Ачарья-буддисты"
 acharya_desc: "Ачарья, ответвление ваджраянского буддизма, оформилось в IX веке в результате слияния и интеграции китайских ритуалов и тибетских тантрических практик, что привело к возникновению уникальной, глубоко регионализированной формы буддийского культа и духовных практик."
