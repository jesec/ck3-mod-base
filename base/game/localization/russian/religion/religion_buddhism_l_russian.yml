 #Ari
 ari: "Арийск"
 ari_adj: "Ари"
 ari_adherent: "Ари"
 ari_adherent_plural: "Почитатели Ари"
 ari_desc: "Ари причудливо сочетает в себе элементы тантрического буддизма, духопочитания, традиционного поклонения нага и индуизма. Хотя представления этой конфессии весьма нестандартны, адептов ари причисляют к буддистам."
 #Theravada Faith (parent)
 theravada_faith: "Тхеравадск"
 theravada_faith_adj: "Тхеравада"
 theravada_faith_adherent: "Тхеравадин"
 theravada_faith_adherent_plural: "Тхеравадины"
 theravada_faith_desc: "Тхеравада объединяет общины, следующие первоначальному учению Будды, сохранившемуся в Палийском каноне и уделяющему особое внимание личному духовному опыту и постижению."
 d_regional_theravada_rite: "Региональная тхеравада"
 #Theravada
 theravada: "Тхеравадск"
 theravada_adj: "Тхеравада"
 theravada_adherent: "Тхеравадин"
 theravada_adherent_plural: "Тхеравадины"
 theravada_desc: "Путь к просветлению лежит через личный опыт, рефлексию и размышления. Гаутама Будда достиг Нирваны, и единственный способ последовать за ним и тоже достичь ее — пережить, узнать и изучить собственное существование."
 #Mahayana Faith (parent)
 mahayana_faith: "Махаянск"
 mahayana_faith_adj: "Махаяна"
 mahayana_faith_adherent: "Махаянист"
 mahayana_faith_adherent_plural: "Махаянисты"
 mahayana_faith_desc: "Махаяна объединяет различные буддийские школы Восточной Азии, утверждающие идеал бодхисаттвы и стремление к состоянию будды ради блага всех живых существ."
 d_regional_mahayana_rite: "Региональная махаяна"
 #Maitreya Faith (parent)
 maitreya_faith: "Майтрейск"
 maitreya_faith_adj: "Майтрея"
 maitreya_faith_adherent: "Майтреянист"
 maitreya_faith_adherent_plural: "Майтреянисты"
 maitreya_faith_desc: "Традиция майтреи охватывает милленаристские буддистские движения, объявляющие, что эпоха Будды Шакьямуни подошла к концу и что предсказанный Будда Майтрея спустился в мир, чтобы воссоздать его заново. Лишь отказ от старых порядков приведёт к началу новой эпохи."
 d_regional_maitreya_rite: "Региональная майтрея"
 #Mahayana
 mahayana: "Махаянск"
 mahayana_adj: "Махаяна"
 mahayana_adherent: "Махаянист"
 mahayana_adherent_plural: "Махаянисты"
 mahayana_desc: "Уход из Сансары — это не личное дело каждого, но опыт, которым нужно делиться с разумными существами. Состояние будды — лишь очередной этап на долгом пути всех разумных существ к Нирване, добродетельная цель Сансары."
 #Vajrayana Faith (parent)
 vajrayana_faith: "Ваджраянск"
 vajrayana_faith_adj: "Ваджраяна"
 vajrayana_faith_adherent: "Ваджраянист"
 vajrayana_faith_adherent_plural: "Ваджраянисты"
 vajrayana_faith_desc: "Ваджраяна объединяет тантрические буддийские общины, стремящиеся к скорейшему просветлению посредством эзотерических практик, мантр и ритуальных техник."
 d_regional_vajrayana_rite: "Региональная ваджраяна"
 #Vajrayana
 vajrayana: "Ваджраянск"
 vajrayana_adj: "Ваджраяна"
 vajrayana_adherent: "Ваджраянист"
 vajrayana_adherent_plural: "Ваджраянисты"
 vajrayana_desc: "Мотивация на пути к состоянию будды играет важнейшую роль, и истинного просветления можно достичь, лишь стремясь к выгоде для всех разумных существ. Все рождены с просветленным разумом, но существование затуманивает его. Таким образом, практика созерцания истинности мира и вселенной позволяет достичь внутреннего просветления."
