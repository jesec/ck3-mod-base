 doctrine_parameter_extinction_of_dharma_siege_bonus: "Выигранная наступательная [Concept('siege', 'осада')|E] против владения другой [Concept('faith', 'конфессии')|E] той же [Concept('religion', 'религии')|E] приносит [Concept('piety', 'благочестие')|E] и уничтожает значительную часть [Concept('development', 'развития')|E] [Concept('county', 'графства')|E]"
