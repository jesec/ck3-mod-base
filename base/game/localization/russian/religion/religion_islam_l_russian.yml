 #Ṣadr al-Islām
 sadr_al_islam: "Мусульманск"
 sadr_al_islam_adj: "Садр аль-Ислам"
 sadr_al_islam_adherent: "Мусульманин"
 sadr_al_islam_adherent_plural: "Мусульмане"
 sadr_al_islam_desc: "В своей чистой форме, то есть ещё до возникновения мазхабов, мусульманская умма находилась под руководством самого Пророка, получившего божественное откровение. Сподвижники Мухаммеда и табиины первых поколений следовали его сунне."
 #Sunni
 sunni: "Суннитск"
 sunni_adj: "Суннизм"
 sunni_adherent: "Суннит"
 sunni_adherent_plural: "Сунниты"
 sunni_desc: "Суннитами именуются последователи священного предания, сунны, описывающего поступки и примеры из жизни пророка Мухаммеда. Суннитское исламское право основывается прежде всего на Коране, хадисах и иджме (единогласие учёных) как на главных источниках вероучения и юриспруденции."
 #Shia
 shia: "Шиитск"
 shia_adj: "Шиизм"
 shia_adherent: "Шиит"
 shia_adherent_plural: "Шииты"
 shia_desc: "Шиизм — это ветвь ислама, последователи которой верят, что руководство мусульманской общиной должно принадлежать семье пророка Мухаммеда и передаваться через имамов, наставляемых Аллахом. Особое место в нём занимает почитание дома Пророка."
 islam_shia_priest: "мулла"
 islam_shia_priest_plural: "муллы"
 islam_shia_religious_head_title: "Имам"
 islam_shia_religious_head_title_name: "Имамат"
 #Kharijite
 kharijite: "Хариджитск"
 kharijite_adj: "Хариджизм"
 kharijite_adherent: "Хариджит"
 kharijite_adherent_plural: "Хариджиты"
 kharijite_desc: "Хариджиты — это раннеисламское течение, утверждавшее, что право на руководство общиной должно основываться на благочестии, а не на происхождении. Правителей, впавших в грех, следует отрешать от власти. Они возникли во время раскола среди шиитов, отвергли обе стороны и объявили их тяжкими грешниками, отпавшими от ислама."
 #Masmudism
 masmudi: "Альмохадск"
 masmudi_adj: "Альмохадизм"
 masmudi_adherent: "Альмохад"
 masmudi_adherent_plural: "Альмохады"
 masmudi_desc: "Альмохады — реформистская ветвь суннизма, зародившаяся среди берберских племен северной Африки. Они превозносят идеи унитарного государства и доктрины чистого монотеизма."
 masmudi_religious_head_title: "Халиф"
 masmudi_religious_head_title_name: "халифат"
 #Quranism
 quranist: "Коранитск"
 quranist_adj: "Коранизм"
 quranist_adherent: "Коранит"
 quranist_adherent_plural: "Кораниты"
 quranist_desc: "Буквальная интерпретация ислама, подчеркивающая, что Коран является единственным источником божественной мудрости и что ему нужно следовать дословно, игнорируя хадисы и фетвы."
 #Druze
 druze: "Друзск"
 druze_adj: "Друзизм"
 druze_adherent: "Друз"
 druze_adherent_plural: "Друзы"
 druze_desc: "Друзизм следует многим принципам исмаилизма, но также включил в себя гностические верования в эзотерическую теологию и считает истину основным достоинством человека."
 druze_religious_text: "Письма о знании"
