l_russian:
 request_clerical_chastity_interaction: "Потребовать целомудрия"
 request_clerical_chastity_interaction_desc: "Потребовать, чтобы [recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsFemale, 'принесла', 'принёс')] обет целомудрия перед лицом [recipient.GetFaith.HighGodNamePossessive]. В случае согласия [Select_CString(recipient.IsFemale, 'она', 'он')] получит долговременный штраф к [Concept('fertility', 'плодовитости')|E] и не сможет соблазнять и крутить романы, пока обет не перестанет действовать или же [Select_CString(recipient.IsFemale, 'она', 'он')] не откажется от него самостоятельно."
 request_clerical_chastity_notification_text: "Принять обет и усмирить свою плоть ради [actor.GetFaith.HighGodNamePossessive]. Такое послушание — поступок истинного приверженца [actor.GetFaith.GetNameNoTooltip|l]ой веры."
 clerical_chastity_offer_piety: "Предложить благочестие"
 clerical_chastity_recipient_must_be_in_reach_tt: "Вы должны быть [Concept('head_of_faith', 'главой конфессии')|E] либо владеть [Concept('duchy', 'герцогством')|E] или более высоким [Concept('title', 'титулом')|E], если только [recipient.GetShortUINameNoTooltip] не является личным владельцем [Concept('county', 'графства')|E] на границе с вами"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip] [Select_CString(puppet_or_actor.IsLocalPlayer, 'должны', Select_CString(puppet_or_actor.IsFemale, 'должна', 'должен' ))] быть [Concept('head_of_faith', 'главой конфессии')|E] либо владеть [Concept('duchy', 'герцогством')|E] или более высоким [Concept('title', 'титулом')|E], если только [recipient.GetShortUINameNoTooltip] не является личным владельцем [Concept('county', 'графства')|E] на границе с [Select_CString(puppet_or_actor.IsLocalPlayer, 'вами', Select_CString(puppet_or_actor.IsFemale, 'ней', 'ним' ))]"
 clerical_chastity_vow_blocks_scheme_tt: "Вас не должен связывать [GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|Ll]"
 request_clerical_chastity_actor_toast: "Согласиться на требование"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'согласились', Select_CString(recipient.IsFemale, 'согласилась', 'согласился' ))] на [Select_CString(puppet_or_actor.IsLocalPlayer, 'ваши требования', Concatenate('требования персонажа ',puppet_or_actor.GetShortUIName))]"
 request_clerical_chastity_recipient_toast: "Принести обет целомудрия"
 request_clerical_chastity_decline_actor_toast: "Отказано в требовании"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'отклонили', Select_CString(recipient.IsFemale, 'отклонила', 'отклонил' ))] [Select_CString(puppet_or_actor.IsLocalPlayer, 'ваши требования', Concatenate('требования персонажа ',puppet_or_actor.GetShortUIName))]"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "Черта «[GetTrait('chaste').GetName( recipient.Self )]» — добродетель в моей [Concept('faith', 'конфессии')|E]: $VALUE|=+0$"
 clerical_chastity_ai_rival: "Соперник персонажа [actor.GetShortUINameNoTooltip|U]: $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[Concept('realm_capital', 'Столица державы')|E] — мой [Concept('clerical_region', 'церковный округ')|E]: $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "Предложено дополнительное [Concept('piety', 'благочестие')|E]: $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[Select_CString(recipient.IsFemale, 'Она', 'Он')] — [recipient.GetTitleAsNameNoTooltip|l]: $VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "Отказаться от обета целомудрия"
 renounce_clerical_chastity_vow_decision_confirm: "Отказаться от обета"
 renounce_clerical_chastity_vow_decision_desc: "Этот обет мне пришлось принять по требованию священника. От него можно отречься, однако нарушение столь серьёзного обещания повлечёт упадок моего [Concept('piety', 'благочестия')|E] и оставит отпечаток на совести."
 renounce_clerical_chastity_vow_decision_tooltip: "Отказаться от обета, не дожидаясь, пока он истечёт. Вы потеряете [Concept('piety', 'благочестие')|E], получите [Concept('stress', 'стресс')|E], а [Concept('clergy_opinion', 'мнение духовенства')|E] о вас будет снижено на протяжении 10 лет."
 renounce_clerical_chastity_vow_toast: "Отменён обет"
 renounce_clerical_chastity_vow_toast_desc: "Вы отказались от обета целомудрия."
 clerical_chastity_vow.0001.toast_released: "Обет окончен"
 clerical_chastity_vow.0001.toast_released_desc: "Принесённый вами обет больше не действует."
