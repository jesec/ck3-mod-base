l_russian:
 DISTRICT_DEBUG_KEY: "#D КЛЮЧ ДЛЯ ОТЛАДКИ:#! [DistrictType.GetKey]"
 DISTRICT_DEBUG_FULL: "#D DEBUG KEY AND DESC:#!\n[District.GetKey]\n[District.GetDescKey]"
 bureacratic_district_capital_trigger: "[root_scope.GetName] — [Concept('realm_capital', 'столица')|E] вашей державы"
 civic_district_capital_trigger: "[root_scope.GetName] — ваша [Concept('capital', 'столица')|E]"
 household_district_government_trigger: "Ваша [Concept('government', 'форма правления')|E] — [Concept('feudal', 'феодализм')|E], [Concept('clan', 'клан')|E], [Concept('administrative', 'бюрократия')|E], [Concept('celestial', 'мандат')|E], [Concept('meritocratic', 'меритократия')|E], [Concept('ritsuryo', 'рицурё')|E] или [Concept('soryo', 'Сорё')|E]"
 household_district_top_liege_trigger: "Вы [Concept('independent_ruler', 'независимый правитель')|E], как того требуют [Concept('administrative', 'бюрократическая')|E], [Concept('celestial', 'мандатная')|E] и [Concept('meritocratic', 'меритократическая')|E] [Concept('governments', 'формы правления')|E]"
 bureaucratic_district_ledger_or_administrative_trigger: "У владетеля [Concept('administrative', 'бюрократическое')|E] [Concept('government', 'правительство')|E], либо [Concept('culture', 'культура')|E] этого [Concept('barony', 'баронства')|E] открыла [Concept('innovation', 'инновацию')|E] #V $innovation_ledger$#!"
 port_district_water_trigger: "Это [Concept('barony', 'баронство')|E] #bol не#! находится на побережье или у реки"
 temple_district_trigger: "Это не [Concept('county_capital', 'столица графства')|E], не [Concept('temple', 'храм')|E] и не [Concept('temple_citadel', 'монастырь')|E]"
 metropolitan_district_city_trigger: "Это [Concept('city_holding', 'городские владения')|E]"
 ### Holdings ###
 castle_holding_district: "Район замкового владения"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "Район племенного владения"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "Район городского владения"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "Район храмового владения"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "Район стойбища кочевников"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "Район пастушьего селения"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "Район монастырского владения"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"
 DISTRICT_FOCUS_HEADING: "#low Назначение района\n#!"
 UNLOCKS_DISTRICTS: "#low Доступные [Concept('districts', 'районы')|E]#!"
 ### Economy ###
 guild_district: "Гильдейский район"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i][Concept('artisan_tax', 'Налоги с ремесленников')|E]\n$BULLET_WITH_TAB$[prosperity_i][Concept('prosperity', 'Процветание')|E]\n$BULLET_WITH_TAB$[trade_goods_i][Concept('trade_goods', 'Товары')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('sell_prices', 'Цена продажи')|E]"
 guild_district_desc_flavor: "На местных гильдейских подворьях проживают лучшие ремесленники города, ревностно охраняющие секреты своего ремесла. Их работа великолепна, цены высоки, а подмастерья вкалывают в поте лица."
 market_district: "Рыночный район"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][Concept('prosperity', 'Процветание')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('sell_prices', 'Цена продажи')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('buy_prices', 'Цена покупки')|E]\n$BULLET_WITH_TAB$[commerce_tax_i][Concept('commerce_tax_short', 'Налоги с торговли')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]"
 market_district_desc_flavor: "На этой площади с утра до ночи не протолкнуться от местных крестьян, ремесленников и торговцев. Здесь можно купить всё, что не производится в самом городе. По «честной» цене."
 port_district: "Портовый район"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][Concept('prosperity', 'Процветание')|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][Concept('trade_route_capacity_short', 'Потенциал')|E]\n$BULLET_WITH_TAB$[maritime_tax_i][Concept('maritime_tax', 'Морские налоги')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size', 'Размер поселения')|E]"
 port_district_desc_flavor: "Пирсы и склады выстроились вдоль берега, здесь портовые рабочие переносят грузы с кораблей самых разных размеров. Любые заморские товары первым делом попадают сюда."
 entrepot_location_district: "Перевалочный торговый район"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[Concept('trade_goods', 'Товары')|E]\n$BULLET_WITH_TAB$[commerce_tax_i][Concept('commerce_tax', 'Налоги с торговли')|E]"
 entrepot_location_district_desc_flavor: "[Concept('entrepot', 'Здания позволяют перепродавать товары на далёких рынках')|E]\n\nНа этих складах привозные товары пересчитывают, сортируют и отправляют дальше на рынки. Местные торговцы всегда знают, что в дефиците, и назначают соответствующие цены."
 entrepot_holding_district_level_2_tt: "Требуется #V 2#! уровень [Concept('holding_district', 'района владения')|E]"
 entrepot_holding_district_level_3_tt: "Требуется #V 3#! уровень [Concept('holding_district', 'района владения')|E]"
 entrepot_holding_district_level_4_tt: "Требуется #V 4#! уровень [Concept('holding_district', 'района владения')|E]"
 holding_district_level_2_tt: "Требуется #V 2-й#! уровень [Concept('holding_district', 'района владения')|E]"
 holding_district_level_3_tt: "Требуется #V 3-й#! уровень [Concept('holding_district', 'района владения')|E]"
 holding_district_level_4_tt: "Требуется #V 4-й#! уровень [Concept('holding_district', 'района владения')|E]"
 ### Fortification ###
 border_forts_district: "Район пограничных крепостей"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i][Concept('garrison', 'Гарнизон')|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][Concept('stationed_regiment', 'Размещённый полк')|E]\n$BULLET_WITH_TAB$[levies_i][Concept('levies', 'Ополчение')|E]\n$BULLET_WITH_TAB$[control_i][Concept('control', 'Контроль')|E]"
 border_forts_district_desc_flavor: "Границы этого баронства охраняет цепь крепостей, гарнизоны которых знают каждую тропу и переправу. Налётчики, подобравшиеся с этой стороны, редко успевают далеко уйти."
 walls_district: "Район стен"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i][Concept('fort_level', 'Уровень фортификации')|E]\n$BULLET_WITH_TAB$[control_i][Concept('control', 'Контроль')|E]\n$BULLET_WITH_TAB$[garrison_i][Concept('garrison', 'Гарнизон')|E]"
 walls_district_desc_flavor: "Город окружают крепкие стены, отлично защищающие от налётчиков. Горожане возмущаются поборами у ворот, но это дешевле, чем быть ограбленными."
 ### Military ###
 military_district: "Военный район"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][Concept('levies', 'Ополчение')|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][Concept('stationed_regiment', 'Размещённый полк')|E]\n$BULLET_WITH_TAB$[siege_weapon_i][Concept('siege_weapons', 'Осадные орудия')|E]\n$BULLET_WITH_TAB$[garrison_i][Concept('garrison', 'Гарнизон')|E]\n$BULLET_WITH_TAB$[supply_i][Concept('supply', 'Припасы')|E]"
 military_district_desc_flavor: "В этих прочных казармах проживают солдаты державы, здесь они едят, тренируются и готовятся к войне. Но вот поддержание трезвости среди них — это уже отдельный вопрос."
 ### Civic ###
 bureaucratic_district: "Бюрократический район"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i][Concept('vassals', 'Вассалы')|E]\n$BULLET_WITH_TAB$[Concept('realm', 'Держава')|E]\n$BULLET_WITH_TAB$[influence_i][Concept('influence', 'Влияние')|E]\n$BULLET_WITH_TAB$[Concept('tax_collector', 'Сборщик налогов')|E] и [Concept('governor_efficiency', 'эффективность губернатора')|E]"
 bureaucratic_district_desc_flavor: "В этих залах чиновники самого разного ранга копируют, ставят печати и документируют дела державы. Их работа редко заслуживает похвалу, но без неё держава быстро застопорится."
 household_district: "Королевский двор"
 imperial_household_district: "Императорский двор"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][Concept('prestige','престиж')|E]\n$BULLET_WITH_TAB$[Concept('court_grandeur', 'величие двора')|E]\n$BULLET_WITH_TAB$[knight_i][Concept('knights', 'рыцари')|E]\n$BULLET_WITH_TAB$[opinion_i][Concept('opinion', 'мнение')|E]"
 household_district_desc_flavor: "В этих величественных залах правитель проводит аудиенции. За высокими стенами слуги, искусные ремесленники и советники сообща поддерживают блеск и величие державы. Некоторые проводят всю жизнь, так и не покинув этот район."
 mandala_district: "Район мандалы"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][Concept('piety', 'Благочестие')|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][Concept('dynasty_prestige', 'Признание')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('tax', 'Налоги')|E]\n$BULLET_WITH_TAB$[opinion_i][Concept('opinion', 'Мнение')|E]"
 mandala_district_desc_flavor: "Каждый храм, статуя и церемония в этом священном квартале рассказывает одну и ту же историю: царь правит по воле богов. Её рассказывают часто и очень громко."
 temple_district: "Религиозный анклав"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][Concept('piety', 'Благочестие')|E]\n$BULLET_WITH_TAB$[religious_tax_i][Concept('religious_tax', 'Налоги с религии')|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][Concept('epidemic_resistance', 'Сопротивляемость поветрию')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]"
 temple_district_desc_flavor: "Этот квартал полон священных мест. Их колокола, напевы и призывы к молитвам звучат ежечасно и ежедневно. Здесь духовенство обладает такой же властью, как и местный землевладелец."
 temple_district_christian: "Церковный анклав"
 temple_district_islamic: "Район мечети"
 ### Metropolitan ###
 entertainment_district: "Увеселительный район"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]\n$BULLET_WITH_TAB$[urban_tax_i][Concept('urban_tax', 'Налоги с городов')|E]"
 entertainment_district_desc_flavor: "Музыка, игры и разнообразные зрелища привлекают в этот квартал самых разных горожан. Дворяне делают вид, что им это не нравится, а крестьяне делают вид, что не замечают их."
 patrician_district: "Патрицианский район"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size', 'Размер поселения')|E]\n$BULLET_WITH_TAB$[prestige_i][Concept('prestige', 'Престиж')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]"
 patrician_district_desc_flavor: "Мрамор, шёлк и привозные пряности — привычное зрелище в этом богатом районе. Местные семьи заключают браки друг с другом, дают друг другу в долг и плетут интриги друг против друга."
 urban_housing_district: "Жилой район"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size', 'Размер')|E] и [Concept('settlement_size_growth_short', 'рост поселения')|E]\n$BULLET_WITH_TAB$[urban_tax_i][Concept('urban_taxes_short', 'Налоги с городов')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$Доступны [Concept('urban_districts', 'городские районы')|E]"
 urban_housing_district_desc_flavor: "Большинство горожан живут на этих переполненных улицах, по нескольку семей под одной крышей. Для вновь прибывших из деревень это первый шаг на пути к лучшей жизни."
 ### Rural ###
 manor_houses_district: "Район поместий"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][Concept('control', 'Контроль')|E]\n$BULLET_WITH_TAB$[fort_level_i][Concept('fort_level', 'Уровень фортификации')|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax_short', 'Налоги с сельского хозяйства')|E] и [woodland_tax_i][Concept('woodland_tax', 'внутренних земель')|E]\n$BULLET_WITH_TAB$[supply_i][Concept('supply', 'Припасы')|E]"
 manor_houses_district_desc_flavor: "По всей сельской местности раскиданы усадьбы малых благородных семейств, надзирающих за окрестными землями. Зерно и золото текут снизу вверх, а с ними и жалобы."
 religious_community_district: "Район религиозной общины"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][Concept('piety', 'Благочестие')|E]\n$BULLET_WITH_TAB$[religious_tax_i][Concept('religious_tax', 'Налоги с религии')|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][Concept('epidemic_resistance', 'Сопротивляемость поветрию')|E]\n$BULLET_WITH_TAB$[travel_danger_i][Concept('travel_danger', 'Опасность путешествия')|E]"
 religious_community_district_desc_flavor: "В этой тихой общине верующие удаляются от мира, молятся, пашут поля и переписывают священные тексты. Но мир продолжает обрушивать на них проблемы."
 villages_district: "Деревенский район"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i]Сниженный [Concept('settlement_size', 'размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i][Concept('trade_goods_production', 'Производство товаров')|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax_short', 'Налоги с сельского хозяйства')|E] и [woodland_tax_i][Concept('woodland_tax', 'внутренних земель')|E]\n$BULLET_WITH_TAB$[supply_i][Concept('supply', 'Припасы')|E]\n$BULLET_WITH_TAB$Доступны [Concept('rural_districts', 'сельские районы')|E]"
 villages_district_desc_flavor: "За пределами городских стен разбросаны деревни со своими полями и колодцами. Местные крестьяне выращивают пищу, которую горожане воспринимают как само собой разумеющееся."
 ### Tribal ###
 tribal_economy_prestige_district: "Район пиршественных залов"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][Concept('prestige', 'Престиж')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('tax', 'Налоги')|E]"
 tribal_economy_prestige_district_desc_flavor: "В этих пиршественных залах собравшееся племя пирует, пьёт и похваляется подвигами. С каждой чашей истории становятся всё смелее."
 tribal_military_district: "Район военных жилищ"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][Concept('levies', 'Ополчение')|E]\n$BULLET_WITH_TAB$[men_at_arms_i][Concept('men_at_arms', 'Профессионалы')|E]"
 tribal_military_district_desc_flavor: "В этих домах воины племени точат своё оружие и делятся байками о предыдущих налётах. Молодёжь внимательно слушает, уже планируя собственные набеги."
 tribal_wanua_district: "Район вантиланов"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i][Concept('barter_goods', 'Меновые товары')|E]\n$BULLET_WITH_TAB$[vassal_limit_i][Concept('vassal_limit', 'Максимум вассалов')|E]\n$BULLET_WITH_TAB$[domain_limit_i][Concept('domain_limit', 'Предел домена')|E]"
 tribal_wanua_district_desc_flavor: "В этих чертогах собравшийся народ высказывает свои обиды перед старейшинами, а старейшины, в свою очередь, следят за тем, чтобы вождь тоже их выслушал."
 ### Duchy ###
 bailiwick_district: "Судебный район"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax_short', 'Налоги с сельского хозяйства')|E] и [woodland_tax_i][Concept('woodland_tax', 'налоги с внутренних земель')|E]\n$BULLET_WITH_TAB$[trade_goods_i][Concept('trade_goods_production', 'Производство товаров')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]"
 bailiwick_district_desc_flavor: "Село оплачивает все затраты герцогства, бейлифы этого района следят за этим, за каждым полем, стадом и деревней."
 staple_district: "Складской район"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i][Concept('urban_taxes_short', 'Налоги с городов')|E], [commerce_tax_i][Concept('commerce_tax_short', 'торговли')|E], [artisan_tax_i][Concept('artisan_tax_short', 'ремесленников')|E] и [maritime_tax_i][Concept('maritime_tax', 'морские налоги')|E]\n$BULLET_WITH_TAB$[gold_i][Concept('sell_prices', 'Цена продажи')|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][Concept('trade_route_capacity_short', 'Потенциал')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 staple_district_desc_flavor: "Склады, весы и счётные комнаты заполняют собой складской район, где самые ценные товары герцогства взвешиваются, облагаются налогом и защищаются."
 endowment_district: "Благотворительный район"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i][Concept('religious_tax', 'Налоги с религии')|E]\n$BULLET_WITH_TAB$[piety_i][Concept('piety', 'Благочестие')|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][Concept('epidemic_resistance', 'Сопротивляемость поветрию')|E]\n$BULLET_WITH_TAB$[travel_danger_i][Concept('travel_danger', 'Опасность путешествия')|E]"
 endowment_district_desc_flavor: "Каждый подаренный клочок земли передаётся в вечное пользование, и духовенство владеет дарственными от правителей, чьи имена уже никто не помнит."
 assay_district: "Пробирный район"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i][Concept('mining_tax', 'Налоги на добычу')|E] и [civic_tax_i][Concept('civic_tax', 'налоги с горожан')|E]\n$BULLET_WITH_TAB$[control_i][Concept('control', 'Контроль')|E]\n$BULLET_WITH_TAB$[influence_i][Concept('influence', 'Влияние')|E]\n$BULLET_WITH_TAB$[vassal_i][Concept('vassals', 'Вассалы')|E]"
 assay_district_desc_flavor: "Несколько монет из каждой партии остаются в этом районе в запертом сундуке, чтобы позже их можно было проверить на случай, если чеканщики монет станут слишком жадными."
 military_duchy_capital_district: "Район тренировочного плаца"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][Concept('levies', 'Ополчение')|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][Concept('stationed_regiment', 'Размещённый полк')|E]\n$BULLET_WITH_TAB$[garrison_i][Concept('garrison', 'Гарнизон')|E] и [Concept('fort_level', 'уровень фортификации')|E]\n$BULLET_WITH_TAB$[knight_i][Concept('knights', 'Рыцари')|E]"
 military_duchy_capital_district_desc_flavor: "В списках указано имя каждого солдата, обучавшегося в этом районе, а также его оружие и конь. В списках также есть те, кто не явился вовремя."
 ducal_residence_district: "Район герцогской обители"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][Concept('prestige', 'Престиж')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]\n$BULLET_WITH_TAB$[prosperity_i][Concept('prosperity', 'Процветание')|E]\n$BULLET_WITH_TAB$[stress_i][Concept('stress', 'Стресс')|E]"
 ducal_residence_district_desc_flavor: "В этом районе гостей размещают в залах и садах, достойных герцога, и за обедом здесь решается куда больше вопросов, чем при дворе."
 royal_residence_district: "Район монаршей обители"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][Concept('prestige', 'Престиж')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]\n$BULLET_WITH_TAB$[prosperity_i][Concept('prosperity', 'Процветание')|E]\n$BULLET_WITH_TAB$[stress_i][Concept('stress', 'Стресс')|E]"
 royal_residence_district_desc_flavor: "В этом районе гостей размещают в залах и садах, достойных короля, и за обедом здесь решается куда больше вопросов, чем при дворе."
 governance_district: "Административный квартал"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][Concept('control', 'Контроль')|E]\n$BULLET_WITH_TAB$[influence_i][Concept('influence', 'Влияние')|E]\n$BULLET_WITH_TAB$[popular_opinion_i][Concept('popular_opinion', 'Народное мнение')|E]\n$BULLET_WITH_TAB$[men_at_arms_i][Concept('men_at_arms', 'Профессионалы')|E]"
 governance_district_desc_flavor: "В залах этого района трудятся чиновники самых разных рангов, здесь пересчитываются налоги с провинций, осматриваются местные амбары и выплачивается жалование гарнизонам."
 forestry_district: "Район лесозаготовок"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][Concept('woodland_tax', 'Налоги с внутренних земель')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_glass').GetNameWithIcon|l], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_meat').GetNameWithIcon|l]"
 forestry_district_desc_flavor: "Местные леса поставляют древесину для домов, кораблей и костров, и право на их вырубку яростно охраняется. Кража древесины наказывается почти также строго, как незаконная охота на оленей."
 grain_district: "Район выращивания зерна"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l]"
 grain_district_desc_flavor: "Зерно является основой любой экономики, и поля этого района дают обильные всходы. То, что не идёт на выпечку хлеба, становится пивом, спиртом или идёт на продажу."
 wool_district: "Район разведения овец"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l], [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon|l], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 wool_district_desc_flavor: "Стада овец пасутся на пастбищах этого района, а их шерсть мешками продают ткачам по всей державе. Немало торговцев сколотили себя состояние, начав с одного стада."
 cattle_district: "Район разведения скота"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_meat').GetNameWithIcon|l], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l]"
 cattle_district_desc_flavor: "Скот с пастбищ этого района славится своим мясом, молоком и способностью тянуть плуг. Во многих местах приданное невесты до сих пор считают в коровах."
 cotton_district: "Район выращивания хлопка"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 cotton_district_desc_flavor: "Белые шарики хлопка вызревают на полях этого района, их собирают руками и продают в кипах. Некоторые жители далёких земель верят, что из побегов этих растений вырастают маленькие овцы."
 stone_district: "Район каменоломен"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][Concept('mining_tax', 'Налоги на добычу')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 stone_district_desc_flavor: "Холмы этого района покрыты язвами каменоломен, где добывают камень для стен, храмов и замков по всей державе. Многие великолепные сооружения начинали свой путь отсюда."
 fish_district: "Район лова рыбы"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i][Concept('maritime_tax', 'Морские налоги')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 fish_district_desc_flavor: "Рыбу из этого района едят свежей, засаливают, коптят или сушат и продают в далёкие внутренние безводные земли. Хороший улов может кормить деревню целый месяц."
 wine_district: "Район виноградников"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 wine_district_desc_flavor: "Урожай с виноградников этого района идёт на столы, на засушку и, самое главное, на приготовление вина. Об удачном сборе помнят десятилетиями, а о плохом и того дольше."
 oil_district: "Район выращивания оливок"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 oil_district_desc_flavor: "Масло из этого района идёт на разжигание ламп, приготовление еды, помазание верующих и умягчение кожи богатых. Оно используется почти повсюду, и редкий дом обходится без него."
 rice_district: "Район выращивания риса"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l]"
 rice_district_desc_flavor: "Местные земли покрыты заливными полями. Целые деревни занимаются тем, что сеют, пропалывают и собирают урожай совместными усилиями. Выращивание риса — слишком трудоёмкий процесс для одной семьи."
 millet_district: "Район выращивания проса"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_wood').GetNameWithIcon|l]"
 millet_district_desc_flavor: "Поля проса и сорго покрывают местные засушливый равнины. Они настолько высоки, что легко могут скрыть даже всадника. Мелкие и твёрдые зёрна этих растений могут храниться годами и не портиться."
 mine_district: "Район рудников"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][Concept('mining_tax', 'Налоги на добычу')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon|l]"
 mine_district_desc_flavor: "Железо, серебро, соль и любые другие богатства, лежащие под этим районом, будут выкопаны шахтёрами, которые проводят больше времени под землёй, чем на ней."
 salt_district: "Район добычи соли"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][Concept('mining_tax', 'Налоги на добычу')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 salt_district_desc_flavor: "Без соли невозможно заготовить мясо и рыбу на голодные месяцы и не получится прокормить армию. Этот район поставляет её в огромном количестве и прекрасно осознаёт её ценность."
 amber_district: "Район добычи янтаря"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][Concept('woodland_tax', 'Налоги с внутренних земель')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 amber_district_desc_flavor: "Шторма выбрасывают на эти берега множество янтаря, который затем выкапывают из песка и болот. Считается, что кусок янтаря с насекомым внутри приносит удачу."
 silk_district: "Район выращивания шёлка"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 silk_district_desc_flavor: "В этом районе шёлк начинает свой путь в виде крошечных червей, сутки напролёт поедающих листья тутовика. На пошив одного одеяния требуются тысячи коконов."
 furs_district: "Район добычи пушнины"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][Concept('woodland_tax', 'Налоги с внутренних земель')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l]"
 furs_district_desc_flavor: "Охотники этого района уходят в глушь в самые холодные месяцы, когда у животных самый густой и самый ценный мех. Одна хорошая шкура может кормить целый сезон."
 spices_district: "Район выращивания пряностей"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 spices_district_desc_flavor: "Для местных пряностей используются самые разные части растений: кора, почки, ягоды, корни или лепестки цветка. Все их собирают вручную и тщательно высушивают."
 tea_district: "Район выращивания чая"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 tea_district_desc_flavor: "Чайные кусты растут на крутых холмах этого района в окружении рассветных туманов. Лучшие листья собираются, пока они ещё молодые: одна почка и два листа за раз."
 dyes_district: "Район красильщиков"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 dyes_district_desc_flavor: "Для изготовления красителей используются корни, листья, ягоды и даже раздавленные насекомые. Чтобы получить глубокий, долговечный цвет, ткань, порой, приходится вымачивать до дюжины раз."
 ivory_district: "Район добычи слоновой кости"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][Concept('woodland_tax', 'Налоги с внутренних земель')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 ivory_district_desc_flavor: "В этом районе ловят, приручают и обучают слонов для войны и работы. Их ценность не ограничивается одной только слоновой костью."
 sugar_district: "Район выращивания сахара"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E][trade_goods_i]"
 sugar_district_desc_flavor: "В этом районе высятся заросли сахарного тростника. Из него выжимают сладкий сок, который затем выпаривают до затвердевания. В далёких землях один брикет сахара стоит дороже коровы."
 incense_district: "Район добычи благовоний"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 incense_district_desc_flavor: "Благовония этого района производятся из смолы, добытой из коры деревьев и высушенной на солнце. Дым от них поднимается в храмах по всему известному миру."
 medicaments_district: "Район добычи лечебных растений"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][Concept('artisan_tax', 'Налоги с ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E][trade_goods_i]"
 medicaments_district_desc_flavor: "В садах и в глуши этого района произрастают лечебные травы, сбором которых занимаются люди, знающие, какие листья лечат, а какие калечат."
 ceramics_district: "Район производства керамики"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][Concept('artisan_tax', 'Налоги с ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_glass').GetNameWithIcon|l]"
 ceramics_district_desc_flavor: "В этом районе настолько качественная глина, что гончары готовы тратить недели на путешествие, чтобы накопать её. Лучшие из обожжённых здесь творений при лёгком постукивании издают чистый колокольный звон."
 hemp_district: "Район выращивания пеньки"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l]"
 hemp_district_desc_flavor: "Пеньку с полей этого района срезают, вымачивают и выколачивают, чтобы получить волокна для изготовления верёвок, одежды и полотен."
 flax_district: "Район выращивания льна"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 flax_district_desc_flavor: "Лён не срезают, а выдёргивают с корнями, чтобы не упустить ни дюйма волокон. Его семена отжимают, и жмых идёт на корм скотине."
 honey_district: "Район пасек"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l] и [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 honey_district_desc_flavor: "Пчёл содержат в ульях из соломы, глины или выдолбленных брёвен, а при сборе мёда успокаивают с помощью дыма. Для многих это единственный источник сладкого в их жизни."
 fruit_district: "Район сбора фруктов"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E] и [artisan_tax_i][Concept('artisan_tax', 'ремесленников')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]\n$BULLET_WITH_TAB$[trade_goods_i]Возможное производство: [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l]"
 fruit_district_desc_flavor: "Холмы и долины этого района покрывают сады фруктовых деревьев, и их фрукты едят свежими, сушат на солнце или консервируют."
 horses_district: "Район разведения лошадей"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][Concept('agricultural_tax', 'Налоги с сельского хозяйства')|E]\n$BULLET_WITH_TAB$[settlement_size_i][Concept('settlement_size_baseline', 'Базовый размер поселения')|E]"
 horses_district_desc_flavor: "На открытых пастбищах, в загонах и конюшнях этого района разводят, объезжают и продают лошадей наездникам со всей державы."
