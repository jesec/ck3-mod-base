l_russian:
 bm_1066_merchants: "Торговые связи"
 bm_1066_merchants_desc: "Для процветания державы мало одной самодостаточности — необходим ещё и поток товаров. Правитель не выигрывает масштабные кампании только лишь по праву рождения. На покупку оружия, провианта и иноземной помощи для усиления армий требуется золото.\n\nЗа каждой торговлей, каждой заключённой сделкой; за движением караванов и кораблей по легендарным торговым путям стоят купцы. И если им отказать в заслуженном признании, они возьмут дело в свои руки и создадут город нового типа, управляемый его же гражданами.\n\n#bold Богатства становятся мерилом власти. Сумеете ли вы привести своё семейство к господству на рынке и управлению обширной торговой империей?"
 bookmark_merchants_domenico_contarini: "Доменико Контарини"
 bookmark_merchants_domenico_contarini_subheading: "Венецианский дож"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "ибн Джарада"
 bookmark_merchants_ibn_jarada_subheading: "Багдадский купец"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "Сунь Чжун"
 bookmark_merchants_sun_zhong_subheading: "Торговец из Минчжоу"
 bookmark_merchants_sun_zhong_desc: "Гавань Минчжоу — врата Сун в восточные моря, и Сунь Чжун стал тем, благодаря кому в гавани царит суета. Шёлк и фарфор с его складов направляются в Японию и Корё, а на их место прибывают пряности и серебро. Чиновники, взимающие налоги с торговли, усвоили, что своевременный подарок обходится дешевле жалобы.\n\n#bold Восточный берег шёлкового пути — это порт, а не караванный маршрут. Сможете ли вы превратить имя Суня в течение, которое не нарушит никакой двор?#!"
 bookmark_merchants_vitale_faliero: "Витале Фальеро"
 bookmark_merchants_vitale_faliero_subheading: "Венецианский патриций"
 bookmark_merchants_vitale_faliero_desc: "Фальеро — один из самых амбициозных купеческих домов Венеции, и Витале осмелился зайти на Восток дальше, чем его конкуренты. Но опасность подстерегает буквально со всех сторон, будь то препятствия на византийских торговых путях, конфликты с норманнами в Адриатике или завистники в городском совете.\n\n#bold Венеция стоит на перекрестке двух миров. Подчините себе оба и принесите славу имени Фальеро!#!"
 bookmark_merchants_wuhsha_al_dallala: "Вухша «Брокер»"
 bookmark_merchants_wuhsha_al_dallala_subheading: "Каирский брокер"
 bookmark_merchants_wuhsha_al_dallala_desc: "Ухша аль-Даллала — невероятно богатая женщина, и зорко следит за своим состоянием и своими врагами.\n\nЗа свою независимую натуру ей пришлось заплатить изгнанием из синагоги. Но Ухша терпелива и выжидает шанса отомстить обидчикам.\n\n#bold Хватит ли вам сил воспользоваться займами, чтобы унизить своих противников?#!"
 bookmark_merchants_greek_salvidi_1: "Хиллель Сальвиди"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "Абу Саид"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "Сын Вухши"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "Наттал Саху"
 bookmark_merchants_nattal_sahu_subheading: "Король-торговец из Дели"
 bookmark_merchants_nattal_sahu_desc: "Среди купцов Йогинипура имя Саху пользуется большим уважением. Наттал, глава джайнской торговой общины Дели и доверенный советник короля Томары, Анангапала II, создал торговую сеть, простирающуюся от западных портов до рынков Бенгалии.\n\n#bold Заручившись доверием короля и связями торговцев, сможете ли вы построить что-то, что переживет их всех?#!"
 bookmark_merchants_new_merchant_company: "Создать персонажа"
 bookmark_merchants_new_merchant_company_subheading: "Торговец Шелкового пути"
 bookmark_merchants_new_merchant_company_desc: "Шелковый путь принадлежит не королям и императорам, а тем, кто осмеливается по нему пройти.\n\nСоздайте собственную торговую компанию на перекрестке Востока и Запада. Постройте свою империю, караван за караваном, налаживая связи по всему миру: от базаров Самарканда до портов Средиземноморья.\n\n#bold Пусть имя вашего рода будет на устах жителей сотни городов!#!"
