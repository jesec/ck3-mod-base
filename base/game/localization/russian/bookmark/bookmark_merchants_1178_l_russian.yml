l_russian:
 bm_1178_merchants: "Гвельфы и гибеллины"
 bm_1178_merchants_desc: "Конфликт гвельфов и гибеллинов назревал уже давно, ещё с самого кризиса инвеституры в конце XI века.\n\nКогда кайзером стал Фредерик Барбаросса, конфликт резко обострился, и теперь вся Италия решает, кого поддержать. Гибеллины выступают на стороне кайзера, а гвельфы поддерживают Папу Римского.\n\n#bold Вражда царит как внутри итальянских республики, так и между ними. Выберите сторону конфликта и приведите её к победе.#!"
 bookmark_merchants_1178_marco_sanudo: "Марко I Санудо"
 bookmark_merchants_1178_marco_sanudo_subheading: "Венецианский патриций"
 bookmark_merchants_1178_enrico_dandolo: "Энрико Дандоло"
 bookmark_merchants_1178_marco_sanudo_desc: "Семья Санудо — одно из древнейших благородных семейств Венеции, предположительно, состоящее в родстве с легендарной семьёй Кандиано, представители которой неоднократно занимали должность дожа.\n\nМарко — молодой отпрыск семейства, возглавивший дом после смерти отца, и он состоит в хороших отношениях со своим дядей Энрико Дандоло, человеком, который войдёт в историю как организатор Четвёртого крестового похода.\n\n#bold Сможете ли вы исполнить своё предназначение и стать герцогом Архипелажским?#!"
 bookmark_merchants_1178_humbert_savoy: "Гумберт III Савойский"
 bookmark_merchants_1178_humbert_savoy_subheading: "Герцог Савойи #b #bol (Гвельф)#!#!"
 bookmark_merchants_1178_thomas_savoy: "Томас I Савойский"
 bookmark_merchants_1178_humbert_savoy_desc: "Герцог Савойи Гумберт доказал своё благочестие щедрыми пожертвованиями местным монастырям. После смерти своей третьей жены он и вовсе отошёл от мирских забот.\n\nПоддержав гвельфов, он вступил в конфликт с Фредериком Барбароссой, а его земли были захвачены и разграблены.\n\n#bold Сможете ли вы защитить савойские земли от кайзера?#!"
 bookmark_merchants_1178_guido_guerra: "Гвидо Гуэрра III"
 bookmark_merchants_1178_guido_guerra_subheading: "Граф Казентино #color_yellow #bol (Гибеллин)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "Ринальдо Гвиди"
 bookmark_merchants_1178_guido_guerra_desc: "Графы Гвиди столетиями владеют землями в верховьях Арно, и немногие дома Тосканы могут похвастаться более длинной родословной.\n\nГвидо Гуэрра всю жизнь состоял на службе у императора: он участвовал в осаде Милана, а грамоты, дарованные ему Барбароссой, подтверждают его права на замки и рудники по обе стороны Апеннин.\n\n#bold Сможете ли вы вписать имя своего графства в историю?#!"
 bookmark_merchants_1178_speronella_dalesmanni: "Сперонелла Далесманни"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Падуанская патрицианка #b #bol (Гвельф)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "Эццелино III да Романо"
 bookmark_merchants_1178_pietro_iii: "Пьетро Траверсари"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "Когда Сперонелла была подростком, её похитил имперский наместник Падуи Пагано делла Торре. Когда брату удалось освободить её, наместник был свергнут, и вместе с этим город Падуя стал свободной коммуной.\n\n#bold Теперь, став свободной женщиной, сможете ли вы обрести легендарный статус и превратить его в политическое влияние или богатства?#!"
 bookmark_merchants_1178_konrad_urslingen: "Конрад фон Урслинген"
 bookmark_merchants_1178_konrad_urslingen_subheading: "Герцог Сполето #color_yellow #bol (Гибеллин)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "Ютта фон Урслинген"
 bookmark_merchants_1178_konrad_urslingen_desc: "Конрад, молодой германский герцог, поставленный по воле императора править итальянским герцогством, получил во владение Сполето в самом сердце Апеннинского полуострова, где сходятся все дороги с севера на юг. Его власть зиждется на расположении императора, но император далеко, по ту сторону Альп.\n\n#bold Сможете ли вы установить свою власть над центром Итальянского полуострова, или же люди отвергнут ваше правление?#!"
