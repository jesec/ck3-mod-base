 trade_category_farmed_goods_desc: "Товары, выращенные или произведённые местными хозяйствами для последующего экспорта.\n\n[Concept('resource_districts', 'Ресурсные районы')|E], производящие эти товары:\n$BULLET_WITH_TAB$[GetDistrictType('grain_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('rice_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('millet_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('cattle_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('horses_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('wool_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('cotton_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('flax_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('hemp_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('fruit_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('sugar_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('wine_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('oil_district').GetName]"
 trade_category_farmed_goods_name: "крестьянские товары"
 trade_category_cultivated_luxuries: "Экзотические товары"
 trade_category_cultivated_luxuries_desc: "Товары, выращенные преимущественно на плантациях, а не на больших полях.\n\n[Concept('resource_districts', 'Ресурсные районы')|E], производящие эти товары:\n$BULLET_WITH_TAB$[GetDistrictType('silk_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('spices_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('tea_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('incense_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('medicaments_district').GetName]"
 trade_category_cultivated_luxuries_name: "экзотические товары"
 trade_category_artisanal_goods: "Ремесленные товары"
 trade_category_artisanal_goods_desc: "Товары, подвергающиеся более глубокой переработке перед последующим экспортом, чем большинство других товаров в местном сообществе.\n\n[Concept('resource_districts', 'Ресурсные районы')|E], производящие эти товары:\n$BULLET_WITH_TAB$[GetDistrictType('dyes_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('ceramics_district').GetName]"
 trade_category_artisanal_goods_name: "ремесленные товары"
 trade_category_forest_goods: "Лесные товары"
 trade_category_forest_goods_desc: "Товары, добываемые внутри державы: всё, что можно поймать, срубить или собрать.\n\n[Concept('resource_districts', 'Ресурсные районы')|E], производящие эти товары:\n$BULLET_WITH_TAB$[GetDistrictType('forestry_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('furs_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('honey_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('ivory_district').GetName]"
 trade_category_forest_goods_name: "лесные товары"
 msg_market_toll_changed.t: "Рыночный сбор изменён"
 msg_market_toll_changed.desc: "[market_owner.GetShortUIName] изменяет [Concept('market_toll', 'сборы')|E] на рынке«[trade_market.GetName]». Прежнее значение: [old_toll_level.GetName] ([old_toll_level.GetRouteOwnerTollRate|%0]), новое значение: [new_toll_level.GetName] ([new_toll_level.GetRouteOwnerTollRate|%0])"
 msg_toll_exception_changed.t: "Освобождение от сборов изменено"
 msg_toll_exception_changed.desc: "[market_owner.GetShortUIName] изменяет ваше освобождение от [Concept('market_toll', 'сборов')|E] на рынке«[trade_market.GetName]». Прежнее значение: [old_toll_level.GetName] ([old_toll_level.GetRouteOwnerTollRate|%0]), новое значение: [new_toll_level.GetName] ([new_toll_level.GetRouteOwnerTollRate|%0])"
 msg_toll_exception_ended.t: "Действие освобождения от сборов прекращено"
 msg_toll_exception_ended.desc: "[market_owner.GetShortUIName] прекращает действие вашего освобождения от [Concept('market_toll', 'сборов')|E] на рынке«[trade_market.GetName]», ранее установленных на уровне: [old_toll_level.GetName] ([old_toll_level.GetRouteOwnerTollRate|%0]). Теперь вы будете платить сборы, установленные на новом уровне: [new_toll_level.GetName] ([new_toll_level.GetRouteOwnerTollRate|%0])"
