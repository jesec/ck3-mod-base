 trade_category_non_construction: "Нестроительные товары"
 trade_category_non_construction_desc: "Все товары, кроме строительных материалов — древесины, пеньки и камня."
 trade_category_non_food: "Непродовольственные товары"
 trade_category_non_food_desc: "Все товары, кроме основных продуктов питания — зерна, проса, риса, фруктов, мяса, рыбы и сыра."
 trade_category_non_medicinal: "Нелекарственные товары"
 trade_category_non_medicinal_desc: "Все товары, кроме лекарств."
 trade_category_non_luxury: "Повседневные товары"
 trade_category_non_luxury_desc: "Все товары, кроме предметов роскоши и обильной еды. В категорию не входят, например, шёлк, специи, украшения, сыр, фрукты, масло, мёд и чай."
 trade_category_food: "Простая пища"
 trade_category_food_desc: "Основные продукты питания: зерно, просо, рис, фрукты, мясо, рыба и сыр. Это самый востребованный товар, без которого жизнь в городе была бы невозможна."
 trade_category_beasts_of_burden: "Вьючные животные"
 trade_category_beasts_of_burden_desc: "Домашний скот, незаменимый в хозяйстве, путешествиях и перевозках. Эти крепкие и выносливые животные помогают крестьянам и торговцам поддерживать экономику целого региона."
 trade_category_minerals: "Полезные ископаемые"
 trade_category_minerals_desc: "Природное сырье, добытое из недр земли: металлы, драгоценные камни, соль и квасцы. Эти материалы — основа промышленности любого города, ведь в них нуждаются все кузницы, монетные дворы и ремесленные мастерские."
 trade_category_luxury: "Предметы роскоши"
 trade_category_luxury_desc: "Редкие товары, доступные лишь самым богатым и могущественным людям: от шёлка и специй до самоцветов и слоновой кости. Не каждый двор может позволить себе подобную ауру престижа."
 trade_category_refined_goods: "Качественные товары"
 trade_category_alcohol: "Спиртное"
 trade_category_alcohol_desc: "Пиво и вино представляют собой не только лишь усладу для души. Они служат безопасной альтернативой загрязненной воде, используются в религиозных таинствах и способствуют социализации в тавернах и при дворе."
 trade_category_liqour_raw_materials: "Дистилляты"
 trade_category_precious_metals: "Драгоценные металлы"
 trade_category_precious_metals_desc: "Монетные дворы и королевские казны пустовали бы без серебра и золота. Они не только имеют ценность в качестве валюты, но также используются в ремёслах и свидетельствуют о социальном статусе."
 trade_category_jewelry_materials: "Драгоценные камни"
 trade_category_jewelry_materials_desc: "Экзотические и дорогостоящие материалы, которые высоко ценятся за свою красоту: драгоценные камни, янтарь, слоновая кость и нефрит. Их используют в изготовлении предметов роскоши и религиозных украшений."
 trade_category_crops: "Зерно"
 trade_category_crops_desc: "Зерновые культуры, сахар, хлопок и лён. Их выращивают на специально обрабатываемых полях и поливают с помощью каналов для орошения. Эти природные богатства составляют основу многих фермерских общин."
 trade_category_base_metals: "Простые металлы"
 trade_category_base_metals_desc: "Железо и медь используются в промышленности и военном деле. Из железа изготавливают оружие, инструменты и доспехи, медь же необходима для легирования сплавов и обработки других металлов."
 trade_category_cereals: "Злаки"
 trade_category_cereals_desc: "Зерно, просо и рис — основа рациона питания каждого жителя Средневековья. Ими активно торгуют по всему миру, ведь без злаковых культур невозможно прокормить город или армию."
 trade_category_meat: "Мясо"
 trade_category_meat_desc: "Консервированное и вяленое мясо и рыба. Богатая белком пища, которая незаменима как в повседневной жизни, так и в дальних странствиях, где свежие продукты не всегда доступны."
 trade_category_comforts: "Блага"
 trade_category_comforts_desc: "Расхожие продукты питания, которые не входят в категорию первой необходимости: сыр, фрукты, оливковое масло, мёд и чай. Подобные блага улучшают качество жизни и пользуются устойчивым спросом во всех поселениях."
 trade_category_clothes: "Одежда"
 trade_category_clothes_desc: "Готовая одежда и материалы для шитья: различные ткани, меха и кожа. Каждый человек нуждается в надлежащем одеянии, отражающем его социальный статус, будь то грубая рубашка или изысканное платье."
 trade_category_luxury_consumption: "Эксклюзивные продукты"
 trade_category_luxury_consumption_desc: "Дорогие и востребованные товары из заморских стран, такие как сахар и специи. Они придают особый вкус блюдам и используются в медицине, но позволить себе их могут лишь избранные."
 trade_category_luxury_items: "Эксклюзивные вещи"
 trade_category_luxury_items_desc: "Изысканные вещи, свидетельствующие о богатстве и образованности владельца: изделия из керамики и стекла, бижутерия, лакированная посуда и одежда из шёлка. Подобная роскошь — признак процветающего и утонченного двора."
 trade_category_construction_materials: "Строительные материалы"
 trade_category_mandala_arms: "Примитивное оружие"
 trade_category_mandala_arms_desc: "Простые материалы для боевого вооружения, в основном медь и дерево. Из них изготавливают копья, щиты и иные орудия войны в королевствах, не имеющих доступа к более качественным металлам."
 trade_category_carpentry_supplies: "Деревянные изделия"
 trade_category_carpentry_supplies_desc: "Древесина и пенька используются в для строительстве и мореплавании. Из дерева строят каркасы зданий и судов, а из пеньки плетут канаты и тросы для кораблей."
 trade_category_rural_goods: "Сельские товары"
 trade_category_rural_goods_desc: "Природные богатства сельской местности: злаки, фрукты и овощи, домашний скот, древесина и ценные руды, добытые в недрах земли. Это сырье поступает прямиком в города, где подвергается последующей обработке."
 trade_category_agricultural_goods: "Сельскохозяйственные товары"
 trade_category_agricultural_goods_desc: "Вся продукция, произведенная на фермах и полях: от злаков и волокон до вина, меда и домашнего скота. Чем лучше развита экономика сельского хозяйства, тем шире этот список товаров."
 trade_category_bast_fibres: "Лубяные волокна"
 trade_category_fabrics: "Ткани"
 trade_category_fabrics_desc: "Необработанные текстильные волокна, такие как шерсть, хлопок и лен. Они служат промежуточным звеном между сельскохозяйственным сырьем и готовой тканью, из которой шьют одежду портные."
 trade_category_guild_goods: "Гильдейские товары"
 trade_category_guild_goods_desc: "Товары высшей степени обработки, произведенные в городских гильдиях: пиво, ткани, стекло, ювелирные изделия. Это готовая продукция мастеров своего дела."
 trade_category_cheap_common: "Обычные товары"
 trade_category_cheap_common_desc: "Недорогие и доступные товары, которые можно найти на любом рынке: от зерна и рыбы до древесины и камня. Предмет повседневной торговли в любом городе."
 trade_category_fine_goods: "Качественные товары"
 trade_category_fine_goods_desc: "Дорогие товары, которые продаются на крупнейших мировых рынках. Они являются символом богатства, социального статуса и цивилизованного образа жизни."
 trade_category_staple_goods: "Незаменимые товары"
 trade_category_staple_goods_desc: "Основные товары, необходимые для обеспечения городов и армий. Там, где живет много людей, в них нуждаются каждый день."
 trade_category_stone: "Камень"
 trade_category_stone_desc: "Строительный камень для возведения укреплений, церквей и гражданской инфраструктуры. Городам, которым не повезло с местными залежами, зачастую приходится его импортировать."
 trade_category_salt: "Соль"
 trade_category_salt_desc: "Незаменимый для организма минерал, который также используется в консервировании еды и дублении шкур. С древних времен соль служила двигателем торговли по всему миру."
 trade_category_alum: "Квасцы"
 trade_category_alum_desc: "Минеральная соль, которую применяют в качестве протравы для закрепления красителей на текстильных изделиях. Также используется в кожевничестве и медицине. Редкий и ценный в торговле материал."
 trade_category_dyes: "Красители"
 trade_category_dyes_desc: "Яркие красители, изготовленные из растений, минералов и насекомых. С их помощью мастера-ремесленники придают цвет тканям, расписывают керамические изделия и иллюстрируют рукописи."
 trade_category_books: "Книги"
 trade_category_books_desc: "Вековая мудрость, переложенная на бумагу или пергамент. Книги играют важную роль в образовании, бюрократии и передаче знаний, пользуясь спросом среди грамотного населения."
 trade_category_incense: "Благовония"
 trade_category_incense_desc: "Ароматические смолы — важный компонент религиозных церемоний по всему миру. Церкви, храмы и святилища постоянно нуждаются в свежих благовониях."
 trade_category_medicaments: "Лекарства"
 trade_category_medicaments_desc: "Лекарственные препараты, травы и лечебные смеси, используемые врачами и целителями. Они значительно снижают смертность от болезней и травм, а потому необходимы в любом растущем поселении."
 trade_good_wood: "Древесина"
 trade_good_wood_desc: "Дерево — важнейший материал, используемый в строительстве домов, изготовлении мебели и судостроении. Качественная древесина твёрдых пород не всегда доступна на местных рынках, и порой её импортируют из лесных регионов."
 trade_good_stone: "Камень"
 trade_good_stone_desc: "Строительный камень, добываемый из залежей известняка, песчаника или мрамора. Транспортировка его обходится недёшево, но у городов вдали от природных источников зачастую нет другого выбора."
 trade_good_wool: "Шерсть"
 trade_good_wool_desc: "Очищенная овечья шерсть является самым важным текстильным волокном в средневековой Европе. Из неё изготавливают пряжу и ткань для бесчисленного множества ремесленников."
 trade_good_cotton: "Хлопок"
 trade_good_cotton_desc: "Хлопок выращивают в тёплых регионах, таких как Индия и Египет. Из него получается более лёгкое и воздухопроницаемое волокно, чем из шерсти. Одежда из обработанного хлопка составляет основу текстильной торговли в исламском мире и не только."
 trade_good_leather: "Кожа"
 trade_good_leather_desc: "Выделанные шкуры животных служат прочным и лёгким в обработке материалом. Из кожи изготавливают сапоги, ремни, седла, доспехи и переплёты книг, и её важность сложно переоценить."
 trade_good_flax: "Лён"
 trade_good_flax_desc: "Лён возделывают и ради волокна, и ради масла, которое жмут из его семян. Это одна из древнейших культур, известных человеку. Сбор требует немалых трудов, зато лён непривередлив — в отличие от других прядильных культур, он способен расти едва ли не повсюду."
 trade_good_hemp: "Пенька"
 trade_good_hemp_desc: "Прочные волокна этого полезного растения служат основой для верёвок и парусов, а ещё с его помощью конопатят швы при строительстве кораблей и домов."
 trade_good_salt: "Соль"
 trade_good_salt_desc: "Соль добывают из морской воды, соляных источников и минеральных залежей. Это важнейший пищевой минерал и надёжный консервант, увеличивающий срок хранения еды. Благодаря этому соль испокон веков имела большое значение в торговле."
 trade_good_grain: "Зерно"
 trade_good_grain_desc: "Зерно, перемолотое в муку для приготовления хлеба или каши, имело первостепенное значение в средневековом мире. Им питались как крестьяне, так и знать, хотя на западе была популярнее пшеница, а на севере — рожь."
 trade_good_fruit: "Фрукты"
 trade_good_fruit_desc: "Своим сладким вкусом свежие и сушёные плоды придают разнообразие средневековой диете. Такие фрукты, как яблоки, груши и инжир обычно выращивают в тёплых краях, а затем привозят на север."
 trade_good_meat: "Вяленое мясо"
 trade_good_meat_desc: "Мясо — незаменимый источник белка даже в вяленом, сушёном или копчёном виде. Им питаются как солдаты во время долгих походов, так и обычные семьи в неурожайные месяцы."
 trade_good_fish: "Рыба"
 trade_good_fish_desc: "Сушёная и копчёная рыба сохраняет свежесть неделями, а потому является важным источником белка даже вдали от рек и морей. Значительный доход торговцы получали в основном от продажи сельди и трески."
 trade_good_cattle: "Скот"
 trade_good_cattle_desc: "Крупный рогатый скот играет важную роль в обработке полей, являясь при этом источником молока, мяса и шкур. Здоровые и породистые животные высоко ценятся в сельском хозяйстве."
 trade_good_horses: "Лошади"
 trade_good_horses_desc: "Лошади широко распространены в качестве вьючных и ездовых животных. Они незаменимы как в сельском хозяйстве, так в торговле и на войне. Особенно высоко ценятся престижные породы от коневодов из степей и Иберии."
 trade_good_cheese: "Сыры"
 trade_good_cheese_desc: "Твёрдый продукт, получаемый из заквашенного особым способом молока. Сыр хранится гораздо дольше, чем свежее молоко, представляя собой надёжный источник жиров и белков независимо от времени года."
 trade_good_beer: "Пиво"
 trade_good_beer_desc: "Пиво, сваренное из перебродившего зерна, является повседневным напитком жителей северной Европы. В нем мало алкоголя, но много питательных веществ, и в городах его часто употребляют вместо воды как бедняки, так и богачи."
 trade_good_wine: "Вино"
 trade_good_wine_desc: "Этот напиток из сброженного винограда занимает почётное место в средневековой культуре. Вино, произведённое на виноградниках Средиземноморья и долины Рейна, обычно пьют священники, аристократы и богачи."
 trade_good_oil: "Оливковое масло"
 trade_good_oil_desc: "Масло, отжатое из плодов оливкового дерева, используется в качестве кулинарного жира, топлива для ламп и мыльной основы во всем Средиземноморье. На севере оно не так популярно, поскольку там доступнее животные жиры и сливочное масло."
 trade_good_honey: "Мед"
 trade_good_honey_desc: "Мёд — основной подсластитель пищи в средневековом мире. Также он применялся в качестве основы для медовухи, лекарств и консервантов. Хотя многие крестьяне занимались пчеловодством, качественный мёд всегда имел особую ценность."
 trade_good_rice: "Рис"
 trade_good_rice_desc: "Рис — основная злаковая культура Южной и Восточной Азии. Он растёт только в теплом климате и на заливных полях, но приносит обильный урожай, а потому составляет основу рациона целых стран."
 trade_good_millet: "Просо"
 trade_good_millet_desc: "Неприхотливая зерновая культура, которая прорастает даже на бедной почве. Просо является основным продуктом питания в Африке, Центральной Азии и в засушливых районах Индии."
 trade_good_iron: "Железо"
 trade_good_iron_desc: "Железо — самый универсальный металл в средневековом мире. Из него мастерили всё — от инструментов и оружия до подков и гвоздей. В этом материале нуждались как ремесленники, так и солдаты."
 trade_good_alum: "Квасцы"
 trade_good_alum_desc: "Квасцы — редкая соль с множеством полезных свойств: они останавливают кровотечение, используются при обработке стекла и выделке кож. Но главное их назначение — служить протравой при окрашивании тканей. Квасцы отбеливают ткань и помогают красителям прочнее закрепляться на ней.\n\nВ природе они встречаются в тёплых краях, например на Ближнем Востоке, однако их можно получать из квасцового камня и в других частях света."
 trade_good_jade: "Нефрит"
 trade_good_jade_desc: "Нефрит — красивый камень, имеющий большое культурное значение в Восточной Азии. Он используется в изготовлении инструментов, украшений и ритуальных предметов. В Китае этот символ добродетели и высокого положения по карману лишь придворной знати."
 trade_good_gold: "Золото"
 trade_good_gold_desc: "Золото — драгоценный металл, из которого чеканят монеты, наполняющие королевскую казну. Это редкий и красивый на вид материал часто используется в изготовлении корон, реликвий и предметов роскоши."
 trade_good_silver: "Серебро"
 trade_good_silver_desc: "Серебро — самый распространённый в мире денежный металл. Помимо монет, из него также изготавливают бижутерию, посуду и религиозные предметы необычайной красоты."
 trade_good_amber: "Янтарь"
 trade_good_amber_desc: "Окаменевшая древесная смола, встречающаяся в основном на берегах Балтийского моря. Благодаря тёплому золотистому цвету янтарь с древних времен ценится в качестве материала для изготовления бус, четок, подвесок и не только."
 trade_good_copper: "Медь"
 trade_good_copper_desc: "Мягкий и податливый металл, используемый для изготовления посуды, церковных колоколов и создания сплавов, таких как бронза и латунь. Медь имеет приятный теплый оттенок, благодаря чему её также применяют в декоративных целях."
 trade_good_gems: "Самоцветы"
 trade_good_gems_desc: "Драгоценные камни, такие как рубины, сапфиры и изумруды, являются одними из самых ценных товаров. Огранённые самоцветы украшают реликварии, короны и одеяния сильных мира сего."
 trade_good_silk: "Шелк"
 trade_good_silk_desc: "Шёлк получают из коконов тутового шелкопряда, и сотканный из него материал отличается необычайной мягкостью и блеском. Впервые шёлк начали производить в Китае, откуда он в итоге разошелся по миру как один из самых ценных товаров."
 trade_good_textiles: "Ткани"
 trade_good_textiles_desc: "Ткань, изготовленная из шерсти, хлопка, льна или смешанных волокон. Тонкий текстиль был одним из самых ходовых товаров Средневековья, а Фландрия, Италия и Ближний Восток особо славились своими портными-мастерами."
 trade_good_furs: "Меха"
 trade_good_furs_desc: "Шкуры лисы, горностая, соболя, бобра и других животных из северных лесов. Меховые изделия являются признаком богатства и высокого положения, а благодаря высокому спросу среди знати торговать ими весьма прибыльно."
 trade_good_books_paper: "Книги и бумага"
 trade_good_books_paper_desc: "Рукописи, выполненные на пергаменте или бумаге. Книги содержат правовые кодексы, религиозные тексты и накопленные за века знания, а потому пользуются большим спросом там, где высок уровень образованности населения."
 trade_good_spices: "Пряности"
 trade_good_spices_desc: "Перец, корица, гвоздика, мускатный орех и другие пряности из Южной и Юго-Восточной Азии высоко ценятся по всему миру. Они увеличивают срок хранения пищи, придают ей особый вкус и свидетельствуют о материальном благосостоянии."
 trade_good_tea: "Чай"
 trade_good_tea_desc: "Чай, приготовленный из сушёных листьев одноименного растения, является самым популярным напитком на Дальнем Востоке. Оттуда он по Шёлковому пути пришел на запад, где также стал ходовым товаром."
 trade_good_dyes: "Красители"
 trade_good_dyes_desc: "Красители, добываемые из растений (вайда и марена), насекомых (кермес) и минералов. Они необходимы для окраски тканей, росписи посуды, иллюстрирования манускриптов и не только, а потому востребованы среди многих ремесленников."
 trade_good_jewelry: "Драгоценности"
 trade_good_jewelry_desc: "Изделия тонкой работы, в которых драгоценные металлы сочетаются с самоцветами, эмалью и стеклом. Бижутерия была самым наглядным символом богатства в средневековом мире, и ее часто использовали в качестве личных и дипломатических подарков."
 trade_good_ivory: "Слоновая кость"
 trade_good_ivory_desc: "Редкий и престижный материал, полученный из обработанных бивней. Из слоновой кости вырезали шахматные фигуры, детали для религиозных панно и различные декоративные предметы."
 trade_good_glass: "Стекло"
 trade_good_glass_desc: "Стеклянные сосуды, окна и предметы декора. Работы венецианских и исламских мастеров высоко ценятся среди знати, в то время как в церквях и домах используется стекло поскромнее."
 trade_good_sugar: "Сахар"
 trade_good_sugar_desc: "Сахар получают из особого тростника, выращиваемого в тёплых странах. Он используется для подслащивания блюд и производства лекарств, и найти его можно обычно только на кухнях зажиточных горожан."
 trade_good_incense: "Благовония"
 trade_good_incense_desc: "Ароматические смолы, такие как ладан и мирра, часто сжигают при проведении обрядов в различных религиях. Растения, из которых производят благовония, растут только в теплом климате, поэтому обычно их экспортируют из Аравии, Эфиопии и Индии."
 trade_good_ceramics: "Керамика"
 trade_good_ceramics_desc: "Изысканные изделия из керамики и фарфора, изготовленные лучшими мастерами. Качественная посуда из Китая и исламского мира пользуется большим спросом среди любителей роскоши."
 trade_good_lacquerware: "Лаковые изделия"
 trade_good_lacquerware_desc: "Изделия, покрытые изготовленным из смолы лаком, высоко ценятся в Восточной Азии за блеск и долговечность. Лакированные шкатулки, подносы и мебель — предметы роскоши, импортируемые буквально с другого конца света."
 trade_good_medicaments: "Лекарства"
 trade_good_medicaments_desc: "Сушеные травы, минеральные соединения и прочие лекарственные средства, используемые врачами и целителями. Все они играют важную роль в лечении ран, борьбе с болезнями и поддержании здоровья населения."
