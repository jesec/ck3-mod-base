l_russian:
 petition_head_of_faith_decision: "[ROOT.Char.GetFaith.ReligiousHeadTitleName] получит прошение"
 petition_head_of_faith_decision_desc: "Отправиться ко двору [Concept('head_of_faith', 'главы конфессии')|E] и подать официальное обращение."
 petition_head_of_faith_decision_tooltip: "Отправиться к вашему [Concept('head_of_faith', 'главе конфессии')|E] и попросить об одолжении"
 petition_head_of_faith_decision_head_of_faith_exists: "У вашей [Concept('faith', 'конфессии')|E] есть текущий [Concept('head_of_faith', 'глава')|E]"
 NOT_petition_head_of_faith_decision_head_of_faith_exists: "У вашей [Concept('faith', 'конфессии')|E] нет текущего [Concept('head_of_faith', 'главы')|E]"
 petition_antipope_decision: "$anti_religious_head_name$ получит прошение"
 petition_antipope_decision_desc: "Отправиться ко двору, где находится мой $anti_religious_head_name$ и обратиться с официальным прошением. [ROOT.Char.GetFaith.ReligiousHeadTitleName] из владения [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetName] больше не заслуживает моего внимания."
 petition_antipope_decision_tooltip: "Отправиться к вашему [Concept('challenger_hof', 'соперничающему главе конфессии')|E] и попросить об одолжении"
 petition_antipope_decision_confirm: "Подготовить обращение"
 petition_head_of_faith_decision_effects_major_piety: "Потратить [EmptyScope.ScriptValue('major_piety_value')|V0][piety_i] [Concept('piety', 'благочестия')|E] на подготовку обращения. Вы получите его обратно, если отзовёте обращение, отмените [Concept('travel', 'путешествие')|E] или откажетесь от обращения. #EMP Сгорает#!, если вы озвучиваете свою просьбу, но [petition_recipient.GetShortUINameNoTooltip] к вам не прислушивается."
 petition_head_of_faith_decision_effects_massive_piety: "Потратить [EmptyScope.ScriptValue('massive_piety_value')|V0][piety_i] [Concept('piety', 'благочестия')|E] на подготовку обращения. Вы получите его обратно, если отзовёте обращение, отмените [Concept('travel', 'путешествие')|E] или откажетесь от обращения. #EMP Сгорает#!, если вы озвучиваете свою просьбу, но [petition_recipient.GetShortUINameNoTooltip] к вам не прислушивается."
 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.GetShortUIName], #P скорее всего, согласится#! с этим обращением #weak (зависит от [Concept('opinion', 'мнения')|E] о вас; во время аудиенции на это можно повлиять)#!"
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.GetShortUIName] #P может согласиться#! с этим обращением #weak (зависит от [Concept('opinion', 'мнения')|E] о вас; во время аудиенции на это можно повлиять)#!"
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.GetShortUIName] #N может отклонить#! это обращение #weak (зависит от [Concept('opinion', 'мнения')|E] о вас; во время аудиенции на это можно повлиять)#!"
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.GetShortUIName], #N скорее всего, отклонит#! это обращение #weak (зависит от [Concept('opinion', 'мнения')|E] о вас и ваших отношений; во время аудиенции на это можно повлиять)#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak [Concept('traits', 'Свойства')|E] вашей цели, являющиеся [Concept('sinful', 'грехами')|E] или [Concept('virtuous', 'добродетелями')|E] с точки зрения #L [petition_recipient.GetFaith.GetName|l]ой#! веры, влияют на ваши возможные доводы.#!"
 petition_head_of_faith_decision_hook_available: "Воспользоваться тем, что [petition_recipient.GetTitledFirstName] у вас [Concept('hook', 'на крючке')|E], чтобы не тратить [Concept('piety', 'благочестие')|E]"
 petition_head_of_faith_decision_cost_major_piety: "Требуется [EmptyScope.ScriptValue('major_piety_value')|V0][piety_i] [Concept('piety', 'благочестия')|E] или [Concept('hook', 'рычаг влияния')|E]"
 NOT_petition_head_of_faith_decision_cost_major_piety: "$petition_head_of_faith_decision_cost_major_piety$"
 petition_head_of_faith_decision_cost_massive_piety: "Требуется [EmptyScope.ScriptValue('massive_piety_value')|V0][piety_i] [Concept('piety', 'благочестия')|E] или [Concept('hook', 'рычаг влияния')|E]"
 NOT_petition_head_of_faith_decision_cost_massive_piety: "$petition_head_of_faith_decision_cost_massive_piety$"
 petition_head_of_faith_decision_confirm: "Подготовить обращение"
 petition_head_of_faith_excommunication_setup_interaction: "Попросить об отлучении"
 petition_head_of_faith_excommunication_setup_interaction_extra_icon: "$hook_extra_icon$"
 recipient_secondary_petition_head_of_faith_excommunication_setup_interaction: "Цель"
 petition_head_of_faith_excommunication_setup_interaction_accept_tt: "Вы отправитесь во владение [recipient.GetCapitalLocation.GetName] и попросите, чтобы [recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale, 'объявила', 'объявил' )], что [secondary_recipient.GetTitledFirstName] [Concept('excommunicate', Select_CString(secondary_recipient.IsFemale, 'отлучена', 'отлучён' ))|E]"
 petition_head_of_faith_decision_option_repentance: "Отменить отлучение"
 petition_head_of_faith_decision_option_excommunication: "Попросить об отлучении"
 petition_head_of_faith_decision_option_repentance_desc: "Попросить о снятии с вас [Concept('excommunication', 'отлучения')|E]."
 petition_head_of_faith_decision_option_excommunication_desc: "Попросить об [Concept('excommunication', 'отлучении')|E] другого [Concept('ruler', 'правителя')|E] вашей [Concept('faith', 'конфессии')|E]."
 # Auto-referenced by decision_option_list_controller as "<option value>_tooltip"; do not remove.
