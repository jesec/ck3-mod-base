 petition_head_of_faith_excommunication_tooltip: "$petition_head_of_faith_decision_option_excommunication_desc$"
 petition_head_of_faith_costs_refunded: "Стоимость обращения возвращена"
 unavailable_petition_head_of_faith: "ожидает формального обращения"
 petition_head_of_faith_reclaim_offering_tt: "#weak Вам возвращено всё, что вы выделили на это обращение:#!"
 # Invalidation event
 petition_head_of_faith.0601.t: "Обращение прекращено"
 petition_head_of_faith.0601.desc.no_head: "Когда я наконец собираюсь озвучить своё обращение, уже нет подходящего духовного пастыря, что выслушал бы его."
 petition_head_of_faith.0601.desc.head_dead: "[recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale, 'умерла', 'умер' )] до того, как выслушать моё обращение."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName] в заключении и не может получать официальные обращения."
 petition_head_of_faith.0601.desc.head_changed: "Глава моей конфессии сменился, и [recipient.GetTitledFirstName] больше не может получить моё обращение."
 petition_head_of_faith.0601.desc.at_war: "Я не могу сделать официальное обращение, пока я и [recipient.GetTitledFirstName] ведём войну."
 petition_head_of_faith.0601.desc.repentance_resolved: "На мне больше нет отлучения."
 petition_head_of_faith.0601.desc.repentance_too_soon: "Моё покаяние не будут слушать так вскоре после недавнего осуждения."
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.GetTitledFirstName] [Select_CString(petition_target.IsFemale, 'умерла', 'умер' )] до того, как выслушать обращение."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName] больше не принадлежит к моей конфессии, и об отлучении больше нельзя просить."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName] больше не обладает титулом не ниже королевского, а поэтому это обращение больше [Select_CString(petition_target.IsFemale, 'её', 'его' )] не касается."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName] уже в отлучении."
 petition_head_of_faith.0601.desc.fallback: "Я больше не могу подать своё обращение, и путешествие закончится ничем."
 petition_head_of_faith.0601.desc.refund.piety: "Мне вернули благочестивое подношение, сопровождавшее это обращение."
 petition_head_of_faith.0601.desc.refund.none: "Ну хотя бы все остались при своём."
 petition_head_of_faith.0601.a: "Да будет так."
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "Обращение: Искупление грехов"
 petition_head_of_faith.1000.t.excommunication: "Обращение: Отлучение"
 petition_head_of_faith.1000.desc.court_low_grandeur: "Некогда величественный дворец лежит в руинах. Надеюсь, это не является признаком того, что [recipient.GetFaith.ReligiousHeadName] пребывает в духовной нищете.\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "Для меня большая честь, ступить в этот дворец, известный своими великими чертогами. Надеюсь, что сияние позолоты отражает внутренние правосудие и духовное богатство.\n\n"
 petition_head_of_faith.1000.desc.intro: "Здесь восседает наместник Бога на земле."
 petition_head_of_faith.1000.desc.recipient_sinful: "Хотя [Select_CString(recipient.IsFemale, 'её', 'его')] [petition_hof_gravest_sin.GetName(recipient)|l] — широко известный факт, [Select_CString(recipient.IsFemale, 'ей', 'ему')] при помощи каких-то дьявольских уловок удалось взобраться на престол Святого Петра."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Несомненно, [Select_CString(recipient.IsFemale, 'её', 'его')] [petition_hof_gravest_virtue.GetName(recipient)|l] будет определять [Select_CString(recipient.IsFemale, 'её', 'его')] суждения."
 petition_head_of_faith.1000.desc.health_noble: "\n\n[Select_CString(recipient.IsFemale, 'Её', 'Его')] слабое здоровье, очевидно, является следствием неустанного и благородного труда."
 petition_head_of_faith.1000.desc.health_excess: "\n\n[Select_CString(recipient.IsFemale, 'Её', 'Его')] слабое здоровье, очевидно, является результатом губительных излшеств."
 petition_head_of_faith.1000.desc.address: "\n\nЯ озвучиваю свою просьбу: «[Select_CString(recipient.IsFemale, 'Святая мать', 'Святой отец')],"
 petition_head_of_faith.1000.desc.repentance: "я смиренно прошу вас снять осуждение, наложенное на мою душу, и мою вас допустить меня к причастию»."
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName] [Select_CString(petition_target.IsFemale, 'совершила', 'совершил')] преступление против Бога. Но я лишь скромный посланец, ибо лишь вам дозволено судить [Select_CString(petition_target.IsFemale, 'её', 'его')] бессмертную душу»."
 petition_head_of_faith.1000.a.argue: "Я озвучу свою просьбу."
 petition_head_of_faith.1000.a.argue_tt: "Приложить усилия, чтобы [recipient.GetShortUINameNoTooltip] [Select_CString(recipient.IsFemale, 'прислушалась', 'прислушался' )] к вам во время аудиенции."
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n«Мы услышали вас, дитя моё. Скажите, чего именно вы хотите, и мы милостиво выслушаем вашу просьбу», —"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n«Ваше прошение перед нами. Мы рассмотрим его согласно канонам и учению святой церкви», —"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n«Красивые слова говорить легко. Мы скептически рассмотрим ваше прошение, как того требует Господь», —"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n«Вам хватило наглости явиться сюда. Тщательно выбирайте свои слова», —"
 petition_head_of_faith.1000.desc.conclusion: "говорит [Select_CString(recipient.IsFemale, 'она', 'он')], ожидая."
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "Обращение: [actor.GetTitledFirstNameNoTooltip] раскаивается"
 petition_head_of_faith.1310.desc.intro: "«[Select_CString(ROOT.Char.IsFemale, 'Святая мать', 'Святой отец')], меня отлучили от церкви, от причастия и от верующих. Молю вас, снимите осуждение с моей души и допустите к причастию», — на коленях молит [actor.GetTitledFirstName].\n\n«Явите своё раскаяние пред Богом», — отвечаю я."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n«Вы всегда были щедры ко мне, [Select_CString(ROOT.Char.IsFemale, 'Святая мать', 'Святой отец')]. Но я не прошу о земных милостях, пусть Господь и святая церковь услышат моё покаяние»."
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n«Я стою перед Богом, как любой кающийся, и прошу лишь праведного суда по всем канонам»."
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n«Не принимайте меня за [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], что сбивает с пути сладкими речами. Клянусь, и [ROOT.Char.GetFaith.HighGodName], и наместник на земле тому свидетели: я каюсь во грехах»."
 petition_head_of_faith.1310.serpent.christian: "змея в саду"
 petition_head_of_faith.1310.serpent.generic: "змея"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n«В миру мы были врагами. Я не прошу вас поддерживать меня в земных делах, но примите моё покаяние и не вредите моей душе»."
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n«Известно нам, что [petition_gravest_sin.GetName(actor)|l] разъедает вашу душу. Красивыми словами не смыть пятен с души. Какое покаяние вы предложите?»"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n«Ваше имя почти чисто от греха. Возможно, наказание помогло вам исцелиться. Посмотрим, отвечает ли ваша душа вашим словам»."
 petition_head_of_faith.1310.a: "«Встаньте, дитя моё. Вы вновь допущены к причастию»."
 petition_head_of_faith.1310.b: "«Наказание остаётся. Возвращайтесь, когда ваше покаяние станет очевидным»."
 petition_head_of_faith.1320.t: "Обращение: [petition_target.GetTitledFirstNameNoTooltip] заслуживает отлучения"
 petition_head_of_faith.1320.desc.intro: "«[Select_CString(ROOT.Char.IsFemale, 'Святая мать', 'Святой отец')], [petition_target.GetTitledFirstName] [Select_CString(petition_target.IsFemale, 'совершила', 'совершил')] преступления против Бога. Если не устранить источник скверны, она затронет души всех нас», — говорит [actor.GetTitledFirstName].\n\n«Мы не используем отлучение как оружие смертных владык. Озвучьте свои обвинения перед лицом Бога», — отвечаю я."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n«Вы всегда были справедливы, [Select_CString(ROOT.Char.IsFemale, 'Святая мать', 'Святой отец')]. Но я не прошу о земных милостях, пусть Господь и святая церковь услышат, какие преступления совершает [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n«Перед Богом я произношу свои обвинения как простой раб божий и прошу лишь совершить правосудие святой церкви."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n«Не думайте обо мне, как о змее в саду, что сладкими речами решает личные склоки. Пред ликом [ROOT.Char.GetFaith.HighGodNamePossessive] и его наместника на земле клянусь, что обвинение справедливо."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n«В миру мы были врагами, но прошу вас, [petition_target.GetTitledFirstNameNoTooltip] заслуживает того, чтобы [Select_CString(petition_target.IsFemale, 'её', 'его')] душу оценили по всем канонам."
 petition_head_of_faith.1320.desc.target_sinful: "Корень греха — [Select_CString(petition_target.IsFemale, 'её', 'его')] [petition_gravest_sin.GetName(petition_target)|l]», —"
 petition_head_of_faith.1320.desc.finish: "заключает [actor.GetTitledFirstName]."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNameNoTooltip] хорошо скрывает свою порочную натуру, но я верю, с божьей помощью вы узрите [Select_CString(petition_target.IsFemale, 'её', 'его')] грехи», —"
 petition_head_of_faith.1320.a: "«Я отлучаю [Select_CString(petition_target.IsFemale, 'её', 'его')] от причастия»."
 petition_head_of_faith.1320.b: "«Ваши слова меня не убедили, наказания не будет»."
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "Объявление об отлучении"
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName|U] встаёт, чтобы вершить божий суд:\n\n«[petition_target.GetTitledFirstName] [Select_CString(petition_target.IsFemale, 'отлучена', 'отлучён' )] и [Select_CString(petition_target.IsFemale, 'отсечена', 'отсечён' )] от верующих, а [Select_CString(petition_target.IsFemale, 'её', 'его' )] душа обречена на муки до тех пор, пока [Select_CString(petition_target.IsFemale, 'она', 'он' )] не покается»."
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName] явил свою волю через своего слугу."
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "Обращение отклонено"
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName|U] встаёт, чтобы вершить божий суд:\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "«Названные вами грехи не столь ужасны, чтобы оправдать столь страшную кару. [petition_target.GetTitledFirstName] не будет [Select_CString(petition_target.IsFemale, 'отлучена', 'отлучён' )]»."
 petition_head_of_faith.2030.desc.finesse: "«Мы не отворачиваемся от верующих ради мирского богатства. Кесарево не купит правосудия [recipient.GetFaith.HighGodNamePossessive]»."
 petition_head_of_faith.2030.desc.learning_duel: "«Хотите, чтобы [petition_target.GetTitleAsNameNoTooltip|l] [Select_CString(petition_target.IsFemale, 'стала', 'стал' )] жертвой вашего намеренного искажения канонического права? [petition_target.GetTitledFirstName] не будет [Select_CString(petition_target.IsFemale, 'отлучена', 'отлучён' )] из-за… глубины ваших познаний»."
 petition_head_of_faith.2030.desc.fallback: "«Вы много о себе возомнили! Не вижу причин для того, чтобы [petition_target.GetTitledFirstName] не будет [Select_CString(petition_target.IsFemale, 'была отлучена', 'был отлучён' )]»."
 petition_head_of_faith.2030.a: "Полагаю, [recipient.GetFaith.HighGodName] явил свою волю через своего слугу."
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "Довод"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "«Можете ли вы доказать, что [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'виновна', 'виновен' )], опираясь на Писание и каноны церкви? Действительно ли [Select_CString(petition_target.IsFemale, 'она поклонялась', 'он поклонялся' )] идолам?»"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "«Объявите ли вы, что [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'виновна', 'виновен' )], у подножья каменного креста?»"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "«Неужели [petition_target.GetTitledFirstNameNoTooltip] не заслуживает милосердия Богородицы? Стоите ли вы здесь в незапятнанных одеждах?»"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "«Вы хотите, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'была отлучена', 'был отлучён' )] от священной литургии, из-за ваших личных распрей, а не из-за доказанного смертного греха?»"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "«Вы хотите, чтобы [petition_target.GetTitledFirstNameNoTooltip] не [Select_CString(petition_target.IsFemale, 'допускалась', 'допускался' )] к алтарю Христа? Чтобы не [Select_CString(petition_target.IsFemale, 'могла', 'мог' )] приобщиться к его плоти и испить его крови?»"
 petition_head_of_faith.2000.desc.atmosphere_communion: "«Вы считаете, что [petition_target.GetTitledFirstNameNoTooltip] заслуживает быть [Select_CString(petition_target.IsFemale, 'изгнанной', 'изгнанным' )] из общины верующих?»"
 petition_head_of_faith.2000.desc.atmosphere_confession: "«Вы хотите, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'понесла', 'понёс' )] наказание за слова, защищённые тайной исповеди?»"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "«Вы хотите, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'была отлучена', 'был отлучён' )] до того, как будут испробованы более мягкие способы отвадить [Select_CString(petition_target.IsFemale, 'её', 'его' )] от греха?»"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "«Обратитесь ли вы к власти апостолов, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'была осуждена', 'был осуждён' )] и на земле, и на небесах?»"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "«Вы отвлекаете нас от изучения канонов и утверждаете, что [petition_target.GetTitledFirstNameNoTooltip] заслуживает осуждения. Основываются ли ваши речи на текстах отцов церкви и Писании?»"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "«Вы требуете нашего вмешательства, поскольку [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'пролила', 'пролил' )] кровь в священный год или на церковной земле? [Select_CString(petition_target.IsFemale, 'Нарушила ли она', 'Нарушил ли он' )] Мир Божий?»"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "«Неужели нет иного места судить обиды, что [Select_CString(petition_target.IsFemale, 'причинила', 'причинил' )] вам [petition_target.GetTitledFirstNameNoTooltip]? Не лучше ли будет, если вы оба поднимете знамя с крестом и начнёте войну против врагов Христа?»"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "«Вы пришли к нам, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'была изгнана', 'был изгнан' )], и это в то время, как наши пять патриарших тронов пытаются удержать вместе хрупкое христианство? Неужто вы думаете, будто вся [Glossary( 'ойкумена', 'OIKOUMENE_GLOSS' )] поддержит ваши обвинения?»"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "«Неужели [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'оскорбила', 'оскорбил' )] почитание мучеников своим презрением?»"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "«Вы хотите, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'была отвержена', 'был отвержен' )]. Предоставьте свидетельства того, что [Select_CString(petition_target.IsFemale, 'она предавалась', 'он предавался' )] лености, ибо бездействие есть враг души»."
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "«Вы хотите, чтобы мы осудили [Select_CString(petition_target.IsFemale, 'её', 'его' )], словно только [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'унаследовала', 'унаследовал' )] адамов грех? Каждая душа, ступающая в мир, запятнана падением, но церковь не отвергает никого, кроме тех, кто упивается своими грехами»."
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "«Вы пришли требовать правосудия во всём своём великолепии, пока наши святые отцы бродят среди бедняков в простых одеждах? Не лучше ли просто проявить терпение, или [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'совершила', 'совершил' )] слишком тяжкий грех?»"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "«Вы хотите, чтобы [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'лишилась', 'лишился' )] доступа к таинствам. Вы хотите отнять у [Select_CString(petition_target.IsFemale, 'неё', 'него' )] богатства вечной жизни с Христом на небесах? Ведь лишь на земле мы стремимся к нищете»."
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "«Вы хотите, чтобы мы отвергли воина христова со слов [Select_CString(petition_target.IsFemale, 'её', 'его' )] врага?»"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "«Вы хотите использовать святую церковь, чтобы уладить склоку, в которой погрязли вы и [petition_target.GetTitledFirstNameNoTooltip]?»"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n«Вы должны знать, что мы не используем отлучение как оружие земных владык. Мы сами решим, каким должно быть правосудие. Озвучьте свои доводы перед Богом!» — требует [Select_CString(recipient.IsFemale, 'Святая мать', 'Святой отец' )]."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nХотя [recipient.GetFaith.GetReligiousHeadTitle.GetName] не имеет права на пристрастность, очевидно, что [petition_target.GetTitledFirstNameNoTooltip] уже даже в этих священных стенах [Select_CString(petition_target.IsFemale, 'известна', 'известен' )] своей греховной натурой. Нужно осудить [Select_CString(petition_target.IsFemale, 'её', 'его' )] прегрешения."
 petition_head_of_faith.2000.desc.target_clean: "\n\nПохоже, [recipient.GetTitledFirstName] знает, что [petition_target.GetTitledFirstNameNoTooltip] не упивается грехом. Без доказательств порочности, которые можно было бы представить на суд, мне придётся искать иной путь к справедливости."
 OIKOUMENE_GLOSS: "Греческое обозначение обитаемого мира. Ромеи называли #bold ойкуменой#! цивилизованный мир: империю и в целом христианский мир, подчинённый церкви."
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "[petition_target.GetTitledFirstNameNoTooltip] и [Select_CString(petition_target.IsFemale, 'её', 'его' )] [petition_gravest_sin.GetName(petition_target)|l] будут раскрыты перед Богом."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Сказать, чем [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale, 'согрешила', 'согрешил' )] перед Богом."
 petition_head_of_faith.2000.b.finesse: "«У церкви много нужд. Позвольте мне удовлетворить некоторые из них»."
 petition_head_of_faith.2000.c.learning_duel: "Я процитирую малоизвестное писание, и [Select_CString(petition_target.IsFemale, 'порочная', 'порочный' )] [petition_target.GetTitleAsNameNoTooltip|l] окажется в ловушке."
 petition_head_of_faith.2000.d.hook: "Напомнить, что [recipient.GetFaith.ReligiousHeadName] имеет перед вами… определённые обязательства."
 petition_head_of_faith.2000.e.withdraw: "…возможно, разбираться в этом должны не мы, а [petition_target.GetFaith.HighGodName] и [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.5000.e.withdraw: "…возможно, мне нужно подготовиться."
 petition_head_of_faith_hook_committed_tt: "Чтобы устроить это, вы тратите [Concept('hook', 'рычаг влияния')|E]"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip] имеет больше добродетелей, чем грехов"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName] принимает ваши доводы"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName] верит вам"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName] сохраняет недоверие"
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName] считает ваши слова оскорблением"
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName] отмахивается от ваших доводов"
 petition_head_of_faith_affronted_opinion: "Оскорбительный подкуп"
 petition_head_of_faith_affronted_opinion_desc: "Этот персонаж оскорблён попыткой просителя купить религиозное правосудие за золото."
 petition_head_of_faith_dismissed_debate_opinion: "Безразличие к доводам"
 petition_head_of_faith_dismissed_debate_opinion_desc: "Этот персонаж отказал просителю, который исказил церковный закон, но всё равно не сумел убедить его."
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "Искать опущения грехов"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Отправиться к вашему [Concept('head_of_faith', 'главе конфессии')|E] и попросить о снятии [Concept('excommunication', 'отлучения')|E]."
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Вы отправитесь во владение [recipient.GetCapitalLocation.GetName] и попросите, чтобы [recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale, 'сняла', 'снял' )] с вас [Concept('excommunication', 'отлучение')|E]"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "Исповедь"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "«Вы пришли ради отпущения грехов. Поклонялись ли вы идолам, зная, что лишь Писание и покаяние очистят вас?»"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "«Надеюсь, вы пришли молить об отпущении грехов у подножия высеченного из камня креста»."
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "«Богоматерь милосердна, но мы не можем отменить ваше наказание только ради неё»."
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "«Вы вновь хотите приобщиться к божественной литургии. Подумайте о том, что отвратило вас от алтаря и верующих»."
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "«Вам было отказано в доступе к алтарю Христа и причащении его плотью и кровью»."
 petition_head_of_faith.5000.desc.atmosphere_communion: "«Вы отсечены от общины верующих»."
 petition_head_of_faith.5000.desc.atmosphere_confession: "«Таинство исповеди требует перечислить все грехи без утайки»."
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "«Отлучение — лекарство церкви. Это дар, который позволит вам встать на путь истинный и сократить своё пребывание в чистилище»."
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "«Мы храним ключи Петра. Эта власть способна отпустить вам грехи, если вы искренне покаетесь»."
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "«Вы стремитесь к примирению. Следуйте букве закона и соблюдайте декрет»."
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "«Ваш грех в том, что вы нарушили Мир Божий? Пролили ли вы кровь в священный год?»"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "«Если вы подняли крест на словах, но всё равно навредили христианству, то вы однозначно нарушили закон»."
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "«Пять патриарших тронов взирают. Мы не можем легкомысленно даровать отпущение грехов на глазах всей [Glossary( 'ойкумены', 'OIKOUMENE_GLOSS' )]»."
 petition_head_of_faith.5000.desc.atmosphere_dulia: "«Мученики своей кровью заслужили себе место на небесах»."
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "«Бездействие — враг души. Склоняйтесь не только из покаяния, но и показывая готовность к епитимье, молитве и труду»."
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "«Вы рождены во грехе, как и все мы. Зачем отягощать это наследие новыми пороками?»"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "«Наши священники скитаются среди нищих в одних только потрёпанных одеяниях»."
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "«На земле мы стремимся к обету нестяжания. За богатства и титулы не купить доступ к таинствам»."
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "«Вы носили крест на груди, но всё равно оскорбили христианство»."
 petition_head_of_faith.5000.desc.atmosphere_fallback: "«Отпущение грехов не заслужить одним только долгим паломничеством»."
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n«Вы должны знать, что мы не снимаем осуждение для красоты или из лести. Докажите своё покаяние перед лицом Бога!» — требует [Select_CString(recipient.IsFemale, 'Святая мать', 'Святой отец')]."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nНаверняка все в этих священных залах знают, что меня обуревает [petition_gravest_sin.GetName(actor)|l]."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nБез возможности явить глубокую порочность суд, несомненно, поймёт, что наказание сделало своё дело."
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "Покаяться в грехах, ничего не скрывая."
 petition_head_of_faith.5000.b.canon_law: "Настоять на том, что церковный закон требует примирения."
 petition_head_of_faith.5000.c.weep: "Отдать себя на милость суда."
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName] с пониманием вас слушает"
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName] слушает вас с безразличием"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName] принимает вашу исповедь"
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.GetFaith.ReligiousHeadName] не прислушивается к вашим словам"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.GetFaith.ReligiousHeadName] проникается вашим смирением"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.GetFaith.ReligiousHeadName] не проникается вашим смирением"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "Отпущение грехов даровано"
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName|U] встаёт, чтобы даровать милостью божью:\n\n«Встаньте, дитя моё. Вы вновь допущены к причастию. Запрет снят с вашей души»."
 petition_head_of_faith.5020.a: "Славься, [recipient.GetFaith.HighGodName]."
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "Никакого отпущения"
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName|U] встаёт, чтобы вершить божий суд:\n\n"
 petition_head_of_faith.5030.desc.confess: "«Ваша исповедь звучит неубедительно."
 petition_head_of_faith.5030.desc.canon_law: "«Ваша необразованность — отражение вашей души."
 petition_head_of_faith.5030.desc.weep: "«Слёзы — это не покаяние."
 petition_head_of_faith.5030.desc.fallback: "«Вы слишком много о себе возомнили."
 petition_head_of_faith.5030.desc.conclusion: "Наказание остаётся неизменным»."
 petition_head_of_faith.5030.a: "Полагаю, [recipient.GetFaith.HighGodName] явил свою волю через своего слугу."
