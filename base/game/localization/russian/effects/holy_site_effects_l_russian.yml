l_russian:
 make_holy_site_eminent_global: "Священное место [HolySite.GetName] становится [Concept('eminent_holy_site', 'знаменитым святым местом')|E] для #L [FAITH.GetName|l]ой#! конфессии"
 make_holy_site_eminent_third: "$make_holy_site_eminent_global$"
 make_holy_site_eminent_global_past: "Священное место [HolySite.GetName] стало [Concept('eminent_holy_site', 'знаменитым святым местом')|E] для #L [FAITH.GetName|l]ой#! конфессии"
 make_holy_site_eminent_third_past: "$make_holy_site_eminent_global_past$"
 make_holy_site_not_eminent_global: "Священное место [HolySite.GetName] перестанет считаться [Concept('eminent_holy_site', 'знаменитым святым местом')|E] для #L [FAITH.GetName|l]ой#! конфессии"
 make_holy_site_not_eminent_third: "$make_holy_site_not_eminent_global$"
 make_holy_site_not_eminent_global_past: "Священное место [HolySite.GetName] больше не считается [Concept('eminent_holy_site', 'знаменитым святым местом')|E] #L [FAITH.GetName|l]ой#! конфессии"
 make_holy_site_not_eminent_third_past: "$make_holy_site_not_eminent_global_past$"
 remove_holy_site_global: "[HolySite.GetName] больше не считается [Concept('holy_site', 'святым местом')|E] #L [FAITH.GetName|l]ой#! конфессии"
 remove_holy_site_third: "$remove_holy_site_global$"
 remove_holy_site_global_past: "[HolySite.GetName] убирается из списка [Concept('holy_site', 'святых мест')|E] #L [FAITH.GetName|l]ой#! конфессии"
 remove_holy_site_third_past: "$remove_holy_site_global_past$"
 add_holy_site_global: "Священное место [HolySite.GetName] объявляется #L [FAITH.GetName|l]ой#! конфессией [Concept('holy_site', 'святым местом')|E]"
 add_holy_site_third: "$add_holy_site_global$"
 add_holy_site_global_past: "Священное место [HolySite.GetName] было объявлено #L [FAITH.GetName|l]ой#! конфессией [Concept('holy_site', 'святым местом')|E]"
 add_holy_site_third_past: "$add_holy_site_global_past$"
 add_eminent_holy_site_global: "Священное место [HolySite.GetName] объявляется #L [FAITH.GetName|l]ой#! конфессией [Concept('eminent_holy_site', 'знаменитым святым местом')|E]"
 add_eminent_holy_site_third: "$add_eminent_holy_site_global$"
 add_eminent_holy_site_global_past: "Священное место [HolySite.GetName] было объявлено #L [FAITH.GetName|l]ой#! конфессией [Concept('eminent_holy_site', 'знаменитым святым местом')|E]"
 add_eminent_holy_site_third_past: "$add_eminent_holy_site_global_past$"
