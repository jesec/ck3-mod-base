 innovation_heavy_plow: "Тяжелый плуг"
 innovation_heavy_plow_desc: "Быки или лошади могут утянуть ещё более тяжёлые железные плуги, если установить их на колёса и запрячь несколько животных. Эта инновация позволяет нам обрабатывать земли, культивация которых ранее была невозможна или крайне затруднена."
 innovation_heavy_plow_eri: "Система эри"
 innovation_heavy_plow_eri_desc: "Сеть обнесённых валами цистерн захватывает воду во время муссонов и удерживает её на протяжении засушливых месяцев, что позволяет нам сеять, выращивать и пожинать плоды в течение всего года."
 innovation_heavy_plow_transplanting: "Пересадка и прививание"
 innovation_heavy_plow_transplanting_desc: "С помощью знаний о том, как ухаживать за растениями и способствовать их распространения, мы можем значительно увеличить нашу урожайность."
 culture_parameter_stone_forts: "Зданиям «[GetBuildingType('wall_wardens_offices_1').GetName]» требуются [GetTradeGoodType('trade_good_stone').GetNameWithIcon|l], а не [GetTradeGoodCategory('trade_category_carpentry_supplies').GetName|l]"
 culture_parameter_heavy_plow: "Району «[GetDistrictType('grain_district').GetName]» теперь будут требоваться [GetTradeGoodType('trade_good_iron').GetNameWithIcon|l] и [GetTradeGoodCategory('trade_category_beasts_of_burden').GetName|l], а не только [GetTradeGoodType('trade_good_cattle').GetNameWithIcon|l]"
 innovation_prospecting: "Разведка месторождений"
 innovation_prospecting_desc: "Активный и методичный поиск новых рудных жил позволит нам значительно расширить горный промысел в нашей державе."
 innovation_coppicing: "Лесопосадки"
 innovation_coppicing_desc: "Тщательный уход вместе с методичной и организованной вырубкой деревьев позволят нам значительно повысить продуктивность лесозаготовок и сопутствующего производства, например, углежогов и сборщиков хвороста."
 innovation_monasticism: "Монашество"
 innovation_monasticism_desc: "Хотя монастыри придумали не вчера, их стало больше, и они сами стали больше. Там, где раньше были уединённые скиты, теперь возникают целые религиозные общины со своей экономикой и светскими поселениями."
 innovation_craft_ordinances: "Ремесленные постановления"
 innovation_craft_ordinances_desc: "Хотя ремесленники не в восторге от предписаний, они ценят возможность создавать правила для своих отраслей. Все только выиграют от контроля за качеством и ценами."
 innovation_merchant_law: "Торговый закон"
 innovation_merchant_law_desc: "Записав обычаи, лежащие в основе нашей торговли, и навязав следование их букве, мы обеспечим более свободный и более упорядоченный обмен товарами на наших землях."
 innovation_vaulting: "Сводчатые перекрытия"
 innovation_vaulting_desc: "Высокие и изящные своды не только вдохновляют своим видом, но и делают строительство потолков в больших зданиях более безопасным. Теперь наши каменщики тратят меньше камня на возведение сводов, а построенные ими здания простоят дольше."
 innovation_putting_out_system: "Кустарное производство"
 innovation_putting_out_system_desc: "Наличие масштабной организации производства, распространяющейся на каждый дом и каждое домовладение в нашей державе, позволяет нам добиваться куда большей эффективности. Торговцы возьмут на себя закупку сырья и продажу конечного продукта."
 innovation_deep_mining: "Подземная добыча"
 innovation_deep_mining_desc: "Чтобы добывать полезные ископаемые на ранее недоступных глубинах, мы придумали ряд технических решений, включая укреплённые деревом штольни, улучшенное осушение и лебёдки. Эти нововведения позволили нам следовать за рудными жилами глубже, чем кто-либо до нас."
 innovation_pilot_books: "Лоции"
 innovation_pilot_books_desc: "Навигация — дело опасное, и без местных лоцманов большинство кораблей гибли бы у относительно безопасных, но неизвестных берегов. Составление схем всех мысов, отмелей и якорных стоянок, с координатами и расстояниями, поможет нам навсегда сохранить знания, которые могли бы исчезнуть со смертью всего одного человека."
 innovation_pilot_books_portolan: "Портуланы"
 innovation_pilot_books_portolan_desc: "Навигация — дело опасное, и без местных лоцманов большинство кораблей гибли бы у относительно безопасных, но неизвестных берегов. Расчертив карты линиями с координатами по картушке и указав по ним каждый мыс, отмель и якорную стоянку, мы сможем навсегда сохранить знания, которые могли бы исчезнуть со смертью всего одного человека."
 innovation_agronomy: "Агрономия"
 innovation_agronomy_desc: "Обработка земли может быть непростым ремеслом, знания о котором передаются только от одного крестьянина другому. Если собрать эти знания и составить трактаты по сельскохозяйственным культурам и животноводству, мы сможем распространить уже проверенные знания и превратить традиции в методику."
 innovation_bricks: "Кирпичи"
 innovation_bricks_desc: "Хотя кирпичи были известны нашим предкам, знание это уже не столь распространено, как в прошлом. Технология надёжного производства и применения этого простого изготавливаемого строительного материала позволяет возводить дома быстрее и эффективнее."
