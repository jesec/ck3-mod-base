l_french:
 rule_empire_faith_gate: "Titres impériaux réservés aux fois organisées"
 setting_empire_faith_gate_on: "#high Activé#!"
 setting_empire_faith_gate_no_hof_exempt: "#high Activé#!, exempté si sans chef"
 setting_empire_faith_gate_off: "Désactivé"
 setting_empire_faith_gate_on_desc: "Nécessite une [faith|El] [organized|El] et l’approbation du [head_of_faith|El] pour créer des [titles|El] [Concept('empire', 'impériaux')|E]. Affecte le [ruler|El] [feudal|El], [Concept('clan', 'clanique')|E] et [tribal|El]."
 setting_empire_faith_gate_no_hof_exempt_desc: "Nécessite une [faith|El] [organized|El] et l’approbation du [head_of_faith|El] pour créer des [titles|El] [Concept('empire', 'impériaux')|E], mais les [faiths|El] sans [Concept('head_of_faith', 'chef')|El] sont exemptées de l’exigence d’approbation. Affecte le [ruler|El] [feudal|El], [Concept('clan', 'clanique')|E] et [tribal|El]."
 setting_empire_faith_gate_off_desc: "Tout le monde peut créer des [titles|El] [Concept('empire', 'impériaux')|E] selon les conditions habituelles."
 empire_faith_gate_organized_faith_required: "Votre [faith|El] doit être [organized|El] pour créer un [empire|El]"
 empire_faith_gate_hof_spiritual_good_terms: "Doit être en bons termes avec le [head_of_faith|El]"
 empire_faith_gate_hof_temporal_is_hof: "Vous êtes le [head_of_faith|El]"
 empire_faith_gate_hof_temporal_good_terms: "Le [head_of_faith|El] doit avoir une [opinion|El] positive à votre égard"
 empire_faith_gate_powerful_vassals_approve: "La majorité des [powerful_vassals|El] doit avoir une [opinion|El] positive à votre égard #weak ([THIS.Char.MakeScope.ScriptValue('powerful_vassals_positive_opinion_value')|0]/[THIS.Char.MakeScope.ScriptValue('powerful_vassals_count_value')|0])#!"
 empire_faith_gate_contested_legitimacy_applied: "Empire contesté"
 empire_faith_gate_contested_legitimacy_applied_desc: "Les [empires|El] [THIS.Char.Custom('FR_du_Char_U_Pi')][THIS.Char.GetShortUIName] et [SCOPE.sC('efg_other_emperor').Custom('FR_du_Char_U_Pi')][SCOPE.sC('efg_other_emperor').GetShortUIName] rivalisent désormais pour la primauté."
 empire_faith_gate_create_title_contested_warning_1: "@warning_icon! #warning Créer cet [empire|El] vous donnera le [modifier|El] [GetModifier( 'multi_empire_same_faith_penalty_1' ).GetNameWithTooltip|L] dans 3 ans, puisqu’un autre [empire|El] indépendant de votre [faith|El] existe déjà.#!"
 empire_faith_gate_create_title_contested_warning_2: "@warning_icon! #warning Créer cet [empire|El] vous donnera le [modifier|El] [GetModifier( 'multi_empire_same_faith_penalty_2' ).GetNameWithTooltip|L] dans 3 ans, puisque plusieurs [empires|El] indépendants de votre [faith|El] existent déjà.#!"
 empire_faith_gate_create_title_contested_warning_3: "@warning_icon! #warning Créer cet [empire|El] vous donnera le [modifier|El] [GetModifier( 'multi_empire_same_faith_penalty_3' ).GetNameWithTooltip|L] dans 3 ans, puisque plusieurs [empires|El] indépendants de votre [faith|El] existent déjà.#!"
 empire_faith_gate_create_title_contested_warning_1_inline: "\n\n$empire_faith_gate_create_title_contested_warning_1$"
 empire_faith_gate_create_title_contested_warning_2_inline: "\n\n$empire_faith_gate_create_title_contested_warning_2$"
 empire_faith_gate_create_title_contested_warning_3_inline: "\n\n$empire_faith_gate_create_title_contested_warning_3$"
 EXCOMMUNICATION_CONTESTED_EMPIRE: "Il y a plusieurs [empires|El] de notre [faith|El] : $VALUE|=+0$"
 efg_contested_empire_rivalry: "Un nouvel [empire|El] de la même [faith|El] a déclenché une rivalité."
 efg_contested_empire_rivalry_corresponding: "Un nouvel [empire|El] de la même [faith|El] a déclenché une rivalité."
 dissolve_empire_war: "Dissoudre l’empire"
 DISSOLVE_EMPIRE_WAR_NAME: "Dissoudre l’empire [DEFENDER.Custom('FR_du_Char_Pi')][DEFENDER.GetShortUINameNotMe]"
 dissolve_empire_war_desc: "Déclarer la guerre pour dissoudre l’[empire|El] d’un [ruler|El] [excommunicated|El] de notre [faith|El]."
 dissolve_empire_war_victory_desc: "L’[emperor|El] [excommunicated|El] est dépouillé de son [title|El] [Concept('empire', 'impérial')|E], qui est détruit."
 dissolve_empire_war_victory_desc_defender: "L’[empire|El] a été dissout. Le [title|El] [Concept('empire', 'impérial')|E] est détruit."
 dissolve_empire_war_white_peace_desc: "La guerre s’achève de manière indécise. Aucun des deux camps n’a l’avantage."
 dissolve_empire_war_white_peace_desc_defender: "La guerre pour la dissolution de l’[empire|El] s’achève sans résolution."
 dissolve_empire_war_defeat_desc: "La tentative de dissoudre l’[empire|El] a échoué."
 dissolve_empire_war_defeat_desc_attacker: "Notre tentative de dissoudre l’[empire|El] a échoué. Nous en subissons les conséquences."
 dissolve_empire_war_defeat_desc_defender: "La tentative de dissoudre l’[empire|El] a été rejetée."
 dissolve_empire_war_invalidated_no_excommunication: "Le défenseur n’est plus [excommunicated|El]."
 dissolve_empire_war_invalidated_no_empire: "Le défenseur ne détient plus de [title|El] [Concept('empire', 'impérial')|E]."
 game_concept_dissolve_empire_casus_belli: "$dissolve_empire_war$"
 game_concept_dissolve_empire_casus_belli_desc: "Un [casus_belli|El] qui permet à un [ruler|El] de la même [faith|El] de déclarer la [war|El] à un [emperor|El] [excommunicated|El] et de détruire ce [title|El] [Concept('empire', 'impérial')|E] en cas de victoire."
 multi_empire_same_faith_penalty_1: "Primauté contestée"
 multi_empire_same_faith_penalty_1_desc: "Un autre [emperor|El] de la même [faith|El] conteste la primauté de notre [empire|El]"
 multi_empire_same_faith_penalty_2: "Primauté contestée"
 multi_empire_same_faith_penalty_2_desc: "Des [emperors|El] de la même [faith|El] contestent la primauté de notre [empire|El]"
 multi_empire_same_faith_penalty_3: "Primauté partagée"
 multi_empire_same_faith_penalty_3_desc: "Des [emperors|El] de la même [faith|El] partagent la primauté avec notre [empire|El]"
 action_efg_request_excommunication: "@hof_icon! Il y a trop d’empires de votre foi"
 action_efg_request_excommunication_label: "@hof_icon! Il y a trop d’empires de votre foi"
 action_efg_request_excommunication_desc: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName|U] gouverne un [empire|El] rival de votre [faith|El] et conteste votre prétention d’être le seul vrai [emperor|El].\n\n#help Demandez à votre [head_of_faith|El], [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName], de l’excommunier. Un empereur [excommunicated|El] peut être attaqué avec le [casus_belli|El] visant à [dissolve_empire_casus_belli|El], ce qui vous permet de détruire son [empire|El].#!"
 action_efg_request_excommunication_click: "#I Cliquer pour afficher $request_excommunication_interaction$#!"
 action_efg_request_excommunication_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNoTooltip]"
 action_efg_request_excommunication_combined_group_name: "@hof_icon! Il y a trop d’empires de votre foi"
 action_efg_request_excommunication_combined_group_label: "@hof_icon! Il y a trop d’empires de votre foi"
 action_efg_request_excommunication_combined_group_description: "Plusieurs [emperors|El] rivaux de votre [faith|El] contestent votre prétention d’être le seul vrai [emperor|El].\n\n#help Demandez à votre [head_of_faith|El], [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName], de les excommunier. Un empereur [excommunicated|El] peut être attaqué avec le [casus_belli|El] visant à [dissolve_empire_casus_belli|El], ce qui vous permet de détruire son [empire|El].#!"
 empire_faith_gate_panel_organized_faith: "Vous avez une [faith|El] [organized|El]"
 empire_faith_gate_panel_hof_approval: "Vous avez l’approbation du [head_of_faith|El]"
 empire_faith_gate_panel_vassals_approve: "La majorité de vos [powerful_vassals|El] vous soutient"
 empire_faith_gate_reformation_piety_level: "Le [piety_level|El] doit être au moins [GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]"
 empire_faith_gate_reformation_tribal_authority: "Doit avoir l’$game_concept_absolute_tribal_authority|l$"
 empire_faith_gate_reformation_holy_site: "Au moins trois [holy_sites|El] sont détenus par des personnages de cette [faith|El]"
 empire_faith_gate.0002.t: "Le seul pouvoir impérial"
 empire_faith_gate.0002.desc: "[efg_primary_rival.Custom('FR_le_Char_Pi')|U][efg_primary_rival.GetTitledFirstName] revendique une dignité impériale qui ne devrait revenir qu’à moi seul[ROOT.Char.Custom('FR_E')]. Si je laisse faire cela, les fidèles finiront bientôt par douter de ma [legitimacy|El]."
 empire_faith_gate.0002.a: "Que l’on fasse savoir que son empire ne survivra pas au mien."
 empire_faith_gate.0002.b: "Notre foi n’a qu’un seul véritable empereur. Moi."
 empire_faith_gate.0002.c: "Je frapperai au moment opportun."
 efg_contested_wrath: "Propagande de chevalier"
 efg_contested_wrath_desc: "Utiliser nos chevaliers pour faire valoir notre légitimité impériale face à un empereur rival motive nos guerriers et nous vaut le respect des masses."
 efg_divine_mandate: "Revendications divines"
 efg_divine_mandate_desc: "Proclamer une autorité divine qui surpasse tous les rivaux terrestres, les fidèles se rallient à nous."
 efg_contested_patience: "Renforcement patient"
 efg_contested_patience_desc: "En nous recentrant sur nous-mêmes, notre pays se renforce tandis que nous attendons le moment propice pour passer à l’action."
