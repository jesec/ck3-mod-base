l_french:
 msg_passive_learned_tenet_abroad_desc: "En observant [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstName] du [rite|El] [passive_learn_source.GetRite.GetAdherentName] de [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], vous avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E] du [core_tenet|El] [passive_learn_tenet.GetBaseName]."
 msg_passive_learned_doctrine_abroad_desc: "En observant [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstName] du [rite|El] [passive_learn_source.GetRite.GetAdherentName] de [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], vous avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E] de la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]."
 msg_passive_learned_rite_abroad_desc: "Via [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], vous avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E] des [core_tenets|El] et [doctrines|El] du [rite|El] [passive_learn_source.GetRite.GetAdherentName]."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "En [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], vous avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E] du [core_tenet|El] [passive_learn_tenet.GetBaseName] du [rite|El] [passive_learn_rite.GetAdherentName]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "En [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], vous avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E] de la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )] du [rite|El] [passive_learn_rite.GetAdherentName]."
 rite_travel_events.1000.t: "Un voyageur [passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "L’aube pointe et un voyageur [passive_learn_rite.GetAdherentName] vient nous rejoindre autour du feu.\n\nAu fil de la soirée, nous partageons des verres [passive_learn_source.Custom('RegionalDrink')], de la viande [passive_learn_source.Custom('RegionalEdibleMeat')] et des histoires. [passive_learn_source.Custom('FR_IlElle')|U] nous parle des enseignements sacrés de son peuple et de la manière dont le rite [passive_learn_rite.GetAdherentNameNoTooltip] est vécu et pratiqué. Chaque mot est empreint de conviction."
 rite_travel_events.1000.a: "C’est très instructif."
 rite_travel_events.1000.b: "[passive_learn_source.GetSheHe|U] devrait me rejoindre."
 rite_travel_events.1000.c: "Je ne veux pas entendre ce genre d’hérésie."
 rite_travel_events.2000.t: "Révélation"
 rite_travel_events.2000.desc: "Alors que je parcours [location.Custom('TerrainTypeProvince')|l] de [location.GetName], je tombe sur une foule rassemblée.\n\n[Select_CString(passive_learn_source.IsFemale,'Une prédicatrice','Un prédicateur')] parle de quelque chose appelé « [passive_learn_tenet.GetBaseName|l] ». Je n’en ai jamais entendu parler, mais ses paroles trouvent un écho en moi.\n\nAlors que j’avais l’intention de passer mon chemin, je reste pour écouter.\n\nLa vérité... m’est révélée."
 rite_travel_events.2000.a: "C’est ce qui est attendu de moi par [ROOT.Char.GetFaith.HighGodName]."
 rite_travel_events.2000.b: "Je ne suis pas [Select_CString(ROOT.Char.IsFemale,'païenne','païen')] !"
