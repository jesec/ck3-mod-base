 LAW_CHANGE_WINDOW_ASSEMBLY_APPROVE_TT: "#T Approuve la modification de la loi#!\n[Character.Custom('FR_le_Char_U_Pi')|U][Character.GetShortUIName] soutient, ou du moins ne peut pas s’opposer, à ce changement.\n\nLes raisons peuvent être :\n$BULLET_WITH_TAB$[Character.Custom('FR_IlElle')|U] a une approbation positive de cette loi\n$BULLET_WITH_TAB$[Character.Custom('FR_IlElle')|U] est [Concept('cowed','terrifié')|E][Character.Custom('FR_E')|E] par vous\n$BULLET_WITH_TAB$[Character.Custom('FR_IlElle')|U] est [Concept('prison','emprisonné')|E][Character.Custom('FR_E')|E]"
 LAW_CHANGE_WINDOW_ASSEMBLY_OPPOSE_TT: "#T S’oppose à la modification de la loi#!\n[Character.Custom('FR_le_Char_U_Pi')|U][Character.GetShortUIName] s’opposera à ce changement de loi.\n\nAfin qu’[Character.Custom('FR_IlElle')] approuve, [Character.Custom('FR_IlElle')] doit soit :\n$BULLET_WITH_TAB$Avoir une approbation positive de cette loi\n$BULLET_WITH_TAB$Être [Concept('cowed','terrifié')|E][Character.Custom('FR_E')|E] par vous\n$BULLET_WITH_TAB$Être [Concept('prison','emprisonné')|E][Character.Custom('FR_E')|E]"
