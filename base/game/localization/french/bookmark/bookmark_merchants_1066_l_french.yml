l_french:
 bm_1066_merchants: "Canaux commerciaux"
 bm_1066_merchants_desc: "Pour qu’un pays prospère, il faut non seulement qu’il subvienne à ses propres besoins, mais aussi qu’il assure la circulation des marchandises. Un dirigeant ne remporte pas de grandes campagnes militaires grâce à son droit de naissance : c’est l’or qui permet d’acquérir armes et provisions, et c’est l’aide étrangère qui renforce ses armées.\n\nDerrière chaque échange commercial, chaque accord conclu, se cachent des marchands qui font circuler caravanes et navires le long de routes légendaires. Et s’ils n’obtiennent pas la reconnaissance qu’ils méritent, ils se feront une place en donnant naissance à un nouveau type de cité, gouvernée par ses propres citoyens.\n\n#bold Lorsque la richesse deviendra la mesure du pouvoir, permettrez-vous à votre famille de dominer le marché et de diriger un empire commercial durable ?#!"
 bookmark_merchants_domenico_contarini: "Domenico Contarini"
 bookmark_merchants_domenico_contarini_subheading: "Doge de Venise"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "ibn Jarada"
 bookmark_merchants_ibn_jarada_subheading: "Marchand de Bagdad"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "Sūn Zhōng"
 bookmark_merchants_sun_zhong_subheading: "Marchand de Mingzhou"
 bookmark_merchants_sun_zhong_desc: "Le port de Mingzhou est l’endroit où la dynastie Song s’ouvre à la mer de l’Est et Sūn Zhōng est chargé de le maintenir animé. La soie et la porcelaine quittent ses entrepôts pour le Japon et Goryeo, et, en échange, il fait importer de l’encens et de l’argent. Les fonctionnaires qui taxent les activités ont appris qu’un cadeau qui arrive à point nommé coûte moins cher qu’un rapport.\n\n#bold La rive est de la Route de la Soie est un port, pas une route à caravanes. Pourrez-vous faire en sorte que le nom de Sūn soit connu de toute cour ?#!"
 bookmark_merchants_vitale_faliero: "Vitale Faliero"
 bookmark_merchants_vitale_faliero_subheading: "Patricien de Venise"
 bookmark_merchants_vitale_faliero_desc: "Les Faliero comptent parmi les Maisons marchandes les plus ambitieuses de Venise, et Vitale a étendu son empire plus loin vers l’Est que ses rivaux n’ont osé le faire. Les routes commerciales byzantines, la pression des Normands dans l’Adriatique et des concurrents envieux au sein des conseils municipaux mettent la Maison sous pression de toutes parts.\n\n#bold Venise se trouve au carrefour de deux mondes. Parviendrez-vous à mener la Maison Faliero à la suprématie sur ces deux mondes ?#!"
 bookmark_merchants_wuhsha_al_dallala: "Wuhsha dit le Courtier"
 bookmark_merchants_wuhsha_al_dallala_subheading: "Courtier cairote"
 bookmark_merchants_wuhsha_al_dallala_desc: "Une femme aussi riche que Wuhsha al-Dallala surveille autant sa fortune que ses ennemis.\n\nSon caractère indépendant lui a valu d’être expulsée de la synagogue, mais Wuhsha est patiente et attend le bon moment pour se venger de ceux qui l’ont trahie.\n\n#bold Réussirez-vous à tirer parti des dettes de vos détracteurs pour les humilier ?#!"
 bookmark_merchants_greek_salvidi_1: "Hillel Salvidi"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "Abu Said"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "Fils de Wuhsha"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "Nattal Sahu"
 bookmark_merchants_nattal_sahu_subheading: "Prince-marchand de Delhi"
 bookmark_merchants_nattal_sahu_desc: "Sur les marchés de Yoginipur, le nom de Sahu jouit d’une grande renommée. En tant que chef de la communauté marchande jaïne de Delhi et conseiller de confiance du roi Anangpal II des Tomara, Nattal a tissé un réseau commercial qui s’étend des ports occidentaux jusqu’aux marchés du Bengale.\n\n#bold Serez-vous capable, avec la confiance d’un roi et la ruse d’un marchand, de créer quelque chose qui leur survivra à tous deux ?#!"
 bookmark_merchants_new_merchant_company: "Personnage personnalisé"
 bookmark_merchants_new_merchant_company_subheading: "Marchand de la Route de la Soie"
 bookmark_merchants_new_merchant_company_desc: "La Route de la Soie n’appartient ni aux empereurs ni aux rois. Elle appartient à ceux qui ont le courage de la parcourir.\n\nFondez votre propre compagnie commerciale au carrefour de l’Orient et de l’Occident. Bâtissez un empire commercial, caravane après caravane, et tissez des liens entre les bazars de Samarcande et les ports de la Méditerranée.\n\n#bold Votre nom de famille résonnera-t-il dans une centaine de villes ?#!"
