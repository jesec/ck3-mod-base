 bm_1178_merchants: "Guelfes et gibelins"
 bm_1178_merchants_desc: "Le conflit opposant les guelfes aux gibelins a mis du temps à se déclarer. Tout a commencé avec la crise d’investiture de la fin du XIe siècle, et le désaccord couve maintenant depuis près d’un siècle.\n\nAvec Frédéric Barberousse comme empereur, ce conflit a pris de l’importance, divisant toute l’Italie. Les gibelins se rangent du côté de l’empereur, tandis que les guelfes soutiennent le pape, à Rome.\n\n#bold Le conflit fait rage aussi bien au sein des républiques italiennes qu’entre elles. Choisissez votre camp et menez-le à la victoire.#!"
 bookmark_merchants_1178_marco_sanudo: "Marco Sanudo"
 bookmark_merchants_1178_marco_sanudo_subheading: "Patricien de Venise"
 bookmark_merchants_1178_enrico_dandolo: "Enrico Dandolo"
 bookmark_merchants_1178_marco_sanudo_desc: "La famille Sanudo est l’une des plus anciennes familles de la noblesse vénitienne et serait liée à la légendaire famille Candiano, dont beaucoup de membres furent doges à son apogée.\n\nEncore enfant, Marco est le chef de la maison depuis la mort de son père. Il est proche de son oncle Enrico Dandolo, l’homme que l’on connaîtra plus tard comme l’organisateur de la quatrième croisade.\n\n#bold Serez-vous capable d’accomplir votre destin et de devenir duc de l’archipel ?#!"
 bookmark_merchants_1178_humbert_savoy: "Humbert III de Savoie"
 bookmark_merchants_1178_humbert_savoy_subheading: "Comte de Savoie #b #bol (guelfe)#!#!"
 bookmark_merchants_1178_thomas_savoy: "Thomas"
 bookmark_merchants_1178_humbert_savoy_desc: "Comte de Savoie, Humbert a prouvé sa piété en faisant un généreux don aux monastères locaux et en se retirant temporairement de la vie séculière après la mort de sa troisième épouse.\n\nAllié des guelfes, il est en désaccord avec Frédéric Barberousse, et ses terres furent confisquées et pillées.\n\n#bold Parviendrez-vous à protéger les terres savoyardes de l’empereur ?#!"
 bookmark_merchants_1178_guido_guerra: "Guido Guerra III"
 bookmark_merchants_1178_guido_guerra_subheading: "Comte de Casentino #color_yellow #bol (gibelin)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "Rinaldo"
 bookmark_merchants_1178_guido_guerra_desc: "Les Guidi sont comtes de l’Arno supérieur depuis des siècles et peu de maisons toscanes disposent d’une lignée plus ancienne.\n\nToute sa vie, Guido Guerra a servi l’empire : il a participé au siège de Milan, et ses châteaux, droits et mines sur les deux versants des Apennins résultent du privilège accordé par Frédéric Barberousse.\n\n#bold Pourrez-vous faire entrer votre comté dans l’histoire ?#!"
 bookmark_merchants_1178_speronella_dalesmanni: "Speronella Dalesmanni"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Patricienne de Padoue #b #bol (guelfe)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "Ezzelino III de Romano"
 bookmark_merchants_1178_pietro_iii: "Pietro Traversari"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "Adolescente, Speronella fut enlevée par le vicaire impérial de Padoue, Pagano della Torre. Lorsqu’elle fut libérée par son frère, le vicaire fut renversé et la ville de Padoue devint une commune libre.\n\n#bold En tant que femme libre, parviendrez-vous à transformer votre histoire en pouvoir politique ou en fortune ?#!"
 bookmark_merchants_1178_konrad_urslingen: "Conrad d’Urslingen"
 bookmark_merchants_1178_konrad_urslingen_subheading: "Duc de Spolète #color_yellow #bol (gibelin)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "Jutta"
 bookmark_merchants_1178_konrad_urslingen_desc: "En tant que jeune duc allemand dirigeant un duché italien au gré de l’empereur, Conrad a fait de Spolète le cœur de la péninsule où toutes les routes se croisent. Son autorité dépend de la faveur de l’empereur, mais ce dernier se trouve très loin, de l’autre côté des Alpes.\n\n#bold Le cœur de la péninsule italienne sera-t-il vôtre, ou le peuple vous rejettera-t-il ?#!"
