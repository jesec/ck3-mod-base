l_french:
 great_project_type_pam_cathedral_01: "Ériger une $building_type_great_project_cathedral_01|l$"
 great_project_type_pam_cathedral_01_desc: "Placez cette croix resplendissante au sommet de murs de pierre solides, au sommet de dômes majestueux et de hautes tours ! Faites descendre sur Terre la lumière merveilleuse des Cieux, et qu’elle illumine le trône et l’autel d’un prélat sacré.\n\nAprès des années de travail dévoué, un grand phare éclairera les fidèles, qu’ils soient proches ou lointains."
 great_project_type_pam_cathedral_02: "Ériger une $building_type_great_project_cathedral_02|l$"
 great_project_type_pam_cathedral_02_desc: "Que s’élèvent les arcs brisés et que resplendissent les vitraux !\n\nÀ l’instar de Lazare, cette noble cathédrale renaîtra pour nous guider vers une nouvelle ère."
 great_project_type_pam_cathedral_03: "Ériger une $building_type_great_project_cathedral_03|l$"
 great_project_type_pam_cathedral_03_desc: "Puissent les ornements de pierre ajourée et les volutes sculptées former une couronne de feu sacré annonçant un nouveau règne pour ce glorieux édifice !\n\nUn vaste agrandissement couronnera la [GetBuilding('great_project_cathedral_02').GetName|Vl] existante pour en faire une [GetBuilding('great_project_cathedral_03').GetName|Vl], et ses flèches guideront les fidèles jusqu’à la fin des temps."
