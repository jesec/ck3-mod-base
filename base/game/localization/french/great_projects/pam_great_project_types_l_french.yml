 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$ : lumière peinte au-dessus de [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.desc: "« #EMP Ce qui brille s’unit brillamment à ce qui brille, et brillante sera l’œuvre noble qui s’imprégnera de cette nouvelle lumière#! », déclare [religion_buddy.Custom('FR_le_Char_Pi')][religion_buddy.GetTitledFirstName] en posant son regard sur le verre taillé qui resplendit au soleil.\n\n[glazier.Custom('FR_LeLa')|U] vitrailliste, [glazier.Custom('FR_le_Char_Pi')][glazier.GetTitledFirstName], a disposé des fragments de [Glossary('verre coloré','POT_METAL_GLOSS')] sur des tables blanchies à la chaux afin que nous puissions mieux examiner les motifs possibles.\n\n« Je tiens à préciser que cette grande fenêtre sera visible aussi bien depuis la nef que depuis l’ensemble de [province.GetNameNoTooltip] ; elle doit représenter... »"
 pam_great_projects_events.0003.a: "Un arbre de Jessé qui confirme la légitimité de la Maison [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.a.flavor: "[Glossary('Arbre de Jessé','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fera la [dynasty_prestige|El]@dynasty_prestige_icon! des membres de la [dynasty|El] qui s’y rendront en tant que chefs de [travel|El]"
 pam_great_projects_events.0003.b: "Un panneau des donateurs sur lequel figurent mon portrait et mes armoiries."
 pam_great_projects_events.0003.b.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira du [prestige|El]@prestige_icon! aux visiteurs"
 pam_great_projects_events.0003.c: "Des scènes de miracles afin d’attirer les fidèles venus de loin."
 pam_great_projects_events.0003.c.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira une [Concept('trait_level_track_xp', 'expérience')|El] augmentée pour le [trait|El] de [GetTrait('pilgrim').GetName( GetNullCharacter )|l]"
 pam_great_projects_events.0003.d: "Un vitrail marial, devant lequel se trouve une lampe perpétuelle."
 pam_great_projects_events.0003.d.flavor: "Nous laisserons allumée une lampe à huile et des bougies devant l’image [blessed_mary.Custom('FR_du_Char_Pi')][blessed_mary.GetTitledFirstName] sur le vitrail."
 pam_great_projects_events.0003.d.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira de la [stress_loss|El]@stress_loss_icon! et de l’[spiritual_fulfillment|El]"
 pam_great_projects_events.0003.d.dulia.tt: "Avoir la [GetTenetType('tenet_dulia').GetBaseName|l] comme [personal_tenet|El] procure un plus grand [spiritual_fulfillment|El] pendant la visite"
 pam_great_projects_events.0003.e: "Un cycle de scènes représentant le martyre infligé par un roi."
 pam_great_projects_events.0003.e.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira de la [piety|El]@piety_icon! supplémentaire aux visiteurs zélés et une [stress_loss|El]@stress_loss_icon!"
 pam_great_projects_events.0003.e.owner_msg.title: "Martyre dans le verre"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.Custom('FR_le_Char_Pi')|U][contributor.GetTitledFirstName] a commandé une série de vitraux sur le thème du martyre pour la [grand_cathedral|El]. Ce thème vous inspire une dévotion encore plus grande."
 TREE_OF_JESSE_GLOSS: "L’Arbre de Jessé représente l’ascendance du Christ, qui s’élève à partir de la figure allongée de Jessé, père de David. Les vitraux des églises représentaient la lignée royale biblique en relation avec la dynastie régnante, affirmant ainsi la royauté de droit divin. On en trouve des exemples majeurs à Chartres et à Saint-Denis."
 POT_METAL_GLOSS: "Le verre coloré dans la masse est teinté dans le creuset de fusion par l’ajout d’oxydes métalliques au mélange, de sorte que la couleur traverse toute l’épaisseur du panneau au lieu de rester en surface. Les maîtres vitraillistes découpaient ensuite les feuilles de verre déjà refroidies et les disposaient sur des planches blanchies à la chaux afin de vérifier comment la lumière les traverserait avant de les assembler pour former le vitrail."
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$ : la première pierre posée"
 pam_great_projects_events.0005.desc.intro: "La première pierre est posée ! Tout comme un chêne naît d’un gland, le siège [owner.Custom('FR_du_Char_Pi')][owner.GetTitledFirstName] deviendra un monument édifiant. Chaque pierre et chaque poutre rayonneront de la gloire [ROOT.Char.GetFaith.HighGodNamePossessive] pour tous les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de [owner.GetPrimaryTitle.GetNameNoTier] et de toute la chrétienté.\n\nLa générosité de [Select_CString(founder.IsFemale,'sa fondatrice','son fondateur')] – [Select_CString(founder.IsLocalPlayer,'moi',founder.GetFirstName)] – dans le financement de cette construction résonnera dans le son des cloches et sera sur les lèvres de chaque croyant."
 pam_great_projects_events.0005.desc.contributor: "\n\nIl convient notamment de mentionner la contribution [optional_contributor.Custom('FR_du_Char_Pi')][optional_contributor.GetTitledFirstName] ([contribution.GetName|l]) qui immortalisera notre [cathedral_building.GetName]."
 pam_great_projects_events.0005.desc.outro: "Que ce grand projet commence !"
 pam_great_projects_events.0005.a: "« Nos enfants verront ce rêve devenir réalité. »"
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$ : agencée selon l’ordre divin"
 pam_great_projects_events.0006.desc.intro_architect: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('architect'))] [architect.GetFirstName] me fait remarquer"
 pam_great_projects_events.0006.desc.intro_no_architect: "Je contemple"
 pam_great_projects_events.0006.desc.intro: "une série de piquets en bois, entre lesquels une corde tendue dessine le contour d’une immense croix : une vision du futur édifice en forme de croix."
 pam_great_projects_events.0006.desc.steward_founder: "\n\nJ’ai vu ce procédé pendant mes études !\n\n« Vous employez sûrement $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n« Mais comment planifie-t-on un bâtiment aussi grandiose ? » demandé-je."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n« Nous employons $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "la méthode [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')] ! Le Seigneur nous a accordé l’ordre divin ; à l’aide d’une équerre, nous pouvons extrapoler les proportions d’un édifice plus grandiose que n’importe quel autre. »"
 pam_great_projects_events.0006.desc.foundations: "\n\nJe vois que le creusement des fondations va bientôt commencer."
 pam_great_projects_events.0006.a: "Creusez une crypte pour les ancêtres de la Maison [founder.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0006.a.tt: "Une [GetDomicileBuilding('cathedral_crypt_01').GetName|V] est construite dans [Select_CString(owner.IsLocalPlayer,'votre ','l’')][cathedral_complex|El][owner.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')], afin d’honorer la [dynasty|El] [founder.GetDynastyName]"
 pam_great_projects_events.0006.b: "Agrandissez la nef pour accueillir les pèlerins."
 pam_great_projects_events.0006.b.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira plus d’[Concept('trait_level_track_xp', 'expérience')|E] de [GetTrait('pilgrim').GetName( GetNullCharacter )|l] et de la [piety|El]@piety_icon! pour les pèlerins qui la visitent"
 pam_great_projects_events.0006.c: "Seul Dieu peut déterminer le cours des événements."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#! — en latin, « selon le carré ». Les maîtres maçons du Moyen Âge traçaient les plans des bâtiments à l’aide de systèmes simples de proportions. Ils utilisaient le rapport entre le côté d’un carré et sa diagonale. Un rectangle dont les deux côtés correspondaient à ces deux longueurs était considéré comme présentant une forme harmonieuse. À partir de cette unité de base, le maçon pouvait déduire une succession de carrés et de rectangles de dimensions croissantes ou décroissantes, en veillant à ce que chaque partie du plan s’articule harmonieusement avec les autres."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$ : les côtes palpitantes des cieux"
 pam_great_projects_events.0007.desc.intro_architect: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('architect'))] [architect.GetFirstName] me guide à travers une multitude de poutres. L’échafaudage de la cathédrale forme à lui seul une sorte d’église de bois qui soutient les maçons à l’œuvre sur la voûte de pierre."
 pam_great_projects_events.0007.desc.intro_no_architect: "Je marche au milieu d’une multitude de poutres. L’échafaudage de la cathédrale forme à lui seul une sorte d’église de bois qui soutient les maçons à l’œuvre sur la voûte de pierre."
 pam_great_projects_events.0007.desc.architect: "\n\n« Une fois achevées, ces voûtes protégeront les fidèles des intempéries et porteront nos prières jusqu’aux cieux. »"
 pam_great_projects_events.0007.desc.architect_says: "dit-[architect.GetSheHe]."
 pam_great_projects_events.0007.desc.outro: "\n\nAlors que je pose mon regard sur une travée de voûte achevée, elle me rappelle les côtes du grand poisson qui a avalé Jonas. La gloire de la Maison de Dieu est telle qu’elle peut nous transporter sous la mer ou jusqu’aux étoiles."
 pam_great_projects_events.0007.a: "Décorez les voûtes d’un ciel étoilé."
 pam_great_projects_events.0007.a.tt: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira plus d’[Concept('trait_level_track_xp', 'expérience')|El] pour le [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0007.b: "Prêchez un sermon sur la repentance, comme celui de Jonas."
 pam_great_projects_events.0007.b.tt: "Votre [faith|El] gagne #P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#!@fervor_icon! en [fervor|El]"
 pam_great_projects_events.0007.c: "Que les maçons continuent leur travail."
 fervor_gain_cathedral_jonah_sermon: "Sermon sur la repentance prononcé pendant la construction de la [grand_cathedral|El]"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$ : faire résonner la voix de Dieu"
 pam_great_projects_events.0008.desc.intro: "Les travaux avancent bien, mais la cathédrale manque d’une voix capable de rassembler les fidèles de tout le pays."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName] me dit qu’il faut fondre une grande cloche en bronze !"
 pam_great_projects_events.0008.desc.no_architect: "\n\nIl faut fondre une cloche !"
 pam_great_projects_events.0008.desc.need_bell: "Une entreprise risquée et coûteuse ; les coffres de [founder.GetPrimaryTitle.GetNameNoTier] se remettent encore à peine du coût des seules matières premières."
 pam_great_projects_events.0008.desc.plague_named: "\n\nMalheureusement, le fondeur de cloches est décédé lors de l’effroyable [epidemic.GetName]."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nMalheureusement, le fondeur de cloches est décédé lors de la récente épidémie."
 pam_great_projects_events.0008.desc.outro: "Son fils [bell_maker_son.GetFirstName] m’assure que son père lui a confié le secret sur son lit de mort et qu’il est capable de fondre la cloche."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName], [Select_CString(bell_maker_son.IsFemale,'une jeune forgeronne','un jeune forgeron')] de bronze [Select_CString(bell_maker_son.IsFemale,'ambitieuse','ambitieux')] qui a appris son métier auprès d’un maître local, se présente à nous. [bell_maker_son.Custom('FR_IlElle')|U] a hâte de faire ses preuves en forgeant une cloche digne de la [cathedral_building.GetName] de [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.a: "S’il n’y parvient pas, je le tuerai."
 pam_great_projects_events.0008.a.tt: "Si la fonte de la cloche échoue, vous exécuterez [bell_maker_son.Custom('FR_le_Char_U_Pi')][bell_maker_son.GetShortUIName]"
 pam_great_projects_events.0008.belltower_may.tt: "Un [GetDomicileBuilding('cathedral_belltower_02').GetName|Vl] pourrait être construit dans l’[cathedral_complex|El] [owner.Custom('FR_du_Char_U_Pi')][owner.GetShortUIName]"
 pam_great_projects_events.0008.aa: "S’il échoue, je l’écorcherai vif."
 pam_great_projects_events.0008.b: "Il pourrait être un instrument du Seigneur."
 pam_great_projects_events.0008.b.tt: "Vous faites confiance [bell_maker_son.Custom('FR_au_Char_U_Pi')][bell_maker_son.GetShortUIName] pour qu’il fonde la cloche"
 pam_great_projects_events.0008.b.flavor: "David n’était-il pas un jeune berger lorsqu’il a tué Goliath ?"
 pam_great_projects_events.0008.c: "Choisir une valeur sûre, même s’il n’est pas le fils d’un maître."
 pam_great_projects_events.0008.duel.success: "La coulée s’est bien déroulée ! Un [GetDomicileBuilding('cathedral_belltower_02').GetName|Vl] sera construit dans l’[cathedral_complex|El] [owner.Custom('FR_du_Char_U_Pi')][owner.GetShortUIName]"
 pam_great_projects_events.0008.duel.failure: "La fonte échoue... Vous devez décider comment réagir"
 pam_cathedral_bell_casting_duel: "[learning|E] [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUIName]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U] :\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U] :\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U] :\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U] :\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$ : Et Dieu se fit entendre"
 pam_great_projects_events.0009.desc.body: "Je regarde [bell_maker_son.GetFirstName] courir dans tous les sens pour coordonner le travail des ouvriers.\n\n[bell_maker_son.Custom('FR_IlElle')|U] ne cesse de contester les méthodes de l’ancienne équipe de son père, imposant ses propres choix quant à l’emplacement de la fosse, à l’argile à utiliser pour le moule et à la conduite de la cuisson des fours."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] et moi regardons [bell_maker_son.GetFirstName] courir dans tous les sens pour coordonner le travail des ouvriers.\n\n[bell_maker_son.Custom('FR_IlElle')|U] ne cesse de contester les méthodes de l’ancienne équipe de son père, imposant ses propres choix quant à l’emplacement de la fosse, à l’argile à utiliser pour le moule et à la conduite de la cuisson des fours."
 pam_great_projects_events.0009.desc.success_end: "\n\nLe bronze en fusion s’écoule dans le moule comme guidé par la main de Dieu, et en ressort parfaitement formé. La cloche est alors hissée et fait retentir un appel clair et puissant à tous les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] :\n\n« Venez dans la maison du Seigneur ! »"
 pam_great_projects_events.0009.a: "Que chacun en [province.GetNameNoTooltip] entende la voix de Dieu."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$ : un présage de malheur !"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nLe bronze en fusion hurle dans le moule, mais en ressort parfaitement formé. La cloche est alors hissée et tirée en arrière. Mais lorsque le battant frappe la partie sonore, seul un bruit sourd retentit, suivi d’un craquement. Un présage de malheur !"
 pam_great_projects_events.0010.a: "Les promesses doivent être tenues."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.Custom('FR_le_Char_U_Pi')|U][bell_maker_son.GetShortUIName|U] est exécuté[bell_maker_son.Custom('FR_E')]"
 pam_great_projects_events.0010.b: "Les fissures dans la cloche constituent une punition suffisante."
 pam_great_projects_events.0010.b.faith: "Le Seigneur a encore des projets pour lui."
 pam_great_projects_events.0010.c: "Fondez le bronze et forgez quelque chose de plus tranchant."
 pam_great_projects_events.0010.c.tt: "La cloche fissurée est transformée en un instrument de torture ; [bell_maker_son.Custom('FR_le_Char_U_Pi')][bell_maker_son.GetShortUIName] en est la première victime. Les futurs artisans de [founder.GetCapitalLocation.GetNameNoTooltip] apprendront ce qu’est l’obéissance."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Vous gagnez de l’[experience|El] en [intrigue_lifestyle|El] à la place"
 pam_great_projects_events.0010.d: "Que cela nous serve de leçon d’humilité."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$ : comme guidé par la main de Dieu"
 pam_great_projects_events.0011.desc.intro: "Alors que j’inspecte l’avancement des travaux du [cathedral_building.GetName] de [province.GetNameNoTooltip], mes oreilles sont assaillies par un grincement strident provenant d’une immense structure en bois qui tourne."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] désigne la roue géante à l’intérieur de laquelle marchent deux ouvriers."
 pam_great_projects_events.0011.desc.no_architect: "\n\nJ’ai repéré d’où venait le bruit : une roue géante à l’intérieur de laquelle marchent deux ouvriers."
 pam_great_projects_events.0011.desc.outro: "\n\nComme guidées par la main de Dieu, ses cordes et ses poulies hissent de lourds blocs de [Glossary('pierre de taille','ASHLAR_GLOSS')] fraîchement préparés et des seaux de mortier jusqu’au toit en construction. Je contemple avec émerveillement cette charge qui aurait brisé le dos des manœuvres dans la cour en contrebas."
 pam_great_projects_events.0011.a: "Nous, les [founder.GetCulture.GetCollectiveNounNoTooltip], devons en apprendre le plus possible sur la grande roue."
 pam_great_projects_events.0011.a.tt: "Votre [culture|El] gagne #P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#!@culture_icon! en progression vers sa [cultural_fascination|El] actuelle"
 pam_great_projects_events.0011.b: "De nombreux projets de [founder.GetCapitalLocation.GetNameNoTooltip] pourraient en bénéficier !"
 pam_great_projects_events.0011.c: "Impressionnant, mais je laisserais ces exploits au Seigneur."
 ASHLAR_GLOSS: "La pierre de taille est une pierre soigneusement taillée et équarrie, puis dressée et lissée au sol. Une planification précise était nécessaire pour que les pierres s’ajustent parfaitement une fois hissées à la hauteur requise pour la construction des cathédrales."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$ : un appel d’en haut"
 pam_great_projects_events.0013.desc: "Le bruit sourd des maillets du charpentier résonne au-dessus de nos têtes, présage de l’acoustique qui baignera bientôt les fidèles dans la Parole de Dieu.\n\n[architect.GetFirstName] explique : « Ce sera une modeste tribune d’où les chanoines dirigeront la liturgie, notre propre [Glossary('tribune de chantres','CANTORIA_GLOSS')] ! En effet, nous devons employer une voix différente lorsque nous nous adressons à notre Seigneur que lorsque nous nous adressons aux hommes ». Puis, [architect.Custom('FR_IlElle')] appelle un enfant de chœur, [choir_boy.GetFirstName].\n\n[Select_CString(choir_boy.IsFemale,'La petite fille','Le petit garçon')] saute d’un bond sur l’échafaudage et laisse échapper une note angélique ; tandis que celle-ci résonne contre les murs et pénètre mon corps, c’est comme si Dieu était passé à travers moi."
 pam_great_projects_events.0013.a: "Élargissez cet espace : plus il y a de voix, mieux c’est."
 pam_great_projects_events.0013.b: "Cet ange doit honorer ma Cour."
 pam_great_projects_events.0013.castrato: "Réserver cette voix pour chanter les louanges du Seigneur."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.Custom('FR_le_Char_U_Pi')|U][choir_boy.GetShortUIName|U] est castré pour que sa voix ne mue pas"
 pam_great_projects_events.0013.c: "Toute cette mise en scène n’est qu’une ruse pour me soutirer quelque chose !"
 pam_great_projects_events.0013.d: "Tout cela me dépasse, je dois y aller."
 CANTORIA_GLOSS: "Une tribune de chantres est une galerie surélevée destinée au chant dans une église, souvent située au-dessus du chœur ou près du transept, d’où les chanteurs, puis plus tard les organistes, dirigeaient la liturgie."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$ : Son amour inébranlable"
 pam_great_projects_events.0012.desc: "La façade ouest est terminée ! Son portail est prêt à accueillir les fidèles par le [Glossary('narthex','NARTHEX_GLOSS')]. Il faudra peut-être toute une vie pour achever notre [cathedral_building.GetName], mais les bons chrétiens de [owner.GetPrimaryTitle.GetNameNoTier] doivent avoir foi en l’avenir de l’amour inébranlable du Seigneur. Que mon sermon commence...\n\n#EMP « [ROOT.Char.Custom('RandomBibleQuote')] »#!\n\n... et je conclurai par cette leçon tirée des Écritures."
 NARTHEX_GLOSS: "Le narthex est le vestibule situé à l’entrée d’une église, entre les portes ouest et la nef. Il accueillait les fidèles dans un espace sacré et, selon les rites les plus stricts, il servait à maintenir les pénitents et les catéchumènes à l’écart de l’assemblée pendant la messe."
 pam_great_projects_events.0012.a: "« Heureux ceux qui procurent la paix... »"
 pam_great_projects_events.0012.a.flavor: "« [Glossary('... car ils seront appelés fils de Dieu !','MATTHEW_5_9_GLOSS')] »"
 pam_great_projects_events.0012.a.tt: "Chaque [county|El] [owner.GetFaith.GetAdherentName] en [owner.GetPrimaryTitle.GetNameNoTier] gagne [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V] pendant #V 10 ans#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "« Va vers la fourmi, paresseux... »"
 pam_great_projects_events.0012.b.flavor: "« [Glossary('... Observe son comportement et deviens sage.','PROVERBS_6_6_GLOSS')] »"
 pam_great_projects_events.0012.b.tt: "Chaque [county|El] [owner.GetFaith.GetAdherentName] en [owner.GetPrimaryTitle.GetNameNoTier] gagne [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V] pendant #V 10 ans#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "« Je vous exhorte, frères et sœurs, ... »"
 pam_great_projects_events.0012.c.flavor: "« [Glossary('... au nom de notre Seigneur Jésus Christ, à tenir un même langage, et à ne point avoir de divisions parmi vous, mais à être parfaitement unis dans un même esprit et dans un même sentiment.','1_CORINTHIANS_1_10_GLOSS')] »"
 pam_great_projects_events.0012.c.tt: "Chaque [county|El] [owner.GetFaith.GetAdherentName] en [owner.GetPrimaryTitle.GetNameNoTier] gagne [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V] pendant #V 10 ans#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "« Soyez toujours joyeux. Priez sans relâche... »"
 pam_great_projects_events.0012.d.flavor: "« [Glossary('... Rendez grâce en toute circonstance, car c’est à votre égard la volonté de Dieu en Jésus Christ. N’éteignez pas l’Esprit. Ne méprisez pas les prophéties.','1_THESSALONIANS_5_16_20_GLOSS')] »"
 pam_great_projects_events.0012.d.tt: "Chaque [county|El] [owner.GetFaith.GetAdherentName] en [owner.GetPrimaryTitle.GetNameNoTier] gagne [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V] pendant #V 10 ans#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "« Courons avec endurance l’épreuve qui nous est proposée. »"
 pam_great_projects_events.0012.e.flavor: "« [Glossary('Rejetons tout fardeau, et le péché qui nous encombre si facilement, et courons avec endurance l’épreuve qui nous est proposée.','HEBREWS_12_1_GLOSS')] »"
 pam_great_projects_events.0012.e.tt: "Chaque [county|El] [owner.GetFaith.GetAdherentName] en [owner.GetPrimaryTitle.GetNameNoTier] gagne [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V] pendant #V 10 ans#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "« Elle tend la main au pauvre... »"
 pam_great_projects_events.0012.f.flavor: "« [Glossary('... elle tend la main à l’indigent.','PROVERBS_31_20_GLOSS')] »"
 pam_great_projects_events.0012.f.tt: "Chaque [county|El] [owner.GetFaith.GetAdherentName] en [owner.GetPrimaryTitle.GetNameNoTier] gagne [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V] pendant #V 10 ans#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak Les [rulers|El] [owner.GetFaith.GetAdherentNamePlural] dans l’[archdiocese|El] se [Concept('behave', 'comporteront')|E] de manière plus honorable et bienveillante#!#!"
