 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$ : le couronnement des flèches"
 pam_great_projects_events.0020.desc: "Les croix sont enfin fixées au sommet des clochers – chacune d’entre elles ressemblant à celle du Christ qui se dressait, il y a si longtemps, sur la colline du [Glossary('Golgotha','GOLGOTHA_GLOSS')]. Elles sont un mémorial de sa souffrance pour notre salut et la promesse que son sang coule chaque dimanche pour nous purifier de nos péchés.\n\nDepuis le début de la construction, les fils sont devenus pères, et les pères, des vieillards qui reposent désormais dans la tombe. Mais leur noble œuvre, leur sueur et leur sang, ont été immortalisés dans la pierre.\n\nLes empires peuvent tomber, mais notre [cathedral_building.GetName] de [province.GetName] perdurera à jamais, tout comme l’amour de Dieu."
 pam_great_projects_events.0020.a: "Venez de partout prier à nos côtés !"
 GOLGOTHA_GLOSS: "Le Golgotha – dont le nom vient du latin #EMP calvariae locus#!, c’est-à-dire « lieu du crâne » – était une colline en forme de crâne située dans la Jérusalem romaine et le lieu de la crucifixion de Jésus. L’exécution a eu lieu à l’extérieur des remparts de la ville, non loin du tombeau où il a été inhumé. Ce site se trouve désormais à l’intérieur de l’église du Saint-Sépulcre, près du [GetBuilding('dome_of_the_rock_01').GetName|V]."
