 great_project_type_pam_mass_rite_conversion: "Conversion de masse"
 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "Si nous disposons de ressources suffisantes, nous pourrons faire rayonner la lumière du Seigneur non seulement sur des individus païens, mais aussi sur des [realms|El] païens tout entiers. Grâce à notre enseignement, ils apprendront le [rite|El] le plus vertueux et contribueront ainsi à l’expansion de la [christendom|El]."
 great_project_type_pam_mass_rite_conversion_desc_generic: "Si nous disposons de ressources suffisantes, nous pourrons diffuser les principes de notre foi au-delà d’une poignée de convertis et l’étendre à des [realms|El] entiers où des [faiths|El] hostiles règnent encore en maîtres. Grâce à notre enseignement, leurs peuples apprendront le [rite|El] légitime, ce qui renforcera notre présence à travers tout le pays."
