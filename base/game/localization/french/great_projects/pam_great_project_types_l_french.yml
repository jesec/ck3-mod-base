 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$ : saintes fresques pour [province.GetNameNoTooltip]"
 pam_great_projects_events.0002.desc: "Alors que les prêtres peuvent se référer à la Parole de Dieu, ce sont les images sacrées qui révèlent aux fidèles la vérité et la gloire du Seigneur.\n\nLes fonds nécessaires ayant été réunis et les peintres d’icônes rassemblés, je dois désormais décider quelles scènes tirées des Écritures orneront les voûtes, les murs et les plafonds."
 pam_great_projects_events.0002.a: "Les trois Rois mages à la naissance du Christ."
 pam_great_projects_events.0002.b: "Saint Jérôme dans le désert avec son lion."
 pam_great_projects_events.0002.c: "Abraham et Lot qui quittent l’Égypte pour Canaan."
 pam_great_projects_events.0002.d: "L’Annonciation de la Sainte Vierge"
 pam_great_projects_events.0002.e: "Saint Augustin empli d’amour et de connaissance de Dieu."
 pam_great_projects_events.0002.f: "Le Christ lavant les pieds des Apôtres."
 pam_great_projects_events.0002.mystic_xp: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira de l’[trait_level_track_xp|El] pour ceux qui ont le [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.scholar_xp: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira de l’[trait_level_track_xp|El] pour ceux qui ont le [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.pilgrim_xp: "Une fois la [grand_cathedral|El] achevée, son [point_of_interest|El] fournira de l’[trait_level_track_xp|El] pour ceux qui ont le [trait|El] [GetTrait('pilgrim').GetName( GetNullCharacter )]"
