l_french:
 petition_head_of_faith_decision: "Faire une demande officielle au [ROOT.Char.GetFaith.ReligiousHeadTitleName|l]"
 petition_head_of_faith_decision_desc: "Rendez-vous à la Cour de votre [head_of_faith|El] et présentez une demande officielle."
 petition_head_of_faith_decision_tooltip: "Allez voir votre [head_of_faith|El] et demandez-lui une faveur"
 petition_head_of_faith_decision_head_of_faith_exists: "Votre [faith|El] a actuellement un [Concept('head_of_faith', 'chef')|E]"
 NOT_petition_head_of_faith_decision_head_of_faith_exists: "Votre [faith|El] n’a pas actuellement de [Concept('head_of_faith', 'chef')|E]"
 petition_antipope_decision: "Adresser une demande à l’$anti_religious_head_name|l$"
 petition_antipope_decision_desc: "Se rendre à la Cour de votre $anti_religious_head_name|l$ pour lui présenter une requête officielle. Vous ne pouvez plus adresser de requête au [ROOT.Char.GetFaith.ReligiousHeadTitleName|l] de [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetName]."
 petition_antipope_decision_tooltip: "Allez voir votre [challenger_hof|El] et demandez-lui une faveur"
 petition_antipope_decision_confirm: "Préparer la demande"
 petition_head_of_faith_decision_effects_major_piety: "Dépensez [EmptyScope.ScriptValue('major_piety_value')|V0][piety_i] en [piety|El] lorsque vous préparez votre requête. Cette piété vous sera restituée si vous vous retirez, si vous annulez le [travel|El] ou si la requête est abandonnée. Vous la perdrez si vous exposez vos arguments et que vous ne parvenez pas à convaincre [petition_recipient.Custom('FR_le_Char_U_Pi')][petition_recipient.GetShortUINameNoTooltip]."
 petition_head_of_faith_decision_effects_massive_piety: "Dépensez [EmptyScope.ScriptValue('massive_piety_value')|V0][piety_i] en [piety|El] lorsque vous préparez votre requête. Cette piété vous sera restituée si vous vous retirez, si vous annulez le [travel|El] ou si la requête est abandonnée. Vous la perdrez si vous exposez vos arguments et que vous ne parvenez pas à convaincre [petition_recipient.Custom('FR_le_Char_U_Pi')][petition_recipient.GetShortUINameNoTooltip]."
 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.Custom('FR_le_Char_U_Pi')|U][petition_recipient.GetShortUIName] #P acceptera très probablement#! cette requête #weak (en fonction de son [opinion|El] à votre égard ; peut être influencé pendant l’audience)#!"
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.Custom('FR_le_Char_U_Pi')|U][petition_recipient.GetShortUIName] #P pourrait accepter#! cette requête #weak (en fonction de son [opinion|El] à votre égard ; peut être influencé pendant l’audience)#!"
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.Custom('FR_le_Char_U_Pi')|U][petition_recipient.GetShortUIName] #N pourrait rejeter#! cette requête #weak (en fonction de son [opinion|El] à votre égard ; peut être influencé pendant l’audience)#!"
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.Custom('FR_le_Char_U_Pi')|U][petition_recipient.GetShortUIName] #N rejettera très probablement#! cette requête #weak (en fonction de son [opinion|El] envers vous et vos relations ; peut être influencé pendant l’audience)#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak Les [traits|El] [Concept('sinful', 'immoraux')|E] et [virtuous|El] de votre cible, d’après la foi [petition_recipient.GetFaith.GetAdjective], influencent l’impact de vos arguments auprès du public.#!"
 petition_head_of_faith_decision_hook_available: "Utilisez votre [hook|El] sur [petition_recipient.Custom('FR_le_Char_Pi')][petition_recipient.GetTitledFirstName] pour ne pas avoir à payer le coût en [piety|El]"
 petition_head_of_faith_decision_cost_major_piety: "Nécessite [EmptyScope.ScriptValue('major_piety_value')|V0][piety_i] en [piety|El] ou un [hook|El]"
 NOT_petition_head_of_faith_decision_cost_major_piety: "$petition_head_of_faith_decision_cost_major_piety$"
 petition_head_of_faith_decision_cost_massive_piety: "Nécessite [EmptyScope.ScriptValue('massive_piety_value')|V0][piety_i] en [piety|El] ou un [hook|El]"
 NOT_petition_head_of_faith_decision_cost_massive_piety: "$petition_head_of_faith_decision_cost_massive_piety$"
 petition_head_of_faith_decision_confirm: "Préparer la demande"
 petition_head_of_faith_excommunication_setup_interaction: "Demander l’excommunication"
 petition_head_of_faith_excommunication_setup_interaction_extra_icon: "$hook_extra_icon$"
 recipient_secondary_petition_head_of_faith_excommunication_setup_interaction: "Cible"
 petition_head_of_faith_excommunication_setup_interaction_accept_tt: "Vous voyagerez à [recipient.GetCapitalLocation.GetName] et demanderez officiellement [recipient.Custom('FR_au_Char_Pi')][recipient.GetTitledFirstName] d’[excommunicate|El] [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstName]"
 petition_head_of_faith_decision_option_repentance: "Lever l’excommunication"
 petition_head_of_faith_decision_option_excommunication: "Demander l’excommunication"
 petition_head_of_faith_decision_option_repentance_desc: "Demandez la levée de votre [excommunication|El]."
 petition_head_of_faith_decision_option_excommunication_desc: "Demandez l’[excommunication|El] d’un [ruler|El] de votre [faith|El]."
 # Auto-referenced by decision_option_list_controller as "<option value>_tooltip"; do not remove.
 petition_head_of_faith_repentance_tooltip: "$petition_head_of_faith_decision_option_repentance_desc$"
 petition_head_of_faith_excommunication_tooltip: "$petition_head_of_faith_decision_option_excommunication_desc$"
 petition_head_of_faith_costs_refunded: "Frais de la demande officielle remboursés"
 unavailable_petition_head_of_faith: "en attente d’une demande officielle"
 petition_head_of_faith_reclaim_offering_tt: "#weak On vous a restitué ce que vous aviez réservé pour cette requête :#!"
 # Invalidation event
 petition_head_of_faith.0601.t: "Demande officielle abandonnée"
 petition_head_of_faith.0601.desc.no_head: "Au moment où je suis enfin en mesure d’exposer mon cas, il n’y a plus aucun guide spirituel compétent pour répondre à ma requête."
 petition_head_of_faith.0601.desc.head_dead: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] est mort[recipient.Custom('FR_E')] avant d’avoir pu entendre ma demande."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] est en prison et ne peut pas recevoir de demande officielle."
 petition_head_of_faith.0601.desc.head_changed: "Le chef de ma foi a changé et je ne peux plus présenter ma demande [recipient.Custom('FR_au_Char_Pi')][recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.at_war: "Je ne peux pas faire de demande officielle tant que je suis en guerre contre [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName]."
 petition_head_of_faith.0601.desc.repentance_resolved: "Il n’y a plus d’excommunication à lever."
 petition_head_of_faith.0601.desc.repentance_too_soon: "Mon repentir n’aurait pas été entendu si peu de temps après ma dernière censure."
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] est mort[petition_target.Custom('FR_E')] avant d’avoir pu entendre la requête."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] n’est plus de ma foi, on ne peut donc pas demander une excommunication."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] n’est plus de rang royal ou supérieur et ne relève donc pas de la présente requête formelle."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] est déjà excommunié[petition_target.Custom('FR_E')]."
 petition_head_of_faith.0601.desc.fallback: "Ma requête ne peut pas être poursuivie et ce voyage n’a plus aucun sens."
 petition_head_of_faith.0601.desc.refund.piety: "Les pieuses offrandes que j’avais mises de côté pour cette requête sont restituées."
 petition_head_of_faith.0601.desc.refund.none: "En tout cas, rien n’a encore changé de mains."
 petition_head_of_faith.0601.a: "Ainsi soit-il."
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "Demande officielle : pénitence"
 petition_head_of_faith.1000.t.excommunication: "Demande officielle : excommunication"
 petition_head_of_faith.1000.desc.court_low_grandeur: "Le palais, autrefois somptueux, n’est plus qu’un tas de ruines autour de moi. Je prie pour que cela ne soit pas le reflet de l’appauvrissement spirituel du [recipient.GetFaith.ReligiousHeadName|l].\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "Le palais, célèbre pour ses salles somptueuses, inspire véritablement le respect dès qu’on y pénètre. Je prie pour que ces dorures célestes reflètent la justice et la richesse spirituelle qui règnent en son sein.\n\n"
 petition_head_of_faith.1000.desc.intro: "C’est là que siège [Select_CString(recipient.IsFemale,'la représentante','le représentant')] de Dieu sur terre. "
 petition_head_of_faith.1000.desc.recipient_sinful: "Même s’il est de notoriété publique qu’[recipient.Custom('FR_IlElle')] est [petition_hof_gravest_sin.GetName(recipient)|l], [recipient.Custom('FR_IlElle')] a pourtant réussi, par quelque moyen diabolique, à se frayer un chemin jusqu’au trône de Saint-Pierre."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Son jugement sera certainement influencé par sa nature vertueuse ([petition_hof_gravest_virtue.GetName(recipient)|l])."
 petition_head_of_faith.1000.desc.health_noble: "\n\nSa santé chancelante est manifestement le résultat d’une vie consacrée à de nobles actions."
 petition_head_of_faith.1000.desc.health_excess: "\n\nSa santé chancelante est manifestement le résultat d’une vie marquée par des excès dévastateurs."
 petition_head_of_faith.1000.desc.address: "\n\nJe lui présente ma requête : « [Select_CString(recipient.IsFemale,'Sainte-Mère','Saint-Père')], "
 petition_head_of_faith.1000.desc.repentance: "je viens humblement demander à être libéré[ROOT.Char.Custom('FR_E')] de la censure qui pèse sur mon âme, et je prie pour être réintégré dans la communauté des fidèles. »"
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstName] a commis des crimes contre Dieu. Je me présente devant vous en humble [Select_CString(ROOT.Char.IsFemale,'messagère','messager')] : car il n’appartient bien sûr qu’à vous de juger son âme immortelle. »"
 petition_head_of_faith.1000.a.argue: "Je vais argumenter."
 petition_head_of_faith.1000.a.argue_tt: "Vous essayez de convaincre [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] pendant l’audience"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n« Nous vous avons entendu[ROOT.Char.Custom('FR_E')], mon enfant. Exposez-nous les détails de votre demande et nous l’examinerons avec bienveillance »,"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n« Nous avons bien reçu votre requête. Nous rendrons notre jugement conformément au droit canonique et aux préceptes de la Sainte Église »,"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n« Il est facile de tenir de belles paroles. Nous accueillons votre requête avec le scepticisme que le Seigneur exige »,"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n« Vous présumez de bien des choses en venant ici. Réfléchissez bien à ce que vous allez dire »,"
 petition_head_of_faith.1000.desc.conclusion: "dit-[recipient.Custom('FR_IlElle')]."
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "Demande officielle : pénitence [actor.Custom('FR_du_Char_Pi')][actor.GetTitledFirstNameNoTooltip]"
 petition_head_of_faith.1310.desc.intro: "« [Select_CString(ROOT.Char.IsFemale,'Sainte-Mère','Saint-Père')], j’ai été excommunié[actor.Custom('FR_E')] : exclu[actor.Custom('FR_E')] des sacrements et de la communauté des fidèles. Je vous supplie d’effacer cette censure de mon âme et de me réintégrer dans la communion des saints », dit [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName], à genoux.\n\n« Prouvez votre contrition devant Dieu », lui rétorqué-je."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n« Vous avez déjà fait preuve de miséricorde, [Select_CString(ROOT.Char.IsFemale,'Sainte-Mère','Saint-Père')]. Je ne demande aucune faveur terrestre, mais seulement que Dieu et la Sainte Église reconnaissent la sincérité de ma contrition. »"
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n« Devant Dieu, je me tiens là comme n’importe que[actor.Custom('FR_LLle')] pénitent[actor.Custom('FR_E')] et je ne demande que la justice selon le canon. »"
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n« Ne me prenez pas pour [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )] qui, par de douces paroles, égare les autres. Je jure devant [ROOT.Char.GetFaith.HighGodName] et [Select_CString(ROOT.Char.IsFemale,'Sa représentante','Son représentant')] sur terre que je suis repentant[actor.Custom('FR_E')]. »"
 petition_head_of_faith.1310.serpent.christian: "le serpent du jardin"
 petition_head_of_faith.1310.serpent.generic: "un serpent"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n« Nous sommes peut-être ennemis dans ce monde, mais je ne vous demande pas de parler de moi en bien dans les affaires de ce monde, mais de reconnaître ma pénitence et de ne pas mettre mon âme en danger. »"
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n« Il nous est parvenu que vous êtes [petition_gravest_sin.GetName(actor)|l]. Les belles paroles ne purifient pas une âme souillée. Quelle pénitence proposez-vous ? »"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n« Votre nom n’est pratiquement plus entaché de vices. Peut-être que le bannissement a déjà produit des effets salutaires. Nous verrons si votre âme est à la hauteur de votre attitude. »"
 petition_head_of_faith.1310.a: "« Lève-toi, mon enfant. Tu es à nouveau accueilli[actor.Custom('FR_E')] dans la communion des saints. »"
 petition_head_of_faith.1310.b: "« La censure reste en vigueur. Revenez lorsque votre repentir sera plus manifeste. »"
 petition_head_of_faith.1320.t: "Demande officielle : excommunication [petition_target.Custom('FR_du_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip]"
 petition_head_of_faith.1320.desc.intro: "« [Select_CString(ROOT.Char.IsFemale,'Sainte-Mère','Saint-Père')], [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstName] a commis un crime contre Dieu. Si cette pourriture n’est pas éliminée, nos âmes à tous sont en danger », dit [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName].\n\n« Nous ne brandissons pas l’excommunication telle l’épée d’un prince. Exprimez clairement et sans ambiguïté vos accusations devant Dieu », dis-je."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n« Vous vous êtes toujours montré[ROOT.Char.Custom('FR_E')] juste à mon égard, [Select_CString(ROOT.Char.IsFemale,'Sainte-Mère','Saint-Père')]. Je ne demande aucune faveur terrestre, mais seulement que Dieu et la Sainte Église reconnaissent la gravité des fautes commises par [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n« Devant Dieu, je présente cette accusation en tant que simple sujet du Seigneur Jésus-Christ et je ne demande que ce qu’exige la justice de la Sainte Église."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n« Ne me prenez pas pour le serpent du jardin qui, par de belles paroles, incite les autres à régler leurs différends privés. Je jure devant [ROOT.Char.GetFaith.HighGodName] et [Select_CString(ROOT.Char.IsFemale,'Sa représentante','Son représentant')] sur terre que ces accusations sont justes."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n« Nous sommes peut-être ennemis dans ce monde, mais je vous prie de juger l’âme [petition_target.Custom('FR_du_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] conformément à ce qu’exige le canon."
 petition_head_of_faith.1320.desc.target_sinful: "La pourriture du péché [petition_target.Custom('FR_du_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] provient de sa nature [petition_gravest_sin.GetName(petition_target)|l]. »"
 petition_head_of_faith.1320.desc.finish: "conclut [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName]."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstNameNoTooltip] sait peut-être bien dissimuler sa propre dépravation, mais j’ai la conviction que ses péchés seront révélés si vous vous laissez guider par le Seigneur. »"
 petition_head_of_faith.1320.a: "« Je l’exclus de la communion des saints. »"
 petition_head_of_faith.1320.b: "« Votre argument n’est pas convaincant, [petition_target.Custom('FR_IlElle')] ne doit faire l’objet d’aucune censure. »"
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "Excommunication prononcée"
 petition_head_of_faith.2020.desc: "Le [recipient.GetFaith.ReligiousHeadName|l] se lève pour proclamer la justice du Seigneur :\n\n« [petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] est excommunié[petition_target.Custom('FR_E')], exclu[petition_target.Custom('FR_E')] de la communion des saints. Son âme est en grand danger jusqu’à ce qu’[petition_target.Custom('FR_IlElle')] se repente sincèrement. »"
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName] s’est exprimé par l’intermédiaire de [Select_CString(recipient.IsFemale,'Sa servante','Son serviteur')]."
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "Requête refusée"
 petition_head_of_faith.2030.desc.intro: "Le [recipient.GetFaith.ReligiousHeadName|l] se lève pour proclamer la justice du Seigneur :\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "« Les péchés que vous invoquez ne sont pas suffisamment graves pour justifier un verdict aussi terrible. [petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] ne sera pas excommunié[petition_target.Custom('FR_E')]. »"
 petition_head_of_faith.2030.desc.finesse: "« Nous ne chassons pas les fidèles pour l’or d’un prince. Ce qui est à César ne saurait acheter le jugement [recipient.GetFaith.HighGodNamePossessive]. »"
 petition_head_of_faith.2030.desc.learning_duel: "« Vous voulez entraîner [petition_target.Custom('FR_le_Char_L')][petition_target.GetTitleAsNameNoTooltip|l] dans une interprétation délibérément erronée du droit canonique ? [petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstName] ne sera pas excommunié[petition_target.Custom('FR_E')] par la... force de votre érudition. »"
 petition_head_of_faith.2030.desc.fallback: "« Vous présumez beaucoup ! Je ne vois aucune raison d’excommunier [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstName]. »"
 petition_head_of_faith.2030.a: "Je suppose que [recipient.GetFaith.HighGodName] s’est exprimé par l’intermédiaire de [Select_CString(recipient.IsFemale,'Sa représentante','Son représentant')]."
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "L’argumentation"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "« Prouveriez-vous les crimes [petition_target.Custom('FR_du_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] par les Écritures et les canons de l’Église ? S’est-[petition_target.Custom('FR_IlElle')] prosterné[petition_target.Custom('FR_E')] devant des idoles ? »"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "« Porteriez-vous accusation contre [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] au pied de la croix de pierre ? »"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "« [petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstNameNoTooltip] ne mérite-t-[petition_target.Custom('FR_IlElle')] pas [petition_target.Custom('FR_LuiElle')] aussi la miséricorde de la Mère de Dieu ? Vous tenez-vous là, vêtu[ROOT.Char.Custom('FR_E')] d’une robe immaculée ? »"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "« Voulez-vous donc que nous excluions [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] de la sainte liturgie à cause d’une querelle personnelle, sans même avoir la preuve de péchés graves ? »"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "« Refuseriez-vous [petition_target.Custom('FR_au_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] l’accès à l’autel du Christ ? Lui refuseriez-vous la nourriture de la chair de Notre Seigneur ? Ne devrait-[petition_target.Custom('FR_IlElle')] plus boire de Son sang ? »"
 petition_head_of_faith.2000.desc.atmosphere_communion: "« Voulez-vous vraiment exclure [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] de la communion des saints ? »"
 petition_head_of_faith.2000.desc.atmosphere_confession: "« Voudriez-vous que nous agissions contre [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] sur la foi de ce qui fut dit sous le sceau de la confession ? »"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "« Voulez-vous que nous excluions [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip], alors que des moyens plus doux pourraient peut-être l’amener à se détourner du péché ? »"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "« Invoqueriez-vous l’autorité des Apôtres pour que nous condamnions [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] sur la terre comme au ciel ? »"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "« Vous nous détournez de l’étude des canons pour condamner [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip]. Que votre argumentation soit donc fondée sur les écrits des Pères de l’Église et sur l’Écriture. »"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "« Voulez-vous que nous prenions des mesures contre [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] en raison du sang versé pendant les jours fériés ou des actes de violence commis sur les terres de l’Église ? A-t-[petition_target.Custom('FR_IlElle')] rompu la Paix et la Trêve de Dieu ? »"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "« Votre différend avec [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] doit-il vraiment être jugé ici ? Ne vaudrait-il pas mieux que vous preniez tous deux la Croix et combattiez les ennemis du Christ ? »"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "« Vous venez nous demander d’exclure [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] alors que nous, les cinq sièges patriarcaux, nous efforçons de maintenir unie une chrétienté déchirée par les dissensions ? Croyez-vous que toute l’[Glossary( 'Écoumène', 'OIKOUMENE_GLOSS' )] se rangerait derrière votre accusation ? »"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "« [petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstNameNoTooltip] a-t-[petition_target.Custom('FR_IlElle')] bafoué le culte des martyrs en manifestant ouvertement son dégoût ? »"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "« Vous voulez que nous excluions [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip]. Donnez-nous une preuve qu’[petition_target.Custom('FR_IlElle')] a mené une vie de désobéissance et de paresse, car l’inaction est l’ennemie de l’âme. »"
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "« Voulez-vous donc que nous condamnions [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip], comme [petition_target.Custom('FR_SilSielle')] avait hérité à [Select_CString(petition_target.IsFemale,'elle seule','lui seul')] de la faute d’Adam ? Toute âme naît blessée par la Chute, pourtant l’Église ne rejette personne, sauf ceux qui se complaisent dans leur penchant pour le péché. »"
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "« Vous venez réclamer justice contre [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] avec toute votre opulence, tandis que nos frères parcourent les routes parmi les pauvres avec pour seuls biens les vêtements qu’ils portent. Un frère mendiant ne vous conseillerait-il pas plutôt la patience ? À moins que le péché ne soit si grave ? »"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "« Vous refuseriez [petition_target.Custom('FR_au_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] les sacrements ? Vous compromettriez sa part dans les richesses de la vie éternelle auprès du Christ au Ciel ? C’est sur terre que nous faisons vœu de pauvreté. »"
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "« Vous voulez que nous excluions un soldat du Christ sur la seule base des propos de son ennemi[actor.Custom('FR_E')] ? »"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "« Comment voudriez-vous que la Sainte Église règle votre différend avec [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] ? »"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n« Vous devez bien savoir que nous ne manions pas l’excommunication tel un prince manie son épée. C’est à nous de décider ce qui est juste et comment y remédier. Portez votre affaire devant Dieu ! », exhorte [Select_CString(recipient.IsFemale,'la Sainte-Mère','le Saint-Père')]."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nMême si les paroles de [recipient.GetFaith.GetReligiousHeadTitle.GetName] peuvent paraître impartiales, la nouvelle de la nature pécheresse [petition_target.Custom('FR_du_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] est parvenue jusque dans ces salles. Je ne peux donc que confirmer ses transgressions."
 petition_head_of_faith.2000.desc.target_clean: "\n\nIl semble que [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] sache que [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] n’est pas coupable de péché. En l’absence de preuves de méfaits pouvant être présentées à la Cour, je vais devoir trouver d’autres moyens de rendre justice."
 OIKOUMENE_GLOSS: "Écoumène vient du grec #EMP oikouménē#! signifiant « monde habité ». Dans la langue byzantine, il désigne le monde civilisé : l’Empire et, plus largement, l’ordre chrétien présidé par l’Église."
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "Proclamer [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] comme [Select_CString(petition_target.IsFemale,'pécheresse','pécheur')] devant Dieu."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Énoncer les péchés [petition_target.Custom('FR_du_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip] devant Dieu."
 petition_head_of_faith.2000.b.finesse: "« L’Église a de nombreux besoins. Permettez-moi de m’occuper de certains d’entre eux. »"
 petition_head_of_faith.2000.c.learning_duel: "Je citerai des passages peu connus des Écritures pour piéger [petition_target.Custom('FR_le_Char_L')][petition_target.GetTitleAsNameNoTooltip] impie."
 petition_head_of_faith.2000.d.hook: "Rappeler au [recipient.GetFaith.ReligiousHeadName|l] certaines affaires... privées."
 petition_head_of_faith.2000.e.withdraw: "... c’est peut-être une affaire entre [petition_target.GetFaith.HighGodName] et [petition_target.Custom('FR_le_Char_Pi')][petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.5000.e.withdraw: "... peut-être que je ne suis pas encore tout à fait prêt[ROOT.Char.Custom('FR_E')] pour ça."
 petition_head_of_faith_hook_committed_tt: "Vous dépensez un [hook|El] pour faire arranger cela"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.Custom('FR_le_Char_Pi')|U][petition_target.GetTitledFirstNameNoTooltip] est plus [Select_CString(petition_target.IsFemale,'vertueuse','vertueux')] que [Select_CString(petition_target.IsFemale,'pécheresse','pécheur')]"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "Le [recipient.GetFaith.ReligiousHeadName|l] se laisse persuader"
 petition_head_of_faith_cite_sins_success_desc: "Le [recipient.GetFaith.ReligiousHeadName|l] se laisse convaincre"
 petition_head_of_faith_cite_sins_failure_desc: "Le [recipient.GetFaith.ReligiousHeadName|l] reste sceptique"
 petition_head_of_faith_argument_affronted: "Le [recipient.GetFaith.ReligiousHeadName|l] se vexe"
 petition_head_of_faith_argument_dismissed: "Le [recipient.GetFaith.ReligiousHeadName|l] rejette votre argument"
 petition_head_of_faith_affronted_opinion: "Offensé par la corruption"
 petition_head_of_faith_affronted_opinion_desc: "Ce personnage s’est senti offensé par un requérant qui pensait pouvoir acheter un jugement religieux avec de l’or."
 petition_head_of_faith_dismissed_debate_opinion: "Insensible aux arguments"
 petition_head_of_faith_dismissed_debate_opinion_desc: "Ce personnage a rebuffé un requérant dont l’interprétation erronée du droit canonique n’a pas réussi à le convaincre."
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "Rechercher l’absolution"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Vous rendre auprès de votre [head_of_faith|El] et le supplier de lever votre [excommunication|El]"
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Vous voyagerez à [recipient.GetCapitalLocation.GetName] et demanderez officiellement [recipient.Custom('FR_au_Char_Pi')][recipient.GetTitledFirstName] de lever votre [excommunication|El]"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "La confession"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "« Vous venez me voir pour obtenir l’absolution. Vous êtes-vous prosterné[ROOT.Char.Custom('FR_E')] devant des idoles alors que vous saviez que seules les Écritures saintes et la pénitence peuvent vous purifier ? »"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "« J’espère que vous viendrez implorer l’absolution au pied de la croix de pierre. »"
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "« La Mère de Dieu est emplie de miséricorde, mais nous ne pouvons pas lever la censure uniquement par Sa volonté. »"
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "« Et vous voilà encore à la recherche de la Divine Liturgie. Réfléchissez donc à ce qui vous éloigne de l’autel et des fidèles. »"
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "« On vous refuse l’autel du Christ et la nourriture que constituent Sa chair et Son sang. »"
 petition_head_of_faith.5000.desc.atmosphere_communion: "« Vous êtes retranché[ROOT.Char.Custom('FR_E')] de la communion des saints. »"
 petition_head_of_faith.5000.desc.atmosphere_confession: "« Le sacrement de la confession exige un aveu complet et sincère. »"
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "« L’excommunication est le remède de l’Église. Un cadeau qui vous permet de vous amender et d’abréger votre séjour au purgatoire. »"
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "« Nous détenons les clés de Saint Pierre. Cette autorité peut vous absoudre si vous êtes véritablement repentant[ROOT.Char.Custom('FR_E')]. »"
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "« Vous aspirez à la réconciliation : respectez donc les règles énoncées dans les chapitres et les distinctions du #italic Decretum#!. »"
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "« Votre péché a-t-il consisté à violer la Paix et la Trêve de Dieu ? Avez-vous versé le sang durant le temps sacré ? »"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "« Si vous avez accepté la croix et que vous avez pourtant porté atteinte à la chrétienté, alors vous avez clairement enfreint la loi. »"
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "« Les cinq sièges patriarcaux ont les yeux rivés sur nous. Nous ne saurions brader l’absolution sous le regard de toute l’[Glossary( 'Écoumène', 'OIKOUMENE_GLOSS' )]. »"
 petition_head_of_faith.5000.desc.atmosphere_dulia: "« Les martyrs ont gagné leur place au paradis au prix de leur sang. »"
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "« L’oisiveté est l’ennemie de l’âme. Ne vous agenouillez pas par contrition, mais dans la volonté de vous repentir, de prier et de travailler. »"
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "« Vous êtes né[ROOT.Char.Custom('FR_E')] dans le péché, comme nous tous. Pourquoi ajouter encore de l’impiété à celle héritée ? »"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "« Nos frères vivent parmi les pauvres, sans rien d’autre que leurs habits religieux usés. »"
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "« Sur terre, nous aspirons à faire vœu de pauvreté. La richesse et le rang ne permettent pas d’acheter les sacrements. »"
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "« Vous portiez la croix sur la poitrine et pourtant vous avez offensé la chrétienté. »"
 petition_head_of_faith.5000.desc.atmosphere_fallback: "« L’absolution ne se mérite pas uniquement par vos longs pèlerinages. »"
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n« Sachez que nous ne levons pas une censure uniquement pour la forme ou par flatterie. Exprimez clairement votre repentir devant Dieu ! », exhorte [Select_CString(recipient.IsFemale,'la Sainte-Mère','le Saint-Père')]."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nLa nouvelle concernant ma nature pécheresse ([petition_gravest_sin.GetName(actor)|l]) a certainement déjà atteint ces lieux sacrés."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nSans grande impiété à mettre au jour, la Cour comprendra assurément que l’excommunication a produit un effet salutaire."
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "Confesser mes péchés sans rien cacher"
 petition_head_of_faith.5000.b.canon_law: "Affirmer que le droit canonique exige ma réconciliation"
 petition_head_of_faith.5000.c.weep: "S’en remettre à la clémence de la Cour"
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "Le [recipient.GetFaith.ReligiousHeadName|l] se laisse émouvoir"
 petition_head_of_faith_repentance_duel_failure: "Le [recipient.GetFaith.ReligiousHeadName|l] reste de marbre"
 petition_head_of_faith_repentance_confess_duel_success: "Le [recipient.GetFaith.ReligiousHeadName|l] accepte votre confession"
 petition_head_of_faith_repentance_confess_duel_failure: "Le [recipient.GetFaith.ReligiousHeadName|l] n’est pas convaincu par vos paroles"
 petition_head_of_faith_repentance_weep_duel_success: "Le [recipient.GetFaith.ReligiousHeadName|l] est touché par votre humilité"
 petition_head_of_faith_repentance_weep_duel_failure: "Le [recipient.GetFaith.ReligiousHeadName|l] reste de marbre face à votre démonstration"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "Absolution accordée"
 petition_head_of_faith.5020.desc: "Le [recipient.GetFaith.ReligiousHeadName|l] se lève et proclame la grâce du Seigneur :\n\n« Lève-toi, mon enfant. Tu es à nouveau accueilli[ROOT.Char.Custom('FR_E')] au sein de la communion des saints. L’excommunication qui pesait sur ton âme est levée. »"
 petition_head_of_faith.5020.a: "Gloire [recipient.GetFaith.HighGodName2] !"
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "Pas d’absolution"
 petition_head_of_faith.5030.desc.intro: "Le [recipient.GetFaith.ReligiousHeadName|l] se lève pour proclamer la justice du Seigneur :\n\n"
 petition_head_of_faith.5030.desc.confess: "« Votre confession manque de crédibilité."
 petition_head_of_faith.5030.desc.canon_law: "« Votre piètre savoir est le miroir de votre âme."
 petition_head_of_faith.5030.desc.weep: "« Les larmes ne sont pas une pénitence."
 petition_head_of_faith.5030.desc.fallback: "« Vous vous avancez beaucoup."
 petition_head_of_faith.5030.desc.conclusion: " La censure est maintenue. »"
 petition_head_of_faith.5030.a: "Je suppose que [recipient.GetFaith.HighGodName] s’est exprimé par l’intermédiaire de [Select_CString(recipient.IsFemale,'Sa représentante','Son représentant')]."
