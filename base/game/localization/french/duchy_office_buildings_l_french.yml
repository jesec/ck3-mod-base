 building_type_courts_of_commons_01: "Tribunaux du peuple"
 building_type_courts_of_commons_01_desc: "Laisser le peuple régler ses propres conflits dans ces tribunaux ne coûte rien au souverain, et empêche que les petites rancunes ne prennent trop d’ampleur."
