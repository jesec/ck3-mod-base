 ### Staple District ###
 building_type_staple_district_01: "Marché ducal"
 building_type_staple_district_01_desc: "Chaque ballot vendu sur ce marché ducal est pesé et frappé de son sceau, et les marchandises non scellées trouvées ailleurs dans le duché sont immédiatement saisies."
