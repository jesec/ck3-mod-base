 ### Bailiwick District ###
 building_type_bailiwick_01: "Cour baillivale"
 building_type_bailiwick_01_desc: "Chaque affaire traitée par la cour baillivale est consignée dans ses registres, afin que le bailli puisse mettre un terme à un litige concernant un champ en lisant à voix haute le jugement rendu il y a plusieurs dizaines d’années."
