 building_type_alnagers_office_01: "Bureau de l’alnager"
 building_type_alnagers_office_01_desc: "Les tissus qui ne sont pas conformes à l’inspection effectuée ici sont saisis, et parfois brûlés sur la place du marché aux yeux de tous."
