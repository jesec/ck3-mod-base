 building_type_verderers_hall_01: "Cour des verdiers"
 building_type_verderers_hall_01_desc: "La législation forestière appliquée ici est une loi à part entière, avec ses propres tribunaux et officiers. En vertu de cette législation, même la collecte de bois de chauffage nécessite une autorisation."
