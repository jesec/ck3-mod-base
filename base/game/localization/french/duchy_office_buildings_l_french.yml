 building_type_survey_office_01: "Bureau d’arpentage"
 building_type_survey_office_01_desc: "Les arpenteurs de ce bureau parcourent les champs du duché avec leurs cordes et leurs baguettes, afin de mesurer chaque parcelle pour qu’elle soit imposée selon son rendement."
