 building_type_grain_exchange_01_desc: "Chaque mesure utilisée dans cette bourse aux grains est comparée à la mesure officielle, conservée dans la salle des marchés. Les marchands qui utilisent une mesure inférieure reçoivent une amende sur-le-champ."
