l_french:
 activity_carnival: "Carnaval"
 activity_carnival_name: "[ACTIVITY.GetHost.LocalPlayerString( 'Votre carnaval', 'Le carnaval' )][ACTIVITY.GetHost.LocalPlayerString( '', 'Loc_FR_du_GetName' )]"
 activity_carnival_owner: "Hôte"
 activity_carnival_desc: "Apaisez et divertissez vos citoyens en organisant un carnaval éblouissant ! Offrez-vous, ainsi qu’à vos sujets, l’occasion de mettre de côté les rangs et les distinctions pour vous laisser emporter par les festivités masquées, les divertissements et la gastronomie !\n\nTout le monde aura hâte de célébrer l’histoire et la culture de votre république. C’est l’occasion idéale de faire étalage de votre richesse pour attiser la jalousie de vos rivaux, ou de vous fondre dans la foule pour découvrir leurs pensées et leurs préoccupations les plus intimes."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$Peut gagner du [prestige|El][prestige_i]\n$BULLET_WITH_TAB$Peut gagner de la [piety|El][piety_i]\n$BULLET_WITH_TAB$Les participants peuvent améliorer l’[opinion|El] [opinion_i|E] des autres [activity_guests_short|El]\n$BULLET_WITH_TAB$Les participants peuvent perdre du [stress|El][stress_loss_i]\n$BULLET_WITH_TAB$Peut améliorer le [control|El][control_i|E] dans le [county|El]\n$BULLET_WITH_TAB$Peut améliorer la [prosperity|El][prosperity_i|E] dans le [county|El]\n$BULLET_WITH_TAB$Peut améliorer l’[popular_opinion|El] [popular_opinion_i|E]\n"
 activity_carnival_guest_help_text: "Un carnaval est une excellente occasion de trouver des roturiers talentueux, d’établir des relations d’affaires ou tout simplement de perdre du [stress|El][stress_loss_i]."
 activity_carnival_province_desc: "Vous organisez un carnaval en [ROOT.Province.GetName]."
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Les participants peuvent gagner du [prestige|El]\n$BULLET_WITH_TAB$ Les participants peuvent améliorer l’[opinion|El] des autres participants\n$BULLET_WITH_TAB$Les participants peuvent perdre du [stress|El][stress_loss_i]"
 activity_carnival_conclusion_desc: "Le [GetActivityType( 'activity_carnival' ).GetName|l] est terminé."
 activity_carnival_selection_tooltip: "Des célébrations masquées pour ravir les vôtres\n\nRécompenses prévues :\n$BULLET_WITH_TAB$[prestige|E][prestige_i]\n$BULLET_WITH_TAB$[piety|E][piety_i|E]\n$BULLET_WITH_TAB$[stress_loss|E][stress_loss_i]\n$BULLET_WITH_TAB$[opinion|E][opinion_i|E]\n$BULLET_WITH_TAB$[control|E][control_i|E]\n$BULLET_WITH_TAB$[prosperity|E][prosperity_i|E]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]"
 carnival_decoration_basic: "Décorations de base"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ Gain faible de [prestige|El]\n\n#weak La ville est déjà assez belle comme ça, n’est-ce pas ?#!"
 carnival_decoration_extensive: "Décorations somptueuses"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$ Gain moyen de [prestige|El]\n\n#weak Décorons la ville avec des fleurs et des tissus pour transporter les habitants dans un monde merveilleux, loin de l’ordinaire.#!"
 carnival_decoration_extravagant: "Décorations fastueuses"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ Gain important de [prestige|El]\n\n#weak Mettons toute la ville sens dessus dessous, en ne lésinant pas sur les moyens pour transformer les rues et les places en véritables paradis imaginaires.#!"
 carnival_entertainment_basic: "Divertissement de base"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ Gain faible d’[popular_opinion|El]\n\n#weak Quelques jongleurs et un chanteur suffisent.#!"
 carnival_entertainment_extensive: "Divertissement varié"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ Gain moyen d’[popular_opinion|El]\n\n#weak Engageons une troupe d’acteurs, de jongleurs, de bouffons et de ménestrels pour divertir et émerveiller le public.#!"
 carnival_entertainment_extravagant: "Divertissements fastueux"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ Gain important d’[popular_opinion|El]\n\n#weak Remplissons les places d’amuseurs venus du monde entier afin que la foule soit émerveillée et captivée par des numéros exotiques en tout genre.#!"
 go_incognito_intent: "Passer incognito"
 go_incognito_intent_desc: "Participer au carnaval en portant un masque pour se fondre dans la foule.\n#EMP #low Apprendre des [secrets|El] [secret_i] et agir sous le voile de l’anonymat."
 flaunt_wealth_intent: "Faire étalage de sa richesse"
 flaunt_wealth_intent_desc: "Enfiler un déguisement élégant et distinctif, et chercher des occasions de dépenser sans compter.\n#EMP #low Gain de [prestige|El] [prestige_i] et d’[popular_opinion|El] [popular_opinion_i]."
 activity_carnival_host_an_a: "un"
 carnival_base_cost: "Coût de base"
 activity_carnival_destination_selection: ""
 carnival_option_decoration: "Décorations de carnaval"
 carnival_option_entertainment: "Divertissement de carnaval"
 carnival_phase: "$activity_carnival$"
 carnival_phase_desc: "Voir les siens heureux, souriants et rieurs, est une joie immense."
 carnival_conc_reward_title: "Le carnaval se termine"
 carnival_conc_reward: "[ROOT.Char.Custom('FR_le_Char_U_Pi')|U][ROOT.Char.GetShortUINameNoTooltip] [ROOT.Char.LocalPlayerString('avez', 'a')] organisé un carnaval réussi"
