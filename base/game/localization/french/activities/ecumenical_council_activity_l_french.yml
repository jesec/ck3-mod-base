 ecumenical_council_type_doctrine_desc: "$EFFECT_LIST_BULLET$Les [core_tenets|El] peuvent être modifiés\n$EFFECT_LIST_BULLET$Les [doctrines|El] peuvent être modifiées\n\n#weak La vérité [GetPlayer.GetFaith.HighGodNamePossessive] ne va pas de soi lorsqu’elle est exprimée par des langues mortelles.#!"
