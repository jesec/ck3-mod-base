 activity_ecumenical_council: "Concile œcuménique"
 activity_ecumenical_council_desc: "Invoquez les grands prélats et les chefs de la chrétienté ! Notre objectif sera d’unifier les croyances et la pratique, afin de mieux glorifier [GetPlayer.GetFaith.HighGodName|U].\n\nAllons-nous nous réunir comme les Apôtres l’ont fait à Jérusalem, unis dans la foi, allons-nous faire plier l’Église sous le poids de notre orgueil ?"
 activity_ecumenical_council_destination_selection: "La [holding|El] doit être un centre religieux important."
 activity_ecumenical_council_host_desc: "$BULLET_WITH_TAB$Les [core_tenets|El] peuvent être découverts, permis, interdits ou modifiés\n$BULLET_WITH_TAB$Les [doctrines|El] peuvent être modifiées\n$BULLET_WITH_TAB$La [fervor|El] @fervor_icon! peut être augmentée\n$BULLET_WITH_TAB$Peut gagner de la [piety|El]@piety_icon!\n$BULLET_WITH_TAB$Peut gagner de l’[opinion|El]@opinion_icon! des personnages présents\n$BULLET_WITH_TAB$[trait|E] ou [trait_level_track_xp|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
 activity_ecumenical_council_guest_desc: "$activity_ecumenical_council_host_desc$"
 activity_ecumenical_council_selection_tooltip: "Inviter les personnalités les plus influentes et les plus érudites de la chrétienté à débattre de questions tant théologiques que profanes.\n\nRécompenses attendues :\n$BULLET_WITH_TAB$Changement de [core_tenet|El]\n$BULLET_WITH_TAB$Changement de [doctrine|El]\n$BULLET_WITH_TAB$[fervor|E]@fervor_icon!\n$BULLET_WITH_TAB$[piety|E]@piety_icon!\n$BULLET_WITH_TAB$[opinion|E]@opinion_icon!\n$BULLET_WITH_TAB$[trait|E] ou [trait_level_track_xp|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
