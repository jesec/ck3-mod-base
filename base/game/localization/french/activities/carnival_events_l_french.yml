 ## Event - Dead End
 carnival.1111.t: "Une impasse"
 carnival.1111.desc: "Je me bats contre l’un des assassins et ressens soudain une douleur dans la nuque : son complice m’a poignardé[ROOT.Char.Custom('FR_E')] par derrière. Je m’effondre au sol. Mes membres se dérobent sous moi et mon souffle haletant laisse des bulles de sang sur mes lèvres."
 carnival.1111.a: "Ce n’était pas censé finir ainsi."
