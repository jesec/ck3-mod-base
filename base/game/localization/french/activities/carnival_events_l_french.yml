 ## GLOSS
 carnival_GLOSS: "Le mot « carnaval » vient du latin « #EMP carnis levare#! », qui signifie « se débarrasser de la viande », et fait référence à un dernier festin avant la période d’abstinence du carême."
 carnival_patria_GLOSS: "#EMP Patria#! est un mot latin qui signifie « pays » ou « patrie ». Au Moyen Âge, le terme « #EMP patria#! » exprimait un sentiment de fierté et d’appartenance à une province, une ville ou une république."
