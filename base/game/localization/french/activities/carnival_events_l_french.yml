l_french:
 ## Event - Carnival Opening
 carnival.1001.t: "Une période merveilleuse"
 carnival.1001.desc: "Les préparatifs sont terminés.\n\nDes banderoles colorées bordent les grandes avenues, des cortèges serpentent à travers les allées et les rues de [carnival_location.GetName]. La foule se rassemble sur les places : riches ou pauvres, laids ou beaux, nous ne faisons qu’un dans cette mer de visages masqués.\n\nQuel spectacle cela va être !"
 carnival.1001.a: "Il est temps de mettre nos masques. [Glossary( '#bold Carnis levare !#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "Essayez donc de me retrouver, assassins !"
 carnival.1001.c: "Un masque cache aussi bien les défauts que les cicatrices..."
 ## Event - Carnival Closing
 carnival.1002.t: "Retour à la vie quotidienne"
 carnival.1002.desc: "Les rues sont jonchées des restes du carnaval ; décorations et masques abandonnés encombrent les caniveaux tandis que les fêtards rentrent chez eux à grand-peine. Nous avons mis nos différends de côté et, en tant que ville unie, nous avons festoyé, dansé, joué à des jeux et ri ensemble.\n\nL’éclat du carnaval restera encore un moment dans l’air comme pour nous rappeler qui nous sommes ; puis viendra le temps de retourner à nos vies habituelles, à la hiérarchie, aux tracas et aux obligations — jusqu’à ce que le carnaval revienne à nouveau."
 carnival.1002.a: "Il est temps de se mettre au travail."
 carnival.1002.b: "Et si chaque jour pouvait être comme ça ?"
 carnival.1002.c: "Ça fait du bien de retrouver un peu d’ordre."
 ## Event - A chance for mischief
 carnival.1003.t: "L’occasion de faire une petite farce"
 carnival.1003.desc: "En visite de la demeure fastueuse de [house_target.GetDynastyHouseName], j’y vois des rideaux raffinés en [house_target.Custom('RegionalFabric')], des [house_target.GetCurrentLocation.Custom('FR_get_region_flower_type_plural_Fix')] par centaines, des serviteurs à profusion et [house_target.GetTitledFirstName] qui tient des discours pompeux à sa clientèle – l’envie me prend de leur enseigner à tous un peu de modestie.\n\nCe genre de farces, n’est-ce pas là l’esprit même du carnaval ?\n\nJe devrais engager en secret quelques brutes pour :"
 carnival.1003.a: "Lancer des œufs pourris sur [house_target.GetFirstNameNoTooltip] !"
 carnival.1003.b: "Se déchaîner dans son palais, déguisés en diables."
 carnival.1003.c: "Peindre des propos déplacés sur sa famille dans les grandes avenues."
 carnival.1003.d: "À bien y réfléchir : non."
 carnival.1003.tt.reclusive_toast: "[house_member.Custom('FR_le_Char_U_Pi')|U][house_member.GetShortUIName] a trop honte pour sortir de chez [house_member.Custom('FR_LuiElle')]"
 carnival.1003.tt.lunatic_toast: "[house_member.Custom('FR_le_Char_U_Pi')|U][house_member.GetShortUIName] perd la raison"
 carnival.1003.tt.irritable_toast: "[house_member.Custom('FR_le_Char_U_Pi')|U][house_member.GetShortUIName] enrage"
 carnival.1003.throw_eggs_log_title: "Bombardés d’œufs"
 carnival.1003.throw_eggs_log: "Le manoir de la Maison [house_target.GetDynastyHouseName] a été la cible d’un jet d’œufs"
 carnival.1003.mischief.insanity.log_title: "Émeutes diaboliques"
 carnival.1003.mischief.insanity.log: "Une bande de casseurs déguisés en diables a faire perdre la raison [house_member.Custom('FR_au_Char_U_Pi')][house_member.GetShortUIName]"
 carnival.1003.mischief.irritable.log_title: "Émeutes diaboliques"
 carnival.1003.mischief.irritable.log: "Une bande de casseurs déguisés en diables a rendu [house_member.Custom('FR_le_Char_U_Pi')][house_member.GetShortUIName] [Select_CString(house_member.IsFemale,'furieuse','furieux')] et agacé[house_member.Custom('FR_E')] envers tout le monde autour d[house_member.Custom('FR_EluiElle')]."
 carnival.1003.mischief.reclusive.log_title: "Émeutes diaboliques"
 carnival.1003.mischief.reclusive.log: "Une foule de casseurs déguisés en diables a contraint [house_member.Custom('FR_le_Char_U_Pi')][house_member.GetShortUIName] à se cacher"
 ## Event - House Relations
 carnival.1004.t: "Relation de Maison"
 carnival.1004.desc: "Une ville divisée ne peut pas tenir longtemps ; il m’incombe donc de m’allier aux puissantes Maisons qui dictent la politique de [carnival_location.GetName].\n\nAu cours d’un banquet, je prends [other_house_leader01.Custom('FR_le_Char_Pi')][other_house_leader01.GetTitledFirstName] à part et j’essaie de lui faire comprendre les avantages d’une bonne relation entre ma Maison [ROOT.Char.GetDynastyHouseName] et la Maison [other_house_leader01.GetDynastyHouseName] – la sienne."
 carnival.1004.a: "Nos grands livres sont pleins, nos poches vides !"
 carnival.1004.b: "Une collaboration professionnelle est bénéfique pour nous deux."
 carnival.1004.c: "Votre Maison est nettement inférieure à la nôtre."
 carnival.1004.d: "Les relations entre nos deux Maisons devraient rester telles qu’elles sont."
 ## Event - Prank a friend
 carnival.1005.t: "Rigoler avec un ami"
 carnival.1005.desc: "Le carnaval est le moment idéal pour faire une farce à un ami — dans la bonne humeur, bien sûr.\n\nJe vois mon ami[friend.Custom('FR_E')] [friend.GetTitledFirstName] discuter avec le [bystander.GetName] et quelques idées me viennent aussitôt en tête !"
 carnival.1005.a: "Leur lancer un défi : un duel au bâton de bois !"
 carnival.1005.b: "L’aborder déguisé[ROOT.Char.Custom('FR_E')] et lui parler dans une langue inventée."
 carnival.1005.c: "Je vais leur lancer des œufs peints remplis de parfum !"
 carnival.1005.d: "Non. Je ne devrais pas leur imposer mes plaisanteries."
 carnival.1005.tt.stick_success.desc: "Vous passez un bon moment à vous battre avec un bâton"
 carnival.1005.tt.stick_failure.desc: "Vous y allez un peu trop fort quand vous jouez"
 carnival.1005.tt.success.desc: "Tout le monde rit de votre performance"
 carnival.1005.tt.failure.desc: "Vos victimes vous traitent d’âne stupide"
 carnival.1005.tt.disguise_success.desc: "Vous amusez vos spectateurs"
 carnival.1005.tt.disguise_failure.desc: "Vous déconcertez et agacez vos spectateurs"
 carnival.1005.tt.success.toast: "Tout le monde a ri de votre performance"
 carnival.1005.tt.failure.toast: "Vos victimes vous ont traité d’âne stupide"
 carnival.1005.tt.egg_success.toast: "Votre ami[friend.Custom('FR_E')] a adoré cette surprise parfumée"
 carnival.1005.tt.egg_failure.toast: "Votre ami[friend.Custom('FR_E')] a détesté cette odeur."
 ## Event - The entertainer
 carnival.1006.t: "Les artistes"
 carnival.1006.desc: "Le carnaval est le moment fort pour les artistes de tous horizons. J’écoute un groupe de musiciens talentueux qui racontent des histoires avec leurs voix, leurs vers et leurs instruments."
 carnival.1006.a: "Payer les musiciens pour qu’ils chantent des chansons sur ma grandeur !"
 carnival.1006.b: "Je vais faire appel à un intermédiaire qui recrutera les meilleurs d’entre eux."
 carnival.1006.c: "Je devrais demander une mélodie populaire."
 carnival.1006.d: "Inviter [Select_CString(dancer_character.IsFemale,'une femme','un homme')] qui se trouve à proximité à danser !"
 cooltip.carnival.1006.bawdy_song.tt: "Demander une chanson grivoise"
 cooltip.carnival.1006.patriotic_song.tt: "Demander une chanson à propos de la [Glossary( '#bold patria#!', 'carnival_patria_GLOSS' )] !"
 cooltip.carnival.1006.spiritual_song.tt: "Demander une chanson spirituelle"
 carnival.1006.tt.dance_success.desc: "[Select_CString(dancer_character.IsFemale,'La femme','L’homme')] accepte l’invitation à danser"
 carnival.1006.tt.dance_failure.desc: "[Select_CString(dancer_character.IsFemale,'La femme','L’homme')] décline l’invitation à danser"
 carnival.1006.tt.dance_success.toast: "Vous dansez avec [dancer_character.GetFirstNameNoTooltip]"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip] refuse de danser avec vous."
 carnival.1006.bawdy_song.tt.toast: "Vous obtenez une chanson grivoise !"
 carnival.1006.patriotic_song.tt.toast: "Vous obtenez une chanson à propos de la [Glossary( '#bold patria#!', 'carnival_patria_GLOSS' )] !"
 carnival.1006.spiritual_song.tt.toast: "Vous obtenez une chanson spirituelle !"
 carnival.1006.recruit_entertainer.log_title: "Artiste recruté"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip] a recruté [entertainer_character.GetFirstNameNoTooltip]"
 ## Event - Learning to juggle
 carnival.1007.t: "Apprendre à jongler"
 carnival.1007.desc: "Des ménestrels, des jongleurs et des bouffons divertissent les passants le long de la rue principale de [carnival_location.GetName]. Ce sont surtout les jongleurs qui attirent mon attention. Il est difficile de ne pas admirer la maîtrise dont ils font preuve avec ces couteaux et ces balles qui virevoltent dans les airs.\n\nL’un des jongleurs s’avance et me demande si j’ai envie de m’y essayer, juste pour le plaisir.\n\n« Une, deux ou trois balles... Combien pouvez-vous en garder en l’air, [ROOT.Char.Custom('MistressMaster')|U] ? »"
 carnival.1007.a: "Je parie avec n’importe qui que je peux faire tourner trois balles en l’air !"
 carnival.1007.b: "Deux balles suffisent amplement."
 carnival.1007.c: "Et si je prenais plutôt deux de ces couteaux ?"
 carnival.1007.d: "Je ne m’abaisse pas à ce genre de futilités."
 carnival.1007.juggling_success.tt.toast: "Jonglage réussi"
 carnival.1007.juggling_fail.tt.toast: "Balles tombées"
 carnival.1007.juggling_athletic.tt.toast: "Le jonglage est un excellent moyen d’entraîner son corps et ses sens"
 carnival.1007.juggling_k.success.tt.toast: "Jonglage de couteaux réussi"
 carnival.1007.juggling_k.fail.tt.toast: "Vous vous coupez en jonglant avec les couteaux"
 carnival.1007.blademaster.log_title: "Fascination pour les lames"
 carnival.1007.blademaster.log: "Après s’être essayé[carnival_main.Custom('FR_E')] au jonglage avec des couteaux, [carnival_main.GetFirstNameNoTooltip] a pris goût à jouer avec des lames tranchantes"
 ## Event - A wild dance
 carnival.1008.t: "Une danse endiablée"
 carnival.1008.desc: "La place centrale est une véritable marée de danseurs masqués, où la musique se mêle aux éclats de rire. Des inconnus se rencontrent puis se séparent à nouveau, au gré des partenariats qui se forment et se défont au rythme de cette danse tourbillonnante.\n\nJe me tiens au bord de la place dans cette ambiance contagieuse !"
 carnival.1008.a: "« Je récompenserai les meilleurs danseurs avec de l’or ! »"
 carnival.1008.b: "DANSER, DANSER... jusqu’à ce que mes jambes ne tiennent plus !"
 carnival.1008.c: "Que la danse me mène où bon lui semble."
 carnival.1008.d: "Je vais simplement profiter du spectacle."
 carnival.1008.strong.tt.toast: "Jambes dansantes"
 carnival.1008.exhausted.tt.toast: "La danse vous a épuisé[GetPlayer.Custom('FR_E')] !"
 carnival.1008.hurt.tt.toast: "Vous vous blessez en dansant !"
 ## Event - A drink with a craftsman
 carnival.1009.t: "Trinquer avec un maître [craftsman_character.Custom('CraftsmanDescOption')|l]"
 carnival.1009.desc: "Dans l’une des belles boutiques de la rue des [craftsman_character.Custom('CraftsmanDescOption')|l]s, je m’entretiens avec un maître artisan.\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.Custom('FR_IlElle')|U] est ravi[craftsman_character.Custom('FR_E')] de rencontrer [carnival_host.Custom('FR_le_Char_L')][carnival_host.GetTitleAsNameNoTooltip|l] en personne."
 carnival.1009.1_b.desc: "Caché[ROOT.Char.Custom('FR_E')] derrière mon masque, je suis sûr[ROOT.Char.Custom('FR_E')] qu’[craftsman_character.Custom('FR_IlElle')] ne découvrira pas qui je suis."
 carnival.1009.2_a.desc: "J’écoute avec intérêt tandis qu’[craftsman_character.Custom('FR_IlElle')] se plaint de la mauvaise gestion de la ville et qu’[craftsman_character.Custom('FR_IlElle')] reproche [carnival_host.Custom('FR_au_Char_L')][carnival_host.GetTitleAsNameNoTooltip|l] d’être responsable de la situation de son commerce."
 carnival.1009.2_b.desc: "J’écoute avec intérêt tandis qu’[craftsman_character.Custom('FR_IlElle')] félicite [carnival_host.Custom('FR_le_Char_L')][carnival_host.GetTitleAsNameNoTooltip|l] pour sa bonne gestion de la ville et lève sa chope à sa santé."
 carnival.1009.2_c.desc: "Comme [craftsman_character.Custom('FR_IlElle')] est très satisfait[craftsman_character.Custom('FR_E')] de la gestion de la ville, [craftsman_character.Custom('FR_IlElle')] ne tarit pas d’éloges à mon égard."
 carnival.1009.2_d.desc: "[craftsman_character.Custom('FR_IlElle')|U] se tait, puis déclare d’un ton maussade que les choses ont été un peu difficiles ces derniers temps."
 carnival.1009.a: "Je vais en tenir compte et redoubler d’efforts."
 carnival.1009.b: "Je vais envoyer les gardes en faire un exemple."
 carnival.1009.c: "« Alors, occupez-vous-en, [Select_CString(craftsman_character.IsFemale,'conseillère','conseiller')] ! »"
 carnival.1009.d: "Je dois révéler qui je suis et m’engager à faire davantage pour la ville."
 carnival.1009.e: "C’est le premier compliment sincère que j’entends depuis des mois."
 carnival.1009.f: "Je le savais ! Pas besoin de se préoccuper des affaires de la ville."
 carnival.1009.g: "Comme je m’y attendais. Je devrais ériger une statue en mon honneur."
 carnival.1009.h: "Convaincre l’artisan[craftsman_character.Custom('FR_E')] de dire ce qu’[craftsman_character.Custom('FR_IlElle')] pense"
 carnival.1009.i: "« Des forces cachées s’infiltrent dans notre ville, mon ami[craftsman_character.Custom('FR_E')]. »"
 carnival.1009.j: "« Je mérite bien une récompense pour tout ce travail, non ? »"
 carnival.1009.k: "« Toute la République peut s’attribuer le mérite de notre immense bonheur ! »"
 carnival.1009.l: "J’acquiesce d’un signe de tête et avale d’un trait mon verre [ROOT.Char.Custom('RegionalDrink')]."
 carnival.1009.m: "Je ne suis pas venu[ROOT.Char.Custom('FR_E')] ici pour bavarder, mais pour me battre !"
 carnival.1009.n: "« Apprenez-moi quelque chose sur votre métier, ô maître [craftsman_character.Custom('CraftsmanDescOption')|l] ! »"
 carnival.1009.o: "Recruter le maître via un intermédiaire."
 carnival.1009.p: "« C’est moi qui vous offre à boire, mon ami[craftsman_character.Custom('FR_E')]. »"
 custom.carnival.1009.spreading_ill_rumors: "Chaque [courtier|El] d’une autre [culture|El] ou [faith|El]"
 custom.carnival.1009.shared_praise: "Chaque [courtier|El]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.Custom('FR_le_Char_U_Pi')|U][craftsman_character.GetShortUIName|U] a gagné une [inspiration|El] d’#V artisan#!"
 carnival.1009.drunk.tt.toast: "Vous vous abandonnez à la boisson"
 carnival.1009.tasty.tt.toast: "Mmm, quel régal !"
 carnival.1009.skillup.tt.toast: "Vous avez appris auprès du maître artisan"
 carnival.1009.patron.tt.toast: "Associé gagné"
 carnival.1009.councilor.log_title: "Nouveau conseiller"
 carnival.1009.councilor.log: "[craftsman_character.Custom('FR_le_Char_U_Pi')|U][craftsman_character.GetShortUIName|U] a été nommé[craftsman_character.Custom('FR_E')] [Concept('councillor', Select_CString(craftsman_character.IsFemale,'conseillère','conseiller'))|E]"
 carnival.1009.recruiting.log_title: "Maître [craftsman_character.Custom('CraftsmanDescOption')|l] recruté"
 carnival.1009.recruiting.log: "[craftsman_character.Custom('FR_le_Char_U_Pi')|U][craftsman_character.GetShortUIName|U] a été recruté[craftsman_character.Custom('FR_E')] par [carnival_main.GetFirstNameNoTooltip]"
 carnival.1009.learning_trade.log_title: "A appris auprès d’un maître artisan"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip] a acquis des connaissances auprès d’un maître [craftsman_character.Custom('CraftsmanDescOption')|l]"
 ## A drink with a craftsman - Different Craftsmen nick
 carnival.1009.customloc01: "Forgeron"
 carnival.1009.customloc02: "Menuisier"
 carnival.1009.customloc03: "Maçon"
 carnival.1009.customloc04: "Tisserand"
 carnival.1009.customloc05: "Orfèvre"
 carnival.1009.customloc06: "Tanneur"
 carnival.1009.customloc07: "Chandelier"
 carnival.1009.customloc08: "Tonnelier"
 carnival.1009.customloc09: "Armurier"
 ## Event - the duel
 carnival.1010.t: "Le duel"
 carnival.1010.desc: "Deux inconnus masqués se mettent en position de combat, tandis que la foule s’écarte pour laisser les deux adversaires tourner l’un autour de l’autre — couteaux en main ! La haine qui brille dans leurs yeux laisse présager qu’ils ne se contenteront pas de verser un peu de sang."
 carnival.1010.a.desc: "\n\nJe ne suis qu’un masque de plus dans la foule."
 carnival.1010.b.desc: "Maintenant que j’ai été remarqué[ROOT.Char.Custom('FR_E')], la foule attend de voir si je vais intervenir."
 carnival.1010.a: "Appeler les gardes pour mettre fin au duel"
 carnival.1010.b: "Les convaincre d’arrêter"
 carnival.1010.c: "Leur ordonner d’arrêter"
 carnival.1010.d: "Laisser le duel se poursuivre"
 cooltip.carnival.1010_duel_diplomacy_success: "Vous arrêtez le duel"
 cooltip.carnival.1010_duel_diplomacy_fail: "Vous échouez à arrêter le duel"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.Custom('FR_le_Char_U_Pi')|U][duelist_02.GetShortUIName] perd le duel et pourrait être blessé[duelist_02.Custom('FR_E')] ou tué[duelist_02.Custom('FR_E')]."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.Custom('FR_le_Char_U_Pi')|U][duelist_01.GetShortUIName] perd le duel et pourrait être blessé[duelist_01.Custom('FR_E')] ou tué[duelist_01.Custom('FR_E')]."
 carnival.1010.duel_d01_win.desc: "[duelist_01.Custom('FR_le_Char_U_Pi')|U][duelist_01.GetShortUIName] remporte le duel"
 carnival.1010_duel_d02_win.desc: "[duelist_02.Custom('FR_le_Char_U_Pi')|U][duelist_02.GetShortUIName] remporte le duel"
 carnival.1010_duel_guards_success.desc: "Les gardes arrivent en courant"
 carnival.1010_duel_guards_fail.desc: "Les gardes arrivent trop tard"
 carnival.1010_duel_guards_success_toast: "Les gardes mettent fin au duel"
 carnival.1010_duel_guards_failure_toast: "Les gardes arrivent trop tard pour arrêter le duel"
 carnival.1010_duel_diplomacy_success_toast: "Vous arrêtez le duel"
 carnival.1010_duel_diplomacy_fail_toast: "Vous avez échoué à arrêter le duel"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.Custom('FR_le_Char_U_Pi')|U][duelist_01.GetShortUIName] a été blessé[duelist_01.Custom('FR_E')] dans le duel"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.Custom('FR_le_Char_U_Pi')|U][duelist_01.GetShortUIName] a été tué[duelist_01.Custom('FR_E')] dans le duel"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.Custom('FR_le_Char_U_Pi')|U][duelist_02.GetShortUIName] a été blessé[duelist_02.Custom('FR_E')] dans le duel"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.Custom('FR_le_Char_U_Pi')|U][duelist_02.GetShortUIName] a été tué[duelist_02.Custom('FR_E')] dans le duel"
 carnival.1010.duel_stop.log_title: "A mis fin à un duel"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip] a arrêté un duel entre [duelist_01.GetFirstNameNoTooltip] et [duelist_02.GetFirstNameNoTooltip]"
 carnival.1010.duel_continue.log_title: "Échec à arrêter un duel"
 carnival.1010.duel_continue.log: "[carnival_main.Custom('FR_le_Char_U_Pi')|U][carnival_main.GetShortUIName|U] n’est pas parvenu[carnival_main.Custom('FR_E')] à arrêter un duel entre [duelist_01.Custom('FR_le_Char_U_Pi')][duelist_01.GetShortUIName] et [duelist_02.Custom('FR_le_Char_U_Pi')][duelist_02.GetShortUIName]"
 ## Event - Gracious Host
 carnival.1011.t: "Digne hôte"
 carnival.1011.desc: "Le carnaval est une excellente occasion de faire étalage de ma richesse et de mon bon goût en ouvrant les portes de mon palais. Tout en discutant de cela avec [house_member01.GetFirstNameNoTooltip], je réfléchis aux personnes que je vais inviter. [house_member01.Custom('FR_IlElle')|U] a quelques bonnes suggestions, mais c’est à moi que revient la décision finale."
 carnival.1011.a: "Décorons tout le palais et ne regardons pas à la dépense !"
 carnival.1011.b: "Ouvrons les portes aux pauvres !"
 carnival.1011.c: "N’invitons que les invités les plus éminents !"
 carnival.1011.d: "Gardons-le uniquement pour la famille élargie."
 ## Event - Puppet theater
 carnival.1012.t: "Théâtre de marionnettes"
 carnival.1012.desc: "Les roturiers adorent leurs spectacles de marionnettes et regardent bouche bée ces pièces burlesques et grivoises. Des marionnettes grotesques sculptées en parodie de tous les milieux sociaux ; elles forniquent, se battent, se chamaillent et se retrouvent dans toutes sortes de situations improbables.\n\nLe carnaval de [carnival_location.GetName] a attiré toute une série de ces marionnettistes et, bien que le peuple les adore, les [carnival_host.GetFaith.PriestNeuterPlural] s’inquiètent du caractère vulgaire de ce divertissement."
 carnival.1012.a: "J’assisterai aux spectacles en secret."
 carnival.1012.b: "Soudoyer un spectacle pour monter ma propre pièce !"
 carnival.1012.c: "J’assisterai officiellement aux spectacles !"
 carnival.1012.d: "Censurer discrètement les amuseurs en coulisses"
 carnival.1012.e: "Interdire ces spectacles vulgaires"
 ## Event - The Mask Maker
 carnival.1013.t: "Le fabricant de masques"
 carnival.1013.desc: "En traversant une cour déserte, je tombe sur [Select_CString(mask_maker.IsFemale,'une vieille femme','un vieil homme')] qui sculpte un masque. À côté d[mask_maker.Custom('FR_EluiElle')] se trouve un étal rempli de ses créations : des rangées de masques de toutes sortes.\n\nCe travail artisanal est vraiment magnifique."
 carnival.1013.a: "Tout acheter et les distribuer à tous ceux que je croise !"
 carnival.1013.b: "Fournir au fabricant de masques les fonds pour monter un atelier"
 carnival.1013.c: "M’acheter un masque magnifique"
 carnival.1013.d: "M’acheter un masque terrifiant"
 carnival.1013.maskmaker_workshop.log_title: "Investissement dans l’atelier d’un fabricant de masques"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.Custom('FR_le_Char_U_Pi')|U][carnival_main.GetShortUIName] a aidé un fabricant de masques à monter un atelier"
 ## Event - Holy Fools
 carnival.1014.t: "Parodie religieuse"
 carnival.1014.desc: "Une parodie de procession religieuse défile dans la rue. Ils portent des tenues qui ridiculisent les prêtres, les moines et même les plus hauts dignitaires de notre foi ! Le clergé est ridiculisé en public."
 carnival.1014_2.a.desc: "\n\nJe reste caché[ROOT.Char.Custom('FR_E')] dans la foule."
 carnival.1014_2.b.desc: "\n\nLes gens attendent que je réagisse."
 carnival.1014.a: "Appeler discrètement les gardes pour mettre fin à cette mascarade"
 carnival.1014.b: "Condamnez-les pour leur dépravation !"
 carnival.1014.c: "Participer à la moquerie"
 carnival.1014.d: "Se fondre dans la foule"
 carnival.1014.e: "Je n’ai pas autant ri depuis des années !"
 cooltip.carnival.1014.non_believer: "#weak #EMP Perte de [stress|El] en raison de votre [secret|El] d’incroyance#!#!"
 carnival.1014.secret.tt.toast: "Vous vous rendez compte que vous n’avez jamais vraiment eu la foi"
 carnival.1014.mockery.tt.toast: "Vous ressentez à la fois de la culpabilité et du soulagement"
 ## Event - The Cat
 carnival.1015.t: "Le chat"
 carnival.1015.desc: "Une petite ombre m’a suivi[ROOT.Char.Custom('FR_E')] toute la journée. À chaque coin de rue, deux yeux brillants et un « miaou » rauque m’attendent.\n\n« On dirait que vous avez trouvé un compagnon », dit [observer_01.Custom('FR_le_Char_Pi')][observer_01.GetTitledFirstName] en riant, tandis que le chat vient à nouveau se frotter contre ma jambe."
 carnival.1015.a: "On dirait bien que c’est le destin !"
 carnival.1015.b: "« Je suis sûr[ROOT.Char.Custom('FR_E')] qu’il préfèrerait rester avec vous. »"
 carnival.1015.c: "[family_member01.Custom('FR_le_Char_Pi')|U][family_member01.GetTitledFirstName] a besoin de compagnie..."
 carnival.1015.adopt_cat.log_title: "Chat adopté"
 carnival.1015.adopt_cat.log: "[carnival_main.Custom('FR_le_Char_U_Pi')|U][carnival_main.GetShortUIName] a adopté un chat"
 ## Event - Lover's mask
 carnival.1016.t: "Le masque d’[Select_CString(woo_character.IsFemale,'une amante','un amant')]"
 carnival.1016.desc: "Entièrement emporté[ROOT.Char.Custom('FR_E')] par l’ambiance festive, je déambule dans les rues de [carnival_location.GetName] et j’entends la musique résonner dans les allées, tandis que les fêtards sortent des tavernes pour envahir les rues. Partout, roturiers et patriciens se côtoient, et les rangs ainsi que les privilèges sont remplacés par des masques.\n\nQuelqu’un me tape sur l’épaule et je vois derrière moi [Select_CString(woo_character.IsFemale,'une femme masquée','un homme masqué')]. [woo_character.Custom('FR_IlElle')|U] prend une pose théâtrale et glousse. Lorsqu’[woo_character.Custom('FR_IlElle')] écarte son masque un instant, je reconnais [woo_character.Custom('FR_le_Char_Pi')][woo_character.GetTitledFirstNameNoTooltip]\n\n« Soyez [ROOT.Char.Custom('FR_LeLa')] bienvenu[ROOT.Char.Custom('FR_E')], [ROOT.Char.Custom('FR_MonseigneurMadame')|U]. Voulez-vous passer la soirée avec moi ? Juste deux inconnus masqués profitant du carnaval », dit-[woo_character.Custom('FR_IlElle')] en s’inclinant avec une courtoisie exagérée."
 carnival.1016.a: "Quelle charmante surprise ! Montrez-moi le chemin, « [Select_CString(woo_character.IsFemale,'étrangère','étranger')] »."
 carnival.1016.b: "Je serais ravi[ROOT.Char.Custom('FR_E')] qu’un[woo_character.Custom('FR_E')] #BOLD ami[woo_character.Custom('FR_E')]#! m’accompagne."
 carnival.1016.c: "Et nous devrions rester des étrangers."
 ## Event - In candle light
 carnival.1017.t: "À la lueur des bougies"
 carnival.1017.desc: "Je découvre [intent_target.Custom('FR_le_Char_Pi')][intent_target.GetTitledFirstNameNoTooltip] dans une taverne tranquille. Dehors, le carnaval bat son plein, mais à l’intérieur, l’ambiance est chaleureuse – et éclairée à la lueur des bougies. [intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstNameNoTooltip] est en train de lire lorsque j’entre, les sourcils froncés par la concentration.\n\nJe suis certain[ROOT.Char.Custom('FR_E')] qu’une conversation pleine d’esprit saura attirer son attention sur mes charmes."
 carnival.1017.a: "L’impressionner avec mes connaissances en littérature"
 carnival.1017.b: "Lui faire oublier le livre avec des plaisanteries pleines d’esprit"
 carnival.1017.c: "Lui demander si je peux lire le livre après [intent_target.Custom('FR_LuiElle')]"
 carnival.1017.a.tt.failure.desc: "Un bon livre pour quelqu’un de simple"
 carnival.1017.a.tt.success.desc: "Cela me rappelle un autre livre"
 carnival.1017.b.tt.success.desc: "Je détourne son attention du livre"
 carnival.1017.a.tt.success.toast: "Vos connaissances attirent l’attention [intent_target.Custom('FR_du_Char_Pi')][intent_target.GetTitledFirstName]"
 carnival.1017.a.tt.failure.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstName] vous a trouvé [Select_CString(intent_target.IsFemale,'ennuyeuse et pompeuse','ennuyeux et pompeux')]"
 carnival.1017.b.tt.success.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstName] a tout oublié du livre"
 carnival.1017.b.tt.failure: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstName] n’a pas levé le nez de son livre"
 carnival.1017.b.tt.failure.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstName] a trouvé votre humour moins attirant que son livre"
 carnival.1017.c.tt.toast: "Vous et [intent_target.Custom('FR_le_Char_Pi')][intent_target.GetTitledFirstName] tissez des liens en discutant d’un livre intéressant"
 ## Event - Flowers & song
 carnival.1018.t: "Amour et jeux"
 carnival.1018.desc: "Une foule s’est rassemblée sur la place pour assister aux épreuves de force et d’adresse. Des compétitions telles que la lutte, les courses et le tir à la corde se déroulent sous les acclamations des spectateurs. L’ambiance est joyeuse et détendue.\n\n[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstName] semble impressionné[intent_target.Custom('FR_E')] par les prouesses démontrées. Son regard se pose sur [contender.Custom('FR_le_Char_Pi')][contender.GetTitledFirstName]. Si je veux gagner ses faveurs, je vais devoir trouver un moyen de [contender.Custom('FR_LeLa')] surpasser."
 carnival.1018.a: "Je l’écraserai à la lutte !"
 carnival.1018.b: "Peut-être pourrais-je [contender.Custom('FR_LeLa')] convaincre de simuler une chute ?"
 carnival.1018.c: "[contender.Custom('FR_LeLa')|U] ridiculiser devant [intent_target.Custom('FR_le_Char_Pi')][intent_target.GetTitledFirstNameNoTooltip]"
 carnival.1018.d: "Je ne pense pas que je devrais participer à cette compétition."
 carnival.1018.a.success.desc: "Vous vainquez [contender.GetFirstNameNoTooltip]"
 carnival.1018.a.success.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstNameNoTooltip] est impressionné[intent_target.Custom('FR_E')] par vos prouesses"
 carnival.1018.a.failure: "Vous êtes plaqué[ROOT.Char.Custom('FR_E')] au sol"
 carnival.1018.a.failure.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstNameNoTooltip] oublie que vous existez"
 carnival.1018.b.success: "Vous arrivez à donner une impression de réalisme"
 carnival.1018.b.success.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstNameNoTooltip] vous salue comme [Select_CString(ROOT.Char.IsFemale,'championne','champion')]"
 carnival.1018.b.failure: "Il est manifeste que la compétition est truquée"
 carnival.1018.b.failure.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstNameNoTooltip] vous traite d’escroc"
 carnival.1018.c.toast: "[intent_target.Custom('FR_le_Char_Pi')|U][intent_target.GetTitledFirstNameNoTooltip] est amusé[intent_target.Custom('FR_E')] et sous le charme"
 ## Event - A mask in the crowd
 carnival.1019.t: "Des masques dans la foule"
 carnival.1019.desc: "Je ne cesse de voir le même masque dans la foule. Alors que je me fraie un chemin dans la rue, j’aperçois sans cesse, au milieu de cette multitude de masques, le même visage figé d’un bouffon grimaçant. Serais-je suivi[ROOT.Char.Custom('FR_E')] ? Cette idée me glace le sang.\n\nJe sors de la rue principale – les hommes masqués me suivent. Je suis sûr[ROOT.Char.Custom('FR_E')] qu’ils veulent me faire du mal !"
 carnival.1019.a: "Préparer une attaque"
 carnival.1019.b: "Les attirer vers un groupe de gardes"
 carnival.1019.c: "Crier à l’aide"
 cooltip.carnival.1019.tt.assassination_success: "Vous tuez votre agresseur"
 cooltip.carnival.1019.tt.assassination_fended: "Vous blessez votre agresseur"
 cooltip.carnival.1019.tt.assassination_captured: "L’agresseur est emprisonné"
 cooltip.carnival.1019.tt.assassination_scream: "Vos cris font disperser les assassins"
 carnival.1019.tt.assassination_success.desc: "Vous tuez votre agresseur"
 carnival.1019.tt.assassination_fended.desc: "Vous repoussez votre agresseur"
 carnival.1019.tt.assassination_wounded.desc: "Vous êtes blessé[GetPlayer.Custom('FR_E')]"
 carnival.1019.tt.assassination_killed.desc: "Votre agresseur vous tue"
 carnival.1019.tt.assassination_gotaway.desc: "Vous réussissez à vous échapper"
 carnival.1019.tt.assassination_cornered.desc: "Vous êtes acculé[GetPlayer.Custom('FR_E')]"
 carnival.1019.tt.assassination_captured.desc: "Les gardes capturent l’assassin"
 carnival.1019.tt.assassination_fended_toast: "Vous avez poignardé votre poursuivant et vous vous êtes enfui[GetPlayer.Custom('FR_E')] dans les ruelles"
 carnival.1019.tt.assassination_wounded_toast: "Votre agresseur vous blesse et se faufile dans l’ombre"
 carnival.1019.tt.assassination_success_toast: "L’aspirant assassin [murder_01.GetFirstNameNoTooltip] est mort"
 carnival.1019.tt.assassination_gotaway_toast: "Vous avez échappé à vos agresseurs"
 carnival.1019.tt.assassination_captured_toast: "L’assassin [murderer_01.GetFirstNameNoTooltip] est jeté[murderer_01.Custom('FR_E')] au cachot."
 ## Event - Thundering hooves
 carnival.1020.t: "Sabots tonitruants"
 carnival.1020.desc: "[murder_victim.Custom('FR_le_Char_Pi')|U][murder_victim.GetTitledFirstNameNoTooltip] quitte un banquet lorsque je l’aperçois avec s[murder_victim.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip].\n\nJe retiens mon cheval et attends que [murder_victim.GetFirstNameNoTooltip] prenne congé de l’hôte. Ma cible ne se rend pas compte du danger qui la guette au bout de la rue.\n\nC’est un moment propice, mais des innocents risquent d’être blessés."
 carnival.1020.a: "Je vais les fendre tous les deux quand je passerai à cheval."
 carnival.1020.b: "En avant [ROOT.Char.Custom('WarhorseStoryName')] ! Ils apprendront qu’il faut me craindre."
 carnival.1020.c: "Je vais renverser [murder_victim.GetFirstNameNoTooltip]. Un terrible accident."
 carnival.1020.d: "Je fais un signe aux hommes que j’ai recrutés pour abattre ma proie."
 carnival.1020.e: "Pas aujourd’hui, le risque est trop grand."
 carnival.1020.tt.horse.hit.desc: "La victime est écrasée sous les sabots"
 carnival.1020.tt.horse.miss.desc: "Le cheval rate sa cible"
 carnival.1020.tt.horse.hit.toast: "La victime a été écrasée sous les sabots"
 carnival.1020.tt.horse.miss.toast: "Le cheval a raté sa cible"
 carnival.1020.murder_horse.log_title: "Furie d’un cheval de bataille"
 carnival.1020.murder_horse.log: "[carnival_main.Custom('FR_le_Char_U_Pi')|U][carnival_main.GetShortUIName] a terrassé [murder_victim.Custom('FR_le_Char_U_Pi')][murder_victim.GetShortUIName] avec son cheval de bataille, [carnival_main.Custom('WarhorseStoryName')]"
 carnival.1020.accident.log_title: "Terrible accident"
 carnival.1020.accident.log: "[murder_victim.Custom('FR_le_Char_U_Pi')|U][murder_victim.GetShortUIName] est décédé[murder_victim.Custom('FR_E')] après avoir été piétiné[murder_victim.Custom('FR_E')] par un cheval lors d’un terrible accident"
 carnival.1020.both_accident.log_title: "Terrible accident"
 carnival.1020.both_accident.log: "Lors d’un terrible accident, [murder_victim.Custom('FR_le_Char_U_Pi')][murder_victim.GetShortUIName] et [bystander.Custom('FR_le_Char_U_Pi')][bystander.GetShortUIName] ont été [Select_CString(And(murder_victim.IsFemale, bystander.IsFemale), 'piétinées', 'piétinés')] à mort par un cheval."
 carnival.1020.bystander_accident.log_title: "Terrible accident"
 carnival.1020.bystander_accident.log: "[bystander.Custom('FR_le_Char_U_Pi')|U][bystander.GetShortUIName] est décédé[bystander.Custom('FR_E')] après avoir été piétiné[bystander.Custom('FR_E')] par un cheval lors d’un terrible accident"
 carnival.1020.sword.log_title: "Meurtre à dos de cheval"
 carnival.1020.sword.log: "[murder_victim.Custom('FR_le_Char_U_Pi')|U][murder_victim.GetShortUIName] et [bystander.Custom('FR_le_Char_U_Pi')][bystander.GetShortUIName] ont été [Select_CString(And(murder_victim.IsFemale, bystander.IsFemale), 'coupées', 'coupés')] en deux par un cavalier."
 carnival.1020.miss.log_title: "[murder_victim.Custom('FR_le_Char_U_Pi')|U][murder_victim.GetShortUIName] a failli être écrasé[murder_victim.Custom('FR_E')] par un cheval"
 carnival.1020.miss.log: "[murder_victim.Custom('FR_le_Char_U_Pi')|U][murder_victim.GetShortUIName] affirme que [carnival_main.Custom('FR_le_Char_U_Pi')][carnival_main.GetShortUIName] a tenté de [murder_victim.Custom('FR_LeLa')] piétiner avec un cheval"
 ## Event - The Arrow
 carnival.1021.t: "La flèche"
 carnival.1021.desc: "Mon poste d’observation est calme, à l’exception du craquement du bois et des bruits de la rue qui filtrent doucement à travers les volets. Dehors, dans la cour en contrebas, ma cible, [murder_victim.GetFirstNameNoTooltip], ne se doute pas que je l’observe – ni de la présence de mon [SCOPE.Custom('UniqueBowOrJustBow')].\n\nJ’ai une brute à mes côtés, [bandit_01.GetFirstNameNoTooltip], au cas où j’aurais besoin d’un coup de main.\n\nAlors que je tends la corde de mon arc, [murder_victim.GetFirstNameNoTooltip] lève les yeux et scrute les fenêtres !"
 carnival.1021.a: "Tirer avant qu’[murder_victim.Custom('FR_IlElle')] me voie"
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip], tirez. Je couvre la voie de retraite."
 carnival.1021.c: "Rester caché et attendre une meilleure occasion"
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip] tue la mauvaise personne"
 carnival.1021.tt.arrow.hit.desc: "La flèche atteint votre cible"
 carnival.1021.tt.arrow.miss.desc: "La flèche rate sa cible et celle-ci vous aperçoit"
 carnival.1021.tt.thug.arrow.hit.desc: "La flèche atteint votre cible"
 carnival.1021.tt.thug.arrow.miss.desc: "La flèche a touché la mauvaise cible"
 carnival.1021.tt.arrow.hit.toast: "La flèche a touché la cible"
 carnival.1021.tt.arrow.miss.toast: "La flèche a raté la cible et vous êtes repérés !"
 carnival.1021.tt.thug.arrow.hit.toast: "La flèche de la brute a touché la cible"
 carnival.1021.tt.thug.arrow.miss.toast: "La flèche de la brute a touché la mauvaise cible !"
 carnival.1021.arrow.log_title: "Archer inconnu"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip] a été tué[murder_victim.Custom('FR_E')] par la flèche d’un archer inconnu"
 ## Event - Procession of My Own
 carnival.1022.t: "Ma propre procession"
 carnival.1022.desc: "La ville finance le carnaval pour le bien de tous. Bien qu’il y ait suffisamment d’or pour des divertissements convenables, un citoyen influent et fortuné pourrait contribuer à la splendeur de nos festivités.\n\nSi j’apportais ma contribution, mes pairs en seraient verts de jalousie et, aux yeux de mes subordonnés, je resplendirais comme un patricien d’autrefois. Tels les grands seigneurs des anciennes cités-États qui faisaient étalage de leur richesse ! Si je finançais un cortège glorieux, mon nom serait sur toutes les lèvres !\n\n#BOLD Mais quel devrait en être le thème ?#!"
 carnival.1022.a: "Une #BOLD belle#! procession qui honore mes accomplissements !"
 carnival.1022.b: "Une procession #BOLD intimidante#! pour susciter la peur et le respect !"
 carnival.1022.c: "Une procession #BOLD religieuse#! pour montrer ma piété !"
 carnival.1022.d: "À bien y réfléchir, j’ai de meilleures façons de dépenser mon or."
 custom.carnival.1022.guestopinion: "Chaque invité au carnaval"
 custom.zealot_carnival.1022.guestopinion: "Chaque invité [GetVassalStance( 'zealot' ).GetTextIcon|l] au carnaval"
 ## Event - Legacy in marble
 carnival.1023.t: "Un héritage de marbre"
 carnival.1023.desc: "Depuis mon enfance j’entends des récits sur les anciennes cités-États. Les patriciens étaient de grands mécènes des arts. Même si les somptueux édifices de ce passé glorieux ne sont plus aujourd’hui que des ruines, l’art et la beauté restent une source d’inspiration. En finançant des artistes, je peux inscrire mon nom au sein de cette illustre société.\n\nMa renommée survivrait à mon existence terrestre !\n\nQue les gens contemplent la beauté revêtue de marbre, de pierre et de bois, et de toutes les couleurs de l’arc-en-ciel ! Pour la gloire de la [Glossary( '#bold patria#!', 'carnival_patria_GLOSS' )], la vénération de nos ancêtres et le prestige de la Maison [ROOT.Char.GetDynastyHouseName] !"
 carnival.1023.a: "Financer un concours pour jeunes artistes"
 carnival.1023.b: "Commander de nouvelles fresques et décorations pour une place publique"
 carnival.1023.c: "Commander un ensemble de statues représentant les fondateurs de la ville"
 carnival.1023.d: "Attendez, l’art coûte si cher que ça ?!"
 ## Event - Whispers behind the mask
 carnival.1024.t: "Chuchotements derrière le masque"
 carnival.1024.desc: "Dans l’effervescence joyeuse du carnaval, les limites s’estompent et les gens perdent tout sens des convenances. On ne sait jamais qui est vraiment la personne masquée à côté de soi, ni ce dont elle se souviendra.\n\n[hook_target.Custom('FR_le_Char_Pi')|U][hook_target.GetTitledFirstNameNoTooltip] s’est laissé[hook_target.Custom('FR_E')] aller à l’excès. [hook_target.Custom('FR_IlElle')|U] passe toute la soirée à danser avec tous ceux qui attirent son regard ; [hook_target.Custom('FR_IlElle')] boit et mange comme s’il n’y avait pas de lendemain ; [hook_target.Custom('FR_IlElle')] rit et parle sans prêter attention à ses interlocuteurs. À deux doigts d’un véritable scandale et sans se douter que, derrière mon masque, j’observe tout.\n\n#BOLD Je pourrais lui épargner cette situation embarrassante ou m’en servir contre [hook_target.Custom('FR_LuiElle')] en [hook_target.Custom('FR_LeLa')] rendant redevable.#!"
 carnival.1024.a: "Je vais veiller sur [hook_target.Custom('FR_LuiElle')] avec bienveillance."
 carnival.1024.b: "Ce serait vraiment dommage que quelqu’un lui en fasse le reproche plus tard."
 carnival.1024.c: "Il vaudrait mieux envoyer un avertissement amical à sa Maison."
 carnival.1024.d: "Laissons-[hook_target.Custom('FR_LeLa')] faire ses propres erreurs."
 carnival.1025.t: "Objets et animaux fantastiques"
 carnival.1025.into_desc: "Je me retrouve devant l’étal d’[Select_CString(merchant_character.IsFemale,'une marchande venue','un marchand venu')] de contrées lointaines. Des objets étranges provenant des quatre coins du monde y sont exposés, sans oublier les cages qui renferment d’exotiques créatures. Les sons et les odeurs qui se dégagent de cette ménagerie sont pour le moins surprenants.\n\n« Approchez, approchez ! Venez tous jeter un œil ! J’ai des merveilles à vous vendre ! » s’écrie [Select_CString(merchant_character.IsFemale,'la marchande','le marchand')] en faisant de grands gestes pour présenter sa marchandise.\n\n« [merchant_trinket.GetName] de grande qualité ; et voici notre [merchant_creature.GetName|l] –"
 carnival_1025_creature_lion_desc: "le manticore africain, un redoutable mangeur d’hommes issu des légendes. »"
 carnival_1025_creature_caracal_desc: "petit mais féroce ! »"
 carnival_1025_creature_lynx_desc: "il peut grimper à un arbre en quelques secondes et son urine forme des cristaux dotés de pouvoirs magiques ! »"
 carnival_1025_creature_tiger_desc: "un redoutable mangeur d’hommes issu des légendes perses. »"
 carnival_1025_creature_leopard_desc: "comme le mentionnent les textes antiques ! »"
 carnival_1025_creature_bear_desc: "il peut se tenir debout sur ses pattes avant et jongler avec des pierres aussi grosses que la tête d’un homme ! »"
 carnival_1025_creature_elephant_desc: "créé par un alchimiste fou ! »"
 carnival_1025_creature_peacock_desc: "né des flammes ! »"
 carnival_1025_creature_parrot_desc: "il peut parler et chanter des hymnes ! »"
 carnival_1025_creature_cockatoo_desc: "un spécimen vraiment rare ! »"
