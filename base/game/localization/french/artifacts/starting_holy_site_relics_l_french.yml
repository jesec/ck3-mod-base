l_french:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "Ossements de saint Pierre"
 artifact_relic_peter_bones_desc: "Les ossements de l’apôtre Pierre, prince des apôtres et premier évêque de Rome."
 artifact_relic_paul_bones_name: "Ossements de saint Paul"
 artifact_relic_paul_bones_desc: "Les ossements de l’apôtre Paul, martyrisé à Acque Salvie."
 artifact_relic_crown_of_thorns_name: "Couronne d’épines"
 artifact_relic_crown_of_thorns_desc: "La couronne d’épines posée sur la tête du Christ avant la crucifixion."
 artifact_relic_baptist_arm_name: "Bras droit de saint Jean-Baptiste"
 artifact_relic_baptist_arm_desc: "L’avant-bras droit de Jean-Baptiste, qui serait la main qui a baptisé le Christ dans le Jourdain."
 artifact_relic_true_cross_name: "Fragment de la Vraie Croix"
 artifact_relic_true_cross_desc: "Un éclat de la croix sur laquelle le Christ a été crucifié, enchâssé dans un reliquaire doré."
 artifact_relic_bones_of_james_name: "Ossements de saint Jacques"
 artifact_relic_bones_of_james_desc: "Les ossements de l’apôtre Jacques le Majeur, qui attirent des pèlerins de toute la chrétienté."
 artifact_relic_mark_name: "Tête de saint Marc"
 artifact_relic_mark_desc: "La tête coupée de l’évangéliste Marc, fondateur de l’Église d’Alexandrie."
 artifact_relic_lance_antioch_name: "Sainte Lance d’Antioche"
 artifact_relic_lance_antioch_desc: "Une pointe de lance en fer qui aurait transpercé le flanc du Christ."
 artifact_relic_tabot_name: "Tabot de l’Alliance"
 artifact_relic_tabot_desc: "Une tablette de pierre consacrée représentant l’Arche d’alliance, vénérée comme la plus sacrée des reliques éthiopiennes."
 artifact_relic_nine_saints_name: "Ossements des Neuf Saints"
 artifact_relic_nine_saints_desc: "Les ossements des Neuf Saints – des moines syriaques qui, fuyant les controverses chalcédoniennes, se réfugièrent à Aksoum et fondèrent les premiers monastères d’Éthiopie, diffusant ainsi le christianisme miaphysite à travers les hauts plateaux."
 artifact_relic_thomas_name: "Reliques de l’apôtre Thomas"
 artifact_relic_thomas_desc: "Les ossements et la pointe de lance maculée de sang de l’apôtre Thomas, dont on dit qu’il apporta la foi au Kerala et qu’il y fut martyrisé."
 artifact_relic_augustine_pallium_name: "Pallium de saint Augustin"
 artifact_relic_augustine_pallium_desc: "Le pallium porté par Augustin de Cantorbéry, premier archevêque et apôtre des Anglais."
 artifact_relic_three_magi_name: "Reliques des Rois mages"
 artifact_relic_three_magi_desc: "Les ossements des Rois mages qui ont suivi l’étoile jusqu’à Bethléem."
 artifact_relic_becket_name: "Reliques de saint Thomas Becket"
 artifact_relic_becket_desc: "Vêtements imprégnés de sang et le crâne de Thomas Becket, martyrisé dans sa propre cathédrale en 1170 et rapidement proclamé le plus grand saint de la chrétienté anglaise."
 artifact_relic_ursula_name: "Ossements de sainte Ursule"
 artifact_relic_ursula_desc: "Les ossements d’Ursule et de ses compagnes vierges martyres, exhumés des cimetières de Cologne."
 artifact_relic_ignatius_name: "Ossements de saint Ignace"
 artifact_relic_ignatius_desc: "Les ossements d’Ignace, deuxième patriarche d’Antioche et disciple de l’apôtre Jean, martyrisé à Rome sous le règne de Trajan."
 # Islamic
 artifact_relic_black_stone_name: "Fragment de la Pierre noire"
 artifact_relic_black_stone_desc: "Un fragment noir poli, issu de la Pierre noire de la Kaaba, embrassé par le Prophète et vénéré par chaque pèlerin du hadj."
 artifact_relic_dhulfiqar_name: "Zulfikar"
 artifact_relic_dhulfiqar_desc: "L’épée à lame à deux pointes du Prophète, qu’il aurait offerte à Ali, et vénérée dans toute la oumma comme symbole d’un pouvoir consacré par Dieu."
 artifact_relic_buraq_footprint_name: "Empreinte du Bouraq"
 artifact_relic_buraq_footprint_desc: "Une pierre portant l’empreinte du sabot laissée par le Bouraq lorsque le Prophète s’est élevé vers les cieux depuis le Rocher de la Fondation à Jérusalem."
 artifact_relic_sword_of_ali_name: "Épée d’Ali"
 artifact_relic_sword_of_ali_desc: "Une épée que l’on croit avoir été maniée par Ali ibn Abi Talib lors des batailles de Badr et de Siffin."
 artifact_relic_abu_hanifa_turban_name: "Turban d’Abou Hanifa"
 artifact_relic_abu_hanifa_turban_desc: "Turban d’érudit d’Abou Hanifa an-Nu’man, fondateur de l’école hanafite, pilier de la jurisprudence sunnite pour tout pèlerin hanafite."
 artifact_relic_prophet_sandals_name: "Sandales du Prophète"
 artifact_relic_prophet_sandals_desc: "Des sandales en cuir qui auraient été portées par le Prophète, reproduites sans relâche sous la forme du na’l par de pieux artisans à travers toute la oumma."
 # Jewish
 artifact_relic_western_wall_name: "Pierre du Mur occidental"
 artifact_relic_western_wall_desc: "Une pierre taillée extraite du mur de soutènement ouest de l’esplanade du Second Temple, l’un des rares vestiges encore debout après la destruction romaine du Temple en 70 de notre ère."
 artifact_relic_tablets_name: "Fragment des Tables de la Loi"
 artifact_relic_tablets_desc: "Un éclat de pierre qui se serait détaché des Tables de la Loi sur le mont Sinaï lorsque Moïse les a jetées par terre dans un accès de colère."
 # Buddhist
 artifact_relic_bodhi_leaf_name: "Feuille de l’arbre de la Bodhi"
 artifact_relic_bodhi_leaf_desc: "Une feuille conservée de l’arbre de la Bodhi à Bodhgaya, sous lequel le Bouddha a atteint l’illumination."
 artifact_relic_vajrasana_name: "Fragment du Vajrasana"
 artifact_relic_vajrasana_desc: "Un fragment poli du Vajrasana, le « trône de diamant » situé sous l’arbre de la Bodhi, où le Bouddha resta assis immobile jusqu’au moment de l’illumination."
 artifact_relic_dhamek_name: "Sarira du stupa de Dhamek"
 artifact_relic_dhamek_desc: "Relique sacrée du Bouddha provenant de Sarnath, où il enseigna le dharma à ses premiers disciples."
 artifact_relic_jowo_name: "Jowo Sakyamuni"
 artifact_relic_jowo_desc: "Une image consacrée du jeune Bouddha, apportée de Chine et considérée par les Tibétains comme la plus sacrée des statues."
 artifact_relic_sacred_tooth_name: "Dent sacrée du Bouddha"
 artifact_relic_sacred_tooth_desc: "La canine gauche de Bouddha, rapportée de Kalinga au IVe siècle, palladium de la royauté dont la garde confère au souverain une légitimité supérieure à celle de tous les autres."
 # Hindu
 artifact_relic_lingam_name: "Lingam de Vishwanath"
 artifact_relic_lingam_desc: "Fragment sacré du Shiva-lingam du grand temple de Varanasi, la plus sacrée des villes du Gange."
 artifact_relic_trishul_name: "Trishula de Shiva"
 artifact_relic_trishul_desc: "Trident qui aurait été manié par Shiva lui-même, symbole de la domination du dieu sur la création, la préservation et la destruction."
 artifact_relic_krishna_stone_name: "Pierre de la naissance de Krishna"
 artifact_relic_krishna_stone_desc: "Pierre usée provenant du Krishna janmabhumi de Mathura, l’endroit même que la tradition désigne comme le lieu de naissance de Krishna."
 artifact_relic_rama_footprint_name: "Empreinte de pied de Rama"
 artifact_relic_rama_footprint_desc: "Pierre portant l’empreinte de pied de Rama lui-même, rapportée d’Ayodhya, son lieu de naissance."
 # Jain
 artifact_relic_palitana_tirtha_name: "Tirtha de Palitana"
 artifact_relic_palitana_tirtha_desc: "Pierre-relique sacrée provenant des collines de Shatrunjaya, à Palitana, le tirtha le plus sacré de la tradition jaïne."
 artifact_relic_parshvanatha_paduka_name: "Charan Paduka de Parshvanatha"
 artifact_relic_parshvanatha_paduka_desc: "La Charan Paduka, une pierre portant l’empreinte des pieds du vingt-troisième Tirthankara, Parshvanatha."
 artifact_relic_shikharji_nishidhi_name: "Nishidhi des Tirthankaras"
 artifact_relic_shikharji_nishidhi_desc: "Pierres commémoratives Nishidhi provenant des sommets du mont Sammed-Shikhar, où vingt des vingt-quatre Tirthankaras ont atteint le moksha, le tirtha le plus sacré de la foi jaïne."
 # Zoroastrian
 artifact_relic_atash_bahram_name: "Braises de l’Adur Farnbag"
 artifact_relic_atash_bahram_desc: "Des braises incandescentes provenant du grand Atash Bahram, le feu sacré des prêtres, toujours entretenu au temple du feu."
 # Norse
 artifact_relic_yggdrasil_branch_name: "Branche de l’Yggdrasil"
 artifact_relic_yggdrasil_branch_desc: "Branche qui, dit-on, serait tombée de l’arbre sacré du temple d’Uppsala, où pendent encore les corps des victimes sacrifiées."
 # Slavic
 artifact_relic_perun_idol_name: "Idole de Péroun"
 artifact_relic_perun_idol_desc: "Idole en bois du dieu du tonnerre Péroun, seigneur des dieux slaves, érigée par le prince Vladimir."
 # Tengri
 artifact_relic_suldetug_name: "Bannière de l’âme"
 artifact_relic_suldetug_desc: "Bannière noire en queue de yak, réceptacle de l’esprit du dieu de la guerre, portée devant les khans de la steppe."
 # Shinto
 artifact_relic_yata_kagami_name: "Yata no Kagami"
 artifact_relic_yata_kagami_desc: "Miroir en bronze traditionnellement identifié comme l’un des trois insignes impériaux du Japon et dont on dit qu’il a fait sortir la déesse du soleil Amaterasu de sa grotte."
 artifact_relic_shin_no_mihashira_name: "Shin no Mihashira"
 artifact_relic_shin_no_mihashira_desc: "Éclat du Shin no Mihashira, le pilier central sacré enfoui dans le sanctuaire intérieur du Naikū. Il est considéré comme l’un des mystères les plus secrets et les plus sacrés d’Ise et est renouvelé à chaque reconstruction du shikinen sengū."
 # Confucian
 artifact_relic_kong_tomb_name: "Stèle de la tombe des Kong"
 artifact_relic_kong_tomb_desc: "Stèle en pierre sculptée provenant de la tombe de Confucius à Qufu, vénérée par la famille Kong depuis des générations."
 artifact_relic_analects_name: "Analectes de Confucius"
 artifact_relic_analects_desc: "Un des premiers exemplaires des Analectes sur lamelles de bambou – recueil des paroles du Maître Kong – étudié par des générations de savants chinois."
 # Hellenic
 artifact_relic_athena_promachos_name: "Fragment d’Athéna Promachos"
 artifact_relic_athena_promachos_desc: "Un fragment en bronze provenant de la statue colossale d’Athéna qui veillait autrefois sur l’Acropole."
 # West African
 artifact_relic_opa_oranmiyan_name: "Bâton d’Oranmiyan"
 artifact_relic_opa_oranmiyan_desc: "Le bâton de granit du roi légendaire Oranmiyan, enfoncé dans la terre sacrée d’Ife, berceau ancestral des Yoruba."
 artifact_relic_oshe_shango_name: "Oshe Shango"
 artifact_relic_oshe_shango_desc: "L’Oshe Shango, une hache à double tranchant moulée à l’image des pierres jumelles du tonnerre du dieu de la tempête Shango, brandie par ses prêtres lors de danses extatiques."
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "Idole sacrée"
 artifact_misc_relic_idol_desc: "Une idole sculptée, siège corporel du dieu lors des rites."
 artifact_misc_relic_stele_name: "Stèle ancestrale"
 artifact_misc_relic_stele_desc: "Une stèle gravée retraçant la lignée des prêtres, témoin à travers les générations."
 artifact_misc_relic_mask_name: "Masque rituel"
 artifact_misc_relic_mask_desc: "Un masque cérémoniel porté lors des rites les plus solennels, réceptacle de la présence divine."
 artifact_misc_relic_banner_name: "Bannière sacrée"
 artifact_misc_relic_banner_desc: "Une bannière consacrée qui a présidé à chaque grand rite sur le lieu saint, dont le tissu est imprégné de la fumée des offrandes."
