 creature_type_monkey_name: "Singe [owner.Custom('GetAnimalColor')] d’origine [creature_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip]"
 creature_type_lion_desc: "Le roi des animaux, symbole de courage, est désormais enchaîné et réduit à l’obéissance. Il arpente son enclos d’un bout à l’autre, dans la mesure où ses chaînes le lui permettent."
 creature_type_caracal_desc: "Une créature ressemblant à un gros félin qui arpente son enclos et déchiquette tout ce qui y a été placé."
 creature_type_lynx_desc: "Un chat timide et trapu. Il reste près du sol, les oreilles rabattues vers l’arrière, les yeux scrutant frénétiquement les environs depuis son perchoir."
 creature_type_tiger_desc: "Une créature redoutable, le roi des animaux de montagne. Il suffit de peu pour attiser sa colère et le faire montrer les crocs, ce qui effraie les visiteurs."
 creature_type_leopard_desc: "Un animal agile, gracieux et tout aussi redoutable. C’est une créature patiente et maligne, aux bonds impressionnants."
 creature_type_bear_desc: "Un ours féroce, avançant lourdement, sans cesse à la recherche de nourriture. Ses pattes massives pourraient briser des os aussi facilement que des brindilles."
 creature_type_elephant_desc: "Un géant d’une douceur trompeuse. Sa trompe est d’une grande dextérité, à la surprise et pour le plus grand plaisir des visiteurs."
 creature_type_peacock_desc: "Un oiseau fier et majestueux au chant caractéristique. C’est le joyau de tout jardin."
 creature_type_parrot_desc: "Un animal plein de vie, capable d’imiter les sons humains : un petit tour pour amuser ses invités."
 creature_type_crane_desc: "Un animal noble aux ailes légères. C’est le symbole de la chance et de la jeunesse éternelle."
 creature_type_cockatoo_desc: "Un oiseau coloré au plumage éclatant et au regard vif."
 creature_type_monkey_desc: "Ce singe sociable est un compagnon adorable, doté d’un comportement et d’expressions délicieusement humains."
 creature_type_lion_reforged_desc: "Le roi des animaux et symbole de courage. $creature_history_entry$"
 creature_type_caracal_reforged_desc: "Un animal féroce. $creature_history_entry$"
 creature_type_lynx_reforged_desc: "Un grand félin aux oreilles broussailleuses. $creature_history_entry$"
 creature_type_tiger_reforged_desc: "Le redoutable roi des animaux de la montagne. $creature_history_entry$"
 creature_type_leopard_reforged_desc: "Un grand félin tacheté. $creature_history_entry$"
 creature_type_bear_reforged_desc: "Un ours féroce. $creature_history_entry$"
 creature_type_elephant_reforged_desc: "Un géant d’une douceur trompeuse. $creature_history_entry$"
 creature_type_peacock_reforged_desc: "Un oiseau fier et majestueux. $creature_history_entry$"
 creature_type_parrot_reforged_desc: "Un oiseau coloré et exotique. $creature_history_entry$"
 creature_type_crane_reforged_desc: "Le symbole de la chance et de la fortune. $creature_history_entry$"
 creature_type_cockatoo_reforged_desc: "Un oiseau aux couleurs vives. $creature_history_entry$"
 creature_type_monkey_reforged_desc: "Un animal curieux. $creature_history_entry$"
 creature_history_entry: "Il appartenait autrefois à la ménagerie [artifact.MakeScope.Var('og_owner').Char.GetHouse.GetNameNoTooltip], pour le plus grand plaisir des spectateurs."
