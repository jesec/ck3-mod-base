l_french:
 #Pilgrim Badges
 maria_conch_name: "Conque de Sainte Marie"
 maria_conch_description: "Un insigne de pèlerin remis lors d’un pèlerinage."
 maria_conch_description_protection: "Un insigne de pèlerin protecteur que l’on reçoit lorsqu’on entreprend un pèlerinage à [badge_location.GetProvince.GetBaronyNameExplicitly]."
 maria_conch_description_prosperity: "Un insigne de pèlerin porte-bonheur que l’on reçoit lorsqu’on entreprend un pèlerinage à [badge_location.GetProvince.GetBaronyNameExplicitly]."
 santiago_badge_name: "Coquille Saint Jacques"
 santiago_badge_description: "Un insigne de pèlerin en forme de coquille Saint-Jacques qui atteste d’avoir accompli le pèlerinage sur le chemin de Saint-Jacques-de-Compostelle jusqu’au lieu saint de Saint-Jacques-de-Compostelle."
 jerusalem_badge_name: "Croix de Jérusalem"
 jerusalem_badge_description: "Un insigne de pèlerin en forme de croix carrée, complexe et aux détails soignés, qui commémore le pèlerinage effectué vers la ville sainte de Jérusalem."
 rome_badge_name: "Clés de saint Pierre"
 rome_badge_description: "Un insigne de pèlerin représentant un trousseau de clés orné des auréoles de saint Pierre et de saint Paul, qui commémore le pèlerinage effectué à la ville sainte de Rome."
 generic_badge_name_1: "Petit insigne de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 generic_badge_name_2: "Souvenir de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 generic_badge_name_3: "Emblème de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 generic_badge_name_4: "Jolie broche de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 protection_badge_name_1: "Broche robuste de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 protection_badge_name_2: "Souvenir gravé de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 prosperity_badge_name_1: "Bijou poli de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 prosperity_badge_name_2: "Insigne étincelant de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] Badge"
 prosperity_badge_name_3: "Broche de choix de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 virility_badge_name_1: "Broche solide de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] Pin"
 virility_badge_name_2: "Bijou béni de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 wisdom_badge_name_1: "Broche recouverte de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] Pin"
 wisdom_badge_name_2: "Bijou immaculé de [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]"
 generic_badge_protection_desc: "Insigne de pèlerin robuste, acquis en [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip], qui, selon la rumeur, offrirait une protection à celui qui le porte."
 generic_badge_prosperity_desc: "Insigne de pèlerin brillant, acquis en [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip], qui, selon la rumeur, offrirait la prospérité à celui qui le porte."
 generic_badge_virility_desc: "Insigne de pèlerin qui rayonne de ferveur. Acquis en [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip], il conférerait, selon la rumeur, davantage de virilité à celui qui le porte."
 generic_badge_wisdom_desc: "Insigne de pèlerin énigmatique, acquis en [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip], qui, selon la rumeur, conférerait sagesse et prudence à celui qui le porte."
