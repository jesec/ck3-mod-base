l_french:
 county_corruption_inefficient_tax_collection_modifier: "Collecte des impôts inefficace"
 county_corruption_inefficient_tax_collection_modifier_desc: "[county_corruption|E]\nLes efforts de collecte des impôts échouent dans le comté."
 county_corruption_inefficient_tax_collection_modifier_2: "Fraude fiscale systémique"
 county_corruption_inefficient_tax_collection_modifier_2_desc: "[county_corruption|E]\nLa fraude fiscale est devenue endémique dans ce comté."
 county_corruption_inefficient_tax_collection_modifier_3: "Effondrement du système fiscal"
 county_corruption_inefficient_tax_collection_modifier_3_desc: "[county_corruption|E]\nDans ce comté, tout système de perception fiscale digne de ce nom s’est effondré."
 county_corruption_deserting_levies_modifier: "Désertion des levées"
 county_corruption_deserting_levies_modifier_desc: "[county_corruption|E]\nLes levées désertent en grand nombre dans ce comté."
 county_corruption_deserting_levies_modifier_2: "Désertions en masse"
 county_corruption_deserting_levies_modifier_2_desc: "[county_corruption|E]\nLes levées désertent en très grand nombre dans ce comté."
 county_corruption_deserting_levies_modifier_3: "Effondrement du système de levée"
 county_corruption_deserting_levies_modifier_3_desc: "[county_corruption|E]\nLe système des levées s’est effondré dans ce comté."
 county_corruption_smuggling_ring_modifier: "Réseau de contrebande"
 county_corruption_smuggling_ring_modifier_desc: "[county_corruption|E]\nLes contrebandiers se répandent dans tout le comté."
 county_corruption_smuggling_ring_modifier_2: "Contrebandiers bien implantés"
 county_corruption_smuggling_ring_modifier_2_desc: "[county_corruption|E]\nDes contrebandiers ont mis en place un vaste réseau dans ce comté"
 county_corruption_smuggling_ring_modifier_3: "Contrebande endémique"
 county_corruption_smuggling_ring_modifier_3_desc: "[county_corruption|E]\nRien de valeur ne passe devant les percepteurs sans qu’ils prélèvent leur part."
 county_corruption_bandits_rampant_modifier: "Banditisme"
 county_corruption_bandits_rampant_modifier_desc: "[county_corruption|E]\nLes bandits errent librement dans le comté."
 county_corruption_bandits_rampant_modifier_2: "Bandes de bandits"
 county_corruption_bandits_rampant_modifier_2_desc: "[county_corruption|E]\nDe puissantes bandes de bandits se sont taillé des territoires au sein de ce comté."
 county_corruption_bandits_rampant_modifier_3: "Banditisme endémique"
 county_corruption_bandits_rampant_modifier_3_desc: "[county_corruption|E]\nLes bandits sans vergogne de ce comté agissent comme s’il s’agissait de leur propre pays."
 county_corruption_inefficient_census_modifier: "Recensement inefficace"
 county_corruption_inefficient_census_modifier_desc: "Les dirigeants de ce comté n’ont aucune idée de qui ou de combien de personnes y vivent."
 county_corruption_inefficient_census_modifier_2: "Effondrement du recensement"
 county_corruption_inefficient_census_modifier_2_desc: "L’administration du comté a perdu la trace de la majeure partie de sa population et de ses propriétés."
 county_corruption_inefficient_census_modifier_3: "Cécité administrative"
 county_corruption_inefficient_census_modifier_3_desc: "Personne ne sait qui vit ici, quels sont les biens possédés et, pire encore : ce qu’ils doivent."
 county_corruption_lack_of_sheriffs_modifier: "Manque de baillis"
 county_corruption_lack_of_sheriffs_modifier_desc: "[county_corruption|E]\nIl n’y a pas assez de baillis pour gérer tout le territoire de ce comté."
 county_corruption_lack_of_sheriffs_modifier_2: "Territoire de non-droit"
 county_corruption_lack_of_sheriffs_modifier_2_desc: "[county_corruption|E]\nL’application de la loi est défaillante dans la majeure partie de ce comté."
 county_corruption_lack_of_sheriffs_modifier_3: "Comté ingouvernable"
 county_corruption_lack_of_sheriffs_modifier_3_desc: "[county_corruption|E]\nL’autorité exercée sur ce comté est purement théorique."
 county_corruption_lack_of_courts_modifier: "Méfiance envers les cours"
 county_corruption_lack_of_courts_modifier_desc: "[county_corruption|E]\nIl n’y a pas assez de jugements de la cour pour traiter les affaires paysannes dans ce comté."
 county_corruption_lack_of_courts_modifier_2: "Mépris de la loi"
 county_corruption_lack_of_courts_modifier_2_desc: "[county_corruption|E]\nLes habitants de ce comté ont, pour la plupart, renoncé à réclamer justice à leurs dirigeants."
 county_corruption_lack_of_courts_modifier_3: "Effondrement du système juridique"
 county_corruption_lack_of_courts_modifier_3_desc: "[county_corruption|E]\nDans ce comté, le respect de la loi et de ses cours de justice a complètement disparu."
 county_corruption_thieves_guild_modifier: "Vols courants"
 county_corruption_thieves_guild_modifier_desc: "[county_corruption|E]\nDes voleurs opèrent librement dans ce comté."
 county_corruption_thieves_guild_modifier_2: "Bandes de voleurs"
 county_corruption_thieves_guild_modifier_2_desc: "[county_corruption|E]\nLes malfaiteurs ont étendu leur emprise malfaisante à l’ensemble de ce comté."
 county_corruption_thieves_guild_modifier_3: "Guilde de voleurs"
 county_corruption_thieves_guild_modifier_3_desc: "[county_corruption|E]\nLa guilde des voleurs contrôle de facto les affaires et les déplacements dans ce comté."
 county_corruption_unsafe_highways_modifier: "Grandes routes dangereuses"
 county_corruption_unsafe_highways_modifier_desc: "[county_corruption|E]\nLes grandes routes de ce comté sont moins sûres que la forêt la nuit."
 county_corruption_unsafe_highways_modifier_2: "Chemins dangereux"
 county_corruption_unsafe_highways_modifier_2_desc: "[county_corruption|E]\nLes routes de ce comté terrifient ceux qui doivent les emprunter."
 county_corruption_unsafe_highways_modifier_3: "Routes inempruntables"
 county_corruption_unsafe_highways_modifier_3_desc: "[county_corruption|E]\nLes routes de ce comté sont impraticables pour les honnêtes gens."
 county_corruption_uncooperative_guilds_modifier: "Guildes non coopératives"
 county_corruption_uncooperative_guilds_modifier_desc: "[county_corruption|E]\nLes guildes locales hésitent à coopérer avec les dirigeants de ce comté."
 county_corruption_uncooperative_guilds_modifier_2: "Guildes obstructionnistes"
 county_corruption_uncooperative_guilds_modifier_2_desc: "[county_corruption|E]\nLes guildes entravent tous les efforts officiels déployés dans ce comté."
 county_corruption_uncooperative_guilds_modifier_3: "Guildes rebelles"
 county_corruption_uncooperative_guilds_modifier_3_desc: "[county_corruption|E]\nLes guildes sont en révolte contre le dirigeant du comté."
 county_corruption_lackluster_administration_modifier: "Administration médiocre"
 county_corruption_lackluster_administration_modifier_desc: "[county_corruption|E]\nLe dirigeant de ce comté ne peut plus financer entièrement l’administration."
 county_corruption_lackluster_administration_modifier_2: "Administration en difficulté"
 county_corruption_lackluster_administration_modifier_2_desc: "[county_corruption|E]\nL’administration de ce comté a largement échoué."
 county_corruption_lackluster_administration_modifier_3: "Effondrement administratif"
 county_corruption_lackluster_administration_modifier_3_desc: "[county_corruption|E]\nLe peu d’administration qui subsistait encore dans ce comté a été abandonné."
 county_corruption_roaming_bandits_modifier: "Bandits errants"
 county_corruption_roaming_bandits_modifier_desc: "[county_corruption|E]\nDes groupes de bandits terrorisent quiconque voyage dans ce comté !"
 county_corruption_roaming_bandits_modifier_2: "Prolifération de bandits"
 county_corruption_roaming_bandits_modifier_2_desc: "[county_corruption|E]\nDes bandits impitoyables se sont installés aux quatre coins de ce comté."
 county_corruption_roaming_bandits_modifier_3: "Occupation par des bandits"
 county_corruption_roaming_bandits_modifier_3_desc: "[county_corruption|E]\nDe redoutables bandits sévissent en toute impunité dans ce comté et terrorisent les honnêtes gens qui y vivent."
 county_corruption_wild_beast_attacks_modifier: "Attaques de bêtes sauvages"
 county_corruption_wild_beast_attacks_modifier_desc: "[county_corruption|E]\nDans ce comté, de grands groupes de bêtes sauvages dévorent aussi bien les moutons que les bergers."
 county_corruption_wild_beast_attacks_modifier_2: "Infestation de bêtes"
 county_corruption_wild_beast_attacks_modifier_2_desc: "[county_corruption|E]\nLes bêtes sauvages sont devenues bien trop nombreuses dans ce comté."
 county_corruption_wild_beast_attacks_modifier_3: "En proie à des prédateurs"
 county_corruption_wild_beast_attacks_modifier_3_desc: "[county_corruption|E]\nDe grands prédateurs rôdent en toute liberté dans ce comté, et s’attaquent aussi bien au bétail qu’à ses propriétaires."
 county_corruption_upset_shepherds_modifier: "Bergers contrariés"
 county_corruption_upset_shepherds_modifier_desc: "[county_corruption|E]\nLes bergers de ce comté sont mécontents et gèrent mal leurs troupeaux."
 county_corruption_upset_shepherds_modifier_2: "Bergers mutins"
 county_corruption_upset_shepherds_modifier_2_desc: "[county_corruption|E]\nLes bergers de ce comté font ouvertement fi de leur dirigeant."
 county_corruption_upset_shepherds_modifier_3: "Effondrement pastoral"
 county_corruption_upset_shepherds_modifier_3_desc: "[county_corruption|E]\nLe mode de vie pastoral s’est effondré dans ce comté."
 county_corruption_rogue_warriors_modifier: "Guerriers rebelles"
 county_corruption_rogue_warriors_modifier_desc: "[county_corruption|E]\nDes hordes de guerriers attaquent et extorquent tout le monde dans ce comté."
 county_corruption_rogue_warriors_modifier_2: "Bandes guerrières rebelles"
 county_corruption_rogue_warriors_modifier_2_desc: "[county_corruption|E]\nDes guerriers rebelles se sont organisés en bandes armées qui sévissent dans ce comté."
 county_corruption_rogue_warriors_modifier_3: "Seigneurs de guerre rebelles"
 county_corruption_rogue_warriors_modifier_3_desc: "[county_corruption|E]\nCe comté est divisé entre de petits chefs de guerre locaux qui ne rendent de comptes à personne."
 county_corruption_unruly_nomads_modifier: "Nomades indisciplinés"
 county_corruption_unruly_nomads_modifier_desc: "[county_corruption|E]\nLes nomades qui vivent dans ce comté sont indisciplinés et enclins à se quereller."
 county_corruption_unruly_nomads_modifier_2: "Nomades désobéissants"
 county_corruption_unruly_nomads_modifier_2_desc: "[county_corruption|E]\nDans ce comté, les nomades ne prêtent guère attention à ceux qui ne font pas partie de leur famille."
 county_corruption_unruly_nomads_modifier_3: "Nomades rebelles"
 county_corruption_unruly_nomads_modifier_3_desc: "[county_corruption|E]\nPartout dans ce comté, les nomades sont sur le point de se révolter."
 escalate_county_corruption.message: "Aggravation de la corruption"
 gain_county_corruption.message.low_control: "Faible contrôle"
 gain_county_corruption.message.deficit: "Dettes"
 gain_county_corruption.message.county_corruption: "Corruption"
 gain_county_corruption.message.smuggling: "Contrebande marchande"
 gain_county_corruption.message.desc: "[county_corruption|E] :\n$EFFECT$"
 remove_county_corruption.message.marshal_removal: "Contrôle augmenté"
