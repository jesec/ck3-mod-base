 prestige_level_2_laamp_desc: "Débloque les éléments suivants :\n\t#weak [casus_belli|E] $EP3_LAAMP_INVASION_CB_COUNTY_NAME$\n\t[interaction|E] $purchase_land_interaction$ pour les [counties|El]\n\tRécompense [Concept('county','comtale')|E] $hire_laamp_mercenaries_interaction$\n\t[interaction|E] $procure_estate_interaction$#!"
 prestige_level_3_laamp_desc: "Débloque les éléments suivants :\n\t#weak [casus_bellis|E] $EP3_LAAMP_INVASION_CB_DUCHY_NAME$ (et niveau inférieur)\n\t[interaction|E] $purchase_land_interaction$ pour les [counties|El] et les [duchies|El]\n\tRécompenses [Concept('county','comtales')|E] et [Concept('duchies','ducales')|E] pour l’[interaction|El] $hire_laamp_mercenaries_interaction$\n\t[scheme|E] $seize_realm$ pour les [duchies|El] et les [counties|El]\n\t[interaction|E] $request_laamp_invasion_sponsorship_interaction$#!"
 prestige_level_4_laamp_desc: "Débloque les éléments suivants :\n\t#weak [casus_bellis|E] $EP3_LAAMP_INVASION_CB_KINGDOM_NAME$ (et niveaux inférieurs)\n\t[interaction|E] $purchase_land_interaction$ pour les [counties|El] et les [duchies|El] avec une acceptation accrue\n\tRécompenses [Concept('county','comtales')|E] et [Concept('duchies','ducales')|E] pour l’[interaction|El] $hire_laamp_mercenaries_interaction$\n\t[scheme|E] $seize_realm$ pour les [kingdoms|El] (et niveaux inférieurs)\n\t[interaction|E] $request_laamp_invasion_sponsorship_interaction$#!"
 prestige_level_5_laamp_desc: "Débloque les éléments suivants :\n\t#weak $EP3_LAAMP_INVASION_CB_EMPIRE_NAME$ (et niveaux inférieurs)\n\t[interaction|E] $purchase_land_interaction$ pour les [counties|El] et les [duchies|El] avec une acceptation accrue\n\tRécompenses [Concept('county','comtales')|E] et [Concept('duchies','ducales')|E] pour l’[interaction|El] $hire_laamp_mercenaries_interaction$\n\t[scheme|E] $seize_realm$ pour les [empires|El] (et niveaux inférieurs)\n\t[interaction|E] $request_laamp_invasion_sponsorship_interaction$#!"
