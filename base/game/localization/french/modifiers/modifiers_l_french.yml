 parliamentary_bureaucracy_modifier: "Bureaucratie parlementaire"
 parliamentary_bureaucracy_modifier_desc: "Un ensemble de lois codifiées qui détermine les pouvoirs et les responsabilité des Trois États dans cette propriété."
 flourishing_culture_modifier: "Culture florissante"
 flourishing_culture_modifier_desc: "Cette propriété connaît une profusion de population, de richesse et d’art."
 hungarian_resettlement_modifier: "Colons chrétiens"
 hungarian_resettlement_modifier_desc: "Cette terre autrefois sauvage connaît une croissance inattendue en raison de l’afflux constant de colons provenant de pays voisins."
 magyar_appreciation_modifier: "Sympathie magyare"
 magyar_appreciation_modifier_desc: "Les communautés magyares de cette propriété sont réconfortées par le soutien manifesté par leur seigneur lige envers leurs anciennes traditions."
 modifier_dusgruntled_church: "Investissement manqué pour l’église"
 modifier_dusgruntled_church_desc: "L’église locale est mécontente depuis qu’elle a raté une bonne occasion de faire des affaires."
 modifier_religious_understanding_modifier: "Sympathie religieuse"
 modifier_religious_understanding_modifier_desc: "Le seigneur lige de ces terres a montré de la sympathie pour la foi de cette région."
 fertile_desert_mountains_modifier: "Al-Yamnat"
 fertile_desert_mountains_modifier_desc: "Depuis l’Antiquité, la partie sud de l’Arabie est connue sous le nom d’Arabie fertile ou heureuse. Cette région abrite plus de personnes et est plus arable que les autres parties de la péninsule."
 bounty_of_the_nile_modifier: "Les bienfaits du Nil"
 bounty_of_the_nile_modifier_desc: "Depuis l’Antiquité, le Nil nourrit le peuple égyptien et les sociétés installées le long de la mer Méditerranée grâce aux cultures qui y poussent en abondance."
 granary_of_the_mediterranean_modifier: "Grenier de la Méditerranée"
 granary_of_the_mediterranean_modifier_desc: "L’île de la Sicile, avec ses sols fertiles, est qualifiée de « grenier de la Méditerranée » depuis l’époque romaine."
 granary_of_hindustan_modifier: "Plaine gangétique"
 granary_of_hindustan_modifier_desc: "Cette plaine gigantesque est l’une des régions les plus fertiles sur Terre, et le cœur de nombreux empires indiens."
 granary_of_the_south_modifier: "Grenier du Sud"
 granary_of_the_south_modifier_desc: "Grâce aux cours d’eau de la partie inférieure du Yangtsé, les récoltes y sont exceptionnelles."
 cedars_of_lebanon_modifier: "Cèdres du Liban"
 cedars_of_lebanon_modifier_desc: "Depuis l’ère des Phéniciens, cette région fournit du bois résistant de qualité."
 pearl_fishing_banks_modifier: "Rives de pêcherie de perles"
 pearl_fishing_banks_modifier_desc: "Cette région est connue pour ses perles, et ses pêcheurs plongent pour les ramasser depuis des générations.\n\nUn [GetDistrictType('fish_district').GetName|l] dans ce [county|El] peut construire des bâtiments [GetBuildingType('pearl_fishery_1').GetName]\n\n"
 walrus_ivory_modifier: "Ivoire de morses"
 walrus_ivory_modifier_desc: "Les morses qui parcourent cette zone sont à la fois une curiosité locale et une précieuse source d’ivoire.\n\nUn [GetDistrictType('fish_district').GetName|l] ou [GetDistrictType('furs_district').GetName|l] dans ce [county|El] peut construire des bâtiments [GetBuildingType('walrus_hunting_camp_1').GetName]\n\n"
 naphta_modifier: "Naphte"
 naphta_modifier_desc: "Cette zone abrite un type d’huile peu commun qui jaillit du sol. Des millénaires durant, il fut utilisé pour alimenter les feux éternels des temples locaux. Une grande partie a également été exportée et utilisée pour allumer des lampes, pour soigner les humains et les animaux.\n\nUn [resource_district|El] dans ce [county|El] peut construire des bâtiments [GetBuildingType('naphta_pit_1').GetName]\n\n"
 carrara_marble_modifier: "Marbre de Carrare"
 carrara_marble_modifier_desc: "Le marbre de Luni est réputé pour sa haute qualité depuis la fin de l’Empire romain."
 mastic_of_chios_modifier: "Mastic de Chios"
 mastic_of_chios_modifier_desc: "Depuis l’époque d’Hippocrate, cette résine à mâcher originaire de cette île est utilisée pour soigner les problèmes digestifs et les rhumes. Considéré comme précieux, le mastic a souvent été monopolisé par les empereurs, et les villages au sein desquels il était fabriqué étaient aussi fortifiés que des châteaux."
 kashi_lustreware_modifier: "Kashi à lustre métallique"
 kashi_lustreware_modifier_desc: "Cette région est connue pour ses carreaux de céramique à lustre brillant ou métallique. Sa renommée est telle qu’elle a donné son nom aux carreaux, et à son style architectural basé sur ces derniers."
 venetian_glass_modifier: "Verre vénitien"
 venetian_glass_modifier_desc: "Venise est un haut lieu de fabrication de verre depuis le début du Moyen-Âge. Avec le temps, la ville a attiré de plus en plus de maîtres expérimentés venant de l’est. La production finit par se concentrer sur l’île de Murano et atteignit un niveau de prouesse technique rarement observé dans le monde occidental."
 toledo_bladesmiths_modifier: "Couteliers de Tolède"
 toledo_bladesmiths_modifier_desc: "Les forgerons de Tolède sont connus pour leur art depuis l’époque romaine, et leur réputation est toujours inégalée dans le monde chrétien.\nPeut construire [GetBuildingType('bladesmiths_of_toledo_1').GetName]"
 samarkandi_paper_modifier: "Papier de Samarcande"
 samarkandi_paper_modifier_desc: "Cette région fabrique du papier depuis des centaines d’années. Le papier de Samarcande sert d’indicateur de qualité à travers tout le monde islamique."
 dodekapolis_modifier: "Dodekapolis"
 dodekapolis_modifier_desc: "Depuis l’époque d’Homère lors de laquelle les colons éoliens et ioniens ont débarqué sur la côte occidentale de l’Anatolie, les 12 villes de la côte anatolienne (les #EMP dodekapolis#!) ont été des symboles de la civilisation et du développement humain."
 backwater_county_modifier: "Trou perdu"
 backwater_county_modifier_desc: "Plus ils sont grands, plus la chute est violente. Ce comté, autrefois territoire des dirigeants implacables de l’Hellas, est malheureusement tombé dans l’avilissement. Bien qu’il ne soit plus que l’ombre de lui-même, ce comté pourrait bien retrouver sa grandeur.\n\n#X @warning_icon! Ce modificateur peut être supprimé en prenant la [decision|El] de [GetDecisionWithKey('restore_backwater_counties_decision').GetName|l] dès lors que la [prosperity|El] de ce [county|El] est d’au moins #V 50#! !#!\n\n"
 dance_plague_modifier: "Épidémie dansante minimisée"
 dance_plague_modifier_desc: "Les paysans de cette région atteints d’ergotisme ont vu leurs appels à l’aide ignorés par les dirigeants."
 disease_spreading_modifier: "En proie à la maladie"
 disease_spreading_modifier_desc: "La maladie se propage sur ces terres"
 winter_none_modifier: "[winter|E] sans gravité"
