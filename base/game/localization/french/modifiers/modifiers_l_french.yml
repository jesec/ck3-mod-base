 piety_level_5_desc: "$piety_level_5$ est le cinquième et le plus haut [piety_level|El] possible pour les [governments|El] qui ne sont pas [mandala|El]. Le niveau suivant est « [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L] ».\nEffets :\n[GetPietyLevelDesc('(int32)5')|=+]"
 piety_level_6: "Quasi-divin"
 piety_level_6_desc: "$piety_level_6$ est le sixième [piety_level|El]. Le niveau suivant est « [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L] ».\n\nQuand un [ruler|El] [mandala|El] meurt d’une façon acceptable d’après son [aspect|El] et en ayant atteint « [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] », son [heir|El] peut progresser à ce niveau de dévotion.\n\nEffets :\n[GetPietyLevelDesc('(int32)6')|=+]"
 piety_level_7: "Demi-divinité"
 piety_level_7_desc: "$piety_level_7$ est le septième [piety_level|El]. Le niveau suivant est « [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] ».\n\nQuand un [ruler|El] [mandala|El] meurt d’une façon acceptable d’après son [aspect|El] et en ayant atteint « [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L] », son [heir|El] peut progresser à ce niveau de dévotion.\n\nEffets :\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8: "Divinité"
 piety_level_8_desc: "$piety_level_8$ est le huitième et le plus haut [piety_level|El] possible pour le [government|El] [mandala|El].\n\nQuand un [ruler|El] [mandala|El] meurt d’une façon acceptable d’après son [aspect|El] et en ayant atteint « [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L] », son [heir|El] peut progresser à ce niveau de dévotion ultime.\n\nEffets :\n[GetPietyLevelDesc('(int32)8')|=+]"
 prestige_level_0: "Disgrâce"
 prestige_level_0_desc: "$prestige_level_0$ est le plus bas [prestige_level|El] possible. Le niveau suivant est « [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] ».\nEffets :\n[GetPrestigeLevelDesc('(int32)0')]"
