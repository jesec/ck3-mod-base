l_french:
 clerical_chastity_vow_modifier: "Vœu de chasteté ecclésiastique"
 clerical_chastity_vow_modifier_desc: "Ce personnage s’est vu imposer un vœu de chasteté par un prêtre, et non de son plein gré. Tant que ce vœu est en vigueur, il ne peut pas tenter de séduire ou de faire la cour."
 clerical_chastity_renounced_vow_clergy_disapproval_modifier: "Promesse sacrée non tenue"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier_desc: "Ayant renoncé à un vœu public de chasteté, ce personnage est considéré avec méfiance par le [clergy|El]."
