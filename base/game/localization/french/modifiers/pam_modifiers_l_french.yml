l_french:
 christian_fulfillment_level_0: "Condamné"
 christian_fulfillment_level_1: "Abandonné"
 christian_fulfillment_level_2: "Troublé"
 christian_fulfillment_level_3: "Pénitent"
 christian_fulfillment_level_4: "Absous"
 christian_fulfillment_level_5: "Établi"
 christian_fulfillment_level_6: "En grâce"
 default_fulfillment_level_0: "À la dérive"
 default_fulfillment_level_1: "En quête"
 default_fulfillment_level_2: "Pratiquant"
 default_fulfillment_level_3: "Pieux"
 default_fulfillment_level_4: "En paix"
 industrious_junior_members_modifier: "Novices travailleurs"
 foolish_convert_modifier: "Conversion insensée"
 foolish_convert_modifier_desc: "Cet imbécile a pris la décision imprudente de pratiquer un [rite|El] appartenant à un système de croyances totalement différent, et a beaucoup de mal à s’adapter à sa nouvelle vie spirituelle."
 reckless_convert_modifier: "Conversion imprudente"
 reckless_convert_modifier_desc: "Ce personnage a décidé, sans grande préparation, de pratiquer un [rite|El] appartenant à un système de croyances totalement différent et a du mal à s’adapter à sa nouvelle vie spirituelle."
 informed_convert_modifier: "Conversion réfléchie"
 informed_convert_modifier_desc: "Ce personnage a décidé de pratiquer un autre [rite|El] et s’est longuement préparé aux défis que cette décision implique."
 study_faith_learning_mannerism: "Apprend des comportements"
 study_faith_learning_mannerism_desc: "Même si cela s’avère moins efficace, l’apprentissage des comportements et des rituels extérieurs d’un [rite|El] peut, à long terme, donner des résultats positifs."
 study_faith_newfound_coherence: "Une cohérence retrouvée"
 study_faith_newfound_coherence_desc: "Les incohérences relevées jusqu’à présent lors de l’étude de ce [rite|El] se sont révélées être un enrichissement plutôt qu’un obstacle. La confrontation des différences entre deux systèmes de croyances a permis d’acquérir une compréhension plus profonde de la véritable signification qui se cache derrière les [core_tenets|El] et les [doctrines|El]."
 study_faith_cautious_studies: "Études prudentes"
 study_faith_cautious_studies_desc: "Il vaut mieux aborder ce [rite|El] avec calme et prendre tout le temps nécessaire pour reformuler les propos dérangeants en messages plus faciles à accepter et s’habituer à cette façon de penser qui nous est étrangère."
 study_faith_slow_and_steady: "Apprentissage lent"
 study_faith_slow_and_steady_desc: "Ce personnage a été submergé par une multitude de pratiques inconnues. Les efforts qu’il doit fournir pour assimiler toutes ces connaissances mettent ses capacités intellectuelles à rude épreuve."
 study_faith_cramming_side_studies: "Accumule les heures supplémentaires"
 study_faith_cramming_side_studies_desc: "Ce personnage est tellement absorbé par les rouages de ce [rite|El] qu’on le voit souvent griffonner des notes, même lorsqu’il est occupé à autre chose."
 followers_of_dead_faith_scheme_modifier: "Connaissance perdue avec le temps"
 followers_of_dead_faith_scheme_modifier_desc: "La [faith|El] n’est plus pratiquée ouvertement, ce qui rend extrêmement difficile la recherche d’adhérents."
 appealing_theology_modifier: "Théologie attrayante"
 appealing_theology_modifier_desc: "Ce personnage a découvert un texte théologique étranger qui l’attire particulièrement."
 suspicions_of_heresy_modifier: "Soupçons d’hérésie"
 suspicions_of_heresy_modifier_desc: "On voit souvent ce personnage lire des textes théologiques étrangers, ce qui amène des coreligionnaires à se méfier de sa dévotion."
 monastic_onslaught_modifier: "Fondations monastiques"
 monastic_onslaught_modifier_desc: "Un ordre monastique généreusement soutenu par un mécène laïc stimule l’économie locale."
 pam_monastic_order_improvement_modifier: "Aide monastique"
 pam_monastic_order_improvement_modifier_desc: "Un ordre monastique apporte son aide à ce comté, tant par sa main-d’œuvre que par ses conseils."
 pam_military_order_improvement_modifier: "Armes bénies"
 pam_military_order_improvement_modifier_desc: "Des guerriers de l’ordre sacré entraînent les levées locales et renforcent la discipline dans ce comté."
 pam_tithes_or_mercy_harsh_tithes_modifier: "Dîme obligatoire"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "Les dîmes ont été prélevées de manière oppressive, ce qui a suscité l’amertume des communautés locales envers leur seigneur."
 pam_tithes_or_mercy_show_mercy_modifier: "Dîme clémente"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "La souplesse dont font preuve les autorités fiscales a permis de renforcer la confiance et les relations de bonne entente au sein des communautés locales."
 pam_blissful_harmony_gospel_modifier: "Évangile de la bonne vie"
 pam_blissful_harmony_gospel_modifier_desc: "Les sermons du dirigeant célèbrent la paix, la piété et une vie ordonnée."
 pam_blissful_harmony_restless_ambition_modifier: "Ambition insatiable"
 pam_blissful_harmony_restless_ambition_modifier_desc: "Un instant de félicité laisse ce personnage avide d’en avoir davantage."
 pam_stone_for_god_estate_build_discount_modifier: "Une pierre pour la maison de Dieu"
 pam_stone_for_god_estate_build_discount_modifier_desc: "C’est grâce à son œil vif d’architecte que ce personnage a pu exploiter la pierre."
 pam_relocating_faithfuls_to_frontiers: "Réinstallation de croyants aux frontières"
 pam_relocating_faithfuls_to_frontiers_desc: "Ce comté encourage les adeptes du même [rite|El] à s’installer dans un autre [realm|El] afin d’y faire du prosélytisme."
 pam_moving_faithfuls_to_frontiers: "Afflux de croyants"
 pam_moving_faithfuls_to_frontiers_desc: "Dans ce comté, des personnes d’une autre [faith|El] s’installent et font du prosélytisme.\n#weak Cela rend l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! moins chère.#!"
 pam_building_new_shrines: "Construit des sanctuaires"
 pam_building_new_shrines_desc: "Ce comté compte des personnes d’une autre [faith|El] qui s’installent et construisent des sanctuaires.\n #weak Cela rend l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! moins chère.#!"
 pam_grand_cathedral_started_modifier: "Construction de la grande cathédrale commencée"
 pam_grand_cathedral_started_modifier_desc: "Ce personnage a réuni les ressources nécessaires pour entamer la construction d’une grande cathédrale. Ce projet, qui s’étend sur plusieurs générations, témoigne d’ores et déjà de sa dévotion envers Dieu."
 pam_grand_cathedral_completed_modifier: "Construction de la grande cathédrale achevée"
 pam_grand_cathedral_completed_modifier_desc: "Ce personnage a réuni les ressources nécessaires pour achever la construction d’une grande cathédrale. Ce projet, qui s’étend sur plusieurs générations, témoigne de sa dévotion envers Dieu."
 pam_grand_cathedral_02_started_modifier: "Construction de la grande cathédrale agrandie"
 pam_grand_cathedral_02_started_modifier_desc: "Ce personnage a mobilisé les ressources nécessaires pour faire atteindre de nouveaux sommets à une grande cathédrale déjà existante. Ce projet, qui s’étend sur plusieurs générations, témoigne de sa dévotion envers Dieu."
 pam_grand_cathedral_02_completed_modifier: "Agrandissement de la grande cathédrale achevée"
 pam_grand_cathedral_02_completed_modifier_desc: "Ce personnage a supervisé l’agrandissement d’une grande cathédrale."
 pam_grand_cathedral_family_contributed_south_modifier: "Financement de la chapelle de la grande cathédrale"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "Un membre de cette dynastie a financé la construction d’une chapelle destinée à une grande cathédrale. Ce projet, qui s’étend sur plusieurs générations, témoigne de sa dévotion envers Dieu."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Mécène de la crypte de la cathédrale"
 pam_cathedral_founder_crypt_modifier_desc: "Ce personnage a financé une crypte destinée à sa dynastie sous une grande cathédrale."
 pam_cathedral_bell_cracked_lesson_modifier: "Leçons tirées de la cloche fêlée"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Les maçons de ce comté travaillent avec plus de discernement afin de compenser la honte d’une coulée de cloche ratée."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Instruments de torture en bronze"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Le bronze d’une cloche de cathédrale mal coulée a été refondu en instruments de terreur. Le fondeur de la cloche en fut la première victime. Désormais, les artisans connaissent le prix de l’échec."
 pam_cathedral_treadwheel_crane_modifier: "Grue à roue d’écureuil"
 pam_cathedral_treadwheel_crane_modifier_desc: "Une immense grue à roue d’écureuil provenant d’un chantier de cathédrale a été dressée dans la capitale."
 pam_cathedral_cantoria_scam_modifier: "Ruse démasquée"
 pam_cathedral_cantoria_scam_modifier_desc: "Après avoir démasqué une supercherie, les bâtisseurs veillent davantage à économiser les ressources et travaillent avec plus de célérité."
 pam_cathedral_famed_choir_boy_modifier: "Voix angélique à la Cour"
 pam_cathedral_famed_choir_boy_modifier_desc: "Un enfant de chœur à la voix surnaturelle apporte de la grâce à cette Cour."
 pam_cathedral_sermon_peace_county_modifier: "Sermon de paix"
 pam_cathedral_sermon_peace_county_modifier_desc: "La prédication d’un dirigeant au nouveau portail de la cathédrale a rendu ce comté plus paisible, et les pèlerins peuvent désormais parcourir ses routes en plus grande sécurité."
 pam_cathedral_sermon_peace_ruler_modifier: "Guidé vers la paix"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "Ce dirigeant a été touché par un sermon à la cathédrale sur la paix du Christ."
 pam_cathedral_sermon_diligence_county_modifier: "Sermon de diligence"
 pam_cathedral_sermon_diligence_county_modifier_desc: "La prédication d’un dirigeant au nouveau portail de la cathédrale a incité les bâtisseurs et les maçons à redoubler d’ardeur au travail."
 pam_cathedral_sermon_diligence_ruler_modifier: "Guidé vers le labeur"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "Ce dirigeant a été touché par un sermon à la cathédrale sur le labeur pieux."
 pam_cathedral_sermon_unity_county_modifier: "Sermon d’unité"
 pam_cathedral_sermon_unity_county_modifier_desc: "La prédication d’un dirigeant au nouveau portail de la cathédrale a renforcé l’obéissance de la communauté dans ce comté."
 pam_cathedral_sermon_unity_ruler_modifier: "Guidé vers la concorde"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "Ce dirigeant a été touché par un sermon à la cathédrale sur la communion fraternelle des chrétiens."
 pam_cathedral_sermon_charity_county_modifier: "Sermon de charité"
 pam_cathedral_sermon_charity_county_modifier_desc: "La prédication d’un dirigeant au nouveau portail de la cathédrale a desserré les cordons des bourses et réchauffé les cœurs dans ce comté."
 pam_cathedral_sermon_charity_ruler_modifier: "Guidé vers la charité"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "Ce dirigeant a été touché par un sermon à la cathédrale sur la charité."
 pam_cathedral_sermon_perseverance_county_modifier: "Sermon de persévérance"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "La prédication d’un dirigeant au nouveau portail de la cathédrale a renouvelé l’ardeur des fidèles et favorisé une croissance ordonnée dans ce comté."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Guidé vers le zèle"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "Ce dirigeant a été touché par un sermon à la cathédrale sur la course de la foi."
 pam_cathedral_sermon_rejoice_county_modifier: "Sermon de réjouissance"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "La prédication d’un dirigeant au nouveau portail de la cathédrale a redonné espoir aux fidèles en leur rappelant l’amour indéfectible du Seigneur."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Guidé vers la joie"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "Ce dirigeant a été touché par un sermon à la cathédrale sur la joie dans le Seigneur."
 pam_cardinal_order_improve_development_modifier: "Amélioration du développement par le cardinal"
 pam_cardinal_order_improve_development_modifier_desc: "Sur ordre de son supérieur, un cardinal s’emploie à favoriser le développement de l’archidiocèse local."
 pam_cardinal_order_convert_faith_modifier: "Conversion de la foi par le cardinal"
 pam_cardinal_order_convert_faith_modifier_desc: "Sur ordre de son supérieur, un cardinal s’efforce de promouvoir la conversion au sein de l’archidiocèse local et les terres limitrophes.\n\n$EFFECT_LIST_BULLET$[convert_county|E] pour ce [county|El] : #P +25%#!"
 pam_cardinal_order_increase_control_modifier: "Retour de l’ordre par le cardinal"
 pam_cardinal_order_increase_control_modifier_desc: "Sur ordre de son supérieur, un cardinal s’efforce d’apaiser la population de l’archidiocèse local."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Fascination culturelle accélérée par le cardinal"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "Sur ordre de son supérieur, un cardinal s’efforce d’accélérer la recherche de technologies."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Résistance épidémique améliorée par le cardinal"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "Sur ordre de son supérieur, un cardinal utilise les ressources de l’Église pour atténuer les effets des épidémies."
 pam_cardinal_order_improve_legitimacy_modifier: "Amélioration de la légitimité par le cardinal"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "Sur ordre de son supérieur, un cardinal s’efforce de promouvoir la légitimité des dirigeants de l’archidiocèse local."
 pam_cardinal_order_undermine_legitimacy_modifier: "Détérioration de la légitimité par le cardinal"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "Sur ordre de son supérieur, un cardinal s’emploie à saper la légitimité des dirigeants de l’archidiocèse local."
 heathen_mandate_modifier: "Légitimité prônée par les païens"
 heathen_mandate_modifier_desc: "Les prêtres d’un dirigeant païen revendiquent les âmes de cette terre, et leurs prétentions abjectes sont couvertes par leur fausse foi."
 pam_recently_baptized_at_domicile_modifier: "Récemment baptisé"
 pam_recently_baptized_at_domicile_modifier_desc: "Ce personnage a été baptisé dans le baptistère de l’ensemble cathédral de son archidiocèse."
 pam_khachkar_ancestral_county: "Khatchkar ancestral"
 pam_khachkar_ancestral_county_custom_desc: "Érigé pour [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom('FR_le_Char_Pi')][SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed] par s[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"
 pam_denied_new_pope_modifier: "A rejeté le nouveau pape"
 pam_denied_new_pope_modifier_desc: "Ce personnage a refusé de reconnaître le pape nouvellement élu."
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "Position sanctifiée"
 pam_dulia_relic_piety_per_dread_modifier: "Aura du martyr"
 pam_dulia_relic_piety_per_knight_modifier: "Bénédiction de l’hostie"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Grâce consolatrice"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Oint par les saints"
 pam_dulia_relic_learning_per_piety_modifier: "Dévotion illuminée"
 pam_dulia_relic_monthly_piety_modifier: "Source de grâce"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "Médiateur de la profession de foi"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "Ce personnage a réglé un différend concernant la formulation de la profession de foi avant même que le concile œcuménique n’ait pu ouvrir ses débats."
 pam_ecumenical_council_primacy_upheld_modifier: "Primauté préservée"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "Ce personnage a été interrogé en pleine assemblée sur l’autorité dont relevaient les Églises de la foi, et a tranché la question."
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "Un nouvel intercesseur"
 pam_dulia_new_saint_modifier_desc: "Ce personnage s’inspire de la récente canonisation d’un saint."
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "Pèlerinage de chaque siège"
 pam_pilgrim_of_every_holy_site_modifier_desc: "Ce personnage a veillé sur tous les lieux saints reconnus par sa foi."
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "Un lien préservé"
 tenet_harmonious_society_five_bonds_modifier_desc: "Souverain et sujet, parent et enfant, mari et femme, aîné et cadet, ami et ami. Ce personnage garde l’une de ces cinq relations en parfait ordre."
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "Chaîne de transmission de l’ordination"
 tenet_apostolic_succession_episcopate_modifier_desc: "La foi de ce personnage ordonne chaque évêque selon une lignée ininterrompue d’évêques antérieurs, source historique d’une légitimité honorée."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Augmentation par [theocratic_vassal|El] ([EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')] max.)#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "Chœurs des fidèles"
 tenet_divine_liturgy_choirs_modifier_desc: "Dans chaque église de ce personnage, les mêmes paroles sont chantées aux mêmes moments, et ce depuis des générations."
 modifier_definition_value_per_held_temple: "\t#weak Augmentation par [temple_holding|El] détenue ([EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')] max.)#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "Célébrée comme il se doit"
 tenet_divine_liturgy_officiant_modifier_desc: "Ce personnage prend la liturgie divine de sa foi très au sérieux."
 tenet_divine_liturgy_schola_cantorum_modifier: "École de chant"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "Un seigneur qui entretient une école de chant sacré s’assure les services d’un liturgiste qui mérite d’être écouté."
 tenet_pentarchy_holy_site_modifier: "Siège patriarcal"
 tenet_pentarchy_holy_site_modifier_desc: "Ce lieu saint du comté prospère grâce à la gestion des fidèles."
 tenet_polyamory_new_beloved_modifier: "Rayonnant d’un amour naissant"
 tenet_polyamory_new_beloved_modifier_desc: "Un nouvel être aimé donne à ce personnage des ailes."
 modifier_definition_value_per_chaplain_learning: "\t#weak Augmentation par point d’[learning|El] du [court_chaplain|El] ([EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')] max.)#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "Châtiment dû"
 tenet_purgatory_sin_penalty_modifier_desc: "Un péché confessé est un péché pardonné, mais la punition n’est pas pour autant annulée. Ce qui n’est pas expié dans cette vie sera réclamé dans l’au-delà, et les croyants savent laquelle des deux voies ce personnage a choisie."
 tenet_original_sin_sinners_insight_modifier: "Expérience du pécheur"
 tenet_original_sin_sinners_insight_modifier_desc: "Quiconque porte le fardeau du péché sait exactement où il se cache chez les autres."
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "Ensanglantée"
 pam_holy_weapon_1_artifact_modifier_desc: "Cette [holy_relic|El] a été portée pour remporter la victoire contre les ennemis de la [faith|El]. Les fidèles ont commencé à lui prêter attention."
 pam_holy_weapon_2_artifact_modifier: "Éprouvé au combat"
 pam_holy_weapon_2_artifact_modifier_desc: "Tant de victoires contre d’autres [religions|El] ont été remportées que les fidèles ne considèrent plus cela comme simplement de la chance."
 pam_holy_weapon_3_artifact_modifier: "Relique réputée"
 pam_holy_weapon_3_artifact_modifier_desc: "Sa réputation la précède. Les plus fervents se réjouissent dès qu’ils l’aperçoivent."
 pam_holy_weapon_4_artifact_modifier: "Instrument de la Providence"
 pam_holy_weapon_4_artifact_modifier_desc: "On dit de celui qui porte ceci qu’il accomplit la volonté de son dieu, et ceux qui chevauchent à ses côtés se battent d’autant plus farouchement."
 # Challenge Head of Faith war aftermath
 pam_house_schismatic_sponsor_modifier: "Mécène schismatique"
 pam_house_schismatic_sponsor_modifier_desc: "Cette maison a apporté son soutien à un [challenger_hof|El] qui a échoué."
 pam_house_martyred_pontiff_modifier: "Martyr de la Maison"
 pam_house_martyred_pontiff_modifier_desc: "Un membre de cette Maison est mort après une guerre pour la fonction de [head_of_faith|El]."
 pam_deposed_pontiff_modifier: "Chef de la foi déposé"
 pam_deposed_pontiff_modifier_desc: "Ce personnage a été déchu de la fonction de [head_of_faith|El]."
 pam_ch_hof_sacred_bloodguilt_modifier: "Coupable d’un crime de sang"
 pam_ch_hof_sacred_bloodguilt_modifier_desc: "Ce personnage a tué quelqu’un lors d’une guerre pour la fonction de [head_of_faith|El]."
 pam_ch_hof_penitent_road_modifier: "Vœu de pénitence"
 pam_ch_hof_penitent_road_modifier_desc: "Ce personnage a juré de faire pénitence après avoir été condamné lors d’une guerre pour la fonction de [head_of_faith|El]."
 pam_blessed_passing_modifier: "Trépas béni"
 pam_blessed_passing_modifier_desc: "Le prédécesseur de ce personnage a connu une mort sanctifiée en donnant sa vie, et sa grâce repose désormais sur lui."
