l_french:
 unity_antagonistic_maa_modifier: "Officiers militaires loyaux"
 unity_antagonistic_maa_modifier_desc: "Les membres de cette Maison ont mis leurs ressources en commun pour renforcer leurs troupes au sein de leurs armées.\n\n"
 unity_competitive_spies_modifier: "Réseau d’intrigue"
 unity_competitive_spies_modifier_desc: "Les membres de cette Maison s’aident les uns les autres en matière d’intrigues, établissant un réseau d’espionnage exclusif à leur Maison.\n\n"
 unity_competitive_spies_landless_merchant_modifier: "Réseau d’intrigue"
 unity_competitive_spies_landless_merchant_modifier_desc: "Les membres de cette Maison s’aident les uns les autres en matière d’intrigues, établissant un réseau d’espionnage exclusif à leur Maison.\n\n"
 unity_impassive_tax_modifier: "Administration améliorée"
 unity_impassive_tax_modifier_desc: "Les membres de cette Maison bénéficient d’une efficacité administrative accrue.\n\n"
 unity_friendly_bailiff_modifier: "Baillis épaulés"
 unity_friendly_bailiff_modifier_desc: "Les membres de cette Maison coopèrent avec leur seigneur lige pour réduire la corruption dans tout le pays.\n\n"
 unity_harmonious_placation_modifier: "Apaisés"
 unity_harmonious_placation_modifier_desc: "Les membres de cette Maison ont réaffirmé le droit de leur seigneur lige à régner en harmonie.\n\n"
 unity_house_organized_for_war_modifier: "Organisés pour la guerre"
 unity_house_organized_for_war_modifier_desc: "Les membres de cette Maison sont tous prêts à faire la guerre.\nLes [rulers|El] adopteront l’[economical_archetype|El] [ai_warlike_personality|L][warlike_i|E]"
 unity_house_focused_on_economy_modifier: "Économie encouragée"
 unity_house_focused_on_economy_modifier_desc: "Les membres de cette Maison améliorent activement leur économie, avec beaucoup d’enthousiasme.\nLes [rulers|El] adopteront l’[economical_archetype|El] [ai_economical_boom_personality|L][builder_i]"
 unity_house_focused_on_diplomacy_modifier: "Efforts diplomatiques"
 unity_house_focused_on_diplomacy_modifier_desc: "Les membres de cette Maison coopèrent pour exercer efficacement leur influence."
 fp3_unity_promoted_prosperity_modifier: "Prospérité promue"
 fp3_unity_promoted_prosperity_modifier_desc: "Les membres de cette Maison coopèrent pour développer leurs terres."
 fp3_unity_improved_logistics_modifier: "A mis en commun la logistique militaire"
 fp3_unity_improved_logistics_modifier_desc: "Les membres de cette Maison mettent en commun leur logistique et leurs fournitures."
 unity_family_business_landless_merchant_modifier: "Affaire familiale organisée"
 unity_family_business_landless_merchant_modifier_desc: "Le manoir de cette Maison fourmille d’activité, et ses membres s’empressent d’exécuter les consignes qui leur sont données.\n\n"
 unity_regional_networks_landless_merchant_modifier: "Réseaux régionaux"
 unity_regional_networks_landless_merchant_modifier_desc: "Le chef de cette Maison a reconnu la diversité des intérêts commerciaux des membres de celle-ci.\n\n"
 unity_merchant_development_modifier: "Développement promu"
 unity_merchant_development_modifier_desc: "Les marchands implantés dans ce comté contribuent à son développement urbain.\n\n"
 unity_merchant_bailiffs_modifier: "Huissiers urbains"
 unity_merchant_bailiffs_modifier_desc: "Les marchands installés dans ce comté s’engagent en faveur du maintien de l’ordre public.\n\n"
 unity_merchant_prosperity_modifier: "Soutien à la communauté"
 unity_merchant_prosperity_modifier_desc: "Les marchands locaux ont fait preuve de générosité en mettant leur fortune au service de cette communauté, pour le bien de tous."
 MODIFIER_DEFINITION_VALUE_PER_MERCHANT_UNITY_MEMBER: " \t#weak Augmentation par membre de la [house|E]#!"
 MODIFIER_DEFINITION_MAIN_DESC_HOUSE_UNITY_LANDESS_MERCHANT: "Ce modificateur augmente par membre de la [house|E] qui a un [merchant|El] indépendant ou un détenteur d’un [court_position|El] (#bold $MULTIPLIER|0$#!/#bold 10#!)"
 unity_promoting_diligence_modifier: "Promeut la diligence"
 unity_promoting_diligence_modifier_desc: "Les membres de cette Maison doivent travailler sans relâche, remettre les livres de comptes et courir après les profits, pour affiner leur sens du commerce et accroître les bénéfices de leur compagnie.\n\n"
 unity_promoting_excess_modifier: "Promeut l’excès"
 unity_promoting_excess_modifier_desc: "Les membres de cette Maison dépensent sans compter dans les plaisirs de la vie, et peaufinent leur réputation et le prestige de leur compagnie.\n\n"
