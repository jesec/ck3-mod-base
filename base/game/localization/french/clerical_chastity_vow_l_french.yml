l_french:
 request_clerical_chastity_interaction: "Exiger la chasteté"
 request_clerical_chastity_interaction_desc: "Exiger [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUINameNoTooltip] de faire vœu de chasteté devant [recipient.GetFaith.HighGodName]. En cas d’acceptation, une pénalité en [fertility|El] sera appliquée et il sera impossible de séduire ou faire la cour tant que le vœu n’a pas pris fin ou jusqu’à ce qu’il soit renié."
 request_clerical_chastity_notification_text: "Prenez cet engagement et maîtrisez vos désirs charnels devant [actor.GetFaith.HighGodName]. Votre obéissance fera honneur à la foi [actor.GetFaith.GetAdjectiveNoTooltip]."
 clerical_chastity_offer_piety: "Offrir de la piété"
 clerical_chastity_recipient_must_be_in_reach_tt: "Vous devez être un [head_of_faith|El] ou détenir un [duchy|El] ou un [title|El] supérieur, à moins que [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] détienne personnellement un [county|El] bordant l’un des vôtres"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUINameNoTooltip] doit être un [head_of_faith|El] ou détenir un [duchy|El] ou un [title|El] supérieur, à moins que [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] détienne personnellement un [county|El] bordant l’un de ceux [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUINameNoTooltip]"
 clerical_chastity_vow_blocks_scheme_tt: "Vous ne devez pas avoir fait [GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|Ll]"
 request_clerical_chastity_actor_toast: "Exigence acceptée"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a accepté la demande [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName]"
 request_clerical_chastity_recipient_toast: "A fait vœu de chasteté"
 request_clerical_chastity_decline_actor_toast: "Exigence rejetée"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a refusé la demande [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName]"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "Être [GetTrait('chaste').GetName( recipient.Self )|l] est une vertu pour ma [faith|El] : $VALUE|=+0$"
 clerical_chastity_ai_rival: "Rival [actor.Custom('FR_du_Char_U_Pi')][actor.GetShortUINameNoTooltip|U] : $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[realm_capital|E] dans ma [clerical_region|El] : $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "[piety|E] supplémentaire offerte : $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[recipient.GetSheHe|U] est [recipient.GetTitleAsNameNoTooltip|l] : $VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "Renier le vœu de chasteté"
 renounce_clerical_chastity_vow_decision_confirm: "Renier le vœu"
 renounce_clerical_chastity_vow_decision_desc: "J’ai fait ce vœu parce qu’un prêtre m’a imposé la chasteté. Je peux m’en passer, mais rompre une promesse sacrée me coûtera de la [piety|El] et pèsera sur ma conscience."
 renounce_clerical_chastity_vow_decision_tooltip: "Mettez fin au vœu avant son expiration. Vous perdez de la [piety|El], subissez du [stress|El] et réduisez l’[clergy_opinion|El] à votre égard pendant 10 ans."
 renounce_clerical_chastity_vow_toast: "Vœu renié"
 renounce_clerical_chastity_vow_toast_desc: "Vous reniez le vœu de chasteté."
 clerical_chastity_vow.0001.toast_released: "Le vœu a pris fin"
 clerical_chastity_vow.0001.toast_released_desc: "Le vœu que vous avez prononcé a pris fin."
