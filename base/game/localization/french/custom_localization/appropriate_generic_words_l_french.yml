 #Food and drink glosses
 ABALONE_GLOSS: "Un coquillage recherché à la chair ferme et charnue."
 SEA_CUCUMBER_GLOSS: "Un mollusque à la chair tendre, préparé comme mets délicat dans la haute cuisine de Chine."
 SWALLOW_NEST_GLOSS: "Un rare nid d’hirondelle dissous dans une soupe de grand luxe."
 ENTREMETS_GLOSS: "Une pâtisserie élaborée ou un mets-surprise servi entre les plats."
 MOCHI_GLOSS: "Un gâteau moelleux à base de riz gluant pilé."
 DURIAN_GLOSS: "Un grand fruit tropical renommé pour son parfum puissant et sa chair riche et crémeuse."
 AQUA_VITAE_GLOSS: "Un spiritueux prisé comme breuvage médicinal."
 TRIBUTE_CHILLED_TEA_GLOSS: "Thé refroidi avec de la glace ou de la neige et offert en présent à la Cour."
 EMPEROR_TEA_GLOSS: "Le plus fin des thés impériaux, réservé à la Cour."
 BAIJIU_GLOSS: "Un spiritueux de Chine distillé à partir de céréales."
 HANAKUSA_GLOSS: "Une infusion composée de fleurs et de feuilles du Japon."
 PEARL_POWDER_GLOSS: "De la perle réduite en poudre, employée comme remontant coûteux."
 CHRYSANTHEMUM_BEER_GLOSS: "Une légère infusion parfumée au chrysanthème."
 SHARBAT_GLOSS: "Une boisson sucrée aux fruits, souvent servie fraîche et relevée d’épices."
 SAMBUSA_GLOSS: "Un beignet croustillant farci de viande épicée ou de légumes."
 PAKHALA_GLOSS: "Un mets rafraîchissant à base d’eau de riz fermentée, originaire de l’est de l’Inde."
 PILAU_GLOSS: "Du riz assaisonné, cuit avec des épices et de la viande ou des légumes."
 PASTILLA_GLOSS: "Une tourte du Maghreb composée de viande épicée enveloppée dans une fine pâte."
 BOTUO_GLOSS: "Une soupe chinoise épaisse de boulettes ou de nouilles de blé."
 SPHOUNGATA_GLOSS: "Une omelette de style byzantin, préparée avec des œufs battus."
 TARICHOS_GLOSS: "Du poisson salé et séché – un mets courant dans le monde byzantin."
 BING_GLOSS: "Une galette ou un pain plat chinois."
 MANTOU_GLOSS: "Un petit pain à base de farine de blé de Chine, tendre et cuit à la vapeur."
 ZOSUI_GLOSS: "Une bouillie de riz originaire du Japon, cuite dans un bouillon."
 KIMCHI_GLOSS: "Légumes coréens fermentés avec du sel et des épices."
 BUBUR_GLOSS: "Une bouillie de riz originaire de l’archipel malais."
