 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "Vos méfaits sont connus depuis l’Irlande jusqu’à Cathay."
 greeting_supplimentary.negative.greek: "Votre bassesse est telle qu’elle a inspiré des pièces de théâtre grecques !"
 greeting_supplimentary.negative.insult.1: "Puissent vos humeurs pourrir en vous !"
 greeting_supplimentary.negative.insult.2: "Que votre vie soit brève et misérable !"
 greeting_supplimentary.negative.insult.3: "Puissiez-vous ne jamais connaître la sagesse !"
 greeting_supplimentary.negative.insult_muslim.1: "Maudits soient vos aïeuls jusqu’au septième degré !"
 greeting_supplimentary.negative.insult_muslim.2: "Puissiez-vous être cousu vivant dans le ventre d’un chameau mort."
 greeting_supplimentary.negative.insult_muslim.3: "Qu’Allah détruise votre Maison !"
 greeting_supplimentary.negative.insult_muslim.4: "Espèce d’enfant de chien galeux !"
 greeting_supplimentary.negative.insult_muslim.5: "Puissent les chacals se disputer vos os sans sépulture."
 greeting_supplimentary.negative.insult_muslim.6: "Puissent vos puits se remplir de sable et vos tentes de scorpions."
 greeting_supplimentary.negative.insult_christian.1: "Puissent les saints abandonner votre cause."
 greeting_supplimentary.negative.insult_christian.2: "Votre nom sera rayé de toutes les prières."
 greeting_supplimentary.negative.insult_norse.1: "Puissent vos ancêtres cracher sur votre ombre."
 greeting_supplimentary.negative.insult_norse.2: "Votre courage est plus fragile que la glace en hiver."
 greeting_supplimentary.negative.insult_byzantine.1: "Même les rats de Constantinople fuient votre puanteur."
 greeting_supplimentary.negative.insult.4: "Puissent vos champs rester en friche et vos puits se tarir."
 greeting_supplimentary.negative.insult.unreliable_swine: "Misérable fourbe que vous êtes."
 greeting_supplimentary.negative.insult.oathbreaker: "Vous êtes [Select_CString(second.IsFemale,'une menteuse','un menteur')] et un[second.Custom('FR_E')] parjure."
 greeting_supplimentary.negative.insult_jewish.1: "Puisse votre nom être effacé du livre des vivants."
 greeting_supplimentary.negative.insult_zoroastrian.1: "Puisse l’obscurité étouffer le feu que vous prétendez entretenir."
 greeting_supplimentary.negative.insult_hindu.1: "Vous avez depuis longtemps quitté le chemin de la droiture – et je vous en écarterai plus encore."
 greeting_supplimentary.negative.insult_christian.3: "Puisse l’enfer vous ouvrir ses portes."
 greeting_supplimentary.negative.insult_norse.3: "Puissent les corbeaux se repaître de votre dépouille."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "Soyez bénis, vous et votre Maison !"
 greeting_supplimentary.positive.flattery.2: "Votre sagesse et votre clémence sont légendaires."
 greeting_supplimentary.positive.flattery.3: "Que la paix soit avec vous !"
 greeting_supplimentary.positive.flattery.4: "Puissiez-vous vivre dans l’harmonie et la satisfaction !"
 greeting_supplimentary.positive.flattery.5: "Votre nature impitoyable est enviable."
 greeting_supplimentary.positive.flattery.6: "Votre appétit insatiable est connu dans le monde entier."
 greeting_supplimentary.positive.flattery.7: "Votre renommée vous précède même à l’étranger."
 greeting_supplimentary.positive.flattery.8: "Puisse votre lignée perdurer mille ans."
 greeting_supplimentary.positive.flattery.9: "Que Dieu vous donne la force de manier l’épée."
 greeting_supplimentary.positive.flattery.10: "Paix et prospérité sur votre Maison."
 greeting_supplimentary.positive.flattery.11: "Puisse la fortune sourire à vos bannières."
 greeting_supplimentary.positive.flattery_chinese.1: "Que les bénédictions célestes soient sur vous."
 greeting_supplimentary.positive.flattery_chinese.2: "Puissent vos terres prospérer."
 greeting_supplimentary.positive.flattery_chinese.3: "Que la force et la vigueur accompagnent votre règne."
 greeting_supplimentary.positive.flattery_norse.1: "Puissent les dieux vous accorder des vents favorables et des troupeaux prospères."
 greeting_supplimentary.positive.flattery_byzantine.1: "Puisse la gloire de la Cité rayonner sur votre Maison."
 greeting_supplimentary.positive.flattery_jewish.1: "Puisse le Saint, béni soit-Il, accorder la paix à votre Maison."
 greeting_supplimentary.positive.flattery.12: "Votre sagesse éclaire tous ceux qui viennent chercher conseil auprès de vous."
 greeting_supplimentary.positive.flattery.13: "Puisse le Ciel vous conserver dans sa grâce."
