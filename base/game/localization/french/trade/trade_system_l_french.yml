 trade_category_non_construction: "Biens hors construction"
 trade_category_non_construction_desc: "Tous les biens, sauf les matériaux de construction. Le bois, le chanvre et la pierre ne sont pas compris."
 trade_category_non_food: "Biens non-alimentaires"
 trade_category_non_food_desc: "Tous les biens, sauf l’alimentation de base. Les céréales, le millet, le riz, les fruits, la viande, le poisson et le fromage ne sont pas compris."
 trade_category_non_medicinal: "Biens non-médicinaux"
 trade_category_non_medicinal_desc: "Tous les biens sauf les médicaments."
 trade_category_non_luxury: "Biens hors produits de luxe"
 trade_category_non_luxury_desc: "Tous les biens, sauf les produits de luxe et aliments de confort comme la soie, les épices, les bijoux, le fromage, les fruits, l’huile, le miel et le thé."
 trade_category_food: "Nourriture de base"
 trade_category_food_desc: "Les denrées alimentaires de base qui nourrissent une population : notamment le blé, le millet, le riz, les fruits, la viande, le poisson et le fromage. Un approvisionnement régulier est la première exigence de toute localité, de toute armée et de tout foyer."
 trade_category_beasts_of_burden: "Bêtes de somme"
 trade_category_beasts_of_burden_desc: "Du bétail indispensable à l’agriculture et au transport : notamment les chevaux et les bovins. Ils sont le moteur des exploitations agricoles, transportent des marchandises et soutiennent l’économie rurale de chaque pays."
 trade_category_minerals: "Minéraux"
 trade_category_minerals_desc: "Biens tirés de la terre par l’exploitation des mines et des carrières, comprenant les métaux, les pierres précieuses, le sel et l’alun. Ils alimentent les forges, les ateliers de frappe de monnaie et d’artisans dont dépend l’ensemble de l’industrie."
 trade_category_luxury: "Luxe"
 trade_category_luxury_desc: "Biens rares et onéreux, prisés des riches et des puissants, allant de la soie et des épices à l’ivoire et aux bijoux. Ils confèrent prestige et raffinement à leurs propriétaires et ne sont à la portée que des cours les plus prospères."
 trade_category_refined_goods: "Produits raffinés"
 trade_category_alcohol: "Alcool"
 trade_category_alcohol_desc: "La bière et le vin sont bien plus que de simples plaisirs. Ils offrent une alternative plus sûre à une eau souvent insalubre, servent aux rites religieux et occupent une place essentielle dans la vie sociale, des tavernes aux cours seigneuriales."
 trade_category_liqour_raw_materials: "Distillables"
 trade_category_precious_metals: "Métaux précieux"
 trade_category_precious_metals_desc: "L’argent et l’or constituent le fondement des ateliers monétaires et des trésors. Au-delà de leur valeur pécuniaire, ces métaux sont indispensables à l’orfèvrerie et aux objets qui témoignent du prestige et du pouvoir."
 trade_category_jewelry_materials: "Pierres précieuses"
 trade_category_jewelry_materials_desc: "Matières premières rares et exotiques, prisées pour leur beauté, telles que les pierres précieuses, l’ambre, l’ivoire et le jade. Très recherchées, elles sont essentielles à l’artisanat de luxe et aux ornements religieux."
 trade_category_crops: "Cultures"
 trade_category_crops_desc: "Cultures agricoles comprenant les céréales, le sucre, le coton et le lin. Soigneusement entretenues et souvent irriguées, elles constituent les richesses naturelles sur lesquelles prospèrent les communautés rurales."
 trade_category_base_metals: "Métaux de base"
 trade_category_base_metals_desc: "Le fer et le cuivre sont les métaux utilitaires qui soutiennent l’industrie et la guerre. Le fer sert à forger armes, outils et armures, tandis que le cuivre est indispensable aux alliages et à la métallurgie courante."
 trade_category_cereals: "Céréales"
 trade_category_cereals_desc: "Les principales cultures vivrières, telles que le blé, le millet et le riz. Fondement de toute alimentation, les céréales figurent parmi les marchandises les plus échangées et sont indispensables au ravitaillement des villes et des armées."
 trade_category_meat: "Viandes"
 trade_category_meat_desc: "Viandes et poissons salés, fumés ou séchés. Riches en protéines, ces denrées nourrissent les foyers, les garnisons et les voyageurs lors des longues expéditions loin des ressources fraîches."
 trade_category_comforts: "Commodités"
 trade_category_comforts_desc: "Produits alimentaires du quotidien dépassant la simple subsistance, tels que le fromage, les fruits, l’huile d’olive, le miel et le thé. Ces produits améliorent le confort de vie et font l’objet d’une demande constante dans toutes les communautés sédentaires."
 trade_category_clothes: "Vêtements"
 trade_category_clothes_desc: "Vêtements confectionnés et matières destinées à l’habillement, notamment les étoffes, les fourrures et le cuir. Des habits de travail aux parures les plus raffinées, ils répondent à un besoin essentiel de toute personne."
 trade_category_luxury_consumption: "Produits de luxe"
 trade_category_luxury_consumption_desc: "Marchandises coûteuses et recherchées venues de contrées lointaines, telles que le sucre et les épices. Elles enrichissent la cuisine, entrent dans la composition de nombreux remèdes et demeurent réservées aux plus privilégiés."
 trade_category_luxury_items: "Articles de luxe"
 trade_category_luxury_items_desc: "Objets raffinés symboles de richesse et de culture, parmi lesquels les céramiques, le verre, les bijoux, les laques et la soie. Ils incarnent le raffinement des cours les plus prospères."
 trade_category_construction_materials: "Matériaux de construction"
 trade_category_mandala_arms: "Armes rudimentaires"
 trade_category_mandala_arms_desc: "Matériaux simples destinés à l’équipement des armées, principalement le cuivre et le bois. Ils permettent de fabriquer lances, boucliers et équipements militaires élémentaires dans les pays ne disposant pas d’armes forgées plus perfectionnées."
 trade_category_carpentry_supplies: "Menuiseries"
 trade_category_carpentry_supplies_desc: "Le bois et le chanvre sont les matières premières essentielles à la construction et à la navigation. Le bois sert à bâtir maisons et navires, tandis que le chanvre fournit cordages et gréements indispensables au commerce maritime."
 trade_category_rural_goods: "Biens ruraux"
 trade_category_rural_goods_desc: "Les richesses brutes de la campagne, comprenant les récoltes, le bétail, le bois et les précieux minerais extraits du sol. Ces ressources alimentent les bourgs et les cités où elles sont transformées."
 trade_category_agricultural_goods: "Produits agricoles"
 trade_category_agricultural_goods_desc: "L’ensemble des productions des champs et des exploitations : céréales, fibres textiles, vin, miel et bétail. Elles représentent la richesse d’une économie agricole sédentaire."
 trade_category_bast_fibres: "Fibres libériennes"
 trade_category_fabrics: "Tissu"
 trade_category_fabrics_desc: "Fibres brutes destinées au tissage, notamment la laine, le coton et le lin. Produits intermédiaires entre l’agriculture et les étoffes, elles alimentent les métiers à tisser des tisserands."
 trade_category_guild_goods: "Marchandises de guilde"
 trade_category_guild_goods_desc: "Biens ouvragés issus des ateliers des guildes urbaines, tels que la bière, les étoffes, le verre ou les bijoux. Ils représentent l’aboutissement du savoir-faire des artisans."
 trade_category_cheap_common: "Biens communs"
 trade_category_cheap_common_desc: "Marchandises peu coûteuses et largement disponibles sur presque tous les marchés : grains, poisson, bois et pierre. Leur abondance et leur faible valeur en font la base du commerce local."
 trade_category_fine_goods: "Biens de valeur"
 trade_category_fine_goods_desc: "Marchandises de grande valeur qui transitent par les plus importants marchés du monde. Elles sont le symbole de la richesse, du prestige et d’une civilisation prospère."
 trade_category_staple_goods: "Biens de première nécessité"
 trade_category_staple_goods_desc: "Marchandises de grande consommation qui assurent le ravitaillement des villes et des armées. Partout où vivent les gens en nombre, ces biens doivent circuler sans interruption."
 trade_category_stone: "Pierre"
 trade_category_stone_desc: "Pierre de construction extraite des carrières pour ériger fortifications, églises et ouvrages publics. Lorsque les gisements locaux font défaut, elle doit être importée pour tout chantier d’envergure."
 trade_category_salt: "Sel"
 trade_category_salt_desc: "Minéral indispensable à la conservation des aliments, le sel permet de préserver viandes et poissons, et de tanner les peaux. Il constitue, depuis l’Antiquité, l’un des piliers du commerce à longue distance."
 trade_category_alum: "Alun"
 trade_category_alum_desc: "Sel minéral polyvalent, principalement utilisé comme mordant pour fixer les teintures sur les étoffes. Employé également en tannerie et en médecine, sa rareté en fait une ressource d’une grande valeur stratégique."
 trade_category_dyes: "Colorants"
 trade_category_dyes_desc: "Colorants éclatants issus des plantes, des minéraux et des insectes. Les teintures sont employées dans de nombreux artisanats, pour colorer les étoffes, émailler les céramiques ou enluminer les manuscrits de pigments éclatants."
 trade_category_books: "Livres"
 trade_category_books_desc: "Manuscrits ainsi que le papier ou le parchemin sur lesquels ils sont rédigés. Les livres sont au cœur de l’éducation, de l’administration et de la transmission du savoir, et deviennent indispensables partout où se développe l’instruction."
 trade_category_incense: "Encens"
 trade_category_incense_desc: "Résines aromatiques et composés odoriférants brûlés lors des cérémonies religieuses à travers le monde. Un approvisionnement régulier est indispensable aux églises, temples et sanctuaires de toute communauté pieuse."
 trade_category_medicaments: "Médicaments"
 trade_category_medicaments_desc: "Remèdes, plantes médicinales et préparations employées par médecins et guérisseurs. L’accès aux médicaments réduit les effets des maladies et des blessures, et demeure essentiel au développement de toute localité prospère."
 trade_good_wood: "Bois"
 trade_good_wood_desc: "Le bois est un matériau indispensable à la construction des maisons, des navires et du mobilier. Les essences de qualité ne sont pas toujours disponibles localement et doivent parfois être importées des régions forestières."
 trade_good_stone: "Pierre"
 trade_good_stone_desc: "Extraite de carrières de calcaire, de grès ou de marbre, la pierre est indispensable aux ouvrages durables. Lourde et coûteuse à transporter, elle demeure souvent rare loin des affleurements naturels."
 trade_good_wool: "Laine"
 trade_good_wool_desc: "Tondue puis nettoyée, la laine constitue la principale fibre textile de l’Europe médiévale. Filée puis tissée, elle fournit la matière première d’une vaste industrie drapière."
 trade_good_cotton: "Coton"
 trade_good_cotton_desc: "Cultivé des régions chaudes de l’Inde jusqu’à l’Égypte, le coton produit une fibre plus légère et plus respirante que la laine. Filé et tissé, il constitue la base d’une grande partie du commerce textile du monde islamique et au-delà."
 trade_good_leather: "Cuir"
 trade_good_leather_desc: "Peaux animales tannées pour produire un matériau résistant et souple. Le cuir sert à fabriquer bottes, ceintures, selles, armures et reliures, ce qui en fait une matière première essentielle à travers le monde."
 trade_good_flax: "Lin"
 trade_good_flax_desc: "Le lin, cultivé tant pour ses fibres que pour l’huile extraite de ses graines, compte parmi les plus anciennes plantes cultivées par l’homme. Même si sa récolte peut demander beaucoup de travail, le lin est moins exigeant que d’autres plantes à fibres et peut être cultivé presque partout."
 trade_good_hemp: "Chanvre"
 trade_good_hemp_desc: "Plante polyvalente cultivée pour ses fibres robustes, transformées en cordages, toiles à voile ou matériaux de calfatage. Le chanvre est indispensable à toute économie maritime comme aux activités de construction."
 trade_good_salt: "Sel"
 trade_good_salt_desc: "Récolté dans les marais salants, extrait des mines de sel gemme ou obtenu à partir de sources salées, le sel est un conservateur alimentaire et un minéral essentiel. Sa capacité à empêcher les denrées de se gâter en fait l’une des marchandises les plus échangées de toute l’histoire."
 trade_good_grain: "Céréales"
 trade_good_grain_desc: "Moulu en farine pour produire pain et bouillies, le grain est la culture la plus importante du monde médiéval. Du blé à l’ouest au seigle dans le nord, il nourrit aussi bien les paysans que les nobles."
 trade_good_fruit: "Fruits"
 trade_good_fruit_desc: "Frais ou séchés, les fruits apportent douceur et variété à l’alimentation médiévale. Les vergers produisant pommes, poires ou figues alimentent un commerce florissant vers les régions plus septentrionales."
 trade_good_meat: "Viande salée"
 trade_good_meat_desc: "Salées, fumées ou séchées pour éviter leur altération, les viandes conservées constituent une source essentielle de protéines. Elles nourrissent les armées en campagne, comme les familles durant les longs mois d’hiver."
 trade_good_fish: "Poisson"
 trade_good_fish_desc: "Séchés, salés ou fumés, les poissons peuvent être transportés sur de longues distances sans se gâter. Le hareng et la morue, en particulier, ont favorisé l’essor du commerce maritime à longue distance."
 trade_good_cattle: "Bétail"
 trade_good_cattle_desc: "Les bovins fournissent la force de traction nécessaire au labour, ainsi que du lait, de la viande et des peaux. Polyvalents, ils constituent la base de nombreuses économies agricoles, tandis que de bons élevages améliorent durablement les rendements."
 trade_good_horses: "Chevaux"
 trade_good_horses_desc: "Principaux animaux de trait et de monte du monde médiéval, les chevaux sont indispensables à l’agriculture, au transport et à la guerre. Les races des steppes et de la péninsule Ibérique sont particulièrement réputées."
 trade_good_cheese: "Fromage"
 trade_good_cheese_desc: "Produit laitier obtenu par le caillage et l’affinage du lait. Se conservant bien plus longtemps que le lait frais, le fromage constitue une source fiable de lipides et de protéines tout au long de l’année."
 trade_good_beer: "Bière"
 trade_good_beer_desc: "Brassée à partir de céréales fermentées, la bière est la boisson quotidienne de l’Europe septentrionale. Faiblement alcoolisée, mais nourrissante, elle est souvent plus sûre que l’eau dans les villes et est consommée dans tous les milieux de la société."
 trade_good_wine: "Vin"
 trade_good_wine_desc: "Issu de la fermentation du raisin, le vin occupe une place privilégiée dans la culture médiévale comme boisson de l’Église, de la noblesse et des nantis. Il est largement exporté depuis les vignobles méditerranéens et ceux de la vallée du Rhin."
 trade_good_oil: "Huile d’olive"
 trade_good_oil_desc: "Extraite de l’olive, cette huile sert de matière grasse en cuisine, de combustible pour les lampes et de base à la fabrication du savon dans tout le bassin méditerranéen. Plus au nord, son usage cède progressivement la place aux graisses animales et au beurre."
 trade_good_honey: "Miel"
 trade_good_honey_desc: "Principal édulcorant du monde médiéval, le miel est également utilisé pour produire l’hydromel, préparer des remèdes et conserver certains aliments. Les abeilles sont élevées dans de nombreuses régions, mais les miels de qualité demeurent particulièrement recherchés."
 trade_good_rice: "Riz"
 trade_good_rice_desc: "Céréale dominante de l’Asie du Sud et de l’Est, le riz exige des rizières inondées et un climat chaud, mais offre des récoltes abondantes. Il constitue la base de l’alimentation de vastes populations."
 trade_good_millet: "Millet"
 trade_good_millet_desc: "Céréale robuste qui prospère dans les sols pauvres et les climats secs où d’autres cultures échouent. Le millet demeure un aliment de base dans une grande partie de l’Afrique, de l’Asie centrale et des régions les plus arides de l’Inde."
 trade_good_iron: "Fer"
 trade_good_iron_desc: "Véritable pilier de l’industrie médiévale, le fer est extrait de son minerai, puis fondu pour fabriquer outils, armes, fers à cheval et clous. Aucune cité ne peut prospérer sans un approvisionnement régulier pour ses artisans et ses soldats."
 trade_good_alum: "Alun"
 trade_good_alum_desc: "L’alun est un sel rare qui possède, entre autres, des propriétés hémostatiques et qui est utilisé dans le traitement du verre ainsi que dans le tannage du cuir. Il sert principalement de mordant : il a un effet blanchissant et permet aux colorants d’adhérer nettement mieux aux textiles.\n\nSous sa forme naturelle, l’alun se trouve dans les régions chaudes telles que le Proche-Orient, mais il peut également être extrait de la roche alunite partout dans le monde."
 trade_good_jade: "Jade"
 trade_good_jade_desc: "Sublime pierre d’une grande importance culturelle en Asie orientale, le jade est travaillé pour réaliser outils, ornements et objets rituels. Très prisé dans les Cours chinoises, il symbolise la vertu et le prestige."
 trade_good_gold: "Or"
 trade_good_gold_desc: "Le plus précieux des métaux, l’or constitue le fondement des trésors royaux et des monnaies de plus grande valeur. Sa rareté et son éclat en font le matériau privilégié des couronnes, des reliquaires et des objets de prestige."
 trade_good_silver: "Argent"
 trade_good_silver_desc: "Métal monétaire par excellence, l’argent est frappé en pièces qui circulent dans tout le monde connu. Au-delà de son usage comme monnaie, il sert à l’orfèvrerie, à la vaisselle précieuse et aux objets religieux d’une grande finesse."
 trade_good_amber: "Ambre"
 trade_good_amber_desc: "Résine fossile provenant principalement des rivages de la Baltique, l’ambre fait l’objet d’un commerce florissant depuis l’Antiquité. Sa chaude teinte dorée et sa facilité de sculpture en font un matériau recherché pour les perles, pendentifs et objets décoratifs."
 trade_good_copper: "Cuivre"
 trade_good_copper_desc: "Métal malléable employé pour fabriquer ustensiles de cuisine, cloches d’église et alliages tels que le bronze ou le laiton. Sa couleur chaleureuse en fait également un matériau apprécié pour les ouvrages décoratifs."
 trade_good_gems: "Pierres précieuses"
 trade_good_gems_desc: "Rubis, saphirs, émeraudes et autres gemmes figurent parmi les marchandises les plus précieuses des routes commerciales. Taillées et polies, elles ornent couronnes, reliquaires et joyaux des puissants."
 trade_good_silk: "Soie"
 trade_good_silk_desc: "La plus noble des fibres textiles, la soie est obtenue à partir des cocons du ver à soie, puis tissée en étoffes d’une douceur et d’un éclat incomparables. Originaire de Chine, elle compte parmi les marchandises les plus précieuses du commerce mondial."
 trade_good_textiles: "Textile"
 trade_good_textiles_desc: "Tissus tissés à partir de laine, de coton, de lin ou de fibres mélangées. Les étoffes de qualité figurent parmi les marchandises les plus échangées du monde médiéval, grâce aux célèbres ateliers des Flandres, d’Italie et du Moyen-Orient."
 trade_good_furs: "Fourrures"
 trade_good_furs_desc: "Peaux de renard, d’hermine, de zibeline, de castor et d’autres animaux piégés dans les forêts septentrionales. Les vêtements de fourrure sont un symbole de richesse et de rang, alimentant un commerce florissant auprès des cours nobles."
 trade_good_books_paper: "Livres et papier"
 trade_good_books_paper_desc: "Manuscrits copiés à la main sur parchemin ou sur papier. Les livres préservent les codes de loi, les textes religieux et le savoir accumulé, et sont recherchés partout où prospèrent l’administration et l’érudition."
 trade_good_spices: "Épices"
 trade_good_spices_desc: "Poivre, cannelle, girofle, muscade et autres aromates venus d’Asie du Sud et du Sud-Est comptent parmi les marchandises les plus précieuses du monde. Elles servent à conserver et relever les aliments tout en affichant la richesse de leurs propriétaires."
 trade_good_tea: "Thé"
 trade_good_tea_desc: "Préparé à partir des feuilles séchées et transformées du théier, le thé est la boisson emblématique de l’Extrême-Orient. Diffusé vers l’ouest par la route de la Soie, il acquiert progressivement une place importante dans le commerce mondial."
 trade_good_dyes: "Colorants"
 trade_good_dyes_desc: "Colorants extraits de plantes comme le pastel et la garance, d’insectes tels que le kermès ou encore de minéraux. Les teintures donnent leurs couleurs éclatantes aux étoffes, aux céramiques et aux manuscrits enluminés, et sont indispensables aux métiers qui les utilisent."
 trade_good_jewelry: "Bijoux"
 trade_good_jewelry_desc: "Ouvrages d’orfèvrerie associant métaux précieux, pierres fines, émaux ou verre. Les bijoux sont le signe le plus visible de la richesse personnelle dans le monde médiéval et servent fréquemment de présents diplomatiques."
 trade_good_ivory: "Ivoire"
 trade_good_ivory_desc: "Sculpté dans les défenses d’éléphant, l’ivoire est un matériau de prestige et de dévotion. Il sert à réaliser sculptures, pièces d’échecs, plaques de reliquaires et les objets décoratifs les plus somptueux."
 trade_good_glass: "Verre"
 trade_good_glass_desc: "Récipients soufflés, vitres et objets décoratifs façonnés par les verriers. Les verreries raffinées de Venise et du monde islamique atteignent des prix élevés, tandis que le verre plus commun se répand progressivement dans les églises et les riches demeures."
 trade_good_sugar: "Sucre"
 trade_good_sugar_desc: "Raffiné à partir de la canne à sucre cultivée dans les régions méridionales, le sucre est une denrée rare et coûteuse. Il est utilisé comme édulcorant, remède et ingrédient de prestige dans les cuisines des plus fortunés."
 trade_good_incense: "Encens"
 trade_good_incense_desc: "Résines aromatiques, telles que l’oliban et la myrrhe, brûlées lors des cérémonies religieuses de nombreuses traditions. Leur production exige un climat chaud et des arbres spécifiques, ce qui en fait des marchandises exportées depuis l’Arabie, l’Éthiopie et l’Inde."
 trade_good_ceramics: "Céramique"
 trade_good_ceramics_desc: "Poteries fines et porcelaines réalisées avec un haut degré de maîtrise artisanale. Les céramiques de qualité provenant de Chine et du monde islamique sont des objets de luxe très recherchés."
 trade_good_lacquerware: "Laque"
 trade_good_lacquerware_desc: "Objets recouverts de multiples couches de résine de laque, réputés en Asie orientale pour leur solidité et leur finition brillante. Coffrets, plateaux et meubles laqués comptent parmi les produits de luxe qui empruntent les routes de la Soie."
 trade_good_medicaments: "Médicaments"
 trade_good_medicaments_desc: "Ensemble de plantes séchées, de composés minéraux et de préparations médicinales utilisés par médecins et apothicaires. Un approvisionnement suffisant en remèdes est indispensable pour soigner les blessures, combattre les maladies et maintenir une population en bonne santé."
