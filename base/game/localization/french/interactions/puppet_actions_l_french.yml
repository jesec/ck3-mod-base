l_french:
 puppet_excommunicate_interaction: "#D Excommunicate via your Puppet#!"
 actor_secondary_puppet_excommunicate_interaction: "$theological_agent_puppet$"
 theological_agent_puppet: "Fantoche prêtre du pays"
 theological_agent_puppet_desc: "Le [puppet|El] [realm_priest|El] agit comme votre porte-parole au sein de l’Église, vous permettant ainsi de voter lors des [ecumenical_councils|El] et d’établir des [rites|El]."
 puppet_type_no_candidates: "Vous n’avez pas de [puppet|El] [PuppetType.GetName|V] disponible"
 puppet_action_description_puppet_action_give_gift: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('gift_interaction')]#! pour dépenser de l’[gold|El] pour de l’[opinion|El] avec un autre [character|El]"
 puppet_action_description_puppet_action_ask_excommunicate_character: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_excommunication_interaction')]#! pour que le [head_of_faith|El] [Concept('excommunicate', 'excommunie')|E] un [character|El] pécheur"
 puppet_action_description_puppet_trigger_can_create_faith: "Créer une [faith|El]"
 puppet_action_description_puppet_trigger_can_create_rite: "Créer un [rite|El]"
 puppet_action_description_puppet_action_command_murder: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('start_murder_interaction')]#! contre un [character|El]"
 puppet_action_description_puppet_action_request_elevation: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_elevation_interaction')]#! pour demander au [head_of_faith|El] un [clerical_title|El] plus prestigieux"
 request_clerical_region_title_cannot_request_hof_see_tt: "Impossible de demander un [clerical_title|El] détenu par le [head_of_faith|El]"
 request_clerical_region_title_capital_region_tt: "Votre [capital|El] doit se situer dans la [clerical_region|El] que vous demandez"
 higher_piety_level_than_hof: "Le [piety_level|El] est plus élevé que celui du [head_of_faith|el]"
 lower_piety_level_than_hof: "Le [piety_level|El] est plus bas que celui du [head_of_faith|el]"
 is_puppet_action_valid_first: "Vous avez un [puppet|El] qui permet : [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 is_puppet_action_valid_third: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a un [puppet|El] qui permet : [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 is_puppet_action_valid_global: "A un [puppet|El] qui permet : [PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]"
 not_is_puppet_action_valid_first: "Vous n’avez pas de [puppet|El] qui permet : [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 not_is_puppet_action_valid_third: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] n’a pas de [puppet|El] qui permet : [PUPPET_ACTION_TYPE.GetName( CHARACTER.Self )]"
 not_is_puppet_action_valid_global: "N’a pas de [puppet|El] qui permet : [PUPPET_ACTION_TYPE.GetName( GetPlayer.Self )]"
 request_elevation_interaction: "Solliciter une élévation de rang"
 request_elevation_interaction_desc: "Adresser une demande au [head_of_faith|El] pour obtenir le [clerical_title|El] de votre [clerical_region|El], que ce poste soit vacant ou occupé par votre [superior|El]."
 request_elevation_interaction_notification: "[target.GetNameNoTier] a besoin d’un pasteur qui en est digne. Confiez-moi ce siège, et ses ouailles ne s’égareront plus."
 request_elevation_cannot_unseat_player_tt: "Il est impossible d’évincer le [holder|El] d’un [clerical_title|El] dirigé par un autre joueur"
 request_elevation_interaction_toast_title: "Élévation de rang !"
 request_elevation_interaction_toast_title_puppeteer: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName] a été élevé[puppet_or_actor.Custom('FR_E')] !"
 request_ecclesiastical_title_expansion_interaction: "Solliciter l’expansion du titre clérical"
 request_ecclesiastical_title_expansion_interaction_desc: "Adresser une pétition à votre [head_of_faith|El] pour inclure à votre [clerical_region|El] un [duchy|El] limitrophe\n\nTous les comtés [de_jure|El] du [duchy|El] choisi seront ajoutés à votre [clerical_region|El]"
 request_ecclesiastical_title_expansion_interaction_notification: "Les fidèles de [target.GetNameNoTier] manquent d’une autorité spirituelle. Que ces terres soient placées sous mon archidiocèse, pour la gloire [actor.GetFaith.HighGodNamePossessive]."
 request_ecclesiastical_title_expansion_accepted_tt: "Titre clérical étendu"
 recipient_secondary_request_ecclesiastical_title_expansion_interaction: "Titulaire"
 puppet_action_description_puppet_action_request_ecclesiastical_title_expansion: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_expansion_interaction')]#! pour demander officiellement au [head_of_faith|El] d’étendre votre [clerical_region|El] à un [duchy|El] limitrophe"
 request_ecclesiastical_title_merger_interaction: "Solliciter la fusion du titre clérical"
 request_ecclesiastical_title_merger_interaction_desc: "Demander à votre [head_of_faith|El] d’autoriser l’intégration d’un territoire voisin à la [clerical_region|El] de votre [capital|El]"
 request_ecclesiastical_title_merger_interaction_notification: "Les ouailles de [target.GetNameNoTier] sont à la dérive faute d’une main ferme, tandis que les miens prospèrent. Que ce siège me soit confié, et un seul pasteur loyal veillera sur ce que deux ont divisé."
 request_ecclesiastical_title_merger_accepted_tt: "Titre clérical intégré"
 request_ecclesiastical_title_merger_absorbed_tt: "Titre clérical perdu"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "Aucune [clerical_region|El] voisine éligible. Votre [clerical_region|El] doit être bordée par au moins une [clerical_region|El] de même foi"
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#! pour demander officiellement au [head_of_faith|El] d’intégrer une [clerical_region|El] voisine dans la vôtre"
 rival_ecclesiastical_title_merged: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName] a absorbé le [clerical_title|El] [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName]."
 request_ecclesiastical_title_creation_interaction: "Solliciter la création du titre clérical"
 request_ecclesiastical_title_creation_interaction_desc: "Demander officiellement à votre [head_of_faith|El] d’établir un nouveau [clerical_title|El] dans votre [realm|El]\n\nVous choisissez le [title|El] ainsi que son premier [holder|El]\n\n#weak La nouvelle [clerical_region|El] couvre chaque [county|El] [de_jure|El] du [kingdom|El] [de_jure|El] auquel appartient le siège et qui n’est pas encore rattaché à une [clerical_region|El].#!"
 request_ecclesiastical_title_creation_interaction_notification: "Les fidèles de mes terres sont guidés à distance par des étrangers qui ne les connaissent pas. Approuvez la création d’un siège sur le lieu que je désigne et mes ouailles ne manqueront de rien."
 request_ecclesiastical_title_creation_accepted_tt: "[new_title.GetNameNoTooltip] créé"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "Vous ne détenez pas de [duchy|El] ou de [title|El] supérieur dont la [capital|El] [de_jure|El] peut accueillir une nouvelle [clerical_region|El]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUINameNoTooltip] ne [Select_CString(puppet_or_actor.IsLocalPlayer,'détenez','détient')] pas de [duchy|El] ou de [title|El] supérieur dont la [capital|El] [de_jure|El] peut accueillir une nouvelle [clerical_region|El]"
 pam_new_clerical_region_invalid_anchor_tt: "La [capital|El] [de_jure|El] de ce [title|El] doit être de la [faith|El] du requérant, détenue dans son [realm|El], et pas déjà à l’intérieur d’une [clerical_region|El]"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "Nécessite un candidat du [clergy|El] qui ne détient pas déjà un [clerical_region|El]"
 recipient_secondary_request_ecclesiastical_title_creation_interaction: "Titulaire"
 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#! pour demander officiellement au [head_of_faith|El] de fonder un [title|El] de [clerical_region|El] rattaché à un [title|El] de votre choix"
 request_create_new_ecclesiastical_title_effect_tt: "Un [clerical_title|El] est créé sur la [capital|El] [de_jure|El] de [target_kingdom.GetName], englobe chaque [county|El] [de_jure|El] du [kingdom|El] [de_jure|El] de ce siège qui n’est pas déjà dans une [clerical_region|El], et est accordé [new_ecclesiastical_holder.Custom('FR_au_Char_U_Pi')][new_ecclesiastical_holder.GetShortUIName]"
 request_ecclesiastical_title_split_interaction: "Solliciter la scission d’un titre ecclésiastique"
 request_ecclesiastical_title_split_interaction_desc: "Demandez à votre [head_of_faith|El] de scinder le [title|El] ecclésiastique d’une [clerical_region|El] existante et d’en créer un nouveau.\n\nSi vous êtes un [ruler|El] laïc, celui-ci sera établi dans votre [capital|El] et attribué au [holder|El] de votre choix ; si vous êtes un ecclésiastique propriétaire foncier, vous en serez le premier [holder|El].\n\n#weak La division suivra les frontières du [realm|El] : le nouveau [title|El] ne couvrira que les [counties|El] situés au sein de votre [clerical_region|El] (ou de celle de votre [liege|El], si vous faites partie du clergé), de sorte qu’un [realm|El] plus vaste en obtiendra une part plus importante.#!"
 request_ecclesiastical_title_split_interaction_notification: "Aucun berger ne peut s’occuper seul d’un troupeau aussi vaste. Créez un siège sur ces terres, et ainsi, aucune âme qui y réside ne passera plus inaperçue."
 clerical_title_split_tt: "Un nouveau titre ecclésiastique englobant le [realm|El] [puppet_liege.Custom('FR_du_Char_Pi')][puppet_liege.GetTitledFirstName] est scindé et créé à partir de la [clerical_region|El] [puppet_superior.Custom('FR_du_Char_Pi')][puppet_superior.GetTitledFirstName], et [new_ecclesiastical_holder.Custom('FR_le_Char_Pi')][new_ecclesiastical_holder.GetTitledFirstName] en devient le premier [holder|El]"
 request_ecclesiastical_title_split_effect_tt: "Un nouveau [clerical_title|El] couvrant le [realm|El] [puppet_or_actor.Custom('FR_du_Char_Pi')][puppet_or_actor.GetTitledFirstName] est séparé de [split_source_clerical_region.GetName] et accordé [new_ecclesiastical_holder.Custom('FR_au_Char_U_Pi')][new_ecclesiastical_holder.GetShortUIName]"
 request_ecclesiastical_title_split_accepted_tt: "Scission d’un titre ecclésiastique"
 request_ecclesiastical_title_split_lost_tt: "Région cléricale réduite"
 actor_secondary_request_ecclesiastical_title_split_interaction: "Nouveau titulaire"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "Titulaire actuel"
 pam_split_no_region_to_split_tt: "Il doit y avoir une partie d’une [clerical_region|El] dans votre [realm|El] qui peut être séparée"
 pam_split_no_region_to_split_tt_puppeteer: "Il doit y avoir une partie d’une [clerical_region|El] dans [Select_CString(puppet_or_actor.IsLocalPlayer,'votre','le')] [realm|El][puppet_or_actor.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')] qui peut être séparée"
 pam_split_capital_is_region_seat_tt: "[Select_CString(puppet_or_actor.IsLocalPlayer,'Votre','La')] [capital|El][puppet_or_actor.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')] ne peut pas être la [Concept('clerical_region_capital', 'capitale')|E] de la [clerical_region|El] qui est divisée"
 pam_split_no_eligible_holder_tt: "Il doit y avoir un [holder|El] éligible au nouveau [clerical_title|El]"
 pam_split_too_small_tt: "Le nouvelle [clerical_region|El] serait trop petite — elle doit contenir au moins #V 3#! [counties|El]"
 pam_split_liege_capital_is_region_seat_tt: "La [capital|El] de votre [liege|El] ne peut pas être la [Concept('clerical_region_capital', 'capitale')|E] de la [clerical_region|El] qui est divisée"
 pam_split_larger_than_superior_tt: "La nouvelle [clerical_region|El] ne peut pas être plus étendue que la partie conservée par le [holder|El] actuel."
 pam_split_region_is_religious_head_seat_tt: "La [clerical_region|El] étant divisée ne peut pas être le siège d’un [head_of_faith|El] ou d’un [head_of_rite|El]"
 request_clerical_elector_title_interaction: "Solliciter le cardinalat"
 request_clerical_elector_title_interaction_desc: "Demander à votre [head_of_faith|El] de vous nommer [cardinal|El]. Votre [head_of_faith|El] deviendra votre [superior|el]"
 request_clerical_elector_title_interaction_notification: "J’ai toujours fait preuve de fidélité à l’égard de la foi, tant en paroles qu’en actes, et je demande aujourd’hui à la servir encore plus étroitement. Accordez-moi le chapeau rouge, et lorsque le Collège s’exprimera, vous n’aurez pas à douter de mon allégeance."
 request_clerical_elector_title_interaction_toast: "Cardinalat accordé"
 request_clerical_elector_title_interaction_decline_toast: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUINameNoTooltip|U] a refusé [Select_CString(puppet_or_actor.IsLocalPlayer,'votre','la')] demande de nomination à un [cardinalate|El][puppet_or_actor.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')]"
 request_clerical_elector_title_interaction_accept_tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUINameNoTooltip|U] a accepté [Select_CString(puppet_or_actor.IsLocalPlayer,'votre','la')] demande de nomination à un [cardinalate|El][puppet_or_actor.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')]"
 external_theological_agent_puppet: "Fantoche dirigeant clérical"
 external_clerical_puppet: "[external_clerical_puppet|E]"
 has_relation_external_clerical_puppet: "Déjà un [external_clerical_puppet|El]"
 external_theological_agent_puppet_desc: "Le [puppet|El] clérical est hors de votre [realm|El] ; [archbishops|El], [cardinals|El] ou le [head_of_faith|El]. Ils sont puissants et peuvent [excommunicate|El]."
 external_ruler_puppet: "Fantoche dirigeant laïc"
 external_ruler_puppet_desc: "Un [ruler|El] tenu par l’amour, la crainte ou le devoir. Ordonnez-lui de [Concept('scheme', 'comploter')|E] pour vous et de mettre son [realm|El] au service du vôtre."
 # Religious - PAM (additions)
 puppet_action_description_puppet_action_request_ecclesiastical_title_split: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_split_interaction')]#! pour demander au [head_of_faith|El] de séparer un [clerical_title|El] d’une [clerical_region|El] existante"
 puppet_action_description_puppet_action_demand_church_succession_hof: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('demand_church_succession_religious_head_interaction')]#! en tant que [head_of_faith|El] pour désigner le [primary_title|El] d’un [ruler|El] de la même [faith|El] comme héritage de secours."
 puppet_action_description_puppet_action_give_cardinal_order: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('give_cardinal_order_interaction')]#! pour appliquer des [modifiers|El] régionaux à ses [baronies|El]"
 puppet_action_description_puppet_action_appoint_cardinal: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('appoint_cardinal_interaction')]#! pour élever un membre du [clergy|El] de même [faith|El] au rang de [cardinal|El]"
 puppet_action_description_puppet_action_destroy_cardinalate: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('destroy_cardinalate_interaction')]#! pour dissoudre un [cardinalate|El] et renvoyer son titulaire du [college_of_cardinals|E]"
 puppet_action_description_puppet_action_ecclesiastic_grant_claim: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('ecclesiastic_grant_claim_interaction')]#! pour une [pressed_claim|El] sur un [title|El] d’un [ruler|El] de même [faith|El]"
 puppet_action_description_puppet_action_sway_ruler_to_my_rite: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('sway_ruler_to_my_rite_interaction')]#! pour rallier un [ruler|El] de même [faith|El]"
 # Religious
 puppet_action_description_puppet_action_demand_conversion: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('demand_conversion_interaction')]#! pour forcer un [ruler|El] de la même [house|E] à adopter votre [faith|El]"
 puppet_action_description_puppet_action_demand_conversion_vassal_ruler: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('demand_conversion_vassal_ruler_interaction')]#! pour forcer un [vassal|El] ou un [tributary|El] à adopter votre [faith|El]"
 puppet_action_description_puppet_action_request_clerical_chastity: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_clerical_chastity_interaction')]#! pour contraindre un adulte de la même foi à prononcer les vœux"
 puppet_action_description_puppet_action_take_vows: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('take_vows_interaction')]#! pour envoyer un [courtier|El] rejoindre le clergé"
 puppet_action_description_puppet_action_take_monastic_vows: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('take_monastic_vows_interaction')]#! pour envoyer un [courtier|El] dans un [monastic_holy_order|El]"
 puppet_action_description_puppet_action_send_to_holy_order: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('send_to_holy_order_interaction')]#! pour envoyer un [courtier|El] ou un [child|El] au service d’un ordre sacré"
 puppet_action_description_puppet_action_monastic_donation: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('monastic_donation_interaction')]#! pour donner de l’[gold|El] en échange d’[spiritual_fulfillment|El]"
 puppet_action_description_puppet_action_lease_monastic: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('lease_title_to_existing_monastic_order_interaction')]#! pour bailler à rente une [barony|El] de [church_holding|El] à un [holy_order|El]"
 puppet_action_description_puppet_action_declaration_of_repentance: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('declaration_of_repentance_interaction')]#! pour adresser une pétition à votre [head_of_faith|El] et lever votre [excommunication|El]"
 puppet_action_description_puppet_action_inspire_conversion: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('inspire_conversion_interaction')]#! pour convertir un [vassal|El] [nomadic|El] (et ses comtés) à la [faith|El] de votre résidence"
 puppet_action_description_puppet_action_literalist_debate: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('literalist_debate_interaction')]#! pour vous entraîner avec un pair de même foi pour de la [piety|El]"
 puppet_action_description_puppet_action_strengthen_claim: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('strengthen_claim_interaction')]#! pour appuyer une [claim|El] fragile avec l’approbation d’un [bishop|El]"
 puppet_action_description_puppet_action_convert_to_religion: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('convert_to_religion_interaction')]#! pour adopter volontairement la [faith|El] de votre [liege|El] ou [suzerain|El]"
 puppet_action_description_puppet_action_designate_theocratic_heir: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('designate_theocratic_heir_interaction')]#! pour choisir un [courtier|El] de même foi pour vous succéder"
 puppet_action_description_puppet_action_demand_church_succession: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('demand_church_succession_interaction')]#! en tant que [holder|El] de [clerical_title|El] pour hériter par défaut du [title|El] d’un voisin"
 puppet_action_description_puppet_action_increase_theocratic_heir_candidacy: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('increase_theocratic_heir_candidacy')]#! pour améliorer le [appointment_level|El] d’un candidat à un [clerical_title|El]"
 puppet_action_description_puppet_action_excommunicate: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('excommunicate_interaction')]#! contre un [character|El] [Concept('sinful', 'pécheur')|E] de même [faith|El]"
 puppet_action_description_puppet_action_lift_excommunication: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('lift_excommunication_interaction')]#! pour absoudre un [character|El]"
 puppet_action_description_puppet_action_temporal_condemnation: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('temporal_condemnation_interaction')]#! pour tenter de condamner un [vassal|El] adulte de même [religion|El]"
 puppet_action_description_puppet_action_select_ghw_beneficiary: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('select_ghw_beneficiary_interaction')]#! pour choisir votre [beneficiary|El] dans une [great_holy_war|El]"
 puppet_action_description_puppet_action_attempt_conversion_local_ruler: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('attempt_conversion_of_local_ruler_interaction')]#! en tant qu’[adventurer|El] sur un [ruler|El] local dans le [county|El] de votre [domicile|El]"
 puppet_action_description_puppet_action_demand_conversion_player_ruler: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('demand_conversion_player_ruler_interaction')]#! pour forcer un [vassal|El] à adopter votre [faith|El]"
 puppet_action_description_puppet_action_convert_at_war: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('convert_at_war_interaction')]#! pour mettre fin à une [holy_war|El] en prenant la [faith|El] de l’attaquant"
 # Intrigue (additions)
 puppet_action_description_puppet_action_command_abduct: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('start_abduct')]#! contre un [character|El]"
 puppet_action_description_puppet_action_command_befriend: "Utilisez l’[interaction|El] #V [GetPlayer.GetPlayerInteractionName('befriend_interaction')]#! contre un [character|El]"
