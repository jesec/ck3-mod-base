 pam_interactions_events.0120.opening: "À l’illustre [recipient.GetFirstName] de la foi [recipient.GetFaith.GetReligion.GetAdjective],"
 pam_interactions_events.0120.desc_religious_head_actor: "Depuis que les premiers hommes ont été engendrés par [recipient.GetFaith.CreatorName], nous n’avons jamais connu de [recipient.GetTitleAsName|l] de votre envergure ! Je suis à vos ordres ; c’est pour moi un honneur de vous obéir.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "Je ne peux pas guider les fidèles sans aide. Même le premier du peuple [recipient.GetFaith.HighGodNamePossessive], [recipient.Custom('FR_le_Char_L')][recipient.GetTitleAsName|l], doit se soumettre aux coutumes de ce monde. C’est pourquoi je vous aiderai et vous obéirai, ô [actor.GetTitleAsName].\n\n"
 pam_interactions_events.0120.desc: "Béni[recipient.Custom('FR_E')] suis-je dans l’accomplissement de mon devoir, car il m’est donné de servir les âmes, tant sur l’ordre [recipient.GetFaith.HighGodNamePossessive] que sur le vôtre. Je m’efforcerai de faire tout ce qui est en mon pouvoir.\n\n"
 pam_interactions_events.0120.desc_lunacy: "Car je crains que mon âme elle-même ne soit en train de mourir... et aucun conseil, si ce n’est le vôtre, ne m’apporte le moindre réconfort...\n\n"
 pam_interactions_events.0120.desc_dread: "Détruisons ensemble ceux qui doivent être détruits : ceux que [recipient.GetFaith.HighGodName] a abandonnés... tout comme [recipient.GetFaith.HighGodName] m’a abandonné[recipient.Custom('FR_E')].\n\n"
 pam_interactions_events.0120.desc_piety: "Car c’est [recipient.GetFaith.HighGodName] qui nous a insufflé une mission sacrée !\n\n"
 pam_interactions_events.0120.desc_friendly: "Mon amour pour m[recipient.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('actor'))] et ma confiance absolue me guideront face à ce qui m’attend.\n\n"
 pam_interactions_events.0120.desc_skill: "Sous votre direction avisée... j’espère participer à de grandes réalisations.\n\n"
 pam_interactions_events.0120.outro: "Lesquelles de vos prières seront exaucées ?"
 pam_interactions_events.0120.a: "Chacune de mes prières, ô [recipient.GetTitleAsNameNoTooltip] !"
 pam_interactions_events.0121.opening: "Ô vénérable [ROOT.Char.GetTitleAsName],"
 pam_interactions_events.0121.desc_honor: "Par la présente, je mets de côté la fierté que j’ai éprouvée en tant que [recipient.GetTitleAsName|l] de [recipient.GetPrimaryTitle.GetNameNoTier] et je suivrai fidèlement vos conseils.\n\n"
 pam_interactions_events.0121.desc: "[recipient.Custom('FR_le_Char_L')|U][recipient.GetTitleAsName|l] de [recipient.GetPrimaryTitle.GetNameNoTier] jouera son rôle dans vos jeux de pouvoir et vous aidera à prospérer dans ce monde mortel.\n\n"
 pam_interactions_events.0121.desc_lunacy: "Comme vous le dites : ma Cour est un repaire de charlatans et de menteurs. Mes rêves sont sombres. Seules vos paroles ont un sens pour moi, seuls vos remèdes peuvent me guérir...\n\n"
 pam_interactions_events.0121.desc_dread: "Je suis une arme entre vos mains. Sans hésitation, sans scrupules.\n\n"
 pam_interactions_events.0121.desc_piety: "Libérez-moi de mes doutes et montrez-moi le chemin pour gagner l’amour [recipient.GetFaith.HighGodNamePossessive] !\n\n"
 pam_interactions_events.0121.desc_friendly: "J’ai pleinement confiance en vous et jure de ne pas vous décevoir.\n\n"
 pam_interactions_events.0121.desc_skill: "Je suis convaincu[recipient.Custom('FR_E')] qu’en surveillant de près les affaires de mon pays, vous ne laisserez pas mon échec advenir.\n\n"
 pam_interactions_events.0121.outro: "Laissez-nous nous occuper de vos projets."
 pam_interactions_events.0121.a: "Même [recipient.GetTitleAsNameNoTooltip|l], [recipient.Custom('FR_IlElle')] reste au service de son Église."
