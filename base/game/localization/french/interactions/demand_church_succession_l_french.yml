l_french:
 demand_church_succession_interaction: "Exiger la succession par l’Église"
 demand_church_succession_religious_head_interaction: "Décréter la succession par l’Église"
 demand_church_succession_interaction_desc: "Si [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] venait à quitter ce monde sans héritier légitime, ses terres reviendraient au détenteur de [actor.GetPrimaryTitle.GetName] en tant qu’[fallback_heir|El]."
 demand_church_succession_religious_head_interaction_desc: "En tant que [Concept('head_of_faith', 'chef')|E] de la [faith|El] [actor.GetFaith.GetAdjective], décrétez que le pays [recipient.Custom('FR_du_Char_Pi')][recipient.GetTitledFirstName] reviendrait au [actor.GetPrimaryTitle.GetName] en cas de décès sans héritier."
 demand_church_succession_target_in_reach: "Le [realm|El] [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName] ne borde pas celui [actor.Custom('FR_du_Char_U_Pi')][actor.GetShortUIName] et n’est pas dans l’[archdiocese|El] [actor.Custom('FR_du_Char_U_Pi')][actor.GetShortUIName]"
 demand_church_succession_no_existing_fallback: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] a déjà promis sa succession à un autre clerc ou à un [fallback_heir|El]"
 demand_church_succession_no_elective: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] a son [primary_title|El] sous [elective_succession|El] ou [advanced_succession|El]"
 demand_church_succession_recently_refused_tt: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] a récemment bravé une exigence de succession par l’Église et est à l’abri de toute nouvelle exigence de ce type pendant dix ans"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Exiger la succession par l’Église"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.Custom('FR_le_Char_Pi')|U][actor.GetTitledFirstName] exige que, si [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] venait à mourir sans héritier, son pays revienne au [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_actor_toast: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] est lié[recipient.Custom('FR_E')] à la [faith|El]"
 demand_church_succession_actor_toast_desc: "Si [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] mourrait sans héritier, [actor.GetPrimaryTitle.GetName] hériterait de son pays."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName] a lié [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] à la [faith|El]"
 demand_church_succession_actor_toast_desc_puppeteer: "Si [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] mourrait sans héritier, [puppet_or_actor.GetPrimaryTitle.GetName] hériterait de son pays."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "Par la grâce [actor.GetFaith.HighGodNamePossessive], Nous vous écrivons au sujet d’une affaire successorale."
 demand_church_succession.0001.desc.archbishop: "C’est depuis mon archidiocèse, qui veille sur vos terres, que je vous écris au sujet d’une affaire successorale."
 demand_church_succession.0001.desc.bishop: "Votre guide spirituel vous écrit au sujet d’une affaire successorale."
 demand_church_succession.0001.desc.head_of_faith_generic: "En ma qualité de chef de la foi, je vous écris au sujet d’une affaire successorale."
 demand_church_succession.0001.desc.theocrat_generic: "Depuis l’autel [actor.GetFaith.HighGodNamePossessive], je vous écris au sujet d’une affaire successorale."
 demand_church_succession.0001.flavour.zealous: "\n\nNe vous y trompez pas :"
 demand_church_succession.0001.flavour.ambitious: "\n\nSoyons clairs :"
 demand_church_succession.0001.flavour.deceitful: "\n\nSans doute cela vous apportera un peu de réconfort :"
 demand_church_succession.0001.flavour.greedy: "\n\nJe vais être [Select_CString(actor.IsFemale,'franche','franc')] :"
 demand_church_succession.0001.flavour.compassionate: "\n\nPardonnez-moi ce mal nécessaire, [recipient.GetTitledFirstName], mais"
 demand_church_succession.0001.flavour.default: "\n\nPermettez-moi de parler sans détour :"
 demand_church_succession.0001.recipient.elderly_childless: "le berceau près de votre foyer est vide et votre lignée s’éteindra avec vous. Les fidèles attendront... et hériteront en temps voulu."
 demand_church_succession.0001.recipient.childless: "vous n’avez pas d’enfants vivants. Si [actor.GetFaith.HighGodName] ne remédie pas à cette situation, vos terres serviront la foi."
 demand_church_succession.0001.recipient.one_child: "un seul enfant se dresse entre vous et la fin. Si [actor.GetFaith.HighGodName] venait à vous emporter, les fidèles seraient prêts à gouverner."
 demand_church_succession.0001.recipient.default: "le temps est l’ennemi de toute promesse. Si la vôtre venait à être rompue, vos terres nous reviendraient, afin d’être gouvernées au nom [actor.GetFaith.HighGodNamePossessive]."
 demand_church_succession.0001.a: "C’est ce qui est écrit. Il en sera donc ainsi."
 demand_church_succession.0001.b: "Dans ce cas, je ferais mieux d’engendrer un héritier."
 demand_church_succession.0001.c: "[actor.Custom('FR_le_Char_Pi')|U][actor.GetTitledFirstNameNoTooltip] se mêle de ce qui ne [actor.Custom('FR_LeLa')] regarde pas."
 demand_church_succession.0001.c.tt: "Vous mettez fin au système de [fallback_heir_title|El] et êtes à l’abri de toute nouvelle exigence de succession par l’Église pendant dix ans, mais [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName] ne pardonnera pas cet affront de sitôt"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "Votre demande a été examinée et rejetée. Mon pays ne tombera jamais aux mains de l’Église. Occupez-vous de votre autel, [actor.GetTitledFirstName]... et je m’occuperai de mes terres."
 demand_church_succession.0002.a: "Cette insolence ne sera pas oubliée."
 demand_church_succession_fertility_modifier: "Déterminé à engendrer un héritier"
 demand_church_succession_fertility_modifier_desc: "Déterminé à garder son pays hors de portée du clergé, ce personnage redouble d’efforts dans son lit conjugal."
 defied_church_succession_opinion: "A rejeté ma demande de succession"
 meddling_church_opinion: "Se mêle de ma succession"
