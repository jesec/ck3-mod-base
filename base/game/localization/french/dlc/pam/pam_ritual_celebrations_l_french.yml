l_french:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Débloque l’[intent|El] $praise_the_gods_intent$ pour les [activities|El] de [GetActivityType('activity_feast').GetName|l]"
 praise_the_gods_intent: "Honorer le divin"
 praise_the_gods_intent_desc: "Transformez les célébrations collectives en une forme de culte. Recherchez la connaissance religieuse, la sagesse spirituelle et la communion pendant le festin."
 praise_the_gods_intent_not_valid_desc: "Vous ne suivez plus personnellement le [tenet|El] des [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )|l]"
 pam_ritual_celebrations_events.0001.t: "Un festin d’illumination"
 pam_ritual_celebrations_events.0001.desc: "Tandis que les assiettes se vident et que les coupes se remplissent à nouveau, une trinquée en l’honneur [ROOT.Char.GetFaith.WealthGodNamePossessive] en entraîne une autre. La salle résonne de prières, de récits sacrés et de débats théologiques passionnés.\n\nDans la chaleur de la fête, la communion semble presque tangible — qu’elle soit trouvée dans la ferveur des échanges ou le silence de la prière."
 pam_ritual_celebrations_events.0001.a: "Que la fête se transforme en vénération."
 pam_ritual_celebrations_events.0001.b: "Je vais me retirer pour prier dans un esprit de recueillement solennel."
 pam_praise_the_gods_revelation_outcome_tt: "Une vérité sacrée émerge du tumulte des festivités"
 pam_praise_the_gods_belief_outcome_tt: "Un enseignement presque tombé dans l’oubli ouvre une nouvelle voie vers la foi"
 pam_praise_the_gods_legend_outcome_tt: "Les récits sacrés de cette nuit s’ancrent dans une légende que l’on transmettra de génération en génération"
 pam_praise_the_gods_clergy_outcome_tt: "La louange commune vous rapproche d’un [Concept('clergy', 'clerc')|E] à votre table"
 pam_praise_the_gods_scholar_outcome_tt: "Les débats de la soirée font naître une soif inextinguible de connaissance sacrée"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Chaque prière et chaque parabole affinent votre maîtrise du savoir sacré"
 pam_praise_the_gods_revelation_toast: "Une révélation au cœur des festivités"
 pam_praise_the_gods_belief_toast: "Connaissance théologique"
 pam_praise_the_gods_legend_toast: "Une légende sacrée"
 pam_praise_the_gods_clergy_toast: "Unis par la louange [ROOT.Char.GetFaith.WealthGodNamePossessive]"
 pam_praise_the_gods_scholar_toast: "Sagesse découverte au cours du festin"
 pam_praise_the_gods_scholar_xp_toast: "Érudition approfondie"
 pam_praise_the_gods_clergy_bond_opinion: "Unis dans une célébration divine"
 pam_praise_the_gods_log_title: "A honoré le divin"
 pam_praise_the_gods_log: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a tenté d’accéder à la sagesse divine à travers les prières, les récits et les débats qui ont eu lieu pendant le banquet"
 pam_praise_the_gods_quiet_log_title: "A prié dans un recueillement silencieux"
 pam_praise_the_gods_quiet_log: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] s’est retiré[CHARACTER.Custom('FR_E')] des festivités pour trouver la paix divine dans la prière silencieuse"
