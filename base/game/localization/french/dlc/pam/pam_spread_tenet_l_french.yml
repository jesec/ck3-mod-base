l_french:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "Prêcher le principe"
 spread_personal_tenet_intent_desc: "Vous souhaitez prêcher votre [personal_tenet|El] à des invités réceptifs, qui pourront l’adopter, ce qui renforce la [tenet_popularity|El]."
 spread_personal_tenet_intent_not_valid_desc: "Vous n’avez plus de [personal_tenet|El]"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Débloque l’[intent|El] #EMP $spread_personal_tenet_intent$#! aux [activities|El] avec des invités, vous permettant ainsi d’augmenter la [tenet_popularity|El]"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.Custom('FR_le_Char_U_Pi')|U][first.GetShortUINameNoTooltip|U] [Select_CString(first.IsLocalPlayer,'ralliez','rallie')] [second.Custom('FR_le_Char_U_Pi')][second.GetShortUINameNoTooltip]"
 apa_pam_spread_tenet_guest_title: "[first.Custom('FR_le_Char_U_Pi')|U][first.GetShortUINameNoTooltip|U] [Select_CString(first.IsLocalPlayer,'ralliez','rallie')] [second.Custom('FR_le_Char_U_Pi')][second.GetShortUINameNoTooltip]"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nMais ce qui me tient à cœur, c’est une conviction que ma propre foi condamne : [spread_tenet.GetBaseName|l]. En parler, c’est mettre mon destin entre les mains de chacun de ceux qui m’écoutent."
 pam_spread_tenet_option_scripture: "Les Écritures elles-mêmes parlent pour moi."
 pam_spread_tenet_option_preach: "Écoutez ce que je considère comme vrai."
 pam_spread_tenet_option_forbidden: "La vérité vaut bien le risque. Approchez-vous."
 pam_spread_tenet_option_decline: "Une autre fois, peut-être."
 pam_spread_tenet_forbidden_flavor: "Toutes les oreilles tournées vers moi ne sont pas forcément bienveillantes..."
 pam_spread_tenet_overheard_toast: "Des oreilles hostiles"
 pam_spread_tenet_events.0001.t: "Discussion à table"
 pam_spread_tenet_events.0001.desc: "La table craque sous le poids [ROOT.Char.Custom('GetExpensiveMeal')] et, dans la salle, des trinquées retentissent au milieu des rires.\n\n« Vous parlez comme quelqu’un qui a longuement réfléchi au sacré », dit [pam_spread_listener_1.Custom('FR_le_Char_Pi')][pam_spread_listener_1.GetTitledFirstName] en se penchant vers le plateau des [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]s. « Continuez. »\n\nLe silence s’installe autour de la table. Un public réceptif, prêt à écouter..."
 pam_spread_tenet_events.0101.t: "Autour du feu"
 pam_spread_tenet_events.0101.desc: "Pendant un bref répit dans la chasse, nous nous tenons serrés autour du feu, tandis qu’un[ROOT.Char.Custom('FR_E_GetRandomRegionalSmallGame')] [ROOT.Char.Custom('GetRandomRegionalSmallGame')] rôtit à la broche.\n\n« Une chasse comme celle-ci porte l’âme vers de plus hautes pensées », murmure [pam_spread_listener_1.Custom('FR_le_Char_Pi')][pam_spread_listener_1.GetTitledFirstName], sans quitter les flammes des yeux.\n\nLa lueur vacillante du feu, le silence, et des oreilles attentives."
 pam_spread_tenet_events.0201.t: "Entre les manches"
 pam_spread_tenet_events.0201.desc: "Entre les épreuves, les gradins sont vides. Des écuyers emportent les lances brisées, tandis que la foule cherche un peu d’ombre et échange quelques mots.\n\n« Chaque vainqueur remercie [ROOT.Char.GetFaith.HighGodName] et chaque perdant maudit [ROOT.Char.GetFaith.DevilName] », plaisante [pam_spread_listener_1.Custom('FR_le_Char_Pi')][pam_spread_listener_1.GetTitledFirstName] à côté de moi. « Est-ce que l’un d’entre eux se demande pourquoi ? »\n\nUne pause, un banc rempli de dignitaires et une question qui reste en suspens."
 pam_spread_tenet_events.0301.t: "Trinquée à cette conviction"
 pam_spread_tenet_events.0301.desc: "Les verres se lèvent les uns après les autres : aux jeunes mariés, aux héritiers à naître...\n\n« Et [ROOT.Char.GetFaith.HighGodName2], qui unit toutes les âmes ! » ajoute [pam_spread_listener_1.Custom('FR_le_Char_Pi')][pam_spread_listener_1.GetTitledFirstName] sous des murmures d’approbation.\n\nIci, les cœurs sont disposés à accueillir l’amour, l’espérance et les vérités sacrées. Les paroles prononcées aujourd’hui y prendront racine."
 pam_spread_tenet_events.0401.t: "Paroles prononcées à la veillée funèbre"
 pam_spread_tenet_events.0401.desc: "Les endeuillés se rassemblent en petits groupes, échangeant à voix basse quelques mots sur le défunt et le sort qui nous est à tous réservé.\n\n« Cela viendra pour chacun de nous », murmure [pam_spread_listener_1.Custom('FR_le_Char_Pi')][pam_spread_listener_1.GetTitledFirstName] à mes côtés. « Et pourtant, nous continuons à nous disputer pour des vétilles. »\n\nLe chagrin ouvre une brèche dans l’âme..."
