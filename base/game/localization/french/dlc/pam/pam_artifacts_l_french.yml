l_french:
 artifact_pedestal_bible_name: "Bible $artifact_name_prefix$"
 artifact_pedestal_bible_description: "Bible enluminée et reliée entre deux couvertures ornées de bijoux, dont chaque verset a été patiemment et méticuleusement recopié à la main."
 artifact_pedestal_thurible_name: "Encensoir $artifact_name_prefix$"
 artifact_pedestal_thurible_description: "Encensoir finement travaillé et suspendu à des chaînes polies. Une fois allumé, il emplit la pièce de nuages parfumés d’encens qui emportent les prières vers le ciel."
 artifact_pedestal_situla_name: "Situle $artifact_name_prefix$"
 artifact_pedestal_situla_description: "Récipient richement décoré servant à transporter l’eau bénite lors des processions, afin que les bénédictions puissent être projetées sur les fidèles."
 artifact_pedestal_crozier_name: "Crosse $artifact_name_prefix$"
 artifact_pedestal_crozier_description: "Bâton pastoral d’évêque, dont la forme rappelle celle d’une houlette de berger servant à guider les fidèles et à ramener les égarés."
