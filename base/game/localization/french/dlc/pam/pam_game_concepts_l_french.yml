l_french:
 game_concept_puppet: "Fantoche"
 game_concept_puppets: "Fantoches"
 game_concept_puppeted: "Manipulé"
 game_concept_puppeting: "Manipuler"
 game_concept_puppet_type: "Type de fantoche"
 game_concept_puppet_types: "Types de fantoche"
 game_concept_puppet_type_desc: "Chaque [puppet|el] appartient à un type qui détermine les actions qu’il peut effectuer à votre place.\n\nBien que la plupart de ses actions spéciales soient communes, chaque type dispose d’actions spécifiques.\n\nPar exemple, un [clerical_puppet|el] peut [excommunicate|el] quelqu’un à votre place, tandis qu’un [external_ruler_puppet|el] peut être contraint de libérer un [tributary|el] ou divorcer de son [spouse|el].\n\nVous ne pouvez posséder qu’un seul $game_concept_puppet|l$ de chaque type."
 game_concept_puppet_desc: "[character|E] contrôlé par un [puppeteer|El], qui peut effectuer des actions spéciales par son intermédiaire.\n\nAgir par l’intermédiaire d’un fantoche ouvre des portes qui, autrement, resteraient fermées : un [clerical_puppet|El] peut demander des [clerical_titles|El] ou une [excommunication|El] en votre nom, tandis qu’un [external_ruler_puppet|El] peut être contraint de libérer des [tributaries|El], d’accorder l’indépendance ou de divorcer de son [spouse|El].\n\nLes actions disponibles dépendent du [puppet_type|El]."
 game_concept_puppeteer: "Marionnettiste"
 game_concept_puppeteers: "Marionnettistes"
 game_concept_puppeteer_possessive: "Marionnettiste"
 game_concept_puppeteers_possessive: "Marionnettistes"
 game_concept_puppeteer_desc: "[character|E] qui exerce un contrôle sur un ou plusieurs [puppets|El].\n\nEn agissant par l’intermédiaire de ses fantoches, le marionnettiste détient des pouvoirs que sa position ne lui confère pas, tels que l’influence du [clergy|El] ou l’autorité d’un autre [realm|El]."
 game_concept_clerical_puppet: "Fantoche prêtre du pays"
 game_concept_clerical_puppets: "Fantoches prêtres du pays"
 game_concept_clerical_puppet_desc: "[realm_priest|E] qui n’est qu’un [puppet|El] entre les mains de son [liege|El].\n\nPar son intermédiaire, son [puppeteer|El] peut s’immiscer dans les affaires de la [faith|El] : adresser des requêtes au [head_of_faith|El] pour des [clerical_titles|El] ou une [excommunication|El], gérer des [holy_sites|El], fonder un [rite|El] ou convoquer un [ecumenical_council|El]."
 game_concept_external_clerical_puppet: "Fantoche dirigeant clérical"
 game_concept_external_clerical_puppets: "Fantoches dirigeants cléricaux"
 game_concept_external_clerical_puppet_desc: "Membre influent du [clergy|El] — un [archbishop|El], voire le [head_of_faith|El] — qui est devenu le [puppet|El] d’un [ruler|El].\n\nPlus le membre du clergé est puissant, plus son influence est grande : un chef de foi fait fantoche peut [excommunicate|El] vos ennemis, nommer des [cardinals|El], accorder une [pressed_claim|El] ou inciter à une [holy_war|El] en votre nom."
 game_concept_external_ruler_puppet: "Fantoche dirigeant laïc"
 game_concept_external_ruler_puppets: "Fantoches dirigeants laïcs"
 game_concept_external_ruler_puppet_desc: "[ruler|E] non [Concept('clergy', 'clérical')|E] devenu le [puppet|El] d’un autre [character|El].\n\nGrâce à ce fantoche, vous pouvez vous immiscer dans les affaires d’autres [realms|El], par exemple en recourant à des [schemes|El] ou à l’[imprisonment|El].\n\n\nAcquérir un fantoche de ce type nécessite l’[interaction|El] #V $make_external_ruler_puppet_interaction$#!, qui est débloquée lorsqu’au moins un de ces éléments est vrai :\n$BULLET_WITH_TAB$Vous êtes un [vassal|El] [Concept('clergy', 'clérical')|E] de la cible\n$BULLET_WITH_TAB$Vous êtes un [GetTrait('seducer').GetName( GetNullCharacter )] et la cible est votre [lover|El], ou votre [soulmate|El] si la cible a au moins un rang [Concept('king', 'royal')|E]\n$BULLET_WITH_TAB$Vous êtes un [GetTrait('torturer').GetName( GetNullCharacter )] et détenez la cible dans votre [dungeon|El]\n$BULLET_WITH_TAB$Vous avez le trait [GetTrait('family_first').GetName( GetNullCharacter )] et la cible est de votre [close_family|El]\n$BULLET_WITH_TAB$Vous êtes un [GetTrait('diplomat').GetName( GetNullCharacter )] et la cible est un [independent_ruler|El]\n$BULLET_WITH_TAB$Vous êtes [GetTrait('gallant').GetName( GetNullCharacter )] et la cible est votre [spouse|El]\n$BULLET_WITH_TAB$Vous êtes un [diarch|El] de la cible dans une [entrenched_regency|El]"
 game_concept_ecumenical_council: "Concile œcuménique"
 game_concept_ecumenical_council_desc: "[activity|E] au cours de laquelle les plus hauts dignitaires [Concept('clergy', 'cléricaux')|E] de toute la chrétienté se rassemblent pour décider de l’avenir de l’Église.\n\nAu terme de débats successifs, les prélats réunis prennent une décision quant au [tenet_status|El] des [core_tenets|El] discutés : ils peuvent les déclarer [permitted_tenet_status|El], [Concept('prohibited_tenet_status', 'interdits')|E] ou les élever au rang de principe [core_tenet_status|El] et établir les [doctrines|El] de la [faith|El]."
 game_concept_ecumenical_councils: "Conciles œcuméniques"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "Schisme"
 game_concept_schism_desc: "Le Grand $game_concept_schism$ marque le moment où la [faith|El] $christian_faith_adj$ unifiée se scinde en un [rite|El] romain et un rite grec, et se divise en $catholic|l$ et $orthodox|l$.\n\nIl s’agit d’une menace lorsque la [situation|El] de l’[the_christian_church|E] entre dans certains [the_christian_church_chapters_short|El] et que les [rulers|El] de toute la chrétienté doivent choisir leur camp. À moins que les divisions ne soient résolues — ou qu’une division ne soit imposée — par des [decisions|El], la séparation est définitive à la fin du [the_christian_church_chapter_short|El]."
 game_concept_schisms: "Schismes"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "Titre clérical"
 game_concept_clerical_titles: "Titres cléricaux"
 game_concept_clerical_title_desc: "[title|E] [ecclesiastical|El] détenu par un membre du [clergy|El] qui dirige une [clerical_region|El] dans une [faith|El]. Dans les fois [Concept('christian', 'chrétiennes')|E], il prend la forme d’un [archdiocese|El].\n\nIl est détenu par le [religious_superior|El] du [clergy|El] de cette région et est généralement conféré par le [head_of_faith|El]."
 game_concept_the_christian_church: "Église chrétienne"
 game_concept_the_christian_church_desc: "L’Église chrétienne est l’institution ecclésiastique qui supervise et guide les disciples de Jésus-Christ, représentée par une [situation|El] qui évolue au fil d’une succession de [the_christian_church_chapters_short|El].\n\nElle englobe tous les [archdioceses|El] du monde, ainsi que tout [ruler|El] [christian|El] de rang [Concept('county', 'comtal')|E] ou supérieur dont une partie du [realm|El] relève d’un archidiocèse, qu’il soit ecclésiastique ou laïc."
 game_concept_christendom: "Chrétienté"
 game_concept_christendom_desc: "La $game_concept_christendom|l$ englobe les [realms|El] des [rulers|El] [christians|El] [Concept('independent', 'indépendants')|El] qui font partie de la [situation|El] de l’[the_christian_church|E]."
 game_concept_christian: "Chrétien"
 game_concept_christians: "Chrétiens"
 game_concept_christian_possessive: "Chrétien"
 game_concept_christian_desc: "Adepte de [religion|El] chrétienne."
 game_concept_papal_bull: "Bulle papale"
 game_concept_papal_bulls: "Bulles papales"
 game_concept_bull: "Bulle"
 game_concept_bulls: "Bulles"
 game_concept_papal_bull_desc: "Une bulle papale est un décret solennel proclamé par le [head_of_faith|El] d’une [faith|El] [Concept('christian', 'chrétienne')|E], qui revêt toute l’autorité de l’[the_christian_church|E] conformément à la volonté de son auteur.\n\nUn [Concept('head_of_faith', 'chef de foi')|E] chrétienne disposant d’une [church_authority|El] suffisante peut en proclamer une en prenant la [decision|El] de [GetDecisionWithKey('enact_a_bull_decision').GetName|l], en échange de [piety|El], afin de :\n\n$EFFECT_LIST_BULLET$Appeler à une [great_holy_war|El]\n$EFFECT_LIST_BULLET$Déclarer un [rite|El] comme [heresy|El]\n$EFFECT_LIST_BULLET$Déclarer qu’un [core_tenet|El] est [permitted_tenet_status|El] ou [prohibited_tenet_status|El]"
 game_concept_situation_the_christian_church_phase: "Chapitre de l’Église chrétienne"
 game_concept_the_christian_church_chapter_short: "Chapitre"
 game_concept_the_christian_church_chapters_short: "Chapitres"
 game_concept_situation_the_christian_church_phases: "Chapitres de l’Église chrétienne"
 game_concept_situation_the_christian_church_phase_desc: "[situation_phases|E] de l’[the_christian_church|E]. Il y a sept chapitres au total, répartis en quatre [Concept('the_christian_church_chapter_types', 'types')|E]."
 game_concept_the_christian_church_chapter_type: "Type de chapitre"
 game_concept_the_christian_church_chapter_types: "Types de chapitre"
 game_concept_the_christian_church_chapter_type_desc: "Il y a quatre $game_concept_the_christian_church_chapter_types|l$ dans l’[the_christian_church|E] qui catégorisent les [situation_the_christian_church_phases|El].\n\n$game_concept_the_christian_church_chapter_types$ : [the_christian_church_unstable_short|El], [the_christian_church_crisis_short|El], [the_christian_church_zeal_short|El] et [the_christian_church_stability_short|El]"
 game_concept_the_christian_church_unstable: "Chapitre d’instabilité"
 game_concept_the_christian_church_unstable_short: "Instabilité"
 game_concept_the_christian_church_unstable_desc: "Dans un #high $game_concept_the_christian_church_unstable|l$#! de l’[the_christian_church|E], l’obéissance se fait rare :\n\nLes [rulers|El] peuvent facilement être tentés de se convertir à un autre [rite|El], les excommunications sont plus fréquentes et l’[gold|El] peut être dépensé à des fins personnelles.\n\nLes [the_christian_church_chapters_short|El] d’$game_concept_the_christian_church_unstable_short|l$ sont : #high $fragile_unity|l$#! et #high $reform_phase|l$#!."
 game_concept_the_christian_church_zeal: "Chapitre de zèle"
 game_concept_the_christian_church_zeal_short: "Zèle"
 game_concept_the_christian_church_zeal_desc: "Un #high $game_concept_the_christian_church_zeal|l$#! est toujours houleux :\n\nDes conversions de masse peuvent avoir lieu, les [great_holy_wars|El] sont plus fréquentes, les [papal_bulls|El] sont proclamées plus souvent et la conversion à la [faith|El] peut être plus facile.\n\nLes [the_christian_church_chapters_short|El] de $game_concept_the_christian_church_zeal_short|l$ sont : #high $conversion_phase|l$#! et #high $crusade_phase|l$#!."
 game_concept_the_christian_church_stability: "Chapitre de stabilité"
 game_concept_the_christian_church_stability_short: "Stabilité"
 game_concept_the_christian_church_stability_desc: "Un #high $game_concept_the_christian_church_stability|l$#! est une aubaine rare pour l’[the_christian_church|E] :\n\nLa construction d’une [temple_holding|El] coûte moins cher, les grandes cathédrales avancent plus vite, les [characters|El] ont plus de chances de devenir [GetTrait('devoted').GetName( GetNullCharacter )|l]s, et le Grand Schisme peut être résolu.\n\nL’unique $game_concept_the_christian_church_stability|l$ est : #high $concord|l$#!."
 game_concept_the_christian_church_crisis: "Chapitre de crise"
 game_concept_the_christian_church_crisis_short: "Crise"
 game_concept_the_christian_church_crisis_desc: "Un #high $game_concept_the_christian_church_crisis|l$#! montre l’[the_christian_church|E] dans ses pires moments :\n\nLes indulgences peuvent être moins chères, les [ecumenical_councils|El] sont plus fréquents, les [rulers|El] peuvent nommer leur propre [court_chaplain|El], le [clergy|El] peut se marier, le [head_of_faith|El] peut refuser d’organiser une [anointment|El] et les [taxes|El] peuvent en pâtir.\n\nLes [the_christian_church_chapters_short|El] de $game_concept_the_christian_church_crisis_short|l$ sont : #high $saeculum_obscurum|l$#! et #high $investiture_crisis|l$#!."
 game_concept_head_of_rite: "Chef de rite"
 game_concept_head_of_rite_desc: "Le [character|El] dirigeant d’un [rite|El] est le [head_of_faith|El] s’il le suit ; à défaut, le titulaire de la [clerical_region|El] où le rite compte le plus d’adeptes et, à défaut, le [ruler|El] qui règne sur la majorité des [counties|El] relevant de ce [rite|El].\n\nSeul le chef du rite peut modifier les [core_tenets|El] et les [doctrines|El] de celui-ci, et c’est lui qui s’exprime au nom de ses fidèles lorsque l’Église est au bord du [schism|El]."
 game_concept_ecclesiastical: "Ecclésiastique"
 game_concept_ecclesiastical_government: "Gouvernement ecclésiastique"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "[government_form|E] [theocratic|El] exercée par les [rulers|El] [Concept('clergy', 'cléricaux')|E] [christians|El] tels que les [bishops|El] et les [archbishops|El].\n\nLa plupart des dirigeants ecclésiastiques sont des [vassals|El] théocratiques dont les [temple_holdings|El] sont [Concept('lease', 'baillées à rente')|E] par un [liege|El] laïc et qui rendent compte au [head_of_faith|El], bien qu’un [bishop|El] détenant des [titles|El] [Concept('landed', 'fonciers')|E] non [Concept('leased', 'baillés à rente')|E] puisse régner en tant que [ruler|El] ecclésiastique [independent|El] de plein droit. Le pouvoir qu’un tel dirigeant exerce sur ses propres [vassals|El] est déterminé par l’[church_authority|El]."
 game_concept_lease_contract: "Contrat de bail à rente"
 game_concept_lease_contract_desc: "Conditions juridiques sous lesquelles un personnage [Concept('leasing', 'baille à rente')|E] un titre. Elles déterminent également qui est son [religious_superior|El]."
 game_concept_church_obligations: "Obligations de l’Église"
 game_concept_church_obligations_desc: "Ensemble des charges prélevées sur les revenus d’une [church_holding|El]. Elles sont versées au [superior|El], au [head_of_faith|El] et/ou au [ruler|El] laïc local. La [church_centralization|El] et les [secular_obligations|El] en sont un exemple."
 game_concept_church_centralization: "Centralisation de l’Église"
 game_concept_minimal_centralization: "Centralisation minimale"
 game_concept_mild_centralization: "Centralisation moyenne"
 game_concept_strong_centralization: "Forte centralisation"
 game_concept_church_centralization_desc: "La $game_concept_church_centralization|l$ indique dans quelle mesure celle-ci a mis en place une autorité et des structures financières centralisées. Une centralisation plus forte garantit un flux de recettes plus important vers le sommet de la hiérarchie ecclésiastique.\n\nLes types sont :\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "Obligations laïques"
 game_concept_personal_obligations: "Obligations personnelles"
 game_concept_fixed_obligations: "Obligations fixes"
 game_concept_secular_obligations_desc: "Les $game_concept_secular_obligations|l$ désignent la part des revenus provenant des [church_holdings|El] qui revient au [secular_ruler|El] local.\n\nLes types sont :\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nDans certains chapitres, les dirigeants laïcs exercent un pouvoir local sur l’Église\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "Supérieur religieux"
 game_concept_religious_superiors: "Supérieurs religieux"
 game_concept_superior: "Supérieur"
 game_concept_religious_superior_desc: "[character|E] qui exerce une autorité religieuse sur un ou plusieurs clergés [Concept('subordinate', 'subordonnés')|E] au sein d’une hiérarchie religieuse."
 game_concept_religious_subordinate: "Subordonné religieux"
 game_concept_religious_subordinates: "Subordonnés religieux"
 game_concept_subordinate: "Subordonné"
 game_concept_subordinates: "Subordonnés"
 game_concept_religious_subordinate_desc: "[character|E] qui a un [religious_superior|El] au sein d’une hiérarchie religieuse."
 game_concept_clerical_region: "Région cléricale"
 game_concept_clerical_regions: "Régions cléricales"
 game_concept_clerical_region_possessive: "Région cléricale"
 game_concept_clerical_regions_possessive: "Régions cléricales"
 game_concept_clerical_region_desc: "Région géographique relevant de la juridiction d’un [clerical_title|El]. Tout membre du clergé dans la région sera un [subordinate|El] du détenteur du [title|El] associé à la région.\n\nUn [ruler|El] appartient à la région cléricale qui contient le [county|El] de sa [capital|El], et une nouvelle région est fondée sur la [capital|El] du [primary_title|El] de son fondateur. La région peut couvrir plusieurs [realms|El] et avoir des subordonnés qui se trouvent dans des pays différents.\n\nUn $game_concept_ruler|l$ ne peut détenir qu’une seule $game_concept_clerical_region|l$ à la fois. S’il se voit attribuer une nouvelle région, il perd tous les territoires qu’il détenait dans la précédente."
 game_concept_clerical_region_capital: "Capitale de région cléricale"
 game_concept_clerical_region_capitals: "Capitales des régions cléricales"
 game_concept_clerical_region_capital_desc: "[county|E] sur lequel a été fondée une [clerical_region|El] au sein d’une [ecclesiastical_estate|El], qui sert de siège au [clerical_title|El] gouvernant la région. Contrairement à une [de_jure_capital|El], elle est rattachée à la région et ne peut être déplacée."
 clerical_electors: "Électeurs cléricaux"
 game_concept_archdiocese: "Archidiocèse"
 game_concept_archdioceses: "Archidiocèses"
 game_concept_archdiocese_desc: "L’archidiocèse est la forme [Concept('christian', 'chrétienne')|E] d’une [clerical_region|El], un domaine ecclésiastique détenu par un [archbishop|El] via son [clerical_title|El] et situé dans le [county|El] d’une capitale, où peut être construite une [grand_cathedral|El].\n\nUn [ruler|El] [christian|El] rend compte, en matière spirituelle, à l’[archbishop|El] de l’archidiocèse dont relève le [county|El] de sa [capital|El], et le territoire soumis à ces archidiocèses constitue dans son ensemble la [situation|El] de l’[the_christian_church|E]."
 game_concept_grand_cathedral: "Grande cathédrale"
 game_concept_grand_cathedrals: "Grandes cathédrales"
 game_concept_grand_cathedral_desc: "[great_building|E] érigé dans le cadre d’un [great_project|El] dans la capitale d’un [archdiocese|El], siège de son [archbishop|El].\n\nConstruire la première cathédrale est un acte monumental de dévotion : son fondateur y gagne une [piety|El], une [legitimacy|El] et un [spiritual_fulfillment|El] durables, un emplacement supplémentaire de [personal_tenet|El] et une [opinion|El] permanente de la part des personnages de sa [faith|El]. Une fois construite, elle attire des pèlerins chrétiens de toute la [christendom|El], agrandit l’[cathedral_complex|El] de son titulaire et peut même être agrandie par la suite pour devenir une [GetBuilding('great_project_cathedral_02').GetName|Vl] ou une [GetBuilding('great_project_cathedral_03').GetName|Vl]."
 game_concept_monastic_holy_order: "Ordre monastique"
 game_concept_monastic_holy_orders: "Ordres monastiques"
 game_concept_monastic_holy_order_possessive: "Ordre monastique"
 game_concept_monastic_holy_orders_possessive: "Ordres monastiques"
 game_concept_monastic: "Monastique"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "Type d’[holy_order|El] consacré à la prière, à l’étude et à la diffusion d’un seul [core_tenet|El]. Il appartient au [rite|El] de son fondateur et défend les [core_tenets|El] de ce [rite|El], afin d’en propager l’adoption parmi les fidèles.\n\nDirigé par l’[archabbot|El], un ordre monastique tire ses ressources des [temple_holdings|El] et de l’[gold|El] accordés par ses [monastic_order_patrons|El]. L’ordre procure de l’[spiritual_fulfillment|El] et de la [piety|El] en retour.\n\nTout [ruler|El] dont la [faith|El] autorise le monachisme peut en fonder un grâce à la [decision|El] de #high $create_holy_order_monastic_decision|l$#!."
 game_concept_monastic_order_patron: "Patron d’ordre monastique"
 game_concept_monastic_order_patrons: "Patrons d’ordre monastique"
 game_concept_monastic_order_patronize: "Patronner"
 game_concept_monastic_order_patronized: "Patronné"
 game_concept_monastic_order_patronage: "Patronage"
 game_concept_monastic_order_patron_desc: "[ruler|E] [ecclesiastical|El] ou laïc de [title_tier|El] [Concept('duchy', 'ducal')|E] au moins qui soutient un [monastic_holy_order|El] ; il s’agit généralement du dirigeant qui l’a fondé. Il dote l’ordre de richesses terrestres en lui baillant à rente des [temple_holdings|El] et en faisant don d’[gold|El] à ses coffres.\n\nEn échange de cette générosité, il gagne en [piety|El] et en [spiritual_fulfillment|El]. Il peut également contrôler le chef de l’ordre et le faire agir comme un [puppet|El] dans ses relations avec le [Concept('clerical', 'clergé')|E]."
 game_concept_mendicant: "Mendiant"
 game_concept_rite: "Rite"
 game_concept_rite_possessive: "Rite"
 game_concept_rites_possessive: "Rites"
 game_concept_rite_desc: "Branche d’une [faith|El] : une variante locale de ses pratiques religieuses dirigée par un [head_of_rite|El] et suivie par ses propres [counties|El] et [characters|El]. Toute foi possède un [mainline_rite|El] et peut en développer plusieurs autres.\n\nUn rite se définit par les [core_tenets|El] et [doctrines|El] qu’il défend. Une [faith|El] détermine si un principe est [permitted_tenet_status|El] ou [prohibited_tenet_status|El] en fonction de son [mainline_rite|El], et plus les décisions du [rite|El] s’opposent à ces jugements, plus la [rite_divergence|El] est grande : les rites divergents sapent la [fervor|El] de la [faith|El], peuvent être considérés comme une [heresy|El], et à partir d’une [divergence|El] de #V 100#!, peuvent se séparer pour former une [faith|El] à part entière.\n\nLes fidèles peuvent fonder de nouveaux rites, il est possible d’influencer les [rulers|El] pour qu’ils passent d’un rite à un autre, et seul le [head_of_rite|El] peut modifier ce dernier."
 game_concept_rites: "Rites"
 game_concept_archabbot: "Abbé"
 game_concept_archabbot_desc: "[ruler|E] d’un [monastic_holy_order|El] et le [Concept('head_of_rite', 'chef')|E] du [rite|El] que défend son ordre en guidant ses membres dans l’étude, la contemplation et la diffusion de ses [core_tenets|El].\n\nUn ordre peut bénéficier du soutien d’un [Concept('monastic_order_patron', 'patron')|E], dont le [monastic_order_patronage|El] lui apporte richesse et influence.\n\nÀ la mort de l’$game_concept_archabbot|l$, ses [titles|El] reviennent à un successeur, généralement le [courtier|El] le plus [Concept('learning', 'érudit')|E]."
 game_concept_archbishop: "Archevêque"
 game_concept_archbishops: "Archevêques"
 game_concept_archbishop_possessive: "Archevêque"
 game_concept_archbishops_possessive: "Archevêques"
 game_concept_archbishop_desc: "Titulaire chrétien d’un [archdiocese|El], un [clerical_title|El] de rang ducal dont la [clerical_region|El] peut comprendre plusieurs [realms|El].\n\nEn tant que [religious_superior|El] des [bishops|El] et du bas [clergy|El] de la région, un archevêque se situe au-dessus d’un [bishop|El] ordinaire et rend lui-même compte au [head_of_faith|El]."
 game_concept_bishop: "Évêque"
 game_concept_bishops: "Évêques"
 game_concept_bishop_possessive: "Évêque"
 game_concept_bishops_possessive: "Évêques"
 game_concept_bishop_desc: "L’$game_concept_bishop|l$ appartient au [clergy|El] d’une [faith|El] chrétienne, et détient ou prend à bail des [temple_holdings|El].\n\nL’évêque réside dans un [archdiocese|El] et rend compte à l’[archbishop|El] de celui-ci en tant que [religious_superior|El]. L’évêque sans terre dont les titres sont [Concept('leased', 'baillés à rente')|E] sert sous l’autorité d’un [liege|El] laïc, tandis que celui qui possède des [titles|El] [Concept('landed', 'terriens')|E] non baillés à rente peut régner en tant que [ruler|El] [ecclesiastical|El]."
 game_concept_rite_divergence: "Divergence"
 game_concept_rite_divergent: "Divergent"
 game_concept_divergence: "Divergence"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "La divergence mesure dans quelle mesure les [core_tenets|El] et [doctrines|El] du [rite|El] se sont éloignés de la [faith|El] parente. Un rite qui adopte comme [Concept('core_tenet_status', 'fondement')|E] des principes [Concept('prohibited_tenet_status', 'interdits')|E] présente une plus grande divergence.\n\nUne divergence élevée affaiblit la [fervor|El] de la foi parente et l’apparition d’[heresies|El] devient plus fréquente. Un rite atteignant un niveau de divergence de #V 100#! sera automatiquement déclaré hérétique et deviendra une nouvelle [faith|El]."
 game_concept_spiritual_fulfillment: "Épanouissement spirituel"
 game_concept_spiritual_fulfillment_desc: "Mesure du sentiment de paix qu’éprouve un [character|El] par rapport à sa [faith|El].\n\nLe calcul de base repose sur les [traits|El] du personnage et s’il est considéré comme [sinful|El] ou [virtuous|El].\n\nLe gain ou la perte d’$game_concept_spiritual_fulfillment|l$ dépend de l’adéquation entre les actes du personnage et la [faith|El]. Des [personal_tenets|El] peuvent être adoptés pour compenser les traits nuisibles."
 game_concept_fulfillment: "Épanouissement"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "Niveau d’épanouissement spirituel"
 game_concept_spiritual_fulfillment_levels: "Niveaux d’épanouissement spirituel"
 game_concept_spiritual_fulfillment_level_desc: "L’[spiritual_fulfillment|El] d’un [character|El] se divise en niveaux délimités par des seuils, chacun ayant ses propres effets.\n\nLes niveaux bas rendent la vie plus difficile et favorisent les actes pécheurs. Les niveaux élevés facilitent la dévotion et ouvrent de nouvelles possibilités religieuses."
 game_concept_personal_tenet: "Principe personnel"
 game_concept_personal_tenet_desc: "[core_tenet|E] qu’un [ruler|El] adopte comme élément essentiel de sa spiritualité.\n\nAdopter un $game_concept_personal_tenet|l$ qui est [core_tenet_status|El] ou a été [permitted_tenet_status|El] par la [faith|El] procure de l’[spiritual_fulfillment|El], tandis qu’en adopter un [prohibited_tenet_status|El] entraînera un [secret|El]. Le $game_concept_personal_tenet|l$ procure également des effets supplémentaires et débloque des mécanismes spéciaux.\n\nLe nombre de $game_concept_personal_tenets|l$ auquel un personnage peut adhérer est affecté par son [piety_level|El] et le [trait|El] [GetTrait('theologian').GetName( GetNullCharacter )]."
 game_concept_personal_tenets: "Principes personnels"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "Cardinal"
 game_concept_cardinals: "Cardinaux"
 game_concept_cardinal_possessive: "Cardinal"
 game_concept_cardinals_possessive: "Cardinaux"
 game_concept_cardinalate: "Cardinalat"
 game_concept_cardinalates: "Cardinalats"
 game_concept_cardinal_desc: "Membre du [clergy|el] choisi par le pape pour aider à exercer davantage la volonté de l’[the_christian_church|e]. Tous les membres du [college_of_cardinals|E] sont à la fois candidats et électeurs à la papauté et ont un [papabile_score|El]."
 game_concept_college_of_cardinals: "Collège des cardinaux"
 game_concept_college_of_cardinals_desc: "Assemblée des [cardinals|El] qui conseille le pape et élit le prochain [head_of_faith|El] de l’[the_christian_church|E].\n\nChaque [cardinal|El] est à la fois candidat et électeur à la papauté."
 game_concept_papabile_score: "Score de papabilité"
 game_concept_papabile_scores: "Scores de papabilité"
 game_concept_papabile_score_desc: "Tous les membres du [college_of_cardinals|E] disposent d’un $game_concept_papabile_score|l$ qui tient compte de leurs [traits|El], de leur [piety_level|El], de leur [rite|El] et de l’[opinion|El] des autres cardinaux.\n\nLes [cardinals|El] ayant le $game_concept_papabile_score|l$ le plus élevé peuvent recevoir davantage de voix lors d’une élection papale.\n\nLe $game_concept_papabile_score|l$ peut être augmenté grâce à l’[character_interaction|El] #high $increase_papabile_score_interaction$#! et à la [decision|El] [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]."
 game_concept_mainline_rite: "Rite dominant"
 game_concept_mainline_rite_desc: "Le [rite|El] dominant est l’ensemble de croyances le plus répandu d’une [faith|El]. Un $game_concept_rite|l$ non dominant est considéré comme [rite_divergent|El] de ce $game_concept_rite|l$.\n\nLe $game_concept_rite|l$ dominant dépend de l’existence ou non d’un [head_of_faith|El].\n\nSi la $game_concept_faith|l$ en a un, le $game_concept_rite|l$ dominant est toujours celui que suit ce chef. Cela signifie également qu’il peut changer si un successeur, qui suit un autre $game_concept_rite|l$, prend sa place – y compris un éventuel [challenger_hof|El].\n\nEn l’absence de $game_concept_head_of_faith|l$, tout $game_concept_rite|l$ qui rassemble plus de [counties|El] pratiquants remplace le rite dominant, à condition qu’il détienne au moins autant de [holy_sites|El] que le $game_concept_rite|l$ qu’il remplace."
 game_concept_mainline_rites: "Rites dominants"
 game_concept_mainline_rite_short: "Dominant"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "Statut de principe"
 game_concept_tenet_status_desc: "Le $game_concept_tenet_status|l$ décrit la position d’un [rite|El] vis-à-vis d’un [core_tenet|El] ou d’une [doctrine|El]. La même échelle à cinq niveaux s’applique aux deux. Voici les niveaux classés par ordre croissant d’importance :\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — le $game_concept_rite|l$ ne connaît pas ce $game_concept_core_tenet|l$ ou cette $game_concept_doctrine|l$.\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — le $game_concept_rite|l$ en a connaissance, mais cette pratique n’est ni encouragée ni rejetée.\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — le $game_concept_rite|l$ approuve cette pratique.\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — le $game_concept_rite|l$ interdit expressément cette pratique.\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — le $game_concept_rite|l$ encourage activement la pratique de ce $game_concept_core_tenet|l$.\n\nLe statut d’un $game_concept_rite|l$ par rapport à un $game_concept_core_tenet|l$ ou une $game_concept_doctrine|l$ détermine si l’on peut choisir de fonder ou faire diverger un $game_concept_rite|l$, et si les adeptes subissent des pénalités spirituelles lorsqu’ils y sont associés.\n\nCela diffère de la [tenet_knowledge|El] d’un [character|El], car il s’agit là de sa connaissance personnelle et non de la position du $game_concept_rite|l$."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "Inconnu"
 game_concept_unknown_tenet_status_desc: "Le [tenet_status|El] $game_concept_unknown_tenet_status$ signifie que le [rite|El] ignore tout du [core_tenet|El] ou de la [doctrine|El]. Les adeptes du $game_concept_rite|l$ ne le connaissent pas d’emblée et ne peuvent pas le choisir lorsqu’ils créent un $game_concept_rite|l$ ou un [personal_tenet|El]."
 game_concept_known_tenet_status: "Connu"
 game_concept_known_tenet_status_desc: "Le [tenet_status|El] $game_concept_known_tenet_status$ signifie que le [rite|El] connaît l’existence de ce [core_tenet|El] ou de cette [doctrine|El], mais n’approuve ni n’autorise sa pratique. Il peut être pris en compte lors de la création ou de la modification du $game_concept_rite|l$, et peut être élevé à un [Concept('tenet_status', 'statut')|E] supérieur."
 game_concept_permitted_tenet_status: "Permis"
 game_concept_permit_tenet_status: "Permettre"
 game_concept_permitted_tenet_status_desc: "Le [tenet_status|El] $game_concept_permitted_tenet_status$ signifie que le [rite|El] approuve ce [core_tenet|El] ou cette [doctrine|El] sans en faire la promotion. Un [character|El] de ce $game_concept_rite|l$ peut adopter le $game_concept_core_tenet|l$ comme [personal_tenet|El] sans pénalité spirituelle."
 game_concept_prohibited_tenet_status: "Interdit"
 game_concept_prohibit_tenet_status: "Interdire"
 game_concept_prohibited_tenet_status_desc: "Le [tenet_status|El] $game_concept_prohibited_tenet_status$ signifie que le [rite|El] interdit explicitement ce [core_tenet|El] ou cette [doctrine|El]. Un [character|El] suivant ce $game_concept_rite|l$ qui adopte un tel $game_concept_core_tenet|l$ comme [personal_tenet|El] le gardera [secret|El], et le $game_concept_rite|l$ qui adopte des [core_tenets|El] [Concept('prohibited_tenet_status', 'interdits')|E] comme [Concept('core_tenet_status', 'fondamentaux')|E] [Concept('rite_divergent', 'diverge')|E] davantage de sa [faith|El]."
 game_concept_core_tenet_status: "Fondamental"
 game_concept_core_tenet_status_desc: "Le [tenet_status|El] $game_concept_core_tenet_status$ signifie que le [rite|El] fait la promotion de ce [core_tenet|El] ou de cette [doctrine|El], qui de plus en est une pratique caractéristique. Tous les adeptes du $game_concept_rite|l$ sont soumis à ses effets."
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "Connaissance religieuse"
 game_concept_doctrine_knowledge: "Connaissance doctrinale"
 game_concept_rite_knowledge: "Connaissance de rite"
 game_concept_agnostic_knowledge: "Connaissance"
 game_concept_tenet_knowledge_desc: "Les personnages ne connaissent pas tous les détails de chaque pratique religieuse.\n\nLes principes et doctrines connus peuvent être utilisés lors de la création d’un $game_concept_rite|l$ [rite_divergent|El], et peuvent être adoptés comme [personal_tenets|El]. Connaître tous les $game_concept_core_tenets|l$ et $game_concept_doctrines|l$ d’un $game_concept_rite|l$ facilite la conversion.\n\nTous les [core_tenets|El] et [doctrines|El] de votre [faith|El] vous sont connus. De nouvelles connaissances peuvent être acquises grâce à des relations telles que [spouses|El] ou [friends|El], le [traveling|El], les [activities|El] ou le [scheme|El] d’étude de rite."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "Enchâssé"
 game_concept_enshrine: "Enchâsser"
 game_concept_enshrined_desc: "Une [holy_relic|El] enchâssée dans un [holy_site|El] active les bonus du $game_concept_holy_site|l$ et améliore les bonus conférés. Cette amélioration évolue en fonction du niveau de [rarity|El] total des artefacts enchâssés.\n\nUn artefact $game_concept_enshrined|l$ n’est plus la possession d’un personnage, mais le [holder|El], le [top_liege|El] ou le titulaire de la [clerical_region|El] du $game_concept_holy_site|l$ peut toujours interagir avec lui. L’artefact ne se détériore plus. Vous pouvez enchâsser des $game_concept_holy_relics|l$ seulement pour votre [faith|El] et les $game_concept_holy_relics|l$ enchâssées d’une autre foi ne procurent aucun avantage.\n\nIl peut également y avoir des récompenses ou des coûts liés à l’enchâssement ou au retrait d’un artefact enchâssé."
 game_concept_holy_relic: "Sainte relique"
 game_concept_holy_relics: "Saintes reliques"
 game_concept_holy_relic_desc: "[artifact|E] qui revêt une signification religieuse pour une [faith|El]. Une $game_concept_holy_relic|l$ peut être [Concept('enshrined', 'enchâssée')|E] dans un [holy_site|El] de cette foi pour en tirer des bénéfices.\n\nCertains artefacts sont intrinsèquement sacrés pour une certaine foi, mais peuvent également être [Concept('sanctified', 'sanctifiés')|El] afin de devenir des $game_concept_holy_relics|l$."
 game_concept_sanctified: "Sanctifié"
 game_concept_sanctify: "Sanctifier"
 game_concept_sanctifying: "Sanctifie"
 game_concept_sanctified_desc: "Sanctifier un [artifact|El] en fait une [holy_relic|El] pour une certaine [faith|El]. Un artefact peut être sanctifié pour plusieurs fois."
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Possession ecclésiastique"
 game_concept_ecclesiastical_estates: "Possessions ecclésiastiques"
 game_concept_ecclesiastical_estate_desc: "Une $game_concept_ecclesiastical_estate|l$ — ou $game_concept_cathedral_complex|l$ — est un type de [domicile|El] lié à un [clerical_title|El], qui représente les biens les plus personnels d’un [archbishop|El] ainsi que son siège. Le [clergy|El] subalterne d’un [GetGovernment('ecclesiastical_government').GetName|l] doit atteindre le rang correspondant à ce [title|El] avant qu’une telle propriété ne lui soit accordée.\n\nOn peut y construire des [Concept('ecclesiastical_estate_buildings', 'bâtiments')|E] afin d’accroître la richesse, la [piety|El] et l’[spiritual_fulfillment|El] du titulaire. La $game_concept_ecclesiastical_estate|l$ ne change pas de lieu et sera héritée par le prochain [holder|El] du titre."
 game_concept_ecclesiastical_estate_building: "Bâtiment de possession ecclésiastique"
 game_concept_ecclesiastical_estate_buildings: "Bâtiments de possession ecclésiastique"
 game_concept_ecclesiastical_estate_building_desc: "Améliorations uniques et permanentes de la [ecclesiastical_estate|El] d’une [noble_family|El].\n\nLeur propriétaire peut construire une large variété de structures afin de générer des revenus privés, de la [piety|El], de l’[spiritual_fulfillment|El] ou encore d’avoir accès à de nombreuses [decisions|El], [interactions|El], etc."
 game_concept_cathedral_complex: "Ensemble cathédral"
 game_concept_cathedral_complexes: "Ensembles cathédraux"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "Bâtiment d’$game_concept_cathedral_complex|l$"
 game_concept_cathedral_complex_buildings: "Bâtiments d’$game_concept_cathedral_complex|l$"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "Canonisé"
 game_concept_canonized_desc: "[character|E] qui, à sa mort, a été proclamé saint ou l’équivalent dans une autre foi, tel qu’un wali ou un vénérable ancêtre, et qui acquiert ainsi le [trait|El] de [GetTrait('saint').GetName( GetNullCharacter )|l].\n\nUne vie vertueuse peut aboutir à la $game_concept_canonization|l$ : celle-ci fait l’objet d’une [decision|El], peut nécessiter la bénédiction du [head_of_faith|El] et est scellée par la consécration du lieu de sépulture du saint. Dès lors, son lieu de repos attire des voyageurs pieux et sa dépouille peut donner des [holy_relics|El]."
 game_concept_canonization: "Canonisation"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Sainteté"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "[interaction|E] qui fait d’une [unpressed_claim|El] une [pressed_claim|El] grâce à l’approbation d’un [ruler|El] [ecclesiastical|El] ou [theocratic|El]."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "[interaction|E] qui procure une [claim|El] sur un [title|El] appartenant à un autre [ruler|El]. Elle nécessite l’acceptation d’un [character|El] [ecclesiastical|El] ou [theocratic|El] adéquat."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "[interaction|E] qui permet le transfert pacifique d’un [title|El] ou d’un [vassal|El] entre deux [rulers|El], à condition que le [ruler|El] destinataire et un deuxième intervenant l’acceptent.\n\nUn refus fait perdre au destinataire de la [piety|El] et de la [legitimacy|El] et entraîne un coût supplémentaire, choisi par l’acteur, afin d’encourager l’acceptation.\n\nL’intervenant, un dirigeant [ecclesiastical|El] ou [theocratic|El] concerné, peut d’une part interdire que cette interaction ait lieu, et d’autre part même imposer l’acceptation par le biais de la [law|El] de l’[GetLaw('church_authority_3').GetName|l]."
 game_concept_challenger_hof: "Prétendant au titre de chef de la foi"
 game_concept_antipope: "Antipape"
 game_concept_challenger_hof_desc: "[head_of_faith|E] rival qui s’oppose au $game_concept_head_of_faith|l$ du [mainline_rite|El].\n\nUn [ruler|El] peut parrainer un membre de son propre [clergy|El] en tant que $game_concept_challenger_hof|l$. Un [ruler|El] [Concept('clergy', 'clerc')|E] ou un dirigeant d’une [faith|El] dotée d’un chef de foi temporel peut même se désigner lui-même comme prétendant.\n\nUn $game_concept_challenger_hof|l$ parrainé adopte le [rite|El] de son commanditaire, devient le [external_clerical_puppet|El] de ce dernier en tant que souverain clérical et lui doit un [weak_hook|El].\n\nLe $game_concept_head_of_faith|l$ du $game_concept_mainline_rite|l$ ne peut [excommunicate|El] quiconque suit le $game_concept_challenger_hof|l$ : le commanditaire et ses [vassals|El].\n\nQuiconque suit un $game_concept_challenger_hof|l$ lui présente ses requêtes ecclésiastiques plutôt qu’au $game_concept_head_of_faith|l$ du $game_concept_mainline_rite|l$. Cela inclut notamment les [interactions|El] suivantes :\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nUn $game_concept_challenger_hof|l$ ou son commanditaire peut invoquer le [casus_belli|El] [pam_challenge_hof_cb|E] contre le $game_concept_head_of_faith|l$ légitime.\n\nLes [kings|El] rivaux ou de rang supérieur de la même [faith|El] peuvent, à la place, utiliser le [casus_belli|El] [pam_antiking_cb|E] contre le commanditaire et ainsi destituer le prétendant rival."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "Défier le chef de la foi"
 game_concept_pam_challenge_hof_cb_desc: "[casus_belli|E] utilisé par le [challenger_hof|El] ou son commanditaire contre le [Concept('head_of_faith', 'chef')|E] légitime de sa [faith|El]. En cas de victoire, le $game_concept_challenger_hof|l$ devient le $game_concept_head_of_faith|l$ et son [rite|El] devient le [mainline_rite|El]. Un commanditaire qui remporte la guerre et dont le rang est supérieur à celui du $game_concept_challenger_hof|l$ fait également de ce dernier son [vassal|El]."
 game_concept_pam_antiking_cb: "Déposer l’antipape"
 game_concept_pam_antiking_cb_desc: "[casus_belli|E] disponible pour les [kings|El] [Concept('christian', 'chrétiens')|E] ou supérieurs qui ne soutiennent pas un [challenger_hof|El] et qui n’en sont pas un. Il est utilisé contre un commanditaire [independent|El] de leur [faith|El] afin de déposer son $game_concept_challenger_hof|l$ et gagner la gratitude du [head_of_faith|El] légitime."
 game_concept_petition_antipope_indulgences_interaction: "Demander l’indulgence de l’antipape"
 game_concept_petition_antipope_indulgences_interaction_desc: "[interaction|E] disponible pour quiconque suit un [challenger_hof|El]. Offrez de l’[gold|El] à votre $game_concept_antipope|l$ pour obtenir son pardon et de la [piety|El], tout en évitant le [head_of_faith|El] du [mainline_rite|El]. Son commanditaire est accepté automatiquement."
 game_concept_petition_antipope_gold_interaction: "Demander de l’or à l’antipape"
 game_concept_petition_antipope_gold_interaction_desc: "[interaction|E] disponible pour quiconque suit un [challenger_hof|El]. Demandez de l’[gold|El] à votre $game_concept_antipope|l$. Son commanditaire est accepté automatiquement."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "[decision|E] à la disposition des prélats et des dirigeants puissants qui conduit l’[the_christian_church|E] vers le chapitre de leur choix."
 game_concept_tenet_popularity: "Popularité du principe"
 game_concept_tenet_popularity_desc: "À mesure que les [personal_tenets|El] se répandent au sein d’une [faith|El], leur pratique devient plus courante. La $game_concept_tenet_popularity|l$ indique à quel point un [core_tenet|El] est répandu et influe sur la probabilité qu’il soit choisi comme sujet de débat lors d’un [ecumenical_council|El] ou comme objet d’une [papal_bull|El].\n\nPlus la $game_concept_tenet_popularity|l$ est élevée, plus le [clergy|El] se range en sa faveur lorsqu’il est débattu lors d’un [ecumenical_council|El]. Dès qu’un principe atteint une popularité de #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!, le [head_of_faith|El] est susceptible de le déclarer [permitted_tenet_status|El], quelles que soient ses propres convictions."
 game_concept_ecumenical_council_innovator: "Innovateur"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Innovateurs"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "[activity_guests_short|E] à l’[activity|El] du [ecumenical_council|El] votant pour la suggestion de l’[activity_host_short|El] de changer le statut d’un [core_tenet|El] ou d’une [doctrine|El].\n\nIls s’opposent directement aux [ec_conservatives|El], les invités qui votent pour préserver le statu quo.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help Les [characters|El] qui sont autorisés à voter sont : le [clergy|El], les [rulers|El] ayant un [clerical_puppet|El] et l’[activity_host|El]#!"
 game_concept_ecumenical_council_conservative: "Conservateur"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Conservateurs"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "[activity_guests_short|E] de l’[activity|El] du [ecumenical_council|El] votant contre la suggestion de l’[activity_host_short|El] de changer le statut d’un [core_tenet|El] ou d’une [doctrine|El].\n\nIls s’opposent directement aux [ec_innovators|El], les invités qui tentent de mettre en œuvre ce changement.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[interaction|E] utilisée par les [rulers|El] [Concept('ecclesiastical', 'ecclésiastiques')|E] pour étendre leur [clerical_region|El] aux [counties|El] [de_jure|El] d’un [duchy|El] limitrophe.\n\nCeci n’est possible qu’avec l’accord du [head_of_faith|El]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[interaction|E] par laquelle les [rulers|El] [Concept('ecclesiastical', 'ecclésiastiques')|E] peuvent amener les dirigeants laïcs de la même [faith|El] à déclarer une [holy_war|El] contre les dirigeants de fois hostiles."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[interaction|E] par laquelle les [rulers|El] [Concept('ecclesiastical', 'ecclésiastiques')|E] peuvent amener les dirigeants laïcs de la même [faith|El] à déclarer une [war|El] pour appuyer une [claim|El] contre un [ruler|El] laïc."
 game_concept_treasury_cardinal_budget: "Budget cardinalice"
 game_concept_treasury_cardinal_budget_short: "Cardinalice"
 game_concept_treasury_cardinal_budget_benefices: "Bénéfices cardinalices"
 game_concept_treasury_cardinal_budget_desc: "Trésor alloué aux [cardinals|El], provenant de la trésorerie centrale de l’Église, qui correspond aux [Glossary( 'bénéfices', 'CARDINAL_BENEFICES_GLOSS' )] directs et indirects qui leur sont attribués."
 CARDINAL_BENEFICES_GLOSS: "Les bénéfices ecclésiastiques étaient des propriétés locales ou éloignées, des charges ou des revenus pontificaux partagés, qui pouvaient être attribués à un membre du clergé #i en commende#! (en fiducie). Ils lui procuraient un revenu, généralement sans qu’il ait à assumer de responsabilités administratives directes."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[interaction|E] dans laquelle une autorité [Concept('clerical', 'cléricale')|E] troque le réconfort de l’[spiritual_fulfillment|El] contre un [hook|El]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "[interaction|E] qui oblige un autre [character|El] à prononcer des vœux de chasteté et à subir une pénalité de [fertility|El] à long terme."
 game_concept_military_holy_order: "Ordre militaire"
 game_concept_military_holy_orders: "Ordres militaires"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "Ordre militaire"
 game_concept_military_holy_orders_possessive: "Ordres militaires"
 game_concept_military_holy_order_desc: "Type d’[holy_order|El] composé de guerriers qui ont juré de défendre et d’étendre le territoire de leur [faith|El].\n\nLes dirigeants de la même foi peuvent embaucher l’ordre pour un coût en [piety|El] s’ils sont en [war|El] avec une $game_concept_faith|l$ [faith_hostile|Ll] ou [faith_evil|Ll]. L’ordre cessera de se battre à la fin de cette guerre.\n\nUn $game_concept_military_holy_order|l$ peut avoir un [Concept('military_holy_order_patron', 'patron')|El] qui n’a pas besoin de payer pour engager ses services."
 game_concept_military_holy_order_patron: "Patron d’ordre militaire"
 game_concept_military_holy_order_patronage: "Patronage d’ordre militaire"
 game_concept_military_holy_order_patronize: "Patronner"
 game_concept_military_holy_order_patron_desc: "Le patron d’un [military_holy_order|El] est un [ruler|El] de [title_tier|El] [Concept('duke', 'ducal')|E] ou supérieur qui a en commun avec l’ordre une [faith|El] et dont le [realm|El] contient la capitale de l’ordre.\n\nIl peut appeler l’ordre contre ses ennemis religieux sans avoir à payer de la [piety|El].\n\nLe patronage peut être perdu face à des [vassals|El] de [title_tier|El] [Concept('duke', 'ducal')|E] ou supérieur si la capitale de l’ordre est cédée."
