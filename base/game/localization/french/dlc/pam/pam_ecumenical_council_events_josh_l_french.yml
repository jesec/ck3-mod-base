l_french:
 ecumenical_council_events_josh.0001.t: "Meurtre pendant les complies"
 ecumenical_council_events_josh.0001.desc: "Les religieux sont tellement prévisibles. Alors que [murder_target.Custom('FR_le_Char_Pi')][murder_target.GetTitledFirstName] s’incline pour prier pendant les [Glossary( 'complies', 'COMPLINE_GLOSS' )], je l’attends dans l’ombre.\n\nSes longues prières [murder_target.Custom('FR_LeLa')] laissent sans défense. Quand nous sommes [Select_CString(And(ROOT.Char.IsFemale, murder_target.IsFemale), 'seules', 'seuls')], même les plus beaux vêtements — soutane ou velours — peuvent se transformer en un piège."
 ecumenical_council_events_josh.0001.a: "Bouger pour resserrer ses vêtements."
 ecumenical_council_events_josh.0001.a.tt: "Un peu trop serré pour être confortable"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.Custom('FR_IlElle')|U] m’échappe"
 ecumenical_council_events_josh.0001.a.toast.success: "Réussite du meurtre"
 ecumenical_council_events_josh.0001.a.toast.failure: "Échec de la tentative de meurtre"
 ecumenical_council_events_josh.0001.a.flavor: "Celui qui prie autant a sûrement péché..."
 ecumenical_council_events_josh.0001.b: "Non, pas lors d’un acte sacré..."
 COMPLINE_GLOSS: "Les complies sont la dernière prière de la journée dans la Liturgie des Heures, le cycle quotidien de prières de la tradition chrétienne."
 ecumenical_council_events_josh.0010.t: "Une sainte célébration"
 ecumenical_council_events_josh.0010.desc: "Le clergé s’est réuni, et rien ne nous réjouit davantage que de rendre hommage à l’une de nos figures emblématiques. Ce mois-ci, il nous semble tout à fait approprié d’honorer [monthly_saint.Custom('FR_le_Char_Pi')][monthly_saint.GetTitledFirstName].\n\n« Au nom [ROOT.Char.GetFaith.HighGodNamePossessive], nous allons diriger le culte de ce jour. »"
 ecumenical_council_events_josh.0010.a: "Consacrer la messe."
 ecumenical_council_events_josh.0010.b: "Je vais prononcer un sermon."
 ecumenical_council_events_josh.0010.c: "Ajouter un psaume ou un hymne."
 ecumenical_council_events_josh.0011.t: "Comme le tonnerre"
 ecumenical_council_events_josh.0011.desc: "Alors que j’accueille les invités, je remarque [guest_giant.Custom('FR_le_Char_Pi')][guest_giant.GetTitledFirstName] qui se détache de la foule par sa stature imposante. Mais ce n’est que lorsqu’[guest_giant.Custom('FR_IlElle')] s’exclame : « Soyez les bienvenus, mes compagnons gardiens de la foi », que je prends conscience de son véritable talent.\n\nAvec une voix qui gronde comme le tonnerre, [guest_giant.Custom('FR_IlElle')] pourrait s’avérer extrêmement utile. Les psaumes des [Glossary( 'vêpres', 'VESPER_GLOSS' )] auraient bien besoin d’une basse supplémentaire..."
 ecumenical_council_events_josh.0011.a: "Que sa voix porte nos prières jusqu’[ROOT.Char.GetFaith.HighGodName2]."
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName|U] et tous ceux présents sont en admiration."
 ecumenical_council_events_josh.0011.b: "Je pourrais plutôt mettre à profit la résonance de son soutien dans ce débat."
 ecumenical_council_events_josh.0011.b.tt: "On pourra compter sur [guest_giant.Custom('FR_LuiElle')]"
 ecumenical_council_events_josh.0011.b.tt2: "On ne peut lui faire confiance que [guest_giant.Custom('FR_SilSielle')] reçoit sa part"
 ecumenical_council_events_josh.0011.b.toast.success: "Vous [guest_giant.Custom('FR_LeLa')] convainquez de vous soutenir"
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.Custom('FR_IlElle')|U] veut quelque chose en retour pour son soutien"
 ecumenical_council_events_josh.0011.b.flavor: "Si [guest_giant.Custom('FR_le_Char_Pi')][guest_giant.GetTitledFirstName] apporte son soutien haut et fort au bon moment, j’aurai le dessus."
 ecumenical_council_events_josh.0011.c: "C’est un[guest_giant.Custom('FR_E')] invité[guest_giant.Custom('FR_E')], pas un instrument."
 ecumenical_council_events_josh.0011.c.flavor: "Laissons-[guest_giant.Custom('FR_LeLa')] trouver sa place parmi nous."
 ecumenical_council_events_josh.0011.c.tt: "Vous ne forcez pas [guest_giant.Custom('FR_le_Char_Pi')][guest_giant.GetTitledFirstName] à rejoindre le chœur ni à participer à un débat"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a soutenu [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] lors d’un concile œcuménique."
 VESPER_GLOSS: "Les vêpres sont la prière du soir. Il s’agit généralement de la prière qui précède le souper dans la Liturgie des Heures, l’enchaînement quotidien des prières dans le christianisme."
 ecumenical_council_events_josh.0012.t: "Une bague épiscopale"
 ecumenical_council_events_josh.0012.desc: "J’ai remarqué que [guest_bishoplover.Custom('FR_le_Char_Pi')][guest_bishoplover.GetTitledFirstName] et [guest_bishop.Custom('FR_le_Char_Pi')][guest_bishop.GetTitledFirstName] sont inséparables depuis le début du concile. Aux [Glossary( 'laudes', 'LAUD_GLOSS' )] de ce matin, [guest_bishoplover.GetFirstName] arrive en retard et paraît négligé[guest_bishoplover.Custom('FR_E')]. Est-ce la bague de [guest_bishop.GetFirstName] qu’[guest_bishoplover.Custom('FR_IlElle')] porte au doigt ? Je lui fais gentiment part de ma découverte en haussant un sourcil.\n\nLorsqu’[guest_bishoplover.Custom('FR_IlElle')] se rend compte de sa méprise, [guest_bishoplover.Custom('FR_IlElle')] rougit et balbutie :\n\n« S’il vous plaît, personne ne doit le savoir... »"
 ecumenical_council_events_josh.0012.b: "« Donnez-moi la bague et taisez-vous. »"
 ecumenical_council_events_josh.0012.c: "« Cela restera entre moi, vous et [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events_josh.0012.bishopringname: "Bague d’évêque"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nUn signe distinctif du ministère apostolique de celui qui le porte."
 LAUD_GLOSS: "Les laudes sont la prière du matin. Il s’agit généralement de la prière qui précède le petit-déjeuner dans la Liturgie des Heures, l’enchaînement quotidien des prières dans le christianisme."
 ecumenical_council_events_josh.0013.t: "Un crime vestimentaire"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.Custom('FR_le_Char_Pi')|U][fashion_criminal.GetTitledFirstName] est magnifiquement vêtu[fashion_criminal.Custom('FR_E')]. [fashion_criminal.Custom('FR_IlElle')|U] porte une nouvelle robe confectionnée pour l’occasion, qui est sans aucun doute un cadeau de son groupe d’admirateurs. Une broderie représentant [ROOT.Char.GetFaith.WealthGodName] orne l’étole en soie.\n\nQuel toupet ! Enfreint-[fashion_criminal.Custom('FR_IlElle')] ouvertement les principes de la foi [fashion_criminal.GetFaith.GetAdjective] ou n’est-[fashion_criminal.Custom('FR_IlElle')] qu’un paon vaniteux ?"
 ecumenical_council_events_josh.0013.a: "« Que cette horreur disparaisse de ma vue. »"
 ecumenical_council_events_josh.0013.b: "« Partez, vous vous êtes montré[fashion_criminal.Custom('FR_E')] indigne ! »"
 ecumenical_council_events_josh.0013.b.toast.success: "Vous réussissez à [fashion_criminal.Custom('FR_LeLa')] faire exclure."
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.Custom('FR_IlElle')|U] parvient à rester au concile."
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a porté une tenue inappropriée lors d’un concile œcuménique."
 ecumenical_council_events_josh.0020.t: "Un parangon de ferveur"
 ecumenical_council_events_josh.0020.desc.intro: "« Regardez ce pilier de la foi [ROOT.Char.GetFaith.GetAdjective] ! Un véritable témoignage que les justes suivent la croix. »\n\n[host.Custom('FR_le_Char_Pi')|U][host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: " fait référence à la fois où [faith_battle_memory.GetDescription]. Il faut combattre les païens à chaque occasion qui se présente. Je lève mon épée et accepte ses louanges. « Pour les fidèles ! »"
 ecumenical_council_events_josh.0020.desc.fallback: " reconnaît mes récentes contributions à la foi. Être appelé[ROOT.Char.Custom('FR_E')] devant l’assemblée du clergé m’emplit de fierté. »"
 ecumenical_council_events_josh.0020.a: "« Au nom [ROOT.Char.GetFaith.HighGodNamePossessive], nous vaincrons ! »"
 ecumenical_council_events_josh.0020.a.flavor: "Mes actes ont ému les religieux présents."
 ecumenical_council_events_josh.0020.b: "Je vais simplement savourer ma gloire."
 ecumenical_council_events_josh.0021.t: "Dans la Lumière"
 ecumenical_council_events_josh.0021.desc: "Un rayon de lumière parcourt le sol tandis que le débat s’éternise. Je m’y avance et, soudain, tous les regards se tournent vers moi.\n\nComme si mes paroles ne suffisaient pas, cette lumière divine renforce mon propos. Mon adversaire [council_opponent.GetFirstName] reste dans l’ombre. Ses arguments semblent encore plus obscurs."
 ecumenical_council_events_josh.0021.a: "Tirer parti de mon avantage par rapport à [council_opponent.GetFirstName]."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.Custom('FR_le_Char_U_Pi')|U][council_opponent.GetShortUINameNoTooltip|U] quitte les [ec_conservatives|El] et rejoint les [ec_innovators|El]"
 ecumenical_council_events_josh.0021.b: "Que la lumière rallie l’assemblée à ma cause."
 ecumenical_council_events_josh.0021.b.ct: "Jusqu’à #V 3#! [ec_conservatives|El] rejoignent les [ec_innovators|El]"
 ecumenical_council_events_josh.0021.c: "Qu’ils admirent ma splendeur."
 ecumenical_council_events_josh.0021.c.ct: "Ajoute #V 50#! d’investissements de [appointment|El] pour un [clerical_title|El]"
 ecumenical_council_events_josh.0022.t: "Unis dans la foi"
 ecumenical_council_events_josh.0022.desc: "Alors que [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName] mène des discussions pendant le concile, [host.Custom('FR_IlElle')] saisit l’occasion de rallier ses partisans face aux menaces extérieures. [host.Custom('FR_IlElle')|U] nous convoque, [alliance_target.Custom('FR_le_Char_Pi')][alliance_target.GetTitledFirstName] et moi.\n\n« Tout comme vous êtes fermes dans la foi, vous devez également rester unis face à l’ennemi. »"
 ecumenical_council_events_josh.0022.a: "Que l’Église bénisse notre alliance."
 ecumenical_council_events_josh.0022.a.flavor: "Je vais mettre à profit ma réputation de piété pour sceller cette alliance."
 ecumenical_council_events_josh.0022.b: "Cette alliance reposera sur une compréhension mutuelle."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.Custom('FR_le_Char_Pi')|U][alliance_target.GetTitledFirstName] donne son accord à l’alliance."
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.Custom('FR_le_Char_Pi')|U][alliance_target.GetTitledFirstName] se sent offensé[alliance_target.Custom('FR_E')] par vos propositions."
 ecumenical_council_events_josh.0022.b.flavor: "Mon sens du contact est certainement suffisant."
 ecumenical_council_events_josh.0022.c: "Un concile n’est pas le lieu approprié."
 ecumenical_council_events_josh.0022.c.flavor: "Un salut respectueux suffit."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a refusé une alliance inappropriée."
 ecumenical_council_events_josh.0023.t: "Priez pour moi"
 ecumenical_council_events_josh.0023.desc: "« Que la grâce et la paix soient avec vous. » [host.Custom('FR_le_Char_Pi')|U][host.GetTitledFirstName] bénit les invités à mesure qu’ils s’approchent. Je pourrais profiter de cet instant pour me jeter aux pieds de ce pilier de la foi. Si je parvenais à [host.Custom('FR_LeLa')] convaincre de m’inclure dans ses [Glossary( 'prières de louange', 'LAUD_GLOSS' )], je me rapprocherais certainement du salut.\n\n« Poussez-vous et arrêtez de baver. Vous nous faites tous attendre », murmure [prayer_opponent.GetFirstName], le suivant dans la file, derrière moi."
 ecumenical_council_events_josh.0023.a: "« Un don considérable pour que vous continuiez à prier pour moi. »"
 ecumenical_council_events_josh.0023.b: "Embrasser l’ourlet de la robe de l’hôte"
 ecumenical_council_events_josh.0023.b.tt: "Je vais faire en sorte que ma demande soit entendue"
 ecumenical_council_events_josh.0023.b.tt2: "J’enfreins les règles de bienséance et suis mis[ROOT.Char.Custom('FR_E')] à l’écart"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.Custom('FR_le_Char_Pi')|U][host.GetTitledFirstName] priera pour vous."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.Custom('FR_le_Char_Pi')|U][host.GetTitledFirstName] balaie votre requête d’un revers de main."
 ecumenical_council_events_josh.0023.c: "Il vaut mieux s’effacer et faire preuve de piété."
 ecumenical_council_events_josh.0024.t: "La beauté des mystères"
 ecumenical_council_events_josh.0024.desc: "Certains sont venus ici dans l’unique but de discuter des mystères sacrés, impatients de faire part de leurs nouvelles interprétations et d’en débattre. [tenet_target_a.GetName] est l’un[tenet_target_a.Custom('FR_E')] de ceux-là.\n\n« [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )] ! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], mes frères. Respectez les règles [ROOT.Char.GetFaith.HighGodNamePossessive], recherchez la sagesse, et vous parviendrez à comprendre le divin ! »\n\nDes voix s’élèvent et s’évanouissent au sein de la foule. Pendant ce temps, [tenet_target_b.Custom('FR_LeLa')] [tenet_target_b.Custom('FormalComplimentAdjective')] [tenet_target_b.GetTitledFirstName] est captivé[tenet_target_b.Custom('FR_E')] par un texte inconnu. Les seuls mots que j’arrive à distinguer sont : « [tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )] »."
 ecumenical_council_events_josh.0024.a: "« La sagesse, dites-vous, [tenet_target_a.GetFirstNameNoTooltip] ? »"
 ecumenical_council_events_josh.0024.b: "Ce livre a l’air assez intéressant."
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName] m’a déjà montré le véritable chemin."
 ecumenical_council_events_josh.0025.t: "Un théologien de trop"
 ecumenical_council_events_josh.0025.desc: "Un léger brouhaha s’élève aux abords du grand rassemblement. Quelques nouveaux arrivants peu communs s’époussettent, tandis que nos prélats chuchotent en les dévisageant, avant de leur faire signe de s’éloigner. [Select_CString(theologian.IsFemale,'La femme','L’homme')] qui guide les étrangers s’écrie :\n\n« J’ai beaucoup voyagé pour témoigner pour mes semblables [theologian.GetFaith.GetAdherentNamePlural]. Nos ancêtres, les saints apôtres, étaient comme des frères. Alors, pourquoi ne puis-je pas faire partie des vôtres ? »"
 ecumenical_council_events_josh.0025.a: "L’accès a un prix..."
 ecumenical_council_events_josh.0025.a.flavor: "Je peux facilement l’ajouter à ma liste d’invités."
 ecumenical_council_events_josh.0025.b: "« Vos enseignements sont une honte ! »"
 ecumenical_council_events_josh.0025.c: "« Cela me fascine. Ayons notre propre concile plus tard. »"
 ecumenical_council_events_josh.0025.d: "Faites-[theologian.Custom('FR_LeLa')] sortir calmement."
