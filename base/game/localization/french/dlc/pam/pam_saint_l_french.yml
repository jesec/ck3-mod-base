 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "Un élégant reliquaire dans lequel est conservé un doigt sacré prélevé sur la dépouille bénie [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_desc: "Un élégant reliquaire dans lequel est conservée une dent sacrée prélevée sur la dépouille bénie [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_desc: "Un élégant reliquaire dans lequel est conservée une côte sacrée prélevée sur la dépouille bénie [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hair_desc: "Un élégant reliquaire dans lequel est conservée une mèche des cheveux sacrés [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_vestment_desc: "Un élégant reliquaire dans lequel est conservé un fragment de l’habit de cérémonie autrefois porté par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hand_desc: "Un élégant reliquaire dans lequel est conservée la main sacrée de la dépouille bénie [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_arm_desc: "Un élégant reliquaire dans lequel est conservé le bras sacré de la dépouille bénie [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_desc: "Un élégant reliquaire dans lequel est conservé le crâne vénéré [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_blood_desc: "Un élégant reliquaire dans lequel est conservée une fiole du sang [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_heart_desc: "Un élégant reliquaire dans lequel est conservé le cœur sacré [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_effigy_desc: "Une effigie à l’image [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe], vénérée par les fidèles."
 pam_saint_relic_letter_desc: "Un reliquaire élégant qui renferme une lettre écrite par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_drawing_desc: "Un tableau célèbre peint par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_stationery_desc: "Du matériel d’écriture qui aurait été utilisé par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]. Il apporterait de la sagesse à celui qui le porte."
 pam_saint_relic_ash_desc: "Un reliquaire élégant qui renferme les cendres sacrées [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_canopic_jar_desc: "Une urne contenant les organes internes [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_staff_desc: "Un bâton que [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe] utilisait lors de ses pèlerinages."
 pam_saint_relic_water_filter_desc: "Un tissu que [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe] utilisait comme filtre à eau lors de ses voyages."
 pam_saint_relic_bowl_desc: "Un bol avec lequel [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe] mendiait de la nourriture lors de ses voyages."
 pam_saint_relic_robe_desc: "Un reliquaire élégant qui renferme la robe sacrée [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_sword_desc: "Une épée ébréchée qui appartenait [relic_creator_saint.Custom('FR_au_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]. On dit qu’elle apporte protection et force aux croyants qui la portent."
 pam_saint_relic_sarira_desc: "Un reliquaire élégant qui renferme une sarira [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_buddhism_desc: "Un reliquaire élégant qui renferme une sarira : l’ushnisha [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_finger_buddhism_desc: "Un reliquaire élégant qui renferme une sarira : un doigt [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_buddhism_desc: "Un reliquaire élégant qui renferme une sarira : une dent [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_buddhism_desc: "Un reliquaire élégant qui renferme une sarira : une côte [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "Un talisman dessiné par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]. On dit qu’il éloigne le mal et soigne celui qui le porte."
 pam_saint_relic_pellet_desc: "Une bouteille contenant des pilules d’immortalité préparées par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_footprint_desc: "Un reliquaire élégant qui renferme l’empreinte de pied [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_afarganyu_desc: "Une #EMP afarganyu#! qui appartenait [relic_creator_saint.Custom('FR_au_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_ring_desc: "Une bague sacrée qui appartenait [relic_creator_saint.Custom('FR_au_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_bracelet_desc: "Un bracelet sacré qui appartenait [relic_creator_saint.Custom('FR_au_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_commentary_desc: "Une compilation de commentaires rédigés par [relic_creator_saint.Custom('FR_le_Char_Pi')][relic_creator_saint.GetShortUINameNotMe] contenant son interprétation [relic_creator_saint.GetFaith.ReligiousText3]."
 pam_saint_relic_tzitzit_desc: "Un fil sacré provenant du tsitsit [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe], témoin de sa piété."
 pam_saint_relic_relic_desc: "Un reliquaire élégant qui renferme la sainte relique [relic_creator_saint.Custom('FR_du_Char_Pi')][relic_creator_saint.GetShortUINameNotMe]."
 # Buried-saint point of interest
 poi_buried_saint: "Tombe d’un [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "Visite du tombeau sacré"
 poi_buried_saint.visit_va: "Visite du tombeau ancestral"
 poi_buried_saint.visit_desc: "Lorsque l’on se rend sur la tombe d’un [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], on est envahi par un sentiment de dévotion."
 poi_buried_saint.preset_visit_desc: "Vous vous arrêtez au tombeau de [visited_saint.GetShortUIName] pour lui rendre hommage."
 poi_buried_saint.foreign_visit: "Visite du tombeau antique"
 poi_buried_saint.foreign_visit_desc: "Votre foi ne vénère pas [visited_saint.GetShortUIName], mais il y a beaucoup à apprendre en ce tombeau."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Rendre hommage pour un modeste gain de [piety_i|E][piety|El], avec la possibilité de récupérer une sainte [Concept('artifact','relique')|E] pour un coût #EMP moindre#! qu’à distance."
 pam_poi_buried_saint_on_visit_relic_tt: "Rendre hommage [visited_saint.Custom('FR_au_Char_U_Pi')][visited_saint.GetShortUIName] tout en ayant la possibilité de récupérer une sainte [Concept('artifact','relique')|E] pour un coût moindre qu’à distance."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Rendre hommage [visited_saint.Custom('FR_au_Char_U_Pi')][visited_saint.GetShortUIName], [visited_saint.Custom('PamSaintOrAncestorNoun')] qui repose ici."
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "Sur la tombe [visited_saint.Custom('FR_du_Char_U_Pi')][visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.desc: "Mes voyages m’ont conduit[ROOT.Char.Custom('FR_E')] jusqu’à la dernière demeure [visited_saint.Custom('FR_du_Char_U_Pi')][visited_saint.GetShortUIName], [visited_saint.Custom('PamVeneratedSaintOrAncestor')] de ma foi. L’air est lourd et imprégné de sainteté, et autour de la tombe, les fidèles s’agenouillent pour prier en silence."
 pam_saint_events.0007.a: "Je vais présenter mes respects, puis je poursuivrai mon chemin."
 pam_saint_events.0007.b: "Prélevons une sainte relique."
 pam_saint_events.0007.b.tt: "Une sainte [Concept('artifact','relique')|E] sera prélevée de la dépouille [visited_saint.Custom('FR_du_Char_U_Pi')][visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.b.toast: "Sainte relique prélevée"
 pam_saint_events.0007.b.toast_desc: "C’est avec une grande dévotion que nous avons prélevé une relique – [relic_artifact.GetName] – de la dépouille [visited_saint.Custom('FR_du_Char_U_Pi')][visited_saint.GetShortUINameNoTooltip], afin de bénir mon [realm|El]."
