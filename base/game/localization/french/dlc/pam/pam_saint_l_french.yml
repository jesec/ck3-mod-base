l_french:
 # Canonizing Saints
 # Christian faiths use Saint/Canonize wording; religions with an attested term for the venerated dead use it (Wali, Divus, Siddha, Kami - see pam_saint_custom_loc.txt); everything else uses Venerated Ancestor/Venerate (matches the vanilla saint trait and 20_pam_flavorization.txt). Three mechanisms: (1) scopeless keys pick the _saint/_va variant via SelectLocalization on the local player's religion, and the _va branch pulls its per-religion noun from a custom loc on GetPlayer; (2) scope-bearing keys whose only divergence is a single word/phrase swap just that fragment via a custom loc, keeping the sentence one key so its saved scopes stay live (called on the saint's scope where one exists, so gendered terms resolve); (3) clause-level scope-bearing keys (petition_sent, 0001.a.tt, 0002.desc, 0003.desc) keep the _saint/_va split and branch in script (triggered_desc), because their wording diverges across several phrases and they lean on multiple saved scopes a custom loc can't carry.
 # Canonize decision
 pam_canonize_saint_decision: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] un [GetPlayer.Custom('PamVenerateObjectTitle')]"
 pam_canonize_saint_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_desc_saint', 'pam_canonize_saint_decision_desc_va' )]"
 pam_canonize_saint_decision_desc_saint: "Je ferai reconnaître l’un de mes défunts aïeux comme saint, afin qu’il soit consacré et repose dans la lumière."
 pam_canonize_saint_decision_desc_va: "J’élèverai l’un de mes défunts aïeux au rang de [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], et sa dépouille sera [GetPlayer.Custom('PamConsecratedEnshrined')]e avec tous les honneurs qui lui sont dus."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "Élevez un membre décédé de votre [dynasty|El] à la [sainthood|El]."
 pam_canonize_saint_decision_tooltip_va: "Élevez un membre décédé de votre [dynasty|El] au rang de [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]."
 pam_canonize_saint_decision_confirm: "Choisissez un lieu de sépulture"
 pam_canonize_saint_decision_req_candidate: "Un ancêtre décédé de votre [dynasty|El], dépourvu de trait [sinful|El] et possédant au moins un trait [virtuous|El], qui n’est pas encore vénéré"
 pam_canonize_saint_decision_req_site: "Une [ecclesiastical_domicile|El] avec une [Concept('ecclesiastical_domicile_building','cathédrale')|E] dans votre [realm|El] où le consacrer ou, si toutes sont occupées, une province voisine"
 pam_canonize_saint_decision_req_site_holy_site: "Un [holy_site|El] de votre [faith|El] dans votre [realm|El] où le consacrer ou, si tous sont occupés, une province voisine"
 pam_canonize_saint_decision_canonize_tt: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] le défunt membre de la dynastie choisi et [GetPlayer.Custom('PamConsecrateEnshrine')] sa dépouille"
 pam_canonize_saint_decision_choose_1_tt: "Choisissez la [Concept('ecclesiastical_domicile_building','cathédrale')|E] dans votre [realm|E] dans laquelle le consacrer"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "Choisissez le [holy_site|El] de votre [faith|El] dans votre [realm|El] dans lequel le consacrer"
 # Clause-level split kept in script (triggered_desc): three phrases diverge and the sentence needs saint_candidate / consecration_province / petition_recipient, which a custom loc can't all carry.
 pam_canonize_saint_petition_sent_tt_saint: "Une requête sera adressée [petition_recipient.Custom('FR_au_Char_Pi')][petition_recipient.GetTitledFirstName] afin qu’[saint_candidate.Custom('FR_IlElle')] approuve la reconnaissance de la [Concept('canonized','sainteté')|E] de [saint_candidate.GetFirstName] et sa consécration en [consecration_province.GetName]"
 pam_canonize_saint_petition_sent_tt_va: "Une requête sera adressée [petition_recipient.Custom('FR_au_Char_Pi')][petition_recipient.GetTitledFirstName] afin qu’[petition_recipient.Custom('FR_IlElle')] approuve [saint_candidate.GetFirstName] comme [saint_candidate.Custom('PamVeneratedSaintOrAncestor')] et soit [GetPlayer.Custom('PamConsecratedEnshrined')][saint_candidate.Custom('FR_E')] en [consecration_province.GetName]"
 # Sentence stays a single key (saint_candidate / canonizer saved scopes stay live via custom_tooltip); only the canonize/venerate verb swaps, via the PamCanonizeVenerateVerb custom loc.
 pam_canonize_saint_hof_chance_tt: "En raison du nombre de [traits|El] [saint_candidate.Custom('FR_du_Char_U_Pi')][saint_candidate.GetShortUIName], il y a #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#! de chances que [canonizer.GetFaith.GetReligiousHead.Custom('FR_le_Char_Pi')][canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] réponde favorablement à la demande de [saint_candidate.Custom('FR_LeLa')] [GetPlayer.Custom('PamCanonizeVenerateVerb')]."
 pam_canonize_saint_hof_chance_cynical_tt: "En raison du nombre de [traits|El] [saint_candidate.Custom('FR_du_Char_U_Pi')][saint_candidate.GetShortUIName], mais aussi du cynisme [canonizer.GetFaith.GetReligiousHead.Custom('FR_du_Char_Pi')][canonizer.GetFaith.GetReligiousHead.GetTitledFirstName], il y a #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance_cynical')|0%]#! de chances que [Select_CString(canonizer.GetFaith.GetReligiousHead.IsFemale,'cette dernière','ce dernier')] réponde favorablement à la demande de [saint_candidate.Custom('FR_LeLa')] [GetPlayer.Custom('PamCanonizeVenerateVerb')]."
 pam_canonize_saint_hof_chance_puppet_tt: "Puisque [canonizer.GetFaith.GetReligiousHead.Custom('FR_le_Char_Pi')][canonizer.GetFaith.GetReligiousHead.GetTitledFirstName] vous obéit, la demande officielle de [GetPlayer.Custom('PamCanonizeVenerateVerb')] [saint_candidate.Custom('FR_le_Char_U_Pi')][saint_candidate.GetShortUIName] sera acceptée"
 # Custom-loc vocabulary fragments (Christian / per-religion / fallback), referenced only by pam_saint_custom_loc.txt. The surrounding sentences stay full keys so their saved scopes stay live. Terms match the saint flavorization (20_pam_flavorization.txt) and trait names.
 pam_canonize_verb_christian: "canoniser"
 pam_canonize_verb_hellenism: "déifier"
 pam_canonize_verb_confucianism: "révérer"
 pam_canonize_verb_taoism: "diviniser"
 pam_canonize_verb_other: "vénérer"
 pam_saint_noun_christian: "[Concept('canonized','saint')|E]"
 pam_saint_noun_islam: "[Concept('canonized','Wali')|E]"
 pam_saint_noun_islam_female: "[Concept('canonized','Waliyya')|E]"
 pam_saint_noun_hellenism: "[Concept('canonized','Divus')|E]"
 pam_saint_noun_hellenism_female: "[Concept('canonized','Diva')|E]"
 pam_saint_noun_jainism: "[Concept('canonized','Siddha')|E]"
 pam_saint_noun_shintoism: "[Concept('canonized','Kami')|E]"
 pam_saint_noun_confucianism: "[Concept('canonized','Shengxian')|E]"
 pam_saint_noun_buddhism: "[Concept('canonized','Ārya')|E]"
 pam_saint_noun_taoism: "[Concept('canonized','Zhenren')|E]"
 pam_saint_noun_judaism: "[Concept('canonized','Tzadik')|E]"
 pam_saint_noun_other: "vénérable ancêtre"
 # Every branch carries its own article (a/an varies per term) - the calling sentence must not add one.
 pam_venerated_saint_christian: "saint"
 pam_venerated_saint_christian_capitalized: "saint"
 pam_venerated_saint_islam: "wali"
 pam_venerated_saint_islam_female: "waliyya"
 pam_venerated_saint_hellenism: "divus"
 pam_venerated_saint_hellenism_female: "diva"
 pam_venerated_saint_jainism: "siddha"
 pam_venerated_saint_shintoism: "kami"
 pam_venerated_saint_confucianism: "shengxian"
 pam_venerated_saint_buddhism: "ārya"
 pam_venerated_saint_taoism: "zhenren"
 pam_venerated_saint_judaism: "tzadik"
 pam_venerated_saint_judaism_female: "tzadeket"
 pam_venerated_saint_other: "vénérable ancêtre"
 pam_blessed_ones_christian: "saints"
 pam_blessed_ones_islam: "awliya"
 pam_blessed_ones_hellenism: "divi"
 pam_blessed_ones_jainism: "siddhas"
 pam_blessed_ones_shintoism: "kamis"
 pam_blessed_ones_confucianism: "shengxian"
 pam_blessed_ones_buddhism: "āryah"
 pam_blessed_ones_taoism: "zhenren"
 pam_blessed_ones_judaism: "tzadik"
 pam_blessed_ones_other: "vénérables ancêtres"
 # Plain bare noun for names/titles/possessives (no concept link, capitalized fallback), via PamSaintOrAncestorTitleNoun.
 pam_saint_title_noun_christian: "Saint"
 pam_saint_title_noun_islam: "Wali"
 pam_saint_title_noun_hellenism: "Divus"
 pam_saint_title_noun_jainism: "Siddha"
 pam_saint_title_noun_shintoism: "Kami"
 pam_saint_title_noun_confucianism: "Shengxian"
 pam_saint_title_noun_buddhism: "Ārya"
 pam_saint_title_noun_taoism: "Zhenren"
 pam_saint_title_noun_judaism: "Tzadik"
 pam_saint_title_noun_other: "Vénérable ancêtre"
 # Title-cased fallbacks for the name-context commands; the bespoke branches reuse the pam_venerated_saint_* fragments above.
 pam_venerated_saint_other_title: "vénérable ancêtre"
 pam_venerate_object_other: "ancêtre"
 pam_consecrate_christian: "consacrer"
 pam_consecrate_others: "sanctifier"
 pam_consecrate_christian_past: "consacré"
 pam_consecrate_others_past: "sanctifié"
 pam_consecrate_christian_present: "consacre"
 pam_consecrate_others_present: "sanctifie"
 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "Consacrer le saint"
 pam_choose_consecration_site_decision_va: "Consacrer le [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "Je choisirai la [Concept('ecclesiastical_domicile_building','cathédrale')|E] de mon [realm|El] dans laquelle consacrer ce [Concept('canonized','saint')|E] et où reposera sa dépouille, qui attirera les fidèles."
 pam_choose_consecration_site_decision_desc_va: "Je choisirai le [holy_site|El] de mon [realm|El] dans lequel consacrer ce [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l] et où reposera sa dépouille, qui attirera les fidèles."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "Je choisirai le [holy_site|El] de ma [faith|El] dans mon [realm|El] dans lequel consacrer ce [Concept('canonized','saint')|E] et où reposera sa dépouille, qui attirera les fidèles."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Je choisirai le [holy_site|El] de ma [faith|El] dans mon [realm|El] dans lequel consacrer ce [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l] et où reposera sa dépouille, qui attirera les fidèles."
 pam_choose_consecration_site_decision_tooltip: "Choisissez où consacrer le [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l] choisi."
 pam_choose_consecration_site_decision_confirm: "Consacrer"
 pam_choose_consecration_site_decision_select_tt: "Sélectionnez un site où consacrer le [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l]"
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "Prélever une relique"
 pam_extract_relic_decision_desc: "Un [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l] repose, [GetPlayer.Custom('PamConsecratedEnshrined')], dans mon pays. Avec tous les honneurs qui lui sont dus, une relique peut être prélevée de sa dépouille pour bénir les fidèles."
 pam_extract_relic_decision_tooltip: "Prenez une relique d’un [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l] qui repose dans les terres sous votre autorité."
 pam_extract_relic_decision_confirm: "Prélever la relique"
 pam_extract_relic_decision_req_saint: "Un [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|l] dont vous pouvez obtenir une relique repose dans votre [realm|El]"
 pam_extract_relic_decision_req_saint_count: "[CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] sur [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact','reliques')|E] prélevées sur [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] jusqu’à présent"
 pam_extract_relic_decision_extract_tt: "Créer une sainte [Concept('artifact','relique')|E] à partir de la dépouille du [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_extract_relic_decision_choose_tt: "Choisissez sur quel [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l] enterré prélever une [Concept('artifact','relique')|E]"
 pam_extract_relic_decision_item_valid_tt: "Une sainte [Concept('artifact','relique')|E] peut encore être prélevée sur ce [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')|l]."
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "Requête transmise"
 pam_saint_events.0001.desc: "La cause de [saint_candidate.GetFirstName] est prête, et une place d’honneur en [consecration_province.GetName] attend sa dépouille sacrée.\n\nDésormais, l’affaire n’est plus entre mes mains : une requête est en route vers [petition_recipient.Custom('FR_le_Char_Pi')][petition_recipient.GetTitledFirstName], et je ne puis que prier pour une réponse favorable."
 pam_saint_events.0001.a: "Alors, nous allons attendre et prier."
 pam_saint_events.0001.a.tt_saint: "Une requête a été adressée [petition_recipient.Custom('FR_au_Char_Pi')][petition_recipient.GetTitledFirstName] afin qu’[saint_candidate.Custom('FR_IlElle')] reconnaisse la [Concept('canonized','sainteté')|E] de [saint_candidate.GetFirstName] et sa consécration en [consecration_province.GetName]. [petition_recipient.Custom('FR_IlElle')|U] y répondra en temps voulu."
 pam_saint_events.0001.a.tt_va: "Une requête a été adressée [petition_recipient.Custom('FR_au_Char_Pi')][petition_recipient.GetTitledFirstName] afin d’honorer [saint_candidate.GetFirstName] comme [saint_candidate.Custom('PamVeneratedSaintOrAncestor')|l] et de [saint_candidate.Custom('FR_LeLa')] [saint_candidate.Custom('PamConsecrateEnshrine')] en [consecration_province.GetName]. [petition_recipient.Custom('FR_IlElle')|U] y répondra en temps voulu."
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "Une requête pour la sainteté"
 pam_saint_events.0002.t_va: "Une requête pour la vénération"
 pam_saint_events.0002.desc_saint: "[canonizer.Custom('FR_le_Char_Pi')|U][canonizer.GetTitledFirstName] nous prie d’inscrire [saint_candidate.GetFirstName] parmi les saints et de consacrer son corps en [consecration_province.GetName]."
 pam_saint_events.0002.desc_va: "[canonizer.Custom('FR_le_Char_Pi')|U][canonizer.GetTitledFirstName] nous prie d’inscrire [saint_candidate.GetFirstName] parmi les [saint_candidate.Custom('PamBlessedOnesOrAncestors')] et de [saint_candidate.Custom('FR_LeLa')] [saint_candidate.Custom('PamConsecrateEnshrine')] en [consecration_province.GetName]."
 pam_saint_events.0002.desc.traits_1: "\n\nDe son vivant, [saint_candidate.GetFirstNameNoTooltip] était connu[saint_candidate.Custom('FR_E')] pour être [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nDe son vivant, [saint_candidate.GetFirstNameNoTooltip] était connu[saint_candidate.Custom('FR_E')] pour être [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] et [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nDe son vivant, [saint_candidate.GetFirstNameNoTooltip] était connu[saint_candidate.Custom('FR_E')] pour être [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] et [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "Une lumière vacillante émane de cette âme ; une flamme modeste, certes, mais tous les saints n’ont pas été forgés dans les flammes d’un grand brasier.\n\nC’est à nous qu’il revient d’en juger."
 pam_saint_events.0002.desc.virtue_1_va: "Une lumière vacillante émane de cette âme ; une flamme modeste, certes, mais toutes les âmes vénérées n’ont pas été forgées dans les flammes d’un grand brasier.\n\nC’est à nous qu’il revient d’en juger."
 pam_saint_events.0002.desc.virtue_2: "Ce que cette âme a accompli pour plaire à Dieu ne saurait être méconnu : c’est la marque d’une grâce manifeste, quoique imparfaite.\n\nC’est à nous qu’il revient de juger."
 pam_saint_events.0002.desc.virtue_3: "La vertu est l’incarnation même de cette âme ; rares sont les mortels qui portent si clairement en eux la marque du divin.\n\nC’est à nous qu’il revient d’en juger."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] en est vraiment digne."
 pam_saint_events.0002.a.dynasty_opinion_tt: "Les membres [canonizer.GetFaith.GetAdherentNamePlural] de la [dynasty|El] [canonizer.Custom('FR_du_Char_U_Pi')][canonizer.GetShortUIName] gagnent #P 10#! en [opinion|El] envers vous pendant 20 ans"
 pam_saint_events.0002.b: "Nous ne l’approuvons pas."
 pam_saint_events.0002.b.dynasty_opinion_tt: "Les membres [canonizer.GetFaith.GetAdherentNamePlural] de la [dynasty|El] [canonizer.Custom('FR_du_Char_U_Pi')][canonizer.GetShortUIName] perdent #N 10#! en [opinion|El] envers vous pendant 20 ans"
 # Opinion Modifiers
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
 pam_canonization_approved_petitioner_opinion_saint: "A approuvé la canonisation d’un membre de la [dynasty|El]"
 pam_canonization_approved_petitioner_opinion_va: "A approuvé la vénération d’un membre de la [dynasty|El]"
 pam_canonization_approved_dynasty_opinion: "$pam_canonization_approved_petitioner_opinion$"
 pam_canonization_denied_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_denied_petitioner_opinion_saint', 'pam_canonization_denied_petitioner_opinion_va' )]"
 pam_canonization_denied_petitioner_opinion_saint: "A refusé la canonisation d’un membre de la [dynasty|El]"
 pam_canonization_denied_petitioner_opinion_va: "A refusé la vénération d’un membre de la [dynasty|El]"
 pam_canonization_denied_dynasty_opinion: "$pam_canonization_denied_petitioner_opinion$"
 pam_canonization_celebrated_dynasty_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_celebrated_dynasty_opinion_saint', 'pam_canonization_celebrated_dynasty_opinion_va' )]"
 pam_canonization_celebrated_dynasty_opinion_saint: "A canonisé un membre de la [dynasty|El]"
 pam_canonization_celebrated_dynasty_opinion_va: "A vénéré un membre de la [dynasty|El]"
 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "Un nouveau saint"
 pam_saint_events.0003.t_va: "Un nouveau [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_saint_events.0003.desc_saint: "C’est fait. [saint_candidate.GetFirstName] a rejoint les rangs des saints et a été consacré[saint_candidate.Custom('FR_E')] en [consecration_province.GetName]. Que sa lumière bénisse les [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip] pour l’éternité."
 pam_saint_events.0003.desc_va: "C’est fait. [saint_candidate.GetFirstName] est désormais un des [saint_candidate.Custom('PamBlessedOnesOrAncestors')] et [saint_candidate.Custom('PamConsecratedEnshrined')][saint_candidate.Custom('FR_E')] en [consecration_province.GetName]. Que sa lumière bénisse notre pays pour l’éternité."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Rendons grâce à Dieu."
 pam_saint_events.0003.a_va: "Nous vous remercions."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Les membres de votre [dynasty|El] et de votre [faith|El] gagnent #P 20#! en [opinion|El] envers vous pendant 20 ans"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "Sainteté refusée"
 pam_saint_events.0004.t_va: "Vénération refusée"
 pam_saint_events.0004.desc: "Notre requête visant à [GetPlayer.Custom('PamCanonizeVenerateVerb')] [saint_candidate.GetFirstName] a été rejetée par [petition_recipient.Custom('FR_le_Char_Pi')][petition_recipient.GetTitledFirstName]. [saint_candidate.Custom('FR_IlElle')|U] ne sera pas compté[saint_candidate.Custom('FR_E')] parmi les [GetPlayer.Custom('PamBlessedOnesOrAncestors')]."
 pam_saint_events.0004.a: "Ainsi soit-il."
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "Préparation de la châsse"
 pam_saint_events.0005.desc: "En [extract_site.GetName], des mains respectueuses se préparent à accomplir une tâche solennelle afin de pouvoir prélever une relique sacrée de la dépouille bénie [relic_saint.Custom('FR_du_Char_Pi')][relic_saint.GetTitledFirstName].\n\nLes préparatifs sont en cours pour célébrer cet événement sacré."
 pam_saint_events.0005.a: "Faisons-le avec le plus grand respect."
 pam_saint_events.0005.a.tt: "Une sainte [Concept('artifact','relique')|E] [relic_saint.Custom('FR_du_Char_U_Pi')][relic_saint.GetShortUIName] sera bientôt extraite de [extract_site.GetName]."
 # The relic is drawn
 pam_saint_events.0006.t: "Une sainte relique"
 pam_saint_events.0006.desc_relic: "De la dépouille sacrée de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')][relic_saint.Custom('FR_E')] à [extract_site.GetName], nous avons prélevé une sainte relique : #EMP [relic_artifact.GetName]#!. Qu’elle bénisse les fidèles de mon pays pour l’éternité."
 pam_saint_events.0006.desc: "De la dépouille sacrée de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')][relic_saint.Custom('FR_E')] à [extract_site.GetName], une sainte [Concept('artifact','relique')|E] a été prélevée pour bénir notre pays."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "Gloire à Dieu !"
 pam_saint_events.0006.a_va: "Nous vous remercions."
 pam_saint_events.0006.a.tt: "La relique [relic_artifact.GetName] a été prélevée et se trouve désormais sous votre garde."
 pam_dulia_relic_dynasty_prestige_tt: "Du principe de la [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )|l] :"
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "En raison du principe de la [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )|l], chaque [ruler|El] de votre [faith|El] gagne $pam_dulia_new_saint_modifier|l$ pendant #EMP 5 ans#!"
 pam_dulia_new_saint_message_t: "Un nouvel intercesseur"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.Custom('FR_le_Char_Pi')|U][pam_new_saint.GetTitledFirstName] a été élevé[pam_new_saint.Custom('FR_E')] aux autels et les fidèles de la foi [pam_new_saint.GetFaith.GetAdjective] ont désormais un intercesseur auprès de Dieu."
 # Relic benefit requirement (can_benefit on pam_saint_relic_template).
 pam_saint_relic_benefit_faith_tt: "Le titulaire a la même [religion|El] que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName]"
