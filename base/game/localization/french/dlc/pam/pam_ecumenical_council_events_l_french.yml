 ecumenical_council_events.0108.t: "Entre amis"
 ecumenical_council_events.0108.desc: "Quel soulagement de voir mon ami[friend.Custom('FR_E')] [friend.Custom('FR_le_Char_Pi')][friend.GetTitledFirstName] au milieu de l’assemblée.\n\n« Tu connais mon opinion », me dit-[friend.GetSheHe]. « Tu n’as qu’un mot à dire, et je te suis. »"
 ecumenical_council_events.0108.a: "Soyez de mon côté, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b: "Vous pouvez rester fidèle à vos convictions."
 ecumenical_council_events.0108.conservatives_custom: "[ec_conservatives|E] parmi vos [friends|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.innovators_custom: "[ec_innovators|E] parmi vos [friends|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.t: "Mécontentement sourd"
 ecumenical_council_events.0109.desc: "À quelques mètres de là, un petit groupe semble se former. Qui peut bien essayer de remodeler la foi sans moi ?\n\n« Si nous pouvons remettre cela en question, pourquoi pas tout le reste ? » avertit [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « Je refuse d’ouvrir cette porte pour laisser l’incertitude entrer dans la maison [lead_conservative.GetFaith.HighGodNamePossessive]. »\n\n« Ne vous tarde-t-il pas de vous débarrasser de ces traditions qui ne nous servent plus à rien ? » lui rétorque [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0109.support: "Une oreille attentive suffira."
 ecumenical_council_events.0109.support_duel: "Je sais comment attirer l’attention des plus prudents..."
 ecumenical_council_events.0109.support_duel.success: "Ils ne nous barreront pas la route"
 ecumenical_council_events.0109.support_duel.success_halved: "Certains vous écoutent"
 ecumenical_council_events.0109.support_duel.failure: "Ils font front contre vous"
 ecumenical_council_events.0109.oppose: "Fermer doucement cette porte."
 ecumenical_council_events.0109.oppose_duel: "« Vous négociez toujours dans le chaos, [lead_innovator.GetFirstNameNoTooltip] ? »"
 ecumenical_council_events.0109.oppose_duel.success: "Ils ne risqueront pas le chaos"
 ecumenical_council_events.0109.oppose_duel.success_halved: "Certains renoncent à vous soutenir"
 ecumenical_council_events.0109.oppose_duel.failure: "Ils souhaitent encore la discorde et le chaos"
