 # Flavor Events
 ecumenical_council_summons_events.0001.t: "Les soucis [guest_1.Custom('FR_du_Char_L')][guest_1.GetTitleAsNameNoTooltip|U]"
 ecumenical_council_summons_events.0001.desc: "« Ce problème... me ronge, par [guest_1.GetFaith.HighGodName]. J’arrive à peine à dormir... » confie [guest_1.Custom('FR_le_Char_Pi')][guest_1.GetTitledFirstName] [guest_2.Custom('FR_au_Char_Pi')][guest_2.GetTitledFirstName] dans un murmure tourmenté.\n\n« Je comprends... » acquiesce [guest_2.GetFirstNameNoTooltip]. « Si vous parliez à notre [Select_CString(host.IsFemale,'hôtesse','hôte')], [host.Custom('FR_le_Char_L')][host.GetTitleAsNameNoTooltip|l], [host.Custom('FR_IlElle')] pourrait peut-être vous donner des conseils spirituels ? »"
 ecumenical_council_summons_events.0001.a: "Qu’est-ce qui pourrait bien l’inquiéter à ce point..."
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Vous apprenez le secret [guest_1.Custom('FR_du_Char_Pi')][guest_1.GetTitledFirstName]"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip] a simplement besoin d’un soutien amical."
 ecumenical_council_summons_events.0001.c: "Mieux vaut ne pas savoir."
 friend_comforted_at_council_reason: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a réconforté [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] au sujet du secret de [Select_CString(TARGET_CHARACTER.IsFemale,'cette dernière','ce dernier')] lors d’un concile œcuménique."
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a réconforté [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] au sujet du secret de [Select_CString(CHARACTER.IsFemale,'cette dernière','ce dernier')] lors d’un concile œcuménique."
 rival_eavesdropped_on_secret_reason: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a été surpris[CHARACTER.Custom('FR_E')] en train d’essayer de connaître le secret [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] lors d’un concile."
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a surpris [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] en train d’essayer de connaître son secret lors d’un concile."
 ecumenical_council_summons_events.0010.t: "Le secret"
 ecumenical_council_summons_events.0010.desc: "Notre [Select_CString(host.IsFemale,'hôtesse','hôte')], [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName], ne semble pas remarquer ma présence tandis qu’un serviteur ajuste ses vêtements.\n\n« Par [host.GetFaith.HighGodName], pardonnez-moi... » murmure-t-[host.Custom('FR_IlElle')]. « Ces rumeurs concernant mes... inclinations. Croire que moi, le vicaire du Christ, je m’adonne à de tels penchants ! Ces rumeurs ne doivent jamais parvenir aux oreilles de mes cardinaux. »"
 ecumenical_council_summons_events.0010.a: "« Je vois que vous êtes repentant[host.Custom('FR_E')]. »"
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Vous apprenez le secret [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstName]"
 ecumenical_council_summons_events.0010.b: "« [ROOT.Char.Custom('RandomBibleQuoteShort')] »"
 ecumenical_council_summons_events.0010.b.flavor: "[host.Custom('FR_IlElle')|U] trouve du réconfort dans les Écritures !"
 ecumenical_council_summons_events.0010.c: "Il vaut mieux ne pas savoir certaines choses."
 ecumenical_council_summons_events.0020.t: "Problèmes d’approvisionnement"
 ecumenical_council_summons_events.0020.desc.intro: "« Si cela doit être ainsi... » dit [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName] en renvoyant un ecclésiastique d’un grand geste.\n\n« [ROOT.Char.GetTitledFirstNameNoTooltip] », m’appelle-t-[host.Custom('FR_IlElle')]."
 ecumenical_council_summons_events.0020.desc.caravans: "les caravanes qui transportent nos provisions ne sont pas encore arrivées."
 ecumenical_council_summons_events.0020.desc.servants: "Nous n’avons tout simplement pas assez de serviteurs pour nous occuper de tous nos invités."
 ecumenical_council_summons_events.0020.desc.overcrowded: "« Il y a tout simplement trop d’invités pour les hébergements réservés en [ROOT.Char.GetCurrentLocation.GetName] pour notre concile."
 ecumenical_council_summons_events.0020.desc.outro: "Je suppose que vous n’avez pas de solution à nos problèmes ? »"
 ecumenical_council_summons_events.0020.aaa: "« Ce sont mes terres, Votre Sainteté. Je vais régler ça. »"
 ecumenical_council_summons_events.0020.aa: "De nombreuses personnes me sont justement redevables..."
 ecumenical_council_summons_events.0020.a: "« Il n’y a rien que l’or ne puisse arranger, Votre Sainteté ! »"
 ecumenical_council_summons_events.0020.b: "« Je vais réclamer les faveurs qui me sont dues ! »"
 ecumenical_council_summons_events.0020.b.flavor: "[host.Custom('FR_le_Char_U_Pi')|U][host.GetShortUIName] se souviendra de moi comme d’[Select_CString(ROOT.Char.IsFemale,'une candidate influente','un candidat influent')]..."
 ecumenical_council_summons_events.0020.c: "Je ne peux qu’offrir une modeste prière..."
 ecumenical_council_summons_events.0020.papabile_tt: "Votre [papabile_score|El] pour la succession papale augmente de #P +10#!"
 ecumenical_council_summons_events.0030.t: "À la merci des éléments"
 ecumenical_council_summons_events.0030.desc.intro: "Le vent hurle et la pluie fouette la route alors que le concile approche."
 ecumenical_council_summons_events.0030.desc.dry_season: "Un temps inhabituel à cette période de l’année."
 ecumenical_council_summons_events.0030.desc.wet_season: "Un temps aussi mauvais est parfaitement normal à cette période de l’année."
 ecumenical_council_summons_events.0030.desc.outro: "[chaplain.GetFirstName], m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )], tremble de tout son corps.\n\n« [ROOT.Char.Custom('FR_MonseigneurMadame')|U], je crains de ne pas pouvoir assister au concile. Cette tempête, ce froid... ni l’un ni l’autre ne font du bien à mon corps. J’ai trop de mucosités... »"
 ecumenical_council_summons_events.0030.aa: "« J’ai beaucoup lu sur cette maladie ! »"
 ecumenical_council_summons_events.0030.a: "Je vais faire appeler les meilleurs médecins !"
 ecumenical_council_summons_events.0030.b: "« Je prierai pour vous. »"
 ecumenical_council_summons_events.0030.c: "La vie suivra son cours."
 ecumenical_council_summons_events.0040.t: "$tournament_contest_header$ le trac"
 ecumenical_council_summons_events.0040.desc: "À l’approche du concile, je vois m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] faire les cent pas dans la Cour, l’air tendu[chaplain.Custom('FR_E')].\n\n« Il y a la question sur [ROOT.Char.GetFaith.ReligiousSymbol], bien sûr, bien sûr... Et qu’en est-il [chaplain.CustomFixedRandom('random_learning_topic')]... », l’entends-je marmonner."
 ecumenical_council_summons_events.0040.aa: "« Vous devez vous souvenir [ROOT.Char.GetFaith.KnowledgeGodNamePossessive], [chaplain.GetFirstNameNoTooltip]. »"
 ecumenical_council_summons_events.0040.aa.flavor: "Un accompagnement spirituel sera certainement rassurant."
 ecumenical_council_summons_events.0040.a: "Il faut lui rappeler qu’[chaplain.Custom('FR_IlElle')] me représente également."
 ecumenical_council_summons_events.0040.a.tt.success: "Votre diplomatie porte ses fruits"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] n’est pas sûr[chaplain.Custom('FR_E')] de vos intentions"
 ecumenical_council_summons_events.0040.b: "Je peux toujours user de mon influence en sa faveur..."
 ecumenical_council_summons_events.0040.c: "Il n’y a rien que la prière ne puisse guérir."
 friend_reassured_at_council: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a rassuré [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] lors d’un concile œcuménique."
 friend_reassured_at_council_corresponding: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a été rassuré[CHARACTER.Custom('FR_E')] par [TARGET_CHARACTER.GetShortUIName] lors d’un concile œcuménique."
 ecumenical_council_summons_events.0050.t: "La foi remise en question"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.Custom('FR_le_Char_Pi')|U][pious_guest.GetTitledFirstName] a du mal à contenir son amusement à la vue [non_pious_guest.Custom('FR_du_Char_Pi')][non_pious_guest.GetTitledFirstName].\n\n« Vous avez vu, [ROOT.Char.GetTitleAsNameNoTooltip] ? » me demande-t-[pious_guest.Custom('FR_IlElle')]. « [non_pious_guest.GetFirstNameNoTooltip] devrait être loué[non_pious_guest.Custom('FR_E')] ! Je commençais à croire que le seul trône qu’[non_pious_guest.Custom('FR_IlElle')] connaissait était celui des [Glossary( 'bains publics', 'BATHHOUSES_GLOSS' )]."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "Et dire qu’[non_pious_guest.Custom('FR_IlElle')] s’est autoproclamé[non_pious_guest.Custom('FR_E')] chef des [ROOT.Char.GetFaith.GetAdherentNamePlural]. »"
 ecumenical_council_summons_events.0050.aaa: "[chaplain.Custom('FR_le_Char_Pi')|U][chaplain.GetTitledFirstNameNoTooltip] est la personne idéale pour cette mission."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Je suis étonné[pious_guest.Custom('FR_E')] qu’[non_pious_guest.Custom('FR_IlElle')] ait décidé de se joindre à nous lors de ce concile. »"
 ecumenical_council_summons_events.0050.aa: "Un bon berger doit venir du sein même du troupeau..."
 ecumenical_council_summons_events.0050.a: "« Je pourrais faire en sorte que tout le monde le sache... moyennant finances. »"
 ecumenical_council_summons_events.0050.b: "« Comment savez-vous qui fréquente les bains publics, [pious_guest.GetTitleAsNameNoTooltip] ? »"
 ecumenical_council_summons_events.0050.c: "Je remercie [ROOT.Char.GetFaith.HighGodName] pour ce moment de divertissement."
 BATHHOUSES_GLOSS: "Dans de nombreuses villes médiévales, les bains publics — autrefois destinés à de simples ablutions — ont acquis une réputation douteuse. Leurs salles isolées offraient suffisamment d’intimité pour que les prostituées puissent y exercer leur activité."
 friend_defended_piety_at_ec_reason: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'avez', 'a')] défendu la piété au concile œcuménique."
 friend_defended_piety_at_ec_reason_corresponding: "De nombreux témoins ont déclaré que [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] avait défendu la piété [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUIName] lors d’un concile œcuménique."
