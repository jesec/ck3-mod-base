 ecumenical_council_events.0118.t: "Traditions d’une mer lointaine"
 ecumenical_council_events.0118.desc: "[lead_conservative.Custom('FR_le_Char_Pi')|U][lead_conservative.GetTitledFirstName], membre éminent[lead_conservative.Custom('FR_E')] du concile d’origine [lead_conservative.GetCulture.GetNameNoTooltip], se tient aux côtés d’un groupe d’autres religieux ayant voyagé loin pour défendre les traditions de l’Église.\n\n« Le monde des [lead_conservative.GetFaith.GetAdherentNamePluralNoTooltip] est aussi vaste que l’amour [lead_conservative.GetFaith.HighGodNamePossessive] », déclare-t-[lead_conservative.Custom('FR_IlElle')]. « Nous espérons que ce pèlerinage ne servira pas seulement à assister à un prêche [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstName] remettant en cause le travail des Pères de l’Église. »"
 ecumenical_council_events.0118.support: "Les pèlerinages les plus longs apportent les plus grandes révélations."
 ecumenical_council_events.0118.support_duel: "Les rassurer quant à la vision de [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0118.support_duel.success: "Ils reconnaissent que les traditions des Pères sont sûres"
 ecumenical_council_events.0118.support_duel.success_halved: "Certains reconnaissent que les traditions des Pères sont sûres"
 ecumenical_council_events.0118.support_duel.failure: "Ils redoutent toujours le prêche [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip]"
 ecumenical_council_events.0118.oppose: "« Honorons tous votre sacrifice. »"
 ecumenical_council_events.0118.oppose_duel: "« Je prêcherai contre [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip]. »"
