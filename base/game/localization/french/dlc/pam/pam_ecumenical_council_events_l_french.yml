l_french:
 ecumenical_council_events.0001: "Le concile de [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "Les magnifiques décorations sont partout autour des [ROOT.Char.GetFaith.HouseOfWorshipPlural] pour l’occasion. Les plus éminents représentants de la chrétienté ont répondu"
 ecumenical_council_events.0001.host: "à mon appel."
 ecumenical_council_events.0001.dislikes_host: "au maudit appel [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstName]."
 ecumenical_council_events.0001.likes_host: "au légitime appel [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstName]."
 ecumenical_council_events.0001.neutral: "à l’appel [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstName]."
 ecumenical_council_events.0001.intent_arrived: "\n\nEt voilà que j’aperçois [intent_target.Custom('FR_le_Char_Pi')][intent_target.GetTitledFirstName] au milieu de l’assemblée. Parfait !"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nCe n’est qu’une question de temps avant que [intent_target.Custom('FR_le_Char_Pi')][intent_target.GetTitledFirstName] n’apparaisse..."
 ecumenical_council_events.0001.no_intent_target: "\n\nJe n’ai plus qu’à attendre son arrivée !"
 ecumenical_council_events.0001.a.bad: "Si nous n’avons pas d’autre choix."
 ecumenical_council_events.0001.a.good: "Que notre devoir soit sanctifié."
 ecumenical_council_events.0002.t: "L’appel"
 ecumenical_council_events.0002.desc_intro: "Les portes [host.GetFaith.HouseOfWorship3] peuvent désormais s’ouvrir et nous pouvons enfin commencer notre œuvre. En prévision, il est temps de former des alliances"
 ecumenical_council_events.0002.reformist: "entre rois et prêtres."
 ecumenical_council_events.schism_crisis_intro: "\n\nL’accueil est chaleureux, mais le silence qui règne entre eux ne l’est pas. Rome et Constantinople n’échangent plus de politesses, et chaque différend non résolu constitue une nouvelle fracture au sein du Corps du Christ."
 ecumenical_council_events.0002.first_tenet: "\n\nLes discussions vont bon train. Les personnes convoquées commencent à prendre position sur [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )|l] et d’autres affaires urgentes."
 ecumenical_council_events.0002.host: "\n\nJ’ouvre les bras et j’accueille mes enfants, afin que nous fassions ensemble face à cet immense défi."
 ecumenical_council_events.0002.guest: "\n\n« Bienvenue, mes enfants. Que le Seigneur nous guide dans cet immense défi qui est le nôtre ! », proclame [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName]."
 ecumenical_council_events.0002.a: "Amen."
 ecumenical_council_events.0010.t: "Notre position sur [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )|l]"
 ecumenical_council_events.0010.desc.intro: "Le premier débat porte sur [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )|l], que le droit canonique actuel considère comme [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.Custom('FR_le_Char_Pi')|U][lead_portrait.GetTitledFirstName] annonce :\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n« De plus en plus de gens considèrent cela comme un élément fondamental de leur culte », me fait remarquer m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', court_chaplain )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n« Interdire une pratique comporte des risques, mais dans ce cas précis, c’est tout à fait justifié », me rassure m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', court_chaplain )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n« Cette pratique reste populaire. La condamner présente certains risques », s’inquiète m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', court_chaplain )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n« Cette pratique perd en popularité. C’est le bon moment pour arrêter de la soutenir », me conseille m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', court_chaplain )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n« Cette pratique gagne en popularité. Il serait peut-être judicieux d’envisager de la soutenir », suggère m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', court_chaplain )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n« Cette pratique est obscure. La soutenir pourrait être dangereux », m’avertit m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', court_chaplain )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.fallback.explanation: "« C’est un enseignement que notre foi n’a pas encore mis en place, un acte de délibération qui est désormais soumis à ce concile. »"
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "« On nous demande si nous devons maintenir la Paix et la Trêve [ROOT.Char.GetFaith.HighGodNamePossessive]. Nos peuples doivent-ils jurer de protéger les églises, le clergé, et les opprimés des pillages et des bains de sang ? Pouvons-nous empêcher quiconque de prendre les armes pendant les temps liturgiques, sous peine d’être banni par l’Église [ROOT.Char.GetFaith.GetAdjective] ? »"
 ecumenical_council_events.0010.desc.dulia.explanation: "« On nous demande si les saints doivent être vénérés. Pouvons-nous considérer leurs reliques comme sacrées, célébrer leurs fêtes, et implorer leur intercession, alors que notre culte est uniquement réservé à [ROOT.Char.GetFaith.HighGodName] ? »"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "« On nous demande si, par la consécration du prêtre, le pain et le vin de l’autel deviennent réellement le Corps et le Sang du Christ. »"
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "« On nous demande si la vie sainte doit concilier prière et travail. L’oisiveté est-elle l’ennemie de l’âme ? Notre labeur dans les champs ou au scriptorium doit-il être aussi vénéré que les heures passées pendant [ROOT.Char.Custom('GetReligiousRite')] ? »"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "« On nous demande si Sainte Marie, Mère de Dieu, doit être vénérée davantage que tous les autres saints. »"
 ecumenical_council_events.0010.desc.simony.explanation: "« On nous demande si une charge sacrée, une bénédiction, ou un sacrement peut être acheté et vendu contre de l’or. »"
 ecumenical_council_events.0010.desc.monophysitism.explanation: "« On nous demande si le Christ n’a qu’une seule nature, entièrement divine, et si son humanité a été engloutie, de sorte qu’il ne reste que le divin dans le Verbe fait chair. »"
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "« On nous demande si l’Église [ROOT.Char.GetFaith.GetAdjective] doit vivre comme dans les Actes des Apôtres. Devons-nous libérer nos missionnaires, eux qui, par zèle apostolique, apportent la bonne parole aux personnes qui sont encore dans l’ombre ? »"
 ecumenical_council_events.0010.desc.purgatory.explanation: "« On nous demande si, après la mort, les âmes ni damnées ni pures sont purifiées. Les prières et les rites des vivants peuvent-ils leur venir en aide avant qu’ils se présentent devant [ROOT.Char.GetFaith.HighGodName] ? »"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "« On nous demande si le fait d’avoir des enfants est une charge sacrée. Les fidèles devraient-ils peupler la terre de leur progéniture ? »"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "« On nous demande si l’autorité des évêques provient réellement de leur succession continue depuis les Apôtres. »"
 ecumenical_council_events.0010.desc.confession.explanation: "« On nous demande si tous les [ROOT.Char.GetFaith.GetAdherentNamePlural] doivent confesser leurs péchés à un prêtre pour obtenir l’absolution. Le secret de la confession doit-il être gardé à tout prix ? »"
 ecumenical_council_events.0010.desc.original_sin.explanation: "« On nous demande si toutes les âmes héritent du péché d’Adam. Sommes-nous entachés dès la naissance et avons-nous besoin de la grâce baptismale ? »"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "« On nous demande si les saints anges occupent des rangs bien ordonnés sous [ROOT.Char.GetFaith.HighGodName]. Les fonctions au sein de l’Église [ROOT.Char.GetFaith.GetAdjective] devraient-elles refléter cet ordre divin ? »"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "« On nous demande si les fidèles doivent être les soldats du Christ. Devons-nous prendre les armes et défendre l’Église [ROOT.Char.GetFaith.GetAdjective] lorsque nous y sommes appelés ? »"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "« On nous demande si la foi peut chercher la compréhension via la raison. Les écoles devraient-elles mettre la dialectique et la philosophie au service de l’organisation et de la défense de la doctrine ? »"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "« On nous demande si le Christ, dans son humanité, est le Fils [ROOT.Char.GetFaith.HighGodNamePossessive] par adoption. »"
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "« On nous demande si l’amour de notre prochain doit lier tous les [ROOT.Char.GetFaith.GetAdherentNamePlural], y compris les étrangers et les ennemis, comme la mesure incontestable de notre amour envers [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "« On nous demande si [ROOT.Char.Custom('GetReligiousRite')], avec ses chants, son encens, et son rite bien organisé, est la voie principale par laquelle les fidèles approchent [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "« On nous demande si, dans le Christ, le divin et l’humain forment une seule nature incarnée, sans division ni confusion. »"
 ecumenical_council_events.0010.desc.hesychasm.explanation: "« On nous demande si le silence sacré et la simple prière du cœur, répétés à l’infini, peuvent accorder à l’âme une vision de la lumière incréée [ROOT.Char.GetFaith.HighGodNamePossessive]. »"
 ecumenical_council_events.0010.desc.anachoresis.explanation: "« On nous demande si se retirer du monde est un acte sacré. La solitude de l’ermite est-elle une voie à suivre vers [ROOT.Char.GetFaith.HighGodName] ? »"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "« On nous demande si l’esprit s’enrichit quand le corps est soumis aux règles du jeûne, du cilice, et de la flagellation. »"
 ecumenical_council_events.0010.desc.holy_myron.explanation: "« On nous demande si le saint [Glossary( 'chrême', 'CHRISM_GLOSS' )] doit sceller le baptême et le couronnement par le don du Saint-Esprit. »"
 CHRISM_GLOSS: "Mot grec signifiant « onction ». Consacré par un évêque, le #bold chrême#! est l’huile sainte parfumée destinée à l’onction des fidèles lors du baptême et de la confirmation, et parfois lors d’un couronnement royal."
 ecumenical_council_events.0010.desc.khachkar.explanation: "« On nous demande si les croix de pierre sculptées peuvent être les témoins publics de notre foi, désignant à la foi les lieux sacrés et les morts. »"
 ecumenical_council_events.0010.desc.philanthropia.explanation: "« On nous demande si prendre soin des pauvres est un devoir impératif de l’Église [ROOT.Char.GetFaith.GetAdjective]. Devons-nous construire des hospices, des hôpitaux, et des maisons de charité ? »"
 ecumenical_council_events.0010.desc.aniconism.explanation: "« On nous demande si toutes les images sacrées doivent être retirées de nos églises. Leur vénération est-elle vraiment une idolâtrie d’images matérielles, détachant notre esprit et nos yeux loin [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "« On nous demande si nous devons lire les Écritures pour en comprendre les sens spirituels cachés. L’apprentissage du grec et l’allégorie nous permettraient-ils de découvrir ce que la lettre seule dissimule ? »"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "« On nous demande si prendre la croix et marcher dans un but sacré est un acte de dévotion envers le Christ. L’épée peut-elle protéger le pèlerinage et reprendre ce qui appartient aux infidèles ? »"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "« On nous demande si les plaisirs charnels permettent à l’âme de se rapprocher du divin. Le désir doit-il être honoré et recherché, plutôt que d’être fui comme un péché ? »"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "« On nous demande si la foi et le peuple ne forment qu’un sous [ROOT.Char.GetFaith.HighGodName]. Les étrangers doivent-ils rester à l’écart du troupeau ? »"
 ecumenical_council_events.0010.desc.communion.explanation: "« On nous demande si les rites sacrés partagés invoquent la présence [ROOT.Char.GetFaith.HighGodNamePossessive]. Ceux qui n’y participent pas doivent-ils être considérés comme extérieurs au troupeau ? »"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "« On nous demande si, à l’approche de la mort, une ultime purification spirituelle peut laver tous nos péchés, et si les purifiés doivent ensuite renoncer à la nourriture et à la vie pour éviter que le péché ne revienne. »"
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "« On nous demande si le mariage doit rester au sein de la lignée sacrée, et même entre des proches dont la relation serait considérée comme interdite par l’Église [ROOT.Char.GetFaith.GetAdjective]. »"
 ecumenical_council_events.0010.desc.gnosticism.explanation: "« On nous demande si le salut repose dans une connaissance secrète, uniquement révélée aux initiés et qui libère l’étincelle divine et la renvoie à sa source. »"
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "« On nous demande si les frères doivent ne rien posséder. Doivent-ils aller de ville en ville, vivant de l’aumône pour prêcher la parole [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.pacifism.explanation: "« On nous demande si l’épée pourrait être exclue de la vie des [ROOT.Char.GetFaith.GetAdherentNamePlural]. L’idée d’une guerre juste est-elle fausse ? »"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "« On nous demande si l’Église [ROOT.Char.GetFaith.GetAdjective] doit être gouvernée par cinq sièges patriarcaux. Cela remet-il en cause la primauté du principal intercesseur [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "« On nous demande si nous devons garder la foi face aux persécutions, aux épreuves, ou aux doutes. Sommes-nous tenus de résister à tout prix ? »"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "« On nous demande si nous servons mieux [ROOT.Char.GetFaith.HighGodName] en faisant vœu de pauvreté, comme l’ont fait les Apôtres. »"
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "« On nous demande si nous devons laisser le troupeau suivre son propre chemin tranquillement. L’Église [ROOT.Char.GetFaith.GetAdjective] doit-elle refuser de se mêler aux étrangers et de solliciter leur interférence ? »"
 ecumenical_council_events.0010.desc.adaptive.explanation: "« On nous demande si exiger une adhésion universelle à nos traditions et des restrictions nuit au troupeau. Tant que le cœur de notre foi n’est pas altéré, nos lois peuvent-elles s’adapter au monde dans lequel elles s’inscrivent ? »"
 ecumenical_council_events.0010.desc.esotericism.explanation: "« On nous demande si les mystères [ROOT.Char.GetFaith.HighGodNamePossessive] nous obligent à rechercher la connaissance du monde qui nous entoure. »"
 ecumenical_council_events.0010.desc.legalism.explanation: "« On nous demande si la loi sacrée doit dicter tous les actes de la vie [ROOT.Char.GetFaith.GetAdjective]. Aucun pécheur, royal ou impérieux, n’est-il au-dessus de notre loi ? »"
 ecumenical_council_events.0010.desc.literalism.explanation: "« On nous demande si les saintes Écritures sont immuables et complètes, constituant ainsi l’unique recueil de la sagesse [ROOT.Char.GetFaith.HighGodNamePossessive]. »"
 ecumenical_council_events.0010.desc.reincarnation.explanation: "« On nous demande si l’âme revient dans plusieurs vies, au lieu de n’affronter le jugement [ROOT.Char.GetFaith.HighGodNamePossessive] qu’une seule fois. »"
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "« On nous demande si les docteurs de l’Église [ROOT.Char.GetFaith.GetAdjective] peuvent prononcer des décisions contraignantes sur chaque nouvelle question de foi et de loi. »"
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "« On nous demande si la vie [ROOT.Char.GetFaith.GetAdjective] doit s’établir autour de la lutte et de la soumission. Chaque fidèle doit-il se plier entièrement à la volonté [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "« On nous demande si les [ROOT.Char.GetFaith.GetAdherentNamePlural] peuvent feindre d’adhérer à une autre foi en cas de persécution. »"
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "« On nous demande si les infidèles peuvent rester sous autorité [ROOT.Char.GetFaith.GetAdjective] en s’acquittant d’une taxe en échange de protection. »"
 ecumenical_council_events.0010.desc.asceticism.explanation: "« On nous demande si c’est à travers la faim, la privation et le rejet de tout confort que nous recherchons [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events.0010.desc.bhakti.explanation: "« On nous demande si chaque âme doit se lier à un aspect du divin, par pure dévotion et pur amour. »"
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "« On nous demande si tout mal fait à une créature vivante est interdit. Devons-nous éviter de causer du tort même aux insectes les plus insignifiants ? »"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "« On nous demande si c’est principalement à travers la contemplation et la connaissance de nous-mêmes que nous recherchons [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "« On nous demande si nous avons le devoir sacré d’accueillir les étrangers à notre table. »"
 ecumenical_council_events.0010.desc.adorcism.explanation: "« On nous demande si les esprits de ce monde doivent être honorés et accueillis, afin qu’ils puissent nous venir en aide plutôt que d’être rejetés comme des forces impures. »"
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "« On nous demande si nous devons honorer nos ancêtres par des prières et des offrandes, afin qu’ils puissent veiller sur nous et nous guider. »"
 ecumenical_council_events.0010.desc.astrology.explanation: "« On nous demande si nous pouvons lire la volonté [ROOT.Char.GetFaith.HighGodNamePossessive] dans les étoiles. Les cieux connaissent-ils les secrets de notre destin ? »"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "« On nous demande si le plaisir est un cadeau que nous devons rechercher comme une forme de culte. »"
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "« On nous demande si la vie humaine peut être sacrifiée sur l’autel. Pouvons-nous faire couler le sang pour [ROOT.Char.GetFaith.HighGodName] tel un cadeau sacré ? »"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "« On nous demande si certaines âmes sont marquées dès la naissance pour recevoir un pouvoir sacré et une grandeur spirituelle, comme si elles étaient choisies avant même toute consécration de la part de l’Église [ROOT.Char.GetFaith.GetAdjective]. »"
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "« On nous demande si le calendrier de la foi [ROOT.Char.GetFaith.GetAdjective] devrait compter beaucoup de fêtes religieuses, afin de souder les fidèles entre eux. »"
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "« On nous demande si l’accouchement doit être préparé avec des rites sacrés. Le lieu de naissance doit-il être purifié, afin de permettre [ROOT.Char.GetFaith.HighGodName2] de bénir la mère et son enfant ? »"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "« On nous demande si les forêts denses, les grandes rivières et les vallées couvertes de rosée sont sacrées. Est-ce dans la nature que nous devrions rechercher [ROOT.Char.GetFaith.HighGodName] ? »"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "« On nous demande si nous devons adresser nos prières au soleil. Cette lumière vitale est-elle [ROOT.Char.GetFaith.HighGodName] ? »"
 ecumenical_council_events.0010.desc.warmonger.explanation: "« On nous demande si les guerres et les conquêtes sont un service sacré. L’épée est-elle le moyen le plus sûr pour répandre la parole [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "« On nous demande si les fêtes religieuses doivent être le théâtre de spectacles cruels et sanglants. De telles festivités constituent-elles un vrai culte envers [ROOT.Char.GetFaith.HighGodName] ? »"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "« On nous demande si les hauteurs et les racines de la terre sont sacrées. Devons-nous rechercher [ROOT.Char.GetFaith.HighGodName] sur les sommets et le long des sentiers de pierre ? »"
 ecumenical_council_events.0010.desc.household_gods.explanation: "« On nous demande si les divinités du foyer et de la maison peuvent être accueillies et honorées dans les foyers où règne la foi [ROOT.Char.GetFaith.GetAdjective]. »"
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "« On nous demande si les rites et les croyances de l’Extrême-Orient peuvent être intégrés à notre foi. »"
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "« On nous demande si nous pouvons apprendre des religions de l’Orient, dont les croyants vivent côte à côte sans mépriser les autres, même si nous ne partageons pas leurs dieux. »"
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "« On nous demande si nous pouvons conserver les anciennes coutumes populaires des nouveaux convertis, afin de nous en inspirer plutôt que de les rejeter et de les condamner. »"
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "« On nous demande si les personnes extérieures au Christ peuvent honorer Son enseignement et Son exemple, sans reconnaître qu’Il est le véritable Dieu. »"
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "« On nous demande si la loi des Sarrasins peut être intégrée à l’Église [ROOT.Char.GetFaith.GetAdjective], en mêlant leurs enseignements à l’Évangile. »"
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "« On nous demande si la loi et la sagesse des juifs doivent être intégrées à l’Église [ROOT.Char.GetFaith.GetAdjective], même si nous ne partageons pas toutes leurs croyances. »"
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "« On nous demande si la douleur elle-même est sacrée. Est-ce que faire subir la douleur est une bénédiction, et la recevoir une grâce [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "« On nous demande si la sainteté réside dans l’abandon des villes pour une nouvelle vie en pleine nature, afin de retrouver l’état primitif de l’existence. »"
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "« On nous demande si la domination sur le monde vivant est considérée comme une fin sacrée. Le pouvoir permet-il d’accomplir la volonté [ROOT.Char.GetFaith.HighGodNamePossessive] ? »"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "« On nous demande si la chair des morts peut être consommée lors d’un rite sacré. »"
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "« On nous demande si la tromperie peut être sacrée. Les fidèles peuvent-ils mentir, et même croire à leurs propres mensonges, quand la vérité pourrait mettre en danger leur foi ? »"
 ecumenical_council_events.0010.desc.polyamory.explanation: "« On nous demande si les fidèles peuvent partager leur amour à plusieurs, et rejeter l’idée qu’une âme pourrait avoir l’affection d’une autre. »"
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "« On nous demande si la vie humaine peut être sacrifiée lors d’une cérémonie sacrée. Les volontaires peuvent-ils se sacrifier, et les coupables être livrés sur les autels de la foi [ROOT.Char.GetFaith.GetAdjective] ? »"
 ecumenical_council_events.0010.desc.megaliths.explanation: "« On nous demande si nous devons ériger de grands monuments de pierre à la gloire [ROOT.Char.GetFaith.HighGodNamePossessive]. »"
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "« On nous demande si les fidèles doivent regrouper toutes leurs possessions en commun. »"
 ecumenical_council_events.0010.desc.pure_land.explanation: "« On nous demande si nous pouvons atteindre un royaume béni au-delà de la souffrance, par la confiance et la dévotion, et non par la richesse, les études, ou la maîtrise des rituels. »"
 ecumenical_council_events.0010.desc.no_mind.explanation: "« On nous demande si c’est à travers la vacuité de l’esprit et le silence de soi que nous recherchons [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "« On nous demande si les hauteurs sont sacrées. Est-il préférable de chercher [ROOT.Char.GetFaith.HighGodName] au sommet des montagnes ? »"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "« On nous demande si cette époque devient de plus en plus sombre et si des démons sont déguisés parmi nous. Devons-nous tuer nos ennemis pour défendre la loi sacrée ? »"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "« On nous demande si nous devons garder les têtes des tués, tels des trophées sacrés. »"
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "« On nous demande si la quête du savoir est un devoir sacré. »"
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "« On nous demande si un règne juste est une charge sacrée que les princes de la foi [ROOT.Char.GetFaith.GetAdjective] doivent respecter. »"
 ecumenical_council_events.0010.desc.filial_piety.explanation: "« On nous demande si honorer nos parents et nos aînés est imposé par [ROOT.Char.GetFaith.HighGodName]. »"
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "« On nous demande si l’harmonie sociale, où chaque âme est à sa place, constitue le cœur de la foi [ROOT.Char.GetFaith.GetAdjective]. »"
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "« On nous demande si la destruction elle-même peut être sacrée. Et si [ROOT.Char.GetFaith.HighGodName] exige de nous que nous détruisions l’ancien ? »"
 ecumenical_council_events.0010.desc.preservation.explanation: "« On nous demande si la sainteté réside dans les constructions et leur préservation. Les temples et les installations liés à la foi [ROOT.Char.GetFaith.GetAdjective] doivent-ils être entretenus pour rayonner à tout jamais ? »"
 ecumenical_council_events.0010.desc.takamin.explanation: "« On nous demande si l’ours est un vecteur du divin. La chasse doit-elle honorer cette créature majestueuse comme une bête sacrée, et sa mise à mort doit-elle être réalisée dans le plus grand respect ? »"
 ecumenical_council_events.0010.a_1: "Cela remplacera notre principe [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_2: "Je vais faire de la place en retirant notre principe [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] doit disparaître."
 ecumenical_council_events.0010.b: "Interdisons cette pratique !"
 ecumenical_council_events.0010.c: "Pour le moment, je vais me contenter de l’autoriser."
 ecumenical_council_events.0010.d: "Reconnaissons au moins l’existence de ce principe."
 ecumenical_council_events.0011.t: "$ecumenical_council_events.0010.t$"
 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$"
 ecumenical_council_events.0011.desc.outro: "Notre hôte [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName] déclare :\n\n« Je propose que le principe [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )] soit"
 ecumenical_council_events.0011.desc.permit: "permis. »"
 ecumenical_council_events.0011.desc.prohibit: "interdit. »"
 ecumenical_council_events.0011.desc.learn: "reconnu. »"
 ecumenical_council_events.0011.desc.make_core: "fondamental, à la place du principe [core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )]. »"
 ecumenical_council_events.0011.a: "Je vote pour le changement."
 ecumenical_council_events.0011.b: "Je ne suis pas d’accord."
