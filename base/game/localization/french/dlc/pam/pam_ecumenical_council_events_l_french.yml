 ecumenical_council_events.0102.t: "Prières concurrentes"
 ecumenical_council_events.0102.desc: "Suite à la proposition, les plus dévots de l’assemblée se sont divisés en deux cercles de prière.\n\n[lead_innovator.Custom('FR_le_Char_Pi')|U][lead_innovator.GetTitledFirstName] en appelle à [lead_innovator.GetFaith.HighGodName] pour affirmer que leurs révélations sont le reflet de Sa volonté. L’entourage [lead_conservative.Custom('FR_du_Char_Pi')][lead_conservative.GetTitledFirstName] y répond immédiatement, implorant [lead_innovator.GetFaith.HighGodName] de conserver les traditions qui sont depuis longtemps au service de l’Église."
