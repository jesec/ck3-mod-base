 ecumenical_council_events.0114.t: "Armés de foi et d’acier"
 ecumenical_council_events.0114.desc.intro: "Comme le font souvent les hommes ayant connu la guerre, les anciens guerriers parmi nous ont pris l’habitude de passer le temps ensemble.\n\n« Par [lead_innovator.GetFaith.HighGodName], ce serait bien que ces changements soient approuvés. Comme ça, les fidèles pourront à nouveau se rassembler sous une même bannière », avance [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName].\n\n"
 ecumenical_council_events.0114.desc.conservative: "« Nous avons abattu bon nombre de [ec_hostile_faith.GetAdherentNamePlural] », déclare [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « [lead_conservative.GetFaith.WarGodName|U] ne bénit pas déjà nos bannières ? »"
 ecumenical_council_events.0114.desc.conservative_generic: "« Nous avons abattu bon nombre d’ennemis », déclare [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « [lead_conservative.GetFaith.WarGodName|U] ne bénit pas déjà nos bannières ? »"
 ecumenical_council_events.0114.support: "Hissons une nouvelle bannière sous Sa bénédiction."
 ecumenical_council_events.0114.support_duel: "Rassembler ceux qui ont peur sous la bannière [ROOT.Char.GetFaith.HighGodNamePossessive] !"
 ecumenical_council_events.0114.support_duel.success: "Un soldat se doit de servir"
