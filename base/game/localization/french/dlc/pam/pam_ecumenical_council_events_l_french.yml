 ecumenical_council_events.0040.t: "La fin du concile"
 ecumenical_council_events.0040.desc: "Au terme d’un processus rigoureux, le concile touche à sa fin."
 ecumenical_council_events.0040.desc.change: "Sous ma direction, la foi [ROOT.Char.GetFaith.GetAdjective] a été profondément transformée. Et maintenant, allons annoncer cette bonne nouvelle au peuple !"
 ecumenical_council_events.0040.desc.status_quo: "Je n’ai pas réussi à faire adopter la moindre de mes propositions. La foi [ROOT.Char.GetFaith.GetAdjective] reste inchangée."
 ecumenical_council_events.0040.a: "Il est temps de rentrer."
