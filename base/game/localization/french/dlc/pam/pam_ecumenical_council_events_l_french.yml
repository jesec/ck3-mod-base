 ecumenical_council_events.0126.t: "Parmi les rivaux"
 ecumenical_council_events.0126.desc: "Ce n’est pas facile de retrouver [rival.Custom('FR_le_Char_Pi')|U][rival.GetTitledFirstName], m[ROOT.Char.Custom2('FR_RelationToMe_OnA', SCOPE.sC('second'))], au milieu de l’assemblée.\n\n« Vous vous doutez de la raison de ma présence », grogne-t-[rival.Custom('FR_IlElle')]. « Dites ce que vous avez à dire, choisissez votre camp... Je n’attends qu’une chose : voter contre vous. »"
 ecumenical_council_events.0126.a: "Votez selon votre conscience, pas selon votre haine."
 ecumenical_council_events.0126.b: "Gardez votre mépris. Je ne m’abaisserai pas à votre niveau."
 ecumenical_council_events.0126.c: "Le concile a détourné son attention..."
 ecumenical_council_events.0126.c.tt: "Le [scheme|El] aura une [success_chance|El] plus #P élevée#!"
 ecumenical_council_events.0126.conservatives_custom: "[ec_conservatives|E] parmi vos [rivals|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0126.innovators_custom: "[ec_innovators|E] parmi vos [rivals|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0129.t: "Peur dans la salle"
 ecumenical_council_events.0129.desc: "Ceux qui tremblent devant moi suivent le débat avec des yeux ronds comme des billes. [lead_conservative.Custom('FR_LeLa')|U] plus insignifiant[lead_conservative.Custom('FR_E')] d’entre eux, [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName], n’ose même pas me regarder.\n\n« Dites-nous ce que vous voulez », murmure-t-[lead_conservative.Custom('FR_IlElle')]. « Je sais ce qui se passera si je refuse. »"
 ecumenical_council_events.0129.support: "La cruauté ne m’a jamais déçu."
 ecumenical_council_events.0129.support_duel: "Je vais m’assurer que les autres le sachent aussi."
 ecumenical_council_events.0129.support_duel.success: "La peur fait qu’ils se soumettent tous à vous"
 ecumenical_council_events.0129.support_duel.success_halved: "La peur n’en paralyse que certains"
 ecumenical_council_events.0129.support_duel.failure: "La peur se transforme en bravade"
 ecumenical_council_events.0129.oppose: "Et c’est ainsi que la terreur dévore l’espoir."
 ecumenical_council_events.0129.oppose_duel: "Je ne laisserai personne s’opposer à moi."
 ecumenical_council_events.0129.oppose_duel.success: "Ceux qui ont peur rentrent dans le rang"
 ecumenical_council_events.0129.oppose_duel.success_halved: "Certains rentrent dans le rang"
 ecumenical_council_events.0129.oppose_duel.failure: "La peur se transforme en bravade"
