 ecumenical_council_events.0123.t: "Si la guerre venait à éclater"
 ecumenical_council_events.0123.desc: "Je trouve mes alliés en pleine dispute, comme des divisions qui s’affronteraient sur le champ de bataille. C’est mauvais signe.\n\n« Nous n’avons qu’un seul intérêt en commun, bande d’imbéciles ! Ne me demandez pas de voter comme si je n’étais qu’un vulgaire toutou à la solde [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitledFirstName] ! » aboie [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName].\n\n« Que dois-je penser d’un[lead_conservative.Custom('FR_E')] allié[lead_conservative.Custom('FR_E')] qui n’arrive pas à tenir la promesse qu’[lead_conservative.Custom('FR_IlElle')] a faite à [ROOT.Char.GetPrimaryTitle.GetNameNoTier] au péril de sa vie ? » rétorque [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0123.support: "« Je dois faire appel à toutes les allégeances. »"
 ecumenical_council_events.0123.support_duel: "Prévenir que vous considérez cela comme un déshonneur."
 ecumenical_council_events.0123.support_duel.success: "Vos alliés resteront à vos côtés"
 ecumenical_council_events.0123.support_duel.success_halved: "Certains alliés resteront à vos côtés"
 ecumenical_council_events.0123.support_duel.failure: "Vos alliés ne se laisseront pas intimider"
 ecumenical_council_events.0123.oppose: "« Votre loyauté n’existe qu’envers les Écritures. »"
 ecumenical_council_events.0123.oppose_duel: "Je demanderai l’allégeance d’alliés comme [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.oppose_duel.success: "Vos alliés cèdent"
