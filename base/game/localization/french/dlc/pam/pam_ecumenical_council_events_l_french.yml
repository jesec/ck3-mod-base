 ecumenical_council_events.0107.t: "Le premier concile"
 ecumenical_council_events.0107.desc: "Quelques jeunes religieux discutent, impatients de découvrir ce qui sera, pour la plupart d’entre eux, leur premier concile.\n\n« Un mouvement se dessine ici : sentez-vous la patte [lead_innovator.GetFaith.HouseholdGodNamePossessive] ? Marquons l’Église de notre empreinte, avec une audace depuis longtemps oubliée ! » clame [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName].\n\n« Bande d’idiots ! Nous devons nous en remettre aux Pères de l’Église, et rejeter ces innovations de malheur », insiste [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0107.support: "Une matinée consacrée à la foi !"
 ecumenical_council_events.0107.support_duel: "Rejeter cette lâcheté conservatrice."
 ecumenical_council_events.0107.support_duel.success: "Leurs yeux sont pleins d’espoir"
 ecumenical_council_events.0107.support_duel.success_halved: "Certains s’engagent à vous soutenir"
 ecumenical_council_events.0107.support_duel.failure: "Ils continuent de se montrer méprisants"
 ecumenical_council_events.0107.oppose: "[lead_conservative.Custom('FR_le_Char_Pi')|U][lead_conservative.GetTitledFirstNameNoTooltip] dit vrai."
 ecumenical_council_events.0107.oppose_duel: "Dénoncer les dangers de l’audace !"
