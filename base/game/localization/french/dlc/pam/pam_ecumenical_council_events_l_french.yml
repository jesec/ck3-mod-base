 ecumenical_council_events.doctrine.chaplain_suggestion: "\n\n« [ec_chaplain_pick.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] répond au mieux aux besoins de la foi [ROOT.Char.GetFaith.GetAdjective] », conseille [court_chaplain.Custom('FR_le_Char_Pi')][court_chaplain.GetTitledFirstName]."
