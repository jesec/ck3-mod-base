 ecumenical_council_events.0105.t: "La sensibilité [ROOT.Char.GetCulture.GetNameNoTooltip|l]"
 ecumenical_council_events.0105.desc: "Le son familier de la langue [ROOT.Char.GetCulture.GetLanguage.GetName|l] se démarque des nombreuses langues parlées ici. Il s’agit bien entendu [lead_conservative.Custom('FR_du_Char_Pi')][lead_conservative.GetTitledFirstName] qui s’en prend à nos proches.\n\n« Nous, les [lead_conservative.GetCulture.GetCollectiveNounNoTooltip], nous n’aimons pas ces innovations ! » lance-t-[lead_conservative.Custom('FR_IlElle')].\n\n« Mais vous voudriez qu’on nous accuse de faire stagner l’Église ? » lui demande [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0105.support: "Vous ne parlez pas pour nous tous, [lead_conservative.GetFirstNameNoTooltip]."
 ecumenical_council_events.0105.support_duel: "Nous, les [lead_conservative.GetCulture.GetCollectiveNounNoTooltip], nous avons un passé riche en innovations."
 ecumenical_council_events.0105.support_duel.success: "Toutes les personnes présentes acceptent de prendre position en faveur de l’innovation"
