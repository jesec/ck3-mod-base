 # ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "La plainte des cheveux gris"
 ecumenical_council_events.0111.desc: "Les anciens aux cheveux gris vont et viennent en se lamentant.\n\n« Nous avons vu les conciles se succéder, tout comme les erreurs. Plutôt que de corriger ces perversions, on dirait que l’on continue à en adopter de nouvelles ! » marmonne [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName].\n\n« Espèce de sale [lead_conservative.Custom('RegionalFarmAnimal')|l] ! Vous avez déjà dit ça la dernière fois, et vous emporterez vos jérémiades jusque dans la tombe ! » lui répond [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0111.support: "Ce changement corrigera les erreurs du passé !"
 ecumenical_council_events.0111.support_duel: "Répéter les arguments en faveur des anciens."
 ecumenical_council_events.0111.support_duel.success: "Ils en viennent à l’accepter en ronchonnant"
 ecumenical_council_events.0111.support_duel.success_halved: "Certains acceptent cette correction"
 ecumenical_council_events.0111.support_duel.failure: "Ils crient encore à la perversion"
 ecumenical_council_events.0111.oppose: "Soutenir [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstNameNoTooltip] : fini les folies."
 ecumenical_council_events.0111.oppose_duel: "Réduire ces vieux rêveurs en poussière intellectuelle !"
