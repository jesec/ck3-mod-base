 ecumenical_council_events.0116.t: "Qui paie pour cela ?"
 ecumenical_council_events.0116.desc: "Je découvre les intendants de plusieurs évéchés penchés sur un morceau de parchemin, discutant de chiffres comme s’ils étaient dans un bureau de comptabilité.\n\n« Mon diocèse ne peut pas se permettre un autre bouleversement », soutient [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « De nouveaux livres pour chaque paroisse. Des cavaliers dans [lead_conservative.GetFaith.HouseOfWorship] de chaque village. Si cette mesure est adoptée, la dîme ne suffira pas. »\n\n« Et si elle échoue ? » demande [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]. « Cela fait des années que nous nous disputons. L’argent est perdu, de toute façon. Autant dépenser ce qu’il reste pour une loi que les fidèles respecteront. »"
 ecumenical_council_events.0116.support: "Oui, pourquoi pleurer de l’argent qui a déjà été dépensé ?"
 ecumenical_council_events.0116.support_duel: "Avancer cet argument : soutenir, c’est investir !"
 ecumenical_council_events.0116.support_duel.success: "Ils sont convaincus par la réforme"
 ecumenical_council_events.0116.support_duel.success_halved: "Certains acceptent cette formulation"
 ecumenical_council_events.0116.support_duel.failure: "Ils se plaignent encore des dépenses"
 ecumenical_council_events.0116.oppose: "Mon diocèse ne peut pas se permettre ce bouleversement."
 ecumenical_council_events.0116.oppose_duel: "« Par [ROOT.Char.GetFaith.HighGodName] ! C’est fiscalement irresponsable ! »"
 ecumenical_council_events.0116.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] renonce"
