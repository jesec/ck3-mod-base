 ecumenical_council_events.0120.t: "Noms cités dans la chronique"
 ecumenical_council_events.0120.desc: "Certains des invités les plus réputés se tiennent en retrait, réfléchissant à ce qu’il restera de leur réputation quand tout cela aura été consigné par écrit.\n\n« Mon nom peut apparaître dans toutes les chroniques écrites récemment. Pourquoi devrais-je être associé[lead_conservative.Custom('FR_E')] à un décret qui pourrait être tourné en ridicule pour l’éternité ? » s’interroge [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName].\n\n« Les hommes se souviendront qui a réglé ce différend, et pas de ceux qui ont refusé de se salir les mains. Et c’est pour cela qu’on se souviendra de moi », répond [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0120.support: "« Ne sommes-nous pas les chefs de l’Église ? »"
 ecumenical_council_events.0120.support_duel: "« Vous ne serez pas seuls ! »"
 ecumenical_council_events.0120.support_duel.success: "Les sceptiques s’en remettent à l’histoire"
 ecumenical_council_events.0120.support_duel.success_halved: "Certains s’en remettent à l’histoire"
 ecumenical_council_events.0120.support_duel.failure: "Ils restent insaisissables"
 ecumenical_council_events.0120.oppose: "Mon nom ne sera pas associé à une farce."
 ecumenical_council_events.0120.oppose_duel: "« Les imbéciles règlent leurs différends... en imposant leurs âneries. »"
 ecumenical_council_events.0120.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cède"
