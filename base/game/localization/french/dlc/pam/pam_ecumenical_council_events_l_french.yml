 ecumenical_council_events.0104.t: "Des religieux de mon sang"
 ecumenical_council_events.0104.desc: "Les religieux au sein de ma famille discutent du soutien que la Maison [ROOT.Char.GetHouse.GetName] doit apporter. [lead_conservative.Custom('FR_le_Char_Pi')|U][lead_conservative.GetTitledFirstName] annonce : « Notre Maison ne devrait pas se diviser ouvertement, et je refuse de soutenir [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName] ! »\n\n[lead_innovator.Custom('FR_le_Char_Pi')|U][lead_innovator.GetTitledFirstName] fait des gestes moqueurs dans le dos [lead_conservative.Custom('FR_du_Char_Pi')][lead_conservative.GetTitledFirstNameNoTooltip], ce qui montre que tous les membres de ma Maison ne sont pas opposés à l’innovation."
