 ecumenical_council_events.0117.t: "Trop de changements"
 ecumenical_council_events.0117.desc: "Je surprends deux négociateurs chevronnés en train de rédiger des annotations en marge du décret, retirant puis restaurant une clause comme s’il s’agissait d’un traité.\n\n« Laissez cela comme ça ! Nous risquons de voir la moitié d’entre eux partir avant même d’aborder les problèmes les plus épineux », prévient [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « J’ai passé des mois à garder tous ces gens à la même table. Adoucissez ce texte, ou nous allons perdre le concile. »\n\n« Et laisser un désordre que personne ne prendra la peine de rétablir une fois le concile terminé ? » s’indigne [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0117.support: "Nous devons nous montrer clairs et convaincants."
 ecumenical_council_events.0117.support_duel: "Mieux vaut un décret solide que fragile, non ?"
 ecumenical_council_events.0117.support_duel.success: "Ils reconnaissent qu’un texte confus ne sera jamais appliqué"
 ecumenical_council_events.0117.support_duel.success_halved: "Certains reconnaissent qu’un texte confus ne sera jamais appliqué"
 ecumenical_council_events.0117.support_duel.failure: "Ils redoutent toujours l’aliénation"
 ecumenical_council_events.0117.oppose: "Nous ne pouvons pas risquer de perdre le concile !"
 ecumenical_council_events.0117.oppose_duel: "C’est trop grossier, ça ne passera jamais !"
 ecumenical_council_events.0117.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cède"
