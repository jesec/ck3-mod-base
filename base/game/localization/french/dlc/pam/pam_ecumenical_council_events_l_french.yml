 ecumenical_council_events.0110.t: "Ambition démesurée"
 ecumenical_council_events.0110.desc: "« Ce n’est qu’une légère modification ! » s’exclame [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]. « Et si nous contribuons à sa mise en place, nous serons des candidats crédibles pour occuper le rang de [lead_innovator.GetFaith.ReligiousHeadName|l]. »\n\n« Votre ambition démesurée va trop loin et causera notre perte à tous », peste [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0110.support: "Il n’y a pas de mal à avoir un peu d’ambition"
 ecumenical_council_events.0110.support_duel: "Continuer d’argumenter dans ce sens !"
 ecumenical_council_events.0110.support_duel.success: "Ils acceptent : ce n’est qu’une légère modification"
 ecumenical_council_events.0110.support_duel.success_halved: "Certains reconnaissent l’intérêt de vous soutenir"
 ecumenical_council_events.0110.support_duel.failure: "Votre avidité est évidente"
 ecumenical_council_events.0110.oppose: "L’orgueil précède la chute"
 ecumenical_council_events.0110.oppose_duel: "Attention aux ravages de l’ambition !"
 ecumenical_council_events.0110.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cède"
