 ecumenical_council_events.0106.t: "Devoir de loyauté"
 ecumenical_council_events.0106.desc: "Mes vassaux et moi nous réunissons dans l’un des appartements.\n\n« Même ici, votre seigneur lige est votre maître », dit [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName] aux autres. « Si notre [ROOT.Char.GetTitleAsName|l] refuse de parler en faveur de cette innovation hérétique, alors vous devrez garder le silence, vous aussi. »\n\n« Notre [ROOT.Char.GetTitleAsNameNoTooltip|l] nous permet de rester sur le droit chemin, mais pas ici ! » rétorque [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0106.desc_innovator: "Mes vassaux et moi nous réunissons dans l’un des appartements.\n\n« Un seigneur lige mérite une réponse », dit [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « Malheureusement, je crains que cette affaire ne [ROOT.Char.Custom('FR_LeLa')] dépasse. Il n’y a que [lead_conservative.GetFaith.HighGodName] pour guider nos cœurs, et [lead_conservative.GetFaith.HighGodName] trace la ligne que nous devons défendre sans trembler ! »\n\n« Ah, mais les désirs de notre [ROOT.Char.GetTitleAsNameNoTooltip|l] ne vont pas à l’encontre de ceux [ROOT.Char.GetFaith.HighGodNamePossessive] », lui répond [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]. « Réfléchissez à votre serment, et reconnaissez sa sagesse ! »"
 ecumenical_council_events.0106.support: "« En tant que [ROOT.Char.GetTitleAsNameNoTooltip|l], je suis le substitut [ROOT.Char.GetFaith.HighGodNamePossessive]. »"
 ecumenical_council_events.0106.support_duel: "Exiger le service royal que ces vassaux ont juré d’assurer."
 ecumenical_council_events.0106.support_duel.success: "Ils vous obéiront"
 ecumenical_council_events.0106.support_duel.success_halved: "Certains accepteront de vous obéir"
 ecumenical_council_events.0106.support_duel.failure: "Vos vassaux réservent leur loyauté pour [lead_conservative.GetFaith.HighGodName]"
 ecumenical_council_events.0106.oppose: "Soutenir [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstNameNoTooltip] : c’est bien plus qu’un simple seigneur lige."
 ecumenical_council_events.0106.oppose_duel: "Contester que les désirs d’un seigneur ne vont pas à l’encontre de Dieu."
