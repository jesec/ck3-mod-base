 ecumenical_council_events.0113.t: "La foi sous les armes"
 ecumenical_council_events.0113.desc: "Ceux dont les pays souffrent sous l’emprise des autres fois s’éloignent dans un élan de solidarité.\n\n« Allons-nous nous chamailler pour des futilités pendant que les ennemis de la foi brûlent nos champs ? » s’interroge [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « Comme si l’épée n’était pas en train de nous transpercer le cœur ? »\n\n« Un credo fracturé est un bouclier fendu », répond [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]. « Mettons-nous d’accord sur le droit canonique et ensemble, nous serons plus forts que jamais ! »"
 ecumenical_council_events.0113.support: "Ce serait bien de retrouver le goût de l’espoir."
 ecumenical_council_events.0113.support_duel: "Réparons l’Église, notre bouclier !"
 ecumenical_council_events.0113.support_duel.success: "Ils acceptent, et nous ferons front tous ensemble"
 ecumenical_council_events.0113.support_duel.success_halved: "Certains sont convaincus par la réforme"
 ecumenical_council_events.0113.support_duel.failure: "Ils ont oublié le goût de l’espoir"
 ecumenical_council_events.0113.oppose: "N’y a-t-il pas plus urgent que ces idioties ?"
 ecumenical_council_events.0113.oppose_duel: "Les prévenir de cette imprudence."
 ecumenical_council_events.0113.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cède"
 ecumenical_council_events.0113.oppose_duel.success_halved: "Quelques membres de l’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cèdent"
