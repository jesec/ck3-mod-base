 ecumenical_council_events.0103.t: "Le prix du changement"
 ecumenical_council_events.0103.desc: "« Votre intransigeance causera notre perte ! » s’écrie [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName].\n\n« Les fidèles de [lead_conservative.GetPrimaryTitle.GetNameNoTooltip] remercieraient un mécène qui restaure [lead_conservative.Custom('GetFaithTemple')|l] », affirme [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]."
