 ecumenical_council_events.0122.t: "Tant que je peux encore"
 ecumenical_council_events.0122.desc: "Quelques prêtres malades sont assis à l’écart, cherchant la chaleur du soleil.\n\n« Je me demande si j’entendrai les dernières paroles de ce concile avant ma rencontre avec [lead_conservative.GetFaith.HighGodName]... et avant que j’aille rôtir [lead_conservative.GetFaith.NegativeAfterLife2] », siffle [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName].\n\n« Vous n’avez pas grand-chose à perdre, [lead_conservative.GetFirstNameNoTooltip], mais il vous reste sûrement encore un peu d’espoir à offrir au monde pour que vous puissiez finir [lead_innovator.GetFaith.PositiveAfterLife2] », lui répond [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0122.support: "« Par [ROOT.Char.GetFaith.HighGodName], ces derniers instants sont précieux ! »"
 ecumenical_council_events.0122.support_duel: "Je ne rencontrerai pas [ROOT.Char.GetFaith.HighGodName] en ayant gardé le silence."
 ecumenical_council_events.0122.support_duel.success: "Ils sont convaincus par un dernier acte de réforme"
 ecumenical_council_events.0122.support_duel.success_halved: "Certains sont convaincus par un dernier acte de réforme"
 ecumenical_council_events.0122.support_duel.failure: "Ils dépériront avec amertume"
 ecumenical_council_events.0122.oppose: "Nos dernières forces sont entre les mains [ROOT.Char.GetFaith.HighGodNamePossessive] et au service de Sa parole."
 ecumenical_council_events.0122.oppose_duel: "« Nous refusons d’entacher nos vies avec ça ! »"
 ecumenical_council_events.0122.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cède"
