 pam_rite_quarrel_championed_opinion: "S’est rangé du côté de mon rite lors d’un concile œcuménique"
 pam_rite_quarrel_slighted_opinion: "A pris le parti du rite opposé au mien lors d’un concile œcuménique"
 pam_rite_quarrel_overruled_opinion: "A rejeté mon rite lors d’un concile œcuménique"
 ecumenical_council_summons_events.0060.t: "Premier parmi ses pairs"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.Custom('FR_le_Char_Pi')|U][ec_roman_champion.GetTitledFirstName] défend le rite [GetRiteByKey('roman_rite').GetAdherentName] et ne lâche pas prise :\n\n« Toutes les Églises rendent des comptes à Rome, mais Rome ne rend de comptes à personne ! »\n\n[ec_greek_champion.Custom('FR_le_Char_Pi')|U][ec_greek_champion.GetTitledFirstName] compte cinq patriarches sur ses doigts.\n\n« Lequel d’entre eux s’est jamais agenouillé ? »"
 ecumenical_council_summons_events.0060.a: "« Restez calmes. Tous les deux. Le concile n’a même pas encore commencé. »"
 ecumenical_council_summons_events.0060.a.success: "Les deux orateurs se laissent raisonner, et le chaos est évité"
 ecumenical_council_summons_events.0060.a.failure: "Personne ne veut m’écouter et l’assemblée prend parti"
 ecumenical_council_summons_events.0060.b: "La clé a été confiée à Pierre, et c’est Rome qui la conserve."
 ecumenical_council_summons_events.0060.c: "Rome est la première parmi ses égales. Rien de plus."
 ecumenical_council_summons_events.0060.d: "C’est moi qui occupe ce poste. Le débat est clos."
 ecumenical_council_summons_events.0061.t: "Et le Fils"
 ecumenical_council_summons_events.0061.desc: "« Deux mots », dit [ec_greek_champion.Custom('FR_le_Char_Pi')][ec_greek_champion.GetTitledFirstName] du rite [GetRiteByKey('byzantine_rite').GetAdherentName]. « Deux mots que les [GetRiteByKey('roman_rite').GetAdherentNamePlural] ont glissés dans le Credo, alors que l’Orient n’a jamais été consulté. »\n\n« La vérité n’a pas besoin de la permission des hommes, seulement de celle de Dieu », répond [ec_roman_champion.Custom('FR_le_Char_Pi')][ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0061.a: "Le Credo a déjà survécu à bien pire que le fait que certains s’y opposent."
 ecumenical_council_summons_events.0061.a.success: "La formulation est reportée afin d’éviter que le débat ne se fige"
 ecumenical_council_summons_events.0061.a.failure: "Les positions des deux camps se rigidifient jusqu’à devenir des doctrines"
 ecumenical_council_summons_events.0061.b: "Ces mots ont été ajoutés parce qu’ils sont vrais."
 ecumenical_council_summons_events.0061.c: "C’est un concile qui a rédigé le credo. Seul un concile peut le modifier."
 ecumenical_council_summons_events.0061.d: "Le credo sera récité ici tel que je le récite."
 ecumenical_council_summons_events.0062.t: "Le pain sur l’autel"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.Custom('FR_le_Char_Pi')|U][ec_roman_champion.GetTitledFirstName] brandit une hostie, fine et pâle comme une pièce de monnaie, et dit :\n\n« Les [GetRiteByKey('roman_rite').GetAdherentNamePlural] n’ont jamais eu besoin de plus. »\n\n[ec_greek_champion.Custom('FR_le_Char_Pi')|U][ec_greek_champion.GetTitledFirstName] pose un pain levé à côté et demande :\n\n« Les [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] se sont-ils trompés depuis l’époque des apôtres ? »"
 ecumenical_council_summons_events.0062.a: "Les deux pains seront bénis demain sur mon autel, et nous en mangerons des deux."
 ecumenical_council_summons_events.0062.a.success: "Les deux pains sont mangés, et la querelle disparaît avec eux"
 ecumenical_council_summons_events.0062.a.failure: "Deux autels sont dressés ce soir-là, et l’allée qui les sépare reste vide"
 ecumenical_council_summons_events.0062.b: "Sans levain, comme lors de la Cène."
 ecumenical_council_summons_events.0062.c: "Du pain levé pour le Seigneur ressuscité."
 ecumenical_council_summons_events.0062.d: "Le pain, c’est le pain. C’est la bénédiction qui fait toute la différence."
 ecumenical_council_summons_events.0063.t: "Une question de langue"
 ecumenical_council_summons_events.0063.desc: "Les prières sont lues à haute voix en latin. Les [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] qui remplissent les bancs attendent une traduction, et celle qu’ils reçoivent est inexacte. [ec_greek_champion.Custom('FR_le_Char_Pi')|U][ec_greek_champion.GetTitledFirstName] murmure :\n\n« Les Romains argumentent comme des avocats. Beaucoup de mots, mais sans substance. »\n\n« Les Grecs argumentent comme des philosophes. Ils ne tranchent rien », rétorque [ec_roman_champion.Custom('FR_le_Char_Pi')][ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0063.a: "Alors, trouvons des mots qui transmettent un message dans les deux langues."
 ecumenical_council_summons_events.0063.a.success: "Une formulation qu’aucune partie ne peut déformer est trouvée"
 ecumenical_council_summons_events.0063.a.failure: "Les deux parties partent du principe que c’est l’autre qui avance ses arguments avec de mauvaises intentions"
 ecumenical_council_summons_events.0063.b: "Dites-le en latin, et dites-le clairement."
 ecumenical_council_summons_events.0063.c: "Les Pères écrivaient en grec. Nous pouvons le lire."
 ecumenical_council_summons_events.0063.d: "Je le publierai dans les deux langues. L’affaire est close."
