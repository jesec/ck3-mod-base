 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "Le concile procède au vote"
 ecumenical_council_events.0081.desc.innovator_passed: "Nous, qui étions favorables au changement, avons eu gain de cause. Nos arguments ont convaincu un nombre suffisant de membres du concile, et la nouvelle voie a donc été adoptée."
 ecumenical_council_events.0081.desc.innovator_failed: "Bien que nous ayons plaidé en faveur d’un changement, le vote a échoué. Les anciennes traditions restent en vigueur, et nos arguments ont été mis de côté pour l’instant."
 ecumenical_council_events.0081.desc.conservative_passed: "Malgré notre volonté de défendre nos traditions, les réformateurs ont remporté le vote. Le changement a été adopté en dépit de nos réserves."
 ecumenical_council_events.0081.desc.conservative_failed: "Nous, qui défendons les traditions, n’avons pas cédé. La proposition a été rejetée et notre rite a été préservé."
 ecumenical_council_events.0081.desc.neutral: "Le concile rend son verdict, et l’affaire est réglée."
 ecumenical_council_events.0081.a: "C’est donc décidé."
