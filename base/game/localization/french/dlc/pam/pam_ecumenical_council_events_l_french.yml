 ecumenical_council_events.0101.t: "Paroles d’érudits"
 ecumenical_council_events.0101.desc: "Les érudits échangent des citations dans toute la salle et chaque verset attise le débat.\n\n« Il n’y a point d’ambiguïté dans [lead_conservative.GetFaith.ReligiousText] », insiste [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName]. « [ec_current_topic.GetName( activity.GetHost.GetRite )] ne doit pas changer. »\n\n« Lisez le passage que je cite en entier », rétorque [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]. « Vous verrez qu’il insiste pour que ce changement soit effectué ! »"
