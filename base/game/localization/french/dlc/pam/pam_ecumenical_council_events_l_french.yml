 ecumenical_council_events.0114.support_duel.failure: "Ils campent obstinément sur leurs positions"
 ecumenical_council_events.0114.oppose: "Soutenir [lead_conservative.Custom('FR_le_Char_Pi')|U][lead_conservative.GetTitledFirstNameNoTooltip], qui défend l’orthodoxie."
 ecumenical_council_events.0114.oppose_duel: "C’est une joute verbale !"
