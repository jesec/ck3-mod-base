 # Debate vote resolution: host
 ecumenical_council_events.0080.t: "Le concile procède au vote"
 ecumenical_council_events.0080.desc.passed: "Le décompte des voix est terminé. [lead_portrait.Custom('FR_le_Char_Pi')|U][lead_portrait.GetTitledFirstName] poursuit :\n\n« Le Saint-Esprit nous a guidés tout au long du concile, et nous avons pris notre décision. La proposition est adoptée ! »"
 ecumenical_council_events.0080.desc.failed: "Le décompte des voix est terminé. [lead_portrait.Custom('FR_le_Char_Pi')|U][lead_portrait.GetTitledFirstName] poursuit :\n\n« Le Saint-Esprit nous a guidés tout au long du concile, et nous avons pris notre décision. La foi [host.GetFaith.GetAdjective] reste inchangée. »"
