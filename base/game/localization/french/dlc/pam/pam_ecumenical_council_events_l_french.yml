 ecumenical_council_events.0115.t: "Chuchotements et moyens de pression"
 ecumenical_council_events.0115.desc: "Bien que cela me coûte de l’admettre, tous les religieux n’ont pas mérité leur soutane. Même au sein de cette illustre instance, je sais pertinemment que certains préfèrent les ténèbres à la lumière pure des Écritures. Les murmures vont bon train dans l’obscurité.\n\n« Toutes les âmes ici ont faim de quelque chose. Nous, les sages, nous devons simplement nous demander quel sera le prix de cette faim », glisse [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName] aux oreilles de ses interlocuteurs. « Une idéologie audacieuse, une réforme passionnée... rien ne coûte plus cher... »\n\nUne autre vipère, [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName], se lève pour lui tenir tête : « Parce que vous pensez que c’est vous qui paierez le prix du chaos ? En ces temps difficiles qui s’annoncent, quand serons-nous libres de jouer comme bon nous semble... ? »"
 ecumenical_council_events.0115.support: "Ces perturbations ont leur utilité."
 ecumenical_council_events.0115.support_duel: "Parler d’opportunités à ceux qui seront assez intelligents pour vous écouter."
 ecumenical_council_events.0115.support_duel.success: "C’est leur avidité qui les pousse vers vous"
 ecumenical_council_events.0115.support_duel.success_halved: "Certains chercheront les perturbations"
 ecumenical_council_events.0115.support_duel.failure: "Ils sont insensibles aux opportunités"
 ecumenical_council_events.0115.oppose: "Un petit repas et nous, les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip], nous mourrons de faim à tout jamais."
 ecumenical_council_events.0115.oppose_duel: "Cherchez la vérité dans les Écritures si vous ne voulez pas vous perdre."
