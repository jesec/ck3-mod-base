 ecumenical_council_events.0112.t: "La maladie dans le pays"
 ecumenical_council_events.0112.desc: "« Les morts s’accumulent sur mes terres ! Au début, je me demandais quelle était la raison du châtiment [lead_conservative.GetFaith.HighGodNamePossessive], mais tout est clair maintenant ! L’humanité souffre parce que notre monde rejette cette transformation du droit canonique », affirme [lead_conservative.Custom('FR_le_Char_Pi')][lead_conservative.GetTitledFirstName].\n\n« Votre haine de ce concile vous aveugle-t-elle au point de ne pas voir votre propre salut ? » lui rétorque [lead_innovator.Custom('FR_le_Char_Pi')][lead_innovator.GetTitledFirstName]. « Notre réforme apaisera la colère [lead_innovator.GetFaith.HighGodNamePossessive] ! »"
 ecumenical_council_events.0112.support: "Oui. [ROOT.Char.GetFaith.HighGodName|U] exige un changement de l’Église."
 ecumenical_council_events.0112.support_duel: "Utiliser sa logique contre [lead_conservative.Custom('FR_LuiElle')] pourrait bien fonctionner !"
 ecumenical_council_events.0112.support_duel.success: "Beaucoup voient une fin à cette colère divine"
 ecumenical_council_events.0112.support_duel.success_halved: "Certains essaieront d’apaiser [lead_innovator.GetFaith.HighGodName]"
 ecumenical_council_events.0112.support_duel.failure: "La destruction du droit canonique est trop risquée"
 ecumenical_council_events.0112.oppose: "Ou énerver [ROOT.Char.GetFaith.HighGodName] encore plus !"
 ecumenical_council_events.0112.oppose_duel: "Prévenir que cela détruira le droit canonique."
 ecumenical_council_events.0112.oppose_duel.success: "L’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cède"
 ecumenical_council_events.0112.oppose_duel.success_halved: "Quelques membres de l’entourage [lead_innovator.Custom('FR_du_Char_Pi')][lead_innovator.GetTitledFirstNameNoTooltip] cèdent"
 ecumenical_council_events.0112.oppose_duel.failure: "Ils espèrent encore un changement"
