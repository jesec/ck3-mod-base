l_french:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "Étude de la foi"
 study_scripture_action: "Étudier la foi"
 study_scripture_desc: "Je vais me consacrer à l’étude du sacré : [GetPlayer.GetFaith.ReligiousText], les doctrines de ma foi et ses mystères."
 study_scripture_desc_general: "L’$study_scripture|l$ est un [personal_scheme|El] dans lequel vous tentez de gagner de la [piety|El], de l’[skill|El] et le [trait|El] de l’[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "Vous améliorez vos aptitudes, gagnez en piété ou trouvez une opportunité."
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "Vous adhérez à la [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName|l] : $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "Vous adhérez à la [GetTenetType('tenet_scholasticism').GetBaseName|l] : $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "L’[learning|El] de votre [superior|El] clérical : $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "Vous avez [GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip] : $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "Votre [stress|El] vous pèse pendant votre étude : $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "Vous êtes [GetTrait('zealous').GetName( owner )|l] : $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "Vous êtes [GetTrait('cynical').GetName( owner )|l] : $VALUE|+0=$"
 pam_study_scripture_decision: "Étudier [ROOT.Char.GetFaith.ReligiousText]"
 pam_study_scripture_decision_desc: "[ROOT.Char.GetFaith.ReligiousText|U] et le corpus doctrinal [ROOT.Char.GetFaith.GetAdherentName] ne livrent pas leurs mystères si on n’y met pas du sien. Il faut réserver quelques heures entre deux [ROOT.Char.Custom('StudyOfficesWord')] à l’étude et la réflexion, ce qui permet également aux fidèles de voir que leur pasteur apprend lui aussi."
 pam_study_scripture_decision_tooltip: "Commencer un [scheme|El] d’[GetScheme('study_scripture').GetTypeName|l] qui vous cible"
 pam_study_scripture_decision_tt: "Vous commencez un [scheme|El] d’[GetScheme('study_scripture').GetTypeName|l] qui vous cible\n\nRécompenses prévues :\n$EFFECT_LIST_BULLET$ [piety|E][piety_i]\n$EFFECT_LIST_BULLET$ [trait|E] ou [trait_level_track_xp|El] d’[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$ [skill|E] [learning_i][stewardship_i][diplomacy_i] #weak (jusqu’à 8)#!\n$EFFECT_LIST_BULLET$ Opportunités parmi le [clergy|El]\n\nInconvénients :\n$EFFECT_LIST_BULLET$ Pourrait gagner du [stress|El][stress_i]\n$EFFECT_LIST_BULLET$ Gain de [prestige|El][prestige_i] réduit"
 pam_study_scripture_decision_confirm: "Que la leçon commence."
 pam_study_scripture_decision_req_tt: "Vous n’avez pas déjà un [scheme|El] d’[GetScheme('study_scripture').GetTypeName|l]"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial Votre [personal_scheme|El] en cours prendra fin#!"
 study_scripture_title: "$study_scripture$ : "
 study_scripture_outcome_piety: "$study_scripture_title$ dévotion récompensée"
 study_scripture_outcome_fragment_tt: "« #EMP [owner.Custom('RandomStudyVerseFragment')]#! »"
 study_scripture_outcome_scholarship: "$study_scripture_title$une compréhension des Écritures"
 study_scripture_outcome_mystery: "$study_scripture_title$un aperçu des mystères"
 study_scripture_outcome_stress: "$study_scripture_title$des études épuisantes"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "Une lampe à mes pieds, une lumière sur mon chemin..."
 pam_ss_fragment_psalm_119_165: "Grande est la paix de ceux qui aiment ta loi..."
 pam_ss_fragment_proverbs_9_9: "Instruis le sage, et il deviendra plus sage..."
 pam_ss_fragment_proverbs_4_7: "Le commencement de la sagesse, le voici..."
 pam_ss_fragment_joshua_1_8: "Médite-la jour et nuit..."
 pam_ss_fragment_matthew_7_7: "Cherchez, et vous trouverez..."
 pam_ss_fragment_james_1_5: "Si l’un de vous manque de sagesse..."
 pam_ss_fragment_2_timothy_2_15: "Présente-toi devant Dieu comme un homme éprouvé et digne de son approbation..."
 pam_ss_fragment_verbum_domini: "La parole du Seigneur demeure éternellement..."
 pam_ss_fragment_generic_1: "Les mystères s’approfondissent..."
 pam_ss_fragment_generic_2: "La sagesse prend racine..."
 pam_ss_fragment_generic_3: "Les textes dévoilent peu à peu leur sens..."
 # Faith-flavored vocabulary for StudyParishWord/StudyPulpitWord/StudySeminaryWord/StudyOfficesWord
 pam_ss_word_parish: "paroisse"
 pam_ss_word_congregation: "congrégation"
 pam_ss_word_pulpit: "la chaire"
 pam_ss_word_minbar: "le minbar"
 pam_ss_word_lectern: "le lutrin"
 pam_ss_word_seminary: "le séminaire"
 pam_ss_word_madrasa: "la madrasa"
 pam_ss_word_school: "l’école"
 pam_ss_word_offices: "offices"
 pam_ss_word_daily_prayers: "prières"
 pam_ss_word_daily_rites: "rites"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "Études abandonnées"
 pam_lapsed_studies_modifier_desc: "En proie au désespoir, ce personnage a renoncé à l’étude des textes sacrés."
 pam_renewed_zeal_modifier: "Zèle renouvelé"
 pam_renewed_zeal_modifier_desc: "Après avoir reçu une sévère réprimande, ce personnage s’est remis sérieusement à ses études.\n[success_chance|E] de l’[GetScheme('study_scripture').GetTypeName|l] : #P +10%#!"
 pam_inspired_study_modifier: "Étude inspirée"
 pam_inspired_study_modifier_desc: "Un cadeau bien pensé contribue à faire avancer ces études."
 pam_cloistered_rigor_modifier: "Rigueur en réclusion"
 pam_cloistered_rigor_modifier_desc: "Ces études sont menées à huis clos, avec une rigueur sans faille."
 pam_cloistered_rigor_personal_modifier: "Étudie en réclusion"
 pam_cloistered_rigor_personal_modifier_desc: "Ce personnage s’est retiré des affaires du monde et se consacre à l’étude sacrée avec une rigueur sans faille."
 pam_measured_devotion_modifier: "Dévotion modérée"
 pam_measured_devotion_modifier_desc: "Ces études avancent régulièrement pendant les heures qui leur sont consacrées."
 pam_measured_devotion_personal_modifier: "Étudiant dévoué des textes sacrés"
 pam_measured_devotion_personal_modifier_desc: "Ce personnage se consacre à l’étude du sacré avec un dévouement constant et modéré."
 pam_mortified_flesh_modifier: "Mortification de la chair"
 pam_mortified_flesh_modifier_desc: "Le jeûne et les veillées ont affûté l’esprit pour les études."
 pam_divine_favor_modifier: "Faveur divine"
 pam_divine_favor_modifier_desc: "Ces études ont reçu la bénédiction divine."
 pam_devoted_acolyte_modifier: "Assistant dévoué"
 pam_devoted_acolyte_modifier_desc: "Un assistant dévoué qui s’occupe de tous les besoins liés à ces études."
 pam_amanuensis_modifier: "Scribe dévoué"
 pam_amanuensis_modifier_desc: "Un assistant dévoué veille à ce que les notes et les documents soient parfaitement classés."
 pam_persistent_devotions_modifier: "Dévouement persistant"
 pam_persistent_devotions_modifier_desc: "Les revers n’ont fait que renforcer la rigueur de ces études."
 pam_renowned_exegete_modifier: "Célèbre exégète"
 pam_renowned_exegete_modifier_desc: "La lecture des textes sacrés a fait de ce personnage un [Glossary('exégète', 'GLOSS_EXEGETE')]."
 pam_doctrinal_clarity_modifier: "Clarté doctrinale"
 pam_doctrinal_clarity_modifier_desc: "Ce personnage appréhende les doctrines de sa foi avec une lucidité peu commune.\n\nAcceptation de $sway_ruler_to_my_rite_interaction$ : #p +20#!\nAcceptation de $pam_evangelize_personal_tenet_interaction$ : #p +20#!\nCoût en [piety|El] de $pam_evangelize_personal_tenet_interaction$ : #p -50%#!"
 pam_known_in_the_synod_modifier: "Connu au sein du synode"
 pam_known_in_the_synod_modifier_desc: "Au sein du clergé, on parle de l’érudition de ce personnage."
 pam_assisted_by_theologians_modifier: "Assisté par des théologiens"
 pam_assisted_by_theologians_modifier_desc: "Des théologiens érudits assistent ce personnage."
 pam_known_by_mystics_modifier: "Connu des mystiques"
 pam_known_by_mystics_modifier_desc: "Ce personnage jouit d’une grande estime parmi les mystiques et les penseurs."
 pam_monastic_copyists_modifier: "Copistes monastiques"
 pam_monastic_copyists_modifier_desc: "Des copistes monastiques infatigables alimentent ces études en textes."
 pam_charterhouse_silence_modifier: "Silence de la chartreuse"
 pam_charterhouse_silence_modifier_desc: "La discipline des penseurs silencieux apporte une certaine stabilité à ces études."
 pam_pastoral_letter_county_modifier: "Une lettre pastorale"
 pam_pastoral_letter_county_modifier_desc: "Une lettre réconfortante et instructive, écrite par un pasteur de la foi lointain, est lue à haute voix à chaque office religieux."
