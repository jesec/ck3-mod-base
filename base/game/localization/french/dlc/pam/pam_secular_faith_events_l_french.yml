l_french:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "Une pratique étrangère à votre [faith|El] s’est insinuée dans vos pensées, et vous acquérez la [agnostic_knowledge|El] du [core_tenet|El] [pam_sf_seeded_tenet.GetBaseName]."
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a joué le rôle de [Select_CString(CHARACTER.IsFemale,'marraine','parrain')] pour [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName], et ce lien spirituel s’est transformé en amitié."
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a joué le rôle de [Select_CString(TARGET_CHARACTER.IsFemale,'marraine','parrain')] pour [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName], et ce lien spirituel s’est transformé en amitié."
 pam_sf_friend_shared_conviction: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] se sont [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'rapprochées', 'rapprochés')] en raison de convictions religieuses communes."
 pam_sf_best_friend_shared_conviction: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] sont [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'liées', 'liés')] par des convictions religieuses communes et une profonde amitié."
 pam_sf_friend_shielded: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a protégé [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] contre les persécutions religieuses."
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a protégé [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] contre les persécutions religieuses."
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName], [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'attirées', 'attirés')] par leurs convictions religieuses communes, sont [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'devenues amantes', 'devenus amants')]."
 pam_sf_lover_carnal_revelation: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] sont devenu[Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'es', 's')] amant[Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'es', 's')] au cours d’une nuit commune d’abandon sacré."
 pam_sf_lover_confessional: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] ont trouvé dans la confession plus que l’absolution et sont [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'devenues amantes', 'devenus amants')]."
 pam_sf_lover_two_faiths: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName] et [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] sont [Select_CString(And(CHARACTER.IsFemale, TARGET_CHARACTER.IsFemale), 'devenues amantes', 'devenus amants')] après avoir discuté des subtilités de la foi."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] sont des âmes-sœurs liées par des convictions religieuses communes."
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a vendu la charge sacrée [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUINameNoTooltip] à un inconnu qui avait les moyens de l’acheter."
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a vendu la charge sacrée [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltip] à un inconnu qui avait les moyens de l’acheter."
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a contraint [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] à prononcer ses vœux et se retirer dans un cloître."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a contraint [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] à prononcer ses vœux et se retirer dans un cloître."
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "Révérend père"
 pam_my_liege_reverend_mother: "Révérende mère"
 pam_my_liege_captain: "Capitaine"
 pam_my_liege_khan: "Grand khan"
 pam_my_liege_khatun: "Grande khatoun"
 pam_my_liege_chieftain: "Chef"
 pam_my_liege_serene_lord: "Sérénissime seigneur"
 pam_my_liege_serene_lady: "Sérénissime dame"
 pam_my_liege_lord: "Monseigneur"
 pam_my_liege_lady: "Madame"
 pam_my_liege_liege: "Monseigneur"
 pam_secular_faith_events.0001.t: "Fumée sacrée"
 pam_secular_faith_events.0001.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] porte l’encensoir à travers la nef. La fumée sacrée s’élève jusqu’aux chevrons, accompagnée des prières murmurées par l’assemblée.\n\nL’espace d’un instant, toute la création semble tendre vers [ROOT.Char.GetFaith.PositiveAfterLife], et moi avec elle."
 pam_secular_faith_events.0001.a: "Je me perds dans la prière."
 pam_secular_faith_events.0001.b: "Ce rite devait être pour [ROOT.Char.GetFaith.WealthGodName]."
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('FR_GetCourt_Le')|U] devrait partager cette dévotion."
 pam_secular_faith_events.0002.t: "Sauver une vie"
 pam_secular_faith_events.0002.desc: "[traveler_in_danger.Custom('FR_le_Char_Pi')|U][traveler_in_danger.GetTitledFirstName], [Select_CString(traveler_in_danger.IsFemale,'une voyageuse','un voyageur')] traversant mes terres, a été attaqué[traveler_in_danger.Custom('FR_E')] par des bandits en [background_terrain_scope.GetName] !\n\nIl est interdit de prendre les armes le jour sacré [ROOT.Char.GetFaith.HighGodNamePossessive], et je ne saurais enfreindre le sabbat. Cependant, si j’attends le coucher du soleil, je n’arriverai auprès d[traveler_in_danger.Custom('FR_EluiElle')] que pour l’enterrer.\n\nPuis-je vraiment rester les bras croisés alors qu’une vie est en danger ?"
 pam_secular_faith_events.0002.a: "La vie prime sur tout. Nous partons à cheval."
 pam_secular_faith_events.0002.b: "Je dois consulter m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0002.c: "Je ne violerai pas le sabbat."
 pam_secular_faith_events.0003.t: "Une vision dans la nuit"
 pam_secular_faith_events.0003.desc: "Je me réveille, saisi[ROOT.Char.Custom('FR_E')] par bien plus qu’un simple rêve : une colonne de feu, une voix qui connaissait mon nom, un visage que je ne peux oublier...\n\nÉtait-ce une manifestation [ROOT.Char.GetFaith.HighGodNamePossessive] ? Ou bien [ROOT.Char.GetFaith.DevilName] sous un beau déguisement...\n\nPeut-être n’était-ce qu’une humeur fiévreuse du sang."
 pam_secular_faith_events.0003.a: "La voix murmurait des vérités réconfortantes..."
 pam_secular_faith_events.0003.b: "Une humeur fiévreuse... Il faut que je me renseigne sur de tels cas."
 pam_secular_faith_events.0003.c: "Je dois le faire savoir [ROOT.Char.Custom('FR_GetCourt_Au')] !"
 pam_secular_faith_events.0004.t: "Vérité interdite"
 pam_secular_faith_events.0004.desc: "Je ne dors plus, rongé[ROOT.Char.Custom('FR_E')] par le doute, errant dans les [ROOT.Char.Custom('ResidenceBuildingHallsType')] sombres de m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')].\n\nJe repense sans cesse à quelque chose que ma foi condamne : [pam_sf_forbidden_tenet.GetBaseName|l]. Je suis tourmenté[ROOT.Char.Custom('FR_E')] parce que j’ai l’impression qu’il y a du vrai dans cette croyance."
 pam_secular_faith_events.0004.a: "Je vais embrasser cette vérité — mais en toute discrétion."
 pam_secular_faith_events.0004.b: "Je ne m’écarterai pas du droit chemin."
 pam_secular_faith_events.0005.t: "À la lueur des bougies"
 pam_secular_faith_events.0005.desc_intro: "Ces études du soir étaient censées m’apaiser l’esprit, mais il y a un passage qui ne cesse de me trotter dans la tête.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "Il s’agit du principe que l’on appelle « [pam_sf_revelation_tenet.GetBaseName|l] », une pratique que ma propre foi n’approuverait jamais. Je me dis qu’elle est barbare."
 pam_secular_faith_events.0005.desc_doctrine: "Il s’agit de la doctrine intitulée « [pam_sf_revelation_doctrine.GetDescriptiveName(ROOT.Char.GetFaith.Self)] », un enseignement que ma propre foi n’approuverait jamais. Je me dis qu’elle est erronée."
 pam_secular_faith_events.0005.desc_end: "Et pourtant, à la lueur des bougies, je me rends compte que je comprends comment une autre âme peut y adhérer."
 pam_secular_faith_events.0005.a: "Je dois coucher mes pensées sur le papier."
 pam_secular_faith_events.0005.b: "Cela ne fait pas de mal de le comprendre."
 pam_secular_faith_events.0005.c: "La prière permettra de purifier ces pensées."
 pam_secular_faith_events.0006.t: "Os d’un saint"
 pam_secular_faith_events.0006.desc: "Au marché, mon regard se pose sur [Select_CString(relic_seller.IsFemale,'une pèlerine fatiguée','un pèlerin fatigué')] par le voyage qu’[relic_seller.Custom('FR_IlElle')] vient d’accomplir. Dans ses mains tremblantes repose un os de doigt jaunâtre.\n\n« L’os d’un saint », jure-t-[relic_seller.Custom('FR_IlElle')]. « Je l’ai trouvé lors de mes voyages à [GetTitleByKey('c_jerusalem').GetNameNoTier], mais il aurait certainement été mieux préservé par un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l]. »\n\nUn œil averti pourrait se prononcer sur cette affirmation. Heureusement, la relique est à vendre."
 pam_secular_faith_events.0006.a: "Permettez-moi de le vérifier avant de dépenser de l’argent."
 pam_secular_faith_events.0006.b: "Je l’achète."
 pam_secular_faith_events.0006.c: "Je n’ai que faire des os d’un inconnu. Hors de ma vue !"
 pam_sf_acquire_relic_tt: "Vous gagnez une [Concept('artifact', 'relique')|E] [Concept('rarity', 'ordinaire')|E]"
 pam_sf_examine_relic_tt: "Vous gagnez une [Concept('artifact', 'relique')|E] dont la [rarity|El] est fonction de votre [learning_skill|El][learning_i]"
 pam_sf_acquire_relic_toast: "Sainte relique acquise"
 pam_sf_fingerbone_relic_name: "Os du doigt de [SCOPE.Custom('PamFingerboneSaint')]"
 pam_sf_fingerbone_relic_desc: "Un os de doigt jauni, vénéré comme une relique de [SCOPE.Custom('PamFingerboneSaint')] et conservé dans un petit reliquaire."
 pam_secular_faith_events.0007.t: "Évêque arrogant[defiant_bishop.Custom('FR_E')]"
 pam_secular_faith_events.0007.desc: "[defiant_bishop.GetFirstName], un de mes [defiant_bishop.GetTitleAsNameNoTooltip|l]s, est [Select_CString(defiant_bishop.IsFemale,'fière','fier')], dispose d’un réseau étendu et est secrètement convaincu[defiant_bishop.Custom('FR_E')] qu’[defiant_bishop.Custom('FR_IlElle')] m’est supérieur[defiant_bishop.Custom('FR_E')]. Plusieurs domestiques sont tombés malades récemment et j’ai besoin d[defiant_bishop.Custom('FR_EluiElle')] pour bénir ma maisonnée.\n\nAprès avoir ignoré mes appels pendant des jours, [defiant_bishop.Custom('FR_IlElle')] arrive enfin. « Je m’excuserais bien pour ce retard, dit-[defiant_bishop.Custom('FR_IlElle')] avec un sourire en coin, mais je réponds à une autorité supérieure à celle d’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l]. »"
 pam_secular_faith_events.0007.a: "Agissons avec la dignité que mérite votre fonction."
 pam_secular_faith_events.0007.b: "Je vous en prie. Accomplissez simplement le rite."
 pam_secular_faith_events.0007.c: "Vous répondez peut-être [ROOT.Char.GetFaith.HighGodName2], mais c’est moi votre [Select_CString(ROOT.Char.IsFemale,'dame','seigneur')] lige. Dehors !"
 pam_secular_faith_events.0008.t: "Le poids du péché"
 pam_secular_faith_events.0008.desc: "Les bougies se consument, et la même pensée revient. Je suis [penance_sin.GetName( ROOT.Char )|l], et ma foi considère que c’est un péché.\n\nPeu importe le nombre de fois où je repousse cette pensée : la culpabilité demeure.\n\n« Disciplinez-vous, et votre âme sera libérée de son fardeau. » M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', confessor )] [confessor.GetFirstName] ne se met pas en colère et ne condamne pas non plus mes actes. « Suivez cette pénitence. Ne vous écartez pas du chemin. »"
 pam_secular_faith_events.0008.a: "Je vais suivre les conseils de [confessor.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0008.b: "Pas maintenant. Je ne suis pas prêt[ROOT.Char.Custom('FR_E')]."
 pam_secular_faith_events.0009.t: "[Select_CString(stranger.IsFemale,'Une étrangère','Un étranger')] à l’image du Christ"
 pam_secular_faith_events.0009.desc: "Devant mes portes se tient [Select_CString(stranger.IsFemale,'une étrangère','un étranger')] solitaire et balafré[stranger.Custom('FR_E')], les mains tendues pour quémander l’aumône.\n\n« Je vous en prie, je ne vous causerai aucun ennui, illustre [ROOT.Char.GetTitleAsNameNoTooltip] », dit-[stranger.Custom('FR_IlElle')] en s’inclinant gracieusement. « Si vos moyens le permettent, je vous demanderais une petite contribution. »\n\n[stranger.Custom('FR_IlElle')|U] est étonnamment éloquent[stranger.Custom('FR_E')] pour un mendiant[stranger.Custom('FR_E')]. On ne sait jamais qui l’on repousse ainsi."
 pam_secular_faith_events.0009.a: "Entrez donc. M[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')] vous accepte."
 pam_secular_faith_events.0009.b: "Prenez ce pain et partez en paix."
 pam_secular_faith_events.0010.t: "[stranger.Custom('FR_CeluiCelle')|U] qui venait du froid"
 pam_secular_faith_events.0010.desc_blessed: "[Select_CString(stranger.IsFemale,'La femme','L’homme')] que j’ai laissé[stranger.Custom('FR_E')] franchir mes portes n’est pas [Select_CString(stranger.IsFemale,'une simple vagabonde','un simple vagabond')] : [stranger.GetFirstName] parle des textes sacrés et de l’art de gouverner avec une telle aisance que même mes hommes les plus érudits préfèrent se taire et l’écouter.\n\nIl semble que [ROOT.Char.GetFaith.HighGodName] soit enfin arrivé à mes portes. Je ne [stranger.Custom('FR_LeLa')] laisserai pas repartir."
 pam_secular_faith_events.0010.desc_thief: "Je me réveille : le feu qui me réchauffait s’est éteint et le coffre est ouvert.\n\nLe gîte et le couvert ont été récompensés par la plus ancienne des trahisons.\n\n[stranger.GetFirstName] a disparu au milieu de la nuit avec mon argent.\n\nLorsque ma maisonnée se réveille enfin, [stranger.Custom('FR_IlElle')] est déjà parti[stranger.Custom('FR_E')] depuis longtemps."
 pam_secular_faith_events.0010.a: "Vous avez été envoyé[stranger.Custom('FR_E')] ici pour une raison bien précise."
 pam_secular_faith_events.0010.b: "J’ai invité un serpent à ma table."
 pam_secular_faith_events.0011.t: "Les pénitents"
 pam_secular_faith_events.0011.desc: "Ce n’est pas au son du tonnerre que je me réveille, mais au claquement des fouets.\n\nUn groupe de pénitents s’est rassemblé devant m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')], et, le dos nu et ensanglanté, ils proclament que [ROOT.Char.GetFaith.HighGodName] exige cette [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )|l].\n\nMa maisonnée se tourne vers moi, en quête de conseils."
 pam_secular_faith_events.0011.a: "Y a-t-il une vérité plus profonde derrière tout cela ?"
 pam_secular_faith_events.0011.b: "Donnez-moi un fouet – car moi aussi, j’ai péché."
 pam_secular_faith_events.0011.c: "Chassez ces fous de mes terres !"
 pam_secular_faith_events.0012.t: "Bénédiction des armes"
 pam_secular_faith_events.0012.desc: "La paix est toujours un prêt, jamais un cadeau.\n\nAu cours du banquet organisé en l’honneur [ROOT.Char.GetFaith.WarGodNamePossessive], m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] propose de bénir les armes de ma Maison.\n\n« Dieu, toi qui as donné à David la force de vaincre Goliath, accorde cette même force à la Maison [ROOT.Char.GetHouse.GetBaseName] – qu’elle se lève toujours pour défendre les faibles », prie-t-[chaplain.Custom('FR_IlElle')]."
 pam_secular_faith_events.0012.a: "Bénissez mes bannières et mes lames pour le jour où elles seront nécessaires."
 pam_secular_faith_events.0012.b: "Prions plutôt pour la paix."
 pam_secular_faith_events.0012.c: "Une bénédiction silencieuse suffira."
 pam_secular_faith_events.0013.t: "Une mort annoncée"
 pam_secular_faith_events.0013.desc: "[Select_CString(prophet.IsFemale,'Une prêcheuse','Un prêcheur')] aux yeux écarquillés est traîné[prophet.Custom('FR_E')] devant moi. On l’accuse d’inciter les foules à la révolte et de proférer des prophéties, et [prophet.Custom('FR_IlElle')] ne perd pas de temps : m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', doomed_soul )] [doomed_soul.Custom('FR_le_Char_Pi')][doomed_soul.GetTitledFirstName] voit déjà un doigt tremblant pointé vers [doomed_soul.Custom('FR_LuiElle')].\n\n« Retenez bien son visage ! », s’écrie-t-[prophet.Custom('FR_IlElle')]. « Avant la prochaine lune, [doomed_soul.Custom('FR_IlElle')] reposera froid dans la terre. L’heure exacte m’a été révélée par [ROOT.Char.GetFaith.HighGodName] ! »\n\nSa certitude inébranlable est inquiétante. La peur de [doomed_soul.GetFirstNameNoTooltip] l’est encore davantage."
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName|U] s’exprime par des bouches étranges..."
 pam_secular_faith_events.0013.b: "Va-t’en, espèce de [Select_CString(prophet.IsFemale,'folle','fou')] !"
 prophecy_foretold_tt: "Une prophétie a été prononcée. Et si elle était vraie ?"
 prophecy_foretold_2_tt: "Une prophétie a été prononcée. C’est complètement absurde !"
 pam_secular_faith_events.0014.t: "Jugement prophétique"
 pam_secular_faith_events.0014.desc_fulfilled: "Une nouvelle lune s’est écoulée et [doomed_soul.Custom('FR_le_Char_Pi')][doomed_soul.GetTitledFirstName] est mort[doomed_soul.Custom('FR_E')] – [doomed_soul.Custom('FR_IlElle')] s’est éteint[doomed_soul.Custom('FR_E')] paisiblement dans son sommeil.\n\n[Select_CString(prophet.IsFemale,'La prêcheuse','Le prêcheur')] en haillons avait indiqué l’heure exacte. Je ne peux pas l’oublier.\n\nÉtait-ce une prophétie... ou une crainte qui s’est réalisée ?"
 pam_secular_faith_events.0014.desc_failed: "Une nouvelle lune s’est écoulée, mais [doomed_soul.Custom('FR_le_Char_Pi')][doomed_soul.GetTitledFirstName] est toujours en vie. L’heure dont avait parlé [Select_CString(prophet.IsFemale,'la prêcheuse','le prêcheur')] en haillons est arrivée, et n’a emporté personne.\n\nC’est soit [Select_CString(prophet.IsFemale,'une impostrice','un imposteur')], soit un[prophet.Custom('FR_E')] imbécile, mais certainement pas la voix [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nJe me sens bête."
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U] est un[friend.Custom('FR_E')] véritable [Select_CString(friend.IsFemale,'prophétesse','prophète')]."
 pam_secular_faith_events.0014.b: "Les voies [ROOT.Char.GetFaith.HighGodNamePossessive] sont impénétrables."
 pam_secular_faith_events.0014.c: "Pourquoi ai-je donc cru à sa maudite prophétie ?!"
 pam_secular_faith_events.0014.d: "J’aurais dû croire à la prophétie..."
 pam_secular_faith_events.0014.e: "[Select_CString(prophet.IsFemale,'Cette prêcheuse','Ce prêcheur')] était donc bien [Select_CString(prophet.IsFemale,'une impostrice','un imposteur')] !"
 gains_religious_inspiration_tt: "[prophet.Custom('FR_le_Char_U_Pi')|U][prophet.GetShortUIName|U] a une [inspiration|El] religieuse"
 pam_secular_faith_events.0015.t: "L’icône qui pleure"
 pam_secular_faith_events.0015.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] me presse à entrer dans l’église de [miracle_church.GetNameNoTier]. À l’intérieur, les yeux peints d’un saint versent des larmes d’huile parfumée.\n\nLa nouvelle d’un miracle se propage plus vite que le ferait n’importe quel messager, et un miracle est à la fois puissant et dangereux."
 pam_secular_faith_events.0015.a: "Un miracle ? Il va falloir vérifier."
 pam_secular_faith_events.0015.b: "Que les fidèles viennent. Nous les accueillerons."
 pam_secular_faith_events.0015.c: "Cette bénédiction ne doit pas être partagée."
 pam_secular_faith_events.0015.d: "Mon pays est béni !"
 no_miracles_tt: "Ce miracle semble suspect..."
 pam_secular_faith_events.0016.t: "Acheter la chaire"
 pam_secular_faith_events.0016.desc_intro: "[Select_CString(candidate.IsFemale,'Une femme','Un homme')] entre dans m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')], non pas pour implorer une faveur, mais pour en acheter une.\n\n« Votre [old_realm_priest.GetCouncilTitle|l], [old_realm_priest.GetFirstName], est un bon pasteur », murmure-t-[candidate.Custom('FR_IlElle')] en laissant tomber une bourse bien remplie sur la table. « Cependant, je me montrerais... plus reconnaissant[candidate.Custom('FR_E')]. Nommez-moi à sa place et recevez la bénédiction [ROOT.Char.GetFaith.WealthGodNamePossessive]. »"
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nIl n’y a pas de honte à la [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )|l], et l’argent est une bonne chose."
 pam_secular_faith_events.0016.desc_sinful: "\n\nLa [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )|l] est un péché. Accepter cet or noircirait mon âme."
 pam_secular_faith_events.0016.a: "L’or pèse plus que n’importe quel péché..."
 pam_secular_faith_events.0016.b: "Un juste prix, payé comme il se doit. La charge est à vous."
 pam_secular_faith_events.0016.c: "Cet office n’est pas à vendre."
 pam_secular_faith_events.0017.t: "Un[accused.Custom('FR_E')] hérétique [ROOT.Char.Custom('FR_GetCourt_Au')]"
 pam_secular_faith_events.0017.desc: "« Hérétique ! » M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] pointe [accused.GetFirstName] du doigt d’un air accusateur. « Ne voyez-vous pas la vile influence [accused.GetRite.GetAdjective|l] sur votre [ROOT.Char.Custom('GetCourt')] ? [accused.Custom('FR_IlElle')|U] doit se repentir et reconnaître [ROOT.Char.GetFaith.HighGodName] ! »\n\n[accused.GetFirstNameNoTooltip] ne laisse rien paraître, bien que cette accusation [accused.Custom('FR_LeLa')] blesse certainement."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], laissez-moi vous guider vers la foi."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip] se convertit"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName] reste inflexible"
 pam_secular_faith_events.0017.b: "Alors, repentez-vous dans une cellule. Arrêtez-[accused.Custom('FR_LeLa')]."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip] est sous ma protection. Ça suffit."
 pam_secular_faith_events.0018.t: "Un[pious_child.Custom('FR_E')] enfant pour Dieu"
 pam_secular_faith_events.0018.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', pious_child )] [pious_child.GetFirstName] est différent[pious_child.Custom('FR_E')] des autres enfants. Alors que les autres jouent, [pious_child.Custom('FR_IlElle')] passe ses journées à la chapelle.\n\n« Je n’ai jamais vu un enfant comme [pious_child.Custom('FR_LuiElle')] », dit m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] à voix basse. « [pious_child.Custom('FR_IlElle')|U] passe des heures à prier et pleure pendant la messe. Pour moi, c’est tout à fait clair : [pious_child.GetFirstNameNoTooltip] souhaite mener une vie de [GetTrait('devoted').GetName( pious_child )|l]e. »"
 pam_secular_faith_events.0018.a: "Servez [ROOT.Char.GetFaith.HighGodName], mais restez ici."
 pam_secular_faith_events.0018.b: "L’église aura [Select_CString(pious_child.IsFemale,'ma fille','mon fils')]."
 pam_secular_faith_events.0018.c: "Non, [pious_child.Custom('FR_IlElle')] fait partie de la Maison [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0019.t: "Paix de Dieu"
 pam_secular_faith_events.0019.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] est [Select_CString(chaplain.IsFemale,'porteuse','porteur')] d’une grave nouvelle.\n\n« Un frère ne doit pas tuer un autre frère sous le regard [ROOT.Char.GetFaith.HighGodNamePossessive] », explique-t-[chaplain.Custom('FR_IlElle')]. « [feud_attacker.Custom('FR_le_Char_Pi')|U][feud_attacker.GetTitledFirstName] et [feud_defender.Custom('FR_le_Char_Pi')][feud_defender.GetTitledFirstName] ont croisé le fer, et ce sont les gens du peuple qui paient de leur sang leur querelle ! »\n\n« Mettez fin à cela. Rappelez-leur la [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )]. »"
 pam_secular_faith_events.0019.a: "Au nom [ROOT.Char.GetFaith.HighGodNamePossessive], la paix régnera."
 pam_secular_faith_events.0019.b: "Tout seigneur qui aura dégainé son épée devra en répondre."
 pam_secular_faith_events.0019.c: "Je suis [Select_CString(ROOT.Char.IsFemale,'la seule','le seul')] à statuer sur les différends entre mes vassaux."
 pam_sf_peace_of_god_ends_wars_tt: "Chaque [war|El] entre vos [vassals|El] se termine par une [white_peace|El]"
 pam_secular_faith_events.0020.t: "[ROOT.Char.GetFaith.HouseOfWorship|U] de [temple_location.GetNameNoTooltip]"
 pam_secular_faith_events.0020.desc: "Les tailleurs de pierre posent la dernière pierre sur [ROOT.Char.GetFaith.HouseOfWorship], le premier édifice du genre que j’aie jamais construit, ici, dans [temple_location.Custom('TerrainTypeProvince')] de [temple_location.GetName].\n\nM[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] arpente le site, un encensoir à la main.\n\n« On se souviendra de vous pour les lieux de culte que vous avez consacrés [ROOT.Char.GetFaith.HighGodName2] », dit-[chaplain.Custom('FR_IlElle')]. « Puisse celui-ci être le premier d’une longue série. »"
 pam_secular_faith_events.0020.a: "Guidez-nous dans la prière, [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0020.b: "Que [consecrated_county.GetNameNoTierNoTooltip] prospère autour [ROOT.Char.GetFaith.HouseOfWorship3]."
 pam_secular_faith_events.0020.c: "Entre ces murs, je m’efforcerai d’acquérir la sagesse."
 pam_secular_faith_events.0020.d: "Je ne fais que commencer à œuvrer pour [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0021.t: "Un signe céleste"
 pam_secular_faith_events.0021.desc: "Le sommeil ne vient pas. Je me réfugie dans le silence et l’obscurité régnant dans [ROOT.Char.Custom('FR_GetCourtyard_Le')] et contemple le ciel. En cette soirée, le ciel m’offre un signe : [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nDe tels signes ne sont jamais dénués de sens."
 pam_omen_blood_moon: "une lune rougie"
 pam_omen_star_host: "une multitude d’étoiles là où il ne devrait pas y en avoir"
 pam_omen_comet: "une comète à double queue"
 pam_omen_falling_stars: "une pluie d’étoiles tombant du ciel"
 pam_omen_moon_halo: "un anneau de lumière blafarde autour de la Lune"
 pam_omen_eclipse: "une lune qui s’est assombrie pour ne plus former qu’un croissant couleur cuivre"
 pam_omen_wandering_star: "une étoile errante brillante"
 pam_secular_faith_events.0021.a: "Je vais enquêter sur ce présage."
 pam_secular_faith_events.0021.b: "La faveur [ROOT.Char.GetFaith.HighGodNamePossessive] transparaît à travers ce signe."
 pam_secular_faith_events.0021.c: "Un tel signe annonce des conquêtes !"
 pam_secular_faith_events.0021.d: "Les cieux ne me doivent aucune réponse."
 pam_secular_faith_events.0022.t: "Le toucher [ROOT.Char.Custom('FR_du_Char_L')][ROOT.Char.GetTitleAsNameNoTooltip]"
 pam_secular_faith_events.0022.desc_intro: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', sick_courtier )] [sick_courtier.GetFirstName] s’approche de moi, pâle et tremblant[sick_courtier.Custom('FR_E')].\n\n"
 pam_secular_faith_events.0022.desc_ill: "« Je dépéris, [ROOT.Char.Custom('FormOfAddressForLiege')]. L’épouvantable [illness_trait.GetName( GetNullCharacter )|l] qui m’accable n’a aucun remède. Même le médecin, [physician.Custom('FR_le_Char_Pi')][physician.GetTitledFirstName], ne sait pas ce qui m’arrive ! » se lamente-t-[sick_courtier.Custom('FR_IlElle')].\n\n"
 pam_secular_faith_events.0022.desc_other: "« Je dépéris. L’épouvantable [illness_trait.GetName|l] qui m’accable n’a aucun remède. Même [physician.Custom('FR_le_Char_Pi')][physician.GetTitledFirstName] ne sait pas ce qui m’arrive ! », se lamente-t-[sick_courtier.Custom('FR_IlElle')].\n\n"
 pam_secular_faith_events.0022.desc_end: "« On dit qu’une main couronnée porte en elle la grâce [ROOT.Char.GetFaith.HighGodNamePossessive]. C’est le dernier espoir qui me reste. »"
 pam_secular_faith_events.0022.a: "Venez. Laissez-moi poser mes mains sur vous."
 pam_secular_faith_events.0022.b: "Non... Je vous bénirai d’ici."
 pam_sf_kings_touch_gamble_tt: "Mon contact pourrait permettre à [sick_courtier.GetFirstName] de se remettre de la maladie. Ou alors, la maladie pourrait me contaminer..."
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName] se lève de son lit de malade"
 pam_sf_kings_touch_infected_toast: "À mon tour, la maladie me gagne"
 pam_sf_kings_touch_nothing_toast: "Mon contact ne change rien pour [sick_courtier.GetFirstName]"
 pam_secular_faith_events.0023.t: "[Select_CString(scholar.IsFemale,'Une scribe itinérante','Un scribe itinérant')]"
 pam_secular_faith_events.0023.desc: "On m’amène [Select_CString(scholar.IsFemale,'une femme émaciée','un homme émacié')], les doigts tachés d’encre et des rouleaux de parchemin sous le bras.\n\n« Je m’appelle [scholar.GetFirstName], je suis scribe et érudit[scholar.Custom('FR_E')] », dit-[scholar.Custom('FR_IlElle')]. « Je n’ai ni domicile ni protecteur. Ces mains ne sont pas faites pour le travail, mais pour consigner les mots d’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] sur [ROOT.Char.Custom('GetWritingMaterial')]. »\n\n« Je vous en supplie : accordez-moi le gîte et le couvert, et je vous servirai fidèlement. »"
 pam_secular_faith_events.0023.a: "[Select_CString(scholar.IsFemale,'Une érudite','Un érudit')] ? Apprenez-moi ce que vous savez."
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip] a besoin de vous."
 pam_secular_faith_events.0023.c: "Mes livres de comptes nécessitent une main sûre."
 pam_secular_faith_events.0023.d: "Je n’ai pas besoin de vous. Partez."
 pam_secular_faith_events.0024.t: "Au monastère"
 pam_secular_faith_events.0024.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', rival_character )] [rival_character.GetFirstName] est, comme toujours, [Select_CString(rival_character.IsFemale,'une maladroite','un maladroit')] et un[rival_character.Custom('FR_E')] [rival_character.Custom2('InsultNoun', ROOT.Char)] [rival_character.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom('FR_GetCourt_Au')]. Cependant, mon humeur s’améliore grâce à une lettre [archbishop.Custom('FR_du_Char_Pi')][archbishop.GetTitledFirstName] de [archdiocese.GetName].\n\n« [rival_character.GetFirstName] pourrait servir [ROOT.Char.GetFaith.HighGodName] », écrit-[archbishop.Custom('FR_IlElle')]. « Le monastère l’accueillerait avec joie. »\n\nLe monde oublie très vite ceux qui s’y agenouillent."
 pam_secular_faith_events.0024.a: "Et voilà un[rival_character.Custom('FR_E')] autre « volontaire » pour servir [ROOT.Char.GetFaith.HighGodName] !"
 pam_secular_faith_events.0024.b: "Je préfère garder un œil sur mon ennemi[rival_character.Custom('FR_E')]."
 pam_secular_faith_events.0025.t: "[Select_CString(ROOT.Char.IsFemale,'Marraine','Parrain')]"
 pam_secular_faith_events.0025.desc: "« Je souhaite adhérer à la foi [ROOT.Char.GetFaith.GetAdjective], de corps et d’âme », déclare solennellement m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', converting_char )] [converting_char.GetFirstName]. « Je souhaite être baptisé[converting_char.Custom('FR_E')] selon le rite [ROOT.Char.GetRite.GetAdherentName]... et je vous demande d’être à mes côtés, en tant que [Select_CString(ROOT.Char.IsFemale,'marraine','parrain')], près des fonts baptismaux. »"
 pam_secular_faith_events.0025.a: "Alors, que tout le monde découvre notre nouveau lien !"
 pam_secular_faith_events.0025.b: "La foi n’a pas besoin d’un grand spectacle."
 pam_secular_faith_events.0025.c: "Je ne peux pas accepter cet honneur."
 pam_secular_faith_events.0026.t: "Une âme tourmentée"
 pam_secular_faith_events.0026.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', afflicted )] [afflicted.GetFirstName] n’a jamais eu toute sa tête... mais désormais, [afflicted.Custom('FR_IlElle')] n’est même plus [afflicted.Custom('FR_LuiElle')]-même.\n\n« [ROOT.Char.GetFaith.EvilGodNames|U] est en moi ! » hurle-t-[afflicted.Custom('FR_IlElle')] en se tordant de douleur sur le sol [ROOT.Char.GetFaith.HouseOfWorship3].\n\nM[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] pâlit. « [ROOT.Char.Custom('FormOfAddressForLiege')|U], je crains que son âme ne soit tourmentée par des démons. La seule façon de l’aider est de procéder à un exorcisme. »"
 pam_secular_faith_events.0026.a: "[afflicted.Custom('FR_IlElle')|U] a besoin d’une aide adaptée."
 pam_secular_faith_events.0026.b: "C’est moi-même qui vais procéder à l’exorcisme."
 pam_secular_faith_events.0026.c: "C’est une mission sacrée. C’est à vous de vous en occuper."
 pam_secular_faith_events.0026.d: "Débarrassez-vous d[afflicted.Custom('FR_EluiElle')] avant que la panique ne se propage !"
 pam_sf_exorcism_success_toast: "L’exorcisme porte ses fruits"
 pam_sf_exorcism_failed_toast: "L’exorcisme a échoué"
 pam_secular_faith_events.0027.t: "Crise spirituelle"
 pam_secular_faith_events.0027.desc: "« M’entendez-vous, [ROOT.Char.GetFaith.HighGodName] ? », murmuré-je. Mais au fond de moi, je sais que la Puissance suprême n’écoute pas les pécheurs comme moi.\n\nAi-je mal interprété Sa volonté ? Le principe appelé [old_tenet.GetName( ROOT.Char.GetRite )] n’est-il pas la véritable expression de sa Sagesse ?\n\nLa lumière se pose sur le crucifix, et l’espoir renaît en moi."
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName|U] exige le principe [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )] !"
 pam_secular_faith_events.0027.b: "Peut-être... le principe [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )] ?"
 pam_secular_faith_events.0027.c: "Je suis condamné[ROOT.Char.Custom('FR_E')]. Et tout le monde le sera aussi..."
 pam_secular_faith_events.0028.t: "Mon âme en paix"
 pam_secular_faith_events.0028.desc: "Je m’agenouille dans [ROOT.Char.GetFaith.HouseOfWorship] et la présence [ROOT.Char.GetFaith.HighGodNamePossessive] imprègne chaque fibre de mon être.\n\nHonorer le principe appelé [old_tenet.GetName( ROOT.Char.GetRite )] m’a révélé la vérité. Je n’ai jamais connu une telle paix. Comment pourrais-je garder une telle joie pour moi seul[ROOT.Char.Custom('FR_E')] ? Ne devrais-je pas permettre aux autres de faire l’expérience de cette même lumière afin que la vérité leur soit révélée ?"
 pam_secular_faith_events.0028.a: "Je trouverai une oreille attentive."
 pam_secular_faith_events.0028.b: "Mais ma véritable passion est ce principe appelé [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )] !"
 pam_secular_faith_events.0028.c: "Je devrais coucher mes sentiments sur [ROOT.Char.Custom('GetWritingMaterial')]."
 pam_secular_faith_events.0029.t: "Une visite venue du royaume des morts"
 pam_secular_faith_events.0029.desc: "« Réveillez-vous, [ROOT.Char.GetFirstNameNoTooltip] », dit une voix familière. « Je suis là, m[departed.Custom2( 'FR_RelationToMeShort_OnA', root_scope )]... en cette période difficile. »\n\nJe me réveille, le front baigné de sueur. L’apparition vacille brièvement avant de disparaître.\n\nÉtait-ce... m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', departed )] ?"
 pam_secular_faith_events.0029.a: "[departed.Custom('FR_IlElle')|U] est en sécurité et veille désormais sur moi."
 pam_secular_faith_events.0029.b: "Était-ce... un avertissement ?"
 pam_secular_faith_events.0029.c: "Mes sens m’ont joué des tours. Rien de plus."
 pam_secular_faith_events.0030.t: "L’anachorète"
 pam_secular_faith_events.0030.desc: "« Je souhaite me rapprocher [ROOT.Char.GetFaith.HighGodNamePossessive] », déclare solennellement m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', would_be_anchorite )] [would_be_anchorite.GetFirstName]. « Le monde regorge de distractions, tandis que je n’aspire qu’à une solitude totale. »\n\n[would_be_anchorite.Custom('FR_IlElle')|U] contemple le mur de m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')] et le caresse doucement du bout des doigts.\n\n« [ROOT.Char.GetFaith.HouseOfWorship|U] de [church_scope.GetName] est magnifique. Je voudrais y être emmuré[would_be_anchorite.Custom('FR_E')] et passer le reste de ma vie en prière ininterrompue. »"
 pam_secular_faith_events.0030.a: "Si tel est votre souhait, mes maçons se tiennent à votre disposition."
 pam_secular_faith_events.0030.b: "Non, je ne vous accorderai pas cela."
 pam_secular_faith_events.0031.t: "Une controverse entre érudits"
 pam_secular_faith_events.0031.desc: "« Comment peut-on remettre en cause le caractère sacré du principe [tenet_1.GetBaseName] ? », s’exclame m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', disputant_one )] [disputant_one.GetFirstName].\n\n« C’est absurde ! Il est tout à fait évident que c’est le principe [tenet_2.GetBaseName] qui vous rapproche du Divin ! N’avez-vous donc rien appris ? », rétorque mon [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )] [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.a: "Un débat entre érudits ? Laissez-moi prendre des notes..."
 pam_secular_faith_events.0031.b: "Je suis attiré[ROOT.Char.Custom('FR_E')] par le principe appelé [tenet_1.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0031.c: "Le principe [tenet_2.GetBaseNameNoTooltip] semble pertinent."
 pam_secular_faith_events.0031.d: "Si notre [ROOT.Char.Custom('GetCourt')] est dynamique, c’est aussi grâce au savoir."
 pam_secular_faith_events.0032.t: "L’heure de la tentation"
 pam_secular_faith_events.0032.desc_food: "Je me réveille, et mon oreiller est humide de salive. Des cuisines émane une odeur [ROOT.Char.Custom('RegionalEdibleMeat')], tandis que le tintement des verres [ROOT.Char.Custom('RegionalDrink')] et des voix joyeuses résonnent dans les [ROOT.Char.Custom('ResidenceBuildingHallsType')].\n\nMe sachant [vice_trait.GetName( GetNullCharacter )|l][ROOT.Char.Custom('FR_E')], les [ROOT.Char.GetFaith.PriestNeuterPlural] m’ont ordonné de jeûner... mais pourquoi serais-je ainsi mis[ROOT.Char.Custom('FR_E')] à l’épreuve par [ROOT.Char.GetFaith.HighGodName] ce soir précisément ?\n\nJe sens ma résolution s’effriter à mesure que mon estomac gargouille de plus en plus fort."
 pam_secular_faith_events.0032.a: "Mes envies sont justifiées par [ROOT.Char.GetFaith.HighGodName] !"
 pam_secular_faith_events.0032.b: "Non. Le jeûne se poursuit, et je vais m’y employer."
 pam_secular_faith_events.0032.c: "Une petite bouchée... Qui pourrait bien s’en apercevoir ?"
 pam_secular_faith_events.0033.t: "Sermons sur l’oreiller"
 pam_secular_faith_events.0033.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', believing_spouse )] [believing_spouse.GetFirstName] adhère au rite [believing_spouse.GetRite.GetAdherentName], dont [believing_spouse.Custom('FR_IlElle')] me chuchote joyeusement les enseignements la nuit.\n\n« Saviez-vous que [new_tenet.Custom('GetGenericTenetSentence')|l] ? N’est-ce pas fascinant ? », demande-t-[believing_spouse.Custom('FR_IlElle')] en me serrant dans ses bras.\n\nSa passion est aussi charmante que son sourire."
 pam_secular_faith_events.0033.a: "Dites-m’en plus..."
 pam_secular_faith_events.0033.b: "C’est vous qui êtes fascinant[believing_spouse.Custom('FR_E')] ! Venez par ici."
 pam_secular_faith_events.0033.c: "S’il vous plaît, mon amour, je dois dormir."
 pam_secular_faith_events.0034.t: "L’enfant trouvé[foundling.Custom('FR_E')]"
 pam_secular_faith_events.0034.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] n’est pas du genre à arriver en retard. Le silence dans [ROOT.Char.GetFaith.HouseOfWorship] est rompu par les sanglots discrets d’un enfant.\n\n« J’implore la miséricorde [ROOT.Char.GetFaith.HighGodNamePossessive]... », murmure [chaplain.GetFirstNameNoTooltip] en berçant doucement l’enfant dans ses bras. « [foundling.Custom('FR_IlElle')|U] a été abandonné[foundling.Custom('FR_E')] car [trait_scope.GetName( GetNullCharacter )|l]... Personne ne mérite un tel sort. »\n\nLes petits doigts de l’enfant s’agrippent à son pouce."
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName|U] m’a donné [Select_CString(foundling.IsFemale,'une fille','un fils')]."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip] va l’accueillir."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip] élèvera l’enfant."
 pam_secular_faith_events.0034.d: "Je me moque de ce qui arrive à cet enfant."
 pam_secular_faith_events.0035.t: "La mortification"
 pam_secular_faith_events.0035.desc: "Il y a du sang sur le sol. Alors que je suis le bruit des coups de fouet, je vois m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', sufferer )] [sufferer.GetFirstName]. [sufferer.Custom('FR_IlElle')|U] tient un fouet ensanglanté entre ses mains, et des larmes coulent sur ses joues.\n\n« Mon insatiable [sinful_trait.GetName( GetNullCharacter )|l] menace de m’engloutir », sanglote-t-[sufferer.Custom('FR_IlElle')]. « La brûlure du fouet vaut bien mieux que le feu de la tentation.\n\nCette douleur finira par cesser, contrairement au châtiment dans [ROOT.Char.GetFaith.NegativeAfterLife]. »"
 pam_secular_faith_events.0035.a: "Fascinant... Donnez-moi le fouet."
 pam_secular_faith_events.0035.b: "Qu’[sufferer.Custom('FR_IlElle')] se flagelle."
 pam_secular_faith_events.0035.c: "Pour l’amour [ROOT.Char.GetFaith.HighGodNamePossessive], mettez fin à cette folie."
 pam_sf_scourge_abandoned_toast: "Fouet abandonné"
 pam_secular_faith_events.0036.t: "La sagesse de l’anachorète"
 pam_secular_faith_events.0036.desc: "[Select_CString(hermit.IsFemale,'Une femme','Un homme')] en haillons demande audience et prétend être un[hermit.Custom('FR_E')] ermite venu[hermit.Custom('FR_E')] des contrées lointaines de [hermit_location.GetName].\n\n« Depuis sept nuits, [ROOT.Char.GetFaith.HighGodName] m’empêche de dormir », dit-[hermit.Custom('FR_IlElle')] d’un ton grave. « Non pas pour me punir, mais simplement pour remplir mes pensées de vérités destinées à d’autres. À vous. »\n\n« Écoutez mes paroles et prenez-les à cœur. Après quoi, je retournerai à ma solitude. »"
 pam_secular_faith_events.0036.a: "Quels secrets pouvez-vous révéler ?"
 pam_secular_faith_events.0036.b: "Je suis disposé[ROOT.Char.Custom('FR_E')] à apprendre quelque chose."
 pam_secular_faith_events.0036.c: "Hors de ma vue, mendiant[hermit.Custom('FR_E')] !"
 pam_secular_faith_events.0037.t: "Révélation charnelle"
 pam_secular_faith_events.0037.desc_wanderer: "Les verres [ROOT.Char.Custom('RegionalAlcoholicDrink')] se remplissent encore à cette heure tardive, et [Select_CString(reveler.IsFemale,'une vagabonde','un vagabond')] de passage, qui s’appelle [reveler.GetFirstName], se penche vers moi."
 pam_secular_faith_events.0037.desc_normal: "Les verres [ROOT.Char.Custom('RegionalAlcoholicDrink')] se remplissent encore à cette heure tardive, et mon [ROOT.Char.Custom2( 'RelationToMeShort', reveler )] [reveler.GetFirstName] se penche vers moi."
 pam_secular_faith_events.0037.desc: "Très vite, plus rien ne retient mon attention, si ce n’est s[reveler.Custom('ObjectifiedFeature')].\n\n« Il y a des prières que l’on prononce avec la langue », dit-[reveler.Custom('FR_IlElle')] en se débarrassant lentement de s[reveler.Custom('GetClothingArticle')]. « Et il y a des prières que l’on prononce avec la chair. Laissez-moi vous montrer l’art charnel appelé [reveler.Custom('pam_sf_carnal_art')], ô [Select_CString(ROOT.Char.IsFemale,'femme','homme')] magnifique. »\n\n[reveler.Custom('FR_IlElle')|U] me tend la main. « L’extase que vous allez connaître ressemble à celle qui nous est promise dans [ROOT.Char.GetFaith.PositiveAfterLife]. »"
 pam_secular_faith_events.0037.a: "Montrez-moi. Verrouillez la porte derrière vous."
 pam_secular_faith_events.0037.b: "Couvrez-vous."
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "le serpent qui s’enroule"
 pam_sf_carnal_art_2: "le courant ascendant"
 pam_sf_carnal_art_3: "les lianes enlacées"
 pam_sf_carnal_art_4: "l’étreinte serrée"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "le bambou fendu"
 pam_sf_carnal_art_6: "le tour de la jument"
 pam_sf_carnal_art_7: "l’éclosion du lotus"
 pam_sf_carnal_art_8: "l’épouse d’Indra"
 pam_sf_carnal_art_9: "le cobra dressé"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "le nœud des amants"
 pam_sf_carnal_art_11: "la rose et l’épine"
 pam_sf_carnal_art_12: "le secret du troubadour"
 pam_sf_carnal_art_13: "la flamme en coupe"
 pam_secular_faith_events.0038.t: "Un avant-goût du paradis"
 pam_secular_faith_events.0038.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', reveler )], [reveler.GetFirstName], remplit une nouvelle assiette de [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')] et me sourit depuis l’autre bout de la table.\n\n« Vous cherchez à rencontrer [ROOT.Char.GetFaith.HighGodName] avec l’estomac qui gargouille et la coupe vide. Je le trouve dans les fruits mûrs, la viande tendre, les rires et les chants », dit-[reveler.Custom('FR_IlElle')] en levant une coupe débordante.\n\n« Les dons [ROOT.Char.GetFaith.HighGodNamePossessive] sont faits pour être savourés, [ROOT.Char.Custom('FormOfAddressForLiege')]. Gaspiller ce qui nous a été donné ? Eh bien, c’est un péché atroce ! »"
 pam_secular_faith_events.0038.a: "Peut-être est-ce dans la coupe que se trouve la sainteté..."
 pam_secular_faith_events.0038.b: "Alors je vais organiser un festin en Son honneur."
 pam_secular_faith_events.0038.c: "La décadence déguisée en dévotion !"
 pam_secular_faith_events.0039.t: "Une prière dans l’obscurité"
 pam_secular_faith_events.0039.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', spymaster_scope )], [spymaster_scope.GetFirstName], vient me voir, toujours troublé[spymaster_scope.Custom('FR_E')] par les conséquences de sa ruse.\n\n« Je me suis agenouillé[spymaster_scope.Custom('FR_E')] aux côtés [secret_keeper.Custom('FR_du_Char_Pi')][secret_keeper.GetTitledFirstName] pour prier, [ROOT.Char.Custom('FormOfAddressForLiege')], et j’ai menti – un petit et pieux mensonge, murmuré pour [secret_keeper.Custom('FR_LeLa')] faire parler. »\n\n« [secret_keeper.Custom('FR_IlElle')|U] a avoué [secret_keeper.Custom('GetSecretCrimeConfessionIndef')] dans la maison [ROOT.Char.GetFaith.HighGodNamePossessive] », dit-[spymaster_scope.Custom('FR_IlElle')] en baissant la voix. « J’ai parlé de [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )|l]... Peut-être que cette supercherie est un devoir que nous devons [ROOT.Char.GetFaith.HighGodName2] ? »"
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName|U] agit dans l’ombre."
 pam_secular_faith_events.0039.b: "Une ruse regrettable... Dites-moi simplement le secret."
 pam_secular_faith_events.0040.t: "La chair des croyants"
 pam_secular_faith_events.0040.desc: "Pendant le dîner, m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', scholar )], [scholar.GetFirstName], ouvre un gros livre usé. Un nouveau sermon commence.\n\n« Les [Glossary( 'Issédons', 'ISSEDONES_GLOSS' )] n’enterrent pas leurs morts, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ils en font un festin ! » dit-[scholar.Custom('FR_IlElle')] sans reprendre son souffle. « La chair d’un père mélangée à celle d’un mouton, son crâne orné et vénéré comme une sainte relique. Pour eux, c’était là l’amour le plus sincère qu’un enfant puisse manifester. »\n\n« Et le meilleur dans tout ça ? » dit-[scholar.Custom('FR_IlElle')] en souriant. « Hérodote lui-même ne les considérait ni comme mauvais ni comme fous. \"#EMP La coutume règne en maître sur tout#!\", disait-il. »"
 pam_secular_faith_events.0040.a: "Oh, je sais tout ça."
 pam_secular_faith_events.0040.b: "Une coutume macabre... Racontez-m’en davantage."
 pam_secular_faith_events.0040.c: "Par [ROOT.Char.GetFaith.HighGodName] ! J’essaie de manger, là !"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "L’historien grec Hérodote a décrit un peuple vivant dans les lointaines steppes du nord. Lorsque le père d’un homme mourait, ses proches sacrifiaient du bétail et mélangeaient la viande à celle du défunt, pour ensuite la consommer lors d’un festin funéraire solennel. Le crâne était dépouillé de sa chair, nettoyé et orné, puis conservé comme une sainte relique que l’on honorait par un sacrifice annuel. Hérodote a mis ces rites en parallèle avec la crémation grecque – non pas pour les condamner, mais pour montrer que « la coutume règne en maître sur tout » et que chaque peuple considère ses propres coutumes comme les plus vertueuses."
 pam_secular_faith_events.0041.t: "La vérité toute nue"
 pam_secular_faith_events.0041.desc: "Alors que je me promène dans mes jardins, j’aperçois [Select_CString(adamite.IsFemale,'une étrangère','un étranger')] parmi les [ROOT.Char.GetCapitalLocation.Custom('FR_get_region_flower_type_plural_Fix')], qui cueille les fruits de mes [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')]s – nu[adamite.Custom('FR_E')], et dont le seul vêtement est constitué des feuilles qui tombent.\n\n« Oh, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ! Pourquoi vous cachez-vous derrière des vêtements et une couronne ? », demande-t-[adamite.Custom('FR_IlElle')] sans aucune pudeur devant [ROOT.Char.GetFaith.HighGodName] et moi. « Je m’abandonne entièrement à l’innocence originelle, lorsque nous vivions encore nus et courageux. »\n\n[adamite.Custom('FR_IlElle')|U] croque dans un autre fruit, et le jus coule le long de sa peau. « Peut-être devriez-vous en faire autant. »"
 pam_secular_faith_events.0041.a: "Moi aussi, j’aspire à cette liberté."
 pam_secular_faith_events.0041.b: "Mangez mes fruits, racontez votre histoire, puis partez."
 pam_secular_faith_events.0041.c: "Enfermer l’intrus[adamite.Custom('FR_E')]"
 pam_secular_faith_events.0042.t: "Pèlerinage facilité"
 pam_secular_faith_events.0042.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', sponsor_character )], [sponsor_character.GetFirstName], vient à ma rencontre dans le jardin, la bourse ouverte et un sourire chaleureux aux lèvres.\n\n« Laissez-moi prendre en charge les frais de votre [GetActivityType( 'activity_pilgrimage').GetName|l], [ROOT.Char.Custom('FormOfAddressForLiege')]. Il ne convient guère sur la route du pèlerin de compter ses deniers – partez l’esprit tranquille et priez pour nous deux. »\n\nL’argent est bien réel. Tout comme la confiance qui l’accompagne."
 pam_secular_faith_events.0042.a: "Je parcourrai ce chemin avec de la gratitude."
 pam_secular_faith_events.0042.b: "Je vais prendre cet argent et le garder."
 pam_secular_faith_events.0042.c: "Gardez votre argent, [Select_CString(sponsor_character.IsFemale,'chère amie','cher ami')]."
 pam_sf_pilgrimage_sponsor_tt: "Si vous achevez un [GetActivityType( 'activity_pilgrimage').GetName|l] d’ici #V 7#! ans, [sponsor_character.GetFirstName] gagnera #P 50#! d’opinion à votre égard"
 pam_sf_pilgrimage_sponsor_toast: "Mécène ravi"
 pam_secular_faith_events.0043.t: "Accueil d’un pèlerin"
 pam_secular_faith_events.0043.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', holy_man )], [holy_man.GetFirstName], me prend la main devant l’autel.\n\n« Empruntez le chemin du pèlerinage, [ROOT.Char.Custom('FormOfAddressForLiege')]. Dès votre retour, je proclamerai votre [GetActivityType( 'activity_pilgrimage').GetName|l] sur chaque place de [capital_county.GetNameNoTier]. Votre peuple saura que leur [ROOT.Char.GetTitleAsNameNoTooltip|l] s’est agenouillé[ROOT.Char.Custom('FR_E')] pour lui. »"
 pam_secular_faith_events.0043.a: "Alors, je partirai en pèlerinage."
 pam_secular_faith_events.0043.b: "J’ai des choses plus terre-à-terre dont je dois m’occuper."
 pam_sf_extolled_pilgrimage_toast: "Les gens se réjouissent"
 pam_secular_faith_events.0044.t: "L’oreille du clergé"
 pam_secular_faith_events.0044.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', friendly_bishop )] [friendly_bishop.GetFirstName] arrive chez moi dans une humeur étonnamment bonne.\n\n« Ces derniers temps, j’ai gagné les faveurs de mes pairs : évêques, abbés – ceux dont la voix porte au sein de l’Église. Si jamais vous avez besoin de leur pieuse sagesse ou de leur autorité morale, je peux intercéder en votre faveur. »\n\nLe crédit dont jouit [friendly_bishop.GetFirstNameNoTooltip] auprès de ces [ROOT.Char.GetFaith.PriestNeuterPlural] avides de pouvoir n’est pas inépuisable."
 pam_secular_faith_events.0044.a: "Alors, intercédez en ma faveur."
 pam_secular_faith_events.0044.b: "Votre amitié est une bénédiction en soi."
 pam_secular_faith_events.0045.t: "Illumination"
 pam_secular_faith_events.0045.desc: "Elle frappe comme un coup de foudre en plein ciel serein : la clarté.\n\nDoctrine. Principes. Rites. Foi. Ce qui semblait autrefois n’être que des milliers de pensées éparses se cristallise désormais devant moi en une seule et même vérité."
 pam_secular_faith_events.0045.a: "L’avenir m’appelle à assumer un rôle de dirigeant[ROOT.Char.Custom('FR_E')]."
 pam_secular_faith_events.0045.b: "Je vais savourer ce moment."
 pam_secular_faith_events.0046.t: "Conviction commune"
 pam_secular_faith_events.0046.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', intimate )] [intimate.GetFirstName] ne peut cacher sa conviction lorsqu’[intimate.Custom('FR_IlElle')] évoque le principe de [shared_tenet.GetName( intimate.GetRite )|l].\n\n« Cela donne un sens à tout ce que je fais », dit-[intimate.Custom('FR_IlElle')]. « Une seule chose compte autant à mes yeux... Vous, qui êtes si [Select_CString(ROOT.Char.IsFemale,'chère','cher')] à mon cœur. »\n\nUne larme coule sur sa joue. « Je voulais simplement vous le faire savoir. »"
 pam_secular_faith_events.0046.a: "Que cette conviction commune renforce nos liens !"
 pam_secular_faith_events.0046.b: "Partager cette conviction... est comme l’amour."
 pam_secular_faith_events.0046.c: "Merci pour votre franchise."
 pam_secular_faith_events.0047.t: "Dévouement spirituel"
 pam_secular_faith_events.0047.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] fait le signe de croix et incline la tête.\n\n« [ROOT.Char.GetFaith.HighGodName|U] a placé la couronne sur votre tête pour une raison bien précise. En vous servant fidèlement, je me mets au service de Sa volonté », explique-t-[chaplain.Custom('FR_IlElle')].\n\n« J’ai prêté serment d’allégeance [ROOT.Char.GetFaith.HighGodName2] et voudrais faire de même vis-à-vis de vous. »"
 pam_secular_faith_events.0047.a: "Alors, servez-moi sans réserve."
 pam_secular_faith_events.0047.b: "Vous devez toujours servir en priorité [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0048.t: "Rêves démoniaques"
 pam_secular_faith_events.0048.desc: "Je me réveille, mais je ne peux pas bouger.\n\nUne silhouette difforme danse devant moi et ricane méchamment. Un démon ? La peur m’envahit. « Hé... Hé... Vos péchés pèsent lourd. Bientôt, [ROOT.Char.GetFaith.EvilGodNames] s’emparera de vous ! »\n\nQue ce soit un rêve ou un démon : je ne peux tout simplement pas ignorer ce que j’ai vu. Je dois faire la paix avec [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0048.a: "Ce rêve doit bien signifier quelque chose..."
 pam_secular_faith_events.0048.b: "Ce n’est qu’un rêve. Je me rendors."
 pam_secular_faith_events.0048.c: "Que [ROOT.Char.GetFaith.HighGodName] me vienne en aide ! Je dois faire pénitence."
 pam_sf_demon_torment_modifier_tt: "Pour retirer le modificateur, vous devez construire une [holding|El] de [GetBuilding('temple_01').GetName|l] ou partir en [GetActivityType('activity_pilgrimage').GetName|l]"
 pam_sf_demon_torment_lifted_toast: "Fin du tourment"
 pam_secular_faith_events.0049.t: "« Hiérarchie céleste »"
 pam_secular_faith_events.0049.desc: "Les bruits qui s’échappent de ma chapelle ne sont pas ceux d’une prière.\n\n« Oui, OUI, Votre Grâce ! Montrez à c[lustful_priest.Custom('FR_EEtte')] misérable [Select_CString(lustful_priest.IsFemale,'pécheresse','pécheur')] la place qui lui revient au sein de la [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )|l] ! » s’écrie m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', lustful_priest )], [lustful_priest.GetFirstName], avec extase. « Je ne suis qu’un ver qui se vautre dans la boue, rongé par les désirs terrestres. PUNISSEZ-MOI ! »\n\nPar [ROOT.Char.GetFaith.HighGodName] ! Que se passe-t-il donc dans ma chapelle ?!"
 pam_secular_faith_events.0049.a: "Ça doit être un rituel. Je devrais... prendre des notes."
 pam_secular_faith_events.0049.b: "Si ça se passe dans ma chapelle, j’en serai aussi !"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip] est [Select_CString(lustful_priest.IsFemale,'une perverse','un pervers')] ?! C’est dégoûtant, mais utile."
 pam_secular_faith_events.0050.t: "Magnifique [chaplain.GetCouncilTitle|l]"
 pam_secular_faith_events.0050.desc: "Les lumières vacillantes des bougies [ROOT.Char.GetFaith.HouseOfWorship3] parviennent à peine à détourner mon attention des pensées impures qui envahissent mon esprit.\n\n« Suivez-moi jusqu’au confessionnal, [ROOT.Char.Custom('FormOfAddressForLiege')] », murmure m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )]. Je pose mon regard sur s[chaplain.Custom('ObjectifiedFeature')]. « Quel que ce soit ce qui pèse sur votre âme : parlez sans crainte. »\n\nLe [GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )|l] est sacré... mais un péché pèse plus lourd que tous les autres : mes pensées concernant [chaplain.Custom('AdmiredFeature')] de [chaplain.GetFirstName]."
 pam_secular_faith_events.0050.a: "... Y a-t-il de la place pour deux dans votre confessionnal ?"
 pam_secular_faith_events.0050.b: "Pardonnez-moi, [Select_CString(chaplain.IsFemale,'ma Mère','mon Père')], car j’ai des pensées impures."
 pam_secular_faith_events.0051.t: "Le Seigneur, votre Dieu"
 pam_secular_faith_events.0051.desc: "« #EMP Je suis l’Éternel, votre Dieu#! », retentit une voix tonitruante dans [ROOT.Char.GetFaith.HouseOfWorship]. « #EMP Incline la tête devant moi.#! »\n\nJe tombe à genoux, ma vue se trouble. J’essuie le sang sur mon visage.\n\n« #EMP Moi, le Seigneur, votre Dieu, je vous ordonne : obéissez-moi de tout votre cœur et de toute votre âme.#! » La voix se multiplie en centaines. Les centaines deviennent des milliers. « #EMP Si vous ne m’obéissez pas, je vous maudirai jusqu’à ce que vous soyez anéantis, car vous m’avez abandonné, moi, le Seigneur, votre Dieu.#! »"
 pam_secular_faith_events.0051.a: "Je vais... obéir..."
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Quelque chose d’horrible ou de merveilleux va se produire...#!"
 pam_sf_lord_your_god_tt: "Puisse [ROOT.Char.GetFaith.HighGodName] avoir pitié."
 pam_sf_voice_of_jesus_toast: "Voix de Jésus"
 pam_sf_stroke_of_god_toast: "Frappé par Dieu"
 pam_secular_faith_events.0052.t: "Après votre départ"
 pam_secular_faith_events.0052.desc: "Dans [ROOT.Char.GetFaith.HouseOfWorship] de [resting_church.GetNameNoTier], m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )], [chaplain.GetFirstName], s’arrête devant les pierres tombales usées de ceux qui ont régné avant moi.\n\n« [ROOT.Char.GetFaith.HighGodName|U] vous a accordé plus d’hivers qu’à la plupart des gens, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ce n’est pas un péché que de décider comment vous souhaitez reposer. »\n\n« Votre noble visage sculpté dans la pierre ou vêtu d’une [Glossary( 'simple soutane', 'AD_SUCCURRENDUM_GLOSS' )] – le choix vous appartient. »"
 pam_secular_faith_events.0052.a: "Sculptez mon visage dans la pierre... mais en plus jeune et plus beau."
 pam_secular_faith_events.0052.b: "Une simple soutane suffira."
 pam_secular_faith_events.0052.c: "La tombe sait attendre."
 pam_sf_effigy_planned_tt: "Si des [GetActivityType( 'activity_funeral').GetName|l] sont organisées en votre honneur après votre décès, l’organisateur recevra #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#![prestige_i] de [prestige|El]"
 pam_sf_cowl_burial_planned_tt: "Si des [GetActivityType( 'activity_funeral').GetName|l] sont organisées en votre honneur après votre décès, l’organisateur recevra #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#![piety_i] de [piety|El]"
 pam_sf_effigy_unveiled_toast: "L’effigie dévoilée"
 pam_sf_cowl_burial_toast: "Repos éternel dans sa robe de moine"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "Mourir #G ad succurrendum#! – prononcer ses vœux monastiques et revêtir la robe de moine sur son lit de mort – était un dernier recours des grands souverains dans toute la chrétienté médiévale. Être enterré dans une simple soutane plutôt que dans de la soie raffinée signifiait que le souverain mourant espérait pouvoir comparaître devant le Jugement dernier parmi les humbles frères et non parmi les puissants."
 pam_secular_faith_events.0053.t: "La sortie du saint en procession"
 pam_secular_faith_events.0053.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )], [chaplain.GetFirstName], soulève le couvercle d’un reliquaire avec le soin d’une sage-femme. À l’intérieur repose le trésor de ma Maison : [procession_relic.GetName].\n\n« Garder la sainteté sous clé n’aide personne, [ROOT.Char.Custom('FormOfAddressForLiege')] », dit-[chaplain.Custom('FR_IlElle')]. « Offrez une [Glossary( 'ostension', 'OSTENSION_GLOSS' )] à votre peuple : montrez la relique et bénissez chaque rue entre ici et les portes. »"
 pam_secular_faith_events.0053.a: "Je porterai moi-même le reliquaire."
 pam_secular_faith_events.0053.b: "Je vais célébrer cette veillée tout[ROOT.Char.Custom('FR_E')] seul[ROOT.Char.Custom('FR_E')]."
 pam_secular_faith_events.0053.c: "Je n’ose pas la déplacer."
 pam_sf_procession_gamble_tt: "Les rues ne sont pas un caveau. L’objet pourrait être endommagé..."
 pam_sf_relic_jostled_toast: "Bousculé dans la foule"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "L’exposition solennelle d’une relique de saint. Lors des grandes fêtes, les reliques étaient sorties de leurs reliquaires et portées en procession à travers les rues et les champs, afin que la bénédiction, habituellement liée à un seul autel, puisse toucher chaque âme sur son passage. Une relique exposée attirait les foules, l’argent et la notoriété partout où on la portait."
 pam_secular_faith_events.0054.t: "Le bassin et le linge"
 pam_secular_faith_events.0054.desc: "Le bassin fume à mes pieds, et [ROOT.Char.Custom('FR_GetCourt_Le')] se rassemble pour regarder. Un tanneur est assis sur un tabouret à côté de moi, visiblement nerveux, les pieds nus et couverts de crasse. L’odeur est... prononcée.\n\nC’est précisément cette nuit-là que le Sauveur lui-même s’est agenouillé avec un bassin et un linge. Le [Glossary( 'mandé', 'MANDATUM_GLOSS' )] est prêt, l’eau est chaude et tous les regards sont braqués sur moi.\n\nIl ne me reste plus qu’à m’agenouiller à mon tour... ou à changer d’avis."
 pam_secular_faith_events.0054.deviant: "#EMP Je vais nettoyer ces délicieux pieds avec ma langue.#!"
 pam_secular_faith_events.0054.a: "S’agenouiller et prendre le linge"
 pam_secular_faith_events.0054.b: "S’agenouiller et embrasser ces pieds fatigués"
 pam_secular_faith_events.0054.c: "Je... ne peux pas. Enlevez ce bassin."
 pam_sf_odorous_feet_tt: "Que la sainteté descende sur moi tandis que je m’agenouille... sinon l’odeur des pieds du paysan ne me quittera plus jamais"
 pam_sf_odorous_feet_toast: "La puanteur persiste"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "Le rite du lavage des pieds tire son nom des paroles prononcées par le Christ lors de la Cène : #G Mandatum novum do vobis#! – « Je vous donne un commandement nouveau. » Chaque année, le Jeudi saint, les empereurs à Constantinople et les rois de tout l’Occident s’agenouillaient devant des pauvres choisis, munis d’un bassin et d’un linge, leur lavaient les pieds et leur glissaient de l’argent dans les mains – le soir venu, celui qui avait la plus grande autorité de la salle s’inclinait le plus bas."
 pam_secular_faith_events.0055.t: "La voix de bronze"
 pam_secular_faith_events.0055.desc: "L’ancienne cloche de [bell_church.GetName] s’est brisée et a donc été refondue. Aujourd’hui, elle brille dans le clocher. Sous la cloche se tient m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName], muni[chaplain.Custom('FR_E')] d’eau, d’huile sainte et de sel.\n\n« Une cloche doit être [Glossary( 'baptisée', 'BELL_BAPTISM_GLOSS' )] avant de pouvoir parler au nom [ROOT.Char.GetFaith.HighGodNamePossessive] », insiste-t-[chaplain.Custom('FR_IlElle')], les manches déjà retroussées. « Lavée, ointe et baptisée – et après cela, ni l’ennemi ni la tempête ne pourront faire taire sa voix. »"
 pam_secular_faith_events.0055.a: "Alors lavons-la, oignons-la d’huile et donnons-lui un nom."
 pam_secular_faith_events.0055.b: "C’est du bronze, et non une âme – les capitulaires le disent aussi."
 pam_secular_faith_events.0055.c: "Une brève bénédiction suffit. Faites-la sonner."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "Les cloches d’église étaient bénies de la même manière que les chrétiens : on les lavait avec de l’eau bénite, on les oignait d’huile et on leur donnait le nom d’un saint – certains étaient même les parrains de cloches. L’#G Admonitio generalis#! de Charlemagne interdit en 789 le baptême des cloches, mais la coutume perdura néanmoins pendant plusieurs siècles. On croyait qu’une cloche baptisée pouvait chasser les tempêtes, la grêle et les démons, aussi loin que portait son son. Plus tard, certains fondeurs gravèrent sur leurs cloches la devise #G Fulgura frango#! : « Je brise la foudre. »"
 pam_secular_faith_events.0056.t: "Un moineau dans [ROOT.Char.Custom('ResidenceBuildingHallType')]"
 pam_secular_faith_events.0056.desc: "Un moineau surgit de l’obscurité hivernale, traverse [ROOT.Char.Custom('ResidenceBuildingHallType')] en volant à travers la fumée et les rires, puis ressort par [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\n[ROOT.Char.Custom('FR_GetCourt_Le')|U] éclate de rire. M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )], [chaplain.GetFirstName], [chaplain.Custom('FR_LuiElle')], ne rit pas.\n\n« [Glossary( 'Telle est la vie de l’homme', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')] : un instant dans la lumière et la chaleur, sortant d’une obscurité pour entrer dans la suivante. Seul [ROOT.Char.GetFaith.HighGodName] sait ce qui vient avant et après. »"
 pam_secular_faith_events.0056.scholar: "Bède a écrit la même chose, presque mot pour mot."
 pam_secular_faith_events.0056.a: "Alors profitons pleinement de cet instant baigné de lumière."
 pam_secular_faith_events.0056.b: "« C’était un oiseau. Encore du vin. »"
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "Dans le récit de Bède, un conseiller du roi Edwin de Northumbrie compare la vie de l’homme à celle d’un moineau qui, par une nuit d’hiver, traverse en volant une salle de fête bien chauffée : un bref instant passé dans la lumière et la sécurité, loin de la tempête, puis de nouveau plongé en son sein, tout ce qui précède et suit restant inconnu. Si la nouvelle foi pouvait apporter un éclairage sur ce qui se trouve au-delà de la salle, affirmait-il, alors elle méritait qu’on la suive – et Edwin en fut convaincu."
 pam_secular_faith_events.0057.t: "La bière de l’église"
 pam_secular_faith_events.0057.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )], [chaplain.GetFirstName], se tient dans l’enclos paroissial de [ale_church.GetNameNoTier], entre les tables où est assise la moitié de la paroisse et les fûts qui viennent d’être amenés de la [GetBuilding('breweries_01').GetName|l]. [chaplain.Custom('FR_IlElle')|U] tient déjà une chope pleine à ras bord.\n\n« La pluie s’infiltre par le toit, [ROOT.Char.Custom('FormOfAddressForLiege')], et la dîme ne suffit pas à payer les frais. C’est pourquoi les frères brassent la [Glossary( 'bière de l’église', 'CHURCH_ALE_GLOSS' )], que nous vendons. La paroisse la consomme jusqu’à ce que le toit soit entièrement payé. »\n\n« Chaque chope est une bonne action. Vous en voulez une ? »"
 pam_secular_faith_events.0057.a: "Alors, passez-moi une coupe. Pour le toit."
 pam_secular_faith_events.0057.b: "Laissez tomber la bière – je paierai moi-même pour le toit."
 pam_secular_faith_events.0057.c: "Boire ? Sur une terre sacrée ? Jetez ça."
 pam_sf_church_ale_gamble_tt: "Chaque coupe contribue grandement à la construction du toit et à la vie de la paroisse..."
 pam_sf_church_ale_toast: "Réveil avec un mal de tête"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "Une fête paroissiale au cours de laquelle on vendait, dans l’enclos paroissial, de la bière brassée à partir de malt donné, et dont les recettes servaient à l’entretien de l’église : un toit étanchéifié, une nouvelle cloche, du pain pour les pauvres. Synode après synode, on condamnait la consommation d’alcool sur la terre sacrée, et paroisse après paroisse, on continuait à brasser de la bière. Pour bien des églises de village, la bière rapportait plus que la dîme n’aurait jamais pu le faire."
 pam_secular_faith_events.0058.t: "Que mange la souris ?"
 pam_secular_faith_events.0058.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )], [chaplain.GetFirstName], fait irruption, pâle comme un linge d’autel, et tient une petite [Glossary( 'pyxide', 'PYX_GLOSS' )] argentée comme si elle lui brûlait les mains.\n\n« Une souris, [ROOT.Char.Custom('FormOfAddressForLiege')]. Elle s’est introduite dans la boîte cette nuit et a mangé les [Glossary( 'hosties', 'RESERVED_HOST_GLOSS' )] ! »\n\n[chaplain.Custom('FR_IlElle')|U] arrive à peine à parler. « Les érudits se demandent : [Glossary( 'Quid mus sumit ?', 'QUID_MUS_SUMIT_GLOSS' )] Qu’a donc mangé la souris ? Que dois-je faire ? »"
 pam_secular_faith_events.0058.scholar: "Rassurez-vous. La souris a mangé du pain. Rien d’autre."
 pam_secular_faith_events.0058.mean: "Vous laissez une souris manger [ROOT.Char.GetFaith.HighGodName] ?! Hors de m[ROOT.Char.Custom('FR_GetCourt_OnA')] !"
 pam_secular_faith_events.0058.a: "Acheter une pyxide qui se ferme mieux"
 pam_secular_faith_events.0058.b: "Alors, la souris est damnée ? Ha !"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit ?#! – « Que mange la souris ? » Une question qui a fait l’objet de débats sérieux parmi les érudits : si une souris grignotait une hostie consacrée, mangeait-elle alors le corps de Dieu ? Le droit canonique prévoyait des sanctions à l’encontre des prêtres qui conservaient le sacrement avec négligence, et les grands docteurs estimaient que la souris ne consommait que l’apparence du pain – et que le sacrement se préservait ainsi lui-même de dents indignes."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "Une petite boîte fermée, généralement en argent ou dorée, dans laquelle est conservé le pain consacré de la messe. Le droit canonique exigeait qu’elle soit conservée au sec, fermée et à l’abri des mains impies – ou des visiteurs affamés."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "Le pain consacré pendant la messe, puis mis de côté, était conservé dans l’église afin que les malades et les mourants puissent en recevoir à tout moment. Dès qu’il était consacré, ce pain était considéré comme le corps même de Dieu, ce qui faisait de sa conservation en lieu sûr une question d’une importance capitale."
 pam_secular_faith_events.0059.t: "Le jour du Seigneur"
 pam_secular_faith_events.0059.desc: "À l’aube, la nouvelle nous est parvenue qu’un[sighting_county.Custom('FR_E_GetAnimalType')] [sighting_county.Custom('GetAnimalType')] avait été aperçu[sighting_county.Custom('FR_E_GetAnimalType')] dans [sighting_province.Custom('GetTerrainTypePlural')] de [sighting_county.GetBaseNameNoTier]. Les chiens de chasse aboient et les chevaux piaffent dans la cour – mais m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] barre le passage au portail.\n\n« C’est [Glossary( 'le jour du repos', 'LORDS_DAY_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. Les cloches ont sonné et la messe commence ! »\n\n« [ROOT.Char.GetFaith.HighGodName|U] vous a accordé six jours pour chevaucher. En convoitez-vous vraiment un de plus ? »"
 pam_secular_faith_events.0059.a: "Dessellez les chevaux. Nous allons à la messe."
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('FR_Le_GetAnimalType')|U][sighting_county.Custom('GetAnimalType')] n’attend pas. En avant !"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "Le premier jour de la semaine était considéré comme sacré en mémoire de la Résurrection. Les conciles ecclésiastiques interdisaient ce jour-là le travail servile, les marchés ainsi que les divertissements futiles, et les rois chrétiens inscrivaient cette interdiction dans leurs lois – même si certains seigneurs considéraient la chasse au cerf, tout comme le sermon, comme une affaire entre eux-mêmes et Dieu."
 pam_secular_faith_events.0060.t: "Une vie d’insouciance"
 pam_secular_faith_events.0060.desc: "Tandis que je remonte les rues de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], préoccupé[ROOT.Char.Custom('FR_E')] par mes coffres vides et en proie à un tourment intérieur, je remarque la présence d’un[hermit.Custom('FR_E')] mendiant[hermit.Custom('FR_E')].\n\nDébarrassé[hermit.Custom('FR_E')] de tout bien matériel, [hermit.Custom('FR_IlElle')] danse avec la paix et la sagesse de quelqu’un qui a accepté sa place dans ce monde. Une âme libérée de tous les malheurs que j’endure.\n\nPeut-être perçoit-[hermit.Custom('FR_IlElle')] une vérité qui pourrait me libérer, moi aussi."
 pam_secular_faith_events.0060.a: "Moins j’en ai, plus je suis moi-même !"
 pam_secular_faith_events.0060.b: "J’ornerai de nouveau cette cage qui est la mienne !"
 pam_secular_faith_events.0060.c: "Débarrassez-moi de cette pluie."
