l_french:
 PAM_CHALLENGE_HOF_WAR_CB_NAME: "Défier le [head_of_faith|El]"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "Le [challenger_hof|El] que vous parrainez s’empare des titres du [head_of_faith|El] et le rite [attacker.GetRite.GetAdherentName] devient le [mainline_rite|El]."
 pam_challenge_hof_cb_victory_desc_attacker: "Vous vous emparez des titres du [head_of_faith|El] et le rite [attacker.GetRite.GetAdherentName] devient le [mainline_rite|El]."
 pam_challenge_hof_cb_victory_desc: "Le [challenger_hof|El] devient le [head_of_faith|El]."
 pam_challenge_hof_cb_white_peace_desc: "[defender.Custom('FR_le_Char_U_Pi')|U][defender.GetShortUIName|U] reste le [head_of_faith|El]."
 pam_challenge_hof_cb_defeat_desc_attacker: "Votre défi contre le [head_of_faith|El] échoue."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "La guerre a pris fin : le défenseur n’est plus [head_of_faith|El]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "La guerre a pris fin : il n’y a plus de prétendant au poste de chef spirituel."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.Custom('FR_le_Char_U_Pi')|U][new_hof.GetShortUIName|U] [Select_CString(new_hof.IsLocalPlayer,'devenez','devient')] [new_hof.Custom('FR_LeLa')] [Concept('vassal', Select_CString(new_hof.IsFemale,'vassale','vassal'))|El] [sponsor.Custom('FR_du_Char_U_Pi')][sponsor.GetShortUIName]"
 PAM_ANTIKING_WAR_CB_NAME: "Déposer le [challenger_hof|El]"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "Vous démettez le [challenger_hof|El] [defender.Custom('FR_du_Char_U_Pi')][defender.GetShortUIName] et obtenez la gratitude [attacker.GetFaith.GetReligiousHead.Custom('FR_du_Char_U_Pi')][attacker.GetFaith.GetReligiousHead.GetShortUIName]."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "Vous démettez le [challenger_hof|El] [defender.Custom('FR_du_Char_U_Pi')][defender.GetShortUIName]."
 pam_antiking_cb_victory_desc: "Le [challenger_hof|El] est déposé."
 pam_antiking_cb_white_peace_desc: "Le [challenger_hof|El] reste."
 pam_antiking_cb_defeat_desc_attacker: "Votre tentative de démettre le [challenger_hof|El] échoue."
 pam_antiking_cb_defeat_desc: "Le [challenger_hof|El] survit."
 msg_pam_antiking_cb_invalidated_message: "La guerre a pris fin : le défenseur ne soutient plus un [challenger_hof|El]."
 pam_humiliation_cb_papabile_score_loss_tt: "Le [papabile_score|El] [defender.Custom('FR_du_Char_U_Pi')][defender.GetShortUIName] pour la succession papale diminue de #N -25#!"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "Le [papabile_score|El] [attacker.Custom('FR_du_Char_U_Pi')][attacker.GetShortUIName] pour la succession papale diminue de #N -25#!"
 pam_clerical_disgrace_modifier: "Une honte pour le clergé"
 pam_clerical_disgrace_modifier_desc: "Ce personnage a subi une humiliation lors d’une guerre de religion, ce qui a nui à son [candidate_score|El] pour des [clerical_titles|El]."
 pam_clerical_disgrace_candidacy_penalty_desc: "Humiliation dans une guerre de religion"
 pam_antipope_events.0010.t: "L’[Select_CString(pam_ch_hof_challenger.IsFemale,'usurpatrice humiliée','usurpateur humilié')]"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('FR_LeLa')|U] schismatique et méprisable [pam_ch_hof_challenger.GetTitledFirstName] s’agenouille devant moi, désormais dépouillé[pam_ch_hof_challenger.Custom('FR_E')] de son faux [ROOT.Char.GetFaith.ReligiousHeadTitleName|l].\n\nD’un air de défi, [pam_ch_hof_challenger.Custom('FR_IlElle')] déclare : « L’Arche se trouve là où je me tiens. Pas à vos pieds. »\n\nSa langue reste manifestement au service de Satan."
 pam_antipope_events.0010.desc: "L’[Select_CString(pam_ch_hof_challenger.IsFemale,'usurpatrice','usurpateur')] [pam_ch_hof_challenger.GetTitledFirstName] s’agenouille devant moi, dépouillé[pam_ch_hof_challenger.Custom('FR_E')] de son faux [ROOT.Char.GetFaith.ReligiousHeadTitleName|l].\n\nD’un air de défi, [pam_ch_hof_challenger.Custom('FR_IlElle')] déclare : « Je suis le véritable [ROOT.Char.GetFaith.ReligiousHeadName|l]. »"
 pam_antipope_events.0010.a.christian: "Une cellule peut [pam_ch_hof_challenger.Custom('FR_LeLa')] rendre aussi repentant[pam_ch_hof_challenger.Custom('FR_E')] que Jonas."
 pam_antipope_events.0010.a: "L’enfermer."
 pam_antipope_events.0010.b.christian: "L’exécuter. Le Seigneur reconnaît les siens."
 pam_antipope_events.0010.b: "L’exécuter. Le reste sera jugé par [ROOT.Char.GetFaith.HighGodName] !"
 pam_antipope_events.0010.c: "Faire preuve de clémence."
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.Custom('FR_IlElle')|U] criera le nom [ROOT.Char.Custom('FR_DuDela')] véritable [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_challenge_hof_war_random_permanent_harm_tt: "Souffre d’une blessure permanente aléatoire"
 pam_antipope_events.0011.t: "Le prix du patronage"
 pam_antipope_events.0011.desc.christian: "La fortune [pam_ch_hof_sponsor.Custom('FR_du_Char_Pi')][pam_ch_hof_sponsor.GetTitledFirstName] a alimenté une funeste rupture et dresser un [ROOT.Char.GetFaith.ReligiousHeadName|l] rival contre le rite [ROOT.Char.GetRite.GetAdherentName].\n\nL’Écriture ne ménage guère de tels mécènes : [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.Custom('FR_IlElle')|U] lève les yeux au ciel, dans un énième air de défi : « Vous n’êtes pas [ROOT.Char.GetFaith.ReligiousHeadName|l], mais un faux moine. Descendez, descendez, pour être damné[ROOT.Char.Custom('FR_E')] à travers les âges. »"
 pam_antipope_events.0011.desc: "L’or [pam_ch_hof_sponsor.Custom('FR_du_Char_Pi')][pam_ch_hof_sponsor.GetTitledFirstName] a financé un [ROOT.Char.GetFaith.ReligiousHeadName|l] rival afin de diviser les [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip].\n\n[pam_ch_hof_sponsor.Custom('FR_IlElle')|U] lève les yeux et dit : « Vous n’êtes pas [ROOT.Char.GetFaith.ReligiousHeadName|l]. Vous êtes [Select_CString(ROOT.Char.IsFemale,'une impostrice','un imposteur')]. »"
 pam_antipope_events.0011.a: "Confisquez les fonds qui ont permis cela."
 pam_antipope_events.0011.b: "Exécutez-[pam_ch_hof_sponsor.Custom('FR_LeLa')]. L’assentiment a un prix."
 pam_antipope_events.0011.c: "La honte qui pèse sur sa Maison est un châtiment suffisant."
 pam_antipope_events.0011.d: "Fouettez-[pam_ch_hof_sponsor.Custom('FR_LeLa')] jusqu’à ce que son corps cède."
 pam_romans_1_32_english: "Et, bien qu’ils connaissent le jugement de Dieu, déclarant dignes de mort ceux qui commettent de telles choses, non seulement ils les font, mais ils approuvent ceux qui les font."
 ROMANS_1_32_GLOSS: "#weak Romains 1:32#!"
 pam_antipope_events.0012.t: "Jugement d’[Select_CString(pam_ch_hof_old_hof.IsFemale,'une destituée','un destitué')]"
 pam_antipope_events.0012.t.christian: "Une sentence pour un soldat de Satan"
 pam_antipope_events.0012.intro.christian: "Le rite [ROOT.Char.GetRite.GetAdherentName] m’obéit. Le faux [ROOT.Char.GetFaith.ReligiousHeadName|l], [pam_ch_hof_old_hof.GetTitledFirstName], s’agenouille à mes pieds."
 pam_antipope_events.0012.intro: "Les [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] m’obéissent. Le faux [ROOT.Char.GetFaith.ReligiousHeadName|l], [pam_ch_hof_old_hof.GetTitledFirstName], s’agenouille à mes pieds."
 pam_antipope_events.0012.intro.sponsor: "Mon [ROOT.Char.GetFaith.ReligiousHeadName|l] [pam_ch_hof_new_hof.GetFirstName] a accédé au trône. [Select_CString(pam_ch_hof_old_hof.IsFemale,'La prétendante','Le prétendant')], [pam_ch_hof_old_hof.GetTitledFirstName], s’agenouille devant moi."
 pam_antipope_events.0012.dialogue.christian: "\n\nDans une énième volonté de défi, [pam_ch_hof_old_hof.Custom('FR_IlElle')] ironise : « C’est par l’épée que vous avez conquis le trône de la paix. »\n\n« Le Seigneur a jugé bon de me donner les moyens nécessaires à l’accomplissement de Son plan », rétorqué-je."
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.Custom('FR_IlElle')|U] dit : « Vous l’avez conquis par l’épée. »\n\n« Et c’est par l’épée que je le conserverai », rétorqué-je."
 pam_antipope_events.0012.a: "Une cellule pourrait tempérer son orgueil."
 pam_antipope_events.0012.b: "Deux têtes font un monstre ; il faut donc en éliminer une."
 pam_antipope_events.0012.c: "Il y a eu assez de disputes. Laissons-[pam_ch_hof_old_hof.Custom('FR_LeLa')] partir en paix."
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.Custom('FR_IlElle')|U] criera le nom [ROOT.Char.Custom('FR_DuDela')] véritable [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_antipope_events.0014.t: "Mon propre jugement"
 pam_antipope_events.0014.intro.judge: "« Je libère tous les [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] de l’obligation de vous obéir » déclare [pam_ch_hof_judge.Custom('FR_le_Char_Pi')][pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy.christian: "« Partez et ne péchez plus », dit [pam_ch_hof_judge.Custom('FR_le_Char_Pi')][pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy: "« Partez. N’empruntez plus ce chemin », dit [pam_ch_hof_judge.Custom('FR_le_Char_Pi')][pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.desc.condemned.christian: "\n\nJ’ai aimé la justice et haï l’injustice, et c’est ainsi que je meurs."
 pam_antipope_events.0014.desc.condemned: "\n\nJe meurs pour ce que je tenais pour vrai."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.Custom('FR_LuiElle')|U] et ses hommes rient de moi alors qu’ils me flagellent. Je ne suis plus qu’une coquille vide."
 pam_antipope_events.0014.desc.captive.christian: "\n\nOn m’a donné une cellule. On m’a toujours dit qu’une cellule suffisait pour [Select_CString(ROOT.Char.IsFemale,'une sainte','un saint')]."
 pam_antipope_events.0014.desc.captive: "\n\nOn m’a donné une cellule. Je n’ai pas droit à plus."
 pam_antipope_events.0014.desc.spared.christian: "\n\nIl semble que les pierres restent entre leurs mains et que je sois libre de partir. Je ne dois pas gaspiller cette grâce."
 pam_antipope_events.0014.desc.spared: "\n\nIl semble que j’en sorte libre. Je ne dois pas gaspiller cette grâce."
 pam_antipope_events.0014.desc.generic: "\n\nLe verdict est tombé. Ce qui va se passer maintenant ne dépend que de moi."
 pam_antipope_events.0014.a: "Que ma Maison reste dans les mémoires comme fidèle [ROOT.Char.GetFaith.HighGodName2]."
 pam_antipope_events.0014.b: "Ils n’arriveront pas à se laver les mains."
 pam_antipope_events.0014.b.toast: "Vous êtes [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName|l]."
 pam_antipope_events.0014.c: "Préserver ma Maison de cette honte."
 pam_antipope_events.0014.d: "Je vais me réconcilier avec le véritable [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_antipope_events.0014.e: "Je mettrai en pratique ce que m’a appris c[pam_ch_hof_judge.Custom('FR_EEtte')] [pam_ch_hof_judge.GetTitledFirstNameNoTooltip] malfaisant[pam_ch_hof_judge.Custom('FR_E')]."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "Je marcherai pieds nus jusqu’à ma pleine pénitence."
 pam_antipope_events.0015.opening: "[ROOT.Char.Custom('FR_au_Char_Pi')|U][ROOT.Char.GetTitledFirstNameNoTooltip] de foi [ROOT.Char.GetFaith.GetAdjectiveNoTooltip],"
 pam_antipope_events.0015.desc.defender_victory.christian: "Sachez que la rébellion schismatique contre le [ROOT.Char.GetFaith.ReligiousHeadName] a été réprimée. Le pouvoir de l’usurpateur a été anéanti et le rite [ROOT.Char.GetRite.GetAdherentName] reste inébranlable. Qu’aucun seigneur ni prélat ne doute de celui à qui il doit allégeance."
 pam_antipope_events.0015.desc.defender_victory: "Sachez que le défi lancé au [ROOT.Char.GetFaith.ReligiousHeadName] a été repoussé. Le pouvoir de l’usurpateur a été anéanti et les [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] restent inébranlables. Qu’aucun dirigeant ne doute de celui à qui il doit allégeance."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Sachez que la guerre pour la fonction de [ROOT.Char.GetFaith.ReligiousHeadTitleName|l] est terminée. J’ai libéré le siège du joug de Satan et le rite [ROOT.Char.GetRite.GetAdherentName] obéira à mes ordres."
 pam_antipope_events.0015.desc.attacker_victory: "Sachez que la guerre pour la fonction de [ROOT.Char.GetFaith.ReligiousHeadTitleName|l] est terminée. J’occupe le siège et les [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] me suivent. Faites savoir aux fidèles qu’un autre [ROOT.Char.GetFaith.ReligiousHeadName] règne désormais."
 pam_antipope_events.0015.a: "Ainsi soit-il."
