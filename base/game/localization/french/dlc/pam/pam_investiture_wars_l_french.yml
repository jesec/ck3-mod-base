l_french:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Conflit d’investiture"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "Votre victoire oblige [defender.Custom('FR_le_Char_U_Pi')][defender.GetShortUIName] et son camp à adopter votre position concernant la nomination du clergé."
 pam_investiture_conflict_cb_victory_desc_defender: "La victoire [attacker.Custom('FR_du_Char_U_Pi')][attacker.GetShortUIName] vous oblige, vous et vos partisans, à adopter sa position concernant la nomination du clergé."
 pam_investiture_conflict_cb_victory_desc: "[attacker.Custom('FR_le_Char_U_Pi')|U][attacker.GetShortUIName|U] l’emporte et oblige [defender.Custom('FR_le_Char_U_Pi')][defender.GetShortUIName] et son camp à se rallier à sa position concernant la nomination du clergé."
 pam_investiture_conflict_cb_white_peace_desc: "Le différend concernant la nomination du clergé s’achève sans qu’une décision soit prise et aucune des deux parties ne l’emporte."
 pam_investiture_conflict_cb_defeat_desc_attacker: "Votre défaite vous oblige, vous et vos partisans, à adopter la position [defender.Custom('FR_du_Char_U_Pi')][defender.GetShortUIName] concernant la nomination du clergé."
 pam_investiture_conflict_cb_defeat_desc_defender: "Vous remportez la victoire et contraignez [attacker.Custom('FR_le_Char_U_Pi')][attacker.GetShortUIName] et ses partisans à adopter votre position concernant la nomination du clergé."
 pam_investiture_conflict_cb_defeat_desc: "[defender.Custom('FR_le_Char_U_Pi')|U][defender.GetShortUIName] remporte la victoire et oblige [attacker.Custom('FR_le_Char_U_Pi')][attacker.GetShortUIName] et ses partisans à adopter sa position concernant la nomination du clergé."
 msg_pam_investiture_conflict_cb_invalidated_message: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée ; le conflit des investitures n’est plus d’actualité."
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "Le concile de l’investiture n’a pas encore été convoqué"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "Contraint de céder"
 pam_investiture_conflict_forced_stance_tt: "Comme vous avez été vaincu dans le conflit des investitures, vous êtes tenu d’adopter, lors du prochain concile, la position du vainqueur concernant la nomination du clergé."
