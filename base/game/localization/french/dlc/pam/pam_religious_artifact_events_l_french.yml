l_french:
 pam_religious_artifact_events.0001.t: "Une entreprise sacrée"
 pam_religious_artifact_events.0001.desc: "« [ROOT.Char.Custom('FormOfAddressForLiege')|U] », dit m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] en entrant dans la salle, le sourire aux lèvres. « Elle m’est apparue en rêve ! »\n\n« Une œuvre d’art merveilleuse, soigneusement conçue et sertie des plus belles pierres précieuses, dédiée uniquement [ROOT.Char.GetFaith.HighGodName2]. Donnez-moi les moyens nécessaires et je reviendrai avec le plus bel objet qu’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] puisse imaginer ! »\n\nC’est une promesse audacieuse, mais combien de fois a-t-on la chance d’avoir une vision [ROOT.Char.GetFaith.HighGodNamePossessive] ?"
 pam_religious_artifact_events.0001.aa: "On dirait que vous rêvez de me faire dépenser sans compter !"
 pam_religious_artifact_events.0001.a: "Ma piété ne doit connaître aucune limite !"
 pam_religious_artifact_events.0001.b: "[ROOT.Char.GetFaith.HighGodName|U] n’a pas besoin de babioles."
 pam_religious_artifact_events.0002.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] m’a invité[ROOT.Char.Custom('FR_E')] à entrer dans la chapelle du château. J’ai compris pourquoi lorsqu’[inspiration_owner.Custom('FR_IlElle')] m’a montré la commande que j’attendais avec tant d’impatience.\n\n[newly_created_artifact.GetDesc]"
 pam_religious_artifact_events.0002.a: "C’est de l’excellent travail, [inspiration_owner.GetFirstNameNoTooltip] !"
 create_artifact_religious_artifact_tooltip: "[inspiration_owner.Custom('FR_le_Char_U_Pi')|U][inspiration_owner.GetShortUIName] a produit l’objet [SCOPE.Custom('ArtifactQuality')] [newly_created_artifact.GetName]"
