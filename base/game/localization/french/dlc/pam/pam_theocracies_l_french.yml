l_french:
 only_theocratic_tt: "[Select_CString(THIS.Char.IsLocalPlayer,'Votre','Le')] [government|El][THIS.Char.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')] ne permet pas de nominations [Concept('theocratic','théocratiques')|E] #weak ([THIS.Char.GetGovernment.GetAdjective])#!"
 can_be_appointed_interaction_clergy_tt: "Les [THIS.Char.GetWomenMen] doivent être membre du [clergy|El], ou la foi [THIS.Char.GetFaith.GetAdjective] doit avoir la [doctrine|El] du $doctrine_theocracy_lay_clergy_name|l$"
 can_be_appointed_interaction_can_inherit_tt: "Les [THIS.Char.GetWomenMen] doivent être capables d’hériter de [titles|El] #weak (pas [GetTrait('disinherited').GetName( THIS.Char )], [GetTrait('gallivanter').GetName( THIS.Char )] ou [GetTrait('order_member').GetName( THIS.Char )])#!"
 theocracy_lease: "Bail à rente théocratique"
 theocracy_lease_desc: "Cette propriété est [Concept('leased', 'baillée à rente')|E] à un [realm_priest|El] de la [faith|El] du propriétaire.\n\nLe [realm_priest|El] fournit [tax|El] et [levies|El] à la fois à son [liege|El] (s’il a son approbation) et son [religious_superior|El].\n\nSon supérieur religieux est le [realm_priest|El] de son [liege|El], s’ils ont la même foi. Sinon, ce sera le [Concept('head_of_faith', 'chef')|E] de sa foi."
 ecclesiastical_lease: "Bail à rente ecclésiastique"
 ecclesiastical_lease_desc: "Cette propriété est [Concept('leased', 'baillée à rente')|E] à un [realm_priest|El] de la [faith|El] [ecclesiastical|El] du propriétaire.\n\nLe [realm_priest|El] fournit [tax|El] et [levies|El] à la fois à son [liege|El] (s’il a son approbation), son [religious_superior|El] et directement au [Concept('head_of_faith', 'chef')|E] de sa foi.\n\nSon supérieur religieux est le [holder|El] du [clerical_title|El] dans lequel la capitale de son seigneur lige se trouve. Sinon, ce sera le [Concept('head_of_faith', 'chef')|E] de sa foi."
 budget_allocation_cardinal_law: "Allocation du budget cardinalice"
