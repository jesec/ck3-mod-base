 pam_bull_events.0001.t: "La bulle de [GetCurrentDate.GetYear]"
 pam_bull_events.0001.desc: "« Je vous exhorte tous à vous dresser contre les infidèles de [title.GetName], à délivrer cette terre de leur tyrannie, ainsi que des milliers de vos frères captifs. »\n\n« Afin que la dignité du nom chrétien soit rehaussée en votre temps, et que votre vaillance, louée à travers le monde entier, demeure intacte et inébranlable. »"
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!"
 pam_bull_events.0001.a.flavor: "#EMP Au nom du Seigneur.#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "« Vous tous qui croyez dans le principe [tenet_scope.GetName( ROOT.GetCharacter.GetRite )], sachez que cela est désormais autorisé en [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. »"
 pam_bull_events.0002.desc.tenet_forbidden: "« La doctrine [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] n’a désormais plus sa place en notre sein. Que quiconque s’en rend coupable sache qu’il porte atteinte à la sainteté de l’Église et qu’il se rend coupable de péché mortel. »"
 pam_bull_events.0002.a: "$pam_bull_events.0001.a$"
 pam_bull_events.0002.a.flavor: "$pam_bull_events.0001.a.flavor$"
 pam_bull_events.0003.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0003.desc: "« Afin de mettre fin au fléau du rite [heresy_rite.GetAdherentName], en vertu de mon autorité apostolique, je vous condamne tous comme hérétiques, et vous serez frappés d’un anathème perpétuel,"
 pam_bull_events.0003.desc.heresiarch: "et son chef, [heresiarch.Custom('FR_le_Char_Pi')][heresiarch.GetTitledFirstName], sera qualifié d’hérésiarque. »"
 pam_bull_events.0003.desc.no_heresiarch: "pour les siècles à venir. »"
