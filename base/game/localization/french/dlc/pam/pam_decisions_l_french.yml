 pam_bull_events.0004.opening: "[ROOT.GetCharacter.Custom('FR_au_Char_Pi')|U][ROOT.GetCharacter.GetTitledFirstNameNoTooltip] de foi [ROOT.GetCharacter.GetFaith.GetAdjectiveNoTooltip],"
 pam_bull_events.0004.desc.crusade: "Je vous exhorte tous à vous dresser contre les infidèles de [title.GetName]."
 pam_bull_events.0004.desc.heresy: "Que tout le monde sache que le rite [heresy_rite.GetAdherentName] est désormais considéré comme un anathème, et ses partisans comme des hérétiques."
 pam_bull_events.0004.desc.tenet_permitted: "« Vous tous qui croyez dans le principe [tenet_scope.GetName( ROOT.GetCharacter.GetRite )], sachez que cela est désormais autorisé en [bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip]. »"
 pam_bull_events.0004.desc.tenet_forbidden: "« Dès ce jour, le principe [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] n’a plus sa place parmi les fidèles. Quiconque le pratique offense la sainteté de l’Église et commet un péché mortel. »"
 pam_bull_events.0004.desc.fallback: "[bull_issuer.Custom('FR_le_Char_Pi')|U][bull_issuer.GetTitledFirstName] a publié une bulle pour tous les dirigeants de la foi."
 pam_bull_events.0004.a: "Ainsi soit-il."
