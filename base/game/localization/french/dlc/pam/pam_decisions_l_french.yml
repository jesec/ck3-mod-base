 pam_decision_events.0003.trait: "[target_child.Custom('FR_le_Char_U_Pi')|U][target_child.GetShortUIName] vit un moment de révélation"
 pam_establish_theocratic_dynasty_decision: "Établir une dynastie"
 pam_establish_theocratic_dynasty_decision_desc: "Même les racines les plus modestes peuvent devenir de grands arbres."
 pam_establish_theocratic_dynasty_decision_desc_tooltip: "Fondez votre propre [dynasty|El]"
 pam_establish_theocratic_dynasty_decision_confirm: "Le temps est venu"
 pam_establish_theocratic_dynasty_decision_effects_tt: "Vous établirez votre propre [dynasty|El]"
 pam_decision_events.0004.t: "Un nouveau départ"
 pam_decision_events.0004.desc: "Depuis des années, je porte une soutane plutôt qu’une bannière. Pourtant, j’ai acquis rang et pouvoir.\n\nPourquoi mon héritage disparaîtrait-il avec moi, simplement parce que je n’ai pas été anobli[ROOT.Char.Custom('FR_E')] ?"
 pam_decision_events.0004.a: "#EMP [ROOT.Char.GetHouse.GetMotto]#!"
 pam_decision_events.0004.tt: "#high La dynastie [THIS.Char.GetDynasty.GetName] est fondée#!"
 pam_determine_patron_saint_decision: "Choisir un saint patron"
 pam_determine_patron_saint_decision_desc: "Depuis leurs trônes célestes, les saints observent les luttes des souverains mortels et évaluent la nature de nos âmes.\n\nJe vais choisir un saint patron dont les vertus me guideront et dont l’intercession fortifiera ma main devant [ROOT.GetCharacter.GetFaith.HighGodName] et les hommes."
