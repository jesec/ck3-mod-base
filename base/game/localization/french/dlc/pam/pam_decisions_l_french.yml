 pam_personal_sacrifice_of_wealth_decision: "Faire don de richesse"
 pam_personal_sacrifice_of_wealth_decision_desc: "Faites don d’une partie de votre richesse par dévotion et contribuez ainsi au développement d’un comté placé sous votre protection"
 pam_personal_sacrifice_of_wealth_decision_tooltip: "Dépenser de l’[gold|El] pour augmenter la [development_growth|El] du [county|El] et gagner de l’[spiritual_fulfillment|El]"
