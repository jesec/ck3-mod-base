 pam_raise_khachkar_decision: "Ériger un khatchkar"
 pam_raise_khachkar_decision_desc: "Les [GetTenetType('tenet_khachkar').GetName( ROOT.Char.GetRite )|l] nous enseignent que c’est en sculptant la pierre que l’on rend le mieux hommage aux morts. Je dois ériger une croix ornée pour que ma lignée reste dans les mémoires. Je vais créer un lien entre les vivants, les morts et la terre."
 pam_raise_khachkar_decision_tooltip: "Commandez un [GetModifier('pam_khachkar_ancestral_county').GetName] dans l’un de vos [counties|El]."
