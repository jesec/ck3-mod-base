 pam_secure_pilgrim_routes_decision_desc: "Les chemins menant aux lieux saints sont désormais dangereux. Si nous proclamons que les fidèles peuvent porter des armes pendant leur pèlerinage, nous protégerons les voyageurs et inspirerons la dévotion dans toute la chrétienté."
