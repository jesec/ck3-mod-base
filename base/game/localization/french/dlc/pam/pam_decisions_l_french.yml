 nick_the_schismat_desc: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] brisé l’unité de la chrétienté et a conduit les croyants sur des chemins divergents."
 pam_promulgate_word_of_pious_deeds_decision: "Diffuser des récits d’actes de piété"
 pam_promulgate_word_of_pious_deeds_decision_desc: "Ma chancellerie a rédigé un éloge vantant mes actes dignes du Christ. Même s’il ne convient pas de mettre en avant ses propres vertus, mes proches souhaitent néanmoins faire connaître ma piété à tous les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nNombre d’entre eux pourraient se rendre compte que je suis [ROOT.Char.Custom('FR_LeLa')] plus digne d’accéder au Saint-Siège... et bien plus encore."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Augmente le résultat aux élections#! pour [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)] de #P +30#! ou améliore la probabilité de [canonization|El]"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Choisissez entre : \n\t$EFFECT_LIST_BULLET$Dépenser de la [piety|El] pour #V augmenter le résultat aux élections#! pour [praise_worthy_priest_superior_title.GetName]\n\t$EFFECT_LIST_BULLET$Améliorer vos chances à une [canonization|El] ultérieure"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Qu’ils me louent !"
