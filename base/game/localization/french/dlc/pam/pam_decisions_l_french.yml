 consecrate_kingdom_decision: "Consacrer un nouveau royaume"
 consecrate_kingdom_decision_desc_self: "C’est [ROOT.Char.GetFaith.HighGodName] qui fait les monarques, et c’est moi qui parle en Son nom. Pourrait-il y avoir souverain plus digne de régner sur les terres des fidèles ?"
 consecrate_kingdom_decision_desc: "C’est [ROOT.Char.GetFaith.HighGodName] qui fait les monarques. Dans les temps difficiles, [ROOT.Char.GetFaith.HighGodName] peut même élever un roi issu de la plus humble noblesse.\n\nJustement, nous y sommes. J’irai implorer pour ma tête nue une couronne sacrée."
 consecrate_kingdom_decision_confirm: "Assumer un mandat royal"
 consecrate_kingdom_decision_tooltip: "Créez un [title|El] de [kingdom|El] avec le soutien de la haute autorité spirituelle, et non en vous appuyant sur le pouvoir de votre [realm]."
 consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.Custom('FR_le_Char_U_Pi')|U][religious_authority.GetShortUIName] peut encore refuser de consacrer votre [kingdom|El], ce qui annulerait cette [decision|El] !#!"
 consecrated_king_ai_behavior_large_tt: "#EMP #weak Se montrera plus fervent et plus juste#!#!"
 consecrated_king_modifier: "Premier des monarques consacrés"
 consecrated_king_modifier_small: "$consecrated_king_modifier$"
 consecrated_king_modifier_desc: "Un royaume sacré a été établi afin que ce personnage puisse régner. Son pouvoir est d’origine divine."
 consecrated_king_modifier_small_desc: "$consecrated_king_modifier_desc$"
 pam_decision_events.0030.b.decline: "[religious_authority.Custom('FR_le_Char_L')|U][religious_authority.GetTitleAsName] vilipende votre royaume"
 pam_decision_events.0030.opening: "Très saint[religious_authority.Custom('FR_E')] [religious_authority.GetMotherFather|U],"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName] n’élève que quelques rares élus pour veiller sur Ses enfants [religious_authority.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip], comme souverains gardiens des terres magnifiques accordées à l’humanité.\n\nJe demande à être de ces bienheureux. Érigez un royaume de [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], et je le défendrai contre tous les maux."
 pam_decision_events.0030.a: "Un nouveau royaume [religious_authority.GetFaith.GetReligion.GetAdherentNameNoTooltip] est consacré."
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName] n’a pas de tels projets pour vous, [king_aspirant.GetFirstNameNoTooltip]..."
 pam_decision_events.0031.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] de foi [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 pam_decision_events.0031.desc.self_crowning: "Quelle terre a été plus bénie que [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ? Quel fief mérite davantage les faveurs royales ? [ROOT.Char.GetFaith.WarGodName|U] n’a-t-Il pas protégé son peuple du mal et préservé mon saint siège au sein de ses frontières ?\n\nEn vertu de la volonté [ROOT.Char.GetFaith.HighGodNamePossessive], j’ai consacré le [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Je suis désormais [Select_CString(ROOT.Char.IsFemale,'le saint gardien','la sainte gardienne')] de cette terre, et ma volonté ne sera plus jamais bafouée.\n\nVassaux et fidèles, mettez-vous à genoux ! Les bons [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural] savent adorer leur [ROOT.Char.GetTitleAsName]."
 pam_decision_events.0031.desc_three_duchies: "Par décret [religious_authority.Custom('FR_du_Char_Pi')][religious_authority.GetTitledFirstNameRegnal], les terres de mon pays s’alignent telles des étoiles prédestinées dans le ciel en perpétuel mouvement. De l’union bénie de [duchy_1.GetName], [duchy_2.GetName] et [duchy_3.GetName] naît l’estimable [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nEt, doté[ROOT.Char.Custom('FR_E')] d’une âme juste et méritante, un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsName|l] fait son apparition ! C’est par le mandat [religious_authority.Custom('FR_du_Char_L')][religious_authority.GetTitleAsNameNoTooltip] que je suis élevé[ROOT.Char.Custom('FR_E')], et c’est désormais sous son autorité que je dois régner."
 pam_decision_events.0031.desc: "Par décret [religious_authority.Custom('FR_du_Char_Pi')][religious_authority.GetTitledFirstNameRegnal], un nouveau [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] est inscrit dans les annales. [ROOT.Char.GetFaith.PriestNeuterPlural|U] et le peuple m’acclament et m’élèvent dans l’exultation ! Tant que [ROOT.Char.GetPrimaryTitle.GetNameNoTier] échappera à l’emprise des païens et des hérétiques, je demeurerai s[ROOT.Char.Custom('FR_OnA')] légitime [ROOT.Char.GetTitleAsName|l] [ROOT.Char.GetFaith.Custom('FR_FaithGenderedAdj')].\n\n[religious_authority.Custom('FR_le_Char_L')|U][religious_authority.GetTitleAsNameNoTooltip], [Select_CString(religious_authority.IsFemale,'ma créatrice','mon créateur')], a comblé de ses grâces ce modeste pays... et ne manquera certainement pas de prendre intérêt à mes accomplissements royaux."
 pam_decision_events.0031.a: "Que [ROOT.Char.GetFaith.HighGodName] aime à jamais mon [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 any_landed_duchy_title_tt: "Au moins un [duchy|El] que vous détenez est un [title|El] [landed|El] #weak #EMP (Ni une [clerical_region|El] ni une [noble_family|El])#!#!"
