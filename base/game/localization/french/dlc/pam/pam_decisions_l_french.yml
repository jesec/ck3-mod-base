 pam_prohibit_tenet_decision_desc: "Une doctrine qui s’écarte du droit chemin doit être désignée comme telle. [Concept('prohibited_tenet_status', 'Interdisez')|E] un [core_tenet|El], afin que les croyants puissent s’en tenir à l’écart."
