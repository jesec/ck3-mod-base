 pam_decision_events.0019.t: "Défenseur des pèlerins"
 pam_decision_events.0019.desc: "Une lettre sera envoyée à tous les [ROOT.Char.GetFaith.GetAdherentNamePlural] avec le message suivant :\n\n« Les chemins menant aux lieux saints sont désormais dangereux. Que chacun sache que les fidèles pourront porter des armes lors de leurs pèlerinages et qu’ils pourront se défendre contre quiconque se mettra en travers de leur chemin vers le paradis. »"
 pam_decision_events.0019.a: "Ô Seigneur, fortifie nos armes."
 pam_decision_events.0018.opening: "Aux [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de tous les pays,"
 pam_decision_events.0018.desc.armed_pilgrimages: "J’ai apposé mon sceau sur cette affaire. À compter d’aujourd’hui, les [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )|l] seront l’un des principes fondamentaux de la foi [hof_scope.GetFaith.GetAdjective].\n\nQue tous les dirigeants de la foi y prêtent attention."
 pam_decision_events.0018.desc.struggle_submission: "J’ai apposé mon sceau sur cette affaire. À compter d’aujourd’hui, [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )|l] sera l’un des principes fondamentaux de la foi [hof_scope.GetFaith.GetAdjective].\n\nQue tous les dirigeants de la foi y prêtent attention."
 pam_decision_events.0018.a: "Ainsi soit-il."
 pam_decision_events.0017.t: "Ériger un khatchkar ancestral"
 pam_decision_events.0017.desc: "J’ai choisi un endroit en hauteur d’où la croix de pierre veillera sur [khachkar_location.GetNameNoTier].\n\nJe vais laisser les maîtres sculpteurs créer une œuvre véritablement édifiante en mémoire [khachkar_ancestor.Custom('FR_du_Char_Pi')][khachkar_ancestor.GetTitledFirstNameNicknamed]. Une croix entourée de rosaces, d’ornements et d’une inscription par laquelle s[khachkar_ancestor.Custom2('FR_RelationToMeShort_OnA', ROOT.Char)] a honoré sa mémoire.\n\nQue les pèlerins de la région prient à ses pieds et que tous voient que notre règne sur ces terres est juste."
 pam_decision_events.0017.a: "Que cette croix traverse les âges."
 pam_decision_events.0017.b: "Le moment n’est pas propice."
