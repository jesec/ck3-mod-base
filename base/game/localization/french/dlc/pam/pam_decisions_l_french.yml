 pam_permit_tenet_decision_desc: "Un enseignement qui, depuis longtemps, circule en marge de notre foi mérite d’être mis en lumière par une approbation officielle. Accordez la bénédiction [ROOT.Char.GetFaith.HighGodNamePossessive] à ce [core_tenet|El] et [Concept('permitted_tenet_status', 'autorisez')|E]-le."
