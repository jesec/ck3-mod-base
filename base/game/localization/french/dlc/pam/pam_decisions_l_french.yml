l_french:
 pam_invite_syncretic_exiles_decision: "Inviter des exilés syncrétiques"
 pam_invite_syncretic_exiles_decision_desc: "Les communautés religieuses persécutées, que nous respectons, sont à la recherche d’un foyer sûr. Je les invite à s’installer dans mon pays et à partager leurs traditions avec nous."
 pam_invite_syncretic_exiles_decision_tooltip: "Invitez des exilés issus d’une famille religieuse reconnue par votre syncrétisme personnel. Cela augmente le [development|El] tout en modifiant la [faith|El] ou le [rite|El] locaux.\n\nCela coûte une grande quantité de [piety|El]."
 pam_invite_syncretic_exiles_decision_confirm: "Inviter des exilés"
 pam_invite_syncretic_exiles_decision_effect: "Des exilés viendront vous demander de s’installer dans vos [counties|El], augmentant ainsi le [development|El] tout en changeant la [faith|El] ou le [rite|El] locaux."
 pam_invite_syncretic_exiles_no_pool: "Il n’y a pas d’exilés religieux correspondants que vous puissiez inviter"
 SELECT_TENET: "Choisir le principe"
 REPLACE_TENET: "Remplacer le principe"
 SELECT_HOLY_SITE: "Choisir le lieu saint"
 puppet_cost_desc: "[Character.GetName],"
 pam_decision_confession_name: "Se confesser"
 pam_decision_confession_name_low: "Confesser mes péchés"
 pam_decision_confession_desc: "Lorsque quelqu’un prend conscience de la culpabilité qui pèse sur lui, il doit confesser ses péchés."
 pam_decision_confession_tooltip: "Confessez vos péchés"
 pam_decision_confession_tooltip_sp_effect: "Vous gagnerez de l’[spiritual_fulfillment|El]"
 pam_decision_confession_tooltip_stress_effect: "Vous perdrez du [stress|El]"
 pam_decision_confession_confirm: "Faites venir un [ROOT.Char.GetFaith.PriestNeuter] !"
 sp_confession_decision_tooltip: "Votre [spiritual_fulfillment|El] est d’au moins #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_confession_sp_court_chaplain: "Vous employez un [court_chaplain|El]"
 pam_decision_events.0001.t: "Confession"
 pam_decision_events.0001.desc.intro: "[chaplain.Custom('FR_le_Char_Pi')|U][chaplain.GetTitledFirstName] attend patiemment dans la chapelle vide.\n\n"
 pam_decision_events.0001.desc.bad: "Son regard sévère ressemble à celui que j’imagine chez le Père."
 pam_decision_events.0001.desc.good: "Même si le poids qui pèse sur mes épaules n’est pas accablant, on peut tout de même l’alléger."
 pam_decision_events.0001.desc.neutral: "Perdu[ROOT.Char.Custom('FR_E')] tel un mouton égaré, doutant de la bonté de mon cœur, je m’approche d[chaplain.Custom('FR_EluiElle')]."
 pam_decision_events.0001.desc.sin.preamble: "\n\nLa culpabilité en raison de mes péchés ne m’est pas étrangère."
 pam_decision_events.0001.desc.sin.lustful: "J’ai laissé la luxure asservir ma volonté."
 pam_decision_events.0001.desc.sin.chaste: "J’ai fait de ma chasteté un prétexte pour me dérober à mon devoir."
 pam_decision_events.0001.desc.sin.gluttonous: "J’ai nourri ma chair sans mesure ni retenue."
 pam_decision_events.0001.desc.sin.temperate: "Ma tempérance s’est changée en refus de pourvoir aux besoins légitimes."
 pam_decision_events.0001.desc.sin.greedy: "Je me suis attaché[ROOT.Char.Custom('FR_E')] à mon or quand il m’eût fallu le donner."
 pam_decision_events.0001.desc.sin.generous: "Ma générosité a outrepassé la sagesse, et m’a laissé[ROOT.Char.Custom('FR_E')] sans ressources."
 pam_decision_events.0001.desc.sin.lazy: "La paresse m’a détourné[ROOT.Char.Custom('FR_E')] de la prière et du devoir."
 pam_decision_events.0001.desc.sin.diligent: "Mon zèle au labeur a étouffé la miséricorde en mon cœur."
 pam_decision_events.0001.desc.sin.wrathful: "La colère m’a conduit[ROOT.Char.Custom('FR_E')] au péché."
 pam_decision_events.0001.desc.sin.calm: "Sous le masque de la vertu, mon calme n’était qu’indifférence."
 pam_decision_events.0001.desc.sin.patient: "Ma patience n’était que prétexte à différer ce que je devais faire."
 pam_decision_events.0001.desc.sin.impatient: "L’impatience m’a rendu dur[ROOT.Char.Custom('FR_E')] et imprudent[ROOT.Char.Custom('FR_E')]."
 pam_decision_events.0001.desc.sin.arrogant: "L’orgueil m’a fait me croire supérieur[ROOT.Char.Custom('FR_E')] aux autres."
 pam_decision_events.0001.desc.sin.humble: "Une fausse humilité m’a tenu[ROOT.Char.Custom('FR_E')] éloigné[ROOT.Char.Custom('FR_E')] de la vérité."
 pam_decision_events.0001.desc.sin.deceitful: "J’ai proféré des mensonges et omis ce que je devais dire en toute honnêteté."
 pam_decision_events.0001.desc.sin.honest: "Ma franchise sans ménagement a blessé là où la douceur était due."
 pam_decision_events.0001.desc.sin.craven: "La peur m’a fait renoncer à ce qui était juste."
 pam_decision_events.0001.desc.sin.brave: "Mon audace s’est changée en folle témérité."
 pam_decision_events.0001.desc.sin.shy: "Ma timidité m’a empêché[ROOT.Char.Custom('FR_E')] d’accomplir le bien qui m’incombait."
 pam_decision_events.0001.desc.sin.gregarious: "Mon désir de plaire et d’être entouré[ROOT.Char.Custom('FR_E')] m’a fait taire ma conscience."
 pam_decision_events.0001.desc.sin.ambitious: "Mon ambition a étouffé mes scrupules."
 pam_decision_events.0001.desc.sin.content: "Le contentement de mon sort a émoussé ma soif de justice."
 pam_decision_events.0001.desc.sin.arbitrary: "J’ai gouverné selon mon caprice plutôt que selon la justice."
 pam_decision_events.0001.desc.sin.just: "Ma justice fut sans miséricorde et entachée d’orgueil."
 pam_decision_events.0001.desc.sin.cynical: "Le cynisme a rongé ma foi."
 pam_decision_events.0001.desc.sin.zealous: "Mon zèle s’est embrasé plus fort que ma charité."
 pam_decision_events.0001.desc.sin.paranoid: "La suspicion a empoisonné mes rapports avec autrui."
 pam_decision_events.0001.desc.sin.trusting: "Ma confiance m’a rendu[ROOT.Char.Custom('FR_E')] aveugle à la perversité."
 pam_decision_events.0001.desc.sin.compassionate: "La pitié m’a conduit[ROOT.Char.Custom('FR_E')] à absoudre ce qui devait être condamné."
 pam_decision_events.0001.desc.sin.callous: "J’ai endurci mon cœur devant la souffrance d’autrui."
 pam_decision_events.0001.desc.sin.stubborn: "Mon entêtement m’a [Select_CString(ROOT.Char.IsFemale,'rendue sourde','rendu sourd')] à toute correction."
 pam_decision_events.0001.desc.sin.fickle: "Mon inconstance a rendu ma parole indigne de confiance."
 pam_decision_events.0001.desc.sin.eccentric: "Mes manières singulières ont scandalisé les fidèles."
 pam_decision_events.0001.desc.sin.vengeful: "La vengeance m’a consumé[ROOT.Char.Custom('FR_E')]."
 pam_decision_events.0001.desc.sin.forgiving: "J’ai accordé trop aisément mon pardon à de graves offenses."
 pam_decision_events.0001.desc.sin.sadistic: "J’ai pris plaisir à la cruauté."
 pam_decision_events.0001.desc.outro: "\n\n« [Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')] »"
 pam_decision_events.0001.a: "Pardonnez-moi, [Select_CString(chaplain.IsFemale,'ma mère','mon père')], car j’ai péché."
 pam_john_20_22_english: "Après ces paroles, il souffla sur eux et leur dit : « Recevez le Saint-Esprit ! Ceux à qui vous pardonnerez les péchés, ils leur seront pardonnés ; ceux à qui vous les retiendrez, ils leur seront retenus. »"
 JOHN_20_22_GLOSS: "#weak Jean 20:22-23#!"
 pam_decision_act_of_devotion: "Organiser une démonstration de dévotion"
 pam_decision_act_of_devotion_desc: "Mon attachement profond [ROOT.Char.GetFaith.HighGodName2] est si fort que je dois l’extérioriser !\n\nConvoquez les [ROOT.Char.GetFaith.PriestNeuterPlural], célébrez une grande messe et rassemblez tous les habitants du pays. Qu’ils voient à quel point leur [Select_CString(ROOT.Char.IsFemale,'dame','seigneur')] lige est dévoué[ROOT.Char.Custom('FR_E')]."
 pam_decision_act_of_devotion_desc_tooltip: "Échanger de la [piety|El] pour du [prestige|El]"
 pam_decision_act_of_devotion_tooltip_effect: "Vous choisirez entre :\n$BULLET_WITH_TAB$ #P [EmptyScope.ScriptValue('major_prestige_gain')|0]#![prestige_i] en [prestige|El]\n$BULLET_WITH_TAB$ #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#![prestige_i] en [prestige|El] et un [prestige_level|El] supplémentaire en échange d’un [piety_level|El]"
 pam_decision_act_of_devotion_confirm: "Faites retentir les cloches !"
 pam_decision_act_of_devotion_sp_tooltip: "Votre [spiritual_fulfillment|El] est d’au moins #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "Votre [prestige_level|El] doit être en dessous de [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]"
 pam_confession_penalty_modifier: "Conséquence de la confession"
 pam_confession_penalty_modifier_desc: "Ce personnage doit faire une action à la demande de son confesseur."
 pam_meddled_in_clerical_appointments_modifier: "S’immiscer dans la nomination des religieux"
 pam_meddled_in_clerical_appointments_modifier_desc: "Ce [ruler|El] a remplacé de force le [holder|El] d’un [clerical_title|El], provoquant l’ire du [clergy|El]."
 pam_kowtowed_to_pope_modifier: "Se prosterner devant l’Église"
 pam_kowtowed_to_pope_modifier_desc: "Ce [ruler|El] s’est prosterné devant l’Église et s’engage à soutenir la doctrine #EMP Spirituelle et révocable#! au concile qui mettra un terme à la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]. Elle sera supprimée dès que le concile aura pris sa décision."
 pam_kowtow_to_pope_decision: "Se prosterner devant le [ROOT.Char.GetFaith.ReligiousHeadName|l]"
 pam_kowtow_to_pope_decision_desc: "La couronne et la crosse s’opposent pour savoir qui nommera les titulaires des charges ecclésiastiques. Plutôt que de risquer un conflit, prosternez-vous devant le [ROOT.Char.GetFaith.ReligiousHeadName] et restez aux côtés des fidèles quand le concile sera appelé pour rendre sa décision."
 pam_kowtow_to_pope_decision_tooltip: "Engagez-vous à soutenir l’Église pour les nominations"
 pam_kowtow_to_pope_decision_confirm: "Se prosterner"
 pam_kowtow_to_pope_effect_tt: "Vous soutiendrez la doctrine #EMP Spirituelle et révocable#! au concile qui mettra un terme à la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]"
 pam_kowtow_to_pope_not_already_pledged_tt: "Vous ne vous êtes pas encore engagé[ROOT.Char.Custom('FR_E')] à soutenir l’Église"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "Votre [faith|El] doit avoir un [Concept('head_of_faith', 'chef')|E]"
 pam_kowtow_to_pope_toast: "Vous vous prosternez devant le [ROOT.Char.GetFaith.ReligiousHeadName|l]"
 pam_decision_events.0001.a.confession_random_outcome: "Votre [court_chaplain|El] pourrait vous demander quelque chose, ou vous pourriez entendre quelque chose pendant la confession..."
 pam_decision_events.0001.a.piety: "Votre confession a semblé sincère"
 pam_decision_events.0001.a.hook: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] a appris des informations"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] désapprouve vos traits pécheurs"
 pam_decision_events.0001.a.courtier_secret: "Vous entendez [my_courtier.Custom('FR_le_Char_U_Pi')][my_courtier.GetShortUIName] se confesser"
 pam_decision_events.0001.a.random_confession: "Vous entendez quelqu’un d’autre se confesser"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] vous demande de partir en [pilgrimage|El]"
 pam_decision_events.0001.a.high_almoner: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] vous demande d’embaucher un [GetCourtPositionType('high_almoner_court_position').GetName()|l]"
 pam_decision_events.0001.a.no_war: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] vous demande de ne déclarer aucune guerre offensive pendant #V 5 ans#!"
 pam_confession_penalty_var.no_war_toast: "Vous avez promis de ne déclarer aucune guerre"
 pam_decision_events.0001.a.conversion: "[chaplain.Custom('FR_le_Char_U_Pi')|U][chaplain.GetShortUIName] vous demande de convertir [target.Custom('FR_le_Char_U_Pi')][target.GetShortUIName]"
 pam_decision_events.0001.a.conversion.toast: "Vous avez tenu votre promesse"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName] a tenu sa promesse"
 pam_decision_events.0002.t: "Une démonstration de dévotion"
 pam_decision_events.0002.desc.intro: "[my_chaplain.Custom('FR_le_Char_Pi')|U][my_chaplain.GetTitledFirstName] se tient à mes côtés, près de l’autel. Les doux rayons du soleil baignent"
 pam_decision_events.0002.desc.uncrowned: "mes vêtements d’une lueur sacrée."
 pam_decision_events.0002.desc.crowned: "ma couronne comme un halo."
 pam_decision_events.0002.desc.mid: "\n\n« #EMP [ROOT.Char.Custom('RandomBibleQuote')]#! ... » Son sermon n’en finit tout simplement pas,"
 pam_decision_events.0002.desc.bad: "et je m’efforce de rester [Select_CString(ROOT.Char.IsFemale,'attentive','attentif')]."
 pam_decision_events.0002.desc.good: "alors que l’auditoire semble se concentrer uniquement sur moi."
 pam_decision_events.0002.desc.neutral: "tandis que je scrute l’auditoire à la recherche de visages impressionnés."
 pam_decision_events.0002.desc.outro: "\n\n« En ces temps difficiles, notre sage et [Select_CString(ROOT.Char.IsFemale,'vertueuse','vertueux')] [ROOT.Char.GetNameNoTooltip] nous guidera. »"
 pam_decision_events.0002.a: "Je dois m’adresser moi-même à la foule."
 pam_decision_events.0002.b: "Une simple confirmation suffit."
 pam_mentor_sp_decision: "Offrir un accompagnement spirituel"
 pam_mentor_sp_decision_desc: "Nous qui marchons dans la lumière [ROOT.Char.GetFaith.HighGodNamePossessive] avons le devoir de guider ceux qui se sont égarés dans les ténèbres, et ceux dont la jeunesse pourrait les amener à s’égarer dans la pensée ou les actes."
 pam_mentor_sp_decision_desc_tooltip: "Aider un enfant avec son [spiritual_fulfillment|El]"
 pam_mentor_sp_decision_confirm: "Parlez et écoutez."
 pam_mentor_sp_decision_sp_tooltip: "Votre [spiritual_fulfillment|El] est d’au moins #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_mentor_sp_decision_tooltip_effect: "Vous augmenterez l’[spiritual_fulfillment|El] de votre [primary_heir|El] ou [favorite_child|El]"
 pam_mentor_sp_decision_valid_child_tt: "Vous devez avoir un [child|El] qui :\n$BULLET_WITH_TAB$A la même [faith|El] que vous\n$BULLET_WITH_TAB$A au moins #V 16#! ans\n$BULLET_WITH_TAB$Est soit votre [primary_heir|El] soit votre [favorite_child|El]\n$BULLET_WITH_TAB$A un [spiritual_fulfillment|El] inférieur à #V 75#!\n$BULLET_WITH_TAB$N’a pas reçu d’accompagnement spirituel auparavant"
 pam_mentor_sp_decision_primary_heir_tt: "Votre [primary_heir|El] doit : $pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "Principal héritier"
 pam_mentor_sp_decision_primary_favorite_child_tt: "Votre [favorite_child|El] doit : $pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "Enfant préféré"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$Avoir la même [faith|El] que vous\n$BULLET_WITH_TAB$Avoir au moins #V 16#! ans\n$BULLET_WITH_TAB$Avoir un [spiritual_fulfillment|El] inférieur à #V 75#!\n$BULLET_WITH_TAB$Ne pas avoir reçu d’accompagnement spirituel auparavant"
 pam_decision_events.0003.t: "La leçon la plus importante"
 pam_decision_events.0003.desc.intro: "La nuit est tombée et le silence règne dans le donjon. [Select_CString(target_child.IsFemale,'Ma fille','Mon fils')] est assis[target_child.Custom('FR_E')] à côté de moi dans la chapelle privée.\n\nJe [target_child.Custom('FR_LeLa')] regarde."
 pam_decision_events.0003.desc.bad: "[target_child.Custom('FR_IlElle')|U] se tient là, le regard indifférent, l’air presque endormi[target_child.Custom('FR_E')].\n\n« [ROOT.Char.GetMotherFather|U] », commence-t-[target_child.Custom('FR_IlElle')] avec impatience, « pourquoi m’avez-vous fait venir ici ? »"
 pam_decision_events.0003.desc.good: "Ses yeux brillent à la lueur des bougies. C’est [Select_CString(target_child.IsFemale,'une bonne fille','un bon garçon')].\n\n« [ROOT.Char.GetMotherFather|U], vous ai-je fait du tort ? » demande-t-[target_child.Custom('FR_IlElle')]."
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('FR_IlElle')|U] a désormais l’âge.\n\n« [ROOT.Char.GetMotherFather|U], que faut-il faire pour vivre dans la droiture ? » demande-t-[target_child.Custom('FR_IlElle')] à voix basse."
 pam_decision_events.0003.a: "Un [ROOT.Char.GetTitleAsNameNoTooltip|l] corrompu finira par empoisonner son pays."
 pam_decision_events.0003.b: "Soyez simplement... bienveillant[ROOT.Char.Custom('FR_E')]."
 grudge_pressured_me_sp: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a gardé rancune contre [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] pour avoir été mis[CHARACTER.Custom('FR_E')] sous pression en raison de son épanouissement spirituel."
 grudge_pressured_me_sp_corresponding: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a fait l’objet de rancune de la part [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] pour l’avoir mis[TARGET_CHARACTER.Custom('FR_E')] sous pression en raison de son épanouissement spirituel."
 pam_decision_events.0003.after_tt: "Quelque chose pourrait être révélé à propos de [target_child.GetFirstName]..."
 pam_decision_events.0003.secret: "[target_child.Custom('FR_le_Char_U_Pi')|U][target_child.GetShortUIName] se confie à vous"
 pam_decision_events.0003.mystic: "[target_child.Custom('FR_le_Char_U_Pi')|U][target_child.GetShortUIName] s’intéresse beaucoup à cette question"
 pam_decision_events.0003.learning: "[target_child.Custom('FR_le_Char_U_Pi')|U][target_child.GetShortUIName] améliore ses connaissances"
 pam_decision_events.0003.education: "[target_child.Custom('FR_le_Char_U_Pi')|U][target_child.GetShortUIName] améliore son instruction"
 pam_decision_events.0003.stress: "[target_child.Custom('FR_le_Char_U_Pi')|U][target_child.GetShortUIName] traverse une crise"
