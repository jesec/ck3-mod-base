 pam_kingdom_of_heaven.0001.t: "Le Royaume des Cieux"
 pam_kingdom_of_heaven.0001.desc: "« Voici à quoi ressemble le royaume de Dieu. Il est semblable à un homme qui jette de la semence en terre ; qu’il dorme ou qu’il reste éveillé, nuit et jour, la semence germe et pousse sans qu’il sache comment. »\n\nJe tourne mon corps vers la chrétienté. Dans ma main, je tiens de la terre de la Terre sainte.\n\n« D’elle-même la terre produit d’abord l’herbe. » J’ouvre la main et la terre se disperse dans l’air. « Puis l’épi. » Je désigne mon peuple. « Enfin, le grain tout formé dans l’épi. » Je lève ma crosse.\n\n« Dès que le fruit est mûr, on y met la faucille, car c’est le moment de la moisson. »"
 pam_kingdom_of_heaven.0001.a: "Je n’abandonnerai pas [previous_capital.GetNameNoTooltip]."
 pam_kingdom_of_heaven.0001.b: "Que représente donc le siège de Pierre comparé au siège du Christ ?"
