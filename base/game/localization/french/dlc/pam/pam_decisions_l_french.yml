 pam_decision_events.0008.t: "Prélever la dîme"
 pam_decision_events.0008.desc.intro: "Des coffres débordants sont disposés dans les [ROOT.Char.GetFaith.HouseOfWorshipPlural] de mon pays. Le bruit des pas de mes gardes qui se dirigent vers les temples sera bientôt accompagné du tintement des pièces.\n\n"
 pam_decision_events.0008.desc.chaplain: "« [ROOT.Char.Custom('FR_le_Char_L')|U][ROOT.Char.GetTitleAsNameNoTooltip] prend-[ROOT.Char.Custom('FR_IlElle')] maintenant plaisir à humilier les serviteurs [ROOT.Char.GetFaith.HighGodNamePossessive] ? rétorque [chaplain.Custom('FR_le_Char_Pi')][chaplain.GetTitledFirstName]. Cela vous fait-il plaisir de laisser Sa maison nue comme une fille des rues crasseuse ? »"
 pam_decision_events.0008.desc.fallback: "Les [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] détournent le regard, dégoûtés. Les serviteurs [ROOT.Char.GetFaith.HighGodNamePossessive] semblent terriblement attachés à leur or."
