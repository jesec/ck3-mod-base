 pam_founded_kingdom_of_heaven_modifier: "Le sang de la nouvelle Jérusalem"
 pam_proclaim_living_word_decision: "Proclamer la Parole vivante"
 pam_proclaim_living_word_decision_desc: "Les fidèles murmurent que [ROOT.Char.GetFaith.HighGodName] m’a désigné[ROOT.Char.Custom('FR_E')]. Les pèlerins prononcent mon nom devant les sanctuaires au bord des chemins, et les [ROOT.Char.GetFaith.PriestNeuterPlural] citent mes sentences comme s’il s’agissait des Écritures.\n\nQue cela soit proclamé depuis chaque autel : par moi se fait connaître la Parole vivante."
