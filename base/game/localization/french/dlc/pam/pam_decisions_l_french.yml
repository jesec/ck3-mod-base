 declare_yourself_antipope_decision_caliph: "Défier le calife"
 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] est une personnalité distante, indigne, mal préparée à diriger la foi [ROOT.Char.GetFaith.GetAdjective]. Malgré tout le savoir qu’[ROOT.Char.GetFaith.GetReligiousHead.Custom('FR_IlElle')] revendique, [ROOT.Char.GetFaith.GetReligiousHead.Custom('FR_IlElle')] ne #EMP comprend#! tout simplement pas nombre de vérités subtiles de la pensée [ROOT.Char.GetFaith.GetAdjective].\n\n[ROOT.Char.GetFaith.GetReligiousHead.Custom('FR_LuiElle')|U] non, mais #EMP moi#! si..."
