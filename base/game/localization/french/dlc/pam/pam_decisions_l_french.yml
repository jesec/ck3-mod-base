 pam_decision_events.0020.desc: "Après une messe en [clerical_region.GetName], j’ai réuni un groupe de fidèles pour écouter la Parole [ROOT.Char.GetFaith.HighGodNamePossessive] par mon intermédiaire. J’ai choisi un passage [ROOT.Char.GetFaith.ReligiousText3] pour leur enseigner mes croyances concernant [selected_item.GetName( actor.GetRite )] :\n\n« [ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')] »"
 pam_decision_events.0020.a: "Je consacrerai le reste de ce texte à d’autres seigneurs."
