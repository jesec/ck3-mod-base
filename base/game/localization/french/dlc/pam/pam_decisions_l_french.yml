 pam_decision_last_rites_name: "Recevoir les derniers sacrements"
 pam_decision_last_rites_name_low: "Recevoir les derniers sacrements"
 pam_decision_last_rites_desc: "#EMP Aie pitié de moi, ô [ROOT.Char.GetFaith.HighGodName] ! Conformément à ta grande compassion, efface mes transgressions ! Lave-moi de ma faute et purifie-moi de mon péché !#!\n\nCompte tenu de mon départ imminent de cette existence terrestre, j’espère pouvoir mener mon âme vers un état d’harmonie. À l’abri de l’influence infernale, puissé-je trouver une bonne mort et obtenir la vie éternelle, accueilli[ROOT.Char.Custom('FR_E')] dans le Royaume des Cieux."
 pam_decision_last_rites_tooltip: "Préparez votre âme au grand départ"
 pam_decision_last_rites_tooltip_sp_effect: "Vous gagnerez de l’[spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 pam_decision_last_rites_confirm: "Rassemblez-vous près de mon lit"
 pam_decision_last_rites_sp_tooltip: "Votre [spiritual_fulfillment|El] est d’au moins #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_doctrine_tt: "La [faith|El] doit avoir la [doctrine|El] [GetDoctrineType('doctrine_sacraments_central').GetBaseName]"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X Si vous ne recevez pas les derniers sacrements :\n$BULLET_WITH_TAB$Vous perdez [EmptyScope.ScriptValue('massive_legitimacy_gain')][legitimacy_i]\n$BULLET_WITH_TAB$$every_zealot_vassal$ :\n$TAB$$BULLET_WITH_TAB$Perd #N 30#! d’[opinion|El] envers #V vous#! #!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Vous devrez peut-être révéler un [secret|El]"
 pam_decision_events.0005.details: "Vous aurez l’occasion de [Concept('lease', 'bailler à rente')|E] des [titles|El], ou si vous n’en avez pas de disponibles, donner de l’[gold|El] à des [monastic_holy_orders|El], [holy_orders|El] ou l’[the_christian_church|E] – cela apportera des [modifiers|El] bénéfiques pour votre [player_heir|El]"
 pam_decision_events.0005.t: "Derniers sacrements : ma dernière heure"
 pam_decision_events.0005.desc.healthtrait: "Le péché m’a rendu[ROOT.Char.Custom('FR_E')] ainsi – [death_trait.GetName(soon_dead)|l] – et c’est sans doute la cause de ma mort imminente."
 pam_decision_events.0005.desc.bad: "J’ai eu du mal à honorer [ROOT.Char.GetFaith.HighGodName]. Dans mon arrogance, j’ai tenté de dissimuler mes péchés à ses yeux qui voient tout.\n\n"
 pam_decision_events.0005.desc.good: "Heureusement, j’ai le sentiment que des anges sont près de moi et protègent mon âme contre les démons qui veulent s’en emparer.\n\n"
 pam_decision_events.0005.desc.neutral: "Bien que je me sois efforcé[ROOT.Char.Custom('FR_E')] d’honorer [ROOT.Char.GetFaith.HighGodName], j’approche du seuil de l’éternité et m’inquiète de savoir si mon âme sera jugée digne de son Royaume céleste.\n\n"
 pam_decision_events.0005.desc.notalone: "À mon chevet se trouvent m[fam_or_friend_1.Custom('FR_OnA')] [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))] [fam_or_friend_1.GetFirstName] et d’autres personnes qui prieront pour mon âme."
 pam_decision_events.0005.desc.alone: "Je tremble de peur, [Select_CString(ROOT.Char.IsFemale,'toute seule','tout seul')], sans aucun proche à mes côtés pour prier pour mon âme."
 pam_decision_events.0005.desc.outro: "[Select_CString(confessor.IsFemale,'Ma confesseuse','Mon confesseur')], le [Glossary('sacramentaire','SACRAMENTARY_GLOSS')] à la main, me conseille : « Présentez-vous devant [ROOT.Char.GetFaith.HighGodName] sans faux-semblants ! »\n\nMême le roi David, qui était couvert de péchés, a été purifié après sa confession... [Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "Le sacrement de la pénitence approche."
 pam_decision_events.0005.b: "Que le diable m’emporte ! Débarrassez-moi de ce prêtre !"
 pam_psalm_51_english: "« C’est contre toi seul ... que j’ai péché, j’ai fait ce qui est mal à tes yeux ... Ainsi, ton jugement est juste, et tu es intègre en tant que juge. »"
 SACRAMENTARY_GLOSS: "Les sacramentaires ou livres liturgiques étaient des ouvrages utilisés par les évêques ou les prêtres chrétiens lors des célébrations liturgiques. Selon l’époque et la région, ils pouvaient contenir des textes récités ou chantés, ainsi que des textes relatifs aux sacrements."
 pam_decision_events.0006.t: "Derniers sacrements : mon péché me hante sans cesse"
 pam_decision_events.0006.intro: "« L’erreur est humaine. Mais sans confession, il ne peut y avoir d’absolution », déclare [confessor.Custom('FR_le_Char_Pi')][confessor.GetTitledFirstName]."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\nMes péchés sont nombreux et graves. Mon âme est accablée et prisonnière des griffes brûlantes de Satan. Il cherche à s’approprier ce qui lui appartient manifestement.\n\n"
 pam_decision_events.0006.desc.good: "\n\nMon cœur est léger, car j’ai agi conformément à la volonté du Seigneur.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nMalgré toutes mes bonnes intentions, le péché m’a rattrapé[ROOT.Char.Custom('FR_E')].\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "Combien de fois ma nature [my_sinful_trait.GetName(soon_dead)|l] m’a-t-elle égaré[ROOT.Char.Custom('FR_E')] !"
 pam_decision_events.0006.desc.secret_sin: "J’ai dissimulé mon existence en tant que [my_secret.GetName|l] dans un havre d’obscurité."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "Le pire, c’est peut-être que je suis un [my_criminal_trait.GetName(soon_dead)|l] ! Ma culpabilité écrasante m’empêche de respirer."
 pam_decision_events.0006.desc.sin_default: "Mes péchés, bien qu’ils soient assurément nombreux, ont du mal a me revenir en mémoire. Je suis sûr[ROOT.Char.Custom('FR_E')] qu’ils me viendront aux lèvres comme une digue qui cède dès que je parlerai [confessor.Custom('FR_au_Char_Pi')][confessor.GetTitledFirstNameNoTooltip]."
 pam_decision_events.0006.desc.sin_default_good_sp: "Puisse [ROOT.Char.GetFaith.HighGodName] broyer mes os et anéantir l’injustice."
 pam_decision_events.0006.desc.outro: "Ce n’est qu’en confessant mes péchés avec un repentir sincère que je peux recevoir l’Eucharistie."
 pam_decision_events.0006.a: "« Pardonnez-moi, [confessor.GetMotherFather|U]... »"
 pam_decision_events.0006.b: "J’emporterai certains péchés dans la tombe."
 pam_decision_events.0006.b.flavor: "Vous confessez certes certains péchés, mais taisez des secrets qui pourraient accabler d’autres personnes."
 pam_decision_events.0007.t: "Derniers sacrements : chair, sang et huile"
 pam_decision_events.0007.intro: "Ainsi s’achève le règlement de mes péchés. C’est une chose que de devoir un seul denier, et une tout autre que de devoir dix mille talents.\n\nMon confesseur me tend le pain et le vin consacrés."
 pam_decision_events.0007.desc.bad: "Même maintenant, alors qu’on m’offre la chair et le sang de mon Seigneur, j’entends les murmures des démons. Ils me supplient de leur céder mon âme, afin que je puisse continuer à vivre et m’adonner aux plaisirs terrestres.\n\n"
 pam_decision_events.0007.desc.good: "Après m’être libéré[ROOT.Char.Custom('FR_E')] de mon fardeau, je me jette dans les bras de la mort. Je désire ardemment recevoir la chair et le sang de mon Seigneur, aux côtés duquel je serai bientôt.\n\n"
 pam_decision_events.0007.desc.neutral: "Que la chair et le sang du Seigneur me protègent des démons qui, tels des loups, guettent pour m’emporter avant l’heure.\n\n"
 pam_decision_events.0007.desc.oil.intro: "Puis [confessor.Custom('FR_IlElle')] oint mon front, mes mains et mes pieds avec de l’huile sainte."
 pam_decision_events.0007.desc.oil.bad: "Mon âme est toujours en proie à l’agitation.\n\n"
 pam_decision_events.0007.desc.oil.good: "L’amour du Seigneur illumine mon âme.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "Mon âme se sent bien protégée pour son voyage.\n\n"
 pam_decision_events.0007.desc.outro: "Une fois que le [Glossary('viatique','VIATICUM_GLOSS')] et l’[Glossary('onction','UNCTION_GLOSS')] des malades auront été administrés, je pourrai décider qui priera pour moi."
 VIATICUM_GLOSS: "Terme latin signifiant « provision de route ». Le viatique désigne le sacrement de la communion ou de l’Eucharistie dans le cadre des derniers sacrements. Le voyage que l’on entreprend est le passage vers la vie éternelle."
 UNCTION_GLOSS: "L’extrême-onction des malades est l’onction des malades avec de l’huile sainte, qui est administrée « in extremis », c’est-à-dire peu avant la mort. Elle a pour but de préparer la personne concernée à la vie éternelle."
 pam_decision_events.0007.a: "Puisse [monastic_order.GetName] prier pour moi."
 pam_decision_events.0007.b: "Je renforcerais l’ordre [military_order.GetName]."
 pam_decision_events.0007.c: "[religious_head.Custom('FR_le_Char_Pi')|U][religious_head.GetTitledFirstNameNoTooltip] peut avoir mes richesses, et en échange, je reçois ses prières."
 pam_decision_events.0007.d: "Une parole pieuse [confessor.Custom('FR_au_Char_Pi')][confessor.GetTitledFirstNameNoTooltip] devrait suffire."
