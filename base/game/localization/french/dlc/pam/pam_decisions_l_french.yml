 pam_proclaim_living_word_decision_effect_tt: "Vous choisirez entre :\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_shepherd_of_the_faithful_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_fire_and_sword_modifier' ).GetNameWithTooltip]"
 pam_decision_events.0021.t: "La Parole vivante"
 pam_decision_events.0021.desc: "Il ne reste plus de place pour s’agenouiller dans [ROOT.Char.Custom('GetFaithTemple')]. Pèlerins et [ROOT.Char.GetFaith.PriestNeuterPlural] se pressent épaule contre épaule, barons et mendiants se côtoient, et pourtant la foule ne cesse de grossir aux portes.\n\nMes actes ont été consignés avec plus de soin qu’aucun chroniqueur n’aurait pu le faire : chaque chemin parcouru, chaque veille observée, chaque pièce donnée au nom [ROOT.Char.GetFaith.HighGodNamePossessive]. L’un des [ROOT.Char.GetFaith.PriestNeuterPlural] me prend la main et la pose sur l’autel [ROOT.Char.GetFaith.HighGodNamePossessive] : « Parlez, et nous vous écouterons. »\n\nLe silence qui suit m’appartient. Ce que j’y ferai résonner retentira bien au-delà de ces murs."
 pam_decision_events.0021.a: "Que la miséricorde soit mon sermon."
 pam_decision_events.0021.b: "Je répandrai la Parole par le feu et par l’épée."
 pam_herald_shepherd_of_the_faithful_modifier: "Pasteur des fidèles"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Ce personnage a proclamé sa sainte vocation en paroles de miséricorde, et les fidèles l’en vénèrent."
 pam_herald_fire_and_sword_modifier: "Par le feu et par l’épée"
 pam_herald_fire_and_sword_modifier_desc: "Ce personnage a proclamé que son devoir sacré était un appel aux armes, et les guerriers de la foi se sont rassemblés sous son étendard."
 pam_convert_to_theocracy_decision: "Adopter le régime théocratique"
 pam_convert_to_theocracy_decision_desc: "La hiérarchie actuelle est une perversion des règles prévues par [ROOT.Char.GetFaith.HighGodName]. On m’a révélé la seule manière de démêler cette situation : une voie qui permette de louer [ROOT.Char.GetFaith.CreatorName] tout en m’acquittant de mes devoirs envers le peuple. Telles sont les paroles [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_convert_to_theocracy_decision_confirm: "Exercer l’autorité [ROOT.Char.GetFaith.HighGodNamePossessive]"
 pam_convert_to_theocracy_decision_tooltip: "Changer votre [government|El] en [theocracy|El]"
 pam_convert_theocracy_to_feudal_decision: "Restaurer le règne temporel"
 pam_convert_theocracy_to_feudal_decision_desc: "En tant qu’autorité nominale de la loi [ROOT.Char.GetFaith.HighGodNamePossessive], les [ROOT.Char.GetFaith.GetAdherentNamePlural] se tournent vers moi pour obtenir des conseils spirituels. Cependant, je me sens incapable d’assumer cette tâche et délègue ces jugements à mon [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l].\n\nPuisque mes connaissances relèvent du domaine temporel, il est tout à fait normal que je porte une couronne temporelle ! Ni [ROOT.Char.GetFaith.PriestNeuterPlural], ni même [ROOT.Char.GetFaith.HighGodName] : que le peuple sache que c’est moi qui suis aux commandes."
