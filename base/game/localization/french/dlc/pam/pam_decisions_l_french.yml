 pam_decision_events.0009.t: "Une administration sacrée"
 pam_decision_events.0009.desc: "J’admire [ROOT.Char.Custom('ReligiousHeadHeadgear')] que je finis par poser sur ma tête et me présente devant mes pieux [ROOT.Char.GetFaith.GetAdherentNamePlural] :\n\n« Les anciennes traditions des fiefs et des ordonnances nous ont bien servi, jusqu’à ce qu’elles nous égarent. Nous sommes guidés par la parole [ROOT.Char.GetFaith.HighGodNamePossessive], et c’est celle-ci qui doit déterminer la manière dont nous devons régner sur le pays. Je ne fais que la servir avec humilité, tout comme vous tous. »"
 pam_decision_events.0009.a: "[ROOT.Char.Custom('GetFaithTemple')|U] de [new_capital.GetNameNoTierNoTooltip] est la nouvelle capitale !"
 church_holding_as_new_capital: "Déclarez [new_capital.GetName] comme [realm_capital|El]"
