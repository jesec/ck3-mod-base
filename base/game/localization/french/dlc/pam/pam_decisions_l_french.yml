 pam_develop_clerical_court_decision: "Éduquez votre Cour cléricale"
 pam_develop_clerical_court_decision_desc_christian: "Les clercs oisifs font de piètres serviteurs [ROOT.Char.GetFaith.HighGodNamePossessive]. Laissez-moi rassembler la Cour afin d’ordonner ceux qui en sont dignes, former ceux qui sont ordonnés et appeler des novices à mes portes."
 pam_develop_clerical_court_decision_desc: "Les serviteurs oisifs ne font pas honneur [ROOT.Char.GetFaith.HighGodName2]. Laissez-moi rassembler la Cour afin d’amener au [clergy|El] ceux qui en sont dignes, former ceux qui sont dévoués et appeler des novices à mes portes."
 pam_develop_clerical_court_decision_tooltip: "Ordonnez, formez ou recrutez des membres du [clergy|El] pour votre Cour"
 pam_develop_clerical_court_decision_confirm: "Réunir la Cour"
 pam_develop_clerical_court_decision_tt: "Vous rassemblez votre Cour et choisissez l’une des options suivantes :\n$EFFECT_LIST_BULLET$ Jusqu’à [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [courtiers|El] laïcs rejoignent le [clergy|El], chacun vous accordant de la [piety|El][piety_i|E] supplémentaire.\n$EFFECT_LIST_BULLET$ Jusqu’à [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [Concept('clergy', 'clercs')|E] de Cour gagnent en [learning|El][learning_i] ainsi que le [trait|El] ou de l’[Concept('trait_level_track_xp', 'expérience')|E] d’[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] ou de [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$ Jusqu’à [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] novices issus des territoires voisins rejoignent votre Cour et le [clergy|El].\n\nQuelle que soit la voie que vous empruntez, vous obtenez [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0][piety_i] de [piety|El].\n\n#weak Les récompenses dépendent de votre [learning|El], votre [piety_level|El] et vos [traits|El] religieux. De temps à autre, une opportunité rare se présente.#!"
 pam_develop_clerical_court_decision_candidates_tt: "Soit vous avez un [courtier|El] capable d’ordonner ou d’instruire, soit un candidat digne de ce nom réside à proximité"
 pam_clerical_court_joins_clergy_tt: "Rejoint le [clergy|El] [pam_clerical_patron.GetFaith.GetAdherentName]"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.Custom('FR_le_Char_U_Pi')|U][pam_clerical_ordained.GetShortUIName] rejoint le clergé"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.Custom('FR_le_Char_U_Pi')|U][pam_clerical_instructed.GetShortUIName] gagne en sagesse"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.Custom('FR_le_Char_U_Pi')|U][pam_clerical_novice_current.GetShortUIName] répond à l’appel"
 pam_oblate_patron_reason: "Célèbre mécène des novices"
 pam_oblate_patron_modifier: "Mécène des novices"
 pam_oblate_patron_modifier_desc: "Ce personnage est réputé pour soutenir ceux qui ont été appelés à la vie religieuse. Il est plus facile de prononcer les vœux et les parents se séparent plus volontiers de leurs enfants."
 pam_scriptorium_modifier: "Salle des scribes"
 pam_scriptorium_modifier_desc: "Ce personnage dispose de scribes dont le travail attire les érudits à la capitale."
 pam_decision_events.0032.t: "Garder le troupeau"
 pam_decision_events.0032.desc.intro.christian: "Je m’adresse aux clercs de ma Cour afin d’évaluer qui doit être ordonné et qui a encore besoin d’être guidé."
 pam_decision_events.0032.desc.intro: "Je m’adresse à ceux qui servent la foi [ROOT.Char.GetFaith.GetAdjective] à ma Cour : qui souhaite être à mon service et qui a besoin d’être guidé ?"
 pam_decision_events.0032.desc.pupil: "\n\nMon élève [pam_clerical_pupil.GetFirstName] persévère dans la prière, s’efforçant avec zèle de prouver sa valeur."
 pam_decision_events.0032.desc.no_pupil: "\n\nTrop peu d’entre eux se sont mis au service de la foi : une erreur que j’ai l’intention de corriger."
 pam_decision_events.0032.desc.novice: "\n\nAu-delà de ma Cour, [Select_CString(pam_clerical_novice.IsFemale,'une étrangère prometteuse','un étranger prometteur')], du nom de [pam_clerical_novice.GetFirstName], sollicite une place au service de la foi."
 pam_decision_events.0032.desc.outro.christian: "\n\nComment prendrai-je soin du troupeau que [ROOT.Char.GetFaith.HighGodName] m’a confié ?"
 pam_decision_events.0032.desc.outro: "\n\nComment élèverai-je ceux que [ROOT.Char.GetFaith.HighGodName] m’a confiés ?"
 pam_decision_events.0032.prodigy: "Mon élève a un don divin !"
 pam_decision_events.0032.oblates: "Que tous sachent que ma porte est ouverte à ceux qui sont appelés au service [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_decision_events.0032.piety: "Sa dévotion renforce la mienne."
 pam_decision_events.0032.novice: "Une âme prometteuse : accueillons-[pam_clerical_novice.Custom('FR_LeLa')] sans tarder."
 pam_decision_events.0032.miracle: "On dit que mon élève fait des merveilles."
 pam_decision_events.0032.relic.christian: "Ce texte sacré a sa place dans mon Trésor !"
 pam_decision_events.0032.relic: "Que ces écrits viennent enrichir ma Cour."
 pam_decision_events.0032.language: "Demander à mon élève d’étudier les textes sacrés."
 pam_decision_events.0032.scriptorium.christian: "Mettons toutes les plumes au travail dans le scriptorium."
 pam_decision_events.0032.scriptorium: "Que tous les scribes à ma Cour se mettent au travail."
 pam_decision_events.0032.a.christian: "Consacrer les plus dignes de ma Cour."
 pam_decision_events.0032.a: "Mettre les plus dignes membres de ma Cour au service de la foi."
 pam_decision_events.0032.a.tt: "Jusqu’à [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] de vos [courtiers|El] laïcs les plus instruits #weak (y compris vos proches)#! :\n$EFFECT_LIST_BULLET$ Rejoint le [clergy|El] de foi [pam_clerical_patron.GetFaith.GetAdjective]\n$EFFECT_LIST_BULLET$ Obtient de l’[learning|El][learning_i] et de l’[opinion|El] à votre égard\n$EFFECT_LIST_BULLET$ Vous procure de la [piety|El][piety_i]"
 pam_decision_events.0032.b: "Former le clergé qui est déjà sous ma responsabilité."
 pam_decision_events.0032.b.tt: "Jusqu’à [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] de vos [Concept('clergy', 'clercs')|E] de Cour les plus instruits :\n$EFFECT_LIST_BULLET$ Gagne de l’[learning|El][learning_i] #weak (jusqu’à [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Gagne ou fait progresser le [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] ou [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_decision_events.0032.c.named: "Accueillir [pam_clerical_novice.GetFirstNameNoTooltip] et faire savoir que les novices sont les bienvenus"
 pam_decision_events.0032.c: "Faire savoir que les novices sont les bienvenus"
 pam_decision_events.0032.c.tt: "Jusqu’à [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] novices provenant des contrées environnantes :\n$EFFECT_LIST_BULLET$ Rejoint votre Cour et le [clergy|El] dans la cause de la foi [pam_clerical_patron.GetFaith.GetAdjective]\n$EFFECT_LIST_BULLET$ Se convertit à votre [rite|El]"
 pam_seize_capital_clerical_region_decision: "Prendre possession de la région cléricale"
 pam_seize_capital_clerical_region_decision_desc: "Ma capitale se trouve dans une [clerical_region|El] que je ne détiens pas. Aucun [archbishop|El] ne devrait être au-dessus du siège d’où je règne : ce [title|El] revient au [head_of_faith|El]."
 pam_seize_capital_clerical_region_decision_tooltip: "Prenez la [clerical_region|El] dans laquelle se trouve votre capitale et destituez l’[archbishop|El], si le siège n’est pas vacant"
 pam_seize_capital_clerical_region_decision_confirm: "Prendre le siège"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.Custom('FR_le_Char_Pi')|U][pam_deposed_archbishop.GetShortUIName] est destitué[pam_deposed_archbishop.Custom('FR_E')]"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName] vous est transféré"
