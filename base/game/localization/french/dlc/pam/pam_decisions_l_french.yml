 pam_antipope_events.0001.t: "Un [ROOT.Char.GetFaith.ReligiousHeadName|l] rival"
 pam_antipope_events.0001.desc.intro: "Tous les pratiquants du rite [ROOT.Char.GetRite.GetAdherentName] semblent être réunis dans [ROOT.Char.GetFaith.HouseOfWorship].\n\n"
 pam_antipope_events.0001.desc.self: "Je lève ma main. Le règne illégitime [pope.Custom('FR_du_Char_Pi')][pope.GetTitledFirstName] touche bientôt à sa fin. C’est à moi qu’il revient désormais de guider ses ouailles malmenées."
 pam_antipope_events.0001.desc.sponsor: "« Que les hérauts proclament que je suis le véritable [ROOT.Char.GetFaith.ReligiousHeadName|l] ! » s’écrie [antipope.Custom('FR_le_Char_Pi')][antipope.GetTitledFirstName]. « Que tout le monde sache que le faux [pope.GetTitledFirstName] se cache dans son palais de [pope_capital.GetName] tandis que les fidèles errent sans soutien et sans guide ! ».\n\n[antipope.Custom('FR_IlElle')|U] se tourne vers moi. « Mais ne craignez rien. [Select_CString(ROOT.Char.IsFemale,'La pieuse','Le pieux')] [ROOT.Char.GetTitledFirstName] a décidé de mettre fin à vos souffrances. Et je me tiens à ses côtés. »"
 pam_antipope_events.0001.a: "Que la foi [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] tremble."
 pam_antipope_events.0002.opening: "[ROOT.Char.Custom('FR_au_Char_Pi')|U][ROOT.Char.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom('FR_FaithGenderedAdj')],"
 pam_antipope_events.0002.desc.challenger_sponsor: "Sachez que moi, [sponsor.Custom('FR_le_Char_Pi')][sponsor.GetTitledFirstName], élève [antipope.Custom('FR_le_Char_Pi')][antipope.GetTitledFirstName]"
 pam_antipope_events.0002.desc.antipope_self: "Sachez que moi, [sponsor.Custom('FR_le_Char_Pi')][sponsor.GetTitledFirstName], m’élève"
 pam_antipope_events.0002.desc.outro: "comme [ROOT.Char.GetFaith.ReligiousHeadName|l] face [Select_CString(pope.IsFemale,'à la fausse','au faux')] [pope.GetTitledFirstName], pour guider les fidèles du rite [antipope.GetRite.GetAdherentName], comme l’exige la tradition."
