 pam_renounce_papal_candidacy_decision: "Renoncer au [ROOT.Char.GetFaith.ReligiousHeadTitleName|l]"
 pam_renounce_papal_candidacy_decision_embrace: "Viser le [ROOT.Char.GetFaith.ReligiousHeadTitleName|l]"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Certains passent toute leur vie à aspirer au trône du [ROOT.Char.GetFaith.ReligiousHeadName|l], et j’ai pu observer les conséquences que cette ascension a sur eux.\n\nQue les [cardinals|El] sachent que je ne me présenterai pas à l’élection du prochain chef spirituel. Ma tâche est ici, dans mon propre diocèse."
 pam_renounce_papal_candidacy_decision_desc_embrace: "J’avais laissé entendre que je ne me présenterais pas au trône du [ROOT.Char.GetFaith.ReligiousHeadName|l]. À l’époque, j’étais encore jeune et la foi [ROOT.Char.GetFaith.GetAdjective] était entre des mains plus bienveillantes.\n\nQue les [cardinals|El] sachent désormais que je suis bel et bien prêt[ROOT.Char.Custom('FR_E')]."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Retirer sa candidature au poste de prochain [head_of_faith|El]"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "Se présenter à nouveau aux élections pour être le prochain [head_of_faith|El]"
 pam_renounce_papal_candidacy_decision_renounce_tt: "Vous ne serez pas pris[GetPlayer.Custom('FR_E')] en compte comme candidat[GetPlayer.Custom('FR_E')] lors de l’élection du prochain [head_of_faith|El] et conserverez votre droit de vote"
 pam_renounce_papal_candidacy_decision_embrace_tt: "Vous pourriez être pris[GetPlayer.Custom('FR_E')] en considération comme candidat[GetPlayer.Custom('FR_E')] lors de l’élection du prochain [head_of_faith|El]"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "Un autre [cardinal|El] doit néanmoins être prêt à se porter candidat"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "Retirer ma candidature"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "Je me présente"
 pam_decision_events.0015.t: "Diffusion de récits d’actes de piété"
 pam_decision_events.0015.desc.intro.no_praiser: "Mes fidèles prêtres prononcent"
 pam_decision_events.0015.desc.intro.praiser: "Mon influent[my_praiser.Custom('FR_E')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.Custom('FR_le_Char_Pi')][my_praiser.GetTitledFirstName], prononce"
 pam_decision_events.0015.desc.intro: "le panégyrique rédigé par ma [GetDomicileBuilding('chancery_01').GetName|l] :\n\n« Les actes vertueux sont comme des graines que le Seigneur sème et qui s’épanouissent ensuite en une pieuse abondance. Tout le monde devrait connaître [praise_worthy_priest.Custom('FR_le_Char_Pi')][praise_worthy_priest.GetTitledFirstName] pour"
 pam_decision_events.0015.desc.virtuoustrait: "son noble caractère [my_virtuous_trait.GetName(praise_worthy_priest)|l] et"
 pam_decision_events.0015.desc.mid: "ses nobles vertus, toujours guidé[praise_worthy_priest.Custom('FR_E')] par"
 pam_decision_events.0015.desc.virtuoustenet: "l’estimable [my_virtuous_tenet.GetName(praise_worthy_priest.GetRite )|l]... »"
 pam_decision_events.0015.desc.novirtuoustenet: "Dieu... »"
 pam_decision_events.0015.desc.bad: "\n\nMalgré ces paroles élogieuses, mon cœur redoute tout de même les flammes de l’enfer."
 pam_decision_events.0015.desc.good: "\n\nJe suis un instrument du Seigneur, une manifestation de sa beauté sur terre."
 pam_decision_events.0015.desc.neutral: "\n\nMalgré ces paroles élogieuses, ce n’est qu’à ma mort que je saurai si mon âme est digne du Seigneur."
 pam_decision_events.0015.desc.outro: "\n\n« ... et, par la droiture de ses actes, [praise_worthy_priest.Custom('FR_IlElle')] a montré qu’[praise_worthy_priest.Custom('FR_IlElle')] pourrait un jour diriger l’Église ! »"
 pam_decision_events.0015.b: "« J’ai plus d’un miracle à mon actif. »"
 pam_decision_events.0015.b.flavor: "Pourquoi se contenter d’un pontificat quand on peut être canonisé ?"
 pam_decision_events.0015.b.tt: "#V Augmente les chances de canonisation#! après la mort\n#weak Il faut une [dynasty|El] pour être canonisé#!"
 pam_decision_events.0015.c: "Si le Seigneur veut que je les guide..."
 pam_decision_events.0015.c.flavor: "... Je dois être à la hauteur"
 pam_decision_events.0015.c.tt: "#V Augmente le résultat aux élections#! pour [praise_worthy_priest_superior_title.GetName] : #P +30#!"
 pam_decision_events.0015.d: "Qu’aucun autre nom ne soit mentionné."
 pam_decision_events.0015.d.flavor: "Videz les coffres de mon dévouement, car je ne veux pas occuper la deuxième place"
 pam_decision_events.0015.d.tt: "#V Augmenter le score électoral#! pour [praise_worthy_priest_superior_title.GetName] : #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, assez pour se classer premier en tant que $theocratic_elective_populist|l$\nRequiert [praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0]@piety_icon! en [piety|El]"
 pam_evangelize_personal_tenet_decision: "Prêcher le principe personnel"
