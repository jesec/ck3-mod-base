 pam_unite_miaphysite_churches_decision_desc: "Bien qu’elles partagent la même foi, les Églises de la communauté miaphysite ont depuis longtemps pris des chemins séparés, chacune sous l’autorité de son propre chef. Si ces chefs parvenaient à s’entendre, plus rien ne s’opposerait à une union absolue des fidèles."
