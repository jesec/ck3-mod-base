 pam_mended_great_schism_diplomatic_dynasty_modifier: "Artisans de la paix de la chrétienté"
 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "Cette dynastie a amené les patriarches rivaux à se réconcilier. C’est ainsi que la fracture au sein du monde chrétien a été amendée, sans qu’une seule goutte de sang ne soit versée."
