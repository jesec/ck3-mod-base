 pam_decision_events.0011.opening: "Aux [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de tous les pays,"
 pam_decision_events.0011.desc.permitted: "à partir de ce jour, l’estimable [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )|l] fera partie des enseignements reconnus de notre foi.\n\nQue ceux qui le pratiquaient en secret sortent de l’ombre."
 pam_decision_events.0011.desc.prohibited: "à partir de ce jour, l’immonde [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )|l] est cause d’anathème. Tous ceux qui s’y accrochent se séparent des fidèles."
 pam_decision_events.0011.desc.fallback: "J’ai fait une déclaration concernant le principe de [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )|l]."
 pam_decision_events.0011.b: "Et pourtant, je reste fidèle à cet enseignement..."
 pam_decision_events.0012.opening: "Aux [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de tous les pays,"
 pam_decision_events.0012.desc: "[bull_issuer.Custom('FR_le_Char_Pi')|U][bull_issuer.GetTitledFirstName] a déclaré le rite [heresy_rite.GetAdherentName] comme hérésie.\n\nQue chaque dirigeant de la foi en prenne bonne note."
 pam_decision_events.0012.a: "Ainsi soit-il."
 pam_decision_events.0013.opening: "[ROOT.Char.Custom('FR_au_Char_Pi')|U][ROOT.Char.GetTitledFirstNameNoTooltip], qui faisait autrefois partie des fidèles,"
 pam_decision_events.0013.desc.intro: "C’est fait. Le rite [heresy_rite.GetAdherentName] est déclaré hérétique, et tous ceux qui y resteront fidèles seront purement et simplement exclus de la foi [bull_issuer.GetFaith.GetAdjective]."
 pam_decision_events.0013.desc.outro: "\n\nÀ vous de choisir : agenouillez-vous à nouveau pour vous repentir, ou accrochez-vous à cette hérésie qui vous condamnera."
 pam_decision_events.0013.a: "Nous resterons seuls, et avec plaisir."
 pam_decision_events.0013.b: "Je ne veux pas être exclu[ROOT.Char.Custom('FR_E')]. Laissez-moi revenir."
