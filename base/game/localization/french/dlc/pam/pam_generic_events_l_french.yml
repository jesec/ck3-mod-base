l_french:
 pam_generic_events.0001.t: "Érudit de la foi"
 pam_generic_events.0001.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', chaplain )] [chaplain.GetFirstName] est plongé[chaplain.Custom('FR_E')] dans le sermon lorsque j’entre dans [ROOT.Char.GetFaith.HouseOfWorship].\n\n« Ah, [ROOT.Char.Custom('FormOfAddressForLiege')] » dit-[chaplain.Custom('FR_IlElle')] lorsqu’[chaplain.Custom('FR_IlElle')] me remarque enfin. « Votre intérêt pour les paroles [ROOT.Char.GetFaith.HighGodNamePossessive] grandit-il ? Je peux vous les enseigner. »"
 pam_generic_events.0001.a: "Un effort qui en vaut la peine."
 pam_generic_events.0001.b: "Gouverner exige toute mon attention."
 pam_generic_events.0002.t: "Suis-je quelqu’un de bien ?"
 pam_generic_events.0002.desc.intro: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', doubting_child )], [doubting_child.GetFirstName], se glisse dans ma chambre bien après que les bougies sont éteintes. Des larmes coulent sur ses joues.\n\n« Est-ce que je suis quelqu’un de bien ? » murmure-t-[doubting_child.Custom('FR_IlElle')]. « Si ce que je suis est un péché..."
 pam_generic_events.0002.desc.sin: "si répugnant et [sinful_trait.GetName( ROOT.Char )|l]..."
 pam_generic_events.0002.desc.sp: "si mon âme est vide..."
 pam_generic_events.0002.desc.outro: "comment [ROOT.Char.GetFaith.HighGodName] pourrait encore vouloir de moi ? »"
 pam_generic_events.0002.a: "Rejette ce qui te fait honte."
 pam_generic_events.0002.b: "Tu es déjà aimé[doubting_child.Custom('FR_E')]."
 pam_generic_events.0002.c: "Alors, prions."
 friend_comforted_child_doubts: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] réconforté [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] quand [TARGET_CHARACTER.Custom('FR_IlElle')] s’est demandé s’[TARGET_CHARACTER.Custom('FR_IlElle')] était quelqu’un de bien."
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a réconforté [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] quand [CHARACTER.Custom('FR_IlElle')] s’est demandé s’[CHARACTER.Custom('FR_IlElle')] était quelqu’un de bien."
 pam_generic_events.0003.t: "Ce que vous êtes"
 pam_generic_events.0003.desc: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', worried_spouse )], [worried_spouse.GetFirstName], attend au milieu des haies à la tombée de la nuit, les mains croisées sur les genoux.\n\n« Vous êtes [sinful_trait.GetName( ROOT.Char )|l] », dit-[worried_spouse.Custom('FR_IlElle')] d’une voix basse. « Cela nous couvre tous les deux de honte devant [ROOT.Char.GetFaith.HighGodName]. Comment pouvez-vous traiter votre foi avec tant d’insouciance ? Ne voyez-vous pas l’effet que cela a sur vous ? »"
 pam_generic_events.0003.a: "Pour vous, j’accepte de changer."
 pam_generic_events.0003.b: "C’est [ROOT.Char.GetFaith.HighGodName] qui a fait de moi ce que je suis."
 pam_generic_events.0003.c: "Vous vous en faites trop."
 lover_promised_to_change_ways: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] promis [TARGET_CHARACTER.Custom('FR_au_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] de changer et de partir en pèlerinage."
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a promis [CHARACTER.Custom('FR_au_Char_U_Pi')][CHARACTER.GetShortUIName] de changer et de partir en pèlerinage."
 rival_embraced_sinful_ways: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] refusé de [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] repentir quand [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] lui a demandé de changer."
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a refusé de se repentir quand [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUIName] lui [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] demandé de changer."
 pam_generic_events.0004.t: "Une lumière dans l’obscurité"
 pam_generic_events.0004.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] est complètement vide. La brume monte entre les colonnes, et les bougies vacillent à la mémoire de m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', deceased )], [deceased.GetFirstName], qui [deceased.GetDeathReasonHideKiller].\n\nM[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', comforter )], [comforter.GetFirstName], s’assoit si proche de moi que nos manches se touchent. « Le deuil est un chemin à suivre », dit-[comforter.Custom('FR_IlElle')] calmement. « Empruntez-le, et il vous conduira peut-être [ROOT.Char.GetFaith.PositiveAfterLife2]. »"
 pam_generic_events.0004.a: "C’était moi ! Je suis coupable !"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP Dans la maison de mon Père, il y a plusieurs demeures.#!"
 JOHN_14_2_GLOSS: "#weak Jean 14:2#!"
 pam_generic_events.0004.c: "Alors, prions."
 pam_generic_events.0004.d: "Venez. Nous allons trinquer en son hommage."
 pam_generic_events.0005.t: "Un poing fidèle"
 pam_generic_events.0005.desc: "« Comment ose-t-[clerical_holder.Custom('FR_IlElle')] ?! »\n\nM[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', loyal_vassal )], [loyal_vassal.Custom('FR_le_Char_Pi')][loyal_vassal.GetTitledFirstName], entre dans la salle du concile, son épée déjà à moitié dégainée.\n\n« Comment [clerical_holder.Custom('FR_le_Char_Pi')][clerical_holder.GetTitledFirstName] ose-t-[clerical_holder.Custom('FR_IlElle')] vous chasser ? » s’écrie-t-[loyal_vassal.Custom('FR_IlElle')] en crachant par terre. « J’ai des hommes à [clerical_region.GetName]. Vous n’avez qu’un mot à dire, et nous irons lui rendre une petite visite. »"
 pam_generic_events.0005.a: "Très bien, allez-y."
 pam_generic_events.0005.a.tt: "[loyal_vassal.Custom('FR_le_Char_Pi')|U][loyal_vassal.GetTitledFirstName] se rendra à [clerical_holder.GetCapitalLocation.GetName]. À son retour, vous obtiendrez de la [dread|El] et de l’[opinion|El] du [vassal|El] [GetVassalStance('belligerent').GetName|l][GetVassalStance('belligerent').GetTextIcon]."
 pam_generic_events.0005.b: "Il existe des solutions plus astucieuses."
 pam_generic_events.0005.b.tt: "Vous gagnez un #P énorme#! bonus pour des [schemes|El] visant à [GetScheme('murder').GetActionName|l] et ayant pour cible [clerical_holder.Custom('FR_le_Char_U_Pi')][clerical_holder.GetShortUIName] pendant #V 15 ans#!"
 pam_generic_events.0005.c: "On m’a appris à tendre l’autre joue."
 pam_generic_events.0005.c.tt: "Augmentation de l’acceptation de l’[character_interaction|El] #V $declaration_of_repentance_interaction$#! pendant #V 10 ans#! : #P +20#!"
 pam_generic_events.0005.c.tt2: "L’[character_interaction|El] #V $lift_excommunication_interaction$#! est plus susceptible d’être utilisée sur vous pendant les #V 10 prochaines années#!"
 pam_turned_the_other_cheek_accept_reason: "A tendu l’autre joue"
 PAM_GENERIC_0005_MURDER_BONUS: "Un fidèle vassal a des hommes dans le domaine de cette cible : $VALUE|+0=$"
 pam_generic_events.0007.opening: "À l’attention [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitledFirstName]"
 pam_generic_events.0007.desc: "C’est fait. J’ai retrouvé [clerical_holder.Custom('FR_le_Char_Pi')][clerical_holder.GetTitledFirstName] et je l’ai laissé[clerical_holder.Custom('FR_E')] dans son sang."
 pam_generic_events.0007.a: "Bien."
 pam_generic_events.0008.t: "Une voix dans l’obscurité"
 pam_generic_events.0008.desc: "Le dîner me pèse encore lourd sur l’estomac quand j’avance en titubant jusqu’à ma chambre à coucher. Ma vision est brouillée, et le couloir semble tanguer sous mes pieds.\n\nEt puis... une voix. « Un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] aussi noble », dit-elle. « Vous faites le bonheur de votre seigneur. »\n\nEst-ce vraiment la voix [ROOT.Char.GetFaith.HighGodNamePossessive] ? Ou est-ce la maladie qui me joue des tours ?"
 pam_generic_events.0008.a: "Oui. Oui !!"
 pam_generic_events.0008.b: "Ce doit être Lui !"
 pam_generic_events.0008.c: "Les vieilles puissances s’agitent..."
 pam_generic_events.0008.d: "Parfois, la nourriture peut avoir ce genre d’effets."
 pam_generic_events.0008.e: "C’est peut-être quelque chose que j’ai mangé ?"
 pam_generic_events.0008.f: "Mieux vaut prier, au cas où."
 pam_generic_events.0009.t: "Les flammes de l’enfer"
 pam_generic_events.0009.desc: "Je me réveille trempé[ROOT.Char.Custom('FR_E')] jusqu’aux os, le cœur battant à tout rompre.\n\nDans mon rêve, je prenais feu. Ma peau fondait sur mes os comme du beurre. « [sinful_trait.GetNameNoTooltip( ROOT.Char )|U] ! [sinful_trait.GetNameNoTooltip( ROOT.Char )|U] ! » me criait une horde de démons.\n\nLes flammes [ROOT.Char.GetFaith.NegativeAfterLife3] m’appelaient, et chaque cri qui résonnait était le mien."
 pam_generic_events.0009.a: "La flagellation pourrait bien être la solution."
 pam_generic_events.0009.b: "Il faut répondre à la chair par la chair."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Nettoyez vos mains, pécheurs ; et purifiez vos cœurs.#!"
 JAMES_4_8_GLOSS: "#weak Jacques 4:8#!"
 pam_generic_events.0009.d: "Parler [comforting_courtier.Custom('FR_au_Char_Pi')][comforting_courtier.GetTitledFirstName] est toujours une bonne idée."
 pam_generic_events.0009.e: "Ce n’est qu’un rêve."
 friend_comforted_hell_nightmare_reason: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'avez', 'a')] cherché du réconfort auprès [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] après un cauchemar de damnation."
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] a cherché du réconfort auprès [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUIName] après un cauchemar de damnation."
 pam_generic_events.0010.t: "Gibier béni"
 pam_generic_events.0010.desc: "Nous sommes entourés par [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]. Le bruit assourdissant d’une dizaine de chevaux au galop se fait bientôt entendre, avec [hunting_ruler.GetName] à leur tête.\n\n« Haaalte ! » [hunting_ruler.Custom('FR_IlElle')|U] lève la main en signe de salut et demande à son escorte de s’arrêter. « Louons [ROOT.Char.GetFaith.HighGodName] pour ce temps et pour le gibier que nous chassons ! » s’exclame-t-[hunting_ruler.Custom('FR_IlElle')]."
 pam_generic_events.0010.a: "Un petit conseil, si ça vous intéresse..."
 pam_generic_events.0010.b: "Votre œil est plus aiguisé que votre lance."
 pam_generic_events.0010.b.success: "Vos louanges ont été entendues"
 pam_generic_events.0010.b.failure: "Vos louanges tombent à plat"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.Custom('FR_IlElle')|U] prend vos louanges à cœur"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.Custom('FR_IlElle')|U] s’irrite devant vos flagorneries"
 pam_generic_events.0010.b.tt: "[hunting_ruler.Custom('FR_le_Char_Pi')|U][hunting_ruler.GetTitledFirstName] est plus susceptible d’accepter une [character_interaction|El] #high $negotiate_alliance_interaction$#! pendant #V 10 ans#!"
 pam_generic_events.0010.c: "Loué soit-Il !"
 pam_generic_events.0010.d: "Prêtez-moi quelques-uns de vos cavaliers pour la route."
 friend_praised_hunting_reason: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'avez', 'a')] loué les talents de chasseu[TARGET_CHARACTER.Custom('FR_RSe')] [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName]."
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a loué [Select_CString(CHARACTER.IsLocalPlayer, 'vos', 'les')] talents de chasseu[CHARACTER.Custom('FR_RSe')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')]."
 pam_praised_hunting_alliance_accept_reason: "A loué mes talents à la chasse"
 pam_generic_events.0011.t: "Péché mignon"
 pam_generic_events.0011.desc: "Les péchés [sinful_courtier.Custom('FR_du_Char_Pi')][sinful_courtier.GetTitledFirstName] n’ont que trop duré. À la Cour, les rumeurs vont bon train sur son comportement [sinful_trait.GetName( ROOT.Char )|l], et j’ai même vu des serviteurs avoir un mouvement de recul à son passage.\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U] ! » s’exclame-t-[hunting_ruler.Custom('FR_IlElle')] au moment où j’entre dans le bureau. [hunting_ruler.Custom('FR_IlElle')|U] [sinful_courtier.Custom('quirk_neg_pp')]. « Votre présence m’honore. »"
 pam_generic_events.0011.a: "Vous allez cesser votre comportement [sinful_trait.GetNameNoTooltip( ROOT.Char )|l]."
 pam_generic_events.0011.b: "Écoutez bien les leçons [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_generic_events.0011.b.success: "La leçon porte ses fruits"
 pam_generic_events.0011.b.failure: "[sinful_courtier.Custom('FR_IlElle')|U] refuse d’écouter"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.Custom('FR_IlElle')|U] comprend le poids de son péché"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.Custom('FR_IlElle')|U] ignore vos enseignements"
 pam_generic_events.0011.c: "Ce n’est pas bon pour vous..."
 pam_generic_events.0011.c.success: "Vos conseils bienveillants l’apaisent"
 pam_generic_events.0011.c.failure: "Votre gentillesse ne fait que l’irriter"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.Custom('FR_IlElle')|U] est ému[sinful_courtier.Custom('FR_E')] par votre bienveillance"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.Custom('FR_IlElle')|U] prend votre gentillesse pour un défaut"
 pam_generic_events.0011.d: "Ce n’est peut-être pas si grave."
