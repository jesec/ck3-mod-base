 pam_tenet_events.0004.opening.hof: "Honorable [diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip|l],"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "Je vous écris pour vous informer que le [diverged_rite.GetName] a intégré le principe [diverged_added_tenet.GetBaseName].\n\nUn rite qui guide bien les fidèles renforce la foi [diverged_rite.GetFaith.GetAdjective] dans son ensemble. Ce n’est que du bon sens."
 pam_tenet_events.0004.desc.forward_doctrine: "Je vous écris pour vous informer que le [diverged_rite.GetName] adhère désormais officiellement à la doctrine [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )].\n\nUn rite qui guide bien les fidèles renforce la foi [diverged_rite.GetFaith.GetAdjective] dans son ensemble. Ce n’est que du bon sens."
 pam_tenet_events.0004.desc.backward_tenet: "Je vous écris pour vous faire savoir que le [diverged_rite.GetName] a adopté le principe [diverged_added_tenet.GetBaseName].\n\nNous nous rapprochons ainsi du [diverged_rite.GetFaith.GetMainRite.GetName|l]. Si les rites parlent d’une seule voix, la foi [diverged_rite.GetFaith.GetAdjective] s’épanouira !"
 pam_tenet_events.0004.desc.backward_doctrine: "Je vous écris pour vous informer que le [diverged_rite.GetName] adhère désormais à la doctrine [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )].\n\nNous nous rapprochons ainsi du [diverged_rite.GetFaith.GetMainRite.GetName|l]. Si les rites parlent d’une seule voix, la foi [diverged_rite.GetFaith.GetAdjective] s’épanouira !"
 pam_tenet_events.0004.a: "Ainsi soit-il."
 pam_tenet_events.0004.a.tt.diverged: "Le [rite|El] [diverged_rite.GetAdherentName] s’est encore éloigné du [mainline_rite|El] [diverged_rite.GetFaith.GetMainRite.GetAdherentName], ce qui a fait diminuer la [fervor|El][fervor_i] plus vite"
 pam_tenet_events.0004.a.tt.consolidated: "Le [rite|El] [diverged_rite.GetAdherentName] s’est encore rapproché du [mainline_rite|El] [diverged_rite.GetFaith.GetMainRite.GetAdherentName], ce qui a fait diminuer la [fervor|El][fervor_i] plus lentement"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "J’ai donné la moitié de ce que je possédais aux pauvres, et mon âme s’est enrichie.\n\nJe vous demande maintenant d’en faire de même. On pardonne à ceux qui ont les mains vides, on se souvient de ceux qui ont les mains pleines."
 pam_tenet_events.0005.a: "Si [redistributing_liege.Custom('FR_le_Char_L')][redistributing_liege.GetTitleAsNameNoTooltip] peut le faire, alors moi aussi."
 pam_tenet_events.0005.b: "Mes mains sont pleines et le resteront."
 pam_tenet_events.0005.b.tt: "Vos coffres resteront intacts, et vos [counties|El] ne recevront rien"
 pam_tenet_events.0006.t: "Les enseignements cachés"
 pam_tenet_events.0006.desc_intro: "Des livres inconnus sont ouverts devant moi, leurs diagrammes mis à nu et leur nom qu’aucune langue ne saurait prononcer. Tel est l’enseignement que les fidèles ne doivent jamais suivre, et autour duquel j’ai passé la nuit."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.Custom('FR_le_Char_Pi')|U][mystic_witness.GetTitledFirstName] s’avance jusqu’au pas de la porte et s’arrête. « Ces enseignements sont scellés et interdits pour une raison », murmure-t-[mystic_witness.GetSheHe]. « Ce que vous lirez là-dedans, vous ne pourrez jamais l’oublier. »"
 pam_tenet_events.0006.desc_alone: "\n\nPersonne de ma Cour ne se penchera sur ces pages avec moi. Quoi qu’elles contiennent, j’y ferai face seul[ROOT.Char.Custom('FR_E')]."
 pam_tenet_events.0006.a: "Rien de ce que contiennent ces pages ne m’est étranger. Je vais poursuivre la lecture."
 pam_tenet_events.0006.b: "Je lirai tant que la lampe brûlera et n’irai pas plus loin."
 pam_tenet_events.0007.t: "Conseil des morts"
 pam_tenet_events.0007.desc: "Les portes barricadées et les lampes éteintes, le monde se résume désormais à une simple flamme vacillante et à la fumée qui s’élève autour de moi. Je peux déjà sentir la présence [guiding_forebear.Custom('FR_du_Char_Pi')][guiding_forebear.GetTitledFirstName] se tortillant derrière le voile fumant.\n\nDans l’obscurité, je dévoile les terribles tourments que je n’ose pas nommer en plein jour. Les esprits ne répondent pas comme les mortels, mais par des murmures sépulcraux, le crépitement d’une flamme tremblotante, le bruissement furtif d’un souffle invisible, et les spectres qui s’agitent dans la fumée.\n\nCherchant désespérément une indication, mes yeux essaient de repérer les signes de la réponse que j’attends avec impatience."
 pam_tenet_events.0007.a: "Donnez-moi la sagesse qui vous guide."
 pam_tenet_events.0007.b: "Accordez-moi assez de paix pour affronter l’aube."
 pam_tenet_events.0008.t: "Un moi dont on se souvient"
 pam_tenet_events.0008.desc: "Le sceau, la coupe, la bague qu’ils ont retirée de la main de m[ROOT.Char.Custom2('FR_RelationToMe_OnA', SCOPE.sC('remembered_forebear'))] [remembered_forebear.Custom('FR_le_Char_Pi')][remembered_forebear.GetTitledFirstName]. Ils sont disposés devant moi, et je reste là jusqu’à ne plus avoir l’impression qu’ils ne m’appartiennent pas.\n\nRien ne se passe. Personne ne dit rien. On ne me parle pas d[remembered_forebear.Custom('FR_EluiElle')]. Cela me rappelle qui je suis, et ce souvenir fait partie de ce qui est ancré dans ma vie, plutôt que ce qui est perdu."
 pam_tenet_events.0008.a: "C’était moi : [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l], jusqu’au bout des ongles."
 pam_tenet_events.0008.b: "Je me réveille fondamentalement [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l]."
 pam_tenet_events.0008.c: "Oui. J’étais [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l], et je peux l’être à nouveau."
 pam_tenet_events.0008.d: "Ces vies sont derrière moi. Je reste moi-même."
 pam_tenet_events.0009.t: "Ouvrez les coffres"
 pam_tenet_events.0009.desc_intro: "Ils ont déplacé les coffres dans la cour et m’ont remis les clés."
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.Custom('FR_le_Char_Pi')|U][redistribution_witness.GetTitledFirstName] défile le long de la rangée.\n\n« Un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] généreu[ROOT.Char.Custom('FR_XSe')] reste un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] », dit-[redistribution_witness.GetSheHe]. « Ce n’est pas quand on donne que l’on est sauvé, mais lorsque l’on n’a plus rien à garder. »"
 pam_tenet_events.0009.desc_alone: " Personne n’est venu pour me soutenir. Les intendants ont préféré garder leurs distances pour attendre."
 pam_tenet_events.0009.desc_end: "\n\nJe peux ouvrir le mien en un tour de main. Les autres, je vais devoir les prendre."
 pam_tenet_events.0009.a: "Forcez les serrures. Nous allons prendre leur part."
 pam_tenet_events.0009.flavor: "Vos vassaux ayant de l’argent à dépenser seront contraints d’ouvrir leurs coffres, vos comtés seront plus libres et plus difficiles à contrôler, et ceux qui ne partagent pas ce principe vous en voudront pour ça."
 pam_tenet_events.0009.b: "Un instant. Mes richesses personnelles suffiront."
 pam_tenet_events.0009.b.tt: "Vous ne partagez que ce qui vous appartient. Vos [vassals|El] gardent leurs coffres intacts et n’éprouvent aucun ressentiment envers vous"
 pam_tenet_events.0010.t: "Ce que doit la chair"
 pam_tenet_events.0010.desc_intro: "Le fouet se trouve là où il se trouve toujours. À ses côtés, ce soir, reposent les fers et le petit couteau, déposés ici en secret, par moi-même."
 pam_tenet_events.0010.desc_alone: "\n\nPersonne ne me tiendra la lampe ce soir. Quoi que je prenne sur cette table, personne ne le saura."
 pam_tenet_events.0010.a: "Le fouet, jusqu’à apaiser mon esprit."
 pam_tenet_events.0010.b: "Que je n’aie plus à voir ce monde."
 pam_tenet_events.0010.c: "Enlevez l’appétit, et le péché disparaîtra."
