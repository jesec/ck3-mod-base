 ##################################################
 # CHRISTIAN SITUATION
 ##################################################
 situation_the_christian_church: "$game_concept_the_christian_church$"
 situation_the_christian_church_desc: "$game_concept_the_christian_church_desc$"
 the_christian_church.tt.forbid_title_destruction: "Ce [title|El] ne pourra pas être détruit tant que l’[GetSituation('the_christian_church').GetName] existera"
 the_christian_church_sub_region_core: "$game_concept_christendom$"
 the_christian_church_sub_region_core_desc: "$game_concept_christendom_desc$"
 the_christian_church_participant_group_christian_clerical_main_power_rulers: "Puissance principale (clérical)"
 the_christian_church_participant_group_christian_clerical_main_power_rulers_desc: "Un [ruler|El] ayant un [theocratic_government|El] ou [ecclesiastical|El], au moins un [title_tier|El] [Concept('county', 'comtal')|E], et qui suit la [faith|El] chrétienne qui contrôle actuellement le plus de [counties|El] dans le monde."
 the_christian_church_participant_group_christian_regular_main_power_rulers: "Puissance principale (séculier)"
 the_christian_church_participant_group_christian_regular_main_power_rulers_desc: "Un [secular_ruler|El] ayant au moins un [title_tier|El] [Concept('county', 'comtal')|E] et qui suit la [faith|El] chrétienne qui contrôle actuellement le plus de [counties|El] dans le monde."
 the_christian_church_participant_group_christian_clerical_secondary_powers_rulers: "Puissances secondaires (clérical)"
 the_christian_church_participant_group_christian_clerical_secondary_powers_rulers_desc: "Un [ruler|El] ayant un [theocratic_government|El] ou [ecclesiastical|El], au moins de [title_tier|El] [Concept('county', 'comtal')|E], et d’une [faith|El] [Concept('christian', 'chrétienne')|E] œcuménique autre que la principale puissance."
 the_christian_church_participant_group_christian_regular_secondary_powers_rulers: "Puissances secondaires (séculier)"
 the_christian_church_participant_group_christian_regular_secondary_powers_rulers_desc: "Un [secular_ruler|El] au moins de [title_tier|El] [Concept('county', 'comtal')|E] et d’une [faith|El] [Concept('christian', 'chrétienne')|E] œcuménique autre que la puissance principale."
 the_christian_church_participant_group_christian_clerical_heretic_rulers: "Hérétiques (clérical)"
 the_christian_church_participant_group_christian_clerical_heretic_rulers_desc: "Un [ruler|El] ayant un [theocratic_government|El] ou [ecclesiastical|El], d’au moins de [title_tier|El] [Concept('county', 'comtal')|E], d’une [faith|El] [Concept('christian', 'chrétienne')|E] non œcuménique."
 the_christian_church_participant_group_christian_regular_heretic_rulers: "Hérétiques (laïcs)"
 the_christian_church_participant_group_christian_regular_heretic_rulers_desc: "Un [secular_ruler|El] au moins de [title_tier|El] [Concept('county', 'comtal')|E] et d’une [faith|El] [Concept('christian', 'chrétienne')|E] non œcuménique autre que la puissance principale."
 the_christian_church_fragile_unity_situation_phase: "$fragile_unity$"
 fragile_unity: "Unité fragile"
 fragile_unity_icon: "$fragile_unity$ @pam_the_christian_church_fragile_unity_icon!"
 fragile_unity_desc: "Il manque au monde chrétien un trône unique auquel tout le monde devrait obéir. Rois, évêques et hérétiques prétendent parler au nom de Dieu, mais personne ne semble les écouter."
 the_christian_church_saeculum_obscurum_situation_phase: "$saeculum_obscurum$"
 saeculum_obscurum: "Siècle sombre"
 saeculum_obscurum_icon: "$saeculum_obscurum$ @pam_the_christian_church_saeculum_obscurum_icon!"
 saeculum_obscurum_desc: "Le siècle obscur du Saint-Siège : une papauté entourée par le péché et maintenue au pouvoir grâce aux faveurs des plus puissants."
 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "Conversion"
 conversion_phase_icon: "$conversion_phase$ @pam_the_christian_church_conversion_phase_icon!"
 conversion_phase_desc: "Une époque de nouveaux baptêmes. Les rois érigent des croix aux gués et sur les places de marché ; les missionnaires et les armées royales se livrent à une surenchère pour gagner les âmes des contrées frontalières, et la conversion d’un seul dirigeant peut pousser un peuple entier vers les mêmes fonts baptismaux."
 reform_phase: "Réforme"
 reform_phase_icon: "$reform_phase$ @pam_the_christian_church_reform_phase_icon!"
 reform_phase_desc: "La discipline, le droit et le zèle puritain s’emparent du clergé. La structure interne du christianisme fait l’objet d’un examen minutieux, et le prix d’une Église pure se paie bien trop souvent par le sang."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 investiture_crisis: "Controverse sur l’investiture"
 investiture_crisis_icon: "$investiture_crisis$ @pam_the_christian_church_investiture_crisis_icon!"
 investiture_crisis_desc: "La couronne et la crosse s’affrontent lorsqu’il s’agit de savoir qui détient les clés des portes de Dieu. Des mécènes laïques nomment des prélats munis de crosse et d’anneau, tandis que l’Église refuse de reconnaître leur légitimité."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "Prochain concile : [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "Temps restant avant que la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] n’atteigne son paroxysme et soit résolue.\n\nÀ la fin du temps imparti, un Concile d’investiture se réunit pour débattre de la [doctrine|El] [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] concernant la nomination des religieux, afin de la remplacer soit par la doctrine [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName], soit par la doctrine [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName], en fonction du résultat des votes. Les [rulers|El] laïcs peuvent obliger le [clergy|El] à voter autrement en utilisant le [casus_belli|El] $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$, ou en obtenant des [puppets|El]."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak L’Église a le dessus#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak Les couronnes ont le dessus#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak L’issue du vote est incertaine.#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "Progression du [schism|el] : [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0] / [Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "Dans quelle mesure les divisions entre les [GetRiteByKey('roman_rite').GetAdherentNamePlural] et les [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] ont-elles poussé le christianisme vers le [Concept( 'schism', 'Grand Schisme')|E] ?\n\nSi les dysfonctionnements s’accumulent suffisamment, cela pourrait entraîner une scission de l’Église. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial Le [GetFaithByKey( 'christian_faith').GetName|l] ne peut pas établir de [Concept('head_of_faith', 'chef')|El] avant que le [Concept( 'schism', 'Grand Schisme')|E] survienne ou soit empêché#!\n\n#help Augmenté par :\n$BULLET_WITH_TAB$Le [GetActivityType('activity_ecumenical_council').GetName] vote la suppression du [core_tenet|El] ou de la [doctrine|El] des [rites|El]\n$BULLET_WITH_TAB$Un différend a éclaté entre les deux [rites|El] avant un [GetActivityType('activity_ecumenical_council').GetName|l]\n$BULLET_WITH_TAB$Une [war|El] entre des [kings|El] ou supérieur des deux rites faisant partie de l’[GetSituation('the_christian_church').GetName]\n$BULLET_WITH_TAB$Le [holy_site|El] d’un rite se convertit à l’autre\n$BULLET_WITH_TAB$La rétrogradation d’un [holy_site|El] d’un des deux rites\n$BULLET_WITH_TAB$Le [Concept('head_of_rite', 'chef')|El] d’un rite est assassiné par l’autre rite#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "Le prochain [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName|l] débloquera les [decisions|El] [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] et [GetDecisionWithKey('pam_cause_great_schism_decision').GetName], et l’[interaction|El] #V $pam_sway_schism_stance_interaction$#!"
 pam_great_schism_decision_taken: "Le [Concept( 'schism', 'Grand Schisme')|E] s’est produit ou a été empêché"
 msg_pam_great_schism_progress_title: "Progression vers le Grand Schisme"
 crusade_phase: "Croisade"
 crusade_phase_icon: "$crusade_phase$ @pam_the_christian_church_crusade_phase_icon!"
 crusade_phase_desc: "La croix se transforme en épée : des armées de seigneurs pénitents affluent vers la Ville Sainte pour défendre chaque temple menacé."
 the_christian_church_crusade_phase_situation_phase: "$crusade_phase$"
 concord: "Concorde"
 concord_icon: "$concord$ @pam_the_christian_church_concord_icon!"
 concord_desc: "La concorde marque une période de stabilité pour la chrétienté dans laquelle l’Église se concentre sur la rationalité, le droit et la théologie systématique. La redécouverte des classiques favorise une approche scolastique consistant à répondre aux doutes par l’argumentation plutôt que par la seule crise."
