l_french:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "Ampoule de saint chrême"
 pam_holy_myron_artifact_desc_common: "Un récipient muni d’un bouchon contenant du saint chrême : du [Glossary('baume de Judée','pam_myron_gloss_balsam')] infusé dans de l’huile d’olive pure, auquel on ajoute une goutte de la précédente concoction, afin que la chaîne de bénédiction remonte sans interruption jusqu’aux apôtres."
 pam_holy_myron_artifact_desc_masterwork: "Un récipient muni d’un bouchon contenant du saint chrême : du [Glossary('baume de Judée','pam_myron_gloss_balsam')], de l’[Glossary('encens','pam_myron_gloss_frankincense')] et de la [Glossary('myrrhe','pam_myron_gloss_myrrh')] infusés dans de l’huile d’olive pure, auxquels on ajoute une goutte de la précédente concoction, afin que la chaîne de bénédiction remonte sans interruption jusqu’aux apôtres."
 pam_holy_myron_artifact_desc_famed: "Un récipient muni d’un bouchon contenant du saint chrême : du [Glossary('baume de Judée','pam_myron_gloss_balsam')], de l’[Glossary('encens','pam_myron_gloss_frankincense')], de la [Glossary('myrrhe','pam_myron_gloss_myrrh')], du [Glossary('nard','pam_myron_gloss_spikenard')] et de la [Glossary('cannelle','pam_myron_gloss_cinnamon')] infusés dans de l’huile d’olive pure, auxquels on ajoute une goutte de la précédente concoction, afin que la chaîne de bénédiction remonte sans interruption jusqu’aux apôtres."
 pam_holy_myron_artifact_desc_illustrious: "Un récipient muni d’un bouchon contenant du saint chrême, préparé dans la foi la plus pure selon les recettes les plus anciennes : du [Glossary('baume de Judée','pam_myron_gloss_balsam')], de l’[Glossary('encens','pam_myron_gloss_frankincense')], de la [Glossary('myrrhe','pam_myron_gloss_myrrh')], du [Glossary('nard','pam_myron_gloss_spikenard')], de la [Glossary('cannelle','pam_myron_gloss_cinnamon')], du [Glossary('calamus','pam_myron_gloss_calamus')], et de la [Glossary('casse','pam_myron_gloss_cassia')] infusés dans de l’huile d’olive pure, auxquels on ajoute une goutte de la précédente concoction, afin que la chaîne de bénédiction remonte sans interruption jusqu’aux apôtres."
 pam_holy_myron_charges_line: "Onctions restantes : #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "Le célèbre baume de Judée : une résine parfumée produite par un arbrisseau poussant à Jéricho et à Ein Gedi, au bord de la mer Morte. Nul parfum du monde antique n’était plus cher, chaque goutte valant une fortune. Il est le fondement du chrême, et ses bosquets jalousement gardés ne poussent nulle part ailleurs."
 pam_myron_gloss_frankincense: "Une résine dorée extraite des arbres noueux du sud de l’Arabie, et que l’on ne trouve presque nulle part ailleurs. Brûlée devant les autels depuis des temps immémoriaux, elle adoucit le chrême tandis que sa fumée porte les prières vers le ciel."
 pam_myron_gloss_myrrh: "Une résine amère et couleur sang exsudée par les arbres épineux du sud de l’Arabie et de la Corne de l’Afrique. Citée dans le livre de l’Exode parmi les ingrédients de l’huile sainte d’onction, elle fut déposée devant l’Enfant Jésus par les Mages et portée à Son tombeau par les fidèles."
 pam_myron_gloss_spikenard: "Une huile épaisse et suave, extraite des racines d’une plante qui ne pousse que dans les hautes montagnes de l’Orient et que l’on achemine jusqu’aux ports de l’Inde. C’est de ce précieux nard que le Seigneur fut oint à Béthanie, pour un prix qui indigna les disciples."
 pam_myron_gloss_cinnamon: "L’écorce intérieure, suave et parfumée, d’arbres de l’Inde et des îles au-delà, citée dans le livre de l’Exode parmi les ingrédients de l’huile sainte d’onction. Elle parcourt la moitié du monde avant de parvenir à quelque autel chrétien que ce soit."
 pam_myron_gloss_calamus: "La canne suave des Écritures : un roseau aromatique récolté dans les marais d’Extrême-Orient et cité dans le livre de l’Exode parmi les ingrédients de l’huile sainte d’onction."
 pam_myron_gloss_cassia: "Une cousine plus âpre de la cannelle, prélevée sur des arbres de l’Extrême-Orient et citée dans le livre de l’Exode parmi les ingrédients de l’huile sainte d’onction."
 ### Modifiers
 pam_holy_myron_vessel_modifier: "Récipient de saint chrême"
 pam_holy_myron_vessel_modifier_desc: "Ce récipient renferme le chrême consacré. Le parfum du [Glossary('baume de Judée','pam_myron_gloss_balsam')] sanctifie celui ou celle qui le garde."
 pam_holy_myron_vessel_potent_modifier: "Récipient de saint chrême puissant"
 pam_holy_myron_vessel_potent_modifier_desc: "Ce récipient renferme du chrême d’une puissance rare, riche en [Glossary('encens','pam_myron_gloss_frankincense')] et en [Glossary('nard','pam_myron_gloss_spikenard')]. Son parfum témoigne à lui seul de sa sainteté."
 pam_chrismated_artifact_modifier: "Oint"
 pam_chrismated_artifact_modifier_desc: "Cet artefact a été oint de saint chrême et sent encore la [Glossary('myrrhe','pam_myron_gloss_myrrh')]."
 pam_chrismated_regalia_modifier: "Insigne royal oint"
 pam_chrismated_regalia_modifier_desc: "Cet artefact a été oint de saint chrême lors d’un couronnement. Cette bénédiction n’a pas perdu de son effet."
 pam_holy_myron_pilgrim_modifier: "Porteur des baumes"
 pam_holy_myron_pilgrim_modifier_desc: "Ce personnage parcourt le monde à la recherche des ingrédients du saint chrême ([Glossary('baume','pam_myron_gloss_balsam')], [Glossary('encens','pam_myron_gloss_frankincense')] et autres éléments plus rares) et ne prend aucun risque en chemin."
 pam_chrismated_child_modifier: "Chrismation"
 pam_chrismated_child_modifier_desc: "Peu après sa naissance, ce personnage a reçu le sacrement de la chrismation et a été marqué du don du Saint-Esprit par l’onction d’huile sainte."
 pam_myron_chrismated_child_modifier: "Chrismation au saint chrême"
 pam_myron_chrismated_child_modifier_desc: "Peu après sa naissance, ce personnage a été oint de saint chrême, le [Glossary('baume de Judée','pam_myron_gloss_balsam')] appliqué sur le front d’un nouveau-né. Une onction qui jamais ne s’effacera."
 pam_anointed_with_holy_oil_modifier: "Oint d’huile sainte"
 pam_anointed_with_holy_oil_modifier_desc: "Ce personnage a reçu l’onction des malades : une huile douce comme du [Glossary('baume','pam_myron_gloss_balsam')], appliquée sur le front et les mains, qui fortifie le corps et l’âme dans l’épreuve."
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "Préparer le saint chrême"
 pam_prepare_holy_myron_decision_tooltip: "Envoyez votre [court_chaplain|El] chercher des baumes rares et consacrer une #V ampoule de saint chrême#!, un [artifact|El] utilisé pour les saintes onctions"
 pam_prepare_holy_myron_decision_desc: "Les ingrédients du saint chrême ne se trouvent pas en cuisine. Les Écritures en dressent la liste – [Glossary('myrrhe','pam_myron_gloss_myrrh')], [Glossary('cannelle','pam_myron_gloss_cinnamon')], [Glossary('calamus','pam_myron_gloss_calamus')] et [Glossary('casse','pam_myron_gloss_cassia')] dans de l’huile d’olive pure – et chacun doit être rapporté des terres où il croît.\n\nPlus l’expédition s’aventure loin, plus le mélange qui sera consacré sera riche. Mais la route est longue et rarement clémente : brigands et fièvres peuvent diminuer la quantité rapportée, voire coûter la vie à celui qui la transporte."
 pam_prepare_holy_myron_decision_confirm: "Envoyer l’expédition"
 pam_prepare_holy_myron_decision_needs_chaplain: "Votre [court_chaplain|El] doit être un adulte disponible qui n’est pas déjà en déplacement"
 pam_prepare_holy_myron_decision_already_owned: "Vous ne devez pas déjà posséder une ampoule de saint chrême"
 pam_prepare_holy_myron_decision_journey_underway: "Votre [court_chaplain|El] est déjà parti à la recherche des baumes"
 pam_prepare_holy_myron_decision_levant_name: "Le baume de Judée"
 pam_prepare_holy_myron_decision_levant_desc: "Votre [court_chaplain|El] se procure du [Glossary('baume de Judée','pam_myron_gloss_balsam')] à #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, une destination unique, et le mélange le plus simple qui soit.\n\nDonne une ampoule de saint chrême [common|El]."
 pam_prepare_holy_myron_decision_arabia_name: "Baume et encens"
 pam_prepare_holy_myron_decision_arabia_desc: "Votre [court_chaplain|El] se procure du [Glossary('baume','pam_myron_gloss_balsam')] à #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, puis de l’[Glossary('encens','pam_myron_gloss_frankincense')] et de la [Glossary('myrrhe','pam_myron_gloss_myrrh')] au #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, deux destinations situées sur la route de l’encens.\n\nDonne une ampoule de saint chrême de rareté [masterwork|E]."
 pam_prepare_holy_myron_decision_india_name: "L’ensemble des ingrédients sacrés"
 pam_prepare_holy_myron_decision_india_desc: "Votre [court_chaplain|El] se procure du [Glossary('baume','pam_myron_gloss_balsam')] à #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, de l’[Glossary('encens','pam_myron_gloss_frankincense')] et de la [Glossary('myrrhe','pam_myron_gloss_myrrh')] au #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, puis du [Glossary('nard','pam_myron_gloss_spikenard')] et de la [Glossary('cannelle','pam_myron_gloss_cinnamon')] au #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Un bien long voyage.\n\nDonne une ampoule de saint chrême [famed|El]. Si votre [court_chaplain|El] suit les vieilles recettes à la lettre (#V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! de chances, proportionnelles à son [learning|El]), l’ampoule est alors [illustrious|El]."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "Vous devez pouvoir débourser [GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] d’[gold|El][gold_i]"
 pam_prepare_holy_myron_decision_afford_india_tt: "Vous devez pouvoir débourser [GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] d’[gold|El][gold_i]"
 pam_prepare_holy_myron_journey_toast: "Départ de l'expédition pour le saint chrême"
 pam_prepare_holy_myron_journey_toast_tt: "Votre [court_chaplain|El] part à la recherche des ingrédients du saint chrême"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Votre [court_chaplain|El] part pour #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. À son retour, une ampoule de saint chrême [common|El] sera consacrée... à condition que le voyage se passe bien"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Votre [court_chaplain|El] part pour #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! et le #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. À son retour, une ampoule de saint chrême de rareté [masterwork|E] sera consacrée... mais les bandits et les aléas du voyage pourraient en réduire la quantité"
 pam_prepare_holy_myron_decision_india_effect_tt: "Votre [court_chaplain|El] part pour #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, le #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! et le #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. À son retour, une ampoule de saint chrême [famed|El] sera consacrée, avec #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! de chances qu’elle soit [illustrious|El]... mais les bandits et les aléas du voyage pourraient en réduire la quantité"
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0011.desc_levant: "Je vous écris depuis les rives de la mer salée, où le [Glossary('baume de Judée','pam_myron_gloss_balsam')] coule de l’écorce entaillée telles des larmes d’or. Les cultivateurs ont été durs en négociations, mais la résine est authentique : une simple goutte sur le poignet suffit à embaumer toute une pièce. Le premier ingrédient est désormais en notre possession."
 pam_holy_myron.0011.desc_arabia: "La route de l’encens fut longue et les puits peu nombreux, mais le Dhofar nous a donné ce que nous étions venus chercher : de l’[Glossary('encens','pam_myron_gloss_frankincense')] aussi pâle que le givre du petit matin, et de la [Glossary('myrrhe','pam_myron_gloss_myrrh')] aussi sombre que du sang séché. Les maîtres caravaniers jurent qu’aucun port au monde ne voit passer de résine plus précieuse. Je les crois, aussi ai-je payé en conséquence."
 pam_holy_myron.0011.desc_india: "La traversée éprouva toutes les âmes à bord, mais les marchés de la côte de Malabar recèlent de merveilles : du [Glossary('nard','pam_myron_gloss_spikenard')] des hautes montagnes, et de la [Glossary('cannelle','pam_myron_gloss_cinnamon')] plus sucrée que toutes celles que j’aie jamais goûtées. Nous avons rassemblé tous les ingrédients. Nous prenons le chemin du retour."
 pam_holy_myron.0011.a: "Puisse le reste du voyage être prompt."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], le malheur s’abat sur nous,"
 pam_holy_myron.0012.desc: "Des hommes armés nous barrent la route. Ils se disent percepteurs de péage, bien qu’aucune couronne ne leur ait jamais accordé ce droit. Ils ont compté nos coffres et en connaissent la valeur ; moyennant tribut, ils consentiront à nous laisser passer sans nous dépouiller.\n\nJ’attends vos ordres et garde les baumes près de moi."
 pam_holy_myron.0012.a: "Payez-les. Le chrême vaut bien plus que l’argent."
 pam_holy_myron.0012.b: "L’argent de l’Église n’est pas destiné aux brigands."
 pam_holy_myron.0012.b.tt: "Les baumes seront pillés, et le saint chrême sera de #N moindre qualité#!"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0013.desc: "La fièvre s’est emparée de moi sur la route. Mes mains tremblent tandis que j’écris, et la femme de l’aubergiste ne jure que par trois remèdes, tous plus répugnants les uns que les autres. N’ayez crainte, les baumes sont secs, bien scellés et mieux protégés que je ne le suis. Je reprendrai la route dès que mes jambes pourront me porter."
 pam_holy_myron.0013.a: "Je vais prier pour [myron_chaplain.Custom('FR_LuiElle')]."
 pam_holy_myron_journey_abandoned_toast: "Abandon de l'expédition pour le saint chrême"
 pam_holy_myron.0020.t: "Le voyage s’arrête"
 pam_holy_myron.0020.desc: "La lettre d’un marchand m’apporte la nouvelle : [myron_chaplain.Custom('FR_le_Char_Pi')][myron_chaplain.GetTitledFirstName], que j’avais envoyé[myron_chaplain.Custom('FR_E')] chercher les ingrédients du saint chrême, a trouvé la mort loin d’ici. Les baumes ont fini entre les mains d’étrangers, et ni mon argent ni son dur labeur ne permettront de préparer le chrême."
 pam_holy_myron.0020.a: "Puisse [ROOT.Char.GetFaith.HighGodName] lui accorder le repos éternel."
 pam_holy_myron.0100.t: "La consécration du chrême"
 pam_holy_myron.0100.desc.intro: "[myron_chaplain.Custom('FR_le_Char_Pi')|U][myron_chaplain.GetTitledFirstName], éprouvé[myron_chaplain.Custom('FR_E')] par son voyage, me revient enfin, et ma Cour sent la cargaison avant même de la voir. L’huile est mélangée derrière des portes closes, et une goutte du chrême précédent est incorporée au nouveau, comme cela se fait depuis l’époque des apôtres.\n\n"
 pam_holy_myron.0100.desc_full: "Tous les ingrédients ont survécu au voyage. Doré et parfumé, le chrême ainsi préparé est versé dans son ampoule et placé devant mon autel."
 pam_holy_myron.0100.desc_robbed: "Une grande quantité a été perdue en chemin, et le mélange s’en trouve appauvri, mais la consécration restaure ce que le voyage a amoindri, et l’ampoule trouve malgré tout sa place devant mon autel."
 pam_holy_myron.0100.a: "La chaîne de bénédiction demeure intacte."
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "Une dernière onction"
 pam_holy_myron.0200.desc: "Les pleureurs s’écartent à mon approche du cercueil, l’objet [pam_holy_myron_artifact.GetName] porté devant moi. Sous le regard de la cour réunie, une croix de saint chrême sur son front enverrait [deceased.Custom('FR_le_Char_Pi')][deceased.GetTitledFirstName] devant le trône [ROOT.Char.GetFaith.HighGodNamePossessive] marqué[deceased.Custom('FR_E')] comme l’un[deceased.Custom('FR_E')] des oint[deceased.Custom('FR_E')]s, un honneur dont chaque âme présente sera témoin et qu’elle racontera. Cependant, chaque goutte versée sur les morts est une goutte de moins pour les vivants."
 pam_holy_myron.0200.a: "Qu’on oigne [deceased.GetFirstNameNoTooltip]."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#! sera considéré[deceased.Custom('FR_E')] d’un œil plus favorable lors de l’examen de sa candidature à la canonisation"
 pam_holy_myron.0200.b: "Le chrême est réservé aux vivants."
 pam_holy_myron.0200.b.tt: "Vous gardez le saint chrême pour ceux qu’il peut encore bénir"
 ### Spending the oil
 pam_holy_myron_spend_tt: "Une dose de votre ampoule de saint chrême a été utilisée"
 pam_holy_myron_spend_last_tt: "La #N dernière#! dose de saint chrême a été utilisée, l’ampoule, désormais vide, sera #N perdue#!"
 pam_holy_myron_vessel_spent_toast: "L’ampoule est vide"
 pam_holy_myron_vessel_spent_tt: "Sa dernière dose de chrême ayant été versée, l’ampoule est désormais mise hors d’usage"
 ### Coronation
 pam_holy_myron_coronation_option: "Que le saint chrême scelle cette couronne."
 pam_holy_myron_coronation_option.flavor: "Utilisez une dose de saint chrême pour vous oindre vous-même."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nL’artefact a été oint de saint chrême lors d’un couronnement. Il conserve encore aujourd’hui cette bénédiction."
 pam_holy_myron_coronation_memory: "oint[owner.Custom('FR_E')] de saint chrême"
 pam_holy_myron_coronation_memory_desc: "Lors de mon couronnement, [anointer.Custom('FR_le_Char_Pi')][anointer.GetTitledFirstName] m’a oint[owner.Custom('FR_E')] de saint chrême."
 pam_holy_myron_coronation_memory_desc_second_perspective: "Lors de votre couronnement, [anointer.Custom('FR_le_Char_Pi')][anointer.GetTitledFirstName] vous a oint[owner.Custom('FR_E')] de saint chrême."
 pam_holy_myron_coronation_memory_desc_third_perspective: "[owner.Custom('FR_le_Char_Pi')|U][owner.GetTitledFirstName] a été oint[owner.Custom('FR_E')] de saint chrême lors de son couronnement."
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "Oindre un artefact de saint chrême"
 pam_anoint_artifact_decision_tooltip: "Utilisez une dose de saint chrême pour [sanctify|El] l’un de vos [artifacts|El], indépendamment de vos principes"
 pam_anoint_artifact_decision_desc: "Le chrême ne requiert pas l’assentiment du clergé. Tout ce qu’il touche, qu’il s’agisse d’une lame, d’un livre ou d’un bibelot, est [sanctified|El] pour la foi [ROOT.Char.GetFaith.GetAdjective], et aucun principe ni évêque ne peut s’y opposer."
 pam_anoint_artifact_decision_confirm: "L’oindre"
 pam_anoint_artifact_decision_no_item_selected: "Aucun [artifact|El] sélectionné"
 pam_anoint_artifact_needs_myron_tt: "Doit posséder une #V ampoule de saint chrême#! contenant encore de l’huile"
 pam_anoint_artifact_has_eligible_artifact_tt: "Doit posséder un [artifact|El] n’étant pas déjà [sanctified|El]"
 pam_anoint_artifact_not_myron_tt: "Le saint chrême ne peut pas s’oindre lui-même"
 pam_anoint_artifact_not_already_chrismated_tt: "Ne doit pas déjà être oint"
 pam_anoint_artifact_toast: "Artefact oint"
 pam_chrismated_artifact_name: "[pam_anointed_artifact.GetNameNoTooltip] oint(e)"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\nL’artefact a été oint de saint chrême et brille légèrement sous l’effet de l’huile sainte."
 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "Faire don de saint chrême"
 pam_give_holy_myron_interaction_desc: "Remplissez une nouvelle ampoule de votre saint chrême et offrez-la [recipient.Custom('FR_au_Char_U_Pi')][recipient.GetShortUIName]. Votre récipient perd une dose, mais vous gagnez de la [piety|El] et la gratitude [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName]."
 pam_give_holy_myron_recipient_toast: "Don de saint chrême"
 pam_give_holy_myron_recipient_tt: "Vous recevez une [Concept('artifact','ampoule de saint chrême')|E] [common|El] contenant une unique dose"
 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "Chrismation du nouveau-né"
 pam_holy_myron_unction_toast: "L’onction des malades"
 pam_holy_myron.0300.t: "Le sceau de l’Esprit"
 pam_holy_myron.0300.desc: "M[child.Custom('FR_OnA')] [child.Custom('GetDaughterSon')] [child.GetFirstName] hurle dans les bras du [myron_officiant.GetFaith.PriestNeuter] tandis que l’on apporte le chrême.\n\nL’église dispose de suffisamment d’huile sainte pour chaque nouveau-né, mais ma propre ampoule de saint chrême se trouve à portée de main, et une simple goutte suffirait à marquer c[child.Custom('FR_EtEtte')] enfant pour la vie."
 pam_holy_myron.0300.desc_twin: "\n\n[pam_myron_twin.GetFirstName] repose emmailloté[pam_myron_twin.Custom('FR_E')] aux côtés de [Select_CString(child.IsFemale,'sa jumelle','son jumeau')], attendant le même sceau."
 pam_holy_myron.0300.a: "L’huile sainte de l’église fera l’affaire."
 pam_holy_myron.0300.b: "Rien ne vaut le saint chrême."
