l_french:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "En [GetSituation('the_christian_church').GetTopSubRegion.GetName] se trouvent de nombreux pays et peuples, avec leurs langues, leurs cultures et leurs conflits.\n\nBien que les divergences doctrinales soient aussi anciennes que l’Église elle-même, notre unité est mise à rude épreuve en ces temps où nous sommes en proie aux épidémies, aux guerres et à l’hérésie.\n\nTout comme l’apôtre [st_paul.GetFirstName] a exhorté les Corinthiens à rechercher l’unité, tous les [christians|El] devraient suivre son conseil et [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. Sinon, nous nous retrouverons dans le marécage de l’hérésie et ne serons rien d’autre que les jouets de l’Antéchrist.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Nos voisins mous, les [christians|El], suivent un dieu faible et jaloux et se disputent comme des enfants au sujet de l’apparence de leur poupée. Leur vigilance s’en trouve altérée et leurs épées s’émoussent, tant il y a longtemps qu’ils n’ont pas goûté à un véritable bain de sang.\n\nIls veulent nous envoyer des hommes saints pour répandre leur faiblesse sur nos terres. Nous devrions leur rendre visite et piller leurs trésors ! Grâce à notre exemple, ils apprendront peut-être à redevenir forts."
 pam_the_christian_church.0051.desc.heathen_rulers: "Nos voisins [christians|El] sont des gens grossiers et querelleurs. Ils sont comme de la vase dans l’eau, un miroir terni aux yeux [ROOT.Char.GetFaith.HighGodNamePossessive]. Comme ils s’accrochent au passé, leurs fausses croyances ne mèneront qu’à leur perte.\n\nLeurs richesses, aussi maigres soient-elles, sont faciles à obtenir. Leur peuple, aussi indiscipliné soit-il, est mûr pour la soumission."
 pam_the_christian_church.0051.desc.heretic_rulers: "Ce porc assis sur le trône de [st_peter.GetName] nous traiterait d’hérétiques, alors que nous sommes les véritables croyants. Si le Christ renaissait, il deviendrait sans doute un pharisien et exigerait une nouvelle crucifixion du Seigneur.\n\nRegardez la division qui nous sépare, nous qui appelons le Christ notre Seigneur ! C’est le faux prêtre de Rome qui sème la discorde.\n\nCe représentant de Satan cherche à faire de nous des martyrs. En vérité, ce mal doit être éliminé afin que tous les [christians|El] puissent être sauvés !"
 pam_the_christian_church.0051.desc.western: "Maintenant que le pouvoir de l’évêque de Rome s’est effrité, nous devons colmater les fissures de la foi alors que nous approchons du Jugement dernier."
 pam_the_christian_church.0051.desc.eastern: "Encerclés par les ennemis du Christ, nous devons nous rallier à l’évêque de Rome alors que nous approchons du Jugement dernier."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nLe Concile laisse aux couronnes la liberté de destituer les prélats nommés par l’Église."
 pam_the_christian_church.0051.desc.oriental_orthodox: "« [Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )] ». À l’approche du Jugement dernier, nous devons ramener nos frères vers la lumière."
 pam_the_christian_church.0051.a: "Avec le Christ comme guide !"
 pam_the_christian_church.0051.b: "Nous devons garder un œil sur ces disciples du Christ."
 MIAPHYSITISM_GLOSS: "« #bold Il n’y a qu’une seule nature de la Parole de Dieu incarné !#! » proclama Cyrille d’Alexandrie lors du concile d’Éphèse en 431. Cette doctrine christologique, également connue sous le nom de miaphysisme, est généralement défendue par les Églises orthodoxes orientales."
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "Un chœur de voix s’élève dans l’obscurité qui enveloppe l’[GetSituation('the_christian_church').GetTopSubRegion.GetName].\n\n« #EMP Rome se présente comme une Sodome moderne !#! »\n\n« #EMP Le pape se fait à la fois proxénète et prostituée !#! »\n\nMême ceux qui ont un point de vue plutôt modéré doivent admettre que l’Église est en crise et que des réformes sont nécessaires."
 pam_the_christian_church.0052.desc.unreformed_pagan: "Nos voisins à la volonté faible, les [christians|El], se lamentent : « Notre fin est proche ! Notre pape est aussi barbare qu’un païen. »\n\nAu moins l’une de ces deux affirmations est vraie. Aidons-les à trouver cette fin qu’ils invoquent si souvent !"
 pam_the_christian_church.0052.desc.heathen_rulers: "« Notre Église traverse une crise ! » se lamentent les [christians|El].\n\nC’est bien qu’ils expriment ce que nous avons toujours su. Ces païens insensés peuvent espérer suivre un jour notre exemple et embrasser la doctrine [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nLeurs richesses, aussi maigres soient-elles, sont à portée de main. Leur peuple, aussi indiscipliné soit-il, est mûr pour être soumis."
 pam_the_christian_church.0052.desc.heretic_rulers: "Il faut mettre un terme à cet antéchrist déguisé en saint Pierre !"
 pam_the_christian_church.0052.desc.western: "Le changement doit avoir lieu à Rome, car ce n’est qu’ainsi que [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] pourra guérir."
 pam_the_christian_church.0052.desc.eastern: "Encerclés par les ennemis du Christ, nous devons éradiquer la corruption à Rome, sinon elle nous dévorera."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "Que le Seigneur éclaire notre chemin !"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "Nous devons nous réjouir des progrès remarquables de notre mission ! Les frontières de l’[GetSituation('the_christian_church').GetTopSubRegion.GetName] s’étendent, car les sauvages païens apprennent à suivre la voie du Christ.\n\nMalheureusement, tous n’accueillent pas favorablement les enseignements de l’Église. Il n’y a rien à craindre, car s’ils rejettent nos missionnaires, ils découvriront nos prières par la pointe de l’épée !\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "Les [christians|El] viennent dans nos contrées avec leurs saints hommes. Si nous les repoussons, ils reviendront avec leurs épées.\n\nBien que beaucoup d’entre nous s’efforcent de rester fidèles [ROOT.Char.GetFaith.HighGodName2], certains voient un intérêt à servir cet Homme-Dieu, ce Christ. Le pouvoir serait conféré par la volonté divine, l’Église pourrait servir de messagère et, plus intéressant encore, percevrait des impôts."
 pam_the_christian_church.0053.desc.heathen_rulers: "Nos voisins, les [christians|El], convertissent de force les idolâtres, lorsque ceux-ci valent mieux que d’être simplement massacrés.\n\nBien que leurs épées ne soient pas braquées sur nous, [ROOT.Char.GetFaith.HighGodName] nous a offert une opportunité. Leurs richesses, aussi maigres soient-elles, sont à portée de main. Leur peuple, aussi indiscipliné soit-il, est mûr pour la soumission."
 pam_the_christian_church.0053.desc.heretic_rulers: "Le prétendant de Rome espère convertir les païens à son faux culte ! Cet antéchrist ne se contentera pas d’avoir empoisonné l’esprit des [christians|El] ; sa soif perverse le pousse à vouloir précipiter ces idolâtres inexpérimentés dans ses bras infernaux."
 pam_the_christian_church.0053.desc.western: "Nous devons faire preuve de prudence, car ces chrétiens nouvellement convertis sont incités à pratiquer le rite [ROOT.Char.GetRite.GetAdherentName|l], tel qu’il est approuvé par le siège de Saint-Pierre."
 pam_the_christian_church.0053.desc.eastern: "Même si Rome prétend ne vouloir que la conversion de ceux qui vivent en dehors de [GetSituation('the_christian_church').GetTopSubRegion.GetName], nous devons rester vigilants au cas où elle nous priverait de notre rite [ROOT.Char.GetRite.GetAdherentName] – ou pire encore : brandirait ses épées encore maculées de sang païen contre ses frères chrétiens."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\nUne tâche ardue attend [christianity.GetReligiousHead.Custom('FR_le_Char_Pi')][christianity.GetReligiousHead.GetTitledFirstName], mais l’Église peut encore être sauvée.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nPour autant, l’Église n’est pas perdue !\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Notre foi en Dieu est peut-être inébranlable, mais beaucoup ont perdu la foi en l’Église. Autrefois, celle-ci était exemplaire dans ses actions, à l’image du Christ, mais aujourd’hui, le clergé a perdu une grande partie de son indépendance et est devenu un instrument au service de l’influence des empereurs et des rois."
 pam_the_christian_church.0054.desc.unreformed_pagan: "Les [christianity.GetAdherentNamePlural] sont en train de déchirer leurs propres ornements ecclésiastiques, espérant que Dieu ne remarquera pas les reprises. S’ils sont occupés à raccommoder leurs chasubles et leurs annales, peut-être enverront-ils moins de clercs importuner nos bois sacrés et nos sanctuaires au bord des rivières."
 pam_the_christian_church.0054.desc.heathen_rulers: "Les [christianity.GetAdherentNamePlural] s’efforcent de renouveler en profondeur leurs lois et leurs autels ; chaque faction proclame un culte plus pur au dieu de la souffrance. Nous prenons note de leurs nouveaux slogans, mais le tranchant de nos haches continuera de répondre avec plus de clarté que leurs conciles."
 pam_the_christian_church.0054.desc.heretic_rulers: "Les fanatiques de Rome se déchirent au sujet de la réforme. Ils prétendent renouveler leur religion, mais ce n’est qu’une nouvelle version de la même domination, renforcée par une soi-disant supériorité morale. Tant mieux s’ils s’affrontent entre eux ; cela leur laissera moins de temps pour s’en prendre à nous."
 pam_the_christian_church.0054.desc.western: "Nous sommes en train de changer les choses, mais si nous appelons cela une réforme, les gens risquent de s’y opposer. Il vaut mieux présenter ces changements comme un retour aux traditions, car cette idée leur inspire davantage confiance."
 pam_the_christian_church.0054.desc.eastern: "Rome continue de réformer son administration, sa liturgie et ses règles, tout en prétendant parler au nom de toute la chrétienté. Nous observons ces changements avec méfiance, nous les critiquons et nous consolidons nos propres synodes afin que les usages particuliers de l’Occident ne deviennent pas, par prétention, la règle universelle."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nLe conseil a décidé que l’Église disposerait d’un droit de nomination à vie."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nLes princes séculiers exigent des évêques de [christianity.GetReligiousHeadTitle.GetName] qu’ils prêtent serment, comme si la consécration n’était qu’une simple ferme de plus à louer. Pendant ce temps, [christianity.GetReligiousHeadTitle.GetName] interdit aux souverains de bénir des mitres qu’ils n’ont pas consacrées.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nEn l’absence d’un guide incontesté, chaque trône nomme ses propres évêques : les habits sont sacrés, mais les ordinations sentent davantage l’argent que l’encens.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "Partout en [GetSituation('the_christian_church').GetTopSubRegion.GetName], la querelle entre l’autel et le trône n’est plus une simple rumeur."
 pam_the_christian_church.0055.desc.unreformed_pagan: "Tandis que les [christianity.GetAdherentNamePlural] se disputent pour savoir si c’est une couronne ou une robe liturgique qui fait un évêque, de moins en moins de regards missionnaires se tournent vers nous. Laissons les rois et les pontifes s’étouffer dans leurs chartes respectives. Leur division rend nos bois plus calmes."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "Rome dénonce la tyrannie de l’investiture, mais n’hésiterait pourtant pas à enchaîner nos maîtres si elle pouvait mettre la main sur eux ! Débarrassez-vous d’abord de vos propres chaînes, pharisiens, avant de nous faire la leçon !"
 pam_the_christian_church.0055.desc.western: "Si nous rapprochons trop la crosse épiscopale du sceptre, on finirait par les confondre.\n\n"
 pam_the_christian_church.0055.desc.eastern: "Les rois occidentaux se disputent avec Rome pour des anneaux et des crosses, et leurs mœurs pécheresses entachent l’institution tout entière.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "Partout en [GetSituation('the_christian_church').GetTopSubRegion.GetName], les fidèles réclament la libération du Saint-Sépulcre. On astique les croix en vue de la marche et on met en gage des reliques pour financer la guerre.\n\nLe zèle brûle avec passion, mais s’il venait à s’éteindre, il pourrait se transformer en doutes aussi vite que les cendres d’un bûcher s’envolent au vent.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Leurs prédicateurs bellicistes appellent à la croisade tout en négligeant leurs propres terres : laissons les Romains s’épuiser dans des déserts lointains."
 pam_the_christian_church.0056.desc.western: "L’acier peut accomplir ce que les sermons ne parviennent pas à faire.\n\n"
 pam_the_christian_church.0056.desc.eastern: "Les armées occidentales marchent vers la Terre Sainte.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ sous la supervision du [christianity.GetReligiousHeadTitle.GetName].\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nMême si elle n’a pas de guide incontestable, la foi est vouée à retrouver la raison.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "Les conflits au sein de l’Église prennent fin. [GetSituation('the_christian_church').GetTopSubRegion.GetName] entre dans une ère de paix et de communion"
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "Les écoles ont beau avancer des arguments, la Parole de Dieu continue néanmoins de toucher la plupart des âmes par l’intermédiaire d’un prêtre.\n\nNous ne devons pas oublier que la nôtre est une religion du peuple."
 pam_the_christian_church.0057.desc.eastern: "Nous continuons à chanter des prières tandis que les bureaux occidentaux crissent sous le poids des traités. L’harmonie est la bienvenue, mais leurs querelles académiques ne devraient pas s’immiscer dans nos chancelleries."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "Un concile est convoqué"
 pam_the_christian_church.0058.desc: "Les longues années de [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] atteignent leur paroxysme. Un concile est convoqué afin de décider une fois pour toutes à qui revient l’investiture du clergé : à l’Église ou à la Couronne."
 pam_the_christian_church.0058.a: "Que la décision soit prise."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "Le Concile se réunit"
 pam_the_christian_church.0059.desc.located: "Les convocations envoyées, les pères de l’Église se rassemblent à présent pour le Concile d’investiture, réunis par [investiture_convene_host.Custom('FR_le_Char_Pi')][investiture_convene_host.GetTitledFirstName] à [investiture_convene_location.GetName]. Sa décision tranchera, pour toute la chrétienté, si l’investiture du clergé revient à l’Église ou à la Couronne."
 pam_the_christian_church.0059.desc: "Les convocations envoyées, les pères de l’Église se rassemblent à présent pour le Concile d’investiture. Sa décision tranchera, pour toute la chrétienté, si l’investiture du clergé revient à l’Église ou à la Couronne."
 pam_the_christian_church.0059.a: "Laissons-les délibérer."
 pam_the_christian_church_not_hof_trigger_tt: "Vous n’êtes pas le chef de la foi"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "Un concile spécial de l’Église se réunira prochainement pour décider de votre prochaine [doctrine|El] de nomination des religieux de la [faith|El]."
 pam_the_christian_church.0060.t: "Qu’il n’y ait pas de divisions parmi vous"
 pam_the_christian_church.0060.desc: "La chrétienté est au bord du précipice. Le rite [schism_mainline_rite.GetAdherentName|l] revendique l’héritage des apôtres, tandis que le rite [schism_competitor_rite.GetAdherentName|l] refuse de céder.\n\nLe Christ a averti : « [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. » Si on laisse la situation s’envenimer, l’Église pourrait ne plus jamais parler d’une seule voix."
 pam_the_christian_church.0060.a: "Je suis aux côtés du rite [schism_mainline_rite.GetNameNoTooltip|l]."
 pam_the_christian_church.0060.a.tt: "Contribue à la [decision|El] visant à [GetDecisionWithKey('pam_cause_great_schism_decision').GetName|l]"
 pam_the_christian_church.0060.b: "Je suis aux côtés du rite [schism_competitor_rite.GetNameNoTooltip|l]."
 pam_the_christian_church.0060.b.tt: "Contribue à la [decision|El] visant à [GetDecisionWithKey('pam_cause_great_schism_decision').GetName|l]"
 pam_the_christian_church.0060.c: "Un corps a besoin de deux bras."
 pam_the_christian_church.0060.c.tt: "Contribue à la [decision|El] visant à [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName|l]"
 pam_the_christian_church.0061.t: "Le Grand Schisme"
 pam_the_christian_church.0061.desc: "Les émissaires de [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] ont prononcé leur verdict sur l’autel :\n\n« Que l’anathème s’abatte sur [schism_eastern_faith.GetReligiousHead.GetFirstName], faussement appelé [schism_eastern_faith.ReligiousHeadName|l], et ses partisans. [Glossary( 'Maranatha', 'MARANATHA_GLOSS' )] à tous les hérétiques ! Non, au diable et à ses anges, à moins qu’ils ne se repentissent. »\n\n« Ce document impie sera frappé d’anathème, ainsi que tous ceux qui l’ont modifié, rédigé ou qui y ont été associés de quelque manière que ce soit », réplique [schism_eastern_faith.GetReligiousHead.Custom('FR_le_Char_Pi')][schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nLes fidèles sont divisés entre les [schism_western_faith.GetAdherentNamePlural] et les [schism_eastern_faith.GetAdherentNamePlural]. Désormais, mon âme appartient à la foi [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 pam_the_christian_church.0061.desc.bystander: "Une nouvelle nous parvient depuis [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] : les légats ont prononcé l’anathème devant l’autel, et [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] a répondu de la même manière.\n\nCeux qui se disaient autrefois appartenir à une seule Église se divisent désormais en [schism_western_faith.GetAdherentNamePlural] et [schism_eastern_faith.GetAdherentNamePlural]. Leur conflit n’a jamais été le mien, et la foi [ROOT.Char.GetFaith.GetAdjective] n’en est pas affectée, mais c’est néanmoins un triste spectacle."
 pam_the_christian_church.0061.a: "Ainsi soit-il."
 pam_the_christian_church.0061.a.shame: "C’est vraiment dommage."
 pam_the_christian_church.0061.a.bystander: "Quel dommage que des frères s’affrontent."
 MARANATHA_GLOSS: "Une expression araméenne qui signifie « #bold Seigneur, viens !#! », tirée de 1 Corinthiens 16:22, qui est devenue une formule d’anathème : ceux qui en sont frappés sont bannis jusqu’au retour du Seigneur."
 pam_the_christian_church.0062.t: "Communion préservée"
 pam_the_christian_church.0062.desc: "La plaie qui menaçait de diviser la chrétienté a été refermée. Grâce à l’action [schism_peacemaker.Custom('FR_du_Char_Pi')][schism_peacemaker.GetTitledFirstName], les sièges épiscopaux en conflit sont réunis autour d’une même table.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\nLa foi [ROOT.Char.GetFaith.GetAdjective] reste en communion."
 pam_the_christian_church.0062.a: "Béni soit le Seigneur."
 pam_the_christian_church.0062.a.peacemaker: "Aucun siège ne doit prévaloir sur les autres."
 pam_the_christian_church.0062.b: "Que [new_head_of_faith.Custom('FR_le_Char_Pi')][new_head_of_faith.GetTitledFirstNameNoTooltip] nous guide tous."
 pam_the_christian_church.0062.b.self: "Alors, que tous les fidèles me répondent."
 pam_the_christian_church.0063.t: "Des chemins désormais séparés"
 pam_the_christian_church.0063.desc: "J’ai adopté le rite [ROOT.Char.GetRite.GetAdherentName], mais [schism_dissenter.Custom('FR_le_Char_Pi')][schism_dissenter.GetTitledFirstName] ne m’a pas suivi[ROOT.Char.Custom('FR_E')]. [schism_dissenter.Custom('FR_IlElle')|U] continue de s’inquiéter pour mon âme et mon ancienne communauté :\n\n« Vous nous avez abandonnés », dit-[schism_dissenter.Custom('FR_IlElle')] à voix basse. « Si l’Église se déchire... et elle le fera... alors nous nous retrouverons tous deux dans des camps opposés. »"
 pam_the_christian_church.0063.a: "C’est le même Dieu qui nous écoute tous deux."
 pam_the_christian_church.0063.b: "Laissez-moi vous expliquer pourquoi je me suis converti[ROOT.Char.Custom('FR_E')]."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.Custom('FR_le_Char_Pi')|U][schism_dissenter.GetTitledFirstNameNoTooltip] fait de même"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.Custom('FR_le_Char_Pi')|U][schism_dissenter.GetTitledFirstNameNoTooltip] reste sur ses positions"
 pam_the_christian_church.0063.c: "Gardez vos craintes pour vous."
 pam_the_christian_church.0064.t: "La plaie va s’ouvrir"
 pam_the_christian_church.0064.desc.opening.self_mainline: "Ma voix s’élève contre celle [schism_competitor_head.Custom('FR_du_Char_Pi')][schism_competitor_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening.self_competitor: "Ma voix s’élève contre celle [schism_mainline_head.Custom('FR_du_Char_Pi')][schism_mainline_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening: "Les voix [schism_mainline_head.Custom('FR_du_Char_Pi')][schism_mainline_head.GetTitledFirstName] et [schism_competitor_head.Custom('FR_du_Char_Pi')][schism_competitor_head.GetTitledFirstName] s’élèvent l’une contre l’autre."
 pam_the_christian_church.0064.desc: "Je ne vois aucun moyen pour que les rites [schism_mainline_rite.GetAdherentName] et [schism_competitor_rite.GetAdherentName] parviennent à retrouver l’unité.\n\nL’avertissement des Écritures s’est transformé en jugement : [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. La communion de la foi [christianity.GetAdjective] n’est pas encore brisée, mais la plaie va s’ouvrir. C’est inéluctable."
 pam_the_christian_church.0064.a: "Par piété Seigneur, ne nous abandonne pas."
 pam_the_christian_church.0064.a.tt: "La progression vers le Grand Schisme a atteint son seuil"
