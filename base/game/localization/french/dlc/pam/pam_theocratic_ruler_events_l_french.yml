l_french:
 pam_theocratic_ruler_events.0001.t: "Un héritage pour l’Église"
 pam_theocratic_ruler_events.0001.desc: "Un riche marchand a légué son héritage à l’Église, et la somme n’est pas négligeable.\n\nM[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] m’a apporté les documents correspondants et les déclarations d’intention. [subordinate_priest.Custom('FR_IlElle')|U] me regarde et me demande mon avis.\n\n« Le testament stipule que ces fonds doivent servir à renforcer la foi. »"
 pam_theocratic_ruler_events.0001.a: "Je trouve des preuves indiquant qu’[subordinate_priest.Custom('FR_IlElle')] a détourné des fonds de l’Église..."
 pam_theocratic_ruler_events.0001.b: "« En tant qu’ecclésiastiques, discutons ensemble de manière raisonnable. »"
 pam_theocratic_ruler_events.0001.c: "Direction le Trésor, avec toute ma gratitude."
 pam_theocratic_ruler_events.0001.b.success: "Les voies du Seigneur sont impénétrables"
 pam_theocratic_ruler_events.0001.b.failure: "[Select_CString(subordinate_priest.IsFemale,'La prêtresse','Le prêtre')] ne veut rien entendre"
 pam_theocratic_ruler_events.0001.b.toast.success: "Vous [subordinate_priest.Custom('FR_LeLa')] persuadez et acceptez l’héritage."
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.Custom('FR_IlElle')|U] conserve le don destiné [ROOT.Char.GetFaith.HighGodName2]."
 pam_theocratic_ruler_events.0002.t: "[Select_CString(foreign_ruler.IsFemale,'Une voyageuse venue','Un voyageur venu')] de l’autre côté de la frontière"
 pam_theocratic_ruler_events.0002.desc: "J’ai appris que [foreign_ruler.Custom('FR_le_Char_Pi')][foreign_ruler.GetTitledFirstName], [Select_CString(foreign_ruler.IsFemale,'une voisine','un voisin')] et adepte de l’ancienne foi [foreign_ruler.GetFaith.GetAdjective], traverse mes terres.\n\nSa petite suite souhaite en réalité se rendre ailleurs, mais son itinéraire passe suffisamment près de chez moi pour qu’on s’attende à ce qu’[foreign_ruler.Custom('FR_IlElle')] vienne me présenter ses respects à ma Cour.\n\nComment dois-je les accueillir ?"
 pam_theocratic_ruler_events.0002.a: "Avec un modeste cadeau et une proposition de paix."
 pam_theocratic_ruler_events.0002.b: "« Je recherche un dialogue sincère entre nos peuples. »"
 pam_theocratic_ruler_events.0002.b.success: "Ma courtoisie les captive"
 pam_theocratic_ruler_events.0002.b.failure: "Mes paroles sonnent creux"
 pam_theocratic_ruler_events.0002.b.toast.success: "Votre courtoisie l’emporte, et la tolérance entre vos peuples s’accroît"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.Custom('FR_IlElle')|U] reste de marbre ; vos paroles sonnent creux"
 pam_theocratic_ruler_events.0002.b.acceptance: "Délégation de la Cour"
 pam_theocratic_ruler_events.0002.c: "Les païens n’ont pas leur place chez nous."
 TRUCE_PAM_NEIGHBOR_GIFT: "\nUne trêve fondée sur des gestes de bonne volonté et le respect mutuel entre voisins"
 pam_theocratic_ruler_events.0003.t: "Conseils pour un renforcement de la frontière"
 pam_theocratic_ruler_events.0003.desc: "La guerre et les brigands mettent déjà suffisamment mon pays à rude épreuve. Je convoque [advisor.Custom('FR_le_Char_Pi')][advisor.GetTitledFirstName], [Select_CString(advisor.IsFemale,'ma conseillère','mon conseiller')] de confiance, et ensemble, nous réfléchissons à ce qu’il convient de faire.\n\n« Nous pourrions nous tourner vers [alliance_target.Custom('FR_le_Char_Pi')][alliance_target.GetTitledFirstName]. C’est [alliance_target.Custom('FR_LuiElle')] aussi [Select_CString(alliance_target.IsFemale,'une dirigeante','un dirigeant')] théocratique de notre foi et [alliance_target.Custom('FR_IlElle')] pourrait venir à notre secours. »\n\nOu devrais-je plutôt assumer ce fardeau moi-même ?"
 pam_theocratic_ruler_events.0003.a: "Envoyons des messagers. Nous devons rester unis."
 pam_theocratic_ruler_events.0003.a.tt: "Vous formez une [alliance|El] avec [alliance_target.Custom('FR_le_Char_U_Pi')][alliance_target.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0003.b: "Mobilisons les paysans croyants pour la défense des frontières."
 pam_theocratic_ruler_events.0003.b.army: "Paysans croyants"
 pam_theocratic_ruler_events.0003.c: "Envoyons des renforts et remettons sur pied un comté qui a été pillé."
 pam_theocratic_ruler_events.0003.d: "Je remets cela entre les mains [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0004.t: "Des frères pour voisins"
 pam_theocratic_ruler_events.0004.desc: "Puisqu’un ordre monastique – [monastic_order_head.GetPrimaryTitle.GetName] – se trouve tout près, j’ai invité [monastic_order_head.Custom('FR_le_Char_Pi')][monastic_order_head.GetTitledFirstName] afin de discuter de la manière dont nous pourrions renforcer notre collaboration.\n\n« [monastic_order_head.GetFaith.HighGodName|U] ne nous juge pas sur notre orgueil, mais sur notre volonté de le servir », dit-[monastic_order_head.Custom('FR_IlElle')] doucement."
 pam_theocratic_ruler_events.0004.a: "Je vous prie de demander à vos frères de bénir mes terres."
 pam_theocratic_ruler_events.0004.b: "Votre élève, [monastic_monk.GetTitledFirstNameNoTooltip], serait un atout pour ma Cour."
 pam_theocratic_ruler_events.0004.c: "Prions ensemble."
 pam_theocratic_ruler_events.0005.t: "Des épées pour la foi"
 pam_theocratic_ruler_events.0005.desc: "Puisqu’un ordre militaire – [military_order_head.GetPrimaryTitle.GetName] – s’est établi dans mon pays, j’ai invité [military_order_head.Custom('FR_le_Char_Pi')][military_order_head.GetTitledFirstName] à venir discuter de la manière dont les épées des fidèles pourraient se mettre au service les unes des autres.\n\n« [military_order_head.GetFaith.HighGodName|U] ne bénit pas l’acier inerte, mais les lames brandies pour défendre les fidèles », déclare-t-[military_order_head.Custom('FR_IlElle')], tandis que [order_knight.Custom('FR_le_Char_Pi')][order_knight.GetTitledFirstName] s’incline silencieusement à ses côtés."
 pam_theocratic_ruler_events.0005.a: "Entraînez mes [ROOT.Char.Custom('GetFighterTermPlural')] selon la discipline de votre ordre."
 pam_theocratic_ruler_events.0005.b: "Que [order_knight.Custom('FR_le_Char_Pi')][order_knight.GetTitledFirstNameNoTooltip] soit mon garde du corps."
 pam_theocratic_ruler_events.0005.c: "Parlons de guerre juste."
 pam_theocratic_ruler_events.0006.t: "La dîme ou la clémence"
 pam_theocratic_ruler_events.0006.desc: "On m’amène un chef de village du nom de [local_peasant_leader.GetTitledFirstName]. Alors que les habitants ont refusé de payer les impôts dus à l’Église, [local_peasant_leader.Custom('FR_IlElle')] plaide devant moi une période difficile.\n\n« L’hiver a été cruel, [ROOT.Char.Custom('FR_MonseigneurMadame')|U], et nos greniers sont presque vides », explique-t-[local_peasant_leader.Custom('FR_IlElle')] d’une voix tremblante.\n\nLe choix est simple : soit discipliner le pays par la peur, soit préserver la paix par la clémence."
 pam_theocratic_ruler_events.0006.a: "Aucune exception. Arrêtons [Select_CString(local_peasant_leader.IsFemale,'la meneuse','le meneur')]."
 pam_theocratic_ruler_events.0006.a.tt: "Vous gagnez [EmptyScope.ScriptValue('minor_gold_value')|0][gold_i], emprisonnez [local_peasant_leader.Custom('FR_le_Char_U_Pi')][local_peasant_leader.GetShortUINameNoTooltip], et [troubled_county.GetName] obtient #N $pam_tithes_or_mercy_harsh_tithes_modifier$#! pendant 5 ans (#N -20#! d’[county_opinion|El])."
 pam_theocratic_ruler_events.0006.b: "Passons là-dessus. La clémence peut aussi servir Dieu."
 pam_theocratic_ruler_events.0006.b.tt: "Vous gagnez [EmptyScope.ScriptValue('minor_piety_gain')|0][piety_i], et [troubled_county.GetName] obtient #P $pam_tithes_or_mercy_show_mercy_modifier$#! pendant 5 ans (#P +20#! d’[county_opinion|El])."
 pam_theocratic_ruler_events.0006.c: "C’est mon intendant qui a commis cette erreur. C’est de sa faute."
 pam_theocratic_ruler_events.0006.c.tt: "Si possible, vous gagnez un [hook|El] contre [ROOT.Char.GetCouncillor('councillor_steward').Custom('FR_le_Char_U_Pi')][ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] (un hameçon d’obligation plus fort est utilisé lorsqu’il est disponible). [ROOT.Char.GetCouncillor('councillor_steward').Custom('FR_le_Char_U_Pi')|U][ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] perd de l’[opinion|El] à votre égard (#N -20#!, décline sur 5 ans)."
 pam_theocratic_ruler_events.0007.t: "Harmonie bienheureuse"
 pam_theocratic_ruler_events.0007.desc: "Alors que les doux rayons du soleil dissipent la rosée matinale et réchauffent les pierres du parvis de l’église, je prends conscience d’une chose : pour une fois, le devoir ne me tire pas par la manche. Même une abeille laborieuse semble prendre le temps de s’arrêter pour réchauffer son dos aux premiers rayons de l’aube.\n\nMes terres sont plongées dans un silence serein. Les coffres sont pleins et mes ouailles sont satisfaites et me témoignent du respect. Même [Select_CString(ROOT.Char.GetLiege.IsFemale,'ma dame','mon seigneur')] lige, [ROOT.Char.GetLiege.Custom('FR_le_Char_Pi')][ROOT.Char.GetLiege.GetTitledFirstName], approuve ma manière guider ses sujets vers le Christ."
 pam_theocratic_ruler_events.0007.a: "La paix est douce, mais [ROOT.Char.GetFaith.HighGodName] a encore de grands projets pour moi."
 pam_theocratic_ruler_events.0007.b: "Diffuser l’Évangile d’une vie pieuse et ordonnée."
 pam_theocratic_ruler_events.0007.c: "Qu’on me laisse écouter en paix."
 pam_theocratic_ruler_events.0008.t: "Pierre après pierre"
 pam_theocratic_ruler_events.0008.desc: "Depuis que j’ai hérité de [stone_province.GetName], un château doté de [GetBuilding('curtain_walls_01').GetName|l], j’observe cet impressionnant ouvrage de pierre conçu pour un gouvernement plus laïc. Mais les fidèles ont-ils vraiment besoin de telles défenses ?\n\nMon domaine ne dispose pas d’un [GetDomicileBuilding('episcopal_palace_01').GetName|l] digne de mon nom, et pourtant, voici de la pierre taillée érigée par des mains laïques."
 pam_theocratic_ruler_events.0008.a: "La pierre qui reste de ces remparts rudimentaires me serait bien utile."
 pam_theocratic_ruler_events.0008.b: "Abattons les remparts et construisons mon [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip|l]."
 pam_theocratic_ruler_events.0008.c: "Chaque œuvre réalisée par la main de l’homme est une prière matérialisée."
 pam_theocratic_ruler_events.0008.c.flavor: "Vous avez le principe [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]"
 pam_theocratic_ruler_events.0008.d: "Ils pourraient avoir besoin des remparts."
 pam_theocratic_ruler_events.0009.t: "Essayer d’être le pasteur"
 pam_theocratic_ruler_events.0009.desc: "J’ai reçu de ma congrégation des témoignages empreints de larmes, m’informant que [heir.Custom('FR_le_Char_Pi')][heir.GetTitledFirstName] avait perdu son sang-froid lors de son dernier sermon et qu’ils étaient incapables de se conformer aux règles strictes qu’[heir.Custom('FR_IlElle')] leur impose.\n\nLorsque je l’interroge à ce sujet, [heir.Custom('FR_IlElle')] entre dans une rage folle.\n\n« Oh, ces vils pécheurs ! Je ne peux supporter leurs pitoyables tentatives de rédemption. »"
 pam_theocratic_ruler_events.0009.a: "« Le pasteur garde son sang-froid. Maîtrisez votre passion. »"
 pam_theocratic_ruler_events.0009.a.success: "Votre conseil fait son effet"
 pam_theocratic_ruler_events.0009.a.failure: "Vos paroles ne parviennent pas à [heir.Custom('FR_LeLa')] calmer"
 pam_theocratic_ruler_events.0009.a.toast.success: "Conseil utile"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Conseil inutile"
 pam_theocratic_ruler_events.0009.b: "Je secoue la tête par déception."
 pam_theocratic_ruler_events.0009.b.flavor: "[heir.Custom('FR_IlElle')|U] n’a pas ma bénédiction et est indigne de gouverner"
 pam_theocratic_ruler_events.0009.c: "« Répétez vos prières. Disciplinez votre chair. »"
 pam_theocratic_ruler_events.0010.t: "L’épée ou la crosse"
 pam_theocratic_ruler_events.0010.desc: "En tant que [Select_CString(ROOT.Char.IsFemale,'maîtresse','maître')] de mes terres, j’ai été contraint[ROOT.Char.Custom('FR_E')] de servir [ROOT.Char.GetFaith.HighGodName] par la lame aussi bien que par les bénédictions.\n\nJe me remémore quand [pilgrimage_memory.GetDescription|l] et quand [battle_memory.GetDescription|l]. Les cadavres s’entassent dans les champs ; mes fidèles savent que je ne recule pas devant la tâche qui m’incombe.\n\nEn réfléchissant à l’avenir du domaine, tant mon [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle|l], [ROOT.Char.GetCouncillor('councillor_marshal').Custom('FR_le_Char_Pi')][ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName], que mon [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle|l], [ROOT.Char.GetCouncillor('councillor_court_chaplain').Custom('FR_le_Char_Pi')][ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName], souhaitent que je place leur instrument au premier plan de notre action."
 pam_theocratic_ruler_events.0010.a: "Honorer l’épée."
 pam_theocratic_ruler_events.0010.b: "La crosse doit guider."
 pam_theocratic_ruler_events.0010.c: "Que l’épée et la crosse agissent de concert."
 pam_theocratic_ruler_events.0011.t: "Le repos du chevalier tombé au combat"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.Custom('FR_le_Char_Pi')|U][landed_subject.GetTitledFirstName] s’agenouille devant moi pour m’annoncer la nouvelle concernant son semblable, tombé au combat en défendant [ROOT.Char.GetFaith.HighGodName].\n\n« Il a tenu bon face à une multitude de païens, mais ses blessures étaient trop graves. Au moins, nous avons pu lui faire nos adieux. »\n\n« Je vous en prie, accordez-lui un lieu de repos sous le couloir de l’autel, avec son épée à ses côtés. Je vous en serai éternellement reconnaissant[landed_subject.Custom('FR_E')]. »"
 pam_theocratic_ruler_events.0011.a: "Payez pour la pierre et c’est ici qu’il reposera."
 pam_theocratic_ruler_events.0011.a.flavor: "Le chevalier reposera dans l’église."
 pam_theocratic_ruler_events.0011.b: "Nous pourrons utiliser la crypte si vous nous faites don de l’épée."
 pam_theocratic_ruler_events.0011.b.flavor: "Le chevalier reposera sans son épée."
 pam_theocratic_ruler_events.0011.c: "Les guerriers doivent se trouver à la belle étoile."
 pam_theocratic_ruler_events.0011.c.flavor: "Le chevalier sera enterré à l’extérieur des murs de l’église."
 pam_fallen_knight_crusader_sword_name: "Épée de croisé"
 pam_fallen_knight_crusader_sword_desc: "Une épée tenue par un chevalier mort en défendant la foi. Elle porte des entailles causées par des épées païennes et une petite croix gravée sur la poignée."
 pam_theocratic_ruler_events.0012.t: "Un bosquet autrefois sacré"
 pam_theocratic_ruler_events.0012.desc: "Mon cortège s’arrête là où la forêt s’épaissit autour du chemin. [grove_subject.Custom('FR_le_Char_Pi')|U][grove_subject.GetTitledFirstName], l’un des fidèles de [grove_county.GetNameNoTier], sort d’entre les arbres, les bras ouverts en signe de bienvenue.\n\n« Si vous souhaitez véritablement gagner la confiance des ouailles de ces terres, vous devez écouter et accepter ce que [ROOT.Char.GetFaith.HighGodName] a déjà semé ici. Construisez un temple près des bosquets ancestraux de [grove_province.GetName] et le peuple saura de qui vous êtes le pasteur. »"
 pam_theocratic_ruler_events.0012.a: "Que la nature guide ma foi."
 pam_theocratic_ruler_events.0012.b: "Montrez-moi ces bosquets."
 pam_theocratic_ruler_events.0012.b.success: "Vos hommes reviendront ensuite pour ramasser le bois d’œuvre"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.Custom('FR_le_Char_U_Pi')|U][grove_subject.GetShortUINameNoTooltip] décèle votre ruse"
 pam_theocratic_ruler_events.0012.b.toast.success: "On abat les vieux arbres pour en tirer profit"
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.Custom('FR_le_Char_U_Pi')|U][grove_subject.GetShortUINameNoTooltip] répand la nouvelle de votre profanation"
 pam_theocratic_ruler_events.0012.c: "Cette nature sauvage empeste le diable."
 pam_theocratic_ruler_events.0013.t: "Une inspiration angélique"
 pam_theocratic_ruler_events.0013.desc: "À la messe aujourd’hui, comme touchée par la grâce divine, une voix s’est élevée au-dessus de celle du chantre, pure et d’une beauté venue d’un autre monde.\n\nLes fidèles retiennent leur souffle lorsque [angelic_singer.Custom('FR_le_Char_Pi')][angelic_singer.GetTitledFirstName] chante, et, bien après que la dernière note s’est tue, je demeure encore à l’écouter."
 pam_theocratic_ruler_events.0013.a: "« Votre don appartient [ROOT.Char.GetFaith.HighGodName2]. Prononcez vos vœux. »"
 pam_theocratic_ruler_events.0013.a.success: "Vos paroles l’émeuvent et [angelic_singer.Custom('FR_LeLa')] poussent à la dévotion"
 pam_theocratic_ruler_events.0013.a.failure: "On ne parviendra pas à convaincre [angelic_singer.Custom('FR_le_Char_U_Pi')][angelic_singer.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.Custom('FR_le_Char_U_Pi')|U][angelic_singer.GetShortUINameNoTooltip] prononce ses vœux et rejoint votre Cour."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.Custom('FR_le_Char_U_Pi')|U][angelic_singer.GetShortUINameNoTooltip] refuse et part"
 pam_theocratic_ruler_events.0013.b: "Soyez mon invité[angelic_singer.Custom('FR_E')] ; j’aimerais entendre à nouveau cette voix."
 pam_theocratic_ruler_events.0013.c: "Que nos chantres chantent."
 pam_theocratic_ruler_events.0014.t: "La supplique d’[Select_CString(convert_peasant.IsFemale,'une convertie','un converti')]"
 pam_theocratic_ruler_events.0014.desc: "À l’issue de mon sermon, [convert_peasant.Custom('FR_le_Char_Pi')][convert_peasant.GetTitledFirstName], [Select_CString(convert_peasant.IsFemale,'une convertie','un converti')] des anciennes traditions [neighbour_faith.GetAdjectiveNoTooltip]s d’origine [convert_peasant.GetCulture.GetNameNoTooltip], fend la foule pour venir à moi.\n\n« Les anciennes voies ont encore beaucoup à nous enseigner. Je sais que, si vous daigniez les considérer avec bienveillance, notre peuple verrait en cela la preuve que vous respectez nos traditions. Les miens se rangeraient à vos côtés et soutiendraient toutes vos entreprises. »\n\n[convert_peasant.Custom('FR_IlElle')|U] attend ma bénédiction ; je ne lui offre en réponse qu’un signe de tête silencieux."
 pam_theocratic_ruler_events.0014.a: "Que cette vermine disparaisse de ma vue."
 pam_theocratic_ruler_events.0014.a.flavor: "Vous avez le [trait|El] [GetTrait('arrogant').GetName( GetNullCharacter )]"
 pam_theocratic_ruler_events.0014.a.acceptance: "Demande de conversion rejetée"
 pam_theocratic_ruler_events.0014.b: "Adopter personnellement le principe [offered_tenet_a.GetBaseNameNoTooltip]."
 pam_theocratic_ruler_events.0014.b.tt: "Votre prochaine contribution visant à #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals|l$#! au [great_project|El] de [GetGreatProjectType('pam_mass_rite_conversion').GetName|Vl] est gratuite."
 pam_theocratic_ruler_events.0014.c: "Adopter personnellement le principe [offered_tenet_b.GetBaseNameNoTooltip]"
 pam_theocratic_ruler_events.0014.c.tt: "Votre prochaine contribution visant à #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals|l$#! au [great_project|El] de [GetGreatProjectType('pam_mass_rite_conversion').GetName|Vl] est gratuite."
 pam_theocratic_ruler_events.0014.d: "Est-ce que ce sont les moutons qui guident le berger ?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "La supplique d’un converti"
 pam_theocratic_ruler_events.0015.t: "Accompagner les successeurs"
 pam_theocratic_ruler_events.0015.desc: "Après moi, le siège devra trouver un berger capable de guider les âmes par la prière comme les hommes par le jugement. [succession_heir_first.Custom('FR_le_Char_Pi')|U][succession_heir_first.GetTitledFirstName], [Select_CString(succession_heir_first.IsFemale,'première','premier')] dans l’ordre de succession, et [succession_heir_second.Custom('FR_le_Char_Pi')][succession_heir_second.GetTitledFirstName], qui [succession_heir_first.Custom('FR_LeLa')] suit de près, ont été appelés à me réciter les Écritures en privé.\n\nL’un d’eux portera un jour mon fardeau, et je ne saurais aujourd’hui les former tous deux de la même façon.\n\n« Mes enfants dans la foi, ne me montrez pas seulement ce que votre mémoire a retenu, mais ce que votre cœur a fait sien. »"
 pam_theocratic_ruler_events.0015.a: "Guider [succession_heir_first.GetFirstNameNoTooltip] dans les Écritures."
 pam_theocratic_ruler_events.0015.b: "Guider [succession_heir_second.GetFirstNameNoTooltip] dans les Écritures."
 pam_theocratic_ruler_events.0015.c: "Je suis le berger ; c’est moi qui vais réciter."
 pam_theocratic_ruler_events.0015.c.success: "Vos connaissances surpassent leurs récitations."
 pam_theocratic_ruler_events.0015.c.failure: "Vous butez sur un paragraphe qu’ils connaissent par cœur."
 pam_theocratic_ruler_events.0015.c.toast.success: "Votre maîtrise de la doctrine les impressionne."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Vos subordonnés échangent des regards face à votre erreur."
