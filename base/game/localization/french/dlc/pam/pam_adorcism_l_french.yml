l_french:
 pam_curse_enemy_decision: "Maudire un ennemi"
 pam_curse_enemy_decision_desc: "#F Qui est cet imbécile qui s’oppose à moi ? Je le nommerai devant les esprits et ferai pleuvoir sur lui toutes les offenses, les insultes et les malédictions. Il peut rire autant qu’il veut : son heure viendra bientôt.#!"
 pam_curse_enemy_decision_tooltip: "Accomplissez un rituel contre un rival ou un adversaire dans l’une de vos [wars|El]"
 pam_curse_enemy_decision_confirm: "Commencer le rite"
 pam_curse_enemy_decision_valid_target: "Vous avez un [rival|El], [nemesis|El] ou ennemi de guerre adulte et en vie"
 pam_curse_enemy_decision_selected_target_valid: "Votre ennemi sélectionné est encore un [rival|El], [nemesis|El] ou ennemi de guerre adulte et en vie"
 pam_curse_enemy_decision_no_item_selected: "Aucun ennemi choisi"
 pam_seek_war_aid_decision: "Demander du soutien pour la guerre"
 pam_seek_war_aid_decision_desc: "#F La guerre ne met pas seulement à l’épreuve les armes et les hommes. Je vais demander aux esprits de m’accorder la clairvoyance, la force et l’endurance nécessaires pour mener à bien ma cause à travers les épreuves à venir.#!"
 pam_seek_war_aid_decision_tooltip: "Demandez aux esprits de vous apporter leur soutien dans vos guerres actuelles"
 pam_seek_war_aid_decision_confirm: "Invoquer les esprits"
 pam_adorcism_events.0001.t: "Un nom livré aux esprits"
 pam_adorcism_events.0001.desc: "Dans un endroit isolé, je grave le nom [pam_adorcism_curse_target.Custom('FR_du_Char_Pi')][pam_adorcism_curse_target.GetTitledFirstName] dans la terre tout en exprimant à haute voix toute ma rancœur. Ce rituel ne peut ni briser les os ni faire dépérir les récoltes, mais ce n’est pas non plus son but.\n\nLorsque je me relève, ma colère s’est transformée en détermination. Chaque rumeur [pam_adorcism_curse_target.Custom('FR_LeLa')] concernant m’apparaît désormais comme un fil qui n’attend que d’être tiré."
 pam_adorcism_events.0001.a: "Mon but est clair."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], j’ai prononcé votre nom devant les esprits et vous ai jeté un sort. Si le malheur s’abat sur vous, sachez-le : c’est ma volonté qui en est à l’origine."
 pam_adorcism_events.0002.desc.default: "\n\nJ’ai prononcé votre nom devant les esprits et j’ai jeté un sort sur vous. Si le malheur s’abat sur vous, sachez-le : c’est ma volonté qui en est à l’origine."
 pam_adorcism_events.0002.a: "Vite, faites venir un [ROOT.Char.GetFaith.PriestNeuter] !"
 pam_adorcism_events.0002.a.flavor: "La malédiction vous tourmente et vous fait voir un présage dans chaque ombre."
 pam_adorcism_events.0101.t: "Conseil venu de l’ombre"
 pam_adorcism_events.0101.desc: "Au-delà de la lueur du dernier feu de camp, je verse une offrande et tends l’oreille tandis que les bruits de l’armée s’estompent derrière moi. Le vent soulève la poussière, mais je n’entends aucune voix distincte. Ce rituel apaise néanmoins mes pensées.\n\nJe dois décider de l’aide dont je vais avoir besoin pour la campagne qui s’annonce."
 pam_adorcism_events.0101.a: "Montrez-moi le chemin vers la victoire."
 pam_adorcism_events.0101.b: "Donnez de la force à mon bras qui manie l’épée."
 pam_adorcism_events.0101.c: "Donnez de l’endurance à mon armée."
 pam_adorcism_curse_focus_modifier: "Colère redirigée"
 pam_adorcism_curse_focus_modifier_desc: "Ce personnage a désigné l’objet de sa colère et l’a canalisée vers l’extérieur à l’aide d’un rituel."
 pam_adorcism_ill_omen_modifier: "Marqué par un mauvais présage"
 pam_adorcism_ill_omen_modifier_desc: "Des rumeurs concernant une malédiction ont conduit les membres du rite de ce personnage à le considérer avec méfiance."
 pam_adorcism_curse_anxiety_modifier: "Peur de la malédiction"
 pam_adorcism_curse_anxiety_modifier_desc: "Ce personnage ne peut se défaire de l’idée que chaque malheur qui lui arrive a été invoqué contre lui."
 pam_adorcism_battle_guidance_modifier: "Stratégie guidée par des esprits"
 pam_adorcism_battle_guidance_modifier_desc: "Ce personnage est convaincu que les esprits lui ont révélé des signes favorables pour la bataille à venir."
 pam_adorcism_personal_vigor_modifier: "Force venue des esprits"
 pam_adorcism_personal_vigor_modifier_desc: "La confiance rituelle confère à ce personnage une grande force au combat singulier."
 pam_adorcism_campaign_endurance_modifier: "Armée soutenue par les esprits"
 pam_adorcism_campaign_endurance_modifier_desc: "Les armées de ce personnage mènent de longues campagnes avec une conviction inébranlable."
