l_french:
 pam_clergy_events.0001.t: "Par quel nom souhaitez-vous être appelé ?"
 pam_clergy_events.0001.desc: "Mon [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] se tourne vers la ligne vide suivante du registre des successeurs de saint Pierre, témoignage vivant de la [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )|l].\n\n« #emp Le nom que vous choisirez survivra à votre règne pendant plus de mille générations.#! »\n\nSa plume marque l’endroit où l’encre doit être appliquée.\n\n« #emp Par quel nom souhaitez-vous être appelé ?#! »"
 pam_clergy_events.0001.a: "Que cela reste gravé pour l’éternité."
 pam_clergy_events.0003.t: "Une refonte du principe"
 pam_clergy_events.0003.desc: "Un principe fondamental du rite [pam_recast_rite.GetAdherentNameNoTooltip] a été modifié sous [pam_recast_pope.Custom('FR_le_Char_Pi')][pam_recast_pope.GetTitledFirstName] : [tenet_to_remove.GetBaseName] a été remplacé par [tenet_to_add.GetBaseName]."
 pam_clergy_events.0010.t: "La volonté de m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('actor'))]"
 pam_clergy_events.0010.desc.intro: "En tant que [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l], je suis le prolongement de la volonté [Select_CString(actor.IsFemale,'de la Sainte-Mère','du Saint-Père')].\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('actor'))], que j’estime plus que quiconque, me guide dans l’accomplissement de mes devoirs de [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l].\n\n"
 pam_clergy_events.0010.desc: "Dans son infinie sagesse, [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName] dit ce qu’[actor.Custom('FR_IlElle')] juge nécessaire, et c’est ainsi que je poursuis"
 pam_clergy_events.0010.desc.develop: "le développement des travaux publics au profit de tous les [recipient.GetFaith.GetAdherentNamePlural] de [archdiocese.GetName]."
 pam_clergy_events.0010.desc.convert_faith: "une mission visant à favoriser la conversion des [ROOT.Char.Custom('GetUnbelieverNamePlural')] dans la région de [archdiocese.GetName]."
 pam_clergy_events.0010.desc.increase_control: "une mission visant à rétablir la paix parmi la population de [archdiocese.GetName]."
 pam_clergy_events.0010.desc.cultural_fascination: "une mission visant à accélérer la recherche sur les nouvelles technologies pour les [actor.GetCulture.GetCollectiveNoun]."
 pam_clergy_events.0010.desc.epidemic_resistance: "la répartition des ressources de l’Église afin de contribuer à endiguer l’épidémie en [archdiocese.GetName]."
 pam_clergy_events.0010.desc.improve_legitimacy: "une mission visant à promouvoir la légitimité des monarques [recipient.GetFaith.GetAdherentNamePlural] en [archdiocese.GetName]."
 pam_clergy_events.0010.desc.undermine_legitimacy: "une mission visant à saper la légitimité des monarques [recipient.GetFaith.GetAdherentNamePlural] en [archdiocese.GetName]."
 pam_clergy_events.0010.a: "« Je m’en occupe, [actor.Custom('FormOfAddressForLiege')] ! »"
 pam_clergy_events.0010.b: "La dîme pourrait être mieux dépensée..."
 pam_clergy_events.0030.t: "Habemus papam"
 pam_clergy_events.0030.t.female: "Habemus mamam"
 pam_clergy_events.0030.desc: "Un panache de fumée blanche au cœur de [new_pope.GetCurrentLocation.GetName] annonce [new_pope.Custom('FR_LeLa')] désormais [new_pope.GetTitledFirstName] :\n\n« Que les saints Apôtres Pierre et Paul, en la puissance et l’autorité desquels nous mettons notre confiance, intercèdent pour nous auprès du Seigneur. Et que la bénédiction de Dieu tout-puissant, le Père, le Fils et le Saint-Esprit, descende sur vous et demeure avec vous pour toujours. »\n\n« Amen. »"
 pam_clergy_events.0030.a: "Gloire au trône de saint Pierre !"
 pam_clergy_events.0030.b: "Il semblerait qu’un faux prophète soit apparu."
 pam_clergy_events.0030.b.tt: "La [decision|El] [GetDecisionWithKey('declare_antipope_decision').GetName] est moins chère pendant #V 15 ans#!"
 pam_clergy_events.0030.aa: "Qui se soucie des affaires de l’Église ?"
 pam_clergy_events.0030.aa.tt: "Les prochains événements d’Habemus papam s’afficheront alors simplement sous forme de messages"
 pam_clergy_events.0030.feed: "[new_pope.Custom('FR_le_Char_Pi')|U][new_pope.GetTitledFirstName] a été élu [head_of_faith|El]."
 pam_clergy_events.0040.opening: "[head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)|U],"
 pam_clergy_events.0040.desc: "Puisque les rangs du Sacré Collège se dégarnissent, j’ai jugé bon de vous élever au rang de cardinal. Puissent votre piété et votre sagesse renforcer l’Église en ces temps difficiles."
 pam_clergy_events.0040.appoint_tt: "Vous êtes nommé [cardinal|El]"
 pam_clergy_events.0040.a: "J’accepte ce fardeau sacré."
 pam_clergy_events.0041.opening: "Au siège de saint Pierre,"
 pam_clergy_events.0041.desc: "Le Collège des cardinaux est incomplet, et vous n’avez pas encore occupé les sièges laissés vacants par nos [Select_CString(ROOT.Char.IsFemale,'femmes les plus pieuses','hommes les plus pieux')].\n\nJe ne laisserai pas l’Église sans défense ! Je porterai moi-même la calotte rouge."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.Custom('FR_le_Char_U_Pi')|U][cardinal_candidate.GetShortUIName|U] s’autoproclame [cardinal|El]"
 pam_clergy_events.0041.a: "Cette insolence ne sera pas oubliée."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "Les sièges du Collège demeuraient vacants, et l’Église ne pouvait se permettre d’attendre les formalités. Plusieurs de nos hommes les plus pieux ont reçu ensemble le chapeau rouge, et le Collège est de nouveau au complet.\n\nNous espérons que vous nous pardonnerez notre hâte."
 pam_clergy_events.0042.a: "Un Collège au complet m’est plus utile qu’un Collège vide."
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "Un bouleversement dans la foi"
 pam_clergy_events.0051.desc: "Ma position en [county.GetNameNoTier] vacille. Ceux à qui j’ai consacré ma vie prient désormais en [new_faith.GetAdherentNamePlural].\n\nDois-je me convertir et conserver mon pouvoir ? Je pourrais continuer à prendre soin des gens de [title.GetName], mais puis-je réellement venir en aide à ceux qui ne sont plus [old_faith.GetAdherentNamePlural] ? Peut-il sortir quoi que ce soit de bon du fait que nous soyons tous contraints de pratiquer la foi [new_faith.GetAdjectiveNoTooltip] ?!"
 pam_clergy_events.0051.a: "Tout ce qu’il faudra pour servir mon troupeau."
 pam_clergy_events.0051.a.keep_see_tt: "Vous conservez le pouvoir sur [title.GetName]"
 pam_clergy_events.0051.b: "Les [old_faith.GetAdherentNamePluralNoTooltip] sont les seuls que je puisse servir."
 pam_clergy_events.0051.b.tt: "Tous vos [titles|El] [Concept('landed', 'terriens')|E] sont détruits"
 pam_clergy_events.0051.c: "J’accepte la fin de ma charge."
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Vous établirez un [camp|El] d’[adventurer|El]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER [game_over|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "La fin de [title.GetNameNoTooltip]"
 pam_clergy_events.0052.desc: "Quelle qu’en soit la raison, je ne peux plus légitimement être le pasteur de [title.GetName]. Ce que l’Église m’avait autrefois confié m’échappe désormais."
 pam_clergy_events.0052.a: "Ainsi soit-il."
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "Un [new_prelate.GetDynasty.GetNameNoTooltip] sur le trône de Saint-Pierre"
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetFaith.ReligiousHeadName] [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.antipope: "Un[new_prelate.Custom('FR_E')] [new_prelate.GetDynasty.GetNameNoTooltip] revendique [new_prelate.GetFaith.ReligiousHeadTitleName|l]"
 pam_clergy_events.0060.t.archbishop: "Un[new_prelate.Custom('FR_E')] [new_prelate.GetDynasty.GetNameNoTooltip] prend la crosse épiscopale"
 pam_clergy_events.0060.desc.intro: "Nous nous sommes efforcés de guider la chrétienté, que ce soit depuis le trône ou depuis la chaire. Il semble désormais que [new_prelate.GetFaith.HighGodName] juge opportun de mener la dynastie [new_prelate.GetDynasty.GetName] vers de nouveaux sommets.\n\n"
 pam_clergy_events.0060.desc.pope: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] a été élevé[new_prelate.Custom('FR_E')] au trône de Saint-Pierre, en tant que représentant[new_prelate.Custom('FR_E')] [new_prelate.GetFaith.HighGodNamePossessive] sur terre."
 pam_clergy_events.0060.desc.head_of_faith: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] détient [prelate_title.GetName]."
 pam_clergy_events.0060.desc.hof_outro: "Les rois et les empereurs ne sont que des enfants, soumis à la volonté de leur [Select_CString(new_prelate.IsFemale,'Sainte-Mère','Saint-Père')]. De nombreux [new_prelate.GetFaith.BishopMalePlural] sont désormais sous les ordres d’un membre de la Maison [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] a été proclamé[new_prelate.Custom('FR_E')] [new_prelate.GetFaith.ReligiousHeadName|l], alors que cette fonction est déjà occupée. Chaque [new_prelate.GetFaith.GetAdherentName] doit désormais choisir qui est le représentant [new_prelate.GetFaith.HighGodNamePossessive]. Tant que cette question ne sera pas réglée, nos âmes seront en danger."
 pam_clergy_events.0060.desc.archbishop: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] a été investi[new_prelate.Custom('FR_E')] de [prelate_title.GetName]. La dîme, les abbayes et la consécration de chaque [new_prelate.GetFaith.BishopNeuter] sous ses ordres sont désormais guidés par un membre de la Maison [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\nSa foi [new_prelate.GetFaith.GetAdjectiveNoTooltip] n’est pas la mienne, mais nous formons néanmoins une famille."
 pam_clergy_events.0060.a: "Une bénédiction tant pour l’Église que pour la Maison [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.a.antipope: "Je ne veux pas hériter de ce conflit."
 pam_clergy_events.0060.b: "J’aimerais bien examiner [prelate_title.GetNameNoTooltip] de plus près."
 pam_clergy_events.0060.b.antipope: "Je suis [Select_CString(ROOT.Char.IsFemale,'la seule','le seul')] à pouvoir résoudre cette crise."
 pam_clergy_events.0060.b.tt: "@warning_icon! Vous abandonnerez votre personnage actuel et ne pourrez plus jouer avec celui-ci par la suite.\n\n#TUT Lorsque [new_prelate.Custom('FR_le_Char_U_Pi')][new_prelate.GetShortUINameNoTooltip] mourra, vous incarnerez votre [player_heir|El], qui héritera de cette fonction [ecclesiastical|El] par [appointment|El] ou par élection, et non par succession [Concept('dynasty', 'dynastique')|E].#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.Custom('FR_le_Char_Pi')|U][new_prelate.GetTitledFirstName] ne partage pas votre foi. Vous continueriez en tant que [new_prelate.GetFaith.GetAdherentName]."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.Custom('FR_le_Char_Pi')|U][new_prelate.GetTitledFirstName] conserve son poste plus par défi que par élection. Quiconque rejette cette revendication s’en emparera."
