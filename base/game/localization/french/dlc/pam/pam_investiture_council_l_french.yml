l_french:
 # Activity: The Investiture Council
 activity_investiture_council: "Le Concile d’investiture"
 activity_investiture_council_desc: "Un concile a été convoqué à l’issue de la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] afin de décider une fois pour toutes à qui revient l’investiture du clergé : à l’Église ou à la Couronne."
 activity_investiture_council_province_desc: "Organisez le Concile d’investiture ici."
 activity_investiture_council_host_desc: "Convoquez le Concile d’investiture afin de régler la question de la nomination du clergé."
 activity_investiture_council_guest_desc: "Participez au Concile d’investiture et faites entendre votre voix concernant la nomination du clergé."
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council: "Voyage de [Character.GetFirstNameNoTooltip] jusqu’au Concile d’investiture"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value: "Convoqué au Concile d’investiture"
 pam_investiture_council_start_log_title: "Le Concile d’investiture se réunit"
 pam_investiture_council_start_log: "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a ouvert le concile afin de régler la question de la nomination du clergé."
 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title: "L’Église l’emporte"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a annoncé la décision du concile : les membres du clergé sont investis par l’Église, et aucune couronne ne peut les destituer."
 pam_investiture_council_concluded_temporal_log_title: "La Couronne l’emporte"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a annoncé la décision du concile : l’Église nomme le clergé, mais un seigneur laïc peut néanmoins destituer un prélat qui ne lui donne pas satisfaction."
 pam_investiture_council_conclusion.intro: "Le Concile d’investiture est parvenu à une décision."
 pam_investiture_council_conclusion.spiritual: "Les pères réunis réaffirment le droit exclusif de l’Église de nommer le clergé et l’ont placé hors de la portée de toute couronne : une fois consacré, un prélat occupe sa charge à vie.\n\nLa longue [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée ; l’Église en sort victorieuse et se consacre aussitôt à sa réforme interne."
 pam_investiture_council_conclusion.temporal: "Les pères réunis ont laissé à l’Église le soin de nommer le clergé, mais ont réservé aux seigneurs laïcs le droit de destituer tout prélat qui ne leur donne pas satisfaction. La longue [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée, mais l’autorité de l’Église s’en est trouvée affaiblie et son unité reste fragile."
 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived: "Prélat\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "Conservateur\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "Innovateur\n[Character.GetShortUINameNoTooltip|U]"
 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt: "A remplacé la [doctrine|El] de nomination cléricale [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l] par [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName|l]"
 pam_investiture_resolution_temporal_tt: "A remplacé la [doctrine|El] de nomination cléricale [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l] par [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName|l]"
 # Activity phase names + descriptions
 investiture_council_phase_summons: "Rassemblement"
 investiture_council_phase_summons_desc: "Les fidèles se rassemblent alors que se répand la nouvelle d’un conflit imminent concernant la nomination du clergé."
 investiture_council_phase_debate: "Le débat"
 investiture_council_phase_debate_desc: "Le concile débat pour savoir qui doit nommer le clergé, l’Église ou la Couronne, et soumet la question au vote."
 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t: "Arrivée"
 pam_investiture_council_events.0001.desc: "[arrival_host.Custom('FR_le_Char_Pi')|U][arrival_host.GetTitledFirstName] m’accueille chaleureusement sur le seuil de la porte à mon arrivée, tandis que le hall derrière [arrival_host.Custom('FR_LuiElle')] fourmille déjà de prélats. Bientôt, la grande question de la nomination du clergé sera posée à l’assemblée."
 pam_investiture_council_events.0001.a: "C’est un honneur pour moi de faire partie de ce groupe."
 pam_investiture_council_events.0001.a.tt: "Le débat commencera dès que les autres invités seront arrivés."
 # The council convenes (host)
 pam_investiture_council_events.0002.t: "Un tournant pour l’Église"
 pam_investiture_council_events.0002.desc: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est désormais terminée. Il appartient maintenant aux fidèles réunis de décider comment le clergé sera nommé à l’avenir, et j’ai l’intention de veiller à ce que l’autorité de l’Église soit préservée."
 pam_investiture_council_events.0002.a: "Il en sera donc ainsi."
 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t: "Le débat commence"
 pam_investiture_council_events.0003.desc: "L’assemblée se tait lorsque le concile aborde la question qui oppose l’Église et la Couronne : à qui revient-il de nommer le clergé ? Chaque voix présente ici contribuera à la décision."
 pam_investiture_council_events.0003.a: "Le moment est venu."
 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t: "Un mot à la bonne oreille"
 pam_investiture_council_events.0032.desc: "Le vote n’est pas encore acquis. Un mot bien placé pourrait convaincre les indécis du camp adverse de se rallier à ma cause, mais une approche maladroite pourrait avoir de lourdes conséquences."
 pam_investiture_council_events.0032.a: "Rallier l’assemblée à ma cause"
 pam_investiture_council_events.0032.b: "Ne pas intervenir"
 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t: "Le poids d’une couronne"
 pam_investiture_council_events.0033.desc: "Je n’ai pas voix au chapitre au sein de cette assemblée d’hommes d’Église, mais un seigneur séculier n’est pas sans moyens d’action. Une bourse bien garnie sait faire taire bien des scrupules, et un plaidoyer habile peut faire pencher les indécis. Je peux soutenir la cause de l’Église ou celle de la Couronne, ou choisir de garder le silence."
 pam_investiture_council_events.0033.a: "Essayer d’acheter un vote pour l’Église"
 pam_investiture_council_events.0033.b: "Essayer de convaincre de voter pour l’Église"
 pam_investiture_council_events.0033.c: "Essayer d’acheter un vote pour le temporel"
 pam_investiture_council_events.0033.d: "Essayer de convaincre de voter pour le temporel"
 pam_investiture_council_events.0033.e: "Je préfère ne pas m’en mêler."
 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title: "La réponse de l’assemblée"
 pam_investiture_persuade_toast_swayed_tt: "Vous influencez #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! électeurs."
 pam_investiture_persuade_toast_backfired_tt: "Votre bévue a poussé #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! électeurs dans l’autre camp."
 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt: "Il y a des électeurs qui ne sont pas encore du côté de l’Église, mais qui peuvent être ralliés à votre cause"
 pam_investiture_persuade_target_temporal_tt: "Il y a des électeurs qui ne sont pas encore du côté de la Couronne, mais qui peuvent être ralliés à votre cause"
 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator: "Cela fait basculer jusqu’à #P 10#! électeurs en faveur de l’Église."
 pam_investiture_persuade_tt_great_conservative: "Cela fait basculer jusqu’à #P 10#! électeurs en faveur de la Couronne."
 pam_investiture_persuade_tt_good_innovator: "Cela fait basculer jusqu’à #P 5#! électeurs en faveur de l’Église."
 pam_investiture_persuade_tt_good_conservative: "Cela fait basculer jusqu’à #P 5#! électeurs en faveur de la Couronne."
 pam_investiture_persuade_tt_modest_innovator: "Cela fait basculer jusqu’à #P 3#! électeurs en faveur de l’Église."
 pam_investiture_persuade_tt_modest_conservative: "Cela fait basculer jusqu’à #P 3#! électeurs en faveur de la Couronne."
 pam_investiture_persuade_tt_backfire_innovator: "Une bévue pousse #N 5#! électeurs en faveur de l’Église."
 pam_investiture_persuade_tt_backfire_conservative: "Une bévue pousse #N 5#! électeurs en faveur de la Couronne."
 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t: "Le Concile vous convoque"
 pam_investiture_council_events.0004.desc: "J’ai appris que le Concile d’investiture se réunissait pour statuer sur la nomination du clergé, mais je suis encore très loin de l’endroit où je devrais me trouver. Je pourrais tout laisser tomber et partir au galop pour aller voter, ou bien laisser les autres décider sans moi."
 pam_investiture_council_events.0004.a: "Tout laisser tomber et partir au concile."
 pam_investiture_council_events.0004.b: "Qu’ils décident sans moi."
 pam_investiture_council_haste_modifier: "Se précipite au concile"
 pam_investiture_council_haste_modifier_desc: "Ce [ruler|El] a tout laissé de côté pour se rendre au concile d’investiture avant que celui-ci ne se prononce sur la nomination du [clergy|El]."
 # The debate opens (host)
 pam_investiture_council_events.0010.t: "Le droit de l’Église"
 pam_investiture_council_events.0010.desc: "Je soumets la question au concile : le droit de nommer le clergé appartient à l’Église, et aucune couronne ne saurait défaire ce qu’elle a consacré. Que l’assemblée s’exprime et que ses voix tranchent."
 pam_investiture_council_events.0010.a: "Défendre l’autorité de l’Église"
 # The debate: guest picks a side
 pam_investiture_council_events.0031.t: "Quelle position prendre ?"
 pam_investiture_council_events.0031.desc: "Le chef de la foi revendique le droit exclusif de l’Église de nommer le clergé, sans que les couronnes puissent s’y opposer. Les seigneurs laïcs se réserveraient quant à eux le droit de destituer un prélat qui ne leur donnerait pas satisfaction. Le concile attend votre vote."
 pam_investiture_council_events.0031.a: "Soutenir l’Église : nomination à vie par l’Église."
 pam_investiture_council_events.0031.b: "Défendre les couronnes : nomination par l’Église, mais révocable par les seigneurs."
 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening: "Très-Saint Père,"
 pam_investiture_council_events.0060.desc.spiritual: "Le concile est terminé et, comme vous n’étiez pas parmi nous, j’ai immédiatement consigné le résultat sur parchemin. Les Pères réunis ont affirmé que l’Église est seule habilitée à ordonner le clergé et ont placé ce pouvoir hors de la portée de toute couronne : ceux qu’elle consacre exercent leur fonction à vie. La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée."
 pam_investiture_council_events.0060.desc.temporal: "Le concile est terminé et, comme vous n’étiez pas parmi nous, j’ai immédiatement consigné le résultat sur parchemin. J’ai le regret de vous annoncer que les Pères réunis, bien qu’ils nous aient laissé le pouvoir de procéder aux nominations, ont autorisé les seigneurs laïcs à destituer tout prélat qui ne leur donne pas satisfaction. La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée."
 pam_investiture_council_events.0060.a: "Lire le décret."
 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening: "Monseigneur,"
 pam_investiture_council_events.0061.desc.spiritual: "Votre chapelle a eu vent du grand concile. Les Pères réunis ont confirmé que l’Église seule a le droit d’investir les membres du clergé, et il n’est plus en votre pouvoir de les destituer. La longue [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée et la crosse épiscopale a conservé ce que la couronne convoitait."
 pam_investiture_council_events.0061.desc.temporal: "Votre chapelle a eu vent du grand concile. Les Pères réunis ont confié à l’Église le pouvoir de nommer les membres du clergé, mais vous conservez le pouvoir de destituer tout prélat qui ne vous donnerait pas satisfaction. La longue [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] est terminée et la couronne a pris le dessus sur la crosse épiscopale."
 pam_investiture_council_events.0061.a: "Qu’il en soit ainsi."
 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t: "Un concile se réunit"
 pam_investiture_council_events.0050.desc.named: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] touche à sa fin et un concile se prononcera sur la nomination du clergé.\n\n[investiture_nominee_host.Custom('FR_le_Char_Pi')|U][investiture_nominee_host.GetTitledFirstName] se charge de l’organiser. En tant que chef spirituel, vous êtes censé[ROOT.Char.Custom('FR_E')] y participer et faire connaître votre opinion sur cette décision ; bien entendu, vous serez également informé[ROOT.Char.Custom('FR_E')] du résultat si vous ne participez pas."
 pam_investiture_council_events.0050.desc: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] touche à sa fin et un concile doit trancher la question de la nomination du clergé. Comme vous ne l’organisez pas vous-même, un archevêque expérimenté se chargera de cette tâche à votre place. Vous pouvez toutefois, bien sûr, y participer et faire connaître votre opinion."
 pam_investiture_council_events.0050.a: "Très bien."
 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip|l] prend fin"
 pam_investiture_crisis_lapsed_tt: "Aucun concile n’ayant été convoqué, la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] s’est achevée en faveur de l’Église : désormais, le clergé est nommé à vie par l’Église."
