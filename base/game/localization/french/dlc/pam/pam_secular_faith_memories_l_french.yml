 # Character memories raised by the secular-faith flavor events.
 # Owner = the ruler who remembers; participant role names match the type definitions.
 pam_sf_kings_touch_healing_memory: "guéri des malades par un simple toucher"
 pam_sf_kings_touch_healing_memory_desc: "j’ai posé mes mains sur [healed_subject.Custom('FR_le_Char_Pi')][healed_subject.GetTitledFirstName], qui était gravement malade, et [healed_subject.Custom('FR_IlElle')] s’est rétabli[healed_subject.Custom('FR_E')]."
 pam_sf_kings_touch_healing_memory_desc_second_perspective: "vous avez posé vos mains sur [healed_subject.Custom('FR_le_Char_Pi')][healed_subject.GetTitledFirstName], qui était gravement malade, et [healed_subject.Custom('FR_IlElle')] s’est rétabli[healed_subject.Custom('FR_E')]."
 pam_sf_kings_touch_healing_memory_desc_third_perspective: "[owner.Custom('FR_le_Char_Pi')][owner.GetTitledFirstName] posé ses mains sur [healed_subject.Custom('FR_le_Char_Pi')][healed_subject.GetTitledFirstName], qui était gravement malade, et [healed_subject.Custom('FR_IlElle')] s’est rétabli[healed_subject.Custom('FR_E')]."
 pam_sf_deliverance_memory: "a pratiqué l’exorcisme"
 pam_sf_deliverance_memory_desc: "un esprit violent s’est emparé [delivered_soul.Custom('FR_du_Char_Pi')][delivered_soul.GetTitledFirstName] et j’ai procédé à un exorcisme."
 pam_sf_deliverance_memory_desc_second_perspective: "un esprit violent s’est emparé [delivered_soul.Custom('FR_du_Char_Pi')][delivered_soul.GetTitledFirstName] et vous avez procédé à un exorcisme."
 pam_sf_deliverance_memory_desc_third_perspective: "un esprit violent s’est emparé [delivered_soul.Custom('FR_du_Char_Pi')][delivered_soul.GetTitledFirstName] et [owner.Custom('FR_le_Char_Pi')][owner.GetTitledFirstName] procédé à un exorcisme."
 pam_sf_prophecy_fulfilled_memory: "a vu une prophétie se réaliser"
 pam_sf_prophecy_fulfilled_memory_desc: "[prophet.Custom('FR_le_Char_Pi')][prophet.GetTitledFirstName] m’a prévenu[owner.Custom('FR_E')] que [doomed.Custom('FR_le_Char_Pi')][doomed.GetTitledFirstName] allait mourir, et c’est ce qui s’est passé."
 pam_sf_prophecy_fulfilled_memory_desc_second_perspective: "[prophet.Custom('FR_le_Char_Pi')][prophet.GetTitledFirstName] vous a prévenu[owner.Custom('FR_E')] que [doomed.Custom('FR_le_Char_Pi')][doomed.GetTitledFirstName] allait mourir, et c’est ce qui s’est passé."
 pam_sf_prophecy_fulfilled_memory_desc_third_perspective: "[prophet.Custom('FR_le_Char_Pi')][prophet.GetTitledFirstName] a prévenu [owner.Custom('FR_le_Char_Pi')][owner.GetTitledFirstName] que [doomed.Custom('FR_le_Char_Pi')][doomed.GetTitledFirstName] allait mourir, et c’est ce qui s’est passé."
