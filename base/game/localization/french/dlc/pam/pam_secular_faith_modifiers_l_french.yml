l_french:
 pam_sf_devotion_modifier: "Dévotion à la prospérité"
 pam_sf_devotion_modifier_desc: "Ce personnage a fait en privé vœu de dévotion, ce qui a été récompensé discrètement par piété et richesses."
 pam_sf_grace_modifier: "Grâce reçue"
 pam_sf_grace_modifier_desc: "Ce personnage a reçu une grâce, rendu grâce en secret ou prononcé un vœu secret qui élève son âme."
 pam_sf_consolation_modifier: "En paix"
 pam_sf_consolation_modifier_desc: "Ce personnage est en paix."
 pam_sf_visionary_renown_modifier: "Vision proclamée"
 pam_sf_visionary_renown_modifier_desc: "Ce personnage a proclamé à la Cour une vision divine, rehaussant ainsi sa réputation."
 pam_sf_consecrated_arms_modifier: "Armes consacrées"
 pam_sf_consecrated_arms_modifier_desc: "Les armoiries de la Maison de ce personnage ont été bénies lors d’une fête religieuse."
 pam_sf_serenity_modifier: "Éloge des rites publics"
 pam_sf_serenity_modifier_desc: "La dévotion publique de ce personnage lui a valu les faveurs du clergé et de la Cour."
 pam_sf_humiliated_modifier: "Vœux humiliants"
 pam_sf_humiliated_modifier_desc: "Ce personnage a été contraint de prononcer ses vœux et de se retirer dans un cloître."
 pam_sf_promised_acclaim_modifier: "La promesse d’un pèlerinage"
 pam_sf_promised_acclaim_modifier_desc: "Le prêtre du pays de ce personnage s’est engagé à annoncer aux habitants de la capitale l’achèvement de son prochain pèlerinage.\n\nUne fois ce pèlerinage terminé, sa [capital|El] gagnera [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip] pendant #V 15#! ans."
 pam_sf_extolled_pilgrimage_county_modifier: "Accueil d’un pèlerin"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "La nouvelle du pèlerinage de leur dirigeant résonne dans tout le comté, et les habitants se nourrissent de la fierté que cela suscite."
 pam_sf_free_feast_discount_desc: "Un festin en perspective"
 pam_sf_free_feast_modifier: "Forte envie de festin"
 pam_sf_free_feast_modifier_desc: "Entrevoir la sainte indulgence n’a fait qu’aiguiser l’appétit de ce personnage :\n$EFFECT_LIST_BULLET$Coût du prochain [GetActivityType( 'activity_feast').GetName|l] : #P -100%#![gold_i]\n#weak Dépensé au moment où commence le festin.#!"
 pam_sf_pilgrimage_funded_modifier: "Pèlerinage financé"
 pam_sf_pilgrimage_funded_modifier_desc: "Un mécène s’est engagé à prendre en charge une partie du coût du prochain pèlerinage de ce personnage :\n$EFFECT_LIST_BULLET$Coût de [GetActivityType( 'activity_pilgrimage').GetName|l] : #P -50%#![gold_i]"
 pam_sf_pilgrimage_funded_discount_desc: "Pèlerinage financé"
 pam_sf_ear_of_clergy_modifier: "A l’oreille du clergé"
 pam_sf_ear_of_clergy_modifier_desc: "L’Église est plus encline à accéder aux demandes de ce personnage :\n$EFFECT_LIST_BULLET$Acceptation de #V $hof_ask_for_claim_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $hof_ask_for_gold_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $request_excommunication_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $request_legitimacy_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $ecclesiastic_grant_claim_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $strengthen_claim_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $request_enforce_succession_interaction$#! : #P +25#!\n$EFFECT_LIST_BULLET$Acceptation de #V $request_white_peace_interaction$#! : #P +25#!"
 pam_religious_delirium_modifier: "Délire religieux"
 pam_religious_delirium_modifier_desc: "Ce personnage est convaincu que le ciel lui parle\n$EFFECT_LIST_BULLET$Gain d’[spiritual_fulfillment|El] : #P +50%#!\n$EFFECT_LIST_BULLET$Perte d’[spiritual_fulfillment|El] : #N +50%#!"
 pam_sf_church_builder_modifier: "Bâtisseur d’églises"
 pam_sf_church_builder_modifier_desc: "Après avoir construit un premier lieu de culte, ce personnage construit des églises à moindre coût et bénéficie d’un apport constant de piété."
 pam_sf_scriptorium_county_modifier: "Scribes à l’œuvre"
 pam_sf_scriptorium_county_modifier_desc: "Des érudits tiennent les comptes de cette propriété et en assurent la copie."
 pam_sf_doctrine_clarity_modifier: "Illumination"
 pam_sf_doctrine_clarity_modifier_desc: "Ce personnage a connu un rare moment de lucidité, une véritable illumination."
 pam_sf_favorable_omen_modifier: "Présage favorable"
 pam_sf_favorable_omen_modifier_desc: "Ce personnage voit dans les cieux un signe de la faveur divine, et les fidèles reprennent courage devant cette bénédiction."
 pam_sf_omen_of_victory_modifier: "Présage de victoire"
 pam_sf_omen_of_victory_modifier_desc: "Convaincu que les cieux lui ont promis la victoire, ce personnage et son armée marchent sans crainte."
 pam_sf_demon_torment_modifier: "Tourment démoniaque"
 pam_sf_demon_torment_modifier_desc: "Ce personnage est convaincu qu’un démon le tourmente et qu’il doit se construire un [GetBuilding('temple_01').GetName|l] ([holding|El]) ou partir en [GetActivityType('activity_pilgrimage').GetName|l]."
 pam_sf_besieged_by_demons_modifier: "Assailli par les démons"
 pam_sf_besieged_by_demons_modifier_desc: "L’esprit de ce personnage est assiégé par les démons : il délire, convulse et s’éloigne chaque jour davantage de la raison."
 pam_sf_grief_solace_modifier: "Consolé par un esprit"
 pam_sf_grief_solace_modifier_desc: "Ce personnage a trouvé quelque réconfort après avoir, dit-on, reçu la visite d’une apparition."
 pam_sf_grief_warning_modifier: "Averti par un esprit"
 pam_sf_grief_warning_modifier_desc: "Ce personnage croit avoir été averti par une apparition."
 pam_sf_peace_of_god_modifier: "Paix de Dieu"
 pam_sf_peace_of_god_modifier_desc: "Ce personnage a juré d’instaurer et de faire respecter la paix de Dieu dans tout le pays."
 pam_sf_immured_anchorite_modifier: "Anachorète emmuré"
 pam_sf_immured_anchorite_modifier_desc: "Cet édifice religieux abrite un anachorète emmuré."
 pam_sf_voice_of_jesus_modifier: "Voix de Dieu"
 pam_sf_voice_of_jesus_modifier_desc: "Ce personnage a entendu une voix divine et s’est relevé transfiguré, toutes ses facultés aiguisées comme si la main de Dieu l’avait touché."
 pam_sf_stroke_of_god_modifier: "Frappé par Dieu"
 pam_sf_stroke_of_god_modifier_desc: "Une soudaine attaque d’apoplexie a terrassé ce personnage. Les médecins disent qu’il a été « frappé par Dieu », victime d’un coup divin qui frappe le cerveau et laisse le corps comme l’esprit gravement meurtris."
 pam_sf_lingering_stench_modifier: "Une odeur tenace"
 pam_sf_lingering_stench_modifier_desc: "Malgré tous ses efforts, ce personnage ne parvient pas à se débarrasser de l’odeur des pieds du pauvre qu’il a lavés."
 pam_sf_site_of_miracle_county_modifier: "Lieu d’un miracle"
 pam_sf_site_of_miracle_county_modifier_desc: "Ce comté est le théâtre d’un miracle, attirant aussi bien les pèlerins que les brigands."
 pam_sf_consecrated_county_modifier: "Nouvellement consacrée"
 pam_sf_consecrated_county_modifier_desc: "Une église de ce comté vient d’être consacrée."
 pam_sf_flagellant_cults_county_modifier: "Cultes de flagellants"
 pam_sf_flagellant_cults_county_modifier_desc: "Des groupes de pénitents parcourent les rues de ce comté en se flagellant."
 pam_sf_relic_procession_county_modifier: "Le saint est apparu"
 pam_sf_relic_procession_county_modifier_desc: "Les reliques d’un saint ont été portées en procession solennelle à travers ce comté, et le peuple en ressort un peu plus fier."
 pam_sf_blessed_bell_county_modifier: "Cloche baptisée"
 pam_sf_blessed_bell_county_modifier_desc: "La cloche de l’église de ce comté a été lavée, ointe et baptisée. Le peuple croit en son pouvoir de chasser aussi bien les tempêtes que les démons."
 pam_sf_church_ale_county_modifier: "Bière de l’église"
 pam_sf_church_ale_county_modifier_desc: "Le dirigeant de ce comté a bu la bière de l’église avec ses paroissiens, et la paroisse n’a cessé d’en parler depuis."
 pam_sf_safe_passage_modifier: "Passage sous bonne garde"
 pam_sf_safe_passage_modifier_desc: "Après avoir été secouru sur la route, ce voyageur s’est vu accorder une escorte et un sauf-conduit."
 pam_sf_waylaid_road_modifier: "Attaque au cours du voyage"
 pam_sf_waylaid_road_modifier_desc: "Le voyage de ce personnage est devenu périlleux après une attaque sur la route."
 pam_sf_penance_lustful_modifier: "Réprime la luxure"
 pam_sf_penance_lustful_modifier_desc: "Ce personnage fait pénitence pour sa luxure, domptant ses désirs au prix d’une descendance moins nombreuse."
 pam_sf_penance_chaste_modifier: "Rejette la chasteté"
 pam_sf_penance_chaste_modifier_desc: "Ce personnage renonce à une chasteté que sa foi tient pour pécheresse, allant ainsi contre sa propre nature."
 pam_sf_penance_gluttonous_modifier: "Jours de jeûne"
 pam_sf_penance_gluttonous_modifier_desc: "Ce personnage jeûne en pénitence de sa gourmandise, mortifiant son corps pour nourrir son âme."
 pam_sf_penance_temperate_modifier: "Rompt le long jeûne"
 pam_sf_penance_temperate_modifier_desc: "Ce personnage renonce à une tempérance que sa foi tient pour pécheresse, se montrant désormais plus généreux de cœur comme de bourse."
 pam_sf_penance_greedy_modifier: "Aumônes pénitentielles"
 pam_sf_penance_greedy_modifier_desc: "Ce personnage fait l’aumône en pénitence de son avarice, vidant ses coffres tout en soulageant sa conscience."
 pam_sf_penance_generous_modifier: "Garde sa bourse fermée"
 pam_sf_penance_generous_modifier_desc: "Ce personnage réfrène une générosité que sa foi tient pour pécheresse ; il s’enrichit, mais s’attire davantage de ressentiment."
 pam_sf_penance_lazy_modifier: "Labeur pénitentiel"
 pam_sf_penance_lazy_modifier_desc: "Ce personnage s’impose un labeur épuisant en pénitence de sa paresse."
 pam_sf_penance_diligent_modifier: "S’impose le repos"
 pam_sf_penance_diligent_modifier_desc: "Ce personnage renonce à une ardeur au travail que sa foi tient pour pécheresse, devenant plus serein, mais moins productif."
 pam_sf_penance_wrathful_modifier: "Réfrène sa colère"
 pam_sf_penance_wrathful_modifier_desc: "Ce personnage réfrène sa colère en pénitence, sa main se faisant moins prompte à frapper et son épée à se lever."
 pam_sf_penance_calm_modifier: "Éveille l’ardeur"
 pam_sf_penance_calm_modifier_desc: "Ce personnage attise une sérénité que sa foi tient pour pécheresse jusqu’à la ferveur, devenant plus fougueux, mais plus tourmenté."
 pam_sf_penance_patient_modifier: "Presse le pas"
 pam_sf_penance_patient_modifier_desc: "Ce personnage rejette une patience que sa foi tient pour pécheresse, devenant plus prompt, mais toujours mal à l’aise."
 pam_sf_penance_impatient_modifier: "Cultive la patience"
 pam_sf_penance_impatient_modifier_desc: "Ce personnage discipline son tempérament impatient en pénitence, mais l’attente lui devient amère."
 pam_sf_penance_arrogant_modifier: "Pratique l’humilité"
 pam_sf_penance_arrogant_modifier_desc: "Ce personnage renonce à son orgueil en pénitence, et sa renommée décroît avec lui."
 pam_sf_penance_humble_modifier: "Se montre orgueilleux"
 pam_sf_penance_humble_modifier_desc: "Ce personnage se montre orgueilleux, comme sa foi l’exige au détriment de l’humilité ; il gagne en renommée, mais passe pour vaniteux."
 pam_sf_penance_deceitful_modifier: "Vœu de franchise"
 pam_sf_penance_deceitful_modifier_desc: "Ce personnage s’astreint à la franchise en pénitence de ses tromperies, au prix d’une ruse désormais émoussée."
 pam_sf_penance_honest_modifier: "Apprend à dissimuler"
 pam_sf_penance_honest_modifier_desc: "Ce personnage apprend les ruses que sa foi place au-dessus de l’honnêteté, devenant plus retors, mais moins digne de confiance."
 pam_sf_penance_craven_modifier: "Affronte ses peurs"
 pam_sf_penance_craven_modifier_desc: "Ce personnage tient bon en pénitence de sa lâcheté, quand bien même chaque instant lui inspire de l’effroi."
 pam_sf_penance_brave_modifier: "Modère sa bravoure"
 pam_sf_penance_brave_modifier_desc: "Ce personnage refrène une bravoure que sa foi tient pour pécheresse, apprenant la prudence au prix d’une lame émoussée."
 pam_sf_penance_shy_modifier: "Force son courage"
 pam_sf_penance_shy_modifier_desc: "Ce personnage s’efforce d’afficher l’audace en pénitence de sa nature réservée ; chaque assemblée devient pour lui une épreuve."
 pam_sf_penance_gregarious_modifier: "Se retire dans le silence"
 pam_sf_penance_gregarious_modifier_desc: "Ce personnage se détourne des réjouissances pécheresses pour se réfugier dans le silence, au prix de quelques amitiés."
 pam_sf_penance_ambitious_modifier: "Bride son ambition"
 pam_sf_penance_ambitious_modifier_desc: "Ce personnage baisse les yeux sur ses ambitions en pénitence, renonçant avec elles à la renommée."
 pam_sf_penance_content_modifier: "Éveille l’aspiration"
 pam_sf_penance_content_modifier_desc: "Ce personnage ravive en lui l’aspiration en pénitence d’un contentement que sa foi tient pour pécheur ; désormais, rien ne lui suffit et il en demande toujours plus."
 pam_sf_penance_arbitrary_modifier: "Gouverne avec justice"
 pam_sf_penance_arbitrary_modifier_desc: "Ce personnage gouverne avec une justice impartiale en pénitence de son arbitraire passé, devenant plus équitable, mais moins riche."
 pam_sf_penance_just_modifier: "Gouverne selon son caprice"
 pam_sf_penance_just_modifier_desc: "Ce personnage gouverne selon les caprices que sa foi lui impose au détriment de la justice : plus riche, mais moins aimé."
 pam_sf_penance_cynical_modifier: "Ravive la foi"
 pam_sf_penance_cynical_modifier_desc: "Ce personnage ravive sa foi en pénitence de son cynisme passé ; il porte désormais sa croyance comme un manteau qui lui est encore étranger."
 pam_sf_penance_zealous_modifier: "Modère son zèle religieux"
 pam_sf_penance_zealous_modifier_desc: "Ce personnage tempère un zèle que sa foi juge excessif, et les fidèles se montrent moins fervents à son égard."
 pam_sf_penance_paranoid_modifier: "Apprend à faire confiance"
 pam_sf_penance_paranoid_modifier_desc: "Ce personnage apprend à faire confiance en pénitence de sa suspicion passée : les portes s’ouvrent, et sa méfiance se relâche."
 pam_sf_penance_trusting_modifier: "Se garde de trop faire confiance"
 pam_sf_penance_trusting_modifier_desc: "Ce personnage se montre plus méfiant, sa foi tenant pour pécheresse la confiance qu’il accordait trop facilement ; il baisse sa garde moins volontiers, mais passe pour froid."
 pam_sf_penance_compassionate_modifier: "Endigue sa compassion"
 pam_sf_penance_compassionate_modifier_desc: "Ce personnage réfrène une compassion que sa foi tient pour pécheresse, arborant un visage plus dur que les autres en viennent à craindre."
 pam_sf_penance_callous_modifier: "Cultive la compassion"
 pam_sf_penance_callous_modifier_desc: "Ce personnage cultive la compassion en pénitence d’un cœur endurci ; sa main se fait plus douce, et la crainte qu’il inspirait s’estompe."
 pam_sf_penance_sadistic_modifier: "Renonce à la cruauté"
 pam_sf_penance_sadistic_modifier_desc: "Ce personnage renonce à la cruauté en pénitence, et la terreur qu’il inspirait s’estompe peu à peu."
 pam_sf_penance_stubborn_modifier: "Apprend à céder"
 pam_sf_penance_stubborn_modifier_desc: "Ce personnage apprend à céder en pénitence de son entêtement."
 pam_sf_penance_fickle_modifier: "S’astreint à la constance"
 pam_sf_penance_fickle_modifier_desc: "Ce personnage s’astreint à la constance en pénitence de son caractère changeant, et cette discipline lui pèse."
 pam_sf_penance_eccentric_modifier: "Se conforme aux usages"
 pam_sf_penance_eccentric_modifier_desc: "Ce personnage met de côté ses idées singulières en pénitence de son excentricité passée."
 pam_sf_penance_vengeful_modifier: "Apprend le pardon"
 pam_sf_penance_vengeful_modifier_desc: "Ce personnage renonce à ses vieilles rancunes en pénitence de sa soif de vengeance, se montrant plus doux envers ses captifs, mais plus lent à frapper en retour."
 pam_sf_penance_forgiving_modifier: "Nourrit sa rancune"
 pam_sf_penance_forgiving_modifier_desc: "Ce personnage nourrit une rancune que sa foi lui commande de préférer au pardon, devenant plus froid et plus redouté."
 pam_mystical_birthright_spiritual_leader_modifier: "Naissance de bon augure"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Un signe de naissance a façonné le développement spirituel de ce personnage."
 pam_personal_sacrifice_of_wealth_county_modifier: "Investissement dévotionnel"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "Les dons pieux d’un dirigeant favorisent la croissance de ce comté."
 pam_sf_grinding_modifier: "Travail abrutissant"
 pam_sf_grinding_modifier_desc: "Ce personnage travaille d’arrache-pied et en souffre."
