 clergy_land_increased_possibility_piety_tt: "#EMP #weak L’acceptation est plus probable en raison de la personnalité zélée [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName]#!#!"
 clergy_land_increased_possibility_legitimacy_tt: "#EMP #weak L’acceptation est plus probable en raison de la personnalité lâche [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName]#!#!"
 clergy_land_increased_possibility_gold_tt: "#EMP #weak L’acceptation est plus probable en raison de la personnalité cupide [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName]#!#!"
 recipient_becomes_potential_rival_tt: "[actor.Custom('FR_le_Char_U_Pi')|U][actor.GetShortUIName|U] [Select_CString(actor.IsLocalPlayer,'devenez','devient')] plus proche de nouer une [rivalry|El] avec [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName]"
 recipient_becomes_rival_tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName|U] [Select_CString(recipient.IsLocalPlayer,'devenez','devient')] [recipient.Custom('FR_LeLa')] [Concept('rival',Select_CString(recipient.IsFemale,'rivale','rival'))|E] [actor.Custom('FR_du_Char_U_Pi')][actor.GetShortUIName]"
 clergy_land_request_reduction_tt: "Les [rulers|El] sont moins enclins à utiliser l’[interaction|El] [ecclesiastic_transfer_land_interaction|El] contre vous pendant #high 10 ans#!"
 clergy_land_transfer_theocratic_ecclesiastical_tt: "[target.GetHolder.Custom('FR_le_Char_U_Pi')|U][target.GetHolder.GetShortUIName] ne doit pas avoir un [government|El] [ecclesiastical|El] ou [theocratic|El]"
 clergy_land_transfer_theocratic_ecclesiastical_recipient_tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] ne doit pas avoir un [government|El] [ecclesiastical|El] ou [theocratic|El]"
 clergy_land_transfer_ai_scholar_tt: "L’[Concept('trait_level_track_xp', 'expérience')|E] élevée d’[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l] [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName] [recipient.Custom('FR_LeLa')] protège de #high $ecclesiastic_transfer_land_interaction$#!"
 pam_interactions_events.0039.opening: "[ROOT.Char.GetFirstName], m[ROOT.Char.Custom('FR_OnA')] fidèle [Select_CString(ROOT.Char.IsFemale,'servante','serviteur')],"
 pam_interactions_events.0039.desc: "Je regrette que cette nouvelle vous soit annoncée si soudainement, mais je me dois de vous en informer : je cède [target.GetName] [actor.Custom('FR_au_Char_L')][actor.GetTitleAsName] de [actor.GetPrimaryTitle.GetNameNoTier].\n\nTelle est la volonté [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstNameRegnal], qui a présidé aux négociations concernant votre [ROOT.Char.GetPrimaryTitle.GetTierAsName] entre [actor.GetTitledFirstNameNicknamed] et moi-même. Retournez en [recipient.GetCapitalLocation.GetTitle.GetNameNoTier], vous serez bientôt réaffecté[ROOT.Char.Custom('FR_E')]."
 pam_interactions_events.0039.a: "Il semblerait que je n’aie plus d’emploi..."
 pam_interactions_events.0039_revoked_governorship_tt: "#high Votre#! [governorship|El] a été révoqué"
 pam_interactions_events.0039_governorship_transfer_tt: "[target.GetName] a été transféré [actor.Custom('FR_au_Char_U_Pi')][actor.GetShortUIName]"
 spiritual_counsel_interaction: "Proposer un accompagnement spirituel"
 spiritual_counsel_interaction_desc: "Offrez un entretien spirituel privé [recipient.Custom('FR_au_Char_U_Pi')][recipient.GetShortUIName] — donnez-lui un conseil judicieux, prêtez l’oreille à sa confession — en échange d’un [hook|El][hook_i]."
 spiritual_counsel_notification_text: "Asseyez-vous un instant avec moi, [Select_CString(recipient.IsFemale,'ma fille','mon fils')]. Débarrassez-vous de vos fardeaux et laissez-moi vous aider à retrouver le chemin qui mène [actor.GetFaith.HighGodName2]."
 spiritual_counsel_interaction_accept_actor_toast: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUINameNoTooltip] a accepté votre accompagnement"
