 # Clerical land transfer events
 # player Priest refuses event
 pam_interactions_events.0031.opening: "[Select_CString(actor.IsFemale,'Ma fille têtue','Mon fils têtu')],"
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName|U] vous a donné des lèvres pour prononcer des paroles justes. [actor.GetFaith.HighGodName|U] vous a donné des mains pour manier l’épée. Et [actor.GetFaith.HighGodName] a donné au monde des [actor.GetFaith.PriestNeuterPlural] afin que vous puissiez suivre leur sagesse.\n\nRongé[ROOT.Char.Custom('FR_E')] par l’avidité, vous prononcez des paroles injustes. Tourmenté[ROOT.Char.Custom('FR_E')] par de terribles doutes, vous retenez l’épée que vous souhaitez brandir contre [target.GetNameNoTier].\n\nLa question se résume à ceci : écoutez ma sagesse... et laissez le [target.GetTierAsName] tranquille."
 pam_interactions_events.0031.a: "[secondary_recipient.Custom('FR_le_Char_L')|U][secondary_recipient.GetTitleAsNameNoTooltip|l] rejette ma demande !"
 # Player clergy response event
 pam_interactions_events.0033.opening: "[Select_CString(ROOT.Char.IsFemale,'Gardienne','Gardien')] de l’ordre céleste et terrestre,"
 pam_interactions_events.0033_de_jure: "Je sollicite votre aide. Proclamez que mon pouvoir s’étend légitimement sur [target.GetName], titre qui m’appartient de plein droit. Donnez-moi votre soutien pour convaincre [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] sans effusion de sang.\n\n"
 pam_interactions_events.0033_claim: "Je veux faire valoir mon droit sur [target.GetNameNoTier]. Accordez-moi votre bénédiction sacrée, afin que [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] puisse céder le [target.GetTierAsName] sans qu’il y ait d’effusion de sang [actor.GetFaith.GetAdherentName].\n\n"
 pam_interactions_events.0033_threaten: "Si vous rejetiez cette requête, ce serait à vous d’expliquer [ROOT.Char.GetFaith.HighGodName2] les massacres et les incendies que je causerai en [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0033_succession: "Si vous vous prononcez dans le sens que je souhaite, je vous fais la promesse suivante : si je venais à mourir en tant que [actor.GetTitleAsName] de [actor.GetPrimaryTitle.GetNameNoTier] – sans descendance issue de ma lignée –, le pays reviendrait à l’Église."
 pam_interactions_events.0033_pilgrimage: "En échange de votre consentement sacré dans cette affaire terrestre, je m’engage à entreprendre un pèlerinage : en signe de gratitude pour les bénédictions que m’a accordées [actor.GetFaith.HighGodName]."
 pam_interactions_events.0033_use_hook: "Vous n’avez certainement pas oublié... que les mots que vous écrivez doivent refléter mes souhaits, n’est-ce pas ?"
 pam_interactions_events.0033_offer_hook: "Mettre votre réputation de piété au service de ma cause n’est pas une faveur négligeable. Soutenez-moi dans ces intrigues politiques mortelles, et je vous soutiendrai à mon tour dans les jours à venir."
 pam_interactions_events.0033_donate: "Accordez-moi votre aide, enrichissez mon pays de terres, et je me ferai un plaisir de remplir vos coffres."
 pam_interactions_events.0033_fallback: "Ces négociations concernant des terres et des titres n’aboutiront à rien, à moins qu’un intercesseur sacré ne vienne à notre secours. Voulez-vous mettre votre autorité sacrée au service de ma cause ?"
 pam_interactions_events.0033.aa: "Oui. C’est fait."
 pam_interactions_events.0033.a: "Conformément à mon décret, [target.GetNameNoTierNoTooltip] doit appartenir à [actor.GetFirstNameNoTooltip]."
 pam_interactions_events.0033.a.tt: "Envoyez une missive [recipient.Custom('FR_au_Char_Pi')][recipient.GetTitledFirstNameNoTooltip] : s’accrocher à des terres détenues illégalement provoque le courroux [secondary_recipient.GetFaith.HighGodNamePossessive] et [secondary_recipient.Custom('FR_du_Char_L')][secondary_recipient.GetTitleAsNameNoTooltip|l] !"
 pam_interactions_events.0033.b: "Je ne peux pas approuver cette exigence effrontée."
 pam_interactions_events.0033.b.tt: "Le monde est bien ordonné, tel qu’il est. [recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstNameNoTooltipRegnal] doit garder [target.GetNameNoTierNoTooltip]."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.Custom('FR_le_Char_U_Pi')|U][actor.GetShortUIName] va tenter de convaincre [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] de lui donner [target.GetName], et peut échouer#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.Custom('FR_le_Char_U_Pi')|U][actor.GetShortUIName] pourrait forcer [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] à lui donner [target.GetName], mais pourrait aussi prendre le risque d’échouer#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] donnera [target.GetName] [actor.Custom('FR_au_Char_U_Pi')][actor.GetShortUIName] sans résistance#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Votre [law|El] de l’[GetLaw('church_authority_3').GetName] vous permet de forcer [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] à donner [target.GetName] [actor.Custom('FR_au_Char_U_Pi')][actor.GetShortUIName] sans résistance#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "En ma qualité de [Select_CString(secondary_recipient.IsFemale,'médiatrice','médiateur')], j’ouvre par la présente les négociations."
 pam_interactions_events.0032_intro: "Vous avez bien pris soin de [target.GetNameNoTier], mais c’est la volonté [recipient.GetFaith.HighGodNamePossessive] que ce titre appartienne [actor.Custom('FR_au_Char_Pi')][actor.GetTitledFirstName]. Pourriez-vous, je vous en prie, lui céder ce territoire sans effusion de sang ?\n\n"
 pam_interactions_events.0032_de_jure: "Car [target.GetNameNoTierNoTooltip] lui appartient de jure."
 pam_interactions_events.0032_claim: "Car aux yeux du Tout-Puissant, sa revendication sur [target.GetNameNoTierNoTooltip] est la plus légitime de toutes."
 pam_interactions_events.0032.aa: "Voyons voir, où est ma plume..."
 pam_interactions_events.0032.aa.flavor: "Je vais prouver au monde entier que [recipient.GetFaith.HighGodName] a privé ces charlatans pécheurs de toute vertu [recipient.GetFaith.GetAdjectiveNoTooltip]. Tout ce qu’ils possèdent – et posséderont jamais –, c’est une effronterie éhontée."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP La tentative [actor.Custom('FR_du_Char_U_Pi')][actor.GetShortUIName] d’obtenir [target.GetName] échoue#!#!#!"
 pam_interactions_events.0032.a: "Si telle est la volonté [actor.GetFaith.HighGodNamePossessive], je céderai [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0032.b: "Non. Vous ne me convainquez pas, ni l’un ni l’autre."
 pam_interactions_events.0032.b.tt: "Si seulement on pouvait facilement faire taire [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstNameNoTooltip] et [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstNameNoTooltip]..."
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold Cela pourrait vous inciter à accepter qu’[actor.Custom('FR_IlElle')] s’empare de [target.GetName] en utilisant l’une des méthodes suivantes :#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "Négociations pour [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0030.desc_intro_envoy: "Sur cette terre sacrée, [Select_CString(secondary_recipient.IsFemale,'ma messagère','mon messager')], [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstNameRegnal], expose mes arguments concernant [target.GetNameNoTier]."
 pam_interactions_events.0030.desc_intro: "Fort de la bénédiction [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstNameRegnal] et sous la protection de cette terre sacrée, je vais exposer mes arguments concernant [target.GetNameNoTier]."
 pam_interactions_events.0030.desc: "Des paroles de concorde pacifique, accompagnées de menaces de guerre. Des déclarations sur mes droits acquis. Et ainsi de suite...\n\n"
 pam_interactions_events.0030.desc_target: "On ne chassera pas si facilement [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstNameNicknamed] de [target.GetNameNoTierNoTooltip]. Cette affaire de territoire doit être réglée soit par des promesses matérielles, soit par des menaces."
 pam_interactions_events.0030.desc_vassal: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstNameNicknamed] ne renoncera pas si facilement à son emprise sur [vassal.Custom('FR_le_Char_Pi')][vassal.GetTitledFirstName]. Que ce soit par des propositions alléchantes ou par de terribles menaces : il faut mériter [Select_CString(vassal.IsFemale,'ma vassale','mon vassal')]."
 pam_interactions_events.0030.a: "Rappeler à [recipient.GetFirstNameNoTooltip] qu’[recipient.Custom('FR_IlElle')] a certaines... obligations."
 pam_interactions_events.0030.a.flavor: "Et c’est [actor.Custom('FR_le_Char_L')][actor.GetTitleAsNameNoTooltip|l] de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] qui peut les exiger !"
 pam_interactions_events.0030.b: "Je n’ai pas besoin d’un[recipient.Custom('FR_E')] [ROOT.Char.Custom2('RelationToMe', recipient)]. J’ai besoin de [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0030.b.flavor: "Soyez clair : si [recipient.GetFirstNameNoTooltip] refuse, cela signifie qu’[recipient.Custom('FR_IlElle')] ne compte plus pour vous."
 pam_interactions_events.0030.c: "[recipient.Custom('FR_SilSielle')|U] ne cède pas, [recipient.Custom('FR_IlElle')] souillera ce sol sacré."
 pam_interactions_events.0030.c.tt: "Accablez [Select_CString(recipient.IsFemale,'cette pécheresse impure','ce pécheur impur')] d’accusations infamantes ! Que la damnation et le mépris s’abattent sur vous deux ! [secondary_recipient.Custom('FR_le_Char_Pi')|U][secondary_recipient.GetTitledFirstNameNoTooltip] et tous les autres [actor.GetFaith.PriestNeuterPlural] feront céder [recipient.GetFirstNameNoTooltip] !"
 pam_interactions_events.0030.d: "Menacer d’en faire un scandale susceptible de nuire à sa réputation."
 pam_interactions_events.0030.d.flavor: "[recipient.Custom('FR_le_Char_L')|U][recipient.GetTitleAsNameNoTooltip|l], déjà peu respecté[recipient.Custom('FR_E')], ne pourra guère résister si sa réputation est menacée..."
 pam_interactions_events.0030.e: "Proposer simplement d’acheter le [target.GetTierAsNameNoTooltip|l]."
 pam_interactions_events.0030.f: "Je m’en remets [ROOT.Char.GetFaith.HighGodName2] et au jugement de [recipient.GetFirstNameNoTooltip]."
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold Sans incitation, il est peu probable que [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] accepte !#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Sans incitations, [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] est moins susceptible d’accepter#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "Le litige à propos de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.Custom('FR_le_Char_Pi')|U][secondary_recipient.GetTitledFirstNameRegnal] développe ses arguments concernant [target.GetNameNoTier] pour le bien [actor.Custom('FR_du_Char_Pi')][actor.GetTitledFirstName], mais aussi, selon ses dires, pour l’ordre terrestre [recipient.GetFaith.HighGodNamePossessive] et le clergé [recipient.GetFaith.GetAdherentName]."
 pam_interactions_events.0034.desc_intro: "[actor.Custom('FR_le_Char_Pi')|U][actor.GetTitledFirstName] plaide en faveur de [target.GetNameNoTier] : [actor.Custom('FR_IlElle')] ressasse la revendication protégée et cautionnée par la foi [recipient.GetFaith.GetAdjective]."
 pam_interactions_events.0034.desc_vassal: "Peu importe que j’aie juré d’être fidèle jusqu’à la mort [target.GetHolder.Custom('FR_au_Char_Pi')][target.GetHolder.GetTitledFirstName]. Cette loyauté, apparemment, est négociable."
 pam_interactions_events.0034.desc_target: "Peu importe que ce titre m’appartienne par le sang ou par la conquête. Tout dans ce monde est négociable."
 pam_interactions_events.0034.desc: "\n\nSur ce sol sacré, j’endure sereinement ces atteintes à mes droits. Je ne peux que songer à ce qui m’est proposé...\n\n"
 pam_interactions_events.0034.desc_method_hook: "La promesse que les obligations que [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstNameNoTooltip] m’a imposées seront annulées."
 pam_interactions_events.0034.desc_method_relation: "Une fin désastreuse à toute la chaleur, la confiance et l’amour qui régnaient entre nous. Selon [actor.GetFirstNameNoTooltip], son cœur est entièrement tourné vers cette affaire foncière.\n\n[actor.Custom('FR_IlElle')|U] me détestera à jamais pour les lui avoir refusées."
 pam_interactions_events.0034.desc_method_piety: "La menace qui pèse sur ma relation déjà fragile avec la foi laisse présager un désastre. Cela mettrait également en péril celle [actor.Custom('FR_du_Char_Pi')][actor.GetTitledFirstNameNoTooltip], mais sa piété est plus solide que la mienne."
 pam_interactions_events.0034.desc_method_legitimacy: "Une menace terrible pour ma légitimité. Une dispute publique effroyable à propos de [target.GetNameNoTierNoTooltip], un scandale qui ferait de nous deux la risée de tous..."
 pam_interactions_events.0034.desc_method_gold: "Un tas de pièces étincelantes. Un prix raisonnable que [actor.Custom('FR_le_Char_L')][actor.GetTitleAsNameNoTooltip|l] demande pour un [target.GetTierAsNameNoTooltip|l]."
 pam_interactions_events.0034.desc_no_method: "... Rien du tout. Juste la demande formulée pour [target.GetNameNoTier] et l’hypothèse selon laquelle je crains le mépris des [recipient.GetFaith.PriestNeuterPlural] et les horreurs de la guerre."
 pam_interactions_events.0034.a: "Qu’[actor.Custom('FR_IlElle')] laisse flotter sa bannière au-dessus de [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0034.b: "Tant que je vivrai, cette terre sera mienne."
 pam_interactions_events.0035.t: "Acquisition de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0035.desc_intro: "Après un moment de réflexion, [recipient.GetFirstNameNicknamed] cède ! Les négociations concernant la cession de [target.GetNameNoTier] sont rapides et fructueuses.\n\nLe décret [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstName] concernant mes droits est signé."
 pam_interactions_events.0035.desc_hook: "L’obligation que j’avais imposée à [recipient.GetFirstNameNoTooltip] a été honorée."
 pam_interactions_events.0035.desc_relation: "Certes, des larmes amères ont coulé, et la joie et l’admiration ont pris fin. J’ai causé une grande souffrance à [recipient.GetFirstNameNoTooltip] en voulant m’emparer de [target.GetNameNoTierNoTooltip]. Cependant..."
 pam_interactions_events.0035.desc_piety: "Par conséquent, mes menaces de plonger aussi bien [recipient.GetFirstNameNoTooltip] que moi-même dans une honte infamante n’auront pas à être mises à exécution."
 pam_interactions_events.0035.desc_legitimacy: "Par conséquent, mes menaces visant à semer la controverse et la calomnie n’auront pas besoin d’être mises à exécution."
 pam_interactions_events.0035.desc_gold: "Après avoir informé mes trésoriers et mes créanciers, j’accepte volontiers d’en payer le prix."
 pam_interactions_events.0035.desc_fallback: "La puissance conférée par [actor.GetFaith.HighGodName] aux [actor.GetFaith.PriestNeuterPlural] [actor.GetFaith.GetAdherentNamePlural] et à moi-même est impressionnante ! Sans avoir besoin d’armées ni de mener de guerre, le monde se réorganise selon nos ordres."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.Custom('FR_le_Char_Pi')|U][vassal.GetTitledFirstName] me jurera fidélité."
 pam_interactions_events.0035.desc: "\n\n[target.GetNameNoTierNoTooltip] m’appartient."
 pam_interactions_events.0035.a: "Que mes bannières flottent au vent en [target.GetNameNoTierNoTooltip] !"
 pam_interactions_events.0036.t: "Refus à propos de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0036.desc_intro_afraid_admin: "Entouré[recipient.Custom('FR_E')] de preux soldats, [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] donne sa réponse, et semble mal à l’aise malgré la médiation pacifique [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstName] :\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "Entouré[recipient.Custom('FR_E')] de robustes [recipient.Custom('KnightCulturePluralNoTooltip')|l], [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] donne sa réponse, et semble mal à l’aise malgré la médiation pacifique [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstName] :\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstName] répond seul[recipient.Custom('FR_E')] et la tête haute, enhardi[recipient.Custom('FR_E')] par la médiation pacifique [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstName] :\n\n"
 pam_interactions_events.0036.desc_intro_admin: "Entouré[recipient.Custom('FR_E')] de gardes du corps, [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] donne sa réponse, visiblement agacé[recipient.Custom('FR_E')] par la médiation pacifique [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstName] :\n\n"
 pam_interactions_events.0036.desc_intro: "Entouré[recipient.Custom('FR_E')] de robustes [recipient.Custom('KnightCulturePluralNoTooltip')|l], [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] donne sa réponse, visiblement agacé[recipient.Custom('FR_E')] par la médiation pacifique [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstName] :\n\n"
 pam_interactions_events.0036.desc_hook: "« [target.GetNameNoTier] occupe une place dans mon cœur plus importante que n’importe quelle obligation que vous pourriez m’imposer."
 pam_interactions_events.0036.desc_relation: "« [actor.Custom('FR_le_Char_L')|U][actor.GetTitleAsName|l] de [actor.GetPrimaryTitle.GetNameNoTier] bafoue mon honneur et me brise intérieurement. Je ne veux plus entendre parler d[actor.Custom('FR_EluiElle')]."
 pam_interactions_events.0036.desc_piety: "« Si je vous refuse [target.GetNameNoTier], vous allez nous déshonorer tous deux par des péchés et des accusations ? Eh bien, qu’il en soit ainsi."
 pam_interactions_events.0036.desc_legitimacy: "« Répandez donc vos vils mensonges. Montez les habitants de [target.GetNameNoTier] et les autres contre nous deux."
 pam_interactions_events.0036.desc_gold: "« Pensez-vous qu’on puisse acheter [target.GetNameNoTier] avec de l’or et de l’argent ? Une transaction bien trop simple pour un [target.GetTierAsNameNoTooltip|l] aussi noble."
 pam_interactions_events.0036.desc_fallback: "« Un[actor.Custom('FR_E')] [actor.GetTitleAsName|l] et un[secondary_recipient.Custom('FR_E')] [secondary_recipient.GetTitleAsNameNoTooltip|l] peuvent-ils conquérir [target.GetNameNoTier] avec quelques mots seulement ? Non."
 pam_interactions_events.0036.desc_afraid: "« Envoyez-moi les [recipient.GetFaith.PriestNeuterPlural] – je les accueillerai. Envoyez des émissaires – je négocierai avec eux... »\n\n« Mais je ne peux pas abandonner [target.GetNameNoTierNoTooltip] ainsi. »"
 pam_interactions_events.0036.desc_pious: "« Envoyez encore plus de [recipient.GetFaith.PriestNeuterPlural] corrompus, envoyez des hordes armées diaboliques en [target_capital.GetTitle.GetNameNoTier] »\n\n« Je n’abandonnerai pas une terre qui m’a été offerte par [recipient.GetFaith.HighGodName]. »"
 pam_interactions_events.0036.desc: "« Envoyez encore plus de [recipient.GetFaith.PriestNeuterPlural] hurlants, envoyez par hordes entières des [actor.Custom('GetFighterTermPlural')] armés en [target_capital.GetTitle.GetNameNoTier]... »\n\n« Je n’abandonnerai pas [target.GetNameNoTierNoTooltip] aussi facilement. »"
 pam_interactions_events.0036.a_relation: "Comment a-t-[recipient.Custom('FR_IlElle')] pu me rejeter ?!"
 pam_interactions_events.0036.a: "Un[secondary_recipient.Custom('FR_E')] [secondary_recipient.GetTitleAsNameNoTooltip|l] à qui l’on refuse d’obéir ? C’est honteux..."
 clergy_land_transfer_refusal_tt: "Refus de céder [target.GetName] [actor.Custom('FR_au_Char_U_Pi')][actor.GetShortUIName]"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 pam_interactions_events.0037.desc: "Je regrette que cette nouvelle soit inattendue, mais je me dois de vous en informer : [actor.Custom('FR_le_Char_L')][actor.GetTitleAsName|l] de [actor.GetPrimaryTitle.GetNameNoTier] est désormais votre [actor.Custom('FR_SeigneurDame')] lige.\n\nTelle est la volonté [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstNameRegnal], qui a mené les négociations au nom de [ROOT.Char.GetPrimaryTitle.GetTierAsName] entre [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstNameNicknamed] et moi-même. Tout comme vous avez été fidèle à notre [recipient.GetPrimaryTitle.GetNameNoTier], soyez-le également à votre [Select_CString(actor.IsFemale,'nouvelle dame','nouveau seigneur')]."
 pam_interactions_events.0037_new_liege_tt: "[actor.Custom('FR_le_Char_U_Pi')|U][actor.GetShortUIName] est devenu[actor.Custom('FR_E')] votre [Concept('liege', Select_CString(actor.IsFemale,'dame lige','seigneur lige'))|E]"
 pam_interactions_events.0037.a: "Mon serment n’a désormais plus cours. Dorénavant, personne ne peut plus me donner d’ordres."
 pam_interactions_events.0037.a.tt: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstNameNoTooltip] a renoncé à sa suzeraineté. Et si [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstNameNoTooltip] souhaite la reprendre, [actor.Custom('FR_IlElle')] devra se rendre en [target.GetNameNoTierNoTooltip] bien armé[actor.Custom('FR_E')]."
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip] ? Vraiment ?"
 pam_interactions_events.0037.b.tt: "Là où mon peuple regardait autrefois vers [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], j’imagine qu’il devra désormais se tourner vers [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
