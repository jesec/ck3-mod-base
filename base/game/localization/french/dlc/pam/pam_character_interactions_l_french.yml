 pam_interactions_events.0094.opening: "[ROOT.Char.GetTitleAsName] légitime !"
 pam_interactions_events.0094.desc_conversion: "Répandez la parole [cleric.GetFaith.HighGodNamePossessive] en [target.GetNameNoTier] ! N’épargnez pas le bâton à son peuple égaré, ni la force de vos [ROOT.Char.Custom('GetFighterTermPlural')] pour défendre les vertus de la terre.\n\nLe [target.GetTierAsNameNoTooltip|l] vous appartient. Il est soumis à la providence de chaque [ROOT.Char.GetTitleAsName|l] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier], #EMP de jure#! jusqu’à la fin des temps."
 pam_interactions_events.0094.desc: "C’est un jour béni pour les [cleric.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTooltip] ! Oh, comme ils aspiraient à ne faire qu’un avec leurs frères et sœurs en [ROOT.Char.GetPrimaryTitle.GetNameNoTier] !\n\nCe qui animait leur cœur a été adopté par le [cleric.GetTitleAsName|l] [cleric.GetFaith.HighGodNamePossessive] : les souverains de nombreuses terres reconnaissent désormais l’illustre [target.GetTierAsNameNoTooltip] comme pays #EMP de jure#! de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip] et [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sont liés pour l’éternité."
 pam_interactions_events.0095.opening: "[ROOT.Char.Custom('FR_le_Char_L')|U][ROOT.Char.GetTitleAsName|l] de [target_county.GetNameNoTier] et autres terres,"
 pam_interactions_events.0095.desc: "Vous êtes soumis[ROOT.Char.Custom('FR_E')] à une bénédiction de la part [cleric.GetFaith.HighGodNamePossessive] ! Dans Son infinie sagesse, [cleric.GetFaith.HighGodNameSheHe|U] a placé [target.GetName] sous la protection éternelle [de_jure_master.Custom('FR_du_Char_L')][de_jure_master.GetTitleAsName|l] de [de_jure_master.GetPrimaryTitle.GetName].\n\nEn tant que [cleric.GetTitleAsName|l], je promulgue ce décret au nom des [cleric.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTooltip], [de_jure_master.Custom('FR_du_Char_L')][de_jure_master.GetTitleAsNameNoTooltip|l], et de ceux qui connaissent la sagesse qui réside dans cette division #EMP de jure#! des royaumes mortels [cleric.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0095.a: "Maudits [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip] cupides !"
 pam_interactions_events.0095.a_same_faith: "En effet, qui d’autre que [ROOT.Char.GetFaith.HighGodName] pour répartir les royaumes ?"
