 secondary_recipient_must_have_superior_tt: "[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName|U] doit être sous un [superior|El] ou un [liege|El] qui est [ecclesiastical|El] ou [theocratic|El]"
 target_char_must_be_clerical_subordinate_tt: "En tant que [ruler|El] [ecclesiastical|El] ou [theocratic|El], [target_char.Custom('FR_le_Char_U_Pi')][target_char.GetShortUIName] doit être le [vassal|El], le [subordinate|El] direct ou indirect [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName]"
 bishop_excommunication_target_secular_tt: "[target_char.Custom('FR_le_Char_U_Pi')|U][target_char.GetShortUIName|U] doit soit :\n$EFFECT_LIST_BULLET$Être [vassal|El] direct ou indirect [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName]\n$EFFECT_LIST_BULLET$Être un [ruler|El] voisin ou dans la [clerical_region|El] [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName]\n$EFFECT_LIST_BULLET$Avoir un [court_chaplain|El] qui le [subordinate|El] direct ou indirect [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName]\n$EFFECT_LIST_BULLET$Avoir [excommunicator.Custom('FR_le_Char_U_Pi')][excommunicator.GetShortUIName] comme [court_chaplain|El], et [excommunicator.Custom('FR_le_Char_U_Pi')][excommunicator.GetShortUIName] ne pas avoir de [superior|El]\n$EFFECT_LIST_BULLET$Un [liege|El] direct ou indirect a [excommunicator.Custom('FR_le_Char_U_Pi')][excommunicator.GetShortUIName] comme [court_chaplain|El]"
 bishop_excommunication_target_courtier_tt: "Le [liege|El] [target_char.Custom('FR_du_Char_U_Pi')][target_char.GetShortUIName] doit être [excommunicator.Custom('FR_le_Char_U_Pi')][excommunicator.GetShortUIName], le [vassal|El] direct ou indirect [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName], un [ruler|El] voisin ou dans la [clerical_region|El] [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName]"
 bishop_excommunication_target_wanderer_tt: "[target_char.Custom('FR_le_Char_Pi')|U][target_char.GetTitledFirstName] doit être situé[target_char.Custom('FR_E')] dans le [realm|El] [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName], un [county|El] voisin ou la [clerical_region|El] [excommunicator.Custom('FR_du_Char_U_Pi')][excommunicator.GetShortUIName]"
 can_excommunicate_directly: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName|U] peut [excommunicate|El] [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName] directement"
 no_valid_excommunicator_tt: "Puisque votre [faith|El] n’a pas de [head_of_faith|El] [theocratic|El], [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName] ne peut être [excommunicated|El][secondary_recipient.Custom('FR_E')|E] que par un [ruler|El] [ecclesiastical|El] puissant qui soit :\n$EFFECT_LIST_BULLET$Est son [liege|El] direct ou indirect\n$EFFECT_LIST_BULLET$Est un [ruler|El] voisin ou a sa [realm_capital|El] dans sa [clerical_region|El]\n$EFFECT_LIST_BULLET$Est le [superior|El] direct ou indirect de son [court_chaplain|El]\n$EFFECT_LIST_BULLET$Est son [court_chaplain|El], et n’a pas de [superior|El]"
