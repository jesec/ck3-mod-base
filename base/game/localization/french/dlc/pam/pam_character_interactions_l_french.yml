 pam_interactions_events.0097.opening: "Mon enfant,"
 pam_interactions_events.0097.desc: "Votre requête est acceptée. Le poste de [target.GetName] est resté vacant pendant longtemps, tandis que ses [ROOT.Char.GetFaith.GetAdherentNamePlural] se retrouvaient sans guide spirituel. Ce n’est pas là une manière appropriée d’honorer [ROOT.Char.GetFaith.HighGodName].\n\nPortez ce titre avec humilité. Ce [title|El] vient de l’Église, et l’Église s’en souviendra."
 pam_interactions_events.0097.desc_holy_war: "Votre requête est acceptée et votre serment est consigné par écrit afin qu’il ne tombe pas dans l’oubli. [target.GetName] vous appartient, mais une partie reste encore soumise à ceux qui renient [ROOT.Char.GetFaith.HighGodName].\n\nAllez prendre ce que votre titre désigne déjà comme vous appartenant. Aucun [ROOT.Char.GetFaith.PriestNeuter] croyant ne remettra en cause votre guerre. Mais dans cinq ans, nous vous demanderons ce qu’il en est advenu. Un serment sans suite est un serment rompu."
