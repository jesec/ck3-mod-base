 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName], ô [actor.GetTitledFirstNameNoTooltip], si honteusement spolié[actor.Custom('FR_E')] !"
 pam_interactions_events.0020_threatened: "Renoncez aux mesures punitives, aux condamnations infâmes, à la violence injuste que vous exerceriez contre mes [secondary_recipient.GetFaith.HouseOfWorshipPlural] ! Gardez cette farouche résolution pour ce qui est à venir, car une prétention légitime sur [target.GetNameNoTier] est vôtre."
 pam_interactions_events.0020_offer_hook: "Votre promesse de favoriser [secondary_recipient.GetPrimaryTitle.GetNameNoTier] m’a poussé à agir et c’est ainsi que j’ai remis au goût du jour votre droit, si longtemps bafoué, de revendiquer [target.GetNameNoTier] !"
 pam_interactions_events.0020_indebted: "C[secondary_recipient.Custom('FR_EtEtte')] humble [Select_CString(secondary_recipient.IsFemale,'religieuse','religieux')] vous est redevable, c’est pourquoi j’ai cherché – et trouvé – des preuves irréfutables que [target.GetNameNoTier] appartient légitimement à votre lignée et qu’on vous a refusé cette reconnaissance !"
 pam_interactions_events.0020: "Vous avez le droit de revendiquer [target.GetNameNoTier] : un droit ancestral qui relève de la divine providence ! J’ai fourni à votre Conseil les pièces justificatives correspondantes."
 pam_interactions_events.0020_end: "\n\n[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstNameRegnal] ne sera sans doute pas ravi[recipient.Custom('FR_E')] de cette révélation. Mais [secondary_recipient.GetFaith.FateGodName] se moque bien des objections des charlatans."
 pam_interactions_events.0020.a.low_zeal: "Et c’est ainsi que l’histoire est réécrite..."
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip] me revient en vertu du droit sacré !"
 pam_interactions_events.0020.a: "Je fais valoir mes droits. Maudit soit [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] a accordé une revendication [puppet_or_actor.Custom('FR_au_Char_U_Pi')][puppet_or_actor.GetShortUIName] sur [target.GetNameNoTier]"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName],"
 pam_interactions_events.0021: "Si votre destin était de régner sur [target.GetNameNoTier], pourquoi cela ne vous aurait-il pas été accordé par [secondary_recipient.GetFaith.HighGodName] comme droit de naissance ?\n\nJe ne vais pas offenser [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstNameRegnal], ni trahir des âmes mortelles comme la vôtre et la mienne en répandant des mensonges pour servir votre cause malfaisante.\n\nMéditez, dans la prière, sur votre conduite erronée."
 pam_interactions_events.0021.a: "Les murs [secondary_recipient.GetFaith.HouseOfWorship3] lui donnent un courage insensé !"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] a refusé la demande de revendication [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName] sur [target.GetNameNoTier]"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "Titulaire de ce qui m’appartient de droit,"
 pam_interactions_events.0022_shrimp: "Je ne suis peut-être qu’un[actor.Custom('FR_E')] simple [actor.GetTitleAsName|l], mais les [secondary_recipient.GetFaith.AltPriestTermPlural] [actor.GetFaith.GetAdherentNamePlural] ont découvert que ma lignée détenait un droit ancestral sur [target.GetName] dans son intégralité."
 pam_interactions_events.0022_shark: "[target.GetName] fait partie des titres conférés à ma lignée par [actor.GetFaith.HighGodName]. Il en a toujours été ainsi, mais cela était méconnu."
 pam_interactions_events.0022: "Les érudits savent depuis longtemps — et cela a été récemment démontré — que [target.GetName] m’appartient de plein droit et que je peux en revendiquer la propriété."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.Custom('FR_le_Char_Pi')|U][secondary_recipient.GetTitledFirstNameRegnal] a accordé son approbation sacrée à ma revendication. [secondary_recipient.GetPrimaryTitle.GetName|U] me soutient jusqu’au bout.\n\nJe commence à espérer et prier pour qu’un jour, je règne pleinement sur [target.GetNameNoTierNoTooltip]..."
 pam_interactions_events.0022.a: "Balivernes ! Une fausse revendication soutenue par [Select_CString(secondary_recipient.IsFemale,'une fausse religieuse','un faux religieux')] !"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "[Select_CString(secondary_recipient.IsFemale,'Sainte Mère','Saint Père')],"
 pam_interactions_events.0023_shrimp: "Si j’étais investi[actor.Custom('FR_E')] d’un droit légitime, ne pourrais-je pas diriger [target.GetName] avec plus de vertu que c[recipient.Custom('FR_EEtte')] misérable [recipient.GetFirstNameRegnal] ? Je vous en prie, permettez que la lumière [actor.GetFaith.HighGodNamePossessive] éclaire c[actor.Custom('FR_EEtte')] simple [actor.GetTitleAsName|l]."
 pam_interactions_events.0023_shark: "Par la volonté [actor.GetFaith.HighGodNamePossessive], je suis déjà [Select_CString(actor.IsFemale,'dame et protectrice','seigneur et protecteur')] de toutes sortes de terres et de peuples. Et pourtant, [target.GetName] se trouve au-delà de mon pays et de mes droits."
 pam_interactions_events.0023: "La confusion règne parmi les fidèles. Certains souhaitent sincèrement que je revendique le titre de [target.GetName], tandis que d’autres nient que j’aie le moindre droit à ce titre."
 pam_interactions_events.0023_end: "\n\nUne personne aussi érudite que vous pourrait certainement trouver les preuves nécessaires dans les archives historiques... et me fournir ainsi une revendication légitime sur [target.GetNameNoTierNoTooltip], n’est-ce pas ?"
 pam_interactions_events.0023.a: "Puisse [target.GetNameNoTierNoTooltip] être vôtre, [Select_CString(actor.IsFemale,'ma fille','mon fils')]."
 pam_interactions_events.0023.b: "Un[secondary_recipient.Custom('FR_E')] [secondary_recipient.GetTitleAsNameNoTooltip|l] devrait s’abstenir de proférer des mensonges."
