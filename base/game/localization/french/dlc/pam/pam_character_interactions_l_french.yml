 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal],"
 pam_interactions_events.0050.desc: "Dans [puppet_or_actor.GetFaith.ReligiousText], le mariage est une union sacrée. Dans le monde bien réel des hommes et des femmes... c’est une tout autre affaire.\n\nVous avez refusé de nous séparer, [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstName] et moi. Que sommes-nous censés faire de ce qui reste de ce désastre ?"
 pam_interactions_events.0050.aa: "C’est le désir charnel qui vous plonge dans la misère."
 pam_interactions_events.0050.aa.tt: "Apprenez à c[puppet_or_actor.Custom('FR_EEtte')] rustre sans amour à renoncer à toutes les exigences et aux désirs de la chair..."
 pam_interactions_events.0050.a: "Les chemins vers [recipient.GetFaith.PositiveAfterLife] ? L’amour et la dévotion."
 pam_interactions_events.0050.a.tt: "Grâce à vos conseils, ce couple au bord de la rupture trouvera le salut l’un auprès de l’autre."
 pam_interactions_events.0050.b: "Respectez les vœux que vous avez prononcés devant [recipient.GetFaith.GoodGodNames]."
 pam_interactions_events.0050.c: "Ce mépris pour le mariage sacré est un blasphème !"
 pam_interactions_events.0050.d: "Priez ensemble pour que [recipient.GetFaith.HighGodName] vous guide."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nC’est une union incestueuse, un accord contre nature auquel vous devez mettre fin !"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nNotre foi [puppet_or_actor.GetFaith.GetAdjective] m’oblige à chasser [Select_CString(secondary_recipient.IsFemale,'cette femme','cet homme')] de mon lit !"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nSachez qu’il y a des accusations concernant l’impuissance déplorable de [secondary_recipient.GetFirstNameNoTooltip]..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip] commet ouvertement une relation incestueuse, au mépris de notre union ! C’est une honte !"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip] ne m’a pas été fidèle, et tout le monde le sait !"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\nLa volonté [puppet_or_actor.GetFaith.HighGodNamePossessive] est que j’épouse un homme ! Et [secondary_recipient.GetFirstNameNoTooltip]... n’a plus rien d’un homme."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\nPar [puppet_or_actor.GetFaith.HighGodName] ! M[puppet_or_actor.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('secondary_recipient'))], cette créature démoniaque, a voulu me faire assassiner !"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip] pratique la polygamie ! Je ne suis qu’un[actor.Custom('FR_E')] parmi tant d’autres dans sa ribambelle d’[Select_CString(actor.IsFemale,'épouses','époux')]. Libérez-moi !"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\nCe n’est pas la volonté [puppet_or_actor.GetFaith.HighGodNamePossessive] que je partage mon lit avec [Select_CString(secondary_recipient.IsFemale,'une vile païenne','un vil païen')] [secondary_recipient.Custom('FR_FaithGenderedAdj')], n’est-ce pas ?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\nLa raison pour laquelle je vous demande cela n’est un secret pour personne ! [secondary_recipient.GetFirstNameNoTooltip], [Select_CString(secondary_recipient.IsFemale,'cette sorcière','ce démon')] lubrique, m’a trompé[puppet_or_actor.Custom('FR_E')]."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nNotre union n’a pas engendré d’enfants et il n’y a aucun espoir d’en avoir un jour."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\nVous arriverez bien à trouver une justification, par [puppet_or_actor.GetFaith.HighGodName] ! Même si ma haine envers [secondary_recipient.GetFirstNameNoTooltip] devrait suffire amplement."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nJe n’ai aucun élément qui puisse le justifier juridiquement... mais je compte sur votre maîtrise du droit religieux pour trouver un motif d’annulation."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\nC’est une union incestueuse, un accord contre nature auquel vous devez mettre fin !"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\nNotre foi [puppet_or_actor.GetFaith.GetAdjective] m’oblige à chasser [Select_CString(secondary_recipient.IsFemale,'cette femme','cet homme')] du lit de m[puppet_or_actor.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('secondary_actor'))] !"
