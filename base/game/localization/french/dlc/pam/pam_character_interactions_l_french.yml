 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\n[secondary_recipient.GetFirstNameNoTooltip] n’est que l’un[secondary_recipient.Custom('FR_E')] de vos nombreu[secondary_recipient.Custom('FR_XSes')] conjoint[secondary_recipient.Custom('FR_SEs')], une pratique que [actor.GetFaith.HighGodName] exècre. Ce n’est pas tolérable."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nDes gens instruits ont remonté votre lignée et celle de [secondary_recipient.GetFirstNameNoTooltip], et il se trouve que les deux sont trop proches. Leurs découvertes au sujet de votre consanguinité sont concluantes."
