 ecclesiastic_transfer_land_interaction_desc: "Gagnez des [vassals|El] ou des [titles|El] [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName] que vous [Concept('claim', 'revendiquez')|E] ou sur lesquels vous avez des droits de [titles|El] [de_jure|El], avec le soutien d’un [ruler|El] [ecclesiastical|El]"
