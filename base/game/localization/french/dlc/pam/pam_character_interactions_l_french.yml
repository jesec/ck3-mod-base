 pam_interactions_events.0100.t: "Fin de la bâtardise"
 pam_interactions_events.0100.desc: "Devant [ROOT.Char.GetFaith.HighGodName] et les fidèles réunis, [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName] a fait de moi un enfant légitime. Ce que ma naissance m’avait refusé, le clergé me l’a accordé à travers des rites sacrés et une plume.\n\nPlus personne ne me traitera de bâtard[ROOT.Char.Custom('FR_E')]."
