 pam_interactions_events.0090.opening: "Ô [puppet_or_actor.GetMotherFather|U] du pays,"
 pam_interactions_events.0090.desc: "Vraiment, [recipient.GetFaith.HighGodName] porte sur le [recipient.GetPrimaryTitle.GetNameNoTier] un regard plein de bienveillance ! Par votre proclamation, me voici fait[ROOT.Char.Custom('FR_E')] [recipient.GetTitleAsName|l] de cette terre, et les fidèles [recipient.GetFaith.GetAdherentNamePlural] s’en réjouissent.\n\nDe ma vie, je protégerai cette terre. Par mes lois, je la gouvernerai avec sagesse. Par mon épée et mon sceptre, j’exercerai fermement mon autorité. Et je prêterai une oreille attentive à vos conseils."
