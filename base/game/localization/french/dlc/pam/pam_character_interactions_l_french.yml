 pam_negotiate_land_possible_acceptance_tt: "Pour convaincre [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] de transférer un [title|El], [actor.Custom('FR_le_Char_U_Pi')][actor.GetShortUIName] exige soit :\n$BULLET_WITH_TAB$Un [hook|El][hook_i] sur [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName]\n$BULLET_WITH_TAB$Une [relation|El] d’[friend|El], de [disciple|El] ou d’[soulmate|El]\n$BULLET_WITH_TAB$Un [piety_level|El]@piety_icon! plus élevé\n$BULLET_WITH_TAB$Un [legitimacy_level|El]@legitimacy_icon! plus élevé\n$BULLET_WITH_TAB$#high [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! en [gold|El]@gold_icon! ou en [treasury|E]@treasury_icon!\n$BULLET_WITH_TAB$[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] est [intimidated|El][recipient.Custom('FR_E')|E]@intimidated_icon! et a moins de #high 25%#! de votre force militaire (en comptant les [allies|El])\n$BULLET_WITH_TAB$[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] est [cowed|El][recipient.Custom('FR_E')|E]@terrified_icon! et a moins de #high 50%#! de votre force militaire (en comptant les [allies|El])"
