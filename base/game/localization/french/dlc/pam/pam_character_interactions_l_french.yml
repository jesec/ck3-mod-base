 divorce_justified_tt: "L’un des éléments suivants :\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] a tenté de vous assassiner\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] est un[secondary_recipient.Custom('FR_E')] [GetTrait('adulterer').GetName( secondary_recipient )|l]\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] a une [fertility|El] très basse et votre mariage est sans enfant\n$EFFECT_LIST_BULLET$La [faith|El] [secondary_recipient.Custom('FR_du_Char_U_Pi')][secondary_recipient.GetShortUIName] est [faith_hostile|El] ou [faith_evil|El]\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] a plusieurs [spouses|El], malgré l’interdiction de la polygamie\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] est impuissant\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('FR_le_Char_U_Pi')|U][secondary_recipient.GetShortUIName] a une liaison [Concept('incestuous', 'incestueuse')|E]\n$EFFECT_LIST_BULLET$Votre mariage avec [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName] est [incestuous|El]\n$EFFECT_LIST_BULLET$Votre mariage avec [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName] est homosexuel et interdit"
