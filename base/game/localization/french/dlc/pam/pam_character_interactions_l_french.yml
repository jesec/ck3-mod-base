 pam_interactions_events.0070.t: "Une guerre pour [puppet_or_actor.Custom('FR_le_Char_L')][puppet_or_actor.GetTitleAsNameNoTooltip|l]"
 pam_interactions_events.0070.desc_intro_pagan: "« Aux vils païens de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_heretic: "« Aux hérétiques [recipient.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_infidel: "« Aux infidèles [recipient.GetFaith.GetReligion.GetAdherentNamePlural] de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_heathen: "« Aux païens de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc: "#EMP Damnation, désolation – la mort par l’épée !#! » s’écrie [puppet_or_actor.Custom('FR_le_Char_Pi')][puppet_or_actor.GetTitledFirstNameRegnal], et son message est transmis aux masses inquiètes de [secondary_recipient.GetPrimaryTitle.GetNameNoTier].\n\n« Levez l’étendard sacré [ROOT.Char.GetFaith.HighGodNameAlternatePossessive], [ROOT.Char.GetTitledFirstName] ! Je vous appelle à chasser [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] des terres de [target.GetNameNoTierNoTooltip] et à jeter ces [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] dans les flammes [ROOT.Char.GetFaith.NegativeAfterLife3] ! »\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "Il est bien vrai que [puppet_or_actor.Custom('FR_le_Char_L')][puppet_or_actor.GetTitleAsNameNoTooltip|l] aspire à étendre la domination [puppet_or_actor.GetFaith.HighGodNamePossessive] ! [puppet_or_actor.Custom('FR_IlElle')|U] jure de partir en guerre en personne et de mettre ses forces à ma disposition."
 pam_interactions_events.0070.desc_outro_funding_war: "Ces exigences s’accompagnent d’une récompense financière : [puppet_or_actor.Custom('FR_le_Char_L')][puppet_or_actor.GetTitleAsNameNoTooltip|l] promet un coffre de guerre plein, afin que ce ne soit pas uniquement la foi qui anime mes [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]."
 pam_interactions_events.0070.a: "« [ROOT.Char.GetFaith.WarGodName] est à nos côtés ! #EMP Aux armes !#! »"
 pam_interactions_events.0070.b: "Laissons le peuple [recipient.Custom('FR_du_Char_Pi')][recipient.GetTitledFirstNameNoTooltip] en paix."
 cultural_acceptance_gain_refused_incited_holy_war: "Un dirigeant laïc a empêché qu’une guerre sainte n’éclate"
 pam_interactions_events.0071.t: "Conquête de [target.GetNameNoTierNoTooltip] par [ROOT.Char.GetFaith.HighGodName]"
 pam_interactions_events.0071.desc_intro: "Dans les cris de guerre, les chants et les prières qui précèdent la victoire, la parole sacrée [ROOT.Char.GetFaith.HighGodNamePossessive] parvient jusqu’aux [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] et à leur [target.GetTierAsNameNoTooltip] ! Depuis [ROOT.Char.GetFaith.HouseOfWorship] de [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier], [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstName] proclame la guerre sainte contre"
 pam_interactions_events.0071.desc_intro_pagan: "les païens de [recipient.GetPrimaryTitle.GetName].\n\nTels des bêtes sauvages, [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] et ses [recipient.GetCulture.GetCollectiveNoun] se disperseront sans aucun doute face à l’arrivée légitime de l’armée [secondary_recipient.GetFaith.GetReligion.GetAdjective] de [secondary_recipient.GetPrimaryTitle.GetNameNoTier] !"
 pam_interactions_events.0071.desc_intro_heretic: "les hérétiques de [recipient.GetPrimaryTitle.GetName].\n\nDans un immense flot de sang, [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] et ses sales [recipient.GetFaith.GetAdherentNamePlural] seront balayés de ces terres ! Maintenant et pour toujours, contre ceux qui corrompent la parole [ROOT.Char.GetFaith.HighGodNamePossessive] !"
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.Custom('FR_le_Char_L')][recipient.GetTitleAsName] de [recipient.GetPrimaryTitle.GetNameNoTier].\n\nLes infidèles [recipient.GetFaith.GetReligion.GetAdherentNamePlural], comme tous ceux qui ont échoué auparavant face au djihad du Prophète, seront bientôt contraints de se soumettre !"
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.Custom('FR_le_Char_L')][recipient.GetTitleAsName] de [recipient.GetPrimaryTitle.GetNameNoTier].\n\nAu nom [ROOT.Char.GetFaith.WarGodNamePossessive], [secondary_recipient.Custom('FR_IlElle')] écrasera les armées païennes ! Et tous les fidèles [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] observeront la scène, émerveillés."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nMes propres troupes ne resteront pas les bras croisés ! Elles envahiront les terres de [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] aux côtés des [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l] [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nDe [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] et d’ailleurs, des guerriers fervents se rassemblent sous la bannière [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nSeule la faveur [ROOT.Char.GetFaith.HighGodNamePossessive] assure la victoire [secondary_recipient.Custom('FR_du_Char_Pi')][secondary_recipient.GetTitledFirstNameNoTooltip]. Mais mon généreux don me garantit son aplomb."
 pam_interactions_events.0071.a: "Que ceux qui mourront pour cette cause soient à jamais enviés."
