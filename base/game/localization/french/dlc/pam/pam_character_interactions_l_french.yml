 pam_interactions_events.0060.t: "Justifier le divorce"
 pam_interactions_events.0060.desc: "[puppet_or_actor.Custom('FR_le_Char_Pi')|U][puppet_or_actor.GetTitledFirstName] souhaite mettre fin à son mariage, mais malgré toute la haine qui l’oppose [secondary_recipient.Custom('FR_au_Char_Pi')][secondary_recipient.GetTitledFirstName]... leur union a été célébrée devant [puppet_or_actor.GetFaith.HighGodName]. Et ils n’ont aucune raison valable d’y mettre fin.\n\nJe dois donc inventer un mensonge qui justifie la nullité de leur mariage. Un blasphème qui mériterait peut-être une récompense..."
 pam_interactions_events.0060.a: "Cette séparation mérite... un véritable scandale."
 pam_interactions_events.0060.a.tt: "Je ne vais pas inventer de nobles mensonges, mais lancer de viles accusations contre [secondary_recipient.GetFirstNameNoTooltip] ! Sa famille sera contrainte de prendre sa défense... et celle de [puppet_or_actor.GetFirstNameNoTooltip] de [puppet_or_actor.Custom('FR_LeLa')] défendre [puppet_or_actor.Custom('FR_LuiElle')]."
 pam_interactions_events.0060.b: "Que [puppet_or_actor.Custom('FR_le_Char_L')][puppet_or_actor.GetTitleAsNameNoTooltip|l] fasse don de terres aux fidèles."
 pam_interactions_events.0060.b.tt: "Céder un titre à l’ordre – [lease_order.GetName] – allégera ce fardeau qui pèse sur nos âmes..."
 pam_interactions_events.0060.c: "Une faveur qui en mérite une en retour."
 pam_interactions_events.0060.d: "Affirmer que [secondary_recipient.GetFirstNameNoTooltip] s’est engagé[secondary_recipient.Custom('FR_E')] dans les ordres."
 pam_interactions_events.0060.d.tt: "[secondary_recipient.Custom('FR_SilSielle')|U] a prononcé ses vœux au sein de [divorcee_joining_order.GetName] il y a longtemps, ce mariage doit être annulé ! Et après cela, qui mieux que moi pour guider [secondary_recipient.GetFirstNameNoTooltip] dans sa nouvelle vie ?"
 pam_interactions_events.0060.e: "Ne rien exiger de ce malheureux couple"
 divorce_cleric_perspective_tt: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName] divorce [secondary_recipient.Custom('FR_du_Char_U_Pi')][secondary_recipient.GetShortUIName]"
