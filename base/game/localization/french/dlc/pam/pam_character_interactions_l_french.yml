 pam_interactions_events.0091.opening: "[Select_CString(ROOT.Char.IsFemale,'Ma bienfaitrice','Mon bienfaiteur')],"
 pam_interactions_events.0091.desc_hook_theocrat: "Votre intercession m’impose une grande responsabilité. Dans une main, je tiens la houlette du berger ; de l’autre, c’est la main même [recipient.GetFaith.HighGodNamePossessive] qui me tient fermement. Ainsi soit-il, car je suis Son fidèle serviteur ! La terre de [target.GetNameNoTier] est un don magnifique, et je suis son humble et reconnaissant[recipient.Custom('FR_E')] bénéficiaire.\n\nQue cela soit proclamé partout : par la volonté [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitledFirstNameRegnal], ce territoire appartient au clergé !"
 pam_interactions_events.0091.desc_hook: "Votre intercession m’impose une grande responsabilité. Dans une main, je tiens le sceptre de règne ; de l’autre, c’est la main même [recipient.GetFaith.HighGodNamePossessive] qui me tient fermement. Ainsi soit-il. La terre de [target.GetNameNoTier] est un don magnifique, et je suis son humble et reconnaissant[ROOT.Char.Custom('FR_E')] bénéficiaire.\n\nQue cela soit proclamé partout : par la volonté [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitledFirstNameRegnal], ce territoire est mien !"
 pam_interactions_events.0091.desc: "Votre intercession est une bénédiction plus grande que je n’aurais pu l’imaginer. L’influence [ROOT.Char.Custom('FR_DuDela')] Saint[ROOT.Char.Custom('FR_E')]-[ROOT.Char.GetMotherFather|U] est vaste, et sa bienveillance aussi, grâce [recipient.GetFaith.HighGodName2] !\n\n[target.GetName] est une terre noble. Je porterai ce titre et je régnerai sur les [recipient.GetFaith.GetAdherentNamePlural] avec humilité et grâce."
 pam_interactions_events.0091.a: "Je vais suivre [target.GetNameNoTierNoTooltip] avec enthousiasme."
 pam_interactions_events.0092.opening_theocratic: "Révérend [ROOT.Char.GetFaith.PriestNeuter|l],"
 pam_interactions_events.0092.opening: "Mon enfant [ROOT.Char.Custom('GetTitleTierAdjective')],"
 pam_interactions_events.0092.desc_hook: "Tout en priant pour l’immense cadeau que [recipient.GetFaith.HighGodName] et Ses prélats vous ont offert, demandez-vous bien si vous êtes véritablement digne d’un tel titre. Peut-être vous reste-t-il encore des actes de dévotion à accomplir.\n\nJe me tiens à votre disposition pour vous conseiller à cet égard. Nous devons veiller à ce que votre gouvernance de [target.GetNameNoTierNoTooltip] satisfasse et serve [recipient.GetFaith.HighGodName]."
 pam_interactions_events.0092.desc: "Je me réjouis de la proclamation de l’illustre [target.GetTierAsNameNoTooltip] !\n\nGuidé par mes prières, j’ai suivi avec un intérêt tout particulier vos progrès. Je vous demande simplement de bien gouverner, et que votre règne soit une bénédiction pour les [recipient.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTier]."
 pam_interactions_events.0092.a: "Un mandat direct [recipient.GetFaith.PositiveAfterLife3] !"
