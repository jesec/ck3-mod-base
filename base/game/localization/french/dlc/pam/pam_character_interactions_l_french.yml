 ecclesiastical_de_jure_shifting_grant_interaction_notification: "Tout comme [Select_CString(puppet_or_actor.IsFemale,'une mère','un père')] veille sur son enfant bien-aimé, je souhaite que [puppet_or_actor.GetPrimaryTitle.GetName] prenne soin de [target.GetName] pour l’éternité. Décrétons ce lien légal et sacré."
 pam_interactions_events.0096.opening: "Judicieuse est la main [ROOT.Char.GetFaith.HighGodNamePossessive] !"
 pam_interactions_events.0096.desc: "La séparation de [target.GetNameNoTier] et de [former_de_jure_liege.GetNameNoTier] est une sage décision !\n\nQu’il en soit ainsi, comme vous l’avez décidé : à travers les âges, [de_jure_master.GetPrimaryTitle.GetNameNoTier] servira de contrefort reliant [target.GetTierAsNameNoTooltip|l] et [ROOT.Char.GetFaith.PositiveAfterLife], afin que les fidèles [ROOT.Char.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTooltip] puissent être à tout jamais guidés vers la lumière [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nVoilà ce que j’intégrerai dans mon serment sacré [de_jure_master.Custom('GetTitleTierAdjective')]."
 pam_interactions_events.0096.a: "Puisse cette union être harmonieuse, en effet."
