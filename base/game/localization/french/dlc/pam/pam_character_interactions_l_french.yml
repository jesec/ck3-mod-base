 pam_interactions_events.0072.opening: "Vil[puppet_or_actor.Custom('FR_E')] [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)],"
 pam_interactions_events.0072.desc_joined_war: "Je viens à vous aujourd’hui. En missionnaire, pour apporter la lumière à vos ténèbres. En [puppet_or_actor.GetMotherFather], pour vous infliger le châtiment.\n\nEt aux côtés de votre [puppet_or_actor.GetMotherFather] vient un guerrier [puppet_or_actor.GetFaith.HighGodNamePossessive], [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstName]. Ses armées libéreront [target.GetNameNoTier] du mal qui l’accable."
 pam_interactions_events.0072.desc: "Il est trop tard pour vous. Nulle repentance ne vous est plus permise.\n\nContemplez comment les terres corrompues de [recipient.GetPrimaryTitle.GetNameNoTier] seront ravagées ! Comment les serviteurs [puppet_or_actor.GetFaith.DevilNamePossessive] seront massacrés ! J’ai poussé les fidèles à prendre les armes et envoyé [secondary_recipient.Custom('FR_le_Char_Pi')][secondary_recipient.GetTitledFirstName] pour vous anéantir !"
 pam_interactions_events.0072.a: "Comme cela est cruel de la part [puppet_or_actor.GetFaith.HighGodNamePossessive] de nous livrer à de telles personnes !"
 incite_holy_war_past_tense_tt: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName] a poussé [secondary_recipient.Custom('FR_le_Char_U_Pi')][secondary_recipient.GetShortUIName] à déclarer la [holy_war|El] pour [target.GetName]"
 incite_holy_war_joined_tt: "[puppet_or_actor.Custom('FR_le_Char_U_Pi')|U][puppet_or_actor.GetShortUIName] a rejoint la [holy_war|El] contre [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName]"
