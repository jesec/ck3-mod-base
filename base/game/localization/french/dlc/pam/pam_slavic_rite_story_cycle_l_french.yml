l_french:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "L’écriture glagolitique"
 slavic_rite.1000.desc: "« Poursuivez, frère [greek_preacher.GetFirstName] », dit mon [court_chaplain.GetActiveCouncilTask.GetPositionName|l] en introduisant [Select_CString(greek_preacher.IsFemale,'la prêtresse','le prêtre')] du rite [GetRiteByKey('byzantine_rite').GetAdherentName].\n\n« Que votre pays soit béni, ô [ROOT.Char.GetTitleAsNameNoTooltip]. Mes frères avancent bien dans la création d’une écriture destinée à votre peuple. Hélas, nous travaillons sous l’ombre et la menace des prêtres [GetRiteByKey('carolingian_christianity').GetAdherentNamePlural], qui espèrent étendre leur autorité ecclésiastique à vos terres. [Glossary('Cyrille et Méthode', 'CYRIL_AND_METHODIUS_GLOSS')] m’ont demandé de solliciter davantage de temps afin de mettre au point une stratégie pour éviter les conflits et trouver une voie diplomatique. »"
 slavic_rite.1000.a: "Nous avons tellement progressé. Je compte sur eux."
 slavic_rite.1000.a_tt: "[Glossary( 'Cyrille et Méthode', 'CYRIL_AND_METHODIUS_GLOSS' )], les frères qui ont mis au point un nouvel alphabet slave, vous informeront très prochainement de la prochaine étape pour diffuser un nouveau [rite|El] [court_chaplain.GetFaith.GetAdherentName] dans votre pays."
 slavic_rite.1000.b: "Mieux vaut abandonner cette voie que de ressentir la fureur [GetRiteByKey('carolingian_christianity').GetAdjectiveNoTooltip]."
 slavic_rite.1000.b_tt: "Tous les efforts visant à développer une écriture locale et à établir un nouveau [rite|El] par [Glossary( 'Cyrille et Méthode', 'CYRIL_AND_METHODIUS_GLOSS' )] sont abandonnés."
 slavic_rite.1000.b_tt_2: "L’[story_cycle|El] de $story_slavic_rite|l$ prend fin."
 # Travel to Rome Initiation
 slavic_rite.0001.t: "La mission morave"
 slavic_rite.0001.desc: "Je suis rassuré[ROOT.Char.Custom('FR_E')] de retrouver [Glossary( 'Cyrille et Méthode', 'CYRIL_AND_METHODIUS_GLOSS' )], et j’espère qu’ils viennent avec un moyen de contrer l’emprise [GetRiteByKey('carolingian_christianity').GetAdjective].\n\n« Noble [ROOT.Char.GetTitleAsNameNoTooltip|l], il semblerait que le seul moyen de garantir la survie du culte de votre peuple soit d’entreprendre le voyage jusqu’à [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] et d’y recevoir la bénédiction [pope_scope.Custom('FR_du_Char_Pi')][pope_scope.GetTitledFirstName]. »\n\nPuisse l’autorité du trône de saint Pierre contenir l’arrogance des [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip] ; mais ceux-ci ne paraissent reconnaître d’autre autorité que la leur."
 slavic_rite.0001.a: "Dieu vous garde !"
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName] et [methodius_scope.GetFirstName] entament leur voyage. S’il se déroule comme prévu, leur retour donnera naissance à un nouveau mouvement religieux dans votre pays."
 slavic_rite.0001.b: "Je ne vous laisserai pas repartir les mains vides."
 slavic_rite_travel_toast_title: "Cyrille et Méthode commencent leur voyage"
 slavic_rite_moravian_mission_gift_sent_tooltip: "Un cadeau sera envoyé à [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. À leur retour, les frères vous informeront de la façon dont il a été accueilli."
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "Naissance du rite [methodius_scope.GetRite.GetAdherentName]"
 slavic_rite.0003.desc: "J’ai appris que [methodius_scope.GetFirstNameNoTooltip], avec l’aide [moravia_liege_scope.Custom('FR_du_Char_Pi')][moravia_liege_scope.GetTitledFirstNameNoTooltip], tentait de répandre une nouvelle pratique [methodius_scope.GetFaith.GetAdjectiveNoTooltip] dans les pays [moravia_liege_scope.GetCulture.GetCollectiveNounNoTooltip|l]. Mes érudits l’appellent [methodius_scope.GetRite.GetName|l].\n\nMalgré nos efforts antérieurs pour assimiler les autochtones, [methodius_scope.GetFirstNameNoTooltip] a obtenu [pope_scope.Custom('FR_du_Char_Pi')][pope_scope.GetTitledFirstName] l’autorisation d’essayer sur eux une nouvelle écriture."
 slavic_rite.0003.a: "Attendons de voir si ses méthodes portent leurs fruits."
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "Le rite [methodius_scope.GetRite.GetAdherentNameNoTooltip] de culture [ROOT.Char.GetCulture.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "Des nouvelles intéressantes sont parvenues à ma Cour tôt ce matin.\n\n[liege_scope.Custom('FR_le_Char_Pi')|U][liege_scope.GetTitledFirstNameNoTooltip] a autorisé [Select_CString(methodius_scope.IsFemale,'la prêtresse','le prêtre')] d’origine [methodius_scope.GetCulture.GetNameNoTooltip], [methodius_scope.GetFirstName], à continuer de diffuser sa pratique profane sur nos terres. La foi [methodius_scope.GetFaith.GetAdjectiveNoTooltip] sera organisée de manière à faciliter la façon de vivre [ROOT.Char.GetCulture.GetNameNoTooltip] pour ceux qui souhaitent l’adopter.\n\nCes derniers temps, on a fait beaucoup trop de bruit autour de la nature spirituelle de nos traditions. Je vais peut-être devoir réfléchir à la manière de gérer tout cela."
 slavic_rite.0004.desc_chalcedonian: "Notre [liege_scope.GetTitleAsNameNoTooltip|l] a décrété l’instauration et la diffusion du [methodius_scope.GetRite.GetNameNoTooltip|l] dans tout son pays. D’après mes érudits, il s’agit d’une manière plus commode de pratiquer la foi [methodius_scope.GetFaith.GetAdjectiveNoTooltip] sans pour autant nuire à notre mode de vie.\n\nCela mérite peut-être qu’on s’y intéresse ?"
 slavic_rite.0004.a_pagan: "Les coutumes de nos ancêtres sont supérieures."
 slavic_rite.0004.b_pagan: "Il y a peut-être une part de vérité là-dedans..."
 slavic_rite.0004.a_chalcedonian: "Je n’ai aucune envie de m’écarter du droit chemin."
 slavic_rite.0004.b_chalcedonian: "Faisons venir les érudits."
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "Un voyage doux-amer"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName] se tient devant moi, seul[methodius_scope.Custom('FR_E')] cette fois-ci, de retour de [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Lorsque je l’interroge au sujet de [cyril_scope.GetFirstName], son visage s’assombrit.\n\n« La bonne nouvelle, ô [Select_CString(ROOT.Char.IsFemale,'miséricordieuse','miséricordieux')] [ROOT.Char.GetTitleAsNameNoTooltip|l], c’est que [pope_scope.Custom('FR_le_Char_Pi')][pope_scope.GetTitledFirstName] nous a donné sa bénédiction pour répandre la foi parmi les [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] et partout dans votre pays, selon nos propres méthodes et écrits. » [methodius_scope.Custom('FR_IlElle')|U] prend une profonde inspiration. « Mais malheureusement, j’ai dû laisser mon frère là-bas. Je ferai tout mon possible pour que tout ce que nous avons fait n’ait pas été vain. Puissions-nous recevoir l’aide [ROOT.Char.GetFaith.HighGodNamePossessive]. »"
 slavic_rite.0005.a: "Ensemble, nous rendrons votre frère fier !"
 slavic_rite.0005.b: "C’est le moins que je puisse faire pour honorer sa mémoire."
 pam_cyril_statue_modifier: "En mémoire de Cyrille"
 pam_brothers_travel_safety_modifier: "Voyage prudent"
 slavic_rite.0005.c: "Bonne chance dans votre mission."
 slavic_rite_mass_conversion_tooltip: "Un [great_project|El] de conversion de masse est prévu pour tous les [duchies|El] de [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] dans le but de convertir leurs [counties|El] au rite [methodius_scope.GetRite.GetAdherentName]"
 slavic_rite_moravian_mission_gift_received_tooltip: "Votre cadeau à [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a été reçu avec gratitude."
 slavic_rite_ecclesiastical_title_creation_tooltip: "L’$slavic_rite_ecclesiastical_title$ est créé et [methodius_scope.GetFirstName] devient son premier [holder|El]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ de Moravie"
 slavic_rite_ecclesiastical_title_name: "Moravie"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "Fin de la mission morave"
 slavic_rite.0006.desc.brothers_are_dead: "Depuis la mort des frères [Glossary( 'Cyrille et Méthode', 'CYRIL_AND_METHODIUS_GLOSS' )], personne n’est assez doué pour poursuivre leur œuvre liturgique. Nous devons développer notre propre approche pour parvenir à la conversion totale de mon peuple – si tant est que nous le souhaitions encore."
 slavic_rite.0006.desc.no_longer_christian: "J’ai entrevu le chemin de la gloire. Ce qui me poussait autrefois à apporter le bonheur à mon peuple et à ma Maison me semble désormais tout à fait insignifiant. Le destin qui leur était réservé était différent de celui que j’aurais souhaité pour eux. Heureusement, le bon chemin nous a été montré par [ROOT.Char.GetFaith.HighGodName]."
 slavic_rite.0006.desc.no_longer_king: "Les événements récents et la perte de ma position influente m’ont appris à ne pas assumer plus de responsabilités que je ne suis capable d’en gérer. Nous ne pouvons plus maintenir la mission en Moravie. Peut-être pourrons-nous la reprendre sous d’autres conditions, dès que nous nous serons rétablis.\n\nD’ici là, il faut protéger le pays afin qu’il ne subisse pas le même sort."
 slavic_rite.0006.desc.no_longer_slav: "Mes ancêtres ne seraient sans doute pas fiers de ce que je suis devenu[ROOT.Char.Custom('FR_E')].\n\nMais qu’il en soit ainsi. Ce n’est pas à eux de décider comment régner sur le pays, mais à moi seul[ROOT.Char.Custom('FR_E')]."
 slavic_rite.0006.a.brothers_are_dead: "Ça ne devait pas se passer comme ça..."
 slavic_rite.0006.a.no_longer_christian: "Louons [ROOT.Char.GetFaith.HighGodName] !"
 slavic_rite.0006.a.no_longer_king: "Je ne peux plus me permettre de telles ambitions."
 slavic_rite.0006.a.no_longer_slav: "L’alphabet glagolitique était un fardeau pour mon peuple."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ pour évangéliser le pays n’a plus cours."
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "Un pays uni par [ROOT.Char.GetFaith.HighGodName]"
 slavic_rite.0007.desc: "« #italic ... afin que, sous son règne, nous menions une vie paisible\ndans la dévotion à Dieu et dans la dignité.\n\nCar c’est à toi qu’appartiennent le règne, la puissance et la gloire,\nmaintenant et pour toujours, dans les siècles des siècles. Amen.#! »\n\nLorsque [archdiocese_holder.Custom('FR_le_Char_Pi')][archdiocese_holder.GetTitledFirstName] termine la prière, un sentiment de béatitude envahit mon âme. Notre mission, qui consiste à posséder notre propre tradition céleste, s’étend aux quatre coins de mon pays et s’avère victorieuse. Que [ROOT.Char.GetFaith.HighGodName] bénisse ma Maison, [Glossary( 'Cyrille et Méthode', 'CYRIL_AND_METHODIUS_GLOSS' )], ainsi que les bonnes gens de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 slavic_rite.0007.a: "Nous étions destinés à emprunter la voie sacrée."
 pam_slavic_rite_clergy_opinion_modifier: "Monarque béni"
 slavic_rite.0007.b: "Il n’y a rien que mon peuple ne puisse supporter."
 pam_slavic_rite_culture_opinion_modifier: "Monarque du peuple"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "Prédicateurs clandestins"
 slavic_rite.0010.desc: "Escortés par mon chapelain, [court_chaplain.Custom('FR_le_Char_Pi')][court_chaplain.GetTitledFirstName], [Select_CString(undercover_preacher.IsFemale,'une prêtresse','un prêtre')] d’origine [undercover_preacher.GetCulture.GetNameNoTooltip] et sa suite de prédicateurs font irruption dans mes salles avec un sans gêne certain.\n\n« Salutations, ô [ROOT.Char.GetTitleAsNameNoTooltip|l]. Nous avons découvert ces intrus qui prêchent la Parole [ROOT.Char.GetFaith.HighGodNamePossessive] sans l’autorisation [court_chaplain_superior.Custom('FR_du_Char_Pi')][court_chaplain_superior.GetTitledFirstName] ni la vôtre. » [undercover_preacher.Custom('FR_IlElle')|U] s’interrompt pour dévisager ces étrangers de la tête aux pieds, avant de se tourner à nouveau vers moi.\n\n« On dit qu’ils se cachaient depuis un certain temps déjà, à chercher à séduire et à souiller les âmes de vos sujets innocents. Comment souhaitez-vous que nous procédions à leur égard ? »"
 slavic_rite.0010.a: "Va-t’en et ne reviens plus jamais dans mon pays."
 slavic_rite.0010.b: "Nos avertissements précédents n’ont manifestement pas suffi."
 slavic_rite.0010.c: "Vous n’avez pas à subir la déception de vos maîtres."
 slavic_rite.0010.c.success: "[undercover_preacher.Custom('FR_IlElle')|U] a hâte de commencer une nouvelle vie à votre Cour"
 slavic_rite.0010.c.failure: "[undercover_preacher.Custom('FR_IlElle')|U] n’est pas persuadé[undercover_preacher.Custom('FR_E')]"
 preacher_recruited.t: "Prédicateur recruté"
 preacher_left.t: "Prédicateur parti"
 # 0020
 slavic_rite.0020.t: "Subvention pour une bonne cause"
 slavic_rite.0020.desc: "« Ils ne veulent pas exploiter les autochtones, [ROOT.Char.Custom('FR_MonseigneurMadame')|U]. Les prédicateurs itinérants [court_chaplain_superior.Custom('FR_du_Char_Pi')][court_chaplain_superior.GetTitledFirstName] font preuve d’une grande considération à cet égard. Ils ont même souhaité que je vous parle, ce qui témoigne d’une humilité louable. Une confirmation faciliterait grandement tous leurs efforts, tant pour eux que pour votre peuple. »\n\nLes efforts déployés par [court_chaplain.Custom('FR_le_Char_Pi')][court_chaplain.GetTitledFirstName] pour me convaincre au nom d’autrui sont remarquables, mais je ne peux m’empêcher de me demander s’il ne vaudrait pas mieux qu’[court_chaplain.Custom('FR_IlElle')] se consacre entièrement à aider mon peuple à dépasser ses anciennes traditions.\n\n« J’ai le sentiment que c’est la façon [ROOT.Char.GetFaith.HighGodNamePossessive] de vous offrir une occasion de vous rapprocher. »"
 slavic_rite.0020.a: "Plus vite nous libérerons mon peuple de l’impiété, mieux ce sera."
 pam_slavic_rite_great_project_speed_modifier: "Projet de conversion financé"
 slavic_rite.0020.b: "C’est tout ce que nous pouvons nous permettre."
 slavic_rite.0020.c: "En aucun cas."
 # 0030
 slavic_rite.0030.t: "Un débat entre l’Orient et l’Occident"
 slavic_rite.0030.desc: "Une douce brise souffle à travers le feuillage du jardin du monastère, tandis que deux ecclésiastiques invités [court_chaplain_superior.Custom('FR_du_Char_Pi')][court_chaplain_superior.GetTitledFirstName] s’engagent dans un débat. L’un d’eux est vêtu selon les coutumes orientales, l’autre selon les coutumes occidentales. Leurs voix, d’abord humbles, gagnent peu à peu en assurance et en fougue.\n\nIls discutent de nombreuses questions liturgiques, échangent sur des controverses savantes et des arguments fascinants, et chaque phrase renforce mon intérêt.\n\nPlus qu’une simple conversation, c’est le symbole d’une rivalité entre deux mondes qui révèle une harmonie fragile – ou une fracture plus profonde."
 slavic_rite.0030.a: "[Select_CString(visiting_byzantine_clergy.IsFemale,'La religieuse','Le religieux')] d’origine [visiting_byzantine_clergy.GetCulture.GetNameNoTooltip] est très convaincant[visiting_byzantine_clergy.Custom('FR_E')]."
 slavic_rite.0030.b: "Les arguments [visiting_carolingian_clergy.Custom('FR_du_Char_Pi')][visiting_carolingian_clergy.GetTitledFirstNameNoTooltip] ont quelque chose de fascinant."
 slavic_rite.0030.c: "La connaissance, c’est la connaissance – je suis d’accord avec les deux."
 slavic_rite.0030.d: "Nos méthodes sont supérieures à ces principes ancestraux."
