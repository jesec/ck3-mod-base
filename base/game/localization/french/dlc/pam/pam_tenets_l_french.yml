 pam_luke_1_42_english: "Tu es bénie entre les femmes, et le fruit de tes entrailles est béni."
 pam_luke_1_79_english: "Pour éclairer ceux qui sont assis dans les ténèbres et dans l’ombre de la mort, pour guider nos pas sur le chemin de la paix."
 pam_colossians_3_15_english: "Et que la paix du Christ, à laquelle vous avez été appelés pour former un seul corps, règne dans vos cœurs. Et soyez reconnaissants."
 pam_matthew_5_9_english: "Heureux les artisans de paix, car ils seront appelés fils de Dieu."
 pam_philippians_4_21_english: "Saluez tous les saints en Jésus Christ. Les frères qui sont avec moi vous saluent."
 pam_hebrews_12_1_english: "Nous donc aussi, puisque nous sommes entourés d’une si grande nuée de témoins, rejetons tout fardeau, et le péché qui nous encombre si facilement, et courons avec endurance l’épreuve qui nous est proposée."
 pam_acts_7_59_english: "Ils lapidaient Étienne, qui priait et disait : « Seigneur Jésus, reçois mon esprit. »"
 pam_luke_22_19_english: "Puis, ayant pris du pain et rendu grâce, il le rompit et le leur donna, en disant : « Ceci est mon corps, qui est donné pour vous. Faites cela en mémoire de moi. »"
 pam_1_corinthians_1_10_english: "Je vous exhorte, frères et sœurs, au nom de notre Seigneur Jésus Christ, à tenir un même langage, et à ne point avoir de divisions parmi vous, mais à être parfaitement unis dans un même esprit et dans un même sentiment."
 pam_1_corinthians_10_16_english: "La coupe de bénédiction que nous bénissons, n’est-elle pas communion au sang du Christ ? Le pain que nous rompons, n’est-il pas communion au corps du Christ ?"
 pam_1_corinthians_10_17_english: "Puisqu’il y a un seul pain, nous qui sommes plusieurs, nous formons un seul corps ; car nous participons tous à un même pain."
 pam_john_6_41_english: "Les Juifs récriminaient contre Jésus parce qu’il avait dit : « Je suis le pain qui est descendu du ciel. »"
 pam_1_thessalonians_5_16_20_english: "Soyez toujours joyeux. Priez sans relâche. Rendez grâce en toute circonstance, car c’est à votre égard la volonté de Dieu en Jésus Christ. N’éteignez pas l’Esprit. Ne méprisez pas les prophéties."
 pam_1_thessalonians_4_11_english: "Ayez à cœur de vivre calmement, de vous occuper de vos propres affaires et de travailler de vos mains comme nous vous l’avons ordonné."
 pam_proverbs_6_6_english: "Va vers la fourmi, paresseux ; considère ses voies, et deviens sage."
 pam_john_19_26_27_english: "Jésus, voyant sa mère, et auprès d’elle le disciple qu’il aimait, dit à sa mère : « Femme, voilà ton fils. » Puis il dit au disciple : « Voilà ta mère. » Dès ce moment, le disciple la prit chez lui."
 pam_isaiah_7_14_english: "C’est pourquoi le Seigneur lui-même vous donnera un signe : Voici que la vierge est enceinte, elle enfantera un fils, qu’elle appellera Emmanuel."
 pam_proverbs_31_20_english: "Elle tend la main au pauvre, elle tend la main à l’indigent."
 pam_revelation_12_1_english: "Un grand signe parut dans le ciel : une femme enveloppée du soleil, la lune sous les pieds, et une couronne de douze étoiles sur la tête."
 pam_acts_8_18_english: "Simon, voyant que l’Esprit était donné par l’imposition des mains des Apôtres, leur offrit de l’argent."
 pam_proverbs_21_20_english: "Dans la demeure du sage, de précieux trésors ; l’insensé les engloutit."
 pam_luke_16_11_english: "Si donc vous n’avez pas été dignes de confiance dans les richesses indues, qui vous confiera les véritables ?"
 pam_john_10_30_english: "Le Père et moi, nous sommes un."
 pam_john_1_1_english: "Au commencement était la Parole, et la Parole était avec Dieu, et la Parole était Dieu."
 pam_hebrews_1_3_english: "Il est le reflet de la gloire de Dieu et l’empreinte de son être, et soutenant toutes choses par sa parole puissante, a fait la purification des péchés et s’est assis à la droite de la Majesté divine dans les lieux très hauts."
 pam_acts_1_8_english: "Mais vous recevrez une force quand le Saint-Esprit viendra sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée et la Samarie, et jusqu’aux extrémités de la terre."
 pam_acts_2_4_english: "Tous furent remplis du Saint-Esprit, et se mirent à parler en d’autres langues, selon que l’Esprit leur donnait de s’exprimer."
 pam_acts_2_38_english: "Pierre leur dit : « Repentez-vous, et que chacun de vous soit baptisé au nom de Jésus-Christ, pour le pardon de ses péchés ; vous recevrez alors le don du Saint-Esprit. »"
 pam_2_macabees_12_44_english: "Car s’il n’avait pas espéré que ceux qui étaient morts ressusciteraient, il aurait été inutile et insensé de prier pour les morts."
 pam_matthew_12_25_english: "Tout royaume divisé contre lui-même est dévasté, et toute ville ou maison divisée contre elle-même ne peut subsister."
 pam_matthew_12_32_english: "Quiconque parle contre le Fils de l’homme, cela lui sera pardonné ; mais quiconque parle contre le Saint-Esprit, cela ne lui sera pardonné ni dans ce siècle ni dans le siècle à venir."
 pam_hebrews_12_29_english: "Car notre Dieu est un feu dévorant."
 pam_genesis_1_28_english: "Dieu les bénit et leur dit : « Soyez féconds et multipliez-vous, remplissez la terre et assujettissez-la. Soyez les maîtres des poissons de la mer, des oiseaux du ciel, et de tout animal qui se meut sur la terre. »"
 pam_matthew_19_5_english: "À cause de cela, l’homme quittera son père et sa mère, il s’attachera à sa femme, et tous deux deviendront une seule chair."
 pam_ephesians_4_3_6_english: "Vous efforçant de conserver l’unité de l’esprit par le lien de la paix : il y a un seul corps et un seul Esprit, comme aussi vous avez été appelés à une seule espérance par votre vocation ; il y a un seul Seigneur, une seule foi, un seul baptême."
 pam_ephesians_5_25_english: "Vous, les hommes, aimez votre femme comme le Christ a aimé l’Église et s’est livré lui-même pour elle."
 pam_matthew_16_18_english: "Et moi, je te dis que tu es Pierre, et que sur cette pierre je bâtirai mon Église, et que les portes du séjour des morts ne prévaudront point contre elle."
 pam_2_timothy_2_2_english: "Ce que tu m’as entendu dire en présence de nombreux témoins, confie-le à des hommes dignes de confiance, qui soient capables de l’enseigner aussi à d’autres."
 pam_titus_1_5_english: "Je t’ai laissé en Crète, afin que tu finisses de tout organiser, et que, selon mes instructions, tu établisses des anciens dans chaque ville."
 pam_james_5_16_english: "Confessez donc vos péchés les uns aux autres, et priez les uns pour les autres, afin d’être guéris. La prière du juste est très efficace."
 pam_1_john_1_9_english: "Si nous confessons nos péchés, lui qui est fidèle et juste nous pardonnera, et nous purifiera de toute iniquité."
 pam_john_20_23_english: "Ceux à qui vous pardonnerez les péchés, ils leur seront pardonnés ; et ceux à qui vous les retiendrez, ils leur seront retenus."
 pam_romans_5_12_english: "Nous savons que par un seul homme, le péché est entré dans le monde, et que par le péché est venue la mort ; et ainsi, la mort s’est étendue sur tous les hommes, puisque tous ont péché."
 pam_psalm_51_5_english: "Je suis né dans la faute, et ma mère m’a conçu dans le péché."
 pam_genesis_3_6_english: "La femme vit que l’arbre était bon à manger et agréable à la vue, et qu’il était précieux pour ouvrir l’intelligence ; elle prit de son fruit, et en mangea ; elle en donna aussi à son mari, qui était auprès d’elle, et il en mangea."
 # Celestial Hierarchy Tenet
 pam_hebrews_1_14_english: "Les anges ne sont-ils pas tous des esprits au service de Dieu, envoyés pour le service de ceux qui doivent avoir en héritage le salut ?"
 pam_psalm_91_11_english: "Car il ordonnera à ses anges de te garder dans toutes tes voies."
 pam_matthew_18_10_english: "Gardez-vous de mépriser un seul de ces petits ; car, je vous le dis, leurs anges dans les cieux voient continuellement la face de mon Père qui est dans les cieux."
 # Miles Christi Tenet
 pam_ephesians_6_11_english: "Revêtez l’équipement de combat donné par Dieu, afin de pouvoir tenir contre les ruses du diable."
 pam_2_timothy_2_3_english: "Prends ta part de souffrance comme un bon soldat du Christ Jésus."
 pam_1_timothy_6_12_english: "Mène le bon combat, celui de la foi, empare-toi de la vie éternelle à laquelle tu as été appelé, et pour laquelle tu as fait une belle confession en présence d’un grand nombre de témoins."
 # Scholasticism Tenet
 pam_proverbs_1_7_english: "La crainte du Seigneur est le commencement du savoir. Les insensés méprisent la sagesse et l’instruction."
 pam_colossians_2_3_english: "En qui se trouvent cachés tous les trésors de la sagesse et de la connaissance."
 pam_james_1_5_english: "Si l’un de vous manque de sagesse, qu’il la demande à Dieu, lui qui donne à tous sans réserve et sans faire de reproches : elle lui sera donnée."
 # Alexandrian Catechism Tenet
 pam_1_corinthians_1_30_english: "C’est grâce à Dieu, en effet, que vous êtes dans le Christ Jésus, lequel, de par Dieu, a été fait pour nous sagesse, justice et sanctification et rédemption."
 # Adoptionism Tenet
 pam_mark_1_11_english: "Et une voix fit entendre des cieux ces paroles : « Tu es mon Fils bien-aimé, en toi, je trouve ma joie. »"
 pam_romans_1_4_english: "Et, selon l’Esprit de sainteté, a été établi dans sa puissance de Fils de Dieu par sa résurrection d’entre les morts, lui, Jésus Christ, notre Seigneur."
 pam_acts_13_33_english: "Dieu l’a accomplie pour nous, leurs enfants, en ressuscitant Jésus, comme il est écrit au psaume deux : Tu es mon Fils ; aujourd’hui Je t’ai engendré."
 # Love Thy Neighbour Tenet
 pam_matthew_22_39_english: "Et le second, qui lui est semblable : Tu aimeras ton prochain comme toi-même."
 pam_luke_10_27_english: "Il répondit : « Tu aimeras le Seigneur, ton Dieu, de tout ton cœur, de toute ton âme, de toute ta force, et de toute ta pensée ; et ton prochain comme toi-même. »"
 pam_galatians_5_14_english: "Car toute la loi est accomplie dans l’unique parole que voici : Tu aimeras ton prochain comme toi-même."
 # Divine Liturgy Tenet
 pam_isaiah_6_3_english: "Ils criaient l’un à l’autre : « Saint ! Saint ! Saint, le Seigneur de l’univers ! Toute la terre est pleine de sa gloire. »"
 pam_psalm_134_2_english: "Élevez vos mains vers le sanctuaire, et bénissez l’Éternel !"
 pam_malachi_1_11_english: "Car du levant au couchant du soleil, mon nom est grand parmi les nations. En tout lieu, on brûle de l’encens en l’honneur de mon nom et on présente des offrandes pures, car mon nom est grand parmi les nations, – dit le Seigneur de l’univers."
 # Aniconism Tenet
 pam_exodus_20_4_english: "Tu ne feras aucune idole, aucune image de ce qui est là-haut dans les cieux, ou en bas sur la terre, ou dans les eaux sous la terre."
 # Armed Pilgrimages Tenet
 pam_matthew_16_24_english: "Alors Jésus dit à ses disciples : « Si quelqu’un veut marcher à ma suite, qu’il renonce à lui-même, qu’il prenne sa croix et qu’il me suive. »"
 # Communal Identity Tenet
 pam_1_peter_2_9_english: "Vous, au contraire, vous êtes une descendance choisie, un sacerdoce royal, une nation sainte, un peuple acquis, afin que vous annonciez les vertus de celui qui vous a appelés des ténèbres à son admirable lumière."
 # Consolamentum Tenet
 pam_2_timothy_4_7_english: "J’ai mené le bon combat, j’ai achevé ma course, j’ai gardé la foi."
 # Divine Marriage Tenet
 pam_tobit_8_7_english: "C’est non par convoitise, mais par fidélité que je prends cette parente pour épouse. Daigne me faire miséricorde, ainsi qu’à elle, et nous mener ensemble à un âge avancé et à avoir des enfants."
 # Gnosticism Tenet
 pam_1_corinthians_2_7_english: "Nous parlons de la sagesse de Dieu, mystérieuse et cachée, que Dieu, avant les siècles, avait destinée pour notre gloire."
 # Mendicant Preachers Tenet
 pam_matthew_10_9_english: "Ne vous procurez ni or ni argent, ni monnaie de cuivre à mettre dans vos ceintures."
 # Pentarchy Tenet
 pam_matthew_18_20_english: "En effet, quand deux ou trois sont réunis en mon nom, je suis là, au milieu d’eux."
 # Unrelenting Faith Tenet
 pam_hebrews_11_1_english: "La foi est une façon de posséder ce que l’on espère, un moyen de connaître des réalités qu’on ne voit pas."
 # Hesychasm Tenet
 pam_psalm_46_10_english: "Arrêtez, et sachez que je suis Dieu : Je domine sur les nations, je domine sur la terre."
 pam_matthew_6_6_english: "Mais quand tu pries, retire-toi dans une pièce, ferme la porte, et prie ton Père qui est présent dans le secret ; ton Père qui voit dans le secret te le rendra."
 pam_1_kings_19_12_english: "Et après le tremblement de terre, un feu, mais le Seigneur n’était pas dans ce feu. Et après ce feu, un murmure doux et léger."
 # Anachoresis Tenet
 pam_matthew_4_1_2_english: "Alors Jésus fut emmené par l’Esprit dans le désert, pour être tenté par le diable. Après avoir jeûné quarante jours et quarante nuits, il eut faim."
 pam_hebrews_11_38_english: "Eux dont le monde n’était pas digne, errant dans les déserts et les montagnes, dans les cavernes et les antres de la terre."
 pam_luke_5_16_english: "Mais lui se retirait dans les lieux déserts et priait"
 # Mortification of the Flesh Tenet
 pam_1_corinthians_9_27_english: "Mais je traite durement mon corps et je le tiens assujetti, de peur d’être moi-même rejeté, après avoir prêché aux autres."
 pam_galatians_5_24_english: "Ceux qui sont au Christ Jésus ont crucifié la chair avec ses passions et ses désirs."
 pam_romans_8_13_english: "Si vous vivez selon la chair, vous mourrez ; mais si, par l’Esprit vous faites mourir les actions du corps, vous vivrez."
 # Holy Myron Tenet
 pam_john_3_5_english: "Jésus répondit : « En vérité, en vérité, je te le dis : personne, à moins de naître de l’eau et de l’Esprit, ne peut entrer dans le royaume de Dieu. »"
 pam_acts_10_38_english: "Jésus de Nazareth, Dieu lui a donné l’onction d’Esprit Saint et de puissance. Là où il passait, il faisait le bien et guérissait tous ceux qui étaient sous le pouvoir du diable, car Dieu était avec lui."
 pam_2_corinthians_1_21_22_english: "Celui qui nous rend solides pour le Christ dans nos relations avec vous, celui qui nous a oints, c’est Dieu ; il nous a aussi marqués d’un sceau et a mis dans nos cœurs l’Esprit, première avance sur ses dons."
 # Khachkar Tenet
 pam_galatians_6_14_english: "Que je ne me vante jamais d’autre chose que de la croix de notre Seigneur Jésus-Christ, par qui le monde est crucifié pour moi, et moi pour le monde."
 pam_1_corinthians_1_18_english: "Car le message de la croix est une folie pour ceux qui courent à leur perte, mais pour nous qui sommes sauvés, il est le pouvoir de Dieu."
 pam_isaiah_19_19_english: "Ce jour-là, il y aura un autel pour le Seigneur au centre de l’Égypte, et à sa frontière un monument pour le Seigneur."
 # Miaphysitism Tenet
 pam_john_1_14_english: "Et la Parole s’est faite chair, a habité parmi nous, et nous avons vu sa gloire, la gloire qu’il tient de son Père comme Fils unique, plein de grâce et de vérité."
 pam_colossians_2_9_english: "Car en lui, dans son propre corps, habite toute la plénitude de la divinité."
 pam_philippians_2_6_7_english: "Lui qui, bien qu’il fût de nature divine, n’a pas considéré l’égalité avec Dieu comme une chose à laquelle il fallait s’accrocher. Il s’est dépouillé lui-même en prenant la forme d’un serviteur, en devenant semblable aux hommes."
 # Philanthropia Tenet
 pam_matthew_25_40_english: "Je vous le dis en vérité, toutes les fois que vous avez fait ces choses à l’un de ces plus petits de mes frères, c’est à moi que vous les avez faites."
 # Sanctity of Nature Tenet
 pam_psalm_24_1_english: "À l’Éternel la terre et ce qu’elle renferme, Le monde et ceux qui l’habitent !"
 # Literalism Tenet
 pam_2_timothy_3_16_english: "Toute l’Écriture est inspirée de Dieu et utile pour enseigner, pour convaincre, pour corriger, pour instruire dans la justice."
 # Legalism Tenet
 pam_romans_2_13_english: "Ce ne sont pas, en effet, ceux qui écoutent la loi qui sont justes devant Dieu, mais ce sont ceux qui la mettent en pratique qui seront déclarés justes."
 # Religious Law Tenet
 pam_matthew_18_18_english: "Je vous le dis en vérité, tout ce que vous lierez sur la terre sera lié dans le ciel, et tout ce que vous délierez sur la terre sera délié dans le ciel."
 # Communal Possessions Tenet
 pam_acts_4_32_english: "La multitude de ceux qui croyaient n’était qu’un cœur et qu’une âme. Nul ne disait que ses biens lui appartenaient en propre, mais ils mettaient tout en commun."
 # Ritual Hospitality Tenet
 pam_hebrews_13_2_english: "N’oubliez pas l’hospitalité ; car, en l’exerçant, quelques-uns ont logé des anges, sans le savoir."
 # Ritual Celebrations Tenet
 pam_psalm_150_3_4_english: "Louez-le au son de la trompette ; Louez-le avec le luth et la harpe. Louez-le avec le tambourin et avec des danses ; Louez-le avec les instruments à cordes et la flûte."
 # Adaptability Tenet
 pam_1_corinthians_9_22_english: "J’ai été faible avec les faibles, afin de gagner les faibles. Je me suis fait tout à tous, afin d’en sauver de toute manière quelques-uns."
 # Astrology Tenet
 pam_matthew_2_2_english: "Où est le roi des Juifs qui vient de naître ? car nous avons vu son étoile en Orient, et nous sommes venus pour l’adorer."
 # Warmongering Tenet
 pam_psalm_144_1_english: "Béni soit l’Éternel, mon rocher, Qui exerce mes mains au combat, Mes doigts à la bataille."
 # Natural Primitivism Tenet
 pam_genesis_2_25_english: "L’homme et sa femme étaient tous deux nus, et ils n’en avaient point honte."
 # Auspicious Birthright Tenet
 pam_jeremiah_1_5_english: "Avant de t’avoir formé dans les entrailles de ta mère, je te connaissais ; et avant ta naissance, je t’ai consacré."
 # Sacred Childbirth Tenet
 pam_psalm_127_3_english: "Les fils sont un héritage de l’Éternel, le fruit des entrailles est une récompense."
 # Hedonism Tenet
 pam_ecclesiastes_8_15_english: "J’ai donc loué la joie, parce qu’il n’y a de bonheur pour l’homme sous le soleil qu’à manger et à boire et à se réjouir."
 # Pursuit of Power Tenet
 pam_psalm_2_8_english: "Demande-moi et je te donnerai les nations en héritage, Les extrémités de la terre pour possession."
 # Sanctioned False Conversions Tenet
 pam_2_kings_5_18_19_english: "Quand mon maître entre dans la maison de Rimmon pour s’y prosterner et qu’il s’appuie sur ma main, je me prosterne aussi : puisse l’Éternel pardonner à ton serviteur, lorsque je me prosternerai dans la maison de Rimmon ! Il lui dit : « Va en paix »."
