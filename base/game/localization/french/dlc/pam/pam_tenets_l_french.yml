 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "Mortificatio carnis" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs sarkós" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "Mortification de la chair"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "Ô Seigneur, accorde-nous la grâce de crucifier notre chair avec ses passions et ses convoitises. Par la sainte souffrance, fais-nous participer à la Passion du Christ et mortifie les œuvres de la chair, afin que nous vivions véritablement.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Contexte historique','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "Par le jeûne, les veillées et les mortifications, les serviteurs de Dieu domptent la chair et la soumettent, afin que l’esprit puisse s’élever vers le ciel.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Contexte historique','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "Les fidèles se mortifient et domptent les convoitises pécheresses de leur corps, afin de partager les souffrances du Christ, purifier leur âme et atteindre la perfection spirituelle.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Contexte historique','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "Le [trait|El] [GetTrait('scarred').GetName( GetNullCharacter )] procure de la [piety|El]@piety_icon! et de l’[opinion|El] des fidèles"
 doctrine_parameter_tenet_mortification_revel_bonus: "Gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!, et le [trait|El] [GetTrait('flagellant').GetName( GetNullCharacter )], lorsque vous prenez la [decision|El] [GetDecisionWithKey('stress_loss_flagellant_decision').GetName]"
 doctrine_parameter_tenet_mortification_holy_scars: "Gain du [trait|El] [GetTrait('scarred').GetName( GetNullCharacter )] en embrassant ce [personal_tenet|El]"
 doctrine_parameter_tenet_mortification_suffering_sanctifies: "Gain de [piety|El]@piety_icon! et perte de [stress|El] chaque fois que vous subissez une blessure"
 doctrine_parameter_tenet_mortification_mortify_flesh: "Peut utiliser la [decision|El] [GetDecisionWithKey('stress_loss_flagellant_decision').GetName]"
 pam_mortification_revel_toast: "[personal_tenet|E] [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]"
 pam_mortification_flagellant_gain_toast: "De votre [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l] : vous avez embrassé la voie de l’[GetTrait('flagellant').GetName( GetPlayer.Self )|l]"
 pam_mortification_holy_scars_toast: "De votre [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l] : le fouet a laissé des cicatrices sacrées sur votre chair"
 pam_mortification_suffering_sanctifies_toast: "De votre [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l] : vous offrez à Dieu la souffrance de la chair"
 tenet_mortification_of_the_flesh_historical_desc: "Inspirée par l’appel de saint Paul à #weak faire mourir les manières d’agir du corps#! (Romains 8:13) et #weak traiter durement son corps et le discipliner#! (1 Corinthiens 9:27), la mortification corporelle était centrale pour l’ascétisme chrétien dès les premiers siècles. Ses adeptes les plus extrêmes étaient les stylites : saint Siméon dit l’Ancien a passé 37 ans sur une petite plate-forme au sommet d’un pilier près d’Alep à endurer chaleur torride et froid glacial tout en priant debout sans relâche.\n\nL’autoflagellation s’est répandue dans la chrétienté occidentale médiévale, défendue au sein du clergé par saint Pierre Damien (1007-1072). Au cours du mouvement des flagellants des XIIIe et XIVe siècles, des laïcs parcouraient les villes pour se flageller en période d’épidémies et de catastrophes."
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "Qeddus meron" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "Sanctum chrisma" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "Hágion mýron" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "Saint chrême"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "Grâce au saint myron consacré par l’abouna, les fidèles reçoivent le sceau du Saint-Esprit. Tout comme la colombe est descendue sur le Christ lors de son baptême dans le Jourdain, l’Esprit descend sur les nouveaux baptisés par cette sainte onction et les désigne comme enfants de Dieu.\n\n$pam_john_3_5_default$\n\n[Glossary('Contexte historique','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "Par le saint chrême, consacré par l’évêque, les fidèles reçoivent le sceau du don du Saint-Esprit. L’onction parachève la grâce du baptême.\n\n$pam_john_3_5_latin$\n\n[Glossary('Contexte historique','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "Le saint myron, consacré par le patriarche, est le sceau du don du Saint-Esprit. Par cette sainte onction, les nouveaux convertis reçoivent la plénitude des dons de l’Esprit et deviennent des temples du Dieu vivant.\n\n$pam_john_3_5_greek$\n\n[Glossary('Contexte historique','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "Le saint myron, ou saint chrême, est une huile spécialement consacrée utilisée lors du sacrement de la confirmation pour sceller les nouveaux baptisés du don du Saint-Esprit et parachever leur intégration dans l’Église.\n\n$pam_john_3_5_default$\n\n[Glossary('Contexte historique','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "Le saint myron, du grec #weak mýron#! signifiant « huile parfumée », est utilisé dans le sacrement de la chrismation ou de la confirmation. En Orient, il suit immédiatement le baptême, même pour les nourrissons, tandis qu’en Occident, il est administré séparément par un évêque. L’onction a des racines bibliques profondes : tant « Christ » que « Messie » signifient « #weak l’Oint#! ».\n\nLa consécration d’un nouveau myron est un événement rare et solennel, car une partie du lot précédent est toujours ajoutée au nouveau, créant ainsi une chaîne ininterrompue qui remonterait, dit-on, jusqu’aux apôtres. Selon la tradition éthiopienne, la recette du #weak meron#! a été apportée par les Neuf Saints, des missionnaires syriaques du Ve siècle, et sa consécration relève de la compétence exclusive du patriarche, l’abouna."
 doctrine_parameter_tenet_holy_myron_artifact: "Peut envoyer le [court_chaplain|El] pour créer un [artifact|El] #V saint chrême#!, via la [decision|El] [GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName] ; ses charges sont utilisées pour bénir des [artifacts|El][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: ", votre [coronation|El]"
 pam_holy_myron_param_funeral_append: ", et les défunts lors des [funerals|El]"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Peut offrir des charges de l’[artifact|El] #V saint chrême#! à d’autres dirigeants en échange de [piety|El]@piety_icon! et d’[opinion|El]."
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Les nouveau-nés gagnent le [modifier|El] [GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip] pendant #V 16#! ans ; une charge de l’[artifact|El] #V saint chrême#! procure le [modifier|El] [GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip] de manière permanente"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "En tombant [ill|El] : gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!, perte de [stress|El], et le [modifier|El] [GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip] pendant #V 2#! ans"
 # Khachkar tenet
 tenet_khachkar_armenian_name: "Khatchkar" # DO NOT TRANSLATE
 tenet_khachkar_latin_name: "Crux lapidea" # DO NOT TRANSLATE
 tenet_khachkar_greek_name: "Líthinos staurós" # DO NOT TRANSLATE
 tenet_khachkar_default_name: "Khatchkars"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "Les khatchkars sont les témoins éternels de notre foi. Ornés de motifs complexes représentant des croix, des vignes et des symboles sacrés, chaque khatchkar est une prière gravée dans la pierre, qui rend gloire à la Croix par laquelle le monde a été sauvé.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Contexte historique','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "Alors que les Arméniens dressent leurs croix de pierre vers le ciel, marquons cette Terre des symboles du Salut, la Croix de notre Seigneur Jésus-Christ.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Contexte historique','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "Des monuments de pierre, ornés de symboles sacrés, témoignent de la victoire du Christ et constituent des monuments commémoratifs éternels pour les fidèles.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Contexte historique','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "Les croix de pierre ornées de motifs religieux complexes servent de monuments sacrés pour signaler les lieux saints, rendre hommage aux défunts et célébrer la divine Providence.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Contexte historique','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "Les khatchkars, de l’arménien #italic khatch#! (croix) et #italic k’ar#! (pierre), sont des stèles en pierre finement sculptées représentant une croix, souvent posée sur une rosace ou une roue de l’éternité. Propres à la culture chrétienne arménienne, ils marquent des lieux sacrés, commémorent notamment des victoires, et rendent hommage aux défunts.\n\nCette tradition, apparue au IXe siècle, vient des croix de bois que saint Grégoire l’Illuminateur érigeait sur les temples païens après la conversion de l’Arménie en 301 après J.-C., et atteint son apogée aux XIIe et XIIIe siècles sous les princes zakarides. Chaque œuvre de maîtres sculpteurs tels que Momik de Noravank est unique. Certaines, auxquelles on attribuait des pouvoirs miraculeux, sont devenues des lieux de pèlerinage."
 doctrine_parameter_tenet_khachkar_decision_unlock: "Peut prendre la [decision|El] [GetDecisionWithKey('pam_raise_khachkar_decision').GetName] pendant #V 5#! ans après avoir hérité d’un proche parent de sa [dynasty|El]"
