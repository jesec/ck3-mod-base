 # PAM TENETS
 full_tenet_name: "$CUSTOM_NAME$ #weak ($DEFAULT_NAME$)#!"
 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "Cáin Adomnáin" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "Pax et Treuga Dei" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "Ekekheiría Theoũ" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "Paix de Dieu"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "Également connue sous le nom de « loi des innocents », elle établit des règles visant à garantir la sécurité des non-combattants en temps de guerre. Les contrevenants, ainsi que les témoins qui ne font rien pour empêcher le délit, sont passibles d’amendes et de malédictions rituelles.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Contexte historique','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "La trêve de l’Avent doit être respectée sans exception jusqu’au huitième jour de l’Épiphanie. Si quelqu’un tente de rompre la trêve, son évêque prononcera une sentence d’excommunication.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Contexte historique','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "Le Christ a tout fait pour la paix. Ses disciples doivent être des artisans de paix. Celui qui recherche la paix recherche le Christ. Sans amour pour les autres, sans une attitude de paix envers tous les hommes, nul ne peut être considéré comme un véritable serviteur du Christ.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Contexte historique','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "La violence gratuite contre nos frères est un affront à Dieu.\n\n[Glossary('Contexte historique','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "Tout au long du Moyen Âge, divers mouvements chrétiens ont cherché à éviter l’effusion de sang en imposant des règles de combat formelles. De la Loi des Innocents irlandaise au VIIe siècle au mouvement de la Paix de Dieu en France au Xe siècle, ces tentatives visaient à protéger les biens et les personnes de l’Église en limitant la violence à l’encontre des non-combattants et en restreignant les conflits armés entre nobles à des moments et des lieux précis.\n\nCes règles s’étendaient souvent aux non-croyants. Le canon XXI du troisième concile du Latran de 1179 étendait les trêves périodiques à toute la chrétienté, tandis que le canon XXVII appelait à prendre les armes contre les cathares, les Basques et autres hérétiques."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Déclarer la [war|El] à un [ruler|El] de la même [faith|El] coûte de la [piety|El]@piety_icon!"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "Le [ruler|El] [GetTrait('zealous').GetName( GetNullCharacter )|l] est moins susceptible de déclarer la [war|El] à quelqu’un de sa [faith|El]"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "Les [rulers|El] de ce [rite|El] sont beaucoup moins enclins à répondre à l’[interaction|El] #high $ecclesiastic_incite_holy_war_interaction$#!"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "L’[interaction|El] #high $purchase_truce_interaction$#! coûte #P 50%#! moins cher et est acceptée plus facilement"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "Impossible de [Concept('raid', 'piller')|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "Tous les #V 5 ans#! passés en [peace|El] procurent aux [rulers|El] une récompense, le plus souvent de la [legitimacy|El]@legitimacy_icon!"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "Tous les #V 5 ans#! passés en [peace|El] procurent #P 1#! point d’une [skill|El] aléatoire"
 doctrine_parameter_tenet_peace_of_god_excommunication: "Les défenseurs principaux ne paient pas de [piety|El]@piety_icon! pour [excommunicate|El] des attaquants de leur [faith|El]"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "Briser une [truce|El] dans la [faith|El] conduit à une [excommunication|El] immédiate"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "Le [clergy|El] règle plus rapidement les conflits territoriaux et les litiges relatifs aux titres, et ce pour #P 25%#! de moins en [piety|El]@piety_icon!, [gold|El]@gold_icon! et [prestige|El]@prestige_icon!"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$ : vous avez été en paix"
 # Dulia tenet
 tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
 tenet_dulia_default_name: "Vénération des saints"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "Ceux qui choisissent de se mettre au service du Seigneur doivent être vénérés. Saints sont leurs corps éternels, leurs reliques et le souvenir d’eux.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Contexte historique','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "Des hiéroconfesseurs et des myrophores aux saints fous de Dieu, l’Église a rendu hommage à ceux qui ont fait preuve d’une dévotion exceptionnelle envers Dieu en leur attribuant un titre spécial et en leur consacrant un jour particulier du calendrier liturgique.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Contexte historique','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "Que tous ceux qui sollicitent l’intercession des saints s’adressent à eux avec respect et dévotion.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Contexte historique','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "Au début du christianisme, les martyrs, ceux qui mouraient pour leur foi étaient vénérés et leurs reliques conservées comme des objets sacrés. À partir du IVe siècle, les confesseurs, ceux qui avaient confessé leur foi non pas par la mort, mais par la parole et par leur vie, furent également honorés.\n\nLa reconnaissance de leur statut était initialement accordée par un évêque local, après enquête sur leur vie et leurs miracles. Saint Udalric, évêque d’Augsbourg, confirmé par le pape Jean XV en 993, fut le premier saint hors de Rome à faire l’objet d’une canonisation papale. Un décret du pape Alexandre III en 1170 conféra la prérogative de la canonisation exclusivement au pape."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "Les [decisions|El] [GetDecisionWithKey('pam_canonize_saint_decision').GetName] et [GetDecisionWithKey('pam_extract_relic_decision').GetName] coûtent #P 15%#! de moins en [piety|El]@piety_icon! et en [gold|El]@gold_icon!"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "Les [artifacts|El] de la [decision|El] de [GetDecisionWithKey('pam_extract_relic_decision').GetName|l] procurent #P 1#! bénédiction supplémentaire aléatoire"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "La [decision|El] de [GetDecisionWithKey('pam_extract_relic_decision').GetName|l] sur un membre de la [dynasty|El] procure #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! en [dynasty_prestige|El]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Canoniser un saint procure à chaque [ruler|El] de la [faith|El] $pam_dulia_new_saint_modifier|l$ pendant #EMP 5 ans#!"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "Transsubstantiation"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "Dans le sacrement de l’Eucharistie, cependant, la consécration du pain ne se termine pas dans le néant, mais dans le corps du Christ. Sinon, on ne saurait expliquer comment le corps du Christ commence à exister sous les espèces sacramentelles. Il ne commence pas à exister là par un mouvement local, autrement il cesserait d’exister au ciel.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Contexte historique','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "Mais Il est présent véritablement et réellement, de sorte qu’après la consécration du pain et du vin, le pain est transformé, transsubstantié, converti et métamorphosé en le véritable Corps même du Seigneur.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Contexte historique','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "Avant la consécration, il porte un autre nom ; après, on l’appelle « Sang ». Et tu dis « Amen », c’est-à-dire « C’est vrai ».\n\n$pam_luke_22_19_default$\n\n[Glossary('Contexte historique','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "La nature de la présence du Christ dans l’Eucharistie fait l’objet d’un débat théologique depuis les débuts de l’Église. Si la divinité du pain et du vin en tant que Corps et Sang du Christ a rarement été contestée, leur nature exacte a été à l’origine de nombreux débats, sectes et schismes. L’interprétation catholique a été développée par Thomas d’Aquin au XIIIe siècle. Elle a été formellement définie par le quatrième concile du Latran en 1215. Au cours de la messe, la substance du pain et du vin est changée en la substance du Corps et du Sang du Christ, tandis que les accidents (apparences) du pain et du vin demeurent."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Vitesse pour [fabricate_claim|El] : #p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "Ora et labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "Prie et travaille"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "Obéissez à votre supérieur. Faites preuve de patience dans l’adversité. Acceptez les tâches les plus humbles et considérez-vous comme un simple ouvrier.\n#weak Chapitre VII de la Règle de saint Benoît#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Contexte historique','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "Sans interruption, jour et nuit, les moines doivent célébrer le service divin. Leurs chœurs qui se relaient et leurs psaumes sans fin rendent gloire à leur ordre et à Dieu.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Contexte historique','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "Prier, c’est travailler, et travailler, c’est prier. L’oisiveté est l’ennemie de l’âme ; il faut faire preuve de diligence tant dans ses pensées que dans ses actes.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('Contexte historique','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "Issu de la Règle de saint Benoît, la devise #weak Ora et labora#! résume l’idéal monastique de la prière et du travail. Les moines devaient consacrer des moments précis de la journée à la prière en communauté, à la méditation personnelle et au travail manuel. Cet équilibre était considéré comme essentiel à la croissance spirituelle et à la discipline. Les monastères bénédictins devinrent des centres d’enseignement, d’agriculture et d’artisanat, contribuant de manière significative à la vie culturelle et économique de l’Europe médiévale."
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "Theotókos" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "Mère de Dieu"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "Nous nous réfugions sous ta miséricorde. Ne rejette pas nos prières dans les moments difficiles, mais délivre-nous du danger, ô toi qui es pur et béni.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Contexte historique','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "Accepte nos prières et présente-les à ton Fils et notre Dieu, afin qu’Il, pour ton amour, éclaire et sauve nos âmes. Très sainte Mère de Dieu, sauve-nous !\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Contexte historique','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "Sainte Vierge Marie, Mère de Dieu, Mère de la Miséricorde, Notre-Dame.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Mère de Dieu','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "Dès les débuts du christianisme, Marie, la mère de Jésus, a occupé une place particulière d’honneur et de vénération. Le concile d’Éphèse, en 431 après J.-C., a confirmé son titre de #weak Theotokos#!, « celle qui a porté Dieu », tout en condamnant la préférence nestorienne pour le terme #weak Christotokos#!, « celle qui a porté le Christ ». Au VIIIe siècle, saint Jean Damascène écrivit que Marie était exaltée au-dessus de tous les autres saints en raison de son rôle unique dans l’histoire du salut. Au fil des siècles, diverses doctrines concernant Marie, telles que son Immaculée Conception et son Assomption, ont été développées et formellement définies par les Églises chrétiennes."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "Les [claims|El] des femmes ne sont plus affaiblies à cause des [gender_laws|El]"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Permet la [law|El] de succession de la [GetLaw('female_preference_law').GetName|l]"
 # Simony tenet
 tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
 tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
 tenet_simony_default_name: "Simonie"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "Dieu a créé l’or sous la Terre ; Il nous l’a donné, en signe de faveur envers Ses élus.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Contexte historique','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "Dieu a créé l’or sous la Terre ; Il nous l’a donné, en signe de faveur envers Ses élus.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Contexte historique','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "Dieu a créé l’or sous la Terre ; Il nous l’a donné, en signe de faveur envers Ses élus.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Contexte historique','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "Pratique consistant à vendre des charges ecclésiastiques, des reliques et des rites. Elle tire son nom de Simon le Magicien, un Samaritain qui #weak ensorcelait#! les gens et qui offrait de l’argent aux apôtres en échange du baptême.\n\nDe nombreux synodes, du synode d’Elvira en 305 après J.-C. au concile de Trente en 1545 après J.-C., ont condamné avec ferveur la simonie, lui infligeant les sanctions spirituelles et laïques les plus sévères. Si une pratique est condamnée tant de fois, pendant tant de siècles, cela signifie qu’elle est assez courante. Également critiquée dans la 95e thèse de Martin Luther et dans le Chant XIX de l’Enfer de Dante : « #weak Des prédateurs qui s’emparent des choses de Dieu, qui devraient être les épouses de la justice, et les poussent à la débauche pour de l’or et de l’argent !#! »"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[castle_holdings|E] et [church_holdings|El] : [tax|El] par niveau de [piety|El]@piety_icon! : #P +0.1 [gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "Peut payer de l’[gold|El]@gold_icon! pour garantir l’acceptation de l’[character_interaction|El] #high $take_monastic_vows_interaction$#!"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "Peut payer de l’[gold|El]@gold_icon! pour les [titles|El] cléricaux avec l’[interaction|El] #high $buy_ecclesiastical_title_interaction$#!"
 tenet_simony_ecclesiastical_purchase_name: "l’[interaction|El] #high $buy_ecclesiastical_title_interaction$#!"
 doctrine_parameter_tenet_simony_gold_donations: "Les dons d’[gold|El]@gold_icon! sont #P 5#! fois plus persuasifs en adressant une demande au [clergy|El]"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "#P 25%#!–#P 75%#! de chance annuelle, plus probable si riche, de #P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! en [spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "Le [head_of_faith|El] accepte toujours l’[gold|El]@gold_icon! proposé pour lever une [excommunication|El]"
 doctrine_parameter_tenet_simony_personal_gifts: "Les cadeaux réduisent le [stress|El], procurent un peu d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! et deux fois plus d’[opinion|El]"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "Syncrétisme bien accueilli"
 pam_personal_syncretism_county_modifier_desc: "La population locale respecte les traditions syncrétiques personnelles de son dirigeant et prospère sous son règne."
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "Monophysisme"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "Le Fils est unique et sa nature est une, même si on le conçoit comme ayant pris chair avec une âme rationnelle.\n\n$pam_john_1_1_latin$\n\n[Glossary('Contexte historique','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "Une seule nature du Verbe incarné.\n\n$pam_john_1_1_greek$\n\n[Glossary('Contexte historique','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "Le Christ n’a qu’une seule nature, pleinement divine.\n\n$pam_john_1_1_default$\n\n[Glossary('Contexte historique','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "Du grec monos, « #weak solitaire#! », et physis, « #weak nature#! », ce dogme affirme que Jésus-Christ n’a qu’une seule nature divine, celle du Verbe incarné de Dieu. Condamné comme hérésie lors du concile de Chalcédoine en 451 après J.-C., il trouva néanmoins le soutien de l’empereur Basilisque et la protection de l’empereur Justinien Ier. Il conduisit à des schismes tels que celui des acéphales, qui rejetaient l’autorité du patriarche d’Alexandrie, et celui des docètes, qui croyaient que la nature humaine de Jésus n’était qu’un fantasme."
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[character|E] [GetTrait('theologian').GetName( GetNullCharacter )|l] : #P +10%#! de gain de [piety|El]@piety_icon!, #P +5#! en [opinion|El] de fanatique, #P +10%#! en expérience de [lifestyle|El]"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[character|E] [GetTrait('stubborn').GetName( GetNullCharacter )|l] : #P +10%#! de gain de [piety|El]@piety_icon!, #P +10#! en [opinion|El] du [clergy|El]"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[character|E] [GetTrait('trusting').GetName( GetNullCharacter )|l] : #N -10%#! de gain en [piety|El]@piety_icon!, #N -10#! en [opinion|El] du [clergy|El]"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "Contre d’autres [faiths|El] de votre [religion|El] : [convert_county|El] #P +25%#! plus rapide, [characters|El] #P +20#! plus enclins à accepter la conversion"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "Prosélytisme fervent"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "Tout comme Moïse s’est présenté devant le pharaon et lui a courageusement annoncé la mission que Tu lui avais confiée, nos missionnaires se présentent devant les hommes.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Contexte historique','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "Je reviens vers Toi, vers Ton peuple, ce don que Tu m’as fait. Guide-les de Ta main puissante et protège-les à l’ombre de Tes ailes.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Contexte historique','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "Apporte la lumière céleste à ceux qui sont dans les ténèbres et l’espoir à ceux qui sont dans le désespoir.\n\n$pam_acts_1_8_default$\n\n[Glossary('Contexte historique','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "Le christianisme s’est rapidement répandu au cours des premiers siècles de notre ère, en grande partie grâce aux efforts missionnaires des apôtres et des premiers disciples. Leurs voyages les ont menés à travers l’Empire romain, où ils ont fondé des communautés chrétiennes et converti des personnes issues de milieux très divers. Le zèle pour le prosélytisme était alimenté par une profonde conviction dans le message du salut par Jésus-Christ, ce qui a conduit le christianisme à passer du statut de petite secte au sein du judaïsme à celui de grande religion mondiale.\n\nAu Moyen Âge, de nombreux futurs saints et martyrs ont entrepris des voyages missionnaires dans des contrées païennes, diffusant sans relâche la foi chrétienne."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Des prérequis moindres pour la [decision|El] [GetDecisionWithKey('zealous_missionary_prep_decision').GetName], que davantage d’[adventurers|El] prendront"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Convertir des [characters|El] procure #P 50#! @legitimacy_icon! ; votre [court_chaplain|El] qui convertit un [county|El] procure #P 100#! @legitimacy_icon! et #P 5#! @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "Convertir un [character|El] procure #P 3#! en [spiritual_fulfillment|El]@spiritual_fulfillment_icon!, ou #P 10#! si c’est un [ruler|El] [landed|El]"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Votre [head_of_rite|El] gagne #P +25#! en acceptation de la part des [characters|El] poussés à adopter ce [rite|El]"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "Votre avantage d’[learning|El] compte #P double#! pour exiger la conversion de [characters|El]"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "Convertir un [ruler|El] procure de #P 25#! à #P 1500#! de [piety|El]@piety_icon!, en fonction du rang du [title|El]"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "Du principe du [GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )|l]"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "Purgatoire"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "Je redoute bien plus le châtiment qui m’attend en bas ; mon âme est angoissée, dans l’expectative ; je sens déjà le poids écrasant de la première terrasse.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Contexte historique','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "Et les personnes qui sont au ciel, comme elles n’ont pas de corps, ne peuvent pas progresser dans la théosis ; c’est pourquoi nos prières les aident à progresser dans la théosis.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Contexte historique','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "La purification finale de ceux qui sont morts en état de grâce, qui ne laisse en eux que la sainteté nécessaire pour entrer dans la joie du Ciel.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Contexte historique','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "Si l’idée d’âmes se trouvant dans un état transitoire, en attente d’entrer au paradis, était communément admise, la nature exacte de cet état faisait souvent l’objet de débats. La question de savoir si c’était un lieu réel, un état d’esprit, une simple métaphore ou une purification physique variait selon les théologiens et les confessions. Sainte Catherine de Gênes écrivait qu’il s’agissait d’un état mêlant joie et souffrance volontaire pour expier ses péchés, tandis qu’Origène d’Alexandrie décrivait Dieu comme un feu dévorant.\n\nL’Église catholique a officialisé la doctrine du purgatoire lors des conciles de Florence (1439) et de Trente (1545-1563), la définissant comme un état temporaire de purification, et enseignant que les prières et les bonnes œuvres des vivants peuvent bénéficier aux âmes qui s’y trouvent."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "Les [characters|El] [Concept('sinful', 'pécheurs')|E] sont moins susceptibles de rejoindre des [factions|El] (#N -15#! par [sin|El])"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "Les [rulers|El] [Concept('sinful', 'pécheurs')|E] gagnent #N 10%#! de [piety|El]@piety_icon! en moins par [sin|El]"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "Les montées de [stress|El] peuvent remplacer les [traits|El] [Concept('sinful', 'immoraux')|E] par des [virtues|El], la probabilité est fonction de la montée"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "Les [characters|El] [Concept('excommunicated', 'excommuniés')|E] de ce [rite|El] expient leurs fautes par la pénitence : #P +25%#! de gain de [piety|El]@piety_icon! et #P +10#! en [opinion|El] de même foi"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|E] coûte moins de [prestige|El]@prestige_icon! et ne diminue pas votre [prestige_level|El]"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "Gagne #P 50#! de [piety|El]@piety_icon! pour chaque [sin|El] d’un membre de la [family|El] qui décède"
 pam_purgatory_prayers_for_the_dead_toast: "De votre principe [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )] : prières pour les morts"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "Crescite et multiplicamini" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì Plēthýnesthe" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "Soyez féconds et multipliez-vous"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "Le couple ne se consacre pas seulement l’un à l’autre, mais aussi à la réalité des enfants, qui sont le reflet vivant de leur amour, une synthèse vivante et indissociable de leur être.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Contexte historique','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "Voici, les enfants sont un héritage de l’Éternel, le fruit des entrailles est une récompense.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Contexte historique','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "Selon le dessein de Dieu, la famille est une communauté intime de vie et d’amour, une aspiration qui, comme toute chose créée et rachetée, trouvera son accomplissement dans le Royaume de Dieu.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Contexte historique','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "« Soyez féconds et multipliez-vous » est une injonction biblique tirée de la Genèse (1:28), où Dieu ordonne à Adam et Ève de procréer et de peupler la terre."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Il est bien plus facile de $courting_action|l$ à son conjoint, ce qui confère un bonus de [fertility|El] important"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "Il est toujours possible de divorcer d’un conjoint peu [Concept('fertility', 'fertile')|E]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "Les nouveau-nés bénéficient d’un bonus de [health|El] proportionnel au degré de parenté entre leurs parents"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "Élevé avec amour"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "Élevé avec beaucoup d’amour"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "Élevé avec un profond dévouement"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "Un enfant né d’une union pleine d’amour grandit entouré de l’affection de ses deux parents et, grâce à cela, s’épanouit pleinement."
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "À la naissance et à la majorité :\n$BULLET_WITH_TAB$L’#V enfant#! reçoit [GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip] pendant 2 ans.\n$BULLET_WITH_TAB$Les #V parents#! reçoivent [GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip] pendant 2 ans."
 tenet_be_fruitful_and_multiply_child_modifier: "Choyé"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "La vénération fervente de la fertilité se traduit par une attention et un engagement accrus de la part de tous les fidèles envers les jeunes et leurs parents"
 tenet_be_fruitful_and_multiply_parent_modifier: "Fécondité louée"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "Successio apostolica" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "Apostolikē Diadokhē" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "Succession apostolique"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "La primauté en matière d’honneur et de juridiction que le Christ a conférée à l’apôtre Pierre et qui est exercée par ses successeurs, les papes.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Contexte historique','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "Dans l’Église de Rome, Linus, fils de Claudia, fut le premier à être ordonné par Paul.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Contexte historique','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "La succession ininterrompue des évêques, depuis les apôtres jusqu’à nos jours, garantit la transmission authentique de la foi.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Contexte historique','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "La doctrine de la succession apostolique établit juridiquement que les évêques tirent leur autorité d’une chaîne ininterrompue d’ordinations remontant aux apôtres. Au IIe siècle, Irénée de Lyon utilisa la succession apostolique comme argument contre les hérésies gnostiques, démontrant ainsi que le véritable enseignement du Christ avait été préservé par les évêques légitimes de l’Église.\n\nÀ partir du XIIIe siècle, les papes portent l’anneau du pêcheur qui les distingue en tant que successeurs de saint Pierre. Les orthodoxes d’Orient reconnaissent la lignée des papes occidentaux et leur importance pour le christianisme primitif, mais ne considèrent pas Pierre comme supérieur aux autres apôtres ; ils considèrent plutôt le pape Lin comme le premier évêque de Rome."
 tenet_apostolic_succession_requires_head_of_faith_tt: "Votre [faith|El] doit avoir un [Concept('head_of_faith', 'chef')|E]"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "Les [theocratic_vassals|El] de la même [faith|El] ont une [legitimacy_expectations|El] plus faible à l’égard de leur [liege|El]"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "Procure [GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "Promouvoir un [cardinal|El] augmente son [papabile_score|El] de #P 10#! points supplémentaires"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "Avoir sa [legitimacy|El]@legitimacy_icon! prêchée par le [Concept('head_of_faith', 'chef')|E] de [faith|El] en personne procure de la [legitimacy|El]@legitimacy_icon! supplémentaire"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "Déposer un [antipope|El] procure de la [legitimacy|El]@legitimacy_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 # Confession tenet
 tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
 tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
 tenet_confession_default_name: "Sacrement de pénitence"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "Bénissez-moi, mon Père, car j’ai péché. Ô Dieu miséricordieux ! Prosterné à tes pieds, je t’implore de me pardonner. Je te confesse mes péchés en toute sincérité, à toi et à ton prêtre.\n\n$pam_james_5_16_latin$\n\n[Glossary('Contexte historique','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "Écoute la prière que je t’adresse, moi, le malheureux, et anéantis le serpent qui se niche en moi, ô Seigneur !\n\n$pam_james_5_16_greek$\n\n[Glossary('Contexte historique','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "Par la confession, les pécheurs peuvent recevoir l’absolution et se réconcilier avec Dieu et l’Église.\n\n$pam_james_5_16_default$\n\n[Glossary('Contexte historique','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "La pratique de la confession des péchés a considérablement évolué au cours de l’histoire du christianisme. Dans l’Église primitive, la confession publique était courante pour les péchés graves. La confession privée devant un prêtre, en revanche, s’est répandue au VIe siècle dans les Églises celtiques, avant de se généraliser dans la chrétienté occidentale. En 1215, le quatrième concile du Latran a finalement décrété la confession annuelle pour tous les chrétiens. Le secret de la confession, c’est-à-dire la confidentialité absolue des péchés confessés, est devenu une caractéristique distinctive du sacrement et a conduit les prêtres à préférer mourir en martyrs plutôt que de violer ce secret."
 doctrine_parameter_tenet_confession_priests_secrets: "Un [court_chaplain|El] de votre [faith|El] qui pratique la confession et soit vous apprécie, soit subit un [strong_hook|El], a une efficacité améliorée pour la [councillor_task|El] visant à $task_find_secrets|l$."
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! du [clergy|El] de ce [rite|El] procure de la [piety|El]@piety_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "Les [schemes|El] d’[GetScheme('study_scripture').GetTypeName|l] soulagent davantage de [stress|El]"
 doctrine_parameter_tenet_confession_confess_sins_decision: "Peut utiliser la [decision|El] de [GetDecisionWithKey('pam_decision_confession').GetName|l]"
 # Original Sin tenet
 tenet_original_sin_latin_name: "Peccatum originale" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "Propatorikē Hamartía" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "Péché originel"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "Tous les hommes avaient perdu leur innocence à cause de la faute d’Adam. Les conséquences de cette nature affaiblie et encline au mal persistent chez l’homme et l’appellent à mener un combat spirituel.\n\n$pam_romans_5_12_latin$\n\n[Glossary('Contexte historique','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "Ô notre Créateur, c’est à nous qu’incombe la faute. Adam et Ève, en écoutant Satan, ont blasphémé. Par égoïsme, ils se sont laissés égarer. Ils ont affaibli la nature de l’humanité. Les désirs de notre cœur sont mauvais.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Contexte historique','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "L’humanité tout entière hérite du poids du péché originel d’Adam, dont seule la grâce divine, par le Christ, peut nous délivrer.\n\n$pam_romans_5_12_default$\n\n[Glossary('Contexte historique','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "C’est principalement grâce à saint Augustin d’Hippone que la doctrine du péché originel s’est développée au début du Ve siècle, surtout en réponse à l’hérésie pélagienne, qui niait l’existence d’une nature pécheresse héréditaire. Augustin enseignait que le péché d’Adam avait été transmis à tous ses descendants, corrompant ainsi la nature humaine et rendant le salut impossible sans la grâce divine. En 418, le concile de Carthage a confirmé cette doctrine, qui est ainsi devenue un pilier de la théologie du christianisme occidental. Le christianisme oriental a développé une conception quelque peu différente, mettant davantage l’accent sur le péché des ancêtres que sur la culpabilité directement héritée."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "La [councillor_task|El] visant à [promote_culture|El] est #P 25%#! plus rapide dans les [counties|El] du même [rite|El]"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "Les [counties|El] de cette [faith|El] prennent #N 50%#! plus de temps à [Concept( 'promote_culture', 'changer de culture' )|E] si le [liege|El] est d’une autre [faith|El]."
 doctrine_parameter_tenet_original_sin_sinners_insight: "Vous gagnez #P +10#! à la probabilité maximale de réussite d’un [scheme|El] hostile pour chaque [sin|El]"
 doctrine_parameter_tenet_original_sin_baptism_piety: "Vous gagnez #P 50#! en [piety|El]@piety_icon! à la naissance de votre enfant ; le nouveau-né est baptisé avec #P 250#! en [piety|El]@piety_icon!"
 pam_original_sin_baptism_toast: "De votre [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )|l] : la souillure du nouveau-né est lavée"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "Hierarchia Caelestis" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "Hiérarchie céleste"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "Ô saints anges, entourez mon trône et ma famille. Père céleste, fais que Tes anges réduisent au silence toute voix de condamnation et de peur qui s’élève contre moi, et qu’ils portent rapidement mes prières jusqu’à Ton trône.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Contexte historique','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "Sois l’ange gardien, le sage conseiller et le compagnon du peuple chrétien, en lui apportant lumière, force, joie, paix et consolation.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Contexte historique','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "Les anges sont répartis en neuf ordres, des séraphins aux simples anges, chacun servant Dieu dans la mission qui lui a été confiée et rend service aux hommes.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Contexte historique','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "Le concept de hiérarchie céleste a été systématisé au Ve ou VIe siècle par Pseudo-Denys l’Aréopagite dans son ouvrage #italic De Coelesti Hierarchia#!. Il a classé les anges en trois triades : la plus élevée, composée des séraphins, des chérubins et des trônes ; celle du milieu, des dominations, des vertus et des puissances ; et la plus basse, des principautés, des archanges et des anges.\n\nCette hiérarchie a profondément influencé la théologie chrétienne médiévale et a été adoptée tant par le christianisme oriental que par le christianisme occidental. Thomas d’Aquin a repris cette angélologie dans sa #italic Summa Theologica#!, ce qui a façonné les représentations artistiques du ciel tout au long du Moyen Âge."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Embaucher des [court_positions|El] avec une [aptitude|El] élevée procure #P 3#!@spiritual_fulfillment_icon! en [spiritual_fulfillment|El] tandis qu’en renvoyer ou en révoquer un en coûte #N 3#!"
 pam_celestial_hierarchy_hire_sp_toast: "Principe personnel de la [GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "Les titulaires de [court_positions|El] de la même [faith|El] que leur [liege|El] gagnent de la [aptitude|El] en fonction de leur [piety_level|El]"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "Le [clergy|El] gagne #P +20#! en acceptation d’[interaction|El] lorsqu’il intervient auprès des [rulers|El] laïcs"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "La [councillor_task|El] visant à [religious_relations|El] est #P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')]%#! plus efficace"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "Acceptation de l’[interaction|El] de même [faith|El] change de #P +10#! par [piety_level|El] au-dessus de la cible et #N -10#! par niveau en dessous"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "Le [clergy|El] intervient auprès d’un [ruler|El] laïc : $VALUE|=+0$"
 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "[piety_level|E] relatif : $VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "Autorité ecclésiastique sur un [ruler|El] laïc : $VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "Miles christi" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "Soldats du Christ"
 tenet_miles_christi_latin_desc: "Tenez donc ferme : ayez à vos reins la vérité pour ceinture ; revêtez la cuirasse de la justice. Menez le combat légitime de la foi, tels les dignes soldats du Christ.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Contexte historique','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "Tout chrétien fidèle doit être prêt à souffrir pour le Christ, à tenir bon face aux forces spirituelles du mal et à endurer les épreuves avec le courage d’un soldat.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Contexte historique','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "Les fidèles sont appelés à être des guerriers spirituels qui luttent contre le péché et le mal avec l’armure de Dieu, prêts à souffrir pour le Christ comme les soldats souffrent pour leur commandant.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Contexte historique','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "Le concept des « soldats du Christ » (#italic Miles Christi#!) est profondément ancré dans la tradition chrétienne et trouve son origine dans les épîtres de saint Paul, où celui-ci recourait à des métaphores militaires pour décrire la vie spirituelle. Au Moyen Âge, ce concept s’appliquait aussi bien à la guerre au sens propre qu’à la guerre spirituelle.\n\nLes ordres militaires, tels que les Templiers et les Hospitaliers, incarnaient cet idéal, alliant discipline monastique et art de la guerre. Dans son #italic De Laude Novae Militiae#!, Bernard de Clairvaux louait ces moines guerriers comme des modèles de vertu chrétienne, qui ne combattaient pas pour s’enrichir, mais pour la défense de la chrétienté."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Terminer une [war|El] défensive par une [white_peace|El] contre la même [faith|El] procure #P 100#! en [piety|El]@piety_icon! et en [legitimacy|El]@legitimacy_icon!, chacun en fonction par le rang du [title|El] de chaque camp, et #P 5#!@spiritual_fulfillment_icon! en [spiritual_fulfillment|El]"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Diriger une [battle|El] victorieuse ou un [siege|El] réussi procure #P 3#!@spiritual_fulfillment_icon! en [spiritual_fulfillment|El]"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "Les [battles|El] victorieuses contre une autre [religion|El] tout en brandissant une arme qui est une [holy_relic|El] améliore encore davantage cette arme via quatre bénédictions, jusqu’à #P 50#! victoires"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "Charité"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "Ce que vous avez fait à l’un de mes plus petits frères et sœurs, c’est à moi que vous l’avez fait. Faire l’aumône et prendre soin des pauvres ne sont pas de simples devoirs civiques, mais un moyen de se rapprocher du Christ lui-même.\n\n[Glossary('Contexte historique','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "La philanthropie – l’amour de l’humanité – trouvait sa pleine expression dans les hôpitaux, les hospices et les œuvres de charité impériaux et ecclésiastiques de la Nouvelle Rome. Nourrir les affamés et racheter les prisonniers, c’est imiter le Christ, qui s’est dépouillé de lui-même pour nous.\n\n[Glossary('Contexte historique','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "La foi considère le don généreux de l’aumône, l’attention portée aux pauvres et la charité institutionnelle comme un devoir chrétien fondamental, dans la lignée des Pères de l’Église et à l’exemple des premiers hospices et hôpitaux.\n\n[Glossary('Contexte historique','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "Dans le christianisme byzantin, le terme #italic philanthrōpia#! désignait à la fois la vertu de l’amour universel et les institutions — hôpitaux, xénodoques, orphelinats et aumônes — soutenues par les empereurs, les évêques et les fidèles. Basile de Césarée, Jean Chrysostome et des empereurs ultérieurs tels que Justinien ont lié la légitimité impériale à la prise en charge des nécessiteux. L’Église ne glorifiait pas la guerre comme un chemin vers la sainteté ; elle insistait en revanche sur le fait que la richesse et le pouvoir se justifiaient en partie par la manière dont ils servaient les pauvres."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "Peut nommer un [GetCourtPositionType('high_almoner_court_position').GetName|l] de rang [Concept('county', 'comtal')|E] ou supérieur"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Rançonner un [character|El] procure de la [piety|El]@piety_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! proportionnels à la somme d’[gold|El]@gold_icon! versée"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[character|E] [GetTrait('generous').GetName( GetNullCharacter )|l] : #P +10#! en [opinion|El] de même foi, #P +20%#! en [development_growth|El]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[character|E] [GetTrait('greedy').GetName( GetNullCharacter )|l] : #N -10#! en [opinion|El] de même foi, #N -25%#! de gain en [piety|El]@piety_icon!"
