 # Scholasticism tenet
 tenet_scholasticism_latin_name: "Sacra Doctrina" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "Scolastique"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "La quête du savoir est une forme de culte, car en comprenant la création, nous nous rapprochons de la compréhension du Créateur. Cherchez la sagesse, et elle vous sera donnée.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Contexte historique','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "La foi et la raison ne s’opposent pas, mais se complètent, car Dieu nous a donné un esprit pour rechercher la vérité et un cœur pour L’aimer. Par l’étude et la contemplation, nous accédons à un savoir supérieur.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Contexte historique','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "Grâce à une réflexion intellectuelle rigoureuse et à la méthode dialectique, il est possible de réconcilier la foi et la raison et d’atteindre une compréhension plus profonde de la vérité divine.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Contexte historique','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "La scolastique était la méthode d’enseignement dominante dans les universités européennes du Moyen Âge et a atteint son apogée aux XIIe et XIIIe siècles. Elle visait à concilier la théologie chrétienne et la philosophie classique, en s’appuyant notamment sur les œuvres d’Aristote.\n\nDes penseurs scolastiques éminents tels qu’Anselme de Cantorbéry, Pierre Abélard, Albert le Grand et Thomas d’Aquin ont développé des approches systématiques de la théologie qui mettaient l’accent sur la rigueur logique et la dispute. La #italic Summa Theologica#! de Thomas d’Aquin, qui tente d’intégrer l’ensemble du savoir humain dans un cadre chrétien, est le succès par excellence de la méthode scolastique."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Visiter des [points_of_interest|El] dans des [counties|El] [GetReligionByKey('judaism_religion').GetAdherentName], [GetReligionByKey('islam_religion').GetAdherentName] et [GetReligionByKey('zoroastrianism_religion').GetAdherentName] procure de la [piety|El]@piety_icon!, de l’[experience|El] en [learning|El] et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! supplémentaires"
 doctrine_parameter_tenet_scholasticism_university_bonus: "Achever un [GetActivityType('activity_adult_education').GetName|l] procure un [modifier|El] de longue durée : [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[scheme_success_chance|E] de l’[GetScheme('study_scripture').GetTypeName|l] : #P +10%#![success_chance_i]"
 doctrine_parameter_tenet_scholasticism_university_chance: "Probabilité annuelle de gagner [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip] sans étudier, amélioré par l’[learning|El], le [piety_level|El] et les [languages|El] parlées"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "Faire un [GetActivityType('activity_adult_education').GetName|l] coûte #P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')]%#! d’[gold|El]@gold_icon! de moins"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization( HasDlcFeature( 'legacy_of_persia' ), 'tenet_scholasticism_court_scholar_effect', 'blank_line' )]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "Peut nommer un [GetCourtPositionType('court_scholar_court_position').GetName|l] sans la [culture_tradition|El] $tradition_fp3_beacon_of_learning_name$ et #P sans salaire#!"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "La quête du savoir est une forme de culte, car en comprenant la création, nous nous rapprochons de la compréhension du Créateur."
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "Un lieu d’étude itinérant"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.Custom('FR_le_Char_Pi')|U][pam_studium_scholar.GetTitledFirstName] a passé la dernière partie du trajet à discuter de cette question avec vous et, à un moment donné entre une [barony|El] et la suivante, a décidé qu’il valait mieux régler cette affaire par écrit."
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "Diliges Proximum" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "Aime ton prochain"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "Puissions-nous regarder les autres comme à travers Tes yeux, en les jugeant moins et en leur accordant davantage d’amour, et en les voyant, tout comme nous, comme une œuvre qui sera achevée en temps voulu par Tes mains.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Contexte historique','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "Qu’y a-t-il de plus doux et de plus beau que l’amour du prochain ? L’amour est une bénédiction, et la haine un tourment. De ces deux commandements dépendent toute la Loi et les Prophètes : « Tu aimeras le Seigneur ton Dieu de tout ton cœur, et tu aimeras ton prochain comme toi-même. »\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Contexte historique','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "L’amour du prochain est indissociable de l’amour de Dieu, et c’est par des actes de charité et de miséricorde que nous accomplissons toute la loi divine.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Contexte historique','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "Le commandement d’aimer son prochain est au cœur de l’éthique chrétienne ; il est tiré du Lévitique 19:18 et a été élevé par le Christ au rang de résumé de toute la loi divine, au même titre que l’amour de Dieu. Les Pères de l’Église primitive, tels que Clément d’Alexandrie et Jean Chrysostome, ont souligné que le véritable amour devait s’étendre au-delà de la famille et des amis pour englober toute l’humanité, y compris les étrangers et les ennemis. Cet enseignement a inspiré le développement d’institutions caritatives chrétiennes, d’hôpitaux et la pratique de l’aumône tout au long du Moyen Âge."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "Les [counties|El] de cette [faith|El] ayant au moins #P 60#! d’[county_opinion|El] peuvent obtenir un [modifier|El] [GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "Les [buildings|El] $building_type_hospices_01$ réduisent le [travel_danger|El] dans le [county|El] de #P 3#! à #P 10#! (augmente à chaque niveau)"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "Les [buildings|El] $building_type_hospices_01$ procurent de #P +2#! à #P +10#! en [epidemic_resistance|El] dans la [province|El] (augmente à chaque niveau)"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "La [scheme_success_chance|El] d’[GetScheme('sway').GetTypeName|l] contre les [characters|El] hors de votre [realm|El] : #P +20%#![success_chance_i]"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "Acceptation de #high $offer_vassalization_interaction$#! : #P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$ : $VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "L’amour du prochain est indissociable de l’amour de Dieu ; par nos actes de charité et de miséricorde, nous obéissons à la loi divine."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "Divinum Officium" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "Theía leitourgía" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "Liturgie divine"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "La liturgie sacrée est le paradis sur terre, où nous nous unissons aux anges et aux saints dans une adoration éternelle. Saint, saint, saint est l’Éternel ; toute la terre est remplie de sa gloire.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Contexte historique','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "Au cours de la Divine Liturgie, les fidèles prennent part au culte céleste, transcendant le temps et l’espace pour se tenir devant le trône de Dieu aux côtés des chérubins et des séraphins.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Contexte historique','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "La liturgie est l’expression première de la foi, là où le ciel et la terre se rencontrent, et où les fidèles prennent part au culte éternel de Dieu aux côtés des anges et des saints.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Contexte historique','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "La Divine Liturgie s’est développée à partir des premiers offices chrétiens, la Liturgie de saint Basile et celle de saint Jean Chrysostome devenant les formes canoniques du christianisme oriental. Ces liturgies mettaient l’accent sur la participation mystique des fidèles au culte céleste, les cérémonies élaborées, l’encens, les icônes et les chants créant une expérience sensorielle du divin. La liturgie n’était pas simplement comprise comme un culte humain rendu à Dieu, mais comme l’entrée des fidèles dans le culte éternel du ciel, transcendant les limites du temps et de l’espace."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "Accorde [GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "Accorde [GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "Votre [court_chaplain|El] gagne #P +2#! en [learning|El]"
 tenet_aniconism_latin_name: "Iconomachia" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "Ô Seigneur, Toi seul es digne d’adoration. Préserve-nous du piège des idoles, afin que nous puissions T’adorer en esprit et en vérité, non pas par des images façonnées par des mains humaines, mais par des cœurs purs qui s’élèvent vers Toi.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Contexte historique','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "La vénération des images n’est sanctionnée ni par les Écritures, ni par la tradition des Pères. L’iconoclasme est la véritable doctrine de l’Église, qui préserve les fidèles de l’idolâtrie des images.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Contexte historique','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "Tu ne te feras point d’idole ni d’image représentative de quoi que ce soit. Le culte des images est une perversion de la vraie foi.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Contexte historique','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "Le rejet, l’interdiction et la destruction des images religieuses ont des racines profondes dans les traditions abrahamiques. Dans le christianisme, l’expression la plus marquante fut la première controverse iconoclaste (726-843 apr. J.-C.), lancée par l’empereur Léon III et poursuivie par Constantin V, une période marquée par la destruction généralisée d’images religieuses et la persécution de ceux qui vénéraient les icônes.\n\nLes iconoclastes soutenaient que la vénération des icônes violait l’interdiction biblique des images taillées. Le deuxième concile de Nicée, en 787 après J.-C., condamna l’iconoclasme, soulignant les similitudes entre la vénération des icônes et celle de l’Évangile écrit. L’iconoclasme connut un regain d’intérêt sous Léon V en 814 après J.-C. Des tendances aniconiques similaires apparurent plus tard dans divers mouvements protestants."
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "Ô Christ, Sagesse éternelle de Dieu, éclaire nos esprits afin que nous puissions percevoir les mystères cachés de Ta sainte Écriture. Donne-nous des yeux pour voir au-delà de la lettre, jusqu’à l’esprit qui donne la vie.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Contexte historique','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "Selon la tradition alexandrine, la sagesse divine se révèle à travers l’interprétation allégorique des Écritures. Le Christ est le Logos, la Parole divine par laquelle toute la vérité est révélée.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Contexte historique','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "L’école d’Alexandrie met l’accent sur l’interprétation allégorique des Écritures et sur la synthèse entre la théologie chrétienne et la philosophie grecque, en cherchant à découvrir des significations spirituelles plus profondes sous le texte littéral.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Contexte historique','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "L’École catéchétique d’Alexandrie, fondée à la fin du IIe siècle, fut la première institution chrétienne d’enseignement supérieur. Sous la direction de maîtres tels que Clément d’Alexandrie et Origène, elle développa une méthode sophistiquée d’interprétation de la Bible, qui cherchait à en dégager la signification allégorique et spirituelle. L’école associait la théologie chrétienne à la philosophie platonicienne et soutenait que la culture grecque ouvrait la voie à l’Évangile.\n\nLes méthodes exégétiques et les spéculations théologiques d’Origène ont profondément influencé le christianisme oriental, tandis que l’accent mis par l’école sur la méthode allégorique contrastait avec l’approche plutôt littérale de l’École d’Antioche."
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "Filius adoptivus" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "Adoptianisme"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "Ô Père, toi qui as regardé Jésus, l’homme juste, et l’as choisi pour être tien, accorde-nous d’être, nous aussi, jugés dignes d’être adoptés. De même que tu l’as élevé hors des eaux et l’as déclaré comme ton Fils bien-aimé, élève-nous de notre humilité pour nous faire entrer dans ta famille divine.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Contexte historique','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "Ô Dieu, toi qui exaltes les humbles et choisis les justes pour Toi, nous Te louons pour le mystère de l’adoption. De même que le Christ a été élevé à la filiation divine par Ta grâce, puissions-nous, nous aussi, être comptés parmi Tes enfants.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Contexte historique','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "Ô Seigneur, aide-nous à comprendre le mystère de l’exaltation de Ton Fils. Puissions-nous suivre Son exemple de justice, afin que nous puissions, nous aussi, être appelés enfants de Dieu.\n\n$pam_mark_1_11_default$\n\n[Glossary('Contexte historique','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "L’adoptianisme soutient que Jésus est né comme un homme ordinaire et qu’il a ensuite été « adopté » comme Fils de Dieu, généralement lors de son baptême, lorsque le Saint-Esprit est descendu sur lui. Les premières formes de cette doctrine apparurent au IIe siècle, lorsque Théodote de Byzance, qui prônait un monarchianisme dynamique, mit l’accent sur l’unité de Dieu.\n\nEn Espagne, au VIIIe siècle, cette doctrine connut un regain d’intérêt grâce à l’archevêque Elipandus de Tolède et à l’évêque Félix d’Urgell, qui faisaient la distinction entre la nature divine du Christ, éternellement engendrée, et sa nature humaine, adoptée. Le concile de Francfort de 794 après J.-C. condamna l’adoptianisme espagnol comme hérésie. Malgré cette condamnation, les idées adoptiennes influencèrent plus tard les mouvements antitrinitaires."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "L’[interaction|El] visant à [adopt|El] est toujours disponible, sans les prérequis habituels (votre cible doit cependant rester éligible et un partenaire de mariage subordonné ne peut pas adopter)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "Les [vassals|El] et enfants qui suivent ce [rite|El] ne désapprouvent pas une [Concept( 'adopt', 'adoption' )|E] (de #N -10#! à #N -25#! en [opinion|El] évités)"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "L’[interaction|El] visant à [adopt|El] est toujours disponible pour vous, sans les prérequis habituels (votre cible doit cependant rester éligible)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "[legitimacy|E]@legitimacy_icon!, [piety|El]@piety_icon! et [spiritual_fulfillment|El]@spiritual_fulfillment_icon! lors de l’[Concept( 'adopt', 'adoption' )|E] d’un [character|El]"
 pam_adoptionism_adopt_sp_toast: "Principe personnel de l’[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "L’[interaction|El] visant à [Concept( 'legitimized_bastard', 'légitimer un bâtard')|E] coûte #P 50%#! de [prestige|El]@prestige_icon! de moins, à condition que la [faith|El] l’autorise"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "L’[interaction|El] visant à [Concept( 'legitimized_bastard', 'légitimer un bâtard')|E] peut être utilisée sur ses propres [children|El] d’une autre [house|E], à condition que la [faith|El] l’autorise"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "Peregrinatio armata" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "Ô Seigneur, fortifie nos bras alors que nous portons la croix en Ton saint nom. Guide nos pas sur ce chemin sacré, afin que nous puissions défendre la foi et libérer les lieux saints des mains des infidèles.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Contexte historique','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "Les fidèles sont appelés à suivre le Christ en prenant leur croix, non seulement sur le plan spirituel, mais aussi pour défendre les lieux saints. Le pèlerinage armé est un acte de dévotion, un cheminement de foi protégé par l’épée.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Contexte historique','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "Le pèlerinage vers les lieux saints est un devoir sacré, et les fidèles sont appelés à protéger ces sites et leurs compagnons de pèlerinage par la force des armes si nécessaire.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Contexte historique','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "À la fois la pratique spirituelle consistant à visiter des lieux saints et l’action militaire visant à les défendre ou à les reconquérir. Les croisades, qui débutèrent en 1095 avec l’appel lancé par le pape Urbain II lors du concile de Clermont, constituent la forme la plus organisée de pèlerinage armé. Les croisés se voyaient accorder l’indulgence plénière, et leur service militaire était considéré comme un acte de pénitence et de dévotion.\n\nCe concept s’inscrivait dans la lignée des traditions antérieures de guerre pénitentielle et de défense de la chrétienté contre les menaces extérieures, faisant passer le pèlerinage d’un voyage pacifique à une expression militante de la foi."
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "Populus dei" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "Laòs theoũ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "Nous sommes la race élue, un sacerdoce royal, une nation sainte, sanctifiée par Dieu. Puissions-nous proclamer ses exploits et marcher d’une manière digne de notre vocation en tant que son peuple.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Contexte historique','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "Appelés à sortir des ténèbres pour entrer dans Sa merveilleuse lumière, les fidèles forment une nation sainte, un peuple qui appartient à Dieu. Notre identité se trouve en Christ, qui a fait de nous un seul corps.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Contexte historique','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "Les fidèles forment un peuple uni, le peuple élu de Dieu, une communauté mise à part du monde, partageant une identité et une vocation en Christ.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Contexte historique','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "Le concept de l’Église en tant que « peuple de Dieu » renvoie à l’image de l’Ancien Testament qui présente Israël comme le peuple élu de Dieu, et il est réinterprété à la lumière de la nouvelle Alliance. Les premiers chrétiens se considéraient comme un nouvel Israël, uni non pas par le sang ou l’appartenance ethnique, mais par la foi en Christ.\n\nCette identité communautaire transcendait les frontières sociales, ethniques et nationales et créait une fraternité universelle. Le Concile Vatican II, dans #italic Lumen gentium#!, a mis en avant le « peuple de Dieu » comme une image ecclésiologique centrale et a souligné la nature de pèlerinage de l’Église ainsi que la dignité commune de tous les baptisés."
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "Consolamentum"
 tenet_consolamentum_latin_desc: "Ô Seigneur, nous avons mené le bon combat, nous avons achevé la course, nous avons gardé la foi. Accueille maintenant Ton serviteur dans la consolation de l’Esprit, afin que son âme soit libérée des liens de ce monde matériel.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Contexte historique','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "Par l’imposition des mains et la prière des fidèles, l’esprit reçoit la consolation divine. Le bon combat a été mené, la course est achevée, et la foi a tenu jusqu’à la fin.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Contexte historique','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "Par le sacrement de la consolation spirituelle, les croyants reçoivent le Saint-Esprit et se préparent à leur passage de ce monde à l’autre.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Contexte historique','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "Le consolamentum était le sacrement central de la foi cathare et combinait des éléments du baptême, de la confirmation, de l’ordination et de l’extrême-onction. On croyait que, par l’imposition des mains, le Saint-Esprit descendait et libérait l’âme du monde matériel.\n\nLa plupart des croyants ne le recevaient qu’à l’article de la mort, tandis que ceux qui le recevaient en pleine santé devenaient des « parfaits » ou « bons hommes » et s’engageaient à mener une vie d’ascétisme strict. Ce rite trouvait ses racines dans les pratiques paléochrétiennes du baptême spirituel et montre une influence possible des traditions bogomiles orientales."
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "Matrimonium sacrum" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "Hieròs gámos" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "Ô Seigneur, ce n’est pas par convoitise que nous nous sommes unis dans cette union sacrée, mais avec sincérité et en toute vérité. Accorde-nous de trouver miséricorde et de vieillir ensemble, en préservant le caractère sacré de notre lien.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Contexte historique','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "Le mariage au sein de la communauté des croyants préserve la lignée sacrée et garantit la pureté devant Dieu. Ces unions sont bénies non par la convoitise, mais par la vérité, afin que la miséricorde soit accordée à l’homme et à la femme.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Contexte historique','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "Le mariage sacré au sein de la communauté des croyants garantit la pureté spirituelle et préserve le caractère sacré de la lignée religieuse à travers les générations.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Contexte historique','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "Le concept de mariage sacré ou d’endogamie, c’est-à-dire le fait de se marier exclusivement au sein d’une même communauté religieuse, trouve ses racines dans de nombreuses traditions. Dans le zoroastrisme, le xwedodah (mariage entre parents) était pratiqué afin de préserver les mérites spirituels et les biens familiaux. Cette pratique visait à maintenir la pureté religieuse, à consolider le pouvoir spirituel et à préserver les lignées sacrées et royales.\n\nElle était souvent considérée comme controversée et mal comprise par les étrangers, tandis que ses adeptes voyaient dans ces mariages l’accomplissement de commandements divins destinés à préserver la sainteté de leur communauté."
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "Ô Sagesse divine, cachée depuis des temps immémoriaux, révèle-nous les mystères du monde spirituel. Libère nos âmes de la prison de la matière, afin que nous puissions nous élever vers la plénitude de la lumière et de la connaissance.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Contexte historique','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "Le véritable salut passe par la gnose, cette connaissance secrète des choses divines qui échappe au monde matériel. Nous proclamons la sagesse de Dieu dans le mystère, cette sagesse cachée qui a été décrétée avant les siècles pour notre gloire.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Contexte historique','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "Le salut s’obtient grâce à une connaissance spirituelle secrète qui révèle l’étincelle divine qui réside en chacun et le chemin permettant d’échapper au monde matériel créé par le Démiurge.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Contexte historique','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "Le gnosticisme englobe divers mouvements religieux du début de l’ère chrétienne qui mettaient l’accent sur le salut par la gnose, ou connaissance ésotérique. Les gnostiques considéraient généralement le monde matériel comme la création imparfaite d’une divinité inférieure (le Démiurge), tandis que le vrai Dieu restait caché et transcendant. On croyait que les âmes humaines renfermaient des étincelles divines emprisonnées dans la matière, qui pouvaient être libérées grâce à une connaissance secrète.\n\nParmi les principaux maîtres gnostiques figuraient Valentin, Basilide et Marcion. Des Pères de l’Église comme Irénée et Tertullien ont beaucoup écrit contre les enseignements gnostiques, qu’ils considéraient comme des déviations hérétiques par rapport au christianisme apostolique."
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "Pax et bonum" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "Ptōkhoì kērykes" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "Ô Seigneur, de même que Tu as envoyé Tes apôtres sans or ni argent, de même nous partons dans la pauvreté, ne comptant que sur Ta providence. Accorde-nous la grâce de prêcher Ton Évangile dans la simplicité et la vérité.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Contexte historique','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "À l’instar du Christ, qui n’avait pas d’endroit où poser Sa tête, les prêcheurs mendiants font vœu de pauvreté. N’emportant rien pour la route, ils s’en remettent à la Providence de Dieu tout en proclamant l’Évangile.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Contexte historique','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "Les ordres religieux voués à la pauvreté et à la prédication parcourent le monde sans biens pour répandre la foi et comptent sur la divine Providence pour subvenir à leurs besoins quotidiens.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Contexte historique','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "Les ordres mendiants sont apparus au XIIIe siècle en réaction à la richesse et à la mondanité de l’Église. Le deuxième concile de Lyon, en 1274, a reconnu quatre ordres mendiants principaux : les Carmélites, les Franciscains de François d’Assise, les Dominicains de Dominique de Guzmán et les Augustins.\n\nContrairement aux ordres monastiques, qui disposaient de biens communs, les religieux mendiants prônaient la pauvreté personnelle et collective et vivaient presque exclusivement d’aumônes. Ils se concentraient dans les villes, où ils prêchaient et mettaient l’accent sur l’instruction. L’idéal mendiant se référait directement aux instructions données par le Christ aux apôtres de ne rien emporter lors de leur voyage (Matthieu 10:9-10)."
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "Quinque sedes" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "Là où les fidèles se rassemblent au nom du Christ, il est présent parmi eux. Les cinq grands sièges épiscopaux de Rome, Constantinople, Alexandrie, Antioche et Jérusalem constituent les piliers de l’Église.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Contexte historique','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "L’Église est dirigée par les cinq patriarcats fondés à l’époque apostolique. Là où deux ou trois sont réunis en Son nom, le Christ est présent, et c’est par le biais de la pentarchie que Son autorité s’exerce dans le monde entier.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Contexte historique','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "L’Église universelle est dirigée par cinq sièges patriarcaux antiques, chacun exerçant son autorité sur sa région, et qui maintiennent l’unité par la communion conciliaire.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Contexte historique','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "La pentarchie était le modèle de gouvernement de l’Église qui reconnaissait cinq grands sièges patriarcaux : Rome, Constantinople, Alexandrie, Antioche et Jérusalem. Officialisée par le concile de Chalcédoine en 451 après J.-C., elle reflétait l’importance politique de ces villes au sein de l’Empire romain. Chaque patriarche exerçait son autorité sur sa région et les différends étaient tranchés par des conciles œcuméniques.\n\nCe système n’a jamais été pleinement accepté par Rome qui revendiquait la suprématie papale, a été ébranlé par le siège d’Alexandrie en 641 après J.-C., et s’est effondré lors du Grand Schisme de 1054. La chrétienté orthodoxe orientale a continué d’honorer l’idéal pentarchique en établissant de nouveaux patriarcats, notamment en Russie et en Serbie."
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "Fides indefessa" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "Pístis akatapónētos" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "Ô Seigneur, fortifie notre foi, la ferme assurance des choses qu’on espère, la démonstration de celles qu’on ne voit pas. Aide-nous à rester fermes face à toute adversité et à ne jamais faiblir dans notre dévotion envers Toi.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Contexte historique','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "La foi est l’assurance des choses qu’on espère, la démonstration de celles qu’on ne voit pas. Inébranlable, elle permet aux fidèles de surmonter toutes les épreuves et les persécutions, et rester fermes jusqu’à la mort.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Contexte historique','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "Une foi que ni la persécution, ni les épreuves, ni le doute ne peuvent ébranler. Les croyants sont appelés à rester fermes dans leurs convictions, quelles qu’en soient les conséquences dans ce monde.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Contexte historique','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "Tout au long de l’histoire chrétienne, les martyrs et les confesseurs ont servi de modèles. Depuis les premières persécutions sous Néron et Dioclétien, jusqu’aux procès ultérieurs, en passant par les missionnaires qui, comme Adalbert de Prague, ont trouvé la mort en tentant de convertir des peuples hostiles, les chrétiens ont été appelés à préserver leur foi jusqu’à la mort.\n\nLa conviction que la foi devait être défendue, préservée et diffusée à tout prix a inspiré de nombreux mouvements monastiques et entreprises missionnaires. Les récits de saints ayant subi la torture et l’exécution pour leur foi ont servi à renforcer la détermination des croyants et offraient une voie vers le salut."
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "Miaphysisme"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "Le concile d’Éphèse n’était pas un #italic latrocinium#!. L’erreur de Chalcédoine doit être corrigée. Les natures divine et humaine sont unies en la personne unique du Christ, sans mélange, sans changement, sans division et sans séparation.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Contexte historique','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "Le concile d’Éphèse n’a pas eu tort de réhabiliter Eutychès et de condamner Flavien. Le Christ possède une nature divine et humaine unifiée, pleinement Dieu et pleinement homme, unies sans confusion ni séparation.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Contexte historique','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "Le Christ possède une nature divine et humaine, indissociablement unies dans l’Incarnation.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Contexte historique','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "Du grec #italic mia#!, « un », et #italic physis#!, « nature », le miaphysitisme soutient qu’en Christ, les natures divine et humaine sont unies en une seule nature composite, sans confusion ni séparation. Défendu par Cyrille d’Alexandrie, qui a utilisé la formule #italic mia physis tou theou logou sesarkōménē#! (une est la nature incarnée de Dieu le Verbe), il se distingue du monophysisme en affirmant la pleine réalité des deux natures au sein de l’unité.\n\nLe concile de Chalcédoine, en 451 après J.-C., a rejeté cette formule au profit du dyophysisme (deux natures), et les Églises orthodoxes orientales (copte, arménienne, éthiopienne et syriaque) se sont séparées de l’Église byzantine et ont conservé leur théologie miaphysite jusqu’à aujourd’hui."
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[character|E] [GetTrait('honest').GetName( GetNullCharacter )|l] : #P +10%#! de gain en [piety|El]@piety_icon!, #P +10#! d’[opinion|El] du [clergy|El]"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[character|E] [GetTrait('deceitful').GetName( GetNullCharacter )|l] : #N -10%#! de gain en [piety|El]@piety_icon!, #N -10#! en [opinion|El] du [clergy|El]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#![piety_i] en [piety|El] chaque année tant que votre [liege|El] n’a pas votre [faith|El]"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "Hésychasme"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "Ô Seigneur, accorde-nous la grâce du silence sacré. Permets-nous de Te trouver, Toi qui résides dans la lumière inaccessible. Apprends-nous à prier sans cesse, afin que nos cœurs deviennent des temples de Ta présence.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Contexte historique','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "Seigneur Jésus-Christ, Fils de Dieu, aie pitié du pécheur que je suis. Par le silence du corps et de l’esprit, par la répétition incessante de la prière du cœur, fais-moi monter vers la théoria, la vision de la lumière divine incréée.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Contexte historique','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "Grâce au silence intérieur, à la prière contemplative et à la répétition de la prière de Jésus, les fidèles peuvent faire l’expérience d’une communion directe avec Dieu et contempler Sa lumière incréée.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Contexte historique','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "L’hésychasme (#italic hēsykhía#! en grec signifie « silence ») est une tradition contemplative du christianisme oriental qui met l’accent sur les prières du cœur et trouve ses racines dans les Pères du désert égyptiens du IVe siècle. Sa pratique centrale est devenue la prière répétée à Jésus : « #weak Seigneur Jésus-Christ, Fils de Dieu, aie pitié du pécheur que je suis#! », souvent coordonnée avec la respiration et les battements du cœur.\n\nAu XIVe siècle, saint Grégoire Palamas a défendu les moines hésychastes du mont Athos, et leurs visions de la Lumière incréée du mont Thabor lors de la Transfiguration, contre les accusations d’hérésie portées par Barlaam de Calabre. Les conciles de Constantinople de 1341 et 1351 ont défendu Palamas et établi l’hésychasme comme doctrine orthodoxe."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "#P Augmentation#! de la [piety|El]@piety_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! pour prendre la [decision|El] de [GetDecisionWithKey('meditate_in_seclusion_decision').GetName|l] à votre [capital|El]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! du [clergy|El] de ce [rite|El] procure de la [piety|El]@piety_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "[character|E] [GetTrait('patient').GetName( GetNullCharacter )|l] : #P +10%#! de gain de [piety|El]@piety_icon!, #P +10%#! de gain en [spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[character|E] [GetTrait('impatient').GetName( GetNullCharacter )|l] : #N -10%#! de gain en [piety|El]@piety_icon!"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[character|E] avec un [GetTrait('journaller').GetName( GetNullCharacter )|l], [GetTrait('contrite').GetName( GetNullCharacter )|l], qui [GetTrait('confider').GetName( GetNullCharacter )|l] et qui pratique l’[GetTrait('flagellant').GetName( GetNullCharacter )] : #P +10%#! en perte de [stress|El], #P +5%#! de gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "Gain de [piety|El]@piety_icon! et d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! en perdant un niveau de [stress|El] (au maximum une fois par an)"
 pam_hesychasm_meditation_toast: "De votre [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l] : bonus de méditation en silence chez soi"
 pam_hesychasm_stillness_toast: "De votre [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l] : quiétude du cœur"
 hesychasm_anachoresis_mortification_exclusivity_desc: "Les personnages ne peuvent avoir qu’un des [core_tenets|El] suivants à la fois : [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )], [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )], [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )], [GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )]"
 # Anachoresis tenet
 tenet_anachoresis_latin_name: "Vita eremitica" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "Anachorèse"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "Ô Seigneur, tout comme Tu as conduit Ton Fils dans le désert pour le préparer à Son ministère, conduis-nous aussi dans le désert de nos cœurs. Dans la solitude et le silence, aide-nous à fuir les distractions du monde et à ne trouver que Toi.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Contexte historique','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "Heureux ceux qui se retirent du monde, car ils trouveront Dieu dans le silence du désert. Tels les prophètes qui vivaient dans des grottes et des cavernes, les serviteurs du Christ recherchent la solitude pour mener leur combat contre les passions.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Contexte historique','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "En se retirant de la société profane pour vivre dans le désert, les fidèles peuvent atteindre la pureté spirituelle, vaincre leurs passions et se rapprocher de Dieu grâce à la prière solitaire et à la discipline ascétique.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Contexte historique','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "L’anachorèse, du grec #italic anakhorēsis#! signifiant « retrait », désigne la pratique des ermites qui se retiraient de la société pour mener une vie solitaire faite de prière, de jeûne et de combat spirituel contre les forces démoniaques. Ce mouvement a vu le jour en Égypte au IIIe siècle avec saint Paul de Thèbes, traditionnellement considéré comme le premier ermite chrétien, qui a fui les persécutions de l’empereur Dèce pour se réfugier dans le désert de Thèbes vers 250 après J.-C.\n\nLes anachorètes restèrent courants tout au long du Moyen Âge ; ils vivaient dans des cellules isolées rattachées à des monastères et recevaient l’Eucharistie par une petite fenêtre appelée « hagioscope ». Des textes d’orientation, tels que l’#italic Ancrene Wisse#! anglais du XIIIe siècle, établissaient des règles pour eux."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "Obtient le [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "#P Augmentation#! de la [piety|El]@piety_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! pour prendre la [decision|El] de [GetDecisionWithKey('meditate_in_seclusion_decision').GetName|l] loin de votre [capital|El]"
 religious_decision.0211_anachoresis_tt: "#EMP En raison de votre [personal_tenet|El] [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )] :#!"
