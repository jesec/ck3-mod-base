l_french:
 # Scheme
 gdp_incite_unrest_scheme: "Incitation aux troubles"
 gdp_incite_unrest_scheme_desc: "Semer le mécontentement parmi les soldats de la capitale afin de les monter contre leur chef."
 gdp_incite_unrest_scheme_desc_general: "Semer le mécontentement parmi les soldats de la capitale afin de les monter contre leur chef."
 gdp_incite_unrest_scheme_action: "Inciter aux troubles"
 GDP_INCITE_UNREST_SUCCESS_DESC: "Des agitateurs ont semé le trouble parmi la population. L’opinion populaire à la capitale du seigneur lige va se retourner contre lui."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "Le complot visant à semer le trouble à la capitale a été découvert."
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "Complot abandonné"
 gdp_incite_unrest_scheme_owner_not_republic: "Nous n’avons plus de gouvernement républicain et ne pouvons donc pas poursuivre ce complot."
 # Interaction
 gdp_incite_unrest_start_interaction: "Inciter aux troubles"
 gdp_incite_unrest_scheme_interaction_tt_approved: "Œuvrer en secret pour attiser la discorde parmi le petit peuple de [recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V] et réduire l’[popular_opinion|El] à l’égard [recipient.Custom('FR_du_Char_Pi')][recipient.GetTitledFirstNameNoTooltip|V]."
 gdp_incite_unrest_scheme_start_notification: "Complot débuté"
 gdp_incite_unrest_scheme_target_tt: "Quelqu’un complote contre vous."
 # Success messages
 gdp_incite_unrest_scheme_success_t: "Les troubles s’étendent"
 gdp_incite_unrest_scheme_success_liege_t: "Troubles à la capitale"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "Le complot tombe à l’eau"
 gdp_incite_unrest_scheme_failure_desc: "Nos agitateurs ne sont pas parvenus à attiser la colère contre [scope:target.Custom('FR_le_Char_Pi')][scope:target.GetTitledFirstName] et le complot s’est soldé par un échec ; le peuple reste insensible"
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "Complot révélé"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "Les fauteurs de troubles ont atteint leur but : le mécontentement gagne les rues de [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], tandis que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] perd la confiance du peuple."
 gdp_incite_unrest_scheme_event.0005.a: "Le peuple est prêt à se laisser mener encore plus loin."
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "Partout en [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], le mécontentement gronde. Quelqu’un a monté les gens contre [ROOT.Char.Custom('FR_le_Char_Pi')][ROOT.Char.GetTitledFirstName] et le malaise ne cesse de grandir."
 gdp_incite_unrest_scheme_event.0006.a: "Je dois rétablir l’ordre."
 # County modifier
 gdp_incite_unrest_county_modifier: "Imprégné de dissidence"
 gdp_incite_unrest_county_modifier_desc: "Des agitateurs sont à l’œuvre et montent le peuple contre le dirigeant."
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "Comploteur discrédité"
 gdp_caught_inciting_unrest_modifier_desc: "Ce patricien a été pris en flagrant délit de sédition contre le chef de la République. Les autres Maisons et les électeurs le considèrent avec méfiance."
