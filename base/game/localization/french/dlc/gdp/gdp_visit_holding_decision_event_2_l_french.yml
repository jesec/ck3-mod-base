l_french:
 gdp_visit_holding_decision_event.1200.t: "Rendre visite au mécène"
 gdp_visit_holding_decision_event.1200.intro_desc: "Lorsque j’entre dans la [ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l] de [ROOT.Char.GetCurrentLocation.GetName], je suis subjugué[ROOT.Char.Custom('FR_E')] par l’opulence des lieux. Partout où je pose le regard, je découvre des objets et des ornements d’une valeur inestimable : des tapisseries en [patron.Custom('RegionalFabric')], des statues et des meubles d’une facture magistrale. Le délicieux parfum [patron.Custom('GetExpensiveMeal')] embaume l’air.\n\nPerdu[ROOT.Char.Custom('FR_E')] au milieu d’une foule de serviteurs pressés,"
 gdp_visit_holding_decision_event.1200.all_available_desc: "je découvre [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] qui annonce mon arrivée, tandis que [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] se tient à proximité. Je dois me ressaisir et présenter ma proposition."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "je découvre [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] qui m’invite à approcher. Cela signifie sans doute que c’est une affaire urgente. Je dois me ressaisir et présenter ma proposition."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "je tombe sur [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] qui me fait signe de m’approcher, alors qu’il n’y a aucune trace [patron.Custom2('FR_du_MyCharacterIntroductionNoComma', ROOT.Char)]. Je suppose qu’[patron.Custom('FR_IlElle')] est trop occupé[patron.Custom('FR_E')] pour me rencontrer. Je dois me ressaisir et faire ma proposition."
 gdp_visit_holding_decision_event.1200.representative_desc: "j’aperçois [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] qui m’attend pour m’accueillir au nom [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstNameNoTooltip], [patron.Custom('FR_LequelLaquelle')] – m’a-t-on dit – est indisponible. Je dois me ressaisir et présenter ma proposition."
 gdp_visit_holding_decision_event.1200.none_available_desc: "j’essaie en vain de trouver [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] ou n’importe qui d’autre auprès duquel plaider ma cause... Je suppose que j’aurais dû prendre rendez-vous."
 gdp_visit_holding_decision_event.1200.a: "Je veux davantage de contrôle sur les marchés [ROOT.Char.GetCurrentLocation.GetCulture.GetCollectiveNounNoTooltip|l]."
 gdp_visit_holding_decision_event.1200.a.tt: "Votre proposition pourrait déboucher sur l’opportunité suivante :$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "Je vais rechercher des opportunités d’investissement."
 gdp_visit_holding_decision_event.1200.b.tt: "La recherche d’opérations financières pourrait déboucher sur l’opportunité suivante :$gdp_visit_holding_decision_effect_prestige$ "
 gdp_visit_holding_decision_event.1200.c: "À la réflexion..."
 gdp_visit_holding_decision_event.1200.c.tt: "Revenez en arrière pour voir ce que [THIS.Char.GetCurrentLocation.GetName] a d’autre à offrir"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "Ma liste d’associés impressionne [negotiator.Custom('FR_le_Char_Pi')][negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "Les noms que je cite n’ont aucune importance"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "Mes propos sont offensants"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "Mes compétences en matière d’organisation convainquent [negotiator.Custom('FR_le_Char_Pi')][negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "Je bafouille mon argumentation"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "Mon grand livre présente des traces de détournement de fonds"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "Je parviens à convaincre [negotiator.Custom('FR_le_Char_Pi')][negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.Custom('FR_le_Char_Pi')|U][negotiator.GetTitledFirstNameNoTooltip] ne se laisse pas convaincre"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.Custom('FR_le_Char_Pi')|U][negotiator.GetTitledFirstNameNoTooltip] est offensé[negotiator.Custom('FR_E')] par mes mensonges"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.Custom('FR_le_Char_Pi')|U][negotiator.GetTitledFirstNameNoTooltip] est impressionné[negotiator.Custom('FR_E')] par mes connaissances"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "Mes analyses approfondies de la théorie économique ennuie [negotiator.Custom('FR_le_Char_Pi')][negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "Je parviens à faire en sorte que [negotiator.Custom('FR_le_Char_Pi')][negotiator.GetTitledFirstNameNoTooltip] se sente bête"
 gdp_visit_holding_decision_event.1200.a_martial.success: "Mes connaissances en logistique en temps de guerre impressionnent [negotiator.Custom('FR_le_Char_Pi')][negotiator.GetTitledFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "Je finis par passer pour [Select_CString(GetPlayer.IsFemale,'une impostrice','un imposteur')]"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "Mes exemples ressemblent à des menaces"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.Custom('FR_le_Char_Pi')|U][negotiator.GetTitledFirstNameNoTooltip] est très impressionné[negotiator.Custom('FR_E')] par ma force"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.Custom('FR_le_Char_Pi')|U][negotiator.GetTitledFirstNameNoTooltip] bâille"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.Custom('FR_le_Char_Pi')|U][negotiator.GetTitledFirstNameNoTooltip] interprète à tort ma démonstration physique comme une menace"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "Vous avez récemment demandé des privilèges commerciaux [patron.Custom('FR_au_Char_U_Pi')][patron.GetShortUIName] – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "Vous avez récemment échangé de l’or contre du prestige avec [patron.Custom('FR_le_Char_U_Pi')][patron.GetShortUIName] – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$ : un marché compétitif"
 gdp_visit_holding_decision_event.1201.all_available_desc: "D’un geste accueillant, [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] m’invite à approcher. Je passe rapidement en revue mon offre une dernière fois. Il est de la plus haute importance pour la compagnie commerciale [ROOT.Char.GetHouse.GetName] que cet accord soit conclu.\n\nEn m’approchant, je ressens l’aura de supériorité qui émane de [patron.GetFirstName].\n\n « Formulez clairement votre offre, et je vous ferai peut-être la faveur de donner suite. »"
 gdp_visit_holding_decision_event.1201.patron_available_desc: "D’un geste intimidant, [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] m’invite à approcher. Je passe rapidement en revue mon offre une dernière fois. Il est de la plus haute importance pour la compagnie commerciale [ROOT.Char.GetHouse.GetName] que cet accord soit conclu.\n\nEn m’approchant, je ressens l’aura de supériorité qui émane de [patron.GetFirstName].\n\n « Formulez clairement votre offre, et je vous ferai peut-être la faveur de donner suite. »"
 gdp_visit_holding_decision_event.1201.steward_available_desc: "D’un geste accueillant, [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] m’invite à approcher. Je passe rapidement en revue mon offre une dernière fois. Il est de la plus haute importance pour la compagnie commerciale [ROOT.Char.GetHouse.GetName] que cet accord soit conclu.\n\n « Formulez clairement votre offre, et j’évaluerai si c’est dans l’intérêt [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstName]. »"
 gdp_visit_holding_decision_event.1201.representative_desc: "D’un geste calme et maîtrisé, [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] m’invite à approcher. Je passe rapidement en revue mon offre une dernière fois. Il est de la plus haute importance pour la compagnie commerciale [ROOT.Char.GetHouse.GetName] que cet accord soit conclu.\n\n « Formulez clairement votre offre, et j’évaluerai si c’est dans l’intérêt [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstName]. »"
 gdp_visit_holding_decision_event.1201.a: "« Laissez-moi jeter un œil à ce projet de contrat... »"
 gdp_visit_holding_decision_event.1201.b: "« Vous êtes tenus de respecter votre parole, n’est-ce pas ? »"
 gdp_visit_holding_decision_event.1201.c: "Non, oublions ça."
 gdp_visit_holding_decision_event.1201.c.tt: "Revenez à votre audience pour voir quelle autre proposition vous pouvez formuler."
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$ : une proposition d’investissement"
 gdp_visit_holding_decision_event.1202.all_available_desc: "Je reste là, les bras croisés, tandis que [patron.GetFirstName] parcourt ma proposition. Un léger froncement de sourcils se dessine entre ses sourcils lorsqu’[patron.Custom('FR_IlElle')] lève les yeux des documents.\n\n« Mm... Je vois... Je suppose que je pourrais envisager de me porter garant[patron.Custom('FR_E')] pour vous et la compagnie commerciale [ROOT.Char.GetHouse.GetName] pour cette somme. Cela devrait suffire pour que vous gagniez un peu en réputation, n’est-ce pas, [ROOT.Char.GetFirstNameNoTooltip] ? »"
 gdp_visit_holding_decision_event.1202.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)] semble, à en juger par son air, plutôt intéressé[patron.Custom('FR_E')] tandis que je lui explique ma proposition.\n\n« Cela suffira pour que vous gagniez en réputation, [ROOT.Char.GetFirstNameNoTooltip]. »"
 gdp_visit_holding_decision_event.1202.steward_available_desc: "Je reste patiemment à ses côtés pendant que [steward.GetFirstName] parcourt ma proposition. Visiblement intéressé[steward.Custom('FR_E')] par le contenu, [steward.Custom('FR_IlElle')] lève les yeux vers moi.\n\n« Cette proposition est bien rédigée. Je dois vous l’accorder... Je pense que je pourrais envisager de me porter garant[steward.Custom('FR_E')] pour vous et la compagnie [ROOT.Char.GetHouse.GetName] auprès [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstName]. »"
 gdp_visit_holding_decision_event.1202.representative_desc: "Je reste patiemment à côté tandis que [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] lit ma proposition à la demande [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstNameNoTooltip]. Manifestant un intérêt pour le contenu, [negotiator.Custom('FR_IlElle')] lève les yeux vers moi.\n\n« Cette proposition est bien rédigée. Je vais faire en sorte qu’elle retienne l’attention [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstNameNoTooltip]. »"
 gdp_visit_holding_decision_event.1202.a: "« Peut-être pourrions-nous négocier... »"
 gdp_visit_holding_decision_event.1202.b: "« J’accepte votre offre. »"
 gdp_visit_holding_decision_event.1202.b.success: "Transaction réussie !"
 gdp_guards_were_summoned.tt: "[patron.Custom('FR_le_Char_U_Pi')|U][patron.GetShortUIName] ne veut plus vous revoir pendant un moment – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]"
 gdp_caught_stealing.tt: "Vous avez récemment été pris[THIS.Char.Custom('FR_E')] en train de voler dans un lieu saint et êtes banni[THIS.Char.Custom('FR_E')] jusqu’au [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]"
 gdp_visit_holding_decision_event.1000.b.tt: "Un appel à votre [merchant_patron|El] pourrait offrir les opportunités suivantes : $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Votre [merchant_patron|El] ou son représentant doit être présent"
 gdp_visit_holding_decision_event.1500.t: "Visiter [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "De retour sur le site [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3], tout est comme d’habitude. Alors que le soleil se déplace lentement dans le ciel, les bâtiments adjacents de la place offrent tour à tour leur ombre à l’espace ouvert."
 gdp_visit_holding_decision_event.1500.desc_returned_02: "Une forte odeur d’encens me monte inexorablement aux narines alors que je traverse la pénombre pour retourner sur le terrain [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "Je cligne des yeux alors que je sors de la pénombre de la cabane [Select_CString(laamp_healer_character.IsFemale,'de la guérisseuse','du guérisseur')] et que je cherche mon chemin pour retourner sur le terrain [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "En franchissant les portes de l’enceinte [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3], un calme arcadien m’enveloppe lorsque je me retrouve à nouveau sur la grande place."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "Je reviens du jardin plus [Select_CString(ROOT.Char.IsFemale,'légère','léger')] et regarde la place animée [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "Je suis les ruelles sinueuses qui m’éloignent du bureau de [merchant_physician_recruit.GetFirstNameNoTooltip] et me retrouve sur le terrain [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3]."
 gdp_visit_holding_decision_event.1500.desc: "Un certain calme règne sur la grande place [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3], bien que l’on y fasse beaucoup de commerce et que de nombreux [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural], ainsi que leurs assistants y circulent.\n\n[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] magnifique se dresse au centre, et sur les côtés je découvre des panneaux avec des promesses de guérison audacieuses, ainsi qu’un jardin où l’on peut se plonger dans la contemplation de la véritable nature [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nAu bord de la place, un fidèle prêche une meilleure santé physique, et comme convenu auparavant, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('1500_sickly_minor'))] malade, [1500_sickly_minor.GetFirstName], a été escorté[1500_sickly_minor.Custom('FR_E')] jusqu’à la cabane du guérisseur et m’y attend."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nAu bord de la place, [Select_CString(merchant_physician_recruit.IsFemale,'une croyante','un croyant')] prêche qu’une meilleure santé physique favorise notre santé spirituelle. [merchant_physician_recruit.GetSheHe|U] reste ferme malgré le chahut occasionnel de la foule paysanne."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nComme convenu auparavant avec l’une des personnes du camp, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName] a été escorté[1500_sickly_minor.Custom('FR_E')] jusqu’à la cabane du guérisseur et m’y attend."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] acquiesce de la tête et scrute la place animée à la recherche d’étals intéressants."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nJe jette un regard satisfait sur la place et respire profondément tout en réfléchissant à la prochaine étape."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName], visiblement fatigué[visiting_partner.Custom('FR_E')], demande : « Je ne suis pas du genre à me plaindre tout le temps, mais... en avons-nous fini ici ? »"
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nAprès avoir passé un temps considérable dans l’enceinte [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3], je suis satisfait[ROOT.Char.Custom('FR_E')] de ma journée et cherche le chemin le plus rapide pour retourner à la place principale."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n[Select_CString(merchant_physician_recruit.IsFemale,'La prédicatrice','Le prédicateur')] continue de dispenser ses enseignements sur la santé, mais semble approcher de la fin de son discours."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nPour une raison inconnue, il y a apparemment maintenant une abondance d’enfants sur la place. Étaient-ils là depuis le début ? Ils jouent et se défoulent et trouvent constamment de nouvelles façons de faire de vieilles choses, souvent à la surprise et à l’agacement de ceux qui les surveillent.\n\nJe ne peux m’empêcher de penser à l’état de [1500_sickly_minor.GetFirstName] alors que je choisis ma prochaine cible sur la place."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\nSur ma gauche, [visiting_partner.GetFirstName] examine avec curiosité un étal de minuscules flacons prétendument remplis de gouttes du venin d’[ROOT.Char.Custom('VenomousCreature')].\n\nY penser me donne la chair de poule, alors que je me demande où aller ensuite."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] me donne un coup de coude sur l’épaule et me désigne les gardes qui escortent hors du bâtiment une personne en haillons qui hurle à propos de la fin du monde.\n\nJe hausse instinctivement les sourcils et observe l’agitation tout en réfléchissant à ce que je vais faire ensuite."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] me tend un morceau pendant notre promenade sur la place.\n\nJe mâche la ration séchée tout en réfléchissant à ce que je vais faire."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nDans un coin ombragé de la place, un bonimenteur essaie de convaincre un[ROOT.Char.Custom('FR_E')] noble des propriétés curatives du sable rouge.\n\nJ’observe avec désinvolture la querelle tout en réfléchissant à ce que je vais faire."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nPrès d’un étal de miroirs d’obsidienne tout proche, un [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] tente de dissimuler son excitation lorsqu’il a enfin l’occasion de se contempler.\n\nLégèrement amusé[ROOT.Char.Custom('FR_E')], j’essaie de décider où aller ensuite."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nPrès d’une petite rotonde, un marchand qui vend [ROOT.Char.Custom('RandomReligiousTextName')] en fait la lecture à un public qui l’écoute humblement.\n\nJ’écoute d’un air distrait, tout en observant la place et en réfléchissant à ce que je vais faire ensuite."
 gdp_visit_holding_decision_event.1500.a: "Je chercherai la bénédiction des guérisseurs."
 gdp_visit_holding_decision_event.1500.a_second: "Je retourne auprès des guérisseurs."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Peut-être que les guérisseurs pourront aider [1500_sickly_minor.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip] m’attend toujours."
 gdp_visit_holding_decision_event.1500.a.tt: "Une visite aux guérisseurs pourrait offrir l’opportunité suivante :$gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "Vous avez récemment rendu visite aux guérisseurs – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]"
 gdp_visit_holding_decision_event.1500.b: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] m’intrigue."
 gdp_visit_holding_decision_event.1500.b_second: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] mérite une autre visite."
 gdp_visit_holding_decision_event.1500.b.tt: "Entrer dans le lieu de culte pourrait offrir les opportunités suivantes :$gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "Vous avez récemment visité le lieu de culte local – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]"
 gdp_visit_holding_decision_event.1500.c: "Les jardins sont intéressants."
 gdp_visit_holding_decision_event.1500.c_second: "Je vais encore jeter un coup d’œil aux jardins."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ Méditation religieuse et réduction du [stress|El]"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ Recherche de provisions"
 gdp_visit_holding_decision_event.1500.c.tt: "Une visite des jardins pourrait offrir les opportunités suivantes :$gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "Vous avez visité les jardins récemment – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]"
 gdp_visit_holding_decision_event.1500.d: "Est-ce un prêcheur, là-bas ?"
 gdp_visit_holding_decision_event.1500.d_second: "J’ai des affaires en suspens avec [merchant_physician_recruit.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1500.d.tt: "Parler avec le médecin pourrait offrir l’opportunité suivante :$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "Je vais m’occuper d’autres choses."
 gdp_visit_holding_decision_event.1501.intro: "La lumière est tamisée et il y a une odeur perceptible dans la cabane [Select_CString(merchant_healer_character.IsFemale,'de la guérisseuse','du guérisseur')]. Pas désagréable, mais pénétrante.\n\n[merchant_healer_character.GetFirstName] se tient à une table haute et prépare une décoction."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$ : [Select_CString(merchant_healer_character.IsFemale,'la guérisseuse','le guérisseur')]"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ Lorsque nous entrons, [Select_CString(merchant_healer_character.IsFemale,'une femme','un homme')] nous regarde avec un sourire radieux.\n\n« Bienvenue dans mon humble demeure ! Je m’appelle [merchant_healer_character.GetFirstNameNoTooltip]. Comment puis-je vous aider ? »"
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName], qui est malade, vient avec moi dans la cabane [Select_CString(merchant_healer_character.IsFemale,'de la guérisseuse','du guérisseur')]. [1500_sickly_minor.GetSheHe|U] tousse beaucoup pendant que je [1500_sickly_minor.Custom('FR_LeLa')] porte dans les escaliers.\n\n[Select_CString(merchant_healer_character.IsFemale,'La guérisseuse','Le guérisseur')], [merchant_healer_character.GetFirstName], se lève de son tabouret en bois et me regarde d’un air sombre : « Avez-vous besoin de mes services ? »"
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "Lorsque nous entrons dans la cabane [Select_CString(merchant_healer_character.IsFemale,'de la guérisseuse','du guérisseur')], [merchant_healer_character.GetFirstName] est en train d’effectuer une procédure de purification sur [Select_CString(ROOT.Char.IsFemale,'une patiente âgée','un patient âgé')]. [visiting_partner.GetFirstName] observe [merchant_healer_character.GetFirstNameNoTooltip] avec empressement, une lueur d’excitation dans les yeux : « Ça ne me dérangerait pas de m’y mettre aussi... »\n\n[merchant_healer_character.GetFirstNameNoTooltip] lève les yeux en entendant nos voix : « Je ne vous avais pas [Select_CString(And(visiting_partner.IsFemale,ROOT.Char.IsFemale),'vues','vus')] ! Quelque chose vous fait souffrir ? »"
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ [merchant_healer_character.GetSheHe|U] lève les yeux et hausse légèrement les sourcils. « Je vois que vous avez réussi à revenir ici en un seul morceau ! Comment puis-je vous aider cette fois-ci ? »"
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName] est allongé[1500_sickly_minor.Custom('FR_E')] sur un lit moelleux près du feu dans la cabane [Select_CString(merchant_healer_character.IsFemale,'de la guérisseuse','du guérisseur')] et attend mon retour. Je me penche rapidement pour vérifier sa respiration et lui caresse les cheveux.\n\n[merchant_healer_character.GetFirstName] pose sa [ROOT.Char.Custom('WritingInstrument')] et me regarde d’un air sombre : « Sur quoi nous sommes-nous [Select_CString(And(merchant_healer_character.IsFemale,ROOT.Char.IsFemale),'mises','mis')] d’accord ? »"
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "Lorsque nous entrons dans la cabane [Select_CString(merchant_healer_character.IsFemale,'de la guérisseuse','du guérisseur')], [merchant_healer_character.GetFirstName] réfléchit à des herbes, mais lève les yeux vers nous lorsque nous descendons l’escalier : « Ah, vous avez donc changé d’avis ? »\n\nÀ ma gauche, [visiting_partner.GetFirstNameNoTooltip] trottine, toujours [Select_CString(visiting_partner.IsFemale,'désireuse','désireux')] d’essayer [visiting_partner.Custom('FR_LuiElle')]-même la procédure que nous avons vu [merchant_healer_character.GetFirstNameNoTooltip] exécuter plus tôt."
 gdp_visit_holding_decision_event.1501.desc_returned_01: "[merchant_healer_character.GetFirstName] est en train de s’occuper d’un autre patient lorsque je descends les escaliers et entre dans sa cabane. [merchant_healer_character.GetSheHe|U] jette un bref coup d’œil dans ma direction avant de faire signe à son patient de s’asseoir sur un lit plus loin dans la pièce.\n\n[merchant_healer_character.GetSheHe|U] tire un rideau de fortune fait d’un drap déchiré, afin d’assurer un peu d’intimité au patient et à nous-mêmes.\n\n« Je vois que vous êtes de retour », remarque-t-[merchant_healer_character.GetSheHe] avec empressement : « Avez-vous besoin de mon aide pour quelque chose ? »"
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Lorsque je pénètre à nouveau dans la cabane faiblement éclairée [Select_CString(merchant_healer_character.IsFemale,'de la guérisseuse','du guérisseur')], [merchant_healer_character.GetFirstName] est assis[merchant_healer_character.Custom('FR_E')] un peu plus loin dans la pièce et feuillette un livre usé. Il est difficile de le voir de loin, mais il semble contenir des représentations du corps humain.\n\n[merchant_healer_character.GetSheHe|U] le referme délicatement, le range, puis me regarde et dit d’une voix calme : « Ah, vous êtes donc de retour. Avez-vous finalement trouvé quelque chose qui vous fait souffrir ? »"
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nDu coin de l’œil, j’aperçois quelques objets médicaux, dont une magnifique corne qui attire mon attention."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nUn peu plus loin dans la pièce, une magnifique [1500_health_artifact.GetName] repose toujours au milieu de tous les autres objets médicaux."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nUn peu plus loin dans la pièce, sur une étagère remplie d’objets médicaux, j’aperçois un curieux objet – [1500_health_artifact.GetName]."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nUn peu plus loin dans la pièce, un objet – [1500_health_artifact.GetName] – continue de susciter mon intérêt."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "« Je suis intéressé[ROOT.Char.Custom('FR_E')] par cet objet – [1500_health_artifact.GetNameNoTooltip]. »"
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "« [1500_sickly_minor.GetFirstNameNoTooltip], m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('1500_sickly_minor'))], a besoin d’un traitement ! »"
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Échec du traitement"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "Le traitement échoue"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "Réussite du traitement"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$ : [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "Un sermon vient de s’achever lorsque nous rentrons dans [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]. [merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName], un balai à la main, range délicatement et nettoie le sol sacré pour tous les visiteurs qui viennent ici dans le but de prier ou par désir de se recueillir.\n\n[merchant_clergy_character.GetSheHe|U] lève les yeux quand je m’approche, et un doux sourire étire ses lèvres : « Bon retour dans l’étreinte chaleureuse [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]. Pourquoi ne pas rester un peu et profiter de l’environnement ? »"
 gdp_visit_holding_decision_event.1503.desc_returned_02: "[merchant_clergy_character.Custom('SisterBrother')|U] [merchant_clergy_character.GetFirstName] est assis[merchant_clergy_character.Custom('FR_E')] sur l’un des bancs en face de la chaire et semble perdu[merchant_clergy_character.Custom('FR_E')] dans ses pensées lorsque je pénètre à nouveau dans [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship].\n\n[merchant_clergy_character.GetSheHe|U] tourne la tête dans ma direction regardant par-dessus son épaule lorsque je m’approche : « Laissez ces pieds fatigués se reposer un instant, mon enfant. Comment puis-je vous aider ? »"
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "Alors que je franchis les remarquables portes [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3], les [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]s qui s’occupent de ce lieu viennent de répartir leurs tâches pour la journée.\n\nJe jette un coup d’œil dans l’allée principale et reconnais inopinément [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName], qui me jette un regard impénétrable et s’approche de moi : « Mon enfant rebelle. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName|U] vous a ramené[ROOT.Char.Custom('FR_E')] [Select_CString(ROOT.Char.IsFemale,'saine et sauve','sain et sauf')] jusqu’à notre porte ! »"
 gdp_visit_holding_decision_event.1503.desc: "Lorsque je franchis les portes [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3], je suis impressionné[ROOT.Char.Custom('FR_E')] par le travail qui a dû être fourni pour les structures raffinées et le décor sacré.\n\nL’un des [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]s qui s’occupent de ce lieu me remarque et s’approche d’un air recueilli : « Bonjour, mon enfant. Je suis [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName]. Comment puis-je vous aider ? »"
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "Je suppose..."
 gdp_visit_holding_decision_event.1503.b: "« Peut-être que [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] pourrait bénir notre compagnie ? »"
 gdp_visit_holding_decision_event.1503.c: "J’ai grandement besoin de ces dons."
 gdp_visit_holding_decision_event.1503.c_guarded: "Encore un don, dans ma bourse."
 gdp_visit_holding_decision_event.1503.c_master_thief: "« Psst, [visiting_partner.GetFirstNameNoTooltip], gardez l’œil ouvert ! »"
 gdp_visit_holding_decision_event.1503.c.flavor: "Faire diversion et récupérer quelques pièces. Facile."
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Hmm. Les gardes circulent étrangement beaucoup plus souvent par ici..."
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Vol réussi"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "Vous réussissez à voler les dons"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "Banni"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "Vous êtes banni[GetPlayer.Custom('FR_E')] [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3]"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Gardes appelés"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "Lorsque je remets le don à [merchant_clergy_character.GetFirstName], ses yeux s’écarquillent : « Vous... vous ressemblez à Son... Son... Je le jure... » [merchant_clergy_character.GetSheHe|U] me fixe un instant, ouvrant et fermant la bouche comme un poisson hors de l’eau.\n\nPuis, comprenant ce qu’[merchant_clergy_character.GetSheHe] est en train de faire, [merchant_clergy_character.GetSheHe] se ressaisit et se racle la gorge : « Ce serait un honneur pour moi de consacrer ma vie à votre cause. »"
 gdp_visit_holding_decision_event.1504.desc: "Le sourire de [merchant_clergy_character.GetFirstName] s’élargit lorsqu’[merchant_clergy_character.Custom('FR_IlElle')] se penche vers moi et pose une main sur mon épaule : « C’est très aimable à vous, mon enfant. Je comprends qu’il n’est pas toujours facile pour [Select_CString(ROOT.Char.IsFemale,'une marchande','un marchand')] comme vous de se séparer de son argent. »\n\n[merchant_clergy_character.GetSheHe|U] hoche la tête en signe d’approbation et sa main retombe à ses côtés, tandis que son regard continue de se poser sur moi."
 gdp_visit_holding_decision_event.1504.a: "« Peut-être que [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] pourrait bénir notre affaire ? »"
 gdp_visit_holding_decision_event.1504.a_epiphany: "« Je ne m’intéresse qu’à la grâce [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive]. »"
 gdp_visit_holding_decision_event.1504.b: "« Nous pourrions en effet avoir besoin de quelqu’un. »"
 gdp_visit_holding_decision_event.1504.c: "« Je ne me soucie que de mon prochain. »"
 gdp_visit_holding_decision_event.1504.c_epiphany: "... nous ne recrutons pas pour le moment."
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$ : le jardin"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "Le calme règne encore dans le jardin. Certains visiteurs discutent à voix basse dans les zones assises, tandis que d’autres sont plongés dans une contemplation silencieuse de la nature.\n\nJ’écoute les murmures et la brise. Grâce au vent dans les arbres, je me sens soudain beaucoup plus à l’aise."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "Cette fois-ci, je découvre un petit oiseau dans un [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')], en train de tester ses ailes pour la première fois.\n\nIl glisse doucement sur le bord du nid, mais ses ailes sont emmêlées et, le temps d’un battement de cils, l’oiseau tombe en chute libre dans les airs, jusqu’à ce que... le vent le rattrape doucement et l’emmène en lieu sûr. Un sentiment de soulagement se répand dans ma poitrine."
 gdp_visit_holding_decision_event.1505.desc: "Le jardin est entouré par des haies, et sur les monticules se dressent des arbres où l’on peut observer quelques oiseaux et écureuils à travers le feuillage.\n\nJe sens une présence assez forte ici, au milieu de toute cette beauté. Et si j’avais eu [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] à mes côtés durant toutes les épreuves que j’ai traversées ?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nUn peu plus loin sur la route, [visiting_partner.GetFirstName] regarde encore une fois les plantes comestibles."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nEt plus loin sur la route, j’aperçois encore d’autres plantes qui s’étirent au soleil de l’après-midi."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nDerrière moi, j’entends [visiting_partner.GetFirstName] marmonner chaque fois que nous tombons sur une autre plante obscure, mais comestible au cours de notre promenade."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nDu coin de l’œil, je remarque de beaux fruits sauvages et des herbes qui contribuent à la luxuriance du jardin."
 gdp_visit_holding_decision_event.1505.a: "Je me sens en paix."
 gdp_visit_holding_decision_event.1505.a_convert: "Il y a vraiment du bon dans la foi [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjectiveNoTooltip]."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "Vous avez contemplé ce jardin récemment – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.b: "Il serait dommage de gaspiller ces plantes."
 gdp_visit_holding_decision_event.1505.b_partner: "« [visiting_partner.GetFirstNameNoTooltip], et si nous cherchions de la nourriture dans la nature ? »"
 gdp_visit_holding_decision_event.1505.b_flavor: "C’est le moment de la cueillette !"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "Vous avez récolté les fruits de ce jardin récemment – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.c: "« ... tant de recoins cachés, [visiting_partner.GetFirstNameNoTooltip]... »"
 gdp_visit_holding_decision_event.1505.c.flavor: "C’est vraiment divin."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "Vous vous êtes reposé[GetPlayer.Custom('FR_E')] dans ce jardin récemment – réessayez après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$ : le médecin"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "La porte du bureau de [merchant_physician_recruit.GetFirstName] est entrouverte et, à travers celle-ci, je l’observe couper les cheveux d’un patient, assis droit comme un i, à l’aide de ciseaux effroyablement aiguisés et fins.\n\nJe frappe à la porte et entre, attirant l’attention du médecin sur moi : « Je ne vous avais pas vu[ROOT.Char.Custom('FR_E')]. Que vouliez-vous ? »"
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName] se tient devant sa porte et examine l’épaule [Select_CString(ROOT.Char.IsFemale,'d’une femme','d’un homme')] qui semble souffrir.\n\n[merchant_physician_recruit.GetSheHe|U] termine la visite, donne des instructions sur la meilleure façon de soigner l’articulation, puis s’adresse à moi : « Vous êtes de retour. Voulez-vous quelque chose cette fois-ci ? »"
 gdp_visit_holding_decision_event.1507.desc_returned_03: "En montant prudemment l’escalier menant au bureau de [merchant_physician_recruit.GetFirstName], je jette un coup d’œil par la porte ouverte.\n\n[merchant_physician_recruit.GetSheHe|U] est plongé[merchant_physician_recruit.Custom('FR_E')] dans une sorte d’exercice physique consistant à s’accroupir et se relever encore et encore.\n\nAprès un certain nombre de répétitions, [merchant_physician_recruit.Custom('FR_IlElle')] s’arrête, s’essuie le front et boit une gorgée d’une bouteille proche. Son regard aiguisé comme un rasoir se pose sur moi : « Vous êtes persévérant[ROOT.Char.Custom('FR_E')], hein ? »"
 gdp_visit_holding_decision_event.1507_desc_intro: "Je suis [merchant_physician_recruit.GetFirstName] dans une ruelle étroite, monte quelques marches et entre dans son bureau. La pièce est encombrée d’étagères où se trouvent des écrits relatifs aux humeurs corporelles, à la santé et à la spiritualité.\n\n[merchant_physician_recruit.GetSheHe|U] s’assoit sur l’unique chaise du bureau, caresse d’un air distrait un petit talisman, puis remarque enfin ma présence : "
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$« Oh. Ne vous ai-je pas déjà vu[ROOT.Char.Custom('FR_E')] quelque part ? Que voulez-vous ? »\n\nJe pèse soigneusement mes mots, avant de répondre :"
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$« Oh. Vous. Vous vouliez quelque chose ? »\n\n« J’ai vu votre exposé sur les plus démunis », réponds-je. J’hésite avant de poursuivre :"
 gdp_visit_holding_decision_event.1507.a: "« Voulez-vous travailler pour moi ? »"
 gdp_visit_holding_decision_event.1507.b: "« Aidez-moi à renforcer l’enthousiasme de mes associés ! »"
 gdp_visit_holding_decision_event.1507.c: "« S’exercer permet de ne pas perdre la main. Rejoignez ma compagnie. »"
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.Custom('FR_le_Char_U_Pi')|U][merchant_physician_recruit.GetShortUIName] est d’accord avec vous"
 gdp_visit_holding_decision_event.1507.c.failure: "Vous ne parvenez pas à attirer [merchant_physician_recruit.Custom('FR_le_Char_U_Pi')][merchant_physician_recruit.GetShortUIName]"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.Custom('FR_le_Char_U_Pi')|U][merchant_physician_recruit.GetShortUIName] vous ignore"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "Retournez sur le site [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship3] et voyez ce qu’ils ont d’autre à offrir."
