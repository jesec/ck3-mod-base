l_french:
 gdp_adopt_republic_government_decision: "Adopter les idéaux républicains"
 gdp_adopt_republic_government_decision_desc: "J’observe la foule qui défile dans les rues, marquée par sa lutte quotidienne pour la survie. Je me demande si notre mode de vie [ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l] est réellement la seule voie possible pour un dirigeant. Pourrais-je m’assurer la loyauté de mes sujets grâce à une reconnaissance méritée plutôt que par mon seul droit de naissance ? Peut-être est-il temps d’adopter de nouveaux idéaux et de repenser notre mode de vie."
 gdp_adopt_republic_government_decision_tooltip: "Adopter les idéaux républicains et devenir une [GetGovernment('republic_government').GetName|l]"
 gdp_adopt_republic_government_decision_confirm: "Adopter les idéaux républicains"
 liege_has_granted_city_charter: "Votre [liege|El] vous a accordé une charte citadine"
 liege_has_granted_city_charter_duration: "Votre [liege|El] vous a accordé une charte citadine #weak (jusqu’au [GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )])#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X Vous ne serez plus un [elector|El] du [GetTitleByKey('e_hre').GetName]#!"
 gdp_adopt_republican_ways_decision: "Adopter les méthodes républicaines"
 gdp_adopt_republican_ways_decision_desc: "Les assemblées qui nous unissaient autrefois sont désormais gangrenées par les murs et les marchés. Si [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] espère prospérer un jour, nous devons abandonner nos coutumes tribales et faire de notre ville une république."
 gdp_adopt_republican_ways_decision_tooltip: "Abandonner nos coutumes [Concept('tribal', 'tribales')|E] et devenir une [republic|El]"
 gdp_adopt_republican_ways_decision_confirm: "Adopter les méthodes républicaines"
 gdp_tribal_capital_becomes_city_tt: "Votre [realm_capital|El] deviendra une [city_holding|El]"
 gdp_other_tribal_holdings_become_castles_tt: "Toutes les autres [tribal_holdings|El] dans le pays deviendront des [castle_holdings|El]"
 gdp_tribal_vassals_will_feudalize_tt: "Vos [vassals|El] [Concept('tribal', 'tribaux')|E] adopteront le [government|El] [feudal|El] ou [Concept('clan','clanique')|El]"
 convert_to_feudalism_from_republic_decision: "Adopter un gouvernement [ROOT.Char.Custom('GetTribalReformGovernment')]"
 convert_to_feudalism_from_republic_decision_desc: "Les assemblées, les procédures et la bureaucratie limitent l’efficacité de notre gouvernement. Nous devons nous débarrasser de ces contraintes si nous voulons assurer la prospérité de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 convert_to_feudalism_from_republic_decision_confirm: "Adopter un gouvernement [ROOT.Char.Custom('GetTribalReformGovernment')]"
 convert_to_feudalism_from_republic_decision_tooltip: "Changer le type de [government|El]"
 patricians_becomes_merchants_desc: "Les [vassals|El] [patricians|El] deviennent des [merchants|El]"
 gdp_restore_roman_republic_decision: "Rétablir la république romaine"
 gdp_restore_roman_republic_decision_desc: "La République romaine était un bastion de liberté et de prospérité, un véritable modèle à suivre. Néanmoins, comme beaucoup de choses en ce monde, elle est tombée en ruines. Il est temps de lui redonner vie et de lui rendre toute sa gloire !"
 gdp_restore_roman_republic_decision_tooltip: "Rétablir la république romaine"
 gdp_restore_roman_republic_decision_confirm: "Rétablir la république romaine"
 restore_roman_republic_make_rome_capital_desc: "Vous pouvez désigner [GetTitleByKey('c_roma_urbs').GetName] comme [realm_capital|El]"
 assembly_members_appointed_as_senators_desc: "Tous les membres de l'[assembly|El] seront nommés [republic_senators|El]"
 gdp_popular_mandate_decision: "Appel au soutien populaire"
 gdp_popular_mandate_decision_desc: "Les habitants de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] m'adorent. Je peux exploiter cette popularité pour appuyer ma candidature. La voix du peuple revêt une importance capitale au sein de l'assemblée, mon influence se retrouverait décuplée si j'avais son soutien en tant que [ROOT.Char.GetTitleAsNameNoTooltip|l].\n\nCette faveur m'en coûtera, mais c'est aujourd'hui qu'il faut remporter le vote, pas demain."
 gdp_popular_mandate_decision_tooltip: "Dépenser de l'[popular_opinion|El] en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pour obtenir un vote supplémentaire lors de la prochaine [election|El]"
 gdp_popular_mandate_decision_confirm: "Rallier le peuple derrière moi"
 gdp_popular_mandate_no_active_mandate_desc: "Ne bénéficie pas du soutien populaire"
 gdp_civic_labor_decision: "Main d'œuvre citoyenne directe"
 gdp_civic_labor_decision_desc: "Le soutien de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] constitue une ressource aussi précieuse que l'or. Je vais demander à ses citoyens de mettre leurs efforts et leur expertise au service de mes projets de construction, ce qui me coûtera une partie de leur bonne volonté."
 gdp_civic_labor_decision_tooltip: "Dépenser de l'[popular_opinion|El] en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pour obtenir des bonus de construction de domicile de [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 gdp_civic_labor_decision_confirm: "Solliciter les citoyens"
 gdp_popular_gifts_decision: "Solliciter un patronage"
 gdp_popular_gifts_decision_desc: "Le soutien des citoyens de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] me confère de l'influence. Je vais déclarer que [ROOT.Char.Custom('FR_le_Char_L')][ROOT.Char.GetTitleAsNameNoTooltip|l] reçoit des offres de la part des grandes familles patriciennes, ce qui déclenchera une lutte d'influence entre elles. Dans tous les cas, le palais en sortira vainqueur."
 gdp_popular_gifts_decision_tooltip: "Dépenser de l'[popular_opinion|El] pour initier une lutte d'influence parmi les familles patriciennes, et ainsi permettre au palais de gagner de l'[gold|El] et des cadeaux"
 gdp_popular_gifts_decision_confirm: "Lancer les enchères"
 gdp_popular_gifts_artifact_tt: "Vous avez reçu un [artifact|El] aléatoire en cadeau"
 gdp_glorification_decision: "Accepter la glorification"
 gdp_glorification_decision_desc: "Le peuple de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] m'accorde un soutien qui va bien au-delà de la politique ou de la popularité. Ils ne me considèrent pas comme leur dirigeant[ROOT.Char.Custom('FR_E')], mais comme l'incarnation même de la ville. J'accepterai cet honneur comme il se doit."
 gdp_glorification_decision_tooltip: "Acceptez la glorification des citoyens de la ville. Un honneur totalement unique."
 gdp_glorification_decision_confirm: "Autoriser les célébrations"
 gdp_glorification_artifact_tt: "Vous avez reçu l'[artifact|El] #V $gdp_glorification_artifact_name$#!"
 gdp_glorification_artifact_name: "Médaille de la gloire civique"
 gdp_glorification_artifact_desc: "Une médaille commémorative offerte par les citoyens de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] en l'honneur de leur [ROOT.Char.GetTitleAsNameNoTooltip|l] bien-aimé[ROOT.Char.Custom('FR_E')]."
 gdp_popular_mandate_decision_toast: "Soutien populaire assuré"
 gdp_civic_labor_decision_toast: "Main d'œuvre citoyenne mobilisée"
 gdp_popular_gifts_decision_toast: "Réponse des patriciens"
 gdp_glorification_decision_toast: "La ville organise des célébrations"
 gdp_fund_alms_decree_decision: "Distribuer des aumônes à la capitale"
 gdp_fund_alms_decree_decision_desc: "En tant que [ROOT.Char.GetTitleAsNameNoTooltip|l], il m’incombe de veiller au bien-être des citoyens de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Il existe de nombreuses raisons de distribuer des aumônes : aider les plus démunis, accroître la prospérité de la ville et renforcer les liens qui unissent notre société.\n\nQuelle que soit la raison pour laquelle on le fait, prendre soin des pauvres est un moyen éprouvé de s’assurer la faveur des masses."
 gdp_fund_alms_decree_decision_tooltip: "Donner l’aumône en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 gdp_fund_alms_decree_decision_confirm: "Donner l’aumône"
 gdp_tax_holiday_decree_decision: "Allègement fiscal"
 gdp_tax_holiday_decree_decision_desc: "Pour les années à venir, les taxes imposées aux citoyens de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] seront réduites. Notre trésorerie en pâtira, mais c'est un faible prix à payer pour obtenir le soutien du peuple."
 gdp_tax_holiday_decree_decision_tooltip: "Réduire les impôts de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pour augmenter l'[popular_opinion|El]"
 gdp_tax_holiday_decree_decision_confirm: "Réduire les impôts de la ville"
 gdp_debt_forgiveness_decree_decision: "Remise de dette"
 gdp_debt_forgiveness_decree_decision_desc: "De nombreux citoyens de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] sont accablés par des dettes qu'ils ne pourront jamais rembourser. Annuler leurs obligations envers la ville constituerait un moyen d'alléger leur fardeau et d'obtenir leur loyauté. Certains n'approuveront pas cette utilisation du Trésor public, mais obtenir le soutien du peuple serait un excellent moyen de consolider notre influence."
 gdp_debt_forgiveness_decree_decision_tooltip: "Annuler la dette des citoyens de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pour obtenir un bonus important d'[popular_opinion|El]"
 gdp_debt_forgiveness_decree_decision_confirm: "Annuler les dettes"
 gdp_debt_forgiveness_upset_patricians_tt: "Chaque [vassal|El] sans l’[house_ambition|El] [GetHouseAspiration( 'republic_communal' ).GetName|V]"
 gdp_debt_forgiveness_pleased_patricians_tt: "Chaque [vassal|El] avec l’[house_ambition|E] [GetHouseAspiration( 'republic_communal' ).GetName|V]"
 gdp_finance_war_decree_decision: "Financer l’effort de guerre"
 gdp_finance_war_decree_decision_desc: "La guerre est une affaire terrible et, surtout, coûteuse. Si cela s’avérait nécessaire, nous pourrions prélever des impôts supplémentaires liés à la guerre afin de garantir les moyens nécessaires à l’effort de guerre."
 gdp_finance_war_decree_decision_tooltip: "Prélever des impôts supplémentaires pour financer les guerres en cours"
 gdp_finance_war_decree_decision_confirm: "Prélever un impôt de guerre"
 finance_war_patrician_tax_name: "Impôt patricien"
 finance_war_patrician_tax_desc: "$finance_war_patrician_tax_name$"
 finance_war_patrician_tax_tooltip: "Prélever un impôt supplémentaire sur les [patricians|El]"
 finance_war_citizen_tax_name: "Impôt citoyen"
 finance_war_citizen_tax_desc: "$finance_war_citizen_tax_name$"
 finance_war_citizen_tax_tooltip: "Prélever un impôt supplémentaire sur les [counties|El]"
 every_patrician_tt: "Chaque [patrician|El]"
 gdp_war_approval_decree_decision: "Demander l’approbation de la guerre"
 gdp_war_approval_decree_decision_desc: "Ce n’est que par la volonté de l’Assemblée que nous pouvons déclarer la [war|El]. Il peut s’avérer nécessaire, ici ou là, de donner un petit coup de pouce pour obtenir suffisamment de voix, mais cela se fait dans l’intérêt général."
 gdp_war_approval_decree_decision_tooltip: "Demander la permission à l’[assembly|El] de déclarer une [war|El]"
 gdp_war_approval_decree_decision_confirm: "Demander l’approbation de la guerre"
 gdp_war_approval_decree_decision_effect_desc: "Vous obtenez l’autorisation de déclarer une [war|El]"
 must_have_assembly_approval_declare_war_desc: "Vous n’avez pas l’approbation de l’[assembly|El] pour déclarer la [war|El]"
 gained_assembly_approval_declare_war_desc: "Vous avez obtenu l’approbation de l’[assembly|El] pour déclarer la [war|El]"
 gdp_banishment_approval_decree_decision: "Demander une autorisation de bannissement"
 gdp_banishment_approval_decree_decision_named: "Demander le bannissement [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.Custom('FR_du_Char_U_Pi')][ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_banishment_approval_decree_decision_desc: "Certains parmi nous refusent de respecter la loi, or nous ne parvenons pas à les remettre sur le droit chemin. Avec l'autorisation de l'assemblée, nous pouvons [banish|El] ces hors-la-loi et mettre un terme à leurs exactions, sans s'exposer aux représailles d'une solution plus définitive."
 gdp_banishment_approval_decree_decision_tooltip: "Demander à l’[assembly|El] l'autorisation de [banish|El] le personnage accusé"
 gdp_banishment_approval_decree_decision_confirm: "Demander une autorisation de bannissement"
 gdp_banishment_approval_decree_decision_effect_desc: "Vous obtenez l'autorisation de [banish|El] [indicted_character.Custom('FR_le_Char_U_Pi')][indicted_character.GetShortUIName]"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "Vous obtenez l'autorisation de [banish|El] un personnage que vous avez accusé"
 must_have_assembly_approval_banishment_desc: "L’[assembly|El] ne vous autorise pas à [banish|El] le personnage accusé"
 gained_assembly_approval_banishment_desc: "L’[assembly|El] a déjà donné l'autorisation de [banish|El] [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.Custom('FR_le_Char_U_Pi')][ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_proscription_approval_decree_decision: "Demander une autorisation d'exil"
 gdp_proscription_approval_decree_decision_named: "Demander l'exil de la famille [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip]"
 gdp_proscription_approval_decree_decision_desc: "Le sang ne ment jamais. La famille du traître partage toujours la même malveillance et la même perfidie. Si l'assemblée l'autorise, nous pourrions [banish|El] toute sa famille et nous débarrasser de leurs cœurs pernicieux."
 gdp_proscription_approval_decree_decision_tooltip: "Demander à l’[assembly|El] l'autorisation de [banish|El] toute la famille du personnage accusé"
 gdp_proscription_approval_decree_decision_confirm: "Demander une autorisation d'exil"
 gdp_proscription_approval_decree_decision_effect_desc: "Vous obtenez l'autorisation de [banish|El] toute la famille [indicted_character.Custom('FR_du_Char_U_Pi')][indicted_character.GetShortUIName]"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "Vous obtenez l'autorisation de [banish|El] toute la famille d'un personnage que vous avez accusé"
 must_have_assembly_approval_proscription_desc: "L’[assembly|El] ne vous autorise pas à [banish|El] toute la famille"
 gained_assembly_approval_proscription_desc: "L’[assembly|El] a déjà donné l'autorisation de [banish|El] toute la famille [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.Custom('FR_du_Char_U_Pi')][ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_execution_approval_decree_decision: "Demande une autorisation d'exécution"
 gdp_execution_approval_decree_decision_named: "Demander l'exécution [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.Custom('FR_du_Char_U_Pi')][ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_execution_approval_decree_decision_desc: "Malgré la bienveillance de notre règne, certains ennemis de l'État menacent ses fondations. Le risque qu'ils représentent est tel que nous ne connaîtrons pas la paix tant qu'ils seront en vie. Si l'assemblée l'autorise, nous pourrions les [execute|El] afin d'apaiser le peuple."
 gdp_execution_approval_decree_decision_tooltip: "Demander à l’[assembly|El] l'autorisation d'[execute|El] le personnage accusé"
 gdp_execution_approval_decree_decision_confirm: "Demande une autorisation d'exécution"
 gdp_execution_approval_decree_decision_effect_desc: "Vous obtenez l'autorisation d'[execute|El] [indicted_character.Custom('FR_le_Char_U_Pi')][indicted_character.GetShortUIName]"
 gdp_execution_approval_decree_decision_effect_no_indicted_desc: "Vous obtenez l'autorisation d'[execute|El] un personnage que vous avez accusé"
 must_have_assembly_approval_execution_desc: "L’[assembly|El] ne vous autorise pas à [execute|El] le personnage accusé"
 gained_assembly_approval_execution_desc: "L’[assembly|El] a déjà donné l'autorisation d'[execute|El] [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.Custom('FR_le_Char_U_Pi')][ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_has_no_valid_indicted_character_desc: "Vous n'avez accusé personne devant l'[assembly|El]"
 gdp_has_no_valid_indicted_family_desc: "Vous n'avez pas accusé le chef d'une [patrician_family|El] devant l'[assembly|El]"
 gdp_indicted_family_head_is_player_desc: "Le chef de la [patrician_family|El] accusée ne peut pas être un joueur"
 gdp_overthrow_government_decision: "Renverser le gouvernement"
 gdp_overthrow_government_decision_desc: "Les dirigeants de cette république sont corrompus jusqu’à la moelle. Il est temps de remettre l’État sur la bonne voie et de renverser les corrompus et les faibles, afin que la vertu républicaine règne à nouveau en [ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nJe trouverai des soutiens, et ensemble, nous renverserons le gouvernement [ROOT.Char.GetLiege.Custom('FR_du_Char_Pi')][ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]."
 gdp_overthrow_government_decision_tooltip: "Renverser l’actuel gouvernement de la [republic|El] et vous proclamer comme son dirigeant"
 gdp_overthrow_government_decision_confirm: "Délivrez-nous des tyrans !"
 you_are_patrician_desc: "Vous êtes un [patrician|El] sans terre"
 overthrow_government_effect_tooltip: "#WEAK Cette décision lancera un [hostile_scheme|El] pour renverser le gouvernement.#!\n$EFFECT_LIST_BULLET$ Vous pourriez devenir le nouveau [liege|El]\n$EFFECT_LIST_BULLET$ Vos [rivals|El] ou ennemis politiques pourraient quitter la [republic|El]\n$EFFECT_LIST_BULLET$ Les lois de la république changeront pour s’adapter aux ambitions de votre Maison sans approbation de l’[assembly|El]\n#alert_trial Conspirer contre l’État est un [crime|El] grave, s’il est découvert#!@alert_icon!"
 gdp_overthrow_agent_focus_balance: "Équilibre entre [agents|El]"
 gdp_overthrow_agent_focus_success: "Se concentrer sur l’augmentation du [scheme_potential|El] par les [agents|El]"
 gdp_overthrow_agent_focus_speed: "Se concentrer sur la réduction de la [scheme_speed|El] par les [agents|El]"
 gdp_overthrow_agent_focus_secrecy: "Se concentrer sur l’augmentation de la [secrecy|El] par les [agents|El]"
 agent_focus_balance_tooltip: "$overthrow_government_interaction.tt.agent_focus_balance$"
 agent_focus_success_tooltip: "$overthrow_government_interaction.tt.agent_focus_success$"
 agent_focus_speed_tooltip: "$overthrow_government_interaction.tt.agent_focus_speed$"
 agent_focus_secrecy_tooltip: "$overthrow_government_interaction.tt.agent_focus_secrecy$"
 gdp_quarantine_ship_decree_decision: "Mettre en quarantaine"
 gdp_quarantine_ship_decree_decision_desc: "#bold Par décision de l’Assemblée :#!\nUne quarantaine de trente jours est mise en place afin d’endiguer la propagation de vapeurs nocives sources d’épidémies."
 gdp_quarantine_ship_decree_decision_tooltip: "Adopter une quarantaine pour les navires entrant dans le port, augmentant ainsi la [epidemic_resistance|El], mais au prix de [competitiveness|El] pour toutes les [trade_routes|El] connectées au [trade_market|El] de la [capital|El]"
 gdp_quarantine_ship_decree_decision_confirm: "Mise en place d’une quarantaine"
 gdp_quarantine_modifier_desc: "Chaque [character|El] ayant une [trade_route|El] dans le [market|El] de la [capital|El]"
 DECREE_PLAGUE_APOCALYPTIC_DESC: "Une [epidemic|El] apocalyptique frappe le [realm|El]"
 DECREE_PLAGUE_MAJOR_DESC: "Une [epidemic|El] majeure frappe le [realm|El]"
 DECREE_PLAGUE_MINOR_DESC: "Une [epidemic|El] mineure frappe le [realm|El]"
 DECREE_PLAGUE_NONE_DESC: "Aucune [epidemic|El] ne frappe le [realm|El]"
 gdp_enforce_curfew_decree_decision: "Imposer un couvre-feu nocturne"
 gdp_enforce_curfew_decree_decision_desc: "#bold Par décision de l’Assemblée :#!\nUn couvre-feu strict est par la présente instauré afin d’endiguer les activités criminelles nocturnes."
 gdp_enforce_curfew_decree_decision_tooltip: "Un couvre-feu nocturne a été instauré afin de lutter contre les comportements illicites et les complots criminels"
 gdp_enforce_curfew_decree_decision_confirm: "Instauration d’un couvre-feu nocturne"
 gdp_enforce_curfew_decree_decision_effect_desc: "Le couvre-feu nocturne réduira l’efficacité du [hostile_scheme|El] et augmentera le [control|El]"
 gdp_republic_curfew_desc: "Tous les [vassals|El] de la [capital|El]"
 gdp_sponsor_craft_guild_decision: "Parrainer une guilde d'artisans"
 gdp_sponsor_craft_guild_decision_desc: "Dans une république, obtenir le statut de guilde d'artisans octroie d'importants avantages. Par conséquent, de nombreux artisans cherchent à signer une charte officielle, approuvée par l'assemblée. Parrainer une guilde d'artisans constitue une excellente chose pour la ville, et le patricien qui règle les notes de frais devant l'assemblée sera considéré comme un mécène par la nouvelle guilde."
 gdp_sponsor_craft_guild_decision_tooltip: "Parrainer une guilde d'artisans augmentera la [prosperity_growth|El] et l'[urban_tax|El] dans le [county|El] de la [capital|El], en plus d'accroître la [trade_competitiveness|El] de votre [house|E] et la progression de votre [trade_expertise|El]"
 gdp_sponsor_craft_guild_decision_confirm: "Vous avez parrainé une nouvelle guilde d'artisans"
 gdp_request_noble_magistracy_decision: "Demander une magistrature noble"
 gdp_request_noble_magistracy_decision_desc: "Si la plupart des postes de fonctionnaires sont interdits aux patriciens, il existe des rôles réservés aux magistrats nobles, l'emploi idéal pour une âme jeune et ambitieuse qui souhaite apprendre les rouages de l'État et se tailler une réputation."
 gdp_request_noble_magistracy_decision_tooltip: "La magistrature noble augmentera le gain de [dynasty_prestige|El], d'[lifestyle_experience|El] et d'[opinion|El] de votre [heir_possessive|El], mais aussi son [stress_gain|El]"
 gdp_request_noble_magistracy_decision_confirm: "Vous avez demandé une magistrature noble pour votre héritier"
 gdp_request_relief_from_bankruptcy_decision: "Demander une exonération de faillite"
 gdp_request_relief_from_bankruptcy_decision_desc: "Afin d'éviter la misère aux familles les plus renommées, l'assemblée peut puiser dans les coffres de la république pour régler les créanciers et solder les dettes impayées, offrant ainsi une chance aux patriciens ruinés d'émerger des cendres de leur propre faillite."
