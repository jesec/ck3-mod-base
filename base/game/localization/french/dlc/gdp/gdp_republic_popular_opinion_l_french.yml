l_french:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "Opinion populaire faible : population agitée"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "Opinion populaire faible : ville en crise"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "Opinion populaire élevée : bonne humeur"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "Opinion populaire élevée : ville en plein essor"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "Stagnation économique"
 gdp_popular_opinion_mild_neg_prosperity_desc: "Le mécontentement du peuple fait que les citoyens hésitent à investir dans la ville, ce qui ralentit la croissance à long terme."
 gdp_popular_opinion_mild_neg_taxes: "Évitement fiscal"
 gdp_popular_opinion_mild_neg_taxes_desc: "Les citoyens en colère cherchent des moyens de ne pas payer d’impôts, ce qui réduit les recettes de tous les quartiers."
 gdp_popular_opinion_mild_neg_construction: "Retards dans la construction"
 gdp_popular_opinion_mild_neg_construction_desc: "Les ouvriers et les artisans contribuent moins que d’habitude, ce qui augmente les coûts et ralentit l’avancement des travaux."
 gdp_popular_opinion_mild_neg_defense: "Remparts en sous-effectif"
 gdp_popular_opinion_mild_neg_defense_desc: "Les citoyens ne sont pas disposés à servir dans la milice citoyenne, donc la défense de la ville reste en sous-effectif."
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "Effondrement économique"
 gdp_popular_opinion_severe_neg_prosperity_desc: "De profonds troubles ont déchiré l’économie de la ville. La croissance est au point mort et la prospérité décline."
 gdp_popular_opinion_severe_neg_taxes: "Révolte fiscale"
 gdp_popular_opinion_severe_neg_taxes_desc: "Une opposition ouverte à la fiscalité s’est répandue dans tous les quartiers de la ville et nuit considérablement aux recettes publiques."
 gdp_popular_opinion_severe_neg_construction: "Grève des ouvriers du bâtiment"
 gdp_popular_opinion_severe_neg_construction_desc: "Les guildes et les ouvriers refusent de travailler. Les travaux avancent extrêmement lentement et à grands frais."
 gdp_popular_opinion_severe_neg_defense: "Désertion de la garnison"
 gdp_popular_opinion_severe_neg_defense_desc: "Les soldats abandonnent leurs postes ou refusent de servir. Les remparts de la ville sont presque non défendus."
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "Investissements citoyens"
 gdp_popular_opinion_mild_pos_prosperity_desc: "Une population sûre d’elle-même mise sur l’avenir de la ville et renforce la prospérité à long terme."
 gdp_popular_opinion_mild_pos_taxes: "Contribuables volontaires"
 gdp_popular_opinion_mild_pos_taxes_desc: "Les citoyens paient leurs impôts sans broncher, ce qui garantit des recettes plus importantes dans tous les quartiers de la ville."
 gdp_popular_opinion_mild_pos_construction: "Enthousiasme civique"
 gdp_popular_opinion_mild_pos_construction_desc: "Les guildes et les artisans contribuent avec zèle à la croissance de la ville, ce qui réduit les coûts et les délais de construction des nouveaux chantiers."
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "Âge d’or"
 gdp_popular_opinion_strong_pos_prosperity_desc: "La ville déborde d’optimisme. Les citoyens et les marchands investissent sans réserve, ce qui garantit une croissance forte et durable."
 gdp_popular_opinion_strong_pos_taxes: "Coffres débordants"
 gdp_popular_opinion_strong_pos_taxes_desc: "La fierté des habitants pour leur ville se traduit directement par des paiements d’impôts généreux dans tous les quartiers."
 gdp_popular_opinion_strong_pos_construction: "Construction magistrale"
 gdp_popular_opinion_strong_pos_construction_desc: "Les meilleurs artisans aspirent à travailler dans la ville, ce qui réduit les coûts et accélère tous les chantiers."
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "Vendeurs prudents"
 gdp_popular_opinion_mild_neg_sell_price_desc: "L’agitation qui règne dans la ville rend les négociants prudents : ils retiennent leurs marchandises et baissent les prix sur l’ensemble du marché."
 gdp_popular_opinion_mild_neg_capacity: "Réticence du marché"
 gdp_popular_opinion_mild_neg_capacity_desc: "La baisse de confiance pousse certains marchands à réduire leur présence, ce qui restreint la capacité du marché."
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "Panique sur le marché"
 gdp_popular_opinion_severe_neg_sell_price_desc: "La crise qui règne dans les rues a entraîné une forte baisse des prix, les vendeurs s’empressant de se débarrasser de leurs marchandises sur un marché en plein effondrement."
 gdp_popular_opinion_severe_neg_capacity: "Fuite des marchands"
 gdp_popular_opinion_severe_neg_capacity_desc: "Des marchands de renom se retirent complètement de la ville, ce qui entraîne un rétrécissement spectaculaire du marché."
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "Vendeurs sûrs d’eux"
 gdp_popular_opinion_mild_pos_sell_price_desc: "Une ambiance optimiste dans la ville renforce la confiance des vendeurs, ce qui entraîne une hausse des prix sur l’ensemble du marché."
 gdp_popular_opinion_mild_pos_capacity: "Marché en expansion"
 gdp_popular_opinion_mild_pos_capacity_desc: "L’optimisme attire de nouveaux négociants et marchands dans la ville, ce qui entraîne une légère expansion de la capacité du marché."
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "Commerce florissant"
 gdp_popular_opinion_strong_pos_sell_price_desc: "La fierté exceptionnelle des habitants a fait la renommée de la qualité des marchandises sur le marché, ce qui permet à tous les produits d’atteindre les meilleurs prix."
 gdp_popular_opinion_strong_pos_capacity: "Marché en plein essor"
 gdp_popular_opinion_strong_pos_capacity_desc: "La réputation de la ville attire des marchands de partout, ce qui augmente considérablement la capacité commerciale."
