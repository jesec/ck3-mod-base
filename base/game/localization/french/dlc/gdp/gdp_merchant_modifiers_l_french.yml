l_french:
 gdp_merchant_starting_capacity_modifier: "Capacité améliorée"
 gdp_merchant_starting_capacity_modifier_desc: "La compagnie de ce personnage peut transporter un plus grand nombre de biens."
 gdp_voluntary_merchant_modifier: "Marchand volontaire"
 gdp_voluntary_merchant_modifier_desc: "Ce personnage a renoncé à ses titres pour se faire un nom en tant que marchand."
 gdp_patron_competitiveness_modifier: "Incitation à la concurrence"
 gdp_patron_competitiveness_modifier_desc: "Le mécène de ce personnage a été convaincu de développer davantage son activité."
 gdp_romance_fan_modifier: "Romantique invétéré"
 gdp_romance_fan_modifier_desc: "Ce personnage ne peut pas résister à une belle histoire d’amour."
 gdp_nepotism_modifier: "Népotisme encouragé"
 gdp_nepotism_modifier_desc: "Ce personnage estime que la famille passe toujours avant tout, quoi qu’il en coûte."
 gdp_merit_modifier: "Mérite encouragé"
 gdp_merit_modifier_desc: "Ce personnage se moque de savoir d’où proviennent les bénéfices."
 gdp_full_attention_modifier: "Se concentre sur les affaires"
 gdp_full_attention_modifier_desc: "Ce personnage ne perd pas de temps en futilités."
 gdp_responsible_modifier: "Responsabilités assumées"
 gdp_responsible_modifier_desc: "Ce personnage assume ses responsabilités, du moins pour le moment."
 gdp_cooperation_modifier: "Maison coopérative"
 gdp_cooperation_modifier_desc: "Ce personnage collabore avec une autre Maison dans un intérêt mutuel."
 gdp_guild_master_inpiration_diplomacy_modifier: "Aide diplomatique"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "Ce personnage a suivi les conseils d’un maître de guilde rompu à l’art de la diplomatie."
 gdp_guild_master_inpiration_learning_modifier: "Conseils d’érudit"
 gdp_guild_master_inpiration_learning_modifier_desc: "Ce personnage a demandé conseil à un maître de guilde érudit."
 gdp_guild_master_inpiration_stewardship_modifier: "Formation aux finances"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "Ce personnage a suivi l’enseignement d’un maître de guilde."
 gdp_boasted_market_competence_modifier: "Stimulation de la concurrence sur le marché"
 gdp_boasted_market_competence_modifier_desc: "Lorsque son mécène lui a demandé de se ridiculiser devant des nobles, ce personnage a su tirer parti de la situation à son avantage."
 gdp_driven_by_motivation_modifier: "Guidé par l’ambition"
 gdp_driven_by_motivation_modifier_desc: "Ce personnage fait de son mieux pour prouver sa valeur au propriétaire de l’entreprise."
 gdp_promoted_diligence_modifier: "Diligence promue"
 gdp_promoted_diligence_modifier_desc: "Ce personnage a subi des pressions de la part du chef de sa Maison pour qu’il intensifie ses efforts professionnels, même au prix de son bien-être."
 gdp_promoted_excess_modifier: "Excès promu"
 gdp_promoted_excess_modifier_desc: "Ce personnage a été encouragé à mettre de côté le commerce et à vivre avec excès, améliorant la diplomatie et le statut social public de la compagnie."
 gdp_oasis_of_hope_modifier: "Oasis d’espoir"
 gdp_oasis_of_hope_modifier_desc: "Ce groupe de voyageurs a miraculeusement trouvé une oasis dans le désert et a ainsi pu se reposer."
 gdp_low_morale_entourage_modifier: "Suite au moral en berne"
 gdp_low_morale_entourage_modifier_desc: "Ce personnage a décidé de poursuivre son voyage à travers le désert malgré la vague de chaleur."
 organize_the_venture_scheme_modifier: "Affaire organisée"
 organize_the_venture_scheme_modifier_desc: "Ce contrat a été soumis à des délais plus stricts et à une surveillance plus rigoureuse."
 merchant_undercut_the_competition_modifier: "Concurrence impitoyable"
 merchant_undercut_the_competition_modifier_desc: "Ce personnage accepte des marges plus faibles afin d’évincer ses concurrents."
 merchant_cornering_the_market_modifier: "Accapare le marché"
 merchant_cornering_the_market_modifier_desc: "Ce personnage tire parti des récentes pressions économiques pour renforcer sa position sur le marché."
 merchant_public_benefactor_modifier: "Bienfaiteur public"
 merchant_public_benefactor_modifier_desc: "Ce personnage finance des travaux publics à proximité du siège de sa compagnie et transforme les bénéfices en popularité auprès de la population."
 merchant_private_profit_focus_modifier: "Profit privé"
 merchant_private_profit_focus_modifier_desc: "Ce personnage a axé sa compagnie sur les intérêts privés et les avantages commerciaux, au détriment du respect de la collectivité."
 merchant_sponsored_public_works_county_modifier: "Travaux publics financés"
 merchant_sponsored_public_works_county_modifier_desc: "Ce comté a bénéficié des travaux publics et du mécénat d’une société marchande."
 gdp_merge_company_competitiveness_modifier: "Négociant dominant"
 gdp_merge_company_competitiveness_modifier_desc: "Ce personnage a démantelé les routes d’une compagnie concurrente et domine désormais ces marchés."
 gdp_merchant_full_larder_modifier: "Garde-manger complet"
 gdp_merchant_full_larder_modifier_desc: "Ce personnage a gardé de la nourriture pour lui alors que le marché était affamé et il ne manque plus de rien depuis."
 gdp_merchant_staying_vigilant: "Rester sur ses gardes"
 gdp_merchant_staying_vigilant_desc: "Ce personnage s'attend à des représailles, car ses affaires ont causé une famine et il fait attention à chaque ombre croisée."
 gdp_merchant_master_craft_tutelage_modifier: "A reçu l'enseignement d'un maître"
 gdp_merchant_master_craft_tutelage_modifier_desc: "Ce personnage a passé du temps dans l'atelier d'un maître artisan."
 gdp_thirsty_traveler_modifier: "Voyageur assoiffé"
 gdp_thirsty_traveler_modifier_desc: "Ce personnage a dû voyager longuement et loin sans eau."
 gdp_pure_waters_modifier: "Eaux pures"
 gdp_pure_waters_modifier_desc: "La compagnie de ce personnage est remplie et repue d'eau purifiée."
 gdp_rationing_water_modifier: "Eau rationnée"
 gdp_rationing_water_modifier_desc: "La compagnie de ce personnage rationne strictement et efficacement l'eau, ce qui la ralentit pendant qu'elle en cherche davantage."
 gdp_workout_modifier: "Muscles fatigués"
 gdp_workout_modifier_desc: "Ce personnage a effectué une bonne, mais éprouvante séance d'entraînement en coupant des arbres. D'ici quelque temps, il retrouvera ses forces."
 gdp_cat_rats_modifier: "L'aide d'un chat"
 gdp_cat_rats_modifier_desc: "Ce personnage a pu profiter d'un voyage sans aucun rat grâce à un félin assidu."
 gdp_fishing_modifier: "Les joies de la pêche"
 gdp_fishing_modifier_desc: "Ce personnage sait d'expérience à quel point il est enivrant d'attraper une belle prise."
 gdp_catch_rats_modifier: "Chasse aux rats"
 gdp_catch_rats_modifier_desc: "Ce personnage a été forcé d'attraper des rats dans la cale d'un bateau sombre et exigu au détriment de sa santé."
 dedicated_trade_studies: "Étudiant en commerce dévoué"
 dedicated_trade_studies_desc: "Ce personnage a préféré le commerce plutôt que l'administration et s'applique à maîtriser les marchés."
 gdp_local_business_modifier: "Commerce local"
 gdp_local_business_modifier_desc: "Ce personnage a préféré travailler dans des marchés locaux plutôt que de se lancer à la poursuite de la Route de la Soie."
 gdp_silk_road_market_foothold_modifier: "Implantation sur la Route de la Soie"
 gdp_silk_road_market_foothold_modifier_desc: "Ce personnage a récemment déplacé sa compagnie dans un marché de la Route de la Soie et tire parti de ses nouvelles connexions locales."
 tgp_silk_road_interesting_innovations_modifier: "Innovations intéressantes"
 tgp_silk_road_interesting_innovations_modifier_desc: "Ce personnage s’est intéressé aux innovations de la Route de la Soie et en est revenu plus avisé."
 gdp_silk_road_bargain_modifier: "Aubaine sur la Route de la Soie"
 gdp_silk_road_bargain_modifier_desc: "Ce personnage a cherché l’occasion de faire une bonne affaire sur un marché de la Route de la Soie."
 gdp_silk_road_market_investment_modifier: "Investissement dans un marché de la Route de la Soie"
 gdp_silk_road_market_investment_modifier_desc: "Ce personnage a décidé qu’il serait avantageux d’investir dans ce marché de la Route de la Soie."
 gdp_merchant_legacy_3_ennobled_modifier: "Marchand crédible"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "La sagacité commerciale de ce personnage et sa compagnie sont reconnues dans les meilleures salles de réception."
 gdp_merchant_legacy_3_rapacious_modifier: "Comptabilité soignée"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "Ce personnage prend soin de bien vérifier chaque compte de la compagnie et partage ses trouvailles avec ses associés clés."
