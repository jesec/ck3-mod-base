l_french:
 gdp_founded_republic_modifier: "Fondateur républicain"
 gdp_founded_republic_modifier_desc: "Ce personnage a fondé une république."
 gdp_fund_alms_decree_modifier: "Aumône"
 gdp_fund_alms_decree_modifier_desc: "Les dirigeants de cette ville ont récemment fait preuve de générosité en donnant l’aumône aux pauvres."
 gdp_taxed_county_modifier: "Impôt de guerre payé"
 gdp_taxed_county_modifier_desc: "Ce comté a récemment payé des impôts élevés pour financer l’effort de guerre."
 gdp_tax_holiday_decree_modifier: "Allègement fiscal"
 gdp_tax_holiday_decree_modifier_desc: "Les impôts de la ville ont été réduits par décret, une mesure qui a suscité l’enthousiasme des citoyens."
 gdp_trade_support_modifier: "Soutien au commerce"
 gdp_trade_support_modifier_desc: "Ce personnage a bénéficié d’un soutien au commerce de la part d’une république afin d’améliorer ses routes commerciales."
 republic_reliable_caravans_modifier: "Caravanes fiables"
 republic_reliable_caravans_modifier_desc: "Les routes commerciales de ce personnage sont soutenues par des caravanes mieux organisées."
 republic_premium_contracts_modifier: "Contrats de premier ordre"
 republic_premium_contracts_modifier_desc: "Ce personnage a obtenu des contrats avantageux pour la vente de marchandises."
 republic_inspector_bribery_modifier: "Corruption d’inspecteurs"
 republic_inspector_bribery_modifier_desc: "Les inspecteurs du marché de ce personnage ont été compromis par des pots-de-vin."
 gdp_glorification_modifier: "Glorification"
 gdp_glorification_modifier_desc: "Ce dirigeant a été publiquement glorifié par sa ville, son nom est célébré à travers les rues et les couloirs de l’assemblée sans distinction.\n\n[voting_strength|E] de l’[GetLaw( 'republican_elective_succession_law' ).GetName|l] : +1"
 gdp_civic_labor_modifier: "Main-d’œuvre citoyenne"
 gdp_civic_labor_modifier_desc: "Les citoyens de la capitale de ce dirigeant ont été appelés à mettre leur travail et leur expertise à la disposition de tous, réduisant le coût et la durée de la construction des domiciles."
 gdp_popular_mandate_modifier: "Soutien populaire"
 gdp_popular_mandate_modifier_desc: "Ce dirigeant a rallié les citoyens de la capitale sous sa direction avisée, ce qui lui apporte un poids supplémentaire pour les prochaines élections.\n\n#weak Ce [modifier|El] reste actif le temps d’une élection.#!\n\n[voting_strength|E] de l’[GetLaw( 'republican_elective_succession_law' ).GetName|l] : #P +1#!"
 gdp_patrician_promoted_voter_modifier: "Réputation améliorée"
 gdp_patrician_promoted_voter_modifier_desc: "La réputation de ce personnage au sein de la république a progressé grâce à une campagne de promotion réussie.\n[voting_strength|E] de l’[GetLaw( 'republican_elective_succession_law' ).GetName|l] : #P +1#!"
 republic_procedural_advantage_modifier: "Procédures avantageuses"
 republic_procedural_advantage_modifier_desc: "Cette personne a préparé les procédures et les formulaires nécessaires pour faciliter le prochain vote au sein de l’assemblée."
 gdp_pledged_assembly_vote_modifier: "Votes promis à l’assemblée"
 gdp_pledged_assembly_vote_modifier_desc: "Les membres de l’[assembly|El] ont promis leur vote à ce personnage.\n$EFFECT_LIST_BULLET$#V Ils suivront le vote de ce personnage durant la prochaine [voting_session|El]#!"
 gdp_bawdy_song_modifier: "Chanson grivoise"
 gdp_bawdy_song_modifier_desc: "Ce personnage s’inspire des paroles d’une chanson osée."
 gdp_patriotic_song_modifier: "Hymne à la patrie"
 gdp_patriotic_song_modifier_desc: "Ce personnage s’inspire des paroles d’une chanson sur l’amour de la [Glossary( '#bold patrie#!', 'carnival_patria_GLOSS' )]."
 gdp_spiritual_song_modifier: "Chanson spirituelle"
 gdp_spiritual_song_modifier_desc: "Ce personnage s’inspire des paroles d’une chanson spirituelle."
 gdp_rejected_dancefloor_modifier: "Refus de danser"
 gdp_rejected_dancefloor_modifier_desc: "Ce personnage a été rejeté par un partenaire de danse potentiel."
 gdp_accepted_dancefloor_modifier: "Danse acceptée"
 gdp_accepted_dancefloor_modifier_desc: "Ce personnage a demandé à danser, et sa demande a été acceptée."
 gdp_exquisite_mask_modifier: "Masque raffiné"
 gdp_exquisite_mask_modifier_desc: "Ce personnage portait un masque raffiné lors d’un carnaval."
 gdp_terrifying_mask_modifier: "Masque effrayant"
 gdp_terrifying_mask_modifier_desc: "Ce personnage portait un masque effrayant lors d’un carnaval."
 gdp_slanderous_grafitti_modifier: "Graffiti diffamatoire"
 gdp_slanderous_grafitti_modifier_desc: "La famille de ce personnage a été diffamée dans des graffitis dans les ruelles de la ville."
 gdp_domestic_chaos_modifier: "Chaos au domicile"
 gdp_domestic_chaos_modifier_desc: "Ce personnage a vu son domicile mis sens dessus dessous."
 gdp_fragrant_egg_modifier: "Jet d’œuf parfumé"
 gdp_fragrant_egg_modifier_desc: "Ce personnage a été aspergé d’un parfum odorant provenant d’une coquille d’œuf lancée."
 gdp_sympathetic_ear_scheme_modifier: "Une oreille attentive"
 gdp_sympathetic_ear_scheme_modifier_desc: "Ce personnage a quelqu’un à qui il peut se confier au sujet du complot qui se trame à sa Cour."
 gdp_insane_arguments_modifier: "Arguments absurdes"
 gdp_insane_arguments_modifier_desc: "Des arguments absurdes ont été opposés à ce personnage."
 gdp_fatalistic_arguments_modifier: "Arguments fatalistes"
 gdp_fatalistic_arguments_modifier_desc: "Des arguments fatalistes ont été opposés à ce personnage."
 gdp_beautiful_arguments_modifier: "Bel argument"
 gdp_beautiful_arguments_modifier_desc: "Ce personnage a été conseillé par quelqu’un de beau."
 gdp_ugly_arguments_modifier: "Argument laid"
 gdp_ugly_arguments_modifier_desc: "Ce personnage a été conseillé par quelqu’un de laid."
 gdp_intellectual_debate_modifier: "Débat intellectuel"
 gdp_intellectual_debate_modifier_desc: "Un débatteur chevronné a présenté des arguments à ce personnage."
 gdp_advise_of_a_fool_modifier: "Conseil d’idiot"
 gdp_advise_of_a_fool_modifier_desc: "Un imbécile a présenté des arguments à ce personnage."
 gdp_a_way_with_words_modifier: "Habile avec les mots"
 gdp_a_way_with_words_modifier_desc: "Quelqu’un de cultivé a présenté des arguments à ce personnage."
 gdp_sympathetic_ear_scheme_modifier_tt: "Votre [scheme|El] obtient [GetModifier('gdp_sympathetic_ear_scheme_modifier').GetNameWithTooltip]."
 gdp_business_sabotage_modifier: "Sabotage commercial"
 gdp_business_sabotage_modifier_desc: "Les affaires de ce personnage ont été sabotées par un concurrent."
 gdp_arson_modifier: "Feu mystérieux"
 gdp_arson_modifier_desc: "La maison de ce personnage a été incendiée par des inconnus."
 gdp_hardened_position_modifier: "Position durcie"
 gdp_hardened_position_modifier_desc: "Ce personnage a durci sa position en réaction à des intimidations."
 gdp_intimidated_modifier: "Intimidé"
 gdp_intimidated_modifier_desc: "Ce personnage a été intimidé."
 gdp_trentina_quarantine_county_modifier: "Quarantaine maritime"
 gdp_trentina_quarantine_county_modifier_desc: "Une quarantaine maritime a été mise en place afin d’endiguer la propagation des maladies."
 gdp_trentina_quarantine_character_modifier: "Quarantaine maritime"
 gdp_trentina_quarantine_character_modifier_desc: "Les affaires de ce personnage ont été perturbées par une quarantaine maritime."
 gdp_curfew_character_modifier: "Couvre-feu nocturne"
 gdp_curfew_character_modifier_desc: "Ce personnage est soumis à un couvre-feu nocturne, dont le respect lui évite, ainsi qu’aux autres, des ennuis."
 gdp_state_protection_modifier: "Protection d’État"
 gdp_state_protection_modifier_desc: "Ce personnage se trouve sous la protection de l’assemblée."
 gdp_republic_grieving_parent_modifier: "Chagrin"
 gdp_republic_grieving_parent_modifier_desc: "Ce personnage a perdu un héritier aux mains d’une foule déchaînée et cela lui pèse toujours."
 gdp_exposed_spy_modifier: "Espion illégal"
 gdp_exposed_spy_modifier_desc: "Ce personnage a été démasqué après avoir espionné autrui."
 gdp_dodging_council_modifier: "Esquive de la convocation au conseil"
 gdp_dodging_council_modifier_desc: "Ce personnage a trouvé un moyen de se soustraire à la convocation au conseil, ce qui lui laisse plus de temps à consacrer à d’autres priorités."
 gdp_exemption_from_council_modifier: "Exemption de la convocation au conseil"
 gdp_exemption_from_council_modifier_desc: "Ce personnage a reçu une exemption de convocation au conseil pour pouvoir se consacrer à ses propres intérêts commerciaux."
 gdp_wedded_to_the_sea_modifier: "Marié à la mer"
 gdp_wedded_to_the_sea_modifier_desc: "Ce personnage a juré fidélité à la mer devant la république tout entière."
 gdp_learning_from_the_masses: "Apprendre auprès de la foule"
 gdp_learning_from_the_masses_desc: "Ce personnage aime apprendre des compétences pratiques en observant les gens ordinaires."
 gdp_cooperation_correspondenti_house_modifier: "Corrispondenti"
 gdp_cooperation_correspondenti_house_modifier_desc: "Cette Maison a établi une coopération avec une autre, ce qui étend les capacités de son réseau commercial."
 gdp_cooperation_compagnia_house_modifier: "Compagnia"
 gdp_cooperation_compagnia_house_modifier_desc: "Cette Maison a établi une coopération avec une autre, partageant leurs ressources et leur expertise."
 gdp_guild_sponsor_house_modifier: "Parrainage de guilde d’artisans"
 gdp_guild_sponsor_house_modifier_desc: "Cette Maison a parrainé la formation d’une nouvelle guilde d’artisans dans l’assemblée, devenant donc sa mécène."
 gdp_ancient_craft_house_modifier: "Métier ancien"
 gdp_ancient_craft_carpentry_supplies_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_books_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_incense_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_base_metals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_alcohol_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_comforts_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_meat_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_cereals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_consumption_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_jewelry_materials_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_items_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_republic_disgraced_patrician_house_modifier: "Patriciens en disgrâce"
 gdp_republic_disgraced_patrician_house_modifier_desc: "Cette Maison, qui a conduit une république à sa perte, a été chassée dans le déshonneur. Son nom n’a guère de poids sur les marchés et encore moins de gens en parlent en bien."
 gdp_republic_unrest_guild_district_shutdown: "District de la guilde : fermé"
 gdp_republic_unrest_guild_district_shutdown_desc: "Les guildes d’artisans ont fermé leurs portes. Le silence règne dans les ateliers."
 gdp_republic_unrest_market_district_shutdown: "District du marché : fermé"
 gdp_republic_unrest_market_district_shutdown_desc: "Le quartier du marché est barricadé et désert. Le commerce de la ville est paralysé."
 gdp_republic_unrest_port_district_shutdown: "District du port : fermé"
 gdp_republic_unrest_port_district_shutdown_desc: "Le port a été soustrait à l’autorité de la ville. Les recettes maritimes se sont taries."
 gdp_republic_unrest_bureaucratic_district_shutdown: "Quartier administratif : fermé"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "Le silence règne dans la circonscription administrative. Les recettes civiques ne sont pas perçues."
 gdp_republic_unrest_temple_district_shutdown: "Quartier d’enclave religieuse : fermé"
 gdp_republic_unrest_temple_district_shutdown_desc: "Le quartier d’enclave religieuse ne coopère plus. Les dons des fidèles ne parviennent plus au Trésor."
 gdp_republic_unrest_entertainment_district_shutdown: "Quartier des divertissements : fermé"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "Le quartier des divertissements est désert et plongé dans l’obscurité. Les recettes urbaines en pâtissent."
 gdp_republic_unrest_urban_housing_district_shutdown: "Quartier résidentiel : fermé"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "Tout le quartier s’est replié sur lui-même. Les recettes fiscales urbaines se sont effondrées."
 gdp_republic_riot_aftermath: "Conséquences des émeutes"
 gdp_republic_riot_aftermath_desc: "Les rues ont subi les flammes, les greniers ont été pillés et le tissu social s’est déchiré. Il faudra beaucoup de temps pour s’en remettre."
 gdp_republic_uprising_aftermath: "Conséquences du soulèvement"
 gdp_republic_uprising_aftermath_desc: "La population s’est déchaînée dans la ville. Le retour à l’ordre ne se fera pas de sitôt."
 gdp_sponsored_guild_modifier: "Guilde d’artisans parrainée"
 gdp_sponsored_guild_modifier_desc: "Après avoir reçu l’autorisation de former une nouvelle guilde, les artisans ont été parrainés par un riche bienfaiteur."
 gdp_secret_information_house_modifier: "Secrets diplomatiques"
 gdp_secret_information_house_modifier_desc: "Cette Maison bénéficie d’un aperçu des négociations diplomatiques secrètes de sa république."
 gdp_ambitions_aligned_house_modifier: "Ambition de Maison alignée"
 gdp_ambitions_aligned_house_modifier_desc: "Cette Maison a aligné ses intérêts avec ceux des autres Maisons de même ambition au sein de la république."
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "La réputation de cette Maison a été souillée par un torrent d’épouvantables calomnies.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_patrician_slander_rating_penalty_value' )|0=+]\nScore de soutien du membre de la [house|E] [GetLaw('republican_elective_succession_law').GetName] : [EmptyScope.ScriptValue( 'republic_slander_election_value' )|0=+]"
 gdp_patrician_promoted_house_modifier: "Réputation améliorée"
 gdp_patrician_promoted_house_modifier_desc: "La réputation de cette Maison au sein de la république a progressé grâce à une campagne de promotion réussie.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
 gdp_secured_republic_monopoly_modifier: "A obtenu le monopole de la république"
 gdp_secured_republic_monopoly_modifier_desc: "Ce personnage a obtenu un monopole pour sa république.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'secured_republic_monopoly_rating_bonus_value' )|0=+]"
 gdp_head_held_high_modifier: "La tête haute"
 gdp_head_held_high_modifier_desc: "Ce personnage garde la tête haute face à toute forme de mépris."
 gdp_training_for_the_worst_modifier: "En prévision du pire"
 gdp_training_for_the_worst_modifier_desc: "Ce personnage a décidé d’améliorer ses compétences martiales, au cas où les choses tourneraient mal."
 gdp_fear_of_the_mob_modifier: "Peur de la foule"
 gdp_fear_of_the_mob_modifier_desc: "Ce personnage vit dans la peur du caprice de la populace."
 gdp_champion_of_the_people_modifier: "Champion du peuple"
 gdp_champion_of_the_people_modifier_desc: "Ce personnage s’est autoproclamé défenseur des gens ordinaires."
 gdp_champion_of_the_state_modifier: "Champion du gouvernement"
 gdp_champion_of_the_state_modifier_desc: "Ce personnage s’est autoproclamé défenseur du gouvernement en place."
 gdp_guild_sponsored_feast_modifier: "Festin financé par les guildes"
 gdp_guild_sponsored_feast_modifier_desc: "Ce personnage a profité d’un festin gratuit, offert par les guildes de la ville."
 gdp_broken_trust_modifier: "Confiance trahie"
 gdp_broken_trust_modifier_desc: "Ce personnage a tiré profit de la générosité des braves gens pour son propre bénéfice."
 gdp_toast_to_adventure_modifier: "Ambition aventurière"
 gdp_toast_to_adventure_modifier_desc: "Ce personnage souhaite vivre des aventures bien loin d’ici."
 gdp_toast_to_romance_modifier: "Ambition amoureuse"
 gdp_toast_to_romance_modifier_desc: "Ce personnage souhaite vivre une grande histoire d’amour."
 gdp_toast_to_glory_modifier: "Ambition glorieuse"
 gdp_toast_to_glory_modifier_desc: "Ce personnage a soif de gloire."
 gdp_toast_to_relations_modifier: "Ambition amicale"
 gdp_toast_to_relations_modifier_desc: "Ce personnage nourrit des ambitions amicales et familiales.\nDébloque l’[interaction|El] $befriend_interaction$"
 gdp_republic_bureaucrat_modifier: "Bureaucrate républicain"
 gdp_republic_bureaucrat_modifier_desc: "Ce personnage a récemment fait preuve de compétences remarquables dans le processus législatif, régissant la paperasse avec une efficacité redoutable.\n[patrician_rating|E] : [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\nApprobation de l’[assembly|El] durant les [voting_sessions|El] : [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "Législateur"
 gdp_republic_law_maker_modifier_desc: "Ce personnage, par le biais de manœuvres habiles ou en tirant suffisamment de ficelles, a récemment obtenu l’accord de l’Assemblée pour son projet de loi.\n[patrician_rating|E] : [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "Comptoirs influents"
 gdp_dominate_market_trade_post_modifier_desc: "Ce marché est fortement influencé par les comptoirs d’un patricien."
 gdp_trade_post_charity_modifier: "Organisation d’un acte de charité"
 gdp_trade_post_charity_modifier_desc: "Ce personnage a organisé un acte de charité pour le peuple, au bénéfice des malades et des plus démunis."
 gdp_gather_popular_support_modifier: "Populaire parmi les citoyens"
 gdp_gather_popular_support_modifier_desc: "Ce personnage a acquis le soutien des habitants de la ville, faisant connaître son nom et entendre sa voix."
 gdp_gather_popular_support_house_t3_modifier: "Famille exceptionnelle du peuple"
 gdp_gather_popular_support_house_t3_modifier_desc: "Cette Maison bénéficie d’un soutien exceptionnel parmi les habitants de la ville.\n[patrician_rating|E] : [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\nScore de soutien à l’[GetLaw('republican_elective_succession_law').GetName|l] des membres de la [house|E] : [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "Famille forte du peuple"
 gdp_gather_popular_support_house_t2_modifier_desc: "Cette Maison bénéficie d’un fort soutien parmi les habitants de la ville.\n[patrician_rating|E] : [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\nScore de soutien à l’[GetLaw('republican_elective_succession_law').GetName|l] des membres de la [house|E] : [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "Famille du peuple"
 gdp_gather_popular_support_house_t1_modifier_desc: "Cette Maison bénéficie du soutien des habitants de la ville.\n[patrician_rating|E] : [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\nScore de soutien à l’[GetLaw('republican_elective_succession_law').GetName|l] des membres de la [house|E] : [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "Maire despotique"
 gdp_signorial_execute_and_banish_modifier_desc: "Ce personnage a banni et exécuté des citoyens de la république, et compte bien continuer."
 gdp_ambition_promote_scheme_bonus_modifier: "Patriciens promus"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "Ce personnage a consacré du temps et des efforts à l’amélioration de la réputation d’un autre patricien, ce qui lui a valu en retour une certaine bienveillance.\n[patrician_rating|E] : [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (le classement est non cumulable)#!"
 gdp_noble_magistrate_modifier: "Poste de magistrat noble"
 gdp_noble_magistrate_modifier_desc: "Ce personnage a reçu un poste mineur de magistrature noble pour servir la république de manière officielle, avec intégrité et honneur."
 gdp_republic_plaza_prestige_modifier: "Place prestigieuse"
 gdp_republic_plaza_prestige_modifier_desc: "Ce personnage a contribué à l’aménagement de la grande place, ce qui lui a valu du prestige et les faveurs du public."
 gdp_republic_trader_competitiveness_modifier: "Négociant intraitable"
 gdp_republic_trader_competitiveness_modifier_desc: "Ce personnage est un négociant inflexible qui fait craquer l’autre camp à coup sûr."
 gdp_republic_plaza_chancery_modifier: "Bois de la chancellerie"
 gdp_republic_plaza_chancery_modifier_desc: "Après avoir équipé les archives, ce personnage s’est retrouvé avec des charpentiers, presses et morceaux de bois en surplus. Il les utilise donc chez lui."
 gdp_republic_plaza_scriptorium_modifier: "Scriptorium bien rempli"
 gdp_republic_plaza_scriptorium_modifier_desc: "Ce personnage fournit les copistes de la commune en encres et pigments de qualité. Il en possède donc en grande quantité."
 gdp_republic_plaza_magistracy_modifier: "Robes de magistrats"
 gdp_republic_plaza_magistracy_modifier_desc: "Ce personnage a habillé les magistrats de la ville à ses propres frais. On le salue donc avec déférence dans les divers lieux juridiques."
 gdp_republic_plaza_popular_favor_modifier: "Chef populaire"
 gdp_republic_plaza_popular_favor_modifier_desc: "Ce personnage est expert pour influencer la foule et s’assurer que chacun sache qui finance les équipements auxquels il a accès."
 gdp_republic_plaza_trade_capacity_modifier: "Mesures précises"
 gdp_republic_plaza_trade_capacity_modifier_desc: "Aucun conflit n’entoure jamais la vente des marchandises que propose ce personnage, et les quantités écoulées augmentent à chaque saison."
 gdp_republic_plaza_expertise_modifier: "Commerçant de la place"
 gdp_republic_plaza_expertise_modifier_desc: "Ce personnage détient une influence sur bon nombre des marchands de la ville, ce qui lui donne accès à des marchandises qui ne pourraient autrement pas être obtenues avant des décennies."
 gdp_republic_plaza_estate_income_modifier: "Créancier public"
 gdp_republic_plaza_estate_income_modifier_desc: "La commune doit de l’argent à ce personnage et les intérêts d’emprunt rejoignent toujours sa Chambre des comptes en temps et en heure."
 gdp_republic_plaza_physician_modifier: "Faveur du médecin"
 gdp_republic_plaza_physician_modifier_desc: "Ce personnage paie en nature les pupilles de la ville à l’aide de ses herbes et remèdes, s’assurant ainsi que son propre foyer ne manque de rien."
 gdp_republic_plaza_hired_swords_modifier: "Intendant des compagnies"
 gdp_republic_plaza_hired_swords_modifier_desc: "Ce personnage s’assure que les compagnies embauchées reçoivent l’intégralité de leur paiement en temps et en heure, en faisant en sorte que son rôle ne soit pas oublié."
 gdp_republic_plaza_organized_worker_modifier: "Organisateur de personnel"
 gdp_republic_plaza_organized_worker_modifier_desc: "Ce personnage a organisé la main-d’œuvre pour des projets de construction majeurs, ce qui lui a permis d’acquérir de solides connaissances en matière de logistique à grande échelle."
 gdp_republic_civic_works_labor_modifier: "Main-d’œuvre organisée"
 gdp_republic_civic_works_labor_modifier_desc: "La république a déployé et organisé ses ouvriers de façon à accélérer les travaux de construction entrepris dans toute la capitale."
 gdp_republic_civic_works_materials_modifier: "Obtention de matériaux"
 gdp_republic_civic_works_materials_modifier_desc: "Grâce à un effort coordonné pour se procurer des matériaux de construction et les mettre en réserve, les coûts de construction ont réduit dans l’intégralité de la capitale."
 gdp_republic_civic_works_amenities_modifier: "Équipements publics"
 gdp_republic_civic_works_amenities_modifier_desc: "Les bains, fontaines et espaces de rassemblements qui ont été créés récemment stimulent le moral des habitants de la ville."
 gdp_republic_civic_works_market_modifier: "Agrandissement du marché"
 gdp_republic_civic_works_market_modifier_desc: "Un quartier du marché plus grand et mieux organisé a attiré davantage de marchands et amélioré les conditions de commerce dans la capitale."
 gdp_republic_civic_works_guilds_modifier: "Guildes des artisans subventionnées"
 gdp_republic_civic_works_guilds_modifier_desc: "Les guildes parrainées ont fait venir des artisans expérimentés dans la capitale, ce qui a accru les investissements et amélioré ainsi son offre."
 gdp_republic_civic_works_labor_character_modifier: "Réseau de main-d’œuvre"
 gdp_republic_civic_works_labor_character_modifier_desc: "Grâce à l’organisation des travailleurs en vue de la réalisation de travaux publics, ce dirigeant s’est créé un réseau d’ouvriers et de contractants de confiance dans la capitale.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "Réseau d’approvisionnement"
 gdp_republic_civic_works_materials_character_modifier_desc: "La recherche de matériaux pour les travaux publics a permis d’établir des filières fiables pour la pierre, le bois et diverses fournitures à des tarifs préférentiels.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "Mécène citoyen"
 gdp_republic_civic_works_amenities_character_modifier_desc: "Le financement des équipements publics de la ville a valu à ce dirigeant les faveurs du peuple de la capitale.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "Liens avec le marché"
 gdp_republic_civic_works_market_character_modifier_desc: "L’agrandissement du quartier du marché de la capitale a mis ce dirigeant en contact avec des négociants qui sauront se montrer reconnaissants.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "Mécène de guilde"
 gdp_republic_civic_works_guilds_character_modifier_desc: "Le financement de subventions pour les guildes d’artisans a permis de construire des liens durables avec les artisans de la ville. Leur gratitude offre à ce dirigeant une réputation enviable.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "Agrandissement de la localité"
 gdp_republic_civic_works_settlement_modifier_desc: "Les investissements dans les infrastructures urbaines de la capitale ont libéré de la place pour un accueil massif de populations, qui affluent en ce moment même."
 gdp_republic_civic_works_settlement_character_modifier: "Investisseur urbain"
 gdp_republic_civic_works_settlement_character_modifier_desc: "Le financement de l’agrandissement de la capitale républicaine a offert à ce dirigeant une influence sur les modalités de croissance de la ville.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "Ordre public"
 gdp_republic_civic_works_order_modifier_desc: "Suite à l’investissement dans les veilleurs et infrastructures publiques, la capitale est plus ordonnée et plus facile à gouverner."
 gdp_republic_civic_works_order_character_modifier: "Autorité publique"
 gdp_republic_civic_works_order_character_modifier_desc: "Le financement de l’ordre public dans la capitale a offert à ce dirigeant une réputation de stabilité et de bonne gouvernance.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "Écoles publiques"
 gdp_republic_civic_works_school_modifier_desc: "Ce comté a reçu un financement considérable pour la construction d’écoles publiques."
 gdp_republic_civic_works_school_character_modifier: "Mécène scolaire"
 gdp_republic_civic_works_school_character_modifier_desc: "Ce personnage a financé la construction d’écoles dans la capitale, mettant l’éducation à la disposition de la jeunesse.\n[patrician_rating|E] : [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
