 gdp_tgf_builders_rate_generic_small_modifier: "Tarif de marchand"
 gdp_tgf_builders_rate_generic_small_modifier_desc: "Les bâtisseurs de ce comté s’approvisionnent à un tarif de marchand."
 gdp_tgf_keep_the_best_modifier: "Ressources de premier choix"
 gdp_tgf_keep_the_best_modifier_desc: "Ce personnage s’est réservé les meilleurs matériaux de construction pour ses propres travaux."
 gdp_tgf_plentiful_stalls_modifier: "Étals bien remplis"
 gdp_tgf_plentiful_stalls_modifier_desc: "Un marchand a rempli les étals de ce comté avec le meilleur bois."
 gdp_tgf_well_supplied_host_modifier: "Armée bien approvisionnée"
 gdp_tgf_well_supplied_host_modifier_desc: "Les armées de ce personnage profitent des livraisons régulières d’un marchand."
 gdp_tgf_bee_stung_modifier: "Piqûres d’abeilles"
 gdp_tgf_bee_stung_modifier_desc: "Ce personnage s’est disputé avec des abeilles dans un entrepôt. Elles ont gagné."
 gdp_tgf_awake_and_alert_modifier: "Éveillé et alerte"
 gdp_tgf_awake_and_alert_modifier_desc: "Ce personnage boit du thé par litre et passe ses nuits à vérifier les livres de comptes."
 gdp_tgf_tea_drinker_modifier: "Buveur de thé"
 gdp_tgf_tea_drinker_modifier_desc: "Ce personnage boit autant de thé qu’un marchand et a l’esprit plus clair."
 gdp_tgf_well_grazed_meadows_modifier: "Prés bien broutés"
 gdp_tgf_well_grazed_meadows_modifier_desc: "Les troupeaux d’un marchand se sont engraissés dans les prés de ce comté, et l’herbe n’en est que plus verte."
 gdp_tgf_lacquer_rash_modifier: "Éruption laquée"
 gdp_tgf_lacquer_rash_modifier_desc: "Ce personnage a touché de la laque avant qu’elle durcisse et regrette son geste."
 gdp_tgf_curing_room_modifier: "Salle de laquage"
 gdp_tgf_curing_room_modifier_desc: "Ce marchand laisse la laque sécher dans une pièce humide, une couche à la fois, et les acheteurs voient la différence."
 gdp_tgf_theriac_supply_modifier: "Approvisionnement en thériaque"
 gdp_tgf_theriac_supply_modifier_desc: "Les marchés de ce comté vendent de la thériaque faite maison par un marchand."
 gdp_tgf_theriac_dose_modifier: "Dose de thériaque"
 gdp_tgf_theriac_dose_modifier_desc: "Ce personnage a bu de la thériaque et ne jure plus que par ça."
 gdp_tgf_theriac_peddlers_modifier: "Marchands de thériaque"
 gdp_tgf_theriac_peddlers_modifier_desc: "Toutes les villes situées le long de cette route vendent de la thériaque. Ses caravanes ne voyagent jamais à vide."
