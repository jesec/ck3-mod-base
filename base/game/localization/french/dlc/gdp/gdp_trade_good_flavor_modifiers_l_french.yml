l_french:
 gdp_tgf_heavier_loads_modifier: "Charges plus lourdes"
 gdp_tgf_seven_storehouses_modifier: "Sept entrepôts"
 gdp_tgf_seven_storehouses_modifier_desc: "Ce marchand a construit des entrepôts en prévision des années difficiles et s’assure que tous restent bien remplis."
 gdp_tgf_sweet_reputation_modifier: "Une réputation savoureuse"
 gdp_tgf_sweet_reputation_modifier_desc: "Un jour, ce marchand a envoyé un oiseau en sucre plus vrai que nature à un festin organisé pour un prince. Tous ceux qui y ont goûté en parlent encore aujourd’hui."
 gdp_tgf_beekeeper_modifier: "Apiculteur"
 gdp_tgf_beekeeper_modifier_desc: "Ce marchand élève des abeilles dans le plafond de son entrepôt. Elles paient leur loyer en miel, et le marchand en a appris plus sur cette substance que tout ce que les livres auraient pu lui enseigner."
 gdp_tgf_alcohol_opportunist_modifier: "Vigneron par accident"
 gdp_tgf_alcohol_opportunist_modifier_desc: "Ce marchand est porté sur la piquette depuis qu’il a laissé une cargaison de fruits pourrir jusqu'à ce qu’elle se transforme en vin."
 gdp_tgf_two_grades_modifier: "Deux qualités d’huile"
 gdp_tgf_two_grades_modifier_desc: "Les résidus troubles vendus par ce marchand servent à alimenter les lampes, tandis que son huile claire est destinée aux tables à manger. La différence se retrouve dans le prix."
 gdp_tgf_road_millet_modifier: "Du millet pour la route"
 gdp_tgf_road_millet_modifier_desc: "Ce marchand ne voyage jamais sans emporter un sac de millet. Ce dernier tient des années, tout comme ceux qui en transportent."
 gdp_tgf_cheap_rice_modifier: "Riz bon marché"
 gdp_tgf_cheap_rice_modifier_desc: "Le riz brun est très abordable sur les marchés de ce comté, et personne ici ne meurt d’envie d’en manger."
 gdp_tgf_keeps_the_fast_modifier: "Respect du jeûne"
 gdp_tgf_keeps_the_fast_modifier_desc: "Ce marchand vend de la viande toute l’année et jeûne comme tout le monde. Nul ne sait mieux que lui ce qu’une personne affamée est prête à débourser."
 gdp_tgf_parchment_supplier_modifier: "Fournisseur de parchemin"
 gdp_tgf_parchment_supplier_modifier_desc: "Les plus belles peaux de ce marchand sont transformées en pages. Quelque part, quelqu’un écrit des mots sacrés dessus."
 gdp_tgf_temple_supplier_modifier: "Fournisseur des temples"
 gdp_tgf_temple_supplier_modifier_desc: "Les temples achètent leur encens à ce marchand, puis prient de temps en temps pour lui."
 gdp_tgf_chancery_stationer_modifier: "Papetier de chancellerie"
 gdp_tgf_chancery_stationer_modifier_desc: "Ce marchand approvisionne une chancellerie en papier, et tous les commis qui en entendent parler réclament le même."
 gdp_tgf_tall_mast_modifier: "Grand mât"
 gdp_tgf_tall_mast_modifier_desc: "Le bateau de ce marchand est équipé du plus beau mât de toute la côte, et peut voyager plus loin que les autres grâce à lui."
 gdp_tgf_our_timber_modifier: "Construits avec notre bois"
 gdp_tgf_our_timber_modifier_desc: "Les bateaux équipés de mâts taillés dans le bois de cette route transportent ses marchandises plus loin qu’ils ne pouvaient le faire auparavant."
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
 gdp_tgf_our_timber_renowned_modifier_desc: "$gdp_tgf_our_timber_modifier_desc$"
 gdp_tgf_heavier_loads_modifier_desc: "Tout ce qui emprunte cette route commerciale est chargé au-delà du raisonnable."
 gdp_tgf_builders_rate_castle_full_modifier: "De la pierre pour les murs"
 gdp_tgf_builders_rate_castle_full_modifier_desc: "Le château de ce comté s’approvisionne à un tarif de bâtisseur."
 gdp_tgf_builders_rate_castle_small_modifier: "Des murs onéreux"
 gdp_tgf_builders_rate_castle_small_modifier_desc: "Le château de ce comté s’approvisionne à prix fort."
 gdp_tgf_builders_rate_church_full_modifier: "De la pierre pour le temple"
 gdp_tgf_builders_rate_church_full_modifier_desc: "Le temple de ce comté s’approvisionne à un tarif de bâtisseur."
 gdp_tgf_builders_rate_church_small_modifier: "Un temple onéreux"
