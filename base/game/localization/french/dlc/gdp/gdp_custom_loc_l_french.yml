l_french:
 dinar: "dinar"
 dinar_plural: "dinars"
 dinar_gloss: "[Glossary('dinar', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('dinars', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "Le #bold dinar#! (ou #emp denar#!) était une pièce d’or introduite par les Omeyyades au VIIe siècle pour faire contrepoids au [Glossary('solidus', 'SOLIDUS_GLOSS')] d’or byzantin, bien que son nom dérive du [Glossary('denarius', 'DENARIUS_GLOSS')] d’argent.\n\nCes pièces se sont répandues dans tout le monde arabe et leur nom est encore utilisé aujourd’hui pour désigner des monnaies modernes."
 denarius: "denier"
 denarius_plural: "deniers"
 denarius_gloss: "[Glossary('denarius', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('denarii', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "À l’origine, le #bold denarius#! était une pièce d’argent de la République romaine, dont la valeur fut considérablement réduite sous l’Empire.\n\nCe terme désignant une monnaie a néanmoins perduré dans les régions qui ont subi l’influence des Romains, son nom étant transposé au [Glossary('denar', 'PENNY_GLOSS')] d’argent carolingien et au [Glossary('dinar', 'DINAR_GLOSS')] d’or arabe."
 ducat: "ducat"
 ducat_plural: "ducats"
 ducat_gloss: "[Glossary('ducat', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('ducats', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "Le #bold ducato#!, ou #emp dogado#!, était une pièce d’or introduite au XIIIe siècle par Venise afin de rivaliser avec le [Glossary('florin', 'FLORIN_GLOSS')] florentin et le #emp genovino#! génois, qui avaient été mis en circulation en réaction à la dépréciation du [Glossary('solidus', 'SOLIDUS_GLOSS')] d’or byzantin. Son nom vient du titre de #emp doge#! de Venise.\n\nElle fut rapidement très prisée dans les échanges commerciaux, se répandit dans toute l’Europe et au-delà, et fut copiée pour servir de norme."
 dirham: "dirham"
 dirham_plural: "dirhams"
 dirham_gloss: "[Glossary('dirham', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('dirhams', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "Le #bold dirham#! était une pièce d’argent introduite au VIIe siècle par les Omeyyades et adoptée dans l’ensemble du monde arabophone. Son nom provient de la #emp drachme#! d’argent de la Grèce antique, datant de l’époque classique et hellénistique.\n\nElle est devenue une unité de poids standard dans le monde islamique, s’est largement répandue et son nom est encore utilisé aujourd’hui comme unité de mesure dans plusieurs monnaies modernes."
 aureus: "aureus"
 aureus_plural: "aurei"
 aureus_gloss: "[Glossary('aureus', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('aurei', 'AUREUS_GLOSS')]"
 solidus: "solidus"
 solidus_plural: "solidi"
 solidus_gloss: "[Glossary('solidus', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('solidi', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "Le #bold solidus#!, appelé également #emp nomisma#! (littéralement « pièce de monnaie »), était une pièce d’or introduite par les Byzantins au IVe siècle pour remplacer l’ancien [Glossary('aureus', 'AUREUS_GLOSS')] romain. Au XIe siècle, il fut lui-même remplacé par l’[Glossary('hyperpère', 'HYPERPYRON_GLOSS')].\n\nLes pièces d’or des républiques italiennes, telles que le [Glossary('ducat', 'DUCAT_GLOSS')], le [Glossary('florin', 'FLORIN_GLOSS')] et le #emp genovino#!, furent introduites au XIIIe siècle en réaction à sa dévaluation.\n\nEn Europe du Nord, il était connu sous le nom de #emp schilling#! jusqu’à ce que Charlemagne, au VIIIe siècle, normalise la valeur d’échange de l’argent sous ce nom dans le cadre de ses réformes."
 hyperpyron: "hyperpère"
 hyperpyron_plural: "hyperpères"
 hyperpyron_gloss: "[Glossary('hyperpère', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('hyperpères', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "L’#bold hyperpère#! (littéralement « hautement raffiné ») était une pièce d’or introduite par les Byzantins au XIe siècle pour remplacer l’ancien [Glossary('solidus', 'SOLIDUS_GLOSS')] d’or, et connue en Europe sous le nom de #emp besant#!.\n\nBien qu’elle n’ait pas perdu autant de valeur que le #emp solidus#!, sa valeur a néanmoins considérablement baissé jusqu’au XIIIe siècle, ce qui a conduit à l’introduction du [Glossary('ducat', 'DUCAT_GLOSS')], du [Glossary('florin', 'FLORIN_GLOSS')] et du #emp genovino#! par les républiques italiennes."
 bezant: "besant"
 bezant_plural: "besants"
 bezant_gloss: "[Glossary('besant', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('besants', 'HYPERPYRON_GLOSS')]"
 florin: "florin"
 florin_plural: "florins"
 florin_gloss: "[Glossary('florin', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('florins', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "Le #bold florin#! était une pièce d’or introduite au XIIIe siècle par la République de Florence en réaction à la dévaluation du [Glossary('solidus', 'SOLIDUS_GLOSS')] et de l’[Glossary('hyperpyron', 'HYPERPYRON_GLOSS')] byzantins. Peu après, le #emp genovino#! génois et le [Glossary('ducat', 'DUCAT_GLOSS')] vénitien firent leur apparition.\n\nÀ l’instar du #emp ducat#!, il devint une monnaie d’échange très répandue et de nombreux ateliers monétaires à travers l’Europe en frappèrent des copies. Son nom perdure dans le #emp forint#! hongrois."
 penny: "penny"
 penny_plural: "pennies"
 penny_gloss: "[Glossary('penny', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('pennies', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "Le #bold pfennig#! (#emp penny#!) était une pièce d’argent standardisée que Charlemagne a introduite au VIIIe siècle comme équivalent de l’ancien [Glossary('denarius', 'DENARIUS_GLOSS')] d’argent du monde romain que l’on trouvait partout.\n\nIl s’est rapidement répandu et devint une monnaie standard en Europe, où des appellations telles que #emp denar#!, #emp denier#! ou #emp dinero#! ont été utilisées pendant des siècles pour désigner des pièces d’argent de ce poids."
 pfennig: "pfennig"
 pfennig_plural: "pfennigs"
 pfennig_gloss: "[Glossary('pfennig', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('pfennigs', 'PENNY_GLOSS')]"
 denier: "denier"
 denier_plural: "deniers"
 denier_gloss: "[Glossary('denier', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('deniers', 'PENNY_GLOSS')]"
 dinero: "dinero"
 dinero_plural: "dineros"
 dinero_gloss: "[Glossary('dinero', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('dineros', 'PENNY_GLOSS')]"
 denaro: "denaro"
 denaro_plural: "denaros"
 denaro_gloss: "[Glossary('denaro', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('denaros', 'PENNY_GLOSS')]"
 denar: "denar"
 denar_plural: "denars"
 denar_gloss: "[Glossary('denar', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('denars', 'PENNY_GLOSS')]"
 groschen: "groschen"
 groschen_plural: "groschen"
 groschen_gloss: "[Glossary('groschen', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('groschen', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "Le #bold groschen#!, ou « gros pfennig », était une pièce d’argent plus lourde, introduite au XIIIe siècle par le duc Meinhard II du Tyrol en réponse au #emp grosso#! vénitien de valeur équivalente, et qui valait à l’origine 12 [Glossary('pfennigs', 'PENNY_GLOSS')].\n\nCette norme s’est rapidement répandue dans toute l’Europe, les ateliers monétaires de Kutná Hora en Bohème et ceux de Meissen à Fribourg en étant des sources importantes."
 tongbao: "tongbao"
 tongbao_plural: "tongbao"
 tongbao_gloss: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "Le terme #bold Tongbao#! (« trésor en circulation ») désigne les pièces [Glossary('qian', 'QIAN_GLOSS')] coulées dans un alliage de bronze, émises pour la première fois par la dynastie Tang au VIIe siècle.\n\nElles sont devenues l’unité monétaire standard dans l’ensemble de l’espace chinois et sont aujourd’hui utilisées en médecine chinoise traditionnelle et comme porte-bonheur."
 qian: "qian"
 qian_plural: "qian"
 qian_gloss: "[Glossary('qian', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('qian', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "Le terme #bold qian#! (« monnaie ») désigne de manière générale les pièces en alliage de cuivre coulées qui servaient de moyen de paiement en Chine dès l’époque des Royaumes combattants.\n\nLeurs trous carrés facilitaient le limage simultané de leurs bords irréguliers après la coulée, en les enfilant sur une tige. Ils permettaient également de les enfiler pour constituer des lots de valeurs monétaires plus importantes destinés aux échanges, généralement sous forme de cordons de 1 000 pièces. Ces monnaies ont inspiré la fabrication de pièces coulées similaires notamment au Japon, en Corée et au Vietnam."
 mon_coin: "mon"
 mon_coin_plural: "mon"
 mon_coin_gloss: "[Glossary('mon', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('mon', 'QIAN_GLOSS')]"
 tanka: "tanka"
 tanka_plural: "tanka"
 tanka_gloss: "[Glossary('tanka', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('tanka', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "Le #bold tanka#! (ou #emp taka#!) était une pièce d’argent introduite au XIIIe siècle par le sultanat de Delhi.\n\nElle s’est répandue dans toute l’Inde et les régions voisines, où elle a été largement imitée, et constituait une unité d’échange courante sur la Route de la Soie."
 jital: "jital"
 jital_plural: "jital"
 jital_gloss: "[Glossary('jital', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('jital', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "À l’origine, les #bold jital#! étaient des pièces d’argent ornées d’un motif représentant un taureau et un cavalier, introduites à Kaboul au VIIIe siècle.\n\nElles se sont répandues dans la région, où de nombreuses contrefaçons ont été émises, avant d’être finalement dévaluées à mesure qu’on y ajoutait de plus en plus de cuivre. À partir du XVIe siècle, les #emp jital#! étaient entièrement en cuivre."
 coin: "pièce"
 coin_plural: "pièces"
 coin_gloss: "pièce"
 coin_gloss_plural: "pièces"
 bazaar: "bazar"
 bazaar_plural: "bazars"
 bazaar_gloss: "[Glossary('bazar', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('bazars', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "Le mot #bold bazar#! est un terme persan désignant une place de marché et trouve son origine dans le proto-indo-européen. Il s’est ensuite répandu en arabe et est aujourd’hui largement utilisé dans toute l’Asie occidentale, en Inde et au-delà."
 khrom: "khrom"
 khrom_plural: "khroms"
 khrom_gloss: "[Glossary('khrom', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('khroms', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold Khrom#! est un terme tibétain désignant une place de marché, qui s’est répandu dans différentes régions le long de la Route de la Soie."
 shuka: "shuka"
 shuka_plural: "shukas"
 shuka_gloss: "[Glossary('shuka', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('shukas', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "Dans les langues du Caucase, #bold shuka#! désigne une place de marché. Tout comme le mot arabe [Glossary('souk', 'SUQ_GLOSS')], ce terme est à l’origine emprunté à l’akkadien, où il signifiait « rue », mais via le syrien."
 suq: "souk"
 suq_plural: "souks"
 suq_gloss: "[Glossary('souk', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('souks', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold Souk#! est un mot arabe désignant une place de marché ; à l’origine, il s’agit d’un emprunt à l’akkadien, qui signifiait « rue », passé par l’araméen. C’est aujourd’hui un terme couramment utilisé dans le monde musulman et au-delà."
 market_custom: "marché"
 market_custom_plural: "marchés"
 market_custom_gloss: "marché"
 market_custom_gloss_plural: "marchés"
 burgher: "bourgeois"
 burgher_plural: "bourgeois"
 patrician: "bourgeois"
 patrician_plural: "bourgeois"
 freeman: "homme libre"
 freeman_plural: "hommes libres"
 artifact_curious: "curieux"
 artifact_fascinating: "fascinant"
 artifact_impressive: "impressionnant"
