l_french:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName] : [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "Alors que nous traversons [local_province.Custom('GetTerrainLandPlural')] de [local_county.GetNameNoTierNoTooltip], mon groupe arrive à proximité d’une localité et installe notre campement sur un espace [local_province.Custom('GetProvinceFoliageDescAdjective')],"
 gdp_merchant_luxury_contract.0001.desc.locals: "Un groupe de villageois qui passait par là répond à nos questions maladroites sur la faune locale par d’étranges mimes, pourtant sans équivoque,"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "Un groupe de villageois qui passait par là répond à nos questions en nous racontant des anecdotes à propos"
 gdp_merchant_luxury_contract.0001.desc.jungle: "où l’air est imprégné du parfum du nectar."
 gdp_merchant_luxury_contract.0001.desc.mountain: "où l’air frais souffle entre les branches."
 gdp_merchant_luxury_contract.0001.desc.desert: "où le soleil de plomb s’abat sur le paysage silencieux."
 gdp_merchant_luxury_contract.0001.desc.plains: "imprégné de l’odeur des fleurs sauvages."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "de félins redoutables."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "de félins rusés."
 gdp_merchant_luxury_contract.0001.desc.bear: "d’ours féroces."
 gdp_merchant_luxury_contract.0001.desc.monkey: "de singes espiègles."
 gdp_merchant_luxury_contract.0001.desc.elephant: "d’éléphants majestueux."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "de félins redoutables et d’ours féroces."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "d’ours féroces et d’éléphants majestueux."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "de félins redoutables et d’éléphants majestueux."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "de singes espiègles et de chats redoutables."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "de singes espiègles et d’éléphants majestueux."
 gdp_merchant_luxury_contract.0001.desc.bird: "d’oiseaux séduisants."
 gdp_merchant_luxury_contract.0001.desc.close: "On dirait bien que nous sommes enfin sur la bonne voie !"
 gdp_merchant_luxury_contract.0001.a: "Les bêtes sauvages nous attendent !"
 gdp_merchant_luxury_contract.0001.a.flavor: "Favorise les démonstrations de [martial|El][martial_i|E], d’[intrigue|El][intrigue_i|E] et de [prowess|El][prowess_i|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "Tentez de vous procurer un [domicile_artifact|El] de type #V Créature#! dans la nature"
 gdp_merchant_luxury_contract.0001.b: "Voyons ce que nous pouvons trouver dans [local_barony.Custom('BaronyTownType')]."
 gdp_merchant_luxury_contract.0001.b.flavor: "Favorise les démonstrations de [diplomacy|El][diplomacy_i|E], d’[stewardship|El][stewardship_i|E] et d’[gold|El][gold_i|E]"
 gdp_merchant_luxury_contract.0001.b.tt: "Tentez de vous procurer un [domicile_artifact|El] de type #V Créature#! dans la ville"
 gdp_merchant_luxury_contract_back_to_town_tt: "Vous retournez dans [local_barony.Custom('BaronyTownType')]"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "Vous retournez dans la nature"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName] : couleur locale"
 gdp_merchant_luxury_contract.0011.desc: "Alors que je déambule dans les rues inconnues de [local_province.GetBaronyNameExplicitlyNoTooltip], j’aperçois peu après un [local_province.Custom('GetRegionalMarketTermGloss')] [local_province.Custom('GetProvinceAdjective')], où [Select_CString(rich_local.IsFemale,'une femme','un homme')] bien habillé[rich_local.Custom('FR_E')], impossible à manquer, discute"
 gdp_merchant_luxury_contract.0011.cage: "à côté d’un[rich_local.Custom('FR_E_GetAnimalType')] [rich_local.Custom('GetAnimalType')] dans une cage !"
 gdp_merchant_luxury_contract.0011.shoulder: ", un[rich_local.Custom('FR_E_GetAnimalType')] [rich_local.Custom('GetAnimalType')] sur l’épaule !"
 gdp_merchant_luxury_contract.0011.leashed: ", un[rich_local.Custom('FR_E_GetAnimalType')] [rich_local.Custom('GetAnimalType')] attaché[rich_local.Custom('FR_E_GetAnimalType')] à ses côtés !"
 gdp_merchant_luxury_contract.0011.close: "\n\nLes colporteurs autour de moi m’apprennent qu’[rich_local.Custom('FR_IlElle')] s’appelle [rich_local.GetTitledFirstName], qu’[rich_local.Custom('FR_IlElle')] est originaire d’ici et qu’[rich_local.Custom('FR_IlElle')] est connu[rich_local.Custom('FR_E')] pour son intérêt pour les animaux sauvages et exotiques.\n\nPeut-être accepterait-[rich_local.Custom('FR_IlElle')] de conclure un marché ?"
 gdp_merchant_luxury_contract.0011.a: "« [Select_CString(rich_local.IsFemale,'Ma bonne Dame','Mon bon Monsieur')], pourrions-nous discuter de votre magnifique [rich_local.Custom('GetAnimalType')] ? »"
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.Custom('FR_IlElle')|U] vous vend l’animal"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.Custom('FR_IlElle')|U] décline votre offre"
 gdp_merchant_luxury_contract.0011.b: "Je trouverai mon propre spécimen..."
 gdp_merchant_luxury_contract.some_other_way: "Vous devez trouver un autre moyen d’acquérir un animal"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.Custom('FR_le_Char_Pi')|U][rich_local.GetTitledFirstName] me regarde avec curiosité tandis que je me présente et que j’admire avec enthousiasme son animal.\n\n"
 gdp_merchant_luxury_contract.0012.success: "Son regard s’adoucit tandis que je parle ; [rich_local.Custom('FR_IlElle')] boit avidement mes compliments et me demande comment j’ai pu me retrouver dans un endroit si loin de chez moi.\n\nNous nous mettons rapidement d’accord sur un prix et je me retrouve soudain en possession d’un[rich_local.Custom('FR_E_GetAnimalType')] magnifique [rich_local.Custom('GetAnimalType')] !"
 gdp_merchant_luxury_contract.0012.failure: "Son visage s’assombrit : [rich_local.Custom('FR_IlElle')] fronce d’abord les sourcils, puis renifle avec mépris. [rich_local.Custom('FR_IlElle')|U] me repousse finalement d’un geste décidé et fait signe à ses compagnons de m’emmener.\n\n[Select_CString(rich_local.IsFemale,'Cette bouffonne prétentieuse','Ce bouffon prétentieux')] me traite comme si j’étais l’animal..."
 gdp_merchant_luxury_contract.0012.a: "Tout le monde en parlera à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] !"
 gdp_merchant_luxury_contract.0012.b: "Attendez ! Écoutez, je peux vous offrir encore mieux !"
 gdp_merchant_luxury_contract.0012.c: "Mais où vit donc cet imbécile ? Cet animal sera mien !"
 gdp_merchant_luxury_contract.0012.c.success: "Vous volez l’animal"
 gdp_merchant_luxury_contract.0012.c.failure: "Vous échappez de justesse aux gardes"
 gdp_merchant_luxury_contract.0012.d: "#weak *Secoue la tête*#! « Laissez tomber, je vais en chasser un moi-même. »"
 gdp_merchant_luxury_contract.0012.e: "J’en ai fini avec ça..."
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "Il n’a pas été difficile de trouver la propriété [rich_local.Custom('FR_du_Char_Pi')][rich_local.GetTitledFirstName] à [local_province.GetBaronyNameExplicitlyNoTooltip] et de recruter quelques brutes du coin à la taverne, avant de nous faufiler discrètement sur les lieux à la tombée de la nuit.\n\n"
 gdp_merchant_luxury_contract.0013.success: "Il a été presque trop facile d’accéder au site, et très vite, nous nous retrouvons à nouveau à quelques rues de là, tendant l’oreille pour détecter le moindre signal d’alarme.\n\nEn dehors des cris étouffés [rich_local.Custom('GetAnimalPossessive')], le silence règne !"
 gdp_merchant_luxury_contract.0013.failure: "Malheureusement, la chance m’a abandonné[ROOT.Char.Custom('FR_E')] ! J’échappe de justesse aux gardes, alertés par les cris [rich_local.Custom('GetAnimalPossessive')], tandis que le plan tombe à l’eau...\n\nLes hommes de [rich_local.GetFirstNameNoTooltip] vont sûrement se lancer à ma poursuite !"
 gdp_merchant_luxury_contract.0013.a: "C[rich_local.Custom('FR_EtEtte')] imbécile aurait dû me le vendre !"
 gdp_merchant_luxury_contract.0013.b: "Je dois immédiatement quitter cet endroit !"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName] : le bestiaire"
 gdp_merchant_luxury_contract.0021.desc: "Au cœur des ruelles sinueuses du [local_province.Custom('GetRegionalMarketTermGloss')] de [local_barony.Custom('BaronyTownType')], l’odeur nauséabonde et les cris bestiaux m’attirent vers [Select_CString(dealer.IsFemale,'une femme','un homme')] à l’air [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)], caché[dealer.Custom('FR_E')] derrière un étal délabré couvert de cages en [local_province.Custom('GetRandomRegionalWood')].\n\nLorsqu’[dealer.Custom('FR_IlElle')] remarque mon intérêt, [dealer.Custom('FR_IlElle')] me fait signe de m’approcher avec impatience. Quel régal pour les yeux ! Un[ROOT.Char.Custom('FR_E_GetAnimalType')] magnifique [ROOT.Char.Custom('GetAnimalType')] attire mon attention. Alors que j’en admire [ROOT.Char.Custom('GetAnimalFeature')], un[dealer.Custom('FR_E_GetAnimalType')] [dealer.Custom('GetAnimalType')] plutôt pitoyable [dealer.Custom('GetAnimalSoundPresent')] en signe de protestation.\n\nLes yeux [Select_CString(dealer.IsFemale,'de la marchande','du marchand')] brillent d’avidité tandis que je continue à regarder."
 gdp_merchant_luxury_contract.0021.a: "« Superbe... Je veux cet animal ! »"
 gdp_merchant_luxury_contract.0021.b: "Ils marchandent sûrement aussi à [local_province.GetBaronyNameExplicitlyNoTooltip]..."
 gdp_merchant_luxury_contract.0021.b.success_critical: "Vous concluez une affaire de maître"
 gdp_merchant_luxury_contract.0021.b.success: "Vous économisez quelques pièces"
 gdp_merchant_luxury_contract.0021.b.failure: "Vous ne faites qu’empirer les choses"
 gdp_merchant_luxury_contract.0021.b.tt: "Vous aurez la possibilité de refuser"
 gdp_merchant_luxury_contract.0021.c: "#weak *pointe du doigt*#! « Je prends [dealer.Custom('FR_Le_GetAnimalType')][dealer.Custom('GetAnimalType')] ! »"
 gdp_merchant_luxury_contract.0021.d: "« Je ne fais que regarder. »"
 task_contract_success_pseudo: "#P Réussite#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "Le commerçant nous fait un clin d’œil ; c’est manifestement un vendeur né. Nous observons longuement [ROOT.Char.Custom('GetAnimalHide')] [ROOT.Char.Custom('GetAnimalPossessive')] et discutons de la qualité de ses cris.\n\n"
 gdp_merchant_luxury_contract.0022.success: "J’ai de bons arguments et cela [dealer.Custom('FR_LeLa')] déstabilise quelque peu. Très vite, [dealer.Custom('FR_IlElle')] cède et baisse considérablement le prix..."
 gdp_merchant_luxury_contract.0022.neutral: "Mes arguments semblent avoir fait leur effet, car [dealer.Custom('FR_IlElle')] baisse un peu son prix, mais ensuite, [dealer.Custom('FR_IlElle')] reste inflexible..."
 gdp_merchant_luxury_contract.0022.failure: "On dirait que je l’ai contrarié[dealer.Custom('FR_E')], car le prix n’a fait qu’augmenter et [dealer.Custom('FR_IlElle')] se montre désormais intransigeant[dealer.Custom('FR_E')]..."
 gdp_merchant_luxury_contract.0022.a: "« C’est d’accord. »"
 gdp_merchant_luxury_contract.0022.b: "« En fait, je veux [dealer.Custom('FR_Le_GetAnimalType')][dealer.Custom('GetAnimalType')]... »"
 gdp_merchant_luxury_contract.0022.c: "#weak *Secoue la tête*#! « Laissez tomber. »"
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "Au moins, j’ai atteint mon objectif et je suis désormais l’heureux propriétaire d’un[dealer.Custom('FR_E_GetAnimalType')] [ROOT.Char.Custom('GetAnimalType')] ! Cette fière créature a été mise en sécurité et rentre désormais chez elle avec notre caravane.\n\nJ’ai hâte qu’ils voient ça à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] !"
 gdp_merchant_luxury_contract.0023.a: "Allons-y."
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName] : à la chasse"
 gdp_merchant_luxury_contract.0041.desc: "Je quitte les sentiers et m’enfonce plus profondément dans [local_province.Custom('GetTerrainType')], tout en me frayant un chemin à travers [local_province.Custom('GetProvinceFoliageDesc')] à la recherche d’un animal, quel qu’il soit. Seul le chant des oiseaux vient rompre le silence fantomatique. Je serre mon manteau contre moi.\n\nAu moment même où je m’apprête à sortir des fourrés, je l’aperçois ! Là, parmi [local_province.Custom('GetProvinceGroundDesc')], je distingue nettement des empreintes ! Soudain, j’entends [ROOT.Char.Custom('GetAnimalSound')] au loin : un[ROOT.Char.Custom('FR_E_GetAnimalType')] [ROOT.Char.Custom('GetAnimalType')] rôde à proximité !"
 gdp_merchant_luxury_contract.0041.a: "En route, avant que la bête ne s’enfuie !"
 gdp_merchant_luxury_contract.0041.a.tt: "Vous poursuivez [THIS.Char.Custom('FR_Le_GetAnimalType')][THIS.Char.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0041.b: "Oubliez ça, faisons demi-tour !"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "Alors que je me fraie un chemin à travers [local_province.Custom('GetProvinceFoliageDesc')], j’entrevois [ROOT.Char.Custom('GetAnimalHide')] de couleur [ROOT.Char.Custom('GetAnimalColor')] d’un animal. Je crains le pire et me retourne rapidement, le cœur battant à tout rompre !\n\nDevant moi se trouve un[ROOT.Char.Custom('FR_E_GetAnimalType')] [ROOT.Char.Custom('GetAnimalType')] épuisé[ROOT.Char.Custom('FR_E_GetAnimalType')]. Ce n’est qu’un [ROOT.Char.Custom('GetAnimalChild')]. De ses grands yeux, il me regarde sans aucune crainte. Je jette un coup d’œil autour de moi, mais il semble être seul. [ROOT.Char.Custom('GetAnimalGroup')|U] n’est pas en vue..."
 gdp_merchant_luxury_contract.0042.a: "Je suis ici pour une bête adulte !"
 gdp_merchant_luxury_contract.0042.a.tt: "Vous continuez à chercher un[THIS.Char.Custom('FR_E_GetAnimalType')] [THIS.Char.Custom('GetAnimalType')] adulte comme [artifact|El]"
 gdp_merchant_luxury_contract.0042.b: "Je devrais peut-être poser un piège..."
 gdp_merchant_luxury_contract.0042.b.success: "Vous utilisez le [ROOT.Char.Custom('GetAnimalChild')] comme appât"
 gdp_merchant_luxury_contract.0042.b.success.tt: "Vous obtenez également un[THIS.Char.Custom('FR_E_GetAnimalType')] [THIS.Char.Custom('GetAnimalType')] adulte comme [artifact|El]"
 gdp_merchant_luxury_contract.0042.b.failure: "Vous échouez et le [ROOT.Char.Custom('GetAnimalChild')] s’échappe"
 gdp_merchant_luxury_contract.0042.c: "Il est temps de partir. Tu vas venir avec moi, mon petit !"
 baby_creature_artifact_name: "Jeune [baby_creature.GetNameNoTooltip|l]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "Je suis surpris[ROOT.Char.Custom('FR_E')] par un mouvement dans [local_province.Custom('GetProvinceFoliageDesc')] et crains qu’une bête se soit approchée rapidement !\n\nJe suis à moitié soulagé[ROOT.Char.Custom('FR_E')] quand je vois qu’il ne s’agit que d’un trappeur local qui m’observe d’un air méfiant, une flèche encochée.\n\n« Ha ! Vous cherchez des [ROOT.Char.Custom('GetAnimalPlural')] ? Je n’ai encore jamais vu des gens comme vous. »"
 gdp_merchant_luxury_contract.0043.a: "Pourriez-vous... m’aider ?"
 gdp_merchant_luxury_contract.0043.b: "Ce serait un honneur de chasser à vos côtés !"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip] vous assiste"
 gdp_merchant_luxury_contract.0043.b.success_tt: "Vous aurez plus de chances de réussir"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip] refuse"
 gdp_merchant_luxury_contract.0043.c: "Restez hors de mon chemin."
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "Il est facile de conduire le [ROOT.Char.Custom('GetAnimalChild')] docile vers une clairière appropriée et de l’y attacher avec une corde.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName] est d’une aide précieuse et connaît très bien [local_province.Custom('GetTerrainTypePlural')] ainsi que leurs habitants. Nous avons déjà repéré des traces [ROOT.Char.Custom('GetAnimalPossessive')] !\n\n"
 gdp_merchant_luxury_contract.0044.desc: "Dans cet environnement inhabituel, nous avançons lentement. Nous nous perdons souvent et refaisons plusieurs fois les mêmes chemins, mais nous finissons par retrouver la trace [ROOT.Char.Custom('GetAnimalPossessive')] !\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "Rapidement, ses cris attirent l’attention d’un[ROOT.Char.Custom('FR_E_GetAnimalType')] [ROOT.Char.Custom('GetAnimaltype')] adulte. Nous observons la bête passer [local_province.Custom('GetProvinceFoliageDesc')] et scruter prudemment les environs. Finalement, elle s’approche du petit, et nous déclenchons notre piège !"
 gdp_merchant_luxury_contract.0044.bait_failure: "Ou du moins, c’est ce qui aurait pu se passer... Après être restée tranquillement assise un moment, émettant de légers cris, la bête bondit soudain de toutes ses forces, se dégage et disparaît dans [local_province.Custom('GetProvinceFoliageDesc')]..."
 gdp_merchant_luxury_contract.0044.success: "Nous avons la chance de pouvoir surprendre [ROOT.Char.Custom('FR_Le_GetAnimalType')][ROOT.Char.Custom('GetAnimalType')], qui ne se doute de rien, parmi [local_province.Custom('GetProvinceFoliageDesc')]. Dans un grand vacarme et un tourbillon [ROOT.Char.Custom('GetAnimalColor')], la bête est capturée à l’aide d’un filet !"
 gdp_merchant_luxury_contract.0044.failure: "Malheureusement, les choses tournent mal. À peine avons-nous eu le temps de l’apercevoir que la bête a déjà disparu dans [local_province.Custom('GetTerrainLand')], dans un grand vacarme et un tourbillon [ROOT.Char.Custom('GetAnimalColor')] — apparemment trop effrayée."
 gdp_merchant_luxury_contract.0044.a: "Quel beau couple vous faites !"
 gdp_merchant_luxury_contract.0044.b: "Maudites bêtes !"
 gdp_merchant_luxury_contract.0044.c: "Je t’ai enfin attrapé !"
 gdp_merchant_luxury_contract.0044.d: "Maudite bête !"
 gdp_merchant_luxury_contract.0044.e: "Comment aimeriez-vous voir [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], [hunter.GetFirstNameNoTooltip] ?"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName] : braconnage"
 gdp_merchant_luxury_contract.0051.desc: "Nous passons devant un village [local_province.Custom('GetProvinceGroundDescAdjective')] et nous renseignons sur la faune locale. Le chef du village nous met en garde très sérieusement et nous explique qu’une personnalité locale importante, [rich_local.Custom('FR_le_Char_Pi')][rich_local.GetTitledFirstName], était justement en train de chasser des [rich_local.Custom('GetAnimalPlural')] dans la région.\n\nAvant de poursuivre notre route, un villageois s’approche de nous et nous explique calmement qu’il serait facile de chasser l’un[rich_local.Custom('FR_E_GetAnimalType')] des [rich_local.Custom('GetAnimalPlural')] [rich_local.Custom('FR_du_Char_L')][rich_local.GetTitleAsNameNoTooltip|l] !\n\nUne idée audacieuse, mais peut-être une opportunité que nous ne devrions pas ignorer ?"
 gdp_merchant_luxury_contract.0051.a: "Un[rich_local.Custom('FR_E_GetAnimalType')] [rich_local.Custom('GetAnimalType')] ? Allons-y immédiatement !"
 gdp_merchant_luxury_contract.0051.a.flavor: "Les habitants pourraient être punis..."
 gdp_merchant_luxury_contract.0051.a.tt: "Vous tenterez de chasser illégalement des bêtes [rich_local.Custom('FR_du_Char_U_Pi')][rich_local.GetShortUIName]"
 gdp_merchant_luxury_contract.0051.b: "Je ne vais pas me mettre en travers du chemin d’un[rich_local.Custom('FR_E')] [rich_local.GetTitleAsNameNoTooltip|l]..."
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "Mon guide, [hunter.GetFirstName], nous faufile rapidement à travers [local_province.Custom('GetProvinceFoliageDesc')] et nous traversons [local_province.Custom('GetTerrainTypePlural')] à une vitesse impressionnante. Lorsque nous arrivons dans une clairière, [hunter.Custom('FR_IlElle')] s’arrête brusquement et tend l’oreille.\n\n« Silence ! » siffle-t-[hunter.Custom('FR_IlElle')] en m’entraînant hors de vue. « Restez à proximité. »\n\nÀ peine un instant plus tard, la meute de chasse nous dépasse en trombe et remue [local_province.Custom('GetProvinceGroundDesc')], tandis que les chasseurs crient au loin.\n\nC’est alors que je les entends : les cris d’un[rich_local.Custom('FR_E_GetAnimalType')] [rich_local.Custom('GetAnimalType')] !"
 gdp_merchant_luxury_contract.0052.a: "En voilà un[rich_local.Custom('FR_E_GetAnimalType')] ! Vite, le filet !"
 gdp_merchant_luxury_contract.0052.a.success: "Vous attrapez [rich_local.Custom('FR_Le_GetAnimalType')][rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.neutral: "Vous ratez [rich_local.Custom('FR_Le_GetAnimalType')][rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('FR_Le_GetAnimalType')|U][rich_local.Custom('GetAnimalType')] vous blesse"
 gdp_merchant_luxury_contract.0052.b: "Cachez-vous ! Nous sommes perdus !"
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('FR_Le_GetAnimalType')|U][rich_local.Custom('GetAnimalType')] s’échappe"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "Nous retournons au village, où le chef se précipite vers nous en criant que les hommes [rich_local.Custom('FR_du_Char_Pi')][rich_local.GetTitledFirstName] sont passés et qu’ils cherchaient des braconniers !\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName] jette un regard empli de remords [rich_local.Custom('FR_Au_GetAnimalType')][rich_local.Custom('GetAnimalType')] enchaîné[rich_local.Custom('FR_E_GetAnimalType')], sans toutefois parvenir à cacher sa fierté."
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName] fixe le sol d’un air abattu, tandis que le reste du village [hunter.Custom('FR_LeLa')] regarde de travers.\n\nAlors qu’[hunter.Custom('FR_IlElle')] regagne son logement, un[hunter.Custom('FR_E_GetAnimalType')] [hunter.Custom('GetAnimalType')] attaché[hunter.Custom('FR_E_GetAnimalType')] [hunter.Custom('GetAnimalWalkPresent')] sur [local_province.Custom('GetProvinceGroundDesc')]."
 gdp_merchant_luxury_contract.0053.a: "« Quelle merveilleuse créature... »"
 gdp_merchant_luxury_contract.0053.b: "« ... Je vais dire [rich_local.Custom('FR_au_Char_L')][rich_local.GetTitleAsNameNoTooltip|l] qui l’a pris ! »"
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip] est impressionné[hunter.Custom('FR_E')] par votre audace"
 gdp_merchant_luxury_contract.0053.c: "« C’était une très mauvaise idée... »"
 gdp_merchant_luxury_contract.0053.d: "« ... mais j’aurais quand même bien besoin d’une personne comme vous, [hunter.GetFirstNameNoTooltip]. »"
 gdp_merchant_luxury_contract.0053.e: "« Vous n’aviez jamais dit que vous aviez un[hunter.Custom('FR_E_GetAnimalType')] [hunter.Custom('GetAnimalType')] ! »"
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName] : [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "Ce matin, nous apercevons [local_barony.Custom('BaronyTownType')] de [local_province.GetBaronyNameExplicitlyNoTooltip], notre destination tant recherchée, qui s’élève devant nous depuis [local_province.Custom('GetTerrainLandPlural')]"
 gdp_merchant_luxury_contract.1001.desc.locals: "À l’entrée, nous demandons notre chemin en langue [local_county.GetCountyData.GetCulture.GetLanguage.GetName] aux villageois qui passent. Ils ont du mal à répondre à nos questions mal formulées, mais ils nous indiquent la direction"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "À la porte, un groupe de villageois répond à nos questions en langue [local_county.GetCountyData.GetCulture.GetLanguage.GetName] en nous indiquant le chemin"
 gdp_merchant_luxury_contract.1001.desc.religious: "du grand et vénérable sépulcre situé à [religious_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "du vénérable centre d’érudition situé à [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.fallback: "du marché local."
 gdp_merchant_luxury_contract.1001.a: "Le [local_province.Custom('GetRegionalMarketTerm')] local devrait avoir quelque chose."
 gdp_merchant_luxury_contract.1001.a.flavor: "Favorise les démonstrations d’[stewardship|El][stewardship_i|E] et d’[gold|El][gold_i|E]"
 gdp_merchant_luxury_contract.1001.a.tt: "Tentez de vous procurer un [domicile_artifact|El] de type #V Curiosité#! au marché"
 gdp_merchant_luxury_contract.1001.d: "Le grand [local_province.Custom('GetRegionalMarketTerm')] nous appelle !"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "Allons visiter ce lieu sacré."
 gdp_merchant_luxury_contract.1001.e.flavor: "Favorise les démonstrations de [piety|El][piety_i|E] et d’[learning|El][learning_i|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "Tentez de vous procurer un [domicile_artifact|El] de type #V Curiosité#! au site religieux"
 gdp_merchant_luxury_contract.1001.f: "Il y a sûrement beaucoup de choses à apprendre ici."
 gdp_merchant_luxury_contract.1001.f.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et de [diplomacy|El][diplomacy_i|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "Tentez de vous procurer un [domicile_artifact|El] de type #V Curiosité#! au centre d’érudition"
 gdp_merchant_luxury_contract.1001.return.religious: "Revenons à ce lieu sacré..."
 gdp_merchant_luxury_contract.1001.return.scholarly: "Trouvons ce centre d’érudition..."
 gdp_merchant_luxury_contract.1001.return.urban: "Je vais juste faire un tour au marché..."
 gdp_merchant_luxury_contract.1001.give_up: "Oh, oublions cela !"
 gdp_merchant_luxury_contract.1001.fallback: "Je ne quitterai pas [local_province.GetBaronyNameExplicitlyNoTooltip] les mains vides."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "Vous trouvez un bibelot au [local_province.Custom('GetRegionalMarketTermGloss')]"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName] : centre de commerce"
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetTitle.Custom('BaronyTownType')|U] de [local_province.GetBaronyNameExplicitlyNoTooltip] est en pleine effervescence, tandis que les habitants et les voyageurs cherchent des marchandises de toutes sortes au milieu d’un tourbillon d’images, de sons et d’odeurs sur le [local_province.Custom('GetRegionalMarketTermGloss')] [local_province.Custom('GetProvinceAdjective')].\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "Dans un coin sombre, j’aperçois un[urchin.Custom('FR_E')] enfant des rues revêche, dont les petits yeux perçants suivent en silence le flux incessant des passants."
 gdp_merchant_luxury_contract.1101.antiques: "Un étal de travers, rempli d’antiquités, jonché de bibelots en [local_province.Custom('GetRandomRegionalWood')] et d’objets en métal terni, éveille ma curiosité, pour le plus grand plaisir [dealer.Custom('FR_DuDela')] propriétaire."
 gdp_merchant_luxury_contract.1101.bookseller: "Le tissu en [ROOT.Char.Custom('RegionalFabric')] déchiré de l’auvent d’une boutique délabrée contraste avec les innombrables rouleaux et volumes abîmés qui s’empilent contre les murs et sur lesquels veille [Select_CString(dealer.IsFemale,'une femme','un homme')]."
 gdp_merchant_luxury_contract.1101.travelers: "Des voyageurs [traveler.GetCulture.GetCollectiveNoun|l] burinés se sont installés sur une place voisine ; leurs vêtements et leur langue les distinguent des autochtones [local_province.GetCulture.GetCollectiveNoun|l]."
 gdp_merchant_luxury_contract.1101.tavern: "De l’autre côté de la rue, le chahut bruyant qui règne dans une taverne attire mon attention et j’aperçois [Select_CString(gambler.IsFemale,'une joueuse','un joueur')] à l’air louche qui fait tournoyer une bourse remplie de pièces qu’[gambler.Custom('FR_IlElle')] vient de soutirer à un adversaire désemparé."
 gdp_merchant_luxury_contract.1101.merchant: "Je remarque [Select_CString(other_merchant.IsFemale,'une femme','un homme')] élégamment vêtu[other_merchant.Custom('FR_E')] qui s’en prend à une caravane avançant lentement à travers la ville. C’est manifestement [Select_CString(other_merchant.IsFemale,'une marchande','un marchand')] du coin, [Select_CString(other_merchant.IsFemale,'une femme','un homme')] comme je les aime."
 gdp_merchant_luxury_contract.1101.a: "C[urchin.Custom('FR_EtEtte')] enfant a l’air... rusé[urchin.Custom('FR_E')]."
 gdp_merchant_luxury_contract.1101.a.flavor: "Favorise les démonstrations d’[intrigue|El][intrigue_i|E] et de [diplomacy|El][diplomacy_i|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "Vous attendez de voir ce que va dire l’enfant des rues"
 gdp_merchant_luxury_contract.1101.b: "[Select_CString(dealer.IsFemale,'La commerçante','Le commerçant')] pourrait avoir quelque chose d’intéressant..."
 gdp_merchant_luxury_contract.1101.b.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et d’[gold|El][gold_i|E]"
 gdp_merchant_luxury_contract.1101.b.tt: "Vous essayez d’acheter une antiquité intéressante"
 gdp_merchant_luxury_contract.1101.c: "Il doit bien y avoir un ou deux livres intéressants là-dedans."
 gdp_merchant_luxury_contract.1101.c.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et d’[gold|El][gold_i|E]"
 gdp_merchant_luxury_contract.1101.c.tt: "Vous essayez d’acheter un livre"
 gdp_merchant_luxury_contract.1101.d: "Ces [traveler.GetCulture.GetCollectiveNounNoTooltip] ont dû voir du pays."
 gdp_merchant_luxury_contract.1101.d.lingua: "Une chance de mettre à l’épreuve ma maîtrise de la langue [traveler.GetCulture.GetLanguage.GetNameNoTooltip|l]."
 gdp_merchant_luxury_contract.1101.d.flavor: "Favorise les démonstrations de [diplomacy|El][diplomacy_i|E] et d’[learning|El][learning_i|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "Vous discutez avec les voyageurs"
 gdp_merchant_luxury_contract.1101.e: "Je ne peux pas résister à un jeu de hasard..."
 gdp_merchant_luxury_contract.1101.e.flavor: "Favorise les démonstrations d’[intrigue|El][intrigue_i|E] et de chance"
 gdp_merchant_luxury_contract.1101.e.tt: "Vous voyez ce que vous pouvez gagner du joueur"
 gdp_merchant_luxury_contract.1101.f: "Ah, [Select_CString(other_merchant.IsFemale,'une concurrente','un concurrent')] pourrait me comprendre."
 gdp_merchant_luxury_contract.1101.f.flavor: "Favorise les démonstrations d’[stewardship|El][stewardship_i|E] et de [prestige_level|El][prestige_i|E]"
 gdp_merchant_luxury_contract.1101.f.tt: "Vous voyez ce que [Select_CString(other_merchant.IsFemale,'la commerçante','le commerçant')] a à dire"
 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstName] a du mal à baisser sa garde. J’essaie de gagner sa confiance en lui parlant avec mépris des passants qui se pressent et en lui racontant des anecdotes sur les rues difficiles de [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "Mes récits sur des contrées lointaines et les bénéfices d’une vie de marchand éveillent son intérêt. Alors que je m’apprête à lui faire une offre, [urchin.Custom('FR_IlElle')] me devance et me tend le bijou, qui sera à moi si j’emmène l’enfant !"
 gdp_merchant_luxury_contract.1102.urchin.success: "Finalement, j’ai l’impression que nous nous entendons si bien que je peux lui demander sans détour combien [urchin.Custom('FR_IlElle')] souhaite pour ce bijou. Avec un sourire malicieux, [urchin.Custom('FR_IlElle')] me donne son prix."
 gdp_merchant_luxury_contract.1102.urchin.failure: "Finalement, j’ai l’impression qu’on s’entend si bien que je peux lui demander sans détour combien [urchin.Custom('FR_IlElle')] veut pour ce bijou. [urchin.Custom('FR_IlElle')|U] se contente de faire la moue et me dit d’aller me faire voir."
 gdp_merchant_luxury_contract.1102.antiques: "[Select_CString(dealer.IsFemale,'La marchande rusée','Le marchand rusé')] et moi marchandons sans fin en discutant de la qualité de fabrication de l’objet, de son âge et de son état.\n\nMais nous nous retrouvons finalement dans une impasse."
 gdp_merchant_luxury_contract.1102.antiques.success: "Le prix s’avère correct, bien meilleur que ce que j’aurais pu espérer."
 gdp_merchant_luxury_contract.1102.antiques.failure: "Je ne peux pas dire que je sois satisfait[ROOT.Char.Custom('FR_E')] de l’issue, car j’ai l’impression d’avoir été floué[ROOT.Char.Custom('FR_E')]."
 gdp_merchant_luxury_contract.1102.bookseller: "[Select_CString(dealer.IsFemale,'La marchande rusée','Le marchand rusé')] et moi marchandons sans fin en discutant de l’origine du livre, de son âge et de son état.\n\nMais nous nous retrouvons finalement dans une impasse."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "Le groupe commence à m’accueillir un peu plus chaleureusement ; apparemment, je suis la personne la plus intéressante qu’ils aient vue de toute la journée, et très vite, nous nous mettons rapidement à échanger des anecdotes sur nos voyages."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nTrès vite, nous mangeons ensemble, nous rions et nous plaisantons sur nos mésaventures et nos expériences similaires à [local_province.GetBaronyNameExplicitly]. Au moment de nous quitter, [traveler.GetFirstName] me remet un paquet et me serre chaleureusement dans ses bras."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nAprès avoir échangé quelques anecdotes, je suis vite à court de sujets de conversation, et les [traveler.GetCulture.GetCollectiveNoun] ne peuvent cacher qu’ils aimeraient que je poursuive mon voyage."
 gdp_merchant_luxury_contract.1102.tavern: "Nous nous échauffons aux dés et remportons à tour de rôle une ou deux parties, tout en échangeant des pièces et en nous taquinant mutuellement ; mais [gambler.GetFirstName] est un[gambler.Custom('FR_E')] adversaire redoutable, cela ne fait aucun doute.\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "J’ai [merchant.GetFaith.WealthGodName] à mes côtés aujourd’hui ! Grâce à une avance fulgurante dès le début, je laisse [gambler.GetFirstNameNoTooltip] bouche bée et maudissant son sort, s’enfonçant de plus en plus, jusqu’à ce qu’[gambler.Custom('FR_IlElle')] parte en trombe en jetant ses dés dans la rue !"
 gdp_merchant_luxury_contract.1102.tavern.failure: "Cela prend du temps, mais je finis par prendre le dessus et mets la patience de [gambler.GetFirstNameNoTooltip] à rude épreuve, à tel point qu’[gambler.Custom('FR_IlElle')] décide d’abandonner, tandis que je me vante de mes pièces."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "Finalement, [gambler.Custom('FR_IlElle')] sort le grand jeu et très vite, non seulement j’ai plusieurs tours de retard, mais je suis aussi à court de patience et de pièces. Mécontent[ROOT.Char.Custom('FR_E')], je m’éloigne de [gambler.GetFirstNameNoTooltip] et de sa joie malveillante."
 gdp_merchant_luxury_contract.1102.merchant: "Dans des bureaux calmes situés près du [local_province.Custom('GetRegionalMarketTermGloss')], [other_merchant.Custom('FR_le_Char_Pi')][other_merchant.GetTitledFirstName] et moi discutons longuement de nos affaires, réfléchissons à nos relations communes dans des contrées lointaines et soulignons tous deux notre réussite.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "Nous nous entendons bien et partageons quelques verres [other_merchant.Custom('RegionalDrink')] et du pain, tout en échangeant des conseils et en discutant des perspectives d’avenir qui s’annoncent mutuellement avantageuses. Il est difficile de se dire au revoir, et [other_merchant.GetFirstNameNoTooltip] m’offre quelques délicieux échantillons en guise de cadeau d’adieu."
 gdp_merchant_luxury_contract.1102.merchant.failure: "Nous ne semblons pas avoir grand-chose en commun et nous sommes vite agacés par les fanfaronnades de l’autre et le refus de partager des informations utiles. Je vais bientôt prendre congé de [Select_CString(other_merchant.IsFemale,'cette femme','cet homme')] insipide."
 gdp_merchant_luxury_contract.1102.a: "Cela ne pourrait être mieux."
 gdp_merchant_luxury_contract.1102.b: "Il faudra s’en contenter..."
 gdp_merchant_luxury_contract.1111.desc: "Je traverse la rue en direction [Select_CString(urchin.IsFemale,'de la fille','du garçon')]. Lorsqu’[urchin.Custom('FR_IlElle')] m’aperçoit, son regard perçant semble chercher une explication, mais je m’approche du mur contre lequel [urchin.Custom('FR_IlElle')] est adossé[urchin.Custom('FR_E')] et lui fais comprendre que je ne représente aucune menace.\n\nUn bijou étincelant brille de mille feux dans sa main, mais [urchin.Custom('FR_IlElle')] le range rapidement alors qu’[urchin.Custom('FR_IlElle')] suit mon regard. « Que voulez-vous ? demande-t-[urchin.Custom('FR_IlElle')]. Je m’appelle [urchin.GetFirstName]. Vous êtes dans mes rues. »"
 gdp_merchant_luxury_contract.1111.a: "On dirait que vous vous y connaissez un peu."
 gdp_merchant_luxury_contract.1111.a.success_critical: "Vous gagnez sa confiance"
 gdp_merchant_luxury_contract.1111.a.success: "Vous achetez son butin"
 gdp_merchant_luxury_contract.1111.a.failure: "Vous suscitez son mépris"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "L’objet a été volé par [urchin.GetFirstName] dans les rues de [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1111.artifact.ring: "Bague [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "Broche [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "Collier d’origine [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "Je feins ostensiblement l’indifférence tandis que je passe en revue les objets proposés, en essayant de dissimuler l’ampleur réelle de mon intérêt – même s’il est difficile de dire à quel point [Select_CString(dealer.IsFemale,'la commerçante','le commerçant')] y croit.\n\nJe jette rapidement mon dévolu sur un objet qui se détache du lot et qui, avec le temps, est devenu encore plus exotique, même ici, à l’endroit où il a été créé."
 gdp_merchant_luxury_contract.1121.a: "Parlons du prix..."
 gdp_merchant_luxury_contract.1121.a.success_critical: "Vous négociez un très bon prix"
 gdp_merchant_luxury_contract.1121.a.success: "Vous négociez un bon prix"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.Custom('FR_IlElle')|U] négocie avec fermeté"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "[artifact.GetName] antique"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] L’objet porte les traces du temps et n’est plus utilisable au combat."
 gdp_merchant_luxury_contract.1121.artifact.bowl: "Jatte [local_province.GetCounty.GetCulture.GetNameNoTooltip] antique"
 gdp_merchant_luxury_contract.1121.artifact.plate: "Assiette [local_province.GetCounty.GetCulture.GetNameNoTooltip] antique"
 gdp_merchant_luxury_contract.1121.artifact.urn: "Urne [local_province.GetCounty.GetCulture.GetNameNoTooltip] antique"
 gdp_merchant_luxury_contract.1131.desc: "Je feins ostensiblement l’indifférence tandis que je parcours les ouvrages proposés, en essayant de dissimuler l’étendue réelle de mon intérêt – même s’il est difficile de dire à quel point [dealer.Custom('FR_LeLa')] libraire y croit.\n\nJe jette rapidement mon dévolu sur une reliure très particulière qui se détache du lot et qui, pour autant que je puisse en juger, est un ouvrage rare et méconnu."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Acquis auprès d’un marchand à [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1141.desc: "Je m’approche [traveler.Custom('FR_DuDela')] [Select_CString(traveler.IsFemale, 'cheffe', 'chef' )] du groupe avec un sourire chaleureux, en espérant que nos origines étrangères seront un facteur de cohésion dans ce pays étranger.\n\n[traveler.Custom('FR_IlElle')|U] se présente sous le nom de [traveler.GetFirstName]. À mon tour, je me présente : « [merchant.GetNameNoTooltip]. Vous avez sûrement déjà entendu parler de moi ? » dis-je, mi-vantardise, mi-plaisanterie."
 gdp_merchant_luxury_contract.1141.a: "Vous devez certainement connaître quelques anecdotes intéressantes !"
 gdp_merchant_luxury_contract.1141.a.flavor: "Une mise à l’épreuve de votre [diplomacy|El][diplomacy_i|E] et votre [prestige_level|El][prestige_i|E]"
 gdp_merchant_luxury_contract.1141.a.success: "Vous vous entendez bien avec [traveler.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip] se lasse de vous"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] L’objet, acquis auprès d’un marchand à [local_province.GetBaronyNameExplicitly], porte les traces du temps et n’est plus utilisable au combat."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "Broche [traveler.GetCulture.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ L’objet a été acquis auprès de voyageurs à [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1151.desc: "Alors que je me faufile à travers les rideaux pour pénétrer dans ce repaire miteux, j’observe les vauriens et les vagabonds. Au milieu de la pièce, [Select_CString(gambler.IsFemale,'la joueuse','le joueur')] est assis[gambler.Custom('FR_E')] et compte joyeusement ses pièces.\n\nJe m’assois en face d[gambler.Custom('FR_EluiElle')] et [gambler.Custom('FR_IlElle')] m’examine en haussant les sourcils. « Vous voulez jouer ? », demande-t-[gambler.Custom('FR_IlElle')] en souriant. « Je m’appelle [gambler.GetFirstName], et ne commencez pas à pleurer quand je vous prendrai votre argent. »"
 gdp_merchant_luxury_contract.1151.a: "Jouons !"
 gdp_merchant_luxury_contract.1151.a.flavor: "Une mise à l’épreuve de votre [intrigue|El][intrigue_i|E] et votre chance"
 gdp_merchant_luxury_contract.1151.a.success: "Vous [gambler.Custom('FR_LeLa')] dépouillez"
 gdp_merchant_luxury_contract.1151.a.failure: "Vous gagnez quelques pièces"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "Vous perdez quelques pièces"
 gdp_merchant_luxury_contract.1151.artifact.dice: "Dé porte-bonheur de joueur"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "Le dé durement gagné par [gambler.GetFirstName], un[gambler.Custom('FR_E')] escroc et [Select_CString(gambler.IsFemale,'joueuse','joueur')] originaire de [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1161.desc: "Je mets fin aux jérémiades [Select_CString(other_merchant.IsFemale,'de la marchande','du marchand')] en me présentant comme [Select_CString(ROOT.Char.IsFemale,'cheffe','chef')] de [merchant.GetPrimaryTitle.GetNameNoTooltip] de [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] et en expliquant que je ne suis pas ici pour des raisons commerciales.\n\nEn retour, j’apprends qu’[other_merchant.Custom('FR_IlElle')] s’appelle [other_merchant.GetTitledFirstName], qu’[other_merchant.Custom('FR_IlElle')] vient de [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly] et qu’[other_merchant.Custom('FR_IlElle')] fait du commerce de [merchant_good.GetName|l]. Après nous être observés mutuellement, [other_merchant.Custom('FR_IlElle')] me propose de m’héberger dans les environs."
 gdp_merchant_luxury_contract.1161.a: "Nous avons plusieurs points desquels discuter."
 gdp_merchant_luxury_contract.1161.a.flavor: "Une mise à l’épreuve de votre [stewardship|El][stewardship_i|E] et votre [prestige_level|El][prestige_i|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip] vous apprécie de plus en plus"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip] est intransigeant[other_merchant.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Échantillon de tissus"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Échantillon de [other_merchant.Custom('RegionalFabric')] de [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], utilisés par les commerçants dans leurs transactions."
 gdp_merchant_luxury_contract.1161.artifact.gem: "Échantillons de pierres précieuses"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Échantillons de pierres précieuses de [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], utilisés par les commerçants dans leurs transactions."
 gdp_merchant_luxury_contract.1161.artifact.gold: "Échantillons de métal"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Échantillons de métal précieux de [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip], utilisés par les commerçants dans leurs transactions."
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName] : centre religieux"
 gdp_merchant_luxury_contract.1501.desc: "Nous suivons le chemin de nombreux pèlerins et fidèles, et nous arrivons bientôt devant l’incroyable [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l] en [religious_building_province.GetName].\n\n"
 gdp_merchant_luxury_contract.1501.site: "Ce sépulcre est un magnifique monument témoignant de la ferveur des anciens dirigeants [religious_building_faith.GetReligion.GetAdherentNamePlural] au nom [religious_building_faith.HighGodNamePossessive]. De l’intérieur s’échappe le murmure mélodieux d’un office religieux."
 gdp_merchant_luxury_contract.1501.tombs: "À quelques pas de là se trouve un ensemble de tombes en pierre patinée, ornées [religious_building_faith.ReligiousSymbol3], mais désormais envahies par la végétation et abîmées par le passage des saisons."
 gdp_merchant_luxury_contract.1501.pilgrim: "Des files ininterrompues de fidèles, facilement reconnaissables comme des pèlerins à leur apparence, attendent pour entrer. Un groupe attire particulièrement l’attention, car il transporte une sorte de relique."
 gdp_merchant_luxury_contract.1501.monks: "Non loin de là, un groupe de moines se tient tranquillement à l’ombre, plongés dans leurs pensées et échangeant quelques mots à voix basse, tandis que le monde autour d’eux continue lentement de tourner."
 gdp_merchant_luxury_contract.1501.keepsake: "En m’approchant du bâtiment, je remarque une partie usée du mur, où plusieurs pierres se sont descellées et fissurées au fil du temps."
 gdp_merchant_luxury_contract.1501.apostate: "Tout seul, [Select_CString(pilgrim.IsFemale,'une femme','un homme')] à l’air abattu est assis[pilgrim.Custom('FR_E')] à l’ombre du bâtiment, les coudes posés sur les genoux, le visage dans une main et un livre dans l’autre."
 gdp_merchant_luxury_contract.1501.a: "Je veux jeter un œil à l’intérieur."
 gdp_merchant_luxury_contract.1501.a.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et de [piety|El][piety_i|E]"
 gdp_merchant_luxury_contract.1501.a.tt: "Vous voyez ce qui vous attend dans [religious_building_faith.HouseOfWorship]"
 gdp_merchant_luxury_contract.1501.b: "Il doit bien y avoir quelque chose dans ces tombes..."
 gdp_merchant_luxury_contract.1501.b.flavor: "Favorise les démonstrations d’[intrigue|El][intrigue_i|E] et de [prowess|El][prowess_i|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "Vous revenez la nuit pour piller une tombe"
 gdp_merchant_luxury_contract.1501.c: "Ces pèlerins ont l’air naïfs..."
 gdp_merchant_luxury_contract.1501.c.flavor: "Favorise les démonstrations d’[intrigue|El][intrigue_i|E] et de [diplomacy|El][diplomacy_i|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "Vous essayez d’escroquer un pèlerin"
 gdp_merchant_luxury_contract.1501.d: "Je souhaite parler à ces moines."
 gdp_merchant_luxury_contract.1501.d.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et de [piety|El][piety_i|E]"
 gdp_merchant_luxury_contract.1501.d.tt: "Vous entamez un dialogue avec les moines"
 gdp_merchant_luxury_contract.1501.e: "Personne ne remarquera qu’il manque une pierre..."
 gdp_merchant_luxury_contract.1501.e.flavor: "Favorise les démonstrations d’[intrigue|El][intrigue_i|E] et de [prowess|El][prowess_i|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "Vous tentez de chaparder un morceau de l’édifice"
 gdp_merchant_luxury_contract.1501.f: "[Select_CString(pilgrim.IsFemale,'Cette femme','Cet homme')] a l’air d’avoir besoin d’aide."
 gdp_merchant_luxury_contract.1501.f.flavor: "Favorise les démonstrations de [diplomacy|El][diplomacy_i|E] et de [piety|El][piety_i|E]"
 gdp_merchant_luxury_contract.1501.f.tt: "Vous engagez la conversation avec [Select_CString(pilgrim.IsFemale,'la pèlerine','le pèlerin')]"
 gdp_merchant_luxury_contract.1502.site: "[Select_CString(priest.IsFemale,'La religieuse','Le religieux')] m’observe attentivement et évalue soigneusement mes paroles et mon expression, tandis que les fidèles défilent devant nous en murmurant des prières et des vœux.\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "Finalement, [priest.Custom('FR_IlElle')] soupire : « Je ne peux pas refuser votre demande si sincère. » [priest.Custom('FR_IlElle')|U] prend un livre et ses doigts s’attardent un instant sur la couverture avant qu’[priest.Custom('FR_IlElle')] ne me le tende.\n\n« Prenez ceci. Puissiez-vous y trouver les paroles [religious_building_faith.HighGodNameAlternatePossessive]. »"
 gdp_merchant_luxury_contract.1502.site.failure: "Finalement, [priest.Custom('FR_IlElle')] fronce les sourcils. « Sortez, vous n’avez rien à faire dans [religious_building_faith.HouseOfWorship], un lieu de prière. Je n’ai pas le temps aujourd’hui de m’occuper de vos bêtises. »\n\nPlusieurs fidèles se retournent et attendent que je parte."
 gdp_merchant_luxury_contract.1502.pilgrim: "En posant amicalement quelques questions, j’apprends qu’ils ont apporté la relique ici pour en faire don [pilgrim.GetFaith.HouseOfWorship2], après l’avoir acquise près de leur ville natale.\n\nJe feins l’inquiétude et la compassion à l’idée qu’ils aient été trompés de manière si indigne !\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Agacé[ROOT.Char.Custom('FR_E')], mais pas en colère, je les regarde s’éloigner et jeter la petite boîte dans le terrain vague situé derrière l’enceinte."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Leur réaction me surprend toutefois un peu lorsqu’ils jettent la relique par terre et la piétinent jusqu’à ce qu’elle soit complètement détruite. La foule est consternée.\n\nJe ferais mieux de prendre congé..."
 gdp_merchant_luxury_contract.1502.tomb: "Ces tombes sont plus difficiles à ouvrir qu’il n’y paraît ! Nous finissons par écarter l’un de ces grands monuments d’un coup sec et puissant.\n\nJe m’essuie le front pour essuyer la sueur et tente de jeter un œil à l’intérieur obscur, quand je découvre quelque chose — je tends prudemment la main et l’en retire.\n\n« Apportez de la lumière ! », chuchoté-je avec impatience.\n\nDans mes mains, je tiens..."
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "une urne finement travaillée et décorée !"
 gdp_merchant_luxury_contract.1502.tomb.success: "une urne usée et abîmée ?"
 gdp_merchant_luxury_contract.1502.tomb.failure: "un... os ?"
 gdp_merchant_luxury_contract.1502.monks: "Ces moines sont encore plus intéressants que je ne le pensais ! Leur vie spirituelle est source de nombreuses réflexions et interprétations passionnantes, depuis [monk.GetFaith.ReligiousText] jusqu’aux mystères [monk.GetFaith.TricksterGodNamePossessive].\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "Nous entamons une conversation agréable et les moines semblent tristes de devoir me dire au revoir. [monk.GetFirstName] me glisse quelque chose dans la main au moment de partir et m’adresse un sourire chaleureux."
 gdp_merchant_luxury_contract.1502.monks.failure: "Cependant, [monk.GetFirstName] semble toujours se désintéresser dès que je commence à parler et paraît agacé[monk.Custom('FR_E')] et indifférent[monk.Custom('FR_E')]. Je me rends vite compte que j’ai abusé de son hospitalité."
 gdp_merchant_luxury_contract.1502.keepsake: "En jetant un dernier coup d’œil derrière moi, je fais de mon mieux pour, d’un mouvement fluide, renverser quelque chose, le rattraper et m’en saisir.\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "Avec grâce et dextérité, j’enlève un petit morceau du mur et le cache sous mon manteau, tout en continuant mon chemin, l’air de rien. Personne ne semble s’en être aperçu !"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "Mes gestes maladroits ne font que me faire tomber par terre dans un bruit sourd et me faire gémir de douleur, tandis que plusieurs pèlerins curieux jettent des regards incrédules tantôt vers moi, tantôt vers le mur."
 gdp_merchant_luxury_contract.1502.apostate: "[pilgrim.Custom('FR_IlElle')|U] ne proteste pas lorsque je m’assois à côté d[pilgrim.Custom('FR_EluiElle')] et que je récite doucement mes versets préférés tirés [merchant.GetFaith.ReligiousText3]. Très vite, distrait[pilgrim.Custom('FR_E')] par mes paroles, [pilgrim.Custom('FR_IlElle')] cesse de pleurer.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "Je sens qu’[pilgrim.Custom('FR_IlElle')] est touché[pilgrim.Custom('FR_E')] par mes paroles et, en effet, il ne faut pas longtemps avant qu’[pilgrim.Custom('FR_IlElle')] me fasse comprendre qu’[pilgrim.Custom('FR_IlElle')] souhaite quitter cet endroit et m’accompagner sur la voie [merchant.GetFaith.HighGodNameAlternatePossessive] !"
 gdp_merchant_luxury_contract.1502.apostate.success: "Alors que je lis, je sens qu’[pilgrim.Custom('FR_IlElle')] change, comme si un lourd fardeau tombait de ses épaules.\n\n[pilgrim.Custom('FR_IlElle')|U] se lève en silence et quitte l’enceinte ; son livre usé laissé à mes côtés."
 gdp_merchant_luxury_contract.1502.apostate.failure: "Mais il ne faut pas longtemps avant que son visage ne s’assombrisse et qu’[pilgrim.Custom('FR_IlElle')] soit envahi[pilgrim.Custom('FR_E')] par une nouvelle émotion : la colère.\n\n[pilgrim.Custom('FR_IlElle')|U] hurle que je [pilgrim.Custom('FR_LeLa')] pousse à l’apostasie — qui plus est au sein même [pilgrim.GetFaith.HouseOfWorship3] ! Très vite, des spectateurs indignés se joignent à [pilgrim.Custom('FR_LuiElle')]..."
 gdp_merchant_luxury_contract.1502.a.critical: "Cela ne pourrait être mieux."
 gdp_merchant_luxury_contract.1502.a: "Cela fera l’affaire."
 gdp_merchant_luxury_contract.1502.b: "Il faudra s’en contenter..."
 gdp_merchant_luxury_contract.1511.desc: "Une fois le soleil couché, nous nous approchons à nouveau des abords de l’extraordinaire [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l], à la recherche de richesses oubliées parmi les tombes des habitants morts depuis longtemps.\n\nDe peur d’être vus, nous prenons soin d’éviter les routes habituelles, avant de nous retrouver dans ce cimetière froid et silencieux."
 gdp_merchant_luxury_contract.1511.a: "Ouvrons un tombeau, vite !"
 gdp_merchant_luxury_contract.1511.a.flavor: "Une mise à l’épreuve de votre [intrigue|El][intrigue_i|E] et votre [prowess|El][prowess_i|E]"
 gdp_merchant_luxury_contract.1511.a.success_critical: "Vous trouvez un objet de grande valeur"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "Vous trouvez un [domicile_artifact|El] de type #V Curiosité#! de grande qualité"
 gdp_merchant_luxury_contract.1511.a.success: "Vous trouvez un objet ordinaire"
 gdp_merchant_luxury_contract.1511.a.success.tt: "Vous trouvez un [domicile_artifact|El] de type #V Curiosité#! de mauvaise qualité"
 gdp_merchant_luxury_contract.1511.a.failure: "Vous ne trouvez rien qui vaille la peine d’être mentionné"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "Vous trouvez un [domicile_artifact|El] de type #V Curiosité#!"
 gdp_merchant_luxury_contract.1511.artifact.urn: "Objets funéraires d’origine [religious_building_faith.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "Une urne provenant de la tombe d’un [religious_building_faith.GetAdherentName] mort depuis longtemps, et pillée au cœur du bâtiment [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1511.artifact.skull: "Crâne pillé"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "Le crâne d’un [religious_building_faith.GetAdherentName] mort depuis longtemps, et pillé à partir d’une tombe du bâtiment [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1511.artifact.bone: "Os pillé ([priest.Custom('RandomSaintBone')|l])"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "L’os d’un [religious_building_faith.GetAdherentName] mort depuis longtemps, et pillé à partir d’une tombe du bâtiment [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1521.desc: "Tandis que je franchis les grandes portes du bâtiment, je me retrouve dans un hall d’entrée richement décoré et imprégné du parfum exotique des rites et des offrandes.\n\nLes fidèles se rassemblent autour d’[Select_CString(priest.IsFemale, 'une femme', 'un homme')], [Select_CString(priest.IsFemale,'la religieuse','le religieux')], qui me remarque immédiatement. Il semblerait manifestement que j’attire l’attention malgré moi.\n\n[priest.Custom('FR_IlElle')|U] avance vers moi [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )], « Je vous salue et vous souhaite la bienvenue dans notre formidable [religious_building_district.GetType.GetPrimaryBuildingType.GetName]. »\n\n« Que cherchez-vous ici ? », me demande-t-[priest.Custom('FR_IlElle')] d’un air curieux. « Suivez-vous les préceptes de la foi [religious_building_faith.GetAdjectiveNoTooltip] ? »"
 gdp_merchant_luxury_contract.1521.a: "Je veux apprendre tout ce que je peux de la foi [religious_building_faith.GetAdjectiveNoTooltip]."
 gdp_merchant_luxury_contract.1521.a.flavor: "Une mise à l’épreuve de votre [learning|El][learning_i|E] et votre [piety_level|El][piety_i|E]"
 gdp_merchant_luxury_contract.1521.a.success: "[Select_CString(priest.IsFemale,'La religieuse','Le religieux')] me propose un texte"
 gdp_merchant_luxury_contract.1521.a.failure: "[Select_CString(priest.IsFemale,'La religieuse','Le religieux')] est méfiant[priest.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1531.desc: "Les pèlerins m’observent d’un air méfiant alors que je m’approche, puis serrent encore plus fort leur modeste relique lorsque j’essaie d’y jeter un coup d’œil.\n\nC’est certainement un objet d’une certaine importance pour les [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] et ferait un sujet de conversation intéressant à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nJe peux sûrement convaincre ces naïfs qu’ils se sont fait arnaquer par un marchand ou un ecclésiastique sans scrupules..."
 gdp_merchant_luxury_contract.1531.a: "C’est manifestement un faux, car il y en a des centaines en [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
 gdp_merchant_luxury_contract.1531.a.success: "Les pèlerins jettent la relique"
 gdp_merchant_luxury_contract.1531.a.failure: "Les pèlerins sont furieux"
 gdp_merchant_luxury_contract.1541.desc: "Au début, les moines me regardent avec méfiance, déconcertés par mon comportement étranger, mais ils ne parviennent pas à cacher leur curiosité, surtout lorsque je leur fais comprendre que je souhaite discuter de théologie.\n\nLes plus jeunes d’entre eux sont hésitants, mais leur chef, [monk.GetFirstName], m’accueille parmi eux et me bombarde de questions sur mes voyages."
 gdp_merchant_luxury_contract.1541.a: "Oui, bien sûr, mais que pensez-vous [monk.GetFaith.WealthGodNamePossessive] ?"
 gdp_merchant_luxury_contract.1541.a.flavor: "Une mise à l’épreuve de votre [learning|El][learning_i|E] et votre [piety_level|El][piety_i|E]"
 gdp_merchant_luxury_contract.1541.a.success: "Les moines apprécient la discussion"
 gdp_merchant_luxury_contract.1541.a.failure: "Les moines sont déçus"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "Chapelet de foi [religious_building_faith.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "Un ensemble de chapelets de foi [religious_building_faith.GetAdjective], cadeau d’un moine au bâtiment [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1541.artifact.icon: "Icône [religious_building_faith.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "Une icône [SCOPE.Custom('ArtifactQuality')] représentant [newly_created_artifact.GetFeatureText('icon_decoration')], cadeau du moine [monk.GetFirstName] au bâtiment [religious_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1551.desc: "Regardant furtivement tout autour de moi, j’erre nonchalamment à proximité du bâtiment [religious_building_district.GetType.GetPrimaryBuildingType.GetName], souriant poliment aux passants et faisant mine d’admirer l’architecture.\n\nJe me concentre progressivement sur une partie en pierre qui semble déjà se détacher, dans l’un des recoins les plus calmes du périmètre."
 gdp_merchant_luxury_contract.1551.a: "Il ne me reste plus qu’à trouver le bon moment..."
 gdp_merchant_luxury_contract.1551.a.success: "Vous prenez quelques pierres"
 gdp_merchant_luxury_contract.1551.a.failure: "Vous êtes pris[GetPlayer.Custom('FR_E')] en flagrant délit"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Pierre sacrée"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "Une partie en pierre du centre religieux [religious_building_district.GetType.GetPrimaryBuildingType.GetName], volée en guise de souvenir."
 gdp_merchant_luxury_contract.1561.desc: "En m’approchant d[pilgrim.Custom('FR_EluiElle')], je constate qu’il s’agit d’[Select_CString(pilgrim.IsFemale,'une pèlerine','un pèlerin')], comme tant d’autres ici, chargé[pilgrim.Custom('FR_E')] de bagages et brûlé[pilgrim.Custom('FR_E')] par le soleil.\n\nJ’apprends qu’[pilgrim.Custom('FR_IlElle')] s’appelle [pilgrim.GetFirstName] et qu’après avoir subi de nombreux coups du sort, [pilgrim.Custom('FR_IlElle')] a perdu la foi en la divinité suprême [pilgrim.GetFaith.GetAdjectiveNoTooltip]. Même ce pèlerinage n’a pas suffi à lui redonner.\n\nJe vois ses yeux baignés de larmes et l’exemplaire [pilgrim.GetFaith.ReligiousText3] usé par la lecture. Un témoignage de son combat."
 gdp_merchant_luxury_contract.1561.a: "Dans [merchant.GetFaith.ReligiousText] se trouvent les réponses..."
 gdp_merchant_luxury_contract.1561.a.flavor: "Une mise à l’épreuve de votre [diplomacy|El][diplomacy_i|E] et votre [piety_level|El][piety_i|E]"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip] est converti[pilgrim.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip] est ragaillardi[pilgrim.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip] est enragé[pilgrim.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "Exemplaire [religious_building_faith.ReligiousText3] maculé de larmes"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "Écrits personnels d’un[pilgrim.Custom('FR_E')] [pilgrim.Custom('FR_FaithGenderedAdj')] tourmenté[pilgrim.Custom('FR_E')], [pilgrim.GetFirstName], qui a perdu la foi."
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName] : centre du savoir"
 gdp_merchant_luxury_contract.1601.desc: "Je suis frappé[ROOT.Char.Custom('FR_E')] par l’immensité du bâtiment [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName], dont les couloirs vibrent de la présence de nombreux esprits studieux, occupés à débattre et à s’instruire.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "[Select_CString(scholar.IsFemale,'Une femme','Un homme')], accompagné[scholar.Custom('FR_E')] de serviteurs, passe à toute vitesse et repousse avec dédain les autres érudits. Apparemment, c’est [scholar.Custom('FR_LuiElle')] qui mène la danse ici."
 gdp_merchant_luxury_contract.1601.sages: "Sous un arbre, dans l’enceinte du site, [Select_CString(sage.IsFemale,'une vieille femme','un vieil homme')] est assis[sage.Custom('FR_E')] en silence ; peut-être réfléchit-[sage.Custom('FR_IlElle')] à des questions existentielles, ou peut-être fait-[sage.Custom('FR_IlElle')] simplement une petite sieste."
 gdp_merchant_luxury_contract.1601.library: "En passant devant une porte, j’aperçois [Select_CString(scholar.IsFemale,'une femme seule','un homme seul')] entouré[scholar.Custom('FR_E')] d’une multitude d’ouvrages dans une impressionnante bibliothèque. [scholar.Custom('FR_IlElle')|U] lit tranquillement et semble être dans un état de béatitude."
 gdp_merchant_luxury_contract.1601.physician: "Dans une autre pièce, [Select_CString(physician.IsFemale,'une femme','un homme')] se tient devant une collection macabre de spécimens, tant animaux qu’humains, ainsi que divers instruments. On ne peut qu’espérer qu’il s’agisse d’un[physician.Custom('FR_E')] médecin..."
 gdp_merchant_luxury_contract.1601.student: "Impossible de ne pas remarquer le groupe d’étudiants particulièrement bruyants : ils discutent dans la bonne humeur et rient de bon cœur en se taquinant mutuellement dans un coin ombragé de la cour carrée centrale."
 gdp_merchant_luxury_contract.1601.botanist: "Dans un coin tranquille du bâtiment, je tombe sur une pièce où se trouve une étrange collection de plantes et d’animaux, conservée et cataloguée par [Select_CString(botanist.IsFemale,'une femme','un homme')]."
 gdp_merchant_luxury_contract.1601.a: "Ce doit être [Select_CString(scholar.IsFemale,'la doyenne','le doyen')]."
 gdp_merchant_luxury_contract.1601.a.flavor: "Favorise les démonstrations de [diplomacy|El][diplomacy_i|E] et de [prestige_level|El][prestige_i|E]"
 gdp_merchant_luxury_contract.1601.a.tt: "Vous vous approchez [Select_CString(scholar.IsFemale,'de la doyenne','du doyen')]"
 gdp_merchant_luxury_contract.1601.b: "Je suis intrigué[ROOT.Char.Custom('FR_E')] par [Select_CString(sage.IsFemale,'cette vieille femme','ce vieil homme')]..."
 gdp_merchant_luxury_contract.1601.b.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et de [piety_level|El][piety_i|E]"
 gdp_merchant_luxury_contract.1601.b.tt: "Vous vous approchez [sage.Custom('FR_DuDela')] sage"
 gdp_merchant_luxury_contract.1601.c: "On trouve toujours des connaissances dans une bibliothèque."
 gdp_merchant_luxury_contract.1601.c.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et de [diplomacy|El][diplomacy_i|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "Vous entrez dans la bibliothèque"
 gdp_merchant_luxury_contract.1601.d: "L’art médical est fascinant."
 gdp_merchant_luxury_contract.1601.d.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "Vous vous approchez [physician.Custom('FR_DuDela')] médecin"
 gdp_merchant_luxury_contract.1601.e: "Ces étudiants ont l’air sympa."
 gdp_merchant_luxury_contract.1601.e.flavor: "Favorise les démonstrations de [diplomacy|El][diplomacy_i|E] et de [prowess|El][prowess_i|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "Vous vous approchez des étudiants"
 gdp_merchant_luxury_contract.1601.f: "Cette collection de spécimens est à couper le souffle."
 gdp_merchant_luxury_contract.1601.f.flavor: "Favorise les démonstrations d’[learning|El][learning_i|E] et de [diplomacy|El][diplomacy_i|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "Vous découvrez la collection"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "Partie initiale de la collection du bâtiment [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]."
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName] me suit dans mon raisonnement jusqu’à ce que je me sois exprimé[ROOT.Char.Custom('FR_E')] très clairement. Je viens d’un pays étranger où ce document n’a aucune valeur.\n\nAprès avoir avancé les arguments pertinents, je lui laisse la parole."
 gdp_merchant_luxury_contract.1602.dean.success: "Un large sourire illumine son visage tandis qu’[scholar.Custom('FR_IlElle')] cherche les documents officiels attestant de mes... qualités."
 gdp_merchant_luxury_contract.1602.dean.failure: "Son visage impassible se crispe, et, gêné[scholar.Custom('FR_E')], [scholar.Custom('FR_IlElle')] me prie de partir."
 gdp_merchant_luxury_contract.1602.sages: "Nous parlons pendant des heures de philosophie, nous réfléchissons à des questions dont j’ai rarement parlé, sans même nous rendre compte que le ciel s’assombrit et qu’une nouvelle journée touche à sa fin.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "Finalement, [sage.Custom('FR_IlElle')] se lève, tire quelque chose de son vêtement, me le tend avec un hochement de tête complice et disparaît sans plus attendre."
 gdp_merchant_luxury_contract.1602.sages.failure: "Finalement, [sage.Custom('FR_IlElle')] se lève, resserre sa robe et disparaît sans plus attendre. Au moins, j’ai apprécié notre dernière conversation..."
 gdp_merchant_luxury_contract.1602.library: "Je montre de l’intérêt pour ses livres, et [scholar.Custom('FR_IlElle')] se présente sous le nom de [scholar.GetFirstName]. Pendant un moment, [scholar.Custom('FR_IlElle')] énumère les nombreux ouvrages qu’[scholar.Custom('FR_IlElle')] a lus ou qu’[scholar.Custom('FR_IlElle')] va lire dans le cadre de ses études, et me demande mon avis sur chacun d’entre eux.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip] se met rapidement à sourire comme un[scholar.Custom('FR_E')] enfant et, quand vient l’heure de partir, [scholar.Custom('FR_IlElle')] me tend un livre en me faisant un clin d’œil malicieux."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip] se désintéresse rapidement de moi et de mes réponses, et se replonge brusquement dans ses notes. Je décide de partir."
 gdp_merchant_luxury_contract.1602.physician: "J’exprime mon intérêt pour l’anatomie et j’essaie d’apporter ma contribution autant que possible. [physician.Custom('FR_IlElle')|U] parle longuement des caractéristiques du corps et utilise des modèles osseux pour illustrer son propos.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.Custom('FR_IlElle')|U] semble impressionné[physician.Custom('FR_E')] par mes connaissances, déplore l’ignorance de ses étudiants et de ses collègues, puis me montre un article."
 gdp_merchant_luxury_contract.1602.physician.failure: "Face à mes questions et à mes explications hésitantes, [physician.Custom('FR_IlElle')] lève les yeux au ciel d’impatience et cherche très vite un prétexte pour me mettre à la porte."
 gdp_merchant_luxury_contract.1602.student: "Nous passons un moment très animé à la taverne [student.Custom('GetPubName')], où je fais figure de maître parmi ces jeunes débauchés. Je leur raconte des anecdotes de mes nombreux voyages et réponds à leurs innombrables questions.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "Nous passons de taverne en taverne et, en un rien de temps, c’est le matin. Nous nous disons au revoir au bord de la route après un dernier éloge, et l’un d’entre eux me glisse quelque chose dans la main. Quelle nuit !"
 gdp_merchant_luxury_contract.1602.student.failure: "Au début, tout semble bien se passer, mais ils se lassent vite de ma compagnie et je me retrouve seul[ROOT.Char.Custom('FR_E')] avec mon verre dans un quartier peu recommandable. Qu’est-ce que j’ai dit ?"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName] me fait découvrir avec enthousiasme la collection, en me montrant des objets remarquables, à la fois insolites et magnifiques.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.Custom('FR_IlElle')|U] est ravi[botanist.Custom('FR_E')] de l’intérêt que je manifeste et hoche la tête avec enthousiasme tout en soulignant la rareté et la valeur de ce qu’[botanist.Custom('FR_IlElle')] me présente.\n\nLorsque je dois malheureusement partir, [botanist.Custom('FR_IlElle')] me fait cadeau de ce qui avait particulièrement attiré mon attention."
 gdp_merchant_luxury_contract.1602.botanist.failure: "J’ai l’impression de ne pas pouvoir apprécier à sa juste valeur la collection ou sa visite guidée, et, très vite, [botanist.Custom('FR_IlElle')] me fait comprendre que ma présence n’est pas nécessaire..."
 gdp_merchant_luxury_contract.1602.a: "Je vais en prendre grand soin !"
 gdp_merchant_luxury_contract.1602.b: "C’est déjà ça, j’imagine."
 gdp_merchant_luxury_contract.1611.desc: "Après s’être montré[scholar.Custom('FR_E')] d’abord réticent[scholar.Custom('FR_E')], [Select_CString(scholar.IsFemale,'la doyenne','le doyen')] est extrêmement flatté[scholar.Custom('FR_E')] lorsque je lui apprends que je suis [Select_CString(ROOT.Char.IsFemale,'une femme','un homme')] d’affaires prospère venu[scholar.Custom('FR_E')] de loin. [scholar.Custom('FR_IlElle')|U] se présente de manière théâtrale comme étant [scholar.Custom('MistressMaster')|U] [scholar.GetFirstName].\n\n[scholar.Custom('FR_IlElle')|U] m’invite dans son bureau privé et, en chemin, me parle des particularités architecturales et des curiosités du lieu. « Alors, que puis-je faire pour vous, [Select_CString(merchant.IsFemale,'chère','cher')] [merchant.GetTitledFirstNameNoTooltip] ? » demande-t-[merchant.Custom('FR_IlElle')] avec un sourire en coin."
 gdp_merchant_luxury_contract.1611.a: "J’aurais aimé avoir l’occasion d’étudier ici..."
 gdp_merchant_luxury_contract.1611.a.flavor: "Une mise à l’épreuve de votre [diplomacy|El][diplomacy_i|E] et votre [prestige_level|El][prestige_i|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "Vous recevez un diplôme honorifique"
 gdp_merchant_luxury_contract.1611.a.success: "Moyennant une certaine somme, vous recevez un diplôme honorifique"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip] est offensé[scholar.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Diplôme honorifique"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "Un certificat d’apprentissage honorifique, présenté par [Select_CString(scholar.IsFemale,'la doyenne','le doyen')] du bâtiment [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] à [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1621.desc: "Je m’approche prudemment [sage.Custom('FR_DuDela')] sage, pour ne pas perturber sa profonde concentration, mais c’est lui qui finalement me fait sursauter !\n\n« Voulez-vous vous joindre à nous ? » demande-t-[sage.Custom('FR_IlElle')] calmement, sans se tourner vers moi ni ouvrir les yeux. « Venez vous asseoir. »\n\nJ’accepte humblement son invitation et m’assois à côté d[sage.Custom('FR_EluiElle')], aussi respectueusement que possible.\n\n« Je suis [sage.GetFirstName], dit-[sage.Custom('FR_IlElle')] d’une voix rauque. Qu’est-ce qui vous amène ici ? »"
 gdp_merchant_luxury_contract.1621.a: "Je... ne sais pas."
 gdp_merchant_luxury_contract.1621.a.flavor: "Une mise à l’épreuve de votre [learning|El][learning_i|E] et votre [piety_level|El][piety_i|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.Custom('FR_IlElle')|U] est ragaillardi[sage.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.Custom('FR_IlElle')|U] est déçu[sage.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1631.desc: "Je pénètre dans une pièce où s’étendent à perte de vue des rangées d’étagères remplies de parchemins, où flotte une odeur d’encre et de papier anciens.\n\nJe m’approche tranquillement de l’érudit[scholar.Custom('FR_E')] taciturne, jusqu’à ce qu’[scholar.Custom('FR_IlElle')] m’aperçoive enfin. Au début, [scholar.Custom('FR_IlElle')] se montre très occupé[scholar.Custom('FR_E')] et distant[scholar.Custom('FR_E')], mais son regard s’adoucit lorsque mon origine étrangère semble éveiller sa curiosité."
 gdp_merchant_luxury_contract.1631.a: "Qu’êtes-vous en train de lire ?"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.Custom('FR_IlElle')|U] est impressionné[scholar.Custom('FR_E')] par vos connaissances"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.Custom('FR_IlElle')|U] pense que vous êtes inculte"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "Je me retrouve devant une scène macabre. D’innombrables os, humains ou animaux, sont disposés en rangées bien ordonnées, qu’[Select_CString(physician.IsFemale,'une femme','un homme')] examine et manipule sous les yeux d’une poignée d’élèves.\n\n[physician.Custom('FR_IlElle')|U] finit par me remarquer d’un regard interrogateur et me fait signe de rejoindre le groupe. Je comprends qu’il s’agit de [physician.GetFirstName], et je suis soulagé[ROOT.Char.Custom('FR_E')] de constater que c’est bel et bien un[physician.Custom('FR_E')] médecin."
 gdp_merchant_luxury_contract.1641.a: "Ah, n’est-ce pas là un os de [merchant.Custom('RandomSaintBone')|l] ?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip] est impressionné[physician.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1641.a.failure: "Vous déplaisez à [physician.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "[physician.Custom('RandomSaintBone')], os humain"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "Os utilisé comme support pédagogique en médecine. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "Crâne humain"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "Crâne utilisé comme support pédagogique en médecine. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "En m’approchant du groupe, je me présente. Les étudiants forment un cercle autour de moi et rient entre eux, mais sont manifestement fascinés par [Select_CString(ROOT.Char.IsFemale,'cette étrangère','cet étranger')] qui s’approche d’eux.\n\nAprès avoir compris que je suis [Select_CString(ROOT.Char.IsFemale,'une femme','un homme')] d’affaires ayant beaucoup voyagé, venu[ROOT.Char.Custom('FR_E')] de loin, leur curiosité est éveillée et je suis invité[ROOT.Char.Custom('FR_E')] dans un établissement infâme des environs pour... prendre un rafraîchissement."
 gdp_merchant_luxury_contract.1651.a: "En route pour la taverne !"
 gdp_merchant_luxury_contract.1651.a.success: "Vous divertissez les étudiants"
 gdp_merchant_luxury_contract.1651.a.failure: "Vous ennuyez les étudiants"
 gdp_merchant_luxury_contract.1661.desc: "En entrant dans cette étrange salle, je reste sans voix. Je n’ai jamais vu une telle collection : une diversité incalculable de couleurs, de fleurs et de feuilles, de fourrures et de plumes, un véritable festin pour les sens et un reflet de la nature...\n\nJe suis ramené[ROOT.Char.Custom('FR_E')] à la réalité par [botanist.Custom('FR_LeLa')] responsable des lieux, qui se présente sous le nom de [botanist.GetFirstName] et me propose une visite guidée."
 gdp_merchant_luxury_contract.1661.a: "Avec plaisir !"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip] apprécie votre intérêt"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip] est déçu[botanist.Custom('FR_E')]"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] d’un[owner.Custom('FR_E_GetAnimalType')] [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$."
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "Plume d’un[owner.Custom('FR_E_GetAnimalType')] [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$."
