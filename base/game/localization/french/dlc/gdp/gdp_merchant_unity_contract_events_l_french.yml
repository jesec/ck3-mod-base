l_french:
 option_boilerplate.tt.partner_aptitude: "#WEAK Ce duel dépend de la [aptitude|El] de votre [deputy|El]#!"
 option_boilerplate.tt.partner_aptitude.success: "Votre $game_concept_deputy|l$ réussit"
 option_boilerplate.tt.partner_aptitude.failure: "Votre $game_concept_deputy|l$ échoue"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$ : mécontentement à [destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_unity_contract.1004.desc: "La lettre [local_ruler.Custom('FR_du_Char_Pi')][local_ruler.GetTitledFirstName] est brève et va droit au but : le comportement de m[trader.Custom('FR_OnA')] $game_concept_trader|l$[trader.Custom('FR_E')], [trader.Custom('FR_le_Char_Pi')][trader.GetTitledFirstName], et, par conséquent, de ma compagnie, a été remis en cause par les habitants furieux de [destination.GetBaronyNameExplicitly].\n\nLes marchands locaux, les petits commerçants et les résidents se plaignent tous d’irrégularités dans les pratiques commerciales de ma société. [local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstNameNoTooltip] tient à mettre un terme à cette affaire et à apaiser ses plaignants.\n\n[trader.Custom('FR_le_Char_Pi')|U][trader.GetTitledFirstNameNoTooltip] a pris trop de libertés, loin du regard critique auquel [trader.Custom('FR_IlElle')] serait soumis[trader.Custom('FR_E')] ici, à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nIl ne reste plus qu’à se rendre à [destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_unity_contract.1004.a: "Mettons-nous en route."
 gdp_merchant_unity_contract.1004.tt.destination_list: "Vous commencez immédiatement à voyager vers [destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT Pour terminer le [task_contract|El] :\n$EFFECT_LIST_BULLET$Vous aurez #V 3#! occasions de donner des assurances :\n$TAB$$EFFECT_LIST_BULLET$#V 2#! assurances garantissent une $label_success_standard|l$\n$TAB$$EFFECT_LIST_BULLET$#V 3#! assurances garantissent une $label_success_critical|l$\n$TAB$$EFFECT_LIST_BULLET$#V 1#! assurance peut mener à une $label_success_standard|l$, une $label_success_qualified|l$ ou un $label_failure_standard|l$\n$EFFECT_LIST_BULLET$Les défis peuvent être soit :\n$TAB$$EFFECT_LIST_BULLET$Mettre à l’épreuve votre [stewardship|El]\n$TAB$$EFFECT_LIST_BULLET$Mettre à l’épreuve la [aptitude|El] du [deputy|El] comme [GetCourtPositionType('partner_court_position').GetName()|l]\n$TAB$$EFFECT_LIST_BULLET$Mettre à l’épreuve votre [diplomacy|El], [intrigue|El] ou [learning|El]#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$ : place de la ville"
 gdp_merchant_unity_contract.1010.desc.intro: "« [ROOT.Char.GetTitledFirstNameNoTooltip], je présume ? », soupire [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName] lorsque nous croisons sa suite à [destination.GetBaronyNameExplicitly]. M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('trader'))], [trader.Custom('FR_le_Char_Pi')][trader.GetTitledFirstName], est derrière, suivi[trader.Custom('FR_E')] par des gardes."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "M[partner.Custom('FR_OnA')] [GetCourtPositionType('partner_court_position').GetName()|l], [partner.GetFirstName] se tient derrière moi, sur le qui-vive, prêt[partner.Custom('FR_E')] à m’aider."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n« Ce marchand qui est le vôtre a provoqué un sacré remue-ménage. Nos témoins pourront en attester. » [local_ruler.GetFirstNameNoTooltip] poursuit : « Je compte sur vous pour régler cela rapidement, je n’ai pas de temps à y consacrer ! »"
 gdp_merchant_unity_contract.1010.desc.outro: "\n\nJ’ai reçu l’ordre de rencontrer [person_c.Custom('FR_le_Char_Pi')][person_c.GetTitledFirstName] et [person_d.Custom('FR_le_Char_Pi')][person_d.GetTitledFirstName] et d’entendre leurs doléances. [trader.GetFirstNameNoTooltip] me jette un regard qui semble dire : « [ROOT.Char.Custom('FR_MonseigneurMadame')|U]... Vous comprenez bien que... »"
 gdp_merchant_unity_contract.1010.a: "[local_ruler.GetTitledFirstNameNoTooltip], pourriez-vous m’éclairer à ce sujet ?"
 gdp_merchant_unity_contract.1010.a.tt: "Vous recherchez immédiatement l’explication [THIS.Char.Custom('FR_du_Char_Pi')][THIS.Char.GetTitledFirstName]"
 gdp_merchant_unity_contract.1010.b: "On se reverra avec [person_c.Custom('FR_le_Char_Pi')][person_c.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1010.c: "[person_d.Custom('FR_le_Char_Pi')|U][person_d.GetTitledFirstNameNoTooltip] a hâte de nous parler."
 gdp_merchant_unity_contract.1010.d: "Finissons-en tout de suite."
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$ : [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "On nous escorte jusqu’aux appartements privés, peu modestes, [char_current.Custom('FR_du_Char_L')][char_current.GetTitleAsName|l]. [char_current.Custom('FR_IlElle')|U] me conduit dans une salle qui sert manifestement de lieu de réunion aux personnalités les plus importantes [destination.GetTitle.Custom('BaronyTownTypePossessive')] de [ROOT.Title.GetTierAsNameNoTooltip|l], et m’indique où m’asseoir."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.Custom('FR_le_Char_Pi')|U][char_current.GetTitledFirstName] m’emmène dans les locaux voisins de sa compagnie, où ses associés inscrivent dans les livres comptables le résultat des transactions de la journée."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName] est responsable du port de la ville et supervise les entrées et les sorties depuis les quais. D’innombrables documents consignent les taxes dues par les navires et recensent les cargaisons livrées et chargées."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName] supervise le marché principal en [destination.GetTitle.GetBaseNameNoTier] et veille à ce que tous les marchands ambulants soient titulaires d’une licence et à ce que la loi [local_ruler.Custom('FR_du_Char_L')][local_ruler.GetTitleAsNameNoTooltip|l] soit respectée."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "Je rencontre [char_current.GetFirstName] dans sa forge, occupé[char_current.Custom('FR_E')] à marteler des fers à cheval. [char_current.Custom('FR_IlElle')|U] ne remarque même pas que je m’approche et s’excuse lorsque son regard croise le mien, puis confie le travail à un apprenti."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "Je retrouve [char_current.GetFirstName] dans sa tannerie, un endroit nauséabond situé à la périphérie de la ville. [char_current.Custom('FR_IlElle')|U] ne semble même pas remarquer la puanteur... Les nombreuses peaux ainsi que les nombreux clients témoignent que les bénéfices l’emportent sur la mauvaise odeur."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "Je retrouve [char_current.GetFirstName] dans son atelier, où règne une atmosphère dense, imprégnée d’un parfum de [char_current.Custom('GetRandomAppropriateTree')]. En me voyant, [char_current.Custom('FR_IlElle')] met de côté les pièces qu’[char_current.Custom('FR_IlElle')] était en train de sculpter."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName] dirige la garde [destination.GetTitle.GetAdjectiveNoTooltip] et je [char_current.Custom('FR_LeLa')] trouve en train de somnoler dans l’armurerie. À son réveil, [char_current.Custom('FR_IlElle')] m’invite à m’asseoir, tout en marmonnant qu’[char_current.Custom('FR_IlElle')] faisait une petite pause."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "« Parlons sans détours, [ROOT.Char.GetTitledFirstNameNoTooltip], commence-t-[char_current.Custom('FR_IlElle')]. On m’a dit que votre associé[trader.Custom('FR_E')] était impliqué[trader.Custom('FR_E')] dans toutes sortes de manigances et"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n« Mettez de l’ordre dans votre compagnie, sinon vous devrez trouver un autre endroit où exercer vos activités. »"
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "« Est-ce si difficile..., dit-[char_current.Custom('FR_IlElle')] en souriant, de mener vos affaires honnêtement ? En ce qui concerne votre commerce, [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ne fait pas bonne figure... »"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "« Je vous préviens, dit-[char_current.Custom('FR_IlElle')] en souriant, [local_ruler.Custom('FR_le_Char_L')][local_ruler.GetTitleAsNameNoTooltip|l] a fait preuve de patience jusqu’à présent, mais vous feriez mieux de ne pas trop tirer sur la corde. »"
 gdp_merchant_unity_contract.1011.desc.personality.market: "« Beaucoup de $game_concept_trader|l$s exercent ici », dit-[char_current.Custom('FR_IlElle')] en souriant et en écartant les bras. « Mais c’est surtout à propos [trader.Custom('FR_DuDela')] vôtre », ajoute-t-[char_current.Custom('FR_IlElle')] d’un ton accusateur en me désignant, « que je reçois sans cesse des plaintes. »"
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "« On a un dicton par ici, dit-[char_current.Custom('FR_IlElle')] en souriant. Il n’y a pas de fumée sans feu, et votre $game_concept_trader|l$ fait beaucoup de fumée, je peux vous le dire ! »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "« J’ai toujours mené mes affaires avec honnêteté ; je tiens une comptabilité rigoureuse et j’entretiens de bonnes relations avec mes clients. C’est dommage que tout le monde ne prenne pas la peine de faire de même... »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "« Ne tournons pas autour du pot : chacun de nous est observé par [char_current.GetFaith.WealthGodName], et je veille à rester dans les bonnes grâces [char_current.GetFaith.WealthGodNamePossessive]. Celui qui ne le fait pas finit vite par en subir les conséquences... »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "« Écoutez, j’aime gagner de l’argent autant que n’importe qui, peut-être même plus ! Mais il est impossible de gérer une entreprise où l’on ne me paie pas à la moindre occasion. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "« Vous semblez être quelqu’un de raisonnable, [ROOT.Char.GetTitledFirstNameNoTooltip]. Vous comprenez bien que votre $game_concept_trader|l$[trader.Custom('FR_E')] nous a causé du tort et que nous ne pouvons pas nous le permettre. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "« Je me considère comme quelqu’un de franc et direct, et j’espère que les autres feront de même avec moi. Votre $game_concept_trader|l$[trader.Custom('FR_E')] est [Select_CString(trader.IsFemale,'une menteuse','un menteur')]. C’est aussi simple que ça. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "« Je sais qu’on dirait que tout va bien, mais je dépends des livraisons pour faire des affaires et votre $game_concept_trader|l$[trader.Custom('FR_E')] m’a fait faux bond trop souvent. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "« J’aime jouer franc jeu, [ROOT.Char.Custom('FR_MonseigneurMadame')], dans les affaires, avec mes subordonnés et mes supérieurs. Mais toute équité n’est possible que si les deux parties l’assurent, autrement... Eh bien, c’est ainsi que naît le ressentiment chez certaines personnes. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "« Je suis très occupé[char_current.Custom('FR_E')] ; vous aussi, d’ailleurs, alors je vais être [Select_CString(char_current.IsFemale,'franche','franc')]. Si je n’ai pas ce dont j’ai besoin, je ne peux pas nourrir les miens. Je veux que ce problème soit réglé au plus vite. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "« Écoutez, je suis sûr[char_current.Custom('FR_E')] que [trader.GetFirstName] est au fond quelqu’un de bien, mais ma patience a des limites et [trader.Custom('FR_IlElle')] les a dépassées depuis longtemps. »"
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "« Alors... qu’allez-vous faire ? Votre $game_concept_trader|l$[trader.Custom('FR_E')] s’est fait beaucoup d’ennemis ici sans raison. Nous demandons simplement à être traités décemment. »"
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "a égaré plusieurs cargaisons. »"
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "a livré des produits de mauvaise qualité. »"
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "n’a pas versé les taxes dues. »"
 gdp_merchant_unity_contract.1011.a: "Tenter de justifier ces divergences"
 gdp_merchant_unity_contract.1011.b: "Essayer de [char_current.Custom('FR_LeLa')] convaincre de votre honneur"
 gdp_merchant_unity_contract.1011.c: "Inventer une histoire"
 gdp_merchant_unity_contract.1011.d.gold: "« Tenez, pour vous dédommager des désagréments causés. »"
 gdp_merchant_unity_contract.1011.d.competitiveness: "« Je vais faire en sorte que tout rentre dans l’ordre. »"
 gdp_merchant_unity_contract.1011.e: "« Peut-être pourrions-nous parvenir à un terrain d’entente ? »"
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], à vous de l’expliquer."
 gdp_merchant_unity_contract.1011.f.partner_away: "Si seulement mon [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] était ici..."
 gdp_merchant_unity_contract.1011.f.partner_diff: "Si seulement j’avais un autre [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]..."
 gdp_merchant_unity_contract.1011.f.no_partner: "Si seulement j’avais un [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]..."
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT Vous avez donné [task_contract.MakeScope.Var('assurances_given').GetValue|0V] garanties sur les #V 3#!#! possibles"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT Vous avez parlé avec [task_contract.MakeScope.Var('chars_checked').GetValue|0V] [characters|El] sur les #V 3#!#! possibles"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "Vous donnez #P 1#! garantie supplémentaire"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "Aucune garantie n’est donnée"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Enjoliver un chiffre par-ci, faire disparaître une entrée par-là"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "Attendez, non. Oh. C’est vrai ?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "Une grossière erreur de sa part"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Chaque mot est cohérent"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "Pas aussi futé[char_current.Custom('FR_E')] qu’[char_current.Custom('FR_IlElle')] le pensait"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Bien plus [Select_CString(char_current.IsFemale,'maligne','malin')] que vous"
 gdp_merchant_unity_contract.1011.learning.tt.success: "Vous savez où chercher"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "Vous cherchez partout, mais ne trouvez rien"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$ : réussite !"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$ : échec !"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$ : tâche ignorée"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "Tout en parcourant les grands livres, [char_current.Custom('FR_le_Char_Pi')][char_current.GetTitledFirstName] met en évidence des cas de mauvaise gestion, des dépenses dont les retombées escomptées ne se sont jamais concrétisées ou qui sont restées en deçà des résultats promis."
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "Je m’étends longuement sur la bonne réputation de ma compagnie à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] et sur les nombreuses références dont elle bénéficie auprès des personnes respectables de la région. Les récentes transactions constituent clairement une aberration qu’il convient de ne pas approfondir, dans l’intérêt du commerce."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "Je raconte en détail les dernières difficultés que j’ai rencontrées, en multipliant les digressions inutiles et en parsemant mon récit de détails véridiques, jusqu’à ce que je perde moi-même le fil de cette toile de mensonges."
 gdp_merchant_unity_contract.1012.desc.method.learning: "Nous discutons pendant ce qui nous semble être une éternité et passons en revue tous les aspects imaginables des activités [char_current.Custom('FR_du_Char_Pi')][char_current.GetTitledFirstName] à [destination.GetBaronyNameExplicitly]. Nous ne négligeons aucun détail et posons toutes les questions possibles."
 gdp_merchant_unity_contract.1012.desc.method.partner: "[partner.GetFirstName] prend la tête de l’entrevue. [char_current.Custom('FR_le_Char_Pi')|U][char_current.GetTitledFirstName] s’assied face à [partner.Custom('FR_LuiElle')] pour répondre à son barrage interminable de questions. Sa patience s’amenuise clairement à mesure que le temps passe..."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "« Votre compréhension dans cette affaire serait très appréciée. » Je souris, sors ma bourse et dépose quelques pièces sur la table. [char_current.Custom('FR_IlElle')|U] se fige un instant et jette un regard tantôt sur le métal brillant, tantôt sur mes sourcils levés."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "« L’entreprise regrette profondément les désagréments que ce malentendu vous a causés, dis-je d’une voix douce. Je réparerai personnellement le préjudice que vous avez subi. »"
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "J’ai ainsi fait tout mon possible. Il est temps de clore cette histoire."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip] me jette un regard complice et ramasse les pièces."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "La surprise de [char_current.GetFirstNameNoTooltip] fait rapidement place à la colère, et on me montre la porte."
 gdp_merchant_unity_contract.1012.desc.result.success: "Avec un peu de ruse et en me plaignant des aléas du commerce, [char_current.GetFirstNameNoTooltip] finit par accepter mes explications pour chacune de ces divergences. Ce ne sont là que les tristes réalités du commerce à distance."
 gdp_merchant_unity_contract.1012.desc.result.failure: "Malgré tous mes efforts, [char_current.Custom('FR_IlElle')] oppose à chacun de mes arguments sa propre solution ou un contre-argument, et se montre insatisfait[char_current.Custom('FR_E')]."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "Un tiens vaut mieux que deux tu l’auras, et la fortune certainement mal acquise de ce[char_current.Custom('FR_TTte')] [char_current.GetWomanMan] se trouve désormais entre mes mains. Même si en m’en emparant, j’ai réduit à néant la possibilité d’enquêter sur [char_current.Custom('FR_LuiElle')]."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "Que la chance nous accompagne encore la prochaine fois."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Avec un peu de chance, nous réussirons mieux la prochaine fois."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.Custom('FR_IlElle')|U] ne peut rien opposer à ça."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "J’espère que ma bourse tiendra le coup jusqu’à notre prochaine visite..."
 gdp_merchant_unity_contract.1012.a: "Maintenant, [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1012.b: "Allons voir [person_c.Custom('FR_le_Char_Pi')][person_c.GetTitledFirstNameNoTooltip]."
 gdp_merchant_unity_contract.1012.c: "[person_d.Custom('FR_le_Char_Pi')|U][person_d.GetTitledFirstNameNoTooltip] nous attend..."
 gdp_merchant_unity_contract.1012.d: "Finissons-en tout de suite."
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "Vous continuez d’essayer de donner des garanties"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "C’est à vous de décider comment résoudre cette situation"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$ : la résolution"
 gdp_merchant_unity_contract.1021.desc.intro: "Une fois de plus, nous nous réunissons sur la place centrale, où [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName] a convoqué les plaignants et [Select_CString(trader.IsFemale,'ma','mon')] $game_concept_trader|l$[trader.Custom('FR_E')] afin d’entendre mon avis définitif sur la question.\n\n[person_c.GetFirstName] et [person_d.GetFirstName] me regardent, tandis que [trader.GetFirstName] semble [Select_CString(trader.IsFemale,'nerveuse','nerveux')] pour la première fois depuis mon arrivée, et s’agite sous leur regard.\n\nMon intuition est"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "que les habitants ont été ralliés à notre cause."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "que les habitants sont plutôt satisfaits de mes efforts."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "que je n’ai en aucun cas gagné la confiance des habitants."
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.Custom('FR_le_Char_L')|U][local_ruler.GetTitleAsNameNoTooltip|l] bâille : « Bon, alors, où en est-on avec"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "ces cargaisons manquantes ? »"
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "ces produits de mauvaise qualité ? »"
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "ces taxes impayées ? »"
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Ayant donné toutes les garanties possibles, vous obtiendrez une $label_success_critical|l$, même si vous ne sanctionnez pas [trader.Custom('FR_le_Char_Pi')][trader.GetTitledFirstNameNoTooltip].#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT Ayant donné suffisamment de garanties, vous obtiendrez probablement une $label_success_standard|l$, même si vous ne sanctionnez pas [trader.Custom('FR_le_Char_Pi')][trader.GetTitledFirstNameNoTooltip].#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT Comme vous n’avez pas donné suffisamment de garanties, vos maigres efforts pourraient susciter de la résistance si vous ne punissez pas [trader.Custom('FR_le_Char_Pi')][trader.GetTitledFirstNameNoTooltip].#!"
 gdp_merchant_unity_contract.1021.a: "« Comme je l’ai expliqué, il s’agissait simplement d’un malentendu regrettable. »"
 gdp_merchant_unity_contract.1021.a.tt: "Vous pensez que vos garanties suffisent"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "Si vous avez donné beaucoup de garanties"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "Si vous avez donné des garanties et que les habitants ont rallié votre cause"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "Si vous n’avez pas su rassurer et que les habitants réagissent mal"
 gdp_merchant_unity_contract.1021.b: "Vous en paierez la moitié."
 gdp_merchant_unity_contract.1021.b.tt: "Votre verdict penche en faveur [local_ruler.Custom('FR_du_Char_Pi')][local_ruler.GetTitledFirstName], mais vous allégez tout de même le fardeau fiscal [trader.Custom('FR_du_Char_Pi')][trader.GetTitledFirstName]"
 gdp_merchant_unity_contract.1021.c: "« Toute cette affaire n’est qu’un tissu d’absurdités. De la calomnie et des balivernes ! »"
 gdp_merchant_unity_contract.1021.c.tt: "Vous rejetez catégoriquement toute faute de la part de la compagnie"
 gdp_merchant_unity_contract.1021.d: "« [trader.Custom('FR_le_Char_Pi')|U][trader.GetTitledFirstNameNoTooltip] est coupable et doit être puni[trader.Custom('FR_E')]. »"
 gdp_merchant_unity_contract.1021.d.tt: "Vous sacrifiez [trader.Custom('FR_le_Char_Pi')][trader.GetTitledFirstNameNoTooltip] pour le bien de la compagnie"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$ : un simple malentendu"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$ : une affaire réglée"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$ : une affaire en suspens"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$ : insatisfaisant"
 gdp_merchant_unity_contract.1022.desc.success_critical: "Les habitants se regardent en hochant la tête avec enthousiasme, tandis que [trader.GetFirstName] rayonne de joie. [local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstName] est visiblement soulagé[local_ruler.Custom('FR_E')], et quelque peu surpris[local_ruler.Custom('FR_E')]. « Très bien, dans ce cas, l’affaire est close ! » s’exclame-t-[local_ruler.Custom('FR_IlElle')].\n\nLes plaignants me remercient tous chaleureusement d’être venu[ROOT.Char.Custom('FR_E')] et de les avoir rassurés. La compagnie inspire finalement encore plus confiance qu’auparavant à [destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_unity_contract.1022.desc.success_standard: "Les habitants se regardent et acquiescent mollement, tandis que [trader.GetFirstName] sourit. [local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstName] semble hésitant[local_ruler.Custom('FR_E')], mais passe rapidement à autre chose. « Bon. Eh bien, l’affaire est close », dit-[trader.Custom('FR_IlElle')], d’un ton presque interrogatif.\n\nLes plaignants semblent assez satisfaits tandis qu’ils discutent des arguments. Il semble que la réputation de la compagnie à [destination.GetBaronyNameExplicitlyNoTooltip] soit assurée pour le moment."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "Pendant un bref instant de tension, [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName] et ses serviteurs semblent avoir l’intention de contester ma conclusion peu convaincante.\n\n« Bon... », soupire [local_ruler.Custom('FR_le_Char_L')][local_ruler.GetTitleAsNameNoTooltip|l], tout en jetant un regard aux plaignants mécontents. « Veillez à ce que cela ne se reproduise plus. »\n\nLes habitants ont manifestement des doutes, mais c’est à [trader.GetFirstName] de s’en occuper."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "Le silence s’abat sur la place.\n\nUn silence tendu et gênant règne tandis que les habitants se regardent les uns les autres, le mécontentement leur tordant les coins de la bouche.\n\n[local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstName] grogne « C’est tout ? », soutenu[local_ruler.Custom('FR_E')] par la colère des plaignants derrière [local_ruler.Custom('FR_LuiElle')].\n\nOn entend clairement [trader.GetFirstName] déglutir nerveusement. « Je suis vraiment désolé[trader.Custom('FR_E')] pour ce désagrément, parvient-[trader.Custom('FR_IlElle')] à articuler. Mais nous ne pouvons plus rien faire. Ce genre de choses... ça arrive. »"
 gdp_merchant_unity_contract.1022.a: "Ça n’aurait pas pu mieux se passer."
 gdp_merchant_unity_contract.1022.b: "Tout est bien qui finit bien..."
 gdp_merchant_unity_contract.1022.c: "Cela aurait pu mieux se passer..."
 gdp_merchant_unity_contract.1022.d: "Hmm... Il est temps de partir."
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$ : la dénégation"
 gdp_merchant_unity_contract.1023.desc: "Les plaignants sont stupéfaits, comme en témoignent leurs chuchotements furieux. [local_ruler.Custom('FR_le_Char_L')|U][local_ruler.GetTitleAsName|l] ne sait manifestement pas comment réagir.\n\nLa surprise de [trader.GetFirstName] se transforme en fierté enhardie tandis que je poursuis : « Je ne laisserai pas la réputation de ma compagnie être entachée par de telles futilités. »\n\nJe continue d’un ton hautain : « Vous m’avez fait perdre mon temps ici, alors que j’ai des affaires urgentes à régler à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ! »"
 gdp_merchant_unity_contract.1023.a: "C’est le moment de partir."
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$ : [trader.Custom('FR_LeLa')] bouc émissaire"
 gdp_merchant_unity_contract.1024.desc: "Les plaignants éclatent en cris de joie lorsque [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName], quelque peu surpris[local_ruler.Custom('FR_E')], appelle la garde de la ville pour mettre aux fers [trader.GetFirstName], abasourdi[trader.Custom('FR_E')] et sans voix.\n\n« M-mais, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ! » s’exclame m[trader.Custom('FR_OnA')] $game_concept_trader|l$[trader.Custom('FR_E')] d’une voix rauque. Je lui fais signe de s’éloigner : « [trader.Custom('FR_IlElle')|U] l’a bien mérité, c’était de toute façon un[trader.Custom('FR_E')] $game_concept_trader|l$[trader.Custom('FR_E')] minable... »"
 gdp_merchant_unity_contract.1024.a: "Un sacrifice nécessaire."
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$ : une perspicacité impressionnante"
 gdp_merchant_unity_contract.1031.desc: "« [ROOT.Char.GetTitledFirstNameNoTooltip] ? »\n\nJe quitte mes grands livres des yeux et fait face à... un[hopeful.Custom('FR_E')] [hopeful.GetWomanMan] de culture [hopeful.GetCulture.GetName] qui me rappelle quelqu’un. Où l’ai-je rencontré[hopeful.Custom('FR_E')] ?\n\n« Je suis [hopeful.Custom('FR_le_Char_Pi')][hopeful.GetTitledFirstName], [ROOT.Char.Custom('MistressMaster')]. Vous êtes venu[ROOT.Char.Custom('FR_E')] dans ma ville natale, [destination_1.GetBaseNameNoTier], il y a quelques années, pour résoudre un malentendu. J’ai trouvé que vous l’aviez fait avec aplomb et dignité. »\n\n« Malgré tout, mes affaires ont plongé il y a quelque temps, et je cherche un nouveau travail. Je me disais que vous en auriez peut-être à me proposer... »"
 gdp_merchant_unity_contract.1031.a: "Eh bien, soyez [Select_CString(hopeful.IsFemale,'la bienvenue','le bienvenu')] !"
 gdp_merchant_unity_contract.1031.b: "La compagnie n’a pas besoin de vous."
