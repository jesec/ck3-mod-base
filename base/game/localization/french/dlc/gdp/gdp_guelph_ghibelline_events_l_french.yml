l_french:
 guelphs_ghibellines_prefix: "Guelfes et gibelins :"
 gdp_guelph_ghibelline.0500.t: "Guelfes et gibelins"
 gdp_guelph_ghibelline.0500.intro.all: "Un regard suspicieux, un renâclement dédaigneux, le conflit entre [pope_scope.Custom('FR_le_Char_Pi')][pope_scope.GetTitledFirstName] et [ghibelline_leader.Custom('FR_le_Char_Pi')][ghibelline_leader.GetTitledFirstName] a créé une rupture grandissante entre les communautés autrefois soudées de l'Italie du Nord.\n\nCeux qui soutiennent les gibelins [ghibelline_leader.Custom('FR_du_Char_L')][ghibelline_leader.GetTitleAsNameNoTooltip] avec leur impérialisme et leur protection s'opposent à ceux qui veulent plus d'indépendance en soutenant les guelfes de la papauté."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "Un regard suspicieux, un renâclement dédaigneux, ce conflit absurde entre [ghibelline_leader.Custom('FR_le_Char_L')][ghibelline_leader.GetTitleAsName|l] apostat[ghibelline_leader.Custom('FR_E')] et mes pieux employés a malheureusement créé une rupture grandissante entre les communautés autrefois soudées de l'Italie du Nord.\n\nCeux qui soutiennent les gibelins impérialistes pour gagner en sécurité et protection s'opposent à mes guelfes pieux, qui ne font que soutenir leur souveraineté face à un tyran.\n\nEnsemble, nous ferons entendre raison [ghibelline_leader.Custom('FR_au_Char_L')][ghibelline_leader.GetTitleAsNameNoTooltip|l]. Il est temps pour moi de faire montre [ROOT.Char.Custom('GetHighestSkillAdjective')]."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "Un regard suspicieux, un renâclement dédaigneux, ce conflit absurde entre ces idiots de la papauté et moi aurait soi-disant créé une rupture grandissante entre les communautés autrefois soudées de l'Italie du Nord.\n\nCeux qui soutiennent #EMP mes#! gibelins pour leur sécurité et protection s'opposent à ceux qui soutiennent les naïfs guelfes de la papauté qui cherchent plus d'insécurité et une indépendance fragile.\n\nEn tant que [ghibelline_leader.GetTitleAsNameNoTooltip|l], je me méfie de ces fouineurs ecclésiastiques. Ils sapent mon autorité depuis bien trop longtemps et vont rentrer dans les rangs, d'une façon ou d'une autre..."
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nSoyons bénis, notre [Select_CString(guelph_leader.IsFemale,'cheffe dévouée','chef dévoué')], [guelph_leader.GetFirstNameNoTooltip], sera notre porte-parole et mènera le combat contre notre oppresseur impérialiste. Et j'y apporterai ma contribution."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nJe considère que notre [ghibelline_leader.GetTitleAsName|l] est [Select_CString(ghibelline_leader.IsFemale,'la seule','le seul')] à véritablement défendre notre peuple et nos terres contre ceux qui nous veulent du mal. Je me dois donc de soutenir ses gibelins jusqu'au bout."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nComme je n’ai encore déclaré ma loyauté à personne, je devrais évaluer soigneusement les parties en conflit afin d’agir dans le meilleur intérêt de la Maison [ROOT.Char.GetHouse.GetBaseName]."
 gdp_guelph_ghibelline.0500.a: "En route !"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "J’ai appris que vous aviez inlassablement œuvré pour asseoir la position dominante des [ROOT.Char.Custom('GetGuelphsGhibellines')|l] dans ce conflit éprouvant.\n\nC’est pourquoi je vous suis infiniment reconnaissant[gg_leader.Custom('FR_E')]."
 gdp_guelph_ghibelline.1000.a: "Avec plaisir."
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "Je ne rejoindrai pas de sitôt les irresponsables [actor.Custom('GetGuelphsGhibellines')|l]."
 gdp_guelph_ghibelline.5000.a: "C’est extrêmement imprudent."
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.Custom('FR_le_Char_U_Pi')|U][actor.GetShortUIName|U] ne pourra pas demander que [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] rejoigne les [actor.Custom('GetGuelphsGhibellines')|l] pendant plusieurs années"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ le Concordat de Worms"
 gdp_guelph_ghibelline.6500.desc: "Ce conflit a assez duré. Après avoir longuement réfléchi, mes scribes me présentent un accord écrit :\n\nL’influence [ghibelline_leader.Custom('FR_du_Char_L')][ghibelline_leader.GetTitleAsName|l] sera limitée en matière de nominations ecclésiastiques, mais on lui donne le droit en contrepartie de surveiller les élections et de trancher en cas de résultats contestés.\n\nJe me gratte le menton en réfléchissant à la manière dont cela va nous concerner tous."
 gdp_guelph_ghibelline.6500.a: "C’est la voie à suivre."
 gdp_guelph_ghibelline.6500.b: "Le pouvoir du pontificat est absolu !"
 concordat_of_worms_fulfilled.t: "Concordat de Worms respecté"
 concordat_of_worms_abandoned.t: "Concordat de Worms abandonné"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.Custom('FR_le_Char_U_Pi')|U][GetTitleByKey('e_hre').GetHolder.GetShortUIName] décide d’accepter ou refuser l’accord."
 cow_phase_moves_to_agitation.tt: "La situation [GetSituation('guelph_ghibelline').GetName] sort de Prélude et passe à [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]"
 cow_phase_moves_to_repose.tt: "La situation [GetSituation('guelph_ghibelline').GetName] sort de Prélude et passe à [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName]"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "Mettons de côté nos différends l’espace d’un instant et mettons-nous d’accord sur la manière appropriée de gérer vos nominations ecclésiastiques.\n\nEn contrepartie, [ROOT.Char.Custom('FR_le_Char_L')][ROOT.Char.GetTitleAsNameNoTooltip|l] sera autorisé[ROOT.Char.Custom('FR_E')] à assister aux élections et à trancher en cas de résultats contestés."
 gdp_guelph_ghibelline.6505.a: "Je suppose que ce sera suffisant..."
 gdp_guelph_ghibelline.6505.b: "C’est inacceptable !"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ la $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "Des rumeurs selon lesquelles [hre_kaiser.Custom('FR_le_Char_L')][hre_kaiser.GetTitleAsName|l] aurait jeté son dévolu sur le nord de l’Italie afin de centraliser et de renforcer son pouvoir dans la région circulent. Mes messagers sont de retour :"
 gdp_guelph_ghibelline.7000.desc.all: "\n\nToutes les personnes interrogées ont adhéré à la Ligue lombarde à ma demande.\n\nNous sommes désormais assez forts pour résister à toute manœuvre soudaine que [hre_kaiser.Custom('FR_le_Char_L')][hre_kaiser.GetTitleAsName|l] pourrait tenter !"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nPlus de la moitié des personnes interrogées ont rejoint la Ligue lombarde à ma demande.\n\nCela devrait nous permettre de tenir tête [hre_kaiser.Custom('FR_au_Char_L')][hre_kaiser.GetTitleAsName|l] et, espérons-le, de bénéficier d’une aide supplémentaire de la part de nos amis religieux..."
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nRares sont les personnes interrogées qui ont adhéré à la Ligue lombarde ; cela m’inquiète sans aucun doute.\n\n#EMP Mais qu’importe !#! Avec un peu d’aide divine, nous devrions être en mesure de défendre notre indépendance nouvellement acquise."
 gdp_guelph_ghibelline.7000.a: "Il est temps que les choses changent !"
 gdp_guelph_ghibelline.7000.b: "Le moment est venu !"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ rejoindre la $lombard_league_name$ ?"
 gdp_guelph_ghibelline.7005.desc: "Il semblerait que [league_creator.Custom('FR_le_Char_Pi')][league_creator.GetTitledFirstName] soit finalement une personne honorable.\n\nJ’ai appris qu’[league_creator.Custom('FR_IlElle')] avait fondé la [lombard_league_conf.GetName], une initiative visant à contrer les avancées [hre_kaiser.Custom('FR_du_Char_L')][hre_kaiser.GetTitleAsName|l].\n\nCela semble être une mesure judicieuse pour ceux qui cherchent à échapper au joug de l’Empire..."
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "Ne nous précipitons pas..."
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ la $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "Mes messagers m’informent que c[league_creator.Custom('FR_EEtte')] [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] [ROOT.Char.Custom2( 'InsultAdjective', SCOPE.sC('league_creator' ))] de [league_creator.GetTitledFirstName] n’est pas satisfait[league_creator.Custom('FR_E')] de la façon dont les choses se passent en [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier] et que [Select_CString(league_creator.IsFemale,'cette traîtresse','ce traître')] a convaincu d’autres moutons stupides de se rallier à [league_creator.Custom('FR_LuiElle')] !\n\nMais à quoi sert donc cette Ligue des Lombards ?!"
 gdp_guelph_ghibelline.7010.a: "Leur insolence ne doit pas rester impunie !"
 gdp_guelph_ghibelline.7010.b: "Je me suis tourné[ROOT.Char.Custom('FR_E')] vers d’autres objectifs."
 league_creator_created_lombard_league.tt: "[league_creator.Custom('FR_le_Char_U_Pi')|U][league_creator.GetShortUIName] a créé la [league_creator.GetConfederation.GetName] #weak (#V [lombard_league_conf.GetMemberCount]#! membres actuellement)#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "Je crains que la Ligue lombarde ne doive se passer de vos généreuses contributions."
 gdp_guelph_ghibelline.7015.a: "Hmmm."
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ compromis trouvé"
 gdp_guelph_ghibelline.8500.desc: "Un murmure se fait entendre parmi les spectateurs alors que deux représentants des guelfes et des gibelins, respectivement [guelph_leader.Custom('FR_le_Char_Pi')][guelph_leader.GetTitledFirstName] et [ghibelline_leader.Custom('FR_le_Char_Pi')][ghibelline_leader.GetTitledFirstName], se rencontrent pour signer le traité.\n\nCertains se réjouissent, d’autres sont nettement plus agités à l’idée de parvenir à un compromis, contraints de renoncer à leurs convictions profondes quant à ce qui est juste.\n\nPlus tard, des conversations à voix basse s’engagent tandis que la foule se disperse et s’attelle aux préparatifs habituels du dîner."
 gdp_guelph_ghibelline.8500.a: "C’est enfin fini."
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "Je constate que vous n’avez toujours pas pris conscience de votre erreur. Pourquoi devrions-nous faire des concessions aussi importantes alors que vous, les [actor.Custom('GetGuelphsGhibellines')|l], êtes manifestement dans votre tort ?\n\nCela m’amuserait si ce n’était pas aussi grave."
 gdp_guelph_ghibelline.8510.a: "Quelle impudence !"
 gdp_guelph_ghibelline.8510.tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName|U] a décliné votre proposition de mettre fin à la [situation|El] [GetSituation('guelph_ghibelline').GetName]"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "Cet accord est une véritable prouesse diplomatique.\n\n[guelph_leader.Custom('FR_le_Char_Pi')|U][guelph_leader.GetTitledFirstName] et [ghibelline_leader.Custom('FR_le_Char_Pi')][ghibelline_leader.GetTitledFirstName] ont tous deux fait des concessions, remporté de petites victoires, mais perdu en popularité.\n\nConclure un accord qui résiste à l’épreuve du temps n’est pas une mince affaire ; et nous devrions nous demander combien d’entre nous sont capables de tourner la page et de se tourner vers un avenir plus radieux."
 gdp_guelph_ghibelline.8520.a: "Je pense que c’est la meilleure solution."
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ victoire des [ROOT.Char.Custom('GetGuelphsGhibellines')|l]"
 gdp_guelph_ghibelline.9000.desc.guelph: "La décision est prise. Nous avons défendu ce qu’il y a de plus sacré : l’autorité absolue du pape pour protéger et élire à l’avenir nos guides spirituels.\n\nEt pour réduire l’influence du [GetTitleByKey('e_hre').GetName], dont les ambitions finissent par nous menacer tous.\n\nCes âmes gibelines égarées ne se doutent même pas de ce qui leur est arrivé."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "Nous avons enfin prouvé notre droit de régner sur l’Empire tel que souhaité par [ROOT.Char.GetFaith.HighGodName] : d’une main de fer et avec raison.\n\nComment un intermédiaire déchu aurait-il pu décider qui était le plus apte à gouverner les terres du [GetTitleByKey('e_hre').GetName] ?\n\nQue ces guelfes fidèles au pape s’occupent donc de nos âmes, et nous, nous nous occuperons de ce qui compte vraiment."
 gdp_guelph_ghibelline.9000.a: "Je crois que des célébrations s’imposent."
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ défaite des [ROOT.Char.Custom('GetGuelphsGhibellines')|l]"
 gdp_guelph_ghibelline.9010.desc.win: "Face à une opposition peu convaincante des [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l], nous ne cessons de gagner le soutien de la population.\n\n[victorious_leader.Custom('FR_le_Char_Pi')|U][victorious_leader.GetTitledFirstName], notre éminent[victorious_leader.Custom('FR_E')] [Select_CString(victorious_leader.IsFemale,'cheffe','chef')], ainsi que des juristes indépendants, ont déclaré que les [ROOT.Char.Custom('GetGuelphsGhibellines')|l] avaient raison, mettant ainsi un terme une fois pour toutes à cette situation qui durait depuis trop longtemps.\n\nEnfin, la raison revient dans cette partie du monde !"
 gdp_guelph_ghibelline.9010.desc.lose: "Notre soutien s’amenuise ; c’est un fait.\n\nNi le pouvoir ni l’influence des [ROOT.Char.Custom('GetGuelphsGhibellines')|l] ne s’étendent aussi loin qu’ils le devraient, et ces stupides dirigeants [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l] ont déniché des juristes indépendants surpuissants qui les soutiennent.\n\nIl est temps pour les [ROOT.Char.Custom('GetGuelphsGhibellines')|l] d’abandonner ce combat et de se concentrer sur des objectifs plus faciles à atteindre."
 gdp_guelph_ghibelline.9010.a.win: "Profitons de ce moment."
 gdp_guelph_ghibelline.9010.a.lose: "Maudits soient-ils !"
