l_french:
 gdp_merchant_activity_events.0001.t: "Un appétit insatiable"
 gdp_merchant_activity_events.0001.desc: "Alors que l’ambiance devient de plus en plus animée, j’entends les grognements des convives affamés et de plus en plus agacés. Il ne reste plus que des miettes dans les assiettes, et aucun serviteur n’est là pour les remplir.\n\n[guest.Custom('FR_le_Char_Pi')|U][guest.GetTitledFirstName], la tasse vide à la main, demande : « Que faut-il faire pour avoir un verre à ce fichu banquet ? »"
 gdp_merchant_activity_events.0001.host: "\n\nC’est peut-être l’occasion pour moi de mettre de l’ambiance ?"
 gdp_merchant_activity_events.0001.guest: "\n\nC’est peut-être l’occasion pour moi d’animer la réception organisée par notre [Select_CString(host.IsFemale,'hôtesse','hôte')], [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName] ?"
 gdp_merchant_activity_events.0001.a: "« Mettez les cuisines [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstNameNoTooltip] en marche, ne lésinez pas sur les moyens ! »"
 gdp_merchant_activity_events.0001.a.host: "« Bon, je vais m’occuper de vraiment mettre les cuisines en service ! »"
 gdp_merchant_activity_events.0001.b: "On dirait que je suis bien placé[ROOT.Char.Custom('FR_E')] pour négocier."
 gdp_merchant_activity_events.0001.c: "« Vous devriez être plus reconnaissant[guest.Custom('FR_E')], [guest.GetTitledFirstNameNoTooltip] ! »"
 gdp_merchant_activity_events.0001.d: "« Si ça ne vous plaît pas, sortez d’ici ! »"
 gdp_merchant_activity_events.0001.e: "« Prenez-en dans les entrepôts de la compagnie. »"
 gdp_merchant_activity_events.0005.t: "Une demande insolite"
 gdp_merchant_activity_events.0005.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('admirer'))], [admirer.Custom('FR_le_Char_Pi')][admirer.GetTitledFirstName], me fait signe de [admirer.Custom('FR_LeLa')] rejoindre pour participer à la conversation avec [guest.Custom('FR_le_Char_Pi')][guest.GetTitledFirstName].\n\n[admirer.GetFirstNameNoTooltip] sourit"
 gdp_merchant_activity_events.0005.desc_esteemed: "chaleureusement"
 gdp_merchant_activity_events.0005.desc_fallback: "joyeusement"
 gdp_merchant_activity_events.0005.desc_outro: "et nous dit d’un regard : « Je viens justement de parler avec m[admirer.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('guest'))] de l’objet [luxury_artifact.Custom('GetLuxuryArtifactSentiment')] que vous avez découvert à l’étranger. Allez, racontez-nous comment vous avez réussi à vous procurer votre [luxury_artifact.GetName] ! »\n\nJe comprends bien que [host.Custom('FR_LeLa')] noble [Select_CString(host.IsFemale,'hôtesse','hôte')] souhaite que je fasse des blagues pour les divertir."
 gdp_merchant_activity_events.0005.a: "« Il n’y avait rien d’exceptionnel... »"
 gdp_merchant_activity_events.0005.b: "« J’ai risqué ma vie pour obtenir cet objet ! »"
 gdp_merchant_activity_events.0005.b.success: "Vos embellissements semblent authentiques"
 gdp_merchant_activity_events.0005.b.failure: "On vous surprend en train de mentir"
 gdp_merchant_activity_events.0005.c: "« Écoutez-moi bien, et ouvrez grand vos oreilles ! »"
 gdp_merchant_activity_events.0005.d: "« Ce n’est rien comparé aux objets de luxe que je vends à [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]. »"
 gdp_merchant_activity_events.0010.t: "Le plaisir de donner"
 gdp_merchant_activity_events.0010.desc: "Dès que [merchant.Custom('FR_le_Char_Pi')][merchant.GetTitledFirstName], un[merchant.Custom('FR_E')] autre marchand[merchant.Custom('FR_E')], est arrivé[merchant.Custom('FR_E')], [merchant.Custom('FR_IlElle')] s’est mis[merchant.Custom('FR_E')] à étaler sa richesse en caressant ses bijoux coûteux, en exhibant ses vêtements en [merchant.Custom('RegionalFabric')] raffinés et en vantant sans vergogne [good.Custom('GetTradeGood')] qu’[merchant.Custom('FR_IlElle')] vend par [good.Custom('GetTradeGoodUnitPlural')] en [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip].\n\nJe [merchant.Custom('FR_LeLa')] vois offrir un cadeau à m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', receiver)], [receiver.Custom('FR_le_Char_Pi')][receiver.GetTitledFirstName], devant une foule de spectateurs impressionnés."
 gdp_merchant_activity_events.0010.a: "Nous pouvons être deux à jouer à ce jeu..."
 gdp_merchant_activity_events.0010.b: "« Quel cadeau attentionné, [merchant.GetTitledFirstNameNoTooltip] ! »"
 gdp_merchant_activity_events.0010.b.success: "Vous présentez [merchant.GetFirstNameNoTooltip]"
 gdp_merchant_activity_events.0010.b.failure: "Vous avez l’air bête"
 gdp_merchant_activity_events.0010.c: "Peu importe."
 gdp_merchant_activity_events.0010.d: "« Il n’est pas de bon ton de se vanter devant ses supérieurs. »"
 gdp_merchant_activity_events.0015.t: "Le sort des paysans"
 gdp_merchant_activity_events.0015.desc: "Ce festin, accompagné de bonnes boissons et d’une abondance de nourriture, dans la chaleur agréable d’un foyer, contraste fortement avec la fraîcheur de la nuit à l’extérieur.\n\nJe m’éloigne un peu pour prendre l’air, quand j’aperçois une foule de démunis : quelques roturiers attendent près des murs, dans l’espoir de récupérer quelques miettes de pain du festin dès qu’il sera terminé."
 gdp_merchant_activity_events.0015.a: "Qu’ils mangent et s’amusent, c’est moi qui paie !"
 gdp_merchant_activity_events.0015.b: "Je préférerais prendre un verre [ROOT.Char.Custom('RegionalDrink')] avec les nobles."
 gdp_merchant_activity_events.0015.b.alcohol: "Je préférerais prendre un verre [ROOT.Char.Custom('RegionalAlcoholicDrink')] avec les nobles."
 gdp_merchant_activity_events.0015.c: "C’est vraiment ici que je suis à ma place."
 gdp_merchant_activity_events.0015.d: "Fichez le camp, bande de vauriens !"
 custom.every_attending_noble: "Chaque [character|El] [noble|El] présent"
 gdp_merchant_activity_events.0020.t: "Tout est affaire de regard"
 gdp_merchant_activity_events.0020.desc: "J’apprends que m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('other'))] [other.Custom('FR_le_Char_Pi')][other.GetTitledFirstName] porte présentement le plus bel objet qui soit : [fake_artifact.GetNameNoTooltip].\n\nJe l’aperçois dans la grande salle. [other.Custom('FR_IlElle')|U] resplendit dans sa parure, la chaîne reposant sur sa poitrine. [other.Custom('FR_IlElle')|U] [other.Custom('quirk_pos_present')] alors que j’approche et me dit : « Avez-vous vu ma dernière acquisition ? Quel trésor, ne trouvez-vous pas ? »\n\nLa lumière chaude des nombreuses bougies met le bijou très en valeur, mais mon œil exercé ne peut s’empêcher de remarquer ses nombreux défauts."
 gdp_merchant_activity_events.0020.a: "« [other.GetFirstNameNoTooltip] pense que cette babiole a de la valeur. C’est hilarant ! »"
 gdp_merchant_activity_events.0020.b: "#weak *chuchote*#! « Permettez-moi de vous débarrasser de cet objet sans valeur. »"
 gdp_merchant_activity_events.0020.b.tt: "Vous obtenez un [artifact|El] avec un gain d’[opinion|El] en [attraction|El]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "A acquis [fake_artifact.GetName] [other.Custom('FR_du_Char_Pi')][other.GetTitledFirstName]."
 gdp_merchant_activity_events.0020.c: "« Un objet des plus précieux, en effet. »"
 fake_artifact_name: "Collier de pierres précieuses"
 fake_artifact_desc: "Un joli collier qui scintille à merveille, mais quand on y regarde de plus près, on constate que les pierres précieuses ont été taillées sans grand soin."
 gdp_merchant_activity_events.0025.t: "Une route très fréquentée"
 gdp_merchant_activity_events.0025.desc: "Au milieu des rires et des voix qui résonnent dans la salle, j’entends un bruit inattendu :"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP Ouh ! Ouh !#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP Kii ! Kii !#!"
 gdp_merchant_activity_events.0025.desc_cont: "Quelqu’un a amené un [luxury_artifact.Custom('GetDomicileArtifactCreatureType')] au banquet ?\n\nEn balayant la foule du regard, j’aperçois [merchant.Custom('FR_LeLa')] propriétaire, [Select_CString(merchant.IsFemale,'une marchande','un marchand')], [merchant.Custom('FR_le_Char_Pi')][merchant.GetTitledFirstName]. [merchant.Custom('FR_IlElle')|U] remarque mon regard interloqué, [merchant.Custom('quirk_pos_present')] et dit : « J’ai acquis ce magnifique animal au cours d’un de mes nombreux voyages. Il y a là-bas un marché merveilleux où je me rends souvent. C’est un secret d’entreprise. » [merchant.Custom('FR_IlElle')|U] se tapote le nez avec un sourire satisfait."
 gdp_merchant_activity_events.0025.a: "« Oh, je connais cet endroit ! »"
 gdp_merchant_activity_events.0025.b: "« Puis-je vous convaincre de m’en révéler l’emplacement ? »"
 gdp_merchant_activity_events.0025.b.success: "Vous présentez des arguments convaincants"
 gdp_merchant_activity_events.0025.b.failure: "Vous ne parvenez pas à présenter des arguments convaincants"
 gdp_merchant_activity_events.0025.c: "« Parlez-moi davantage de vos voyages ! »"
 gdp_merchant_activity_events.0025.tt.menagerie: "Créer un [luxury_contract|El][luxury_contract_i|E] #V $menagerie_acquisition_contract$#!"
 gdp_merchant_activity_events.0025.tt.curio: "Créer un [luxury_contract|El][luxury_contract_i|E] #V $find_curio_contract$#!"
