l_french:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "Renversement du gouvernement"
 overthrow_government_outcome.1001.desc: "Le complot a atteint son paroxysme : c’est maintenant ou jamais. Des agents clés ont été postés dans les casernes de la garde de la ville, à l’Assemblée et au palais. À mon signal, ils s’empareront des leviers du pouvoir et veilleront à ce que l’ancien ordre soit renversé.\n\nDemain, l’Assemblée n’aura d’autre choix que de reconnaître mon régime et de déclarer mes adversaires ennemis de l’État."
 overthrow_government_outcome.1001.a: "Pas de sang. Pas d’exil."
 overthrow_government_outcome.1001.b: "Mes ennemis personnels."
 overthrow_government_outcome.1001.c: "Tous ceux qui s’opposent à nous doivent partir."
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "La République subsiste"
 overthrow_government_outcome.1002.desc: "Une conspiration ourdie par mes patriciens a été mise au jour, orchestrée par [Select_CString(owner.IsFemale,'une renégate','un renégat')] : [owner.GetTitledFirstName]. Heureusement, ce coup d’État s’est rapidement heurté au roc que constitue mon glorieux gouvernement !\n\nCes scélérats ont tenté de m’arrêter, mais la garde a repoussé leur attaque. L’assemblée et l’armée me restent fidèles malgré leurs vils efforts."
 overthrow_government_outcome.1002.a: "Arrêtez-les !"
 overthrow_government_outcome.1002.b: "Je m’en occuperai en temps voulu."
 overthrow_government_outcome.1002.c: "Je vais trouver en moi la force de leur pardonner."
 overthrow_government_outcome_forgive_tt: "[owner.Custom('FR_le_Char_U_Pi')|U][owner.GetShortUIName] et ses [agents|El] sont absous de leur statut de [criminal|El] et ne sont plus des ennemis de l’État"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "Coup d’État"
 overthrow_government_outcome.1003.desc: "« [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ! », s’écrie [craftsman_character.Custom('FR_le_Char_U_Pi')][craftsman_character.GetShortUINameNoTooltip] en faisant irruption par la porte : on dirait qu’[craftsman_character.Custom('FR_IlElle')] a dû courir pour échapper à la mort.\n\n« C’est un complot ! Une haute trahison ! [owner.Custom('FR_le_Char_Pi')|U][owner.GetTitledFirstName] a rallié des partisans à sa cause et veut que l’Assemblée vous déclare ennemi[ROOT.Char.Custom('FR_E')] de l’État ! Des voyous sont déjà en route ! »\n\n[craftsman_character.Custom('FR_IlElle')|U] arpente la pièce fébrilement, tel un animal en cage. « Que faire ? » demande-t-[craftsman_character.Custom('FR_IlElle')]."
 overthrow_government_outcome.1003.b.desc: "« [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ! », s’écrie [craftsman_character.Custom('FR_le_Char_U_Pi')][craftsman_character.GetShortUINameNoTooltip] en faisant irruption par la porte : on dirait qu’[craftsman_character.Custom('FR_IlElle')] a dû courir pour échapper à la mort.\n\n« C’est un complot ! Une haute trahison ! [owner.Custom('FR_le_Char_Pi')|U][owner.GetTitledFirstName] a rallié des partisans à sa cause et veut que l’Assemblée proclame un nouveau gouvernement. Tout le monde raconte que vous avez été destitué[ROOT.Char.Custom('FR_E')], mais que le nouveau gouvernement aurait gracié tous ses ennemis politiques. »\n\n[craftsman_character.Custom('FR_IlElle')|U] me lance un regard abattu. « Que faire ? » demande-t-[craftsman_character.Custom('FR_IlElle')]."
 overthrow_government_outcome.1003.a: "Je plaiderai ma cause devant [ROOT.Char.GetLiege.Custom('FR_le_Char_L')][ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|l] et l’Assemblée."
 overthrow_government_outcome.1003.b: "Je vais m’exiler."
 overthrow_government_outcome.1003.c: "Je me retire de la vie politique et devient simple marchand[ROOT.Char.Custom('FR_E')]."
 overthrow_government_outcome.1003.d: "Rien pour le moment. Ce sont les aléas de la politique."
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "Ennemi[ROOT.Char.Custom('FR_E')] de l’État"
 overthrow_government_outcome.1004.1.desc: "Vous avez été désigné[ROOT.Char.Custom('FR_E')] ennemi[ROOT.Char.Custom('FR_E')] de l’État !"
 overthrow_government_outcome.1004.2.desc: "\n\nL’avis est affiché sur toutes les places de marché et aux portes des églises. Ma vie et mes biens sont en danger."
 overthrow_government_outcome.1004.3.desc: "\n\nJe risque d’être arrêté[ROOT.Char.Custom('FR_E')] à tout moment !"
 overthrow_government_outcome.1004.councilor.desc: "\n\nCela est sans doute lié au rôle important que je joue au sein du Conseil du régime déchu."
 overthrow_government_outcome.1004.personal.desc: "\n\n[owner.Custom('FR_le_Char_Pi')|U][owner.GetTitledFirstName|U] me considère comme son ennemi[ROOT.Char.Custom('FR_E')] juré[ROOT.Char.Custom('FR_E')], ce qui explique la situation."
 overthrow_government_outcome.1004.political.desc: "\n\nSans doute parce que je suis un[ROOT.Char.Custom('FR_E')] patricie[ROOT.Char.Custom('FR_NNne')] influent[ROOT.Char.Custom('FR_E')] qui s'oppose fermement projet de [owner.GetHouse.GetHouseAspiration.GetName] du nouveau régime."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nSans doute parce que j'ai participé activement à la conspiration qui a permis de renverser le gouvernement."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "Les dés sont jetés"
 overthrow_government_outcome.1005.desc: "Une attente tendue flotte dans l’air lorsque [speaker.Custom('FR_le_Char_Pi')][speaker.GetTitledFirstName] s’avance et prend la parole devant l’Assemblée.\n\n« Patriciens ! Vive la Patrie et notre République. J’ai le regret de vous annoncer que notre [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|l], [target.GetFirstNameNoTooltip], a été destitué[target.Custom('FR_E')], pour corruption et haute trahison envers la République... »\n\nUne vague de cris et de murmures parcourt la salle, mais certains patriciens influents se lèvent et applaudissent.\n\n« En vertu d’un décret d’urgence, [Select_CString(owner.IsFemale,'la citoyenne','le citoyen')] [owner.GetFirstNameNoTooltip] a pris la relève pour remettre l’État sur la bonne voie en devenant notre [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|l]. »\n\nLes applaudissements s’amplifient tandis que de plus en plus de patriciens se lèvent."
 overthrow_government_outcome.1005.a: "Vive la République !"
 overthrow_government_outcome.1005.b: "Hou ! Tyran ! Trahison !"
 government_overthrow_enemies.1001.b.custom: "Les patriciens suivants deviennent des [criminals|El] :\n$EFFECT_LIST_BULLET$Le [liege|El] renversé et les [councillors|El]\n$EFFECT_LIST_BULLET$Vos [rivals|El] et [nemesis|El]\n$EFFECT_LIST_BULLET$Personnages avec #N -60#! ou moins d’[opinion|El] à votre égard\n$EFFECT_LIST_BULLET$[house_heads|E] ayant une [house_relation|El] de [rivalry|El]\n$EFFECT_LIST_BULLET$Ils pourraient demander la clémence à l’[assembly|El] ou partir en exil\n$EFFECT_LIST_BULLET$Les [friends|El], [lovers|El], [soulmates|El] et [blood_brothers|El] sont exclus"
 government_overthrow_enemies.1001.c.custom: "Les patriciens suivants deviennent des [criminals|El] :\n$EFFECT_LIST_BULLET$Tout [powerful_vassal|El] ayant une autre [house_ambition|El]\n$EFFECT_LIST_BULLET$Le [liege|El] renversé et les [councillors|El]\n$EFFECT_LIST_BULLET$Vos [rivals|El] et [nemesis|El]\n$EFFECT_LIST_BULLET$Personnages avec #N -60#! ou moins d’[opinion|El] à votre égard\n$EFFECT_LIST_BULLET$[house_heads|E] ayant une [house_relation|El] de [rivalry|El]\n$EFFECT_LIST_BULLET$Les ennemis personnels de vos [agents|El]\n$EFFECT_LIST_BULLET$Ils pourraient demander la clémence à l’[assembly|El] ou partir en exil"
 government_overthrow_populace.1001.a.custom: "Chaque [county|El] de votre [realm|El]"
 government_overthrow_populace.1001.a.description: "Vous accordez une amnistie générale aux opposants du nouveau régime."
 government_overthrow_forgiven.tt: "Vous êtes absous de vos crimes contre l’État"
 overthrow_government_outcome.tt.success.desc: "Vous défendez avec éloquence vos actes"
 overthrow_government_outcome.tt.success.toast: "Vous prouvez que vos actes ne découlaient que de votre amour pour la République"
 overthrow_government_outcome.tt.failure.desc: "Votre discours tombe dans l’oreille d’un sourd"
 overthrow_government_outcome.tt.failure.toast: "Vous êtes hué[GetPlayer.Custom('FR_E')] et expulsé[GetPlayer.Custom('FR_E')] de l’Assemblée"
 overthrow_government_become_merchant.tt: "[ROOT.Char.Custom('FR_le_Char_U_Pi')|U][ROOT.Char.GetShortUINameNoTooltip] [Select_CString(ROOT.Char.IsLocalPlayer,'êtes','est')] [Select_CString(ROOT.Char.IsFemale,'devenue une simple marchande','devenu un simple marchand')]"
 overthrow_government_enemy_of_the_state.tt: "L’Assemblée vous a désigné[GetPlayer.Custom('FR_E')] ennemi[GetPlayer.Custom('FR_E')] de l’État"
 overthrow_government_amnesty.tt: "L’Assemblée a accordé une amnistie générale à tous les conspirateurs"
 overthrow_government_arrested.tt: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUINameNoTooltip] a ordonné votre arrestation pour votre rôle dans la conspiration contre l’État"
 overthrow_government_blanket_pardon.tt: "Renversement du gouvernement : amnistie"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.Custom('FR_le_Char_U_Pi')|U][the_new_dodge.GetShortUINameNoTooltip] a accordé une grâce à tous ses adversaires politiques."
