l_french:
 gdp_merchant_family.0001.t: "[Select_CString(house_member.IsFemale,'Une','Un')] [house_member.Custom('GetBrideGroom')|l] en fuite"
 gdp_merchant_family.0001.desc: "Une chute dans l’obscurité révèle m[ROOT.Char.Custom2('FR_RelationToMe_OnA', house_member)] [house_member.Custom('FR_le_Char_Pi')][house_member.GetTitledFirstName] en train de fouiller dans le coffre de la compagnie, [Select_CString(wedding_interest.IsFemale,'une femme','un homme')] à ses côtés qui lui chuchote de se dépêcher.\n\n« Que se passe-t-il ici ? » demandé-je, les interrompant ainsi au milieu de leur méfait. C’est alors que je reconnais l’autre individu comme étant [wedding_interest_house_head.Custom2('FR_RelationToMeShort_Le', wedding_interest)] [wedding_interest_house_head.Custom('FR_du_Char_Pi')][wedding_interest_house_head.GetTitledFirstName].\n\n« Nous ne resterons pas ici une minute de plus. La haine qui sévit entre nos families ne fait que nous éloigner, c’est pourquoi nous avons décidé de partir », me répond [house_member.Custom('FR_le_Char_Pi')][house_member.GetTitledFirstNameNoTooltip],"
 gdp_merchant_family.0001.desc.stubborn_outro: "le menton relevé en signe de défi, et la main serrant fermement celle [wedding_interest.Custom('FR_du_Char_Pi')][wedding_interest.GetTitledFirstNameNoTooltip]."
 gdp_merchant_family.0001.desc.fallback_outro: "en lâchant à contrecœur la main [wedding_interest.Custom('FR_du_Char_Pi')][wedding_interest.GetTitledFirstNameNoTooltip], et en tendant lentement la sienne vers moi."
 gdp_merchant_family.0001.a: "« Prenez l’or, et partez avec ma bénédiction. »"
 gdp_merchant_family.0001.b: "« Que faut-il que je fasse pour vous convaincre de rester ? »"
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName] vous rejoint"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName] n’est pas impressionné[wedding_interest.Custom('FR_E')]"
 gdp_merchant_family.0001.c: "« Vous n’irez #EMP nulle part#! ! »"
 gdp_merchant_family.0002.t: "Liens du sang"
 gdp_merchant_family.0002.desc_intro: "Je suis en train d’étudier les derniers rapports d’activité lorsque [blood.Custom2('MyCharacterIntroduction', ROOT.Char)] fait irruption.\n\n« C[water.Custom('FR_EEtte')] [water.Custom('InsultNoun')] [water.Custom('InsultAdjective')] va trop loin », s’emporte-t-[blood.Custom('FR_IlElle')]. « [water.Custom('FR_IlElle')|U] prend des risques, ignore les limites et nous fait passer, nous autres, pour des idiots. "
 gdp_merchant_family.0002.desc_adopted: "C’est inacceptable de la part d’un membre de la Maison [ROOT.Char.GetHouse.GetName]. »"
 gdp_merchant_family.0002.desc_associate: "C’est inacceptable de la part d’un[water.Custom('FR_E')] simple associé[water.Custom('FR_E')] de notre compagnie. »"
 gdp_merchant_family.0002.desc_outro: "\n\nSa diatribe enfin terminée, je me replonge dans le grand livre. Quelle que soit la vérité, [water.GetFirstNameNoTooltip] génère des bénéfices et il est difficile d’ignorer ces résultats."
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip] doit rester à sa place."
 gdp_merchant_family.0002.a.unity_gain.desc: "A privilégié les liens du sang plutôt que le mérite"
 gdp_merchant_family.0002.b: "Revenez quand vous aurez les résultats de [water.GetFirstNameNoTooltip]."
 gdp_merchant_family.0002.b.unity_loss.desc: "A privilégié le mérite plutôt que les liens du sang"
 gdp_merchant_family.0002.c: "« Je n’ai pas le temps pour ça... »"
 gdp_merchant_family.0003.t: "Ne tolère aucun déshonneur"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U], manifestement contrarié[offended.Custom('FR_E')], s’approche de moi.\n\n« Vous n’allez pas croire ce qu’on vient de me dire, commence-t-[offended.Custom('FR_IlElle')]. [offender.Custom2('MyCharacterIntroduction', ROOT.Char)] a trouvé drôle de m’insulter, et par là même d’insulter notre Maison. »\n\nL’offense est mineure, mais délibérée."
 gdp_merchant_family.0003.a: "Par [ROOT.Char.GetFaith.HighGodName], la Maison [offender.GetHouse.GetNameNoTooltip] présentera ses excuses !"
 gdp_merchant_family.0003.a.unity_gain.desc: "A présenté un front uni contre une insulte publique"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.Custom('FR_le_Char_U_Pi')|U][target_char.GetShortUIName|U] a publiquement insulté la Maison [target_char.Custom('FR_du_Char_U_Pi')][target_char.GetShortUIName]"
 gdp_merchant_family.0003.b: "[offended.GetFirstNameNoTooltip], concentrez-vous donc sur ce qu’ils ne disent pas..."
 gdp_merchant_family.0003.b.unity_loss.desc: "A refusé de riposter à une insulte"
 gdp_merchant_family.0003.c: "C’est à vous de régler ce problème. Je dois m’occuper d’autres choses."
 gdp_merchant_family.0003.c.unity_loss.desc: "A ignoré une insulte faite à notre Maison"
 gdp_merchant_family.0004.t: "Une offre prometteuse"
 gdp_merchant_family.0004.desc: "Alors que je me promène tranquillement, j’entends une voix inconnue qui m’interpelle depuis l’autre bout de la cour. « Un mot, [ROOT.Char.Custom('FormOfAddressForLiege')]. » [offer_2.Custom('FR_le_Char_P')|U][offer_2.GetFullName] se tient juste devant moi et me parle d’un ton très flatteur.\n\n« [foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U] m’envoie pour vous proposer que j’épouse [offer.Custom2('YourCharacterIntroduction', ROOT.Char)] afin de renforcer les liens entre nos deux Maisons. » Sans m’en rendre compte, je retiens mon souffle tandis que je réfléchis à cette proposition.\n\n « Alors, qu’en dites-vous, [ROOT.Char.Custom('FormOfAddressForLiege')] ? »"
 gdp_merchant_family.0004.a: "« M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('offer'))] en serait très honoré[offer.Custom('FR_E')]. »"
 gdp_merchant_family.0004.b: "« Que diriez-vous d’une affaire dont tout le monde tirerait profit ? »"
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.Custom('FR_le_Char_U_Pi')|U][target_char.GetShortUIName|U] et [target_char.Custom('FR_le_Char_U_Pi')][target_char.GetShortUIName] ont signé un accord mutuellement avantageux"
 gdp_merchant_family.0004.c: "« Je dois décliner, mais vous êtes les bienvenus si vous souhaitez rester. »"
 gdp_merchant_family.0005.t: "Une honte pour la Maison [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.0005.desc: "J’ai appris que [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)] avait égaré une livraison cruciale dont [wayward.Custom('FR_IlElle')] avait la responsabilité, ce qui porterait gravement atteinte à notre réputation si nous n’agissions pas sans délai. Je [wayward.Custom('FR_LeLa')] convoque dans mes appartements pour l’interroger.\n\n« Je suis profondément désolé[wayward.Custom('FR_E')], [ROOT.Char.Custom('FR_MonseigneurMadame')|U], mais vous ne devriez pas me tenir pour responsable de ce contretemps. Mon propre sang, ma propre Maison tente de me nuire ! »"
 gdp_merchant_family.0005.a: "« Sois maudit[wayward.Custom('FR_E')], [wayward.Custom('InsultNoun')] [wayward.Custom('InsultAdjective')] ! »"
 gdp_merchant_family.0005.a.unity_loss.desc: "A condamné publiquement un membre de la Maison"
 gdp_merchant_family.0005.b: "« Nous ne faisons qu’un, comme toujours. »"
 gdp_merchant_family.0005.b.unity_gain.desc: "A choisi d’affronter l’adversité ensemble"
 gdp_merchant_family.0005.c: "« Réglez le problème. »"
 gdp_merchant_family.0010.t: "Le point de bascule"
 gdp_merchant_family.0010.desc: "Dans un fracas, la caisse s’écrase sur le sol et l’agitation habituelle du [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l] s’arrête net. Je me retourne et aperçois mes associés, [attacker.Custom('FR_le_Char_Pi')][attacker.GetTitledFirstName] et [defender.Custom('FR_le_Char_Pi')][defender.GetTitledFirstName], qui sont sur le point d’en venir aux mains.\n\n« Je me tue à la tâche pour cette famille », s’énerve [attacker.GetFirstNameNoTooltip], les yeux emplis de rage. « C[defender.Custom('FR_EEtte')] minable se la coule douce à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Une bonne raclée va [defender.Custom('FR_LeLa')] ramener à la raison. »"
 gdp_merchant_family.0010.a: "Aucun de mes collaborateurs ne se comporte ainsi."
 gdp_merchant_family.0010.a.tt.success: "Vous jouez un rôle de [Select_CString(GetPlayer.IsFemale,'médiatrice','médiateur')] efficace dans ce conflit"
 gdp_merchant_family.0010.a.tt.failure: "Vous n’arrivez pas à jouer le rôle de [Select_CString(GetPlayer.IsFemale,'médiatrice','médiateur')] dans ce conflit"
 gdp_merchant_family.0010.b: "Montrez à tout le monde comment on règle ses comptes."
 gdp_merchant_family.0010.c: "Vous allez regretter d’avoir levé la main sur [defender.Custom('FR_le_Char_Pi')][defender.GetTitledFirstNameNoTooltip] !"
 gdp_merchant_family.0010.d: "Faites ce que vous voulez."
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.Custom('FR_le_Char_U_Pi')|U][attacker.GetShortUIName] et [defender.Custom('FR_le_Char_U_Pi')][defender.GetShortUIName] débuteront un duel à la fois en [prowess|El][prowess_i] et en [martial|El][martial_i] ! Quelqu’un sera blessé#!"
 merchant_unity_fight_stopped: "A mis fin à une querelle entre des membres de la compagnie"
 merchant_unity_fight_promoted: "A encouragé une querelle entre des membres de la compagnie"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] gagne"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U] a blessé [defender.GetFirstName]"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip] gagne"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.GetSheHe|U] a blessé [attacker.GetFirstName] en se défendant"
 gdp_merchant_family.0015.t: "[Select_CString(ROOT.Char.IsFemale,'Une conseillère','Un conseiller')] d’affaires"
 gdp_merchant_family.0015.desc: "De tous les visages familiers du [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], c’est [tip_giver.Custom('FR_le_Char_U_Pi')][tip_giver.GetShortUIName] qui attire mon attention et me tend un registre avec un sourire malicieux.\n\n« Ah, [ROOT.Char.GetTitledFirstName], je vous cherchais justement ! Permettez-moi de vous partager quelques-unes de mes réflexions. Considérez cela comme une contribution afin de poursuivre notre collaboration. »"
 gdp_merchant_family.0015.a: "« Ensemble, nous pourrions engranger de sacrés bénéfices ! »"
 gdp_merchant_family.0015.b: "« Laissez-moi vous l’acheter. »"
 gdp_merchant_family.0015.b.artifact: "Registre d’initié"
 gdp_merchant_family.0015.b.artifact.desc: "Un livre confidentiel regroupant les bénéfices du marché, les marges et les contacts utiles"
 gdp_merchant_family.0015.c: "« #EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#! en tirera profit... »"
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.Custom('FR_le_Char_U_Pi')|U][char.GetShortUIName|U] et [target_char.Custom('FR_le_Char_U_Pi')][target_char.GetShortUIName] se sont échangé un conseil pratique"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.Custom('FR_le_Char_U_Pi')|U][char.GetShortUIName|U] s’est servi du conseil [target_char.Custom('FR_du_Char_U_Pi')][target_char.GetShortUIName] contre [target_char.Custom('FR_LuiElle')]"
 gdp_merchant_family.0020.t: "Échange de talents"
 gdp_merchant_family.0020.desc: "Mon contact professionnel, [house_friend.Custom('FR_LeLa')] [house_friend.Custom('MistressMaster')] [house_friend.GetFirstName], est en retard à notre réunion habituelle. Quand [house_friend.Custom('FR_IlElle')] arrive enfin, c’est avec un[nepo_hire.Custom('FR_E')] invité[nepo_hire.Custom('FR_E')] inattendu[nepo_hire.Custom('FR_E')].\n\n« [ROOT.Char.Custom('MistressMaster')|U], je vous présente m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('nepo_hire'))] [nepo_hire.GetFirstName], "
 gdp_merchant_family.0020.desc.diplomacy: "un[nepo_hire.Custom('FR_E')] diplomate chevronné[nepo_hire.Custom('FR_E')]. "
 gdp_merchant_family.0020.desc.martial: "un[nepo_hire.Custom('FR_E')] stratège tenace. "
 gdp_merchant_family.0020.desc.stewardship: "un[nepo_hire.Custom('FR_E')] expert[nepo_hire.Custom('FR_E')] des chiffres. "
 gdp_merchant_family.0020.desc.intrigue: "[Select_CString(nepo_hire.IsFemale,'une femme','un homme')] perspicace. "
 gdp_merchant_family.0020.desc.learning: "[Select_CString(nepo_hire.IsFemale,'une femme','un homme')] érudit[nepo_hire.Custom('FR_E')]. "
 gdp_merchant_family.0020.desc.outro: "Sous votre surveillance à [ROOT.Char.GetPrimaryTitle.GetName], [nepo_hire.Custom('FR_IlElle')] s’épanouirait certainement. »"
 gdp_merchant_family.0020.a: "« [nepo_hire.GetFirstNameNoTooltip|U] est [nepo_hire.Custom('FR_LeLa')] bienvenu[nepo_hire.Custom('FR_E')] parmi nous. »"
 gdp_merchant_family.0020.a.unity_loss.desc: "A offert un poste d’associé par favoritisme"
 gdp_merchant_family.0020.b: "« Malheureusement, nous n’avons pas de poste à pourvoir. »"
 gdp_merchant_family.0020.b.unity_gain.desc: "A refusé de recruter [Select_CString(ROOT.Char.IsFemale,'une inconnue','un inconnu')]"
 gdp_merchant_family.0020.c: "« Cette proposition est une insulte. »"
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.Custom('FR_le_Char_U_Pi')|U][char.GetShortUIName|U] a accepté un parent [target_char.Custom('FR_du_Char_U_Pi')][target_char.GetShortUIName] au sein de sa compagnie"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.Custom('FR_le_Char_U_Pi')|U][char.GetShortUIName|U] a refusé un parent [target_char.Custom('FR_du_Char_U_Pi')][target_char.GetShortUIName]"
 gdp_merchant_family.0025.t: "Rien de personnel"
 gdp_merchant_family.0025.desc: "Mes poignets me font mal à force de signer d’interminables accords commerciaux. Alors que je m’apprête à partir après une soirée harassante, [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)] s’approche de moi. Fouillant nerveusement dans sa poche, [leaving_associate.Custom('FR_IlElle')] sort un petit parchemin qu’[leaving_associate.Custom('FR_IlElle')] se met à lire.\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], je suis aux regrets de vous informer que j’ai reçu une proposition de la part de [rival_poacher.GetPrimaryTitle.GetName] qu’il m’est impossible de refuser. Sachez qu’il n’y a rien de personnel là-dedans, ce sont juste les affaires. »"
 gdp_merchant_family.0025.a: "« Vous pouvez y aller avec ma bénédiction. »"
 gdp_merchant_family.0025.b: "« Votre place est ici, à nos côtés. »"
 gdp_merchant_family.0025.b.tt: "[leaving_associate.Custom('FR_le_Char_U_Pi')|U][leaving_associate.GetShortUIName|U] reste au sein de la [company|El]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip] accepte de rester"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip] part malgré tout"
 gdp_merchant_family.0025.c: "« N’oubliez pas que vous m’êtes redevable. »"
 gdp_merchant_family.0025.d: "« Très bien, partez dans ce cas. »"
 gdp_merchant_family.0025.d.rival: "« [rival_poacher.GetTitledFirstNameNoTooltip], vous allez regretter le jour où vous m’avez croisé[ROOT.Char.Custom('FR_E')] ! »"
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] a débauché un [associate|El] [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUIName]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.Custom('FR_le_Char_U_Pi')|U][char.GetShortUIName|U] a laissé de bonne foi un [associate|El] rejoindre la compagnie [target_char.Custom('FR_du_Char_U_Pi')][target_char.GetShortUIName]"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.Custom('FR_le_Char_U_Pi')|U][target_char.GetShortUIName|U] a débauché un [associate|El] de [char.GetHouse.GetName]"
 gdp_merchant_family.0030.t: "Travail ou vacances ?"
 gdp_merchant_family.0030.desc: "Après une #EMP interminable#! pause déjeuner, deux de mes associés, [house_member.Custom('FR_le_Char_Pi')][house_member.GetTitledFirstName] et [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstName], reviennent au bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] avec une cruche [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\n« ... Et là, je lui dis \"ton chat est un vrai porc !\" », s’exclame [house_member.Custom('FR_le_Char_Pi')][house_member.GetTitledFirstNameNoTooltip], ce qui fait exploser de rire [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstNameNoTooltip].\n\nSi je n’interviens pas, ces deux-là ne risquent pas de faire quoi que ce soit de la journée."
 gdp_merchant_family.0030.a: "« Je vais aller vous chercher une bouteille digne de ce breuvage. »"
 gdp_merchant_family.0030.a.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] mérite ce qui se fait de mieux"
 gdp_merchant_family.0030.b: "« Remettez-vous au travail, bande de tire-au-flanc ! »"
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ne tolère pas les fainéants"
 gdp_merchant_family.0030.c: "Voyons où nous mènera cette amitié."
 merchant_unity_breaks_encouraged: "Ne boit que les meilleurs alcools du marché"
 merchant_unity_breaks_discouraged: "A déconseillé toute pause au travail"
 gdp_merchant_family.9000.t: "Jeune [ROOT.Char.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "Je suis enfin [Select_CString(ROOT.Char.IsFemale,'une femme','un homme')] assez âgé[ROOT.Char.Custom('FR_E')] pour occuper la place de [ROOT.Char.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetPrimaryTitle.GetName|l] qui me revient de droit. C’est à moi qu’il incombe de prendre la relève de [Select_CString(predecessor.IsFemale,'ma prédécesseuse','mon prédécesseur')], [predecessor.GetFirstName].\n\nMes associés comptent sur moi pour prendre les rênes de notre entreprise, trouver de nouvelles évolutions et de nouvelles opportunités dans le monde des affaires, même s’ils me disent que je devrais m’appuyer sur leur expérience et leur savoir-faire..."
 gdp_merchant_family.9000.a: "Les conseils [educator.Custom('FR_du_Char_Pi')][educator.GetTitledFirstNameNoTooltip] seront inestimables."
 gdp_merchant_family.9000.b: "Par où commencer... ?"
 gdp_merchant_family.9000.route_hint_tt: "Vous pouvez désormais créer et modifier des [distribution_routes|El]"
 gdp_merchant_family.9010.t: "Une compagnie en deuil"
 gdp_merchant_family.9010.desc: "M[ROOT.Char.Custom2('FR_RelationToMe_OnA', previous_holder)], [previous_holder.GetFirstName], nous a quittés. [previous_holder.Custom('FR_IlElle')|U] était l’éminent[previous_holder.Custom('FR_E')] [previous_holder.Custom('MistressMaster')] de la compagnie. Dans les couloirs, les rires ne fusent plus ; dans les bureaux, les débats ont pris fin ; et partout, les visages sont tristes.\n\n"
 gdp_merchant_family.9010.interim_generated: "Tous les regards se tournent désormais vers [Select_CString(interim.IsFemale,'une femme','un homme')] du nom de [interim.GetFirstName], qui a été appelé[interim.Custom('FR_E')] pour reprendre la gestion des affaires et"
 gdp_merchant_family.9010.interim_relation: "Tous les regards se tournent désormais vers m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', interim)], [interim.GetFirstName], qui"
 gdp_merchant_family.9010.interim: "Tous les regards se tournent désormais vers [Select_CString(interim.IsFemale,'la fidèle associée','le fidèle associé')] de m[ROOT.Char.Custom2('FR_RelationToMe_OnA', previous_holder)], [interim.GetFirstName], qui"
 gdp_merchant_family.9010.close: "s’est chargé[interim.Custom('FR_E')] de tout organiser en l’absence de [previous_holder.GetFirstNameNoTooltip], et qui s’occupera de la gestion quotidienne des affaires jusqu’à ce que je sois en âge de prendre le relais."
 gdp_merchant_family.9010.a: "Les choses ont évolué tellement vite."
 gdp_merchant_family.9110.t: "Les ficelles du métier"
 gdp_merchant_family.9110.desc: "Faisant partie des marchands les plus expérimentés de la compagnie, m[ROOT.Char.Custom2('FR_RelationToMe_OnA', trader)], [trader.GetFirstName], se trouve rarement dans les bureaux.\n\n[trader.Custom('FR_IlElle')|U] gère la [route.GetName|l], veillant à ce que les [good.Custom('GetTradeGoodUnitPlural')] transitent correctement du vendeur à l’acheteur, remplissant nos caisses par la même occasion.\n\n« Un bon marchand doit être partout à la fois », sourit-[trader.Custom('FR_IlElle')]. « Il doit connaître les visages de tous les étals du [ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')], ainsi que leurs soucis... et ceux des gardes de la ville et de la caravane ! »"
 gdp_merchant_family.9110.a: "Quand je serai aux commandes, je serai comme [trader.GetNameNoTooltip]."
 gdp_merchant_family.9110.b: "« Parlez-moi des caravanes ! »"
 gdp_merchant_family.9110.b.tt: "Au passage à l’âge adulte, vous gagnerez #V 10#! points d’[Concept('trait_level_track_xp', 'expérience')|E] de #emp $trait_track_caravaneer|l$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#!"
 gdp_merchant_family.9110.c: "« Moi aussi, je veux apprendre à faire du commerce dans [good.Custom('GetTradeGood')] ! »"
 gdp_merchant_family.9110.c.tt: "Au passage à l’âge adulte, [merchant.GetPrimaryTitle.GetName] recevra #V 450#! points d’[trade_expertise|El] en [category.GetNameWithIcon]"
 gdp_merchant_family.9130.t: "Les ambitions de la jeunesse"
 gdp_merchant_family.9130.desc: "J’apprends énormément en observant les activités quotidiennes de la compagnie, et mes associés font tout leur possible pour m’impliquer afin de favoriser mon intégration."
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetName] fait du commerce partout, et ses registres sont truffés de noms de lieux que j’arrive à peine à prononcer, bien loin de [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]. Le reste appartient à mon imagination."
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetName] est connu pour fournir des produits rares et de qualité, et pour faire la promotion des artisans de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetName] a la réputation d’échanger de l’argent contre des faveurs, et ses registres sont truffés de noms de malchanceux et de parieurs de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetName] est bien établi, mais n’est pas réputé pour une quelconque particularité. Ce n’est qu’une compagnie commerciale parmi tant d’autres à [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant_family.9130.a: "J’ai vraiment hâte d’être aux commandes."
 gdp_merchant_family.9130.a.caravaneer: "Et nous irons encore plus loin."
 gdp_merchant_family.9130.a.artisan: "Notre nom est un label de qualité."
 gdp_merchant_family.9130.a.creditor: "Le crédit est notre affaire."
 gdp_merchant_family.9130.a.tt: "Au passage à l’âge adulte, vous gagnerez #V 5#! points d’[Concept('trait_level_track_xp', 'expérience')|E] de #emp $trait_track_caravaneer|l$#!, #emp $trait_track_artisan|l$#!, et #emp $trait_track_creditor|l$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#!"
 gdp_merchant_family.9130.b: "Le monde extérieur représente un immense potentiel."
 gdp_merchant_family.9130.b.tt: "Au passage à l’âge adulte, vous adopterez l’[company_purpose|El] [GetLaw('company_purpose_caravaneer').GetName] #P sans frais#!, et vous gagnerez #V 20#! points d’[Concept('trait_level_track_xp', 'expérience')|E] de #emp $trait_track_caravaneer|l$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#!"
 gdp_merchant_family.9130.c: "On dépense beaucoup en jolis bibelots."
 gdp_merchant_family.9130.c.tt: "Au passage à l’âge adulte, vous adopterez l’[company_purpose|El] [GetLaw('company_purpose_artisan').GetName] #P sans frais#!, et vous gagnerez #V 20#! points d’[Concept('trait_level_track_xp', 'expérience')|E] d’#emp $trait_track_artisan|l$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#!"
 gdp_merchant_family.9130.d: "Le pouvoir et la richesse résident dans l’effet de levier."
 gdp_merchant_family.9130.d.tt: "Au passage à l’âge adulte, vous adopterez l’[company_purpose|El] [GetLaw('company_purpose_creditor').GetName] #P sans frais#!, et vous gagnerez #V 20#! points d’[Concept('trait_level_track_xp', 'expérience')|E] de #emp $trait_track_creditor|l$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#!"
 company_purpose_child_blocker_tt: "Vous êtes un [child|El]"
 gdp_merchant_family.9140.t: "Étude de marché"
 gdp_merchant_family.9140.desc: "Dans les bureaux exigus de [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly], on m’enseigne les routes commerciales où [ROOT.Char.GetPrimaryTitle.GetName] essaie de faire fortune. Il y a énormément de lieux et de marchandises à retenir.\n\nJe sors brusquement de ma rêverie quand [associate.GetFirstName] se met à taper sur la table avec sa [ROOT.Char.Custom('WritingInstrument')]. « On se réveille ! Tu vas finir [ROOT.Char.GetTitleAsNameNoTooltip|l] si tu n’écoutes pas ! »"
 gdp_merchant_family.9140.a: "« [category_1.Custom('GetTradeGoodCategory')]... Parlez-moi de ce commerce. »"
 gdp_merchant_family.9140.a.tt: "Au passage à l’âge adulte, [merchant.GetPrimaryTitle.GetName] recevra #V 450#! points d’[trade_expertise|El] en [category_1.GetNameWithIcon]"
 gdp_merchant_family.9140.b: "« Un commerce me fascine tout particulièrement : [category_2.Custom('GetTradeGoodCategory')]. »"
 gdp_merchant_family.9140.b.tt: "Au passage à l’âge adulte, [merchant.GetPrimaryTitle.GetName] recevra #V 450#! points d’[trade_expertise|El] en [category_2.GetNameWithIcon]"
 gdp_merchant_family.9140.c: "« Je veux en savoir plus sur [category_3.Custom('GetTradeGoodCategory')]. »"
 gdp_merchant_family.9140.c.tt: "Au passage à l’âge adulte, [merchant.GetPrimaryTitle.GetName] recevra #V 450#! points d’[trade_expertise|El] en [category_3.GetNameWithIcon]"
 gdp_merchant_family.9150.t: "Bras droit"
 gdp_merchant_family.9150.desc: "En attendant mon passage à l’âge adulte, je passe la majeure partie de mon temps aux côtés de [partner.GetFirstName], partenaire de la compagnie. Je l’observe dans ses négociations et ses réunions, tout en essayant d’apprendre le plus possible.\n\nUn jour, après avoir travaillé d’arrache-pied sur les registres, [partner.Custom('FR_IlElle')] se tourne vers moi en souriant et, me lançant une pièce, me dit : « Tu t’en sors bien, jeune [ROOT.Char.GetTitleAsNameNoTooltip|l]. Les affaires ne sont pas toujours faciles, mais contrairement [ROOT.Char.GetSuzerain.Custom('FR_au_Char_L')][ROOT.Char.GetSuzerain.GetTitleAsName|l], notre dur labeur nous permet de tenir bon. »"
 gdp_merchant_family.9150.a: "« Je ne vous laisserai pas tomber, ni vous ni la compagnie. »"
 gdp_merchant_family.9150.b: "« Vous avez travaillé dur pour y arriver, [partner.GetFirstNameNoTooltip]. »"
 gdp_merchant_family.9150.b.tt: "Pendant les #V 10#! prochaines années, la [aptitude|El] du [GetCourtPositionType( 'partner_court_position' ).GetName()|l] [partner.Custom('FR_du_Char_U_Pi')][partner.GetShortUIName] : #p +1#!"
 gdp_merchant_family.9150.c: "« Et pourtant, sans [ROOT.Char.GetSuzerain.Custom('FR_le_Char_L')][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l], où serait-on aujourd’hui ? »"
 gdp_merchant_family.9150.c.tt: "Au passage à l’âge adulte, vous gagnerez le [modifier|El] [GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip] pendant #V 10#! ans"
 merchant_childhood_suzerain_modifier: "Chouchou"
 merchant_childhood_suzerain_modifier_desc: "Ce personnage comprend l’importance d’entretenir de bonnes relations avec ceux qui tirent les ficelles."
 merchant_childhood_desc: "Enfance dans le commerce"
