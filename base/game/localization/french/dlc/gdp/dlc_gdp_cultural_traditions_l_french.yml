l_french:
 tradition_fortune_seekers_name: "Chercheurs de fortune"
 tradition_fortune_seekers_desc: "Pour les gens de cette culture, il n’y a pas de honte à quitter sa maison les poches vides, et ils attendent de ceux qui n’hériteront de presque rien qu’ils partent à l’étranger pour tenter d’y faire fortune. Là-bas, ces derniers découvrent mille et une façons de vivre différentes, comprenant l’importance de chaque objet et les conditions de chaque prêt."
 culture_parameter_fortune_seekers_merchant_propensity: "Les [characters|El] de cette [culture|El] sont plus susceptibles de devenir [merchants|El]"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "Déverrouille le [domicile_building|El] #V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName]#!"
 tradition_saharan_traders_name: "Marchands sahariens"
 tradition_saharan_traders_desc: "Il est bien connu que le désert du Sahara, qui relie le Sahel et l’intérieur de l’Afrique de l’Ouest à la mer Méditerranée, ne constitue pas tant une barrière qu’une voie utilisée pour le commerce. Cette culture s’est investie entièrement dans ces échanges, de nombreux individus passant toute leur vie dans des caravanes."
 culture_parameter_oasis_villages_building_slot: "Les [districts|El] #V [GetDistrictType('villages_district').GetName]#!, #V [GetDistrictType('religious_community_district').GetName]#! et  #V [GetDistrictType('manor_houses_district').GetName]#! ont #P +1#! emplacement de [building|El] dans les [GetTerrain( 'oasis' ).GetName|l]"
 culture_parameter_saharan_seasoned_traveler_route_length: "Chaque niveau du parcours #V $trait_track_danger$#! du [trait|El] [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] offre #P +1#! de [trade_route_length|El]"
 culture_parameter_saharan_merchant_domicile_buildings: "Déverrouille les [domicile_buildings|El] #V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#! et #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#!"
 culture_parameter_caravan_escort_compound_domicile_building: "Déverrouille le [domicile_building|El] #V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName]#!"
 tradition_silk_road_traders_name: "Entrepreneurs de la Route de la Soie"
 tradition_silk_road_traders_desc: "Sur la Route de la Soie, des marchandises circulent sans interruption entre l’Est et l’Ouest. Soie, thé, objets laqués, jade et de nombreux autres biens sont transportés de station en station pendant le long trajet. Cette activité a eu une influence sur les sociétés qui jouxtent la route. Des villes riches se livrent directement au commerce à longue distance ou vendent leurs produits à ceux qui s’y adonnent."
 tradition_monsoon_traders_name: "Marchands de la mousson"
 tradition_monsoon_traders_desc: "Des nakhudas de l’ouest aux guildes commerciales et castes à l’est, les marchands de l’océan Indien approvisionnent les marchés en poivre, étoffes de coton et marchandises précieuses, génération après génération."
 culture_parameter_caravanserai_hospitality: "Les [characters|El] de cette [culture|El] peuvent utiliser l’[interaction|El] #V $host_honored_guest_interaction$#!"
 culture_parameter_stewardship_gain_from_foreign_poi: "Visiter un [point_of_interest|El] sur les terres d’une autre [culture|El] donne de l’[lifestyle_experience|El] en [stewardship|El]"
 culture_parameter_silk_road_market_expertise: "La [decision|El] #V $visit_silk_road_market_decision$#! vous est davantage bénéfique"
 culture_parameter_silk_road_oasis_urban_building_slots: "Les [districts|El] #V [GetDistrictType('urban_housing_district').GetName]#! et #V [GetDistrictType('guild_district').GetName]#! ont #P +1#! emplacement de [building|El] dans les [GetTerrain( 'oasis' ).GetName|l]"
 culture_parameter_silk_road_market_owner_bonuses: "Les [buildings|El] du marché de la Route de la Soie offrent un [commerce_tax|El] supplémentaire"
 culture_parameter_silk_road_merchant_domicile_buildings: "Déverrouille les [domicile_buildings|El] #V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName]#! et #V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName]#!"
 culture_parameter_monsoon_traveler_trade_bonuses: "Le parcours #V $trait_track_travel$#! du [trait|El] [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] offre davantage de [trade_competitiveness|El][competitiveness_i], et le parcours #V $trait_track_danger$#! offre une [capacity|El][trade_route_capacity_i] supplémentaire"
 culture_parameter_monsoon_port_buildings_settlement_size: "Les [buildings|El] du [district|El] #V [GetDistrictType('port_district').GetName]#! offrent #P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#! de [settlement_size|El]"
 culture_parameter_monsoon_merchant_domicile_buildings: "Déverrouille les [domicile_buildings|El] #V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName]#! et #V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName]#!"
 tradition_binding_oaths_name: "Serments inviolables"
 tradition_binding_oaths_desc: "Les accords doivent être respectés. Ce peuple estime qu’une fois un contrat conclu, celui-ci ne doit jamais être rompu, et n’a aucune tolérance envers les parjures."
 culture_parameter_binding_oaths_harsh_break_penalties: "Rompre une [truce|El], dénoncer un [creditor|El] ou se faire dénoncer comme [GetTrait('dealbreaker').GetName( GetNullCharacter )|l] entraîne une perte d’[opinion|El] bien plus sévère au sein de la [culture|El] et coûte #N 10%#! de la [acumen|El] d’une [company|El]"
 culture_parameter_binding_oaths_word_is_trusted: "Les autres [rulers|El] sont bien plus susceptibles d’accepter l’[interaction|El] #V $negotiate_alliance_interaction$#! et de répondre à l’[interaction|El] #V $call_ally_interaction$#!, qui coûte #P -50%#! [prestige_i]"
 culture_parameter_good_faith_traits_more_common: "Les [traits|El] [GetTrait('honest').GetName( GetNullCharacter )] et [GetTrait('trusting').GetName( GetNullCharacter )] sont plus fréquents"
 culture_parameter_good_faith_trait_bonuses: "Les [traits|El] [GetTrait('honest').GetName( GetNullCharacter )] et [GetTrait('trusting').GetName( GetNullCharacter )] ont des bonus supplémentaires"
 culture_parameter_better_stewardship_education: "Les [children|El] de cette [culture|El] sont plus susceptibles de recevoir une bonne [education|El] en [stewardship|El]"
 binding_oaths_broke_word_modifier: "Parjure"
 binding_oaths_alliance_accept_reason: "Votre [tradition|El] [GetCultureTradition('tradition_binding_oaths').GetName] vous oblige à tenir parole : $VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "Ma [tradition|El] [GetCultureTradition('tradition_binding_oaths').GetName] m’oblige à honorer notre [alliance|El] : $VALUE|=+0$"
 culture_parameter_unlock_carnival_activity: "Les [rulers|El] [Concept('republican','républicains')|E] peuvent organiser l’[activity|El] [GetActivityType('activity_carnival').GetName]"
 culture_parameter_merchant_propensity_bonus: "Les [characters|El] de cette [culture|El] sont plus susceptibles de devenir [merchants|El]"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line' )]"
 culture_parameter_trade_league_cohesion_bonus_has_dlc: "Chaque [title|El] de cette [culture|El] dans une [trade_league|El] apporte chaque mois #P +0,02#! point de [league_cohesion|El]"
 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line' )]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "Une [trade_league|El] peut être fondée par les [rulers|El] de rang [Concept('county','comtal')|E]"
 tradition_roman_law_name: "Droit romain"
 tradition_roman_law_desc: "Le droit romain a bâti ce pays. Dans cette culture, le droit est enseigné à tous ceux qui jouissent d’un certain statut, et on s’en sert dans toutes les strates de la société. Paysans, artisans, veuves, nobles, marchands, tous s’appuient sur les textes de loi pour régler les conflits."
 culture_parameter_roman_law_cheaper_university: "Envoyer un [ward|El] à l’université et organiser l’[activity|El] [GetActivityType('activity_adult_education').GetName] coûtent #P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#! [gold_i]"
 culture_parameter_roman_law_university_bonuses: "Les [buildings|El] Université offrent des avantages supplémentaires"
 culture_parameter_roman_law_education_bonuses: "Les [education_traits|El] [learning|E] et [stewardship|E] et les [education_traits|El] de niveau cinq ont des bonus de [trade_competitiveness|El][competitiveness_i] et d’[stewardship_skill|El][stewardship_i] supplémentaires."
 culture_parameter_roman_law_legal_buildings_in_guild_district: "Les séries de [buildings|El] #V [GetBuildingType('notary_1').GetName]#! et #V [GetBuildingType('court_of_law_1').GetName]#! peuvent être construites dans le #V [GetDistrictType('guild_district').GetName|l]#!"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "Les séries de [buildings|El] #V [GetBuildingType('market_court_1').GetName]#!, #V [GetBuildingType('notary_1').GetName]#! et #V [GetBuildingType('court_of_law_1').GetName]#! donnent de l’[popular_opinion|El][popular_opinion_i] supplémentaire"
 culture_parameter_roman_law_notariate_domicile_building: "Déverrouille le [domicile_building|El] #V [GetDomicileBuilding('merchant_company_notariate_01').GetName]#!"
 tradition_civic_religion_name: "Religion civile"
 tradition_civic_religion_desc: "Ce peuple laisse le soin aux guildes et aux confréries de s’occuper des affaires religieuses. Aider les pauvres, défendre une ville ou encore construire une église... toutes ces responsabilités incombent à des groupes de pieux citoyens."
 culture_parameter_civic_religion_temple_district_restriction: "Le [district|El] #V [GetDistrictType('temple_district').GetName]#! n’est pas disponible pour les [secular_rulers|El]"
 culture_parameter_civic_religion_guild_building_slots: "Le #V [GetDistrictType('guild_district').GetName|l]#! a #P +2#! emplacements de [building|El]"
 culture_parameter_civic_religion_guild_charity_buildings: "Les séries de [buildings|El] #V [GetBuildingType('charities_1').GetName]#!, #V [GetBuildingType('hospitals_1').GetName]#!, #V [GetBuildingType('scribe_shop_1').GetName]#! et #V [GetBuildingType('scholarly_guilds_1').GetName]#! peuvent être construites dans le #V [GetDistrictType('guild_district').GetName|l]#!"
 culture_parameter_civic_religion_basilica: "Déverrouille la série de [buildings|El] [GetBuildingType('republic_basilica_01').GetName|V] dans le [GetDistrictType('republic_great_plaza_district').GetName|lV] pour les [republics|El]"
 culture_parameter_civic_religion_cathedral_civic_tax: "Les [buildings|El] Cathédrale donnent aussi de l’[civic_tax|El]"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "Changer de [personal_tenet|El] cause moins de [stress|El]"
 culture_parameter_civic_religion_education_piety_bonuses: "Les [education_traits|El] de [diplomacy|El] et la série de [traits|El] [GetTrait('education_republican_knowledge_3').GetName( GetNullCharacter )] procurent de la [piety|El][piety_i] supplémentaire"
 culture_parameter_civic_religion_trait_piety_bonuses: "Les [traits|El] [GetTrait('gregarious').GetName( GetNullCharacter )] et [GetTrait('family_first').GetName( GetNullCharacter )] procurent de la [piety|El][piety_i] supplémentaire"
 culture_parameter_unlock_improved_republic_militia: "Les [rulers|El] [Concept('republican','républicains')|E] peuvent promulguer la [Concept( 'law', 'loi' )|E] #V $republic_army_organization_2_improved_levy$#!"
 tradition_contado_name: "Contado"
 tradition_contado_desc: "Les terres de cette culture sont parsemées d’une myriade de petites villes fortifiées qui, pour bon nombre d’entre elles, ont à l’origine été fondées par des propriétaires terriens locaux. Grâce au métayage, ces derniers se sont éloignés du quotidien à la campagne."
 culture_parameter_contado_castello_buildings: "La série de [buildings|El] #V [GetBuildingType('castello_1').GetName]#! peut être construite dans le #V [GetDistrictType('villages_district').GetName|l]#!"
 culture_parameter_contado_borghi_buildings: "La série de [buildings|El] #V [GetBuildingType('borghi_1').GetName]#! peut être construite dans le #V [GetDistrictType('walls_district').GetName|l]#!"
 culture_parameter_contado_towers_domicile_building: "Déverrouille le [domicile_building|El] #V [GetDomicileBuilding('merchant_company_towers_01').GetName]#!"
 tradition_contract_warfare_name: "Guerre contractuelle"
 tradition_contract_warfare_desc: "Cette culture a institutionnalisé la guerre bien au-delà des levées et des armées citoyennes. Les troupes travaillent sous contrat et les officiers négocient les objectifs des campagnes avec les villes et les seigneurs. Plus qu’une affaire personnelle, tuer est devenu une affaire de professionnels."
 culture_parameter_unlock_innovation_condottieri: "L’[innovation|El] #high $innovation_condottieri$#! devient disponible à l’[era|El] du $culture_era_late_medieval$"
 culture_parameter_contract_warfare_single_combat: "Les [rulers|El] avec un [commander_trait|El], un [education_trait|El] en [martial|El], ou un [trait|El] [GetTrait('brave').GetName( GetNullCharacter )|l] peuvent utiliser l’[interaction|El] #V $challenge_to_single_combat_nomadic_interaction$#! avec les [characters|El] de [title_tier|El] inférieur ou égal qui ne sont pas leur [liege|El]"
 culture_has_university_desc: "La [culture|El] n’est pas présente dans un [county|El] avec une université"
 cultrad_republic_government_type: "Votre [government|El] est une [GetGovernment( 'republic_government' ).GetName|l]"
 cultrad_has_military_district: "Vous détenez une [holding|El] avec un #V [GetDistrictType('military_district').GetName|l]#!"
 culture_in_oasis_desc: "La [culture|El] n’est pas présente dans un [county|El] avec un [terrain|El] d’[GetTerrain( 'oasis' ).GetName|l]"
 oasis_count_desc: "La [culture|El] n’est pas présente dans au moins #V 2#! [counties|El] avec un [terrain|El] de type [GetTerrain( 'oasis' ).GetName|l]."
 culture_in_silk_road_region_desc: "La [culture|El] n’est pas présente le long de la [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 silk_road_percentage_desc: "La [culture|El] n’a pas #V 30%#! de ses [counties|El] dans la [GetGeographicalRegion('tgp_silk_road_region').GetName]"
 culture_on_monsoon_coast_desc: "La [culture|El] n’est pas présente dans un [county|El] côtier d’[GetGeographicalRegion('world_india').GetName], d’[GetGeographicalRegion('world_africa_east').GetName], ou du [GetGeographicalRegion('world_middle_east').GetName]"
 only_one_caravan_trade_tradition: "Seule une [tradition|El] de commerce caravanier est possible et les éléments suivants ne peuvent pas être combinés : $tradition_saharan_traders_name$ et $tradition_silk_road_traders_name$"
 only_one_seaborne_trade_tradition: "Seule une [tradition|El] de mercantilisme maritime est possible et les éléments suivants ne peuvent pas être combinés : $tradition_maritime_mercantilism_name$ et $tradition_monsoon_traders_name$"
