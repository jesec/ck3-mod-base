l_french:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "Une bouilloire sur le feu"
 republic_popular_opinion_event.1001.desc: "Ces jours-ci, il ne fait pas bon être identifié comme patricien dans la rue.\n\nDevant mon regard fuyant et mon air inquiet, [relation_01.GetName] s’exclame :\n\n« Bon sang, [ROOT.Char.GetFullName] ! Les patriciens de [event_location_01.GetName] ne vivent pas reclus. Ils défilent dans les rues comme de fiers citoyens ! »\n\n[relation_01.Custom('FR_IlElle')|U] a raison, mais l’ambiance est pesante en ville, ces derniers temps. Les manifestations et les rixes gangrènent la ville, et j’ose à peine imaginer ce qui s’y passe à la tombée de la nuit."
 republic_popular_opinion_event.1001.a: "« Vous avez raison. Nous devons garder la tête haute. »"
 republic_popular_opinion_event.1001.b: "« Le moment est peut-être venu de prendre un garde du corps. »"
 republic_popular_opinion_event.1001.c: "« La foule va tous nous tuer ! »"
 republic_popular_opinion_event.1001.d: "« Je ne suis pas une proie facile. »"
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "Période de mécontentement"
 republic_popular_opinion_event.1002.desc_1: "Debout devant ma fenêtre, je les entends exprimer leur colère. [event_location_01.GetName] est en pleine effervescence. Les ouvriers menacent de faire grève ou de descendre dans la rue. Des symboles du gouvernement ont été détruits ou vandalisés à la faveur de la nuit.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "Partout où je vais, on me dévisage, on me bouscule ou on m’insulte."
 republic_popular_opinion_event.1002.desc_control_firm: "Tout ce que la foule peut faire, ce sont des actes symboliques de résistance, car le gouvernement réprime avec une brutale efficacité le moindre signe de rassemblement illégal."
 republic_popular_opinion_event.1002.desc_control_strained: "[ROOT.Char.GetFaith.HighGodName] merci, les manifestations sont réprimées par les gardes citadins. Chaque jour, des meneurs sont arrêtés et mis au pilori. Ceux qui essaient de tirer profit du chaos sont traqués et démasqués. L’ordre est maintenu. Pour l’instant."
 republic_popular_opinion_event.1002.desc_control_slipping: "Malgré tous les efforts des gardes citadins, des fauteurs de troubles parviennent à passer entre les mailles du filet. La violence gangrène nos rues. Des foules se rassemblent et ne sont pas toujours dispersées à temps. La nuit appartient aux gangs et aux voyous."
 republic_popular_opinion_event.1002.desc_control_broken: "Le gouvernement n’a plus le contrôle des rues. Les gardes citadins se cachent dans les casernes, et la foule va jusqu’à harceler les patriciens sur les marches du palais ! Les rumeurs vont bon train sur la présence de saboteurs et d’agents étrangers."
 republic_popular_opinion_event.1002.a: "Je soutiens le gouvernement !"
 republic_popular_opinion_event.1002.b: "Je tiens à affirmer haut et fort mon soutien envers le peuple."
 republic_popular_opinion_event.1002.c: "Il est préférable de faire profil bas."
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "Esprit de fête"
 republic_popular_opinion_event.1003.desc: "Au milieu de l’agitation qui règne sur le marché de [event_location_01.GetTitle.GetName], je me retrouve à discuter avec un individu du nom de [craftsman_character.GetName], qui me fait mourir de rire en me parlant de son âne.\n\nCes derniers temps, j’ai l’impression que tous les habitants de la ville forment une grande famille. Il est plus facile de discuter avec des inconnus, et tout le monde est de bonne humeur, en dépit des exigences du quotidien. L’âne brait joyeusement et me donne des petits coups de tête. \n\n« L’Assemblée a fait du bon travail, pas vrai ? », me dit [craftsman_character.GetFirstNameNoTooltip] en grattant son âne derrière l’oreille. « Et si vous organisiez un grand festin pour fêter ça ? Les guildes accepteront certainement de donner un coup de main pour faire bonne impression et montrer toute leur reconnaissance. »"
 republic_popular_opinion_event.1003.a: "« C’est une excellente idée ! »"
 republic_popular_opinion_event.1003.b: "« Gratuitement, vous voulez dire ? »"
 republic_popular_opinion_event.1003.c: "« Je préférerais apprendre à vous connaître. »"
 republic_popular_opinion_event.1003.tt: "Votre prochaine [activity|El] de [feast|El] est #P gratuite. #!"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "Preuve d’ambition"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName] et moi apprécions un bon verre [ROOT.Char.Custom('RegionalDrink')] sur une place près de chez moi, tout en observant paresseusement l’agitation des passants qui vaquent à leurs occupations. [relation_01.GetName] lâche un soupir de satisfaction après avoir bu une gorgée.\n\n« Vous savez, [ROOT.Char.GetFullName], il faut battre le fer tant qu’il est chaud. Il faut de l’ambition ! Avec une telle ambiance dans la ville, tout semble possible. » [relation_01.Custom('FR_IlElle')|U] lève son verre et me sourit. « Trinquons aux nouvelles opportunités et à l’abondance ! »\n\nJe souris à mon tour et lève mon verre."
 republic_popular_opinion_event.1004.a: "« Aux aventures lointaines ! »"
 republic_popular_opinion_event.1004.b: "« À l’amour et la romance ! »"
 republic_popular_opinion_event.1004.c: "« À l’honneur et la gloire ! »"
 republic_popular_opinion_event.1004.d: "« À la famille et aux amis ! »"
