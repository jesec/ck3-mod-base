l_french:
 schmooze_intent: "Côtoyer"
 schmooze_intent_desc: "Vous vous efforcez de faciliter le bon fonctionnement de la compagnie et d’améliorer sa [competitiveness|El]."
 gdp_merchant_schmooze_modifier: "Fréquente des nobles"
 gdp_merchant_schmooze_modifier_desc: "Ce personnage a su se faire une place auprès de la noblesse locale lors d’un banquet organisé sur ce marché."
 gdp_schmooze_successful_title: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltip|U] côtoye [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUINameNoTooltip]"
 gdp_schmooze_successful: "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a profité de l’occasion pour côtoyer [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUINameNoTooltip]"
 gdp_schmooze_successful_empty_title: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltip|U] côtoye la noblesse"
 gdp_schmooze_successful_empty: "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetTitledFirstName] a profité de l’occasion de côtoyer des nobles"
 gdp_schmooze_events.1000.t: "Fréquenter [schmoozee.GetFirstNameNoTooltip]"
 gdp_schmooze_events.1000.desc: "Nous, les marchands, devons saisir chaque occasion de nouer des relations avec la noblesse. Grâce à une parole bien choisie ou un beau cadeau on peut s’assurer qu’elle ne fera pas obstacle à un projet – ou pire encore, qu’elle ne soutiendra pas celui d’un rival.\n\nEn veillant soigneusement à ne pas tomber dans la flatterie écœurante ou l’audace excessive, je mets tout en œuvre pour gagner la confiance [schmoozee.Custom('FR_du_Char_Pi')][schmoozee.GetTitledFirstName], m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('schmoozee'))]."
 gdp_schmooze_events.1000.a: "« [Select_CString(schmoozee.IsFemale,'Chère','Cher')] [schmoozee.GetTitleAsNameNoTooltip|l], je vous prie d’accepter ce cadeau. »"
 gdp_schmooze_events.1000.b: "« L’humble marchand[ROOT.Char.Custom('FR_E')] que je suis se doit d’admirer ses supérieurs. »"
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip] est flatté[schmoozee.Custom('FR_E')]"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip] lève les yeux au ciel"
 gdp_schmooze_events.1000.c: "« Parler avec vous a été un honneur. »"
 gdp_schmooze_events.1000.d: "« Je fais le commerce de nombreux biens dignes d’un [schmoozee.GetTitleAsNameNoTooltip|l] ! »"
 gdp_schmooze_events.1010.t: "Concurrence aimable"
 gdp_schmooze_events.1010.feast: "[schmoozee.Custom('FR_le_Char_Pi')|U][schmoozee.GetTitledFirstName] et moi partageons le pain, nous vantant tour à tour des succès de nos compagnies, tandis que nous sommes assis autour d’un verre [ROOT.Char.Custom('RegionalDrink')] en mangeant [ROOT.Char.Custom('GetExpensiveMeal')]."
 gdp_schmooze_events.1010.hunt: "[schmoozee.Custom('FR_le_Char_Pi')|U][schmoozee.GetTitledFirstName] et moi sommes assis à l’ombre d’un [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] et nous nous vantons tour à tour des succès de nos compagnies."
 gdp_schmooze_events.1010.outro: "\n\nMalgré toutes nos fanfaronnades, il semble bien que nous soyons d’accord sur bien des points. [schmoozee.Custom('FR_IlElle')|U] pourrait m’être utile – et moi, à [schmoozee.Custom('FR_LuiElle')]."
 gdp_schmooze_events.1010.a: "« Pour une petite somme, je pourrais vous faire un peu de place. »"
 gdp_schmooze_events.1010.b: "« Prenez ça et ne vous mettez pas en travers de mon chemin. »"
 gdp_schmooze_events.1010.c: "« Vous chantez mes louanges, et moi, les vôtres. »"
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip] est partant[schmoozee.Custom('FR_E')]"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip] n’est pas intéressé[schmoozee.Custom('FR_E')]"
 gdp_schmooze_events.1010.d: "Ce n’est pas le moment."
 gdp_schmooze_events.1030.t: "Attention divisée"
 gdp_schmooze_events.1030.feast: "Au cours de la soirée, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('schmoozee_1'))] [schmoozee_1.Custom('FR_le_Char_Pi')][schmoozee_1.GetTitledFirstName] et m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('schmoozee_2'))] [schmoozee_2.Custom('FR_le_Char_Pi')][schmoozee_2.GetTitledFirstName] m’entourent. Les nobles échangent nonchalamment leurs points de vue sur les principes hypothétiques des affaires et du commerce en tant qu’intermédiaires, tout en dégustant leur [schmoozer.Custom('GetRegionalFish')]."
 gdp_schmooze_events.1030.hunt: "Au cours de la chasse, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('schmoozee_1'))] [schmoozee_1.Custom('FR_le_Char_Pi')][schmoozee_1.GetTitledFirstName] et m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('schmoozee_2'))] [schmoozee_2.Custom('FR_le_Char_Pi')][schmoozee_2.GetTitledFirstName] m’entourent. Les nobles échangent nonchalamment leurs points de vue sur les principes hypothétiques des affaires et du commerce en tant qu’intermédiaires, tandis que les limiers cherchent une piste."
 gdp_schmooze_events.1030.outro: "\n\nFinalement, [schmoozee_1.GetFirstNameNoTooltip] s’adresse à moi pour que je donne mon avis. « Allez, [schmoozer.GetTitledFirstNameNoTooltip], vous faites pourtant partie des marchands vous aussi. Bon sang, vous devez bien avoir un avis sur la question ? »"
 gdp_schmooze_events.1030.a: "« Vous avez mis dans le mille, [Select_CString(schmoozee_1.IsFemale,'bonne','bon')] [schmoozee_1.GetTitleAsNameNoTooltip|l]. »"
 gdp_schmooze_events.1030.b: "« [schmoozee_2.Custom('FR_le_Char_Pi')|U][schmoozee_2.GetTitledFirstNameNoTooltip] a bien cerné la situation. »"
 gdp_schmooze_events.1030.c: "« Vos réflexions respectives sont une véritable source d’inspiration. »"
 gdp_schmooze_events.1030.c.success: "Ils sont flattés"
 gdp_schmooze_events.1030.c.failure: "Ils lèvent les yeux au ciel"
 gdp_schmooze_events.1030.d: "« Je ne peux absolument pas me prononcer là-dessus. »"
 gdp_schmooze_events.1050.t: "Mouvement du marché"
 gdp_schmooze_events.1050.feast: "Les festivités marquent une petite pause, ce qui permet aux invités de bavarder un peu et donne au personnel l’occasion de rattraper son retard dans le travail."
 gdp_schmooze_events.1050.hunt: "Nous faisons une petite pause pour admirer [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')], tandis que les chiens de chasse et les rabatteurs continuent d’avancer."
 gdp_schmooze_events.1050.outro: "Je me surprends à sélectionner inconsciemment des acteurs clés de nos marchés.\n\n[schmoozee_1.Custom('FR_le_Char_Pi')|U][schmoozee_1.GetTitledFirstName] est une personne utile à connaître en [market_1.GetLocationTitle.GetNameNoTier], et il en va de même pour [schmoozee_2.Custom('FR_le_Char_Pi')][schmoozee_2.GetTitledFirstName] en [market_2.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.three: "Je repère également [schmoozee_3.Custom('FR_le_Char_Pi')][schmoozee_3.GetTitledFirstName], qui est originaire de [market_3.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.a: "« [schmoozee_1.GetFirstNameNoTooltip], j’aurais bien aimé discuter avec vous ! »"
 gdp_schmooze_events.1050.b: "« J’ai entendu des choses très intéressantes, [schmoozee_2.GetFirstNameNoTooltip]. »"
 gdp_schmooze_events.1050.c: "« Oh, [schmoozee_3.GetFirstNameNoTooltip], discutons un peu ! »"
 gdp_schmooze_events.1050.d: "Les marchés se portent à merveille."
 gdp_schmooze_events.1060.t: "En quête d’attention"
 gdp_schmooze_events.1060.feast: "Tandis que les serviteurs s’affairent autour des tables pour remplir les verres et servir le plat suivant,"
 gdp_schmooze_events.1060.hunt: "Lorsque nous nous arrêtons pour boire une gorgée d’eau à nos gourdes et nous dégourdir les jambes,"
 gdp_schmooze_events.1060.outro: "je vois [Select_CString(rival.IsFemale,'ma concurrente','mon concurrent')], [rival.Custom('FR_le_Char_Pi')][rival.GetTitledFirstName], flatter sans vergogne [schmoozee.Custom('FR_le_Char_Pi')][schmoozee.GetTitledFirstName].\n\n[Select_CString(rival.IsFemale,'Cette flagorneuse','Ce flagorneur')] vante les mérites de ses marchands, tout en méprisant les miens, qu’[rival.Custom('FR_IlElle')] traite de fripons et de fanfarons !"
 gdp_schmooze_events.1060.a: "« Allons, votre misérable opération [rival.GetHouse.GetBaseNameNoTooltip] est une farce ! »"
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip] a l’air bête"
 gdp_schmooze_events.1060.a.failure: "Vous passez pour [Select_CString(GetPlayer.IsFemale,'une idiote','un idiot')]"
 gdp_schmooze_events.1060.b: "« Pas si vite ! Notre carnet de commandes est très solide. »"
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip] est convaincu[schmoozee.Custom('FR_E')]"
 gdp_schmooze_events.1060.b.failure: "Vous présentez des arguments peu convaincants"
 gdp_schmooze_events.1060.c: "Laissons-les bavarder."
 activity_used_trade_market_luxury_items_modifier: "Demande sociale"
 activity_used_trade_market_luxury_items_modifier_desc: "Les produits de luxe de ce marché ont été détournés par un marchand afin d’être utilisés dans le cadre d’une activité."
 activity_used_trade_market_comforts_modifier: "Demande sociale"
 activity_used_trade_market_comforts_modifier_desc: "Les biens de confort de ce marché ont été détournés par un marchand afin d’être utilisés dans le cadre d’une activité."
