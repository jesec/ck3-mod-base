 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "Les bases de notre république sont enfin posées ! Les petits tyrans et leurs hommes de main ne nous réduiront plus à la charrue et au sillon. Leurs querelles ne nous infligeront plus ni douleur ni chagrin.\n\nDésormais, unis au sein d’une même communauté, nous façonnerons notre propre destin et nous défendrons notre liberté durement acquise. Que notre ville soit une lueur d’espoir, et que nos remparts soient un bouclier contre la tyrannie."
 republic_event.0001.a: "Le début d’une nouvelle ère !"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "Les anciennes pratiques nous ont été bien utiles, et nous continuerons à les honorer. Mais la salle du clan ne peut plus contenir ce que nous sommes devenus. Les marchés, les remparts et la volonté du peuple exigent désormais un autre type de gouvernement.\n\nAujourd’hui, nous abandonnons le régime [tribal|El] pour fonder une [republic|El]. Que notre ville s’exprime d’une même voix, et que cette voix soit la nôtre."
 republic_event.0002.a: "La ville saura s’en souvenir."
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "Par la présente, je vous informe que j’ai révoqué votre comptoir à [actor.GetCapitalLocation.GetBaronyNameExplicitly], avec effet immédiat.\n\nBien entendu, je prends cette décision dans le meilleur intérêt de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]. Vous le comprendrez certainement."
 republic_event.0010.a: "Mais c’était #EMP mon#! comptoir !"
 republic_event.0012.desc: "Vous n’êtes plus [ROOT.Char.Custom('FR_LeLa')] bienvenu[ROOT.Char.Custom('FR_E')] en [trade_post_target_county.GetNameNoTierNoTooltip] ! Vos droits de commerce ont également été révoqués. Tous vos objets de valeur seront confisqués et le comptoir sera rasé."
 republic_event.0012.a: "Je trouverai un autre endroit pour mes marchandises..."
 republic_event.0020.t: "Le Trésor de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 republic_event.0020.intro: "Le moment est venu de revoir le budget de la république."
 republic_event.0020.steward_desc: "[steward.Custom('FR_le_Char_U_Pi')|U][steward.GetShortUIName|U] se tient devant moi, les sourcils froncés, le grand livre à la main. Une petite armée de conseillers [steward.Custom('FR_LeLa')] suit, lourdement chargés de parchemins, de livres et de notes budgétaires.\n\n« [ROOT.Char.GetTitleAsNameNoTooltip|U], nous devons passer en revue nos dépenses et établir un nouveau budget pour le Trésor. Je crains que cette affaire ne puisse attendre."
 republic_event.0020.solo_desc: "Je suis entouré[ROOT.Char.Custom('FR_E')] d’une petite armée de scribes chargés de parchemins, de livres et de notes budgétaires. Tous attendent que je termine ma lecture.\n\n"
 republic_event.0020.income_desc: "Nos revenus actuels dépassent largement nos dépenses et peuvent être mieux utilisés."
 republic_event.0020.deficit_desc: "Nos dépenses sont trop élevées et, si nous ne faisons rien, le Trésor va s’effondrer."
 republic_event.0020.fallback_desc: "Cela fait déjà plusieurs années que le dernier budget a été adopté."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.Custom('FR_le_Char_U_Pi')|U][steward.GetShortUIName|U] a déjà examiné le budget, qui semble favorable. Il n’y a aucun changement à apporter."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "Plusieurs documents contenant des propositions sont étalés devant moi, et chacun indique une voie différente pour le Trésor – où il faut dépenser et où il faut économiser.\n\nLequel dois-je choisir ?"
 republic_event.0021.a: "Assurez-vous que tout le monde soit bien payé."
 republic_event.0021.b: "Des salaires équitables sont plus adaptés."
 republic_event.0021.c: "Nous devrions surtout allouer davantage de fonds à l’État."
 republic_event.0021.a.info_desc: "Axe de la [treasury_budget_category|El] : [treasury_salary_budget_short|El]@gold_icon!\nLes salaires élevés sont généralement appréciés par la plupart des [patricians|El]"
 republic_event.0021.b.info_desc: "Axe de la [treasury_budget_category|El] : équilibre@law_icon!\nUn budget bien équilibré assure aux [patricians|El] un salaire décent et laisse un [treasury|E] suffisant au [liege|El]"
 republic_event.0021.c.info_desc: "Axe de la [treasury_budget_category|El] : pays@treasury_icon!\nUn faible budget salarial implique plus d’argent pour la république, allouant ainsi davantage de fonds au [liege|El] afin de les dépenser comme bon lui semble"
 republic_event.0030.desc: "Je suis aux regrets de vous informer que j’ai mis un terme à tous vos monopoles au sein de mes marchés. Les échanges doivent pouvoir s’effectuer librement."
 republic_event.0030.a: "Nous devrons nous battre comme tout le monde..."
 republic_event.0040.desc: "J’ai le regret de vous informer qu'il a été décidé de votre expulsion de la [actor.GetConfederation.GetName]."
 republic_event.0040.a: "Nous voilà de nouveau concurrents"
 republic_event.0050.desc: "L’assemblée du [title.GetName] m’a élu[new_holder.Custom('FR_E')] au sein de cette auguste institution en tant que [new_holder.GetTitleAsNameNoTooltip|l] [new_holder.Custom('GetRepublicTermLength')]."
 republic_event.0051.desc: "J’ai été réélu[new_holder.Custom('FR_E')] [new_holder.Custom('GetRepublicTermLength')]. Gloire au [title.GetName] !"
 republic_term_length_1_desc: "pour un mandat de [EmptyScope.ScriptValue('law_term_length_1_value')|0] ans"
 republic_term_length_2_desc: "pour un mandat de [EmptyScope.ScriptValue('law_term_length_2_value')|0] ans"
 republic_term_length_3_desc: "pour un mandat de [EmptyScope.ScriptValue('law_term_length_3_value')|0] ans"
 republic_term_length_4_desc: "pour un mandat de [EmptyScope.ScriptValue('law_term_length_4_value')|0] ans"
 republic_term_length_5_desc: "pour un mandat de [EmptyScope.ScriptValue('law_term_length_5_value')|0] ans"
 republic_term_length_indefinite_desc: "à vie"
 republic_event.0052.desc: "J’ai présenté une loi aux éminents membres de l’assemblée.\n\nLe projet de loi « [new_law.GetNameNoTooltip] » sera soumis à un vote après de longues délibérations."
 republic_event.0053.pass.desc: "Le projet de loi « [new_law.GetNameNoTooltip] » a été approuvé et intégré dans la législation de la république !"
 republic_event.0053.rejected.desc: "Le projet de loi « [new_law.GetNameNoTooltip] » a été rejeté par l’assemblée."
 republic_event.law.TT: "#bold Projet :#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P Adopté :#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N Rejeté :#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold Conservé :#! [current_law.GetName]"
 republic_event.assembly.response: "Entendu."
 republic_event.assembly.opening: "Chers concitoyens,"
 rescind_trade_monopoly_notification_base_desc: "Tous les [trade_monopolies|El] ont été annulés sur les [trade_markets|El] [actor.Custom('FR_du_Char_U_Pi')][actor.GetShortUIName] qui appartenaient à :"
 rescind_trade_monopoly_notification_confederation_desc: "La [recipient.GetConfederation.GetName|Vl]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "Votre [company|El]"
 republic_event.0100.t: "La république de Rome"
 republic_event.0100.desc: "Rome. Prononcer ce mot, non pas comme le nom d’une ville, mais comme un symbole, un #EMP idéal#!, a longtemps été le rêve de beaucoup. Moi, j’ai fait de ce rêve une réalité.\n\nJ’entends les célébrations résonner aux quatre coins du pays. Les citoyens, non, plutôt les #EMP Romains#!, découvriront un avenir dans lequel nous serons à nouveau au cœur de la civilisation. Aujourd’hui commence le travail visant à restaurer les idéaux perdus de l’Antiquité. Pour devenir une lueur d’espoir, un phare qui nous guidera en cette sombre époque."
 republic_event.0100.a: "Toutes les routes mèneront de nouveau à Rome."
 republic_event.0100.b: "Rome n’est pas une simple ville, c’est un idéal."
