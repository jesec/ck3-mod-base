 burgher_refusal_revolt_outcome_war_tt: "Les villes prennent les armes"
 burgher_refusal_revolt_outcome_calm_tt: "Les villes perdent leur sang-froid"
 burgher_civic_league_formed_tt: "Les [counties|El] forment la #V $confederation_type_trade_league_name|l$#!"
 burgher_self_rule_free_city_tt: "La nouvelle [republic|El] commence avec les [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|lV]"
 burgher_self_rule_chartered_city_tt: "La nouvelle [republic|El] commence avec la [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|lV]"
 burgher_self_rule_new_capital_tt: "La nouvelle [republic|El] prend [burgher_new_capital.GetNameNoTier] comme [capital|El]"
 BURGHER_WAR_NAME: "Révolte cistercienne [ATTACKER.GetCulture.GetNameNoTooltip|l]"
 burgher_war_victory_desc: "Chaque [county|El] rebelle devient une [republic|El] autonome, commençant avec la [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|lV], et faisant de la plus grande ville du [county|El] sa [capital|El] si besoin. Trois comtés rebelles ou plus forment une #V $confederation_type_trade_league_name|l$#!"
 burgher_war_victory_free_city_desc: "Chaque [county|El] rebelle devient une [republic|El] autonome, commençant avec les [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|lV], et faisant de la plus grande ville du [county|El] sa [capital|El] si besoin. Trois comtés rebelles ou plus forment une #V $confederation_type_trade_league_name|l$#!"
 burgher_war_white_peace_desc: "La [faction|El] est dissoute et le [county|El] en tête reçoit un privilège civique mineur. Ses comtés ne créeront pas d’autre [faction|El] d’$FACTION_BURGHER_AUTONOMY_NAME|l$ pendant [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] ans."
 burgher_war_defeat_desc: "La [faction|El] est dissoute et chaque [county|El] rebelle perd ses privilèges civiques, ainsi que son [popular_opinion|El]. Ses comtés ne créeront pas d’autre [faction|El] d’$FACTION_BURGHER_AUTONOMY_NAME|l$ pendant [EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0] ans."
 burgher_war_ended_invalid.desc: "$BURGHER_WAR_CB_NAME$ invalidée : la [faction|El] d’$FACTION_BURGHER_AUTONOMY_NAME|l$ n’a plus de chef !"
 civic_privileges_county_modifier: "Privilèges civiques"
 civic_privileges_county_modifier_desc: "Ce comté a bénéficié de quelques privilèges civiques mineurs qui n’ont pas été inscrits dans une charte."
 civic_privilege_market_rights_1_county_modifier: "Droits de marché restreints"
 civic_privilege_market_rights_1_county_modifier_desc: "Ce comté a obtenu le droit de contrôler un marché sous la supervision de son seigneur qui y applique ses propres mesures."
 civic_privilege_market_rights_2_county_modifier: "Droits de marché"
 civic_privilege_market_rights_2_county_modifier_desc: "Ce comté a obtenu ses propres jours et échelles de marché et garde une bonne part du commerce."
 civic_privilege_market_rights_3_county_modifier: "Droits de marché vastes"
 civic_privilege_market_rights_3_county_modifier_desc: "Ce comté a obtenu un contrôle quasi total sur son marché. Son seigneur reçoit une petite part du commerce."
 civic_privilege_guild_rights_1_county_modifier: "Droits de la guilde restreints"
 civic_privilege_guild_rights_1_county_modifier_desc: "Les artisans de ce comté ont obtenu le droit de s’organiser, mais leurs maîtres répondent toujours de la Cour de leur seigneur."
 civic_privilege_guild_rights_2_county_modifier: "Droits de la guilde"
 civic_privilege_guild_rights_2_county_modifier_desc: "Les guildes de ce comté ont obtenu le droit d’établir leurs standards et de reconnaître leurs propres maîtres."
 civic_privilege_guild_rights_3_county_modifier: "Droits de la guilde vastes"
 civic_privilege_guild_rights_3_county_modifier_desc: "Les guildes de ce comté ont obtenu un contrôle quasi total sur leurs artisans et ce qu’ils produisent."
 civic_privilege_tax_exemption_1_county_modifier: "Exemption partielle d’impôt civique"
 civic_privilege_tax_exemption_1_county_modifier_desc: "La ville de ce comté a été soulagée d’une partie des contributions qu’elle devait verser à son seigneur."
 civic_privilege_tax_exemption_2_county_modifier: "Exemption d’impôt civique"
 civic_privilege_tax_exemption_2_county_modifier_desc: "La ville de ce comté a obtenu le droit de lever ses propres impôts au taux de son souhait."
 civic_privilege_tax_exemption_3_county_modifier: "Exemption d’impôt civique vaste"
 civic_privilege_tax_exemption_3_county_modifier_desc: "La ville de ce comté a été soulagée d’une partie de ses impôts, et ne paie qu’une maigre somme symbolique."
 civic_privilege_militia_charter_1_county_modifier: "Charte de la milice restreinte"
 civic_privilege_militia_charter_1_county_modifier_desc: "La ville de ce comté a obtenu sa propre garde, mais elle la perdra si celle-ci s’aventure par-delà les remparts."
 civic_privilege_militia_charter_2_county_modifier: "Charte de la milice"
 civic_privilege_militia_charter_2_county_modifier_desc: "La ville de ce comté a obtenu sa propre milice, et les troupes qui marchaient aux côtés du seigneur se font moins nombreuses."
 civic_privilege_militia_charter_3_county_modifier: "Charte de la milice vaste"
 civic_privilege_militia_charter_3_county_modifier_desc: "La ville de ce comté a obtenu le droit de s’armer, et ne laisse qu’une poignée symbolique de ces armes à son seigneur."
 burgher_grievance_county_modifier: "Griefs civiques"
 burgher_grievance_county_modifier_desc: "Ce comté a vu ses demandes être rejetées et refuse de passer l’éponge."
 gdp_civic_agitation_county_modifier: "Agitation citoyenne"
 gdp_civic_agitation_county_modifier_desc: "Une main extérieure monte ce comté contre son dirigeant."
 gdp_civic_agitation_popular_republic_modifier: "Voix du peuple"
 gdp_civic_agitation_popular_republic_modifier_desc: "Ce complot est soutenu par le chef d’une [GetLaw('republic_type_popular').GetName|l] – un modèle en matière de liberté citoyenne."
 bestow_civic_liberties_interaction: "Conférer des libertés citoyennes"
 bestow_civic_liberties_options_heading: "Liberté à accorder"
 bestow_civic_liberties_option_market_rights: "Droits de marché"
 bestow_civic_liberties_option_guild_rights: "Droits de la guilde"
 bestow_civic_liberties_option_tax_exemption: "Exonération d’impôts"
 bestow_civic_liberties_option_militia_charter: "Charte de la milice"
 bestow_civic_liberties_interaction_desc: "Accordez un privilège à l’un de vos [counties|El], et améliorez-y l’[popular_opinion|El]"
 bestow_civic_liberties_no_charter_left_tt: "Ce [county|El] doit avoir un privilège civique restant à recevoir"
 agitate_civic_unrest_interaction: "Attiser les tensions sociales"
 agitate_civic_unrest_interaction_desc: "Tentez de pousser l’un des [counties|El] [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUINameNoTooltip] à demander la souveraineté, ce qui déclenchera une [war|El] avec le [casus_belli|El] #V $BURGHER_WAR_CB_NAME$#! en cas de refus"
 agitate_civic_unrest_eligible_tt: "Vous devez être en mesure de déclencher un [scheme|El] #V $gdp_civic_agitation_scheme$#! contre ce [county|El]"
 revoke_civic_liberties_interaction: "Révoquer des libertés citoyennes"
 revoke_civic_liberties_interaction_desc: "Retirez tous les privilèges de l’un de vos [counties|El] au risque d’impacter lourdement l’[popular_opinion|El]"
 revoke_civic_liberties_authority_tt: "Votre [crown_authority|El] doit être au moins [GetLaw('crown_authority_1').GetName]"
 revoke_civic_liberties_no_privileges_tt: "Ce [county|El] doit avoir des libertés citoyennes à révoquer"
 gdp_civic_agitation_scheme: "Attiser les tensions sociales"
 gdp_civic_agitation_scheme_action: "Attiser les tensions sociales"
 gdp_civic_agitation_scheme_desc: "J’inciterai les braves gens de [SCHEME.GetTargetTitle.GetBaseNameNoTier] à demander le droit de souveraineté qu’ils méritent amplement !"
 gdp_civic_agitation_scheme_desc_general: "$gdp_civic_agitation_scheme$ est un [hostile_scheme|El] ayant pour but d’inciter un [county|El] à demander le droit de souveraineté à son [ruler|El]. Il s’agit d’un [secret_scheme|El] basé sur l’[intrigue|El] qui peut recruter des [agents|El].\n\nEn cas de complot $gdp_civic_agitation_scheme$ réussi, le [county|El] ciblé formera une [faction|El] d’$FACTION_BURGHER_AUTONOMY_NAME|l$ qui partira en [war|El] si ses exigences sont refusées.\n\nTout [merchant|El] et chef de $republic_type_popular|l$ peut contribuer à l’agitation, et toute [republic|El] qu’ils libèrent deviendront populaires également. Les chefs d’autres [republics|El] doivent avoir un [patrician_rating|El] d’au moins [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V], et celui des autres [house_heads|El] [republicans|El] doit être supérieur ou égal à [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]."
 gdp_civic_agitation_scheme_desc_success: "Le [county|El] ciblé forme une [faction|El] d’$FACTION_BURGHER_AUTONOMY_NAME$ et demande la souveraineté"
 gdp_civic_agitation_scheme_discovery_desc: "Votre agitation du [county|El] n’a pas été découverte"
 gdp_civic_agitation_scheme_invalidated_title: "@scheme_icon! Fin du complot $gdp_civic_agitation_scheme$"
 gdp_civic_agitation_scheme_invalidated_desc: "Le [scheme|El] $gdp_civic_agitation_scheme$ n’est plus valide"
