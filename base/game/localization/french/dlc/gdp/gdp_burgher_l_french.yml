 dissolve_the_hanse_cb_victory_desc: "La [defender.GetConfederation.GetName] est dissoute et [defender.Custom('FR_le_Char_U_Pi')][defender.GetShortUIName] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] désormais [vassal|El] [attacker.Custom('FR_du_Char_U_Pi')][attacker.GetShortUIName]."
 dissolve_the_hanse_cb_white_peace_desc: "La [defender.GetConfederation.GetName] n’est pas dissoute et [defender.Custom('FR_le_Char_U_Pi')][defender.GetShortUIName] [Select_CString(CHARACTER.IsLocalPlayer,'restez','reste')] indépendant[defender.Custom('FR_E')]."
 dissolve_the_hanse_cb_defeat_desc: "$dissolve_the_hanse_cb_white_peace_desc$"
 dissolve_the_hanse_cb_ended_invalid.desc: "[war.GetName] terminée : soit [defender.Custom('FR_le_Char_U_Pi')][defender.GetShortUIName] n’[Select_CString( defender.IsLocalPlayer, 'êtes', 'est' )] plus chef de la Hanse, soit [attacker.Custom('FR_le_Char_U_Pi')][attacker.GetShortUIName] l’[Select_CString( attacker.IsLocalPlayer, 'avez', 'a' )] rejointe."
 hanseatic_league_member_modifier: "Négociant hanséatique"
 hanseatic_league_member_modifier_desc: "Ce personnage est un membre de la Hanse et commerce sous son égide privilégiée."
 hanseatic_league_county_modifier: "Comté hanséatique"
 hanseatic_league_county_modifier_desc: "Ce comté appartient à un membre de la Hanse, et son marché prospère grâce aux privilèges de la ligue."
