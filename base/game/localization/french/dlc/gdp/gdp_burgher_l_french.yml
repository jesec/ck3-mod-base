 every_hanseatic_family: "Chaque [family|El] dans la Hanse"
 gdp_caught_agitating_modifier: "Agitation révélée"
 gdp_caught_agitating_modifier_desc: "Ce personnage a été surpris en train d’attiser les tensions contre un autre [ruler|El]. Les autres [rulers|El] le regardent donc, à raison, d’un œil désapprobateur."
 merchant_civic_advantage_modifier: "Commanditaire citoyen"
 merchant_civic_advantage_modifier_desc: "Ce personnage a soutenu un projet de liberté citoyenne et a obtenu les faveurs du peuple. Cela pourrait bien lui être profitable."
 STEAL_TRADE_POST_KONTOR_DEFENDED_DESC: "A un $hanseatic_kontor_01|l$ : $VALUE|+=0$"
 hanseatic_staple_right_county_modifier: "Droit d’étape"
 hanseatic_staple_right_county_modifier_desc: "Ce comté a obtenu le droit de décharger les marchandises en transit et de les vendre sur place en premier."
 building_type_hanseatic_kontor_01: "Kontor"
 building_type_hanseatic_kontor_01_desc: "Les marchants hanséatiques de ce kontor vivent selon leurs propres lois et horaires. Les apprentis ne peuvent pas se marier avant d’être rentrés chez eux."
