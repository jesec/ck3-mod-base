 HANSEATIC_LEAGUE_NAME: "Ligue hanséatique"
 GENERIC_HANSE_NAME: "Hanse de [hanse_lead_town.GetName]"
 gdp_burgher.0001.desc: "Nous, les [burgher_county.Custom('BurgherPluralNoun')] de [burgher_county.GetNameNoTierNoTooltip], exigeons que vous nous accordiez [burgher_county.Custom('BurgherDemandedPrivilege')], afin que notre ville puisse prospérer et apporter davantage de richesse à votre pays."
 gdp_burgher.0001.a: "Cette requête est raisonnable. Accordez-lui mon sceau."
 gdp_burgher.0001.b: "Je refuse !"
 gdp_burgher.0001.opening: "[ROOT.Char.Custom('FR_MonseigneurMadame')|U],"
 gdp_burgher.0010.desc: "Nous, les [burgher_county.Custom('BurgherPluralNoun')] de [burgher_county.GetNameNoTierNoTooltip], vous demandons de nous accorder la liberté de nous gouverner nous-mêmes, de choisir nos dirigeants et de mener nos affaires en notre propre nom. Sans quoi, nous serons obligés de prendre par la force ce que vous nous refusez."
 gdp_burgher.0010.a: "Donnez-leur leur liberté."
 gdp_burgher.0010.b: "Laissez-les se battre pour leurs « droits »."
 gdp_burgher.0020.t: "La liberté de [freed_county.GetNameNoTierNoTooltip]"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier] a gagné sa liberté, ainsi que le privilège d’être autonome et de nommer ses propres magistrats.\n\nBien sûr, tout cela n’aurait jamais eu lieu sans mon soutien."
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier] a gagné sa liberté, ainsi que le privilège d’être autonome et de nommer ses propres magistrats.\n\nBien sûr, tout cela n’aurait jamais eu lieu sans mon soutien."
 gdp_burgher.0020.a: "J’accepte volontiers le fardeau de la gouvernance."
 gdp_burgher.0020.b: "Je vais prendre place parmi leurs magnats."
 gdp_burgher.0020.c: "Leurs faveurs seront suffisamment profitables."
 gdp_burgher_agitator_not_republic_head_tt: "Vous ne devez pas déjà diriger une [republic|El]"
 gdp_burgher_agitator_outranks_republic_head_tt: "Votre [title_tier|El] doit être inférieur à celui [burgher_ruler.Custom('FR_du_Char_Pi')][burgher_ruler.GetTitledFirstName]"
 gdp_civic_agitation.0001.t: "Liberté suscitée"
 gdp_civic_agitation.0001.desc: "Tout est rentré dans l’ordre. Le peuple de [target.GetNameNoTier] brûle d’un puissant désire de liberté citoyenne que mes agents pourraient attiser, alors que ses dirigeants prononcent des discours passionnés sur la place du marché à propos d’impôts onéreux et de magistrats injustes.\n\nJ’ai entendu dire qu’une délégation se prépare à rendre visite à son seigneur pour lui demander le droit de souveraineté. Reste à savoir si je chevaucherai avec elle."
 gdp_civic_agitation.0001.a: "J’ai déjà fait tout ce chemin et je compte bien aller jusqu’au bout."
 gdp_civic_agitation.0001.b: "Je financerai moi-même leurs armes et leurs montures."
 gdp_civic_agitation.0001.c: "Laissez le peuple penser que cette idée est la sienne. Ceux qui comptent savent ce qu’il en est."
 gdp_civic_agitation.0001.c.exposed: "Assumez-le, et ne leur promettez rien d’autre"
 gdp_civic_agitation_sponsor_joins_war_tt: "Vous rejoindrez la [war|El] aux côtés des [agitated_county.Custom('BurgherPluralNoun')|l], si leur dirigeant les rabroue"
 gdp_civic_agitation_sponsor_war_chest_tt: "Vous financerez une compagnie de soldats professionnels si une guerre s’ensuit"
 gdp_civic_agitation.0002.t: "Des pièces mal dépensées"
 gdp_civic_agitation.0002.desc: "La liste de doléances a été dressée et énoncée à haute voix devant le peuple de [target.GetNameNoTier]. Leurs dirigeants se sont rassemblés et n’ont rien fait.\n\nMes agents ignorent ce qu’il s’est passé, excepté ce qui parait évident. Mon argent leur a tout acheté, excepté le cran de l’utiliser."
 gdp_civic_agitation.0002.a: "Je n’oublierai pas de si tôt cette veule perfidie."
 found_the_hanseatic_league_decision: "Fonder la Ligue hanséatique"
 found_the_hanseatic_league_decision_tooltip: "Regroupez les [counties|El] de votre [trade_league|El] en une confédération marchande encore plus puissante"
 found_the_hanseatic_league_decision_confirm: "La prospérité réside dans l’harmonie"
 found_the_hanseatic_league_decision_desc: "Les rois s’imaginent que le pouvoir porte une couronne et manie une épée. Nous savons qu’il existe une autre vérité. Le pouvoir est enveloppé dans des fourrures, sent le poisson, et porte des registres répertoriant des sommes qui mettraient des royaumes en faillite.\n\nSeuls, nous sommes taxés, pillés, et forcés de nous soumettre ; unis, aucun pouvoir des mers du Nord ne nous arrêtera. Nul port ne refusera nos vaisseaux, nul marchand étranger ne nous concurrencera, et nul prince ne souhaitera contester nos privilèges."
 found_the_hanseatic_league_cohesion_tt: "La [trade_league|El] doit avoir au moins #V 95#! de [cohesion|El]"
 found_the_hanseatic_league_members_tt: "La [trade_league|El] doit avoir au moins #V 4#! membres"
 found_the_hanseatic_league_message_title: "Une Hanse est née"
 found_the_hanseatic_league_message_desc: "[hanse_founder.Custom('FR_le_Char_U_Pi')|U][hanse_founder.GetUIName|U] [Select_CString( hanse_founder.IsLocalPlayer, 'avez', 'a' )] réuni la ligue en une Hanse sous serment."
 league_needs_liege_consent_tt: "En tant que [vassal|El], vous devez avoir l’approbation de votre [liege|El], ou une ville en mesure de s’affilier seule"
 gdp_hanseatic.0010.opening: "De la part de la [the_league.GetName],"
 gdp_hanseatic.0010.desc: "Vous détenez des droits commerciaux en votre propre nom, qui ne bénéficient qu’à vous et à personne d’autre.\n\nCe genre d’arrangements individuels nous discréditent. Nous vous demandons que vous nous les cédiez, afin que nous prospérions ensemble."
 gdp_hanseatic.0010.a: "Nous les céderons à la [the_league.GetName]."
 gdp_hanseatic.0010.b: "Je vais les accorder à la [hanse_city_title.GetNameNoTier]."
 gdp_hanseatic.0010.c: "Ces droits sont miens, et ils le resteront."
