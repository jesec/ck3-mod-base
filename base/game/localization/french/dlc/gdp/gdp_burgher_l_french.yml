 burgher_refusal_revolt_war_tt: "La [faction|El] d’$FACTION_BURGHER_AUTONOMY_NAME|l$ entre en [war|El] avec le [casus_belli|El] #V $BURGHER_WAR_CB_NAME$#!\nSi elle gagne : $burgher_war_victory_desc|l$"
