 scheme_critical_moments.1142.desc_patrician_self: "Ma campagne d’autopromotion a porté ses fruits.\n\nMa réputation auprès de mes pairs s’est améliorée et de nouveaux soutiens affluent en masse vers ma [house|E]. Mon objectif est plus proche que jamais !"
 scheme_critical_moments.1142.desc_patrician_other: "Le temps et les ressources consacrés à la promotion de la cause [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName] ont porté leurs fruits.\n\n[target.Custom('FR_IlElle')|U] jouit d’une meilleure réputation auprès de ses pairs, de nouveaux partisans sont désormais convaincus de sa valeur, et sa réputation au sein de la [republic|El] a désormais augmenté d’un cran !"
 scheme_critical_moments.1143.desc_patrician_self: "J’ai vainement investi du temps et de l’argent dans ma campagne d’autopromotion. Personne n’a été convaincu de ma valeur ou influencé par mes promesses, ni même mes pots-de-vin.\n\nJe vais devoir innover pour promouvoir ma [house|E]."
 scheme_critical_moments.1143.desc_patrician_other: "$scheme_critical_moments.1143.desc_other$"
 patrician_promote_success_toast: "Réputation promue !"
