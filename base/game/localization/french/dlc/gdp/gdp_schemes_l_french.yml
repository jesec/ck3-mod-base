 patrician_find_secrets_desc_general: "Dans un [scheme|El] de recherche de secrets, vous tentez de révéler un [secret|El] criminel ou honteux sur une autre [patrician_family|El]."
 PATRICIAN_FIND_SECRETS_SUCCESS_DESC: "Vous allez découvrir un [secret|El] appartenant à la [patrician_family|El] [SCHEME.GetTargetCharacter.Custom('FR_du_Char_U_Pi')][SCHEME.GetTargetCharacter.GetShortUIName], s’il en existe."
