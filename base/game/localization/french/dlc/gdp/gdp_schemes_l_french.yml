 steal_market_insights_desc: "L’infiltration de [SCHEME.GetTargetCharacter.GetPrimaryTitle.GetDefinitiveName] pourrait nous permettre d’exploiter expérience [SCHEME.GetTargetCharacter.Custom('FR_du_Char_U_Pi')][SCHEME.GetTargetCharacter.GetShortUIName] dans le commerce de certaines marchandises."
 steal_market_insights_action: "Voler l’expertise de"
 steal_market_insights_desc_general: "Le vol d’expertise commerciale est un [hostile_scheme|El] qui vise à dérober l’[expertise|El] d’une [company|El] [Concept('merchant', 'marchande')|E] rivale. Elle se base sur l’[intrigue|El] et l’[stewardship|El] et peut nécessiter le recrutement d’[agents|El].\n\nS'il est réussi, le vol d’expertise commerciale entraînera le gain d’$game_concept_expertise|l$ de la [company|El] de l’[scheme_owner|El] pour toutes les [trade_categories|El] dans lesquelles la $game_concept_company|l$ de la [Concept('scheme_target','cible')|El] possède une $game_concept_expertise|l$ plus élevée."
