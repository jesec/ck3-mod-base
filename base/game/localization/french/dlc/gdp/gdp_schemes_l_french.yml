 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.8402.desc: "Au plus profond de [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], j’observe les magistrats [target_patron.Custom('FR_du_Char_Pi')][target_patron.GetTitledFirstName] étudier de près des quantités astronomiques de documents. Chaque tampon satisfaisant confirme le transfert réussi d’une ressource supplémentaire de la Maison [target.GetHouse.GetName] vers [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip].\n\nMais le bourdonnement tranquille d’une mouche qui les survole est soudain interrompu par [target.GetFirstName] faisant irruption dans la pièce.\n\n« VOUS ! » s’exclame-t-[target.GetSheHe], laissant éclater sa colère. « Comment ?! Pourquoi... ? »"
 scheme_critical_moments.8402.a: "Les affaires sont les affaires..."
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.8403.desc: "Après tant d'allées et venues et tant de harcèlement de la part [target_patron.Custom('FR_du_Char_Pi')][target_patron.GetTitledFirstName], nous n’avons pourtant pas réussi à conclure les dernières étapes avant que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] ne découvre que quelque chose se tramait...\n\n[target.GetPrimaryTitle.GetName] occupe désormais une posture fermement défensive, sapant notre capacité à dominer ces fumiers dans les tribunaux."
 scheme_critical_moments.8403.discovered: "\n\nEt par-dessus le marché, [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstNameNoTooltip] sait pertinemment que nous sommes les responsables de tout ça..."
 scheme_critical_moments.8403.fallback: "\n\nLe seul point positif dans toute cette perte de temps et d’énergie, c’est que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstNameNoTooltip] n’a aucune idée de notre implication dans cette histoire."
 scheme_critical_moments.8403.a: "Typique..."
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.Custom('FR_le_Char_U_Pi')|U][scheme.GetOwner.GetShortUIName|U] a tenté en vain de mener une $hostile_takeover|l$ de la compagnie [target.Custom('FR_du_Char_U_Pi')][target.GetShortUIName] !"
 scheme_critical_moments.8404.t: "Prise de pouvoir hostile : [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "Alors que nous nous consacrions corps et âme à la comptabilité et à la recherche de clients, nous avons appris aujourd’hui que nous aurions mieux fait de nous montrer attentifs à tout autre chose.\n\nUne courte missive nous est parvenue de [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], nous confirmant le jugement au tribunal prévu ce jour, au cours duquel notre compagnie sera dissoute et ses ressources seront saisies par [owner.GetPrimaryTitle.GetDefinitiveName] !\n\nÀ mon arrivée sur place, il était déjà trop tard, même si je n’aurais sans doute rien pu faire de toute façon.\n\n[owner.Custom('FR_le_Char_Pi')|U][owner.GetTitledFirstName], cette vermine, m’a lancé un petit sourire moqueur alors que je parcourais fébrilement les documents et que mon mécène, [target_patron.Custom('FR_le_Char_Pi')][target_patron.GetTitledFirstName], me confirmait toute l’histoire."
 scheme_critical_moments.8404.a: "Comment ?! Pourquoi... ?"
