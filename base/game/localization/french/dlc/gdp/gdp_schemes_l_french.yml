 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.8502.desc: "Peu à peu, les registres volés, rumeurs en tout genre et informations glanées au hasard nous permettent de reconstituer le carnet d’adresses des nombreux acheteurs, vendeurs et contacts professionnels divers de [target.GetPrimaryTitle.GetDefinitiveName].\n\nCes renseignements nous donneront indubitablement de meilleures chances de concurrencer les marchandises les plus populaires [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName]."
 scheme_critical_moments.8502.discovered: "\n\nMalheureusement, nos investigations ne sont pas passées inaperçues par [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstNameNoTooltip]..."
 scheme_critical_moments.8502.a: "Excellent !"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.Custom('FR_le_Char_U_Pi')|U][scheme.GetOwner.GetShortUIName] a réussi un $steal_market_insights|l$ contre la compagnie [target.Custom('FR_du_Char_U_Pi')][target.GetShortUIName], mais ses actes ont été découverts !"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.8503.desc: "Tant de journées passées à tenter d’argumenter avec les marchands ambulants, tant de nuits passées à préparer nos prochaines manœuvres, et pourtant nous n’avons obtenu aucun renseignement sur les opérations de [target.GetPrimaryTitle.GetDefinitiveName]...\n\nMême les documents dérobés dans les bureaux [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName] ne comportaient que des griffonnages sans valeur ou de vieux calculs."
 scheme_critical_moments.8503.discovered: "\n\nEt le pire, c'est que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstNameNoTooltip] semble avoir eu vent de nos intrigues."
 scheme_critical_moments.8503.fallback: "\n\nNotre seule source de réconfort, c’est que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstNameNoTooltip] ne semble pas avoir eu vent de nos intrigues."
 scheme_critical_moments.8503.a: "Quelle perte de temps..."
 scheme_critical_moments.8503.tt.failed: "[scheme.GetOwner.Custom('FR_le_Char_U_Pi')|U][scheme.GetOwner.GetShortUIName|U] a tenté un $steal_market_insights|l$ contre la compagnie [target.Custom('FR_du_Char_U_Pi')][target.GetShortUIName], mais ses actes se sont soldés par un échec !"
