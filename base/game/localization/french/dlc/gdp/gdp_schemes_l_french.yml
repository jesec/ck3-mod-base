 steal_market_insights_rival_progress_tt: "En cas de découverte, votre relation avec [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] deviendra une [rivalry|El]@rival_icon!, ce qui nuira à la [Concept('house_relation', 'relation entre les Maisons')|E] [actor.GetHouse.GetName] et [recipient.GetHouse.GetName]"
