 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.8602.desc: "Les magistrats de [trade_post_county.GetName] ont un prix, et il n’est pas très élevé. Cachet après cachet, la propriété de [trade_post_province.GetName] nous est transmise.\n\nQuand [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] finira par se rendre compte qu’il se passe quelque chose, nos agents seront déjà en train de remercier ses fonctionnaires et de peindre nos couleurs au-dessus de la porte."
 scheme_critical_moments.8602.a: "C’est une bonne adresse, qui nous appartient désormais."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.8603.desc: "Tous nos pots-de-vin ont été acceptés, mais toutes les promesses ont été reniées. Les magistrats de [trade_post_county.GetName] ont empoché mon argent sans même tenter de faire respecter ma propriété.\n\nL’emprise [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName] sur les lieux reste inébranlable."
 scheme_critical_moments.8603.discovered: "\n\nPire encore, [target.Custom('FR_IlElle')] sait très bien qui a voulu lui arracher sa bourse..."
 scheme_critical_moments.8603.fallback: "\n\nAu moins, notre rôle dans cette affaire ne s’est pas ébruité."
 scheme_critical_moments.8603.a: "De l’argent gaspillé pour des hommes sans honneur."
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.Custom('FR_le_Char_U_Pi')|U][scheme.GetOwner.GetShortUIName|U] a tenté, en vain, de s’emparer de votre [trade_post|El] en [trade_post_province.GetNameNoTooltip] !"
 scheme_critical_moments.8604.t: "Comptoir saisi : [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "Un cavalier nous a apporté un message de [trade_post_county.GetName] : notre agent a été jeté à la rue et les magistrats locaux ont déclaré ma présence indésirable, alors qu’ils nommaient un autre propriétaire du comptoir de [trade_post_province.GetName].\n\nDes années de commerce, de stockage et de bonne entente durement gagnée, parties en fumée à cause d’hommes que nous avions déjà payés."
 scheme_critical_moments.8604.discovered: "\n\nEt à présent, [owner.Custom('FR_le_Char_Pi')][owner.GetTitledFirstName] a pris possession des lieux, comme si sa place avait toujours été là. Pas question d’oublier cet affront !"
 scheme_critical_moments.8604.a: "On nous ferme notre propre porte au nez !"
 steal_trade_post_failed_toast: "Tentative de saisie du comptoir"
 steal_trade_post_host_toast: "Le comptoir a changé de mains"
 steal_trade_post_host_toast_desc: "Le [trade_post|El] en [trade_post_province.GetName] est passé des mains [target.Custom('FR_du_Char_U_Pi')][target.GetShortUIName] à celles [owner.Custom('FR_du_Char_U_Pi')][owner.GetShortUIName]"
