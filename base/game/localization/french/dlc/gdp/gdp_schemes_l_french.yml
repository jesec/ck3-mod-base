 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "J’ai presque de la peine pour la famille [target.GetHouse.GetName]. Leurs domestiques et prétendus associés partagent de bon cœur leurs secrets les plus dégradants avec mes agents. Ils semblent même enthousiastes dans leur trahison. J’ai presque de la peine, mais ça ne m’arrêtera pas.\n\nLes preuves que je possède sont irréfutables : [secret_holder.Custom('FR_le_Char_Pi')][secret_holder.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')] !"
 gdp_patrician_find_secrets.0002.a: "Sa réputation est entre mes mains."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "Mes agents ont passé au crible les papiers jetés par la Maison [target.GetHouse.GetName], mis leurs domestiques sous pression, rempli la bourse de tous les informateurs des environs, et tout ça, sans rien trouver d'exploitable.\n\nSoit [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstNameNoTooltip] a enterré ses secrets trop profondément pour qu’ils puissent être mis au jour, soit [target.Custom('FR_IlElle')] n’en a tout simplement pas."
 gdp_patrician_find_secrets.0003.desc.outmatched: "Mes agents ont suivi chaque pas de la famille [target.GetHouse.GetName], mais ont échoué à recueillir ne serait-ce que l’ombre d’un secret. Leurs portes sont fermées plus solidement que la bourse d’un grippe-sou et leurs domestiques tiennent tellement leur langue qu’ils pourraient aussi bien ne pas en avoir du tout.\n\nNous n’avons pas le moindre début de piste sur les actions dépravées que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] aurait pu commettre."
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U] ! Nous avons fait tout cela pour rien."
