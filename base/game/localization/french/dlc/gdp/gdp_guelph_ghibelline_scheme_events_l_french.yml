l_french:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip] : ce qui a été perdu"
 gdp_guelph_ghibelline_scheme.1000.desc: "Je me trouve à la foire annuelle de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], où règnent une joie et une convivialité palpables.\n\nLe brouhaha des festivités endiablées, les tissus aux motifs colorés et les effluves de la délicieuse cuisine [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] m’enveloppent de toutes parts — un véritable régal pour mes sens fatigués.\n\nJe tombe sur [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName], qui admire avec enthousiasme un étal du marché, et je saisis l’occasion pour faire jouer mon charme."
 gdp_guelph_ghibelline_scheme.1000.a: "« Les #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l]#! ont essayé d’interdire ces festivités, vous savez. »"
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "Vous parvenez à mettre en évidence la malveillance des [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l]"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName] vous repousse"
 gdp_guelph_ghibelline_scheme.1000.b: "« Cette fibule vous irait à merveille, [Select_CString(target.IsFemale,'chère amie','cher ami')] ! »"
 gdp_guelph_ghibelline_scheme.1000.c: "Je n’ai aucune raison d’intervenir."
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip] : le bruit court..."
 gdp_guelph_ghibelline_scheme.1010.desc: "Mes informateurs m'ont dit que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName], notre #EMP [Select_CString(target.IsFemale,'estimée cheffe','estimé chef')]#! des [ROOT.Char.Custom('GetGuelphsGhibellines')|l] semble submergé[target.Custom('FR_E')] dernièrement, cédant sous le poids de ses lourds devoirs.\n\nQuelques missives bien pensées à nos partisans pourraient consolider cette impression et pourquoi pas, suggérer un candidat plus #EMP méritant#! à ce fardeau."
 gdp_guelph_ghibelline_scheme.1010.a: "Rédigez une première version des lettres immédiatement."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "La probabilité de réussite est modifiée par votre [gg_involvement|El] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#! @gg_involvement_icon!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Vos lettres ont convaincu plusieurs [ROOT.Char.Custom('GetGuelphsGhibellines')|l] de vos qualités de dirigeant"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Vos lettres ont fait plus de mal que de bien à votre cause"
 gdp_guelph_ghibelline_scheme.1010.b: "N’importe quel membre de la Maison [ROOT.Char.GetHouse.GetName] ferait un excellent chef !"
 gdp_guelph_ghibelline_scheme.1010.c: "Qui peut dire si c'est vrai ?"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip] : de l’éloquence"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "Il semblerait que mon agent, [court_agent.Custom('FR_le_Char_Pi')][court_agent.GetTitledFirstName], ait entendu parler d’un groupe de courtisans dissidents à la Cour [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "Il semblerait que mon agent, [court_agent.Custom('FR_le_Char_Pi')][court_agent.GetTitledFirstName], ait trouvé des oreilles attentives auprès des [target.Custom('GetGuelphsGhibellines')|l] mécontents du commandement [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.intro: "Il semblerait que mon agent, [court_agent.Custom('FR_le_Char_Pi')][court_agent.GetTitledFirstName], ait trouvé une oreille attentive auprès [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName]."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nJ’ai pris du retard dans ma dernière correspondance avec [court_agent.Custom('FR_le_Char_Pi')][court_agent.GetTitledFirstNameNoTooltip]."
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "Devrions-nous collaborer avec ces fauteurs de troubles locaux pour faire avancer nos projets ?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "Devrais-je lui demander d'attiser leurs doutes sur [target.GetFirstNameNoTooltip] ?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "Devrais-je saisir l’occasion et lui demander de plaider la cause des [ROOT.Char.Custom('GetGuelphsGhibellines')|l] auprès [target.Custom('FR_du_Char_L')][target.GetTitleAsNameNoTooltip|l] ?"
 gdp_guelph_ghibelline_scheme.1020.a: "Tirons plutôt parti de mes efforts."
 gdp_guelph_ghibelline_scheme.1020.b: "Servons-nous de ces... vauriens."
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.Custom('FR_le_Char_Pi')|U][court_agent.GetTitledFirstNameNoTooltip] va devoir montrer ce qu’[court_agent.Custom('FR_IlElle')] sait faire."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.Custom('FR_le_Char_U_Pi')|U][court_agent.GetShortUIName] contribue à la réussite de vos plans"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.Custom('FR_le_Char_U_Pi')|U][court_agent.GetShortUIName] est loin d’être convaincant[court_agent.Custom('FR_E')]"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U] devrait se concentrer sur ma réputation."
 gdp_guelph_ghibelline_scheme.1020.prestige: "Prestige terni"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Votre prestige a été quelque peu entaché."
 gdp_guelph_ghibelline_scheme.1020.piety: "Piété ternie"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Votre piété a été quelque peu entachée."
 gdp_guelph_ghibelline_scheme.1020.e: "Ma dévotion parle d’elle-même !"
 gdp_guelph_ghibelline_scheme.1020.f: "Je ne devrais pas interférer."
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip] : faire avancer les choses"
 gdp_guelph_ghibelline_scheme.1030.desc: "Un assistant de longue date se précipite vers moi alors que je fais ma ronde matinale :\n\n« [ROOT.Char.Custom('FR_MonseigneurMadame')|U], nos informateurs à la Cour [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName] nous rapportent que ses [ROOT.Char.Custom('DescribeTargetSkill')] sont pour le moins risibles. »\n\n« Peut-être pourrions-nous en tirer parti, d’une manière ou d’une autre ? »"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', sly_character )], [sly_character.Custom('FR_le_Char_Pi')][sly_character.GetTitledFirstName], vient discrètement me voir alors que je fais ma ronde matinale :\n\n« Dans le cadre de nos efforts pour sauver [target.GetPrimaryTitle.GetName] de ces stupides [target.Custom('GetGuelphsGhibellines')|l], que diriez-vous de remettre en question les [ROOT.Char.Custom('DescribeTargetSkill')] [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName] ? »\n\n« D’après ce que j’ai entendu, [target.Custom('FR_IlElle')] ne semble pas briller dans ce domaine. »"
 gdp_guelph_ghibelline_scheme.1030.a: "« Des efforts doivent être déployés pour mettre fin aux rumeurs. »"
 gdp_guelph_ghibelline_scheme.1030.a.tt: "La probabilité de réussite est modifiée par votre [gg_involvement|El] (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#! @gg_involvement_icon!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "Vous avez réussi à nuire [target.Custom('FR_au_Char_U_Pi')][target.GetShortUIName]"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Vos efforts sont vains"
 gdp_guelph_ghibelline_scheme.1030.b: "« Nous devrions en profiter pour l’affaiblir à sa Cour. »"
 gdp_guelph_ghibelline_scheme.1030.c: "« Alimentons ces rumeurs. »"
 gdp_guelph_ghibelline_scheme.1030.d: "« Je ne vois pas pourquoi nous devrions. »"
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.1262.desc: "C’est une immense réussite ! [target.Custom('FR_le_Char_Pi')|U][target.GetTitledFirstName] a enfin retrouvé la raison et se tient désormais aux côtés des [owner.Custom('GetGuelphsGhibellines')|l].\n\nJe savais bien qu’[target.Custom('FR_IlElle')] finirait par céder."
 scheme_critical_moments.1262.a: "Excellent !"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.1263.desc: "Il y a des gens comme ça... À notre grand agacement à tous, [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] s’obstine à dire que les [target.Custom('GetGuelphsGhibellines')|l] ont raison — peu importe à quel point j’essaie d’argumenter, de négocier ou de supplier.\n\nInutile de préciser que cette fois-ci, nous ne nous sommes pas quittés en bons termes."
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')|U]#! !"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.1272.desc: "Les félicitations sont de mises ! Un par un, les [owner.Custom('GetGuelphsGhibellines')|l] retirent leur soutien [target.Custom('FR_au_Char_Pi')][target.GetTitledFirstName] et viennent me demander conseil.\n\n[target.Custom('FR_IlElle')|U] n'a pas d'autre choix que de céder sa place."
 scheme_critical_moments.1272.a: "Formidable !"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.1273.desc: "Malgré nos efforts, [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] reste le plus en vue chez les [owner.Custom('GetGuelphsGhibellines')|l] et les quelques soutiens que j'avais ont diminué jusqu'à disparaître."
 scheme_critical_moments.1273.desc.secret: "\n\nAu moins, [target.Custom('FR_IlElle')] ne sait toujours rien de mes plans."
 scheme_critical_moments.1273.desc.discovered: "\n\nPire encore, [target.Custom('FR_IlElle')] sait que ça venait de moi et ce n'est pas son genre d'oublier."
 scheme_critical_moments.1273.a: "Tss-tss..."
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.1282.desc: "C’est une immense réussite ! [target.Custom('FR_le_Char_Pi')|U][target.GetTitledFirstName] a enfin retrouvé la raison et se tient désormais aux côtés des [owner.Custom('GetGuelphsGhibellines')|l].\n\nJe savais bien qu’[target.Custom('FR_IlElle')] finirait par céder."
 scheme_critical_moments.1282.a: "Excellent !"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.1283.desc: "Il y a des gens comme ça... À notre grand agacement à tous, [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] s’obstine à dire que les [target.Custom('GetGuelphsGhibellines')|l] ont raison — peu importe à quel point j’essaie d’argumenter, de négocier ou de supplier.\n\nInutile de préciser que cette fois-ci, nous ne nous sommes pas quittés en bons termes."
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')|U]#! !"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip] : réussite"
 scheme_critical_moments.1292.desc.intro: "Excellente nouvelle : [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] est remplacé[target.Custom('FR_E')] par [target_character.Custom('FR_le_Char_Pi')][target_character.GetTitledFirstName], qui est bien plus bienveillant[target.Custom('FR_E')] !"
 scheme_critical_moments.1292.desc.intro.unknown: "Excellente nouvelle : [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] va être remplacé[target.Custom('FR_E')] par quelqu’un qui est fidèle à la cause !"
 scheme_critical_moments.1292.desc: "\n\nC’est véritablement une réussite exceptionnelle pour les [ROOT.Char.Custom('GetGuelphsGhibellines')|l] ! Nous pouvons désormais être certains que [target.GetPrimaryTitle.GetNameNoTier] sera gouverné de manière juste et équitable."
 scheme_critical_moments.1292.desc.discovered: "\n\nMon implication n’est pas passée inaperçue, alors je vais devoir rester sur mes gardes..."
 scheme_critical_moments.1292.a: "Votre attention, je vous prie !"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip] : échec"
 scheme_critical_moments.1293.desc: "Même les plans les plus minutieux...\n\n#EMP Quelqu’un a commis une erreur.#! Je finirai bien par découvrir qui c’était, mais pour l’instant, je ne peux pas nier que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] m’a échappé cette fois-ci. Il semble que nous devrons encore supporter pendant un petit moment un règne [target.Custom('GetGuelphGhibelline')|l] insensé en [target.GetPrimaryTitle.GetNameNoTier]."
 scheme_critical_moments.1293.a: "Malédictions !"
