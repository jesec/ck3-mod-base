 gdp_merchant.3000.t: "Conseil d’un traducteur"
 gdp_merchant.3000.desc: "[Select_CString(translator.IsFemale,'Ma traductrice','Mon traducteur')], [translator.Custom('FR_le_Char_Pi')][translator.GetTitledFirstName], s’est isolé[translator.Custom('FR_E')] depuis un certain temps, apparemment plongé[translator.Custom('FR_E')] dans des textes en langue étrangère, mais finit par se montrer.\n\n« [ROOT.Char.GetTitleAsNameNoTooltip] », dit-[translator.Custom('FR_IlElle')] en souriant, « j’ai lu des rapports achetés sur le [market.GetName|l] ; les abréviations en langue [saved_culture.GetLanguage.GetName|l] étaient difficiles à déchiffrer, mais beaucoup d’informations sur les mouvements de marchandises locales s’y trouvent ! »"
 gdp_merchant.3000.a: "« Je veux tout, jusqu’à la dernière miette, [translator.GetFirstNameNoTooltip] ! »"
 gdp_merchant.3000.a.tt: "La [company|El] acquiert de l’[trade_expertise|El] dans toutes les [trade_categories_short|El] négociées sur le [market.GetName|l]"
 gdp_merchant.3000.b: "« Vous pourriez m’apprendre cette langue ? »"
 gdp_merchant.3000.b.tt: "Votre [scheme|El] obtient [GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]"
 gdp_merchant.3000.c: "« Vendez les découvertes au plus offrant. »"
 gdp_merchant.3000.d: "« Concentrez-vous sur vos compétences linguistiques. »"
 gdp_merchant_translator_buff_modifier: "Traducteur enseignant"
 gdp_merchant.3010.t: "Trouvaille d’un limier"
 gdp_merchant.3010.desc: "[fixer.Custom('FR_le_Char_Pi')|U][fixer.GetTitledFirstName], qui arpentait furtivement [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] depuis quelque temps avec une ténacité acharnée, finit enfin par me donner rendez-vous, m’adressant un mot énigmatique pour m’annoncer qu’[fixer.Custom('FR_IlElle')] a trouvé ce que nous cherchions.\n\n[fixer.Custom('FR_IlElle')|U] prend place d’un air mystérieux,"
 gdp_merchant.3010.desc.secret: "avant d’esquisser un sourire. « Ça m’a demandé un certain effort, mais voici la preuve que [secret_haver.Custom('FR_le_Char_Pi')][secret_haver.GetTitledFirstName] a un secret : [secret.GetName|l] ! »"
 gdp_merchant.3010.desc.scheme: "et son visage trahit son inquiétude. « J’ai de mauvaises nouvelles, [ROOT.Char.Custom('FR_MonseigneurMadame')|U]. J’ai découvert que [scheme_owner.Custom('FR_le_Char_Pi')][scheme_owner.GetTitledFirstName] complotait contre vous – contre la compagnie ! »"
 gdp_merchant.3010.a: "« C’est très utile, apportez-m’en d’autres ! »"
 gdp_merchant.3010.b: "« [Select_CString(fixer.IsFemale,'Une vraie petite sournoise','Un vrai petit sournois')], hein, [fixer.GetFirstNameNoTooltip] ? »"
 gdp_merchant.3010.c: "« Je ne m’intéresse pas aux rumeurs mal acquises. »"
 gdp_merchant.3010.d: "« Je pourrais m’en servir dans mon travail... »"
 gdp_merchant.3020.t: "Rodomontades de huissier"
 gdp_merchant.3020.desc: "Mon [Select_CString(bailiff.IsFemale,'huissière','huissier')], [bailiff.GetTitledFirstName], a passé en revue la liste des débiteurs, tergiversant sur les moyens de pression à exercer pour nous assurer de récupérer nos [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')].\n\n"
 gdp_merchant.3020.pressure: "« [pressure_debtor_1.Custom('FR_le_Char_Pi')|U][pressure_debtor_1.GetTitledFirstName] manque de fonds, mais pourrait faire un geste de bonne volonté en commençant à rembourser sa dette... », grogne [bailiff.GetFirstNameNoTooltip].\n\n"
 gdp_merchant.3020.demand: "[bailiff.Custom('FR_IlElle')|U] soupire : « Je sais de source sûre que [demand_debtor_1.Custom('FR_le_Char_Pi')][demand_debtor_1.GetTitledFirstName] peut payer... mais [demand_debtor_1.Custom('FR_IlElle')] se croit au-dessus de nous ! »\n\n"
 gdp_merchant.3020.third: "« Et puis il y a [portrait_3.Custom('FR_le_Char_Pi')][portrait_3.GetTitledFirstName]... », murmure-t-[bailiff.Custom('FR_IlElle')]."
 gdp_merchant.3020.a: "« Oui, je suis sûr[ROOT.Char.Custom('FR_E')] que [pressure_debtor_1.GetFirstNameNoTooltip] peut se permettre de payer une petite partie. »"
 gdp_merchant.3020.a.tt: "Vous devra #V -[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#![gold_i] de moins"
 gdp_merchant.3020.b: "« Mettez la pression [demand_debtor_1.Custom('FR_au_Char_Pi')][demand_debtor_1.GetTitledFirstNameNoTooltip]... »"
 gdp_merchant.3020.c: "« [pressure_debtor_2.GetFirstNameNoTooltip] peut se permettre un petit remboursement. »"
 gdp_merchant.3020.d: "« C’est clair que [demand_debtor_2.GetFirstNameNoTooltip] nous donne des réponses évasives ! »"
 gdp_merchant.3020.e: "« Rappelez à [pressure_debtor_3.GetFirstNameNoTooltip] ses obligations. »"
 gdp_merchant.3020.f: "« Il est temps d’envoyer un message clair à [demand_debtor_3.GetFirstNameNoTooltip]. »"
 gdp_merchant.3020.g: "« Je préfère qu’ils restent mes débiteurs. »"
 ho_loan_demand_refused_title: "Demande de prêt refusée"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUINameNotMe] vous doit toujours [outstanding|V0][gold_i]"
 ho_loan_reduced_title: "Prêt réduit"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUINameNotMe] vous doit désormais [outstanding|V0][gold_i]"
 gdp_merchant.3031.t: "Zèle d’un agent"
 gdp_merchant.3031.desc: "Mon agent de marché, [market_agent.GetTitledFirstName], a passé ces derniers temps des nuits blanches, plongé[market_agent.Custom('FR_E')] dans les livres comptables tandis que la cire fondait autour d[market_agent.Custom('FR_EluiElle')]. [market_agent.Custom('FR_IlElle')|U] cligne des yeux, encore à moitié endormi[market_agent.Custom('FR_E')], en entrant dans mon bureau ce matin.\n\n« [ROOT.Char.GetTitledFirstName] ! J’ai étudié nos livres de comptes pour le [market.GetName|l], et il est clair que nous pourrions... » #weak *bâille*#! « Ce serait une folie de ne pas saisir cette occasion ! »"
 gdp_merchant.3031.a: "« Bon travail, [market_agent.GetFirstNameNoTooltip]. Maintenant allez dormir un peu ! »"
 gdp_merchant.3031.a.tt: "Une [trade_opportunity|El] [trade_opportunity.GetType.GetName|V] se présente sur le [market.GetName|l]"
 gdp_merchant.3031.b: "« Peu importe, concentrez-vous sur nos préoccupations actuelles ! »"
 gdp_merchant.3040.t: "Inquiétudes d’[Select_CString(antiquarian.IsFemale,'une conservatrice','un conservateur')]"
 gdp_merchant.3040.desc: "[Select_CString(antiquarian.IsFemale,'Ma conservatrice','Mon conservateur')], [antiquarian.GetTitledFirstName], veille à ce que la collection de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] soit en bon état et en sécurité, et raconte des anecdotes intéressantes aux visiteurs de passage.\n\nUn matin, alors que je m’arrête pour admirer notre [artifact.GetName], [antiquarian.Custom('FR_IlElle')] arrive à point nommé : « Ah, [ROOT.Char.Custom('FR_MonseigneurMadame')|U], c’est une pièce très spéciale, mais je me demande parfois si elle ne fait pas de l’ombre au reste de la collection. »"
 gdp_merchant.3040.b: "« Il est temps de s’en débarrasser. Trouvez-lui un acheteur. »"
 gdp_merchant.3040.c: "« Une rénovation ne lui ferait pas de mal. »"
 gdp_merchant.3040.c.tt: "[artifact.GetName] est déjà en parfait état"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName] est une #V créature#!"
 gdp_merchant.3040.d: "« Balivernes – la collection est parfaite. »"
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "Un simple citadin aurait sans doute du mal à croire tout le chemin parcouru par un simple morceau de tissu, à travers des déserts brûlants et par-delà des mers agitées, avant d’arriver sur l’étal d’un marché.\n\nCes efforts consentis par les négociants, les animaux et les navires font partie du quotidien de notre compagnie. Même les villes lointaines, où l’on ne parle pas un mot de langue [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|l], dépendent de nos livraisons."
 gdp_merchant.8000.a: "Une réputation à l’image de la compagnie !"
 gdp_merchant.8000.b: "Mais je ne dois pas oublier mes racines."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "Plus précieuses encore que les ballots et les rouleaux destinés au troc, ou que les pierres et métaux précieux issus de la terre, sont les merveilles que des mains talentueuses parviennent à créer à partir de ces matières.\n\nDes dispositifs sophistiqués, des bijoux à couper le souffle et un savoir-faire artisanal raffiné constituent l’élixir de vie de notre compagnie, et notre nom est synonyme de qualité et de confiance."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "Même le plus grand des rois peut devenir aussi impuissant qu’un mendiant lorsque l’argent cesse de couler à flots et que les crédits l’entourent tels les fils d’une toile d’araignée.\n\nLe nom de la compagnie est connu jusque dans les cours de tout le pays. Négociatrice habile et intermédiaire de confiance, elle est toujours disposée à secourir ceux qui en ont besoin. Mais que nul ne s’avise d’abuser de sa bonté : sa générosité n’est pas faiblesse."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "Un livre de voyages"
 gdp_merchant.8010.desc: "Rares sont ceux qui ont vu autant de choses, et aucun d’entre eux n’a vécu l’intégralité de mon expérience unique. Pour le mendiant comme pour le potentat, les contrées lointaines de ce monde sont comme enveloppées d’une brume, et l’on aspire à des éclairages et à des récits qui lèvent le voile.\n\nEn m’asseyant, je repense aux moments les plus saisissants de mes voyages en [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier] et je me demande ce que les étrangers et mes descendants aimeraient le plus entendre."
 gdp_merchant.8010.a: "Je vais m’intéresser aux coutumes et aux règles de savoir-vivre à l’étranger."
 gdp_merchant.8010.a.tt: "La qualité de ce livre dépendra fortement de votre [trait_level_track_xp|El] de [GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|Vl] #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#! et de [GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|Vl] #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )|l])#!"
 gdp_merchant.8010.b: "Les lecteurs recherchent des conseils sur la négociation et le marché."
 gdp_merchant.8010.c: "Mon travail décrira des villes exotiques et des merveilles."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "Cela m’a pris plus de temps que prévu, mais je suis finalement plutôt satisfait[ROOT.Char.Custom('FR_E')] de mes notes. J’ai détaillé mon voyage en [poi.GetName], agrémenté d’anecdotes glanées en chemin, en particulier sur les [author.Custom('GetTravelogueTopic')] exotiques.\n\n"
 gdp_merchant.8011.weak: "En les relisant, je suis déçu[ROOT.Char.Custom('FR_E')] et me demande si j’aurais dû faire davantage d’efforts. Malheureusement, l’heure est venue de poser ma plume."
 gdp_merchant.8011.mid: "En les relisant, je suis [Select_CString(ROOT.Char.IsFemale,'fière','fier')] de l’étendue de mon travail, mais j’ai néanmoins l’impression qu’il manque ce petit quelque chose qui rend une œuvre unique."
 gdp_merchant.8011.great: "En les relisant, je me surprends à rire doucement de mes propres mots, tandis que certains passages me transportent, comme si je les vivais une nouvelle fois. Voilà quelque chose qui mérite qu’on s’en souvienne !"
 gdp_merchant.8011.a: "Je vais les garder pour moi pour l’instant."
 gdp_merchant.8011.b: "Cela sera ajouté à la bibliothèque de la compagnie."
 travelogue_description_full: "Il s’agit d’un récit plein d’imagination d’un voyage en [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier], rédigé par [Select_CString(author.IsFemale,'la marchande','le marchand')] [author.GetTitledFirstName]. [author.Custom('FR_IlElle')|U] y partage ses impressions sur les [author.Custom('GetTravelogueTopic')] de terres étrangères.\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "Les voyages de [author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]"
 travelogue_name_2: "La Route vers [poi.GetCounty.GetName]"
 travelogue_name_3: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip] : [Select_CString(author.IsFemale,'la voyageuse','le voyageur')]"
 travelogue_name_4: "Vers [poi.GetCounty.GetName]"
 travelogue_name_5: "Aventures en [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_6: "Voyages en [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_7: "Terres lointaines"
 travelogue_name_8: "Aller-retour"
 travelogue_name_9: "Les [poi.GetCulture.GetCollectiveNounNoTooltip]"
 travelogue_name_10: "[poi.GetNameNoTooltip], [poi.GetTitle.Custom('BaronyTownType')|l] entourée de mystère"
 travelogue_name_11: "Les Mille"
 travelogue_name_12: "Les voyages"
 travelogue_name_13: "Le voyage"
 travelogue_name_14: "Aventure de [author.GetFirstNameNoTooltip]"
 travelogue_topic_customs: "coutumes"
 travelogue_topic_markets: "marchés"
 travelogue_topic_places: "lieux"
 travelogue_description_quality_weak: "Ce livre est mal écrit et relève du domaine de l’imaginaire."
 travelogue_description_quality_mid: "Ce livre contient plusieurs passages très instructifs."
 travelogue_description_quality_great: "Ce livre captivant est brillamment écrit."
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$ : [Select_CString(visitor.IsFemale,'une visiteuse curieuse','un visiteur curieux')]"
 gdp_merchant.8021.suzerain: "[Select_CString(visitor.IsFemale,'Ma protectrice','Mon protecteur')] [visitor.Custom('FR_le_Char_Pi')][visitor.GetTitledFirstName] me fait un grand honneur en faisant halte"
 gdp_merchant.8021.merchant: "[visitor.Custom('FR_le_Char_Pi')|U][visitor.GetTitledFirstName], marchand[visitor.Custom('FR_E')] et propriétaire de [visitor.GetPrimaryTitle.GetName], fait halte"
 gdp_merchant.8021.laamp: "[visitor.Custom('FR_le_Char_Pi')|U][visitor.GetTitledFirstName], chef d’un groupe de voyageurs appelé [visitor.GetPrimaryTitle.GetName], fait halte"
 gdp_merchant.8021.ruler: "[visitor.Custom('FR_le_Char_Pi')|U][visitor.GetTitledFirstName], [Select_CString(visitor.IsFemale,'une dirigeante locale','un dirigeant local')], me réserve une agréable surprise en faisant halte"
 gdp_merchant.8021.fallback: "[visitor.Custom('FR_le_Char_Pi')|U][visitor.GetTitledFirstName], un[visitor.Custom('FR_E')] humble [Select_CString(visitor.IsFemale,'voyageuse','voyageur')], fait halte"
 gdp_merchant.8021.desc: "à ma résidence.\n\n[visitor.Custom('FR_IlElle')|U] rayonne en apercevant notre collection et est saisi[visitor.Custom('FR_E')] d’émerveillement.\n\n« Salutations, [ROOT.Char.GetTitledFirstNameNoTooltip] ! J’ai entendu parler des exploits de votre compagnie et de votre collection exotique... Me feriez-vous le plaisir de me raconter une hist... » [visitor.Custom('FR_IlElle')|U] retient son souffle et est attiré[visitor.Custom('FR_E')] par notre [artifact.GetName].\n\n« Oh ! Mais qu’avons-nous là... »"
 gdp_merchant.8021.curio: "[visitor.Custom('FR_IlElle')|U] l’examine sous tous les angles, bien décidé[visitor.Custom('FR_E')] à connaître toute son histoire."
 gdp_merchant.8021.library: "[visitor.Custom('FR_IlElle')|U] feuillette prudemment les pages tout en posant d’innombrables questions."
 gdp_merchant.8021.creature: "[visitor.Custom('FR_IlElle')|U] admire sa grâce et observe avec joie le moment où on le nourrit."
 gdp_merchant.8021.a: "Oui, c’est vraiment quelque chose."
 gdp_merchant.8021.b: "Voudriez-vous l’acheter ?"
 gdp_merchant.9021.opening: "Salutations [merchant.GetTitledFirstNameNoTooltip],"
 gdp_merchant.9021.diarch.desc: "En tant que [commissioner.GetDiarchTitle|l] [commissioner.Custom('FR_du_Char_Pi')][commissioner.GetTitledFirstName], je souhaite faire appel aux services de [merchant.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant.9021.no_diarch.desc: "Je souhaite faire appel aux services de [merchant.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant.9021.desc: "\n\nIl y a une pénurie de [target.GetName|l] sur le [trade_market.GetName|l]. Acheminez des marchandises dans la région, et vous serez rémunérés à votre juste valeur."
 gdp_merchant.9021.a: "Votre commande est acceptée."
 gdp_merchant.9021.b: "Je dois décliner poliment cette proposition."
 gdp_merchant.9021.b.cooldown_tt: "Vous ne recevrez plus de [commission|El] pendant #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! ans"
 gdp_merchant.9005.t: "Mis à la porte"
 gdp_merchant.9005.desc_intro: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('courtier'))] [courtier.Custom('FR_le_Char_Pi')][courtier.GetTitledFirstName] fait irruption, le visage rouge, dans les bureaux de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip].\n\n« J’apporte un message de notre mécène, [expeller.Custom('FR_le_Char_Pi')][expeller.GetTitledFirstName] », dit-[courtier.Custom('FR_IlElle')]. « Notre compagnie met immédiatement fin à ses activités à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. »\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.Custom('FR_le_Char_Pi')|U][expeller.GetTitledFirstName] a ordonné à [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] de quitter [expeller.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "La confiance que [expeller.Custom('FR_le_Char_Pi')][expeller.GetTitledFirstNameNoTooltip] nous accorde s’est érodée."
 gdp_merchant.9005.desc_body.enemies: "L’hostilité [expeller.Custom('FR_du_Char_Pi')][expeller.GetTitledFirstNameNoTooltip] n’a-t-elle donc aucune limite ?"
 gdp_merchant.9005.desc_body.fallback: "Après tout ce que nous avons fait ici..."
 gdp_merchant.9005.a: "Et voilà où on en est."
 gdp_merchant.9005.a.tt: "Votre [company|El] quittera le [realm|El] [expeller.Custom('FR_du_Char_U_Pi')][expeller.GetShortUIName]"
 gdp_merchant.9100.t: "La Maison patricienne [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9100.desc: "Après avoir fait nos preuves auprès des familles les plus hautaines de [new_patrician_liege.GetPrimaryTitle.GetNameNoTier] et avoir fait des offres appropriées [new_patrician_liege.Custom('FR_au_Char_Pi')][new_patrician_liege.GetTitledFirstName], ma demande visant à ce qu’elles nous élèvent au rang de patriciens est vouée à aboutir.\n\nJe dispose enfin des documents qui confirment sans l’ombre d’un doute que [ROOT.Char.GetHouse.GetBaseName] n’est pas une simple maison marchande, mais qu’elle siège aux côtés des autres familles patriciennes estimées à l’assemblée de ce [new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], sur un pied d’égalité même avec les [new_patrician_liege.GetHouse.GetBaseName] devant la loi !"
 gdp_merchant.9100.a: "J’attends avec impatience ma première séance à l’Assemblée."
 merchant_patrician_transition_domicile_tt: "Vos [domicile_buildings|El] ont été conservés"
 gdp_merchant.9110.t: "La Maison marchande [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9110.desc: "Avec la destruction de l’ancienne république, les [ROOT.Char.GetHouse.GetBaseName] et autres familles patriciennes fières de [new_merchant_location.GetBaronyNameExplicitly] ont été réduites à de simples maisons marchandes, soumises aux caprices de la fortune et du dirigeant local, en l’occurrence [ROOT.Char.GetSuzerain.Custom('FR_le_Char_Pi')][ROOT.Char.GetSuzerain.GetTitledFirstName].\n\nPrivés de notre assemblée et de la protection de notre république, nous devons placer notre confiance dans les lois de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier] si nous voulons conserver un semblant de notre prestige d’antan."
 gdp_merchant.9110.a: "Comment en sommes-nous arrivés là ?"
 broke_deal_opinion: "Accord rompu"
 gdp_repudiated_my_loan_opinion: "A refusé mon prêt"
 gdp_interest_free_loan_opinion: "Prêt sans intérêts"
 gdp_usurious_loan_opinion: "M’a prêté de l’argent à un taux d’usure"
 gdp_merchant_unity_intermarriage_desc: "Mariage dans une autre [house|E] [Concept('merchant', 'marchande')|E]"
 gdp_merchant_unity_noble_marriage_desc: "Mariage dans une [house|E] noble"
 gdp_merchant.2000.t: "Marché désert : [needed_good.GetNameNoTooltip|l]"
 gdp_merchant.2000.desc.intro: "Alors que je marche à travers les rues "
 gdp_merchant.2000.desc.disaster: "sinistrées "
 gdp_merchant.2000.desc.war: "ravagées par la guerre "
 gdp_merchant.2000.desc.plague: "infestées par la maladie "
 gdp_merchant.2000.desc.unrest: "agitées "
 gdp_merchant.2000.desc.stalls: "de [starving_province.GetNameNoTooltip], je remarque que le [starving_province.Custom('GetRegionalMarketTermGloss')] habituellement bruyant est désormais plongé dans le silence.\n\nLes étals de nourriture sont presque vides, à l’exception de quelques [ROOT.Char.Custom('GetLocalStreetFoodPlural')] qui dégagent une odeur rance et [ROOT.Char.Custom('RegionalRootVegetablePlural')] à l’aspect putride. Des gens décharnés fouillent dans les tas d’ordures qui bordent les rues."
 gdp_merchant.2000.a: "Je devrais prendre tout ce qui reste."
 gdp_merchant.2000.b: "Les gens vont vouloir quelqu’un à blâmer."
 gdp_merchant.2000.c: "Ce n’est pas mon problème."
 gdp_merchant.2010.t: "Monopole en [craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip|l] :"
 gdp_merchant.2010.t.smith: "[Select_CString(craftsman.IsFemale,'La forgeronne','Le forgeron')]"
 gdp_merchant.2010.t.goldsmith: "L’orfèvre"
 gdp_merchant.2010.t.carpenter: "[Select_CString(craftsman.IsFemale,'La charpentière','Le charpentier')]"
 gdp_merchant.2010.t.tanner: "[Select_CString(craftsman.IsFemale,'La tanneuse','Le tanneur')]"
 gdp_merchant.2010.t.potter: "[Select_CString(craftsman.IsFemale,'La potière','Le potier')]"
 gdp_merchant.2010.desc.intro: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName] n’a pas arrêté de parler d’[Select_CString(craftsman.IsFemale,'une artisane','un artisan')] hors pair, [craftsman.GetFirstName], originaire de [workshop_province.GetName]. À présent que j’admire son œuvre, je comprends tout cet enthousiasme.\n\n[craftsman.GetFirstNameNoTooltip] m’accueille sans lever les yeux de son travail. « Je vous invite à regarder mes créations. »\n\nJe suis émerveillé[ROOT.Char.Custom('FR_E')] par"
 gdp_merchant.2010.desc.weapon: "une arme magnifique."
 gdp_merchant.2010.desc.chalice: "un calice finement ouvragé."
 gdp_merchant.2010.desc.box: "une boîte en bois finement sculptée."
 gdp_merchant.2010.desc.saddle: "une selle aux formes parfaites."
 gdp_merchant.2010.desc.vase: "un vase en céramique finement peint."
 gdp_merchant.2010.desc.craftsmanship: "Ce n’est pas un savoir-faire artisanal ordinaire."
 gdp_merchant.2010.a: "Un talent comme celui-ci ne devrait pas être gâché."
 gdp_merchant.2010.b: "Peut-être pourriez-vous apprendre une chose ou deux à [associate.GetFirstNameNoTooltip]."
 gdp_merchant.2010.c: "J’aimerais bien rester pour observer votre travail."
 gdp_merchant.2015.t: "Le prix de [counsel_good.GetNameNoTooltip|l]"
 gdp_merchant.2015.desc: "J’ai reçu une convocation inattendue de la part de [Select_CString(patron.IsFemale,'ma protectrice','mon protecteur')], [patron.Custom('FR_le_Char_Pi')][patron.GetTitledFirstName]. J’entre dans la salle du trône avec une certaine appréhension.\n\n« [ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip], accordez-moi cette faveur : que pouvez-vous me dire sur les qualités et la valeur marchande de [counsel_good.GetNameNoTooltip|l] ? »"
 gdp_merchant.2015.a: "« Il se trouve que je suis [Select_CString(ROOT.Char.IsFemale,'une experte','un expert')] en la matière. »"
 gdp_merchant.2015.a.tt: "Vous devez avoir au moins #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! en [expertise_level|El] dans la [trade_category_short|El] [counsel_category.GetName]"
 gdp_merchant.2015.b: "« Je m’y connais peut-être un peu... »"
 gdp_merchant.2015.a.monopoly.tt: "Acceptation de [trade_monopoly|El][monopoly_i] : [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip] vous considère comme une référence"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip] découvre que vous mentez"
 gdp_merchant.2015.b.monopoly.tt: "Acceptation de [trade_monopoly|El][monopoly_i] : [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "« Ma vie ne devrait pas se résumer au commerce. »"
 gdp_merchant.2020.t: "Une place à table"
 gdp_merchant.2020.desc: "J’ai l’honneur de dîner dans le [patron.GetCapitalLocation.GetHolding.GetType.GetName|l] de [Select_CString(patron.IsFemale,'ma protectrice','mon protecteur')], [patron.Custom('FR_le_Char_Pi')][patron.GetTitledFirstName], à [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. [courtier_1.Custom('FR_le_Char_Pi')|U][courtier_1.GetTitledFirstName], un[courtier_1.Custom('FR_E')] noble, me transperce du regard tandis que je gagne ma place. Ses murmures à l’adresse des autres convives sont presque inaudibles, mais je parviens à distinguer les mots « populace » et « pots-de-vin versés par [Select_CString(ROOT.Char.IsFemale,'une vulgaire colporteuse','un vulgaire colporteur')] ». Les voix se taisent lorsque [patron.GetFirstNameNoTooltip] se lève pour prendre la parole :\n\n« Fidèles compagnons de route, nouvelles connaissances et frères perdus de vue pendant trop longtemps, je vous ai réunis ici ce soir afin que vous puissiez goûter aux bienfaits de mon hospitalité. Alors, festoyons ! »"
 gdp_merchant.2020.a: "« Nous devrions faire cela plus souvent ! »"
 gdp_merchant.2020.a.feast.tt: "[patron.Custom('FR_le_Char_U_Pi')|U][patron.GetShortUIName] commencera un [GetActivityType('activity_feast').GetName|l][GetActivityType('activity_feast').GetTextIcon] dès que possible #weak (dans un délai de 1 à 3 mois)#!"
 gdp_merchant.2020.b: "La maison [ROOT.Char.GetHouse.GetBaseNameNoTooltip] aura la reconnaissance que nous méritons."
 gdp_merchant.2020.b.unity_gain.desc: "revendication d’une place parmi la noblesse au nom de notre Maison"
 gdp_merchant.2020.c: "« Bien dit, et maintenant, parlons affaires ! »"
 gdp_merchant.2020.c.unity_loss.desc: "se concentre sur ce qui compte vraiment : les affaires"
 gdp_merchant.2025.t: "[Select_CString(ROOT.Char.IsFemale,'La petite marchande','Le petit marchand')]"
 gdp_merchant.2025.desc: "[charter_rival.Custom('FR_le_Char_Pi')|U][charter_rival.GetTitledFirstName] brille, comme à son habitude, par son absence dès qu’il est question de remplir son devoir. M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('patron'))] [patron.Custom('FR_le_Char_Pi')][patron.GetTitledFirstName] et moi-même attendons patiemment son arrivée, jusqu’à ce que nous décidions d’examiner les registres de ce mois sans [charter_rival.Custom('FR_LuiElle')].\n\nDes accords commerciaux dont la validité reste à confirmer sont encore éparpillés sur la table lorsque [patron.GetFirstNameNoTooltip] balaie les parchemins d’un revers de la main et reporte son attention sur moi :\n\n« [ROOT.Char.GetFirstNameNoTooltip], entre nous, que pensez-vous vraiment de [charter_rival.GetFirstNameNoTooltip] ? Ai-je pris la bonne décision en lui accordant ma charte ? »"
 gdp_merchant.2025.a: "« Peut-être que ce serait plus utile entre mes mains ? »"
 gdp_merchant.2025.a.charter.tt: "Acceptation de la [Concept('request_merchant_charter', 'demande de charte marchande')|El][charter_i] : [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "« Je me fie à votre jugement avisé, [patron.Custom('FormOfAddressForLiege')] »"
 gdp_merchant.2025.b.unity_gain.desc: "nous avons montré au mécène que nous avions confiance en son jugement"
 gdp_merchant.4000.t: "Notre place à l’écart du chemin"
 gdp_merchant.4000.desc.intro: "J’entre sur le marché de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] et découvre que mes vendeurs ont été relégués dans une ruelle reculée, leurs étals enfoncés dans la boue d’une porcherie voisine.\n\n"
 gdp_merchant.4000.desc.patron: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('market_character'))]"
 gdp_merchant.4000.desc.patron_representative: "[patron.Custom2('FR_RelationToMeShort_Le', SCOPE.sC('market_character'))|U] [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstName], [market_character.Custom('FR_le_Char_Pi')][market_character.GetTitledFirstName],"
 gdp_merchant.4000.desc.body: "se tient à bonne distance, au vent, un sourire narquois aux lèvres, tandis qu’[market_character.Custom('FR_IlElle')] regarde mes associés m’accabler de récriminations.\n\nLorsque je m’approche d[market_character.Custom('FR_EluiElle')], [market_character.Custom('FR_IlElle')] me lance :"
 gdp_merchant.4000.desc.body.patron: "« Un emplacement tout indiqué pour faire des affaires, n’est-ce pas ? », dit-[market_character.Custom('FR_IlElle')] en désignant les cochons."
 gdp_merchant.4000.desc.body.patron_representative: "« Je suis ici au nom de votre [Select_CString(patron.IsFemale,'protectrice','protecteur')]. » À en juger par la façon dont [market_character.Custom('FR_IlElle')] relève le menton et par l’éclat de son regard, ce message lui procure une grande joie."
 gdp_merchant.4000.desc.outro: "« Vous ne respectez pas nos coutumes et ne prêtez jamais l’oreille à la parole de [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]. Tant que vous ne vous y conformerez pas, c’est ici que sera votre place. »"
 gdp_merchant.4000.b: "Je devrais me renseigner sur la Voie."
 gdp_merchant.4000.b.tt: "Votre prochain [GetActivityType('activity_adult_education').GetName|l] coûtera #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#! d’[gold|El] de moins si vous l’organisez dans un centre d’[GetTrait('confucian_education').GetName(GetNullCharacter)|l]"
 gdp_merchant.4000.c: "Je vais leur montrer..."
 gdp_merchant.4010.t: "Les portes du savoir"
 gdp_merchant.4010.desc: "Je savoure un thé après une longue journée passée au marché. De temps à autre, je surprends [Select_CString(student.IsFemale,'une érudite','un érudit')] du coin en train de me jeter des regards intrigués.\n\n« [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], quelle bande de gens méprisants », l’entends-je marmonner à son ami. « Ils se croient supérieurs à nous, qui observons les rites comme il se doit. Nous avons passé nos examens avec tout le sérieux requis. Et à part exploiter autrui, qu’a donc accompli [ROOT.Char.GetFirstNameNoTooltip] dans sa vie ? »"
 gdp_merchant.4010.a: "Cet examen ne devrait pas être trop difficile."
 gdp_merchant.4010.b: "« Et de qui vient le thé que vous buvez ? »"
 gdp_merchant.4010.c: "« Et quel commerce cet endroit peut-il se permettre de perdre ? »"
 gdp_merchant.4020.t: "Route de la Soie"
 gdp_merchant.4020.desc: "J’entre dans [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] et suis happé[ROOT.Char.Custom('FR_E')] par une foule de personnes et d’animaux qui déborde par les portes [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')] pour rejoindre le cortège interminable des caravanes. Ici, les dromadaires sont aussi grands que des éléphants en raison de l’abondance de leur chargement, qui se balance d’un côté à l’autre.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "Aux quatre coins du marché, des commerçants déchargent des quantités de marchandises impressionnantes.\n\nJe vois des étals où la nourriture est jetée sur le côté, car la production est telle qu’il est tout simplement impossible de tout vendre avant qu’elle ne se gâte."
 gdp_merchant.4020.desc.steady_trading: "Je n’avais jamais vu autant d’abondance en un seul endroit. Il y a ici tant de monde que nous formons une foule bruyante, réduite à une seule entité.\n\nQuand une caravane vacille, il y a toujours un maître prêt à faire claquer le fouet."
 gdp_merchant.4020.desc.hardship: "D’après ce que je parviens à comprendre au fil de conversations décousues dans des langues étrangères, ce marché traverse une période difficile.\n\nÀ son apogée, ce marché devait regorger de marchandises en quantités phénoménales..."
 gdp_merchant.4020.a: "C’est la voie vers l’avenir."
 gdp_merchant.4030.t: "Fortunes lointaines"
 gdp_merchant.4030.desc.intro: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName] entre dans le bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], les yeux aussi brillants que s’ils contemplaient un tas d’or.\n\n[associate.Custom('FR_IlElle')|U] me tend une boîte. À l’intérieur, je découvre"
 gdp_merchant.4030.desc.silk: "la plus belle soie qu’il m’ait jamais été donné de voir, fine comme un souffle et d’une légèreté irréelle.\n\n"
 gdp_merchant.4030.desc.spice: "une poudre parfumée, fraîchement moulue.\n\n« Cela s’appelle \"[rumoured_market_owner.Custom('RegionalSpice')]\" », dit-[associate.Custom('FR_IlElle')]."
 gdp_merchant.4030.desc.jade: "une pierre de jade, si bien polie que sa surface est lisse comme du verre.\n\n"
 gdp_merchant.4030.desc.ivory: "une citadelle miniature en ivoire.\n\n"
 gdp_merchant.4030.desc.outro: "« J’ai acheté ceci à un marchand qui m’a parlé de ses contacts [rumoured_market_owner.GetCulture.GetCollectiveNounNoTooltip|l] de la Route de la Soie. L’or que nous gagnons ici à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] n’est rien comparé à ce que l’on trouve dans les [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')] de [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip] »"
 gdp_merchant.4030.a: "« La Route de la Soie, dites-vous ? »"
 gdp_merchant_4030_a_tt: "Si vous installez votre [company|El] sur le [rumoured_market.GetName|l] d’ici #V 5#! ans, vous gagnerez [GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip] dans ce [market|El] pendant #V 10 ans#!"
 gdp_merchant.4030.b: "« Merci pour ce cadeau attentionné ! »"
 gdp_merchant.4030.c: "« Nous faisons des affaires importantes ici, [associate.GetFirstNameNoTooltip]. »"
 merchant_unity_local_business: "a priorisé les affaires locales à la [silk_road|El]"
 gdp_merchant.4030.artifact.silk: "Soie de [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant.4030.artifact.silk.desc: "Des échantillons de soie aussi fine qu’un souffle, rapportés des marchés de la Route de la Soie, d’une légèreté incroyable et au toucher lisse."
 gdp_merchant.4030.artifact.spice: "Sachet à épices"
 gdp_merchant.4030.artifact.spice.desc: "Un petit sachet d'épices odorantes rapporté des marchés de la Route de la Soie."
 gdp_merchant.4030.artifact.jade: "Pierre de jade polie"
 gdp_merchant.4030.artifact.jade.desc: "Une pierre de jade provenant des marchés de la Route de la Soie, polie jusqu’à ce que sa surface soit aussi lisse que du verre."
 gdp_merchant.4030.artifact.ivory: "Citadelle d’ivoire"
 gdp_merchant.4030.artifact.ivory.desc: "Une œuvre en ivoire provenant des marchés de la Route de la Soie, minutieusement sculptée en forme de citadelle miniature."
 gdp_merchant.5000.t: "Intérêts révélés"
 gdp_merchant.5000.desc.debtor: "La porte du bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] s’ouvre brusquement et m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('accuser'))] [accuser.GetFirstName] entre, accompagné[accuser.Custom('FR_E')] de mes associés."
 gdp_merchant.5000.desc.debtor_paranoid: "Un grincement de porte est la seule chose qui annonce l’arrivée de m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('accuser'))] [accuser.GetFirstName], qui entre doucement dans le bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 gdp_merchant.5000.desc.bishop: "Des silhouettes encapuchonnées assombrissent le seuil de la porte de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Il ne faut pas longtemps avant que [accuser.Custom('FR_LeLa')] [accuser.Custom('GetActualBishopTitle')|l] [accuser.GetFirstName] se retrouve face à moi, conduit[accuser.Custom('FR_E')] par mes propres associés."
 gdp_merchant.5000.desc.clergy: "Des silhouettes encapuchonnées assombrissent le seuil de la porte de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Il ne faut pas longtemps avant que [accuser.Custom('FR_LeLa')] [accuser.Custom('PriestTitle')] [accuser.GetFirstName] se retrouve face à moi, conduit[accuser.Custom('FR_E')] par mes propres associés."
 gdp_merchant.5000.desc.steward: "La porte du bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] s’ouvre brusquement. [debtor.Custom2('FR_RelationToMeShort_Le', SCOPE.sC('accuser'))|U] de [debtor.GetFirstName] entre, accompagné[accuser.Custom('FR_E')] de mes propres associés."
 gdp_merchant.5000.desc.break: "\n\n« [ROOT.Char.GetTitledFirstNameNoTooltip], il semble y avoir une anomalie concernant le prêt accordé à [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'moi', debtor.GetTitledFirstName )] », dit-[accuser.Custom('FR_IlElle')]."
 gdp_merchant.5000.desc.accepted: "« Je n’apprécie guère que l’on me mente. Montrez-moi les livres comptables de votre compagnie et mettons les choses au clair. »"
 gdp_merchant.5000.desc.discouraged.debtor: "« Vous savez que [accuser.GetFaith.Custom('HouseOfWorshipBase')] désapprouve l’usure. Réglons cela maintenant et cela n’ira pas plus loin. »"
 gdp_merchant.5000.desc.shunned.debtor: "« Dès que les [accuser.Custom('DefaultPriestTitlePlural')] l’apprendront, ils s’en prendront violemment à vous et à votre commerce. Je suis ici pour vous offrir une chance de vous sauver. »"
 gdp_merchant.5000.desc.accepted.steward: "« Votre protecteur n’apprécie guère qu’on lui mente. Montrez-moi les livres comptables de votre compagnie et nous corrigerons les chiffres. »"
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "« En tant que marchand[ROOT.Char.Custom('FR_E')], vous devez bien comprendre qu’on n’obtient rien sans rien. Et pourtant... Eh bien, nous espérons que cette affaire sera bientôt résolue en toute discrétion, afin d’éviter que votre commerce ne pâtisse de cette erreur. »"
 gdp_merchant.5000.desc.shunned: "« La façon dont vous avez mené votre activité est méprisable. En tant que marchand[ROOT.Char.Custom('FR_E')], vous osez vendre quelque chose qui n’existe pas ? Cette affaire sera portée devant les tribunaux, à moins que vous ne demandiez pardon. »"
 gdp_merchant.5000.a: "« Peut-être ne savez-vous pas que j’agis au nom [ROOT.Char.GetSuzerain.Custom('FR_du_Char_Pi')][ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] ? »"
 gdp_merchant.5000.a.debtor: "« Vous ne voudriez tout de même pas nuire à notre commerce ? »"
 gdp_merchant.5000.b: "« Vous pouvez prendre nos biens en échange. »"
 gdp_merchant.5000.c: "« Tenez, regardons les petits caractères. »"
 gdp_merchant.5000.c.success: "Vos comptes sont immaculés"
 gdp_merchant.5000.c.failure: "Les chiffres sont approximatifs"
 gdp_merchant.5000.c.critical: "Les intérêts sont mal dissimulés"
 gdp_merchant.5000.d: "« J’imagine que je pourrais céder les intérêts... »"
 gdp_merchant.5000.e: "« Considérez le prêt comme oublié. »"
 gdp_usury_penance_seized_goods_modifier: "Caravanes saisies"
 gdp_usury_penance_seized_goods_modifier_desc: "Le commerce de ce personnage souffre de la découverte de ses prêts à taux d'intérêt dissimulés."
 gdp_usury_penance_same_faith_scandal_modifier: "Usurier connu"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "Ce personnage subit les conséquences de ses pratiques sournoises."
 gdp_usury_penance_forgive_interest_tt: "Les [interest|El] déguisés sont pardonnés #weak ([TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] doit $VALUE|0V$ [gold_i|E])#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "Le [loan|El] déguisé reste en place."
 gdp_merchant.5010.t: "Les petits caractères"
 gdp_merchant.5010.desc: "On m’a informé[ROOT.Char.Custom('FR_E')] que [Select_CString(lender.IsFemale,'ma créancière','mon créancier')] [lender.GetFirstName] n’a pas été complètement honnête dans le règlement de mon prêt.\n\nEn analysant les chiffres, je remarque que des clauses en petits caractères font mention d’une somme supérieure à celle que nous avions convenue initialement.\n\nL’écart saute aux yeux, si jamais je souhaite y donner suite."
 gdp_merchant.5010.a: "Garder le secret."
 gdp_merchant.5010.b: "[lender.Custom('FR_IlElle')|U] me remboursera les intérêts."
 gdp_merchant.5010.b.wipe: "[lender.Custom('FR_IlElle')|U] ne recevra aucun intérêt."
 gdp_merchant.5010.c: "Rejeter le prêt."
 gdp_usury_debtor_discover_interest_tt: "Les [interest|El] dissimulés sont #weak ($VALUE|0V$ [gold_i|E])#!"
 gdp_usury_debtor_keep_secret_tt: "Les [interest|El] déguisés restent secrets"
 gdp_usury_debtor_demand_repayment_tt: "Exiger le remboursement des [interest|El] dissimulés"
 gdp_usury_debtor_inform_creditor_tt: "Une lettre est envoyée [lender.Custom('FR_au_Char_U_Pi')][lender.GetShortUINameNoTooltip]"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ J’exige que les intérêts dissimulés soient remboursés sur-le-champ. N’essayez même pas de me flouer à nouveau."
 gdp_merchant.5020.a: "C’est bien dommage."
 gdp_merchant.5020.a.tt: "Intérêts dissimulés remboursés"
 gdp_usury_penance_interest_paid_back_tt: "Les [interest|El] dissimulés ne sont plus dus"
 gdp_merchant.5020.desc_intro: "J’ai bien examiné notre contrat de prêt, et il est évident que vous avez essayé de m’escroquer !"
 gdp_usury_debtor_kept_secret_message: "Secret gardé"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.Custom('FR_le_Char_Pi')|U][debtor.GetTitledFirstName] est au courant des [interest|El] cachés et gardera le secret."
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "Considérez ce prêt comme nul et non avenu. J’y réfléchirai à deux fois la prochaine fois que vous me proposerez quelque chose."
 gdp_merchant.5040.a: "Quel toupet !"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "C’est difficile à écrire et à admettre, mais je dois bien avouer que j’ai de plus en plus de mal à supporter les désagréments de la route et les disputes incessantes sur les marchés.\n\nPourriez-vous demander à la compagnie de rentrer, au moins pour un certain temps ?"
 gdp_merchant.0060.a: "S’il le faut."
 gdp_merchant.0060.a.tt: "Vous promettez de prendre la décision de [GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName|l] dans les 2 ans."
 gdp_merchant.0060.b: "Vous allez devoir faire avec."
 gdp_merchant.0060.b.tt: "[associate.Custom('FR_le_Char_U_Pi')|U][associate.GetShortUIName] a #N [associate.GetStress|0]#! de [stress|El][stress_i]. [associate.Custom('FR_IlElle')|U] continuera à accumuler du stress si d’autres [schemes|El] échouent sur son parcours."
