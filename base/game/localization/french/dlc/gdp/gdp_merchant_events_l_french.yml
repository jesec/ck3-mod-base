l_french:
 gdp_merchant.0001.t: "Un chemin pavé d’or"
 gdp_merchant.0001.desc: "J’entre au marché local en [ROOT.Char.GetWomanMan] libre. Les cris des marchands résonnent à chaque coin de rue, se mêlant aux coups et au grondement du métal provenant des ateliers environnants. Partout où je pose le regard, j’aperçois des charrettes chargées de caisses [ROOT.Char.Custom('RegionalDrink')], de rouleaux de [ROOT.Char.Custom('RegionalFabric')] et de cages à oiseaux qui vont et viennent.\n\nC’est ici que je bâtirai ma dynastie."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "Quelle devrait être ma première affaire ?"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "Après mûre réflexion, j’ai décidé de me lancer dans une carrière de marchand. Je suis dans la fleur de l’âge et mon envie de voyager à l’étranger me pousse à passer à l’action. J’espère qu’un jour, nous entretiendrons une relation d’affaires qui sera profitable à nous deux. Je confie le pays de [old_primary_title.GetBaseNameNoTierNoTooltip] à vos mains expertes."
 gdp_merchant.0002.a: "Une tournure intéressante des événements."
 gdp_merchant.0010.t: "Affaires de famille"
 gdp_merchant.0010.desc: "Après avoir reporté la réunion de famille prévue aujourd’hui, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))], [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstName], me fait signe de [associate.Custom('FR_LeLa')] rejoindre, le regard déterminé.\n\n« Oh m[associate.Custom2('FR_RelationToMeShort_OnA', ROOT.Char)] ! »"
 gdp_merchant.0010.desc.starting: "« Je fais partie de cette compagnie depuis sa création »,"
 gdp_merchant.0010.desc.starting_fallback: "« Cela fait déjà un certain temps que je travaille pour cette famille »,"
 gdp_merchant.0010.desc.cont: "dit-[associate.Custom('FR_IlElle')] en choisissant soigneusement ses mots."
 gdp_merchant.0010.desc.children: "« Et comme votre [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] n’est pas encore majeur[heir.Custom('FR_E')],"
 gdp_merchant.0010.desc.no_children: "« Et comme vous n’avez pas d’enfant majeur,"
 gdp_merchant.0010.desc.outro: "j’espérais que vous m’adopteriez. Ce serait un honneur pour moi de représenter la famille en tant que membre du foyer. »"
 gdp_merchant.0010.a: "« Je vous ai toujours considéré[associate.Custom('FR_E')] comme l’un[associate.Custom('FR_E')] des nôtres. »"
 merchant_adoption_event_tt: "[associate.Custom('FR_le_Char_U_Pi')|U][associate.GetShortUIName] rejoint votre [house|E]"
 merchant_unity_adoption_loss: "Associé accueilli dans la [house|E]"
 gdp_merchant.0010.b: "« Vous n’avez pas encore prouvé que vous étiez utile. »"
 gdp_merchant.0010.c: "« Je reviendrai vers vous à ce sujet. »"
 gdp_merchant.0015.t: "Une image professionnelle"
 gdp_merchant.0015.desc: "Avec la création de la [trade_route.GetNameNoTooltip], notre stratégie commerciale est désormais claire.\n\nJe dois toutefois encore choisir une personne qui pourrait incarner notre nouvelle affaire. M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('courtier_1'))], [courtier_1.Custom('FR_le_Char_Pi')][courtier_1.GetTitledFirstName],"
 gdp_merchant.0015.desc_good_intellect: "a un bon sens certain. Qui sait, [courtier_1.Custom('FR_IlElle')] pourrait bien nous surprendre avec quelques talents cachés."
 gdp_merchant.0015.desc_excellent_intellect: "est d’une intelligence exceptionnelle. On imagine facilement qu’[courtier_1.Custom('FR_IlElle')] fera honneur à sa famille."
 gdp_merchant.0015.desc_poor_intellect: "a peu d’intelligence. Peut-être que cette occasion pourrait [courtier_1.Custom('FR_LeLa')] pousser à se dépasser pour améliorer ses compétences."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip] pourrait être la personne pour cette tâche..."
 gdp_merchant.0015.b: "... mais [courtier_2.GetFirstNameNoTooltip] pourrait mieux convenir."
 gdp_merchant.0015.c: "Je dois garder mes collaborateurs les plus compétents près de moi."
 gdp_merchant.0015.c.fallback: "Non. J’ai besoin de tout le monde ici."
 gdp_merchant.0015.c.tt: "Vous démarrez votre [trade_route|El] sans qu’un [trader|El] ne soit assigné"
 gdp_merchant.0020.t: "Un associé"
 gdp_merchant.0020.desc: "Le chef de l’entreprise familiale ne vaut que par le cou qui oriente son regard vers de nouvelles perspectives."
 gdp_merchant.0020.desc.partner_exists: "C’est mon associé[old_holder.Custom('FR_E')] [old_holder.GetFirstName] qui aurait dû s’occuper de cette tâche, mais [old_holder.Custom('FR_IlElle')] n’a cessé de gaspiller notre temps et notre or dans des activités inutiles."
 gdp_merchant.0020.desc.fallback: "Pour l’instant, je n’emploie personne pour occuper ce poste et assumer ce rôle à mes côtés en tant qu’associé."
 gdp_merchant.0020.desc.body: "La tension au sein de la compagnie est palpable et pousse tous ceux qui ont ne serait-ce qu’un soupçon d’ambition à se disputer et à vouloir se démarquer.\n\n"
 gdp_merchant.0020.desc.outro_three: "Parmi eux figurent [candidate_2.Custom('FR_le_Char_Pi')][candidate_2.GetTitledFirstName] et [candidate_3.Custom('FR_le_Char_Pi')][candidate_3.GetTitledFirstName], qui invoquent tous deux leur loyauté inébranlable pour obtenir une place à cette table.\n\n[candidate_2.Custom2('FR_IlsElles', SCOPE.sC('candidate_3'))|U] sont [Select_CString(And(candidate_2.IsFemale, candidate_3.IsFemale), 'prêtes', 'prêts')] à tout pour écarter [candidate_1.Custom('FR_le_Char_Pi')][candidate_1.GetTitledFirstName], qui leur est clairement supérieur[candidate_1.Custom('FR_E')]."
 gdp_merchant.0020.desc.outro_two: "Parmi eux se trouve [candidate_2.Custom('FR_le_Char_Pi')][candidate_2.GetTitledFirstName], qui invoque sa loyauté inébranlable pour obtenir une place à cette table.\n\n[candidate_2.Custom('FR_IlElle')|U] est prêt[candidate_2.Custom('FR_E')] à tout pour écarter [candidate_1.Custom('FR_le_Char_Pi')][candidate_1.GetTitledFirstName], qui lui est clairement supérieur[candidate_1.Custom('FR_E')]."
 gdp_merchant.0020.desc.outro_one: "Parmi eux se trouve [candidate_1.Custom('FR_le_Char_Pi')][candidate_1.GetTitledFirstName], qui invoque sa loyauté inébranlable pour obtenir une place à cette table.\n\n[candidate_1.Custom('FR_IlElle')|U] est prêt[candidate_1.Custom('FR_E')] à tout pour écarter ceux qui se dressent entre [candidate_1.Custom('FR_LuiElle')] et ce poste."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip] mérite une chance."
 gdp_merchant.0020.a.custom: "Chaque autre candidat"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip] devrait avoir cette chance."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip] est clairement [candidate_3.Custom('FR_LeLa')] plus méritant[candidate_3.Custom('FR_E')]."
 gdp_merchant.0020.d: "Ces personnes ont déjà des tâches dont elles doivent s’occuper..."
 gdp_merchant.0020.d.custom: "Chaque candidat"
 merchant_unity_partner_gain: "Membre de la Maison employé comme associé"
 merchant_unity_partner_loss: "Étranger employé comme associé"
 gdp_merchant.0025.t: "Artisans réputés"
 gdp_merchant.0025.desc: "« Salutations, [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip] », m’interpelle une voix inconnue depuis la tannerie voisine. Je me rapproche, en prenant soin de ne pas marcher dans la boue des cuves de teinture.\n\nJe me retrouve nez à nez avec... un animal mort ? [Select_CString(traveler.IsFemale,'Sa chasseuse','Son chasseur')] me sourit fièrement en me montrant son trophée.\n\n« [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|U] est réputée partout pour ses artisans experts. Vous savez donc que la qualité du produit que vous vendez dépend des matières premières disponibles. En tant que [Select_CString(traveler.IsFemale,'chasseuse','chasseur')], je gagne ma vie en dénichant les meilleurs matériaux pour des clients aussi distingués que vous. »"
 gdp_merchant.0025.a: "« Avez-vous déjà envisagé de développer votre activité à plus grande échelle ? »"
 gdp_merchant.0025.b: "« Je vous en prie, continuez... »"
 merchant_unity_artisan_recruit_loss: "Inconnu recruté"
 merchant_unity_artisan_recruit_decline_gain: "Familiarisé avec les matériaux de luxe"
 gdp_merchant.0030.t: "Une force à ne pas négliger"
 gdp_merchant.0030.desc: "« [ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstNameNoTooltip], regardez par ici ! », crie quelqu’un.\n\nJe me retourne et aperçois [Select_CString(traveler.IsFemale,'une forgeronne','un forgeron')] qui me fait signe depuis son atelier. En m’approchant [Select_CString(traveler.IsFemale,'d’elle','de lui')], je ne peux m’empêcher de remarquer comment son corps se contorsionne pour laisser le feu de la forge illuminer ses muscles...\n\n« J’ai attendu longtemps pour vous voir. Votre compagnie s’est forgée une réputation impressionnante en dominant vos concurrents et j’aimerais mettre mes poings au service de votre cause. Je peux casser des têtes, manier une épée, tout ce dont vous aurez besoin. »"
 gdp_merchant.0030.a: "« J’aime votre enthousiasme. »"
 gdp_merchant.0030.b: "« Euh... Montrez-moi d’autres exemples de votre travail. »"
 merchant_unity_creditor_recruit_loss: "Inconnu recruté"
 merchant_unity_creditor_recruit_decline_gain: "Flagorneur de la compagnie repoussé"
 gdp_merchant.0035.t: "Une réputation au-delà des frontières"
 gdp_merchant.0035.desc: "Un remue-ménage inhabituel détourne mon attention des livres de comptes que j’ai sous les yeux.\n\nEn sortant du bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], je tombe sur [Select_CString(traveler.IsFemale,'une marchande','un marchand')] au regard perçant, dont les vêtements sont couverts de la poussière des jours passés.\n\n« Salutations, [ROOT.Char.GetTitledFirstNameNoTooltip] », dit-[traveler.Custom('FR_IlElle')]. « Tous ceux que j’ai rencontrés sur la route connaissent votre nom et me disent que c’est vous que je dois voir. J’espérais que vous me permettriez de chevaucher en votre nom. »"
 gdp_merchant.0035.a: "« Eh bien, vous semblez tout à fait capable. »"
 gdp_merchant.0035.b: "« Je préférerai avoir des nouvelles du commerce lointain. »"
 merchant_unity_caravaneer_recruit_loss: "Inconnu recruté"
 merchant_unity_caravaneer_recruit_decline_gain: "Connaissances acquises sur les marchés lointains"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant.0101.desc_republic: "Les [ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')] étaient pessimistes, mais [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] a finalement accédé à notre demande et l’ambiance est désormais à la liesse ! Nous allons enfin avoir une ville qui n’appartient qu’à nous, une république que nous pourrons gouverner comme bon nous semble !\n\nJe serai [Select_CString(ROOT.Char.IsFemale,'la première','le premier')] [ROOT.Char.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetPrimaryTitle.GetName]"
 gdp_merchant.0101.liege: "et je gouvernerai [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] et ses environs en tant que ville assujettie, dépendante et redevable à parts égales envers l’autorité [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 gdp_merchant.0101.independent: "et je gouvernerai [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] et ses environs aux côtés des autres familles respectées, au nom du peuple."
 gdp_merchant.0101.republic: "\n\nAprès de nombreuses transactions et de nombreuses activités, la grande Maison [ROOT.Char.GetHouse.GetBaseNameNoTooltip] pourra finalement laisser un héritage durable..."
 gdp_merchant.0101.a: "Une nouvelle ère s’ouvre ici pour les habitants de [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip] !"
 gdp_merchant.0102.desc: "J’ai été très heureux d’apprendre que vous aviez accepté notre offre !\n\nL’or a été expédié, et nous allons maintenant nous atteler à la rédaction d’une charte pour [actor.GetPrimaryTitle.GetName],"
 gdp_merchant.0102.liege: "afin que vous les gouverniez comme de humbles sujets."
 gdp_merchant.0102.top_liege: "pour le régir sous [new_liege.Custom('FR_le_Char_Pi')|U][new_liege.GetTitledFirstName]."
 gdp_merchant.0102.independent: "et de la gouverner comme une ville indépendante."
 gdp_merchant.0103.desc: "Quelle proposition ridicule ! Pensez-vous sérieusement que mes titres soient à vendre ? Et qui plus est à une personne aussi insignifiante que vous ?!"
 gdp_merchant.0110.t: "$merge_company_interaction$ : [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "Après une longue discussion, [recipient.Custom('FR_le_Char_Pi')][recipient.GetTitledFirstName] ne peut cacher son intérêt pour ma généreuse proposition de fusionner nos deux compagnies et nos deux Maisons.\n\n[recipient.Custom('FR_IlElle')|U] acquiesce."
 gdp_merchant.0110.desc.personality.ai_honor: "« Il semble que je n’aie pas le choix dans cette affaire. Je respecterai néanmoins ma part du marché et servirai vos intérêts avec autant de dévouement que je sers les miens. »"
 gdp_merchant.0110.desc.personality.ai_zeal: "« Je crois que c’est [recipient.GetFaith.WealthGodName] qui nous a guidés sur cette voie. »"
 gdp_merchant.0110.desc.personality.ai_greed: "« J’ai examiné vos grands livres et les nôtres. Au vu de ces chiffres, je n’ai pas d’autre choix que d’accepter votre offre. »"
 gdp_merchant.0110.desc.personality.ai_compassion: "« J’ai discuté avec la compagnie et nous pensons que cette fusion de nos compagnies sera bénéfique pour nous tous. »"
 gdp_merchant.0110.desc.personality.ai_boldness: "« J’accepte votre proposition. Finies les tergiversations entre nous. »"
 gdp_merchant.0110.desc.personality.ai_rationality: "« J’ai mis en balance nos bénéfices et les coûts que représenterait pour nous le rejet de votre offre. J’accepte. »"
 gdp_merchant.0110.desc.personality.ai_vengefulness: "« Je dois l’admettre. Vous avez bien joué votre coup, et cette fois, vous l’emportez. »"
 gdp_merchant.0110.desc.personality.ai_energy: "« J’accepte. Demandez à vos employés de rédiger un contrat et envoyez-le-moi sans délai ! »"
 gdp_merchant.0110.desc.personality.ai_sociability: "« La compagnie [recipient.GetHouse.GetBaseNameNoTooltip] accepte vos conditions. Agir sous notre nom va me manquer, mais il ne serait pas sage de s’accrocher à notre fierté. »"
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "« Après mûre réflexion, j’accepte votre proposition visant à unir nos intérêts. »"
 gdp_merchant.0110.desc.closing: "\n\n« Comme convenu, nos routes commerciales ont été démantelées, et la Maison [recipient.GetHouse.GetBaseNameNoTooltip] sera désormais au service de votre compagnie. »"
 gdp_merchant.0110.a: "Les marchés de la Maison [recipient.GetHouse.GetBaseNameNoTooltip] sont les nôtres !"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "Vous oubliez qui vous êtes et l’importance de [actor.GetPrimaryTitle.GetNameNoTooltip]. [recipient.GetPrimaryTitle.GetNameNoTooltip] ne cédera jamais à vos intérêts mesquins."
 gdp_merchant.0111.a: "Ce projet s’est avéré mal conçu."
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "Des rumeurs circulent selon lesquelles le pays de [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] aurait un besoin urgent d’aide financière. Je pourrais régler cette situation... en échange d’une faveur, bien sûr."
 gdp_purpose_events.0001.a: "Ça pourrait être la solution pour moi..."
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName] examinera votre proposition."
 gdp_purpose_events.0001.b: "Quelle effronterie !"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "En ces temps difficiles, je sollicite votre aide financière. Fixez vos conditions – je ne les refuserai pas du moment que vous les mettez par écrit."
 gdp_purpose_events.0002.a: "Rédiger le contrat de prêt, avec les intérêts et tout le reste."
 gdp_purpose_events.0002.a.sin: "Rédiger le contrat de prêt, avec les intérêts usuraires et tout le reste."
 gdp_purpose_events.0002.c: "Le rédiger de manière à ce que personne ne puisse qualifier cela d’usure."
 gdp_purpose_events.0002.d: "Envoyer l’argent et ne rien demander en échange."
 gdp_purpose_events.0002.b: "Je dois poliment refuser..."
 gdp_purpose_events.0002_notification: "Prêt accordé"
 gdp_purpose_events.0002_fail_notification: "Prêt refusé"
 fund_maa: "Pour financer un [regiment|El] d’[men_at_arms|El] @stationed_regiment_icon!"
 fund_mercenaries: "Pour financer un contrat [mercenary|El][mercenary_i|E]"
 gdp_purpose_events.0003.desc: "Il est connu que la guerre pèse lourdement sur votre pays. Je suis prêt[merchant.Custom('FR_E')] à financer vos projets, [ROOT.Char.Custom('FR_MonseigneurMadame')|U], si vous bien vouliez me témoigner la même bienveillance à l’avenir..."
 gdp_purpose_events.0003.a: "J’ai besoin de toute l’aide possible..."
 gdp_purpose_events.0003.b: "La même bienveillance ? Jamais !"
 no_thanks.tt: "Vous passez à côté de cette occasion..."
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "Cela m’est pénible de vous écrire, mais dans la guerre qui s’annonce, mon pays aurait bien besoin de votre soutien financier. Je suis prêt[ruler.Custom('FR_E')] à vous témoigner la même bienveillance à l’avenir si vous acceptez de m’aider."
 gdp_purpose_events.0004.a: "Je pourrais vous proposer un nouveau régiment spécialisé !"
 gdp_purpose_events.0004.b: "Je pourrais graisser la patte de quelques unes de mes connaissances..."
 gdp_merchant.1002.t: "Création d’une compagnie"
 gdp_merchant.1002.desc: "Un grand livre vierge est posé sur le bureau devant moi. Par la fenêtre ouverte, les bruits du [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] local pénètrent dans le bureau de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] : les négociations, le grincement des roues et les cris des animaux dans leurs cages.\n\nLa pièce est modeste et peu éclairée — je ne peux pas m’en sortir [Select_CString(ROOT.Char.IsFemale,'toute seule','tout seul')] si je veux rivaliser avec les $game_concept_traders|l$ de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Peut-être devrais-je embaucher quelques personnes pour aider la compagnie ?"
 gdp_merchant.1002.a: "J’ai besoin d’associés qui comprennent les affaires."
 gdp_merchant.1002.a.tt: "Vous commencez avec deux [associates|El] compétents en [stewardship|El]"
 gdp_merchant.1002.b: "Nous allons intimider nos adversaires."
 gdp_merchant.1002.b.tt: "Vous commencez avec deux [associates|El] compétents en [martial|El]"
 gdp_merchant.1002.c: "Des négociateurs habiles concluent de bons accords commerciaux."
 gdp_merchant.1002.c.tt: "Vous commencez avec deux [associates|El] compétents en [diplomacy|El]"
 gdp_merchant.1002.d: "Les érudits ne manquent pas par ici !"
 gdp_merchant.1002.d.tt: "Vous commencez avec deux [associates|El] compétents en [learning|El]"
 gdp_merchant.1002.e: "La ruse jouera en notre faveur."
 gdp_merchant.1002.e.tt: "Vous commencez avec deux [associates|El] compétents en [intrigue|El]"
 gdp_merchant.1002.f: "Non, je n’ai besoin de personne."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial Vous risquez de trouver les [task_contracts|El] difficiles, voire impossibles, jusqu’à ce que vous ayez des [associates|El]#!"
 gdp_merchant.1002.f.tt.associates: "Vous commencez sans [associates|El] hormis votre [family|El] et [friends|El] potentiels"
 gdp_merchant.1003.t: "Création d’une compagnie"
 gdp_merchant.1003.desc: "Le [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] s’étend devant moi dans toute sa diversité infinie. Il ne se passe pas une seconde sans qu’une transaction ne soit conclue et que des [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] passent de mains en mains.\n\nPartout règne une effervescence intense : les roues des charrettes grincent, les animaux hurlent depuis leurs cages surpeuplées, et dans ce vacarme, les marchands espèrent garder une longueur d’avance sur leurs concurrents.\n\nToutes sortes de marchandises changent de mains ici : si je dois rivaliser avec d'aussi nombreux marchands, ne devrais-je pas concentrer mes efforts ?"
 gdp_merchant.1003.a: "« Il est essentiel de garantir le transport en vrac. »"
 gdp_merchant.1003.b: "« Nous devons tirer parti du regard que [ROOT.Char.GetSuzerain.Custom('FR_le_Char_L')][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] porte sur nous. »"
 gdp_merchant.1003.b.tt: "Un [patron_contract|El] sera créé"
 gdp_merchant.1003.c: "« Nous sommes des commerçants, le profit est notre seule priorité. »"
 gdp_merchant.1100.t: "Une compagnie bondée"
 gdp_merchant.1100.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', plaintiff)] [plaintiff.Custom('FR_le_Char_Pi')][plaintiff.GetTitledFirstName] entre dans mon bureau et choisit soigneusement ses mots. « [ROOT.Char.GetFirstNameNoTooltip]... C’est supposé être une entreprise familiale, mais nous comptons néanmoins de plus en plus sur des personnes extérieures.\n\n[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] devrait se débarrasser de ce poids si nous voulons conserver notre dignité. »"
 gdp_merchant.1100.a: "« [associate_2.GetFirstNameNoTooltip] n’est plus nécessaire. »"
 gdp_merchant.1100.b: "« Il est temps que [associate_1.GetFirstNameNoTooltip] et nous prenions des chemins différents. »"
 gdp_merchant.1100.c: "« Oui, dégraissons la compagnie... »"
 gdp_merchant.1100.d: "« C’est absurde. Nous avons besoin de toute l’aide possible... »"
 merchant_overcrowding_ignored_loss: "Effectifs en surnombre dans la compagnie ignorés"
 merchant_overcrowding_fired_gain: "Associé licencié pour résoudre la surpopulation"
 merchant_overcrowding_yeet_gain: "Associés licenciés pour résoudre la surpopulation"
 gdp_merchant.1200.t: "La demande d’[Select_CString(requester.IsFemale,'une associée','un associé')]"
 gdp_merchant.1200.desc: "Après une longue journée passée à consulter les grands livres, je remarque que m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', requester)] [requester.Custom('FR_le_Char_Pi')][requester.GetTitledFirstName] devant ma porte attend de pouvoir me parler. « Oh, [ROOT.Char.Custom2('RelationToMeAddress', requester)] ! Je voulais vous demander quelque chose... »\n\n"
 gdp_merchant.1200.desc.artifact: "« La compagnie se porte tellement bien sous votre direction, avec tant d’objets précieux qui passent dans ses comptes. Je me demandais si, par hasard, vous ne pourriez pas… me laisser en garder un ? »"
 gdp_merchant.1200.desc.activity: "« La compagnie travaille dur, et vous nous dirigez bien, mais n’est-il pas temps de célébrer nos exploits lors d’un événement mémorable ? »"
 gdp_merchant.1200.desc.luxury_contract: "« Les itinéraires prospèrent sous votre direction, mais il doit encore y avoir tant de merveilles ailleurs qui n’attendent que d’être découvertes... »"
 gdp_merchant.1200.a: "« D’accord, je vais voir ce que je peux faire. »"
 gdp_merchant.1200.b: "« Allons, j’ai mieux à faire. »"
