l_french:
 gdp_republic_unrest.0001.t: "Révolte à la capitale : les doléances"
 gdp_republic_unrest.0001.desc: "Des ouvriers et des compagnons de guilde se sont rassemblés dans la cour. L’un d’entre eux s’avance et me dit : « [ROOT.Char.Custom('FR_MonseigneurMadame')|U], les impôts nous appauvrissent... »\n\nJ’ai déjà tout entendu. Ce ne sont pas les premiers, ni les derniers, à venir se plaindre à ma porte."
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "Gardes ! Débarrassez-vous de ces... individus."
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "Je refuse de négocier avec des paysans."
 gdp_republic_unrest.0001.b.success: "Ils se dispersent sans faire de vagues"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "Ce refus les rend furieux"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "Que le Conseil s’en occupe."
 gdp_republic_unrest.0001.c.success: "Ils sont convaincus, pour le moment"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "Ils ne sont pas dupes devant ce retard"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "J’accepte de faire une concession pour cette fois."
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "Révolte à la capitale : un accueil glacial"
 gdp_republic_unrest.0011.desc: "En traversant les marchés, j’entends les discussions habituelles, mais quelque chose me semble avoir changé. Les étals sont silencieux, et on me lance des regards gênés.\n\nCela fait des années que je traverse ces rues, et je n’ai jamais rien vu de tel."
 gdp_republic_unrest.0011.a: "Je me fais certainement des idées."
 gdp_republic_unrest.0011.b: "Que quelqu’un aille vérifier ce qui se dit."
 gdp_republic_unrest.0011.b.success: "Mes hommes remontent la source"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "Les rumeurs continuent"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "J’irai leur parler."
 gdp_republic_unrest.0011.c.success: "Les gens apprécient le geste"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "Personne n’accepte de discuter"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "Distribuez de la nourriture et du vin, tout ce qu’il faudra."
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "Révolte à la capitale : la lettre anonyme"
 gdp_republic_unrest.0021.desc: "Une lettre m’attendait sur mon bureau quand je suis arrivé[ROOT.Char.Custom('FR_E')] ce matin. Pas de nom, pas de sceau. Elle explique en détail à quel point la situation à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a empiré depuis que je suis devenu[ROOT.Char.Custom('FR_E')] [ROOT.Char.Custom('FR_le_Char_L')][ROOT.Char.GetTitleAsName|l]."
 gdp_republic_unrest.0021.a: "La jeter au feu."
 gdp_republic_unrest.0021.b: "Quelqu’un s’est donné beaucoup de mal. Découvrons qui."
 gdp_republic_unrest.0021.b.success: "A identifié l’auteur"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "L’auteur reste inconnu"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "J’apporterai une réponse publique."
 gdp_republic_unrest.0021.c.success: "La réponse est bien accueillie"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "La réponse est très mal accueillie"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "Révolte à la capitale : la place leur appartient désormais"
 gdp_republic_unrest.0101.desc: "« [ROOT.Char.Custom('FR_MonseigneurMadame')|U], des citoyens ont pris le contrôle de la place du marché... depuis déjà quelques jours », m’informe l’un de mes gardes. « Il semblerait qu’[Select_CString(demagogue.IsFemale,'une femme','un homme')] du nom de [demagogue.GetFirstName] attise la colère du peuple. »\n\nJe me demande pourquoi je paie des imbéciles pareils, si le marché peut rester fermé pendant des jours sans que personne ne m’en informe ?"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "Nettoyez-moi cette place !"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "Discréditez c[demagogue.Custom('FR_EEtte')] démagogue."
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName] est discrédité[demagogue.Custom('FR_E')]"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "Mes tentatives tombent à plat"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "Je vais leur parler moi-même."
 gdp_republic_unrest.0101.c.success: "La foule se disperse"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "Je suis accueilli[ROOT.Char.Custom('FR_E')] par une pluie de huées"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "Donnez-leur ce qu’ils veulent."
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "Révolte à la capitale : le quartier fermé"
 gdp_republic_unrest.0111.desc: "[closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )] semble avoir coupé tout contact, refuse de reconnaître nos percepteurs d’impôts, et ne prête aucune attention à nos gardes."
 gdp_republic_unrest.0111.a: "Envoyons des gardes avec les percepteurs d’impôts."
 gdp_republic_unrest.0111.b: "Achetons-les."
 gdp_republic_unrest.0111.b.success: "Ils auront ce qu’ils veulent"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "Ils refusent de négocier"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "Je vais m’y rendre et leur parler moi-même."
 gdp_republic_unrest.0111.c.success: "Ils écoutent"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "Ils refusent d’écouter"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "Ils finiront pas se lasser. Du moins, espérons-le."
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "Révolte à la capitale : l’effigie"
 gdp_republic_unrest.0121.desc: "Tandis que je me promène dans la rue, je suis interrompu[GetPlayer.Custom('FR_E')] par une affreuse effigie portant une tenue similaire à la mienne, pendue aux yeux de tous. La foule l’observe en silence, avant de se tourner vers moi.\n\n« Encore plus vrai que nature ! », crie quelqu’un, tandis que des huées s’élèvent au sein de la foule."
 gdp_republic_unrest.0121.a: "Enlevez-moi ça, et vite !"
 gdp_republic_unrest.0121.a.flavor: "Je veillerai à ce que personne n’en parle."
 gdp_republic_unrest.0121.b: "Découvrons qui se cache derrière tout ça."
 gdp_republic_unrest.0121.b.success: "Les responsables ont bien été identifiés"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "Les responsables n’ont pas été retrouvés"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "Je m’en occuperai publiquement."
 gdp_republic_unrest.0121.c.success: "Les gens écoutent"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "La foule hue"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "N’y donnons pas d’importance."
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "Révolte à la capitale : la ville brûle"
 gdp_republic_unrest.0201.desc: "Je vois la fumée qui s’élève avant que les gardes ne me rejoignent. « [ROOT.Char.Custom('FR_MonseigneurMadame')|U], [Select_CString(demagogue.IsFemale,'une démagogue','un démagogue')] du nom de [demagogue.GetFirstName] a convaincu les gens de mettre le feu à l’un des quartiers de la ville. »\n\nQu’arrive-t-il à ma ville... ?"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "Rassemblez toute la garnison."
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "Préparez-mon cheval !"
 gdp_republic_unrest.0201.b.success: "Les émeutiers se dispersent"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "Je dois rentrer au palais"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "J’irai à leur rencontre sur la place."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "La foule se retourne contre moi"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "Donnez-leur tout le Trésor s’il le faut."
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "Révolte à la capitale : la grève"
 gdp_republic_unrest.0211.desc: "Aux marchés, la grève saute immédiatement aux yeux. Pas de vente à la criée, des étals vides, des ateliers silencieux...\n\nIl est évident que les guildes ont pris une décision commune, et que tous les ouvriers la respectent."
 gdp_republic_unrest.0211.a: "Faites venir les maîtres des guildes pour en discuter."
 gdp_republic_unrest.0211.a.success: "Un accord est trouvé"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "Ils refusent de venir"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "Nous allons les acheter, cette fois."
 gdp_republic_unrest.0211.b.success: "Nous avons convenu d’un prix"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "Ils rejettent mon compromis"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "Qu’on les renvoie immédiatement au travail."
 gdp_republic_unrest.0211.d: "Accédez à leurs demandes."
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "Révolte à la capitale : le manuscrit"
 gdp_republic_unrest.0221.desc: "« [ROOT.Char.Custom('FR_MonseigneurMadame')|U], voilà qu’ils... distribuent ça maintenant », m’informe l’un de mes gardes en me tendant un manuscrit. « On en trouve partout en ville. »\n\nLe texte fourmille de détails, à la fois en m’insultant personnellement et en m’accusant de tous les maux."
 gdp_republic_unrest.0221.a: "Trouvez qui a écrit cela et occupez-vous-en."
 gdp_republic_unrest.0221.a.success: "La source a été localisée et réduite au silence"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "L’auteur reste inconnu"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "Je rejetterai cela publiquement."
 gdp_republic_unrest.0221.b.success: "Les accusations s’estompent peu à peu"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "Les gens me conspuent"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "Achetons chaque exemplaire."
 gdp_republic_unrest.0221.d: "Ces situations se dissipent d’elles-mêmes."
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "Révolte à la capitale : à nos portes"
 gdp_republic_unrest.0301.desc: "À mon réveil, plusieurs gardes m’informent qu’une foule est en approche. Alors que je parcours mes couloirs, je me rends compte à quel point ils sont déserts... La plupart de mes gardes sont partis.\n\nEn regardant par la fenêtre, je les vois s’approcher lentement, sous les cris et les acclamations. La foule vient me chercher."
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "Il n’y a qu’[Select_CString(ROOT.Char.IsFemale,'une seule','un seul')] [ROOT.Char.GetTitleAsNameNoTooltip|l]. Venez [ROOT.Char.Custom('FR_LeLa')] trouver."
 gdp_republic_unrest.0301.a.success: "Je les massacre tous, jusqu’à ce qu’il ne reste plus que mes mains tremblantes et ce palais muet et ensanglanté"
 gdp_republic_unrest.0301.a.fail: "Je suis victime de la foule"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "Ils ne me prendront jamais vivant[ROOT.Char.Custom('FR_E')] !"
 gdp_republic_unrest.0301.b.success: "Mes hommes et moi parvenons à sortir d’ici"
 gdp_republic_unrest.0301.b.fail: "Ils sont bien plus nombreux que nous"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "Passons par la porte de service."
 gdp_republic_unrest.0301.c.success: "Je parviens à m’éclipser"
 gdp_republic_unrest.0301.c.fail: "Je suis capturé[ROOT.Char.Custom('FR_E')]"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "Mon règne est terminé."
 gdp_republic_unrest.0301.d.flavor: "J’approche de la fenêtre et annonce ma démission. Puis je sors les mains vides et prie pour qu’ils me laissent en vie."
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "Révolte à la capitale : le grand silence"
 gdp_republic_unrest.0302.desc: "Le calme règne désormais dans le palais.\n\nLes corps n’ont pas été déplacés et les portes sont toujours ouvertes, tel qu’elles l’étaient lorsque le dernier des rebelles s’est enfui. Mes mains tremblent moins.\n\nJe suis toujours là."
 gdp_republic_unrest.0302.a: "Je suis toujours... en vie ?"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "Révolte à la capitale : un nouveau nom, une nouvelle vie"
 gdp_republic_unrest.0303.desc: "Je suis en vie.\n\nLa ville est désormais derrière moi, et personne dans ces rues ne sait qui je suis. Mon titre et le palais sont perdus, ainsi que tout ce qui faisait de moi ce que j’étais depuis des années.\n\nMais j’ai survécu. Cela doit bien valoir quelque chose. Bon, où vais-je aller ?"
 gdp_republic_unrest.0303.a: "Aller à [destination_a.GetNameNoTierNoTooltip] pour un nouveau départ."
 gdp_republic_unrest.0303.a.tt: "Se rendre en [destination_a.GetNameNoTier] et y transférer mon domicile"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip] est assez loin. Je peux reconstruire là-bas."
 gdp_republic_unrest.0303.b.tt: "Se rendre en [destination_b.GetNameNoTier] et y transférer mon domicile"
 gdp_republic_unrest.0303.c: "Quelque part où personne ne connaît mon nom. [destination_c.GetNameNoTierNoTooltip] devrait convenir."
 gdp_republic_unrest.0303.c.tt: "Se rendre en [destination_c.GetNameNoTier] et y transférer mon domicile"
 gdp_republic_unrest.0303.d: "Je n’ai nulle part où aller. Je vais rester et me rendre utile."
 gdp_republic_unrest.0303.tt: "A remboursé tous les [domicile_buildings|El]"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.Custom('FR_le_Char_L')|U][old_doge.GetTitleAsNameNoTooltip|l] n’est plus"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName] est mort[old_doge.Custom('FR_E')]. [old_doge.Custom('FR_IlElle')|U] a péri pendant la révolte, et le palais est désormais vide.\n\nL’avenir est des plus incertains."
 gdp_republic_unrest.0304.a: "Cela change tout."
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.Custom('FR_le_Char_L')|U][old_doge.GetTitleAsNameNoTooltip|l] a disparu"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName] est parti[old_doge.Custom('FR_E')]. Pas de corps, pas d’adieux, [old_doge.Custom('FR_IlElle')] a simplement disparu dans la nuit, tandis que la foule se pressait devant les portes.\n\nL’avenir est des plus incertains."
 gdp_republic_unrest.0305.a: "Cela change tout."
 gdp_republic_unrest.0306.t: "Révolte à la capitale : une nouvelle cité, une nouvelle vie"
 gdp_republic_unrest.0306.desc: "Le chemin que j’ai parcouru est long et j’essaie de ne pas regarder en arrière.\n\nCet endroit ne me connaît pas encore. Les marchés et les visages me sont inconnus, mais il y a ici de l’argent à gagner, des alliances à forger et une vie à reconstruire à partir du peu qui me reste."
 gdp_republic_unrest.0306.a: "Il est temps de se mettre au travail."
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "Révolte à la capitale : un assassin sur la place"
 gdp_republic_unrest.0311.desc: "Alors que je traverse le marché, les gens s’écartent sur mon passage, interrompant leurs discussions. Soudain, j’aperçois quelqu’un qui fonce vers moi, l’épée à la main.\n\nMes gardes sont trop loin pour venir me porter secours, et je n’ai qu’un instant pour réagir."
 gdp_republic_unrest.0311.a: "Où est mon épée ?!"
 gdp_republic_unrest.0311.a.success: "J’arrive tout juste à me défendre"
 gdp_republic_unrest.0311.a.fail: "[assassin.Custom('FR_IlElle')|U] m’atteint avant que mes gardes ne soient là"
 gdp_republic_unrest.0311.b: "Je dois immédiatement filer d’ici."
 gdp_republic_unrest.0311.b.success: "Je parviens à échapper à l’assassin"
 gdp_republic_unrest.0311.b.fail: "Je ne peux aller nulle part"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "Révolte de la capitale : toujours debout"
 gdp_republic_unrest.0312.desc: "La foule s’est dispersée dans le chaos. Quant à moi, je suis encore en vie, même si j’ignore comment.\n\nJe regarde le cadavre de [Select_CString(assassin.IsFemale,'la femme','l’homme')] que mes gardes ont attrapé[assassin.Custom('FR_E')] et neutralisé[assassin.Custom('FR_E')]. [assassin.Custom('FR_IlElle')|U] ressemble à n’importe quel artisan de la ville.\n\nOù suis-je en sécurité dans ma propre ville si même de simples citoyens essaient de me tuer ?"
 gdp_republic_unrest.0312.a: "Il... Il faut que je rentre."
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "Révolte de la capitale : sang pour sang"
 gdp_republic_unrest.0321.desc: "Tard dans la nuit, un messager entre dans mon bureau pour me remettre une lettre.\n\nDes émeutiers ont enlevé m[ROOT.Char.Custom2('FR_RelationToMe_OnA', SCOPE.sC('heir'))], [heir.GetFirstName], et si je n’ai pas quitté la ville d’ici demain matin, ils renverront son corps dans ma propriété."
 gdp_republic_unrest.0321.rival: "Vous pouvez [heir.Custom('FR_LeLa')] garder."
 gdp_republic_unrest.0321.a: "Appelez les gardes. Ramenez-[heir.Custom('FR_LeLa')]."
 gdp_republic_unrest.0321.heir_survives: "[heir.Custom('FR_le_Char_U_Pi')|U][heir.GetShortUIName] survit"
 gdp_republic_unrest.0321.a.success: "Mes hommes [heir.Custom('FR_LeLa')] sauvent à temps"
 gdp_republic_unrest.0321.a.fail: "Ils arrivent trop tard"
 gdp_republic_unrest.0321.b: "Découvrez où ils [heir.Custom('FR_LeLa')] cachent."
 gdp_republic_unrest.0321.b.success: "Ils [heir.Custom('FR_LeLa')] trouvent"
 gdp_republic_unrest.0321.b.fail: "[heir.GetSheHe|U] est introuvable"
 gdp_republic_unrest.0321.c: "Prenez toutes les pièces que j’ai, mais rendez-[heir.Custom('FR_LeLa')]-moi."
 gdp_republic_unrest.0321.d: "Le titre n’a pas de sens sans [heir.GetFirstNameNoTooltip]."
 gdp_republic_unrest.0321.d.flavor: "Si cela peut [heir.Custom('FR_LeLa')] sauver, alors ça en vaut la peine."
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "Révolte de la capitale : en sécurité"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip] entre dans mon bureau, un petit sourire forcé aux lèvres. [heir.Custom('FR_IlElle')|U] va bien, [heir.Custom('FR_IlElle')] s’en est sorti[heir.Custom('FR_E')]. C’est tout ce qui compte pour le moment.\n\nQuant à moi, je dois m’assurer que cela ne se reproduise plus."
 gdp_republic_unrest.0322.desc.rival: "Un serviteur entre dans ma chambre pour m’informer du retour de [heir.GetFirstNameNoTooltip].\n\nBien, la succession reste intacte pour le moment. Quant à moi, je dois m’assurer que cela ne se reproduise plus."
 gdp_republic_unrest.0322.a: "Oh, vous êtes de retour !"
 gdp_republic_unrest.0322.a.rival: "Bien. Nous pouvons donc nous remettre au travail."
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "Révolte de la capitale : trop tard"
 gdp_republic_unrest.0323.desc: "À la tombée de la nuit, on frappe à la porte. J’entends des voix dehors, puis le silence.\n\nLorsque j’arrive dans la cour, je sais déjà ce qui s’est passé. [heir.GetFirstNameNoTooltip] est là, allongé[heir.Custom('FR_E')] sur la pierre. La foule a déposé ce qu’il reste d[heir.Custom('FR_EluiElle')]."
 gdp_republic_unrest.0323.desc.rival: "À la tombée de la nuit, on frappe à la porte. Lorsque j’arrive dans la cour, je sais déjà ce qui s’est passé.\n\n[heir.GetFirstNameNoTooltip] est là, allongé[heir.Custom('FR_E')] sur la pierre. La foule a déposé ce qu’il reste d[heir.Custom('FR_EluiElle')]. Je reste là longtemps, à contempler le cadavre de mon [Select_CString(heir.IsFemale,'héritière','héritier')]."
 gdp_republic_unrest.0323.a.child: "Regardez comment ils ont massacré mon enfant..."
 gdp_republic_unrest.0323.a: "Que vous ont-ils fait, [heir.GetFirstNameNoTooltip] ?"
