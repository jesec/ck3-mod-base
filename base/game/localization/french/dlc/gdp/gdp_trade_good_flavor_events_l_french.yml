l_french:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "Inventaire"
 gdp_trade_good_flavor.1001.desc: "Je recompte mes [tgf_good.Custom('GetTradeGoodUnitPlural')] pour [tgf_good.Custom('GetTradeGood')] avant de me coucher. Trois cent douze, tous déjà vendus... du moins dans mes calculs.\n\nJe vais les recompter, pour m’assurer que je n’ai rien oublié."
 gdp_trade_good_flavor.1001.a: "Ma précieuse marchandise..."
 gdp_trade_good_flavor.1001.b: "Le registre ne s’est pas trompé."
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "Ouï-dire"
 gdp_trade_good_flavor.1002.desc: "On m’a rapporté que [tgf_market_holder.Custom('FR_le_Char_Pi')][tgf_market_holder.GetTitledFirstName] aurait chanté les louanges de mes marchandises à sa table. [tgf_market_holder.Custom('FR_IlElle')|U] en veut davantage et le répète inlassablement à qui veut l’entendre.\n\nC’est toujours agréable de recevoir des éloges, mais ce que j’aime encore plus recevoir, c’est de l’argent dans ma bourse."
 gdp_trade_good_flavor.1002.a: "Voici un cadeau pour ma plus fidèle clientèle."
 gdp_trade_good_flavor.1002.b: "[tgf_market_holder.Custom('FR_IlElle')|U] serait donc prêt[tgf_market_holder.Custom('FR_E')] à payer plus..."
 gdp_trade_good_flavor.1002.c: "C’est une bonne réclame."
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "En direct de la source"
 gdp_trade_good_flavor.1003.desc: "Dans une lettre signée par [tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')] qui opère sur les marchés de [tgf_source_county.GetNameNoTier], j’y apprends que les ouvriers de culture [tgf_source_culture.GetName] connaissent leur métier sur le bout des doigts, que [tgf_good.Custom('GetTradeGood')] n’a aucun secret pour eux, et que personne ne lésine sur la qualité.\n\nIl est toujours bon de connaître ses sources lorsqu’on commerce."
 gdp_trade_good_flavor.1003.a: "Chaque détail est un bénéfice de plus."
 gdp_trade_good_flavor.1003.b: "Je peux réajuster mes prix..."
 gdp_trade_good_flavor.1003.c: "Mes respects, entre négociants compétents."
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "La voie est libre"
 gdp_trade_good_flavor.1004.desc: "[tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], a le sourire jusqu’aux oreilles depuis que nous savons que la voie est libre et que partout on me demande ma marchandise, [tgf_good.Custom('GetTradeGood')], d’une qualité inégalable.\n\nLe temps, c’est de l’argent, alors tâchons de rentabiliser cette année."
 gdp_trade_good_flavor.1004.a: "Vendons tant que les conditions sont favorables."
 gdp_trade_good_flavor.1004.b: "Tirons les leçons de cette année."
 gdp_trade_good_flavor.1004.c: "Achetons davantage de chariots !"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "Rêves de profits"
 gdp_trade_good_flavor.1005.desc: "Ce fameux songe sur [tgf_good.Custom('GetTradeGood')] m’est de nouveau apparu cette nuit : je trône au-dessus d’une montagne de [tgf_good.Custom('GetTradeGoodUnitPlural')] atteignant le plafond, tandis que les acheteurs s’empoignent tout en bas pour me donner leur fortune.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "Ce fameux songe sur [tgf_good.Custom('GetTradeGood')] m’est de nouveau apparu cette nuit : je mène une folle cavalcade sur les sentiers menant au marché, avec des centaines de bêtes, tandis que les acheteurs tentent de nous rattraper.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "À mon réveil, hilare, j’ai couché sur papier les chiffres alléchants. Un jour, je serai riche !"
 gdp_trade_good_flavor.1005.a: "Ce songe sera bientôt réalité !"
 gdp_trade_good_flavor.1005.a.tt: "Une nouvelle [trade_opportunity|El] se présentera bientôt"
 gdp_trade_good_flavor.1005.b: "Ces chiffres sont réalistes. Je les atteindrai !"
 gdp_trade_good_flavor.1005.c: "Allons, encore quelques minutes de rêve... Zz#DIE1 zz#!#DIE2 zz...#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "Toujours vérifier la marchandise"
 gdp_trade_good_flavor.1006.desc: "[tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], m’a fait part d’une situation préoccupante : « [tgf_good.Custom('GetTradeGood')|U] de [tgf_source_county.GetNameNoTier] ? [tgf_good.Custom('GetTgfGoodFlaw')|U]. Ils nous ont pris pour des ignorants qui ne vérifient pas la qualité ! »\n\nIls ont voulu me léser ? Eh bien, ils vont le payer de leur bourse."
 gdp_trade_good_flavor.1006.a: "Cette marchandise ne vaut rien."
 gdp_trade_good_flavor.1006.b: "Ha. Tel est pris qui croyait prendre."
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "Une renommée immense"
 gdp_trade_good_flavor.1007.desc: "[tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], vient de me transmettre une nouvelle surprenante de [tgf_source_county.GetNameNoTier] : « [tgf_good.Custom('GetTradeGood')|U] ? [tgf_good.Custom('GetTgfGoodSold')|U]. Pourtant, les [tgf_source_culture.GetCollectiveNoun] exigent [tgf_good.Custom('GetTradeGood')] de la [ROOT.Char.GetHouse.GetName] ! Ils vont jusqu’à payer le prix fort pour mettre la main dessus ! Nos étals sont vides en quelques minutes ! »\n\nIl faut croire que la renommée immense de mes marchandises contribue à la mienne."
 gdp_trade_good_flavor.1007.a: "Apposez mon sceau sur chaque lot vendu !"
 gdp_trade_good_flavor.1007.b: "Eh bien, vendez ! Vendez, parbleu !"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "Demande d’estimation"
 gdp_trade_good_flavor.1008.desc: "Une lettre arborant le sceau [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] m’est parvenue. Elle détaille une opportunité commerciale, dans laquelle il est question de [tgf_good.Custom('GetTradeGoodUnitPlural')] pour [tgf_good.Custom('GetTradeGood')], mais son intendant est un incapable qui ne sait pas distinguer une marchandise de qualité d’un détritus. Il m’est donc demandé d’examiner l’offre et de partager mon verdict.\n\nC’est très flatteur, mais la flatterie a un coût..."
 gdp_trade_good_flavor.1008.a: "La vérité, au gramme près."
 gdp_trade_good_flavor.1008.b: "Formidable ! Je n’ai jamais rien vu de tel."
 gdp_trade_good_flavor.1008.c: "Une opinion professionnelle ne se donne pas : elle se vend."
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "Les bases du commerce"
 gdp_trade_good_flavor.1009.desc: "Voilà que je surprends mon hériti[tgf_heir.Custom('FR_ErEre')], [tgf_heir.GetFirstName], au beau milieu de mon entrepôt en train d’examiner mes [tgf_good.Custom('GetTradeGoodUnitPlural')] pour [tgf_good.Custom('GetTradeGood')], comme si de la monnaie s’y trouvait.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "Voilà que je surprends mon hériti[tgf_heir.Custom('FR_ErEre')], [tgf_heir.GetFirstName], au beau milieu des enclos en train d’examiner [tgf_good.Custom('GetTradeGood')], comme si de la monnaie se trouvait sous le cuir.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "Très bonne initiative ! Apprenons-lui le métier."
 gdp_trade_good_flavor.1009.a: "Venez. Regardez comment je fais."
 gdp_trade_good_flavor.1009.b: "Allez-y, comptez le tout. Ensuite, comptez une seconde fois."
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "Faussaire de talent"
 gdp_trade_good_flavor.1010.desc: "On m’a renvoyé une caisse de [tgf_source_county.GetNameNoTier], sous prétexte qu’elle était bien en dessous de la qualité habituelle. Ce n’est pas la mienne, pourtant ma marque a été copiée à la perfection.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "On m’a renvoyé une bête de [tgf_source_county.GetNameNoTier], sous prétexte qu’elle était bien en dessous de la qualité habituelle. Ce n’est pas la mienne, pourtant ma marque a été copiée à la perfection.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "M[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], [tgf_trader.GetFirstName], pense connaître l’infâme faussaire : [tgf_rival.GetFirstName], de la [tgf_rival.Custom('GetTgfCompanyWord')] de la [tgf_rival.GetHouse.GetBaseNameNoTooltip]. C’est un[tgf_rival.Custom('FR_E')] faussaire de talent, je dois l’admettre."
 gdp_trade_good_flavor.1010.a: "Cette plaisanterie doit cesser immédiatement !"
 gdp_trade_good_flavor.1010.b: "Les autres Maisons vont en entendre parler."
 gdp_trade_good_flavor.1010.c: "La contrefaçon n’est-elle pas une forme de réclame ?"
 house_relation_tgf_imitation_desc: "[ROOT.Char.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetShortUINameNotMe] a fait des contrefaçons [tgf_rival.Custom('FR_du_Char_Pi')][tgf_rival.GetShortUIName] un incident entre leurs Maisons."
 house_relation_reason_tgf_imitation_desc: "[char.Custom('FR_le_Char_Pi')|U][char.GetShortUINameNotMe] a fait des contrefaçons [target_char.Custom('FR_du_Char_Pi')][target_char.GetShortUIName] un incident entre leurs Maisons."
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "L’offre et [tgf_good.GetNameNoTooltip]"
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName|U], négociant pour la [tgf_rival.Custom('GetTgfCompanyWord')] de la [tgf_rival.GetHouse.GetBaseNameNoTooltip], s’est présenté[tgf_envoy.Custom('FR_E')] à mon entrepôt, une bourse bien remplie à la main : « M[tgf_rival.Custom('FR_OnA')] [Select_CString(tgf_rival.IsFemale,'maîtresse','maître')], [tgf_rival.GetFirstName], souhaite acquérir les noms de ceux qui vous fournissent [tgf_good.Custom('GetTradeGood')]. Considérez la bourse comme un dédommagement. »\n\nIl ne s’agit pas seulement de vendre des noms, mais de céder des années de dur labeur."
 gdp_trade_good_flavor.1011.a: "Ce ne sont que des noms. Vendu !"
 gdp_trade_good_flavor.1011.b: "Je ne céderai pas mon avantage ainsi."
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "La trêve commerciale"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U] traite dans [tgf_good.Custom('GetTradeGood')] sur les marchés de [tgf_source_county.GetNameNoTier], tout comme moi. Chaque année, nous redoublons de stratagèmes pour casser nos prix tout en engrangeant le maximum de bénéfices. Mais ce matin, sa lettre propose une issue inédite : une trêve. Nous arrêtons les batailles commerciales pour pouvoir manger à notre faim cet hiver.\n\nIl faut croire que la paix, comme toute marchandise, peut se négocier."
 gdp_trade_good_flavor.1012.a: "Entendu. Arrêtons les hostilités."
 gdp_trade_good_flavor.1012.b: "Cette lettre est un aveu de faiblesse ! Ne cédons pas."
 house_relation_tgf_truce_desc: "[ROOT.Char.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetShortUINameNotMe] et [tgf_ally.Custom('FR_le_Char_Pi')][tgf_ally.GetShortUINameNotMe] ont accepté de stopper leur guerre commerciale."
 house_relation_reason_tgf_truce_desc: "[char.Custom('FR_le_Char_Pi')|U][char.GetShortUINameNotMe] et [target_char.Custom('FR_le_Char_Pi')][target_char.GetShortUINameNotMe] ont accepté de stopper leur guerre commerciale."
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "Une offre exceptionnelle"
 gdp_trade_good_flavor.1013.desc: "J’ai reçu une lettre [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] qui me propose un prix sur [tgf_good.Custom('GetTradeGood')] défiant toute concurrence si je concède à m’en procurer uniquement chez [tgf_market_holder.Custom('FR_LuiElle')].\n\nL’exclusivité est une forme d’asservissement, mais son prix est vraiment alléchant."
 gdp_trade_good_flavor.1013.a: "Si le rabais en vaut la peine, j’accepte."
 gdp_trade_good_flavor.1013.b: "Je ne céderai pas pour quelques sous."
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "Expertise à l’ancienneté"
 gdp_trade_good_flavor.1014.desc: "En déchargeant son épaule, un[tgf_porter.Custom('FR_E')] [Select_CString(tgf_porter.IsFemale,'porteuse','porteur')] de l’entrepôt de [tgf_source_county.GetNameNoTier] m’interpelle. « Sauf votre respect, ce n’est pas comme ça qu'on inspecte [tgf_good.Custom('GetTradeGood')]. » [tgf_porter.Custom('FR_IlElle')|U] s’empresse alors de me montrer sa méthode.\n\nAprès toutes ces années à transporter des [tgf_good.Custom('GetTradeGoodUnitPlural')], cette marchandise n’a plus aucun secret pour [tgf_porter.Custom('FR_LuiElle')]."
 gdp_trade_good_flavor.1014.desc.livestock: "À la tête de son troupeau, un[tgf_porter.Custom('FR_E')] [Select_CString(tgf_porter.IsFemale,'bouvière','bouvier')] du marché de [tgf_source_county.GetNameNoTier] m’interpelle. « Sauf votre respect, ce n’est pas comme ça qu'on inspecte [tgf_good.Custom('GetTradeGood')]. » [tgf_porter.Custom('FR_IlElle')|U] s’empresse alors de me montrer sa méthode.\n\nAprès toutes ces années à guider ses bêtes, elles n'ont plus aucun secret pour [tgf_porter.Custom('FR_LuiElle')]."
 gdp_trade_good_flavor.1014.a: "Tenez : tant de bons conseils méritent bien salaire."
 gdp_trade_good_flavor.1014.b: "Continuez, je vous écoute."
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "Erreur de novice"
 gdp_trade_good_flavor.1015.desc: "Le camelot de [tgf_source_county.GetNameNoTier] qui m’a vendu [tgf_good.Custom('GetTradeGood')] doit bien se payer ma tête à la taverne où il couche : j’ai déboursé une fortune pour acquérir sa marchandise, mais je ne m’en rends compte qu'à présent.\n\nMa foi, c’est en faisant des erreurs qu'on apprend..."
 gdp_trade_good_flavor.1015.a: "Une erreur qui m’aura coûté cher..."
 gdp_trade_good_flavor.1015.b: "C’en est assez. Je ferme les comptes pour aujourd'hui."
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "L’abrégé du marchand"
 gdp_trade_good_flavor.1016.desc.intro: "En déballant [tgf_good.Custom('GetTradeGood')], je découvre au fond d’une caisse, délicatement enveloppé d’un tissu, un exemplaire "
 gdp_trade_good_flavor.1016.desc.intro_livestock: "En comptant [tgf_good.Custom('GetTradeGood')], je découvre attaché sur l’un des harnais, délicatement enveloppé d’un tissu, un exemplaire "
 gdp_trade_good_flavor.1016.desc.book_1: "de #EMP La Pratique du commerce#!."
 gdp_trade_good_flavor.1016.desc.book_2: "du #EMP Livre des Routes et marchés#!."
 gdp_trade_good_flavor.1016.desc.book_3: "du #EMP Miroir du marchand#!."
 gdp_trade_good_flavor.1016.desc.outro: "Poids, mesures, routes et prix couchés sur le papier par un marchand qui, manifestement, ne dormait jamais.\n\nC'est un véritable trésor. Et j’ai bien l'intention de m'en servir."
 gdp_trade_good_flavor.1016.a: "Je vais le lire d’une traite."
 gdp_trade_good_flavor.1016.b: "Un tel ouvrage doit valoir une coquette somme."
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "Les ficelles du métier"
 gdp_trade_good_flavor.1017.desc: "Un négociant de [tgf_source_county.GetNameNoTier], de culture [tgf_seller.GetCulture.GetName], m’annonce à combien il me vend [tgf_good.Custom('GetTradeGoodUnit')] pour [tgf_good.Custom('GetTradeGood')] : trois fois plus que les prix du marché ! « À en juger votre mine déconfite, vous avez du mal à comprendre ma démarche. Offrez-moi de votre bourse et je vous apprendrai les ficelles du métier. »\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "Un négociant de [tgf_source_county.GetNameNoTier], de culture [tgf_seller.GetCulture.GetName], m’annonce à combien il me vend [tgf_good.Custom('GetTradeGoodUnit')] pour [tgf_good.Custom('GetTradeGood')] : trois fois plus que les prix du marché ! « À en juger votre mine déconfite, vous avez du mal à comprendre ma démarche. Offrez-moi de votre bourse et je vous apprendrai les ficelles du métier. »\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "Quelle insolence, et pourtant si juste !"
 gdp_trade_good_flavor.1017.a: "Très bien, je mords. Instruisez-moi."
 gdp_trade_good_flavor.1017.b: "C’est hors de question !"
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "La mauvaise mesure"
 gdp_trade_good_flavor.1018.desc: "[tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], vient de découvrir que nous vendons [tgf_good.Custom('GetTradeGood')] à la mesure [ROOT.Char.GetCulture.GetName], inférieure à l’unité [tgf_source_culture.GetName] des acheteurs. Ainsi, nous avons gagné un peu plus sur tous les [tgf_good.Custom('GetTradeGoodUnitPlural')].\n\nNaturellement, c’était une erreur involontaire. À moi de la corriger... ou pas."
 gdp_trade_good_flavor.1018.a: "Rétablissons les bonnes mesures."
 gdp_trade_good_flavor.1018.b: "Ce qui remplit ma bourse n’est pas une erreur."
 gdp_trade_good_flavor.1018.c: "Pesons à leur manière, et annonçons-le haut et fort."
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "Vente en lot"
 gdp_trade_good_flavor.1019.desc: "J’ai reçu une lettre [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] qui me demande de lui livrer [tgf_good.Custom('GetTradeGood')] et [tgf_good_b.Custom('GetTradeGood')], puisque les deux marchandises ne vont jamais l’une sans l’autre.\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "J’ai reçu une lettre [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] qui me demande de lui fournir [tgf_good.Custom('GetTradeGood')] et [tgf_good_b.Custom('GetTradeGood')] en une seule livraison.\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "Deux marchandises pour un acheteur. Un calcul on ne peut plus simple."
 gdp_trade_good_flavor.1019.a: "Le prix du lot est non négociable."
 gdp_trade_good_flavor.1019.b: "La livraison se fera en deux fois. Je veux ma monnaie de suite."
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "Bâtisseur"
 gdp_trade_good_flavor.1020.desc: "L’horizon de [tgf_build_county.GetNameNoTier] est chargé d’échafaudages : [tgf_market_holder.Custom('FR_le_Char_Pi')][tgf_market_holder.GetTitledFirstName] bâtit partout où c’est possible, et naturellement, je lui envoie mes chariots transportant [tgf_good.Custom('GetTradeGood')]. Avec tous ces chantiers, l’idée lui est venue de me demander un tarif de bâtisseur : je lui livre [tgf_good.Custom('GetTradeGood')] pour moins cher jusqu’à la fin des constructions.\n\nChaque mur déjà érigé m’appartient donc à moitié."
 gdp_trade_good_flavor.1020.a: "C’est d'accord !"
 gdp_trade_good_flavor.1020.b: "Je veux bien accorder un tarif, mais pas de cadeaux."
 gdp_trade_good_flavor.1020.c: "Une faveur pour une faveur..."
 gdp_trade_good_flavor.1020.d: "Je garde la marchandise de qualité."
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "On apprend à tout âge"
 gdp_trade_good_flavor.1021.desc: "Les fins connaisseurs maîtrisent leur négoce sur le bout des doigts, pour autant, ils savent que l’on apprend à tout âge. Ce soir, j’aspire à approfondir mes connaissances : à la lueur d’une lampe, j’examine méticuleusement [tgf_good.Custom('GetTradeGood')] que contiennent mes [tgf_good.Custom('GetTradeGoodUnitPlural')].\n\nC’est ici que je découvrirai pourquoi ma marchandise se vend mieux que celle des autres."
 gdp_trade_good_flavor.1021.desc.livestock: "Les fins connaisseurs maîtrisent leur négoce sur le bout des doigts, pour autant, ils savent que l’on apprend à tout âge. Ce soir, j’aspire à approfondir mes connaissances : à la lueur d’une lanterne, j’examine méticuleusement [tgf_good.Custom('GetTradeGood')].\n\nC’est ici que je découvrirai pourquoi ma marchandise se vend mieux que celle des autres."
 gdp_trade_good_flavor.1021.desc.books: "Les fins connaisseurs maîtrisent leur négoce sur le bout des doigts, pour autant, ils savent que l’on apprend à tout âge. Ce soir, j’aspire à approfondir mes connaissances : à la lueur d’une lampe, je vais étudier tous les ouvrages en ma possession jusqu’à l’aube.\n\nC’est là-dedans que je découvrirai pourquoi ma marchandise se vend mieux que celle des autres."
 gdp_trade_good_flavor.1021.a: "Je garde celle-ci. Elle servira de talon pour le reste."
 gdp_trade_good_flavor.1021.b: "L’apprentissage est perpétuel."
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "Le titre de négoce"
 gdp_trade_good_flavor.1022.desc: "Sur les marchés de [tgf_source_county.GetNameNoTier], mon nom n’existe plus : à la place, tout le monde m’appelle [tgf_good.Custom('GetTgfGoodNickname')].\n\nLà où les liges décernent les titres de noblesse, les marchés décernent les titres de négoce, et un tel titre témoigne de tout le respect que la profession me porte."
 gdp_trade_good_flavor.1022.a: "C’est fort vulgaire, mais appréciable."
 gdp_trade_good_flavor.1022.b: "Ce titre devrait dynamiser les affaires."
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "Problèmes d’approvisionnement"
 gdp_trade_good_flavor.1023.desc: "« Vous achetez plus que ce que nous sommes capables de produire », m’explique [tgf_foreman.GetFirstName], [Select_CString(tgf_foreman.IsFemale,'contremaîtresse','contremaître')] de [tgf_source_county.GetNameNoTier], tandis que nous observons [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTgfGoodMade')]. « Nous manquons de mains. »\n\nEmbaucher des ouvriers me coûterait, mais sûrement moins que de refuser une vente."
 gdp_trade_good_flavor.1023.a: "Embauchez. Je paierai les salaires."
 gdp_trade_good_flavor.1023.b: "Venez travailler pour moi."
 gdp_trade_good_flavor.1023.c: "Montrez-moi comment vous faites."
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "Une fois, deux fois..."
 gdp_trade_good_flavor.1024.desc: "« Qui me fait une offre pour [tgf_good.Custom('GetTradeGood')] ? Quarante [tgf_good.Custom('GetTradeGoodUnitPlural')] ! » Au [tgf_source_province.Custom('GetRegionalMarketTerm')] de [tgf_source_county.GetNameNoTier], [tgf_rival.GetFirstName] de la [tgf_rival.Custom('GetTgfCompanyWord')|l] de la [tgf_rival.GetHouse.GetBaseNameNoTooltip], lève la main avant même que l’adjudicateur n’ait le temps de finir sa présentation.\n\n[tgf_rival.Custom('FR_IlElle')|U] m’adresse un sourire triomphant, pensant que ce lot lui appartient déjà..."
 gdp_trade_good_flavor.1024.a: "Je surenchéris. Ce lot est à moi."
 gdp_trade_good_flavor.1024.b: "Je fais monter les enchères, ça va lui coûter cher !"
 gdp_trade_good_flavor.1024.c: "Qu’[tgf_rival.Custom('FR_IlElle')] enchérisse, je ne m’en soucie guère."
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "Premiers arrivés, premiers riches"
 gdp_trade_good_flavor.1025.desc: "« Déjà vingt navires, mais je n’ai qu’une grue... » m’explique [tgf_docks_boss.GetFirstName], à la tête du port de [tgf_source_county.GetNameNoTier]. « Le premier à amarrer avec [tgf_good.Custom('GetTradeGood')] pourra fixer le prix pour le reste de la saison. Je peux faire amarrer le vôtre, si vous le souhaitez... »\n\n[tgf_docks_boss.Custom('FR_IlElle')|U] me tend sa main ouverte."
 gdp_trade_good_flavor.1025.a: "Je pourrai fixer les prix ainsi..."
 gdp_trade_good_flavor.1025.b: "Je vendrai ma marchandise sur le pont."
 gdp_trade_good_flavor.1025.c: "Je laisse ma place. Voyons quel prix proposent les autres."
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "L’abondance du peu"
 gdp_trade_good_flavor.1026.desc: "« [tgf_good.Custom('GetTgfGoodSmallest')|U] par [tgf_good.Custom('GetTgfGoodSmallest')] : voilà comment la plèbe achète », m’explique [tgf_stallholder.GetFirstName], propriétaire d’un étal au marché de [tgf_source_county.GetNameNoTier]. [tgf_stallholder.Custom('FR_IlElle')|U] divise ainsi [tgf_good.Custom('GetTradeGood')] que je lui fournis pour en faire des petits paquets qu’[tgf_stallholder.Custom('FR_IlElle')] vend un peu plus cher.\n\n« Tant que vous m’apportez des [tgf_good.Custom('GetTradeGoodUnitPlural')], vous aurez votre argent. »"
 gdp_trade_good_flavor.1026.a: "Vous en aurez autant qu’il vous en faudra."
 gdp_trade_good_flavor.1026.b: "Vendez ma marchandise au prix juste."
 gdp_trade_good_flavor.1026.c: "Prenez le lot."
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "Jour de marché"
 gdp_trade_good_flavor.1027.desc: "« Qui veut [tgf_good.Custom('GetTradeGood')] ! [tgf_good.Custom('GetTgfGoodLook')|U] ! Allez, allez ! On en profite ! » Le marché de [tgf_source_county.GetNameNoTier] bat son plein ce matin, à tel point que mon crieur parvient à peine à se faire entendre. Des clients venus des quatre coins du comté, réunis ici, la bourse pleine.\n\nIl faut les convaincre de la vider chez moi."
 gdp_trade_good_flavor.1027.a: "Je dois trouver un slogan accrocheur."
 gdp_trade_good_flavor.1027.b: "Tant pis, j’appâterai le chaland moi-même."
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "Devise étrangère"
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], un[tgf_buyer.Custom('FR_E')] client[tgf_buyer.Custom('FR_E')] de [tgf_source_county.GetNameNoTier], souhaite acheter [tgf_good.Custom('GetTradeGood')] que je vends avec ses [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]. [tgf_buyer.Custom('FR_IlElle')|U] ne cesse de répéter que l’argent, c’est de l’argent.\n\nCertes, mais lorsque je lui indique ce que sa monnaie vaut par rapport à la mienne, son sourire s’estompe rapidement."
 gdp_trade_good_flavor.1028.a: "Allez, je veux bien faire un geste."
 gdp_trade_good_flavor.1028.b: "Mon taux de change, sinon rien."
 gdp_trade_good_flavor.1028.c: "J’accepte [tgf_good_b.Custom('GetTradeGood')] comme monnaie d’échange."
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "Bilan de trois années"
 gdp_trade_good_flavor.1029.desc: "« Trois ans que cette route voit passer [tgf_good.Custom('GetTradeGood')] que vous négociez », se félicite [tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], en levant sa chope. « Et pas une seule marchandise perdue sous ma vigilance ! Pas une ! »\n\nEn réalité, [tgf_trader.Custom('FR_IlElle')] en a perdu cinq, mais je [tgf_trader.Custom('FR_LeLa')] laisse profiter de sa soirée."
 gdp_trade_good_flavor.1029.a: "Vous avez bien travaillé !"
 gdp_trade_good_flavor.1029.b: "Trinquons aux trois années à venir."
 gdp_trade_good_flavor.1029.c: "Nous irons bientôt plus loin, beaucoup plus loin."
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "Une qualité remarquable"
 gdp_trade_good_flavor.1030.desc: "« Ça, c’est typiquement [tgf_good.Custom('GetTradeGood')] de la Maison [ROOT.Char.GetHouse.GetName] ! [tgf_good.Custom('GetTgfGoodLook')|U] ! » s’extasie un[tgf_buyer.Custom('FR_E')] client[tgf_buyer.Custom('FR_E')] au marché de [tgf_source_county.GetNameNoTier] devant mes [tgf_good.Custom('GetTradeGoodUnitPlural')].\n\nComble de la situation, [tgf_buyer.Custom('FR_IlElle')] ignore qu’un[ROOT.Char.Custom('FR_E')] membre de la [ROOT.Char.GetHouse.GetName] se tient juste derrière [tgf_buyer.Custom('FR_LuiElle')].\n\nJe pourrais enchérir sur sa remarque, ou bien profiter de la cocasserie."
 gdp_trade_good_flavor.1030.a: "Je ne dirai rien."
 gdp_trade_good_flavor.1030.b: "Vous avez raison, je suis bien placé[ROOT.Char.Custom('FR_E')] pour le savoir."
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "Investissements étrangers"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] et [tgf_investor_b.GetFirstName], deux [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] de [tgf_source_county.GetNameNoTier], achètent depuis des années [tgf_good.Custom('GetTradeGood')] que je vends. Ces deux-là me proposent aujourd’hui de rejoindre mon négoce.\n\n« Un simple partenariat », m’assure [tgf_investor_a.GetFirstNameNoTooltip], tandis que [tgf_investor_b.GetFirstNameNoTooltip] compte la monnaie. « Nous saurons nous montrer discrets et généreux. »\n\nDiscrétion et générosité ne sont jamais des qualités que l’on retrouve chez des investisseurs."
 gdp_trade_good_flavor.1031.a: "Votre argent pour mes bénéfices... du moins, une partie."
 gdp_trade_good_flavor.1031.b: "Malheureusement, c'est une affaire de famille."
 gdp_tgf_kept_in_family_unity_desc: "Conserver l'affaire dans la famille"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "L’étal aux trésors"
 gdp_trade_good_flavor.1032.desc: "« Oh, [tgf_good.Custom('GetTradeGood')] ! C’est magnifique ! » Les clients ne cessent de complimenter ma marchandise. « Merci. [tgf_good.Custom('GetTgfGoodLook')|U]. Approchez, et admirez. »\n\nTout le monde sort de chez moi avec un souvenir impérissable de mon négoce."
 gdp_trade_good_flavor.1032.desc.livestock: "« Oh, [tgf_good.Custom('GetTradeGood')] ! C’est magnifique ! » Les clients ne cessent de complimenter ma marchandise. « Merci. [tgf_good.Custom('GetTgfGoodLook')|U]. Approchez, et admirez. »\n\nTout le monde sort de chez moi avec un souvenir impérissable de mon négoce, dans la tête ou sous les chausses."
 gdp_trade_good_flavor.1032.a: "Qu’ils admirent, c’est bonne réclame."
 gdp_trade_good_flavor.1032.b: "Tenez, cadeau de la maison."
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "Ne pas perdre la main"
 gdp_trade_good_flavor.1033.desc: "Un ancien fournisseur m’a écrit une lettre sur [tgf_good.Custom('GetTradeGood')] de cette année. Il m’a réservé les meilleures pièces au tarif habituel et me demande si cela m’intéresse.\n\nVoilà quelque temps que j’ai laissé de côté ce négoce, mais je sais encore repérer la qualité lorsque j’en vois. Mon expertise vaut toujours quelque chose, pour peu que je ne perde pas la main."
 gdp_trade_good_flavor.1033.a: "J’irai, pour voir si j’ai encore l’œil."
 gdp_trade_good_flavor.1033.b: "Mon expertise a un prix..."
 gdp_trade_good_flavor.1033.c: "Non, je ne traite plus dans [tgf_good.Custom('GetTradeGood')]."
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "Le guide"
 gdp_trade_good_flavor.1034.desc: "[tgf_pilgrim.GetFirstName], un[tgf_pilgrim.Custom('FR_E')] pèlerin[tgf_pilgrim.Custom('FR_E')] de passage à [tgf_source_county.GetNameNoTier], m’agite un petit carnet sous les yeux : « Chaque route, chaque auberge, chaque gué d’ici jusqu’à la mer se trouve là-dedans. En sus, une liste des marchés qui achètent [tgf_good.Custom('GetTradeGood')] à bon prix. Ce petit guide, je vous l’offre, moi aussi, à bon prix. »\n\nSes voyages ont atteint des contrées que mes chariots ignorent."
 gdp_trade_good_flavor.1034.a: "Votre prix sera le mien."
 gdp_trade_good_flavor.1034.b: "Je le recopierai dans la nuit et lui rendrai demain matin."
 gdp_trade_good_flavor.1034.c: "Parlez-moi des marchés, c’est tout ce qui m’intéresse."
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "Parler boutique"
 gdp_trade_good_flavor.1035.desc: "« Et donc, dans quel négoce versez-vous ? » me demande mon invité[tgf_guest.Custom('FR_E')], [tgf_guest.GetFirstName], durant notre balade digestive. Il ne m’en faut pas plus pour palabrer pendant de longues minutes : [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTgfGoodMade')], je pourrais en parler pendant des heures.\n\nDe tout mon laïus, pas une seule fois [tgf_guest.GetFirstName] n’a tenté de changer de sujet. C’est signe que ma marchandise l’intéresse."
 gdp_trade_good_flavor.1035.a: "Concluons notre accord en prenant le dessert, voulez-vous ?"
 gdp_trade_good_flavor.1035.b: "Et vous ? Quel est votre négoce ?"
 gdp_trade_good_flavor.1035.c: "Laissez-moi vous raconter ma première grosse vente."
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "Chargement optimisé"
 gdp_trade_good_flavor.1036.desc: "M[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], [tgf_trader.GetFirstName], m’explique sa nouvelle méthode de chargement : « Comme ça, on peut rajouter un tiers de [tgf_good.Custom('GetTradeGoodUnitPlural')] en plus. On en perdra une partie sur la route, certains acheteurs n’auront pas ce qu’ils ont commandé, mais la majorité sera servie. »\n\nLa majorité me sied à l’oreille, et certains devront s’en contenter."
 gdp_trade_good_flavor.1036.a: "Chargez à ras bord. Chargez les bénéfices."
 gdp_trade_good_flavor.1036.b: "Chargez consciencieusement. Les acheteurs ont l’œil."
 gdp_trade_good_flavor.1036.c: "Laissez tel quel. Ne changez rien."
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "Le sceau commercial"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "Un fonctionnaire exerçant au marché, assurant la qualité et la mesure des marchandises. Une fois vérifiés, un cachet de cire ou de plomb est apposé sur les produits. De nombreuses villes interdisent la vente de tissus et autres biens sans cachet. Le scelleur prend une taxe pour chaque sceau apposé."
 gdp_trade_good_flavor.1037.desc: "« La marchandise scellée se vend plus cher, c’est un fait », affirme [tgf_sealer.GetFirstName], [Glossary( 'scelleur', 'TGF_SEALER_GLOSS' )] du marché de [tgf_source_county.GetNameNoTier], sans même lever les yeux vers moi. « Mon sceau frappe dans l’ordre où l’on me paie, pas dans celui où l’on me demande. »\n\nPendant ce temps-là, mes chariots transportant mes [tgf_good.Custom('GetTradeGoodUnitPlural')] patientent au soleil. Mes profits risquent d’y fondre !"
 gdp_trade_good_flavor.1037.a: "J’attendrai. Il me faut ce sceau."
 gdp_trade_good_flavor.1037.b: "Tenez ! Scellez donc plus vite."
 gdp_trade_good_flavor.1037.c: "Ma réputation vaut tous les cachets de cire !"
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "Des acheteurs au-delà de l’horizon"
 gdp_trade_good_flavor.1038.desc: "[tgf_broker.GetFirstName], un[tgf_broker.Custom('FR_E')] [Select_CString(tgf_broker.IsFemale, 'courtière', 'courtier')] du marché de [tgf_source_county.GetNameNoTier], me sert une chope que je n’ai pas demandée : « Je connais des acheteurs dont vous ignorez l’existence, dans des villes qui vous sont inconnues. Fournissez-moi [tgf_good.Custom('GetTradeGood')], je vous rapporterai leur argent, en prenant ma commission. »\n\nUn négoce tripartite, mais je suis l’unique parti à qui l’on offre une bonne rasade."
 gdp_trade_good_flavor.1038.a: "Marché conclu. Allez les trouver."
 gdp_trade_good_flavor.1038.b: "Non merci, je sais trouver mes acheteurs."
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "L’apprenti[tgf_youth.Custom('FR_E')] négociant[tgf_youth.Custom('FR_E')]"
 gdp_trade_good_flavor.1039.desc: "« [tgf_youth.GetFirstName] compte plus vite que moi », affirme [tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], tandis qu’il pousse l’enfant devant moi. Avant même que je n’ouvre la bouche, [tgf_youth.Custom('FR_IlElle')] me donne le prix qui court pour [tgf_good.Custom('GetTradeGood')] sur nos deux marchés.\n\nUn enfant, ce sont des frais, mais un jeune esprit futé m’octroierait un beau retour sur investissement."
 gdp_trade_good_flavor.1039.a: "Très bien, je [tgf_youth.Custom('FR_LeLa')] prends."
 gdp_trade_good_flavor.1039.b: "Gardez-[tgf_youth.Custom('FR_LeLa')] avec vous. Apprenez-lui le métier."
 gdp_trade_good_flavor.1039.c: "On a assez de bouches à nourrir"
 gdp_tgf_family_only_unity_desc: "A réservé la compagnie à la famille"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "Brasse dorée"
 gdp_trade_good_flavor.1040.desc: "Il est déjà tard, l’entrepôt est désert à cette heure-ci... [tgf_good.Custom('GetTgfGoodLook')|U]... Des montagnes de marchandises. Je plonge la main dans [tgf_good.Custom('GetTradeGoodUnit')] devant moi, laissant s’échapper [tgf_good.Custom('GetTgfGoodSmallest')] après l’autre.\n\nSoudain, une idée saugrenue me vient. Et si... je nageais dedans ?"
 gdp_trade_good_flavor.1040.a: "Allons, tête la première !"
 gdp_trade_good_flavor.1040.a.toast: "Le plongeon risque de faire mal"
 gdp_trade_good_flavor.1040.b: "Non. Je vais tout recompter ! [tgf_good.Custom('GetTgfGoodSmallest')|U] par [tgf_good.Custom('GetTgfGoodSmallest')] !"
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "Le souvenir d’un succès"
 gdp_trade_good_flavor.1041.desc: "En vidant une malle, je retrouve par hasard, enveloppé dans un tissu, ma toute première marchandise vendue. À l’époque, je l’avais rachetée aussitôt, au double du prix, pour garder une relique de cet événement.\n\nLes émotions me submergent en l’observant après toutes ces années. Ma fortune s’est construite sur cette vente."
 gdp_trade_good_flavor.1041.a: "Je vais l’encadrer pour l’admirer tous les jours."
 gdp_trade_good_flavor.1041.b: "Un souvenir de mon succès. Je pourrai en tirer un bon prix."
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "Les sommes du sommeil"
 gdp_trade_good_flavor.1042.desc: "Tous les soirs désormais, je souhaite bonne nuit à mes piécettes, celles qui se trouvent dans la bourse sous mon oreiller : toute la recette que le négoce pour [tgf_good.Custom('GetTradeGood')] m’a rapporté cette saison.\n\nJe n’ai jamais connu d’oreiller plus dur ni d’oreiller plus onéreux."
 gdp_trade_good_flavor.1042.a: "Voilà qui m’aidera à faire de beaux rêves."
 gdp_trade_good_flavor.1042.b: "Pourquoi laisser mon argent dormir ? Je dois le réinvestir !"
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "Portrait aux pièces"
 gdp_trade_good_flavor.1043.desc: "[tgf_painter.GetFirstName], peintre de passage à [tgf_source_county.GetNameNoTier], s’arrête devant moi en m’encadrant le visage de ses pouces : « Je vous imagine à votre table, [tgf_good.Custom('GetTradeGood')] d’un côté, une montagne de monnaie de l’autre. J’ai un talent particulier pour faire ressortir l’[Glossary( 'éclat', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )] des pièces. »\n\nTalent et monnaie sont deux de mes spécialités."
 gdp_trade_good_flavor.1043.a: "Allez-y, et n’oubliez aucune pièce."
 gdp_trade_good_flavor.1043.b: "Faites-les plus grosses, ces pièces !"
 gdp_trade_good_flavor.1043.c: "Un peintre n’achète rien."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "Les marchands et les négociants de l’époque aimaient commander des portraits d’eux-mêmes en plein travail, entourés de leur argent et leurs marchandises. Petrus Christus, par exemple, dans Un orfèvre dans son atelier de 1449, peint un orfèvre pesant une alliance pour des fiancés."
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "Une bourse débordante"
 gdp_trade_good_flavor.1044.desc: "« Dois-je faire appel à un deuxième serviteur, [ROOT.Char.Custom('FormOfAddressForLiege')|l] ? » me demande [tgf_servant.GetFirstName]. Ma bourse est tellement pleine à craquer grâce au bon négoce qu’un serviteur la transporte difficilement.\n\nJe songe même à me procurer un chariot..."
 gdp_trade_good_flavor.1044.a: "Oui, appelez-en un autre. Et faites-y attention."
 gdp_trade_good_flavor.1044.b: "Non, je vais prendre un chariot. J’y ferai peindre mon nom !"
 gdp_trade_good_flavor.1044.c: "Nous en reparlerons après le marché, [tgf_servant.GetFirstNameNoTooltip]."
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "Bénéfices et bénédiction"
 gdp_trade_good_flavor.1045.desc: "Mes grands livres sont dédiés [ROOT.Char.GetFaith.HighGodName2] et aux bénéfices, comme les négociants les plus illustres le [Glossary( 'faisaient', 'TGF_DATINI_GLOSS' )]. Cette année, les bénéfices ont rempli quarante pages, mais pas une seule pièce n’est revenue [ROOT.Char.GetFaith.HighGodName2].\n\nLe code des commerçants stipule pourtant que tout partenaire mérite sa part."
 gdp_trade_good_flavor.1045.a: "Très bien, je donnerai sa part [ROOT.Char.GetFaith.HighGodName2]."
 gdp_trade_good_flavor.1045.b: "J’irai prier une heure [ROOT.Char.GetFaith.HighGodName], puis je retournerai aux comptes."
 gdp_trade_good_flavor.1045.c: "C'est [ROOT.Char.GetFaith.HighGodName] qui m’a prodigué ce talent. Ce serait L’insulter que de dilapider ma fortune."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "Dans la Torah, la Bible et le Coran, Joseph est appelé par le pharaon d’Égypte pour lire son rêve : sept vaches maigres dévorent sept vaches ventrues. Il y voit l’annonce de sept années d’abondance et sept années de disette. Grâce à lui, l’Égypte parvient à remplir ses greniers avant la famine."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "Francesco Datini, un marchand de Prato, intitulait tous ses livres de comptes #EMP Au nom de Dieu et du profit#! ; il mourut l’un des hommes les plus riches de Toscane."
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "Comme vous, comme moi"
 gdp_trade_good_flavor.1046.desc: "« La majorité des habitants de [tgf_source_county.GetNameNoTier] sont des [tgf_source_culture.GetCollectiveNoun], comme moi », m’explique m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], [tgf_trader.GetFirstName]. « On m’ouvre des portes qui restent définitivement fermées pour vous, on me fait des prix que les [ROOT.Char.GetCulture.GetCollectiveNoun] comme vous n’auront jamais. »\n\nJe sais que sa parole n’est pas offensante, aussi je préfère me concentrer sur les bénéfices de sa stratégie."
 gdp_trade_good_flavor.1046.a: "Très bien, je vous laisse négocier, désormais."
 gdp_trade_good_flavor.1046.b: "Tenez. Et ne les perdez pas."
 gdp_trade_good_flavor.1046.c: "Alors j’apprendrai vos us et coutumes."
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "Marché saturé"
 gdp_trade_good_flavor.1047.desc: "[tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], est hors de ses gonds : [tgf_rival.GetFirstName], de la [tgf_rival.Custom('GetTgfCompanyWord')|l] de la [tgf_rival.GetHouse.GetBaseNameNoTooltip] vend [tgf_good.Custom('GetTradeGood')] au marché de [tgf_source_county.GetNameNoTier] pour un prix si dérisoire que même le transport doit coûter plus cher.\n\nCette histoire éveille ma curiosité. À ce prix là, difficile de passer à côté... Je devrais peut-être acheter le tout."
 gdp_trade_good_flavor.1047.a: "Donnez [tgf_rival.GetFirstNameNoTooltip], donnez. Je prends tout."
 gdp_trade_good_flavor.1047.b: "[tgf_rival.GetFirstNameNoTooltip] vend assurément à perte. Je vendrai ma marchandise plus tard."
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "Un manuscrit parmi la marchandise"
 gdp_trade_good_flavor.1048.desc: "Parmi les [tgf_good.Custom('GetTradeGoodUnitPlural')] transportant [tgf_good.Custom('GetTradeGood')], il y avait des pages griffonnées pour garder la marchandise au sec. En y regardant de plus près, [tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], s’aperçoit qu’il s’agit d’un [Glossary( 'manuscrit', 'TGF_HOUSE_OF_WISDOM_GLOSS' )] qui va sûrement manquer à son propriétaire.\n\nJ’ai payé pour [tgf_good.Custom('GetTradeGood')], mais pas pour l’ouvrage, et pourtant ce dernier doit valoir plus cher que toute ma cargaison."
 gdp_trade_good_flavor.1048.a: "Je le garde."
 gdp_trade_good_flavor.1048.b: "Vendez-le avec [tgf_good.Custom('GetTradeGood')]."
 gdp_trade_good_flavor.1048.c: "Renvoyez-le en [tgf_source_county.GetNameNoTierNoTooltip]."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "Les livres voyageaient la plupart du temps grâce aux marchands. À Bagdad, dans la Maison de la sagesse, les érudits traduisaient en arabe toutes sortes de manuscrits provenant de Grèce, de Perse ou encore d'Inde. Ces traductions atteignaient ensuite le monde latin."
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "Les marchands émigrés"
 gdp_trade_good_flavor.1049.desc: "[tgf_trader.GetFirstName], m[tgf_trader.Custom('FR_OnA')] négociant[tgf_trader.Custom('FR_E')], m’écrit depuis [tgf_source_county.GetNameNoTier] : « J’y ai découvert avec stupeur tout un [Glossary( 'quartier', 'TGF_DIASPORA_GLOSS' )] de [ROOT.Char.GetCulture.GetCollectiveNoun], et à chacun d’entre eux, le pays leur manque. Lorsque je mentionne la Maison [ROOT.Char.GetHouse.GetBaseNameNoTooltip], leurs yeux s’illuminent, et tous se rassemblent autour de moi. »\n\nIl faut croire que le mal du pays est un marché très lucratif."
 gdp_trade_good_flavor.1049.a: "Vendez-leur la même chose qu’au pays."
 gdp_trade_good_flavor.1049.b: "Rapatriez leur doyen à ma compagnie."
 gdp_trade_good_flavor.1049.c: "Ils sont prêts à vider leur bourse pour se remémorer le pays."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "Au fil de leur itinérance, les marchands finissaient par s’installer à l’étranger et bâtissaient des quartiers pour rassembler leur communauté : les Sogdiens tout le long de la Route de la Soie, les Vénitiens à Constantinople, les Juifs du Caire à Aden. Leur communauté, restée au pays, commerçait grâce à eux."
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "Une astuce à moitié prix"
 gdp_trade_good_flavor.1050.desc: "On m’a présenté [tgf_smuggler.GetFirstName], une personne travaillant dans la [Glossary( 'contrebande', 'TGF_SMUGGLER_GLOSS' )] venue de [tgf_source_county.GetNameNoTier], qui a une astuce : dans chaque charrette [tgf_good.Custom('GetTradeGoodUnit')] du dessus est [tgf_good.Custom('GetTradeGoodUnit')] de la pire qualité qui soit – [tgf_good.Custom('GetTgfGoodFlaw')]. Ainsi, les percepteurs d’impôts [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] ne vont jamais chercher plus loin.\n\n« Tout ça, à moitié prix », explique [tgf_smuggler.GetFirstNameNoTooltip]. « Les [tgf_good.Custom('GetTradeGoodUnitPlural')] du dessous sont irréprochables. »"
 gdp_trade_good_flavor.1050.a: "À moitié prix, c’est dans mes prix"
 gdp_trade_good_flavor.1050.a.toast: "Le bruit court"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.Custom('FR_le_Char_Pi')|U][tgf_market_holder.GetTitledFirstNameNoTooltip] vous sera [Select_CString(tgf_market_holder.IsFemale,'reconnaissante','reconnaissant')]. Pour votre tête."
 gdp_trade_good_flavor.1050.c: "Vous trompez les percepteurs d’impôts ? Je vous engage."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "Dès que les dirigeants taxaient des marchandises, les contrebandiers leur passaient sous le nez. Le sel, taxé presque partout, rapportait le plus d’argent. Huang Chao, un contrebandier spécialisé dans le sel, a mené la rébellion pour s’emparer de la capitale de la dynastie Tang, Chang’an."
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "Une lourde récolte"
 gdp_trade_good_flavor.2001.desc: "Des nouvelles me parviennent de [tgf_source_county.GetNameNoTier], où j’achète [tgf_good.Custom('GetTradeGood')] dont j’ai besoin. Les paysans de culture [tgf_source_culture.GetName] ont ramené la récolte du siècle, si bien que les entrepôts ne sont pas assez grands.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "Des nouvelles me parviennent de [tgf_source_county.GetNameNoTier], où j’achète [tgf_good.Custom('GetTradeGood')] dont j’ai besoin. Les bergers de culture [tgf_source_culture.GetName] ont eu la meilleure année possible. Les enclos sont pleins à craquer, et les pâturages viennent à manquer.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "Une bonne année pour eux, un bon prix pour moi."
 gdp_trade_good_flavor.2001.a: "Gelez les prix pendant qu’ils font la fête."
 gdp_trade_good_flavor.2001.b: "Partez découvrir comment ils ont cultivé cela."
 gdp_trade_good_flavor.2001.b.livestock: "Partez découvrir comment ils ont élevé ces bêtes."
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "Le butin de chasse"
 gdp_trade_good_flavor.2002.desc: "« Les [tgf_good.Custom('GetTgfGoodGatherers')] de [tgf_source_county.GetNameNoTier] se sont surpassés », me dit [tgf_trader.GetFirstName], [Select_CString(trader.IsFemale,'ma négociante','mon négociant')]. « Ils nous ont livré en une seule fois [tgf_good.Custom('GetTradeGood')] d’une saison entière, de la meilleure qualité qui soit. Les offres affluent déjà. »\n\nTout vendre, ou garder la meilleure partie ? Le dilemme favori des marchands."
 gdp_trade_good_flavor.2002.a: "Vendez tout, tant que les prix sont élevés."
 gdp_trade_good_flavor.2002.b: "Je vais garder la meilleure partie."
 gdp_trade_good_flavor.2002.c: "Inondez les étales. Que tout le monde en profite."
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "Un riche filon"
 gdp_trade_good_flavor.2003.desc: "[tgf_trader.GetFirstName], [Select_CString(trader.IsFemale,'ma négociante','mon négociant')], vient me voir en souriant à son retour de [tgf_source_county.GetNameNoTier]. « Un nouveau filon, riche, peu profond. Tous font la queue pour creuser. Aujourd’hui, prix réduit sur [tgf_good.Custom('GetTradeGood')]. Et cela nous coûtera encore moins cher si nous investissons dans ce filon. »\n\nEn général, le prix des filons ne reste pas bas bien longtemps."
 gdp_trade_good_flavor.2003.desc.amber: "[tgf_trader.GetFirstName], [Select_CString(trader.IsFemale,'ma négociante','mon négociant')], vient me voir en souriant à son retour de [tgf_source_county.GetNameNoTier]. « Grâce aux tempêtes de l’automne, toutes les familles de la côte récoltent [tgf_good.Custom('GetTradeGood')] en abondance. Aujourd’hui, prix réduit sur [tgf_good.Custom('GetTradeGood')]. Et cela nous coûtera encore moins cher si c’est nous qui payons les récolteurs. »\n\nLa mer ne sera pas généreuse très longtemps."
 gdp_trade_good_flavor.2003.a: "Investissez dans l’excavation."
 gdp_trade_good_flavor.2003.a.amber: "Payez les récolteurs."
 gdp_trade_good_flavor.2003.b: "Achetez-en tant que les charrettes débordent."
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "Un secret qui en vaut la peine"
 gdp_trade_good_flavor.2004.desc: "« Nouvelle couleur ! » [Select_CString(trader.IsFemale,'Ma négociante','Mon négociant')], [tgf_trader.GetFirstName], m’a apporté un échantillon provenant de [tgf_source_county.GetNameNoTier], et la teinturerie m’assure que personne d’autre n’est au courant.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "« Nouvelle glaçure ! » [Select_CString(trader.IsFemale,'Ma négociante','Mon négociant')], [tgf_trader.GetFirstName], m’a apporté un échantillon provenant de [tgf_source_county.GetNameNoTier], et l’atelier m’assure que personne d’autre n’est au courant.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "Les secrets coûtent cher, mais les secrets exclusifs en valent la peine."
 gdp_trade_good_flavor.2004.a: "Donnez-moi votre prix. Ce secret est à moi."
 gdp_trade_good_flavor.2004.b: "Admirez, notez, passez à autre chose."
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "Goûter les marchandises"
 gdp_trade_good_flavor.2005.desc: "Un marchand se doit de connaître sa marchandise. Je goûte donc [tgf_good.Custom('GetTradeGood')] que je produis. Une fois par devoir, deux fois pour en avoir la certitude, et d’autres fois par pur plaisir. Le soir venu, [tgf_good.Custom('GetTradeGoodUnit')] a disparu.\n\nDélicieux. Les [tgf_source_culture.GetCollectiveNoun] paieraient le double du prix pour ça."
 gdp_trade_good_flavor.2005.a: "Le double. Ils paieront le double."
 gdp_trade_good_flavor.2005.b: "Mmh. Je dois regoûter, c’est une question de qualité."
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "Adapter sa tenue"
 gdp_trade_good_flavor.2006.desc: "Pour vendre [tgf_good.Custom('GetTradeGood')], il faut vous en parer. Je me rends au marché, ainsi habillé[ROOT.Char.Custom('FR_E')] des meilleures pièces de ma réserve, et regarde les acheteurs m’observer de la tête aux pieds.\n\nMes marchandises se vendent d’elles-mêmes."
 gdp_trade_good_flavor.2006.a: "Si cela me sied, je veux le garder."
 gdp_trade_good_flavor.2006.a.tt_furs: "Vous portez désormais votre cape de fourrure"
 gdp_trade_good_flavor.2006.a.tt_leather: "Vous portez désormais votre cape de cuir"
 gdp_trade_good_flavor.2006.a.tt_silk: "Vous portez désormais votre cape de soie"
 gdp_trade_good_flavor.2006.a.tt_textiles: "Vous portez désormais votre belle cape"
 gdp_trade_good_flavor.2006.b: "Laissez les marchandises parler d’elles-mêmes."
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "La valeur d’un visage"
 gdp_trade_good_flavor.2007.desc: "« Mon visage sera gravé sur les [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')] que nous allons frapper », me dit [tgf_market_holder.Custom('FR_le_Char_Pi')] [tgf_market_holder.GetTitledFirstName], « et avec [tgf_good.Custom('GetTradeGood')] que vous possédez. J’en veux un approvisionnement régulier, à prix d’ami. »\n\nSon visage, mon métal, une pièce. L’histoire se souviendra de nous deux."
 gdp_trade_good_flavor.2007.a: "Un prix d’ami ! La première est pour moi."
 gdp_trade_good_flavor.2007.b: "Vous paierez le prix fort. Une pièce est une pièce."
 gdp_trade_good_flavor.2007.c: "Un prix d’ami ? J’ai mieux à faire."
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "Intacts"
 gdp_trade_good_flavor.2008.desc: "« Voici [tgf_good.Custom('GetTradeGoodUnit')] que nous avions en partant, nous n’en avons rien perdu », me dit [tgf_trader.GetFirstName], [Select_CString(trader.IsFemale,'ma négociante','mon négociant')], , d’un air satisfait. « Rien n’a pourri, cassé, ou été volé. [tgf_good.Custom('GetTradeGoodUnit')|U] contenant [tgf_good.Custom('GetTradeGood')] que nous transportions est dans un état irréprochable. »\n\nCe n’est pas de la chance, mais du savoir-faire. Et cela s’apprend."
 gdp_trade_good_flavor.2008.a: "Montrez-moi comment vous avez emballé cela."
 gdp_trade_good_flavor.2008.b: "Quelle minutie. Impressionnant."
 gdp_trade_good_flavor.2008.c: "Prévenez les acheteurs. Les marchandises intactes se vendent cher."
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "Là où d’autres voient des armées"
 gdp_trade_good_flavor.2009.desc: "La guerre est arrivée aux portes [tgf_market_holder.Custom('FR_du_Char_Pi')] [tgf_market_holder.GetTitledFirstName], et en temps de guerre, [tgf_good.Custom('GetTradeGood')], ça part comme des petits pains. Ses quartiers-maîtres achètent tout ce que je transporte, et me demandent quand je reviendrai.\n\nLà où d’autres voient des armées, je vois des clients."
 gdp_trade_good_flavor.2009.a: "La guerre paie en avance."
 gdp_trade_good_flavor.2009.b: "Des privilèges, couchés sur papier, immédiatement."
 gdp_trade_good_flavor.2009.c: "Rappelez-vous qui vous a donné des armes."
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "La guilde toque"
 gdp_trade_good_flavor.2010.desc: "La guilde [tgf_source_culture.GetName|l] de [tgf_source_county.GetNameNoTier] m’écrit de manière très courtoise. Mes prix sont inférieurs aux siens, et elle aimerait que nous nous accordions sur un prix, avant que quiconque ne soit blessé.\n\nLa guilde toque courtoisement aujourd’hui, mais elle ne le fera qu’une fois."
 gdp_trade_good_flavor.2010.a: "Payez les frais. Fixez un prix."
 gdp_trade_good_flavor.2010.b: "Qu’ils frappent, je les attends."
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "Les dirigeants décident des tendances"
 gdp_trade_good_flavor.2011.desc: "Les rumeurs voyagent plus vite que les charrettes : [tgf_market_holder.Custom('FR_le_Char_Pi')] [tgf_market_holder.GetTitledFirstName] a porté [tgf_good.Custom('GetTradeGood')] provenant de mes ateliers avant le reste de la Cour de [tgf_source_county.GetNameNoTier], et la moitié d’entre eux a déjà demandé d’où cela venait.\n\nLes dirigeants décident des tendances, et les marchands du prix."
 gdp_trade_good_flavor.2011.a: "Dites à tout le monde qui a fabriqué [tgf_good.Custom('GetTradeGood')]."
 gdp_trade_good_flavor.2011.b: "Augmentez le prix pendant qu’ils admirent."
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "Tester la marchandise"
 gdp_trade_good_flavor.2012.desc: "Les [tgf_good.Custom('GetTradeGoodUnitPlural')] contenant [tgf_good.Custom('GetTradeGood')] me regardent. Ce mois fut sombre, ma tête refuse de se taire, et je suis devant la meilleure boisson qui existe.\n\nContrôle qualité. Personne n’aura à le savoir."
 gdp_trade_good_flavor.2012.a: "Contrôle de qualité. Sur la totalité."
 gdp_trade_good_flavor.2012.a.toast: "Un test de trop"
 gdp_trade_good_flavor.2012.b: "Non. On ne touche pas aux réserves."
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "Une commande de chef-d’œuvre"
 gdp_trade_good_flavor.2013.desc: "« Donnez-moi [tgf_good.Custom('GetTradeGood')] de la meilleure qualité et le prix d’un maître », dit [tgf_crafter.GetFirstName], [tgf_good.Custom('GetTgfGoodCrafter')] originaire de [tgf_source_county.GetNameNoTier] au talent extraordinaire, « et je vous fabriquerai une chose que nul n’a vue auparavant. »\n\nMa bourse hésite. Ma fierté a déjà accepté."
 gdp_trade_good_flavor.2013.a: "Le prix a été accepté. Surprenez-moi."
 gdp_trade_good_flavor.2013.b: "Mes marchandises n’ont nul besoin de tels ornements."
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "Leur plat, nos marchandises"
 gdp_trade_good_flavor.2014.desc: "« Ils mettent [tgf_good.Custom('GetTradeGood')] que vous produisez dans leur plat [tgf_source_province.Custom('GetTgfLocalDish')], maintenant », me rapporte [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')]. « En [tgf_source_county.GetNameNoTier], tout le monde le fait. Les cuisiniers appellent cela la nouvelle cuisine, et personne ne se rappelle l’ancienne. »\n\nJe n’ai jamais goûté leur plat [tgf_source_province.Custom('GetTgfLocalDish')], mais j’en ressens une immense fierté."
 gdp_trade_good_flavor.2014.a: "Dans ce cas, qu’ils paient le prix de leur nouvelle cuisine."
 gdp_trade_good_flavor.2014.b: "Plus de charrettes. Les cuisiniers ont faim."
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "Payés en marchandises"
 gdp_trade_good_flavor.2015.desc: "« Nous réclamons davantage de pièces », dit [tgf_spokesperson.GetFirstName], au nom des [tgf_good.Custom('GetTgfGoodGatherers')] de [tgf_source_county.GetNameNoTier]. À la place, je leur donnerai [tgf_good.Custom('GetTradeGood')] de mes greniers.\n\n« Puisque vous en ramassez, vous devez aimer ! » leur fais-je remarquer.\n\nIls n’aiment pas cela."
 gdp_trade_good_flavor.2015.a: "Payez-les. En pièces."
 gdp_trade_good_flavor.2015.b: "Faites-leur toucher une part des bénéfices."
 gdp_trade_good_flavor.2015.c: "Les marchandises sont aussi une forme de salaire."
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "L’argent n’empeste pas"
 gdp_trade_good_flavor.2016.desc: "« Cela empeste », dit un acheteur venu de [tgf_source_county.GetNameNoTier], tenant à bout de bras [tgf_good.Custom('GetTradeGood')] que je vends. [tgf_good.Custom('GetTgfGoodFlaw')|U], entends-je.\n\nJe saisis la pièce de l’acheteur et la renifle. [Glossary( 'Cela ne sent rien du tout', 'TGF_PECUNIA_NON_OLET_GLOSS' )]."
 gdp_trade_good_flavor.2016.a: "Vendez cela aux acheteurs atteints d’un rhume de cerveau."
 gdp_trade_good_flavor.2016.b: "Sans doute existe-t-il quelque chose pour remédier à l’odeur ?"
 gdp_trade_good_flavor.2016.c: "Je veux garder cette pièce sous le nez. Toute la journée."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#! — « L’argent n’empeste pas ». On dit que l’empereur romain Vespasian aurait maintenu sous le nez de son fils une pièce provenant de son impôt sur les urinoirs publics pour le prouver."
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "Sept années de vaches grasses"
 gdp_trade_good_flavor.2017.desc: "Je rêve de sept vaches grasses et sept autres vaches maigres[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')|l]. Je me réveille et fais le calcul avant le petit-déjeuner.\n\nQuoique les années maigres aient coûté, je vendrai [tgf_good.Custom('GetTradeGood')] à un prix plus élevé encore."
 gdp_trade_good_flavor.2017.a: "Entreposez [tgf_good.Custom('GetTradeGoodUnit')]. Absolument tout ce que nous avons."
 gdp_trade_good_flavor.2017.b: "Achetez-en plus, pendant que le prix est bas."
 gdp_trade_good_flavor.2017.c: "Les vaches ne sont pas des registres. Rendormez-vous."
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "Le bétail de quelqu’un"
 gdp_trade_good_flavor.2018.desc: "En sortant, je trouve mon portail bloqué par [tgf_good.Custom('GetTradeGood')], et [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], se tient au milieu en me souriant. « [tgf_raider.GetFirstName], une personne s’adonnant au [Glossary( 'pillage', 'TGF_CATTLE_RAID_GLOSS' )], a ramené cela des pâturages [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName]. Ne me demandez pas comment. La moitié du prix du marché. »\n\nLa marque de [tgf_market_holder.GetFirstNameNoTooltip] est sur leur flanc.\n\n« Une marque peut être remplacée par une autre », ajoute [tgf_trader.GetFirstNameNoTooltip]."
 gdp_trade_good_flavor.2018.a: "Un marché est un marché, quelle que soit la marque."
 gdp_trade_good_flavor.2018.a.toast: "Quelqu’un connaissait la marque"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'avez','a')] sciemment acheté des bêtes volées dans [Select_CString(CHARACTER.IsLocalPlayer,'vos','les')] troupeaux[CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')]."
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] sciemment acheté des bêtes volées dans [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'vos','les')] troupeaux[TARGET_CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')]."
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.Custom('FR_le_Char_Pi')|U][tgf_market_holder.GetTitledFirstName] me sera redevable."
 gdp_trade_good_flavor.2018.c: "Abattez-les vite."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "Attaquer les troupeaux du voisin était une vieille coutume, et une affaire sérieuse. Táin Bó Cúailnge, ou la Razzia des vaches de Cooley, raconte une guerre menée pour un simple taureau."
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "La soif d’une Cour à sec"
 gdp_trade_good_flavor.2019.desc: "« [tgf_good.Custom('GetTradeGood')|U], la Cour [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] n’en boit jamais », m’apprend [tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')]. « La Cour [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstNameNoTooltip] nous en a aussi commandé quarante [tgf_good.Custom('GetTradeGoodUnitPlural')]. Les deux affirmations sont vraies, apparemment. »\n\nLa foi de [tgf_market_holder.GetFirstNameNoTooltip] [Glossary( 'interdit de boire de l’alcool', 'TGF_ABU_NUWAS_GLOSS' )]. Mais rien n’interdit de le surfacturer."
 gdp_trade_good_flavor.2019.a: "Placez des étiquettes de vinaigre sur les tonneaux."
 gdp_trade_good_flavor.2019.b: "Doublez le prix. À qui iront-ils se plaindre ?"
 gdp_trade_good_flavor.2019.b.toast: "Un autre fournisseur"
 gdp_trade_good_flavor.2019.b.toast_good: "Payé en totalité"
 gdp_trade_good_flavor.2019.c: "Cela ne vaut pas mon cou. Vendez-les ailleurs."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "Le vin était interdit dans bien des Cours, et apprécié dans la plupart. Abu Nuwas, un poète à la Cour du calife Harun Al-Rashid, a écrit l’un des plus beaux poèmes sur le vin en arabe."
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "Une meule parfaite"
 gdp_trade_good_flavor.3001.desc: "Je sens son odeur dans l’entrepôt avant même de la voir. Une meule de fromage si affinée et riche que les portiers ont posté un garde devant, en plaisantant à moitié. À moitié.\n\nVendez-la et vous aurez de quoi acheter un festin. Gardez-la et elle vous servira de festin."
 gdp_trade_good_flavor.3001.a: "Protégez-la au péril de votre vie."
 gdp_trade_good_flavor.3001.b: "Tout a un prix. Même la perfection."
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "Une célèbre plainte"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "La plus vieille plainte de client qui existe : une tablette en argile venant d’Ur, datant de plus de trois mille ans, sur laquelle un certain Nanni reproche au marchand Ea-nasir de lui avoir livré des lingots de cuivre de mauvaise qualité et d’avoir traité son messager avec dédain."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.Custom('FR_le_Char_Pi')|U][tgf_market_holder.GetTitledFirstName] écrit que mes lingots sont de mauvaise qualité et bien trop légers. Je ne le nie pas.\n\n« Pour qui me prenez-vous, pour me traiter avec un tel [Glossary( 'dédain', 'TGF_EA_NASIR_GLOSS' )] ? »\n\nJe [tgf_market_holder.Custom('FR_LeLa')] prends pour [Select_CString(tgf_market_holder.IsFemale,'un bon client','une bonne cliente')]. [tgf_market_holder.Custom('FR_IlElle')|U] a déjà payé."
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.Custom('FR_IlElle')|U] m’en rachètera. [tgf_market_holder.Custom('FR_IlElle')|U] le fait toujours."
 gdp_trade_good_flavor.3002.a.toast: "Plus jamais ça"
 gdp_trade_good_flavor.3002.a.toast_good: "On en redemande"
 gdp_trade_good_flavor.3002.b: "Mon cuivre est véritable. Qu’[tgf_market_holder.Custom('FR_IlElle')] le teste !"
 gdp_trade_good_flavor.3002.b.toast_bad: "Pris au dépourvu"
 gdp_trade_good_flavor.3002.b.toast_good: "Le test se poursuit"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'vous ','')]a vendu[CHARACTER.LocalPlayerString('', 'Loc_FR_au_GetShortUIName')] des lingots légers en jurant qu’ils étaient vrais."
 rival_tgf_light_ingots_corresponding: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] vendu [TARGET_CHARACTER.Custom('FR_au_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] des lingots légers en jurant qu’ils étaient vrais."
 gdp_trade_good_flavor.3002.c: "Je veux des excuses et de meilleurs lingots la prochaine fois."
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "Payé en poivre"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "Le poivre valait presque son poids en argent, et était souvent utilisé comme monnaie d’échange. À Londres, les lois du roi Æthelred, autour de l’an 1 000, ont établi une partie du droit de péage que les marchands allemands devaient payer en poivre."
 gdp_trade_good_flavor.3003.desc: "[tgf_debtor.GetFirstName], l’un[tgf_debtor.Custom('FR_E')] de mes [Select_CString(tgf_debtor.IsFemale,'débitrices','débiteurs')] en [tgf_source_county.GetNameNoTier], n’a plus aucune pièce. Ainsi, [tgf_debtor.Custom('FR_IlElle')] paie en [Glossary( 'poivre', 'TGF_PEPPER_GLOSS' )] à la place, vidant ses poches en plaçant [tgf_good.Custom('GetTradeGoodUnit')] en sa possession, jusqu’à ce que ma table sente le marché aux épices.\n\nJe le compte deux fois. Son taux n’est pas mauvais. Et [tgf_debtor.GetFirstNameNoTooltip] n’est sûrement pas [Select_CString(tgf_debtor.IsFemale,'la seule','le seul')] dans ce cas."
 gdp_trade_good_flavor.3003.a: "Dorénavant, j’accepte le poivre."
 gdp_trade_good_flavor.3003.b: "Je veux des pièces. Trouvez de quoi payer."
 gdp_trade_good_flavor.3003.c: "Travaillez pour moi. Votre dette peut attendre."
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "Une lettre remplie de plaintes"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "Des lettres de marchands amoncelées durant des siècles (comme celles préservées dans la Guéniza du Caire, une pièce de synagogue dédiée aux papiers mis de côté) rendent compte du commerce méditerranéen de manière exhaustive et détaillée. Les négociants de lin sont ceux qui se plaignent le plus."
 gdp_trade_good_flavor.3004.desc: "[tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], a vendu toutes mes bottes de lin en [tgf_source_county.GetNameNoTier] pour un bon prix. C’est ce que dit sa [Glossary( 'lettre', 'TGF_GENIZA_GLOSS' )]. Sur une seule ligne. Les quarante autres ne sont que des plaintes : l’humidité, les porteurs, les acheteurs, mon emballage.\n\nLes profits d’abord, les ronchonnements après. L’inverse m’inquièterait."
 gdp_trade_good_flavor.3004.a: "Une seule ligne de profits. Je l’ai lue deux fois."
 gdp_trade_good_flavor.3004.b: "Quarante lignes de conseils gratuits."
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "Une subtilité"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "Un joyau de pâte à sucre et d’amande, servi entre les plats du festin – sous forme de châteaux, de bateaux et autres bêtes pour étonner les invités. Les plus grandes subtilités se trouvaient autant dans les discours politiques que dans les desserts."
 gdp_trade_good_flavor.3005.desc: "« [tgf_market_holder.Custom('FR_le_Char_U_Pi')|U][tgf_market_holder.GetTitledFirstName|U] veut un oiseau en sucre – de type [ROOT.Char.Custom('GetRandomRegionalBird')] », me dit [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName]. « De deux fois sa taille habituelle, sans plumes, sur sa table d’ici le milieu de l’été. Un [Glossary( 'entremets', 'TGF_SUBTLETY_GLOSS' )] pour finir son festin en beauté. »\n\nLe sucre, ça fond. La réputation, elle, reste."
 gdp_trade_good_flavor.3005.a: "Je le ferai. Plus grand que nature."
 gdp_trade_good_flavor.3005.a.success: "Le festin devint silencieux"
 gdp_trade_good_flavor.3005.a.failure: "Un oiseau de travers"
 gdp_trade_good_flavor.3005.b: "Qui dit jour de festin dit prix de festin."
 gdp_trade_good_flavor.3005.c: "Je vends du sucre, pas des sculptures."
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "L’essaim"
 gdp_trade_good_flavor.3006.desc: "Les abeilles sont arrivées sans prévenir, se sont installées dans le plafond, et produisent du miel dans mon entrepôt sans avoir demandé la permission.\n\nDes locataires qui paient en miel. Il y a pires arrangements... si l’on ne tient pas compte des piqûres."
 gdp_trade_good_flavor.3006.a: "Du miel gratuit. Cela ne coûte rien, non ?"
 gdp_trade_good_flavor.3006.a.toast: "Ça pique !"
 gdp_trade_good_flavor.3006.b: "Laissez-les travailler. Sans payer de loyer."
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "Une autre tasse de thé"
 gdp_trade_good_flavor.3007.desc: "Une tasse pour goûter la marchandise. Une autre, car la première a fonctionné. À minuit, j’ai recompté trois registres et rédigé deux lettres, et je me sens magnifiquement bien.\n\nIl s’agit là d’une cargaison de qualité, ou d’une habitude très onéreuse."
 gdp_trade_good_flavor.3007.a: "Une autre tasse. Tous les matins."
 gdp_trade_good_flavor.3007.b: "Servez-en à toute la compagnie."
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "Avant que ça ne tourne"
 gdp_trade_good_flavor.3008.desc: "[tgf_trader.GetFirstName], [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], ouvre [tgf_good.Custom('GetTradeGoodUnit')] contenant [tgf_good.Custom('GetTradeGood')] et grimace. « La brume de la rivière s’est faufilée à l’intérieur. C’est mou, pour le moment, mais d’ici la fin de semaine tout aura moisi. »\n\nLes fruits secs se gardent des années, et les fruits frais seulement quelques jours. Le temps, c’est de l’argent."
 gdp_trade_good_flavor.3008.a: "Asséchez-les de nouveau, et correctement."
 gdp_trade_good_flavor.3008.b: "Laissez-les fermenter. Nous dirons que c’est du vin."
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "L’huile de minuit"
 gdp_trade_good_flavor.3009.desc: "L’huile des lampes venant à manquer plus rapidement que les livres de comptes, je brûle [tgf_good.Custom('GetTradeGood')] des réserves que je devais vendre. Cela ne brûle pas mieux que les résidus troubles que nous jetons.\n\nPas mieux. Pourtant, les acheteurs paient trois fois le prix du marché."
 gdp_trade_good_flavor.3009.a: "Vendez les résidus pour les lampes, et l’huile de qualité pour les tables."
 gdp_trade_good_flavor.3009.b: "Continuez de brûler. Les comptes passent avant tout."
 gdp_trade_good_flavor.3009.c: "Au lit. L’huile peut se reposer, elle aussi."
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "En herbe"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "Les céréales achetées « en herbe » étaient payées alors qu’elles étaient encore vertes, à un prix bien inférieur à celui que leur récolte rapportait. Les prédicateurs et les canonistes condamnèrent cette pratique en la qualifiant d’usure déguisée."
 gdp_trade_good_flavor.3010.desc.condemned: "Ma foi appelle ça de l'usure, mon livre de comptes, une remise."
 gdp_trade_good_flavor.3010.desc.permitted: "Certaines fois appellent ça de l'usure, la mine de la prévoyance."
 gdp_trade_good_flavor.3010.desc.intro: "« Tout est vert pour le moment, mais ça deviendra doré d'ici l'été », me dit [tgf_peasant.GetFirstName] de [tgf_source_county.GetNameNoTier], de la boue aux genoux. « Payez-moi son prix actuel, [Glossary( 'encore verte', 'TGF_IN_THE_BLADE_GLOSS' )] et la récolte est vôtre. »\n\n"
 gdp_trade_good_flavor.3010.a: "La récolte de l'année prochaine au prix de celle de cette année."
 gdp_trade_good_flavor.3010.b: "Gardez vos cultures jusqu'à ce qu'elles soient mûres."
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "Millet de 10 ans"
 gdp_trade_good_flavor.3011.desc: "Derrière les nouveaux stocks, j'ai trouvé des [tgf_good.Custom('GetTradeGoodUnitPlural')] de millet d'il y a plusieurs années. Il a été oublié et mal compté. Chaque grain est encore bon. Le millet se conserve bien.\n\nDu stock gratuit venant du moi du passé. Il n'y a pas meilleur héritage."
 gdp_trade_good_flavor.3011.a: "Vendons. C'est ce que j'aurais voulu."
 gdp_trade_good_flavor.3011.b: "Gardons-le pour la route. Le millet se conserve."
 gdp_trade_good_flavor.3011.c: "Refaisons l'inventaire de tout l'entrepôt."
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "Raffiné ou non"
 gdp_trade_good_flavor.3012.desc: "Le riz raffiné est blanc, léger et recherché à toutes les tables d'honneur. Le riz complet est lourd, brun et demandé partout ailleurs. [Select_CString(tgf_trader.IsFemale,'Ma négociante','Mon négociant')], [tgf_trader.GetFirstName], veut savoir quel genre de marchand[ROOT.Char.Custom('FR_E')] je suis.\n\nJe suis du genre qui se fait payer."
 gdp_trade_good_flavor.3012.a: "Raffinons-le. Les tables d'honneur, ça paie plus."
 gdp_trade_good_flavor.3012.b: "Vendons-le complet et bon marché pour tout le monde."
 gdp_trade_good_flavor.3012.c: "Raffinons les meilleurs grains et vendons le reste comme il est."
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "Avant le jeûne"
 gdp_trade_good_flavor.3013.desc: "« Le [tgf_source_faith.Custom('GetTgfFastName')] commence bientôt ! » m'écrit [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName], de [tgf_source_county.GetNameNoTier] en catastrophe. « Personne ne mangera de viande pendant des semaines et après... ils ne voudront plus que ça. »\n\nUn acheteur affamé ne marchande jamais."
 gdp_trade_good_flavor.3013.desc_ramadan: "« Le Ramadan commence bientôt ! » m'écrit [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName], de [tgf_source_county.GetNameNoTier] en catastrophe. « Personne ne mange avant le coucher du soleil et après on ne veut que de la viande. »\n\nUn acheteur affamé ne marchande jamais."
 gdp_trade_good_flavor.3013.a: "Je jeûne aussi, la viande peut attendre."
 gdp_trade_good_flavor.3013.b: "Salons-la et attendons les affamés."
 gdp_trade_good_flavor.3013.c: "Vendons tout au dernier festin avant le jeûne."
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "On regarde les dents"
 gdp_trade_good_flavor.3014.desc: "[tgf_dealer.GetFirstName], [Select_CString(tgf_dealer.IsFemale,'la vendeuse','le vendeur')] de chevaux ne jure que par ce qu'[tgf_dealer.Custom('FR_IlElle')] trouve sacré. « Quatre ans, mon ami, cinq tout au plus. Et regardez-moi cette robe ! » La robe est très belle. Par contre, [tgf_dealer.Custom('FR_IlElle')] m'empêche de regarder ses dents.\n\nJe connais une expression sur les chevaux donnés. Et celui-ci n'a pas l'air d'être un cadeau."
 gdp_trade_good_flavor.3014.a: "Ouvrez-lui la bouche, je veux voir ces dents."
 gdp_trade_good_flavor.3014.b: "Vieux ou non, ce cheval est mien."
 gdp_trade_good_flavor.3014.c: "Votre parole est appréciée. Rejoignez donc ma compagnie."
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "Grossir pour le marché"
 gdp_trade_good_flavor.3015.desc: "« Le troupeau a atteint [tgf_source_county.GetNameNoTier] maigre et fatigué, semblable à des fantômes », me dit [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName]. « [tgf_market_holder.Custom('FR_le_Char_Pi')|U][tgf_market_holder.GetTitledFirstName] possède un pâturage à proximité et nous propose de l'utiliser. Contre rémunération, bien sûr. »\n\nLa graisse vend. Et l'herbe est moins chère que la graisse."
 gdp_trade_good_flavor.3015.a: "Payons pour l'herbe. Vendons-les gros."
 gdp_trade_good_flavor.3015.b: "Les bêtes maigres se vendent aussi."
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "Du vélin pour les scribes"
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.Custom('FR_le_Char_Pi')|U][tgf_chaplain.GetTitledFirstName], chapelain [tgf_market_holder.Custom('FR_du_Char_Pi')|U][tgf_market_holder.GetTitledFirstName], se promène dans ma tannerie comme un pèlerin choisissant des reliques. « Ceux-là, amincis, seront parfaits pour supporter les paroles sacrées pendant mille ans », dit-[tgf_chaplain.GetSheHe].\n\nMille ans de mon cuir. Pas si mal pour une vache."
 gdp_trade_good_flavor.3016.a: "Prenez les meilleurs, c'est cadeau."
 gdp_trade_good_flavor.3016.b: "Bon d'accord, pour les scribes. Et que ça dure."
 gdp_trade_good_flavor.3016.c: "Je préfère les vendre aux cordonniers."
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "Acheter la tonte"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "Les abbayes cisterciennes vendent la tonte de leurs moutons, celle d'une année, à des marchands italiens et flamands des années à l'avance, récupérant des pièces pour de la laine qui n'a pas encore poussé. De nombreuses Maisons s'endettent grandement dans le processus."
 gdp_trade_good_flavor.3017.desc: "« [tgf_abbot.Custom('FR_le_Char_Pi')|U][tgf_abbot.GetTitledFirstName] nous propose la laine de [tgf_abbey.GetNameNoTier] pour les années à avenir », m'explique [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName]. « [Glossary( 'Des années de tonte', 'TGF_WOOL_CLIP_GLOSS' )], achetées maintenant et livrées toison après toison. Ils veulent leurs pièces maintenant. »\n\nIls s'organisent sur le long terme, comme les marchands."
 gdp_trade_good_flavor.3017.a: "Des pièces maintenant, de la laine pendant des années."
 gdp_trade_good_flavor.3017.b: "Je préfère mes moutons déjà tondus."
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "L’agneau végétal"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "Voici une légende répétée autant par des voyageurs que par des érudits : dans l'Extrême-Orient pousse une plante donnant vie à des agneaux sur sa tige. Ces derniers broutent l'herbe autour jusqu'à ce qu'elle fâne. C'était une façon d'expliquer le coton : de la laine qui pousse sur des plantes."
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName|U], [Select_CString(tgf_buyer.IsFemale,'une acheteuse','un acheteur')] en [tgf_source_county.GetNameNoTier], tourne entre ses doigts une touffe de mon coton, émerveillé[tgf_buyer.Custom('FR_E')]. « Est-ce vrai ? On dit que ça pousse sur des plantes qui ont de petits agneaux, qui eux-mêmes broutent l'herbe dessous jusqu'à ce que la tige fâne. »\n\n[Glossary( 'L’agneau végétal', 'TGF_VEGETABLE_LAMB_GLOSS' )]. Les miracles se vendent bien."
 gdp_trade_good_flavor.3018.a: "Tout est vrai. Et c'est très rare."
 gdp_trade_good_flavor.3018.b: "Pas d'agneaux, c'est juste une plante duveteuse."
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "Spolia"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "Des pierres prises sur de vieux bâtiments pour en construire des nouveaux. Les colonnes, sculptures et blocs gravés de ruines anciennes ont trouvé une nouvelle place dans les églises, murs et maisons dans le monde médiéval."
 gdp_trade_good_flavor.3019.desc: "« Les carriers ont arrêté d'extraire des pierres », me confesse [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName], dans une lettre de [tgf_source_county.GetNameNoTier]. « Ils se servent dans les vieilles ruines, les colonnes, les sculptures, tout y passe. »\n\n[Glossary( 'Spolia', 'TGF_SPOLIA_GLOSS' )]. Vieille pierre, nouveau prix."
 gdp_trade_good_flavor.3019.a: "Des pierres antiques à un prix antique."
 gdp_trade_good_flavor.3019.b: "Gardez les meilleures sculptures pour moi."
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "Les troncs pour les mâts"
 gdp_trade_good_flavor.3020.desc: "« Les charpentiers de marine [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] veulent [tgf_good.Custom('GetTradeGood')] que nous possédons », m’explique [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName]. « Et pas n'importe quel bois. Les plus longs troncs droits que l'on possède, pour faire des mâts. Ils savent que le bois parfait est rare. »\n\nOn ne doit jamais vendre des choses rares dans la précipitation."
 gdp_trade_good_flavor.3020.a: "Les meilleurs troncs sont pour mon propre navire."
 gdp_trade_good_flavor.3020.b: "Vendu. Les mâts n'attendent personne."
 gdp_trade_good_flavor.3020.c: "Faisons-les attendre. Les prix augmenteront."
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "La tente de fumée"
 gdp_trade_good_flavor.3021.t_bhang: "Une tasse de bhang"
 gdp_trade_good_flavor.3021.t_hashish: "Des sucreries derrière des portes fermées"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "Hérodote a écrit que les scythes lançaient des graines de chanvre sur des pierres chauffées dans des tentes de feutre fermées et hurlaient de joie dans la fumée. Les peuples des steppes ont gardé la coutume longtemps après."
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.Custom('FR_IlElle')|U] lance des graines de chanvre sur les pierres chaudes de sa tente et de la fumée s'élève. « [Glossary( 'Respirez', 'TGF_HEMP_TENT_GLOSS' )], marchand[ROOT.Char.Custom('FR_E')]. C'est ainsi que nous faisons affaire ici. »\n\nC'est uniquement pour les affaires, évidemment."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "L'Atharva-Véda classe le bhang dans les cinq plantes sacrées. Les feuilles de chanvre sont moulues avec du lait, du ghee et des épices pour en faire une boisson consommée dans les festivals et offerte à Shiva."
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.Custom('FR_IlElle')|U] moud les feuilles de chanvre avec du lait et des épices et me donne une tasse. « Du [Glossary( 'bhang', 'TGF_HEMP_BHANG_GLOSS' )], marchand[ROOT.Char.Custom('FR_E')]. Pendant les festivals, tout le monde en boit. Ce soir, c'est votre tour. »\n\nCe serait très impoli de refuser et la grossièreté est mauvaise pour les affaires."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "Le haschisch, une résine de chanvre mangée dans des gâteaux et sucreries, s'est propagé dans l'Égypte et la Syrie au cours du douzième siècle. Certains soufis y voient un chemin vers l'extase, tandis que les juristes le condamnent et que les dirigeants en brûlent des champs entiers."
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.Custom('FR_IlElle')|U] ferme la porte et ouvre une petite sucrerie de résine de chanvre pressée. « Du [Glossary( 'haschisch', 'TGF_HEMP_HASHISH_GLOSS' )], marchand[ROOT.Char.Custom('FR_E')]. Les juristes désapprouvent, mais ils ne sont pas là. »\n\nCe serait grossier de dire non."
 gdp_trade_good_flavor.3021.desc.intro: "« [tgf_good.Custom('GetTradeGood')|U] [tgf_good.Custom('GetTgfHempUse')] ? » [tgf_hemp_host.Custom('FR_le_Char_Pi')|U][tgf_hemp_host.GetTitledFirstName] de [tgf_source_county.GetNameNoTier] rit. « Nous avons une meilleure utilité pour [tgf_good.Custom('GetTgfGoodItThem')]. »\n\n"
 gdp_trade_good_flavor.3021.a: "Les affaires sont les affaires. Faites passer les graines."
 gdp_trade_good_flavor.3021.a_bhang: "Les affaires sont les affaires. Faites passer la tasse."
 gdp_trade_good_flavor.3021.a_hashish: "Les affaires sont les affaires. Faites passer les sucreries."
 gdp_trade_good_flavor.3021.b: "Vendez-les et gardons l'esprit lucide."
 gdp_trade_good_flavor.3021.a.toast_habit: "Une nouvelle habitude"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "Une lame de qualité"
 gdp_trade_good_flavor.3022.desc: "[Select_CString(tgf_smith.IsFemale,'Une forgeronne','Un forgeron')] de [tgf_source_county.GetNameNoTier] du nom de [tgf_smith.GetFirstName] soupèse un de mes lingots de fer dans sa paume et sourit. « Donnez-moi vos meilleurs lingots et je vous offrirai une lame qui vaut dix fois le prix de son métal. »\n\nDix fois. [tgf_smith.Custom('FR_IlElle')|U] sait comment parler à un[ROOT.Char.Custom('FR_E')] marchand[ROOT.Char.Custom('FR_E')]."
 gdp_trade_good_flavor.3022.a: "Forgez-la. Et qu’elle soit à la hauteur de votre vantardise."
 gdp_trade_good_flavor.3022.b: "Expliquez-moi quels lingots sont les meilleurs."
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "La prétention du lapidaire"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "Spécialiste de la taille et du polissage de pierres précieuses, mais aussi avide de lecture de revendications : des livres listant les pouvoirs cachés de chaque pierre, du saphir contre le poison à l'améthyste contre l'ivresse."
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U], [Select_CString(tgf_lapidary.IsFemale,'une','un')] [Glossary( 'lapidaire', 'TGF_LAPIDARY_GLOSS' )] de [tgf_source_county.GetNameNoTier] observe une de mes pierres précieuses sous la lumière avec un grand sérieux. « Cette pierre repousse [ROOT.Char.Custom('GetTgfAilment')], c'est écrit dans les livres. »\n\nMais ce n'est pas encore écrit dans le prix."
 gdp_trade_good_flavor.3023.a: "Vendu avec l'affirmation. Et le prix qui va avec."
 gdp_trade_good_flavor.3023.b: "Rejoignez ma compagnie, venez avec vos livres."
 gdp_trade_good_flavor.3023.c: "Je ne vais pas argumenter contre les livres."
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "La pierre du gentilhomme"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], [Select_CString(tgf_connoisseur.IsFemale,'une connaisseuse','un connaisseur')] des jades, tapote chacun de mes articles contre ses dents et tend l'oreille. [tgf_connoisseur.Custom('FR_IlElle')|U] en met deux de côtés. « Stéatite, très bonne stéatite. » Les autres obtiennent un lent hochement de tête approbateur.\n\n[Select_CString(tgf_connoisseur.IsFemale,'Une connaisseuse','Un connaisseur')] qui sait déterminer le vrai du faux a bien plus de valeur que l'un ou l'autre."
 gdp_trade_good_flavor.3024.a: "Brisez les faux. Donnez le nom du fournisseur."
 gdp_trade_good_flavor.3024.b: "Rejoignez ma compagnie. Vos yeux valent un bon salaire."
 gdp_trade_good_flavor.3024.c: "Expliquez-moi votre astuce avec les dents."
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "Ballast de porcelaine"
 gdp_trade_good_flavor.3025.desc: "[Select_CString(tgf_trader.IsFemale,'Ma négociante','Mon négociant')], [tgf_trader.GetFirstName], se félicite. « Le navire avait besoin d'un ballast et nos [tgf_good.Custom('GetTradeGoodUnitPlural')] de céramiques pèsent leur poids. Le capitaine ne nous a presque rien fait payer. »\n\nUne cargaison qui paie sa traversée elle-même. Mes préférés."
 gdp_trade_good_flavor.3025.a: "Mettez les économies faites dans la prochaine cargaison."
 gdp_trade_good_flavor.3025.b: "Apprenez à les arrimer comme un ballast."
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "Les morsures de la sève"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "La laque ne sèche pas à l'air libre. Chaque couche de sève doit durcir pendant des jours dans une pièce humide et chaude et il faut une dizaine de couches par article. La sève brûle la peau au toucher pendant qu'elle durcit."
 gdp_trade_good_flavor.3026.desc: "Les [tgf_good.Custom('GetTradeGoodUnitPlural')] de laque sont là avant que la dernière couche n’ait [Glossary( 'durci', 'TGF_LACQUER_CURE_GLOSS' )]. La finition est superbe : la couleur est profonde, brillante, presque mouillée. Mes doigts me démangent de la toucher.\n\nLes artisans du laque disent que la sève brûle. Je pense qu'ils exagèrent."
 gdp_trade_good_flavor.3026.a: "Construisez une pièce humide pour que les pièces durcissent correctement."
 gdp_trade_good_flavor.3026.b: "Touchez-la juste une fois, pour être sûr."
 gdp_trade_good_flavor.3026.b.toast_rash: "Les morsures de la laque"
 gdp_trade_good_flavor.3026.c: "Laissons-le durcir. Les bonnes choses peuvent attendre."
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "Des pierres de vue"
 gdp_trade_good_flavor.3027.desc.intro: "[Select_CString(tgf_glassmaker.IsFemale,'Une verrière','Un verrier')] de [tgf_source_county.GetNameNoTier] du nom de [tgf_glassmaker.GetFirstName] pose sur mon livre de comptes deux pierres polies. Les petits nombres enflent, nets et noirs. « Pour les yeux vieillis, mon ami[ROOT.Char.Custom('FR_E')], ou fatigués. »\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "Dans mon cas, ce sont les deux. Pour la première fois depuis des années, je peux lire les petites écritures sur chaque contrat."
 gdp_trade_good_flavor.3027.desc.young_eyes: "Dans mon cas, aucun des deux. Mais je peux lire les petites écritures sur chaque contrat maintenant."
 gdp_trade_good_flavor.3027.a: "Je vous en prends une paire. Emballez-les bien."
 gdp_trade_good_flavor.3027.b: "Envoyez une paire [tgf_market_holder.Custom('FR_au_Char_Pi')][tgf_market_holder.GetTitledFirstNameNoTooltip]."
 gdp_trade_good_flavor.3027.c: "Pas les pierres, mais leur secret."
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "Les prix d'un jour de fête"
 gdp_trade_good_flavor.3028.desc.christian: "« Les jours saints arrivent bientôt », me dit [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName], tout juste arrivé[tgf_trader.Custom('FR_E')] de [tgf_source_county.GetNameNoTier]. « Tous les acheteurs veulent de l'encens à la hauteur des Rois mages et personne ne marchande ce qu'ils vont brûler à l'autel. »\n\n"
 gdp_trade_good_flavor.3028.desc: "« Les jours saints arrivent bientôt », me dit [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')], [tgf_trader.GetFirstName], tout juste arrivé[tgf_trader.Custom('FR_E')] de [tgf_source_county.GetNameNoTier]. « Tous les acheteurs veulent de l'encens adapté au lieu saint et personne ne marchande ce qu'ils vont brûler à l'autel. »\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "Un acheteur qui ne marchande pas est un cadeau [ROOT.Char.GetFaith.HighGodNamePossessive]."
 gdp_trade_good_flavor.3028.a: "Je vais en brûler aussi, pour la fête."
 gdp_trade_good_flavor.3028.b: "Le temple choisira en premier, à prix coûtant."
 gdp_trade_good_flavor.3028.c: "Jours de fête, prix de fête."
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "Thériaque"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "Une préparation célèbre contenant plus d'une dizaine d'ingrédients, dont souvent de la chair de vipère et de l'opium, et qui doit fermenter pendant des années. Les médecins en prescrivent contre le poison, la peste et en fait, à peu près tout."
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U], [Select_CString(tgf_apothecary.IsFemale,'une','un')] apothicaire, a envoyé une lettre sentant les herbes. « Vous avez exactement ce dont j'ai besoin pour ma [Glossary( 'thériaque', 'TGF_THERIAC_GLOSS' )]. Contre les poisons, la peste et tous les autres maux. »\n\nQue cela fonctionne ou pas, c'est son problème et celui de ses patients. Le mien, c'est de vendre."
 gdp_trade_good_flavor.3029.a: "Préparez-en et vendez-les sur mes routes."
 gdp_trade_good_flavor.3029.b: "Les soixante-quatre ingrédients. De ma part."
 gdp_trade_good_flavor.3029.c: "Apprenez-moi la recette. Et donnez-moi une dose."
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "Pas de papier pour les chartes"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "En 1231, l'Empereur Frédéric II a interdit aux notaires de son Royaume de Sicile d'écrire des documents publics sur du papier, qu'il trouvait bien trop fragile. Seuls les parchemins convenaient."
 gdp_trade_good_flavor.3030.desc: "« Les employés [tgf_market_holder.Custom('FR_du_Char_Pi')][tgf_market_holder.GetTitledFirstName] [Glossary( 'ne toucheront pas au papier', 'TGF_PAPER_GLOSS' )] pour tout ce qui est officiel », m'explique [Select_CString(tgf_trader.IsFemale,'ma négociante','mon négociant')] de retour de [tgf_source_county.GetNameNoTier] et toujours déguisé[tgf_trader.Custom('FR_E')]. « Ils ne veulent que des parchemins. Comme s'ils étaient sacrés. »\n\nOn peut contester toutes les règles."
 gdp_trade_good_flavor.3030.a: "Contestez la situation, le papier, c'est le futur."
 gdp_trade_good_flavor.3030.a.success: "La chancellerie prend le papier"
 gdp_trade_good_flavor.3030.a.failure: "La chancellerie continue avec les parchemins"
 gdp_trade_good_flavor.3030.b: "Dans ce cas, ils achèteront mon parchemin."
 gdp_trade_good_flavor.3030.c: "Dans ce cas, j'apprendrai ce qu'ils veulent."
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "Gruit ou houblon"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "Un mélange d'herbes comme de la myrica et de l'achillée qui donnaient du goût et conservaient la bière avant le houblon. De nombreux dirigeants étaient les seuls à pouvoir le vendre et taxaient donc chaque préparation."
 gdp_trade_good_flavor.3031.desc: "« Du houblon », murmure [tgf_brewer.GetFirstName], [Select_CString(tgf_brewer.IsFemale,'une brasseuse','un brasseur')], au dessus de mes tonneaux. « Une bière qui se conserve pendant des mois. Et personne ne peut taxer le houblon. » En [tgf_source_county.GetNameNoTier], tous les brasseurs doivent acheter leurs [Glossary( 'gruits', 'TGF_GRUIT_GLOSS' )] et payer la taxe correspondante.\n\nQuelqu'un paie toujours pour le progrès."
 gdp_trade_good_flavor.3031.a: "On continue donc avec le houblon. Faisons-le voyager."
 gdp_trade_good_flavor.3031.b: "Du gruit, comme [tgf_market_holder.Custom('FR_le_Char_L')][tgf_market_holder.GetTitleAsNameNoTooltip|l] le préfère."
 gdp_trade_good_flavor.3031.c: "Un peu de chaque, dans tous les tonneaux."
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "Un panier de fruits"
 gdp_trade_good_flavor.3032.desc: "En [tgf_source_county.GetNameNoTier], on mange des [tgf_fruit_province.Custom('get_region_fruit_plural')] par panier entier et quasiment aucun fruit ne dépasse le village suivant.\n\nSéchés, ils se conserveraient bien. Expédiés, ils se vendraient. J'en mange un et je récupère mon livre de comptes."
 gdp_trade_good_flavor.3032.a: "Trouvez qui en fait pousser et dans quelle quantité."
 gdp_trade_good_flavor.3032.b: "Encore un autre. Pour la science."
