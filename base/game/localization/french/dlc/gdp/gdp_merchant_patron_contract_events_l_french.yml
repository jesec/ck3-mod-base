l_french:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName] : les [patron.Custom('GetRoomPlural')|U] [patron.Custom('FR_du_Char_L')][patron.GetTitleAsNameNoTooltip|l]"
 gdp_merchant_patron_contract.0001.desc: "[patron.Custom('FR_le_Char_Pi')|U][patron.GetTitledFirstName] est [Select_CString(patron.IsFemale,'une femme','un homme')] remarquable. Des nobles, des prêtres, des marchands et des roturiers de tout le pays et d’ailleurs rivalisent pour attirer son attention et obtenir son soutien.\n\nNous devons faire preuve de franchise, mais aussi agir avec prudence si nous voulons nous assurer que la compagnie continue de bénéficier de ses faveurs et ne soit pas supplantée par un rival plus rusé, ni ne perde complètement son attention.\n\nNos activités doivent continuellement occuper les discussions des notables de [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$ : réussite !"
 gdp_merchant_patron_contract.0002.desc: "[patron.Custom('FR_le_Char_Pi')|U][patron.GetTitledFirstName] n’a pas pu résister à mes récits sur des contrées lointaines et les mondes du commerce qui s’entrecroisent, et chaque soir, à table, [patron.Custom('FR_IlElle')] est suspendu[patron.Custom('FR_E')] à mes lèvres.\n\nJe peux retourner auprès de la compagnie l’esprit tranquille, sachant que [patron.GetFirstNameNoTooltip] nous considère comme des partenaires précieux et des amis bienvenus.\n\nNotre réputation s’est considérablement renforcée à [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] et, sans aucun doute, la nouvelle de mon influence me précédera dans des contrées encore plus lointaines."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$ : échec !"
 gdp_merchant_patron_contract.0003.desc: "[patron.Custom('FR_le_Char_Pi')|U][patron.GetTitledFirstName] me demande de moins en moins de l’accompagner. Ai-je fait quelque chose de mal ? L’attitude différente des courtisans de [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] me confirme son mécontentement.\n\nMes récits l’ont-ils ennuyé[patron.Custom('FR_E')] ? Ai-je trop commenté les caprices du commerce ? Ai-je franchi une limite invisible de la noblesse ?\n\nNous ne pouvons rien faire d’autre que retourner à la compagnie, limiter la casse et remettre les choses sur la bonne voie..."
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "Mécène impressionné"
 gdp_impressed_patron_modifier_desc: "Les efforts déployés par ce commerçant pour se faire bien voir ont impressionné son mécène."
 gdp_impressed_patron_critical_modifier: "Mécène impressionné"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "Mécène dédaigneux"
 gdp_dismissive_patron_modifier_desc: "Les efforts déployés par ce commerçant pour se faire bien voir ont déçu son mécène."
