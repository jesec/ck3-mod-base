l_french:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName] : Chercher à obtenir des avantages"
 gdp_merchant_scheme_advantage.1000.intro: "Je réfléchis à la manière dont nous pourrions faire avancer nos affaires ici à [task_contract_location.GetBaronyNameExplicitly] et pense à"
 gdp_merchant_scheme_advantage.1000.intro.rival: "notre concurrent[rival.Custom('FR_E')], [rival.Custom('FR_le_Char_Pi')][rival.GetTitledFirstName], et à la façon dont sa présence nous en empêche."
 gdp_merchant_scheme_advantage.1000.intro.partner: "[Select_CString(portrait.IsFemale,'ma','mon')] partenaire, [portrait.Custom('FR_le_Char_Pi')][portrait.GetTitledFirstName], pour des solutions."
 gdp_merchant_scheme_advantage.1000.intro.agent: "mon associé[portrait.Custom('FR_E')], [portrait.Custom('FR_le_Char_Pi')][portrait.GetTitledFirstName], pour des solutions."
 gdp_merchant_scheme_advantage.1000.intro.trader: "[Select_CString(portrait.IsFemale,'ma','mon')] négociant[portrait.Custom('FR_E')], [portrait.Custom('FR_le_Char_Pi')][portrait.GetTitledFirstName], pour des solutions."
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nSi seulement [portrait.Custom('FR_le_Char_Pi')][portrait.GetTitledFirstNameNoTooltip] voulait bien enfin prendre les choses au sérieux et y accorder toute son attention, nous pourrions certainement en finir au plus vite..."
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nSi seulement la compagnie pouvait faire front commun et se donner à fond, nous pourrions certainement en finir au plus vite..."
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nPeut-être devrais-je, pour le bien de la compagnie, retrousser mes manches et essayer enfin d’accomplir quelque chose, afin que nous puissions passer à autre chose..."
 gdp_merchant_scheme_advantage.1000.a: "« Pourquoi est-ce que je vous paie, [portrait.GetTitledFirstNameNoTooltip] ?! »"
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.Custom('FR_le_Char_Pi')|U][portrait.GetTitledFirstNameNoTooltip] est sous pression"
 gdp_merchant_scheme_advantage.1000.b: "« Il faut que toute la compagnie se mette enfin au travail ! »"
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] La [company|El] est sous pression"
 gdp_merchant_scheme_advantage.1000.c: "« Je n’ai pas d’autre choix que de le faire moi-même ! »"
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] Vous êtes sous pression"
 gdp_merchant_scheme_advantage.1000.d.associate: "« Allez, [portrait.GetFirstNameNoTooltip], vous pouvez sûrement faire mieux que ça. »"
 gdp_merchant_scheme_advantage.1000.d.unity: "« Cette compagnie est pleine de fainéants ! »"
 gdp_merchant_scheme_advantage.1000.d.stress: "« Il ne me reste plus qu’à travailler encore un peu... »"
 gdp_merchant_scheme_advantage.1000.e: "« Finalement, oublions cela... »"
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName] et moi nous retrouvons tous les jours pour discuter des meilleurs moyens de nous rapprocher de notre objectif. [Select_CString(trader.IsFemale,'Ma négociante','Mon négociant')] ne cesse de souligner notre manque d’hommes de confiance à [task_contract_location.GetBaronyNameExplicitly].\n\n« Vous savez, soupire [trader.GetFirstNameNoTooltip], il y a quelqu’un là-bas qui pourrait nous aider."
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetFirstName] est son nom, [Select_CString(recruit.IsFemale,'une servante','un serviteur')] [recruit_liege.Custom('FR_du_Char_Pi')][recruit_liege.GetTitledFirstName] de [recruit_liege.GetPrimaryTitle.GetName]... »"
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetFirstName] est son nom, un agent local qui facilite les échanges commerciaux... »"
 gdp_merchant_scheme_advantage.1010.a: "« Laissez-moi lui parler... »"
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! Vous misez sur votre charme"
 gdp_merchant_scheme_advantage.1010.b: "« Amenez cette personne ici, quoi qu’il en coûte. »"
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! Vous misez sur le profit"
 gdp_merchant_scheme_advantage.1010.e: "« Pff, [recruit.Custom('FR_IlElle')] n’en vaut pas la peine. »"
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName] et moi nous retrouvons tous les jours pour discuter des meilleurs moyens de nous rapprocher de notre objectif. Finalement, [Select_CString(trader.IsFemale,'ma négociante','mon négociant')] évoque notre [charter.GetName] et le fait que cela pourrait nous être utile pour ouvrir les portes qui nous sont actuellement fermées à [task_contract_location.GetBaronyNameExplicitly].\n\n« Après tout, pourquoi ne ferions-nous pas bon usage du document [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstName] ? » demande-t-[patron.Custom('FR_IlElle')] en souriant."
 gdp_merchant_scheme_advantage.1020.a: "« Oui, je suis sûr[ROOT.Char.Custom('FR_E')] que nous avons le soutien [patron.Custom('FR_du_Char_L')][patron.GetTitleAsNameNoTooltip|l] ! »"
 gdp_merchant_scheme_advantage.1020.b: "« Notre charte parle en effet d’elle-même. »"
 gdp_merchant_scheme_advantage.1020.e: "« Ce n’est pas le moment. »"
