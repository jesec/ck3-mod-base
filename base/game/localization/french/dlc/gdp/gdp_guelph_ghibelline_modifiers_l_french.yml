l_french:
 guelph_member_modifier: "Guelfe"
 guelph_member_modifier_desc: "Ce personnage soutient le droit du pape de nommer et d’élire son propre clergé."
 ghibelline_member_modifier: "Gibelin"
 ghibelline_member_modifier_desc: "Ce personnage défend le droit des monarques d’exercer une influence sur leurs vassaux religieux et d’exiger leur allégeance."
 left_guelphs_modifier: "Ancien guelfe"
 left_guelphs_modifier_desc: "Ce personnage s’est engagé aux côtés des guelfes dans le conflit entre guelfes et gibelins."
 left_ghibellines_modifier: "Ancien gibelin"
 left_ghibellines_modifier_desc: "Ce personnage s’est engagé aux côtés des gibelins dans le conflit entre guelfes et gibelins."
 gg_sworn_neutral_modifier: "A juré de rester neutre"
 gg_sworn_neutral_modifier_desc: "Ce personnage s’est engagé par divers moyens à rester neutre dans le conflit entre guelfes et gibelins."
 guelph_victor_modifier: "$guelph_member_modifier$ fier"
 guelph_victor_modifier_desc: "Ce personnage a soutenu la papauté finalement victorieuse dans le conflit entre guelfes et gibelins."
 favored_by_pope_modifier: "Favori du pape"
 favored_by_pope_modifier_desc: "Ce personnage bénéficie de la bienveillance du pape et jouit de certains privilèges."
 guelph_loser_modifier: "$guelph_member_modifier$ déshonoré"
 guelph_loser_modifier_desc: "Ce personnage a soutenu le camp perdant dans le conflit entre guelfes et gibelins."
 ghibelline_victor_modifier: "$ghibelline_member_modifier$ fier"
 ghibelline_victor_modifier_desc: "Ce personnage a soutenu l’empire finalement victorieux dans le conflit entre guelfes et gibelins."
 scorned_pope_modifier: "A méprisé le pape"
 scorned_pope_modifier_desc: "Ce personnage a suscité la colère du pape, ce qui a tendu les relations."
 ghibelline_loser_modifier: "$ghibelline_member_modifier$ déshonoré"
