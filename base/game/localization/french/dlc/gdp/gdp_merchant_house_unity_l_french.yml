 unity_merchant_promote_excess_decision_desc: "Pour améliorer notre statut, nous devons manger, boire et parler comme des nobles. Ainsi, un jour, nous deviendrons ce que les autres perçoivent de nous."
 unity_merchant_promote_excess_decision_tooltip: "Dépenser de l'[gold|El] pour pousser l'[company_sentiment|El] vers [company_sentiment_concerted|E][company_sentiment_concerted_i] et améliorer le gain de [prestige|El] pour les membres de votre [house|E]"
