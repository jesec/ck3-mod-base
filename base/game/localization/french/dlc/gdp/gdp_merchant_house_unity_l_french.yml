 merchant_unity_strong_leadership_desc: "A démontré la fiabilité de la direction de la compagnie"
 merchant_unity_poor_leadership_desc: "A démontré la fragilité de la direction de la compagnie"
 merchant_unity_company_in_debt_desc: "a laissé la compagnie souffrir d’une dette pendant une période prolongée"
 unity_merchant_promote_diligence_decision: "Promouvoir la diligence"
 unity_merchant_promote_diligence_decision_desc: "Pour garder notre place dans les marchés, tous nos membres doivent penser au profit avant leur confort jusqu'à ce que nous surpassions nos rivaux."
 unity_merchant_promote_diligence_decision_tooltip: "Dépenser du [prestige|El] pour pousser l'[company_sentiment|El] vers [company_sentiment_divided|E][company_sentiment_divided_i] et soutenir la [competitiveness|El] de la [company|El] ainsi que le développement des compétences des membres de votre [house|E]"
