 unity_merchant_bailiffs_decision: "Soutenir les autorités locales"
 unity_merchant_bailiffs_decision_desc: "Les dirigeants de [ROOT.Char.GetDomicile.GetLocation.GetName] ont du mal à contrôler la région ; nous devons intervenir avant que des criminels ne compromettent nos perspectives."
