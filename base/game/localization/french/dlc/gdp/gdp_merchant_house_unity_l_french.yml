l_french:
 merchant_house_unity: "Orientation de la compagnie"
 rapacious_cs: "Prédatrice"
 rapacious_cs_desc: "#weak Les obligations familiales ont été oubliées depuis longtemps, ensevelies sous le ressentiment et l’ambition. Les intérêts de la compagnie priment sur ceux de ses membres. Le profit passe avant tout le reste.#!"
 opportunistic_cs: "Opportuniste"
 opportunistic_cs_desc: "#weak Les membres rebelles de la famille s’opposent aux hiérarchies du sang et considèrent le devoir comme secondaire par rapport à leurs intérêts personnels.#!"
 balanced_cs: "Équilibrée"
 balanced_cs_desc: "#weak Même si une famille a besoin d’une figure de proue, ses membres doivent avoir la liberté de régler leurs affaires personnelles sans ingérence ni jugement.#!"
 grasping_cs: "Rapace"
 grasping_cs_desc: "#weak La réputation de la compagnie et celle de ses membres sont indissociables. Quiconque souhaite jouer un rôle important au sein de la compagnie doit s’efforcer d’améliorer à la fois son image et son statut social.#!"
 ennobled_cs: "Anoblie"
 ennobled_cs_desc: "#weak Portée par une loyauté inébranlable née du sens du devoir et du respect, les intérêts de la communauté sont identiques à ceux de son chef. En tant qu’entité solidement soudée par des liens familiaux, cette compagnie peut rivaliser avec les familles nobles.#!"
 house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts: "Les membres de la [house|E] étant des [traders|El] sont plus disposés à fournir des [trade_opportunities|El]"
 house_unity_parameter_unity_risk_of_leaving: "Acceptation lorsque d’autres [rulers|El] invitent des [associates|El] à leur [court|El] : #N +20#!"
 house_unity_parameter_unity_very_high_risk_of_leaving: "Acceptation lorsque d’autres [rulers|El] invitent des [associates|El] à leur [court|El] : #N +50#!"
 house_unity_parameter_unity_deputy_positions_cost_less: "Salaires des postes de [deputy|El] réduits : #P -50%#!"
 house_unity_parameter_unity_deputy_positions_cost_significantly_less: "Salaires des postes de [deputy|El] fortement réduits : #P -85%#!"
 unity_merchant_can_petition_for_noble_standing_tt: "L'[company_sentiment|El] doit être #V #emp $ennobled_cs|l$#!#!"
 house_unity_parameter_unity_merchant_can_petition_for_noble_standing: "Peut utiliser l'option #V $merchant_purchase_land_interaction_noble_standing$#! de #V $merchant_purchase_land_interaction$#! et l'[interaction|El] #V $merchant_procure_estate_interaction$#!"
 unity_merchant_can_request_complete_exploitative_monopolies_tt: "L’[company_sentiment|E] doit être #V #emp $rapacious_cs$#!#! pour demander un [complete_monopoly|El] ou un [exploitative_monopoly|El]"
 house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies: "Peut demander des [complete_monopolies|El] et [exploitative_monopolies|El] avec l'[interaction|El] #V $request_trade_monopoly_for_character_interaction$#!"
 merchant_steady_hand_low_unity_modifier: "$merchant_house_unity$ : main ferme"
 merchant_steady_hand_low_unity_modifier_desc: "Ce personnage veille au bon fonctionnement de sa compagnie, même lorsque l’agitation règne au sein de la Maison."
 merchant_house_of_knives_fractious_modifier: "$merchant_house_unity$ : maison des poignards"
 merchant_house_of_knives_fractious_modifier_desc: "La Maison de ce personnage est tellement rebelle que toute menace implicite est plausible."
 merchant_house_of_knives_divided_modifier: "$merchant_house_unity$ : maison des poignards"
 merchant_house_of_knives_divided_modifier_desc: "La Maison de ce personnage est tellement divisée que la peur est devenue la seule langue commune de la compagnie."
 merchant_family_mobilization_promote_diligence_modifier: "$merchant_house_unity$ : promeut la diligence"
 merchant_family_mobilization_promote_diligence_modifier_desc: "Ce personnage pousse une Maison motivée vers des échanges complexes et une vive compétition."
 unity_regional_networks_decision: "Reconnaître les intérêts régionaux"
 unity_regional_networks_decision_desc: "Les membres de ma Maison défendent farouchement leurs intérêts commerciaux indépendants, mais le fait de tolérer la concurrence interne devrait profiter à la compagnie dans son ensemble."
 unity_regional_networks_decision_tooltip: "Permet aux membres de votre [house|E] de s’intéresser à leurs propres objectifs régionaux"
 unity_regional_networks_decision_confirm: "Promouvoir la liberté du commerce"
 unity_family_business_decision: "Officialiser la compagnie familiale"
 unity_family_business_decision_desc: "Le domaine [ROOT.Char.GetHouse.GetName] est au cœur de notre réseau commercial et sa gestion efficace est la clé de notre succès."
 unity_family_business_decision_tooltip: "Organiser les membres de votre [house|E] au sein de l’administration de votre [company|El] et de vos réseaux commerciaux"
 unity_family_business_decision_confirm: "Définir les responsabilités familiales"
 unity_merchant_prosperity_decision: "Promouvoir la prospérité"
 unity_merchant_prosperity_decision_desc: "Pour prospérer, nous devons développer la région de [ROOT.Char.GetDomicile.GetLocation.GetName] et veiller à ce qu’elle puisse soutenir nos ambitions."
