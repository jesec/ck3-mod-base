 unity_merchant_bailiffs_decision_cooldown_tooltip: "La [house|E] [THIS.Char.GetHouse.GetName] a favorisé le contrôle au cours des #V 10#! dernières années. Peut être reprise après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_bailiffs_decision_cooldown') )|V]"
 unity_merchant_bailiffs_decision_control_tooltip: "[THIS.Char.GetDomicile.GetLocation.GetCounty.GetTitle.GetName] a un [county_control|El] inférieur à la [control_baseline|El]"
 merchant_unity_associate_busywork_desc: "A obligé les autres à compenser la paresse [unity_target.Custom('FR_du_Char_Pi')][unity_target.GetTitledFirstName]"
 merchant_unity_associate_rewarded_desc: "A récompensé le bon travail [unity_target.Custom('FR_du_Char_Pi')][unity_target.GetTitledFirstName]"
 merchant_unity_associate_after_company_desc: "A fait passer la compagnie avant [unity_target.Custom('FR_le_Char_Pi')][unity_target.GetTitledFirstName]"
