l_french:
 gdp_merchant_trade_opportunity.0001.t: "Défier un concurrent : [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "La présence de [task_contract_target.GetPrimaryTitle.GetName] est une véritable épine dans notre pied ; elle ruine nos perspectives et nos bénéfices, et c’est tout particulièrement le cas dans les marchés de [local_market.GetShortName].\n\nIl faut nous en débarrasser, coûte que coûte, et faire clairement comprendre que nous sommes les maîtres légitimes des marchés locaux."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "Après avoir passé de nombreux jours et nuits à bombarder de questions les marchands ambulants locaux et à apprendre tout ce qu’il y a à savoir sur les marchés de [trade_market.GetShortName], nous avons découvert le point faible de [target_title.GetName].\n\nEn sapant leurs relations locales, en proposant des prix inférieurs aux leurs dans des secteurs clés et en soumettant des offres plus élevées, nous pourrons très bientôt faire en sorte que leurs bénéfices s’effondrent en même temps que leur réputation !"
 gdp_merchant_trade_opportunity.0002.a: "Apprenons-leur à rester à l’écart de notre territoire."
 gdp_merchant_trade_opportunity.0002.b: "Si nous jouons cartes sur table, nous gagnerons leur respect."
 gdp_merchant_trade_opportunity.0002.b.tt: "Vous devez être un [friend|El], un [spouse|El], ou avoir au moins [SCOPE.ScriptValue('high_skill_rating')|V0] en [diplomacy|El], et ne pas avoir de [relation|El] négative ni être [house_feuding|El]"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "Nos efforts pour cartographier les réseaux de [target_title.GetName] sur les marchés de [trade_market.GetShortName] et au-delà n’ont guère porté leurs fruits. Il semblerait même que nous ayons nui à notre réputation sur le [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')].\n\nNos tentatives maladroites n’ont fait que renforcer la position de la Maison [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip], sans que nous ayons pu trouver le moindre point faible dans les longues chaînes de ses circuits commerciaux..."
 gdp_merchant_trade_opportunity.0003.a: "Par [ROOT.Char.GetFaith.WealthGodName] ! Cela va réduire nos bénéfices !"
 gdp_merchant_trade_opportunity.0011.t: "Promotion de biens : [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "Sur les [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] animés de [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip], la concurrence est rude entre colporteurs et commerçants qui vendent toutes sortes de marchandises.\n\nJe me tiens au milieu de ce brouhaha, ballotté[ROOT.Char.Custom('FR_E')] par le flux incessant de passants qui se pressent, et une question me vient à l’esprit : comment nos produits peuvent-ils se démarquer pour attirer l’attention tant des clients que des commerçants..."
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "Nos efforts pour stimuler les ventes de [trade_good_type.GetNameNoTooltip|l] en [target_title.GetBaseNameNoTierNoTooltip] semblent avoir porté leurs fruits ; nombreux sont ceux qui recherchent spécifiquement nos « excellents » produits, et les chiffres de vente dans la région ne cessent d’augmenter.\n\nIl semblerait que notre persévérance et nos arguments de vente aient su convaincre les bons clients !"
 gdp_merchant_trade_opportunity.0012.a: "Nous ne laisserons pas passer cette occasion."
 gdp_merchant_trade_opportunity.0012.b: "Je sens déjà l’odeur de l’argent !"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "Nos efforts pour attirer des clients, à l’aide de descriptions certes un peu embellies de la qualité de nos produits, n’ont pas eu l’effet escompté...\n\nLes chiffres de vente sont en baisse et la demande en [trade_good_type.GetNameNoTooltip|l] en [target_title.GetBaseNameNoTierNoTooltip] semble s’essouffler, tandis que la confiance des acheteurs diminue."
 gdp_merchant_trade_opportunity.0013.a: "Mais c’est ce qu’il y a de mieux comme [trade_good_type.GetNameNoTooltip|l] !"
 gdp_merchant_trade_opportunity.0021.t: "Encourager l’investissement : [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "Lorsque l’on se promène dans [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip], on ne peut s’empêcher de remarquer les nombreuses lacunes en matière d’infrastructures, telles que l’état des routes, la médiocrité des entrepôts et les [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] eux-mêmes.\n\nIl faut montrer au dirigeant local que de petits investissements suffisent déjà à apporter des avantages. Si cela ne fonctionne pas et que nous entretenons néanmoins la plupart de nos relations ici, alors nous devrons nous en charger nous-mêmes..."
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "En mettant habilement en évidence les lacunes de l’infrastructure [target_title.GetAdjectiveNoTooltip] et en soulignant ensuite les avantages qu’une amélioration permettrait d’obtenir, nous avons attiré l’attention des bonnes personnes.\n\nLes efforts commencent déjà à porter leurs fruits, car il semble que [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName] ait été convaincu[local_ruler.Custom('FR_E')] et que les travaux soient sur le point de démarrer. Alors que les échanges commerciaux devraient s’intensifier, les commerçants locaux et les habitants de la ville nous adressent déjà leurs premières félicitations."
 gdp_merchant_trade_opportunity.0022.a: "Rien n’est jamais mieux fait que par soi-même."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "Nos tentatives pour convaincre les gens d’ici des innombrables lacunes de l’infrastructure [target_title.GetAdjectiveNoTooltip] n’ont rencontré qu’un succès effroyablement limité, et il semble peu probable que ces imbéciles nous écoutent à nouveau.\n\nUne bourde après l’autre ne fera que laisser les choses à peu près dans le même état que nous les avons trouvées, avec des élus locaux et des commerçants perplexes, à moins que nous ne prenions les choses en main..."
 gdp_merchant_trade_opportunity.0023.a: "Le commerce doit prospérer, quoi qu’il arrive."
 gdp_merchant_trade_opportunity.0023.b: "Les gens d’ici sont des idiots..."
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$ : [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "Les stigmates de l’échec sont partout sur les [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] de [local_market.GetShortName] : les boutiques condamnées et désertes témoignent de l’essoufflement du commerce suite à l’exode des commerçants en ces temps difficiles.\n\nIls doivent néanmoins comprendre que rester les bras croisés ou prendre la fuite n’aide en rien le commerce, et que la paix n’est jamais garantie. C’est à nous qu’il revient de rétablir l’ordre et de prendre la relève."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$ : réussite"
 gdp_merchant_trade_opportunity.0032.desc: "Après nous avoir observés avec curiosité depuis leurs maisons, les habitants de [target_title.GetBaseNameNoTierNoTooltip] ont rapidement compris notre objectif, et nous nous sommes rapidement imposés sur le marché.\n\nCeux qui ont été lésés par ce réajustement n’ont eu d’autre choix que de reconnaître notre efficacité devant le rétablissement de l’ordre et la lente reprise du commerce."
 gdp_merchant_trade_opportunity.0032.a: "Les affaires sont les affaires..."
 gdp_merchant_trade_opportunity.0032.b: "Notre travail ici est terminé."
 every_county_province_custom: "Chaque [holding|El] $recently_looted_modifier|l$ dans [saved_county.GetName]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$ : échec"
 gdp_merchant_trade_opportunity.0033.desc: "Notre présence agressive en [target_title.GetBaseNameNoTierNoTooltip] et nos tentatives pour amener les habitants à se rallier à notre cause se sont heurtées à une grande méfiance et à un refus obstiné de coopérer.\n\nLa population et les commerçants locaux se sont ligués contre nous et considèrent que notre domination est un prix trop élevé à payer pour le rétablissement de l’ordre et du commerce !"
 gdp_merchant_trade_opportunity.0033.a: "Crétins obstinés !"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$ : [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "Les [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] de [local_market.GetShortName] abritent une multitude de groupes d’artisans, dont le nombre strictement contrôlé permet de produire tout ce dont les habitants et les autres clients ont besoin, allant des cordes à l’argenterie.\n\nNous pourrions accéder à ces réseaux d’artisans compétents et nous forger une réputation de mécènes ; et peut-être découvrir quelques méthodes ou innovations rentables."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$ : réussite"
 gdp_merchant_trade_opportunity.0042.desc: "Nous avons noué des liens fructueux en [target_title.GetBaseNameNoTierNoTooltip] en soutenant financièrement des artisans talentueux de tous horizons, qui travaillent sans relâche à la création d’objets aussi bien modestes que merveilleux.\n\nLe fait d’être reconnus comme mécènes nous vaut un accueil chaleureux de toutes parts, ainsi que l’attention d’[Select_CString(inspired_artisan.IsFemale,'une artisane locale','un artisan local')] très en vue, [inspired_artisan.GetFirstName], qui cherche à obtenir des fonds pour la réalisation d’[inspired_artisan.Custom('InspirationArtisanType')]."
 gdp_merchant_trade_opportunity.0042.a: "Nos investissements ont porté leurs fruits."
 gdp_merchant_trade_opportunity.0042.b: "Nous ne pouvons pas laisser passer cette occasion !"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$ : échec"
 gdp_merchant_trade_opportunity.0043.desc: "Nos tentatives pour accéder aux réseaux d’artisans de [target_title.GetBaseNameNoTierNoTooltip] se sont heurtées à des refus à chaque étape ; notre argent et nos intérêts ont été acceptés à contrecœur.\n\nNotre réputation a-t-elle souffert d’un malentendu ? D’une manipulation de la part de concurrents ou simplement parce que nous avons eu l’audace de nous immiscer dans leurs affaires ? Nous ne le saurons sans doute jamais..."
 gdp_merchant_trade_opportunity.0043.a: "Pff, leurs produits étaient de toute façon de la camelote..."
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$ : [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "Sur les [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')] de [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip], dans chaque regard et chaque geste résonne l’appel du profit : l’endroit réclame notre argent et attire de futurs clients incapables de résister à ses promesses.\n\nIl est bien plus facile de trouver quelqu’un qui prend les [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] que quelqu’un qui en donne, mais nous devons faire preuve de perspicacité. Nous lançons nos appâts aux personnalités influentes de [local_market.GetShortName], car une prise digne de ce nom exige ruse et patience."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$ : réussite"
 gdp_merchant_trade_opportunity.0052.desc: "Après avoir fait passer le mot en [target_title.GetBaseNameNoTierNoTooltip] que nous étions prêts à apporter une aide financière, il ne fallut pas longtemps avant que nous recevions une invitation étrangement humble de la part [debtor.Custom('FR_du_Char_Pi')][debtor.GetTitledFirstName].\n\nIl semblerait que c[debtor.Custom('FR_EEtte')] brave [debtor.GetWomanMan] ait besoin d’un peu de « souplesse » dans ses comptes. Rien ne saurait être plus éloigné de l’esprit de simples commerçants que de remettre en question les ressources d’une personne aussi respectée..."
 gdp_merchant_trade_opportunity.0052.a: "« Ajustons le grand livre ici... #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip] de [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...#! »"
 gdp_merchant_trade_opportunity.0052.b: "« Je crains que cela ne soit pas possible cette fois-ci, [debtor.Custom('FR_MonseigneurMadame')|U]. »"
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$ : échec"
 gdp_merchant_trade_opportunity.0053.desc: "Après avoir fait savoir que nous étions prêts à apporter une aide financière, nous n’avons guère de résultats à présenter. Nos offres généreuses ont été catégoriquement rejetées par les dignitaires locaux de [target_title.GetBaseNameNoTierNoTooltip].\n\nAvons-nous mal géré nos transactions ? Nous sommes-nous immiscés dans les affaires d’un autre commerçant ? Les puissants de cette région jouissent-ils d’une prospérité rare, mais considérable ? Difficile de se prononcer."
 gdp_merchant_trade_opportunity.0053.a: "Peu importe, ils reviendront en rampant. C’est toujours ainsi..."
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$ : [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] m’apporte des nouvelles intéressantes : [market_owner.Custom('FR_le_Char_Pi')][market_owner.GetTitledFirstName] a besoin de [trade_good_type.GetNameNoTooltip|l] et cherche un marchand capable de lui fournir une importante livraison.\n\n[task_contract_target.Custom('FR_le_Char_Pi')|U][task_contract_target.GetTitledFirstName] de la compagnie [task_contract_target.GetHouse.GetBaseName] a fièrement annoncé qu’[task_contract_target.Custom('FR_IlElle')] réussirait sans aucun doute à conclure cette affaire. Je pense qu’avec un peu d’ingéniosité, nous pouvons faire mieux que son offre et [task_contract_target.Custom('FR_LeLa')] remettre à sa place."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$ : réussite"
 gdp_merchant_trade_opportunity.0062.desc: "Nos tentatives secrètes visant à contrecarrer les manœuvres commerciales de [target_title.GetName] ont porté leurs fruits. Le jour de la bataille des enchères, [target_title.GetHolder.Custom('FR_le_Char_Pi')][target_title.GetHolder.GetTitledFirstName] n’a pu que nous regarder, sous le choc, remporter la victoire.\n\nDepuis lors, la réputation de [target_title.GetNameNoTooltip] est gravement entachée, et nous ferions bien de tirer parti de ce vide du pouvoir."
 gdp_merchant_trade_opportunity.0062.a: "Tout se passe comme prévu."
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$ : échec"
 gdp_merchant_trade_opportunity.0063.desc: "Malgré nos efforts pour recourir à la ruse, [target_title.GetHolder.Custom('FR_le_Char_Pi')][target_title.GetHolder.GetTitledFirstName] a une fois de plus eu le dessus sur nous. C’est avec honte que nous avons dû admettre notre défaite écrasante face à [target_title.GetNameNoTier].\n\nNous ne saurons peut-être jamais la cause de notre faux pas : notre orgueil a-t-il pris le dessus, ou s’agissait-il plutôt d’un manque de sens des affaires ? Pour l’instant, tout ce que nous savons, c’est que nous en sommes sortis perdants, la tête lourde et les poches vides."
 gdp_merchant_trade_opportunity.0063.a: "Nous les battrons la prochaine fois..."
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$ : [trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "M[ROOT.Char.Custom2('FR_RelationToMe_OnA', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], examine [trade_good_type.Custom('GetTradeGood')], étudiant minutieusement les [trade_good_type.Custom('GetTradeGoodUnitPlural')] à la recherche du moindre défaut, vérifiant chaque fermeture.\n\nUne marchandise n’est pas toujours exploitée au maximum de son potentiel, et peut être perdue pour cause de négligence ou d’ignorance. Du modeste marchand ambulant au plus grand négociant en gros, il y a beaucoup à apprendre."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$ : réussite"
 gdp_merchant_trade_opportunity.0072.desc: "Flânant entre les étals animés des [destination.Custom('GetRegionalMarketTermGlossPlural')|l] de [destination.GetTitle.GetNameNoTierNoTooltip] et ses halles de marché paisibles, nous avons recueilli de nombreuses informations, anecdotes et astuces pour faire commerce dans [trade_good_type.Custom('GetTradeGood')].\n\nDu stockage au transport des [trade_good_type.Custom('GetTradeGoodUnitPlural')], de la demande saisonnière à l’évaluation de la qualité, les enseignements que nous en tirons seront sans doute bénéfiques pour nos échanges sur le [local_market.GetName|l] et ailleurs."
 gdp_merchant_trade_opportunity.0072.a: "Qui aurait pu croire qu’il était aussi subtil de faire commerce dans [trade_good_type.Custom('GetTradeGood')] ?"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$ : échec"
 gdp_merchant_trade_opportunity.0073.desc: "Nous avons passé des jours et des jours à arpenter les étals animés des [destination.Custom('GetRegionalMarketTermGlossPlural')|l] de [destination.GetTitle.GetNameNoTierNoTooltip] et ses halles de marché paisibles, mais nous n’en savons pas beaucoup plus pour faire commerce dans [trade_good_type.Custom('GetTradeGood')].\n\nLes marchands taciturnes et les négociants dédaigneux ont rarement répondu à nos questions par autre chose qu’un mépris perplexe ou un silence pesant, et les informations qu’ils ont bien voulu nous livrer étaient futiles ou inutilement alambiquées. "
 gdp_merchant_trade_opportunity.0073.a: "Pff, nous n’avons pas besoin de leur aide !"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$ : [contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "M[ROOT.Char.Custom2('FR_RelationToMe_OnA', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], lève les yeux au ciel en nous écoutant narrer les derniers exploits de [contract_target.GetPrimaryTitle.GetName|l] sur le [market.GetName|l].\n\nNous devons faire quelque chose à propos [contract_target.Custom('FR_du_Char_Pi')][contract_target.GetTitledFirstName] et du soutien [contract_target.Custom('FR_du_Char_Pi')][contract_target.GetTitledFirstName], si nous ne voulons pas nous laisser distancer..."
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$ : réussite"
 gdp_merchant_trade_opportunity.0082.desc: "Nos inlassables efforts visant à flatter les intermédiaires et à jeter le discrédit sur [target_title.GetDefinitiveName] et cette maudite charte semblent avoir porté leurs fruits, et nombreux sont ceux à y réfléchir désormais à deux fois avant de prendre la parole [target_title.GetHolder.Custom('FR_du_Char_Pi')][target_title.GetHolder.GetTitledFirstName] pour argent comptant.\n\nMême la véracité du sceau [target_title.GetHolder.GetSuzerain.Custom('FR_du_Char_Pi')][target_title.GetHolder.GetSuzerain.GetTitledFirstName] sur les documents [target_title.GetHolder.Custom('FR_du_Char_Pi')][target_title.GetHolder.GetTitledFirstName] a été remise en question, ce qui risque de faire grincer des dents, d’un côté comme de l’autre."
 gdp_merchant_trade_opportunity.0082.a: "Qu’ils aillent [ROOT.Char.GetRite.NegativeAfterLife2] avec leurs documents !"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$ : échec"
 gdp_merchant_trade_opportunity.0083.desc: "Nos inlassables efforts visant à nous constituer un réseau et à comploter contre les maudits agents de [target_title.GetDefinitiveName|l] n’ont servi à rien, peu de gens étant prêts à envisager notre approche face à une charte portant le sceau [target_title.GetHolder.GetSuzerain.Custom('FR_du_Char_Pi')][target_title.GetHolder.GetSuzerain.GetTitledFirstName].\n\nLa réputation [target_title.GetHolder.Custom('FR_du_Char_Pi')][target_title.GetHolder.GetTitledFirstName] reste intacte, le seul nom que nous ayons réussi à salir en nous abaissant à un tel niveau étant le nôtre..."
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName|U] sourit encore à la Maison [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]..."
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$ : [local_market.GetNameNoTooltip|l]"
 gdp_merchant_trade_opportunity.0091.desc: "Tandis que m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName] et moi arpentons le [destination.Custom('GetRegionalMarketTermGloss')], la situation désastreuse à [destination.GetBaronyNameExplicitlyNoTooltip], provoquée par la guerre et la famine, saute aux yeux.\n\nUn nombre inquiétant de mendiants, qu’il s’agisse de veuves, d’orphelins ou d’infirmes, envahissent les allées, faisant planer un sentiment de fatalité sur les étals déserts comme un épais rideau de nuages."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$ : réussite"
 gdp_merchant_trade_opportunity.0092.desc: "En parcourant la région, nous avons réussi à trouver les marchands ambulants locaux et les commerçants qui continuent de travailler malgré"
 gdp_merchant_trade_opportunity.0092.war: "les horreurs de la guerre,"
 gdp_merchant_trade_opportunity.0092.disaster: "le désastre ambiant,"
 gdp_merchant_trade_opportunity.0092.epidemic: "les récentes épidémies,"
 gdp_merchant_trade_opportunity.0092.closing: "et qui ont même donné un second souffle à leurs registres comptables. Tous les efforts, aussi infimes soient-ils, comptent.\n\nJour après jour, le [destination.Custom('GetRegionalMarketTermGloss')] de [destination.GetBaronyNameExplicitlyNoTooltip] semble résonner de quelques voix supplémentaires, ses étals brillent de nouvelles marchandises, et ses auberges accueillent un peu plus de visiteurs.\n\nJour après jour, le marché de [destination.GetBaronyNameExplicitlyNoTooltip] semble résonner de quelques voix supplémentaires, ses étals brillent de nouvelles marchandises, et ses auberges accueillent un peu plus de visiteurs."
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip] prospérera bientôt à nouveau."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$ : échec"
 gdp_merchant_trade_opportunity.0093.desc: "Nous avons voyagé aux quatre coins de [destination.GetBaronyNameExplicitlyNoTooltip], afin d’essayer de mettre de l’argent entre les mains de ceux qui peuvent en faire le meilleur usage, et de restaurer l’activité commerciale de la région, mais nos efforts ont majoritairement été vains.\n\nNous ne rencontrons quasiment que des profiteurs indignes de notre générosité, ou des personnes qui ne nous apportent rien de bon. Dans ces conditions, il est difficile de rester optimistes, et nous sombrons dans le désespoir et la frustration."
 gdp_merchant_trade_opportunity.0093.a: "Il n’y a rien à faire..."
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$ : [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName] et moi-même restons bouche bée devant les étals animés de l’incroyable [destination.Custom('GetRegionalMarketTermGloss')] de [destination.GetTitle.GetNameNoTier]. Ici, la fluidité des échanges est une réalité, aussi palpable que [ROOT.Char.Custom('GroundType')] sous nos pieds.\n\nAvec autant de marchands qui s’affairent autour de nous, comment pourrions-nous ne pas y trouver notre compte ?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$ : réussite"
 gdp_merchant_trade_opportunity.0102.desc: "Nous n’avons pas eu une seconde à nous ces dernières semaines, parcourant [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] chaque jour à la recherche de nouveaux contacts. Grâce à une subtile diplomatie et un sens des affaires encore plus subtil, nous avons réussi à nous constituer un solide portefeuille d’accords avec des négociants et des intermédiaires de la région.\n\nIl est clair que nos efforts ont porté leurs fruits, et que le travail accompli nous permet d’envisager sereinement la saison à venir."
 gdp_merchant_trade_opportunity.0102.a: "Puissent nos graines porter leurs fruits !"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$ : échec"
 gdp_merchant_trade_opportunity.0103.desc: "Malgré tous nos efforts pour nous attirer les faveurs des négociants et des intermédiaires de la région en parcourant [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] chaque jour à la recherche de nouveaux contacts, nous n’avons guère avancé.\n\nVoilà qui n’est pas très réjouissant à l’approche de la saison à venir..."
 gdp_merchant_trade_opportunity.0103.a: "Par [ROOT.Char.GetRite.WealthGodName]..."
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$ : [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$ : réussite"
 gdp_merchant_trade_opportunity.0112.desc: "Nous avons travaillé sans relâche et ratissé toute la ville de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] à la recherche de faveurs à accorder ou de pots-de-vin à verser. Très vite, nous avons vu nos espoirs se concrétiser par quelques enchères et accords favorables, et le bon fonctionnement de nos routes être assuré.\n\nNous pouvons avoir l’esprit tranquille, certains que notre travail a garanti un flux constant de marchandises, et ce pour encore un certain temps."
 gdp_merchant_trade_opportunity.0112.a: "[ROOT.Char.GetRite.WealthGodName] nous sourit !"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$ : échec"
 gdp_merchant_trade_opportunity.0113.desc: "Tous nos efforts déployés à ratisser la ville de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] à la recherche de faveurs à accorder ou de pots-de-vin à verser, ont été réduits à néant, avalés comme une goutte de pluie dans cet océan d’échanges.\n\nIl est évident que nous n’avons aucun moyen de garantir les caravanes requises pour atteindre les quotas souhaités, et ce pour encore un certain temps..."
 gdp_merchant_trade_opportunity.0113.a: "Qu’est-ce qu’un marchand sans caravane... ?"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$ : [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName] et moi arpentons l’entrepôt de [destination.GetBaronyNameExplicitly], un carrefour de vente et de revente, où se croisent des marchands de tous horizons, faisant transiter leurs marchandises vers des destinations inconnues et lointaines.\n\nIci, avec autant de marchandises en jeu, ce sont les échanges à grande échelle et au prix de gros qui font ou défont la fortune des commerçants..."
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$ : réussite"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nD’une manière ou d’une autre, nous sortons de ce nid de vipères sains et saufs, et dotés d’un solide portefeuille de billets à ordre, nous assurant ainsi des prix de vente compétitifs sur [trade_good_type.Custom('GetTradeGood')] à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] pour la saison à venir !"
 gdp_merchant_trade_opportunity.0122.intro: "Ces derniers jours, nous n’avons pas cessé de marchander, débattre et flatter, mon regard allant et venant entre les langues qui s’agitaient et les dents qui grinçaient à mesure que les prix étaient lancés à tue-tête lors des ventes aux enchères, au milieu des morceaux de papier, de griffonnages et de fortunes perdues sur [ROOT.Char.Custom('GroundType')]."
 gdp_merchant_trade_opportunity.0122.a: "C’est un marché pour les acheteurs !"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$ : échec"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nNous sortons de ce nid de vipères abattus et épuisés, privés des prix de vente que nous voulions obtenir sur [trade_good_type.Custom('GetTradeGood')], et dépassés par nos concurrents..."
 gdp_merchant_trade_opportunity.0123.a: "C’est un marché pour les vendeurs..."
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$ : [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$ : réussite"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nD’une manière ou d’une autre, nous sortons de ce nid de vipères sains et saufs, et dotés d’un solide portefeuille de billets à ordre, nous assurant ainsi des prix d’achat compétitifs sur [trade_good_type.Custom('GetTradeGood')] à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] pour la saison à venir !"
 gdp_merchant_trade_opportunity.0132.a: "C’est un marché pour les vendeurs !"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$ : échec"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nNous sortons de ce nid de vipères abattus et épuisés, privés des prix d’achat que nous voulions obtenir sur [trade_good_type.Custom('GetTradeGood')], et dépassés par nos concurrents..."
 gdp_merchant_trade_opportunity.0133.a: "C’est un marché pour les acheteurs..."
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$ : [task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "En tant que garant de la paix et défenseur de la loi, il est peut-être logique que [task_contract_target.Custom('FR_le_Char_Pi')][task_contract_target.GetTitledFirstName] encaisse une partie des ventes sur le [local_market.GetName|l].\n\nToutefois, il y a #EMP toujours#! de la place pour une petite négociation. Il suffit de lui faire comprendre la valeur de nos routes, et de lui expliquer le fardeau qu’[task_contract_target.Custom('FR_IlElle')] fait peser sur nous..."
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$ : réussite"
 gdp_merchant_trade_opportunity.0142.desc: "Nos avons passé de longues journées à flatter, amadouer et encourager dans les halles [task_contract_target.Custom('FR_du_Char_Pi')][task_contract_target.GetTitledFirstName], à tel point que nos joues nous font encore mal à force d’avoir souri, mais tous nos efforts ont fini par porter leurs fruits.\n\nNous avons réussi à obtenir un tarif réduit au péage, ce qui nous garantit des marges plus importantes à l’avenir."
 gdp_merchant_trade_opportunity.0142.a: "C’est le prix des affaires."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$ : échec"
 gdp_merchant_trade_opportunity.0143.desc: "Après de longues journées passées à flatter, amadouer et encourager dans les halles [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName], nos joues brûlent d’avoir trop souri et nos jambes flanchent d’avoir trop marché... et nos efforts sont malheureusement restés vains.\n\nAujourd’hui, alors que nous attendions une audience, les gardes [target.Custom('FR_du_Char_L')][target.GetTitleAsNameNoTooltip] nous ont fermement expliqué qu’[target.Custom('FR_IlElle')] ne pouvait malheureusement pas nous aider, et que des affaires plus urgentes l’attendaient..."
 gdp_merchant_trade_opportunity.0143.a: "Mais [target.Custom('FR_IlElle')] semblait tellement influençable..."
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$ : [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "Les agents d’affacturage et de recouvrement du [local_market.GetName|l] arpentent les lieux, des sacs de [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] cliquetant à leurs côtés, chacun étant rempli d’or honnêtement gagné et soutiré aux commerçants respectables comme [associate.GetFirstName] et moi...\n\nLes péages [owner.Custom('FR_du_Char_Pi')][owner.GetTitledFirstName] sont un fléau pour le commerce ici, et sa cupidité nous a forcés à recourir à des pratiques sournoises."
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$ : réussite"
 gdp_merchant_trade_opportunity.0152.desc: "Après avoir travaillé d’arrache-pied, nous avons réussi à nouer de bons contacts avec les vauriens de la région, et à sécuriser des routes #EMP alternatives#! fiables pour les marchandises en provenance du [trade_market.GetName|l].\n\nÀ mesure que les caisses passeront sous le nez de gardes trop crédules, nous ne tarderons pas à faire des économies..."
 gdp_merchant_trade_opportunity.0152.a: "C’est #EMP notre#! argent, et nous allons le garder."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$ : échec"
 gdp_merchant_trade_opportunity.0153.desc: "Nos efforts visant à établir un réseau de contrebande dans le [trade_market.GetName|l] ont été réduits à néant à chaque fois, que ce soit par l’incompétence de nos agents, la vigilance des autorités locales, ou la malhonnêteté des vauriens de la région...\n\nNous n’avons pas d’autre choix que de continuer à payer. Malgré tous nos efforts, nous n’avons fait que salir notre propre réputation d’honnêtes commerçants."
 gdp_merchant_trade_opportunity.0153.a: "Nous aurions mieux fait de payer..."
 gdp_merchant_trade_opportunity.1001.t: "Faire avancer les choses"
 gdp_merchant_trade_opportunity.1001.desc: "Nos contacts en [task_contract_location.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip] se montrent d’une réserve inhabituelle dans leurs transactions, et il est apparu clairement que [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName] en est la cause.\n\nComme on pouvait s’y attendre, nous recevons un message de [Select_CString(local_ruler.IsFemale,'cette grande femme','ce grand homme')] réclamant sa part des profits que nous espérons tirer de ses terres..."
 gdp_merchant_trade_opportunity.1001.a: "#weak *soupir*#! Donnons-lui ses [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]..."
 gdp_merchant_trade_opportunity.1001.b: "Un esprit éminent comprendra certainement notre situation."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip] est ravi[local_ruler.Custom('FR_E')]"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip] est contrarié[local_ruler.Custom('FR_E')]"
 gdp_merchant_trade_opportunity.1001.c: "« Vous savez, [other_merchant.GetPrimaryTitle.GetNameNoTooltip] prend vraiment des libertés. »"
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstNameNoTooltip] mord à l’hameçon"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstNameNoTooltip] s’en offusque"
 gdp_merchant_trade_opportunity.1001.d: "Bah, nous nous débrouillerons."
 gdp_merchant_trade_opportunity.1011.t: "Générosité réciproque"
 gdp_merchant_trade_opportunity.1011.desc: "Nos transactions sur les marchés de [local_market.GetShortName] semblent avoir éveillé l’intérêt [Select_CString(local_ruler.IsFemale,'de la cheffe locale','du chef local')], [local_ruler.Custom('FR_le_Char_Pi')][local_ruler.GetTitledFirstName], qui a convié la compagnie à une audience privée.\n\n[local_ruler.Custom('FR_le_Char_L')|U][local_ruler.GetTitleAsNameNoTooltip|l] sourit alors que je me tiens devant [local_ruler.Custom('FR_LuiElle')]. « Le commerce apporte de grands bénéfices ; pour le peuple, pour la noblesse, pour tout le pays ! Faites-moi part de vos préoccupations et j’aiderai autant que je le pourrai. »"
 gdp_merchant_trade_opportunity.1011.a: "#weak *Hem, hem...*#! « Les routes ont été fort éprouvantes, Votre Éminence... »"
 gdp_merchant_trade_opportunity.1011.b: "« J’ai quelques idées pour le [task_contract_location.Custom('GetRegionalMarketTerm')|l] local. »"
 gdp_merchant_trade_opportunity.1011.b.good: "Votre conseil est judicieux"
 gdp_merchant_trade_opportunity.1011.b.bad: "Votre conseil est absurde"
 gdp_merchant_trade_opportunity.1011.c: "« [other_merchant.GetPrimaryTitle.GetNameNoTooltip] complique considérablement les choses. »"
 gdp_merchant_trade_opportunity.1011.c.fallback: "« La concurrence complique considérablement les choses. »"
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip] vous soutient"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.Custom('FR_le_Char_Pi')|U][local_ruler.GetTitledFirstNameNoTooltip] soutient la Maison [other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "Un concours de popularité fondé sur la [diplomacy|El][diplomacy_i|E] et l’[opinion|El][opinion_i|E]"
 gdp_merchant_trade_opportunity.1011.d: "« Soyez bénis, vous et votre bienveillant règne, ô [local_ruler.GetTitleAsNameNoTooltip]. »"
 gdp_merchant_trade_opportunity.1021.t: "Concurrent commun"
 gdp_merchant_trade_opportunity.1021.desc: "Obsédé[ROOT.Char.Custom('FR_E')] par ces scélérats de [target.GetPrimaryTitle.GetName], je suis pris[ROOT.Char.Custom('FR_E')] au dépourvu par l’approche [other_merchant.Custom('FR_du_Char_Pi')][other_merchant.GetTitledFirstName] de [other_merchant.GetPrimaryTitle.GetName], un[other_merchant.Custom('FR_E')] autre concurrent[other_merchant.Custom('FR_E')] sur les [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] de [local_market.GetShortName].\n\n« Je vous salue », commence-t-[other_merchant.Custom('FR_IlElle')]. « J’ai entendu parler de vos difficultés avec [Select_CString(target.IsFemale,'cette colporteuse','ce colporteur')] de la [target.GetHouse.GetNameNoTooltip], [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName]. Peut-être pourrions-nous nous entraider ? »"
 gdp_merchant_trade_opportunity.1021.a: "« Très bien ! Voici le plan... »"
 gdp_merchant_trade_opportunity.1021.b: "« Comment puis-je savoir si on peut vous faire confiance ? »"
 gdp_merchant_trade_opportunity.1021.b.good: "Vous parvenez à un accord"
 gdp_merchant_trade_opportunity.1021.b.bad: "Vous en venez aux mains"
 gdp_merchant_trade_opportunity.1021.c: "« Ensemble, nous pouvons leur compliquer considérablement la tâche. »"
 gdp_merchant_trade_opportunity.1021.d: "« Jamais de la vie ! Vous, les [other_merchant.GetHouse.GetNameNoTooltip], vous êtes encore pires ! »"
 gdp_merchant_trade_opportunity.1031.t: "Secret commercial"
 gdp_merchant_trade_opportunity.1031.desc: "Alors que je feuillette des rapports de compagnie de [task_contract_location.GetBaronyNameExplicitlyNoTooltip], quelques feuilles se détachent et tombent par terre. Je me baisse pour les ramasser et, en me retournant, je tombe nez à nez avec m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))], [associate.GetFirstName], le front plissé et le souffle court.\n\nEn examinant les documents, je suis stupéfait[ROOT.Char.Custom('FR_E')], car je comprends désormais pourquoi [associate.Custom('FR_IlElle')] est dans cet état : [associate.Custom('FR_IlElle')] a caché des informations cruciales pour nos activités ici ! Et tout cela par pure malveillance ?"
 gdp_merchant_trade_opportunity.1031.a: "« Bon sang, [associate.GetFirstNameNoTooltip] ! À qui va votre loyauté ? »"
 gdp_merchant_trade_opportunity.1031.b: "« Allez, qu’est-ce qui vous tourmente ? »"
 gdp_merchant_trade_opportunity.1031.c: "« DEHORS ! Vous n’êtes plus d’aucune utilité pour cette compagnie ! »"
 gdp_merchant_trade_opportunity.1041.t: "Un effort familial"
 gdp_merchant_trade_opportunity.1041.desc: "L’ambiance est bonne et les récents succès remportés à [task_contract_location.GetBaronyNameExplicitlyNoTooltip] occupent les conversations au sein de la compagnie. Il s’avère qu’ils ont tous été menés par m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName].\n\nOn le présente comme un génie du commerce, alors même que toute réussite repose sur le travail acharné de nombreuses personnes au sein de notre réseau familial."
 gdp_merchant_trade_opportunity.1041.a: "Bon travail, [associate.GetFirstNameNoTooltip] !"
 gdp_merchant_trade_opportunity.1041.b: "De toute évidence, nous ne vous avons pas fait travailler assez dur."
 gdp_merchant_trade_opportunity.1041.c: "Vos efforts sont incroyables, vous êtes un exemple pour nous tous !"
 gdp_merchant_trade_opportunity.1051.t: "À la recherche d’un accord"
 gdp_merchant_trade_opportunity.1051.desc: "Alors que je traverse le [task_contract_location.Custom('GetRegionalMarketTermGloss')], notre concurrent[target.Custom('FR_E')], [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] de [target.GetPrimaryTitle.GetName], apparaît soudain devant moi ! Sa déférence me prend quelque peu au dépourvu.\n\n« Écoutez, [ROOT.Char.GetTitledFirstNameNoTooltip], soupire-t-[target.Custom('FR_IlElle')], je vais être [Select_CString(target.IsFemale,'franche','franc')]. Nos intérêts respectifs s’opposent ici, et rien de bon ne sortira de cette confrontation. Je vous demande de renoncer."
 gdp_merchant_trade_opportunity.1051.desc.gold: "Je vous donnerai quelques pièces pour vous remercier de vos efforts. »"
 gdp_merchant_trade_opportunity.1051.desc.luxury: "En échange, je vous donnerai un conseil pour faire une merveilleuse acquisition dans un pays lointain. »"
 gdp_merchant_trade_opportunity.1051.a: "« Vous dites vrai. Bon d’accord, j’accepte. »"
 gdp_merchant_trade_opportunity.1051.b: "« Il y a matière à discussion... Négocions. »"
 gdp_merchant_trade_opportunity.1051.b.good: "[target.Custom('FR_le_Char_Pi')|U][target.GetTitledFirstNameNoTooltip] acquiesce"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.Custom('FR_le_Char_Pi')|U][target.GetTitledFirstNameNoTooltip] refuse"
 trade_opportunity_accept_feast_tt: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] organisera une [activity|El] de [GetActivityType('activity_feast').GetName|l] en votre honneur"
 gdp_merchant_trade_opportunity.1052.t: "Festin non valable"
 trade_opportunity_gain_luxury_contract_tt: "Vous allez recevoir un [luxury_contract|El]"
 gdp_merchant_trade_opportunity.1051.d: "« Ha ! Les affaires doivent vraiment aller mal ! Aucune chance. »"
 gdp_merchant_trade_opportunity.1061.t: "Surcharge de travail"
 gdp_merchant_trade_opportunity.1061.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))], [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstName], se plaint que nous avons du mal à suivre le rythme quotidien des [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')] en raison de la concentration de nos efforts sur nos affaires à [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\n« Il faudra faire des concessions, car la journée n’a pas assez d’heures et la compagnie pas assez de main-d’œuvre pour gérer les affaires ici. »"
 gdp_merchant_trade_opportunity.1061.a: "Nous ne reculons devant aucun défi !"
 gdp_merchant_trade_opportunity.1061.a.good: "Tout se déroule comme prévu"
 gdp_merchant_trade_opportunity.1061.a.bad: "Vous vous surmenez"
 gdp_merchant_trade_opportunity.1061.b: "Je ne laisserai pas les bénéfices s'évaporer."
 gdp_merchant_trade_opportunity.1061.already_tt: "Déjà obtenu : #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! de [stress|El] pour [associate.Custom('FR_le_Char_U_Pi')][associate.GetShortUIName], #P +1#! [scheme_opportunity_opportunity|El][scheme_opportunity_i|E] de [scheme|El]"
 gdp_merchant_trade_opportunity.1071.t: "Étranglés"
 gdp_merchant_trade_opportunity.1071.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))], [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstName], fait les cent pas, à bout de patience face à une mouche qui virevolte tranquillement. « Raaah ! se plaint-[associate.Custom('FR_IlElle')]. Regardez, [ROOT.Char.GetTitleAsNameNoTooltip] ; votre travail ici à [task_contract_location.GetBaronyNameExplicitlyNoTooltip] épuise mes ressources ! ».\n\nEn examinant de plus près les reçus et les livres de comptes, il est difficile de ne pas lui donner raison. [associate.Custom('FR_IlElle')|U] soupire : « Il va falloir trouver un compromis, sinon notre implantation ici ne tiendra pas le coup... »"
 gdp_merchant_trade_opportunity.1071.a: "Nous ne poursuivons qu’un seul objectif."
 gdp_merchant_trade_opportunity.1071.d: "Laissez-moi m’en charger, revenez à vos affaires."
 gdp_merchant_trade_opportunity.1081.t: "Entre de bonnes mains"
 gdp_merchant_trade_opportunity.1081.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))], [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstName], s’occupe de la gestion de nos activités à [task_contract_location.GetBaronyNameExplicitlyNoTooltip], et ça se voit ! [associate.Custom('FR_IlElle')|U] a le souci du détail et d’autres qualités propres à [Select_CString(associate.IsFemale,'une commerçante talentueuse','un commerçant talentueux')].\n\nDepuis que nous travaillons ici, je n’ai pratiquement pas eu à vérifier un registre comptable ni à assurer le suivi d’une commande."
 gdp_merchant_trade_opportunity.1081.a: "Continuez comme ça, [associate.GetFirstNameNoTooltip] !"
 gdp_merchant_trade_opportunity.1081.b: "Un tel engagement mérite d’être récompensé."
 gdp_merchant_trade_opportunity.1081.c: "Toute la compagnie doit s’en inspirer !"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip] montre l’exemple"
 gdp_merchant_trade_opportunity.1081.c.trigger: "Un autre [associate|El] a moins de [EmptyScope.ScriptValue('medium_skill_rating')|V0][stewardship_i|E]"
 gdp_merchant_trade_opportunity.1081.c.tt: "L’[stewardship|El] d’un autre [associate|El] augmente de #P 1#![stewardship_i|E]"
 gdp_merchant_trade_opportunity.1081.d: "Les gens de la Maison [ROOT.Char.GetHouse.GetNameNoTooltip] sont sans surprise les meilleurs."
 gdp_merchant_trade_opportunity.1091.t: "[Select_CString(associate.IsFemale,'Une associée','Un associé')] médiocre"
 gdp_merchant_trade_opportunity.1091.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))], [associate.Custom('FR_le_Char_Pi')][associate.GetTitledFirstName], a pris la direction de nos activités à [task_contract_location.GetBaronyNameExplicitlyNoTooltip], mais malheureusement, on en vient à le regretter...\n\nIl ne se passe pas un jour sans qu’on ne découvre une erreur de calcul due à la paresse ou sans qu’on ne doive subir les plaintes d’un contact qu’on a fait attendre inutilement. On ne peut pas mener les affaires avec autant de négligence !"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], allons jeter un œil aux livres."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip] apprend une chose ou deux"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip] est un cas désespéré"
 gdp_merchant_trade_opportunity.1091.c: "La compagnie supportera cette charge supplémentaire."
 gdp_merchant_trade_opportunity.1091.d: "[associate.Custom('FR_IlElle')|U] fait de son mieux, je suppose."
 gdp_merchant_trade_opportunity.1101.t: "Capitaux de lancement"
 gdp_merchant_trade_opportunity.1101.desc: "Les prêts peuvent être un pari risqué pour ceux qui ont des [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] et la patience d’attendre le bon moment. Un investisseur a demandé une rencontre à [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nJe suis accueilli[ROOT.Char.Custom('FR_E')] par [investor.Custom('FR_le_Char_Pi')][investor.GetTitledFirstName],"
 gdp_merchant_trade_opportunity.1101.ruler: "[Select_CString(investor.IsFemale,'une dirigeante locale','un dirigeant local')] à [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.1101.courtier: "[Select_CString(investor.IsFemale,'la courtisane','le courtisan')] d’un noble local."
 gdp_merchant_trade_opportunity.1101.adventurer: "[Select_CString(investor.IsFemale,'une femme mondaine entourée','un homme mondain entouré')] d’une suite."
 gdp_merchant_trade_opportunity.1101.fallback: "[Select_CString(investor.IsFemale,'une femme','un homme')] sans passé connu."
 gdp_merchant_trade_opportunity.1101.end: "« Salutations, [ROOT.Char.GetTitledFirstNameNoTooltip] ! », dit-[investor.Custom('FR_IlElle')] avec un sourire enthousiaste. « Je suis prêt[investor.Custom('FR_E')] à soutenir [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]. Ce que j’attends en échange ? Oh, ne nous soucions pas de ça pour le moment. »"
 gdp_merchant_trade_opportunity.1101.a: "Vous pouvez compter sur nous, [investor.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.1101.c: "Un tout petit peu plus ferait une grande différence, je m’y engage sur mon honneur."
 gdp_merchant_trade_opportunity.1101.d: "C’est flatteur, mais cette fois-ci, nous allons nous en tenir à l’essentiel."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.Custom('FR_le_Char_U_Pi')|U][investor.GetShortUIName] percevra [interest|0V][gold_i|E] (#M 20% d’intérêt#!) dans #V 5#! ans"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "Le moment est enfin venu de récolter les fruits de mon investissement au sein de votre prestigieuse compagnie.\n\nJ’attends patiemment le remboursement de mon argent."
 gdp_merchant_trade_opportunity.1102.a: "D’accord. J’espère que cet argent vous parviendra sans encombre."
 gdp_merchant_trade_opportunity.1102.b: "Ah... Voyons voir. Cela a été une période difficile, [investor.GetFirstNameNoTooltip]..."
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip] accepte vos excuses"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip] se méfie"
 gdp_merchant_trade_opportunity.1102.d: "Vous n’avez aucun placement chez nous. Fin de la discussion."
 gdp_merchant_trade_opportunity.9000.t: "Affaires urgentes à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9000.desc: "Maintenant que cette affaire est réglée, d’autres affaires sur le [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l], méritent notre attention.\n\nDevrions-nous régler nos affaires à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] avant d’entreprendre notre voyage de retour vers [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ?"
 gdp_merchant_trade_opportunity.9000.a: "Il faudrait y jeter un coup d'œil."
 gdp_merchant_trade_opportunity.9000.b: "Réglons cette affaire."
 gdp_merchant_trade_opportunity.9000.c: "Je vais m’en occuper."
 gdp_merchant_trade_opportunity.9000.d: "Non, on a besoin de nous à [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.9000.accept_tt: "Vous acceptez et commencez l’[trade_opportunity|El] de [trade_opportunity_tier_tier|El] [THIS.TaskContract.GetTaskContractTierValue|V] [THIS.TaskContract.GetEmployer.Custom('FR_du_Char_U_P')][THIS.TaskContract.GetEmployer.GetUIName] [THIS.TaskContract.GetType.GetName|V] à [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.t: "Opportunité commerciale : [task_contract.GetType.GetName|l]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "Des affaires importantes pour la compagnie nous attendent à [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.intro: "Des affaires importantes pour la compagnie nous attendent ici à [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.desc: "et mes tâches doivent rester entre les mains de mes collaborateurs jusqu’à mon retour.\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "M[partner.Custom('FR_OnA')] [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName] pourrait se voir confier cette affaire, tandis que je m’occuperai d’autres questions."
 gdp_merchant_trade_opportunity.9010.partner_busy: "[partner.Custom('FR_OnA')] [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName] est actuellement indisponible. Je devrais peut-être m’en occuper moi-même..."
 gdp_merchant_trade_opportunity.9010.candidate: "Jusqu’à ce que je trouve quelqu’un à qui je puisse confier une tâche aussi importante, je vais devoir m’en occuper moi-même."
 gdp_merchant_trade_opportunity.9010.no_partner: "Comme je n’ai personne à qui confier une affaire aussi importante, je dois m’en occuper moi-même."
 gdp_merchant_trade_opportunity.9010.a: "Il n’y a pas de temps à perdre."
 gdp_merchant_trade_opportunity.9010.c: "[partner.GetFirstNameNoTooltip] peut s’en occuper."
 gdp_merchant_trade_opportunity.9010.c.no_partner: "Mon partenaire s’en chargera."
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.Custom('FR_le_Char_U_Pi')|U][partner.GetShortUIName] est déjà impliqué[partner.Custom('FR_E')] dans l’[trade_opportunity|El]"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "Votre partenaire est occupé[partner.Custom('FR_E')] à gérer une autre [trade_opportunity|El]"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "Est attribué[partner.Custom('FR_E')] à votre [trade_opportunity|El] [task_contract.GetType.GetName|V]"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M Sera indisponible jusqu’à l’achèvement du [task_contract|El]#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M Probabilité de réussite basée sur sa [aptitude|El] ([THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )])#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon! #X Le contrat échouera [THIS.Char.Custom('FR_SilSielle')] n’est plus votre [GetCourtPositionType('partner_court_position').GetName|l]#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "[THIS.Char.Custom('FR_le_Char_U_Pi')|U][THIS.Char.GetShortUIName|U] a été affecté[THIS.Char.Custom('FR_E')] à votre [trade_opportunity|El] [task_contract.GetType.GetName] à [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.d: "Peut-être que [candidate.GetFirstNameNoTooltip] est à la hauteur."
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "Peut-être que quelqu’un est à la hauteur."
 gdp_merchant_trade_opportunity.9010.d.tt: "Vous avez un [associate|El] qui :\n$EFFECT_LIST_BULLET$N’est pas un [trader|El]\n$EFFECT_LIST_BULLET$Pourrait être votre [GetCourtPositionType('partner_court_position').GetName|l]"
 gdp_merchant_trade_opportunity.9010.e: "Oublions cela, j’ai d’autres obligations."
 gdp_merchant_trade_opportunity.9010.e.tt: "Le [task_contract|El] sera révoqué"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "Vous commencez immédiatement à [Concept('traveling', 'voyager')|E] vers [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.tt.start: "Vous commencez immédiatement le [task_contract|El]"
 gdp_merchant_trade_opportunity.9020.t: "Opportunité commerciale : [task_contract.GetType.GetName|l]"
 gdp_merchant_trade_opportunity.9020.intro: "M[partner.Custom('FR_OnA')] [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName] est enfin revenu[partner.Custom('FR_E')] de [task_contract_location.GetBaronyNameExplicitly] et peut donc faire part de ses progrès.\n\n"
 gdp_merchant_trade_opportunity.9020.success: "[Select_CString(partner.IsFemale,'Toute contente','Tout content')], [partner.Custom('FR_IlElle')] explique comment [partner.Custom('FR_IlElle')] a habilement réglé cette affaire dans l’intérêt de la compagnie, malgré de nombreuses difficultés..."
 gdp_merchant_trade_opportunity.9020.failure: "[partner.Custom('FR_IlElle')|U] explique, avec une certaine hésitation, à quel point sa mission a été difficile et que, malgré tous ses efforts, la compagnie en a souffert..."
 gdp_merchant_trade_opportunity.9020.a.success: "Félicitations, [partner.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.9020.a.failure: "J’aurais dû m’en occuper moi-même..."
 gdp_merchant_trade_opportunity.9050.t: "Une opportunité manquée"
 gdp_merchant_trade_opportunity.9050.desc_opening: "Une perspective prometteuse s’est assombrie.\n\nL’opportunité commerciale à [trade_destination.GetBaronyNameExplicitlyNoTooltip], la raison de notre voyage, n’est plus d’actualité."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\nLa seule question qui se pose désormais est de savoir s’il est encore judicieux de poursuivre sur cette voie de mauvais augure."
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "La route commerciale n’existe plus."
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] n’est plus sur la [trade_opportunity_route.GetName]."
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "La [trade_opportunity_route.GetName] n’a plus le négociant dont dépendait l'opportunité."
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "Il s’avère que les troubles sur la [trade_opportunity_route.GetName] se sont résolus d’eux-mêmes."
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "Puisque nous ne sommes plus des artisans, il serait malvenu de faire affaire sous ce titre."
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "Puisque nous ne sommes plus des créanciers, il serait malvenu de faire affaire sous ce titre."
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "Notre compagnie rivale se fait discrète, d’après ce que disent les négociants."
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "Il semble que l’entrepôt à notre destination ne soit plus disponible pour nous."
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "En l’état, nous ne payons plus les droits que nous avions entrepris de gérer."
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "Comme c’est souvent le cas avec les situations changeantes, la Route de la Soie n’est plus la même que lorsque nous avons commencé notre voyage et notre opportunité de manipuler son cap a disparu."
 gdp_merchant_trade_opportunity.9050.reason_unknown: "Nous ne sommes pas certains de ce qui a changé pour le moment."
 gdp_merchant_trade_opportunity.9050.a: "Il n’y a plus rien que nous puissions faire ici."
 gdp_merchant_trade_opportunity.9050.b: "Voyons ce que [trade_destination.GetBaronyNameExplicitlyNoTooltip] a à offrir."
 gdp_merchant_trade_opportunity.9050.b.tt: "Poursuivez votre voyage et #weak visitez [trade_destination.GetBaronyNameExplicitly]#! à votre arrivée"
 gdp_merchant_trade_opportunity.9050.toast: "Opportunité commerciale à [trade_destination.GetBaronyNameExplicitlyNoTooltip] manquée"
 gdp_merchant_trade_opportunity.9050.toast_route_destroyed: "Route commerciale vers [trade_destination.GetBaronyNameExplicitlyNoTooltip] détruite"
 gdp_merchant_trade_opportunity.9050.toast_desc_route_destroyed: "La [trade_route|El] pour cette [trade_opportunity|El] n’existe plus"
 gdp_merchant_trade_opportunity.9050.toast_desc_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] n’est plus un [market|El] sur la [trade_opportunity_route.GetName]"
 gdp_merchant_trade_opportunity.9050.toast_desc_trader_changed: "La [trade_opportunity_route.GetName] a perdu son [trader|El]"
 gdp_merchant_trade_opportunity.9050.toast_desc_upheaval_ended: "La [trade_opportunity_route.GetName] ne passe plus à travers un [market|El] en pleine révolte"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_artisan: "Votre [company|El] n’a plus l’[company_purpose|El] [GetLaw('company_purpose_artisan').GetName]"
 gdp_merchant_trade_opportunity.9050.toast_desc_purpose_creditor: "Votre [company|El] n’a plus l’[company_purpose|El] [GetLaw('company_purpose_creditor').GetName]"
 gdp_merchant_trade_opportunity.9050.toast_desc_competitor_gone: "Votre [merchant_family|El] rivale n’a plus de [company|El]"
 gdp_merchant_trade_opportunity.9050.toast_desc_charter_gone: "Votre concurrent n’a plus de [charter|El] venant de son [merchant_patron|El]"
 gdp_merchant_trade_opportunity.9050.toast_desc_entrepot_gone: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] n’a plus de [entrepot_district|El]"
 gdp_merchant_trade_opportunity.9050.toast_desc_tolls_ended: "Vous ne payez plus de [tolls|El] à [trade_destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9050.toast_desc_silk_road: "Vous ne participez plus à la [silk_road|E]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_imprisoned: "Vous êtes [imprisoned|El]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_incapable: "Vous êtes [GetTrait('incapable').GetName( GetNullCharacter )|l]"
 gdp_merchant_trade_opportunity.9050.toast_desc_merchant_government: "Vous n’avez plus de [government|El] [merchant|El]"
