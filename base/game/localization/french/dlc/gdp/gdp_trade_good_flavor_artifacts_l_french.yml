l_french:
 gdp_tgf_coin_artifact: "Première pièce de [tgf_market_holder.GetFirstNameNoTooltip]"
 gdp_tgf_coin_artifact_desc: "Le visage de [tgf_market_holder.GetFirstName] figure sur une face et ces quelques mots sont gravés sur la tranche, en lettres si petites que seul un marchand peut les lire : « [tgf_coin_merchant.GetFirstName] a fourni [tgf_good.Custom('GetTradeGood')]. »"
 gdp_tgf_smith_weapon_axe: "Hache en [tgf_good.GetNameNoTooltip|l] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_dagger: "Dague en [tgf_good.GetNameNoTooltip|l] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_hammer: "Marteau en [tgf_good.GetNameNoTooltip|l] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_mace: "Masse d’armes en [tgf_good.GetNameNoTooltip|l] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_spear: "Lance en [tgf_good.GetNameNoTooltip|l] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_sword: "Épée en [tgf_good.GetNameNoTooltip|l] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_desc: "Une arme forgée par [tgf_smith.GetFirstName] de [tgf_source_county.GetNameNoTier] à partir du meilleur lingot qu’[tgf_smith.Custom('FR_IlElle')] ait jamais acheté. Elle vaudrait dix fois son prix en métal, si l’on en croit [tgf_smith.Custom('FR_LeLa')] forgero[tgf_smith.Custom('FR_NNne')]."
 gdp_tgf_reading_stones_artifact_merchant: "Pierres de lecture de [tgf_lens_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_reading_stones_artifact_lord: "Pierres de lecture de [tgf_market_holder.GetFirstNameNoTooltip]"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "Deux lentilles en verre transparent, taillées par [tgf_glassmaker.GetFirstName] de [tgf_source_county.GetNameNoTier]. Sénèque a écrit que les petites lettres grossissent lorsqu’on les regarde à travers un globe en verre rempli d’eau. Ces lentilles rendent les petits caractères des contrats parfaitement lisibles."
 gdp_tgf_showpiece_artifact: "Cabinet à [tgf_good.GetNameNoTooltip|l] de [tgf_showpiece_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_showpiece_artifact_desc: "Fabriqué par le maître [tgf_good.Custom('GetTgfGoodCrafter')] [tgf_crafter.GetFirstName]. [tgf_good.Custom('GetTradeGood')|U] que les clients de [tgf_showpiece_merchant.GetFirstName] adorent borde chacun de ses tiroirs. Il est ouvert pour les acheteurs, et reste fermé pour tous les autres."
 gdp_tgf_curio_grain: "Une gerbe de blé de qualité supérieure"
 gdp_tgf_curio_grain_desc: "Récolté dans le meilleur champ lors d’une excellente année."
 gdp_tgf_curio_millet: "Un bocal de vieux millet"
 gdp_tgf_curio_millet_desc: "Âgé de plusieurs années et toujours aussi bon. Le millet se conserve bien."
 gdp_tgf_curio_rice: "Un bol de riz blanc"
 gdp_tgf_curio_rice_desc: "Décortiqué, poli et trop joli pour être mangé."
 gdp_tgf_curio_meat: "Une tranche salée à la perfection"
 gdp_tgf_curio_meat_desc: "Si bien salée qu’elle pourrait survivre à son propriétaire."
 gdp_tgf_curio_fish: "Un poisson séché, fixé au mur"
 gdp_tgf_curio_fish_desc: "Raide comme la justice et fier de l’être."
 gdp_tgf_curio_cheese: "Une meule de fromage affiné"
 gdp_tgf_curio_cheese_desc: "Pressée durant un été que tout le monde a oublié."
 gdp_tgf_curio_fruit: "Un bocal de fruits confits"
 gdp_tgf_curio_fruit_desc: "Confits, conservés à l’abri de l’air et mis de côté en attendant une grande occasion."
 gdp_tgf_curio_oil: "Une outre de premier pressage"
 gdp_tgf_curio_oil_desc: "Cette huile vert doré provient du premier pressage de l’année."
 gdp_tgf_curio_honey: "Un pot de miel bien fermé"
 gdp_tgf_curio_honey_desc: "Sombre comme l’ambre. Plus vieux que certains millésimes."
 gdp_tgf_curio_tea: "Une brique de thé compressé"
 gdp_tgf_curio_tea_desc: "Vaut son pesant d’or loin de son jardin d’origine."
 gdp_tgf_curio_horses: "Le fer d’un champion"
 gdp_tgf_curio_horses_desc: "Protégeait un cheval qui n’a jamais perdu une seule course, à en croire le vendeur."
 gdp_tgf_curio_cattle: "Une corne de vache polie"
 gdp_tgf_curio_cattle_desc: "Si polie qu’elle brille. Parfaite pour boire lors des festins."
 gdp_tgf_curio_silver: "Un lingot d’argent parfait"
 gdp_tgf_curio_silver_desc: "Assez pur pour qu’un ongle y laisse une marque, et personne n’ose s’y risquer."
 gdp_tgf_curio_gold: "Une pépite d’or provenant d’un fleuve"
 gdp_tgf_curio_gold_desc: "Trouvée dans un fleuve dont personne ne prononcera le nom."
 gdp_tgf_curio_iron: "Une ébauche de fer parfaite"
 gdp_tgf_curio_iron_desc: "Dense, sombre et sans le moindre défaut."
 gdp_tgf_curio_copper: "Un disque en cuivre brillant"
 gdp_tgf_curio_copper_desc: "Coulé à la mine et aussi éclatant que le jour où il a refroidi."
 gdp_tgf_curio_beer: "Une chope sculptée"
 gdp_tgf_curio_beer_desc: "Sa contenance est exactement égale à une pinte. Rarement utilisée pour n’en boire qu’une."
 gdp_tgf_curio_wine: "Un millésime légendaire"
 gdp_tgf_curio_wine_desc: "Une bouteille produite lors d’une année dont les vignerons parlent encore."
 gdp_tgf_curio_gems: "Une pierre précieuse brute"
 gdp_tgf_curio_gems_desc: "Aussi brute que du gravier. Vaut autant qu’un village."
 gdp_tgf_curio_amber: "Un morceau d’ambre"
 gdp_tgf_curio_amber_desc: "Doré comme le miel, avec une mouche coincée à jamais à l’intérieur."
 gdp_tgf_curio_ivory: "Un éclat d’ivoire sculpté"
 gdp_tgf_curio_ivory_desc: "L’extrémité d’une défense, sculptée par quelqu’un de patient."
 gdp_tgf_curio_jade: "Un galet de jade provenant d’un fleuve"
 gdp_tgf_curio_jade_desc: "Froid au toucher, comme l’est toujours le jade véritable."
 gdp_tgf_curio_wood: "Un morceau de bois sculpté"
 gdp_tgf_curio_wood_desc: "Sa texture évoque l’eau qui coule. Les sculpteurs s’arrachent ce bois tous les ans."
 gdp_tgf_curio_hemp: "Une corde parfaite enroulée"
 gdp_tgf_curio_hemp_desc: "La corde est si régulière que ses fils semblent avoir été tendus plutôt que torsadés."
 gdp_tgf_curio_wool: "Une toison d’or"
 gdp_tgf_curio_wool_desc: "Pas LA toison d’or. Mais presque, d’après le berger."
 gdp_tgf_curio_cotton: "Une touffe de coton de qualité supérieure"
 gdp_tgf_curio_cotton_desc: "Légère comme du duvet et blanche comme le givre."
 gdp_tgf_curio_flax: "Un écheveau de lin soyeux"
 gdp_tgf_curio_flax_desc: "Du lin si fin qu’à la tombée de la nuit, on le prend pour de la soie."
 gdp_tgf_curio_textiles: "Un rouleau de maître tisserand"
 gdp_tgf_curio_textiles_desc: "Le tissage est si serré qu’il ne laisse pas passer la pluie."
 gdp_tgf_curio_furs: "Une peau d’hiver parfaite"
 gdp_tgf_curio_furs_desc: "Prise en plein hiver, quand le manteau est le plus épais."
 gdp_tgf_curio_leather: "Un panneau en cuir estampé"
 gdp_tgf_curio_leather_desc: "Tanné, estampé et aussi souple que du tissu."
 gdp_tgf_curio_sugar: "Un morceau de pain de sucre blanc"
 gdp_tgf_curio_sugar_desc: "La partie la plus blanche du pain, conservée pour être exposée."
 gdp_tgf_curio_spices: "Une boîte d’épices rares"
 gdp_tgf_curio_spices_desc: "Ouverte une fois par an, pour prouver qu’elle existe."
 gdp_tgf_curio_ceramics: "Un bol vernissé parfait"
 gdp_tgf_curio_ceramics_desc: "Résonne comme une cloche lorsqu’on tape dessus, ce que personne ne fait."
 gdp_tgf_curio_glass: "Une fiole en verre transparent"
 gdp_tgf_curio_glass_desc: "Pas une seule bulle dans le verre. Le souffleur a pris sa retraite la tête haute."
 gdp_tgf_curio_jewelry: "Une broche remarquable"
 gdp_tgf_curio_jewelry_desc: "La fabrication de l’aiguille a pris un mois à elle seule."
 gdp_tgf_curio_lacquerware: "Une boîte à souvenirs laquée"
 gdp_tgf_curio_lacquerware_desc: "Trente couches de laque. Elle a éclipsé le cadeau qu’elle contient."
 gdp_tgf_curio_silk: "Un reste de soie parfaite"
 gdp_tgf_curio_silk_desc: "Ce que le métier à tisser a produit de mieux. Non vendu sur le marché."
 gdp_tgf_curio_incense: "Un amas de résine pâle"
 gdp_tgf_curio_incense_desc: "Sent bon même sans être brûlée. Sent encore meilleur une fois brûlée. Personne ne la brûle."
 gdp_tgf_curio_medicaments: "Un assortiment d’apothicaire"
 gdp_tgf_curio_medicaments_desc: "Une dose de tout, contre tout."
 gdp_tgf_curio_stone: "Un fragment de pierre taillée"
 gdp_tgf_curio_stone_place: "Une pierre taillée provenant de [tgf_source_county.GetNameNoTierNoTooltip]"
 gdp_tgf_curio_stone_desc: "Plus vieille que n’importe quel maçon vivant, et mieux taillée, aussi."
 gdp_tgf_curio_salt: "Un bloc de sel blanc pur"
 gdp_tgf_curio_salt_desc: "Blanc comme la neige, ce qui n’est jamais le cas du sel gris."
 gdp_tgf_curio_alum: "Un cristal d’alun gros comme le poing"
 gdp_tgf_curio_alum_desc: "Transparent comme la glace. Pique la langue."
 gdp_tgf_curio_dyes: "Une fiole de teinture violette"
 gdp_tgf_curio_dyes_desc: "Une couleur auparavant réservée aux empereurs. Techniquement, c’est toujours le cas."
 gdp_tgf_curio_books_paper: "Une page enluminée"
 gdp_tgf_curio_books_paper_desc: "Une page en parfait état, provenant d’un livre introuvable."
 gdp_tgf_itinerary_artifact: "Un itinéraire de pèlerin"
 gdp_tgf_itinerary_artifact_desc: "Un petit livre usé où sont répertoriés routes, auberges et gués, dont les noms ont été soigneusement notés. Certains de ces endroits ne figurent sur aucune carte."
 gdp_tgf_first_sale_artifact: "[tgf_good.GetNameNoTooltip|U] des débuts de [tgf_first_seller.GetFirstNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "[tgf_good.Custom('GetTradeGood')|U] que [tgf_first_seller.GetFirstName] n’oubliera jamais, car il s’agit de sa toute première vente. Récupérer son bien précieux lui a valu de débourser deux fois son prix initial, et il n’est plus à vendre. A priori."
 gdp_tgf_merchant_portrait_artifact: "Portrait de marchand"
 gdp_tgf_merchant_portrait_artifact_desc: "Un marchand assis à une table de comptage, l’air très satisfait, peint avec une pile de pièces à ses côtés."
 gdp_tgf_bale_book_artifact: "Un livre provenant d’une cargaison"
 gdp_tgf_bale_book_artifact_desc: "Quelqu’un s’en est servi pour protéger des marchandises de l’humidité, ce qui semble avoir plus ou moins marché."
 gdp_tgf_handbook_practice_artifact: "#EMP La Pratique du commerce#!"
 gdp_tgf_handbook_practice_artifact_desc: "Poids, mesures, routes et prix, couchés sur le papier par un marchand qui, manifestement, ne dormait jamais. Quelqu’un d’autre a rempli les marges d’additions."
 gdp_tgf_handbook_roads_artifact: "#EMP Le Livre des Routes et marchés#!"
 gdp_tgf_handbook_roads_artifact_desc: "Toutes les routes qui relient les grands marchés, avec leurs péages, leurs auberges et les noms des passeurs malhonnêtes."
 gdp_tgf_handbook_mirror_artifact: "#EMP Le Miroir du marchand#!"
 gdp_tgf_handbook_mirror_artifact_desc: "Des conseils destinés aux marchands, de ce qu’il faut acheter aux personnes en qui l’on peut avoir confiance. L’ouvrage s’étend surtout sur celles dont il faut se méfier."
