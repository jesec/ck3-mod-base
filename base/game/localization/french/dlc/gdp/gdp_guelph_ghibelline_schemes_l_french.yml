l_french:
 #Side Switch Scheme
 gg_switch_sides: "Incitation à la défection"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.Custom('FR_le_Char_U_Pi')|U][SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] comprendra bientôt quelle est la bonne position dans cette situation..."
 gg_switch_sides_desc_general: "Le [scheme|El] d’$gg_switch_sides|l$ est un [political_scheme|El] qui vise à convaincre la [scheme_target|El] à changer de camp dans la [situation|El] des [guelph_ghibelline_situation|El]"
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] rejoint les [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_switch_sides_invalidated_title: "@scheme_icon! Fin du complot d’$gg_switch_sides|l$"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (complot)#!"
 gg_switch_sides_action: "Convaincre de changer de camp"
 scheme_interaction_tt_gg_switch_sides: "Tenter de convaincre [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] de rejoindre les [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUINameNoTooltip] est toujours mécontent[recipient.Custom('FR_E')] que vous lui ayez demandé de rejoindre les [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 #Claim Leadership Scheme
 gg_claim_leadership: "Revendication de la direction"
 gg_claim_leadership_desc: "Les [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')|l] comprendront bientôt qui est le plus apte à être leur chef."
 gg_claim_leadership_desc_general: "Le [scheme|El] de $gg_claim_leadership|l$ est un [political_scheme|El] qui vise à faire de l’[scheme_owner|El] le chef de son camp dans la [situation|El] des [guelph_ghibelline_situation|El]. Il s’agit d’un [secret_scheme|El] qui repose sur la [diplomacy|El] et qui permet de recruter des [agents|El].\n\nPlus l’[scheme_owner|El] possède de [gg_involvement|El] par rapport au chef actuel, plus la [scheme_success_chance|El] est élevée. Avoir un [prestige_level|El] supérieur au chef contribue également."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName|U] devient le chef des [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "Vous évitez de perdre du [prestige|El] et de détériorer les relations avec [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName]"
 gg_claim_leadership_invalidated_title: "@scheme_icon! Fin du complot de $gg_claim_leadership|l$"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (complot)#!"
 gg_claim_leadership_action: "Revendiquer la direction"
 scheme_interaction_tt_gg_claim_leadership: "Tenter de s’emparer de la direction des [recipient.Custom('GetGuelphsGhibellinesConcept')|l] aux mains [recipient.Custom('FR_du_Char_U_Pi')][recipient.GetShortUIName]"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "Alignement d’un indécis"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.Custom('FR_le_Char_U_Pi')|U][SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] sera amené[SCHEME.GetTargetCharacter.Custom('FR_E')] à être d’accord avec les [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')|l]"
 gg_align_undecided_desc_general: "Le [scheme|El] d’$gg_align_undecided|l$ est un [political_scheme|El] qui vise à ce que la [scheme_target|El] rejoigne le camp de l’[scheme_owner|El] dans la [situation|El] des [guelph_ghibelline_situation|El]"
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName] devient un[TARGET_CHARACTER.Custom('FR_E')] [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]"
 gg_align_undecided_invalidated_title: "@scheme_icon! Fin du complot d’$gg_align_undecided|l$"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (complot)#!"
 gg_align_undecided_action: "Aligner un indécis"
 scheme_interaction_tt_gg_align_undecided: "Tenter d’aligner [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] avec les [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "Remplacement du dirigeant"
 gg_replace_ruler_desc: "Les services [SCHEME.GetTargetCharacter.Custom('FR_du_Char_U_Pi')][SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] ne sont plus nécessaires. [SCHEME.GetTargetCharacter.GetSheHe|U] doit être remplacé[SCHEME.GetTargetCharacter.Custom('FR_E')] par quelqu’un de plus... raisonnable."
 gg_replace_ruler_desc_general: "Le [scheme|El] de $gg_replace_ruler|l$ est un [political_scheme|El] qui vise à remplacer la [scheme_target|El] par un dirigeant loyal au camp de l’[scheme_owner|El] dans la [situation|El] des [guelph_ghibelline_situation|El]"
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')|U][TARGET_CHARACTER.GetShortUIName|U] est remplacé[TARGET_CHARACTER.Custom('FR_E')] par un [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]"
 GG_REPLACE_RULER_DISCOVERY_DESC: "Vous évitez de perdre du [prestige|El] et de détériorer les relations avec [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName]"
 gg_replace_ruler_invalidated_title: "@scheme_icon! Fin du complot de $gg_replace_ruler|l$"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (complot)#!"
 gg_replace_ruler_action: "Remplacer le dirigeant"
 scheme_interaction_tt_gg_replace_ruler: "Tenter de remplacer [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUIName] avec un loyaliste [actor.Custom('GetGuelphGhibellineConcept')|l]"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUINameNoTooltip] est toujours sur le qui-vive depuis la dernière fois que vous avez essayé de [recipient.Custom('FR_LeLa')] remplacer"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "Impossible de remplacer un chef [GetSituation('guelph_ghibelline').GetName|l] pendant la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]"
 #Invalidation
 scheme_gg_situation_ended: "La situation des [guelph_ghibelline_situation|El] est terminée"
 scheme_owner_not_aligned: "Vous n’êtes plus un [guelph|El] ou un [ghibelline|El]"
 scheme_target_not_aligned: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] n’est plus un[target.Custom('FR_E')] [guelph|El] ou un[target.Custom('FR_E')] [ghibelline|El]"
 scheme_target_not_undecided: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] n’est plus [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'undecided' ).GetName][target.Custom('FR_E')]"
 scheme_owner_not_in_gg_situation: "Vous ne faites plus partie de la [situation|El] [GetSituation('guelph_ghibelline').GetName]"
 scheme_target_not_in_gg_situation: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] ne fait plus partie de la [situation|El] [GetSituation('guelph_ghibelline').GetName]"
 scheme_target_already_your_side: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] est déjà un[target.Custom('FR_E')] [target.Custom('GetGuelphGhibellineConcept')|l]"
 scheme_target_is_titleless: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] ne détient plus aucun titre"
 scheme_target_might_get_displaced: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] est le principal défenseur dans une [war|El] visant à [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|Vl]"
 scheme_target_might_get_reinstated: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] est le principal défenseur dans une [war|El] visant à [GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|Vl]"
 scheme_owner_is_already_leader: "Vous êtes déjà le chef des [owner.Custom('GetGuelphsGhibellinesConcept')|l]"
 scheme_target_no_longer_gg_leader: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] n’est plus le chef des [owner.Custom('GetGuelphsGhibellinesConcept')|l]"
