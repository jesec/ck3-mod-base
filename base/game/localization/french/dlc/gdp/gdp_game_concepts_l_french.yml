 merchant_tributary_patron: "[merchant_patron|E]"
 merchant_tributary_patron_plural: "[merchant_patrons|E]"
 merchant_tributary_client: "[client|E]"
 merchant_tributary_client_plural: "[clients|E]"
 tributary_default: "[tributary|E]"
 tributary_default_plural: "[tributaries|E]"
 suzerain_default: "[suzerain|E]"
 suzerain_default_plural: "[suzerains|E]"
 game_concept_merchant_charter: "Charte marchande"
 game_concept_merchant_charters: "Chartes marchandes"
 game_concept_charter: "Charte"
 game_concept_charters: "Chartes"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "[Concept('artifact', 'Document')|E] délivré par un [merchant_patron|El] à un de ses [clients|El].\n\nLe $game_concept_merchant|l$ qui possède une $game_concept_charter|l$ portant le sceau de son $game_concept_merchant_patron|l$ accède à :\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $abuse_charter_authority_decision$#!#!\n$EFFECT_LIST_BULLET$#EMP #V [decision|E] $benevolent_charter_authority_decision$#!#!\n$EFFECT_LIST_BULLET$#EMP #V [interaction|E] $leverage_charter_authority_interaction$#!#!"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "[interaction|E] utilisée pour demander une faveur, un financement ou un autre type de soutien à un [merchant_patron|El]."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "[interaction|E] utilisée par un [vassal|El], un [tributary|El] ou un [client|El] pour renégocier ses obligations avec son [liege|El] ou [suzerain|El]."
 game_concept_leading_title: "Titre dirigeant"
 game_concept_leading_title_desc: "[title|E] qui dirige une confédération fondée sur un titre telle qu’une [trade_league|El].\n\nSon [holder|El] est le [trade_league_leader|El] de la confédération."
 game_concept_client_contract: "Contrat de client"
 game_concept_client_contracts: "Contrats de client"
 game_concept_client_contract_desc: "Le $game_concept_client_contract|l$ définit les [obligations|El] qui lient un [client|El] à son [merchant_patron|El].\n\nQuatre obligations peuvent être négociées : la part des recettes [Concept('trade', 'commerciales')|E] versée au mécène, le soutien au [prestige|El] apporté par le mécène, le soutien à la [trade_competitiveness|El] ainsi que l’organisation de [marriages|El] pour le compte de la famille marchande.\n\nCe contrat est transmis par héritage lors d’une succession et ne peut être dissout que si la [company|El] est relocalisée dans une autre [holding|El]."
 game_concept_member_title: "Titre de membre"
 game_concept_member_title_desc: "[title|E] faisant partie d’une confédération fondée sur des titres, à l’instar d’une [trade_league|El]."
 game_concept_company_sentiment: "Orientation de la compagnie"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "Orientation"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "L’$game_concept_company_sentiment|l$ reflète les pratiques d’une [merchant_family|El] et les relations entre ses membres.\n\nIl existe plusieurs [company_sentiment_levels|El], chacune apportant divers avantages et inconvénients aux membres de la [house|E].\n\nL’$game_concept_company_sentiment|l$ évolue en fonction des actions menées collectivement par les membres de la $game_concept_company|l$. Les [company_sentiment_positive_actions|El] orienteront généralement la direction vers [company_sentiment_concerted|E] [company_sentiment_concerted_i], tandis que les [company_sentiment_negative_actions|E] orienteront la société vers [company_sentiment_divided|El][company_sentiment_divided_i].\n\nEn général, les [house_heads|El] exercent une plus grande influence sur l’$game_concept_sentiment|l$ de leur Maison que les autres membres."
 game_concept_company_sentiment_level: "Position de la compagnie"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "Positions de la compagnie"
 game_concept_company_sentiment_level_desc: "État actuel de l’[company_sentiment|El]. La position évolue à mesure que l’$game_concept_sentiment|l$ va vers la [Concept('company_sentiment_concerted', 'Noblesse')|El][company_sentiment_concerted_i] par des [company_sentiment_positive_actions|El], ou vers la [Concept('company_sentiment_divided', 'Prédation')|El][company_sentiment_divided_i] par des [company_sentiment_negative_actions|El], et chaque position confère aux membres d’une [house|E] des avantages et des pénalités différents.\n\nIl existe cinq positions distinctes :\n$EFFECT_LIST_BULLET$[company_sentiment_divided|E][company_sentiment_divided_i]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious|E][company_sentiment_fractious_i]\n$EFFECT_LIST_BULLET$[company_sentiment_independent|E][company_sentiment_independent_i]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative|E][company_sentiment_cooperative_i]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted|E][company_sentiment_concerted_i]"
 game_concept_company_sentiment_divided: "Prédatrice"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "Opportuniste"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "Équilibrée"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "Rapace"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "Anoblie"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"
 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"
 game_concept_company_sentiment_divided_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_divided$ est la position la plus compétitive. Lorsqu’une [company|El] adopte cette position, tous les membres de la famille privilégient le profit avant tout, même si cela implique de se marcher sur les pieds.\n\n#bold Effets de cette $game_concept_company_sentiment_level|l$ :#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$ : #N -20#!\n$EFFECT_LIST_BULLET$Opinion de [merchant_patron|El] : #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness|E][competitiveness_i] : #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_regional_networks_decision$#!#!"
 game_concept_company_sentiment_fractious_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_fractious$ est une position très compétitive, juste derrière celle de la [rapacious|El]. Lorsqu’une [company|El] adopte cette position, ses membres font passer leurs intérêts individuels avant leurs obligations familiales.\n\n#bold Effets de cette [company_sentiment_level|El] :#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$ : #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness|E] : #P +10%#![competitiveness_i]\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_establish_network_decision$#!#!"
 game_concept_company_sentiment_independent_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_independent$ est la position intermédiaire. Lorsqu’une [company|El] adopte cette position, la famille continue d’avoir besoin d’une figure respectée, mais ses membres sont libres de gérer leurs propres affaires sans ingérence ni jugement.\n\n#bold Effets de cette [company_sentiment_level|El] :#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_consult_house_decision$#!#!"
 game_concept_company_sentiment_cooperative_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_cooperative$ est fortement axée sur la légitimité, juste derrière l’[ennobled|El]. Lorsqu’une [company|El] adopte cette position, sa réputation et celle de ses membres ne font plus qu’un, et chaque membre doit s’efforcer d’améliorer son image ainsi que son statut social.\n\n#bold Effets de cette [company_sentiment_level|El] :#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$ : #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$ : #P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$ : #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_prosperity_decision$#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_bailiffs_decision$#!#!"
 game_concept_company_sentiment_concerted_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_concerted$ est celle qui met le plus l’accent sur la légitimité. Lorsqu’une [company|El] adopte cette position, la loyauté née du devoir et du respect aligne les intérêts de l’ensemble sur ceux du chef, et la compagnie peut se retrouver sur un pied d’égalité avec les familles nobles.\n\n#bold Effets de cette [company_sentiment_level|El] :#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$ : #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$ : #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_family_business_decision$#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_prosperity_decision$#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_bailiffs_decision$#!#!"
 game_concept_company_sentiment_positive_actions: "Actions légitimantes"
 game_concept_company_sentiment_positive_actions_desc: "Les actions légitimantes menées par votre [company|El] font évoluer l’[sentiment|El] de celle-ci vers la [Concept('company_sentiment_concerted', 'Noblesse')|E][company_sentiment_concerted_i]\n\nLes [house_heads|El] peuvent utiliser la [decision|El] #V $unity_merchant_promote_excess_decision$#! pour faire fortement pencher l’[sentiment|El] vers la [Concept('company_sentiment_concerted', 'Noblesse')|E][company_sentiment_concerted_i]\n\n#weak Voici quelques exemples d’$game_concept_company_sentiment_positive_actions|l$ :$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "Actions lucratives"
 game_concept_company_sentiment_negative_actions_desc: "Les actions lucratives menées par votre [company|El] font évoluer son [sentiment|El] vers la [Concept('company_sentiment_divided', 'Prédation')|E][company_sentiment_divided_i].\n\nLes [house_heads|El] peuvent utiliser la [decision|El] #V $unity_merchant_promote_diligence_decision$#! pour faire fortement pencher l’[sentiment|El] vers la [Concept('company_sentiment_divided', 'Prédation')|E][company_sentiment_divided_i]\n\n#weak Voici quelques exemples d’$game_concept_company_sentiment_negative_actions|l$ :$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ entre la Maison et la noblesse\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ Mener à bien une sollicitation d’un associé\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ avec une autre Maison marchande\n$EFFECT_LIST_BULLET$ Inviter à la compagnie\n$EFFECT_LIST_BULLET$ Refuser une sollicitation d’un associé\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$"
 game_concept_republican_army: "Armée républicaine"
 game_concept_republican_armies: "Armées républicaines"
 game_concept_republican_army_desc: "Une $game_concept_republican_army|l$ est une [army|El] recrutée et entretenue par un [realm|El] doté d’un [government|El] [republican|El].\n\nElle est composée exclusivement d’[title_men_at_arms|El] et est contrôlée par celui qui occupe la fonction de [liege|El]."
