 tributary_default_no_tooltip_lowercase: "tributaire"
 tributary_default_no_tooltip_lowercase_plural: "tributaires"
 tributary_default_no_tooltip_lowercase_plural_possessive: "tributaires"
 merchant_tributary_client_no_tooltip_lowercase: "client"
 merchant_tributary_client_no_tooltip_lowercase_plural: "clients"
 merchant_tributary_client_no_tooltip_lowercase_plural_possessive: "clients"
 suzerain_default_no_tooltip_lowercase: "suzerain"
 suzerain_default_no_tooltip_lowercase_plural: "suzerains"
 suzerain_default_no_tooltip_lowercase_plural_possessive: "suzerains"
 merchant_tributary_patron_no_tooltip_lowercase: "mécène"
