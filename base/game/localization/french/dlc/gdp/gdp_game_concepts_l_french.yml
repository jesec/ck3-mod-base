l_french:
 # Trade
 game_concept_trade: "Commerce"
 game_concept_trade_desc: "Le $game_concept_trade|l$ est le moteur des [republics|El], des [trade_leagues|El] et des [merchants|El].\n\nLes [trade_routes|El] assurent l’importation et l’exportation de [goods|El] vers et depuis les [trade_markets|El], tandis que les [needs|El] et les [surpluses|El] d’un marché sont déterminés par les [buildings|El] et les [baronies|El] qui y sont associées.\n\nLes prix de vente, quant à eux, sont déterminés par la [prosperity|El] d’une propriété, et les personnages impliqués dans les ventes utilisent la [competitiveness|El] et les [monopolies|El] pour dominer les marchés. Afin d’augmenter les bénéfices, chaque acteur d’un marché doit s’efforcer d’accroître la [capacity|El] et la longueur des routes, ainsi que le nombre de marchés et de biens sur chaque route.\n\nToutes les [government_forms|El], à l’exception des [adventurers|El] et des [nomads|El], peuvent participer au $game_concept_trade|l$."
 game_concept_trade_good: "Bien commercial"
 game_concept_trade_goods: "Biens commerciaux"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "Bien commercial"
 game_concept_trade_goods_possessive: "Biens commerciaux"
 game_concept_good: "Bien"
 game_concept_goods: "Biens"
 game_concept_basic_trade_good: "Bien commercial de base"
 game_concept_basic_trade_goods: "Biens commerciaux de base"
 game_concept_basic_trade_good_desc: "[trade_goods|E] qui peuvent être transportés via une [distribution_route|El].\n\nEn revanche, une [profit_route|El] ou une [commission_route|El] peut concerner tous les types de $game_concept_trade_goods|l$."
 game_concept_market_toll: "Droits de marché"
 game_concept_market_tolls: "Droits de marché"
 game_concept_toll: "Droits"
 game_concept_tolls: "Droits"
 game_concept_market_toll_desc: "Redevances prélevées à chaque vente effectuée sur un [trade_market|El].\n\nElles sont contrôlées par le [market_owner|El], qui en perçoit également l’intégralité des recettes.\n\nLes marchés dont les $game_concept_market_tolls|l$ sont moins élevés sont plus rentables pour les [merchants|El].\n\nDes $game_concept_market_tolls|l$ plus élevés augmentent le [income|El] du $game_concept_owner|l$, mais réduisent les bénéfices que les $game_concept_merchants|l$ réalisent sur toutes les [profit_routes|El] où ils vendent des $game_concept_goods|l$ sur ce $game_concept_market|l$. Des $game_concept_tolls|l$ trop élevés peuvent inciter les $game_concept_merchants|l$ à vendre sur des $game_concept_markets|l$ où ils sont moins élevés.\n\nLe [market_owner|El] et ses [direct_vassals|El], [tributaries|El] et [clients|El] sont exemptés du paiement des droits."
 game_concept_good_possessive: "Bien"
 game_concept_goods_possessive: "Biens"
 game_concept_trade_good_desc: "Les $game_concept_trade_goods|l$ peuvent être achetés et vendus sur un [market|El]. Une multitude de produits sont commercialisés partout dans le monde pour répondre aux [needs|El] des [realms|El]."
 game_concept_trade_category: "Catégorie de bien"
 game_concept_trade_categories: "Catégories de bien"
 game_concept_trade_category_short: "Catégorie"
 game_concept_trade_categories_short: "Catégories"
 game_concept_trade_category_desc: "Groupes de [trade_goods|El]. Les [trade_markets|El] ont souvent [need|El] de biens d’une certaine catégorie. Tout bien appartenant à cette catégorie peut répondre au besoin."
 game_concept_trade_expertise: "Expertise commerciale"
 game_concept_expertise: "Expertise"
 game_concept_trade_expertise_desc: "Expérience du commerce dans une [Concept('trade_category', 'catégorie')|E] spécifique. Elle s’acquiert grâce au [primary_good|El] des [trade_routes|El] actives. À mesure que l’expertise augmente, le commerce de cette catégorie devient plus rentable et les [expertise_levels|El] supérieurs confèrent des bonus supplémentaires, qui dépendent de la catégorie."
 game_concept_trade_expertise_progress: "Progression de l’expertise commerciale"
 game_concept_expertise_progress: "Progression de l’expertise"
 game_concept_trade_expertise_progress_desc: "Chaque point d’[expertise|El] augmente la progression d’un personnage vers le [expertise_level|El] suivant."
 game_concept_trade_expertise_level: "Niveau d’expertise commerciale"
 game_concept_expertise_level: "Niveau d’expertise"
 game_concept_expertise_levels: "Niveaux d’expertise"
 game_concept_trade_expertise_level_desc: "Le $game_concept_trade_expertise_level|l$ d’une [trade_category|El] est un classement qui reflète le degré d’expérience d’une [trade_company|El] dans le commerce au sein de cette catégorie.\n\nIl progresse à mesure que des [Concept('expertise_progress', 'points d’expertise')|E] sont accumulés grâce à des [trade_routes|El] et chaque niveau offre des bonus [Concept('trade', 'commerciaux')|El] supplémentaires.\n\nEn l’absence de commerce dans la catégorie, le niveau diminue progressivement (#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! points d’expertise par mois)."
 game_concept_trade_market: "Marché commercial"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "Marchés commerciaux"
 game_concept_trade_market_possessive: "Marché commercial"
 game_concept_trade_markets_possessive: "Marchés commerciaux"
 game_concept_market: "Marché"
 game_concept_markets: "Marchés"
 game_concept_market_possessive: "Marché"
 game_concept_markets_possessive: "Marchés"
 game_concept_trade_market_desc: "Nœud commercial qui regroupe la [production|El] et les [needs|El] de toutes les [holdings|El] qu’il englobe.\n\nAu sein d’un marché, la production locale sert d’abord à satisfaire les [needs|El] de ses [buildings|El]. Tout ce qui reste constitue un [surplus|El] pouvant être vendu ; les besoins non satisfaits doivent être couverts par des importations. Des [trade_routes|El] relient les marchés afin d’acheminer les [goods|El] entre eux.\n\nChaque marché a pour centre une [market_capital|El], détenue par le [Concept('market_owner', 'propriétaire du marché')|E]. Plus la [market_prosperity|El] est élevée, meilleurs sont les [sell_prices|El] proposés aux négociants."
 game_concept_market_prosperity: "Prospérité de marché"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "Niveau de [prosperity|El] moyen des [counties|El] d’un [market|El].\n\nUn niveau plus élevé augmente les [sell_prices|El] des [goods|El] sur le marché, ce qui en fait une destination plus lucrative pour les [merchants|El]."
 game_concept_market_capital: "Capitale de marché"
 game_concept_market_capitals: "Capitales de marché"
 game_concept_market_capital_possessive: "Capitale de marché"
 game_concept_market_capitals_possessive: "Capitales de marché"
 game_concept_market_capital_desc: "[holding|E] au cœur d’un [market|El], généralement la capitale [de_jure|El] du [duchy|El] que le marché couvre.\n\nElle est déterminée en début de partie et ne bouge pas. La personne qui détient cette [barony|El] devient le [Concept('market_owner', 'propriétaire du marché')|El] et le contrôle."
 game_concept_market_owner: "Propriétaire de marché"
 game_concept_market_owners: "Propriétaires de marché"
 game_concept_market_owner_possessive: "Propriétaire de marché"
 game_concept_market_owners_possessive: "Propriétaires de marché"
 game_concept_owner: "Propriétaire"
 game_concept_owners: "Propriétaires"
 game_concept_owner_possessive: "Propriétaire"
 game_concept_owners_possessive: "Propriétaires"
 game_concept_market_owner_desc: "Le propriétaire du marché est celui qui détient la [Concept('market_capital', 'capitale')|E] d’un [market|El], dont le contrôle est transféré avec la possession de sa [barony|El], que ce soit par la guerre ou par héritage.\n\nLe propriétaire du marché en a le contrôle ; il peut créer des [distribution_routes|El] reliées à celui-ci, il est le partenaire indispensable pour les [commission_routes|El], il peut accorder des [monopolies|El] sur ce marché et fixer ses [market_toll|El]."
 game_concept_market_priority: "Priorité de marché"
 game_concept_market_priorities: "Priorités de marché"
 game_concept_market_priority_desc: "La $game_concept_market_priority|l$ correspond à l’ordre dans lequel les [holdings|El] d’un [market|El] sont approvisionnées pour répondre à leurs [needs|El].\n\nLa [market_capital|El] vient en premier, suivie par le reste du [county|El] puis par les autres $game_concept_counties|l$ en fonction de la [settlement_size|El] de leur [Concept('county_capital', 'capitale')|El].\n\nAu sein d’un $game_concept_county|l$, la [Concept('county_capital', 'capitale')|El] vient en premier, puis les autres $game_concept_holdings|l$ selon leur [settlement_size|El].\n\nAu sein d’une [holding|El], vous pouvez modifier l’ordre des [districts|El] et des [buildings|El] afin de vous assurer que les [needs|El] du bon [building|El] soient satisfaits en priorité."
 game_concept_market_share: "Part de marché"
 game_concept_market_shares: "Parts de marché"
 game_concept_market_share_desc: "Votre $game_concept_market_share|l$ indique la quantité d’un [trade_good|El] que votre [profit_route|El] peut commercialiser sur un [market|El] donné, ce qui détermine votre $game_concept_competitiveness|l$.\n\nPar exemple, si vous disposez d’une $game_concept_competitiveness|l$ équivalente à celle de tous les autres acteurs combinés pour un $game_concept_good|l$ donné, votre $game_concept_market_share|l$ sera de 50%. Si personne d’autre ne commercialise ce $game_concept_good|l$, votre $game_concept_market_share|l$ sera toujours de 100%.\n\nDans ce cas, vous pouvez acheter ou vendre la totalité de l’[surplus|El] afin de satisfaire tous les [needs|El] de ce $game_concept_market|l$, à condition de disposer d’une [capacity|El] suffisante."
 game_concept_trade_route: "Route commerciale"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "Routes commerciales"
 game_concept_trade_route_possessive: "Route commerciale"
 game_concept_trade_routes_possessive: "Routes commerciales"
 game_concept_route: "Route"
 game_concept_routes: "Routes"
 game_concept_route_possessive: "Route"
 game_concept_routes_possessive: "Routes"
 game_concept_trade_route_desc: "Une $game_concept_trade_route|l$ permet à un [character|El] de participer au [trade|El] pour de l’[gold|El] ou pour subvenir aux [needs|El] de son propre [realm|El]. Ainsi, les [goods|El] sont acheminés entre les [markets|El] : l’[surplus|El] d’un marché sert à répondre aux besoins d’un autre.\n\nIl existe trois types de route :\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E] : utilisée par les [dukes|El] ou supérieur pour répondre aux [needs|El] de leurs [buildings|El].\n$EFFECT_LIST_BULLET$[profit_route|E] : utilisée par les dirigeants [merchants|El] et [republicans|El] pour générer de l’[gold|El].\n$EFFECT_LIST_BULLET$[commission_route|E] : similaire à la [profit_route|El], mais délivrée par les dirigeants terriens afin que les marchands puissent répondre à certains besoins pendant une durée limitée, moyennant un paiement unique versé à l’avance.#!"
 game_concept_distribution_route: "Route de distribution"
 game_concept_distribution_routes: "Routes de distribution"
 game_concept_distribution: "Distribution"
 game_concept_distribution_route_possessive: "Route de distribution"
 game_concept_distribution_routes_possessive: "Routes de distribution"
 game_concept_distribution_route_desc: "Une $game_concept_distribution_route|l$ est un type de [trade_route|El] utilisée par les [dukes|El] ou supérieur pour approvisionner leur propre [realm|El].\n\nElle relie deux [markets|El], et tout [surplus|El] constaté sur l’un d’eux sert à couvrir les [needs|El] de l’autre. Toutefois, seuls les [basic_trade_goods|El] peuvent être acheminés via les $game_concept_distribution_routes|l$."
 game_concept_profit_route: "Route lucrative"
 game_concept_profit_routes: "Routes lucratives"
 game_concept_profit: "Profit"
 game_concept_profit_route_possessive: "Route lucrative"
 game_concept_profit_routes_possessive: "Routes lucratives"
 game_concept_profit_route_desc: "Une $game_concept_profit_route|l$ est un type de [trade_route|El] empruntée par les [rulers|El] [merchants|El] et [Concept('republican', 'républicains')|E] pour gagner de l’[gold|El].\n\nOn achète des [trade_goods|El] à bas prix là où il y a un [surplus|El] et on les revend là où les [needs|El] sont importants, afin de tirer profit de la différence entre le [buy_price|El] et le [sell_price|El]."
 game_concept_trade_route_modifier: "Modificateur de route commerciale"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "Modificateurs de route commerciale"
 game_concept_trade_route_modifier_desc: "Ce [modifier|El] s’applique à toutes les [trade_routes|El] de leur propriétaire. Les différents attributs modifiables sont :\n$BULLET_WITH_TAB$[competitiveness_i][trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i][route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i][max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i][max_trade_markets_short|E]"
 game_concept_commission_route: "Route sous commission"
 game_concept_commission_route_desc: "[trade_route|E] qu’un [merchant|El] exploite pour le compte d’un [merchant_patron|El].\n\nLe $game_concept_merchant|l$ est rémunéré par le $game_concept_merchant_patron|l$ pour acheminer un [trade_good|El] donné, pendant la durée de la $game_concept_commission|l$, vers un [trade_market|El] déterminé.\n\nUn $game_concept_merchant|l$ peut avoir #V 1#! $game_concept_commission_route|l$ à la fois."
 game_concept_commission_routes: "Routes sous commission"
 game_concept_commission_route_possessive: "Route sous commission"
 game_concept_commission_routes_possessive: "Routes sous commission"
 game_concept_commission: "Commission"
 game_concept_commissions: "Commissions"
 game_concept_commission_possessive: "Commission"
 game_concept_commissions_possessive: "Commissions"
 game_concept_commissioned_route: "Route commissionnée"
 game_concept_commissioned_routes: "Routes commissionnées"
 game_concept_trade_route_length: "Longueur de la route commerciale"
 game_concept_route_length: "Longueur de la route"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "Nombre maximal de [baronies|El] qu’une [profit_route|El] peut traverser, y compris les mers et les cours d’eau navigables. Cela peut être augmenté si les [company_buildings|El] sont améliorés."
 game_concept_max_trade_goods: "Nombre maximum de biens commerciaux"
 game_concept_max_trade_goods_short: "Biens commerciaux"
 game_concept_max_trade_goods_desc: "Nombre de types de [good|El] qui peut être échangé sur une [route|El]. Il peut être augmenté en améliorant des [company_buildings|El].\n\nUne [profit_route|El] ne peut jamais transporter plus de #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#! [goods|El], quels que soient ses bonus."
 game_concept_max_trade_markets: "Nombre maximum de marchés commerciaux"
 game_concept_max_trade_markets_short: "Marchés commerciaux"
 game_concept_max_trade_markets_desc: "Nombre de [markets|El] qu’un [character|El] peut choisir comme arrêts le long d’une [profit_route|El]. Cela peut être augmenté si les [company_buildings|El] sont améliorés."
 game_concept_trade_route_capacity: "Capacité de la route commerciale"
 game_concept_trade_route_capacity_short: "Capacité commerciale"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "Capacité"
 game_concept_trade_route_capacity_desc: "La $game_concept_trade_route_capacity|l$ détermine la quantité de [trade_goods|El] pouvant être échangés le long d’une [profit_route|El] à un moment donné. Cela peut être augmenté si les [company_buildings|El] sont améliorés."
 game_concept_primary_good: "Bien principal"
 game_concept_primary_goods: "Biens principaux"
 game_concept_primary_good_desc: "Les [merchants|El] et les [patricians|El] ont un [trade_good|El] qui est le $game_concept_primary_good|l$ pour leurs [trade_routes|El].\n\nLe commerce de ce bien permet d’acquérir une [trade_expertise|El] dans sa [Concept('trade_category', 'catégorie')|E]."
 game_concept_road: "Voie"
 game_concept_roads: "Voies"
 game_concept_road_possessive: "Voie"
 game_concept_roads_possessive: "Voies"
 game_concept_road_desc: "Une [road|El] relie deux [markets|El] et permet aux [trade_routes|El] de circuler entre eux.\n\nLes $game_concept_trade_routes|l$ tirent profit du fait de passer par une $game_concept_road|l$, notamment parce que cela augmente la [trade_route_length|El].\n\nUne $game_concept_road|l$ profite également directement à la [barony|El] qu’elle traverse, par exemple en accélérant les déplacements des [armies|El].\n\nLes avantages d’une $game_concept_road|l$ augmentent avec son [road_tier_short|El]."
 game_concept_road_tier: "Niveau de voie"
 game_concept_road_tiers: "Niveaux de voie"
 game_concept_road_tier_short: "Niveau"
 game_concept_road_tier_desc: "Le $game_concept_road_tier|l$ d’une [road|El] indique son degré de développement ; il va d’une piste rudimentaire et non aménagée à une voie bien construite.\n\nLe niveau d’une $game_concept_road|l$ augmente à mesure que le [trade|El] qui l’emprunte s’intensifie, et chaque niveau nécessite une utilisation plus importante et prend plus de temps à achever que le précédent. Les niveaux supérieurs renforcent les effets de la $game_concept_road|l$ : une plus grande [trade_route_length|El] pour les [trade_routes|El] qui l’empruntent et des bonus plus importants pour les [baronies|El] qu’elle traverse.\n\nLes $game_concept_roads|l$ commencent avec un niveau fixe sur la carte et seules celles dont le niveau est supérieur au niveau minimum apparaissent au début de la partie."
 game_concept_building_need: "Besoin du bâtiment"
 game_concept_building_needs: "Besoins du bâtiment"
 game_concept_need: "Besoin"
 game_concept_needs: "Besoins"
 game_concept_building_need_desc: "Un [building|El] peut avoir des $game_concept_needs|l$ en [trade_goods|El], qui confèrent des bonus s’ils sont satisfaits.\n\nCes $game_concept_needs|l$ peuvent porter sur un [good|El] spécifique #weak (comme le [GetTradeGoodType('trade_good_wine').GetName|l])#! ou sur n’importe quel $game_concept_good|l$ d’une certaine [trade_category_short|El] #weak (comme l’[GetTradeGoodCategory('trade_category_alcohol').GetName|l])#!.\n\nTous les $game_concept_needs|l$ sont satisfaits grâce aux $game_concept_trade_goods|l$ disponibles sur le [market|El] local. S’il n’y a pas d’[surplus|El] de ce $game_concept_good|l$ sur le $game_concept_market|l$ local, les $game_concept_goods|l$ sont répartis selon la [market_priority|El].\n\nLes $game_concept_needs|l$ sont toujours optionnels, il n’y a aucun inconvénient à ne pas les satisfaire."
 game_concept_market_balance: "Solde de marché"
 game_concept_market_balances: "Soldes de marché"
 game_concept_market_balance_short: "Solde"
 game_concept_market_balances_short: "Soldes"
 game_concept_market_balance_desc: "Chaque [market|El] dispose d’un solde pour chaque [trade_good|El] ou catégorie de [good|El].\n\nSi le solde est positif, il y a un [surplus|El].\n\nS’il est négatif, certains [buildings|El] du marché auront des [needs|El] non satisfaits."
 game_concept_trade_surplus: "Excédent de marché"
 game_concept_trade_surpluses: "Excédents de marché"
 game_concept_surplus: "Excédent"
 game_concept_surpluses: "Excédents"
 game_concept_trade_surplus_desc: "Un [trade_good|El] est en $game_concept_surplus|l$ sur un [market|El] lorsque la [production|El] est supérieure aux [needs|El].\n\nCela signifie que tous les [buildings|El] du $game_concept_market|l$ ont vu leurs $game_concept_needs|l$ satisfaits.\n\nCet excédent peut être exporté vers d’autres $game_concept_markets|l$ via des [trade_routes|El]."
 game_concept_trade_deficit: "Déficit de marché"
 game_concept_trade_deficits: "Déficits de marché"
 game_concept_deficit: "Déficit"
 game_concept_deficits: "Déficits"
 game_concept_trade_deficit_desc: "Un [trade_good|El] présente un $game_concept_deficit|l$ sur un [market|El] lorsque les [needs|El] sont supérieurs à la [production|El] ou aux importations.\n\nCela signifie que certains [buildings|El] du $game_concept_market|l$ ne verront pas leurs $game_concept_needs|l$ satisfaits.\n\nLes importations via les [trade_routes|El] peuvent contribuer à combler ce $game_concept_deficit|l$."
 game_concept_production: "Production"
 game_concept_productions: "Production"
 game_concept_trade_goods_production: "Production de biens commerciaux"
 game_concept_produced: "Produit"
 game_concept_production_desc: "La $game_concept_production|l$ est la quantité d’un [trade_good|El] produit chaque mois dans les [districts|El] et leurs [buildings|El].\n\nLorsque la $game_concept_production|l$ d’un [market|El] dépasse ses [needs|El] pour un bien, l’[surplus|El] devient disponible pour le [trade|El]. Lorsque la $game_concept_production|l$ est insuffisante, les besoins ne sont pas satisfaits."
 game_concept_potential_production: "Production potentielle"
 game_concept_potential_productions: "Production potentielle"
 game_concept_potential_production_desc: "La production potentielle de chaque [county|El] détermine les [Concept('trade_goods', 'matières premières')|E] pouvant être produites dans le [resource_district|El] de la [county_capital|El]."
 game_concept_sell_price: "Prix de vente"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "Prix de vente"
 game_concept_sell_price_desc: "Le $game_concept_sell_price|l$ sur un [market|El] correspond à la valeur en [gold|El] d’un [trade_good|El] pour lequel il existe un [need|El].\n\nLes propriétaires des [profit_routes|El] perçoivent le $game_concept_sell_price|l$ d’un $game_concept_trade_good|l$ sur un $game_concept_market|l$ lorsque leur [route|El] y vend des $game_concept_goods|l$ afin de répondre aux $game_concept_needs|l$ du $game_concept_market|l$.\n\nLes [rulers|El] [Concept('landed', 'terriens')|E] tirent également profit d’un $game_concept_sell_price|l$ élevé, car davantage de [merchants|El] seront attirés par le $game_concept_market|l$, ce qui augmentera les recettes issues des [tolls|El], ou la probabilité que le $game_concept_need|l$ soit satisfait.\n\nDes $game_concept_tolls|l$ sont versés pour chaque $game_concept_good|l$ vendu, ce qui réduit le $game_concept_sell_price|l$ réel.\n\nDe même, son pendant, le [buy_price|El], augmente avec la [Concept('market_prosperity', 'prospérité')|E] du marché."
 game_concept_buy_price: "Prix d’achat"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "Prix d’achat"
 game_concept_buy_price_desc: "Le $game_concept_buy_price|l$ sur un [market|El] correspond au coût en [gold|El] d’un [trade_good|El] en [surplus|El].\n\nLes propriétaires des [profit_routes|El] paient le $game_concept_buy_price|l$ d’un $game_concept_trade_good|l$ sur un $game_concept_market|l$ lorsque leur [route|El] y achète des $game_concept_goods|l$ en $game_concept_surplus|l$.\n\nDe même, son pendant, le [sell_price|El], augmente avec la [Concept('market_prosperity', 'prospérité du marché')|El]."
 game_concept_trade_monopoly: "Monopole commercial"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "Monopoles commerciaux"
 game_concept_monopoly: "Monopole"
 game_concept_monopolies: "Monopoles"
 game_concept_trade_monopoly_desc: "Un $game_concept_monopoly|l$ permet à son propriétaire d’être le seul à acheter et à vendre des [goods|El] sur un [market|El].\n\nUn $game_concept_monopoly|l$ peut prendre différentes formes :\n #indent_newline:4    $EFFECT_LIST_BULLET$Un $game_concept_monopoly|l$ normal s’applique à une seule [trade_category|El], tandis qu’un [complete_monopoly|El] s’applique à toutes.\n$EFFECT_LIST_BULLET$Un [exploitative_monopoly|El] permet à son propriétaire d’acheter la [production|El] de $game_concept_goods|l$ avant même que les [needs|El] ne soient satisfaits.\n$EFFECT_LIST_BULLET$Un $game_concept_monopoly|l$ peut appartenir à un [merchant|El], à une [republic|El] ou à une [trade_league|El].#!\n\nLes $game_concept_monopolies|l$ peuvent être acquis grâce à l’interaction $request_trade_monopoly_for_character_interaction|V$."
 game_concept_complete_monopoly: "Monopole complet"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "Monopoles complets"
 game_concept_complete_monopoly_short: "Complet"
 game_concept_complete_monopoly_desc: "Un $game_concept_complete_monopoly|l$ couvre chaque [trade_good|El] d’un [trade_market|El]. Contrairement à un [monopoly|El] classique, il ne se limite pas à une seule [trade_category|El]."
 game_concept_exploitative_monopoly: "Monopole d’exploitation"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "Monopoles d’exploitation"
 game_concept_exploitative_monopoly_short: "Exploitant"
 game_concept_exploitative_monopoly_desc: "Un $game_concept_exploitative_monopoly|l$ est un type de [monopoly|El] qui permet à son propriétaire d’acheter directement la [production|El] du [market|El].\n\nEn règle générale, seul l’[surplus|El] peut être acheté. Cependant, le propriétaire d’un $game_concept_exploitative_monopoly|l$ peut acheter la $game_concept_production|l$ des [buildings|El] du $game_concept_market|l$ avant même que les [building_needs|El] locaux ne soient satisfaits."
 game_concept_trade_competitiveness: "Compétitivité commerciale"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "Compétitivité"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "Chaque [profit_route|El] possède sa propre $game_concept_competitiveness|l$ : il s’agit de la quantité de [trade_goods|El] pouvant être échangés sur un [market|El] lorsque l’on est en concurrence avec d’autres $game_concept_profit_routes|l$.\n\nPlus votre $game_concept_competitiveness|l$ totale pour un $game_concept_trade_good|l$ est élevée, plus votre [market_share|El] sera importante.\n\nS’il existe un [monopoly|El] sur le $game_concept_market|l$, seuls les détenteurs de ce $game_concept_monopoly|l$ compareront leur $game_concept_competitiveness|l$."
 game_concept_competitive_pressure: "Pression concurrentielle"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "Pression commerciale à court terme qu’un [merchant|El] peut exercer. Elle peut se traduire par des [decisions|El] et des [interactions|El] spécifiques visant à obtenir des avantages particuliers sur certaines [trade_routes|El]."
 game_concept_put_on_notice: "Mis en garde"
 game_concept_put_on_notice_desc: "[character_interaction|E] débloquée par l’[perk|El] [GetPerk('prepared_conscription_perk').GetName(GetPlayer)]. Elle utilise de la [competitive_pressure|El][competitive_pressure_i] pour lancer une [trade_opportunity|El] contre un [merchant|El] concurrent sur l’un des [trade_markets|El] de votre [trade_route|El]."
 game_concept_ruthless_oversight: "Supervision impitoyable"
 game_concept_ruthless_oversight_desc: "[character_interaction|E] débloquée par l’[perk|El] [GetPerk('fear_tax_perk').GetName(GetPlayer)]. Elle peut augmenter la [aptitude|El] à un [court_position|El] d’un personnage au prix de [dread|El], [opinion|El] et [company_sentiment|El]."
 game_concept_request_merchant_charter: "Demander une charte marchande"
 game_concept_request_merchant_charter_desc: "[character_interaction|E] au cours de laquelle un [merchant|El] demande à son [merchant_patron|El] de lui accorder une [charter|El], ce qui lui confère des privilèges sur le [market|El] local."
 game_concept_monopolize_trade: "Monopoliser le commerce"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "[character_interaction|E] au cours de laquelle un [merchant|El] verse de l’[gold|El] à un [market_owner|El] en échange d’un [trade_monopoly|El]."
 game_concept_trader: "Négociant"
 game_concept_traders: "Négociants"
 game_concept_trader_possessive: "Négociant"
 game_concept_traders_possessive: "Négociants"
 game_concept_trader_desc: "[character|E] chargé de superviser une [trade_route|El].\n\nIl peut être un [associate|El] ou un [courtier|El] du propriétaire de la route et ne peut superviser qu’une seule route à la fois. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\nÀ chaque négociant est attribuée une tâche qui améliore un certain aspect de la route. Sa [aptitude|El] à accomplir cette tâche dépend de ses [skills|El].\n\nEn travaillant sur une route, le négociant effectue des [schemes|El] personnels dans chaque [trade_market|El]. Si un complot échoue, il gagne le [trait|El] de [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l], s’il ne le possède pas déjà. Si c’est le cas, il gagne à la place une petite quantité d’[trait_level_track_xp|El] provenant d’une [trait_level_track|El] de [GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )|l] aléatoire ($trait_track_caravaneer|l$, $trait_track_artisan|l$ ou $trait_track_creditor|l$)."
 game_concept_trader_council: "À l’exception du [spouse|El] du propriétaire, personne ne peut siéger au [council|E]."
 game_concept_trader_council_merchant: "Le [spouse|El] du propriétaire et les [deputies|El] peuvent également être des $game_concept_traders|l$, à l’exception du [GetCourtPositionType('partner_court_position').GetName()|l] et du [GetCourtPositionType('travel_leader_court_position').GetName()|l]."
 #Merchant
 game_concept_merchant: "Marchand"
 game_concept_merchants: "Marchands"
 game_concept_merchant_possessive: "Marchand"
 game_concept_merchants_possessive: "Marchands"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "[character|E] [unlanded|El] qui [trade|El] au sein d’une [company|El].\n\nIl s’efforce de répondre aux [building_needs|El] des [trade_markets|El], ce qui renforce l’économie, mais vise avant tout à accroître sa richesse personnelle et son statut social. De ces deux objectifs, le [prestige|El] a plus de valeur que l’[gold|El], car il lui permet d’améliorer sa position vis-à-vis de son [merchant_patron|El] et de ses [associates|El], ce qui lui confère davantage de pouvoir, grâce auquel il peut renforcer ses [trade_routes|El] et, à terme, s’assurer un [trade_monopoly|El]."
 game_concept_merchant_family: "Famille marchande"
 game_concept_merchant_families: "Familles marchandes"
 game_concept_merchant_family_possessive: "Famille marchande"
 game_concept_merchant_family_desc: "[house|E] qui exerce des activités commerciales en tant que [merchants|El] ou [republicans|El]. Elle possède une [company|El], contrôlée et détenue par le [house_head|El], et est essentielle au [trade|El] et à la [prosperity|El] du pays."
 game_concept_associate: "Associé"
 game_concept_associates: "Associés"
 game_concept_associate_possessive: "Associé"
 game_concept_associates_possessive: "Associés"
 game_concept_associate_desc: "Personnage [unlanded|El] qui fait partie d’une [company|El] [Concept('merchant', 'marchande')|E]. Il remplit des fonctions similaires à celles du [courtier|El] du [ruler|El] [landed|El], et peut gérer des [trade_routes|El] en tant que [trader|El] et devenir [deputy|El]."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "Représentant"
 game_concept_deputies: "Représentants"
 game_concept_deputy_possessive: "Représentant"
 game_concept_deputies_possessive: "Représentants"
 game_concept_deputy_desc: "Il occupe diverses fonctions au service d’une [merchant_family|El] et sa [company|El]. Ce rôle s’apparente au [court_position|El] et peut être attribué à un [associate|El] de la [company|El]. Sa [aptitude|El] détermine sa réussite dans l’accomplissement de ses tâches."
 game_concept_company: "Compagnie"
 game_concept_companies: "Compagnies"
 game_concept_company_possessive: "Compagnie"
 game_concept_trade_company: "Compagnie commerciale"
 game_concept_trade_companies: "Compagnies commerciales"
 game_concept_company_desc: "Base d’opérations de la [merchant_family|El], d’où partent toutes ses [trade_routes|El].\n\nChaque [GetGovernment( 'merchant_government' ).GetName|l] possède un [domicile|El] de $game_concept_trade_company|l$. S’il existe un [merchant_patron|El], le $game_concept_domicile|l$ du $game_concept_merchant|l$ se trouve habituellement dans la [holding|El] de son [merchant_patron|El].\n\nLes [company_buildings|El] sont les [domicile_buildings|El] de la compagnie : ils confèrent des bonus au commerce et à tous ceux qui y participent. La $game_concept_company|l$ offre également un logement aux [associates|El] (ainsi qu’aux membres de leur famille) et aux [knights|El], que l’on peut engager comme [deputies|El].\n\n#WEAK Tout comme les [courts|E], les $game_concept_companies|l$ comptent également quelques [characters|El] anonymes qui ne sont pas assez importants pour être représentés (mais ils sont moins nombreux).#!"
 game_concept_company_building: "Bâtiment de compagnie"
 game_concept_company_buildings: "Bâtiments de compagnie"
 game_concept_company_buildings_short: "Bâtiments"
 game_concept_company_building_desc: "[domicile_buildings|E] d’une [company|El]. Ils améliorent principalement le [trade|El], notamment la [capacity|El], la [route_length|El], les [max_trade_goods_short|El] et les [max_trade_markets_short|El] sur les [trade_routes|El]."
 game_concept_usury: "Usure"
 game_concept_usurer: "Usurier"
 game_concept_usurers: "Usuriers"
 game_concept_usurer_possessive: "Usurier"
 game_concept_usurers_possessive: "Usuriers"
 game_concept_usurious: "Usuraire"
 game_concept_interest: "Intérêts"
 game_concept_usury_desc: "L’$game_concept_usury|l$ consiste à [lending|El] de l’[gold|El] avec des $game_concept_interest|l$. C’est la [doctrine|El] de l’[GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip|l] d’un [rite|El] qui détermine s’il s’agit d’une pratique honnête ou d’un [sin|El].\n\nLà où elle est condamnée, un [merchant|El] perd de la [piety|El] à chaque [loan|El] accordé via l’[interaction|El] $loan_money_interaction|V$, et une [company|El] ayant pour objectif $company_purpose_creditor|V$ procure une réputation durable d’$game_concept_usurer|l$ à son propriétaire dès que les $game_concept_interest|l$ sont rendus publics.\n\n#weak Certains $game_concept_rites|l$ interdisent les prêts avec $game_concept_interest|l$ dans leur [Concept('religion', 'communauté religieuse')|El], ce qui laisse à leurs $game_concept_merchants|l$ la liberté d’accorder des prêts à ceux qui n’en font pas partie.#!"
 game_concept_loan: "Prêt"
 game_concept_loans: "Prêts"
 game_concept_loan_possessive: "Prêt"
 game_concept_loans_possessive: "Prêts"
 game_concept_loaned: "Prêté"
 game_concept_lending: "Prêter"
 game_concept_loan_desc: "Un $game_concept_loan|l$ est une somme d’[gold|El][gold_i|E] remise dans l’espoir qu’elle soit remboursée, avec ou sans $game_concept_interest|l$.\n\nLes $game_concept_loans|l$ sont généralement sollicités par un [ruler|El] [Concept('debt', 'endetté')|E] ou ayant besoin de fonds supplémentaires pour financer une [war|El] ou d’autres dépenses.\n\nUn $game_concept_loan|l$ peut être accordé avec des $game_concept_interest|l$ annoncés, cachés ou sans $game_concept_interest|l$, et les différentes [faiths|El] ont des opinions divergentes sur l’[usury|El].\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help Un $game_concept_loan|l$ peut survivre aux personnes qui l’ont conclu : lorsqu’une des parties décède, il est transféré à son [heir|El], s’il en a un.#!"
 loan_repayment_help: "#help Un [debtor|El] peut rembourser ses $game_concept_loans|l$ via la [decision|El] [GetDecisionWithKey('repay_loan_decision').GetName], et un [creditor|El] peut l’exiger via l’[interaction|El] #V $demand_repayment_interaction$#! lorsqu’au moins #V 2#! ans se sont écoulés.\n\nLes [merchants|El] ayant l’[company_purpose|El] [GetLaw('company_purpose_creditor').GetName] peuvent aussi recouvrer des [loans|El] au fil du temps en employant un [GetCourtPositionType( 'bailiff_court_position' ).GetName()|l] et en utilisant la [Concept('court_position_task', 'tâche')|El] #V $bailiff_collect_loans$#!#!"
 game_concept_merchant_patron: "Mécène"
 game_concept_merchant_patrons: "Mécènes"
 game_concept_merchant_patron_possessive: "Mécène"
 game_concept_merchant_patron_desc: "[ruler|E] de la [holding|El] où se trouve le [domicile|El] d’un [merchant|El].\n\nLe $game_concept_merchant|l$ est considéré comme un [client|El] du $game_concept_merchant_patron|l$ et doit lui verser des [taxes|El]."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "Marchand client"
 game_concept_client_merchants: "Marchands clients"
 game_concept_client_merchant_possessive: "Marchand client"
 game_concept_client: "Client"
 game_concept_client_possessive: "Client"
 game_concept_clients: "Clients"
 game_concept_client_merchant_desc: "Un $game_concept_client_merchant|l$ est un [merchant|El] qui possède une [company|El] dans le [realm|El] d’un [ruler|El] [landed|El], qui devient son [merchant_patron|El].\n\nIl offre à son $game_concept_merchant_patron|l$ une part de ses revenus [Concept('trade', 'commerciaux')|E]. Il ne peut ni rejoindre une guerre ou une [faction|El] contre son $game_concept_merchant_patron|l$ ni se dissocier de lui – à moins de transférer sa $game_concept_company|l$ ailleurs."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "Saisie du pays"
 game_concept_seize_realm_cb_desc: "[casus_belli|E] qui permet à un [merchant|El] d’établir une [republic|El] et d’avoir des [Concept('landed', 'terres')|E]. L’attaquant peut utiliser l’[interaction|El] #V $gdp_merchant_seize_realm_call_debtor_interaction$#! pour dépenser des [strong_hooks|El] @unspent_strong_hook_icon! #weak ($strong_indebted_hook|l$ ou $strong_loan_hook|l$)#! pour forcer des [rulers|El] [Concept('independent', 'indépendants')|E] à rejoindre cette [war|El] en tant qu’[allies|El]."
 game_concept_company_purpose: "Objectif de compagnie"
 game_concept_company_purposes: "Objectifs de compagnie"
 game_concept_company_purpose_desc: "Directives qui façonnent une [company|El] et sa [merchant_family|El].\n\nUne compagnie peut mettre l’accent sur le prêt, la fiabilité familiale, la qualité et la rareté de ses produits ou l’étendue de son réseau, ce qui permet de réduire les distances et de rapprocher les cultures.\n\nLes différents types fournissent leurs propres [interactions|El], postes de [deputy|El] et bonus [Concept('trade', 'commerciaux')|E]."
 game_concept_trade_acumen: "Perspicacité commerciale"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "Perspicacité"
 game_concept_trade_acumen_desc: "Montant total d’[gold|El] qu’une [company|El] [Concept('merchant', 'marchande')|E] a accumulé par le [trade|El], dans toutes les [trade_categories|El].\n\nElle sert à débloquer des [company_sizes|El] et ne peut pas être dépensée."
 game_concept_company_size: "Taille de compagnie"
 game_concept_company_sizes: "Tailles de compagnie"
 game_concept_company_size_desc: "La $game_concept_company_size|l$ représente la domination d’une [merchant_family|El] sur le [trade|El]. Chaque niveau augmente grandement sa [competitiveness|El] et ses capacités commerciales. Pour passer à une taille supérieure, il faut accumuler de la [acumen|El].\n\nIl existe quatre tailles : [GetLaw('company_size_small').GetName|l], [GetLaw('company_size_medium').GetName|l], [GetLaw('company_size_large').GetName|l] et [GetLaw('company_size_huge').GetName|l]."
 #Contracts
 game_concept_trade_contract: "Contrat commercial"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "Contrats commerciaux"
 game_concept_trade_contract_possessive: "Contrat commercial"
 game_concept_trade_contracts_possessive: "Contrats commerciaux"
 game_concept_trade_contract_desc: "Les $game_concept_trade_contracts|l$ sont des voies par lesquelles les [companies|El] [Concept('merchant', 'marchandes')|E] peuvent influencer leur [trade_routes|El] ou obtenir des richesses précieuses dans des pays lointains.\n\nLes premiers sont des [trade_opportunities|El], et les derniers des [luxury_contracts|El]."
 game_concept_trade_contract_tier: "Niveau de contrat commercial"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "Niveau"
 game_concept_trade_contract_tier_desc: "Chaque [trade_contract|El] possède un $game_concept_trade_contract_tier_tier|l$ qui détermine à la fois sa difficulté et sa récompense. Ce niveau dépend généralement de la [prosperity|El] de la région où il se déroule."
 game_concept_luxury_contract: "Contrat de luxe"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "Contrats de luxe"
 game_concept_luxury_contract_possessive: "Contrat de luxe"
 game_concept_luxury_contracts_possessive: "Contrats de luxe"
 game_concept_luxury_contract_desc: "Un $game_concept_luxury_contract|l$ oblige les [companies|El] [Concept('merchant', 'marchandes')|E] à se [Concept('travel', 'rendre')|E] dans un lieu éloigné pour tenter de se procurer un [domicile_artifact|El].\n\nCes contrats peuvent apparaître chaque année pour les marchands ayant l’[company_purpose|El] de caravanier et peuvent être obtenus via la [decision|El] [GetDecisionWithKey('gdp_visit_holding_decision').GetName]."
 game_concept_trade_opportunity: "Opportunité commerciale"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "Opportunités commerciales"
 game_concept_trade_opportunity_possessive: "Opportunité commerciale"
 game_concept_trade_opportunities_possessive: "Opportunités commerciales"
 game_concept_opportunity: "Opportunité"
 game_concept_opportunities: "Opportunités"
 game_concept_opportunity_possessive: "Opportunité"
 game_concept_opportunities_possessive: "Opportunités"
 game_concept_trade_opportunity_desc: "Les $game_concept_trade_opportunities|l$ nécessitent des [companies|El] [Concept('merchant', 'marchandes')|E] pour réussir un [scheme|El].\n\nCe sont généralement des activités strictement commerciales (comme la promotion de [trade_goods|El] rentables), mais elles peuvent aussi être plus hostiles (comme rivaliser avec une autre famille pour le contrôle d’un [market|El]).\n\nSi le $game_concept_scheme|l$ rate ou est abandonné, l’$game_concept_trade_opportunity|l$ échoue également."
 game_concept_trade_opportunity_tier: "Niveau d’opportunité commerciale"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "Niveau"
 game_concept_trade_opportunity_tier_desc: "Le $game_concept_trade_opportunity_tier|l$ reflète la [prosperity|El] du lieu où le contrat est conclu.\n\nPlus il est élevé, plus la paie est élevée. Cependant, la difficulté de la tâche est généralement également plus élevée."
 game_concept_trade_opportunity_scheme: "Complot d’opportunité commerciale"
 game_concept_trade_opportunity_schemes: "Complots d’opportunité commerciale"
 game_concept_trade_opportunity_scheme_possessive: "Complot d’opportunité commerciale"
 game_concept_trade_opportunity_schemes_possessive: "Complots d’opportunité commerciale"
 game_concept_trade_opportunity_scheme_trade_opportunity: "Opportunité commerciale"
 game_concept_trade_opportunity_scheme_opportunity: "Opportunité"
 game_concept_opportunity_scheme: "Complot d’opportunité"
 game_concept_opportunity_schemes: "Complots d’opportunité"
 game_concept_opportunity_scheme_possessive: "Complot d’opportunité"
 game_concept_opportunity_schemes_possessive: "Complots d’opportunité"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "Contrat de mécénat"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "Contrats de mécénat"
 game_concept_patron_contract_possessive: "Contrat de mécénat"
 game_concept_patron_contracts_possessive: "Contrats de mécénat"
 game_concept_patron_contract_desc: "Dans le $game_concept_patron_contract|l$, la [company|El] [Concept('merchant', 'marchande')|E] doit mener à bien un [scheme|El] contre son [merchant_patron|El].\n\nCe complot est généralement axé sur la [diplomacy|El] et vise soit à répondre aux souhaits du $game_concept_merchant_patron|l$ (par exemple en réglant un différend commercial), soit à le soumettre à la volonté du marchand (en évinçant une famille marchande rivale).\n\nSi le $game_concept_scheme|l$ échoue ou est abandonné pour quelque raison que ce soit, le $game_concept_patron_contract|l$ échoue également."
 game_concept_patron_contract_scheme: "Complot de contrat de mécénat"
 game_concept_patron_contract_schemes: "Complots de contrat de mécénat"
 game_concept_patron_contract_scheme_possessive: "Complot de contrat de mécénat"
 game_concept_patron_contract_schemes_possessive: "Complots de contrat de mécénat"
 game_concept_patron_contract_scheme_patron_contract: "Contrat de mécénat"
 game_concept_patron_scheme: "Complot de mécénat"
 game_concept_patron_schemes: "Complots de mécénat"
 game_concept_patron_scheme_possessive: "Complot de mécénat"
 game_concept_patron_schemes_possessive: "Complots de mécénat"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "Contrat de direction"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "Contrats de direction"
 game_concept_unity_contract_possessive: "Contrat de direction"
 game_concept_unity_contracts_possessive: "Contrats de direction"
 game_concept_unity_contract_desc: "Les $game_concept_unity_contracts|l$ apparaissent lorsque l’[company_sentiment|El] d’un [merchant|El] est faible, ce qui pose un problème qui doit être résolu."
 game_concept_domicile_artifact: "Artefact de domicile"
 game_concept_domicile_artifacts: "Artefacts de domicile"
 game_concept_domicile_artifact_desc: "[artifact|E] exposé dans une [company|El] de [merchant|El], tels que les [curios|El] et [creatures|El].\n\nLes $game_concept_domicile_artifacts|l$ constituent la principale source de revenu passif de [prestige|El] du $game_concept_merchant|l$.\n\nIl n’y a pas de limite au nombre d’$game_concept_artifacts|l$ qu’un [character|El] peut posséder, mais seuls ceux qui sont exposés à un emplacement qui leur correspond déploient leurs effets.\n\nLes $game_concept_merchants|l$ peuvent obtenir des $game_concept_domicile_artifacts|l$ en menant à bien des [luxury_contracts|El]."
 game_concept_menagerie: "Ménagerie"
 game_concept_menagerie_creature: "Créature de la ménagerie"
 game_concept_menagerie_creatures: "Créatures de la ménagerie"
 game_concept_creature: "Créature"
 game_concept_creatures: "Créatures"
 game_concept_creature_desc: "Animal vivant créé par le [merchant|El] lors de la conclusion d’un [luxury_contract|El]. \n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "Curiosité"
 game_concept_curios: "Curiosités"
 game_concept_curio_desc: "Type d’[artifact|El] rare créé par le [merchant|El] lors de la conclusion d’un [luxury_contract|El].\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "Il peut être exposé en tant qu’[domicile_artifact|El] au sein d’une [company|El] afin de générer un gain constant de [prestige|El]."
 game_concept_guelph_ghibelline_precursor_situation: "Prélude des $game_concept_guelph_ghibelline_situation|l$"
 game_concept_guelph_ghibelline_precursor_situation_desc: "Prélude à la [situation|El] des [guelph_ghibelline_situation|El] – une série d’événements qui ont exacerbé le conflit entre le Saint-Empire romain et la papauté.\n\n#F Tout a commencé avec le renforcement par le pape de la doctrine [Glossary( 'In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS' )], dans laquelle il déclarait que la noblesse ne devait pas participer à l’élection papale, celle-ci étant réservée aux cardinaux réunis à Rome.\n\nPlus tard, lors du [Glossary( 'Dictatus Papae', 'DICTATUS_PAPAE_GLOSS' )] et de la querelle des investitures, le pape a déclaré que le pouvoir que Dieu lui avait conféré était universel et que, par conséquent, lui seul pouvait nommer ou destituer les ecclésiastiques. Les évêques qui recevaient les insignes de leur charge de la part de laïcs n’étaient pas bien vus."
 game_concept_guelph_ghibelline_situation: "Guelfes et gibelins"
 game_concept_guelph_ghibelline_situation_desc: "[situation|E] née d’un conflit entre le pape ([guelphs|El]) et le Saint-Empire romain ([ghibellines|El]).\n\nAu fil du temps, la question s’est transformée en un enjeu local : les dirigeants de l’Italie du Nord souhaitaient-ils un engagement accru de la part de l’Empire ou préféraient-ils préserver leur indépendance ?"
 game_concept_gg_involvement: "Participation"
 game_concept_gg_involvement_desc: "La $game_concept_gg_involvement|l$ d’un [ruler|El] dans la [situation|El] des [guelph_ghibelline_situation|El] montre à quel point ce personnage a affecté la situation. Celle-ci évolue principalement sous l’effet des actions menées contre la partie adverse.\n\nDe telles actions comprennent :\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[interactions|E] visant à [imprison|El], [torture|El] et [execute|El]\n$BULLET_WITH_TAB$[scheme|E] d’[GetScheme('gg_switch_sides').GetTypeName|l], [interaction|El] visant à $gg_recruit_partisan_interaction|Vl$, [casus_belli|El] [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V], etc.\n$BULLET_WITH_TAB$Déclenchement de [situation_catalysts|El]\n\nLa $game_concept_gg_involvement|l$ en retour :\n$BULLET_WITH_TAB$Applique la mise à l’échelle du [modifier|El] [GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip] à chaque incrément de #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))]#!\n$BULLET_WITH_TAB$Agit comme multiplicateur de récompenses si votre camp parvient à mettre fin à la situation.\n\n#F Durant le [guelph_ghibelline_precursor_situation|El], il n’est pas possible de gagner des points de $game_concept_gg_involvement|l$, et ceux-ci s’accumulent à un rythme plus lent jusqu’à ce que le conflit éclate complètement.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "Guelfe"
 game_concept_guelphs: "Guelfes"
 game_concept_guelph_desc: "Camp de la [situation|El] des [guelph_ghibelline_situation|El] qui soutient l’indépendance par rapport au Saint-Empire romain et, par extension, la souveraineté divine.\n\n#F Le nom « guelfe » vient de la Maison des Welf, historiquement ducs de Bavière, qui a été transformé par la transmission orale et la prononciation.#!"
 game_concept_ghibelline: "Gibelin"
 game_concept_ghibellines: "Gibelins"
 game_concept_ghibelline_desc: "Les gibelins constituent le camp de la [situation|El] des [guelph_ghibelline_situation|El] qui soutient le renforcement de l’influence et du contrôle exercés par le Saint-Empire romain sur les cités-États intrusives du nord de l’Italie.\n\n#F Le nom « gibelin » tire son origine du cri de ralliement des Hohenstaufen, en référence au château de Wibellingen lors du siège de Weinsberg.#!"
 game_concept_lombard_league: "Ligue lombarde"
 game_concept_lombard_league_desc: "Ligue formée par les villes du nord de l’Italie et qui s’oppose aux demandes croissantes de centralisation du $e_hre$."
 game_concept_confederation_cohesion: "Cohésion de confédération"
 game_concept_cohesion: "Cohésion"
 game_concept_confederation_cohesion_desc: "La $game_concept_cohesion|l$ indique le degré de solidité d’une [confederation|El], sur une échelle de #V 0#! à #V 100#!. Chaque membre y contribue chaque mois, pour le meilleur ou pour le pire, et les gains diminuent lorsque la $game_concept_cohesion|l$ est élevée.\n\nChaque niveau atteint offre des avantages progressifs à ses membres. Les facteurs qui génèrent la $game_concept_cohesion|l$ et la récompense associée à chaque niveau dépendent du type de confédération.\n\nLes confédérations utilisent les types de $game_concept_cohesion|l$ suivants :\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "Ligue commerciale"
 game_concept_trade_league_desc: "Une $game_concept_trade_league|l$ est une [confederation|El] de [republics|El] que les [rulers|El] républicains peuvent former ou à laquelle ils peuvent adhérer afin d’obtenir des avantages commerciaux et défensifs mutuels.\n\nUn membre détient le [leading_title|El] et fait office de [trade_league_leader|El] (c’est le seul membre habilité à inviter ou à exclure d’autres membres), tandis que les autres détiennent le [member_title|El].\n\nSes membres bénéficient d’avantages d’autant plus importants que la [league_cohesion|El] s’accroît."
 game_concept_trade_leagues: "Ligues commerciales"
 game_concept_trade_league_short: "Ligue"
 game_concept_league_cohesion: "Cohésion de ligue"
 game_concept_league_cohesion_desc: "La $game_concept_cohesion|l$ mesure l’unité d’une [trade_league|El], et chaque niveau atteint procure à ses membres des avantages [Concept('trade', 'commerciaux')|E] progressifs. En dessous de #V 20#!, la ligue est trop divisée pour que ses membres puissent se joindre aux [wars|El] des autres ou demander des [trade_monopolies|El].\n\nLes membres en génèrent en fonction de leur [title_tier|El], de leur [capital|El] et de leur [opinion|El] sur le [trade_league_leader|El]. Les monopoles détenus la renforcent, tandis qu’un nombre trop faible ou trop élevé de [trade_league_members_short|El] peut la compromettre."
 game_concept_trade_league_leader: "Chef de ligue commerciale"
 game_concept_trade_league_leader_desc: "Chef officiel d’une [trade_league|El].\n\nIl est le seul [trade_league_member_short|El] d’une $game_concept_trade_league|l$ qui peut inviter de nouveaux membres ou retirer des membres existants. Une ligue commence avec son fondateur à sa tête. Par la suite, les membres peuvent prétendre à la direction. Si le chef quitte la ligue, un autre membre lui succède en fonction de son [title_tier|El], de la [settlement_size|El] de sa [capital|El] et de son [prestige|El]."
 game_concept_trade_league_leader_short: "Chef"
 game_concept_trade_league_member: "Membre de ligue commerciale"
 game_concept_trade_league_members: "Membres de ligues commerciales"
 game_concept_trade_league_member_short: "Membre"
 game_concept_trade_league_members_short: "Membres"
 game_concept_trade_league_member_desc: "Membre d’une [trade_league|El] qui détient un [member_title|El], lequel correspond au [primary_title|El] des [republics|El] qui la composent.\n\nUn membre détient le [leading_title|El] et agit en tant que [trade_league_leader|El]."
 game_concept_league_focus: "Spécialité de la ligue"
 game_concept_league_focuses: "Spécialités de la ligue"
 game_concept_league_focus_desc: "[trade_category|E] choisie par le [Concept('trade_league_leader', 'chef')|E] d’une [trade_league|El]. Le [holder|El] de chaque [member_title|El] gagne des bonus en matière d’[trade_expertise|El], de [production|El] et de [sell_price|El] pour cette catégorie."
 game_concept_patrician: "Patricien"
 game_concept_patricians: "Patriciens"
 game_concept_patrician_possessive: "Patricien"
 game_concept_patrician_desc: "[house_head|E] d’une famille [Concept('merchant','marchande')|E] dirigeante dans une [republic|El]."
 game_concept_patrician_family: "Famille patricienne"
 game_concept_patrician_families: "Familles patriciennes"
 game_concept_patrician_family_short: "Famille"
 game_concept_patrician_family_desc: "[merchant_family|E] qui fait partie d’une [republic|El]. Elle constitue l’élite noble qui détient le pouvoir et l’influence au sein de la République, et utilise la [consortery|El] comme [domicile|El].\n\nUne république de [title_tier|El] [Concept('county', 'comtal')|E] ne peut avoir qu’une seule famille patricienne, tandis que les républiques d’un niveau supérieur peuvent et devraient en avoir plusieurs."
 game_concept_patrician_rating: "Classement patricien"
 game_concept_patrician_rating_short: "Classement"
 game_concept_patrician_rating_desc: "Une [patrician_family|El] possède un $game_concept_patrician_rating|l$, qui reflète l’importance et l’influence de la famille et de son [patrician|El] au sein de la [republic|El].\n\nUn classement élevé confère des bonus au patricien et à sa [house|E], répartis sur trois niveaux distincts. Chaque niveau débloque des avantages supplémentaires, tels que :\n$BULLET_WITH_TAB$Amélioration de l’[house_ambition|El]\n$BULLET_WITH_TAB$Augmentation de l’acceptation lors des [interactions|El]\n$BULLET_WITH_TAB$Augmentation du [governor_salary|El]\n\nIl existe de nombreuses façons d’augmenter le classement ; parmi les principaux facteurs, on peut citer :\n$BULLET_WITH_TAB$Les revenus [Concept('trade', 'commerciaux')|E] du [patrician|El]\n$BULLET_WITH_TAB$Gouverner la [republic|El]\n$BULLET_WITH_TAB$Obtenir des sièges à l’[assembly|El] et au [council|E] du [liege|El][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$Les membres de la [house|E] qui détiennent une [clerical_region|El]\n$BULLET_WITH_TAB$Avoir le [modifier|El] [GetModifier('favored_by_pope_modifier').GetNameWithTooltip]"
 game_concept_patrician_rating_penalties_PAM: "Le classement est abaissé si le patricien est [excommunicated|El], un [criminal|El] connu ou [GetModifier('scorned_pope_modifier').GetNameWithTooltip|l]."
 game_concept_patrician_rating_penalties_NO_PAM: "Le classement est abaissé si le patricien est [excommunicated|El] ou un [criminal|El] connu."
 game_concept_consortery: "Consorterie"
 game_concept_consorteries: "Consorteries"
 game_concept_consortery_possessive: "Consorterie"
 game_concept_consortery_desc: "Résidence et [domicile|El] d’une [patrician_family|El]. Elle est généralement située dans la [capital|El] de son [liege|El].\n\nÀ l’instar des [trade_companies|El] d’un [merchant|El], la $game_concept_consortery|l$ utilise des [company_buildings|El] comme [domicile_buildings|El] afin d’accroître l’efficacité et la compétitivité commerciale de la Maison.\n\nElle se transmet par héritage en même temps que le titre de la [patrician_family|El]."
 game_concept_assembly: "Assemblée"
 game_concept_assembly_possessive: "Assemblée"
 game_concept_assembly_desc: "Organe directeur d’un [realm|El].\n\nSes responsabilités sont encadrées par des [laws|El] et peuvent inclure le vote et l’approbation des [laws|El], [republic_decrees|El] ou voter pour des candidats dans certaines formes de [succession|El] élective, comme l’[GetLaw('republican_elective_succession_law').GetName|l]."
 game_concept_republic_senate: "Sénat"
 game_concept_republic_senate_possessive: "Sénat"
 game_concept_voting_session: "Séance de vote"
 game_concept_voting_sessions: "Séances de vote"
 game_concept_voting_session_desc: "Processus par lequel une [assembly|El] se prononce sur une [law|El] ou un [republic_decree|El] qui lui est présenté.\n\nLorsqu’une séance est en cours, ses membres peuvent voter pour ou contre la proposition, selon leur opinion. Si un nombre suffisant de membres donne son accord avant la fin de la séance, la proposition est adoptée et entre en vigueur.\n\nIl est possible d’augmenter le nombre de voix favorables avant une séance grâce à une [councillor_task|El] et à certains [perks|El], et il est possible de dépenser un [hook|El] pour obliger un membre à voter comme vous le souhaitez."
 game_concept_republic_decree: "Décret républicain"
 game_concept_republic_decrees: "Décrets républicains"
 game_concept_republic_decree_short: "Décret"
 game_concept_republic_decrees_short: "Décrets"
 game_concept_republic_decree_desc: "Type de [decision|El] pour une [republic|El] qui doit être approuvée par l’[assembly|El].\n\nBien qu’il existe plusieurs types de $game_concept_republic_decrees_short|l$, la plupart affectent les [patricians|El], la [realm_capital|El] ou la république dans son ensemble."
 game_concept_house_ambition: "Ambition de Maison"
 game_concept_house_ambitions: "Ambitions de Maisons"
 game_concept_house_ambition_desc: "Chaque [house|E] dans une [republic|El] a une ambition indiquant comment les membres de la Maison veulent avoir un impact sur la République."
 game_concept_republic_administration: "Administration républicaine"
 game_concept_republic_administration_short: "Administration"
 game_concept_republic_administrations: "Administrations républicaines"
 game_concept_republic_administration_desc: "Toutes les [republics|El] disposent d’un système administratif prédéfini, qui détermine leur spécialisation.\n\nSeul le [ruler|El] de la république peut le modifier.\n\nChaque système présente des avantages qui lui sont propres.\n\n#help Les plus courants sont la [GetLaw( 'republic_type_communal' ).GetName|l], [GetLaw( 'republic_type_maritime' ).GetName|l] et la [GetLaw( 'republic_type_civic' ).GetName|l].#!"
 game_concept_republic_senator: "Sénateur"
 game_concept_republic_senators: "Sénateurs"
 game_concept_republic_senator_desc: "Membre de l’[assembly|El] nommé via le [GetLaw( 'republic_assembly_composition_roman_senate' ).GetName|l].\n\nLes $game_concept_republic_senators|l$ sont nommés par le [ruler|El] ou le censeur de la [republic|El].\n\nSeul un nombre fixe de $game_concept_republic_senators|l$ peut être nommé simultanément, et ce nombre est déterminé par la [law|El] relative à la taille du Sénat."
 game_concept_mercenary_limit: "Limite de mercenaires"
 game_concept_mercenary_limit_desc: "La limite de mercenaires décide du nombre de [mercenaries|El] qu’un [character|El] peut embaucher immédiatement.\n\nLa limite de mercenaires est décidée par :\n$BULLET_WITH_TAB$[skill|E] en [martial|El][martial_i]\n$BULLET_WITH_TAB$[title_tier|E][title_tier_i]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
 # No tooltip versions
 tributary_default_no_tooltip: "Tributaire"
 tributary_default_no_tooltip_plural: "Tributaires"
 merchant_tributary_client_no_tooltip: "Client"
 merchant_tributary_client_no_tooltip_plural: "Clients"
 suzerain_default_no_tooltip: "Suzerain"
 suzerain_default_no_tooltip_plural: "Suzerains"
 merchant_tributary_patron_no_tooltip: "Mécène"
 merchant_tributary_patron_no_tooltip_plural: "Mécènes"
