 gdp_visit_holding_decision_event.1320.charlatan.desc: "Une foule se rassemble, fascinée par les reflets argentés. Les tours de passe-passe du [ROOT.Char.GetName] les font se mettre en file indienne comme des agneaux menés à l’abattoir."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "Vêtu[ROOT.Char.Custom('FR_E')] d’une armure très usée, [ROOT.Char.GetFirstName] appuie sa silhouette musclée contre un mur et fait tournoyer un poignard entre ses mains."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName] inspecte les étals un par un et note minutieusement les détails dans un petit registre."
 gdp_visit_holding_decision_event.1320.traveler.desc: "Vêtu[ROOT.Char.Custom('FR_E')] d’habits exotiques, [ROOT.Char.GetFirstName] tente d’apaiser une dispute entre deux négociants – et ce, dans un [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|l] approximatif !"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName] se faufile dans l’ombre, un bébé enveloppé dans des couvertures dans un bras et la paume de l’autre main tendue, à la recherche de sa prochaine victime sans méfiance."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "Penché[ROOT.Char.Custom('FR_E')] au-dessus d’un caravanier blessé, [ROOT.Char.GetFirstName] prépare rapidement un remède à partir d’herbes qu’[ROOT.Char.Custom('FR_IlElle')] trouve à proximité."
