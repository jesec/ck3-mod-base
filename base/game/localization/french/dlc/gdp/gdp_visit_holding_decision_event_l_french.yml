 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$ : à la recherche d’opportunités"
 gdp_visit_holding_decision_event.1310.desc: "Ces derniers temps, j’ai entendu beaucoup d’histoires sur des bêtes et des richesses étrangères. Aujourd’hui, je parcours la place du marché pour voir si je peux dénicher quelqu’un qui en sait plus sur ces rumeurs.\n\nParmi les commerçants, j’aperçois [Select_CString(foreigner.IsFemale,'une femme','un homme')] à l’accent étranger qui se vante fièrement de ses exploits dans des contrées lointaines devant un marchand local qui ne semble pas lui prêter beaucoup d’attention. Peut-être ne fait-il que se vanter, ou peut-être y a-t-il une part de vérité dans ses récits. Un peu d’or suffirait-il à [foreigner.Custom('FR_LeLa')] faire parler ?"
