 gdp_visit_holding_decision_event.1400.t: "Visiter les embarcadères de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1400.intro: "Au pied du port animé de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], les débardeurs déchargent avec empressement des marchandises de toutes formes et de toutes tailles."
 gdp_visit_holding_decision_event.1400.asia: "Des caisses de soie et des sacs de feuilles de thé sont manipulés avec précaution par des mains calleuses. Ils approvisionneront bientôt le reste du monde connu, transportés en toute sécurité par des jonques sur une mer agitée."
 gdp_visit_holding_decision_event.1400.mena_india: "Au milieu du chaos, un marchand examine le contenu de quelques caisses endommagées. À l’autre bout du port, des caisses d’épices sont soigneusement scellées afin de résister à la périlleuse traversée de l’océan."
 gdp_visit_holding_decision_event.1400.default: "Des sacs de céréales et de sel sont expédiés par voie maritime vers des contrées lointaines. Une imposante cogue en chêne vient de jeter l’ancre, et un groupe de marchands étrangers vêtus de tenues aux couleurs chatoyantes débarque."
 gdp_visit_holding_decision_event.1400.outro: "L’air frais emplit mes poumons, et je me demande avec impatience si la chance me sourira aujourd’hui.\n\nOù vais-je me rendre ?\n\n"
 gdp_visit_holding_decision_event.1400.b: "Je devrais garder un œil ouvert pour repérer des personnes intéressantes."
 gdp_visit_holding_decision_event.1400.b.tt: "Observer les embarcadères pourrait offrir l’opportunité suivante :$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "Je devrais en toucher un mot au capitaine."
 gdp_visit_holding_decision_event.1400.d.tt: "Parlez au capitaine\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "Je devrais retourner parler à [sea_captain.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1400.c.tt: "Quittez les embarcadères pour l’instant"
 DECISION_ALREADY_VISITING_HOLDING: "[CHARACTER.Custom('IsAlreadyVisitingHolding')]"
 DECISION_ALREADY_VISITING_HOLDING_TIME: "Cette action sera à nouveau disponible le [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'gdp_visit_holding_is_visiting') )]"
 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "Vous êtes déjà en train de visiter une propriété"
 gdp_visit_holding_decision_event.1340.t: "Un peu de répit à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1340.desc: "Les monde des affaires peut être épuisant, et il faut savoir prendre un moment de répit après avoir épluché tous ces contrats et affiché tous ces sourires de circonstance.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "Ici, au salon de thé, je peux laisser derrière moi tous les problèmes de la compagnie.\n\nC’est un vrai soulagement de pouvoir profiter d’une bonne tasse de thé, tout en échangeant quelques ragots avec les habitués."
 gdp_visit_holding_decision_event.1340.hashish: "Ici, au salon de haschisch, je peux laisser derrière moi tous les problèmes de la compagnie.\n\nC’est un vrai soulagement de pouvoir se détendre, tout en échangeant quelques ragots avec les habitués."
 gdp_visit_holding_decision_event.1340.drink: "Ici, à la taverne, je peux laisser derrière moi tous les problèmes de la compagnie.\n\nC’est un vrai soulagement de pouvoir siroter un verre [ROOT.Char.Custom('RegionalAlcoholicDrink')], tout en échangeant quelques ragots avec les habitués."
 gdp_visit_holding_decision_event.1340.food: "Ici, à la salle de réception, je peux laisser derrière moi tous les problèmes de la compagnie.\n\nC’est un vrai soulagement de pouvoir déguster un bon repas et [ROOT.Char.Custom('FavoriteTreat')], tout en échangeant quelques ragots avec les habitués."
 gdp_visit_holding_decision_event.1340.bath: "Ici, aux bains publics, je peux laisser derrière moi tous les problèmes de la compagnie.\n\nC’est un vrai soulagement de pouvoir se prélasser dans l’eau, tout en échangeant quelques ragots avec les habitués."
 gdp_visit_holding_decision_event.1340.a: "Je devrais le faire plus souvent."
