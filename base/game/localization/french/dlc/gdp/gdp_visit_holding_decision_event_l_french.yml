 gdp_visit_holding_decision_event.1321.t: "Le charlatan"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName] s’approche de moi et, d’un geste théâtral, [charlatan_recruit.Custom('FR_IlElle')] s’exclame :\n\n« Eh bien, on dirait que nous avons un volontaire ! Si vous parvenez à prédire de quel côté cette pièce va tomber, je vous récompenserai généreusement. »\n\nD’un mouvement du poignet, [charlatan_recruit.Custom('FR_IlElle')] fait disparaître la pièce. La foule attend en silence de voir ce que je vais faire ensuite."
 gdp_visit_holding_decision_event.1321.a: "Vous avez manifestement une fausse pièce dans la manche."
 gdp_visit_holding_decision_event.1321.a.success: "Vous [charlatan_recruit.Custom('FR_LeLa')] démasquez."
 gdp_visit_holding_decision_event.1321.a.failure: "Vous échouez à [charlatan_recruit.Custom('FR_LeLa')] démasquer."
 gdp_visit_holding_decision_event.1321.b: "C’est un tour habile. Venez travailler pour moi."
 gdp_visit_holding_decision_event.1321.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [charlatan_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [charlatan_recruit.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1321.c: "Je n’ai pas le temps pour des tours."
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$ :"
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1322.t: "La brute épaisse"
 gdp_visit_holding_decision_event.1322.desc: "Alors que je m’approche de [hired_muscle_recruit.GetFirstName], je sens son regard sournois se poser sur moi.\n\n« Savez-vous à qui vous avez affaire ? Je suis [Select_CString(hired_muscle_recruit.IsFemale,'la championne invaincue','le champion invaincu')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Vous avez du cran pour croire qu’un[ROOT.Char.Custom('FR_E')] [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] comme vous pourrait me tenir tête au combat. »\n\n[hired_muscle_recruit.Custom('FR_IlElle')|U] lève le poing et me menace."
 gdp_visit_holding_decision_event.1322.a: "Je vais lui faire ravaler ses paroles !"
 gdp_visit_holding_decision_event.1322.a.success: "Vous avez battu [hired_muscle_recruit.GetFirstName]"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName] vous a battu[ROOT.Char.Custom('FR_E')]"
 gdp_visit_holding_decision_event.1322.b: "Combattez pour moi plutôt."
 gdp_visit_holding_decision_event.1322.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [hired_muscle_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [hired_muscle_recruit.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1322.c: "Je ferais mieux de partir."
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$ :"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1323.t: "[Select_CString(numerate_recruit.IsFemale,'Une érudite versée','Un érudit versé')] dans les mathématiques"
 gdp_visit_holding_decision_event.1323.desc: "[numerate_recruit.GetFirstName], le nez plongé dans ses livres, ne me remarque qu’une fois que je suis tout[ROOT.Char.Custom('FR_E')] proche. [numerate_recruit.Custom('FR_IlElle')|U] lève les yeux vers moi d’un air pensif.\n\n« Vous avez l’air d’[Select_CString(ROOT.Char.IsFemale,'une femme compétente','un homme compétent')], pourriez-vous m’aider à résoudre un petit problème ? »\n\nLa feuille qu’[numerate_recruit.Custom('FR_IlElle')] tient devant moi, déployée à plat, est remplie de chiffres et de calculs soigneusement écrits. Il semble s’agir d’une sorte de livre de comptes récapitulant les recettes et les dépenses des étals locaux."
 gdp_visit_holding_decision_event.1323.a: "Regardez, si on déplace ce nombre-là..."
 gdp_visit_holding_decision_event.1323.a.success: "Vous résolvez l’équation"
 gdp_visit_holding_decision_event.1323.a.failure: "Vous échouez à résoudre l’équation"
 gdp_visit_holding_decision_event.1323.b: "Et si vous faisiez ça pour ma compagnie ?"
 gdp_visit_holding_decision_event.1323.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [numerate_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [numerate_recruit.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1323.c: "À la réflexion..."
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$ :"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1324.t: "[Select_CString(traveler_recruit.IsFemale,'La voyageuse aguerrie','Le voyageur aguerri')]"
 gdp_visit_holding_decision_event.1324.desc: "Les tensions entre les deux marchands ont atteint un point critique. À l’aide de gestes apaisants, [traveler_recruit.GetFirstName] cherche à désamorcer le conflit. Malgré son [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName|l] approximatif, [traveler_recruit.Custom('FR_IlElle')] semble y parvenir. Ses efforts sont admirables pour quelqu’un qui n’est pas habitué à la culture locale.\n\nPourtant, aucun des deux marchands ne parvient à savoir [traveler_recruit.Custom('FR_SilSielle')] parle de la qualité, des marchandises, ou de tout autre chose, et la situation semble dans l’impasse."
 gdp_visit_holding_decision_event.1324.a: "« Laissez-moi essayer de faire de la médiation. »"
 gdp_visit_holding_decision_event.1324.a.success: "Votre interprétation est convaincante"
 gdp_visit_holding_decision_event.1324.a.failure: "Votre interruption n’est pas la bienvenue"
 gdp_visit_holding_decision_event.1324.b: "J’aurais besoin de quelqu’un avec votre expertise."
 gdp_visit_holding_decision_event.1324.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [traveler_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [traveler_recruit.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1324.c: "Je n’ai pas envie de m’embêter avec ça..."
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$ :"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1325.t: "[Select_CString(urchin_recruit.IsFemale,'La galopine','Le galopin')]"
 gdp_visit_holding_decision_event.1325.desc: "J’ai déjà vu ce petit numéro plein de fois, je sais donc que je dois m’approcher de l’enfant avec prudence. Avant même d’avoir eu le temps de prononcer un mot, un bras frêle me met un paquet dans les mains.\n\n« S’il vous plaît, [Select_CString(ROOT.Char.IsFemale,'gentille dame','gentil monsieur')], pourriez-vous nous donner quelque chose à manger, à moi et au bébé ? »\n\nSon autre main fouille déjà dans mon sac. Le paquet m’échappe et tombe par terre, révélant trois pierres enveloppées dans une couverture, comme je m’en doutais. Une ruse évidente, mais audacieuse."
 gdp_visit_holding_decision_event.1325.a: "Lâchez tout de suite mon sac !"
 gdp_visit_holding_decision_event.1325.a.success: "Vous attrapez le voleur"
 gdp_visit_holding_decision_event.1325.a.failure: "Vous êtes trop lent[GetPlayer.Custom('FR_E')]"
 gdp_visit_holding_decision_event.1325.b: "Ma compagnie aurait bien besoin d’une paire de mains habiles."
 gdp_visit_holding_decision_event.1325.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [urchin_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [urchin_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1325.c: "Ça suffit !"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$ :"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1326.t: "L’herboriste"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName] ne fait pas attention à moi alors que je m’approche. [herbalist_recruit.Custom('FR_IlElle')|U] est comme fasciné[herbalist_recruit.Custom('FR_E')] par les mouvements du pilon qui réduit l’ingrédient en une mixture indéfinissable.\n\n« Un peu [ROOT.Char.Custom('Abortifacient')] et peut-être [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] – et ensuite, je pourrais sans doute faire bouillir le tout dans un fond [ROOT.Char.Custom('RegionalDrink')]. Oui... ça devrait produire l’effet souhaité. Qu’en pensez-vous ? »\n\nSans vraiment prêter attention à ma présence, [herbalist_recruit.Custom('FR_IlElle')] se tourne vers moi et me met le mortier sous le nez : une odeur âcre me prend à la gorge."
 gdp_visit_holding_decision_event.1326.a: "#EMP Hum#!, pourrais-je proposer d’ajouter un peu plus [ROOT.Char.Custom('Abortifacient')] ?"
 gdp_visit_holding_decision_event.1326.a.success: "Vos conseils sont utiles"
 gdp_visit_holding_decision_event.1326.a.failure: "Vos conseils sont vains"
 gdp_visit_holding_decision_event.1326.b: "J’aurais bien besoin de quelqu’un ayant vos compétences."
 gdp_visit_holding_decision_event.1326.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ [herbalist_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [herbalist_recruit.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1326.c: "Je ne pense pas que ce soit pour moi."
 gdp_visit_holding_decision_event.1330.t: "[Select_CString(monk.IsFemale,'La moniale','Le moine')]"
 gdp_visit_holding_decision_event.1330.desc: "Dans un coin à l’écart du salon de thé, j’aperçois [Select_CString(monk.IsFemale,'une moniale','un moine')] attablé qui lit l’avenir dans des tiges d’achillée millefeuille à la lueur de la bougie. [Select_CString(monk.IsFemale,'La femme','L’homme')] me regarde, percevant mon intérêt.\n\n« Êtes-vous un[ROOT.Char.Custom('FR_E')] disciple de l’oracle, mon ami[ROOT.Char.Custom('FR_E')] ? Si vous avez l’esprit ouvert et honnête, la Voie a beaucoup de choses à vous révéler. »"
 gdp_visit_holding_decision_event.1330.desc_returned_01: "Le salon de thé s’est vidé. [monk.GetFirstName] est toujours là, assis[monk.Custom('FR_E')] devant ses tiges d’achillée millefeuille, la bougie se consumant peu à peu.\n\n[monk.Custom('FR_IlElle')|U] ne lève pas la tête."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "[monk.GetFirstName] est en train de ramasser les tiges dans un chiffon quand je reviens. La lueur de la bougie vacille.\n\n« Quelle persévérance », dit-[monk.Custom('FR_IlElle')] soudain. « La Voie n’a rien contre une deuxième visite. Et vous ? »"
 gdp_visit_holding_decision_event.1330.a: "Ma compagnie aurait bien besoin d’une personne avisée."
 gdp_visit_holding_decision_event.1330.a.tt: "[monk_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [monk.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "Dites-moi ce que vous avez étudié."
 gdp_visit_holding_decision_event.1330.c: "Je sais une ou deux choses sur le paradis."
 gdp_visit_holding_decision_event.1330.c.success: "Vous impressionnez [monk.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName] reste de marbre et s’éloigne"
 gdp_visit_holding_decision_event.1330.d: "Peut-être une autre fois."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1333.t: "[Select_CString(caravaneer.IsFemale,'La caravanière aguerrie','Le caravanier aguerri')]"
 gdp_visit_holding_decision_event.1333.desc: "Les dromadaires se blottissent les uns contre les autres dans le petit abri que leur offre leur enclos. De temps en temps, le troupeau laisse échapper un grognement, un piétinement, ou un... #EMP ronflement#! ?\n\nEn m’approchant, je remarque [Select_CString(caravaneer.IsFemale,'une caravanière endormie','un caravanier endormi')] contre les sacoches. [caravaneer.Custom('FR_IlElle')|U] se réveille en m’entendant et se dépêche de se redresser, tout en essuyant la bave qui coule de ses lèvres.\n\n[caravaneer.Custom('FR_IlElle')|U] se reprend : « Je vous assure que le propriétaire de l’écurie sait que je suis ici. C’est juste que je ne quitte jamais mes bêtes, pour leur sécurité et pour avoir l’esprit tranquille. »"
 gdp_visit_holding_decision_event.1333.desc_returned_01: "Les dromadaires sont encore agglutinés dans l’enclos. Cette fois, [caravaneer.GetFirstName] est bien réveillé[caravaneer.Custom('FR_E')] et passe la main sur la sangle de sa selle.\n\n[caravaneer.Custom('FR_IlElle')|U] jette un coup d’œil par-dessus son épaule. « Encore vous. »"
 gdp_visit_holding_decision_event.1333.desc_returned_02: "Un grognement sort de l’enclos, suivi de la voix de [caravaneer.GetFirstName] : « Si vous êtes là pour regarder les bêtes, sachez qu’elles vous le feront payer. »\n\n[caravaneer.Custom('FR_IlElle')|U] est assis[caravaneer.Custom('FR_E')] sur les sacoches à présent, tout habillé[caravaneer.Custom('FR_E')], et attendant de voir si j’engage la discussion ou non."
 gdp_visit_holding_decision_event.1333.a: "« Je protégerai vos bêtes. »"
 gdp_visit_holding_decision_event.1333.a.tt: "[caravaneer_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [caravaneer.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "« Quelles nouvelles, sur la route ? »"
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "Vous vous êtes récemment renseigné[ROOT.Char.Custom('FR_E')] sur la route. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]"
 gdp_visit_holding_decision_event.1333.c: "« Je sais une ou deux choses sur la manière d’organiser des caravanes... »"
 gdp_visit_holding_decision_event.1333.c.success: "Vous impressionnez [caravaneer.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName] rappelle ses bêtes et s’en va"
 gdp_visit_holding_decision_event.1333.d: "Peut-être une autre fois."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$ :"
 gdp_visit_holding_decision_event.1334.t: "Le capitaine du navire"
 gdp_visit_holding_decision_event.1334.desc: "Sur le quai, des femmes et des hommes se sont rassemblés autour d’un marin aux traits burinés, dans l’espoir de pouvoir embarquer à bord de son navire.\n\nJe surprends deux passants qui chuchotent entre eux : « On arrive trop tard ! [sea_captain.Custom('FR_le_Char_Pi')|U][sea_captain.GetTitledFirstName] n’aura jamais de place pour nous. » Au lieu d’aller voir un autre marin, ils préfèrent attendre son prochain passage.\n\nMais qui est [Select_CString(sea_captain.IsFemale,'cette femme','cet homme')] au juste, et est-ce de #EMP l’or#! que j’entends cliqueter à l’intérieur de sa jambe de bois ?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "La foule a fini par se disperser autour de [sea_captain.GetFirstName]. [sea_captain.Custom('FR_IlElle')|U] met des pièces dans sa jambe de bois, une à une, tandis qu’arrivent les derniers requérants.\n\n[sea_captain.Custom('FR_IlElle')|U] ne prend pas la peine de se retourner. « Je ne m’attendais pas à vous revoir. »"
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.Custom('FR_le_Char_Pi')|U][sea_captain.GetTitledFirstName] fait signe à un retardataire de se diriger vers un autre navire. Sa jambe de bois tape le plancher lorsqu’[sea_captain.Custom('FR_IlElle')] se retourne vers moi.\n\n« Encore vous ? C’est une couchette que vous cherchez, ou c’est moi ? »"
 gdp_visit_holding_decision_event.1334.a: "« Je peux vous offrir deux fois le prix de n’importe quel passager ici. »"
 gdp_visit_holding_decision_event.1334.a.tt: "[sea_captain_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [sea_captain.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "« Vous voulez bien me partager une ou deux histoires ? »"
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "Vous avez récemment écouté l’histoire d’un capitaine. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]"
 gdp_visit_holding_decision_event.1334.c: "« Le commerce de marchandises est bien plus lucratif. »"
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip] est convaincu[sea_captain.Custom('FR_E')]"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName] s’en va"
 gdp_visit_holding_decision_event.1334.d: "Peut-être une autre fois."
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1335.t: "[Select_CString(carnival_jester.IsFemale,'La bouffonne','Le bouffon')] du carnaval"
 gdp_visit_holding_decision_event.1335.desc: "Un public captivé se rassemble autour de [Select_CString(carnival_jester.IsFemale,'la femme','l’homme')] qui se donne en spectacle au coin de la rue, attirant les clients potentiels des étals situés à proximité et interrompant temporairement toute activité commerciale.\n\nL’artiste de rue tend le bras et dit : « Écoutez-moi bien, vous qui m’avez dit que je ne pouvais pas réussir mes tours loin des scènes du carnaval. Contrairement à vous, je n’ai pas besoin de me cacher derrière un masque. »"
 gdp_visit_holding_decision_event.1335.desc_returned_01: "Dans le même coin, un public moins nombreux. [carnival_jester.GetFirstName] termine son tour, me regarde, et tend les bras comme si je faisais moi aussi partie du spectacle.\n\n« Un rappel ? »"
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName] range ses accessoires dans un tissu.\n\n« Je vais commencer à croire que c’est moi qui vous intéresse. »"
 gdp_visit_holding_decision_event.1335.a: "« Ma compagnie a besoin d’une personne futée comme vous. »"
 gdp_visit_holding_decision_event.1335.a.tt: "[carnival_jester_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [carnival_jester.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "« Parlez-moi un peu de ces carnavals. »"
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "Vous vous êtes récemment renseigné[ROOT.Char.Custom('FR_E')] sur les carnavals. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]"
 gdp_visit_holding_decision_event.1335.c: "« Vous n’avez plus rien à prouver ici, je me trompe ? »"
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip] est convaincu[carnival_jester.Custom('FR_E')]"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName] range ses affaires et s’en va"
 gdp_visit_holding_decision_event.1335.d: "Peut-être une autre fois."
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$ :"
 gdp_visit_holding_decision_event.1336.t: "[Select_CString(cook.IsFemale,'La boulangère','Le boulanger')]"
 gdp_visit_holding_decision_event.1336.desc_intro: "La délicieuse odeur [ROOT.Char.Custom('FavoriteTreat')] émane de l’étal d’à côté, où des paniers de bons produits sont empilés un peu partout.\n\n[cook.Custom('FR_LeLa')|U] propriétaire de la boutique se tient à côté, la tête entre les mains. Quand [cook.Custom('FR_IlElle')] remarque ma présence, [cook.Custom('FR_IlElle')] dit :"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "« Avant, je travaillais pour [local_noble.Custom('FR_le_Char_Pi')][local_noble.GetTitledFirstNameNoTooltip], mais [local_noble.Custom('FR_IlElle')] \"essaie de garder la ligne\" et n’a plus besoin de mes services. » [cook.Custom('FR_IlElle')|U] se mord la lèvre. « Peut-être que vous pourriez m’aider avec tout ça. Je n’aurai pas assez de temps pour m’occuper de tout aujourd’hui. »"
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "« Il me reste bien trop de marchandises à vendre ! »"
 gdp_visit_holding_decision_event.1336.desc_returned_01: "L’étal sent encore la douce odeur [ROOT.Char.Custom('FavoriteTreat')]. [cook.GetFirstName] prépare un autre paquet pour un inconnu qui ne paie pas.\n\n[cook.Custom('FR_IlElle')|U] soupire en me voyant. « Ils ne m’ont toujours pas appelé[cook.Custom('FR_E')]. Je ne peux pas continuer comme ça. »"
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Les paniers se font plus rares, à présent. [cook.GetFirstName] est appuyé[cook.Custom('FR_E')] sur le comptoir, les manches pleines de farine, et regarde les derniers produits partir.\n\n« Si vous avez besoin d’[Select_CString(cook.IsFemale,'une boulangère','un boulanger')] », me dit-[cook.Custom('FR_IlElle')], « dites-le avant qu’il ne me reste plus rien. »"
 gdp_visit_holding_decision_event.1336.a: "« Ma compagnie regorge de personnes à nourrir. »"
 gdp_visit_holding_decision_event.1336.a.tt: "[cook_recruit_cost|V0]@gold_icon! en [gold|El] pour recruter [cook.GetFirstNameNoTooltip]"
