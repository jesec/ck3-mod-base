l_french:
 gdp_visit_holding_decision: "Visiter la propriété"
 gdp_visit_holding_decision_tooltip: "$visit_local_settlement_decision_tooltip$\n[ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionAvailableAreasWorship')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasHeader')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasGuilds')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasMarket')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasDocks')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasPatron')][ROOT.Char.Custom('GetVisitHoldingDecisionExhaustedAreasWorship')]"
 gdp_visit_holding_decision_confirm: "Au travail !"
 gdp_visit_holding_decision_desc: "Les opportunités viennent à ceux qui les recherchent. Cette [ROOT.Char.Custom('LocalHoldingTypeConcept')|l] à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] regorge de potentiel inexploité ! De nouveaux clients, contrats et affaires n’attendent que vous."
 gdp_visit_holding_decision_effect_intro: "Vous pourriez avoir l’occasion de faire ce qui suit :"
 gdp_visit_holding_decision_effect_artifact: "\n$EFFECT_LIST_BULLET$ Améliorer ou acheter des [artifacts|El][artifact_i]"
 gdp_visit_holding_decision_effect_guild: "\n$EFFECT_LIST_BULLET$ Augmenter vos [skills|El][skill_i] ou celles de votre [family|El][family_i] "
 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$ Augmenter votre [trade_competitiveness|El][competitiveness_i]"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$ Dépenser de l’[gold|El][gold_i] pour du [prestige|El][prestige_i]"
 gdp_visit_holding_decision_effect_recruit: "\n$EFFECT_LIST_BULLET$ Rencontrer et recruter des [associates|El][associate_i]"
 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$ Découvrir des [luxury_contracts|El][luxury_contract_i]"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$ Réduisez votre [stress|El][stress_loss_i]"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$ $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$ $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$ $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak Vous avez encore des opportunités dans :#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$Les guildes"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$Le marché"
 VISIT_HOLDING_DECISION_AVAILABLE_DOCKS: "\n$EFFECT_LIST_BULLET$Les embarcadères"
 VISIT_HOLDING_DECISION_AVAILABLE_PATRON: "\n$EFFECT_LIST_BULLET$La cour de votre [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]"
 VISIT_HOLDING_DECISION_AVAILABLE_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 VISIT_HOLDING_DECISION_EXHAUSTED_AREAS_HEADER: "\n#weak Ces zones rouvriront après :#!"
 VISIT_HOLDING_DECISION_EXHAUSTED_GUILDS: "\n$EFFECT_LIST_BULLET$Les guildes — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$Le marché — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$Les embarcadères — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$La cour de votre [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "Vous avez exploré toutes les opportunités de cette [ROOT.Char.Custom('LocalHoldingTypeConcept')|l]. De nouvelles options seront disponibles après [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "Visiter la [ROOT.Char.Custom('LocalHoldingType')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1000.desc: "Le soleil se lève à nouveau sur [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], de même que les habitants. Le calme matinal est rapidement rompu par l’agitation joyeuse des gens vaquant à leurs occupations quotidiennes. Un observateur attentif saura trouver des occasions à chaque coin de rue dans ces rues bondées.\n\nOù devrais-je me rendre pour tenter ma chance aujourd’hui ?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "Les leçons de l’entrepôt"
 gdp_visit_holding_decision_event.1000.a: "Je devrais me rendre aux guildes"
 gdp_visit_holding_decision_event.1000.a.tt: "Une visite des guildes pourrait offrir les opportunités suivantes : $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "Vous avez exploré tout ce que les guildes ont à offrir. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "Vous avez exploré tout ce que le marché a à offrir. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "Vous avez exploré tout ce que les embarcadères ont à offrir. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "Vous avez épuisé toutes les opportunités à la cour [THIS.Char.GetSuzerain.Custom('FR_du_Char_Pi')][THIS.Char.GetSuzerain.GetTitledFirstNameNoTooltip] pour le moment. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "Vous n’avez pas de mécène auprès de qui chercher une audience"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "Vous avez exploré tout ce que [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] a à offrir pour le moment. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 gdp_visit_holding_caught_stealing.tt: "Vous avez récemment été pris[THIS.Char.Custom('FR_E')] en train de voler dans [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] de cette [THIS.Char.Custom('LocalHoldingTypeConcept')|l]. Vous êtes banni[THIS.Char.Custom('FR_E')] jusqu’au [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]"
 gdp_visit_holding_decision_event.1000.b: "Je devrais essayer d’obtenir une audience auprès [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1000.c: "Une journée idéale pour flâner sur la place du marché."
 gdp_visit_holding_decision_event.1000.c.tt: "Une visite du marché local pourrait offrir les opportunités suivantes : $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "Une belle journée pour se promener le long des embarcadères."
 gdp_visit_holding_decision_event.1000.e.tt: "Une visite des embarcadères pourrait offrir les opportunités suivantes : $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] m’intrigue."
 gdp_visit_holding_decision_event.1000.f.tt: "Une visite du lieu de culte pourrait offrir les opportunités suivantes : $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_cure$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$ Donner de l’[gold|El][gold_i] pour gagner de la [piety|El][piety_i]"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$ Améliorer votre [health|El] ou guérir vos [diseases|El]"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$ Obtenir une bénédiction sous la forme d’un [character_modifier|El]"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ Voler de l’[gold|El][gold_i] des offrandes"
 gdp_visit_holding_decision_event.1000.d: "Je crois que j’en ai fini avec mes courses pour aujourd’hui."
 gdp_visit_holding_decision_event.1000.d.tt: "Rentrer chez vous pour l’instant"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "« En fait, j’ai changé d’avis. »"
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Partir sans explorer cette [ROOT.Char.Custom('LocalHoldingTypeConcept')|l]"
 gdp_visit_holding_decision_event.1000.d.exhausted: "On dirait bien qu’il n’y a rien d’autre à faire..."
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Rentrez chez vous. De nouvelles opportunités seront disponibles après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Votre [domicile|El] n’est actuellement pas dans le pays de votre [merchant_patron|El]"
 gdp_visit_holding_decision_event.1110.t: "Visiter les guildes de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1110.desc: "Le bruit des marteaux frappant le métal résonne dans les ruelles des guildes. Un peu plus loin, un jeune apprenti transporte les outils de son maître vers un atelier de poterie. Depuis des générations, les guildes forment les compagnons pour en faire des maîtres dans leur métier.\n\nLes guildes proposent aux marchands une large gamme de services. Laquelle devrais-je consulter aujourd’hui ?"
 gdp_visit_holding_decision_event.1110.a: "L’un de mes objets aurait bien besoin d’un petit coup de polissage."
 gdp_visit_holding_decision_event.1110.a.tt: "Une rencontre avec le conservateur pourrait offrir l’opportunité suivante :\n$EFFECT_LIST_BULLET$ Améliorer vos [artifacts|El]@artifact_icon! ordinaires et chefs-d’œuvre"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "Vous avez récemment eu recours aux services du conservateur. Vous pouvez réessayer dans [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "Vous n’avez pas d’[artifact|El] ordinaire ou chef-d’œuvre"
 gdp_visit_holding_decision_event.1110.b: "J’ai envie de nouvelles armes et armures."
 gdp_visit_holding_decision_event.1110.b.tt: "Une rencontre avec le forgeron pourrait offrir l’opportunité suivante :\n$EFFECT_LIST_BULLET$ Acheter des [artifacts|El]@artifact_icon! ordinaires, célèbre ou chefs-d’œuvre de type arme ou armure"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "Vous avez récemment acheté quelque chose chez le forgeron. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.c: "Je devrais organiser une rencontre avec un maître de guilde."
 gdp_visit_holding_decision_event.1110.c.tt: "Rencontrer un maître de guilde pourrait offrir l’opportunité suivante :$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "Vous avez récemment rencontré un maître de guilde. Vous pouvez réessayer après [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]"
 gdp_visit_holding_decision_event.1110.d: "Je devrais peut-être aller ailleurs ?"
 gdp_visit_holding_decision_event.1110.d.tt: "Quittez les guildes pour l’instant"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$ : le conservateur"
 gdp_visit_holding_decision_event.1111.desc: "Lorsque j’entre dans l’atelier du conservateur, je découvre des objets fascinants venus d’ici et d’ailleurs. Près d’un établi situé au fond de la pièce, [Select_CString(curator.IsFemale,'une femme','un homme')] est penché[curator.Custom('FR_E')] sur un poignard dont le pommeau est orné des pierres précieuses les plus raffinées. Alors que j’admire l’un des bijoux exposés, [Select_CString(curator.IsFemale,'la conservatrice','le conservateur')] interrompt son travail.\n\n« Ah, [Select_CString(ROOT.Char.IsFemale,'une cliente','un client')] ! En quoi puis-je vous être utile aujourd’hui, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ? »"
 gdp_visit_holding_decision_event.1111.a: "[artifact_target_1.GetNameNoTooltip] aurait besoin d’un coup de polissage."
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName] obtiendra une amélioration"
 gdp_visit_holding_decision_event.1111.b: "[artifact_target_2.GetNameNoTooltip] a besoin d’un peu d’amour."
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName] obtiendra une amélioration"
 gdp_visit_holding_decision_event.1111.c: "Je suppose que mon objet [artifact_target_3.GetNameNoTooltip] pourrait être meilleur."
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName] obtiendra une amélioration"
 gdp_visit_holding_decision_event.1111.d: "Je devrais peut-être revenir plus tard..."
 gdp_visit_holding_decision_event.1111.d.tt: "Retournez dans les guildes et voyez ce que [THIS.Char.GetCurrentLocation.GetName] a d’autre à offrir."
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$ : [Select_CString(blacksmith.IsFemale,'la forgeronne','le forgeron')]"
 gdp_visit_holding_decision_event.1112.desc: "Lorsque j’entre dans l’atelier du forgeron, je ressens la chaleur écrasante de la fournaise. [Select_CString(blacksmith.IsFemale,'La forgeronne','Le forgeron')], qui était justement en train de marteler une épée large, est brusquement interrompu[blacksmith.Custom('FR_E')] par mon arrivée. [blacksmith.Custom('FR_IlElle')|U] essuie de son front un mélange de sueur et de suie et reporte alors son attention sur moi.\n\n« Oh, qu’avons-nous là ? [ROOT.Char.Custom('FR_MonseigneurMadame')|U] aurait-[ROOT.Char.Custom('FR_IlElle')] l’intention d’acheter aujourd’hui quelques-unes de ces belles armes et armures ? Les meilleures que l’on puisse trouver à [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. »"
 gdp_visit_holding_decision_event.1112.a: "Cet objet irait bien dans ma collection ([arms_armor_artifact_1.GetNameNoTooltip])."
 gdp_visit_holding_decision_event.1112.b: "Peut-être que je devrais acheter votre [arms_armor_artifact_2.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1112.c: "Votre [arms_armor_artifact_3.GetNameNoTooltip] pourrait m’être utile."
 gdp_visit_holding_decision_event.1112.d: "À la réflexion, peut-être pas aujourd’hui."
 gdp_visit_holding_decision_event.1112.d.tt: "Retournez dans les guildes et voyez ce que [THIS.Char.GetCurrentLocation.GetName] a d’autre à offrir."
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$ : conseils du maître de guilde"
 gdp_visit_holding_decision_event.1113.desc: "La rencontre avec le maître de guilde, [guild_master.GetTitledFirstName], s’est avérée fructueuse pour la compagnie [ROOT.Char.GetHouse.GetName]. Dans le bureau poussiéreux, au milieu des piles de documents et de livres, les heures ont filé à toute allure.\n\n[guild_master.Custom('FR_le_Char_Pi')|U][guild_master.GetTitledFirstNameNoTooltip] détient un savoir inégalé dans le domaine [guild_master.Custom('highest_skill_noun')]. M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('visiting_associate'))], [visiting_associate.Custom('FR_le_Char_Pi')][visiting_associate.GetTitledFirstName], et moi-même avons été [Select_CString(And(guild_master.IsFemale, visiting_associate.IsFemale), 'captivées', 'captivés')] par son discours et sommes [Select_CString(And(guild_master.IsFemale, visiting_associate.IsFemale), 'impatientes', 'impatients')] d’en apprendre davantage."
 gdp_visit_holding_decision_event.1113.a.success: "Vous et [visiting_associate.Custom('FR_le_Char_Pi')][visiting_associate.GetTitledFirstName] assimilez sans peine ces nouvelles connaissances"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Déchiffrer de vieux manuscrits n’est pas une tâche facile"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "Ces équations sont trop difficiles pour que vous et [visiting_associate.Custom('FR_le_Char_Pi')][visiting_associate.GetTitledFirstName] puissiez les comprendre"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Certaines grandes luttes diplomatiques sont trop complexes pour être comprises"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "La leçon tombe dans l’oreille d’un sourd."
 gdp_visit_holding_decision_event.1113.a: "« Peut-être que [visiting_associate.Custom('FR_le_Char_Pi')][visiting_associate.GetTitledFirstNameNoTooltip] et moi pourrions rester plus longtemps ? »"
 gdp_visit_holding_decision_event.1113.a.child: "La leçon bénéficiera à l’éducation [visiting_associate.Custom('FR_du_Char_Pi')][visiting_associate.GetTitledFirstName]"
 gdp_visit_holding_decision_event.1113.b: "« [visiting_associate.GetFirstNameNoTooltip] aurait bien besoin d’une leçon supplémentaire sur le sujet. »"
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.Custom('FR_le_Char_Pi')|U][guild_master.GetTitledFirstName] enseigne davantage [visiting_associate.Custom('FR_au_Char_Pi')][visiting_associate.GetTitledFirstNameNoTooltip] sur le sujet :"
 gdp_visit_holding_decision_event.1113.c: "« C’est passionnant ! Il faut que je note ça tout de suite ! »"
 gdp_visit_holding_decision_event.1113.c.tt: "Les connaissances [guild_master.Custom('FR_du_Char_Pi')][guild_master.GetTitledFirstName] seront utiles à la compagnie [THIS.Char.GetHouse.GetName]"
 gdp_visit_holding_decision_event.1113.d: "Assez parlé [guild_master.Custom('highest_skill_noun')] pour aujourd’hui."
 gdp_visit_holding_decision_event.1113.d.tt: "Retournez dans les guildes et voyez ce que [THIS.Char.GetCurrentLocation.GetName] a d’autre à offrir."
 gdp_visit_holding_decision_event.1300.t: "Visiter la place du marché de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1300.asia: "Comme sur tous les marchés de la Route de la Soie, on y trouve en abondance des produits de luxe, tels que le jade, la soie et le thé.\n\nAu milieu de la rue bondée, un homme décharge avec précaution des vases en porcelaine fragiles d’une charrette. À côté de lui, un marchand étranger vêtu de couleurs vives fouille parmi les articles proposés par les étals, impatient d’acheter quelque chose."
 gdp_visit_holding_decision_event.1300.mena_india: "Des tissus colorés et des poteries à motifs égaient cette ruelle par ailleurs plutôt sombre. L’encens et les épices embaument l’air d’un parfum agréable.\n\nDans un coin sombre, un marchand tente désespérément de convaincre un passant méfiant d’acheter quelques-unes de ses assiettes en cuivre de grande qualité. C’est vraiment le moment idéal pour faire une bonne affaire."
 gdp_visit_holding_decision_event.1300.default: "Le parfum des fruits et légumes frais se mêle à l’arôme plutôt épicé de la foule rassemblée ici. Sur la place bondée, les marchands se livrent à une joute verbale en criant.\n\n« Des bouteilles [ROOT.Char.Custom('RegionalDrink')] ! Offre spéciale ! Aujourd’hui seulement ! » « Dernière chance d’acheter le meilleur morceau de viande [ROOT.Char.Custom('RegionalEdibleMeat')] ! »\n\n"
 gdp_visit_holding_decision_event.monk_hint: "Un homme sort du salon de thé d’à côté, tête baissée, en marmonnant quelque chose à propos d’un mauvais présage. Apparemment, quelqu’un pratique la voyance à l’intérieur."
 gdp_visit_holding_decision_event.monk_hint_return: "Le calme est retombé dans le salon de thé, mais le moine devin n’est pas encore parti."
 gdp_visit_holding_decision_event.caravaneer_hint: "Un cortège de caravanes endommagées par les intempéries défile dans la rue, tandis que les écuries locales ont toutes les peines du monde à faire face à cet afflux de marchands."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "Les caravanes sont encore là. Leur conducteur attend patiemment au milieu des animaux."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\nLa rumeur raconte qu’un capitaine particulièrement expérimenté embarquerait des passagers à bord de son bateau aujourd’hui."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\nLe capitaine embarque encore des passagers, et la foule qui s’agglutine autour du navire n’a pas diminué."
 gdp_visit_holding_decision_event.carnival_jester_hint: "Je ne peux pas m’empêcher d’entendre un autre marchand se plaindre d’un artiste de rue en particulier qui attire l’attention de ses clients habituels."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "L’artiste de rue captive encore la foule, au grand dam des marchands à proximité."
 gdp_visit_holding_decision_event.cook_hint: "Je remarque un certain nombre de personnes avec [ROOT.Char.Custom('FavoriteTreat')]. D’après ce que j’ai cru comprendre, un boulanger en distribue gratuitement."
 gdp_visit_holding_decision_event.cook_hint_return: "Le boulanger est encore là."
