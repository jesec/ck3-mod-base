l_french:
 gdp_repudiate_usurious_loan_decision: "Dénoncer un prêt usuraire"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.Custom('FR_le_Char_U_Pi')|U][ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip] a écrit l'obligation avec des intérêts transparents et nos [ROOT.Char.GetRite.PriestNeuterPlural] soutiennent qu'un tel contrat n'engage personne. Que la dette soit annulée plutôt que payée.\n\nCe n'est pas du vol. C'est la loi [ROOT.Char.GetRite.GetAdjectiveNoTooltip] mais tous les marchands d'ici jusqu'à la mer appelleront cela du vol de toute façon."
 gdp_repudiate_usurious_loan_decision_tooltip: "Demandez à votre [clergy|El] d'annuler la dette pour cause d'[usury|El], vous garderez votre [gold|El] au prix de votre réputation auprès des [merchants|El]"
 gdp_repudiate_usurious_loan_decision_confirm: "Aucun contrat écrit dans le péché ne peut me lier !"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "Vous n'êtes pas en mesure de rembourser ce [loan|El]"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "Vous n'avez pas dénoncé de [creditor|El] dernièrement"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X Les [merchants|El] n'accepteront probablement pas de rallonger votre crédit dans l'immédiat#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "Votre [rite|El] doit considérer le prêt comme un péché et un dirigeant du [clergy|El] de votre [faith|El] doit être assez proche pour l'annuler : dont le [rite|El] le permet, qui n'est ni votre [creditor|El] ni votre [rival|El] et qui n'est pas en guerre contre vous\n#weak Votre [head_of_faith|El], le détenteur de la [clerical_region|El] de votre capitale ou de votre emplacement ou n'importe quel membre du [clergy|El] dans le royaume de votre [top_liege|El].#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "Votre [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|El] doit vous soutenir : doit avoir une [opinion|El] #P positive#! de vous ou doit être un [puppet|El] grâce à un [strong_hook|El]"
 become_merchant_decision: "Devenir marchand"
 become_merchant_decision_desc: "À quoi sert-il d’être au service de la Cour si l’on ignore les coutumes des hommes ? L’envie de voyager à l’étranger et de devenir un intermédiaire entre les pays sont des aspirations trop fortes pour être ignorées."
 become_merchant_decision_tooltip: "Cédez vos [titles|El] et fondez une [company|El] [Concept('merchant', 'marchande')|E]"
 become_merchant_decision_confirm: "Le moment est venu de faire des affaires !"
 become_merchant_decision_house_head_tt: "Vous devez être un [Concept('house_head', 'chef de Maison')|E]"
 gdp_recently_became_adventurer_decision_cooldown_tt: "Vous avez été un [adventurer|El] pendant #V 5 ans#!"
 repudiate_loan_tt: "[repudiating_borrower.Custom('FR_le_Char_U_Pi')|U][repudiating_borrower.GetShortUIName|U] ne [Select_CString(repudiating_borrower.IsLocalPlayer,'devrez','devra')] plus rembourser [Select_CString(repudiating_borrower.IsLocalPlayer,'votre','son')] prêt [repudiated_lender.Custom('FR_au_Char_U_Pi')][repudiated_lender.GetShortUIName]"
 abuse_charter_authority_decision: "Abuser de l’autorité conférée par la charte"
 abuse_charter_authority_decision_tooltip: "Utilisez votre [charter|El] pour soutirer de l’[gold|El][gold_i|E] et augmenter votre [competitiveness|El][competitiveness_i|E]"
 abuse_charter_authority_decision_desc: "Je suis muni[ROOT.Char.Custom('FR_E')] d’une charte [ROOT.Char.GetSuzerain.Custom('FR_du_Char_L')][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip] de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], qui confère à la volonté de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] force de loi. Avec notre [Select_CString(ROOT.Char.GetSuzerain.IsFemale,'souveraine','souverain')] à nos côtés, personne n’osera s’opposer à nous."
 abuse_charter_authority_decision_confirm: "J’agis au nom [ROOT.Char.GetSuzerain.Custom('FR_du_Char_Pi')][ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip] !"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "L’autorité du [gurkhan|El] n’est pas reconnue ici"
 abuse_charter_authority_decision.region_already_abused: "Ces terres ont déjà connu les abus de l’autorité du [gurkhan|El]"
 abuse_charter_authority_decision.nothing_to_abuse: "Il n’y a pas de terrain propice aux abus dans ce [location|El]"
 gdp_charter_abused_market_modifier: "Abus de l’autorité conférée par la charte"
 gdp_charter_abused_market_modifier_desc: "Ce personnage a abusé de l’autorité que lui confère une charte pour servir les intérêts de sa propre compagnie."
 gdp_charter_abused_market_county_modifier: "Abus de l’autorité conférée par la charte"
 gdp_charter_abused_market_county_modifier_desc: "Ce comté a été exploité par une compagnie marchande qui a utilisé une charte pour s’enrichir."
 gdp_charter_leveraged_market_modifier: "Mis à l’écart par le titulaire de la charte"
 gdp_charter_leveraged_market_modifier_desc: "La compagnie de ce personnage a vu sa fortune décliner face à un rival muni d’une charte délivrée par le dirigeant du pays."
 gdp_charter_charitable_market_county_modifier: "Développement grâce à la charte"
 gdp_charter_charitable_market_county_modifier_desc: "Ce comté a été développé par une compagnie marchande qui a utilisé une charte pour intervenir directement."
 gdp_decision.1000.t: "Mécontentement [patron.Custom('FR_DuDela')] $game_concept_merchant_patron|l$"
 gdp_decision.1000.desc: "Un messager m’apporte des nouvelles des salles [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstNameNoTooltipRegnal], où des accusations ont été portées contre ma compagnie pour des abus, devant m[patron.Custom('FR_OnA')] $game_concept_merchant_patron|l$ qui a observé la scène sans ciller.\n\nOn m’a dit que les magistrats avaient énuméré en détail leurs allégations concernant notre mauvaise conduite, et que [patron.Custom('FR_le_Char_L')][patron.GetTitleAsNameNoTooltip|l] s’était peu à peu retourné[patron.Custom('FR_E')] contre moi.\n\nÀ présent, [patron.Custom('FR_IlElle')] exige une réponse immédiate, dans laquelle je dois fournir des explications sur ces abus..."
 gdp_decision.1000.a: "« J’accepte le jugement. »"
 gdp_decision.1000.b: "« Comprenez que je l’ai fait pour le pays... »"
 gdp_decision.1000.b.success: "Votre $game_concept_merchant_patron|l$ est indulgent[patron.Custom('FR_E')]"
 gdp_decision.1000.b.failure: "Votre $game_concept_merchant_patron|l$ est indigné[patron.Custom('FR_E')]"
 gdp_decision.1000.a.effects: "Votre [merchant_patron|El] obtient un [imprisonment_reason|El] et [Concept('execute_reason', 'd’exécution')|E] à votre encontre"
 gdp_decision.1000.a.severe_effects: "Votre [merchant_patron|El] reçoit un [imprisonment_reason|El] et un [execute_reason|El] concernant vous et les membres de votre [Concept('close_family','proche famille')|E]"
 gdp_decision.1000.a.survived_patrons_wrath: "Même si vous avez survécu à la colère de votre [merchant_patron|El], vous ne pourrez plus abuser de son autorité"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "En tant que [ROOT.Char.GetTitleAsNameNoTooltip|l], les marchands de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] agissent en mon nom, et tout particulièrement ceux dont la charte porte mon sceau.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$Il semblerait que l’un de ces marchands ambulants, [merchant.Custom('FR_le_Char_Pi')][merchant.GetTitledFirstName], ait abusé de ma générosité et se serve de son autorité privilégiée pour s’enrichir aux dépens du peuple.\n\nIl est scandaleux qu’[merchant.Custom('FR_IlElle')] prenne de telles libertés, mais je dois reconnaître les avantages que des commerçants comme [merchant.Custom('FR_LuiElle')] apportent au pays."
 gdp_decision.1010.a: "[merchant.Custom('FR_IlElle')|U] devra en répondre !"
 gdp_decision.1010.a.tt: "Les autres [clients|El] de vos [charters|El] seront moins disposés à abuser de votre autorité si [merchant.Custom('FR_le_Char_U_Pi')][merchant.GetShortUIName] est [imprisoned|El][merchant.Custom('FR_E')|E]"
 gdp_decision.1010.b: "Je vais laisser cela passer... pour l’instant."
 gdp_decision.1010.c: "Ces querelles à propos de marchands sont indignes de moi."
 gdp_decision.1010.c.flavor: "D’autres abus de votre autorité pourraient se produire, mais vous n’en serez plus informé[GetPlayer.Custom('FR_E')]."
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetNameNoTooltip|U] ? ... Je ne leur ai jamais donné de charte !"
 gdp_decision.1020.t: "Au nom [patron.Custom('FR_du_Char_L')][patron.GetTitleAsNameNoTooltip|l]"
 gdp_decision.1020.opening: "Il me suffit d’agiter ma charte pour que les portes de [market_province.GetBaronyNameExplicitly] et les bureaux de ses magistrats s’ouvrent au nom [patron.Custom('FR_du_Char_Pi')][patron.GetTitledFirstName].\n\n"
 gdp_decision.1020.market_holder: "Le gros bonnet de la région, [market_holder.Custom('FR_le_Char_Pi')][market_holder.GetTitledFirstName], a clairement fait part de son mécontentement, en clamant haut et fort que [patron.Custom('FR_le_Char_L')][patron.GetTitleAsNameNoTooltip|l] en serait informé[patron.Custom('FR_E')], mais ses aboiements ne pèsent pas lourd. Le document est incontestable.\n\n"
 gdp_decision.1020.closing: "Comme la ville est à ma merci, des représentants de la compagnie peuvent mettre la main sur les installations commerciales, saisir les marchandises dépourvues des documents requis et harceler nos concurrents à coups d’allégations et d’accusations sans fondement."
 gdp_decision.1020.a: "Personne ne peut se mettre en travers de notre chemin."
 gdp_decision.1020.b: "Nous devrions nous occuper [market_holder.Custom('FR_du_Char_Pi')][market_holder.GetTitledFirstNameNoTooltip]."
 gdp_decision.1020.c: "J’ai changé d’avis."
 gdp_decision.1020.d: "« Mon inspection est terminée. Cette fois-ci... »"
 gdp_decision.1020.b.success: "Aucun mot ne parvient jusqu’[patron.Custom('FR_au_Char_L')][patron.GetTitleAsNameNoTooltip|l]"
 gdp_decision.1020.b.failure: "[patron.Custom('FR_le_Char_L')|U][patron.GetTitleAsNameNoTooltip|l] a vent de ces abus"
 benevolent_charter_authority_decision: "Investir localement directement"
 benevolent_charter_authority_decision_tooltip: "Utilisez votre [charter|El] pour développer un [building|El][building_i|E] et augmenter la [prosperity|El][prosperity_i|E] locale"
 benevolent_charter_authority_decision_desc: "Avec l’autorisation [ROOT.Char.GetSuzerain.Custom('FR_du_Char_L')][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], je dispose de moyens de pression suffisants pour intervenir directement au sein du pays, ce qui dépasserait les prérogatives d’une simple compagnie commerciale."
 benevolent_charter_authority_decision_confirm: "On peut accomplir beaucoup de bonnes choses au nom [ROOT.Char.GetSuzerain.Custom('FR_du_Char_L')][ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l]."
 merchant_charter_intervention_county_cooldown: "N’est pas intervenu en [THIS.Char.GetDomicile.GetLocation.GetName] durant les #V 5#! dernières années#!"
 gdp_decision.1200.t: "Satisfaction [patron.Custom('FR_DuDela')] $game_concept_merchant_patron|l$"
 gdp_decision.1200.desc: "On raconte que l’initiative de ma compagnie a été vivement saluée par m[patron.Custom('FR_OnA')] $game_concept_merchant_patron|l$, [patron.Custom('FR_le_Char_Pi')][patron.GetTitledFirstNameNoTooltipRegnal].\n\nPlusieurs témoins n’ont pas tari d’éloges à l’égard de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] et de ses récentes interventions.\n\nEn conséquence, [patron.Custom('FR_le_Char_L')][patron.GetTitleAsNameNoTooltip|l] nous a adressé un message : « [Select_CString(ROOT.Char.IsFemale,'Chère','Cher')] [ROOT.Char.GetTitledFirstNameNoTooltip], vos efforts profitent à tout le pays ! »"
 gdp_decision.1200.a: "« La compagnie est ravie de pouvoir se mettre à votre service. »"
 gdp_decision.1200.b: "« La reconnaissance, c’est bien, mais les récompenses aussi. »"
 gdp_decision.1200.b.flavor: "Avec tout le respect que je vous dois..."
 gdp_decision.1200.b.success: "Votre $game_concept_merchant_patron|l$ est [Select_CString(patron.IsFemale,'généreuse','généreux')]"
 gdp_decision.1200.b.failure: "Votre $game_concept_merchant_patron|l$ est déçu[patron.Custom('FR_E')]"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$Il semblerait que parmi eux, [merchant.Custom('FR_le_Char_Pi')][merchant.GetTitledFirstName] a mis à profit son autorité privilégiée au service du pays et a investi dans le développement de [market_province.GetBaronyNameExplicitlyNoTooltip] !\n\nUn tel comportement méritoire est digne d’éloges, et offrir une récompense pourrait sans doute encourager davantage."
 gdp_decision.1210.a: "Un tel engagement mérite d’être encouragé."
 gdp_decision.1210.a.tt: "Les autres [clients|El] de vos [charters|El] seront plus disposés à exercer votre autorité avec bienveillance"
 gdp_decision.1210.b: "Par [ROOT.Char.GetFaith.HighGodName], des marchands honnêtes existent peut-être bel et bien !"
 gdp_decision.1210.c: "Ne pas me déranger avec ce genre de choses"
 gdp_decision.1210.c.flavor: "D’autres exercices bienveillants de votre autorité pourraient se produire, mais vous n’en serez plus informé[GetPlayer.Custom('FR_E')]."
 gdp_decision.1220.t: "Au nom [patron.Custom('FR_du_Char_L')][patron.GetTitleAsNameNoTooltip|l]"
 gdp_decision.1220.opening: "Mon arrivée à [market_province.GetBaronyNameExplicitly], la lettre de privilège en main, a d’abord suscité la consternation parmi les magistrats locaux, mais j’ai rapidement fait comprendre que les intentions de ma compagnie étaient louables.\n\n"
 gdp_decision.1220.market_holder: "Le grand ponte local, [market_holder.Custom('FR_le_Char_Pi')][market_holder.GetTitledFirstName], écoute attentivement ma proposition et estime qu’il serait avantageux d’encourager la production et le commerce auprès de ses sujets.\n\n"
 gdp_decision.1220.closing: "En parcourant la ville, on constate que plusieurs zones nécessitent des réparations et des améliorations, comme l’ont signalé les habitants."
 gdp_decision.1220.a: "« Bon, qu’est-ce qu’on attend ? »"
 gdp_decision.1220.d: "« Tout cela est très intéressant, mais il y a d’autres sujets... »"
 press_the_advantage_decision: "Tirer parti de l’avantage"
 press_the_advantage_decision_desc: "Nos récents succès ont déstabilisé nos concurrents et semé le doute sur les marchés. C’est le moment d’investir dans des intermédiaires et des faveurs, et de transformer l’influence acquise au prix de tant d’efforts en une stratégie qui permette de convertir la pression en bénéfices."
 press_the_advantage_decision_tooltip: "Dépenser de la [competitive_pressure|El][competitive_pressure_i] pour une meilleure [trade_competitiveness|El][competitiveness_i] sur une [trade_route|El] pendant un certain temps"
 press_the_advantage_decision_confirm: "Tirons parti de notre avantage."
 merchant_competitive_pressure_gain_1_tt: "Gain de #P 1#! en [competitive_pressure|El][competitive_pressure_i]"
 merchant_competitive_pressure_gain_2_tt: "Gain de #P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! en [competitive_pressure|El][competitive_pressure_i]"
 merchant_competitive_pressure_spend_tt: "Dépenser #N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! en [competitive_pressure|El][competitive_pressure_i]"
 merchant_competitive_pressure_spend_cost_tt: "Vous avez au moins #V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! en [competitive_pressure|El][competitive_pressure_i]"
 merchant_competitive_pressure_below_max_tt: "Vous avez moins que votre [competitive_pressure|El][competitive_pressure_i] maximale #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!"
 press_the_advantage_route_not_already_pressed_tt: "Vous disposez d’une [trade_route|El] active qui ne bénéficie pas déjà d’un [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]"
 press_the_advantage_selected_route_has_trader_tt: "La [trade_route|El] sélectionnée a un [trader|El]"
 press_the_advantage_selected_route_not_already_pressed_tt: "La [trade_route|El] sélectionnée ne bénéficie pas déjà d’un [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip|l]"
 merchant_competitive_pressure_route_modifier: "Avantage exploité"
 merchant_competitive_pressure_route_modifier_desc: "Cette route commerciale fait l’objet d’une attention particulière de la part d’agents qui savent exactement où se trouvent les points faibles de leurs concurrents."
 choose_specialized_market_decision: "Choisir un marché spécialisé"
 choose_specialized_market_decision_desc: "Une compagnie qui comprend les usages, les décideurs et les circuits cachés d’un marché peut se sentir chez elle, même dans des rues inconnues. En concentrant nos inspecteurs sur un marché spécifique le long de nos routes, nous pouvons transformer cette connaissance du terrain en avantage commercial."
 choose_specialized_market_decision_tooltip: "Choisissez un [market|El][market_i] sur l’une de vos [trade_routes|El][route_i] pour recevoir votre bonus de spécialisation Inspecteur"
 choose_specialized_market_decision_confirm: "Étudier le marché"
 choose_specialized_market_decision_effect_tt: "Le [market|El][market_i] sélectionné devient votre [market|El][market_i] spécialisé"
 choose_specialized_market_has_valid_market_tt: "Vous disposez d’un [market|El][market_i] valable sur une [trade_route|El][route_i] ou à votre [domicile|El]"
 choose_specialized_market_selected_market_has_valid_route_tt: "Le [market|El][market_i] sélectionné est sur l’une de vos [trade_routes|El][route_i] ou à votre [domicile|El]"
 choose_specialized_market_selected_market_is_new_tt: "Le [market|El][market_i] sélectionné n’est pas déjà votre [market|El][market_i] spécialisé"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "Cette compagnie a répertorié les coutumes locales, les fonctionnaires et les pratiques commerciales de ce marché."
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "Cette compagnie applique un régime d’inspection rigoureux sur ce marché."
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "Cette compagnie a répertorié avec précision les étals, les entrepôts et les accords tacites de ce marché."
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "Cette compagnie connaît ce marché comme seule une maîtrise acquise au fil de nombreuses années peut le permettre."
 pious_patronage_decision: "Fournir un pieux patronage"
 pious_patronage_decision_desc: "La foi ouvre des portes que l’argent seul ne peut ouvrir. En soutenant les sanctuaires, le clergé et les œuvres caritatives au sein d’un marché déjà relié à nos routes commerciales, nous pouvons transformer notre dévotion commune en confiance commerciale."
 pious_patronage_decision_tooltip: "Dépenser de la [piety|El][piety_i] pour améliorer votre [trade_competitiveness|El][competitiveness_i] sur un [market|El][market_i]"
 pious_patronage_decision_confirm: "Financer les fidèles"
 pious_patronage_has_valid_market_tt: "Vous avez une [trade_route|El][route_i] passant par un [market|El][market_i] valable qui ne bénéficie pas déjà d’un [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip|l]"
 pious_patronage_selected_market_valid_faith_tt: "Le [market|El][market_i] sélectionné suit votre [faith|El] #weak (ou vous avez [GetPerk('prophet_perk').GetName(GetPlayer)])#!"
 pious_patronage_selected_market_has_valid_route_tt: "Vous avez une [trade_route|El][route_i] passant par le [market|El][market_i] sélectionné"
 pious_patronage_selected_market_no_modifier_tt: "Vous ne bénéficiez pas déjà d’un [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip|l] dans le [market|El][market_i] sélectionné"
 pious_patronage_different_faith_cost_tt: "Vous avez au moins #V [EmptyScope.ScriptValue('massive_piety_value')|0]#![piety_i] en [piety|El] pour financer un [market|El][market_i] qui n’est pas de votre [faith|El]"
 pious_patronage_market_modifier: "Pieux patronage"
 pious_patronage_market_modifier_desc: "Cette compagnie bénéficie d’un soutien religieux sur ce marché."
 organize_the_venture_decision: "Organiser la transaction commerciale"
 organize_the_venture_decision_desc: "Une initiative prometteuse est déjà en cours. Grâce à des plans plus rigoureux, à de meilleures consignes et à la pression de la compagnie, il est possible de la faire avancer."
 organize_the_venture_decision_tooltip: "Dépenser de la [competitive_pressure|El][competitive_pressure_i] pour faire progresser un [contract_scheme|El] actif plus rapidement"
 organize_the_venture_decision_confirm: "Organiser le travail"
 merchant_competitive_pressure_organize_venture_spend_tt: "Dépenser #N [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! en [competitive_pressure|El][competitive_pressure_i]"
 merchant_competitive_pressure_organize_venture_spend_cost_tt: "Vous avez au moins #V [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! en [competitive_pressure|El][competitive_pressure_i]"
 organize_the_venture_active_contract_scheme_tt: "Vous avez un [contract_scheme|El] actif qui n’est pas déjà organisé"
 undercut_the_competition_decision: "Proposer des prix inférieurs à ceux de la concurrence"
 undercut_the_competition_decision_desc: "Les bénéfices peuvent se redresser. Un marché perdu, lui, ne le peut pas. En baissant nos prix et en acceptant des marges plus faibles au sein de notre compagnie, nous pouvons mettre nos concurrents en position de faiblesse."
 undercut_the_competition_decision_tooltip: "Gagner de la [competitive_pressure|El][competitive_pressure_i] et une meilleure [trade_competitiveness|El][competitiveness_i] au détriment des prix de vente pour un temps donné"
 undercut_the_competition_decision_confirm: "Réduisons nos marges"
 undercut_the_competition_no_modifier_tt: "Vous n’êtes pas déjà plus compétitif que la concurrence"
 set_company_focus_decision: "Définir l’objectif de la compagnie"
 set_company_focus_decision_desc: "Une compagnie ne vit pas uniquement de ses grands livres. Les obligations publiques, les marges privées et les affaires courantes se disputent toute l’attention."
