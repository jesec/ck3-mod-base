 gdp_decision.3010.t: "Dans la compagnie [sponsored_courtier.Custom('FR_du_Char_Pi')][sponsored_courtier.GetTitledFirstNameNoTooltip]"
 gdp_decision.3010.desc: "« Vous m’honorez en souhaitant me confier cette responsabilité ! Je veillerai à ce que l’entièreté de vos [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] soit utilisée à bon escient. »\n\n[sponsored_courtier.Custom('FR_le_Char_Pi')|U][sponsored_courtier.GetTitledFirstNameNoTooltip] paraît enthousiaste, alors qu’[sponsored_courtier.GetSheHe] ne pouvait pas savoir qu’[sponsored_courtier.GetSheHe] deviendrait m[sponsored_courtier.Custom('FR_OnA')] marchand[sponsored_courtier.Custom('FR_E')] de confiance avant d’entrer dans cette pièce.\nPlus que la satisfaction de l’ambition de toute une vie, c’est peut-être la promesse des fonds initiaux, et l’idée de pouvoir les dépenser pour créer sa propre compagnie, qui ont suscité son emballement."
 gdp_decision.3010.a: "Je vous donnerai de quoi vous en sortir."
 gdp_decision.3010.b: "Toutes les dépenses de bases seront couvertes."
 gdp_decision.3010.c: "Un capital conséquent assurera notre réussite."
