 craft_artifact_scheme.1000.t: "$craft_artifact$ : réussite"
 craft_artifact_scheme.1000.intro.curio: "J'ai passé de nombreuses nuits dans mon atelier, avec un associé ou un membre d'une guilde locale à mes côtés, à confectionner des choses et d'autres."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nMais aujourd'hui, je peux enfin dire que tout ce travail a payé ! Lorsque je regarde mon œuvre, chaque marque laissée par mes outils me fait sourire et je n'ai plus qu'une idée en tête, où vais-je l'exposer ?"
 craft_artifact_scheme.1000.intro.library: "J'ai passé de nombreuses nuits le corps voûté dans mon bureau, les mains pleines d'encre se mouvant malgré mes crampes et la mèche de ma chandelle diminuant."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nMais aujourd'hui, je peux enfin dire que tout ce travail a payé ! Lorsque je regarde mon œuvre, chaque passage me fait sourire et je ne pense plus qu'aux personnes qui la liront."
 craft_artifact_scheme.1000.desc.curator: "\n\nLes yeux de [Select_CString(curator.IsFemale,'ma conservatrice','mon conservateur')], [curator.GetFirstNamePossessive], s'illuminent en examinant mon travail. « En voilà un véritable accomplissement, [ROOT.Char.GetTitleAsNameNoTooltip]. »"
 craft_artifact_scheme.1000.a: "Cela en valait la peine."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nConfectionné par [ROOT.Char.Custom('FR_le_Char_Pi')][ROOT.Char.GetTitledFirstName] de [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nAutorisé par [ROOT.Char.Custom('FR_le_Char_Pi')][ROOT.Char.GetTitledFirstName] de [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_scheme.2000.t: "$craft_artifact$ : échec"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nChacune de mes tentatives a été contrecarrée par de mauvais calculs ou des erreurs, et mon atelier est désormais jonché des cadavres d'essais abandonnés impossibles à réutiliser..."
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nChaque matin, de nouveaux brouillons rejetés rejoignent le sol et les quelques feuilles que j'ai gardées ne dépeignent pas correctement l'amplitude de mon dessein..."
 craft_artifact_scheme.2000.desc.curator: "\n\n[Select_CString(curator.IsFemale,'Ma conservatrice','Mon conservateur')], [curator.GetFirstName], soupire devant la médiocrité de mes travaux. « Peut-être est-il temps d'accepter votre défaite ? »"
 craft_artifact_scheme.2000.a: "Je suis fatigué[ROOT.Char.Custom('FR_E')] de tout ça..."
 craft_artifact_scheme.2000.b: "... mais je ne peux laisser mes efforts être vain !"
