 craft_artifact_action: "Confectionner l’artefact"
 craft_artifact_desc: "Je vais essayer de produire un [domicile_artifact|El] de [company|El]."
 craft_artifact_desc_general: "Le [scheme|El] $craft_artifact$ est un [personal_scheme|El] où vous et votre [company|El] essayez de confectionner un tout nouvel [domicile_artifact|El]. Ce complot repose principalement sur votre propre [stewardship|El].\n\nLa [success_chance|El] est influencée par beaucoup de choses, mais surtout par votre [stewardship_skill|El] et la [aptitude|El] de votre $antiquarian_merchant|l$."
