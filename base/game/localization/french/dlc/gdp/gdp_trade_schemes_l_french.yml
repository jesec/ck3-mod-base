 gdp_improve_trade_routes_competitiveness_modifier: "Intérêts bien établis"
 gdp_improve_trade_routes_expertise_modifier: "Négociants chevronnés"
 gdp_improve_trade_capacity_decision: "Complot commercial : capacité"
 gdp_improve_trade_capacity_decision_desc: "J’ai conscience que nos négociants doivent abandonner certaines marchandises, faute de place pour les transporter. Il suffirait de réaliser des investissements et des ajustements pour accroître notre présence sur tous les marchés où nous nous rendons."
 gdp_improve_trade_capacity_decision_tooltip: "Commencez un [scheme|El] d’[GetScheme('gdp_improve_trade_capacity').GetTypeName|l] sur une [trade_route|El] de votre choix"
 gdp_improve_trade_capacity_decision_confirm: "Trouver l’espace et la main-d’œuvre"
 gdp_improve_trade_capacity_decision_effect_tt: "Commence un [scheme|El] d’[GetScheme('gdp_improve_trade_capacity').GetTypeName|l] centré sur [selected_item.GetName|l]"
 gdp_improve_trade_competitiveness_decision: "Complot commercial : compétitivité"
 gdp_improve_trade_competitiveness_decision_desc: "Dans certains marchés sur lesquels mes négociants se rendent régulièrement, la compétition est féroce. En versant un peu d’argent aux bonnes personnes et en concluant des accords avec les habitants, nous aurons la priorité sur la concurrence."
 gdp_improve_trade_competitiveness_decision_tooltip: "Commencez un [scheme|El] d’[GetScheme('gdp_improve_trade_competitiveness').GetTypeName|l] sur une [trade_route|El] de votre choix"
 gdp_improve_trade_competitiveness_decision_confirm: "Obtenir un meilleur accueil"
 gdp_improve_trade_competitiveness_decision_effect_tt: "Commence un [scheme|El] d’[GetScheme('gdp_improve_trade_competitiveness').GetTypeName|l] centré sur [selected_item.GetName|l]"
 gdp_improve_trade_expertise_decision: "Complot commercial : expertise"
 gdp_improve_trade_expertise_decision_desc: "Mes négociants me disent que nous faisons encore et encore les mêmes erreurs sur certaines de nos routes commerciales. Il est temps de mettre à profit notre expérience pour nous assurer que nos routes soient aussi efficaces que possible."
 gdp_improve_trade_expertise_decision_tooltip: "Commencez un [scheme|El] d’[GetScheme('gdp_improve_trade_expertise').GetTypeName|l] sur une [trade_route|El] de votre choix"
 gdp_improve_trade_expertise_decision_confirm: "Définir une seule route"
 gdp_improve_trade_expertise_decision_effect_tt: "Commence un [scheme|El] d’[GetScheme('gdp_improve_trade_expertise').GetTypeName|l] centré sur [selected_item.GetName|l]"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$ : réussite"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U] fonctionne enfin de manière optimale. Mes négociants m’ont indiqué que nous rapportons enfin davantage de marchandises, comme je l’espérais."
 gdp_trade_scheme.0002.a: "Chaque centime dépensé en valait la peine."
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip] : échec"
 gdp_trade_scheme.0003.desc: "Malgré tous mes efforts, la route commerciale est restée exactement telle qu’elle était. C’est rageant, mais parfois, on ne peut rien faire contre le marché."
 gdp_trade_scheme.0003.a: "Retournons à nos registres."
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$ : réussite"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U] est enfin aussi rentable que je l’espérais. Mes négociants ont la priorité par rapport à la concurrence, et nous gagnons plus d’argent qu’autrefois."
 gdp_trade_scheme.0004.a: "De l’argent bien dépensé."
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$ : réussite"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U] fonctionne de mieux en mieux et nous commettons moins d’erreurs qu’avant. Ces enseignements nous serviront de fondations pour les futures réalisations de ma Maison."
 gdp_trade_scheme.0005.a: "Et je continuerai nos développements."
 gdp_disrupt_trade_routes: "Perturbation des routes commerciales"
 gdp_disrupt_trade_routes_action: "Perturber les routes commerciales de"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.Custom('FR_le_Char_U_Pi')|U][SCHEME.GetTargetCharacter.GetShortUIName] commerce sur mes marchés. Quelques pots-de-vin et rumeurs sordides suffiraient à réduire à néant l’une de ses [trade_routes|El]."
 gdp_disrupt_trade_routes_desc_general: "La $gdp_disrupt_trade_routes|l$ est un [hostile_scheme|El] dans lequel un [merchant|El] ou [patrician|El] œuvre en vue de détériorer le réseau de [trade_routes|El] de l’un de ses rivaux. Il se base sur l’[intrigue|El] et permet de recruter des [agents|El]."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "L’une des [trade_routes|El] [TARGET_CHARACTER.Custom('FR_du_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] est perturbée pendant #N 20 ans#!"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "Vous n’êtes pas découvert[CHARACTER.Custom('FR_E')] pour la perturbation des [trade_routes|El] d’un rival"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "Vous partagez un [trade_market|El] avec [target.Custom('FR_le_Char_U_Pi')][target.GetShortUIName] : $VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! Fin du complot de $gdp_disrupt_trade_routes|l$"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.Custom('FR_le_Char_U_Pi')|U][owner.GetShortUIName] ne gère plus ses propres [trade_routes|El]"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] ne gère plus ses propres [trade_routes|El]"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] n’a plus aucune [trade_route|El] à perturber"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] possède au moins une [trade_route|El]"
 gdp_disrupt_trade_routes_capacity_modifier: "Logistique perturbée"
 gdp_disrupt_trade_routes_competitiveness_modifier: "Réputation empoisonnée"
 gdp_disrupt_trade_routes_discovered_opinion: "Perturbation des routes commerciales"
 gdp_disrupt_trade_routes_target_notification: "Un problème sur la route [disrupted_trade_route.GetName|l]"
 gdp_disrupt_trade_routes_target_notification_tt: "Quelque chose se passe mal sur l’une de mes [trade_routes|El]. Mes négociants ne peuvent pas me dire de quoi il s’agit."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "L’une de mes [trade_routes|El] est en mauvaise posture. En recherchant l’origine du problème, mes négociants ont pu remonter jusqu’[owner.Custom('FR_au_Char_U_Pi')][owner.GetShortUIName]"
 gdp_disrupt_trade_routes_target_caught_notification: "Sabotage découvert"
 gdp_disrupt_trade_routes_target_caught_tt: "L’un des hommes [owner.Custom('FR_du_Char_U_Pi')][owner.GetShortUIName] a été surpris sur l’une de mes [trade_routes|El] et a avoué la raison pour laquelle il y avait été envoyé."
