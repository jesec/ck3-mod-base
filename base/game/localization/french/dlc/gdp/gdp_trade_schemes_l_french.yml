 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$ : réussite"
 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U] ne va plus pouvoir transporter autant de marchandises qu’avant. [target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] va se demander d’où vient ce trou dans ses livres de comptes."
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U] ne dispose plus des priorités et des privilèges d’autrefois. [target.Custom('FR_le_Char_U_Pi')|U][target.GetShortUIName] va bien voir que la rentabilité est devenue beaucoup plus compliquée."
 gdp_trade_scheme.0012.desc_discovered: "\n\nL’un de mes hommes a été retrouvé, il est donc possible que l’on remonte jusqu’à moi."
 gdp_trade_scheme.0012.a: "Bonne chance à cet imbécile."
 gdp_trade_scheme.0012.a_discovered: "Le jeu en vaut la chandelle."
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$ : échec"
 gdp_trade_scheme.0013.desc: "Malgré tous nos efforts, les routes commerciales [target.Custom('FR_du_Char_U_Pi')][target.GetShortUIName] se portent toujours aussi bien."
 gdp_trade_scheme.0013.desc_discovered: "\n\nPour couronner le tout, l’un de mes négociants a été surpris en train de manigancer. C’est le déshonneur pour notre nom."
 gdp_trade_scheme.0013.a: "C’est très agaçant"
 gdp_destroyed_republic_opinion: "A détruit ma république"
 gdp_smuggler_opinion: "Contrebandier"
