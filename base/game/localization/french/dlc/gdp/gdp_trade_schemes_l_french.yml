l_french:
 gdp_improve_trade_capacity: "Amélioration de la capacité commerciale"
 gdp_improve_trade_capacity_action: "Améliorer la capacité commerciale"
 gdp_improve_trade_capacity_desc: "J’ai chargé les miens de découvrir des moyens d’améliorer la capacité de mes routes commerciales."
 gdp_improve_trade_capacity_desc_general: "L’$gdp_improve_trade_capacity|l$ est un [trade_scheme|El] dans lequel un [merchant|El] ou un [patrician|El] met sa famille à contribution pour accroître la [Concept('trade_route_capacity', 'capacité')|E] de l’une de ses [trade_routes|El]."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "La [trade_route|El] choisie gagne en [capacity|El] pendant #V 15 ans#!"
 gdp_improve_trade_capacity_invalidated_title: "@scheme_icon! Fin du complot d’$gdp_improve_trade_capacity|l$"
 gdp_improve_trade_competitiveness: "Amélioration de la compétitivité commerciale"
 gdp_improve_trade_competitiveness_action: "Améliorer la compétitivité commerciale"
 gdp_improve_trade_competitiveness_desc: "J’ai chargé les miens de découvrir des moyens de nous assurer que nos routes aient la priorité par rapport à celles de la concurrence."
 gdp_improve_trade_competitiveness_desc_general: "L’$gdp_improve_trade_competitiveness|l$ est un [trade_scheme|El] dans lequel un [merchant|El] ou un [patrician|El] met sa famille à contribution pour accroître la [trade_competitiveness|El] de l’une de ses [trade_routes|El]."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "La [trade_route|El] choisie gagne en [competitiveness|El] pendant #V 15 ans#!"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! Fin du complot d’$gdp_improve_trade_competitiveness|l$"
 gdp_improve_trade_expertise: "Amélioration de l’expertise commerciale"
 gdp_improve_trade_expertise_action: "Améliorer l’expertise commerciale"
 gdp_improve_trade_expertise_desc: "J’ai chargé les miens de découvrir des moyens d’améliorer l’efficacité de nos routes, afin de faire en sorte que nous connaissions les bonnes personnes et que nous apprenions de nos erreurs."
 gdp_improve_trade_expertise_desc_general: "L’$gdp_improve_trade_expertise|l$ est un [trade_scheme|El] dans lequel un [merchant|El] ou un [patrician|El] met sa famille à contribution pour accroître rapidement l’[trade_expertise|El] de l’une de ses [trade_routes|El]."
 GDP_IMPROVE_TRADE_EXPERTISE_SUCCESS_DESC: "La [trade_route|El] choisie gagne plus rapidement en [expertise|El] pendant #V 15 ans#!"
 gdp_improve_trade_expertise_invalidated_title: "@scheme_icon! Fin du complot d’$gdp_improve_trade_expertise|l$"
