 gdp_improve_trade_capacity_decision_success_tt: "Si le [scheme|El] réussit, [selected_item.GetName|l] gagne [GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip] pendant #V 15 ans#!"
