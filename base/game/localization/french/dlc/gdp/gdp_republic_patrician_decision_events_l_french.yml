l_french:
 city_stroll_prefix: "Promenade en ville"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$ : Trouvé n’est pas volé"
 gdp_republic_patrician_decision.1000.desc: "Alors que je tourne au coin de la rue pour m’engager dans une ruelle, je croise [Select_CString(local_character.IsFemale,'une marchande ambulante','un marchand ambulant')] du coin en pleine conversation :\n\n« ... et personne n’est venu les récupérer », dit [Select_CString(local_character.IsFemale,'la femme','l’homme')] en pointant du doigt des caisses de [abandoned_trade_good.GetNameNoTooltip|l] posées par terre.\n\nPersonne ne semble se manifester. Je jette un rapide coup d’œil à la cargaison. C’est une #EMP opportunité#! en or."
 gdp_republic_patrician_decision.1000.a: "Et si on créait la demande... ?"
 gdp_republic_patrician_decision.1000.a.flavor: "Les caisses de [abandoned_trade_good.GetNameNoTooltip|l] sont abîmées, et leur contenu en morceaux."
 gdp_republic_patrician_decision.1000.b: "« Oh oh, mais c’est à moi ! »"
 gdp_republic_patrician_decision.1000.c: "« Ah, les caisses de [abandoned_trade_good.GetNameNoTooltip|l] [liege_scope.Custom('FR_du_Char_Pi')][liege_scope.GetTitledFirstNameNoTooltip] ! Merci infiniment. »"
 gdp_republic_patrician_decision.1000.d: "Ça ne me regarde pas."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$ : Le jardin secret"
 gdp_republic_patrician_decision.1010.desc: "Je découvre une oasis cachée, un véritable bijou à l’état brut, dans un petit jardin niché au milieu des recoins et des ruelles de [city_location.GetTitle.GetNameNoTier]. Les allées ont connu des jours meilleurs et les plantes se font rares, bien qu’elles soient bien entretenues. Une personne très dévouée se cache derrière ce havre de paix.\n\nDes groupes de nobles, mais aussi des marchands, des roturiers et des ouvriers flânent au milieu de cet écrin de verdure, profitant d’un instant de répit.\n\nJe me promène moi aussi, l’esprit un peu plus léger et mes fardeaux un peu moins lourds."
 gdp_republic_patrician_decision.1010.a: "Nous allons en faire le plus beau jardin de [city_location.GetTitle.GetNameNoTierNoTooltip] !"
 gdp_republic_patrician_decision.1010.b: "Tiens, quelle est cette petite plante ?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "Vous trouvez des plantes fascinantes"
 gdp_republic_patrician_decision.1010.b.health_plant: "Vous trouvez des plantes bénéfiques"
 gdp_republic_patrician_decision.1010.c: "Laissez-moi juste... être un peu plus libre..."
 gdp_republic_patrician_decision.1010.c.flavor: "C’est le moment de profiter d’un moment de détente !"
 gdp_republic_patrician_decision.1010.c.success: "Vous n'êtes toujours pas repéré[ROOT.Char.Custom('FR_E')]"
 gdp_republic_patrician_decision.1010.c.failure: "Vous êtes découvert[ROOT.Char.Custom('FR_E')]"
 gdp_republic_patrician_decision.1010.d: "Merveilleux !"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$ : La grande place de [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1020.intro: "Quelles que soient les manœuvres politiques et les complots des nobles et des dirigeants de [city_location.GetCounty.GetTitle.GetName], la vie suit son cours sur la grande place."
 gdp_republic_patrician_decision.1020.intro.01: "Depuis les cuisines, une délicieuse odeur [ROOT.Char.Custom('GetLocalStreetFood')] m’emplit les narines."
 gdp_republic_patrician_decision.1020.intro.02: "Un âne récalcitrant brait sur son propriétaire, qui tente tant bien que mal de l’arroser pour enlever la boue séchée sur son corps."
 gdp_republic_patrician_decision.1020.intro.03: "Plusieurs citoyens âgés se promènent en faisant des bruits de désapprobation devant le prix du pain et l’insolence des jeunes d’aujourd’hui."
 gdp_republic_patrician_decision.1020.intro.04: "Des [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l] parcourent le ciel au-dessus des étals de nourriture."
 gdp_republic_patrician_decision.1020.intro.rain: "Ce matin, après la violente averse d’hier soir."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nAu loin, je remarque un groupe de soldats qui ne sont pas de [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip], perdus et inquiets. De ce que j’entends de leurs discussions parfois houleuses, ils semblent aussi être à la recherche d’un nouveau mécène."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nAu bord de la place, une silhouette imposante regarde les passants d’un air maussade. Tandis que je m’approche d[local_character.Custom('FR_EluiElle')], je l’entends se plaindre de la fin d’un contrat avec la prestigieuse Maison [liege_scope.GetHouse.GetBaseName]. Un[local_character.Custom('FR_E')] négociant[local_character.Custom('FR_E')] réputé[local_character.Custom('FR_E')] dont la chance aurait tourné ?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nAu milieu de la place, debout sur une pile de caisses, un médecin vient de finir son exposé sur les fluides corporels et la manière d’équilibrer plus facilement sa bile noire. Je hoche timidement la tête.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nDans un coin à l’ombre de la place, je remarque [ROOT.Char.Custom('RandomMediumObject')], qui conviendrait parfaitement à la réalisation de mon projet de [scheme_to_boost.GetName|l]...$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nEn parcourant la place des yeux, je remarque un objet qui reflète la lumière. Je m’approche pour scruter le sol et j’aperçois un petit bijou presque entièrement recouvert de poussière.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nDe l’autre côté de la place, de malheureux paysans sont escortés loin d’ici. Un jeune enfant laisse échapper un cri déchirant pour exprimer sa faim et sa peur, tandis que les passants font de leur mieux pour ignorer ce cortège de misère."
 gdp_republic_patrician_decision.1020.outro: "\n\nMon serviteur se racle doucement la gorge pour me signaler que le moment est venu de rentrer et me rappeler à mes responsabilités."
 gdp_republic_patrician_decision.1020.a: "Je devrais pouvoir nourrir une bouche ou deux."
 gdp_republic_patrician_decision.1020.b: "Ces soldats pourraient s’avérer utiles..."
 gdp_republic_patrician_decision.1020.c: "Hmm, je ne dirais pas non à un[local_character.Custom('FR_E')] autre négociant[local_character.Custom('FR_E')]..."
 gdp_republic_patrician_decision.1020.d: "Ce médecin devrait travailler pour moi."
 gdp_republic_patrician_decision.1020.e: "Le travail d’abord, la promenade après."
 gdp_republic_patrician_decision.1020.f: "Je vais nettoyer ça..."
 gdp_republic_patrician_decision.1020.g: "Il y a toujours des gens à rencontrer sur une grande place !"
 gdp_republic_patrician_decision.1020.g.alternate: "Une journée classique à [GetPlayer.GetCapitalLocation.GetNameNoTooltip]."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$ : Le port de [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1030.desc: "L’odeur du poisson et des algues en décomposition est de plus en plus insoutenable à mesure que nous approchons du port. Des pêcheurs en famille, avec femmes et enfants, mais aussi accompagnés d'une ribambelle de chats errants, traînent sur place, vaquant à leurs occupations quotidiennes.\n\nTandis que nous passons près d’eux, j’entends deux pêcheurs se plaindre : « ... c’est bien d’avoir de nouveaux hameçons, mais ce serait encore mieux avec de nouveaux filets... » Ils se taisent lorsqu’ils remarquent ma présence."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nJe hoche la tête et j’acquiesce."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nJe hoche la tête et j’acquiesce, tandis qu’un chat errant se blottit contre ma jambe en ronronnant de plaisir."
 gdp_republic_patrician_decision.1030.a: "« Je pourrais me laisser convaincre de leur fournir de nouveaux filets... »"
 gdp_republic_patrician_decision.1030.a.flavor: "Ça pourrait même être un joli coup de #EMP filet#! !"
 gdp_republic_patrician_decision.1030.b: "« Vous me faites votre poisson à combien si je vous l’achète en gros ? »"
 gdp_republic_patrician_decision.1030.c: "Oh, un chat !"
 gdp_republic_patrician_decision.1030.d: "« Belle journée, n’est-ce pas ? »"
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$ : [ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "Au cours de ma promenade, je tombe sur le dernier projet [liege_scope.Custom('FR_du_Char_Pi')][liege_scope.GetTitledFirstName] sur la grande place : [ROOT.Char.Custom('GetGreatProjectDescription')].\n\n[Select_CString(local_character.IsFemale,'La contremaîtresse','Le contremaître')] semble toutefois un peu perplexe, et ne cesse de regarder la liste des noms et des sceaux en se grattant la tête : « C’est une... contribution généreuse, mais... il manque une partie du sceau... de qui peut-il bien s’agir... »\n\nUne contribution anonyme au projet ? #EMP C’est intrigant.#!"
 gdp_republic_patrician_decision.1040.a: "« C’est ma contribution ! Nous avons réussi ! »"
 gdp_republic_patrician_decision.1040.a.success: "Vous vous attribuez le mérite de cette contribution"
 gdp_republic_patrician_decision.1040.a.failure: "Vous êtes démasqué[ROOT.Char.Custom('FR_E')]"
 gdp_republic_patrician_decision.1040.b: "« C’est la contribution [liege_scope.Custom('FR_du_Char_Pi')][liege_scope.GetTitledFirstNameNoTooltip] ! Excellent ! »"
 gdp_republic_patrician_decision.1040.c: "Ça ne me regarde pas."
 gdp_republic_patrician_decision.1040.c.flavor: "Je suis sûr[ROOT.Char.Custom('FR_E')] qu'ils se débrouilleront."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] gagne [contribution_to_fund.GetName|l]"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$ : Faux départ"
 gdp_republic_patrician_decision.1100.desc: "D’un geste, je tapote ma bourse avant de sortir du bureau pour aller flâner dans les charmantes rues de [city_location.GetTitle.GetNameNoTier].\n\nJ’entends un léger #EMP boum#! au moment où mon front heurte la porte. Cette fichue porte #EMP refuse de bouger#! ! Elle aurait gonflé ?\n\nEn regardant autour de moi, je m’arrête sur la fenêtre... mais en cas de chute, je risquerais de me casser un os ou deux.\n\nJe réfléchis."
 gdp_republic_patrician_decision.1100.a: "« Il y a quelqu’un ? Gardes ? SERVITEURS ?! »"
 gdp_republic_patrician_decision.1100.a.flavor: "Non, la pièce n’est pas en train de rétrécir. Enfin... je crois ?"
 gdp_republic_patrician_decision.1100.b: "Plein de rembourrage sous la fenêtre !"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "Mon corps a trop envie de faire du sport !"
 gdp_republic_patrician_decision.1100.d: "Dans ce cas, je n’ai plus qu’à... retourner à mon bureau."
 ##CUSTOM LOC
 custom_gp_expand_great_plaza_name: "Plus grande place"
 custom_gp_expand_great_plaza: "l’agrandissement de la place elle-même"
 custom_gp_loggia: "la construction de la loggia commune, qui servira d’abri aux marchands et aux notaires"
 custom_gp_improved_loggia: "l’amélioration de la loggia commune, qui offrira un espace de travail et davantage de place"
 custom_gp_statute_hall: "la création de la chambre des statuts, chargée de faire respecter la loi dans la ville"
 custom_gp_improved_statute_hall: "l’agrandissement de la chambre des statuts, qui offrira davantage d’espace et de confort aux employés"
 custom_gp_council_chamber: "la construction de la grande salle du Conseil, permettant ainsi le bon fonctionnement de l’administration de la ville"
 custom_gp_improved_council_chamber: "l’amélioration de la grande salle du Conseil, avec plus de bancs pour un confort optimal"
 custom_gp_debt_office: "la création d’un bureau dédié à la dette publique, chargé de la gestion de la trésorerie de la ville"
 custom_gp_improved_debt_office: "l’augmentation des capacités du bureau dédié à la dette publique, afin d’optimiser la gestion de la trésorerie de la ville"
 custom_gp_civic_hospital: "la création de l’hôpital public, où les citoyens pourront être soignés en cas de besoin"
 custom_gp_improved_civic_hospital: "l’amélioration et l’agrandissement de l’hôpital public, veillant ainsi sur la santé et la productivité des citoyens"
 custom_gp_weigh_house: "la création de la maison de pesée publique, afin de garantir l’intégrité des balances"
 custom_gp_improved_weigh_house: "l’amélioration de la maison de pesée publique, renforçant ainsi la sécurité dans l’intérêt de la république"
 custom_gp_clock_tower: "la construction de la tour horloge municipale, permettant à chacun de savoir l’heure à tout moment"
 custom_gp_improved_clock_tower: "l’amélioration de la tour horloge municipale, qui brillera de toute sa splendeur"
 custom_gp_civic_ward: "la création d’un service municipal chargé de suivre les futurs chantiers de la ville"
 custom_gp_improved_civic_ward: "l’agrandissement du service municipal, afin d’augmenter sa capacité d’accueil et le nombre de fonctionnaires chargés de traiter les demandes"
 custom_gp_league_chapter_house: "la création de la salle capitulaire de la ligue, afin d’organiser les assemblées et de gérer les différentes tâches"
 custom_gp_improved_league_chapter_house: "l’agrandissement de la salle capitulaire de la ligue, permettant ainsi des réunions plus confortables au nom de la diplomatie"
 custom_gp_podesta_residence: "la construction de la résidence du podestat, qui hébergera le chef des fonctionnaires locaux"
 custom_gp_improved_podesta_residence: "l’amélioration de la résidence du podestat, afin de récompenser et d’attirer le chef des fonctionnaires locaux"
 custom_gp_fountain: "l’installation de grandes fontaines, pour le plus grand plaisir des citoyens et sublimer la ville"
 custom_gp_improved_fountain: "l’amélioration des grandes fontaines, avec l’ajout de grands bassins et d’un aqueduc"
