 gdp_trader_learning_from_locals_scheme_success_title: "Négociant : a appris des habitants"
 gdp_trader_learning_from_locals_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a appris des habitants à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_studying_local_crafts_scheme: "Formation en artisanat local"
 gdp_trader_studying_local_crafts_scheme_desc: "Votre négociant va tenter d’étudier les ateliers locaux pour découvrir en détail les produits qui y sont fabriqués.\n\n#weak En cas de réussite :\n#!Votre [trader|El] gagne une [lifestyle_experience|El] accrue pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
