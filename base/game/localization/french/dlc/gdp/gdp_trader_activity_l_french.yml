l_french:
 gdp_trader_work_scheme_failure_toast_title: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a du mal à s’imposer sur le marché."
 # Trader scheme outcome modifier names and descriptions
 gdp_trader_negotiate_deals_modifier: "Accords favorables"
 gdp_trader_negotiate_deals_modifier_desc: "Des accords commerciaux favorables ont été négociés sur ce marché, ce qui renforce la position concurrentielle de la compagnie."
 gdp_trader_capacity_boost_modifier: "Capacité de la route améliorée"
 gdp_trader_capacity_boost_modifier_desc: "La logistique des caravanes commerciales a été améliorée, ce qui permet d’augmenter la capacité de cette route."
 gdp_trader_lobby_advantages_modifier: "Avantages obtenus"
 gdp_trader_lobby_advantages_modifier_desc: "La compagnie s’est assurée un traitement préférentiel de la part du propriétaire du marché, ce qui renforce sa compétitivité sur ce marché."
 gdp_trader_undermine_competitor_modifier: "Position affaiblie"
 gdp_trader_undermine_competitor_modifier_desc: "La réputation et la position de la compagnie sur ce marché ont été compromises."
 gdp_trader_safe_passage_modifier: "Passage en toute sécurité"
 gdp_trader_safe_passage_modifier_desc: "Des dispositions ont été prises pour garantir que le trajet sur cet itinéraire soit rapide et sûr."
 gdp_trader_exploring_new_markets_modifier: "Marché prospecté"
 gdp_trader_exploring_new_markets_modifier_desc: "Ce marché a été analysé, révélant des droits d’achats avantageux."
 gdp_trader_studying_local_crafts_modifier: "Informations sur l’artisanat"
 gdp_trader_studying_local_crafts_modifier_desc: "L’étude des ateliers locaux a permis de peaufiner l’art de ce marchand, accroissant le gain d’expérience de mode de vie."
 gdp_trader_undivided_focus_modifier: "Concentration totale"
 gdp_trader_undivided_focus_modifier_desc: "Ce [trader|El] peut se concentrer sur son propre travail.\nBonus de #P 15%#! de [scheme_success_chance|El] pour les [schemes|El] de [trader|El]."
 # Merchant trait success chance bonus descs
 gdp_trader_merchant_trait_journeyman_bonus: "Négociant chevronné"
 gdp_trader_merchant_trait_expert_bonus: "Négociant expérimenté"
 gdp_trader_merchant_trait_master_bonus: "Maître négociant"
 gdp_trader_house_member_success_bonus: "Membre de la [house|E]"
 gdp_trader_scheme_shared_rules_tt: "\nUn membre de la [house|E] a #P +10%#! de [scheme_success_chance|El].\n#weak En cas d’échec :\n#!Le [trader|El] reçoit #N 10#! de [stress|El]"
 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "Négociation commerciale"
 gdp_trader_negotiate_deals_scheme_desc: "Votre négociant va tenter d’obtenir des conditions avantageuses avec les commerçants et fonctionnaires locaux afin de décrocher de meilleurs prix d’achat et de vente sur ce marché.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité obtient un bonus de [trade_competitiveness|El][competitiveness_i] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_negotiate_deals_scheme|l$, un [trader|El] va tenter d’obtenir des conditions avantageuses avec les commerçants et fonctionnaires locaux afin de décrocher de meilleurs prix d’achat et de vente.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité obtient un bonus de [trade_competitiveness|El][competitiveness_i] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_success_title: "Négociant : transactions négociées"
 gdp_trader_negotiate_deals_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a réussi à obtenir une nouvelle part des marchés de [trader.GetCurrentLocation.GetName]."
 gdp_trader_finding_a_deal_scheme: "Conclusion d’accords"
 gdp_trader_finding_a_deal_scheme_desc: "Votre négociant va tenter de trouver des occasions de faire du profit et de transformer les maigres marges en sommes rondelettes.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[gold|El][gold_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_finding_a_deal_scheme|l$, un [trader|El] cherche des occasions de faire du profit et de transformer les maigres marges en sommes rondelettes.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[gold|El][gold_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_success_title: "Négociant : a conclu un accord"
 gdp_trader_finding_a_deal_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a conclu une affaire à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_securing_surplus_scheme: "Protection de l’excédent"
 gdp_trader_securing_surplus_scheme_desc: "Votre négociant va tenter d’identifier les excédents de marchandises sur ce marché et assurer leur transport tout au long de l’itinéraire, ce qui augmente temporairement la capacité.\n\n#weak En cas de réussite :\n#!Votre [company|El] obtient une [trade_route_capacity_short|El] sur cette [trade_route|El] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_securing_surplus_scheme|l$, un [trader|El] identifie les excédents de marchandises et assure leur transport tout au long de l’itinéraire, ce qui augmente temporairement la capacité.\n\n#weak En cas de réussite :\n#!La [company|El] obtient une [trade_route_capacity_short|El] sur cette [trade_route|El] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_success_title: "Négociant : excédent protégé"
 gdp_trader_securing_surplus_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a fait pression sur les artisans locaux de [trader.GetCurrentLocation.GetName] et a obtenu des marchandises supplémentaires."
 gdp_trader_appraising_market_scheme: "Évaluation des marchés"
 gdp_trader_appraising_market_scheme_desc: "Votre négociant va tenter d’étudier les conditions du marché local afin d’identifier les meilleures opportunités commerciales.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité obtient un bonus de [trade_competitiveness|El][competitiveness_i] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_desc_general: "Dans un [scheme|El] d’$gdp_trader_appraising_market_scheme|l$, un [trader|El] étudie les conditions du marché local afin d’identifier les meilleures opportunités commerciales.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité obtient un bonus de [trade_competitiveness|El][competitiveness_i] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_success_title: "Négociant : marchés évalués"
 gdp_trader_appraising_market_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a découvert de nouvelles perspectives à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_organizing_caravan_scheme: "Organisation des caravanes"
 gdp_trader_organizing_caravan_scheme_desc: "Votre négociant va tenter d’améliorer l’efficacité et l’organisation de la caravane commerciale, ce qui permet de transporter davantage de marchandises tout au long de la route.\n\n#weak En cas de réussite :\n#!Votre [company|El] gagne un bonus en [trade_route_capacity_short|El] sur cette [trade_route|El] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_desc_general: "Dans un [scheme|El] d’$gdp_trader_organizing_caravan_scheme|l$, un [trader|El] améliore l’efficacité et l’organisation de la caravane commerciale, pour pouvoir transporter davantage de marchandises tout au long de la route.\n\n#weak En cas de réussite :\n#!La [company|El] gagne un bonus en [trade_route_capacity_short|El] sur cette [trade_route|El] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_success_title: "Négociant : caravanes organisées"
 gdp_trader_organizing_caravan_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a trouvé des matériaux d’emballage plus légers."
 gdp_trader_exploring_new_markets_scheme: "Expansion des marchés"
 gdp_trader_exploring_new_markets_scheme_desc: "Votre négociant va tenter d’explorer un marché que la compagnie n’a pas encore rejoint, afin de jeter les bases d’une activité commerciale future.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité réduit ses prix d’achat pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_desc_general: "Dans un [scheme|El] d’$gdp_trader_exploring_new_markets_scheme|l$, un [trader|El] explore un marché que la compagnie n’a pas encore rejoint, afin de jeter les bases d’une activité commerciale future.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité réduit ses prix d’achat pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_success_title: "Négociant : marchés étendus"
 gdp_trader_exploring_new_markets_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a trouvé des vendeurs bon marché à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_identifying_rare_goods_scheme: "Identification des biens rares"
 gdp_trader_identifying_rare_goods_scheme_desc: "Votre négociant va tenter de rechercher des produits rares et de luxe sur ce marché, dans l’espoir d’en tirer un bénéfice considérable.\n\n#weak En cas de réussite :\n#!Vous gagnez une importante quantité d’[gold|El][gold_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_desc_general: "Dans un [scheme|El] d’$gdp_trader_identifying_rare_goods_scheme|l$, un [trader|El] recherche des produits rares et de luxe sur le marché, dans l’espoir d’en tirer un bénéfice considérable.\n\n#weak En cas de réussite :\n#!Vous gagnez une importante quantité d’[gold|El][gold_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_success_title: "Négociant : biens rares identifiés"
 gdp_trader_identifying_rare_goods_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a trouvé des gemmes précieuses à [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Diplomacy schemes
 gdp_trader_negotiating_with_ruler_scheme: "Négociation avec des nobles"
 gdp_trader_negotiating_with_ruler_scheme_desc: "Votre négociant va tenter d’établir des liens sociaux durables avec les propriétaires du marché.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[opinion|El][opinion_i] avec le dirigeant local pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_negotiating_with_ruler_scheme|l$, un [trader|El] cherche à établir des liens sociaux durables avec les propriétaires du marché.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[opinion|El][opinion_i] avec le dirigeant local pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_success_title: "Négociant : négociation réussie avec la noblesse"
 gdp_trader_negotiating_with_ruler_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a fait une excellente impression au dirigeant de [trader.GetCurrentLocation.GetName]."
 gdp_trader_building_connections_scheme: "Établissement de relations"
 gdp_trader_building_connections_scheme_desc: "Votre négociant va tenter d’établir des liens sociaux durables avec les fonctionnaires locaux pour accéder aux réserves du royaume.\n\n#weak En cas de réussite :\n#!Votre [company|El] gagne un bonus en [trade_route_capacity_short|El] sur cette [trade_route|El] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_desc_general: "Dans un [scheme|El] d’$gdp_trader_building_connections_scheme|l$, un [trader|El] établit des liens sociaux durables avec les fonctionnaires locaux pour accéder aux réserves du royaume.\n\n#weak En cas de réussite :\n#!La [company|El] gagne un bonus en [trade_route_capacity_short|El] sur cette [trade_route|El] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_success_title: "Négociant : relations établies"
 gdp_trader_building_connections_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a convaincu les fonctionnaires de [trader.GetCurrentLocation.GetNameNoTooltip] de laisser passer davantage de marchandises."
 gdp_trader_lobbying_advantages_scheme: "Recherche d’avantages"
 gdp_trader_lobbying_advantages_scheme_desc: "Votre négociant va tenter de faire pression sur le propriétaire du marché pour obtenir un traitement préférentiel, ce qui renforce la position concurrentielle de la compagnie.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité gagne un bonus de [trade_competitiveness|El][competitiveness_i] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_lobbying_advantages_scheme|l$, un [trader|El] fait pression sur le propriétaire du marché pour obtenir un traitement préférentiel, ce qui renforce la position concurrentielle de la compagnie.\n\n#weak En cas de réussite :\n#!Le [trade_market|El] visité gagne un bonus de [trade_competitiveness|El][competitiveness_i] pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_success_title: "Négociant : avantages obtenus"
 gdp_trader_lobbying_advantages_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a obtenu un traitement de faveur à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_building_reputation_scheme: "Établissement d’une réputation"
 gdp_trader_building_reputation_scheme_desc: "Votre négociant va tenter de renforcer la visibilité et la réputation de la compagnie dans cette région.\n\n#weak En cas de réussite :\n#!Vous gagnez du [prestige|El][prestige_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_desc_general: "Dans un [scheme|El] d’$gdp_trader_building_reputation_scheme|l$, un [trader|El] renforce la visibilité et la réputation de la compagnie dans la région.\n\n#weak En cas de réussite :\n#!Vous gagnez du [prestige|El][prestige_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_success_title: "Négociant : réputation forgée"
 gdp_trader_building_reputation_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a honoré le nom de la compagnie à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_championing_patron_scheme: "Défense des intérêts du mécène"
 gdp_trader_championing_patron_scheme_desc: "Votre négociant va tenter de défendre les intérêts commerciaux du [merchant_patron|El] sur ce marché.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[opinion|El][opinion_i] avec votre [merchant_patron|El] et une petite quantité de [prestige|El][prestige_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_championing_patron_scheme|l$, un [trader|El] défend les intérêts commerciaux du [merchant_patron|El] sur le marché.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[opinion|El][opinion_i] avec votre [merchant_patron|El] et une petite quantité de [prestige|El][prestige_i]$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_success_title: "Négociant : intérêts du mécène défendus"
 gdp_trader_championing_patron_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a étendu l’influence [route_owner.GetSuzerain.Custom('FR_du_Char_U_Pi')][route_owner.GetSuzerain.GetShortUIName] à [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_entertaining_merchants_scheme: "Divertissement des marchands"
 gdp_trader_entertaining_merchants_scheme_desc: "Votre négociant va tenter d’accueillir des représentants d’une autre compagnie marchande, afin d’atténuer la rivalité avec un [merchant|El] concurrent.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[opinion|El][opinion_i] avec un [merchant|El] rival pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_entertaining_merchants_scheme|l$, un [trader|El] accueille des représentants d’une autre compagnie marchande, afin d’atténuer la rivalité avec un [merchant|El] concurrent.\n\n#weak En cas de réussite :\n#!Vous gagnez de l’[opinion|El][opinion_i] avec un [merchant|El] rival pendant #V 5 ans#!$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_success_title: "Négociant : marchands divertis"
 gdp_trader_entertaining_merchants_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a réussi à s’attirer les bonnes grâces d’un [merchant|El] rival de [trader.GetCurrentLocation.GetNameNoTooltip]."
 gdp_trader_hiring_local_talent_scheme: "Recrutement de talents locaux"
 gdp_trader_hiring_local_talent_scheme_desc: "Votre négociant va tenter de trouver des individus compétents afin de rejoindre la compagnie en tant qu’[associates|El].\n\n#weak En cas de réussite :\n#!Votre [company|El] recrute un [associate|El] local$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_desc_general: "Dans un [scheme|El] de $gdp_trader_hiring_local_talent_scheme|l$, un [trader|El] cherche des individus compétents afin de rejoindre la compagnie en tant qu’[associates|El].\n\n#weak En cas de réussite :\n#!La [company|El] recrute un [associate|El] local$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_hiring_local_talent_scheme_success_title: "Négociant : talents locaux recrutés"
 gdp_trader_hiring_local_talent_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a engagé un individu de talent à [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Learning schemes
 gdp_trader_learning_from_locals_scheme: "Apprentissage auprès des habitants"
 gdp_trader_learning_from_locals_scheme_desc: "Votre négociant va tenter de s’immerger dans la culture commerciale locale et d’acquérir des connaissances sur les produits de ce marché.\n\n#weak En cas de réussite :\n#!Votre [company|El] gagne de l’[trade_expertise|El]$gdp_trader_scheme_shared_rules_tt$"
