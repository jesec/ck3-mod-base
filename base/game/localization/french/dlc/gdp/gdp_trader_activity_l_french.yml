 gdp_trader_appraising_goods_scheme_success_title: "Négociant : biens évalués"
 gdp_trader_appraising_goods_scheme_success_desc: "[trader.Custom('FR_le_Char_U_Pi')|U][trader.GetShortUIName] a gagné un avantage pour la négociation à [trader.GetCurrentLocation.GetNameNoTooltip]."
 # Intrigue schemes
