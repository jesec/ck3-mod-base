l_french:
 gdp_carnival_prosperity_modifier: "Prospérité en raison du carnaval"
 gdp_carnival_prosperity_modifier_desc: "La province connaît une période de prospérité après un carnaval réussi"
 gdp_civic_commitment_modifier: "Engagement citoyen"
 gdp_civic_commitment_modifier_desc: "Ce personnage s’est consacré à l’amélioration des conditions de vie dans sa république."
 gdp_down_to_earth_ruler_modifier: "Dirigeant qui a les pieds sur terre"
 gdp_down_to_earth_ruler_modifier_desc: "Les citoyens considèrent ce personnage comme accessible et juste."
 gdp_self_aggrandizing_decorations_modifier: "Décorations d’auto-glorification"
 gdp_self_aggrandizing_decorations_modifier_desc: "Ce personnage a érigé des monuments à sa propre gloire."
 gdp_masked_face_modifier: "Visage masqué"
 gdp_masked_face_modifier_desc: "Ce personnage cache son visage derrière un magnifique masque pendant toute la durée du carnaval."
 gdp_masked_vigile_modifier: "Veillée masquée"
 gdp_masked_vigile_modifier_desc: "Ce personnage porte un masque pour se faufiler dans l’ombre pendant toute la durée du carnaval."
 gdp_order_and_business_modifier: "Ordre et affaires"
 gdp_order_and_business_modifier_desc: "Ce personnage met l’accent sur les affaires et l’ordre."
 gdp_echos_of_carnival_modifier: "Esprit du carnaval"
 gdp_echos_of_carnival_modifier_desc: "Ce personnage incarne l’esprit du carnaval."
 gdp_carnival_basic_celebration_modifier: "Public diverti"
 gdp_carnival_basic_celebration_modifier_desc: "Le public a été diverti par un carnaval."
 gdp_carnival_extensive_celebration_modifier: "Public inspiré"
 gdp_carnival_extensive_celebration_modifier_desc: "Un carnaval a incité la population à respecter le devoir civique."
 gdp_carnival_extravagant_celebration_modifier: "Public respectueux"
 gdp_carnival_extravagant_celebration_modifier_desc: "Le public éprouve une profonde admiration pour sa république."
 gdp_masked_paranoia_modifier: "Paranoïa masquée"
 gdp_masked_paranoia_modifier_desc: "Ce personnage a échappé à des assassins, mais ceux-ci sont toujours en liberté."
 gdp_terrifying_procession_modifier: "Cortège terrifiant"
 gdp_terrifying_procession_modifier_desc: "Ce personnage a organisé un défilé effrayant pour rappeler à tout le monde qu’il ne faut pas se frotter à lui."
 gdp_pious_procession_modifier: "Pieuse procession"
 gdp_pious_procession_modifier_desc: "Ce personnage a organisé une procession pour rappeler à tout le monde sa piété."
