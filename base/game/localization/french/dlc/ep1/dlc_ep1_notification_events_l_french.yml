 ep1_notifications.0011.t: "Langue de Cour changée"
 ep1_notifications.0011.desc: "Notre [court_language|El] est désormais la langue [target_character.GetCourtLanguage.GetName|l]. Que notre Cour devienne toujours plus grande !"
 ep1_notifications.0012.t: "Langue de Cour abandonnée"
 ep1_notifications.0012.desc: "La Cour [target_character.Custom('FR_du_Char_U_Pi')][target_character.GetShortUIName] est passée de la [Concept('court_language', 'langue')|E] [observer.GetCourtLanguage.GetName|l] à la langue [target_character.GetCourtLanguage.GetName|l]. Puisse la folie de cette décision être révélée !"
 ep1_notifications.0013.t: "Langue de Cour adoptée"
 ep1_notifications.0013.desc: "La Cour [target_character.Custom('FR_du_Char_U_Pi')][target_character.GetShortUIName] parle désormais la [Concept('court_language', 'langue')|E] [target_character.GetCourtLanguage.GetName|l]. Une décision très sage !"
