l_french:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ sous une vague de chaleur"
 gdp_travel_events.1000.desc: "Telle une mer de sable infinie, les dunes de [ROOT.Char.GetCurrentLocation.GetName] s’étendent à perte de vue. La chaleur du soleil dessine sur leur surface un motif hypnotisant qui ne cesse de changer. Trempés de sueur et sans ombre en vue, nous nous arrêtons pour nous reposer. M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetFirstName] se tourne vers moi, les yeux écarquillés.\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], ne craignez pas la chaleur, la nuit dernière, j’ai été béni par [entourage_member_one.GetFaith.HighGodName], la vision d’une oasis, non loin d’ici, m’est apparue. »"
 gdp_travel_events.1000.a: "En fait, ça devrait être par là !"
 gdp_travel_events.1000.b: "Nous n’avons plus d’autre choix, essayons."
 gdp_travel_events.1000.b.success: "Gloire [entourage_member_one.GetFaith.HighGodName2], l’oasis existe bel et bien"
 gdp_travel_events.1000.b.failure: "Ce n’était qu’un mirage"
 gdp_travel_events.1000.c: "Je ne me fierai à aucune vision."
 low_caravaneer_experience_reason_tooltip: "Requiert #V 100#! d’[Concept('trait_level_track_xp', 'expérience')|El] de $trait_track_caravaneer|l$ ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])"
 gdp_travel_events.1010.t: "Voyageurs égarés"
 gdp_travel_events.1010.desc: "Sur la route menant à [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], notre caravane s’apprête à établir son campement. Alors que nous nous apprêtons à nous coucher pour la nuit, une voix douce se fait entendre derrière nous.\n\n« Pardonnez-moi, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ma famille et moi sommes des voyageurs qui avons été séparés de notre caravane. Nous n’avons pas grand-chose à offrir, mais je donnerais tout pour que [Select_CString(traveler_child.IsFemale,'ma fille','mon fils')] soit en sécurité cette nuit. »"
 gdp_travel_events.1010.a: "Gardez votre argent. Venez avec nous."
 gdp_travel_events.1010.b: "Nous pouvons vous accueillir... moyennant une petite somme."
 gdp_travel_events.1010.c: "Vous donneriez tout, dites-vous..."
 gdp_travel_events.1010.d: "Nous avons suffisamment de bouches à nourrir."
 gdp_travel_events.1020.t: "Des informations pendant le trajet"
 gdp_travel_events.1020.desc.intro: "Je ressens douloureusement dans les fesses le trajet parcouru depuis [journey_start.GetName], tandis que [ROOT.Char.Custom('GetDonkeyDromedary')] sur lequel je suis trotte à travers [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]. M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('associate'))] [associate.GetFirstName] ne semble pas affecté[associate.Custom('FR_E')] par cette excursion alors qu’[associate.Custom('FR_IlElle')] s’approche de moi à cheval, tout [Select_CString(associate.IsFemale,'excitée','excité')], pour me dire quelque chose.\n\n"
 gdp_travel_events.1020.desc.caravaneer: "« Une petite anecdote, [ROOT.Char.Custom('FormOfAddressForLiege')] : j’ai récemment discuté avec un maître caravanier originaire de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]. Il m’a parlé de cet extraordinaire instrument de navigation... »"
 gdp_travel_events.1020.desc.artisan: "« [ROOT.Char.Custom('FormOfAddressForLiege')|U], saviez-vous qu’on peut obtenir un merveilleux colorant textile à partir d’[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] ? Si vous prenez les pétales et que vous les écrasez... »"
 gdp_travel_events.1020.desc.creditor: "« C’est intéressant, [ROOT.Char.Custom('FormOfAddressForLiege')|U] : dans certains endroits, le pillage est autorisé si la victime a des dettes envers vous. Ça me rappelle l’époque où mes cousins et moi... »"
 gdp_travel_events.1020.desc.war_profiteer: "« Voici une anecdote intéressante pour vous, [ROOT.Char.Custom('FormOfAddressForLiege')] : une grande bataille s’est autrefois déroulée dans [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] devant nous. C’est ici qu’un épéiste légendaire a trouvé la mort, et l’on raconte qu’il a massacré ses ennemis comme une bête... »"
 gdp_travel_events.1020.a: "C’est fascinant, racontez-m’en davantage, s’il vous plaît."
 gdp_travel_events.1020.b: "Parlons plutôt [ROOT.Char.Custom('my_subject_of_interest')]."
 gdp_travel_events.1020.c: "Je préfère chevaucher en silence."
 gdp_travel_events.1020.b.success: "Vous changez de sujet"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip] n’a aucune envie de vous écouter"
 gdp_travel_events.1030.t: "Murmures malveillants"
 gdp_travel_events.1030.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('ambitious_associate'))] [ambitious_associate.GetFirstName] s’approche rapidement de moi et jette un coup d’œil autour d[ambitious_associate.Custom('FR_EluiElle')] pour voir s’il y a des témoins. [ambitious_associate.Custom('FR_IlElle')|U] se rapproche et me chuchote :\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], j’ai entendu des choses inquiétantes au sujet de votre partenaire [current_partner.GetFirstName]. On raconte dans la compagnie qu’[ambitious_associate.Custom('FR_IlElle')] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]. Si c’est vrai, il faut [ambitious_associate.Custom('FR_LeLa')] traduire en justice !\n\n... Et peut-être serait-il également approprié d’offrir une récompense à la personne qui vous a rapporté cette terrible nouvelle ? »"
 gdp_travel_events.1030.a: "Je dois connaître la vérité !"
 gdp_travel_events.1030.a.unity_loss.desc: "Découverte de la vraie nature de votre partenaire"
 gdp_travel_events.1030.b: "Je ne veux pas spéculer."
 gdp_travel_events.1030.b.unity_gain.desc: "Refus de vous laisser influencer par les rumeurs concernant votre partenaire"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ puits non entretenu"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName] regarde dans un vieux puits et plisse le nez.\n\nLe puits est resté à l’abandon trop longtemps. La végétation a envahi ses pierres, son seau est à moitié rouillé, et ses eaux dégagent une telle odeur nauséabonde que même un homme assoiffé y réfléchirait à deux fois avant d’y boire.\n\nMalheureusement, nos outres d’eau sont déjà presque vides, et la soif est insupportable."
 gdp_travel_events.1040.a: "Ce n’est pas un peu de crasse qui va me tuer !"
 gdp_travel_events.1040.b: "Je connais un moyen de purifier l’eau."
 gdp_travel_events.1040.c: "Nous devons rationner l’eau qu’il nous reste."
 gdp_travel_events.1040.d: "La route sera longue, et nous aurons soif."
 gdp_travel_events.1040.e: "Une petite gorgée, peut-être..."
 gdp_travel_events.1040.e.critical_failure.tt: "Votre maladie empire."
 gdp_travel_events.1040.e.success: "L’eau est potable."
 gdp_travel_events.1040.e.success.desc: "Vous buvez l’eau du puits, ce qui vous rafraîchit."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ arbres tombés"
 gdp_travel_events.1050.desc: "Une tempête a balayé [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], allant jusqu’à déraciner des arbres qui bloquent désormais la route. Des ouvriers du coin débitent les débris, mais il faudra un certain temps avant que nous puissions passer.\n\nEn dehors de cette obstruction, nous pouvons traverser [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')], mais d’autres arbres pourraient tomber, ce qui rend ce détour dangereux."
 gdp_travel_events.1050.x: "Mon destrier [ROOT.Char.Custom('WarhorseStoryName')] nous débarrassera de ces débris !"
 gdp_travel_events.1050.a: "Ça ne sert à rien de rester les bras croisés."
 gdp_travel_events.1050.b: "Nous pourrions apprendre de leurs méthodes."
 gdp_travel_events.1050.c: "Trouvons un moyen de passer quand même."
 gdp_travel_events.1050.d: "Nous attendrons que les ouvriers aient terminé."
 gdp_travel_events.1050.c.success: "Vous vous frayez un chemin entre les arbres tombés."
 gdp_travel_events.1050.c.failure: "Vous vous blessez dans la nature."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ des rats dans la cale"
 gdp_travel_events.1060.desc: "La cale du navire est truffée de rats qui dévorent avidement nos provisions. Certains déplorent un mauvais stockage, entre couvercles mal fermés et sacs abîmés. D’autres pointent du doigt l’impressionnante invasion dont nous sommes victimes.\n\nQuelle qu’en soit la raison, nous sommes en train de perdre cette bataille, et nous devons agir rapidement avant que ces sales rats ne dévorent tout ce qu’il nous reste."
 gdp_travel_events.1060.x: "Mon chat [ROOT.Char.Custom('CatStoryName')] va leur régler leur compte."
 gdp_travel_events.1060.a: "« Apportez-moi un harpon et un filet ! »"
 gdp_travel_events.1060.b: "Je vais résoudre ce problème de stockage moi-même !"
 gdp_travel_events.1060.c: "Mettez le cap sur le port pour faire le plein de provisions."
 gdp_travel_events.1060.d: "Que tout le monde se mette à la chasse aux rats !"
 gdp_travel_events.1060.b.tt: "Vous devez avoir au moins #V 25#! d’[expertise|El] en [GetTradeGoodCategory('trade_category_cereals').GetName|l]"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ une cible dans le dos"
 gdp_travel_events.1070.desc: "On aperçoit de la poussière à l’horizon, et l’instant d’après, c’est une bande de voyous à cheval qui fonce vers nous sur une crête de décombres.\n\n« Halte ! », me crie leur chef. « Donnez-nous l’or que vous avez troqué, [ROOT.Char.GetTitleAsNameNoTooltip|l], et personne ne sera blessé. »"
 gdp_travel_events.1070.a: "« Je voyage sous la protection [ROOT.Char.GetSuzerain.Custom('FR_du_Char_U_Pi')][ROOT.Char.GetSuzerain.GetShortUIName], sales vauriens ! »"
 gdp_travel_events.1070.a.success: "Le nom de votre mécène vous permet de passer librement"
 gdp_travel_events.1070.b: "« Vous allez devoir venir le chercher ! »"
 gdp_travel_events.1070.b.success: "Vous repoussez les bandits"
 gdp_travel_events.1070.b.failure: "Les bandits prennent votre or"
 gdp_travel_events.1070.c: "« Tout ce que vous voudrez, mais laissez-nous passer. »"
 gdp_travel_events.2000.t: "La tour penchée"
 gdp_travel_events.2000.desc: "Mes yeux me jouent des tours... ? À moins que mes jambes ne soient pas aussi stables qu’elles en ont l’air ? Non, mes sens ne m’ont pas abandonné[ROOT.Char.Custom('FR_E')], en dépit de l’absurdité de ce que je vois. #EMP La grande [GetBuildingType('tower_of_pisa').GetNameNoTooltip|l] est penchée#! !\n\n« Ici, le sol est à peu près aussi ferme que du lait caillé, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] », me dit [mason.GetFirstName], le maître maçon qui se tient à côté de moi. « [ROOT.Char.GetSheHe|U] a commencé à glisser alors que nous n’étions qu’à un quart du chemin, mais nous avons fini par l’emmener tout en haut. »\n\n« Magnifique, n’est-ce pas ? »"
 gdp_travel_events.2000.a: "Peut-être que cette #EMP particularité#! attirera les voyageurs, au moins... ?"
 gdp_travel_events.2000.b: "Je ne sais pas si vous êtes un génie ou [Select_CString(mason.IsFemale,'une folle','un fou')]. Vous êtes [Select_CString(mason.IsFemale,'embauchée','embauché')] !"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip],"
 gdp_travel_events.2002.desc: "Nos maçons ont le plaisir de vous informer que l’imposante [GetBuildingType('tower_of_pisa').GetNameNoTooltip|l] est enfin terminée.\n\nToutefois, je dois vous dire que les voyageurs de Pise parlent d’un édifice #EMP quelque peu#! unique en son genre. Je crains qu’il y ait un problème au niveau de sa construction."
 gdp_travel_events.2002.a: "Laissez-moi juger leur travail de mes propres yeux."
 gdp_travel_events.2002.b: "Tant qu’elle reste debout, cela m’est égal."
