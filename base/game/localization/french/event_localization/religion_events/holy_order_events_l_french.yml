l_french:
 holy_order_hired_message: "Ordre militaire engagé"
 holy_order.hired_message: "Un ordre ([holy_order.GetName]) a été appelé par [actor.Custom('FR_le_Char_U_P')][actor.GetUIName]"
 holy_order_hired_by_enemy_message: "Ordre militaire ennemi"
 holy_order.hired_by_enemy: "Un ordre ([holy_order.GetName]) a été appelé par [actor.Custom('FR_le_Char_U_P')][actor.GetUIName] et lutte maintenant contre nous"
 holy_order.destroyed_message: "[title.GetName] a été détruit"
 holy_order_expanded: "L’ordre militaire s’agrandit"
 holy_order.new_lease: "[holy_order.GetName] prend maintenant à bail [barony.GetName] [former_holder.Custom('FR_du_Char_Pi')][former_holder.GetTitledFirstName]"
 monastic_holy_order_expanded: "Expansion de l’ordre monastique"
 holy_order.0001.t: "Ordre militaire"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] attend que je lui fasse mes adieux, ses affaires et sa suite étant prêtes pour le départ.\n\n"
 holy_order.0001.desc_demand: "« Je suppose qu’il y a de l’honneur, marmonne-t-[recipient.Custom('FR_IlElle')], à mourir en tentant de conquérir un pays païen et inconnu. Je pensais que je mourrais en combattant pour [actor.GetPrimaryTitle.GetNameNoTier]... »\n\n[recipient.Custom('FR_IlElle')|U] enfourche son cheval et demande : « Où dois-je aller ? »"
 holy_order.0001.desc: "« [ROOT.Char.Custom('FormOfAddressForLiege')|U], à quel ordre dois-je me vouer, le cœur pieux et l’épée à la main ? »"
 holy_order.0001.desc_relation: "« Mon épée a déjà soif de la chair vile des païens ! Mais où dois-je me rendre ? Qui seront mes [Select_CString(recipient.IsFemale,'nouvelles sœurs','nouveaux frères')] ? »"
 holy_order.0001.a: "Vous rejoindrez : [holy_order_1.GetName]."
 holy_order.0001.b: "Vous rejoindrez : [holy_order_2.GetName]."
 holy_order.0001.c: "Vous rejoindrez : [holy_order_3.GetName]."
 holy_order.0001.d: "Vous êtes un problème pour le [holy_order_4.GetName] maintenant."
 holy_order.0001.e: "J’ai fait une erreur. Votre place est ici !"
 holy_order.0001.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a accepté la convocation [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName] à un ordre militaire"
 holy_order.0002.desc_angry: "J’ai prononcé les paroles sacrées et je suis désormais lié[recipient.Custom('FR_E')] [ROOT.Char.GetFaith.HighGodName2], conformément à votre volonté."
 holy_order.0002.desc: "Je réponds favorablement à votre appel à servir une puissance supérieure et vous remercie de m’avoir mis sur la voie de la droiture."
 holy_order.0002.a_demand: "Bien. Attendez maintenant en silence [ROOT.Char.GetFaith.PositiveAfterLife]."
 holy_order.0002.a: "Je suis sûr[ROOT.Char.Custom('FR_E')] que vous servirez [ROOT.Char.GetFaith.HighGodName] correctement !"
 holy_order.0002.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a prononcé des vœux à la demande [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName]"
 char_interaction.0001.opening_low_piety: "Pour un être aussi [ROOT.GetCharacter.Custom('GetSinfulShameful')] que vous, venir ramper vers un ordre sacré qui sert [ROOT.Char.GetFaith.HighGodName]... Pensez au salut de votre âme avant de vous soucier davantage des richesses terrestres."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "Le [order.GetName] va accéder à votre demande d’or."
 holy_order.0200.a: "J’ai [ROOT.Char.GetFaith.HighGodName] à mes côtés !"
 holy_order.0200.b: "Mais... Mais j’ai besoin de cet argent !"
 holy_order.0202.second_time: "Encore une fois je vous rappelle que vous devez à l’Ordre #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! en or."
 holy_order.0202.opening: "Vous devez à l’Ordre #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! en or."
 holy_order.0202.desc: "Si vous ne nous rendez pas l’or, nous trouverons d’autres moyens pour vous de nous rembourser – des moyens qui conviennent [ROOT.Char.GetFaith.HighGodName2], mais peut-être moins à vous."
 holy_order.0202.a: "Bien sûr, je respecterai notre accord."
 holy_order.0202.a_no: "Je paierai ! Laissez-moi juste trouver l’or..."
 holy_order.0202.a._not.tt: "@warning_icon! #X [gold_i][gold|E] insuffisant#!"
 holy_order.0202.b_christian: "La patience n’est-elle pas une vertu ?"
 holy_order.0202.b: "En tant que fidèle... accordez-moi plus de temps !"
 holy_order.0202.b.tt: "[recipient.Custom('FR_le_Char_Pi')|U][recipient.GetTitledFirstNameNoTooltip] vous donnera 5 ans de plus"
 holy_order.0202.c: "Peut-être pouvons-nous trouver un autre moyen de paiement ?"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.Custom('FR_le_Char_L')|U][recipient.GetTitleAsNameNoTooltip] vous demandera quelque chose#!"
 holy_order.0202.d: "L’or est plus utile entre mes mains !"
 holy_order.0203.desc: "Je ne vois pas d’un bon œil ceux qui manquent à leur parole, et [ROOT.Char.GetFaith.HighGodNameAlternate] non plus. Pour réparer cet affront, vous nous louerez à bail le [province.GetName] afin que nous puissions poursuivre l’œuvre [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0203.a: "[province.GetNameNoTierNoTooltip] sera vôtre."
 holy_order.0203.b: "C’est une demande ridicule !"
 holy_order.0204.desc: "Je ne vois pas d’un bon œil ceux qui manquent à leur parole, et [ROOT.Char.GetFaith.HighGodNameAlternate] non plus. Pour réparer cet affront, vous nous enverrez votre [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.Custom('FR_le_Char_Pi')][child.GetTitledFirstName] accomplir l’œuvre [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0204.a: "Je... l’envoie immédiatement."
 holy_order.0204.a.tt: "Vous ne devez plus d’or à cet ordre"
 holy_order.0205.desc: "Toute cette affaire de prêt a été une démonstration honteuse de votre avidité. Je vais m’assurer que le [ROOT.Char.GetFaith.ReligiousHeadName] en entende parler !"
 holy_order.0205.a: "Malédiction !"
 holy_order_letter.opening: "Serviteur [ROOT.Char.GetFaith.HighGodNameAlternatePossessive],"
 holy_order.1001.intro: "Des âmes ferventes affluent en masse vers [holy_order.GetName], prêtes à sacrifier leur corps mortel pour la foi [ROOT.Char.GetFaith.GetAdjective]. Nous avons besoin de plus de terres et de casernes pour nos [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]."
 holy_order.1001.end: "\n\n[target_barony.GetName] convient parfaitement à cet objectif. Pourrions-nous prendre cette propriété à bail pour notre sainte cause ?"
 holy_order.1001.a: "Votre demande est acceptée. Pour [ROOT.Char.GetFaith.HighGodName] !"
 holy_order.1001.b: "Est-ce que [alternative_barony.GetNameNoTierNoTooltip] ne vous servirait pas tout aussi bien ?"
 holy_order.1001.c: "Non, je ne vous accorderai pas cette terre."
 holy_order.1011.intro: "En [target_barony.GetName], les bonnes terres et [grandmaster.GetFaith.HouseOfWorship] pourraient bénéficier d’une congrégation."
 holy_order.1011.end: "\n\nPourriez-vous négocier en notre nom afin que nous, [holy_order.GetName], y fondions un monastère ?"
 holy_order.1011.a: "L’ordre peut louer [target_barony.GetNameNoTierNoTooltip]."
 holy_order.1011.b: "N’est-ce pas plus calme en [alternative_barony.GetNameNoTierNoTooltip] ?"
 holy_order.1011.c: "Je crains que vous ne deviez envoyer vos [grandmaster.Custom('SistersBrothers')] ailleurs."
 holy_order.2001.t: "Un but divin"
 holy_order.2001.desc: "Lorsque m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('child'))], [child.GetFirstName], vient me voir, je comprends rapidement qu’[child.Custom('FR_IlElle')] veut discuter de quelque chose de très sérieux.\n\n« [ROOT.Char.Custom('MotherFather')|U], ma vie ici sera à jamais dans l’ombre des autres. Laissez-moi plutôt rejoindre [holy_order.GetName] et servir [child.GetFaith.HighGodName]. J’ai beaucoup réfléchi à cette question et c’est ce que je souhaite faire. »"
 holy_order.2001.a: "Laissez [child.GetFaith.HighGodNameAlternate] vous guider, m[child.Custom('FR_OnA')] [child.Custom('DaughterSon')]."
 holy_order.2001.b: "Ils ne sont peut-être pas grands, mais j’ai des projets pour vous ici."
 holy_order.2002.desc: "Lorsque m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('sibling'))] [sibling.Custom('FR_le_Char_Pi')][sibling.GetTitledFirstName] me parle de ses plans, il est clair qu’[sibling.Custom('FR_IlElle')] y réfléchit depuis longtemps.\n\n« Il y a pas grand chose pour moi ici, et si je dois servir quelqu’un, je préférerais servir [sibling.GetFaith.HighGodName]. Je rejoins [holy_order.GetName]. »"
 holy_order.2002.a: "Je comprends votre choix, m[sibling.Custom('FR_OnA')] [sibling.Custom('SisterBrother')]."
 holy_order.2002.b: "Non, ne faites pas ça !"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "Il sera toujours nécessaire pour les vrais guerriers de mettre fin à toute menace contre la foi [grandmaster.GetFaith.GetAdjective].\nAyant de nombreuses aptitudes et peu de perspectives d’héritage, votre [child.Custom('DaughterSon')] [child.Custom('FR_le_Char_Pi')][child.GetTitledFirstName] pourrait mener, je crois, une meilleure vie en servant [holy_order_scope.GetName]. Avec nous, [child.Custom('FR_IlElle')] va s’entraîner, apprendre et faire honneur à votre nom."
 holy_order.2003.a: "Sa vie sera celle d’un[child.Custom('FR_E')] vrai[child.Custom('FR_E')] [child.GetFaith.GetAdherentName]."
 holy_order.2003.child_joins_order: "[child.GetFirstName] obtient « [GetTrait('order_member').GetName( child.Self )] » et rejoint la Cour [grandmaster.Custom('FR_du_Char_Pi')][grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b: "Peut-être pourriez-vous entraîner [alternative_child.GetFirstNameNoTooltip] plutôt ?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName] obtient « [GetTrait('order_member').GetName( alternative_child.Self )] » et rejoint la Cour [grandmaster.Custom('FR_du_Char_Pi')][grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.c: "Sa place est ici avec moi."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "J’ai dédié ma vie [child.GetFaith.HighGodName2], mais la volonté divine ne pourrait être que j’oublie ma propre famille.\n\n[grandmaster.Custom('FR_le_Char_Pi')|U][grandmaster.GetTitledFirstName] m’a donné la permission de retourner à mon ancienne vie et de regagner votre [ROOT.Char.Custom('GetCourt')]."
 holy_order.2004.a: "Bienvenue à la maison, m[child.Custom('FR_OnA')] [child.Custom('DaughterSon')] !"
 holy_order.2004.b: "Il n’y a plus de place pour vous ici."
 holy_order.2005.t: "Un retour au foyer"
 holy_order.2005.desc: "La visite [child.Custom('FR_du_Char_Pi')][child.GetTitledFirstName] a duré plus longtemps que d’habitude. Ce n’est qu’une fois m[child.Custom('FR_OnA')] [child.Custom('DaughterSon')] s’était installé[child.Custom('FR_E')] [ROOT.Char.Custom('FR_GetCourt_Au')] à se gaver de ma nourriture et à tourmenter mes serviteurs que j’ai abordé le sujet du retour à [holy_order.GetName]. Sa réponse fut malheureusement enthousiaste.\n\n« N’avez-vous pas entendu, [ROOT.Char.Custom('MotherFather')|U] ? [grandmaster.Custom('FR_le_Char_Pi')|U][grandmaster.GetTitledFirstName] a été assez généreu[grandmaster.Custom('FR_XSe')] pour me décharger de mes devoirs envers la foi [child.GetFaith.GetAdjective] ! Je retrouve enfin ma famille. »"
 holy_order.2005.a: "Oh, vous êtes... ici pour rester ?"
 holy_order.destroyed_title: "Ordre militaire dissous"
 holy_order.2010.t: "Un nouvel ordre monastique"
 holy_order.2010.desc: "Des ermites, des mystiques et des disciples mécontents d’ordres plus anciens se sont rassemblés à [barony.GetNameNoTier] et ont œuvré pendant des années à se forger un nouveau foyer au cœur de la nature sauvage. [Select_CString(leader.IsFemale,'Une femme appelée sœur','Un homme appelé frère')] [leader.GetFirstName] s’est imposé[leader.Custom('FR_E')] comme chef naturel de cet ordre en plein essor, « [leader.GetPrimaryTitle.GetName] ». Mais ma voix auguste ne s’est pas encore fait entendre à ce sujet. De plus, je dois toujours proposer un précepte sacré autour duquel s’articulera le mode de vie de l’ordre.\n\nQue doit chanter ce chœur de fidèles purs à [barony.GetNameNoTierNoTooltip] ? À quoi doivent-ils travailler pour mener une vie épanouie ? Sur quoi doivent-ils réfléchir et écrire ? Et qui doit les guider dans cette voie ?"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )] et [monk_tenet_1.Custom('SisterBrother')] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5: "[tenet_5.GetName( order_rite )] et [monk_tenet_2.Custom('SisterBrother')] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6: "[tenet_6.GetName( order_rite )] et [monk_tenet_3.Custom('SisterBrother')] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d: "[tenet_1.GetName( order_rite )] et [monk_tenet_1.Custom('SisterBrother')] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.e: "[tenet_2.GetName( order_rite )] et [monk_tenet_2.Custom('SisterBrother')] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f: "[tenet_3.GetName( order_rite )] et [monk_tenet_3.Custom('SisterBrother')] [monk_tenet_3.GetFirstNameNoTooltip]."
 monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )] sera le [core_tenet|El] prôné par [monastic_order.GetName]"
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName] prône : [tenet_pick.GetName( order_rite )|l]"
 founded_monastic_order_modifier: "Ordre monastique fondé"
 founded_monastic_order_modifier_desc: "Ce dirigeant avisé a contribué à la conception et à la fondation d’un ordre monastique, s’adressant ainsi directement au divin."
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.Custom('FR_le_Char_U_Pi')|U][chosen_leader.GetShortUIName] devient le [ruler|El] de [monastic_order.GetName]"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.Custom('FR_le_Char_U_Pi')|U][chosen_leader.GetShortUIName] reste le [ruler|El] de [monastic_order.GetName]"
 holy_order.2009.t: "La construction d’un monastère"
 holy_order.2009.desc: "Dans [province.Custom('TerrainTypeProvince')|l], au cœur d’un lieu cher aux [province.GetCulture.GetCollectiveNoun], je pose la première pierre du monastère de [province.GetName].\n\nMes ouvriers s’unissent, armés d’outils simples, pour ériger des murs et faire jaillir des hymnes pieux de leurs corps industrieux. Les premiers religieux – comme [potential_leader.Custom('SisterBrother')] [potential_leader.GetName] – sont également venus ici pour dessiner les plans des chanteries et des réfectoires.\n\nDans quelques années, un ordre verra le jour ici. Outre les pierres et les [ROOT.Char.Custom('GetWritingMaterialPlural')], cet ordre aura besoin d’autres membres ayant prêté serment."
 holy_order.2009.a: "Cet ordre doit être dirigé par ceux que je soutiens."
 holy_order.2009.b: "De nombreux religieux sont mécontents de leur ordre actuel..."
 holy_order.2009.b.tt: "et seraient prêts à abandonner leurs supérieurs pour adhérer à ce nouvel ordre, afin d’avoir la liberté de rédiger une nouvelle règle."
 holy_order.2009.c: "Rassemblez des ascètes et des jeunes gens enthousiastes."
 monastic_order_creation_increased_spiritual_fulfillment: "Les [interactions|El] avec l’[monastic_holy_order|El] procureront une augmentation de l’[spiritual_fulfillment|El] pendant #high 50 ans#!"
 monastic_founder_become_saint_tt: "[chosen_leader.Custom('FR_le_Char_U_Pi')|U][chosen_leader.GetShortUIName] deviendra un [GetTrait('saint').GetName( chosen_leader.Self )|l] après sa mort, [chosen_leader.Custom('FR_SilSielle')] a au moins #high 65#! d’[Concept('trait_level_track_xp', 'expérience')|E] de [GetTrait('devoted').GetName( chosen_leader.Self )|l] ou un [piety_level|El] d’au moins [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]@piety_level_4_icon_christian!"
 holy_order.2020.t: "Vœux monastiques"
 holy_order.2020.desc: "À ma demande, [recipient.GetFirstName], vêtu[recipient.Custom('FR_E')] de sa nouvelle robe monastique, se détourne de m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')] et s’éloigne des [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] et de la noblesse du monde profane. [recipient.Custom('FR_IlElle')|U] est admis[recipient.Custom('FR_E')] au sein de [archabbot.GetPrimaryTitle.GetName].\n\nÀ l’instar des autres membres de son ordre, [recipient.GetFirstNameNoTooltip] prête serment de loyauté à la communauté sacrée. [recipient.Custom('FR_IlElle')|U] consacre sa chair [recipient.GetFaith.HighGodName2] et son esprit à la vénération [recipient.GetFaith.PositiveAfterLife3].\n\n[recipient.GetFirstNameNoTooltip] doit résider à [archabbot.GetCapitalLocation.GetName] ou dans un autre sanctuaire de l’ordre et y commencer sa vie d’étude et de contemplation."
 holy_order.2020.aa: "L’Ordre a acquis un esprit industrieux."
 holy_order.2020.aa.tt: "L’aptitude en intendance de [recipient.GetFirstNameNoTooltip] vous sera très utile dans votre travail acharné."
 holy_order.2020.a: "L’Ordre a acquis un disciple érudit."
 holy_order.2020.a.tt: "Pour l’érudit[recipient.Custom('FR_E')] [recipient.GetFirstNameNoTooltip], aucun endroit de ce monde ne pourrait être plus approprié."
 holy_order.2020.b: "[ROOT.Char.Custom2('FR_RelationToMeShort_Le', SCOPE.sC('recipient'))|U] de son patron n’est pas commis de cuisine..."
 holy_order.2020.c: "Un « don » permettra sans aucun doute de choyer [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.d: "Sa vie appartient à l’ordre désormais."
 holy_order.2020.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a rejoint un ordre monastique à la demande [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName]"
 take_vows_improve_education_learning_tt: "@skill_learning_icon!Le résultat de l’[education|El] en [learning|El] s’améliorera"
 take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon!Le résultat de l’[education|El] en [stewardship|El] s’améliorera"
 recently_joined_holy_order_desc: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a rejoint son ordre durant les 5 dernières années"
 child_in_holy_order_desc: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] est un enfant promis à son ordre"
 custom.every_domain_monastic_order: "Chaque [monastic_holy_order|El] de votre [domain|El]"
 order_gains_minor_tenet_popularity_tt: "Son [core_tenet|El] gagne #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! en [Concept('tenet_popularity', 'popularité')|E]"
 new_order_gains_minor_tenet_popularity_tt: "Votre nouvel [monastic_holy_order|El] fournira #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! supplémentaires en [Concept('tenet_popularity', 'popularité')|El] à son [core_tenet|El]"
 holy_order.2030.t: "Don : [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "Mes richesses sont en route vers les monastères [recipient.Custom('FR_du_Char_Pi')][recipient.GetTitledFirstName]. Un don destiné à financer la gestion pieuse des terres, la copie de textes sacrés, les activités séculières de [recipient.GetPrimaryTitle.GetName]...\n\n... et des milliers de prières consacrées à mon âme immortelle. Les moines vivent pour prier, et leur dévotion juste et singulière — du moins le dit-on — implique que les Puissances supérieures se soucient tout particulièrement de leurs prières.\n\n#EMP Ô [actor.GetFaith.HighGodName], les entends-tu prononcer mon nom ?#!"
 holy_order.2030.desc_desperate_plea: "#EMP Sais-tu à quel point je me suis humilié[ROOT.Char.Custom('FR_E')] et j’ai supplié — [Select_CString(ROOT.Char.IsFemale,'telle une','tel un')] misérable — pour implorer ta clémence ?#!"
 holy_order.2030.desc_huge_donation: "#EMP Vois-tu la fortune à laquelle j’ai renoncé ?#!"
 holy_order.2030.a: "De nouveaux partisans de mon salut."
 holy_order.2030.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a accepté le don monastique [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName]"
 holy_order.2031.opening: "[Select_CString(actor.IsFemale,'Ma sœur','Mon frère')],"
 holy_order.2031.desc: "J’ai réfléchi à votre demande et j’ai prié. Malheureusement, je dois vous informer qu’aucun don ne pourra convaincre mes moines de s’adresser [recipient.GetFaith.HighGodName2] en votre nom. Le salut de votre âme semble hors de portée, même pour nous."
 holy_order.2031.a: "Pff ! Au moins, j’ai encore mon argent."
 holy_order.2031.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a refusé le don monastique [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName]"
 already_has_monastic_lease_tt: "[target.GetNameNoTier] est déjà [Concept('leased', 'baillée à rente')|E] à un [monastic_holy_order|El]"
 lease_title_to_existing_monastic_order_interaction: "Accorder un monastère"
 lease_title_to_existing_monastic_order_interaction_desc: "[Concept('lease', 'Bailler à rente')|E] une [temple_holding|El] à [recipient.GetPrimaryTitle.GetName] pour un gain d’[spiritual_fulfillment|El], de [piety|El] et un meilleur accès à l’ordre"
 INTERACTION_LEASE_DONATION: "Acquérir des propriétés annexes"
 no_valid_temple_holdings_to_lease_tt: "Il n’y a pas de [temple_holding|El] dans votre [domain|El] qui peut être [Concept('lease', 'baillée à rente')|E]"
 monastic_onslaught_modifier_tt: "[target_county.GetName] obtient [GetModifier('monastic_onslaught_modifier').GetNameWithTooltip] pendant #high 20 ans#!"
 holy_order.2040.opening: "[actor.GetFirstName] de [actor.GetPrimaryTitle.GetNameNoTier], ô [Select_CString(actor.IsFemale,'bienfaitrice','bienfaiteur')],"
 holy_order.2040.desc: "C’est fait. Un chapitre de [recipient.GetPrimaryTitle.GetNameNoTier] sera rattaché [actor.GetFaith.HouseOfWorship2] de [target.GetNameNoTier]. Là-bas, au cœur de [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier], nous conserverons des textes ancestraux de [recipient.GetCapitalLocation.GetName].\n\n"
 holy_order.2040.desc_nuns: "Nos [recipient.GetFaith.DevoteeFemalePlural] y adresseront des prières [actor.GetFaith.HighGodName2] en votre nom."
 holy_order.2040.desc_monks: "Nos [recipient.GetFaith.DevoteeMalePlural] y adresseront des prières [actor.GetFaith.HighGodName2] en votre nom."
 holy_order.2040.desc_huge_donation: "L’Ordre vous est infiniment reconnaissant pour votre charité."
 holy_order.2040.desc_rite: "\n\nSoyez assurés que le chapitre continuera à respecter les coutumes du rite [recipient.GetRite.GetAdherentName], comme le fait chaque maison de notre ordre."
 holy_order.2040.a: "Que votre Ordre prospère !"
 holy_order.2040.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a accepté la proposition [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName] de prendre à bail une baronnie"
 holy_order.2041.opening: "[actor.GetFirstName] de [actor.GetPrimaryTitle.GetNameNoTier],"
 holy_order.2041.desc: "Nous, les plus fervents disciples [recipient.GetFaith.HighGodNamePossessive], nous qui apportons sur cette misérable terre la sainteté parfaite [recipient.GetFaith.PositiveAfterLife3], craignons qu’une malédiction ne se soit abattue sur le pays de [actor.GetPrimaryTitle.GetNameNoTier], que même nos prières ne peuvent conjurer.\n\nTant que l’âme de votre pays sera lamentablement séparée [recipient.GetFaith.HighGodNamePossessive], [recipient.GetPrimaryTitle.GetName] ne pourra pas se rendre à [target.GetNameNoTier]."
 holy_order.2041.a: "Leur soi-disant « pureté », pff !"
 holy_order.2041.toast_puppeteer: "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] a refusé la proposition [puppet_or_actor.Custom('FR_du_Char_U_Pi')][puppet_or_actor.GetShortUIName] de prendre à bail une baronnie"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial [monastic_order.GetName] entrera dans la [holy_order_vicinity|El], permettant ainsi des [interactions|El]#!"
 holy_order.2050.t: "Un mouvement prend de l’ampleur à [barony.GetNameNoTierNoTooltip]"
 holy_order.2050.desc: "« L’ordre – [target_order.GetName] – souffre-t-il toujours... comme souffraient les ermites du désert ? » ainsi commencent toutes les missives enflammées [clerical_helper.Custom('FR_du_Char_Pi')][clerical_helper.GetTitledFirstName].\n\n« [target_lessee.Custom('FR_le_Char_Pi')|U][target_lessee.GetTitledFirstName] se pare-t-[target_lessee.Custom('FR_IlElle')] d’or ? » demandent les sermons des réformateurs en [barony.GetNameNoTier], qui s’achèvent par ces mots : « #EMP Une voie nouvelle ! Une nouvelle Règle ! »#!\n\nLe monastère devient rapidement un foyer de réforme pieuse et de dissidence. Ses résidents sont à peine encore de patrie [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] et guère disposés désormais à se contenter de discours éculés sur [target_order_tenet.GetName( founder.GetRite )]. Mais leur esprit réformateur doit encore être canalisé vers un nouveau principe unique et une vision commune."
 msg_order_movement_took_monastery.t: "Mouvement [chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 movement_took_monastery_notification_3_tt: "[new_holy_order.GetName] a pris [barony.GetNameNoTier] et d’autres [Concept('leases', 'baux à rente')|El] de [target_order.GetName]"
 movement_took_monastery_notification_2_tt: "[new_holy_order.GetName] a pris [barony.GetNameNoTier] et [lease_2.GetNameNoTier] de [target_order.GetName]"
 movement_took_monastery_notification_tt: "[new_holy_order.GetName] a pris le [Concept('leases', 'bail à rente')|El] de [barony.GetNameNoTier] de [target_order.GetName]"
 movement_took_monastery_patron_notification_tt: "[founder.Custom('FR_le_Char_U_Pi')|U][founder.GetShortUIName] a approuvé cet [monastic_holy_order|El] réformé"
