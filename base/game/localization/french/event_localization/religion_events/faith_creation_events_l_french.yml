l_french:
 faith_creation.1001.t.schism: "Le schisme [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1001.t.reformation: "La réforme [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1001.desc.schism: "Un nouveau schisme déchire la religion [reformed_faith.GetReligion.GetAdjective]. [reformer.Custom('FR_le_Char_Pi')|U][reformer.GetTitledFirstName] et ses partisans se sont séparés de la communauté [old_faith.GetAdjective], celle de la foi d’origine, et le rite [old_rite.GetAdherentName] qu’ils pratiquaient autrefois est devenu la graine d’une foi à part entière."
 faith_creation.1001.desc.reformation: "[reformer.Custom('FR_le_Char_Pi')|U][reformer.GetTitledFirstName], une personnalité éminente des [reformed_faith.GetAdherentNamePlural], a réuni les [reformer.Custom('DefaultPriestTitlePlural')] du pays pour regrouper leurs pratiques en un seul et même rite, et ainsi élaborer une doctrine officielle de la foi."
 faith_creation.1001.desc.schism.personal: "Les [old_faith.AltPriestTermPlural] [old_faith.GetAdherentNamePlural] se sont égarés et on ne peut plus compter sur eux pour nous guider. J’ai réuni un groupe de [reformer.Custom('DefaultPriestTitlePlural')] qui partagent mon opinion, et ce que nous avons fait du [old_rite.GetName|l] n’appartient plus à notre foi d’origine."
 faith_creation.1001.desc.reformation.personal: "J’ai enfin rassemblé tous les [reformer.Custom('DefaultPriestTitlePlural')] importants du monde, afin de regrouper nos pratiques en un seul et même rite, et ainsi élaborer la doctrine qui guidera dorénavant notre foi."
 faith_creation.1001.desc.schism.personal.hof: "Je refuserai de m’agenouiller tant que [old_hof.Custom('FR_le_Char_Pi')][old_hof.GetTitledFirstName] et les [old_faith.AltPriestTermPlural] [old_faith.GetAdherentNamePlural] induiront les fidèles en erreur. J’ai réuni les [reformer.Custom('DefaultPriestTitlePlural')] qui partagent mes convictions, et à partir du rite [old_rite.GetAdherentName] que nous avons conservé, nous avons bâti une foi qui ne doit rien à la foi [old_faith.GetAdjective]."
 faith_creation.1001.desc.schism.hof: "[reformer.Custom('FR_le_Char_Pi')|U][reformer.GetTitledFirstName] a rejeté l’autorité [old_hof.Custom('FR_du_Char_Pi')][old_hof.GetTitledFirstName], excluant ainsi ses partisans de la foi [old_faith.GetAdjective]. Le rite [old_rite.GetAdherentName] qu’ils ont conservé est désormais à l’origine d’une foi qui ne rend de comptes qu’à elle-même."
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\nLes [reformer.Custom('DefaultPriestTitlePlural')] exaltés parlent déjà de lancer des [reformed_faith.GHWNamePlural] pour répandre leur nouvelle foi à travers le monde et"
 faith_creation.1001.desc.outlook.pacifism: "\n\nCes [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] ont condamné la violence, disant que la guerre ne mène qu’à la souffrance et à la haine, et"
 faith_creation.1001.desc.outlook.dogmatic: "\n\nCes [reformer.Custom('DefaultPriestTitlePlural')] ont déclaré la foi [reformed_faith.GetAdjectiveNoTooltip] comme étant la seule vraie foi, et"
 faith_creation.1001.desc.outlook.accepting: "\n\nCes [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] encouragent la coopération et la tolérance, même envers les non-croyants, et"
 faith_creation.1001.desc.outlook.fallback: "\n\nCes [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdjectiveNoTooltip] ont adopté une vision pragmatique et équilibrée des autres fois et"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "affirmé que le seul moyen de montrer une dévotion appropriée est d’honorer [reformed_faith.HighGodName] par des sacrifices humains !"
 faith_creation.1001.desc.belief.indulgent: "encouragé les adeptes à se livrer aux désirs de la chair et à vivre pleinement leur vie."
 faith_creation.1001.desc.belief.incest: "approuvent les mariages de proches parents, affirmant que les liens familiaux sont sacrés et que de tels mariages sont bénis."
 faith_creation.1001.desc.belief.aniconism: "rejettent l’utilisation de tout symbolisme religieux, affirmant que de simples effigies ne peuvent reproduire la grandeur [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.ascetic: "encouragent l’ascèse auprès de leurs adeptes, affirmant que les poursuites matérialistes bloquent la voie vers l’épanouissement spirituel."
 faith_creation.1001.desc.belief.spirits: "ont demandé l’aide des esprits pour guider les fidèles à travers ces temps agités."
 faith_creation.1001.desc.belief.superstition: "de nombreuses superstitions anciennes et de mythes ont été canonisés dans la doctrine officielle."
 faith_creation.1001.desc.belief.nature: "ont un grand respect pour la nature elle-même, cherchant à la préserver et à la protéger de ceux qui l’exploiteraient pour leur besoin personnel."
 faith_creation.1001.desc.belief.community: "la nouvelle foi s’est mélangée aux traditions culturelles de ses adeptes pour former des communautés très unies de [reformed_faith.GetAdherentNamePluralNoTooltip] qui hésitent à accepter les étrangers."
 faith_creation.1001.desc.belief.pain: "enseignent que la chair doit être soumise aux épreuves et à la douleur, car la souffrance purifie l’âme et rapproche les fidèles [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.iconoclasm: "demandent que les idoles et les autels des faux dieux soient détruits et réduits en cendres."
 faith_creation.1001.desc.belief.militant: "maintiennent que les fidèles sont des soldats avant tout, appelés pour porter la foi au bout de leur épée."
 faith_creation.1001.desc.belief.veneration: "vénèrent les pieux défunts en tant qu’intercesseurs, honorant ainsi leurs reliques et invoquant leurs noms lors des prières."
 faith_creation.1001.desc.belief.sacraments: "affirment que la grâce se répand à travers les rites sacrés uniquement, dispensés par des mains consacrées et aucune autre."
 faith_creation.1001.desc.belief.penance: "enseignent que toutes les âmes sont entachées dès la naissance, et que seules la confession et la pénitence peuvent les purifier."
 faith_creation.1001.desc.belief.christology: "ont réglé une question de doctrine importante, définissant ainsi la nature même du divin en des termes que tous les fidèles sont tenus de professer."
 faith_creation.1001.desc.belief.rebirth: "soutiennent que l’âme est liée à une grande roue de renaissances, chaque nouvelle vie étant façonnée par les actes de la précédente."
 faith_creation.1001.desc.belief.learning: "placent l’enseignement au-dessus de tout ou presque, affirmant que l’étude du monde permet de mieux connaître l’esprit [reformed_faith.HighGodNamePossessive]."
 faith_creation.1001.desc.belief.law: "placent la loi sacrée par-dessus tout, insistant sur le fait que chaque mot de la doctrine doit être respecté à la lettre."
 faith_creation.1001.desc.belief.missionary: "ont juré de répandre la bonne parole aux quatre coins du monde, afin qu’aucune âme ne reste dans les ténèbres."
 faith_creation.1001.desc.belief.hierarchy: "enseignent que toute chose occupe la place qui lui revient, et que l’harmonie n’existe que lorsque chaque âme respecte l’ordre qui lui est imposé."
 faith_creation.1001.desc.belief.charity: "demandent aux fidèles de répondre à l’adversité par la charité, en s’occupant notamment des pauvres, des malades, et des étrangers."
 faith_creation.1001.desc.belief.family: "affirment que les liens de parenté sont sacrés, et qu’honorer ses ancêtres et élever plusieurs enfants est un acte de culte."
 faith_creation.1001.desc.belief.sacred_sites: "érigent de grands monuments de pierre pour témoigner de leur dévotion, sur un sol sacré destiné à perdurer de génération en génération."
 faith_creation.1001.desc.belief.worldly: "ont une vision concrète et pragmatique de la dévotion, estimant que l’argent, les compromis, et un silence opportun peuvent servir la foi au même titre que la prière."
 faith_creation.1001.desc.belief.syncretic: "intègrent les croyances de leurs voisins aux leurs, affirmant que plusieurs chemins peuvent mener à la même vérité."
 faith_creation.1001.desc.belief.fallback: "demandent à tous les adeptes de mettre de côté les vieilles querelles et de s’unir pour le bien de la nouvelle foi."
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip] a choisi de diriger personnellement ce mouvement [reformed_faith.GetAdjectiveNoTooltip] en plein essor et s’est attribué le titre de [reformed_faith.ReligiousHeadName], un poste élevé qu’[reformer.Custom('FR_IlElle')] est censé[reformer.Custom('FR_E')] transmettre à ses descendants."
 faith_creation.1001.desc.temporal.personal: "\n\nJ’ai choisi de diriger personnellement ce mouvement [reformed_faith.GetAdjectiveNoTooltip] en plein essor et me suis attribué le titre de [reformed_faith.ReligiousHeadName], un poste élevé que je transmettrai à mes descendants."
 faith_creation.1001.desc.spiritual: "\n\nLes [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdherentNamePluralNoTooltip] ont choisi [reformed_hof.GetFirstNameNoTooltip] comme leur nouveau [reformed_faith.ReligiousHeadName], qui définira le rite principal servant de référence à tous les autres rites de la foi [reformed_faith.GetAdjectiveNoTooltip], et qui réglera les conflits au sein de la foi."
 faith_creation.1001.desc.spiritual.sameold: "\n\nLes [reformer.Custom('DefaultPriestTitlePlural')] [reformed_faith.GetAdherentNamePluralNoTooltip] ont choisi de garder [reformed_hof.GetFirstNameNoTooltip] comme [reformed_faith.ReligiousHeadName]. [reformed_hof.Custom('FR_IlElle')|U] définira le rite principal servant de référence à tous les autres rites de la foi [reformed_faith.GetAdjectiveNoTooltip], et réglera les conflits au sein de la foi."
 faith_creation.1001.desc.no_head: "\n\nLe mouvement en plein essor a décidé de ne pas instituer de chef religieux, préférant laisser chaque rite conserver ses propres enseignements, et chaque [reformer.Custom('DefaultPriestTitle')] être responsable [reformed_faith.HouseOfWorship3]."
 faith_creation.1001.desc.no_holy_sites: "\n\nLes [reformed_faith.GetAdherentNamePluralNoTooltip] attendent avec impatience l’arrivée annoncée de leur [reformed_faith.ReligiousHeadName], un grand chef qui ralliera tous les fidèles derrière lui et inaugurera un nouvel âge d’or [reformed_faith.GetAdjectiveNoTooltip]."
 faith_creation.1001.o.frightened: "Puisse [ROOT.Char.GetFaith.HighGodName] nous sauver de ces [second.Custom('GetUnbelieverNamePlural')] sanguinaires !"
 faith_creation.1001.o.heretical: "Ces hérétiques vont payer pour leurs crimes contre [ROOT.Char.GetFaith.HighGodName] !"
 faith_creation.1001.o.crusader: "Une [ROOT.Char.GetFaith.GHWName] ou deux vont remettre ces [second.Custom('GetUnbelieverNamePlural')] à leur place !"
 faith_creation.1001.o.interested: "Nous devrions garder un œil sur cette évolution..."
 faith_creation.1001.o.uninterested: "Peu importe ce que ces [second.Custom('GetUnbelieverNamePlural')] croient."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Gagnez #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! actions libres pour créer, rétrograder, promouvoir, adopter ou abandonner des [holy_sites|El]"
 faith_creation.1001.o.personal: "Le monde verra que nous avons [ROOT.Char.GetFaith.HighGodName] à nos côtés !"
 faith_creation.1002.t: "Un rite déchiré"
 faith_creation.1002.t.new_faith: "Une foi à nous"
 faith_creation.1002.desc.intro.founder: "Prière après prière, principe après principe, mon rite [old_rite.GetAdherentName] a dérivé jusqu’à ne plus appartenir du tout à la foi [old_faith.GetAdjective]."
 faith_creation.1002.desc.intro.member: "Prière après prière, principe après principe, notre rite [old_rite.GetAdherentName] a dérivé sous l’autorité [founder.Custom('FR_du_Char_Pi')][founder.GetTitledFirstName], jusqu’à ne plus appartenir du tout à la foi [old_faith.GetAdjective]."
 faith_creation.1002.desc.intro.observer: "Prière après prière, principe après principe, le rite [old_rite.GetAdherentName] [founder.Custom('FR_du_Char_Pi')][founder.GetTitledFirstName] a dérivé jusqu’à ne plus appartenir du tout à la foi [old_faith.GetAdjective]."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.Custom('FR_le_Char_Pi')|U][old_hof.GetTitledFirstName] prononce son jugement : le troupeau égaré est chassé de fond en comble."
 faith_creation.1002.desc.anathema.no_hof: "\n\nLes [old_faith.AltPriestTermPlural] [old_faith.GetAdherentNamePlural] prononcent leur jugement depuis chaque autel : le troupeau égaré est chassé de fond en comble."
 faith_creation.1002.desc.new_head.personal: "C’est à moi qu’incombe la responsabilité de ce qui suit : c’est moi le [new_faith.ReligiousHeadName|l] de la foi [new_faith.GetAdjective]."
 faith_creation.1002.desc.new_head.founder: "La personne à l’origine de leur éloignement les guide encore aujourd’hui : [founder.GetFirstNameNoTooltip], [new_faith.ReligiousHeadName|l] de la foi [new_faith.GetAdjective]."
 faith_creation.1002.desc.new_head.other: "[new_hof.Custom('FR_le_Char_Pi')|U][new_hof.GetTitledFirstName] est le [new_faith.ReligiousHeadName|l] de la foi [new_faith.GetAdjective]."
 faith_creation.1002.desc.new_head.none: "Il n’y a pas de berger pour guider ce nouveau troupeau. Les [new_faith.AltPriestTermPlural] n’ont de compte à rendre qu’à eux-mêmes."
 faith_creation.1002.desc.outro.new_faith: "\n\nNotre propre foi, notre propre loi. Sa flamme vient d’être ravivée, et la foi [old_faith.GetAdjective] pourra désormais nous accueillir par l’épée et par la censure."
 faith_creation.1002.desc.outro.old_faith: "\n\nTous les comtés et toutes les âmes du [old_rite.GetName|l] quittent la foi [old_faith.GetAdjective]. Ce ne sont plus nos frères, et nous pourrions bientôt nous affronter dans une guerre ouverte."
 faith_creation.1002.a: "Notre propre foi, enfin."
 faith_creation.1002.a.founder: "Le chemin a toujours été à nous. Maintenant, le nom l’est aussi."
 faith_creation.1002.b: "Des hérétiques, maintenant et pour toujours."
 faith_creation.1002.b.hof: "Qu’ils découvrent par eux-mêmes que le quotidien est rude loin du giron de la foi."
 faith_creation.1002.consequences.tt: "La foi [new_faith.GetAdjective] est désormais une [faith|El] à part entière :\n$EFFECT_LIST_BULLET$Tous les [followers|El] et tous les [counties|El] de l’ancien [rite|El] appartiennent désormais à la nouvelle foi\n$EFFECT_LIST_BULLET$L’[faith_hostility|El] s’applique entre la foi [new_faith.GetAdjective] et la foi [old_faith.GetAdjective], ce qui peut entraîner des [holy_wars|El]\n$EFFECT_LIST_BULLET$Les deux fois ne partagent plus un seul et unique [head_of_faith|El]"
 faith_creation.1002.a.free_holy_site_actions: "La foi [new_faith.GetAdjective] gagne #V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! actions libres pour créer, rétrograder, promouvoir, adopter ou abandonner des [holy_sites|El]"
 faith_creation.1002.a.lost_ecumenism: "La foi [new_faith.GetAdjective] perd [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip] déclaré[HoF.Custom('FR_E')] [faith.ReligiousHeadName]"
 faith_creation.1010.desc.start: "Bien que la justesse de notre foi n’ait jamais été mise en doute, la période de temps que nous avons dû endurer sans chef spirituel a été éprouvante. Mais cette épreuve est enfin terminée, car"
 faith_creation.1010.desc.temporal.personal: "j’ai enfin convaincu les [faith.AltPriestTermPlural] de m’accepter comme [faith.ReligiousHeadName]."
 faith_creation.1010.desc.temporal: "[HoF.Custom('FR_le_Char_Pi')][HoF.GetTitledFirstName] a réussi à convaincre les [faith.AltPriestTermPlural] de l’accepter comme [faith.ReligiousHeadName]."
 faith_creation.1010.desc.spiritual: "les [faith.AltPriestTermPlural] se sont réunis pour élire [HoF.GetFirstName] comme [faith.ReligiousHeadName], garant[HoF.Custom('FR_E')] du rite principal."
 faith_creation.1010.desc.end: "\n\nTous les fidèles sont enfin unis derrière un seul chef et il semble qu’un nouvel âge d’or pour la foi [faith.GetAdjectiveNoTooltip] commence."
 faith_creation.1010.desc.end.personal: "\n\nTous les fidèles sont enfin unis derrière moi et je ferai connaître à la foi [faith.GetAdjectiveNoTooltip] à un nouvel âge d’or !"
 faith_creation.1010.a: "Gloire [faith.HighGodName2] !"
 faith_creation.1011.message.title: "Création d’un chef de la foi"
 faith_creation.1011.message.desc: "Les [faith.AltPriestTermPlural] [faith.GetAdherentNamePlural] ont fait du [faith.ReligiousHeadName|l] [HoF.GetFirstName] leur [head_of_faith|El]"
 faith_creation.1021.t: "Un rite au sein de l’Église"
 faith_creation.1021.t.founder: "Un rite à nous"
 faith_creation.1021.desc.intro.founder: "Le rite [new_rite.GetAdherentName] a été proclamé, et ceux qui le pratiqueront devront se tourner vers moi. Nous restons des [old_faith.GetAdherentNamePlural], mais nous n’appartenons plus au rite [source_rite.GetAdherentName]."
 faith_creation.1021.desc.intro.observer: "[founder.Custom('FR_le_Char_Pi')|U][founder.GetTitledFirstName] a fondé un nouveau rite au sein de la foi [old_faith.GetAdjective]. Ses partisans l’appellent « [new_rite.GetName] » et conservent la foi [old_faith.GetAdjective] grâce à leurs propres rites."
 faith_creation.1021.desc.divergence.minor: "\n\nIl ne dérive du rite [source_rite.GetAdherentName] que sur certains points. "
 faith_creation.1021.desc.divergence.moderate: "\n\nSes pratiques peuvent sembler bizarres pour ceux qui suivent le rite [source_rite.GetAdherentName]. "
 faith_creation.1021.desc.divergence.major: "\n\nSes pratiques s’éloignent suffisamment du rite [source_rite.GetAdherentNameNoTooltip] pour éveiller les soupçons. "
 faith_creation.1021.desc.differing.tenet: "La principale différence est [differing_tenet.GetBaseName]."
 faith_creation.1021.desc.differing.doctrine: "La principale différence est [differing_doctrine.GetDescriptiveName]."
 faith_creation.1021.desc.differing.fallback: "Aucune pratique en particulier ne marque la scission."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nNous avons abandonné le rite principal, qui sert de référence à la foi [old_faith.GetAdjectiveNoTooltip]. Ils appellent ça de la présomption."
 faith_creation.1021.desc.outro.founder.branch: "\n\nNous étions déjà une branche. Désormais, nous sommes une foi à part entière."
 faith_creation.1021.desc.outro.observer: "\n\nDe nouveaux rites apparaissent assez régulièrement. Nous verrons si celui-ci perdure, faiblit, ou sombre dans l’hérésie."
 faith_creation.1021.a.founder: "Laissez-le se répandre doucement parmi les dévots."
 faith_creation.1021.b.founder: "Que tout le pays en entende parler."
 faith_creation.1021.a: "Une foi vivante a assez de place pour plusieurs rites."
 faith_creation.1021.b: "Toutes les hérésies commencent par une innovation."
