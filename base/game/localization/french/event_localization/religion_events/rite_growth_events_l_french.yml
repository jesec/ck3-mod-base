l_french:
 rite_growth.0010.t: "Un nouveau rite [origin_faith.GetReligion.GetAdherentNameNoTooltip]"
 rite_growth.0010.desc.intro.relation: "Au cœur d’un rite nouvellement fondé se trouve m[GetPlayer.Custom2('FR_RelationToMeShort_OnA', founder.Self)] [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_archbishop: "Au cœur d’un rite nouvellement fondé se trouve l’archevêque d’origine [founder.GetCulture.GetName], [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_ruler: "Au cœur d’un rite nouvellement créé se trouve [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName], "
 rite_growth.0010.desc.opener.archbishopric: "qui préside [founder_clerical_title.GetNameNoTier].\n\n"
 rite_growth.0010.desc.opener.lands: "qui règne sur les terres de [founder.GetPrimaryTitle.GetBaseNameNoTier].\n\n"
 rite_growth.0010.desc.divergence.minor: "Connu de ses adeptes sous le nom de [new_rite.GetName|l], ce rite ne diffère que légèrement du [source_rite.GetAdherentNameNoTooltip|l], "
 rite_growth.0010.desc.divergence.moderate: "Connu sous le nom de [new_rite.GetName|l] par ses adeptes, ce rite est bien trop inhabituel pour de nombreux adeptes [source_rite.GetAdherentNamePlural], "
 rite_growth.0010.desc.divergence.major: "Connu de ses adeptes sous le nom de [new_rite.GetName|l], ce rite comporte des pratiques qui, pour la plupart des adeptes [source_rite.GetAdherentNamePlural], frôlent l’hérésie, "
 rite_growth.0010.desc.differing.tenet: "avec cette nouvelle orientation qui attire l’attention : [differing_tenet.GetBaseName|l]."
 rite_growth.0010.desc.differing.doctrine: "avec la différence la plus notable : [differing_doctrine.GetDescriptiveName]."
 rite_growth.0010.desc.differing.fallback: "mais la différence doctrinale est trop subtile pour pouvoir la définir simplement."
 rite_growth.0010.desc.outro.wildfire: "\n\nCes nouveaux enseignements se répandent rapidement parmi la communauté [origin_faith.GetAdjective]."
 rite_growth.0010.a: "Mon âme est en sécurité avec le rite [ROOT.Char.GetRite.GetAdherentNameNoTooltip]."
 rite_growth.0010.b: "Je devrais pratiquer le rite [new_rite.GetAdherentNameNoTooltip|l] !"
 rite_growth.0010.c: "Pour moi, ça ressemble à de l’hérésie..."
 counties_and_court_converts: "Les [counties|El] et les [courtiers|El] du rite [source_rite.GetAdherentName] adopteront le [new_rite.GetAdherentName|l]"
 rite_growth.0011.notification.title: "[convert_ruler.Custom('FR_le_Char_U_Pi')|U][convert_ruler.GetShortUINameNoTooltip] adopte le rite"
 rite_growth.0011.notification.desc: "[convert_ruler.Custom('FR_le_Char_Pi')|U][convert_ruler.GetTitledFirstName] a rejoint [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName] dans la pratique du rite [new_rite.GetAdherentName|l]"
 iberian_struggle_blocks_holy_war_tt: "Déclarer une [holy_war|El] ne doit pas être bloqué à cause de la [iberian_struggle|El]"
