l_french:
 # Cataclyst event
 blotsven.0001.t: "Une visite inattendue"
 blotsven.0001.desc: "Tard dans la nuit, [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] frappe à ma porte et m’annonce que le peuple est très en colère. [ROOT.Char.GetTopLiege.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetTopLiege.GetTitledFirstName] refuse de célébrer le blót annuel. Or, sans cette fête, les conflits et la famine s’abattront sur nous ! [chaplain.Custom('FR_IlElle')|U] insiste auprès de moi sur l’importance de ce blót et affirme que le peuple considérera le chef de ce blót comme [ROOT.Char.Custom('FR_LeLa')] véritable et légitime [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier].\n\n« Allez-vous célébrer le blót pour le peuple ? »"
 blotsven.0001.a: "C’est une perspective intéressante, je vais me pencher là-dessus."
 blotsven.0001.a.tt: "Démarrez et terminez une activité de fête sacrificielle pour obtenir une revendication."
 blotsven.0001.b: "Pff, jamais !"
 blotsven.0001.b.tt: "Vous laissez passer cette occasion de plaire aux dieux."
 # Eskil barges in
 blotsven.0002.t: "Un missionnaire passionné"
 blotsven.0002.desc: "Juste avant le début du blót, un tumulte m’empêche de prêter serment sur l’anneau de fer. Un groupe de personnes fait irruption sur la place et un homme hurlant se précipite dans notre cercle sacré.\n\n« Au nom [eskil.GetFaith.HighGodNamePossessive] ! Arrêtez ! » crie-t-il en agitant frénétiquement les bras.\n\nIl lève les mains au-dessus de sa tête, crie vers le ciel et exige qu’il punisse ceux qui commettent cet acte païen. Comme sur commande, il se met à pleuvoir. Vous clignez des yeux lorsqu’un éclair zèbre le ciel."
 blotsven.0002.a: "Prenez la pierre la plus proche et jetez-la-lui."
 blotsven.0002.a.tt: "Il n’est pas rare que des missionnaires soient lapidés."
 blotsven.0002.b: "Je prends ma hache et vise sa tête."
 blotsven.0002.b.tt: "De toute évidence, ce tonnerre, c’est Thor qui vient le punir, lui."
 blotsven.0002.c: "Quelque chose dans sa façon de parler m’envoûte..."
 blotsven.0002.c.tt: "Mettez fin au blót et convertissez-vous à la foi [eskil.GetFaith.GetAdjective]."
 blotsven.0002.toast.m.tt: "[eskil.Custom('FR_le_Char_Pi')|U][eskil.GetTitledFirstName] a été mutilé[eskil.Custom('FR_E')] par moi."
 blotsven.0002.toast.k.tt: "[eskil.Custom('FR_le_Char_Pi')|U][eskil.GetTitledFirstName] a été tué[eskil.Custom('FR_E')] par moi."
 # He missed
 blotsven.0003.t: "Un missionnaire en colère"
 blotsven.0003.desc: "[eskil.Custom('FR_le_Char_Pi')|U][eskil.GetTitledFirstName] s’enfuit en hurlant. Mon lancer a raté sa cible et je me retrouve maintenant face à un missionnaire encore plus furieux."
 blotsven.0003.a: "Tuez-le !"
 blotsven.0003.a.tt: "Ordonnez aux gens autour de vous de faire ce que vous n’avez pas réussi à faire."
 blotsven.0003.b: "Est-ce un signe ? Peut-être que son Dieu est plus puissant que le mien..."
 blotsven.0003.b.tt: "Mettez fin au blót et convertissez-vous à la foi [eskil.GetFaith.GetAdjective]."
 blotsven.0003.toast.tt: "[eskil.Custom('FR_le_Char_Pi')|U][eskil.GetTitledFirstName] a été exécuté[eskil.Custom('FR_E')] sur mes ordres."
 blotsven.0003.toast.desc.tt: "Ses hommes ont ramassé son corps et l’ont ramené à Tuna."
 # Ending event
 blotsven.0004.t: "Retour et renaissance"
 blotsven.0004.desc: "La foule s’est dispersée et tout le monde descend désormais la colline en petits groupes ou seul. Je me sens renaître. Je n’ai peut-être pas atteint le royaume des cieux, mais mon âme éternelle est sauvée."
 blotsven.0004.a: "Il est temps de rentrer."
 gruesome_activity_eskil_slain_title: "Eskil tué"
 gruesome_activity_eskil_slain: "Eskil a été tué. Pour son sacrifice, il a été fait saint."
