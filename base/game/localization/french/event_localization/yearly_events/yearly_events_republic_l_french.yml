l_french:
 yearly_republic.1001.t: "Venez vous coucher, mon amour"
 yearly_republic.1001.desc: "Alors même que minuit approche, mon épou[spouse_target.Custom('FR_XSe')] [spouse_target.Custom('FR_le_Char_Pi')][spouse_target.GetTitledFirstName] me trouve le nez plongé dans des documents, en train de passer en revue les registres une énième fois.\n\n« Venez vous coucher, mon amour », me supplie-t-[spouse_target.Custom('FR_IlElle')]. « Le travail peut bien attendre demain, non ? »\n\n« À moins que... », me dit [spouse_target.GetFirstNameNoTooltip] d’un air attentionné, « je puisse vous aider ? »"
 yearly_republic.1001.a: "Vous pouvez aller me chercher d’autres bougies, mon amour."
 yearly_republic.1001.b: "J’ai pris trop de retard dans mon travail. Laissez-moi tranquille !"
 yearly_republic.1001.c: "Tant que je suis avec vous, le monde entier peut bien attendre."
 yearly_republic.1001.communal: "Tous les [vassals|El] gagnent #P 10#! points d’opinion envers #value vous#!"
 yearly_republic.1002.t: "Mariage tumultueux"
 yearly_republic.1002.desc: "Mon mariage avec [spouse_target.Custom('FR_le_Char_Pi')][spouse_target.GetTitledFirstName] a connu son lot de turbulences, à croire que nous ne sommes d’accord sur rien. Je n’ai aucun doute sur le fait qu’[spouse_target.Custom('FR_IlElle')] informe régulièrement sa famille de mes « défauts » par le biais de nombreuses lettres.\n\nJ’espérais que mon mariage renforcerait mes intérêts commerciaux avec la Maison [spouse_target.GetDynastyHouseName], mais à chaque fois que je rencontre leurs agents ou leurs clients en ville, je vois la méfiance dans leur regard.\n\nSi nous ne faisons rien, ce poison continuera de se répandre au sein de nos deux familles, comme le sang infecté qui s’écoule d’une plaie."
 yearly_republic.1002.a: "J’achèterai la gratitude de [spouse_target.GetFirstNameNoTooltip] et de sa Maison."
 yearly_republic.1002.b: "Je vais falsifier ses lettres pour chanter mes louanges."
 yearly_republic.1002.c: "Je jure devant [ROOT.Char.GetFaith.HighGodName] que je vais m’améliorer."
 yearly_republic.1002.d: "Qu’ils pensent ce qu’ils veulent."
 yearly_republic.1002.tt.falsifying_success.desc: "Vous modifiez les lettres de votre conjoint pour améliorer votre image"
 yearly_republic.1002.falsifying_success.toast: "La Maison [spouse_target.GetDynastyHouseName] est persuadée que vous avez fait des efforts"
 yearly_republic.1002.tt.falsifying_failure.desc: "Vous n’avez pas réussi à falsifier les lettres de votre conjoint"
 yearly_republic.1002.falsifying_failure.toast: "La Maison [spouse_target.GetDynastyHouseName] a encore plus mauvaise opinion de vous"
 yearly_republic.1002.tt.impress_spouse_success.desc: "Vos efforts impressionnent votre conjoint"
 yearly_republic.1002.impress_spouse_success.toast: "La Maison [spouse_target.GetDynastyHouseName] salue vos efforts"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "Vos efforts n’impressionnent pas votre conjoint"
 yearly_republic.1002.impress_spouse_failure.toast: "La Maison [spouse_target.GetDynastyHouseName] considère que vous êtes un cas désespéré"
 yearly_republic.1003.t: "L’honneur de la rue"
 yearly_republic.1003.desc: "« Imbécile ! Se battre dans la rue peut provoquer une véritable querelle entre les Maisons ! Regardez-vous : vous saignez ! », crie mon épou[spouse_target.Custom('FR_XSe')] [spouse_target.Custom('FR_le_Char_Pi')][spouse_target.GetTitledFirstName] en voyant m[ROOT.Char.Custom2('FR_RelationToMe_OnA', rook_01)] [rook_01.Custom('FR_le_Char_Pi')][rook_01.GetTitledFirstName]. Mais [rook_01.Custom('FR_LeLa')] jeune débauché[rook_01.Custom('FR_E')] se contente d’en rire, tandis que son sang coule sur mon parquet.\n\n« Vous devriez voir la tête de mon adversaire ! [rook_02.GetFirstName], cette espèce de [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))] rentre chez [rook_02.Custom('FR_LuiElle')] en boîtant à l’heure qu’il est. »\n\nAh, ces bandes de jeunes ! Ils sillonnent les rues avec leurs armes et leur insolence à toute épreuve, se battent et commettent toutes sortes d’infractions dans le seul but de s’amuser.\n\n« Ce n’était qu’une petite bagarre de rien du tout. Tout va bien, m[rook_01.Custom2('FR_RelationToMeShort_OnA', spouse_target)], je n’ai fait que défendre le nom de notre famille face à la calomnie."
 yearly_republic.1003.a: "Ah, la folie de la jeunesse."
 yearly_republic.1003.b: "[rook_02.GetNameNoTooltip] est clairement en tort. Nous exigeons une compensation !"
 yearly_republic.1003.c: "Nous enverrons un cadeau à la Maison [rook_02.GetDynastyHouseNameNoTooltip] pour arranger les choses."
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "Vos accusations à l’encontre de ma Maison sont infondées, vaines, et totalement mensongères.\n\nVous ne recevrez rien de notre part, à moins que vous ne décidiez malheureusement d’insister, auquel cas nos lames se feront un plaisir de côtoyer votre gorge."
 yearly_republic.1004.b.desc: "En tant que chef de la Maison [other_house_character_01.GetDynastyHouseName], je regrette profondément ces frictions entre nos familles. Je me dois de m’excuser pour ce désagrément, et vous supplie d’accepter ce cadeau au nom de mon remords."
 yearly_republic.1004.a: "Ils regretteront ce manque de respect !"
 yearly_republic.1004.b: "Bien, nous aurons notre compensation en temps voulu."
 yearly_republic.1004.c: "Nous acceptons notre dû."
 yearly_republic.1004.d: "Que cela marque la fin de la discorde entre nous."
 yearly_republic.1005.t: "Le veto du peuple"
 yearly_republic.1005.desc: "La discorde entre la Maison [other_house_character_01.GetDynastyHouseName] et la mienne s’est de nouveau propagée dans les rues de [capital_01.GetName], nos transporteurs se disputant le droit de passage jusqu’à ce que la route finisse par être totalement bloquée. Encore un énième différend, pensais-je, avant que la foule ne se rassemble devant ma porte.\n\n« Ça suffit ! », cria un homme. « On ne peut pas s’occuper de nos affaires tant que les Maisons [ROOT.Char.GetDynastyHouseName] et [other_house_character_01.GetDynastyHouseNameNoTooltip] continueront de se chamailler. Arrêtez d’entraîner toute la ville dans votre conflit ! »\n\nM[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', house_member_01)] [house_member_01.Custom('FR_le_Char_Pi')][house_member_01.GetTitledFirstName] ricane ouvertement. « Qui sont-ils pour nous dire ce que nous devons faire ? »"
 yearly_republic.1005.a: "Non, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', house_member_01)]. Le moment est venu de nous entretenir avec la Maison [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.b: "Grâce à mon éloquence, je rejetterai la faute sur la Maison [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.c: "Gardes ! Éloignez ces gueux de ma porte."
 yearly_republic.1005.tt.oratory_blame.desc: "Éblouissez la foule avec votre éloquence"
 yearly_republic.1005.tt.oratory_blame.toast: "Vous rejetez les problèmes sur la Maison [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Les railleries de la foule vous empêchent de parler"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "Vous échouez à rejeter la faute sur la Maison [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "Vous avez raison. Le moment est venu de nous réunir et de faire place à la raison, pour le bien de ceux qui ne sont pas encore nés, et pour la survie de la république. Nous acceptons de vous rencontrer."
 yearly_republic.1006.b.desc: "Malheureusement, nous ne voyons pas pourquoi nous devrions vous laisser l’occasion de nous mentir en face. Sans doute cherchez-vous un moyen plus facile de nous nuire. Nous refusons toute négociation."
 yearly_republic.1006.a: "Excellent !"
 yearly_republic.1006.b: "Malédiction !"
 yearly_republic.1007.t: "Détente entre les Maisons [ROOT.Char.GetDynastyHouseNameNoTooltip] et [other_house_character_01.GetDynastyHouseNameNoTooltip]"
 yearly_republic.1007.desc: "La tension est palpable, tandis que je prends place en face [other_house_character_01.Custom('FR_du_Char_Pi')][other_house_character_01.GetTitledFirstName] dans un lieu neutre. Nos clients sont présents, répartis en deux camps tels deux armées qui se toiseraient de part et d’autre du champ de bataille. Des poignards cachés sous leurs manteaux, probablement.\n\n« Alors... », commence [other_house_character_01.GetFirstNameNoTooltip] d’une petite voix. « Dites-moi ce que vous avez à me dire. »\n\nTous les regards se tournent vers moi. Je rassemble alors mes esprits et je me lance."
 yearly_republic.1007.a: "Cette querelle est mauvaise pour les affaires."
 yearly_republic.1007.b: "Nous devrions faire la paix, en tant que bons [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]."
 yearly_republic.1007.c: "Du sang a été versé. Qu’il nous unisse, à présent."
 yearly_republic.1007.d: "Réglons cela à l’acier une bonne fois pour toutes !"
 yearly_republic.1007.tt.detente_business.desc: "Vous persuadez [other_house_character_01.Custom('FR_le_Char_U_Pi')][other_house_character_01.GetShortUINameNoTooltip] grâce à votre argumentation"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.Custom('FR_le_Char_U_Pi')|U][other_house_character_01.GetShortUINameNoTooltip] est convaincu[other_house_character_01.Custom('FR_E')]"
 yearly_republic.1007.tt.detente_business_failure.desc: "Vous ne parvenez pas à convaincre [other_house_character_01.Custom('FR_le_Char_U_Pi')][other_house_character_01.GetShortUINameNoTooltip] grâce à votre argumentation"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.Custom('FR_le_Char_U_Pi')|U][other_house_character_01.GetShortUINameNoTooltip] n’est pas totalement convaincu[other_house_character_01.Custom('FR_E')]"
 yearly_republic.1007.detente_business.change.desc: "Les deux Maisons ont accepté de régler leurs différends pour des raisons commerciales."
 yearly_republic.1007.piety.change.desc: "Les deux Maisons ont accepté de régler leurs différends par amour [ROOT.Char.GetFaith.HighGodNamePossessive]."
 yearly_republic.1007.detente_marriage.change.desc: "Les deux Maisons ont accepté de régler leurs différends par un mariage."
 yearly_republic.1007.duel_win.desc: "Vous remportez le duel"
 yearly_republic.1007.duel_win.toast: "Vous poignardez [other_house_character_01.Custom('FR_le_Char_U_Pi')][other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.Custom('FR_le_Char_U_Pi')|U][other_house_character_01.GetShortUINameNoTooltip] remporte le duel"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.Custom('FR_le_Char_U_Pi')|U][other_house_character_01.GetShortUINameNoTooltip] vous poignarde"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.Custom('FR_le_Char_U_Pi')|U][other_house_character_01.GetShortUINameNoTooltip] est blessé[other_house_character_01.Custom('FR_E')] ou tué[other_house_character_01.Custom('FR_E')]"
 yearly_republic.1007.duel_loss.custom: "Vous êtes blessé[ROOT.Char.Custom('FR_E')] ou tué[ROOT.Char.Custom('FR_E')]"
 yearly_republic.1007.c.tt.suitable_pair: "Les deux Maisons comptent des membres célibataires qui peuvent se marier entre eux"
 house_relation_reason_falsify_good_desc: "A reçu des lettres à propos de la bonne réputation du chef de la Maison"
 house_relation_reason_falsify_bad_desc: "A découvert que le chef de la Maison a falsifié des lettres"
 house_relation_reason_thorny_desc: "Un mariage malheureux sème la discorde"
 house_relation_reason_bribery_good_desc: "A couvert son conjoint d’or et de bijoux"
 house_relation_reason_street_combat_desc: "A participé à une bagarre de rue entre les jeunes des deux Maisons"
 house_relation_reason_business_argument_desc: "A discuté des avantages du commerce"
 house_relation_reason_house_blamed_desc: "A rejeté la faute sur les troubles sociaux"
 house_relation_reason_houses_aligned_desc: "A fait cause commune lors d’un rassemblement entre des Maisons similaires"
 house_relation_reason_cooperation_desc: "A renforcé la coopération entre les Maisons"
 demand_reparation_for_fight_desc: "A envoyé une lettre exigeant une compensation"
 pay_reparation_for_fight_desc: "A envoyé une lettre avec un cadeau et des excuses"
 offer_a_sitdown_desc: "A envoyé une lettre proposant une détente"
 yearly_republic.1008.t: "Des loups déguisés en marchands"
 yearly_republic.1008.desc: "J’ai eu vent d’une information qui a retenu mon attention :\nL’un des capitaines marchands [other_patrician_01.Custom('FR_du_Char_Pi')][other_patrician_01.GetTitledFirstName] s’est livré à des actes de banditisme généralisé, tout en exécutant des contrats commerciaux sur le pourtour méditerranéen, puis en revendant les marchandises volées pour son profit personnel. Un vrai loup déguisé en agneau !\n\nS’il est impossible de savoir si [other_patrician_01.GetFirstNameNoTooltip] trempe dans ce complot, cela n’aurait de toute façon que peu d’importance pour les membres de l’assemblée dont les navires et les biens ont été pillés."
 yearly_republic.1008.a: "Engagez immédiatement ce capitaine pour qu’[bandit_01.Custom('FR_IlElle')] travaille avec vous."
 yearly_republic.1008.b: "Menacez le capitaine pour qu’[bandit_01.Custom('FR_IlElle')] partage son butin."
 yearly_republic.1008.c: "Menacez [other_patrician_01.GetFirstNameNoTooltip] pour gagner en influence."
 yearly_republic.1009.t: "Le salon des secrets"
 yearly_republic.1009.desc: "Je passe l’après-midi dans un élégant salon tenu par [patrician_spouse_01.Custom('FR_le_Char_Pi')][patrician_spouse_01.GetTitledFirstName].\n\nAlors que je discute avec m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', relation_01)] [relation_01.Custom('FR_le_Char_Pi')][relation_01.GetTitledFirstName] en dégustant des bouteilles [patrician_spouse_01.Custom('GetExpensiveDrink')], je remarque une petite ombre qui se déplace sur un mur près d’un grand rideau. Après observation, j’en déduis qu’il s’agit d’un bras effectuant des mouvements légers et précis. Quand [relation_01.GetFirstNameNoTooltip] cesse de parler, le mouvement s’interrompt à son tour. Quelqu’un, derrière ce rideau, écrit tout ce qui se dit dans le salon !\n\nIl semblerait que notre [patrician_spouse_01.Custom('HostessHost')] [patrician_spouse_01.GetFirstNameNoTooltip] et [Select_CString(patrician_husband_01.IsFemale,'sa femme','son mari')] [patrician_husband_01.Custom('FR_le_Char_Pi')][patrician_husband_01.GetTitledFirstName] espionnent les conversations de leurs invités."
 yearly_republic.1009.a: "Je dois prévenir tout le monde !"
 yearly_republic.1009.a.tt: "Gagne #P 20#! d’opinion envers #value vous#! et #N -25#! d’opinion envers [patrician_spouse_01.Custom('FR_le_Char_U_Pi')][patrician_spouse_01.GetShortUINameNoTooltip] et [patrician_husband_01.Custom('FR_le_Char_U_Pi')][patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.b: "Quelle bonne idée ! Je devrais en faire autant."
 yearly_republic.1009.c: "Faire chanter [patrician_spouse_01.GetFirstNameNoTooltip] et [Select_CString(patrician_husband_01.IsFemale,'sa femme','son mari')] pour ne pas révéler leur secret."
 yearly_republic.1009.c.success.desc: "Vous vous montrez plus malin[ROOT.Char.Custom('FR_E')] que [patrician_spouse_01.Custom('FR_le_Char_U_Pi')][patrician_spouse_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.success.toast: "Vous gagnez un hameçon fort contre [patrician_husband_01.Custom('FR_le_Char_U_Pi')][patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.Custom('FR_le_Char_U_Pi')|U][patrician_spouse_01.GetShortUINameNoTooltip] se montre plus malin[patrician_spouse_01.Custom('FR_E')] que vous"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.Custom('FR_le_Char_U_Pi')|U][patrician_husband_01.GetShortUINameNoTooltip] devient petit à petit votre rival[patrician_husband_01.Custom('FR_E')]"
 yearly_republic.1009.flavor: "Qui sait ce que vous pourriez entendre ?"
 yearly_republic.1009.b.secret_learned: "Votre opération d’espionnage a révélé un secret"
 yearly_republic.1010.t: "Des patriciens dans les combles"
 yearly_republic.1010.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', relation_01)] [relation_01.Custom('FR_le_Char_Pi')][relation_01.GetTitledFirstName] me retrouve en pleine promenade et me chuchote :\n\n« L’ambassad[ambassador_01.Custom('FR_EurRice')] [ambassador_01.GetFirstName] est rentré[ambassador_01.Custom('FR_E')] de [ambassador_mission_location_01.GetName] et présentera son rapport au cours d’une réunion à huis clos ce soir, au palais. »\n\n[relation_01.Custom('FR_IlElle')|U] secoue la tête. « Oh, imaginez l’avantage commercial que ce serait de connaître le contenu de ce rapport avant qu’il ne soit présenté à l’assemblée ! »\n\nAu loin, tandis que j’écoute [relation_01.GetFirstNameNoTooltip], j’observe le toit du palais."
 yearly_republic.1010.a: "Nous allons enlever des tuiles du toit du palais pour écouter les conversations à l’intérieur."
 yearly_republic.1010.b: "Nous pouvons peut-être convaincre [ambassador_01.GetFirstNameNoTooltip] ?"
 yearly_republic.1010.c: "Nous le connaîtrons en temps voulu."
 yearly_republic.1010.a.success.desc: "Vous écoutez discrètement le rapport"
 yearly_republic.1010.a.success.toast: "Vous écoutez discrètement le rapport"
 yearly_republic.1010.a.mixed.desc: "Vous tombez du toit"
 yearly_republic.1010.a.mixed.toast: "Vous tombez du toit"
 yearly_republic.1010.a.failure.desc: "Vous tombez au milieu de l’assemblée"
 yearly_republic.1010.a.failure.toast: "Vous tombez au milieu de l’assemblée"
 yearly_republic.1010.a.mixed.custom: "Vous et [relation_01.Custom('FR_le_Char_U_Pi')][relation_01.GetShortUIName] gagnez le [trait|El] [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.Custom('FR_le_Char_U_Pi')|U][republic_ruler.GetShortUIName|U] perd #N 25#! d’[opinion|El] envers vous et [relation_01.Custom('FR_le_Char_U_Pi')][relation_01.GetShortUIName] #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW Crime — Permet [republic_ruler.Custom('FR_au_Char_U_Pi')][republic_ruler.GetShortUIName] de vous emprisonner à juste titre [Select_CString(And(ROOT.Char.IsFemale, relation_01.IsFemale), 'toutes', 'tous')] les deux#!"
 yearly_republic.1010.b.accept: "[ambassador_01.Custom('FR_le_Char_U_Pi')|U][ambassador_01.GetShortUINameNoTooltip] est ouvert[ambassador_01.Custom('FR_E')] à un pot-de-vin"
 yearly_republic.1010.b.refuse: "[ambassador_01.Custom('FR_le_Char_U_Pi')|U][ambassador_01.GetShortUINameNoTooltip] est offensé[ambassador_01.Custom('FR_E')] par votre proposition"
 yearly_republic.1010.b.success.toast: "[ambassador_01.Custom('FR_le_Char_U_Pi')|U][ambassador_01.GetShortUINameNoTooltip] vous donne le rapport"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.Custom('FR_le_Char_U_Pi')|U][ambassador_01.GetShortUINameNoTooltip] refuse vos pots-de-vin"
 yearly_republic.1011.t: "Convocation au conseil"
 yearly_republic.1011.desc: "Une fois encore, j’ai été convoqué[ROOT.Char.Custom('FR_E')] pour participer à l’un des nombreux conseils secrets qui permettent à la république de fonctionner.\n\nCes obligations m’empêchent de consacrer du temps à ma famille et à mon activité, mais en tant que noble, je ne peux pas refuser une convocation sans une raison valable ou une autorisation de l’assemblée."
 yearly_republic.1011.a: "Je vais demander à mon médecin de dire que je suis alité[ROOT.Char.Custom('FR_E')]."
 yearly_republic.1011.b: "Puisque m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', sick_person_01)] est malade, j’ai de bonnes raisons de rester chez moi."
 yearly_republic.1011.c: "Je vais demander une exception de 5 ans à l’assemblée."
 yearly_republic.1011.d: "C’est mon devoir d’y aller."
 yearly_republic.1011.c.success.desc: "L’assemblée accorde son autorisation"
 yearly_republic.1011.c.success.toast: "L’assemblée a accordé son autorisation"
 yearly_republic.1011.c.failure.desc: "L’assemblée n’accorde pas son autorisation"
 yearly_republic.1011.c.failure.toast: "L’assemblée n’a pas accordé son autorisation"
 yearly_republic.1012.t: "La procession [ROOT.Char.Custom('FR_du_Char_L')][ROOT.Char.GetTitleAsNameNoTooltip|l]"
 yearly_republic.1012.desc: "L’enthousiasme de la foule est palpable, alors que le cortège [ROOT.Char.Custom('FR_du_Char_L')][ROOT.Char.GetTitleAsName|l] sort par la porte du palais et entame sa procession dans toute la ville.\n\nLes fonctionnaires ouvrent la marche par ordre d’importance et de prestige, suivis par moi : [ROOT.Char.Custom('FR_le_Char_L')][ROOT.Char.GetTitleAsNameNoTooltip|l] dans sa plus belle tenue d’apparat, les symboles de mon autorité brandis bien haut pour que le peuple puisse les admirer. \nDerrière moi défilent les patriciens, classés selon la renommée de leur Maison.\n\nChacun est à sa place, la hiérarchie et la gloire de notre république visibles aux yeux de tous au cours de cette cérémonie solennelle !"
 yearly_republic.1012.a: "Pour la république ! Pour le peuple !"
 yearly_republic.1012.b: "Gloire à l’assemblée !"
 yearly_republic.1012.c: "C’est le reflet de MA gloire !"
 yearly_republic.1012.c.tt: "Pendant les #V 10#! prochaines années, adopter la [succession_law|El] $republican_despot_succession_law$ coûte #P 50 %#! de moins en [prestige|El]"
 yearly_republic.1013.t: "Le mariage avec la mer"
 yearly_republic.1013.desc: "Le [Glossary( '#bold Bucentaure#!', 'BUCENTAUR_GLOSS' )] a franchi la dernière des îles barrières et l’immensité salée de la mer Adriatique s’étend devant moi. [bishop_01.Custom('FR_le_Char_Pi')|U][bishop_01.GetTitledFirstName] me tend l’anneau et recule.\nJe le brandis bien haut pour le montrer aux dignitaires présents et, comme le veut le rituel, je le jette dans la mer.\n\n« [Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )] », dis-je solennellement, et tandis que la foule à bord applaudit, le mariage entre notre république et la mer — source de notre richesse et de notre puissance — est désormais acté."
 yearly_republic.1013.a: "Nous régnons sur les vagues !"
 yearly_republic.1013.b: "Un rituel aussi stupide qu’inutile."
 yearly_republic.1013.c: "J’arrive, mon amour !"
 yearly_republic.1013.d: "Je resterai toujours fidèle à la mer !"
 yearly_republic.1014.t: "Des Maisons en harmonie"
 yearly_republic.1014.desc: "Sur invitation [faction_head_01.Custom('FR_du_Char_Pi')][faction_head_01.GetTitledFirstName], les chefs de la Maison se sont rassemblés avec pour ambition [faction_head_01.GetHouse.GetHouseAspiration.GetName].\n\n« Mes amis ! Dans ces moments comme aujourd’hui, nous devons rester soudés et concilier nos intérêts. Sinon, les autres factions de notre chère république profiteront de l’occasion pour nous diviser et nous anéantir. »\n\nNous discutons tard dans la nuit, et bien que nos désaccords soient nombreux, il est possible qu’une voix forte parvienne à combler ces fossés et à former un front uni."
 yearly_republic.1014.a: "« Nous devrions tous rejoindre les guelfes. »"
 yearly_republic.1014.b: "« Nous devrions tous rejoindre les gibelins. »"
 yearly_republic.1014.c: "« Renforçons les liens entre nos Maisons. »"
 yearly_republic.1014.d: "« Nous devons mettre un terme à toutes les rivalités entre nous. »"
 yearly_republic.1014.e: "« Nous devrions concilier nos intérêts commerciaux. »"
 yearly_republic.1014.e.tt: "Tous les [patricians|El] ayant l’[house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] gagnent [GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip] pendant 2 ans"
 yearly_republic.1014.a.tt: "Tous les [patricians|El] ayant l’[house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] deviennent membres du [situation_participant_group|El] [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName]"
 yearly_republic.1014.b.tt: "Tous les [patricians|El] ayant l’[house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] deviennent membres du [situation_participant_group|El] [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName]"
 yearly_republic.1014.c.tt: "Tous les [patricians|El] ayant l’[house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] améliorent les [house_relations|El] entre eux"
 yearly_republic.1014.d.tt: "Les rivalités et les inimitiés entre les [patricians|El] ayant l’[house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] prennent fin"
 yearly_republic.1014.tt.align_guelphs_success.desc: "L’assemblée est convaincue, et les Maisons jurent fidélité aux guelfes"
 yearly_republic.1014.align_guelphs_success.toast: "Les Maisons se joignent aux guelfes"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "Le débat tourne au vinaigre, et les Maisons conservent leur propre conseil"
 yearly_republic.1014.align_guelphs_failure.toast: "Les Maisons restent divisées"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "L’assemblée est convaincue, et les Maisons jurent fidélité aux gibelins"
 yearly_republic.1014.align_ghibellines_success.toast: "Les Maisons se joignent aux gibelins"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "Le débat tourne au vinaigre, et les Maisons conservent leur propre conseil"
 yearly_republic.1014.align_ghibellines_failure.toast: "Les Maisons restent divisées"
 yearly_republic.1014.d.toast: "Les vieilles rancunes sont désormais enterrées"
 yearly_republic.1014.e.toast: "Les Maisons unissent leurs intérêts"
 yearly_republic.1015.t: "De l’or pour une voix"
 yearly_republic.1015.desc: "[patrician.Custom('FR_le_Char_Pi')|U][patrician.GetTitledFirstName] me rejoint alors que je me promène sur le marché. [patrician.Custom('FR_IlElle')|U] s’approche de moi tout sourire.\n\n« Ah, comme c’est agréable d’échapper à l’ennui des votes à l’assemblée ! Je ne sais jamais que voter. Un esprit aiguisé comme le vôtre est semblable à un phare doré dans le brouillard pour quelqu’un comme moi, qui peine à trouver sa voie au milieu de ces questions politiques si délicates », me dit-[patrician.Custom('FR_IlElle')] pompeusement.\n\n« Mais je suis à court d’argent. Comment un pauvre batelier pourrait-il s’orienter la prochaine fois qu’il faudra voter à l’assemblée ? »"
 yearly_republic.1015.a: "Dites-moi votre prix."
 yearly_republic.1015.c: "Mes propositions seront adoptées légitimement."
 yearly_republic.1016.t: "Une voix à s’adjuger"
 yearly_republic.1016.desc: "[patrician.Custom('FR_le_Char_Pi')|U][patrician.GetTitledFirstName] est [Select_CString(patrician.IsFemale,'une petite insolente','un petit insolent')], mais [patrician.Custom('FR_IlElle')] a tout de même une voix à l’assemblée, une voix qu’[patrician.Custom('FR_IlElle')] pourrait mettre à ma disposition.\n\nJe dois lui mettre la pression, afin qu’[patrician.Custom('FR_IlElle')] comprenne parfaitement les conséquences qu’entraînerait ma déception."
 yearly_republic.1016.a: "Menacez ses intérêts commerciaux."
 yearly_republic.1016.b: "Que des voyous tendent une embuscade à son courtisan et le rouent de coups."
 yearly_republic.1016.c: "Mettez le feu à sa demeure."
 yearly_republic.1016.d: "Je vais lui enseigner la terreur !"
 yearly_republic.1016.e: "Qu’[patrician.Custom('FR_IlElle')] vote selon sa conscience."
 yearly_republic.1016.pledge.toast: "[patrician.Custom('FR_le_Char_U_Pi')|U][patrician.GetShortUINameNoTooltip] s’engage à voter comme vous"
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip] servira d’exemple."
 yearly_republic.1017.t: "Les rois-philosophes"
 yearly_republic.1017.desc: "Le dîner s’est prolongé jusqu’aux petites heures du matin, les langues se déliant à mesure que l’alcool coulait à flots.\n[debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName] et moi-même avons discuté de tous les sujets possibles et imaginables.\n\nJe constate que je dialogue avec certains des patriciens les plus érudits de la république, compagnie illustre s’il en est. Le genre de personnes que l’on pourrait convaincre de voter dans mon sens la prochaine fois que l’assemblée se réunira, grâce à une argumentation solide et à une réflexion pertinente."
 yearly_republic.1017.a: "Mon éloquence les convaincra."
 yearly_republic.1017.b: "La rigueur de mon raisonnement les impressionnera."
 yearly_republic.1017.c: "Il est peut-être préférable d’écouter et d’apprendre."
 yearly_republic.1017.a.success.desc: "Vous parlez mieux que [debater_orator.GetFirstNameNoTooltip], [Select_CString(debater_orator.IsFemale,'la meilleure oratrice','le meilleur orateur')] à la table"
 yearly_republic.1017.a.success.toast: "La table est convaincue"
 yearly_republic.1017.a.failure.desc: "Vous vous faites mener en bateau par [debater_orator.GetFirstNameNoTooltip], [Select_CString(debater_orator.IsFemale,'la meilleure oratrice','le meilleur orateur')] à la table"
 yearly_republic.1017.a.failure.toast: "Votre rhétorique tombe à plat"
 yearly_republic.1017.b.success.desc: "Votre raisonnement est meilleur que celui de [debater_scholar.GetFirstNameNoTooltip], l’esprit le plus avisé à la table"
 yearly_republic.1017.b.success.toast: "La table est convaincue"
 yearly_republic.1017.b.failure.desc: "Votre raisonnement est réfuté par [debater_scholar.GetFirstNameNoTooltip], l’esprit le plus avisé à la table"
 yearly_republic.1017.b.failure.toast: "Votre argument est réduit à néant"
 yearly_republic.1017.c.toast: "Une soirée passée à écouter"
 yearly_republic.1017.c.tt: "Il y a une petite chance que le débat de ce soir vous marque profondément"
 yearly_republic.1017.c.insight.toast: "Le débat laisse des traces"
 yearly_republic.1018.t: "Les bras chargés de cadeaux"
 yearly_republic.1018.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', benefactor_01)] [benefactor_01.GetName] se présente à ma porte à l’improviste. Après quelques salutations et une chaleureuse embrassade, [benefactor_01.GetFirstNameNoTooltip] me conduit dehors jusqu’à un chariot rempli de marchandises et de bibelots.\n\n« Je m’excuse de ne pas vous avoir prévenu[ROOT.Char.Custom('FR_E')] de ma visite, mais je passais par là et je me suis dit que des marchandises de type [new_curio.GetType] pourraient vous intéresser. »\n\n[benefactor_01.Custom('FR_IlElle')|U] soulève un drap posé sur le chariot, révélant [new_curio.GetName]."
 yearly_republic.1018.a: "« Merci, m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', benefactor_01)] ! »"
 yearly_republic.1018.b: "On pourrait peut-être en obtenir un bon prix ?"
 yearly_republic.1018_domicile_curio_sold_tt: "Plus tard, vous vendez : [new_curio.GetName]."
 yearly_republic.1019.t: "Le souci du détail"
 yearly_republic.1019.desc: "Encore une journée à me promener dans les rues de [event_location_01.GetName] avec m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', benefactor_01)] [benefactor_01.Custom('FR_le_Char_U_Pi')][benefactor_01.GetShortUIName], avec qui il y a toujours quelque chose à voir ou un sujet à aborder.\n\n« Regardez comment ils stockent ces produits. Ils font bien mieux à [target_city.GetNameNoTooltip]. Je vous le dis, [ROOT.Char.GetFirstNameNoTooltip], nous avons beaucoup à apprendre de nos voisins, il suffit d’ouvrir l’œil."
 yearly_republic.1019.a: "« Avez-vous découvert [experience_trade_category_01.GetNameNoTooltip] au cours de vos voyages ? »"
 yearly_republic.1019.b: "« Discutons du marché de [experience_trade_category_02.GetNameNoTooltip]. »"
 yearly_republic.1019.c: "Je devrais faire de l’observation une habitude quotidienne."
 yearly_republic.1020.t: "Accord dans les bains publics"
 yearly_republic.1020.desc: "« ... les affaires marchent quand les partenaires se font confiance, après tout. »\n\nAprès avoir renversé un seau d’eau sur sa tête, [house_benefactor_01.GetFirstName] se tourne à nouveau vers moi et me lance un regard sérieux. « Votre famille a tout notre respect, [ROOT.Char.GetFirstName]. »\n\nLa vapeur des bains publics me voile la vue et la chaleur de l’eau détend mes muscles.\n\n« Vous et vos proches avez toujours été de bons amis pour nous, envers la Maison [house_benefactor_01.GetDynastyHouseNameNoTooltip], et il est tout à fait logique que nous renforcions notre coopération. Ce serait bénéfique pour nos deux Maisons. »"
 yearly_republic.1020.a: "« Nous devrions partager nos agents et nos contacts à l’étranger, afin d’étendre notre portée. »"
 yearly_republic.1020.b: "« Partageons notre expertise et, ensemble, nous serons plus forts. »"
 ## GLOSS
 BUCENTAUR_GLOSS: "Le Bucentaure était la barge d’État dorée de Venise, desservie par des rameurs de l’arsenal et réservée exclusivement aux cérémonies."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! — Latin pour « Nous t’épousons, mer, en signe de véritable et perpétuelle domination »."
