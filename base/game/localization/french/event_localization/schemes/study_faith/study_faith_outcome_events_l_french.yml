l_french:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "Adepte [target.GetAdherentNameNoTooltip] trouvé !"
 study_faith_outcome.0010.desc: "Mes enquêtes discrètes et mes petits pots-de-vin ont porté leurs fruits ! J’ai désormais devant moi [study_faith_target.Custom('FR_le_Char_Pi')][study_faith_target.GetTitledFirstName], supposément de foi [target.GetAdjective].\n\n"
 study_faith_outcome.0010.desc.in_realm: "Cela ne fait pas longtemps que j’ai demandé à rencontrer un [target.GetAdherentName] de mon pays. J’ai maintenant devant moi [study_faith_target.Custom('FR_le_Char_Pi')][study_faith_target.GetTitledFirstName], qui a répondu à mon appel.\n\n"
 study_faith_outcome.0010.d.intimidated: "« Que voulez-vous de moi, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ? » demande-t-[study_faith_target.Custom('FR_IlElle')] en tremblant. Les gardes [study_faith_target.Custom('FR_LeLa')] regardent avec méfiance, prêts à intervenir au moindre signe de sorcellerie."
 study_faith_outcome.0010.d.safe: "« Comment puis-je vous servir, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] ? » demande-t-[study_faith_target.Custom('FR_IlElle')], quelque peu intimidé[study_faith_target.Custom('FR_E')]. Mes gardes ne peuvent s’empêcher de [study_faith_target.Custom('FR_LeLa')] regarder avec curiosité, conscients des rumeurs concernant ma recherche."
 study_faith_outcome.0010.a: "Permettez-moi d’en apprendre davantage sur la foi [target.GetAdjectiveNoTooltip] grâce à vous."
 study_faith_outcome.0010.b: "J’ai changé d’avis."
 study_faith_outcome.0010.b.desc: "On laissera [study_faith_target.Custom('FR_le_Char_Pi')][study_faith_target.GetTitledFirstName] mener sa vie comme bon lui semble."
 study_faith_outcome.0101.t: "Connaître [actor.GetFaith.HighGodName]"
 study_faith_outcome.0101.desc: "Une étude approfondie du rite [actor.GetRite.GetAdherentName] m’a permis de mieux comprendre m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('actor'))] [actor.Custom('FR_le_Char_Pi')][actor.GetTitledFirstName] et, surtout, de suivre la voie empruntée par [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0101.a: "Il est temps que je m’engage sur la voie de la conversion."
 study_faith_outcome.0101.b: "Je ne peux pas abandonner [ROOT.Char.GetFaith.GoodGodNames] !"
 study_faith_outcome.0102.desc: "Je vous remercie pour votre patience et votre générosité, qui m’ont aidé[ROOT.Char.Custom('FR_E')] à progresser malgré mon ignorance. Je suis désormais sur la voie empruntée par [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0102.a: "C’était tout à fait normal que je le fasse."
 study_faith_outcome.0103.desc: "Ma loyauté est pour [recipient.GetFaith.GoodGodNames] ! On ne me fera pas renier le rite [recipient.GetRite.GetAdherentName]."
 study_faith_outcome.0103.a: "La désobéissance a un prix..."
 study_faith_outcome.0111.t: "Difficile de comprendre le rite [actor.GetRite.GetAdherentNameNoTooltip]"
 study_faith_outcome.0111.desc: "L’étude rigoureuse du rite [actor.GetRite.GetAdherentName] ne m’a mené[ROOT.Char.Custom('FR_E')] nulle part ! Non seulement j’ai du mal à suivre la voie empruntée par [actor.GetFaith.GoodGodNames], mais je crains que m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('actor'))] [actor.GetFirstName] ne se fourvoie dans ses croyances."
 study_faith_outcome.0111.a: "Peut-être que la compréhension viendra avec la conversion..."
 study_faith_outcome.0111.b: "Je vais redoubler d’efforts."
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$ : une avancée majeure"
 study_faith_outcome.1000.desc: "Après des heures passées à me plonger dans les livres, des nuits blanches à répéter les rituels, d’innombrables leçons pour maîtriser la théologie [target.GetFaith.GetAdjective], les mystères du rite [target.GetRite.GetAdherentName] se dissipent enfin !\n\nPendant tout ce temps, j’ai essayé d’imiter [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName], mais maintenant je crois comprendre comment [target.Custom('FR_IlElle')] a pu se sentir à l’aise dans la « chaleureuse étreinte » de ce rite."
 study_faith_outcome.1000.a: "Je peux m’initier à pratiquement toutes les confessions !"
 study_faith_outcome.1000.b: "Le rite [scheme.GetTargetCharacter.GetRite.GetAdherentNameNoTooltip] me paraît plus pertinent que le mien..."
 study_faith_outcome.1200.t: "$study_faith$ : un principe ressort clairement"
 study_faith_outcome.1200.desc: "Les murs familiers de mon bureau sont les témoins de mon triomphe silencieux, tandis que j’élabore le principe [target.GetRite.GetAdherentName] de [discovered_tenet.GetName( target.GetRite )|l]. Même si cela peut paraître étrange, avec un peu d’imagination, je peux me représenter [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] et ses proches s’adonnant à cette pratique insolite.\n\nCe n’est qu’une étape sur un long chemin, mais je progresse pas à pas."
 study_faith_outcome.1200.a: "J’aimerais en savoir plus sur chaque pratique [target.GetRite.GetAdjectiveNoTooltip] !"
 study_faith_outcome.1200.b: "Fascinant. Je me demande quel est le lien avec [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )|l] !"
 study_faith_outcome.1200.c: "Tout cela me met mal à l’aise..."
 study_faith_outcome.1400.t: "$study_faith$ : la pratique [target.GetRite.GetAdjectiveNoTooltip]"
 study_faith_outcome.1400.desc: "Pour comprendre le rite [target.GetRite.GetAdherentName], il faut étudier non seulement son cadre métaphysique, mais aussi son influence sur la vie quotidienne.\n\nAprès avoir réfléchi au concept de [discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )|l], j’en ai suffisamment saisi les implications pour le relier aux pratiques de ce rite."
 study_faith_outcome.1400.alt1.desc: "\n\nCela a permis de mettre en évidence les subtilités de leur pratique de [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )|l] !"
 study_faith_outcome.1400.alt2.desc: "\n\nCe n’est qu’un fragment d’un tout bien plus vaste, mais chaque fragment me rapproche un peu plus de la compréhension du rite [target.GetRite.GetAdherentNameNoTooltip] dans son ensemble."
 study_faith_outcome.1400.a: "Des informations utiles. Continuons."
 study_faith_outcome.1400.b: "Je vais travailler tard la nuit."
 study_faith_outcome.1400.c: "Je vais insister pour que [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] m’en dise plus."
 study_faith_outcome.1500.t: "$study_faith$ : au-delà de mes compétences"
 study_faith_outcome.1500.desc: "De longues années d’étude m’ont permis d’aller aussi loin qu’un profane peut le faire. Quels que soient les secrets qui se cachent encore dans le [rite|El] [target.GetRite.GetAdherentName], ils restent l’apanage de ceux qui ont baigné dans sa pratique depuis leur naissance : ils ont été transmis exclusivement aux initiés et soustraits à tout texte, à toute observation et même à l’enseignant le plus patient.\n\nCe que je peux savoir, je le sais désormais."
 study_faith_outcome.1500.a: "J’ai appris tout ce que je pouvais apprendre."
 study_faith_outcome.1500.toast: "$study_faith$ terminée"
 study_faith_outcome.1500.toast.desc: "Vous avez appris chaque [core_tenet|El] et [doctrine|El] du [rite|El] [target.GetRite.GetAdherentName] qu’un profane peut savoir."
 study_faith_scheme_stays_active: "Le [scheme|El] reste actif"
 study_faith_outcome.3000.t: "$study_faith$ : continuer ou arrêter ?"
 study_faith_outcome.3000.desc: "Malheureusement, [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] n’est plus là. C’est dommage, j’avais besoin d[target.Custom('FR_EluiElle')] pour me donner des conseils sur les subtilités de la foi [target.GetFaith.GetAdjective].\n\nCela dit, je n’ai pas besoin d’interrompre mon apprentissage, je dois juste trouver quelqu’un d’autre !"
 study_faith_outcome.3000.alt1.desc: "Malheureusement, [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] n’était pas la personne la mieux placée pour donner des conseils sur les subtilités de la foi [target.GetFaith.GetAdjective].\n\nCela dit, je n’ai pas besoin d’interrompre mon apprentissage, je dois juste trouver quelqu’un d’autre !"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.Custom('FR_le_Char_Pi')|U][potential_continuation_target_1.GetTitledFirstNameNoTooltip] est [Select_CString(potential_continuation_target_1.IsFemale,'une fervente adoratrice','un fervent adorateur')] !"
 study_faith_outcome.3000.b: "Peut-être [potential_continuation_target_2.Custom('FR_le_Char_Pi')][potential_continuation_target_2.GetTitledFirstNameNoTooltip] ? Sa théologie est intéressante."
 study_faith_outcome.3000.c: "Peut-être [potential_continuation_target_3.Custom('FR_le_Char_Pi')][potential_continuation_target_3.GetTitledFirstNameNoTooltip] ?"
 study_faith_outcome.3000.d: "Ah, je cherchais une raison d’arrêter d’étudier ! Hourra !"
 study_faith_scheme_retains_progress: "Le [scheme|El] conserve toute la progression antérieure"
 child_studied_faith_title: "Étude du rite par votre [owner.Custom('GetDaughterSon')] !"
 child_studied_faith_desc: "Votre [owner.Custom('GetDaughterSon')] en a appris davantage sur le [rite|El] [target.GetRite.GetAdherentName]"
 child_studied_faith_invalidated_title: "Complot d’étude du rite de votre enfant non valable"
 child_studied_faith_invalidated_desc: "Le [scheme|El] visant à [GetScheme('study_faith').GetActionName|l] de votre enfant n’est plus valable"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$ : l’aisance de la jeunesse"
 study_faith_ongoing.1000.t.theologian: "$study_faith$ : l’aisance de l’expérience"
 study_faith_ongoing.1000.desc.young: "Mon étude de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] avance à grands pas. J’ai l’impression d’avoir toute la concentration et toute l’énergie du monde !"
 study_faith_ongoing.1000.desc.theologian: "Mon étude de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] avance bien. Il s’avère que son cadre conceptuel ne diffère pas tant que ça de celui d’autres croyances."
 study_faith_ongoing.1000.desc: "\n\n« #EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#! »\n\nMême si je paraphrase peut-être, j’ai le sentiment que l’essence de la foi est respectée, me dis-je alors que je peaufine encore les détails de la formulation.\n\nSi je garde cette rigueur, je connaîtrai bientôt tous les secrets de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] !"
 study_faith_ongoing.1000.a: "Je vais y consacrer tout mon temps !"
 study_faith_ongoing.1000.b: "Je préfère passer mon temps à autre chose..."
 study_faith_ongoing.1010.t: "$study_faith$ : une compréhension approfondie"
 study_faith_ongoing.1010.desc: "#EMP « [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')] »#!\n\nJe sens une présence et lève les yeux de mon analyse des textes sacrés [scheme.GetTargetCharacter.GetFaith.GetAdherentNamePlural]. [lover_target.GetFirstName] se penche sur moi, le regard lubrique.\n\n« Ce texte fait-il référence à la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] ? » demande-t-[lover_target.Custom('FR_IlElle')].\n\n« Quel bonheur d’avoir un[ROOT.Char.Custom('FR_E')] coreligionnaire à la Cour – et qui plus est un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsName|l] ! Peut-être pourrais-je vous aider grâce à ma compréhension un peu plus... approfondie ? »"
 study_faith_ongoing.1010.a: "Retirons-nous dans mes appartements afin d’être tranquilles."
 study_faith_ongoing.1010.b: "Je ne fais que vous observer, [lover_target.Custom('GetDerogatoryNonbeliever')], rien de plus !"
 study_faith_ongoing.1010.c: "Partez, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Je dois me concentrer !"
 study_faith_ongoing.1010.c.tt: "#EMP Vous lui claquez la porte au nez et vous vous remettez à vos études.#!"
 study_faith_ongoing.1011.t: "$study_faith$ : une fausse piste"
 study_faith_ongoing.1011.desc: "Je me doutais de quelque chose depuis un certain temps déjà. Après quelques questions pièges, le mensonge [scheme.GetTargetCharacter.Custom('FR_du_Char_Pi')][scheme.GetTargetCharacter.GetTitledFirstName] est finalement démasqué. Quoi qu’[scheme.GetTargetCharacter.Custom('FR_IlElle')] en dise, sa foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] n’est pas sincère !\n\nLe monde d’un incroyant est certes intrigant, mais, pour approfondir ma compréhension de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip], il vaudrait mieux que je trouve un adepte plus fervent..."
 study_faith_ongoing.1011.a: "Je ne peux plus compter sur [scheme.GetTargetCharacter.Custom('FR_le_Char_Pi')][scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]."
 study_faith_ongoing.1011.b: "[scheme.GetTargetCharacter.Custom('FR_SilSielle')|U] a réussi à le cacher, je pourrais peut-être y arriver aussi..."
 study_faith_ongoing.1011.c: "Mais alors, en quoi croit [scheme.GetTargetCharacter.Custom('FR_le_Char_Pi')][scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] ?"
 study_faith_ongoing.1011.c.tt: "Je vais essayer de percer à jour ses croyances secrètes."
 study_faith_ongoing.1012.t: "$study_faith$ : pratiquant[scheme.GetTargetCharacter.Custom('FR_E')] des rites anciens"
 study_faith_ongoing.1012.desc: "Mes tentatives pour examiner la foi [scheme.GetTargetCharacter.Custom('FR_du_Char_Pi')][scheme.GetTargetCharacter.GetTitledFirstName] ont porté leurs fruits, bien que d’une manière inattendue. [scheme.GetTargetCharacter.Custom('FR_SilSielle')|U] n’est sans aucun doute pas un[scheme.GetTargetCharacter.Custom('FR_E')] adepte de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip], [scheme.GetTargetCharacter.Custom('FR_IlElle')] semble toutefois suivre les rites étranges et oubliés de la foi [actual_faith.GetAdjective]. Ses pratiques s’apparentent en quelque sorte à... de la sorcellerie.\n\nCette découverte me bouleverse. Y a-t-il un moyen d’en tirer parti ?"
 study_faith_ongoing.1012.a: "C’est tout de même intéressant à savoir."
 study_faith_ongoing.1012.b: "J’aurai besoin d’un nouveau professeur pour mon étude."
 study_faith_ongoing.1012.b.tt: "Vous essaierez de trouver un professeur similaire pour continuer votre étude de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1012.c: "Cela semble en fait bien plus intéressant que la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] !"
 study_faith_ongoing.1012.c.tt: "Vous allez maintenant étudier la foi [actual_faith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1013.t: "$study_faith$ : plus [Select_CString(scheme.GetTargetCharacter.IsFemale,'comédienne','comédien')] que mystique"
 study_faith_ongoing.1013.desc: "Mes tentatives pour cerner la foi [scheme.GetTargetCharacter.Custom('FR_du_Char_Pi')][scheme.GetTargetCharacter.GetTitledFirstName] ont échoué. Derrière sa façade pieuse, sa vision du monde semble totalement dépourvue de tout fondement théologique.\n\nPeut-être suit-[scheme.GetTargetCharacter.Custom('FR_IlElle')] les principes de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] simplement par commodité, pour gagner en influence ou par souci de sécurité ?\n\nQuelles que soient ses raisons, cette personne ne s’intéresse pas aux croyances qu’elle défend."
 study_faith_ongoing.1013.a: "Quelle perte de temps ! J’en ai fini avec la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1020.t: "$study_faith$ : [Select_CString(faith_helper.IsFemale,'une croyante locale','un croyant local')]"
 study_faith_ongoing.1020.desc: "Il semble que mon étude de la pratique [scheme.GetTargetCharacter.GetFaith.GetAdjective] soit parvenue jusqu’aux oreilles [faith_helper.Custom('FR_du_Char_Pi')][faith_helper.GetTitledFirstName]. C’est [Select_CString(faith_helper.IsFemale,'une pratiquante locale','un pratiquant local')], et [faith_helper.Custom('FR_IlElle')] propose de m’aider.\n\n« Je ne demande pas plus qu’un petit geste de reconnaissance pour ma contribution, [ROOT.Char.Custom('FR_MonseigneurMadame')|U] », précise-t-[faith_helper.Custom('FR_IlElle')]."
 study_faith_ongoing.1020.a: "Si vous m’aidez, cet or sera à vous."
 study_faith_ongoing.1020.b: "Une faveur pour une faveur ?"
 study_faith_ongoing.1020.c: "Oh, vous êtes si désintéressé[faith_helper.Custom('FR_E')] en offrant de m’aider, gratuitement !"
 study_faith_ongoing.1020.d: "Merci, mais je peux me débrouiller tout[ROOT.Char.Custom('FR_E')] seul[ROOT.Char.Custom('FR_E')]."
 study_faith_ongoing.1020.c.success: "Vous persuadez [faith_helper.GetFirstNameNoTooltip] de vous aider"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] voit clair dans votre manipulation"
 study_faith_ongoing.1030.t: "$study_faith$ : [scheme.GetTargetCharacter.GetFaith.ReligiousText]"
 study_faith_ongoing.1030.desc: "[Select_CString(chosen_peasant.IsFemale,'Une femme','Un homme')] s’approche de moi avec un sourire avide.\n\n« Est-il vrai que vous vous intéressez aux enseignements [scheme.GetTargetCharacter.GetFaith.GetAdherentNamePlural], [ROOT.Char.Custom('FormOfAddressForLiege')|U] ? Mon père a rapporté [scheme.GetTargetCharacter.GetFaith.ReligiousText] que voici d’un de ses voyages à [holy_site.GetNameNoTier] ! »\n\n« Je n’en ai pas l’utilité, car je ne sais pas lire. Je vous les céderais volontiers en échange d’un peu d’argent. »"
 study_faith_ongoing.1030.a: "Quelle chance ! Prenez ces pièces."
 study_faith_ongoing.1030.b: "Ces ouvrages ne sont pas aussi rares que ce que vous pourriez penser..."
 study_faith_ongoing.1030.b.flavor: "Négociez avec [Select_CString(chosen_peasant.IsFemale,'cette brocanteuse improvisée','ce brocanteur improvisé')]"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] accepte le marché"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] se sent insulté[chosen_peasant.Custom('FR_E')] par votre offre"
 study_faith_ongoing.1030.c: "Gardes, confisquez-lui ces écrits païens !"
 study_faith_ongoing.1030.d: "Escroc ! Disparaissez !"
 study_faith_ongoing.1040.t: "$study_faith$ : de l’admiration"
 study_faith_ongoing.1040.desc: "Quelle chance ! J’ai reçu plusieurs lettres dans lesquelles [target.Custom('FR_le_Char_Pi')][target.GetTitledFirstName] salue mes efforts pour apprendre les subtilités de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective]. [target.Custom('FR_IlElle')|U] va même jusqu’à me qualifier de « [ROOT.Char.Custom('FR_FaithGenderedAdj')] hors pair » pour mon étude de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip].\n\nJ’apprécie d’être reconnu[ROOT.Char.Custom('FR_E')] pour mon travail acharné !"
 study_faith_ongoing.1040.a: "Scribes ! Envoyez un mot de remerciement."
 study_faith_ongoing.1040.b: "La façon dont [target.GetFirstNameNoTooltip] exprime sa foi est très instructive..."
 study_faith_ongoing.1040.c: "Bah ! Je n’ai besoin de la validation de personne d’autre que moi !"
 study_faith_ongoing.1050.t: "$study_faith$ : une odeur de sabotage dans l’air"
 study_faith_ongoing.1050.desc: "Les notes dans lesquelles j’ai esquissé les principes parfois déroutants et contradictoires de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] sont éparpillées partout dans mon bureau. Des mois de travail gisent là, déchirés et en lambeaux. Une feuille isolée près de la fenêtre laisse penser qu’au moins une partie de mes notes a fini par s’envoler dehors.\n\nDois-je maintenant tout recommencer depuis le début ?\n\nQuelle est cette odeur répugnante ? De l’encens ou du bois de santal, mélangés à... quelque chose de floral ? Cette odeur me rappelle le visage suffisant de m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('sabotage_rival'))], [sabotage_rival.Custom('FR_le_Char_Pi')][sabotage_rival.GetTitledFirstName], c[sabotage_rival.Custom('FR_EEtte')] [sabotage_rival.Custom2('InsultNoun', ROOT.Char)] [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] qui n’a d’autre but que ma perte..."
 study_faith_ongoing.1050.a: "Mes notes... non ! Tant de travail, envolé !"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] mérite DE MOURIR !"
 study_faith_ongoing.1050.c: "Ha ! Je garde toujours une copie de mes notes !"
 study_faith_ongoing.1060.t: "$study_faith$ : une interprétation erronée"
 study_faith_ongoing.1060.desc: "Pour vérifier mes progrès, j’essaie de résumer un passage [scheme.GetTargetCharacter.GetFaith.ReligiousText3] pour [offended_character.Custom('FR_le_Char_Pi')][offended_character.GetTitledFirstName], m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', offended_character)] de foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] : « ... le [offended_character.GetFaith.PriestNeuter] doit soulever [target.Custom('GetAccessory')] pour que [target.Custom('FormOfAddressForLiege')] puisse cueillir [target.GetCurrentLocation.Custom('get_region_flower_type')]... »\n\n« Votre interprétation est absurde ! Elle fait passer mes [offended_character.GetFaith.PriestNeuterPlural] pour des hypocrites et [offended_character.GetFaith.HighGodName] pour une divinité lubrique et détestable ! ».\n\nPeut-être que je ne comprends pas encore assez bien les subtilités de la pratique [scheme.GetTargetCharacter.GetFaith.GetAdjective]..."
 study_faith_ongoing.1060.a: "Considérez ceci comme un signe de mon repentir."
 study_faith_ongoing.1060.b: "Mon objectif était de vanter les vertus du [offended_character.GetFaith.PriestNeuter] !"
 study_faith_ongoing.1060.c: "Vous savez quoi !? [offended_character.GetFaith.HighGodName] est effectivement lubrique et détestable !"
 study_faith_ongoing.1060.d: "J’espérais simplement mieux comprendre la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] !"
 study_faith_ongoing.1060.b.success: "Vous lui faites croire que vous avez flatté ses [offended_character.GetFaith.PriestNeuterPlural]"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] découvre votre mensonge"
 study_faith_ongoing.1060.d.success: "Vous avez réussi à expliquer que c’était un malentendu"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] ne vous croit pas"
 study_faith_ongoing.1070.t: "$study_faith$ : mythes sordides"
 study_faith_ongoing.1070.desc: "Le cadeau [target.Custom('FR_du_Char_Pi')][target.GetTitledFirstName], sous la forme de textes mythologiques [scheme.GetTargetCharacter.GetFaith.GetAdherentNamePlural], provoque un certain émoi à la Cour. Beaucoup m’observent tandis que je lis à haute voix les passages les plus intéressants.\n\nAu début, je suppose que [ROOT.Char.GetFaith.EvilGodNames] me joue un tour, mais après un examen approfondi de certains passages passionnants, je comprends qu’il doit s’agir d’un texte érotique.\n\nQue viennent faire des références aux atouts physiques [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] dans un texte sacré ? [ROOT.Char.Custom('CulturalCurse')|U] !"
 study_faith_ongoing.1070.a: "Gardes, débarrassez-moi de ce maudit livre !"
 study_faith_ongoing.1070.b: "Tu oses te moquer de moi !? Fouettez-les tous."
 study_faith_ongoing.1070.c: "Oh bien, je suppose que c’est éducatif, en un sens..."
 study_faith_ongoing.1080.t: "$study_faith$ : [Select_CString(court_tutor.IsFemale,'une excellente professeure','un excellent professeur')]"
 study_faith_ongoing.1080.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', court_tutor)] [court_tutor.GetFirstName] m’a infatigablement aidé[ROOT.Char.Custom('FR_E')] à comprendre les subtilités de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective].\n\nSon dévouement à l’art de l’enseignement est inspirant ! [court_tutor.Custom('FR_IlElle')|U] a toujours sous la main un texte [scheme.GetTargetCharacter.GetFaith.GetAdherentNameNoTooltip] approprié ou me trouve un [scheme.GetTargetCharacter.GetFaith.PriestNeuter] érudit avec qui je peux discuter.\n\nEn vérité, sans son aide, ma compréhension n’aurait pas autant progressé."
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], vous méritez une récompense !"
 study_faith_ongoing.1080.b: "[court_tutor.GetSheHe|U] fait bien son travail."
 study_faith_ongoing.1090.t: "$study_faith$ : incompréhensible !"
 study_faith_ongoing.1090.desc.intro: "La théologie de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] est impossible à saisir !"
 study_faith_ongoing.1090.tenet.desc: "En particulier, le principe de [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )|l]."
 study_faith_ongoing.1090.doctrine.desc: "En particulier, la doctrine de [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )|l]."
 study_faith_ongoing.1090.desc.main: "\n\nMa tête déborde littéralement d’informations ! À peine une pensée surgit-elle qu’une autre est reléguée dans les profondeurs de l’oubli."
 study_faith_ongoing.1090.friend.desc: "\n\n« Continuez comme ça, je crois en vous ! »\n\nHeureusement, [helpful_friend.Custom('FR_le_Char_Pi')][helpful_friend.GetTitledFirstName] est toujours là pour m’aider à comprendre ces enseignements qui m’étaient inconnus. J’ai vraiment de la chance."
 study_faith_ongoing.1090.no_friend.desc: "\n\nPeut-être ai-je besoin d’une pause ?"
 study_faith_ongoing.1090.a: "Je peux toujours m’appuyer sur [helpful_friend.GetFirstNameNoTooltip] pour des conseils !"
 study_faith_ongoing.1090.b: "Même si c’est étrange, je dois persévérer !"
 study_faith_ongoing.1090.c: "Je vais d’abord mettre ces livres de côté pendant un moment..."
 study_faith_ongoing.1090.d: "C’est sans espoir !"
 study_faith_ongoing.1100.t: "$study_faith$ : [ROOT.Char.Custom('FR_FaithGenderedAdj')] de foi [target.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1100.desc: "Le bruit s’est répandu que je me suis beaucoup intéressé[ROOT.Char.Custom('FR_E')] à la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective].\n\nOn me qualifie de « [ROOT.Char.Custom('FR_FaithGenderedAdj')] de foi [target.GetFaith.GetAdjectiveNoTooltip] », ce qui pourrait prêter à confusion."
 study_faith_ongoing.1100.a: "Avec un discours habile, je pourrais apaiser mon peuple et les [target.GetFaith.GetAdherentNamePluralNoTooltip] !"
 study_faith_ongoing.1100.b: "Ce que j’étudie est mon affaire et je ne renonce pas à mon objectif !"
 study_faith_ongoing.1100.c: "[scheme.GetTargetCharacter.Custom('FR_le_Char_Pi')|U][scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] sera certainement impressionné[scheme.GetTargetCharacter.Custom('FR_E')] !"
 study_faith_ongoing.1100.a.success: "Vous prononcez un discours fantastique"
 study_faith_ongoing.1100.a.success.tt: "Chaque courtisan ou invité de foi [root_scope.GetFaith.GetAdjectiveNoTooltip] ou [target.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1100.a.failure: "Vous vous ridiculisez"
 study_faith_ongoing.1110.t: "$study_faith$ : le charme de la poésie [target.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1110.desc: "Ah, « [poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] dans [poet_location.Custom('GetTerrainTypePlural')] » par [the_poet.GetFirstName] de [poet_location.GetNameNoTooltip]. Une grande collection de poésie [scheme.GetTargetCharacter.GetFaith.GetAdjective] !\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nLa poésie serait-elle une fenêtre sur la foi ?"
 study_faith_ongoing.1110.a: "Je vais m’essayer à la poésie [target.GetFaith.GetAdjectiveNoTooltip] !"
 study_faith_ongoing.1110.b: "Devrais-je réciter un poème #EMP romantique#! à m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', lover_to_be)] [lover_to_be.GetFirstName] ?"
 study_faith_ongoing.1110.c: "J’analyse les aspects religieux de ce poème."
 study_faith_ongoing.1110.a.success: "Vous vous révélez être [Select_CString(GetPlayer.IsFemale,'une poétesse douée','un poète doué')]"
 study_faith_ongoing.1110.a.failure: "Vos tentatives de poésie sont loin d’être convaincantes"
 study_faith_ongoing.1120.t: "$study_faith$ : contes hérétiques"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n« Un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsName|l] qui s’intéresse aux fables d’une foi étrangère ? N’éprouvez-vous donc aucune honte ? » s’exclame m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', zealot)], [zealot.Custom('FR_le_Char_Pi')][zealot.GetTitledFirstName].\n\n« Si vos ennemis apprennent que vous vous intéressez à des idées hérétiques, ils feront tout ce qui est en leur pouvoir pour vous faire passer pour un[ROOT.Char.Custom('FR_E')] hérétique ! »\n\nLes écrits [scheme.GetTargetCharacter.GetFaith.GetAdherentNamePlural] que j’ai choisis pourraient être mal interprétés par des imbéciles et des ennemis [ROOT.Char.Custom('FR_GetCourt_Au')]."
 study_faith_ongoing.1120.a: "Non ! Ce sont des traités théologiques [target.GetFaith.GetAdherentNamePluralNoTooltip] respectables !"
 study_faith_ongoing.1120.b: "Vous osez m’accuser d’hérésie ? Je vais vous montrer !"
 study_faith_ongoing.1120.c: "Vous avez raison. De tels textes ne sont pas dignes d’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleTierName|l]."
 study_faith_ongoing.1120.d: "Laissez les gens penser ce qu’ils veulent. Ces écrits sont éclairants !"
 study_faith_ongoing.1120.a.success: "Vous trompez [zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a.failure: "Votre goût pour les lectures hérétiques est de notoriété publique"
 study_faith_ongoing.1120.b.tt: "#V Affrontez en duel#! [zealot.GetFirstName] pour punir son insolence !\n#weak Ce n’est pas un duel à mort.#!\nSi vous gagnez, vous gagnerez du [prestige|El][prestige_i] et un [modifier|El] pour le [scheme|El]. Si vous perdez, vous serez ridiculisé[GetPlayer.Custom('FR_E')].\n\nVotre [prowess|El] : #V [root_for_loc.GetProwess]#![prowess_i]\n[prowess|E] de [zealot.GetFirstName] : #V [zealot.GetProwess]#![prowess_i]"
 study_faith_ongoing.1121.trigger_failure: "Mon duel contre [zealot.GetFirstNameNoTooltip] a été invalidé"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "« Je cède ! Pardonnez-moi, vous n’êtes pas du tout faible d’esprit ! Épargnez-moi ! » s’exclame [zealot.Custom('FR_le_Char_Pi')][zealot.GetTitledFirstName].\n\nCela lui apprendra à m’insulter."
 study_faith_ongoing.1123.a: "Comme l’a dit un jour [ROOT.Char.Custom('FR_Le_GetAnimalType')][ROOT.Char.Custom('GetAnimalType')] sage : « N’insultez pas vos supérieurs ! »"
 study_faith_ongoing.1123.b: "Vous croupirez au cachot pour votre insolence !"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.Custom('FR_le_Char_Pi')|U][zealot.GetTitledFirstName] crache à côté de l’endroit où vous êtes allongé[ROOT.Char.Custom('FR_E')] sur le sol.\n\n« Vous êtes un[ROOT.Char.Custom('FR_E')] faible et piètre [ROOT.Char.GetTitleTierName|l]. Maintenant je vais vous faire une faveur et vous débarrasser de ces livres ineptes », dit-[zealot.Custom('FR_IlElle')]."
 study_faith_ongoing.1124.a: "Un revers dans mes études..."
 study_faith_ongoing.1130.t: "$study_faith$ : les joies de la foi"
 study_faith_ongoing.1130.desc: "« Oh, m[ROOT.Char.Custom('FR_OnA')] ch[ROOT.Char.Custom('FR_ErEre')] [ROOT.Char.GetFirstNameNoTooltip] ! Vous apprenez vraiment la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective] que j’aime tant ? J’apprécie que vous fassiez un tel effort pour me comprendre ! » s’exclame [lover_to_help.Custom('FR_le_Char_Pi')][lover_to_help.GetTitledFirstName].\n\n« Ce serait un plaisir de vous aider de quelque manière que ce soit », propose-t-[lover_to_help.Custom('FR_IlElle')]."
 study_faith_ongoing.1130.a: "Je prends toute l’aide que je peux avoir !"
 study_faith_ongoing.1130.b: "Je pense à une manière fort agréable de le faire."
 study_faith_ongoing.1130.c: "Je préférerais étudier seul[ROOT.Char.Custom('FR_E')]."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] est un bon professeur, bien que charmeu[lover_to_help.Custom('FR_RSe')]."
 study_faith_ongoing.1130.a.failure: "Dans ses cours, [lover_to_help.GetFirstNameNoTooltip] se concentre sur des aspects de la théologie tellement marginaux et sensuels qu’il est difficile de voir en quoi ils sont compatibles avec la foi dans son ensemble."
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip] est trop [Select_CString(lover_to_help.IsFemale,'aguicheuse','aguicheur')] pour être utile."
 study_faith_ongoing.1140.t: "$study_faith$ : une main directrice"
 study_faith_ongoing.1140.desc: "« Je vous félicite d’en apprendre davantage sur la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective]. La connaître renforcera sûrement votre position en tant que [ROOT.Char.GetTitleTierName|l] », s’exclame m[SCOPE.sC('root_for_loc').Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName].\n\n« Je la pratique depuis ma naissance. Je pourrais peut-être vous être utile ? » suggère-t-[close_one_to_help.GetSheHe]."
 study_faith_ongoing.1140.a: "Pourriez-vous m’aider à comprendre ce principe ?"
 study_faith_ongoing.1140.b: "Vous joindriez-vous à mes séances d’étude ?"
 study_faith_ongoing.1200.t: "$study_faith$ : un chien païen"
 study_faith_ongoing.1200.desc: "Pour percer les mystères de la foi [scheme.GetTargetCharacter.GetFaith.GetAdjective], je tiens un recueil bien ordonné de notes. C’est mon seul moyen de venir à bout du chaos d’un autre système de croyances. Malheureusement, elles ont curieusement disparu.\n\nLe museau humide et familier de mon chien [ROOT.Char.Custom('DogStoryName')] vient me donner un petit coup dans la main. Je baisse les yeux vers mon chien bien-aimé, espérant trouver un répit face à ma frustration.\n\nEn me regardant, mon fidèle compagnon à quatre pattes remue fièrement la queue. C’est alors seulement que je réalise que mes notes se trouvent dans sa gueule..."
 study_faith_ongoing.1200.a: "Je ne peux pas rester en colère contre toi !"
 study_faith_ongoing.1200.b: "Tu veux aller te promener ? Allez, viens."
 study_faith_ongoing.1200.c: "Ce n’est pas un jouet ! Méchant chien !"
 study_faith_ongoing.1300.t: "$study_faith$ : apprendre par la pratique"
 study_faith_ongoing.1300.desc: "Alors que nous traversons [ROOT.Char.GetCurrentLocation.GetTitle.GetName], les habitants semblent être en train de célébrer une fête [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]. [Select_CString(interlocutor.IsFemale,'Une femme','Un homme')] s’approche de nous et nous invite à y participer, bien que nous soyons nous-mêmes des [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nMon groupe tente de s’interposer, craignant qu’il ne s’agisse d’un piège.\n\nAu diable le danger ! Je ne peux guère imaginer de meilleure occasion pour découvrir de première main la foi [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] !"
 study_faith_ongoing.1300.a: "Montrez-moi le chemin !"
 study_faith_ongoing.1300.a.flavor: "Ce n’est qu’un rituel [scheme.GetTargetCharacter.GetFaith.GetAdherentNameNoTooltip] inoffensif – en quoi cela pourrait-il nuire ?"
 study_faith_ongoing.1300.b: "Débattre des détails de sa foi sera sûrement le plus instructif."
 study_faith_ongoing.1300.b.flavor: "Vous tentez d’engager un débat amical avec [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.success: "Vous engagez un débat amical avec [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.failure: "Vous n’arrivez pas à engager un débat amical avec [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.c: "« Venez avec nous en [next_destination.GetNameNoTooltip] ! »"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "Tout comme le papillon de nuit ne connaît pas le langage des étoiles et trouve pourtant la flamme, l’âme n’a pas besoin de nommer le Divin pour être consumée par lui."
 holy_text_indeterminate_quote_2: "Une fois que le vent du désert eut effacé les traces du tyran, le sable ne se souvenait plus que des traces laissées par ceux qui avaient soif et par les bienveillants."
 holy_text_indeterminate_quote_3: "La rivière ne choisit certes pas les pierres qu’elle polit, mais, par son écoulement incessant, elle transforme chacune d’entre elles en une pierre précieuse."
 holy_text_indeterminate_quote_4: "Bois à la source de la connaissance, et cela te courbera le dos."
 holy_text_indeterminate_quote_5: "Le jour où la montagne s’inclina, ce n’était pas devant des rois ou des armées, mais devant cet enfant qui avait osé lui poser une question."
 holy_text_indeterminate_quote_6: "Celui qui se cache te parle d’abord à travers les murmures du doute, afin que, lorsque tu finiras par répondre, ta foi soit la tienne."
 holy_text_indeterminate_quote_7: "Tout mensonge prononcé devant l’autel s’envole comme de la fumée, mais chaque larme sincère tombe comme une graine dans les jardins du ciel."
 holy_text_indeterminate_quote_8: "Ne maudis pas l’obscurité qui voile ton chemin. Elle existe pour que ta propre flamme trouve le courage de briller."
 holy_text_indeterminate_quote_9: "Celui qui rayonne ne tient pas compte des prières des orgueilleux, mais seulement des actes de miséricorde accomplis en silence à l’abri des regards."
 holy_text_indeterminate_quote_10: "Lorsque le monde s’est divisé entre « le mien » et « le tien », le Divin a ri, car de son point de vue, seul « le nôtre » existait."
