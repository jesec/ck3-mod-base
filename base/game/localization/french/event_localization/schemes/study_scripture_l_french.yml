l_french:
 study_scripture_outcome.10.t: "$study_scripture_title$une règle d’étude"
 study_scripture_outcome.10.desc: "Les livres sont ouverts sur le lutrin : les articles de la doctrine [ROOT.Char.GetFaith.GetAdjective] patiemment recopiés. Une bougie vacille dans l’obscurité. En bas, dans [ROOT.Char.GetFaith.HouseOfWorship], les fidèles attendent, comme toujours.\n\n"
 study_scripture_outcome.10.desc_quote: "Sur la première page, un lecteur avant moi a souligné un passage : « #EMP [ROOT.Char.Custom('RandomStudyVerseFragment')]#! »\n\nJusqu’où suis-je prêt[ROOT.Char.Custom('FR_E')] à m’engager dans l’étude de cette page sacrée ?"
 study_scripture_outcome.10.desc_generic: "Jusqu’où suis-je prêt[ROOT.Char.Custom('FR_E')] à me consacrer à l’étude des textes sacrés ?"
 study_scripture_outcome.10.a: "Que le monde attende derrière la porte du cloître."
 study_scripture_outcome.10.b: "Le bureau d’étude aura ses horaires tout comme les [ROOT.Char.Custom('StudyOfficesWord')] ont les leurs."
 study_scripture_outcome.10.c: "Je lirai selon mon envie."
 no_change_study_scripture_tt: "Votre [scheme|El] d’[GetScheme('study_scripture').GetTypeName|l] avance sans changement"
 study_scripture_outcome.110.t: "$study_scripture_title$la page sacrée"
 study_scripture_outcome.110.desc: "Je travaille patiemment à déchiffrer, ligne après ligne, les grands textes de la foi [ROOT.Char.GetFaith.GetAdjective], tandis que la cire s’amasse sous la bougie et que les lapins et les escargots des marges se querellent.\n\n"
 study_scripture_outcome.110.desc_quote: "Un passage me parle :\n« #EMP [ROOT.Char.Custom('RandomRelevantBibleQuote')]#! »\n\nSi je suis appelé[ROOT.Char.Custom('FR_E')] à guider les fidèles [ROOT.Char.GetFaith.HighGodNamePossessive], ce sont là les paroles que je dois garder dans mon cœur."
 study_scripture_outcome.110.desc_generic: "Si je suis appelé[ROOT.Char.Custom('FR_E')] à guider les fidèles [ROOT.Char.GetFaith.HighGodNamePossessive], ce sont là les paroles que je dois garder dans mon cœur."
 study_scripture_outcome.110.a: "Je dois apprendre, quoi qu’il en coûte."
 study_scripture_outcome.110.b: "La compréhension viendra en temps voulu."
 study_scripture_outcome.120.t: "$study_scripture_title$le long commentaire"
 study_scripture_outcome.120.desc: "Avant de pouvoir guider les fidèles, je dois apprendre à me guider moi-même. Le commentaire [commentary_writer.Custom('FR_du_Char_Pi')][commentary_writer.GetTitledFirstName] s’étend devant moi : le fruit d’une vie entière de travail d’un autre érudit sur [ROOT.Char.GetFaith.ReligiousText], aussi dense qu’un buisson épineux et deux fois plus acéré. Chaque ligne que je déchiffre en révèle trois autres.\n\nCe n’est que par la discipline que j’y parviendrai."
 study_scripture_outcome.120.a: "Je vais décortiquer le texte à la recherche d’un sens plus profond."
 study_scripture_outcome.120.b: "Des heures régulières, des progrès constants."
 study_scripture_outcome.120.c: "Une page par soir suffit."
 scholar_xp_high_tt: "Vous approfondissez considérablement vos connaissances"
 scholar_xp_low_tt: "Vous approfondissez légèrement vos connaissances"
 study_scripture_outcome.130.t: "$study_scripture_title$la patience nécessaire"
 study_scripture_outcome.130.desc: "Pourquoi je n’arrive pas à comprendre ? J’en suis à ma quatrième lecture de ce passage, et pourtant il reste tout aussi hermétique. J’appuie doucement mon front contre le bureau.\n\n« Je vous ai apporté une bougie », dit m[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', tutor)] [tutor.GetFirstName] depuis l’embrasure de la porte. « Ah, ces commentaires anciens. Je connais bien ces pages. On les lit ensemble un moment ? »\n\nJe lève les yeux. Un coup de main pourrait m’être utile."
 study_scripture_outcome.130.a: "Apprenez-moi. Mon orgueil ne m’empêchera pas d’apprendre."
 study_scripture_outcome.130.b: "Asseyez-vous un moment avec moi ; le texte peut attendre."
 study_scripture_outcome.140.t: "$study_scripture_title$prêcher à la [ROOT.Char.Custom('StudyParishWord')]"
 study_scripture_outcome.140.desc: "Je referme le livre en soupirant. Toute la doctrine s’y trouve, et pourtant, la dernière fois que [preacher.Custom('FR_le_Char_Pi')][preacher.GetTitledFirstName] a prêché devant moi, il n’y avait aucun syllogisme : seulement la simple vérité [ROOT.Char.GetFaith.HighGodNamePossessive]. La [ROOT.Char.Custom('StudyParishWord')] pleurait. Je pleurais."
 study_scripture_outcome.140.a: "Il y a la doctrine et il y a la manière de la transmettre. J’apprendrai les deux."
 study_scripture_outcome.140.b: "Ma vocation est dans la page, non dans [ROOT.Char.Custom('StudyPulpitWord')]."
 study_scripture_outcome.150.t: "$study_scripture_title$le temporel"
 study_scripture_outcome.150.desc: "« Venez marcher avec moi », me dit m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', steward_scope )] [steward_scope.GetFirstName], le registre sous le bras, en me faisant signe de sortir dès le matin.\n\n« Les terres du temple, le moulin, les granges dîmières... Voyez lesquelles sont pleines, lesquelles prennent l’eau et lesquelles ont été promises deux fois. On ne nourrit pas un troupeau avec la seule grâce. »"
 study_scripture_outcome.150.a: "Instruisez-moi sur les registres."
 study_scripture_outcome.150.b: "Au moins, une petite balade me permettra de me vider la tête."
 study_scripture_outcome.160.t: "$study_scripture_title$compagnie érudite"
 study_scripture_outcome.160.desc: "Mes études m’ont amené[ROOT.Char.Custom('FR_E')] à entretenir une correspondance avec [colleague.Custom('FR_le_Char_Pi')][colleague.GetTitledFirstName], dont le dévouement fait l’objet d’éloges bien au-delà de mes propres murs.\n\n"
 study_scripture_outcome.160.desc_distant: "Nous échangeons des lettres sur des questions de foi : des questions, des arguments et des rectifications qui vont et viennent. Son écriture est horrible, mais son raisonnement est solide."
 study_scripture_outcome.160.a: "Discutons-en comme il se doit."
 study_scripture_outcome.160.b: "Une personne cultivée devrait savoir comment son siège est dirigé."
 study_scripture_outcome.160.c: "Revenons ensemble aux textes."
 piety_gain_high_tt: "Gain de piété important"
 piety_gain_low_tt: "Gain de piété léger"
 study_scripture_outcome.170.t: "$study_scripture_title$une lettre scellée"
 study_scripture_outcome.170.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', letterman)] [letterman.GetFirstName], me l’apporte comme s’il s’agissait d’une relique : une lettre portant le sceau [senior.Custom('FR_du_Char_Pi')][senior.GetTitledFirstName].\n\n« La nouvelle de vos études s’est répandue plus loin que vous ne l’imaginez. La foi s’enrichit grâce à un pasteur qui lit. Persévérez et soyez assuré[ROOT.Char.Custom('FR_E')] de ma bienveillance. »\n\n"
 study_scripture_outcome.170.desc_quote: "La lettre se termine par un seul verset, mis en évidence par rapport au reste :\n« #EMP [ROOT.Char.Custom('RandomBibleQuoteShort')]#! »"
 study_scripture_outcome.170.desc_generic: "La lettre se termine par une bénédiction au nom [ROOT.Char.GetFaith.HighGodNamePossessive], écrite en caractères plus grands que le reste."
 study_scripture_outcome.170.a: "Je vais rédiger une réponse appropriée."
 study_scripture_outcome.170.b: "Peut-être pourrait-[senior.Custom('FR_IlElle')] faire l’éloge de mon érudition de manière un peu plus... publique ?"
 study_scripture_outcome.170.c: "Je vais la relire. Cette fois-ci, lentement."
 study_scripture_outcome.171.t: "$study_scripture_title$lettres aux fidèles"
 study_scripture_outcome.171.desc: "Je reçois des lettres venues des quatre coins du monde [ROOT.Char.GetFaith.GetAdherentName]. Des ecclésiastiques qui débattent d’un texte liturgique, des [ROOT.Char.GetFaith.PriestNeuterPlural] en proie à des doutes, un érudit qui implore un verdict sur une interprétation que personne de vivant ne peut vérifier. C’est mon sceau qui tranche les discussions.\n\n"
 study_scripture_outcome.171.desc_quote: "La lettre de ce soir me cite les Écritures, pleine d’espoir :\n« #EMP [ROOT.Char.Custom('RandomBibleQuoteShort')]#! »\n\nLa pile sur mon bureau ne cesse de grandir. Et, sans que je m’en rende compte, mes connaissances aussi."
 study_scripture_outcome.171.desc_generic: "La pile sur mon bureau ne cesse de grandir. Et, sans que je m’en rende compte, mes connaissances aussi."
 study_scripture_outcome.171.a: "Répondre à toutes. C’est pour cela que les pasteurs sont là."
 study_scripture_outcome.171.b: "Que les copistes diffusent mes réponses aux quatre coins du monde de la foi."
 study_scripture_outcome.171.c: "Ce soir, je suis étudiant[ROOT.Char.Custom('FR_E')]. Les lettres peuvent attendre."
 study_scripture_outcome.172.t: "$study_scripture_title$une lettre pastorale"
 study_scripture_outcome.172.desc: "Ce soir, j’étudie les lettres écrites par les pasteurs à des congrégations lointaines : les sermons et les enseignements varient considérablement d’une [ROOT.Char.Custom('StudyParishWord')] à l’autre.\n\nMes pensées se tournent vers les fidèles de [pastoral_county.GetNameNoTier], dans les terres [pastoral_lord.Custom('FR_du_Char_Pi')][pastoral_lord.GetTitledFirstName]. Ils ont une église là-bas. Ils sont hors de ma portée et privés de mes conseils... Il est peut-être temps que je leur écrive personnellement.\n\nJe prends ma plume. « #EMP Aux fidèles de [pastoral_county.GetNameNoTier]...#! »"
 study_scripture_outcome.172.a: "L’envoyer"
 study_scripture_outcome.172.b: "La leçon consistait à l’écrire. Cela suffit."
 study_scripture_outcome.172.toast: "[owner.Custom('FR_le_Char_Pi')|U][owner.GetTitledFirstName] a envoyé une lettre aux habitants de [pastoral_county.GetNameNoTier]"
 study_scripture_outcome.180.t: "$study_scripture_title$le soulagement"
 study_scripture_outcome.180.desc: "Je commence à lire, la mâchoire serrée et les épaules crispées, m’attendant à devoir encore porter un fardeau.\n\n"
 study_scripture_outcome.180.desc_confession: "Quelque part entre la première page et la dernière, mon âme s’effondre. Tout ce que je porte en moi, je le confie à haute voix [ROOT.Char.GetFaith.HighGodName2]. Le poids a disparu.\n\nPour la première fois depuis des mois, le chemin qui s’ouvre devant moi est clair."
 study_scripture_outcome.180.desc_generic: "Quelque part entre la première page et la dernière, le poids qui pèse sur mes épaules s’estompe peu à peu. C’est comme si un voile s’était levé.\n\nPour la première fois depuis des mois, le chemin qui s’ouvre devant moi est clair."
 study_scripture_outcome.180.a: "Que lire ensuite..."
 study_scripture_outcome.190.t: "$study_scripture_title$mécénat des érudits"
 study_scripture_outcome.190.desc: "Même le savoir a ses jeux de pouvoir. Un livre recopié remis au bon conseil, un jeune lecteur prometteur invité à la bonne table, mon nom prononcé avec bienveillance dans les bons cercles...\n\nJe travaille avec application. Mais un travail que personne ne remarque est un travail perdu."
 study_scripture_outcome.190.a: "S’assurer que le synode entende parler de moi."
 study_scripture_outcome.190.b: "Je demanderai aux théologiens de partager leurs notes avec moi."
 study_scripture_outcome.190.c: "Les mystiques devraient connaître mon œuvre."
 study_scripture_outcome.190.d: "Mon dévouement parle de lui-même."
 study_scripture_outcome.200.t: "$study_scripture_title$[mystic.Custom('FR_LeLa')] visionnaire"
 study_scripture_outcome.200.desc: "Il y a des pages où les mots s’arrêtent et où autre chose commence. [mystic.Custom('FR_LeLa')|U] [GetTrait('lifestyle_mystic').GetName( mystic )|l] appelé[mystic.Custom('FR_E')] [mystic.GetTitledFirstName] parle d’une obscurité plus éclatante que le plein midi, d’une prière qui se poursuit lorsque les mots viennent à manquer — et la foi [ROOT.Char.GetFaith.GetAdjective] enseigne que de telles portes s’ouvrent à ceux qui osent frapper.\n\nJe lis jusqu’à ce que la bougie s’éteigne. Puis je reste longtemps assis[ROOT.Char.Custom('FR_E')] dans le noir, à écouter."
 study_scripture_outcome.200.a: "Quelque chose m’attend dans cette obscurité. Je vais le chercher."
 study_scripture_outcome.200.b: "Mettez-moi à l’épreuve, mystères. Je n’ai pas peur."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] mérite une lettre d’hommage."
 study_scripture_outcome.200.d: "Je prends note de cette porte, et m’en tiendrai à des études plus prosaïques."
 study_scripture_outcome.300.t: "$study_scripture_title$veillée nocturne"
 study_scripture_outcome.300.desc: "Le froid et le silence absolu règnent dans [ROOT.Char.GetFaith.HouseOfWorship]. Entre le dernier office et le premier, il reste une heure dont je peux disposer, et je me la suis réservée – une seule bougie, l’obscurité et le mystère qui plane autour de la flamme.\n\nQuelque chose attend derrière le silence. C’est patient. Ce soir, moi aussi."
 study_scripture_outcome.300.a: "Plus loin. J’irai plus loin."
 study_scripture_outcome.300.b: "Une heure de calme, puis au lit."
 study_scripture_outcome.300.c: "J’ai veillé ; cela suffit."
 study_scripture_outcome.100.t: "$study_scripture_title$une question de succession"
 study_scripture_outcome.100.desc: "La nuit tombe tandis que j’étale devant moi les canons de l’élection, leurs pages éclairées d’une pâle lueur. Qui peut être élevé, qui peut les élever, quels précédents ont prévalu et lesquels ont été infléchis – tout s’y trouve, pour qui a la patience de lire.\n\nLes anciens meurent. Les conclaves se réunissent. Et les cardinaux se souviennent de ceux qui savaient la loi lorsque vint le moment de s’en servir."
 study_scripture_outcome.100.a: "Un jour, la question sera posée. Et je serai la réponse."
 study_scripture_outcome.100.b: "La sagesse prend du temps ; que l’ambition attende."
 study_scripture_outcome.100.c: "Je préfère aller me coucher..."
 pam_ss_papabile_tt: "Votre [papabile_score|El] pour la succession papale augmente de #P +10#!"
 study_scripture_outcome.101.t: "$study_scripture_title$célèbre exégète"
 study_scripture_outcome.101.desc: "La réponse me vient pendant un souper froid, entre deux bouchées. Je sais enfin comment interpréter ce passage :\n\n"
 study_scripture_outcome.101.desc_quote: "« #EMP [ROOT.Char.Custom('RandomRelevantBibleQuote')]#! »\n\nDes générations d’[Glossary('exégètes', 'GLOSS_EXEGETE')] ont débattu de ces mots. Aujourd’hui, leur sens semble tout à fait clair. La question est de savoir quoi faire de mon interprétation."
 study_scripture_outcome.101.desc_generic: "Des générations d’[Glossary('exégètes', 'GLOSS_EXEGETE')] ont débattu de ces mots. Aujourd’hui, leur sens semble tout à fait clair. La question est de savoir quoi faire de mon interprétation."
 study_scripture_outcome.101.a: "La prêcher depuis [ROOT.Char.Custom('StudyPulpitWord')] lors de la prochaine fête"
 study_scripture_outcome.101.b: "La diffuser discrètement parmi les lettrés"
 study_scripture_outcome.101.c: "Elle m’est parvenue en silence ; c’est au silence que je la rends."
 GLOSS_EXEGETE: "Personne qui se consacre à l’exégèse : expert ou érudit spécialisé dans l’explication, l’interprétation ou l’analyse critique d’un texte, en particulier des textes religieux."
 study_scripture_outcome.102.t: "$study_scripture_title$clarté doctrinale"
 study_scripture_outcome.102.desc: "Depuis des années, les doctrines de la foi [ROOT.Char.GetFaith.GetAdjective] occupent mes pensées, mais certains enseignements n’ont jamais vraiment pris tout leur sens.\n\n"
 study_scripture_outcome.102.desc_tenet: "Ce soir, un principe – [pam_ss_clarity_tenet.GetBaseName] – s’éclaircit enfin : ce qu’il exige, ce qu’il pardonne et où se situent ses limites. Je le comprends suffisamment bien pour le défendre devant n’importe quel érudit ou l’expliquer à un enfant."
 study_scripture_outcome.102.desc_generic: "Ce soir, ces enseignements apparaissent enfin clairement : ce qu’ils exigent, ce qu’ils pardonnent et où se situent leurs limites. Je les comprends suffisamment bien pour les défendre face à n’importe quel érudit ou pour les expliquer à un enfant."
 study_scripture_outcome.102.desc_quote: "\n\n« #EMP [ROOT.Char.Custom('RandomRelevantBibleQuote')]#! »"
 study_scripture_outcome.102.a: "Je dois l’écrire avant que la lumière ne s’éteigne."
 study_scripture_outcome.102.b: "La joie que cela me procure me suffit."
 study_scripture_outcome.102.c: "Même cette révélation peut attendre jusqu’à demain matin."
 study_scripture_outcome.121.t: "$study_scripture_title$le professeur"
 study_scripture_outcome.121.desc: "Je retrouve m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', student_courtier )], [student_courtier.Custom('FR_le_Char_Pi')][student_courtier.GetTitledFirstName], à la bibliothèque bien après l’heure à laquelle les bougies auraient dû être éteintes, penché[student_courtier.Custom('FR_E')] sur un ouvrage bien trop difficile pour son niveau.\n\n« Je vous prie de me pardonner, [ROOT.Char.Custom('FormOfAddressForLiege')] », balbutie-t-[student_courtier.Custom('FR_IlElle')], surpris[student_courtier.Custom('FR_E')]. « Je... J’aurais tant aimé avoir lu ce gros volume... »\n\nJe me souviens de ce que j’aurais donné pour avoir un professeur qui aurait vraiment lu ce livre."
 study_scripture_outcome.121.a: "Nous allons le lire comme il se doit, ensemble."
 study_scripture_outcome.121.b: "Je [student_courtier.Custom('FR_LeLa')] parrainerai."
 study_scripture_outcome.121.c: "Laissons-[student_courtier.Custom('FR_LeLa')] étudier [Select_CString(student_courtier.IsFemale,'toute seule','tout seul')]. Ça forge le caractère."
 study_scripture_outcome.122.t: "$study_scripture_title$le catéchisme"
 study_scripture_outcome.122.desc: "Mes études ont porté leurs fruits. Ce soir, je réunis les miens dans m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')] et j’ouvre devant eux [ROOT.Char.GetFaith.ReligiousText].\n\nJe lis. Ils écoutent. Les questions fusent : certaines sont simples, d’autres étonnamment pointues. Il semble que je ne sois pas [Select_CString(ROOT.Char.IsFemale,'la seule','le seule')] à avoir envie d’en savoir plus sur le sacré."
 study_scripture_outcome.122.a: "Ligne par ligne, pour tout le monde. Voilà la mission."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] a l’esprit vif. Je vais lui en apprendre davantage."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] est resté[stray.Custom('FR_E')] un moment après. La porte lui est ouverte."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] en a déjà appris assez. [devout.Custom('FR_IlElle')|U] a ma bénédiction."
 study_scripture_outcome.123.t: "$study_scripture_title$devant [ROOT.Char.Custom('StudySeminaryWord')]"
 study_scripture_outcome.123.desc: "La nouvelle de mes études s’est répandue grâce aux pèlerins et aux marchands ambulants, et aujourd’hui, on m’a amené [Select_CString(aspirant.IsFemale,'une potentielle','un potentiel')] élève. [aspirant.Custom('FR_le_Char_Pi')|U][aspirant.GetTitledFirstName] se tient à l’entrée, fatigué[aspirant.Custom('FR_E')] par le voyage mais déterminé[aspirant.Custom('FR_E')], un livre emprunté entre ses mains tremblantes.\n\n« On dit que vous mettez vraiment en pratique ce que vous prêchez. Enseignez-moi et je vous servirai. »"
 study_scripture_outcome.123.a: "Ah. Nous allons commencer par les bases de la foi."
 study_scripture_outcome.123.b: "Ma Cour n’est pas [ROOT.Char.Custom('StudySeminaryWord')]."
 study_scripture_outcome.400.t: "$study_scripture_title$médecin, guéris-toi toi-même"
 study_scripture_outcome.400.desc: "Ce passage m’interpelle. La condamnation dont il est question me semble d’une familiarité dérangeante.\n\n"
 study_scripture_outcome.400.desc_generic: "Le texte ne me nomme pas, et pourtant il parle de moi : il dit sans ambages que je suis [penance_sin.GetName( ROOT.Char )|l], comme si l’auteur me connaissait."
 study_scripture_outcome.400.desc_end: "\n\nJe pourrais fermer le livre et ne pas continuer à lire. Mais l’accusation subsisterait."
 study_scripture_outcome.400.a: "Il n’y a qu’un seul remède : la pénitence."
 study_scripture_outcome.400.b: "Je dois continuer à lire, quoi qu’il arrive."
 study_scripture_outcome.400.c: "Les saints prêchent. Les pécheurs commandent."
 study_scripture_outcome.410.t: "$study_scripture_title$commentaires étranges"
 study_scripture_outcome.410.desc: "Le codex est un prêt, et celui qui l’a lu avant moi a laissé ses propres réflexions dans les marges : des objections, des prières et des notes sur le principe appelé « [pam_ss_margin_tenet.GetBaseName] ».\n\nJe devrais ignorer ces gribouillages, mais je me surprends à les relire deux fois."
 study_scripture_outcome.410.a: "Et même une troisième fois, lentement."
 study_scripture_outcome.410.b: "Une erreur aussi grave mérite une réfutation en bonne et due forme."
 study_scripture_outcome.410.c: "Au feu, la page et tout le reste."
 study_scripture_outcome.430.t: "$study_scripture_title$le principe et le cœur"
 study_scripture_outcome.430.desc: "Parmi les enseignements de la foi [ROOT.Char.GetFaith.GetAdjective], il y en a un que je fais mien plus que tous les autres : [pam_ss_heart_tenet.GetBaseName|l], que je porte en moi depuis bien avant d’être capable de le défendre. Ce soir, je concentre mon étude sur celui-ci, à la recherche de défauts.\n\n"
 study_scripture_outcome.430.desc_quote: "Les textes répondent d’une seule voix :\n« #EMP [ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]#! »\n\nL’erreur n’a jamais résidé dans l’enseignement."
 study_scripture_outcome.430.desc_generic: "Les textes répondent d’une seule voix, plus ancienne et plus ferme que la mienne. L’erreur n’a jamais résidé dans l’enseignement."
 study_scripture_outcome.430.a: "Je le crois. Que toute la [ROOT.Char.Custom('StudyParishWord')] me voie le vivre."
 study_scripture_outcome.430.b: "Je vais écrire pour prendre sa défense."
 study_scripture_outcome.430.c: "Quand on les étudie de trop près, tous les enseignements ont des défauts..."
 pam_ss_spread_tenet_tt: "Votre plaidoyer écrit pourrait convaincre jusqu’à #V 3#! [rulers|El] d’adhérer au principe [pam_ss_heart_tenet.GetBaseName]"
 pam_ss_conviction_spread_tt: "$study_scripture_title$principe personnel adopté"
 study_scripture_outcome.1000.t: "$study_scripture_title$pasteur admonesté"
 study_scripture_outcome.1000.desc_present: "[senior.Custom('FR_le_Char_Pi')|U][senior.GetTitledFirstName] n’élève pas la voix. [senior.Custom('FR_IlElle')|U] n’en a pas besoin.\n\n« On me dit que vos livres prennent la poussière. Un pasteur qui ne veut pas apprendre laisse son troupeau s’égarer. On vous a donné plus qu’à la plupart des gens : qu’en avez-vous fait ? »\n\nLe silence qui suit retentit plus que n’importe quel cri."
 study_scripture_outcome.1000.desc_letter: "La lettre porte le sceau [senior.Custom('FR_du_Char_Pi')][senior.GetTitledFirstName] et chaque ligne, mûrement réfléchie, tombe comme un coup de massue :\n\n« J’ai appris que vos études battaient de l’aile. Un pasteur qui ne veut pas apprendre éloigne son troupeau du droit chemin. On vous a donné plus qu’à la plupart des gens. J’espère avoir de meilleures nouvelles prochainement. »\n\nIl n’y a pas de signature. Le sceau suffit."
 study_scripture_outcome.1000.desc_dream: "Dans ce rêve, je me trouve dans une immense bibliothèque où tous les livres portent mon nom et où toutes les pages sont vierges. Un personnage que je reconnais parmi des centaines d’images sacrées referme délicatement la dernière d’entre elles, comme on ferme les yeux d’un défunt.\n\n« On vous a donné plus qu’à la plupart des gens », dit le saint, et je me réveille avec ces mots qui résonnent encore dans la pièce."
 study_scripture_outcome.1000.a: "On ne me prendra plus jamais en défaut."
 study_scripture_outcome.1000.b: "Je ne peux plus supporter ce fardeau. Ça suffit... pour toujours."
 study_scripture_outcome.1000.c: "Assez. J’ai besoin de repos."
 never_study_scripture_again_tt: "Vous ne pourrez plus #N jamais#! mener un [scheme|El] d’[GetScheme('study_scripture').GetTypeName|l]"
 study_scripture_outcome.1010.t: "$study_scripture_title$un cadeau à l’encre"
 study_scripture_outcome.1010.desc: "Un colis de la part [sender.Custom('FR_du_Char_Pi')][sender.GetTitledFirstName] vient d’arriver."
 study_scripture_outcome.1010.end_christian: "Une note indique précisément le passage que je n’ai pas réussi à maîtriser :\n\n« #EMP [ROOT.Char.Custom('RandomRelevantBibleQuote')]#! »\n\nUn cadeau généreux et utile."
 study_scripture_outcome.1010.end: "À l’intérieur se trouve un livre de dévotion à la belle reliure, dont les pages regorgent de prières, de commentaires et d’enluminures soignées.\n\nUn cadeau généreux et utile. Les réponses qui m’ont échappé se trouvent peut-être dans ces pages."
 study_scripture_outcome.1010.a: "Je vais faire bon usage de ce cadeau."
 study_scripture_outcome.1010.b: "Un livre magnifique. Il sera du plus bel effet sur ma bibliothèque."
 pam_ss_devotional_book_name: "Ouvrage de dévotion"
 pam_ss_devotional_book_description: "Volume enluminé contenant des textes sacrés et des commentaires, copié et doré avec une dévotion évidente. Un ruban marque le passage que son destinataire avait le plus besoin de lire."
 study_scripture_outcome.1020.t: "$study_scripture_title$mortification de la chair"
 study_scripture_outcome.1020.desc: "Les textes me donnent du fil à retordre ce soir, comme hier soir et le soir d’avant. Mon regard s’égare loin de la page ; mon esprit vagabonde vers le dîner, vers le lit, vers tout ce qui n’a rien à voir avec la doctrine.\n\nLe problème, c’est le corps. Les anciens ascètes le savaient : le confort est le serviteur le plus silencieux [ROOT.Char.GetFaith.DevilNamePossessive], et la faim affûte l’âme. Peut-être la chair doit-elle céder pour que l’esprit puisse progresser."
 study_scripture_outcome.1020.a: "Le fouet me permettra de me vider l’esprit."
 study_scripture_outcome.1020.b: "Affamer le corps pour nourrir l’âme."
 study_scripture_outcome.1020.c: "Ou peut-être le dîner, puis au lit, et un nouveau départ demain."
 study_scripture_outcome.1030.t: "$study_scripture_title$retraite au cloître"
 study_scripture_outcome.1030.desc: "Mes études sont au point mort. Le même bureau, la même bougie, les mêmes échecs. Je pars donc à la recherche de m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', counselor )], [counselor.Custom('FR_le_Char_Pi')][counselor.GetTitledFirstName], dont la dévotion ne dépend pas du rang.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "« Vous vous encombrez de trop de barrières », dit [counselor.GetFirstNameNoTooltip], en désignant d’un geste la cellule dépouillée, la seule lampe, le silence. « Les anciens ermites le savaient : débarrasse-toi de tout, et il ne restera que ce que tu cherchais. »"
 study_scripture_outcome.1030.desc_monastery: "« Vous lisez comme si vous étiez [Select_CString(ROOT.Char.IsFemale,'une dirigeante','un dirigeant')] », dit [counselor.GetFirstNameNoTooltip] sans malveillance. « Vous parcourez les pages, en les comptant comme s’il s’agissait d’impôts. Ici, on relit la même ligne pendant une semaine, jusqu’à ce que ce soit elle qui nous lise. »"
 study_scripture_outcome.1030.a: "Organiser une cérémonie de bénédiction pour mon étude."
 study_scripture_outcome.1030.b: "Je vais donc lire la même ligne pendant deux semaines."
 study_scripture_outcome.1030.c: "Je vais prier à ce sujet et m’en remettre [ROOT.Char.GetFaith.HighGodName2]."
 study_scripture_outcome.1040.t: "$study_scripture_title$une paire de mains supplémentaire"
 study_scripture_outcome.1040.desc_acolyte: "Alors que je n’ai pas demandé d’aide, m[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', helper )], [helper.Custom('FR_le_Char_Pi')][helper.GetTitledFirstName], a mis de l’ordre dans mes notes, trouvé le commentaire qui convenait et taillé ma bougie. [helper.Custom('FR_IlElle')|U] a discrètement appris à connaître mes habitudes, y compris les passages qui me font soupirer.\n\n« Vous priez mieux quand vous êtes reposé[ROOT.Char.Custom('FR_E')] », dit-[helper.Custom('FR_IlElle')] simplement, tout en déposant une assiette [helper.Custom('GetLocalStreetFood')] bien chaude à côté de mes notes. »"
 study_scripture_outcome.1040.desc_partner: "M[ROOT.Char.Custom2( 'FR_RelationToMeShort_OnA', helper )], [helper.Custom('FR_le_Char_Pi')][helper.GetTitledFirstName], s’approche, m’arrache le codex des mains et lit la ligne à haute voix. Ces mots sont sacrés. Puisse [ROOT.Char.GetFaith.HighGodName] me pardonner : ce soir, le sacré de s[helper.Custom('ObjectifiedFeature')] m’apparaît encore plus.\n\n« Laissez-moi vous aider », murmure-t-[helper.Custom('FR_IlElle')] suffisamment près pour profiter de la chaleur de la bougie. « Je le souhaite profondément. »"
 study_scripture_outcome.1040.a: "Alors prenez des notes jusqu’à l’aube. Finissons-en avec ça."
 study_scripture_outcome.1040.b: "Une heure ensemble, alors."
 study_scripture_outcome.1040.c: "Cette gentillesse est déjà une aide suffisante."
 study_scripture_outcome.1040.d: "Rapprochez-vous encore, la bougie n’éclaire pas loin..."
 study_scripture_outcome.1050.t: "$study_scripture_title$la nuit obscure de l’âme"
 study_scripture_outcome.1050.desc: "J’ai trop lu. Peu après minuit, les réponses ont cédé la place aux questions, et la certitude, au doute.\n\n"
 study_scripture_outcome.1050.desc_quote: "Je ne suis pas la première personne à être confrontée à un tel silence. « #EMP Ô Dieu, ô Dieu, pourquoi m’as-tu abandonné#! ? »\n\nLa bougie brûle. Le silence persiste. Et maintenant ?"
 study_scripture_outcome.1050.desc_generic: "Les saints de toutes les époques ont connu ce doute : ce moment où [ROOT.Char.GetFaith.HighGodName] retient Son souffle sans expliquer pourquoi.\n\nLa bougie brûle. Le silence persiste. Et maintenant ?"
 study_scripture_outcome.1050.a: "Le doute est un texte comme les autres."
 study_scripture_outcome.1050.b: "Peut-être que le silence est la réponse."
 study_scripture_outcome.1050.c: "Au-delà des mots, au-delà du doute... vers le mystère lui-même."
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, 'Sœurs', 'Frères' )] de la Règle"
 study_scripture_outcome.1060.desc_house: "Je peine, et le peu que j’ai appris n’est guère utile. Cependant, la nouvelle est parvenue jusqu’au [order_head.GetPrimaryTitle.GetNameNoTier], dont l’ordre possède une maison à [order_house_county.GetNameNoTier], car un de ses chariots entre en grinçant dans ma cour : des commentaires copiés, une boîte de bougies et une lettre portant le cachet [order_head.Custom('FR_du_Char_Pi')][order_head.GetTitledFirstName].\n\n« Aucun pasteur n’étudiera dans la solitude tant que la Règle perdurera. Il vous suffit de le dire, et ce qui est à nous sera à vous. »"
 study_scripture_outcome.1060.desc_far: "La nouvelle de mes difficultés s’est manifestement répandue jusqu’au [order_head.GetPrimaryTitle.GetNameNoTier], car un de ses chariots entre en grinçant dans ma cour : des commentaires copiés, une boîte de bougies et une lettre portant le cachet [order_head.Custom('FR_du_Char_Pi')][order_head.GetTitledFirstName].\n\n« Aucun pasteur n’étudiera dans la solitude tant que la Règle perdurera. Il vous suffit de le dire, et ce qui est à nous sera à vous. »"
 study_scripture_outcome.1060.a: "Je remercie tous ceux qui ont fait les copies."
 study_scripture_outcome.1060.b: "Envoyez-moi l’un de vos ecclésiastiques érudits."
 study_scripture_outcome.1060.c: "Que [ROOT.Char.GetFaith.HighGodName] les protège."
 pam_ss_lettered_brother_tt: "Un #EMP clerc érudit#! de l’ordre rejoint votre [court|E]"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.Custom('FR_le_Char_U_Pi')|U][lettered_brother.GetShortUIName|U] arrive de [order_head.GetPrimaryTitle.GetNameNoTier]"
