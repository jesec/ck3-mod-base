l_french:
 influence_house_ambition_ongoing.1001.tt: "Une oreille attentive"
 influence_house_ambition_ongoing.1001.desc: "Si je pouvais trouver une oreille attentive au sein de la compagnie de [target.GetFirstName], cela l’aiderait peut-être à changer d’avis et à voir les choses comme je les vois.\n\nJe préfère choisir une personne avec qui il est agréable de discuter et qui sait bien s’exprimer. Cela ne ferait pas de mal non plus qu’elle soit agréable à regarder.\n\nAprès m’être renseigné[ROOT.Char.Custom('FR_E')] discrètement sur les courtisans de [target.GetFirstName], j’ai trouvé deux [Select_CString(And(target_associate_01.IsFemale, target_associate_02.IsFemale), 'candidates', 'candidats')] : [target_associate_01.GetFirstName] et [target_associate_02.GetFirstName]."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip] est un bon choix."
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip] pourrait réussir à se faire entendre de [Select_CString(target.IsFemale,'sa maîtresse','son maître')]."
 influence_house_ambition_ongoing.1001.c: "Mes paroles suffisent."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip] avance un argument convaincant en votre nom"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip] n’arrive pas à trouver un bon argument"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip] avance un argument convaincant en votre nom"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip] n’arrive pas à trouver un bon argument"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "Veut de l’argent en échange de son aide."
 influence_house_ambition_ongoing.1001.cooltip.relation: "Ne demande rien en échange."
 influence_house_ambition_ongoing.1001.cooltip.lewd: "Suggère une récompense « alternative »"
 influence_house_ambition_ongoing.1001.cooltip.ambition: "Veut une faveur en retour."
 influence_house_ambition_ongoing.1002.tt: "Âpres négociations"
 influence_house_ambition_ongoing.1002.desc: "Je commence à me demander si [target.GetFirstName] me prend vraiment au sérieux. Tout ce que j’entends, ce sont des promesses vagues, des retards et des débats interminables et creux.\n\nIl est temps que j’exprime mon mécontentement. Pas directement peut-être, mais de manière à ce qu’[target.Custom('FR_IlElle')] comprenne qu’il y a des conséquences à contrarier un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] de mon envergure !"
 influence_house_ambition_ongoing.1002.a: "Nuire à ses intérêts commerciaux"
 influence_house_ambition_ongoing.1002.b: "Que des voyous tendent une embuscade à son courtisan et le rouent de coups."
 influence_house_ambition_ongoing.1002.c: "Mettre le feu à sa demeure"
 influence_house_ambition_ongoing.1002.d: "Je vais lui enseigner la terreur !"
 influence_house_ambition_ongoing.1002.e: "Je vais encore faire preuve de patience pendant un petit moment."
