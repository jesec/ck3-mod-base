l_french:
 culture_notification.0010.t: "Tradition abandonnée"
 culture_notification.0010.desc: "La [culture|El] [this_player.GetCulture.GetName] a abandonné la [tradition|El] [tradition.GetName]"
 culture_notification.0011.t: "Tradition adoptée"
 culture_notification.0011.desc: "La [culture|El] [this_player.GetCulture.GetName] a embrassé la [tradition|El] [tradition.GetName]"
 culture_notification.1001.t: "Culture hybride : [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "[founder.Custom('FR_le_Char_Pi')|U][founder.GetTitledFirstName] a formé la [hybrid_culture|El] [new_culture.GetName|V] à partir des cultures [parent_1.GetName] et [parent_2.GetName]"
 culture_notification.1011.t: "L’hybridation [new_culture.GetNameNoTooltip]"
 culture_notification.1011.intro: "Des années d’échange ont suffi à rapprocher les peuples [parent_1.GetCollectiveNoun|l] et [parent_2.GetCollectiveNoun|l], à tel point qu’ils ont donné naissance à un nouveau peuple : les [new_culture.GetCollectiveNoun].\n\n"
 culture_notification.1011.blend: "Le mélange saute aux yeux : ils ont conservé la tradition [parent_1.GetNameNoTooltip] de [tradition_1.GetName], ainsi que la coutume [parent_2.GetNameNoTooltip] de [tradition_2.GetName]. Ensemble, ils forment ce nouveau peuple."
 culture_notification.1011.blend_fallback: "Aucun des deux parents ne cherche à s’approprier la part du lion : la culture [new_culture.GetNameNoTooltip] est un subtil mélange des deux univers."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "La [hybrid_culture|El] [new_culture.GetName] s’est formée à partir des [cultures|El] [parent_1.GetName] et [parent_2.GetName]."
 culture_notification.1101.t: "Culture divergente : [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.Custom('FR_le_Char_Pi')|U][founder.GetTitledFirstName] a créé la culture [new_culture.GetName|V] qui [Concept('divergent_culture','diverge')|E] de la [parent_1.GetName]"
 culture_notification.1111.t: "La divergence [new_culture.GetNameNoTooltip]"
 culture_notification.1111.intro: "Un dialecte modifié par-ci, une nouvelle coutume par-là... On n’y prête pas attention au départ, mais les faits sont là : les [parent_1.GetCollectiveNoun] vivant en [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] s’appellent désormais les [new_culture.GetCollectiveNoun].\n\n"
 culture_notification.1111.tradition.new: "Les traditions de leurs ancêtres ont fait place à la tradition [new_tradition.GetName]."
 culture_notification.1111.tradition.lost: "Ils ont abandonné la tradition [lost_tradition.GetName] des [parent_1.GetCollectiveNounNoTooltip]."
 culture_notification.1111.ethos.bellicose: "Assaillis par leurs ennemis et rivaux, les [new_culture.GetCollectiveNounNoTooltip] ont développé la philosophie [new_culture.GetEthos.GetName], confiant ainsi leur sort à la force des armes."
 culture_notification.1111.ethos.bureaucratic: "Les [new_culture.GetCollectiveNounNoTooltip] ont adopté la philosophie [new_culture.GetEthos.GetName], préférant les longues chartes et les chroniques encore plus longues."
 culture_notification.1111.ethos.courtly: "Soucieux des bonnes manières et du cérémonial, les [new_culture.GetCollectiveNounNoTooltip] ont adopté une nouvelle philosophie : [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.communal: "Dans le triomphe comme dans la tragédie, les [new_culture.GetCollectiveNounNoTooltip] ont opté pour une philosophie [new_culture.GetEthos.GetName] qui les rapproche de leurs voisins."
 culture_notification.1111.ethos.stoic: "Dans un monde aussi dangereux qu’imprévisible, les [new_culture.GetCollectiveNounNoTooltip] se sont tournés vers une philosophie [new_culture.GetEthos.GetName], qui privilégie le courage avant tout."
 culture_notification.1111.ethos.spiritual: "Afin de chercher les réponses en eux-mêmes, les [new_culture.GetCollectiveNounNoTooltip] ont adhéré à une philosophie [new_culture.GetEthos.GetName], plus pieuse que jamais."
 culture_notification.1111.ethos.egalitatian: "La naissance compte désormais moins que le mérite chez les [new_culture.GetCollectiveNounNoTooltip], qui ont adopté une société [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.unchanged: "Leur vision de la vie n’a pas changé, mais les dissensions politiques et les frontières ont divisé un même peuple en deux."
 culture_notification.1111.outro.other: "\n\nQue ce soit par la ruse ou par conviction, [founder.Custom('FR_le_Char_Pi')][founder.GetTitledFirstName] se trouve aujourd’hui à la tête de ce renouveau culturel."
 culture_notification.1111.outro.founder: "\n\nLes [new_culture.GetCollectiveNounNoTooltip] se tournent vers moi, désormais. Notre futur commence ici."
 culture_notification.1111.a.other: "Nous verrons comment la situation évolue."
 culture_notification.1111.a.founder: "Une nouvelle ère, un nouveau peuple !"
 culture_notification_tooltip: "La [divergent_culture|El] [new_culture.GetName] a bifurqué de la [culture|El] [parent_1.GetName]."
