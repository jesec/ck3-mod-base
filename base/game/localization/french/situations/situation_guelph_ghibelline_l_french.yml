 gg_tt_agitation_progressbar_disabled: "Durant la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName], aucun [situation_catalyst_catalyst|El] n’est gagné et la [situation_phase_phase|El] ne peut que passer à [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] via la [decision|El] #V $guelph_ghibelline_peace_decision$#!"
 gg_see_endings_button: "#clickable Voir les dénouements de situation#!"
 gg_see_phases_button: "#clickable Voir les phases potentielles#!"
