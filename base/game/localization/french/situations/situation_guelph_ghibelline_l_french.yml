 #Situation Regions
 guelph_ghibelline_sub_region_core: "Terres impériales"
 guelph_ghibelline_sub_region_core_desc: "Tous les [counties|El] des [kingdoms|El] d’Italie et d’Allemagne du [GetTitleByKey('e_hre').GetDefinitiveName] où les [guelphs|El] et les [ghibellines|El] s'affrontent"
 #Participant Groups
 gg_leader_group_help: "#help \n\nL’absence de chef dans un des camps fera pencher la situation en faveur de l’autre.#!"
 guelph_ghibelline_participant_group_guelph_leader: "Chef $guelph|l$"
 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main' )]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "Le chef des [guelphs|El] dans la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nLors du prélude des [Concept('situation_phase', 'phases de situation')|E] [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] et [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName], le $religiousheadname_pope|l$ mène les [guelphs|El] et le conflit s'envenime au fil de l’Histoire. Les [decisions|El] de chef seront disponibles une fois que le prélude aura cédé sa place au conflit ouvert.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "Le chef des [guelphs|El] dans la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nCe chef dispose de [decisions|El] uniques lui permettant d’orienter le conflit :\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! et #V $guelph_ghibelline_conflict_decision$#! pour faire passer la [situation|El] d’une phase plus calme à une autre [situation_phase|El] plus agitée\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#! pour terminer la situation en faveur des [guelphs|El] lorsqu'ils ont l’avantage\n$BULLET_WITH_TAB$La décision de démissionner et de donner les rênes à un partisan convenable$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "Chef $ghibelline|l$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "Le chef des [ghibellines|El] dans la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nLors du prélude des [Concept('situation_phase', 'phases de situation')|E] [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] et [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName], le dirigeant du [GetTitleByKey('e_hre').GetName] mène les [ghibellines|El] et le conflit s'envenime au fil de l’Histoire. Les [decisions|El] de chef seront disponibles une fois que le prélude aura cédé sa place au conflit ouvert.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "Le chef des [ghibellines|El] dans la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nCe chef dispose de [decisions|El] uniques lui permettant d’orienter le conflit :\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! et #V $guelph_ghibelline_conflict_decision$#! pour faire passer la [situation|El] d’une phase plus calme à une autre [situation_phase|El] plus agitée\n$BULLET_WITH_TAB$#V $ghibelline_victory_decision$#! pour terminer la situation en faveur des [ghibellines|El] lorsqu'ils ont l’avantage\n$BULLET_WITH_TAB$La décision de démissionner et de donner les rênes à un partisan convenable$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_member: "Partisan $guelph|l$"
 guelph_ghibelline_participant_group_guelph_member_desc: "Partisan [guelph|El] dans la [situation|El] [GetSituation('guelph_ghibelline').GetName]."
 guelph_ghibelline_participant_group_ghibelline_member: "Partisan $ghibelline|l$"
 guelph_ghibelline_participant_group_ghibelline_member_desc: "Partisan [ghibelline|El] dans la [situation|El] [GetSituation('guelph_ghibelline').GetName]."
 guelph_ghibelline_participant_group_undecided: "Indécis"
 guelph_ghibelline_participant_group_undecided_desc: "Indécis dans la [situation|El] [GetSituation('guelph_ghibelline').GetName]. En s’y prenant bien, on pourrait sans doute le convaincre de se rallier à l’un ou l’autre camp.\n\nNe peut pas déclencher de [situation_catalysts|El] et a moins de chance de gagner de la [gg_involvement|El]."
 guelph_ghibelline_participant_group_outsider: "Étranger"
 guelph_ghibelline_participant_group_outsider_desc: "Étranger dans la [situation|El] [GetSituation('guelph_ghibelline').GetName]. En général, des aventuriers sans terre et d’autres types de mercenaires.\n\nNe peut ni déclencher de [situation_catalysts|El] ni gagner de la [gg_involvement|El]."
 guelph_ghibelline_all: "[situation_phase_phase|E] actuelle de la [situation|El] des [guelph_ghibelline_situation|El]"
 guelph_ghibelline_guelph_leader: "[situation_phase_phase|E] de la [situation|El] des [guelph_ghibelline_situation|El] #weak ($PARTICIPANT_GROUP|l$)#!"
 guelph_ghibelline_guelph_member: "[situation_phase_phase|E] de la [situation|El] des [guelph_ghibelline_situation|El] #weak ($PARTICIPANT_GROUP|l$)#!"
 guelph_ghibelline_ghibelline_leader: "[situation_phase_phase|E] de la [situation|El] des [guelph_ghibelline_situation|El] #weak ($PARTICIPANT_GROUP|l$)#!"
 guelph_ghibelline_ghibelline_member: "[situation_phase_phase|E] de la [situation|El] des [guelph_ghibelline_situation|El] #weak ($PARTICIPANT_GROUP|l$)#!"
 #Situation Phases
 guelph_ghibelline_in_nomine_domini_situation_phase: "$situation_guelph_ghibelline_phase_in_nomine_domini$"
 guelph_ghibelline_dictatus_papae_situation_phase: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 guelph_ghibelline_agitation_situation_phase: "$situation_guelph_ghibelline_phase_agitation$"
 guelph_ghibelline_guelph_advantage_situation_phase: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_ghibelline_ghibelline_advantage_situation_phase: "$situation_guelph_ghibelline_phase_ghibelline_advantage$"
 guelph_ghibelline_repose_situation_phase: "$situation_guelph_ghibelline_phase_repose$"
 in_nomine_domini: "$situation_guelph_ghibelline_phase_in_nomine_domini$"
 in_nomine_domini_desc: "$situation_guelph_ghibelline_phase_in_nomine_domini_desc_short$"
 precursor_situation_leader_help: "#help Dans cette [situation_phase_phase|El], le dirigeant du [GetTitleByKey('e_hre').GetName] doit être le [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName|l] et le $religiousheadname_pope|l$ doit être le [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName|l].#!"
 situation_guelph_ghibelline_phase_in_nomine_domini: "Résurgence papale"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] est une période relativement calme, qui n’a que peu de répercussions immédiates.\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "Dans environ [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1' ), 'an', 'ans' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1' ), 'mois', 'mois' ) )], la situation va s'aggraver et entrer dans la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]"
 gg_nomine_domini_transition_desc: "Bien que la plupart des principes du #EMP Dictatus Papae#! (...)"
 dictatus_papae: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "Dictatus papae"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] est une aggravation de la première phase [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName].\n\nDésormais, les relations entre les monarques et leurs vassaux ecclésiastiques se durcissent, ces derniers étant tiraillés d’un côté par le $religiousheadname_pope|l$, qui revendique un pouvoir universel, et de l’autre par leurs seigneurs liges, désireux de préserver leur souveraineté.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "Dans environ [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), 'an', 'ans' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), 'mois', 'mois' ) )], la situation va s'aggraver et entrer dans la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] ou d’[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]"
 gg_dictatus_papae_transition_desc: "Bien que la plupart des principes du #EMP Dictatus Papae#! (...)"
 ad_interim: "$situation_guelph_ghibelline_phase_ad_interim$"
 ad_interim_desc: "$situation_guelph_ghibelline_phase_ad_interim_desc_short$"
 situation_guelph_ghibelline_phase_ad_interim: "Concordat de Worms"
 situation_guelph_ghibelline_phase_ad_interim_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] est le point de bascule où le [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName|l] et le [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName|l] décident si la prochaine phase sera une phase de [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName|l] ou d’[GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName|l]...\n\n$precursor_situation_leader_help$"
 agitation: "$situation_guelph_ghibelline_phase_agitation$"
 agitation_desc: "$situation_guelph_ghibelline_phase_agitation_desc_short$"
 situation_guelph_ghibelline_phase_agitation: "Agitation"
 situation_guelph_ghibelline_phase_agitation_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] se caractérise par une intensification et une escalade des conflits, au cours desquels se livrent des batailles et des guerres visant à accroître la puissance du camp victorieux.\n\nSi l’une ou l’autre des parties au conflit détient au moins 70% du pouvoir, la phase passera directement à l’une des deux phases suivantes :\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
 guelph_advantage: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_advantage_desc: "$situation_guelph_ghibelline_phase_guelph_advantage_desc_short$"
 situation_guelph_ghibelline_phase_guelph_advantage: "Avantage guelfe"
 situation_guelph_ghibelline_phase_guelph_advantage_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] indique que les [guelphs|El] ont l’avantage dans cette période marquée par les conflits.\n\nEn conséquence directe, les $guelphs|l$ bénéficient de bonus supplémentaires, mais ceux qui jouissent d’un pouvoir considérable peuvent aussi voir ce pouvoir mis à l’épreuve, de temps à autre..."
 ghibelline_advantage: "$situation_guelph_ghibelline_phase_ghibelline_advantage$"
 ghibelline_advantage_desc: "$situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short$"
 situation_guelph_ghibelline_phase_ghibelline_advantage: "Avantage gibelin"
 situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] indique que les [ghibellines|El] ont l’avantage dans cette période marquée par les conflits.\n\nEn conséquence directe, les $ghibellines|l$ bénéficient de bonus supplémentaires, mais ceux qui jouissent d’un pouvoir considérable peuvent aussi voir ce pouvoir mis à l’épreuve, de temps à autre..."
 repose: "$situation_guelph_ghibelline_phase_repose$"
 repose_desc: "$situation_guelph_ghibelline_phase_repose_desc_short$"
 situation_guelph_ghibelline_phase_repose: "Repos"
 situation_guelph_ghibelline_phase_repose_desc_short: "Cette [situation_phase_phase|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName] permet à la région de connaître la paix et de se régénérer, ne serait-ce que pour une courte période.\n\nIl est difficile de provoquer des escarmouches et des guerres, et cela est mal vu."
