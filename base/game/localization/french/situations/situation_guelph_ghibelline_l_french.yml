 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "Au nom du Seigneur est une bulle papale rédigée le 13 avril 1059 par le $religiousheadname_pope|l$ Nicolas II. Elle a jeté les bases de réformes majeures concernant l’élection papale, dont la plus importante fut l’exclusion des monarques du processus d’élection et de confirmation, ce qui fit des cardinaux-évêques les seuls électeurs."
 DICTATUS_PAPAE_GLOSS: "Décrets du Pape est un recueil de 27 revendications de pouvoir du $religiousheadname_pope|l$. Il a été dicté en 1075 par le $religiousheadname_pope|l$ Grégoire VII, à peu près au moment où éclata la querelle des investitures."
