 # None of these need to be translated, it's just that they can look a bit nicer in here where we can format them instead of doing raw tooltips
 control_console_button_tooltip: "Clic gauche : [GetPlayer.GetCapitalLocation.GetCounty.GetName] gagne 25 de contrôle\nClic gauche + Maj : chaque comté possédé gagne 25 de contrôle\nClic droit : [GetPlayer.GetCapitalLocation.GetCounty.GetName] perd 25 de contrôle\nClic droit + Maj : chaque comté possédé perd 25 de contrôle"
 prosperity_console_button_tooltip: "Clic gauche : [GetPlayer.GetCapitalLocation.GetCounty.GetName] gagne 5 de prospérité\nClic gauche + Maj : chaque comté possédé gagne 5 de prospérité\nClic droit : [GetPlayer.GetCapitalLocation.GetCounty.GetName] perd 5 de prospérité\nClic droit + Maj : chaque comté possédé perd 5 de prospérité"
 popular_opinion_console_button_tooltip: "Clic gauche : [GetPlayer.GetCapitalLocation.GetCounty.GetName] gagne 5 d’opinion populaire\nClic gauche + Maj : chaque comté possédé gagne 5 d’opinion populaire\nClic droit : [GetPlayer.GetCapitalLocation.GetCounty.GetName] perd 5 d’opinion populaire\nClic droit + Maj : chaque comté possédé perd 5 d’opinion populaire"
 size_console_button_tooltip: "Clic gauche : [GetPlayer.GetCapitalLocation.GetNameNoTooltip] gagne 1 de taille\nClic gauche + Maj : chaque province du domaine gagne 1 de taille\nClic droit : [GetPlayer.GetCapitalLocation.GetNameNoTooltip] perd 1 de taille\nClic droit + Maj : chaque province du domaine perd 1 de taille"
