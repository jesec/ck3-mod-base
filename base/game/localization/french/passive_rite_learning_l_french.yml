l_french:
 msg_passive_learned_rite: "Rite appris : [LEFT_CHARACTER.GetRite.GetNameNoTooltip]"
 msg_passive_learned_rite_desc: "Après une longue observation de votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], vous [Concept('agnostic_knowledge', 'connaissez')|E] les [core_tenets|El] et les [doctrines|El] du [rite|El] [passive_learn_source.GetRite.GetAdherentName]."
 msg_passive_learned_tenet: "Principe appris : [RIGHT_TENET.GetBaseNameNoTooltip|l]"
 msg_passive_learned_tenet_desc: "En observant votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], pratiquer le [core_tenet|El] [passive_learn_tenet.GetBaseName] du [rite|El] [passive_learn_source.GetRite.GetAdherentName], vous l’avez [Concept('agnostic_knowledge', 'appris')|E]."
 msg_passive_learned_tenet_special: "$msg_passive_learned_tenet$"
 msg_passive_learned_tenet_special_desc: "$msg_passive_learned_tenet_desc$"
 msg_passive_learned_tenet_cranial_trophies_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] adhère au [core_tenet|El] [passive_learn_tenet.GetBaseName], et c’est ainsi que vous avez pris [Concept('agnostic_knowledge', 'conscience')|E] de sa réalité macabre."
 msg_passive_learned_tenet_ritual_cannibalism_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] honore le [core_tenet|El] [passive_learn_tenet.GetBaseName], et vous en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_tenet_human_sacrifice_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] a accompli le [core_tenet|El] [passive_learn_tenet.GetBaseName] en votre présence, et vous en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_tenet_warmonger_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] vit selon le [core_tenet|El] [passive_learn_tenet.GetBaseName], et vous avez acquis une [agnostic_knowledge|El] de sa logique."
 msg_passive_learned_tenet_takamin_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] pratique quotidiennement le [core_tenet|El] [passive_learn_tenet.GetBaseName], et vous avez acquis des [Concept('agnostic_knowledge', 'connaissances')|E] sur ses pratiques."
 msg_passive_learned_tenet_exaltation_of_pain_desc: "En observant votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], pratiquer le [core_tenet|El] [passive_learn_tenet.GetBaseName] du [rite|El] [passive_learn_source.GetRite.GetAdherentName], vous avez acquis des [Concept('agnostic_knowledge', 'connaissances')|E] sur le [core_tenet|El] [passive_learn_tenet.GetBaseName] – même si cela est déconcertant."
 msg_passive_learned_tenet_sacrificial_ceremonies_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] a suivi pas à pas le [core_tenet|El] [passive_learn_tenet.GetBaseName] en votre présence, et vous en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_tenet_gruesome_festivals_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] vous a présenté le [core_tenet|El] [passive_learn_tenet.GetBaseName] dans toute sa splendeur, et vous en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_tenet_adorcism_desc: "En observant votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], pratiquer le [core_tenet|El] [passive_learn_tenet.GetBaseName] du [rite|El] [passive_learn_source.GetRite.GetAdherentName], vous avez acquis des [Concept('agnostic_knowledge', 'connaissances')|E] sur le [core_tenet|El] [passive_learn_tenet.GetBaseName]."
 msg_passive_learned_tenet_hedonistic_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] vit selon le [core_tenet|El] [passive_learn_tenet.GetBaseName], et vous avez acquis des [Concept('agnostic_knowledge', 'connaissances')|E] sur son attrait."
 msg_passive_learned_doctrine: "Doctrine apprise : [RIGHT_DOCTRINE.GetDescriptiveNameNoTooltip( GetPlayer.GetFaith )]"
 msg_passive_learned_doctrine_desc: "En observant votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], vivre selon la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] du [rite|El] [passive_learn_source.GetRite.GetAdherentName], vous l’avez [Concept('agnostic_knowledge', 'apprise')|E]."
 msg_passive_learned_doctrine_polygamy_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] vit selon la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )], et vous avez acquis une [agnostic_knowledge|El] de son fonctionnement."
 msg_passive_learned_doctrine_concubines_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] adhère à la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )], et vous en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_doctrine_consanguinity_unrestricted_desc: "En observant votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], pratiquer le [core_tenet|El] [passive_learn_tenet.GetBaseName] du [rite|El] [passive_learn_source.GetRite.GetAdherentName], vous avez acquis des [Concept('agnostic_knowledge', 'connaissances')|E] sur la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]."
 msg_passive_learned_doctrine_deviancy_virtuous_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] pratique la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] ouvertement, et vous en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_doctrine_kinslaying_accepted_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip] du [rite|El] [passive_learn_source.GetRite.GetName] vous a enseigné la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] au cours d’une leçon effrayante, et vous en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_doctrine_witchcraft_virtuous_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] embrasse la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] ouvertement, et vous en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_passive_learned_doctrine_funeral_sky_burial_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] respecte la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )], et vous avez [Concept('agnostic_knowledge', 'compris')|E] sa signification."
 msg_passive_learned_doctrine_funeral_mummification_desc: "Votre [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)], [passive_learn_source.Custom('FR_le_Char_Pi')][passive_learn_source.GetTitledFirstNameNoTooltip], du [rite|El] [passive_learn_source.GetRite.GetName] adhère à la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )], et vous en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 message_filter_passive_religious_learning: "@religious_icon! Apprentissage religieux passif"
 message_filter_passive_religious_learning_desc: "Vous apprenez passivement un [core_tenet|El], une [doctrine|El] ou tout un [rite|El] d’un proche ou d’un courtisan de [faith|El] étrangère"
 clerical_justifications_perk_passive_learning_effect: "Apprend passivement un [core_tenet|El], une [doctrine|El] ou tout un [rite|El] d’un proche #weak (conjoint, ami, etc.)#! et en [Concept('traveling', 'voyageant')|E] deux fois plus souvent"
 apa_passive_religious_learning_host_title: "[first.Custom('FR_le_Char_U_Pi')|U][first.GetShortUINameNoTooltip] pratique son [rite|El]"
 apa_passive_religious_learning_host_tt: "Vous observez [first.Custom('FR_le_Char_U_Pi')][first.GetShortUIName] pratiquer le [rite|El] [first.GetRite.GetAdherentName]"
 apa_passive_religious_learning_guest_title: "[first.Custom('FR_le_Char_U_Pi')|U][first.GetShortUINameNoTooltip] pratique son [rite|El]"
 apa_passive_religious_learning_guest_tt: "Vous observez [first.Custom('FR_le_Char_U_Pi')][first.GetShortUIName] pratiquer le [rite|El] [first.GetRite.GetAdherentName]"
 apa_passive_religious_learning_pilgrimage_pool_title: "Enseignements [first.Custom('FR_du_Char_U_Pi')][first.GetShortUINameNoTooltip]"
 apa_passive_religious_learning_pilgrimage_pool_tt: "Vous observez [first.Custom('FR_le_Char_U_Pi')][first.GetShortUIName], un[first.Custom('FR_E')] autochtone, pratiquer le [rite|El] [first.GetRite.GetAdherentName]"
 apa_passive_religious_learning_pilgrimage_rite_title: "Le [rite|El] local"
 apa_passive_religious_learning_pilgrimage_rite_tt: "Vous observez les habitants pratiquer le [rite|El] [passive_learn_rite.GetAdherentName]"
 ### HoR passive learning
 msg_hor_learned_tenet_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], votre étude de la [faith|El] [passive_learn_source_faith.GetAdjective] voisine vous a permis d’acquérir la [agnostic_knowledge|El] du [core_tenet|El] [passive_learn_tenet.GetBaseName]."
 msg_hor_learned_doctrine_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], votre étude de la [faith|El] [passive_learn_source_faith.GetAdjective] voisine vous a permis d’acquérir la [agnostic_knowledge|El] de la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]."
 msg_hor_learned_tenet_cranial_trophies_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], votre étude du [core_tenet|El] [passive_learn_tenet.GetBaseName] de la [faith|El] [passive_learn_source_faith.GetAdjective] vous a permis d’en acquérir la [agnostic_knowledge|El] et d’en consigner l’aspect macabre."
 msg_hor_learned_tenet_ritual_cannibalism_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], l’observation du [core_tenet|El] [passive_learn_tenet.GetBaseName] de la [faith|El] [passive_learn_source_faith.GetAdjective] vous a permis d’en acquérir la [agnostic_knowledge|El]."
 msg_hor_learned_tenet_human_sacrifice_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez répertorié les pratiques quotidiennes du [core_tenet|El] [passive_learn_tenet.GetBaseName] de la [faith|El] [passive_learn_source_faith.GetAdjective] et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_tenet_warmonger_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez étudié la façon dont la [faith|El] [passive_learn_source_faith.GetAdjective] fait du [core_tenet|El] [passive_learn_tenet.GetBaseName] une pratique, et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_tenet_takamin_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez répertorié les pratiques quotidiennes du [core_tenet|El] [passive_learn_tenet.GetBaseName] de la [faith|El] [passive_learn_source_faith.GetAdjective], et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_tenet_exaltation_of_pain_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], votre étude de la [faith|El] [passive_learn_source_faith.GetAdjective] vous a permis d’acquérir la [agnostic_knowledge|El], quoique déroutante, du [core_tenet|El] [passive_learn_tenet.GetBaseName]."
 msg_hor_learned_tenet_sacrificial_ceremonies_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez consigné pas à pas le [core_tenet|El] [passive_learn_tenet.GetBaseName] de la [faith|El] [passive_learn_source_faith.GetAdjective] et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_tenet_gruesome_festivals_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez été témoin du [core_tenet|El] [passive_learn_tenet.GetBaseName] de la [faith|El] [passive_learn_source_faith.GetAdjective] et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_tenet_adorcism_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez observé la façon dont la [faith|El] [passive_learn_source_faith.GetAdjective] suivait le [core_tenet|El] [passive_learn_tenet.GetBaseName], et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_tenet_hedonistic_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], l’étude de la [faith|El] [passive_learn_source_faith.GetAdjective] vous a permis d’acquérir la [agnostic_knowledge|El] du [core_tenet|El] [passive_learn_tenet.GetBaseName]."
 msg_hor_learned_doctrine_polygamy_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetName], vous avez étudié la manière dont la [faith|El] [passive_learn_source_faith.GetAdjective] organise ses communautés selon la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] et en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_concubines_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetName], vous avez découvert la façon dont la [faith|El] [passive_learn_source_faith.GetAdjective] conçoit la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] et en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_consanguinity_unrestricted_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], votre étude de la [faith|El] [passive_learn_source_faith.GetAdjective] vous a familiarisé à la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )], et vous a permis d’en acquérir une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_deviancy_virtuous_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetName], vous avez observé la façon dont la [faith|El] [passive_learn_source_faith.GetAdjective] pratique ouvertement la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] et en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_kinslaying_accepted_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetName], vous avez ressenti un profond malaise en constatant la façon dont la [faith|El] [passive_learn_source_faith.GetAdjective] justifie la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] et en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_witchcraft_virtuous_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetName], vous avez étudié la façon dont la [faith|El] [passive_learn_source_faith.GetAdjective] organise ses communautés selon la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] et en avez acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_funeral_sky_burial_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez répertorié les pratiques quotidiennes de la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] de la [faith|El] [passive_learn_source_faith.GetAdjective] et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
 msg_hor_learned_doctrine_funeral_mummification_desc: "En tant que chef du [rite|El] [passive_learn_hor.GetRite.GetAdherentName], vous avez étudié la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] de la [faith|El] [passive_learn_source_faith.GetAdjective] et en avez ainsi acquis une [Concept('agnostic_knowledge', 'compréhension')|E]."
