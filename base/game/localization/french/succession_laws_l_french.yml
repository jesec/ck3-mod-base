 #Appointment Succession Law
 appointment_succession_law: "Succession par nomination"
 appointment_succession_law_subname: "Le candidat avec le score le plus élevé hérite"
 appointment_succession_law_effects: "\nType de [appointment_succession_law|El]. Sous une $appointment_succession_law|l$, le [title|El] et ses [holdings|El] associées seront héritées par le candidat ayant obtenu le [candidate_score|El] le plus élevé.\n\nTout [adult|El] dans le [realm|El] peut s’efforcer d’accéder au poste de [Concept('governorship','gouverneur')|E] par divers moyens, allant des [Concept('scheming','complots')|E] à la dépense d’[influence|El]\n"
 #Acclamation Succession Law (Byzantium, EP3)
 acclamation_succession_law: "Succession par acclamation"
 acclamation_succession_law_subname: "$appointment_succession_law_subname$"
 acclamation_succession_law_effects: "\nType de [appointment_succession_law|El]. Sous la [succession|El] par acclamation, le [title|El] d’[empire|El] et ses [holdings|El] associées seront hérités par le candidat ayant obtenu le [candidate_score|El] le plus élevé.\n\nLe groupe de candidats comprend les [house_heads|El] des [noble_families|El] du [realm|El], les [governors|El] et les membres de leur famille.\n"
