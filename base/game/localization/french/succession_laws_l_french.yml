 male_preference_law_effects: "$EFFECT_LIST_BULLET$Les hommes ont priorité sur les femmes dans la succession\n$EFFECT_LIST_BULLET$Les [rulers|El] hommes peuvent avoir des [Concept( 'concubinage', 'concubines' )|E] ou plusieurs [Concept( 'spouse', 'conjointes' )|E] si leur [faith|El] a la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName|l] ou [GetDoctrineType('doctrine_polygamy').GetBaseName|l]"
 equal_law_effects: "$EFFECT_LIST_BULLET$Les hommes et les femmes sont égaux dans la succession\n$EFFECT_LIST_BULLET$Tous les [Concept( 'ruler', 'dirigeant(e)s' )|E] peuvent avoir des [Concept( 'concubinage', 'concubin(e)s' )|E] ou plusieurs [Concept( 'spouse', 'conjoint(e)s' )|E] si leur [faith|El] a la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName|l] ou [GetDoctrineType('doctrine_polygamy').GetBaseName|l]"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$Les femmes ont priorité sur les hommes dans la succession\n$EFFECT_LIST_BULLET$Les [rulers|El] femmes peuvent avoir des [Concept( 'concubinage', 'concubin(e)s' )|E] ou plusieurs [Concept( 'spouse', 'conjoints' )|E] si leur [faith|El] a la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName|l] ou [GetDoctrineType('doctrine_polygamy').GetBaseName|l]"
 female_only_law_effects: "$EFFECT_LIST_BULLET$Les hommes sont exclus de la succession\n$EFFECT_LIST_BULLET$Les hommes ne peuvent pas hériter de [claims|El]\n$EFFECT_LIST_BULLET$Les [rulers|El] femmes peuvent avoir des [Concept( 'concubinage', 'concubin(e)s' )|E] ou plusieurs [Concept( 'spouse', 'conjoints' )|E] si leur [faith|El] a la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName|l] ou [GetDoctrineType('doctrine_polygamy').GetBaseName|l]"
 gender_preference_law_not_for_clergy_tt: "Les [rulers|El] ecclésiastiques et théocratiques ne peuvent appliquer que les [gender_laws|El] [GetLaw('male_only_law').GetName], [GetLaw('female_only_law').GetName] ou [GetLaw('equal_law').GetName], selon ce que prescrit la [doctrine|El] du sexe du clergé propre à leur [rite|El]."
 SUCCESSION_FORM_NAME: "[Character.GetActiveLawInGroupWithFlag('succession_order_laws').GetName|l] et [Character.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName|l]"
 feudal_elective_succession_law: "Élection féodale"
 princely_elective_succession_law: "Élection par les princes-électeurs"
 feudal_elective_succession_law_effects: "Le [ruler|El] et tous les [vassals|El] directs [de_jure|El] d’un ou deux [ranks|El] en dessous du [title|El] peuvent désigner un [title_heir|El] parmi eux et la [close_family|El] du dirigeant."
 princely_elective_succession_law_effects: "L’empereur et les #V 7#! [prince_electors|El] peuvent désigner un [title_heir|El] parmi eux, les enfants [Concept( 'legitimate', 'légitimes' )|E] et frères et sœurs de l’empereur, ainsi que les [vassals|El] [de_jure|El] importants de l’empire.\n\nSi un [title|El] d’[elector|El] préféré est détenu par des infidèles, est hors du [realm|El] ou est détruit, un autre vassal de jure prendra sa place. Cette [succession_law|El] accorde une grande importance à la [faith|El] et la [piety|El]."
 gaelic_elective_succession_law: "Tanistrie"
 gaelic_elective_succession_law_effects: "Le [ruler|El] et tous les [vassals|El] au-dessus du [rank|El] de [baron|El] et un ou deux rangs en dessous du [title|El] peuvent désigner un [title_heir|El], le taniste, parmi les membres de sa [dynasty|El]. Les vassaux auront tendance à favoriser les parents plus âgés éloignés que la [close_family|El]."
 saxon_elective_succession_law: "Élection saxonne"
 saxon_elective_succession_law_subname: "Witenagemot"
 saxon_elective_succession_law_effects: "Le [ruler|El] et tous les vassaux directs [de_jure|El] adultes d’un ou deux [ranks|El] en dessous du [title|El] peuvent désigner un [title_heir|El] parmi les [powerful_vassals|El], les enfants [Concept( 'legitimate', 'légitimes' )|E] du dirigeant et tout [claimant|El] valide."
 scandinavian_elective_succession_law: "Élection scandinave"
 scandinavian_elective_succession_law_subname: "Ting"
 scandinavian_elective_succession_law_effects: "Le [ruler|El] et tous les [vassals|El] [de_jure|El] (sauf les barons) peuvent désigner un [title_heir|El] parmi la [extended_family|El] du dirigeant et tout [claimant|El]. La [voting_power|El] dans cette [succession_law|El] est influencée par le [county_development|El] total du [domain|El] de l’[elector|El] et l’[county_opinion|El] de la [capital|El]."
 feudal_elective_candidates: "Famille proche, prétendants et électeurs"
 feudal_elective_candidates_tooltip: "Pour être un candidat valide dans une succession féodale élective, un personnage doit remplir l’une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [close_family|El] du dirigeant actuel, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république. Les enfants d’un candidat ne peuvent pas être nommés.\n$EFFECT_LIST_BULLET$Être un [claimant|El] au titre, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république\n$EFFECT_LIST_BULLET$Être un [elector|El] féodal valide du titre"
 feudal_elective_electors: "Dirigeant et vassaux"
 feudal_elective_electors_tooltip: "Pour être un [elector|El] valide dans une succession féodale élective, un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un vassal [de_jure|El] du titre\n$EFFECT_LIST_BULLET$Être un vassal direct du titre\n$EFFECT_LIST_BULLET$Être seulement un ou deux [ranks|El] en dessous du titre"
 princely_elective_candidates: "$feudal_elective_candidates$"
 princely_elective_candidates_tooltip: "Pour être un candidat valide dans la succession princière élective, un personnage doit remplir l’une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [close_family|El] du dirigeant actuel, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république. Les enfants d’un candidat ne peuvent pas être nommés.\n$EFFECT_LIST_BULLET$Être un [claimant|El] au titre, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république\n$EFFECT_LIST_BULLET$Être un [elector|El] féodal valide du titre"
 princely_elective_electors: "Princes-électeurs"
 princely_elective_electors_tooltip: "En plus [SuccessionElectionWindow.GetTitle.GetHolder.Custom('FR_du_Char_L')][SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsName|l], les [holders|El] des [titles|El] suivants des [prince_electors|El] préférés en [SuccessionElectionWindow.GetSuccessionLaw.GetName|l] :[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nSi aucun des titres ci-dessus n’est créé, détenu par un [vassal|El] [de_jure|El] impérial, déjà détenu par un autre électeur, ou que la [religion|El] du détenteur diffère de celle de l’Empereur, un autre titre de jure détenu par un vassal impérial direct ou un [independent_ruler|El] sera choisi sur la base de ces critères :\n$EFFECT_LIST_BULLET$Les dirigeants ayant la [faith|El] et la [culture|El] de l’Empereur sont favorisés\n$EFFECT_LIST_BULLET$Les [rulers|El] [Concept('theocratic','théocratiques')|E] et [Concept('feudal','féodaux')|E] sont favorisés"
 gaelic_elective_candidates: "Membres de la dynastie"
 gaelic_elective_candidates_tooltip: "Tous les membres légitimes de la [dynasty|El] du dirigeant actuel qui ne sont pas dans la ligne de succession d’une théocratie ou d’une république sont des candidats valables sous la tanistrie. Les enfants d’un candidat ne peuvent pas être nommés."
 gaelic_elective_electors: "$feudal_elective_electors$"
 gaelic_elective_electors_tooltip: "Pour être un [elector|El] valide dans une tanistrie, un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un vassal [de_jure|El] du titre\n$EFFECT_LIST_BULLET$Être un ou deux [ranks|El] en dessous du titre"
 saxon_elective_candidates: "Enfants, prétendants et vassaux"
 saxon_elective_candidates_tooltip: "Pour être un candidat valide dans la succession par le witenagemot, un personnage doit remplir l’une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un enfant légitime du dirigeant, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république\n$EFFECT_LIST_BULLET$Être un [claimant|El] au titre, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république. Les enfants d’un candidat ne peuvent pas être nommés.\n$EFFECT_LIST_BULLET$Être un vassal féodal [de_jure|El] [powerful_vassal_powerful|El] du titre"
 saxon_elective_electors: "$feudal_elective_electors$"
 saxon_elective_electors_tooltip: "Pour être un [elector|El] valide dans une succession par le witenagemot, un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un vassal [de_jure|El] du titre\n$EFFECT_LIST_BULLET$Être un vassal direct du titre\n$EFFECT_LIST_BULLET$Être adulte\n$EFFECT_LIST_BULLET$NOT be Incapable"
 scandinavian_elective_candidates: "Famille élargie et prétendants"
 scandinavian_elective_candidates_tooltip: "Pour être un candidat valide dans la succession par le Ting, un personnage doit remplir l’une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [extended_family|El] du dirigeant, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république. Les enfants d’un candidat ne peuvent pas être nommés.\n$EFFECT_LIST_BULLET$Être un [claimant|El] au titre, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république"
 scandinavian_elective_electors: "$feudal_elective_electors$"
 scandinavian_elective_electors_tooltip: "Pour être un [elector|El] valide dans une succession par le Ting, un vassal doit remplir toutes les conditions suivantes :\n$EFFECT_LIST_BULLET$Être un vassal direct du titre\n$EFFECT_LIST_BULLET$NOT be a Baron"
