 tribal_elective_candidates_tooltip: "Pour être un candidat valide dans la succession par la Jirga, un personnage doit remplir l’une des conditions suivantes :\n$EFFECT_LIST_BULLET$Être un membre légitime de la [dynasty|El] du dirigeant, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république. Les enfants d’un candidat ne peuvent pas être nommés.\n$EFFECT_LIST_BULLET$Être un [claimant|El] au titre, qui ne soit pas dans la ligne de succession d’une théocratie ou d’une république\n$EFFECT_LIST_BULLET$Être un [direct_vassal|El] du titre"
