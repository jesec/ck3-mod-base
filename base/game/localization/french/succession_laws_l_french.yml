 celestial_ministry_appointment_succession_law_effects: "\nLa [succession|El] repose sur le [merit_level|El] et les [merit_pools|El]\n\nType de [appointment_succession_law|El]. La $celestial_appointment_succession_law|l$ est la succession des [titles|El] de ministre. Il s’agit de postes très appréciés, réservés aux personnages ayant un [merit_level|El] élevé. Les [movements|El], le [merit|El] et l’[influence|El] jouent un rôle majeur dans l’augmentation du [candidate_score|El] d’un candidat."
