 celestial_grand_marshal_appointment_succession_law_effects: "\nLa [succession|El] repose sur le [merit_level|El] et les [merit_pools|El]\n\nType de [appointment_succession_law|El] seulement utilisé par le [minister_grand_marshal|El], un poste réservé aux commandants des plus hauts [merit_levels|El]. Sous une $celestial_grand_marshal_appointment_succession_law|l$, le [title|El] sera hérité par le candidat ayant obtenu le [candidate_score|El] le plus élevé. Le score est principalement influencé par l’[martial_skill|El], le gain de [commander_traits|El] ou la dépense d’[influence|El]."
