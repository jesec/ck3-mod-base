 innovation_heavy_plow: "Charrue lourde"
 innovation_heavy_plow_desc: "Même les charrues plus lourdes peuvent être facilement tirées par des bœufs ou des chevaux si elles sont montées sur roues et tirées par plusieurs animaux. Cette innovation nous permet de travailler des sols qui seraient autrement difficiles ou impossibles à cultiver."
 innovation_heavy_plow_eri: "Système de retenue d’eau"
 innovation_heavy_plow_eri_desc: "Un réseau de bassins endigués récolte l’eau de la mousson et la stocke pour les mois de sécheresse, ce qui nous permet de planter, cultiver et semer tout au long de l’année."
 innovation_heavy_plow_transplanting: "Transplantation et greffe"
 innovation_heavy_plow_transplanting_desc: "Grâce aux techniques de culture et de multiplication des plantes, nous pouvons augmenter considérablement nos récoltes."
 culture_parameter_stone_forts: "Le [GetBuildingType('wall_wardens_offices_1').GetName|l] a besoin de [GetTradeGoodType('trade_good_stone').GetNameWithIcon|l] plutôt que de [GetTradeGoodCategory('trade_category_carpentry_supplies').GetName|l]"
 culture_parameter_heavy_plow: "Le [GetDistrictType('grain_district').GetName|l] a désormais besoin de [GetTradeGoodType('trade_good_iron').GetNameWithIcon|l] et de [GetTradeGoodCategory('trade_category_beasts_of_burden').GetName|l] plutôt que de [GetTradeGoodType('trade_good_cattle').GetNameWithIcon|l]"
 innovation_prospecting: "Recherche"
 innovation_prospecting_desc: "En cherchant activement et méthodiquement de nouveaux filons de minerais, nous pouvons développer l’activité minière de notre pays."
 innovation_coppicing: "Taille des arbres"
 innovation_coppicing_desc: "En choisissant et en coupant les arbres de manière méthodique et organisée, nous pouvons multiplier le rendement forestier pour les marchés concernés, comme la production de charbon et de bois de chauffage."
 innovation_monasticism: "Monachisme"
 innovation_monasticism_desc: "Les monastères ne sont pas récents, mais ils sont devenus plus grands et sont plus nombreux. Des communautés religieuses s’installent désormais autour de ces lieux autrefois isolés, formant leur propre économie et leurs propres communautés laïques."
 innovation_craft_ordinances: "Publication d’ordonnances"
 innovation_craft_ordinances_desc: "Bien que les artisans n’apprécient guère la régulation, ils aiment avoir le droit d’élaborer des règles pour leur commerce spécialisé. Il est mieux pour tout le monde que la qualité et les prix soient contrôlés."
 innovation_merchant_law: "Loi commerciale"
 innovation_merchant_law_desc: "En mettant par écrit les coutumes qui régissent le commerce et en les faisant respecter, nous garantissons un commerce à la fois plus libre et plus organisé sur nos terres."
 innovation_vaulting: "Voûtage"
 innovation_vaulting_desc: "Hautes et minces, les voûtes sont inspirantes, mais surtout plus sûres pour construire un plafond dans les grands bâtiments. Celles de nos maçons utilisent moins de pierre et façonnent des bâtiments qui durent plus longtemps."
 innovation_putting_out_system: "Système domestique"
 innovation_putting_out_system_desc: "Grâce à une organisation globale pour la production quotidienne de chaque chaumière ou ferme de notre pays, nous pourrons être bien plus efficaces. Les marchands se chargeront à la fois de l’achat des matières premières et de la vente du produit fini."
 innovation_deep_mining: "Exploitation minière profonde"
 innovation_deep_mining_desc: "Afin de créer des mines plus profondes que jamais, nous avons imaginé plusieurs solutions techniques : galeries en bois, drainage amélioré et treuils. Ces améliorations nous permettent d’exploiter les filons bien plus profondément qu’avant."
 innovation_pilot_books: "Livres de navigation"
 innovation_pilot_books_desc: "La navigation est une activité dangereuse et sans navigateurs locaux, la plupart des navires seraient condamnés, même le long d’une côte sûre, mais inconnue. En dressant une carte de chaque cap, banc de sable et mouillage, avec leurs relèvements et leurs distances, nous pouvons préserver à jamais le savoir qu’un individu emporterait sinon dans sa tombe."
 innovation_pilot_books_portolan: "Portulans"
 innovation_pilot_books_portolan_desc: "La navigation est une activité dangereuse et sans navigateurs locaux, la plupart des navires seraient condamnés, même le long d’une côte sûre, mais inconnue. En traçant sur nos cartes des lignes de relèvement reliées à la rose des vents et en y indiquant chaque cap, banc de sable et mouillage, nous pouvons préserver à jamais le savoir qu’un individu emporterait sinon dans sa tombe."
 innovation_agronomy: "Agronomie"
 innovation_agronomy_desc: "Travailler la terre peut être difficile, et, bien souvent, les connaissances se transmettent seulement d’un fermier à un autre. En les rassemblant et en rédigeant des traités sur les cultures et l’élevage, nous pouvons diffuser un savoir-faire éprouvé et transformer les traditions en méthodes."
 innovation_bricks: "Briques"
 innovation_bricks_desc: "Nos ancêtres utilisaient déjà les briques, mais les connaissances à ce sujet ne sont pas aussi répandues qu’elles l’étaient auparavant. Les techniques de fabrication et d’utilisation de ce matériau de construction artisanal simple permettent de construire plus rapidement et plus efficacement."
