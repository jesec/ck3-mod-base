 ##############
 #Tribal Era #
 ##############
 #Military
 innovation_motte: "Ouvrages de terre"
 innovation_motte_desc: "Construire nos châteaux sur des monticules est le meilleur moyen de nous assurer de prendre littéralement de la hauteur sur nos ennemis."
 innovation_motte_chinese: "Hāng tu" #夯土
 innovation_motte_chinese_desc: "Construire nos fortifications avec de la terre battue est le meilleur moyen de nous assurer de prendre littéralement de la hauteur sur nos ennemis."
 innovation_motte_actual_motte: "Mottes"
 innovation_motte_actual_motte_desc: "$innovation_motte_desc$"
 innovation_catapult: "Onagre"
 innovation_catapult_desc: "Bien que leur chargement et leur tir soient lents, de telles catapultes à torsion nous permettent d’attaquer les fortifications ennemies tout en restant hors de la portée de leurs archers."
 innovation_catapult_chinese: "Arbalète de siège"
 innovation_catapult_chinese_desc: "Grandes arbalètes portables équipées de plusieurs arcs opposés afin d’augmenter la longueur de traction et la puissance, souvent montées sur un châssis à roulettes pour plus de mobilité."
 innovation_barracks: "Casernes"
 innovation_barracks_desc: "En construisant des bâtiments dédiés pour caserner nos soldats, nous pouvons nous assurer de disposer de suffisamment d’espace pour accueillir nos armées de plus en plus grandes."
 innovation_mustering_grounds: "Terrains de rassemblement"
 innovation_mustering_grounds_desc: "Il ne suffit pas d’avoir des gens prêts à se battre pour nous pour gagner des guerres. En réservant un espace pour permettre aux gens de s’entraîner et de se rassembler pour la bataille, nous pourrons soutenir des groupes de combattants plus expérimentés capables de nous mener à la victoire."
 innovation_bannus: "Ban"
 innovation_bannus_desc: "Fondé sur le pouvoir de commander des hommes au combat, le ban donne à nos dirigeants le pouvoir de contraindre des hommes libres à se battre pour eux, constituant ainsi une base légale pour la formation de grandes armées."
 eligible_accolade_vanguard_attribute_ACCOLADES_DLC: "Les [knights|El] de cette [culture|El] deviennent éligibles aux [accolades|El] [GetAccoladeType('vanguard_attribute').GetName]"
 eligible_accolade_vanguard_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_vanguard_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_footmen: "Peut recruter de la [GetMaA('armored_footmen').GetName|l] comme [men_at_arms|El]"
 unlock_maa_onager: "Peut recruter des [GetMaA('onager').GetName|l] comme [men_at_arms|El]"
 innovation_quilted_armor: "Gambison"
 innovation_quilted_armor_desc: "Formées d’une douzaine de couches de lin cousues ensemble, ces vestes peuvent arrêter même des flèches et constituent un moyen abordable pour nous de protéger un régiment entier pour la bataille."
 innovation_pattern_welding: "Lames en acier de Damas"
 innovation_pattern_welding_desc: "Tordre et souder des tiges de fer et d’acier permet à nos forgerons de créer des lames plus résistantes, plus flexibles et plus meurtrières que le fer brut. Ces armes exigent des mains aguerries et un soin permanent, et les soldats qui les portent demandent à être rémunérés en conséquence."
 #Civic
 innovation_gavelkind: "Gavelkind"
 innovation_gavelkind_desc: "Stabilité et prospérité vont de pair. Au lieu que les vassaux se disputent le pouvoir à la mort du vieux monarque, nous pouvons définir un système de succession prédéterminé et équitable, qui éliminera en grande partie l’instabilité qui se produit traditionnellement lors de la succession."
 innovation_crop_rotation: "Rotation des cultures"
 innovation_crop_rotation_desc: "En passant du modèle traditionnel d’agriculture à deux champs à une rotation à trois champs, nous pouvons produire davantage de cultures chaque année sans épuiser les sols de nos fermes."
 innovation_city_planning: "Plans de cité"
 innovation_city_planning_desc: "En concevant nos villes avant de commencer à les construire, nous pouvons bâtir des propriétés à des emplacements stratégiques et qui sont à la fois plus fonctionnelles et plus esthétiques que celles qui apparaissent de façon désordonnée au fil du temps."
 unlock_city_planning_holdings: "Débloque le [Concept('district_tiers', 'niveau de quartier')|E] :\n$BULLET_WITH_TAB$[GetDistrictType('tribal_economy_prestige_district').GetName] de niveau II"
 innovation_casus_belli: "Casus belli"
 innovation_casus_belli_desc: "La loi du plus fort règne sur les terres depuis des générations, mais si nous avons une justification pour nos guerres, nous pourrions éviter de provoquer la colère de nos voisins et les représailles qui l’accompagnent souvent."
 innovation_plenary_assemblies: "Assemblées plénières"
 innovation_plenary_assemblies_desc: "Afin de gouverner efficacement, nous devons réunir tous les hommes libres du pays pour discuter et résoudre les questions législatives. La présence est obligatoire, et ceux qui ne viennent pas se verront infliger une amende et perdront leur capacité d’influencer toute décision prise."
 unlock_plenary_assemblies_building: "Débloque les [district_tiers|El] :\n$BULLET_WITH_TAB$[GetDistrictType('tribal_holding_district').GetName] de niveau II\n$BULLET_WITH_TAB$[GetDistrictType('household_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('tribal_wanua_district').GetName] de niveau II"
 innovation_prosperity_01: "Travaux publics"
 innovation_prosperity_01_desc: "Le financement de la construction de travaux publics tels que les routes, les écoles et les aqueducs permettra à nos colonies de s’agrandir et d’assurer la prospérité de notre peuple pour les générations à venir."
 innovation_currency_01: "Monnaie"
 innovation_currency_01_desc: "Le troc est lent et inefficace. L’adoption d’une monnaie officielle, comme les cauris ou les pépites de métal, stimulera le commerce et accroîtra la diffusion des idées dans notre pays."
 innovation_ledger: "Registre"
 innovation_ledger_desc: "À mesure que nos terres grandissent, nous avons besoin d’un meilleur moyen de garder une trace de ce que nous possédons. Tenir un registre de nos biens nous permettra de toujours savoir quelles ressources nous avons à notre disposition."
 #Regional
 innovation_viking_tradition: "Tactiques viking"
 innovation_viking_tradition_desc: "Les habitants du Nord ont une longue tradition de commerce, mais aussi de piraterie. Rares sont ceux qui sont prêts à combattre une menace qui apparaît sans prévenir depuis les rives d’un fleuve, et les guerriers vikings sont les maîtres de ce type de guerre."
 innovation_longboats: "Drakkars"
 innovation_longboats_desc: "Nos drakkars sont de formidables navires qui peuvent voyager presque n’importe où et même par mauvais temps, ce qui nous donne une mobilité exceptionnelle sur les mers."
 innovation_carpet_weaving: "Tissage de tapis"
 innovation_carpet_weaving_desc: "Les tapis peuvent aussi bien être des objets importants du quotidien que des produits prestigieux pour la Cour. Dans toute l’Anatolie et la Perse, cette très ancienne tradition de la tapisserie est à la fois durable et magnifique."
 unlock_carpet_weaving_buildings: "Débloque les séries de [buildings|El] :\n$BULLET_WITH_TAB$[GetBuildingType('rug_weaving_1').GetName] pour le [GetDistrictType('wool_district').GetName|l]\n$BULLET_WITH_TAB$[GetBuildingType('luxury_carpet_workshop_1').GetName] pour le [GetDistrictType('guild_district').GetName|l]"
 innovation_mead_brewing: "Fabrication d’hydromel"
 innovation_mead_brewing_desc: "Dans le nord de l’Europe, il est courant d’ajouter du miel aux boissons alcoolisées."
 culture_parameter_unlocks_mead_brewery: "Débloque les séries de [buildings|El] :\n$BULLET_WITH_TAB$[GetBuildingType('mead_brewery_1').GetName] pour le [GetDistrictType('honey_district').GetName|l]"
 unlocks_mead_brewery_name: "#V $innovation_mead_brewing$#!"
 innovation_stockfisk: "Poisson séché"
 innovation_stockfisk_desc: "En faisant sécher du poisson à l’air libre sur des supports en bois, il peut rester comestible bien plus longtemps, ce qui nous permet de le conserver pour les hivers ou les longues expéditions, ou bien de l’exporter dans des régions éloignées."
 innovation_damascus_steel: "Acier de Damas"
 innovation_damascus_steel_desc: "Les forgerons du Proche-Orient ont maîtrisé une technique qui leur permet de fabriquer des lames plus résistantes et plus tranchantes. Souvent richement décorées, ces lames sont désormais associées aux marchés de Damas."
 culture_parameter_damascus_steel_smithing: "Augmente l’effet des besoins en [GetTradeGoodCategory('trade_category_base_metals').GetName|l] de la [GetBuildingType('blacksmiths_guild_1').GetName|l] et des [buildings|El] des [GetBuildingType('bladesmiths_of_toledo_1').GetName|l]"
 innovation_calicoes_and_muslin: "Calicot et mousseline"
 innovation_calicoes_and_muslin_desc: "D’aussi loin que quiconque se souvienne, l’Inde a été un important pôle de production et d’exportation textile, tant en terme de quantité que de qualité. Les Romains appelaient « vent tissé » ce que les marchands rapportaient de ces régions lointaines, et plus tard, le port de Calicut prêta son nom au tissu calicot qu’il est possible d’y acheter."
 innovation_war_camels: "Chameliers de combat"
 innovation_war_camels_desc: "Les chameaux sont naturellement aptes à vivre en terrain désertique, mais ils ne sont pas en soi des créatures de combat. Nos éleveurs et entraîneurs peuvent changer cela en nous donnant accès à une cavalerie adaptative qui nous permettra de maîtriser le sable."
 eligible_accolade_camelry_attribute_ACCOLADES_DLC: "Les [knights|El] de cette [culture|El] deviennent éligibles aux [accolades|El] [GetAccoladeType('camelry_attribute').GetName]"
 eligible_accolade_camelry_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_camelry_attribute_ACCOLADES_DLC')]"
 innovation_elephantry: "Éléphant de guerre"
 innovation_elephantry_desc: "Les éléphants étant difficiles à élever en captivité, chaque cornac doit capturer ses propres éléphants sauvages et les entraîner. Cela signifie qu’il existe un art délicat d’utiliser correctement ces grandes créatures au combat et c’est un art que nous nous efforçons à maîtriser."
 eligible_accolade_elephantry_attribute_ACCOLADES_DLC: "Les [knights|El] de cette [culture|El] deviennent éligibles aux [accolades|El] [GetAccoladeType('elephantry_attribute').GetName]"
 eligible_accolade_elephantry_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_elephantry_attribute_ACCOLADES_DLC')]"
 innovation_wootz_steel: "Acier wootz"
 innovation_wootz_steel_desc: "Ce métal riche en carbone est excellent pour la fabrication d’armes. L’acier wootz est largement commercialisé et considéré comme le meilleur acier au monde. Il a attiré l’attention des commerçants arabes, égyptiens, chinois et même romains."
 innovation_african_canoes: "Pirogues d’Afrique de l’Ouest"
 innovation_african_canoes_desc: "Les grandes pirogues d’Afrique de l’Ouest sont excellentes pour naviguer sur les cours d’eau et nous permettent de transporter rapidement les troupes là où nous en avons besoin."
 innovation_table_of_princes: "Table des princes"
 innovation_table_of_princes_desc: "Celui qui est assis à la Table des Princes est reconnu comme le souverain légitime de Bohême. En raison de la loi de l’ancienneté de la Maison, les titres sont attribués au membre vivant le plus âgé de la dynastie régnante."
 unlock_single_heir_dynasty_house_changing: "Peut décréter le séniorat à n’importe quelle [crown_authority|El]"
 tradition_visigothic_codes_name: "$innovation_visigothic_codes$"
 tradition_visigothic_codes_desc: "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes: "Codes wisigoths"
 innovation_visigothic_codes_desc: "Bien que nombre des traditions les plus anciennes des Wisigoths aient été oubliées depuis longtemps, les enfants des Pyrénées se souviennent d’anciennes coutumes et de la façon dont la terre était divisée entre les fils et les filles de façon pragmatique mais équitable."
 unlock_equal_succession_changing: "Peut promulguer la [law|El] $equal_law$ à n’importe quelle [crown_authority|El]"
 ######################
 #Early Medieval Era #
 ######################
 #Military
 innovation_battlements: "Remparts"
 innovation_battlements_desc: "En plus de fortifier le donjon, construire un mur extérieur durable que nos archers peuvent utiliser en toute sécurité donnera à nos châteaux une couche supplémentaire de protection contre les assaillants."
 innovation_mangonel: "Mangonneaux"
 innovation_mangonel_desc: "Amélioration significative des modèles de catapulte existants, les mangonneaux à traction sont beaucoup plus rapides à charger et à tirer que les engins à torsion."
 innovation_mangonel_chinese: "Échelles de siège"
 innovation_mangonel_chinese_desc: "Échelles de siège pliantes à charnières, souvent équipées de boucliers, de treuils, de grappins et de dispositifs de levage à poulie. Elles servaient également de point d’observation surélevé pendant les sièges."
 eligible_accolade_besieger_attribute_ACCOLADES_DLC: "Les [knights|El] de cette [culture|El] deviennent éligibles aux [accolades|El] [GetAccoladeType('besieger_attribute').GetName]"
 eligible_accolade_besieger_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_besieger_attribute_ACCOLADES_DLC')]"
 innovation_burhs: "Forts de pierre"
 innovation_burhs_desc: "Disséminés dans la campagne, les meilleurs lieux de rassemblement et centres administratifs sont protégés par de solides murs de pierre."
 innovation_burhs_japan: "Suki" #柵
 innovation_burhs_japan_desc: "Depuis la construction du #italic Mizuki#! sous le règne de l’empereur Tenji, l’importance des fortifications a été reconnue. Ces lieux fortifiés peuvent nous servir à la fois pour rassembler des troupes et comme centres administratifs."
 innovation_burhs_chinese: "Wū bì" #塢壁
 innovation_burhs_chinese_desc: "Des bourgs fortifiés disséminés à travers la campagne peuvent nous servir à la fois pour rassembler des troupes et comme centres administratifs."
 innovation_burhs_anglo_saxon: "Bourgs fortifiés"
 innovation_burhs_anglo_saxon_desc: "Des bourgs fortifiés disséminés à travers la campagne peuvent nous servir à la fois pour rassembler des troupes et comme centres administratifs."
 innovation_burhs_latin: "Castra"
 innovation_burhs_latin_desc: "Les modèles anciens de fortifications sont encore utiles aujourd’hui et nous pouvons utiliser ce type de places fortifiées à la fois pour rassembler des troupes et comme centres administratifs."
 innovation_house_soldiers: "Soldats de la Maison"
 innovation_house_soldiers_desc: "Au fur et à mesure que nos familles nobles prennent du pouvoir, elles ont besoin de soldats pour faire respecter leur volonté. En établissant un ordre de soldats dédiés à la Maison, nous aurons des troupes mieux entraînées et mieux équipées qu’une levée standard."
 innovation_horseshoes: "Fers à cheval"
 innovation_horseshoes_desc: "Un cheval avec un sabot fendu va vite boiter et incapable de participer à des tâches ou d’être monté au combat. En ferrant nos chevaux avec des fers à chevaux, nous pouvons protéger leurs sabots."
 innovation_arched_saddle: "Selle arquée"
 innovation_arched_saddle_desc: "La cavalerie légère est une force avec laquelle il faut compter, mais elle n’exploite pas vraiment le potentiel du cheval de bataille. Les selles arquées nous permettent de mettre en place des guerriers à armure lourdes avec des lances couchées, ce qui leur permet de tirer pleinement parti de leur élan alors qu’ils chargent les lignes ennemies."
 eligible_accolade_lancer_attribute_ACCOLADES_DLC: "Les [knights|El] de cette [culture|El] deviennent éligibles aux [accolades|El] [GetAccoladeType('lancer_attribute').GetName]"
 eligible_accolade_lancer_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_lancer_attribute_ACCOLADES_DLC')]"
 unlock_maa_armored_horsemen: "Peut recruter des [GetMaA('armored_horsemen').GetName|l] comme [men_at_arms|El]"
 innovation_riveted_mail: "Haubergeon"
 innovation_riveted_mail_desc: "La cotte de mailles est le principal équipement de protection des individus. Jusqu’à présent, elle était souvent réservée aux nobles, mais simplifier sa production nous a permis d’en fournir à l’ensemble de nos hommes d’armes."
 #Civic
 innovation_hereditary_rule: "Lois héréditaires"
 innovation_hereditary_rule_desc: "Au lieu de scinder notre pays en parts égales à chaque succession entre tous les héritiers éligibles et ainsi briser l’unité de notre peuple, nous pouvons nous assurer d’avoir un cœur de terre stable et prospère en établissant un système de lois héréditaires."
 innovation_manorialism: "Seigneurie"
 innovation_manorialism_desc: "La propriété foncière étant consolidée par notre élite, de nombreux hommes et femmes se retrouvent dans l’incapacité de travailler. Nous allons établir un système de domaines seigneuriaux où des hommes libres peuvent travailler nos champs en échange d’un loyer, tandis que ceux qui ne peuvent pas payer peuvent entrer à notre service en tant que serfs."
 innovation_royal_prerogative: "Prérogative royale"
 innovation_royal_prerogative_desc: "Puisque notre royauté a un fardeau plus grand dû à la responsabilité de gouverner le pays, elle se verra également attribuer des privilèges qui lui seront réservés."
 innovation_chronicle_writing: "Chroniques"
 innovation_chronicle_writing_desc: "Les histoires des exploits de notre famille ne seront plus transmises oralement. Nous garderons une trace de tout ce que nous accomplissons, à la fois pour inspirer les générations futures et pour prouver nos revendications sur des terres que nous devrions légitimement posséder."
 innovation_armilary_sphere: "Astrolabe"
 innovation_armilary_sphere_desc: "Grâce aux astrolabes, nous pouvons déterminer l’altitude du soleil ou d’autres étoiles connues, afin de calculer notre latitude. Les instruments de navigation comme celui-ci ou la sphère armillaire, sa version plus moderne, permettent de naviguer loin des terres."
 innovation_baliffs: "Magistrats"
 innovation_baliffs_desc: "Un dirigeant ne peut pas être partout à la fois. En nommant des magistrats et autres fonctionnaires pour faire appliquer sa loi dans tout le pays, nous pouvons gouverner une vaste zone plus efficacement."
 innovation_baliffs_bailiffs: "Baillis"
 innovation_baliffs_bailiffs_desc: "$innovation_baliffs_desc$"
 innovation_baliffs_latin: "Potestas"
 innovation_baliffs_latin_desc: "Les Romains antiques définissaient le pouvoir des fonctionnaires d’élaborer, d’appliquer et de juger la loi comme la #italic potestas#!, un concept utilisé pour donner aux magistrats le pouvoir d’appliquer la loi dans l’ensemble de l’Empire. En donnant du pouvoir aux fonctionnaires locaux, nous pouvons gouverner une vaste zone plus efficacement."
 innovation_prosperity_02: "Gouvernement communal"
 innovation_prosperity_02_desc: "Les grandes villes sont régulièrement confrontées à une série de problèmes de plus en plus complexes. La délégation d’une partie de l’autorité aux conseils locaux leur permettra de résoudre ces problèmes sans avoir besoin d’impliquer le roi."
 innovation_currency_02: "Frappe de monnaie"
 innovation_currency_02_desc: "Les monnaies non réglementées sont difficiles à contrôler et manquent de stabilité. Les pièces frappées, mesurées à des poids spécifiques et frappées du sceau royal, inspirent confiance et favorisent le commerce."
 #Regional
 innovation_reconquista: "Expansionnisme spirituel"
 innovation_reconquista_desc: "Distraits par des luttes intestines, nous avons trop longtemps toléré la présence d’infidèles en Hispanie. Le temps est venu pour nous de rassembler nos forces pour les chasser de ce pays une fois pour toutes !"
 innovation_stem_duchies: "Stammesherzogtum"
 innovation_stem_duchies_desc: "Bien que venant de différentes tribus, nous reconnaissons l’importance de l’unité et de la coopération. L’indépendance est surestimées lorsque la stabilité contribue à la sécurité et à la prospérité."
 innovation_ghilman: "Ghulams"
 innovation_ghilman_desc: "Soldat esclave fait prisonniers de guerre, le ghulam est un combattant dévoué qui est à la fois plus loyal et moins cher à payer que le mercenaire ordinaire."
 #####################
 #High Medieval Era #
 #####################
 #Military
 innovation_hoardings: "Palissades"
 innovation_hoardings_desc: "Placées au sommet de nos remparts, ces constructions en bois s’étendent au-dessus du pied des murs de notre château. Ils permettent à nos défenseurs de tirer des flèches, de jeter des pierres ou de verser de l’huile bouillante sur les attaquants tout en restant complètement protégés des archers ennemis."
 innovation_trebuchet: "Trébuchet"
 innovation_trebuchet_desc: "Merveille d’ingénierie, le trébuchet à contrepoids peut lancer de lourds projectiles à une distance plus grande que tout engin de siège précédent."
 innovation_trebuchet_chinese: "Tours mobiles"
 innovation_trebuchet_chinese_desc: "Pour conquérir les tours ennemies en pierre, ces hautes tours en bois équipées de roues étaient poussées contre elles, permettant ainsi aux soldats d’atteindre les murs ennemis avec un minimum de sécurité."
 innovation_castle_baileys: "Mur d’enceinte de château"
 innovation_castle_baileys_desc: "Bien que le donjon serve de cœur au château, il est loin d’être le seul édifice important. Construire des bâtiments tels que les écuries et le dépôt d’armes entourés d’un mur d’enceinte garantira que nous pourrons mettre en garnison et équiper nos levées, quelles que soient les circonstances."
 innovation_men-at-arms: "Hommes d’armes"
 innovation_men-at-arms_desc: "Ceux qui maîtrisent le cheval et la lance sont toujours nécessaires, mais ne sont pas toujours disponibles. Garder des groupes d’hommes d’armes sous contrat permettra de ne pas manquer de combattants expérimentés lorsque la guerre éclatera inévitablement."
 innovation_knighthood: "Chevalerie"
 innovation_knighthood_desc: "En accordant à nos meilleurs combattants le titre de chevalier et des terres au lieu de simples pièces de monnaie, nous leur accordons l’honneur qu’ils méritent et nous assurons de leur loyauté à notre égard."
 innovation_advanced_bowmaking: "Fabrication d’arc avancée"
 innovation_advanced_bowmaking_desc: "Alors que les archers fabriquaient et entretenaient traditionnellement leurs propres arcs, les artisans ont commencé à créer de nouveaux types d’arc, plus solides et plus complexes qu’auparavant. En adoptant ces nouvelles conceptions, nous pouvons transformer ces maîtres archers en un atout militaire inestimable."
 unlock_maa_crossbowmen: "Peut recruter des [GetMaA('crossbowmen').GetName|l] comme [men_at_arms|El]"
 unlock_advanced_bowmaking_buildings: "Débloque le [Concept('district_tiers', 'niveau de quartier')|E] :\n$BULLET_WITH_TAB$[GetBuildingType('archery_ranges_3').GetName] pour le [GetDistrictType('military_district').GetName|l]"
 eligible_accolade_crossbower_attribute_ACCOLADES_DLC: "Les [knights|El] de cette [culture|El] deviennent éligibles aux [accolades|El] [GetAccoladeType('crossbowmen_attribute').GetName]"
 eligible_accolade_crossbower_attribute: "[AddLocalizationIf( HasDlcFeature( 'accolades' ), 'eligible_accolade_crossbower_attribute_ACCOLADES_DLC')]"
 innovation_coat_of_plates: "Cotte de plaques"
 innovation_coat_of_plates_desc: "Riveter des plaques de fer sur l’intérieur d’un vêtement résistant protège autant nos soldats qu’une armure, pour une fraction de son poids. Équiper tout un régiment est très coûteux pour nos armuriers, mais les hommes qui les portent peuvent supporter des coups auxquels un guerrier non protégé ne survivrait pas."
 #Civic
 innovation_heraldry: "Héraldique"
 innovation_heraldry_desc: "Établir des motifs héréditaires pour identifier nos familles nobles amènera leurs membres à se voir comme faisant partie d’un ensemble plus vaste, les encourageant à améliorer la réputation de leur dynastie au lieu d’être obsédés par leur devenir personnel."
 innovation_windmills: "Moulins avancés"
 innovation_windmills_desc: "Le moulin à vent tourne dès que le vent souffle, ce qui tranquillise nos meuniers vis-à-vis de l’eau qui tombe. Ces mêmes engrenages font désormais bien plus que moudre le grain : les marteaux battent le tissu, les soufflets alimentent la forge et les scies tranchent le bois que l’on coupait autrefois à la main."
 unlock_windmills_buildings: "Débloque les [district_tiers|El] :\n$BULLET_WITH_TAB$Niveau V pour tous les [resource_districts|El], à l'exception du [GetDistrictType('fish_district').GetName|l]\n$BULLET_WITH_TAB$[GetDistrictType('villages_district').GetName] de niveau III"
 innovation_divine_right: "Droit divin"
 innovation_divine_right_desc: "Il est temps que nous reconnaissions que c’est la volonté divine qui a placé nos dirigeants sur leurs trônes, et que s’opposer à eux, c’est s’opposer au divin."
 innovation_land_grants: "Octrois de terres"
 innovation_land_grants_desc: "La terre est la récompense la plus précieuse que nous puissions attribuer à nos sujets, mais nous n’en possédons que très peu directement. Cependant, si nous leur accordions la permission de commencer à exploiter des terres non exploitées... qui s’y opposerait ? Même s’il en résulte un conflit, nous serons clairement dans notre droit lorsque nous aurons à défendre nos sujets !"
 innovation_scutage: "Écuage"
 innovation_scutage_desc: "Le service militaire a toujours été attendu de nos sujets, mais il y en a qui ne peuvent ou ne veulent pas le fournir. En leur offrant un moyen de remplir leurs obligations avec des pièces de monnaie au lieu de l’acier, nous pouvons nous assurer que nous recevons nos dus de tout le monde."
 innovation_guilds: "Guildes"
 innovation_guilds_desc: "À mesure que nos terres s’agrandissent, il devient de plus en plus inefficace de gérer directement tous les échanges commerciaux se déroulant dans notre domaine. En accordant des chartes de guilde aux organisations de marchands et d’artisans, nous pouvons leur donner plus d’autonomie par rapport à leurs activités tout en garantissant que nous tirons profit de leurs entreprises."
 innovation_prosperity_03: "Urbanisation"
 innovation_prosperity_03_desc: "Les grandes villes de Rome, Byzance et Delhi se sont longtemps distinguées comme les vestiges d’un héritage d’une grandeur incomparable. Avec la croissance de nos infrastructures et de notre population, nous avons enfin les moyens de développer des colonies qui rivalisent avec ces anciens centres urbains."
 innovation_currency_03: "Opérations bancaires"
 innovation_currency_03_desc: "Les échanges commerciaux particulièrement importants ou coûteux nécessitent souvent une quantité importante de pièces de monnaie lourdes. Le dépôt de ces richesses dans des trésors sécurisés et le transfert de propriété sans avoir à déplacer les pièces permettront d’échanger plus facilement de grandes quantités de marchandises."
 innovation_blast_furnaces: "Hauts fourneaux"
 innovation_blast_furnaces_desc: "En forçant l’air à rentrer dans un immense fourneau à charbon, nous pouvons fondre le fer et offrir une qualité et une quantité dont nos ancêtres rêvaient. Les minerais qui, auparavant, rapportaient peu à un forgeron, coulent désormais par tonnes."
 #Regional
 innovation_east_settling: "Ostsiedlung"
 innovation_east_settling_desc: "Les terres à l’est sont peu peuplées mais riches en ressources naturelles. Y agrandir et établir des propriétés familiales conduira à la croissance et à la prospérité de notre peuple."
 innovation_seigneurialism: "Domaines seigneuriaux"
 innovation_seigneurialism_desc: "En déléguant davantage de responsabilités aux nobles locaux, nous pouvons les satisfaire et également nous permettre de mieux nous concentrer sur notre propre domaine."
 innovation_muladi: "Muladi"
 innovation_muladi_desc: "Les guerres, les raids et la persécution à travers le monde ont chassé de nombreuses personnes de leurs foyers. En accueillant ces personnes déplacées sur nos terres, peu importe leur origine, nous pouvons développer une société riche et prospère."
 innovation_french_peerage: "Pairie"
 innovation_french_peerage_desc: "En reconnaissant à juste titre les plus illustres de nos vassaux nobles, nous susciterons un sentiment de plus grande loyauté envers la Couronne."
 #####################
 #Late Medieval Era #
 #####################
 #Military
 innovation_machicolations: "Mâchicoulis"
 innovation_machicolations_desc: "Amélioration notable par rapport à nos palissades antérieures, les mâchicoulis en pierre ont le même objectif, mais sont beaucoup plus durables et offrent davantage de protection à nos défenseurs."
 innovation_gunpowder: "Poudre à canon"
 innovation_gunpowder_desc: "Le développement de la poudre explosive a conduit à l’émergence d’une nouvelle catégorie d’armes et, par conséquent, d’un nouveau type de guerriers pour les employer. Ces armes puissantes nécessitent des chaînes de fabrication et d’approvisionnement jusqu’alors inconnues, mais la force de frappe de cette nouvelle technologie compense largement son coût."
 innovation_royal_armory: "Arsenal royal"
 innovation_royal_armory_desc: "À mesure que la taille de nos armées augmente, nous devons garantir que chaque soldat aura des armes et des protections correctes. La mise en place d’un arsenal royal destiné à la production et au stockage de tous les équipements de nos armées contribuera grandement à y répondre."
 innovation_standing_armies: "Armée permanente"
 innovation_standing_armies_desc: "Les levées nous fournissent un grand nombre de soldats, mais peu importe la façon dont nous essayons de les entraîner et de les équiper, elles seront toujours inférieures aux soldats professionnels. L’établissement d’une grande armée permanente garantira que les intérêts de notre pays soient imposés par les meilleurs combattants du monde."
 innovation_sappers: "Sapeurs"
 innovation_sappers_desc: "Peu importe la solidité des murs de notre ennemi si la terre en dessous d’eux peut être creusée. Employer des sapeurs pour saper les fortifications ennemies est un moyen efficace de briser les défenses les plus résistantes."
 innovation_plate_armor: "Armure de plates"
 innovation_plate_armor_desc: "Forme ultime de protection individuelle, une armure de plates bien conçue a des articulations qui lui confèrent une liberté de mouvement supérieure à celle des armures antérieures, tout en demeurant impénétrable pour les armes ennemies."
 innovation_tempered_steel: "Acier trempé"
 innovation_tempered_steel_desc: "Nous avons découvert une manière de rendre l’acier plus solide et moins fragile en le chauffant une première fois pour le tremper, puis en le chauffant à nouveau. Les armes fabriquées ainsi sont plus résistantes et moins fragiles que n’importe quelle autre arme."
 #Civic
 innovation_primogeniture: "Primogéniture"
 innovation_primogeniture_desc: "Un royaume, un héritier. Bien que les plus jeunes enfants de notre monarque peuvent se sentir délaissés en se voyant refuser un héritage, c’est la meilleure façon de nous assurer de conserver un royaume stable qui ne soit pas déchiré par des crises de succession."
 innovation_cranes: "Grues"
 innovation_cranes_desc: "Les engins de levage à roue motrice sont une merveille oubliée de l’ingénierie utilisée par les Romains avec un grand succès. Nous les emploierons donc aussi."
 innovation_noblesse_oblige: "Noblesse oblige"
 innovation_noblesse_oblige_desc: "La noblesse est plus que des privilèges et des droits ; c’est aussi avec un devoir envers le pays, une obligation d’agir de manière juste et appropriée. En établissant clairement ce que l’on attend de notre élite, nous aurons un idéal auquel aspirer."
 innovation_rightful_ownership: "Droit de propriété"
 innovation_rightful_ownership_desc: "C’est notre droit divin de posséder nos terres de jure et il est temps que le monde le reconnaisse. Nous ne serons plus retenus par des protocoles obsolètes et un décorum."
 innovation_ermine_cloaks: "Insignes exotiques"
 innovation_ermine_cloaks_desc: "Tout le monde peut prétendre à un titre, mais pour être un véritable monarque, il faut inspirer la peur et évoquer la majesté à ses sujets. L’utilisation des matériaux les plus rares et les plus exotiques pour la confection de nos vêtements royaux permet d’atteindre cet objectif."
 innovation_ermine_cloaks_ermine: "Manteau d’hermine"
 innovation_ermine_cloaks_ermine_desc: "Tout le monde peut prétendre à un titre, mais pour être un véritable monarque, il faut inspirer la peur et évoquer la majesté à ses sujets. Nos nouveaux manteaux d’hermine sont une robe royale qui ne manquera pas d’accomplir cela."
 innovation_court_officials: "Officiels de la Cour"
 innovation_court_officials_desc: "Notre pays s’est étendu au point que même les nobles mineurs ne peuvent plus tout gérer efficacement. Nommer des officiels de la Cour et des bureaucrates pour s’acquitter des tâches plus banales assurera le bon fonctionnement du gouvernement."
 innovation_prosperity_04: "Idées de la Renaissance"
 innovation_prosperity_04_desc: "Les développements de la science, de la philosophie et de la logique ont fait de nos villes de merveilleux centres d’éducation et d’innovation. Les progrès technologiques et culturels considérables que nous connaissons aujourd’hui ont mis à notre portée un potentiel jusqu’alors insoupçonné."
 innovation_currency_04: "Billets à ordre"
 innovation_currency_04_desc: "Évolution des systèmes bancaires antérieurs, les billets à ordre sur support papier permettent à nos citoyens d’échanger rapidement et en toute sécurité des biens et des services sur de grandes distances sans être alourdis par de lourdes pièces de monnaie."
 #Regional
 innovation_wierdijks: "Wierdijks"
 innovation_wierdijks_desc: "Construire des digues solides et fiables est essentiel si nous voulons vivre et prospérer au sein des Pays-Bas. Les nouvelles techniques de renforcement des digues en terre avec des algues augmenteront leur résistance et leur durabilité."
 innovation_condottieri: "Condottieri"
 unlock_maa_condottieri_GDP_DLC: "Peut recruter des [GetMaA('condottieri').GetName|l] comme [men_at_arms|El]"
 unlock_maa_condottieri: "[AddLocalizationIf( HasDlcFeature( 'silk_and_silver' ), 'unlock_maa_condottieri_GDP_DLC')]"
 innovation_condottieri_desc: "À la fois riche et centrale, l’Italie est devenue un lieu important pour les compagnies mercenaires qui s’y rendent lorsqu’elles ne sont pas en campagne. Puisqu’elles sont déjà là, nous devrions pouvoir négocier avec elles un prix plus avantageux que celui qu’elles demandent habituellement."
 innovation_deccan_unity: "Unité du deccan"
 innovation_deccan_unity_desc: "L’afflux de nouvelles croyances et religions dans notre société a clairement montré que notre focalisation passée sur le régionalisme était une erreur. Nous devrions nous unir aux autres croyants et assurer un État fort et durable capable de résister aux pressions extérieures."
 students_of_knighthood: "Les enfants qui terminent leur [education|El] avec un [education_focus|El] en [martial|El] obtiennent un [trait|El] $trait_education_martial_prowess$"
 #Sponsor Research Related
 fp3_innovation_mural_sextant: "Sextant mural"
 fp3_innovation_mural_sextant_desc: "Ces grands instruments muraux permettent de lire et de mesurer avec précision la position des objets célestes."
 fp3_innovation_fritware: "Porcelaine tendre"
 fp3_innovation_fritware_desc: "De belles poteries en pierre qui sont à l’image de la porcelaine orientale, car on y ajoute des matériaux tels que le quartz ou le verre. Elles constituent des objets de valeur ou des cadeaux impressionnants."
 fp3_innovation_fritware_tooltip: "Gain d’[opinion|El] de l’[interaction|El] [send_gift|El] : #P +20%#!"
 #################
 #The Silk Road #
 #################
 culture_parameter_silk_road_innovation_parameter: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'culture_parameter_silk_road_innovation_parameter_tgp', 'culture_parameter_silk_road_innovation_parameter_no_tgp' )]"
 culture_parameter_silk_road_innovation_parameter_tgp: "Ne peut être acquis qu’en tant que [cultural_fascination|El] potentielle via le [heritage|El] [GetCulturePillar('heritage_chinese').GetName|l], la [tradition|El] [GetCultureTradition('tradition_sinophilic').GetName|l] ou la [situation|El] de la [GetSituation('silk_road_situation').GetName]"
 culture_parameter_silk_road_innovation_parameter_no_tgp: "Ne peut être acquis qu’en tant que [cultural_fascination|El] potentielle via le [heritage|El] [GetCulturePillar('heritage_chinese').GetName|l], [GetCulturePillar('heritage_korean').GetName|l], [GetCulturePillar('heritage_buyeo').GetName|l] ou [GetCulturePillar('heritage_viet').GetName|l], ou via la [situation|El] de la [GetSituation('silk_road_situation').GetName]"
 innovation_fire_medicine: "Poudre de feu" #'Huoyao,' 火藥
 innovation_fire_medicine_desc: "Lorsque nous sondons les mystères de la vie, nous découvrons parfois des choses qui ne créent que la mort. La poudre de feu, un puissant mélange de soufre, de salpêtre et d’autres matériaux inflammables, crée des flammes mortelles qui se consument farouchement et presque explosives."
 innovation_champa_rice: "Riz du Champa"
 innovation_champa_rice_desc: "Le riz demande beaucoup de temps et d’eau, hormis le riz du Champa. Cette espèce pousse plus vite, résiste mieux à la sécheresse et donne des récoltes plus abondantes que pratiquement tout autre type de riz. Dans certains cas, il peut même être récolté deux fois par an. Cultivé correctement, il augmente le rendement des fermes et assure la croissance de la population."
 culture_parameter_champa_rice_wet_land_paddies: "Le [GetDistrictType('rice_district').GetName|l] peut être construit dans les [GetTerrain( 'wetlands' ).GetName|l]"
 culture_parameter_champa_rice_building_bonuses: "La série de [buildings|El] des [GetBuildingType('rice_resource_building_1').GetName|l] bénéficie de bonus supplémentaires dans les [GetTerrain( 'wetlands' ).GetName|l]"
 building_paddy_fields_requirement_terrain_tt: "Une des conditions suivantes :\n$EFFECT_LIST_BULLET$La [barony|El] a un terrain de [GetTerrain( 'terraced_hills' ).GetName|l]\n$EFFECT_LIST_BULLET$La [barony|El] a un terrain de [GetTerrain( 'floodplains' ).GetName|l] et dans la [region|El] [GetGeographicalRegion('paddy_fields_region').GetName]\n$EFFECT_LIST_BULLET$La [barony|El] a un terrain de [GetTerrain( 'wetlands' ).GetName|l] et la [culture|El] a l’[innovation|El] #V $innovation_champa_rice$#!\n$EFFECT_LIST_BULLET$La [barony|El] a un terrain de [GetTerrain( 'hills' ).GetName|l] ou de [GetTerrain( 'jungle' ).GetName|l] et la [culture|El] a la [tradition|El] [GetCultureTradition('tradition_tgp_rice_cultivators').GetName|V]"
 innovation_sericulture: "Sériciculture"
 innovation_sericulture_desc: "L’art de la fabrication de la soie est un processus complexe mais gratifiant. Le savoir est jalousement conservé par ceux qui ont beaucoup à gagner de la maîtrise de cette industrie."
 culture_parameter_unlocks_silk_buildings_parameter: "Débloque la série de [domicile_buildings|El] [GetDomicileBuilding('silk_01').GetNameNoTooltip|V]"
 innovation_dragon_kiln: "Fours dragons"
 innovation_dragon_kiln_desc: "La meilleure porcelaine provient de fours hautement spécialisés, situés à proximité de précieux sites miniers. Ils sont construits sur des pentes abruptes, ce qui crée un tourbillon de chaleur qui rend la céramique aussi dure que possible. Bien qu’ils soient difficiles à construire, les marchandises qui y sont fabriquées sont probablement les poteries les plus à la mode (et les plus lucratives) que l’on puisse trouver à la Cour."
 innovation_lacquerware: "Laque"
 innovation_lacquerware_desc: "L’art du laquage et de la transformation de sève et de bois en objets prestigieux et onéreux est aussi ancien que difficile à maîtriser. Originaire du Japon et de la Chine, il s’est lentement répandu en Asie de l’Est, parallèlement aux précieux objets laqués."
 culture_parameter_unlock_lacquerware_buildings: "Débloque la série de [buildings|El] de l’[GetBuildingType('lacquerware_workshop_1').GetName|l] pour le [GetDistrictType('forestry_district').GetName|l]"
 innovation_rocket_cart: "Chariots à fusées"
 innovation_rocket_cart_chinese: "Huochē" #火車 (Huǒchē)
 innovation_rocket_cart_koreanic: "Hwacha" #火車 (화차)
 innovation_rocket_cart_desc: "En utilisant une formule explosive plus sommaire que celle utilisée pour les coûteuses bombardes, nous pouvons tirer d’énormes salves de flèches de feu à partir d’un seul appareil. Celles-ci n’ayant que la force de frappe de... flèches, elles sont bien mieux adaptées pour être tirées depuis un mur que sur un mur."
 innovation_rocket_cart_chinese_desc: "$innovation_rocket_cart_desc$"
 innovation_rocket_cart_koreanic_desc: "$innovation_rocket_cart_desc$"
 innovation_tea_culture: "Culture du thé"
 innovation_tea_culture_desc: "L’art de boire le thé ne se résume pas à plonger des feuilles dans de l’eau chaude. Dans certaines sociétés, il est également devenu un vecteur social : le fait de le boire seul ou en compagnie constitue un élément important du tissu social."
 culture_parameter_unlocks_tea_house_buildings: "Débloque la série de [buildings|El] de la [GetBuildingType('tea_house_1').GetName|l] pour le [GetDistrictType('entertainment_district').GetName|l]"
 innovation_compass: "Boussole"
 innovation_compass_desc: "Avec un simple morceau de pierre magnétique, il devient possible de toujours savoir dans quelle direction on voyage. Avec le temps et des recherches, il sera possible de naviguer sans devoir s’arrêter et demander son chemin."
 culture_parameter_cheaper_adventure_inspiration: "Coût de l’[inspiration|El] d’aventurier : #P -50%#!"
 innovation_block_printing: "Impression au bloc de bois"
 innovation_block_printing_desc: "Avec une série de blocs de bois sculptés, il est possible de composer une panoplie de tampons que l’on peut utiliser plusieurs fois pour imprimer des mots et des images identiques sur un support adapté. Cela simplifie considérablement la production de livres en réduisant les coûts et en rendant les écrits accessibles à tous."
 culture_parameter_block_printing_scriptorium_bonuses: "$culture_parameter_block_printing_scriptorium$"
 culture_parameter_block_printing_scriptorium: "La série de [buildings|El] du [GetBuildingType('scriptorium_1').GetName|l] offre des bonus supplémentaires"
 innovation_grenades: "Grenades"
 innovation_grenades_desc: "Malgré les progrès réalisés dans l’art de la guerre, un outil ancestral reste inestimable : le bras. De petites bombes remplies d’une substance inflammable ou explosive peuvent être facilement fabriquées et lancées par toute personne ayant une bonne technique de lancer. La distribution de grenades aux soldats avant une bataille peut leur donner un moyen secondaire d’attaquer et d’effrayer l’ennemi."
 innovation_cupellation: "Coupellation"
 innovation_cupellation_desc: "Des fours spécialisés à haute température peuvent faire fondre des métaux précieux à partir d’échantillons de métal, les extraire de minerais fondus et produire un échantillon raffiné qui peut être examiné plus en détail par des essayeurs. L’écaillage des minerais d’une mine de plomb est le meilleur moyen de déterminer la teneur en argent de cette mine et l’écaillage de l’or permet d’indiquer sa pureté en vue d’une éventuelle frappe de monnaie."
 innovation_lacquered_armor: "Armure laquée"
 innovation_lacquered_armor_desc: "L’application méticuleuse de certaines résines sur les armures les renforce considérablement et permet d’imperméabiliser les plaques de fer plus lourdes. Bien que ce procédé soit connu depuis longtemps, il était surtout réservé aux boîtes, aux bouteilles et à d’autres objets artisanaux. Les armures laquées constituent une nouvelle façon de protéger les soldats et leur équipement."
 culture_parameter_higher_quality_armor_artifacts_parameter: "Les [Concept('artifacts', 'armures')|E] des [inspirations|El] [sponsored|El] et de la décision de [GetDecision('commission_artifact_decision').GetName|l] sont de meilleure qualité"
 innovation_double_entry_bookkeeping: "Comptabilité en partie double"
 innovation_double_entry_bookkeeping_desc: "La comptabilité doit suivre la complexité croissante de la finance et de l’économie. L’enregistrement de tous les paiements entrants et sortants dans des registres distincts permet de maintenir des équilibres financiers fiables et de s’assurer que des écritures ne sont pas négligées « involontairement » lors de l’examen des comptes."
 culture_parameter_bookkeeping_collect_taxes_bonus: "[councillor_task|E] visant à $task_collect_taxes|l$ : #P +10%#![gold_i|E]"
 innovation_waterworks: "Réseau de distribution d’eau"
 innovation_waterworks_desc: "L’eau donne la vie, mais elle a bien d’autres utilisations que d’étancher la soif ou d’irriguer les champs. Utilisée de manière ingénieuse, cette ressource qui tombe du ciel peut actionner des machines avec beaucoup plus de force que n’importe quel animal, faciliter les voyages et le commerce grâce à des canaux ou, tout simplement, maintenir les rues animées saines et habitables."
 culture_parameter_waterworks_agricultural_bonuses: "Les séries de [buildings|El] des #V $qanat_system|l$#!, des #V $monsoon_water_management|l$#!, du #V $irrigation_network|l$#! et du #V $water_management|l$#! génèrent un [agricultural_tax|El] supplémentaire"
 innovation_tiefutu: "$tiefutu$"
 innovation_tiefutu_desc: "$tiefutu_flavor$"
 innovation_bulkheads: "Cloisons"
 innovation_bulkheads_desc: "La meilleure façon d’empêcher un navire de couler est de ne pas transpercer la coque. Mais si cela se produit, le navire peut encore être sauvé si la coque est divisée en compartiments avec des séparations étanches entre eux. Même si le navire est endommagé, une cloison peut empêcher l’eau de le couler complètement, ce qui permet de sauver des hommes, du matériel et le navire lui-même."
 innovation_coking: "Cokéfaction"
 innovation_coking_desc: "Le charbon de bois est un élément essentiel de la forge, mais il faut de vastes forêts à proximité pour réduire le bois en ce combustible vital. Le charbon de bois, chauffé dans un four à charbon, peut être réduit en coke. Le coke est tout aussi utile que le charbon de bois pour la forge et d’autres feux industriels, sans qu’il soit nécessaire de raser une forêt entière."
 culture_parameter_coking_smith_bonuses: "La série du [duchy_district|El] des [GetBuildingType('blacksmiths_01').GetName|l] offre des bonus supplémentaires"
 innovation_composite_crossbow: "Arbalètes composites"
 innovation_composite_crossbow_desc: "Comme pour les arcs, la force du bras de l’arbalète détermine la puissance potentielle du tir. Si nous renforçons l’envergure avec de la corne ou même de l’acier, la force de traction et donc la portée et la puissance d’une arbalète peuvent être bien supérieures à celles de n’importe lequel de ses équivalents en bois, tout en les rendant plus résistantes et durables."
 innovation_pharmacopoeia: "Pharmacopée"
 innovation_pharmacopoeia_desc: "Tout bon médecin doit savoir produire les bons médicaments au bon moment, en utilisant les bons ingrédients, de la bonne manière et dans les bonnes quantités. Si ces connaissances sont souvent transmises de maître à apprenti de manière individuelle, le fait de consigner par écrit la manière de fabriquer des médicaments spécifiques peut grandement contribuer à standardiser et à diffuser la préparation des différents traitements."
 culture_parameter_physician_pharmacopoeia_bonus: "Efficacité du traitement du [court_position|El] [GetCourtPositionType('court_physician_court_position').GetName()] : #P +20%#!"
 innovation_glassmaking: "Verrerie"
 innovation_glassmaking_desc: "Grâce à des expériences minutieuses menées avec du sable, des cendres et du feu, nos artisans ont appris à produire un verre transparent et malléable. Ce savoir-faire permet de créer des vitrages, des récipients et des objets décoratifs qui apportent lumière et beauté tant aux bâtiments qu’aux cours."
 unlocks_glassmakers_guild: "Débloque la série de [buildings|El] :\n$BULLET_WITH_TAB$[GetBuildingType('guild_glassmakers_1').GetName] pour le [GetDistrictType('guild_district').GetName|l]"
