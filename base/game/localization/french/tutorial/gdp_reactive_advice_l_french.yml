l_french:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "Besoins du bâtiment"
 action_reactive_advice_building_needs: "Conseil : $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "Vos [buildings|El] ont des [needs|El] en [trade_goods|El] provenant du [market|El] local. Ouvrez ceci pour savoir comment répondre à ces besoins."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "Si vous souhaitez tirer profit au maximum des [buildings|El] de votre [domain|El], vous devez vous assurer qu’ils peuvent accéder aux [trade_goods|El] dont ils ont besoin.\n\nVoyons comment faire !"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "Commençons par jeter un œil à votre [domain|El]."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Ouvrez l’onglet Domaine du panneau Pays (mis en avant)"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "Voilà toutes les [holdings|El] de votre [domain|El].\n\nLe [county|El] de chaque propriété fait partie d’un [market|El]. Tous les [goods|El] produits et consommés par les [buildings|El] sont échangés dans ces marchés."
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "Arrêtons-nous maintenant sur l’une de vos [holdings|El]."
 reactive_advice_building_needs_step_open_county_view_prompt: "Cliquez sur l’une de vos propriétés (mise en évidence)"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "Ça, ce sont les [districts|El] de votre [holding|El]. Dans chacun d’entre eux se trouve les [buildings|El] qui produisent et consomment des [goods|El]."
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "Prenons par exemple les [needs|El] de votre [holding_district|El]."
 reactive_advice_building_needs_step_open_district_view_prompt: "Cliquez sur le $game_concept_holding_district|l$ (mis en évidence)#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "Ici, vous pouvez voir les effets de chaque [building|El] du [district|El].\n\nCertains effets doivent consommer des [trade_goods|El] du [market|El] du [county|El] pour rester actifs.\n\nPar exemple, le [holding_district|El] fournit un [food_supply|El] à la [holding|El], si cette dernière peut consommer des [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l] et des [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon|l].\n\nNe pas répondre à un [need|El] n’inflige pas de malus, et tous les $game_concept_buildings|l$ offriront des avantages même s’ils n’ont pas accès aux $game_concept_trade_goods|l$ dont ils ont besoin."
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "Il y a rarement besoin d’un [trade_good|El] spécifique : un mélange de $game_concept_goods|l$ d’une certaine [trade_category_short|El] suffit. Par exemple, un [building|El] peut nécessiter des [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l], c'est-à-dire soit du [GetTradeGoodType('trade_good_grain').GetNameWithIcon|l], soit du [GetTradeGoodType('trade_good_millet').GetNameWithIcon|l], soit du [GetTradeGoodType('trade_good_rice').GetNameWithIcon|l].\n\nDe plus, il est possible de répondre à certains [needs|El] plusieurs fois : chaque fois que la quantité désirée est atteinte, l’effet est de nouveau appliqué."
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "Les [buildings|El] ont donc besoin de [trade_goods|El], mais d’où viennent ces derniers ?\n\nChaque bien commercial consommé dans un [county|El] vient du [market|El] de ce comté."
 reactive_advice_building_needs_step_open_market_view_prompt: "Ouvrez le marché du comté (mis en avant)#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "Voici le [market|El] du [county|El]. En règle générale, le marché couvre les mêmes [counties|El] qu’un [duchy|El]."
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "Ici, vous pouvez voir tous les [trade_goods|El], et s’il y a de l’[surplus|El] ou un [need|El] insatisfait.\n\nSi un besoin est insatisfait (#N solde négatif#!), c’est que tous les [buildings|El] du [market|El] ne voient pas leurs [needs|El] satisfaits.\n\nS’il y a de l'excédent, (#P solde positif#!), c’est que les besoins de tous les [buildings|El] sont satisfaits pour ce bien commercial et que ce dernier peut être exporté via les [trade_routes|El].\n\n#I Vous pouvez cliquer sur un $game_concept_trade_good|l$ pour voir son statut au marché et sur la carte.#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "Si un [need|El] n’est pas satisfait, vous pouvez essayer d’y remédier de plusieurs manières :\n\n$BULLET_WITH_TAB$En construisant dans le [market|El] des [buildings|El] qui produisent le [trade_good|El].\n$BULLET_WITH_TAB$En établissant une [distribution_route|El] entre deux $game_concept_markets|l$ de votre [realm|El].\n$BULLET_WITH_TAB$En demandant à des [client_merchants|El] d’importer le $game_concept_trade_good|l$.\n\nCependant, il est difficile de répondre à tous les $game_concept_needs|l$, et parfois, il vaut mieux les ignorer."
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Constructions en file d’attente"
 action_reactive_advice_construction_queue: "Conseil : $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "Vous avez placé une construction en file d'attente. Ouvrez ceci pour en apprendre plus sur la gestion de vos constructions."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "Vous avez placé une construction en file d'attente !\n\nMême si vous n’avez pas les moyens d’acheter un [building|El] immédiatement, vous pouvez malgré tout le placer en file d'attente : il sera construit quand vous disposerez des fonds nécessaires.\n\nExaminons votre file d'attente."
 reactive_advice_construction_queue_intro_prompt: "Ouvrez « $BUILD_QUEUE_WINDOW_TITLE$ » (mis en évidence)"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "Voici toutes les constructions de toutes vos [holdings|El] que vous avez placées en file d’attente jusqu’à maintenant.\n\nUne fois que vous disposerez des fonds et que tous les autres prérequis seront remplis, le coût sera automatiquement payé et la construction débutera.\n\nLes constructions démarrent dans l’ordre de la file d’attente, mais vous pouvez les réorganiser en cliquant et déplaçant l’une d’elles."
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "Si vous souhaitez épargner de l’[gold|El] ou d’autres ressources, vous pouvez le faire ici.\n\nCe montant ne sera pas utilisé pour démarrer les constructions de la file d’attente, afin que vous ayez toujours un petit pécule à disposition pour les urgences."
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "C’est tout ce que vous avez besoin de savoir sur la file d’attente des constructions. À vos outils !"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Routes commerciales"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "Pendant que d’autres s’épuisent aux champs ou taxent les pauvres, vous tirez partie de l’influx de [goods|El].\n\nC’est grâce aux [trade_routes|El] que les [merchants|El] et les [republics|El] gagnent de l’[gold|El]."
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "Vous devez d’abord choisir un [trade_good|El] à vendre ou acheter.\n\nCeux-ci vous sont recommandés, mais vous pouvez également voir tous les biens commerciaux si vous en cherchez un en particulier."
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "Sur la carte, vous pouvez voir tous les [markets|El] qui achètent ou vendent le [trade_good|El] que vous avez sélectionné.\n\nPour l’acheter ou le vendre, vous devez connecter un marché avec un [surplus|El] de biens (#trade_surplus bleu sarcelle#!) avec un endroit qui a un [need|El] (#trade_need or#!).\n\nSi le marché est rempli d’autres [merchants|El], vous ne pouvez profiter que d’une partie des biens présents, dans la limite de votre [competitiveness|El].\n\nEn achetant à petit prix pour revendre cher, vous ferez un profit considérable.\n\n#I Cliquez sur les marchés afin de les ajouter ou les retirer de la route commerciale.#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "Lorsque vous ajoutez des [markets|El] à votre [route|El], le [good|El] sélectionné sera transporté sur la route commerciale et affiché ici.\n\nLe bien le plus à gauche est le [primary_good|El], c’est-à-dire celui qui vous permet d’engranger de l’[trade_expertise|El] lorsque vous en achetez ou en vendez. Avec le temps, il vous octroiera différents avantages, selon sa [trade_category|El].\n\n#I Si vous transportez plus de 1 bien, vous pouvez cliquer puis déplacer n’importe quel autre bien sur le premier emplacement pour en faire le $game_concept_primary_good|l$.#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "Vous ne pouvez transporter qu’une quantité limitée de [goods|El], et vous disposez d’une [capacity|El] totale limitée.\n\nVous pouvez dépasser une limite en construisant des [company_buildings_short|El] dans votre [company|El]."
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "De la même manière, les routes sont limitées par une [trade_route_length|El], et vous ne pouvez vous arrêter qu’à un nombre limité de [markets|El]."
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "Enfin, un de vos [associates|El] peut être nommé [trader|El]. Selon la tâche qui lui est attribuée, il peut améliorer différents aspect de la [route|El]."
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "Développer votre [company|El] vous permettra d’avoir accès à plus de [routes|El], de les faire aller plus loin et d’augmenter le nombre de transactions possibles.\n\nAinsi, vous pourrez gagner encore plus d’[gold|El] !"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Être un marchand"
 action_reactive_advice_merchant_introduction: "Conseil : $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "Vous êtes un [merchant|El] ! Ouvrez ceci pour apprendre les bases du métier."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "Vous êtes un [merchant|El] !\n\nMême si le [trade|El] est la pierre angulaire de votre [company|El], il existe d’autres moyens de gagner de l’or."
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "Nous devrions commencer par regarder comment votre [company|El] peut se développer sur le long terme."
 reactive_advice_merchant_introduction_open_overview_prompt: "Ouvrez l’onglet Aperçu du panneau Pays (mis en évidence)"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "Voici la [company_size|El], la principale mesure de puissance de votre $game_concept_company|l$.\n\nPlus votre $game_concept_company|l$ grandit, plus les [rulers|El] de haut [rank|El] tels que les [kings|El] ou les [emperors|El] vous remarqueront."
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "Voici le [domicile|El] de votre [company|El], votre base opérationnelle.\n\nIci, vous pouvez dépenser de l’[gold|El] et du [prestige|El] pour construire des [domicile_buildings|El] qui permettront d’améliorer votre $game_concept_company|l$."
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "Voici votre [company_purpose|El], qui détermine l’objectif principal de votre $game_concept_company|l$.\n\nL’objectif de marchand est choisi par défaut, mais vous pouvez le modifier pour vous concentrer sur les [artifacts|El], les biens de luxe ou le prêt."
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "Mais même en tant que [merchant|El], vous n’êtes pas libéré du joug des seigneurs locaux."
 reactive_advice_merchant_introduction_open_patronage_prompt: "Ouvrez l’onglet $MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$ (mis en évidence)"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "Voici votre [merchant_patron|El], le [ruler|El] de la [holding|El] où se trouve votre [domicile|El].\n\nMême si vous devez payer des impôts à votre $game_concept_merchant_patron|l$, cette relation peut malgré tout vous être avantageuse.\n\nPar exemple, vous pouvez modifier votre [client_contract|El] et demander à votre $game_concept_merchant_patron|l$ de soutenir vos efforts commerciaux ou de faciliter l’organisation de [marriages|El] avec des nobles."
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "Vous n’êtes pas le seul [merchant|El] [client|El] de votre [merchant_patron|El].\n\nD'autres $game_concept_clients|l$ vont également faire du commerce aux mêmes endroits que vous, et un seul $game_concept_client|l$ peut tenir la [charter|El] spéciale. Tenir la $game_concept_charter|l$ améliore votre affaire grâce à des [decisions|El] spéciales."
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "Il est enfin temps de parler du plus important : gagner de l’or."
 reactive_advice_merchant_introduction_open_trade_prompt: "Ouvrez l’onglet Routes commerciales du panneau Négoce (mis en évidence)"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "Voici vos [trade_routes|El], elles sont votre principal moyen de gagner de l’[gold|El].\n\nDévelopper votre $game_concept_company|l$ vous permettra d’avoir plus de $game_concept_routes|l$ qui iront plus loin et pourront transporter plus de [goods|El], ce qui vous permettra de gagner plus d’$game_concept_gold|l$ par la suite."
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "Voici la voie du [merchant|El] : gagnez de l’[gold|El] grâce à vos [trade_routes|El] et dépensez-le pour améliorer votre [prestige|El] et votre [company_size|El].\n\nLes affaires tenues par des $game_concept_merchants|l$ responsables et organisés finiront par surpasser celles détenues par de riches [rulers|El] !"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "Orientation de compagnie"
 action_reactive_advice_company_direction: "Conseil : $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "Avec le temps, votre [company_direction|El] peut changer. Ouvrez ceci pour en apprendre plus."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "Tous les [merchants|El] n’ont pas les mêmes objectifs. Même si l’[gold|El], c’est le pouvoir, certains lui préfèrent la famille et la noblesse."
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "Votre [company_direction|El] fait partie de votre [house|E], jetons-y un œil."
 reactive_advice_company_direction_open_house_prompt: "Sélectionnez votre Maison (mise en évidence)"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "Rendez-vous ensuite sur l’onglet [sentiment|E]."
 reactive_advice_company_direction_open_direction_tab_prompt: "Ouvrez l’onglet Orientation (mis en évidence)"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "Voici votre [company_direction|El]. Même si elle peut débuter en étant [company_sentiment_independent|El], elle peut également pencher vers [company_sentiment_divided|El] ou [company_sentiment_concerted|El].\n\nÉpouser des [houses|E] [Concept('noble', 'nobles')|El] la fera pencher vers $game_concept_company_sentiment_concerted|l$, tandis qu’épouser d’autres [merchants|El] fera pencher la balance vers $game_concept_company_sentiment_divided|l$."
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Financer la construction"
 action_reactive_advice_sponsor_construction: "Conseil : $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "Vous pouvez financer des [buildings|El] dans les [holdings|El] d’autres [characters|El]. Ouvrez ceci pour en apprendre plus."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "Vous pouvez maintenant financer l’amélioration de [buildings|El] dans les [holdings|El] d’autres [characters|El]."
 reactive_advice_sponsor_construction_select_holding_prompt: "Sélectionnez Propriété sur la carte"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "Maintenant, sélectionnez un de ses [districts|El]."
 reactive_advice_sponsor_construction_open_district_prompt: "Sélectionnez un quartier (mis en évidence)"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "Ici, vous pouvez financer une construction ! À noter que vous pouvez uniquement #EMP améliorer#! des [buildings|El], et seulement ceux des [districts|El] standards.\n\nLe financement sert principalement à augmenter l’[surplus|El] ou le [need|El] d’un [trade_good|El] du [market|El] d’une [holding|El]. Ainsi, vous pouvez connecter le $game_concept_market|l$ à l’une de vos [profit_routes|El] et augmenter la quantité d’[gold|El] gagnée."
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Politiques républicaines"
 action_reactive_advice_republican_politics: "Conseil : $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "Vous faites partie d’une [republic|El]. Ouvrez ceci pour en apprendre plus sur ses subtilités politiques."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "Vous, en tant que [house_head|El], faites partie d’une [republic|El] vertueuse !\n\nEn tant que chef d’une [patrician_family|El], vous régnez aux côtés d’autres $game_concept_patrician_families|l$ en usant d’un procédé somme toute démocratique. Même si vous n’êtes actuellement pas le [ruler|El] de la $game_concept_republic|l$, vous pouvez toujours participer, tant que vous possédez assez d’[gold|El] et d’influence."
 reactive_advice_republican_politics_intro_prompt: "Ouvrez l’onglet Aperçu du panneau République (mis en évidence)"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "Toutes les [republics|El] ne sont pas égales, comme c’est le cas de leurs citoyens. Chaque $game_concept_republic|l$ possède un [title_tier|El] et une [republic_administration|El], comme affiché ici.\n\nEn dépensant du [prestige|El] et du [treasury|E], le [ruler|El] peut améliorer le $game_concept_title_tier|l$ de la $game_concept_republic|l$, et donc sa puissance.\n\nLe $game_concept_ruler|l$ peut également modifier l’$game_concept_republic_administration|l$, qui détermine la direction générale que prend la $game_concept_republic|l$."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "En parlant du [ruler|El], le voilà !\n\nComparée à la tyrannie d’autres [governments|El], le $game_concept_ruler|l$ de la [republic|El] est élu pour un mandat à durée limitée.\n\nCependant, le même $game_concept_ruler|l$ peut être réélu, c’est pourquoi il n’est pas rare qu’il soit également candidat principal."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "Le pouvoir du [ruler|El] est modéré par l’[assembly|E]. Voyons ce qu’il en est."
 reactive_advice_republican_politics_open_assembly_prompt: "Ouvrez l’onglet Assemblée (mis en évidence)"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "Le [ruler|El] n’est pas tout-puissant : chaque [law|El] ou [republic_decree_short|El] doit être approuvé par l’[assembly|El]. Les membres de l’$game_concept_assembly|l$ peuvent même proposer d’amender une $game_concept_law|l$.\n\nL’$game_concept_assembly|l$ est notamment composée des [patrician_families|El] de la [republic|El]. Même si elles ne font pas montre d’une idéologie au sens où on l’entend de nos jours, chacune possède sa propre [house_ambition|El], qui affecte son vote.\n\nNotez bien qu’une $game_concept_republic|l$ n’est pas sujette à la diversité ou au chaos de la démocratie. Même si des $game_concept_laws|l$ sont adoptées, l’équilibre du pouvoir entre l’$game_concept_assembly|l$ et le $game_concept_ruler|l$ peut basculer à tout moment."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "Puisque l’[assembly|El] est souvent constituée de [patrician_families|El], continuons avec elles."
 reactive_advice_republican_politics_open_families_prompt: "Ouvrez l’onglet Familles (mis en évidence)"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "Voici les [patrician_families|El] de la [republic|El].\n\nChaque famille, dont la vôtre, possède un [patrician_rating|El]. Augmenter votre revenu grâce au [trade|El] vous permet d’obtenir des sièges à l'[assembly|El] ou au [council|E] du [ruler|El] : ainsi, votre $game_concept_patrician_rating|l$ s’améliore.\n\nPosséder un $game_concept_patrician_rating|l$ élevé augmente les effets de votre [house_ambition|El] et vous permet même de renverser le gouvernement !"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "Le destin de la [republic|El] est entre vos mains.\n\nIl vous appartient de la façonner. Garderez-vous le pouvoir au sein de votre famille ou le partagerez-vous avec d’autres ?\n\nVotre puissance et votre influence s’accroissent en même temps que votre [patrician_rating|El] grandit grâce à vos [trade_routes|El]."
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "C’est ici que vous pouvez créer vos propres [distribution_routes|El].\n\nLes routes de distribution vous permettent de transporter des [trade_goods|El] afin de satisfaire les [needs|El] des [markets|El] au sein de votre propre [realm|El]."
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "Même si une [distribution_route|El] peut transporter n’importe quel volume de [trade_goods|El], elle ne peut cependant transporter que des biens considérés comme étant des [basic_trade_goods|El], affichés ici.\n\nDe ce fait, vous n’avez pas à choisir quel $game_concept_trade_good|l$ déplacer.\n\n#I Vous pouvez sélectionner n’importe quel bien basique pour voir son [market_balance|El] sur la carte#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "Sur la carte, vous pouvez voir sous le nom de chaque [market|El] quels [basic_trade_goods|El] y sont en [surplus|El]. Cela signifie que vous pouvez exporter ces biens hors du marché."
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "De la même manière, vous pouvez aussi voir tous les [needs|El] non-satisfaits. Cela signifie que vous pouvez importer des [basic_trade_goods|El] dans ce [market|El]."
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "Une [distribution_route|El] ne peut relier que deux [markets|El], et les [goods|El] se déplacent dans les deux directions.\n\nUne fois deux marchés ajoutés à la route, vous pouvez voir comment les [needs|El] sont satisfaits grâce à la fenêtre mise en évidence.\n\nPuisque la route traverse votre [realm|El], vous n’avez pas besoin de payer le [buy_price|El] ou des [tolls|El].\n\n#I Pour ajouter ou retirer un marché sur la route, cliquez dessus sur la carte#!"
