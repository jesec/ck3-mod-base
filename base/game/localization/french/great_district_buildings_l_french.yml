 building_type_republic_statute_hall_01: "Chambre des statuts"
 building_type_republic_statute_hall_01_desc: "La salle où les lois de la commune sont conservées, copiées et lues à voix haute chaque année, afin qu’aucun magistrat et qu’aucun citoyen ne puisse prétendre les ignorer."
 republic_statute_hall_01: "Chambre des statuts"
 republic_statute_hall_02: "$republic_statute_hall_01$ II"
