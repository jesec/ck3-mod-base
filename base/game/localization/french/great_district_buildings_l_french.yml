 building_type_republic_civic_hospital_01: "Hôpital public"
 building_type_republic_civic_hospital_01_desc: "Service subventionné par la commune qui prend en charge le personnel, et où les pauvres malades sont pris en charge plutôt que laissés pour morts dans la rue. Un citoyen en bonne santé est un citoyen productif."
 republic_civic_hospital_01: "Hôpital public"
