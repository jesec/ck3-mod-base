 building_type_republic_basilica_01: "Grande basilique"
 building_type_republic_basilica_01_desc: "Cette grande basilique se trouve au cœur de la vie religieuse de la ville, bien qu’elle ne soit pas gérée par le clergé, mais par la ville elle-même. Les riches familles patriciennes qui ont financé sa construction en tirent la majeure partie des bénéfices."
