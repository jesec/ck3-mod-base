 building_type_republic_council_chamber_01: "Grande salle du Conseil"
 building_type_republic_council_chamber_01_desc: "Il y a assez de bancs ici pour accueillir tous les citoyens inscrits. C’est ici que le Conseil débat des impôts, approuve les comptes annuels, et tire au sort l’attribution des fonctions de la ville."
 republic_council_chamber_01: "Grande salle du Conseil"
 republic_council_chamber_02: "$republic_council_chamber_01$ II"
