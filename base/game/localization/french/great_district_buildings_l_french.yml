 building_type_republic_civic_ward_01: "Service municipal"
 building_type_republic_civic_ward_01_desc: "Un service chargé de la supervision des projets de construction de la ville, de l’approvisionnement en matériaux, de la gestion des permis et de l’administratif, tout en veillant à ce que chaque projet respecte les délais et le budget prévus."
