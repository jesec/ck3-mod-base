 ##### Great Plaza District Buildings #####
 republic_great_plaza_district: "Quartier de la grande place"
 republic_great_plaza_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$@government_type_republic![republic_government|E]\n$BULLET_WITH_TAB$[settlement_size|E][settlement_size_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]\n$BULLET_WITH_TAB$[prosperity|E][prosperity_i]\n$BULLET_WITH_TAB$[civic_tax_short|E][civic_tax_i] et [urban_tax|El][urban_tax_i]"
 republic_great_plaza_district_desc_flavor: "Un lieu où la république organise son gouvernement et gère sa ville."
 republic_great_plaza_district_rome_name: "Forum Romanum"
 building_type_pb_republic_city_hall_01: "$republic_great_plaza_district$"
 building_type_pb_republic_city_hall_01_desc: "L’hôtel de ville abrite l’administration de la ville. C’est là que le maire et les autres élus se réunissent pour discuter de la gestion de la ville."
