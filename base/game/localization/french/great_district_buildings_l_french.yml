 republic_civic_hospital_05: "$republic_civic_hospital_01$ V"
 building_type_republic_weigh_house_01: "Maison de pesée publique"
 building_type_republic_weigh_house_01_desc: "Les balances et les mesures de la ville, conservées et contrôlées par du personnel agréé. Chaque ballot qui passe par là est pesé moyennant finance, et aucun marchand ne peut contester le résultat."
 republic_weigh_house_01: "Maison de pesée publique"
 republic_weigh_house_02: "$republic_weigh_house_01$ II"
