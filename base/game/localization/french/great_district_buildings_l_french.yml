 building_type_republic_podesta_residence_01: "Résidence du podestat"
 building_type_republic_podesta_residence_01_desc: "Magistrat salarié recruté dans une autre ville pour un mandat défini, logé aux frais du contribuable et à qui il est interdit d’être propriétaire dans cette ville. Ne connaissant personne en ville, il ne prendra pas parti en cas de litige."
 republic_podesta_residence_01: "Résidence du podestat"
