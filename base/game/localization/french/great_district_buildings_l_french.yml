 building_type_republic_loggia_01: "Loggia commune"
 building_type_republic_loggia_01_desc: "Une galerie d’arcades située le long de la place, et à l’ombre desquelles les marchands négocient, les notaires installent leurs bureaux, et toute la ville vient s’abriter en cas de pluie."
 republic_loggia_01: "Loggia commune"
