 building_type_republic_fountain_01: "Fontaines"
 building_type_republic_fountain_01_desc: "Les fontaines, les bassins et les aqueducs symbolisent la beauté et la prospérité de la ville. Ils représentent aussi d’importantes sources d’eau pour toute la ville."
