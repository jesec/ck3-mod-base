 building_type_republic_league_chapter_house_01: "Salle capitulaire de la ligue"
 building_type_republic_league_chapter_house_01_desc: "Des logements, une chambre forte et une salle de réunion pour les représentants des villes alliées. C’est ici que la ligue se rassemble pour conclure des accords visant à relier les ports situés à des milliers de kilomètres de distance."
