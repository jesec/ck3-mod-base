 building_type_republic_debt_office_01: "Bureau dédié à la dette publique"
 building_type_republic_debt_office_01_desc: "La ville emprunte à ses propres citoyens et leur verse des intérêts en échange. Les actions changent de mains comme n’importe quelle marchandise, et les bénéfices assurent la solvabilité du Trésor et les salaires des entreprises extérieures."
 republic_debt_office_01: "Bureau dédié à la dette publique"
