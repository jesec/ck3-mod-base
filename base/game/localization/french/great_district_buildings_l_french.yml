 republic_weigh_house_05: "$republic_weigh_house_01$ V"
 building_type_republic_clock_tower_01: "Tour horloge municipale"
 building_type_republic_clock_tower_01_desc: "Une merveille mécanique qui sonne l’heure au-dessus des toits de la ville. La commune s’en vante auprès de chaque visiteur, et elle soumet chaque marchand à l’autorité de la ville plutôt qu’à celle du soleil."
