 household_district_top_liege_trigger: "Vous êtes un [independent_ruler|El], comme demandé par les [governments|El] [administrative|El], [celestial|El] et [meritocratic|El]"
 bureaucratic_district_ledger_or_administrative_trigger: "Le détenteur dispose d’un [government|El] [administrative|El], ou la [culture|El] de la [barony|El] a découvert l’[innovation|El] #V $innovation_ledger$#!"
