 ### Holdings ###
 castle_holding_district: "Quartier de propriété castrale"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "Quartier de propriété tribale"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "Quartier de propriété urbaine"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "Quartier de propriété religieuse"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "Quartier de camps nomades"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "Quartier de camps de bergers"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "Quartier de propriété de citadelle religieuse"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"
 DISTRICT_FOCUS_HEADING: "#low Orientation du quartier\n#!"
 UNLOCKS_DISTRICTS: "#low [districts|E] débloqués#!"
 ### Economy ###
 guild_district: "District de la guilde"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax|E][artisan_tax_i]\n$BULLET_WITH_TAB$[prosperity|E][prosperity_i]\n$BULLET_WITH_TAB$[trade_goods|E][trade_goods_i]\n$BULLET_WITH_TAB$[sell_prices|E][gold_i]"
 guild_district_desc_flavor: "Les couloirs de cette guilde abritent les meilleurs artisans de la ville, qui gardent jalousement leurs secrets commerciaux. Leur travail est excellent, leurs prix élevés, mais leurs apprentis sont surmenés."
 market_district: "District du marché"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity|E][prosperity_i]\n$BULLET_WITH_TAB$[sell_prices|E][gold_i]\n$BULLET_WITH_TAB$[buy_prices|E][gold_i]\n$BULLET_WITH_TAB$[commerce_tax|E][commerce_tax_i] et [artisan_tax|El][artisan_tax_i]"
 market_district_desc_flavor: "Les paysans, artisans et marchands locaux se rassemblent sur cette place animée du matin au soir. Tout ce que la ville ne peut pas produire peut être acheté ici, à « bon » prix."
 port_district: "District du port"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity|E][prosperity_i]\n$BULLET_WITH_TAB$[trade_route_capacity_short|E][trade_route_capacity_i]\n$BULLET_WITH_TAB$[maritime_tax|E][maritime_tax_i]\n$BULLET_WITH_TAB$[settlement_size|E][settlement_size_i]"
 port_district_desc_flavor: "Les jetées et les entrepôts jonchent la berge, où les quais portent les chargements de nombreux bateaux. Tout ce qui arrive par la mer passe d’abord par ici."
 entrepot_location_district: "Quartier d’entrepôt"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax|E][commerce_tax_i]"
 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', 'Permet de revendre les marchandises à longue distance via ses bâtiments' )|E]\n\nLes marchandises importées sont comptées, triées et envoyées vers le marché depuis ces entrepôts. Les marchands savent ce qui est rare et ajustent leurs prix en conséquence."
 entrepot_holding_district_level_2_tt: "Nécessite le niveau #V 2#! du [holding_district|El]"
 entrepot_holding_district_level_3_tt: "Nécessite le niveau #V 3#! du [holding_district|El]"
 entrepot_holding_district_level_4_tt: "Nécessite le niveau #V 4#! du [holding_district|El]"
 holding_district_level_2_tt: "Nécessite le niveau #V 2#! du [holding_district|El]"
 holding_district_level_3_tt: "Nécessite le niveau #V 3#! du [holding_district|El]"
 holding_district_level_4_tt: "Nécessite le niveau #V 4#! du [holding_district|El]"
 ### Fortification ###
 border_forts_district: "Quartier des forts frontaliers"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison|E][garrison_i]\n$BULLET_WITH_TAB$[stationed_regiment|E][stationed_regiment_i]\n$BULLET_WITH_TAB$[levies|E][levies_i]\n$BULLET_WITH_TAB$[control|E][control_i]"
 border_forts_district_desc_flavor: "Une enfilade de forts garde les frontières de la baronnie. Ils abritent chacun des soldats qui connaissent par cœur les routes et les gués. Les pilleurs qui s’aventurent par ici ne vont jamais bien loin."
 walls_district: "Quartier des remparts"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level|E][fort_level_i]\n$BULLET_WITH_TAB$[control|E][control_i]\n$BULLET_WITH_TAB$[garrison|E][garrison_i]"
 walls_district_desc_flavor: "D’imposants murs de pierre entourent la ville et forment une barrière impénétrable contre les pilleurs. La population regrette le fait de devoir payer à l’entrée, mais se faire voler coûte moins cher."
 ### Military ###
 military_district: "Quartier militaire"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies|E][levies_i]\n$BULLET_WITH_TAB$[stationed_regiment|E][stationed_regiment_i]\n$BULLET_WITH_TAB$[siege_weapons|E][siege_weapon_i]\n$BULLET_WITH_TAB$[garrison|E][garrison_i]\n$BULLET_WITH_TAB$[supply|E][supply_i]"
 military_district_desc_flavor: "De robustes casernes accueillent les soldats du pays. On y veille à les nourrir et à les entraîner, afin qu’ils soient toujours prêts à partir en campagne. S’assurer qu’ils restent sobres est une tout autre affaire."
 ### Civic ###
 bureaucratic_district: "Quartier administratif"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassals|E][vassal_i]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence|E][influence_i]\n$BULLET_WITH_TAB$[tax_collector|E] et [governor_efficiency|El]"
 bureaucratic_district_desc_flavor: "Dans ces salles, des fonctionnaires de tous rangs copient, scellent et classent les documents ayant trait aux affaires du pays. Leur travail est rarement salué, mais sans lui, le pays serait rapidement paralysé."
 household_district: "Maison royale"
 imperial_household_district: "Maison impériale"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E][prestige_i]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knights|E][knight_i]\n$BULLET_WITH_TAB$[opinion|E][opinion_i]"
 household_district_desc_flavor: "C’est dans ces grandes salles que le souverain tient audience. Derrière les hauts remparts, serviteurs, artisans talentueux et conseillers s’efforcent de préserver la majesté du pays. Certains d’entre eux ne mettent pas une seule fois les pieds hors de ce quartier de toute leur vie."
 mandala_district: "Quartier mandala"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety|E][piety_i]\n$BULLET_WITH_TAB$[dynasty_prestige|E][dynasty_prestige_i]\n$BULLET_WITH_TAB$[tax|E][gold_i]\n$BULLET_WITH_TAB$[opinion|E][opinion_i]"
 mandala_district_desc_flavor: "Dans ce quartier sacré, chaque temple, statue et cérémonie raconte la même histoire : le roi règne par la volonté des dieux. Elle est racontée souvent, et très bruyamment."
 temple_district: "Enclave religieuse"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety|E][piety_i]\n$BULLET_WITH_TAB$[religious_tax|E][religious_tax_i]\n$BULLET_WITH_TAB$[epidemic_resistance|E][epidemic_resistance_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]"
 temple_district_desc_flavor: "Ce quartier regorge de lieux saints, dont les cloches, chants et appels à la prière marquent chaque heure de la journée. Ici, le clergé est presque aussi influent que le seigneur."
 temple_district_christian: "Enclave de l’Église"
 temple_district_islamic: "Quartier des mosquées"
 ### Metropolitan ###
 entertainment_district: "Quartier des divertissements"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]\n$BULLET_WITH_TAB$[urban_tax|E][urban_tax_i]"
 entertainment_district_desc_flavor: "Musique, jeux et spectacles en tous genres attirent les habitants dans ce quartier, quelle que soit leur classe sociale. Les nobles feignent de n’y trouver aucun plaisir, et les manants font comme s’ils ne les voyaient pas."
 patrician_district: "Quartier patricien"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size|E][settlement_size_i]\n$BULLET_WITH_TAB$[prestige|E][prestige_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]"
 patrician_district_desc_flavor: "Marbre, soie et épices importées sont monnaie courante dans ce quartier où vivent les familles riches. Leurs membres se marient entre eux, ne prêtent qu’à leurs homologues et manigancent les uns contre les autres."
 urban_housing_district: "Quartier résidentiel"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size|E][settlement_size_i] et [settlement_size_growth_short|E]\n$BULLET_WITH_TAB$[urban_taxes_short|E][urban_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$Débloque les [urban_districts|El]"
 urban_housing_district_desc_flavor: "La plupart des habitants de la ville vivent dans ces rues bondées, où un même toit abrite généralement plusieurs familles. Pour celles qui arrivent de la campagne, il s’agit de la première étape vers une vie meilleure."
 ### Rural ###
 manor_houses_district: "Quartier des manoirs"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control|E][control_i]\n$BULLET_WITH_TAB$[fort_level|E][fort_level_i]\n$BULLET_WITH_TAB$[agricultural_tax_short|E][agricultural_tax_i] et [woodland_tax|El][woodland_tax_i]\n$BULLET_WITH_TAB$[supply|E][supply_i]"
 manor_houses_district_desc_flavor: "À travers la campagne, des manoirs abritent les familles issues de la petite noblesse qui administrent les terres alentour. Les céréales et l’argent ruissellent vers le haut, et les doléances les accompagnent."
 religious_community_district: "Quartier de la communauté religieuse"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety|E][piety_i]\n$BULLET_WITH_TAB$[religious_tax|E][religious_tax_i]\n$BULLET_WITH_TAB$[epidemic_resistance|E][epidemic_resistance_i]\n$BULLET_WITH_TAB$[travel_danger|E][travel_danger_i]"
 religious_community_district_desc_flavor: "Les dévots rejoignent cette communauté paisible pour vivre à l’écart du monde. Ils y prient, s’adonnent à des activités agricoles et recopient des textes sacrés, mais le monde ne cesse pas pour autant de leur envoyer ses problèmes."
 villages_district: "Quartier des villages"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size|E][settlement_size_i] réduite\n$BULLET_WITH_TAB$[trade_goods_production|E][trade_goods_i]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [woodland_tax|El][woodland_tax_i]\n$BULLET_WITH_TAB$[supply|E][supply_i]\n$BULLET_WITH_TAB$Débloque les [rural_districts|El]"
 villages_district_desc_flavor: "Des villages parsèment la campagne qui s’étend au-delà des enceintes de la ville, chacun disposant d’un puits et de champs qui lui sont propres. Les paysans y produisent la nourriture que la ville prend pour acquise."
 ### Tribal ###
 tribal_economy_prestige_district: "Quartier des salles de fête"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E][prestige_i]\n$BULLET_WITH_TAB$[tax|E][gold_i]"
 tribal_economy_prestige_district_desc_flavor: "Les membres de la tribu se réunissent dans ces salles de fête pour boire, manger, et se vanter de leurs exploits. Les récits deviennent un peu plus épiques à chaque coupe vidée."
 tribal_military_district: "Quartier des loges de guerre"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies|E][levies_i]\n$BULLET_WITH_TAB$[men_at_arms|E][men_at_arms_i]"
 tribal_military_district_desc_flavor: "Les guerriers de la tribu affûtent leurs armes dans ces loges et y partagent les récits des pillages passés. Les jeunes écoutent attentivement, songeant déjà à leurs propres rapines."
 tribal_wanua_district: "Quartier des wantilans"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods|E][barter_goods_i]\n$BULLET_WITH_TAB$[vassal_limit|E][vassal_limit_i]\n$BULLET_WITH_TAB$[domain_limit|E][domain_limit_i]"
 tribal_wanua_district_desc_flavor: "Les gens se rassemblent dans ces grandes salles pour exprimer leurs doléances devant les aînés, qui s’assurent ensuite de les transmettre au chef."
 ### Duchy ###
 bailiwick_district: "Quartier baillival"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [woodland_tax|El][woodland_tax_i]\n$BULLET_WITH_TAB$[trade_goods_production|E][trade_goods_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]"
 bailiwick_district_desc_flavor: "Les campagnards financent tout ce que fait le duché et les baillis de ce quartier s’en assurent, un champ, un troupeau ou un village après l’autre."
 staple_district: "Quartier des produits de base"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_taxes|E][urban_tax_i], [commerce_tax|El][commerce_tax_i], [artisan_tax|El][artisan_tax_i] et [maritime_tax|El][maritime_tax_i]\n$BULLET_WITH_TAB$[sell_prices|E][gold_i]\n$BULLET_WITH_TAB$[trade_route_capacity_short|E][trade_route_capacity_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 staple_district_desc_flavor: "Ce quartier regorge d’entrepôts, de balances et de salles de comptage. C’est ici que les marchandises les plus précieuses du duché sont pesées, taxées et protégées."
 endowment_district: "Quartier des dotations"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax|E][religious_tax_i]\n$BULLET_WITH_TAB$[piety|E][piety_i]\n$BULLET_WITH_TAB$[epidemic_resistance|E][epidemic_resistance_i]\n$BULLET_WITH_TAB$[travel_danger|E][travel_danger_i]"
 endowment_district_desc_flavor: "Chaque don effectué ici est éternel, et le clergé possède des chartes signées par des seigneurs dont personne d’autre ne se souvient."
 assay_district: "Quartier des essais"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax|E][mining_tax_i] et [civic_tax|El][civic_tax_i]\n$BULLET_WITH_TAB$[control|E][control_i]\n$BULLET_WITH_TAB$[influence|E][influence_i]\n$BULLET_WITH_TAB$[vassals|E][vassal_i]"
 assay_district_desc_flavor: "Quelques pièces de chaque lot frappé dans ce quartier sont enfermées dans un coffre, afin d’être testées plus tard s’il s’avère que les monnayeurs se sont montrés cupides."
 military_duchy_capital_district: "Quartier des terrains de rassemblement"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies|E][levies_i]\n$BULLET_WITH_TAB$[stationed_regiment|E][stationed_regiment_i]\n$BULLET_WITH_TAB$[garrison|E][garrison_i] et [fort_level|El]\n$BULLET_WITH_TAB$[knights|E][knight_i]"
 military_duchy_capital_district_desc_flavor: "Chaque soldat qui se présente dans ce quartier voit son nom, ses armes et son cheval être inscrits dans le registre. On prend également bien note de ceux qui ne se montrent pas."
 ducal_residence_district: "Quartier résidentiel ducal"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E][prestige_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]\n$BULLET_WITH_TAB$[prosperity|E][prosperity_i]\n$BULLET_WITH_TAB$[stress|E][stress_i]"
 ducal_residence_district_desc_flavor: "Dans ce quartier, les invités sont reçus dans des salles et jardins dignes d’un duc, où bon nombre des affaires du duché se règlent autour d’un dîner – bien plus qu’à la Cour, en tout cas."
 royal_residence_district: "Quartier résidentiel royal"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E][prestige_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]\n$BULLET_WITH_TAB$[prosperity|E][prosperity_i]\n$BULLET_WITH_TAB$[stress|E][stress_i]"
 royal_residence_district_desc_flavor: "Dans ce quartier, les invités sont reçus dans des salles et jardins dignes d’un roi, où bon nombre des affaires du royaume se règlent autour d’un dîner – bien plus qu’à la Cour, en tout cas."
 governance_district: "Quartier de gouvernance"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control|E][control_i]\n$BULLET_WITH_TAB$[influence|E][influence_i]\n$BULLET_WITH_TAB$[popular_opinion|E][popular_opinion_i]\n$BULLET_WITH_TAB$[men_at_arms|E][men_at_arms_i]"
 governance_district_desc_flavor: "Des fonctionnaires de tous rangs travaillent dans les bâtiments de ce quartier, où ils comptabilisent les impôts de la province, inspectent le contenu de ses greniers et paient ses garnisons."
 forestry_district: "Quartier forestier"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E][woodland_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_glass').GetNameWithIcon|l], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon|l] et [GetTradeGoodType('trade_good_meat').GetNameWithIcon|l]"
 forestry_district_desc_flavor: "Les forêts de ce quartier fournissent du bois utilisé pour construire des maisons, des bateaux ou pour alimenter les feux ; et le droit d’abattre leurs arbres est farouchement défendu. Les vols de bois sont punis presque aussi sévèrement que la chasse illégale au cerf."
 grain_district: "Quartier céréalier"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l]"
 grain_district_desc_flavor: "Les céréales sont à la base de toute économie, et elles sont cultivées en abondance dans les champs de ce quartier. Celles qui ne servent pas à produire du pain sont brassées, distillées ou vendues."
 wool_district: "Quartier d’élevage ovin"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l], [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon|l], [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 wool_district_desc_flavor: "Des troupeaux de moutons paissent dans les pâturages de ce quartier, et leur laine est vendue au sac aux tisserands du pays. Plus d’un marchand ayant fait fortune a commencé avec un seul troupeau."
 cattle_district: "Quartier d’élevage bovin"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_meat').GetNameWithIcon|l], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon|l] et [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l]"
 cattle_district_desc_flavor: "Dans les pâturages de ce quartier paissent des bovins prisés pour leur viande, leur lait et leur force de traction. Dans bon nombre d’endroits, la dot des mariées se compte encore en vaches."
 cotton_district: "Quartier cotonnier"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 cotton_district_desc_flavor: "Les capsules de coton blanches qui mûrissent dans les champs de ce quartier sont cueillies pour être vendues au ballot. Certains peuples vivant dans des contrées lointaines pensent qu’elles poussent sur des plantes desquelles jaillissent de minuscules moutons."
 stone_district: "Quartier des carrières"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax|E][mining_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 stone_district_desc_flavor: "Les collines de ce quartier portent les cicatrices laissées par leurs carrières, où la pierre est découpée en blocs utilisés pour construire les murs, temples et châteaux du pays. Certains de ses plus beaux édifices n’auraient peut-être pas vu le jour sans ces coteaux."
 fish_district: "Quartier de pêche"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax|E][maritime_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 fish_district_desc_flavor: "Le poisson pêché ici est mangé cru, salé, fumé ou séché, puis vendu loin à l’intérieur des terres, où les plans d’eau sont rares. Une bonne pêche peut nourrir un village un mois durant."
 wine_district: "Quartier vinicole"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 wine_district_desc_flavor: "Les vignobles de ce quartier produisent du raisin destiné à être consommé à table, à être séché, et surtout, à confectionner du vin. On se souvient des grands crus pendant des décennies, et encore plus longtemps des mauvais."
 oil_district: "Quartier oléicole"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 oil_district_desc_flavor: "L’huile produite dans ce quartier sert à alimenter les lampes, cuisiner les repas, oindre les fidèles et adoucir la peau des riches. Elle peut presque tout faire, et peu de foyers s’en passent."
 rice_district: "Quartier rizicole"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l] et [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l]"
 rice_district_desc_flavor: "Les rizières inondées parsemant ces terres sont entretenues par des villages entiers, qui se chargent de la plantation, du désherbage et de la récolte ensemble. Cultiver le riz représente bien trop de travail pour une famille seule."
 millet_district: "Quartier de culture du millet"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_wood').GetNameWithIcon|l]"
 millet_district_desc_flavor: "Ces plaines arides sont couvertes de champs de millet et de sorgho dont les plantes sont assez grandes pour dissimuler un cavalier. Leurs petites graines dures se conservent des années sans s’abîmer."
 mine_district: "Quartier minier"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax|E][mining_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon|l]"
 mine_district_desc_flavor: "Qu’il s’agisse de fer, d’argent ou de sel, ce qui se trouve sous ce quartier est extrait par des mineurs qui passent plus de temps sous terre qu’à la surface."
 salt_district: "Quartier de production de sel"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax|E][mining_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 salt_district_desc_flavor: "Sans sel, impossible de conserver la viande et le poisson pour les mois difficiles, ou de nourrir une armée sur la durée. Ce quartier en fournit énormément et en a bien conscience."
 amber_district: "Quartier de récolte de l’ambre"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E][woodland_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 amber_district_desc_flavor: "L’ambre qui s’échoue ici après les tempêtes est extrait du sable et des marais situés à l’intérieur des terres. Les amas dans lesquels un insecte est emprisonné sont censés porter chance."
 silk_district: "Quartier de culture de la soie"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 silk_district_desc_flavor: "La soie de ce quartier provient de vers minuscules, qui dévorent des feuilles de mûrier jour et nuit. Confectionner une robe requiert les cocons de milliers d’entre eux."
 furs_district: "Quartier des fourreurs"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E][woodland_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_leather').GetNameWithIcon|l]"
 furs_district_desc_flavor: "Les trappeurs de ce quartier partent chasser les mois les plus froids, quand la fourrure des animaux est la plus épaisse et la plus rémunératrice. À elle seule, une belle peau peut rapporter autant qu’une saison de travail complète."
 spices_district: "Quartier de culture d’épices"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 spices_district_desc_flavor: "Les épices que l’on trouve ici peuvent provenir de toutes les parties d’une plante : écorce, bourgeons, baies, racines, filaments de fleur... Toutes sont récoltées à la main et séchées avec soin."
 tea_district: "Quartier de culture du thé"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 tea_district_desc_flavor: "Des théiers poussent sur les versants abrupts des collines de ce quartier, qui sont couverts de brume le matin. Les plus belles feuilles sont cueillies jeunes, deux par deux avec leur bourgeon."
 dyes_district: "Quartier de la teinturerie"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 dyes_district_desc_flavor: "Les teintures de ce quartier sont effectuées à l’aide de racines, de feuilles, de baies et même d’insectes broyés. Obtenir une couleur intense et durable peut nécessiter une douzaine de trempages."
 ivory_district: "Quartier de chasse à l’ivoire"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E][woodland_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 ivory_district_desc_flavor: "Les éléphants de ce quartier sont capturés, domptés, puis dressés pour la guerre, le travail et le culte. Leur ivoire ne représente qu’une partie de leur valeur."
 sugar_district: "Quartier sucrier"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 sugar_district_desc_flavor: "On broie les grandes cannes à sucre de ce quartier pour récolter leur jus sucré, le réduire et en faire des pains durs. Bien loin d’ici, un de ces pains a plus de valeur à lui seul qu’une vache."
 incense_district: "Quartier de récolte d’encens"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 incense_district_desc_flavor: "L’encens que l’on trouve dans ce quartier est une résine qui a été extraite de l’écorce des arbres et laissée sécher au soleil. Sa fumée emplit l’air des temples dans tout le monde connu."
 medicaments_district: "Quartier de récolte des plantes médicinales"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax|E][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 medicaments_district_desc_flavor: "Des herbes médicinales poussent dans les jardins et dans les zones sauvages du quartier où elles sont cueillies par des gens capables de distinguer les feuilles qui soignent de celles qui sont nocives."
 ceramics_district: "Quartier de la poterie"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax|E][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_glass').GetNameWithIcon|l]"
 ceramics_district_desc_flavor: "L’argile que l’on trouve dans ce quartier est de si bonne qualité que les potiers voyagent pendant des semaines pour venir l’extraire. Les plus belles pièces cuites ici résonnent comme une cloche lorsque l’on tapote dessus."
 hemp_district: "Quartier de culture du chanvre"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l]"
 hemp_district_desc_flavor: "Ce quartier est couvert de champs de chanvre dont le fruit des récoltes est mis à tremper, puis battu pour en extraire les fibres, qui sont ensuite utilisées pour fabriquer cordes, tissu et toiles."
 flax_district: "Quartier producteur de lin"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_textiles').GetNameWithIcon|l], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon|l]"
 flax_district_desc_flavor: "Ici, on arrache le lin avec ses racines au lieu de le couper, afin de ne pas perdre le moindre pouce de fibres. Ses graines sont pressées, et le résidu obtenu est donné aux animaux."
 honey_district: "Quartier apicole"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production possible[trade_goods_i] : [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l] et [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon|l]"
 honey_district_desc_flavor: "Ici, les abeilles sont élevées dans des ruches en paille, en argile ou dans des troncs creux, et on les apaise avec de la fumée pour récolter leur miel. Ce dernier est la seule douceur à laquelle la plupart des gens goûtent au cours de leur vie."
 fruit_district: "Quartier de récolte des fruits"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i] et [artisan_tax|El][artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]\n$BULLET_WITH_TAB$Production production[trade_goods_i] : [GetTradeGoodType('trade_good_beer').GetNameWithIcon|l]"
 fruit_district_desc_flavor: "Des vergers couvrent les versants et les vallées de ce quartier. Leurs fruits sont dégustés frais, séchés au soleil ou pressés."
 horses_district: "Quartier d’élevage de chevaux"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E][agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E][settlement_size_i]"
 horses_district_desc_flavor: "Ce quartier regorge de pâturages, de paddocks et d’étables. Les chevaux y sont élevés, débourrés et vendus à des cavaliers venus de tout le pays."
