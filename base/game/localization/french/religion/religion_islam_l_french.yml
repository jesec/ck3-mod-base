 #Ṣadr al-Islām
 sadr_al_islam: "Sadr al-Islam"
 sadr_al_islam_adj: "musulmane"
 sadr_al_islam_adherent: "musulman"
 sadr_al_islam_adherent_plural: "musulmans"
 sadr_al_islam_desc: "Dans sa forme la plus pure, avant l’émergence des écoles de pensée au cours des années suivantes, les musulmans étaient guidés par le Prophète en personne grâce à la révélation divine. Sa sunna était suivie par les compagnons et les tabi’un des premières générations."
 #Sunni
 sunni: "Sunnisme"
 sunni_adj: "sunnite"
 sunni_adherent: "sunnite"
 sunni_adherent_plural: "sunnites"
 sunni_desc: "Le terme « sunnite » désigne les adeptes des pratiques de Mahomet, connues sous le nom de « sunna ». La jurisprudence islamique sunnite s’appuie principalement sur le Coran, les hadiths et l’ijma (consensus des savants) comme sources fondamentales."
 #Shia
 shia: "Chiisme"
 shia_adj: "chiite"
 shia_adherent: "chiite"
 shia_adherent_plural: "chiites"
 shia_desc: "Branche de l’islam qui considère que le pouvoir doit rester au sein de la famille du prophète Mahomet et être transmis par des imams guidés par Dieu. Elle met l’accent sur la dévotion envers la famille du Prophète."
 islam_shia_priest: "mollah"
 islam_shia_priest_plural: "mollahs"
 islam_shia_religious_head_title: "Imam"
 islam_shia_religious_head_title_name: "Imamat"
 #Kharijite
 kharijite: "Kharijisme"
 kharijite_adj: "kharijite"
 kharijite_adherent: "kharijite"
 kharijite_adherent_plural: "kharijites"
 kharijite_desc: "Un groupe islamique des débuts estimait que le pouvoir devait reposer sur la piété et non sur la filiation, et que les dirigeants coupables de péchés pouvaient être destitués. Ce groupe est apparu au cours des troubles chiites, a rejeté les deux camps et déclaré que les grands pécheurs étaient hors de l’islam."
 #Masmudism
 masmudi: "Almohadisme"
 masmudi_adj: "almohade"
 masmudi_adherent: "almohade"
 masmudi_adherent_plural: "almohades"
 masmudi_desc: "Branche réformiste de l’islam sunnite issue des tribus berbères d’Afrique du Nord, le mouvement almohade se considérait comme unitaire et prêchait une doctrine de monothéisme purifié."
 masmudi_religious_head_title: "Calife"
 masmudi_religious_head_title_name: "califat"
 #Quranism
 quranist: "Coranisme"
 quranist_adj: "coraniste"
 quranist_adherent: "coraniste"
 quranist_adherent_plural: "coranistes"
 quranist_desc: "Une interprétation littérale de l’islam qui souligne que le Coran est la seule source de sagesse divine et doit être suivi à la lettre, en ignorant les hadiths et les fatwas."
 #Druze
 druze: "Druzisme"
 druze_adj: "druze"
 druze_adherent: "druze"
 druze_adherent_plural: "druzes"
 druze_desc: "Originaire de la montagne Druze, la foi druze suit de nombreux principes de l’ismaélisme, mais inclut également les croyances gnostiques d’une théologie ésotérique centrée sur la vérité de l’existence."
 druze_religious_text: "les Épîtres de la Sagesse"
 druze_religious_text_2: "aux Épîtres de la Sagesse" #Optional translation alt
 druze_religious_text_3: "des Épîtres de la Sagesse" #Optional translation alt
