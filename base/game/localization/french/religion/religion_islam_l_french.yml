l_french:
 #Common Islam Localization
 islam_religion: "Islam"
 islam_religion_adj: "musulmane"
 islam_religion_adherent: "musulman"
 islam_religion_adherent_plural: "musulmans"
 islam_religion_desc: "L’islam est la révélation finale de la foi abrahamique, guidée par la parole de Dieu, telle qu’elle a été révélée au prophète Mahomet. Il se concentre sur le fait de vivre une bonne vie dans la servitude du seul et unique Dieu miséricordieux."
