 generic_tenet_focus_tenet_human_sacrifice: "Le [GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )|l] considère l’offrande de sang comme un pacte redoutable, mais sacré, entre les mortels et le divin."
 generic_tenet_focus_tenet_mystical_birthright: "La [GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )|l] soutient que le destin marque certaines âmes dès la naissance pour leur conférer un pouvoir sacré et une grandeur spirituelle."
 generic_tenet_focus_tenet_ritual_celebrations: "Les [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )|l] exaltent les réjouissances communautaires et les fêtes sacrées comme l’expression la plus complète du culte."
 generic_tenet_focus_tenet_sacred_childbirth: "L’[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )|l] entoure la naissance de révérence, prêtant à la maternité et à la nouvelle vie une signification sacrée."
 generic_tenet_focus_tenet_sanctity_of_nature: "Le [GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )|l] trouve le divin dans le monde vivant, vénérant ainsi la croissance, la fertilité et la nature sauvage."
 generic_tenet_focus_tenet_sun_worship: "L’[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )|l] honore l’astre brillant comme un signe vivifiant d’ordre, de rayonnement et de faveur divine."
 generic_tenet_focus_tenet_warmonger: "Le [GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )|l] glorifie la conquête et la vigueur martiale, attendant ainsi des fidèles qu’ils fassent leurs preuves sur le champ de bataille."
 generic_tenet_focus_tenet_gruesome_festivals: "Les [GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )|l] embrassent les festivités sacrificielles, transformant ainsi la peur, le sang et le spectacle en manifestation sacrée."
 generic_tenet_focus_tenet_cthonic_redoubts: "Les [GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )|l] vénèrent les hauteurs et les forteresses cachées de la terre comme des lieux d’une sainteté hors du commun."
 generic_tenet_focus_tenet_household_gods: "Les [GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )|l] sacralisent le foyer, plaçant ainsi la famille et la dévotion quotidienne sous la protection divine."
 generic_tenet_focus_tenet_sinitic_syncretism: "Le [GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )|l] tisse sa tradition avec la pensée chinoise, recherchant ainsi l’harmonie plutôt que la rupture."
 generic_tenet_focus_tenet_eastern_syncretism: "Le [GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )|l] s’imprègne volontiers des enseignements lointains, percevant ainsi la sagesse étrangère comme l’écho d’une vérité sacrée."
 generic_tenet_focus_tenet_unreformed_syncretism: "Les [GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )|l] puisent librement dans les pratiques anciennes, intégrant ainsi les rites antiques dans un nouvel ensemble sacré."
 generic_tenet_focus_tenet_christian_syncretism: "Le [GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )|l] réinterprète les enseignements du Christ dans son propre cadre sacré plutôt que de les rejeter d’emblée."
 generic_tenet_focus_tenet_islamic_syncretism: "Le [GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )|l] emprunte à la croyance et aux coutumes musulmanes, trouvant ainsi une vérité utile au sein d’une révélation voisine."
 generic_tenet_focus_tenet_jewish_syncretism: "Le [GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )|l] intègre la tradition, la loi et la mémoire hébraïques dans sa conception du sacré."
 generic_tenet_focus_tenet_exaltation_of_pain: "L’[GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )|l] considère la douleur comme purificatrice, révélant ainsi la dévotion à travers l’endurance et la souffrance acceptée."
 generic_tenet_focus_tenet_natural_primitivism: "Le [GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )|l] se méfie de la civilisation excessive, honorant un mode de vie plus rude et plus élémentaire."
 generic_tenet_focus_tenet_pursuit_of_power: "La [GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )|l] bénit l’ambition et la maîtrise temporelle, traitant ainsi la domination comme un instrument légitime du sacré."
 generic_tenet_focus_tenet_ritual_cannibalism: "Le [GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )|l] intègre la consommation de chair humaine dans un culte tabou et une terreur sacrée."
 generic_tenet_focus_tenet_sacred_shadows: "Les [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )|l] se voilent de secret, sanctifiant la dissimulation, le crépuscule et ce qui est caché au plus grand nombre."
 generic_tenet_focus_tenet_polyamory: "Le [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )|l] bénit plusieurs amours à la fois, refusant ainsi de confiner l’intimité sacrée à un seul lien."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "Les [GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )|l] placent l’offrande solennelle au cœur du culte, liant ainsi le sacrifice à l’alliance et à la faveur."
 generic_tenet_focus_tenet_megaliths: "Les [GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )|l] marquent le sacré avec la pierre durable, se fiant ainsi aux monuments pour ancrer les souvenirs et la dévotion."
 generic_tenet_focus_tenet_fp3_fedayeen: "Le [GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )|l] sanctifie la discrétion, l’infiltration et l’auto-sacrifice par la violence au service d’une cause supérieure."
 generic_tenet_focus_tenet_communal_possessions: "Les [GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )|l] minimisent l’importance de la richesse personnelle, exhortant ainsi les fidèles à mettre leurs ressources en commun."
 generic_tenet_focus_tenet_pure_land: "La [GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )|l] place l’espoir dans un royaume béni au-delà de la souffrance, accessible par la confiance, le souvenir et la dévotion."
 generic_tenet_focus_tenet_no_mind: "L’[GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )|l] recherche une clarté au-delà de l’intellect qui cherche à saisir, disciplinant ainsi l’esprit pour atteindre une conscience vide et lucide."
 generic_tenet_focus_tenet_mountain_worship: "Les [GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )|l] considèrent les hauteurs comme plus proches du divin, faisant ainsi des sommets et des pics des objets de vénération."
 generic_tenet_focus_tenet_extinction_of_dharma: "L’[GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )|l] considère le monde comme envahi par la corruption, ce qui justifie une violence impitoyable pour défendre la vérité."
 generic_tenet_focus_tenet_cranial_trophies: "Les [GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )|l] traitent les restes des ennemis comme une preuve sacrée de triomphe et de prestige terrifiant."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "La [GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )|l] exalte l’apprentissage comme un travail sacré, recherchant ainsi la vérité par l’étude, le débat et la recherche disciplinée."
 generic_tenet_focus_tenet_benevolent_governance: "La [GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )|l] mesure la sainteté en partie par un règne juste, une gestion ordonnée et le soin apporté au pays."
 generic_tenet_focus_tenet_filial_piety: "La [GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )|l] enseigne le respect des parents et des aînés comme fondement de l’ordre moral et sacré."
 generic_tenet_focus_tenet_harmonious_society: "La [GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )|l] valorise l’équilibre, la bienséance et l’harmonie sociale comme reflets de l’ordre cosmique."
 generic_tenet_focus_tenet_sacred_destruction: "La [GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )|l] se considère comme une purification, faisant de la ruine elle-même un instrument de renouveau."
 generic_tenet_focus_tenet_preservation: "La [GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )|l] privilégie l’endurance, la continuité et la sauvegarde minutieuse de ce qui a été confié."
 generic_tenet_focus_tenet_takamin: "Le [GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )|l] traite l’ours et les puissances apparentées de la nature sauvage avec révérence et crainte."
 generic_tenet_focus_tenet_peace_of_god: "La [GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )|l] cherche à restreindre la violence, fixant des limites sacrées quant aux moments où le sang peut être versé à juste titre."
 generic_tenet_focus_tenet_dulia: "La [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )|l] honore les défunts bénis et les modèles sacrés, sans pour autant les assimiler au divin."
 generic_tenet_focus_tenet_transubstantiation: "La [GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )|l] considère les saints mystères comme véritablement transformateurs, plaçant le sacrement au cœur de la présence divine."
 generic_tenet_focus_tenet_ora_et_labora: "« [GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )] » unit la dévotion et le labeur, en considérant que le travail honnête peut lui-même devenir une forme de culte."
 generic_tenet_focus_tenet_hyperdulia: "La [GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )] élève l’intercesseur le plus saint au-dessus du rang ordinaire des saints et lui accorde une vénération exceptionnelle."
 generic_tenet_focus_tenet_simony: "La [GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )|l] reconnaît que la fonction sacrée, le patronage et la richesse terrestre ne se séparent pas facilement."
 generic_tenet_focus_tenet_monophysitism: "Le [GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )|l] proclame l’unité de la nature du Christ, refusant ainsi de diviser le mystère divin de manière trop tranchée."
 generic_tenet_focus_tenet_acts_of_apostles: "Le [GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )|l] s’inspire de la communauté apostolique, de la charité et de la vie commune des premiers fidèles."
 generic_tenet_focus_tenet_purgatory: "Le [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )|l] enseigne que de nombreuses âmes sont purifiées après la mort avant de pouvoir entrer dans la béatitude parfaite."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )] élève la famille et la procréation au rang de devoirs sacrés."
 generic_tenet_focus_tenet_apostolic_succession: "La [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )|l] fonde l’autorité sur une chaîne ininterrompue de transmission remontant aux premiers disciples."
 generic_tenet_focus_tenet_confession: "Le [GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )|l] valorise la pleine repentance et l’absolution, et considère que le péché confessé est le commencement de la guérison."
 generic_tenet_focus_tenet_original_sin: "Le [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )|l] considère la faiblesse humaine comme première, et que donc aucune âme entrant dans le monde n’est épargnée."
 generic_tenet_focus_tenet_celestial_hierarchy: "La [GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )|l] conçoit le cosmos comme ordonné en rangs sacrés, chaque rang reflétant le dessein divin."
 generic_tenet_focus_tenet_miles_christi: "Les [GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )|l] présentent les fidèles comme des guerriers du sacré appelés à défendre la vérité avec un zèle discipliné."
 generic_tenet_focus_tenet_scholasticism: "La [GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )|l] affine la croyance par le débat, le commentaire et la réconciliation de la raison et de la foi."
 generic_tenet_focus_tenet_adoptionism: "L’[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )|l] met l’accent sur l’exaltation et la filiation divine d’une manière qui minimise la distinction éternelle."
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )] place la miséricorde et l’altruisme au cœur de la vie religieuse quotidienne."
 generic_tenet_focus_tenet_divine_liturgy: "La [GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )|l] exalte les rites solennels, considérant le culte ordonné comme la voie royale vers le sacré."
 generic_tenet_focus_tenet_miaphysitism: "Le [GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )|l] enseigne l’union indissociable de la divinité et de l’humanité au sein du mystère unique du Christ."
 generic_tenet_focus_tenet_hesychasm: "L’[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l] recherche l’union par le silence, le recueillement et la répétition intérieure de la prière sacrée."
 generic_tenet_focus_tenet_anachoresis: "L’[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )|l] honore le retrait du monde, recherchant la sainteté dans la solitude, les épreuves et l’éloignement."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "La [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l] poursuit la sainteté par des épreuves corporelles, soumettant ainsi la chair à un but spirituel."
 generic_tenet_focus_tenet_holy_myron: "Le [GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )|l] accorde une importance particulière à l’onction, considérant l’huile sacrée comme un sceau de la grâce divine."
 generic_tenet_focus_tenet_khachkar: "Les [GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )|l] sanctifient les croix de pierre sculptées et les monuments durables en tant que témoins publics du sacré."
