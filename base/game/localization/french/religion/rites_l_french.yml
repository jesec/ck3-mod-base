 mozarabic_church: "Mozarabisme"
 mozarabic_church_adj: "mozarabe"
 mozarabic_church_adherent: "mozarabe"
 mozarabic_church_adherent_plural: "mozarabes"
 mozarabic_church_desc: "Issu des premiers rites ibériques, le rite mozarabe a conservé un certain degré d’indépendance vis-à-vis de Rome après des siècles de domination islamique. Sa longue cohabitation avec d’autres religions l’a rendu plus ouvert aux différences que les sectes plus fondamentalistes."
 ambrosian_rite: "Rite ambrosien"
 ambrosian_rite_adj: "ambrosienne"
 ambrosian_rite_adherent: "chrétien ambrosien"
 ambrosian_rite_adherent_plural: "chrétiens ambrosiens"
 ambrosian_rite_desc: "Propre à l’archidiocèse de Milan depuis l’époque de son grand évêque, saint Ambroise, le rite ambrosien conserve sa propre liturgie et son propre chant, ainsi qu’une tradition théologique qui accorde une grande importance à la pensée de saint Augustin d’Hippone."
 beneventan_rite: "Rite bénéventain"
 beneventan_rite_adj: "bénéventaine"
 beneventan_rite_adherent: "chrétien bénéventain"
 beneventan_rite_adherent_plural: "chrétiens bénéventains"
 beneventan_rite_desc: "La tradition liturgique du Sud lombard, centrée sur Bénévent et la grande abbaye du Mont-Cassin. Son chant et ses usages particuliers la distinguent de la pratique romaine, qui considère ce rite avec une méfiance croissante."
 carolingian_christianity: "Christianisme carolingien"
 carolingian_christianity_adj: "carolingienne"
 carolingian_christianity_adherent: "carolingien"
 carolingian_christianity_adherent_plural: "carolingiens"
 carolingian_christianity_desc: "Forme de christianisme qui s’est développée sous le règne de la dynastie carolingienne, caractérisée par l’importance accordée au monachisme et à l’œuvre missionnaire."
 byzantine_rite: "Rite grec"
 byzantine_rite_adj: "grecque"
 byzantine_rite_adherent: "chrétien grec"
 byzantine_rite_adherent_plural: "chrétiens grecs"
 byzantine_rite_desc: "Le Patriarcat de Constantinople est l’un des centres les plus importants du christianisme orthodoxe oriental, réputé pour ses riches traditions théologiques et son influence historique. Le rite grec trouve son origine directe dans le patriarcat."
 antiochian_rite: "Rite antiochien"
 antiochian_rite_adj: "antiochienne"
 antiochian_rite_adherent: "chrétien antiochien"
 antiochian_rite_adherent_plural: "chrétiens antiochiens"
 antiochian_rite_desc: "Le Patriarcat d’Antioche est l’une des plus anciennes communautés chrétiennes, fondé par les apôtres saint Pierre et saint Paul. Sa tradition syriaque occidentale, dite « jacobite » du nom de Jacques Baradée qui a réorganisé l’Église, prône la doctrine miaphysite et l’ancienne liturgie de saint Jacques."
 slavic_rite: "Rite slave"
 slavic_rite_adj: "slave"
 slavic_rite_adherent: "chrétien slave"
 slavic_rite_adherent_plural: "chrétiens slaves"
 slavic_rite_desc: "Introduit chez les peuples slaves par Cyrille et Méthode, ce rite intègre des éléments de la liturgie byzantine adaptés aux langues et à la culture slaves grâce à l’alphabet glagolitique."
 georgian_rite: "Rite géorgien"
 georgian_rite_adj: "géorgienne"
 georgian_rite_adherent: "géorgien"
 georgian_rite_adherent_plural: "géorgiens"
 georgian_rite_desc: "Le rite géorgien incarne les traditions chrétiennes de la Géorgie, caractérisées par une liturgie distincte, un patrimoine ecclésiastique et des liens étroits avec la théologie et la pratique orthodoxes orientales."
 coptic_rite: "Coptisme"
 coptic_rite_adj: "copte"
 coptic_rite_adherent: "copte"
 coptic_rite_adherent_plural: "coptes"
 coptic_rite_desc: "Originaire de l’évangéliste Saint-Marc, l’Église copte est célèbre pour être le berceau du monachisme chrétien et pour maintenir une longue tradition de promotion de l’éducation et de la philosophie."
 ethiopian_rite: "Rite guèze"
 ethiopian_rite_adj: "guèze"
 ethiopian_rite_adherent: "chrétien guèze"
 ethiopian_rite_adherent_plural: "chrétiens guèzes"
 ethiopian_rite_desc: "Ancrée dans les hauts plateaux éthiopiens et issue de l’héritage d’Aksoum, cette tradition chrétienne antique se distingue des autres Églises alexandrines par un canon scripturaire plus vaste, de solides traditions monastiques et une alliance façonnée par l’héritage royal salomonide."
 armenian_rite: "Rite apostolique"
 armenian_rite_adj: "apostolique"
 armenian_rite_adherent: "apostolique"
 armenian_rite_adherent_plural: "apostoliques"
 armenian_rite_desc: "Fondée par les apôtres Barthélemy et Thaddée, l’Église apostolique arménienne a rapidement gagné des adeptes dans la région et a conduit le Royaume d’Arménie à devenir le premier État à avoir adopté le christianisme comme religion officielle."
 apostolic_religious_head_title: "Catholicos"
 apostolic_religious_head_title_plural: "Catholicoi"
 apostolic_religious_head_title_name: "Église"
 # Nabi
 nabi: "Nabisme"
 nabi_adj: "nabi"
 nabi_adherent: "nabi"
 nabi_adherent_plural: "nabis"
 nabi_desc: "Comme l’explique le Coran, le terme « nabi » désigne une personne choisie par le Tout-Puissant pour transmettre Son message et rappeler aux gens le Jour où ils seront convoqués devant Lui et devront rendre compte de leurs actes. Selon la croyance fondamentale, le prophète Mahomet fut le dernier d’entre eux."
 # Pre madhabs
 sahabah: "Sahaba"
 sahabah_adj: "sahaba"
 sahabah_adherent: "sahabi"
 sahabah_adherent_plural: "sahaba"
 sahabah_desc: "Également connus sous le nom de « compagnons de Mahomet », il s’agissait de disciples musulmans qui l’ont rencontré ou vu de leur vivant. Les compagnons ont joué un rôle important dans les débuts de la lutte, la société, la transmission des hadiths et la gouvernance musulmanes."
 tabiun: "Tabiun"
 tabiun_adj: "tabiun"
 tabiun_adherent: "tabi"
 tabiun_adherent_plural: "tabiun"
 tabiun_desc: "Décrite comme la génération de musulmans qui a succédé aux compagnons (« sahaba ») du prophète Mahomet et qui a ainsi reçu leurs enseignements de seconde main avant l’apparition des écoles sunnites au cours des siècles suivants."
 # Sunni
 hanafi: "Hanafisme"
 hanafi_adj: "hanafite"
 hanafi_adherent: "hanafite"
 hanafi_adherent_plural: "hanafites"
 hanafi_desc: "Issue des enseignements du juriste et théologien Abou Hanifa, qui a systématisé l’usage du raisonnement, la théorie juridique hanafite tire principalement le droit du Coran, de la Sunna, du consensus des érudits et du raisonnement par analogie."
 hanbali: "Hanbalisme"
 hanbali_adj: "hanbalite"
 hanbali_adherent: "hanbalite"
 hanbali_adherent_plural: "hanbalites"
 hanbali_desc: "L’école hanbalite est la plus petite des quatre grandes écoles de jurisprudence islamique sunnite et s’appuie sur les enseignements d’Ahmad ibn Hanbal. Contrairement aux autres écoles, les hanbalites s’opposent à la codification du droit en un système complet, et mettent l’accent sur le Coran et les hadiths comme sources suprêmes."
 maliki: "Malikisme"
 maliki_adj: "malikite"
 maliki_adherent: "malikite"
 maliki_adherent_plural: "malikites"
 maliki_desc: "L’une des quatre grandes écoles de jurisprudence islamique au sein de l’islam sunnite. Elle a été fondée par Malik ibn Anas au VIIIe siècle. L’école malikite se distingue des autres écoles juridiques sunnites principalement par les sources qu’elle utilise pour déduire ses règles juridiques."
 shafii: "Chaféisme"
 shafii_adj: "chaféite"
 shafii_adherent: "chaféite"
 shafii_adherent_plural: "chaféites"
 shafii_desc: "Cette école porte le nom d’al-Shafi’i, un érudit et juriste musulman surnommé « le père de la jurisprudence musulmane », qui vécut au début du IXe siècle. Le principe fondamental de la pensée chaféite est que chaque acte accompli par un croyant soumis à la Loi trouve son équivalent dans la Loi révélée, ou charia."
 #Ismaili
 ismaili: "Ismaélisme"
 ismaili_adj: "ismaélite"
 ismaili_adherent: "ismaélite"
 ismaili_adherent_plural: "ismaélites"
 ismaili_desc: "Un rite chiite qui considère que la lignée des vrais imams — ceux imprégnés de la connaissance et de l’infaillibilité divines — remonte à Ismaïl ben Jafar. Ils sont également connus sous le nom de septimains, car Ismaël était le septième imam d’après Mahomet."
 #Qarmatians
 qarmatian: "Qarmatisme"
 qarmatian_adj: "qarmate"
 qarmatian_adherent: "qarmate"
 qarmatian_adherent_plural: "qarmates"
 qarmatian_desc: "Une branche de l’ismaélisme qui a incorporé des éléments du zoroastrisme. Le nombre d’imams a été fixé par Dieu à sept et il ne peut donc plus y avoir d’imams avant le retour du septième imam — Muhammad ibn Ismaïl — pour guider les fidèles."
 #Nizari
 nizari: "Nizarisme"
 nizari_adj: "nizârite"
 nizari_adherent: "nizârite"
 nizari_adherent_plural: "nizârites"
 nizari_desc: "Un rite rationaliste qui met l’accent sur le raisonnement dans l’interprétation du Coran et des hadiths. Être imam est héréditaire et on peut remonter la lignée jusqu’à Ali."
 #Zayidi
 zayidi: "Zaïdisme"
 zayidi_adj: "zaïdite"
 zayidi_adherent: "zaïdite"
 zayidi_adherent_plural: "zaïdites"
 zayidi_desc: "Un véritable imam n’est pas infaillible, mais se définit par la lutte contre la corruption et le mal. Les zaïdites ont donc la conviction que Zayd ibn Ali fut le successeur légitime de l’imamat, en raison de sa rébellion contre les Omeyyades."
 #Imamism (Twelver)
 imami: "Imamisme"
 imami_adj: "imamite"
 imami_adherent: "imamite"
 imami_adherent_plural: "imamites"
 imami_desc: "Les imamites croient que douze imams ont été prophétisés pour diriger la oumma et que le douzième imam, l’imam Zaman, attend de revenir pour diriger les musulmans jusqu’au jour du Jugement."
 islam_ayatollah: "ayatollah"
 islam_ayatollah_plural: "ayatollahs"
 ghulat: "Ikhtilafisme"
 ghulat_adj: "ikhtilafi"
 ghulat_adherent: "ikhtilafi"
 ghulat_adherent_plural: "ikhtilafis"
 ghulat_desc: "Les ikhtilafis croient en la nature divine des infaillibles imams, à commencer par Ali. Non seulement Dieu les a nommés et inspirés, mais est partiellement en eux pour guider leurs actes et, par conséquent, toute la oumma."
 alawite: "Alaouisme"
 alawite_adj: "alaouite"
 alawite_adherent: "alaouite"
 alawite_adherent_plural: "alaouites"
 alawite_desc: "Les enseignements religieux alaouites sont secrets et le Coran n’est qu’un de leurs textes sacrés. Outre la croyance en la succession d’imams par Ali, les alaouites croient également en la réincarnation et en le fait que tous les êtres ont été des étoiles tombées du ciel qui doivent maintenant regagner leur place en menant une vie bonne et fidèle."
 #Alevis
 alevi: "Alévisme"
 alevi_adj: "alévie"
 alevi_adherent: "alévi"
 alevi_adherent_plural: "alévis"
 alevi_desc: "Les alévis croient en l’héritage des douze imams, mais suivent également de nombreuses autres traditions, décrites dans leur recueil de textes sacrés, les Buyruks. Dans la tradition alévie, Dieu est la vérité, et Mahomet et Ali en sont des manifestations dans le monde."
 alevi_house_of_worship: "le cemevi"
 alevi_house_of_worship_2: "au cemevi" # Optional translation alt
 alevi_house_of_worship_3: "du cemevi" # Optional translation alt
 alevi_house_of_worship_plural: "cemevis"
 alevi_religious_text: "les Buyruks"
 alevi_religious_text_2: "aux Buyruks" # Optional translation alt
 alevi_religious_text_3: "des Buyruks" # Optional translation alt
 #Ibadi (Muhakkima)
 ibadi: "Muhakkima"
 ibadi_adj: "muhakkima"
 ibadi_adherent: "muhakkima"
 ibadi_adherent_plural: "muhakkimas"
 ibadi_desc: "Les muhakkimas estiment que la communauté musulmane n’a pas besoin d’un calife ou d’un imam s’il n’existe aucun candidat approprié. Ils rejettent l’idée que la lignée d’Ali ou les successeurs d’Abou Bakr soient intrinsèquement des dirigeants légitimes, et mettent plutôt l’accent sur la droiture morale et le consensus."
 #Azariqa
 azariqa: "Azraqisme"
 azariqa_adj: "azraqite"
 azariqa_adherent: "azraqite"
 azariqa_adherent_plural: "azraqites"
 azariqa_desc: "Ne reconnaissant aucun successeur digne de Mahomet, les azraqites considèrent que c’est leur droit et leur devoir de lutter contre tout dirigeant qui ne défend pas les valeurs de leur foi. En effet, toute différence dans l’interprétation de la foi ferait de quelqu’un un infidèle."
 #Najdat
 najdat: "Najdatisme"
 najdat_adj: "najdate"
 najdat_adherent: "najdate"
 najdat_adherent_plural: "najdates"
 najdat_desc: "Les adeptes de la branche najdate du kharidjisme croient fermement en l’instauration d’un gouvernement musulman fondé sur le consensus des fidèles. Le chef n’est pas infaillible, mais à travers la communauté, il est choisi par Dieu."
 #Sufri
 sufri: "Sufrisme"
 sufri_adj: "sufrite"
 sufri_adherent: "sufrite"
 sufri_adherent_plural: "sufrites"
 sufri_desc: "Les sufrites croient en la direction divine par l’interprétation de la parole de Dieu plutôt que par l’héritage. La volonté de Dieu devient connue comme une expression de la volonté de la oumma, à condition que les gens de la oumma connaisse bien le Coran."
 #Hafizi
 hafizi: "Hafizi"
 hafizi_adj: "hafizi"
 hafizi_adherent: "hafizi"
 hafizi_adherent_plural: "hafizis"
 hafizi_desc: "Les hafizis accordent la priorité au soutien de celui qu’ils considèrent comme le véritable calife avant tout autre, ainsi qu’à la résistance à toutes les tentatives visant à le déposer. En cas de défaite, ils se caractérisent par la rébellion pour une cause valable, et en cas de victoire, par une adhésion fière à la volonté de leur chef."
