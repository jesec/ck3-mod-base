l_french:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "Le rite [Rite.GetAdherentNameNoTooltip] a été fondé par [Character.Custom('FR_le_Char_P')][Character.GetFullName] en [Character.GetCurrentLocation.GetTitle.GetName] le [GetCurrentDate.GetStringLong], au sein de la foi [Faith.GetAdjective]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "Le rite [Rite.GetAdherentNameNoTooltip] a été fondé par [Character.Custom('FR_le_Char_P')][Character.GetFullName] le [GetCurrentDate.GetStringLong], au sein de la foi [Faith.GetAdjective]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "Ce rite conserve une dimension dévotionnelle particulière au sein de sa foi."
 generic_rite_focus_tenet_aniconism: "Ce rite rejette les images sacrées et recherche la révérence par l’absence, la retenue et la sainteté d’un divin non représenté."
 generic_rite_focus_tenet_alexandrian_catechism: "Ce rite valorise l’enseignement érudit, la doctrine subtile et l’instruction patiente des fidèles."
 generic_rite_focus_tenet_armed_pilgrimages: "Ce rite considère la guerre sainte et le pèlerinage armé comme des devoirs sacrés des fidèles."
 generic_rite_focus_tenet_carnal_exaltation: "Ce rite honore le désir et le plaisir charnel comme des dons empreints de sacré."
 generic_rite_focus_tenet_communal_identity: "Ce rite lie étroitement le culte aux coutumes partagées, à la vie commune et à une identité communautaire préservée."
 generic_rite_focus_tenet_communion: "Ce rite est maintenu par la dévotion partagée, l’aumône et la communion avec son chef spirituel."
 generic_rite_focus_tenet_consolamentum: "Ce rite aspire à la purification finale par le renoncement et une préparation inébranlable à la mort."
 generic_rite_focus_tenet_divine_marriage: "Ce rite sacralise tant l’union que le pouvoir, considérant le mariage sacré comme un reflet de l’ordre divin."
 generic_rite_focus_tenet_gnosticism: "Ce rite recherche les vérités cachées au-delà du voile du monde, confiant le salut à la connaissance sacrée."
 generic_rite_focus_tenet_mendicant_preachers: "Ce rite diffuse la foi par l’intermédiaire de prédicateurs itinérants, d’un témoignage humble et d’un enseignement inlassable."
 generic_rite_focus_tenet_pacifism: "Ce rite exalte la retenue et la paix, considérant l’effusion de sang inutile comme un grave échec de l’âme."
 generic_rite_focus_tenet_pentarchy: "Ce rite tient en haute estime les sièges antiques de l’autorité et la gestion ordonnée de la foi au sens large."
 generic_rite_focus_tenet_unrelenting_faith: "Ce rite loue le zèle inébranlable, la ferme résolution et la volonté de lutter pour ce qui est sacré."
 generic_rite_focus_tenet_vows_of_poverty: "Ce rite honore la sainte pauvreté, exhortant les fidèles à se débarrasser du superflu et à vivre avec moins."
 generic_rite_focus_tenet_pastoral_isolation: "Ce rite privilégie des fidèles protégés par la séparation du monde extérieur."
 generic_rite_focus_tenet_rite: "Ce rite accorde une grande importance à la liturgie, à l’ordre clérical et à la préservation de la tradition sacrée."
 generic_rite_focus_tenet_adaptive: "Ce rite s’adapte sans se briser, intégrant les coutumes locales tout en préservant son essence sacrée."
 generic_rite_focus_tenet_esotericism: "Ce rite chérit la sagesse cachée, l’initiation et les vérités révélées uniquement à ceux qui y sont préparés."
 generic_rite_focus_tenet_legalism: "Ce rite fonde la sainteté sur une loi claire, un jugement juste et un ordre de vie discipliné."
 generic_rite_focus_tenet_literalism: "Ce rite s’en tient strictement aux paroles sacrées, se méfiant des interprétations laxistes et des compromis hérités."
 generic_rite_focus_tenet_reincarnation: "Ce rite considère le parcours de l’âme comme cyclique, chaque vie façonnant la suivante."
 generic_rite_focus_tenet_religious_legal_pronouncements: "Ce rite confère aux lois sacrées et aux décisions formelles une autorité spirituelle durable."
 generic_rite_focus_tenet_struggle_submission: "Ce rite enseigne que la foi se prouve par la lutte, la conquête et la soumission des impies."
 generic_rite_focus_tenet_false_conversion_sanction: "Ce rite tolère la conformité cachée et les masques extérieurs lorsque la survie ou l’intérêt l’exigent."
 generic_rite_focus_tenet_tax_nonbelievers: "Ce rite considère l’incroyance comme un tribut à payer, renforçant la hiérarchie sacrée par des cotisations."
 generic_rite_focus_tenet_asceticism: "Ce rite recherche la sainteté par l’abnégation, la discipline et la maîtrise du désir."
 generic_rite_focus_tenet_bhakti: "Ce rite met l’accent sur la dévotion sincère, enseignant que l’abandon dans l’amour rapproche l’âme du divin."
 generic_rite_focus_tenet_dharmic_pacifism: "Ce rite valorise un comportement inoffensif et la maîtrise de soi, considérant la paix comme une discipline supérieure à la colère."
 generic_rite_focus_tenet_inner_journey: "Ce rite se tourne vers l’intérieur, recherchant l’éveil par la réflexion, la discipline et la transformation de soi."
 generic_rite_focus_tenet_ritual_hospitality: "Ce rite considère l’hospitalité comme une obligation sacrée, liant hôte et invité par une coutume sacrée."
 generic_rite_focus_tenet_adorcism: "Ce rite courtise les esprits avec révérence, dans l’espoir de gagner leur faveur et d’éviter leur colère."
 generic_rite_focus_tenet_ancestor_worship: "Ce rite se tourne vers les morts honorés pour trouver des conseils, des bénédictions et assurer la continuité avec les vivants."
 generic_rite_focus_tenet_astrology: "Ce rite déchiffre le sens des cieux, comptant sur les étoiles pour révéler l’ordre, le destin et le moment opportun."
 generic_rite_focus_tenet_hedonistic: "Ce rite embrasse la fête, l’excès et la sanctification du plaisir dans le culte communautaire."
 generic_rite_focus_tenet_human_sacrifice: "Ce rite considère l’offrande de sang comme un pacte redoutable, mais sacré, entre les mortels et le divin."
 generic_rite_focus_tenet_mystical_birthright: "Ce rite soutient que le destin marque certaines âmes dès la naissance pour leur conférer un pouvoir sacré et une grandeur spirituelle."
 generic_rite_focus_tenet_ritual_celebrations: "Ce rite exalte les réjouissances communautaires et les fêtes sacrées comme l’expression la plus complète du culte."
 generic_rite_focus_tenet_sacred_childbirth: "Ce rite entoure la naissance de révérence, prêtant à la maternité et à la nouvelle vie une signification sacrée."
 generic_rite_focus_tenet_sanctity_of_nature: "Ce rite trouve le sacré dans le monde vivant, vénérant ainsi la croissance, la fertilité et la nature sauvage."
 generic_rite_focus_tenet_sun_worship: "Ce rite honore le soleil comme un signe vivifiant d’ordre, de rayonnement et de faveur divine."
 generic_rite_focus_tenet_warmonger: "Ce rite glorifie la conquête et la vigueur martiale, attendant ainsi des fidèles qu’ils fassent leurs preuves par la guerre."
 generic_rite_focus_tenet_gruesome_festivals: "Ce rite embrasse les festivités sacrificielles, transformant ainsi la peur, le sang et le spectacle en manifestation sacrée."
 generic_rite_focus_tenet_cthonic_redoubts: "Ce rite vénère les hauteurs et les forteresses cachées de la terre comme des lieux d’une sainteté hors du commun."
 generic_rite_focus_tenet_household_gods: "Ce rite sacralise le foyer, plaçant ainsi la famille et la dévotion quotidienne sous la protection divine."
 generic_rite_focus_tenet_sinitic_syncretism: "Ce rite tisse sa tradition avec la pensée sinitique, recherchant ainsi l’harmonie plutôt que la rupture."
 generic_rite_focus_tenet_eastern_syncretism: "Ce rite s’imprègne volontiers des enseignements orientaux, percevant ainsi la sagesse étrangère comme l’écho d’une vérité sacrée."
 generic_rite_focus_tenet_unreformed_syncretism: "Ce rite puise librement dans les pratiques anciennes, intégrant ainsi les rites antiques dans un nouvel ensemble sacré."
 generic_rite_focus_tenet_christian_syncretism: "Ce rite réinterprète l’enseignement chrétien dans son propre cadre sacré plutôt que de le rejeter d’emblée."
 generic_rite_focus_tenet_islamic_syncretism: "Ce rite emprunte à la croyance et aux coutumes islamiques, trouvant ainsi une vérité utile au sein d’une révélation voisine."
 generic_rite_focus_tenet_jewish_syncretism: "Ce rite intègre la tradition, la loi et la mémoire juives dans sa conception du sacré."
 generic_rite_focus_tenet_exaltation_of_pain: "Ce rite considère la douleur comme purificatrice, révélant ainsi la dévotion à travers l’endurance et la souffrance acceptée."
 generic_rite_focus_tenet_natural_primitivism: "Ce rite se méfie de la civilisation excessive, honorant un mode de vie plus rude et plus élémentaire."
 generic_rite_focus_tenet_pursuit_of_power: "Ce rite bénit l’ambition et la maîtrise temporelle, traitant ainsi le pouvoir comme un instrument légitime du sacré."
 generic_rite_focus_tenet_ritual_cannibalism: "Ce rite intègre la consommation de chair humaine dans un culte tabou et une terreur sacrée."
 generic_rite_focus_tenet_sacred_shadows: "Ce rite se voile de secret, sanctifiant la dissimulation, le crépuscule et ce qui est caché au plus grand nombre."
 generic_rite_focus_tenet_polyamory: "Ce rite bénit plusieurs amours à la fois, refusant ainsi de confiner l’intimité sacrée à un seul lien."
 generic_rite_focus_tenet_sacrificial_ceremonies: "Ce rite place l’offrande solennelle au centre du culte, liant ainsi le sacrifice à l’alliance et à la faveur."
 generic_rite_focus_tenet_megaliths: "Ce rite marque le sacré avec la pierre durable, faisant ainsi confiance aux monuments pour ancrer les souvenirs et la dévotion."
 generic_rite_focus_tenet_fp3_fedayeen: "Ce rite sanctifie la discrétion, l’infiltration et l’auto-sacrifice par la violence au service d’une cause supérieure."
 generic_rite_focus_tenet_communal_possessions: "Ce rite minimise l’importance de la richesse personnelle, exhortant ainsi les fidèles à mettre leurs ressources en commun."
 generic_rite_focus_tenet_pure_land: "Ce rite place l’espoir dans un royaume béni au-delà de la souffrance, accessible par la confiance, le souvenir et la dévotion."
 generic_rite_focus_tenet_no_mind: "Ce rite recherche une clarté au-delà de l’intellect qui cherche à saisir, disciplinant ainsi l’esprit pour atteindre une conscience vide et lucide."
 generic_rite_focus_tenet_mountain_worship: "Ce rite considère les hauteurs comme plus proches du divin, faisant ainsi des sommets et des hauteurs des objets de vénération."
 generic_rite_focus_tenet_extinction_of_dharma: "Ce rite considère le monde comme envahi par la corruption, ce qui justifie une violence impitoyable pour défendre la vérité."
 generic_rite_focus_tenet_cranial_trophies: "Ce rite traite les restes des ennemis comme une preuve sacrée de triomphe et de prestige terrifiant."
 generic_rite_focus_tenet_pursuit_of_knowledge: "Ce rite exalte l’apprentissage comme un travail sacré, recherchant ainsi la vérité par l’étude, le débat et la recherche disciplinée."
 generic_rite_focus_tenet_benevolent_governance: "Ce rite mesure la sainteté en partie par un règne juste, une gestion ordonnée et le soin apporté au pays."
 generic_rite_focus_tenet_filial_piety: "Ce rite enseigne le respect des parents et des aînés comme fondement de l’ordre moral et sacré."
 generic_rite_focus_tenet_harmonious_society: "Ce rite valorise l’équilibre, la bienséance et l’harmonie sociale comme reflets de l’ordre cosmique."
 generic_rite_focus_tenet_sacred_destruction: "Ce rite considère la destruction sacrée comme une purification, faisant de la ruine elle-même un instrument de renouveau sacré."
 generic_rite_focus_tenet_preservation: "Ce rite privilégie l’endurance, la continuité et la sauvegarde minutieuse de ce qui a été confié."
 generic_rite_focus_tenet_takamin: "Ce rite traite l’ours et les puissances apparentées de la nature sauvage avec révérence et crainte."
 generic_rite_focus_tenet_peace_of_god: "Ce rite cherche à restreindre la violence, fixant des limites sacrées quant aux moments où le sang peut être versé à juste titre."
 generic_rite_focus_tenet_dulia: "Ce rite honore les saints et les modèles sacrés, vénérant leur mémoire sans les assimiler au divin."
 generic_rite_focus_tenet_transubstantiation: "Ce rite considère les saints mystères comme véritablement transformateurs, plaçant le sacrement au cœur de la présence divine."
 generic_rite_focus_tenet_ora_et_labora: "Ce rite allie la prière au labeur, enseignant ainsi que le travail discipliné peut lui-même devenir une forme de dévotion."
 generic_rite_focus_tenet_hyperdulia: "Ce rite élève l’intercesseur le plus saint au-dessus du rang ordinaire des saints et lui accorde une vénération exceptionnelle."
 generic_rite_focus_tenet_simony: "Ce rite reconnaît que la fonction sacrée, le patronage et la richesse terrestre ne se séparent pas facilement."
 generic_rite_focus_tenet_monophysitism: "Ce rite proclame l’unité de la nature du Christ, refusant ainsi de diviser le mystère divin de manière trop tranchée."
 generic_rite_focus_tenet_acts_of_apostles: "Ce rite s’inspire de la communauté apostolique, de la charité et de la vie commune des premiers fidèles."
 generic_rite_focus_tenet_purgatory: "Ce rite enseigne que de nombreuses âmes sont purifiées après la mort avant de pouvoir entrer dans la béatitude parfaite."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "Ce rite élève la famille et la procréation au rang de devoirs sacrés."
 generic_rite_focus_tenet_apostolic_succession: "Ce rite fonde l’autorité sur une chaîne ininterrompue de transmission remontant aux apôtres."
 generic_rite_focus_tenet_confession: "Ce rite valorise la pleine repentance et l’absolution, et considère que le péché confessé est le commencement de la guérison."
 generic_rite_focus_tenet_original_sin: "Ce rite considère la faiblesse humaine comme première, et que donc aucune âme entrant dans le monde n’est épargnée."
 generic_rite_focus_tenet_celestial_hierarchy: "Ce rite conçoit le cosmos comme ordonné en rangs sacrés, chaque rang reflétant le dessein divin."
 generic_rite_focus_tenet_miles_christi: "Ce rite présente les fidèles comme des soldats du sacré appelés à défendre la vérité avec un zèle discipliné."
 generic_rite_focus_tenet_scholasticism: "Ce rite affine la croyance par le débat, le commentaire et la réconciliation de la raison et de la foi."
 generic_rite_focus_tenet_adoptionism: "Ce rite met l’accent sur l’exaltation et la filiation divine d’une manière qui minimise la distinction éternelle."
 generic_rite_focus_tenet_love_thy_neighbour: "Ce rite place la miséricorde et l’amour du prochain au cœur de la vie religieuse quotidienne."
 generic_rite_focus_tenet_divine_liturgy: "Ce rite exalte la liturgie solennelle, considérant le culte ordonné comme la voie royale vers le divin."
 generic_rite_focus_tenet_miaphysitism: "Ce rite enseigne l’union indissociable de la divinité et de l’humanité au sein du mystère unique du Christ."
 generic_rite_focus_tenet_hesychasm: "Ce rite recherche l’union par le silence, le recueillement et la répétition intérieure de la prière sacrée."
 generic_rite_focus_tenet_anachoresis: "Ce rite honore le retrait du monde, recherchant la sainteté dans la solitude, les épreuves et l’éloignement."
 generic_rite_focus_tenet_mortification_of_the_flesh: "Ce rite poursuit la sainteté par des épreuves corporelles, soumettant ainsi la chair à un but spirituel."
 generic_rite_focus_tenet_holy_myron: "Ce rite accorde une importance particulière à l’onction sacrée, considérant l’huile sacrée comme un sceau de la grâce divine."
 generic_rite_focus_tenet_khachkar: "Ce rite sanctifie les croix de pierre sculptées et les monuments durables en tant que témoins publics du sacré."
 generic_tenet_focus_fallback: "Ce principe conserve une dimension dévotionnelle particulière au sein de sa foi."
 generic_tenet_focus_tenet_aniconism: "L’[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )|l] rejette les images sacrées et recherche la révérence par l’absence, la retenue et la sainteté d’un divin non représenté."
