 roman_rite: "Rite romain"
 roman_rite_adj: "romaine"
 roman_rite_adherent: "chrétien romain"
 roman_rite_adherent_plural: "chrétiens romains"
 roman_rite_desc: "Le rite romain est la tradition liturgique de l’Église de Rome, façonnée par la théologie latine, l’autorité juridique et l’importance accordée à la discipline sacramentaire, à la hiérarchie cléricale et à l’unité institutionnelle."
 insular_celtic: "Insularisme"
 insular_celtic_adj: "insulaire"
 insular_celtic_adherent: "insulariste"
 insular_celtic_adherent_plural: "insularistes"
 insular_celtic_desc: "Église rurale qui s’est éloignée de l’orthodoxie catholique romaine il y a quelques siècles, le rite insulaire a perdu beaucoup de ses traits distinctifs d’antan, sur l’insistance de son Église mère. Elle conserve cependant une plus grande importance pour la pénitence et le monachisme, et intègre de nombreuses coutumes celtiques traditionnelles du mariage, étrangères au reste de la chrétienté."
 insular_celtic_religious_head_title: "Archiabbé"
 insular_celtic_religious_head_title_female: "Archiabbesse"
 insular_celtic_religious_head_title_name: "Conseil paroissial"
 #^"Congress" would be better, but it reads oddly in a medieval context.
