 #Additional Tenets
 tenet_ritual_cannibalism_name: "Cannibalisme rituel"
 tenet_ritual_cannibalism_desc: "L’humanité est bénie d’avoir reçu une lueur du divin. La chair humaine est donc sacrée, sa présence est une chose à savourer et non ensevelie ou brûlée."
 doctrine_parameter_cannibalism_legal: "Le trait [GetTrait('cannibal').GetName( GetNullCharacter )|l] n’est plus considéré comme [criminal|El]"
 doctrine_parameter_tenet_ritual_cannibalism_devour_reward: "Possibilité de manger les [prisoners|El] pour perdre du [stress|El] et gagner de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_ritual_cannibalism_feast_toast: "L’[honorary_guest|El] peut être mangé à la fin d’un [GetActivityType('activity_feast').GetName|l]"
 tenet_exaltation_of_pain_name: "Exaltation de la douleur"
 tenet_exaltation_of_pain_desc: "La douleur est l’émotion universelle, la violence le langage universel. Accorder de la douleur à un autre, c’est lui donner une bénédiction, alors recevoir soi-même de la douleur, c’est recevoir la grâce."
 doctrine_parameter_torturing_prisoners_grants_piety: "Torturer les [prisoners|El] fournit de la [piety|El]@piety_icon! au lieu d’en coûter"
 doctrine_parameter_reduced_stress_from_torture: "Les adeptes n’éprouvent pas de [stress|El] et gagnent de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! lorsqu’ils sont torturés"
 doctrine_parameter_self_mutilation_active: "Peut [decide|El] de s’auto-flageller, ce qui procure de la [piety|El]@piety_icon! mais également le [trait|El] [GetTrait('wounded_1').GetName( GetPlayer )]"
 doctrine_parameter_no_epidemic_fulfillment_loss_active: "Les adeptes ne subissent pas de perte d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! en raison des [epidemics|El]"
 doctrine_parameter_no_epidemic_fulfillment_loss_personal_active: "Ce personnage ne subit pas de perte d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! en raison des [epidemics|El]"
 doctrine_parameter_tenet_exaltation_of_pain_flagellant_trait: "Gagne le [trait|El] [GetTrait('flagellant').GetName( GetPlayer )] en choisissant ce [personal_tenet|El]"
 doctrine_parameter_tenet_exaltation_of_pain_wounded_spiritual_fulfillment: "Devenir [GetTrait('wounded_1').GetName( GetPlayer )|l] procure de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! en fonction de la gravité"
 doctrine_parameter_tenet_exaltation_of_pain_wound_courtier_interaction: "Débloque l’[interaction|El] #V $exaltation_of_pain_wound_courtier_interaction$#!, ce qui vous permet de blesser des [courtiers|El] pour de la [piety|El]@piety_icon!"
 exaltation_of_pain_wounded_spiritual_fulfillment_toast: "Béni par la douleur"
