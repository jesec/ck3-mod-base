 tenet_christian_syncretism_name: "Syncrétisme chrétien"
 tenet_christian_syncretism_desc: "Jésus de Nazareth n’était peut-être pas une vraie divinité, mais il reste une figure droite et vertueuse. Nous devrions honorer ses enseignements."
 doctrine_parameter_christian_syncretic_actor_opinion_active: "Bonus d’[opinion|El] réciproque de $VALUE|=+0$ avec les [faiths|El] qui ont le [core_tenet|El] $tenet_christian_syncretism_name$"
 doctrine_parameter_christian_syncretic_recipient_opinion_active: "Bonus d’[opinion|El] de $VALUE|=+0$ réciproque avec les [faiths|El] chrétiennes et leurs [counties|El]"
 doctrine_parameter_adoptionists_are_unilateral_hostile: "Les autres [faiths|El] $christianity_religion_adj$s ne les considèrent que comme $hostility_hostile_tooltippable$, bien que les adoptianistes plus raffinés soient considérés comme $hostility_evil_tooltippable$"
 doctrine_parameter_adoptionists_are_unilateral_evil: "Les autres [faiths|El] $christianity_religion_adj$s les considèrent comme $hostility_evil_tooltippable$"
