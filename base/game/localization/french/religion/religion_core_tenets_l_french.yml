l_french:
 doctrine_core_tenets_name: "Principes"
 tenets_name: "Principes"
 #Abrahamic Tenets
 tenet_communion_name: "Communion"
 tenet_communion_desc: "Nos rituels ne sont pas simplement symboliques — ils invoquent la présence même du divin. Ceux qui ne nous rejoignent pas dans leur pratique ne peuvent pas être de vrais croyants."
 doctrine_parameter_tenet_communion_denied_sacrament: "Les [characters|El] [Concept('excommunicated', 'excommuniés')|E] de ce [rite|El] subissent #N -25%#! de gain en [piety|El]@piety_icon! et #N -10#! en [opinion|El] de même foi"
 doctrine_parameter_tenet_communion_shared_table: "Organiser un [GetActivityType('activity_feast').GetName|l] procure #P +10#! en [opinion|El] avec chaque invité de même [faith|El]"
 doctrine_parameter_excommunication_active: "Les [heads_of_faith|El] spirituels peuvent [excommunicate|El] les autres personnages de leur [faith|El]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "Les personnages de ce [rite|El] peuvent prendre la [decision|El] de [GetDecisionWithKey('pam_decision_last_rites').GetName|l]"
 doctrine_parameter_seek_indulgences_active: "Les personnages de ce [rite|El] peuvent utiliser l’[interaction|El] #high $seek_indulgences_interaction$#!, si la [faith|El] a un [head_of_faith|El] ou des [clerical_regions|El]"
 tenet_armed_pilgrimages_name: "Pèlerinages armés"
 tenet_armed_pilgrimages_desc: "Nos pèlerins voyagent à travers le monde pour visiter nos lieux saints — nous nous ferons un plaisir de prendre l’épée pour les protéger de quiconque voudrait leur faire du mal"
 doctrine_parameter_cheaper_holy_wars_active: "Il coûte aux [rulers|El] de ce [rite|El] #P -20%#! de moins de [piety|El]@piety_icon! pour déclarer des [holy_wars|El]"
 doctrine_parameter_great_holy_wars_active: "Si le [head_of_faith|El] existe, il peut déclarer une [great_holy_war|El]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Si le [head_of_faith|El] existe, les adeptes obtiennent un bonus à la [councillor_task|El] « [convert_county|El] » pour chaque [holy_site|El] contrôlé"
 doctrine_parameter_pilgrimage_decision_active: "Les personnages de ce [rite|El] obtiennent un bonus supplémentaire lorsqu’ils terminent un [pilgrimage|El]"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[Concept('leasing', 'Bailler à rente')|E] des [holdings|El] aux [holy_orders|El] procure de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! supplémentaire"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "Monachisme"
 tenet_monasticism_desc: "Les plaisirs de la bonne nourriture et des boissons servent seulement à nous distraire du service du divin. S’isoler dans des monastères éloignés est le meilleur moyen d’éviter ces tentations."
 doctrine_parameter_take_vows_active: "Les [courtiers|El] peuvent prononcer les vœux et devenir [GetTrait('devoted').GetName( GetNullCharacter )|l]#L s#!"
 doctrine_parameter_devoted_trait_criminal: "Le trait [GetTrait('devoted').GetName( GetNullCharacter )] est [criminal|El]"
 doctrine_parameter_cannot_take_the_vows: "Les personnages de ce [rite|El] ne peuvent pas utiliser l’[character_interaction|El] #high $take_vows_interaction$#!"
 tenet_divine_marriage_name: "Mariage divin"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "En épousant des membres de notre famille proche, nous émulons les unions sacrées des premiers êtres de la création. De bonnes qualités seront transmises à nos descendants et nous gagnerons ainsi en pureté et en faveur dans le combat éternel contre le mal."
 doctrine_parameter_divine_marriage_opinion: "L’adepte qui est marié à un membre de sa [close_family|El] a $VALUE|0+=$ d’[opinion|El] de la part des [vassals|El] de la même [faith|El]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Le bonus de mariage [GetDoctrineType('doctrine_monogamy').GetBaseName|l] octroie également une grande quantité de [piety|El]@piety_icon! quand vous épousez un membre de la [close_family|El]"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "Contribution en [skills|El] du [spouse|El] pour les [councillor_tasks|El] : #P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Les adeptes sont beaucoup moins susceptibles de créer ou de rejoindre des [factions|El] contre un [liege|El] marié à de la [close_family|El] ou de la [extended_family|El]"
 tenet_pacifism_name: "Pacifisme"
 tenet_pacifism_desc: "La violence est un acte odieux qui ne mène qu’à la souffrance, à la douleur et au regret. En œuvrant pour l’éviter autant que possible, nous pouvons construire des sociétés plus fortes et plus sûres pour les fidèles. Les comtés pacifistes se développent et prospèrent en de telles circonstances."
 doctrine_parameter_holy_wars_forbidden: "Impossible de déclarer une [holy_war|El] ou un [raid|El]"
 doctrine_parameter_pacifist_opinion_active: "Opinion des pacifistes : $VALUE|+=0$"
 pacifist_opinion_name: "Autre pacifiste"
 pacifist_county_opinion_name: "Autre comté pacifiste"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[opinion|E] des autres pacifistes : $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Les dirigeants en paix pendant au moins deux ans auront leur [piety|El]@piety_icon! changée de $VALUE|+$ chaque mois"
 PIETY_LONG_PEACE: "Longue paix"
 tenet_vows_of_poverty_name: "Vœux de pauvreté"
 tenet_vows_of_poverty_desc: "L’argent corrompt le cœur des hommes et les éloigne de la vraie foi. Nous devons éviter l’acquisition de la richesse matérielle si nous voulons nous concentrer sur ce qui compte vraiment : la recherche d’humbles activités et de trouver la piété grâce à leur accomplissement."
 doctrine_parameter_vows_of_poverty_active: "Les [rulers|El] peuvent [decide|El] de faire vœu de pauvreté, ce qui réduit leur revenu d’[tax|El] mensuel, mais augmente le gain mensuel de [piety|El]@piety_icon!"
 tenet_human_sacrifice_name: "Sacrifice humain"
 tenet_human_sacrifice_desc: "Le meilleur moyen de prouver notre dévotion est de passer par un sacrifice. Le plus précieux est celui de la vie humaine."
 doctrine_parameter_human_sacrifice_active: "Les [executions|El] procurent de la [piety|El]@piety_icon! au lieu d’en coûter"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "Les [executions|El] ne coûtent jamais de [prestige|El]@prestige_icon! lors d’un [sharing_power|El]"
 doctrine_parameter_flower_war_cb_active: "Accorde le [casus_belli|El] « [flowery_war|El] » contre les pays voisins"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "Les [executions|El] procurent de la [piety|El]@piety_icon! et de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! supplémentaires en fonction de la [nobility|El] et du [rank|El] du sacrifice"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Probabilité nettement plus élevée de capturer des personnages lors des [sieges|El]"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Probabilité augmentée d’[imprison|El] les personnages sans terres"
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Fêtes sacrificielles"
 tenet_gruesome_festivals_desc: "Nous sommes tous nés dans le sang. Nous survivons par le sang de notre bétail, de notre famille, de nos ennemis. Il est tout à fait naturel qu’une part reviennent [ROOT.Rite.GetFaith.PantheonTerm2]."
 gruesome_festivals_active_name: "la capacité d’organiser de grands sacrifices"
 doctrine_parameter_gruesome_festivals_active: "Débloque l’[activity|El] de [GetActivityType('activity_gruesome_festival').GetName|l] environ une fois par décennie, qui procure de la [piety|El]@piety_icon! ainsi que de l’[opinion|El] des sujets et de l’[county_opinion|El] de la même [faith|El]"
 tenet_volcanic_veneration_name: "Vénération volcanique"
 tenet_volcanic_veneration_desc: "Il n’y a rien de plus divin que la nouvelle terre jaillissant des fosses ardentes de notre monde. Nous passons nos vies au bord du désastre, à la merci [ROOT.Rite.GetFaith.PantheonTerm3]."
 tenet_cthonic_redoubts_name: "Redoutes chtoniennes"
 tenet_cthonic_redoubts_desc: "Il n’y a pas de meilleur abri que les racines de la Terre, pas de forteresse plus résistante que ses épines saillantes, pas de pèlerinage plus sacré que ses sentiers cachés. Nous contemplons la création depuis ces sommets élevés et ressentons le véritable poids du divin."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Vitesse de [Concept('convert_county','conversion de comté')|E] en [terrain|El] montagneux : #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "Vitesse de [Concept('promote_culture','promotion de la culture')|E] en [terrain|El] montagneux de même [faith|El] : #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Vitesse de [Concept('convert_county','conversion de comté')|E] hostile en [terrain|El] montagneux : #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Suicide rituel"
 tenet_consolamentum_desc: "Quand nous vieillissons ou sommes très malades, nous effectuons un rituel pour purifier notre âme. Une fois que cela est fait, nous mettons fin rapidement et définitivement à nos vies, afin que le péché n’ait pas l’occasion de nous infester une fois de plus."
 doctrine_parameter_consolamentum_active: "Les adeptes peuvent [decide|El] de mettre fin à leurs jours lorsqu’ils sont vieux, incapables ou proches de la mort. Cela n’entraîne aucune des pénalités habituelles en cas de suicide"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "Quand un adepte meurt par la [decision|El] du [GetDecisionWithKey('initiate_consolamentum_decision').GetName|l], son héritier gagne #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! en [piety|El]@piety_icon!"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Votre héritier gagne #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! en [piety|El]@piety_icon! supplémentaires et $pam_blessed_passing_modifier$ pendant #P 10#! ans si vous mourrez par la [decision|El] [GetDecisionWithKey('initiate_consolamentum_decision').GetName]"
 tenet_gnosticism_name: "Gnosticisme"
 tenet_gnosticism_desc: "Grâce à la connaissance, l’étincelle divine qui réside à l’intérieur de tous les humains peut être libérée et renvoyée à sa source céleste dans le royaume des esprits."
 doctrine_parameter_granting_titles_gives_stress: "Accorder des [titles|El] réduit le [stress|El]"
 tenet_mendicant_preachers_name: "Prédication mendiante"
 tenet_mendicant_preachers_desc: "Nos missionnaires voyagent loin avec rien d’autre que les vêtements qu’ils portent. Ils vivent de la générosité de ceux qu’ils visitent et partagent en retour le savoir de la vraie foi."
 doctrine_parameter_mendicant_preachers_conversion_active: "Vitesse de conversion comtale : #P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Convertir un [character|El] procure de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! supplémentaire"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "Influencer les [characters|El] d’une autre [faith|El] est plus susceptible de réussir"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Les invités d’une autre [faith|El] de vos [activities|El] pourraient être convertis à la vôtre"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Active l’[interaction|El] #V $attempt_conversion_of_local_ruler_interaction$#! avec les [rulers|El] de votre [location|El] actuel"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Permet l’[travel_option|El] [GetTravelOption('adventurers_proselytize_zealously_option').GetName] sans l’[perk|El] [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)]"
 apa_pam_mendicant_preachers_conversion_title: "[second.Custom('FR_le_Char_U_Pi')|U][second.GetShortUINameNoTooltip|U] se convertit à la foi [first.GetFaith.GetAdjective]"
 must_be_in_same_county_tt: "Vous devez être dans un [county|El] qu’il détient"
 tenet_communal_identity_name: "Identité commune"
 tenet_communal_identity_desc: "Notre foi et notre culture sont intrinsèquement liées. Cette pratique renforce les liens de notre communauté, même si elle tend à exclure les étrangers."
 doctrine_parameter_same_communal_identity_opinion_active: "#P +10#! d’[opinion|El] avec les personnages de la même [faith|El]"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "Influencer une faction à un [ecumenical_council|El] ne coûte pas de [prestige|El]@prestige_icon!"
 doctrine_parameter_tenet_communal_identity_sway_piety: "#P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#![piety_i] de [piety|El] chaque fois que vous réussissez à [GetScheme('sway').GetActionName|l] quelqu’un de votre [rite|El]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "La [scheme_success_chance|El] d’[GetScheme('learn_language').GetTypeName|l] contre les cibles de votre [rite|El] : #P +20%#![success_chance_i]"
 doctrine_parameter_tenet_communal_identity_language_reward: "Apprendre la [language|El] de quelqu’un de votre [rite|El] procure [piety|El]@piety_icon! et [spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_same_culture_conversion_bonus_active: "Vitesse de conversion des [counties|El] de ma [culture|El] : #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Vitesse de promotion de la culture dans les [counties|El] de ma [faith|El] : #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Vitesse de conversion des [counties|El] d’une autre [culture|El] : #N -50%#!"
 tenet_pentarchy_name: "Ecclésiarchie"
 tenet_pentarchy_alternate_name: "Pentarchie"
 tenet_pentarchy_desc: "Nos lieux saints sont plus que des lieux sacrés — ce sont les sièges mêmes du pouvoir à partir desquels nos chefs religieux gouvernent."
 tenet_aniconism_name: "Aniconisme"
 tenet_aniconism_desc: "Le culte des images gravées a empêché de voir la vérité divine. Nous chasserons toutes les icônes de nos lieux saints afin que nos fidèles ne tombent pas dans ce piège."
 doctrine_parameter_reforging_artifacts_costs_piety: "Les [rulers|El] de ce [rite|El] doivent dépenser de la [piety|El]@piety_icon! pour [reforge|El] ou [repair|El] des [artifacts|El]"
 doctrine_parameter_destroying_artifacts_is_pious: "Les [rulers|El] de ce [rite|El] peuvent détruire des [artifacts|El] pour obtenir de la [piety|El]@piety_icon!"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Peut détruire des [artifacts|El] pour obtenir de la [piety|El]@piety_icon!"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Assiéger des [rulers|El] d’une [faith|El] sans ce [core_tenet|El] détruit plus de [development|El], endommage les [artifacts|El] plus souvent et procure de la [piety|El]@piety_icon!"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! en détruisant des [artifacts|El], et pour des [sieges|El] contre une [faith|El] sans ce [core_tenet|El]"
 pam_aniconism_siege_toast: "De votre [personal_tenet|El] [GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]"
 destroying_artifacts_is_not_pious_tt: "Votre [rite|El] ne permet pas de détruire des [artifacts|El] pour obtenir de la [piety|El]"
 artifact_is_rarer_than_masterwork_tt: "La [rarity|El] de cet [artifact|El] est supérieure à celle d’un chef-d’œuvre"
 tenet_alexandrian_catechism_name: "Catéchisme d’Alexandrie"
 tenet_alexandrian_catechism_desc: "L’école catéchétique d’Alexandrie encourage depuis longtemps les théologiens à réfléchir de manière critique et à remettre en question le statu quo.\n\nMalgré la destruction physique de l’école, nous perpétuons ces traditions."
 tenet_islamic_rationalism_name: "Rationalisme islamique"
 tenet_islamic_rationalism_desc: "Puisque [ROOT.Rite.GetFaith.HighGodNameAlternate] est juste et sage, [ROOT.Rite.GetFaith.HighGodNameSheHe|U] ne peut aller à l’encontre de la raison ou négliger le bien-être de sa création. La raison est notre seul espoir de comprendre notre rôle dans Sa grande œuvre et distinguer le bien du mal."
 doctrine_parameter_scholasticism_is_holy: "Le [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] procure des bonus supplémentaires"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Les enfants éduqués avec l’[education_focus|El] en [learning|El] pourraient atteindre l’âge adulte avec de l’[experience|El] en [learning_lifestyle|El] ; plus souvent quand vous êtes vous-même instruit"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "Vitesse de conversion comtale : #P +25%#!"
 tenet_hedonistic_name: "Hédonisme"
 tenet_hedonistic_desc: "Le divin a rempli ce monde de plaisirs pour que nous puissions nous y livrer. Ne pas y prendre part, c’est rejeter l’œuvre même de la Création."
 doctrine_parameter_piety_from_feasts_active: "Organiser un [GetActivityType('activity_feast').GetName|l] rapporte de la [piety|El]@piety_icon!"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" #Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "Organiser une [GetActivityType('activity_festival').GetName|l] rapporte de la [piety|El]@piety_icon!"
 tenet_carnal_exaltation_name: "Exaltation charnelle"
 tenet_carnal_exaltation_desc: "Les plaisirs de la chair sont sublimes et transcendent les autres expériences terrestres, nous rapprochant du divin. Nous devrions glorifier nos désirs sexuels et chercher des occasions de les réaliser."
 doctrine_parameter_piety_from_seduction_active: "Gain de [piety|El]@piety_icon! des [schemes|El] de [GetScheme('seduce').GetTypeName|l] réussis"
 doctrine_parameter_tenet_carnal_exaltation_clergy_no_continence: "Le [clergy|El] de ce [rite|El] n’est pas censé s’abstenir de relations charnelles"
 doctrine_parameter_tenet_carnal_exaltation_deviancy_virtuous: "Permet à la [faith|El] de choisir la [doctrine|El] [GetDoctrineType('doctrine_deviancy_virtuous').GetBaseName]"
 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "Les [characters|El] avec [GetTrait('lustful').GetName( GetNullCharacter )], [GetTrait('rakish').GetName( GetNullCharacter )] ou [GetTrait('deviant').GetName( GetNullCharacter )] gagnent #P +2#! en [intrigue|El], #P +2#! [diplomacy|El] et #P +25%#! en [fertility|El] par trait"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "Les [characters|El] avec [GetTrait('lustful').GetName( GetNullCharacter )], [GetTrait('rakish').GetName( GetNullCharacter )] ou [GetTrait('deviant').GetName( GetNullCharacter )] achèvent les [schemes|El] de [GetScheme('seduce').GetTypeName|l] #P 20#! jours plus rapidement par trait"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "Vous pouvez créer des artefacts débauchés en utilisant la [decision|El] de [GetDecisionWithKey('commission_artifact_decision').GetName|l]"
 tenet_polyamory_name: "Polyamour"
 tenet_polyamory_desc: "Notre amour mutuel devrait être aussi inconditionnel que l’amour [ROOT.Rite.GetFaith.FertilityGodNamePossessive] pour nous. Nous devons nous débarrasser des notions dépassées selon lesquelles une personne possède l’affection d’une autre."
 doctrine_parameter_no_unfaithfulness_penalty_active: "Les adhérents ne reçoivent pas de pénalités d’[opinion|El] ou des [imprisonment_reasons|El] contre leur conjoint ou les amants de leur conjoint pour avoir des relations extraconjugales"
 doctrine_parameter_tenet_polyamory_romance_seduction_scheme_bonus: "[scheme_success_chance|E] de [GetScheme('courting').GetTypeName|l] et de [GetScheme('seduce').GetTypeName|l] : #P +35%#![success_chance_i]"
 doctrine_parameter_tenet_polyamory_romance_seduction_fulfillment: "Perte de [stress|El] et gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! des [schemes|El] de [GetScheme('courting').GetTypeName|l] et de [GetScheme('seduce').GetTypeName|l]"
 doctrine_parameter_tenet_polyamory_new_beloved: "Gagner un [lover|El] ou une [soulmate|El] procure #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon! en [spiritual_fulfillment|El], #P 20#! de perte de [stress|El], et #V 5#! ans de [GetModifier('tenet_polyamory_new_beloved_modifier').GetNameWithTooltip], au maximum une fois par an"
 tenet_polyamory_new_beloved_toast: "De votre [personal_tenet|El] [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )]"
 doctrine_parameter_tenet_carnal_exaltation_seduction_fulfillment: "Perte de [stress|El] et gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! des [schemes|El] de [GetScheme('seduce').GetTypeName|l]"
 tenet_unrelenting_faith_name: "Foi inébranlable"
 tenet_unrelenting_faith_desc: "Nos convictions sont fortes au point que nous nous battrons volontiers et sommes même prêts à mourir pour notre foi. Peu importe à quel point les chances sont contre nous, nous ne nous rendrons pas."
 tenet_unrelenting_faith_zandik_name: "Juste rébellion"
 tenet_unrelenting_faith_zandik_desc: "Nous ne voulons nul mal à quelque âme que ce soit, ni à quelque chose, mais si nos coutumes sont menacées, nous les défendrons avec une implacable férocité."
 tenet_rite_name: "Rite"
 tenet_rite_desc: "Nos croyances ne sont pas si différentes de celles de notre foi mère... pourquoi devrions-nous ergoter sur des détails alors que nous sommes d’accord sur les grands points de doctrine et, surtout, sur l’autorité ultime d’arbitrage ?"
 doctrine_parameter_maintains_head_of_faith_on_creation: "Les [faiths|El] gardent leur [head_of_faith|El] lors de la création"
 doctrine_parameter_ecumenical_christians_keep_ecumenism: "[GetPlayer.Custom('GetRiteEcumenismFullOrEmpty')]"
 GetRiteEcumenismFullOrEmpty_full: "Les [faiths|El] chrétiennes avec l’[GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName|l] le gardent lors de la création"
 GetRiteEcumenismMiaphysiteFullOrEmpty_full: "Les [faiths|El] chrétiennes avec la [GetDoctrineType('special_doctrine_ecumenical_miaphysite').GetBaseName|l] le gardent lors de la création"
 GetRiteEcumenismFullOrEmpty_empty: ""
 #Muslim Tenets
 tenet_struggle_submission_name: "Lutte et soumission"
 tenet_struggle_submission_desc: "La volonté divine est la source de tout bien, donc une bonne existence repose sur la soumission à cette volonté, exprimée à travers la lutte pour la mettre en œuvre."
 doctrine_parameter_bonus_holy_war_piety_active: "La [piety|El]@piety_icon! et la [piety_experience|El] des [holy_wars|El] victorieuses sont augmentées de #P 50%#!"
 tenet_religious_legal_pronouncements_name: "Loi religieuse"
 tenet_religious_legal_pronouncements_hisbah: "Hisba"
 tenet_religious_legal_pronouncements_fatwa: "Fatwa"
 tenet_religious_legal_pronouncements_halakha: "Halakha"
 tenet_religious_legal_pronouncements_desc: "La frontière entre les arguments théologiques et juridiques est mince et les qualités spirituelles peuvent et doivent être prises en compte dans le monde laïque. Un dirigeant peut chercher la condamnation religieuse pour un [vassal|El] direct adulte de la même [religion|El], mais l’issue dépendra de l’[learning|El] et de la conduite morale de ce vassal."
 doctrine_parameter_temporal_condemnation_enabled: "Les dirigeants peuvent tenter de condamner des [vassals|El] adultes directs partageant la même [religion|El]. Plus un vassal est [Concept('sinful', 'pécheur')|E], moins son dirigeant a besoin d’[learning|El], tandis que la [Concept('virtuous', 'vertu')|E] complique la réussite de cette entreprise."
 doctrine_parameter_temporal_condemnation_criminal: "Une condamnation réussie fait du vassal un [criminal|El] et peut permettre de révoquer ses titres"
 doctrine_parameter_tenet_religious_law_scholar_trait: "Gagne le [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_religious_law_condemnation_bonus: "[success_chance|E] de l’[interaction|El] Condamnation : #P +25#!"
 doctrine_parameter_tenet_religious_law_imprisonment_bonus: "Votre [learning|El] ajoute #P +2#! en acceptation d’[interaction|El] pour chaque point lors d’une tentative d’[imprisonment|El] légale"
 doctrine_parameter_religious_legal_pronouncements_law_cost_reduction: "Coût de la loi : #P -10%#!"
 tenet_religious_legal_pronouncements_cost_tooltip: "Loi religieuse : #P -10%#!"
 tenet_religious_fatwa_cost_tooltip: "Fatwa : #P -10%#!"
 tenet_religious_halakha_cost_tooltip: "Halakha : #P -10%#!"
 tenet_false_conversion_sanction_name: "Fausses conversions acceptées"
 tenet_temporal_condemnation_taqiya: "Taqîya"
 tenet_anusim: "Anoussim"
 tenet_false_conversion_sanction_desc: "Si votre vie est menacée, il est acceptable de confesser une fausse foi aussi longtemps que vous gardez la vérité dans votre cœur."
 doctrine_parameter_sanctioned_false_conversion_county_resistance: "Résistance à la conversion comtale : #P +30%#!"
 doctrine_parameter_sanctioned_false_conversion: "Les [characters|El] et les [counties|El] peuvent parfois retourner à leur [faith|El]"
 doctrine_parameter_tenet_false_conversion_sanction_elusive: "Il est plus difficile de vous [imprison|El] et vous avez beaucoup plus de chances de vous échapper de [prison|El]"
 tenet_tax_nonbelievers_name: "Imposition des incroyants"
 tenet_tax_nonbelievers_desc: "Le service militaire est réservé aux fidèles, tandis qu’un impôt est prélevé sur les incroyants pour leur protection."
 tenet_tax_nonbelievers_jizya_name: "Djizîa"
 tenet_literalism_name: "Littéralisme"
 tenet_literalism_desc: "Nos textes sacrés énoncent clairement l’intention divine et l’interprétation humaine a une valeur limitée."
 doctrine_parameter_literalist_debate_enabled: "Permet de débattre au détriment de l’[opinion|El] avec des seigneurs du pays et de potentiellement gagner ou perdre de la [piety|El]@piety_icon!"
 doctrine_parameter_tenet_literalism_conversion_resistance: "Les [characters|El] de cette [faith|El] sont moins susceptibles d’en être détournés par la conversion"
 doctrine_parameter_literalism_holy_war_cb_active: "Procure un [casus_belli|El] de [holy_war|El] contre les [characters|El] de la même [religion|El] dont le [rite|El] n’a pas ce principe"
 doctrine_parameter_tenet_literalism_debate_experience: "Gagner un débat procure de l’[experience|El] en [learning|El]"
 doctrine_parameter_tenet_literalism_scholar_conversion: "Tant que vous avez le [trait|El] d’[GetTrait('lifestyle_scholar').GetName( GetNullCharacter )|l], [convert_county|El] est plus rapide et les [characters|El] sont plus enclins à se convertir"
 doctrine_parameter_tenet_literalism_scholar_trait: "Obtient le [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
 tenet_legalism_name: "Légalisme"
 tenet_legalism_desc: "Nos lois résultent de nombreuses générations sages et dévotes, et y adhérer est un acte pieux. Un pécheur, peu importe qui, ne sera jamais au-dessus de la loi."
 doctrine_parameter_legalism_reduced_faction_virtues: "Les [vassals|El] et les [counties|El] sont moins susceptibles de rejoindre les [factions|El] contre un dirigeant [Concept( 'virtue', 'vertueux' )|E]"
 doctrine_parameter_legalism_increased_faction_sins: "Les [vassals|El] et les [counties|El] sont plus susceptibles de rejoindre les [factions|El] contre un dirigeant [Concept( 'sin', 'immoral' )|E]"
 doctrine_parameter_tenet_legalism_sinful_revocation: "Révoquer des titres aux [vassals|El] [Concept('sinful', 'pécheurs')|E] n’encourt pas la [tyranny|El]"
 doctrine_parameter_tenet_legalism_title_integration: "Vitesse de progression de la [councillor_task|El] $task_integrate_title$ : #P +100%#!"
 doctrine_parameter_tenet_legalism_lawful_authority: "Vos exigences de révocation de [titles|El], d’[Concept('imprison', 'emprisonnement')|E] ou de [Concept('retract', 'soustraction')|E] de [vassals|El] ont plus de chances d’être acceptées"
 LEGALISM_TITLE_INTEGRATION_BONUS: "$tenet_legalism_name$ : $task_integrate_title$ a une progression doublée"
 LEGALISM_LAWFUL_AUTHORITY_REASON: "$tenet_legalism_name$ : $VALUE|=+$"
 tenet_reincarnation_name: "Réincarnation"
 tenet_reincarnation_desc: "Nous avons vécu de nombreuses vies avant celle-ci et continuerons à vivre après. Chaque mort n’est qu’un recommencement."
 tenet_reincarnation_zoroastrian_name: "Raj’a"
 tenet_reincarnation_zoroastrian_desc: "À l’instar des dieux qui peuvent s’incarner dans des corps humains, nous pouvons nous aussi renaître. Les bons sont récompensés par des formes de beauté et de pureté, et peuvent finalement devenir des anges de pure lumière."
 doctrine_parameter_reincarnation_resistance_to_conversion: "Résistance comtale à la conversion : #P +20%#!"
 doctrine_parameter_reincarnation_events_active: "Les enfants ont une probabilité d’être reconnus comme la réincarnation d’un ancêtre et ainsi d’acquérir le [trait|El] [GetTrait('reincarnation').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_reincarnation_trigger_decision: "Débloque la [decision|El] $tgp_divine_reincarnation_decision$"
 doctrine_parameter_tenet_reincarnation_piety_level_courage: "À partir du [piety_level|El] 3, gain de [GetTrait('brave').GetName( GetNullCharacter )] ou retrait de [GetTrait('craven').GetName( GetNullCharacter )]"
 pam_reincarnation_courage_toast: "$tenet_reincarnation_name$"
 doctrine_parameter_tenet_reincarnation_ancestral_trait_decision: "Débloque la [decision|El] $inherit_ancestral_trait_decision$"
 tenet_esotericism_name: "Ésotérisme"
 tenet_esotericism_kabbalah: "Cabale"
 tenet_esotericism_desc: "Les grands mystères du divin sont peut-être au-delà de la compréhension des mortels, mais ce n’est pas une excuse pour l’ignorance. Leur existence même nous oblige à rechercher la connaissance et la compréhension du monde qui nous entoure."
 doctrine_parameter_tenet_esotericism_mystic_education: "Les enfants avec l’[education_focus|El] d’[learning|El] pourraient atteindre l’âge adulte avec beaucoup d’[experience|El] en [learning_lifestyle|El] s’ils s’en sortent bien dans leurs études."
 doctrine_parameter_tenet_esotericism_eccentric_education: "Les enfants avec l’[education_focus|El] en [learning|El] pourraient devenir [GetTrait('eccentric').GetName( GetNullCharacter )|l]s"
 doctrine_parameter_tenet_esotericism_eccentric_bonuses: "Le [trait|El] [GetTrait('eccentric').GetName( GetNullCharacter )] procure de la [piety|El]@piety_icon! et de l’[opinion|El] supplémentaires, et coûte moins de [stress|El]"
 doctrine_parameter_tenet_esotericism_seek_spiritual_mysteries: "Débloque la [decision|El] $seek_spiritual_mysteries_decision$"
 tenet_esotericism_kabbalah_desc: "Les enseignements de la Cabale permettent aux mortels de comprendre la relation entre le Dieu éternel, la nature de l’infini connue sous le nom de #EMP Ein Sof#! et la création de Dieu. La Cabale constitue la base du mysticisme judaïque et ses adeptes s’engagent souvent dans d’autres écoles juives."
 tenet_religious_kabbalah_cost_tooltip: "Cabale : #P -10%#!"
 #Eastern Tenets
 tenet_adaptive_name: "Adaptabilité"
 tenet_adaptive_desc: "L’adhésion dogmatique aux anciennes restrictions ne nuit qu’aux fidèles. Tant que nous respectons les croyances fondamentales de notre foi, nous pouvons adapter nos lois au monde qui nous entoure."
 doctrine_parameter_tenet_adaptive_conversion_resistance: "Résistance comtale à la conversion : #P +30%#!"
 doctrine_parameter_reduced_vassal_religion_discontent: "Les [vassals|El] infidèles sont moins enclins à rejoindre les [factions|El] d’indépendance et populistes"
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "Coût en [piety|El]@piety_icon! pour une conversion à une autre [faith|El] avec cette [doctrine|El] : #P -50%#!"
 doctrine_parameter_immaterial_harmony_no_holy_orders: "Impossible de créer des [military_holy_orders|El]"
 tenet_inner_journey_name: "Voyage intérieur"
 tenet_inner_journey_desc: "Ce n’est qu’en nous comprenant nous-mêmes que nous pouvons comprendre le monde. Le chemin de la découverte de soi est important ainsi que long et difficile."
 doctrine_parameter_meditation_mechanics_active: "Les personnages peuvent [decide|El] de méditer dans l’isolement, ce qui réduit le [stress|El] et éventuellement acquérir des connaissances théologiques"
 doctrine_parameter_tenet_inner_journey_meditation_bonus: "Bonus de [piety|El]@piety_icon! et d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! pour prendre la [decision|El] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName]"
 doctrine_parameter_tenet_inner_journey_humble_pilgrimage_bonus: "Les [pilgrimages|El] avec l’[activity_option|El] #V $pilgrimage_pomp_humble$#! procurent de la [piety|El]@piety_icon! supplémentaire"
 pam_inner_journey_meditation_toast: "De votre [personal_tenet|El] [GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )]"
 tenet_dharmic_pacifism_name: "Pacifisme dharmique"
 tenet_dharmic_pacifism_desc: "Nous faisons tous partie de l’ordre cosmique. La violence contre quoi que ce soit est la violence contre tout, y compris soi-même."
 tenet_bhakti_name: "Bhakti"
 tenet_bhakti_patron_god_name: "Divinités protectrices"
 tenet_bhakti_desc: "Les mortels ne peuvent pas égaler la gloire du divin, mais en choisissant un seul aspect de la divinité à imiter, adorer et à laquelle se consacrer, nous pouvons nous en approcher plus qu’il n’en serait autrement possible."
 doctrine_parameter_select_personal_god_active: "Les dirigeants peuvent [Concept('decide', 'choisir')|E] un avatar personnel à vénérer, ce qui fournit un bonus"
 doctrine_parameter_select_personal_god_active_personal: "Possibilité de [Concept('decide', 'choisir')|E] un avatar personnel à vénérer, et réduction du coût de remplacement de cet avatar"
 tenet_asceticism_name: "Ascétisme"
 tenet_asceticism_desc: "Le matérialisme nous empêche de voir la vérité divine. Ce n’est qu’en nous consacrant à mener une vie simple et sans luxe que nous pourrons atteindre l’illumination spirituelle."
 doctrine_parameter_tenet_asceticism_inappetetic_trait: "Gagne le [trait|El] [GetTrait('inappetetic').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_asceticism_inappetetic_bonus: "Les [characters|El] [GetTrait('inappetetic').GetName( GetNullCharacter )] gagnent #P +1#! en [diplomacy|El], #P +2#! en [learning|El], #P +10%#! de gain en [spiritual_fulfillment|El]@spiritual_fulfillment_icon! et #P +10%#! de perte de [stress|El]"
 doctrine_parameter_tenet_asceticism_comfort_eater_penalty: "Les [characters|El] [GetTrait('comfort_eater').GetName( GetNullCharacter )] perdent #N 0.1#! de [piety|El]@piety_icon! mensuelle et #N 5#! d’[opinion|El] de même [faith|El]"
 tenet_ritual_hospitality_name: "Hospitalité rituelle"
 tenet_ritual_hospitality_alternate_name: "Pūjā"
 tenet_ritual_hospitality_desc: "L’hospitalité est une des plus grandes vertus dont le genre humain peut faire preuve. Les invités dans nos maisons, qu’ils soient mortels ou divins, devraient toujours être traités avec le plus grand respect."
 doctrine_parameter_host_honored_guests_active: "Les [rulers|El] peuvent accueillir des invités d’honneur en dépensant de la [piety|El]@piety_icon! en échange d’une [opinion|El] améliorée"
 doctrine_parameter_tenet_ritual_hospitality_artifact_theft_risk: "Les [artifacts|El] dans votre [realm|El] sont plus susceptibles d’être volés"
 doctrine_parameter_tenet_ritual_hospitality_court_position_event_discount: "Recruter des [court_positions|El] via des événements de [decision|El] coûte #P 25%#! moins d’[gold|El]@gold_icon!"
 doctrine_parameter_tenet_ritual_hospitality_invite_to_court_acceptance: "Les [characters|El] sont nettement plus susceptibles d’accepter une invitation à votre [court|E]"
 doctrine_parameter_tenet_ritual_hospitality_free_guest_recruitment: "Recruter des invités pour votre Cour est gratuit"
 doctrine_parameter_tenet_ritual_hospitality_feast_toast_friendship: "Trinquer en l’honneur de l’invité d’honneur lors d’un [feast|El] a toujours une chance de nouer une amitié avec lui"
 #Pagan tenets
 tenet_warmonger_name: "Bellicisme"
 tenet_warmonger_desc: "La foi et la guerre vont de pair. Celui qui refuse de se battre au nom du divin ne peut pas être un vrai croyant."
 doctrine_parameter_conquest_cb_enabled: "Les [rulers|El] ont un [casus_belli|El] de conquête contre les dirigeants voisins"
 doctrine_parameter_faith_can_raid: "Permet le [raid|El] de [counties|El] étrangers"
 doctrine_parameter_invasion_cb_enabled: "Les [rulers|El] prestigieux peuvent utiliser un [casus_belli|El] d’invasion une fois dans leur vie"
 doctrine_parameter_great_holy_wars_active_if_reformed: "Si le [head_of_faith|El] existe et que la [faith|El] est [organized|El], il peut déclarer des [great_holy_wars|El]"
 doctrine_parameter_clergy_can_fight_personal: "Possible d’être [commander|El] ou $knight_culture_player|l$ même en étant du [clergy|El] (si le [rite|El] n’a pas le [core_tenet|El] $tenet_pacifism_name$)"
 tenet_ancestor_worship_name: "Culte des ancêtres"
 tenet_ancestor_worship_desc: "Nos ancêtres veillent sur nous depuis l’au-delà et nous indiquent la voie à suivre. Pour cela, nous devons les respecter et les honorer."
 doctrine_parameter_tenet_ancestor_worship_renown_on_death: "Les [rulers|El] de cette [faith|El] accordent la [dynasty_prestige|El] de sa [dynasty|El] en mourant, en fonction de leur [prestige_level|El] et leur [piety_level|El]"
 doctrine_parameter_tenet_ancestor_worship_seek_ancestral_guidance: "Débloque la [decision|El] $seek_ancestral_guidance_decision$"
 tenet_adorcism_name: "Adorcisme"
 tenet_adorcism_desc: "Les esprits de ce monde peuvent faire un grand bien ou un grand mal. En les honorant, nous ne pouvons qu’espérer qu’ils nous feront du bien à nous et du mal à nos ennemis."
 doctrine_parameter_spirit_possession_active: "Permet la [decision|El] $seek_aid_of_the_spirits_decision$"
 doctrine_parameter_tenet_adorcism_curse_enemy: "Vous pouvez utiliser la [decision|El] $pam_curse_enemy_decision$ contre des [rivals|El], des [nemeses|El] et des ennemis dans vos [wars|El]"
 doctrine_parameter_tenet_adorcism_seek_war_aid: "Vous pouvez utiliser la [decision|El] $pam_seek_war_aid_decision$ en étant en [war|El]"
 tenet_ritual_celebrations_name: "Célébrations rituelles"
 tenet_ritual_celebrations_desc: "Le culte du divin se doit d’être partagé avec notre communauté. Organiser de grandes festivités pour honorer et louer le divin nous rassemble tous."
 doctrine_parameter_mandatory_feast_attendance: "Les [vassals|El] sont plus susceptibles d’assister à vos festins et, s’ils refusent de venir, ils perdront de la [piety|El]@piety_icon!"
 tenet_sky_burials_name: "Funérailles célestes"
 tenet_sky_burials_desc: "Les morts ne devraient pas être emprisonnés sous terre — il est bien mieux de leur permettre d’être dévorés par des oiseaux charognards, afin que dans un ultime acte de générosité ils nourrissent le monde qui les a nourri."
 doctrine_parameter_sky_burials_active: "Les [rulers|El] peuvent donner à leurs ancêtres des funérailles célestes et ainsi obtenir de la [piety|El]@piety_icon! et plaire à leurs [vassals|El]"
 doctrine_parameter_sky_burials_charnel_grounds: "Le [duchy_building|El] [GetBuilding('charnel_grounds_01').GetName] peut être construit"
 can_build_towers_of_silence_active_name: "capacité d’utiliser le [duchy_building|El] [GetBuilding('tower_of_silence_01').GetName]"
 doctrine_parameter_can_build_towers_of_silence_active: "Les [vassals|El] peuvent construire le [duchy_building|El] [GetBuilding('tower_of_silence_01').GetName] pour améliorer le zèle du [county|El], à condition que la [faith|El] de leur [liege|El] ne s’engage pas dans les $tenet_sky_burials_name$"
 tenet_sacred_childbirth_name: "Accouchement sacré"
 tenet_sacred_childbirth_alternate_name: "Kūdikis Lemti"
 tenet_sacred_childbirth_desc: "Les bains où les mères donnent naissance doivent être nettoyés et préparés avec les rituels adéquats, afin d’encourager le divin à nous accorder sa bénédiction lors de l’accouchement."
 doctrine_parameter_safer_childbirths_active: "Les mères risquent #P moins#! de mourir durant la grossesse ou l’accouchement"
 doctrine_parameter_healthier_children_active: "Les enfants sont #P moins susceptibles#! d’être malades ou mort-nés"
 doctrine_parameter_piety_from_childbirth_active: "Les mères et les pères gagnent de la [piety|El]@piety_icon! à la naissance de leur enfant"
 doctrine_parameter_free_wet_nurse_court_position: "Débloque le [court_position|El] #V [GetCourtPositionType('wet_nurse_court_position').GetName()|l]#!, qui peut être employé #P gratuitement#!"
 doctrine_parameter_tenet_sacred_childbirth_offer_bedside_support: "Débloque l’[interaction|El] $offer_bedside_support_interaction$"
 doctrine_parameter_tenet_sacred_childbirth_birthing_building_discount: "Les bains publics coûtent #P 25%#! moins d’[gold|El]@gold_icon! à construire"
 tenet_sacred_childbirth_birthing_building_discount_cost_desc: "$tenet_sacred_childbirth_name$"
 piety_from_childbirth_toast: "Accouchement sacré"
 tenet_sanctity_of_nature_name: "Caractère sacré de la Nature"
 tenet_sanctity_of_nature_desc: "Le monde naturel est la création du divin et nous n’y sommes que des invités. Nous devons respecter et honorer chaque arbre, chaque animal et même le sol."
 #This parameter does nothing; it's just here to flag the tenet's nature silently so we can reference it without directly tagging the tenet.
 doctrine_parameter_believes_in_harmony_with_nature_invisible: ""
 doctrine_parameter_tenet_sanctity_of_nature_preserve_wilderness: "Débloque la [decision|El] $preserve_wilderness_decision$, ce qui réduit le [travel_danger|El]@travel_danger_icon! et augmente la [travel_speed|El]@travel_speed_icon! dans des provinces vides"
 doctrine_parameter_tenet_sanctity_of_nature_hike: "A accès à l’[activity|El] [hike|El][hike_i|E]"
 doctrine_parameter_tenet_sanctity_of_nature_wilderness_fulfillment: "Voyager à travers chaque province vide unique procure une petite quantité d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 tenet_mystical_birthright_name: "Naissance de bon augure"
 tenet_mystical_birthright_alternate: "Táltos Születés"
 tenet_mystical_birthright_desc: "Chacun de nous est né avec un destin, dont le plus important est celui des Táltos – ceux qui sont choisis dès la naissance pour exercer des pouvoirs magiques et devenir de grands chefs spirituels."
 doctrine_parameter_mystic_birthright_active: "Les enfants peuvent naître avec le [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] et #V 100#! d’[experience|El] : #V 1%#! de chance (#V 5%#! pour un enfant de joueur), au plus une fois tous les #V 30#! ans, annoncé à toute la [faith|El]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_mild: "Les [characters|El] avec [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )] ou [GetTrait('clubfooted').GetName( GetNullCharacter )] gagnent #P +2#! en [learning|El], #P +5%#! en [toughness|El] des [men_at_arms|El], et #P +10%#! en gain de [legitimacy|El]@legitimacy_icon!"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_severe: "Les [characters|El] avec [GetTrait('dwarf').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )], [GetTrait('albino').GetName( GetNullCharacter )] ou [GetTrait('giant').GetName( GetNullCharacter )] gagnent #P +3#! en [learning|El], #P +10%#! en [toughness|El] des [men_at_arms|El], #P +20%#! en gain de [legitimacy|El]@legitimacy_icon! et #P +10#! en [dread|El]"
 doctrine_parameter_tenet_mystical_birthright_blessed_marks_grave: "Les [characters|El] avec [GetTrait('bleeder').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )] ou [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] gagnent #P +4#! en [learning|El], #P +20%#! en [toughness|El] des [men_at_arms|El], #P +30%#! en gain de [legitimacy|El]@legitimacy_icon!, #P +20#! en [dread|El] et #P +15#! en [opinion|El] du [clergy|El]"
 tenet_astrology_name: "Astrologie"
 tenet_astrology_desc: "Le ciel nocturne est notre fenêtre sur le royaume du divin. Les grands secrets et les mystères du monde y sont écrits, ouverts à tous à condition de savoir où chercher."
 doctrine_parameter_divine_the_stars_active: "Permet aux adeptes de lire dans les astres et ainsi de prédire leur avenir"
 doctrine_parameter_tenet_astrology_divination_bonus: "La [decision|El] [GetDecisionWithKey('divine_the_stars_decision').GetName] procure davantage d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! et dure plus longtemps"
