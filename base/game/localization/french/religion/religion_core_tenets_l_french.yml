 tenet_eastern_syncretism_name: "Syncrétisme $rf_eastern|l$"
 tenet_eastern_syncretism_desc: "Il faut tirer des enseignements de la façon dont les différentes religions dharmiques se tolèrent. Elles ne suivent peut-être pas la vraie foi, mais cela ne les rend pas néfastes pour autant."
 doctrine_parameter_eastern_syncretic_actor_opinion_active: "Bonus d’[opinion|El] mutuel de $VALUE|=+0$ avec les [faiths|El] qui ont le [core_tenet|El] $tenet_eastern_syncretism_name$"
