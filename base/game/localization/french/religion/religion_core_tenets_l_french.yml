 doctrine_parameter_adoptionist_school_removed_on_reformation: "Les nuances subtiles de cette école sont #EMP définitivement#! perdues lors de la [reformation|El]"
 doctrine_parameter_adoptionists_attractively_intuitive_theology: "[EmptyScope.ScriptValue('fp2_lyonese_monk_conversion_bonus_root_value')|=+%0] de vitesse de conversion par rapport aux autres [faiths|El] [GetReligionByKey('christianity_religion').GetAdjective]s"
 tenet_islamic_syncretism_name: "Syncrétisme islamique"
 tenet_islamic_syncretism_desc: "La parole du Prophète est incontestablement sage et juste, et quels que soient nos autres doutes, nous devons tenir compte de ses pensées et de ses actes."
 doctrine_parameter_islamic_syncretic_actor_opinion_active: "Bonus d’[opinion|El] réciproque de $VALUE|=+0$ avec les [faiths|El] qui ont le [core_tenet|El] $tenet_islamic_syncretism_name$"
 doctrine_parameter_islamic_syncretic_recipient_opinion_active: "Bonus d’[opinion|El] réciproque de $VALUE|=+0$ avec les [faiths|El] islamiques et leurs [counties|El]"
 tenet_jewish_syncretism_name: "Syncrétisme juif"
 tenet_jewish_syncretism_desc: "Bien que nous ne soyons pas d’accord avec ses affirmations sur le peuple élu de Dieu, la sagesse de la Torah juive est indéniable, et il y a beaucoup à apprendre de ce texte."
 doctrine_parameter_jewish_syncretic_actor_opinion_active: "Bonus d’[opinion|El] réciproque de $VALUE|=+0$ avec les [faiths|El] qui ont le [core_tenet|El] $tenet_jewish_syncretism_name$"
