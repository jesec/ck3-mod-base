 tenet_sinitic_syncretism_name: "Syncrétisme sinitique"
 tenet_sinitic_syncretism_desc: "Nous pouvons tirer des enseignements des religions sinitiques ancestrales. Au fil des millénaires, elles ont inspiré un mode de vie vertueux."
 doctrine_parameter_sinitic_syncretic_actor_opinion_active: "Bonus d’[opinion|El] mutuel de $VALUE|=+0$ avec les [faiths|El] qui ont le [core_tenet|El] $tenet_sinitic_syncretism_name$"
 doctrine_parameter_sinitic_syncretic_recipient_opinion_active: "Bonus d’[opinion|El] mutuel de $VALUE|=+0$ avec les [faiths|El] sinitiques et leurs [counties|El]"
 tenet_unreformed_syncretism_name: "Traditions populaires syncrétiques"
 tenet_unreformed_syncretism_desc: "Qui sommes-nous pour dire aux autres que leurs traditions sont fausses ? Ce n’est pas à nous de leur faire la leçon sur des coutumes qu’ils ont pratiquées pendant des siècles : nous devrions plutôt apprendre d’eux."
 doctrine_parameter_unreformed_syncretic_actor_opinion_active: "Bonus d’[opinion|El] réciproque de $VALUE|=+0$ avec les [faiths|El] qui ont le [core_tenet|El] $tenet_unreformed_syncretism_name$"
