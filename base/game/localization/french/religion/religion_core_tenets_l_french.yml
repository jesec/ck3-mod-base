 tenet_sacred_shadows_name: "Mensonges sacrés"
 tenet_sacred_shadows_desc: "Le mensonge est l’art le plus profond qui existe. Ceux qui peuvent convaincre les autres de leurs mensonges sont saints. Ceux qui parviennent à se mentir sont inarrêtables."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Les adeptes gagnent de la piété pour avoir réussi des [schemes|El] d’[intrigue|El]"
 doctrine_parameter_adherents_more_likely_to_join_schemes: "Les adeptes sont plus disposés à devenir des agents des [schemes|El] d’autres personnages"
 doctrine_parameter_tenet_sacred_shadows_fabricate_hook: "Peut utiliser le [scheme|El] visant à [GetScheme('fabricate_hook').GetActionName|l]"
 doctrine_parameter_tenet_sacred_shadows_intrigue_scheme_fulfillment: "Gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! en raison de la réussite de [schemes|El] d’[intrigue|El]"
 tenet_pursuit_of_power_name: "Quête du pouvoir"
 tenet_pursuit_of_power_desc: "Ce qui est juste et ce qui ne l’est pas est transitoire, car définit par ceux qui détiennent le pouvoir. Cela implique que la recherche du pouvoir est la seule cause véritablement juste."
 doctrine_parameter_tenet_pursuit_of_power_war_victory_fulfillment: "Gagner des guerres procure de l’[spiritual_fulfillment|El]@spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_pursuit_of_power_become_conqueror: "Débloque la [decision|El] $pursue_conquerors_mantle_decision$"
 tenet_pastoral_isolation_name: "Isolement pastoral"
 tenet_pastoral_isolation_desc: "Tout ce que nous voulons, c’est rester seuls. Nos pratiques sont les nôtres et celles des autres ne nous concernent pas davantage."
 doctrine_parameter_unattractive_for_character_conversions: "Les [characters|El] de cette [faith|El] sont plus disposés à se convertir"
 tenet_natural_primitivism_name: "Primitivisme naturel"
 tenet_natural_primitivism_desc: "La civilisation est une tentative artificielle, futile et blasphématoire de l’homme visant à imposer un ordre à une création par nature chaotique. Nous renonçons aux atours, aux rangs, aux lois et à la vanité courtoise pour vivre tel que voulu par [ROOT.Rite.GetFaith.PantheonTerm] : à l’état sauvage, simplement et librement."
 doctrine_parameter_naked_adherents_active: "Les adeptes ne portent pas de vêtements"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Coût des lois : #N +50%#!"
 doctrine_parameter_tenet_natural_primitivism_promote_naturism_decision: "Débloque la [decision|El] #V $promote_naturism_decision$#!"
 doctrine_parameter_unlock_jizya_contract: "Déverrouille le [vassal_contract|El] et le [tax_decree|El] de djizîa"
 #FP3 tenets
 tenet_communal_possessions_name: "Possessions communes"
 tenet_communal_possessions_desc: "La volonté [ROOT.Rite.GetFaith.HighGodNamePossessive] est que nous recevions tous une part égale des richesses de ce monde. Nous devrions tout détenir en commun et redistribuer ce que les puissants ont volé."
 doctrine_parameter_piety_from_gifts_active: "Gain de [piety|El]@piety_icon! en envoyant des [gifts|El] et en offrant des [artifacts|El]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Les dirigeants gagnent en [piety|El]@piety_icon! lorsqu’ils épousent des [characters|El] [Concept('lowborn','roturiers')|E], et ce, sans perdre de [legitimacy|El]@legitimacy_icon!"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "Débloque la [decision|El] $redistribute_realm_wealth_decision$"
 tenet_sacrificial_ceremonies_name: "Cérémonies sacrificielles"
 tenet_sacrificial_ceremonies_desc: "Les sacrifices humains, volontaires ou involontaires, nous rapprochent du divin. Il est coutumier et vertueux de se porter volontaire pour se sacrifier lors d’une cérémonie, tout comme il est vertueux de sacrifier ceux qui ont commis des crimes impardonnables contre les Dieux."
 tenet_megaliths_name: "Constructions mégalithiques"
 tenet_megaliths_desc: "Le culte ne doit pas se faire uniquement dans l’enceinte de temples, car ce sont des constructions primitives de l’homme qui le détournent des créations divines qui nous entourent tous. Nous embrassons la pierre et le grand air, et agençons les pierres que le créateur nous a données d’une manière qui lui plaît et nous rapproche de la divinité."
 doctrine_parameter_can_build_megaliths: "Permet la construction de mégalithes dans les propriétés de type [temple|El] et les grands mégalithes dans les capitales ducales."
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "Double de points d’expérience pour la visite de [points_of_interest|El] qui sont des [buildings|El]"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "Gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! lors de l’achèvement d’une construction dans des [GetTerrain( 'hills' ).GetName|l], des [GetTerrain( 'terraced_hills' ).GetName|l], des [GetTerrain( 'mountains' ).GetName|l] ou des [GetTerrain( 'desert_mountains' ).GetName|l]"
 pam_megaliths_rough_terrain_construction_toast: "De votre principe personnel des [GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )|l]"
 province_is_of_a_megalith_faith_tt: "Ce [county|El] doit suivre une [faith|El] qui croit en l’importance des mégalithes."
 tenet_fp3_fedayeen_name: "Fedayin"
 tenet_fp3_sacred_murder_name: "Meurtre sacré"
 tenet_fp3_fedayeen_desc: "Quand nous n’arrivons pas à nos fins par la guerre ouverte, nous devons [ROOT.Rite.GetFaith.HighGodName2] de détruire Ses ennemis par l’infiltration et la tromperie. Nous ne devons craindre ni la mort ni la douleur, et nous réjouir de donner notre vie pour la plus grande des causes."
 doctrine_parameter_master_assassin_court_position_unlocked: "Débloque le [court_position|El] #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()]#!"
 master_assassin_court_position_unlocked_name: "$tenet_fp3_fedayeen_name$"
 doctrine_parameter_death_is_glory: "Probabilité de mourir ou d’être blessé à la [battle|El] : #N +10%#!"
 doctrine_parameter_sanctioned_assassinations: "Aucune perte de [piety|El] pour le meurtre de personnages d’une [faith|El] différente, grâce aux [schemes|El] visant à [GetScheme('murder').GetActionName|l]"
 doctrine_parameter_tenet_fp3_fedayeen_other_faith_kill_fulfillment: "Gain d’[spiritual_fulfillment|El]@spiritual_fulfillment_icon! pour le meurtre de [characters|El] d’une autre [faith|El]"
 #EP3 Tenets
 tenet_household_gods_name: "Dieux du logis"
 tenet_household_gods_desc: "Nous vénérons les #EMP lares#! et les #EMP génies#! qui veillent sur nos demeures. Par-dessus tout, nous honorons notre glorieux empereur qui est chargé de protéger tout le pays."
 #BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ pour les [temple_holdings|El]"
 #TGP
 immaterial_harmony_name: "Harmonie immatérielle"
 special_doctrine_immaterial_harmony_name: "Harmonie immatérielle"
 special_doctrine_immaterial_harmony_desc: "Il n’y a pas de contradiction entre nos traditions et les enseignements de Bouddha ou des sages. On peut suivre l’un d’entre eux (ou même tous) sans que cela pose de problèmes spirituels."
 tenet_extinction_of_dharma_name: "Extinction du dharma"
 tenet_extinction_of_dharma_desc: "Les démons parcourent la terre sous l’apparence de personnes pieuses ; celui qui en tue un fera un pas vers la bouddhéité, celui qui en tue dix fera dix pas vers la bouddhéité."
 tenet_cranial_trophies_name: "Trophées crâniens"
 tenet_cranial_trophies_desc: "La tête contient la quintessence de son propriétaire. Si nous la coupons et en extrayons son contenu, nous pouvons revendiquer pour nous-mêmes sa puissante énergie spirituelle."
 doctrine_parameter_killing_bestows_heads: "Il est possible de gagner un [Concept('artifact', 'trophée crânien')|E] en [Concept('executing', 'exécutant')|E] un autre personnage ou en le tuant dans un [single_combat_duel|El] ou une [battle|El]"
