 tenet_divination_name: "Divination"
 tenet_divination_desc: "Le sort des mortels et le futur du monde est écrit dans les étoiles et dans des signes cachés. Grâce à des rites, des rêves et des présages, un pratiquant expert peut deviner ces secrets, grâce aux esprits de l’au-delà."
 tenet_sun_worship_name: "Adoration du soleil"
 tenet_sun_worship_desc: "Le Porteur de lumière, le Donneur de vie, la Flamme éternelle — le Soleil règne haut dans le ciel en tant que véritable souverain du monde."
