 doctrine_parameter_opinion_of_unreformed_syncretic_actor_opinion_active: ""
 doctrine_parameter_unreformed_syncretic_conversion_malus_active: "La vitesse de base de conversion des fois syncrétiques est réduite de #P [EmptyScope.ScriptValue('conversion_syncretic_with_religion_malus_efficancy_procentage')|-0%]#!"
 doctrine_parameter_tenet_syncretism_invite_religious_exiles: "Peut utiliser la [decision|El] [GetDecisionWithKey('pam_invite_syncretic_exiles_decision').GetName] pour les [faiths|El] de la [religion|El] syncrétique"
