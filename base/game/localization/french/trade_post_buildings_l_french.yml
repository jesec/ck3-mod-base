 ##### Trade Post District #####
 trade_post_location_district: "Quartier du comptoir"
 trade_post_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E][trade_goods_i]\n$BULLET_WITH_TAB$[trade_market|E]@trade_market_icon!\n$BULLET_WITH_TAB$[gold|E][gold_i]\n$BULLET_WITH_TAB$[alliance|E][alliance_i]\n\n#low Déverrouille#!\n$BULLET_WITH_TAB$Permet à des [trade_routes|El]@trade_route_icon! de partir depuis ce [trade_market|El]@trade_market_icon!"
 trade_post_location_district_desc_flavor: "Un vaste comptoir commercial servant de lieu d’échange de marchandises et de services aux républiques et aux riches patriciens."
 # Trade Office #
 building_type_pb_trade_office_01: "Bureau commercial"
 building_type_pb_trade_office_01_desc: "Les commis de ce bureau commercial enregistrent chaque cargaison, scellent tous les contrats et envoient des rapports pour chaque navire."
 pb_trade_office_01: "$building_type_pb_trade_office_01$"
 pb_trade_office_02: "$building_type_pb_trade_office_01$ II"
 pb_trade_office_03: "$building_type_pb_trade_office_01$ III"
 pb_trade_office_04: "$building_type_pb_trade_office_01$ IV"
 # Counting House #
 building_type_trade_counting_house_01: "Maison de comptage"
 building_type_trade_counting_house_01_desc: "Les commis de cette maison de comptage gardent une trace de la moindre pièce gagnée, due ou attendue par ce comptoir commercial."
 trade_counting_house_01: "$building_type_trade_counting_house_01$"
 trade_counting_house_02: "$building_type_trade_counting_house_01$ II"
 trade_counting_house_03: "$building_type_trade_counting_house_01$ III"
 trade_counting_house_04: "$building_type_trade_counting_house_01$ IV"
 trade_counting_house_05: "$building_type_trade_counting_house_01$ V"
 # Treasury #
 building_type_trade_treasury_01: "Bureau du trésorier"
 building_type_trade_treasury_01_desc: "Des pièces venues d’une dizaine de pays arrivent sur le bureau du trésorier, où chacune est pesée et évaluée. Le trésorier peut repérer une fausse pièce à son tintement."
 trade_treasury_01: "$building_type_trade_treasury_01$"
 trade_treasury_02: "$building_type_trade_treasury_01$ II"
 trade_treasury_03: "$building_type_trade_treasury_01$ III"
 trade_treasury_04: "$building_type_trade_treasury_01$ IV"
 trade_treasury_05: "$building_type_trade_treasury_01$ V"
 # Recruitment Office #
 building_type_trade_recruitment_office_01: "Bureau de recrutement"
 building_type_trade_recruitment_office_01_desc: "Des soldats, des marins et des gardes viennent s’inscrire dans ce bureau de recrutement pour travailler au comptoir pendant une saison ou un an."
 trade_recruitment_office_01: "$building_type_trade_recruitment_office_01$"
 trade_recruitment_office_02: "$building_type_trade_recruitment_office_01$ II"
 trade_recruitment_office_03: "$building_type_trade_recruitment_office_01$ III"
 trade_recruitment_office_04: "$building_type_trade_recruitment_office_01$ IV"
 trade_recruitment_office_05: "$building_type_trade_recruitment_office_01$ V"
 # Office of Foreign Stipendiaries #
 building_type_trade_mercenary_office_01: "Bureau des boursiers étrangers"
 building_type_trade_mercenary_office_01_desc: "Des capitaines de compagnies mercenaires viennent à ce bureau pour négocier les salaires, les conditions et le partage du butin. Chaque clause est scrupuleusement notée, car la méfiance est générale."
 trade_mercenary_office_01: "$building_type_trade_mercenary_office_01$"
 trade_mercenary_office_02: "$building_type_trade_mercenary_office_01$ II"
 trade_mercenary_office_03: "$building_type_trade_mercenary_office_01$ III"
 trade_mercenary_office_04: "$building_type_trade_mercenary_office_01$ IV"
 trade_mercenary_office_05: "$building_type_trade_mercenary_office_01$ V"
 # Watchtower #
 building_type_trade_watchtower_01: "Tour de guet"
 building_type_trade_watchtower_01_desc: "Du sommet de cette tour de guet, les gardes peuvent voir à des lieues. Ils surveillent surtout les portes des entrepôts."
 trade_watchtower_01: "$building_type_trade_watchtower_01$"
 trade_watchtower_02: "$building_type_trade_watchtower_01$ II"
 trade_watchtower_03: "$building_type_trade_watchtower_01$ III"
 trade_watchtower_04: "$building_type_trade_watchtower_01$ IV"
 trade_watchtower_05: "$building_type_trade_watchtower_01$ V"
 # Shipyard #
 building_type_trade_shipyard_01: "Chantier naval"
 building_type_trade_shipyard_01_desc: "Les charpentiers de ce chantier réparent les navires endommagés avec ce qu’ils trouvent au marché du coin. Il n’y aura donc pas deux réparations identiques."
 trade_shipyard_01: "$building_type_trade_shipyard_01$"
 trade_shipyard_02: "$building_type_trade_shipyard_01$ II"
 trade_shipyard_03: "$building_type_trade_shipyard_01$ III"
 trade_shipyard_04: "$building_type_trade_shipyard_01$ IV"
 trade_shipyard_05: "$building_type_trade_shipyard_01$ V"
 # Merchant Guesthouse #
 building_type_trade_lodgings_01: "Maison d’hôtes marchande"
 building_type_trade_lodgings_01_desc: "Cette maison d’hôtes offre aux marchands de passage des draps propres, un coffre fermant à clé et un repas chaud. Les amis de la compagnie paient le juste prix, les autres paient le double."
 trade_lodgings_01: "$building_type_trade_lodgings_01$"
 trade_lodgings_02: "$building_type_trade_lodgings_01$ II"
 trade_lodgings_03: "$building_type_trade_lodgings_01$ III"
 trade_lodgings_04: "$building_type_trade_lodgings_01$ IV"
 trade_lodgings_05: "$building_type_trade_lodgings_01$ V"
 # Warehouse #
 building_type_trade_warehouse_01: "Entrepôt"
 building_type_trade_warehouse_01_desc: "Chaque caisse de cet entrepôt est marquée du symbole de son propriétaire et rien ne peut franchir les portes sans le sceau du maître de ces lieux."
 trade_warehouse_01: "$building_type_trade_warehouse_01$"
 trade_warehouse_02: "$building_type_trade_warehouse_01$ II"
 trade_warehouse_03: "$building_type_trade_warehouse_01$ III"
 trade_warehouse_04: "$building_type_trade_warehouse_01$ IV"
 trade_warehouse_05: "$building_type_trade_warehouse_01$ V"
 # Secure Storeroom #
 building_type_trade_secure_storeroom_01: "Cellules de stockage"
 building_type_trade_secure_storeroom_01_desc: "Les cellules de stockage renferment les biens les plus précieux du comptoir, et leurs gardes sont chèrement payés pour éloigner les voleurs. Ils reçoivent même une prime pour ne pas se montrer trop curieux."
 trade_secure_storeroom_01: "$building_type_trade_secure_storeroom_01$"
 trade_secure_storeroom_02: "$building_type_trade_secure_storeroom_01$ II"
 trade_secure_storeroom_03: "$building_type_trade_secure_storeroom_01$ III"
 trade_secure_storeroom_04: "$building_type_trade_secure_storeroom_01$ IV"
 trade_secure_storeroom_05: "$building_type_trade_secure_storeroom_01$ V"
 # Granary #
 building_type_trade_granary_01: "Silos à grains"
 building_type_trade_granary_01_desc: "Les grains sont achetés à bas coût après une bonne récolte et stockés dans ces silos jusqu’à la prochaine flambée des prix qui finit toujours par arriver, tôt ou tard."
 trade_granary_01: "$building_type_trade_granary_01$"
 trade_granary_02: "$building_type_trade_granary_01$ II"
 trade_granary_03: "$building_type_trade_granary_01$ III"
 trade_granary_04: "$building_type_trade_granary_01$ IV"
 trade_granary_05: "$building_type_trade_granary_01$ V"
 # Cellar #
 building_type_trade_cellar_01: "Cave"
 building_type_trade_cellar_01_desc: "Le vin du foyer est conservé dans cette cave aux côtés de la boisson locale, un réconfort pour les marchands ayant le mal du pays et un luxe pour tous les autres."
 trade_cellar_01: "$building_type_trade_cellar_01$"
 trade_cellar_02: "$building_type_trade_cellar_01$ II"
 trade_cellar_03: "$building_type_trade_cellar_01$ III"
 trade_cellar_04: "$building_type_trade_cellar_01$ IV"
 trade_cellar_05: "$building_type_trade_cellar_01$ V"
 # Food Depot #
 building_type_trade_food_depot_01: "Salle de conservation"
 building_type_trade_food_depot_01_desc: "Viande salée, fromage, huile et miel sont gardés dans cette salle de conservation, prêts pour un long voyage ou pour la saison maigre."
 trade_food_depot_01: "$building_type_trade_food_depot_01$"
 trade_food_depot_02: "$building_type_trade_food_depot_01$ II"
 trade_food_depot_03: "$building_type_trade_food_depot_01$ III"
 trade_food_depot_04: "$building_type_trade_food_depot_01$ IV"
 trade_food_depot_05: "$building_type_trade_food_depot_01$ V"
 # Cloth Hall #
 building_type_trade_cloth_hall_01: "Halle de tissage"
 building_type_trade_cloth_hall_01_desc: "Des rouleaux de laine, de lin et de soie sont achetés, inspectés et conservés dans cette halle de tissage avant d’être envoyés à l’étranger."
 trade_cloth_hall_01: "$building_type_trade_cloth_hall_01$"
 trade_cloth_hall_02: "$building_type_trade_cloth_hall_01$ II"
 trade_cloth_hall_03: "$building_type_trade_cloth_hall_01$ III"
 trade_cloth_hall_04: "$building_type_trade_cloth_hall_01$ IV"
 trade_cloth_hall_05: "$building_type_trade_cloth_hall_01$ V"
 # Tanners' Stables #
 building_type_trade_tanners_stables_01: "Écuries des tanneurs"
 building_type_trade_tanners_stables_01_desc: "Les acheteurs venus dans ces écuries inspectent les dents des chevaux pour connaître leur âge avant de conclure une affaire, car la parole d’un vendeur n’a que peu de valeur."
 trade_tanners_stables_01: "$building_type_trade_tanners_stables_01$"
 trade_tanners_stables_02: "$building_type_trade_tanners_stables_01$ II"
 trade_tanners_stables_03: "$building_type_trade_tanners_stables_01$ III"
 trade_tanners_stables_04: "$building_type_trade_tanners_stables_01$ IV"
 trade_tanners_stables_05: "$building_type_trade_tanners_stables_01$ V"
 # Blacksmith Quarter #
 building_type_trade_blacksmith_quarter_01: "Cour de la forge"
 building_type_trade_blacksmith_quarter_01_desc: "C’est la pureté d’un métal qui détermine sa valeur, c’est pourquoi chaque lingot qui entre dans cette cour est pesé, testé et estampillé."
 trade_blacksmith_quarter_01: "$building_type_trade_blacksmith_quarter_01$"
 trade_blacksmith_quarter_02: "$building_type_trade_blacksmith_quarter_01$ II"
 trade_blacksmith_quarter_03: "$building_type_trade_blacksmith_quarter_01$ III"
 trade_blacksmith_quarter_04: "$building_type_trade_blacksmith_quarter_01$ IV"
 trade_blacksmith_quarter_05: "$building_type_trade_blacksmith_quarter_01$ V"
 # Gem Exchange #
 building_type_trade_gem_exchange_01: "Échange de pierres précieuses"
 building_type_trade_gem_exchange_01_desc: "Les experts dans cette salle d’échange jugent les pierres à la mi-journée, face à des fenêtres éloignées du soleil, là où la lumière est la plus stable."
 trade_gem_exchange_01: "$building_type_trade_gem_exchange_01$"
 trade_gem_exchange_02: "$building_type_trade_gem_exchange_01$ II"
 trade_gem_exchange_03: "$building_type_trade_gem_exchange_01$ III"
 trade_gem_exchange_04: "$building_type_trade_gem_exchange_01$ IV"
 trade_gem_exchange_05: "$building_type_trade_gem_exchange_01$ V"
 # Apothecary Guild #
 building_type_trade_apothecary_guild_01: "Guilde des apothicaires"
 building_type_trade_apothecary_guild_01_desc: "Les membres de cette guilde classent les épices, les encens et les remèdes qui transitent par ce comptoir selon leur parfum, leur goût et leur densité."
 trade_apothecary_guild_01: "$building_type_trade_apothecary_guild_01$"
