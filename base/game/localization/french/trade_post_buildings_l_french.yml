 trade_apothecary_guild_05: "$building_type_trade_apothecary_guild_01$ V"
 # Consulate #
 building_type_trade_consulate_01: "Consulat"
 building_type_trade_consulate_01_desc: "Les marchands de ce consulat choisissent leur propre consul, qui jugera leurs différends selon les lois de leur pays d’origine, plutôt que les lois nationales."
 trade_consulate_01: "$building_type_trade_consulate_01$"
