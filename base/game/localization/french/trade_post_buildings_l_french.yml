 building_type_trade_league_treasury_01: "Trésor de la ligue"
 building_type_trade_league_treasury_01_desc: "Chaque cité de la ligue conserve une clé du trésor, et le coffre ne peut être ouvert qu’en présence de toutes les clés."
 trade_league_treasury_01: "$building_type_trade_league_treasury_01$"
