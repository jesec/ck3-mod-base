 trade_consulate_03: "$building_type_trade_consulate_01$ III"
 trade_consulate_04: "$building_type_trade_consulate_01$ IV"
 trade_consulate_05: "$building_type_trade_consulate_01$ V"
 # League Arsenal #
 building_type_trade_league_arsenal_01: "Arsenal"
 building_type_trade_league_arsenal_01_desc: "Cet arsenal renferme des milliers d’armes, soit assez pour armer un navire ou une garnison pour une journée."
 trade_league_arsenal_01: "$building_type_trade_league_arsenal_01$"
 trade_league_arsenal_02: "$building_type_trade_league_arsenal_01$ II"
 trade_league_arsenal_03: "$building_type_trade_league_arsenal_01$ III"
