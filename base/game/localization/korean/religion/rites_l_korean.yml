l_korean:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "[Rite.GetNameNoTooltip](은)는 [GetCurrentDate.GetStringLong]에 [Character.GetCurrentLocation.GetTitle.GetAdjective]에서 [Character.GetFullName]에 의해 [Faith.GetAdjective] 신앙의 한 교파로 창시되었습니다. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "[Rite.GetNameNoTooltip](은)는 [GetCurrentDate.GetStringLong]에 [Character.GetFullName]에 의해 [Faith.GetAdjective] 신앙의 한 교파로 창시되었습니다. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "이 교파는 상위 신앙 안에서 고유한 신앙적 특색을 유지합니다."
 generic_rite_focus_tenet_aniconism: "이 교파는 성상을 배척하며, 부재와 절제, 그리고 형상화되지 않은 신성의 거룩함을 통해 경외를 추구합니다."
 generic_rite_focus_tenet_alexandrian_catechism: "이 교파는 학문적 가르침과 정교한 교리, 그리고 신자들에 대한 인내심 있는 교육을 중시합니다."
 generic_rite_focus_tenet_armed_pilgrimages: "이 교파는 성전과 무장 순례를 독실한 신자들의 신성한 의무로 여깁니다."
 generic_rite_focus_tenet_carnal_exaltation: "이 교파는 욕망과 육체적 쾌락을 신성의 손길이 닿은 선물로 존중합니다."
 generic_rite_focus_tenet_communal_identity: "이 교파는 공동의 관습과 삶, 그리고 보호받는 공동체 정체성과 예배를 긴밀히 결부시킵니다."
 generic_rite_focus_tenet_communion: "이 교파는 공동의 신앙심과 자선, 그리고 영적 지도자와의 친교를 통해 결속됩니다."
 generic_rite_focus_tenet_consolamentum: "이 교파는 금욕과 죽음을 두려움 없이 준비함으로써 최후의 정화를 추구합니다."
 generic_rite_focus_tenet_divine_marriage: "이 교파는 결합과 통치를 모두 신성시하며, 성스러운 혼인을 신적 질서의 반영으로 여깁니다."
 generic_rite_focus_tenet_gnosticism: "이 교파는 세상의 장막 너머에 숨겨진 진리를 탐구하며, 성스러운 지식에서 구원을 찾습니다."
 generic_rite_focus_tenet_mendicant_preachers: "이 교파는 유랑 설교자들의 전도와 겸손한 증언, 그리고 끊임없는 가르침을 통해 신앙을 전파합니다."
 generic_rite_focus_tenet_pacifism: "이 교파는 절제와 평화를 중시하며, 불필요한 유혈을 영혼의 중대한 타락으로 여깁니다."
 generic_rite_focus_tenet_pentarchy: "이 교파는 유서 깊은 권위의 중심지들과 더 넓은 신앙 공동체에 대한 질서 있는 관리를 중시합니다."
 generic_rite_focus_tenet_unrelenting_faith: "이 교파는 흔들림 없는 열의와 강인한 의지, 그리고 성스러운 것을 위해 기꺼이 싸우려는 자세를 찬양합니다."
 generic_rite_focus_tenet_vows_of_poverty: "이 교파는 거룩한 청빈을 존중하며, 신자들에게 과도한 소유를 버리고 검소하게 살 것을 권합니다."
 generic_rite_focus_tenet_pastoral_isolation: "이 교파는 보호된 신앙 공동체를 지향하며, 세상과 타협하기보다는 거리를 두는 편을 택합니다."
 generic_rite_focus_tenet_rite: "이 교파는 전례와 성직 체계, 그리고 성스러운 전통의 보존을 매우 중시합니다."
 generic_rite_focus_tenet_adaptive: "이 교파는 본질을 잃지 않은 채 유연하게 변화에 적응하며, 신앙의 근본을 지키면서도 지역 관습을 받아들입니다."
 generic_rite_focus_tenet_esotericism: "이 교파는 숨겨진 지혜와 입문 의식, 그리고 준비된 자에게만 드러나는 진리를 소중히 여깁니다."
 generic_rite_focus_tenet_legalism: "이 교파는 명확한 율법과 올바른 판단, 그리고 절도 있는 삶의 질서 속에서 거룩함의 토대를 찾습니다."
 generic_rite_focus_tenet_literalism: "이 교파는 성스러운 가르침을 문자 그대로 따르며, 자의적인 해석과 관습적으로 굳어진 타협을 불신합니다."
 generic_rite_focus_tenet_reincarnation: "이 교파는 영혼의 여정을 순환하는 과정으로 보며, 한 생이 다음 생을 결정한다고 믿습니다."
 generic_rite_focus_tenet_religious_legal_pronouncements: "이 교파는 성스러운 율법과 공식적인 종교적 판결에 지속적인 영적 권위를 부여합니다."
 generic_rite_focus_tenet_struggle_submission: "이 교파는 투쟁과 정복, 그리고 불경한 자들을 굴복시킴으로써 신앙이 증명된다고 가르칩니다."
 generic_rite_focus_tenet_false_conversion_sanction: "이 교파는 생존이나 실리를 위해 필요하다면, 내면의 신앙을 감춘 채 겉으로만 순응하는 것을 용인합니다."
 generic_rite_focus_tenet_tax_nonbelievers: "이 교파는 불신앙을 조공의 의무를 지는 상태로 규정하며, 세속적 공납을 통해 신성한 위계를 강화합니다."
 generic_rite_focus_tenet_asceticism: "이 교파는 금욕과 절제, 그리고 욕망을 끈기 있게 다스림으로써 거룩함을 추구합니다."
 generic_rite_focus_tenet_bhakti: "이 교파는 진심 어린 헌신을 중심에 두며, 사랑으로 자신을 맡기는 것이 영혼을 신성에 가장 가깝게 이끈다고 가르칩니다."
 generic_rite_focus_tenet_dharmic_pacifism: "이 교파는 비폭력과 자기 절제를 중시하며, 분노보다 평화를 더 고귀한 수행으로 여깁니다."
 generic_rite_focus_tenet_inner_journey: "이 교파는 내면을 향해 나아가며, 성찰과 수양, 그리고 자기 변화를 통해 깨달음을 추구합니다."
 generic_rite_focus_tenet_ritual_hospitality: "이 교파는 환대를 신성한 의무로 여기며, 주인과 손님을 성스러운 관습 아래 하나로 묶습니다."
 generic_rite_focus_tenet_adorcism: "이 교파는 정령들에게 경의를 표하며, 그들의 은총을 얻고 노여움을 피하고자 합니다."
 generic_rite_focus_tenet_ancestor_worship: "이 교파는 존경받는 조상들에게서 인도와 축복을 구하며, 산 자와 죽은 자의 이어짐을 중시합니다."
 generic_rite_focus_tenet_astrology: "이 교파는 하늘에서 징조를 읽어 내며, 별들이 질서와 운명, 그리고 때를 드러낸다고 믿습니다."
 generic_rite_focus_tenet_hedonistic: "이 교파는 공동 예배 속에서 향연과 풍요, 그리고 쾌락의 신성화를 받아들입니다."
 generic_rite_focus_tenet_human_sacrifice: "이 교파는 피의 제물을 필멸자와 신성 사이에 맺는 두렵지만 성스러운 계약으로 여깁니다."
 generic_rite_focus_tenet_mystical_birthright: "이 교파는 운명이 태어날 때부터 특정한 영혼들을 신성한 권능과 위대한 영적 사명을 위해 점지한다고 믿습니다."
 generic_rite_focus_tenet_ritual_celebrations: "이 교파는 공동체의 향연과 성스러운 축제를 예배의 가장 완전한 표현으로 찬미합니다."
 generic_rite_focus_tenet_sacred_childbirth: "이 교파는 출산을 경건하게 받들며, 모성과 새로운 생명을 지극히 성스러운 의미를 지닌 것으로 여깁니다."
 generic_rite_focus_tenet_sanctity_of_nature: "이 교파는 살아 있는 세계에서 신성을 발견하며, 성장과 풍요, 그리고 길들여지지 않은 자연을 숭배합니다."
 generic_rite_focus_tenet_sun_worship: "이 교파는 태양을 생명을 베푸는 존재이자 질서와 광휘, 그리고 신의 은총을 상징하는 징표로 받듭니다."
 generic_rite_focus_tenet_warmonger: "이 교파는 정복과 무인의 기상을 찬양하며, 신자들이 전쟁을 통해 자신을 증명할 것을 요구합니다."
 generic_rite_focus_tenet_gruesome_festivals: "이 교파는 섬뜩한 축제를 받아들이며, 공포와 피, 그리고 장관을 성스러운 의식으로 승화시킵니다."
 generic_rite_focus_tenet_cthonic_redoubts: "이 교파는 높은 산봉우리와 깊숙이 숨겨진 천연 요새들을 각별히 신성한 장소로 숭배합니다."
 generic_rite_focus_tenet_household_gods: "이 교파는 가정을 중심에 두며, 화덕과 가족, 그리고 일상의 신앙생활을 신성한 수호 아래 둡니다."
 generic_rite_focus_tenet_sinitic_syncretism: "이 교파는 자신의 전통을 중국 사상과 결합하여, 단절이 아닌 조화를 추구합니다."
 generic_rite_focus_tenet_eastern_syncretism: "이 교파는 동방의 가르침을 적극적으로 수용하며, 이방의 지혜를 성스러운 진리의 메아리로 해석합니다."
 generic_rite_focus_tenet_unreformed_syncretism: "이 교파는 오래된 관습에서 거리낌없이 영향을 받아, 고대의 의례들을 새로운 신앙 체계 속에 통합합니다."
 generic_rite_focus_tenet_christian_syncretism: "이 교파는 기독교의 가르침을 무조건 배척하기보다, 자신만의 신성한 체계 안에서 새롭게 해석합니다."
 generic_rite_focus_tenet_islamic_syncretism: "이 교파는 이슬람의 신앙과 관습을 받아들이며, 이웃한 계시 속에서도 받아들일 만한 진리를 찾습니다."
 generic_rite_focus_tenet_jewish_syncretism: "이 교파는 유대교의 전통과 율법, 그리고 역사적 기억을 자신들의 신성에 대한 이해 속에 통합합니다."
 generic_rite_focus_tenet_exaltation_of_pain: "이 교파는 고통을 정화의 수단으로 여기며, 인내와 기꺼이 받아들인 고난을 통해 신앙심이 드러난다고 봅니다."
 generic_rite_focus_tenet_natural_primitivism: "이 교파는 지나친 문명을 경계하며, 보다 거칠고 원초적인 삶의 방식을 높이 평가합니다."
 generic_rite_focus_tenet_pursuit_of_power: "이 교파는 야망과 세속 권력의 추구를 긍정하며, 권력을 성스러운 목적을 이루기 위한 정당한 수단으로 여깁니다."
 generic_rite_focus_tenet_ritual_cannibalism: "이 교파는 인육 섭취를 금기된 숭배와 신성한 공포의 의식 속에 포함시킵니다."
 generic_rite_focus_tenet_sacred_shadows: "이 교파는 비밀에 몸을 감추며, 은폐와 황혼, 그리고 다수의 눈에 드러나지 않는 것을 신성시합니다."
 generic_rite_focus_tenet_polyamory: "이 교파는 복수의 애정 관계를 축복하며, 성스러운 친밀함을 하나의 관계에만 국한하지 않습니다."
 generic_rite_focus_tenet_sacrificial_ceremonies: "이 교파는 엄숙한 제물을 예배의 중심에 두며, 희생을 성약과 은총에 결부시킵니다."
 generic_rite_focus_tenet_megaliths: "이 교파는 오래도록 남는 거석으로 신성을 기리며, 기념비가 기억과 신앙심을 붙들어 준다고 믿습니다."
 generic_rite_focus_tenet_fp3_fedayeen: "이 교파는 더 높은 대의를 위해 행하는 은밀한 활동과 침투, 그리고 자기희생적 폭력을 신성시합니다."
 generic_rite_focus_tenet_communal_possessions: "이 교파는 사적 재산의 중요성을 낮게 보며, 신자들에게 자원을 공동으로 소유할 것을 권합니다."
 generic_rite_focus_tenet_pure_land: "이 교파는 신뢰와 염원, 그리고 헌신을 통해 이를 수 있는, 고통 너머의 복된 세계에 희망을 둡니다."
 generic_rite_focus_tenet_no_mind: "이 교파는 집착을 넘어선 명료함을 추구하며, 자신을 수련하여 비우면서도 또렷한 자각에 이르고자 합니다."
 generic_rite_focus_tenet_mountain_worship: "이 교파는 높은 곳이 신성에 더 가깝다고 여기며, 산봉우리와 고지를 공경의 대상으로 삼습니다."
 generic_rite_focus_tenet_extinction_of_dharma: "이 교파는 세상이 타락으로 뒤덮였다고 여기며, 진리를 수호하기 위한 가차 없는 폭력을 정당화합니다."
 generic_rite_focus_tenet_cranial_trophies: "이 교파는 적의 유해를 승리와 두려운 위세를 입증하는 신성한 증표로 여깁니다."
 generic_rite_focus_tenet_pursuit_of_knowledge: "이 교파는 배움을 신성한 노력으로 높이 평가하며, 학문과 토론, 그리고 절제된 탐구를 통해 진리를 추구합니다."
 generic_rite_focus_tenet_benevolent_governance: "이 교파는 공정한 통치와 질서 있는 관리, 그리고 공동체에 대한 보살핌 또한 거룩함의 척도로 여깁니다."
 generic_rite_focus_tenet_filial_piety: "이 교파는 부모와 연장자를 공경하는 것을 도덕적 질서와 신성한 질서의 근본으로 가르칩니다."
 generic_rite_focus_tenet_harmonious_society: "이 교파는 균형과 예의, 그리고 사회적 조화를 우주 질서의 반영으로 여깁니다."
 generic_rite_focus_tenet_sacred_destruction: "이 교파는 신성한 파괴를 정화의 과정으로 여기며, 파멸 자체를 성스러운 쇄신의 도구로 삼습니다."
 generic_rite_focus_tenet_preservation: "이 교파는 인내와 계승, 그리고 맡겨진 것을 신중하게 보전하는 일을 소중히 여깁니다."
 generic_rite_focus_tenet_takamin: "이 교파는 곰과 그에 연관된 야생의 영적 존재들을 경외와 존중으로 받듭니다."
 generic_rite_focus_tenet_peace_of_god: "이 교파는 폭력을 억제하고자 하며, 언제 피를 흘리는 것이 정당한지에 대해 신성한 한계를 둡니다."
 generic_rite_focus_tenet_dulia: "이 교파는 성인들과 거룩한 모범들을 공경하며, 그들을 신과 동일시하지 않으면서도 그들의 기억을 기립니다."
 generic_rite_focus_tenet_transubstantiation: "이 교파는 거룩한 신비가 참된 변화를 이룬다고 여기며, 성사를 통해 신이 임한다고 믿습니다."
 generic_rite_focus_tenet_ora_et_labora: "이 교파는 기도와 노동을 하나로 여기며, 절제된 노동 자체가 신앙의 실천이 될 수 있다고 가르칩니다."
 generic_rite_focus_tenet_hyperdulia: "이 교파는 가장 거룩한 중보자에게 일반 성인들보다 특별히 높은 공경을 바칩니다."
 generic_rite_focus_tenet_simony: "이 교파는 성직과 후원, 그리고 세속적 부가 쉽게 분리될 수 없다고 여깁니다."
 generic_rite_focus_tenet_monophysitism: "이 교파는 그리스도의 본성이 하나라고 선포하며, 신성한 신비를 지나치게 구분하려 하지 않습니다."
 generic_rite_focus_tenet_acts_of_apostles: "이 교파는 사도들의 공동체와 자선, 그리고 초기 신자들의 공동생활을 본보기로 삼습니다."
 generic_rite_focus_tenet_purgatory: "이 교파는 많은 영혼이 죽음 이후, 완전한 복락에 이르기 전에 정화를 거친다고 가르칩니다."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "이 교파는 가정과 출산, 그리고 새로운 생명을 낳는 일을 신성한 의무로 여깁니다."
 generic_rite_focus_tenet_apostolic_succession: "이 교파는 사도들에게서 이어지는 끊어지지 않은 계승에서 권위의 근거를 찾습니다."
 generic_rite_focus_tenet_confession: "이 교파는 공개적인 참회와 사죄를 중시하며, 죄를 고백하는 행위가 치유의 시작이 된다고 믿습니다."
 generic_rite_focus_tenet_original_sin: "이 교파는 인간의 나약함이 근원적인 것이라고 보며, 어떤 영혼도 아무런 흔적 없이 세상에 태어나지 않는다고 가르칩니다."
 generic_rite_focus_tenet_celestial_hierarchy: "이 교파는 우주가 신성한 위계에 따라 질서 있게 구성되어 있으며, 각 단계가 신의 뜻을 반영한다고 믿습니다."
 generic_rite_focus_tenet_miles_christi: "이 교파는 신자들을 성스러운 군사로 여기며, 절제된 열정으로 진리를 수호하도록 부릅니다."
 generic_rite_focus_tenet_scholasticism: "이 교파는 논증과 주석, 그리고 이성과 신앙의 조화를 통해 교리를 다듬습니다."
 generic_rite_focus_tenet_adoptionism: "이 교파는 하느님께 높임 받아 그분의 아들이 되었다는 점을 강조하며, 그 지위가 처음부터 영원히 정해져 있었다는 믿음은 덜 중시합니다."
 generic_rite_focus_tenet_love_thy_neighbour: "이 교파는 자비와 이웃 사랑을 일상적인 신앙생활의 중심에 둡니다."
 generic_rite_focus_tenet_divine_liturgy: "이 교파는 장엄한 전례를 중시하며, 질서 있는 예배를 신성을 가장 분명히 드러내는 통로로 여깁니다."
 generic_rite_focus_tenet_miaphysitism: "이 교파는 그리스도라는 하나의 신비 안에서 신성과 인성이 분리될 수 없이 결합되어 있다고 가르칩니다."
 generic_rite_focus_tenet_hesychasm: "이 교파는 침묵과 고요함, 그리고 거룩한 기도를 내면에서 반복함으로써 신과의 합일을 추구합니다."
 generic_rite_focus_tenet_anachoresis: "이 교파는 세속으로부터의 은둔을 중시하며, 고독과 고행, 그리고 세상과의 거리를 통해 거룩함을 추구합니다."
 generic_rite_focus_tenet_mortification_of_the_flesh: "이 교파는 육체적 고행을 통해 거룩함을 추구하며, 육신을 영적 목적에 복종시키고자 합니다."
 generic_rite_focus_tenet_holy_myron: "이 교파는 성유 도유를 특별히 중시하며, 성유를 신의 은총을 나타내는 표징으로 여깁니다."
 generic_rite_focus_tenet_khachkar: "이 교파는 조각된 석십자가와 오래도록 남는 기념비를 신성을 드러내는 공적인 증표로 여기며 신성시합니다."
 generic_tenet_focus_fallback: "이 원리는 상위 신앙 안에서 고유한 신앙적 특색을 유지합니다."
 generic_tenet_focus_tenet_aniconism: "[GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )](은)는 성상을 배척하며, 부재와 절제, 그리고 형상화되지 않은 신성의 거룩함을 통해 경외를 추구합니다."
 generic_tenet_focus_tenet_alexandrian_catechism: "[GetTenetType('tenet_alexandrian_catechism').GetName( GetPlayer.GetRite )](은)는 학문적 가르침과 정교한 교리, 그리고 신자들에 대한 인내심 있는 교육을 중시합니다."
 generic_tenet_focus_tenet_armed_pilgrimages: "[GetTenetType('tenet_armed_pilgrimages').GetName( GetPlayer.GetRite )](은)는 전쟁을 벌이고 성지로 향하는 길을 확보하는 것을 독실한 신자들의 신성한 의무로 여깁니다."
 generic_tenet_focus_tenet_carnal_exaltation: "[GetTenetType('tenet_carnal_exaltation').GetName( GetPlayer.GetRite )](은)는 욕망과 육체적 쾌락을 신성의 손길이 닿은 선물로 존중합니다."
 generic_tenet_focus_tenet_communal_identity: "[GetTenetType('tenet_communal_identity').GetName( GetPlayer.GetRite )](은)는 공동의 관습과 혈연, 배타적인 소속 의식과 예배를 긴밀히 결부합니다."
 generic_tenet_focus_tenet_communion: "[GetTenetType('tenet_communion').GetName( GetPlayer.GetRite )](은)는 공동의 신앙심과 자선, 그리고 영적 지도자와의 교류를 통해 결속됩니다."
 generic_tenet_focus_tenet_consolamentum: "[GetTenetType('tenet_consolamentum').GetName( GetPlayer.GetRite )](은)는 금욕과 죽음을 두려움 없이 준비함으로써 최후의 정화를 추구합니다."
 generic_tenet_focus_tenet_divine_marriage: "[GetTenetType('tenet_divine_marriage').GetName( GetPlayer.GetRite )](은)는 결합과 통치를 모두 신성시하며, 성스러운 혼인을 천상의 질서의 반영으로 여깁니다."
 generic_tenet_focus_tenet_gnosticism: "[GetTenetType('tenet_gnosticism').GetName( GetPlayer.GetRite )](은)는 세상의 장막 너머에 숨겨진 진리를 탐구하며, 성스러운 지식에서 구원을 찾습니다."
 generic_tenet_focus_tenet_mendicant_preachers: "[GetTenetType('tenet_mendicant_preachers').GetName( GetPlayer.GetRite )](은)는 탁발 수도자들의 겸허한 증언, 그리고 끊임없는 가르침을 통해 신앙을 전파합니다."
 generic_tenet_focus_tenet_pacifism: "[GetTenetType('tenet_pacifism').GetName( GetPlayer.GetRite )](은)는 절제와 평화를 중시하며, 불필요한 유혈을 영혼의 중대한 타락으로 여깁니다."
 generic_tenet_focus_tenet_pentarchy: "[GetTenetType('tenet_pentarchy').GetName( GetPlayer.GetRite )](은)는 유서 깊은 권위의 중심지들과 더 넓은 신앙 공동체에 대한 질서 있는 관리를 중시합니다."
 generic_tenet_focus_tenet_unrelenting_faith: "[GetTenetType('tenet_unrelenting_faith').GetName( GetPlayer.GetRite )](은)는 흔들림 없는 열광과 강인한 의지, 그리고 성스러운 것을 위해 기꺼이 싸우려는 자세를 찬양합니다."
 generic_tenet_focus_tenet_vows_of_poverty: "[GetTenetType('tenet_vows_of_poverty').GetName( GetPlayer.GetRite )](은)는 거룩한 궁핍을 존중하며, 신자들에게 과도한 소유를 버리고 검소하게 살 것을 권합니다."
 generic_tenet_focus_tenet_pastoral_isolation: "[GetTenetType('tenet_pastoral_isolation').GetName( GetPlayer.GetRite )](은)는 보호된 신앙 공동체를 지향하며, 세상과 타협하기보다는 거리를 두는 편을 택합니다."
 generic_tenet_focus_tenet_adaptive: "[GetTenetType('tenet_adaptive').GetName( GetPlayer.GetRite )](은)는 본질을 잃지 않은 채 유연하게 변화에 적응하며, 신앙의 근본을 지키면서도 지역 관습을 받아들입니다."
 generic_tenet_focus_tenet_esotericism: "[GetTenetType('tenet_esotericism').GetName( GetPlayer.GetRite )](은)는 숨겨진 지혜와 입문 의식, 그리고 준비된 자에게만 드러나는 진리를 소중히 여깁니다."
 generic_tenet_focus_tenet_legalism: "[GetTenetType('tenet_legalism').GetName( GetPlayer.GetRite )](은)는 명확한 계율과 올바른 판단, 그리고 절도 있는 삶의 질서 속에서 거룩함의 토대를 찾습니다."
 generic_tenet_focus_tenet_literalism: "[GetTenetType('tenet_literalism').GetName( GetPlayer.GetRite )](은)는 성스러운 가르침을 문자 그대로 따르며, 자의적인 해석과 관습적으로 굳어진 타협을 불신합니다."
 generic_tenet_focus_tenet_reincarnation: "[GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )](은)는 영혼의 여정을 순환하는 과정으로 보며, 한 생이 다음 생을 결정한다고 믿습니다."
 generic_tenet_focus_tenet_religious_legal_pronouncements: "[GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )](은)는 신성한 법적 판단과 엄숙한 판결에 지속적인 영적 권위를 부여합니다."
 generic_tenet_focus_tenet_struggle_submission: "[GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )](은)는 고난과 정복, 그리고 불경한 자들을 굴복시킴으로써 신앙이 증명된다고 가르칩니다."
 generic_tenet_focus_tenet_false_conversion_sanction: "[GetTenetType('tenet_false_conversion_sanction').GetName( GetPlayer.GetRite )](은)는 생존이나 실리를 위해 필요하다면, 내면의 신앙을 감춘 채 겉으로만 순응하는 것을 용인합니다."
 generic_tenet_focus_tenet_tax_nonbelievers: "[GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )](은)는 신앙 밖의 이들에게 공물을 바칠 의무가 있다고 여기며, 세속적인 납부 의무를 통해 신성한 위계질서를 공고히 합니다."
 generic_tenet_focus_tenet_asceticism: "[GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )](은)는 금욕과 절제, 그리고 욕망을 끈기 있게 다스림으로써 거룩함을 추구합니다."
 generic_tenet_focus_tenet_bhakti: "[GetTenetType('tenet_bhakti').GetName( GetPlayer.GetRite )](은)는 진심 어린 헌신을 중심에 두며, 사랑으로 자신을 맡기는 것이 영혼을 신성에 가장 가깝게 이끈다고 가르칩니다."
 generic_tenet_focus_tenet_dharmic_pacifism: "[GetTenetType('tenet_dharmic_pacifism').GetName( GetPlayer.GetRite )](은)는 비폭력과 자기 절제를 중시하며, 분노보다 평화를 더 고귀한 수행으로 여깁니다."
 generic_tenet_focus_tenet_inner_journey: "[GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )](은)는 내면을 향해 나아가며, 성찰과 수양, 그리고 자기 변화를 통해 깨달음을 추구합니다."
 generic_tenet_focus_tenet_ritual_hospitality: "[GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )](은)는 낯선 이에 대한 환대를 신성한 의무로 여기며, 주인과 손님을 성스러운 관습 아래 하나로 묶습니다."
 generic_tenet_focus_tenet_adorcism: "[GetTenetType('tenet_adorcism').GetName( GetPlayer.GetRite )](은)는 정령들에게 경의를 표하며, 그들의 은총을 얻고 노여움을 피하고자 합니다."
 generic_tenet_focus_tenet_ancestor_worship: "[GetTenetType('tenet_ancestor_worship').GetName( GetPlayer.GetRite )](은)는 존경받는 조상들에게서 인도와 축복을 구하며, 산 자와 죽은 자의 이어짐을 중시합니다."
 generic_tenet_focus_tenet_astrology: "[GetTenetType('tenet_astrology').GetName( GetPlayer.GetRite )](은)는 하늘에서 징조를 읽어 내며, 별들이 질서와 운명, 그리고 때를 드러낸다고 믿습니다."
 generic_tenet_focus_tenet_hedonistic: "[GetTenetType('tenet_hedonistic').GetName( GetPlayer.GetRite )](은)는 공동 예배 속에서 향연과 풍요, 그리고 쾌락의 신성화를 받아들입니다."
 generic_tenet_focus_tenet_human_sacrifice: "[GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )](은)는 피의 제물을 필멸자와 신성 사이에 맺는 두렵지만 성스러운 계약으로 여깁니다."
 generic_tenet_focus_tenet_mystical_birthright: "[GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )](은)는 운명이 태어날 때부터 특정한 영혼들을 신성한 권능과 위대한 영적 사명을 위해 점지한다고 믿습니다."
 generic_tenet_focus_tenet_ritual_celebrations: "[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )](은)는 공동체의 향연과 성스러운 축제를 예배의 가장 완전한 표현으로 찬미합니다."
 generic_tenet_focus_tenet_sacred_childbirth: "[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )](은)는 아이의 탄생을 경건하게 받들며, 모성과 새로운 생명을 지극히 성스러운 의미를 지닌 것으로 여깁니다."
 generic_tenet_focus_tenet_sanctity_of_nature: "[GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )](은)는 살아 있는 세계에서 신성을 발견하며, 성장과 풍요, 그리고 길들여지지 않은 자연을 숭배합니다."
 generic_tenet_focus_tenet_sun_worship: "[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )](은)는 하늘에 뜬 타오르는 원판을 생명을 베푸는 존재이자 질서와 광휘, 그리고 신의 은총을 상징하는 징표로 받듭니다."
 generic_tenet_focus_tenet_warmonger: "[GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )](은)는 정복과 무인의 기상을 찬양하며, 신자들이 전투를 통해 자신을 증명할 것을 요구합니다."
 generic_tenet_focus_tenet_gruesome_festivals: "[GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )](은)는 섬뜩한 축제를 받아들이며, 공포와 피, 그리고 장관을 성스러운 의식으로 승화시킵니다."
 generic_tenet_focus_tenet_cthonic_redoubts: "[GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )](은)는 높은 산봉우리와 깊숙이 숨겨진 천연 요새들을 각별히 신성한 장소로 숭배합니다."
 generic_tenet_focus_tenet_household_gods: "[GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )](은)는 가정을 중심에 두며, 화덕과 가족, 그리고 일상의 신앙생활을 신성한 수호 아래 둡니다."
 generic_tenet_focus_tenet_sinitic_syncretism: "[GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )](은)는 자신의 전통을 중국 사상과 결합하여, 단절이 아닌 조화를 추구합니다."
 generic_tenet_focus_tenet_eastern_syncretism: "[GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )](은)는 먼 곳의 가르침을 적극적으로 수용하며, 이방의 지혜를 성스러운 진리의 메아리로 해석합니다."
 generic_tenet_focus_tenet_unreformed_syncretism: "[GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )](은)는 오래된 관습에서 거리낌없이 영향을 받아, 고대의 의례들을 새로운 신앙 체계 속에 통합합니다."
 generic_tenet_focus_tenet_christian_syncretism: "[GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )](은)는 그리스도의 가르침을 무조건 배척하기보다, 자신만의 신성한 체계 안에서 새롭게 해석합니다."
 generic_tenet_focus_tenet_islamic_syncretism: "[GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )](은)는 무슬림의 신앙과 관습을 받아들이며, 이웃한 계시 속에서도 받아들일 만한 진리를 찾습니다."
 generic_tenet_focus_tenet_jewish_syncretism: "[GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )](은)는 히브리 전통과 율법, 그리고 역사적 기억을 자신들의 신성에 대한 이해 속에 통합합니다."
 generic_tenet_focus_tenet_exaltation_of_pain: "[GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )](은)는 육신의 고통을 정화의 수단으로 여기며, 인내와 기꺼이 받아들인 고난을 통해 신앙심이 드러난다고 봅니다."
 generic_tenet_focus_tenet_natural_primitivism: "[GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )](은)는 지나친 문명을 경계하며, 보다 거칠고 원초적인 삶의 방식을 높이 평가합니다."
 generic_tenet_focus_tenet_pursuit_of_power: "[GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )](은)는 야심과 세속 권력의 추구를 긍정하며, 지배를 성스러운 목적을 이루기 위한 정당한 수단으로 여깁니다."
 generic_tenet_focus_tenet_ritual_cannibalism: "[GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )](은)는 인육 섭취를 금기된 숭배와 신성한 공포의 의식 속에 포함시킵니다."
 generic_tenet_focus_tenet_sacred_shadows: "[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )](은)는 비밀에 몸을 감추며, 은폐와 황혼, 그리고 다수의 눈에 드러나지 않는 것을 신성시합니다."
 generic_tenet_focus_tenet_polyamory: "[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )](은)는 복수의 애정 관계를 축복하며, 성스러운 친밀함을 하나의 관계에만 국한하지 않습니다."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "[GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )](은)는 엄숙한 제물을 예배의 핵심으로 삼으며, 이를 성약과 은총에 결부시킵니다."
 generic_tenet_focus_tenet_megaliths: "[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )](은)는 오래도록 남는 거석으로 신성을 기리며, 기념비가 기억과 신앙심을 붙들어 준다고 믿습니다."
 generic_tenet_focus_tenet_fp3_fedayeen: "[GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )](은)는 더 높은 대의를 위해 행하는 은밀한 활동과 침투, 그리고 자기희생적 폭력을 신성시합니다."
 generic_tenet_focus_tenet_communal_possessions: "[GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )](은)는 사적 재산의 중요성을 낮게 보며, 신자들에게 자원을 공동으로 소유할 것을 권합니다."
 generic_tenet_focus_tenet_pure_land: "[GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )](은)는 신뢰와 염원, 그리고 헌신을 통해 이를 수 있는, 고통 너머의 복된 세계에 희망을 둡니다."
 generic_tenet_focus_tenet_no_mind: "[GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )](은)는 집착을 넘어선 명료함을 추구하며, 자신을 수련하여 비우면서도 또렷한 자각에 이르고자 합니다."
 generic_tenet_focus_tenet_mountain_worship: "[GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )](은)는 높은 곳이 신성에 더 가깝다고 여기며, 산봉우리와 고지를 공경의 대상으로 삼습니다."
 generic_tenet_focus_tenet_extinction_of_dharma: "[GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )](은)는 세상이 타락으로 뒤덮였다고 여기며, 진리를 수호하기 위한 가차 없는 폭력을 정당화합니다."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )](은)는 적의 유해를 승리와 두려운 위세를 입증하는 신성한 증표로 여깁니다."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "[GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )](은)는 배움을 신성한 노력으로 높이 평가하며, 학문과 토론, 그리고 절제된 탐구를 통해 진리를 추구합니다."
 generic_tenet_focus_tenet_benevolent_governance: "[GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )](은)는 공정한 통치와 질서 있는 관리, 그리고 봉역에 대한 보살핌 또한 거룩함의 척도로 여깁니다."
 generic_tenet_focus_tenet_filial_piety: "[GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )](은)는 부모와 연장자를 공경하는 것을 도덕적 질서와 신성한 질서의 근본으로 가르칩니다."
 generic_tenet_focus_tenet_harmonious_society: "[GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )](은)는 균형과 예의, 그리고 사회적 화합을 우주 질서의 반영으로 여깁니다."
 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )](은)는 신성한 파괴를 정화로 여기며, 파멸 자체를 쇄신의 수단으로 삼습니다."
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )](은)는 인내와 계승, 그리고 맡겨진 것을 신중하게 보전하는 일을 소중히 여깁니다."
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )](은)는 곰과 그에 연관된 야생의 영적 존재들을 경외와 존중으로 받듭니다."
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )](은)는 폭력을 억제하고자 하며, 언제 피를 흘리는 것이 정당한지에 대해 신성한 한계를 둡니다."
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )](은)는 고인이 된 복자들과 거룩한 모범들을 공경하며, 그들을 신과 동일시하지 않으면서도 그들의 기억을 소중히 간직합니다."
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )](은)는 거룩한 신비가 참된 변화를 이룬다고 여기며, 성사를 통해 신이 임한다고 믿습니다."
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )](은)는 신앙과 노동을 하나로 결합하며, 성실한 노동 자체가 예배가 될 수 있다고 여깁니다."
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )](은)는 가장 거룩한 전구자에게 일반 성인들보다 특별히 높은 공경을 바칩니다."
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )](은)는 성직과 후원, 그리고 세속적 부가 쉽게 분리될 수 없다고 여깁니다."
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )](은)는 그리스도의 본성이 하나라고 선포하며, 신성한 신비를 지나치게 구분하려 하지 않습니다."
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )](은)는 사도들의 공동체와 자선, 그리고 초기 신자들의 공동생활을 본보기로 삼습니다."
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )](은)는 많은 영혼이 죽음 이후, 완전한 복락에 이르기 전에 정화를 거친다고 가르칩니다."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )](은)는 가정과 출산, 그리고 새로운 생명을 낳는 일을 신성한 의무로 여깁니다."
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )](은)는 최초의 제자들에게서 이어지는 끊어지지 않은 계승에서 권위의 근거를 찾습니다."
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )](은)는 공개적인 참회와 사죄를 중시하며, 죄를 고백하는 행위가 치유의 시작이 된다고 믿습니다."
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )](은)는 인간의 나약함이 근원적인 것이라고 보며, 어떤 영혼도 아무런 흔적 없이 세상에 태어나지 않는다고 가르칩니다."
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )](은)는 우주가 신성한 위계에 따라 질서 있게 구성되어 있으며, 각 단계가 신의 뜻을 반영한다고 믿습니다."
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )](은)는 신자들을 성스러운 전사로 여기며, 절제된 열광으로 진리를 수호하도록 부릅니다."
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )](은)는 논증과 주석, 그리고 이성과 신앙의 조화를 통해 교리를 다듬습니다."
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )](은)는 하느님께 높임 받아 그분의 아들이 되었다는 점을 강조하며, 그 지위가 처음부터 영원히 정해져 있었다는 믿음은 덜 중시합니다."
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )](은)는 자비와 자선을 일상적인 신앙생활의 중심에 둡니다."
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )](은)는 장엄한 전례를 중시하며, 질서 있는 예배를 신성을 가장 분명히 드러내는 통로로 여깁니다."
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )](은)는 그리스도라는 하나의 신비 안에서 신성과 인성이 분리될 수 없이 결합되어 있다고 가르칩니다."
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )](은)는 침묵과 고요함, 그리고 거룩한 기도를 내면에서 반복함으로써 신과의 합일을 추구합니다."
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )](은)는 세속으로부터의 은둔을 중시하며, 고독과 고행, 그리고 세상과의 거리를 통해 거룩함을 추구합니다."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )](은)는 육체적 고행을 통해 거룩함을 추구하며, 저속한 욕구를 영적 목적에 복종시키고자 합니다."
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )](은)는 도유식을 특별히 중시하며, 성유를 신의 은총을 나타내는 표징으로 여깁니다."
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )](은)는 조각된 석십자가와 오래도록 남는 기념비를 신성을 드러내는 공적인 증표로 여기며 신성시합니다."
