 roman_rite: "로마 예법"
 roman_rite_adj: "로마"
 roman_rite_adherent: "로마 기독교인"
 roman_rite_adherent_plural: "로마 기독교인"
 roman_rite_desc: "로마 예법은 로마 교회의 전례 전통입니다. 이 예법은 라틴 신학과 교회법적 권위, 그리고 성사 규율과 성직 위계, 교회의 제도적 일체성에 대한 강조를 바탕으로 형성되었습니다."
 insular_celtic: "켈트 예법"
 insular_celtic_adj: "켈트"
 insular_celtic_adherent: "켈트 기독교인"
 insular_celtic_adherent_plural: "켈트 기독교인"
 insular_celtic_desc: "켈트 예법은 몇 세기 전 로마 가톨릭의 교리에서 떨어져나온 벽지 교파입니다. 정통 교회의 요구로 한때를 풍미하던 독자적 형식들을 많이 잃었습니다. 그러면서도 고행과 수도 생활에 큰 주안점을 두며 여타 기독교 세계와는 확연히 다른 켈트 결혼 관습을 따릅니다."
