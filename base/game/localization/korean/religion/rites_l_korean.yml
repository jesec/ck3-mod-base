 hafizi_desc: "하피즈파는 다른 누구보다도 진정한 칼리프가 될 인재를 중요시합니다. 이에 자신들을 몰아내거나 퇴위시키려는 모든 시도에 저항합니다. 이들에게 패배란 가치 있는 대의를 향한 반란이요, 승리는 지도자의 뜻을 관철하는 긍지 높은 고집을 뜻할 뿐입니다."
