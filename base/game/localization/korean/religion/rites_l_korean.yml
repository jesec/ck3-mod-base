 mozarabic_church: "모사라베 예법"
 mozarabic_church_adj: "모사라베"
 mozarabic_church_adherent: "모사라베 기독교인"
 mozarabic_church_adherent_plural: "모사라베 기독교인"
 mozarabic_church_desc: "초기 이베리아 예법의 후예인 모사라베 예법는 수세기에 걸친 이슬람 통치 아래에서 로마로부터 어느 정도 독립된 전통을 유지해 왔습니다. 다른 신앙과 오랫동안 공존해 온 이들은 보다 근본주의적인 종파들에 비해 서로의 차이를 관대하게 받아들입니다."
 ambrosian_rite: "암브로시오 예법"
 ambrosian_rite_adj: "암브로시오"
 ambrosian_rite_adherent: "암브로시오 기독교인"
 ambrosian_rite_adherent_plural: "암브로시오 기독교인"
 ambrosian_rite_desc: "위대한 주교 성 암브로시우스의 시대부터 밀라노 대교구에 고유하게 전해져 온 교파입니다. 암브로시오 교파는 독자적인 전례와 성가를 유지하며, 히포의 성 아우구스티누스의 사상을 중시하는 신학적 전통을 이어갑니다."
 beneventan_rite: "베네벤토 예법"
 beneventan_rite_adj: "베네벤토"
 beneventan_rite_adherent: "베네벤토 기독교인"
 beneventan_rite_adherent_plural: "베네벤토 기독교인"
 beneventan_rite_desc: "롬바르드족이 지배한 남부의 전례 전통으로, 베네벤토와 몬테카시노 대수도원을 중심으로 합니다. 독특한 성가와 전례 관습으로 로마식 관행과 구별되며, 로마 측에서는 이 교파를 갈수록 의심스러운 눈초리로 바라봅니다."
 carolingian_christianity: "카롤루스 예법"
 carolingian_christianity_adj: "카롤루스"
 carolingian_christianity_adherent: "카롤루스 교인"
 carolingian_christianity_adherent_plural: "카롤루스 교인"
 carolingian_christianity_desc: "카롤루스 왕조 치하에서 발전한 기독교의 한 형태입니다. 수도원주의와 선교 활동을 중시하는 것이 특징입니다."
 byzantine_rite: "그리스 예법"
 byzantine_rite_adj: "그리스"
 byzantine_rite_adherent: "그리스 기독교인"
 byzantine_rite_adherent_plural: "그리스 기독교인"
 byzantine_rite_desc: "콘스탄티노폴리스 총대주교구는 풍부한 신학 전통과 역사적 영향력으로 유명한 동방 정교회의 가장 중요한 중심지 가운데 하나입니다. 그리스 교파는 이 총대주교구에서 직접 유래했습니다."
 antiochian_rite: "안티오키아 예법"
 antiochian_rite_adj: "안티오키아"
 antiochian_rite_adherent: "안티오키아 기독교인"
 antiochian_rite_adherent_plural: "안티오키아 기독교인"
 antiochian_rite_desc: "안티오키아 총대주교구는 사도 성 베드로와 사도 바오로가 세운 가장 오래된 기독교 공동체 가운데 하나입니다. 교회를 재정비한 야코보스 바라다이오스의 이름을 따 '야코바이트'라고 불리는 서시리아 전통은 합성론 교리와 고대 성 야고보 전례를 고수합니다."
 slavic_rite: "슬라브 예법"
 slavic_rite_adj: "슬라브"
 slavic_rite_adherent: "슬라브 기독교인"
 slavic_rite_adherent_plural: "슬라브 기독교인"
 slavic_rite_desc: "키릴과 메토디오스가 슬라브 민족에게 전한 이 교파는 글라골 문자를 통해 슬라브 언어와 문화에 맞게 변형된 비잔티움 교파의 요소들을 포함하고 있습니다."
 georgian_rite: "조지아 예법"
 georgian_rite_adj: "조지아"
 georgian_rite_adherent: "조지아 기독교인"
 georgian_rite_adherent_plural: "조지아 기독교인"
 georgian_rite_desc: "조지아 예법은 조지아의 기독교 전통을 대표하며, 독자적인 전례와 교회 전통, 그리고 동방 정교회 신학 및 실천과의 긴밀한 연관성이 특징입니다."
 coptic_rite: "콥트 예법"
 coptic_rite_adj: "콥트"
 coptic_rite_adherent: "콥트 기독교인"
 coptic_rite_adherent_plural: "콥트 기독교인"
 coptic_rite_desc: "자신들의 기원을 복음사가인 성 마르코에게서 찾는 콥트 정교회는 기독교 수도주의의 발상지이자 교육, 철학 진흥의 오랜 전통을 이어가는 것으로 유명합니다."
 ethiopian_rite: "그으즈 예법"
 ethiopian_rite_adj: "그으즈"
 ethiopian_rite_adherent: "그으즈 기독교인"
 ethiopian_rite_adherent_plural: "그으즈 기독교인"
 ethiopian_rite_desc: "에티오피아 고원 지대를 중심으로 악숨의 유산을 계승한 고대 기독교 전통입니다. 더 폭넓은 성경 정경과 엄격한 수도원 전통, 그리고 솔로몬 왕조의 유산에 의해 형성된 언약 전통을 유지한다는 점에서 다른 알렉산드리아 계열 교회들과 구별됩니다."
 armenian_rite: "아르메니아 예법"
 armenian_rite_adj: "아르메니아"
 armenian_rite_adherent: "아르메니아 기독교인"
 armenian_rite_adherent_plural: "아르메니아 기독교인"
 armenian_rite_desc: "사도 바르톨로메오와 타대오가 세운 아르메니아 사도 교회는 빠르게 신도를 모았으며 아르메니아 왕국이 기독교를 국교로 인정한 첫 국가가 되도록 인도했습니다."
 apostolic_religious_head_title: "수좌 주교"
 apostolic_religious_head_title_plural: "수좌 주교"
 apostolic_religious_head_title_name: "교회"
 # Nabi
 nabi: "나비"
 nabi_adj: "나비"
 nabi_adherent: "나비 신자"
 nabi_adherent_plural: "나비 신자"
 nabi_desc: "꾸란 경전에 분명히 언급되어 있듯이, 나비는 전능하신 분의 메시지를 전하고 사람들이 그분 앞에 불려 나아가 자신의 행위에 대해 심판받을 날을 상기시키도록 선택된 자를 뜻합니다. 이 신앙의 핵심 교리에 따르면, 예언자 무함마드는 그 마지막 인물입니다."
 # Pre madhabs
 sahabah: "사하바"
 sahabah_adj: "사하바"
 sahabah_adherent: "사하바 신자"
 sahabah_adherent_plural: "사하바 신자"
 sahabah_desc: "무함마드의 동료들로도 알려진 이들은 무함마드를 만나거나 봤던 무슬림이었습니다. 이들은 초기 이슬람 공동체의 형성과 투쟁, 사회 운영, 하디스 전승, 그리고 통치에서 중요한 역할을 했습니다."
 tabiun: "타비운"
 tabiun_adj: "타비운"
 tabiun_adherent: "타비운 신도"
 tabiun_adherent_plural: "타비운 신도"
 tabiun_desc: "타비운은 예언자 무함마드의 동료들인 사하바의 뒤를 이은 세대입니다. 후대에 수니파 학파들이 성립하기 전, 사하바로부터 그 가르침을 전해 받은 무슬림을 가리킵니다."
 # Sunni
 hanafi: "하나피파"
 hanafi_adj: "하나피파"
 hanafi_adherent: "하나피파 신도"
 hanafi_adherent_plural: "하나피파 신도"
 hanafi_desc: "하나피파는 추론의 활용을 체계화한 법학자이자 신학자인 아부 하니파의 가르침에서 발전했습니다. 하나피 법학은 주로 꾸란과 순나, 학자들의 합의, 그리고 유추 추론에 근거해 법을 도출합니다."
 hanbali: "한발파"
 hanbali_adj: "한발파"
 hanbali_adherent: "한발파 신도"
 hanbali_adherent_plural: "한발파 신도"
 hanbali_desc: "한발파는 아흐마드 이븐 한발의 가르침에 기반한 네 개의 주요 수니 법학 학파 가운데 가장 규모가 작습니다. 다른 학파들과 달리 포괄적인 법 체계의 성문화를 경계하며, 꾸란과 하디스를 최고의 권위로 강조합니다."
 maliki: "말리크파"
 maliki_adj: "말리크파"
 maliki_adherent: "말리크파 신도"
 maliki_adherent_plural: "말리크 신도"
 maliki_desc: "말리크파는 수니파 이슬람의 네 주요 법학 학파 가운데 하나입니다. 8세기에 말리크 이븐 아나스가 창시했으며, 특히 법적 판단을 이끌어 내는 근거 자료의 범위에서 다른 수니파 법학 학파들과 차이를 보입니다."
 shafii: "샤피이파"
 shafii_adj: "샤피이파"
 shafii_adherent: "샤피이파 신도"
 shafii_adherent_plural: "샤피이파 신도"
 shafii_desc: "\"이슬람 법학의 아버지\"라 불리는 무슬림 학자이자 법학자 앗 샤피이의 이름을 따서 명명되었습니다. 율법의 적용을 받는 신자의 모든 행위에는 계시된 율법, 곧 샤리아 안에 대응하는 규정이 존재한다는 것이 샤피이 사상의 핵심입니다."
 #Ismaili
 ismaili: "이스마일파"
 ismaili_adj: "이스마일파"
 ismaili_adherent: "이스마일파 신도"
 ismaili_adherent_plural: "이스마일파 신도"
 ismaili_desc: "신의 지식과 무결성을 설파하는 진정한 이맘은 이스마일 빈 자파르의 계통에서 이어진다 생각하는 시아파 교파입니다. 또한 이스마일이 무함마드 이후 7번째 이맘이었으므로 일곱이맘파라고 부르기도 합니다."
 #Qarmatians
