 doctrine_family_rites_desc: "죽음은 애도의 기간이자 살아남은 이를 위한 의식의 시간입니다. 계층과 연장자를 향한 공경은 삶에서든 죽음에서든 중요한 가치입니다. 연장자가 죽은 뒤에도 이들을 공경해야만 하며, 올바른 방식으로 공경하는 모습을 보여야 합니다."
