 doctrine_clerical_function_name: "성직자의 기능"
 doctrine_clerical_function_taxation_name: "통제"
 doctrine_clerical_function_taxation_descriptive_name: "성직자의 기능 통제"
 doctrine_clerical_function_taxation_desc: "[ROOT.Faith.AltPriestTermPlural]들은 [ROOT.Faith.HighGodName](으)로부터 권위를 빌려오며, 이는 이 지구상에서도 행할 수 있는 권위입니다."
 doctrine_clerical_function_alms_and_pacification_name: "구호와 평화"
 doctrine_clerical_function_alms_and_pacification_descriptive_name: "구호와 평화 성직"
 doctrine_clerical_function_alms_and_pacification_desc: "우리의 [ROOT.Faith.PriestNeuterPlural]들은 가난하고 억압받는 자들이 배곯고 떠돌지 않도록 충분한 식량과 거처를 마련해 주는 소임을 받았습니다."
 doctrine_clerical_function_recruitment_name: "모병"
 doctrine_clerical_function_recruitment_descriptive_name: "성직자의 기능 군사"
 doctrine_clerical_function_recruitment_desc: "우리의 [ROOT.Faith.PriestNeuterPlural]들도 무기를 갖추고 믿음을 수호할 수 있습니다. 본보기로써 앞장서야 한다는 이들의 책임감이 전투에 힘을 보태줍니다."
 doctrine_parameter_clergy_can_fight: "[clergy|E]가 [commanders|E] 또는 $knight_culture_player_plural$(으)로 종군할 수 있음"
 doctrine_clerical_gender_name: "성직 허용 성별"
 doctrine_clerical_gender_male_only_name: "남성 한정"
 doctrine_clerical_gender_male_only_descriptive_name: "성직자 남성 한정"
 doctrine_clerical_gender_male_only_desc: "오직 남성만이 우리 신앙의 [ROOT.Faith.PriestMalePlural](으)로서의 큰 책임을 짊어질 수 있습니다."
 doctrine_parameter_clergy_must_be_male: "오직 남성만이 사원 [holdings|E]를 수여받고 [court_chaplains|E]로 봉직할 수 있음"
 clergy_must_be_male_name: "$doctrine_clerical_gender_male_only_name$"
 doctrine_clerical_gender_female_only_name: "여성 한정"
 doctrine_clerical_gender_female_only_descriptive_name: "성직자 여성 한정"
 doctrine_clerical_gender_female_only_desc: "오직 여성만이 현명하여 [ROOT.Faith.HighGodNamePossessive] 말씀을 해석할 수 있고 우리 신앙의 [ROOT.Faith.PriestFemalePlural](으)로 봉직할 수 있습니다."
 doctrine_parameter_clergy_must_be_female: "오직 여성만이 사원 [holdings|E]를 수여받고 [court_chaplains|E]로 봉직할 수 있음"
 clergy_must_be_female_name: "$doctrine_clerical_gender_female_only_name$"
 doctrine_clerical_gender_either_name: "제한 없음"
 doctrine_clerical_gender_either_descriptive_name: "성직 허용 성별 제한 없음"
 doctrine_clerical_gender_either_desc: "신의 부름을 받은 자라면 누구든 [ROOT.Faith.PriestNeuterPlural](으)로 봉직해야 합니다. 성별이 무엇이든 간에요."
 doctrine_parameter_clergy_can_be_either_gender: "사원 [holdings|E] 수여와 [court_chaplains|E] 봉직에 성별이 제한되지 않습니다."
 clergy_can_be_either_gender_name: "$doctrine_clerical_gender_either_name$"
 doctrine_clerical_marriage_name: "성직자의 결혼"
 doctrine_clerical_marriage_allowed_name: "허용"
 doctrine_clerical_marriage_allowed_descriptive_name: "성직자의 결혼 허용"
 doctrine_clerical_marriage_allowed_desc: "결혼은 성스러운 관습이니 독실한 신도들과 마찬가지로 [ROOT.Faith.PriestNeuterPlural]들도 결혼해야 마땅합니다."
 doctrine_parameter_clergy_can_marry: "[clergy|E]들의 [marry|E]이 허용됨"
 doctrine_clerical_marriage_disallowed_name: "불허"
 doctrine_clerical_marriage_disallowed_descriptive_name: "성직자의 결혼 금지"
 doctrine_clerical_marriage_disallowed_desc: "[ROOT.Faith.PriestNeuter](이)가 된다는 것은 곧 [ROOT.Faith.HighGodName]께 인생을 다 바친다는 뜻입니다. 그외에 필멸한 배우자를 두길 고려한다는 것은 본질적으로 불신적인 행위라 할 수 있습니다."
 doctrine_parameter_clergy_can_marry_disabled: "[clergy|E] 구성원은 [marrying|E]이 금지됨 \n$EFFECT_LIST_BULLET$[clergy|E] 대상 [GetScheme('seduce').GetTypeName] 및 [GetScheme('courting').GetTypeName] [scheme_success_chance|E]: [success_chance_i]#N -25%#!"
 doctrine_clerical_succession_name: "성직자의 지위"
 doctrine_clerical_succession_temporal_appointment_name: "세속적, 박탈 가능"
 doctrine_clerical_succession_temporal_appointment_descriptive_name: "성직자의 지위 세속적 박탈 가능"
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U](은)는 궁극적으로는 봉역의 신하이므로 약간의 제약이 따르긴 하지만, 주군이 임명하고 파면할 수 있습니다."
 doctrine_clerical_succession_spiritual_appointment_name: "영적, 박탈 가능"
 doctrine_clerical_succession_spiritual_appointment_descriptive_name: "성직자의 지위 영적 박탈 가능"
 doctrine_clerical_succession_spiritual_appointment_desc: "[ROOT.Faith.AltPriestTermPlural](이)가 모든 [ROOT.Faith.BishopNeuterPlural](을)를 임명해야 바람직하나, 세속의 군주가 실망을 느낀다면 파면할 수도 있습니다."
 doctrine_clerical_succession_temporal_fixed_appointment_name: "세속적, 종신"
 doctrine_clerical_succession_temporal_fixed_appointment_descriptive_name: "성직자의 지위 세속적 종신"
 doctrine_clerical_succession_temporal_fixed_appointment_desc: "영주가 자신의 [ROOT.Faith.BishopNeuterPlural](을)를 선택할 수 있지만, 그 소임은 성스러운지라 박탈을 할 수 있는 대상이 돼선 안 됩니다."
 doctrine_clerical_succession_spiritual_fixed_appointment_name: "영적, 종신"
 doctrine_clerical_succession_spiritual_fixed_appointment_descriptive_name: "성직자의 지위 영적 종신"
 doctrine_clerical_succession_spiritual_fixed_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U](은)는 신의 종복이요, 신의 대리인입니다. 따라서 [ROOT.Faith.AltPriestTermPlural](이)가 이들을 선출하고 나면 그 결과는 영원불변이라 할 수 있습니다."
 doctrine_clerical_succession_conditional_name: "조건부"
 doctrine_clerical_succession_conditional_descriptive_name: "조건부 성직자 임명"
 doctrine_clerical_succession_conditional_desc: "성직 작위 보유자를 교체할 권리가 누구에게 있는지는 정해지지 않았습니다. 이처럼 교체권을 둘러싼 분쟁이 계속되는 체제에서는 결국 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]의 발발을 피할 수 없습니다."
 doctrine_clerical_succession_conditional_can_pick_tt: "이 [doctrine|E]는 자유롭게 선택할 수 없으며, 보편 공의회를 통해서만 다시 수립할 수 있습니다"
 doctrine_parameter_clerical_appointment_ruler: "[rulers|E]가 [realm_priest|E] 혹은 [court_chaplain|E]를 임명함"
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E] 또는 [court_chaplains|E]는 성직자 중에서 선발되어 필요에 따라 [rulers|E]에게 배정됨"
 doctrine_parameter_clerical_appointment_fixed_disabled: "[realm_priest|E] 또는 [court_chaplain|E]를 파면할 수 있으며 다른 후보자로 대체할 수 있음"
 doctrine_parameter_clerical_appointment_fixed: "[realm_priest|E] 또는 [court_chaplain|E]는 종신토록 직위를 유지함"
 doctrine_parameter_clerical_appointment_ruler_can_replace_ecc: "세속 [rulers|E]는 자신의 [realm|E] 내 [clerical_title|E] [holders|E]를 교체할 수 있습니다"
 doctrine_parameter_clerical_appointment_hof_can_replace_ecc: "[head_of_faith|E]는 [clerical_title|E] [holders|E]를 교체할 수 있습니다"
 doctrine_theism_name: "유신론"
 doctrine_monotheist_name: "일신론자"
 doctrine_monotheist_descriptive_name: "일신론"
 doctrine_monotheist_desc: "오직 하나의 신만 숭배합니다. 세간에서 말하는 이른바 '신들'은 기껏해야 공허한 우상이며, 최악의 경우 신실한 자들을 [ROOT.Faith.HighGodName]에 대한 올바른 숭배에서 벗어나게 하려는 악의적인 기만이라고 믿습니다.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning: "\n\n$FAITH_MANDALA_MONOTHEIST_WARNING$"
 mandala_monotheist_warning_tt_global: "[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning_tt_first: "$mandala_monotheist_warning_tt_global$"
 mandala_monotheist_warning_tt_third: "$mandala_monotheist_warning_tt_global$"
 doctrine_polytheist_name: "다신론자"
 doctrine_polytheist_descriptive_name: "다신론"
 doctrine_polytheist_desc: "우주는 강력한 신들과 영들로 가득 차 있습니다. 명확한 신계가 설정된 신들의 집합이 있을 수도 있지만, 영적 세계가 무수하며 주변 만물에 스며 있고, 심지어 이름조차 붙여지지 않은 신들이 있을지도 모릅니다."
 unreformed_faith_doctrine_name: "미개혁"
 unreformed_faith_doctrine_descriptive_name: "미개혁 신앙"
 unreformed_faith_name: "교리"
 unreformed_faith_doctrine_desc: "미개혁 신앙은 제대로 된 성직자 체계와 확립된 교리 체계를 갖추지 못했습니다. 따라서 서로 다른 공동체들이 극도로 판이한 종교 제의를 거행하고 믿음을 가진다 해도 명목상 같은 신앙을 신봉한다 할 수 있습니다."
 doctrine_parameter_unreformed: "부족 [rulers|E]가 [government|E] 형태를 변경할 수 없음 \n$EFFECT_LIST_BULLET$[unreformed_pagan_combat_bonus|E]이 부여됨"
 west_african_unreformed_faith_doctrine_name: "$unreformed_faith_doctrine_name$"
 west_african_unreformed_faith_doctrine_descriptive_name: "$unreformed_faith_doctrine_descriptive_name$"
 west_african_unreformed_faith_doctrine_desc: "$unreformed_faith_doctrine_desc$"
 heresy_hostility_name: "이단에 대한 관점"
 heresy_hostility_doctrine_name: "이단"
 heresy_hostility_doctrine_desc: "불온한 목적으로 신앙을 뒤틀고 왜곡하는 거짓된 선지자는 경계할 대상입니다. 그런 이단자들은 뿌리를 뽑아야 마땅합니다."
 divine_destiny_name: "신성한 운명"
 divine_destiny_doctrine_name: "세상의 정당한 지배자"
 divine_destiny_doctrine_descriptive_name: "$divine_destiny_doctrine_name$"
 divine_destiny_doctrine_desc: "우린 온 세상 사람들에게 평화와 번영의 시대를 열어줄 사람입니다. 우리야말로 이 세상의 정당한 지배자입니다."
 doctrine_parameter_divine_destiny_holy_war_cost_reduction: "성전 [piety|E] 비용: #P -50%#!"
 adoptionist_school_name: "기독교 양자론 교리"
 special_doctrine_adoptionist_school_elipandic_doctrine_name: "엘리판딕 종파"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc: "그리스도론의 미묘한 차이에 집중하는 것을 선호하는 $adoptionist$의 엘리판딕 종파는 삼위일체설 교리의 #EMP 정확한#! 구분의 중요성을 강조합니다. 즉, 복잡할지언정 구체적인 구분이 어설프게 합리화한 단순 설명보다 압도적으로 나은 것으로 간주합니다."
 special_doctrine_adoptionist_school_felicitous_doctrine_name: "펠리시투스 종파"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc: "$adoptionist$의 펠리시투스 종파는 순수성보다 실용성을 믿으며, 적대적인 체제를 약화시키려면 그 안에서 움직여야 함을 이해하고 있습니다. 고결한 명분을 위한 악랄한 거짓말이 천 개의 솔직한 진실보다 가치 있는 것으로 여겨집니다."
 special_doctrine_adoptionist_school_radical_doctrine_name: "급진주의 종파"
 special_doctrine_adoptionist_school_radical_doctrine_desc: "급진주의 종파 $adoptionist_adherent_plural$은 성부 외에는 어떤 신도 인정하지 않으며 필멸하는 육신의 신성성을 받아들이지 않습니다. 또한, 자기 자신을 제외한 다른 $christianity_religion_adherent_plural$을 인정하지도 않습니다. 정경의 모든 #EMP 글자#!를 순응하지 않고 기독교를 믿는 것은 배교로 여겨집니다."
 doctrine_parameter_has_clerical_regions: "[clerical_region|E] 보유"
 special_doctrine_is_christian_faith_name: "예수 그리스도의 가르침"
 is_christian_faith_name: "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc: "세상에는 예수 그리스도의 신성성을 인정하지 않으면서도 그 가르침을 따르는 이들이 있습니다. 불경스러운 일이긴 하나 이 미혹된 영혼들이 언젠가 참된 신앙으로 개종할 수도 있기에, 우리는 연민을 갖고 이들을 대해야 합니다."
 special_doctrine_is_islamic_faith_name: "선지자의 가르침"
 is_islamic_faith_name: "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc: "저들이 비록 선지자가 정한 법칙을 모두 따르진 않지만, 이 세상엔 자신도 모르는 새에 알라의 의지가 인도하는 대로 더 이끌리는 이가 있기 마련입니다. 언젠가 이 반쪽짜리 개종자들도 사특한 믿음을 버리고 움마의 진정한 일원이 될 수 있을 겁니다!"
 special_doctrine_is_jewish_faith_name: "모세의 가르침"
 is_jewish_faith_name: "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc: "고귀한 이들이 모두 죄악 속에 묻혀 사는 건 아닙니다. 신의 선택을 받은 민족에게 존경을 표하는 이들도 있으니 우리도 그들에게 존경을 표할 필요가 있습니다."
 prophecy_of_malachi_name: "말라기 예언"
 special_doctrine_not_allowed_to_hof_name: "해체된 사제단"
 not_allowed_to_hof_name: "$special_doctrine_not_allowed_to_hof_name$"
 prophecy_of_malachi_desc: "전통적인 유대교 교리에서, 신임 대사제는 선지자가 도래하거나 사제의 자격을 갖춘 아론의 직계 후손이 발견됐을 경우에만 서임될 수 있습니다."
 special_doctrine_not_allowed_to_hof_desc: "해당 신앙의 대사제단은 완전히 해체된 상태입니다. 대사제를 임명하려면 우선 종래의 종교 구조를 철저하게 재건해야 합니다."
 doctrine_parameter_block_from_create_hof_parameter: "해당 신앙은 일반적인 상황에서 [head_of_faith|E]를 재생성할 수 없음"
 special_doctrine_is_eastern_faith_name: "여러 종교의 화합"
 is_eastern_faith_name: "$special_doctrine_is_eastern_faith_name$"
 special_doctrine_is_eastern_faith_desc: "우리는 하나의 신앙이 아닌 사회의 종교적 측면을 구성하는 수많은 신앙으로 결속되어 있습니다. 자신을 칭하는 이름과 추구하는 길은 다르지만, 우리 신앙 체계 외부에 머무르는 몇몇 이들은 마치 하나가 된 것처럼 우리 사회에서 공존하는 방법을 터득했습니다."
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "$tenet_eastern_syncretism_name$ 원리를 가진 비동방계 [faiths|E]이 $hostility_evil_tooltippable$ 신앙이 아닌 [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] 신앙으로 간주됨"
 special_doctrine_is_sinitic_faith_name: "중화 세계관"
 is_sinitic_faith_name: "$special_doctrine_is_sinitic_faith_name$"
 special_doctrine_is_sinitic_faith_desc: "$special_doctrine_is_eastern_faith_desc$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "$tenet_sinitic_syncretism_name$ 원리를 지닌 비 중화계 [faiths|E]은 $hostility_evil_tooltippable$ 신앙이 아닌 [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] 신앙으로 간주됨"
 special_doctrine_is_gnostic_faith_name: "$tenet_gnosticism_name$"
 is_gnostic_faith_name: "$special_doctrine_is_gnostic_faith_name$"
 special_doctrine_is_gnostic_faith_desc: "$tenet_gnosticism_desc$"
 special_doctrine_fire_worship_name: "성화"
 fire_worship_name: "$special_doctrine_fire_worship_name$"
 special_doctrine_fire_worship_desc: "우린 가장 정순한 원소이자 거룩한 영광을 가져오는 불꽃 숭배를 통해 하나가 됩니다. 세상에 영원한 불꽃을 피워 거짓과 악을 몰아내는 것은 우리의 신성한 의무입니다."
 doctrine_parameter_same_hof_hostility_override: "[head_of_faith|E]를 공유하는 다른 [faiths|E]을 [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V](으)로 간주함"
 is_hostile_to_maitreya_name: "$maitreya$ 적대"
 special_doctrine_maitreya_hostility_name: "$maitreya_adherent_plural$ 적대"
 special_doctrine_maitreya_hostility_descriptive_name: "$maitreya_adherent_plural$ 적대"
 special_doctrine_maitreya_hostility_desc: "$maitreya_adherent_plural$는 부처의 가르침을 따르는 다른 모든 신자를 말살하려 합니다. 모두가 같은 길을 걷는 것은 아니지만, $maitreya$의 방식은 용납될 수 없습니다."
 special_doctrine_is_maitreya_name: "$maitreya$"
 special_doctrine_is_maitreya_descriptive_name: "$maitreya_adj$의 설법"
 special_doctrine_is_maitreya_desc: "세상을 재건하고 미륵불의 시대를 여는 것은 우리의 엄숙한 의무입니다."
 #Internal, invisible classification doctrines used by portrait/appearance triggers.
 special_doctrine_is_western_christian_faith_name: "서방 기독교"
 special_doctrine_is_western_christian_faith_desc: "서방 (라틴) 기독교 전통에 속합니다."
 special_doctrine_is_eastern_christian_faith_name: "동방 기독교"
 special_doctrine_is_eastern_christian_faith_desc: "동방 기독교 전통(정교회, 단성론파, 동방교회 등)에 속합니다."
 christian_tradition_classification_name: "기독교 전통"
 preservation_name: "전승"
 doctrine_scriptural_name: "경전 중심"
 doctrine_scriptural_descriptive_name: "경전 중심 전승"
 doctrine_scriptural_desc: "교리의 순수성은 정경으로 인정된 성전들을 충실히 따름으로써 세대를 거쳐 보존됩니다."
 doctrine_mythic_literary_name: "신화 문헌 중심"
 doctrine_mythic_literary_descriptive_name: "신화 문헌 중심 전승"
 doctrine_mythic_literary_desc: "이 신앙은 신화적 업적에 관한 이야기들을 통해 전파되고 이어지며, 그러한 이야기 중 다수는 문헌으로 기록되어 전해집니다."
 doctrine_oral_storytelling_name: "구전 중심"
 doctrine_oral_storytelling_desc: "창세 신화와 도덕적 교훈은 널리 알려진 이야기 속에 담겨 있으며, 그러한 이야기들은 세대와 문화를 넘어 구전됩니다."
 doctrine_monasticism_name: "$tenet_monasticism_name$"
 doctrine_monasticism_encouraged_name: "장려"
 doctrine_monasticism_encouraged_descriptive_name: "수도주의 장려"
 doctrine_monasticism_encouraged_desc: "$doctrine_monasticism_general_desc$"
 doctrine_monasticism_accepted_name: "허용"
 doctrine_monasticism_accepted_descriptive_name: "수도주의 허용"
 doctrine_monasticism_accepted_desc: "수도 생활은 허용되지만 신앙의 중심 요소는 아닙니다. 독실한 신자는 서원을 하고 수도원에 들어갈 수 있으나, 이 전통은 수도 생활을 이상적인 길로 강조하지는 않습니다."
 doctrine_monasticism_absent_name: "부재"
 doctrine_monasticism_absent_descriptive_name: "수도주의 없음"
 doctrine_monasticism_absent_desc: "이 전통에서는 수도 제도가 정착된 적이 없습니다. 신앙생활은 세속 사회 안에서 이루어지며, 은둔이나 종신 서원을 위한 공식적인 길은 존재하지 않습니다."
 doctrine_monasticism_forbidden_name: "금지"
 doctrine_monasticism_forbidden_descriptive_name: "수도주의 금지"
 doctrine_monasticism_forbidden_desc: "이 신앙은 수도 생활을 명시적으로 거부합니다. 서원을 하는 것은 금지되며, 수도자 특성을 지닌 자는 이 신앙에서 범죄자로 간주됩니다."
 monasticism_group_name: "수도주의"
 doctrine_christianity_monasticism_latin_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_latin$\n\n[Glossary('수도주의의 역사적 배경','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_greek_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_greek$\n\n[Glossary('수도주의의 역사적 배경','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_default_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_default$\n\n[Glossary('수도주의의 역사적 배경','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_monasticism_general_desc: "$tenet_monasticism_desc$\n\n[Glossary('수도주의의 역사적 배경','doctrine_monasticism_general_historical_desc')]"
 doctrine_monasticism_christianity_historical_desc: "수도주의는 중세 동안 가톨릭 세계 전역으로 확산되었으며, 유럽과 북아프리카, 중동 곳곳에 수도원이 세워졌습니다. 수도승과 수녀는 청빈, 정결, 순종의 서원을 하고, 고립된 암자에서 은수자로 살아가거나 엄격한 규율 아래 공동체 생활을 했습니다.\n\n이러한 수도 기관은 필사본과 고전 문헌을 보존하고, 교육을 제공하며, 병원과 구호 시설을 운영하고, 농지를 관리하며, 여행자에게 숙식을 제공하는 등 다양한 역할을 수행했습니다. 베네딕토회, 시토회, 카르투시오회와 같은 수도회들은 기도와 노동, 공동체 생활에 관해 저마다의 독자적인 전통을 발전시켰습니다."
 doctrine_monasticism_general_historical_desc: "수도 공동체는 기독교뿐 아니라 불교, 힌두교, 자이나교 등 다양한 종교 전통에서 찾아볼 수 있습니다. 이러한 공동체에서는 보통 개인이 일반 사회로부터 물러나 기도와 명상, 학문 연구, 금욕 수행을 통해 종교적 헌신을 추구합니다.\n\n수도원은 흔히 학문의 중심지로 기능하며, 성전을 보존하고 교육을 제공합니다. 수도원은 주변 사회와 완전히 단절되어 있을 수도 있고, 자선 활동과 의료 지원, 농업 생산 등을 통해 적극적으로 교류할 수도 있습니다. 수도 생활을 규율하는 구체적인 규칙은 종교 전통과 개별 공동체에 따라 크게 달라집니다."
 sacraments_group_name: "성사"
 doctrine_sacraments_central_name: "중심"
 doctrine_sacraments_central_desc: "$doctrine_sacraments_general_desc$"
 doctrine_sacraments_central_latin_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_latin$"
 doctrine_sacraments_central_greek_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_greek$"
 doctrine_sacraments_absent_name: "성사 없음"
 doctrine_sacraments_absent_desc: "이 전통은 성사나 공식적인 성례 체계를 중시하지 않습니다. 신앙생활은 성직자의 의례 집전이나 특정 예식의 중요성을 중심으로 이루어지지 않습니다."
 doctrine_communion_historical_desc: "그리스도께서는 십자가형을 당하시기 전날 밤 제자들을 모아 유월절 만찬을 함께하시고, 그 의미를 새롭게 하셨습니다. 그분은 빵을 들어 축복하시고 떼어 제자들에게 주시며 말씀하셨습니다. #weak \"이는 너희를 위하여 내어주는 내 몸이니, 너희는 이를 행하여 나를 기억하라.\"#! 이어 포도주잔을 드시고, 그것이 죄의 용서를 위해 흘리는 새로운 언약의 피라고 선언하셨습니다.\n\n최후의 만찬에서 제정된 이 성찬은 모든 미사와 성찬 전례에서 반복되는 기독교 예배의 핵심 행위가 되었습니다. 신자들에게 성찬은 단순한 기념이 아니라 그리스도의 희생에 참여하는 것이며, 신자들을 구세주와 결합시키고 하나로 이어 줍니다."
 doctrine_sacraments_general_desc: "이 신앙은 성사와 성례를 매우 중요하게 여깁니다. 이러한 의식은 단순한 상징이 아니라 신성의 현존을 드러내는 행위입니다. 성직자가 이를 집전하며, 신자는 파문될 수 있습니다."
