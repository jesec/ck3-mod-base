 doctrine_parameter_hostility_towards_us_mult: "타 [faiths|E]과의 의견 불이익이 $VALUE|%V0$ 발생"
 doctrine_pluralism_fundamentalist_name: "원리주의자"
 doctrine_pluralism_fundamentalist_descriptive_name: "원리주의자 태도"
 doctrine_pluralism_fundamentalist_desc: "우리의 신앙이 곧 유일한 참된 신앙이고, 우리의 말이 곧 유일한 참된 정언입니다. [ROOT.Faith.ReligiousText]에서 하나라도 비껴간다면 그건 본질적으로 신성모독입니다."
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus: "영지 개종 속도: #P +20%#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "[tyranny|E] 불이익을 초래하지 않고 $hostility_hostile_tooltippable$, $hostility_evil_tooltippable$ 신앙을 신봉하는 불신자로부터 #P 영지 작위 박탈#! 가능"
 doctrine_parameter_pluralism_fundamentalist_faction_join_chance: "타 [faiths|E]의 [Concept( 'counties', '영지' )|E]가 [factions|E]에 합류할 #N 확률이 높아짐#!"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "[fervor|E] 수치가 낮을 때 이단이 발생할 #N 위험이 높아짐#!"
 doctrine_pluralism_righteous_name: "정의주의자"
 doctrine_pluralism_righteous_descriptive_name: "정의주의자 태도"
 doctrine_pluralism_righteous_desc: "우리가 필멸자이기에 [ROOT.Faith.HighGodNamePossessive] 의지를 완벽히 이해할 수 없지만, 그럼에도 우리의 [ROOT.Faith.PriestNeuterPlural]들은 무엇이 신성하고 모독적인지를 잘 알고 있습니다."
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "[tyranny|E] 불이익을 초래하지 않고 $hostility_evil_tooltippable$ 신앙을 신봉하는 불신자로부터 #P 영지 작위 박탈#! 가능"
 doctrine_pluralism_pluralistic_name: "다원주의자"
 doctrine_pluralism_pluralistic_descriptive_name: "다원주의자 태도"
 doctrine_pluralism_pluralistic_desc: "신의 의지를 올바르게 해석하는 법은 오직 한가지이며, 다른 견해는 모두 잘못됐다고 말하는 건 어리석기 짝이 없는 일입니다. 우리 모두 각자의 나름대로 [ROOT.Faith.HighGodName](을)를 숭배하는 것입니다."
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "영지 개종 속도: #N -20%#!"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "타 [faiths|E]을 신봉하는 영지가 [factions|E]에 합류할 #P 확률이 낮아짐#!"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "[fervor|E] 수치가 낮을 때 이단이 발생할 #P 위험이 낮아짐#!"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "[holy_war|E]에서 승리하면 대상 지역의 영지를 점령하는 대신 불신자 [rulers|E]들을 봉신화함"
 doctrine_theocracy_name: "성직자 전통"
 doctrine_theocracy_temporal_name: "신정주의"
 doctrine_theocracy_temporal_descriptive_name: "신정주의 성직자"
 doctrine_theocracy_temporal_desc: "오직 허가받은 [ROOT.Faith.PriestNeuterPlural]들만이 우리 신앙의 교리를 지키고 더 나아가 성지를 관리하며 돌볼 수 있습니다."
 doctrine_parameter_theocracy_temple_lease: "사원 [holdings|E]가 소유주의 [realm_priest|E]에게 임차되며 [theocratic|E] [vassal|E]으로 봉직하게 됨"
 doctrine_theocracy_lay_clergy_name: "민간 성직자"
 doctrine_theocracy_lay_clergy_descriptive_name: "$doctrine_theocracy_lay_clergy_name$"
 doctrine_theocracy_lay_clergy_desc: "헌신적인 신도라면 능히 우리의 신앙의 교리를 이해하고, 따르며, 설파할 수 있습니다."
 doctrine_parameter_theocracy_temple_ownership: "세속의 [rulers|E]가 직접 소유한 사원 [holdings|E]를 다스리고 관련해서 생기는 이익을 모두 얻습니다. "
