 doctrine_pilgrimage_name: "순례에 대한 관점"
 doctrine_pilgrimage_local_rites_name: "지역 의식"
 doctrine_pilgrimage_local_rites_desc: "해당 신앙의 신봉자들은 긴 순례의 위험과 고단함보다는 지역 사당에서의 익숙하고 안정적인 의식을 더 선호합니다."
 doctrine_parameter_local_shrine_offering: "[GetDecisionWithKey('visit_local_shrine_decision').GetName] [decision|E]을 이용할 수 있지만, [pilgrimage|E] [activity|E]의 비용이 더 높음"
