 doctrine_homosexuality_name: "동성연애"
 doctrine_homosexuality_crime_name: "죄악"
 doctrine_homosexuality_crime_descriptive_name: "동성연애 죄악"
 doctrine_homosexuality_crime_desc: "남색가들의 죄악스러운 욕망은 사회의 근간을 저해하므로 도덕을 범한 죄를 처벌받고 투옥당해야 합니다."
 doctrine_homosexuality_shunned_name: "지탄"
 doctrine_homosexuality_shunned_descriptive_name: "동성연애 지탄"
 doctrine_homosexuality_shunned_desc: "어떤 상황이건 두 남성이 서로 성관계를 맺는 것은 자연스럽지 못한 일입니다."
 doctrine_homosexuality_accepted_name: "용인"
 doctrine_homosexuality_accepted_descriptive_name: "동성연애 용인"
 doctrine_homosexuality_accepted_desc: "사랑은 육체를 초월하는 것이므로 한낱 성별이 가로막을 수 없는 심오하고 경이로운 것입니다."
 doctrine_parameter_homosexuality_illegal: "[GetTrait('sodomite').GetName( GetNullCharacter )] [trait|E]을 가진 남성은 [criminals|E]가 됨"
 doctrine_parameter_homosexuality_shunned: "[GetTrait('sodomite').GetName( GetNullCharacter )] [trait|E]을 가진 남성은 [Concept( 'shunned', '지탄받음' )|E]"
 doctrine_parameter_homosexuality_accepted: "동성 간의 관계가 완전히 용인됨"
 doctrine_deviancy_name: "이상성욕"
 doctrine_deviancy_crime_name: "범죄자"
 doctrine_deviancy_crime_descriptive_name: "이상성욕 죄악"
 doctrine_deviancy_crime_desc: "타인을 사랑하는 적절한 방법은 오로지 하나뿐입니다. 도착적 사랑은 죄악이고 처벌받아야 마땅합니다."
 doctrine_deviancy_shunned_name: "지탄"
 doctrine_deviancy_shunned_descriptive_name: "이상성욕 지탄"
 doctrine_deviancy_shunned_desc: "세간에는 누가 봐도 이상야릇한 성행위들이 있습니다. 당연히 이런 걸 원하는 사람들은 이상한 사람일 수밖에 없습니다."
 doctrine_deviancy_accepted_name: "용인"
 doctrine_deviancy_accepted_descriptive_name: "이상성욕 용인"
 doctrine_deviancy_accepted_desc: "사랑은 어떤 형태이건 아름답고 성스러운 법입니다. 모든 이들은 원하는 대로 사랑하고 행동할 수 있어야 합니다."
 doctrine_deviancy_virtuous_name: "고결"
 doctrine_deviancy_virtuous_descriptive_name: "이상성욕 고결"
 doctrine_deviancy_virtuous_desc: "육신의 쾌락은 인간과 신 사이의 거리를 좁혀줍니다. 그러니, 인습적인 욕망이란 굴레를 벗어던진 이들은 덕행이 극치에 이르렀다고 할 수 있습니다."
 doctrine_parameter_deviancy_illegal: "[GetTrait('deviant').GetName( GetPlayer )] [trait|E]을 가진 인물은 [criminals|E]가 됨"
 doctrine_parameter_deviancy_shunned: "[GetTrait('deviant').GetName( GetPlayer )] [trait|E]을 가진 인물은 [Concept( 'shunned', '지탄받음' )|E]"
 doctrine_parameter_deviancy_accepted: "[GetTrait('deviant').GetName( GetPlayer )] [trait|E]을 가진 인물은 완전히 용인됨"
 doctrine_witchcraft_name: "마술"
 doctrine_witchcraft_crime_name: "범죄자"
 doctrine_witchcraft_crime_descriptive_name: "마술 죄악"
 doctrine_witchcraft_crime_desc: "이 세상에서 기적을 일으킬 수 있는 건 오직 신뿐입니다. 누구든 신성 모독을 하려는 자는 그 자만과 오만의 대가를 치르게 될 겁니다."
 doctrine_witchcraft_shunned_name: "지탄"
 doctrine_witchcraft_shunned_descriptive_name: "마술 지탄"
 doctrine_witchcraft_shunned_desc: "이 세상의 초월적 힘을 다룰 수 있는 정당한 권리는 신께만 존재합니다. 그래서 이러한 힘을 필멸자가 다루려고 하는 것은 곧 본질적으로 잘못된 길을 가는 것입니다."
 doctrine_witchcraft_accepted_name: "용인"
 doctrine_witchcraft_accepted_descriptive_name: "마술 용인"
 doctrine_witchcraft_accepted_desc: "마법은 우리 세계를 가득 채운 것으로 우리 조상들이 그러셨듯, 마법을 활용하는 것은 곧 우리의 권리이자 특권입니다."
 doctrine_witchcraft_virtuous_name: "고결"
 doctrine_witchcraft_virtuous_descriptive_name: "마술 고결"
 doctrine_witchcraft_virtuous_desc: "마술을 수련한다는 것은 영혼을 위험한 악령들 앞에 내놓는 것과 같은 행위입니다. 영혼이 더럽혀지지 않도록 지켜나가는 이 용감한 행위로 미루어 보았을 때, 마녀는 공경받아 마땅합니다."
 doctrine_parameter_witchcraft_illegal: "[GetTrait('witch').GetName( GetPlayer )] [trait|E]을 가진 인물은 [criminals|E]가 됨"
 doctrine_parameter_witchcraft_shunned: "[GetTrait('witch').GetName( GetPlayer )] [trait|E]을 가진 인물은 [Concept( 'shunned', '지탄받음' )|E]"
 doctrine_parameter_witchcraft_accepted: "[GetTrait('witch').GetName( GetPlayer )] [trait|E]을 가진 인물은 완전히 용인됨"
 witchcraft_illegal_name: "범죄자 마술 교리"
 witchcraft_shunned_name: "지탄받는 마술 교리"
 doctrine_head_of_faith_name: "교계 지도자"
 doctrine_head_of_faith_desc: "[head_of_faith|E]는 [faith|E]의 지도자입니다."
 doctrine_no_head_name: "없음"
 doctrine_no_head_descriptive_name: "교계 지도자 없음"
 doctrine_no_head_desc: "누구나 [ROOT.Faith.HighGodName]의 의지를 진실로 이해할 수 있다고 생각하는 것은 어리석고 섣부른 판단입니다. 우리를 위한 [ROOT.Faith.HighGodHerHis] 계획이 무엇인지 알기 위해선 반드시 우리 가슴 속의 신심을 따라야만 합니다."
 doctrine_parameter_no_head_of_faith: "[head_of_faith|E]가 존재하지 않습니다."
 no_head_of_faith_name: "[head_of_faith|E] [doctrine|E] 없음"
 doctrine_parameter_minimum_fervor: "열성이 #V $VALUE|0$%#! 미만으로 떨어지지 않음"
 doctrine_spiritual_head_name: "영성주의"
 doctrine_spiritual_head_descriptive_name: "영성주의 지도력"
 doctrine_spiritual_head_desc: "물질세계와 영적 세계는 서로 다른 세계입니다. 그렇기에 영적 세계에서 우리를 이끌어주고 물질적 욕망이 우리의 신앙을 더럽히는 것을 막아줄 지도자가 있어야 합니다. "
 doctrine_parameter_spiritual_head_of_faith: "[head_of_faith|E]의 자리는 저명한 성직자에게 주어짐"
 doctrine_parameter_spiritual_head_of_faith_claims: "[head_of_faith|E]는 경건한 신자에게 영지 작위에 대한 [claims|E]을 하사할 수 있음"
 doctrine_parameter_spiritual_head_of_faith_gold: "[head_of_faith|E]는 경건한 신자에게 [gold|E]를 하사할 수 있음"
 doctrine_temporal_head_name: "세속주의"
 doctrine_temporal_head_descriptive_name: "세속주의 지도력"
 doctrine_parameter_temporal_head_of_faith: "[head_of_faith|E]의 자리는 [faith|E]의 창시자에게 주어지며 사망 시 창시자의 [primary_heir|E]에게 세습됨"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "신앙이 [great_holy_wars|E]을 벌일 경우, 교계 지도자가 전쟁을 지휘하고 목표가 될 대상을 선택할 수 있음"
 doctrine_temporal_head_desc: "정신과 육체는 본질적으로 결합돼, 하나이자 뗄 수 없는 것입니다. 한 나라에 지도자를 둘이나 두는 것은 어리석기 그지없는 일입니다."
 doctrine_marriage_type_name: "결혼 형식"
 doctrine_monogamy_name: "일부일처제"
 doctrine_monogamy_descriptive_name: "일부일처제"
 doctrine_monogamy_desc: "결혼은 두 개인 간의 성스러운 결합이라 할 수 있습니다. 한 번에 여러 사람과 이런 관계를 맺으려 한다면 신성을 모독하는 것입니다."
 doctrine_polygamy_name: "일부다처제"
 doctrine_polygamy_descriptive_name: "일부다처제"
 doctrine_polygamy_desc: "결혼은 성스러운 연합입니다. 따라서 결혼 자체가 신성하기 때문에 한 번의 결혼보단 여러 번의 결혼이 더 성스러운 법입니다. "
 doctrine_concubines_name: "축첩제"
 doctrine_concubines_descriptive_name: "축첩제"
 doctrine_concubines_desc: "결혼이 성스러운 결합이긴 하나 배우자가 제일의 지위를 갖고 있다면 첩을 두는 것도 허용할 수 있습니다."
 hostility_group_name: "적대 집단"
