 tenet_household_gods_desc: "우리는 가정을 지켜주는 수호신 #EMP 라레스#!와 #EMP 게니우스#!를 숭배한다. 그리고 온 봉역을 책임지고 지키는 영혼을 지닌 영광스러운 황제 폐하를 존경한다."
 #BP3 Parameter
 doctrine_parameter_allows_brewery: "[temple_holdings|E]의 $allows_brewery$"
 #TGP
 immaterial_harmony_name: "무형의 조화"
 special_doctrine_immaterial_harmony_name: "무형의 조화"
 special_doctrine_immaterial_harmony_desc: "우리의 전통과 부처의 가르침, 현자의 가르침은 서로 충돌하지 않습니다. 셋 중 어느 것을 따라도 좋고, 셋 모두를 따라도 정신에 해를 끼치는 일 없이 함께 수행할 수 있습니다."
 tenet_extinction_of_dharma_name: "다르마의 소멸"
 tenet_extinction_of_dharma_desc: "악마들이 신실하고 독실한 자의 외양을 쓰고 세상을 거닙니다. 한 명을 베는 자는 부처에 한 걸음 다가서고, 열 명을 베는 자는 부처에 열 걸음 다가갑니다."
 tenet_cranial_trophies_name: "두개골 전리품"
 tenet_cranial_trophies_desc: "머리는 인간의 정수가 담긴 그릇입니다. 그것을 베어내고 내용물을 추출함으로써 강력한 영적 에너지를 차지할 수 있습니다."
 doctrine_parameter_killing_bestows_heads: "다른 인물을 [executing|E]하거나, [single_combat_duel|E]에서 베어내거나, [battle|E]에서 살해할 경우 두개골 전리품 [artifact|E]을 획득할 수 있음"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "두개골 전리품 [artifact|E] 획득 시, 살해자는 사망자의 @prestige_icon![prestige|E]에 비례해 추가로 @piety_icon![piety|E] 획득"
 doctrine_parameter_tenet_cranial_trophies_spiritual_fulfillment_from_trophies: "두개골 전리품 [artifact|E] 획득 시, 사망자의 @prestige_icon![prestige|E]에 비례하여 당신이 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 또한 획득"
 tenet_benevolent_governance_name: "자애로운 국정"
 tenet_benevolent_governance_desc: "백성을 다스리는 자는 선을 권하고 악을 멀리할 도덕적 의무를 집니다. 이 원칙을 따를 때만 통치자는 비로소 진정 정의로울 수 있습니다."
 tenet_filial_piety_name: "효"
 tenet_filial_piety_desc: "효와 연장자에 대한 순종은 인간다움을 실천하는 근본입니다. 부모가 살아계실 때는 예로서 섬기고, 형편껏 부양하며, 그 가르침에서 배웁니다. 돌아가시면 예로서 장사 지내며, 그 뒤에는 예로서 제사를 지냅니다."
 tenet_harmonious_society_name: "조화로운 사회"
 tenet_harmonious_society_desc: "만물은 균형을 이루어야 합니다. 개인, 자연, 사회 모두 마찬가지입니다. 천자는 장단을 정하고, 우리는 그분의 윤음을 따릅니다."
