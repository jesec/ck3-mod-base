l_korean:
 doctrine_core_tenets_name: "원리"
 tenets_name: "원리"
 #Abrahamic Tenets
 tenet_communion_name: "영성체"
 tenet_communion_desc: "우리의 의식은 단순의 상징적인 행위가 아닌 신의 존재 그 자체를 불러오는 의식입니다. 우리의 전례에 동참하지 않거나 할 수 없는 이들은 참된 신자가 아니라 할 수 있습니다. "
 doctrine_parameter_tenet_communion_denied_sacrament: "이 [rite|E]에 속한 [Concept('excommunicated', '파문')|E]당한 [characters|E]은 @piety_icon![piety|E] 획득량이 #N -25%#! 감소하고, 같은 신앙을 믿는 인물의 [opinion|E]이 #N -10#! 감소"
 doctrine_parameter_tenet_communion_shared_table: "[GetActivityType('activity_feast').GetName](을)를 주최하면 같은 [faith|E]을 믿는 각 문객과의 [opinion|E]이 #P +10#! 증가"
 doctrine_parameter_excommunication_active: "영적 [heads_of_faith|E]가 [faith|E]을 신봉하는 인물을 [excommunicate|E]할 수 있음"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "해당 [rite|E]을 믿는 인물은 [GetDecisionWithKey('pam_decision_last_rites').GetName] [decision|E]을 내릴 수 있음"
 doctrine_parameter_seek_indulgences_active: "이 [rite|E]의 인물은 #high $seek_indulgences_interaction$#! [interaction|E]을 사용할 수 있지만, 해당 [faith|E]에 [head_of_faith|E] 또는 [clerical_regions|E]이 있어야 함"
 tenet_armed_pilgrimages_name: "무장 순례 여행"
 tenet_armed_pilgrimages_desc: "우리의 순례자들은 성지를 방문하기 위해 세계를 여행합니다. 누구든 이들을 해하려 하거든 기꺼이 검을 들고 안전히 보호할 것입니다."
 doctrine_parameter_cheaper_holy_wars_active: "이 [rite|E]를 믿는 [rulers|E]는 [holy_wars|E] 선포에 드는 @piety_icon![piety|E] 비용이 #P -20%#! 감소"
 doctrine_parameter_great_holy_wars_active: "존재할 경우, [head_of_faith|E]가 [great_holy_war|E]을 선포할 수 있음"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "[head_of_faith|E]가 공석일 때, 보유하고 있는 [holy_site|E] 수마다 신도들에게 [convert_county|E] [councillor_task|E] 보너스가 부여됨"
 doctrine_parameter_pilgrimage_decision_active: "이 [rite|E]를 믿는 인물은 [pilgrimage|E]을 성공적으로 마쳤을 때 추가 보너스를 획득함"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[holy_orders|E]에 [holdings|E] [leasing|E] 시 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 추가 제공"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "수도주의"
 tenet_monasticism_desc: "좋은 음식과 음료는 신을 위한 봉사를 방해할 뿐입니다. 이 유혹에서 벗어나는 좋은 방법은 외딴 수도원에 자신을 가두는 것입니다."
 doctrine_parameter_take_vows_active: "[courtiers|E](이)가 수도 서원을 통해 [GetTrait('devoted').GetName( GetNullCharacter )](이)가 될 수 있음"
 doctrine_parameter_devoted_trait_criminal: "[GetTrait('devoted').GetName( GetNullCharacter )] 특성은 [criminal|E] 특성임"
 doctrine_parameter_cannot_take_the_vows: "해당 [rite|E]의 인물은 #high $take_vows_interaction$#! [character_interaction|E]을 사용할 수 없음"
 tenet_divine_marriage_name: "신성한 결혼"
 tenet_divine_marriage_xwedodah: "즈웨도다"
 tenet_divine_marriage_desc: "가까운 친족과의 결혼은 창세기 최초의 존재들의 성혼을 모방하는 행위입니다. 그렇게 혈통에는 좋은 자질이 대대로 전해지게 되고, 영원한 악과의 싸움에서 순수함과 은총을 누릴 수 있습니다."
 doctrine_parameter_divine_marriage_opinion: "같은 [faith|E]을 믿는 [vassals|E]이 [close_family|E] 구성원과 결혼한 신도에게 갖는 [opinion|E] $VALUE|0+=$ 증가"
 doctrine_parameter_divine_marriage_piety_gain_active: "[close_family|E] 구성원과 결혼할 때, [GetDoctrineType('doctrine_monogamy').GetBaseName] 결혼 보너스에 더하여 다량의 @piety_icon![piety|E]가 주어짐"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "[spouse|E] [councillor_tasks|E]로 받는 [skills|E] 기여: #P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "신자들은 [close_family|E] 또는 [extended_family|E]와 결혼한 [liege|E]에 대항하는 [factions|E]을 만들거나 가입할 확률이 크게 감소함"
 tenet_pacifism_name: "평화주의"
 tenet_pacifism_desc: "폭력은 고통과 괴로움, 후회만 자아내는 혐오스러운 행위입니다. 최대한 폭력을 삼간다면 우리는 독실한 신자들을 위해 더 강하고 안전한 사회를 건설할 수 있을 것입니다. 평화주의 영지는 이 평화로운 질서 아래 성장하고 번영합니다."
 doctrine_parameter_holy_wars_forbidden: "[holy_wars|E] 또는 [raid|E] 선포 불가"
 doctrine_parameter_pacifist_opinion_active: "평화주의자 의견: $VALUE|+=0$"
 pacifist_opinion_name: "평화주의자 동료"
 pacifist_county_opinion_name: "평화주의자 동료 영지"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "다른 평화주의자의 [opinion|E]: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "영주가 최소 2년 이상 평화 상태면 @piety_icon![piety|E]가 매달 $VALUE|+$ 변화"
 PIETY_LONG_PEACE: "장기적인 평화"
 tenet_vows_of_poverty_name: "청빈 서약"
 tenet_vows_of_poverty_desc: "부귀는 사람의 마음을 타락시키고 참된 믿음으로부터 멀어지게 합니다. 정말 중요한 것에 집중하려거든 재물 탐닉을 멀리해야만 합니다. 대신 검소한 활동을 택하고 이를 완수하며 신앙심을 찾아야 합니다."
 doctrine_parameter_vows_of_poverty_active: "[rulers|E]가 청빈 서약을 [decide|E]하면 매달 [tax|E] 수입이 줄어드는 대신 @piety_icon![piety|E] 획득이 늘어남"
 tenet_human_sacrifice_name: "인신 공양"
 tenet_human_sacrifice_desc: "우리의 헌신을 증명하는 가장 좋은 방법은 바로 공양 의식입니다. 우리가 바칠 수 있는 중 가장 가치 있는 제물은 바로 인간의 목숨이라 할 수 있겠습니다."
 doctrine_parameter_human_sacrifice_active: "[executions|E]이 @piety_icon![piety|E]를 소모하는 대신 @piety_icon![piety|E]를 제공함"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[sharing_power|E] 시 [executions|E]이 @prestige_icon![prestige|E]을 전혀 소모하지 않음"
 doctrine_parameter_flower_war_cb_active: "인접한 봉역에 대한 [flowery_war|E] [casus_belli|E] 부여"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "희생자의 [nobility|E] 및 [rank|E]에 따라, [executions|E] 시 추가 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 부여"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "[sieges|E] 중 인물을 생포할 확률 대폭 증가"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "비지주 인물을 [imprison|E]할 확률 증가"
 tenet_gruesome_festivals_blot_name: "블로트 희생제"
 tenet_gruesome_festivals_name: "섬뜩한 기념제"
 tenet_gruesome_festivals_desc: "모든 사람은 핏속에서 태어나기 마련입니다. 가축과 피붙이, 적의 피로 목을 축이면서 살아남습니다. 그러니 [ROOT.Rite.GetFaith.PantheonTerm] 역시 마땅한 몫을 요구하는 것이 당연합니다."
 gruesome_festivals_active_name: "대규모 희생제 개최"
 doctrine_parameter_gruesome_festivals_active: "약 10년에 한 번 개최할 수 있는 [GetActivityType('activity_gruesome_festival').GetName] [activity|E]을 잠금 해제하며, 이는 @piety_icon![piety|E] 및 같은 [faith|E]을 믿는 신민의 의견 및 [county_opinion|E] 부여"
 tenet_volcanic_veneration_name: "화산 숭배"
 tenet_volcanic_veneration_desc: "우리 터전의 불타는 구덩이에서 솟구치는 갓 태어난 대지보다 거룩한 광경은 없을 것입니다. 우리는 재앙의 끝자락에서 살아가며, 목숨은 [ROOT.Rite.GetFaith.PantheonTerm]의 자비에 달려 있을 뿐입니다."
 tenet_cthonic_redoubts_name: "지하의 보루"
 tenet_cthonic_redoubts_desc: "이 세상에 지구의 뿌리보다 더 나은 은신처는 없으며, 툭 튀어나온 지구의 척추보다 더 견고한 요새는 없습니다. 그리고 지구의 숨겨진 길을 따르는 것보다 숭고한 순례는 없다고 할 수 있겠죠. 우린 아득히 높은 정상에서 창조의 소산을 내려다보며 진정한 신의 무게를 느낍니다."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "산악 [terrain|E]에서의 [convert_county|E] 속도: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "[faith|E]이 같은 산악 [terrain|E]에서의 [promote_culture|E] 속도: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "산악 [terrain|E]에서의 적대적인 [convert_county|E] 속도: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "엔듀라"
 tenet_consolamentum_name_alternate: "자살 의식"
 tenet_consolamentum_desc: "늙거나 병이 들면 의식을 통해 죄악에 물든 영혼을 씻어내야 합니다. 의식이 끝나면 죄악이 다시 한번 우리를 타락시키지 않도록 빠르고 확실하게 목숨을 끊습니다."
 doctrine_parameter_consolamentum_active: "신도들은 노인 혹은 불능자가 되거나 죽음에 다다르게 되면 목숨을 끊는 [decide|E]을 할 수 있습니다. 이는 통상적으로 자살을 했을 때 생기는 불이익을 초래하지 않습니다."
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "신도가 [GetDecisionWithKey('initiate_consolamentum_decision').GetName] [decision|E]을 통해 사망하면 그 후계자가 #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! @piety_icon![piety|E] 획득"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "당신이 [GetDecisionWithKey('initiate_consolamentum_decision').GetName] [decision|E]을 통해 사망하면 당신의 후계자는 추가로 #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! @piety_icon![piety|E]를 획득하고, #P 10#!년 동안 $pam_blessed_passing_modifier$을 얻음"
 tenet_gnosticism_name: "영지주의"
 tenet_gnosticism_desc: "지식을 통하면 모든 인간에게 내재된 신의 불꽃을 해방하고 영적 세계에 있는 천상의 원천으로 돌아가게 할 수 있습니다."
 doctrine_parameter_granting_titles_gives_stress: "[titles|E]를 넘길 때 [stress|E] 완화"
 tenet_mendicant_preachers_name: "탁발 설교"
 tenet_mendicant_preachers_desc: "우리의 선교사들은 등에 옷가지만 들쳐메고 저 멀리 여행을 떠납니다. 이들은 방문지의 자애로움에 빌어먹고 살며 그 대가로 참된 믿음에 대한 지식을 나눕니다."
 doctrine_parameter_mendicant_preachers_conversion_active: "영지 개종 속도: #P +33%#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "[character|E]을 개종시키면 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 추가 획득"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "다른 [faith|E]의 [characters|E]에게 환심을 사는 데 성공할 확률이 높아짐"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "당신의 [activities|E]에 참석한 다른 [faith|E]의 문객이 당신의 신앙으로 개종될 수 있음"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "당신의 현재 [location|E]에 있는 [rulers|E]들에게 #V $attempt_conversion_of_local_ruler_interaction$#! [interaction|E]을 사용할 수 있음"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "[GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)] [perk|E] 없이도 [GetTravelOption('adventurers_proselytize_zealously_option').GetName] [travel_option|E] 활성화"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U](이)가 [first.GetFaith.GetName](으)로 개종함"
 must_be_in_same_county_tt: "당신이 상대가 소유한 [Concept( 'county', '영지' )|E]에 있어야 함"
 tenet_communal_identity_name: "공동체 정체성"
 tenet_communal_identity_desc: "우리의 신앙과 문화는 서로 본질적으로 연결돼있습니다. 이러한 관행은 이방인들을 배척하는 경향이 있지만, 공동체를 끈끈한 유대로 뭉치게 해줍니다."
 doctrine_parameter_same_communal_identity_opinion_active: "같은 [faith|E]을 믿는 인물의 [opinion|E] #P +10#!"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "[ecumenical_council|E]에서 파벌의 환심을 살 때 @prestige_icon![prestige|E] 비용이 없음"
 doctrine_parameter_tenet_communal_identity_sway_piety: "당신이 당신과 같은 [rite|E]의 인물에 대한 [GetScheme('sway').GetTypeName]에 성공할 때마다 [piety_i]#P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! [piety|E] 획득"
 doctrine_parameter_tenet_communal_identity_language_devotion: "당신과 같은 [rite|E]에 속한 대상을 상대로 한 [GetScheme('learn_language').GetTypeName] [scheme_success_chance|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "당신과 같은 [rite|E]에 속한 인물의 [language|E]를 배우면 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 획득"
 doctrine_parameter_same_culture_conversion_bonus_active: "내 [culture|E]에 속한 [Concept( 'counties', '영지' )|E] 개종 속도: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "내 [faith|E]을 신봉하는 [Concept( 'counties', '영지' )|E]의 문화 우대 속도: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "다른 [culture|E]에 속한 [Concept( 'counties', '영지' )|E]의 개종 속도: #N -50%#!"
 tenet_pentarchy_name: "교구 정치"
 tenet_pentarchy_alternate_name: "으뜸 교구정"
 tenet_pentarchy_desc: "우리의 성지는 단순히 성스러운 장소가 아닌 우리 종교의 지도자가 다스릴 권력의 반석입니다."
 tenet_aniconism_name: "우상 파괴 운동"
 tenet_aniconism_desc: "조각된 형상 숭배가 너무 많은 신자의 눈을 멀게 하여 신의 진리를 알아채지 못하게 하고 있습니다. 우리는 성지에서 모든 우상을 걷어내 신자들이 함정에 빠지지 않게 할 겁니다."
 doctrine_parameter_reforging_artifacts_costs_piety: "이 [rite|E]에 속한 [rulers|E]는 [artifacts|E] [reforge|E] 또는 [repair|E] 시 @piety_icon![piety|E]를 소모함"
 doctrine_parameter_destroying_artifacts_is_pious: "이 [rite|E]에 속한 [rulers|E]는 [artifacts|E]을 파괴하고 @piety_icon![piety|E]를 얻을 수 있음"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "[artifacts|E]을 파괴하여 @piety_icon![piety|E]를 얻을 수 있음"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "이 [core_tenet|E]가 없는 [faith|E]의 [rulers|E]를 상대로 공성하면 더 많은 [development|E]를 파괴하고, [artifacts|E]을 더 자주 손상시키며, @piety_icon![piety|E]를 얻음"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "[artifacts|E]을 파괴하거나, 이 [core_tenet|E]가 없는 [faith|E]을 상대로 공성하면 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 획득"
 pam_aniconism_siege_toast: "당신의 [GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )] [personal_tenet|E]에서"
 destroying_artifacts_is_not_pious_tt: "당신의 [rite|E]에 따라 [artifacts|E]을 파괴하여 [piety|E]를 얻을 수 없음"
