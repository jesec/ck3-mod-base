 tenet_natural_primitivism_desc: "문명은 부자연스러운 것입니다. 본질적으로 무질서한 창조물에 질서를 부여하려는 인류의 부질없으면서도 신성모독적인 산물입니다. 우리는 옷을 벗어던지고 지위와 법, 궁정의 허영까지 모두 떨쳐 내어 [ROOT.Rite.GetFaith.PantheonTerm]의 뜻대로 살아갑니다. 야생 그대로, 소박하고 자유롭게."
