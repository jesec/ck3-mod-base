 doctrine_parameter_tenet_harmonious_society_five_bonds: "다음 관계인 상대와의 [opinion|E]이 #V 50#! 이상이면 [piety_i][piety|E] 및 [prestige_i][prestige|E] 획득: [liege|E] 또는 [vassal|E], 부모 또는 성년 자녀, 배우자, 성년 형제자매, [friend|E]"
