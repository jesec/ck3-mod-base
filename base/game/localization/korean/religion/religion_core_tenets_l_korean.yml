 tenet_megaliths_name: "거석 건설"
 tenet_megaliths_desc: "자고로 숭배란 사원의 비좁은 경계 안에서 이루어져서는 안 되는 법입니다. 사원은 오히려 우리 주위를 감싸는 온갖 신성한 피조물에서 멀어지게 만드는 미개한 구조물에 지나지 않습니다. 창조주께서 베풀어 주신 돌과 공기, 열석을 받아들여 그분들께 기쁨을 선사하면 신성성에 가까워질 수 있습니다."
