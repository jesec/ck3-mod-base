 #Ṣadr al-Islām
 sadr_al_islam: "사드르 알 이슬람"
 sadr_al_islam_adj: "이슬람교"
 sadr_al_islam_adherent: "무슬림"
 sadr_al_islam_adherent_plural: "무슬림"
 sadr_al_islam_desc: "학파가 등장하기 이전의 가장 순수한 형태에서, 무슬림들은 예언자 무함마드가 받은 신성한 계시에 따라 그의 직접적인 인도를 받았습니다. 무함마드의 순나는 동료들인 사하바와 초기 몇 세대의 타비운에 의해 계승되었습니다."
 #Sunni
 sunni: "수니파"
 sunni_adj: "수니파"
 sunni_adherent: "수니파 신자"
 sunni_adherent_plural: "수니파 신자"
 sunni_desc: "수니파는 무함마드의 관행인 순나를 따르는 이들을 가리킵니다. 수니 이슬람 법학은 주로 꾸란, 하디스, 그리고 이즈마(학자들의 합의)를 근본적인 권위로 삼습니다."
 #Shia
 shia: "시아파"
 shia_adj: "시아파"
 shia_adherent: "시아파 신자"
 shia_adherent_plural: "시아파 신자"
 shia_desc: "이슬람의 한 분파로, 공동체의 정당한 지도자는 예언자 무함마드의 가문 안에 유지되어야 하며 하느님의 인도를 받는 이맘들에게 계승되어야 한다고 믿습니다. 이들은 예언자의 가문에 대한 헌신을 중시합니다."
 islam_shia_priest: "물라"
 islam_shia_priest_plural: "물라"
 islam_shia_religious_head_title: "이맘"
 islam_shia_religious_head_title_name: "이맘령"
 #Kharijite
 kharijite: "하리지파"
 kharijite_adj: "하리지파"
 kharijite_adherent: "하리지파 신도"
 kharijite_adherent_plural: "하리지파 신도"
 kharijite_desc: "초기 이슬람의 한 분파로, 지도자는 혈통이 아니라 경건함에 따라 선출되어야 하며 죄를 범한 통치자는 축출될 수 있다고 믿습니다. 이들은 시아파의 정치적 격변 속에서 등장해 어느 편에도 가담하지 않았으며, 중죄를 저지른 자는 이슬람 공동체에서 벗어났다고 선언했습니다."
 #Masmudism
 masmudi: "무와히드파"
 masmudi_adj: "무와히드파"
 masmudi_adherent: "무와히드파 신도"
 masmudi_adherent_plural: "무와히드파 신도"
 masmudi_desc: "무와히드파는 북아프리카의 베르베르 부족에서 비롯한 수니파의 개혁 지파입니다. 이들은 그 사상 때문에 신성의 유일함을 신봉하는 자들로 불리었으며, 순수 유일신 교리를 설파했습니다."
 masmudi_religious_head_title: "칼리프"
 masmudi_religious_head_title_name: "칼리프국"
 #Quranism
 quranist: "꾸란 율법주의"
 quranist_adj: "꾸란 율법주의"
 quranist_adherent: "꾸란 율법주의자"
 quranist_adherent_plural: "꾸란 율법주의자"
 quranist_desc: "이슬람교를 율법학자의 관점으로 해석하는 이들은 꾸란이 신성한 지혜의 원천임을 강조하며 하디스와 파트와를 묵살하고 꾸란을 문자 그대로 따라야 한다고 주장합니다."
 #Druze
 druze: "드루즈교"
 druze_adj: "드루즈교"
 druze_adherent: "드루즈교도"
 druze_adherent_plural: "드루즈교도"
 druze_desc: "드루즈 산에서 비롯한 드루즈교는 이스마일파의 많은 원칙을 따르지만, 존재의 진실에 초점을 둔 영지주의적 비전 신학 역시 신봉합니다."
 druze_religious_text: "지혜의 서간"
