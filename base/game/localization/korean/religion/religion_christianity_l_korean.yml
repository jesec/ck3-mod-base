 lollard_adherent: "롤라드파 신도"
 lollard_adherent_plural: "롤라드파 신도"
 lollard_desc: "롤라드파는 세례와 고해성사 같은 기독교의 일상적인 성례를 배격하면서 오직 성경만이 기독교 교리의 뿌리이며 성경에 근거하지 않은 가르침은 본질적으로 이단이라고 주장했습니다."
 hussite: "후스파"
 hussite_adj: "후스파"
 hussite_adherent: "후스파 신도"
 hussite_adherent_plural: "후스파 신도"
 hussite_desc: "후스파는 로마가 사도들의 길에서 벗어났다는 강렬한 확신 속에서 탄생한 보헤미아의 개혁 신앙입니다. 후스파는 평신도에게 빵과 포도주를 모두 나누는 성찬, 자국어로 된 성경, 그리고 재산과 세속적 얽매임을 벗어던진 성직자를 요구합니다."
 joachimite: "요아킴파"
 joachimite_adj: "요아킴파"
 joachimite_adherent: "요아킴파 신도"
 joachimite_adherent_plural: "요아킴파 신도"
 joachimite_desc: "요아킴파는 성경과 역사를 모두 세 단계의 계시로 해석하는 종말론적 신비주의 신앙입니다. 이들은 머지않아 성부의 시대와 성자의 시대를 지나, 제도화된 교회가 맨발에 무일푼인 설교자들의 관조적 공동체에 자리를 내주게 될 성령의 시대가 도래한다고 믿습니다."
