 nestorian_adherent_plural: "네스토리우스파 신도"
 nestorian_desc: "예수 그리스도는 신성성과 인간성, 두 요소를 갖췄다 가르치는 네스토리우스파는 주류 기독교계에서 이단으로 낙인찍혔습니다. 그런데도 그 특유의 관점 덕분에 중국, 인도, 심지어는 몽골까지 먼 동방에서 신도가 모여들었습니다."
 nestorian_religious_head_title: "총대주교"
 nestorian_religious_head_title_female: "여총대주교"
 nestorian_religious_head_title_name: "총대주교좌"
 messalian: "메살리아주의"
 messalian_adj: "메살리아주의"
 messalian_adherent: "메살리아주의자"
 messalian_adherent_plural: "메살리아주의자"
 messalian_desc: "신의 본질은 성적 감각을 통해 인지할 수 있다고 믿은 메살리아주의는 전통적인 기독교 성사를 배격하고 비전통적인 예배 방식을 통해 신을 직접 경험하고자 합니다."
 messalian_priest: "완덕자"
 messalian_priest_plural: "완덕자"
 adamites: "아담파"
 adamites_adj: "아담파"
 adamites_adherent: "아담파 신도"
 adamites_adherent_plural: "아담파 신도"
 adamites_desc: "아담파는 옷을 벗어 던짐으로써 아담과 하와의 순수한 본성을 되찾을 수 있다 주장합니다. 또한 순수한 본성을 되찾았기에 자신들의 행동은 선과 악으로 구분할 수 없다 주장하며 절대적 무법 상태에 빠져 삽니다."
