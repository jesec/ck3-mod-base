 waldensian_desc: "발도파는 부의 축적은 구원과 양립할 수 없는 절대 악이라 여기며 사도로서의 가난함만이 완벽으로 가는 길이매 성직자들은 작위도, 영지도 소유해선 안 된다고 설파했습니다. "
