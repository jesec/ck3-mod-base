 investiture_crisis_desc: "교회의 열쇠를 누가 쥘 것인지를 두고 왕권과 교권이 정면으로 맞섭니다.\n\n세속 군주들은 지팡이와 반지를 수여함으로써 고위 성직자들을 서임하지만, 교회는 그 정통성을 인정하지 않습니다."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "다음 공의회: [GetGameTimeDifferenceForDiffDays( Situation.MakeScope.VarRemaining('investiture_council_countdown') )]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](이)가 절정에 이르러 해결되기까지 남은 시간입니다.\n\n제한 시간이 다하면 서임권 공의회가 소집되어 [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] 성직자 임명 [doctrine|E]를 두고 논쟁하고, 투표 결과에 따라 이를 [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName] 또는 [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName] 중 하나로 대체합니다. 세속 [rulers|E]는 $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$ [casus_belli|E]을 사용하거나 [puppets|E]를 확보하는 방식으로 [clergy|E]가 반대편에 표를 던지도록 강제할 수 있습니다."
