 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "새로운 세례가 이어지는 시기. 왕들은 강변 요새와 시장 마을마다 십자가를 세우고, 선교사와 왕의 군대는 국경 지대 사람들의 영혼을 차지하기 위해 경쟁합니다. 한 영주의 개종만으로도 온 민족이 같은 세례대로 향할 수 있습니다."
 reform_phase: "개혁"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "규율과 교회법, 청교도적 열의가 성직자들에게 돌아옵니다. 기독교의 내부 체제가 면밀히 검토되고, 더 순수한 교회를 이루기 위한 대가는 흔히 피로 치러집니다."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
