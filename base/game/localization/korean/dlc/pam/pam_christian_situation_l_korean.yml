 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "[GetRiteByKey('roman_rite').GetAdherentNamePlural] 및 [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] 사이의 분열이 기독교 세계를 얼마나 [Concept( 'schism', '대분열')|E] 방향으로 이끌었는지를 나타냅니다.\n\n불만이 충분히 많이 축적되면 교회가 분리될 수 있습니다. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'christian_faith').GetName](은)는 [Concept( 'schism', '대분열')|E]이 발생하거나, 대분열을 막아내기 전까지는 [head_of_faith|E]를 수립할 수 없음#!\n\n#help 증가 조건:\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName](이)가 [rites|E]에서 [core_tenet|E] 또는 [doctrine|E]를 제거하는 쪽에 투표함\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName] 논쟁 전에 두 교파 사이의 다툼이 발생함\n$BULLET_WITH_TAB$[GetSituation('the_christian_church').GetName]의 일부인 두 교파의 [kings|E] 이상인 인물들 사이에 [war|E] 발발\n$BULLET_WITH_TAB$한 교파의 [holy_site|E]가 다른 교파로 개종\n$BULLET_WITH_TAB$교파의 [holy_site|E] 강등\n$BULLET_WITH_TAB$[head_of_rite|E]가 다른 교파에 살해당함#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "다음 [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName]가 [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] 및 [GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decisions|E], #V $pam_sway_schism_stance_interaction$#! [interaction|E]을 잠금 해제하게 됨"
