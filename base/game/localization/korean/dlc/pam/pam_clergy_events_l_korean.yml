l_korean:
 pam_clergy_events.0001.t: "Quo Nomine Vis Vocari?"
 pam_clergy_events.0001.desc: "내 [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName](이)가 성 베드로의 후계자 명단에서 다음 빈 줄로 시선을 돌렸다. 이는 [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )]의 살아있는 증거나 마찬가지였다.\n\n#emp \"그대가 선택하는 이름은 그대의 시대가 지나도 천 년에 걸쳐 전해질 겁니다.\"#! \n\n[chaplain.GetHerHis|U] 깃펜이 글자가 들어갈 자리를 가리켰다.\n\n#emp \"Quo nomine vis vocari(어떤 이름으로 불리길 원하십니까)?\"#!"
 pam_clergy_events.0001.a: "이 이름이 영원히 알려지게 하라."
 pam_clergy_events.0003.t: "원리 재정립"
 pam_clergy_events.0003.desc: "[pam_recast_pope.GetTitledFirstName] 재임 중 [pam_recast_rite.GetNameNoTooltip]의 핵심 원리 하나가 변경되었다. [tenet_to_remove.GetBaseName](이)가 [tenet_to_add.GetBaseName](으)로 대체되었다."
 pam_clergy_events.0010.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U]의 의지"
 pam_clergy_events.0010.desc.intro: "[cardinalate.GetHolder.GetTitleAsNameNoTooltip]인 나는 거룩하신 [actor.Custom('GetMotherFatherPossessive')|U] 의지의 연장이다.\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "내가 누구보다도 공경하는 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))](이)가 내 손을 잡고 [cardinalate.GetHolder.GetTitleAsNameNoTooltip](으)로서의 책무로 인도했다.\n\n"
 pam_clergy_events.0010.desc: "[actor.GetTitledFirstName](은)는 자신의 끝없는 지혜를 통해, 내가 반드시"
 pam_clergy_events.0010.desc.develop: "[archdiocese.GetName]의 모든 [recipient.GetFaith.GetAdherentNamePlural]들이 번영할 수 있도록 공공사업을 개발해야 한다고 보았다."
 pam_clergy_events.0010.desc.convert_faith: "[archdiocese.GetName] 안팎에서 [ROOT.Char.Custom('GetUnbelieverNamePlural')]들의 개종을 장려하는 임무를 맡아야 한다고 보았다."
 pam_clergy_events.0010.desc.increase_control: "[archdiocese.GetName]의 대중에게 평화를 가져다주는 임무를 맡아야 한다고 보았다."
 pam_clergy_events.0010.desc.cultural_fascination: "[actor.GetHerHis] 동료 [actor.GetCulture.GetCollectiveNoun]를 위한 새로운 기술의 연구를 가속하는 임무를 맡아야 한다고 보았다."
 pam_clergy_events.0010.desc.epidemic_resistance: "[archdiocese.GetName]에서 역병의 완화를 도울 교회 자원을 관리해야 한다고 보았다."
 pam_clergy_events.0010.desc.improve_legitimacy: "[archdiocese.GetName]에서 [recipient.GetFaith.GetAdjective] 군주의 정통성을 강화하는 임무를 맡아야 한다고 보았다."
 pam_clergy_events.0010.desc.undermine_legitimacy: "[archdiocese.GetName]에서 [recipient.GetFaith.GetAdjective] 군주의 정통성을 약화하는 임무를 맡아야 한다고 보았다."
 pam_clergy_events.0010.a: "\"[actor.Custom('FormOfAddressForLiege')], 그렇게 하겠습니다!\""
 pam_clergy_events.0010.b: "십일조 자금을 다른 데 쓰면 더 나을 텐데..."
 pam_clergy_events.0030.t: "하베무스 파팜"
 pam_clergy_events.0030.t.female: "하베무스 마맘"
 pam_clergy_events.0030.desc: "하얀색 연기가 피어오르며 [new_pope.GetCurrentLocation.GetName]의 중심부에서 새로운 [new_pope.GetTitledFirstName]의 탄생을 알렸다.\n\n\"사도 성 베드로와 바울로의 권능과 권세를 믿사오니, 주님 앞에서 우리를 위해 기도해 주시기를. 전능하신 하느님, 성부와 성자와 성령의 축복이 그대에게 임하여 영원히 머물기를.\"\n\n\"아멘.\""
 pam_clergy_events.0030.a: "성 베드로의 성좌에 영광 있기를."
 pam_clergy_events.0030.b: "거짓된 선지자가 나타났군."
 pam_clergy_events.0030.b.tt: "#V 15년#! 동안 [GetDecisionWithKey('declare_antipope_decision').GetName] [decision|E]의 비용이 감소함"
 pam_clergy_events.0030.aa: "누가 교회 일에 신경이나 쓰는가?"
 pam_clergy_events.0030.aa.tt: "향후 하베무스 파팜 이벤트가 메시지 대신 나타날 것임"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName](이)가 [head_of_faith|E]로 선출되었다."
 pam_clergy_events.0040.opening: "경건한 [head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)],"
 pam_clergy_events.0040.desc: "추기경단의 규모가 줄어들었으므로, 그대를 추기경직으로 승격시키는 것이 타당하다고 보오. 이 힘든 시기에 그대의 신앙과 지혜가 교회에 힘을 실어주기를."
 pam_clergy_events.0040.appoint_tt: "당신이 임명된 [cardinal|E]임"
 pam_clergy_events.0040.a: "이 성스러운 짐을 받아들이겠소."
 pam_clergy_events.0041.opening: "성 베드로의 교좌에게,"
 pam_clergy_events.0041.desc: "추기경단이 불완전해진 상황에서, 그대는 가장 경건한 [ROOT.Char.GetWomenMen]이 남긴 자리를 아직 채우지 않았소.\n\n난 교회를 무방비 상태로 내버려둘 생각이 없소! 내가 직접 붉은 모자를 쓰겠소."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U](이)가 자신을 [cardinal|E]으로 선언함"
 pam_clergy_events.0041.a: "이 불손한 짓은 잊지 않겠다."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "추기경단의 자리가 비어 있으며, 교회는 격식을 차리며 기다릴 수만은 없었소. 우리 중에서도 가장 경건한 자 몇몇이 다 함께 붉은 모자를 썼으며, 덕분에 추기경단은 다시 완전해졌소.\n\n서둘렀던 점을 너그러이 용서해 주시길 바라겠소."
 pam_clergy_events.0042.a: "나한테도 빈 추기경단보다 가득 찬 추기경단이 더 낫다."
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "신앙에 일어난 지진"
 pam_clergy_events.0051.desc: "[county.GetNameNoTier|U]의 내 자리가 발밑부터 떨리고 있다. 내가 평생을 바쳐 섬겨온 영혼들은 이제 [new_faith.GetAdherentNamePlural](으)로서 기도한다.\n\n나 또한 개종하고 장악력을 계속 이어가야 할까? [title.GetName]의 사람들을 관리할 수는 있겠지만, 더는 [old_faith.GetAdherentNamePlural]에 속하지 않는 자들을 과연 내가 의미 있게 도울 수 있을까? 모두가 강제로 [new_faith.GetNameNoTooltip](을)를 실천하게 된다면, 좋은 결과가 나오기는 할까?!"
 pam_clergy_events.0051.a: "내 양 떼를 섬기는 데 필요한 일이라면 뭐든 하겠다."
 pam_clergy_events.0051.a.keep_see_tt: "[title.GetName]의 장악력을 유지함"
 pam_clergy_events.0051.b: "나는 동료 [old_faith.GetAdherentNamePluralNoTooltip]만 섬긴다."
 pam_clergy_events.0051.b.tt: "당신의 모든 [landed|E] [titles|E]가 파괴됨"
 pam_clergy_events.0051.c: "내 직위의 종말을 받아들인다."
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER 당신이 [adventurer|E] [camp|E]를 건립하게 됨#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER 당신의 [game_over|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "[title.GetNameNoTooltip]의 끝"
 pam_clergy_events.0052.desc: "결국 그렇게 되었다. 나는 더 이상 [title.GetDefinitiveName]의 정당한 목자가 될 수 없다. 한때 교회가 내 손에 쥐여주었던 것이지만, 이제는 내 손에서 빠져나가게 되었다."
 pam_clergy_events.0052.a: "그렇게 됐군."
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "성 베드로의 성좌에 앉은 [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.head_of_faith: "[new_prelate.GetDynasty.GetNameNoTooltip] [new_prelate.GetFaith.ReligiousHeadName|U]"
 pam_clergy_events.0060.t.antipope: "[new_prelate.GetFaith.ReligiousHeadTitleName|U](을)를 차지한 [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.archbishop: "목장을 든 [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.desc.intro: "우리는 왕좌에서든, 설교대에서든 기독교 세계를 이끌 방법을 모색해 왔다. 이제 [new_prelate.GetFaith.HighGodName|U]께서 [new_prelate.GetDynasty.GetName](을)를 새로운 차원으로 높여 주시기로 한 모양이다.\n\n"
 pam_clergy_events.0060.desc.pope: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName](이)가 성 베드로의 성좌에 앉게 되었으며, 이 지상에서 [new_prelate.GetFaith.HighGodNamePossessive] 대리자가 되었다."
 pam_clergy_events.0060.desc.head_of_faith: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName](이)가 [prelate_title.GetDefinitiveName](을)를 차지했다."
 pam_clergy_events.0060.desc.hof_outro: "왕과 황제도 거룩하신 [new_prelate.Custom('GetMotherFatherPossessive')|U] 의지가 드리우는 그림자 속에서는 아이에 불과하다. 이제 [new_prelate.GetFaith.BishopMalePlural] 군단이 [new_prelate.GetDynasty.GetNameNoTooltip]의 명령을 따른다."
 pam_clergy_events.0060.desc.antipope: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName](이)가 아직 다른 이의 차지인 [new_prelate.GetFaith.ReligiousHeadName|U]의 자리를 본인의 것으로 선언했다. 이제 모든 [new_prelate.GetFaith.GetAdherentName](은)는 누가 [new_prelate.GetFaith.HighGodName|U]의 대리인인지 선택해야만 한다. 이 문제가 해결되기 전까지, 우리 모두의 영혼은 위태로운 상황에 놓이게 되었다."
 pam_clergy_events.0060.desc.archbishop: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName](이)가 [prelate_title.GetDefinitiveName]에 임명되었다. 이제 십일조, 수도원, [new_prelate.GetHerHim] 아래의 모든 [new_prelate.GetFaith.BishopNeuter] 축성은 [new_prelate.GetDynasty.GetNameNoTooltip]의 인도를 받는다."
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.GetHerHis|U] 신앙은 [new_prelate.GetFaith.GetNameNoTooltip](이)며 [ROOT.Char.GetFaith.GetNameNoTooltip](은)는 아니지만, 우리는 다 같은 가족이다."
 pam_clergy_events.0060.a: "교회와 [new_prelate.GetDynasty.GetNameNoTooltip]에게 축복이 있기를."
 pam_clergy_events.0060.a.antipope: "나한테 넘어올 분쟁은 아니군."
 pam_clergy_events.0060.b: "[prelate_title.GetDefinitiveNameNoTooltip](을)를 더 자세히 살펴봐 주면 좋겠는데."
 pam_clergy_events.0060.b.antipope: "나만이 이 위기를 해결할 수 있다."
 pam_clergy_events.0060.b.tt: "@warning_icon! 현재 인물을 포기하게 되며, 나중에 해당 인물로 다시 플레이할 수 없음.\n\n#TUT [new_prelate.GetShortUINameNoTooltip](이)가 사망하면 당신은 해당 [ecclesiastical|E] 직위를 [dynasty|E] 승계가 아니라 [appointment|E] 또는 선거로 상속받은 [player_heir|E]로 플레이하게 됨.#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U](이)가 당신의 신앙을 공유하지 않음. 당신이 계속 [new_prelate.GetFaith.GetAdherentName](으)로 진행하게 됨."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U](이)가 선거가 아니라 저항을 통해 직위를 보유하고 있음. 이 명분에 반대하는 모든 이가 직위를 차지하러 나설 것임."
