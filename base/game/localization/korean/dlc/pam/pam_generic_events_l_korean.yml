l_korean:
 pam_generic_events.0001.t: "신앙의 학자"
 pam_generic_events.0001.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](은)는 내가 [ROOT.Char.GetFaith.HouseOfWorship]에 들어왔을 때도 강의에 집중하고 있었다.\n\n\"아, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [chaplain.GetSheHe]가 마침내 나를 알아보았다. \"혹시 [ROOT.Char.GetFaith.HighGodName]의 말씀에 대한 흥미가 있으십니까? 제가 가르쳐 드릴 수도 있는데.\""
 pam_generic_events.0001.a: "노력을 들일 만하겠군."
 pam_generic_events.0001.b: "이미 통치에 온 신경을 집중해야 하는 상황인데."
 pam_generic_events.0002.t: "저는 착한 사람인가요?"
 pam_generic_events.0002.desc.intro: "촛불이 꺼진 지 한참 뒤에 내 [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )] [doubting_child.GetFirstName](이)가 방으로 들어왔다. 아이의 뺨을 타고 눈물이 흘러내리고 있었다.\n\n\"저는 착한 사람인가요?\" 아이가 속삭였다. \"제 존재가 죄악이라면..."
 pam_generic_events.0002.desc.sin: "정말 #EMP 역겹도록#! [sinful_trait.GetName( ROOT.Char )|l] 사람이라면..."
 pam_generic_events.0002.desc.sp: "제 영혼이 너무 공허하게 느껴진다면..."
 pam_generic_events.0002.desc.outro: "[ROOT.Char.GetFaith.HighGodName]께서 어떻게 저를 원하시겠어요?\""
 pam_generic_events.0002.a: "널 부끄럽게 하는 것을 버려라."
 pam_generic_events.0002.b: "넌 이미 사랑받고 있단다."
 pam_generic_events.0002.c: "그렇다면 기도하자."
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U](이)가 본인의 선량함을 의심하는 [TARGET_CHARACTER.GetShortUIName](을)를 위로함"
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 본인의 선량함을 의심하는 [CHARACTER.GetShortUIName](을)를 위로함"
 pam_generic_events.0003.t: "당신의 본질"
 pam_generic_events.0003.desc: "해가 지고 난 뒤, 내 [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )] [worried_spouse.GetFirstName](이)가 생울타리 사이에서 나를 기다리고 있었다. [worried_spouse.GetHerHis|U] 두 손이 무릎 위에서 비틀리고 있었다.\n\n\"그대는 너무 #EMP [sinful_trait.GetName( ROOT.Char )|l]#! 사람이에요.\" [worried_spouse.GetSheHe]가 낮은 목소리로 말했다. \"우리 둘 다 [ROOT.Char.GetFaith.HighGodName] 앞에서 부끄러운 존재가 되잖아요. 어떻게 그렇게 자기 신앙을 무심하게 여기는 건가요? 이게 그대한테 어떤 영향을 미치는지 모르겠어요?\""
 pam_generic_events.0003.a: "그대를 위해 만회해야겠군."
 pam_generic_events.0003.b: "[ROOT.Char.GetFaith.HighGodName]께서 날 이렇게 만드셨다오."
 pam_generic_events.0003.c: "걱정이 너무 많구려."
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUIName]에게 자신의 방식을 바로잡고 순례를 떠나겠다고 약속함"
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName]에게 자신의 방식을 바로잡고 순례를 떠나겠다고 약속함"
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUIName|U](은)는 변해야 한다는 [TARGET_CHARACTER.GetShortUIName]의 간청에도 불구하고 회개를 거부함"
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](은)는 변해야 한다는 [CHARACTER.GetShortUIName]의 간청에도 불구하고 회개를 거부함"
 pam_generic_events.0004.t: "어둠 속의 빛"
 pam_generic_events.0004.desc: "[ROOT.Char.GetFaith.HouseOfWorship](은)는 텅 비었다. 기둥 사이를 안개가 채웠고, [deceased.GetDeathReasonHideKiller]했던 내 [ROOT.Char.Custom2( 'RelationToMeShort', deceased )] [deceased.GetFirstName]의 추억 주위에서 촛불이 일렁였다.\n\n내 [ROOT.Char.Custom2( 'RelationToMeShort', comforter )] [comforter.GetFirstName](이)가 나와 소매가 스칠 정도로 가깝게 앉았다. \"비탄은 길입니다.\" [comforter.GetSheHe]가 부드럽게 말했다. \"그 길을 걸어가다 보면, 끝에서 [ROOT.Char.GetFaith.PositiveAfterLife](이)가 기다리고 있을 겁니다.\""
 pam_generic_events.0004.a: "나였다! #EMP 내가#! 저질렀다고!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP 내 아버지 집에 거할 곳이 많도다#!"
 JOHN_14_2_GLOSS: "#weak 요한복음 14장 2절, 개역한글판#!"
 pam_generic_events.0004.c: "그렇다면 기도하자."
 pam_generic_events.0004.d: "갑시다. 고인을 기리며 술을 마셔야지."
 pam_generic_events.0005.t: "충직한 주먹"
 pam_generic_events.0005.desc: "\"어떻게 #EMP 감히#!!?\"\n\n내 [ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )] [loyal_vassal.GetTitledFirstName](이)가 검을 이미 반쯤 뽑아 든 채 의회실로 성큼성큼 들어왔다.\n\n\"[clerical_holder.GetTitledFirstName](이)가 감히 그대를 내쫓다니요?\" [loyal_vassal.GetSheHe|U]는 바닥에 침을 뱉었다. \"[clerical_region.GetName]에 부하들이 있습니다. 명령만 내리시면 [clerical_holder.GetHerHim]를 찾아가겠습니다.\""
 pam_generic_events.0005.a: "좋다, 가라."
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName](이)가 [clerical_holder.GetCapitalLocation.GetName](으)로 여행하게 됨. [loyal_vassal.GetHerHis] 귀환 시 당신이 [dread|E] 및 [GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName] [vassal|E] [opinion|E]을 획득하게 됨."
 pam_generic_events.0005.b: "더 영리한 방법도 있지."
 pam_generic_events.0005.b.tt: "#V 15년#! 동안 [clerical_holder.GetShortUIName](을)를 대상으로 하는 [GetScheme('murder').GetTypeName] [schemes|E]에 #P 막대한#! 보너스가 적용됨"
 pam_generic_events.0005.c: "다른 쪽 뺨도 내어주라는 가르침을 받았다."
 pam_generic_events.0005.c.tt: "#V 10년#! 동안 #V $declaration_of_repentance_interaction$#! [character_interaction|E] 승낙 확률 #P +20#! 증가"
 pam_generic_events.0005.c.tt2: "향후 #V 10년#! 동안 #V $lift_excommunication_interaction$#! [character_interaction|E]이 높은 확률로 당신을 대상으로 사용됨"
 pam_turned_the_other_cheek_accept_reason: "다른 뺨을 내밀었음"
 PAM_GENERIC_0005_MURDER_BONUS: "충직한 봉신이 해당 대상의 직할령에 부하를 두고 있음: $VALUE|+0=$"
 pam_generic_events.0007.opening: "[ROOT.Char.GetTitledFirstName]에게"
 pam_generic_events.0007.desc: "처리했습니다. [clerical_holder.GetTitledFirstName](을)를 찾아, 피를 흘리게 한 뒤 두고 왔습니다."
 pam_generic_events.0007.a: "좋다."
 pam_generic_events.0008.t: "어둠 속의 목소리"
 pam_generic_events.0008.desc: "침실로 비틀거리며 향하는데, 아까 먹은 저녁이 아직도 배에 얹힌 기분이 들었다. 시야가 흐려지더니 발밑에서 복도가 기울어졌다.\n\n그러더니... 목소리가 들렸다. \"[virtuous_trait.GetName( ROOT.Char )|l] [ROOT.Char.GetTitleAsNameNoTooltip|l]...\" 목소리가 이렇게 말했다. \"참으로 덕이 높군. 네 주인을 기쁘게 하는구나.\"\n\n정말 [ROOT.Char.GetFaith.HighGodName]인가? 아니면 아파서 헛것을 느끼는 걸까?"
 pam_generic_events.0008.a: "그래. #EMP 이거지!!#!"
 pam_generic_events.0008.b: "그분이 틀림없다!"
 pam_generic_events.0008.c: "오래된 힘이 움직이고 있다..."
 pam_generic_events.0008.d: "가끔 무슨 음식을 먹으면 이러더군."
 pam_generic_events.0008.e: "혹시... 뭘 잘못 먹어서 이러나?"
 pam_generic_events.0008.f: "혹시 모르니 기도하는 게 낫겠다."
 pam_generic_events.0009.t: "지옥의 불길"
 pam_generic_events.0009.desc: "나는 흠뻑 젖은 채 잠에서 깼다. 갈비뼈 안에서 심장이 마구 뛰었다.\n\n꿈에서 나는 불타고 있었다. 살이 버터처럼 녹아 뼈에서 흘러내렸다. \"[sinful_trait.GetNameNoTooltip( ROOT.Char )|U] 자! [sinful_trait.GetNameNoTooltip( ROOT.Char )|U] 자!\" 악마 무리가 나를 향해 외쳐댔다.\n\n[ROOT.Char.GetFaith.NegativeAfterLife]의 불길이 나를 집어삼켰으며, 오직 내 비명밖에 들리지 않았다."
 pam_generic_events.0009.a: "채찍이 길을 보여주리라."
 pam_generic_events.0009.b: "육신은 육신으로 갚아야 하는 법."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP 죄인들아 손을 깨끗이 하라 마음을 성결케 하라#!"
 JAMES_4_8_GLOSS: "#weak 야고보서 4장 8절, 개역한글판#!"
 pam_generic_events.0009.d: "[comforting_courtier.GetTitledFirstName]하고 얘기하면 항상 도움이 되더군."
 pam_generic_events.0009.e: "꿈은 꿈일 뿐이다."
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U](이)가 지옥의 악몽을 꾼 뒤 [TARGET_CHARACTER.GetShortUIName]에게 위안을 얻음"
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 지옥의 악몽을 꾼 뒤 [CHARACTER.GetShortUIName]에게 위안을 얻음"
 pam_generic_events.0010.t: "축복받은 사냥"
 pam_generic_events.0010.desc: "탁 트인 [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')](이)가 우리를 맞이했다. 수십 마리의 말들이 달리는 소리가 우레처럼 뒤를 따라왔다. [hunting_ruler.GetName](이)가 자랑스럽게 이들을 이끌었다.\n\n#EMP \"정지!\"#! [hunting_ruler.GetSheHe|U]가 맞이하듯 손을 들어 올리자 [hunting_ruler.GetHerHis] 종사단이 멈추었다. \"이 날씨를 주시고, 우리가 사냥할 사냥감을 주시는 [ROOT.Char.GetFaith.HighGodName](을)를 찬양하라!\" [hunting_ruler.GetSheHe|U]가 외쳤다."
 pam_generic_events.0010.a: "괜찮다면 조언 하나 하지..."
 pam_generic_events.0010.b: "그대의 눈이 창끝처럼 예리하기를."
 pam_generic_events.0010.b.success: "당신의 찬사가 받아들여짐"
 pam_generic_events.0010.b.failure: "당신의 찬사가 허사로 돌아감"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetSheHe|U]가 당신의 찬사를 진심으로 받아들임"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetSheHe|U]가 당신의 공허한 아첨에 발끈함"
 pam_generic_events.0010.b.tt: "#V 10년#! 동안 [hunting_ruler.GetTitledFirstName](이)가 높은 확률로 #high $negotiate_alliance_interaction$#! [character_interaction|E]을 수락함"
 pam_generic_events.0010.c: "찬양하라!"
 pam_generic_events.0010.d: "길을 떠날 수 있도록 기수 몇 명을 빌려주시오."
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U](이)가 사냥에서 [TARGET_CHARACTER.GetShortUINamePossessive] 기술을 칭찬함"
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 사냥에서 [CHARACTER.GetShortUINamePossessive] 기술을 칭찬함"
 pam_praised_hunting_alliance_accept_reason: "내 사냥을 칭찬함"
 pam_generic_events.0011.t: "죄악의 얼룩"
 pam_generic_events.0011.desc: "[sinful_courtier.GetTitledFirstNamePossessive] 사특한 행위가 너무 오래도록 이어져 왔다. 궁정이 [sinful_courtier.GetHerHis] [sinful_trait.GetName( ROOT.Char )|l] 행동에 대한 소문으로 부산하다. [sinful_courtier.GetSheHe]가 지나갈 때마다 시종들이 물러나는 모습도 보았다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" 내가 서재로 들어서자 [sinful_courtier.GetSheHe|U]가 외치며 [sinful_courtier.Custom('quirk_neg_pp')]. \"뵙게 되어 영광입니다.\""
 pam_generic_events.0011.a: "그대는 [sinful_trait.GetNameNoTooltip( ROOT.Char )|l] 방식을 버려야 한다."
 pam_generic_events.0011.b: "[ROOT.Char.GetFaith.HighGodName]께서 가르쳐 주시는 교훈에 귀를 기울여라."
 pam_generic_events.0011.b.success: "교훈을 깊이 받아들임"
 pam_generic_events.0011.b.failure: "상대가 교훈을 배우지 않음"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetSheHe|U]가 자신이 저지른 죄악의 무게를 느낌"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetSheHe|U]가 당신의 가르침을 흘려넘김"
 pam_generic_events.0011.c: "이러면 그대한테도 좋을 게 없다네..."
 pam_generic_events.0011.c.success: "온화한 조언에 상대가 누그러짐"
 pam_generic_events.0011.c.failure: "당신의 온화함이 경멸을 사기만 함"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.GetSheHe|U]가 당신의 배려에 마음이 움직임"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetSheHe|U]가 당신의 친절을 나약함으로 받아들임"
 pam_generic_events.0011.d: "그렇게 중요한 문제는 아닌 것 같군."
