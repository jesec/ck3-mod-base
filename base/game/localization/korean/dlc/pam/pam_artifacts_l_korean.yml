l_korean:
 artifact_pedestal_bible_name: "$artifact_name_prefix$ 성경"
 artifact_pedestal_bible_description: "보석으로 장식한 표지로 제본된 채색 성경. 모든 구절을 인내와 정성을 다해 손으로 필사했습니다."
 artifact_pedestal_thurible_name: "$artifact_name_prefix$ 향로"
 artifact_pedestal_thurible_description: "정교하게 세공한 향로를 윤이 나는 사슬에 매달아 흔듭니다. 불을 붙이면 향기로운 향연이 전당을 가득 채우며 기도를 하늘로 실어 나릅니다."
 artifact_pedestal_situla_name: "$artifact_name_prefix$ 시툴라"
 artifact_pedestal_situla_description: "화려하게 장식한 성수 용기. 행렬에서 들고 다니며 신자들에게 축복의 성수를 뿌리는 데 사용합니다."
 artifact_pedestal_crozier_name: "$artifact_name_prefix$ 목장"
 artifact_pedestal_crozier_description: "주교가 사용하는 목장. 신자들을 인도하고 길을 벗어난 자들을 재촉하는 목자의 지팡이 모양으로 만들었습니다."
