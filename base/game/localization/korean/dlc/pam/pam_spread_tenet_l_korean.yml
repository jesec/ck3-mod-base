l_korean:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "원리 포교"
 spread_personal_tenet_intent_desc: "당신은 가르침에 귀를 기울이는 문객들에게 자신의 [personal_tenet|E]를 설파하여, 이를 자신의 원리로 받아들이게 하고 [tenet_popularity|E]를 높이고자 합니다."
 spread_personal_tenet_intent_not_valid_desc: "더 이상 [personal_tenet|E]를 따르지 않음"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "문객이 참여하는 [activities|E]에서#EMP $spread_personal_tenet_intent$#! [intent|E]를 잠금 해제하여 [tenet_popularity|E]를 높일 수 있음"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U](이)가 [second.GetShortUINameNoTooltip](을)를 설득함"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U](이)가 [second.GetShortUINameNoTooltip](을)를 설득함"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\n하지만 내가 마음속 깊이 품은 것은 내 신앙이 규탄하는 믿음, [spread_tenet.GetBaseName](이)다. 여기서 이를 입에 올리는 순간, 내 운명은 이 말을 듣는 모든 이의 손에 달리게 된다."
 pam_spread_tenet_option_scripture: "경전 자체가 내 말을 뒷받침한다."
 pam_spread_tenet_option_preach: "내가 믿는 진리에 귀를 기울여라!"
 pam_spread_tenet_option_forbidden: "진실이라면 위험을 감수할 만하다. 가까이 오라."
 pam_spread_tenet_option_decline: "다음에 기회가 되면."
 pam_spread_tenet_forbidden_flavor: "내 말에 귀를 기울이는 이들이 모두 선의를 품고 있는 것은 아니다..."
 pam_spread_tenet_overheard_toast: "달갑지 않은 청자"
 pam_spread_tenet_events.0001.t: "식탁의 대화"
 pam_spread_tenet_events.0001.desc: "식탁에는 [ROOT.Char.Custom('GetExpensiveMeal')](이)가 상이 휘어질 만큼 차려져 있고, 연회장에는 건배와 웃음소리가 가득하다.\n\n\"신앙에 관해 오랫동안 숙고해 오신 분처럼 말씀하시는군요.\" [pam_spread_listener_1.GetTitledFirstName](이)가 [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')] 접시 너머로 몸을 기울이며 말한다. \"더 들려주시지요.\"\n\n식탁이 조용해진다. 모두 호의적으로 귀를 기울일 준비가 되어 있다..."
 pam_spread_tenet_events.0101.t: "모닥불 근처에서"
 pam_spread_tenet_events.0101.desc: "사냥 중 잠깐의 휴식이다. 우리는 불가에 바짝 모여 앉아 있다. 꼬챙이에 꿴 [ROOT.Char.Custom('GetRandomRegionalSmallGame')]에서는 육즙이 뚝뚝 떨어진다.\n\n\"이런 추격을 하고 있으면 영혼도 더 숭고한 것을 향하게 되지요.\" [pam_spread_listener_1.GetTitledFirstName](이)가 불꽃에서 눈을 떼지 않은 채 중얼거린다.\n\n불빛과 정적, 그리고 귀 기울여 들으려는 이들이 모여 있다."
 pam_spread_tenet_events.0201.t: "시합 사이"
 pam_spread_tenet_events.0201.desc: "시합 사이 경기장은 텅 비어 있다. 종자들이 산산이 부서진 랜스를 치우는 동안 군중은 그늘을 찾아 삼삼오오 잡담을 나눈다.\n\n\"승자는 모두 [ROOT.Char.GetFaith.HighGodName]께 감사하고, 패자는 모두 [ROOT.Char.GetFaith.DevilName](을)를 저주하지요.\" 곁에 있던 [pam_spread_listener_1.GetTitledFirstName](이)가 농을 던진다. \"그중 왜 그런지 생각해 보는 사람이 있기는 할까요?\"\n\n잠깐의 소강, 할 일 없이 앉아 있는 귀인들, 그리고 허공에 맴도는 질문 하나가 모여 있다."
 pam_spread_tenet_events.0301.t: "신념에 건배"
 pam_spread_tenet_events.0301.desc: "신혼부부를 위해, 아직 태어나지 않은 후계자를 위해 잔을 들고 또 든다.\n\n\"그리고 모든 영혼을 하나로 이어 주시는 [ROOT.Char.GetFaith.HighGodName](을)를 위하여!\" [pam_spread_listener_1.GetTitledFirstName](이)가 한마디 보태자 여기저기서 동조하는 소리가 들린다.\n\n이곳 사람들의 마음은 사랑과 희망, 성스러운 것들을 향해 열려 있다. 지금 건네는 말이라면 마음속에 뿌리를 내릴 것이다."
 pam_spread_tenet_events.0401.t: "빈소에서 나눈 이야기"
 pam_spread_tenet_events.0401.desc: "조문객들은 여기저기 무리를 지어 고인과 우리 모두를 기다리는 운명에 관해 나지막이 이야기를 나눈다.\n\n\"누구에게나 찾아오지요.\" [pam_spread_listener_1.GetTitledFirstName](이)가 내 곁에서 조용히 말한다. \"그러면서도 우리는 하찮은 일을 두고 다투고요.\"\n\n슬픔 앞에서는 영혼도 열리기 마련이다..."
