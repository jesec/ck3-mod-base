 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "새로운 성자"
 pam_saint_events.0003.t_va: "새로운 [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]"
 pam_saint_events.0003.desc_saint: "마침내 이루어졌다. [saint_candidate.GetFirstName](은)는 성자의 반열에 올라 [consecration_province.GetName]에 봉헌되었다. [saint_candidate.GetHerHis] 빛이 앞으로 대대로 나의 동료 [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip]들에게 축복을 내리기를."
 pam_saint_events.0003.desc_va: "마침내 이루어졌다. [saint_candidate.GetFirstName](은)는 [saint_candidate.Custom('PamBlessedOnesOrAncestors')]의 반열에 올라 [consecration_province.GetName]에 [saint_candidate.Custom('PamConsecratedEnshrined')]되었다. [saint_candidate.GetHerHis] 빛이 앞으로 대대로 우리 봉역에 축복을 내리기를."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "하느님께 감사드리나이다."
 pam_saint_events.0003.a_va: "감사를 올립니다."
 pam_saint_events.0003.a.dynasty_opinion_tt: "당신과 같은 [faith|EU]을 따르는 [dynasty|E] 구성원이 20년 동안 당신을 향한 [Concept('opinion','의견')|E]을 #P 20#!만큼 획득함"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "시성 거부"
 pam_saint_events.0004.t_va: "공경 거부"
 pam_saint_events.0004.desc: "[saint_candidate.GetFirstName]을 [GetPlayer.Custom('PamCanonizeVenerateVerb')]해 달라는 우리의 탄원을 [petition_recipient.GetTitledFirstName](이)가 거부했다. 오늘 [saint_candidate.GetSheHe|U]는 [GetPlayer.Custom('PamBlessedOnesOrAncestors')]의 반열에 들지 못하리라."
 pam_saint_events.0004.a: "어쩔 수 없지."
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "성유물함 준비"
 pam_saint_events.0005.desc: "[extract_site.GetName]에서 경건한 이들이 엄숙한 작업에 착수하여, [relic_saint.GetShortUIName]의 축복받은 유해에서 성스러운 성유물을 취하고 있다.\n\n이 신성한 순간을 기념하기 위한 준비가 한창이다."
 pam_saint_events.0005.a: "지극한 경의를 다해 행하도록 하라."
 pam_saint_events.0005.a.tt: "곧 [extract_site.GetName]에서 [relic_saint.GetShortUIName]의 [Concept('artifact','성유물')|E]을 취하게 됨"
 # The relic is drawn
 pam_saint_events.0006.t: "신성한 성물"
 pam_saint_events.0006.desc_relic: "[extract_site.GetName]에 [GetPlayer.Custom('PamConsecratedEnshrined')]된 [relic_saint.GetFirstName]의 성스러운 유해에서 성유물을 취했으니, 바로 #EMP [relic_artifact.GetName]#!(이)다. 이 성유물이 앞으로 대대로 내 봉역의 신자들에게 축복을 내리기를."
 pam_saint_events.0006.desc: "[extract_site.GetName]에 [GetPlayer.Custom('PamConsecratedEnshrined')]된 [relic_saint.GetFirstName]의 성스러운 유해에서 우리 봉역에 축복을 내릴 [Concept('artifact','성유물')|E]을 취했다."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "하느님께 영광을!"
 pam_saint_events.0006.a_va: "감사를 올립니다."
 pam_saint_events.0006.a.tt: "[relic_artifact.GetName](을)를 취했으며, 이제 당신이 보관함."
 pam_dulia_relic_dynasty_prestige_tt: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] 원리에서:"
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] 원리로 인해, 당신의 [faith|E]을 따르는 모든 [ruler|E]가 #EMP 5#!년 동안 $pam_dulia_new_saint_modifier$를 획득함"
 pam_dulia_new_saint_message_t: "새로운 중보자"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.GetTitledFirstName](이)가 성인의 반열에 올랐으며, [pam_new_saint.GetFaith.GetName] 신자들에게는 하느님 앞에서 전구할 이가 생겼습니다."
