l_korean:
 # Canonizing Saints
 # Christian faiths use Saint/Canonize wording; religions with an attested term for the venerated dead use it (Wali, Divus, Siddha, Kami - see pam_saint_custom_loc.txt); everything else uses Venerated Ancestor/Venerate (matches the vanilla saint trait and 20_pam_flavorization.txt). Three mechanisms: (1) scopeless keys pick the _saint/_va variant via SelectLocalization on the local player's religion, and the _va branch pulls its per-religion noun from a custom loc on GetPlayer; (2) scope-bearing keys whose only divergence is a single word/phrase swap just that fragment via a custom loc, keeping the sentence one key so its saved scopes stay live (called on the saint's scope where one exists, so gendered terms resolve); (3) clause-level scope-bearing keys (petition_sent, 0001.a.tt, 0002.desc, 0003.desc) keep the _saint/_va split and branch in script (triggered_desc), because their wording diverges across several phrases and they lean on multiple saved scopes a custom loc can't carry.
 # Canonize decision
 pam_canonize_saint_decision: "[GetPlayer.Custom('PamVenerateObjectTitle')] [GetPlayer.Custom('PamCanonizeVenerateVerb')|U]"
 pam_canonize_saint_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_desc_saint', 'pam_canonize_saint_decision_desc_va' )]"
 pam_canonize_saint_decision_desc_saint: "세상을 떠난 친족 중 한 명을 거룩한 성인으로 인정받도록 천거하여, 축성한 뒤 빛 속에서 영면하게 하리라."
 pam_canonize_saint_decision_desc_va: "세상을 떠난 친족 중 한 명을 [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')](으)로 추앙하고, 그 유해를 마땅한 예를 갖춰 [GetPlayer.Custom('PamConsecratedEnshrined')]하리라."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "세상을 떠난 당신의 [dynasty|EU] 구성원을 [sainthood|EU]의 반열에 올림."
 pam_canonize_saint_decision_tooltip_va: "세상을 떠난 당신의 [dynasty|EU] 구성원을 [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]의 반열에 올림."
 pam_canonize_saint_decision_confirm: "안식처 선택"
 pam_canonize_saint_decision_req_candidate: "아직 공경받지 않았으며 [sinful|EU] 특성이 없고 [virtuous|EU] 특성이 하나 이상 있는 당신의 [dynasty|EU] 출신 #EMP 고인#! 조상"
 pam_canonize_saint_decision_req_site: "대상을 축성할 수 있는 [Concept('ecclesiastical_domicile_building','대성당')|E]이 있는 당신의 [realm|EU] 내 [Concept('ecclesiastical_domicile','교회 장원')|E], 또는 모든 장소가 이미 사용 중인 경우 인접 속주"
 pam_canonize_saint_decision_req_site_holy_site: "대상을 축성할 수 있는 당신의 [realm|EU] 내 당신의 [faith|EU]의 [Concept('holy_site','성지')|E], 또는 모든 장소가 이미 사용 중인 경우 인접 속주"
 pam_canonize_saint_decision_canonize_tt: "선택한 고인 가주의 유해를 [GetPlayer.Custom('PamConsecratingEnshrining')]하여 [GetPlayer.Custom('PamCanonizeVenerateVerb')|U]함"
 pam_canonize_saint_decision_choose_1_tt: "대상을 축성할 당신의 [realm|EU] 내 [Concept('ecclesiastical_domicile_building','대성당')|E]을 선택함"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "대상을 축성할 당신의 [realm|EU] 내 당신의 [faith|EU]의 [Concept('holy_site','성지')|E]를 선택함"
 # Clause-level split kept in script (triggered_desc): three phrases diverge and the sentence needs saint_candidate / consecration_province / petition_recipient, which a custom loc can't all carry.
 pam_canonize_saint_petition_sent_tt_saint: "[saint_candidate.GetFirstName](을)를 거룩한 [Concept('canonized','성자')|E]로 인정하고 [consecration_province.GetName]에서 축성하기 위한 청원이 승인을 위해 [petition_recipient.GetTitledFirstName]에게 전달됨"
 pam_canonize_saint_petition_sent_tt_va: "[saint_candidate.GetFirstName](을)를 [saint_candidate.Custom('PamVeneratedSaintOrAncestor')](으)로 공경하고 [consecration_province.GetName]에 [GetPlayer.Custom('PamConsecratedEnshrined')]하기 위한 청원이 승인을 위해 [petition_recipient.GetTitledFirstName]에게 전달됨"
 # Sentence stays a single key (saint_candidate / canonizer saved scopes stay live via custom_tooltip); only the canonize/venerate verb swaps, via the PamCanonizeVenerateVerb custom loc.
 pam_canonize_saint_hof_chance_tt: "[saint_candidate.GetShortUIName]의 고결한 [traits|E] 수를 기준으로 판단할 때, [GetPlayer.Custom('PamCanonizeVenerateVerb')]해 달라는 청원을 [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName](이)가 대략 #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#! 확률로 받아들임"
 pam_canonize_saint_hof_chance_cynical_tt: "[saint_candidate.GetShortUIName]의 고결한 [traits|E] 수를 기준으로 판단하되 [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName]의 냉소적인 성향까지 고려하면, [GetPlayer.Custom('PamCanonizeVenerateVerb')]해 달라는 청원을 [canonizer.GetFaith.GetReligiousHead.GetSheHe]가 대략 #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance_cynical')|0%]#! 확률로 받아들임"
 pam_canonize_saint_hof_chance_puppet_tt: "[canonizer.GetFaith.GetReligiousHead.GetTitledFirstName](이)가 당신의 지시를 따르므로, [saint_candidate.GetShortUIName]에 대한 [GetPlayer.Custom('PamCanonizeVenerateVerb')] 청원은 #EMP 반드시#! 승인됨"
