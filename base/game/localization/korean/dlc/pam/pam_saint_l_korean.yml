 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "[relic_creator_saint.GetShortUINameNotMe]의 축복받은 유해에서 취한 성스러운 손가락을 모신 정교한 성유물함입니다."
 pam_saint_relic_tooth_desc: "[relic_creator_saint.GetShortUINameNotMe]의 축복받은 유해에서 취한 성스러운 치아를 모신 정교한 성유물함입니다."
 pam_saint_relic_rib_desc: "[relic_creator_saint.GetShortUINameNotMe]의 축복받은 유해에서 취한 성스러운 갈비뼈를 모신 정교한 성유물함입니다."
 pam_saint_relic_hair_desc: "[relic_creator_saint.GetShortUINameNotMe]의 성스러운 머리카락 한 타래를 모신 정교한 성유물함입니다."
 pam_saint_relic_vestment_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 생전에 입었던 제의의 일부를 모신 정교한 성유물함입니다."
 pam_saint_relic_hand_desc: "[relic_creator_saint.GetShortUINameNotMe]의 축복받은 유해에서 보존된 성스러운 손을 모신 정교한 성유물함입니다."
 pam_saint_relic_arm_desc: "[relic_creator_saint.GetShortUINameNotMe]의 축복받은 유해에서 보존된 거룩한 팔을 모신 정교한 성유물함입니다."
 pam_saint_relic_skull_desc: "[relic_creator_saint.GetShortUINameNotMe]의 공경받는 두개골을 모신 정교한 성유물함입니다."
 pam_saint_relic_blood_desc: "[relic_creator_saint.GetShortUINameNotMe]의 성스러운 피가 담긴 작은 병을 모신 정교한 성유물함입니다."
 pam_saint_relic_heart_desc: "[relic_creator_saint.GetShortUINameNotMe]의 성스러운 심장을 모신 정교한 성유물함입니다."
 pam_saint_relic_effigy_desc: "[relic_creator_saint.GetShortUINameNotMe]의 모습을 본떠 만들어 공경받는 성상으로, 신자들의 공경을 받고 있습니다."
 pam_saint_relic_letter_desc: "[relic_creator_saint.GetShortUINameNotMe]의 편지를 모신 정교한 성유물함입니다."
 pam_saint_relic_drawing_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 직접 그린 유명한 그림입니다."
 pam_saint_relic_stationery_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 사용했던 문구류 한 벌입니다. 소지자에게 그분과 같은 지혜를 가져다준다는 얘기가 있습니다."
 pam_saint_relic_ash_desc: "[relic_creator_saint.GetShortUINameNotMe]의 성스러운 유골을 모신 정교한 성유물함입니다."
 pam_saint_relic_canopic_jar_desc: "[relic_creator_saint.GetShortUINameNotMe]의 내장이 들어 있는 항아리입니다."
 pam_saint_relic_staff_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 순례길에서 사용했던 지팡이입니다."
 pam_saint_relic_water_filter_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 여행 중 물을 거르는 데 사용했던 천 조각입니다."
 pam_saint_relic_bowl_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 여행하며 탁발할 때 사용했던 발우입니다."
 pam_saint_relic_robe_desc: "[relic_creator_saint.GetShortUINameNotMe]의 성스러운 의복을 모신 정교한 성유물함입니다."
 pam_saint_relic_sword_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 휘둘렀던 성스러운 검으로, 이를 지닌 신자에게 신의 가호와 힘을 준다고 합니다."
 pam_saint_relic_sarira_desc: "[relic_creator_saint.GetShortUINameNotMe]의 사리를 모신 정교한 성유물함입니다."
 pam_saint_relic_skull_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]의 정수리뼈 사리를 모신 정교한 성유물함입니다."
 pam_saint_relic_finger_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]의 손가락 사리를 모신 정교한 성유물함입니다."
 pam_saint_relic_tooth_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]의 치아 사리를 모신 정교한 성유물함입니다."
 pam_saint_relic_rib_buddhism_desc: "[relic_creator_saint.GetShortUINameNotMe]의 갈비뼈 사리를 모신 정교한 성유물함입니다."
 pam_saint_relic_talisman_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 직접 그린 부적입니다. 사악한 기운을 물리치거나 소지자를 치유한다고 합니다."
 pam_saint_relic_pellet_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 조제한 단약이 든 병입니다."
 pam_saint_relic_footprint_desc: "[relic_creator_saint.GetShortUINameNotMe]의 발자국을 모신 정교한 성유물함입니다."
 pam_saint_relic_afarganyu_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 소유했던 아파르가뉴입니다."
 pam_saint_relic_ring_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 소유했던 성스러운 반지입니다."
 pam_saint_relic_bracelet_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 소유했던 성스러운 팔찌입니다."
 pam_saint_relic_commentary_desc: "[relic_creator_saint.GetShortUINameNotMe](이)가 쓴 주석 모음집으로, [relic_creator_saint.GetFaith.ReligiousText]에 대한 해석을 담고 있습니다."
 pam_saint_relic_tzitzit_desc: "[relic_creator_saint.GetShortUINamePossessiveNotMy] 치치트 한 가닥으로, [relic_creator_saint.GetHerHis] 신앙심을 보여줍니다."
 pam_saint_relic_relic_desc: "[relic_creator_saint.GetShortUINameNotMe]의 성유물을 모신 정교한 성유물함입니다."
