 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "성물 추출"
 pam_extract_relic_decision_desc: "내 봉역에 [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U](이)가 [GetPlayer.Custom('PamConsecratedEnshrined')]되어 있다. 마땅한 경의를 갖춘다면 그 유해에서 성물을 취하여 신자들에게 축복을 내릴 수 있을 것이다."
 pam_extract_relic_decision_tooltip: "지배 중인 영토에 묻힌 [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]에게서 성물을 취함"
 pam_extract_relic_decision_confirm: "성물 추출"
 pam_extract_relic_decision_req_saint: "아직 성물을 취할 수 있는 [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U](이)가 당신의 [realm|EU]에 안치되어 있음"
 pam_extract_relic_decision_req_saint_count: "지금까지 [CHARACTER.GetShortUIName]에게서 [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] 중 [CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')]개의 [Concept('artifact','성물')|E]을 추출함"
 pam_extract_relic_decision_extract_tt: "[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]의 유해를 [Concept('artifact','성유물')|E]로 제작"
 pam_extract_relic_decision_choose_tt: "매장된 [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] 중 누구에게서 [Concept('artifact','성물')|E]을 취할지 선택함"
 pam_extract_relic_decision_item_valid_tt: "이 [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]에게서 아직 [Concept('artifact','성유물')|E]을 취할 수 있음."
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "떠나간 탄원"
 pam_saint_events.0001.desc: "[saint_candidate.GetFirstName]의 시성 절차를 위한 준비가 끝났다. [consecration_province.GetName]의 명예로운 자리가 그 축복받은 유해를 기다리고 있다.\n\n이제 이 일은 내 손을 떠났다. 탄원서가 [petition_recipient.GetTitledFirstName]에게 향하고 있으니, 나는 그저 호의적인 결정이 내려지기를 기도할 뿐이다."
 pam_saint_events.0001.a: "이제 기다리며 기도하는 수밖에."
 pam_saint_events.0001.a.tt_saint: "[saint_candidate.GetFirstName](을)를 거룩한 [Concept('canonized','성자')|E]로 인정하고 [consecration_province.GetName]에 봉헌해 달라는 탄원서가 [petition_recipient.GetTitledFirstName]에게 전달되었습니다. 때가 되면 답변이 올 것입니다."
 pam_saint_events.0001.a.tt_va: "[saint_candidate.GetFirstName](을)를 [saint_candidate.Custom('PamVeneratedSaintOrAncestor')](으)로 인정하고 [consecration_province.GetName]에 [saint_candidate.Custom('PamConsecratedEnshrined')]해 달라는 탄원서가 [petition_recipient.GetTitledFirstName]에게 전달되었다. 때가 되면 답변이 올 것이다."
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "시성 탄원"
 pam_saint_events.0002.t_va: "공경 탄원"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName](은)는 [saint_candidate.GetFirstName](을)를 축복받은 성자로 인정하고 [consecration_province.GetName]에 봉헌할 것을 우리에게 간청하고 있다."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName](은)는 [saint_candidate.GetFirstName](을)를 [saint_candidate.Custom('PamBlessedOnesOrAncestors')](으)로 인정하고 [consecration_province.GetName]에 [saint_candidate.Custom('PamConsecratedEnshrined')]할 것을 우리에게 간청하고 있다."
 pam_saint_events.0002.desc.traits_1: "\n\n생전에 [saint_candidate.GetFirstNameNoTooltip](은)는 [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] 모습으로 알려진 [saint_candidate.GetWomanMan]이었다."
 pam_saint_events.0002.desc.traits_2: "\n\n생전에 [saint_candidate.GetFirstNameNoTooltip](은)는 [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], 그리고 [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] 모습으로 알려진 [saint_candidate.GetWomanMan]이었다."
 pam_saint_events.0002.desc.traits_3: "\n\n생전에 [saint_candidate.GetFirstNameNoTooltip](은)는 [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l], 그리고 [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l] 모습으로 알려진 [saint_candidate.GetWomanMan]이었다."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "이 영혼에서는 희미하게 흔들리는 빛이 흘러나온다. 미약한 불꽃이기는 하나, 모든 성자가 더 거대한 불길 속에서 빚어진 것은 아니다.\n\n판단은 우리의 몫이다."
 pam_saint_events.0002.desc.virtue_1_va: "이 영혼에서는 희미하게 흔들리는 빛이 흘러나온다. 미약한 불꽃이기는 하나, 모든 공경받는 영혼이 더 거대한 불길 속에서 빚어진 것은 아니다.\n\n판단은 우리의 몫이다."
 pam_saint_events.0002.desc.virtue_2: "[saint_candidate.GetFaith.HighGodName]께 기쁨을 드리고자 이 영혼이 이룬 업적은 결코 가벼이 여길 수 없다. 비록 완전하지는 않을지언정 분명한 은총의 징표다.\n\n판단은 우리의 몫이다."
 pam_saint_events.0002.desc.virtue_3: "이 영혼은 미덕 그 자체다. 이토록 많은 신성을 이토록 분명하게 드러내는 필멸자는 드물다.\n\n판단은 우리의 몫이다."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName]에겐 실로 자격이 있다."
 pam_saint_events.0002.a.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive] [canonizer.GetFaith.GetAdherentName] [Concept('dynasty','가문')|E] 구성원이 20년 동안 당신을 향한 [Concept('opinion','의견')|E]을 #P 10#!만큼 획득함"
 pam_saint_events.0002.b: "승인하지 않겠다."
 pam_saint_events.0002.b.dynasty_opinion_tt: "[canonizer.GetShortUINamePossessive] [canonizer.GetFaith.GetAdherentName] [Concept('dynasty','가문')|E] 구성원이 20년 동안 당신에 대한 [Concept('opinion','의견')|E]을 #N 10#!만큼 잃음"
