 poi_buried_saint.preset_visit_desc: "[visited_saint.GetShortUIName]의 무덤에서 잠시 멈춰 경의를 표한다."
 poi_buried_saint.foreign_visit: "고대 묘 방문"
 poi_buried_saint.foreign_visit_desc: "내 신앙은 [visited_saint.GetShortUIName]을 숭배하지 않지만, 이 무덤에서 배울 것이 많다."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "경의를 표하고 약간의 [piety_i|E][piety|E](을)를 얻으며, 멀리서 행할 때보다 #EMP 적은#! 비용으로 신성한 [Concept('artifact','성유물')|E]을 취할 수 있습니다."
 pam_poi_buried_saint_on_visit_relic_tt: "[visited_saint.GetShortUIName]에게 경의를 표하고, 멀리서 행할 때보다 #EMP 적은#! 비용으로 [Concept('artifact','성유물')|E]을 취할 수 있습니다."
 pam_poi_buried_saint_on_visit_no_relic_tt: "이곳에 잠든 [visited_saint.Custom('PamSaintOrAncestorNoun')] [visited_saint.GetShortUIName]에게 경의를 표함."
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "[visited_saint.GetShortUINameNoTooltip]의 묘에서"
 pam_saint_events.0007.desc: "여정 끝에 나는 같은 신앙을 믿는 [visited_saint.Custom('PamVeneratedSaintOrAncestor')] [visited_saint.GetShortUIName]의 안식처에 이르렀다. 주위에는 성스러운 기운이 짙게 감돌고, 무덤 주변에서는 신자들이 무릎을 꿇고 고요히 기도하고 있다."
 pam_saint_events.0007.a: "경의를 표하고 길을 떠나리라."
 pam_saint_events.0007.b: "신성한 성물을 취하도록 하자."
 pam_saint_events.0007.b.tt: "[visited_saint.GetShortUINameNoTooltip]의 유해에서 [Concept('artifact','성유물')|E]을 취함"
 pam_saint_events.0007.b.toast: "신성한 성물을 취함"
 pam_saint_events.0007.b.toast_desc: "경건한 손길로 [visited_saint.GetShortUINameNoTooltip]의 유해에서 [relic_artifact.GetName](을)를 취하여 나의 [realm|EU]에 축복을 내립니다."
