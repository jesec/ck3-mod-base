 pam_choose_consecration_site_decision_desc_saint: "나의 [realm|EU]에 있는 [Concept('ecclesiastical_domicile_building','대성당')|E] 중 한 곳을 선택하여 이 거룩한 [Concept('canonized','성자')|E]를 봉헌하고 그 유해를 안치함으로써 신자들을 불러 모으게 하리라."
