 # Character memories raised by the secular-faith flavor events.
 # Owner = the ruler who remembers; participant role names match the type definitions.
 pam_sf_kings_touch_healing_memory: "손길로 병자를 치유했음"
 pam_sf_kings_touch_healing_memory_desc: "나는 중병에 걸린 [healed_subject.GetTitledFirstName]에게 손을 얹었고, [healed_subject.GetSheHe]는 병에서 회복했음."
 pam_sf_kings_touch_healing_memory_desc_second_perspective: "당신은 중병에 걸린 [healed_subject.GetTitledFirstName]에게 손을 얹었고, [healed_subject.GetSheHe]는 병에서 회복했음."
 pam_sf_kings_touch_healing_memory_desc_third_perspective: "[owner.GetTitledFirstName](은)는 중병에 걸린 [healed_subject.GetTitledFirstName]에게 손을 얹었고, [healed_subject.GetSheHe]는 병에서 회복했음."
 pam_sf_deliverance_memory: "구마 의식을 행했음"
 pam_sf_deliverance_memory_desc: "[delivered_soul.GetTitledFirstName](은)는 사나운 악령에 사로잡혔고, 나는 구마 의식을 행했음."
 pam_sf_deliverance_memory_desc_second_perspective: "[delivered_soul.GetTitledFirstName](은)는 사나운 악령에 사로잡혔고, 당신은 구마 의식을 행했음."
 pam_sf_deliverance_memory_desc_third_perspective: "[delivered_soul.GetTitledFirstName](은)는 사나운 악령에 사로잡혔고, [owner.GetTitledFirstName](은)는 구마 의식을 행했음."
 pam_sf_prophecy_fulfilled_memory: "예언이 실현되는 것을 목격했음"
 pam_sf_prophecy_fulfilled_memory_desc: "[prophet.GetTitledFirstName](은)는 [doomed.GetTitledFirstName](이)가 죽을 것이라고 내게 경고했고, [doomed.GetSheHe]는 실제로 사망했음."
 pam_sf_prophecy_fulfilled_memory_desc_second_perspective: "[prophet.GetTitledFirstName](은)는 [doomed.GetTitledFirstName](이)가 죽을 것이라고 당신에게 경고했고, [doomed.GetSheHe]는 실제로 사망했음."
 pam_sf_prophecy_fulfilled_memory_desc_third_perspective: "[prophet.GetTitledFirstName](은)는 [doomed.GetTitledFirstName](이)가 죽을 것이라고 [owner.GetTitledFirstName]에게 경고했고, [doomed.GetSheHe]는 실제로 사망했음."
