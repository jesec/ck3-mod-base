l_korean:
 pam_curse_enemy_decision: "적 저주하기"
 pam_curse_enemy_decision_desc: "#F 감히 내게 맞서는 이 어리석은 자는 누구인가? 그 이름을 영혼 앞에 고하고 모든 원망과 모욕과 저주를 쏟아부어 주리라. 어디 웃을 수 있을 때 웃어 두시지. 곧 심판의 날을 마주하게 될 테니까.#!"
 pam_curse_enemy_decision_tooltip: "당신의 [wars|E] 중 한 곳에서 경쟁자 또는 상대를 대상으로 하는 의식을 수행함"
 pam_curse_enemy_decision_confirm: "의식 시작하기"
 pam_curse_enemy_decision_valid_target: "당신이 살아있는 성인 [rival|E], [nemesis|E] 또는 전쟁의 적을 보유하고 있음"
 pam_curse_enemy_decision_selected_target_valid: "당신의 선택된 적이 여전히 살아있는 성인 [rival|E], [nemesis|E] 또는 전쟁의 적임"
 pam_curse_enemy_decision_no_item_selected: "선택한 적 없음"
 pam_seek_war_aid_decision: "전쟁 지원 요청"
 pam_seek_war_aid_decision_desc: "#F 전쟁은 무기와 병력 그 이상을 시험한다. 내 앞에 놓인 시련을 뚫고 나의 대의를 실현할 수 있도록 영혼에게 통찰, 활력, 인내를 달라고 탄원하겠다.#!"
 pam_seek_war_aid_decision_tooltip: "영혼에게 현재 진행 중인 전쟁을 도와달라고 탄원하기"
 pam_seek_war_aid_decision_confirm: "영혼 부르기"
 pam_adorcism_events.0001.t: "영혼 앞에 고하는 이름"
 pam_adorcism_events.0001.desc: "나는 한적한 곳에서 [pam_adorcism_curse_target.GetTitledFirstNamePossessive] 이름을 땅에 새기고 모든 원망을 큰 소리로 읊었다. 의식으로는 뼈를 부수거나 작물을 시들게 할 수는 없지만, 그게 목적이 아니다.\n\n자리에서 일어나자 내 분노는 차갑게 식어 의도로 굳어졌다. [pam_adorcism_curse_target.GetHerHim]에 대한 모든 소문은 이제 누군가 당겨 주기만을 기다리는 실처럼 팽팽해 보였다."
 pam_adorcism_events.0001.a: "내 목적은 명확하다."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], 영혼 앞에 네 이름을 고하고 저주를 걸었노라. 불운이 찾아오면, 이는 내 뜻에 따라 일어난 일이라는 점을 꼭 명심하도록."
 pam_adorcism_events.0002.desc.default: "\n\n영혼 앞에 네 이름을 고하고 저주를 걸었노라. 불운이 찾아오면, 이는 내 뜻에 따라 일어난 일이라는 점을 꼭 명심하도록."
 pam_adorcism_events.0002.a: "누가 [ROOT.Char.GetFaith.PriestNeuter](을)를 불러와라, 어서!"
 pam_adorcism_events.0002.a.flavor: "저주가 당신의 생각을 갉아먹으며 모든 그림자가 불길한 징조처럼 느껴짐."
 pam_adorcism_events.0101.t: "보이지 않는 곳에서 온 조언"
 pam_adorcism_events.0101.desc: "나는 야영지의 마지막 불 너머에서 공물을 바쳤다. 뒤에서는 군대의 소리가 멀어져 갔다. 바람이 먼지를 휩쓸었지만 뚜렷한 목소리는 들리지 않았다. 하지만 의식을 치르는 동안 내 생각은 흔들리지 않았다.\n\n앞으로 다가올 작전에서 어떤 도움을 구할지 정해야 한다."
 pam_adorcism_events.0101.a: "승리로 향하는 길을 보여주기를."
 pam_adorcism_events.0101.b: "나의 검을 든 팔에 힘을 실어주기를."
 pam_adorcism_events.0101.c: "내 군대에 인내심을 주기를."
 pam_adorcism_curse_focus_modifier: "방향을 바꾼 분노"
 pam_adorcism_curse_focus_modifier_desc: "해당 인물은 자신의 분노가 향하는 대상을 지정하고 의식을 통해 내던져 버렸습니다."
 pam_adorcism_ill_omen_modifier: "불길한 징조의 표식"
 pam_adorcism_ill_omen_modifier_desc: "저주에 대한 소문을 들은 교파 구성원들이 해당 인물을 의심의 눈초리로 바라봅니다."
 pam_adorcism_curse_anxiety_modifier: "저주를 향한 두려움"
 pam_adorcism_curse_anxiety_modifier_desc: "해당 인물은 자신을 찾아오는 모든 불운이 누군가 자신에게 불러낸 것이라는 생각을 떨쳐내지 못합니다."
 pam_adorcism_battle_guidance_modifier: "영혼이 이끄는 전략"
 pam_adorcism_battle_guidance_modifier_desc: "해당 인물은 영혼이 전투가 잘 풀릴 것이라는 징조를 보여주었다고 믿습니다."
 pam_adorcism_personal_vigor_modifier: "영혼이 준 활력"
 pam_adorcism_personal_vigor_modifier_desc: "해당 인물은 의식을 통한 자신감으로 대인전에서 싸울 힘을 얻었습니다."
 pam_adorcism_campaign_endurance_modifier: "영혼이 지탱하는 군대"
 pam_adorcism_campaign_endurance_modifier_desc: "해당 인물의 군대는 새로워진 확신을 품고 기나긴 전쟁을 견뎌냅니다."
