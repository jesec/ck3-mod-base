l_korean:
 game_concept_puppet: "꼭두각시"
 game_concept_puppets: "꼭두각시"
 game_concept_puppeted: "꼭두각시"
 game_concept_puppeting: "꼭두각시"
 game_concept_puppet_type: "꼭두각시 유형"
 game_concept_puppet_types: "꼭두각시 유형"
 game_concept_puppet_type_desc: "[puppet|e]에게는 언제나 유형이 있으며, 이 유형은 해당 꼭두각시가 당신 대신 수행하는 행동을 정합니다.\n\n각 $game_concept_puppet_type$은 대부분의 특수 행동을 공유하지만, 해당 유형만 사용 가능한 고유한 행동이 있습니다.\n\n예를 들어 [clerical_puppet|e]는 당신 대신 누군가를 [excommunicate|e]할 수 있으며, [external_ruler_puppet|e]의 경우 [tributary|e]을 해방하거나 [spouse|e]와 이혼하게 강요할 수 있습니다.\n\n유형당 한 명의 $game_concept_puppet$만 보유할 수 있습니다."
 game_concept_puppet_desc: "꼭두각시는 [puppeteer|E]의 지배를 받는 [character|E]로, 실권자는 꼭두각시를 통해 특수한 꼭두각시 행동을 수행할 수 있습니다.\n\n꼭두각시를 통해 행동하면 다른 경우에는 접근할 수 없던 기회가 열리기도 합니다. [clerical_puppet|E]는 당신을 대신해 [clerical_titles|E] 또는 [excommunication|E] 탄원을 할 수 있으며, [external_ruler_puppet|E]의 경우 [tributaries|E]을 해방하거나, 독립을 허용하거나, [spouse|E]와 이혼하게 할 수 있습니다.\n\n사용할 수 있는 행동은 [puppet_type|E]에 따라 달라집니다."
 game_concept_puppeteer: "실권자"
 game_concept_puppeteers: "실권자"
 game_concept_puppeteer_possessive: "실권자의"
 game_concept_puppeteers_possessive: "실권자의"
 game_concept_puppeteer_desc: "실권자는 하나 이상의 [puppets|E]를 지배하는 [character|E]입니다.\n\n실권자는 꼭두각시를 통해 자신의 위치에서는 사용할 수 없던 권력을 휘두를 수 있습니다. 여기에는 [clergy|E]의 영향력 또는 다른 [realm|E]의 권한이 포함됩니다."
 game_concept_clerical_puppet: "봉역 사제 꼭두각시"
 game_concept_clerical_puppets: "봉역 사제 꼭두각시"
 game_concept_clerical_puppet_desc: "자신이 섬기는 [liege|E]의 [puppet|E]인 [realm_priest|E]입니다.\n\n실권자는 이 꼭두각시를 통해 [faith|E] 관련 사안에 영향을 미칠 수 있습니다. [head_of_faith|E]에게 [clerical_titles|E] 또는 [excommunication|E]을 탄원하거나, [holy_sites|E]를 관리하고, 새로운 [rite|E]를 창설하거나 [ecumenical_council|E]를 주최할 수도 있습니다."
 game_concept_external_clerical_puppet: "성직 영주 꼭두각시"
 game_concept_external_clerical_puppets: "성직 영주 꼭두각시"
 game_concept_external_clerical_puppet_desc: "[archbishop|E] 또는 [head_of_faith|E]처럼 권세 있는 [clergy|E]면서 다른 [ruler|E]의 [puppet|E]가 된 인물입니다.\n\n성직자의 권세가 강력할수록 영향력 또한 커집니다. 꼭두각시 교계 지도자는 당신을 대신해 적을 [excommunicate|E]하고, [cardinals|E]을 지명하고, [pressed_claim|E]을 부여하거나, [holy_war|E]을 유도할 수 있습니다."
 game_concept_external_ruler_puppet: "세속 영주 꼭두각시"
 game_concept_external_ruler_puppets: "세속 영주 꼭두각시"
 game_concept_external_ruler_puppet_desc: "다른 [character|E]의 [puppet|E]면서, [clergy|E]가 아닌 [ruler|E]입니다.\n\n이 꼭두각시를 통하면 [schemes|E] 또는 [imprisonment|E] 등을 활용해 다른 [realms|E]의 사안에 간섭할 수 있습니다.\n\n\n이 유형의 꼭두각시를 획득하려면 #V $make_external_ruler_puppet_interaction$#! [interaction|E]이 필요합니다. 해당 상호작용은 다음 조건 중 하나를 충족하면 잠금 해제됩니다.\n$BULLET_WITH_TAB$당신이 대상의 [clergy|E] [vassal|E]임\n$BULLET_WITH_TAB$당신이 [GetTrait('seducer').GetName( GetNullCharacter )] 특성 보유자이며 대상이 당신의 [lover|E]이거나, 대상의 지위가 [king|E] 이상인 경우 당신의 [soulmate|E]\n$BULLET_WITH_TAB$당신이 [GetTrait('torturer').GetName( GetNullCharacter )] 특성 보유자이며 대상을 [dungeon|E]에 가둠\n$BULLET_WITH_TAB$당신이 [GetTrait('family_first').GetName( GetNullCharacter )] 특성 보유자이며 대상이 당신의 [close_family|E]임\n$BULLET_WITH_TAB$당신이 [GetTrait('diplomat').GetName( GetNullCharacter )] 특성 보유자이며 대상이 [independent_ruler|E]임\n$BULLET_WITH_TAB$당신이 [GetTrait('gallant').GetName( GetNullCharacter )] 특성 보유자이며 대상이 당신의 [spouse|E]임\n$BULLET_WITH_TAB$당신이 [entrenched_regency|E]에서 대상의 [diarch|E]임"
 game_concept_ecumenical_council: "보편 공의회"
 game_concept_ecumenical_council_desc: "$game_concept_ecumenical_council$는 기독교 세계 전역의 고위 [clergy|E]들이 교회의 미래를 정하고자 모이는 [activity|E]입니다.\n\n자리에 모인 고위 성직자들은 연이은 논쟁을 통해 분쟁의 대상인 [core_tenets|E]의 [tenet_status|E]를 정합니다. 해당 원리를 [permitted_tenet_status|E] 또는 [prohibited_tenet_status|E] 상태로 만들거나, [core_tenet_status|E]으로 승격시키기도 하며, [faith|E]의 [doctrines|E]를 정리합니다."
 game_concept_ecumenical_councils: "보편 공의회"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "분열"
 game_concept_schism_desc: "대$game_concept_schism$은 하나의 $christian_faith$ [faith|E]이 로마와 그리스 [rites|E]를 따라 나뉘기 시작하며, $catholic$ 및 $orthodox$로 분리된 순간입니다.\n\n대분열은 [the_christian_church|E] [situation|E]이 특정 [the_christian_church_chapters_short|E]에 들어서면 위협이 되며, 기독교 세계 전역의 영주들은 한쪽 편을 선택해야만 합니다. [decisions|E]을 통해 균열을 수습하거나 강제로 갈라서지 않는 한, 형세가 끝날 때까지 이 불화가 영구히 지속됩니다."
 game_concept_schisms: "분열"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "성직 작위"
 game_concept_clerical_titles: "성직 작위"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$는 [faith|E] 내에서 [clerical_region|E]을 다스리는 [clergy|E] 구성원이 보유하는 [ecclesiastical|E] [title|E]입니다. [christian|E] 신앙에서는 [archdiocese|E] 형태로 나타납니다.\n\n이 작위의 소유주는 해당 지역 내 [clergy|E]의 [religious_superior|E]이며, 보통은 [head_of_faith|E]에게서 작위를 부여받습니다."
 game_concept_the_christian_church: "기독교 교회"
 game_concept_the_christian_church_desc: "기독교 교회는 예수 그리스도의 추종자들을 관리하고 인도하는 교계 기관이며, [the_christian_church_chapters_short|E] 과정을 거쳐 발전하는 [situation|E]으로 표현됩니다.\n\n이 기관의 경계는 전 세계의 [archdiocese|E]를 아우릅니다. 대교구 내에 [realm|E]의 일부가 있으며, [county|E] 이상의 지위를 보유한 모든 [christian|E] [ruler|E]는 성직자든 세속의 영주든 상관없이 기독교 교회의 구성원으로 간주됩니다."
 game_concept_christendom: "기독교 세계"
 game_concept_christendom_desc: "$game_concept_christendom$는 [the_christian_church|E] [situation|E]의 구성원인 모든 [independent|E] [christian|E] [ruler|E]들의 [realm|E]을 아우릅니다."
 game_concept_christian: "기독교인"
 game_concept_christians: "기독교인"
 game_concept_christian_possessive: "기독교인의"
 game_concept_christian_desc: "기독교 [religion|E]의 추종자입니다."
 game_concept_papal_bull: "교황 칙서"
 game_concept_papal_bulls: "교황 칙서"
 game_concept_bull: "칙서"
 game_concept_bulls: "칙서"
 game_concept_papal_bull_desc: "교황 칙서는 [christian|E] [faith|E]의 [head_of_faith|E]가 선포하는 준엄한 칙령으로, 칙서 주인의 의지 뒤에는 [the_christian_church|E]의 전권이 담겨 있습니다.\n\n충분한 [church_authority|E]을 보유한 기독교 [head_of_faith|E]는 [GetDecisionWithKey('enact_a_bull_decision').GetName] [decision|E]을 통해 칙서를 선포할 수 있으며, [piety|E]을 소모해 다음 행동이 가능합니다.\n\n$EFFECT_LIST_BULLET$[great_holy_war|E] 선포\n$EFFECT_LIST_BULLET$[rite|E]를 [heresy|E]으로 규탄\n$EFFECT_LIST_BULLET$[core_tenet|E]를 [permitted_tenet_status|E] 또는 [prohibited_tenet_status|E] 상태로 선언"
 game_concept_situation_the_christian_church_phase: "기독교 교회 형세"
 game_concept_the_christian_church_chapter_short: "형세"
 game_concept_the_christian_church_chapters_short: "형세"
 game_concept_situation_the_christian_church_phases: "기독교 교회 형세"
 game_concept_situation_the_christian_church_phase_desc: "형세는 [the_christian_church|E]의 [situation_phases|E]입니다. 형세는 총 7개가 있으며, 4개의 [the_christian_church_chapter_types|E]으로 구성됩니다."
 game_concept_the_christian_church_chapter_type: "형세 유형"
 game_concept_the_christian_church_chapter_types: "형세 유형"
 game_concept_the_christian_church_chapter_type_desc: "[the_christian_church|E]에는 4개의 $game_concept_the_christian_church_chapter_types$이 있으며, 이 유형이 [situation_the_christian_church_phases|E]를 분류합니다.\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|E], [the_christian_church_crisis_short|E], [the_christian_church_zeal_short|E], [the_christian_church_stability_short|E]"
 game_concept_the_christian_church_unstable: "불안정 형세"
 game_concept_the_christian_church_unstable_short: "불안정"
 game_concept_the_christian_church_unstable_desc: "#high $game_concept_the_christian_church_unstable$#!의 [the_christian_church|E]에서는 순종을 거의 찾아볼 수 없습니다.\n\n[rulers|E]는 다른 [rite|E]로 더 쉽게 넘어가며, 파문이 더 빈번하게 일어나며 [gold|E] 또한 사리사욕을 위해 사용될 수 있습니다.\n\n#high $fragile_unity$#! 및 #high $reform_phase$#!이 $game_concept_the_christian_church_unstable_short$ [the_christian_church_chapters_short|E]입니다."
 game_concept_the_christian_church_zeal: "열광 형세"
 game_concept_the_christian_church_zeal_short: "열광"
 game_concept_the_christian_church_zeal_desc: "#high $game_concept_the_christian_church_zeal$#!에서는 외부로 불길이 번집니다.\n\n대규모 개종이 발생할 수 있으며, [great_holy_wars|E]이 비교적 흔하게 일어나고 [papal_bulls|E] 또한 자주 발표될 수 있으며, [faith|E] 개종이 더 쉬워집니다.\n\n#high $conversion_phase$#! 및 #high $crusade_phase$#!이 $game_concept_the_christian_church_zeal_short$ [the_christian_church_chapters_short|E]입니다."
 game_concept_the_christian_church_stability: "안정 형세"
 game_concept_the_christian_church_stability_short: "안정"
 game_concept_the_christian_church_stability_desc: "#high $game_concept_the_christian_church_stability$#!의 [the_christian_church|E]는 좀처럼 보기 힘듭니다.\n\n[temple_holding|E] 건설 비용이 감소하며 총대성당 진행도가 빨라지고, [characters|E]은 [GetTrait('devoted').GetName( GetNullCharacter )] 특성을 보유할 가능성이 높아지며 대분열 또한 해소될 수 있습니다.\n\n#high $concord$#!은 유일한 $game_concept_the_christian_church_stability$입니다."
 game_concept_the_christian_church_crisis: "위기 형세"
 game_concept_the_christian_church_crisis_short: "위기"
 game_concept_the_christian_church_crisis_desc: "#high $game_concept_the_christian_church_crisis$#!의 [the_christian_church|E]에서는 갈등이 최고조로 치달아 있습니다.\n\n면죄부의 가격이 감소하며 [ecumenical_councils|E]가 더 빈번하게 열리고, [rulers|E]는 자신만의 [court_chaplain|E]를 임명할 수 있으며, [clergy|E]도 결혼이 가능합니다. [head_of_faith|E]는 [anointment|E]을 거부할 수 있으며, [taxes|E]도 부정적인 영향을 받습니다.\n\n#high $saeculum_obscurum$#! 및 #high $investiture_crisis$#!이 $game_concept_the_christian_church_crisis_short$ [the_christian_church_chapters_short|E]입니다."
 game_concept_head_of_rite: "교파 지도자"
 game_concept_head_of_rite_desc: "[rite|E]를 이끄는 [character|E]이 해당 교파를 따르는 경우 [head_of_faith|E]가 되며, 그렇지 않으면 교파를 가장 널리 따르는 [clerical_region|E]의 소유주가 교파 지도자가 되고, 그렇지 않은 경우에는 [rite_possessive|E] [Concept( 'counties', '영지' )|E] 대부분을 다스리는 [ruler|E]가 교파 지도자가 됩니다.\n\n$game_concept_head_of_rite$만이 [rite_possessive|E] [core_tenets|E] 및 [doctrines|E]를 변경할 수 있으며, 교회가 [schism|E]을 향해 기울어질 때 신자 무리를 대변하는 인물도 교파 지도자입니다."
 game_concept_ecclesiastical: "교회"
 game_concept_ecclesiastical_government: "교회 정부"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "$game_concept_ecclesiastical$는 [bishops|E], [archbishops|E]와 같은 [christian|E] [clergy|E] [rulers|E]의 [theocratic|E] [government_form|E]입니다.\n\n대부분의 교계 영주는 자신의 [temple_holdings|E]를 세속 [liege|E]에게서 [lease|E]하며 [head_of_faith|E]의 부름에 답하는 신정제 [vassals|E]이지만, [leased|E]되지 않은 [landed|E] [titles|E]를 보유한 [bishop|E]는 [independent|E] 교회 [ruler|E]로 집권할 수 있습니다. 이런 영주가 자신의 [vassals|E]에게 휘두르는 권력은 영주의 [church_authority|E]에 따라 정해집니다."
 game_concept_lease_contract: "임차 계약"
 game_concept_lease_contract_desc: "인물이 작위를 [leasing|E]하는 법적 조건입니다. 해당 계약에 따라 [religious_superior|E]도 정해집니다."
 game_concept_church_obligations: "교회 책무"
 game_concept_church_obligations_desc: "교회 책무는 [church_holding|E] 수입에 따른 책무의 총합입니다. 이러한 책무는 [superior|E], [head_of_faith|E] 및/또는 현지 세속 [ruler|E]에게 바쳐야 합니다. 예시로는 [church_centralization|E] 및 [secular_obligations|E]가 있습니다."
 game_concept_church_centralization: "교회 중앙 집권"
 game_concept_minimal_centralization: "최소 중앙 집권"
 game_concept_mild_centralization: "약한 중앙 집권"
 game_concept_strong_centralization: "강한 중앙 집권"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$은 교회가 중앙 집권적 권한과 재정 구조를 어느 정도까지 채택했는지를 나타내는 척도입니다. 강한 중앙 집권일수록 더 많은 수입이 성직 위계의 위쪽으로 흘러갑니다.\n\n유형:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "세속 책무"
 game_concept_personal_obligations: "개인 책무"
 game_concept_fixed_obligations: "고정 책무"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$는 [church_holdings|E]에서 어느 정도의 수입이 지역 [secular_ruler|E]에게 속하는지를 정합니다.\n\n유형:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\n일부 형세에서는 세속 영주가 교회에 추가로 지역 권력을 행사할 수 있습니다.\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "종교 장상"
 game_concept_religious_superiors: "종교 장상"
 game_concept_superior: "장상"
 game_concept_religious_superior_desc: "종교 장상은 위계가 있는 종교 구조 내에서 한 명 이상의 [subordinate|E] 종교 성직자의 종교적 관할권을 보유하는 [character|E]입니다."
 game_concept_religious_subordinate: "종교 종속자"
 game_concept_religious_subordinates: "종교 종속자"
 game_concept_subordinate: "종속자"
 game_concept_subordinates: "종속자"
 game_concept_religious_subordinate_desc: "종교 종속자는 위계가 있는 종교 구조 내에서 [religious_superior|E]을 보유한 [character|E]입니다."
 game_concept_clerical_region: "성직 지역"
 game_concept_clerical_regions: "성직 지역"
 game_concept_clerical_region_possessive: "성직 지역의"
 game_concept_clerical_regions_possessive: "성직 지역의"
 game_concept_clerical_region_desc: "성직 지역은 [clerical_title|E] 관할권에 속하는 지리적 지역입니다. 지역 내의 성직자는 해당 지역과 연관된 [title|E] 소유주의 [subordinate|E]가 됩니다.\n\n[ruler|E]는 자신의 [capital|E] [Concept( 'county', '영지' )|E]가 있는 성직 지역에 속하며, 새로운 지역은 설립자의 [primary_title|E] [capital|E]에 세워집니다. 성직 지역은 여러 [realms|E]을 포함할 수 있으며, 여러 봉역에 걸쳐 종속자를 보유할 수 있습니다.\n\n$game_concept_ruler$는 한 번에 하나의 $game_concept_clerical_region$만 보유할 수 있습니다. 새로운 지역이 수여되면 영주는 이전 지역 내에 보유한 모든 토지를 박탈당합니다."
 game_concept_clerical_region_capital: "성직 지역 수도"
 game_concept_clerical_region_capitals: "성직 지역 수도"
 game_concept_clerical_region_capital_desc: "성직 지역 수도는 [clerical_region|E]이 설립된 [Concept( 'county', '영지' )|E]입니다. [ecclesiastical_estate|E]을 보유하며, 해당 지역을 다스리는 [clerical_title|E]의 소재지입니다. [de_jure_capital|E]와는 달리 지역에 고정되어 있으며 위치를 변경할 수 없습니다."
 clerical_electors: "성직 유권자"
 game_concept_archdiocese: "대교구"
 game_concept_archdioceses: "대교구"
 game_concept_archdiocese_desc: "대교구는 [clerical_region|E]의 [christian|E] 형태로, [archbishop|E]가 [clerical_title|E]를 통해 보유하는 교계 직할령이며 [grand_cathedral|E]이 세워질 수 있는 수도 [Concept( 'county', '영지' )|E]에 위치합니다.\n\n[christian|E] [ruler|E]는 자신의 [capital|E] [Concept( 'county', '영지' )|E]가 있는 대교구의 [archbishop|E]에게 영적 사안을 보고하며, 대교구에 속한 영토는 모두 [the_christian_church|E] [situation|E]을 구성합니다."
 game_concept_grand_cathedral: "총대성당"
 game_concept_grand_cathedrals: "총대성당"
 game_concept_grand_cathedral_desc: "총대성당은 [archbishop|E]의 관할인 [archdiocese|E]의 수도에 [great_project|E]을 통해 세워지는 [great_building|E]입니다.\n\n첫 대성당 건설은 헌신의 기념비와도 같은 행동입니다. 총대성당의 설립자는 지속적인 [piety|E], [legitimacy|E], [spiritual_fulfillment|E]을 획득하며 추가로 [personal_tenet|E] 공간을 하나 얻고, 자신과 같은 [faith|E] [opinion|E]에 관한 상시 보너스도 획득할 수 있습니다. 총대성당이 세워지면 [christendom|E] 전역의 기독교 순례자들이 이끌리며 소유주의 [cathedral_complex|E]가 확장됩니다. 또한 나중에 [GetBuilding('great_project_cathedral_02').GetName|V] 또는 [GetBuilding('great_project_cathedral_03').GetName|V]까지 확장할 수도 있습니다."
 game_concept_monastic_holy_order: "수도회"
 game_concept_monastic_holy_orders: "수도회"
 game_concept_monastic_holy_order_possessive: "수도회의"
 game_concept_monastic_holy_orders_possessive: "수도회의"
 game_concept_monastic: "수도"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "수도회는 하나의 [core_tenet|E]를 위해 기도하고 배우며, 해당 교파를 전파하고자 헌신하는 [holy_order|E]의 한 유형입니다. 수도회는 설립자의 [rite|E]에 속하며, 이 [rite_possessive|E] [core_tenets|E]를 옹호하고 신자들 사이에 교파의 실천을 퍼뜨립니다.\n\n[archabbot|E]이 이끄는 수도회는 [monastic_order_patrons|E]가 부여한 [temple_holdings|E]와 [gold|E]를 통해 유지되며, 그 답례로 [spiritual_fulfillment|E] 및 [piety|E]를 제공합니다.\n\n수도주의를 허용하는 [faith|E]을 믿는 [ruler|E]는 #high 수도회 창설#! [decision|E]으로 수도회를 설립할 수 있습니다."
 game_concept_monastic_order_patron: "수도회 후원자"
 game_concept_monastic_order_patrons: "수도회 후원자"
 game_concept_monastic_order_patronize: "후원"
 game_concept_monastic_order_patronized: "후원"
 game_concept_monastic_order_patronage: "후원"
 game_concept_monastic_order_patron_desc: "수도회 후원자는 [monastic_holy_order|E]를 유지하는 [duchy|E] [title_tier|E] 이상의 [ecclesiastical|E] 또는 세속 [ruler|E]로, 보통은 해당 수도회를 창설한 영주인 경우가 많습니다. 후원자는 수도회에 세속의 재물을 기부하며, [temple_holdings|E]를 임차해 주고 수도회의 금고에 [gold|E]를 헌금합니다.\n\n이런 관대한 자선의 대가로 후원자는 [piety|E] 및 [spiritual_fulfillment|E]을 획득합니다. 또한 수도회의 지도자를 장악하기도 하며, 자신의 [puppet|E]로서 [clerical|E] 상호작용을 시행하게 할 수 있습니다."
 game_concept_mendicant: "탁발"
 game_concept_rite: "교파"
 game_concept_rite_possessive: "교파의"
 game_concept_rites_possessive: "교파의"
 game_concept_rite_desc: "교파는 [faith|E]의 한 갈래입니다. 종교 실천의 지역적 변형이며, [head_of_rite|E]가 이끌고 [Concept( 'counties', '영지' )|E] 및 [characters|E]이 따릅니다. 각 신앙에는 [mainline_rite|E]가 있으며 더 많은 교파가 탄생할 수 있습니다.\n\n교파는 해당 교파가 옹호하는 [core_tenets|E] 및 [doctrines|E]에 따라 그 성격이 정해집니다. 원리의 [permitted_tenet_status|E] 또는 [prohibited_tenet_status|E] 여부는 [faith|E]의 [mainline_rite|E]를 통해 정해지며, [rite_possessive|E] 선택이 이러한 판단을 부정할수록 [rite_divergence|E] 정도도 높아집니다. 교파 분파는 [faithpossessive|E] [fervor|E]을 차츰 무너뜨리며 [heresy|E]으로 여겨지고, [divergence|E] 수치가 #V 100#!에 도달하면 독립적인 [faith|E]으로 분리됩니다.\n\n새로운 교파는 경건한 인물이 창설할 수 있으며, [rulers|E]는 한 교파에서 다른 교파로 마음을 바꿀 수도 있습니다. 오직 [head_of_rite|E]만 교파를 수정할 수 있습니다."
 game_concept_rites: "교파"
 game_concept_archabbot: "수도원장"
 game_concept_archabbot_desc: "$game_concept_archabbot$은 [monastic_holy_order|E]의 [ruler|E]이며, 해당 수도회가 옹호하는 [rite|E]의 [head_of_rite|E]입니다. 수도회 일원의 연구와 사색은 물론 수도회의 [core_tenets|E] 전파를 이끕니다.\n\n수도회는 [monastic_order_patron|E]의 지원을 받으며, 그 [monastic_order_patronage|E]을 통해 부와 영향력을 획득합니다.\n\n$game_concept_archabbot$이 사망하면 그 [titles|E]는 계승자에게 넘어가는데, 이 계승자는 보통 [learning|E] 수준이 가장 높은 [courtier|E]인 경우가 많습니다."
 game_concept_archbishop: "대주교"
 game_concept_archbishops: "대주교"
 game_concept_archbishop_possessive: "대주교의"
 game_concept_archbishops_possessive: "대주교의"
 game_concept_archbishop_desc: "대주교는 [archdiocese|E]의 기독교인 소유주이며, 여러 [realms|E]에 걸친 [clerical_region|E]을 소유하는 공작령 등급의 [clerical_title|E]입니다.\n\n대주교는 해당 지역의 [bishops|E] 및 하위 [clergy|E]의 [religious_superior|E]입니다. 일반 [bishop|E]보다 지위가 높으며, 따라서 [head_of_faith|E]의 부름에 직접 응답합니다."
 game_concept_bishop: "주교"
 game_concept_bishops: "주교"
 game_concept_bishop_possessive: "주교의"
 game_concept_bishops_possessive: "주교의"
 game_concept_bishop_desc: "$game_concept_bishop$는 기독교 [faith|E] [clergy|E]의 구성원으로, [temple_holdings|E]를 보유하거나 임차합니다.\n\n주교는 [archdiocese|E] 내에 거주하며 그곳의 [archbishop|E]을 [religious_superior|E]로 섬깁니다. [leased|E] 작위를 가진 비영주 주교는 세속 [liege|E]을 섬기지만, 임차되지 않은 [landed|E] [titles|E]를 보유한 주교는 [ecclesiastical|E] [ruler|E]로 집권할 수 있습니다."
 game_concept_rite_divergence: "분파"
 game_concept_rite_divergent: "분파"
 game_concept_divergence: "분파"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "분파는 [rite_possessive|E] [core_tenets|E] 및 [doctrines|E]가 부모 [faith|E]에서 얼마나 멀어졌는지 측정하는 척도입니다. [prohibited_tenet_status|E] 원리를 [core_tenet_status|E]으로 채택한 교파는 분파의 정도가 더 심해집니다.\n\n분파 정도가 높을수록 부모 신앙의 [fervor|E]이 약해지며, [heresy|E]의 발발이 더 흔해집니다. 분파 수치가 #V 100#!에 도달한 교파는 자동으로 이단이 되며 새로운 [faith|E]으로 변합니다."
 game_concept_spiritual_fulfillment: "영적 충만"
 game_concept_spiritual_fulfillment_desc: "$game_concept_spiritual_fulfillment$은 [character|E]이 자신의 [faith|E]을 통해 느끼는 평온함을 나타내는 척도입니다.\n\n기준치는 인물이 보유한 [traits|E]에 따라 산출되며, 해당 인물이 [sinful|E] 또는 [virtuous|E] 인물로 여겨지는지에 따라서도 영향을 받습니다.\n\n$game_concept_spiritual_fulfillment$은 해당 [faith|E]에 적합한 행동을 통해 획득하거나 상실할 수 있으며, [personal_tenets|E]를 받아들여 해로운 특성을 상쇄할 수 있습니다."
 game_concept_fulfillment: "충만"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "영적 충만 단계"
 game_concept_spiritual_fulfillment_levels: "영적 충만 단계"
 game_concept_spiritual_fulfillment_level_desc: "[character_possessive|E] [spiritual_fulfillment|E]은 기준치에 따른 $game_concept_spiritual_fulfillment_levels$로 나뉘며, 단계마다 고유의 효과가 적용됩니다.\n\n낮은 단계는 삶이 더 힘들어지며, 사특한 행위를 저질러도 비용을 적게 소모합니다. 높은 단계의 경우 헌신이 더 쉬워지며 새로운 종교적 선택지가 열립니다."
 game_concept_personal_tenet: "개인 원리"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$는 [ruler|E]가 자신의 영성에 있어 핵심적인 부분으로 채택한 [core_tenet|E]입니다.\n\n[faith|E]에서 [core_tenet_status|E]이거나 [permitted_tenet_status|E] 상태인 $game_concept_personal_tenet$를 채택하면 [spiritual_fulfillment|E]을 획득하며, [prohibited_tenet_status|E] 상태의 원리를 채택하면 [secret|E]이 생성됩니다. $game_concept_personal_tenets$는 추가 효과를 제공하며 특수한 메커니즘을 잠금 해제하기도 합니다.\n\n인물이 따를 수 있는 $game_concept_personal_tenets$의 수는 해당 인물의 [piety_level|E] 및 [GetTrait('theologian').GetName( GetNullCharacter )] [trait|E]의 영향을 받습니다."
 game_concept_personal_tenets: "개인 원리"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "추기경"
 game_concept_cardinals: "추기경"
 game_concept_cardinal_possessive: "추기경의"
 game_concept_cardinals_possessive: "추기경의"
 game_concept_cardinalate: "추기경직"
 game_concept_cardinalates: "추기경직"
 game_concept_cardinal_desc: "[the_christian_church|e]의 뜻을 더 멀리 행사할 수 있도록 교황에 의해 선출되는 [clergy|e] 구성원입니다. [college_of_cardinals|E]의 모든 구성원은 교황 후보인 동시에 교황 선출 유권자이며, [papabile_score|E]를 보유합니다."
 game_concept_college_of_cardinals: "추기경단"
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$은 교황에게 조언하며 [the_christian_church|E]의 다음 [head_of_faith|E]를 선출하는 [cardinals|E] 기관입니다.\n\n모든 [cardinal|E]은 교황 후보인 동시에 교황 선출 유권자입니다."
 game_concept_papabile_score: "교황 후보 점수"
 game_concept_papabile_scores: "교황 후보 점수"
 game_concept_papabile_score_desc: "모든 [college_of_cardinals|E] 구성원은 각자의 [traits|E], [piety_level|E], [rite|E] 및 다른 추기경들의 [opinion|E]에 따라 산출되는 $game_concept_papabile_score$를 보유합니다.\n\n$game_concept_papabile_score$가 가장 높은 [cardinals|E]은 교황 선출 시 높은 확률로 표를 더 많이 받습니다.\n\n$game_concept_papabile_score$는 #high $increase_papabile_score_interaction$#! [character_interaction|E] 및 [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E]으로 증가시킬 수 있습니다."
 game_concept_mainline_rite: "주류 교파"
 game_concept_mainline_rite_desc: "주류 [rite|E]는 [faith|E]에서 가장 두드러지는 믿음을 나타냅니다. 비주류 $game_concept_rite$의 경우 해당 $game_concept_rite$의 [rite_divergent|E]로 간주됩니다.\n\n어느 $game_concept_rite$가 주류인지는 해당 $game_concept_faith$의 [head_of_faith|E] 보유 여부에 따라 달라집니다.\n\n$game_concept_faith$에 $game_concept_head_of_faith$가 있다면 주류 $game_concept_rite$는 이 교계 지도자가 따르는 교파입니다. 즉 잠재적인 [challenger_hof|E]를 포함해, 다른 $game_concept_rite$의 계승자가 교계 지도자 자리를 이어받으면 주류 교파가 변경될 수 있습니다.\n\n$game_concept_head_of_faith$가 없다면 주류 교파보다 더 많은 추종자 [Concept( 'counties', '영지' )|E]를 보유한 $game_concept_rite$가 주류 교파를 대체합니다. 단 해당 $game_concept_rite$에서 보유한 [holy_sites|E] 수가 대체하고자 하는 교파의 성지 수와 같거나 그 이상이어야 합니다."
 game_concept_mainline_rites: "주류 교파"
 game_concept_mainline_rite_short: "주류"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "원리 상태"
 game_concept_tenet_status_desc: "$game_concept_tenet_status$는 주어진 [core_tenet|E] 또는 [doctrine|E]에 대한 [rite_possessive|E] 견해를 나타냅니다. 두 경우 모두 관계도가 낮은 단계에서 높은 단계까지 차례대로 올라가는 5단계 척도가 적용됩니다.\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E] — $game_concept_rite$가 해당 $game_concept_core_tenet$ 또는 $game_concept_doctrine$를 인지하지 않는 상태입니다.\n$EFFECT_LIST_BULLET$[known_tenet_status|E] — $game_concept_rite$가 해당 원리 또는 교리를 인지하고 있지만, 지지하거나 금지하지 않습니다.\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E] — $game_concept_rite$가 해당 원리 또는 교리의 실천을 허용합니다.\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E] — $game_concept_rite$가 해당 원리 또는 교리의 실천을 명백하게 금지합니다.\n$EFFECT_LIST_BULLET$[core_tenet_status|E] — $game_concept_rite$가 $game_concept_core_tenet$의 실천을 적극적으로 장려합니다.\n\n주어진 $game_concept_core_tenet$ 또는 $game_concept_doctrine$에 대한 $game_concept_rite$의 견해에 따라 $game_concept_rite$의 생성이나 분화 시 원리 상태를 선택할 수 있는지, 또한 [followers|E]가 해당 원리 상태와 관계되면 영적인 불이익을 받는지가 정해집니다.\n\n이는 $game_concept_rite$의 입장이 아니라 개인의 인식 정도를 나타내는 [character_possessive|E] [tenet_knowledge|E]과는 다른 개념입니다."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "알려지지 않은"
 game_concept_unknown_tenet_status_desc: "$game_concept_unknown_tenet_status$ [tenet_status|E]는 [rite|E]가 해당 [core_tenet|E] 또는 [doctrine|E]를 전혀 인지하고 있지 않음을 뜻합니다. $game_concept_rite$의 [followers|E]들은 해당 핵심 원리나 교리를 암묵적으로 알지 못하며, 새로운 $game_concept_rite$를 창설할 때 [personal_tenet|E]로 선택할 수도 없습니다."
 game_concept_known_tenet_status: "알려진"
 game_concept_known_tenet_status_desc: "$game_concept_known_tenet_status$ [tenet_status|E]는 [rite|E]가 해당 [core_tenet|E] 또는 [doctrine|E]를 인지하고 있지만, 그 실천을 지지하거나 금지하지 않음을 뜻합니다. 이 상태는 $game_concept_rite$를 생성하거나 분화할 때 고려될 수 있으며 더 높은 [tenet_status|E]로 승격될 수도 있습니다."
 game_concept_permitted_tenet_status: "허용"
 game_concept_permit_tenet_status: "허용"
 game_concept_permitted_tenet_status_desc: "$game_concept_permitted_tenet_status$된 [tenet_status|E]는 [rite|E]가 해당 [core_tenet|E] 또는 [doctrine|E]를 적극적으로 장려하지는 않으나, 승인한다는 뜻입니다. $game_concept_rite$에 속한 [character|E]은 해당 $game_concept_core_tenet$를 영적인 불이익 없이 [personal_tenet|E]로 채택할 수 있습니다."
 game_concept_prohibited_tenet_status: "금지"
 game_concept_prohibit_tenet_status: "금지"
 game_concept_prohibited_tenet_status_desc: "$game_concept_prohibited_tenet_status$ [tenet_status|E]는 [rite|E]가 해당 [core_tenet|E] 또는 [doctrine|E]를 명백하게 금지한다는 뜻입니다. 해당 $game_concept_core_tenet$를 [personal_tenet|E]로 채택한 $game_concept_rite$의 [character|E]은 이를 [secret|E]에 부치며, [prohibited_tenet_status|E] [core_tenets|E]를 [core_tenet_status|E]으로 채택한 $game_concept_rite$는 속한 [faith|E]에서 훨씬 더 벗어나는 [rite_divergent|E]가 됩니다."
 game_concept_core_tenet_status: "핵심"
 game_concept_core_tenet_status_desc: "$game_concept_core_tenet_status$ [tenet_status|E]는 [rite|E]가 해당 [core_tenet|E] 또는 [doctrine|E]를 본질적인 관습 중 하나로서 적극적으로 장려한다는 뜻입니다. 또한 $game_concept_rite$의 모든 [followers|E]가 이 영향을 받습니다."
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "종교 지식"
 game_concept_doctrine_knowledge: "교리 지식"
 game_concept_rite_knowledge: "교파 지식"
 game_concept_agnostic_knowledge: "지식"
 game_concept_tenet_knowledge_desc: "인물은 모든 종교 관습의 세세한 사항을 다 알지 못합니다.\n\n알려진 원리와 교리는 [rite_divergent|E] $game_concept_rite$를 창설할 때 사용할 수 있으며, [personal_tenets|E]로 채택될 수 있습니다. $game_concept_rite$의 모든 $game_concept_core_tenets$ 및 $game_concept_doctrines$를 안다면 일이 더 쉬워집니다.\n\n자신의 [faith|E] 내 모든 [core_tenets|E] 및 [doctrines|E]는 알고 있는 지식으로 간주됩니다. 새로운 지식은 [spouses|E] 또는 [friends|E], [traveling|E], [activities|E] 또는 교파 학습 [scheme|E]과 같은 관계에서 습득할 수 있습니다."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "봉안"
 game_concept_enshrine: "봉안"
 game_concept_enshrined_desc: "[holy_site|E]에 봉안한 [holy_relic|E]은 성지 보너스를 활성화하며 이 보너스의 양을 증가시키고, 증가하는 양은 봉안된 모든 유물의 총 [rarity|E] 단계에 따라 달라집니다.\n\n봉안된 유물은 더 이상 인물의 소유가 될 수 없으나 [holder|E], [top_liege|E], 성지의 [clerical_region|E] 소유주와 상호작용이 가능합니다. 이 유물은 더 이상 부식되지 않습니다. 자신이 믿는 [faith|E]의 성유물만 봉안할 수 있으며, 다른 신앙의 성유물을 봉안하면 아무런 혜택도 받지 못합니다.\n\n유물을 봉안하거나, 봉안한 유물을 제거하면 이와 관련된 보상 또는 비용 소모가 따를 수 있습니다."
 game_concept_holy_relic: "성유물"
 game_concept_holy_relics: "성유물"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$은 [faith|E]에 있어 종교적으로 중요한 의미를 갖는 [artifact|E]입니다. $game_concept_holy_relic$은 해당 신앙의 [holy_site|E]에 [enshrined|E]해 혜택을 받을 수 있습니다.\n\n일부 유물은 해당 신앙에서 본질적으로 신성하게 여겨지지만, 유물을 [sanctified|E]해 성유물로 만들 수도 있습니다."
 game_concept_sanctified: "성화"
 game_concept_sanctify: "성화"
 game_concept_sanctifying: "성화"
 game_concept_sanctified_desc: "[artifact|E]을 성화하면 [faith|E]의 [holy_relic|E]이 됩니다. 한 유물이 여러 신앙에 대해 성화되는 것도 가능합니다."
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "교회 장원"
 game_concept_ecclesiastical_estates: "교회 장원"
 game_concept_ecclesiastical_estate_desc: "$game_concept_ecclesiastical_estate$ 또는 $game_concept_cathedral_complex$는 [clerical_title|E]에 딸린 [domicile|E]의 한 유형으로, [archbishop|E] 및 그 교구에서 사적으로 보유한 토지를 나타냅니다. [GetGovernment('ecclesiastical_government').GetName] 내 하위 [clergy|E]가 이러한 토지를 부여받으려면 거기에 해당하는 [title|E]를 획득해야 합니다.\n\n이곳에 [ecclesiastical_estate_buildings|E]을 건설해 소유주의 재산, [piety|E], [spiritual_fulfillment|E]을 확장할 수 있습니다. $game_concept_ecclesiastical_estate$의 위치는 변하지 않으며, 작위의 다음 [holder|E]에게 상속됩니다."
 game_concept_ecclesiastical_estate_building: "교회 장원 건물"
 game_concept_ecclesiastical_estate_buildings: "교회 장원 건물"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$은 [ecclesiastical_estate|E]의 고유하고 지속적인 개선 수단입니다.\n\n다양한 구조물을 건설할 수 있으며, 소유주가 사적인 수입, [piety|E], [spiritual_fulfillment|E]을 창출하고 여러 [decisions|E]과 [interactions|E] 등의 요소에 접근할 수 있도록 도와줍니다."
 game_concept_cathedral_complex: "대성당 단지"
 game_concept_cathedral_complexes: "대성당 단지"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "$game_concept_cathedral_complex$ 건물"
 game_concept_cathedral_complex_buildings: "$game_concept_cathedral_complex$ 건물"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "시성"
 game_concept_canonized_desc: "사후에 성자로 추대되거나, 다른 신앙의 경우 왈리 또는 공경받는 조상처럼 성자와 비슷한 존재가 된 [character|E]은 [GetTrait('saint').GetName( GetNullCharacter )] [trait|E]을 획득합니다.\n\n고결한 삶은 $game_concept_canonization$으로 이어질 수 있습니다. 이는 [decision|E]을 통해 탄원할 수 있으며, [head_of_faith|E]의 축복이 필요할 수 있고, 성자의 무덤을 축성하는 것으로 그 과정이 마무리됩니다. 이후 성자의 안식처는 경건한 여행자들을 끌어모으며, 성자의 유해는 [holy_relics|E]이 될 수도 있습니다."
 game_concept_canonization: "시성"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "성인 자격"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "관련된 [ecclesiastical|E] 또는 [theocratic|E] [ruler|E]의 지지를 통해 [unpressed_claim|E]을 [pressed_claim|E]으로 강화하는 [interaction|E]입니다."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "다른 [ruler|E]에게 속한 [title|E]에 대한 [claim|E]을 제공하는 [interaction|E]입니다. 관련된 [ecclesiastical|E] 또는 [theocratic|E] [character|E]의 승낙이 필요합니다."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "두 [rulers|E] 사이에서 [title|E] 또는 [vassal|E]의 평화적인 이전을 가능하게 하는 [interaction|E]으로, 성공 여부는 대상 [ruler|E] 및 부차적인 중보자의 승낙에 달려 있습니다.\n\n거부할 경우 보통 수혜자의 [piety|E] 및 [legitimacy|E]이 소모되며, 상호작용의 주체가 승낙을 강제할 방식으로 선택했던 추가 비용도 소모됩니다.\n\n중보자는 관련된 [ecclesiastical|E] 또는 [theocratic|E] 영주로, 두 경우 모두 해당 상호작용이 애초에 발생하지 않도록 금지할 수도 있으며, [GetLaw('church_authority_3').GetName] [law|E]을 통해 상호작용의 승낙을 강제할 수도 있습니다."
 game_concept_challenger_hof: "교계 지도자 도전자"
 game_concept_antipope: "대립교황"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$는 [mainline_rite|E] $game_concept_head_of_faith$에 맞서는 경쟁 [head_of_faith|E]입니다.\n\n[ruler|E]는 자신의 [clergy|E] 구성원을 후원해 $game_concept_challenger_hof$로 만들 수 있습니다. [clergy|E] [ruler|E] 또는 속세 교계 지도자를 보유한 [faith|E]의 영주는 자신을 도전자로 선언할 수 있습니다.\n\n후원받는 $game_concept_challenger_hof$는 자신의 후원자가 믿는 [rite|E]를 따르며, 해당 후원자의 [external_clerical_puppet|E]가 되고 후원자는 도전자에 대한 [weak_hook|E]을 보유하게 됩니다.\n\n$game_concept_mainline_rite$ $game_concept_head_of_faith$는 $game_concept_challenger_hof$를 따르는 이, 즉 그 후원자와 후원자의 [vassals|E]을 [excommunicate|E]할 수 없습니다.\n\n$game_concept_challenger_hof$를 따르는 모든 인물은 $game_concept_mainline_rite$ $game_concept_head_of_faith$ 대신 교계 지도자 도전자에게 성직 요청을 합니다. 이러한 요청에는 다음 [interactions|E]이 있습니다.\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\n$game_concept_challenger_hof$ 또는 그 후원자는 적법한 $game_concept_head_of_faith$에게 [pam_challenge_hof_cb|E] [casus_belli|E]을 사용할 수 있습니다.\n\n대신 경쟁 [kings|E] 또는 그 이상의 지위를 보유하며 같은 [faith|E]을 가진 인물은 후원자를 상대로 [pam_antiking_cb|E]를 사용해 경쟁 주장자를 퇴위시킬 수 있습니다."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "교계 지도자 도전"
 game_concept_pam_challenge_hof_cb_desc: "[challenger_hof|E] 또는 그 후원자가 자신의 [faith|E]의 적법한 [head_of_faith|E]를 상대로 사용하는 [casus_belli|E]입니다. 승전 시 $game_concept_challenger_hof$가 $game_concept_head_of_faith$ 자리에 오르며, 해당 인물의 [rite|E]는 [mainline_rite|E]가 됩니다. 전쟁에서 승리하고 자신의 $game_concept_challenger_hof$보다 지위가 높은 후원자는 이 도전자를 [vassal|E]으로 받아들입니다."
 game_concept_pam_antiking_cb: "대립교황 퇴위"
 game_concept_pam_antiking_cb_desc: "[challenger_hof|E]를 후원하거나 섬기지 않으며, [christian|E] [kings|E] 이상의 지위를 보유한 인물이 사용할 수 있는 [casus_belli|E]입니다. 같은 [faith|E]을 지닌 [independent|E] 후원자를 상대로 사용해, 해당 후원자의 $game_concept_challenger_hof$를 퇴위시키며 적법한 [head_of_faith|E]의 감사 인사를 받을 수 있습니다."
 game_concept_petition_antipope_indulgences_interaction: "대립교황에게 면죄부 청원"
 game_concept_petition_antipope_indulgences_interaction_desc: "[challenger_hof|E]를 따르는 인물이라면 누구든 사용할 수 있는 [interaction|E]입니다. [mainline_rite|E] [head_of_faith|E]를 건너뛰고, 대신 $game_concept_antipope$에게 [gold|E]를 헌납하고 용서와 [piety|E]를 얻습니다. 후원자의 경우 청원이 자동으로 수락됩니다."
 game_concept_petition_antipope_gold_interaction: "대립교황에게 금화 탄원"
 game_concept_petition_antipope_gold_interaction_desc: "[challenger_hof|E]를 따르는 인물이라면 누구든 사용할 수 있는 [interaction|E]입니다. $game_concept_antipope$에게 [gold|E]를 요청합니다. 후원자의 경우 요청이 자동으로 수락됩니다."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "고위 성직자 및 강력한 영주가 사용할 수 있는 [decision|E]입니다. [the_christian_church|E]를 자신이 선택한 형세 쪽으로 이끌 수 있습니다."
 game_concept_tenet_popularity: "원리 인기"
 game_concept_tenet_popularity_desc: "[personal_tenets|E]가 [faith|E] 내에서 전파되면 그 실천 또한 더 흔해집니다. $game_concept_tenet_popularity$는 [core_tenet|E]가 얼마나 널리 퍼져 있는지를 나타내며, [ecumenical_council|E]의 토론 주제 또는 [papal_bull|E]의 대상으로 선택될 확률에도 영향을 미칩니다.\n\n$game_concept_tenet_popularity$가 높을수록, 원리가 [ecumenical_council|E]에서 논쟁의 대상이 될 때 [clergy|E]가 해당 원리를 더 많이 편듭니다. $game_concept_tenet_popularity$가 #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!에 도달하면 [head_of_faith|E]가 자신의 신념과는 상관없이 해당 원리를 [permitted_tenet_status|E] 상태로 선언할 가능성이 높습니다."
 game_concept_ecumenical_council_innovator: "혁신주의자"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "혁신주의자"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "혁신주의자는 [ecumenical_council|E] [activity|E]의 [activity_guests_short|E]으로, [activity_host_short|E]가 제안하는 [core_tenet|E] 또는 [doctrine|E] 상태 변경 안건에 찬성표를 던집니다.\n\n혁신주의자는 모든 변화에 반대표를 던지며 현 상태를 보존하고자 하는 문객인 [ec_conservatives|E]에 직접적으로 반대하는 인물입니다.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help 투표가 허용된 [characters|E]: [clergy|E], [clerical_puppet|E]를 보유한 [rulers|E] 및 [activity_host|E]#!"
 game_concept_ecumenical_council_conservative: "보수주의자"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "보수주의자"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "보수주의자는 [ecumenical_council|E] [activity|E]의 [activity_guests_short|E]으로, [activity_host_short|E]가 제안하는 [core_tenet|E] 또는 [doctrine|E] 상태 변경 안건에 반대표를 던집니다.\n\n보수주의자는 변화를 시행하려는 문객인 [ec_innovators|E]에 직접적으로 반대하는 인물입니다.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "[ecclesiastical|E] [rulers|E]가 자신의 [clerical_region|E]을 인접한 [duchy|E]의 [Concept( 'de_jure', '규범상' )|E] [Concept( 'counties', '영지' )|E]로 확장하기 위해 사용하는 [interaction|E]입니다.\n\n이는 [head_of_faith|E]의 승인이 있어야만 가능합니다."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "[ecclesiastical|E] [rulers|E]가 같은 [faith|E]을 가진 세속 영주에게 적대 신앙의 영주를 상대로 [holy_war|E]을 선포하게 하는 [interaction|E]입니다."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "[ecclesiastical|E] [rulers|E]가 세속 [ruler|E]에 대한 [claim|E]을 공시하기 위해 같은 [faith|E]을 가진 세속 영주를 상대로 [war|E]을 선포하게 할 수 있는 [interaction|E]입니다."
 game_concept_treasury_cardinal_budget: "추기경 예산"
 game_concept_treasury_cardinal_budget_short: "추기경"
 game_concept_treasury_cardinal_budget_benefices: "추기경 성직록"
 game_concept_treasury_cardinal_budget_desc: "중앙 교회 재정에서 [cardinals|E]에게 할당한 국고입니다. 해당 추기경에게 배정된 직접적 및 간접적인 [Glossary( '성직록', 'CARDINAL_BENEFICES_GLOSS' )]을 나타냅니다."
 CARDINAL_BENEFICES_GLOSS: "성직록은 성직자가 #i in commendam#!(신탁) 형태로 부여받는 지역이나 외지의 부동산, 집무실 또는 교황청 분배 수익이었습니다. 성직록은 수입을 창출하며, 이 수입에는 보통 직접적인 행정적 책임이 따르지 않습니다."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "[clerical|E] 권위자가 [spiritual_fulfillment|E]의 위안을 주는 대가로 [hook|E]을 획득하는 [interaction|E]입니다."
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "다른 [character|E]에게 정결 서원을 하고 장기적인 [fertility|E] 불이익을 감수하도록 요구하는 [interaction|E]입니다."
 game_concept_military_holy_order: "기사수도회"
 game_concept_military_holy_orders: "기사수도회"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "기사수도회의"
 game_concept_military_holy_orders_possessive: "기사수도회의"
 game_concept_military_holy_order_desc: "$game_concept_military_holy_order$는 [holy_order|E]의 한 유형으로, 신봉하는 [faith|E]의 땅을 보호하고 확장하기로 맹세한 전사들로 이루어집니다.\n\n동일한 신앙을 믿는 영주들은 [piety|E]를 소모해 [faith_hostile|L] 또는 [faith_evil|L] $game_concept_faith$과의 [war|E]에 기사수도회를 고용할 수 있습니다. 해당 전쟁이 끝나면 기사수도회는 더 이상 해당 영주를 위해 싸우지 않습니다.\n\n$game_concept_holy_order$에는 [military_holy_order_patron|E]가 존재할 수 있으며, 이 후원자는 기사수도회 고용 시 비용을 소모하지 않아도 됩니다."
 game_concept_military_holy_order_patron: "기사수도회 후원자"
 game_concept_military_holy_order_patronage: "기사수도회 후원"
 game_concept_military_holy_order_patronize: "후원"
 game_concept_military_holy_order_patron_desc: "[military_holy_order|E]의 $game_concept_holy_order_patron$는 같은 [faith|E]을 신봉하며 수도회의 수도가 속한 [realm|E]을 지배하는 [duke|E]-[title_tier|E] 이상의 [ruler|E]입니다.\n\n$game_concept_holy_order_patron$는 종교상 적을 상대하기 위해 $game_concept_holy_order$을 자유롭게 소집할 수 있으며, 이 경우 [piety|E]를 소모하지 않습니다.\n\n수도회의 수도 지배가 중단되는 경우, 후원 관계는 [duke|E]-[title_tier|E] 이상의 [vassals|E]에게 넘어갈 수 있습니다."
