 #Interaction reference tooltips
 pam_estate_interaction_tt_demand_child_as_monk_interaction: "누군가에게 [child|E], 후손, 또는 보호 아래 있는 미성년자 [courtier|E]를 [GetTrait('devoted').GetName( GetNullCharacter )]로서 바쳐 모든 [succession|E]에서 제거하고 당신의 [courtier|E]로 만듭니다."
 pam_estate_interaction_tt_demand_church_succession_interaction: "누군가가 정당한 후계자 없이 세상을 떠날 경우, 다스리던 영지는 [fallback_heir|E]로서 나에게 넘어옵니다."
 pam_estate_interaction_tt_demand_divorce_interaction: "[faith|E]에 어긋나는 혼인 관계의 배우자와 이혼하라고 누군가에게 요구합니다. 실제로 그렇지 않더라도, 그렇게 보이게 만들 수는 있습니다."
 pam_estate_interaction_tt_ecclesiastic_consecrate_kingdom_interaction: "누군가를 위해 새로운 [kingdom|E]을 수립하고, 그 대가로 [hook|E]을 획득합니다"
 pam_estate_interaction_tt_ecclesiastical_bestow_title_interaction: "영적 권위를 사용하여 아직 생성되지 않은 [title|E]를 누군가에게 직접 하사하고, [rank|E]을 높일 수 있습니다"
 pam_estate_interaction_tt_influence_papal_vote_interaction: "누군가에게 압박을 가해 당신이 선택한 후보에게 [cardinal|E] 표를 던지도록 합니다"
 pam_estate_interaction_tt_pam_evangelize_personal_tenet_interaction: "누군가에게 당신의 [personal_tenet|E]를 전파하여 이를 자신의 것으로 받아들이도록 권합니다"
 pam_estate_interaction_tt_request_clerical_chastity_interaction: "누군가에게 [GetPlayer.GetFaith.HighGodName] 앞에서 정결 서원을 하도록 요구합니다. 상대가 받아들이면 장기간 [fertility|E] 불이익을 받으며, 서원이 끝나거나 철회될 때까지 유혹이나 구애를 시작할 수 없습니다."
 pam_estate_interaction_tt_request_ecclesiastical_treasury_interaction: "[GetPlayer.GetPlayerInteractionTooltip('request_ecclesiastical_treasury_interaction')]"
 pam_estate_interaction_tt_request_realm_priest_replacement_interaction: "[GetPlayer.GetPlayerInteractionTooltip('request_realm_priest_replacement_interaction')]"
 pam_estate_interaction_tt_spiritual_counsel_interaction: "누군가에게 개인 상담을 제공합니다. 현명한 조언을 하고 고해를 듣는 대가로 [hook_i][hook|E]을 획득합니다."
 pam_estate_interaction_tt_take_monastic_vows_interaction: "누군가에게 [monastic_holy_order|E]에 가입하도록 요청합니다"
 pam_estate_interaction_tt_take_vows_interaction: "누군가에게 수도 서원을 하고 성직자가 될 것을 요청합니다"
