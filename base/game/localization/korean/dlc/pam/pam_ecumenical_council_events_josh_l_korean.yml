l_korean:
 ecumenical_council_events_josh.0001.t: "끝기도의 살인"
 ecumenical_council_events_josh.0001.desc: "독실한 자는 예측하기 쉽다. [murder_target.GetTitledFirstName](이)가 [Glossary( '끝기도', 'COMPLINE_GLOSS' )] 시간에 기도하러 고개를 숙이자, 나는 그림자 속에 몸을 숨겼다. \n\n[murder_target.GetHerHim]는 긴 기도를 드리는 동안 위험에 노출되었다. 주변에 아무도 없이 혼자라면, 제의나 벨벳 같은 질 좋은 의복도 올가미가 될 수 있는 법이다."
 ecumenical_council_events_josh.0001.a: "움직여 [murder_target.GetHerHis] 장신구를 꽉 조인다."
 ecumenical_council_events_josh.0001.a.tt: "너무 꽉 끼도록 조였음"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetSheHe|U]가 손아귀에서 벗어남"
 ecumenical_council_events_josh.0001.a.toast.success: "살인에 성공함"
 ecumenical_council_events_josh.0001.a.toast.failure: "살해 시도가 실패함"
 ecumenical_council_events_josh.0001.a.flavor: "저렇게 기도하는 사람이라면 죄인임이 틀림없다..."
 ecumenical_council_events_josh.0001.b: "아니지, 신성한 시간에는 안 될 말이다..."
 COMPLINE_GLOSS: "끝기도는 밤에 하는 기도를 뜻합니다. 기독교 전통에 따른 매일의 기도 시간표인 시간 전례에서 하루의 마지막 기도에 해당합니다."
 ecumenical_council_events_josh.0010.t: "성자 축하 행사"
 ecumenical_council_events_josh.0010.desc: "성직자들이 모였다. 우리를 인도하는 별 중 하나를 기념하는 일보다 큰 기쁨은 없는 법이다. 이번 달에는 [monthly_saint.GetTitledFirstName](을)를 기리기로 했다.\n\n\"[ROOT.Char.GetFaith.HighGodNamePossessive] 이름으로, 오늘의 예배를 인도하겠습니다.\""
 ecumenical_council_events_josh.0010.a: "미사를 봉헌한다."
 ecumenical_council_events_josh.0010.b: "내가 설교하겠다."
 ecumenical_council_events_josh.0010.c: "그냥 찬송가나 찬가를 하나 더해라."
 ecumenical_council_events_josh.0011.t: "우레 같은"
 ecumenical_council_events_josh.0011.desc: "문객을 맞이하다 보니 [guest_giant.GetTitledFirstName](이)가 거대한 풍채를 자랑하며 군중 사이에서 우뚝 솟은 모습이 보였다. 하지만 [guest_giant.GetSheHe]가 입을 열자, 그제야 [guest_giant.GetHerHis] 진정한 능력을 알 수 있었다. \"반갑습니다, 신앙을 수호하는 동지들이여.\" \n\n우레처럼 쩌렁쩌렁한 저 목소리는 분명 쓸모가 있을 것이다. 마침 [Glossary( '저녁 기도', 'VESPER_GLOSS' )] 시간의 찬송가에 베이스가 한 명 더 필요했는데..."
 ecumenical_council_events_josh.0011.a: "[guest_giant.GetHerHis] 목소리가 [ROOT.Char.GetFaith.HighGodName]에 바치는 기도를 실어 나르게 하라."
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName](와)과 모든 군중이 감탄했다."
 ecumenical_council_events_josh.0011.b: "저 깊이 울리는 목소리로 논쟁에서 날 돕게 해야겠다."
 ecumenical_council_events_josh.0011.b.tt: "[guest_giant.GetSheHe|U]가 의지할 만한 존재가 됨"
 ecumenical_council_events_josh.0011.b.tt2: "[guest_giant.GetSheHe|U]는 대가를 줘야만 믿을 수 있는 존재가 되어줌"
 ecumenical_council_events_josh.0011.b.toast.success: "[guest_giant.GetHerHim]를 설득해 지지를 얻어냄"
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetSheHe|U]가 당신을 지지하는 대가로 무언가를 바람"
 ecumenical_council_events_josh.0011.b.flavor: "[guest_giant.GetTitledFirstName](이)가 알맞은 때 찬성한다고 외치면 내가 우위를 점할 수 있다."
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U]는 문객이지 도구가 아니다."
 ecumenical_council_events_josh.0011.c.flavor: "[guest_giant.GetHerHim]가 우리 사이에서 자기 자리를 찾게 둔다."
 ecumenical_council_events_josh.0011.c.tt: "[guest_giant.GetTitledFirstName](을)를 성가대나 논쟁에 끌어들이지 않음"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U](이)가 보편 공의회에서 [CHARACTER.GetShortUIName](을)를 지지하기로 함"
 VESPER_GLOSS: "저녁 기도는 저녁에 하는 기도를 뜻합니다. 기독교 전통에 따른 매일의 기도 시간표인 시간 전례에서 보통 저녁 식사 전에 행하는 기도에 해당합니다."
 ecumenical_council_events_josh.0012.t: "주교의 반지"
 ecumenical_council_events_josh.0012.desc: "의회가 시작한 뒤부터 [guest_bishoplover.GetTitledFirstName](와)과 [guest_bishop.GetTitledFirstName](은)는 서로 딱 달라붙어 있었다. 오늘 [Glossary( '아침 기도', 'LAUD_GLOSS' )] 시간에는 [guest_bishoplover.GetFirstName](이)가 늦었으며, 차림새도 단정하지 못했다. 그런데 [guest_bishoplover.GetHerHis] 손가락에 [guest_bishop.GetFirstNamePossessive] 반지가 있는 게 아닌가? 나는 이 사실을 눈치채고 눈썹을 치켜올리며 [guest_bishoplover.GetHerHim]에게 조용히 눈치를 보냈다. \n\n자기 실수를 깨달은 [guest_bishoplover.GetFirstName](은)는 얼굴을 붉히며 더듬거렸다. \n\n \"부탁드립니다. 굳이 남들한테 알릴 이유는 없잖습니까...\""
 ecumenical_council_events_josh.0012.b: "\"반지를 내놓고 입 다물라.\""
 ecumenical_council_events_josh.0012.c: "\"이는 나와 그대, 그리고 [ROOT.Char.GetFaith.HighGodName]만 아는 일이다.\""
 ecumenical_council_events_josh.0012.bishopringname: "주교의 반지"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\n착용자의 사도 직무를 알리는 표식이 보입니다."
 LAUD_GLOSS: "아침 기도는 아침에 하는 기도를 뜻합니다. 기독교 전통에 따른 매일의 기도 시간표인 시간 전례에서 보통 아침 식사 전에 행하는 기도에 해당합니다."
 ecumenical_council_events_josh.0013.t: "범죄에 가까운 복식"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U](이)가 영광스러운 모습으로 서 있었다. 행사에 맞게 새로 만들어진 제의를 입고 있었는데, 분명 [fashion_criminal.GetHerHis] 추종자 무리가 바친 선물이리라. 비단으로 만들어진 겉옷에서 자수로 놓인 [ROOT.Char.GetFaith.WealthGodName](이)가 이쪽을 바라보고 있었다. \n\n참으로 뻔뻔하군! 지금 [fashion_criminal.GetFaith.GetName]의 원리를 공공연히 어기겠다는 뜻인가? 아니면 [fashion_criminal.GetSheHe]는 그저 허영심 가득한 공작 같은 인간인 걸까?"
 ecumenical_council_events_josh.0013.a: "\"이 망신스러운 모습을 당장 내 앞에서 치워라.\""
 ecumenical_council_events_josh.0013.b: "\"썩 꺼져라. 이 자격 없는 놈!\""
 ecumenical_council_events_josh.0013.b.toast.success: "[fashion_criminal.GetHerHim]를 추방함"
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetSheHe|U]가 간신히 의회에 남음"
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U](이)가 보편 공의회에서 부적절한 의복을 입었음"
 ecumenical_council_events_josh.0020.t: "열성의 등불"
 ecumenical_council_events_josh.0020.desc.intro: "\"이 [ROOT.Char.GetFaith.GetName]의 기둥을 우러러보라! 의로운 자가 어떻게 십자가를 따라야 하는지를 보여주는 진정한 증거다.\" \n\n[host.GetTitledFirstName]"
 ecumenical_council_events_josh.0020.desc_battle_memory: "(은)는 [faith_battle_memory.GetDescription] 당시를 이야기하고 있었다. 어떤 상황에서든 이교도에 맞서야 한다. 나는 검을 들어 올리며 그 찬사를 받아들였다. \"신실한 자들을 위해!\""
 ecumenical_council_events_josh.0020.desc.fallback: "(은)는 최근에 내가 신앙에 이바지했던 일을 인정하고 있었다. 모여든 성직자들 앞에서 호명되니 뿌듯한 기분에 가슴이 터질 것 같았다."
 ecumenical_council_events_josh.0020.a: "\"[ROOT.Char.GetFaith.HighGodNamePossessive] 이름으로 우리가 승리하리라!\""
 ecumenical_council_events_josh.0020.a.flavor: "나의 행동이 참석한 성직자들에게 감동을 줌"
 ecumenical_council_events_josh.0020.b: "그저 이 영광을 만끽하겠다."
 ecumenical_council_events_josh.0021.t: "빛 속에서"
 ecumenical_council_events_josh.0021.desc: "논쟁이 길어지는 동안 빛이 바닥으로 퍼져나갔다. 내가 그 속으로 걸어가자, 갑자기 모두가 나를 바라보았다. \n\n마치 내 말만으로는 부족했다는 듯, 신성한 빛이 내 대의를 강화해 주는 듯했다. 내 논쟁 상대인 [council_opponent.GetFirstName](은)는 그림자 속에 남아 있었다. 이제 [council_opponent.GetHerHis|U] 주장은 전보다 훨씬 더 음침하게 들렸다."
 ecumenical_council_events_josh.0021.a: "[council_opponent.GetFirstName]에 맞서 내 우위를 밀어붙인다."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U](이)가 [ec_conservatives|E]를 버리고 [ec_innovators|E]에 합류함"
 ecumenical_council_events_josh.0021.b: "빛이 회중의 마음을 사로잡게 한다."
 ecumenical_council_events_josh.0021.b.ct: "최대 #V 3#!명의 [ec_conservatives|E]가 [ec_innovators|E]에 합류함"
 ecumenical_council_events_josh.0021.c: "모두에게 내 영광을 보여준다."
 ecumenical_council_events_josh.0021.c.ct: "[clerical_title|E]를 향해 #V 50#! [appointment|E] 투자 추가"
 ecumenical_council_events_josh.0022.t: "신앙으로 이룬 통합"
 ecumenical_council_events_josh.0022.desc: "공의회를 돌아보던 [host.GetTitledFirstName|U](이)가 외부의 위협에 맞서 [host.GetHerHis] 추종자들을 하나로 모을 기회를 포착했다. [host.GetSheHe|U]는 나와 [alliance_target.GetTitledFirstName](을)를 불러 자신의 앞에 세웠다.\n\n\"그대들은 믿음 속에 서 있으니, 역경 앞에서도 나란히 서서 맞서야 하네.\""
 ecumenical_council_events_josh.0022.a: "교회가 우리의 동맹을 축복하기를."
 ecumenical_council_events_josh.0022.a.flavor: "내 신실한 입지를 바탕으로 이 동맹을 굳히겠다."
 ecumenical_council_events_josh.0022.b: "동맹은 상호 이해로 이루어질 것이다."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetHerHim|U]가 동맹에 동의함"
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetSheHe|U]가 당신의 접근에 불쾌해함"
 ecumenical_council_events_josh.0022.b.flavor: "내 매력적인 사교 능력이면 충분하지."
 ecumenical_council_events_josh.0022.c: "공의회는 이럴 장소가 아니다."
 ecumenical_council_events_josh.0022.c.flavor: "존중을 담아 인사하는 정도면 될 거다."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U](이)가 부적절한 동맹을 거부함"
 ecumenical_council_events_josh.0023.t: "나를 위한 기도"
 ecumenical_council_events_josh.0023.desc: "\"그대에게 은총과 평화가 함께하기를.\" [host.GetTitledFirstName|U](이)가 다가가며 문객들을 축복했다. 이 신앙의 기둥 앞에 몸을 던지면 이 기회를 움켜쥘 수 있다. [host.GetHerHim]가 [Glossary( '아침 기도', 'LAUD_GLOSS' )]에 나를 넣어 주기만 한다면 구원이 내게 한 발짝 다가올 테니까. \n\n \"헛짓거리 말고 좀 비키게. 앞을 막고 있으면 어떡하나.\" 다음 차례인 [prayer_opponent.GetFirstName|U](이)가 내 뒤에서 속삭였다."
 ecumenical_council_events_josh.0023.a: "\"상당한 양의 헌금을 할 테니, 그대의 기도에 나를 넣어 주시오.\""
 ecumenical_council_events_josh.0023.b: "주최자의 옷단에 입을 맞춤"
 ecumenical_council_events_josh.0023.b.tt: "내 요청을 확실히 전함"
 ecumenical_council_events_josh.0023.b.tt2: "예법을 어겼으며 옆으로 밀려남"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U](이)가 당신을 위해 기도하게 됨"
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U](이)가 당신의 요청을 흘려넘김"
 ecumenical_council_events_josh.0023.c: "비켜나서 경건한 모습을 보이는 게 낫다."
 ecumenical_council_events_josh.0024.t: "신비의 아름다움"
 ecumenical_council_events_josh.0024.desc: "거룩한 신비에 관한 이야기를 나누고, 새로운 해석을 내놓거나 말다툼을 벌이고 싶어 안달이 난 채로 찾아오는 이들이 있다. [tenet_target_a.GetName] 역시 그런 참석자 중 한 명이었다.\n\n\"[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], 형제여. [ROOT.Char.GetFaith.HighGodName]께서 내려 주신 이 제약을 기리고, 이 길을 따르며 지혜를 찾다 보면 신성함을 이해하게 될 겁니다!\"\n\n군중 사이에서 여러 목소리가 치솟았다가 사라졌다. 한편 [tenet_target_b.Custom('FormalComplimentAdjective')] [tenet_target_b.GetTitledFirstName](은)는 낯선 글에 마음이 사로잡힌 듯했다. 거기서 내가 알아들은 말은 이게 전부였다. \"[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )].\""
 ecumenical_council_events_josh.0024.a: "\"[tenet_target_a.GetFirstNameNoTooltip], 지혜라고 했나?\""
 ecumenical_council_events_josh.0024.b: "꽤 흥미로워 보이는 서책이군."
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName]께서 이미 진정한 길을 보여주셨다."
 ecumenical_council_events_josh.0025.t: "너무 많은 신학자"
 ecumenical_council_events_josh.0025.desc: "커다란 모임의 가장자리에서 소란이 일었다. 새로 도착한 낯선 사람들 몇 명이 여정의 먼지를 털어내고 있었다. 고위 성직자들은 속삭이며 그 모습을 바라보았고, 새로 도착한 이들에게 멀리 가라며 손짓했다. 낯선 이들을 이끄는 [theologian.GetWomanMan]이 외쳤다.\n\n\"동료 [theologian.GetFaith.GetAdherentNamePlural]들을 만나러 멀리서 왔습니다. 우리 옛 조상들은 신성한 사도로서 형제 사이나 다름없었습니다. 그런데 왜 제가 여러분과 같이 받아들여지면 안 된다는 겁니까?\""
 ecumenical_council_events_josh.0025.a: "들어오려면 대가를 치러야 한다..."
 ecumenical_council_events_josh.0025.a.flavor: "[theologian.GetHerHim]를 내 초대장 끝자락에 적어 넣는 것쯤이야 쉽지."
 ecumenical_council_events_josh.0025.b: "\"그대의 가르침은 수치다!\""
 ecumenical_council_events_josh.0025.c: "\"흥미롭군. 나중에 우리만의 공의회를 열도록 하지.\""
 ecumenical_council_events_josh.0025.d: "[theologian.GetHerHim]를 정중하게 밀어낸다."
