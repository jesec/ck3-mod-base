 pam_bull_events.0001.t: "[GetCurrentDate.GetYear] 칙서"
 pam_bull_events.0001.desc: "\"나는 여러분 모두에게 [title.GetName]의 이교도들에 맞서 싸워 그들의 폭정으로부터 그 땅을 해방하고, 그들의 손아귀에서 붙잡힌 수많은 형제들을 구해 낼 것을 권고합니다.\n\n이는 여러분의 시대에 그리스도인의 이름의 존엄이 더욱 높아지고, 온 세상이 칭송하는 여러분의 용맹이 온전하고 흔들림 없이 이어지게 하기 위함입니다.\""
 pam_bull_events.0001.a: "#EMP 인 노미네 도미니.#!"
 pam_bull_events.0001.a.flavor: "#EMP 주님의 이름으로.#!"
