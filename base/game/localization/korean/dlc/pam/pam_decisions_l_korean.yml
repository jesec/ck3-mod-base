l_korean:
 pam_invite_syncretic_exiles_decision: "융화주의 추방자 초대"
 pam_invite_syncretic_exiles_decision_desc: "우리가 존중하는 종교에서 추방된 공동체가 안전한 보금자리를 찾아 떠돌고 있다. 이들을 내 봉역으로 초대해 정착하게 하면 그 전통을 공유할 수 있다."
 pam_invite_syncretic_exiles_decision_tooltip: "당신의 개인적인 융화주의에 부합하는 종교 계통의 추방자들을 초대하며, [development|E]를 증가시키나 지역 [faith|E] 또는 [rite|E]가 변경됨.\n\n대량의 [piety|E]를 소모함."
 pam_invite_syncretic_exiles_decision_confirm: "추방자 초대"
 pam_invite_syncretic_exiles_decision_effect: "추방자 무리가 나타나 당신의 [Concept( 'counties', '영지' )|E]에 정착하게 해 달라고 요청하며, [development|E]를 증가시키나 지역 [faith|E] 또는 [rite|E]가 변경될 것임."
 pam_invite_syncretic_exiles_no_pool: "초대할 수 있는 종교적 추방자가 없음"
 SELECT_TENET: "원리 선택"
 REPLACE_TENET: "원리 교체"
 SELECT_HOLY_SITE: "성지 선택"
