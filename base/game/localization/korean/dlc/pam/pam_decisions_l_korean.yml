 pam_proclaim_living_word_decision: "살아있는 말씀 선포"
 pam_proclaim_living_word_decision_desc: "신자들은 [ROOT.Char.GetFaith.HighGodName]께서 나를 택하셨다고 수군거린다. 순례자들은 길가의 성소에서 내 이름을 입에 올리고, [ROOT.Char.GetFaith.PriestNeuterPlural]들은 내 판결을 마치 경전의 말씀인 양 인용한다.\n\n모든 제단에서 선포하라. 나를 통해 살아있는 말씀이 세상에 드러나리라."
 pam_proclaim_living_word_decision_tooltip: "당신의 [faith|E]의 $trait_herald$가 됨"
 pam_proclaim_living_word_decision_confirm: "말씀을 널리 선포하라."
 pam_proclaim_living_word_decision_sf_tt: "당신의 [spiritual_fulfillment|E]이 #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#! 이상임"
