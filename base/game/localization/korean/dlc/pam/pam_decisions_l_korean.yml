 pam_kingdom_of_heaven_decision_subjugation_effect_tt: "모든 [THIS.Char.GetFaith.GetAdherentNamePlural]들을 상대로 #high $tribal_subjugation_cb$#! [casus_belli|E]을 사용할 수 있게 됨"
