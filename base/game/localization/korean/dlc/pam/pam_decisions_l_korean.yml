 pam_determine_patron_saint_decision_desc: "천상의 옥좌에서 성자들은 필멸의 영주들이 투쟁하는 모습을 지켜보고, 우리 영혼을 저울질한다.\n\n성자를 선택해 그 미덕을 따라 내 길을 정하고, 그분의 중보로 [ROOT.GetCharacter.GetFaith.HighGodName](와)과 인간 앞에서 내 손이 흔들리지 않게 하겠다."
