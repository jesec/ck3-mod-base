 pam_kingdom_of_heaven.0001.t: "하느님의 왕국"
 pam_kingdom_of_heaven.0001.desc: "\"하느님 나라는 어떤 사람이 땅에 씨를 뿌려 놓고 밤낮으로 자고 일어나는 동안 씨가 싹트고 자라지만, 어떻게 그리되는지는 알지 못하는 것과 같다.\"\n\n나는 몸을 기독교 세계를 향해 돌린다. 손가락 사이에는 성지의 흙이 쥐어져 있다.\n\n\"땅은 저절로 처음에는 싹을 내고,\" 나는 손을 펴 흙을 바람에 흩날리게 한다. \"다음에는 이삭을 맺으며,\" 내 백성을 가리킨다. \"마침내 이삭에는 알찬 낟알이 영근다.\" 목자의 지팡이를 들어 올린다.\n\n\"곡식이 익으면... 추수 때가 되었으므로 곧 낫을 댄다.\""
 pam_kingdom_of_heaven.0001.a: "나는 [previous_capital.GetNameNoTooltip](을)를 버리지 않겠다."
 pam_kingdom_of_heaven.0001.b: "그리스도의 옥좌에 비하면 성 베드로의 교좌가 무슨 의미가 있겠는가?"
