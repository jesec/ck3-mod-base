 pam_bull_events.0002.desc.tenet_permitted: "\"[tenet_scope.GetName( ROOT.GetCharacter.GetRite )](을)를 믿는 모든 이는 이제 [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]의 허가 아래 그것이 허용되었음을 알도록 하십시오.\""
 pam_bull_events.0002.desc.tenet_forbidden: "\"[tenet_scope.GetName( ROOT.GetCharacter.GetRite )]의 교리는 이제 우리 교회 안에 설 자리가 없습니다. 이를 따르는 자는 누구든 교회의 신성함을 훼손하고 대죄를 저질렀음을 알도록 하십시오.\""
 pam_bull_events.0002.a: "[Glossary( '인 노미네 도미니.', 'IN_NOMINE_DOMINI_GLOSS' )]"
 pam_bull_events.0002.a.flavor: "$pam_bull_events.0001.a.flavor$"
