 pam_decision_confession_name_low: "내 죄를 고백하기"
 pam_decision_confession_desc: "한 [ROOT.Char.GetWomanMan]이 자신이 짊어진 죄책감을 깨달으면 자신의 죄를 고해해야 한다."
 pam_decision_confession_tooltip: "내 죄를 고백하기"
 pam_decision_confession_tooltip_sp_effect: "당신이 [spiritual_fulfillment|E]을 획득하게 됨"
 pam_decision_confession_tooltip_stress_effect: "당신이 [stress|E]를 상실하게 됨"
 pam_decision_confession_confirm: "[ROOT.Char.GetFaith.PriestNeuter] 소환"
 sp_confession_decision_tooltip: "당신의 [spiritual_fulfillment|E]이 #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#! 이상임"
 pam_decision_confession_sp_court_chaplain: "당신이 [court_chaplain|E]를 등용 중"
 pam_decision_events.0001.t: "고해성사"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName](이)가 빈 예배당에서 참을성 있게 기다리고 있었다.\n\n"
 pam_decision_events.0001.desc.bad: "[chaplain.GetHerHis|U] 엄숙한 표정은 신부다운 근엄한 분위기를 풍겼다."
 pam_decision_events.0001.desc.good: "내 어깨에 진 짐이 그리 무겁지는 않더라도, 그 무게를 줄일 수는 있을 것이다."
 pam_decision_events.0001.desc.neutral: "내 마음이 과연 선한지 확신하지 못한 나는 길을 잃은 한 마리 가축처럼 [chaplain.GetHerHim]에게 다가갔다."
 pam_decision_events.0001.desc.sin.preamble: "\n\n저의 죄로 인한 죄책감은 이미 익숙한 벗이 되었습니다."
 pam_decision_events.0001.desc.sin.lustful: "저는 욕정을 제 의지의 주인으로 내버려 두었습니다."
 pam_decision_events.0001.desc.sin.chaste: "저의 순결은 의무를 외면하기 위한 차가운 도피처가 되었습니다."
 pam_decision_events.0001.desc.sin.gluttonous: "저는 절제를 잃고 육신의 욕망을 채웠습니다."
 pam_decision_events.0001.desc.sin.temperate: "저의 절제는 필요한 것마저 부정하는 완고함이 되었습니다."
 pam_decision_events.0001.desc.sin.greedy: "베풀어야 할 때에도 저는 재물을 움켜쥐었습니다."
 pam_decision_events.0001.desc.sin.generous: "저의 베풂은 지혜를 앞질러 저 자신을 텅 비게 만들었습니다."
 pam_decision_events.0001.desc.sin.lazy: "저는 나태함 때문에 기도와 의무를 저버렸습니다."
 pam_decision_events.0001.desc.sin.diligent: "일에 대한 저의 열광은 자비를 밀어냈습니다."
 pam_decision_events.0001.desc.sin.wrathful: "분노가 저를 죄로 이끌었습니다."
 pam_decision_events.0001.desc.sin.calm: "저의 침착함은 미덕으로 꾸민 무관심이었습니다."
 pam_decision_events.0001.desc.sin.patient: "저의 인내는 비겁한 지연으로 변질되었습니다."
 pam_decision_events.0001.desc.sin.impatient: "저는 조급함 때문에 가혹하고 경솔해졌습니다."
 pam_decision_events.0001.desc.sin.arrogant: "교만이 저의 마음을 부풀렸습니다."
 pam_decision_events.0001.desc.sin.humble: "거짓 겸손이 저를 진실에서 멀어지게 했습니다."
 pam_decision_events.0001.desc.sin.deceitful: "저는 거짓을 말했고, 정직하게 밝혔어야 할 것을 숨겼습니다."
 pam_decision_events.0001.desc.sin.honest: "저의 직설적인 정직함은 부드러움이 필요했던 곳에 상처를 남겼습니다."
 pam_decision_events.0001.desc.sin.craven: "저는 두려움 때문에 옳은 일을 저버렸습니다."
 pam_decision_events.0001.desc.sin.brave: "저의 대담함은 신중함을 넘어 무모함이 되었습니다."
 pam_decision_events.0001.desc.sin.shy: "저는 소심함 때문에 마땅히 행해야 할 선을 행하지 못했습니다."
 pam_decision_events.0001.desc.sin.gregarious: "저는 사람들과 어울리기를 좋아한 나머지 양심의 소리를 묻어 버렸습니다."
 pam_decision_events.0001.desc.sin.ambitious: "저의 야심이 양심을 앞질렀습니다."
 pam_decision_events.0001.desc.sin.content: "만족감 때문에 의로움을 향한 갈망이 무뎌졌습니다."
 pam_decision_events.0001.desc.sin.arbitrary: "저는 정의가 아니라 변덕에 따라 다스렸습니다."
 pam_decision_events.0001.desc.sin.just: "저의 정의는 자비롭지 못했고 오만했습니다."
 pam_decision_events.0001.desc.sin.cynical: "냉소가 저의 신앙을 좀먹었습니다."
 pam_decision_events.0001.desc.sin.zealous: "열광이 자애보다 더 뜨겁게 타올랐습니다."
 pam_decision_events.0001.desc.sin.paranoid: "제 의심이 다른 사람들과의 관계를 망쳤습니다."
 pam_decision_events.0001.desc.sin.trusting: "저는 남을 믿은 탓에 악을 보지 못했습니다."
 pam_decision_events.0001.desc.sin.compassionate: "저는 연민 때문에 마땅히 단죄했어야 할 것을 용인했습니다."
 pam_decision_events.0001.desc.sin.callous: "저는 다른 이들의 고통에 마음을 닫았습니다."
 pam_decision_events.0001.desc.sin.stubborn: "저는 완고함 때문에 충고를 받아들이지 않았습니다."
 pam_decision_events.0001.desc.sin.fickle: "변덕이 심해서 제 언변은 신뢰를 잃었습니다."
 pam_decision_events.0001.desc.sin.eccentric: "저의 기행은 신실한 이들에게 물의를 일으켰습니다."
 pam_decision_events.0001.desc.sin.vengeful: "복수심이 저를 집어삼켰습니다."
 pam_decision_events.0001.desc.sin.forgiving: "중대한 죄까지 너무 쉽게 용서했습니다."
 pam_decision_events.0001.desc.sin.sadistic: "저는 잔혹함에서 즐거움을 얻었습니다."
 pam_decision_events.0001.desc.outro: "\n\n\"[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]\""
 pam_decision_events.0001.a: "[chaplain.GetMotherFather], 용서하소서. 제가 죄를 지었습니다."
 pam_john_20_22_english: "성령을 받으라. 너희가 뉘 죄든지 사하면 사하여질 것이요 뉘 죄든지 그대로 두면 그대로 있으리라 하시니라."
 JOHN_20_22_GLOSS: "#weak 요한복음 20장 22~23절, 개역한글판#!"
 pam_decision_act_of_devotion: "헌신의 행위 수행하기"
 pam_decision_act_of_devotion_desc: "내 내면은 [ROOT.Char.GetFaith.HighGodName](와)과 너무도 깊고 강하게 연결되어 있으니, 이를 드러내야만 한다!\n\n[ROOT.Char.GetFaith.PriestNeuterPlural]들을 소환해 대규모 미사를 벌이고 봉역의 모두를 불러야겠다. 이 주군이 얼마나 신앙심이 깊은지 보여주는 거다."
 pam_decision_act_of_devotion_desc_tooltip: "[piety|E]를 [prestige|E]으로 교환"
 pam_decision_act_of_devotion_tooltip_effect: "다음 중 선택:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! [prestige|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E] 및 추가 [prestige_level|E] 1개를 [piety_level|E] 1개와 교환"
 pam_decision_act_of_devotion_confirm: "종이 울리게 하라!"
 pam_decision_act_of_devotion_sp_tooltip: "당신의 [spiritual_fulfillment|E]이 #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#! 이상임"
 pam_decision_act_of_devotion_fame_tooltip: "당신의 [prestige_level|E]가 [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]보다 낮아야 함"
 pam_confession_penalty_modifier: "고해성사 불이익"
 pam_confession_penalty_modifier_desc: "해당 인물은 고해자의 요청에 따라 어떤 행동을 수행해야 합니다."
 pam_meddled_in_clerical_appointments_modifier: "성직자 임명 간섭"
 pam_meddled_in_clerical_appointments_modifier_desc: "해당 [ruler|E]는 [clerical_title|E] [holder|E]를 강제로 교체하여 [clergy|E]의 분노를 샀습니다."
 pam_kowtowed_to_pope_modifier: "교회에 무릎을 꿇음"
 pam_kowtowed_to_pope_modifier_desc: "해당 [ruler|E]는 교회에 머리를 조아리고 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](을)를 종결하는 공의회에서 #EMP 영적, 박탈 가능#! 교리를 지지하겠다고 서약했습니다. 해당 공의회에서 분쟁이 해결되면 이 변화 요소는 제거됩니다."
 pam_kowtow_to_pope_decision: "[ROOT.Char.GetFaith.ReligiousHeadName]에 무릎 꿇기"
 pam_kowtow_to_pope_decision_desc: "성직 작위 임명권을 두고 왕권과 교권이 격렬하게 대립하고 있습니다. 공공연히 맞설 위험을 감수하느니 [ROOT.Char.GetFaith.ReligiousHeadName]에게 머리를 조아리고, 이 문제를 해결하기 위한 대공의회가 소집되면 신자들의 편에 서십시오."
 pam_kowtow_to_pope_decision_tooltip: "교회의 임명권 명분을 지지하겠다고 서약함"
 pam_kowtow_to_pope_decision_confirm: "무릎 꿇기"
 pam_kowtow_to_pope_effect_tt: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](을)를 종결하는 공의회에서 #EMP 영적, 박탈 가능#! 교리를 지지하게 됨"
 pam_kowtow_to_pope_not_already_pledged_tt: "교회를 지지하겠다고 서약하지 않았음"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "당신의 [faith|E]에 [head_of_faith|E]가 있어야 함"
 pam_kowtow_to_pope_toast: "당신이 [ROOT.Char.GetFaith.ReligiousHeadName]에게 무릎을 꿇음"
 pam_decision_events.0001.a.confession_random_outcome: "당신의 [court_chaplain|E]가 무언가를 부탁하거나, 고해성사 도중에 당신이 무언가를 듣게 될 수도 있습니다..."
 pam_decision_events.0001.a.piety: "당신의 고해성사가 진실되게 느껴짐"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName](이)가 새로운 정보를 알았음"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName](이)가 당신의 사특한 특성을 못마땅하게 여김"
 pam_decision_events.0001.a.courtier_secret: "당신이 [my_courtier.GetShortUIName](이)가 고해성사를 듣는 소리를 들음"
 pam_decision_events.0001.a.random_confession: "당신이 누군가 고해성사를 듣는 소리를 들음"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.GetShortUIName](이)가 당신에게 [pilgrimage|E]을 떠나라고 요청함"
 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUIName](이)가 당신에게 [GetCourtPositionType('high_almoner_court_position').GetName()] 고용을 요청함"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUIName](이)가 당신에게 #V 5년#! 동안 그 어떤 공격 전쟁도 선언하지 말 것을 요청함"
 pam_confession_penalty_var.no_war_toast: "당신이 그 어떤 전쟁도 선언하지 않겠다고 약속함"
 pam_decision_events.0001.a.conversion: "[chaplain.GetShortUIName](이)가 당신에게 [target.GetShortUIName](을)를 개종시켜 달라고 요청함"
 pam_decision_events.0001.a.conversion.toast: "당신이 약속을 이행함"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.GetShortUIName](이)가 약속을 이행함"
 pam_decision_events.0002.t: "헌신 과시"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName](이)가 제단 옆에서 내 곁으로 왔다. 부드러운 햇빛이 비쳐"
 pam_decision_events.0002.desc.uncrowned: "내 옷이 신성한 외투처럼 빛났다."
 pam_decision_events.0002.desc.crowned: "내 왕관이 후광처럼 빛났다."
 pam_decision_events.0002.desc.mid: "\n\n\"[ROOT.Char.Custom('RandomBibleQuote')]..\" [my_chaplain.GetHerHis|U] 설교가 이어졌고"
 pam_decision_events.0002.desc.bad: "나는 집중하려 애를 썼다."
 pam_decision_events.0002.desc.good: "청중의 관심은 오직 내게 집중되어 있었다."
 pam_decision_events.0002.desc.neutral: "나는 청중 가운데 설교에 감명받은 이가 있는지 살펴보았다."
 pam_decision_events.0002.desc.outro: "\n\n\"그리고 현명하고 고결한 [ROOT.Char.GetNameNoTooltip]께서 이 불운한 시기에 우리를 이끄실 겁니다.\""
 pam_decision_events.0002.a: "직접 군중을 향해 말해야겠군."
 pam_decision_events.0002.b: "간단하게 인정하는 정도면 충분하겠지."
 pam_mentor_sp_decision: "영적인 인도 제공"
 pam_mentor_sp_decision_desc: "[ROOT.Char.GetFaith.HighGodNamePossessive] 빛 속을 걷는 우리에게는 어둠 속에서 길을 잃은 자들과, 젊음 탓에 생각이나 행동이 그릇된 길로 빠질 수 있는 자들을 인도할 의무가 있다."
 pam_mentor_sp_decision_desc_tooltip: "아이의 [spiritual_fulfillment|E]을 도움"
 pam_mentor_sp_decision_confirm: "말하고, 귀 기울인다."
 pam_mentor_sp_decision_sp_tooltip: "당신의 [spiritual_fulfillment|E]이 #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#! 이상임"
 pam_mentor_sp_decision_tooltip_effect: "당신의 [primary_heir|E] 또는 [favorite_child|E]의 [spiritual_fulfillment|E]이 증가하게 됨"
 pam_mentor_sp_decision_valid_child_tt: "다음 조건을 충족하는 [child|E] 필요:\n$BULLET_WITH_TAB$당신과 같은 [faith|E]을 가짐\n$BULLET_WITH_TAB$#V 16#!세 이상임\n$BULLET_WITH_TAB$당신의 [primary_heir|E] 또는 [favorite_child|E]임\n$BULLET_WITH_TAB$[spiritual_fulfillment|E]이 #V 75#!보다 낮음\n$BULLET_WITH_TAB$영적 인도를 받은 적이 없음"
 pam_mentor_sp_decision_primary_heir_tt: "당신의 [primary_heir|E] 조건:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "최우선 후계자"
 pam_mentor_sp_decision_primary_favorite_child_tt: "당신의 [favorite_child|E] 조건:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "총애받는 자녀"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$당신과 같은 [faith|E]을 가짐\n$BULLET_WITH_TAB$#V 16#!세 이상임\n$BULLET_WITH_TAB$[spiritual_fulfillment|E]이 #V 75#!보다 낮음\n$BULLET_WITH_TAB$영적 인도를 받은 적이 없음"
 pam_decision_events.0003.t: "가장 중요한 가르침"
 pam_decision_events.0003.desc.intro: "밤이 왔으며, 성채는 조용했다. 개인 예배당에서 내 [target_child.Custom('GetDaughterSon')]이 옆에 앉아 있었다.\n\n나는 아이를 바라보았다."
 pam_decision_events.0003.desc.bad: "[target_child.GetHerHis|U] 얼굴은 퀭했고 시선은 무관심했다. 반쯤 자고 있었다.\n\n\"[ROOT.Char.GetMotherFather|U].\" 아이가 조급하게 물었다. \"왜 부르셨나요?\""
 pam_decision_events.0003.desc.good: "[target_child.GetHerHis|U] 눈이 촛불 빛에 반짝였다. 참으로 착한 아이였다.\n\n\"[ROOT.Char.GetMotherFather|U].\" 아이가 물었다. \"혹시 제가 뭐 잘못했나요?\""
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U] 아이였다. 이제는 다 컸다.\n\n\"[ROOT.Char.GetMotherFather|U].\" 아이가 작게 물었다. \"사람은 어떻게 해야 올바르게 살아갈 수 있나요?\""
 pam_decision_events.0003.a: "썩어버린 [ROOT.Char.GetTitleAsNameNoTooltip|l](이)가 곧 아이의 [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]에 독을 타겠지."
 pam_decision_events.0003.b: "그냥... 착하게 살거라."
