 pam_decision_events.0030.b.decline: "[religious_authority.GetTitleAsName](이)가 당신의 왕국 배척"
 pam_decision_events.0030.opening: "지극히 성스러운 [religious_authority.GetMotherFather|U],"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName]께서는 극소수만을 택하여 그분의 [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip] 자녀들의 고귀한 수호자로 삼고, 그분께서 지상에 내려 주신 아름다운 땅을 보살피는 군주로 세우십니다.\n\n저 또한 그 축복받은 소수 중 하나로 섬길 수 있기를 청합니다. [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] 왕국을 세워 주신다면, 모든 악으로부터 그곳을 지키겠습니다."
 pam_decision_events.0030.a: "이에 새로운 [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip] 왕국을 축성하노라."
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName]께서는 그대에게 그런 뜻을 두지 않으셨네, [king_aspirant.GetFirstNameNoTooltip]..."
 pam_decision_events.0031.t: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 pam_decision_events.0031.desc.self_crowning: "[ROOT.Char.GetPrimaryTitle.GetNameNoTier]보다 더 축복받은 땅이 어디 있겠는가? 왕의 가호를 받기에 이보다 더 합당한 영지가 어디 있겠는가? [ROOT.Char.GetFaith.WarGodName]께서 그 백성을 재앙으로부터 지키고, 그 경계 안에 나의 성스러운 자리를 보전하지 않으셨던가?\n\n[ROOT.Char.GetFaith.HighGodNamePossessive] 뜻을 받들어, 나는 [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]의 [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip](을)를 축성했다. 나는 스스로 이 땅의 성스러운 수호자가 되었으니, 다시는 누구도 나의 뜻을 거스르지 못하리라.\n\n봉신과 신자들이여, 모두 머리를 조아려라! 선량한 [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural]들이라면 자신의 [ROOT.Char.GetTitleAsName](을)를 마땅히 경외할 줄 알아야 한다."
 pam_decision_events.0031.desc_three_duchies: "[religious_authority.GetTitledFirstNamePossessiveRegnal] 칙령에 따라, 내 봉역의 땅들이 끊임없이 도는 하늘의 운명적인 별들처럼 제자리를 찾았다. [duchy_1.GetName], [duchy_2.GetName], [duchy_3.GetName](을)를 하나로 묶어 축복받은 [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l](을)를 세웠다.\n\n그리고 의롭고 합당한 영혼으로부터 새로운 [ROOT.Char.GetTitleAsName](이)가 탄생했다! [religious_authority.GetTitleAsNamePossessiveNoTooltip] 명에 따라 내가 이 자리에 올랐으니, 이제 그분의 뜻을 따라 이끌어야 한다."
 pam_decision_events.0031.desc: "[religious_authority.GetTitledFirstNamePossessiveRegnal] 칙령에 따라 새로운 [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] 이름이 연대기에 새겨졌다. [ROOT.Char.GetFaith.PriestNeuterPlural]들과 백성들이 환호하며 나를 추켜세운다! [ROOT.Char.GetPrimaryTitle.GetNameNoTier](이)가 이교도와 이단자의 손아귀를 벗어나 있는 한, 나는 이곳의 정당한 [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.GetTitleAsName](으)로 남으리라.\n\n나를 이 자리에 세운 [religious_authority.GetTitleAsNameNoTooltip]께서는 실로 이 소박한 봉역을 축복하셨다... 그리고 분명 나의 왕으로서의 행보에도 어느 정도 관심을 기울이시겠지."
 pam_decision_events.0031.a: "[ROOT.Char.GetFaith.HighGodName]께서 나의 [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip](을)를 영원히 사랑하시기를."
