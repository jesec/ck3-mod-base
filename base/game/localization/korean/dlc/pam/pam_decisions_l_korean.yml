 newly_exclaved_duchies_tooltip: "당신의 [realm|E] 내 [duchies|E]뿐만 아니라, 새로운 [kingdom|E]의 창설로 단절 영지가 되는 공작령에 대해서도 [Concept( 'de_jure', '규범상' )|E] 권리를 주장함. 해당 공작령은 수도가 없으며, 기존 왕국의 다른 공작령과 더 이상 인접하지 않게 되는 공작령임."
