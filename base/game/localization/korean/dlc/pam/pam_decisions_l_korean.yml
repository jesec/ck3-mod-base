 pam_decision_last_rites_name: "임종 예식 치르기"
 pam_decision_last_rites_name_low: "임종 예식 치르기"
 pam_decision_last_rites_desc: "#EMP [ROOT.Char.GetFaith.HighGodName](이)여, 자비를 베푸소서! 제 부정을 말끔히 씻어 주시고, 죄악으로부터 정화해 주소서.#!\n\n이 육신에서 곧 떠나야 할 때가 다가왔으니, 내 영혼을 질서 있게 보내고자 한다. 지옥의 영향력에서 보호받으면 평온한 죽음을 맞이하고, 천국에서 영원한 삶을 얻을 수 있다."
 pam_decision_last_rites_tooltip: "떠날 순간을 위해 영혼을 준비하기"
 pam_decision_last_rites_tooltip_sp_effect: "당신이 [spiritual_fulfillment|E] @spiritual_fulfillment_icon!을 다소 획득하게 됨"
 pam_decision_last_rites_confirm: "내 침대 옆으로 모여라"
 pam_decision_last_rites_sp_tooltip: "당신의 [spiritual_fulfillment|E]이 #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#! 이상임"
 pam_decision_last_rites_doctrine_tt: "[faith|E]이 [GetDoctrineType('doctrine_sacraments_central').GetBaseName] [doctrine|E]를 보유해야 함"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X 임종 예식을 치르지 않는 경우:\n$BULLET_WITH_TAB$[legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')] 잃음\n$BULLET_WITH_TAB$$every_zealot_vassal$:\n$TAB$$BULLET_WITH_TAB$#V 당신#!을 향한 [opinion|E]을 #N 30#! 잃음#!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial 당신이 [secret|E]을 밝혀야 할 수 있음"
 pam_decision_events.0005.details: "[titles|E]를 [lease|E]할 기회가 생기게 됨. 임차 가능한 작위가 없는 경우 [monastic_holy_orders|E], [holy_orders|E] 또는 [the_christian_church|E]에 [gold|E]를 기부할 수 있음 - 당신의 [player_heir|E]에 이로운 [modifiers|E]가 제공될 것임"
 pam_decision_events.0005.t: "임종 예식: 마지막 시간"
 pam_decision_events.0005.desc.healthtrait: "죄악이 나를 [death_trait.GetName(soon_dead)|l] 사람으로 만들었으며, 내 임박한 죽음의 원인도 죄악일 가능성이 높다."
 pam_decision_events.0005.desc.bad: "나는 [ROOT.Char.GetFaith.HighGodName]께 영광을 드리려 노력했으며, 내 오만함 때문에 모든 것을 보시는 그분의 눈앞에서 내 죄악을 숨기려 했다.\n\n"
 pam_decision_events.0005.desc.good: "다행히도 천사들이 가까이 왔으며, 내 영혼을 낚아채 가려는 악마에게서 나를 지켜준다는 느낌이 든다.\n\n"
 pam_decision_events.0005.desc.neutral: "나는 [ROOT.Char.GetFaith.HighGodName]께 영광을 드리려 노력했지만, 영원의 문턱으로 다가갈수록 걱정이 된다. 과연 내 영혼이 그분의 천국에 들어설 자격이 있을까?\n\n"
 pam_decision_events.0005.desc.notalone: "옆에는 내 [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))] [fam_or_friend_1.GetFirstName](을)를 비롯해, 내 영혼을 위해 기도해 줄 사람들이 모여 있었다."
 pam_decision_events.0005.desc.alone: "나는 혼자 두려움에 떨었다. 옆에는 내 영혼을 위해 기도해 줄 사랑하는 이도 없었다."
 pam_decision_events.0005.desc.outro: "내 고해자가 손에 [Glossary('성사집','SACRAMENTARY_GLOSS')]을 들고 이렇게 말했다. \"거짓 없이 [ROOT.Char.GetFaith.HighGodName](을)를 마주하십시오!\"\n\n죄악으로 가득하던 다윗도 고해를 마친 뒤 깨끗해졌으니... [Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "참회의 성사가 다가온다."
 pam_decision_events.0005.b: "악마여, 나를 데려가라! 이 사제를 치워라."
 pam_psalm_51_english: "내가 주께만 범죄하여 주의 목전에 악을 행하였사오니 주께서 말씀하실 때에 의로우시다 하고 판단하실 때에 순전하시다 하리이다."
 SACRAMENTARY_GLOSS: "성사집 또는 #EMP 전례서#!는 기독교 주교 또는 사제가 전례 시 사용하던 서책입니다. 성사에 쓰이는 기도와 함께, 시대와 지역에 따라 낭독 또는 노래로 불리는 기도문을 포함하기도 합니다."
 pam_decision_events.0006.t: "임종 예식: 내 죄가 항상 내 앞에 있나이다"
 pam_decision_events.0006.intro: "\"사람은 실수를 저지르기 마련입니다. 하지만 고해 없이는 사죄도 없지요.\" [confessor.GetTitledFirstName](이)가 말했다."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\n내 죄악은 크고 빈번했다. 내 영혼의 무게는 무겁고, 사탄은 명백히 자신의 것인 내 영혼을 불타는 손아귀로 움켜쥐고 있다.\n\n"
 pam_decision_events.0006.desc.good: "\n\n마음이 가볍다. 나는 주님의 뜻을 따라 행동하고자 노력해 왔기에.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\n나는 한낱 인간일 뿐이며, 아무리 선한 뜻을 품었더라도 죄악은 나를 찾아왔다.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "내 [my_sinful_trait.GetName(soon_dead)] 천성으로 인해 잘못된 길로 간 적이 너무도 많다!"
 pam_decision_events.0006.desc.secret_sin: "나는 어둠의 항구에 내 [my_secret.GetName] 비밀을 정박시켜 두었다."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "그중에서도 최악인 건, 내가 [my_criminal_trait.GetName(soon_dead)] 사람이라는 것이다! 내 죄가 숨통을 옥죄여 온다."
 pam_decision_events.0006.desc.sin_default: "내 수많은 죄를 기억해 내기가 힘들다. 분명 [confessor.GetTitledFirstNameNoTooltip]에게 입을 열면, 수로를 집어삼키는 바다처럼 내 죄가 쏟아져 나오겠지."
 pam_decision_events.0006.desc.sin_default_good_sp: "[ROOT.Char.GetFaith.HighGodName]께서 내 뼈를 부수고 부정을 없애 주시기를."
 pam_decision_events.0006.desc.outro: "올바르게 회개하며 내 죄를 드러내야 한다. 아니면 성찬례를 거부해야 한다."
 pam_decision_events.0006.a: "\"[confessor.GetMotherFather], 용서하십시오...\""
 pam_decision_events.0006.b: "무덤까지 품고 가야 하는 죄도 있는 법이다."
 pam_decision_events.0006.b.flavor: "당신이 일부 죄악을 고백하지만, 다른 이가 연루될 수 있는 비밀은 숨김."
 pam_decision_events.0007.t: "임종 예식: 살과 피와 기름"
 pam_decision_events.0007.intro: "이렇게 내 죄의 계산이 끝났다. 한 푼 빚지는 것과 만 달란트를 빚지는 것은 서로 전혀 다른 문제다.\n\n내 고해 사제가 축성된 빵과 포도주를 가져왔다."
 pam_decision_events.0007.desc.bad: "주님의 살과 피를 보는 지금도 악마들이 내 영혼을 달라고 애원하는 소리가 들린다. 계속 살아가며 세속의 즐거움을 마음껏 즐기라는 것이다.\n\n"
 pam_decision_events.0007.desc.good: "짐을 덜어낸 나는 죽음의 품으로 뛰어들었다. 주님의 살과 피를 먹고 마시며 그분의 곁에 자리하게 되기를 바란다.\n\n"
 pam_decision_events.0007.desc.neutral: "주님의 살과 피가 나를 지켜주기를. 내 시간이 오기 전에 나를 데려가려는 악마들이 늑대처럼 도사리고 있으니.\n\n"
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U]가 내 이마와 손, 발에 성유를 부었다."
 pam_decision_events.0007.desc.oil.bad: "내 영혼은 아직도 불안하다.\n\n"
 pam_decision_events.0007.desc.oil.good: "내 영혼이 주님의 사랑으로 빛난다.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "내 영혼의 여정이 보호받는 느낌이 든다.\n\n"
 pam_decision_events.0007.desc.outro: "[Glossary('노자성체','VIATICUM_GLOSS')]와 [Glossary('종부성사','UNCTION_GLOSS')]가 완료되었으니, 나를 위해 기도해 줄 이를 정할 수 있게 되었다."
 VIATICUM_GLOSS: "노자성체, 즉 비아티쿰은 라틴어로 \"여정을 위한 준비\"라는 뜻입니다. 임종 예식의 성체성사 또는 성찬례를 일컫습니다. 여기서 여정은 영원한 내세를 향해 떠나는 길을 이릅니다."
 UNCTION_GLOSS: "종부성사는 'in extremis', 즉 죽음이 임박한 최후의 순간에 병자를 성유로 축복하는 과정입니다. 병자의 영원한 내세를 준비하고자 행해집니다."
 pam_decision_events.0007.a: "[monastic_order.GetName](이)가 나를 위해 기도해 주기를."
 pam_decision_events.0007.b: "[military_order.GetName](을)를 밀어주겠다."
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip](이)가 내 재산을 가질 것이며, [religious_head.GetHerHis] 기도는 나를 향하리라."
 pam_decision_events.0007.d: "[confessor.GetTitledFirstNameNoTooltip]에게 경건한 말을 전하는 것으로 충분하다."
 pam_last_rites_monastic_order_donation_modifier: "전임자가 임종 예식에서 수도회에 기부함"
 pam_last_rites_military_order_donation_modifier: "전임자가 임종 예식에서 기사수도회에 기부함"
 pam_last_rites_church_donation_modifier: "전임자가 임종 예식에서 교회에 기부함"
