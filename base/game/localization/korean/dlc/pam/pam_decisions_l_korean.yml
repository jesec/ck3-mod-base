 consecrate_kingdom_decision: "새로운 왕국 축성"
 consecrate_kingdom_decision_desc_self: "군주는 [ROOT.Char.GetFaith.HighGodName]께서 세우는 것이며, [ROOT.Char.GetFaith.HighGodNamePossessive] 말씀을 대신하는 이가 바로 나다. 신자들의 땅을 다스리기에 나보다 더 합당한 군주가 어디 있겠는가?"
 consecrate_kingdom_decision_desc: "군주는 [ROOT.Char.GetFaith.HighGodName]께서 세우는 것이다. 필요하다면 그분께서는 가장 미천한 귀족 가운데서도 군주를 세울 수 있다.\n\n지금이 바로 그러한 때다. 아직 왕관을 쓰지 못한 이 머리에 성스러운 왕관을 내려 주시기를 간청하겠다."
 consecrate_kingdom_decision_confirm: "왕의 소명을 받들자"
