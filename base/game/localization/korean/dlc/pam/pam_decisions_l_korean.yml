 declare_yourself_antipope_decision_caliph: "칼리프에게 도전"
 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName](은)는 멀리 떨어져 있는 자격 미달의 인물로, [ROOT.Char.GetFaith.GetName](을)를 이끌 준비가 되어 있지 않다. [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe]는 온갖 학식을 내세우지만, [ROOT.Char.GetFaith.GetAdjective] 사상에 숨겨진 수많은 미묘한 진리를 #EMP 이해하지 못한다#!.\n\n그 작자는 못 하겠지만, #EMP 나#!는 한단 말이지..."
