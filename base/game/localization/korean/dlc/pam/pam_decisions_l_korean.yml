 pam_raise_khachkar_decision: "하치카르 건립"
 pam_raise_khachkar_decision_desc: "[GetTenetType('tenet_khachkar').GetName( ROOT.Char.GetRite )]에서는 조각한 돌로 죽은 이를 기리는 것이 가장 합당하다고 가르친다. 친족을 기억하기 위해 화려하게 조각한 십자가를 세워야겠다. 산 자와 죽은 자, 그리고 이 땅을 하나로 잇는 것이다."
 pam_raise_khachkar_decision_tooltip: "당신의 [Concept( 'counties', '영지' )|E] 중 한 곳에 [GetModifier('pam_khachkar_ancestral_county').GetName] 건립을 명함."
 pam_raise_khachkar_decision_confirm: "돌에 새겨 기리자"
 pam_raise_khachkar_decision_warning: "@warning_icon! #X 해당 [Concept( 'county', '영지' )|E]가 당신의 [dynasty|E]에 속하지 않은 인물에게 넘어갈 경우 하치카르가 파괴됩니다#!"
 pam_khachkar_grant_title_warning: "@warning_icon! #X [recipient.GetShortUIName](이)가 당신의 [dynasty|E]에 속해 있지 않으므로, [target.GetNameNoTier]의 하치카르가 파괴됩니다!#!"
 pam_raise_khachkar_no_catalysts: "당신에게 죽음을 기릴 수 있는 친족이 있음."
 pam_raise_khachkar_no_valid_county_in_realm: "당신이 적합한 [Concept( 'county', '영지' )|E]를 보유함."
 pam_proclaim_crusade_age_tenet_decision: "십자군 시대 선포"
 pam_proclaim_crusade_age_tenet_decision_desc: "신자들은 기독교 세계를 수호하고 잃어버린 것을 되찾기 위해 무기를 들어야 한다."
 pam_proclaim_crusade_age_tenet_decision_tooltip: "[GetTenetType('tenet_armed_pilgrimages').GetBaseName] 또는 [GetTenetType('tenet_struggle_submission').GetBaseName](을)를 당신 [mainline_rite|E]의 [core_tenet|E]로 채택함."
 pam_proclaim_crusade_age_tenet_decision_confirm: "신자들을 진군시키자"
 pam_secure_pilgrim_routes_decision: "순례길 확보"
 pam_secure_pilgrim_routes_decision_desc: "성지로 향하는 길이 위험해졌다. 신자들이 순례길에서 무기를 들 수 있도록 선포한다면, 순례자들을 보호하고 기독교 세계 전역에 신앙심을 고취할 수 있을 것이다."
 pam_secure_pilgrim_routes_decision_tooltip: "[GetTenetType('tenet_armed_pilgrimages').GetBaseName](을)를 핵심 [core_tenet|E]로 채택함"
 pam_secure_pilgrim_routes_decision_confirm: "순례길을 확보하자"
 pam_secure_pilgrim_routes_decision_select_tt: "대체할 [core_tenet|E]를 선택해야 함"
 pam_secure_pilgrim_routes_pilgrim_xp_tt: "향후 #V 25년#! 동안 모든 [GetFaithByKey('catholic').GetAdherentNamePlural]들이 [pilgrimages|E]를 통해 얻는 [GetTrait('pilgrim').GetName( GetPlayer )] [trait|E] [experience|E]가 증가함"
 pam_secure_pilgrim_routes_ai_pilgrimage_tt: "#weak 향후 #V 25년#! 동안 [GetFaithByKey('catholic').GetAdjective] [rulers|E]가 [pilgrimages|E]에 나설 가능성이 증가함#!"
 pam_secure_pilgrim_routes_ai_pilgrimage: "확보된 순례길"
 pam_protector_of_pilgrims_modifier: "순례자들의 수호자"
 pam_secure_pilgrim_routes_incompatible_tenet_tt: "평화주의 [core_tenet|E]는 [GetTenetType('tenet_armed_pilgrimages').GetBaseName](와)과 공존할 수 없으며 먼저 교체되어야 함"
 pam_secure_pilgrim_routes_decision_remove_tenet_tt: "선택한 [core_tenet|E]를 [GetPlayer.GetRite.GetName](이)가 더 이상 핵심 교리로 유지하지 않음"
 pam_secure_pilgrim_routes_decision_holy_site_tt: "[THIS.Char.GetFaith.GetName] [holy_site|E] 중 하나 이상을 [GetReligionByKey('christianity_religion').GetAdjective] [ruler|E]가 지배하고 있지 #bold 않음#!"
 pam_decision_events.0019.t: "순례자들의 보호자"
 pam_decision_events.0019.desc: "나의 뜻을 담은 서신을 모든 [ROOT.Char.GetFaith.GetAdherentNamePlural]에게 보내리라.\n\n\"성지로 향하는 길이 위험해졌다. 신자들은 순례길에서 무기를 들 수 있으며, 어느 누가 천국으로 향하는 길을 가로막든 그에 맞서 스스로를 지킬 수 있음을 널리 알리노라.\""
 pam_decision_events.0019.a: "주여, 우리의 팔에 힘을 주소서."
 pam_decision_events.0018.opening: "모든 땅의 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]들에게,"
 pam_decision_events.0018.desc.armed_pilgrimages: "이 문제에 나의 인장을 찍었다. 오늘부터 [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )](은)는 [hof_scope.GetFaith.GetName]의 핵심 교리 가운데 하나로 자리 잡을 것이다.\n\n신앙의 모든 영주는 이를 명심하도록 하라."
 pam_decision_events.0018.desc.struggle_submission: "이 문제에 나의 인장을 찍었다. 오늘부터 [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )](은)는 [hof_scope.GetFaith.GetName]의 핵심 교리 가운데 하나로 자리 잡을 것이다.\n\n신앙의 모든 영주는 이를 명심하도록 하라."
 pam_decision_events.0018.a: "어쩔 수 없지."
 pam_decision_events.0017.t: "선조를 기리는 하치카르 건립"
 pam_decision_events.0017.desc: "돌십자가를 세울 곳으로 [khachkar_location.GetNameNoTier](을)를 내려다보는 높은 장소를 골랐다.\n\n[khachkar_ancestor.GetTitledFirstNameNicknamed](을)를 기리기 위해, 보는 이가 절로 경건해질 만한 작품을 장인들에게 만들게 할 것이다. 장미꽃 무늬와 장식으로 둘러싸인 십자가에 [khachkar_ancestor.GetHerHis] [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)](이)가 기억을 기렸다는 비문을 새길 것이다.\n\n이곳의 순례자들이 그 아래에서 기도하게 하고, 모두가 이 땅에 대한 우리의 정당한 지배를 보게 하리라."
 pam_decision_events.0017.a: "이 십자가가 오랜 세월 서 있게 하라."
 pam_decision_events.0017.b: "지금은 시기가 좋지 않아."
