 kingdom_of_heaven_lower_de_jure_gained_tt: "당신이 소유했거나, [holder|E]가 없고 당신이 [completely_controlled|E]했던 [empires|E]이 [GetTitleByKey('h_kingdom_of_heaven').GetName]의 [de_jure|E]이 되었음"
