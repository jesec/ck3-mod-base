 pam_decision_events.0004.desc: "수년 동안 깃발을 드는 대신 제의를 입어 왔다. 그러나 작위와 권력이 모두 내게 같은 말을 하고 있다.\n\n내 유산이 왜 나와 함께 사라져야 하는가? 고작 내가 이름 있는 가문에서 태어나지 않았다는 것이 그 이유인가?"
