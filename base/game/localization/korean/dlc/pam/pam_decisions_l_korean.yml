 pam_personal_sacrifice_of_wealth_decision: "재산 희생"
 pam_personal_sacrifice_of_wealth_decision_desc: "당신이 가진 재산 일부를 헌신의 표시로 기부하며, 당신의 보호 아래 있는 영지의 개발을 장려합니다."
 pam_personal_sacrifice_of_wealth_decision_tooltip: "[gold|E]를 소모해 선택한 [Concept( 'county', '영지' )|E]의 [development_growth|E]를 높이고 [spiritual_fulfillment|E]을 획득함"
 pam_personal_sacrifice_of_wealth_decision_confirm: "기부하기"
 pam_personal_sacrifice_of_wealth_decision_toast: "신앙을 위한 투자 수립"
 pam_develop_clerical_court_decision: "성직 궁정 교육"
 pam_develop_clerical_court_decision_desc_christian: "나태한 사무원은 [ROOT.Char.GetFaith.HighGodName](을)를 잘 섬길 수 없다. 집안 사람들을 모아 자격 있는 자에게는 임명을 내리고, 임명된 이들을 가르치고, 수련자들을 내 문 앞으로 소집하겠다."
 pam_develop_clerical_court_decision_desc: "나태한 시종은 [ROOT.Char.GetFaith.HighGodName]께 아무런 명예도 안기지 못한다. 집안 사람들을 모아 자격 있는 자를 [clergy|E]로 승격시키고, 섬길 이들을 가르치고, 수련자들을 내 문 앞으로 소집하겠다."
 pam_develop_clerical_court_decision_tooltip: "당신의 궁정을 위한 [clergy|E]를 임명하고 가르치거나 영입함"
 pam_develop_clerical_court_decision_confirm: "집안 소집하기"
 pam_develop_clerical_court_decision_tt: "집안 사람들을 소집해 다음 중 #EMP 하나#!를 선택함\n$EFFECT_LIST_BULLET$ 최대 [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]명의 평신도 [courtiers|E]가 [clergy|E]에 합류하며 각각 당신에게 추가 [piety_i][piety|E]를 부여함\n$EFFECT_LIST_BULLET$ 최대 [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]명의 궁정 [clergy|E]가 [learning_i][Concept( 'learning', '학습력' )|E] 및 [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] 또는 [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] / [trait_level_track_xp|E]를 획득함\n$EFFECT_LIST_BULLET$ 주변 지역에서 온 최대 [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]명의 수련자가 당신의 궁정과 [clergy|E]에 합류함\n\n어느 쪽을 선택해도 당신은 [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][piety|E]를 획득함\n\n#weak 보상은 당신의 [Concept( 'learning', '학습력' )|E], [piety_level|E], 종교적인 [traits|E]에 따라 달라지며 때때로 드문 기회가 나타날 수 있음#!"
 pam_develop_clerical_court_decision_candidates_tt: "당신이 임명 또는 교육하기 적합한 [courtier|E]를 보유하거나, 자격을 갖춘 후보가 근처에 살고 있음"
 pam_clerical_court_joins_clergy_tt: "[pam_clerical_patron.GetFaith.GetName]의 [clergy|E]에 합류함"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName](이)가 성직자에 합류함"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName]의 지혜가 성장함"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName](이)가 부름에 답함"
 pam_oblate_patron_reason: "수련자의 저명한 후원자"
 pam_oblate_patron_modifier: "수련자의 후원자"
 pam_oblate_patron_modifier_desc: "해당 인물은 종교적인 섬김의 부름을 받은 이들을 돕는 것으로 유명합니다. 서약에 소모되는 비용이 감소하며, 부모도 아이를 더 기꺼이 떠나보냅니다."
 pam_scriptorium_modifier: "필경사 전당"
 pam_scriptorium_modifier_desc: "해당 인물은 필경사의 전당을 보유하며, 이들의 작업은 학식 있는 자들을 수도로 끌어모읍니다."
 pam_decision_events.0032.t: "양 떼 돌보기"
 pam_decision_events.0032.desc.intro.christian: "나는 내 집안의 사무원과 성직자들을 따져 보며 누구를 임명하고, 누구를 아직 더 이끌어 주어야 할지를 고민했다."
 pam_decision_events.0032.desc.intro: "나는 궁정에서 [ROOT.Char.GetFaith.GetName](을)를 섬기는 이들을 따져 보았다. 누가 섬길 수 있으며, 누구를 이끌어 주어야 할까?"
 pam_decision_events.0032.desc.pupil: "\n\n내 제자인 [pam_clerical_pupil.GetFirstName](이)가 서서 기도하고 있었다. 자신의 가치를 증명하고 싶어 안달이 난 모습이었다."
 pam_decision_events.0032.desc.no_pupil: "\n\n이들 중에서 신앙을 섬기는 길에 들어선 이가 너무 적다. 이러한 결핍을 바로잡고자 한다."
 pam_decision_events.0032.desc.novice: "\n\n내 집안 사람들 너머에서, [pam_clerical_novice.GetFirstName](이)라는 희망에 찬 이방인이 신앙을 섬길 자리를 내어달라고 간청하고 있었다."
 pam_decision_events.0032.desc.outro.christian: "\n\n[ROOT.Char.GetFaith.HighGodName]께서 내게 내려주신 양 떼를 어떻게 돌보아야 할까?"
 pam_decision_events.0032.desc.outro: "\n\n[ROOT.Char.GetFaith.HighGodName]께서 내게 맡기신 이들을 어떻게 키워내야 할까?"
 pam_decision_events.0032.prodigy: "내 제자에게는 신성한 재능이 있다!"
 pam_decision_events.0032.oblates: "모두에게 알려라. 섬기러 온 이들을 환영하겠다고."
 pam_decision_events.0032.piety: "저들의 헌신이 내 헌신을 더욱 굳건히 해주는구나."
 pam_decision_events.0032.novice: "가능성이 보이는 영혼이군. [pam_clerical_novice.GetHerHim]를 당장 받아들인다."
 pam_decision_events.0032.miracle: "사람들이 내 제자가 기적을 행한다고 하더군."
 pam_decision_events.0032.relic.christian: "이 신성한 글은 내 보물고에 보관해야 한다!"
 pam_decision_events.0032.relic: "이 글로 내 궁정을 풍요롭게 해야지."
 pam_decision_events.0032.language: "제자에게 성스러운 글의 연구를 맡겨야겠다."
 pam_decision_events.0032.scriptorium.christian: "기록실의 모든 깃펜이 일을 시작하게 한다."
 pam_decision_events.0032.scriptorium: "궁정의 모든 필경사가 일을 시작하게 한다."
 pam_decision_events.0032.a.christian: "내 집안 사람 중에서 가장 자격 있는 자를 임명한다."
 pam_decision_events.0032.a: "내 집안 사람 중에서 가장 자격 있는 자를 승격시켜 신앙을 섬기게 한다."
 pam_decision_events.0032.a.tt: "당신의 가장 학식 있는 평신도 [courtiers|E] 최대 [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]명까지 #weak (친족 포함)#!:\n$EFFECT_LIST_BULLET$ [pam_clerical_patron.GetFaith.GetName]의 [clergy|E]에 합류\n$EFFECT_LIST_BULLET$ [learning_i][Concept( 'learning', '학습력' )|E] 및 당신을 향한 [opinion|E] 획득\n$EFFECT_LIST_BULLET$ 당신에게 [piety_i][piety|E] 부여"
 pam_decision_events.0032.b: "이미 내 관리를 받는 성직자를 가르친다."
 pam_decision_events.0032.b.tt: "당신의 가장 학식 있는 궁정 [clergy|E] 최대 [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]명까지:\n$EFFECT_LIST_BULLET$ [learning_i][Concept( 'learning', '학습력' )|E] 획득 #weak (최대 [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0]까지)#!\n$EFFECT_LIST_BULLET$ [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] 또는 [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]을 획득하거나 발전시킴"
 pam_decision_events.0032.c.named: "[pam_clerical_novice.GetFirstNameNoTooltip](을)를 받아들이고 수련자를 환영한다는 소식을 알린다."
 pam_decision_events.0032.c: "수련자를 환영한다는 소식을 알린다."
 pam_decision_events.0032.c.tt: "주변 지역에서 온 수련자 최대 [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0]명까지:\n$EFFECT_LIST_BULLET$ 당신의 궁정 및 [pam_clerical_patron.GetFaith.GetName]의 [clergy|E]에 합류\n$EFFECT_LIST_BULLET$ 당신의 [rite|E]로 개종"
 pam_seize_capital_clerical_region_decision: "성직 지역 장악"
 pam_seize_capital_clerical_region_decision_desc: "내 수도는 내가 소유하지 않은 [clerical_region|E]에 있다. 그 어떤 [archbishop|E]도 내가 통치하는 자리에 앉아서는 안 된다. 그 [title|E]은 [head_of_faith|E]의 것이다."
 pam_seize_capital_clerical_region_decision_tooltip: "당신의 수도가 있는 [clerical_region|E]을 차지하며, 해당 자리가 공석이 아닌 경우 그 [archbishop|E]를 해임함"
 pam_seize_capital_clerical_region_decision_confirm: "교구 차지하기"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName](이)가 해임됨"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName](이)가 당신에게 넘어옴"
