 pam_prevented_great_schism_dynasty_modifier: "일치의 수호자"
 pam_prevented_great_schism_dynasty_modifier_desc: "해당 가문은 기독교 세계의 최종적인 분열을 막아냈으며, 여러 세대에 걸쳐 교회의 일치를 지켜냈습니다."
 pam_prevented_great_schism_character_modifier: "$pam_prevented_great_schism_dynasty_modifier$"
 pam_prevented_great_schism_character_modifier_desc: "해당 인물은 기독교 세계의 최종적인 분열을 막아냈으며, 여러 세대에 걸쳐 교회의 일치를 지켜냈습니다."
 pam_caused_great_schism_dynasty_modifier: "교회 일치의 파괴자"
 pam_caused_great_schism_dynasty_modifier_desc: "해당 가문은 기독교 세계에 돌이킬 수 없는 분열을 일으켜, 신자들이 앞으로 여러 세대에 걸쳐 서로 다른 길을 걷게 만들었습니다."
 pam_caused_great_schism_character_modifier: "$pam_caused_great_schism_dynasty_modifier$"
 pam_caused_great_schism_character_modifier_desc: "해당 인물은 기독교 세계에 돌이킬 수 없는 분열을 일으켜, 신자들이 앞으로 여러 세대에 걸쳐 서로 다른 길을 걷게 만들었습니다."
 pam_mended_great_schism_military_dynasty_modifier: "교회 일치의 복원자"
 pam_mended_great_schism_military_dynasty_modifier_desc: "해당 가문은 고대의 교구들을 하나의 깃발 아래 규합했으며, 기독교 세계의 분열을 무력으로 치유했습니다."
 pam_mended_great_schism_military_character_modifier: "$pam_mended_great_schism_military_dynasty_modifier$"
 pam_mended_great_schism_military_character_modifier_desc: "해당 인물은 고대의 교구들을 하나의 깃발 아래 규합했으며, 기독교 세계의 분열을 무력으로 치유했습니다."
 pam_mended_great_schism_diplomatic_dynasty_modifier: "기독교 세계의 중재자"
 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "해당 가문은 경쟁 총대주교를 설득해 친교로 돌아오게 했으며, 피를 한 방울도 흘리지 않고 기독교 세계의 분열을 치유했습니다."
 pam_mended_great_schism_diplomatic_character_modifier: "$pam_mended_great_schism_diplomatic_dynasty_modifier$"
 pam_mended_great_schism_diplomatic_character_modifier_desc: "해당 인물은 경쟁 총대주교를 설득해 친교로 돌아오게 했으며, 피를 한 방울도 흘리지 않고 기독교 세계의 분열을 치유했습니다."
 nick_the_reconciler: "조정자"
 nick_the_reconciler_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 기독교 세계의 분열을 치유했으며 고대의 교구들을 친교로 돌아오게 했습니다."
 nick_the_concordant: "화합자"
 nick_the_concordant_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 분열과 논쟁의 시대에도 교회의 친교를 지켜냈습니다."
 nick_the_schismat: "분열자"
 nick_the_schismat_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U](은)는 기독교 세계의 일치를 깨뜨리고 신자들을 서로 다른 길로 갈라놓았습니다."
 pam_promulgate_word_of_pious_deeds_decision: "경건한 업적을 널리 알린다"
 pam_promulgate_word_of_pious_deeds_decision_desc: "나의 궁정 서기관들은 그리스도를 본받은 나의 업적을 찬양하는 헌사를 작성했다. 스스로의 덕을 칭송하는 것은 마땅치 않지만, 내 곁의 사람들은 나의 경건함을 모든 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]에게 알리고자 한다.\n\n그리되면 내가 성 베드로의 교좌에... 어쩌면 그 너머의 자리에 가장 합당한 사람이라는 평판이 퍼질지도 모른다."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "[Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)]의 #V 선거 점수 증가#!: #P +30#! 또는 [canonization|E] 가능성 증가"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "다음 중 선택: \n\t$EFFECT_LIST_BULLET$[piety|E]를 지불하여 [praise_worthy_priest_superior_title.GetName] #V 선거 점수 증가#!\n\t$EFFECT_LIST_BULLET$향후 [canonization|E]될 확률 개선"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "저들의 찬사를 허락한다!"
 cardinal_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "당신이 [cardinal|E]임"
 domicile_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "당신의 [domicile|E]가 [GetDomicileBuilding('chancery_01').GetName] 이상의 [domicile_building|E]을 보유해야 함"
 pam_renounce_papal_candidacy_decision: "[ROOT.Char.GetFaith.ReligiousHeadTitleName] 포기"
 pam_renounce_papal_candidacy_decision_embrace: "[ROOT.Char.GetFaith.ReligiousHeadTitleName] 청원"
 pam_renounce_papal_candidacy_decision_desc_renounce: "누군가는 [ROOT.Char.GetFaith.ReligiousHeadName]의 보좌를 향해 기어오르느라 평생을 바친다. 나는 그 등반이 사람들에게 어떤 영향을 끼치는지 다 보았다.\n\n[cardinal|E]단에게 다음 [ROOT.Char.GetFaith.ReligiousHeadName](이)가 선택될 때, 나는 나서지 않겠다고 알릴 것이다. 내 직무는 여기, 내 교구에 있으니."
 pam_renounce_papal_candidacy_decision_desc_embrace: "나는 한때 [ROOT.Char.GetFaith.ReligiousHeadName]의 보좌를 향해 나서지 않겠노라고 알린 적 있다. 그때 나는 젊은 [ROOT.Char.GetWomanMan]이었으며, [ROOT.Char.GetFaith.GetName](은)는 더 온화한 손길의 보살핌을 받았다.\n\n[cardinal|E]단에게 내가 나설 의지가 있음을 알릴 것이다."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "다음 [head_of_faith|E] 후보 대상에서 물러남"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "다음 [head_of_faith|E] 선거에 다시 한번 나섬"
 pam_renounce_papal_candidacy_decision_renounce_tt: "다음 [head_of_faith|E]가 선출될 때 당신이 후보로 고려되지 않을 것이며, 당신은 투표권을 그대로 보유하게 됨"
 pam_renounce_papal_candidacy_decision_embrace_tt: "다음 [head_of_faith|E]가 선출될 때 당신이 후보로 고려될 수 있음"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "다른 [cardinal|E]이 아직 나설 의지가 있어야 함"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "내 이름 철회하기"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "나설 의지가 있다"
 pam_decision_events.0015.t: "경건한 업적을 널리 알린다"
 pam_decision_events.0015.desc.intro.no_praiser: "충직한 사제들이"
 pam_decision_events.0015.desc.intro.praiser: "영향력 있는 나의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.GetTitledFirstName](이)가"
 pam_decision_events.0015.desc.intro: "나의 [GetDomicileBuilding('chancery_01').GetName]에서 작성한 찬사를 전한다.\n\n\"선행은 주께서 심으신 씨앗과 같으니, 자라나 풍성한 경건의 결실을 맺는다. 모두가 [praise_worthy_priest.GetName](을)를 알아야 한다. [praise_worthy_priest.GetHerHis]"
 pam_decision_events.0015.desc.virtuoustrait: "[my_virtuous_trait.GetName(praise_worthy_priest)], 그리고"
 pam_decision_events.0015.desc.mid: "고귀한 덕행은 언제나"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]...\""
 pam_decision_events.0015.desc.novirtuoustenet: "신의 가르침을 따르니...\""
 pam_decision_events.0015.desc.bad: "\n\n찬사에도 불구하고 내 마음은 지옥불의 입맞춤을 두려워한다."
 pam_decision_events.0015.desc.good: "\n\n참으로 나는 주님의 도구이며, 그 아름다움을 세상에 드러내는 존재다."
 pam_decision_events.0015.desc.neutral: "\n\n찬사에도 불구하고, 내 영혼이 주님 앞에서 올바른지는 죽음을 맞이한 뒤에야 알게 될 것이다."
 pam_decision_events.0015.desc.outro: "\n\n\"...[praise_worthy_priest.GetHerHis] 참으로 의로운 행실은 언젠가 교회를 이끌 자의 모습을 보여준다!\""
 pam_decision_events.0015.b: "\"내 이름으로 전해지는 기적이 적지 않다.\""
 pam_decision_events.0015.b.flavor: "성인이 될 수 있는데, 어찌 교황직에 만족하겠는가?"
 pam_decision_events.0015.b.tt: "사망 후 #V 시성 확률 증가#!\n#weak 시성되려면 [dynasty|E] 필요#!"
 pam_decision_events.0015.c: "주님께서 내가 이끌기를 바라신다면..."
 pam_decision_events.0015.c.flavor: "...그 뜻에 걸맞은 사람이 되어야 한다."
 pam_decision_events.0015.c.tt: "[praise_worthy_priest_superior_title.GetName] #V 선거 점수 증가#!: #P +30#!"
 pam_decision_events.0015.d: "다른 이름은 절대 언급하지 마라."
 pam_decision_events.0015.d.flavor: "내 헌신의 돈궤를 모두 비운다. 두 번째가 되지는 않겠다."
 pam_decision_events.0015.d.tt: "[praise_worthy_priest_superior_title.GetName] #V 선거 점수 증가#!: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, $theocratic_elective_populist$ 선두로 서기에 충분함\n@piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] [piety|E] 필요"
