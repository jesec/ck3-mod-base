 pam_unite_miaphysite_churches_decision: "합성론 교회 통합"
 pam_unite_miaphysite_churches_decision_desc: "합성론 공동체 교회들은 신조는 같으나 오랫동안 각기 다른 길을 걸어왔으며, 각 교회에는 최고위 지도자가 존재한다. 이들의 목자들이 화합한다면, 독신자와 완전한 결합의 사이는 그 무엇도 갈라놓을 수 없을 것이다."
