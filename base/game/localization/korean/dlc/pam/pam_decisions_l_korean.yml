 # HoF Tenet Stance — Permit a Tenet decision
 pam_permit_tenet_decision: "원리 허용"
 pam_permit_tenet_decision_desc: "오랫동안 우리 신앙의 가장자리에서만 조용히 전해지던 가르침은 이제 공인받을 자격이 있다. [core_tenet|E] 하나에 [ROOT.Char.GetFaith.HighGodNamePossessive|U]의 축복을 내려 [permitted_tenet_status|E]으로 승격하라."
 pam_permit_tenet_decision_tooltip: "[ROOT.Char.GetFaith.GetName]에서 [core_tenet|E] 1개를 [permitted_tenet_status|E]으로 인정하고 이를 모든 신앙의 통치자에게 선포함."
 pam_permit_tenet_decision_confirm: "[ROOT.Char.GetFaith.HighGodNamePossessive|U] 축복을 부여한다"
 pam_permit_tenet_decision_no_item_selected: "선택한 [core_tenet|E] 없음"
 # HoF Tenet Stance — Forbid a Tenet decision
 pam_prohibit_tenet_decision: "원리 금지"
 pam_prohibit_tenet_decision_desc: "참된 길에서 벗어난 가르침은 그 본모습대로 규정되어야 한다. [core_tenet|E] 하나를 [prohibited_tenet_status|E]로 지정하여 신자들이 멀리하도록 하라."
 pam_prohibit_tenet_decision_tooltip: "[ROOT.Char.GetFaith.GetName]에서 [core_tenet|E] 1개를 [prohibited_tenet_status|E]로 지정하고 이를 모든 신앙의 통치자에게 선포함"
 pam_prohibit_tenet_decision_confirm: "금지를 선포한다"
 pam_prohibit_tenet_decision_no_item_selected: "선택한 [core_tenet|E] 없음"
 pam_decision_events.0011.opening: "모든 땅의 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]들에게,"
 pam_decision_events.0011.desc.permitted: "이 문제에 나의 인장을 찍었다. 오늘부터 [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )](은)는 우리 신앙의 공인된 가르침으로 인정된다.\n\n그동안 이를 숨어 실천하던 이들은 이제 앞으로 나서도 좋다."
 pam_decision_events.0011.desc.prohibited: "이 문제에 나의 인장을 찍었다. 오늘부터 [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )](은)는 파문당할 가르침으로 규정된다. 이를 고집하는 자는 신앙 공동체와 갈라선 길을 걷게 될 것이다."
 pam_decision_events.0011.desc.fallback: "나는 [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]에 대해 공식 입장을 발표했다."
 pam_decision_events.0011.b: "그래도 나는 이 가르침을 저버리지 않겠다..."
 pam_decision_events.0012.opening: "모든 땅의 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]들에게,"
 pam_decision_events.0012.desc: "[bull_issuer.GetTitledFirstName](이)가 [heresy_rite.GetName](을)를 이단으로 선포했다.\n\n신앙을 따르는 모든 영주는 이를 명심하라."
 pam_decision_events.0012.a: "어쩔 수 없지."
 pam_decision_events.0013.opening: "한때 신자 공동체의 일원으로 여겨졌던 [ROOT.Char.GetTitledFirstNameNoTooltip]에게,"
 pam_decision_events.0013.desc.intro: "끝났다. [heresy_rite.GetName](은)는 이단으로 선포되었으며, 이를 고수하는 자들은 모두 [bull_issuer.GetFaith.GetName]에서 완전히 축출된다."
 pam_decision_events.0013.desc.outro: "\n\n그러니 선택하라. 다시 무릎을 꿇고 신앙 공동체로 받아들여지든가, 그릇된 믿음을 고수하고 정죄받든가."
 pam_decision_events.0013.a: "우리는 기꺼이 홀로 서겠다."
 pam_decision_events.0013.b: "나는 쫓겨나지 않겠다. 나를 다시 받아 달라."
 pam_tenet_stance_judgement_personal_permit: "마침내 내 헌신이 받아들여졌군!"
 pam_tenet_stance_judgement_personal_prohibit: "이제는 남의 눈을 피해 기도해야겠군..."
