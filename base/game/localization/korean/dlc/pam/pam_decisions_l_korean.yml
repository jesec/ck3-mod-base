 pam_antipope_events.0001.t: "경쟁 [ROOT.Char.GetFaith.ReligiousHeadName|U]"
 pam_antipope_events.0001.desc.intro: "[ROOT.Char.GetRite.GetName]의 모든 이들이 [ROOT.Char.GetFaith.HouseOfWorship]에 다시 하나로 모인 듯하다.\n\n"
 pam_antipope_events.0001.desc.self: "나는 손을 높이 치켜든다. [pope.GetTitledFirstName]의 거짓된 지배도 이제 곧 끝을 맞을 것이다. 이제 [pope.GetHerHis] 홀대받던 신자들을 이끄는 것은 나의 몫이다."
 pam_antipope_events.0001.desc.sponsor: "\"전령들에게 #EMP 나야말로#! 진정한 [ROOT.Char.GetFaith.ReligiousHeadName|U]임을 선포하게 하라!\" [antipope.GetTitledFirstName](이)가 외친다. \"거짓된 [pope.GetTitledFirstName](이)가 [pope_capital.GetName]의 궁전에 숨어 있는 동안 신자들은 홀대받고 이끌어 줄 이도 없이 방치되고 있음을 모두에게 알려라!\"\n\n[antipope.GetSheHe|U]가 나를 향해 돌아선다. \"하지만 이제 두려워하지 마라. 독실한 [ROOT.Char.GetTitledFirstName]께서 그대들의 고통을 끝내기로 결심하셨다. 나 또한 [ROOT.Char.GetHerHim]와 함께하겠다.\""
 pam_antipope_events.0001.a: "[ROOT.Char.GetFaith.GetNameNoTooltip] 전체가 전율케 하라."
 pam_antipope_events.0002.opening: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip]에게,"
 pam_antipope_events.0002.desc.challenger_sponsor: "나 [sponsor.GetTitledFirstName](이)가 [antipope.GetTitledFirstName](을)를 옹립했음을 알라."
 pam_antipope_events.0002.desc.antipope_self: "나 [sponsor.GetTitledFirstName](이)가 나 자신을 옹립했음을 알라."
 pam_antipope_events.0002.desc.outro: "경쟁 [ROOT.Char.GetFaith.ReligiousHeadName|U](으)로서 거짓된 [pope.GetTitledFirstName]에 맞서고, 우리의 전통이 요구하는 바에 따라 [antipope.GetRite.GetName] 신자들을 이끌도록 하겠다."
