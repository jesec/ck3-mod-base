 pam_decision_events.0008.t: "십일조 거두기"
 pam_decision_events.0008.desc.intro: "두둑한 돈궤가 손만 뻗으면 닿을 [ROOT.Char.GetFaith.HouseOfWorshipPlural]에 놓여 있다. 내 경비들이 성전에 들어가고, 뒤이어 동전이 짤랑거리는 소리가 들려왔다.\n\n"
 pam_decision_events.0008.desc.chaplain: "\"[ROOT.Char.GetTitleAsNameNoTooltip|l]께서 이젠 [ROOT.Char.GetFaith.HighGodName]의 종을 모욕하는 데서 기쁨을 느끼십니까?\" [chaplain.GetTitledFirstName](이)가 꾸짖었다. \"[ROOT.Char.GetFaith.HighGodHerHis|U] 집을 #EMP 더러운#! 매춘부처럼 발가벗기며 즐거워하시는 겁니까?\""
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]들이 넌더리를 치며 외면했다. [ROOT.Char.GetFaith.HighGodName]의 종들은 금화에 몹시도 집착하는 듯 보였다."
 pam_decision_events.0008.a: "너그러움 또한 미덕이 아니던가?"
