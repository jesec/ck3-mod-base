 pam_proclaim_living_word_decision_puppet_tt: "당신의 [puppets|E] 중 하나가 [archbishop|E] 이상임"
 pam_proclaim_living_word_decision_realm_rite_tt: "당신의 [realm|E] 내 모든 [Concept( 'county', '영지' )|E]가 당신의 [rite|E]를 따르며, 그 수가 #V 5#!개 이상임"
 pam_proclaim_living_word_decision_effect_tt: "다음 중 선택:\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_shepherd_of_the_faithful_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_fire_and_sword_modifier' ).GetNameWithTooltip]"
 pam_decision_events.0021.t: "살아있는 말씀"
 pam_decision_events.0021.desc: "[ROOT.Char.Custom('GetFaithTemple')]에는 이제 무릎 꿇을 자리조차 없다. 순례자는 [ROOT.Char.GetFaith.PriestNeuterPlural]들과 어깨를 맞대고 남작은 거지들과 뒤섞여 있지만, 문 앞에는 여전히 인파가 불어나고 있다.\n\n내 위업은 그 어떤 연대기 작가도 해내지 못할 만큼 세세히 헤아려졌다. 내가 걸었던 모든 길, 지켰던 모든 철야, [ROOT.Char.GetFaith.HighGodNamePossessive] 이름으로 내놓았던 동전 하나까지. [ROOT.Char.GetFaith.PriestNeuterPlural] 중 한 명이 내 손을 잡아 [ROOT.Char.GetFaith.HighGodNamePossessive] 제단에 대며 말한다. \"말씀하십시오. 저희가 귀 기울이겠습니다.\"\n\n뒤이어 찾아온 정적은 온전히 나의 것이다. 내가 이 정적을 무엇으로 채우느냐에 따라 그 울림은 이 벽 너머 먼 곳까지 퍼져 나갈 것이다."
 pam_decision_events.0021.a: "자비를 나의 설교로 삼겠다."
 pam_decision_events.0021.b: "불과 칼로 말씀을 전하겠다."
 pam_herald_shepherd_of_the_faithful_modifier: "신자들의 목자"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "해당 인물은 자비의 말로 자신의 신성한 소명을 선포했으며, 신자들은 그로 인해 이 인물을 경애합니다."
 pam_herald_fire_and_sword_modifier: "불과 칼"
 pam_herald_fire_and_sword_modifier_desc: "해당 인물은 자신의 신성한 소명을 무기를 들라는 부름으로 선포했으며, 신앙의 전사들이 그 깃발 아래로 모여듭니다."
 pam_convert_to_theocracy_decision: "신정제 통치 도입"
 pam_convert_to_theocracy_decision_desc: "현재의 질서는 [ROOT.Char.GetFaith.GoodGodNames]께서 세우신 질서를 왜곡한 것이다. 나는 이를 바로잡을 유일한 길을 부여받았다. 그것은 그분을 찬양하는 동시에 백성에 대한 나의 의무를 다하는 길이다. 이것이 [ROOT.Char.GetFaith.GoodGodNames]의 뜻이다."
 pam_convert_to_theocracy_decision_confirm: "[ROOT.Char.GetFaith.HighGodNamePossessive|U] 권위를 행사한다"
 pam_convert_to_theocracy_decision_tooltip: "당신의 [government|E]를 [theocracy|E]로 변경함"
 pam_convert_theocracy_to_feudal_decision: "세속주의 통치 복원"
 pam_convert_theocracy_to_feudal_decision_desc: "[ROOT.Char.GetFaith.GetAdherentNamePlural]들은 내게 [ROOT.Char.GetFaith.HighGodNamePossessive|U] 율법을 대표하는 권위자로서의 영적 지도를 기대한다. 그러나 나는 나 자신이 그 임무에 적합하지 않다고 느끼며, 그러한 판단은 나의 [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]에게 맡기려 한다.\n\n내 재능은 세속의 일에 있다. 그러니 세속의 왕관을 쓰는 것이 마땅하다! 백성에게 이 나라를 다스리는 이는 [ROOT.Char.GetFaith.PriestNeuterPlural]도, 심지어 [ROOT.Char.GetFaith.HighGodName]도 아닌 나임을 알리자."
 pam_convert_theocracy_to_feudal_decision_tooltip: "당신의 [realm|E]를 [theocracy|E] 대신 [feudal|E]로 전환"
 pam_convert_theocracy_to_feudal_decision_confirm: "봉역을 필멸자들의 손으로 되돌린다"
 religious_head_is_not_ecclesiastical: "[head_of_faith|E]가 [ecclesiastical_government|E]가 #bold 아님#!"
 different_rite_than_hof: "당신의 [rite|E] [rite_divergent|E]가 [head_of_faith_possessive|E] [rite|E]보다 [ROOT.Char.GetFaith.GetHeresyThreshold|-0] 이상임"
 pam_decision_events.0009.t: "성스러운 통치"
 pam_decision_events.0009.desc: "나는 [ROOT.Char.Custom('ReligiousHeadHeadgear')]에 경배한 뒤 그것을 머리에 쓰고, 신실한 [ROOT.Char.GetFaith.GetAdherentNamePlural]들 앞에 나선다.\n\n\"봉토와 칙령에 의존하던 옛 방식은 오랫동안 우리를 잘 이끌어 왔지만, 결국 우리를 그릇된 길로 이끌기 시작했다. 이제는 [ROOT.Char.GetFaith.HighGodName]의 말씀에 따라 [ROOT.Char.GetPrimaryTitle.GetNameNoTier](을)를 어떻게 다스려야 할지를 그분께서 정하신다. 나는 그저 그분의 겸손한 종일 뿐이며, 이는 그대들도 마찬가지다.\""
