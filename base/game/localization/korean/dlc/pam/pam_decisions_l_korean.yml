 pam_persecute_tenet_decision_desc: "모든 가르침이 설교단에 오를 자격이 있는 건 아니다. 통렬한 설교와 적재적소에 불어넣는 속삭임을 통해, 이 교리를 진흙탕으로 끌고 들어가 누구도 감히 설교하지 못하게 할 것이다."
 pam_persecute_tenet_decision_tooltip: "당신의 [faith|E]에 [known_tenet_status|E] [core_tenet|E]에 대한 비방을 전파해 해당 원리의 [tenet_popularity|E]를 낮춤"
