 pam_decision_events.0020.desc: "[clerical_region.GetName]에서 미사를 마친 뒤, 내가 직접 전하는 [ROOT.Char.GetFaith.HighGodName|U]의 말씀을 듣게 하려고 신자들을 한데 모았다. [selected_item.GetName( actor.GetRite )]에 대한 나의 신념을 가르치기 위해 [ROOT.Char.GetFaith.ReligiousText|U]에서 한 구절을 골랐다.\n\n\"[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]\""
 pam_decision_events.0020.a: "남은 말씀은 다른 영주들에게 초점을 맞추겠다."
 pam_decision_events.0020.b: "다음 비유는 내 봉신들을 위해 전하겠다."
