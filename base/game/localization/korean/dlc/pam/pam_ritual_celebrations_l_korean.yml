l_korean:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "[GetActivityType('activity_feast').GetName] [activities|E]에 대한 $praise_the_gods_intent$ [intent|E] 잠금 해제"
 praise_the_gods_intent: "신을 공경하다"
 praise_the_gods_intent_desc: "함께하는 축하의 자리를 예배의 장으로 삼아, 연회 내내 종교적 지식과 영적 통찰, 친교를 추구합니다."
 praise_the_gods_intent_not_valid_desc: "당신은 더 이상 개인적으로 [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )] [tenet|E]를 따르지 않습니다"
 pam_ritual_celebrations_events.0001.t: "계시의 연회"
 pam_ritual_celebrations_events.0001.desc: "접시는 비어 가고 술잔은 다시 채워지며, [ROOT.Char.GetFaith.WealthGodName](을)를 기리는 건배가 또 다른 건배로 이어진다. 이내 회장은 기도와 성스러운 이야기, 열띤 신학 논쟁으로 가득 찬다.\n\n무르익은 연회의 온기 속에서, 활기찬 친교를 통해서든 고요한 기도를 통해서든 깨달음이 손에 닿을 듯 가까워진다."
 pam_ritual_celebrations_events.0001.a: "이 흥겨움을 예배로 승화시키자."
 pam_ritual_celebrations_events.0001.b: "자리를 떠나 경건히 성찰하며 기도하겠다."
 pam_praise_the_gods_revelation_outcome_tt: "떠들썩한 축하 속에서 신성한 진리가 모습을 드러냄"
 pam_praise_the_gods_belief_outcome_tt: "어렴풋이 기억하던 가르침이 새로운 믿음의 길을 열어젖힘"
 pam_praise_the_gods_legend_outcome_tt: "오늘 밤의 성스러운 이야기가 전설로 뿌리내려 대대로 전해짐"
 pam_praise_the_gods_clergy_outcome_tt: "함께 찬미하며 같은 식탁에 앉은 [clergy|E] 한 명과 유대가 깊어짐"
 pam_praise_the_gods_scholar_outcome_tt: "저녁의 토론이 종교적 학문을 향한 꺼지지 않는 학구열을 일깨움"
 pam_praise_the_gods_scholar_xp_outcome_tt: "기도와 비유 하나하나가 종교적 학문에 대한 이해와 숙련을 더욱 깊게 함"
 pam_praise_the_gods_revelation_toast: "흥겨움 속의 계시"
 pam_praise_the_gods_belief_toast: "신학적 통찰"
 pam_praise_the_gods_legend_toast: "뿌리내리는 성스러운 이야기"
 pam_praise_the_gods_clergy_toast: "[ROOT.Char.GetFaith.WealthGodName](을)를 찬미하며 맺은 유대"
 pam_praise_the_gods_scholar_toast: "연회에서 발견한 지혜"
 pam_praise_the_gods_scholar_xp_toast: "깊어진 학식"
 pam_praise_the_gods_clergy_bond_opinion: "신성한 행사에서 맺은 유대"
 pam_praise_the_gods_log_title: "신을 공경했다"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U](은)는 연회에서 이어진 기도와 이야기, 토론을 통해 영적인 깨달음을 구했음"
 pam_praise_the_gods_quiet_log_title: "고요히 경건하게 기도함"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U](은)는 흥겨운 연회 자리에서 물러나 고요히 기도하며 신이 내리는 평안을 구했음"
