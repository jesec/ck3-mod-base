l_korean:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "$cathar$"
 cathar_rite_name: "카타리파"
 cathar_rite_adj: "카타리파"
 cathar_rite_adherent: "카타리파 신도"
 cathar_rite_adherent_plural: "카타리파 신도"
 cathar_rite_desc: "물질세계를 사악한 데미우르고스의 창조물로 여기는 금욕적 이원주의 교파입니다. 이 교파의 완덕자는 청빈과 정결을 서원하며 기존 교회의 성사를 배척합니다. 또한 신의 이름으로 군 복무를 거부했습니다."
 waldensian_rite: "$waldensian$"
 waldensian_rite_name: "발도파"
 waldensian_rite_adj: "발도파"
 waldensian_rite_adherent: "발도파 신도"
 waldensian_rite_adherent_plural: "발도파 신도"
 waldensian_rite_desc: "맨발로 돌아다니는 탁발 설교자들의 교파입니다. 평신도 또한 성경에 관해 설교할 수 있고, 제도적 기회는 신의 은총을 독점할 수 없으며, 기독교인이라면 재산을 소유하거나 무기를 들어서는 안 된다고 주장합니다."
 lollard_rite: "$lollard$"
 lollard_rite_name: "롤라드파"
 lollard_rite_adj: "롤라드파"
 lollard_rite_adherent: "롤라드파 신도"
 lollard_rite_adherent_plural: "롤라드파 신도"
 lollard_rite_desc: "화려한 의식, 실체변화, 유물 숭배, 부유한 성직자를 거부하는 토착 개혁주의 교파입니다. 성경을 일상에서 사용하는 언어로 읽게 했으며, 모든 신도를 그 자체로 사제라 여겼습니다."
 hussite_rite: "$hussite$"
 hussite_rite_name: "후스파"
 hussite_rite_adj: "후스파"
 hussite_rite_adherent: "후스파 신도"
 hussite_rite_adherent_plural: "후스파 신도"
 hussite_rite_desc: "보헤미아의 개혁주의 교파입니다. 평신도를 위해 성배를 사용하며 자국어로 된 성경을 읽고, 성직자의 부와 면죄부 판매의 종식을 요구합니다. 후스파 설교자들은 위클리프의 주장을 깊이 받아들였고, 로마가 사도의 길에서 벗어났다는 확고한 신념을 가지고 있습니다."
 joachimite_rite: "$joachimite$"
 joachimite_rite_name: "요아킴파"
 joachimite_rite_adj: "요아킴파"
 joachimite_rite_adherent: "요아킴파 신도"
 joachimite_rite_adherent_plural: "요아킴파 신도"
 joachimite_rite_desc: "역사를 세 가지 시대로 나누는 종말론적 교파입니다. 성부, 성자에 이어 성령의 시대가 도래해 제도적 교회를 해체하고 새로운 관상적인 질서를 세운다고 주장합니다. 이 교파의 신도는 사도가 되어 청빈하게 떠돌며 시장에서 설교하고, 곧 다가올 세계의 종말을 반짝이는 눈으로 바라봅니다."
 iconoclast_rite: "$iconoclast$"
 iconoclast_rite_name: "성상파괴주의"
 iconoclast_rite_adj: "성상파괴주의"
 iconoclast_rite_adherent: "성상파괴주의자"
 iconoclast_rite_adherent_plural: "성상파괴주의자"
 iconoclast_rite_desc: "옛 동방 무성상주의 운동의 부흥입니다. 성상 공경을 우상 숭배의 시작으로 보고 규탄하며, 교회와 가정 모두에서 우상을 제거해야 한다고 주장합니다."
 bogomilist_rite: "$bogomilist$"
 bogomilist_rite_name: "보고밀파"
 bogomilist_rite_adj: "보고밀파"
 bogomilist_rite_adherent: "보고밀파 신도"
 bogomilist_rite_adherent_plural: "보고밀파 신도"
 bogomilist_rite_desc: "사제 보고밀에게서 기원한 슬라브 이원주의 교파입니다. 이 교파의 설교자는 맨발로 순례하며 위계질서와 무장을 거부하고, 사탄이 눈에 보이는 세계를 창조했다는 교리를 설파합니다."
 paulician_rite: "$paulician$"
 paulician_rite_name: "바오로파"
 paulician_rite_adj: "바오로파"
 paulician_rite_adherent: "바오로파 신도"
 paulician_rite_adherent_plural: "바오로파 신도"
 paulician_rite_desc: "아나톨리아에서 탄생한 전투적 이원주의 교파입니다. 성상과 기존의 위계질서를 경멸합니다. 바오로의 서신을 원본 그대로 읽는 것을 중시하며, 그 순수함을 지키기 위해서라면 기꺼이 무기를 들 준비가 되어 있습니다."
 messalian_rite: "$messalian$"
 messalian_rite_name: "메살리아주의"
 messalian_rite_adj: "메살리아주의"
 messalian_rite_adherent: "메살리아주의자"
 messalian_rite_adherent_plural: "메살리아주의자"
 messalian_rite_desc: "비의적인 금욕주의 교파로, 끝없는 기도를 하나뿐인 중요한 성사로 여깁니다. 한때 자신의 내면에 있던 악마를 쫓아낸 신자라면 그 어떤 육체적 행위로도 더럽힐 수 없다고 믿습니다."
 adoptionist_rite: "$adoptionist$"
 adoptionist_rite_name: "양자론"
 adoptionist_rite_adj: "양자론"
 adoptionist_rite_adherent: "양자론자"
 adoptionist_rite_adherent_plural: "양자론자"
 adoptionist_rite_desc: "스페인계 그리스도론 교파입니다. 인간성 측면에서 그리스도는 타고난 신의 아들이 아니라 양자로 선택되어 입양되었다고 주장하며, 카롤링거 교회에서는 이를 네스토리우스파와 흡사한 교리로 보았습니다."
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "신자들이 [rite_divergence|E]에 맞서 결집함"
 pam_heresy_fervor_reset_component_2_desc: "신자들이 새로운 분리 [rite|E]에 맞서 결집함"
 pam_heresy_fervor_reset_component_3_desc: "신자들이 이단의 부흥에 맞서 결집함"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "이단 분파"
 heresy_light.0010.desc.intro.descriptor_archbishop: "[founder.GetCulture.GetName] 대주교 [founder.GetFirstName]"
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName]"
 heresy_light.0010.desc.opener.archbishopric: "(은)는 [founder_clerical_title.GetNameNoTier](을)를 관리하며"
 heresy_light.0010.desc.opener.lands: "(은)는 [founder.GetPrimaryTitle.GetBaseNameNoTier](을)를 관리하며"
 heresy_light.0010.desc.body.uneasy: "[new_rite.GetName](을)를 [source_rite.GetAdjective]에서 한층 더 멀리 비틀어 놓았고, "
 heresy_light.0010.desc.body.alarming: "[new_rite.GetName](을)를 기존의 용인된 [source_rite.GetAdjective]에서 위험할 만큼 멀리 떨어뜨려 놓았고, "
 heresy_light.0010.desc.body.dangerous: "[new_rite.GetName](을)를 [source_rite.GetAdjective]의 친족이라 보기도 힘들 정도로 분화시켰고, "
 heresy_light.0010.desc.differing.tenet: "그중에서도 가장 눈에 띄는 차이는 [differing_tenet.GetBaseName](이)다."
 heresy_light.0010.desc.differing.doctrine: "그중에서도 가장 눈에 띄는 차이는 [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )](이)다."
 heresy_light.0010.desc.differing.fallback: "새로 강조된 점은 너무 미묘해 하나의 이름으로 표현하기도 힘들다."
 heresy_light.0010.desc.outro: "\n\n아직은 이단이라 할 수 없다. 그러나 그 시점도 이제 머지않았다."
 heresy_light.0010.desc.outro.own_rite: "\n\n아직은 우릴 이단이라 할 수 없다. 그러나 그 시점도 이제 머지않았다."
 heresy_light.0010.a: "인도를 구하며 기도하겠다."
 heresy_light.0010.b: "[new_rite.GetNameNoTooltip]에는 지혜가 있다. 그 길을 걸으리라."
 heresy_light.0010.c: "아무래도 이단 같은데..."
 heresy_light.0010.c.own_rite: "나아가자. 이게 우리가 가야 할 길이다."
 heresy_light.notification.member.title: "우리 교파의 표류"
 heresy_light.notification.member.tt: "[new_rite.GetName](이)가 [founder.GetTitledFirstName]의 인도 아래 [source_rite.GetAdjective]에서 더 멀어짐."
 heresy_light.notification.hof.title: "이단으로 치닫는 교파"
 heresy_light.notification.hof.tt: "[new_rite.GetName](이)가 [founder.GetTitledFirstName]의 인도 아래 [source_rite.GetAdjective](을)를 떠나 더 깊이 파고들었음."
 heresy_light.notification.mainline.title: "이웃 교파의 표류"
 heresy_light.notification.mainline.tt: "[new_rite.GetName](이)가 [founder.GetTitledFirstName]의 인도 아래 [source_rite.GetAdjective]에서 더 멀어짐."
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "이단 교파"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "[founder.GetCulture.GetName] 대주교 [founder.GetFirstName]"
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.GetTitledFirstName]"
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "(은)는 [founder_clerical_title.GetNameNoTier](을)를 관리하며"
 heresy_dangerous_rite.0010.desc.opener.lands: "(은)는 [founder.GetPrimaryTitle.GetBaseNameNoTier](을)를 관리하며"
 heresy_dangerous_rite.0010.desc.body.alarming: "[source_rite.GetAdjective](와)과의 관계를 끊어 버리고 [new_rite.GetName](을)를 선언했는데, "
 heresy_dangerous_rite.0010.desc.body.severe: "[source_rite.GetAdjective]에서 이름을 제외한 모든 것을 버리고 [new_rite.GetName](을)를 선언했는데, "
 heresy_dangerous_rite.0010.desc.differing.tenet: "새 칙령 중에서도 가장 대담한 [differing_tenet.GetBaseName](을)를 공공연히 전파했다."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "새 칙령 중에서도 가장 대담한 [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )](을)를 공공연히 전파했다."
 heresy_dangerous_rite.0010.desc.differing.fallback: "새 칙령이 너무 많아 한 줄에 담기가 힘들 정도다."
 heresy_dangerous_rite.0010.desc.outro: "\n\n설교자들이 이미 봉역 곳곳으로 퍼져나가는 중이다. 한 손에는 [origin_faith.ReligiousText], 다른 손에는 횃불을 들고서. [origin_faith.GetName]의 장로들은 이 상황을 전혀 좋게 볼 수가 없으리라.\n\n잠재적인 이단이 확실하게 자리매김했으며 연단에서 그 교리를 외치고 있다. 설교가 답하지 못하는 곳에서는 검과 불길이 답할 것이다."
 heresy_dangerous_rite.0010.a: "시작하지."
 heresy_dangerous_rite.0010.c: "아무래도 이단 같은데..."
 heresy_dangerous_rite.spread.title: "새로운 교파의 확산"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "위클리프의 이단"
 heresy_historical.0050.t.hussite.first: "후스의 이단"
 heresy_historical.0050.t.joachimite.first: "요아킴의 이단"
 heresy_historical.0050.t.cathar.first: "카타리의 이단"
 heresy_historical.0050.t.waldensian.first: "발도의 이단"
 heresy_historical.0050.t.bogomilist.first: "보고밀의 이단"
 heresy_historical.0050.t.resurgence: "[heresy_faith.GetAdjectiveNoTooltip] 이단의 귀환"
 heresy_historical.0050.t.fallback: "[heresy_faith.GetAdjectiveNoTooltip] 이단"
 heresy_historical.0050.desc.nearby.first: "[founder.GetTitledFirstName](이)가 [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]에서 [heresy_faith.GetAdjective]의 대의를 설교하고 있다. 더는 소문을 부인할 수 없을 만큼 가까운 거리다. 우리의 [origin_faith.PriestMalePlural]들은 설교단에서 [founder.GetHerHim]를 강력히 비난하지만, 그럴수록 [founder.GetHerHis] 말이 더 널리 퍼질 뿐이다.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "[founder.GetTitledFirstName]의 지도 아래 [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]에서 [heresy_faith.GetAdjective] 사상이 다시 불타오르고 있다. 이렇게 가까웠던 적은 없었다. 궁정 신하는 물론이고 평민까지, 모두 애초에 이 교파가 왜 위험했는지를 아직도 기억하고 있는데 말이다.\n\n"
 heresy_historical.0050.desc.distant.first: "머나먼 [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]에서 [heresy_faith.GetAdjective] 사상에 불을 밝힌 [founder.GetTitledFirstName]에 대한 이야기가 들려온다. 순례자와 상인은 길을 떠나며 [founder.GetHerHis] 설교집을 챙긴다고 한다. 이제 유일한 의문은 이 소문이 과연 언제쯤 우리의 코앞에 당도할지다.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "머나먼 [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]에서 모든 성직자가 두려워하던 소식이 전해졌다. [heresy_faith.GetAdjective] 사상이 [founder.GetTitledFirstName]의 지도 아래 다시 불타오르기 시작했다는 것이다. 그 어떤 불길도, 칙령도, 공의회도 이 움직임을 잠재울 수 없었던 모양이다.\n\n"
 heresy_historical.0050.desc.insider.first: "[founder.GetTitledFirstName](이)가 [heresy_faith.GetAdjective]의 대의를 [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]에서 공개적으로 드러냈다. 수년간 이어진 속삭임이 마침내 온 세계를 향한 설교가 되었다.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.GetTitledFirstName](이)가 [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]에서 [heresy_faith.GetAdjective] 사상에 다시 불을 붙였다. 옛 불꽃이 다시 타오른다. 우리의 움직임은 잊히지 않았다.\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.GetSheHe|U]는 일상에서 사용하는 언어로 성경을 설교한다. 사제단을 위한 땅은 없고, 제단에는 극장도 없다."
 heresy_historical.0050.gloss.hussite: "[founder.GetSheHe|U]는 평신도를 위한 두 가지 형태의 성찬식, 보헤미아 언어로 된 성경을 설교하며 교회가 물질적인 구매로 획득한 위엄을 버려야 한다고 주장한다."
 heresy_historical.0050.gloss.joachimite: "[founder.GetSheHe|U]는 성령의 시대가 임박했으며, 로마의 사제식 질서가 가고 청빈한 이들을 위한 관상적 교회가 도래한다고 설교한다."
 heresy_historical.0050.gloss.cathar: "[founder.GetSheHe|U]는 엄격한 이원주의를 설교하며, 세상은 사악한 신의 창조물이고 로마 교회는 바빌론의 창부나 다름없다고 주장한다."
 heresy_historical.0050.gloss.waldensian: "[founder.GetSheHe|U]는 맨발의 평신도 설교자들로 이루어진 청빈한 교회에 대해 설교한다. 맹세도, 전쟁도, 성경의 말씀을 사제들이 독점하는 일도 없다."
 heresy_historical.0050.gloss.bogomilist: "[founder.GetSheHe|U]는 슬라브 이원주의를 설교한다. 세상은 사탄의 창조물이며, 영혼을 되찾을 방법은 끝없는 기도밖에 없다고 여긴다."
 heresy_historical.0050.gloss.paulician: "[founder.GetSheHe|U]는 이원주의, 성상 파괴 운동, 바오로 서신의 집중적인 독해를 중심으로 하는 옛 동방의 불길을 퍼뜨린다. [founder.GetHerHis|U] 추종자들은 말뚝에 꽂히느니 차라리 검을 쥐고자 한다."
 heresy_historical.0050.gloss.iconoclast: "[founder.GetSheHe|U]는 성상파괴주의의 부흥을 설교한다. 모든 채색된 그리스도상과 도금한 성상은 우상이며, 제2차 니케아 공의회는 잘못이었음에도 속죄하지 않았다는 것이다."
 heresy_historical.0050.gloss.adoptionist: "[founder.GetSheHe|U]는 옛 스페인의 논쟁을 되살리는 설교를 한다. 그리스도는 인간성 측면에서 타고난 것이 아니라 양자로 입양되었다는 주장이다."
 heresy_historical.0050.gloss.messalian: "[founder.GetSheHe|U]는 모든 성사보다 끝없는 기도를 우선하며, 어떤 사제도 결코 쫓아낼 수 없는 내면의 악마에 대해 설교한다."
 heresy_historical.0050.gloss.generic: "[founder.GetSheHe|U]는 [heresy_faith.GetAdjective] 전통을 기반으로 날카롭게 다듬은 철저한 쇄신의 교리를 설교한다."
 heresy_historical.0050.history.lollard: "\n\n이 교파는 옥스퍼드에서 교회법에 대해 직설적인 질문을 던지며 시작되었다. 이제는 영어로 된 성경이 수도원을 넘어 마을로 퍼져 나가고 있는데, 그 속도는 어떤 교구 사제도 막을 수 없을 만큼 빠르다."
 heresy_historical.0050.history.hussite: "\n\n이 교파는 프라하의 베들레헴 예배당에서 시작되었다. 보헤미아 언어로 설교하고, 평신도에게도 성배를 사용하며 왕관은 다른 쪽을 향한다. 교황청에서는 그러지 않을 것이다."
 heresy_historical.0050.history.joachimite: "\n\n이 교파는 칼라브리아 수도원에서 시작되었으며, 이곳에서는 수도원장이 계시록을 달력처럼 읽어 내려가며 다가올 시대까지 남은 시간을 센다. 영성주의 프란치스코회에서 그 계산을 이어받았고, 이제 평신도 설교자들이 그 교리를 모든 시장 광장에 전파하고 있다."
 heresy_historical.0050.history.cathar: "\n\n이 교파는 발칸 반도에서 건너와 랑그도크의 회당에 뿌리를 내렸고, 이제는 직공부터 자작에 이르기까지 다양한 신도를 보유한다. 완덕자는 맨발로 다니며 맹세를 거부하고, 그 주위의 신도는 계절이 갈수록 늘어난다."
 heresy_historical.0050.history.waldensian: "\n\n이 교파는 자신의 물건을 가난한 이에게 주고, 거리에서 설교하던 리옹의 어느 상인에게서 시작되었다. 시노드에서는 이 상인에게 침묵을 명했다. 설교자들은 대신 짝을 지어 맨발로 고산 계곡으로 들어갔다."
 heresy_historical.0050.history.bogomilist: "\n\n이 교파는 표트르 1세의 지배 아래 시작되었다. 마을 사제들은 빵과 포도주가 그저 빵과 포도주일 뿐이라고 가르쳤다. 총대주교는 교파를 파문했으나, 이 교리는 슬라브의 전원 지역에 깊숙이 스며들어 사라지지 않았다."
 heresy_historical.0050.history.paulician: "\n\n보스포러스의 어느 대성당보다 더 오래된 불이다. 바오로 서신의 집중적인 독해를 중시하고, 아르메니아고원에서 시작되었으며 테프리케에서는 한때 제국에 맞서기도 했던 불길이다."
 heresy_historical.0050.history.iconoclast: "\n\n제국은 두 번에 걸쳐 교회에서 채색된 그리스도상과 도금된 성상을 치워버렸고, 두 번에 걸쳐 우상은 다시 돌아왔다. 또한 두 번 모두 해답을 얻지 못한 의문을 묻어 버렸다. 이제 그 오래된 논쟁이 다시 수면 위로 떠오르고 있다."
 heresy_historical.0050.history.adoptionist: "\n\n이 주장은 이베리아에서 비롯되었으며 어느 국경 지대에서 탄생했다. 한 무리의 주교들이 목수의 아들은 영광을 가지고 태어난 것이 아니라, 입양되어 영광을 얻게 되었다고 결정한 것이다. 프랑크푸르트와 아헨은 이를 규탄했으나, 국경 지대에서는 끊임없이 의문을 제기해 왔다."
 heresy_historical.0050.history.messalian: "\n\n이 교파는 메소포타미아의 사막에서 시작되었다. 방랑 수도사들은 잠도 자지 않고 기도하며, 모든 영혼 속에는 어떤 사제도 쫓아낼 수 없는 악마가 깃들어 있다고 믿었다. 에페소스에서는 이들을 규탄했으나, 수도사들은 아랑곳하지 않고 계속 방랑을 이어갔다."
 heresy_historical.0050.history.generic: "\n\n시대마다 각자의 불길을 일으키곤 한다. 규칙을 깨버린 수도원에서 대성당을 떠나 다시는 돌아오지 않은 설교자까지. 이번 불길도 지금 길을 나서고 있다."
 heresy_historical.0050.a: "저들의 주장은 정당하다. 그러니 포용해야겠지."
 heresy_historical.0050.b: "저런 신념이 있다니... 내 믿음도 저랬으면 좋겠군."
 heresy_historical.0050.c: "이단자들..."
 heresy_historical.0050.c.insider: "우린 견뎌내리라. 대의는 더 강해질 것이다."
 heresy_historical.spread.title: "이단의 전파"
