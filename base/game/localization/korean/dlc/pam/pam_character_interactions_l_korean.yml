 REQUEST_UNFORMED_TITLE_NOTIFICATION: "[target.GetName](은)는 너무나 오래도록 비어 있었으나, 그 땅은 이름만 빼고는 모두 제 소유입니다. 선언해 주신다면 그 땅의 모든 [puppet_or_actor.GetFaith.GetAdherentName](이)가 이 땅이 [puppet_or_actor.GetFaith.HighGodNamePossessive] 은총은 물론, 그대의 은혜로 제 소유가 되었음을 알게 될 것입니다."
