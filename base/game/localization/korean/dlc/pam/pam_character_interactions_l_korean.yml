 DEMAND_DIVORCE_NOTIFICATION: "그대에게 배우자 [secondary_recipient.GetTitledFirstName](와)과 이혼할 것을 요구합니다."
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\n그대와 [secondary_recipient.GetFirstNameNoTooltip](이)가 혈족이라는 사실은 세상이 다 알고 있습니다. [actor.GetFaith.HighGodName]께서 이런 근친 관계를 용납하실 리 없습니다."
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\n그대들의 결합은 [actor.GetFaith.HighGodName]께서 정하신 혼인의 질서를 모욕하는 것입니다. 더는 용납할 수 없습니다."
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip](은)는 다른 신들을 섬기면서 그대와 부부의 연을 맺고 있습니다. 그런 혼인을 그대로 두고 볼 수는 없습니다."
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip](은)는 참된 신앙에서 벗어났으며, 그대의 영혼마저 그릇된 길로 이끌고 있습니다. 이 결혼을 더는 용납할 수 없습니다."
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\n[secondary_recipient.GetFirstNameNoTooltip](이)가 그대와의 혼인에서 정절을 저버렸다는 사실은 세상이 다 알고 있습니다. 이미 깨진 혼인은 이제 끝내야 합니다."
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\n그대에게는 여러 배우자가 있고, [secondary_recipient.GetFirstNameNoTooltip] 또한 그중 하나입니다. [actor.GetFaith.HighGodName]께서는 이런 혼인 관계를 혐오하십니다. 더는 용납될 수 없는 관계입니다."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\n학식 있는 이들이 그대와 [secondary_recipient.GetFirstNameNoTooltip]의 혈통을 조사한 결과, 혼인이 금지되는 촌수 안에서 서로 혈연으로 이어져 있음이 밝혀졌습니다. 혈족 관계인 셈이며, 조사 결과의 신뢰도는 상당히 높습니다."
