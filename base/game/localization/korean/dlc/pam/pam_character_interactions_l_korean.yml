 pam_evangelize_recipient_prohibited_selected_tenet_reason: "[recipient.GetShortUIName](이)가 당신의 [prohibited_tenet_status|E] [personal_tenet|E]를 두려워함: $VALUE|=+0$"
 pam_evangelize_personal_tenet_interaction_tooltip: "당신의 [personal_tenets|E] 중 하나를 자신의 것으로 채택함"
 pam_evangelize_personal_tenet_interaction_prohibited_secret_tooltip: "선택된 [personal_tenet|E]가 [prohibited_tenet_status|E]인 경우 [recipient.GetShortUIName](은)는 당신이 보유한 임의의 $secret_forbidden_personal_tenet$ [secrets|E]을 습득"
 pam_evangelize_personal_tenet_interaction_popularity_tooltip: "선택한 [personal_tenet|E]의 [tenet_popularity|E]가 #P +[recipient.MakeScope.ScriptValue('pam_evangelize_tenet_popularity_gain')|+0]#!만큼 증가하게 됨"
