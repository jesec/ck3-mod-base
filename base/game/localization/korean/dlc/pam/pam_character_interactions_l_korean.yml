 pam_interactions_events.0100.desc: "[ROOT.Char.GetFaith.HighGodName](와)과 모인 신자들 앞에서, [actor.GetTitledFirstName](은)는 나를 적자로 인정했다. 태생 때문에 누리지 못했던 지위를 성직자들이 신성한 예법과 기록 한 번으로 내게 부여한 것이다.\n\n이제 누구도 나를 사생아라 부르지 못할 것이다."
