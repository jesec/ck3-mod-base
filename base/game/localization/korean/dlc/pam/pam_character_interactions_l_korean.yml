 pam_reaffirm_doctrine_interaction_notification: "[recipient.GetRite.GetName|U](은)는 [actor.GetRite.GetAdjective] 교리의 귀중한 정통에서 벗어나 있소. 그대들의 [actor.GetTitleAsName](이)가 모두에게 회개를 촉구하는 바요! [recipient.GetFaith.HighGodName](을)를 섬기고, [recipient.GetRite.GetAdherentNamePluralNoTooltip]들에게 [pam_reaffirm_doctrine.GetDescriptiveName( recipient.GetFaith )](을)를 설파하시오."
