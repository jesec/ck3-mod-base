 pam_interactions_events.0094.opening: "정당한 [ROOT.Char.GetTitleAsName]!"
 pam_interactions_events.0094.desc_conversion: "[target.GetNameNoTier] 전역에 [cleric.GetFaith.HighGodName]의 말씀을 전파하라! 그릇된 길을 걷는 백성에게 매를 아끼지 말고, 이 땅의 미덕을 수호하는 데 [ROOT.Char.Custom('GetFighterTermPlural')]들의 힘도 아끼지 말라.\n\n[target.GetTierAsNameNoTooltip](은)는 그대가 다스릴 땅이다. 세상이 끝나는 날까지 모든 [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetTitleAsName]의 보호 아래 #EMP 규범상#! 놓일 것이다."
 pam_interactions_events.0094.desc: "오늘은 [target.GetNameNoTooltip]의 [cleric.GetFaith.GetAdherentNamePlural]들에게 축복받은 날이다! 이들이 [ROOT.Char.GetPrimaryTitle.GetNameNoTier]의 형제자매들과 하나 되기를 얼마나 간절히 바라 왔던가!\n\n[target.GetAdjectiveNoTooltip] 사람들의 마음속에 품어 온 소망을 [cleric.GetFaith.HighGodNamePossessive] [cleric.GetTitleAsName](이)가 법으로 확정했다. 이제 여러 땅의 군주들이 [target.GetTierAsNameNoTooltip](을)를 [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]의 #EMP 규범상#! 봉역으로 인정한다."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip](와)과 [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip](은)는 영원히 하나로 맺어졌다."
 pam_interactions_events.0095.opening: "[target_county.GetNameNoTier](와)과 여러 영지의 [ROOT.Char.GetTitleAsName],"
 pam_interactions_events.0095.desc: "[cleric.GetFaith.HighGodName]의 축복이 그대에게 내려졌다! 그분께서는 그분의 지혜로 [target.GetName] 전체를 [de_jure_master.GetPrimaryTitle.GetName]의 [de_jure_master.GetTitleAsName](이)가 영원히 보호하도록 명하셨다.\n\n[cleric.GetTitleAsName](으)로서, 나는 [target.GetAdjectiveNoTooltip] [cleric.GetFaith.GetAdherentNamePlural]들과 [de_jure_master.GetTitleAsNameNoTooltip], 그리고 [cleric.GetFaith.HighGodNamePossessive] 뜻에 따라 속세의 봉역을 이처럼 #EMP 규범상#! 나누어 정하는 것이 현명하다고 여기는 이들의 뜻을 받들어 이 칙령을 내린다."
 pam_interactions_events.0095.a: "빌어먹게 탐욕스러운 [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]들이란!"
