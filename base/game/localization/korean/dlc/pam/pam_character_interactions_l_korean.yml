 pam_negotiate_land_possible_acceptance_tt: "[recipient.GetShortUIName]에게 [title|E]를 넘기라고 설득하려면 [actor.GetShortUIName](이)가 다음 조건 중 하나를 만족해야 함:\n$BULLET_WITH_TAB$[recipient.GetShortUIName]에 대한 [hook_i][hook|E]\n$BULLET_WITH_TAB$[friend|E], [disciple|E] 또는 [soulmate|E] [relation|E]\n$BULLET_WITH_TAB$더 높은 @piety_icon![piety_level|E]\n$BULLET_WITH_TAB$더 높은 @legitimacy_icon![legitimacy_level|E]\n$BULLET_WITH_TAB$#high [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! @gold_icon![gold|E] 또는 @treasury_icon![treasury|E]\n$BULLET_WITH_TAB$[recipient.GetShortUIName](이)가 @intimidated_icon![intimidated|E]을 느끼며 당신의 군사력의 #high 25%#! 미만을 보유해야 함([allies|E] 포함)\n$BULLET_WITH_TAB$[recipient.GetShortUIName](이)가 @terrified_icon![cowed|E]한 상태이며 당신의 군사력의 #high 50%#! 미만을 보유해야 함([allies|E] 포함)"
 clergy_transfer_no_capital_county_tt: "[target.GetName](이)가 [recipient.GetShortUINamePossessive] 유일한 [Concept( 'county', '영지' )|E]"
