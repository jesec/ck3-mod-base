 clergy_transfer_instant_accept_piety_legitimacy_tt: "#Weak #EMP #N 0#! @piety_icon![piety_level|E] 및 #N 0#! @legitimacy_icon![legitimacy_level|E]로 인해 이 [interaction|E]을 #bold 승낙#!할 것임#!#!"
 clergy_transfer_instant_accept_popes_demands_tt: "#Weak #EMP 당신의 중보자가 [head_of_faith|E]이며, 당신이 해당 인물에 대한 @unspent_strong_hook_icon![strong_hook|E]을 보유하고 있으므로 이 [interaction|E]을 #bold 승낙#!할 것임#!#!"
