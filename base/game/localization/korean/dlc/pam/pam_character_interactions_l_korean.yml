 pam_interactions_events.0060.t: "이혼 정당화"
 pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName](이)가 결혼 생활을 끝내고 싶어 하는 것은 맞다. 하지만 [puppet_or_actor.GetSheHe]와 [secondary_recipient.GetTitledFirstName](이)가 서로에게 어떤 악감정을 품고 있든... 이들은 [puppet_or_actor.GetFaith.HighGodName] 앞에서 하나가 되었다. 그리고 이를 끝낼 정당한 근거도 없다.\n\n그러므로 저들의 혼인을 무효로 할 거짓말을 지어내야 한다. 이는 신성모독이며, 따라서 약간의 보상을 받을 만하다는 생각이 든다..."
 pam_interactions_events.0060.a: "이 이혼에는... 마땅히 추문이 뒤따라야지."
 pam_interactions_events.0060.a.tt: "고귀한 거짓말이 아니라, [secondary_recipient.GetFirstNameNoTooltip](을)를 향한 사악한 비난을 퍼뜨리겠다! [secondary_recipient.GetHerHis|U] 가족은 당사자를 변호할 수밖에 없을 것이며, [puppet_or_actor.GetFirstNamePossessiveNoTooltip] 친족 역시 마찬가지 상황이 될 것이다."
 pam_interactions_events.0060.b: "[puppet_or_actor.GetTitleAsNameNoTooltip](이)가 독신자에게 토지를 기부하도록 한다."
 pam_interactions_events.0060.b.tt: "[lease_order.GetName]에게 작위를 넘긴다면 우리 모두의 영혼에서 이 짐을 덜어낼 수 있겠지..."
 pam_interactions_events.0060.c: "호의는 그에 맞는 호의로 갚아야 하는 법."
 pam_interactions_events.0060.d: "[secondary_recipient.GetFirstNameNoTooltip](이)가 성직 서약을 했다고 주장한다."
 pam_interactions_events.0060.d.tt: "[secondary_recipient.GetSheHe]가 한참 전에 [divorcee_joining_order.GetName]에 입회하겠다는 서약을 했다면, 이 결혼은 무효나 다름없다! 그러고 나면 [secondary_recipient.GetFirstNamePossessiveNoTooltip] 새로운 삶을 이끌어 줄 만한 인물이 나 말고 또 누가 있겠는가?"
 pam_interactions_events.0060.e: "불행한 부부에게 아무 요구도 하지 않는다."
