 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\n[puppet_or_actor.GetFaith.HighGodName]께 맹세하는데, 그 [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))](이)가 내 [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))](을)를 살해하려 했단 말이오!"
