 pam_interactions_events.0070.t: "[puppet_or_actor.GetTitleAsNameNoTooltip](을)를 위한 전쟁"
 pam_interactions_events.0070.desc_intro_pagan: "\"[target.GetNameNoTier]의 사악한 토속 신자들에게,"
 pam_interactions_events.0070.desc_intro_heretic: "\"[target.GetNameNoTier]의 [recipient.GetFaith.GetAdherentNamePlural] 이단자들에게,"
 pam_interactions_events.0070.desc_intro_infidel: "\"[target.GetNameNoTier]의 [recipient.GetFaith.GetReligion.GetAdjective] 불신자들에게,"
 pam_interactions_events.0070.desc_intro_heathen: "\"[target.GetNameNoTier]의 이교도 [recipient.GetFaith.GetReligion.GetAdherentNamePlural]들에게,"
 pam_interactions_events.0070.desc: "#EMP 검에 의한 멸망과 파멸, 죽음이 있으라!#!\" [puppet_or_actor.GetTitledFirstNameRegnal](이)가 외쳤다. [puppet_or_actor.GetHerHis] 외침은 들썩이는 [secondary_recipient.GetPrimaryTitle.GetNameNoTier]의 군중 사이로 전해졌다.\n\n\"[ROOT.Char.GetFaith.random_GoodGodNames]의 거룩한 군기를 높이 드시오, [ROOT.Char.GetTitledFirstName]! 그대를 부르니, [target.GetNameNoTierNoTooltip]의 땅에서 [recipient.GetTitledFirstName](을)를 내쫓아야 하오! [recipient.GetHerHis] [recipient.GetPrimaryTitle.GetAdjective] [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]들을 [ROOT.Char.GetFaith.NegativeAfterLife]의 불길 속으로 던져 버립시다!\"\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "[puppet_or_actor.GetTitleAsNameNoTooltip](은)는 진정 [puppet_or_actor.GetFaith.HighGodNamePossessive] 지배를 널리 퍼뜨리고자 하는구나! [puppet_or_actor.GetSheHe|U]는 직접 말을 달려 전쟁에 나서기로 했으며, [puppet_or_actor.GetHerHis] 병력이 내 명령을 따르게 되었다."
 pam_interactions_events.0070.desc_outro_funding_war: "금화가 이 요구를 뒷받침하고 있다. [puppet_or_actor.GetTitleAsNameNoTooltip](은)는 군자금 지원을 약속했으며, 덕분에 내 [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]들은 믿음 말고도 다른 지원까지 받을 수 있게 되었다."
 pam_interactions_events.0070.a: "\"[ROOT.Char.GetFaith.WarGodName](이)가 함께하신다! #EMP 전쟁으로!#!\""
 pam_interactions_events.0070.b: "[recipient.GetTitledFirstNamePossessiveNoTooltip] 사람들을 그냥 내버려둔다."
 cultural_acceptance_gain_refused_incited_holy_war: "세속 영주가 성전의 발발을 막음"
 pam_interactions_events.0071.t: "[ROOT.Char.GetFaith.HighGodNamePossessive] [target.GetNameNoTierNoTooltip] 정복"
 pam_interactions_events.0071.desc_intro: "전장의 함성과 노래, 승리를 비는 기도에서 [ROOT.Char.GetFaith.HighGodNamePossessive] 신성한 말씀이 [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)]들의 [target.GetTierAsNameNoTooltip]까지 전해졌다! [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier]에 있는 주요 [ROOT.Char.GetFaith.HouseOfWorship]에서 [secondary_recipient.GetName](이)가"
 pam_interactions_events.0071.desc_intro_pagan: "[recipient.GetPrimaryTitle.GetAdjective] 토속 신자들을 상대로 성전을 선포했다.\n\n[recipient.GetTitledFirstName](와)과 [recipient.GetHerHis] [recipient.GetCulture.GetCollectiveNoun] 사람들은 정의로운 [secondary_recipient.GetPrimaryTitle.GetNameNoTierPossessive] [secondary_recipient.GetFaith.GetReligion.GetAdjective] 병력 앞에서 분명 짐승처럼 도망칠 것이다!"
 pam_interactions_events.0071.desc_intro_heretic: "[recipient.GetPrimaryTitle.GetAdjective] 이단자들을 상대로 성전을 선포했다.\n\n거대한 피의 파도가 몰아치며 [recipient.GetTitledFirstName](와)과 [recipient.GetHerHis] 더러운 [recipient.GetFaith.GetAdherentNamePlural]들을 이 땅에서 쓸어버리리라! 그러므로 [ROOT.Char.GetFaith.HighGodName]의 말씀을 더럽히는 자는 언제나 경계할지어다!"
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.GetPrimaryTitle.GetNameNoTier]의 [recipient.GetTitleAsName](을)를 상대로 성전을 선포했다.\n\n[recipient.GetFaith.GetReligion.GetAdjective] 불신자들은 선지자의 #EMP 지하드#! 앞에 쓰러졌던 자들처럼, 머지않아 모두 굴복하게 되리라!"
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.GetPrimaryTitle.GetNameNoTier]의 [recipient.GetTitleAsName](을)를 상대로 성전을 선포했다.\n\n[ROOT.Char.GetFaith.WarGodName]의 이름으로, [secondary_recipient.GetSheHe]가 이교도 무리를 부숴버릴 것이다! [ROOT.Char.GetFaith.GetReligion.GetAdjective] 사람들이 경이 속에 그 모습을 지켜보리라."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\n내 병력 또한 가만히 앉아 있지만은 않으리라! 이들은 [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l] 곁에서 [recipient.GetCapitalLocation.GetTitle.GetNameNoTier](으)로 쳐들어갈 것이다."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\n벌써 [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip](와)과 그 너머에서 온 열성 넘치는 전사들이 [secondary_recipient.GetTitledFirstNamePossessiveNoTooltip] 깃발 아래 결집했다."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\n[ROOT.Char.GetFaith.HighGodNamePossessive] 은총만으로도 [secondary_recipient.GetTitledFirstNameNoTooltip]의 승리는 확실하다. 하지만 내 넉넉한 기부 덕분에 [secondary_recipient.GetHerHis] 자신감도 치솟았다."
 pam_interactions_events.0071.a: "이 대의를 위해 목숨을 바친 이들이 영원히 부러움을 사게 하소서."
