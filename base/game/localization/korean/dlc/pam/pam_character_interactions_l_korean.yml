 # Clerical land transfer events
 # player Priest refuses event
 pam_interactions_events.0031.opening: "완고한 [actor.Custom('GetDaughterSon')]에게,"
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName]께서 입을 주신 것은 정당한 말을 하라는 뜻이었으며, [actor.GetFaith.HighGodName]께서 손을 주신 것은 검을 휘두르라는 뜻이었소. 또한 [actor.GetFaith.HighGodName]께서는 세계에 [actor.GetFaith.PriestNeuterPlural]들을 내리셔서 그대가 그 지혜에 귀를 기울이도록 하셨소. \n\n탐욕에 사로잡힌 그대는 부정한 말을 일삼고 있소. 두려움과 의심 때문에 [target.GetNameNoTier](을)를 향해 칼을 휘두르는구려.\n\n그리하여 결론은 이거요. 그대는 내 지혜에 귀를 기울이고... [target.GetTierAsName](을)를 그냥 두어야 하오."
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip](이)가 내 대의를 거부하다니!"
 # Player clergy response event
 pam_interactions_events.0033.opening: "천상과 지상의 질서를 지키는 분께,"
 pam_interactions_events.0033_de_jure: "그대의 도움을 구합니다. 제 지배가 저의 규범상 권리인 [target.GetName]에도 정당하게 적용된다는 사실을 선언해 주십시오. 그대의 승인이 있다면 유혈 사태가 일어나지 않도록 [recipient.GetName](을)를 설득할 수 있을 겁니다.\n\n"
 pam_interactions_events.0033_claim: "[target.GetNameNoTier]에 대한 제 명분을 획득할 방법을 구하고 있습니다. 제게 신성한 허가를 내려 주신다면 [recipient.GetName](이)가 [actor.GetFaith.GetAdjective]인들의 피를 흘리는 일 없이 [target.GetTierAsName](을)를 넘기게 될 겁니다.\n\n"
 pam_interactions_events.0033_threaten: "이 요청을 거부하신다면... 제가 [target.GetNameNoTierNoTooltip]에 불러올 대학살과 화재에 대해서는 #EMP 그대가#! 직접 [ROOT.Char.GetFaith.HighGodName]께 해명하시길 바랍니다."
 pam_interactions_events.0033_succession: "절 지지해 주신다면 저 또한 다음과 같은 약속을 하겠습니다. 제가 집안의 후사 없이 [actor.GetPrimaryTitle.GetNameNoTier]의 [actor.GetTitleAsName](으)로서 죽는다면, [actor.GetPrimaryTitle.GetNameNoTier](은)는 교회의 소유가 될 것입니다."
 pam_interactions_events.0033_pilgrimage: "이 속세의 사안에 관해 신성한 허가를 내려 주신다면, 저 또한 순례를 떠날 것을 약속하겠습니다. [actor.GetFaith.HighGodName]께서 제게 주신 축복에 대해 감사를 드려야 하니까요."
 pam_interactions_events.0033_use_hook: "설마 잊으신 것은 아니겠지요... 그대의 이름은 제 명령 아래 새겨졌으며, 그대가 쓰는 글 또한 제 기분을 따라야 한다는 사실 말입니다..."
 pam_interactions_events.0033_offer_hook: "그대의 독실한 평판을 제 대의를 위해 빌려달라는 것은 절대 작은 부탁이 아니지요. 이 속세의 정치에서 저를 두둔해 주신다면, 저 또한 앞으로 그대를 지지하겠습니다."
 pam_interactions_events.0033_donate: "저를 도와주셔서 제 봉역의 토지가 늘어날 수 있게 해 주신다면, 그대의 경건한 금고에 기꺼이 헌금하겠습니다."
 pam_interactions_events.0033_fallback: "신성한 중보자가 나서지 않는 한, 토지와 작위를 두고 벌이는 이 협상은 아무런 성과를 거두지 못할 것입니다. 그대의 신성한 권위로 제 대의를 위해 나서주시겠습니까?"
 pam_interactions_events.0033.aa: "좋소. 그렇게 하지."
 pam_interactions_events.0033.a: "[target.GetNameNoTierNoTooltip](은)는 내 칙령에 따라 [actor.GetFirstNamePossessiveNoTooltip] 것이 되어야 한다."
 pam_interactions_events.0033.a.tt: "[recipient.GetTitledFirstNameNoTooltip]에게 서신을 보낸다. 부당하게 획득한 토지를 계속 차지하고 있음은 [secondary_recipient.GetFaith.HighGodName](와)과 [secondary_recipient.GetTitleAsNameNoTooltip](을)를 욕보이는 일이니!"
 pam_interactions_events.0033.b: "이 무례한 요구는 승인할 수 없다."
 pam_interactions_events.0033.b.tt: "세계는 이미 질서가 잘 잡혀 있다. [recipient.GetTitledFirstNameNoTooltipRegnal](이)가 [target.GetNameNoTierNoTooltip](을)를 소유하는 게 맞다."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName](이)가 [recipient.GetShortUIName](을)를 설득하여 자신에게 [target.GetName](을)를 넘기게 하려고 시도하며, 실패할 수도 있음#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName](이)가 [recipient.GetShortUIName]에게 [target.GetName](을)를 자신에게 넘기라고 강요하지만, 실패의 위험을 감수해야 할 수도 있음#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName](이)가 저항 없이 [target.GetName](을)를 [actor.GetShortUIName]에게 넘길 것임#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold 당신의 [GetLaw('church_authority_3').GetName] [law|E] 덕분에 [recipient.GetShortUIName]에게 저항 없이 [target.GetName](을)를 [actor.GetShortUIName]에게 넘기라고 강요할 수 있음#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "신성한 중재자로서 협상을 시작하겠다."
 pam_interactions_events.0032_intro: "그대는 [target.GetNameNoTier](을)를 능숙하게 다스렸으나, [recipient.GetFaith.HighGodName]께서는 이 [target.GetTierAsNameNoTooltip](이)가 [actor.GetName]에게 속한다고 하신다. 유혈 사태를 일으키는 일 없이 토지를 [actor.GetHerHim]에게 양도해 줄 수 있겠는가?\n\n"
 pam_interactions_events.0032_de_jure: "[target.GetNameNoTierNoTooltip](은)는 [actor.GetHersHis] #EMP 규범상#! 권리이다."
 pam_interactions_events.0032_claim: "전능하신 신이 보시기에는 [actor.GetHerHis] [target.GetNameNoTierNoTooltip]에 대한 명분이야말로 진정한 권리이다."
 pam_interactions_events.0032.aa: "내 펜이 어디 있더라..."
 pam_interactions_events.0032.aa.flavor: "전 세계에 알리노니, [recipient.GetFaith.HighGodName]께서 이 죄 많은 사기꾼에게 [recipient.GetFaith.GetAdjectiveNoTooltip]의 모든 미덕을 내리기를 거부하셨다. 이자가 보유하고 있으며, 또 앞으로 보유할 모든 것은 뻔뻔한 만용에 지나지 않는다."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP [target.GetName](을)를 획득하려던 [actor.GetShortUINamePossessive] 시도가 실패함#!#!#!"
 pam_interactions_events.0032.a: "[actor.GetFaith.HighGodName]께서 바라시는 일이라면 [target.GetNameNoTierNoTooltip](을)를 포기하겠다."
 pam_interactions_events.0032.b: "이건 아니다. 양쪽 모두의 말을 믿지 못하겠군."
 pam_interactions_events.0032.b.tt: "[actor.GetTitledFirstNameNoTooltip](와)과 [secondary_recipient.GetTitledFirstNameNoTooltip]만 조용히 시킬 수 있으면 좋으련만..."
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold 다음 중 하나의 방법으로 당신이 [actor.GetHerHis] [target.GetName] 압수를 승낙하도록 유도할 수 있음:#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "[target.GetNameNoTierNoTooltip] 협상"
 pam_interactions_events.0030.desc_intro_envoy: "신성한 땅에서 내 사절인 [secondary_recipient.GetTitledFirstNameRegnal](이)가 [target.GetNameNoTier]에 대한 내 주장을 펼쳤다."
 pam_interactions_events.0030.desc_intro: "[secondary_recipient.GetTitledFirstNameRegnal]의 축복과 신성한 땅의 보호에 힘입어 나는 [target.GetNameNoTier]에 대한 내 주장을 펼쳤다."
 pam_interactions_events.0030.desc: "평화로운 화합의 말은 전쟁에 대한 위협으로 장식되어 있었다. 내 타고난 권리를 향한 선언이었다. 말은 그렇게 계속 이어졌다...\n\n"
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed](은)는 [recipient.GetHerHis] [target.GetTierAsNameNoTooltip]에서 그렇게 쉽게 물러나지 않을 것이다. 이 토지 문제는 지상의 약속, 아니면 사악한 위협을 통해서든 반드시 마무리를 지어야 한다."
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed](은)는 [vassal.GetName](을)를 그렇게 쉽게 놓아 주지 않을 것이다. 황금빛 제안을 하든, 무시무시한 위협을 하든 내 봉신을 얻어내야만 한다."
 pam_interactions_events.0030.a: "[recipient.GetFirstNameNoTooltip]에게 일종의... 책무를 져야 한다는 사실을 상기시킨다."
 pam_interactions_events.0030.a.flavor: "그 책무는 바로 [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]의 [actor.GetTitleAsNameNoTooltip](이)가 시킬 수 있다는 사실도 함께 말이다!"
 pam_interactions_events.0030.b: "난 [ROOT.Char.Custom2('RelationToMe', recipient)] 따위는 필요 없다. [target.GetNameNoTierNoTooltip](이)가 필요하다고."
 pam_interactions_events.0030.b.flavor: "간단하게 정리한다. [recipient.GetFirstNameNoTooltip](이)가 이번 일을 거절한다면 [recipient.GetSheHe] 또한 나한테는 아무런 의미도 없게 된다."
 pam_interactions_events.0030.c: "[recipient.GetSheHe]가 뜻을 굽히지 않는다면 이 성지에 불명예를 안긴다."
 pam_interactions_events.0030.c.tt: "부정한 혐의를 저지른 더러운 죄인을 비난한다! 둘 모두에게 저주와 경멸이 뒤따르길! [secondary_recipient.GetTitledFirstNameNoTooltip](와)과 다른 모든 [actor.GetFaith.PriestNeuterPlural](이)가 [recipient.GetFirstNameNoTooltip](을)를 굴복시키리라!"
 pam_interactions_events.0030.d: "정당성을 박탈하는 추문으로 만들겠다며 위협한다."
 pam_interactions_events.0030.d.flavor: "자기 이름과 평판이 걸리게 된다면, 별로 존경받지 못하는 [recipient.GetTitleAsNameNoTooltip](은)는 오래 못 버틸 거다..."
 pam_interactions_events.0030.e: "그냥 [target.GetTierAsNameNoTooltip](을)를 사겠다고 제안한다."
 pam_interactions_events.0030.f: "이 사안은 [ROOT.Char.GetFaith.HighGodName](와)과 [recipient.GetFirstNamePossessiveNoTooltip] 판단에 맡기겠다."
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold 특별한 보상이 없다면 [recipient.GetShortUIName](이)가 승낙할 확률이 낮아짐!#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial 특별한 보상이 없다면 [recipient.GetShortUIName](이)가 승낙할 확률이 낮음#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "[target.GetNameNoTierNoTooltip] 논쟁"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal](은)는 [target.GetNameNoTier]에 대한 [actor.GetNamePossessive] 권리를 더 강하게 주장하며, [recipient.GetFaith.HighGodNamePossessive] 지상의 질서와 모든 [recipient.GetFaith.GetAdjective] 성직자를 위해서도 주장했다."
 pam_interactions_events.0034.desc_intro: "[actor.GetName](이)가 [target.GetNameNoTier]에 대한 자신의 권리를 주장했다. [actor.GetSheHe]는 [recipient.GetFaith.GetAdjective] 신앙의 보호와 지지를 받는 요구를 다시 반복했다."
 pam_interactions_events.0034.desc_vassal: "내가 [target.GetHolder.GetName]에게 죽을 때까지 충성을 맹세했다는 사실은 중요치 않다. 아무래도 그 충성은 흥정이 가능한 것 같으니까."
 pam_interactions_events.0034.desc_target: "내가 [target.GetTierAsNameNoTooltip](을)를 피와 정복으로 획득했다는 사실은 중요치 않다. 이 세상의 모든 것은 흥정이 가능한 모양이니까."
 pam_interactions_events.0034.desc: "\n\n성지에 다가간 나는 내 권리에 대한 공격을 평온하게 견뎌냈다. 이제 제시된 사안을 숙고하는 일만 남았다...\n\n"
 pam_interactions_events.0034.desc_method_hook: "[actor.GetTitledFirstNameNoTooltip](이)가 내게 지도록 만든 책무가 무효가 될 것이라는 약속이다."
 pam_interactions_events.0034.desc_method_relation: "우리 사이의 모든 온기와 신뢰, 사랑은 파국을 맞이했다. [actor.GetFirstNameNoTooltip]에 따르면 [actor.GetHerHim|U]의 마음은 이 토지 문제에 쏠린 것 같다.\n\n내가 이 요구를 거부하면 [actor.GetSheHe|U]는 영원히 나를 증오할 것이다."
 pam_interactions_events.0034.desc_method_piety: "안 그래도 위태로웠던 나와 신앙과의 연결이 완전히 무너질 위기에 처했다. 이번 일로 인해 [actor.GetTitledFirstNameNoTooltip] 또한 의문을 품겠지만, [actor.GetHerHis] 신앙심은 나보다 더 든든한 편이다."
 pam_interactions_events.0034.desc_method_legitimacy: "내 정통성을 향한 심각한 위협이 가해졌다. [target.GetNameNoTierNoTooltip](을)를 둘러싼 추악한 다툼이 공공연히 벌어진다면, 이는 우리 둘 모두를 웃음거리로 만드는 추문이 된다..."
 pam_interactions_events.0034.desc_method_gold: "반짝이는 금화 더미가 제시되었다. [actor.GetTitleAsNameNoTooltip](은)는 이 정도면 [target.GetTierAsNameNoTooltip]에 적절한 가격이라고 주장한다."
 pam_interactions_events.0034.desc_no_method: "...#EMP 아무것도 없다#!. 이는 단순히 [target.GetNameNoTier](을)를 바라는 요구였는데, 내가 [recipient.GetFaith.PriestNeuterPlural]들의 경멸과 전쟁을 두려워할 것이라고 짐작한 것 같았다."
 pam_interactions_events.0034.a: "[actor.GetSheHe|U]는 [target.GetNameNoTierNoTooltip]에서 자기 깃발을 올려도 좋다."
 pam_interactions_events.0034.b: "내가 살아있는 한 [target.GetTierAsNameNoTooltip](은)는 내 것이다."
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip] 획득"
 pam_interactions_events.0035.desc_intro: "숙고 끝에 [recipient.GetFirstNameNicknamed](이)가 결국 포기했다! [target.GetNameNoTier]의 양도를 위한 협상은 신속했고, 좋은 결과를 볼 수 있었다.\n\n내 권리를 옹호하는 [secondary_recipient.GetTitledFirstNamePossessive] 칙령이 이행되었다."
 pam_interactions_events.0035.desc_hook: "내가 [recipient.GetFirstNameNoTooltip]에 대해 지녔던 책무는 훌륭히 수행되었다."
 pam_interactions_events.0035.desc_relation: "씁쓸한 눈물을 쏟았고, 기쁨과 존경도 다 끝났다. 나는 [target.GetNameNoTierNoTooltip](을)를 원한다는 이유로 [recipient.GetFirstNameNoTooltip](을)를 큰 곤경에 빠뜨렸다. 하지만..."
 pam_interactions_events.0035.desc_piety: "그러므로 [recipient.GetFirstNameNoTooltip](와)과 나 모두에게 불명예를 안기겠다는 내 사악한 위협은... 실현될 필요가 없게 되었다."
 pam_interactions_events.0035.desc_legitimacy: "그러므로 논란과 비방을 불러일으키겠다는 내 위협은... 실현될 필요가 없게 되었다."
 pam_interactions_events.0035.desc_gold: "내 자금 관리자와 채권자들에게 소식을 알렸으니, 이 값을 기쁘게 치르리라."
 pam_interactions_events.0035.desc_fallback: "[actor.GetFaith.HighGodName]께서 우리 [actor.GetFaith.GetAdjective] [actor.GetFaith.PriestNeuterPlural]들과 나한테 강력한 힘을 부여하셨다! 군대나 전쟁을 들먹일 필요도 없이, 이 세계의 질서는 우리의 뜻에 따라 다시 세워졌다."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName](은)는 내게 충성을 맹세해야 한다."
 pam_interactions_events.0035.desc: "\n\n[target.GetTierAsNameNoTooltip](은)는 내 것이다."
 pam_interactions_events.0035.a: "[target.GetNameNoTierNoTooltip] 전역에 내 깃발을 높이 올려라!"
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip] 거절"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.GetTitledFirstName](은)는 용맹한 병사들의 경호를 받으며 답했다. [secondary_recipient.GetTitledFirstNamePossessive] 평화로운 중재가 있음에도 마음이 편치 않아 보였다.\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.GetTitledFirstName](은)는 굳센 [recipient.Custom('KnightCulturePluralNoTooltip')|l]들의 경호를 받으며 답했다. [secondary_recipient.GetTitledFirstNamePossessive] 평화로운 중재가 있음에도 마음이 편치 않아 보였다.\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.GetTitledFirstName](은)는 홀로 당당하게 답했다. [secondary_recipient.GetTitledFirstNamePossessive] 평화로운 중재 덕분에 대담해진 태도였다.\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.GetTitledFirstName](은)는 경호원들에게 둘러싸인 채 답했다. [secondary_recipient.GetTitledFirstNamePossessive] 평화로운 중재를 경멸하는 태도였다.\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.GetTitledFirstName](은)는 굳센 [recipient.Custom('KnightCulturePluralNoTooltip')|l]들에게 둘러싸인 채 답했다. [secondary_recipient.GetTitledFirstNamePossessive] 평화로운 중재를 경멸하는 태도였다.\n\n"
 pam_interactions_events.0036.desc_hook: "\"나에게 있어 [target.GetNameNoTierPossessive] 위치는 그대가 요구할 수 있는 그 어떤 책무보다도 중요합니다."
 pam_interactions_events.0036.desc_relation: "\"[actor.GetPrimaryTitle.GetNameNoTier]의 [actor.GetTitleAsName](이)가 제 진심에 침을 뱉는군요. 제 영혼은 갈기갈기 찢겼습니다. [actor.GetHerHim]의 말은 더 이상 듣지 않겠습니다.\""
 pam_interactions_events.0036.desc_piety: "\"[target.GetNameNoTier](을)를 얻지 못한다면 그대와 나 모두를 죄악과 비난으로 끌어내릴 생각이라는 겁니까? 좋습니다."
 pam_interactions_events.0036.desc_legitimacy: "\"어디 표독한 거짓말을 계속해 보시지요. [target.GetNameNoTier]의 백성은 물론 다른 모든 이들까지 우리의 적으로 돌려 보시란 말입니다."
 pam_interactions_events.0036.desc_gold: "\"[target.GetNameNoTier](을)를 금과 은으로 살 수 있다고 생각하십니까? 이런 고귀한 [target.GetTierAsNameNoTooltip]에 비해 너무 단순한 값을 치르려 하시는 것 같군요."
 pam_interactions_events.0036.desc_fallback: "\"[actor.GetTitleAsName](와)과 [secondary_recipient.GetTitleAsNameNoTooltip](이)가 [target.GetNameNoTier](을)를 고작 말 몇 마디로 얻어낼 수 있을까요...? 어림도 없지요.\""
 pam_interactions_events.0036.desc_afraid: "[recipient.GetFaith.PriestNeuterPlural]들을 보내면 제가 환영할 것이고, 사절단을 보내면 그들과 협상하겠습니다...\"\n\n\"하지만 [target.GetTierAsNameNoTooltip](을)를 이런 식으로 넘길 생각은 없습니다.\""
 pam_interactions_events.0036.desc_pious: "타락한 [recipient.GetFaith.PriestNeuterPlural]들, 무장한 악마 무리를 [target_capital.GetTitle.GetNameNoTier](으)로 얼마든지 보내 보십시오...\"\n\n\"그래도 [recipient.GetFaith.HighGodName]께서 제게 주신 [target.GetTierAsNameNoTooltip](은)는 절대 포기 못 합니다.\""
 pam_interactions_events.0036.desc: "소리나 지르는 [recipient.GetFaith.PriestNeuterPlural]들, 무장한 [actor.Custom('GetFighterTermPlural')] 무리를 [target_capital.GetTitle.GetNameNoTier](으)로 얼마든지 보내 보십시오...\"\n\n\"[target.GetTierAsNameNoTooltip](을)를 그렇게 쉽게 내줄 생각은 없습니다.\""
 pam_interactions_events.0036.a_relation: "감히 내 요구를 거절하다니?!"
 pam_interactions_events.0036.a: "[secondary_recipient.GetTitleAsNameNoTooltip]의 뜻을 거부한다고? 망신스럽군..."
 clergy_land_transfer_refusal_tt: "[actor.GetShortUIName]에게 [target.GetName](을)를 양도하기를 거부함"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetPrimaryTitle.GetNameNoTier]의 [ROOT.Char.GetTitleAsNameNoTooltip]인 [ROOT.Char.GetFirstNameNicknamed],"
 pam_interactions_events.0037.desc: "상황이 이리도 갑작스럽게 흘러가서 유감이지만, 꼭 알려야 할 일이 있소. 앞으로는 [actor.GetPrimaryTitle.GetNameNoTier]의 [actor.GetTitleAsName](이)가 그대의 주군이라오.\n\n그것이 [actor.GetTitledFirstNameNicknamed](와)과 내가 그대의 [ROOT.Char.GetPrimaryTitle.GetTierAsName](을)를 두고 벌인 협상을 중재한 [secondary_recipient.GetTitledFirstNameRegnal]의 뜻이니. 그대는 지금까지 [recipient.GetPrimaryTitle.GetNameNoTier](을)를 진심으로 섬겨왔으니, 새로운 주군에게도 그리하기를 바라오."
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName](이)가 당신의 [liege|E]이 됨"
 pam_interactions_events.0037.a: "내 맹세는 이제 효력을 잃었다. 앞으로는 그 누구도 내게 명령할 수 없다."
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip](이)가 자신의 종주권을 양도했다. [actor.GetTitledFirstNameNoTooltip](이)가 이를 얻고자 한다면... 단단히 무장한 채로 [target.GetNameNoTierNoTooltip]에 와야 할 것이다."
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? 진심인가?"
 pam_interactions_events.0037.b.tt: "한때 내 백성은 [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip](을)를 우러러보았지만, 이제는 [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip](을)를 봐야 하겠군."
