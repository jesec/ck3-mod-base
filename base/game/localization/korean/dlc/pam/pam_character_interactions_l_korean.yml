 JUSTIFY_DIVORCE_INTERACTION_OPTION: "종교법에 따라 정당화"
 divorce_justified_tt: "다음 중 하나를 달성:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](이)가 당신을 살해하려 했음\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](이)가 [GetTrait('adulterer').GetName( secondary_recipient )]임\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]의 [fertility|E]이 매우 낮으며 당신의 결혼이 아이를 갖지 못함\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINamePossessive] [faith|E]이 [faith_hostile|E] 또는 [faith_evil|E] 신앙임\n$EFFECT_LIST_BULLET$일부다처제 금지에도 불구하고 [secondary_recipient.GetShortUIName](이)가 여러 명의 [spouses|E]를 보유함\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](이)가 성불구임\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]에게 [incestuous|E] 연인이 있음\n$EFFECT_LIST_BULLET$당신과 [secondary_recipient.GetShortUIName]의 결혼이 [incestuous|E]임\n$EFFECT_LIST_BULLET$당신과 [secondary_recipient.GetShortUIName]의 결혼이 동성 간에 이루어졌으나, 동성 결혼이 금지되어 있음"
 divorce_justified_secondary_tt: "다음 중 하나를 달성:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](이)가 [secondary_actor.GetShortUIName](을)를 살해하려 했음\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](이)가 [GetTrait('adulterer').GetName( secondary_recipient )]임\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]의 [fertility|E]이 매우 낮으며 저들의 결혼이 아이를 갖지 못함\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUINamePossessive] [faith|E]이 [faith_hostile|E] 또는 [faith_evil|E] 신앙임\n$EFFECT_LIST_BULLET$일부다처제 금지에도 불구하고 [secondary_recipient.GetShortUIName](이)가 여러 명의 [spouses|E]를 보유함\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](이)가 성불구임\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName]에게 [incestuous|E] 연인이 있음\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](와)과 [secondary_actor.GetShortUINamePossessive|U] 결혼이 [incestuous|E]임\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName](와)과 [secondary_actor.GetShortUINamePossessive|U] 결혼이 동성 간에 이루어졌으나, 동성 결혼이 금지되어 있음"
