 request_court_chaplain_cardinalate_interaction_desc: "[actor.GetCouncillor( 'councillor_court_chaplain' ).GetCouncilTitleFirstName](을)를 [college_of_cardinals|E]에 들이도록 당신의 [head_of_faith|E]에게 탄원합니다. 오직 [cardinal|E]만이 다음 [head_of_faith|E]로 선출될 수 있으며, 당신 덕분에 붉은 모자를 쓰게 된 [cardinal|E]은 곁에 둘 가치가 있습니다.\n\n#italic [actor.GetCouncillor( 'councillor_court_chaplain' ).GetSheHe|U]는 자신의 [cardinalate|E]을 보유하고, 당신의 [council|E]에서 [actor.GetCouncillor( 'councillor_court_chaplain' ).GetHerHis] 자리를 포기하며, 당신에게 다른 [external_clerical_puppet|E]가 없다면 그 자리를 차지하게 됩니다.#!"
