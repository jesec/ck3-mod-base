 pam_interactions_events.0091.opening: "후원자님,"
 pam_interactions_events.0091.desc_hook_theocrat: "당신의 중재로 큰 은혜를 입었습니다. 한 손에는 목자의 지팡이를 들고, 다른 손은 [recipient.GetFaith.HighGodName]께서 굳게 붙잡아 주십니다. 저는 그분의 충실한 종이니 마땅히 그러해야 합니다! [target.GetNameNoTier](은)는 위대한 선물이며, 저는 그 은혜를 입은 자입니다.\n\n온 세상에 알리십시오. [ROOT.Char.GetTitledFirstNameRegnal]의 뜻에 따라 이 [target.GetTierAsName](은)는 성직자의 것이 되었습니다!"
 pam_interactions_events.0091.desc_hook: "당신의 중재로 저는 큰 은혜를 입었습니다. 한 손에는 통치의 홀을 들고, 다른 손은 [recipient.GetFaith.HighGodName]께서 굳게 붙잡아 주십니다. 마땅히 그러해야 합니다. [target.GetNameNoTier](은)는 위대한 선물이며, 저는 그 은혜를 입은 자입니다.\n\n온 세상에 알리십시오. [ROOT.Char.GetTitledFirstNameRegnal]의 뜻에 따라 [target.GetTierAsName](은)는 저의 것이 되었습니다!"
 pam_interactions_events.0091.desc: "당신의 중재는 제가 상상했던 것 이상의 축복이었습니다. 거룩한 신의 손길은 멀리까지 미치며, 또한 자애롭습니다. [recipient.GetFaith.HighGodName]께 감사드립니다!\n\n[target.GetName](은)는 고귀한 땅입니다. 저는 그 작위를 이어받아 그곳의 [recipient.GetFaith.GetAdherentNamePlural]들을 겸손과 자비로 다스리겠습니다."
 pam_interactions_events.0091.a: "[target.GetNameNoTierNoTooltip](을)를 예의주시하겠다."
 pam_interactions_events.0092.opening_theocratic: "경건한 [ROOT.Char.GetFaith.PriestNeuter],"
 pam_interactions_events.0092.opening: "나의 [ROOT.Char.Custom('GetTitleTierAdjective')] 아이야,"
 pam_interactions_events.0092.desc_hook: "[recipient.GetFaith.HighGodName](와)과 그분의 고위 성직자들이 그대에게 베푼 이 위대한 선물을 위해 기도하면서, 그대가 이 [target.GetTierAsName]에 얼마나 걸맞은 사람인지 깊이 되새겨 보아라. 어쩌면 그대를 위해 더 올려야 할 경건한 기도가 남아 있을지도 모르겠군.\n\n이 일에서는 조언을 아끼지 않겠다. 그대의 [target.GetNameNoTierNoTooltip] 통치가 [recipient.GetFaith.HighGodName]께 기쁨과 섬김이 되어야 할 것이다."
 pam_interactions_events.0092.desc: "그대의 [target.GetTierAsNameNoTooltip](이)가 선포되었다!\n\n나의 기도가 그대를 이끌었으며, 나는 그대의 출세를 각별히 보살펴 왔다. 오직 그대가 훌륭히 통치하여, 그 치세가 [target.GetNameNoTier]의 [recipient.GetFaith.GetAdherentNamePlural]들에게 축복이 되기만을 바랄 뿐이다."
 pam_interactions_events.0092.a: "[recipient.GetFaith.PositiveAfterLife]에서 직접 내려온 하명이다!"
