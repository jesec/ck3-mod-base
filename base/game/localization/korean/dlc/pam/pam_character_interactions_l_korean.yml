 pam_forced_negotiate_land_legitimacy_level_1_tt: "[actor.GetShortUIName](은)는 #N 100#!, [recipient.GetShortUIName](은)는 #N 200#!의 @legitimacy_icon![legitimacy|E]을 잃게 함"
 pam_forced_negotiate_land_legitimacy_level_2_tt: "[actor.GetShortUIName](은)는 #N 200#!의 @legitimacy_icon![legitimacy|E]을 잃고 [recipient.GetShortUIName](은)는 #N 1#!의 @legitimacy_icon![legitimacy_level|E]를 잃게 함"
