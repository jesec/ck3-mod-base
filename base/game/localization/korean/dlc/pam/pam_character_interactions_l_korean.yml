 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName], 부당하게 박탈당한 [actor.GetTitledFirstNameNoTooltip](이)여!"
 pam_interactions_events.0020_threatened: "내 [secondary_recipient.GetFaith.GetReligion.GetAdjective] [secondary_recipient.GetFaith.HouseOfWorshipPlural]들에게 가하는 가혹한 책무와 부정한 질책, 사악한 힘을 멈춰주시오! 그대의 무시무시한 결의가 곧 필요할 날이 올 것이니. [target.GetNameNoTier]의 명분은 그대 것이오."
 pam_interactions_events.0020_offer_hook: "[secondary_recipient.GetPrimaryTitle.GetNameNoTier]에 호의를 보이겠다는 그대 약속이 내 마음을 움직였으니, 나 또한 오래도록 무시되어 왔던 그대의 권위를 찾아냈소. [target.GetNameNoTier]의 명분은 그대 것이오!"
 pam_interactions_events.0020_indebted: "이 보잘것없는 [secondary_recipient.GetFaith.PriestNeuter](은)는 그대에게 빚을 졌으니, 내가 틀림없는 증거를 찾아 나섰으며 결국 찾아내고 말았소. [target.GetNameNoTier](은)는 정당한 그대의 소유이며, 지금까지 그 권리가 부정당해 왔던 것이오!"
 pam_interactions_events.0020: "[target.GetNameNoTier]의 대한 그대의 명분은 정당하오. 이는 신의 섭리를 따라 오래전부터 전해져 온 권리이니! 이 사실을 입증하는 증거 또한 그대의 자문회에 제출했소."
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal](은)는 이 폭로가 그리 기쁘지 않겠지. 하지만 [secondary_recipient.GetFaith.FateGodName]께서는 사기꾼의 항의에 귀를 기울이지 않으신다."
 pam_interactions_events.0020.a.low_zeal: "이렇게 역사가 다시 쓰이는군..."
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip](은)는 내 것이며, 이는 신성한 권리다!"
 pam_interactions_events.0020.a: "내 명분이 생겼으니, [recipient.GetTitledFirstNameNoTooltip]도 끝이다."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName](이)가 [target.GetNameNoTier]에 대한 명분을 [puppet_or_actor.GetShortUIName]에게 부여함"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName],"
 pam_interactions_events.0021: "그대가 [target.GetNameNoTier](을)를 다스릴 운명이었다면 [secondary_recipient.GetFaith.HighGodName]께서 그대에게 이를 이미 타고난 권리로 쥐여 주셨을 것 아니오?\n\n난 그대의 사악한 대의를 위해 거짓을 쓰면서 [recipient.GetTitledFirstNameRegnal](을)를 모욕하고 그대와 나 모두의 영혼을 배반할 생각이 없소.\n\n그대의 방식이 잘못되었다는 것을 알고 기도하기를."
 pam_interactions_events.0021.a: "[secondary_recipient.GetFaith.HouseOfWorship|U]의 벽이 [secondary_recipient.GetHerHim]에게 어리석은 용기를 불어넣었군!"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName](이)가 [target.GetNameNoTier]에 대한 [puppet_or_actor.GetShortUINamePossessive] 명분 요청을 거부함"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "내 태생의 권리를 소유한 자에게,"
 pam_interactions_events.0022_shrimp: "나는 그저 [actor.GetTitleAsName]에 불과하지만, [actor.GetFaith.GetAdjective] [secondary_recipient.GetFaith.AltPriestTermPlural]들이 오래전부터 내 혈통이 [target.GetName] 전역에 대한 명분을 보유하고 있었다는 사실을 알아냈소."
 pam_interactions_events.0022_shark: "[target.GetName](은)는 [actor.GetFaith.HighGodName]에게서 내 [actor.Custom('GetTitleTierAdjective')] 혈통으로 전해진 작위 중 하나요. 이는 언제나 자명한 사실이었으나, 지금까지는 알려지지 않았지."
 pam_interactions_events.0022: "[target.GetName](은)는 마땅히 내 것이 되어야 하오. 이는 학식 있는 학자들 사이에서는 이미 알려져 있던 사실이며, 이번에 새롭게 증명되기까지 했소."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal](이)가 내 명분에 신성한 인가를 내려 주었다. [secondary_recipient.GetPrimaryTitle.GetName](은)는 나를 전폭적으로 지지한다.\n\n그렇게 나는 희망을 품었고, 기도하기 시작했다. 언젠가는 내가 [target.GetNameNoTierNoTooltip]의 주인으로 환영받는 날이 오기를..."
 pam_interactions_events.0022.a: "거짓이다! 가짜 [secondary_recipient.GetFaith.PriestNeuter](을)를 등에 업은 가짜 명분이다!"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "거룩하신 [secondary_recipient.GetMotherFather],"
 pam_interactions_events.0023_shrimp: "제가 정당한 명분을 갖췄다면 [target.GetName](을)를 [actor.Custom2('InsultAdjective', recipient)] [recipient.GetFirstNameRegnal]보다 더 훌륭하게 다스렸을 겁니다. 간청을 드리니, 이 보잘것없는 [actor.GetTitleAsName]도 [actor.GetFaith.HighGodNamePossessive] 빛을 볼 수 있게 해 주십시오."
 pam_interactions_events.0023_shark: "[actor.GetFaith.HighGodNamePossessive] 뜻으로 저는 이미 여러 땅과 백성의 주인이자 보호자입니다. 그러나 [target.GetName](은)는 제 봉역과 권리 밖에 있군요."
 pam_interactions_events.0023: "신도들 사이에 혼란이 일고 있습니다. 어떤 이들은 제가 [target.GetName](을)를 소유하기를 간절히 바라는 한편, 다른 이들은 제가 그 작위에 대한 권리를 지녔다는 사실을 부정하지요."
 pam_interactions_events.0023_end: "\n\n그대처럼 학식이 있으신 분이라면 분명 역사 속에서 필요한 증거를 #EMP 발견할#! 수 있을 터... 그러면 [target.GetNameNoTierNoTooltip]에 대한 명분을 승인해 저를 지지해 주실 수도 있지 않겠습니까?"
 pam_interactions_events.0023.a: "[actor.Custom('GetDaughterSon')]아, [target.GetNameNoTierNoTooltip](은)는 네 것이다."
 pam_interactions_events.0023.b: "[secondary_recipient.GetTitleAsNameNoTooltip](을)를 거짓으로 거래해서는 안 된다."
