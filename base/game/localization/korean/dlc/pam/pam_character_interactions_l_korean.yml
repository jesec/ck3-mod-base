 pam_interactions_events.0097.opening: "나의 [ROOT.Char.Custom('GetTitleTierAdjective')] 아이에게,"
 pam_interactions_events.0097.desc: "그대의 탄원을 받아들였소. [target.GetName](은)는 비어 있었으며 그 [ROOT.Char.GetFaith.GetAdherentName]의 영혼을 이끌 목자는 없으니, 이대로라면 [ROOT.Char.GetFaith.HighGodName](을)를 기릴 수 없소.\n\n겸허한 마음으로 받아들이시오. 교회에서 부여한 [title|E]는 교회에서 기억할 것이니."
 pam_interactions_events.0097.desc_holy_war: "그대의 탄원을 받아들였소. 그대의 맹세는 잊히지 않게 기록될 것이오. [target.GetName](은)는 그대의 것이나, 그 일부는 여전히 [ROOT.Char.GetFaith.HighGodName](을)를 부정하는 이들에게 굴복하고 있소.\n\n나아가 그대의 작위에 따라 마땅히 그대의 것이 되어야 하는 땅을 되찾으시오. 독실한 [ROOT.Char.GetFaith.PriestNeuter](이)라면 그대의 전쟁에 의문을 품지 않을 것이나, 지금부터 5년 뒤에 우리는 그 결과를 물을 것이고, 지키지 않고 내버려둔 맹세는 깨진 맹세나 다름없다는 점을 기억하시오."
