 pam_interactions_events.0090.desc: "참으로 [recipient.GetFaith.HighGodName]께서 자애로운 은총으로 [recipient.GetPrimaryTitle.GetNameNoTier] 땅을 굽어살피십니다! 당신의 선포로 저는 이 땅의 [recipient.GetTitleAsName](이)가 되었고, [recipient.GetFaith.GetAdjective] 신도들은 기쁨에 넘칩니다.\n\n제 목숨으로 이 [recipient.GetPrimaryTitle.GetTierAsName](을)를 지키겠습니다. 제 법으로 현명하게 다스리겠습니다. 제 왕홀과 검으로 굳건히 통치하겠습니다. 또한 당신의 조언을 충실히 따르겠습니다."
