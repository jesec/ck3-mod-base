 pam_interactions_events.0039.desc: "상황이 이리도 갑작스럽게 흘러가서 유감이지만, 꼭 알려야 할 일이 있소. [target.GetName](을)를 [actor.GetPrimaryTitle.GetNameNoTier]의 [actor.GetTitleAsName]에게 넘기려 하오.\n\n그것이 [actor.GetTitledFirstNameNicknamed](와)과 내가 그대의 [ROOT.Char.GetPrimaryTitle.GetTierAsName](을)를 두고 벌인 협상을 중재한 [secondary_recipient.GetTitledFirstNameRegnal]의 뜻이니. [recipient.GetCapitalLocation.GetTitle.GetNameNoTier](으)로 돌아가면 재임명받게 될 것이오."
