 pam_interactions_events.0101.desc: "기쁜 소식을 전하게 되어 기쁘오. 나는 [ROOT.Char.GetFaith.HighGodName] 앞에서 그대의 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstNameNoTooltip](을)를 적자로 인정했소.\n\n이제는 법으로도 세간의 말로도 출생을 문제 삼아 [recipient.GetHerHim]에게 허물을 돌릴 수 없을 것이오."
