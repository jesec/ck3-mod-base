 ecclesiastical_de_jure_shifting_grant_interaction_notification: "[puppet_or_actor.GetMotherFather]가 사랑하는 자식을 돌보듯, [puppet_or_actor.GetPrimaryTitle.GetName](은)는 [target.GetName](을)를 영원토록 보살피고 지켜 주길 바라오. 이 유대를 법으로 정하고 신성한 유대로 삼고자 하오."
 pam_interactions_events.0096.opening: "[ROOT.Char.GetFaith.random_GoodGodNames]의 손길은 참으로 지혜롭구나!"
 pam_interactions_events.0096.desc: "[target.GetNameNoTier](을)를 [former_de_jure_liege.GetNameNoTier]에서 떼어 낸 것은 참으로 현명하고 축복받은 일이다!\n\n그대가 선포한 대로 이루어지리니, [de_jure_master.GetPrimaryTitle.GetNameNoTier](은)는 영원토록 이 [target.GetTierAsNameNoTooltip](와)과 [ROOT.Char.GetFaith.PositiveAfterLife] 사이에서 든든한 버팀목이 되어, 독실한 [target.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNamePlural]들이 언제까지나 [ROOT.Char.GetFaith.HighGodNamePossessive] 빛으로 인도받도록 할 것이다.\n\n나의 신성한 [de_jure_master.Custom('GetTitleTierAdjective')] 맹세에도 이 뜻을 담겠다."
 pam_interactions_events.0096.a: "부디 원만한 결합이 되기를."
