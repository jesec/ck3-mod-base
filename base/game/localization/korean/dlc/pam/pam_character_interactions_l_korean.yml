 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal],"
 pam_interactions_events.0050.desc: "[puppet_or_actor.GetFaith.ReligiousText]에서 결혼은 신성한 결합이라 하였소. 남자와 여자가 함께 살아가는 세상에서는... 완벽한 경우가 잘 없는 법.\n\n그대는 [secondary_recipient.GetTitledFirstName](와)과 내가 갈라서는 일을 거부하였소. 이제 엉망이 된 상황을 어떻게 해야 좋을지..?"
 pam_interactions_events.0050.aa: "그대를 괴롭게 하는 것은 육체적인 욕망이오."
 pam_interactions_events.0050.aa.tt: "이 사랑도 모르는 작자한테 육신의 모든 욕구와 기대를 저버려야 한다는 사실을 가르쳐 준다..."
 pam_interactions_events.0050.a: "[recipient.GetFaith.PositiveAfterLife](으)로 향하는 길이란? 사랑과 헌신이오."
 pam_interactions_events.0050.a.tt: "내 인도를 따라, 이 갈라지기 직전의 부부는 서로에게서 구원을 찾을 수도 있음."
 pam_interactions_events.0050.b: "[recipient.GetFaith.GoodGodNames] 앞에서 했던 서약을 명예롭게 기리시오."
 pam_interactions_events.0050.c: "신성한 결혼을 거부하다니, 신성모독이다!"
 pam_interactions_events.0050.d: "다 함께 [recipient.GetFaith.HighGodNamePossessive] 인도를 빌며 기도합시다."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\n이는 근친상간의 결합이며, 부자연스러운 관계이므로 그대가 끝을 내야 하오!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\n[puppet_or_actor.GetFaith.GetAdjective] 믿음에 따르면 이 [secondary_recipient.GetWomanMan]을 내 침대에서 끌어내야 하오!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\n[secondary_recipient.GetFirstNameNoTooltip](이)가 가련하게도 성불구자라는 비난을 받고 있음을 알아 두시길 바라오..."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip](은)는 우리와 결합을 무시하며, 공공연하게 사특한 근친상간을 저질렀소. 이는 수치 그 자체요!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip](은)는 내게 충실하지 못했고, 모두가 그 사실을 알고 있소!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\n[puppet_or_actor.GetFaith.HighGodName]께서는 내가 남성과 맺어지길 바라셨소! 그런데 [secondary_recipient.GetFirstNameNoTooltip](은)는... 남자다움이 전혀 없단 말이오."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\n[puppet_or_actor.GetFaith.HighGodName]께 맹세하는데, 내 [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))](이)가 날 살해하려 했단 말이오!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip](은)는 배우자를 여럿 두는 사람이오! 나는 그저 [secondary_recipient.GetHerHis] 유목 집단에 속한 한 명일 뿐이오. 이 관계에서 나를 해방해 주시오!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\n설마 [puppet_or_actor.GetFaith.HighGodName]께서 내가 사악한 [secondary_recipient.GetFaith.GetAdjective] 이교도하고 계속 한 침대를 쓰길 바라시겠소?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\n내가 이를 간청하는 이유는 누구나 다 알고 있소! [secondary_recipient.GetFirstNameNoTooltip], 그 호색한 [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))](은)는 나한테 전혀 충실하지 못했소."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\n우리의 결혼에는 아이가 없으며, 앞으로도 결실을 볼 희망이 없소."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\n어떻게든 이를 정당화할 이유를 만들어 주시오! 하지만 [puppet_or_actor.GetFaith.HighGodName]께 맹세코, [secondary_recipient.GetFirstNameNoTooltip]에 대한 내 증오만으로도 충분한 이유가 되고도 남을 것이오."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\n법적으로 타당한 근거는 없지만... 종교법에 통달한 그대라면 이 결혼을 충분히 무효로 할 근거를 #EMP 발견할#! 수 있으리라 믿소."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\n이는 근친상간의 결합이며, 부자연스러운 관계이므로 그대가 끝을 내야 하오!"
