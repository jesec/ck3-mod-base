 recipient_must_be_clerical_superior_tt: "[recipient.GetShortUIName](이)가 당신의 [vassal|E], [superior|E] 또는 그 이상이어야 함"
 secondary_recipient_must_have_superior_tt: "[secondary_recipient.GetShortUIName|U](이)가 [superior|E] 또는 [ecclesiastical|E]나 [theocratic|E] [liege|E]의 아랫사람이어야 함"
 target_char_must_be_clerical_subordinate_tt: "[ecclesiastical|E] 또는 [theocratic|E] [ruler|E]로서 [target_char.GetShortUIName](은)는 [excommunicator.GetShortUINamePossessive] [vassal|E], [subordinate|E] 또는 그 아래여야 함"
 bishop_excommunication_target_secular_tt: "[target_char.GetShortUIName|U](이)가 다음 중 하나에 해당해야 함\n$EFFECT_LIST_BULLET$[excommunicator.GetShortUINamePossessive] [vassal|E] 또는 그 이하\n$EFFECT_LIST_BULLET$이웃한 [ruler|E]거나 [excommunicator.GetShortUINamePossessive] [clerical_region|E]에 기반을 보유함\n$EFFECT_LIST_BULLET$[excommunicator.GetShortUINamePossessive] [subordinate|E] 또는 그 이하의 [court_chaplain|E] 보유\n$EFFECT_LIST_BULLET$[excommunicator.GetShortUIName](을)를 [court_chaplain|E]로 두어야 하며, [excommunicator.GetShortUIName]에게 [superior|E]이 없어야 함\n$EFFECT_LIST_BULLET$[liege|E] 또는 그 이상의 인물이 [excommunicator.GetShortUIName](을)를 [court_chaplain|E]로 두고 있음"
 bishop_excommunication_target_courtier_tt: "[target_char.GetShortUINamePossessive|U] [liege|E]이 [excommunicator.GetShortUIName], [excommunicator.GetShortUINamePossessive] [vassal|E] 또는 그 이하의 인물이거나 이웃한 [ruler|E] 또는 [excommunicator.GetShortUINamePossessive] [clerical_region|E]에 기반을 보유해야 함"
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U](이)가 [excommunicator.GetShortUINamePossessive] [realm|E], 이웃한 [Concept( 'county', '영지' )|E], 또는 [excommunicator.GetShortUINamePossessive] [clerical_region|E] 내에 위치해야 함"
 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U](이)가 [secondary_recipient.GetShortUIName](을)를 직접 [excommunicate|E]할 수 있음"
 no_valid_excommunicator_tt: "당신의 [faith|E]에 [theocratic|E] [head_of_faith|E]가 없으므로, [secondary_recipient.GetShortUIName](은)는 다음 중 하나에 해당하는 강력한 [ecclesiastical|E] [ruler|E]에 의해서만 [excommunicated|E]될 수 있음\n$EFFECT_LIST_BULLET$[secondary_recipient.GetHerHis] [liege|E] 또는 그 이상\n$EFFECT_LIST_BULLET$이웃한 [ruler|E]거나, [secondary_recipient.GetHerHis] [realm_capital|E]가 해당 인물의 [clerical_region|E]에 있음\n$EFFECT_LIST_BULLET$[superior|E]이거나 [secondary_recipient.GetHerHis] [court_chaplain|E] 이상\n$EFFECT_LIST_BULLET$[secondary_recipient.GetHerHis] [court_chaplain|E]이며 [superior|E]이 없음"
 excommunicator_must_be_hof_tt: "[head_of_faith|E]만 [target_char.GetName](을)를 [excommunicate|E]할 수 있음"
 pam_interactions_events.0072.opening: "불쾌한 [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)],"
 pam_interactions_events.0072.desc_joined_war: "내가 지금 그대에게로 가겠소. 그 어둠에 빛을 드리울 전도사이자, 처벌을 내릴 [puppet_or_actor.GetMotherFather]가 되어 가겠소.\n\n그대의 [puppet_or_actor.Custom('MotherFatherPossessive')] 곁에는 [puppet_or_actor.GetFaith.GoodGodNames]의 전사인 [secondary_recipient.GetName](이)가 함께하오. [secondary_recipient.GetHerHis|U] 군대가 [target.GetNameNoTier](을)를 악에서 해방할 거요."
 pam_interactions_events.0072.desc: "이미 늦었소. 뉘우칠 길은 없소.\n\n사악한 [recipient.GetPrimaryTitle.GetNameNoTier]의 땅이 곧 산산조각 나리니! [puppet_or_actor.GetFaith.DevilName]의 하인들도 죽임을 당하리라! 내가 독신자들이 무기를 들게 하였으며, [secondary_recipient.GetName](을)를 보내 그대를 파멸로 몰아넣을 것이오!"
 pam_interactions_events.0072.a: "[puppet_or_actor.GetFaith.HighGodName](은)는 잔혹한 신이구나, 우리한테 저런 사람을 보내다니!"
