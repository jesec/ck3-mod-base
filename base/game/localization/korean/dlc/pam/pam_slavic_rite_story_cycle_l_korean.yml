l_korean:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "글라골 경전"
 slavic_rite.1000.desc: "\"가십시오, [greek_preacher.GetFirstName] 형제님.\" 내 [court_chaplain.GetActiveCouncilTask.GetPositionName](이)가 [GetRiteByKey('byzantine_rite').GetAdjective](을)를 따르는 [greek_preacher.Custom('MyPriestTitle')](을)를 안내했다.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], 그대의 봉역에 축복이 있기를. 저희 형제들이 그대의 백성을 위한 경전을 만들어 나가고 있습니다. 하지만 저희는 그대의 땅에서 교계의 권리를 차지하고자 하는 [GetRiteByKey('carolingian_christianity').GetAdherentName] 사제들의 그늘과 위협 속에 있습니다. [Glossary('키릴과 메토디오스', 'CYRIL_AND_METHODIUS_GLOSS')]가 갈등을 피할 전략과 외교적인 해결책을 수립할 수 있게 시간을 더 달라고 요청했습니다.\""
 slavic_rite.1000.a: "여기까지 왔으니, 저들을 믿는다."
 slavic_rite.1000.a_tt: "새로운 슬라브 경전을 만든 [Glossary( '키릴과 메토디오스', 'CYRIL_AND_METHODIUS_GLOSS' )] 형제가 당신의 봉역에서 새 [court_chaplain.GetFaith.GetAdjective] [rite|E]를 전파할 다음 단계에 관해 곧 알려올 것임."
 slavic_rite.1000.b: "[GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip]의 분노를 사느니 이 길은 버리는 게 낫다."
 slavic_rite.1000.b_tt: "현지 언어로 된 경전을 만들고 새로운 [rite|E]를 설립하려던 [Glossary('키릴과 메토디오스', 'CYRIL_AND_METHODIUS_GLOSS')]의 모든 노력이 중단됨."
 slavic_rite.1000.b_tt_2: "$story_slavic_rite$ [story_cycle|E] 종료."
 # Travel to Rome Initiation
 slavic_rite.0001.t: "모라비아 선교"
 slavic_rite.0001.desc: "[Glossary( '키릴과 메토디우스', 'CYRIL_AND_METHODIUS_GLOSS' )]를 다시 보게 되어 마음이 놓였다. 저들이 [GetRiteByKey('carolingian_christianity').GetAdherentName]의 개입과 겨룰 계획을 생각해 왔기만을 바라야지.\n\n\"영예로우신 [ROOT.Char.GetTitleAsNameNoTooltip]께 말씀드립니다. 그대 백성의 숭배 방식을 안전하게 지킬 수 있는 방법은 [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly](으)로 떠나 [pope_scope.GetTitledFirstName]의 축복을 받는 것뿐입니다.\"\n\n나 또한 그 독단적인 [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip]들에게도 성 베드로의 성좌가 지닌 권위가 통하기를 바라지만, 저들은 자신의 권위만을 중요하게 여기는 듯하다."
 slavic_rite.0001.a: "신의 가호가 있기를."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName](와)과 [methodius_scope.GetFirstName](이)가 여정을 시작하게 됨. 여정이 성공하면 이들이 귀환하며 당신의 봉역 전역에 새로운 종교적인 움직임을 일으킬 수 있음."
 slavic_rite.0001.b: "그대들이 빈손으로 떠나게 두진 않겠다."
 slavic_rite_travel_toast_title: "키릴과 메토디오스가 여정을 시작함"
 slavic_rite_moravian_mission_gift_sent_tooltip: "[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에 선물을 보내게 됨. 형제가 돌아오면 접견에 대해 알려줄 것임."
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "[methodius_scope.GetRite.GetName]의 탄생"
 slavic_rite.0003.desc: "[methodius_scope.GetFirstNameNoTooltip](이)가 [moravia_liege_scope.GetTitledFirstNameNoTooltip]의 도움을 받아 [methodius_scope.GetFaith.GetNameNoTooltip]의 새로운 실천 방식을 [moravia_liege_scope.GetCulture.GetNameNoTooltip]의 땅에 널리 전파하려 한다는 소식을 들었다. 내 학자들은 이를 [methodius_scope.GetRite.GetName](이)라 부르고 있다.\n\n우리는 현지인들을 우리와 비슷하게 여기고 대해 왔지만, [methodius_scope.GetSheHe]는 [pope_scope.GetTitledFirstName]에게서 승인을 얻어내 새로운 글을 저들에게 적용하려고 한다."
 slavic_rite.0003.a: "[methodius_scope.GetHerHis] 방식이 얼마나 성공적인지 볼까."
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "[ROOT.Char.GetCulture.GetNameNoTooltip] [methodius_scope.GetRite.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "오늘 아침 궁정에 흥미로운 소식이 전해졌다.\n\n[liege_scope.GetTitledFirstNameNoTooltip](이)가 [methodius_scope.GetCulture.GetNameNoTooltip] 사제인 [methodius_scope.GetFirstName]에게 수년 동안 우리의 땅에서 [methodius_scope.GetHerHis] 세속적인 방식을 전파하도록 허락했다는 것이다. [methodius_scope.GetFaith.GetNameNoTooltip](은)는 그 관습을 실천하고자 하는 이들을 위해 [ROOT.Char.GetCulture.GetNameNoTooltip]식 생활 방식을 더 편하게 변화시킬 것이다.\n\n최근 들어 우리 전통의 영성을 두고 많은 소란이 일어나지 않았는가. 이 상황에서 어떻게 나아갈 것인지 생각해 봐야 할 때가 온 듯하다."
 slavic_rite.0004.desc_chalcedonian: "우리의 [liege_scope.GetTitleAsNameNoTooltip](이)가 [methodius_scope.GetRite.GetNameNoTooltip]의 수립을 선언했으며, 이를 봉역 전체에 전파하기로 했다. 내 학자들에 따르면 이는 우리의 생활 방식을 해치지 않고도 [methodius_scope.GetFaith.GetNameNoTooltip]의 가르침을 실천할 수 있는 편리한 방식이라고 한다.\n\n한번 주목해 봐도 좋지 않을까?"
 slavic_rite.0004.a_pagan: "우리 선조들의 관습이 우월하다."
 slavic_rite.0004.b_pagan: "이 방식에도 일리가 있을지 모르겠군..."
 slavic_rite.0004.a_chalcedonian: "참된 길에서 멀어질 생각은 없다."
 slavic_rite.0004.b_chalcedonian: "학자들을 대령하라."
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "씁쓸하지만 아름다운 여정"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName](이)가 [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에서 돌아와 홀로 내 앞에 서 있었다. 내가 [cyril_scope.GetFirstName]에 관해 묻자 [methodius_scope.GetHerHis] 표정이 어두워졌다.\n\n\"자비로우신 [ROOT.Char.GetTitleAsNameNoTooltip]께 전하겠습니다. 좋은 소식은, [pope_scope.GetTitledFirstName]께서 축복을 내려 주시며 저희의 방식과 글을 사용해 [ROOT.Char.GetCulture.GetNameNoTooltip] 사람들과 이 봉역 전체에 신앙을 퍼뜨려도 좋다고 허락해 주셨습니다.\" [methodius_scope.GetFirstName](은)는 심호흡했다. \"하지만 그곳에 제 형제를 두고 올 수밖에 없었습니다. 저희의 노력이 헛되지 않도록 최선을 다하겠습니다. [ROOT.Char.GetFaith.HighGodName]께서 우리 모두를 보우하시길.\""
 slavic_rite.0005.a: "그대의 형제가 자랑스럽게 여길 수 있도록 함께 노력하세!"
 slavic_rite.0005.b: "적어도 그 유산을 기려 주어야겠지."
 pam_cyril_statue_modifier: "키릴 기념비"
 pam_brothers_travel_safety_modifier: "신중한 여행"
 slavic_rite.0005.c: "그대 임무에 행운을 빌지."
 slavic_rite_mass_conversion_tooltip: "[moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] 내 모든 [duchies|E]에서 [counties|E]을 [methodius_scope.GetRite.GetName](으)로 개종하려는 대규모 개종 [great_project|E]이 계획됨"
 slavic_rite_moravian_mission_gift_received_tooltip: "[pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에 보낸 당신의 선물이 감사 인사와 함께 받아들여짐."
 slavic_rite_ecclesiastical_title_creation_tooltip: "$slavic_rite_ecclesiastical_title$(이)가 창설되었으며 [methodius_scope.GetFirstName](이)가 그 첫 [holder|E]가 됨"
 slavic_rite_ecclesiastical_title: "모라비아 $d_et_archdiocese_prefix$"
 slavic_rite_ecclesiastical_title_name: "모라비아"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "모라비아 선교의 끝"
 slavic_rite.0006.desc.brothers_are_dead: "[Glossary('키릴과 메토디오스', 'CYRIL_AND_METHODIUS_GLOSS')] 형제가 사망했으나, 저들의 전례 업적을 이어갈 만큼 능력 있는 자가 없다. 이 과업을 계속하고자 한다면 백성의 개종을 완료할 수 있는 우리만의 접근 방식을 고안해 내야 한다."
 slavic_rite.0006.desc.no_longer_christian: "영광으로 향하는 길을 보았다. 한때 내 백성과 가문에 행복을 가져다줄 것만 같던 일도 이제 완전히 하찮게만 보인다. 저들이 가야 할 운명이었던 길은 내가 바랐던 것과 달랐다. 다행히도 [ROOT.Char.GetFaith.HighGodName]께서 우리를 위한 새로운 길을 보여주셨다."
 slavic_rite.0006.desc.no_longer_king: "최근의 사건과 내 강력한 직위의 상실을 통해 나는 감당할 수 없는 일을 벌여선 안 된다는 사실을 배웠다. 현재 우리는 모라비아 선교를 이어갈 수 없는 상황이다. 일단 이 곤경에서 회복한 뒤, 나중에 새로운 환경에서 다시 시도해야 할 것 같다.\n\n그때까지는 [ROOT.Char.GetPrimaryTitle.GetNameNoTier](이)가 같은 운명을 맞이하지 않도록 지켜내야 한다."
 slavic_rite.0006.desc.no_longer_slav: "선조들은 지금의 내 모습을 그리 자랑스러워하지 않을 것 같다.\n\n뭐, 그러라지. [ROOT.Char.GetPrimaryTitle.GetNameNoTier](을)를 어떻게 다스릴지 결정하는 건 저들이 아니니까. 그건 오직 나만 내릴 수 있는 결정이다."
 slavic_rite.0006.a.brothers_are_dead: "이럴 운명이 아니었나 보군..."
 slavic_rite.0006.a.no_longer_christian: "[ROOT.Char.GetFaith.HighGodName](을)를 찬양하라!"
 slavic_rite.0006.a.no_longer_king: "더는 그런 야심을 감당할 수 없다."
 slavic_rite.0006.a.no_longer_slav: "글라골 문자는 내 백성에게 있어 짐이었다."
 slavic_rite.0006.a.tooltip: "봉역을 포교하기 위한 $story_slavic_rite$가 쓸모없어짐."
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "[ROOT.Char.GetFaith.HighGodName](으)로 하나 된 봉역"
 slavic_rite.0007.desc: "\"#italic ...[ROOT.Char.GetHerHis] 치세 아래 우리는 고요하고 평화로운 삶을\n경건하고 품위 있게 살아가리라.\n\n그대야말로 왕국이며, 권력이고 영광이니.\n지금은 물론, 앞으로 영원히 그러하리라. 아멘.#!\"\n\n[archdiocese_holder.GetTitledFirstName](이)가 기도를 마무리하자 영원한 희열이 내 영혼을 휩쓸고 지나갔다. 하늘을 섬기는 우리만의 전통을 봉역 전체에 퍼뜨리는 임무가 성공했다. [ROOT.Char.GetFaith.HighGodName]께서 내 가문, [Glossary( '키릴과 메토디오스', 'CYRIL_AND_METHODIUS_GLOSS' )], [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]의 모든 사람을 축복하시기를."
 slavic_rite.0007.a: "우리는 축성된 길을 걸어갈 운명이었다."
 pam_slavic_rite_clergy_opinion_modifier: "축복받은 군주"
 slavic_rite.0007.b: "내 백성이 견뎌내지 못할 일은 없다."
 pam_slavic_rite_culture_opinion_modifier: "백성의 군주"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "은밀한 설교자"
 slavic_rite.0010.desc: "[undercover_preacher.GetCulture.GetNameNoTooltip] [undercover_preacher.Custom('MyPriestTitle')](와)과 [undercover_preacher.GetHerHis] 설교자 수행단이 부끄러운 줄 모르는 얼굴로 내 궁정 사제인 [court_chaplain.GetTitledFirstName]의 인도를 따라 회당에 들어섰다.\n\n\"안녕하십니까, [ROOT.Char.GetTitleAsNameNoTooltip]. 이 침입자들이 [court_chaplain_superior.GetTitledFirstName](이)나 그대의 권위를 존중하지도 않고 [ROOT.Char.GetFaith.HighGodName]의 말씀을 설교하고 있었습니다.\" 궁정 사제는 잠시 말을 멈추고 외지인을 위아래로 훑어본 뒤 다시 나를 바라보았다.\n\n\"소문에 따르면 이들이 몰래 행동한 지가 꽤 됐다고 합니다. 아무것도 모르는 신하들을 설득하고, 그 영혼을 더럽히려 시도하면서요. 이들을 어떻게 처리하면 좋겠습니까?\""
 slavic_rite.0010.a: "썩 꺼져라, 다시는 내 땅으로 돌아오지 말도록."
 slavic_rite.0010.b: "이전에 했던 경고로는 부족했던 모양이군."
 slavic_rite.0010.c: "자네들은 실망했을 윗사람과 굳이 마주하지 않아도 된다."
 slavic_rite.0010.c.success: "[undercover_preacher.GetSheHe|U]가 당신의 궁정에서 새 삶을 시작하고 싶어 함"
 slavic_rite.0010.c.failure: "[undercover_preacher.GetSheHe|U]를 설득하지 못함"
 preacher_recruited.t: "설교자 모집됨"
 preacher_left.t: "설교자가 떠남"
 # 0020
 slavic_rite.0020.t: "신의 뜻을 위한 자금"
 slavic_rite.0020.desc: "\"[ROOT.Char.GetTitleAsNameNoTooltip], 저들은 현지인들을 이용하려는 게 아닙니다. [court_chaplain_superior.GetTitledFirstNamePossessive] 방랑하는 설교자들은 그 점에서는 사려가 깊지요. 심지어 제가 그대와 얘기하기를 바라던데, 이는 참으로 칭송할 만한 겸손입니다. 확인 한 번이면 이 모든 상황이 저들은 물론 그대의 백성을 위해서도 쉬워질 겁니다.\"\n\n다른 이들을 대신해 나를 설득하려 하는 [court_chaplain.GetTitledFirstNamePossessive] 노력은 가상하지만, [court_chaplain.GetSheHe]가 이런 재능을 내 백성이 낡은 전통을 버릴 수 있도록 돕는 데 써야 한다는 생각이 들었다.\n\n\"이번 일은 그대가 신께 더 가까워질 기회를 주시려는 [ROOT.Char.GetFaith.HighGodNamePossessive] 방식이 아닐까 합니다.\""
 slavic_rite.0020.a: "내 백성에게서 부도덕함을 빨리 없앨수록 좋다."
 pam_slavic_rite_great_project_speed_modifier: "개종 사업 자금 지원"
 slavic_rite.0020.b: "이게 줄 수 있는 전부다."
 slavic_rite.0020.c: "절대 안 돼."
 # 0030
 slavic_rite.0030.t: "동과 서의 논쟁"
 slavic_rite.0030.desc: "부드러운 산들바람이 수도원 정원의 나뭇잎을 휩쓸고 지나갔다. [court_chaplain_superior.GetTitledFirstName]의 두 성직자 문객이 논쟁하는 무리 사이에서 서로를 마주했다. 한쪽은 동방의 전통을 따르는 차림이었고, 다른 한쪽은 서부의 권위를 행사하고 있었다. 처음에는 겸손하던 이들의 목소리에 점차 자신감과 열정이 깃들었다.\n\n둘은 수많은 전례 주제에 대해 논의했고, 이야기는 학구적인 토론에서 흥미로운 논쟁으로 변해갔다. 나 또한 흥미를 느껴 모든 문장에 귀를 기울였다.\n\n이건 단순한 대화가 아니었다. 두 세계의 경쟁이었으며, 연약한 화합이나 더 깊은 균열로 이어질 수도 있는 대화였다."
 slavic_rite.0030.a: "[visiting_byzantine_clergy.GetCulture.GetNameNoTooltip] [visiting_byzantine_clergy.Custom('MyPriestTitle')]의 말이 일리가 있군."
 slavic_rite.0030.b: "[visiting_carolingian_clergy.GetNamePossessiveNoTooltip] 주장에 흥미로운 부분이 있다."
 slavic_rite.0030.c: "지식은 지식이지. 둘의 말이 다 맞다."
 slavic_rite.0030.d: "이 고대의 원칙보다 우리 방식이 우월하다."
