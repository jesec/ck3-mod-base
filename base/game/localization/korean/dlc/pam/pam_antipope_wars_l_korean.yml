l_korean:
 PAM_CHALLENGE_HOF_WAR_CB_NAME: "[head_of_faith|E] 도전"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "당신이 후원하는 [challenger_hof|E]가 [head_of_faith_possessive|E] 작위를 차지하고, [attacker.GetRite.GetName](이)가 [mainline_rite|E]가 됩니다."
 pam_challenge_hof_cb_victory_desc_attacker: "당신이 [head_of_faith_possessive|E] 작위를 장악하며 [attacker.GetRite.GetName](이)가 [mainline_rite|E]가 됩니다."
 pam_challenge_hof_cb_victory_desc: "[challenger_hof|E]가 [head_of_faith|E]가 됩니다."
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U](이)가 [head_of_faith|E]로 남습니다."
 pam_challenge_hof_cb_defeat_desc_attacker: "[head_of_faith|E]를 대상으로 한 당신의 도전이 실패했습니다."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "전쟁이 종결됐습니다. 방어자가 더 이상 [head_of_faith|E]가 아닙니다."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "전쟁이 종결됐습니다. 더 이상 교계 지도자에게 도전하는 인물이 없습니다."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U](이)가 [sponsor.GetShortUINamePossessive] [vassal|E]이 됨"
 PAM_ANTIKING_WAR_CB_NAME: "[challenger_hof|E] 퇴위"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "[defender.GetShortUINamePossessive] [challenger_hof|E]를 제거하고 [attacker.GetFaith.GetReligiousHead.GetShortUINamePossessive] 감사 인사를 받습니다."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "당신이 [defender.GetShortUINamePossessive] [challenger_hof|E]를 제거합니다."
 pam_antiking_cb_victory_desc: "[challenger_hof|E]가 퇴위당했습니다."
 pam_antiking_cb_white_peace_desc: "[challenger_hof|E]가 그대로 남습니다."
 pam_antiking_cb_defeat_desc_attacker: "[challenger_hof|E]를 제거하려던 당신의 시도가 실패했습니다."
 pam_antiking_cb_defeat_desc: "[challenger_hof|E]가 살아남습니다."
 msg_pam_antiking_cb_invalidated_message: "전쟁이 종결됐습니다. 방어자가 더 이상 [challenger_hof|E]를 후원하지 않습니다."
 pam_humiliation_cb_papabile_score_loss_tt: "교황 승계에 대한 [defender.GetShortUINamePossessive|U] [papabile_score|E]가 #N -25#! 감소함"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "교황 승계에 대한 [attacker.GetShortUINamePossessive|U] [papabile_score|E]가 #N -25#! 감소함"
 pam_clerical_disgrace_modifier: "성직 수치"
 pam_clerical_disgrace_modifier_desc: "해당 인물은 종교 전쟁에서 모욕을 당했으며, [clerical_titles|E]에 대한 [candidate_score|E]가 감소했습니다."
 pam_clerical_disgrace_candidacy_penalty_desc: "종교 전쟁에서 모욕당함"
 pam_antipope_events.0010.t: "몰락한 참칭자"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')] 분리론자 [pam_ch_hof_challenger.GetTitledFirstName](이)가 내 앞에 무릎을 꿇었다. [pam_ch_hof_challenger.GetHerHis] 거짓된 [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] 직위를 박탈당한 채였다.\n\n[pam_ch_hof_challenger.GetSheHe]는 아직도 반항적인 태도를 보이며 말했다. \"내가 선 곳이 곧 방주다. 네 발밑은 아니지.\"\n\n[pam_ch_hof_challenger.GetHerHis|U] 혀는 아직도 사탄을 섬기는 모양이다."
 pam_antipope_events.0010.desc: "참칭자 [pam_ch_hof_challenger.GetTitledFirstName](이)가 내 앞에 무릎을 꿇었다. [pam_ch_hof_challenger.GetHerHis] 거짓된 [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] 직위를 박탈당한 채였다.\n\n[pam_ch_hof_challenger.GetSheHe]는 아직도 반항적인 태도를 보이며 말했다. \"내가 진정한 [ROOT.Char.GetFaith.ReligiousHeadName](이)다.\""
 pam_antipope_events.0010.a.christian: "감방에 들어가면 [pam_ch_hof_challenger.GetHerHim]도 요나처럼 참회하겠지."
 pam_antipope_events.0010.a: "[pam_ch_hof_challenger.GetHerHim]를 가둬 버린다."
 pam_antipope_events.0010.b.christian: "[pam_ch_hof_challenger.GetHerHim]를 처형한다. 주님께서 자기 사람을 알아보실 테니."
 pam_antipope_events.0010.b: "[pam_ch_hof_challenger.GetHerHim]를 처형한다. [ROOT.Char.GetFaith.HighGodName]께서 심판하시겠지."
 pam_antipope_events.0010.c: "자비를 베푼다."
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.GetSheHe|U]는 비명 속에 진정한 [ROOT.Char.GetFaith.ReligiousHeadName|U]의 이름을 외치게 되리라."
 pam_challenge_hof_war_random_permanent_harm_tt: "무작위의 영구적인 부상으로 고통받음"
 pam_antipope_events.0011.t: "후원의 대가"
 pam_antipope_events.0011.desc.christian: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive] 자금은 이 사악한 파열을 초래했으며, [ROOT.Char.GetRite.GetName]에 맞서는 경쟁 [ROOT.Char.GetFaith.ReligiousHeadName|U](을)를 키워냈다.\n\n성서는 이러한 후원자를 관대하게 봐 주지 않는다. [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetSheHe|U]는 마지막까지 반항하는 태도로 고개를 들었다. \"넌 [ROOT.Char.GetFaith.ReligiousHeadName](이)가 아니라 거짓 수도사일 뿐이다. 추락하라, 추락하라. 영원히 저주받을지어다.\""
 pam_antipope_events.0011.desc: "[pam_ch_hof_sponsor.GetTitledFirstNamePossessive] 금화는 경쟁 [ROOT.Char.GetFaith.ReligiousHeadName|U](을)를 키워내 [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]들을 분열시켰다.\n\n[pam_ch_hof_sponsor.GetSheHe|U]가 고개를 들었다. \"넌 [ROOT.Char.GetFaith.ReligiousHeadName](이)가 아니다. 가짜일 뿐이지.\""
 pam_antipope_events.0011.a: "이 상황을 초래한 자금을 압류한다."
 pam_antipope_events.0011.b: "[pam_ch_hof_sponsor.GetHerHim]를 처형한다. 동의에는 대가가 따르는 법."
 pam_antipope_events.0011.c: "[pam_ch_hof_sponsor.GetHerHis] 집안에 드리운 수치 정도면 처벌로 충분하지."
 pam_antipope_events.0011.d: "육신이 굴복할 때까지 [pam_ch_hof_sponsor.GetHerHim]를 채찍질한다."
 pam_romans_1_32_english: "저희가 이같은 일을 행하는 자는 사형에 해당하다고... 자기들만 행할 뿐 아니라 또한 그 일을 행하는 자를 옳다 하느니라"
 ROMANS_1_32_GLOSS: "#weak 로마서 1장 32절, 개역한글판#!"
 pam_antipope_events.0012.t: "물러난 자에 대한 심판"
 pam_antipope_events.0012.t.christian: "사탄의 병사를 향한 선고"
 pam_antipope_events.0012.intro.christian: "[ROOT.Char.GetRite.GetName](이)가 나를 따른다. 가짜 [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_old_hof.GetTitledFirstName](이)가 내 발밑에 무릎을 꿇었다."
 pam_antipope_events.0012.intro: "[ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]들이 나를 따른다. 가짜 [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_old_hof.GetTitledFirstName](이)가 내 발밑에 무릎을 꿇었다."
 pam_antipope_events.0012.intro.sponsor: "내 [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_new_hof.GetFirstName](이)가 보좌에 앉았다. 참칭자 [pam_ch_hof_old_hof.GetTitledFirstName](이)가 내 앞에 무릎을 꿇었다."
 pam_antipope_events.0012.dialogue.christian: "\n\n[pam_ch_hof_old_hof.GetSheHe]는 여전히 반항적인 태도로 내뱉었다. \"평화의 보좌를 검으로 차지하셨군.\"\n\n\"주님께서 그분의 계획을 이루는 데 필요한 도구를 내게 주시기로 했으니까.\" 나는 그렇게 대답했다."
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetSheHe|U]가 말했다. \"이 자리를 검으로 차지하셨군.\"\n\n\"그러니 검으로 지켜야지.\" 나는 그렇게 대답했다."
 pam_antipope_events.0012.a: "감방에 들어가면 그 자존심도 수그러들겠지."
 pam_antipope_events.0012.b: "머리가 둘이면 괴물이 되는 법. 하나를 쳐내야만 한다."
 pam_antipope_events.0012.c: "불화는 이쯤 했으면 됐다. [pam_ch_hof_old_hof.GetHerHim]를 평화롭게 놓아주어라."
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.GetSheHe|U]는 비명 속에 진정한 [ROOT.Char.GetFaith.ReligiousHeadName|U]의 이름을 외치게 되리라."
 pam_antipope_events.0014.t: "내게 내린 심판"
 pam_antipope_events.0014.intro.judge: "\"모든 [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural]에게서 그대 앞에 순종해야 할 의무를 면제하겠다.\" [pam_ch_hof_judge.GetTitledFirstName](이)가 말했다."
 pam_antipope_events.0014.intro.mercy.christian: "\"가라, 더는 죄를 짓지 마라.\" [pam_ch_hof_judge.GetTitledFirstName](이)가 말했다."
 pam_antipope_events.0014.intro.mercy: "\"가라. 이 길로 다시는 돌아오지 마라.\" [pam_ch_hof_judge.GetTitledFirstName](이)가 말했다."
 pam_antipope_events.0014.desc.condemned.christian: "\n\n나는 정의를 사랑하고 불의를 증오했기에 죽는다."
 pam_antipope_events.0014.desc.condemned: "\n\n나는 내 믿음을 위해 죽는다."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U]와 [pam_ch_hof_judge.GetHerHis] 부하들이 내 몸을 채찍질하며 나를 비웃고 조롱한다. 나는 거죽만 남았으며, 알맹이는 모두 빠져나가 버렸다."
 pam_antipope_events.0014.desc.captive.christian: "\n\n저들이 나를 감방에 넣었다. 늘 그런 얘기를 듣긴 했다. 성자에게는 독방 하나면 충분하다고."
 pam_antipope_events.0014.desc.captive: "\n\n저들이 나를 감방에 넣었다. 이게 나한테 허락된 전부다."
 pam_antipope_events.0014.desc.spared.christian: "\n\n저들은 손에 쥔 돌을 던지지 않았고, 나는 자유롭게 풀려났다. 자비로 얻은 이 기회를 낭비해서는 안 된다."
 pam_antipope_events.0014.desc.spared: "\n\n내가 자유롭게 풀려나게 된 것 같다. 자비로 얻은 이 기회를 낭비해서는 안 된다."
 pam_antipope_events.0014.desc.generic: "\n\n심판이 내려졌다. 이제 앞으로 어떻게 될지는 내 선택에 달려 있다."
 pam_antipope_events.0014.a: "내 집안이 [ROOT.Char.GetFaith.HighGodName]께 진실했던 가문으로 기억되게 하라."
 pam_antipope_events.0014.b: "저들의 더럽혀진 손은 씻어낼 수 없을 것이다."
 pam_antipope_events.0014.b.toast: "당신에게 [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName]의 얼룩이 남음"
 pam_antipope_events.0014.c: "내 가문을 이 수치로부터 보호한다."
 pam_antipope_events.0014.d: "진정한 [ROOT.Char.GetFaith.ReligiousHeadName](와)과 화해하겠다."
 pam_antipope_events.0014.e: "[pam_ch_hof_judge.GetTitledFirstNameNoTooltip](이)가 가르쳐 준 악행을 그대로 행하겠다."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "보속이 끝날 때까지 맨발로 걷겠다."
 pam_antipope_events.0015.opening: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_antipope_events.0015.desc.defender_victory.christian: "[ROOT.Char.GetFaith.ReligiousHeadName|U](을)를 향한 분리론자의 도전이 진압당했음을 알리겠소. 참칭자의 직위는 파괴되었으며, [ROOT.Char.GetRite.GetName](은)는 굳건히 버티고 있소. 그 어떤 군주나 성직자도 자신이 어디에 충성을 바쳐야 하는지 의심하는 일이 있어서는 안 되오."
 pam_antipope_events.0015.desc.defender_victory: "[ROOT.Char.GetFaith.ReligiousHeadName|U](을)를 향한 도전이 진압당했음을 알리겠소. 참칭자의 직위는 파괴되었으며, [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip]들은 굳건히 버티고 있소. 그 어떤 영주도 자신이 어디에 충성을 바쳐야 하는지 의심하는 일이 있어서는 안 되오."
 pam_antipope_events.0015.desc.attacker_victory.christian: "[ROOT.Char.GetFaith.ReligiousHeadTitleName|U](을)를 향한 전쟁이 마무리되었음을 알리겠소. 내가 사탄의 굴레에서 보좌를 해방했으며, [ROOT.Char.GetRite.GetName](은)는 내 명령을 따를 것이오."
 pam_antipope_events.0015.desc.attacker_victory: "[ROOT.Char.GetFaith.ReligiousHeadTitleName|U](을)를 향한 전쟁이 마무리되었음을 알리겠소. 내가 보좌를 지켜냈으며, [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip](은)는 나를 따르오. 신자들에게 새로운 [ROOT.Char.GetFaith.ReligiousHeadName]의 시대가 시작됨을 알리시오."
 pam_antipope_events.0015.a: "그렇게 됐군."
