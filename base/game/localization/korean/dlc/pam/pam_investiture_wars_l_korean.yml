l_korean:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "서임권 분쟁"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "당신의 승리로 [defender.GetShortUIName](와)과 그 진영은 성직 임명에 관한 당신의 입장을 받아들여야 합니다."
 pam_investiture_conflict_cb_victory_desc_defender: "[attacker.GetShortUIName|U]의 승리로 당신과 지지자들은 성직 임명에 관한 상대의 입장을 받아들여야 합니다."
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U](이)가 승리합니다. [defender.GetShortUIName](와)과 그 진영은 성직 임명에 관한 [attacker.GetShortUIName]의 입장을 받아들여야 합니다."
 pam_investiture_conflict_cb_white_peace_desc: "성직 임명을 둘러싼 분쟁은 해결되지 않은 채 끝나며, 어느 쪽도 물러서지 않습니다."
 pam_investiture_conflict_cb_defeat_desc_attacker: "패배한 당신과 지지자들은 성직 임명에 관한 [defender.GetShortUIName]의 입장을 받아들여야 합니다."
 pam_investiture_conflict_cb_defeat_desc_defender: "당신이 승리합니다. [attacker.GetShortUIName](와)과 그 진영은 성직 임명에 관한 당신의 입장을 받아들여야 합니다."
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U](이)가 승리합니다. [attacker.GetShortUIName](와)과 그 진영은 성직 임명에 관한 [defender.GetShortUIName]의 입장을 받아들여야 합니다."
 msg_pam_investiture_conflict_cb_invalidated_message: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](이)가 끝났습니다. 서임권 분쟁은 더 이상 유효하지 않습니다."
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "서임권 공의회가 아직 소집되지 #EMP 않았음#!"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "굴복을 강요당함"
 pam_investiture_conflict_forced_stance_tt: "서임권 분쟁에서 패배하여, 다가오는 공의회에서는 성직 임명에 관해 승자의 입장을 따라야 함."
