l_korean:
 # Abbey of St Gall
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$"
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$"
 building_pam_abbey_of_st_gall_01: "장크트갈렌 수도원"
 building_pam_abbey_of_st_gall_01_desc: "성 갈루스의 암자 주위로 세워진 이 수도원은 교육 시설, 기록실, 도서관으로 이름이 높습니다. 수도원의 벽 안에서 수도사들은 성전을 필사하고, 보덴호의 경계를 훨씬 넘어서는 학식을 갖춘 성직자들을 양성합니다."
 building_pam_abbey_of_st_gall_01_destination_desc: "[GetBuilding('pam_abbey_of_st_gall_01').GetName]의 벽 아래 순례자와 학자들이 모여든다. 이곳의 수도사들은 필사본을 보존하고 성직자를 가르치며, 알프스 산기슭에서 성 갈루스의 기억을 계속해서 이어간다."
 # Palais des Papes
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$"
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$"
 building_pam_palais_de_papes_01: "아비뇽 교황궁"
 building_pam_palais_de_papes_01_desc: "요새와 거주지로서 아비뇽에 세워진 이 궁전은 거대한 석벽 안에 교황청을 품고 있습니다. 이곳의 예배당, 알현실, 행정 공간이 도시를 교계 권력의 중심지로 바꿔놓았습니다."
 building_pam_palais_de_papes_01_destination_desc: "[GetBuilding('pam_palais_de_papes_01').GetName]은 강화된 벽과 엄숙한 예배당으로 아비뇽을 지배한다. 이곳은 교회의 일과 의식을 관장하고자 만들어진 궁전이다."
 # Archbasilica of Saint John Lateran
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$"
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$"
 building_pam_lateran_basilica_01: "산 조반니 인 라테라노 대성전"
 building_pam_lateran_basilica_01_desc: "도시와 전 세계 교회의 어머니이자 우두머리나 다름없는 로마의 대성당입니다. 그 바실리카와 인접한 회의실에서 공의회가 소집되고, 교리가 확정되며, 로마 교황의 권위가 구현됩니다."
 building_pam_lateran_basilica_01_destination_desc: "[GetBuilding('pam_lateran_basilica_01').GetName]은 로마의 주교좌에서 순례자와 고위 성직자를 받아들이며, 위엄 있는 벽 아래에서 경건한 예배와 교회의 운영이 어우러진다."
 # Reims Cathedral
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$"
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$"
 building_pam_reims_cathedral_01: "랭스 대성당"
 building_pam_reims_cathedral_01_desc: "랭스의 대성당은 클로비스 1세의 세례와 왕들의 대관식이 이루어졌던 신성한 장소입니다. 여기서 성직자의 축복은 영주의 명분을 신성한 권위로 바꿔 놓았으며, 이를 통해 신앙과 왕권 사이의 유대가 다져졌습니다."
 building_pam_reims_cathedral_01_destination_desc: "[GetBuilding('pam_reims_cathedral_01').GetName]은 왕의 축성이 이루어졌던 거룩한 중심부로 여행자들을 이끈다. 프랑크의 왕들은 이곳의 제단 앞에 무릎을 꿇고, 왕국 앞에서 기름 부음을 받고 자리를 떠난다."
