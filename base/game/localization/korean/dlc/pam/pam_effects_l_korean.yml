 pam_tenet_events.0004.opening.hof: "지극히 존경하는 [diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip],"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "[diverged_rite.GetName]에서 [diverged_added_tenet.GetBaseName](을)를 새로운 원리로 받아들였음을 알려드립니다.\n\n신도들을 올바르게 이끄는 교파는 [diverged_rite.GetFaith.GetAdjective] 신앙 전체를 더욱 굳건하게 합니다. 이는 지극히 당연한 이치입니다."
 pam_tenet_events.0004.desc.forward_doctrine: "[diverged_rite.GetName]에서 이제 [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )](을)를 공식적으로 채택했음을 알려드립니다.\n\n신도들을 올바르게 이끄는 교파는 [diverged_rite.GetFaith.GetAdjective] 신앙 전체를 더욱 굳건하게 합니다. 이는 지극히 당연한 이치입니다."
 pam_tenet_events.0004.desc.backward_tenet: "[diverged_rite.GetName]에서 [diverged_added_tenet.GetBaseName](을)를 새로운 원리로 받아들였음을 알려드립니다.\n\n이를 통해 우리는 [diverged_rite.GetFaith.GetMainRite.GetName]에 한 걸음 더 가까워졌습니다. 모든 교파가 한목소리를 낼 때 [diverged_rite.GetFaith.GetAdjective] 신앙은 더욱 번영할 것입니다!"
 pam_tenet_events.0004.desc.backward_doctrine: "[diverged_rite.GetName]에서 이제 [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )](을)를 따르게 되었음을 알려드립니다.\n\n이를 통해 우리는 [diverged_rite.GetFaith.GetMainRite.GetName]에 한 걸음 더 가까워졌습니다. 모든 교파가 한목소리를 낼 때 [diverged_rite.GetFaith.GetAdjective] 신앙은 더욱 번영할 것입니다!"
 pam_tenet_events.0004.a: "좋다."
 pam_tenet_events.0004.a.tt.diverged: "[diverged_rite.GetName] [rite|E]가 [diverged_rite.GetFaith.GetMainRite.GetName] [mainline_rite|E]에서 더욱 멀어져, 매년 [fervor_i][fervor|E]이 더 빠르게 감소함"
 pam_tenet_events.0004.a.tt.consolidated: "[diverged_rite.GetName] [rite|E]가 [diverged_rite.GetFaith.GetMainRite.GetName] [mainline_rite|E]에 더욱 가까워져, 매년 [fervor_i][fervor|E]이 더 느리게 감소함"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "나는 가난한 이들을 위해 가진 것의 절반을 내놓았고, 베푼 덕에 내 영혼은 더욱 풍요로워졌다.\n\n이제 그대도 똑같이 가진 것의 절반을 내놓기를 청한다. 빈손은 용서받는다. 움켜쥔 손은 기억된다."
 pam_tenet_events.0005.a: "[redistributing_liege.GetTitleAsNameNoTooltip]께서도 감당하셨다면, 나라고 못할 것 없다."
 pam_tenet_events.0005.b: "내 손은 이미 가득하다. 앞으로도 비울 생각은 없다."
 pam_tenet_events.0005.b.tt: "당신의 재정은 그대로 유지되며, [Concept( 'counties', '영지' )|E]에는 아무것도 분배되지 않음"
 pam_tenet_events.0006.t: "금단의 가르침"
 pam_tenet_events.0006.desc_intro: "아무 표식도 없는 책들이 내 앞에 펼쳐져 있다. 그 도해들은 남김없이 드러나 있고, 그 이름들은 누구도 입에 올려서는 안 된다. 이것은 평범한 신자들이 절대로 손대지 말라고 경고받는 지식이며, 나는 돈을 치르고 이 지식과 단둘이 보낼 하룻밤을 얻었다."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName](은)는 문턱까지 왔다가 그 앞에서 멈춘다. \"이것들을 자물쇠로 잠그고 기도로 봉해 두는 데에는 이유가 있습니다.\" [mystic_witness.GetSheHe]가 중얼거린다. \"그 안에서 읽은 것은 한번 알게 되면 다시는 잊을 수 없게 되지요.\""
 pam_tenet_events.0006.desc_alone: "\n\n내 궁정에서는 아무도 나와 함께 이 책을 들여다보려 하지 않는다. 그 안에 무엇이 기다리고 있든, 누구의 조언도 없이 마주하겠다."
 pam_tenet_events.0006.a: "이 책에 내 이해를 넘어서는 것은 없다. 계속 읽는다."
 pam_tenet_events.0006.b: "등불이 비추는 데까지만 나아가고, 그 너머로는 가지 않는다."
 pam_tenet_events.0007.t: "망자의 조언"
 pam_tenet_events.0007.desc: "문은 빗장으로 잠기고 등불은 꺼진다. 세상은 점차 좁아져, 마침내 꺼져 가는 불꽃 하나와 내 주위를 짙게 휘감는 연기만 남는다. 나는 이미 자욱한 연기의 장막 너머에서 꿈틀거리는 [guiding_forebear.GetTitledFirstName]의 기척을 느낀다.\n\n어둠 속에서 나는 대낮에는 감히 입 밖에 내지 못하는 괴로운 고민들을 털어놓는다. 영들은 필멸자처럼 대답하지 않는다. 대신 무덤에서 들려오는 듯한 속삭임과 불안정하게 일렁이는 불꽃의 타닥거림, 보이지 않는 무언가가 스치듯 일으키는 바람, 연기 속에서 움직이는 망령을 통해 답한다.\n\n인도를 간절히 바라며, 나는 가장 절실한 답을 찾아 모든 징조를 뚫어지게 살핀다."
 pam_tenet_events.0007.a: "당신을 이끌었던 지혜를 내게도 나누어 주시오."
 pam_tenet_events.0007.b: "새벽을 마주할 수 있을 만큼의 평안을 주시오."
 pam_tenet_events.0008.t: "기억 속의 자아"
 pam_tenet_events.0008.desc: "인장, 잔, 반지. 내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))] [remembered_forebear.GetTitledFirstName]에게서 거두어 온 물건들이다. 나는 그것들을 내 앞에 펼쳐 놓고, 더 이상 남의 물건처럼 느껴지지 않을 때까지 그 앞에 머문다.\n\n아무것도 나타나지 않는다. 아무 말도 들리지 않는다. 나는 [remembered_forebear.GetHerHim]에 관한 이야기를 듣는 것이 아니다. 나 자신을 다시 기억해 내고 있다. 그리고 되살아나는 것은 그 삶과 함께 잃어버린 본성이 아니라, 그 삶이 끝날 때 잠시 놓아두었던 본성이다."
 pam_tenet_events.0008.a: "그게 나였다. 뼛속까지 [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l] 사람이었다."
 pam_tenet_events.0008.b: "눈을 뜨니 나는 본디 [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l] 자이며, 그것이 바로 내 본성임을 안다."
 pam_tenet_events.0008.c: "그래. 그때의 나는 [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l] 이였다. 다시 그렇게 될 수 있다."
 pam_tenet_events.0008.d: "그 삶들은 이미 지나갔다. 나는 지금의 나로 남는다."
 pam_tenet_events.0009.t: "궤짝을 열어라"
 pam_tenet_events.0009.desc_intro: "사람들이 궤짝을 마당으로 가져다 놓고 열쇠를 내 손에 쥐여 주었다."
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.GetTitledFirstName](은)는 늘어선 궤를 따라 걷는다.\n\n\"관대한 [ROOT.Char.GetTitleAsNameNoTooltip] 또한 결국 [ROOT.Char.GetTitleAsNameNoTooltip]일 뿐입니다.\" [redistribution_witness.GetSheHe]가 말한다. \"잘 베풀었다고 구원받는 것은 아닙니다. 더는 간직할 것이 아무것도 없어야 구원받는 법이지요.\""
 pam_tenet_events.0009.desc_alone: " 아무도 나와 함께하러 나오지 않았다. 관리들은 멀찍이 떨어져 기다린다."
 pam_tenet_events.0009.desc_end: "\n\n내 것은 손목만 돌리면 열 수 있다. 나머지는 강제로 열어야 한다."
 pam_tenet_events.0009.a: "자물쇠를 부숴라. 모두가 제 몫을 가져가게 하라."
 pam_tenet_events.0009.flavor: "여유 재산이 있는 봉신들은 강제로 금고를 열게 되고, 당신의 영지는 더욱 자유로워지고 통제하기 어려워지며, 이 원리를 따르지 않는 자들은 이 일로 당신을 원망할 것입니다."
 pam_tenet_events.0009.b: "잠깐. 내 재산만 내놓으면 된다."
 pam_tenet_events.0009.b.tt: "당신의 것만 나누고 [vassals|E]들은 금고를 열지 않으며, 이 일로 당신을 원망하지 않음"
 pam_tenet_events.0010.t: "육신이 치러야 할 대가"
 pam_tenet_events.0010.desc_intro: "채찍은 늘 있던 자리에 놓여 있다. 오늘 밤에는 그 곁에 남몰래 가져오게 한 쇠붙이와 짧은 칼도 있다. 누구의 뜻도 아닌, 오직 내 뜻으로 준비한 것들이다."
 pam_tenet_events.0010.desc_alone: "\n\n오늘 밤 등불을 들어 줄 사람은 아무도 없다. 저 탁자에서 무엇을 집어 들든, 아무도 지켜보지 않을 것이다."
 pam_tenet_events.0010.a: "채찍이다. 마음이 고요해질 때까지."
 pam_tenet_events.0010.b: "이제 더는 세상을 보지 않으리라."
 pam_tenet_events.0010.c: "욕망을 끊어 내라. 그러면 죄도 함께 사라지리라."
