l_korean:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "당신의 [faith|E]을 넘어선 어느 관습이 당신의 생각에 뿌리를 내렸으며, 당신은 [pam_sf_seeded_tenet.GetBaseName] [core_tenet|E]의 [agnostic_knowledge|E]을 획득했습니다."
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUIName]의 대부모가 되었으며, 영적 유대가 우정으로 발전했음"
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName]의 대부모가 되었으며, 영적 유대가 우정으로 발전했음"
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 같은 신앙을 믿으며 가까워졌음"
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 절친한 친구가 되었으며, 둘의 유대는 같은 신앙을 믿으며 더 깊어졌음"
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUIName](을)를 종교 박해로부터 보호했음"
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName](을)를 종교 박해로부터 보호했음"
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 같은 신앙을 믿으며 가까워지고 연인이 되었음"
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 신성한 방종의 밤을 보내며 연인이 되었음"
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 고해실에서 사죄 이상의 것을 발견하고 연인이 되었음"
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 신앙의 복잡성을 논의한 뒤 연인이 되었음"
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U](와)과 [TARGET_CHARACTER.GetShortUIName](이)가 연인이 되었으며, 둘의 사랑은 같은 신앙을 믿으며 더 깊어졌음"
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U](이)가 비용을 치른 이방인에게 [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] 성직을 팔았음"
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 비용을 치른 이방인에게 [CHARACTER.GetShortUINamePossessiveNoTooltip] 성직을 팔았음"
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName]에게 수도 서원을 강요해 암자 수도원에 강제로 입회시켰음"
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUIName]에게 수도 서원을 강요해 암자 수도원에 강제로 입회시켰음"
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "신부"
 pam_my_liege_reverend_mother: "원장"
 pam_my_liege_captain: "단장"
 pam_my_liege_khan: "대칸"
 pam_my_liege_khatun: "대카툰"
 pam_my_liege_chieftain: "족장"
 pam_my_liege_serene_lord: "가장 평온하신 주군"
 pam_my_liege_serene_lady: "가장 평온하신 주군"
 pam_my_liege_lord: "주군"
 pam_my_liege_lady: "주군"
 pam_my_liege_liege: "주군"
 pam_secular_faith_events.0001.t: "신성한 연기"
 pam_secular_faith_events.0001.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 향로를 들고 본당을 걸어갔다. 신성한 연기가 서까래를 타고 올라가며, 신도들의 중얼거리는 기도 소리도 함께 울려 퍼졌다.\n\n잠시나마 만물이 [ROOT.Char.GetFaith.PositiveAfterLife](을)를 향해 가는 듯했고, 나 역시 그들과 함께하고 있었다."
 pam_secular_faith_events.0001.a: "기도에 온전히 몰입하리라."
 pam_secular_faith_events.0001.b: "이 교파는 [ROOT.Char.GetFaith.WealthGodName]에 바칠 것이다."
 pam_secular_faith_events.0001.c: "[ROOT.Char.Custom('GetCourt')] 또한 이 헌신에 동참해야 한다."
 pam_secular_faith_events.0002.t: "피쿠아흐 네페쉬"
 pam_secular_faith_events.0002.desc: "내 땅을 가로지르던 여행자 [traveler_in_danger.GetTitledFirstName](이)가 [background_terrain_scope.GetName]에서 도적들의 습격을 받았다!\n\n[traveler_in_danger.GetHerHis|U] 생명이 위험하지만, [ROOT.Char.GetFaith.HighGodNamePossessive] 거룩한 축일에 무기를 드는 일은 금지되어 있다. 내게는 안식일을 어길 권리가 없다. 해가 질 때까지 기다렸다가 말을 달려 나간다면 [traveler_in_danger.GetHerHim]를 묻어 주는 수밖에 없다.\n\n하지만 목숨이 달린 상황에서 아무것도 하지 않고 가만히 있어야만 하나?"
 pam_secular_faith_events.0002.a: "생명이 가장 중요하지. 말을 달리자."
 pam_secular_faith_events.0002.b: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstNameNoTooltip](와)과 상의해야만 한다."
 pam_secular_faith_events.0002.c: "안식일을 어길 생각은 없다."
 pam_secular_faith_events.0003.t: "한밤의 환상"
 pam_secular_faith_events.0003.desc: "나는 꿈이라기엔 너무나 생생한 무언가를 보고 잠에서 깨었다. 불기둥, 내 이름을 부르는 목소리, 잊을 수 없는 얼굴...\n\n[ROOT.Char.GetFaith.HighGodName]께서 내게 오신 것일까? 아니면 [ROOT.Char.GetFaith.HealthGodName]? 어쩌면 변장한 [ROOT.Char.GetFaith.DevilName]일지도...\n\n아니면 그냥 피의 체액에 열이 올라 생긴 일이었는지도 모른다."
 pam_secular_faith_events.0003.a: "그 목소리가 축복 같은 진실을 속삭였지..."
 pam_secular_faith_events.0003.b: "체액의 열이라... 어디서 읽었던 현상 같은데."
 pam_secular_faith_events.0003.c: "[ROOT.Char.Custom('GetCourt')]도 내가 무엇을 보았는지 알아야 한다!"
 pam_secular_faith_events.0004.t: "금단의 진실"
 pam_secular_faith_events.0004.desc: "나는 의심을 가득 품은 채 잠을 이루지 못하고 내 [ROOT.Char.Custom('ResidenceBuilding')]의 어두운 [ROOT.Char.Custom('ResidenceBuildingHallsType')] 속을 서성였다.\n\n생각이 자꾸만 내 신앙에서 규탄하는 일로 향한다. [pam_sf_forbidden_tenet.GetBaseName] 말이다. 괴로운 기분이 들어야 마땅하지만, 어쩐지 이 믿음에 정의로운 진실이 있는 것 같다. 이 생각을 도무지 떨쳐버릴 수가 없다."
 pam_secular_faith_events.0004.a: "이 진실을 따르겠다... 아무도 모르게."
 pam_secular_faith_events.0004.b: "아니. 길에서 벗어나지 않겠다."
 pam_secular_faith_events.0005.t: "촛불 빛 곁에서"
 pam_secular_faith_events.0005.desc_intro: "저녁의 공부 시간에는 마음을 가라앉혀야 했지만, 한 구문이 계속해서 떠올랐다.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "[pam_sf_revelation_tenet.GetBaseName](이)라는 원리에 관한 내용이었는데, 내가 믿는 신앙에서는 절대 용납하지 않을 관습이었다. 나 또한 야만적인 원리라고 속으로 되뇌었다."
 pam_secular_faith_events.0005.desc_doctrine: "[pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )]의 교리에 관한 내용이었는데, 내가 믿는 신앙에서는 절대 용납하지 않을 가르침이었다. 나 또한 틀린 교리라고 속으로 되뇌었다."
 pam_secular_faith_events.0005.desc_end: "하지만 촛불 빛 곁에서, 나는 다른 이들이 왜 여기에 끌리는지를 알 것 같았다."
 pam_secular_faith_events.0005.a: "내 생각을 적어야겠다."
 pam_secular_faith_events.0005.b: "이해한다고 해서 문제 될 건 없지 않나."
 pam_secular_faith_events.0005.c: "기도로 이 생각을 정화해야겠다."
 pam_secular_faith_events.0006.t: "성자의 뼈"
 pam_secular_faith_events.0006.desc: "시장에서 긴 여행을 한 듯 보이는 순례자가 내 시선을 사로잡았다. [relic_seller.GetHerHis] 떨리는 손에는 노랗게 변한 손가락뼈가 있었다.\n\n\"성자의 뼈입니다.\" 이 [relic_seller.GetWomanMan]이 맹세했다. \"[GetTitleByKey('c_jerusalem').GetNameNoTier](으)로 가던 여정에서 발견했는데, 아무래도 [ROOT.Char.GetTitleAsNameNoTooltip]의 손에 있는 게 더 안전할 것 같아서요.\"\n\n학식이 있는 자라면 이 주장의 진위를 가려낼 수 있겠지. 마침 이 성물은 판매하는 중이라고 한다."
 pam_secular_faith_events.0006.a: "돈을 내기 전에 먼저 살펴보도록 하지."
 pam_secular_faith_events.0006.b: "내가 갖겠다."
 pam_secular_faith_events.0006.c: "낯선 사람의 뼈를 어디다 쓰라고. 저리 가라."
 pam_sf_acquire_relic_tt: "일반 [rarity|E]의 성물 [artifact|E]을 획득함"
 pam_sf_examine_relic_tt: "당신의 [learning_i][learning_skill|E]에 영향받은 [rarity|E]의 성물 [artifact|E]을 획득함"
 pam_sf_acquire_relic_toast: "성유물 획득"
 pam_sf_fingerbone_relic_name: "성자 [SCOPE.Custom('PamFingerboneSaint')]의 손가락뼈"
 pam_sf_fingerbone_relic_desc: "노랗게 바랜 손가락뼈입니다. 성자 [SCOPE.Custom('PamFingerboneSaint')]의 성물로 숭배받으며 작은 성유물함 안에 안치되어 있습니다."
 pam_secular_faith_events.0007.t: "오만한 주교"
 pam_secular_faith_events.0007.desc: "내 [defiant_bishop.GetTitleAsNameNoTooltip] 중 한 명인 [defiant_bishop.GetFirstName](은)는 자부심이 넘치며, 연줄도 많고 본인이 나보다 낫다고 조용히 자부하고 있다. 최근에 몇몇 시종이 아프게 되면서 [defiant_bishop.GetSheHe]에게 내 집안을 축복해 달라고 할 일이 생겼다.\n\n내 부름을 며칠이나 무시한 [defiant_bishop.GetSheHe]가 마침내 모습을 드러냈다. \"늦어져서 죄송합니다.\" [defiant_bishop.GetSheHe]가 히죽 웃었다. \"하지만 그 어느 [ROOT.Char.GetTitleAsNameNoTooltip]보다 더 위대한 주님의 부름에 응답해야 해서요.\""
 pam_secular_faith_events.0007.a: "그대의 직무에 걸맞은 품위를 따라 행동하도록 하지."
 pam_secular_faith_events.0007.b: "됐으니 의식이나 수행해 주게."
 pam_secular_faith_events.0007.c: "[ROOT.Char.GetFaith.HighGodName]께서 주님일지는 모르나, 주군은 바로 나다. 꺼져라!"
 pam_secular_faith_events.0008.t: "죄악의 무게"
 pam_secular_faith_events.0008.desc: "촛불이 타올랐다. 똑같은 생각이 되돌아왔다. 나는 [penance_sin.GetName( ROOT.Char )]이니, 내 신앙에서는 이것 또한 죄악으로 간주한다.\n\n아무리 그 생각을 밀어내려 해봤자 죄책감은 사라지지 않는다.\n\n\"자신을 다스리면 영혼에서 그 짐을 덜어낼 수 있습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', confessor )] [confessor.GetFirstName](은)는 나를 꾸짖거나 비난하지 않았다. \"이 보속을 따르십시오. 길에서 벗어나서는 안 됩니다.\""
 pam_secular_faith_events.0008.a: "[confessor.GetFirstNameNoTooltip]의 조언을 따르겠다."
 pam_secular_faith_events.0008.b: "아직은 아니다. 준비가 덜 됐어."
 pam_secular_faith_events.0009.t: "그리스도를 닮은 이방인"
 pam_secular_faith_events.0009.desc: "내 관문 앞에 외로이 나타난 상처투성이 이방인이 두 손을 내밀고 구걸했다.\n\n\"제가 폐를 끼친 것은 아니길 바랍니다, [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleAsNameNoTooltip].\" [stranger.GetSheHe]는 우아하게 고개를 숙여 인사하며 말했다. \"혹시 사정이 괜찮으시다면, 아주 약간만 나누어 주실 수 있겠습니까.\"\n\n[stranger.GetSheHe|U]는 거지치고 상당히 고상한 편이었다. 사람을 홀대한 일이 나중에 어떻게 돌아올지는 아무도 모르는 법이기는 하다."
 pam_secular_faith_events.0009.a: "들어오시오, 내 [ROOT.Char.Custom('ResidenceBuilding')]에서 그대를 환영하오."
 pam_secular_faith_events.0009.b: "이 빵을 받으시오. 평화가 함께하기를."
 pam_secular_faith_events.0010.t: "추운 곳에서 온 자"
 pam_secular_faith_events.0010.desc_blessed: "내가 관문 안으로 들인 [stranger.GetWomanMan]은 단순한 방랑자가 아니었다. [stranger.GetFirstName](이)가 성서와 국정 운영에 관한 이야기를 얼마나 유창하게 하는지, 학식 있는 내 사람들마저도 조용히 귀를 기울일 정도였다.\n\n아무래도 [ROOT.Char.GetFaith.HighGodName]께서 내 관문에 오신 모양이다. [stranger.GetHerHim]가 더 이상 방랑하게 두지 않겠다."
 pam_secular_faith_events.0010.desc_thief: "일어났더니 벽난로는 차갑게 식어 있고 금고는 열려 있었다.\n\n빵과 숙소를 주었는데, 가장 오래된 배반으로 되갚을 줄이야.\n\n[stranger.GetFirstName](은)는 밤사이에 내 재산을 챙겨 사라져 버렸다.\n\n집안이 발칵 뒤집힐 때쯤에는 [stranger.GetSheHe]가 이미 내 성벽과 시야에서 멀리 벗어난 뒤였다."
 pam_secular_faith_events.0010.a: "그대는 괜히 여기로 온 게 아니군."
 pam_secular_faith_events.0010.b: "내 식탁에 독사를 초대한 꼴이 되었군."
 pam_secular_faith_events.0011.t: "참회자"
 pam_secular_faith_events.0011.desc: "천둥소리 같은 채찍 소리가 내 잠을 깨웠다.\n\n[ROOT.Char.Custom('ResidenceBuilding')] 밖에 참회자들이 모여들었다. 이들의 등은 피부가 벗겨져 피투성이였고, [ROOT.Char.GetFaith.HighGodName]께서 [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )](을)를 요구하신다며 외쳐대고 있었다.\n\n집안 식구들이 어쩔 줄 모르며 나를 바라보았다."
 pam_secular_faith_events.0011.a: "이 일에 더 깊은 진실이 숨겨져 있진 않을까?"
 pam_secular_faith_events.0011.b: "채찍을 대령하라. 나 또한 죄를 지었으니."
 pam_secular_faith_events.0011.c: "내 땅에서 이 미친 것들을 쫓아내라!"
 pam_secular_faith_events.0012.t: "무기의 축복"
 pam_secular_faith_events.0012.desc: "평화는 채무다. 선물인 적이 없었다.\n\n[ROOT.Char.GetFaith.WarGodName](을)를 기리는 연회에서 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 내 집안의 무기를 축성하겠다며 제안했다.\n\n\"다윗에게 골리앗에 맞설 힘을 주신 신이여, [ROOT.Char.GetHouse.GetBaseName] 가문에도 같은 힘을 내려주시기를. 언제나 약자의 편에 서서 그들을 보호하기를.\" [chaplain.GetSheHe]가 기도했다."
 pam_secular_faith_events.0012.a: "내 깃발과 검을 축복해 주시오. 필요할 날이 올지도 모르니."
 pam_secular_faith_events.0012.b: "대신 평화를 기도합시다."
 pam_secular_faith_events.0012.c: "조용한 축복 정도면 되겠지."
 pam_secular_faith_events.0013.t: "예지된 죽음"
 pam_secular_faith_events.0013.desc: "커다란 눈의 설교자가 내 앞으로 끌려왔다. [prophet.GetSheHe]는 선동과 예언을 했다는 혐의를 받고 있었는데, 떨리는 손가락을 들더니 곧장 내 [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )] [doomed_soul.GetTitledFirstName](을)를 가리켰다.\n\n\"이 자를 똑똑히 보시오!\" [prophet.GetSheHe]가 외쳤다. \"다음 달이 떠오르기 전에 이자가 싸늘하게 식어 쓰러져 있을 거요. [ROOT.Char.GetFaith.HighGodName]께서 내게 정확한 시각까지 알려 주셨소!\"\n\n[prophet.GetHerHis|U] 확신에 불안한 느낌이 들었다. 물론 [doomed_soul.GetFirstNamePossessiveNoTooltip] 두려움은 더 심했다."
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName]께서 이상한 자의 입을 빌어 말하시는군..."
 pam_secular_faith_events.0013.b: "꺼져라, 미치광이 같으니!"
 prophecy_foretold_tt: "예언이군. 이게 진짜 사실이라면 어쩌지?"
 prophecy_foretold_2_tt: "예언이군. 말도 안 되는 헛소리야!"
 pam_secular_faith_events.0014.t: "예언의 심판"
 pam_secular_faith_events.0014.desc_fulfilled: "새로운 달이 떠올랐다. 그리고 [doomed_soul.GetTitledFirstName](이)가 죽었다. 잠을 자다 조용히 세상을 떠났다.\n\n그 초라한 설교자가 시간까지 정확히 얘기했다. 나 또한 그 사실을 잊지 않았다.\n\n그 예언이... 아니면 두려움이 현실이 된 걸까?"
 pam_secular_faith_events.0014.desc_failed: "새로운 달이 떠올랐다. 그리고 [doomed_soul.GetTitledFirstName](은)는 아직 살아 있다. 그 초라한 설교자가 얘기했던 시간이 왔고, 지나갔지만 아무 일도 일어나지 않았다.\n\n[prophet.GetSheHe|U]는 사기꾼이거나 어리석은 인간이며, 무엇보다도 [ROOT.Char.GetFaith.HighGodName]의 목소리는 절대 아니다."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\n멍청이가 된 기분이다."
 pam_secular_faith_events.0014.a: "[prophet.GetSheHe|U]는 진정한 예언자다!"
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName]께서는 신비한 방식으로 역사하신다."
 pam_secular_faith_events.0014.c: "내가 대체 왜 그 망할 예언을 믿었지!?"
 pam_secular_faith_events.0014.d: "예언을 믿어야 했는데..."
 pam_secular_faith_events.0014.e: "내가 뭐랬나, 저 설교자가 사기꾼 같다고 했지!"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U](이)가 종교적 [inspiration|E]을 획득함"
 pam_secular_faith_events.0015.t: "흐느끼는 성상"
 pam_secular_faith_events.0015.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 서둘러 [miracle_church.GetName](으)로 가보라고 했다. 들어가 보니 그림 속 성자의 눈에서 향유가 흐르고 있었다.\n\n기적이라는 소문은 그 어떤 전령보다도 빨리 퍼진다. 이는 또한 강력하면서도 위험한 소식이기도 하다."
 pam_secular_faith_events.0015.a: "기적이라? 확인해야만 한다."
 pam_secular_faith_events.0015.b: "신도들을 오라고 하라. 우리가 맞이하자."
 pam_secular_faith_events.0015.c: "이 축복은 널리 나눠서는 안 된다."
 pam_secular_faith_events.0015.d: "내 봉역이 축복받다니!"
 no_miracles_tt: "이 기적이란 게 좀 수상한데..."
 pam_secular_faith_events.0016.t: "설교단의 값"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [candidate.GetWomanMan]이 내 [ROOT.Char.Custom('ResidenceBuilding')]에 들어섰다. 호의를 구하려는 게 아니라 구매하기 위함이었다.\n\n\"그대의 [old_realm_priest.GetCouncilTitle] [old_realm_priest.GetFirstName](은)는 훌륭한 목자입니다.\" [candidate.GetSheHe]가 중얼거리며 두툼한 지갑을 탁자에 내려놓았다. \"근데 제가 훨씬 더... 훌륭한 인재입니다. 절 [old_realm_priest.GetHerHis] 직무에 임명하시고 [ROOT.Char.GetFaith.WealthGodNamePossessive] 축복을 누리시지요.\""
 pam_secular_faith_events.0016.desc_sanctioned: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )](은)는 부끄러울 일도 없고, 은화는 좋은 것이니."
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )](은)는 죄악이다. 저 금화를 받는다면 내 영혼 또한 더럽혀질 터."
 pam_secular_faith_events.0016.a: "죄악보다 금화가 더 묵직하긴 하지..."
 pam_secular_faith_events.0016.b: "합당한 가격을 잘 치르는군. 직무는 그대의 것이네."
 pam_secular_faith_events.0016.c: "직무는 팔 수 있는 게 아닐세."
 pam_secular_faith_events.0017.t: "[ROOT.Char.Custom('GetCourt')|U]의 이단자"
 pam_secular_faith_events.0017.desc: "\"이단이다!\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 [accused.GetFirstName](을)를 향해 손가락질했다. \"모르시겠습니까? [accused.GetFirstNamePossessiveNoTooltip] 사악한 [accused.GetRite.GetAdjective] 기운이 [ROOT.Char.Custom('GetCourt')]에 영향력을 미치고 있습니다! [accused.GetSheHe|U]는 당장 회개하고 [ROOT.Char.GetFaith.HighGodName](을)를 받아들여야 합니다!\"\n\n[accused.GetFirstNameNoTooltip](은)는 냉정한 얼굴이었지만, 비난이 분명 상처로 다가온 듯했다."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], 그대를 믿음으로 이끌어 주지."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip](이)가 개종함"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName](이)가 마음을 돌리지 않음"
 pam_secular_faith_events.0017.b: "감방에서 회개하도록. [accused.GetHerHim]를 붙잡아라."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip](은)는 내 보호 아래 있다. 그쯤 해두지."
 pam_secular_faith_events.0018.t: "신의 아이"
 pam_secular_faith_events.0018.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )] [pious_child.GetFirstName](은)는 보통 아이와는 다르다. 다른 아이들이 노는 동안 [pious_child.GetSheHe]는 하루를 예배당에서 보낸다.\n\n\"저런 아이는 처음 봅니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 조용히 말했다. \"몇 시간을 기도하고, 예배를 보는 도중에는 흐느낍니다. [pious_child.GetFirstNameNoTooltip](은)는 [GetTrait('devoted').GetName( pious_child )](으)로서의 삶을 살아가고 싶어 하는 게 확실합니다.\""
 pam_secular_faith_events.0018.a: "[ROOT.Char.GetFaith.HighGodName](을)를 섬기되 여기 머물러라."
 pam_secular_faith_events.0018.b: "교회에 내 [pious_child.Custom('GetDaughterSon')]을 바치겠다."
 pam_secular_faith_events.0018.c: "아니, [pious_child.GetSheHe]는 [ROOT.Char.GetHouse.GetBaseNameNoTooltip] 집안 사람이다."
 pam_secular_faith_events.0019.t: "신의 평화"
 pam_secular_faith_events.0019.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 나쁜 소식을 가져왔다.\n\n\"[ROOT.Char.GetFaith.HighGodNamePossessive] 시선 아래 형제가 형제를 살해해서는 안 됩니다.\" [chaplain.GetSheHe|U]가 선언했다. \"[feud_attacker.GetTitledFirstName](와)과 [feud_defender.GetTitledFirstName](이)가 서로에게 칼을 겨누었으며, 다투다 피 흘리는 짓은 소인배나 하는 일입니다!\"\n\n\"이런 일은 끝내야 합니다. 저들이 [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )] 아래 하나가 되게 합시다.\""
 pam_secular_faith_events.0019.a: "[ROOT.Char.GetFaith.HighGodName]의 이름으로 평화가 찾아오리라."
 pam_secular_faith_events.0019.b: "칼을 뽑은 영주라면 누구든 그 대가를 치러야 할 것이다."
 pam_secular_faith_events.0019.c: "내 봉신들의 다툼은 내가 판단할 일이다."
 pam_sf_peace_of_god_ends_wars_tt: "당신의 [vassals|E] 사이의 모든 [war|E]이 [white_peace|E]로 끝남"
 pam_secular_faith_events.0020.t: "[temple_location.GetNameNoTooltip]의 [ROOT.Char.GetFaith.HouseOfWorship|U]"
 pam_secular_faith_events.0020.desc: "석공들이 내가 이곳 [temple_location.GetName]의 [temple_location.Custom('TerrainTypeProvincePrefix')] [temple_location.Custom('TerrainTypeProvince')]에 세운 첫 [ROOT.Char.GetFaith.HouseOfWorship]에 마지막 돌을 놓았다.\n\n내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 손에 향로를 들고 땅을 걸었다.\n\n\"그대가 [ROOT.Char.GetFaith.HighGodName]에 바친 [ROOT.Char.GetFaith.HouseOfWorshipPlural](은)는 길이 기억될 것입니다.\" [chaplain.GetSheHe]가 말했다. \"이것이 그 첫 발걸음이 되기를.\""
 pam_secular_faith_events.0020.a: "[chaplain.GetFirstNameNoTooltip], 기도를 진행하라."
 pam_secular_faith_events.0020.b: "[consecrated_county.GetNameNoTierNoTooltip](이)가 [ROOT.Char.GetFaith.HouseOfWorship] 주위에서 번영하기를."
 pam_secular_faith_events.0020.c: "이 성벽 안에서 지혜를 찾겠다."
 pam_secular_faith_events.0020.d: "[ROOT.Char.GetFaith.HighGodNamePossessive] 역사는 이제 막 시작일 뿐이다."
 pam_secular_faith_events.0021.t: "천상의 계시"
 pam_secular_faith_events.0021.desc: "잠은 찾아오지 않으리라. 나는 [ROOT.Char.Custom('GetCourtyard')]의 고요한 어둠 속에서 하늘을 올려다보았다. 오늘 밤하늘에서 [ROOT.Char.Custom('GetPamCelestialOmen')](을)를 보았다.\n\n이런 계시에는 반드시 의미가 있기 마련이다."
 pam_omen_blood_moon: "붉어진 달"
 pam_omen_star_host: "별이 없어야 할 곳에 나타난 별들"
 pam_omen_comet: "꼬리가 두 개 달린 혜성"
 pam_omen_falling_stars: "비처럼 쏟아지는 별들"
 pam_omen_moon_halo: "창백한 달무리"
 pam_omen_eclipse: "구릿빛 초승달로 저무는 월식"
 pam_omen_wandering_star: "방랑하는 밝은 별"
 pam_secular_faith_events.0021.a: "이 징조를 연구하겠다."
 pam_secular_faith_events.0021.b: "[ROOT.Char.GetFaith.HighGodNamePossessive] 은총이 빛나는군."
 pam_secular_faith_events.0021.c: "이런 계시는 정복을 뜻하지!"
 pam_secular_faith_events.0021.d: "하늘이 내게 답해 줄 의무는 없다."
 pam_secular_faith_events.0022.t: "[ROOT.Char.GetTitleAsNameNoTooltip]의 손길"
 pam_secular_faith_events.0022.desc_intro: "내 [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )] [sick_courtier.GetFirstName](이)가 창백한 얼굴로 나를 향해 불안하게 다가왔다.\n\n"
 pam_secular_faith_events.0022.desc_ill: "\"제 건강이 나빠지고 있습니다, [ROOT.Char.Custom('FormOfAddressForLiege')]. 끔찍한 [illness_trait.GetName( GetNullCharacter )]에 걸렸는데 치료법도 찾지 못했습니다. 의사 [physician.GetTitledFirstName]마저도 뭐가 문제인지 모르겠답니다!\" [sick_courtier.GetSheHe]가 통곡했다.\n\n"
 pam_secular_faith_events.0022.desc_other: "\"제 건강이 나빠지고 있습니다, [illness_trait.GetName]에 걸렸는데 치료법도 찾지 못했습니다. [physician.GetTitledFirstName]마저도 뭐가 문제인지 모르겠답니다!\" [sick_courtier.GetSheHe]가 통곡했다.\n\n"
 pam_secular_faith_events.0022.desc_end: "\"왕위를 가진 자가 [ROOT.Char.GetFaith.HighGodNamePossessive] 은총을 지닌다는 말이 있던데. 그게 제 마지막 희망입니다.\""
 pam_secular_faith_events.0022.a: "오라. 내 그대에게 손을 얹어 주지."
 pam_secular_faith_events.0022.b: "아니... 이 자리 그대로 그대를 축복하겠다."
 pam_sf_kings_touch_gamble_tt: "내 손길이 [sick_courtier.GetFirstName]의 질병을 회복시켜 줄 수도 있겠지만, 그 질병이 내게 옮을 수도 있음..."
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName](이)가 병상에서 일어섬"
 pam_sf_kings_touch_infected_toast: "질병이 다음으로 내게 전해짐"
 pam_sf_kings_touch_nothing_toast: "내 손길이 [sick_courtier.GetFirstName]에게 아무 변화를 일으키지 않음"
 pam_secular_faith_events.0023.t: "방랑하는 필경사"
 pam_secular_faith_events.0023.desc: "야윈 [scholar.GetWomanMan]이 내 앞에 섰다. [scholar.GetHerHis] 손가락은 잉크로 얼룩졌으며 팔에는 서적을 가득 끼고 있었다.\n\n\"저는 필경사이자 학자인 [scholar.GetFirstName](이)라고 합니다.\" [scholar.GetSheHe]가 말을 이어갔다. \"저는 고향도, 후원자도 없지요. 이 손은 노동에 어울리지 않으며, [ROOT.Char.GetTitleAsNameNoTooltip]의 말씀을 [ROOT.Char.Custom('GetWritingMaterial')](으)로 옮기기 위함입니다.\"\n\n\"부탁드립니다. 제게 빵과 머물 곳을 내어주신다면 온 마음을 다해 그대를 섬기겠습니다.\""
 pam_secular_faith_events.0023.a: "학자라 했나? 아는 것을 내게 가르치도록."
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip]에 그대가 필요하다."
 pam_secular_faith_events.0023.c: "내 장부를 흔들림 없이 봐 줄 사람이 필요하다."
 pam_secular_faith_events.0023.d: "필요 없다. 물러가도록."
 pam_secular_faith_events.0024.t: "암자 수도원으로"
 pam_secular_faith_events.0024.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )] [rival_character.GetFirstName](은)는 늘 그렇듯 [ROOT.Char.Custom('GetCourt')]의 [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)] [rival_character.Custom2('InsultNounClumsy', ROOT.Char)]이자 [rival_character.Custom2('InsultAdjective', ROOT.Char)] [rival_character.Custom2('InsultNoun', ROOT.Char)](이)다. 그러나 [archdiocese.GetName]의 [archbishop.GetTitledFirstName](이)가 보낸 편지 하나가 내 기분을 좋게 했다.\n\n\"[rival_character.GetFirstName](이)라면 [ROOT.Char.GetFaith.HighGodName](을)를 잘 섬길 듯합니다.\" [archbishop.GetSheHe]는 편지에 이렇게 쓰고 있었다. \"암자 수도원에서 [rival_character.GetHerHim]를 기쁘게 맞이하겠습니다.\"\n\n세상은 그곳에서 무릎 꿇는 이를 쉽게 잊는 법이다."
 pam_secular_faith_events.0024.a: "[ROOT.Char.GetFaith.HighGodName]께서 '자발적인' 시종 하나를 더 맞이하시겠군!"
 pam_secular_faith_events.0024.b: "내 적은 잘 보이는 곳에 두어야 마음이 편하지."
 pam_secular_faith_events.0025.t: "대부모"
 pam_secular_faith_events.0025.desc: "\"[ROOT.Char.GetFaith.GetAdjective] 신앙에 몸과 마음을 모두 바치고 싶습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )] [converting_char.GetFirstName](이)가 엄숙하게 말했다. \"세례받고 [ROOT.Char.GetRite.GetAdherentName](이)가 되고자 합니다... 그리고 그대가 세례반 곁에 제 대부모로 서 주셨으면 합니다.\""
 pam_secular_faith_events.0025.a: "그렇다면 모두에게 우리의 유대를 보여주자!"
 pam_secular_faith_events.0025.b: "믿음에는 대단한 볼거리가 필요 없다."
 pam_secular_faith_events.0025.c: "이런 영예는 받아들일 수 없다."
 pam_secular_faith_events.0026.t: "사로잡힌 영혼"
 pam_secular_faith_events.0026.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )] [afflicted.GetFirstName](은)는 정신이 건강했던 적이 없었다... 그런데 이제는 심지어 제정신도 아니게 되었다.\n\n\"[ROOT.Char.GetFaith.EvilGodNames]! [ROOT.Char.GetFaith.EvilGodNames](이)가 내 안에 있다!\" [afflicted.GetSheHe]가 [ROOT.Char.GetFaith.HouseOfWorship] 바닥에서 경련하며 악을 썼다.\n\n내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 창백해졌다. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]. [afflicted.GetHerHis] 영혼이 악마에게 사로잡힌 듯합니다. 이제 [afflicted.GetHerHim]를 돕는 유일한 방법은 구마 의식뿐입니다.\""
 pam_secular_faith_events.0026.a: "[afflicted.GetSheHe|U]를 제대로 돌봐줘야겠군."
 pam_secular_faith_events.0026.b: "내가 직접 구마 의식을 수행하겠다."
 pam_secular_faith_events.0026.c: "이는 거룩한 일이니. 그대가 책임지고 완수하라."
 pam_secular_faith_events.0026.d: "공포가 퍼지기 전에 [afflicted.GetHerHim]를 데리고 나가라!"
 pam_sf_exorcism_success_toast: "구마 의식이 성공함"
 pam_sf_exorcism_failed_toast: "구마 의식이 실패함"
 pam_secular_faith_events.0027.t: "신앙의 위기"
 pam_secular_faith_events.0027.desc: "\"제 목소리가 들리십니까, [ROOT.Char.GetFaith.HighGodName]?\" 나는 속삭였다. 하지만 마음속 깊은 곳에서는 이미 알고 있었다. 그분이 나 같은 죄인에게 귀를 기울일 리 없다는 사실을.\n\n내가 [ROOT.Char.GetFaith.HighGodHerHis|U] 뜻을 잘못 해석한 걸까? [old_tenet.GetName( ROOT.Char.GetRite )](이)야말로 그분 지혜의 진정한 형태가 아니던가?\n\n빛이 십자가상을 비추고, 내 마음에는 희망이 일고 있었다."
 pam_secular_faith_events.0027.a: "[ROOT.Char.GetFaith.HighGodName](이)가 [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )](을)를 요구하신다!"
 pam_secular_faith_events.0027.b: "혹시... [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]인가?"
 pam_secular_faith_events.0027.c: "나는 망했다. 다른 이들의 운명도 마찬가지일 테지..."
 pam_secular_faith_events.0028.t: "평화를 찾은 나의 영혼"
 pam_secular_faith_events.0028.desc: "나는 [ROOT.Char.GetFaith.HouseOfWorship]에서 무릎을 꿇었다. [ROOT.Char.GetFaith.HighGodName]의 존재감이 내 영혼 구석구석으로 스며들었다.\n\n[old_tenet.GetName( ROOT.Char.GetRite )](을)를 섬기며 진리를 알게 되었다. 이런 평화는 평생 처음 느껴 본다. 이런 기쁨을 나 혼자만 간직해서야 되겠나? 다른 이들도 이 빛으로 인도해 진리를 보여줘야 하지 않겠는가?"
 pam_secular_faith_events.0028.a: "귀를 기울일 자들을 찾아 나서리라."
 pam_secular_faith_events.0028.b: "하지만 내 진정한 열정은 [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )]에 있다!"
 pam_secular_faith_events.0028.c: "내 생각을 [ROOT.Char.Custom('GetWritingMaterial')]에 적어둬야겠다."
 pam_secular_faith_events.0029.t: "망자의 방문"
 pam_secular_faith_events.0029.desc: "\"일어나십시오, [ROOT.Char.GetFirstNameNoTooltip].\" 익숙한 목소리가 울려 퍼졌다. \"제가 왔습니다, [departed.Custom2( 'RelationToMeShort', root_scope )]... 힘든 시기를 보내고 계신다는 걸 압니다.\"\n\n나는 움찔했다. 이마가 땀으로 축축했다. 환영이 잠깐 일렁이더니 사라졌다.\n\n혹시... 내 [ROOT.Char.Custom2( 'RelationToMeShort', departed )] 아닌가?"
 pam_secular_faith_events.0029.a: "[departed.GetSheHe|U]가 무사히 나를 지켜보는군."
 pam_secular_faith_events.0029.b: "혹시... 경고였을까?"
 pam_secular_faith_events.0029.c: "잘못 본 거다. 별거 아니야."
 pam_secular_faith_events.0030.t: "독수자"
 pam_secular_faith_events.0030.desc: "\"[ROOT.Char.GetFaith.HighGodName]께 더 가까이 가고 싶습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )] [would_be_anchorite.GetFirstName](이)가 엄숙하게 말했다. \"세상은 정신을 산만하게 하는 것들로 가득하기에, 온전히 홀로 있고자 합니다.\"\n\n[would_be_anchorite.GetSheHe|U]가 내 [ROOT.Char.Custom('ResidenceBuilding')]의 벽을 바라보며 손가락으로 쓸어 보았다.\n\n\"[church_scope.GetName]의 [ROOT.Char.GetFaith.HouseOfWorship](이)가 아름답더군요. 그곳의 벽 안에 은거하며 남은 평생을 끊임없는 기도로 보내고 싶습니다.\""
 pam_secular_faith_events.0030.a: "그것이 소원이라면, 내 석공들을 내어주겠네."
 pam_secular_faith_events.0030.b: "아니, 허락할 수 없군."
 pam_secular_faith_events.0031.t: "학자들의 논쟁"
 pam_secular_faith_events.0031.desc: "\"그 누가 [tenet_1.GetBaseName]의 신성함을 거부할 수 있단 말입니까?\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )] [disputant_one.GetFirstName](이)가 외쳤다.\n\n\"말도 안 되는 소리! [tenet_2.GetBaseName](이)야말로 신에게 더 가까워질 수 있는 이치이거늘! 그동안 배운 게 하나도 없으신 모양입니다?\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )] [disputant_two.GetFirstName](이)가 대꾸했다."
 pam_secular_faith_events.0031.a: "학자들의 토론이라? 내 기록장을 가져와야겠군..."
 pam_secular_faith_events.0031.b: "[tenet_1.GetBaseNameNoTooltip]에 더 끌린다."
 pam_secular_faith_events.0031.c: "[tenet_2.GetBaseNameNoTooltip](이)가 진실한 이치다."
 pam_secular_faith_events.0031.d: "활기 넘치는 [ROOT.Char.Custom('GetCourt')](이)가 곧 박식한 [ROOT.Char.Custom('GetCourt')](이)지."
 pam_secular_faith_events.0032.t: "유혹의 시간"
 pam_secular_faith_events.0032.desc_food: "잠에서 깨니 베개가 침으로 젖어 있었다. 주방에서 구운 [ROOT.Char.Custom('RegionalEdibleMeat')](와)과 [ROOT.Char.Custom('GetFoodDetail')](을)를 채운 [ROOT.Char.Custom('GetRandomRegionalSmallGame')]의 냄새가 올라왔다. 거기다 [ROOT.Char.Custom('RegionalDrink')] 잔을 부딪치며 즐겁게 떠드는 목소리들이 [ROOT.Char.Custom('ResidenceBuildingHallsType')]에 울려 퍼졌다.\n\n[ROOT.Char.GetFaith.PriestNeuterPlural](은)는 [vice_trait.GetName( GetNullCharacter )] 사람인 내게 단식을 명했다... 그런데 [ROOT.Char.GetFaith.HighGodName]께서는 어찌 이 한밤중에 나를 시험하신단 말인가?\n\n배에서 꼬르륵대는 소리가 나자 내 결의도 사라지는 게 느껴졌다."
 pam_secular_faith_events.0032.a: "내 욕구는 [ROOT.Char.GetFaith.HighGodName]께서 허락하신 것이니!"
 pam_secular_faith_events.0032.b: "아니다. 단식을 유지한다. 나 또한 버텨내리라."
 pam_secular_faith_events.0032.c: "살짝 맛만 보면 되겠지... 그 누가 알겠는가?"
 pam_secular_faith_events.0033.t: "베갯머리 설교"
 pam_secular_faith_events.0033.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )] [believing_spouse.GetFirstName](은)는 [believing_spouse.GetRite.GetName](을)를 따르며, 밤마다 그 가르침을 내게 기꺼이 들려준다.\n\n\"[ROOT.Char.Custom('RomanticComplimentAdjective')] [believing_spouse.Custom2( 'RelationToMeShort', root_scope )], [new_tenet.Custom('GetGenericTenetSentence')](이)라는 말이 참 #EMP 흥미롭지#! 않은가요?\" [believing_spouse.GetSheHe|U]가 나를 끌어안으며 말했다.\n\n[believing_spouse.GetHerHis|U] 열정은 그 미소만큼이나 매력적이었다."
 pam_secular_faith_events.0033.a: "흠, 더 얘기해 주시오..."
 pam_secular_faith_events.0033.b: "#EMP 그대#!야말로 흥미롭지! 이리 오시오."
 pam_secular_faith_events.0033.c: "부탁이오, [believing_spouse.Custom('RomanticComplimentNoun')]. 잠 좀 잡시다."
 pam_secular_faith_events.0034.t: "업둥이"
 pam_secular_faith_events.0034.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 답지 않게 늦어지고 있었다. 그런데 갓난아기의 쇠약한 울음이 들리며 [ROOT.Char.GetFaith.HouseOfWorship]의 침묵을 깨뜨렸다.\n\n\"자비로우신 [ROOT.Char.GetFaith.HighGodName](이)여...\" [chaplain.GetFirstNameNoTooltip](이)가 속삭이며 아이를 부드럽게 안았다. \"[trait_scope.GetName( GetNullCharacter )] 아이라는 이유로 버려지다니... 어떠한 영혼도 이런 일을 겪어서는 안 되는데.\"\n\n아이의 작은 손가락이 [chaplain.GetHerHis] 엄지손가락을 움켜쥐었다."
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName]께서 내게 [foundling.Custom('GetDaughterSon')]을 주셨군."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip]에서 아이를 받아들일 거다."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip](이)가 아이를 길러라."
 pam_secular_faith_events.0034.d: "어떻게 되든 내 알 바 아니다."
 pam_secular_faith_events.0035.t: "고행"
 pam_secular_faith_events.0035.desc: "바닥에 피가 있었다. 채찍 소리를 따라가니 내 [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )] [sufferer.GetFirstName](이)가 있었다. [sufferer.GetHerHis] 손에는 피투성이 채찍이 들려 있었고, 눈물이 [sufferer.GetHerHis] 뺨을 타고 흘러내리고 있었다.\n\n\"제 [sinful_trait.GetName( GetNullCharacter )] 열정이 저를 집어삼키려 합니다.\" [sufferer.GetSheHe]가 숨을 들이켰다. \"유혹의 불길보다야 채찍의 고통이 더 낫지요.\"\n\n\"이 고통도 지나갈 겁니다. 하지만 [ROOT.Char.GetFaith.NegativeAfterLife|U](은)는 떨쳐낼 수 없으니까요.\""
 pam_secular_faith_events.0035.a: "흥미롭군... 그 채찍을 이리 주게."
 pam_secular_faith_events.0035.b: "고행을 이어가게 둔다."
 pam_secular_faith_events.0035.c: "세상에, 이런 미친 짓은 그만두게나."
 pam_sf_scourge_abandoned_toast: "채찍을 버림"
 pam_secular_faith_events.0036.t: "독수자의 지혜"
 pam_secular_faith_events.0036.desc: "어느 초라한 [hermit.GetWomanMan]이 자신은 머나먼 [hermit_location.GetName]의 [hermit_location.Custom('TerrainTypeProvince')]에서 온 은둔자라며 사람들에게 설교하고 있었다.\n\n\"[ROOT.Char.GetFaith.HighGodName]께서는 제게 7일 동안 잠을 허락하지 않으셨습니다.\" [hermit.GetSheHe]가 준엄하게 말했다. \"이는 저를 벌하시기 위함이 아니라, 그대들을 위한 진리를 제 머릿속에 가득 채워 주시기 위함이었지요.\"\n\n\"제 말을 깊이 새겨들으십시오. 그러고 나면 저 또한 은둔의 삶으로 돌아갈 겁니다.\""
 pam_secular_faith_events.0036.a: "어떤 신비로운 가르침을 전해 줄 건가?"
 pam_secular_faith_events.0036.b: "배울 준비라면 되어 있다."
 pam_secular_faith_events.0036.c: "거지는 썩 물러가도록."
 pam_secular_faith_events.0037.t: "육욕의 계시"
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U](이)가 늦게까지 넘쳐흘렀다. 방문 중이던 방랑객 [reveler.GetFirstName](이)가 몸을 가까이 기울였다."
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U](이)가 늦게까지 넘쳐흘렀다. 내 [ROOT.Char.Custom2( 'RelationToMeShort', reveler )] [reveler.GetFirstName](이)가 몸을 가까이 기울였다."
 pam_secular_faith_events.0037.desc: "머지않아 내 모든 관심은 [reveler.GetHerHis] [reveler.Custom('ObjectifiedFeature')]에 쏠렸다.\n\n\"입으로 드릴 수 있는 기도가 있습니다.\" [reveler.GetSheHe]가 말하며 천천히 [reveler.Custom('GetClothingArticle')](을)를 벗었다. \"그런가 하면 육신으로 드릴 수 있는 기도도 있고요. 그래서 제가 [reveler.Custom('pam_sf_carnal_art')](을)를 보여 드릴까 합니다, [ROOT.Char.Custom('RaunchyComplimentNoun')].\"\n\n[reveler.GetSheHe|U]가 손을 내밀었다. \"이제 맞이하실 황홀경이 [ROOT.Char.GetFaith.PositiveAfterLife]의 희열에 버금갈 겁니다.\""
 pam_secular_faith_events.0037.a: "어디 보여주게. 뒤에 있는 문은 잠그도록."
 pam_secular_faith_events.0037.b: "몸을 좀 가리지 그러나."
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "똬리 튼 뱀"
 pam_sf_carnal_art_2: "승천하는 강"
 pam_sf_carnal_art_3: "휘감는 덩굴"
 pam_sf_carnal_art_4: "압박하는 포옹"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "쪼개지는 대나무"
 pam_sf_carnal_art_6: "암말의 장난"
 pam_sf_carnal_art_7: "피어나는 연꽃"
 pam_sf_carnal_art_8: "인드라의 아내"
 pam_sf_carnal_art_9: "치솟는 코브라"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "연인의 매듭"
 pam_sf_carnal_art_11: "장미와 가시"
 pam_sf_carnal_art_12: "음유시인의 비밀"
 pam_sf_carnal_art_13: "잔에 담은 불꽃"
 pam_secular_faith_events.0038.t: "낙원의 맛"
 pam_secular_faith_events.0038.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', reveler )] [reveler.GetFirstName](이)가 접시에 [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')](을)를 가득 담고 식탁 건너편에서 나를 향해 웃어 보였다.\n\n\"그대는 주린 배를 움켜쥐고, 텅 빈 잔으로 마시며 [ROOT.Char.GetFaith.HighGodName](을)를 위해 사냥하지요. 저는 익은 과실, 풍부한 고기, 웃음과 노래 속에서 신을 만납니다.\" [reveler.GetSheHe]가 가득 찬 잔을 들어 올렸다.\n\n\"[ROOT.Char.GetFaith.HighGodNamePossessive] 선물은 음미하라고 주시는 것입니다, [ROOT.Char.Custom('FormOfAddressForLiege')]. 그렇게 주어진 것을 버린다면, 그것이야말로 끔찍한 죄악 아니겠습니까!\""
 pam_secular_faith_events.0038.a: "신성함은 잔 속에 있는지도 모르겠군..."
 pam_secular_faith_events.0038.b: "그렇다면 그 선물을 기리며 연회를 열어야겠다."
 pam_secular_faith_events.0038.c: "방탕이 헌신의 탈을 썼군. 안 될 말이다."
 pam_secular_faith_events.0039.t: "어둠 속 기도"
 pam_secular_faith_events.0039.desc: "내 [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )] [spymaster_scope.GetFirstName](이)가 내게 왔다. 자신의 계략이 낳은 결과 때문에 아직 마음이 불편한 모양이었다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], 제가 기도 중이던 [secret_keeper.GetTitledFirstName] 곁에 무릎을 꿇고 거짓말을 했습니다. 작지만 경건한 거짓말을 속삭여 [secret_keeper.GetHerHis] 입을 열게 하려고 했지요.\"\n\n\"[secret_keeper.GetSheHe|U]가 [ROOT.Char.GetFaith.HighGodName]의 보금자리에서 [secret_keeper.Custom('GetSecretCrimeConfessionIndef')](을)를 고백했습니다.\" [spymaster_scope.GetSheHe]가 목소리를 낮췄다. \"전 [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )]에 관해 말했는데... 혹시 이 기만은 저희가 [ROOT.Char.GetFaith.HighGodName]께 져야 할 책무인 걸까요?\""
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName]께서는 그림자 속에서 행하시기는 하지..."
 pam_secular_faith_events.0039.b: "개탄스러운 계략이군... 비밀이 뭔지나 말하게."
 pam_secular_faith_events.0040.t: "독신자의 살"
 pam_secular_faith_events.0040.desc: "저녁 식사 시간에 [ROOT.Char.Custom2( 'RelationToMeShort', scholar )] [scholar.GetFirstName](이)가 손때 묻은 책을 펼쳤다. 강의가 또 시작되려 하고 있었다.\n\n\"[Glossary( '이세돈족', 'ISSEDONES_GLOSS' )]은 망자를 묻지 않았습니다, [ROOT.Char.Custom('FormOfAddressForLiege')]. 이 사람들은 망자를 두고 만찬을 벌였습니다!\" [scholar.GetSheHe]가 숨도 거의 쉬지 않고 말했다. \"아비의 살은 양고기와 섞였고, 그 두개골은 도금되어 소중한 성물이 되었다고 합니다. 이들에게는 그것이 자식으로서 표현할 수 있는 가장 진실한 애정이었던 겁니다.\"\n\n\"더 놀라운 건 뭔지 아십니까?\" [scholar.GetSheHe]가 씩 웃었다. \"헤로도토스는 이들을 사악하거나 미친 사람으로 여기지 않았습니다. 대신 이렇게 말했지요. #EMP '관습이야말로 만물의 지배자이다.'#!\""
 pam_secular_faith_events.0040.a: "아, 그거야 나도 잘 알지."
 pam_secular_faith_events.0040.b: "섬뜩한 관습이군... 더 들려주게."
 pam_secular_faith_events.0040.c: "아니, 제발 밥 좀 먹읍시다!"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "고대 그리스 역사가인 헤로도토스가 묘사한 먼 북쪽 초원의 민족입니다. 누군가의 아버지가 세상을 떠나면 친족은 가축을 도살하고, 그 고기를 망자의 살과 섞어 엄숙한 장례 연회에서 모두와 함께 나누어 먹었습니다. 그 뒤에는 두개골의 피부를 벗겨내고 씻긴 뒤, 도금해 신성한 성물로 보관하며 매년 희생을 통해 망자를 기렸습니다. 헤로도토스는 이러한 의식을 그리스의 화장 관습과 나란히 제시했는데, 이는 한쪽을 비난하기 위함이 아니었습니다. '관습이야말로 만물의 지배자'이며, 모든 민족은 각자의 방식을 가장 옳은 길로 여긴다는 사실을 보여주기 위함이었습니다."
 pam_secular_faith_events.0041.t: "벌거벗은 진리"
 pam_secular_faith_events.0041.desc: "정원을 거닐던 나는 [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')] 화단에서 내 [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')]의 열매를 따고 있는 이방인을 발견했다. 그런데 이 사람은 나체였고, 의복 비슷한 것이라고는 떨어지는 잎밖에 없었다.\n\n\"아, [ROOT.Char.GetTitleAsName](이)시군요! 왜 옷과 왕관으로 모습을 숨기고 계신 건가요?\" [adamite.GetSheHe]가 질문했다. [ROOT.Char.GetFaith.HighGodName](와)과 내 앞에서도 부끄러울 것 하나 없다는 모습이었다. \"저는 우리 모두 벌거벗고 두려워하지 않던 시절의 원초적인 순수함을 받아들였습니다.\"\n\n[adamite.GetSheHe|U]가 과일을 또 한입 베어 물었다. 과즙이 [adamite.GetHerHis] 피부를 타고 흘러내렸다. \"그대도 그러는 게 좋을 것 같은데요.\""
 pam_secular_faith_events.0041.a: "나 또한 이런 자유를 갈망해 왔다."
 pam_secular_faith_events.0041.b: "내 과일을 먹고, 그대의 이야기를 들려준 다음 여기서 떠나게."
 pam_secular_faith_events.0041.c: "무단 침입자를 구금한다."
 pam_secular_faith_events.0042.t: "쉽게 만들어진 길"
 pam_secular_faith_events.0042.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )] [sponsor_character.GetFirstName](이)가 정원에서 열린 지갑과 따스한 미소로 나를 맞이했다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], 제가 그대의 [GetActivityType( 'activity_pilgrimage').GetName] 비용을 대겠습니다. 순례자의 길인데 동전을 세면서 걷다니, 안 될 말이지요. 자유롭게 걸으며 우리 둘을 위해 기도해 주십시오.\"\n\n동전은 진짜다. 그 뒤에 버티고 있는 신뢰 또한 마찬가지였다."
 pam_secular_faith_events.0042.a: "감사하는 마음으로 길을 걷겠다."
 pam_secular_faith_events.0042.b: "동전을 받아서 가진다."
 pam_secular_faith_events.0042.c: "친구여, 돈은 받지 않겠네."
 pam_sf_pilgrimage_sponsor_tt: "당신이 [GetActivityType( 'activity_pilgrimage').GetName](을)를 #V 7#!년 이내에 완료하면 [sponsor_character.GetFirstName](이)가 당신을 향한 의견을 #P 50#! 획득하게 됨"
 pam_sf_pilgrimage_sponsor_toast: "기뻐하는 후원자"
 pam_secular_faith_events.0043.t: "순례자의 환영"
 pam_secular_faith_events.0043.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )] [holy_man.GetFirstName](이)가 제단 앞에서 내 손을 잡았다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], 순례자의 길을 걸으십시오. 그대가 돌아오면 그대의 [GetActivityType( 'activity_pilgrimage').GetName](을)를 [capital_county.GetNameNoTier]의 모든 광장에 알리겠습니다. 백성들 또한 [ROOT.Char.GetTitleAsNameNoTooltip](이)가 자신들을 향해 무릎 꿇었다는 사실을 알게 될 겁니다.\""
 pam_secular_faith_events.0043.a: "그렇다면 순례의 길을 걷겠다."
 pam_secular_faith_events.0043.b: "신경 써야 할 속세의 일이 더 많아서."
 pam_sf_extolled_pilgrimage_toast: "백성들이 기뻐함"
 pam_secular_faith_events.0044.t: "성직자의 귀"
 pam_secular_faith_events.0044.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )] [friendly_bishop.GetFirstName](이)가 평소와 다르게 기분이 좋아 보이는 모습으로 나타났다.\n\n\"요즘 들어 제가 동료들 사이에서 호감을 사고 있습니다. 주교, 수도원장, 그밖에 교회에서 존재감이 좀 있는 사람들 사이에서요. 혹시 그 사람들의 신실한 지혜나 도덕적인 권위가 필요하시다면, 제가 대신 잘 말해 드릴 수 있습니다.\"\n\n권력에 굶주린 [ROOT.Char.GetFaith.PriestNeuterPlural]들에게서 얻은 [friendly_bishop.GetFirstNamePossessiveNoTooltip] 호의는 쉽게 사라지기 마련이다."
 pam_secular_faith_events.0044.a: "그렇다면 나 대신 잘 말해 주게."
 pam_secular_faith_events.0044.b: "그대의 우정만으로도 충분하네."
 pam_secular_faith_events.0045.t: "깨달음"
 pam_secular_faith_events.0045.desc: "맑은 하늘에 내려치는 번개처럼, 명료한 깨달음이 찾아왔다.\n\n교리, 원리, 교파, 믿음. 한때 수천 가지 길로 갈라져 보이던 생각은 이제 내 앞에서 단 하나의 진리를 이루었다."
 pam_secular_faith_events.0045.a: "미래가 내 인도를 기다리고 있군."
 pam_secular_faith_events.0045.b: "이 순간을 만끽하겠다."
 pam_secular_faith_events.0046.t: "공통된 신념"
 pam_secular_faith_events.0046.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', intimate )] [intimate.GetFirstName](은)는 [shared_tenet.GetName( intimate.GetRite )]에 관해 이야기하며 자신의 신념을 숨기지 못했다.\n\n\"[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )](은)는 제가 하는 모든 일에 의미를 부여해 줍니다.\" [intimate.GetSheHe]가 말했다. \"그리고 저한테 그만큼 중요한 것은 단 한 가지뿐입니다... [ROOT.Char.Custom('ComplimentAdjective')] [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))], 바로 그대입니다.\"\n\n[intimate.GetHerHis] 뺨을 타고 한 줄기 눈물이 흘러내렸다. \"그냥 말씀드리고 싶었습니다.\""
 pam_secular_faith_events.0046.a: "함께 나눈 신념으로 우리의 유대도 깊어질 것이다!"
 pam_secular_faith_events.0046.b: "이 신념을 나눈다는 것은... 사랑과도 같지."
 pam_secular_faith_events.0046.c: "이야기해 줘서 고맙군."
 pam_secular_faith_events.0047.t: "사제의 헌신"
 pam_secular_faith_events.0047.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 성호를 긋고 머리를 숙였다.\n\n\"[ROOT.Char.GetFaith.HighGodName]께서 그대의 머리에 왕관을 씌워주신 데는 다 이유가 있습니다. 그대를 신실히 섬기는 것은 곧 [ROOT.Char.GetFaith.HighGodHerHis|U] 의지를 따르는 일입니다.\" [chaplain.GetSheHe]가 말했다.\n\n\"저는 [ROOT.Char.GetFaith.HighGodName](을)를 섬기기로 맹세했습니다. 이제 그대에게도 충성의 맹세를 하겠습니다.\""
 pam_secular_faith_events.0047.a: "진심으로 나를 섬겨 주시오."
 pam_secular_faith_events.0047.b: "언제나 [ROOT.Char.GetFaith.HighGodName](을)를 우선해서 섬기시오."
 pam_secular_faith_events.0048.t: "악마의 꿈"
 pam_secular_faith_events.0048.desc: "잠에서 깼지만 움직일 수가 없었다.\n\n비틀린 형상이 키득거리며 내 앞에서 춤을 추었다. 악마인가? 두려움이 천천히 차올랐다. \"헤... 헤... 네 죄악이 무겁구나. 곧 [ROOT.Char.GetFaith.EvilGodNames]께서 널 데려가실 거다!\"\n\n꿈이든 악마든, 내가 본 것을 무시할 수는 없었다. [ROOT.Char.GetFaith.HighGodName]께 가서 평화를 찾아야만 한다."
 pam_secular_faith_events.0048.a: "이 꿈... 분명 의미가 있겠지."
 pam_secular_faith_events.0048.b: "그저 꿈일 뿐이다. 다시 잠든다."
 pam_secular_faith_events.0048.c: "[ROOT.Char.GetFaith.HighGodName]께서 지켜주시기를! 회개해야만 한다."
 pam_sf_demon_torment_modifier_tt: "변화 요소를 제거하려면 [GetBuilding('temple_01').GetName] [holding|E]를 건설하거나 [GetActivityType('activity_pilgrimage').GetName]에 나서야 함"
 pam_sf_demon_torment_lifted_toast: "고통이 사라짐"
 pam_secular_faith_events.0049.t: "'천상의 위계'"
 pam_secular_faith_events.0049.desc: "예배당에서 기도가 아닌 다른 소리가 들려왔다.\n\n\"맞습니다, #emp 바로 그겁니다#!! 이 더러운 죄인에게 [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )]에서의 주제를 알려 주십시오!\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )] [lustful_priest.GetFirstName](이)가 황홀경 속에 부르짖었다. \"저는 흙 속에서 꿈틀대는 벌레이며, 세속의 욕망으로 가득한 존재입니다. #emp 저를 벌하십시오!#!\"\n\n세상에, 내 예배당에서 대체 무슨 일이 벌어지는 거지!?"
 pam_secular_faith_events.0049.a: "분명 의식이겠지, 아무래도... 기록해 둬야겠다."
 pam_secular_faith_events.0049.b: "#EMP 내#! 예배당에서 벌어지는 일이라면 #emp 나도#! 합류하겠다!"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip](이)가 이상 성욕자라고!? 역겹군. 하지만 쓸모는 있겠어."
 pam_secular_faith_events.0050.t: "[chaplain.Custom('RomanticComplimentAdjective')|U] [chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0050.desc: "[ROOT.Char.GetFaith.HouseOfWorship]의 촛불이 일렁였다. 하지만 내 머릿속에는 순수하지 못한 생각이 자꾸만 떠올랐다.\n\n\"자리로 따라오시지요, [ROOT.Char.Custom('FormOfAddressForLiege')].\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )](이)가 속삭였다. 내 시선은 [chaplain.GetHerHis] [chaplain.Custom('ObjectifiedFeature')]에 머물렀다. \"그대의 영혼을 괴롭게 하는 게 무엇이든, 두려워하지 말고 털어놓으십시오.\"\n\n[GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )](은)는 신성하다... 하지만 그 무엇보다도 무거운 죄악이 하나 있었다. 바로 [chaplain.GetFirstNamePossessive] [chaplain.Custom('AdmiredFeature')](이)다."
 pam_secular_faith_events.0050.a: "...혹시 그 자리에 둘이 들어갈 수 있나?"
 pam_secular_faith_events.0050.b: "[chaplain.GetMotherFather], 용서하소서. 제가 불순한 생각을 했습니다."
 pam_secular_faith_events.0051.t: "주 너의 하나님"
 pam_secular_faith_events.0051.desc: "#EMP \"나는 주 너의 하나님이다.\"#! [ROOT.Char.GetFaith.HouseOfWorship]에서 우레 같은 목소리가 울려 퍼졌다. #EMP \"내 앞에 경배하라.\"#!\n\n나는 무릎을 꿇었다. 눈앞이 흐릿해졌다. 얼굴을 타고 흐르는 핏줄기를 닦아냈다.\n\n#EMP \"주 너의 하나님인 내가 명하노니. 네 마음과 영혼을 다하여 내 말을 따르라.\"#! 하나의 목소리는 수백 개가 되었다. 수백의 목소리는 수천 개가 되었다. #EMP \"그러지 않는다면 너는 주이자 네 하나님인 나를 버린 것이니, 네가 무너질 때까지 저주하리라.\"#!"
 pam_secular_faith_events.0051.a: "말씀을... 따르겠습니다..."
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial 끔찍하거나 아름다운 일이 벌어지게 됨...#!"
 pam_sf_lord_your_god_tt: "[ROOT.Char.GetFaith.HighGodName]께서... 자비를 베푸시길."
 pam_sf_voice_of_jesus_toast: "예수의 목소리"
 pam_sf_stroke_of_god_toast: "신의 손길"
 pam_secular_faith_events.0052.t: "그대가 떠난 뒤"
 pam_secular_faith_events.0052.desc: "[resting_church.GetNameNoTier]의 [ROOT.Char.GetFaith.HouseOfWorship]에서 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 잠시 멈춰 섰다. 나보다 앞서 다스렸던 자들의 닳아빠진 비석 앞에서였다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')]. [ROOT.Char.GetFaith.HighGodName]께서는 그대에게 더 많은 겨울을 보도록 허락해 주셨습니다. 그대가 어떻게 안식을 취할지 선택하는 일은 죄악이 아닙니다.\"\n\n\"그대의 훌륭한 모습을 돌에 새기거나, 수도사의 [Glossary( '수수한 두건', 'AD_SUCCURRENDUM_GLOSS' )]을 택할지... 선택은 그대의 몫입니다.\""
 pam_secular_faith_events.0052.a: "내 모습을 새겨라... 더 젊고, 잘생긴 모습으로."
 pam_secular_faith_events.0052.b: "수수한 두건이면 됐다."
 pam_secular_faith_events.0052.c: "무덤은 더 기다릴 수 있겠지."
 pam_sf_effigy_planned_tt: "당신의 사망 이후 [GetActivityType( 'activity_funeral').GetName](이)가 열리면 그 주최자가 [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E]을 획득하게 됨"
 pam_sf_cowl_burial_planned_tt: "당신의 사망 이후 [GetActivityType( 'activity_funeral').GetName](이)가 열리면 그 주최자가 [piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! [piety|E]를 획득하게 됨"
 pam_sf_effigy_unveiled_toast: "정체가 공개된 형상"
 pam_sf_cowl_burial_toast: "두건을 덮고 안식을 취함"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "#G 아드 수쿠렌둠#!, 즉 임종 직전에 수도사로 서원하고 그 의복을 받으며 죽음을 맞이하는 행위는 중세 기독교 세계 전역의 위대한 영주들을 위한 최후의 안식이었습니다. 죽어가는 영주는 비단 대신 수수한 두건 속에 묻히며, 권력을 쥔 자가 아니라 수수한 형제들 사이에서 심판을 맞이하기를 바랐습니다."
 pam_secular_faith_events.0053.t: "성자의 행진"
 pam_secular_faith_events.0053.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](은)는 산파처럼 조심스럽게 성유물함의 덮개를 들어 올렸다. 안에는 우리 집안의 보물인 [procession_relic.GetName](이)가 놓여 있었다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], 신성한 유물을 자물쇠와 열쇠로 잠가 보관하면 아무에게도 도움이 되지 않습니다.\" [chaplain.GetSheHe]가 말했다. \"백성을 위해 [Glossary( '성유물 전시', 'OSTENSION_GLOSS' )]를 하시지요. 성물을 드러내고 이곳과 관문 사이의 모든 거리를 축복하십시오.\""
 pam_secular_faith_events.0053.a: "성유물함은 내가 직접 나르겠다."
 pam_secular_faith_events.0053.b: "이 기도는 내가 홀로 간직하겠다."
 pam_secular_faith_events.0053.c: "이걸 감히 옮길 생각은 없다."
 pam_sf_procession_gamble_tt: "거리는 금고가 아니며, 유물이 해를 입을지도 모름..."
 pam_sf_relic_jostled_toast: "군중 사이에서 밀쳐짐"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "성자의 성물을 엄숙히 전시하는 행위입니다. 큰 축일이 되면 성물을 보관함에서 꺼내, 거리와 들판을 가로질러 행진하며 한 곳의 제단에 매여 있던 축복을 길에서 만나는 모든 영혼에 전합니다. 행렬을 나선 성물은 가는 곳마다 군중과 금화, 명성을 끌어모읍니다."
 pam_secular_faith_events.0054.t: "대야와 천"
 pam_secular_faith_events.0054.desc: "발치에 놓인 대야에서 김이 나왔다. [ROOT.Char.Custom('GetCourt')] 사람들이 몰려들어 지켜보고 있었다. 내 앞의 의자에는 초조해하는 기색이 역력한 [pauper.Custom2('dummy_peasant_profession', pauper)] 한 명이 앉아 있었다. [pauper.GetHerHis] 발은 흙으로 뒤덮여 있었다. 냄새 또한... 심하긴 했다.\n\n바로 이날 밤, 구세주께서 대야와 천 앞에 무릎을 꿇으셨다. [Glossary( '세족식', 'MANDATUM_GLOSS' )]은 준비되었고, 물은 따뜻하며 회당의 모두가 나를 바라보고 있다.\n\n이제 무릎만 꿇으면 된다. 아니면 이 일을 다시 생각해 볼 수도 있고."
 pam_secular_faith_events.0054.deviant: "#EMP 내 혀로 이 탐스러운 발을 닦아줘야겠군.#!"
 pam_secular_faith_events.0054.a: "무릎을 꿇고 천을 집어 든다."
 pam_secular_faith_events.0054.b: "무릎을 꿇고 이 지친 발에 입을 맞춘다."
 pam_secular_faith_events.0054.c: "난... 못 하겠다. 대야를 치워 버려라."
 pam_sf_odorous_feet_tt: "무릎을 꿇으면 신성함이 내 마음을 가득 채우거나... 농노의 발냄새가 코끝에서 떨어지지 않을 것임"
 pam_sf_odorous_feet_toast: "오래가는 악취"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "세족식(Mandatum)은 최후의 만찬에서 그리스도가 했던 말인 #G 'Mandatum novum do vobis'#!, 즉 '내가 너희에게 새 계명을 주겠다'에서 그 이름을 얻었습니다. 매년 성목요일마다 콘스탄티노폴리스의 황제와 서부 전역의 왕은 선택된 거지들 앞에 대야와 천을 들고 무릎을 꿇었으며, 이들의 발을 씻겨 주고 손에는 은을 건네주었습니다. 이날 저녁만큼은 회당에서 가장 강력한 이들이 지위가 가장 낮은 이들에게 머리를 조아렸습니다."
 pam_secular_faith_events.0055.t: "청동의 목소리"
 pam_secular_faith_events.0055.desc: "[bell_church.GetName]의 오래된 종에 금이 갔으며, 따라서 다시 만들어야만 했다. 오늘 그 새로 만들어진 종이 탑에 매달려 반짝이고 있었다. 그 밑에는 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 물, 성유, 소금을 들고 서 있었다.\n\n\"종이 [ROOT.Char.GetFaith.HighGodName]의 목소리를 전하려면 먼저 [Glossary( '세례', 'BELL_BAPTISM_GLOSS' )]를 받아야만 합니다.\" [chaplain.GetSheHe]가 주장했다. 소매는 이미 걷어붙인 채였다. \"씻기고, 기름 부음을 받고, 이름을 받으면 그 어떤 마귀나 폭풍도 종의 목소리를 앗아가지 못할 겁니다.\""
 pam_secular_faith_events.0055.a: "그렇다면 씻기고, 기름을 붓고 이름을 주어라."
 pam_secular_faith_events.0055.b: "영혼이 아니라 청동일 뿐인데. 훈령집에도 그리 적혀 있다."
 pam_secular_faith_events.0055.c: "짧게 축복하는 정도면 되겠지. 종이나 울리게 하라."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "교회의 종은 기독교인과 마찬가지로 축성되었습니다. 성수로 씻기고, 기름 부음을 받고 성자의 이름까지 부여받았으며 일부 종은 대부모까지 있었습니다. 789년 카롤루스 대제의 #G 일반 훈령(Admonitio Generalis)#!에서 종의 세례를 금지했으나, 해당 관습은 수 세기 동안 이어졌습니다. 세례받은 종은 그 소리가 울려 퍼지는 곳은 어디든 폭풍과 우박, 악마를 사라지게 한다고 여겨졌습니다. 나중에는 주조자들이 종에 '나는 번개를 부순다'라는 뜻의 #G Fulgura frango#! 문구를 새겨 만들기도 했습니다."
 pam_secular_faith_events.0056.t: "회당의 참새"
 pam_secular_faith_events.0056.desc: "겨울의 어둠 속에서 참새 한 마리가 날아와, 횃불의 연기와 웃음을 뚫고 [ROOT.Char.Custom('ResidenceBuildingHallType')](을)를 가로질러 날아가다 [ROOT.Char.Custom('ResidenceBuildingWindowType')](으)로 나가 버렸다.\n\n[ROOT.Char.Custom('GetCourt')] 전체가 웃음을 터뜨렸다. 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName]만은 그러지 못했다.\n\n[Glossary( '인간의 삶도 이와 다를 바 없습니다', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. 빛과 온기의 순간은 잠깐이고, 다시 어둠으로 나가 또 다른 어둠으로 들어갑니다. 그 전과 이후에 무엇이 기다리고 있을지는 [ROOT.Char.GetFaith.HighGodName]만이 아실 겁니다.\""
 pam_secular_faith_events.0056.scholar: "베다도 그런 글을 썼더랬지. 토씨 하나 안 틀리고 똑같이 말이야."
 pam_secular_faith_events.0056.a: "그렇다면 빛 속의 순간을 잘 보내야겠군."
 pam_secular_faith_events.0056.b: "그저 새 한 마리였는데. 포도주나 더 마시지."
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "베다의 이야기에 따르면, 노섬브리아에서 에드윈 왕의 어느 조언자가 사람의 삶을 겨울밤 따뜻한 연회장을 날아다니는 참새에 비유했습니다. 빛과 안락함 속을 잠깐 지나가다 폭풍 속으로 나가고, 다시 돌아오기를 반복합니다. 그 전과 이후의 일은 아무도 알지 못합니다. 새로운 신앙이 그 회당 너머의 일에 관한 질문에도 대답해 줄 수 있다면, 그 신앙을 따라야 마땅하다는 주장이었습니다. 이에 에드윈 왕도 이해했다고 합니다."
 pam_secular_faith_events.0057.t: "교회의 에일"
 pam_secular_faith_events.0057.desc: "내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 손에 이미 가득 찬 맥주잔을 들고서 [ale_church.GetName](으)로 가득한 교회 뜰에 서 있었다. 주변에는 교구 사람들의 절반이 앉은 탁자와 [GetBuilding('breweries_01').GetName]에서 방금 굴려서 온 통이 가득했다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], 지붕에서는 물이 새고 십일조는 부족하기 짝이 없습니다. 그래서 수도사들이 양조하고, 우리가 그걸 팝니다. 교구는 지붕 값을 다 갚을 수 있을 때까지 [Glossary( '교회의 에일', 'CHURCH_ALE_GLOSS' )]을 마시고요.\"\n\n\"모든 잔이 선행이나 다름없습니다. 한 잔 드시겠습니까?\""
 pam_secular_faith_events.0057.a: "그렇다면 나도 한 잔 주게. 지붕을 위해."
 pam_secular_faith_events.0057.b: "에일은 아끼게. 지붕 대금은 내가 치르지."
 pam_secular_faith_events.0057.c: "술이라고? 이 신성한 땅에서? 다 쏟아버려라."
 pam_sf_church_ale_gamble_tt: "모든 잔은 지붕을 위한 것이며, 교구에서 빚는 술은 강하다..."
 pam_sf_church_ale_toast: "아침의 숙취"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "교회 뜰에서 기부받은 곡물로 양조한 에일을 파는 교구 연회였으며, 여기서 얻는 수익은 비가 새는 지붕, 새로운 종, 빈민을 위한 빵 등 교회의 유지 비용으로 쓰였습니다. 시노드마다 신성한 땅에서 술을 마시는 행위를 비난했지만, 교구마다 양조를 계속 이어갔습니다. 많은 마을 교회에서는 십일조보다 에일이 훨씬 더 많은 돈을 가져다주었기 때문입니다."
 pam_secular_faith_events.0058.t: "Quid mus sumit?"
 pam_secular_faith_events.0058.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 제단의 천만큼 창백해진 얼굴로 뛰어 들어왔다. 손에는 은으로 된 작은 [Glossary( '성체함', 'PYX_GLOSS' )]을 불이라도 붙은 것처럼 쥐고 있었다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], 쥐가 이른 밤에 상자를 갉아 먹고 [Glossary( '성체', 'RESERVED_HOST_GLOSS' )]까지 먹어 치웠습니다!\"\n\n[chaplain.GetSheHe|U]는 말도 제대로 하지 못했다. \"학자들이 [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )]이라는 물음을 던지는데... 그러니까, 쥐가 먹은 게 대체 무엇이란 말입니까? 어떻게 해야 하지요?\""
 pam_secular_faith_events.0058.scholar: "진정하라. 쥐는 그저 빵을 먹었을 뿐이니."
 pam_secular_faith_events.0058.mean: "#EMP 쥐#!가 [ROOT.Char.GetFaith.HighGodName]께 입을 대도록 두었단 말이냐!? 당장 [ROOT.Char.Custom('GetCourt')]에서 썩 꺼져라!"
 pam_secular_faith_events.0058.a: "더 좋은 자물쇠가 달린 성체함을 사라."
 pam_secular_faith_events.0058.b: "그렇다면 쥐가 뭐 저주라도 받는단 말인가? 하!"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! '쥐가 무엇을 먹는가?' 학자들의 진지한 토론을 불러일으킨 질문입니다. 쥐가 성체를 먹었다면, 이 쥐는 신의 몸을 먹은 것일까요? 교회법에서는 성체를 부주의하게 관리한 사제들이 보속해야 한다고 규정했습니다. 반면 위대한 신학자들은 성체가 자격이 없는 자의 입 앞에서는 스스로 모습을 감추므로, 쥐는 단지 빵의 외형만을 먹었을 뿐이라는 결론을 내렸습니다."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "뚜껑이 달린 작은 상자로, 보통 은이나 도금으로 만들어집니다. 예배에 사용할 성체를 보관하는 용도였습니다. 교회법에 따르면 성체는 잠긴 상자에 깨끗하게 보관해야 하며, 불경한 자나 굶주린 이들의 손이 닿지 않도록 주의해야 합니다."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "예배에서 축성한 뒤, 병자나 죽어 가는 이들이 언제든 받을 수 있도록 교회에서 따로 보관하는 빵입니다. 축성된 빵은 진정한 신의 몸으로 여겨졌으며, 따라서 이 빵의 보관 역시 가장 중요한 사안이 되었습니다."
 pam_secular_faith_events.0059.t: "주일"
 pam_secular_faith_events.0059.desc: "새벽이 되자 [sighting_county.GetBaseNameNoTier]의 [sighting_province.Custom('GetTerrainTypePlural')]에서 [sighting_county.Custom('GetAnimalAdjective')] [sighting_county.Custom('GetAnimalType')](이)가 나타났다는 소식이 들려왔다. 뜰에서 사냥개들이 으르렁거렸고, 말들은 발을 굴렀다. 그러나 내 [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName](이)가 문 앞에 서 있었다.\n\n\"[Glossary( '안식일', 'LORDS_DAY_GLOSS' )]입니다, [ROOT.Char.Custom('FormOfAddressForLiege')]. 종이 울렸습니다. 예배 시간입니다!\"\n\n\"말을 달릴 시간이라면 [ROOT.Char.GetFaith.HighGodName]께서 6일이나 주셨습니다. 그런데도 오늘 하루까지 탐내셔야 하겠습니까?\""
 pam_secular_faith_events.0059.a: "말에서 안장을 내려라. 예배에 참석한다."
 pam_secular_faith_events.0059.b: "[sighting_county.Custom('GetAnimalType')](은)는 기다려 주지 않는다. 말을 달려라!"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "일주일의 첫날은 부활을 기념해 신성하게 여겨집니다. 공의회에서는 힘든 노동, 시장의 영업, 나태한 오락을 금지했으며 기독교 왕들은 이 금지령을 법으로 제정했습니다. 비록 많은 영주가 사슴 사냥과 같은 일을 설교처럼 자신과 신 사이의 문제로 여기긴 했지만 말입니다."
 pam_secular_faith_events.0060.t: "짐을 덜어낸 삶"
 pam_secular_faith_events.0060.desc: "빈 금고와 내면의 갈등에 괴로워하며 [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]의 거리에서 말을 달리던 중, 어느 거지가 눈에 들어왔다.\n\n속세의 소유에서 자유로운 모습의 [hermit.GetSheHe]가 춤을 추고 있었다. 이 세상에서 자신의 자리를 받아들인 자만이 가질 수 있는 평화와 이해심이 느껴졌다. 나를 고통스럽게 하는 번뇌에 얽매이지 않은 영혼이었다.\n\n어쩌면 [hermit.GetSheHe]의 진리가 나를 자유롭게 해줄 수 있을지도 모른다."
 pam_secular_faith_events.0060.a: "가진 게 적을수록 나다워지는구나!"
 pam_secular_faith_events.0060.b: "내 새장을 다시 한번 도금하리라!"
 pam_secular_faith_events.0060.c: "이 빗속을 빠져나가자."
