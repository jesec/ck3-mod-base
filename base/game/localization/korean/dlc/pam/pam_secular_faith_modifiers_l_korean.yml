l_korean:
 pam_sf_devotion_modifier: "번영을 향한 헌신"
 pam_sf_devotion_modifier_desc: "해당 인물은 남몰래 신앙에 헌신했으며, 그 보답으로 조용히 신앙심과 재물을 얻었습니다."
 pam_sf_grace_modifier: "내려진 은총"
 pam_sf_grace_modifier_desc: "해당 인물은 감사를 표하거나 조용히 서원하여 마음을 고양하는 은총을 받았습니다."
 pam_sf_consolation_modifier: "평온한 마음"
 pam_sf_consolation_modifier_desc: "해당 인물은 마음의 평온을 얻었습니다."
 pam_sf_visionary_renown_modifier: "선포된 계시"
 pam_sf_visionary_renown_modifier_desc: "해당 인물은 궁정에 신성한 계시를 선포하여 명망을 드높였습니다."
 pam_sf_consecrated_arms_modifier: "축성된 무기"
 pam_sf_consecrated_arms_modifier_desc: "해당 인물의 가문 무기는 성스러운 축일에 축복을 받았습니다."
 pam_sf_serenity_modifier: "공개 의식 장려"
 pam_sf_serenity_modifier_desc: "해당 인물은 공개적으로 신앙심을 드러내 성직자와 궁정의 호감을 얻었습니다."
 pam_sf_humiliated_modifier: "굴욕적인 서원"
 pam_sf_humiliated_modifier_desc: "해당 인물은 강제로 성스러운 서원을 하고 수도원에 유폐되었습니다."
 pam_sf_promised_acclaim_modifier: "순례자의 약속"
 pam_sf_promised_acclaim_modifier_desc: "해당 인물이 다음 순례를 마치면 봉역 사제가 그 사실을 수도의 백성들에게 널리 알리겠다고 약속했습니다.\n\n순례를 완료하면 해당 인물의 [capital|E]가 #V 15#!년 동안 [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip] 효과를 획득합니다."
 pam_sf_extolled_pilgrimage_county_modifier: "순례자의 환영"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "영주의 순례 소식이 해당 영지 곳곳에 울려 퍼지고, 백성들은 그 자부심에 고무되어 번영을 누리고 있습니다."
 pam_sf_free_feast_discount_desc: "다가오는 연회"
 pam_sf_free_feast_modifier: "연회를 향한 갈망"
 pam_sf_free_feast_modifier_desc: "성스러운 향락을 살짝 맛본 탓에 해당 인물의 식욕이 더욱 왕성해졌습니다.\n$EFFECT_LIST_BULLET$다음 [GetActivityType( 'activity_feast').GetName] 비용: [gold_i]#P -100%#!\n#weak 연회가 시작되면 사라집니다.#!"
 pam_sf_pilgrimage_funded_modifier: "후원받는 순례"
 pam_sf_pilgrimage_funded_modifier_desc: "후원자가 해당 인물의 다음 순례 비용 일부를 부담하기로 약속했습니다.\n$EFFECT_LIST_BULLET$[GetActivityType( 'activity_pilgrimage').GetName] 비용: [gold_i]#P -50%#!"
 pam_sf_pilgrimage_funded_discount_desc: "후원받는 순례"
 pam_sf_ear_of_clergy_modifier: "성직자의 귀를 사로잡음"
 pam_sf_ear_of_clergy_modifier_desc: "교회가 해당 인물의 탄원을 받아들일 가능성이 증가합니다.\n$EFFECT_LIST_BULLET$#V $hof_ask_for_claim_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $hof_ask_for_gold_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_excommunication_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_legitimacy_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $ecclesiastic_grant_claim_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $strengthen_claim_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_enforce_succession_interaction$#! 승낙 확률: #P +25#!\n$EFFECT_LIST_BULLET$#V $request_white_peace_interaction$#! 승낙 확률: #P +25#!"
 pam_religious_delirium_modifier: "종교적 망상"
 pam_religious_delirium_modifier_desc: "해당 인물은 하늘이 자신에게 직접 말을 건다고 확신합니다.\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E] 획득량: #P +50%#!\n$EFFECT_LIST_BULLET$[spiritual_fulfillment|E] 상실량: #N +50%#!"
 pam_sf_church_builder_modifier: "교회 건설자"
 pam_sf_church_builder_modifier_desc: "해당 인물은 첫 예배당을 세워 교회를 조금 더 저렴하게 건설할 수 있으며, 꾸준히 신앙심을 얻습니다."
 pam_sf_scriptorium_county_modifier: "작업 중인 필경사"
 pam_sf_scriptorium_county_modifier_desc: "이곳에 정착한 학자들이 해당 영지의 장부를 필사하고 보관합니다."
 pam_sf_doctrine_clarity_modifier: "깨달음"
 pam_sf_doctrine_clarity_modifier_desc: "해당 인물은 좀처럼 찾아오지 않는 명료한 깨달음의 순간을 경험했습니다."
 pam_sf_favorable_omen_modifier: "길조"
 pam_sf_favorable_omen_modifier_desc: "해당 인물은 하늘의 징조를 신의 총애를 나타내는 징표로 받아들이며, 신자들은 그 축복에 용기를 얻습니다."
 pam_sf_omen_of_victory_modifier: "승리의 징조"
 pam_sf_omen_of_victory_modifier_desc: "해당 인물과 그 군대는 하늘이 승리를 약속했다고 확신하여 두려움 없이 진군합니다."
 pam_sf_demon_torment_modifier: "악마에 의한 고통"
 pam_sf_demon_torment_modifier_desc: "해당 인물은 자신이 악마에게 시달리고 있다고 확신하며, [GetBuilding('temple_01').GetName] [holding|E]를 건설하거나 [GetActivityType('activity_pilgrimage').GetName](을)를 떠나야 한다고 믿습니다."
 pam_sf_besieged_by_demons_modifier: "악마에게 포위됨"
 pam_sf_besieged_by_demons_modifier_desc: "해당 인물의 정신은 악마에게 포위되어 광란과 경련에 시달리며, 날이 갈수록 이성을 더욱 잃어 가고 있습니다."
 pam_sf_grief_solace_modifier: "영혼에게 위로받음"
 pam_sf_grief_solace_modifier_desc: "해당 인물은 유령이 찾아왔다고 주장한 뒤 마음의 평온을 얻었습니다."
 pam_sf_grief_warning_modifier: "영혼의 경고"
 pam_sf_grief_warning_modifier_desc: "해당 인물은 유령에게 경고를 받았다고 믿고 있습니다."
 pam_sf_peace_of_god_modifier: "신의 평화"
 pam_sf_peace_of_god_modifier_desc: "해당 인물은 봉역 전역에서 신의 평화를 맹세하고 시행했습니다."
 pam_sf_immured_anchorite_modifier: "단절한 독수자"
 pam_sf_immured_anchorite_modifier_desc: "해당 사원의 벽실에는 세상과 단절되어 수도하는 독수자가 있습니다."
 pam_sf_voice_of_jesus_modifier: "신의 목소리"
 pam_sf_voice_of_jesus_modifier_desc: "해당 인물은 자신에게 말을 거는 신성한 목소리를 듣고 완전히 변모했으며, 마치 신의 손길이 닿은 듯 모든 능력이 예리해졌습니다."
 pam_sf_stroke_of_god_modifier: "신의 손길"
 pam_sf_stroke_of_god_modifier_desc: "해당 인물은 갑작스러운 뇌졸중으로 쓰러졌습니다. 의사들이 '신의 손길'이라 부르는 이 병은 신이 내리친 듯 뇌에 출혈을 일으켜 육체와 정신에 심각한 장애를 남깁니다."
 pam_sf_lingering_stench_modifier: "가시지 않는 악취"
 pam_sf_lingering_stench_modifier_desc: "아무리 애를 써도 해당 인물은 자신이 씻겨 준 빈민의 발 냄새를 잊을 수 없습니다."
 pam_sf_site_of_miracle_county_modifier: "기적이 일어난 곳"
 pam_sf_site_of_miracle_county_modifier_desc: "해당 영지는 기적이 일어난 곳으로, 순례자와 도적 모두를 불러 모으고 있습니다."
 pam_sf_consecrated_county_modifier: "새로운 봉헌"
 pam_sf_consecrated_county_modifier_desc: "해당 영지에는 새로 봉헌된 교회가 있습니다."
 pam_sf_flagellant_cults_county_modifier: "채찍질 고행자 집단"
 pam_sf_flagellant_cults_county_modifier_desc: "참회자 무리가 해당 영지의 거리를 돌아다니며 스스로를 채찍질하고 있습니다."
 pam_sf_relic_procession_county_modifier: "성자의 행차"
 pam_sf_relic_procession_county_modifier_desc: "성자의 성물을 모신 엄숙한 행렬이 해당 영지를 지나갔으며, 백성들은 이를 자랑스럽게 여기고 있습니다."
 pam_sf_blessed_bell_county_modifier: "세례받은 종"
 pam_sf_blessed_bell_county_modifier_desc: "해당 영지의 교회 종은 씻기고 도유된 뒤 이름을 받았습니다. 백성들은 그 종소리가 폭풍과 악귀를 모두 몰아내리라 믿습니다."
 pam_sf_church_ale_county_modifier: "교회 에일"
 pam_sf_church_ale_county_modifier_desc: "해당 영지의 영주는 교구민들과 함께 교회 에일을 마셨으며, 교구민들은 아직도 그 이야기를 입에 올리고 있습니다."
 pam_sf_safe_passage_modifier: "안전한 통행"
 pam_sf_safe_passage_modifier_desc: "해당 여행자는 길에서 구조된 뒤 호위와 안전 통행을 보장받았습니다."
 pam_sf_waylaid_road_modifier: "길에서 당한 습격"
 pam_sf_waylaid_road_modifier_desc: "해당 여행자는 길에서 습격을 당한 뒤 여정이 위험해졌습니다."
 pam_sf_penance_lustful_modifier: "음욕 억제"
 pam_sf_penance_lustful_modifier_desc: "해당 인물은 음욕을 보속하며 욕망을 다스리고 있지만, 그 대가로 자녀를 얻을 가능성이 줄어듭니다."
 pam_sf_penance_chaste_modifier: "절제 타파"
 pam_sf_penance_chaste_modifier_desc: "해당 인물은 자신의 본성에 거슬러, 신앙에서 죄악으로 여기는 정결함을 버리고 있습니다."
 pam_sf_penance_gluttonous_modifier: "금식의 나날"
 pam_sf_penance_gluttonous_modifier_desc: "해당 인물은 탐식을 보속하며 금식하여, 영혼을 살찌우기 위해 육신을 쇠약하게 하고 있습니다."
 pam_sf_penance_temperate_modifier: "긴 단식의 끝"
 pam_sf_penance_temperate_modifier_desc: "해당 인물은 신앙에서 죄악으로 여기는 절제를 버리고 있으며, 마음도 씀씀이도 한층 헤퍼졌습니다."
 pam_sf_penance_greedy_modifier: "참회의 구휼"
 pam_sf_penance_greedy_modifier_desc: "해당 인물은 탐욕을 보속하며 구휼을 베풀고 있어, 금고도 양심의 짐도 한결 가벼워졌습니다."
 pam_sf_penance_generous_modifier: "닫힌 지갑"
 pam_sf_penance_generous_modifier_desc: "해당 인물은 신앙에서 죄악으로 여기는 관대함을 억누르고 있어, 재산은 늘지만 사람들의 원망을 사고 있습니다."
 pam_sf_penance_lazy_modifier: "참회의 노동"
 pam_sf_penance_lazy_modifier_desc: "해당 인물은 나태를 보속하기 위해 고된 노동에 나서고 있습니다."
 pam_sf_penance_diligent_modifier: "강요된 휴식"
 pam_sf_penance_diligent_modifier_desc: "해당 인물은 신앙에서 죄악으로 여기는 근면함을 내려놓고 있어, 한결 평온해진 대신 생산성이 떨어졌습니다."
 pam_sf_penance_wrathful_modifier: "분노 억제"
 pam_sf_penance_wrathful_modifier_desc: "해당 인물은 보속의 일환으로 분노를 억누르고 있어, 손길은 온화해졌지만 칼날은 무뎌졌습니다."
 pam_sf_penance_calm_modifier: "투지 고조"
 pam_sf_penance_calm_modifier_desc: "해당 인물은 자신의 신앙에서 죄악으로 여기는 침착한 성향을 열성으로 바꾸고 있어, 한층 사나워진 대신 긴장도 커졌습니다."
 pam_sf_penance_patient_modifier: "재촉하는 발걸음"
 pam_sf_penance_patient_modifier_desc: "해당 인물은 자신의 신앙에서 죄악으로 여기는 인내심을 버리고 있어, 조급해지고 마음도 편치 않습니다."
 pam_sf_penance_impatient_modifier: "인내심 함양"
 pam_sf_penance_impatient_modifier_desc: "해당 인물은 조급한 성미를 보속하며 인내심을 기르고 있지만, 기다리는 시간을 견디기 어려워합니다."
 pam_sf_penance_arrogant_modifier: "겸손 실천"
 pam_sf_penance_arrogant_modifier_desc: "해당 인물은 보속의 일환으로 교만한 태도를 낮추고 있으며, 그와 함께 명성도 쇠하고 있습니다."
 pam_sf_penance_humble_modifier: "교만한 태도"
 pam_sf_penance_humble_modifier_desc: "해당 인물은 겸손보다 교만을 중시하는 자신의 신앙에 따라 교만한 태도를 취하고 있어, 명성은 높아지지만 허영심이 많다는 평가를 받고 있습니다."
 pam_sf_penance_deceitful_modifier: "솔직함의 서원"
 pam_sf_penance_deceitful_modifier_desc: "해당 인물은 기만을 보속하며 정직하게 처신하겠다는 서원을 지키고 있어, 교활함이 무뎌졌습니다."
 pam_sf_penance_honest_modifier: "가식 익히기"
 pam_sf_penance_honest_modifier_desc: "해당 인물은 정직보다 간계를 중시하는 자신의 신앙에 따라 가식을 익히고 있어, 한층 영악해진 대신 신뢰는 덜 받고 있습니다."
 pam_sf_penance_craven_modifier: "두려움과의 대면"
 pam_sf_penance_craven_modifier_desc: "해당 인물은 비겁함에 대해 보속하며 물러서지 않고 버티고 있지만, 매 순간 두려움에 떨고 있습니다."
 pam_sf_penance_brave_modifier: "용맹 절제"
 pam_sf_penance_brave_modifier_desc: "해당 인물은 자신의 신앙에서 죄악으로 여기는 용맹을 억눌러 신중함을 기르고 있으며, 그만큼 전사로서의 기량도 무뎌졌습니다."
 pam_sf_penance_shy_modifier: "억지로 낸 대담함"
 pam_sf_penance_shy_modifier_desc: "해당 인물은 내성적인 성격을 보속하고자 억지로 대담한 모습을 보이고 있으며, 사람들과 모일 때마다 고역을 치르고 있습니다."
 pam_sf_penance_gregarious_modifier: "침묵 속의 고립"
 pam_sf_penance_gregarious_modifier_desc: "해당 인물은 죄악으로 여기는 흥청거림을 멀리하고 침묵으로 물러나, 그만큼 친구도 줄어들었습니다."
 pam_sf_penance_ambitious_modifier: "야심 억제"
 pam_sf_penance_ambitious_modifier_desc: "해당 인물은 보속의 일환으로 높은 곳을 바라보던 눈을 낮추고 있으며, 그와 함께 명성도 낮아지고 있습니다."
 pam_sf_penance_content_modifier: "욕망의 불씨"
 pam_sf_penance_content_modifier_desc: "해당 인물은 자신의 신앙에서 죄악으로 여기는 만족감을 떨쳐 내고 욕망을 부추기고 있어, 안주하지 않고 끊임없이 더 높은 곳을 추구하고 있습니다."
 pam_sf_penance_arbitrary_modifier: "공정한 통치"
 pam_sf_penance_arbitrary_modifier_desc: "해당 인물은 독선적인 통치를 보속하며 치우침 없이 공정하게 다스리고 있어, 더욱 공평해진 대신 재산은 줄어들고 있습니다."
 pam_sf_penance_just_modifier: "자의적 통치"
 pam_sf_penance_just_modifier_desc: "해당 인물은 공정보다 자의적인 통치를 중시하는 신앙에 따라 제멋대로 다스리고 있어, 재산은 늘어난 대신 사람들의 사랑을 덜 받고 있습니다."
 pam_sf_penance_cynical_modifier: "되살아나는 신앙"
 pam_sf_penance_cynical_modifier_desc: "해당 인물은 냉소를 보속하며 믿음을 되살리고 있지만, 새삼 받아들인 신앙은 아직 낯선 옷처럼 어색합니다."
 pam_sf_penance_zealous_modifier: "열광의 절제"
 pam_sf_penance_zealous_modifier_desc: "해당 인물은 지나친 열광을 경계하는 신앙에 따라 열정을 누그러뜨리고 있어, 독실한 이들의 태도도 덩달아 싸늘해지고 있습니다."
 pam_sf_penance_paranoid_modifier: "신뢰의 학습"
 pam_sf_penance_paranoid_modifier_desc: "해당 인물은 의심을 보속하며 타인을 신뢰하는 법을 배우고 있어, 마음의 문을 열고 경계도 늦추고 있습니다."
 pam_sf_penance_trusting_modifier: "마음의 경계"
 pam_sf_penance_trusting_modifier_desc: "해당 인물은 지나친 신뢰를 경계하는 신앙에 따라 타인을 경계하고 있어, 더욱 조심스러워진 대신 냉정하다는 평을 받고 있습니다."
 pam_sf_penance_compassionate_modifier: "자비 억제"
 pam_sf_penance_compassionate_modifier_desc: "해당 인물은 자비를 죄악으로 여기는 신앙에 따라 자비심을 억누르고 있어, 더욱 냉혹해진 모습을 사람들이 두려워하게 되었습니다."
 pam_sf_penance_callous_modifier: "자비 함양"
 pam_sf_penance_callous_modifier_desc: "해당 인물은 냉담한 마음을 보속하며 자비를 기르고 있어, 사람들을 한층 온화하게 대하는 대신 그간 이용해 온 타인의 두려움은 사그라들고 있습니다."
 pam_sf_penance_sadistic_modifier: "잔혹함 포기"
 pam_sf_penance_sadistic_modifier_desc: "해당 인물은 보속의 일환으로 잔혹함을 버리고 있어, 잔혹한 행위로 불러일으켰던 공포도 사그라들고 있습니다."
 pam_sf_penance_stubborn_modifier: "의지 굴복"
 pam_sf_penance_stubborn_modifier_desc: "해당 인물은 완고함을 보속하며 자신의 고집을 꺾고 바로잡으려 하고 있어, 전에는 굽히지 않았을 일에도 양보하고 있습니다."
 pam_sf_penance_fickle_modifier: "마음의 안정"
 pam_sf_penance_fickle_modifier_desc: "해당 인물은 변덕스러움을 보속하며 한결같은 태도를 유지하고 있지만, 그러한 절제가 못내 답답합니다."
 pam_sf_penance_eccentric_modifier: "관습 수용"
 pam_sf_penance_eccentric_modifier_desc: "해당 인물은 기이한 성향을 보속하며 남들과 다른 기묘한 생각을 내려놓고 있습니다."
 pam_sf_penance_vengeful_modifier: "용서의 실천"
 pam_sf_penance_vengeful_modifier_desc: "해당 인물은 복수심을 보속하며 오랜 원한을 풀고 있어, 포로를 더욱 너그럽게 대하는 대신 보복에는 한층 더디게 나섭니다."
 pam_sf_penance_forgiving_modifier: "앙금 키우기"
 pam_sf_penance_forgiving_modifier_desc: "해당 인물은 용서보다 원한을 품을 것을 요구하는 신앙에 따라 앙금을 키우고 있어, 더욱 냉정해지고 사람들의 두려움도 더 사고 있습니다."
 pam_mystical_birthright_spiritual_leader_modifier: "상서로운 생득권"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "태어날 때부터 지닌 징표가 해당 인물의 종교적 양육에 영향을 미쳤습니다."
 pam_personal_sacrifice_of_wealth_county_modifier: "신앙을 위한 투자"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "한 영주가 신앙을 위해 바친 재물이 이 영지의 성장을 촉진하고 있습니다."
 pam_sf_grinding_modifier: "영혼을 갉아먹는 노동"
 pam_sf_grinding_modifier_desc: "해당 인물은 쉴 새 없이 일에 매달리며, 그 탓에 영혼이 고통받고 있습니다."
