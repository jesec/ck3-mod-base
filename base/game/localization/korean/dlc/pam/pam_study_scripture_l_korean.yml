 pam_ss_word_offices: "성무일도"
 pam_ss_word_daily_prayers: "매일 드리는 기도"
 pam_ss_word_daily_rites: "매일 행하는 의례"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "학업 중단"
 pam_lapsed_studies_modifier_desc: "해당 인물은 절망에 빠져 신앙 탐구를 포기했습니다."
 pam_renewed_zeal_modifier: "되살아난 열광"
 pam_renewed_zeal_modifier_desc: "해당 인물은 엄한 훈계를 받고 다시 학업에 전념하기 시작했습니다.\n[GetScheme('study_scripture').GetTypeName] [success_chance|E]: #P +10%#!"
 pam_inspired_study_modifier: "고무된 학업"
 pam_inspired_study_modifier_desc: "사려 깊은 선물이 이 학업에 진전을 더합니다."
 pam_cloistered_rigor_modifier: "은거와 정진"
 pam_cloistered_rigor_modifier_desc: "외부와 단절한 채 철저하고 엄격하게 학업에 매진합니다."
 pam_cloistered_rigor_personal_modifier: "은거 중 학업"
 pam_cloistered_rigor_personal_modifier_desc: "해당 인물은 성스러운 학문에 한 치의 흐트러짐 없이 매진하고자 세속의 일에서 물러났습니다."
 pam_measured_devotion_modifier: "한결같은 헌신"
 pam_measured_devotion_modifier_desc: "해당 학업은 따로 마련한 시간마다 꾸준히 진척되고 있습니다."
 pam_measured_devotion_personal_modifier: "경전 학습에 전념하는 학생"
 pam_measured_devotion_personal_modifier_desc: "해당 인물은 한결같고 절도 있는 신심으로 신앙 탐구에 힘쓰고 있습니다."
 pam_mortified_flesh_modifier: "육신의 고행"
 pam_mortified_flesh_modifier_desc: "단식과 철야 기도로 해당 학업에 더욱 집중할 수 있게 되었습니다."
 pam_divine_favor_modifier: "신성한 은총"
 pam_divine_favor_modifier_desc: "해당 학업은 축복 속에서 진행되고 있습니다."
 pam_devoted_acolyte_modifier: "헌신적인 시종"
 pam_devoted_acolyte_modifier_desc: "헌신적인 조력자가 해당 학업에 필요한 모든 일을 세심히 챙깁니다."
 pam_amanuensis_modifier: "충실한 필경사"
 pam_amanuensis_modifier_desc: "충실한 조수가 기록과 문서를 빈틈없이 정리합니다."
 pam_persistent_devotions_modifier: "굳건한 헌신"
 pam_persistent_devotions_modifier_desc: "난관은 오히려 해당 학업에 임하는 자세를 더욱 깊게 만들었습니다."
 pam_renowned_exegete_modifier: "명망 있는 주해가"
 pam_renowned_exegete_modifier_desc: "해당 인물은 경전을 깊이 읽고 해석하여 [Glossary('주해가', 'GLOSS_EXEGETE')]가 되었습니다."
 pam_doctrinal_clarity_modifier: "명료한 교리 이해"
 pam_doctrinal_clarity_modifier_desc: "해당 인물은 자신의 신앙 교리를 보기 드물 정도로 명확하게 이해합니다.\n\n$sway_ruler_to_my_rite_interaction$ 승낙 확률: #p +20#!\n$pam_evangelize_personal_tenet_interaction$ 승낙 확률: #p +20#!\n$pam_evangelize_personal_tenet_interaction$ [piety|E] 비용: #p -50%#!"
 pam_known_in_the_synod_modifier: "시노드에서 이름이 알려짐"
 pam_known_in_the_synod_modifier_desc: "해당 인물의 학식은 성직자 사이에 널리 알려져 있습니다."
 pam_assisted_by_theologians_modifier: "신학자들의 도움을 받음"
 pam_assisted_by_theologians_modifier_desc: "학식 있는 신학자들이 해당 인물을 돕고 있습니다."
 pam_known_by_mystics_modifier: "신비가 사이에서 알려짐"
 pam_known_by_mystics_modifier_desc: "해당 인물은 신비가와 관상 수행자 사이에서 좋은 평가를 받고 있습니다."
 pam_monastic_copyists_modifier: "수도원 필사자"
 pam_monastic_copyists_modifier_desc: "지칠 줄 모르는 수도원 필사자들이 해당 학업에 필요한 문헌을 끊임없이 새로 필사해 줍니다."
 pam_charterhouse_silence_modifier: "카르투시오회의 침묵"
 pam_charterhouse_silence_modifier_desc: "침묵을 지키는 관상 수행자들의 엄격한 생활이 해당 학업을 꾸준히 이어 갈 수 있게 합니다."
 pam_pastoral_letter_county_modifier: "사목교서"
 pam_pastoral_letter_county_modifier_desc: "멀리 있는 신앙의 목자가 보낸 위로와 가르침을 담은 편지가 모든 예식에서 낭독됩니다."
