l_korean:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "종교 학습"
 study_scripture_action: "종교 학습"
 study_scripture_desc: "나는 신앙 탐구에 전념하겠다. [GetPlayer.GetFaith.ReligiousText], 내 신앙의 교리, 그리고 그 너머에 있는 신비까지 탐구할 것이다."
 study_scripture_desc_general: "$study_scripture$은 당신이 [piety|E], [skill|E], [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]을 획득하려 시도하는 [personal_scheme|E]입니다."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "능력치를 향상시키거나, 신앙도를 획득하거나, 기회를 발견합니다"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "당신이 [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName](을)를 따름: $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "당신이 [GetTenetType('tenet_scholasticism').GetBaseName](을)를 따름: $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "당신의 성직 장상의 [learning|E]: $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "당신이 [GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip](을)를 보유함: $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "당신이 [stress|E]로 인해 학습에 지장이 생김: $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "당신이 [GetTrait('zealous').GetName( owner )] 성격임: $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "당신이 [GetTrait('cynical').GetName( owner )] 성격임: $VALUE|+0=$"
 pam_study_scripture_decision: "[ROOT.Char.GetFaith.ReligiousText|U] 학습"
 pam_study_scripture_decision_desc: "[ROOT.Char.GetFaith.ReligiousText](은)는 저절로 읽히지 않으며, [ROOT.Char.GetFaith.GetName]의 교리 또한 가만히 있는 자에게 저절로 깨우쳐지는 것이 아니다. [ROOT.Char.Custom('StudyOfficesWord')] 사이의 시간을 따로 내어 공부하고 숙고하자. 양 떼에게 목자도 배움을 게을리하지 않는다는 것을 보여 주자."
 pam_study_scripture_decision_tooltip: "자신을 대상으로 하는 [GetScheme('study_scripture').GetTypeName] [scheme|E]을 시작함"
 pam_study_scripture_decision_tt: "자신을 대상으로 하는 [GetScheme('study_scripture').GetTypeName] [scheme|E]을 시작함\n\n예상 보상:\n$EFFECT_LIST_BULLET$ [piety_i][piety|E]\n$EFFECT_LIST_BULLET$ [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E] / [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ [learning_i][stewardship_i][diplomacy_i] [skill|E] #weak (최대 8까지)#!\n$EFFECT_LIST_BULLET$ [clergy|E] 사이에서 기회\n\n불이익:\n$EFFECT_LIST_BULLET$ 일정 확률로 [stress_i][stress|E] 획득\n$EFFECT_LIST_BULLET$ [prestige_i][prestige|E] 획득량 감소"
 pam_study_scripture_decision_confirm: "배움을 시작하자."
 pam_study_scripture_decision_req_tt: "당신이 [GetScheme('study_scripture').GetTypeName] [scheme|E]을 진행 중이지 않음"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial 진행 중인 [personal_scheme|E]이 끝날 것임#!"
 study_scripture_title: "$study_scripture$: "
 study_scripture_outcome_piety: "$study_scripture_title$헌신에 대한 보상"
 study_scripture_outcome_fragment_tt: "#EMP \"[owner.Custom('RandomStudyVerseFragment')]\"#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$경전에 대한 통찰"
 study_scripture_outcome_mystery: "$study_scripture_title$신비를 엿보다"
 study_scripture_outcome_stress: "$study_scripture_title$고된 학습"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "내 발에 등이요 내 길에 빛이니이다..."
 pam_ss_fragment_psalm_119_165: "주의 법을 사랑하는 자에게는 큰 평안이 있으니..."
 pam_ss_fragment_proverbs_9_9: "지혜 있는 자에게 교훈을 더하라..."
 pam_ss_fragment_proverbs_4_7: "지혜가 제일이니..."
 pam_ss_fragment_joshua_1_8: "주야로 그것을 묵상하여..."
 pam_ss_fragment_matthew_7_7: "찾으라 그러면 찾을 것이요..."
 pam_ss_fragment_james_1_5: "너희 중에 누구든지 지혜가 부족하거든..."
 pam_ss_fragment_2_timothy_2_15: "인정된 자로 자신을 하나님 앞에 드리기를 힘쓰라..."
 pam_ss_fragment_verbum_domini: "Verbum Domini manet in aeternum..."
 pam_ss_fragment_generic_1: "신비는 더욱 깊어진다..."
 pam_ss_fragment_generic_2: "지혜가 뿌리를 내린다..."
 pam_ss_fragment_generic_3: "문헌의 의미가 차츰 드러난다..."
