 only_theocratic_tt: "[THIS.Char.GetShortUINamePossessive|U] [government|E]가 [theocratic|E] 임명을 불허함 #weak ([THIS.Char.GetGovernment.GetAdjective])#!"
 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U](이)가 [clergy|E] 구성원이거나, 또는 [THIS.Char.GetFaith.GetName] 신앙이 $doctrine_theocracy_lay_clergy_name$ [doctrine|E]를 보유해야 함"
 can_be_appointed_interaction_can_inherit_tt: "[THIS.Char.GetWomenMen|U]이 [titles|E]를 상속할 수 있어야 함 #weak ([GetTrait('disinherited').GetName( THIS.Char )], [GetTrait('gallivanter').GetName( THIS.Char )], 또는 [GetTrait('order_member').GetName( THIS.Char )] 특성이 없어야 함)#!"
 theocracy_lease: "신정 임대"
 theocracy_lease_desc: "해당 봉토는 보유자의 [faith|E] 소속 [realm_priest|E]에게 [leased|E]된 상태입니다.\n\n그들은 자신들의 [liege|E](승인한 경우) 및 [religious_superior|E] 모두에게 [tax|E] 및 [levies|E]을 제공합니다.\n\n같은 신앙을 믿는 경우, 그들의 종교 장상은 자기 [liege|E]의 [realm_priest|E]입니다. 그렇지 않다면 종교 장상은 해당 신앙의 [head_of_faith|E]가 됩니다."
 ecclesiastical_lease: "교회 임대"
 ecclesiastical_lease_desc: "해당 봉토는 보유자의 [ecclesiastical|E] [faith|E] 소속 [realm_priest|E]에게 [leased|E]된 상태입니다.\n\n그들은 자신들의 [liege|E](승인한 경우), [religious_superior|E], 그리고 [head_of_faith|E]에게 직접 [tax|E] 및 [levies|E]을 제공합니다.\n\n그들의 종교 장상은 자신들의 주군의 수도가 속한 교회 [clerical_title|E]의 [holder|E]입니다. 그렇지 않다면 종교 장상은 해당 신앙의 [head_of_faith|E]가 됩니다."
