 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "Mortificatio Carnis" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "육신의 고행"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "오 주여, 우리의 육체와 그 정욕과 욕심을 십자가에 못 박을 은혜를 허락하소서. 거룩한 고난을 통하여 우리가 그리스도의 수난에 참여하게 하시고, 육체의 행실을 죽여 참으로 살게 하소서.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Mortificatio Carnis의 역사적 배경','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "금식과 철야와 육체의 고행을 통하여 하느님의 종들은 육체를 억누르고 복종하게 하여, 영혼이 하늘을 향하여 오르게 한다.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Nékrōsis tẽs Sarkós의 역사적 배경','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "신자들은 육체와 그 죄된 욕망을 죽이며, 그리스도의 고난에 참여함으로써 영혼을 정결하게 하고 영적 완전에 이르고자 한다.\n\n$pam_galatians_5_24_default$\n\n[Glossary('육신의 고행의 역사적 배경','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "[GetTrait('scarred').GetName( GetNullCharacter )] [trait|E]이 @piety_icon![piety|E] 및 신자들의 [opinion|E] 부여"
