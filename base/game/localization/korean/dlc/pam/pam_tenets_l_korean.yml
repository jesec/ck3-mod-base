 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "다른 영주에게 자신의 #V 미론 성유#! [artifact|E] 사용 횟수를 나눠줄 수 있으며, @piety_icon![piety|E]와 [opinion|E] 획득"
