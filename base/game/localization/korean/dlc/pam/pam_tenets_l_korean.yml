 # PAM TENETS
 full_tenet_name: "$CUSTOM_NAME$ #weak ($DEFAULT_NAME$)#!"
 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "Cáin Adomnáin" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "Pax et Treuga Dei" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "Ekekheiría Theoũ" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "하느님의 평화"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "무고한 자들의 법으로도 알려져 있으며, 전쟁 중 비전투원의 안전을 보장하기 위한 규범을 세웠다. 이를 어긴 자는 물론, 범죄를 막기 위해 아무 행동도 하지 않은 방관자까지 세속적 벌금과 의식적 저주의 대상이 되었다.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Cáin Adomnáin의 역사적 배경','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "대림절부터 주현절 팔일축제까지의 휴전은 그 어떤 침해도 없이 반드시 지켜져야 한다. 누구든 이를 깨뜨리려 한다면, 그자의 주교는 파문을 선고할지어다.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Pax et Treuga Dei의 역사적 배경','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "평화를 위해 만물을 이루신 그리스도의 제자로서 평화를 빚어내는 장인이 되어야 한다. 평화를 구하는 자는 곧 그리스도를 구하는 자다. 타인에 대한 사랑 없이, 모든 이에게 평화를 베풀려는 마음 없이는 누구도 참된 그리스도의 종이라 불릴 수 없다.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Ekekheiría Theoũ의 역사적 배경','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "우리 형제자매를 향한 무의미한 폭력은 곧 신에 대한 모독이다.\n\n[Glossary('하느님의 평화의 역사적 배경','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "중세 전역에 걸쳐 여러 기독교 운동은 공식적인 교전 규칙을 확립하여 유혈 사태를 줄이고자 했습니다. 7세기 아일랜드의 Cáin Adomnáin부터 10세기 프랑스의 하느님의 평화 운동에 이르기까지, 이러한 노력은 교회 재산과 성직자 및 신자를 보호하고, 비전투원을 향한 폭력을 제한하며, 귀족 간 전쟁을 특정 시기와 장소로 한정하는 데 집중되었습니다.\n\n이러한 규범은 종종 비신자들에게까지 확대 적용되었습니다. 1179년 열린 제3차 라테란 공의회 제21교령은 정기적 휴전을 전 기독교 세계로 확대했으며, 제27교령은 카타리파, 바스크인 및 기타 이단자들에 맞서 무기를 들 것을 촉구했습니다."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "같은 [faith|E]의 [ruler|E]에게 [war|E]을 선포하면 @piety_icon![piety|E]를 소모함"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "[GetTrait('zealous').GetName( GetNullCharacter )] [rulers|E]가 같은 [faith|E]을 믿는 상대에게 [war|E]을 선포할 확률이 줄어듦"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "이 [rite|E]에 속한 [rulers|E]는 #high $ecclesiastic_incite_holy_war_interaction$#! [interaction|E]에 응할 확률이 훨씬 낮음"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "#high $purchase_truce_interaction$#! [interaction|E]은 비용이 #P 50%#! 감소하고 더 쉽게 수락됨"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "[raid|E] 불가"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "[peace|E] 상태일 때 #V 5년#!마다 [rulers|E]가 보상을 받으며, 주로 @legitimacy_icon![legitimacy|E] 획득"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "[peace|E] 상태로 보낸 매 #V 5년#!마다 무작위 [skill|E] 점수 하나가 #P 1#!점 증가"
 doctrine_parameter_tenet_peace_of_god_excommunication: "대표 방어자는 같은 [faith|E]의 공격자를 [excommunicate|E]하는 데 @piety_icon![piety|E]를 소모하지 않음"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "[faith|E] 내 [truce|E]을 파기하면 즉시 [excommunication|E]에 처해짐"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "[clergy|E]는 토지와 작위를 둘러싼 분쟁을 훨씬 더 쉽게 해결하며, 그 대가로 @piety_icon![piety|E], @gold_icon![gold|E], @prestige_icon![prestige|E]을 #P 25%#! 적게 요구함"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: 당신이 평화를 유지함"
 # Dulia tenet
 tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
 tenet_dulia_default_name: "성인 공경"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "주님을 반석으로 택한 이들은 마땅히 공경받아야 한다. 그들의 영원한 육신은 성스럽고, 그 유해는 신성하며, 그 기억은 거룩하다.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Dulia의 역사적 배경','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "박해받은 성직자와 몰약을 지닌 여인에서부터 그리스도를 위한 바보들에 이르기까지, 교회는 주님께 특별한 헌신을 보인 이들에게 특별한 칭호를 부여하고 전례력의 특정한 날에 그들을 기려왔다.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Hagiokatátaxis의 역사적 배경','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "성인들의 전구를 구하는 모든 이는 경외와 헌신의 마음으로 그들을 공경할지어다.\n\n$pam_philippians_4_21_default$\n\n[Glossary('성인 공경의 역사적 배경','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "초기 기독교에서는 신앙을 위해 죽은 순교자들이 공경받았으며, 그들의 유해는 성물로 보존되었습니다. 4세기 이후부터는 죽음이 아니라 말과 삶으로 신앙을 증언한 고백자들 또한 존경의 대상이 되었습니다.\n\n이들의 성인 지위는 처음에는 지역 주교가 생애와 기적을 조사한 뒤 승인했습니다. 993년 교황 요한 15세에게 인준받은 아우크스부르크의 주교 성 우달리크는 로마인이 아닌 인물 중 처음으로 교황 시성 절차를 거친 성인이 되었습니다. 1170년 교황 알렉산데르 3세의 칙령으로 인해 교황만이 독점적으로 시성 권한을 갖게 되었습니다."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "[GetDecisionWithKey('pam_canonize_saint_decision').GetName] 및 [GetDecisionWithKey('pam_extract_relic_decision').GetName] [decisions|E]의 @piety_icon![piety|E] 및 @gold_icon![gold|E] 비용이 #P 15%#! 감소"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[GetDecisionWithKey('pam_extract_relic_decision').GetName] [decision|E]으로 얻은 [artifacts|E]이 무작위 축복 #P 1#!개를 추가로 지님"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "[dynasty|E] 구성원을 대상으로 한 [GetDecisionWithKey('pam_extract_relic_decision').GetName] [decision|E]이 #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! [dynasty_prestige|E] 부여"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "성자 시성 시 해당 [faith|E]의 모든 [ruler|E]에게 #EMP 5#!년 동안 $pam_dulia_new_saint_modifier$를 부여함"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "실체변화"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "그러나 성체성사의 신비 안에서 빵의 축성은 무로 돌아가는 것이 아니라 그리스도의 몸으로 완성된다. 그렇지 않다면, 어째서 그리스도의 몸이 성사 안에 현존하게 되는지를 설명할 길이 없기 때문이다. 그 몸은 어떤 장소적 이동을 통해 그곳에 존재하게 되는 것이 아니다. 만일 그렇다면 천상에는 더 이상 존재하지 않게 될 것이기 때문이다.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Transubstantiatio의 역사적 배경','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "그러나 그분은 참되고 실제로 현존하시며, 빵과 포도주가 축성된 뒤에는 그 빵이 변화되고, 실체가 바뀌며, 전환되고, 변형되어 곧 주님의 참된 몸 그 자체가 된다.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Metousíōsis의 역사적 배경','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "축성되기 전에는 다른 이름으로 불리지만, 이후에는 피라 불린다. 그리고 '아멘'이라 말하니, 이는 곧 '참되도다'라는 뜻이다.\n\n$pam_luke_22_19_default$\n\n[Glossary('실체변화의 역사적 배경','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "성체성사 안에서 그리스도가 어떻게 현존하는가에 대한 문제는 초기 교회 시절부터 신학적 논쟁의 대상이었습니다. 빵과 포도주가 그리스도의 몸과 피라는 신성 자체는 거의 부정되지 않았지만, 그것이 정확히 어떤 방식으로 존재하는지는 수많은 논쟁과 분파, 분열을 낳았습니다. 천주교의 해석은 13세기 토마스 아퀴나스에 의해 더욱 체계화되었으며, 1215년 제4차 라테란 공의회에서 공식적으로 규정되었습니다. 미사 중 빵과 포도주의 실체는 그리스도의 몸과 피의 실체로 변화하지만, 빵과 포도주의 우유성(겉모습)은 그대로 남는다고 합니다."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "[fabricate_claim|E] 속도: #p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "Ora et Labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "기도하고 일하라"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "윗사람에게 순종하라. 고난 속에서도 인내하라. 가장 천한 일도 받아들이고, 자신을 무가치한 일꾼으로 여기라.\n#weak 성 베네딕도 규칙서, 제7장#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Ora et Labora의 역사적 배경','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "수도자들은 밤낮으로 쉬지 않고 성무를 거행해야 한다. 교대로 이어지는 그들의 성가와 끝없는 시편 낭송은 소속된 수도회와 주님께 영광을 바친다.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Akoímētoi의 역사적 배경','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "기도는 곧 노동이며, 노동은 곧 기도다. 나태는 영혼의 적이니, 생각과 행동 모두에서 부지런해야 한다.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('기도하고 일하라의 역사적 배경','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "#weak Ora et labora#!라는 표어는 성 베네딕도 규칙서에서 유래했으며, 기도와 노동이라는 수도원적 이상을 함축합니다. 수도자는 하루 중 일정 시간을 공동 기도와 개인 묵상, 육체노동에 바쳐야 했습니다. 이러한 균형은 영적 성장과 규율에 필수적인 것으로 여겨졌습니다. 베네딕도회 수도원들은 학문과 농업, 수공업의 중심지가 되었으며, 중세 유럽의 문화와 경제 발전에 크게 기여했습니다."
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "Theotókos" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "하느님의 어머니"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "당신의 연민 아래 저희는 피신하나이다. 환난의 때에 저희의 간청을 외면하지 마시고, 모든 위험에서 저희를 구하소서. 오직 순결하고 복되신 분이여.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Hyperdulia의 역사적 배경','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "저희의 기도를 받아들이시어 당신의 아들이자 저희의 주님께 전해 주소서. 그분께서 당신을 위하여 저희 영혼을 비추시고 구원하시게 하소서. 지극히 거룩하신 테오토코스여, 저희를 구하소서!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Theotókos의 역사적 배경','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "복되신 동정녀 마리아, 하느님의 어머니, 자비의 어머니, 마돈나시여.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('하느님의 어머니의 역사적 배경','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "기독교 초기부터 예수의 어머니 마리아는 특별한 공경과 존숭의 대상이었습니다. 431년 에페소 공의회는 그녀의 칭호인 테오토코스, 곧 #weak 하느님을 낳은 자#!를 공인했으며, 동시에 크리스토토코스, #weak 그리스도를 낳은 자#! 를 선호한 네스토리우스파를 단죄했습니다. 성 요한 다마스쿠스는 8세기에 마리아가 구원 역사에서 맡은 독보적인 역할로 인해 모든 성인들 위에 드높여졌다고 기록했습니다. 세월이 흐르며 원죄 없는 잉태와 성모 승천 같은 여러 마리아 교리가 발전했고, 기독교 교회들에 의해 공식 교리로 규정되었습니다."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "[gender_laws|E]으로 인해 여성의 [claims|E]이 더 이상 약화되지 않음"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "다음 [laws|E] 활성화: [GetLaw('female_preference_law').GetName] 승계법"
 # Simony tenet
 tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
 tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
 tenet_simony_default_name: "성직 매매"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "주님께서 우리에게 내어주신 이 땅 아래 금을 창조하셨으니, 이는 선택받은 이들을 위한 은총이다.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Simonia의 역사적 배경','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "주님께서 우리에게 내어주신 이 땅 아래 금을 창조하셨으니, 이는 선택받은 이들을 위한 은총이다.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Simōnía의 역사적 배경','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "주님께서 우리에게 내어주신 이 땅 아래 금을 창조하셨으니, 이는 선택받은 이들을 위한 은총이다.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('성직 매매의 역사적 배경','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "교회 직위와 성유물, 성사를 금전으로 사고파는 행위. 그 이름은 사람들을 #weak 현혹#!했던 사마리아인 시몬 마구스가 세례를 받기 위해 사도들에게 돈을 바친 일에서 유래했습니다.\n\n305년 엘비라 시노드부터 1545년 트리엔트 공의회에 이르기까지, 수많은 시노드(교회 회의)는 성직 매매를 강력히 규탄하며 가장 엄중한 영적, 세속적 처벌을 부과했습니다. 다만 어떤 관행이 수 세기에 걸쳐 이토록 반복적으로 금지되었다는 것은, 그만큼 널리 퍼져 있었다는 뜻이기도 합니다. 이는 또한 마르틴 루터의 95개 조 반박문과 단테의 신곡 지옥 편 제19곡에서도 비판되었습니다. #weak 탐욕스러운 자들아, 거룩한 신부가 되어야 할 주님의 것을 취하고, 금과 은을 위해 음행하고야 마는구나!#!"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[castle_holdings|E] 및 [church_holdings|E]: @piety_icon![piety|E] 단계당 [tax|E]: #P + 0.1 [gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "@gold_icon![gold|E]를 지불하여 #high $take_monastic_vows_interaction$#! [character_interaction|E] 승낙을 보장할 수 있음"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "#high $buy_ecclesiastical_title_interaction$#! [interaction|E]을 통해 성직 [titles|E]의 대가로 @gold_icon![gold|E]를 지불할 수 있음"
 tenet_simony_ecclesiastical_purchase_name: "#high $buy_ecclesiastical_title_interaction$#! [interaction|E]"
 doctrine_parameter_tenet_simony_gold_donations: "[clergy|E]에게 탄원할 때 @gold_icon![gold|E] 기부의 설득력이 #P 5배#!가 됨"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "매년 #P 25%#!~#P 75%#! 확률로 #P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![spiritual_fulfillment|E]을 획득하며, 부유할수록 확률이 높아짐"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "[head_of_faith|E]는 [excommunication|E] 해제를 위해 제시된 @gold_icon![gold|E]를 항상 수락함"
 doctrine_parameter_tenet_simony_personal_gifts: "선물이 [stress|E]를 감소시키고 약간의 @spiritual_fulfillment_icon![spiritual_fulfillment|E]을 부여하며, 획득하는 [opinion|E]이 두 배가 됨"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "융화주의 수용"
 pam_personal_syncretism_county_modifier_desc: "지역 주민들은 영주 개인의 융화주의적 전통을 존중하고 그 통치 아래 번영합니다."
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "단성론"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "성자는 하나이며 그 본성 또한 하나이니, 비록 그분께서 이성을 지닌 영혼과 육신을 취한 것으로 여겨질지라도 그러하다.\n\n$pam_john_1_1_latin$\n\n[Glossary('Monophysitismus의 역사적 배경','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "성육신한 말씀의 하나 된 본성.\n\n$pam_john_1_1_greek$\n\n[Glossary('Monophysitismós의 역사적 배경','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "그리스도는 완전히 신적인 단 하나의 본성만을 지닌다.\n\n$pam_john_1_1_default$\n\n[Glossary('단성론의 역사적 배경','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "그리스어 monos(#weak 단일#!) 및 physis(#weak 본성#!)에서 유래한 명칭입니다. 이 교리는 예수 그리스도가 곧 성육신한 하느님의 말씀으로서 오직 하나의 신적 본성만을 지닌다고 주장합니다. 이는 451년 칼케돈 공의회에서 이단으로 규정되었으나, 바실리스쿠스 황제의 지지를 받았고 유스티니아누스 1세 치하에서 보호받기도 했습니다. 또한 알렉산드리아 총대주교의 권위를 부정한 아케팔로이(머리 없는 자들)와, 예수의 인간적 본성이 단지 환영에 불과했다고 믿는 도세티스트(가현설파) 같은 분열을 낳았습니다."
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[GetTrait('theologian').GetName( GetNullCharacter )] [characters|E]: @piety_icon![piety|E] 획득량 #P +10%#!, 광신도 [opinion|E] #P +5#!, [lifestyle|E] 경험치 #P +10%#!"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[GetTrait('stubborn').GetName( GetNullCharacter )] [characters|E]: @piety_icon![piety|E] 획득량 #P +10%#!, [clergy|E] [opinion|E] #P +10#!"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[GetTrait('trusting').GetName( GetNullCharacter )] [characters|E]: @piety_icon![piety|E] 획득량 #N -10%#!, [clergy|E] [opinion|E] #N -10#!"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "당신의 [religion|E]에 속한 다른 [faiths|E]을 상대로: [convert_county|E] 속도 #P +25%#!, [characters|E]의 개종 승낙 가능성 #P +20#!"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "사도행전"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "모세가 파라오 앞에 서서 당신께서 내리신 사명을 담대히 선포했던 것처럼, 우리의 선교사들 또한 사람들 앞에 선다.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Actus Apostolorum의 역사적 배경','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "당신의 백성, 제게 내려주신 당신의 선물을 당신께 돌려드리나이다. 당신의 강하신 오른손으로 그들을 인도하시고, 당신 날개의 그늘 아래로 그들을 지켜 주소서.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Práxeis tõn Apostólōn의 역사적 배경','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "어둠 속에 있는 이들에게는 천상의 빛을, 절망 속에 있는 이들에게는 희망을.\n\n$pam_acts_1_8_default$\n\n[Glossary('사도행전의 역사적 배경','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "기독교는 서기 초기 수 세기 동안 급속도로 확산되었으며, 이는 대부분 사도들과 초기 제자들의 선교 활동 덕분이었습니다. 그들의 여정은 로마 제국 전역으로 이어졌고, 곳곳에 기독교 공동체를 세우며 다양한 배경의 사람들을 개종시켰습니다. 포교를 향한 열정은 예수 그리스도를 통한 구원이라는 메시지에 대한 깊은 확신에서 비롯되었으며, 그 결과 기독교는 유대교 내부의 작은 분파에서 세계적인 종교로 성장했습니다.\n\n중세 시대에는 훗날 성인과 순교자로 추앙받게 될 수많은 이들이 이교도의 땅으로 떠나 선교하며 기독교 신앙을 끊임없이 전파했습니다."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "[GetDecisionWithKey('zealous_missionary_prep_decision').GetName] [decision|E]의 요구 조건이 완화되며, 더 많은 [adventurers|E]가 이 결정을 내림"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "[characters|E]을 개종시키면 #P 50#! @legitimacy_icon! 획득, 당신의 [court_chaplain|E]가 [Concept( 'county', '영지' )|E]를 개종시키면 #P 100#! @legitimacy_icon! 및 #P 5#! @spiritual_fulfillment_icon! 획득"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "[character|E]을 개종시키면 #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|E] 획득, 지주 [ruler|E]를 개종시키면 #P 10#! 획득"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "[characters|E]이 이 [rite|E]를 따르도록 설득할 때 당신의 [head_of_rite|E]가 승낙 확률 #P +25#!를 얻음"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "[characters|E]에게 개종을 요구할 때 당신의 [learning|E] 우위가 #P 두 배#!로 계산됨"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "[ruler|E]를 개종시키면 #P 25#!~#P 1500#! @piety_icon![piety|E] 획득, 그 인물의 [title|E] 등급에 따라 큰 폭으로 증가함"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )] 원리에서"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "연옥"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "나는 아래에서 기다리는 형벌을 더욱 두려워하노니, 내 영혼은 불안과 긴장 속에 떨고 있다. 나는 이미 첫 번째 층의 무거운 짐을 느끼고 있노라.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Purgatorium의 역사적 배경','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "천상에 있는 이들은 육신의 부활에 이르지 않았기에 주님과의 합일을 완성할 수 없으며, 우리의 기도는 그들의 합일을 돕는다.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Kathartērion의 역사적 배경','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "은총 안에서 죽은 이들을 위한 마지막 정화이며, 천상의 기쁨에 들어가는 데 필요한 거룩함만을 그들 안에 남긴다.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('연옥의 역사적 배경','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "천국으로 들어가기 전 과도기적 상태에 머무는 영혼이라는 개념은 널리 받아들여졌지만, 그 상태의 정확한 본질을 두고는 오랜 논쟁이 이어졌습니다. 그곳이 실제 장소인지, 정신적 상태인지, 순수한 비유인지, 혹은 물리적 정화 과정인지는 신학자와 교파마다 견해가 달랐습니다. 제노바의 성녀 카타리나는 이를 기쁨과 자신의 죄에 대한 자발적 고통이 함께하는 상태라고 기록했으며, 알렉산드리아의 오리게네스는 하느님을 모든 것을 태워 정화하는 불로 묘사했습니다.\n\n가톨릭 교회는 피렌체 공의회(1439)와 트리엔트 공의회(1545~1563)에서 연옥 교리를 공식화했습니다. 연옥을 일시적인 정화 상태로 규정하고 살아 있는 이들의 기도와 선행이 연옥에 있는 영혼들에게 도움이 될 수 있다고 가르쳤습니다."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[sinful|E] [characters|E]이 [factions|E]에 가담할 확률 감소 (보유한 [sin|E]당 #N -15#!)"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[sinful|E] [rulers|E]는 보유한 [sin|E] 하나마다 @piety_icon![piety|E] 획득량이 #N 10%#! 감소함"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "[stress|E] 붕괴 시 [sinful|E] [traits|E]이 [virtues|E] 것으로 대체될 수 있으며, 붕괴가 심할수록 확률 증가"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "이 [rite|E]에 속한 [Concept('excommunicated', '파문')|E]당한 [characters|E]은 보속을 통해 속죄함: @piety_icon![piety|E] 획득량 #P +25%#!, 같은 신앙을 믿는 인물의 [opinion|E] #P +10#!"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|E]의 @prestige_icon![prestige|E] 비용이 감소하며, 당신의 [prestige_level|E]은 낮아지지 않음"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "가까운 [family|E] 구성원이 사망하면 그 인물이 지닌 [sin|E] 하나당 #P 50#! @piety_icon![piety|E] 획득"
 pam_purgatory_prayers_for_the_dead_toast: "당신의 [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )]에서: 위령기도"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "Crescite et Multiplicamini" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì Plēthýnesthe" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "생육하고 번성하라"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "부부는 서로 자신만을 내어주는 것이 아니라 자녀라는 현실 또한 내어준다. 자녀는 그들 사랑의 산 증거이며, 두 존재가 하나로 맺어진 살아있는 결합이다.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Crescite et Multiplicamini의 역사적 배경','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "자식은 여호와의 주신 기업이요 태의 열매는 그의 상급이로다.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Auxánesthe kaì Plēthýnesthe의 역사적 배경','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "하느님의 계획 안에서 가족은 삶과 사랑의 친밀한 공동체이며, 창조되고 구원받은 모든 것이 그러하듯 마침내 하느님 나라 안에서 완성을 맞이하게 될 소명이다.\n\n$pam_genesis_1_28_default$\n\n[Glossary('생육하고 번성하라의 역사적 배경','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "생육하고 번성하라는 창세기 1장 28절에 등장하는 성경의 명령으로, 주님께서 아담과 하와에게 자손을 낳아 땅에 충만하라고 명하신 구절입니다."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "배우자와 연애하기가 훨씬 쉬워지며, 연애에 성공하면 큰 [fertility|E] 보너스를 얻음"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "[fertility|E]이 낮은 배우자와 항상 이혼할 수 있음"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "신생아는 부모의 금슬에 따라 [health|E] 보너스를 얻음"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "다정하게 자람"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "사랑받으며 자람"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "정성을 다해 길러짐"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "금슬 좋은 부모에게서 태어난 아이는 두 부모의 따뜻한 보살핌 속에서 자라며, 그 덕분에 잘 자랍니다."
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "출생 및 성년 도달 시:\n$BULLET_WITH_TAB$#V 자녀#!가 2년 동안 [GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip] 획득.\n$BULLET_WITH_TAB$#V 부모#!가 2년 동안 [GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip] 획득."
 tenet_be_fruitful_and_multiply_child_modifier: "애지중지 보살핌받음"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "다산에 대한 열렬한 경외는 모든 신자가 아이와 그 부모에게 더욱 많은 관심과 보살핌을 기울이게 만듭니다."
 tenet_be_fruitful_and_multiply_parent_modifier: "자녀를 낳아 칭송받음"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "Successio Apostolica" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "Apostolikē Diadokhē" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "사도계승"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "그리스도께서 사도 베드로에게 부여하신 명예와 관할의 수위권은 그의 후계자인 교황들에게 이어진다.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Successio Apostolica의 역사적 배경','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "로마 교회에서는 클라우디아의 아들 리노가 첫 번째 주교였으며, 그는 바울에게 서품받았다.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Apostolikē Diadokhē의 역사적 배경','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "사도들로부터 오늘날까지 끊이지 않고 이어져 온 주교들의 계보는 신앙이 올바르게 전승되도록 보장한다.\n\n$pam_matthew_16_18_default$\n\n[Glossary('사도계승의 역사적 배경','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "사도계승 교리는 주교들의 권위가 사도들에게까지 거슬러 올라가는 끊어지지 않은 서품 계보에서 비롯된다고 봅니다. 2세기 리옹의 이레네우스는 영지주의 이단에 맞서는 논거로 사도계승을 내세우며, 그리스도의 참된 가르침이 교회의 정통 주교들을 통해 보존되었다고 주장했습니다.\n\n13세기 이후 교황들은 성 베드로의 후계자임을 상징하는 '어부의 반지'를 착용했습니다. 동방정교회 또한 서방 교황들의 계보와 초기 기독교에서의 역할 자체는 인정하지만 베드로에게 다른 사도들보다 높은 지위를 부여하지 않으며, 교황 리노를 로마 최초의 주교로 여깁니다."
 tenet_apostolic_succession_requires_head_of_faith_tt: "당신의 [faith|E]에 [head_of_faith|E]가 있어야 함"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "같은 [faith|E]의 [theocratic_vassals|E]은 [liege|E]에 대한 [legitimacy_expectations|E]이 낮음"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "[GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip] 부여"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "[cardinal|E]을 지원하면 해당 인물의 [papabile_score|E]가 추가로 #P 10#! 증가함"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "[head_of_faith|E]가 직접 당신의 @legitimacy_icon![legitimacy|E]을 설교하게 하면 추가 @legitimacy_icon![legitimacy|E] 부여"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "[antipope|E]을 폐위하면 @legitimacy_icon![legitimacy|E] 및 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 부여"
 # Confession tenet
 tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
 tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
 tenet_confession_default_name: "고해성사"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "신부님, 축복을 빌어주십시오. 제가 죄를 지었나이다. 지극히 자비로우신 하느님, 당신 발아래 엎드려 용서를 간청하나이다. 저의 죄를 당신과 당신의 사제 앞에 진심으로 고백하나이다.\n\n$pam_james_5_16_latin$\n\n[Glossary('Confessio의 역사적 배경','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "오 주여, 이 비참한 자의 기도에 귀 기울이시고, 제 안에 깃든 뱀의 둥지를 멸하소서!\n\n$pam_james_5_16_greek$\n\n[Glossary('Exomológēsis의 역사적 배경','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "고해를 통해 죄인은 사죄를 받고 하느님과 교회와 다시 화해할 수 있다.\n\n$pam_james_5_16_default$\n\n[Glossary('고해성사의 역사적 배경','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "죄를 고백하는 관습은 기독교 역사 전반에 걸쳐 크게 변화해 왔습니다. 초기 교회에서는 중대한 죄에 대해 공개적으로 고백하는 것이 일반적이었습니다. 사제에게 개인적으로 죄를 고백하는 방식은 6세기 켈트 교회 사이에서 널리 퍼지기 시작했으며, 이후 서방 기독교 전역으로 확산되었습니다. 1215년 제4차 라테란 공의회는 모든 그리스도인에게 매년 고해성사를 받을 것을 의무화했습니다. 고백된 죄를 절대로 누설하지 않는 '고해비밀'은 이 성사의 핵심 특징으로 자리 잡았으며, 사제들은 이를 어기느니 차라리 순교를 택할 정도였습니다."
 doctrine_parameter_tenet_confession_priests_secrets: "당신의 [faith|E]을 믿으며 고해성사를 집전하는 [court_chaplain|E]가 당신을 좋아하거나 당신이 해당 인물에 대한 강한 구실을 보유하고 있으면, $task_find_secrets$ [councillor_task|E] 효율이 증가함"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "이 [rite|E]에 속한 [clergy|E]에 의한 #high $spiritual_counsel_interaction$#!이 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E]을 더 많이 부여"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName] [schemes|E]이 더 많은 [stress|E] 완화"
 doctrine_parameter_tenet_confession_confess_sins_decision: "[GetDecisionWithKey('pam_decision_confession').GetName] [decision|E]을 사용할 수 있게 됨"
 # Original Sin tenet
 tenet_original_sin_latin_name: "Peccatum Originale" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "Propatorikē Hamartía" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "원죄"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "모든 인간은 아담의 죄로 인해 본래의 순수함을 잃었다. 악으로 기울고 나약해진 인간 본성의 결과는 지금도 인간 내면에 남아 있으며, 인간을 영적 투쟁의 장으로 불러낸다. \n\n$pam_romans_5_12_latin$\n\n[Glossary('Peccatum Originale의 역사적 배경','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "\"우리의 창조주시며 조물주이신 분이여, 잘못은 우리에게 있나이다.\" 아담과 하와는 사탄의 말에 귀 기울여 신성을 거슬렀고, 이기심으로 인해 스스로 그릇된 길로 이끌렸다. 그들은 인간 본성을 약하게 만들었다. 따라서 우리의 심성은 악으로 기운다.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Propatorikē Hamartía의 역사적 배경','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "모든 인류는 아담의 첫 번째 죄의 흔적을 물려받았으며, 오직 그리스도를 통한 신의 은총만이 우리를 그 죄에서 구원할 수 있다.\n\n$pam_romans_5_12_default$\n\n[Glossary('원죄의 역사적 배경','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "원죄 교리는 5세기 초 히포의 성 아우구스티누스에 의해 체계적으로 발전되었습니다. 특히 죄의 유전성을 부정한 이단 펠라기우스에 대응하는 과정에서 더욱 정립되었습니다. 아우구스티누스는 아담의 죄가 그의 모든 후손에게 전해져 인간 본성을 타락시켰으며, 신의 은총 없이는 구원이 불가능해졌다고 가르쳤습니다. 418년 카르타고 공의회는 이러한 가르침을 승인했고, 이는 서방 기독교 신학의 핵심 교리 가운데 하나가 되었습니다. 한편 동방 기독교는 직접적인 죄의 유전보다는 조상으로부터 이어진 죄의 결과를 강조하는 등 다소 다른 이해를 발전시켰습니다."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "[rite|E]가 같은 [Concept( 'counties', '영지' )|E]에서 [promote_culture|E] [councillor_task|E] 속도 #P 25%#! 증가"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "[liege|E]의 [faith|E]이 다를 경우, 해당 [faith|E]의 [Concept( 'counties', '영지' )|E]는 [Concept( 'promote_culture', '문화 변경' )|E] 소요 시간이 #N 50%#! 증가"
 doctrine_parameter_tenet_original_sin_sinners_insight: "당신이 지닌 [sin|E] 하나당, 당신의 적대적인 [scheme|E] 최대 성공 확률이 #P +10#! 증가함"
 doctrine_parameter_tenet_original_sin_baptism_piety: "당신의 아이가 태어나면 #P 50#! @piety_icon![piety|E] 획득, 신생아는 #P 250#! @piety_icon![piety|E]로 세례받음"
 pam_original_sin_baptism_toast: "당신의 [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]에서: 신생아의 얼룩이 씻겨 나감"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "Hierarchia Caelestis" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "천상 위계"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "거룩한 천사들이여, 저의 왕좌와 가문을 둘러싸소서. 하늘에 계신 아버지, 당신의 천사들이 저를 향한 모든 비난과 두려움의 목소리를 잠재우게 하시고, 제 기도를 당신의 옥좌로 신속히 올려 보내게 하소서.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Hierarchia Caelestis의 역사적 배경','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "그리스도교 백성을 위한 수호천사가 되어 주소서. 지혜로운 조언자이자 벗이 되어, 그들에게 깨우침과 힘, 기쁨과 평화와 위안을 가져다주소서.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Ouranía Hierarkhía의 역사적 배경','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "천사는 세라핌에서 일반 천사에 이르기까지 아홉 위계로 나뉘며, 각자 맡은 역할에 따라 신을 섬기고 인간을 보살핀다.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('천상 위계의 역사적 배경','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "천상 위계라는 개념은 5~6세기경 위 디오니시우스 아레오파기테가 '천상 위계론'을 저술하며 체계화했습니다. 그는 천사들을 세 개의 삼중 계급으로 나누었는데, 가장 높은 계급은 세라핌, 케루빔, 오파님, 중간 계급은 도미니온스, 비르투스, 포테스타테스, 가장 낮은 계급은 프린치파투스, 아르칸젤루스, 안젤루스로 구성됩니다.\n\n이러한 위계는 중세 기독교 신학에 깊은 영향을 끼쳤으며, 동방과 서방 기독교 모두에 받아들여졌습니다. 토마스 아퀴나스는 자신의 저서 '신학대전'에서 이 천사론을 수용했으며, 이는 중세 전반에 걸쳐 천국에 대한 예술적 묘사에도 큰 영향을 주었습니다."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "[aptitude|E]이 높은 인물을 [court_positions|E]에 임명하면 #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|E]을 부여하며, 직위 보유자를 해임하거나 직위를 박탈하면 #N 3#!만큼 소모함"
 pam_celestial_hierarchy_hire_sp_toast: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )] 개인 원리"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "[liege|E]과 같은 [faith|E]을 믿는 [court_positions|E] 담당자는 [piety_level|E]에 따라 [aptitude|E] 획득"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "[clergy|E]가 세속 [rulers|E]를 대상으로 [interaction|E] 사용 시 승낙 확률 #P +20#!"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "[religious_relations|E] [councillor_task|E]의 효과가 #P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')]%#! 증가함"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "같은 [faith|E]을 믿는 인물과의 [interaction|E] 승낙 확률이 대상보다 [piety_level|E]가 한 단계 높을 때마다 #P +10#!, 한 단계 낮을 때마다 #N -10#!만큼 변경됨"
 CELESTIAL_HIERARCHY_CLERGY_ACCEPTANCE_REASON: "[clergy|E]가 세속 [ruler|E]를 대상으로 행동: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "상대적 [piety_level|E]: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "세속 [ruler|E]에 대한 성직자의 권위: $VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "Miles Christi" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "그리스도의 군사"
 tenet_miles_christi_latin_desc: "그런즉 진리로 너희 허리 띠를 띠고 의의 흉배를 붙이고 굳게 서라. 그리스도의 참된 군사답게 믿음의 선한 싸움을 싸우라.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Miles Christi의 역사적 배경','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "모든 신실한 그리스도인은 그리스도를 위하여 고난받을 준비가 되어 있어야 하며, 악의 영의 세력을 대적하여 굳게 서서 군사의 담대함으로 환난을 견뎌야 한다.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Stratiōtēs Christoũ의 역사적 배경','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "신자들은 하나님의 전신갑주를 입고 죄와 악에 맞서 싸우는 영적 군사로 부름받았으며, 군사가 자신의 지휘관을 위해 고난을 견디듯 그리스도를 위해 기꺼이 고난받을 준비가 되어 있어야 한다.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('그리스도의 군사의 역사적 배경','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "이른바 '그리스도의 군사(Miles Christi)'라는 개념은 기독교 전통에 깊이 뿌리내리고 있으며, 영적 삶을 군사적 비유로 설명한 성 바울의 여러 서신에서 비롯되었습니다. 중세 시대에 이 개념은 실제 전쟁과 영적 전쟁 양쪽 모두에 적용되었습니다.\n\n성전기사단과 구호기사단 같은 기사수도회는 수도원적 규율과 무력을 결합함으로써 이러한 이상을 구현했습니다. 클레르보의 베르나르도는 새로운 군사에 대한 찬미(De Laude Novae Militiae)에서 이러한 전사 수도사들을 세속적 이익이 아니라 그리스도교 세계의 수호를 위해 싸우는 기독교적 덕성의 본보기로 찬양했습니다."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "같은 [faith|E]을 상대로 방어자로서 [war|E]을 [white_peace|E]으로 끝내면 양측의 [title|E] 등급에 따라 #P 100#! @piety_icon![piety|E] 및 @legitimacy_icon![legitimacy|E]을 부여, 또한 #P 5#! @spiritual_fulfillment_icon![spiritual_fulfillment|E] 부여"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "직접 지휘한 [battle|E] 또는 [siege|E]에서 승리하면 #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|E] 부여"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "[holy_relic|E] 무기를 소지한 상태에서 다른 [religion|E]를 상대로 [battles|E]에서 승리하면, 최대 #P 50#!승까지 네 가지 축복을 통해 무기가 강화됨"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "자애"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라. 구제와 빈자를 돌보는 일은 단순한 시민적 의무가 아니라, 그리스도께 가까이 나아가는 길이다.\n\n[Glossary('Caritas의 역사적 배경','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "Philanthrōpia, 곧 인간에 대한 사랑은 새 로마 황실과 교회가 세운 병원과 구빈원, 자선을 통해 가장 충만하게 드러났다. 굶주린 이를 먹이고 사로잡힌 이를 속량하는 것은 우리를 위하여 자신을 비우신 그리스도를 본받는 일이다.\n\n[Glossary('Philanthrōpía의 역사적 배경','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "이 신앙은 아낌없는 구제와 빈자를 돌보는 일, 그리고 병원과 구빈원 같은 자선 제도를 기독교의 핵심 의무로 여긴다. 이는 교부들의 가르침과 초기 구호 시설들의 전통을 따른 것이다.\n\n[Glossary('자애의 역사적 배경','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "비잔틴 기독교에서 philanthrōpia는 보편적 사랑이라는 덕목인 동시에, 황제와 주교, 신자들의 지원 아래 운영되던 병원, 쉼터, 고아원, 구제 활동 같은 실제 자선 제도를 뜻하기도 했습니다. 카이사레아의 바실레이오스와 요한 크리소스토모, 그리고 유스티니아누스 같은 후대 황제들은 빈자들을 돌보는 일을 제국 통치의 정당성과 연결지었습니다. 교회는 거룩함에 이르는 길로서 전쟁을 찬양하지 않았습니다. 대신 빈자를 어떻게 섬기느냐에 따라 부와 권력이 부분적으로 정당화될 수 있다고 가르쳤습니다."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "[county|E] 등급부터 [GetCourtPositionType('high_almoner_court_position').GetName](을)를 임명할 수 있음"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "다른 [character|E]의 몸값을 지불하면 지불한 @gold_icon![gold|E]에 비례하여 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E] 부여"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[GetTrait('generous').GetName( GetNullCharacter )] [characters|E]: 같은 신앙을 믿는 인물의 [opinion|E] #P +10#!, [development_growth|E] #P +20%#!"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[GetTrait('greedy').GetName( GetNullCharacter )] [characters|E]: 같은 신앙을 믿는 인물의 [opinion|E] #N -10#!, @piety_icon![piety|E] 획득량 #N -25%#!"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "[debt|E] 상태인 [character|E]에게 [gift|E]을 보내면 @prestige_icon![prestige|E]와 @piety_icon![piety|E] 부여"
 pam_philanthropia_ransom_toast: "당신의 [GetTenetType('tenet_philanthropia').GetName( GetPlayer.GetRite )] 개인 원리에서"
 # Scholasticism tenet
 tenet_scholasticism_latin_name: "Sacra Doctrina" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "스콜라주의"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "지식을 탐구하는 일은 곧 예배의 한 형태이니, 피조세계를 이해함으로써 우리는 창조주를 더욱 깊이 이해하게 된다. 지혜를 구하라, 그리하면 너희에게 주어질 것이다.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Sacra Doctrina의 역사적 배경','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "믿음과 이성은 서로 대립하는 것이 아니라 서로를 완성한다. 주님께서는 우리에게 진리를 탐구할 이성과 그분을 사랑할 마음을 주셨기 때문이다. 우리는 배움과 묵상을 통해 더 높은 지식으로 나아간다.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Skholastikē의 역사적 배경','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "엄격한 지적 탐구와 변증법적 방법을 통해 믿음과 이성은 조화를 이룰 수 있으며, 우리는 신적 진리를 더욱 깊이 이해하게 된다.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('스콜라주의의 역사적 배경','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "스콜라주의는 중세 유럽 대학에서 지배적인 학문 방법론이었으며, 12세기와 13세기에 절정에 이르렀습니다. 이는 기독교 신학과 고전 철학, 특히 아리스토텔레스의 사상을 조화시키고자 했습니다.\n\n캔터베리의 안셀무스, 피에르 아벨라르, 알베르투스 마그누스, 토마스 아퀴나스 같은 위대한 스콜라 사상가들은 논리적 엄밀성과 논쟁을 중시하는 체계적 신학 방법을 발전시켰습니다. 특히 토마스 아퀴나스의 '신학대전'은 모든 인간 지식을 기독교적 틀 안에서 종합하려 했던 스콜라 방법론의 최고 성취로 남았습니다."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "[GetReligionByKey('judaism_religion').GetAdjective], [GetReligionByKey('islam_religion').GetAdjective], [GetReligionByKey('zoroastrianism_religion').GetAdjective] [Concept( 'counties', '영지' )|E]에 있는 [points_of_interest|E]을 방문하면 추가 @piety_icon![piety|E], [learning|E] [experience|E], @spiritual_fulfillment_icon![spiritual_fulfillment|E]을 제공함"
 doctrine_parameter_tenet_scholasticism_university_bonus: "[GetActivityType('activity_adult_education').GetName] 완료 시 장기간 지속되는 [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip] [modifier|E]를 부여함"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName] [scheme_success_chance|E]: [success_chance_i]#P +10%#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "공부하지 않아도 매년 [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip](을)를 획득할 확률이 있으며, 이 확률은 [learning|E], [piety_level|E], 알고 있는 언어의 수에 따라 증가함"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "[GetActivityType('activity_adult_education').GetName] 참석 @gold_icon![gold|E] 비용이 #P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')]%#! 감소함"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization( HasDlcFeature( 'legacy_of_persia' ), 'tenet_scholasticism_court_scholar_effect', 'blank_line' )]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "$tradition_fp3_beacon_of_learning_name$ [culture_tradition|E] 없이도 [GetCourtPositionType('court_scholar_court_position').GetName](을)를 #P 봉급 없이#! 임명할 수 있음"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "지식의 추구 또한 숭배의 한 형태라면, 피조세계를 이해함으로써 우리는 창조주를 더욱 깊이 이해하게 될 것입니다."
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "길 위의 스투디움"
 pam_tenet_scholasticism_studium_toast_desc: "지금까지 이어진 길에서 [pam_studium_scholar.GetTitledFirstName](와)과 당신은 그 논점을 두고 줄곧 논쟁을 벌였고, 다음 [barony|E]으로 향하는 길에 결국 이 문제는 글로 판가름하는 편이 낫다는 결론에 이르렀다."
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "Diliges Proximum" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "네 이웃을 사랑하라"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "우리가 다른 이들을 당신의 눈으로 바라보게 하소서. 정죄는 덜하고 사랑은 더하게 하시며, 그들 또한 우리처럼 언젠가 당신의 손으로 완성될 존재임을 보게 하소서.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Diliges Proximum의 역사적 배경','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "이웃 사랑보다 더 달콤하고 아름다운 것이 무엇이랴? 사랑은 복이며, 미움은 고통이다. 온 율법과 선지자의 강령은 이 두 계명에 달려 있으니, 네 마음을 다하여 주 하나님을 사랑하고 네 이웃을 네 자신과 같이 사랑하라.\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Agapēseis tòn Plēsíon의 역사적 배경','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "이웃 사랑은 주님 사랑과 떼어놓을 수 없으며, 자비와 구제의 행위를 통해 우리는 주님의 율법을 이루게 된다.\n\n$pam_matthew_22_39_default$\n\n[Glossary('네 이웃을 사랑하라의 역사적 배경','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "이웃 사랑의 계명은 기독교 윤리의 핵심으로, 레위기 19장 18절에서 비롯되어 그리스도에 의해 하느님의 사랑과 함께 모든 율법을 요약하는 계명으로 높여졌습니다. 알렉산드리아의 클레멘스와 요한 크리소스토모 같은 초기 교부들은 참된 사랑의 대상이 가족과 친구를 넘어 낯선 이들과 원수까지 포함한 모든 인간에게 확장되어야 한다고 강조했습니다. 이러한 가르침은 중세 전반에 걸쳐 기독교 자선 기관과 병원, 그리고 구제 활동의 발전에 큰 영향을 주었습니다."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "이 [faith|E]의 [Concept( 'counties', '영지' )|E]가 #P 60+#! [county_opinion|E]을 보유할 경우 [GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip] [modifier|E] 획득 가능"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "$building_type_hospices_01$ [buildings|E]은 [Concept( 'county', '영지' )|E]의 [travel_danger|E]을 #P 3#!~#P 10#!만큼 감소시키며, 단계가 오를수록 감소량이 커짐"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "$building_type_hospices_01$ [buildings|E]은 [province|E]에 #P +2#!~#P +10#! [epidemic_resistance|E]을 부여하며, 단계가 오를수록 증가량이 커짐"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "당신의 [realm|E] 밖에 있는 [characters|E]을 상대로 한 [GetScheme('sway').GetTypeName] [scheme_success_chance|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "#high $offer_vassalization_interaction$#! 승낙 확률: #P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$: $VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "이웃 사랑은 하느님의 사랑과 떼어놓을 수 없으며, 자비와 구제의 행위를 통해 우리는 하느님의 율법에 순종하게 됩니다."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "Divinum Officium" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "Theía Leitourgía" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "성찬 전례"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "거룩한 전례는 이 땅 위의 하늘이니, 우리는 그 안에서 천사들과 성도들과 함께 영원한 예배에 참여하게 된다. 거룩하다 거룩하다 거룩하다 만군의 여호와여, 그 영광이 온 땅에 충만하도다.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Divinum Officium의 역사적 배경','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "성찬 전례 안에서 신자들은 하늘의 예배에 참여하며, 시간과 공간을 초월하여 케루빔과 세라핌과 함께 하느님의 옥좌 앞에 서게 된다.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Theía Leitourgía의 역사적 배경','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "전례는 신앙을 드러내는 가장 중심적인 행위이며, 하늘과 땅이 만나는 자리에서 신자들은 천사들과 성도들과 함께 하느님의 영원한 예배에 참여하게 된다.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('성찬 전례의 역사적 배경','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "성찬 전례는 초기 기독교의 예배 전통에서 발전했으며, 성 바실리오스의 전례와 성 요한 크리소스토모의 전례가 동방 기독교의 표준 형식으로 자리 잡았습니다. 이러한 전례는 신자들이 하늘의 예배에 신비롭게 참여한다는 점을 강조했으며, 정교한 의식과 향, 성화, 성가를 통해 신성한 체험을 구현했습니다. 전례는 단순히 인간이 하느님께 드리는 예배로 이해되지 않았으며, 오히려 신자들이 시간과 공간의 경계를 넘어 하늘의 영원한 예배 안으로 들어가는 것으로 여겨졌습니다."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "[GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip] 부여"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "[GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip] 부여\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "당신의 [court_chaplain|E]가 #P +2#! [learning|E] 획득"
 tenet_aniconism_latin_name: "Iconomachia" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "오 주여, 오직 당신만이 경배받으시기에 합당하십니다. 우리를 우상의 올무에서 지켜 주소서. 사람의 손으로 만든 형상이 아니라, 당신께 향한 순결한 마음으로 신령과 진정 안에서 당신을 경배하게 하소서.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Iconomachia의 역사적 배경','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "성상 공경은 성경과 교부들의 전통 어디에서도 정당화되지 않는다. 성상 파괴는 교회의 참된 가르침이며, 신자들을 성상 숭배의 우상화에서 정결하게 한다.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Eikonomakhía의 역사적 배경','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "너를 위하여 새긴 우상을 만들지 말고 어떤 형상의 모습도 만들지 말라. 성상 숭배는 참된 신앙을 타락시키는 행위이다.\n\n$pam_exodus_20_4_default$\n\n[Glossary('무성상주의의 역사적 배경','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "종교적 성상을 회피하고 금지하거나 파괴하는 전통은 아브라함 계통 종교들에 깊이 뿌리내리고 있습니다. 기독교에서 가장 대표적인 사례는 비잔틴 제국의 제1차 성상 파괴 운동(726~843년)이었으며, 이는 황제 레오 3세에 의해 시작되어 콘스탄티노스 5세 치하에서 이어졌습니다. 이 시기에는 종교적 성상들이 광범위하게 파괴되었고, 성상을 공경하던 이들에 대한 박해도 자행되었습니다.\n\n성상 파괴파는 성상 공경이 새긴 성상을 금지한 성경의 계명을 어긴다고 주장했습니다. 그러나 787년 제2차 니케아 공의회는 성상 파괴주의를 정죄하며, 성상을 통한 공경과 기록된 복음서를 통한 공경 사이에는 유사성이 있다고 주장했습니다. 성상 파괴주의는 814년 레오 5세 치하에서 다시 부활했으며, 이후 여러 개신교 운동에서도 유사한 무성상주전통의 경향이 나타났습니다."
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "오 그리스도여, 하나님의 영원한 지혜이신 주여, 우리의 마음을 밝혀 주소서. 우리가 주님의 거룩한 성경 안에 감추어진 신비를 깨닫게 하시고, 문자 너머 생명을 주는 영을 볼 수 있는 눈을 허락하소서.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Catechesis Alexandrina의 역사적 배경','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "알렉산드리아 전통은 성경의 알레고리적 해석을 통해 하나님의 지혜가 드러난다고 가르친다. 그리스도는 로고스, 곧 모든 진리를 드러내시는 하나님의 말씀이시다.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Alexandrinē Katēkhēsis의 역사적 배경','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "알렉산드리아 학파는 성경의 알레고리적 해석과 기독교 신학 및 그리스 철학의 종합을 중시하며, 문자적 의미 아래 감추어진 더 깊은 영적 뜻을 탐구했다.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('알렉산드리아 교리의 역사적 배경','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "2세기 후반에 세워진 알렉산드리아 교리학교는 가장 이른 시기의 기독교 고등교육 기관이었습니다. 알렉산드리아의 클레멘스와 오리게네스 같은 교사들의 지도 아래, 이 학교는 성경 안에서 알레고리적, 영적 의미를 찾아내는 정교한 해석 방법을 발전시켰습니다. 또한 기독교 신학과 플라톤 철학을 종합하며, 그리스 학문이 복음을 위한 길을 예비했다고 주장했습니다.\n\n오리게네스의 성경 주해 방법과 신학적 사변은 동방 기독교에 깊은 영향을 끼쳤으며, 알레고리적 해석을 중시한 이 학파의 전통은 보다 문자적 해석을 강조한 안티오키아 학파와 대비되었습니다."
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "Filius Adoptivus" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "양자설"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "오 아버지, 의로운 사람 예수를 굽어보시고 그를 당신의 것으로 택하신 주여, 우리 또한 양자의 은혜에 합당한 자로 여김받게 하소서. 주께서 물 가운데서 그를 일으키시고 사랑하는 아들이라 선포하셨듯, 우리의 비천함 또한 들어 올리시어 당신의 거룩한 가족 안으로 받아들이소서.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Filius Adoptivus의 역사적 배경','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "오 주님, 비천한 자를 높이시고 의로운 이를 당신의 것으로 택하시는 주여, 양자의 신비를 찬양하나이다. 그리스도께서 당신의 은혜로 하느님의 아들 됨에 이르렀듯, 우리 또한 당신의 자녀 가운데 헤아려지게 하소서.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Hyiothesía의 역사적 배경','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "오 주여, 당신 아들의 높여지심의 신비를 깨닫게 하소서. 우리가 그의 의로움을 본받아 우리 또한 하느님의 자녀라 일컬음을 받게 하소서.\n\n$pam_mark_1_11_default$\n\n[Glossary('양자설의 역사적 배경','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "양자설은 예수가 본래 평범한 인간으로 태어났으며, 이후 하느님의 아들로 '입양'되었다고 보는 교리입니다. 일반적으로 이는 성령이 예수 위에 내려온 세례의 순간에 이루어진 것으로 여겨졌습니다. 초기 형태는 2세기 비잔티움의 테오도토스에게서 나타났는데, 그는 하느님의 유일성을 강조하는 역동적 단일신론을 가르쳤습니다.\n\n이 교리는 8세기 스페인에서 톨레도의 대주교 엘리판두스와 우르헬의 주교 펠릭스를 통해 다시 등장했습니다. 그들은 그리스도의 신적 본성은 성부에게서 영원히 나신 것이며, 인간적 본성은 입양된 것으로 구분했습니다. 794년 프랑크푸르트 공의회는 스페인의 양자설을 이단으로 정죄했습니다. 비록 정죄되었지만, 양자설 사상은 이후 여러 반삼위일체 운동에 영향을 끼쳤습니다."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "일반적인 요구 조건 없이 [adopt|E] [interaction|E]을 항상 사용할 수 있음 (단, 대상은 여전히 입양 대상이 될 수 있어야 하며, 혼인 관계에서 종속된 배우자는 입양할 수 없음)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "[vassals|E] 및 이 [rite|E]를 따르는 아이는 [Concept( 'adopt', '입양' )|E]을 못마땅해하지 않음(#N -10#!~#N -25#! [opinion|E] 불이익을 받지 않음)"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "당신이 일반적인 요구 조건 없이 [adopt|E] [interaction|E]을 항상 사용할 수 있음 (단, 대상은 여전히 입양 대상이 될 수 있어야 함)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "[character|E] [Concept( 'adopt', '입양' )|E] 시 @legitimacy_icon![legitimacy|E], @piety_icon![piety|E], @spiritual_fulfillment_icon![spiritual_fulfillment|E] 획득"
 pam_adoptionism_adopt_sp_toast: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] 개인 원리"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "당신의 [faith|E]에서 허용하는 경우, [Concept( 'legitimized_bastard', '사생아 입적')|E] [interaction|E]의 @prestige_icon![prestige|E] 비용이 #P 50%#! 감소함"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "당신의 [faith|E]에서 허용하는 경우, 당신과 다른 [house|E]에 속한 당신의 [children|E]에게도 [Concept( 'legitimized_bastard', '사생아 입적')|E] [interaction|E]을 사용할 수 있음"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "오 주여, 우리가 당신의 거룩한 이름 아래 십자가를 질 때 우리의 팔을 강하게 하소서. 우리의 걸음을 거룩한 순례의 길로 인도하시어, 우리가 신앙을 수호하고 불신자의 손에서 성지를 해방하게 하소서.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Peregrinatio Armata의 역사적 배경','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "신자들은 영적으로뿐 아니라 성지를 수호하기 위해서도 십자가를 지고 그리스도를 따르도록 부름받는다. 무장 순례는 신심의 행위이며, 칼로 지켜지는 믿음의 여정이다.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Énoplon Proskýnēma의 역사적 배경','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "성지 순례는 거룩한 의무이며, 신자들은 필요하다면 무력을 사용해서라도 성지와 동료 순례자들을 보호하도록 부름받는다.\n\n$pam_matthew_16_24_default$\n\n[Glossary('무장 순례 여행의 역사적 배경','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "성지를 방문하는 영적 수행과, 그 성지를 방어하거나 탈환하기 위한 군사 행동이 결합된 개념. 1095년 클레르몽 공의회에서 교황 우르바노 2세가 호소한 십자군은 가장 조직화된 형태의 무장 순례였습니다. 십자군 참가자들은 전대사를 부여받았으며, 자신의 군사 봉사를 참회와 신심의 행위로 여겼습니다.\n\n이 개념은 참회 전쟁과 외부의 위협으로부터 기독교 세계를 방어하던 오래된 전통들에 기반했으며, 순례를 평화로운 여정에서 무장한 신앙 실천의 형태로 변화시켰습니다."
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "Populus Dei" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "Laòs Theoũ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "우리는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 주님께 소유된 백성이라. 우리가 우리를 부르신 이의 크신 행적을 선포하며, 그 백성으로서 부르심에 합당하게 살아가게 하소서.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Populus Dei의 역사적 배경','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "신자들은 어두움에서 불러내어 그의 기이한 빛 가운데 들어가게 되었으며, 거룩한 나라요 하느님의 소유된 백성을 이룬다. 우리 정체성은 우리를 한 몸으로 만드신 그리스도 안에서 완성된다.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Laòs Theoũ의 역사적 배경','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "신자들은 하느님의 택하신 백성으로 하나 되어, 세상과 구별된 공동체를 이루며 그리스도 안에서 하나의 정체성과 사명을 함께 나눈다.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('공동체 정체성의 역사적 배경','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "교회를 '하느님의 백성'으로 보는 개념은 이스라엘을 하느님의 택하신 백성으로 묘사한 구약의 이미지에서 비롯되었으며, 새 언약의 관점 안에서 새롭게 해석되었습니다. 초기 그리스도인들은 자신들을 혈통이나 민족이 아니라 그리스도에 대한 믿음으로 하나 된 새로운 이스라엘로 이해했습니다.\n\n이러한 공동체 정체성은 사회, 민족, 국가의 경계를 넘어 보편적 형제애를 형성했습니다. 제2차 바티칸 공의회에서 공포된 교회 헌장, 인류의 빛(Lumen Gentium)은 '하느님의 백성'을 핵심 교회론 이미지로 강조하며, 순례하는 교회라는 성격과 세례받은 모든 이들의 공통된 존엄을 부각시켰습니다."
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "콘솔라멘툼"
 tenet_consolamentum_latin_desc: "오 주여, 우리는 선한 싸움을 싸웠고 달려갈 길을 마쳤으며 믿음을 지켰나이다. 이제 당신의 종을 성령의 위로 안으로 받아들이시어, 그 영혼이 이 물질 세계의 속박에서 벗어나게 하소서.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Consolamentum의 역사적 배경','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "안수와 신자들의 기도를 통해 영혼은 하느님의 위로를 받는다. 선한 싸움은 싸워졌고 달려갈 길은 마쳐졌으며 믿음은 끝까지 지켜졌다.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Paráklēsis의 역사적 배경','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "신자들은 거룩한 영적 위로의 예식을 통해 성령을 받고, 이 세상에서 다음 세상으로 향하는 여정을 준비하게 된다.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('콘솔라멘툼의 역사적 배경','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "콘솔라멘툼은 카타리파 신앙의 핵심 성례였으며, 세례, 견진, 성품, 종부성사의 요소를 함께 지닌 의식이었습니다. 이 의식은 안수를 통해 집전되었으며, 성령을 부여하고 영혼을 물질 세계로부터 해방한다고 여겨졌습니다.\n\n대부분의 신자들은 죽음을 앞두고서야 이 의식을 받았으나, 건강한 상태에서 이를 받은 이들은 '완벽한 자(Perfecti)' 또는 '선량한 자(Bons Hommes)'로 불리며 엄격한 금욕 생활에 헌신했습니다. 이 의식은 초기 기독교의 영적 세례 전통에 뿌리를 두고 있었으며, 동방의 보고밀파 전통의 영향 또한 받은 것으로 여겨집니다."
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "Hieròs Gámos" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "오 주여, 우리가 이 거룩한 결합으로 맺어진 것은 정욕 때문이 아니요, 진실함과 참됨 가운데 이루어진 것이옵니다. 바라건대 우리로 긍휼을 얻게 하시고 함께 늙어 가게 하사, 우리의 결합의 거룩함을 지키게 하소서.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Matrimonium Sacrum의 역사적 배경','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "신앙 공동체 안에서의 혼인은 거룩한 혈통을 보존하고 하느님 앞에서의 순수함을 지켜 준다. 이러한 결합은 정욕이 아니라 진실 안에서 축복받는 것이니, 남편과 아내가 긍휼을 얻게 하려 함이다.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Hieròs Gámos의 역사적 배경','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "신앙 공동체 안에서의 신성한 혼인은 영적 순수함을 유지하고, 세대를 넘어 종교적 혈통의 신성함을 보존한다.\n\n$pam_tobit_8_7_default$\n\n[Glossary('신성한 결혼의 역사적 배경','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "신성한 혼인, 곧 종교 공동체 내부에서만 이루어지는 혼인의 개념은 수많은 전통 속에 고대부터 뿌리를 두고 있습니다. 조로아스터교에서는 영적 공덕과 가문의 재산을 유지하기 위하여 크웨도다(xwedodah), 즉 근친혼이 흔히 행해졌습니다. 이러한 관습은 종교적 순수성을 보존하고, 영적 권능을 결집하며, 신성하고 왕가적인 혈통을 유지하는 것을 목표로 삼았습니다.\n\n비록 논란의 여지가 많았고 외부인들에게 자주 오해받았으나, 신자들은 이러한 혼인을 공동체의 거룩함을 유지하라는 신성한 계명을 이루는 행위로 여겼습니다."
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "오 오래도록 감추어졌던 신성한 지혜여, 영적 영역의 비밀을 우리에게 드러내소서. 우리의 영혼을 물질의 감옥에서 해방시키사, 우리가 빛과 지식의 충만함에 이르게 하소서.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Gnosis의 역사적 배경','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "참된 구원은 물질세계에 감추어진 신적 사물들에 대한 비밀스러운 지식, 곧 그노시스를 통하여 이르나니. 우리는 비밀 가운데 있는 하느님의 지혜, 곧 우리의 영광을 위하여 만세 전에 정하신 감취었던 지혜를 말하노라.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Gnõsis의 역사적 배경','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "구원은 비밀스러운 영적 지식을 통하여 이루어지며, 그 지식은 내면에 깃든 신성한 불꽃과 데미우르고스가 창조한 물질세계로부터 벗어나는 길을 드러낸다.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('영지주의의 역사적 배경','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "영지주의는 초기 그리스도교 시대에 나타난 여러 종교 운동들을 포괄하는 개념으로, 그노시스, 곧 비의적인 지식을 통한 구원을 강조했습니다. 영지주의자들은 일반적으로 물질세계를 하위 신격인 데미우르고스가 만든 불완전한 창조물로 보았으며, 참하느님은 숨겨져 있고 초월적인 존재로 여겼습니다. 또한 인간의 영혼 안에는 물질 속에 갇힌 신성한 불꽃이 존재하며, 그것은 비밀스러운 지식을 통하여 해방될 수 있다고 믿었습니다.\n\n주요 영지주의 교사들로는 발렌티누스, 바실리데스, 마르키온 등이 있었습니다. 이레네우스와 테르툴리아누스 같은 교부들은 영지주의 교리를 사도적 그리스도교에서 벗어난 이단으로 간주하였으며, 이에 반대하는 저술을 광범위하게 남겼습니다."
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "Pax et Bonum" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "Ptōkhoì Kērykes" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "오 주여, 주께서 금이나 은 없이 사도들을 내보내셨던 것같이, 우리 또한 가난 가운데 나아가 오직 주의 섭리에만 의지하나이다. 우리에게 은혜를 베푸사, 단순함과 진실함 가운데 주의 복음을 전하게 하소서.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Pax et Bonum의 역사적 배경','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "머리 둘 곳조차 없으셨던 그리스도의 본을 따라, 탁발 설교자들은 자발적인 가난을 받아들인다. 길을 떠나며 아무것도 지니지 아니하고, 복음을 전파하는 가운데 하느님의 공급하심을 신뢰하나니.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Ptōkhoì Kērykes의 역사적 배경','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "가난과 설교에 헌신한 수도회들은 아무 소유 없이 떠돌며 신앙을 전파하고, 날마다의 필요를 위하여 신성한 섭리를 신뢰한다.\n\n$pam_matthew_10_9_default$\n\n[Glossary('탁발승의 역사적 배경','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "탁발 수도회는 기성 교회의 부와 세속화에 대한 대응으로 13세기에 등장했습니다. 1274년 제2차 리옹 공의회에서는 네 주요 수도회인 가르멜회, 아시시의 프란치스코가 세운 프란치스코회, 도미니코 데 구스만이 세운 도미니코회, 그리고 아우구스티노회를 인정했습니다.\n\n공동 재산을 소유하던 전통적 수도회와 달리, 탁발 수도회는 공동체 차원과 개인 차원 모두에서 청빈을 받아들였으며 거의 전적으로 자선과 시주에 의존하여 살아갔습니다. 그들은 도시를 중심으로 활동하며 마을과 도시에서 설교하였고, 교육과 학문을 중시했습니다. 이러한 탁발 수도회의 이상은 여행을 위하여 아무것도 가지지 말라고 말씀하신 마태복음 10장 9절에서 10절, 그리스도의 사도들에 대한 가르침에서 직접적으로 비롯된 것입니다."
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "Quinque Sedes" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "신자들이 그리스도의 이름으로 모이는 곳에 그분께서 그들 가운데 계시도다. 로마와 콘스탄티노폴리스와 알렉산드리아와 안티오키아와 예루살렘의 위대한 다섯 교구좌는 교회의 기둥으로 서 있도다.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Quinque Sedes의 역사적 배경','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "교회는 사도 시대에 세워진 다섯 총대주교좌에 의하여 다스려지나니. 두세 사람이 그 이름으로 모인 곳에는 그리스도께서 함께하시며, 으뜸 교구정을 통하여 그 권위가 온 세상에 행사된다.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Pentarkhía의 역사적 배경','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "보편 교회는 고대의 다섯 총대주교좌에 의하여 다스려지며, 각 교구좌는 자기 지역에 대한 권위를 지니고 공의회적 친교를 통하여 보편을 유지한다.\n\n$pam_matthew_18_20_default$\n\n[Glossary('으뜸 교구정의 역사적 배경','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "펜타르키아, 즉 으뜸 교구정은 로마, 콘스탄티노폴리스, 알렉산드리아, 안티오키아, 예루살렘의 다섯 주요 총대주교좌를 인정하는 교회 통치 체제였습니다. 이 체제는 서기 451년 칼케돈 공의회에서 공식화되었으며, 당시 로마 제국 안에서 이 도시들이 지니고 있던 정치적 중요성을 반영했습니다. 각 총대주교는 자신의 지역에 대한 권위를 행사하였고, 분쟁은 보편 공의회를 통하여 해결되었습니다.\n\n교황권의 최고 우위를 주장하던 로마는 이 체제를 끝까지 완전히 받아들이지 않았으며, 서기 641년 알렉산드리아 함락으로 그 기반은 크게 흔들렸습니다. 이후 1054년 동서 교회 대분열을 거치며 이 체제는 사실상 붕괴했습니다. 그러나 동방 정교회는 계속해서 으뜸 교구정의 이상을 존중하였으며, 이후 러시아와 세르비아 등지에도 새로운 총대주교좌가 세워졌습니다."
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "Fides Indefessa" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "Pístis Akatapónētos" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "오 주여, 바라는 것들의 실상이요 보지 못하는 것들의 증거인 우리의 믿음을 굳세게 하소서. 어떠한 역경 속에서도 굳게 서게 하시고, 주를 향한 우리의 헌신이 결코 흔들리지 않게 하소서.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Fides Indefessa의 역사적 배경','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니. 흔들리지 아니하는 믿음을 통하여 신자들은 모든 시련과 박해를 이겨 내며, 죽음에 이르기까지 굳게 서느니라.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Pístis Akatapónētos의 역사적 배경','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "박해와 고난과 의심으로도 흔들리지 아니하는 신앙. 신자들은 세속적 결과가 어떠하든 자신의 신념 안에 굳게 설 것을 요구받는다.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('사그라지지 않는 믿음의 역사적 배경','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "순교자와 신앙 고백자의 사례는 그리스도교 역사 전반에 걸쳐 이상적인 모범으로 제시되어 왔습니다. 네로와 디오클레티아누스 치하의 초기 박해에서부터 이후의 수많은 시련에 이르기까지, 또한 프라하의 아달베르트처럼 적대적인 민족을 개종시키려다 여행 도중 죽음을 맞은 선교사에 이르기까지, 그리스도인들은 죽음을 감수하는 한이 있더라도 신앙을 지킬 것을 요구받았습니다.\n\n신앙은 어떠한 대가를 치르더라도 수호되고 유지되며 전파되어야 한다는 확신은 수많은 수도 운동과 선교 활동에 영감을 주었습니다. 또한 믿음을 위하여 고문과 처형을 견뎌 낸 성인들의 이야기는 신자들의 결의를 굳세게 하였고, 확실한 구원의 길로 여겨졌습니다."
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "합성론"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "에페소 공의회는 강도회의가 아니었다. 칼케돈의 오류는 바로잡혀야 한다. 신성과 인성은 혼합되지 아니하고, 변화되지 아니하며, 나뉘지 아니하고, 분리되지 아니한 채 그리스도의 한 위격 안에서 연합되어 있다.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Miaphysitismus의 역사적 배경','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "에페소 공의회가 에우티케스를 복권시키고 플라비아누스를 정죄한 것은 잘못이 아니었다. 그리스도께서는 하나로 결합된 신인의 본성을 지니시며, 완전한 하느님이시요 완전한 인간이시며, 혼합이나 분리 없이 결합되어 계신다.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Miaphysitismós의 역사적 배경','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "그리스도께서는 신성과 인성이 함께하는 하나의 결합된 본성을 지니시며, 그 본성은 성육신 안에서 분리될 수 없이 결합되어 있다.\n\n$pam_colossians_2_9_default$\n\n[Glossary('합성론의 역사적 배경','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "그리스어 mia(#weak 하나#!)와 physis(#weak 본성#!)에서 그 이름이 유래한 미아시피즘, 곧 합성론은 그리스도 안에서 신성과 인성이 혼합되거나 분리되지 않은 채 하나의 복합된 본성으로 결합되어 있다고 주장합니다. 알렉산드리아의 키릴로스는 #weak mia physis tou theou logou sesarkōménē#!, 곧 \"성육신한 하느님 말씀의 하나의 본성\"이라는 표현을 주창했으며, 하나로 결합된 가운데서도 신성과 인성 모두의 온전한 실재를 인정한다는 점에서 단성론과 구별됩니다.\n\n서기 451년 칼케돈 공의회는 이 공식을 거부하고 대신 디오피시즘, 곧 \"양성론\" 교리를 채택했습니다. 이후 오리엔트 정교회, 곧 콥트 교회, 아르메니아 교회, 에티오피아 교회, 시리아 교회 등은 비잔티움 교회와 분리되어 오늘날까지 독자적으로 합성론 신학을 유지하고 있습니다."
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[GetTrait('honest').GetName( GetNullCharacter )] [characters|E]: @piety_icon![piety|E] 획득량 #P +10%#!, [clergy|E] [opinion|E] #P +10#!"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[GetTrait('deceitful').GetName( GetNullCharacter )] [characters|E]: @piety_icon![piety|E] 획득량 #N -10%#!, [clergy|E] [opinion|E] #N -10#!"
 doctrine_parameter_tenet_miaphysitism_open_confession: "당신의 [liege|E]이 당신과 같은 [faith|E]을 믿지 않는 동안 매년 [piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [piety|E]"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "헤시카즘"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "오 주여, 우리에게 거룩한 고요의 은혜를 허락하소서. 가까이 가지 못할 빛 가운데 거하시는 주를 우리가 만나게 하소서. 쉬지 말고 기도하는 법을 우리에게 가르치사, 우리의 마음이 주의 임재하시는 성전이 되게 하소서.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Hesychasmus의 역사적 배경','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "주 예수 그리스도시여, 하느님의 아들이시여, 죄인인 나를 불쌍히 여기소서. 몸과 마음의 고요함을 통하여, 마음의 기도를 끊임없이 되풀이함을 통하여, 나로 하여금 테오리아, 곧 창조되지 아니한 신성한 빛의 환상에 이르게 하소서.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Hēsykhasmós의 역사적 배경','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "내적 고요와 관상 기도와 예수 기도의 반복을 통하여, 신자들은 하느님과의 직접적인 교통을 체험하고 그분의 창조되지 아니한 빛을 바라볼 수 있다.\n\n$pam_psalm_46_10_default$\n\n[Glossary('헤시카즘의 역사적 배경','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "그리스어로 고요를 뜻하는 #weak hēsykhía#!에서 유래한 헤시카즘은 동방 그리스도교의 관상 전통으로, 마음의 기도를 중시하며 그 뿌리는 4세기 이집트의 사막 교부들에게까지 거슬러 올라갑니다. 그 중심 수행은 #weak 주 예수 그리스도, 하느님의 아드님, 죄인인 저에게 자비를 베푸소서#!라는 예수 기도를 반복해서 바치는 것으로 자리 잡았으며, 흔히 호흡과 심장 박동에 맞추어 기도했습니다.\n\n14세기에 성 그레고리오 팔라마스는 아토스 성산의 헤시카즘 수도자들을 이단으로 규정하려 한 칼라브리아의 발람에 맞서 그들을 변호했습니다. 이 수도자들은 주님의 변모 때 타볼산에 나타났던 창조되지 않은 빛을 자신들도 보았다고 주장했습니다. 1341년과 1351년 콘스탄티노폴리스에서 열린 공의회에서는 팔라마스의 입장을 인정했으며, 이를 계기로 헤시카즘은 정교회의 교리로 확립되었습니다."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "당신의 [capital|E]에서 [GetDecisionWithKey('meditate_in_seclusion_decision').GetName] [decision|E]을 내리면 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E]이 #P 증가함#!"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "이 [rite|E]에 속한 [clergy|E]에 의한 #high $spiritual_counsel_interaction$#!이 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E]을 더 많이 부여함"
