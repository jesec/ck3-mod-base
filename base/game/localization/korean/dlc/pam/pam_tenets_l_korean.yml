 pam_acts_13_33_greek: "[Glossary('Hóti taútēn ho theòs ekpeplerōken toĩs téknois hēmõn anastesas Iēsoũn, hōs kaì en to psalmo gégraptai to deutéro; Hyiós mou eĩ sý, ego semeron gegénnēká se.', 'ACTS_13_33_GREEK_GLOSS')]" #ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ψαλμῷ γέγραπται τῷ δευτέρῳ· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
