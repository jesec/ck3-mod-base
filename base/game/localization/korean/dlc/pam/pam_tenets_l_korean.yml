 # Anachoresis tenet
 tenet_anachoresis_latin_name: "Vita Eremitica" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "아나코레시스"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "오 주여, 주께서 주의 아들을 광야로 이끄사 그의 사역을 준비하게 하셨던 것과 같이, 우리 또한 우리 마음의 사막으로 인도하소서. 고독과 침묵 가운데 세상의 유혹과 번잡함을 피하여, 오직 주만을 발견하게 하소서.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Vita Eremitica의 역사적 배경','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "세상으로부터 물러나는 자들은 복이 있나니, 그들이 광야의 침묵 가운데서 하느님을 발견할 것임이요. 선지자들이 굴과 땅의 구멍 속에 거하였던 것같이, 그리스도의 종들 또한 정욕과 싸우기 위하여 고독을 찾느니라.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Anakhōrēsis의 역사적 배경','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "신자들은 세속 사회를 떠나 광야로 물러남을 통하여 영적 순수함에 이르고, 정욕을 극복하며, 고독한 기도와 금욕적 수련을 통하여 하느님께 더욱 가까이 나아갈 수 있다.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('아나코레시스의 역사적 배경','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "아나코레시스는 그리스어로 물러남을 뜻하는 #weak anakhorēsis#!에서 유래한 말로, 사회를 떠나 광야에 은거한 은수자들이 기도와 단식에 전념하고 악마의 세력에 맞서 영적 투쟁을 벌이며 살아가는 수행 방식입니다. 이러한 은수 생활은 3세기 이집트에서 시작되었습니다. 전통적으로 최초의 그리스도교 은수자로 여겨지는 테베의 성 바오로는 250년경 데키우스 황제의 박해를 피해 테베의 광야로 들어갔습니다.\n\n독수자들은 중세에도 흔히 볼 수 있었으며, 수도원에 딸린 외딴 독방에서 생활하면서 작은 창을 통해 성체를 받아 모셨습니다. 13세기 잉글랜드의 은둔자 지침서(Ancrene Wisse)와 같은 저술에는 남녀 독수자들이 지켜야 할 규율이 정리되어 있었습니다."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "[GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] 획득"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "당신의 [capital|E] 밖에서 [GetDecisionWithKey('meditate_in_seclusion_decision').GetName] [decision|E]을 내리면 @piety_icon![piety|E]와 @spiritual_fulfillment_icon![spiritual_fulfillment|E]이 #P 증가함#!"
