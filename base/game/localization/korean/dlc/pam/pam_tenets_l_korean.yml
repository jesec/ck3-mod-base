 pam_james_5_16_greek: "[Glossary('Exomologeĩsthe oũn allelois tàs hamartías kaì proseúchesthe hypèr allelōn, hópōs iathẽte. polỳ ischýei déēsis dikaíou energouménē.', 'JAMES_5_16_GREEK_GLOSS')]" #ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ προσεύχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
 pam_1_john_1_9_greek: "[Glossary('Eàn homologõmen tàs hamartías hēmõn, pistós estin kaì díkaios hína aphe hēmĩn tàs hamartías kaì katharíse hēmãs apò pάsēs adikías.', '1_JOHN_1_9_GREEK_GLOSS')]" #ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
