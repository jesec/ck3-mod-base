 pam_luke_1_42_english: "여자 중에 네가 복이 있으며 네 태중의 아이도 복이 있도다."
 pam_luke_1_79_english: "어두움과 죽음의 그늘에 앉은 자에게 비취고 우리 발을 평강의 길로 인도하시리로다 하니라"
 pam_colossians_3_15_english: "그리스도의 평강이 너희 마음을 주장하게 하라 평강을 위하여 너희가 한 몸으로 부르심을 받았나니 또한 너희는 감사하는 자가 되라."
 pam_matthew_5_9_english: "화평케 하는 자는 복이 있나니 저희가 하나님의 아들이라 일컬음을 받을 것임이요."
 pam_philippians_4_21_english: "그리스도 예수 안에 있는 성도에게 각각 문안하라 나와 함께 있는 형제들이 너희에게 문안하고."
 pam_hebrews_12_1_english: "이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 경주하며."
 pam_acts_7_59_english: "저희가 돌로 스데반을 치니 스데반이 부르짖어 가로되 주 예수여 내 영혼을 받으시옵소서 하고."
 pam_luke_22_19_english: "또 떡을 가져 사례하시고 떼어 저희에게 주시며 가라사대 이것은 너희를 위하여 주는 내 몸이라 너희가 이를 행하여 나를 기념하라 하시고."
 pam_1_corinthians_1_10_english: "형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 다 같은 말을 하고 #bold 너희 가운데 분쟁이 없이#! 같은 마음과 같은 뜻으로 온전히 합하라."
 pam_1_corinthians_10_16_english: "우리가 축복하는바 축복의 잔은 그리스도의 피에 참예함이 아니며 우리가 떼는 떡은 그리스도의 몸에 참예함이 아니냐."
 pam_1_corinthians_10_17_english: "떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참예함이라."
 pam_john_6_41_english: "자기가 하늘로서 내려온 떡이라 하시므로 유대인들이 예수께 대하여 수군거려."
 pam_1_thessalonians_5_16_20_english: "항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라 이는 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라. 성령을 소멸치 말며 예언을 멸시치 말고."
 pam_1_thessalonians_4_11_english: "또 너희에게 명한것 같이 종용하여 자기 일을 하고 너희 손으로 일하기를 힘쓰라."
 pam_proverbs_6_6_english: "게으른 자여 개미에게로 가서 그 하는 것을 보고 지혜를 얻으라."
 pam_john_19_26_27_english: "예수께서 그 모친과 사랑하시는 제자가 곁에 섰는 것을 보시고 그 모친께 말씀하시되 여자여 보소서 아들이니이다 하시고 또 그 제자에게 이르시되 보라 네 어머니라 하신대 그 때부터 그 제자가 자기 집에 모시니라."
 pam_isaiah_7_14_english: "그러므로 주께서 친히 징조로 너희에게 주실 것이라 보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름을 임마누엘이라 하리라."
 pam_proverbs_31_20_english: "그는 간곤한 자에게 손을 펴며 궁핍한 자를 위하여 손을 내밀며."
 pam_revelation_12_1_english: "하늘에 큰 이적이 보이니 해를 입은 한 여자가 있는데 그 발 아래는 달이 있고 그 머리에는 열 두 별의 면류관을 썼더라."
 pam_acts_8_18_english: "시몬이 사도들의 안수함으로 성령 받는 것을 보고 돈을 드려."
 pam_proverbs_21_20_english: "지혜 있는 자의 집에는 귀한 보배와 기름이 있으나 미련한 자는 이것을 다 삼켜 버리느니라."
 pam_luke_16_11_english: "너희가 만일 불의한 재물에 충성치 아니하면 누가 참된 것으로 너희에게 맡기겠느냐."
 pam_john_10_30_english: "나와 아버지는 하나이니라 하신대."
 pam_john_1_1_english: "태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라."
 pam_hebrews_1_3_english: "이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결케 하는 일을 하시고 높은 곳에 계신 위엄의 우편에 앉으셨느니라."
 pam_acts_1_8_english: "오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅끝까지 이르러 내 증인이 되리라 하시니라."
 pam_acts_2_4_english: "저희가 다 성령의 충만함을 받고 성령이 말하게 하심을 따라 다른 방언으로 말하기를 시작하니라."
 pam_acts_2_38_english: "베드로가 가로되 \"너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 얻으라 그리하면 성령을 선물로 받으리니.\""
 pam_2_macabees_12_44_english: "그가 전사자들이 다시 부활하리라는 희망을 품지 않았다면, 죽은 자를 위한 기도는 허사이며 어리석은 일이 되었으리라."
 pam_matthew_12_25_english: "스스로 분쟁하는 나라마다 황폐하여질 것이요 스스로 분쟁하는 동네나 집마다 서지 못하리라."
 pam_matthew_12_32_english: "또 누구든지 말로 인자를 거역하면 사하심을 얻되 누구든지 말로 성령을 거역하면 이 세상과 오는 세상에도 사하심을 얻지 못하리라."
 pam_hebrews_12_29_english: "우리 하나님은 소멸하는 불이심이니라."
 pam_genesis_1_28_english: "하나님이 그들에게 복을 주시며 그들에게 이르시되 생육하고 번성하여 땅에 충만하라, 땅을 정복하라, 바다의 고기와 공중의 새와 땅에 움직이는 모든 생물을 다스리라 하시니라."
 pam_matthew_19_5_english: "말씀하시기를 이러므로 사람이 그 부모를 떠나서 아내에게 합하여 그 둘이 한 몸이 될찌니라 하신 것을 읽지 못하였느냐."
 pam_ephesians_4_3_6_english: "평안의 매는 줄로 성령의 하나 되게 하신 것을 힘써 지키라. 몸이 하나이요 성령이 하나이니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 입었느니라. 주도 하나이요 믿음도 하나이요 세례도 하나이요."
 pam_ephesians_5_25_english: "남편들아 아내 사랑하기를 그리스도께서 교회를 사랑하시고 위하여 자신을 주심 같이 하라."
 pam_matthew_16_18_english: "또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"
