 doctrine_parameter_tenet_mortification_mortify_flesh: "[GetDecisionWithKey('stress_loss_flagellant_decision').GetName] [decision|E]을 사용할 수 있게 됨"
 pam_mortification_revel_toast: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )] [personal_tenet|E]"
 pam_mortification_flagellant_gain_toast: "당신의 [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]에서: 당신이 [GetTrait('flagellant').GetName( GetPlayer.Self )|E]의 길을 받아들였음"
 pam_mortification_holy_scars_toast: "당신의 [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]에서: 채찍이 당신의 육신에 성흔을 남겼음"
 pam_mortification_suffering_sanctifies_toast: "당신의 [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )]에서: 당신은 육신의 고통을 하느님께 봉헌함"
 tenet_mortification_of_the_flesh_historical_desc: "#weak 몸의 행실을 죽이라#!라는 성 바오로의 가르침(로마서 8장 13절)과 #weak 내 몸을 쳐 복종하게 한다#!라는 가르침(고린도전서 9장 27절)에 뿌리를 둔 육신의 극기는 초대 교회 때부터 그리스도교 금욕 생활의 핵심이었습니다. 이를 가장 극단적으로 실천한 이들은 주상 수도자들이었습니다. 성 시메온 주행자는 알레포 인근의 기둥 위에서 37년을 지내며, 타는 듯한 더위와 얼어붙는 추위 속에서도 끊임없이 기도했습니다.\n\n중세 서방 그리스도교에서는 스스로를 채찍질하는 고행이 널리 퍼졌으며, 성직자들 사이에서는 성 베드로 다미아니(1007~1072)가 이를 적극적으로 장려했습니다. 13~14세기의 채찍질 고행 운동 당시에는 역병과 재난이 닥칠 때 평신도들이 보속의 뜻으로 자신을 채찍질하며 도시 곳곳을 행진했습니다."
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "Qeddus Meron" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "Sanctum Chrisma" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "Hágion Mýron" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "성유"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "신자들은 아부나가 축성한 성유를 통해 성령의 표시를 받는다. 요단강에서 세례받으신 그리스도 위에 비둘기가 내려왔던 것과 같이, 이 거룩한 도유를 통하여 성령 또한 새로 세례받은 자들 위에 내려오사 그들을 하느님의 자녀로 표시하신다.\n\n$pam_john_3_5_default$\n\n[Glossary('Qeddus Meron의 역사적 배경','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "주교가 축성한 거룩한 성유를 통하여 신자들은 성령의 은사의 표시를 받는다. 이 도유는 세례의 은혜를 완성한다.\n\n$pam_john_3_5_latin$\n\n[Glossary('Sanctum Chrisma의 역사적 배경','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "총대주교가 축성한 성유는 성령의 은사임을 표시한다. 이 거룩한 도유를 통하여 새롭게 빛을 받은 자들은 성령의 은사의 충만함을 받고 살아 계신 하느님의 성전이 된다.\n\n$pam_john_3_5_greek$\n\n[Glossary('Hágion Mýron의 역사적 배경','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "성유는 특별히 축성된 기름으로, 견진성사에서 새롭게 세례받은 자들에게 성령의 은사를 표시하여 교회 입문을 완성하는 데 사용된다.\n\n$pam_john_3_5_default$\n\n[Glossary('성유의 역사적 배경','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "성유를 뜻하는 거룩한 미론은 그리스어로 향유를 나타내는 #weak mýron#!에서 유래했으며, 견진성사에 사용됩니다. 동방 교회에서는 유아도 세례성사를 받은 직후 곧바로 견진성사를 받지만, 서방 교회에서는 주교가 별도로 견진성사를 집전합니다. 기름부음은 성경에 깊은 뿌리를 두고 있습니다. #weak 그리스도#!와 #weak 메시아#!는 모두 #weak 기름 부음 받은 자#!를 뜻합니다.\n\n새 미론을 축성하는 일은 드물게 거행되는 장엄한 의식입니다. 새 미론에는 반드시 이전에 축성한 미론의 일부를 섞으며, 이렇게 끊이지 않고 이어져 온 미론은 사도들에게까지 거슬러 올라간다고 전해집니다. 에티오피아 전승에 따르면 #weak Meron#!의 제조법은 5세기 시리아에서 온 선교사 아홉 성인이 전해 주었으며, 그 축성은 총대주교(아부나)만이 할 수 있습니다."
 doctrine_parameter_tenet_holy_myron_artifact: "[GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName] [decision|E]을 통해 [court_chaplain|E]를 보내 #V 미론 성유#! [artifact|E]을 만들 수 있음. 해당 유물의 사용 횟수는 다음을 축복하는 데 소모됨: [artifacts|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
