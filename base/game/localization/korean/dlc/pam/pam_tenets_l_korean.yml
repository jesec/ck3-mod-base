 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[GetTrait('impatient').GetName( GetNullCharacter )] [characters|E]: @piety_icon![piety|E] 획득량 #N -10%#!"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[GetTrait('journaller').GetName( GetNullCharacter )], [GetTrait('contrite').GetName( GetNullCharacter )], [GetTrait('confider').GetName( GetNullCharacter )], [GetTrait('flagellant').GetName( GetNullCharacter )] [characters|E]: [stress|E] 상실량 #P +10%#!, @spiritual_fulfillment_icon![spiritual_fulfillment|E] 획득량 #P +5%#!"
