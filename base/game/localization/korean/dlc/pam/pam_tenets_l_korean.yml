 # Khachkar tenet
 tenet_khachkar_armenian_name: "Khachkar" # DO NOT TRANSLATE
 tenet_khachkar_latin_name: "Crux Lapidea" # DO NOT TRANSLATE
 tenet_khachkar_greek_name: "Líthinos Staurós" # DO NOT TRANSLATE
 tenet_khachkar_default_name: "하치카르"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "하치카르는 우리 신앙의 영원한 증인으로 서 있도다. 십자가와 포도나무와 거룩한 상징들로 정교하게 새겨진 각각의 하치카르는 돌에 새겨진 기도이니, 세상을 구원한 그 십자가를 영화롭게 한다.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar의 역사적 배경','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "아르메니아인들이 돌 십자가를 하늘 높이 세우는 것같이, 우리 또한 우리 주 예수 그리스도의 십자가, 곧 구원의 표적으로 이 땅을 새기게 하소서.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Crux Lapidea의 역사적 배경','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "거룩한 상징들로 새겨진 돌 기념비는 그리스도의 승리를 증언하며, 신자들을 위한 영원한 기념물로 서 있다.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Líthinos Staurós의 역사적 배경','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "정교한 종교적 형상으로 새겨진 석조 십자가는 성지를 표시하고 죽은 이를 기념하며 신성한 섭리를 기리는 거룩한 기념물로 사용된다.\n\n$pam_galatians_6_14_default$\n\n[Glossary('하치카르의 역사적 배경','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "하치카르는 아르메니아어로 #weak khach#!(십자가)와 #weak k'ar#!(돌)에서 유래한 말로, 십자가를 중심으로 정교하게 조각된 석비를 뜻합니다. 십자가 아래에는 장미꽃무늬나 영원의 수레바퀴가 새겨진 경우가 많습니다. 이는 아르메니아 그리스도교 문화 특유의 조형물로서, 성지를 표시하거나 중요한 사건과 승리를 기념하고 죽은 이를 추모하는 데 쓰였습니다.\n\n하치카르 전통은 아르메니아가 301년 그리스도교를 받아들인 뒤 성 그레고리오 계몽자가 이교 신전 자리에 세운 목제 십자가에서 비롯되었습니다. 이후 9세기에 석조 형태로 자리 잡았으며, 12~13세기 자카리드 제후들의 통치기에 전성기를 맞이했습니다. 하치카르는 노라방크의 모미크와 같은 장인 조각가들이 제작을 맡아 하나하나가 서로 다른 모습으로 제작되었습니다. 그중 일부는 기적을 일으키는 힘이 있다고 여겨져 순례의 대상이 되기도 했습니다."
