l_korean:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName](은)는 여러 봉역에 걸쳐 뻗어 나가며 각자의 다양한 언어, 문화, 갈등을 보유한 수많은 사람으로 이루어져 있다.\n\n교리 분쟁이 교회만큼이나 오랜 역사를 자랑하는 가운데, 역병과 전쟁, 이단의 습격을 받는 이 말세에서 우리의 단합이 시험대에 올랐다.\n\n사도 [st_paul.GetName](이)가 코린트인에게 단합하기를 탄원하고 있으며, 모든 [christians|E] 역시 [st_paul.GetHerHis] 인도를 따라 [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )] 임해야 한다. 그러지 못하면 우리는 이단의 곤경에 빠져 적그리스도의 놀잇감으로 전락하고 말 것이다.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "우리의 연약한 이웃인 [christians|E]은 약하고 시기심 많은 신을 따르며, 인형의 본성을 두고 다투는 아이들처럼 사소한 일로 싸우기 바쁘다. 그동안 저들의 경계는 무뎌지고 검은 굶주린다. 이러니 저들은 참된 유혈 사태를 맛본 지도 한참 지났다.\n\n저들은 신성한 사람을 보내 자신들의 나약함을 우리 땅에 퍼뜨리려 한다. 차라리 우리가 그쪽을 방문해 저들의 돈궤를 터는 편이 낫다! 우리를 본보기로 삼으면 저 사람들도 다시 강해지는 법을 배우게 될지도 모른다."
 pam_the_christian_church.0051.desc.heathen_rulers: "우리의 [christian|E] 이웃은 어딘지 엉성하며, 하찮은 일로 다투기 바쁜 사람들이다. 저들은 물속의 진흙과도 같고, [ROOT.Char.GetFaith.HighGodName]의 추종자들을 비추는 조악한 거울이다. 과거에 붙들린 저 거짓된 믿음은 저들을 오직 파멸의 길로 인도할 뿐이다.\n\n빈약하기는 하지만, 저들한테도 빼앗을 만한 보물이 있다. 규율이라곤 찾아볼 수 없는 저 민족 또한 복속시킬 수 있을 것이다."
 pam_the_christian_church.0051.desc.heretic_rulers: "[st_peter.GetName]의 자리에 앉은 멍청이는 진정한 신도인 우리를 이단자로 몰아갈 것이다. 그리스도가 부활한다면, 분명 바리새인이 되어 다시 또 우리 주님의 십자가형을 요구하겠지.\n\n그리스도를 섬기는 우리들 사이의 분열을 보라! 로마의 거짓 사제가 바로 이 불화의 밭에 씨앗을 뿌렸다.\n\n저 사탄의 사악한 섭정이 우리를 순교자로 만들려 하고 있다. 모든 [christians|E]의 구원을 위해서는 이 궤양을 잘라내야만 한다!"
 pam_the_christian_church.0051.desc.western: "로마 주교의 권력이 약해졌다. 다가오는 최후의 심판을 기다리는 동안, 우리가 신앙의 이 균열을 메워야만 한다."
 pam_the_christian_church.0051.desc.eastern: "그리스도의 적이 우리를 둘러싸고 있다. 다가오는 최후의 심판을 기다리는 동안, 우리는 로마 주교와 공통된 대의를 추구해야만 한다."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\n공의회는 교회가 임명한 고위 성직자를 군주들이 해임할 수 있도록 허용했다."
 pam_the_christian_church.0051.desc.oriental_orthodox: "\"[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )].\" 최후의 심판이 다가오니 우리 형제들을 다시 빛으로 이끌어야만 한다."
 pam_the_christian_church.0051.a: "그리스도가 우리를 인도하신다!"
 pam_the_christian_church.0051.b: "이 그리스도의 신자들을 계속 주시해야겠다."
 MIAPHYSITISM_GLOSS: "#bold \"육신이 되신 하느님 말씀의 본성은 하나이다!\"#! 알렉산드리아의 성 키릴로스가 431년에 에페소스 공의회에서 선언한 내용입니다. 이 기독론적 관점은 합성론이라는 이름으로 알려졌으며, 오리엔트 정교회에서 주로 받아들이는 교리입니다."
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName](을)를 둘러싼 어둠 속에서 합창이 터져 나왔다.\n\n#EMP \"로마는 오늘날의 소돔이나 마찬가지다!\"#!\n\n#EMP \"교황은 포주이자 매춘부다!\"#!\n\n이보다 더 온화한 관점을 가진 이들이라도 인정할 수밖에 없으리라. 교회는 위기를 맞이했으며, 개혁이 필요한 상황이다."
 pam_the_christian_church.0052.desc.unreformed_pagan: "나약한 영혼을 가진 이웃인 [christians|E]들이 외쳤다. \"종말이 다가왔다! 우리 교황은 이교도처럼 야만적이다.\"\n\n적어도 한 가지는 사실이기는 하다. 저들이 그렇게 종말을 부르짖으니, 우리가 그 종말을 불러와 줘야겠다!"
 pam_the_christian_church.0052.desc.heathen_rulers: "\"우리 교회가 위기다!\" [christians|E]들이 외쳤다.\n\n우리야 항상 알고 있던 사실인데, 저쪽에서 이제라도 알아차렸으니 다행이지 싶다. 저 멍청한 이교도 놈들이 우리를 본보기로 삼아 언젠가는 [ROOT.Char.GetFaith.HighGodName]의 길을 받아들이길 바랄 뿐이다.\n\n빈약하기는 하지만, 저들한테도 빼앗을 만한 보물이 있다. 규율이라곤 찾아볼 수 없는 저 민족 또한 복속시킬 수 있을 것이다."
 pam_the_christian_church.0052.desc.heretic_rulers: "베드로의 옷을 입은 적그리스도를 막아야 한다!"
 pam_the_christian_church.0052.desc.western: "변화는 먼저 로마에서 시작되어야 한다. 그런 다음에야 [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip]의 치유를 바랄 수 있다."
 pam_the_christian_church.0052.desc.eastern: "그리스도의 적이 우리를 둘러싸고 있다. 로마의 타락을 치유해야만 한다. 그러지 않으면 우리가 그 타락에 먹혀 버릴 것이다."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "주님께서 길을 밝혀 주시기를!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "우리의 전도가 크나큰 진전을 이뤘으니 기뻐해야 한다! [GetSituation('the_christian_church').GetTopSubRegion.GetName]의 경계가 확장되었으며 이교도 야만인들이 그리스도의 길을 걷는 법을 배우고 있다.\n\n아쉽게도 모두가 교회의 가르침을 받아들이지는 않았다. 그러나 두려워하지 말라. 저들이 우리의 전도사를 거부한다면, 우리의 기도를 검 끝으로 배우게 될 테니!\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "[christians|E]인들이 신성한 사람들과 함께 우리의 땅으로 왔다. 저들을 돌려보내면 검을 들고 다시 돌아온다.\n\n대부분의 우리 민족은 [ROOT.Char.GetFaith.HighGodName]의 방식을 유지하려 애쓰고 있지만, 인간이지 신인 그리스도를 섬기는 데서 오는 이득을 인지하는 자들도 있다. 존재의 권력은 신에 의해 임명받으며 교회는 우리의 전령 역할을 한다. 물론 가장 흥미가 당기는 점은, 바로 교회가 세금을 걷는다는 점이다."
 pam_the_christian_church.0053.desc.heathen_rulers: "우리의 [christians|E] 이웃은 도살당할 처지에 지나지 않던 우상 숭배자를 강제로 개종시킨다.\n\n저들의 검이 우리가 아닌 다른 곳을 향하고 있는 동안, [ROOT.Char.GetFaith.HighGodName]께서 기회의 창을 열어 주셨다. 빈약하기는 하지만, 저들한테도 빼앗을 만한 보물이 있다. 규율이라곤 찾아볼 수 없는 저 민족 또한 복속시킬 수 있을 것이다."
 pam_the_christian_church.0053.desc.heretic_rulers: "로마의 참칭자가 자신의 잘못된 숭배를 통해 이교도를 개종시키려 하고 있다! 이 적그리스도는 [christians|E]의 마음에 독을 타는 것으로도 부족했는지, 비틀린 탐욕을 숨기지 않으며 저 미숙한 우상 숭배자들을 자신의 지옥으로 끌어들이려 하고 있다."
 pam_the_christian_church.0053.desc.western: "성 베드로의 성좌에서 인가한 대로, 우리는 새롭게 태어난 이 기독교인들이 [ROOT.Char.GetRite.GetName](을)를 숭배할 수 있도록 신중하게 인도해야 한다."
 pam_the_christian_church.0053.desc.eastern: "로마는 [GetSituation('the_christian_church').GetTopSubRegion.GetName] 바깥의 이들만 개종시키려 할 뿐이라고 주장하지만, 우리는 경계를 늦추지 않아야 한다. 저들이 우리의 [ROOT.Char.GetRite.GetName](을)를 강탈해 가거나, 최악의 상황에는 방금 죽인 이교의 피를 묻힌 검을 동료 기독교인에게 들이댈지도 모른다."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] 앞에는 힘든 과제가 놓이게 되었다. 그러나 교회는 아직 구제의 여지가 있다.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\n그러나 교회는 아직 구제의 여지가 있다!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "하느님을 향한 우리의 믿음은 흔들리지 않겠지만, 많은 이가 교회에 대한 믿음을 잃었다. 성직자는 한때 그리스도와 같은 행적으로 모범이 되었으나, 이제는 그 독립성의 대부분을 잃었으며 황제와 왕의 영향력을 시행하는 도구에 지나지 않는다."
 pam_the_christian_church.0054.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural]들은 자신들의 화려한 성직자 예복을 찢어버리며, 덧댄 부분을 신이 눈치채지 못하길 바라고 있다. 저들이 제의복을 수선하고 연대기를 고치느라 바쁘다면, 우리의 숲과 강가의 성소를 괴롭힐 성직자를 덜 보낼지도 모른다."
 pam_the_christian_church.0054.desc.heathen_rulers: "[christianity.GetAdherentNamePlural]들이 율법과 제단을 대대적으로 쇄신하는 연습을 하고 있다. 각 파벌은 고난의 신에게 더 순수한 섬김을 바친다고 주장한다. 저들의 새로운 구호를 기억해 둬야겠지만, 저들의 공의회보다는 아직 우리의 도끼날이 더 명확한 답을 던져 주고 있다."
 pam_the_christian_church.0054.desc.heretic_rulers: "로마 종파들이 개혁을 두고 다투는 중이다! 저들이 말하는 부활은 똑같은 굴레를 더 위험해진 독선주의를 따라 조여 맨 것에 지나지 않는다. 저들이 우리를 기억해 내기 전까지 대성당 안에서 그 잘난 개혁을 두고 싸우게 내버려두자."
 pam_the_christian_church.0054.desc.western: "누군가는 이를 진로 정정 개혁이라 할지도 모르지만, 사람들은 혁신을 경계하므로 이 개혁을 '옛 방식으로의 회귀'라 포장하는 것이 훨씬 잘 받아들여질지도 모른다."
 pam_the_christian_church.0054.desc.eastern: "로마, 또는 자신을 오이쿠메네의 중재자라 칭하는 교황청 집무실에서는 새로운 정경, 새로운 서약, 고대의 죄악을 향한 새로운 질책을 통해 자신의 교파를 다듬어 나가고 있다. 우리는 서구의 절제가 보편적인 굴레로 오해되지 않도록 감시하며 꾸짖고, 우리의 시노드를 강화해야 한다."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\n공의회는 교회의 임명권을 인정하고, 그 직위를 종신직으로 유지하기로 결정했다."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\n세속의 군주가 [christianity.GetReligiousHeadTitle.GetNamePossessive|U] 주교에게 서약을 강요한다. 이는 성직 서품을 농장 임차처럼 여기는 태도다. 한편 [christianity.GetReligiousHeadTitle.GetName](은)는 자신이 서임하지 않은 주교를 왕실에서 축성하는 행위를 금지했다.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\n뚜렷한 목자가 없는 상황에서 모든 왕좌는 각자의 주교를 만들어낸다. 의복은 신성하지만, 축성은 향냄새 대신 금화의 냄새를 풍긴다.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] 전역에 퍼진 제단과 왕좌 사이의 불화가 더 이상 소문이 아니게 되었다."
 pam_the_christian_church.0055.desc.unreformed_pagan: "[christianity.GetAdherentNamePlural]들이 주교를 임명하는 게 왕실인지, 성직자인지를 두고 다투는 동안 우리에게 관심을 두는 전도사들도 줄어들었다. 왕과 교황은 서로의 인가를 두고 열심히 다투라 하자. 저들이 분열할수록 우리의 숲도 더 조용해진다."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "로마는 서임권의 폭정을 부르짖지만, 손만 닿는다면 우리의 스승들에게 족쇄를 채웠을 것이다! 바리새인들아, 우리에게 설교하기 전에 본인의 목줄부터 끊고 오거라!"
 pam_the_christian_church.0055.desc.western: "주교의 지팡이를 왕홀을 향해 너무 많이 구부린다면, 두 개가 합쳐지고 말지도 모른다.\n\n"
 pam_the_christian_church.0055.desc.eastern: "서부의 왕들이 반지와 지팡이를 가지고 로마와 다툰다. 저들의 죄스러운 방식이 관습 전체를 더럽히고 있다.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] 전역에서 성묘의 해방을 바라는 신실한 외침이 들려온다. 행진에 쓸 십자가에 광을 내고, 유물을 저당 잡아 군자금을 마련하고 있다.\n\n열광이 열렬하게 불타고 있으나, 이 광증이 식는다면 열의는 장작더미에서 재가 휘날리듯 빠르게 의심으로 변할지도 모른다.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "이 전쟁 설교자들은 자신의 땅을 방치한 채 십자군을 부르짖고 있다. 로마인들이 머나먼 사구에서 지쳐 나가떨어지게 내버려두자."
 pam_the_christian_church.0056.desc.western: "강철이라면 설교가 닿지 못하는 곳까지 다다를지도 모른다.\n\n"
 pam_the_christian_church.0056.desc.eastern: "서부인들이 성지를 향해 행군한다.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ [christianity.GetReligiousHeadTitle.GetNamePossessive|U] 세심한 주시가 여기에 함께한다.\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$\n\n명실상부한 목자가 없음에도 신앙은 이성에 새롭게 묶이게 되었다.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "교회의 다툼이 중단되었다. [GetSituation('the_christian_church').GetTopSubRegion.GetName]에서 평화와 교감의 시대를 환영하게 되었다."
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "교파에서는 수많은 논쟁을 쏟아내고 있지만, 대부분의 영혼은 아직 사제의 설교를 통해 신을 마주한다.\n\n우리의 종교는 사람들을 위한 것임을 잊어서는 안 된다."
 pam_the_christian_church.0057.desc.eastern: "서구의 집무실 책상은 묵직한 조약에 짓눌려 신음하지만, 우리는 아직도 찬가를 통해 기도를 올린다. 조화는 환영이지만, 저들의 교파에서 벌이는 말다툼이 우리의 집무실로 넘어와서는 안 된다."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "공의회가 소집되다"
 pam_the_christian_church.0058.desc: "기나긴 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]의 세월이 드디어 절정에 이르렀다. 교회와 왕실 중 어느 쪽이 성직자를 임명할 것인지 완전히 매듭지을 공의회가 소집되었다."
 pam_the_christian_church.0058.a: "결정을 내리게 하자."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "공의회 회합"
 pam_the_christian_church.0059.desc.located: "소집이 시작되었으며, 교부들은 이제 [investiture_convene_location.GetName]에서 [investiture_convene_host.GetTitledFirstName](이)가 주최하는 서임권 공의회를 위해 모였다. 여기서 내리는 결정에 따라 기독교 세계에서 성직자를 임명하는 세력이 교회일지, 왕실일지가 정해진다."
 pam_the_christian_church.0059.desc: "소집이 시작되었으며, 교부들은 이제 서임권 공의회를 위해 모였다. 여기서 내리는 결정에 따라 기독교 세계에서 성직자를 임명하는 세력이 교회일지, 왕실일지가 정해진다."
 pam_the_christian_church.0059.a: "신중히 생각해 정하도록 하자."
 pam_the_christian_church_not_hof_trigger_tt: "당신이 교계 지도자가 아님"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "교회의 특수 공의회가 곧 소집되어 당신의 [faith|E]에서 다음 성직 임명 [doctrine|E]를 정하게 됨."
 pam_the_christian_church.0060.t: "너희 가운데 분쟁이 없이"
 pam_the_christian_church.0060.desc: "기독교 세계가 칼날 위에 선 듯이 위태롭다. [schism_mainline_rite.GetName](은)는 사도의 계승을 주장하는 한편, [schism_competitor_rite.GetName] 또한 주장을 굽히지 않는다.\n\n그리스도는 이렇게 경고했다. [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. 이번 위기에서 상처를 계속 곪도록 방치한다면, 교회는 두 번 다시 하나의 목소리를 내지 못할 것이다."
 pam_the_christian_church.0060.a: "나는 [schism_mainline_rite.GetNameNoTooltip](을)를 지지한다."
 pam_the_christian_church.0060.a.tt: "[GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decision|E] 방향으로 공헌"
 pam_the_christian_church.0060.b: "나는 [schism_competitor_rite.GetNameNoTooltip](을)를 지지한다."
 pam_the_christian_church.0060.b.tt: "[GetDecisionWithKey('pam_cause_great_schism_decision').GetName] [decision|E] 방향으로 공헌"
 pam_the_christian_church.0060.c: "몸에는 팔이 두 개 있어야 하는 법."
 pam_the_christian_church.0060.c.tt: "[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName] [decision|E] 방향으로 공헌"
 pam_the_christian_church.0061.t: "대분열"
 pam_the_christian_church.0061.desc: "[schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]의 사절단이 제단에서 선언했다.\n\n\"거짓된 [schism_eastern_faith.ReligiousHeadName](으)로 불리는 [schism_eastern_faith.GetReligiousHead.GetFirstName](와)과 그 추종자는 모두 파문당하리라. 모든 이단자에게 [Glossary( '마라나타', 'MARANATHA_GLOSS' )]! 회개하지 않으면 악마와 타락한 천사들과 함께할 것이다.\"\n\n\"이 불경한 문서는 파문당해야 마땅하며, 이 문서를 수정하거나 썼거나 어떤 쪽으로든 연관이 있는 자들도 마찬가지다.\" [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip](이)가 답했다.\n\n신자들은 [schism_western_faith.GetAdherentNamePlural](와)과 [schism_eastern_faith.GetAdherentNamePlural](으)로 나뉘었다. 이제 내 영혼은 [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]의 것이다."
 pam_the_christian_church.0061.desc.bystander: "[schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]에서 소식이 들려왔다. 특사가 제단에 파문 선고를 전했고, [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip](이)가 이에 응수했다.\n\n자신을 하나의 교회라 부르던 이들은 이제 [schism_western_faith.GetAdherentNamePlural](와)과 [schism_eastern_faith.GetAdherentNamePlural](으)로 갈라졌다. 저들의 다툼은 내 일도 아니었고, [ROOT.Char.GetFaith.GetName] 신앙도 이 사건으로 변할 일은 없지만, 그래도 보고 있자니 씁쓸한 기분이 들었다."
 pam_the_christian_church.0061.a: "좋다."
 pam_the_christian_church.0061.a.shame: "참으로 애석하군."
 pam_the_christian_church.0061.a.bystander: "형제끼리 싸우다니, 안타까운 일이다."
 MARANATHA_GLOSS: "#bold \"주님, 어서 오소서!\"#!라는 뜻의 아람어 외침입니다. 고린도전서 16장 22절에 등장하며 파문을 뜻하는 구절이 되었습니다. 저주받은 자들은 주가 다시 돌아올 때까지 추방당하게 됩니다."
 pam_the_christian_church.0062.t: "공동체 보존"
 pam_the_christian_church.0062.desc: "기독교 세계를 갈라놓으려 위협하던 상처가 다시 봉합되었다. 다투던 교구들은 [schism_peacemaker.GetTitledFirstName]의 노력 끝에 다시 한 자리에 모였다.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus... Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName](은)는 공동체로 남았다."
 pam_the_christian_church.0062.a: "주님께 축복이 있기를."
 pam_the_christian_church.0062.a.peacemaker: "단 하나의 교구가 나머지를 다스려서는 안 된다."
 pam_the_christian_church.0062.b: "[new_head_of_faith.GetTitledFirstNameNoTooltip](이)가 우리 모두의 목자가 되리라."
 pam_the_christian_church.0062.b.self: "그렇다면 모든 양 떼는 내 권위를 따라야 한다."
 pam_the_christian_church.0063.t: "남겨진 자"
 pam_the_christian_church.0063.desc: "나는 [ROOT.Char.GetRite.GetName](으)로 건너갔지만 [schism_dissenter.GetTitledFirstName](은)는 따라오지 않았다. [schism_dissenter.GetSheHe|U]는 내 영혼과 내 이전 공동체에 대한 염려를 멈추지 않았다.\n\n\"그대는 우릴 떠났습니다.\" [schism_dissenter.GetSheHe]가 조용히 말했다. \"교회가 양쪽으로 갈라진다면... 반드시 그리 되겠지만... 그때가 되면 우린 서로 상처의 반대편에 서 있게 될 겁니다.\""
 pam_the_christian_church.0063.a: "같은 신께서 우리 둘 모두에게 귀를 기울이신다."
 pam_the_christian_church.0063.b: "내가 왜 믿음을 바꾸었는지 직접 보여주지."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip](이)가 나와 함께 개종함"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip](이)가 넘어가지 않을 것임"
 pam_the_christian_church.0063.c: "두려움은 혼자만 간직하도록."
 pam_the_christian_church.0064.t: "상처가 벌어질 것"
 pam_the_christian_church.0064.desc.opening.self_mainline: "내 목소리가 [schism_competitor_head.GetTitledFirstName]에 맞서 울려 퍼졌다."
 pam_the_christian_church.0064.desc.opening.self_competitor: "내 목소리가 [schism_mainline_head.GetTitledFirstName]에 맞서 울려 퍼졌다."
 pam_the_christian_church.0064.desc.opening: "[schism_mainline_head.GetTitledFirstName](와)과 [schism_competitor_head.GetTitledFirstName]의 목소리가 서로에 맞서 울려 퍼졌다. "
 pam_the_christian_church.0064.desc: "[schism_mainline_rite.GetName](와)과 [schism_competitor_rite.GetName] 사이에는 화합으로 돌아갈 길이 보이지 않는다.\n\n성서의 경고는 그 자체로 선고가 되었다. [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. [christianity.GetName]의 친교는 아직 무너지지 않았으나, 상처가 벌어질 것이다. 그때가 오는 것은 피할 수 없다."
 pam_the_christian_church.0064.a: "신이여, 우리를 버리지 마소서."
 pam_the_christian_church.0064.a.tt: "대분열 진행도가 기준치에 도달함"
