l_korean:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "미론 성유병"
 pam_holy_myron_artifact_desc_common: "마개로 봉한 용기에는 축성된 성유가 담겨 있습니다. 이 성유는 순수한 올리브유에 [Glossary('유대 발삼','pam_myron_gloss_balsam')]을 담가 향과 성분을 우려냈으며, 이전에 축성한 성유 한 방울을 새 성유에 섞어 축복의 맥이 사도들로부터 끊이지 않고 이어져 내려오게 했습니다."
 pam_holy_myron_artifact_desc_masterwork: "마개로 봉한 용기에는 축성된 성유가 담겨 있습니다. 이 성유는 순수한 올리브유에 [Glossary('유대 발삼','pam_myron_gloss_balsam')], [Glossary('유향','pam_myron_gloss_frankincense')], [Glossary('몰약','pam_myron_gloss_myrrh')]을 담가 향과 성분을 우려냈으며, 이전에 축성한 성유 한 방울을 새 성유에 섞어 축복의 맥이 사도들로부터 끊이지 않고 이어져 내려오게 했습니다."
 pam_holy_myron_artifact_desc_famed: "마개로 봉한 용기에는 축성된 성유가 담겨 있습니다. 이 성유는 순수한 올리브유에 [Glossary('유대 발삼','pam_myron_gloss_balsam')], [Glossary('유향','pam_myron_gloss_frankincense')], [Glossary('몰약','pam_myron_gloss_myrrh')], [Glossary('나드','pam_myron_gloss_spikenard')], [Glossary('육계','pam_myron_gloss_cinnamon')]를 담가 향과 성분을 우려냈으며, 이전에 축성한 성유 한 방울을 새 성유에 섞어 축복의 맥이 사도들로부터 끊이지 않고 이어져 내려오게 했습니다."
 pam_holy_myron_artifact_desc_illustrious: "마개로 봉한 용기에는 가장 오래된 전승의 제조법을 따르고 지극한 믿음으로 배합해 축성한 성유가 담겨 있습니다. 이 성유는 순수한 올리브유에 [Glossary('유대 발삼','pam_myron_gloss_balsam')], [Glossary('유향','pam_myron_gloss_frankincense')], [Glossary('몰약','pam_myron_gloss_myrrh')], [Glossary('나드','pam_myron_gloss_spikenard')], [Glossary('육계','pam_myron_gloss_cinnamon')], [Glossary('창포','pam_myron_gloss_calamus')], [Glossary('계피','pam_myron_gloss_cassia')]를 담가 향과 성분을 우려냈으며, 이전에 축성한 성유 한 방울을 새 성유에 섞어 축복의 맥이 사도들로부터 끊이지 않고 이어져 내려오게 했습니다."
 pam_holy_myron_charges_line: "남은 도유 횟수: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "이름 높은 유대산 발삼. 사해 인근의 예리코와 엔게디에서 재배되는 키 작은 관목에서 배어나오는 향기로운 수지로, 한 방울 한 방울이 고대 세계에서 가장 비싼 향료였습니다. 이 발삼은 성유의 핵심 재료이며, 엄중히 지켜 온 그 재배지는 다른 어디에서도 찾아볼 수 없습니다."
 pam_myron_gloss_frankincense: "남부 아라비아의 옹이진 나무에서 채취하는 황금빛 수지. 세상 다른 곳에서는 좀처럼 찾아볼 수 없습니다. 아주 먼 옛날부터 제단 앞에서 태워 온 향료로, 그 연기가 기도를 하늘로 실어 올리듯 성유에 향기를 더합니다."
 pam_myron_gloss_myrrh: "남부 아라비아와 아프리카의 뿔 지역에 자라는 가시나무에서 배어나오는, 쓴맛이 나고 피처럼 짙은 빛깔의 수지. 출애굽기에서 거룩한 관유의 재료 가운데 하나로 언급되며, 동방 박사들이 아기 그리스도 앞에 예물로 바쳤고 신자들은 그분의 무덤에도 이를 가져왔습니다."
 pam_myron_gloss_spikenard: "농후하고 달콤한 향의 기름. 동쪽의 높은 산악 지대에서만 자라는 식물의 뿌리를 짜서 얻으며 인도의 항구까지 운반됩니다. 그토록 값비싼 나드로 주께서 베다니에서 기름 부음을 받으시자, 제자들은 그 값어치 때문에 이를 낭비라 여기며 분개했습니다."
 pam_myron_gloss_cinnamon: "인도와 그 너머 섬들에서 자라는 나무의 향긋한 속껍질. 출애굽기에서 거룩한 관유의 재료 가운데 하나로 언급됩니다. 기독교의 제단에 오르기까지 세상의 절반을 가로질러 옵니다."
 pam_myron_gloss_calamus: "성서에 등장하는 향기로운 창포. 먼 동쪽의 습지에서 채취합니다. 출애굽기에서 거룩한 관유의 재료 가운데 하나로 언급됩니다."
 pam_myron_gloss_cassia: "육계와 가까운 친척 격이지만 더 거친 향료. 먼 동방의 나무에서 껍질을 벗겨 얻습니다. 출애굽기에서 거룩한 관유의 재료 가운데 하나로 언급됩니다."
 ### Modifiers
 pam_holy_myron_vessel_modifier: "미론 성유병"
 pam_holy_myron_vessel_modifier_desc: "이 용기에는 축성된 성유가 담겨 있으며, [Glossary('유대 발삼','pam_myron_gloss_balsam')]의 향기가 소지자에게 성스러움을 더합니다."
 pam_holy_myron_vessel_potent_modifier: "강력한 미론 성유병"
 pam_holy_myron_vessel_potent_modifier_desc: "이 용기에는 보기 드물 만큼 강한 효력을 지닌 성유가 담겨 있으며, [Glossary('유향','pam_myron_gloss_frankincense')]과 [Glossary('나드','pam_myron_gloss_spikenard')]의 짙은 향이 배어 있습니다. 그 향기만으로도 성스러움이 느껴집니다."
 pam_chrismated_artifact_modifier: "견진받음"
 pam_chrismated_artifact_modifier_desc: "해당 유물에는 미론 성유가 발라져 있으며, [Glossary('몰약','pam_myron_gloss_myrrh')]의 향이 아직도 남아 있습니다."
 pam_chrismated_regalia_modifier: "견진받은 표장"
 pam_chrismated_regalia_modifier_desc: "해당 유물은 대관식에서 미론 성유로 축복받았으며, 그 축복은 아직 바래지 않았습니다."
 pam_holy_myron_pilgrim_modifier: "발삼 수탐자"
 pam_holy_myron_pilgrim_modifier_desc: "해당 인물은 미론 성유를 만드는 데 필요한 [Glossary('발삼','pam_myron_gloss_balsam')], [Glossary('유향','pam_myron_gloss_frankincense')]과 그보다 더 희귀한 재료들을 찾아 여행하며, 한 치의 방심도 하지 않습니다."
 pam_chrismated_child_modifier: "견진받음"
 pam_chrismated_child_modifier_desc: "해당 인물은 태어난 지 얼마 되지 않아 견진성사를 받아, 축복받은 성유를 바름으로써 성령의 은사를 받았다는 날인이 새겨졌습니다."
 pam_myron_chrismated_child_modifier: "미론 성유로 견진받음"
 pam_myron_chrismated_child_modifier_desc: "해당 인물은 태어난 지 얼마 되지 않아 미론 성유로 직접 견진성사를 받았습니다. [Glossary('유대 발삼','pam_myron_gloss_balsam')] 향이 밴 미론이 갓난아이의 이마에 발라졌으며, 그때 받은 날인은 영원히 사라지지 않습니다."
 pam_anointed_with_holy_oil_modifier: "성유로 도유받음"
 pam_anointed_with_holy_oil_modifier_desc: "해당 인물은 성유성사를 받아, [Glossary('발삼','pam_myron_gloss_balsam')]의 향이 밴 성유를 이마와 두 손에 발랐습니다. 그 성유는 시련을 견딜 수 있도록 몸과 영혼에 힘을 북돋아 줍니다."
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "미론 성유 준비하기"
 pam_prepare_holy_myron_decision_tooltip: "[court_chaplain|E]를 보내 희귀한 발삼을 모아 #V 미론 성유병#!을 축성합니다. 이 [artifact|E]은 성유 도유에 사용할 때마다 사용 횟수가 줄어듭니다."
 pam_prepare_holy_myron_decision_desc: "거룩한 성유는 주방에서 남아도는 재료를 아무렇게나 섞어 만드는 것이 아니다. 성서가 그 재료를 명시하고 있으니, 순수한 올리브유에 [Glossary('몰약','pam_myron_gloss_myrrh')], 향기로운 [Glossary('육계','pam_myron_gloss_cinnamon')], [Glossary('창포','pam_myron_gloss_calamus')], [Glossary('계피','pam_myron_gloss_cassia')]를 섞으며, 각 재료는 저마다 자라는 땅에서 직접 구해 와야 한다.\n\n원정대가 더 멀리 나아갈수록 가지고 돌아와 축성할 성유도 더욱 풍성해진다. 하지만 머나먼 여정은 결코 순탄치 않다. 도적과 열병으로 성유의 양이 줄어들거나, 이를 운반하는 이가 목숨을 잃을 수도 있다."
 pam_prepare_holy_myron_decision_confirm: "원정대를 보낸다"
 pam_prepare_holy_myron_decision_needs_chaplain: "당신의 [court_chaplain|E]는 성인이어야 하며, 현재 여행 중이 아니어야 함"
 pam_prepare_holy_myron_decision_already_owned: "당신이 미론 성유병을 보유하고 있지 않아야 함"
 pam_prepare_holy_myron_decision_journey_underway: "당신의 [court_chaplain|E]는 이미 발삼을 구하고 있음"
 pam_prepare_holy_myron_decision_levant_name: "유대 발삼"
 pam_prepare_holy_myron_decision_levant_desc: "당신의 [court_chaplain|E]는 #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!에서 [Glossary('유대 발삼','pam_myron_gloss_balsam')]을 구합니다. 한 곳만 방문하므로 배합도 가장 단순합니다.\n\n[common|E] 미론 성유병을 획득합니다."
 pam_prepare_holy_myron_decision_arabia_name: "발삼과 유향"
 pam_prepare_holy_myron_decision_arabia_desc: "당신의 [court_chaplain|E]는 #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!에서 [Glossary('발삼','pam_myron_gloss_balsam')]을 구한 뒤, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!에서 [Glossary('유향','pam_myron_gloss_frankincense')]과 [Glossary('몰약','pam_myron_gloss_myrrh')]을 구합니다. 향료길을 따라 두 곳을 방문합니다.\n\n[masterwork|E] 미론 성유병을 획득합니다."
 pam_prepare_holy_myron_decision_india_name: "모든 성스러운 재료"
 pam_prepare_holy_myron_decision_india_desc: "당신의 [court_chaplain|E]는 #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!에서 [Glossary('발삼','pam_myron_gloss_balsam')]을, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!에서 [Glossary('유향','pam_myron_gloss_frankincense')]과 [Glossary('몰약','pam_myron_gloss_myrrh')]을, #V [GetTitleByKey('c_kerala').GetNameNoTier]#!에서 [Glossary('나드','pam_myron_gloss_spikenard')]와 [Glossary('육계','pam_myron_gloss_cinnamon')]를 구합니다. 그만큼 머나먼 여정입니다.\n\n[famed|E] 미론 성유병을 획득합니다. 당신의 [court_chaplain|E]가 옛 제조법을 충실히 따를 경우 #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! 확률로 [illustrious|E] 미론 성유병을 획득하며, 이 확률은 [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis] [learning|E]에 따라 증가합니다."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "[gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] [gold|E]를 감당할 여력이 있어야 함"
 pam_prepare_holy_myron_decision_afford_india_tt: "[gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] [gold|E]를 감당할 여력이 있어야 함"
 pam_prepare_holy_myron_journey_toast: "미론 성유 원정대 출발"
 pam_prepare_holy_myron_journey_toast_tt: "당신의 [court_chaplain|E]가 미론 성유의 재료를 구하러 떠남"
 pam_prepare_holy_myron_decision_levant_effect_tt: "당신의 [court_chaplain|E]가 #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!(으)로 떠납니다. 여정이 순탄하다면 돌아온 뒤 [common|E] 미론 성유병이 축성됩니다"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "당신의 [court_chaplain|E]가 #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! 및 #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!(으)로 떠납니다. 돌아오면 [masterwork|E] 미론 성유병이 축성되지만 여정 중 도적을 만나거나 불운을 겪으면 성유의 양이 줄어들 수 있습니다"
 pam_prepare_holy_myron_decision_india_effect_tt: "당신의 [court_chaplain|E]가 #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, #V [GetTitleByKey('c_kerala').GetNameNoTier]#!(으)로 떠납니다. 돌아오면 [famed|E] 미론 성유병이 축성되며, #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! 확률로 [illustrious|E] 미론 성유병이 축성됩니다. 여정 중 도적을 만나거나 불운을 겪으면 성유의 양이 줄어들 수 있습니다"
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0011.desc_levant: "사해 기슭에서 이 글을 씁니다. 이곳에서는 칼집을 낸 나무껍질에서 [Glossary('유대 발삼','pam_myron_gloss_balsam')]이 황금빛 눈물처럼 흘러나옵니다. 재배자들과의 흥정은 쉽지 않았지만, 수지의 품질은 틀림없습니다. 손목에 한 방울만 떨어뜨려도 온 방에 향이 퍼집니다. 첫 재료를 확보했습니다."
 pam_holy_myron.0011.desc_arabia: "향료길은 멀고 우물 사이의 거리도 아득했지만, 도파르에서 우리가 찾아온 재료를 손에 넣었습니다. 새벽녘 얼음처럼 창백한 [Glossary('유향','pam_myron_gloss_frankincense')]과 오래된 피처럼 짙은 [Glossary('몰약','pam_myron_gloss_myrrh')]입니다. 이곳의 대상단 우두머리들은 세상 어느 항구에도 이보다 좋은 수지가 드나들지 않는다고 말합니다. 저도 그 말을 믿고 그만한 값을 치렀습니다."
 pam_holy_myron.0011.desc_india: "바다를 건너는 동안 배에 탄 모두가 혹독한 시련을 겪었지만, 말라바르 해안의 시장에는 진귀한 물건이 가득합니다. 높은 산에서 온 [Glossary('나드','pam_myron_gloss_spikenard')]와 제가 지금껏 맡아 본 어떤 것보다 달콤한 향의 [Glossary('육계','pam_myron_gloss_cinnamon')]입니다. 마지막 재료도 손에 넣었습니다. 이제 귀로에 오릅니다."
 pam_holy_myron.0011.a: "남은 여정도 빠르게 지나가기를."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], 불운이 닥쳤습니다."
 pam_holy_myron.0012.desc: "무장한 자들이 앞길의 고개를 막고 있습니다. 자신들을 통행세 징수인이라 부르지만, 어느 군주도 그들에게 그런 권한을 준 적이 없습니다. 저들은 우리 궤짝을 세어 값어치를 알아챘고, 돈을 내면 약탈하지 않고 통과시켜 주겠다고 합니다.\n\n말씀을 기다리겠습니다. 발삼은 곁에 단단히 지키고 있습니다."
 pam_holy_myron.0012.a: "돈을 줘라. 성유는 돈보다 귀하다."
 pam_holy_myron.0012.b: "교회의 돈을 도적 떼에게 줄 수는 없다."
 pam_holy_myron.0012.b.tt: "모은 발삼을 약탈당하고, 완성되는 미론 성유의 품질이 #N 낮아짐#!"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0013.desc: "여정 중 열병에 걸렸습니다. 이 글을 쓰는 손이 떨리고, 여관 주인의 아내는 효험이 있다며 세 가지 치료법을 권하는데 뒤로 갈수록 더 고약합니다. 발삼은 걱정하지 마십시오. 건조한 상태로 밀봉해 두었고, 저보다도 더 철저히 지키고 있습니다. 몸을 일으킬 수 있게 되는 즉시 다시 길을 나서겠습니다."
 pam_holy_myron.0013.a: "[myron_chaplain.GetHerHim]를 위해 기도하겠다."
 pam_holy_myron_journey_abandoned_toast: "미론 성유 원정 중단"
 pam_holy_myron.0020.t: "여정의 끝"
 pam_holy_myron.0020.desc: "상인이 보내온 편지에 비보가 담겨 있었다. 미론 성유의 재료를 구하러 보낸 [myron_chaplain.GetTitledFirstName](이)가 머나먼 타지에서 세상을 떠났다. 발삼은 낯선 이들의 손에 흩어졌고, 내가 들인 돈과 [myron_chaplain.GetHerHis] 노력도 모두 허사가 되어 성유를 만들 수 없게 되었다."
 pam_holy_myron.0020.a: "[ROOT.Char.GetFaith.HighGodName]께서 [myron_chaplain.GetHerHim]에게 안식을 주시길."
 pam_holy_myron.0100.t: "미론 성유의 축성"
 pam_holy_myron.0100.desc.intro: "여독에 지친 [myron_chaplain.GetTitledFirstName](이)가 마침내 돌아온다. 그 모습이 보이기도 전에 궁정에는 향부터 퍼진다. 문을 걸어 잠그고 기름을 배합한 뒤, 사도 시대부터 이어진 전통에 따라 옛 미론 성유 한 방울을 새 성유에 더한다.\n\n"
 pam_holy_myron.0100.desc_full: "모든 재료가 여정을 무사히 견뎌 냈다. 황금빛을 띠고 향긋한 완성된 성유를 성유병에 붓고 내 제단 앞에 둔다."
 pam_holy_myron.0100.desc_robbed: "여정 중 많은 재료를 잃어 생각했던 것보다 배합이 빈약하다. 다만 여정이 앗아 간 부족함도 축성을 거치면 온전해지고, 성유병은 여느 때와 마찬가지로 내 제단 앞에 놓인다."
 pam_holy_myron.0100.a: "축복의 계승은 끊어지지 않았다."
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "마지막 도유"
 pam_holy_myron.0200.desc: "운구대에 다가가자 애도객들이 길을 비킨다. [pam_holy_myron_artifact.GetName](을)를 앞세운 채 다가서는 나를 온 궁정이 지켜보고 있다. [deceased.GetTitledFirstName]의 이마에 거룩한 성유로 십자가를 그으면, 기름 부음을 받은 자라는 표식을 지닌 채 [ROOT.Char.GetFaith.HighGodName]의 옥좌 앞에 서게 될 것이다. 여기 있는 모든 이가 목격하고 두고두고 전할 영예다. 하지만 죽은 이에게 성유를 한 방울 쓸 때마다, 산 이들에게 쓸 몫이 그만큼 줄어든다."
 pam_holy_myron.0200.a: "[deceased.GetFirstNameNoTooltip](을)를 도유하여 보내주자."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#!(이)가 시성 여부를 검토할 때 더 긍정적으로 평가받게 됨"
 pam_holy_myron.0200.b: "성유는 산 자들을 위한 것이다."
 pam_holy_myron.0200.b.tt: "당신은 앞으로 그 축복을 받을 이들을 위해 거룩한 성유를 아껴 보존함"
 ### Spending the oil
 pam_holy_myron_spend_tt: "미론 성유병의 사용 횟수가 1회 소모됨"
 pam_holy_myron_spend_last_tt: "미론 성유병의 #N 마지막#! 사용 횟수가 소모되며, 빈 성유병은 #N 소실됨#!"
 pam_holy_myron_vessel_spent_toast: "말라버린 성유병"
 pam_holy_myron_vessel_spent_tt: "마지막 남은 성유까지 따라내어, 성유병은 그 쓸모를 다함"
 ### Coronation
 pam_holy_myron_coronation_option: "이 왕관에 미론 성유의 축복을 새기자."
 pam_holy_myron_coronation_option.flavor: "거룩한 성유의 사용 횟수 1회를 당신의 도유에 소모합니다."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\n대관식에서 미론 성유를 발랐으며, 그 축복은 지금도 남아 있습니다."
 pam_holy_myron_coronation_memory: "미론 성유로 도유받았음"
 pam_holy_myron_coronation_memory_desc: "나의 대관식에서 [anointer.GetTitledFirstName](은)는 바로 그 거룩한 성유로 내게 도유를 거행했음."
 pam_holy_myron_coronation_memory_desc_second_perspective: "당신의 대관식에서 [anointer.GetTitledFirstName](은)는 바로 그 거룩한 성유로 당신에게 도유를 거행했음."
 pam_holy_myron_coronation_memory_desc_third_perspective: "[owner.GetTitledFirstName](은)는 [owner.GetHerHis] 대관식에서 바로 그 거룩한 성유로 도유를 받았음"
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "미론 성유로 유물에 기름 부음하기"
 pam_anoint_artifact_decision_tooltip: "미론 성유의 사용 횟수 1회를 소모해, 원리상 원래 허용되지 않더라도 보유한 [artifacts|E] 하나를 [sanctified|E]함"
 pam_anoint_artifact_decision_desc: "성유는 성직자의 허락을 구하지 않는다. 칼이든 책이든 장신구든, 무엇이든 성유가 닿으면 성유 자체의 힘으로 [ROOT.Char.GetFaith.GetName]에 대해 [sanctified|E]되며, 어떤 원리나 주교도 이를 막을 수 없다."
 pam_anoint_artifact_decision_confirm: "기름 부음하기"
 pam_anoint_artifact_decision_no_item_selected: "선택한 [artifact|E] 없음"
 pam_anoint_artifact_needs_myron_tt: "성유가 남아 있는 #V 미론 성유병#!을 보유해야 함"
 pam_anoint_artifact_has_eligible_artifact_tt: "아직 [sanctified|E]되지 않은 [artifact|E]을 보유해야 함"
 pam_anoint_artifact_not_myron_tt: "미론 성유 자체에 기름 부음할 수 없음"
 pam_anoint_artifact_not_already_chrismated_tt: "견진받지 않았어야 함"
 pam_anoint_artifact_toast: "유물 견진"
 pam_chrismated_artifact_name: "[pam_anointed_artifact.GetNameNoTooltip] 견진"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\n미론 성유로 기름 부음을 받았으며, 표면에 성유가 묻어 은은한 윤이 납니다."
 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "미론 성유 선물하기"
 pam_give_holy_myron_interaction_desc: "자신의 미론 성유로 새 성유병을 채워 [recipient.GetShortUIName]에게 선물합니다. 기존 성유병의 사용 횟수가 1회 소모되며, [piety|E]를 획득하고 [recipient.GetShortUINamePossessive] 감사를 받습니다."
 pam_give_holy_myron_recipient_toast: "미론 성유 선물"
 pam_give_holy_myron_recipient_tt: "사용 횟수가 1회인 [common|E] 미론 성유병 [artifact|E]을 받음"
 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "신생아 견진성사"
 pam_holy_myron_unction_toast: "성유성사"
 pam_holy_myron.0300.t: "성령의 날인"
 pam_holy_myron.0300.desc: "성유를 가져오는 동안, 내 [child.Custom('GetDaughterSon')] [child.GetFirstName](은)는 [myron_officiant.GetFaith.PriestNeuter]의 품에서 울음을 터뜨린다.\n\n교회에는 모든 신생아에게 쓸 만큼 축복받은 성유가 충분히 있다. 하지만 내 미론 성유병도 손만 뻗으면 닿는 곳에 있고, 반짝이는 미론 성유 한 방울이면 이 아이에게 평생토록 성령의 날인을 새길 수 있다."
 pam_holy_myron.0300.desc_twin: "\n\n게다가 기다리는 이마는 하나가 아니라 둘이다. [pam_myron_twin.GetFirstName](은)는 쌍둥이 곁에 포대기에 싸여 누운 채 같은 날인을 기다리고 있다."
 pam_holy_myron.0300.a: "교회의 축복받은 성유면 충분하다."
 pam_holy_myron.0300.b: "미론 성유가 아니면 안 된다."
