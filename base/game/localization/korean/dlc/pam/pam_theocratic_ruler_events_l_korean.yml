l_korean:
 pam_theocratic_ruler_events.0001.t: "교회를 위한 유산"
 pam_theocratic_ruler_events.0001.desc: "부유한 상인이 교회를 위해 유산을 기증했는데, 그 양이 꽤 되었다.\n\n내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName](이)가 기록과 의향서를 가지고 왔다. [subordinate_priest.GetSheHe|U]는 판단을 기다리듯 나를 바라보았다. \n\n\"유언장에 따르면 기금을 [ROOT.Char.GetFaith.HighGodName](을)를 향한 믿음을 강화하는 데 써 달라고 합니다.\""
 pam_theocratic_ruler_events.0001.a: "[subordinate_priest.GetSheHe]가 신성한 자금을 잘못 처리했다는 증거를 찾았다..."
 pam_theocratic_ruler_events.0001.b: "\"성직자로서 함께 상의해 보세.\""
 pam_theocratic_ruler_events.0001.c: "감사하는 마음으로 자금을 경건하게 금고에 넣는다."
 pam_theocratic_ruler_events.0001.b.success: "신의 방식은 참으로 신비로운 법"
 pam_theocratic_ruler_events.0001.b.failure: "사제가 합리적으로 이해하지 못함"
 pam_theocratic_ruler_events.0001.b.toast.success: "당신이 [subordinate_priest.GetHerHim]를 설득해 유산을 획득함."
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.GetSheHe|U]가 [ROOT.Char.GetFaith.HighGodName](을)를 위해 기부금을 간직함."
 pam_theocratic_ruler_events.0002.t: "경계 너머에서 온 여행자"
 pam_theocratic_ruler_events.0002.desc: "이웃이자 옛 [foreign_ruler.GetFaith.GetName]의 방식을 따르는 [foreign_ruler.GetTitledFirstName](이)가 내 땅으로 들어왔다는 소문이 들려왔다.\n\n이 소규모 수행단의 목적지는 다른 곳이지만, 저들의 경로가 이곳과 꽤 많이 가까워진 덕분에 이들을 내 궁정에서 정중하게 환대해야 할 것 같다. \n\n저들을 어떻게 맞이할까?"
 pam_theocratic_ruler_events.0002.a: "적당한 선물과 평화 제안을 한다."
 pam_theocratic_ruler_events.0002.b: "\"양측의 백성 사이에 진실한 이해가 있기를 바라오.\""
 pam_theocratic_ruler_events.0002.b.success: "공손한 태도로 마음을 얻음"
 pam_theocratic_ruler_events.0002.b.failure: "내 말이 빈말로 들림"
 pam_theocratic_ruler_events.0002.b.toast.success: "당신의 공손한 태도 덕분에 양측 사람들의 관용이 증가함"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.GetSheHe|U]가 감동하지 않았으며 당신의 말이 빈말로 들림"
 pam_theocratic_ruler_events.0002.b.acceptance: "궁정 대사관"
 pam_theocratic_ruler_events.0002.c: "이교도는 우리 땅에 발붙일 수 없다."
 TRUCE_PAM_NEIGHBOR_GIFT: "\n선물과 이웃 간 상호 존중에 기반한 휴전"
 pam_theocratic_ruler_events.0003.t: "강화된 국경을 위한 조언"
 pam_theocratic_ruler_events.0003.desc: "내 땅이 전쟁과 약탈자에게 시달리는 모습을 더는 두고 볼 수 없다. 나는 믿음직한 [advisor.GetCouncilTitle]인 [advisor.GetTitledFirstName](을)를 불렀고, 우리는 함께 필요한 조치에 대해 고민했다. \n\n\"[alliance_target.GetTitledFirstName]에게 도움을 요청할 수도 있습니다. 같은 신앙을 가진 동료 신정제 영주로서, 우릴 도와주러 올 겁니다.\"\n\n아니면 이 짐은 내가 해결해야만 하는 것일까?"
 pam_theocratic_ruler_events.0003.a: "사절을 보내라. 우리가 함께 맞서야 한다."
 pam_theocratic_ruler_events.0003.a.tt: "[alliance_target.GetShortUINameNoTooltip](와)과 [alliance|E]을 체결함"
 pam_theocratic_ruler_events.0003.b: "신실한 농노들을 양성해 국경의 방비를 맡긴다."
 pam_theocratic_ruler_events.0003.b.army: "신실한 농노"
 pam_theocratic_ruler_events.0003.c: "지원군을 보내 최근에 약탈당한 영지를 복구한다."
 pam_theocratic_ruler_events.0003.d: "이 일은 [ROOT.Char.GetFaith.HighGodNamePossessive] 손에 맡기리라."
 pam_theocratic_ruler_events.0004.t: "형제이자 이웃"
 pam_theocratic_ruler_events.0004.desc: "[monastic_order_head.GetPrimaryTitle.GetName](이)가 몹시 가까워졌으니, 나는 [monastic_order_head.GetTitledFirstName](을)를 초청해 우리의 협력을 더 굳건히 할 방안을 논의했다.\n\n\"[monastic_order_head.GetFaith.HighGodName]께서는 우리의 교만이 아니라 섬기고자 하는 의지를 보시고 우리를 평가해 주소서.\" [monastic_order_head.GetTitledFirstNameNoTooltip](이)가 작게 말했다."
 pam_theocratic_ruler_events.0004.a: "그대의 형제들이 내 땅을 축복하기를."
 pam_theocratic_ruler_events.0004.b: "당신의 제자 [monastic_monk.GetTitledFirstNameNoTooltip](이)라면 내 궁정을 강화해 줄 것이오."
 pam_theocratic_ruler_events.0004.c: "함께 기도합시다."
 pam_theocratic_ruler_events.0005.t: "믿음을 위한 검"
 pam_theocratic_ruler_events.0005.desc: "[military_order_head.GetPrimaryTitle.GetName](이)가 내 봉역에 안착했으니, 나는 [military_order_head.GetTitledFirstName](을)를 초청해 어떻게 하면 신실한 자의 검이 서로에게 도움이 될 수 있을지를 논의했다.\n\n\"[military_order_head.GetFaith.HighGodName]께서는 나태한 검이 아니라 신자들을 지키기 위해 쳐든 검을 축복하십니다.\" [military_order_head.GetTitledFirstNameNoTooltip](이)가 말했고, [military_order_head.GetHerHis] 추종자인 [order_knight.GetTitledFirstName](이)가 옆에서 조용히 고개를 숙였다."
 pam_theocratic_ruler_events.0005.a: "내 [ROOT.Char.Custom('GetFighterTermPlural')]들의 훈련을 그대의 기사수도회에서 맡아주시오."
 pam_theocratic_ruler_events.0005.b: "[order_knight.GetTitledFirstNameNoTooltip](을)를 내 경호원으로 삼겠소."
 pam_theocratic_ruler_events.0005.c: "정의로운 전쟁에 관한 얘기를 합시다."
 pam_theocratic_ruler_events.0006.t: "십일조냐 자비냐"
 pam_theocratic_ruler_events.0006.desc: "마을 지도자인 [local_peasant_leader.GetTitledFirstName](이)가 내 앞으로 불려 왔다. [local_peasant_leader.GetHerHis|U] 주민들은 교회에 돈을 내지 못했으며, 이제는 곤란한 처지를 호소하고 있었다.\n\n\"혹독한 겨울이었습니다. 저희 곡창은 거의 비어 있는 것이나 마찬가지고요.\" [local_peasant_leader.GetSheHe]가 떨리는 목소리로 말했다.\n\n문제는 단순했다. 공포로 영지를 다스리거나, 자비를 보여주며 평화를 유지해야 한다."
 pam_theocratic_ruler_events.0006.a: "예외는 없다. 지도자를 붙잡아라."
 pam_theocratic_ruler_events.0006.a.tt: "당신이 [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0]의 금화를 획득하며 [local_peasant_leader.GetShortUINameNoTooltip](을)를 투옥하고, [troubled_county.GetName](이)가 5년 동안 #N 강제 십일조#!를 획득함(#N -20#! [county_opinion|E])."
 pam_theocratic_ruler_events.0006.b: "그냥 넘어가자. 자비로도 신을 섬길 수 있으니."
 pam_theocratic_ruler_events.0006.b.tt: "당신이 [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0]의 신앙도를 획득하며 [troubled_county.GetName](이)가 5년 동안 #P 자비로운 십일조#!를 획득함(#P +20#! [county_opinion|E])."
 pam_theocratic_ruler_events.0006.c: "내 집사장이 실망을 안겨 주었군. 집사장의 탓이다."
 pam_theocratic_ruler_events.0006.c.tt: "가능한 경우 당신이 [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip]에 대한 [hook|E] 획득(가능한 경우 더 강력한 책무 구실이 사용됨). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip](이)가 당신을 향한 [opinion|E]을 상실함(#N -20#!, 5년에 걸쳐 감소)."
 pam_theocratic_ruler_events.0007.t: "행복한 조화"
 pam_theocratic_ruler_events.0007.desc: "부드러운 햇살에 아침 이슬이 반짝이고, 교회 뜰의 비석이 온기를 품는 동안 나는 깨달았다. 책무가 나를 재촉하고 있지 않았다. 부지런한 꿀벌조차 등에 새벽의 햇살을 받으며 잠시 쉬는 듯했다.\n\n내 땅에는 고요한 질서가 자리 잡았다. 금고에는 금화가 가득하고, 나를 따르는 무리는 만족하며 존경심을 품고 있다. 내 주군인 [ROOT.Char.GetLiege.GetTitledFirstName]마저 내가 [ROOT.Char.GetLiege.GetHerHis] 신하들을 그리스도의 품으로 이끄는 방식을 마음에 들어 하고 있다."
 pam_theocratic_ruler_events.0007.a: "평화는 달콤하지만, [ROOT.Char.GetFaith.HighGodName]께서는 아직 나를 위해 더 위대한 일을 준비해 두셨다."
 pam_theocratic_ruler_events.0007.b: "신의 뜻에 따라 질서 잡힌 삶의 복음을 퍼뜨린다."
 pam_theocratic_ruler_events.0007.c: "그냥 귀를 기울이며 가만히 있겠다."
 pam_theocratic_ruler_events.0008.t: "돌 위에 돌"
 pam_theocratic_ruler_events.0008.desc: "내가 [stone_province.GetName](을)를 상속받은 이후로 [GetBuilding('curtain_walls_01').GetName]을 갖춘 성채가 있었다. 나는 더 세속적인 통치를 위해 건설되었을 이 웅장한 석조 건축물을 눈여겨보고 있었다. 그러나 독신자에게 이런 방비가 꼭 필요할까?\n\n내 장원에는 내 이름에 걸맞은 [GetDomicileBuilding('episcopal_palace_01').GetName]가 없다. 하지만 여기에는 이미 세속의 손길을 통해 세워진 석재 건물이 있다."
 pam_theocratic_ruler_events.0008.a: "이 원시적인 벽에서 남는 석재를 가져다 써도 되겠군."
 pam_theocratic_ruler_events.0008.b: "성벽을 무너뜨리고 내 [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]를 세운다."
 pam_theocratic_ruler_events.0008.c: "인간의 손으로 만든 모든 작품은 기도를 형상화한 것이나 마찬가지다."
 pam_theocratic_ruler_events.0008.c.flavor: "당신이 [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )] 원리를 보유함"
 pam_theocratic_ruler_events.0008.d: "성벽이 필요할지도 모르겠군."
 pam_theocratic_ruler_events.0009.t: "목자 되기"
 pam_theocratic_ruler_events.0009.desc: "신자들에게서 눈물로 얼룩진 보고를 받았다. [heir.GetTitledFirstName](이)가 지난번 설교에서 화를 터뜨렸으며, 더는 [heir.GetSheHe]가 요구하는 엄격한 제약을 따를 수 없다는 내용이었다.\n\n이 일에 대해 질문하니 [heir.GetSheHe]가 곧장 발끈했다.\n\n\"사악한 죄인들 같으니! 구원받겠다면서 한심한 시도나 해 대는 꼴을 도저히 봐줄 수가 없습니다.\""
 pam_theocratic_ruler_events.0009.a: "\"목자는 평온한 법. 그대의 성미를 잘 다스리게.\""
 pam_theocratic_ruler_events.0009.a.success: "당신의 조언이 [heir.GetHerHim]에게 와닿음"
 pam_theocratic_ruler_events.0009.a.failure: "당신의 말이 [heir.GetHerHim]를 진정시키지 못함"
 pam_theocratic_ruler_events.0009.a.toast.success: "성공적인 조언"
 pam_theocratic_ruler_events.0009.a.toast.failure: "실패한 조언"
 pam_theocratic_ruler_events.0009.b: "나는 실망하며 고개를 작게 저었다."
 pam_theocratic_ruler_events.0009.b.flavor: " [heir.GetSheHe|U]는 내게서 축복받지 못했으며 통치에 적합하지 않음"
 pam_theocratic_ruler_events.0009.c: "\"기도하고 육신을 단련하라.\""
 pam_theocratic_ruler_events.0010.t: "검이냐 지팡이냐"
 pam_theocratic_ruler_events.0010.desc: "나는 내 땅의 영주로서 검을 비롯해 축복으로 [ROOT.Char.GetFaith.HighGodName](을)를 섬겨야 했다.\n\n[pilgrimage_memory.GetDescription] 그리고 [battle_memory.GetDescription] 시절이 아직도 선명히 떠오른다. 들판에는 시체의 산이 쌓였고, 추종자들은 내가 주어진 임무 앞에서 물러나지 않는다는 사실을 너무도 잘 알았다.\n\n봉역의 앞날을 내다보는 내 [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName], [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName] 둘 다 각자의 도구를 우리 노력의 최전선에 내세우기를 바라고 있다."
 pam_theocratic_ruler_events.0010.a: "검을 명예롭게 하자."
 pam_theocratic_ruler_events.0010.b: "목자의 지팡이가 이끌어야 한다."
 pam_theocratic_ruler_events.0010.c: "검과 목자의 지팡이로 함께 섬겨야 한다."
 pam_theocratic_ruler_events.0011.t: "쓰러진 기사를 위한 안식"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName](이)가 [ROOT.Char.GetFaith.HighGodName](을)를 지키다 쓰러진 자신의 친족들에 대한 소식을 전하며 내 앞에 무릎을 꿇었다. \n\n\"수많은 이교도에 맞서 대등하게 싸웠지만, 상처가 너무도 깊었습니다. 그나마 마지막 작별 인사를 할 수 있어서 다행이었지요.\" \n\n\"이 전사가 제단 통로 밑에서 자신의 검과 함께 안식을 취할 수 있게 자리를 마련해 주십시오. 그렇게만 해 주신다면 이 은혜를 잊지 않겠습니다.\""
 pam_theocratic_ruler_events.0011.a: "석재 비용을 치르면 이곳에서 안식을 취하게 해 주겠다."
 pam_theocratic_ruler_events.0011.a.flavor: "그 기사는 교회 안에서 안식을 취할 것이다."
 pam_theocratic_ruler_events.0011.b: "검을 기부한다면 지하 묘지를 쓰게 해 주겠다."
 pam_theocratic_ruler_events.0011.b.flavor: "기사는 검 없이 안식을 취해야 할 것이다."
 pam_theocratic_ruler_events.0011.c: "전사는 드넓은 하늘 아래에 있어야 하는 법."
 pam_theocratic_ruler_events.0011.c.flavor: "기사가 교회 벽 바깥에 묻혔다."
 pam_fallen_knight_crusader_sword_name: "십자군의 검"
 pam_fallen_knight_crusader_sword_desc: "신앙을 지키다 전사한 기사의 검입니다. 이교도의 검과 맞서 싸운 자국이 가득하며, 칼자루에는 작은 십자가가 새겨져 있습니다."
 pam_theocratic_ruler_events.0012.t: "한때 신성했던 숲"
 pam_theocratic_ruler_events.0012.desc: "앞에 숲이 나타나기 시작하자 내 종사단의 걸음도 느려졌다. [grove_county.GetNameNoTier]의 독신자 중 한 명인 [grove_subject.GetTitledFirstName](이)가 환영의 뜻으로 양손을 펼친 채 나무들 사이에서 걸어 나왔다.\n\n\"이 땅에 사는 사람들의 마음을 얻고자 하신다면 [ROOT.Char.GetFaith.HighGodName]께서 이곳에 심어 놓은 말씀에 귀를 기울이고 이를 포용해야 합니다. [grove_province.GetName]의 오래된 숲 옆에 사원을 지으신다면 사람들 또한 그대가 누구를 섬기는 목자인지 알게 될 겁니다.\""
 pam_theocratic_ruler_events.0012.a: "자연이 내 믿음을 이끌어 주기를."
 pam_theocratic_ruler_events.0012.b: "그 숲을 좀 봐야겠군."
 pam_theocratic_ruler_events.0012.b.success: "당신의 부하들이 나중에 돌아와 목재를 수거함"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip](이)가 당신의 계략을 간파함"
 pam_theocratic_ruler_events.0012.b.toast.success: "오래된 나무들을 운송해 금화를 벌었음."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip](이)가 당신의 신성 모독 행위에 대한 소문을 퍼뜨림"
 pam_theocratic_ruler_events.0012.c: "이 야생에서 악마의 기운이 강하게 느껴진다."
 pam_theocratic_ruler_events.0013.t: "천사의 영감"
 pam_theocratic_ruler_events.0013.desc: "오늘 열린 미사에서 누군가의 목소리가 신성한 영감이라도 받은 듯이 성가대의 선창자를 제치고 울려 퍼졌다. 소름이 끼칠 만큼 맑고 아름다운 목소리였다.\n\n[angelic_singer.GetTitledFirstName](이)가 노래를 부르는 동안 신자들은 말을 잃었고, 나 역시 마지막 선율이 사라진 지 한참 뒤에도 귀를 기울이고 있었다."
 pam_theocratic_ruler_events.0013.a: "\"그대의 재능은 [ROOT.Char.GetFaith.HighGodName]의 것이다. 수도 서원을 하고 섬기도록.\""
 pam_theocratic_ruler_events.0013.a.success: "당신의 말이 [angelic_singer.GetHerHim]를 설득해 헌신하게 함"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip](이)가 설득에 넘어가지 않음"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip](이)가 수도 서원을 하고 당신의 궁정에 합류함"
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip](이)가 거절하고 떠남."
 pam_theocratic_ruler_events.0013.b: "내 문객으로 머무르게나. 그 목소리를 다시 듣고 싶군."
 pam_theocratic_ruler_events.0013.c: "노래는 우리 성가대 선창자들에게 맡기지."
 pam_theocratic_ruler_events.0014.t: "개종자의 간청"
 pam_theocratic_ruler_events.0014.desc: "설교 중이었다. [neighbour_faith.GetNameNoTooltip]의 옛 관습을 떠나 개종한 [convert_peasant.GetCulture.GetNameNoTooltip] 사람인 [convert_peasant.GetTitledFirstName](이)가 군중을 뚫고 앞으로 나왔다.\n\n\"옛 방식에서도 아직 배울 것이 많습니다. 이 점을 진심으로 고려해 주신다면, 우리 민족도 그대가 우리 전통을 존중한다는 사실을 알게 될 겁니다. 그러면 다들 곁으로 와서 그대의 모든 노력을 지지할 테고요.\"\n\n[convert_peasant.GetSheHe|U]는 내가 축복을 내리며 말없이 고개를 끄덕여 대답하기만을 기다리고 있었다."
 pam_theocratic_ruler_events.0014.a: "이 버러지를 내 눈앞에서 치워라."
 pam_theocratic_ruler_events.0014.a.flavor: "당신이 [GetTrait('arrogant').GetName( GetNullCharacter )] [trait|E]을 보유함"
 pam_theocratic_ruler_events.0014.a.acceptance: "개종자의 간청 거절"
 pam_theocratic_ruler_events.0014.b: "[offered_tenet_a.GetBaseNameNoTooltip](을)를 내 것으로 포용한다."
 pam_theocratic_ruler_events.0014.b.tt: "당신의 [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] [great_project|E]에 대한 다음 #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! 공헌 비용이 무료가 됨."
 pam_theocratic_ruler_events.0014.c: "[offered_tenet_b.GetBaseNameNoTooltip](을)를 내 것으로 포용한다."
 pam_theocratic_ruler_events.0014.c.tt: "당신의 [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] [great_project|E]에 대한 다음 #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! 공헌 비용이 무료가 됨."
 pam_theocratic_ruler_events.0014.d: "양 떼가 목자를 이끄는 걸 보았나?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "개종자의 간청"
 pam_theocratic_ruler_events.0015.t: "계승자를 위한 인도"
 pam_theocratic_ruler_events.0015.desc: "교구에는 내 뒤를 이어 기도는 물론 판단의 영역에서도 양 떼를 이끌 수 있는 목자가 필요할 것이다. 승계 서열의 가장 첫 번째인 [succession_heir_first.GetTitledFirstName], 그리고 바로 뒤를 잇는 [succession_heir_second.GetTitledFirstName](을)를 개인적으로 불러 내 앞에서 성서를 낭독하게 했다. \n\n둘 중 한 명이 내 짐을 짊어지게 될 것이니, 오늘 이 둘을 똑같이 여겨서는 안 된다.\n\n\"믿음의 자녀들이여. 단순히 암기한 내용뿐만 아니라, 자신의 것으로 만든 내용까지 보여주도록 하거라.\""
 pam_theocratic_ruler_events.0015.a: "[succession_heir_first.GetFirstNameNoTooltip]에게 성서를 가르친다."
 pam_theocratic_ruler_events.0015.b: "[succession_heir_second.GetFirstNameNoTooltip]에게 성서의 뜻을 인도한다."
 pam_theocratic_ruler_events.0015.c: "아직은 내가 목자다. 그러니 내가 낭독하겠다."
 pam_theocratic_ruler_events.0015.c.success: "당신의 학식이 계승자들의 낭송을 압도함"
 pam_theocratic_ruler_events.0015.c.failure: "당신은 계승자들이 속속들이 외우고 있는 구문을 더듬음"
 pam_theocratic_ruler_events.0015.c.toast.success: "계승자들이 교리에 관한 당신의 지식에 감동을 받음"
 pam_theocratic_ruler_events.0015.c.toast.failure: "당신이 실수하자 종속자들이 시선을 교환함"
