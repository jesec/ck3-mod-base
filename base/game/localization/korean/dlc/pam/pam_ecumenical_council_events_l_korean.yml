 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "공의회 투표"
 ecumenical_council_events.0081.desc.innovator_passed: "변화를 주장한 우리의 승리였다. 우리의 논리가 공의회에서 충분한 지지를 얻었으며, 새로운 방식이 채택되었다."
 ecumenical_council_events.0081.desc.innovator_failed: "우리는 변화를 밀어붙였으나, 득표수가 부족해 불리했다. 옛 방식이 살아남았으며, 우리의 논쟁은 일단 접어두게 되었다."
 ecumenical_council_events.0081.desc.conservative_passed: "전통을 지키려 했으나, 개혁가들의 득표수가 더 많았다. 우리의 불안한 마음과는 상관없이 결국 변화가 채택되었다."
 ecumenical_council_events.0081.desc.conservative_failed: "전통을 옹호한 우리가 견뎌냈다. 제안은 거부되었으며, 우리의 교파도 보존할 수 있게 되었다."
 ecumenical_council_events.0081.desc.neutral: "공의회의 결정이 내려졌으며, 안건도 마무리되었다."
 ecumenical_council_events.0081.a: "결정이 났군."
 # The court chaplain's report of a council their liege did not attend
 ecumenical_council_events.0082.opening: "[ROOT.GetCharacter.GetTitledFirstName]에게,"
 ecumenical_council_events.0082.desc: "성직자들이 일어났소. 그대가 자리에 없는 동안 이들이 결정한 사안이 이제 우리를 구속하오. 우리가 찬성했든, 하지 않았든 말이오."
 ecumenical_council_events.0082.desc.unchanged: "성직자들이 일어났소. 그렇게 많은 논쟁을 거쳤으나 변한 것은 없소. 우리는 여전히 제자리에 있소."
 ecumenical_council_events.0082.a: "교회가 나 없이도 움직이는군."
