 ecumenical_council_events.0111.t: "불평하는 노인들"
 ecumenical_council_events.0111.desc: "머리가 하얗게 센 장로들이 서성이며 말다툼을 벌이고 있었다.\n\n\"지금까지 공의회 몇 번을 참석했는데, 우린 그때마다 실수를 저질렀습니다. 그 왜곡을 바로잡지는 못할망정, 오히려 더 많은 왜곡을 저지르길 바라는 것 같군요!\" [lead_conservative.GetTitledFirstName](이)가 투덜거렸다.\n\n\"늙은 [lead_conservative.Custom('RegionalFarmAnimal')] 같으니! 지난번에도 똑같은 소릴 하지 않았습니까? 그 얘긴 무덤에 들어갈 때까지 계속하시려나 봅니다!\" [lead_innovator.GetTitledFirstName](이)가 맞받아쳤다."
 ecumenical_council_events.0111.support: "이 변화로 옛 실수를 바로잡을 것이다!"
 ecumenical_council_events.0111.support_duel: "장로들을 지지하는 주장을 반복한다."
 ecumenical_council_events.0111.support_duel.success: "저들이 불평하면서도 받아들임"
 ecumenical_council_events.0111.support_duel.success_halved: "몇몇 이가 이 조정 사항을 받아들임"
 ecumenical_council_events.0111.support_duel.failure: "저들이 여전히 \"왜곡\"이라며 외침"
 ecumenical_council_events.0111.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip](을)를 지지한다. 더 이상의 촌극은 없다."
 ecumenical_council_events.0111.oppose_duel: "나이 든 몽상가들을 지적인 먼지로 만들어 버린다!"
