 ecumenical_council_summons_events.0060.t: "동등한 이들 중에서도 으뜸"
 ecumenical_council_summons_events.0060.desc: "[GetRiteByKey('roman_rite').GetName](을)를 대변하는 [ec_roman_champion.GetTitledFirstName](은)는 이 문제를 넘길 생각이 없어 보였다.\n\n\"모든 교회는 로마의 권위 아래 있으며, 로마는 그 누구의 권위 아래에도 있지 않습니다!\"\n\n[ec_greek_champion.GetTitledFirstName](이)가 손가락으로 다섯 총대주교를 세어 보았다.\n\n\"이 중에서 무릎을 꿇은 사람이 있답니까?\""
 ecumenical_council_summons_events.0060.a: "\"둘 다 자중하시오. 공의회는 아직 시작도 하지 않았소.\""
 ecumenical_council_summons_events.0060.a.success: "회당 전체가 편이 갈리기 전에 두 사람이 진정함"
 ecumenical_council_summons_events.0060.a.failure: "아무도 내 말을 듣지 않으며 회당 전체가 편이 갈림"
 ecumenical_council_summons_events.0060.b: "열쇠는 베드로에게 주어졌으며, 로마가 이를 간직한다."
 ecumenical_council_summons_events.0060.c: "로마는 동등한 이들 중에서도 으뜸이다. 그게 전부다."
 ecumenical_council_summons_events.0060.d: "이 직위의 주인은 나다. 이 문제는 여기서 끝이다."
 ecumenical_council_summons_events.0061.t: "그리고 아들"
 ecumenical_council_summons_events.0061.desc: "\"두 단어입니다.\" [GetRiteByKey('byzantine_rite').GetName]의 [ec_greek_champion.GetTitledFirstName](이)가 말했다. \"[GetRiteByKey('roman_rite').GetAdherentNamePlural]들이 신조에 슬쩍 끼워 넣은 두 단어가 있습니다. 동방에는 그런 질문을 한 적도 없는데 말이지요.\"\n\n\"진실에는 신을 제외한 그 누구의 허락도 필요 없습니다.\" [ec_roman_champion.GetTitledFirstName](이)가 답했다."
 ecumenical_council_summons_events.0061.a: "신조는 자신을 둘러싼 논쟁보다 더 심각한 난관도 견뎌냈으니."
 ecumenical_council_summons_events.0061.a.success: "논쟁이 격화되기 전에 단어 선택 문제를 제쳐두기로 함"
 ecumenical_council_summons_events.0061.a.failure: "논쟁이 양측의 교리 문제로 격화됨"
 ecumenical_council_summons_events.0061.b: "그 단어는 진리이기 때문에 추가된 것이다."
 ecumenical_council_summons_events.0061.c: "공의회가 신조를 썼으니, 공의회만이 바꿀 수 있다."
 ecumenical_council_summons_events.0061.d: "이곳에서 신조는 내가 말하는 대로 낭송될 것이다."
 ecumenical_council_summons_events.0062.t: "제단의 빵"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName](이)가 동전처럼 얇고 창백한 제병을 들어 올리며 말했다.\n\n\"[GetRiteByKey('roman_rite').GetAdherentNamePlural]에게는 이보다 더한 게 필요했던 적이 없습니다.\"\n\n[ec_greek_champion.GetTitledFirstName](이)가 부풀어 오른 빵 덩어리를 그 옆에 놓더니 이렇게 물었다.\n\n\"그렇다면 [GetRiteByKey('byzantine_rite').GetAdherentNamePlural]들이 사도 시절부터 쭉 잘못하고 있었다는 얘기입니까?\""
 ecumenical_council_summons_events.0062.a: "내일 내 제단에서 두 빵을 모두 축복하고, 우리가 이 빵들을 먹을 것이다."
 ecumenical_council_summons_events.0062.a.success: "두 빵을 모두 먹고 언쟁도 가라앉게 됨"
 ecumenical_council_summons_events.0062.a.failure: "그날 저녁 두 개의 제단이 세워졌으며, 아무도 사이를 건너가지 않음"
 ecumenical_council_summons_events.0062.b: "최후의 만찬 때처럼 부풀지 않은 무교병이어야 한다."
 ecumenical_council_summons_events.0062.c: "주님은 부활하셨으니, 부풀어 오른 빵이어야 한다."
 ecumenical_council_summons_events.0062.d: "빵은 그냥 빵이지. 중요한 건 축복이다."
 ecumenical_council_summons_events.0063.t: "언어의 문제"
 ecumenical_council_summons_events.0063.desc: "기도를 라틴어로 읽었다. [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] 측 좌석에서는 번역을 기다렸지만, 어딘지 비뚤어진 번역이 나왔다. [ec_greek_champion.GetTitledFirstName](이)가 중얼거렸다.\n\n\"로마인들은 꼭 변호사처럼 다투는군요. 말만 많고 내용은 없어요.\"\n\n\"그리스인은 철학자처럼 논쟁하지요. 아무것도 정하지 못한답니다.\" [ec_roman_champion.GetTitledFirstName](이)가 답했다."
 ecumenical_council_summons_events.0063.a: "그렇다면 두 언어 모두에서 통용될 단어를 찾자."
 ecumenical_council_summons_events.0063.a.success: "어느 쪽에서도 왜곡할 수 없는 표현을 찾아냄"
 ecumenical_council_summons_events.0063.a.failure: "양측 모두 상대가 악의적인 주장을 펼쳤다고 확신하며 자리를 떠남"
 ecumenical_council_summons_events.0063.b: "라틴어로 분명하게 숨김없이 말하라."
 ecumenical_council_summons_events.0063.c: "교부는 그리스어로 썼지. 그렇다면 우리도 읽을 수 있을 거다."
 ecumenical_council_summons_events.0063.d: "내 이름 아래 두 언어 모두 사용한다. 이것으로 마무리하지."
