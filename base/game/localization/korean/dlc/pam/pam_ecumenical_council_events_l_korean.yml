l_korean:
 ecumenical_council_events.0001: "[my_location.GetBaronyNameExplicitlyNoTooltip] 공의회"
 ecumenical_council_events.0001.desc_intro: "[my_location.GetBaronyNameExplicitly]의 [ROOT.Char.GetFaith.HouseOfWorshipPlural](이)가 행사를 맞이해 아름답게 장식되었다. 기독교 세계에서 가장 훌륭한 이들이"
 ecumenical_council_events.0001.host: "내 부름에 응답했다."
 ecumenical_council_events.0001.dislikes_host: "[host.Custom('InsultAdjective')] [host.GetTitledFirstNamePossessive] 부름에 응답했다."
 ecumenical_council_events.0001.likes_host: "[host.Custom('ComplimentAdjective')] [host.GetTitledFirstNamePossessive] 부름에 응답했다."
 ecumenical_council_events.0001.neutral: "[host.GetTitledFirstNamePossessive] 부름에 응답했다."
 ecumenical_council_events.0001.intent_arrived: "\n\n벌써 의회 사이에 있는 [intent_target.GetTitledFirstName]의 모습이 보였다. 완벽하군!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\n이제 [intent_target.GetTitledFirstName]도 곧 나타날 거다..."
 ecumenical_council_events.0001.no_intent_target: "\n\n저들이 오기만을 기다리면 된다!"
 ecumenical_council_events.0001.a.bad: "해야 한다면 어쩔 수 없지."
 ecumenical_council_events.0001.a.good: "신성이 곧 우리의 의무다."
 ecumenical_council_events.0002.t: "소집"
 ecumenical_council_events.0002.desc_intro: "이제 [host.GetFaith.HouseOfWorship](으)로 향하는 문을 열고 우리의 위대한 과업을 시작할 시간이 왔다. 이를 대비하며 동맹을 형성해"
 ecumenical_council_events.0002.reformist: "왕과 사제가 모두 똑같이 노력할 시간이다."
 ecumenical_council_events.schism_crisis_intro: "\n\n인사는 따스했지만, 사이의 침묵은 그렇지 못했다. 로마와 콘스탄티노폴리스는 더 이상 서로 예의를 갖추지 않으며, 해결되지 못한 모든 다툼은 그리스도의 몸에 또 다른 균열을 일으키고 있다."
 ecumenical_council_events.0002.first_tenet: "\n\n공기에 말소리가 가득했다. 소집된 이들은 [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )](와)과 다른 긴급한 사안에 대한 자신만의 관점을 형성하기 시작했다."
 ecumenical_council_events.0002.host: "\n\n나는 두 팔을 벌려 신자들을 맞이했다. 함께 중대한 과제를 직면할 시간이었다."
 ecumenical_council_events.0002.guest: "\n\n\"환영합니다, 신자 여러분. 부디 신께서 우리가 중대한 과제를 해결할 수 있도록 이끌어 주시기를!\" [host.GetTitledFirstName](이)가 손짓하며 우리를 앞으로 불렀다."
 ecumenical_council_events.0002.a: "아멘."
 ecumenical_council_events.0010.t: "[ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )]에 대한 관점"
 ecumenical_council_events.0010.desc.intro: "첫 논쟁은 [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )](을)를 중심으로 이루어졌다. 현재 교회법은 해당 교파를 [host.Custom('GetEcumenicalDebateTenet1StatusText')|l] 상태로 인정하고 있다. [lead_portrait.GetTitledFirstName](이)가 논쟁을 시작했다.\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n\"점점 더 많은 사람이 해당 교파를 숭배의 핵심으로 여기고 있습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName](이)가 보고했다."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n\"실천을 금지하면 위험이 따르기 마련이지만, 이 경우에는 타당한 방안입니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName](이)가 보장했다."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n\"아직 인기를 얻고 있는 실천 방식입니다. 이를 규탄한다면... 위험이 따를 수 있습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName](이)가 우려를 표명했다."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n\"이 교파의 실천이 인기를 잃고 있습니다. 바로 지금이 이 교파에 대한 지지를 중단할 때일지도 모릅니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName](이)가 조언했다."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n\"이 교파의 실천이 인기를 얻고 있습니다. 지지하는 편이 현명할 수도 있습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName](이)가 제안했다."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n\"이 교파의 실천은 매우 모호합니다. 옹호하기엔 위험한 뜻을 담고 있습니다.\" 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName](이)가 경고했다."
 ecumenical_council_events.0010.desc.fallback.explanation: "\"이는 우리의 신앙에서 아직 확고하게 자리를 잡지 못한 가르침이며, 현재 이 공의회에서 신중하게 논의해야 할 사안입니다.\""
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "\"[ROOT.Char.GetFaith.HighGodName]의 평화와 휴전을 지켜야 하는지 묻는 이들이 있습니다. 사람들이 약탈과 유혈 사태로부터 교회, 성직, 무장하지 않은 자들을 지키기 위해 맹세해야 할까요? 신성한 기간에는 누구도 무기를 들지 못하게 하고, 이를 어긴다면 [ROOT.Char.GetFaith.GetAdjective] 교회에서 파문되는 벌을 내려야 할까요?\""
 ecumenical_council_events.0010.desc.dulia.explanation: "\"성자들을 높이 공경해야 하는지 묻는 이들이 있습니다. 우리의 예배는 오직 [ROOT.Char.GetFaith.HighGodName]만을 위해 바치면서도, 성자들의 유물을 신성하게 여기고 그 축일을 지키며, 그들에게 기도할 수 있을까요?\""
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "\"제단의 빵과 포도주가 사제의 축성을 통하면 진정으로 그리스도의 살과 피가 되는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "\"거룩한 삶은 기도와 노동이 함께 어우러져야 하는지 묻는 이들이 있습니다. 나태함은 영혼의 적일까요? 우리가 들판이나 기록실에서 쏟는 노고도 [ROOT.Char.Custom('GetReligiousRite')]에서 보내는 시간처럼 숭고하게 여겨야 할까요?\""
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "\"하느님을 낳으신 성모 마리아를 다른 성자들보다 더 높이 섬겨야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.simony.explanation: "\"성직이나 축복, 성사 등을 금화로 사고팔 수 있는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.monophysitism.explanation: "\"그리스도가 온전히 신성한 하나의 본성을 지녔으며, 그 인간성은 사라지고 육신이 된 말씀 안에는 오직 신성함이 남는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "\"[ROOT.Char.GetFaith.GetAdjective] 교회가 사도들의 행적을 따라 살아가야 하는지 묻는 이들이 있습니다. 사도의 열광을 지닌 전도사들을 내보내, 아직도 어둠 속에 있는 이들에게 말씀을 전해야 할까요?\""
 ecumenical_council_events.0010.desc.purgatory.explanation: "\"완전히 악하지도 않지만 온전히 순결하지도 않은 영혼은 사후에 정화되는지 묻는 이들이 있습니다. 그러한 영혼이 [ROOT.Char.GetFaith.HighGodName] 앞에 서기 전에, 산 자들이 기도와 의례로 이들을 도와야 할까요?\""
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "\"자손을 낳는 것이 신성한 책임인지 묻는 이들이 있습니다. 독신자들이 그 자손으로 지상을 채워야 할까요?\""
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "\"주교의 권위가 진정 사도로부터 전해진 끊어지지 않는 계승에서 비롯되는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.confession.explanation: "\"모든 [ROOT.Char.GetFaith.GetAdherentName](이)가 사제에게 죄악을 고백하고 사죄받아야 하는지 묻는 이들이 있습니다. 고해의 봉인은 반드시 존중해야만 할까요?\""
 ecumenical_council_events.0010.desc.original_sin.explanation: "\"모든 영혼은 아담의 죄악을 물려받는지 묻는 이들이 있습니다. 우리는 탄생부터 죄로 더럽혀졌으며, 그러므로 세례의 은총이 필요한 존재일까요?\""
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "\"신성한 천사들이 계급 순서에 따라 [ROOT.Char.GetFaith.HighGodName] 아래 서며, 각 계급은 다음 계급보다 위에 자리하는지 묻는 이들이 있습니다. [ROOT.Char.GetFaith.GetAdjective] 교회의 성직 또한 천상의 질서를 따라야 할까요?\""
 ecumenical_council_events.0010.desc.miles_christi.explanation: "\"독신자들이 그리스도의 병사가 되어야 하는지 묻는 이들이 있습니다. 부름이 있으면 검을 들고 일어나 [ROOT.Char.GetFaith.GetAdjective] 교회를 지켜야만 할까요?\""
 ecumenical_council_events.0010.desc.scholasticism.explanation: "\"신앙은 이성을 통해 이해해야 하는지 묻는 이들이 있습니다. 학파에서 변증법과 철학을 활용해 교리를 정리하고 지켜야 할까요?\""
 ecumenical_council_events.0010.desc.adoptionism.explanation: "\"그리스도는 인간성 측면에서 입양을 통해 [ROOT.Char.GetFaith.HighGodName]의 아들이 되었는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "\"모든 [ROOT.Char.GetFaith.GetAdherentName](은)는 이방인과 적을 비롯한 이웃을 사랑해야 하며, 이것이야말로 [ROOT.Char.GetFaith.HighGodName](을)를 향한 사랑을 나타내는 확실한 방법이 아닌지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "\"독신자들이 [ROOT.Char.GetFaith.HighGodName]께 다가가는 가장 주된 길은 찬가와 향, 질서 잡힌 의례를 통한 [ROOT.Char.Custom('GetReligiousRite')](이)가 아닌지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "\"그리스도는 신성과 인성이 성육신한 하나의 본성이며, 분리되거나 혼동되지 않는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.hesychasm.explanation: "\"거룩한 고요함과 마음에서 우러나오는 단순한 기도를 끝없이 반복한다면 영혼이 [ROOT.Char.GetFaith.HighGodNamePossessive|U] 창조되지 않은 빛을 볼 수 있는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.anachoresis.explanation: "\"세상에서 멀어지는 것이 신성한 길인지 묻는 이들이 있습니다.. 은둔자의 고독이 진정으로 [ROOT.Char.GetFaith.HighGodName]께 향할 수 있는 길일까요?\""
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "\"단식, 거친 옷, 채찍의 구속으로 육신을 묶는다면 영혼을 풍요롭게 할 수 있을지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.holy_myron.explanation: "\"[Glossary( '성유', 'CHRISM_GLOSS' )]가 성령의 선물로서 세례와 대관식을 완성하는지 묻는 이들이 있습니다.\""
 CHRISM_GLOSS: "성유는 #bold 크리스마#!로도 불리며, 이는 그리스어로 \"도유하다\"라는 뜻입니다. 주교의 축성을 받은 성스러운 향유로, 세례와 견진성사에서 신자의 도유에 사용되었으며 간혹 왕실 대관식에 쓰이기도 했습니다."
 ecumenical_council_events.0010.desc.khachkar.explanation: "\"돌에 새긴 십자가를 세워 성지와 망자의 땅을 표시하고, 신앙을 오래도록 표시할 공적인 증표로 삼아야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.philanthropia.explanation: "\"빈자를 보살피는 것이 [ROOT.Char.GetFaith.GetAdjective] 교회의 책무인지 묻는 이들이 있습니다. 구제 활동을 하고 병원과 자선 기관을 세워야 할까요?\""
 ecumenical_council_events.0010.desc.aniconism.explanation: "\"우리 교회에서 모든 성상을 몰아내야 하는지 묻는 이들이 있습니다. 성상의 숭배는 세속적인 우상 숭배이며, 우리의 눈과 마음을 [ROOT.Char.GetFaith.HighGodName]에게서 멀어지게 만드는 행위일까요?\""
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "\"숨겨진 영적인 뜻을 탐구하며 성서를 읽어야 하는지 묻는 이들이 있습니다. 그리스 학문과 우화를 통해 글자에 숨겨진 뜻을 알아내야 할까요?\""
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "\"십자가를 들고 신성한 목적 아래 행군하는 것이야말로 그리스도에게 헌신하는 길인지 묻는 이들이 있습니다. 검으로 순례를 지키며, 불신자들이 차지한 것을 되찾아야 할까요?\""
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "\"육신의 쾌락을 통해 영혼이 신성함에 가까워질 수 있는지 묻는 이들이 있습니다. 욕망을 죄악으로 지탄하는 게 아니라, 귀중히 여기며 추구해야 할까요?\""
 ecumenical_council_events.0010.desc.communal_identity.explanation: "\"신앙과 민족의식이 [ROOT.Char.GetFaith.HighGodName] 아래 하나인지 묻는 이들이 있습니다. 외지인은 반드시 참된 신자 무리의 바깥에만 머물러야 할까요?\""
 ecumenical_council_events.0010.desc.communion.explanation: "\"모두가 공유하는 신성한 의식이 [ROOT.Char.GetFaith.HighGodName]의 존재를 일깨우는지 묻는 이들이 있습니다. 우리와 합류하지 않는 이들을 참된 신자 무리에 속하지 않는 외지인으로 간주해야 할까요?\""
 ecumenical_council_events.0010.desc.consolamentum.explanation: "\"죽음이 다가오면 최후의 영적 정화를 통해 모든 죄악을 씻어내고, 이렇게 정화 받은 자는 죄악이 돌아오지 않도록 음식과 삶을 포기해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "\"결혼은 신성한 혈통 사이에서만 이루어져야 하며, 이는 [ROOT.Char.GetFaith.GetAdjective] 교회에서 금기로 여길 만큼 가까운 친족이라도 마찬가지인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.gnosticism.explanation: "\"구원은 숨겨진 지식 속에 있으며, 이 지식은 신성한 불꽃을 해방해 그 근원으로 돌려보내는 입회자에게만 드러나는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "\"수도사들은 그 무엇도 소유해서는 안 되는지 묻는 이들이 있습니다. 수도사들이 이 마을에서 저 마을로 떠돌아다니며 구걸하고, [ROOT.Char.GetFaith.HighGodName]의 말씀을 설교하며 살아가야 할까요?\""
 ecumenical_council_events.0010.desc.pacifism.explanation: "\"[ROOT.Char.GetFaith.GetAdherentName]의 삶에 검이 설 자리가 있는지 묻는 이들이 있습니다. 정의로운 전쟁은 잘못된 개념일까요?\""
 ecumenical_council_events.0010.desc.pentarchy.explanation: "\"[ROOT.Char.GetFaith.GetAdjective] 교회는 다섯 총대주교좌의 합의적 통치를 따라 다스려야 하는지 묻는 이들이 있습니다. 이는 [ROOT.Char.GetFaith.HighGodNamePossessive] 주요 중보자가 지닌 우위권을 부정하는 것일까요?\""
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "\"박해, 고난, 의심에 굴복하는 일 없이 신앙을 따라야만 하는지 묻는 이들이 있습니다. 우리가 어떤 대가를 치르든 굳건히 버티는 것이 옳은 길일까요?\""
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "\"사도들이 그러했듯 청빈을 서약하는 것이 [ROOT.Char.GetFaith.HighGodName](을)를 가장 잘 섬기는 것인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "\"무리가 각자의 방식을 따르도록 내버려둬야 하는지 묻는 이들이 있습니다. [ROOT.Char.GetFaith.GetAdjective] 교회는 외지인에게 간섭하거나, 이들의 개입을 받아들여서는 안 되는 걸까요?\""
 ecumenical_council_events.0010.desc.adaptive.explanation: "\"우리의 관습과 제약을 보편적으로 고수할 것을 요구하면 신자 무리에 해가 되는지 묻는 이들이 있습니다. 우리 신앙의 핵심이 변하지 않는다는 것을 전제로, 우리의 법을 그 법이 존재할 세상에 맞게 조정할 수 있을까요?\""
 ecumenical_council_events.0010.desc.esotericism.explanation: "\"[ROOT.Char.GetFaith.HighGodName]의 신비를 따라 우리 주변의 세상에서 지식을 추구해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.legalism.explanation: "\"신성한 법이 [ROOT.Char.GetFaith.GetAdjective]의 인생 전체를 구속하는지 묻는 이들이 있습니다. 왕족이건 고압적인 인물이건, 그 어떠한 죄인도 우리의 법 위에 서지 못하는 것이 맞을까요?\""
 ecumenical_council_events.0010.desc.literalism.explanation: "\"성서는 불변이자 완전하며, [ROOT.Char.GetFaith.HighGodNamePossessive] 지혜를 담은 유일한 보고인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.reincarnation.explanation: "\"영혼은 [ROOT.Char.GetFaith.HighGodNamePossessive] 심판을 단 한 번만 맞이하는 것이 아니라, 수많은 삶을 거쳐 돌아오는 것인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "\"신앙과 법에 관한 새로운 질문이 제기될 때마다, [ROOT.Char.GetFaith.GetAdjective] 교회의 학자들이 구속력을 지닌 판단을 내리는 게 맞는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "\"[ROOT.Char.GetFaith.GetAdjective]의 삶은 투쟁과 복종을 통해서만 이루어지는지 묻는 이들이 있습니다. 신자는 [ROOT.Char.GetFaith.HighGodNamePossessive|U] 뜻에 완전히 굴복해야만 하는 것일까요?\""
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "\"박해받는 [ROOT.Char.GetFaith.GetAdherentName]들이 다른 신앙을 믿는 것처럼 가장해도 되는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "\"불신자가 보호받는 대가로 세금을 낸다면, [ROOT.Char.GetFaith.GetAdjective]의 다스림 아래에서도 그대로 살아갈 수 있는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.asceticism.explanation: "\"굶주림과 욕구를 느끼고 모든 안락함을 부정하면 [ROOT.Char.GetFaith.HighGodName]께 다가갈 수 있는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.bhakti.explanation: "\"모든 영혼이 사랑에서 우러난 헌신을 신성함의 한 측면에 바쳐야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "\"살아있는 모든 생명에 해를 끼치는 일을 금지해야 하는지 묻는 이들이 있습니다. 그렇다면 하찮은 짐승과 곤충에게도 해를 끼쳐서는 안 되는 것일까요?\""
 ecumenical_council_events.0010.desc.inner_journey.explanation: "\"[ROOT.Char.GetFaith.HighGodName]께 다가가려면 주로 사색과 자신을 알아가는 과정을 거쳐야 하는 게 아닐지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "\"신성한 책무로서 그 어떤 이방인이라도 우리의 식탁으로 받아들여야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.adorcism.explanation: "\"이 세계의 영혼을 부정한 존재로 여기고 쫓아내기보다는, 이들의 도움을 받을 수 있도록 공경하고 환영해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "\"조상들이 우리를 지켜보고 인도할 수 있도록 기도와 공물을 바치며 기려야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.astrology.explanation: "\"별들 속에서 [ROOT.Char.GetFaith.HighGodNamePossessive] 뜻을 읽어낼 수 있는지 묻는 이들이 있습니다. 하늘이 우리 운명의 비밀을 쥐고 있는 걸까요?\""
 ecumenical_council_events.0010.desc.hedonistic.explanation: "\"쾌락은 선물이며, 숭배의 형태로 추구해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "\"인간의 생명을 제단에 바쳐야 하는지 묻는 이들이 있습니다. [ROOT.Char.GetFaith.HighGodName](을)를 위한 신성한 선물로서 피를 바쳐야 할까요?\""
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "\"일부 영혼은 태어날 때부터 신성한 힘과 영적인 지도력을 타고나며, 이는 [ROOT.Char.GetFaith.GetAdjective] 교회의 도유를 받기 전에 선택받는 것인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "\"신자들이 하나가 될 수 있도록 [ROOT.Char.GetFaith.GetAdjective]의 달력을 신성한 축일로 가득 채워야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "\"출산을 신성한 의식으로 대비해야 하는지 묻는 이들이 있습니다. [ROOT.Char.GetFaith.HighGodName]께서 어머니와 아이를 축복하실 수 있도록 탄생 장소를 정화해야 할까요?\""
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "\"삼림의 수풀과 흐르는 강물, 이슬이 맺히는 계곡을 신성하게 여겨야 하는지 묻는 이들이 있습니다. 야생의 자연 속에서 [ROOT.Char.GetFaith.HighGodName](을)를 찾아야 할까요?\""
 ecumenical_council_events.0010.desc.sun_worship.explanation: "\"기도를 태양에 바쳐야 하는지 묻는 이들이 있습니다. 이 생명을 주는 빛이 우리의 [ROOT.Char.GetFaith.HighGodName]일까요?\""
 ecumenical_council_events.0010.desc.warmonger.explanation: "\"전쟁과 정복 자체만으로도 신성한 섬김이 되는지 묻는 이들이 있습니다. 검이야말로 [ROOT.Char.GetFaith.HighGodName]의 말씀을 퍼뜨리는 가장 확실한 방법일까요?\""
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "\"신성한 날을 피와 잔혹한 광경으로 기념해야 하는지 묻는 이들이 있습니다. 이런 향락이 [ROOT.Char.GetFaith.HighGodName](을)를 향한 참된 숭배일까요?\""
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "\"높은 곳과 지상의 뿌리가 있는 곳을 신성하게 여겨야 하는지 묻는 이들이 있습니다. 정상과 바위 사이의 숨겨진 길 속에서 [ROOT.Char.GetFaith.HighGodName](을)를 찾아야 할까요?\""
 ecumenical_council_events.0010.desc.household_gods.explanation: "\"난롯가와 집의 신들을 [ROOT.Char.GetFaith.GetAdjective]의 집안에 모시고 기려야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "\"극동의 의례와 정경을 우리의 신앙에 함께 엮어내야 할지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "\"서로를 악하다고 하지 않고 나란히 살아가는 동방의 신앙을 보고 배우는 게 어떨지 묻는 이들이 있습니다. 비록 우리가 저 동방의 신을 믿지 않을지라도 말입니다.\""
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "\"새롭게 개종한 이들이 지닌 옛 민속의 관습을 내버려두어도 될지 묻는 이들이 있습니다. 이는 배척하고 비난하기보다는, 조용히 배우자는 주장입니다.\""
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "\"그리스도의 가르침 밖에서 살아가는 자들이 그리스도를 참된 신이라 고백하지 않더라도, 여전히 그분의 가르침과 본보기를 기리며 살아갈 수 있는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "\"사라센의 법을 [ROOT.Char.GetFaith.GetAdjective] 교회로 끌어들여, 저들의 가르침을 복음과 혼합하면 어떨지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "\"유대교의 모든 주장에 동조하지는 않더라도, 이들의 법과 배움을 [ROOT.Char.GetFaith.GetAdjective] 교회에 받아들이는 게 어떨지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "\"고통 자체가 신성한 것인지 묻는 이들이 있습니다. 고통을 주는 것은 축복이며, 고통받는 것은 [ROOT.Char.GetFaith.HighGodName|U]의 은총인 걸까요?\""
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "\"도시를 버리고 황야의 삶을 받아들여야 거룩함을 얻을 수 있는지 묻는 이들이 있습니다. 다시 한번 최초의 상태가 되어 존재하자는 주장입니다.\""
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "\"지상을 지배하는 것이야말로 신성한 끝이 아닐지 묻는 이들이 있습니다. 권력의 장악이 곧 [ROOT.Char.GetFaith.HighGodNamePossessive] 뜻을 이루는 길일까요?\""
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "\"신성한 의식을 통해 망자의 살을 먹어야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "\"기만도 신성할 수 있을지 묻는 이들이 있습니다. 진실이 신앙을 위태롭게 할 때, 신자는 거짓말을 하는 것은 물론 그 거짓말을 믿어도 될까요?\""
 ecumenical_council_events.0010.desc.polyamory.explanation: "\"신자가 많은 이와 사랑을 나누어야 하며, 한 사람의 영혼이 다른 영혼의 애정을 소유할 수 있다는 주장을 버려야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "\"신성한 의식을 벌여 인간의 생명을 제물로 바쳐야 하는지 묻는 이들이 있습니다. 자발적으로 나선 자들과 죄지은 자들을 [ROOT.Char.GetFaith.GetAdjective]의 제단에 바쳐야 할까요?\""
 ecumenical_council_events.0010.desc.megaliths.explanation: "\"위대한 석재 기념물을 세워 [ROOT.Char.GetFaith.HighGodNamePossessive] 영광에 바쳐야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "\"신자들이 모든 소유물을 공동으로 소유해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.pure_land.explanation: "\"고통에서 벗어난 복된 세계는 재물이나 연구, 의식의 통달이 아니라 신뢰와 헌신으로만 닿을 수 있는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.no_mind.explanation: "\"[ROOT.Char.GetFaith.HighGodName]께 다가가려면 마음을 비우고 내면을 고요하게 유지해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "\"높은 곳이야말로 드높고 신성한 장소가 아닐지 묻는 이들이 있습니다. 산꼭대기가 [ROOT.Char.GetFaith.HighGodName]께 가장 가까이 갈 수 있는 장소일까요?\""
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "\"이 시대는 점점 어두워지며, 악마가 경건함을 가장하고 걸어 다니는 시기가 아닐지 묻는 이들이 있습니다. 신성한 법이 쇠락해 가는 가운데, 그러한 적을 물리치며 법을 지켜야 할까요?\""
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "\"살해한 이들의 머리를 신성한 전리품으로 취해야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "\"지식의 추구를 신성한 책무로 여겨야 하는지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "\"정당한 통치는 [ROOT.Char.GetFaith.GetAdjective]의 군주들이 따라야만 하는 신성한 책임인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.filial_piety.explanation: "\"우리의 부모와 선조를 기리는 것은 [ROOT.Char.GetFaith.HighGodName]께서 명하신 의무인지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "\"모든 영혼이 각자의 자리를 찾은 사회적 조화의 상태야말로 [ROOT.Char.GetFaith.GetAdjective] 질서의 중심이 아닌지 묻는 이들이 있습니다.\""
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "\"파괴 자체를 신성한 것으로 여겨야 하는지 묻는 이들이 있습니다. [ROOT.Char.GetFaith.HighGodName]께서 우리가 옛것을 파괴하길 바라시는 걸까요?\""
 ecumenical_council_events.0010.desc.preservation.explanation: "\"무언가를 세우고, 세워진 것을 지켜내는 일이 거룩한 것 아닐지 묻는 이들이 있습니다. [ROOT.Char.GetFaith.GetAdjective] 사원과 작품이 영원히 이어질 수 있게 보살펴야 할까요?\""
 ecumenical_council_events.0010.desc.takamin.explanation: "\"강력한 곰을 신성한 그릇으로 여겨야 할지 묻는 이들이 있습니다. 사냥을 통해 위대한 짐승을 신성하게 기리고, 짐승의 목숨을 앗아갈 때는 성스럽게 존중하는 마음을 품어야 할까요?\""
 ecumenical_council_events.0010.a_1: "이것이 [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)](을)를 대체하리라."
 ecumenical_council_events.0010.a_2: "[current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)](을)를 제거해 자리를 마련하지."
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)](을)를 보내주어야만 한다."
 ecumenical_council_events.0010.b: "실천을 금지하라!"
 ecumenical_council_events.0010.c: "지금은 이 교파의 준수를 용인하겠다."
 ecumenical_council_events.0010.d: "일단 이 원리를 인지해 두도록 하자."
 ecumenical_council_events.0011.t: "$ecumenical_council_events.0010.t$"
 ecumenical_council_events.0011.desc.intro: "$ecumenical_council_events.0010.desc.intro$"
 ecumenical_council_events.0011.desc.outro: "주최자인 [host.GetTitledFirstName](이)가 선언했다.\n\n\"다음을 제안하겠소. [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )](을)를"
 ecumenical_council_events.0011.desc.permit: "허용합시다.\""
 ecumenical_council_events.0011.desc.prohibit: "금지합시다.\""
 ecumenical_council_events.0011.desc.learn: "인지합시다.\""
 ecumenical_council_events.0011.desc.make_core: "[core_tenet_to_swap.GetName( ROOT.GetCharacter.GetRite )] 대신 핵심이 되는 교파로 채택합시다.\""
 ecumenical_council_events.0011.a: "변화에 투표하겠다."
