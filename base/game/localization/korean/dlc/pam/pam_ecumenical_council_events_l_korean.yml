 # Flavor Events
 ecumenical_council_summons_events.0001.t: "[guest_1.GetTitleAsNameNoTooltip|U]의 걱정"
 ecumenical_council_summons_events.0001.desc: "\"그 문제 말입니다... [guest_1.GetFaith.HighGodName]께 맹세코, 진이 다 빠집니다. 잠도 안 오고...\" [guest_1.GetTitledFirstName](이)가 [guest_2.GetTitledFirstName]에게 고통스럽게 속삭이며 털어놓았다.\n\n\"이해합니다...\" [guest_2.GetFirstNameNoTooltip](이)가 고개를 끄덕였다. \"혹시 주최자인 [host.GetTitleAsNameNoTooltip]에게 얘기한다면, 영적으로 도움이 될 만한 조언을 해 주지 않겠습니까?\""
 ecumenical_council_summons_events.0001.a: "[guest_1.GetHerHim]의 걱정거리가 대체 무엇이기에..."
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "[guest_1.GetShortUINamePossessive] 비밀을 알게 됨"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip](은)는 그냥 다정한 위로가 필요한 거다."
 ecumenical_council_summons_events.0001.c: "모르는 편이 낫다."
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U](이)가 보편 공의회에서 [TARGET_CHARACTER.GetShortUINamePossessive] 비밀에 관해 [TARGET_CHARACTER.GetShortUIName](을)를 위로함"
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U](이)가 보편 공의회에서 [CHARACTER.GetShortUINamePossessive] 비밀에 관해 [CHARACTER.GetShortUIName](을)를 위로함"
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUIName|U](이)가 공의회에서 [TARGET_CHARACTER.GetShortUINamePossessive] 비밀을 엿들으려다 발각됨"
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U](이)가 공의회에서 자신의 비밀을 엿들으려던 [TARGET_CHARACTER.GetShortUIName](을)를 발견함"
 ecumenical_council_summons_events.0010.t: "비밀"
 ecumenical_council_summons_events.0010.desc: "우리의 주최자인 [host.GetTitledFirstName](은)는 시종의 도움을 받아 제의를 정리하느라 내가 다가오는 것도 눈치채지 못했다.\n\n\"[host.GetFaith.HighGodName]께서 용서하시기를...\" [host.GetSheHe]가 중얼거렸다. \"내... 성향에 대한 소문이 돌고 있네. 그리스도의 대리자인 내가, 그런 데 탐닉한다는 이야기가 돌다니! 이런 소문이 절대 내 추기경들의 귀에 들어가서는 안 되는데.\""
 ecumenical_council_summons_events.0010.a: "\"회개하고 계시는군요, [host.GetTitleAsNameNoTooltip].\""
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "[host.GetShortUINamePossessive] 비밀을 알게 됨"
 ecumenical_council_summons_events.0010.b: "\"[ROOT.Char.Custom('RandomBibleQuoteShort')]\""
 ecumenical_council_summons_events.0010.b.flavor: "[host.GetSheHe|U]는 성서에서 위안을 얻을 수 있을 것이다!"
 ecumenical_council_summons_events.0010.c: "어떤 일은 모르는 채 넘어가는 게 나을 때도 있지."
 ecumenical_council_summons_events.0020.t: "물류 문제"
 ecumenical_council_summons_events.0020.desc.intro: "\"그래야 한다면야...\" [host.GetTitledFirstName](이)가 손짓으로 사제 한 명을 내보냈다.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" [host.GetSheHe|U]가 나를 불렀다."
 ecumenical_council_summons_events.0020.desc.caravans: "\"우리의 저장품을 운송하는 상단이 아직 도착하지 않았다고 하는군."
 ecumenical_council_summons_events.0020.desc.servants: "\"시종의 수가 부족해 모든 문객을 감당할 수가 없다고 하는군."
 ecumenical_council_summons_events.0020.desc.overcrowded: "\"공의회를 위해 [ROOT.Char.GetCurrentLocation.GetName]에서 숙소를 마련했는데, 문객의 수가 너무 많아 숙소가 부족하다고 하는군."
 ecumenical_council_summons_events.0020.desc.outro: "혹시 이 상황을 해결할 만한 방법이 없겠는가?\""
 ecumenical_council_summons_events.0020.aaa: "\"제 토지가 있습니다, 성하. 제가 해결하겠습니다.\""
 ecumenical_council_summons_events.0020.aa: "마침 나한테 호의를 빚진 사람이 #EMP 많이#! 있는데..."
 ecumenical_council_summons_events.0020.a: "\"황금으로 해결 못 할 문제는 없습니다, 성하!\""
 ecumenical_council_summons_events.0020.b: "\"제 인맥을 모두 동원하겠습니다!\""
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName](이)가 날 유력한 후보로 기억하겠지..."
 ecumenical_council_summons_events.0020.c: "드릴 수 있는 건 기도뿐..."
 ecumenical_council_summons_events.0020.papabile_tt: "교황 승계에 대한 당신의 [papabile_score|E]가 #P +10#! 증가함"
 ecumenical_council_summons_events.0030.t: "폭풍우의 자비"
 ecumenical_council_summons_events.0030.desc.intro: "공의회 날짜가 다가오는 가운데, 바람이 울부짖으며 빗줄기가 거칠게 도로를 휩쓸었다."
 ecumenical_council_summons_events.0030.desc.dry_season: "이맘때에는 보기 드문 일이었다."
 ecumenical_council_summons_events.0030.desc.wet_season: "이맘때에는 이런 궂은 날씨가 찾아오기 마련이다."
 ecumenical_council_summons_events.0030.desc.outro: "내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName](이)가 주체할 수 없을 정도로 몸을 떨고 있었다.\n\n\"주군... 죄송하지만 저는 이번 공의회 참석이 어려울 듯합니다. 폭풍우에, 날이 이렇게 춥다니... 제 몸에 좋지 않은 날씨입니다. 가래가 너무 많이 껴서...\""
 ecumenical_council_summons_events.0030.aa: "\"내 이런 증상에 관한 내용을 #EMP 많이#! 읽었다네!\""
 ecumenical_council_summons_events.0030.a: "최고의 의사를 불러야겠군!"
 ecumenical_council_summons_events.0030.b: "\"내 기도에 그대를 넣어 주겠네.\""
 ecumenical_council_summons_events.0030.c: "삶은 알아서 흘러가는 법."
 ecumenical_council_summons_events.0040.t: "무대 공포증"
 ecumenical_council_summons_events.0040.desc: "공의회가 다가오는 가운데, 내 [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName](이)가 초조하게 안뜰을 서성이고 있었다.\n\n\"[ROOT.Char.GetFaith.ReligiousSymbol]의 문제도 있지, 그래, 맞아... 그리고 [chaplain.CustomFixedRandom('random_learning_topic')]에 대한 건 또 어떡한담...?\" [chaplain.GetHerHim]가 혼잣말하는 소리가 들려왔다."
 ecumenical_council_summons_events.0040.aa: "\"[ROOT.Char.GetFaith.KnowledgeGodName](을)를 명심하게, [chaplain.GetFirstNameNoTooltip].\""
 ecumenical_council_summons_events.0040.aa.flavor: "영적인 인도를 해준다면 안심할 수 있겠지."
