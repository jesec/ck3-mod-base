 ecumenical_council_events.0118.t: "머나먼 교구의 전통"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetCulture.GetNameNoTooltip] 출신이자 공의회의 유망한 일원인 [lead_conservative.GetTitledFirstName](이)가 교회의 전통을 지키고자 멀리 여행했던 다른 성직자들과 함께 섰다.\n\n\"[lead_conservative.GetFaith.GetAdjective] 세상은 [lead_conservative.GetFaith.HighGodName]의 사랑만큼이나 넓습니다.\" [lead_conservative.GetSheHe]가 말했다. \"이번 순례가 그저 교부의 업적을 원상태로 되돌려야 한다는 [lead_innovator.GetTitledFirstName]의 설교를 듣는 것으로 끝나진 않았으면 좋겠군요.\""
 ecumenical_council_events.0118.support: "순례가 고될수록 드높은 계시를 얻는 법."
 ecumenical_council_events.0118.support_duel: "저들에게 [lead_innovator.GetFirstNamePossessiveNoTooltip] 계획을 설명해 안심시킨다."
 ecumenical_council_events.0118.support_duel.success: "저들이 교부의 전통은 안전하다는 사실을 받아들임"
 ecumenical_council_events.0118.support_duel.success_halved: "몇몇 이가 교부의 전통은 안전하다는 사실을 받아들임"
 ecumenical_council_events.0118.support_duel.failure: "저들이 여전히 [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 설교를 염려함"
 ecumenical_council_events.0118.oppose: "\"우리 모두 그대의 희생을 기리겠소.\""
 ecumenical_council_events.0118.oppose_duel: "\"[lead_innovator.GetTitledFirstNameNoTooltip]에 맞서 설교하겠소.\""
