 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetNameNoTooltip] 감수성"
 ecumenical_council_events.0105.desc: "이곳에서 들리는 수많은 말소리 중에서도 [ROOT.Char.GetCulture.GetLanguage.GetName]의 익숙한 소리가 귀를 사로잡았다. 당연하게도 우리 친족을 졸라대는 [lead_conservative.GetTitledFirstName]의 소리였다.\n\n\"우리 [lead_conservative.GetCulture.GetCollectiveNounNoTooltip](은)는 저런 혁신을 선호하지 않잖습니까!\" [lead_conservative.GetSheHe]가 격분했다.\n\n\"근데 교회가 가만히 있는다고 해서 우리 탓을 할 겁니까?\" [lead_innovator.GetTitledFirstName](이)가 이의를 제기했다."
 ecumenical_council_events.0105.support: "[lead_conservative.GetFirstNameNoTooltip], 그대의 의견이 우리 모두를 대변하지는 않는다."
