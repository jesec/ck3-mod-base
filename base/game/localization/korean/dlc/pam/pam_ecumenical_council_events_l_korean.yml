 ecumenical_council_events.0122.t: "아직 할 수 있는 한"
 ecumenical_council_events.0122.desc: "병약한 사제 몇몇이 혼잡한 회당에서 멀리 떨어진 곳에 앉아, 따스한 햇볕을 쬐고 있었다.\n\n\"[lead_conservative.GetFaith.HighGodName](을)를 만나고... 끔찍한 악취가 진동하는 [lead_conservative.GetFaith.NegativeAfterLife](으)로 떨어지기 전에 과연 이 공의회의 마무리를 볼 수 있을지 모르겠군요.\" [lead_conservative.GetTitledFirstName](이)가 쌕쌕거리는 소리를 내며 말했다.\n\n\"[lead_conservative.GetFirstNameNoTooltip], 그대는 잃을 게 별로 없지 않습니까. 그래도 세상에 희망을 남겨 두고 싶지 않으신가요? 그래야 축복 속에 [lead_innovator.GetFaith.PositiveAfterLife](으)로 갈 수 있지 않겠습니까.\" [lead_innovator.GetTitledFirstName](이)가 대답했다."
 ecumenical_council_events.0122.support: "\"이 마지막 순간이야말로 귀중한 것이니!\""
 ecumenical_council_events.0122.support_duel: "나는 침묵을 지킨 채로 [ROOT.Char.GetFaith.HighGodName](을)를 만날 생각은 없다."
 ecumenical_council_events.0122.support_duel.success: "저들이 고무되어 마지막으로 개혁에 나섬"
 ecumenical_council_events.0122.support_duel.success_halved: "몇몇 이가 고무되어 마지막으로 개혁에 나섬"
 ecumenical_council_events.0122.support_duel.failure: "저들이 씁쓸한 마음으로 쇠약해지게 됨"
 ecumenical_council_events.0122.oppose: "우리의 남은 힘은 [ROOT.Char.GetFaith.HighGodName](와)과 [ROOT.Char.GetFaith.HighGodHerHis|U] 말씀에 바친다."
 ecumenical_council_events.0122.oppose_duel: "\"이런 일로 우리 인생을 더럽히지 맙시다!\""
 ecumenical_council_events.0122.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 무리가 뜻을 굽힘"
