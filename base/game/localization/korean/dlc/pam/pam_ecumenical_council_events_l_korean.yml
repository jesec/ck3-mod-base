 ecumenical_council_events.0114.t: "믿음과 강철의 무장"
 ecumenical_council_events.0114.desc.intro: "전쟁을 겪은 사람이라면 으레 그러하겠지만, 우리 중에서 전사였던 이들도 자기들끼리 모여 시간을 보내고 있었다.\n\n\"이 변화가 받아들여지면 참 좋을 텐데 말입니다. 독신자들이 다시 한번 하나의 깃발 아래 모일 수 있잖습니까!\" [lead_innovator.GetTitledFirstName](이)가 말했다.\n\n"
 ecumenical_council_events.0114.desc.conservative: "\"우린 수많은 [ec_hostile_faith.GetAdherentName](을)를 물리쳤지요.\" [lead_conservative.GetTitledFirstName](이)가 말했다. \"[lead_conservative.GetFaith.WarGodName]께서 이미 우리 깃발에 축복을 내리지 않으셨습니까?\""
 ecumenical_council_events.0114.desc.conservative_generic: "\"우린 수많은 적을 물리쳤지요.\" [lead_conservative.GetTitledFirstName](이)가 말했다. \"[lead_conservative.GetFaith.WarGodName]께서 이미 우리 깃발에 축복을 내리지 않으셨습니까?\""
 ecumenical_council_events.0114.support: "축복받은 새 깃발을 높이 들어 올리자."
 ecumenical_council_events.0114.support_duel: "두려워하는 자들을 [ROOT.Char.GetFaith.HighGodNamePossessive] 축복받은 깃발 아래 영입하자!"
 ecumenical_council_events.0114.support_duel.success: "병사라면 복무해야 하는 법"
 ecumenical_council_events.0114.support_duel.success_halved: "몇몇 이가 영입됨"
 ecumenical_council_events.0114.support_duel.failure: "저들이 고집스럽게 입장을 지킴"
 ecumenical_council_events.0114.oppose: "정설의 수호자인 [lead_conservative.GetTitledFirstNameNoTooltip](을)를 지지한다."
 ecumenical_council_events.0114.oppose_duel: "말로 결투를 벌이도록 하지!"
 ecumenical_council_events.0114.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 지지자들이 뜻을 굽힘"
 ecumenical_council_events.0114.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 지지자 중 몇몇이 뜻을 굽힘"
