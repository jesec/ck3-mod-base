 ecumenical_council_events.0106.t: "빚진 충성"
 ecumenical_council_events.0106.desc: "봉신들과 나는 어느 방에 모였다.\n\n\"여기서도 주군이 곧 주인입니다.\" [lead_conservative.GetTitledFirstName](이)가 다른 이들에게 주의를 주었다. \"우리의 [ROOT.Char.GetTitleAsName]께서 이런 이단적인 혁신에 찬성의 목소리를 내지 않으신다면, 여러분의 목소리 또한 침묵을 지켜야 합니다.\"\n\n\"다른 곳이라면 [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] 권한이 우리를 통제하지만, 여기서는 그렇지 않습니다!\" [lead_innovator.GetTitledFirstName](이)가 쏘아붙였다."
 ecumenical_council_events.0106.desc_innovator: "봉신들과 나는 어느 방에 모였다.\n\n\"주군께서는 답을 들으셔야 마땅합니다.\" [lead_conservative.GetTitledFirstName](이)가 말했다. \"안타깝지만, 이번 사안은 그분의 소관이 아닐 것 같습니다. 우리의 마음은 오직 [lead_conservative.GetFaith.HighGodName]께서 이끄시며, 우리가 틀림없이 지켜내야 하는 선을 정해 주시는 것도 오직 [lead_conservative.GetFaith.HighGodName]뿐입니다!\"\n\n\"아, 그렇지만 [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] 뜻은 [ROOT.Char.GetFaith.HighGodNamePossessive] 의지를 거스르려는 것이 아니잖습니까.\" [lead_innovator.GetTitledFirstName](이)가 대꾸했다. \"각자가 맺은 맹세를 떠올리시고, [ROOT.Char.GetHerHis] 지혜에 귀를 기울이십시오!\""
 ecumenical_council_events.0106.support: "\"나는 [ROOT.Char.GetTitleAsNameNoTooltip](으)로서 [ROOT.Char.GetFaith.HighGodName]의 대리인이다.\""
 ecumenical_council_events.0106.support_duel: "봉신들에게 맹세한 대로 충성하기를 요구한다."
 ecumenical_council_events.0106.support_duel.success: "저들이 당신에게 복종하게 됨"
 ecumenical_council_events.0106.support_duel.success_halved: "몇몇 이가 당신에게 복종하게 됨"
 ecumenical_council_events.0106.support_duel.failure: "당신의 봉신들이 [lead_conservative.GetFaith.HighGodName](을)를 향해 충성을 바침"
 ecumenical_council_events.0106.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip](을)를 지지한다. 이는 주군의 소관을 넘어서는 일이다."
 ecumenical_council_events.0106.oppose_duel: "영주의 소망이 신을 거스르지 않는다는 사실에 이의를 제기한다."
