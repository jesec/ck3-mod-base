 ecumenical_council_events.0103.t: "변화의 대가"
 ecumenical_council_events.0103.desc: "\"그 비타협적인 태도 때문에 우리 다 망할 겁니다!\" [lead_innovator.GetTitledFirstName](이)가 외쳤다.\n\n\"[lead_conservative.GetPrimaryTitle.GetNameNoTooltip]의 독신자라면 [lead_conservative.Custom('GetFaithTemple')](을)를 복원하는 후원자에게 감사한 마음을 가질 텐데 말이지요.\" [lead_conservative.GetTitledFirstName](이)가 말했다."
