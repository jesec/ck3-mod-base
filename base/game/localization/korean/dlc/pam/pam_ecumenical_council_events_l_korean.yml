 ecumenical_council_events.0113.t: "무장한 신앙"
 ecumenical_council_events.0113.desc: "다른 신앙의 사악한 전사들에게 고통받는 봉역을 소유한 이들이 서로에게 공감하며 회의장 저편에 모여들었다.\n\n\"신앙의 적이 제 들판을 불태우고 있습니다.\" [lead_conservative.GetTitledFirstName](이)가 말했다. \"지금은 검에 우리 심장이 꿰뚫리고 있지는 않지만, 어리석은 몽상을 두고 다투기나 하는 이 상황이 옳을까요?\"\n\n\"균열이 생긴 신념은 쪼개진 방패나 다름없습니다.\" [lead_innovator.GetTitledFirstName](이)가 답했다. \"정경을 확립하고, 새롭게 하나가 되어 같이 싸웁시다!\""
 ecumenical_council_events.0113.support: "희망을 다시 맛볼 수 있다면 좋겠군."
 ecumenical_council_events.0113.support_duel: "우리의 방패인 교회를 수습하자!"
 ecumenical_council_events.0113.support_duel.success: "저들이 받아들였으며, 우리는 하나가 되어 싸움"
 ecumenical_council_events.0113.support_duel.success_halved: "몇몇 이가 마음을 돌려 개혁을 지지함"
 ecumenical_council_events.0113.support_duel.failure: "저들이 희망을 떠올리지 못함"
 ecumenical_council_events.0113.oppose: "이 어리석은 일보다 더 시급한 사안이 있지 않은가?"
 ecumenical_council_events.0113.oppose_duel: "이 무모함에 관해 경고한다."
