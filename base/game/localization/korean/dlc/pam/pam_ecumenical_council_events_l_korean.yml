 ecumenical_council_events.0116.t: "이건 누가 냅니까?"
 ecumenical_council_events.0116.desc: "여러 교구의 관리자들이 양피지 하나를 둘러싼 채, 회당이 무슨 회계소라도 되는 듯 수치를 두고 논쟁을 벌이고 있었다.\n\n\"격변이 또 일어나면 내 교구에서 감당 못 합니다.\" [lead_conservative.GetTitledFirstName](이)가 말했다. \"교구민들을 위한 새 경전이 필요하지요. 모든 마을 [lead_conservative.GetFaith.HouseOfWorship]에 기수가 파견되어야 하고요. 이번 제안이 통과되면 십일조로는 턱없이 부족할 겁니다.\"\n\n\"제안이 통과하지 못하면 어떻게 되겠습니까?\" [lead_innovator.GetTitledFirstName](이)가 질문했다. \"옥신각신하느라 벌써 몇 년이 흘렀습니다. 은화라면 어떻게든 사라지기 마련이고요. 그러니 남은 돈은 신자들이 지킬 법을 만드는 데 쓰는 편이 좋겠지요.\""
 ecumenical_council_events.0116.support: "그래, 이미 써 버린 은화를 두고 슬퍼해서 무엇 하겠나?"
 ecumenical_council_events.0116.support_duel: "지지가 곧 투자라고 주장한다!"
 ecumenical_council_events.0116.support_duel.success: "저들이 개혁에 유혹당함"
 ecumenical_council_events.0116.support_duel.success_halved: "몇몇 이가 이 제안을 받아들임"
 ecumenical_council_events.0116.support_duel.failure: "저들이 여전히 비용을 두고 불평함"
 ecumenical_council_events.0116.oppose: "내 교구는 이런 격변을 감당할 수 없다."
 ecumenical_council_events.0116.oppose_duel: "\"이는 재정상 무책임한 일이오!\""
 ecumenical_council_events.0116.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 무리가 주장을 철회함"
