 ecumenical_council_events.0104.t: "혈연 성직자"
 ecumenical_council_events.0104.desc: "내 친족 성직자들이 [ROOT.Char.GetHouse.GetName] 집안은 어디에 무게를 두어야 하는지를 두고 토론했다. [lead_conservative.GetTitledFirstName](이)가 말했다. \"우리 집안이 공개적으로 분열하면 안 됩니다. 그리고 전 [host.GetTitledFirstName](와)과 뜻을 같이할 생각이 없습니다!\"\n\n[lead_innovator.GetTitledFirstName](은)는 [lead_conservative.GetTitledFirstNamePossessiveNoTooltip] 뒤에 대고 조롱하는 손짓을 했다. 우리 집안의 모든 일원이 혁신을 반대하진 않는 모양이었다."
