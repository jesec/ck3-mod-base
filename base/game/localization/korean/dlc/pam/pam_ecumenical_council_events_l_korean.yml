 ecumenical_council_events.0129.t: "회당에 퍼진 공포"
 ecumenical_council_events.0129.desc: "내 앞에만 서도 벌벌 떠는 이들이 떠 놓은 크림 덩어리처럼 흔들리는 눈으로 토론을 지켜보았다. 그중에서도 가장 지위가 낮은 [lead_conservative.GetTitledFirstName](은)는 나와 시선도 마주치지 못할 것이다.\n\n\"그대의 의견을 말하지 그러십니까.\" [lead_conservative.GetSheHe]가 속삭였다. \"거절하면 어떻게 되는지, 저야 이미 잘 아니까요.\""
