 ecumenical_council_events.0120.t: "연대기 속 이름"
 ecumenical_council_events.0120.desc: "명성이 드높은 문객 중 몇몇은 회의장에서 한 발 물러나, 이 모든 것이 기록으로 남으면 자신의 평판이 어떻게 될지를 저울질하고 있었다.\n\n\"제 이름은 최근에 기록된 모든 연대기에 남아 있습니다. 그러니 영원히 조롱받을지도 모르는 칙령에 굳이 얽매여야 할 필요가 있을까요?\" [lead_conservative.GetTitledFirstName](이)가 말했다.\n\n\"사람들은 손을 더럽히지 않은 자가 아니라, 다툼을 정리한 자를 기억하기 마련이지요. 그러니 전 기억에 남게 될 겁니다.\" [lead_innovator.GetTitledFirstName](이)가 대답했다."
 ecumenical_council_events.0120.support: "\"우리는 교회의 지도자들 아닙니까?\""
 ecumenical_council_events.0120.support_duel: "\"그대는 혼자가 아닐 거요!\""
 ecumenical_council_events.0120.support_duel.success: "의심하는 이들이 역사의 흐름을 따르기로 함"
 ecumenical_council_events.0120.support_duel.success_halved: "몇몇 이가 역사의 흐름을 따르기로 함"
 ecumenical_council_events.0120.support_duel.failure: "저들이 계속 교묘히 빠져나감"
 ecumenical_council_events.0120.oppose: "내 이름을 웃음거리로 남길 생각은 없다."
 ecumenical_council_events.0120.oppose_duel: "\"어리석은 자는 헛소리를 강요해 다툼을 정리하지.\""
 ecumenical_council_events.0120.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 무리가 뜻을 굽힘"
 ecumenical_council_events.0120.oppose_duel.success_halved: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 무리 중 몇몇이 뜻을 굽힘"
