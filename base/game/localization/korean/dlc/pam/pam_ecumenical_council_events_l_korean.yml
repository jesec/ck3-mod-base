 ecumenical_council_events.0101.t: "깨우친 연설"
 ecumenical_council_events.0101.desc: "학자들이 회당을 가로질러 인용을 주고받았다. 구문이 오갈 때마다 분쟁도 날카로워졌다.\n\n\"[lead_conservative.GetFaith.ReligiousText|U]에서 명확히 하고 있습니다.\" [lead_conservative.GetTitledFirstName](이)가 주장했다. \"[ec_current_topic.GetName( activity.GetHost.GetRite )](은)는 바뀌지 않아야 합니다.\"\n\n\"제가 인용한 구문을 전부 다 읽어 보시지요.\" [lead_innovator.GetTitledFirstName](이)가 답했다. \"사실상 이 변화를 주장하는 내용입니다!\""
 ecumenical_council_events.0101.support: "구문에서 빠져 있는 맥락을 지적한다."
 ecumenical_council_events.0101.support_duel: "더 깊은 학문으로 상대의 주장을 압도한다."
 ecumenical_council_events.0101.support_duel.success: "저들이 글에서 비롯된 변화를 받아들임"
 ecumenical_council_events.0101.support_duel.success_halved: "몇몇 이가 글에서 비롯된 변화를 받아들임"
 ecumenical_council_events.0101.support_duel.failure: "저들이 그래도 해당 글에서는 반대하고 있다고 주장함"
 ecumenical_council_events.0101.oppose: "[lead_conservative.GetTitledFirstNameNoTooltip](을)를 지지한다. 글에 따르면 변하지 말아야 한다."
 ecumenical_council_events.0101.oppose_duel: "해당 구문에서 변화가 비롯되었다는 사실에 이의를 제기한다."
