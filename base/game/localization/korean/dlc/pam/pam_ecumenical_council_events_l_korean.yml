 ecumenical_council_events.0115.t: "속삭임과 영향력"
 ecumenical_council_events.0115.desc: "인정하자니 마음이 쓰리지만, 모든 성직자가 고결한 방식으로 제의를 획득한 것은 아니다. 지금 이 위엄 있는 모임에서도 성서의 신성한 빛보다 그림자를 더 선호하는 이가 누군지를 예리하게 인지해 두어야 한다. 얼마 지나지 않아, 어둠 속에서 속삭이는 소리가 들려왔다.\n\n\"이곳의 모든 영혼은... 무언가에 굶주려 있습니다. 우리처럼 현명한 이는 과연 누가 그 굶주림의 대가를 치를지 고심해 보아야 합니다.\" [lead_conservative.GetTitledFirstName](이)가 귀를 기울이는 자에게 말하고 있었다. \"뻔뻔한 이념, 열정에 휩쓸린 개혁… 그보다 더 큰 대가를 치르는 것도 없지요...\"\n\n또다른 독사인 [lead_innovator.GetTitledFirstName](이)가 맞서 일어났다. \"혼돈의 대가를 치르는 자가 #EMP 그대#!일 것 같습니까? 혼란의 시기가 다가오면, 우리는 과연 언제쯤 바라는 대로 자유롭게 뛰어다닐 수 있게 될까요...?\""
 ecumenical_council_events.0115.support: "분란에도 쓸모가 있는 법."
 ecumenical_council_events.0115.support_duel: "귀를 기울이는 영리한 자들에게 기회에 관해 말한다."
 ecumenical_council_events.0115.support_duel.success: "저들이 탐욕에 이끌려 당신의 말을 들음"
 ecumenical_council_events.0115.support_duel.success_halved: "몇몇 이가 분란을 추구함"
 ecumenical_council_events.0115.support_duel.failure: "저들이 기회를 보지 못함"
 ecumenical_council_events.0115.oppose: "우리 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]들은 약간의 음식만 맛본 뒤, 영원히 굶주리게 된다."
 ecumenical_council_events.0115.oppose_duel: "성서에서 진리를 찾지 않으면 길을 잃는다."
