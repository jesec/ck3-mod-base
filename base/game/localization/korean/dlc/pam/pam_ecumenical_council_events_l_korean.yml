 ecumenical_council_events.0126.t: "경쟁자 사이"
 ecumenical_council_events.0126.desc: "의회에서 내 [ROOT.Char.Custom2('RelationToMe', rival)]인 [rival.GetTitledFirstName](을)를 찾아낸 것 자체가 시련이었다.\n\n\"내가 왜 여기 있는지는 잘 알 거요.\" [rival.GetSheHe]가 으르렁거리듯 말했다. \"할 말이 있으면 하고, 얼마든지 편을 골라 보시지... 난 반대표를 던질 순간만 기다리고 있으니.\""
 ecumenical_council_events.0126.a: "그대의 증오가 아니라 양심을 따라 투표하시오."
 ecumenical_council_events.0126.b: "악의는 혼자 간직하시오. 거기 말려들 생각은 없으니."
 ecumenical_council_events.0126.c: "[rival.GetHerHim]가 공의회에 정신을 팔고 있군..."
