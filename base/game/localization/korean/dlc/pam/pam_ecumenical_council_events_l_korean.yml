 ecumenical_council_events.0108.t: "친구들 사이"
 ecumenical_council_events.0108.desc: "의회 사이에서 내 [ROOT.Char.Custom2('RelationToMe', friend)]인 [friend.GetTitledFirstName]의 모습이 보이자 마음이 놓였다.\n\n\"그대라면 내 생각을 잘 알 겁니다.\" [friend.GetSheHe]가 말했다. \"말만 하시면 따르겠습니다.\""
 ecumenical_council_events.0108.a: "나와 함께 하지, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b: "그대의 신념을 지켜도 좋네."
 ecumenical_council_events.0108.conservatives_custom: "당신의 [friends|E] 중 [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.innovators_custom: "당신의 [friends|E] 중 [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.t: "고요한 불만"
 ecumenical_council_events.0109.desc: "회의장 멀리에서 작은 의회가 진행되는 모양이었다. 내가 없는 곳에서 신앙을 다시 개편하려 하다니, 대체 누구일까?\n\n\"이 사안이 논의의 대상이라면, 나머지 사안이라고 심판대에 오르지 말라는 법이 있겠습니까?\" [lead_conservative.GetTitledFirstName](이)가 경고했다. \"저는 저 문을 열어 [lead_conservative.GetFaith.HighGodName]의 집에 불확실성을 불러들일 생각이 없습니다.\"\n\n\"더는 우리에게 도움이 되지 않는 전통을 떨쳐내고 싶은 생각은 없으십니까?\" [lead_innovator.GetTitledFirstName](이)가 대꾸했다."
 ecumenical_council_events.0109.support: "공감하는 사람만 있어 주면 되겠지."
 ecumenical_council_events.0109.support_duel: "신중한 이들마저 귀를 기울이게 할 방법이 있지..."
 ecumenical_council_events.0109.support_duel.success: "저들이 방해하지 않을 것임"
