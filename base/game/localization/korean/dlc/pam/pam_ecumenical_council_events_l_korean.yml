 ecumenical_council_events.0110.t: "치솟는 야심"
 ecumenical_council_events.0110.desc: "\"그냥 사소한 개정 사항일 뿐입니다!\" [lead_innovator.GetTitledFirstName](이)가 말했다. \"이를 추진하는 데 힘을 보태면, 우리도 [lead_innovator.GetFaith.ReligiousHeadName]의 후보로서 유력한 입지에 서게 되는 겁니다.\"\n\n\"그대의 야심이 한계를 모르고 치솟는군. 그 야심이 우리 모두의 파멸을 불러올 거요.\" [lead_conservative.GetTitledFirstName](이)가 비웃었다."
 ecumenical_council_events.0110.support: "약간의 야심도 나름대로 쓸모가 있는 법."
 ecumenical_council_events.0110.support_duel: "발전의 필요성을 더 강하게 주장한다!"
 ecumenical_council_events.0110.support_duel.success: "저들이 사소한 개정에 불과하다는 점을 받아들임"
 ecumenical_council_events.0110.support_duel.success_halved: "몇몇 이가 지지에 따르는 장점을 받아들임"
 ecumenical_council_events.0110.support_duel.failure: "당신의 탐욕이 명백하게 드러남"
 ecumenical_council_events.0110.oppose: "교만이 추락을 부르는 법."
 ecumenical_council_events.0110.oppose_duel: "야심의 사악함에 대해 경고한다!"
