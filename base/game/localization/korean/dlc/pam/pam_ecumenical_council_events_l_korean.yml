 ecumenical_council_events.0102.t: "경쟁하는 기도"
 ecumenical_council_events.0102.desc: "참석자 중에서도 가장 독실한 이들이 제시된 주제 앞에서 두 개의 기도 모임으로 갈라졌다.\n\n[lead_innovator.GetTitledFirstName](은)는 [lead_innovator.GetFaith.HighGodName]에게 자신들의 계시가 신의 의지를 반영하는 것임을 확언해 달라는 기도를 올렸다. [lead_conservative.GetTitledFirstNamePossessive] 모임이 즉시 반박하며, 오래도록 교회를 섬겨 왔던 전통을 유지하게 해 달라고 [lead_innovator.GetFaith.random_GoodGodNames]에게 간청하기 시작했다."
