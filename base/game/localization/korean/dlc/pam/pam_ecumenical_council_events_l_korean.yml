 ecumenical_council_events.0080.desc.passed: "투표가 집계되었다. [lead_portrait.GetTitledFirstName](이)가 앞으로 나섰다.\n\n\"성령께서 공의회 내내 우리를 인도하셨으며, 결정이 내려졌습니다. 결과는 이 사안에 찬성하는 것으로 정해졌습니다!\""
 ecumenical_council_events.0080.desc.failed: "투표가 집계되었다. [lead_portrait.GetTitledFirstName](이)가 앞으로 나섰다.\n\n\"성령께서 공의회 내내 우리를 인도하셨으며, 결정이 내려졌습니다. 제안은 채택되지 못했습니다. [host.GetFaith.GetName](은)는 지금의 방식을 유지합니다.\""
