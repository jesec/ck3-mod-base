 ecumenical_council_events.0123.t: "전쟁이 곧 닥치거든"
 ecumenical_council_events.0123.desc: "동료들이 전장에서 대치하는 부대처럼 다투고 있었다. 이는 불길한 징조였다.\n\n\"우리의 공동 관심사는 딱 하나뿐입니다, 망할! 무슨 기르는 동물 다루듯 투표하라고 하지 마십시오. 사람을 [ROOT.Char.GetTitledFirstName]의 목줄에 묶여서 으르렁대는 사냥개로 보는 것도 아니고!\" [lead_conservative.GetTitledFirstName](이)가 쏘아붙였다.\n\n\"[ROOT.Char.GetPrimaryTitle.GetNameNoTier]에 맹세한 바가 있는데, 단순한 말로도 그 맹세를 지키지 않겠다면 그런 동료를 대체 어떻게 받아들여야 한단 말입니까?\" [lead_innovator.GetTitledFirstName](이)가 응수했다."
 ecumenical_council_events.0123.support: "\"그래, 모든 충성을 요구해야겠군.\""
 ecumenical_council_events.0123.support_duel: "이는 불명예로 간주할 수 있다고 경고한다."
 ecumenical_council_events.0123.support_duel.success: "동료들이 당신과 함께하게 됨"
 ecumenical_council_events.0123.support_duel.success_halved: "몇몇 동료가 당신과 함께하게 됨"
 ecumenical_council_events.0123.support_duel.failure: "동료들을 협박하지 못함"
 ecumenical_council_events.0123.oppose: "\"여기서는 오직 성서에 충성을 바쳐야 한다.\""
 ecumenical_council_events.0123.oppose_duel: "충성을 요구하겠다... [lead_innovator.GetFirstNameNoTooltip](와)과 같은 동료에게서."
