 ecumenical_council_events.0064.desc.doctrine_clerical_function_description: "\"이제 성직자들이 사람들 사이에서 어떤 주요한 사역을 해야 할지 논의해야 합니다. 질서를 지킬까요, 빈자에게 음식을 제공할까요, 아니면 성전을 위한 병사를 모집할까요?\""
