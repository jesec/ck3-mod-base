 ecumenical_council_events.0040.t: "공의회 종료"
 ecumenical_council_events.0040.desc: "고된 과정 끝에 공의회가 종료되었다."
 ecumenical_council_events.0040.desc.change: "[ROOT.Char.GetFaith.GetName](은)는 내 인도를 따라 그 토대를 바꾸었다. 이제 이 축복받은 소식을 대중에 포교해야 한다!"
 ecumenical_council_events.0040.desc.status_quo: "내가 제안한 변화 중에서 그 무엇도 채택되지 못했다. [ROOT.Char.GetFaith.GetName](은)는 지금의 방식을 유지하게 되었다."
 ecumenical_council_events.0040.a: "이제 집에 갈 시간이군."
