 ecumenical_council_events.0112.t: "봉역의 질병"
 ecumenical_council_events.0112.desc: "\"제 땅에 죽은 자들이 산처럼 쌓였습니다! 어찌하여 [lead_conservative.GetFaith.HighGodNamePossessive] 벌이 내렸는지는 모르겠지만, 지금은... 너무도 명백하지 않습니까! 세상이 교회법의 변형을 거부하니 인류가 고통받는 겁니다.\" [lead_conservative.GetTitledFirstName](이)가 말했다.\n\n\"이 공의회에 대한 증오에 눈이 머신 모양이군요, 구원이 눈앞에 있는데도 보지 못하다니!\" [lead_innovator.GetTitledFirstName](이)가 받아쳤다. \"우리의 개혁이 [lead_innovator.GetFaith.HighGodName]의 분노를 가라앉힐 겁니다!\""
 ecumenical_council_events.0112.support: "그렇다. [ROOT.Char.GetFaith.HighGodName|U]께서는 교회의 변화를 요구하신다."
 ecumenical_council_events.0112.support_duel: "저 충직한 자의 논리를 역이용하면 먹힐 수도 있겠군!"
 ecumenical_council_events.0112.support_duel.success: "많은 이가 신의 진노가 끝날 것이라 봄"
 ecumenical_council_events.0112.support_duel.success_halved: "몇몇 이가 [lead_innovator.GetFaith.HighGodName](을)를 달래려 할 것임"
 ecumenical_council_events.0112.support_duel.failure: "교회법의 파괴에는 너무도 큰 위험이 따름"
 ecumenical_council_events.0112.oppose: "[ROOT.Char.GetFaith.HighGodName]의 화를 더 돋우기나 하겠지!"
 ecumenical_council_events.0112.oppose_duel: "이에 따라 교회법이 파괴될 수 있다고 경고한다."
 ecumenical_council_events.0112.oppose_duel.success: "[lead_innovator.GetTitledFirstNamePossessiveNoTooltip] 무리가 뜻을 굽힘"
