 ecumenical_council_events.0107.t: "그들의 첫 공의회"
 ecumenical_council_events.0107.desc: "젊은 성직자 무리가 이야기를 나누고 있었다. 누가 봐도 흥분한 기색이 역력했다. 이들 중 대다수는 이번이 첫 공의회였기 때문이다.\n\n\"지금 여기서 움직임이 일어나고 있습니다. [lead_innovator.GetFaith.HouseholdGodName]의 손길이 느껴지지 않으십니까? 교회에 우리의 발자취를 남깁시다! 오래도록 잊혔던 대담한 모습을 보여줄 때입니다!\" [lead_innovator.GetTitledFirstName](이)가 말했다.\n\n\"경멸스러운 멍청이들 같으니! 교부의 뜻을 따라, 저런 역겨운 혁신은 거부해야만 합니다.\" [lead_conservative.GetTitledFirstName](이)가 주장했다."
 ecumenical_council_events.0107.support: "신앙의 새로운 아침이 온다!"
 ecumenical_council_events.0107.support_duel: "이 비겁한 보수주의자에게 반박한다."
 ecumenical_council_events.0107.support_duel.success: "저들의 눈이 미래를 향한 약속으로 반짝임"
