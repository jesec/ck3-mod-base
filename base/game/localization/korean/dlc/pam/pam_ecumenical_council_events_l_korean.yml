 ecumenical_council_summons_events.0050.t: "의심받는 믿음"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName](이)가 [non_pious_guest.GetTitledFirstName](을)를 보더니 즐거운 기색을 감추지 못했다.\n\n\"보셨습니까, [ROOT.Char.GetTitleAsNameNoTooltip]?\" [pious_guest.GetSheHe]가 내게 말했다. \"[non_pious_guest.GetFirstNameNoTooltip](이)야말로 칭찬받아 마땅하지 않습니까? 제가 보기에 저자가 아는 자리라곤 [Glossary( '목욕탕', 'BATHHOUSES_GLOSS' )] 자리가 전부인 것 같던데."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "저런 사람이 자기를 모든 [ROOT.Char.GetFaith.GetAdherentNamePlural]의 수장이라고 선언하고 다니다니.\""
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip](이)라면 그 일에 적합하겠군."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "[non_pious_guest.GetSheHe]가 이 공의회에 참석하기로 했다니, 놀라울 따름입니다.\""
 ecumenical_council_summons_events.0050.aa: "선량한 양치기는 양들 사이에서 일어서야 하는 법..."
 ecumenical_council_summons_events.0050.a: "\"#EMP 모두#!한테 이 사실을 알릴 수도 있는데... 물론 보수를 받아야겠지만.\""
 ecumenical_council_summons_events.0050.b: "\"[pious_guest.GetTitleAsNameNoTooltip], 누가 목욕탕에 자주 들르는지를 #EMP 어떻게#! 아는 거지?\""
 ecumenical_council_summons_events.0050.c: "즐길 거리를 주신 [ROOT.Char.GetFaith.HighGodName]께 감사한다."
 BATHHOUSES_GLOSS: "한때는 보통의 목욕을 하는 장소에 불과하던 목욕탕은 많은 중세 도시에서 악명을 얻었습니다. 가려진 방 덕분에 사람들의 눈에 띄지 않아, 매춘이 이루어지기 좋았기 때문입니다."
