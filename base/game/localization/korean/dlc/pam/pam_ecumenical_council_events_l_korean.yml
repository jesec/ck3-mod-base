 ecumenical_council_events.0117.t: "넘치는 개정"
 ecumenical_council_events.0117.desc: "노련한 협상가 두 명이 칙령의 여백에 무언가를 적어 넣는 모습이 보였다. 이들은 마치 조약을 다루듯 조항에 줄을 그었다가 다시 되돌리고 있었다.\n\n\"그대로 둡시다! 이러다간 더 골치 아픈 사안을 얘기하기도 전에 반절이 떠나 버릴지도 모른다고요.\" [lead_conservative.GetTitledFirstName](이)가 말했다. \"이 사람들을 한 탁자에 모아 놓느라 몇 달이 걸렸습니다. 좀 완화해 봐요. 안 그러면 공의회가 무너집니다.\"\n\n\"이 난장판을 그냥 내버려두자고요? 공의회가 끝나면 아무도 뭘 시행하려 들지 않을 텐데요?\" [lead_innovator.GetTitledFirstName](이)가 대꾸했다."
 ecumenical_council_events.0117.support: "설득력이 있어야 한다. 동시에 명확해야 하고."
 ecumenical_council_events.0117.support_duel: "조용한 칙령보다는 확실한 칙령이 낫지 않나?"
 ecumenical_council_events.0117.support_duel.success: "저들이 혼란스러운 칙령은 시행되지 않을 것이라는 점을 받아들임"
 ecumenical_council_events.0117.support_duel.success_halved: "몇몇 이가 혼란스러운 칙령은 시행되지 않을 것이라는 점을 받아들임"
