l_korean:
 # Activity: The Investiture Council
 activity_investiture_council: "서임권 공의회"
 activity_investiture_council_desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](이)가 끝날 무렵, 교회와 왕실 중 누가 성직자 서임권을 가질 것인지 최종 결판을 내리기 위해 소집되는 공의회입니다."
 activity_investiture_council_province_desc: "이곳에서 서임권 공의회를 개최합니다."
 activity_investiture_council_host_desc: "성직자 서임 문제를 해결하기 위해 서임권 공의회를 소집합니다."
 activity_investiture_council_guest_desc: "서임권 공의회에 참석하여 성직자 서임 문제에 목소리를 보탭니다."
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council: "서임권 공의회를 향한 [Character.GetFirstNamePossessiveNoTooltip] 여정"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value: "서임권 공의회에 소환됨"
 pam_investiture_council_start_log_title: "서임권 공의회 개최"
 pam_investiture_council_start_log: "[CHARACTER.GetTitledFirstName](은)는 성직자 서임 문제에 결론을 내리기 위해 공의회를 개최함."
 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title: "교회의 승리"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.GetTitledFirstName](이)가 공의회의 결정을 선포: 오직 교회만이 성직자를 서임하며, 어떤 왕권도 그들을 해임할 수 없음."
 pam_investiture_council_concluded_temporal_log_title: "왕실의 승리"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.GetTitledFirstName](이)가 공의회의 결정을 선포: 교회가 성직자를 서임하지만, 세속 영주는 자신에게 부응하지 못한 고위 성직자의 직위를 여전히 박탈할 수 있음."
 pam_investiture_council_conclusion.intro: "서임권 공의회가 결론에 도달했다."
 pam_investiture_council_conclusion.spiritual: "공의회에 모인 교부들은 오직 교회만이 성직자를 서임할 권리가 있음을 확인하고, 어떤 왕권도 이를 침해할 수 없도록 했다. 일단 축성된 고위 성직자는 종신으로 직위를 유지한다.\n\n기나긴 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](이)가 끝났다. 교회는 우위를 차지하고 곧바로 내부 개혁에 착수한다."
 pam_investiture_council_conclusion.temporal: "공의회에 모인 교부들은 성직자의 임명은 교회에 맡기되, 고위 성직자가 세속 영주에게 부응하지 못할 경우 그 직위를 박탈할 권리는 세속 영주에게 남겼다. 기나긴 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 끝났지만, 교회의 권위는 약화되고 통합은 위태로워졌다."
 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived: "고위 성직자\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "보수주의자\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "혁신주의자\n[Character.GetShortUINameNoTooltip|U]"
 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt: "[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] 성직 임명 [doctrine|E]를 [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName](으)로 교체함"
 pam_investiture_resolution_temporal_tt: "[GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName] 성직 임명 [doctrine|E]를 [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName](으)로 교체함"
 # Activity phase names + descriptions
 investiture_council_phase_summons: "소집"
 investiture_council_phase_summons_desc: "성직자 서임 문제에 결판을 낼 때가 다가온다는 소식이 퍼지자 신자들이 모입니다."
 investiture_council_phase_debate: "토론"
 investiture_council_phase_debate_desc: "공의회는 교회와 왕실 중 누가 성직자 서임권을 가질 것인지 토론한 뒤, 이를 표결에 부칩니다."
 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t: "도착"
 pam_investiture_council_events.0001.desc: "내가 도착하자 [arrival_host.GetTitledFirstName](이)가 문간에서 따뜻하게 맞이한다. 그 뒤로 보이는 회관은 이미 고위 성직자들과 기독교권의 제후들로 술렁이고 있다. 곧 성직 서임이라는 중대한 문제가 안건으로 오를 것이다."
 pam_investiture_council_events.0001.a: "그들과 함께하게 되어 영광이다."
 pam_investiture_council_events.0001.a.tt: "나머지 참석자들이 모두 도착하면 토론이 시작됨."
 # The council convenes (host)
 pam_investiture_council_events.0002.t: "교회의 향방을 가를 결판"
 pam_investiture_council_events.0002.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](이)가 마침내 끝에 이르렀다. 이제 이 자리에 모인 신자들은 앞으로 성직자를 어떻게 서임할지 결정해야 한다. 나는 교회의 권위를 반드시 지켜내겠다."
 pam_investiture_council_events.0002.a: "그렇게 하겠다."
 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t: "토론의 시작"
 pam_investiture_council_events.0003.desc: "공의회가 교회와 왕실을 대립시킨 쟁점, 즉 누가 성직자를 서임할 것인가를 논하기 시작하자 좌중이 조용해진다. 이 자리에 모인 모두의 의견이 그 결정을 좌우할 것이다."
 pam_investiture_council_events.0003.a: "때가 되었다."
 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t: "귀에 넣는 한마디"
 pam_investiture_council_events.0032.desc: "표결은 아직 확정되지 않았다. 사람을 잘 골라 설득의 말을 건넨다면 상대편에서 마음을 정하지 못한 자들을 내 편으로 끌어들일 수도 있다. 하지만 서투르게 나섰다가는 큰 대가를 치를 수 있다."
 pam_investiture_council_events.0032.a: "참석자들을 설득해 내 편으로 돌린다."
 pam_investiture_council_events.0032.b: "그냥 두자."
 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t: "왕관의 무게"
 pam_investiture_council_events.0033.desc: "나는 성직자들이 모인 이 자리에서 표결권이 없다. 그러나 세속 영주라고 해서 수단이 없는 것은 아니다. 두둑한 돈주머니 앞에서는 양심도 흔들리고, 조리 있는 주장은 마음을 정하지 못한 자들을 움직일 수 있다. 교회나 왕권의 주장에 힘을 실어 줄 수도 있고, 아니면 입을 다물 수도 있다."
 pam_investiture_council_events.0033.a: "교회 측에 표를 던지도록 매수해 보자."
 pam_investiture_council_events.0033.b: "교회 측에 표를 던지도록 설득해 보자."
 pam_investiture_council_events.0033.c: "왕실 측에 표를 던지도록 매수해 보자."
 pam_investiture_council_events.0033.d: "왕실 측에 표를 던지도록 설득해 보자."
 pam_investiture_council_events.0033.e: "이 일에는 관여하지 말자."
 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title: "좌중의 반응"
 pam_investiture_persuade_toast_swayed_tt: "투표자 #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#!명을 끌어들였음."
 pam_investiture_persuade_toast_backfired_tt: "설득 과정의 실책으로 투표자 #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#!명이 돌아섰음."
 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt: "아직 교회 측을 지지하도록 설득할 수 있는 투표자가 있음"
 pam_investiture_persuade_target_temporal_tt: "아직 왕실 측을 지지하도록 설득할 수 있는 투표자가 있음"
 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator: "최대 #P 10#!명의 투표자를 설득해 교회 측으로 끌어들임"
 pam_investiture_persuade_tt_great_conservative: "최대 #P 10#!명의 투표자를 설득해 왕실 측으로 끌어들임"
 pam_investiture_persuade_tt_good_innovator: "최대 #P 5#!명의 투표자를 설득해 교회 측으로 끌어들임"
 pam_investiture_persuade_tt_good_conservative: "최대 #P 5#!명의 투표자를 설득해 왕실 측으로 끌어들임"
 pam_investiture_persuade_tt_modest_innovator: "최대 #P 3#!명의 투표자를 설득해 교회 측으로 끌어들임"
 pam_investiture_persuade_tt_modest_conservative: "최대 #P 3#!명의 투표자를 설득해 왕실 측으로 끌어들임"
 pam_investiture_persuade_tt_backfire_innovator: "실수할 경우 #N 5#!명의 투표자가 교회 측으로 돌아섬"
 pam_investiture_persuade_tt_backfire_conservative: "실수할 경우 #N 5#!명의 투표자가 왕실 측으로 돌아섬"
 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t: "공의회의 소환"
 pam_investiture_council_events.0004.desc: "성직 서임 문제에 결론을 내리기 위해 서임권 공의회가 소집된다는 소식이 들려온다. 하지만 정작 나는 그곳에서 멀리 떨어져 있다. 하던 일을 모두 접고 서둘러 말을 달려가 내 의견을 보탤 수도 있고, 아니면 나 없이 결론을 내리게 둘 수도 있다."
 pam_investiture_council_events.0004.a: "하던 일을 모두 접고 공의회로 말을 달린다."
 pam_investiture_council_events.0004.b: "나 없이 알아서 결정하게 둔다."
 pam_investiture_council_haste_modifier: "공의회로 서두름"
 pam_investiture_council_haste_modifier_desc: "해당 [ruler|E]는 다른 모든 일을 제쳐 두고 서임권 공의회가 [clergy|E] 임명 문제를 결정하기 전에 그곳에 도착하려 합니다."
 # The debate opens (host)
 pam_investiture_council_events.0010.t: "교회의 권리"
 pam_investiture_council_events.0010.desc: "나는 이 사안을 공의회에 상정한다. 성직 서임권은 교회에 있으며, 어떤 왕권도 교회가 축성한 것을 되돌릴 수 없다. 모인 이들이 발언하고 각자의 목소리로 결정하게 하자."
 pam_investiture_council_events.0010.a: "교회의 권위를 옹호한다."
 # The debate: guest picks a side
 pam_investiture_council_events.0031.t: "어느 편에 설 것인가?"
 pam_investiture_council_events.0031.desc: "교계 지도자는 성직 서임권을 오직 교회에 맡기고, 어떤 왕권도 이를 되돌릴 수 없게 할 것을 요구한다. 세속 영주들은 자신들에게 부응하지 못하는 고위 성직자의 직위를 박탈할 권리를 계속 자신들이 가지려 한다. 공의회는 이제 내 의견을 기다리고 있다."
 pam_investiture_council_events.0031.a: "교회를 지지한다. 교회가 성직자를 서임하며, 종신으로 직위를 유지한다."
 pam_investiture_council_events.0031.b: "왕권을 옹호한다. 교회가 성직자를 서임하지만, 영주가 임명을 철회할 수 있다."
 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening: "교황 성하,"
 pam_investiture_council_events.0060.desc.spiritual: "공의회가 끝났습니다. 성하께서 이 자리에 계시지 않았기에 그 결과를 곧바로 서면으로 전합니다. 공의회 교부들은 성직 서임권이 오직 교회에 있으며, 어떤 왕권도 그 권리를 침해할 수 없도록 했습니다. 교회가 축성한 이들은 각자의 직위를 종신으로 유지합니다. [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 끝났습니다."
 pam_investiture_council_events.0060.desc.temporal: "공의회가 끝났습니다. 성하께서 이 자리에 계시지 않았기에 그 결과를 곧바로 서면으로 전합니다. 공의회 교부들이 성직자 임명을 우리 손에 맡겨 두기는 했지만, 세속 영주에게 부응하지 못하는 고위 성직자라면 누구든 그 직위를 박탈할 수 있도록 허용했다고 쓰려니 마음이 아픕니다. [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 끝났습니다."
 pam_investiture_council_events.0060.a: "교령을 읽는다."
 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening: "주군,"
 pam_investiture_council_events.0061.desc.spiritual: "대공의회의 소식이 경당까지 전해졌습니다. 공의회 교부들은 성직 서임권이 오직 교회에 있다고 확언했으며, 교회가 임명한 이들을 해임할 권한은 이제 주군께 없습니다. 기나긴 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 끝났고, 목장은 왕실이 탐내던 서임권을 지켜 냈습니다."
 pam_investiture_council_events.0061.desc.temporal: "대공의회의 소식이 경당까지 전해졌습니다. 공의회 교부들은 성직 서임권을 교회에 맡겼지만, 주군께 부응하지 못하는 고위 성직자라면 누구든 주군께서 여전히 그 직위를 박탈할 수 있습니다. 기나긴 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 끝났고, 왕실이 목장을 누르고 승리했습니다."
 pam_investiture_council_events.0061.a: "이것으로 결론이 났군."
 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t: "공의회 소집"
 pam_investiture_council_events.0050.desc.named: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 막바지에 이르렀고, 공의회가 성직 임명 문제에 결론을 내릴 것이다.\n\n[investiture_nominee_host.GetTitledFirstName](이)가 공의회 개최를 맡는다. 교계 지도자로서 공의회에 참석해 결정 과정에서 의견을 밝혀야 하지만, 불참하더라도 결과는 전달받게 된다."
 pam_investiture_council_events.0050.desc: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 막바지에 이르렀고, 공의회가 성직 임명 문제에 결론을 내려야 한다. 직접 주최하지 않으므로 교회의 고위 대주교가 대신 개최를 맡는다. 그래도 참석해 내 의견을 보탤 수 있다."
 pam_investiture_council_events.0050.a: "알겠다."
 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast: "[GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip]의 종결"
 pam_investiture_crisis_lapsed_tt: "공의회가 소집되지 않아 [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName](은)는 교회 측에 유리하게 종결됨. 이제부터 성직자는 교회가 임명하며, 각자의 직위를 종신으로 유지함"
