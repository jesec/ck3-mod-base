l_korean:
 # Scheme
 gdp_incite_unrest_scheme: "불안 조장"
 gdp_incite_unrest_scheme_desc: "수도의 평민들 사이에 선동과 불만을 퍼뜨려 영주에게 등을 돌리게 합니다."
 gdp_incite_unrest_scheme_desc_general: "수도의 평민들 사이에 선동과 불만을 퍼뜨려 영주에게 등을 돌리게 합니다."
 gdp_incite_unrest_scheme_action: "다음 대상을 상대로 불안 조장"
 GDP_INCITE_UNREST_SUCCESS_DESC: "선동가들이 대중을 뒤흔들었습니다. 주군의 수도 영지의 민중 의견이 하락하게 됩니다."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "수도에서 불안을 조장하려던 모략이 발각되었습니다."
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "모략 포기"
 gdp_incite_unrest_scheme_owner_not_republic: "더는 공화제 정부를 보유하지 않으며, 해당 모략을 이어갈 수 없습니다."
 # Interaction
 gdp_incite_unrest_start_interaction: "불안 조장"
 gdp_incite_unrest_scheme_interaction_tt_approved: "[recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V]의 평민들 사이로 몰래 불만을 퍼뜨려, [recipient.GetTitledFirstNamePossessiveNoTooltip|V] [popular_opinion|E]을 감소시킴."
 gdp_incite_unrest_scheme_start_notification: "모략 시작"
 gdp_incite_unrest_scheme_target_tt: "누군가 당신을 대상으로 모략을 꾸미고 있습니다."
 # Success messages
 gdp_incite_unrest_scheme_success_t: "불안 전파"
 gdp_incite_unrest_scheme_success_liege_t: "수도의 불안"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "모략이 무산됨"
 gdp_incite_unrest_scheme_failure_desc: "우리 선동가들은 [scope:target.GetTitledFirstName]에 맞서 소요를 일으키는 데 실패했고 음모는 수포로 돌아갔습니다. 민중은 동요하지 않았습니다."
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "계획 노출"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "공모자들이 일을 해냈다. [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]의 거리에 불만이 퍼져 나가고 있으며, [target.GetTitledFirstName] 또한 사람들의 신뢰를 잃고 있다."
 gdp_incite_unrest_scheme_event.0005.a: "사람들을 더 밀어붙여도 되겠군."
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "[This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]에 불평의 속삭임이 가득하다. 누군가 평민들을 선동해 [This.GetHerHim]에게 등을 돌리게 했으며, 저들의 불만이 점점 더 목소리를 높이고 있다."
 gdp_incite_unrest_scheme_event.0006.a: "질서를 회복해야겠다."
 # County modifier
 gdp_incite_unrest_county_modifier: "뿌려진 선동"
 gdp_incite_unrest_county_modifier_desc: "선동가들이 활동하며 불만을 퍼뜨리고 영주에게 등을 돌리게 했습니다."
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "불명예스러운 모략가"
 gdp_caught_inciting_unrest_modifier_desc: "해당 파트리치오는 공화국의 수장을 향한 불만을 조장하다 발각되었습니다. 다른 가문과 유권자들이 이 파트리치오를 의심의 눈길로 바라봅니다."
