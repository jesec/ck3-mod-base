 patrician_promote_ambition_bonus_tt: "성공 시:"
 scheme_critical_moments.1142.desc_patrician_self: "자기 홍보에 모든 노력을 쏟은 보람이 있었다.\n\n동료들 사이에서 내 입지가 나아졌으며, 새로운 지지자들이 내 [house|E]에 집결하고 있다. 내 목표가 그 어느 때보다 가까워졌다!"
 scheme_critical_moments.1142.desc_patrician_other: "[target.GetTitledFirstNamePossessive] 대의를 알리기 위해 쏟아부은 수많은 시간과 자원이 마침내 결실을 맺었다.\n\n[target.GetHerHis|U] 동료들 사이에서의 평판이 좋아졌고, 새로운 지지자들도 [target.GetHerHis] 가치를 인정하게 되었다. 이제 [republic|E]에서 [target.GetHerHis] 입지도 한 단계 높아졌다!"
 scheme_critical_moments.1143.desc_patrician_self: "자기 홍보에 들인 모든 노력과 자원은 허무하게 사라졌다. 누구도 나의 가치를 알아주지 않았으며, 수많은 공약과 뇌물에도 내 입지는 조금도 변하지 않았다.\n\n내 [house|E]을 제대로 홍보하려면 방법을 바꿀 필요가 있다."
