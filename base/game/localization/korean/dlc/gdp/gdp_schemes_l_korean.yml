 steal_trade_post_desc: "[SCHEME.GetTargetCharacter.GetShortUIName](은)는 마땅히 내 것이어야 하는 [SCHEME.MakeScope.Var('target_trade_post').GetProvince.GetCounty.GetTitle.GetNameNoTier]의 [trade_post|E]을 소유하고 있습니다."
 steal_trade_post_desc_general: "$steal_trade_post$는 경쟁자 [patrician|E]의 [trade_post|E]를 빼앗기 위한 [hostile_scheme|E]입니다. [Concept( 'intrigue', '계책력' )|E] 및 [Concept( 'stewardship', '관리력' )|E]을 기반으로 하며, [agents|E]를 모집할 수 있습니다.\n\n모략에 성공하면 대상 $game_concept_trade_post$의 소유권이 [scheme_target|E]에게서 [scheme_owner|E]에게로 넘어갑니다."
 STEAL_TRADE_POST_SUCCESS_DESC: "대상 [trade_post|E]의 소유권이 넘어갑니다. [TARGET_CHARACTER.GetSheHe]가 이 일을 꾸민 사람이 누구인지 알아내면 당신의 [rival|E]가 됩니다."
 STEAL_TRADE_POST_DISCOVERY_DESC: "당신이 [trade_post|E] 탈취를 시도했다는 사실이 드러나지 않음"
