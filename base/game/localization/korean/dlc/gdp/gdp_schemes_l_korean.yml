 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "[target.GetHouse.GetName] 가문을 동정할 뻔했다. 그 가문의 하인들과 이른바 관계자들이 내 요원들에게 가장 추잡한 비밀을 털어놓는 데 어찌나 협조적이던지, 심지어 #EMP 열성적#!이기까지 했다. 물론 동정할 #EMP 뻔했을#! 뿐이다.\n\n내 손에 들어온 증거는 반박의 여지가 없다. [secret_holder.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]!"
 gdp_patrician_find_secrets.0002.a: "[secret_holder.GetHerHis|U] 평판은 내 손에 달렸다."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "내 공모자들은 [target.GetHouse.GetName] 가문이 버린 문서들을 샅샅이 뒤지고, 하인들을 강압하고, 시장의 소문꾼들에게 두둑한 돈까지 쥐여 주었지만 쓸모 있는 정보는 하나도 얻지 못했다.\n\n[target.GetTitledFirstName](이)가 무슨 비밀을 감추고 있다면 너무 깊숙이 숨겨져 알아낼 수 없는 것이고, 그렇지 않다면 애초에 아무 비밀도 없는 것이리라."
 gdp_patrician_find_secrets.0003.desc.outmatched: "내 공모자들은 [target.GetHouse.GetName] 가문의 일거수일투족을 감시했지만, 그들의 비밀에 관한 희미한 단서조차 잡지 못했다. 가문의 문은 구두쇠의 지갑보다도 굳게 닫혀 있었고, 하인들은 아예 혀가 없는 것이나 다름없을 만큼 입을 굳게 다물고 있었다.\n\n[target.GetTitledFirstName](이)가 무슨 타락한 짓을 저질렀든, 우리가 아는 것은 조사를 시작하기 전과 비교해 조금도 달라지지 않았다."
 gdp_patrician_find_secrets.0003.a: "[ROOT.Char.Custom('CulturalCurse')|U]! 전부 헛수고였군."
