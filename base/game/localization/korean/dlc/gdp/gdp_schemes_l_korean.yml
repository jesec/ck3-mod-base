 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.8602.desc: "[trade_post_county.GetName]의 정무관들에게도 값이 매겨져 있다. 알고 보니 그 값도 그리 비싸지 않았다. 인장이 하나씩 찍힐 때마다 [trade_post_province.GetName]의 임차권이 우리에게 넘어온다.\n\n[target.GetTitledFirstName](이)가 이 소식을 들을 무렵이면 우리 대리인들은 이미 [target.GetHerHis] 서기들을 내쫓고 문 위에 칠해진 [target.GetHerHis] 상징색을 덧칠하고 있으리라."
 scheme_critical_moments.8602.a: "좋은 자리군. 이제 우리 차지다."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.8603.desc: "뇌물은 모조리 받아 챙겼고, 약속은 하나도 지키지 않았다. [trade_post_county.GetName]의 정무관들은 내 돈을 주머니에 넣고도 내 소유권을 지켜 주는 일조차 하지 않았다.\n\n이곳에 대한 [target.GetTitledFirstNamePossessive|U] 장악력은 조금도 흔들리지 않았다."
 scheme_critical_moments.8603.discovered: "\n\n설상가상으로 [target.GetTitledFirstNameNoTooltip](은)는 자기 돈주머니에 손을 뻗은 사람이 누구인지 정확히 알고 있다..."
 scheme_critical_moments.8603.fallback: "\n\n그나마 이 일에 우리가 관여했다는 사실은 여전히 비밀로 남아 있다."
 scheme_critical_moments.8603.a: "신의 없는 자들에게 돈만 날렸군."
 scheme_critical_moments.8603.tt.failed: "[scheme.GetOwner.GetShortUIName|U](이)가 [trade_post_province.GetNameNoTooltip]에 있는 당신의 [trade_post|E]을 빼앗으려 시도했으나 실패함!"
 scheme_critical_moments.8604.t: "무역 거점 점거: [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "기마 전령이 [trade_post_county.GetName]에서 소식을 전해 왔다. 우리 대리인은 거리로 내쫓겼다. 현지 정무관들은 나를 더 이상 받아들이지 않겠다고 선언하고 [trade_post_province.GetName] 무역 거점의 소유자로 다른 사람을 지정했다고 한다.\n\n수년간 이어 온 무역과 물품 보관, 어렵게 얻은 신뢰까지. 이미 우리 돈을 받아먹은 자들이 서명 한 번으로 그 모든 것을 남에게 넘겨 버렸다."
 scheme_critical_moments.8604.discovered: "\n\n이제 [owner.GetTitledFirstName](이)가 내 자리를 차지하고 있다. 마치 그곳이 처음부터 [owner.GetHersHis] 것이었던 양 말이다. 우리는 이 일을 절대로 잊지 #EMP 않을#! 것이다!"
 scheme_critical_moments.8604.a: "우리 문밖으로 쫓겨나다니!"
