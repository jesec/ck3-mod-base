 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.8502.desc: "훔친 장부와 구슬려 캐낸 소문, 호의를 베풀어 얻은 자잘한 정보들이 조금씩 모여 [target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] 수많은 구매자와 판매자, 그 밖의 인맥에 대한 윤곽을 그려 낸다.\n\n[target.GetTitledFirstNamePossessive] 선호 상품을 놓고 우리가 한층 대등한 조건에서 경쟁하는 데 이 정보가 큰 도움이 될 것임은 의심의 여지가 없다."
 scheme_critical_moments.8502.discovered: "\n\n안타깝게도 우리의 뒷조사를 [target.GetTitledFirstNameNoTooltip](이)가 눈치채고 말았다..."
 scheme_critical_moments.8502.a: "훌륭하군!"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U](은)는 [target.GetShortUINamePossessive] 회사를 상대로 $steal_market_insights$에 성공했지만 발각되었음!"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.8503.desc: "며칠이고 행상인들과 말씨름을 벌이고, 꺼질 듯 타닥거리는 촛불을 사이에 두고 긴긴밤을 속삭이며 보냈다. 그러나 [target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] 사업 내막은 조금도 알아내지 못했다...\n\n심지어 [target.GetTitledFirstNamePossessive] 사무실에서 가져온 문서들조차 의미 없는 낙서나 오래된 계산 기록에 불과했다."
 scheme_critical_moments.8503.discovered: "\n\n엎친 데 덮친 격으로, [target.GetTitledFirstNameNoTooltip](이)가 우리의 음모를 눈치챈 듯하다."
 scheme_critical_moments.8503.fallback: "\n\n[target.GetTitledFirstNameNoTooltip](이)가 우리의 모략을 눈치채지 못했다는 게 그나마 위안이다."
 scheme_critical_moments.8503.a: "시간만 버렸군..."
 scheme_critical_moments.8503.tt.failed: "[scheme.GetOwner.GetShortUIName|U](이)가 [target.GetShortUINamePossessive] 회사를 상대로 $steal_market_insights$를 시도했지만 실패함!"
