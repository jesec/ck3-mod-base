 hostile_takeover_desc_general: "$hostile_takeover$는 경쟁자인 [merchant|E] [company|E]의 자산을 장악하는 것을 목표로 하는 [hostile_scheme|E]입니다. [Concept( 'intrigue', '계책력' )|E] 및 [Concept( 'stewardship', '관리력' )|E]을 기반으로 하며, [agents|E]를 모집할 수 있습니다.\n\n$hostile_takeover$에 성공하면 [scheme_target|E]의 $game_concept_company$가 파괴되고 [scheme_owner|E]의 [competitiveness|E]이 증가합니다."
