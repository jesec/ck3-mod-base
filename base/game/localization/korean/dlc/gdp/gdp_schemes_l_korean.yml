 steal_market_insights_action: "다음 대상으로부터 전문성 탈취"
 steal_market_insights_desc_general: "$steal_market_insights$는 경쟁 [merchant|E]의 [company|E]가 지닌 [expertise|E]을 훔치는 것을 목표로 하는 [hostile_scheme|E]입니다. [Concept( 'intrigue', '계책력' )|E] 및 [Concept( 'stewardship', '관리력' )|E]을 기반으로 하며 [agents|E]들을 포섭할 수 있습니다.\n\n$steal_market_insights$에 성공하면 [scheme_owner_possessive|E] [company|E]는 모든 [trade_categories|E]를 비교해, [scheme_target_possessive|E] $game_concept_company$의 $game_concept_expertise$이 더 높은 범주에서 $game_concept_expertise$을 획득합니다."
