 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.8402.desc: "[target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] 깊숙한 곳에서 나는 [target_patron.GetTitledFirstNamePossessive] 치안관들이 느긋하게 산더미 같은 문서를 훑어보는 모습을 지켜본다. 도장이 하나씩 찍힐 때마다 [target.GetHouse.GetName]의 자산 하나가 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l](으)로 이전되었음이 확정된다.\n\n머리 위에서 파리 한 마리가 느긋하게 윙윙거릴 만큼 평온하던 분위기는 [target.GetFirstName](이)가 갑자기 방으로 들이닥치면서 깨진다.\n\n#EMP \"너!#!\" [target.GetSheHe]가 독기 어린 쉰 목소리로 내뱉는다. \"어떻게?! #DIE2 대체 왜...#!\""
 scheme_critical_moments.8402.a: "그저 사업을 잘했을 뿐..."
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.8403.desc: "그토록 이리저리 분주하게 움직이고 [target_patron.GetTitledFirstName](을)를 닦달했건만, [target.GetTitledFirstName](이)가 수상한 낌새를 채기 전에 끝내 마지막 수를 두지 못했다...\n\n[target.GetPrimaryTitle.GetDefinitiveName](은)는 단단히 방어 태세를 갖추었고, 법정에서 그 돼지 같은 놈들을 한 수 앞설 여지를 없애 버렸다."
 scheme_critical_moments.8403.discovered: "\n\n엎친 데 덮친 격으로, [target.GetTitledFirstNameNoTooltip](은)는 이번 일의 배후가 우리라는 걸 알고 있는 게 분명하다..."
 scheme_critical_moments.8403.fallback: "\n\n하지만 우리가 연루되었다는 사실을 [target.GetTitledFirstNameNoTooltip](이)가 전혀 모른다는 것이 작은 위안이다..."
 scheme_critical_moments.8403.a: "늘 그렇지..."
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U](이)가 [target.GetShortUINamePossessive] 회사에 대한 $hostile_takeover$를 시도했으나 실패함!"
 scheme_critical_moments.8404.t: "적대적 인수: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "우리가 날마다 무역로의 장부나 들여다보고 돈 될 구석을 찾아 진흙탕을 킁킁거리며 헤매는 데 매달리던 와중에, 오늘에서야 관심을 완전히 엉뚱한 데 두고 있었다는 사실을 깨닫는다.\n\n[target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에서 퉁명스러운 서신 한 통이 도착했다. 오늘 진행된 재판 절차를 확인해 주는 형식적인 통지에 불과했지만, 그 결과 우리 회사는 해산되고 자산은 [owner.GetPrimaryTitle.GetDefinitiveName|l]에 #EMP 압류#!될 것이다!\n\n내가 도착했을 때는 이미 늦었다. 애초에 손쓸 수 있었던 때가 있기는 했는지도 모르겠지만...\n\n필사적으로 서류를 샅샅이 들여다보는 동안, 그 악당 [owner.GetTitledFirstName](은)는 나를 보며 히죽거린다. 그 모든 서류에는 나의 후원자 [target_patron.GetTitledFirstName]의 승인까지 명백히 찍혀 있다!"
 scheme_critical_moments.8404.a: "어떻게?! #DIE2 대체 왜...#!"
