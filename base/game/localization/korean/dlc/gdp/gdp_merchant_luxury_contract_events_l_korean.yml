l_korean:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "[local_county.GetNameNoTierNoTooltip]의 [local_province.Custom('GetTerrainLandPlural')](을)를 지나가던 우리 일행은 현지 정착지 인근에 도달해, [local_province.Custom('GetProvinceFoliageDescAdjective')] 외곽에 야영지를 마련했다."
 gdp_merchant_luxury_contract.0001.desc.locals: "지나가던 마을 주민들은 현지 야생에 대한 우리의 서투른 물음에 대답해 주었다. 이들은 이상하지만 분명한 표현으로"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "지나가던 마을 주민들은 우리의 물음에 현지 얘기를 들려주며"
 gdp_merchant_luxury_contract.0001.desc.jungle: "달콤한 꿀의 향기가 가득 느껴지는 공기의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.mountain: "나뭇가지 사이로 부는 서늘한 바람의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.desert: "고요한 풍경 위에서 작열하는 태양의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.plains: "야생화의 향기가 가득한 풍경의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "무시무시한 고양이의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "교활한 고양이의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.bear: "흉포한 곰의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.monkey: "짓궂은 원숭이의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.elephant: "위풍당당한 코끼리의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "무시무시한 고양이와 흉포한 곰의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "흉포한 곰과 위풍당당한 코끼리의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "무시무시한 고양이와 위풍당당한 코끼리의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "짓궂은 원숭이와 무시무시한 고양이의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "짓궂은 원숭이와 위풍당당한 코끼리의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.bird: "묘한 매력이 있는 새의 이야기를 했다."
 gdp_merchant_luxury_contract.0001.desc.close: "일단 길은 제대로 든 것 같군!"
 gdp_merchant_luxury_contract.0001.a: "야생의 짐승이 기다린다!"
 gdp_merchant_luxury_contract.0001.a.flavor: "[martial_i|E][martial|E], [intrigue_i|E][intrigue|E], [prowess_i|E][prowess|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.0001.a.tt: "황야의 #V 생물#! [domicile_artifact|E]을 입수하려 시도함"
 gdp_merchant_luxury_contract.0001.b: "[local_barony.Custom('BaronyTownType')]에서 뭘 찾을 수 있을지 어디 보자."
 gdp_merchant_luxury_contract.0001.b.flavor: "[diplomacy_i|E][diplomacy|E], [stewardship_i|E][stewardship|E], [gold_i|E][gold|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.0001.b.tt: "도시 중심부의 #V 생물#! [domicile_artifact|E]을 입수하려 시도함"
 gdp_merchant_luxury_contract_back_to_town_tt: "[local_barony.Custom('BaronyTownType')](으)로 돌아감"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "야생으로 돌아감"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: 현지의 색"
 gdp_merchant_luxury_contract.0011.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip]의 낯선 길을 헤매던 나는 [local_province.Custom('GetProvinceAdjective')] [local_province.Custom('GetRegionalMarketTermGloss')](을)를 발견했다. 그중에서도 잘 차려입은 어느 현지 [rich_local.GetWomanMan]을 그냥 지나칠 수 없었는데, 이 사람이"
 gdp_merchant_luxury_contract.0011.cage: "우리에 갇힌 [rich_local.Custom('GetAnimalType')] 옆에 서서 얘기하고 있었다!"
 gdp_merchant_luxury_contract.0011.shoulder: "어깨에 [rich_local.Custom('GetAnimalArticle')] [rich_local.Custom('GetAnimalType')] 한 마리를 얹고서 얘기를 하고 있었다!"
 gdp_merchant_luxury_contract.0011.leashed: "옆에 목줄을 맨 [rich_local.Custom('GetAnimalType')] 한 마리를 두고서 얘기를 하고 있었다!"
 gdp_merchant_luxury_contract.0011.close: "\n\n주변의 행상인들한테 듣기로는 이 사람의 이름이 [rich_local.GetTitledFirstName](이)며, 이국적인 야생 동물을 좋아하는 [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)] 현지의 유력자라고 한다.\n\n혹시 [rich_local.GetSheHe]라면 나하고 거래할 생각이 있지 않을까?"
 gdp_merchant_luxury_contract.0011.a: "\"혹시 그대의 멋진 [rich_local.Custom('GetAnimalType')]에 대해 얘기 좀 할 수 있겠소?\""
 gdp_merchant_luxury_contract.0011.a.success: "[rich_local.GetSheHe|U]가 당신에게 [rich_local.Custom('GetAnimalType')](을)를 판매함"
 gdp_merchant_luxury_contract.0011.a.failure: "[rich_local.GetSheHe|U]가 당신의 제안을 거절함"
 gdp_merchant_luxury_contract.0011.b: "내가 알아서 찾아도 되니까..."
 gdp_merchant_luxury_contract.some_other_way: "생물을 획득할 다른 방법을 찾아야 함"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "내가 자기소개를 하고, 짐승에 대해 정신없이 찬사를 늘어놓는 동안 [rich_local.GetTitledFirstName](이)가 호기심 가득한 눈으로 나를 훑어보았다.\n\n"
 gdp_merchant_luxury_contract.0012.success: "내 말을 듣던 [rich_local.GetHerHis|U] 표정이 온화해졌다. 기꺼이 내 칭찬을 받아들이고, 어떻게 고향에서 이렇게 먼 곳까지 나왔냐면서 열성적으로 캐묻기 시작했다.\n\n우리는 곧 가격 이야기를 했고, 머지않아 나는 훌륭한 [rich_local.Custom('GetAnimalType')]의 주인이 되었다!"
 gdp_merchant_luxury_contract.0012.failure: "하지만 [rich_local.GetHerHis|U] 표정이 구겨져 갔다. 처음에는 찌푸리다가 경멸하는 코웃음을 짓더니, [rich_local.GetHerHis] 수행원들에게 신호를 보내 나를 밀어내라고 지시하며 대놓고 내 말을 무시했다.\n\n저 거만한 광대 자식이 #EMP 날#! 무슨 [rich_local.Custom('GetAnimalType')] 보듯 하고 있다..."
 gdp_merchant_luxury_contract.0012.a: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 화제가 되겠군!"
 gdp_merchant_luxury_contract.0012.b: "잠깐, 금액을 더 제시하겠소!"
 gdp_merchant_luxury_contract.0012.c: "저 멍청이가 사는 곳이 어디지? [rich_local.Custom('GetAnimalType')](은)는 #EMP 내#! 것이 되리라!"
 gdp_merchant_luxury_contract.0012.c.success: "[rich_local.Custom('GetAnimalType')](을)를 강탈함"
 gdp_merchant_luxury_contract.0012.c.failure: "경비병을 겨우 따돌림"
 gdp_merchant_luxury_contract.0012.d: "#weak *고개를 저으며*#! \"됐다, 내가 하나 잡고 말지.\""
 gdp_merchant_luxury_contract.0012.e: "이만하면 됐다..."
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip]에서 [rich_local.GetTitledFirstNamePossessive] 거처를 찾기는 쉬웠다. 어둠이 떨어진 뒤 거기서 강도질을 저지를 덩치 큰 얼간이들도 술집에서 쉽게 영입할 수 있었다.\n\n"
 gdp_merchant_luxury_contract.0013.success: "경계에 침입하는 일은 놀라울 만큼 쉬웠다. 우리는 순식간에 몇 거리나 떨어진 곳까지 와 버렸고, 경보 소리가 들리지는 않는지 귀를 쫑긋 세웠다.\n\n하지만 들리는 소리라곤 [rich_local.Custom('GetAnimalPossessive')] 부드러운 [rich_local.Custom('GetAnimalSoundPresent')]만이 전부였다!"
 gdp_merchant_luxury_contract.0013.failure: "불행히도 내 운은 거기서 다했다! 계획이 산산조각 났으며, 나는 그 위험한 [rich_local.Custom('GetAnimalPossessive')] [rich_local.Custom('GetAnimalSoundPresent')]에 이끌린 경비병들을 겨우 따돌리고 탈출했다...\n\n[rich_local.GetFirstNamePossessiveNoTooltip] 사람들이 분명 날 찾고 있을 거다!"
 gdp_merchant_luxury_contract.0013.a: "멍청하긴, 그러게 나한테 팔았어야지!"
 gdp_merchant_luxury_contract.0013.b: "당장 이곳을 떠나야 한다!"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]:"
 gdp_merchant_luxury_contract.0021.desc: "미로처럼 얽힌 [local_barony.Custom('BaronyTownType')] [local_province.Custom('GetRegionalMarketTermGloss')] 깊은 곳에서 풍겨 오는 악취와 짐승의 소리가 나를 이끌었다. 낡은 가판대 뒤에 [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)] [dealer.GetWomanMan]이 있었다. [local_province.Custom('GetProvinceAdjective')] 빈터에는 온갖 종류의 [local_province.Custom('GetRandomRegionalWood')] 우리가 가득했다.\n\n내 흥미를 눈치챈 [dealer.GetSheHe]가 급히 손짓했다. 참으로 놀라운 볼거리였다! 훌륭한 [ROOT.Char.Custom('GetAnimalType')] 한 마리가 당장 내 시선을 잡아끌었다. 녀석의 [ROOT.Char.Custom('GetAnimalFeature')](을)를 감상하는 동안, 비참한 [dealer.Custom('GetAnimalType')]의 [dealer.Custom('GetAnimalSoundPresent')]가 항의하듯 들려왔다.\n\n내가 동물을 살피는 동안 상인의 눈은 욕심으로 반짝였다."
 gdp_merchant_luxury_contract.0021.a: "\"아름답군... 이 [ROOT.Char.Custom('GetAnimalType')](을)를 가져야겠다!\""
 gdp_merchant_luxury_contract.0021.b: "[local_province.GetBaronyNameExplicitlyNoTooltip]에서도 분명 팔고 있겠지..."
 gdp_merchant_luxury_contract.0021.b.success_critical: "훌륭한 거래를 체결함"
 gdp_merchant_luxury_contract.0021.b.success: "동전 약간을 아낌"
 gdp_merchant_luxury_contract.0021.b.failure: "상황을 오히려 악화시킴"
 gdp_merchant_luxury_contract.0021.b.tt: "거절할 수 있는 선택권이 주어지게 됨"
 gdp_merchant_luxury_contract.0021.c: "#weak *가리키며*#! \"[dealer.Custom('GetAnimalType')](으)로 하지!\""
 gdp_merchant_luxury_contract.0021.d: "\"그냥 구경하는 걸세.\""
 task_contract_success_pseudo: "#P 성공:#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "판매자가 한쪽 눈을 찡긋했다. 타고난 행상인임이 틀림없었다. 우리는 한참 동안 오락가락하며 [ROOT.Char.Custom('GetAnimalPossessive')] [ROOT.Char.Custom('GetAnimalHide')]에 있는 모든 자국을 자세히 살펴보고 그 [ROOT.Char.Custom('GetAnimalSoundPresent')]에 대해 토론했다.\n\n"
 gdp_merchant_luxury_contract.0022.success: "내 주장을 강하게 펼치자, [dealer.GetSheHe]는 당황한 듯 보였다. 그러더니 머지않아 포기하고는 가격을 상당히 많이 깎아 주었다. 물론 여기에도 한계는 있기 마련이겠지..."
 gdp_merchant_luxury_contract.0022.neutral: "내 주장이 [dealer.GetHerHim]에게 먹히긴 한 모양이었다. [dealer.GetSheHe]가 제시한 가격이 약간 내려가긴 했지만, 그 이상은 꼼짝도 하지 않는다..."
 gdp_merchant_luxury_contract.0022.failure: "내가 [dealer.GetHerHim]를 잘못 건드린 모양이었다. [dealer.GetSheHe]가 제시한 가격이 오히려 더 올라갔으며, 이제는 그대로 완강하게 버티고 있다..."
 gdp_merchant_luxury_contract.0022.a: "\"거래하기로 하지.\""
 gdp_merchant_luxury_contract.0022.b: "\"사실 [dealer.Custom('GetAnimalType')](을)를 갖고 싶은데...\""
 gdp_merchant_luxury_contract.0022.c: "#weak *고개를 저으며*#! \"없던 일로 합시다.\""
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "적어도 내 목표는 이루었고, 나는 [ROOT.Char.Custom('GetAnimalArticle')] [ROOT.Char.Custom('GetAnimalType')]의 떳떳한 주인이 되었다! 이 멋진 생물을 안전하게 확보했으며, 집으로 돌아가는 상단에 합류시킬 준비도 되었다.\n\n[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에서 이 녀석을 보여줄 순간이 기대된다!"
 gdp_merchant_luxury_contract.0023.a: "자, 가자."
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: 사냥 중"
 gdp_merchant_luxury_contract.0041.desc: "흔적을 따라가다 보니 [local_province.Custom('GetTerrainType')] 깊이 들어왔다. 나는 짐승이 있다는 증거를 찾아 [local_province.Custom('GetProvinceFoliageDesc')](을)를 헤치고 나아갔다. 하지만 으스스한 침묵 속에 새소리만이 들릴 뿐이다. 나는 망토를 더 단단히 여몄다.\n\n덤불을 떠나려고 몸을 돌리는 순간, 하마터면 못 볼 뻔했다! [local_province.Custom('GetProvinceGroundDesc')] 가운데에 틀림없는 [ROOT.Char.Custom('GetAnimalTrack')] 자국이 있었다! 멀리서 갑작스럽게 [ROOT.Char.Custom('GetAnimalSound')]가 들리며 내 의심은 확실해졌다. 근처에 [ROOT.Char.Custom('GetAnimalType')](이)가 있다!"
 gdp_merchant_luxury_contract.0041.a: "가자, 녀석이 도망가기 전에!"
 gdp_merchant_luxury_contract.0041.a.tt: "[THIS.Char.Custom('GetAnimalType')](을)를 쫓아감"
 gdp_merchant_luxury_contract.0041.b: "이, 이쯤 하면 됐다. 돌아가자!"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "[local_province.Custom('GetProvinceFoliageDesc')](을)를 헤치고 나아가던 중, 시야 가장자리에 [ROOT.Char.Custom('GetAnimalColor')] [ROOT.Char.Custom('GetAnimalHide')]의 모습이 힐끗 보였다. 나는 최악의 상황을 가정하며 뒤로 돌았다. 심장이 가슴에서 튀어 나가기 직전이었다!\n\n내 앞에는 작고 후줄근한 [ROOT.Char.Custom('GetAnimalType')] 한 마리가 있었는데, 고작 [ROOT.Char.Custom('GetAnimalChild')]에 지나지 않았다. 크고 호기심 가득한 눈이 두려움도 없이 나를 바라보았다. 나는 주변을 둘러보았지만 아무도 없었다. 이 짐승의 부모나 [ROOT.Char.Custom('GetAnimalGroup')]도 보이지 않았다..."
 gdp_merchant_luxury_contract.0042.a: "난 다 자란 짐승을 찾아온 거란 말이다!"
 gdp_merchant_luxury_contract.0042.a.tt: "다 자란 [THIS.Char.Custom('GetAnimalType')] [artifact|E]을 계속 찾아 나섬"
 gdp_merchant_luxury_contract.0042.b: "덫을 놓는 것도 좋겠군..."
 gdp_merchant_luxury_contract.0042.b.success: "[ROOT.Char.Custom('GetAnimalChild')](을)를 미끼로 사용함"
 gdp_merchant_luxury_contract.0042.b.success.tt: "다 자란 [THIS.Char.Custom('GetAnimalType')] [artifact|E]도 획득함"
 gdp_merchant_luxury_contract.0042.b.failure: "당신이 실패하고 [ROOT.Char.Custom('GetAnimalChild')](이)가 달아남"
 gdp_merchant_luxury_contract.0042.c: "이만 떠나자. #EMP 넌#! 나랑 같이 가는 거다, 꼬마야!"
 baby_creature_artifact_name: "[baby_creature.GetNameNoTooltip] [ROOT.Char.Custom('GetAnimalChild')|U]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "[local_province.Custom('GetProvinceFoliageDesc')]에서 뭔가 번쩍여 깜짝 놀랐다. 웬 짐승이 나를 덮쳤고, 최악의 상황이 벌어진 줄로만 알았다!\n\n하지만 곧 안심했다. 짐승이 아니라, 활시위에 화살을 매긴 채 수상하다는 듯 나를 바라보고 있는 현지 덫 사냥꾼이었으니까.\n\n\"하, 혹시 [ROOT.Char.Custom('GetAnimalPlural')] 찾아서 오신 겁니까? 당신 같은 사람은 처음 보는데.\""
 gdp_merchant_luxury_contract.0043.a: "자, 받게. 혹시... 도와 줄 수 있겠나?"
 gdp_merchant_luxury_contract.0043.b: "그대 곁에서 사냥할 수 있다면 영광이겠군!"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip](이)가 당신을 도움"
 gdp_merchant_luxury_contract.0043.b.success_tt: "당신의 성공 확률이 더 높아질 것임"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip](이)가 당신을 무시함"
 gdp_merchant_luxury_contract.0043.c: "저리 비켜라."
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "말을 잘 듣는 [ROOT.Char.Custom('GetAnimalChild')](을)를 알맞은 빈터로 데려와, 땅바닥에 밧줄로 묶어 놓기란 쉬운 일이었다.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName](은)는 정말 큰 도움이었다. 현지 [local_province.Custom('GetTerrainType')](와)과 거기서 살아가는 생물들을 굉장히 잘 알고 있었으니까. 우리는 곧 [ROOT.Char.Custom('GetAnimalPossessive')] 뒤를 쫓게 될 거다!\n\n"
 gdp_merchant_luxury_contract.0044.desc: "우리는 낯선 풍경에서 수도 없이 발을 헛디디고 길을 되짚느라 느리게 나아갔다. 하지만 곧 [ROOT.Char.Custom('GetAnimalPossessive')] 뒤를 쫓게 될 거다!\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "아니나 다를까, 부드러운 [ROOT.Char.Custom('GetAnimalSoundParticiple')]는 다 자란 [ROOT.Char.Custom('GetAnimaltype')]의 관심을 끌었다. 우리는 그 짐승이 [local_province.Custom('GetProvinceFoliageDesc')]에서 조심스럽게 주변을 살피는 모습을 지켜보았다. 녀석은 마침내 머뭇거리며 [ROOT.Char.Custom('GetAnimalChild')] 쪽으로 다가왔고, 우리는 덫을 작동시켰다!"
 gdp_merchant_luxury_contract.0044.bait_failure: "그래야 했는데... 녀석은 얼마간 차분하게 앉아서 [ROOT.Char.Custom('GetAnimalSoundParticiple')]를 내더니, 갑자기 온 힘을 다해 밧줄을 떨쳐내고 튀어 나가 [local_province.Custom('GetProvinceFoliageDesc')] 속으로 사라져 버렸다..."
 gdp_merchant_luxury_contract.0044.success: "운이 좋게도 [ROOT.Char.Custom('GetAnimalType')](이)가 전혀 눈치채지 못한 채 [local_province.Custom('GetProvinceFoliageDesc')] 속에 있었다. 커다란 [ROOT.Char.Custom('GetAnimalSoundParticiple')]와 함께 [ROOT.Char.Custom('GetAnimalColor')] 움직임이 몰아치더니, 짐승이 그물에 잡혔다!"
 gdp_merchant_luxury_contract.0044.failure: "하지만 일은 순식간에 엉망이 되었다. 우리가 눈치채자마자 그 짐승은 [ROOT.Char.Custom('GetAnimalSoundParticiple')]와 함께 [ROOT.Char.Custom('GetAnimalColor')] 움직임으로 빠르게 [local_province.Custom('GetTerrainLand')](을)를 향해 달아났다. 붙잡히기에는 너무도 겁이 많은 짐승이었다."
 gdp_merchant_luxury_contract.0044.a: "정말 멋진 한 쌍이구나!"
 gdp_merchant_luxury_contract.0044.b: "망할 놈의 짐승들!"
 gdp_merchant_luxury_contract.0044.c: "넌 이제 내 거다!"
 gdp_merchant_luxury_contract.0044.d: "망할 놈의 짐승!"
 gdp_merchant_luxury_contract.0044.e: "[ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]에 가고 싶은 생각은 없나, [hunter.GetFirstNameNoTooltip]?"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: 밀렵"
 gdp_merchant_luxury_contract.0051.desc: "[local_province.Custom('GetProvinceGroundDescAdjective')] 마을에 도착해 현지의 야생에 관해 물어보았다. 마을의 지도자는 우리더러 떠나 달라며 엄중히 경고했다. 현지 거물인 \"[rich_local.GetName]\"(이)가 이곳의 [rich_local.Custom('GetAnimalPlural')]들을 사냥하고 있다는 것이었다.\n\n하지만 우리가 떠나기도 전에, [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)] 주민이 나타나더니 [rich_local.GetTitleAsNamePossessiveNoTooltip] [rich_local.Custom('GetAnimalPlural')](을)를 하나 잡는 게 더 쉬울 거라면서 조용히 알려 주지 않는가!\n\n참으로 뻔뻔한 생각이다. 그러나 그냥 흘려 보내기엔 너무 아쉬운 기회 아닐까?"
 gdp_merchant_luxury_contract.0051.a: "[rich_local.Custom('GetAnimalType')]? 당장 가자!"
 gdp_merchant_luxury_contract.0051.a.flavor: "현지인들이 처벌받을 수도 있음..."
 gdp_merchant_luxury_contract.0051.a.tt: "[rich_local.GetShortUIName]의 짐승을 밀렵하려 시도하게 됨"
 gdp_merchant_luxury_contract.0051.b: "[rich_local.GetTitleAsNameNoTooltip]하고 얽히고 싶진 않군..."
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "내 인도자인 [hunter.GetFirstName](은)는 우리를 이끌고 [local_province.Custom('GetProvinceFoliageDesc')] 속을 빠르게 헤쳐 나가며 놀라운 속도로 [local_province.Custom('GetTerrainTypePlural')](을)를 가로질렀다. 공터에 도착한 [hunter.GetSheHe]가 갑자기 멈추며 귀를 기울였다.\n\n\"쉿!\" [hunter.GetSheHe]가 목소리를 낮추며 나를 밀어냈다. \"가까이 있습니다.\"\n\n순식간에 무리가 [local_province.Custom('GetProvinceGroundDesc')](을)를 요란하게 흔들며 우리를 지나쳐 갔고, 멀리서 사냥꾼들이 외치는 소리가 들렸다.\n\n그때 들렸다. [rich_local.Custom('GetAnimalType')]의 [rich_local.Custom('GetAnimalSound')]가!"
 gdp_merchant_luxury_contract.0052.a: "한 놈이 온다! 그물 준비!"
 gdp_merchant_luxury_contract.0052.a.success: "[rich_local.Custom('GetAnimalType')](을)를 잡음"
 gdp_merchant_luxury_contract.0052.a.neutral: "[rich_local.Custom('GetAnimalType')](을)를 놓침"
 gdp_merchant_luxury_contract.0052.a.failure: "[rich_local.Custom('GetAnimalType')](이)가 당신에게 상처를 입힘"
 gdp_merchant_luxury_contract.0052.b: "숨어라! 이만하면 됐다!"
 gdp_merchant_luxury_contract.0052.b.tt: "[rich_local.Custom('GetAnimalType')](이)가 도망침"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "마을로 돌아오자 지도자가 헐레벌떡 나오더니, [rich_local.GetTitledFirstNamePossessive] 부하들이 밀렵꾼을 찾아 이곳에 왔었다고 외치는 게 아닌가!\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName](은)는 붙잡은 [rich_local.Custom('GetAnimalType')](을)를 보며 죄책감을 느끼는 듯했다. 하지만 뿌듯한 자부심마저 잊을 정도로 죄책감이 강하진 않았다."
 gdp_merchant_luxury_contract.0053.failure: "마을 사람들이 노려보는 동안 [hunter.GetFirstName](은)는 실의에 빠진 얼굴이었다.\n\n[hunter.GetSheHe]가 자신의 거주지로 향하는데, 줄에 매인 [hunter.Custom('GetAnimalType')](이)가 나타나 [hunter.Custom('GetAnimalWalkParticiple')] [local_province.Custom('GetProvinceGroundDesc')](을)를 지나갔다."
 gdp_merchant_luxury_contract.0053.a: "\"정말 놀라운 짐승이야...\""
 gdp_merchant_luxury_contract.0053.b: "\"...[rich_local.GetTitleAsNameNoTooltip]한테 누가 짐승을 잡아갔는지 말해야겠다!\""
 gdp_merchant_luxury_contract.0053.b.flavor: "[hunter.GetFirstNameNoTooltip](이)가 당신의 대담함에 감명받음"
 gdp_merchant_luxury_contract.0053.c: "\"정말 끔찍한 발상이었어...\""
 gdp_merchant_luxury_contract.0053.d: "\"...그래도 [hunter.GetFirstNameNoTooltip], 자네 같은 인재가 필요하기는 하네.\""
 gdp_merchant_luxury_contract.0053.e: "\"[hunter.Custom('GetAnimalType')](을)를 가지고 있다는 얘긴 안 했잖나!\""
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "오늘 아침에는 [local_province.GetBaronyNameExplicitlyNoTooltip]의 [local_barony.Custom('BaronyTownType')](을)를 엿보았다. 우리가 오래도록 가고자 했던 목적지가 [local_province.Custom('GetTerrainLandPlural')]에서 모습을 드러내고 있었다."
 gdp_merchant_luxury_contract.1001.desc.locals: "관문을 지나가던 주민들은 우리가 서투른 [local_county.GetCountyData.GetCulture.GetLanguage.GetName](으)로 길을 묻자 알아듣는 데 애를 먹었다. 그래도"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "관문을 지나가던 주민들은 우리가 [local_county.GetCountyData.GetCulture.GetLanguage.GetName](으)로 길을 묻자"
 gdp_merchant_luxury_contract.1001.desc.religious: "[religious_building_province.GetBaronyNameExplicitlyNoTooltip]에 있는 거대하고도 신성한 무덤을 알려 주었다."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "[scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]에서 현자들이 모이는 학문의 중심지를 알려 주었다."
 gdp_merchant_luxury_contract.1001.desc.fallback: "현지 시장을 알려 주었다."
 gdp_merchant_luxury_contract.1001.a: "현지 [local_province.Custom('GetRegionalMarketTerm')]에는 뭐라도 있겠지."
 gdp_merchant_luxury_contract.1001.a.flavor: "[stewardship_i|E][stewardship|E], [gold_i|E][gold|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1001.a.tt: "시장에서 #V 골동품#! [domicile_artifact|E]을 입수하려고 시도함"
 gdp_merchant_luxury_contract.1001.d: "거대한 [local_province.Custom('GetRegionalMarketTerm')](이)가 우리를 부른다!"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "이 신성한 장소를 살펴보자."
 gdp_merchant_luxury_contract.1001.e.flavor: "[piety_i|E][piety|E], [learning_i|E][learning|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1001.e.tt: "종교적인 장소에서 #V 골동품#! [domicile_artifact|E]을 입수하려고 시도함"
 gdp_merchant_luxury_contract.1001.f: "분명 여기서 많은 걸 배울 수 있을 거다."
 gdp_merchant_luxury_contract.1001.f.flavor: "[learning_i|E][learning|E], [diplomacy_i|E][diplomacy|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1001.f.tt: "학문의 중심지에서 #V 골동품#! [domicile_artifact|E]을 입수하려고 시도함"
 gdp_merchant_luxury_contract.1001.return.religious: "신성한 장소로 돌아가 보자..."
 gdp_merchant_luxury_contract.1001.return.scholarly: "학문의 중심지를 찾아보자..."
 gdp_merchant_luxury_contract.1001.return.urban: "그냥 시장에 가봐야겠다..."
 gdp_merchant_luxury_contract.1001.give_up: "아, 집어치워라!"
 gdp_merchant_luxury_contract.1001.fallback: "빈손으로 [local_province.GetBaronyNameExplicitlyNoTooltip]에서 떠나진 않을 것이다."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "[local_province.Custom('GetRegionalMarketTermGloss')]에서 장신구를 찾음"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: 상업의 중심"
 gdp_merchant_luxury_contract.1101.desc: "[local_province.GetBaronyNameExplicitlyNoTooltip]의 [local_province.GetTitle.Custom('BaronyTownType')](은)는 사업으로 북적거린다. [local_province.Custom('GetProvinceAdjective')] [local_province.Custom('GetRegionalMarketTermGloss')]의 광경, 소리, 냄새가 한데 어우러지는 가운데 현지인과 여행자가 온갖 종류의 상품을 찾아 모여든다.\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "어두운 모퉁이에는 퉁명스러워 보이는 부랑아가 있었다. [urchin.GetHerHis] 충혈된 눈은 계속해서 지나가는 사람들을 말없이 쫓고 있었다."
 gdp_merchant_luxury_contract.1101.antiques: "[local_province.Custom('GetRandomRegionalWood')] 골동품과 색이 바랜 금속 유물 등이 가득한 낡은 가판대가 내 호기심을 불러일으켰다. 그러자 가판대의 [dealer.Custom('GetYoungMiddleAgedOld')] 주인이 기뻐하는 기색을 내비쳤다."
 gdp_merchant_luxury_contract.1101.bookseller: "어두컴컴한 가게의 넝마 같은 [ROOT.Char.Custom('RegionalFabric')] 차양은 벽에 기대어 쌓아 올려진 수많은 낡은 두루마리와 서적을 숨기고 있었다. [dealer.Custom('GetYoungMiddleAgedOld')] [dealer.GetWomanMan]이 가게의 주인이었다."
 gdp_merchant_luxury_contract.1101.travelers: "머리가 희끗희끗한 [traveler.GetCulture.GetCollectiveNoun] 무리가 근처 광장에 편히 자리를 잡았다. 이들의 의복과 말투는 [local_province.GetCulture.GetName] 지역 사람들과 달랐다."
 gdp_merchant_luxury_contract.1101.tavern: "길 건너편의 술집에서는 난잡한 유흥이 벌어지고 있었다. 내 시선을 잡아끈 험한 인상의 도박꾼이 심란해 보이는 도전자한테서 방금 빼앗은 동전 지갑을 빙빙 돌리고 있었다."
 gdp_merchant_luxury_contract.1101.merchant: "잘 차려입은 [other_merchant.GetWomanMan]이 상단이 마을을 느릿느릿 통과한다며 장광설을 늘어놓고 있었다. [other_merchant.GetSheHe|U]는 나와 생각이 같은 이 지역 상인인 듯했다."
 gdp_merchant_luxury_contract.1101.a: "저 아이... #EMP 약삭빠른#! 녀석 같은데."
 gdp_merchant_luxury_contract.1101.a.flavor: "[intrigue_i|E][intrigue|E], [diplomacy|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1101.a.tt: "부랑아의 말을 들어봄"
 gdp_merchant_luxury_contract.1101.b: "이 판매자한테 뭔가 흥미로운 게 있을지도 모르겠군..."
 gdp_merchant_luxury_contract.1101.b.flavor: "[learning_i|E][learning|E], [gold_i|E][gold|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1101.b.tt: "흥미로운 유물을 사려고 시도함"
 gdp_merchant_luxury_contract.1101.c: "여기라면 흥미로운 책이 한두 권쯤 있겠지."
 gdp_merchant_luxury_contract.1101.c.flavor: "[learning_i|E][learning|E], [gold_i|E][gold|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1101.c.tt: "흥미로운 책을 사려고 시도함"
 gdp_merchant_luxury_contract.1101.d: "저 [traveler.GetCulture.GetCollectiveNounNoTooltip]들이라면 분명 신기한 걸 봤겠지."
 gdp_merchant_luxury_contract.1101.d.lingua: "내 [traveler.GetCulture.GetLanguage.GetNameNoTooltip] 실력을 시험할 기회로군."
 gdp_merchant_luxury_contract.1101.d.flavor: "[diplomacy_i|E][diplomacy|E], [learning_i|E][learning|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1101.d.tt: "여행자들과 대화함"
 gdp_merchant_luxury_contract.1101.e: "운을 겨루는 놀이라면 못 참지..."
 gdp_merchant_luxury_contract.1101.e.flavor: "[intrigue_i|E][intrigue|E], 운의 과시를 선호함"
 gdp_merchant_luxury_contract.1101.e.tt: "도박꾼한테서 무얼 따낼 수 있을지 알아봄"
 gdp_merchant_luxury_contract.1101.f: "아, 경쟁자라면 날 이해할지도 모르겠군."
 gdp_merchant_luxury_contract.1101.f.flavor: "[stewardship_i|E][stewardship|E], [prestige_i|E][prestige_level|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1101.f.tt: "상인의 말을 들어봄"
 gdp_merchant_luxury_contract.1102.urchin: "[urchin.GetFirstNamePossessive|U] 경계심을 낮추기란 쉽지 않았다. 나는 지나가는 사람들을 경멸도 해 보고, [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 빈민가에 관한 이야기를 들려주며 아이의 호의를 사려고 해 보았다.\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "머나먼 곳, 상인으로 살아가는 삶이 주는 이득에 관한 이야기가 아이의 흥미를 끌었다. 내가 막 제안을 꺼내려던 찰나, 아이가 먼저 자기를 같이 데려가 주면 보석을 주겠다며 대놓고 제안해 왔다!"
 gdp_merchant_luxury_contract.1102.urchin.success: "결국 어느 정도 진전을 이루어냈다는 생각이 들자, 나는 아이에게 보석값으로 얼마를 받을 건지를 물어보았다. 아이는 음흉한 웃음을 짓더니 가격을 제시했다."
 gdp_merchant_luxury_contract.1102.urchin.failure: "결국 어느 정도 진전을 이루어냈다는 생각이 들자, 나는 아이에게 보석값으로 얼마를 받을 건지를 물어보았다. 아이는 그저 입술을 말아 올리더니 나더러 꺼지라고 했다."
 gdp_merchant_luxury_contract.1102.antiques: "나는 기민한 상인과 한참을 대화하며 상품의 제작 방식, 연대, 상태에 대해 논쟁을 벌였다.\n\n그러다 결국 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] 상인과 내 흥정이 교착 상태에 다다랐다."
 gdp_merchant_luxury_contract.1102.antiques.success: "가격은 그렇게 나쁘지 않았다. 사실 내 생각보다 훨씬 더 좋은 가격이었다."
 gdp_merchant_luxury_contract.1102.antiques.failure: "가격이 마음에 든다고는 못 하겠다. 나만 이용당한 기분이 들었으니까."
 gdp_merchant_luxury_contract.1102.bookseller: "나는 기민한 상인과 한참을 대화하며 책의 주제, 연대, 상태에 대해 논쟁을 벌였다.\n\n그러다 결국 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] 상인과 내 흥정이 교착 상태에 다다랐다."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "무리는 나를 따스하게 맞아 주었다. 이들에게는 오늘 본 것 중에서 가장 흥미로운 광경이 나인 듯했다. 우리는 곧 서로의 여행에 관한 이야기를 주고받기 시작했다."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\n우리는 곧 함께 식사하며, [local_province.GetBaronyNameExplicitly]에서 비슷하게 겪었던 불운과 경험에 대한 웃음과 농담을 나누었다. 작별을 고할 때가 되자 [traveler.GetFirstName](은)는 나를 따뜻하게 포옹하며 꾸러미를 하나 넘겨주었다."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\n짧은 소식 몇 가지를 나누고 나니 화젯거리가 금방 떨어져 버렸다. [traveler.GetCulture.GetCollectiveNoun]들도 내가 이만 떠나주기를 바라는 기색이 역력했다."
 gdp_merchant_luxury_contract.1102.tavern: "주사위로 준비하고, 번갈아 한두 번씩 이기며 동전과 험담을 주고받는 동안 승부는 팽팽하게 유지되는 듯했다. 하지만 [gambler.GetFirstName](은)는 분명히 까다로운 고객이었다.\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "오늘 [merchant.GetFaith.WealthGodName]께서 내게 웃어 주시는구나! 내가 초반에 맹렬한 기세로 밀어붙이자 상대는 말을 잃고 저주를 퍼부었으며, 점점 더 깊이 추락하더니 끝내는 자리를 박차고 나갔다. 자기 주사위를 길거리로 내던지면서 말이다!"
 gdp_merchant_luxury_contract.1102.tavern.failure: "시간은 좀 걸리긴 했지만, 결국에는 내가 기세를 잡을 수 있었다. 하지만 내가 따낸 동전을 가지고 고소해하는 동안 인내심에 한계가 온 도박사는 놀이를 끝내고 말았다."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "얼마 지나지 않아 [gambler.GetSheHe]는 모든 수단을 동원했다. 여러 번의 놀이를 거치며 내 인내심도 바닥나고 지갑은 상처를 입었다. 나는 고소해하는 [gambler.GetFirstNamePossessiveNoTooltip] 앞에서 결국 뚱한 얼굴로 물러나야 했다."
 gdp_merchant_luxury_contract.1102.merchant: "[local_province.Custom('GetRegionalMarketTermGloss')] 근처의 조용한 사무실에서 [other_merchant.GetTitledFirstName](와)과 나는 서로의 사업에 대해 긴 이야기를 나누었다. 먼 곳에 만들어 둔 상호 인맥에 대해 숙고하고, 각자의 성공을 자랑하기도 했다.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "우리는 죽이 잘 맞았다. [other_merchant.Custom('RegionalDrink')](와)과 식사를 같이 하며 서로의 요령을 교환하고, 상호 이득의 가능성에 관해서도 이야기했다. 작별할 때가 되자 [other_merchant.GetFirstNameNoTooltip](은)는 슬퍼하며, 꽤 괜찮은 표본 몇 개를 선물로 넘겨주었다."
 gdp_merchant_luxury_contract.1102.merchant.failure: "우리 사이에는 공동 관심사가 그렇게 많지 않았다. 서로의 자랑하는 모습은 물론, 유용한 정보를 나눌 의지가 전혀 없는 태도에 짜증이 났을 뿐이다. 나는 곧 재미라곤 찾아볼 수 없던 이 사람을 뒤로하고 떠나갔다."
 gdp_merchant_luxury_contract.1102.a: "바로 이거야."
 gdp_merchant_luxury_contract.1102.b: "이 정도면 충분하지..."
 gdp_merchant_luxury_contract.1111.desc: "나는 [local_province.Custom('GetProvinceAdjective')] 거리를 가로지르며 [urchin.Custom('GirlBoy')](을)를 향해 다가갔다. 날 발견한 아이의 예리한 시선이 설명을 요구하는 듯했다. 하지만 나는 아이가 기대고 있는 벽으로 슬쩍 다가가며, 내가 위협적인 존재가 아니라는 점을 확실히 했다.\n\n아이의 손에서 빛나는 장신구가 유혹하듯 반짝였다. 하지만 아이가 내 시선을 눈치채더니 재빠르게 장신구를 치웠다. \"원하는 게 뭐예요?\" 아이가 내뱉었다. \"전 [urchin.GetFirstName](이)라고 해요. 이 구역은 #EMP 제#! 건데.\""
 gdp_merchant_luxury_contract.1111.a: "너 뭘 좀 아는 녀석 같구나."
 gdp_merchant_luxury_contract.1111.a.success_critical: "아이의 신뢰를 얻음"
 gdp_merchant_luxury_contract.1111.a.success: "아이의 약탈품을 삼"
 gdp_merchant_luxury_contract.1111.a.failure: "아이에게 경멸을 삼"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "[urchin.GetFirstName](이)가 [local_province.GetBaronyNameExplicitly]의 거리에서 훔친 물건입니다."
 gdp_merchant_luxury_contract.1111.artifact.ring: "[local_county.GetAdjectiveNoTooltip] 반지"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "[local_county.GetAdjectiveNoTooltip] 브로치"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "[local_county.GetAdjectiveNoTooltip] 목걸이"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "나는 거래 대상인 글을 읽으며 무관심한 척하고 내 흥미의 정도를 숨겼다. 물론 상점 주인에게 내 태도가 얼마나 먹혔는지는 알 수 없었다.\n\n내 마음은 곧 다른 물건보다 월등히 좋아 보이는 어느 상품으로 향했다. 세월의 흐름이 더해진 이 물건은 원산지인 이곳에서도 이국적인 매력을 뽐내고 있었다."
 gdp_merchant_luxury_contract.1121.a: "가격 얘기를 해 볼까..."
 gdp_merchant_luxury_contract.1121.a.success_critical: "아주 좋은 가격으로 흥정함"
 gdp_merchant_luxury_contract.1121.a.success: "좋은 가격으로 흥정함"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetSheHe|U]가 사정없이 가격을 올림"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "골동품 [artifact.GetName]"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] 세월이 흐르며 닳은 탓에 전투에는 사용할 수 없습니다."
 gdp_merchant_luxury_contract.1121.artifact.bowl: "골동품 [local_province.GetCounty.GetCulture.GetNameNoTooltip] 그릇"
 gdp_merchant_luxury_contract.1121.artifact.plate: "골동품 [local_province.GetCounty.GetCulture.GetNameNoTooltip] 접시"
 gdp_merchant_luxury_contract.1121.artifact.urn: "골동품 [local_province.GetCounty.GetCulture.GetNameNoTooltip] 항아리"
 gdp_merchant_luxury_contract.1131.desc: "나는 거래 대상인 상품을 살펴보며 무관심한 척하고 내 흥미의 정도를 숨겼다. 물론 상점 주인에게 내 태도가 얼마나 먹혔는지는 알 수 없었다.\n\n내 마음은 곧 다른 물건보다 월등히 좋아 보이는 어느 상품으로 향했다. 희귀하면서도 그 가치가 평가절하된 물건 같았다."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] [local_province.GetBaronyNameExplicitly]의 판매자에게서 획득했습니다."
 gdp_merchant_luxury_contract.1141.desc: "나는 온화한 미소를 지으며 무리의 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )] 지도자에게 다가갔다. 낯선 장소의 이방인이라는 공통점이 우리를 하나로 묶어 주기를 바랄 뿐이었다.\n\n[traveler.GetWomanMan]은 자신을 [traveler.GetFirstName](으)로 소개했다. 나 또한 자신을 소개했다. \"[merchant.GetNameNoTooltip](이)라 하오. 소문은 들어 보셨을 텐데?\" 반쯤은 허세였고, 반쯤은 농담이었다."
 gdp_merchant_luxury_contract.1141.a: "분명 재미있는 이야기를 알고 계시겠군!"
 gdp_merchant_luxury_contract.1141.a.flavor: "당신의 [diplomacy_i|E][diplomacy|E], [prestige_i|E][prestige_level|E] 시험"
 gdp_merchant_luxury_contract.1141.a.success: "당신이 [traveler.GetFirstNameNoTooltip](와)과 잘 지냄"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip](이)가 당신에게 질림"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] [local_province.GetBaronyNameExplicitly]의 판매자에게서 획득했습니다. 세월이 흐르며 닳은 탓에 전투에는 사용할 수 없습니다."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "[traveler.GetCulture.GetNameNoTooltip] 브로치"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ [local_province.GetBaronyNameExplicitly]의 여행자에게서 획득했습니다."
 gdp_merchant_luxury_contract.1151.desc: "커튼을 헤치고 어두침침한 소굴로 들어간 나는 방탕한 이들과 방랑자 사이에 있었다. 방의 가운데에 앉은 도박사가 즐겁게 동전을 세고 있었다.\n\n내가 반대편에 앉자 도박사가 눈썹을 치켜올리며 나를 훑어보았다. \"왜, 한 판 하시려고?\" 도박사가 미소를 지었다. \"난 [gambler.GetFirstName](이)라고 합니다. 나중에 동전 빼앗겼다고 울지나 마시지요.\""
 gdp_merchant_luxury_contract.1151.a: "어디 해볼까."
 gdp_merchant_luxury_contract.1151.a.flavor: "당신의 [intrigue_i|E][intrigue|E], 운 시험"
 gdp_merchant_luxury_contract.1151.a.success: "당신이 [gambler.GetHerHim]의 돈을 다 털어감"
 gdp_merchant_luxury_contract.1151.a.failure: "당신이 동전을 약간 땀"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "당신이 동전을 약간 잃음"
 gdp_merchant_luxury_contract.1151.artifact.dice: "도박사의 행운의 주사위"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "[local_province.GetBaronyNameExplicitly]의 악당 도박사인 [gambler.GetFirstName]에게서 어렵게 얻어낸 주사위입니다."
 gdp_merchant_luxury_contract.1161.desc: "나는 상인의 불평을 가로막으며 나를 [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에 거점을 둔 [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]의 우두머리라고 소개했다. 사업차 이곳에 온 것이 아니라는 사실도 덧붙였다.\n\n답례로 [other_merchant.GetSheHe]의 이름이 [other_merchant.GetName](이)고, [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly] 출신이며 여기서 [merchant_good.GetName](을)를 거래하고 있다는 사실을 알게 되었다. 서로를 알게 되자 [other_merchant.GetSheHe]가 근처에 내 숙소를 마련해 주겠다고 제안했다."
 gdp_merchant_luxury_contract.1161.a: "함께 논의할 사항이 많군."
 gdp_merchant_luxury_contract.1161.a.flavor: "당신의 [stewardship_i|E][stewardship|E], [prestige_i|E][prestige_level|E] 시험"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip](이)가 당신에게 마음을 열어 보임"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip]의 마음이 바뀌지 않음"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "천 표본"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]의 [other_merchant.Custom('RegionalFabric')] 표본입니다. 상인들이 거래에 사용하는 물건입니다."
 gdp_merchant_luxury_contract.1161.artifact.gem: "보석 표본"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]의 귀중한 원석 표본입니다. 상인들이 거래에 사용하는 물건입니다."
 gdp_merchant_luxury_contract.1161.artifact.gold: "금속 표본"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "[local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip]의 귀중한 금속 표본입니다. 상인들이 거래에 사용하는 물건입니다."
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: 종교적 중심지"
 gdp_merchant_luxury_contract.1501.desc: "우리는 수많은 순례자와 숭배자가 걷는 길을 따랐고, 머지않아 [religious_building_province.GetName]의 웅장한 [religious_building_district.GetType.GetPrimaryBuildingType.GetName](이)가 나타났다.\n\n"
 gdp_merchant_luxury_contract.1501.site: "무덤은 옛날 [religious_building_faith.GetReligion.GetAdjective] 영주의 [religious_building_faith.HighGodName](을)를 향한 열성에 바치는 위대한 기념비였다. 안에서는 예배가 진행되는 동안 중얼거리는 소리가 음악처럼 흘러나왔다."
 gdp_merchant_luxury_contract.1501.tombs: "조금만 가면 [religious_building_faith.ReligiousSymbol](이)가 표시된 닳아 빠진 돌무덤이 드러나 있는데, 수많은 계절을 거치며 잡초에 뒤덮이고 침식된 모습이었다."
 gdp_merchant_luxury_contract.1501.pilgrim: "순례자의 의복을 한 신자들이 긴 줄을 이루고 서서 입장을 기다렸다. 특히 그중에서 눈에 띄는 무리가 있었는데, 이들은 유물 같은 것을 가지고 있었다."
 gdp_merchant_luxury_contract.1501.monks: "수도사 일행이 근처의 그늘에 조용히 모여 있었다. 주변의 세상이 나른하게 흐르는 동안 이들은 조용히 대화를 주고받으며 명상했다."
 gdp_merchant_luxury_contract.1501.keepsake: "건축물로 다가가자 닳은 석조 부분이 보였다. 시간의 흐름에 바위 여러 개가 느슨해지며 금이 가 있었다."
 gdp_merchant_luxury_contract.1501.apostate: "근심 가득해 보이는 어느 [pilgrim.GetWomanMan]이 그림자 속에 홀로 앉아 있었다. 이 사람은 무릎에 팔꿈치를 대고 한 손으로는 얼굴을 받쳤으며, 나머지 손에는 작은 책을 들고 있었다."
 gdp_merchant_luxury_contract.1501.a: "내부를 보고 싶군."
 gdp_merchant_luxury_contract.1501.a.flavor: "[learning_i|E][learning|E], [piety_i|E][piety|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1501.a.tt: "당신이 [religious_building_faith.HouseOfWorship] 안을 봄"
 gdp_merchant_luxury_contract.1501.b: "이 무덤에 분명히 뭔가 있을 거다..."
 gdp_merchant_luxury_contract.1501.b.flavor: "[intrigue_i|E][intrigue|E], [prowess_i|E][prowess|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1501.b.tt: "무덤을 뒤지려고 밤에 돌아옴"
 gdp_merchant_luxury_contract.1501.c: "저 순례자들은 귀가 얇을 것 같은데..."
 gdp_merchant_luxury_contract.1501.c.flavor: "[intrigue_i|E][intrigue|E], [diplomacy_i|E][diplomacy|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1501.c.tt: "순례자에게 사기를 치려 시도함"
 gdp_merchant_luxury_contract.1501.d: "저 수도사들과 이야기를 해봐야겠다."
 gdp_merchant_luxury_contract.1501.d.flavor: "[learning_i|E][learning|E], [piety_i|E][piety|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1501.d.tt: "수도사와 대화를 시작함"
 gdp_merchant_luxury_contract.1501.e: "돌 하나쯤 사라진다고 눈치챌 사람은 없겠지..."
 gdp_merchant_luxury_contract.1501.e.flavor: "[intrigue_i|E][intrigue|E], [prowess_i|E][prowess|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1501.e.tt: "건축물의 한 조각을 빼돌리려 시도함"
 gdp_merchant_luxury_contract.1501.f: "저 [pilgrim.GetWomanMan]한테 도움이 필요해 보이는군."
 gdp_merchant_luxury_contract.1501.f.flavor: "[diplomacy_i|E][diplomacy|E], [piety_i|E][piety|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1501.f.tt: "순례자와 대화를 시작함"
 gdp_merchant_luxury_contract.1502.site: "숭배자들이 기도와 소원을 읊조리며 우리를 지나가는 가운데, [priest.Custom('PriestTitle')](이)가 나를 신중하게 위아래로 훑어보며 내 말과 표정을 가늠했다.\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "마침내 [priest.GetSheHe]가 한숨을 쉬었다. \"그대의 진실한 요청을 거절할 수가 없군요.\" [priest.GetSheHe|U]는 근처의 책으로 손을 뻗었다. [priest.GetHerHis] 손가락이 책 표지를 잠시 만지작거리다가 내게 책을 내밀었다.\n\n\"받으십시오, 친구여. 여기서 [religious_building_faith.HighGodNameAlternate]의 말씀을 깨달으실 수 있기를.\""
 gdp_merchant_luxury_contract.1502.site.failure: "마침내 [priest.GetSheHe]가 얼굴을 찌푸렸다. \"가십시오. 길을 잘못 찾아오셨군요. 이곳은 숭배의 장소인 [religious_building_faith.HouseOfWorship]입니다. 이런 어리석은 짓에 어울릴 시간은 없습니다.\"\n\n여러 숭배자가 돌아서더니 떠나라는 듯 나를 바라보았다."
 gdp_merchant_luxury_contract.1502.pilgrim: "친근한 물음 끝에 나는 결국 순례자들이 고향 근처에서 유물을 획득했으며, [pilgrim.GetFaith.HouseOfWorship]에 바치려고 여기까지 가져왔다는 사실을 알게 되었다.\n\n나는 속아 넘어가 버린 이 순례자들이 안타깝다는 듯 놀라고 걱정하는 척을 했다!\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "마음이 상한 티를 냈지만 사실 화가 나지는 않았다. 나는 순례자들이 구역 너머의 황무지에 작은 상자를 던지고 사라지는 모습을 지켜보았다."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "하지만 이들의 반응에 나는 당황했다. 순례자들이 유물을 바닥에 던지더니 짓밟고 부수며 산산이 조각냈고, 군중이 깜짝 놀랐다.\n\n여기서 떠나는 게 좋겠다..."
 gdp_merchant_luxury_contract.1502.tomb: "무덤이 보기보다 열기 힘들었다! 우리는 결국 커다란 기념비 하나를 온 힘을 다해 들어 올려서 비틀어 열었다.\n\n땀을 닦아내고 어두컴컴한 안쪽을 바라보니 무언가가 보였다. 나는 조심스럽게 손을 뻗어 그것을 잡아들었다.\n\n\"빛을 가져와라!\" 나는 급히 속삭였다.\n\n내 손에 잡힌 것은..."
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "정교하게 만들어진 장식 항아리였다!"
 gdp_merchant_luxury_contract.1502.tomb.success: "닳고 손상된 항아리인가?"
 gdp_merchant_luxury_contract.1502.tomb.failure: "#EMP 뼈#! 아닌가?"
 gdp_merchant_luxury_contract.1502.monks: "수도사들은 생각보다 훨씬 흥미로운 존재였다! [monk.GetFaith.ReligiousText]에서 [monk.GetFaith.TricksterGodName]의 수수께끼에 이르기까지, 성직자의 삶에는 수많은 호기심 어린 해석과 통찰이 있었다.\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "우리는 흥미로운 대화를 이어 나갔고, 수도사들은 나와 헤어지는 게 슬픈 눈치였다. [monk.GetFirstName](은)는 온화한 미소로 작별을 고하며 내 손에 무언가를 쥐여 주었다."
 gdp_merchant_luxury_contract.1502.monks.failure: "하지만 내가 말할 차례가 올 때마다 [monk.GetFirstName](은)는 불편해하거나 무관심한 모습을 보이며 흥미를 잃고 있었다. 결국 내가 눈치 없이 오래 머물렀다는 사실만 깨닫고 말았다."
 gdp_merchant_luxury_contract.1502.keepsake: "나는 마지막으로 한 번 돌아본 뒤, 매끄러운 동작으로 돌을 두드린 다음 붙잡아 챙기려고 온 힘을 다했다.\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "나는 우아하고 능숙하게 벽의 작은 조각을 떼어내 옷 안으로 숨긴 뒤, 태연하게 걸어갔다. 아무도 눈치채지 못한 것 같다!"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "쓸데없는 움직임 때문에 나는 땅바닥에 쿵 하고 부딪히며 고통에 소리를 내고 말았다. 호기심이 생긴 순례자 몇몇이 의심스럽다는 눈초리로 나와 벽을 번갈아 바라보았다."
 gdp_merchant_luxury_contract.1502.apostate: "이 [pilgrim.GetWomanMan]은 내가 옆에 앉아서 [merchant.GetFaith.ReligiousText]에서 가장 좋아하는 구절을 작게 외는데도 아는 체를 하지 않았다. 하지만 곧 울음을 멈추더니 내 말에 귀를 기울이기 시작했다.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "[pilgrim.GetSheHe]가 내 말에 마음을 여는 게 느껴졌다. [pilgrim.GetFirstName](은)는 얼마 지나지도 않아서 이곳을 떠나고 싶다고 얘기하더니, 나와 함께 [merchant.GetFaith.HighGodNameAlternate](을)를 따르고 싶다고 했다!"
 gdp_merchant_luxury_contract.1502.apostate.success: "내가 구절을 읽는 동안, [pilgrim.GetHerHim]의 어깨에서 무거운 짐이 덜어진 듯 [pilgrim.GetHerHis] 기분이 변하는 게 느껴졌다.\n\n[pilgrim.GetSheHe]는 한마디 말도 없이 일어서더니 이 구역을 걸어 나갔다. [pilgrim.GetHerHis] 낡은 책을 내 옆에 놓아두고서."
 gdp_merchant_luxury_contract.1502.apostate.failure: "하지만 얼마 지나지도 않아 [pilgrim.GetHerHis] 얼굴이 굳어지더니 새로운 감정이 나타나기 시작했다. 분노였다.\n\n[pilgrim.GetHerHim]는 내가 자신을 다른 곳도 아닌 [pilgrim.GetFaith.HouseOfWorship]의 땅에서 배교의 길로 이끌고 있다며 외쳤다! 덕분에 화가 난 구경꾼들까지 몰려들었다..."
 gdp_merchant_luxury_contract.1502.a.critical: "바로 이거지!"
 gdp_merchant_luxury_contract.1502.a: "바로 이거야."
 gdp_merchant_luxury_contract.1502.b: "이 정도면 충분하지..."
 gdp_merchant_luxury_contract.1511.desc: "해가 지자 우리는 [religious_building_district.GetType.GetPrimaryBuildingType.GetName] 근처로 살금살금 돌아가 오래전 죽은 현지인들의 잊힌 무덤에서 보물을 찾아다녔다.\n\n혹시 들킬까 두려워 일반적인 길은 신중하게 피해 다녔고, 결국에는 차갑고 고요한 묘지에 도착했다."
 gdp_merchant_luxury_contract.1511.a: "빨리 무덤을 열자!"
 gdp_merchant_luxury_contract.1511.a.flavor: "당신의 [intrigue_i|E][intrigue|E], [prowess_i|E][prowess|E] 시험"
 gdp_merchant_luxury_contract.1511.a.success_critical: "비싼 유물을 찾음"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "높은 품질의 #V 골동품#! [domicile_artifact|E]을 찾음"
 gdp_merchant_luxury_contract.1511.a.success: "단순한 유물을 찾음"
 gdp_merchant_luxury_contract.1511.a.success.tt: "낮은 품질의 #V 골동품#! [domicile_artifact|E]을 찾음"
 gdp_merchant_luxury_contract.1511.a.failure: "특별한 것은 찾지 못함"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "#V 골동품#! [domicile_artifact|E]을 찾음"
 gdp_merchant_luxury_contract.1511.artifact.urn: "[religious_building_faith.GetAdjectiveNoTooltip] 부장품"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "오래전에 사망한 [religious_building_faith.GetAdherentName]의 무덤에서 나온 항아리입니다. [religious_building_district.GetType.GetPrimaryBuildingType.GetName]에서 노획했습니다."
 gdp_merchant_luxury_contract.1511.artifact.skull: "노획한 두개골"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "오래전에 사망한 [religious_building_faith.GetAdherentName]의 두개골입니다. [religious_building_district.GetType.GetPrimaryBuildingType.GetName]의 무덤에서 노획했습니다."
 gdp_merchant_luxury_contract.1511.artifact.bone: "노획한 [priest.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "오래전에 사망한 [religious_building_faith.GetAdherentName]의 뼈입니다. [religious_building_district.GetType.GetPrimaryBuildingType.GetName]의 무덤에서 노획했습니다."
 gdp_merchant_luxury_contract.1521.desc: "커다란 문을 지나 어둠 속으로 들어서자, 화려하게 장식된 현관이 나를 맞이했다. 이국적인 의례의 향기와 공물로 가득한 곳이었다.\n\n숭배자들이 한 [priest.GetWomanMan]을 중심으로 둥글게 서 있었는데, 회중과 이야기하던 이 [priest.Custom('PriestTitle')](이)가 곧바로 나를 눈치챘다. 내가 너무 눈에 띄어 보이는 모양이었다.\n\n[priest.GetSheHe|U]가 [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )] 다가왔다. \"반갑습니다, 여기는 [religious_building_district.GetType.GetPrimaryBuildingType.GetName]입니다.\"\n\n\"무엇 때문에 오셨습니까?\" [priest.GetSheHe]가 호기심 가득한 시선으로 나를 보며 물었다. \"[religious_building_faith.GetNameNoTooltip]의 계율을 따르는 분인지요?\""
 gdp_merchant_luxury_contract.1521.a: "[religious_building_faith.GetNameNoTooltip]에 대해 배울 수 있는 건 전부 배우고 싶소."
 gdp_merchant_luxury_contract.1521.a.flavor: "당신의 [learning_i|E][learning|E], [piety_i|E][piety_level|E] 시험"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('PriestTitle')](이)가 책을 줌"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('PriestTitle')](이)가 의심함"
 gdp_merchant_luxury_contract.1531.desc: "내가 다가가자 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )] 순례자들은 의심스럽다는 눈길로 바라보았고, 더 잘 보려고 기웃거리자 자기들의 유물을 꽉 움켜쥐었다.\n\n확실히 [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip]에 있어 중요한 물건이었고, [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip](으)로 가져가면 근사한 화젯거리가 될 듯했다.\n\n나라면 이 시골뜨기들이 행상인이나, 악랄한 [pilgrim.GetFaith.PriestNeuter]한테 속았다고 믿게 만들 수 있겠지..."
 gdp_merchant_luxury_contract.1531.a: "누가 봐도 가짜군. [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]에는 이런 게 수백 개가 있던데..."
 gdp_merchant_luxury_contract.1531.a.success: "순례자들이 유물을 버림"
 gdp_merchant_luxury_contract.1531.a.failure: "순례자들이 화가 남"
 gdp_merchant_luxury_contract.1541.desc: "수도사들은 처음에는 내 낯선 방식을 미심쩍어하며 바라보았지만, 호기심까지 숨기지는 못했다. 특히 내가 신학에 관해 얘기하고 싶다고 하니 더 그랬다.\n\n그중에서도 젊은 축은 의심스러워하는 듯했지만, 지도자인 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )] [monk.GetFirstName](은)는 나를 자기들 무리로 환영하며 내 여행에 관한 질문을 쏟아붓기 시작했다."
 gdp_merchant_luxury_contract.1541.a: "그래, 맞소. 근데 [monk.GetFaith.WealthGodName]에 대한 그대의 생각은 어떤지?"
 gdp_merchant_luxury_contract.1541.a.flavor: "당신의 [learning_i|E][learning|E], [piety_i|E][piety_level|E] 시험"
 gdp_merchant_luxury_contract.1541.a.success: "수도사들이 토론을 즐김"
 gdp_merchant_luxury_contract.1541.a.failure: "수도사들이 전혀 감동하지 않음"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "[religious_building_faith.GetAdjectiveNoTooltip]의 기도용 구슬"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "[religious_building_faith.GetAdjective]의 기도용 구슬로, [religious_building_district.GetType.GetPrimaryBuildingType.GetName]의 수도사가 준 선물입니다."
 gdp_merchant_luxury_contract.1541.artifact.icon: "[religious_building_faith.GetAdjectiveNoTooltip] 이콘"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "장인 정신으로 [newly_created_artifact.GetFeatureText('icon_decoration')](을)를 묘사한 [SCOPE.Custom('ArtifactQuality')]의 [SCOPE.Custom('ArtifactArticleWealth')] 이콘입니다. [religious_building_district.GetType.GetPrimaryBuildingType.GetName]의 수도사 [monk.GetFirstName](이)가 준 선물입니다."
 gdp_merchant_luxury_contract.1551.desc: "나는 슬쩍 주위를 둘러보며 [religious_building_district.GetType.GetPrimaryBuildingType.GetName] 부근을 편하게 산책했다. 지나가는 사람들을 향해 예의 바른 미소도 지어 주고, 건축을 감상하는 척도 했다.\n\n그러다가 단지 변두리의 가장 고요한 곳에서, 이미 헐거워진 것 같은 석조물의 한 부분에 집중하기 시작했다."
 gdp_merchant_luxury_contract.1551.a: "때만 잘 맞추면 된다..."
 gdp_merchant_luxury_contract.1551.a.success: "석조물의 한 조각을 훔침"
 gdp_merchant_luxury_contract.1551.a.failure: "현장에서 발각당함"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "신성한 석조물"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "[religious_building_district.GetType.GetPrimaryBuildingType.GetName]의 종교적인 중심지에서 기념품 삼아 훔쳐낸 작은 석조물 조각입니다."
 gdp_merchant_luxury_contract.1561.desc: "[pilgrim.GetWomanMan]에게 다가가자 [pilgrim.GetSheHe] 역시 순례자라는 사실을 알 수 있었다. 여기 있는 수많은 이들처럼 여행용 짐을 가득 챙기고 햇볕에 그을린 모습이었다.\n\n나는 [pilgrim.GetHerHis] 이름이 [pilgrim.GetFirstName](이)라는 것을 알아냈으며, [pilgrim.GetSheHe]는 수많은 불운 끝에 [pilgrim.GetFaith.GetAdjectiveNoTooltip] [pilgrim.GetFaith.HighGodName]에 대한 믿음을 잃었다고 한다. 이 순례마저도 그 신앙을 되돌리지는 못했다.\n\n[pilgrim.GetHerHis] 눈물로 얼룩져 심하게 낡아 버린 [pilgrim.GetFaith.ReligiousText](이)가 보였다. [pilgrim.GetHerHis] 투쟁을 그대로 보여주는 듯했다."
 gdp_merchant_luxury_contract.1561.a: "[merchant.GetFaith.ReligiousText]에 답이 있을지니..."
 gdp_merchant_luxury_contract.1561.a.flavor: "당신의 [diplomacy_i|E][diplomacy|E], [piety_i|E][piety_level|E] 시험"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip](이)가 개종함"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip](이)가 기운을 얻음"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip](이)가 격분함"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "눈물로 얼룩진 [religious_building_faith.ReligiousText|U]"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "신앙을 잃고 근심으로 가득한 [pilgrim.GetFaith.GetAdherentNameNoTooltip], [pilgrim.GetFirstName]의 개인 경전입니다."
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: 지식의 중심지"
 gdp_merchant_luxury_contract.1601.desc: "나는 [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]의 규모에 충격을 받았다. 넓은 부지와 회당에 학구적인 열정을 가진 수많은 이들이 모여 토론하거나 생각에 잠겨 있었다.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "계속해서 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] 모습을 보이는 [scholar.GetWomanMan]이 수행원들에게 둘러싸여 바쁘게 움직이며, [scholar.GetHerHis] 동료들을 거만하게 무시했다. 이곳의 책임자임이 틀림없었다."
 gdp_merchant_luxury_contract.1601.sages: "땅에 솟아난 어느 나무 아래에 주름이 쪼글쪼글한 노인이 조용히 앉아 있었다. 우주에 관한 심오한 의문에 대해 생각하고 있을 수도 있지만, 그저 잠깐 졸고 있는지도 모르는 일이다."
 gdp_merchant_luxury_contract.1601.library: "문을 지나가자 웅장한 도서관에서 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [scholar.GetWomanMan] 혼자 책으로 이루어진 왕국에 둘러싸여 있었다. [scholar.GetSheHe|U]는 조용히 글을 읽으며 행복을 만끽하는 듯했다."
 gdp_merchant_luxury_contract.1601.physician: "다른 방에서 한 [physician.GetWomanMan]이 동물과 인간을 가리지 않는 으스스한 표본과 다양한 도구를 관리하고 있었다. [physician.GetSheHe]가 제발 약제사이길 바랄 수밖에 없는 광경이었다..."
 gdp_merchant_luxury_contract.1601.student: "특히 시끄러운 학생 무리가 관심을 끌었다. 이들은 중앙 광장의 그늘진 곳에서 서로를 놀리고, 숨이 넘어가도록 웃어대며 사람 좋게 토론을 벌이고 있었다."
 gdp_merchant_luxury_contract.1601.botanist: "시설의 조용한 모퉁이에 어떤 방이 있었다. 이곳에 가득한 기이한 식물과 짐승은 [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] [botanist.GetWomanMan]의 손을 거쳐 보존과 분류가 되고 있었다."
 gdp_merchant_luxury_contract.1601.a: "저 사람이 바로 학장이겠군."
 gdp_merchant_luxury_contract.1601.a.flavor: "[diplomacy_i|E][diplomacy|E], [prestige_i|E][prestige_level|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1601.a.tt: "학장에게 다가감"
 gdp_merchant_luxury_contract.1601.b: "저 노인한테 관심이 간다..."
 gdp_merchant_luxury_contract.1601.b.flavor: "[learning_i|E][learning|E], [piety_i|E][piety_level|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1601.b.tt: "현자에게 다가감"
 gdp_merchant_luxury_contract.1601.c: "도서관에는 언제나 지식이 있는 법."
 gdp_merchant_luxury_contract.1601.c.flavor: "[learning_i|E][learning|E], [diplomacy_i|E][diplomacy|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1601.c.tt: "도서관에 들어감"
 gdp_merchant_luxury_contract.1601.d: "의약의 길은 흥미롭지."
 gdp_merchant_luxury_contract.1601.d.flavor: "[learning_i|E][learning|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1601.d.tt: "의사에게 다가감"
 gdp_merchant_luxury_contract.1601.e: "저 학생들이 재미있어 보이는데."
 gdp_merchant_luxury_contract.1601.e.flavor: "[diplomacy_i|E][diplomacy|E], [prowess_i|E][prowess|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1601.e.tt: "학생들에게 다가감"
 gdp_merchant_luxury_contract.1601.f: "수집한 표본들이 정말 아름답군."
 gdp_merchant_luxury_contract.1601.f.flavor: "[learning_i|E][learning|E], [diplomacy_i|E][diplomacy|E]의 과시를 선호함"
 gdp_merchant_luxury_contract.1601.f.tt: "수집품을 살펴봄"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "원래 [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName] 소장품의 일부였습니다."
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName](은)는 내가 완전히 이해할 때까지 내 생각의 수준을 따라 주었다. 어쨌든 나는 이 종잇장이 제대로 먹히지도 않는 먼 곳에서 오지 않았는가.\n\n필요한 논쟁을 거친 나는 기대하는 마음으로 [scholar.GetHerHim]의 말을 기다렸다."
 gdp_merchant_luxury_contract.1602.dean.success: "[scholar.GetHerHis] 얼굴에 환한 미소가 번졌다. [scholar.GetSheHe]가 내가 가진 자질... 을 인정하는 공식적인 서류를 가져왔다."
 gdp_merchant_luxury_contract.1602.dean.failure: "[scholar.GetHerHis|U] 냉랭한 얼굴이 더 굳어지더니, 민망하게도 나한테 떠나 달라고 했다."
 gdp_merchant_luxury_contract.1602.sages: "우리는 한참 동안 철학에 관해 대화하며 평소에는 입 밖으로 잘 내지 않는 질문을 곱씹었다. 그동안 하늘이 천천히 어두워지고, 또 하루의 일과가 잦아드는 줄도 몰랐다.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "드디어 [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan]이 일어서서 옷에서 무언가를 꺼내더니, 의미심장하게 고개를 끄덕이며 나한테 건네주었다. 그러고는 허례허식 없이 자리를 떴다."
 gdp_merchant_luxury_contract.1602.sages.failure: "드디어 [sage.Custom('GetYoungMiddleAgedOld')] [sage.GetWomanMan]이 일어서서 자기 옷을 당기더니, 격식을 차리지도 않고 자리를 떴다. 뭐, 적어도 대화는 즐거웠으니 다행이지..."
 gdp_merchant_luxury_contract.1602.library: "나는 [scholar.GetHerHis] 글에 관심이 있다는 신호를 보냈다. 그러자 [scholar.GetSheHe]는 자신을 [scholar.GetFirstName](이)라고 소개했다. 한참 동안 [scholar.GetSheHe]는 자기 연구의 일부로서 자신이 지금까지 읽었고, 아직 읽지 않았던 글을 나열하며 내 의견을 물어보았다.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip](은)는 곧 아이처럼 환하게 웃기 시작했다. 마침내 떠나야 할 시간이 오자, [scholar.GetSheHe]가 몰래 한쪽 눈을 찡긋하며 작은 책을 건네주었다."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip](은)는 나와 내 대답에 빠르게 흥미를 잃었고, 무례하게도 자신의 글로 다시 관심을 돌렸다. 나 역시 자리를 떠났다."
 gdp_merchant_luxury_contract.1602.physician: "나는 해부학이라는 주제에 대한 관심을 표현하며 최대한 많이 공헌하겠다는 의지도 드러냈다. [physician.GetSheHe|U]는 신체의 작동 방식에 대해 한참 얘기하더니, 요점을 강조하고자 뼈로 이루어진 소품까지 가져왔다.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "[physician.GetSheHe|U]는 내 지식에 감명받은 듯 보였고, [scholar.GetHerHis] 학생과 동료들의 무지를 한탄하더니 내게 무언가를 보여주었다."
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetSheHe|U]는 내 질문에 어이가 없다는 듯 짜증스럽게 시선을 피하며 설명하기를 망설였다. 그러더니 머지않아 뻔한 핑계를 찾아 나를 방에서 내쫓아 버렸다."
 gdp_merchant_luxury_contract.1602.student: "우리는 [student.Custom('GetPubName')]에서 시끌벅적한 시간을 보냈다. 나는 앳된 탕아들 한가운데에서 내 여행담을 나누고, 이들이 던지는 수많은 질문에 답해 주었다.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "우리는 술집에서 술집으로 자리를 옮겼고, 머지않아 아침이 찾아왔다. 결국 마지막으로 길가에서 시간을 보낸 뒤 헤어졌는데, 그중 한 명이 무언가를 내 손에 쥐여 주었다. 정말 끝내주는 밤이었다!"
 gdp_merchant_luxury_contract.1602.student.failure: "상황은 잘 풀리는 듯했다. 하지만 이들은 곧 나를 지루해했고, 정신을 차리니 나는 잔을 들고 마을 반대편에 혼자 있었다. 내가 뭐 잘못 말하기라도 했나?"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName](은)는 열성적으로 자신의 수집품을 안내했으며, 아름답고 호기심을 불러일으키는 엄선된 물건들을 소개해 주었다.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "[botanist.GetSheHe|U]는 내 흥미에 크게 감동을 받았고, 열정적으로 고개를 끄덕이며 물건들의 희귀한 정도와 그 출처를 설명했다.\n\n내가 떠나야 할 시간이 되자, [botanist.GetSheHe]는 내가 특히 눈여겨보았던 물건을 작은 선물로 넘겨주었다."
 gdp_merchant_luxury_contract.1602.botanist.failure: "내가 수집품이나 [botanist.GetHerHis] 안내를 제대로 이해하지 못한 것 같았다. 곧 [botanist.GetSheHe]도 내 존재가 자신에게 필요 없다는 점을 확실히 했다..."
 gdp_merchant_luxury_contract.1602.a: "소중히 여겨야지!"
 gdp_merchant_luxury_contract.1602.b: "뭐, 나름대로 의미는 있군."
 gdp_merchant_luxury_contract.1611.desc: "학장은 처음에는 나를 무시하는 듯했지만, 내가 머나먼 [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]에서 온 성공한 상인이라는 것을 알리자 굉장히 우쭐해하며 자신을 [scholar.Custom('MistressMaster')|U] [scholar.GetFirstName](이)라고 소개했다.\n\n[scholar.GetSheHe|U]는 나를 자신의 개인 집무실로 불렀고, 가면서 특이한 건축 사항과 궁금해할 만한 사항을 알려 주었다. \"그래서 무슨 일로 오셨습니까, [merchant.GetTitledFirstNameNoTooltip]?\" [scholar.GetSheHe]가 웃었다."
 gdp_merchant_luxury_contract.1611.a: "여기서 공부할 기회가 있으면 좋겠는데..."
 gdp_merchant_luxury_contract.1611.a.flavor: "당신의 [diplomacy_i|E][diplomacy|E], [prestige_i|E][prestige_level|E] 시험"
 gdp_merchant_luxury_contract.1611.a.success_critical: "명예 학위를 받음"
 gdp_merchant_luxury_contract.1611.a.success: "대가를 내고 명예 학위를 받으라는 제안이 들어옴"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip](이)가 불쾌하게 여김"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "명예 학위"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "명예 학습 증명서입니다. [local_province.GetBaronyNameExplicitly]에 있는 [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName]의 학장이 수여했습니다."
 gdp_merchant_luxury_contract.1621.desc: "나는 깊이 집중하고 있는 현자를 방해하지 않으려고 조심스럽게 다가갔다. 하지만 오히려 [sage.GetSheHe]가 나를 놀라게 했다!\n\n\"함께하시겠습니까?\" [sage.GetSheHe]는 나를 돌아보거나, 눈을 뜨지도 않고 평온하게 물었다. \"이리 와서 앉으시지요.\"\n\n나는 겸손하게 그 제안을 받아들였고, 최대한 우아하게 현자의 옆에 앉아 보려고 노력했다.\n\n\"나는 [sage.GetFirstName](이)라 합니다.\" [sage.GetSheHe]가 목이 쉰 소리로 말했다. \"무엇 때문에 여기까지 오셨습니까?\""
 gdp_merchant_luxury_contract.1621.a: "그게... 모르겠소."
 gdp_merchant_luxury_contract.1621.a.flavor: "당신의 [learning_i|E][learning|E], [piety_i|E][piety_level|E] 시험"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetSheHe|U]가 기운을 얻음"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetSheHe|U]가 실망함"
 gdp_merchant_luxury_contract.1631.desc: "나는 선반들이 끝도 없이 늘어선 방으로 들어섰다. 선반에는 오래된 잉크와 종이로 퀴퀴한 냄새가 나는 두루마리가 가득했다.\n\n말없는 학자를 향해 조심스럽게 다가가자, 학자가 드디어 나를 바라보았다. 처음에는 바쁘게 나를 무시하는 듯하던 [scholar.GetHerHis] 시선이 점차 부드러워졌다. 낯선 내 모습이 호기심을 자극한 모양이었다."
 gdp_merchant_luxury_contract.1631.a: "친구여, 무엇을 읽고 있소?"
 gdp_merchant_luxury_contract.1631.a.success: "[scholar.GetSheHe|U]가 당신의 지식에 감명받음"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetSheHe|U]가 당신을 시골뜨기라고 생각함"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "섬뜩한 광경이 나를 기다렸다. 인간과 짐승의 셀 수도 없는 뼈가 보기 좋게 열을 이루어 정렬되어 있었고, [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)] [physician.GetWomanMan]이 얼마 안 되는 학생들을 위해 뼈들을 이리저리 찌르고 건드려 보고 있었다.\n\n마침내 [physician.GetSheHe|U]가 약간 놀란 눈으로 나를 바라보더니, 함께하자고 손짓했다. 나는 이 사람의 이름이 [physician.GetFirstName](이)라는 사실을 알게 되었고, 사실은 의학에 종사하는 사람이라는 걸 알게 되자 안심했다."
 gdp_merchant_luxury_contract.1641.a: "아, [merchant.Custom('RandomSaintBone')|l]의 뼈 아닌가?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip](이)가 감명받음"
 gdp_merchant_luxury_contract.1641.a.failure: "당신이 [physician.GetFirstNameNoTooltip](을)를 불쾌하게 함"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "사람 [physician.Custom('RandomSaintBone')]"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "의학 교육 보조용으로 사용된 뼈입니다. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "사람 두개골"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "의학 교육 보조용으로 사용된 뼈입니다. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "나는 일행에 다가가 자기소개를 했다. 학생들은 나를 둥글게 둘러싸고 자기들끼리 웃었다. 하지만 분명 이방인의 접근에 흥미를 느낀 모양이었다.\n\n내가 머나먼 [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip]에서 온 견문 넓은 상인이라는 사실을 알게 되자 학생들의 호기심이 치솟았으며, 이들은 나를 근처의 악명 높은 어느 장소로 초대해... 음료를 마시자고 했다."
 gdp_merchant_luxury_contract.1651.a: "술집으로!"
 gdp_merchant_luxury_contract.1651.a.success: "학생들을 즐겁게 함"
 gdp_merchant_luxury_contract.1651.a.failure: "학생들이 지루해함"
 gdp_merchant_luxury_contract.1661.desc: "기이한 회당에 들어선 나는 말을 잃었다. 이렇게 엄청난 색상과 꽃잎, 나뭇잎, 털과 깃털로 가득한 수집품 모음은 본 적이 없었다. 감각의 축제였으며, 실로 자연의 백과사전이라 할 만했다...\n\n이 장소의 관리자가 나타나자 나는 현실로 돌아왔다. 관리자는 자신을 [botanist.GetFirstName](이)라 소개하며, 이곳을 안내해 주겠다고 제안했다."
 gdp_merchant_luxury_contract.1661.a: "정말 고맙소!"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip](이)가 당신의 관심에 고마워함"
 gdp_merchant_luxury_contract.1661.a.failure: "[botanist.GetFirstNameNoTooltip](이)가 전혀 감명받지 않음"
