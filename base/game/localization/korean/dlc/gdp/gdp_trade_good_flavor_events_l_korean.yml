l_korean:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "재고 계산"
 gdp_trade_good_flavor.1001.desc: "나는 잠자리에 들기 전에 [tgf_good.Custom('GetTradeGood')]의 [tgf_good.Custom('GetTradeGoodUnitPlural')] 수를 다시 세어 보았다. 312개, 전부 다 이미 팔려나갔다... 적어도 내 머릿속에서는 그렇다.\n\n나는 다시 수를 세었다. 확실히 하면 좋으니까."
 gdp_trade_good_flavor.1001.a: "다 있군. 전부 내 거다."
 gdp_trade_good_flavor.1001.b: "장부도 내 계산과 맞아떨어져야만 한다."
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "전해진 소문"
 gdp_trade_good_flavor.1002.desc: "소식이 들려왔다. [tgf_market_holder.GetTitledFirstName](이)가 자신의 식탁에서 내 [tgf_good.Custom('GetTgfGoodLook')] 상품에 관해 칭찬했다는 것이다. [tgf_market_holder.GetSheHe|U]는 더 많은 양을 구하고 있다. [tgf_market_holder.GetHerHis] 이웃 사람들도 [tgf_market_holder.GetHerHim]가 그렇게 말하는 것을 들었다고 한다.\n\n칭찬은 기분이 좋다. 계속해서 물건을 사 주는 [tgf_market_holder.GetWomanMan]에게 받는 칭찬은 더 좋고."
 gdp_trade_good_flavor.1002.a: "최고의 구매자를 위한 선물을 보내야겠군."
 gdp_trade_good_flavor.1002.b: "그렇다면 [tgf_market_holder.GetSheHe]도 돈을 더 낼 수 있겠지."
 gdp_trade_good_flavor.1002.c: "마음대로 떠들게 두어라."
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "근원으로부터"
 gdp_trade_good_flavor.1003.desc: "\"여기 [tgf_source_culture.GetName] 일꾼들은 자기 업종을 훤히 꿰뚫고 있습니다. 마지막 [tgf_good.Custom('GetTgfGoodSmallest')] 하나까지 소홀히 하질 않지요.\" 내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 이런 서신을 보내왔다. \"[tgf_good.Custom('GetTradeGood')](은)는 [tgf_good.Custom('GetTgfGoodMade')] 상품입니다. 그 누구도 대충 넘어가는 법이 없습니다.\"\n\n근원을 안다면 재고를 절반은 팔아치운 것이나 다름없다."
 gdp_trade_good_flavor.1003.a: "모든 세부 사항에는 돈을 쓸 가치가 있다."
 gdp_trade_good_flavor.1003.b: "이제 가격을 얼마로 매겨야 할지 알겠군."
 gdp_trade_good_flavor.1003.c: "동료 상인으로서 존경의 마음을 전한다."
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "탄탄대로"
 gdp_trade_good_flavor.1004.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 이미 자기 몫을 다 써 버린 사람처럼 웃었다. \"드넓은 길이 열려 있습니다. 사람들이 그대의 [tgf_good.Custom('GetTgfGoodLook')] 상품을 콕 집어 찾는다더군요.\"\n\n좋은 시절은 빠르게 지나간다. 이 기회를 최대한 활용하는 게 좋겠지."
 gdp_trade_good_flavor.1004.a: "길의 상황이 좋을 때 팔자."
 gdp_trade_good_flavor.1004.b: "좋은 시절에는 교훈이 있는 법. 배워 두자."
 gdp_trade_good_flavor.1004.c: "수레에 더 많이 투자하라!"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "수익의 꿈"
 gdp_trade_good_flavor.1005.desc: "또 [tgf_good.Custom('GetTradeGood')]에 관한 꿈이다. 물건이 서까래까지 가득 쌓여 있었다. 내가 그 위에 서서, 누가 먼저 돈을 낼지를 두고 싸우는 구매자들을 내려다보는 꿈이었다.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "또 [tgf_good.Custom('GetTradeGood')] 꿈이다. 커다란 무리가 시장으로 향하는 모든 길을 가득 채우고 있었고, 내가 그 줄의 맨 앞에서 말을 달렸다. 그러면서 달려오는 구매자들의 수를 세는 꿈이었다.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "나는 웃음을 터뜨리며 깨어났다. 그러고는 숫자를 써 내려가기 시작했다. 머지않아 부자가 될 거다!"
 gdp_trade_good_flavor.1005.a: "꿈으로만 그쳐야 한다는 법은 없지 않나?"
 gdp_trade_good_flavor.1005.a.tt: "곧 새로운 [trade_opportunity|E]가 나타나게 됨"
 gdp_trade_good_flavor.1005.b: "이 숫자들은 맞아떨어질 거다. 내가 그렇게 만들 테니까."
 gdp_trade_good_flavor.1005.c: "부자 되는 꿈을 5분만 더... #DIE1 쿨쿨#!#DIE2 쿨쿨...#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "확인하는 바보"
 gdp_trade_good_flavor.1006.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 나를 창고 곁으로 따로 불러냈다. \"[tgf_source_county.GetNameNoTier]에서 나온 [tgf_good.Custom('GetTradeGood')](이)가... [tgf_good.Custom('GetTgfGoodFlaw')] 상품입니다. 우리가 확인도 안 하는 멍청이인 줄 아나 봅니다!\"\n\n저들은 나를 속이려 했다. 하지만 내게 할인해 준 것이나 다름없다."
 gdp_trade_good_flavor.1006.a: "품질이 떨어지면 가격도 저렴해야지."
 gdp_trade_good_flavor.1006.b: "하. 제 꾀에 제가 넘어갔군."
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "지명 요청"
 gdp_trade_good_flavor.1007.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 이상한 소식을 들고 왔다. \"[tgf_good.Custom('GetTradeGood')|U](은)는 [tgf_good.Custom('GetTgfGoodSold')] 상품입니다. [tgf_source_culture.GetCollectiveNoun] 사람들은 그래도 계속 #EMP '[ROOT.Char.GetHouse.GetName] [tgf_good.Custom('GetTradeGood')]'#!(을)를 찾고, 시세보다 훨씬 더 많은 가격을 내면서도 사려고 합니다! 재고가 거의 다 떨어졌습니다!\"\n\n이제 보니 내 이름에는 돈을 낼 만한 가치가 있는 모양이었다."
 gdp_trade_good_flavor.1007.a: "모든 상품에 내 표식을 찍는다."
 gdp_trade_good_flavor.1007.b: "팔고, 팔고 또 팔아라!"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "[tgf_good.GetNameNoTooltip] 감정"
 gdp_trade_good_flavor.1008.desc: "[tgf_market_holder.GetTitledFirstNamePossessive] 인장이 찍힌 편지가 도착했다. \"[tgf_good.Custom('GetTradeGood')] 하나를 받았는데, 내 집사장은 이게 좋은지 나쁜지도 모르더군. 상인의 눈으로 한번 살펴봐 줄 수 있겠소?\"\n\n과찬이군. 과찬에는 보통 추가 비용이 드는 법이다."
 gdp_trade_good_flavor.1008.a: "사실대로 무게를 재고 측정하겠다."
 gdp_trade_good_flavor.1008.b: "참으로 훌륭하군. 이보다 나은 건 본 적도 없다."
 gdp_trade_good_flavor.1008.c: "전문가의 의견은 그냥 얻을 수 있는 게 아니라, 구매해야지."
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "세는 법 배우기"
 gdp_trade_good_flavor.1009.desc: "창고에서 내 후계자 [tgf_heir.GetFirstName](을)를 보았다. 바닥에 숨겨진 동전이라도 찾겠다는 듯 [tgf_good.Custom('GetTradeGood')] 하나를 들여다보고 있었다.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "우리에서 내 후계자 [tgf_heir.GetFirstName](을)를 보았다. 가죽 아래 숨겨진 동전이라도 찾겠다는 듯 [tgf_good.Custom('GetTradeGood')] 하나를 가늠해 보고 있었다.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "직감이 좋군. 이제 그 직감을 날카롭게 다듬어 줄 때도 됐지."
 gdp_trade_good_flavor.1009.a: "따라와라. 내가 하는 걸 잘 보도록."
 gdp_trade_good_flavor.1009.b: "그러면 어디 세 봐라. 두 번 세도록."
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "모방자"
 gdp_trade_good_flavor.1010.desc: "[tgf_source_county.GetNameNoTier]에서 웬 상자가 되돌아왔다. 사유는 '평소의 기준에 미치지 못했다'는 것이다. 내 물건은 아니다. 하지만 누군가가 내 표식을 작은 곡선 하나까지 똑같이 따라 한 모양이다.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "[tgf_source_county.GetNameNoTier]에서 내 짐승 중 한 마리가 되돌아왔다. 사유는 '평소의 기준에 미치지 못했다'는 것이다. 내 동물은 아니다. 하지만 누군가가 내 낙인을 작은 곡선 하나까지 똑같이 따라 한 모양이다.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "내 무역상 [tgf_trader.GetFirstName](이)가 위조범의 이름을 댔다. [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')]의 [tgf_rival.GetFirstName](이)라고 한다. 베끼는 솜씨가 좋긴 하다. 그건 인정해야겠군."
 gdp_trade_good_flavor.1010.a: "무슨 수를 쓰든 이 위조 행위를 뿌리 뽑는다."
 gdp_trade_good_flavor.1010.b: "모든 가문에 이 모욕을 알린다."
 gdp_trade_good_flavor.1010.c: "모방은 내 이름을 널리 퍼뜨려 주지. 그것도 무료로."
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U](이)가 [tgf_rival.GetShortUINamePossessiveNotMy] 위조를 가문 사이의 문제로 만듦"
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U](이)가 [target_char.GetShortUINamePossessiveNotMy] 위조를 가문 사이의 문제로 만듦"
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "[tgf_good.GetNameNoTooltip]의 가격"
 gdp_trade_good_flavor.1011.desc: "[tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')]에 고용된 무역상인 [tgf_envoy.GetFirstName|U](이)가 창고에 있던 나를 찾아와 탁자에 묵직한 돈주머니를 올려놓았다. \"제 주인 [tgf_rival.GetFirstName]께서 그대의 [tgf_good.Custom('GetTradeGood')] 판매상들 이름을 알고자 하십니다. 전부 다요. 이 주머니는 그 대가입니다.\"\n\n[tgf_envoy.GetSheHe|U]는 단순히 이름을 사는 게 아니다. 내가 수년에 걸쳐 쌓은 노력을 사겠다는 뜻이다."
 gdp_trade_good_flavor.1011.a: "이름은 그저 글씨에 불과하지. 돈을 내라."
 gdp_trade_good_flavor.1011.b: "내 이점을 팔 생각은 없다."
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "무역상의 휴전"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U](은)는 나와 마찬가지로 [tgf_source_county.GetNameNoTier]에서 [tgf_good.Custom('GetTradeGood')](을)를 판다. 그리고 계절이 올 때마다 우리는 서로 뼈를 깎는 수준까지 가격 경쟁을 벌인다. 오늘 [tgf_ally.GetHerHis] 편지가 왔는데, 휴전을 제의하고 있었다. 서로 가격 경쟁을 멈춘 뒤 같이 잘 먹고 살자는 내용이었다.\n\n이제 보니 평화도 다른 물건과 마찬가지로 구매할 수 있는 모양이었다."
 gdp_trade_good_flavor.1012.a: "동의한다. 둘 다 먹고 살아야 하니까."
 gdp_trade_good_flavor.1012.b: "나는 [tgf_ally.GetSheHe]보다 더 오래 굶어도 괜찮다."
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U](와)과 [tgf_ally.GetShortUINameNotMe](이)가 서로를 향한 가격 경쟁을 그만두기로 합의함"
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U](와)과 [target_char.GetShortUINameNotMe](이)가 서로를 향한 가격 경쟁을 그만두기로 합의함"
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "개인 가격"
 gdp_trade_good_flavor.1013.desc: "[tgf_market_holder.GetTitledFirstName]의 인장이 찍힌 편지를 받았다. \"[tgf_good.Custom('GetTradeGood')](을)를 살 거면 내 시장에서 사시오. 여기서만 구매한다면, 그 어떤 상인보다 훨씬 더 낮은 가격을 낼 수 있을 것이오.\"\n\n독점이라 함은 구속을 뜻하는 말이나 다름없다. 그래도 괜찮은 가격이긴 하군."
 gdp_trade_good_flavor.1013.a: "[tgf_market_holder.GetHerHis|U] 시장에서 사고, 난 할인을 받고. 좋다."
 gdp_trade_good_flavor.1013.b: "난 다른 이의 장부에 굴복하지 않는다."
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "숙련자에게 물어보라"
 gdp_trade_good_flavor.1014.desc: "머리가 희끗희끗한 짐꾼이 [tgf_source_county.GetNameNoTier] 창고 앞에 짐을 내려놓았다. \"실례합니다만, [tgf_good.Custom('GetTradeGood')](을)를 전부 잘못 확인하고 계시군요.\" [tgf_porter.GetSheHe|U]가 직접 보여주며 여기저기를 지적했다.\n\n[tgf_porter.GetHerHim]는 평생 이 물건을 짊어지고 살아온 경험 덕분에 누구보다 많은 것을 배웠다."
 gdp_trade_good_flavor.1014.desc.livestock: "머리가 희끗희끗한 목자가 [tgf_source_county.GetNameNoTier] 시장에서 자기가 몰고 온 가축 무리의 속도를 늦추었다. \"실례합니다만, [tgf_good.Custom('GetTradeGood')](을)를 전부 잘못 판단하고 계시군요.\" [tgf_porter.GetSheHe|U]가 직접 보여주며 여기저기를 지적했다.\n\n[tgf_porter.GetHerHim]는 평생 [tgf_good.Custom('GetTradeGood')](을)를 시장으로 몰고 다니던 경험 덕분에 누구보다 많은 것을 배웠다."
 gdp_trade_good_flavor.1014.a: "받으시오. 지혜에는 보수가 따르는 법."
 gdp_trade_good_flavor.1014.b: "계속하시오. 듣고 있으니."
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "초심자의 실수"
 gdp_trade_good_flavor.1015.desc: "[tgf_source_county.GetNameNoTier] 어딘가에서 나한테 [tgf_good.Custom('GetTradeGood')](을)를 팔았던 행상인이 내 건강을 위해 건배하고 있었다. 나는 터무니없이 비싼 값을 치렀고, 그 사실을 너무 늦게 알았다.\n\n뭐 어쩌겠는가. 배운 바보는... 적어도 더 이상 바보짓을 하진 않겠지."
 gdp_trade_good_flavor.1015.a: "값비싼 교훈도 교훈이니까."
 gdp_trade_good_flavor.1015.b: "됐다. 오늘은 이만 장부를 내려놓자."
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "상인의 안내서"
 gdp_trade_good_flavor.1016.desc.intro: "[tgf_good.Custom('GetTradeGood')] 상자 안에 처박혀 있던 물건을 찾았다. 습기를 막으려고 꽁꽁 싸매 둔 사본이었는데, "
 gdp_trade_good_flavor.1016.desc.intro_livestock: "내가 마지막으로 구매했던 [tgf_good.Custom('GetTradeGood')](와)과 같이 온 장비 중에서 이런 물건을 찾았다. 습기를 막으려고 꽁꽁 싸매 둔 사본이었는데, "
 gdp_trade_good_flavor.1016.desc.book_1: "상업 실무서라는 책이었다."
 gdp_trade_good_flavor.1016.desc.book_2: "도로와 시장 안내서였다."
 gdp_trade_good_flavor.1016.desc.book_3: "상인의 거울이라는 책이었다."
 gdp_trade_good_flavor.1016.desc.outro: " 도량형, 측량법, 도로, 가격 등이 적혀 있었다. 잠도 자지 않고 일한 게 분명한 상인이 남긴 기록이었다.\n\n누군가 보물을 잃어버린 모양이다. 내가 이걸 잘 이용해야겠군."
 gdp_trade_good_flavor.1016.a: "책등이 닳아버릴 때까지 읽는다."
 gdp_trade_good_flavor.1016.b: "희귀한 서적은 더 높은 가격에 팔리겠지."
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "요령 익히기"
 gdp_trade_good_flavor.1017.desc: "[tgf_source_county.GetNameNoTier]에서 [tgf_seller.GetCulture.GetCollectiveNoun] 판매상 한 명이 [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTradeGoodUnit')] 하나를 내밀고는 세 배 높은 가격을 불렀다. \"이 바닥은 처음 아닙니까? 그러면 배우는 셈 치십시오. 뭔가를 익히려면 대가가 드는 법이지요.\"\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "[tgf_source_county.GetNameNoTier](은)는 [tgf_seller.GetCulture.GetCollectiveNoun] 판매상 한 명이 내 앞에 [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTradeGoodUnit')] 하나를 보여주며 세 배 높은 가격을 불렀다. \"이 바닥은 처음 아닙니까? 그러면 배우는 셈 치십시오. 뭔가를 익히려면 대가가 드는 법이지요.\"\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "무례하군. 맞는 말이지만, 그래도 무례하다."
 gdp_trade_good_flavor.1017.a: "돈을 받고 날 가르쳐 주시오."
 gdp_trade_good_flavor.1017.b: "절대 안 되지."
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "잘못된 측량법"
 gdp_trade_good_flavor.1018.desc: "내 무역상 [tgf_trader.GetFirstName](은)는 우리가 [tgf_good.Custom('GetTradeGood')](을)를 [ROOT.Char.GetCulture.GetName] 측량법으로 팔고 있었다는 사실을 알아냈다. 구매자들이 흔히 예상하는 [tgf_source_culture.GetName] 방식보다 약간 더 적은 양이다. 판매한 모든 상품이 기준에 미치지 못했다.\n\n악의 없는 실수다. 이 실수가 앞으로도 계속될지는 나한테 달렸고."
 gdp_trade_good_flavor.1018.a: "측량법을 고쳐라. 전부 다."
 gdp_trade_good_flavor.1018.b: "차액은 내 지갑에 남긴다."
 gdp_trade_good_flavor.1018.c: "저들의 방식대로 측량하고, 큰 소리로 알려라."
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "상품은 둘, 구매자는 하나"
 gdp_trade_good_flavor.1019.desc: "[tgf_market_holder.GetTitledFirstName]의 편지를 받았다. \"[tgf_good.Custom('GetTradeGood')](을)를 보내주시오. [tgf_good_b.Custom('GetTradeGood')] 또한 보내주시오. 하나가 없으면 다른 하나도 소용이 없으니.\"\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "[tgf_market_holder.GetTitledFirstName]의 편지를 받았다. \"[tgf_good.Custom('GetTradeGood')](을)를 보내주시오. [tgf_good_b.Custom('GetTradeGood')] 또한 같이 보내주시오.\"\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "상품은 둘, 구매자는 하나, 값도 한 번에. 내가 제일 좋아하는 계산이로군."
 gdp_trade_good_flavor.1019.a: "묶어서 판매하니 가격도 묶음으로 매긴다."
 gdp_trade_good_flavor.1019.b: "별도로 판다. 지금 들어오는 돈이 나중에 들어올 돈보다 낫지."
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "건설자 요금"
 gdp_trade_good_flavor.1020.desc: "[tgf_build_county.GetNameNoTier]에서 비계가 올라가고 있다. [tgf_market_holder.GetTitledFirstName](이)가 건설을 진행하고 있으며, 현장으로 들어오는 모든 수레에는 내 [tgf_good.Custom('GetTradeGood')](이)가 실려 있었다. [tgf_market_holder.GetSheHe|U]가 건설자 요금을 요청하는 편지를 보냈다. 벽이 세워지기 전까지 동일한 [tgf_good.Custom('GetTradeGood')](을)를 약간 더 싼 가격으로 공급해 달라는 것이다.\n\n이미 [tgf_market_holder.GetSheHe]가 올리는 벽의 반은 내 것이나 다름없기는 하다."
 gdp_trade_good_flavor.1020.a: "건설자 요금으로 진행하라."
 gdp_trade_good_flavor.1020.b: "요금이라면 괜찮다. 무료 선물은 안 될 말이고."
 gdp_trade_good_flavor.1020.c: "호의를 베풀면 나중에 호의로 돌아오겠지."
 gdp_trade_good_flavor.1020.d: "가장 좋은 건 내 안뜰에 둔다."
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "상품을 알라"
 gdp_trade_good_flavor.1021.desc: "모든 무역에는 달인이 있고, 달인은 #EMP 계속해서#! 배운다. 오늘 밤 나는 등불과 내 창고에서 가장 좋은 [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTradeGoodUnitPlural')](을)를 가지고 기름이 떨어질 때까지 연구를 이어갔다.\n\n내 상품은 팔리고, 남의 상품은 팔리지 않는 이유가 분명 여기 어딘가에 있다."
 gdp_trade_good_flavor.1021.desc.livestock: "모든 무역에는 달인이 있고, 달인은 계속해서 배운다. 오늘 밤 나는 등불과 내가 가진 가장 좋은 [tgf_good.Custom('GetTradeGood')](을)를 가지고 머리부터 발끝까지 살펴보며 연구를 이어갔다.\n\n내 상품은 팔리고, 남의 상품은 팔리지 않는 이유가 분명 여기 어딘가에 있다."
 gdp_trade_good_flavor.1021.desc.books: "모든 무역에는 달인이 있고, 달인은 #EMP 계속해서#! 배운다. 오늘 밤 나는 등불과 내 창고에서 가장 훌륭한 서책을 가지고 기름이 떨어질 때까지 읽어 나갔다.\n\n내 상품은 팔리고, 남의 상품은 팔리지 않는 이유가 분명 여기 어딘가에 있다."
 gdp_trade_good_flavor.1021.a: "이건 내가 간직해야겠다. 다른 모든 상품의 기준으로 삼아야지."
 gdp_trade_good_flavor.1021.b: "배울 것은 언제나 넘쳐난다."
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "무역에 걸맞은 이름"
 gdp_trade_good_flavor.1022.desc: "[tgf_source_county.GetNameNoTier]에서는 사람들이 더 이상 내 이름을 말하지 않는다. 저들이 [tgf_good.Custom('GetTgfGoodNickname')](이)라 말하면, 다들 누구를 말하는지 아니까. #bold 나다.#!\n\n작위는 주군이 내린다. 하지만 이런 이름은 시장이 내려주며, 시장의 찬사는 노력으로 얻어내는 것이다."
 gdp_trade_good_flavor.1022.a: "저속하군. 효과적이긴 하지만, 그래도 저속하다."
 gdp_trade_good_flavor.1022.b: "내버려둔다. 이름이 붙으면 사업에도 유리하니까."
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "공급 차질"
 gdp_trade_good_flavor.1023.desc: "\"우리가 만드는 것보다 더 빠르게 사 가는군요.\" [tgf_good.Custom('GetTradeGood')](은)는 [tgf_good.Custom('GetTgfGoodMade')] 상품이다. 내가 한창 그 모습을 바라보고 있는데 [tgf_source_county.GetNameNoTier]의 작업반장인 [tgf_foreman.GetFirstName](이)가 말했다. \"일손에도 한계가 있는데 말입니다.\"\n\n일손을 더 들이면 돈이 든다. 구매자를 돌려보내면 훨씬 더 많은 돈이 들고."
 gdp_trade_good_flavor.1023.a: "일손을 더 고용하시오. 대금은 내가 치르지."
 gdp_trade_good_flavor.1023.b: "대신 날 위해 일하는 건 어떻소?"
 gdp_trade_good_flavor.1023.c: "그렇다면 어떻게 하는 건지 보여주시오."
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "망치 아래서"
 gdp_trade_good_flavor.1024.desc: "\"[tgf_good.Custom('GetTradeGood')] 40[tgf_good.Custom('GetTradeGoodUnitPlural')](을)를 최고 입찰가에 드립니다!\" [tgf_source_county.GetNameNoTier] [tgf_source_province.Custom('GetRegionalMarketTerm')]에서 [tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')]의 [tgf_rival.GetFirstName](이)가 손을 들어 올렸다. 경매인이 말을 마무리하기도 전이었다.\n\n[tgf_rival.GetSheHe|U]가 나를 보더니 미소를 지었다. 이건 완전히 자기 차지라고 생각하는 모양이다..."
 gdp_trade_good_flavor.1024.a: "[tgf_rival.GetSheHe]가 얼마를 입찰했든, 한 단계 더 높게 부른다."
 gdp_trade_good_flavor.1024.b: "값을 올려라, 올려... 전부 [tgf_rival.GetFirstNameNoTooltip] 자네 차지다!"
 gdp_trade_good_flavor.1024.c: "[tgf_rival.GetHerHim]가 입찰하게 둔다. 누가 이기는지 지켜봐야지."
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "부두의 첫 차례"
 gdp_trade_good_flavor.1025.desc: "\"부두에 배 스무 척이 있고 기중기가 하나 있습니다.\" [tgf_source_county.GetNameNoTier]의 부두 노동자들을 부리는 인물인 [tgf_docks_boss.GetFirstName](이)가 말했다. \"자기 [tgf_good.Custom('GetTradeGood')](을)를 먼저 내리는 자가 이 기간의 가격을 정하게 되지요. 그대 물건을 먼저 내리십시오.\"\n\n[tgf_docks_boss.GetSheHe|U]가 손바닥을 위로 한 채 손을 내밀었다."
 gdp_trade_good_flavor.1025.a: "배에서 먼저 내리면 가격도 먼저 불러야지."
 gdp_trade_good_flavor.1025.b: "그렇다면 바로 여기 갑판에서 팔아버리겠다."
 gdp_trade_good_flavor.1025.c: "다른 이들이 먼저 내리게 하고, 저들이 얼마나 부르는지 지켜본다."
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "한 움큼씩"
 gdp_trade_good_flavor.1026.desc: "\"한 번에 [tgf_good.Custom('GetTgfGoodSmallest')] 하나씩, 가난한 사람들은 바로 그렇게 사는 겁니다.\" [tgf_source_county.GetNameNoTier] 시장에서 가판대를 운영하는 [tgf_stallholder.GetFirstName](이)가 말했다. [tgf_stallholder.GetSheHe|U]는 내 [tgf_good.Custom('GetTradeGood')] 하나를 잘게 소분하여, 각 부분을 제값보다 약간 더 비싸게 팔고 있었다.\n\n\"물건만 계속 공급해 주십시오. 그러면 대금도 계속 치르겠습니다.\""
 gdp_trade_good_flavor.1026.a: "필요할 때마다 물건을 새로 보내주겠소. 그렇게 합시다."
 gdp_trade_good_flavor.1026.b: "사람들이 치를 수 있는 가격을 받고 물건을 판매한다."
 gdp_trade_good_flavor.1026.c: "지금 다 가져가시오. 현금으로 즉시 거래하지."
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "장날"
 gdp_trade_good_flavor.1027.desc: "\"[tgf_good.Custom('GetTradeGood')|U]! [tgf_good.Custom('GetTgfGoodLook')|U] 상품입니다! [tgf_good.Custom('GetTradeGood')] 필요하신 분?\" [tgf_source_county.GetNameNoTier]의 장날이 왔다. 내 호객꾼의 목소리는 거의 들리지도 않았다. 이 영지의 모든 구매자가 손에 돈을 들고 한 곳으로 모였다.\n\n저 사람들이 그 돈을 #EMP 나한테#! 써 주기만 하면 좋으련만!"
 gdp_trade_good_flavor.1027.a: "최고의 자리를 잡아야 한다. 비용이 얼마가 들든 상관없다."
 gdp_trade_good_flavor.1027.b: "가판대는 필요 없다. 내가 직접 군중을 끌어모으리라."
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "외국 동전"
 gdp_trade_good_flavor.1028.desc: "[tgf_source_county.GetNameNoTier]의 구매자인 [tgf_buyer.GetFirstName](이)가 내 [tgf_good.Custom('GetTradeGood')](을)를 사면서 [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')](으)로 값을 치렀다. \"돈은 다 똑같은 돈 아닙니까.\" [tgf_buyer.GetSheHe]가 말했다.\n\n그래, 돈은 돈이다. 나는 그 말에 동의하며 [tgf_buyer.GetHerHis] 동전이 나한테 얼마의 가치가 있는지 알려 주었다. [tgf_buyer.GetSheHe|U]의 미소가 사라졌다."
 gdp_trade_good_flavor.1028.a: "좋다. 은화는 은화니까."
 gdp_trade_good_flavor.1028.b: "내가 정한 가격을 내시오. 아니면 거래는 없소."
 gdp_trade_good_flavor.1028.c: "대신 [tgf_good_b.Custom('GetTradeGood')](으)로 값을 치르시오."
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "도로에서 보낸 세월"
 gdp_trade_good_flavor.1029.desc: "\"이 도로가 그대의 [tgf_good.Custom('GetTradeGood')](을)를 3년간 운송했습니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말하며 잔을 들어 올렸다. \"제가 이 길로 다니는 동안, 그중에서 단 하나도 잃어버린 적이 없지요!\"\n\n[tgf_trader.GetSheHe|U]는 총 다섯 [tgf_good.Custom('GetTradeGoodUnit')](을)를 잃어버렸다. 하지만 오늘은 [tgf_trader.GetHerHim]가 이 영광을 누리게 놔둘까 한다."
 gdp_trade_good_flavor.1029.a: "참으로 수고 많았소!"
 gdp_trade_good_flavor.1029.b: "앞으로의 3년을 위해."
 gdp_trade_good_flavor.1029.c: "다음엔 더 멀리 갑시다. 훨씬 더 멀리."
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "판매 구경하기"
 gdp_trade_good_flavor.1030.desc: "\"저게 진짜 [ROOT.Char.GetHouse.GetName] [tgf_good.Custom('GetTradeGood')]입니다.\" [tgf_source_county.GetNameNoTier] 시장의 구매자가 내 물건 하나를 가리키며 말했다. \"[tgf_good.Custom('GetTgfGoodLook')|U] 상품이군요!\"\n\n[tgf_buyer.GetSheHe|U]는 그 [ROOT.Char.GetHouse.GetName] 사람이 바로 자기 뒤에 서 있다는 사실을 꿈에도 모르고 있다.\n\n내가 한 마디 해 줘도 되겠군. 아니면 그냥 이 순간을 즐겨도 되고."
 gdp_trade_good_flavor.1030.a: "아무 말도 하지 않는다. 저들이 뭘 원하는지 들어보자."
 gdp_trade_good_flavor.1030.b: "참으로 그렇소. 내가 잘 알지."
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "외부의 돈"
 gdp_trade_good_flavor.1031.desc: "[tgf_source_county.GetNameNoTier]의 두 [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')]인 [tgf_investor_a.GetFirstName](와)과 [tgf_investor_b.GetFirstName](은)는 수년 동안 내 [tgf_good.Custom('GetTradeGood')](을)를 구매해 왔다. 이제 저들이 각자의 몫을 요구하고 있다.\n\n\"그대 거래에서 우리 몫을 챙겨 주시오.\" [tgf_investor_a.GetFirstNameNoTooltip](이)가 말했다. [tgf_investor_b.GetFirstNameNoTooltip](은)는 동전을 세고 있었다. \"우린 값도 잘 쳐주고, 쓸데없는 질문도 안 하잖소.\"\n\n저들도 언젠가는 질문을 하게 될 것이다. 투자자들은 늘 그러니까."
 gdp_trade_good_flavor.1031.a: "그대의 돈, 제 수익. 그 일부를 드리지요."
 gdp_trade_good_flavor.1031.b: "이 무역은 가문 내에서만 운영하겠다."
 gdp_tgf_kept_in_family_unity_desc: "무역을 가문의 소유로 유지함"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "전시실"
 gdp_trade_good_flavor.1032.desc: "\"[tgf_good.Custom('GetTradeGood')] 아닙니까?\" 모든 방문자가 내 회당에 오면 멈춰 서서 이렇게 묻는다. 그렇다. 내가 가진 것 중에 가장 뛰어나며 [tgf_good.Custom('GetTgfGoodLook')] 상품이다. 누구도 놓치고 지나가는 일이 없도록 잘 보이는 곳에 놓아두었다.\n\n내 집에 왔으면 내가 무얼 파는지 알아야 한다. 그러기 전에는 나갈 수 없지."
 gdp_trade_good_flavor.1032.desc.livestock: "\"[tgf_good.Custom('GetTradeGood')] 아닙니까?\" 모든 방문자가 내 회당에 오면 이 짐승의 주위를 조심스럽게 걸으며 이렇게 묻는다. 그렇다. 내가 가진 것 중에 가장 뛰어나며 [tgf_good.Custom('GetTgfGoodLook')] 동물이다. 누구도 놓치고 지나가는 일이 없도록 잘 보이는 곳에 매어 두었다.\n\n내 집에 왔으면 내가 무얼 파는지 알아야 한다. 그러기 전에는 나갈 수 없지. 적어도 자기들 신발에 묻은 게 없는지 잘 확인해야 할 거다."
 gdp_trade_good_flavor.1032.a: "구경하게 둔다. 소문이 퍼져 나갈 테니까."
 gdp_trade_good_flavor.1032.b: "선물이니 가져가시오."
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "실력 유지하기"
 gdp_trade_good_flavor.1033.desc: "[tgf_good.Custom('GetTradeGood')]의 옛 공급자가 이런 서신을 보냈다. \"올해 가장 뛰어난 [tgf_good.Custom('GetTradeGood')](을)를 따로 챙겨 놓았습니다. 가격도 옛 가격 그대로고요. 다시 살 생각은 없으십니까?\"\n\n그 업종을 떠나온 지는 좀 되었는데. 하지만 [tgf_good.Custom('GetTradeGood')](을)를 보는 내 안목은 아직 예리하다. 이런 안목은 계속 써먹기만 한다면 값진 자산이 될 것이고."
 gdp_trade_good_flavor.1033.a: "답장을 보낸다. 안목을 계속 예리하게 유지하자."
 gdp_trade_good_flavor.1033.b: "내 지식은 살 수 있다. 대가를 치른다면야."
 gdp_trade_good_flavor.1033.c: "넘긴다. 이제는 새로운 무역에 종사하니까."
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "일정표"
 gdp_trade_good_flavor.1034.desc: "[tgf_source_county.GetNameNoTier]에 묵고 있는 순례자 [tgf_pilgrim.GetFirstName](이)가 작고 낡은 책 하나를 톡톡 두드렸다. \"모든 도로, 모든 여관, 이곳과 바다 사이의 모든 여울이 여기 적혀 있습니다. 여백에는 [tgf_good.Custom('GetTradeGood')] 값을 잘 쳐주는 모든 시장이 적혀 있고요. 값만 치르신다면 그대 것입니다.\"\n\n내가 가진 그 어떤 수레보다도 먼 곳까지 다녀온 책이었다."
 gdp_trade_good_flavor.1034.a: "얼마면 될지 얘기하시오, 순례자여."
 gdp_trade_good_flavor.1034.b: "오늘 밤 내로 베껴서 아침까지 돌려준다."
 gdp_trade_good_flavor.1034.c: "시장에서 무엇을 봤는지나 얘기해 주시오."
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "사업 이야기"
 gdp_trade_good_flavor.1035.desc: "\"그래서, 무슨 거래를 하십니까?\" 내 문객인 [tgf_guest.GetFirstName](이)가 저녁 식사를 마치고 산책하다 이렇게 물어보았다. 실수였다. 나는 [tgf_good.Custom('GetTgfGoodMade')] 상품인 [tgf_good.Custom('GetTradeGood')](을)를 어떻게 얻었는지를 설명했는데, 그러다 정신을 차려보니 시장 전체를 두 번이나 돌고 난 뒤였다.\n\n[tgf_guest.GetSheHe|U]는 주제를 바꾸려는 시도를 한 번도 하지 않았다. 이건 바로 내 상품을 살 구매자라는 뜻이다."
 gdp_trade_good_flavor.1035.a: "조건은 후식을 먹으면서 얘기해 볼까요?"
 gdp_trade_good_flavor.1035.b: "내 이야기는 이제 됐고. 그대는 어디서 물건을 삽니까?"
 gdp_trade_good_flavor.1035.c: "내가 그걸로 처음 큰돈을 벌었을 때의 이야기를 해 드리지요."
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "포장 현장"
 gdp_trade_good_flavor.1036.desc: "\"수레마다 3분의 1씩 더 실어야 합니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말하며 방법을 보여주었다. \"일부는 도로에서 파손될 테고, 그러면 구매자들이 불평하겠지요. 하지만 이렇게 실으면 대부분은 멀쩡할 겁니다.\"\n\n대부분이라. 내가 좋아하는 숫자다. 일부도 참아 줄 수 있는 정도의 숫자고."
 gdp_trade_good_flavor.1036.a: "단단히 채워 넣어라. 이득이 틈새를 채운다."
 gdp_trade_good_flavor.1036.b: "잘 채워 넣도록. 구매자는 가장 먼저 열어 본 상품을 바탕으로 판단한다."
 gdp_trade_good_flavor.1036.c: "그냥 내버려둬라. 지금까지 문제도 없었는데 뭐."
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "시장의 인장"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "상품의 품질이 괜찮은지, 측량이 정확한지를 확인하며 검사를 통과한 상품에 납이나 밀랍 봉인을 찍는 시장 관리입니다. 많은 도시에서는 이 봉인이 없으면 직물이나 다른 상품을 팔 수 없도록 금지했으며, 봉인 담당자는 인장을 찍을 때마다 수수료를 받았습니다."
 gdp_trade_good_flavor.1037.desc: "\"봉인이 찍힌 상품은 더 비싸게 팔립니다. 누구나 아는 사실이지요.\" [tgf_source_county.GetNameNoTier] 시장의 [Glossary( '봉인 담당자', 'TGF_SEALER_GLOSS' )]인 [tgf_sealer.GetFirstName](이)가 의자에서 고개를 들지 않은 채 말했다. \"저는 대금이 들어온 순서대로 봉인을 찍습니다. 요청받은 순서가 아니라요.\"\n\n내 [tgf_good.Custom('GetTradeGood')] 수레가 햇빛 아래 놓인 채 기다린다. 내 수익도 마찬가지였다."
 gdp_trade_good_flavor.1037.a: "그렇다면 기다린다. 봉인은 필요하니까."
 gdp_trade_good_flavor.1037.b: "자, 받으시오. 이제 봉인을 더 빨리 찍어 주시게."
 gdp_trade_good_flavor.1037.c: "내 이름이 봉인이나 다름없다."
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "중개인"
 gdp_trade_good_flavor.1038.desc: "\"그대가 가본 적 없는 도시에 그대가 들어 본 적도 없는 구매자들이 있습니다. 제가 그걸 다 안다 이 말입니다.\" [tgf_source_county.GetNameNoTier] 시장의 중개인인 [tgf_broker.GetFirstName](이)가 부탁하지도 않았는데 내 잔을 채워 주었다. \"그대의 [tgf_good.Custom('GetTradeGood')], 구매자의 돈, 제 몫. 이거면 설명이 되겠지요.\"\n\n당사자는 셋이다. 무료 술은 그중 한 명만 마시게 되겠지만."
 gdp_trade_good_flavor.1038.a: "구매자를 찾아내고, 그대 몫을 챙겨가시오."
 gdp_trade_good_flavor.1038.b: "고맙지만 내 구매자는 알아서 찾겠소."
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "무역상의 도제"
 gdp_trade_good_flavor.1039.desc: "\"이 친구가 저보다 수를 더 빠르게 셉니다.\" 내 무역상인 [tgf_trader.GetFirstName](이)가 비쩍 마른 젊은이인 [tgf_youth.GetFirstName](을)를 앞으로 밀어 보냈다. [tgf_youth.GetFirstNameNoTooltip](은)는 내가 묻기도 전에 우리의 시장 두 곳에서 파는 [tgf_good.Custom('GetTradeGood')] 가격을 댔다.\n\n영리한 아이를 키우려면 돈이 든다. 그 아이가 나를 위해 일한다면, 그 돈을 다시 벌어올 수 있겠지."
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip](은)는 나와 함께한다."
 gdp_trade_good_flavor.1039.b: "[tgf_trader.GetFirstNameNoTooltip], 이 친구를 잘 키우도록. 잘 가르쳐 주고."
 gdp_trade_good_flavor.1039.c: "이미 먹여 살릴 입이 많다."
 gdp_tgf_family_only_unity_desc: "회사를 가문의 소유로 유지함"
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "안에서 헤엄치기"
 gdp_trade_good_flavor.1040.desc: "늦은 밤 창고에는 나밖에 없었다. [tgf_good.Custom('GetTgfGoodLook')] 상품이 내 머리보다 더 높이 쌓여 있었다. 나는 첫 한 움큼을 손가락 사이로 흘려보냈다. 한 번에 [tgf_good.Custom('GetTgfGoodSmallest')] 하나씩.\n\n그때 이런 생각이 들었다. 여기서... #EMP 헤엄친다면 어떨까?#!"
 gdp_trade_good_flavor.1040.a: "행복한 오리처럼 뛰어든다!"
 gdp_trade_good_flavor.1040.a.toast: "거친 착지"
 gdp_trade_good_flavor.1040.b: "아니. 수를 센다. 마지막 [tgf_good.Custom('GetTgfGoodSmallest')]까지 전부."
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "첫 판매"
 gdp_trade_good_flavor.1041.desc: "오래된 궤짝을 정리하던 나는 천으로 감싸 놓은 물건을 찾아냈다. 내가 처음으로 판매했던 [tgf_good.Custom('GetTradeGood')]의 [tgf_good.Custom('GetTgfGoodSmallest')] 하나다. 몇 년 전에 두 배의 가격을 주고 다시 산 물건이다.\n\n아무도 보는 사람이 없는 가운데, 나는 그 물건을 빛 속으로 들어 올리고 우리가 얼마나 멀리 왔는지 이야기했다. 내가 그 뒤로 벌어들인 모든 동전은 이 물건의 자손이나 다름없다."
 gdp_trade_good_flavor.1041.a: "액자에 넣자. 내가 잘 볼 수 있는 곳에 걸어 두는 거다."
 gdp_trade_good_flavor.1041.b: "내 부흥을 상징하는 성물이지. 누군가는 값을 치르고 사려 할 거다."
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "베개 밑의 동전"
 gdp_trade_good_flavor.1042.desc: "\"잘 자라, 동전들아.\" 이제는 매일 저녁, 베개 밑의 돈주머니에 대고 이렇게 인사를 건넨다. 내 [tgf_good.Custom('GetTradeGood')](이)가 이번 계절에 벌어들인 모든 수입이다.\n\n지금까지 써 본 베개 중에 가장 단단하고, 또 가장 비싼 하나뿐인 베개다."
 gdp_trade_good_flavor.1042.a: "그 위에서 잠을 청한다. 모든 동전 위에서."
 gdp_trade_good_flavor.1042.b: "베개 아래 둬봤자 소용이 없지. [tgf_good.Custom('GetTradeGood')](을)를 더 산다."
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "동전과 함께 있는 초상화"
 gdp_trade_good_flavor.1043.desc: "\"탁자에 앉으시고. 옆에는 [tgf_good.Custom('GetTradeGood')](을)를 두시고, 다른 쪽에는 동전을 두시는 겁니다.\" [tgf_source_county.GetNameNoTier](을)를 거쳐 가던 화가인 [tgf_painter.GetFirstName](이)가 두 엄지로 액자 모양을 만들어, 그 사이에 나를 넣어 보며 말했다. \"모든 동전을 다 그려 드리겠습니다. 하나하나 다 [Glossary( '세어서요', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )].\"\n\n난 계산할 줄 아는 사람이 좋다."
 gdp_trade_good_flavor.1043.a: "동전 하나하나를 다 그리도록."
 gdp_trade_good_flavor.1043.b: "동전을... #EMP 더 크게#! 그리시오."
 gdp_trade_good_flavor.1043.c: "화가는 고객이 아니지 않은가."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "상인과 환전상은 돈과 저울 사이에서 일하는 자기 모습을 그림에 담아내곤 했습니다. 1449년에 페트뤼스 크리스튀스는 약혼한 연인을 위한 반지의 무게를 재는 금세공인을 그렸습니다."
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "너무 무거운 지갑"
 gdp_trade_good_flavor.1044.desc: "\"[ROOT.Char.Custom('FormOfAddressForLiege')], 시종을 더 불러올까요?\" [tgf_servant.GetFirstName](이)가 말했다. 내 지갑은 이번 철에 [tgf_good.Custom('GetTradeGood')](으)로 벌어들인 돈으로 가득해, 이제는 뒤에서 이 지갑을 들어 줄 시종이 필요할 지경이었다.\n\n수레를 끌고 다녀야 할까 싶다."
 gdp_trade_good_flavor.1044.a: "그래. 시종을 둘로 하자. 천천히 걷도록."
 gdp_trade_good_flavor.1044.b: "아니. 수레로 하라. 내 이름이 쓰인 수레로!"
 gdp_trade_good_flavor.1044.c: "우선 [tgf_good.Custom('GetTradeGood')] 시장을 먼저 거쳐 가자, [tgf_servant.GetFirstNameNoTooltip]."
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "수익과 신앙"
 gdp_trade_good_flavor.1045.desc: "내 장부는 [Glossary( '옛 방식', 'TGF_DATINI_GLOSS' )]대로, [ROOT.Char.GetFaith.HighGodName](와)과 수익의 이름으로 펼쳐진다. 올해는 수익 내역이 40장을 채웠으나 단 하나의 동전도 [ROOT.Char.GetFaith.HighGodName]께 가지 않았다.\n\n상인이라면 동업자한테도 마땅히 그 몫을 챙겨주어야 한다는 사실을 알아야 한다."
 gdp_trade_good_flavor.1045.a: "위에 계신 동업자께도 자기 몫을 드려야지."
 gdp_trade_good_flavor.1045.b: "[ROOT.Char.GetFaith.HighGodName]에서 고요한 시간을 보낸 뒤 다시 장부로 돌아온다."
 gdp_trade_good_flavor.1045.c: "[ROOT.Char.GetFaith.HighGodName] 덕분에 이 분야에 능숙해졌다. 여기서 멈춘다면 무례한 짓이겠지."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "토라, 성경, 꾸란에 나오는 요셉의 이야기에서 이집트의 통치자는 살진 소 일곱 마리가 마른 소 일곱 마리에게 잡아먹히는 꿈을 꿉니다. 요셉은 이 꿈을 7년의 풍년과 7년의 기근으로 풀이했으며, 덕분에 이집트는 제때 곡창을 채워 대비할 수 있었습니다."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "프라토의 상인인 프란체스코 다티니는 '신과 수익의 이름으로'라는 문구로 장부를 시작했으며, 토스카나에서 가장 부유한 사람 중 한 명으로 세상을 떠났습니다."
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "저들 중 하나"
 gdp_trade_good_flavor.1046.desc: "\"[tgf_source_county.GetNameNoTier]의 절반은 저처럼 [tgf_source_culture.GetCollectiveNoun] 사람입니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말했다. \"저한테는 열리는 문이 그대 앞에서는 닫혀 있지요. 저한테는 가격이 내려가지만, 그대 같은 [ROOT.Char.GetCulture.GetCollectiveNoun] 앞에서는 절대 내려가지 않습니다.\"\n\n[tgf_trader.GetFirstNameNoTooltip]도 다 좋은 뜻으로 하는 말이다. 그래서 나는 가격 얘기만 골라 듣기로 했다."
 gdp_trade_good_flavor.1046.a: "앞으로 대화는 자네가 담당하도록."
 gdp_trade_good_flavor.1046.b: "자. 아무도 자네를 빼가지 못하도록 하게."
 gdp_trade_good_flavor.1046.c: "그렇다면 저들의 방식을 배워야겠군."
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "과잉 공급 시장"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetHouse.GetBaseNameNoTooltip] [tgf_rival.Custom('GetTgfCompanyWord')]의 [tgf_rival.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 [tgf_good.Custom('GetTradeGood')](을)를 그곳까지 운반하는 비용보다 더 싼 가격으로 팔고 있다. 내 무역상인 [tgf_trader.GetFirstName](이)가 격노하고 있다.\n\n한편 나는 궁금해졌다. 그렇게 싼 물건이라면 누군가는 사게 될 텐데. 내가 사면 더 좋을 테고."
 gdp_trade_good_flavor.1047.a: "[tgf_rival.GetFirstNameNoTooltip](이)가 물건을 뿌릴 작정이라면, 내가 가져가겠다."
 gdp_trade_good_flavor.1047.b: "[tgf_rival.GetFirstNameNoTooltip](이)가 손해를 보고 팔게 둬라. 내 [tgf_good.Custom('GetTradeGood')](은)는 그대로 두면 되니까."
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "더미 속 문서"
 gdp_trade_good_flavor.1048.desc: "[tgf_source_county.GetNameNoTier]의 누군가가 내 마지막 [tgf_good.Custom('GetTradeGood')](을)를 건조하게 보관하려고 오래된 종잇장으로 감싸 놓았다. 내 무역상 [tgf_trader.GetFirstName](이)가 조심스럽게 종이를 풀었다. \"[Glossary( '서책', 'TGF_HOUSE_OF_WISDOM_GLOSS' )]이군요. 온전하진 않지만 대부분 남아 있습니다. 누군가 잃어버린 모양인데요.\"\n\n나는 [tgf_good.Custom('GetTradeGood')] 값만 치렀다. 서책은 무료로 얻었고. 어쩌면 이게 상품보다 값이 더 나갈지도 모른다."
 gdp_trade_good_flavor.1048.a: "내가 간직해야겠다."
 gdp_trade_good_flavor.1048.b: "[tgf_good.Custom('GetTradeGood')](와)과 같이 판다."
 gdp_trade_good_flavor.1048.c: "[tgf_source_county.GetNameNoTierNoTooltip](으)로 돌려보낸다."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "상인의 짐에 실려 국경을 넘어온 서책입니다. 바그다드에 있는 지혜의 집에서는 학자들이 그리스, 페르시아, 인도의 글을 아랍어로 번역했으며, 그중 상당수가 라틴어로 번역되었습니다."
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "고향에서 온 상인"
 gdp_trade_good_flavor.1049.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 다음과 같은 편지를 보냈다. \"여기에는 집에서 멀리 떠나와 고향을 그리워하는 [ROOT.Char.GetCulture.GetCollectiveNoun] 사람들의 [Glossary( '구역', 'TGF_DIASPORA_GLOSS' )]이 있습니다. 고향 사람들은 모두 [ROOT.Char.GetHouse.GetBaseNameNoTooltip]의 이름을 알지요. 여기서도 그 이름이 들리면 사람들이 몰려듭니다.\"\n\n알고 보니 향수병도 시장이 될 수 있는 모양이었다."
 gdp_trade_good_flavor.1049.a: "고향에서 팔던 것처럼, 저들에게도 물건을 판다."
 gdp_trade_good_flavor.1049.b: "저들 중 최연장자를 고향의 내 회사로 데려온다."
 gdp_trade_good_flavor.1049.c: "고향의 맛은 돈을 낼 가치가 있지."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "해외에 정착한 상인들은 자신들만의 구역을 지었습니다. 소그드인들은 비단길을 따라 자리 잡았고, 콘스탄티노폴리스에는 베네치아인들이, 또 유대인 무역상들은 카이로에서 아덴까지 자리 잡았습니다. 고향의 친족들은 이들을 통해 무역을 진행했습니다."
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "[tgf_good.GetNameNoTooltip]의 길"
 gdp_trade_good_flavor.1050.desc: "나는 [tgf_source_county.GetNameNoTier]에서 온 [Glossary( '밀수업자', 'TGF_SMUGGLER_GLOSS' )]인 [tgf_smuggler.GetFirstName](을)를 소개받았다. 이 사람은 요령을 하나 가지고 있는데, 바로 모든 수레의 맨 위에 가장 형편없는 품질의 물건을 두는 것이다. [tgf_good.Custom('GetTgfGoodFlaw')] 상품으로 말이다. 그러면 [tgf_market_holder.GetTitledFirstNamePossessive] 징세원들이 절대로 더 파헤치려 하지 않는다.\n\n\"시장가의 절반이지요.\" [tgf_smuggler.GetFirstNameNoTooltip](이)가 말했다. \"맨 위의 물건만 지나면, 그 밑은 전부 품질이 완벽한 상품입니다.\""
 gdp_trade_good_flavor.1050.a: "절반이라. 내가 제일 좋아하는 가격이로군."
 gdp_trade_good_flavor.1050.a.toast: "소문이 전해짐"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip](이)가 고마워하겠군. 자네 머리를 얻게 됐으니 말이야."
 gdp_trade_good_flavor.1050.c: "징세원들을 속인다? 자네를 고용하겠네."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "영주들이 상품에 세금을 매기는 곳이면 어디든, 밀수업자들이 세금을 피해 빠져나갔습니다. 소금은 거의 어디서나 세금이 매겨졌으며, 덕분에 가장 부유한 밀수업자들이 탄생했습니다. 중국 당나라에서는 소금 밀수업자였던 황소가 반란을 일으켜 수도인 장안을 점령하기도 했습니다."
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "묵직한 수확"
 gdp_trade_good_flavor.2001.desc: "[tgf_source_county.GetNameNoTier]에서 소식이 들려왔다. 내가 [tgf_good.Custom('GetTradeGood')](을)를 사는 곳이다. [tgf_source_culture.GetName] 농민들이 한 세대에 나올까 말까 할 정도로 풍요로운 수확을 거두어들였는데, 저장고에 다 담을 수 없을 정도라고 한다.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "[tgf_source_county.GetNameNoTier]에서 소식이 들려왔다. 내가 [tgf_good.Custom('GetTradeGood')](을)를 사는 곳이다. [tgf_source_culture.GetName] 목축민들이 한 세대에 나올까 말까 할 정도로 풍요로운 한 해를 보냈다고 한다. 모든 우리가 꽉 찼고, 동물을 먹일 풀이 부족한 상황이다.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "저들의 풍년이 나한테 좋은 가격으로 돌아오겠군."
 gdp_trade_good_flavor.2001.a: "저들이 축하하는 동안 가격을 확정한다."
 gdp_trade_good_flavor.2001.b: "말을 타고 나간다. 저들이 어떻게 작물을 길렀는지 배우자."
 gdp_trade_good_flavor.2001.b.livestock: "말을 타고 나간다. 저들이 어떻게 동물을 길렀는지 배우자."
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "사냥꾼의 전리품"
 gdp_trade_good_flavor.2002.desc: "\"[tgf_source_county.GetNameNoTier]의 [tgf_good.Custom('GetTgfGoodGatherers')]들이 한계를 뛰어넘었습니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 알렸다. \"한 철 분량의 [tgf_good.Custom('GetTradeGood')](이)가 한 번에 배송되었는데, 지금까지 받은 것 중에 제일 품질이 좋습니다. 벌써 제안이 들어오고 있습니다.\"\n\n다 팔까, 아니면 제일 좋은 건 남겨 둘까? 상인이 제일 좋아하는 부류의 고민이로군."
 gdp_trade_good_flavor.2002.a: "가격이 높을 때 전부 팔아라."
 gdp_trade_good_flavor.2002.b: "가장 좋은 것들은 남겨 둔다."
 gdp_trade_good_flavor.2002.c: "가판대를 가득 채워라. 모두가 조금씩 살 수 있게."
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "부의 광맥"
 gdp_trade_good_flavor.2003.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier] 도로에서 웃으며 돌아왔다. \"새로운 광맥이 발견됐습니다. 풍부하고 얕아서, 영지의 모든 광부가 채굴하려고 줄을 서고 있더군요. 지금은 [tgf_good.Custom('GetTradeGood')](이)가 쌉니다. 광맥까지 산다면 훨씬 더 저렴하게 얻을 수 있고요.\"\n\n광맥이 계속 저렴하게 남아 있는 경우는 드물긴 하지."
 gdp_trade_good_flavor.2003.desc.amber: "내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier] 도로에서 웃으며 돌아왔다. \"가을 폭풍으로 그 어느 때보다 많은 [tgf_good.Custom('GetTradeGood')](이)가 밀려왔습니다. 해안의 모든 가족이 물건을 모으러 나왔더군요. 지금은 [tgf_good.Custom('GetTradeGood')](이)가 쌉니다. #EMP 우리가#! 채집가들에게 수당을 주면 더 저렴하게 얻을 수 있고요.\"\n\n바다가 오래도록 너그러운 모습을 보이는 경우는 드물긴 하지."
 gdp_trade_good_flavor.2003.a: "채굴 지분을 산다."
 gdp_trade_good_flavor.2003.a.amber: "채집자들에게 수당을 준다."
 gdp_trade_good_flavor.2003.b: "수레가 가득 넘치는 동안 얼른 산다."
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "가치 있는 비밀"
 gdp_trade_good_flavor.2004.desc: "\"새로운 색입니다!\" 내 무역상 [tgf_trader.GetFirstName](이)가 멀리 [tgf_source_county.GetNameNoTier]에서 온 견본을 가져왔다. 염색장에서는 누구도 이 색의 비밀을 알지 못한다고 장담하고 있다.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "\"새로운 유약입니다!\" 내 무역상 [tgf_trader.GetFirstName](이)가 멀리 [tgf_source_county.GetNameNoTier]에서 온 견본을 가져왔다. 공방에서는 누구도 이 유약의 비밀을 알지 못한다고 장담하고 있다.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "비밀은 비싸지. 독점적인 비밀은 돈을 낼 가치가 있다."
 gdp_trade_good_flavor.2004.a: "가격을 제시하라. 이 비밀은 내 것이다."
 gdp_trade_good_flavor.2004.b: "훌륭하군. 알아 두겠다. 넘어가지."
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "상품 맛보기"
 gdp_trade_good_flavor.2005.desc: "상인은 상품을 잘 알아야 한다. 그래서 나는 내 [tgf_good.Custom('GetTradeGood')](을)를 직접 맛봤다. 한 번은 책임감에서, 두 번째로는 확실히 하기 위해서, 그다음은 순전히 쾌락을 위해서였다. 저녁이 되자 한 [tgf_good.Custom('GetTradeGoodUnit')](이)가 다 사라져 버렸다.\n\n맛있군. [tgf_source_culture.GetCollectiveNoun] 사람들이라면 값을 두 배로 올려도 사겠어."
 gdp_trade_good_flavor.2005.a: "두 배로 올린다. 저들이라면 두 배를 내겠지."
 gdp_trade_good_flavor.2005.b: "음. 품질을 확인하려는 거다. 하나만 더 먹어야지."
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "걸맞은 차림"
 gdp_trade_good_flavor.2006.desc: "[tgf_good.Custom('GetTradeGood')](을)를 팔고 싶으면 [tgf_good.Custom('GetTradeGood')](을)를 입어야 하는 법이다. 나는 가진 재고 중에서도 최고의 물건을 입은 채 시장에 도착했다. 그러자 구매자들이 내 옷을 다시 살펴보았다.\n\n영업은 상품이 알아서 한다. 나는 그저 상품을 입었을 뿐이고."
 gdp_trade_good_flavor.2006.a: "잘 맞는군. 이대로 입고 다니자."
 gdp_trade_good_flavor.2006.a.tt_furs: "당신이 이제부터 당신의 모피 망토를 입음"
 gdp_trade_good_flavor.2006.a.tt_leather: "당신이 이제부터 당신의 가죽 망토를 입음"
 gdp_trade_good_flavor.2006.a.tt_silk: "당신이 이제부터 당신의 비단 망토를 입음"
 gdp_trade_good_flavor.2006.a.tt_textiles: "당신이 이제부터 당신의 훌륭한 망토를 입음"
 gdp_trade_good_flavor.2006.b: "영업은 상품이 하게 두자."
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "얼굴값"
 gdp_trade_good_flavor.2007.desc: "\"새 [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')]에는 내 얼굴이 새겨질 걸세.\" [tgf_market_holder.GetTitledFirstName](이)가 말했다. \"그대의 [tgf_good.Custom('GetTradeGood')]도. 대신 유리한 가격으로 안정적인 공급을 해 주게.\"\n\n[tgf_market_holder.GetHerHis|U] 얼굴과 내 금속이 하나의 동전에 들어간다니. 역사는 우리 둘 모두를 기억하게 될 것이다."
 gdp_trade_good_flavor.2007.a: "유리한 가격이라! 첫 동전을 찍어 주시지요."
 gdp_trade_good_flavor.2007.b: "정가 그대로 받습니다. 돈은 돈이니까요."
 gdp_trade_good_flavor.2007.c: "유리한 가격? 제가 더 중요한 일을 처리해야 해서요."
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "멀쩡한 상품"
 gdp_trade_good_flavor.2008.desc: "\"상품 하나도 잃지 않았습니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 몹시 뿌듯해하는 얼굴로 말했다. \"상한 것도, 부서진 것도, 훔쳐 간 것도 없습니다. 모든 [tgf_good.Custom('GetTradeGood')](이)가 출발했던 상태 그대로 도착했습니다.\"\n\n이건 운이 아니다. 기술이고, 기술이라면 누군가에게 가르칠 수도 있겠지."
 gdp_trade_good_flavor.2008.a: "어떻게 포장했는지 가르쳐 주게."
 gdp_trade_good_flavor.2008.b: "세심한 손길이군. 대단한걸."
 gdp_trade_good_flavor.2008.c: "구매자들한테 알린다. 온전한 상품은 더 비싸게 팔아야지."
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "남들은 군대만 본다"
 gdp_trade_good_flavor.2009.desc: "전쟁이 [tgf_market_holder.GetTitledFirstName]에 이르렀다. 전쟁은 [tgf_good.Custom('GetTradeGood')](을)를 먹어 치우는 법. [tgf_market_holder.GetHerHis|U] 병참장들이 내 행로로 오는 물건은 무엇이든 사들이면서, 물건이 언제 더 오는지를 캐묻고 있다.\n\n남들은 군대만 보겠지. 나한테는 손님이 보인다."
 gdp_trade_good_flavor.2009.a: "전쟁은 그 대가를 미리 치르게 한다."
 gdp_trade_good_flavor.2009.b: "특권을 당장 서면으로 명시한다."
 gdp_trade_good_flavor.2009.c: "누가 그대의 무장을 준비해 주었는지 기억하시오."
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "조합의 알림"
 gdp_trade_good_flavor.2010.desc: "[tgf_source_county.GetNameNoTier]의 [tgf_source_culture.GetName] 조합이 나한테 매우 정중한 서신을 보내왔다. 내 가격이 자기들 상품의 가격보다 낮으니, 누군가 해를 입기 전에 함께 가격을 합의해 주면 좋겠다는 내용이었다.\n\n조합에서는 정중하게 문을 두드리지만, 그것도 단 한 번뿐이다."
 gdp_trade_good_flavor.2010.a: "요금을 낸다. 가격을 확정하자."
 gdp_trade_good_flavor.2010.b: "어디 한번 해 보라지."
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "유행을 선도하는 영주"
 gdp_trade_good_flavor.2011.desc: "소식은 수레보다 더 빠르게 전해진다. [tgf_market_holder.GetTitledFirstName](이)가 [tgf_source_county.GetNameNoTier]에 있는 자신의 궁정 사람들 앞에서 내 [tgf_good.Custom('GetTradeGood')](을)를 착용했다. 이제 궁정의 절반은 그걸 어디에서 구했는지 묻고 다닌다고 한다.\n\n영주는 유행을 선도한다. 상인은 가격을 정하고."
 gdp_trade_good_flavor.2011.a: "모두한테 알려라. 그 [tgf_good.Custom('GetTradeGood')](이)가 어디 것인지."
 gdp_trade_good_flavor.2011.b: "관심받는 동안 가격을 올린다."
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "상품 확인하기"
 gdp_trade_good_flavor.2012.desc: "[tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTradeGoodUnitPlural')](이)가 나를 빤히 응시한다. 이번 달은 암울했다. 머릿속은 쉴 틈이 없었고. 돈으로 살 수 있는 가장 좋은 술이 나를 둘러싸고 있다.\n\n품질 관리다. 아무도 알아야 할 필요는 없지."
 gdp_trade_good_flavor.2012.a: "품질 관리를 하는 거다. 전부 다."
 gdp_trade_good_flavor.2012.a.toast: "견본을 너무 많이 확인함"
 gdp_trade_good_flavor.2012.b: "아니. 재고는 재고로 남겨야 한다."
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "걸작 주문"
 gdp_trade_good_flavor.2013.desc: "\"가진 것 중의 최고의 [tgf_good.Custom('GetTradeGood')](을)를 주시고, 장인에 걸맞은 보수를 주십시오.\" [tgf_source_county.GetNameNoTier]에서 가장 뛰어난 [tgf_good.Custom('GetTgfGoodCrafter')]인 [tgf_crafter.GetFirstName](이)가 말했다. \"그러면 그 누구도 본 적 없는 물건을 만들어 드리겠습니다.\"\n\n지갑 사정을 좀 고려해 봐야겠다. 하지만 내 자존심으로 얘기하자면, 벌써 동의하고도 남았다."
 gdp_trade_good_flavor.2013.a: "보수에 합의하지. 나를 놀라게 해 보도록."
 gdp_trade_good_flavor.2013.b: "내 상품은 굳이 꾸미지 않아도 충분하다."
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "저들의 요리, 우리의 상품"
 gdp_trade_good_flavor.2014.desc: "\"저들이 이제 [tgf_source_province.Custom('GetTgfLocalDish')]에 그대의 [tgf_good.Custom('GetTradeGood')](을)를 사용한다고 합니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 요리를 맛보며 말했다. \"[tgf_source_county.GetNameNoTier]의 모두가 그런다고 하더군요. 요리사들은 그걸 새로운 방식이라 하고, 이제 옛 방식은 아무도 기억하지 않는다고 합니다.\"\n\n난 저쪽 [tgf_source_province.Custom('GetTgfLocalDish')](을)를 먹어본 적도 없는데. 이보다 더 자랑스러웠던 적이 있나 싶다."
 gdp_trade_good_flavor.2014.a: "그렇다면 새 방식에 돈을 더 낼 의향도 있겠지."
 gdp_trade_good_flavor.2014.b: "수레를 더 준비하라. 요리사들이 굶주리고 있으니."
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "대금은 상품으로"
 gdp_trade_good_flavor.2015.desc: "\"돈을 더 주십시오.\" [tgf_spokesperson.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]의 [tgf_good.Custom('GetTgfGoodGatherers')]들을 대신해 말했다. 나는 대신 [tgf_good.Custom('GetTradeGood')](을)를 제안했다.\n\n\"자네들이 모으는 것 아닌가.\" 내가 이렇게 지적했다. \"좋아하니 그렇게 모으겠지!\"\n\n물론 저들은 좋아하지 않았다."
 gdp_trade_good_flavor.2015.a: "대금을 치른다. 돈으로."
 gdp_trade_good_flavor.2015.b: "수익에서 저들의 몫을 챙겨 준다."
 gdp_trade_good_flavor.2015.c: "상품도 임금이다."
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "돈에서는 냄새가 나지 않는다"
 gdp_trade_good_flavor.2016.desc: "\"냄새가 고약한데.\" [tgf_source_county.GetNameNoTier]의 어느 구매자가 팔을 쭉 뻗어서 내 [tgf_good.Custom('GetTradeGood')](을)를 멀리 들고서 하는 말이었다. [tgf_good.Custom('GetTgfGoodFlaw')|U] 상품이라면서.\n\n나는 구매자의 돈을 받고 냄새를 맡아보았다. [Glossary( '아무 냄새도 안 나는데', 'TGF_PECUNIA_NON_OLET_GLOSS' )]."
 gdp_trade_good_flavor.2016.a: "물건을 코감기에 걸린 구매자한테 팔자."
 gdp_trade_good_flavor.2016.b: "냄새를 없앨 방법이 있지 않겠는가?"
 gdp_trade_good_flavor.2016.c: "돈을 내 코 밑에 둔다. 하루 종일."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#!. '돈에서는 냄새가 나지 않는다'라는 뜻입니다. 로마 황제인 베스파시아누스가 공중화장실 세금으로 수거한 동전을 아들의 코 밑에 대어주며 이 말을 했다고 전해집니다."
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "7년의 풍년"
 gdp_trade_good_flavor.2017.desc: "꿈을 꾸었는데[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')] 살진 소 일곱 마리와 마른 소 일곱 마리의 꿈이었다. 잠에서 깬 나는 아침을 먹기 전에 계산해 보았다.\n\n어려운 시절이 오면 얼마가 들지는 모르겠지만, 내 [tgf_good.Custom('GetTradeGood')](은)는 훨씬 더 비싸질 것이다."
 gdp_trade_good_flavor.2017.a: "모두 저장해 둔다. 마지막 한 [tgf_good.Custom('GetTradeGoodUnit')]까지."
 gdp_trade_good_flavor.2017.b: "가격이 쌀 때 더 사둔다."
 gdp_trade_good_flavor.2017.c: "소는 장부가 아니지. 다시 잠이나 잔다."
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "누군가의 소"
 gdp_trade_good_flavor.2018.desc: "밖으로 나갔더니 [tgf_good.Custom('GetTradeGood')] 한 무리가 문을 막고 있었다. 내 무역상 [tgf_trader.GetFirstName](이)가 그 가운데에서 웃고 있었다. \"[Glossary( '약탈자', 'TGF_CATTLE_RAID_GLOSS' )] [tgf_raider.GetFirstName](이)가 [tgf_market_holder.GetTitledFirstNamePossessive] 목초지에서 데려온 녀석들이라고 합니다. 어떻게 했는지는 묻지 마십시오. 일단 시장 가격의 절반입니다.\"\n\n가축의 옆구리마다 [tgf_market_holder.GetFirstNamePossessiveNoTooltip|U] 낙인이 찍혀 있었다.\n\n\"낙인이야 뭐.\" [tgf_trader.GetFirstNameNoTooltip](이)가 덧붙인다. \"바꾸면 되는 거고요.\""
 gdp_trade_good_flavor.2018.a: "낙인이 어떻든, 싼 건 싼 거다."
 gdp_trade_good_flavor.2018.a.toast: "누군가 낙인을 알아봄"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUINamePossessive] 무리에서 훔친 동물이라는 사실을 알면서도 동물을 구매함"
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUINamePossessive] 무리에서 훔친 동물이라는 사실을 알면서도 동물을 구매함"
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip](은)는 이 일로 나한테 신세를 지게 될 거다."
 gdp_trade_good_flavor.2018.c: "빠르게 도살한다."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "이웃의 동물 무리를 약탈하는 행위는 예로부터 오래된 놀이였으며, 진지한 문제로 발전하기도 했습니다. 아일랜드의 위대한 서사시 탄 보 쿠얼릉거는 황소 하나를 두고 벌어진 전쟁의 이야기를 담고 있습니다."
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "목마른 궁정의 갈증"
 gdp_trade_good_flavor.2019.desc: "\"[tgf_market_holder.GetTitledFirstNamePossessive] 궁정에서는 [tgf_good.Custom('GetTradeGood')](을)를 절대 안 마신다고 합니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말했다. \"근데 [tgf_market_holder.GetTitledFirstNamePossessiveNoTooltip] 궁정에서 우리 물건을 40[tgf_good.Custom('GetTradeGoodUnitPlural')](이)나 주문했다고도 하고요. 두 얘기 다 사실입니다.\"\n\n[tgf_market_holder.GetFirstNamePossessiveNoTooltip] 신앙에서는 [Glossary( '음주를 금지한다', 'TGF_ABU_NUWAS_GLOSS' )]. 하지만 바가지를 씌우는 행위는 그 어디에서도 금지하지 않는다."
 gdp_trade_good_flavor.2019.a: "통에 식초라고 써 붙이자."
 gdp_trade_good_flavor.2019.b: "가격을 두 배 올린다. 그래 봤자 누구한테 불만을 터뜨리겠는가?"
 gdp_trade_good_flavor.2019.b.toast: "다른 공급자"
 gdp_trade_good_flavor.2019.b.toast_good: "전액 지급"
 gdp_trade_good_flavor.2019.c: "내 목을 바칠 만한 가치는 없다. 다른 곳에서 팔자."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "수많은 궁정에서 포도주를 금지했으나, 그 궁정 대부분은 포도주를 좋아했습니다. 칼리프 하룬 알라시드의 궁정에 있던 시인 아부 누와스는 포도주에 관한 훌륭한 시 여러 편을 아랍어로 써냈습니다."
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "완벽한 덩어리"
 gdp_trade_good_flavor.3001.desc: "눈으로 보기도 전에 창고 전체에서 냄새가 났다. 치즈 덩어리가 어찌나 잘 숙성되어 풍미가 진한지, 짐꾼들이 반쯤은 장난으로 경비를 세워 두었다. 반쯤 말이다.\n\n이걸 팔면 연회를 벌일 수 있고, 그냥 가지고 있으면 그 자체로 연회가 된다."
 gdp_trade_good_flavor.3001.a: "목숨을 걸고 지켜라."
 gdp_trade_good_flavor.3001.b: "모든 것에는 값이 매겨지는 법. 완벽한 물건도 그렇다."
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "유명한 불만"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "알려진 것 중에서 가장 오래된 고객 불만 사항은 다음과 같습니다. 지금으로부터 약 3천 년 전, 난니라는 사람이 에아나시르라는 상인을 질책하는 내용이 우르에서 나온 점토판에 담겨 있습니다. 상인이 형편없는 구리 주괴를 내놓은 것도 모자라 난니의 전령을 무시했다고 합니다."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.GetTitledFirstName](이)가 내 구리는 질이 형편없고, 주괴는 가볍다며 서신을 보냈다. 모두 사실이었다.\n\n\"날 뭐로 보는 거요? 사람을 이렇게 [Glossary( '무시', 'TGF_EA_NASIR_GLOSS' )]해도 된다고 생각합니까?\"\n\n내 생각에 [tgf_market_holder.GetHerHim]는 괜찮은 손님이다. 이미 돈을 내지 않았는가."
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.GetSheHe|U]는 다시 사러 올 것이다. 늘 그러니까."
 gdp_trade_good_flavor.3002.a.toast: "다시는 어림없다"
 gdp_trade_good_flavor.3002.a.toast_good: "또 찾아옴"
 gdp_trade_good_flavor.3002.b: "내 구리는 진짜배기다. 어디 직접 시험해 보라지!"
 gdp_trade_good_flavor.3002.b.toast_bad: "발각됨"
 gdp_trade_good_flavor.3002.b.toast_good: "시험 결과가 잘 나왔음"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName]에게 가벼운 주괴를 팔았으며, 진짜 주괴라고 맹세함"
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U](이)가 [TARGET_CHARACTER.GetShortUIName]에게 가벼운 주괴를 팔았으며, 진짜 주괴라고 맹세함"
 gdp_trade_good_flavor.3002.c: "사과하고 다음번에는 더 나은 주괴를 준다."
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "대금은 후추로"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "후추의 가치는 동일한 무게의 은과 거의 비슷했으며, 대금 대신 후추를 지급할 때도 많았습니다. 런던에서는 서기 1000년경 애설레드 왕의 법에 따라 독일 상인에게 부과하는 통행료 일부를 후추로 받았습니다."
 gdp_trade_good_flavor.3003.desc: "[tgf_source_county.GetNameNoTier]에 있는 내 채무자 [tgf_debtor.GetFirstName]에게 돈이 다 떨어졌다. 그래서 [tgf_debtor.GetSheHe]는 [Glossary( '후추', 'TGF_PEPPER_GLOSS' )]로 대금을 치르기로 했다. 한 번에 [tgf_good.Custom('GetTradeGoodUnit')] 하나씩 말이다. 결국 내 탁자는 향신료 시장 같은 냄새를 풍기게 되었다.\n\n나는 수를 두 번 세어 보았다. 그리 나쁜 장사는 아니었다. 분명 [tgf_debtor.GetFirstNameNoTooltip] 말고도 이런 경우가 더 있겠지."
 gdp_trade_good_flavor.3003.a: "앞으로는 후추도 받겠소."
 gdp_trade_good_flavor.3003.b: "돈만 받소. 어떻게든 긁어모아 오도록."
 gdp_trade_good_flavor.3003.c: "나를 위해 일하시오. 채무는 기다려 줄 수 있으니."
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "불만 가득한 편지"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "상인들의 편지는 수 세기에 걸쳐 보관되었습니다. 버려진 문서로 가득한 유대교 회당 창고인 카이로의 게니자에도 이러한 편지가 보존되어 있습니다. 이 서신들은 지중해 무역의 실상을 불만 가득한 어조로 상세히 묘사하고 있습니다. 특히 아마 상인들의 불평이 가장 많습니다."
 gdp_trade_good_flavor.3004.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에 있던 내 아마 더미를 괜찮은 가격에 모두 팔았다. [tgf_trader.GetHerHis|U] [Glossary( '편지', 'TGF_GENIZA_GLOSS' )]에는 그 사실이 한 줄로 담겨 있었다. 나머지 40줄은 불만이었다. 습기, 짐꾼, 구매자, 내 포장에 대해서.\n\n수익이 먼저고, 불평은 그다음이다. 이 순서가 뒤바뀌면 슬슬 걱정이 된다."
 gdp_trade_good_flavor.3004.a: "수익에 관한 내용은 한 줄이군. 그 줄만 두 번 읽는다."
 gdp_trade_good_flavor.3004.b: "무료 조언이 40줄이나 되는군."
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "장식용 음식"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "설탕과 아몬드 반죽으로 만들어 연회의 요리 사이에 내놓던 장식입니다. 성채, 선박, 짐승 등의 모습으로 빚어낸 장식은 손님들을 놀라게 했습니다. 웅장한 장식용 음식은 후식의 역할을 할 뿐만 아니라, 정치적인 의도를 담는 수단이 되기도 했습니다."
 gdp_trade_good_flavor.3005.desc: "\"[tgf_market_holder.GetTitledFirstName](이)가 설탕 [ROOT.Char.Custom('GetRandomRegionalBird')](을)를 구한답니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말했다. \"실제 크기의 두 배가 되어야 하고, 깃털도 전부 장식해서 하지까지 [tgf_market_holder.GetHerHis] 식탁에 올려야 한다고 하더군요. 연회를 빛낼 [Glossary( '장식용 음식', 'TGF_SUBTLETY_GLOSS' )]이랍니다.\"\n\n설탕은 녹는다. 하지만 평판은 오래가는 법이지."
 gdp_trade_good_flavor.3005.a: "내가 만들겠다. 실물보다 더 크게."
 gdp_trade_good_flavor.3005.a.success: "연회장이 고요해짐"
 gdp_trade_good_flavor.3005.a.failure: "한쪽으로 기울어진 새"
 gdp_trade_good_flavor.3005.b: "연회 장식에는 그에 걸맞은 가격을 받아야지."
 gdp_trade_good_flavor.3005.c: "나는 조각이 아니라 설탕을 판다."
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "무리"
 gdp_trade_good_flavor.3006.desc: "난데없이 벌들이 도착해 서까래에 집을 지었다. 녀석들은 이제 내 창고에서 임대료도 내지 않고 꿀을 생산하고 있다.\n\n꿀로 임대료를 내는 세입자라니. 세상에는 이보다 더 조건이 안 좋은 거래도 있기는 하다. 물론 벌침을 제외할 때의 얘기지만."
 gdp_trade_good_flavor.3006.a: "공짜로 얻는 꿀이라. 뭐 대가가 들어 봤자 얼마나 들겠나?"
 gdp_trade_good_flavor.3006.a.toast: "벌에 쏘임!"
 gdp_trade_good_flavor.3006.b: "살게 둬라. 임대료 없이."
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "찻주전자 하나 더"
 gdp_trade_good_flavor.3007.desc: "상품을 알아야 하니까 한 잔. 첫 잔이 괜찮았으니 다음 잔. 그렇게 자정이 되니, 어느새 장부 세 권을 다시 세어보고 편지도 두 통이나 쓴 뒤였다. 그래도 아직 힘이 넘친다.\n\n정말 괜찮은 상품이 온 것 같다. 아니면 아주 비싼 취미가 생겨버린 꼴이 되겠지."
 gdp_trade_good_flavor.3007.a: "차를 주전자로 하나 더 마신다. 아침마다."
 gdp_trade_good_flavor.3007.b: "차를 회사 전체에 돌린다."
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "변하기 전에"
 gdp_trade_good_flavor.3008.desc: "내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTradeGoodUnit')] 하나를 열어보고 얼굴을 찡그렸다. \"강의 안개가 스며들었군요. 지금이야 부드럽지만, 이번 주말이 되면 아마 곰팡이가 필 겁니다.\"\n\n말린 과일은 몇 년을 두어도 끄떡없다. 젖은 과일은 며칠밖에 가지 못한다. 시간이 곧 돈이다."
 gdp_trade_good_flavor.3008.a: "다시 말려라. 이번에는 잘 말려야 한다."
 gdp_trade_good_flavor.3008.b: "발효되게 둬라. 포도주라고 하지, 뭐."
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "자정의 기름"
 gdp_trade_good_flavor.3009.desc: "장부를 다 보기도 전이었는데, 등불의 기름이 한 시간이나 먼저 바닥났다. 그래서 내 재고였던 것을 태웠다. 팔려고 했던 좋은 [tgf_good.Custom('GetTradeGood')] 말이다. 우리가 버리는 탁한 찌꺼기보다 더 밝게 타오르지는 않았다.\n\n더 밝지도 않은데. 그래도 구매자들은 세 배나 더 비싼 가격으로 이걸 사들인다."
 gdp_trade_good_flavor.3009.a: "등불용으로는 찌꺼기를 팔고, 좋은 기름은 식탁용으로 판다."
 gdp_trade_good_flavor.3009.b: "계속 태운다. 회계가 먼저니까."
 gdp_trade_good_flavor.3009.c: "자러 간다. 기름도 휴식이 필요하겠지."
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "덜 익었을 때"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "곡물을 '덜 익었을 때' 구매하면 밭에서 아직 푸르른 상태일 때 대금을 지급하며, 가격은 수확물의 가격보다 훨씬 더 낮게 책정됩니다. 설교자와 교회 법학자는 이러한 관행을 위장한 고리대금업이라며 규탄했습니다."
 gdp_trade_good_flavor.3010.desc.condemned: "내 신앙에서는 고리대금업이라 한다. 장부에서는 할인이라 하고."
 gdp_trade_good_flavor.3010.desc.permitted: "어떤 신앙에서는 고리대금업이라 하겠지. 내 경우는 선견지명이라 하겠다."
 gdp_trade_good_flavor.3010.desc.intro: "\"지금은 아직 푸르지만, 여름이 되면 황금빛으로 익을 겁니다.\" [tgf_source_county.GetNameNoTier]의 [tgf_peasant.GetFirstName](이)가 무릎까지 오는 진흙 속에서 말했다. \"오늘 가격으로 대금을 치러 주십시오. [Glossary( '덜 익었을 때', 'TGF_IN_THE_BLADE_GLOSS' )] 말입니다. 그러면 수확물을 가져가실 수 있습니다.\"\n\n"
 gdp_trade_good_flavor.3010.a: "내년의 수확물을 올해 가격으로 가져간다."
 gdp_trade_good_flavor.3010.b: "작물이 다 자랄 때까지 잘 두고 보살피게."
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "10년을 가는 잡곡"
 gdp_trade_good_flavor.3011.desc: "새로 생긴 재고 뒤편에서 수년 전에 잘못 세어진 채 잊힌 잡곡 [tgf_good.Custom('GetTradeGoodUnitPlural')](을)를 발견했다. 낱알들 상태가 아직 좋다. 잡곡은 오래 간다.\n\n과거의 내가 무료로 재고를 남겨주었다. 이런 게 최고의 상속이지."
 gdp_trade_good_flavor.3011.a: "판다. 과거의 나도 그러길 바랄 테니까."
 gdp_trade_good_flavor.3011.b: "여정을 위해 포장한다. 잡곡은 오래 가니까."
 gdp_trade_good_flavor.3011.c: "창고 전체의 수량을 다시 확인한다."
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "백미냐 아니냐"
 gdp_trade_good_flavor.3012.desc: "백미는 하얗고 가벼우며 모든 상류층 식탁에서 원하는 식재료다. 현미는 묵직하고 갈색이며 다른 모든 곳에서 원하는 식재료다. 내 무역상 [tgf_trader.GetFirstName](은)는 내가 어떤 부류의 상인인지 알고 싶어 한다.\n\n난 돈을 버는 부류의 상인이다."
 gdp_trade_good_flavor.3012.a: "백미로 만들자. 상류층에서는 비싼 값을 치르니까."
 gdp_trade_good_flavor.3012.b: "현미로 판다. 값싼 쌀을 모두에게 파는 거다."
 gdp_trade_good_flavor.3012.c: "품질 좋은 쌀은 백미로, 나머지는 현미로 판다."
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "단식 전"
 gdp_trade_good_flavor.3013.desc: "\"곧 [tgf_source_faith.Custom('GetTgfFastName')](이)가 시작됩니다!\" 내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 급히 편지를 보내왔다. \"몇 주 동안 아무도 고기에 손도 안 댈 겁니다. 그 뒤에는 고기 말고는 아무것도 안 찾을 테고요.\"\n\n굶주린 구매자는 절대 흥정하는 법이 없지."
 gdp_trade_good_flavor.3013.desc_ramadan: "\"곧 라마단이 시작됩니다!\" 내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 급히 편지를 보내왔다. \"해가 지기 전까지는 아무도 음식을 먹지 않습니다. 해가 진 뒤에는 다들 고기 말고는 아무것도 안 먹을 겁니다.\"\n\n굶주린 구매자는 절대 흥정하는 법이 없지."
 gdp_trade_good_flavor.3013.a: "나도 단식한다. 고기는 어디 가진 않으니까."
 gdp_trade_good_flavor.3013.b: "염장해 뒀다가 사람들이 굶주릴 때를 기다린다."
 gdp_trade_good_flavor.3013.c: "단식이 시작되기 전의 마지막 연회에서 전부 팔아치운다."
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "트집 잡기"
 gdp_trade_good_flavor.3014.desc: "말 장수 [tgf_dealer.GetFirstName|U](은)는 자신이 신성하게 여기는 모든 것에 대고 맹세했다. \"4살입니다. 많아 봤자 5살이고요. 이 녀석 털 좀 보십시오!\" 털은 매우 좋아 보였다. 그런데 이빨은 달랐다. [tgf_dealer.GetSheHe]가 내 시선을 자꾸 다른 곳으로 돌리려고 한다.\n\n선물을 받으면 눈앞에서 들여다보며 트집을 잡지 말라는 얘기가 있다. 근데 이 녀석은 선물이 아닌 것 같다."
 gdp_trade_good_flavor.3014.a: "입을 벌리게 하라. 이빨을 좀 봐야겠군."
 gdp_trade_good_flavor.3014.b: "늙었든 아니든, 이 녀석은 내 거다."
 gdp_trade_good_flavor.3014.c: "말을 믿음직하게 하는군. 내 회사에 들어오는 게 어떤가."
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "시장을 위한 살찌우기"
 gdp_trade_good_flavor.3015.desc: "\"동물 무리가 마르고 지친 채로 [tgf_source_county.GetNameNoTier]에 도착했습니다. 무슨 유령들 같더군요.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말했다. \"[tgf_market_holder.GetTitledFirstName](이)가 근처에 좋은 방목지를 가지고 있는데, 우리한테 내주겠답니다. 물론 대가를 받고서요.\"\n\n살이 찌면 잘 팔린다. 풀은 살보다 값이 싸다."
 gdp_trade_good_flavor.3015.a: "풀 값을 내라. 살찐 동물을 팔자."
 gdp_trade_good_flavor.3015.b: "마른 짐승도 값을 받을 수 있긴 하니까."
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "필경사를 위한 송아지 가죽"
 gdp_trade_good_flavor.3016.desc: "[tgf_market_holder.GetTitledFirstName]의 사제인 [tgf_chaplain.GetTitledFirstName](이)가 성물을 고르는 순례자처럼 내 무두장을 거닐었다. \"이걸 얇게 깎아내면 신성한 말씀을 천 년도 더 간직할 수 있을 겁니다.\" [tgf_chaplain.GetSheHe]가 말했다.\n\n내 가죽이 천 년을 간다니. 소가죽치고는 나쁘지 않은 장사 같다."
 gdp_trade_good_flavor.3016.a: "가장 좋은 가죽을 가져가시오. 선물이오."
 gdp_trade_good_flavor.3016.b: "그렇다면 필경사를 위해 팔겠다. 오래도록 간직되게 하자."
 gdp_trade_good_flavor.3016.c: "차라리 구두 수선공한테 팔고 말지."
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "양모 사전 구매"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "시토회 수도원에서는 한 해 내내 수확할 양모를 이탈리아와 플란데런 상인들에게 몇 년 앞서서 판매해, 아직 자라지 않은 양털의 값을 돈으로 받았습니다. 이 과정에서 많은 수도원이 채무에 허덕이게 되었습니다."
 gdp_trade_good_flavor.3017.desc: "\"[tgf_abbot.GetTitledFirstName](이)가 앞으로 수년간 [tgf_abbey.GetNameNoTier]의 양모를 제공해 주겠다고 합니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말했다. \"지금 [Glossary( '양모 1년 치', 'TGF_WOOL_CLIP_GLOSS' )]의 대금을 치르면 양털을 조금씩 배송해 준답니다. 돈은 오늘 달라고 하고 있고요.\"\n\n미래를 내다보며 계획을 세우는 모양이다. 상인들도 그러는데 말이다."
 gdp_trade_good_flavor.3017.a: "지금 돈을 주면 몇 년간 양털을 받을 수 있다."
 gdp_trade_good_flavor.3017.b: "난 이미 털을 깎은 양을 선호해서."
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "식물 양"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "여행자와 학자들의 입을 통해 전해지는 전설이 있습니다. 먼 동쪽에 있는 어느 식물의 줄기에서는 살아있는 양이 자란다고 합니다. 양은 줄기가 시들 때까지 주변의 풀을 뜯습니다. 식물에서 자라는 양모나 다름없는 목화를 설명하는 설화였습니다."
 gdp_trade_good_flavor.3018.desc: "[tgf_source_county.GetNameNoTier]의 구매자 [tgf_buyer.GetFirstName|U](이)가 내 목화솜 다발을 돌려 보며 신기해했다. \"그게 사실입니까? 작은 양이 열리는 식물이 있다면서요. 양들은 그 줄기가 시들 때까지 풀을 뜯어 먹는다던데.\"\n\n[Glossary( '식물 양', 'TGF_VEGETABLE_LAMB_GLOSS' )]이군. 경이로운 것은 잘 팔리는 법이다."
 gdp_trade_good_flavor.3018.a: "그 말이 맞소. 아주 희귀하지."
 gdp_trade_good_flavor.3018.b: "양이 아니오. 그냥 푹신한 식물일 뿐이지."
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "스폴리아"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "옛 건물에서 떼온 돌을 새 건물에 재사용합니다. 고대의 유적에서 떼어낸 기둥, 조각, 기록이 새겨진 석재 등이 중세 세계 전역의 교회, 벽, 주택에 사용되었습니다."
 gdp_trade_good_flavor.3019.desc: "\"채석공들이 채석 작업을 멈췄습니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 [tgf_source_county.GetNameNoTier]에서 쓴 편지에서 이렇게 털어놓았다. \"대신 오래된 유적에서 돌을 잘라내고 있더군요. 기둥, 조각, 전부 다 말입니다.\"\n\n[Glossary( '스폴리아', 'TGF_SPOLIA_GLOSS' )]다. 옛 석재에 새로운 가격을 매기는 거다."
 gdp_trade_good_flavor.3019.a: "골동품 돌이니 골동품 가격을 매긴다."
 gdp_trade_good_flavor.3019.b: "가장 좋은 조각은 남겨둔다."
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "돛대 몸통"
 gdp_trade_good_flavor.3020.desc: "\"[tgf_market_holder.GetTitledFirstNamePossessive] 조선공들이 우리 [tgf_good.Custom('GetTradeGood')](을)를 구하고 있습니다.\" 내 무역상 [tgf_trader.GetFirstName](이)가 말했다. \"그냥 단순한 나무는 안 됩니다. 돛대에 써야 하니 가장 길고 튼튼한 나무 몸통을 달라고 합니다. 저쪽에서도 완벽한 상태의 목재는 구하기 힘들다는 걸 알고 있습니다.\"\n\n희귀한 것은 절대 서둘러 팔면 안 되는 법이다."
 gdp_trade_good_flavor.3020.a: "가장 좋은 몸통은 내 선박에 쓰겠다."
 gdp_trade_good_flavor.3020.b: "팔겠다. 돛대는 언제까지고 기다려 주지 않으니까."
 gdp_trade_good_flavor.3020.c: "기다리게 둬라. 그러면 가격도 치솟겠지."
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "연기 나는 천막"
 gdp_trade_good_flavor.3021.t_bhang: "방 한 잔"
 gdp_trade_good_flavor.3021.t_hashish: "닫힌 문 너머의 단맛"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "헤로도토스는 스키타이인들이 닫힌 펠트 천막 안에서 붉게 달궈진 돌 위에 대마 씨앗을 던지고, 그 연기 속에서 즐겁게 울부짖었다는 이야기를 썼습니다. 초원의 민족들은 이 관습을 오랫동안 이어갔습니다."
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.GetSheHe|U]가 천막의 뜨거운 돌 위로 대마 씨앗을 던지자 연기가 피어올랐다. \"[Glossary( '들이마셔 보십시오', 'TGF_HEMP_TENT_GLOSS' )]. 우린 거래를 이런 식으로 진행합니다.\"\n\n당연하지만, 순전히 사업상의 이유로 하는 일이다."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "아타르바베다에서는 방을 다섯 가지 신성한 식물 중 하나로 취급합니다. 대마잎을 갈아 우유, 버터, 향신료와 섞어 음료로 만듭니다. 이 음료를 축제에서 마시고, 시바 신에게도 바쳤습니다."
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.GetSheHe|U]가 대마잎을 갈아 우유와 향신료를 섞고, 잔에 담아 내게 건네주었다. \"[Glossary( '방', 'TGF_HEMP_BHANG_GLOSS' )]입니다. 축제 때가 되면 온 마을이 이걸 마시지요. 오늘은 그대도 이걸 마시는 겁니다.\"\n\n거절하면 무례해 보이겠지. 무례하면 사업에도 좋지 않을 테고."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "하시시는 반죽 및 간식에 넣어 먹는 대마 진액입니다. 12세기부터 시작되어 이집트와 시리아 전역으로 퍼져 나갔습니다. 일부 수피는 하시시를 황홀경에 이르는 길이라며 칭송했으나, 법학자들은 이를 규탄했고 통치자들은 대마밭 전체를 불태워 버렸습니다."
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.GetSheHe|U]가 문을 닫더니 압착한 대마 진액으로 만든 작고 달콤한 간식을 꺼내 보였다. \"[Glossary( '하시시', 'TGF_HEMP_HASHISH_GLOSS' )]입니다. 법학자들은 이걸 보면 눈살을 찌푸리지요. 하지만 여긴 법학자가 없으니까요.\"\n\n구매자의 제안을 거절한다면 무례해 보일 것이다."
 gdp_trade_good_flavor.3021.desc.intro: "\"[tgf_good.Custom('GetTradeGood')|U](을)를 [tgf_good.Custom('GetTgfHempUse')]에 쓴단 말입니까?\" [tgf_source_county.GetNameNoTier]의 [tgf_hemp_host.GetTitledFirstName](이)가 웃음을 터뜨렸다. \"우린 그보다 더 나은 용도로 쓰지요.\"\n\n"
 gdp_trade_good_flavor.3021.a: "사업은 사업이지. 씨앗을 주시오."
 gdp_trade_good_flavor.3021.a_bhang: "사업은 사업이지. 잔을 주시오."
 gdp_trade_good_flavor.3021.a_hashish: "사업은 사업이지. 간식을 주시오."
 gdp_trade_good_flavor.3021.b: "팔아버린다. 내 머릿속은 맑게 유지해야지."
 gdp_trade_good_flavor.3021.a.toast_habit: "새로운 버릇"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "최고의 상품으로 만든 칼날"
 gdp_trade_good_flavor.3022.desc: "[tgf_source_county.GetNameNoTier]에서 온 [tgf_smith.GetFirstName](이)라는 대장장이가 손바닥에 내 주괴를 쥐고 무게를 가늠하더니 씩 웃었다. \"가장 좋은 주괴를 가져다주십시오. 그러면 그 금속보다 값이 열 배는 더 나갈 칼날을 만들어 드리겠습니다.\"\n\n열 배라니. 상인하고 대화하는 법을 잘 아는 사람 같군."
 gdp_trade_good_flavor.3022.a: "단조하시오. 그 자랑에 걸맞게 만들어 보시게."
 gdp_trade_good_flavor.3022.b: "어느 주괴가 좋은 주괴인지 알려 주시오."
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "세공사의 주장"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "보석을 절단하고 연마하는 사람으로, 보석 세공 서적을 읽기도 합니다. 이 책에는 독을 막아주는 사파이어부터 술에 취하지 않게 해 주는 자수정에 이르기까지, 모든 원석에 숨겨진 능력이 적혀 있습니다."
 gdp_trade_good_flavor.3023.desc: "[tgf_source_county.GetNameNoTier]의 [Glossary( '세공사', 'TGF_LAPIDARY_GLOSS' )]인 [tgf_lapidary.GetFirstName|U](이)가 내 보석 중 하나를 빛에 비추며 진지하게 살펴보았다. \"이 원석은 [ROOT.Char.Custom('GetTgfAilment')](을)를 막아줍니다. 책에도 그리 쓰여 있지요.\"\n\n가격에는 그렇게 쓰여 있지 않다. 아직은 말이다."
 gdp_trade_good_flavor.3023.a: "그 주장과 함께 판다. 가격도 맞춰서 책정해야지."
 gdp_trade_good_flavor.3023.b: "내 회사에 들어오시오. 그 서책도 챙겨오고."
 gdp_trade_good_flavor.3023.c: "책하고 입씨름할 생각은 없다."
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "신사의 돌"
 gdp_trade_good_flavor.3024.desc: "옥 감정가인 [tgf_connoisseur.GetFirstName|U](이)가 내 보석들을 하나씩 치아에 부딪혀 보며 그 소리에 귀를 기울였다. 그러더니 그중에서 2개를 따로 빼두었다. \"활석암입니다. 품질이 좋은 활석암이군요.\" 나머지를 향해서는 인정하듯 천천히 고개를 끄덕여 보였다.\n\n거짓에서 진실을 가려낼 수 있는 인물이라면, 거짓과 진실보다도 더 가치가 있기 마련이다."
 gdp_trade_good_flavor.3024.a: "가짜 원석을 부순다. 그 공급업자도 밝혀낸다."
 gdp_trade_good_flavor.3024.b: "내 회사에 들어오시오. 그대 안목은 보수를 받을 만하군."
 gdp_trade_good_flavor.3024.c: "그 이빨로 하는 기술을 좀 가르쳐 주시오."
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "도자기 바닥짐"
 gdp_trade_good_flavor.3025.desc: "내 무역상 [tgf_trader.GetFirstName](은)는 매우 뿌듯해했다. \"선박에는 바닥짐이 필요합니다. 그런데 우리 도자기들은 무겁지요. 덕분에 선장이 우리한테 요금을 거의 청구하지 않았습니다.\"\n\n알아서 운송비를 부담하는 화물이라. 내가 제일 좋아하는 부류의 화물이다."
 gdp_trade_good_flavor.3025.a: "절약한 금액을 다음 화물에 투자한다."
 gdp_trade_good_flavor.3025.b: "도자기를 바닥짐으로 적재하는 방법을 배운다."
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "따가운 수액"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "옻칠은 공기 중에 그냥 두면 마르지 않습니다. 수액을 바를 때마다 따뜻하고 습한 방에서 며칠 동안 굳혀야 하며, 훌륭한 작품을 만들려면 수십 번은 덧발라야 합니다. 아직 덜 굳은 수액을 만지면 피부에 물집이 일어납니다."
 gdp_trade_good_flavor.3026.desc: "마지막 수지 층이 다 [Glossary( '굳기도', 'TGF_LACQUER_CURE_GLOSS' )] 전에 새로운 칠기가 도착했다. 완성품은 완벽해 보였다. 색이 깊고, 광택이 나며 젖은 듯한 느낌이었다. 당장 확인해 보고 싶어 손가락이 근질거린다.\n\n옻칠 장인들은 수액이 따갑다고들 한다. 과장이 좀 들어간 얘기겠지."
 gdp_trade_good_flavor.3026.a: "습한 방을 만들어 제대로 굳힌다."
 gdp_trade_good_flavor.3026.b: "한 번만 만져 보겠다. 확실히 해야 하니까."
 gdp_trade_good_flavor.3026.b.toast_rash: "옻 수액이 따가움"
 gdp_trade_good_flavor.3026.c: "굳게 두자. 좋은 물건은 기다려야 하는 법."
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "독서석"
 gdp_trade_good_flavor.3027.desc.intro: "[tgf_source_county.GetNameNoTier]에서 온 유리 제작자 [tgf_glassmaker.GetFirstName](이)가 내 장부 위에 매끄럽게 다듬은 돌 두 개를 올려두었다. 작은 숫자들이 커지며 선명하고 검게 보였다. \"노안에 좋습니다. 눈이 피곤할 때도 좋고요.\"\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "내가 바로 그 두 경우였다. 그런데 수년 만에 처음으로, 모든 계약서의 작은 글자를 다 읽을 수 있었다."
 gdp_trade_good_flavor.3027.desc.young_eyes: "나는 둘 중 어느 경우도 아니었다. 그런데 지금은 모든 계약서의 작은 글자까지 다 읽을 수 있었다."
 gdp_trade_good_flavor.3027.a: "한 쌍 주시오. 잘 포장해서."
 gdp_trade_good_flavor.3027.b: "[tgf_market_holder.GetTitledFirstNameNoTooltip]에게 한 쌍을 보낸다."
 gdp_trade_good_flavor.3027.c: "원석은 됐다. 저들의 비밀을 얻는다."
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "축일 가격"
 gdp_trade_good_flavor.3028.desc.christian: "\"신성한 날이 다가오고 있습니다.\" [tgf_source_county.GetNameNoTier]에서 이제 막 돌아온 내 무역상 [tgf_trader.GetFirstName](이)가 알렸다. \"모든 구매자가 동방박사에게 걸맞은 향을 찾고 있습니다. 감히 제단에서 태울 물건을 두고 흥정할 사람은 없을 테고요.\"\n\n"
 gdp_trade_good_flavor.3028.desc: "\"신성한 날이 다가오고 있습니다.\" [tgf_source_county.GetNameNoTier]에서 이제 막 돌아온 내 무역상 [tgf_trader.GetFirstName](이)가 알렸다. \"모든 구매자가 신성한 성지에 걸맞은 향을 찾고 있습니다. 감히 제단에서 태울 물건을 두고 흥정할 사람은 없을 테고요.\"\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "흥정하지 않는 구매자라. [ROOT.Char.GetFaith.HighGodName]께서 주신 선물이군."
 gdp_trade_good_flavor.3028.a: "축일에 나도 직접 향을 태우겠다."
 gdp_trade_good_flavor.3028.b: "사원에 우선권을 주겠다. 물론 원가로 넘기는 조건이다."
 gdp_trade_good_flavor.3028.c: "축일이니, 그에 걸맞은 가격을 받아야지."
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "테리아카"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "유명한 만병통치약입니다. 독사의 살, 아편을 포함한 수십 가지 재료로 만들어 수년간 숙성합니다. 의사들은 이 약을 중독 증상, 역병을 비롯해 거의 모든 질병의 치료제로 처방했습니다."
 gdp_trade_good_flavor.3029.desc: "[tgf_source_county.GetNameNoTier]의 약제상 [tgf_apothecary.GetFirstName|U](이)가 약초 향이 나는 편지를 보내왔다. \"그대가 [Glossary( '테리아카', 'TGF_THERIAC_GLOSS' )]를 만드는 데 필요한 물건을 팔고 있더군요. 독, 역병, 다른 모든 질병을 막아 주는 만병통치약입니다.\"\n\n그게 효험이 있는지는 [tgf_apothecary.GetHerHim]와 그 환자들이 알아볼 일이다. 나는 팔기만 하면 되니까."
 gdp_trade_good_flavor.3029.a: "제조하시오. 내 무역로에서 팔기로 하고."
 gdp_trade_good_flavor.3029.b: "64가지 재료 모두. 내가 제공하겠소."
 gdp_trade_good_flavor.3029.c: "제조법과 복용량을 알려주시오."
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "특허장에 쓸 종이는 없다"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "1231년에 프리드리히 2세는 시칠리아 왕국의 공증인들에게 공문서를 종이에 작성하지 말라는 명령을 내렸습니다. 종이는 중요한 문서로 쓰기에는 너무 연약하므로, 양피지면 충분하다는 것이 황제의 주장이었습니다."
 gdp_trade_good_flavor.3030.desc: "\"[tgf_market_holder.GetTitledFirstNamePossessive] 서기들은 공문서 관련 일이라면 [Glossary( '종이를 건드리지도 않을 겁니다', 'TGF_PAPER_GLOSS' )].\" [tgf_source_county.GetNameNoTier]에서 돌아온 내 무역상 [tgf_trader.GetFirstName](이)가 아직도 넌더리를 내며 말했다. \"양피지만 된다고 하더군요. 그게 무슨 신성한 물건도 아닌데.\"\n\n모든 규칙에는 논쟁의 여지가 있기 마련이다."
 gdp_trade_good_flavor.3030.a: "논쟁을 벌인다. 종이가 곧 미래이거늘."
 gdp_trade_good_flavor.3030.a.success: "문서국에서 종이를 받아들임"
 gdp_trade_good_flavor.3030.a.failure: "문서국이 양피지를 계속 씀"
 gdp_trade_good_flavor.3030.b: "그렇다면 내 양피지를 사게 될 것이다."
 gdp_trade_good_flavor.3030.c: "그렇다면 저들이 뭘 원하는지 알아내야겠군."
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "그루트냐 홉이냐"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "습지 도금양, 서양톱풀 등과 같은 여러 약초의 혼합물입니다. 홉이 쓰이기 전, 에일에 이 혼합물을 넣으면 향미가 추가되며 오래 보존할 수 있었습니다. 많은 영주가 그루트를 판매할 유일한 권리를 보유했고, 따라서 모든 양조주에 세금을 부과했습니다."
 gdp_trade_good_flavor.3031.desc: "\"홉입니다.\" [tgf_source_county.GetNameNoTier]의 양조업자인 [tgf_brewer.GetFirstName](이)가 내 통 너머에서 속삭였다. \"몇 개월도 넘게 가는 맥주가 만들어지지요. 근데 홉에는 아무도 세금을 못 매깁니다.\" [tgf_source_county.GetNameNoTier]에서는 모든 양조업자가 [tgf_market_holder.GetTitledFirstNamePossessive] [Glossary( '그루트', 'TGF_GRUIT_GLOSS' )]를 사야 하며, 그에 따라 세금을 납부해야 한다.\n\n진보를 이루려면 누군가 대가를 치러야 하는 법이지."
 gdp_trade_good_flavor.3031.a: "홉으로 하자. 널리 퍼지게 하라."
 gdp_trade_good_flavor.3031.b: "[tgf_market_holder.GetTitleAsNameNoTooltip|l](이)가 선호하는 그루트로 하자."
 gdp_trade_good_flavor.3031.c: "모든 통에 두 가지를 같이 넣는다."
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "과일 바구니"
 gdp_trade_good_flavor.3032.desc: "[tgf_source_county.GetNameNoTier]에서는 [tgf_fruit_province.Custom('get_region_fruit_plural')](을)를 바구니째 먹는다. 이 과일은 다음 마을보다 더 먼 곳까지 멀쩡하게 가는 경우가 거의 없다.\n\n말리면 오래갈 것이다. 운송하면 팔릴 것이고. 나는 하나를 먹은 뒤 장부를 향해 손을 뻗었다."
 gdp_trade_good_flavor.3032.a: "누가 이 과일을 기르는지, 또 얼마나 기르는지 알아낸다."
 gdp_trade_good_flavor.3032.b: "하나 더 먹자. 연구를 위해서다."
