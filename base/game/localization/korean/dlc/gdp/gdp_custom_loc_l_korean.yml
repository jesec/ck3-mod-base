l_korean:
 dinar: "디나르"
 dinar_plural: "디나르"
 dinar_gloss: "[Glossary('디나르', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('디나르', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "#bold 디나르#! 또는 #emp 데나르#!는 7세기에 우마이야 왕조가 비잔티움의 금화인 [Glossary('솔리두스', 'SOLIDUS_GLOSS')]에 상응하는 가치로 도입한 금화입니다. 하지만 그 이름은 은화인 [Glossary('데나리우스', 'DENARIUS_GLOSS')]에서 유래했습니다.\n\n디나르는 아랍 세계 전역으로 퍼져 나갔으며, 그 이름은 아직도 현대의 여러 화폐 단위에 사용됩니다."
 denarius: "데나리우스"
 denarius_plural: "데나리우스"
 denarius_gloss: "[Glossary('데나리우스', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('데나리우스', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "#bold 데나리우스#!는 원래 로마 공화국의 은화였으나, 제국 시기로 들어서며 그 가치가 크게 하락했습니다.\n\n그러나 이 단어는 로마의 영향이 미치던 지역에서 화폐를 가리키는 말이 되어 살아남았으며, 나중에 카롤링거의 은화 [Glossary('데나르', 'PENNY_GLOSS')]와 아랍의 금화 [Glossary('디나르', 'DINAR_GLOSS')]까지 영향을 미친 이름이 되었습니다."
 ducat: "두카트"
 ducat_plural: "두카트"
 ducat_gloss: "[Glossary('두카트', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('두카트', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "#bold 두카토#! 또는 #emp 도가도#!라고 불리는 이 화폐는 13세기에 베네치아에서 피렌체의 [Glossary('플로린', 'FLORIN_GLOSS')], 제노바의 #emp 제노비노#!에 상응하는 가치로 도입한 금화입니다. 비잔티움의 금화인 [Glossary('솔리두스', 'SOLIDUS_GLOSS')]의 가치 하락에 대응하고자 발행했으며, 베네치아의 #emp 도제#! 작위에서 그 이름을 따왔습니다.\n\n이 화폐는 상업 거래에서 빠르게 높은 가치를 인정받았습니다. 유럽 전역은 물론 그 너머까지 퍼져 나갔으며, 표준 규격 금화로서 모방되기도 했습니다."
 dirham: "디르함"
 dirham_plural: "디르함"
 dirham_gloss: "[Glossary('디르함', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('디르함', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "#bold 디르함#! 또는 #emp 드람#!은 7세기에 우마이야 왕조가 도입한 은화로, 아랍어권 세계 전역에서 채택되었습니다. 그 이름은 고전 시대와 헬레니즘 시대의 그리스 은화인 #emp 드라크마#!에서 유래했습니다.\n\n디르함은 무슬림 세계의 표준 무게 단위가 되어 널리 퍼져 나갔으며, 그 이름은 아직도 현대의 여러 화폐 단위에 사용됩니다."
 aureus: "아우레우스"
 aureus_plural: "아우레우스"
 aureus_gloss: "[Glossary('아우레우스', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('아우레우스', 'AUREUS_GLOSS')]"
 solidus: "솔리두스"
 solidus_plural: "솔리두스"
 solidus_gloss: "[Glossary('솔리두스', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('솔리두스', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "#bold 솔리두스#! 또는 #emp 노미스마#!(말 그대로 '동전'을 뜻합니다)는 4세기에 비잔티움에서 이전의 로마 금화인 [Glossary('아우레우스', 'AUREUS_GLOSS')]를 대체하고자 도입했던 금화입니다. 이 금화는 11세기에 [Glossary('히페르피론', 'HYPERPYRON_GLOSS')]으로 대체되었습니다.\n\n13세기에 솔리두스의 가치가 하락하자 이에 대응하기 위해 [Glossary('두카트', 'DUCAT_GLOSS')], [Glossary('플로린', 'FLORIN_GLOSS')], #emp 제노비노#! 같은 이탈리아 공화국들의 금화가 도입되었습니다.\n\n이 금화는 북유럽에서 #emp 실링#!으로 알려져 있었습니다. 그러다 8세기에 카롤루스 대제의 개혁에서 은화의 교환 가치가 실링이라는 이름으로 표준화되었습니다."
 hyperpyron: "히페르피론"
 hyperpyron_plural: "히페르피론"
 hyperpyron_gloss: "[Glossary('히페르피론', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('히페르피론', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "#bold 히페르피론#!은 '매우 정교한 동전'이라는 뜻으로, 유럽에서는 #emp 베잔트#!로 알려졌습니다. 비잔티움이 예전에 사용되던 [Glossary('솔리두스', 'SOLIDUS_GLOSS')] 금화를 대체하고자 11세기에 도입했던 금화입니다.\n\n#emp 솔리두스#!만큼 가치가 많이 하락하지는 않았으나, 히페르피론 역시 13세기에 그 가치가 감소하며 이탈리아 공화국들의 [Glossary('두카트', 'DUCAT_GLOSS')], [Glossary('플로린', 'FLORIN_GLOSS')], #emp 제노비노#!가 도입되는 계기를 마련했습니다."
 bezant: "베잔트"
 bezant_plural: "베잔트"
 bezant_gloss: "[Glossary('베잔트', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('베잔트', 'HYPERPYRON_GLOSS')]"
 florin: "플로린"
 florin_plural: "플로린"
 florin_gloss: "[Glossary('플로린', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('플로린', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "#bold 플로린#!은 13세기에 피렌체 공화국에서 비잔티움의 [Glossary('솔리두스', 'SOLIDUS_GLOSS')], [Glossary('히페르피론', 'HYPERPYRON_GLOSS')]의 가치 하락에 대응하고자 도입한 금화입니다. 이 금화의 뒤를 이어 제노바의 #emp 제노비노#!와 베네치아의 [Glossary('두카트', 'DUCAT_GLOSS')]가 탄생했습니다.\n\n플로린은 #emp 두카트#!와 마찬가지로 널리 통용되는 화폐가 되었으며, 유럽 전역의 여러 조폐소에서 수많은 복제본을 발행했습니다. 이 화폐의 이름은 헝가리의 #emp 포린트#!에 그 흔적을 남겼습니다."
 penny: "페니"
 penny_plural: "페니"
 penny_gloss: "[Glossary('페니', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('페니', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "#bold 페니히#! 또는 #emp 페니#!는 8세기에 카롤루스 대제가 도입한 표준 은화로, 예전에 널리 사용되던 로마 세계의 은화인 [Glossary('데나리우스', 'DENARIUS_GLOSS')]에 해당하는 가치를 지닙니다.\n\n이 화폐는 널리 퍼져 나가 유럽 전역의 표준 화폐로서 복제본이 발행되었으며, #emp 데나르#!, #emp 드니에#!, #emp 디네로#! 등의 이름은 수 세기 동안 같은 무게의 은화를 가리키는 말로서 함께 사용되었습니다."
 pfennig: "페니히"
 pfennig_plural: "페니히"
 pfennig_gloss: "[Glossary('페니히', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('페니히', 'PENNY_GLOSS')]"
 denier: "드니에"
 denier_plural: "드니에"
 denier_gloss: "[Glossary('드니에', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('드니에', 'PENNY_GLOSS')]"
 dinero: "디네로"
 dinero_plural: "디네로"
 dinero_gloss: "[Glossary('디네로', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('디네로', 'PENNY_GLOSS')]"
 denaro: "데나로"
 denaro_plural: "데나로"
 denaro_gloss: "[Glossary('데나로', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('데나로', 'PENNY_GLOSS')]"
 denar: "데나르"
 denar_plural: "데나르"
 denar_gloss: "[Glossary('데나르', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('데나르', 'PENNY_GLOSS')]"
 groschen: "그로셴"
 groschen_plural: "그로셴"
 groschen_gloss: "[Glossary('그로셴', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('그로셴', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "#bold 그로셴#! 또는 '두꺼운 페니'는 13세기에 티롤의 공작인 마인하르트 2세가 도입한 무거운 은화였습니다. 베네치아 화폐 #emp 그로소#!에 상응하는 가치를 지녔으며, 기존에는 12[Glossary('페니히', 'PENNY_GLOSS')]와 동일했습니다.\n\n이 표준 화폐는 머지않아 유럽 전역으로 퍼져 나가 사용되었습니다. 특히 보헤미아의 쿠트나호라 조폐소, 마이센의 프라이부르크 조폐소가 이 화폐의 유명한 발행지였습니다."
 tongbao: "통보"
 tongbao_plural: "통보"
 tongbao_gloss: "[Glossary('통보', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('통보', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold 통보#!는 '널리 통하는 보물'이라는 뜻으로, 7세기 당나라에서 처음 발행되었으며 청동 합금으로 주조된 [Glossary('전', 'QIAN_GLOSS')] 형식의 동전에 붙었던 이름입니다.\n\n이 화폐는 중국 문화권 전역에서 통용되는 표준 교환 단위가 되었으며, 오늘날에는 중의학에서 사용되거나 행운을 가져다주는 징표로 쓰입니다."
 qian: "전"
 qian_plural: "전"
 qian_gloss: "[Glossary('전', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('전', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold 전#!은 '돈'을 뜻하며, 중국 전국시대부터 교환 단위로 널리 사용되었던 구리 합금으로 주조된 동전을 이르는 총칭입니다.\n\n이 화폐에는 사각형의 구멍이 있어, 주조된 화폐를 한꺼번에 막대에 꿴 뒤 가장자리를 매끄럽게 다듬을 수 있었습니다. 또한 더 큰 단위가 되도록 묶어 교환할 수도 있었는데, 보통은 1000개 단위로 묶었습니다. 전을 바탕으로 한국, 일본, 베트남을 비롯한 여러 나라에서 비슷한 주조 화폐가 탄생하게 되었습니다."
 mon_coin: "문"
 mon_coin_plural: "문"
 mon_coin_gloss: "[Glossary('문', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('문', 'QIAN_GLOSS')]"
 tanka: "탄카"
 tanka_plural: "탄카"
 tanka_gloss: "[Glossary('탄카', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('탄카', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "#bold 탄카#! 또는 #emp 타카#!는 13세기에 델리 술탄국에서 도입했던 은화입니다.\n\n탄카는 인도 전역으로 퍼져 나갔고, 이웃 지역에서도 많이 복제되었으며 비단길의 표준 교환 단위가 되었습니다."
 jital: "지탈"
 jital_plural: "지탈"
 jital_gloss: "[Glossary('지탈', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('지탈', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "#bold 지탈#!은 원래 황소와 기수가 그려진 은화였으며, 8세기에 카불에 도입되었습니다.\n\n이 모양의 화폐는 지역적으로 퍼져 나가며 많은 복제본이 발행되었고, 결국에는 가치가 하락하며 구리가 점점 더 많이 포함되었습니다. 그러다 16세기에는 #emp 지탈#!이 완전히 구리로 만들어지게 되었습니다."
 coin: "동전"
 coin_plural: "동전"
 coin_gloss: "동전"
 coin_gloss_plural: "동전"
 bazaar: "바자르"
 bazaar_plural: "바자르"
 bazaar_gloss: "[Glossary('바자르', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('바자르', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold 바자르#! 또는 #emp 바자#!는 인도유럽조어에서 온 단어로, 페르시아에서 시장 구역을 뜻하는 이름이었습니다. 나중에는 아랍권으로 퍼져 나갔으며, 이제는 서아시아와 인도를 비롯한 여러 지역에서 널리 쓰이고 있습니다."
 khrom: "크롬"
 khrom_plural: "크롬"
 khrom_gloss: "[Glossary('크롬', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('크롬', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold 크롬#!은 티베트에서 시장을 이르는 단어로, 비단길을 따라 지역적으로 퍼져 나갔습니다."
 shuka: "슈카"
 shuka_plural: "슈카"
 shuka_gloss: "[Glossary('슈카', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('슈카', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold 슈카#!는 코카서스 언어로 시장을 뜻합니다. 아랍어의 [Glossary('수크', 'SUQ_GLOSS')]처럼 원래는 아카드어로 '거리'를 뜻하는 단어에서 유래했지만, 시리아어를 거쳐 전해진 이름입니다."
 suq: "수크"
 suq_plural: "수크"
 suq_gloss: "[Glossary('수크', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('수크', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold 수크(Suq)#! 또는 #emp 수크(souk)#!는 아랍어로 시장을 뜻합니다. 원래는 아카드어로 '거리'를 뜻하는 단어에서 유래했으며, 아람어를 거쳐 전해진 이름입니다. 이제는 무슬림 세계뿐 아니라 그 너머에서도 흔히 사용됩니다."
 market_custom: "시장"
 market_custom_plural: "시장"
 market_custom_gloss: "시장"
 market_custom_gloss_plural: "시장"
 burgher: "성민"
 burgher_plural: "성민"
 patrician: "성민"
 patrician_plural: "성민"
 freeman: "자유민"
 freeman_plural: "자유민"
 artifact_curious: "특이한"
 artifact_fascinating: "매혹적인"
 artifact_impressive: "인상적인"
 artifact_magnificent: "장엄한"
 artifact_parrot: "앵무새"
 artifact_cockatoo: "코카투"
 artifact_monkey: "원숭이"
 tributary_merchant_contract: "[client_contract|E]"
 tributary_contract: "[tributary_contract|E]"
 vassal_contract: "[vassal_contract|E]"
