l_korean:
 gdp_visit_holding_decision_event.1200.t: "후원자 방문"
 gdp_visit_holding_decision_event.1200.intro_desc: "[ROOT.Char.GetCurrentLocation.GetName] [ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l]에 들어서자마자 눈부신 화려함에 압도되었다. 어디를 둘러봐도 값을 매길 수 없는 유물과 장식품이 가득하다. [patron.Custom('RegionalFabric')] 태피스트리와 조각상, 장인의 솜씨가 돋보이는 가구들이 눈에 들어오고, [patron.Custom('GetExpensiveMeal')]의 진한 향기가 공기를 가득 채운다.\n\n분주히 오가는 하인들 사이에서 길을 잃었는데,"
 gdp_visit_holding_decision_event.1200.all_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 가까이 서 있는 가운데 [steward.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 내 도착을 알리는 모습을 보았다. 몸가짐을 바로잡고 제안을 해야겠다."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "가까이 오라고 손짓하는 [patron.Custom2('MyCharacterIntroduction', ROOT.Char)](을)를 보았다. 내가 [patron.GetHerHis] 최우선 손님인 모양이다. 몸가짐을 바로잡고 제안을 해야겠다."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "가까이 오라고 손짓하는 [steward.Custom2('MyCharacterIntroduction', ROOT.Char)](을)를 보았다. [patron.Custom2('MyCharacterIntroduction', ROOT.Char)]의 모습은 어디에도 보이지 않는다. [patron.GetSheHe]는 나를 만날 만큼 한가하지 않은 모양이다. 몸가짐을 바로잡고 제안을 해야겠다."
 gdp_visit_holding_decision_event.1200.representative_desc: "나를 맞이하려 기다리는 [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)](을)를 발견했다. 몸이 불편하다는 [patron.GetTitledFirstNameNoTooltip](을)를 대신해 나온 모양이다. 몸가짐을 바로잡고 제안을 해야겠다."
 gdp_visit_holding_decision_event.1200.none_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)] 또는 내 사정을 들어줄 다른 사람을 찾아보지만 허사였다. 미리 약속을 잡아야 했던 모양이다."
 gdp_visit_holding_decision_event.1200.a: "[ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] 시장에 대한 지배력을 강화하고 싶다."
 gdp_visit_holding_decision_event.1200.a.tt: "당신의 제안이 다음 기회 제공 가능:$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "투자 기회를 모색하겠다."
 gdp_visit_holding_decision_event.1200.b.tt: "투자처를 모색하면 다음 기회 획득 가능:$gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.c: "다시 생각해 봤는데..."
 gdp_visit_holding_decision_event.1200.c.tt: "[THIS.Char.GetCurrentLocation.GetName]에 어떤 것들이 더 있는지 살펴보기 위해 돌아감"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "내가 내민 인맥 목록이 [negotiator.GetTitledFirstNameNoTooltip]에게 깊은 인상을 남김"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "내가 언급한 이름들은 별다른 비중이 없음"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "내 말이 상대의 심기를 거스름"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "나의 운영 능력이 [negotiator.GetTitledFirstNameNoTooltip](을)를 설득함"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "내가 주장을 횡설수설 얼버무림"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "내 장부에서 횡령의 흔적이 발견됨"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "[negotiator.GetTitledFirstNameNoTooltip](을)를 설득하는 데 성공함"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "[negotiator.GetTitledFirstNameNoTooltip](이)가 흔들리지 않음"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip](이)가 내 거짓말에 불쾌감을 느낀다."
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.GetTitledFirstNameNoTooltip](이)가 내 지식에 깊은 인상을 받음"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "경제 이론에 대한 장황한 설명에 [negotiator.GetTitledFirstNameNoTooltip](이)가 지루함을 느낌"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "어쩌다 보니 [negotiator.GetTitledFirstNameNoTooltip]에게 모욕감을 안김"
 gdp_visit_holding_decision_event.1200.a_martial.success: "군수 병참에 대한 내 지식이 [negotiator.GetTitledFirstNameNoTooltip]에게 깊은 인상을 남김"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "결국 나는 아는 척하는 사람이 되고 말았음"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "내 예시는 협박처럼 들림"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.GetTitledFirstNameNoTooltip](이)가 내 무용에 크게 감탄함"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.GetTitledFirstNameNoTooltip](이)가 하품만 함"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.GetTitledFirstNameNoTooltip](이)가 내 무력 과시를 위협으로 오해함"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "최근 [patron.GetShortUIName]에게 무역 특혜를 요청했습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "최근 [patron.GetShortUIName](을)를 통해 금화와 위신을 교환했습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: 경쟁 시장"
 gdp_visit_holding_decision_event.1201.all_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 가까이 오라고 친절하게 손짓한다. 다가가기 전, 나는 제안을 마지막으로 서둘러 점검한다. 이 거래를 성사하는 것은 [ROOT.Char.GetHouse.GetName] 상인 회사에 무엇보다 중요한 일이다.\n\n 가까이 다가갈수록 [patron.GetFirstName]에게서 우월감을 풍기는 분위기가 느껴진다.\n\n \"제안을 명확히 말해 보아라. 그러면 자비를 베풀어 검토해 볼지도 모르니...\""
 gdp_visit_holding_decision_event.1201.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 가까이 오라고 위압적으로 손짓한다. 다가가기 전, 나는 제안을 마지막으로 서둘러 점검한다. 이 거래를 성사하는 것은 [ROOT.Char.GetHouse.GetName] 상인 회사에 무엇보다 중요한 일이다.\n\n 가까이 다가갈수록 [patron.GetFirstName]에게서 우월감을 풍기는 분위기가 느껴진다.\n\n \"제안을 명확히 말해 보아라. 그러면 자비를 베풀어 검토해 볼지도 모르니...\""
 gdp_visit_holding_decision_event.1201.steward_available_desc: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 가까이 오라고 친절하게 손짓한다. 다가가기 전, 나는 제안을 마지막으로 서둘러 점검한다. 이 거래를 성사하는 것은 [ROOT.Char.GetHouse.GetName] 상인 회사에 무엇보다 중요한 일이다.\n\n\"제안을 명확히 말해 보아라. 그러면 [patron.GetTitledFirstNamePossessive] 이익에 최선인지 검토해 볼 테니...\""
 gdp_visit_holding_decision_event.1201.representative_desc: "[negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 가까이 오라고 침착하게 손짓한다. 다가가기 전, 나는 제안을 마지막으로 서둘러 점검한다. 이 거래를 성사하는 것은 [ROOT.Char.GetHouse.GetName] 상인 회사에 무엇보다 중요한 일이다.\n\n\"제안을 명확히 말해 보아라. 그러면 [patron.GetTitledFirstNamePossessive] 이익에 최선인지 검토해 볼 테니...\""
 gdp_visit_holding_decision_event.1201.a: "\"계약 제안을 하나씩 살펴보시죠...\""
 gdp_visit_holding_decision_event.1201.b: "\"한 입으로 두말하지는 않겠지요?\""
 gdp_visit_holding_decision_event.1201.c: "아무것도 아닙니다."
 gdp_visit_holding_decision_event.1201.c.tt: "알현 자리로 돌아가 또 무엇을 제안할 수 있을지 살펴봄"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: 투자 제안"
 gdp_visit_holding_decision_event.1202.all_available_desc: "[patron.GetFirstName](이)가 제안서를 읽는 동안 나는 묵묵히 기다린다. 서류에서 눈을 떼는 그 미간에는 희미한 주름이 잡혀 있다.\n\n\"흠... 그렇군... 이 정도 금액이라면 자네와 [ROOT.Char.GetHouse.GetName] 회사를 후원하는 것도 고려해 볼 수 있겠어. 이 정도면 체면은 세울 수 있겠지, [ROOT.Char.GetFirstNameNoTooltip]?\""
 gdp_visit_holding_decision_event.1202.patron_available_desc: "내가 제안을 설명하는 동안 [patron.Custom2('MyCharacterIntroduction', ROOT.Char)](은)는 [patron.GetHerHis] [negotiator.Custom('ComplimentAdjective')] 표정을 흥미롭게 바라본다.\n\n\"이 정도면 자네도 제법 체면이 서겠지, [ROOT.Char.GetFirstNameNoTooltip]\""
 gdp_visit_holding_decision_event.1202.steward_available_desc: "[steward.GetFirstName](이)가 제안서를 읽는 동안 나는 차분히 기다린다. 내용에 흥미를 느낀 듯한 [steward.GetSheHe]는 다시 나를 바라본다.\n\n\"제안서는 잘 작성했군요. 그 점은 인정하지요... [patron.GetTitledFirstName]께 당신과 [ROOT.Char.GetHouse.GetName] 회사를 추천하는 것도 고려해 보겠습니다.\""
 gdp_visit_holding_decision_event.1202.representative_desc: "[patron.GetTitledFirstNameNoTooltip](을)를 대신해 [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 제안서를 읽는 동안 나는 차분히 기다린다. 내용에 흥미를 느낀 듯한 [negotiator.GetSheHe]는 다시 나를 바라본다.\n\n\"잘 작성된 제안서로군요. [patron.GetTitledFirstNameNoTooltip]께 반드시 전달하겠습니다.\""
 gdp_visit_holding_decision_event.1202.a: "\"협상을 해볼 수 있겠군...\""
 gdp_visit_holding_decision_event.1202.b: "\"제안을 받아들이겠다.\""
 gdp_visit_holding_decision_event.1202.b.success: "거래 성사!"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName](이)가 한동안 당신을 보려 하지 않습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )] 후 다시 시도하십시오"
 gdp_caught_stealing.tt: "최근 성지에서 도둑질을 하다가 걸렸습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]까지 출입이 금지되었습니다"
 gdp_visit_holding_decision_event.1000.b.tt: "[merchant_patron|E]에게 도움을 청하면 다음 기회 획득 가능:$gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "당신의 [merchant_patron|E] 또는 [patron.GetHerHis] 대리인이 참석해야 함"
 gdp_visit_holding_decision_event.1500.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U] 방문"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 부지로 돌아왔더니 모든 것이 여전했다. 태양이 천천히 하늘을 가로지르며 광장의 건물들 그림자를 탁 트인 광장에 드리웠다."
 gdp_visit_holding_decision_event.1500.desc_returned_02: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 부지에는 햇빛이 잘 들지 않았다. 그곳을 걷다 보니 강렬한 향냄새가 끊임없이 코를 자극했다."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "나는 치유사의 오두막에서 다시 올라오며 눈을 찡그렸다. 그리고 곧바로 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 부지를 향해 발걸음을 옮겼다."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 정문을 지나가는데, 어쩐지 목가적인 분위기의 평화가 나를 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 광장으로 이끌었다."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "평화로운 정원에서 돌아오는 길에, 훨씬 가벼워진 기분을 느끼며 북적이는 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 광장을 바라봤다."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "[merchant_physician_recruit.GetFirstNamePossessiveNoTooltip] 연구실에서 좁아지는 골목길을 따라 걷다 보니 어느새 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 부지에 돌아와 있었다."
 gdp_visit_holding_decision_event.1500.desc: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 광장에는 많은 상인과 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural], 조수들이 있음에도 왠지 모를 평화가 분명히 느껴졌다.\n\n중앙에는 웅장한 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship](이)가 자리 잡고 있으며, 양쪽에는 치유의 효능을 과감하게 주장하는 표지판, 그리고 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]에 대해 조용히 숙고할 수 있는 별관 정원이 보인다."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\n광장 가장자리에서 한 신도가 더 나은 육체적 건강에 대한 설교를 이어간다. 그리고 미리 약속한 대로, 내 아픈 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName](이)가 호위를 받으며 도착해 치유사의 오두막에서 나를 기다리고 있었다."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\n광장 가장자리에서 한 신도가 육체적 건강이 영적 건강에 도움이 된다며 설교하고 있다. 농노들의 조롱이 간혹 날아오지만, [merchant_physician_recruit.GetSheHe|U]는 흔들리지 않고 단호하게 서 있다."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\n야영지의 수행원과 미리 약속한 대로, 내 아픈 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName](이)가 호위를 받으며 도착해 치유사의 오두막에서 나를 기다리고 있었다."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName](은)는 고개를 끄덕이며 한창 분주한 광장을 둘러봤다. 그리고 예전부터 궁금했던 상점과 명소들을 유심히 살펴봤다."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\n나는 광장을 바라보며 만족스러운 기분에 빠졌다. 그리고 숨을 깊게 들이켜며 다음 목적지를 고민했다.\""
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName](이)가 다소 지친 모습으로 말을 걸었다. \"불평하려는 건 아닌데... [visiting_partner.Custom2('RelationToMe', ROOT.Char)], 볼일은 다 보신 거죠?\""
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\n[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 광장에서 상당한 시간을 보낸 후, 나는 오늘 치른 거래에 만족하며 중앙 광장으로 이어지는 가장 빠른 길을 살폈다."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n신실한 선교자가 건강과 영성에 관한 가르침을 계속 설파했다. 그러나 그 강의도 이젠 슬슬 마무리인 듯하다."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\n왠지 모르게 광장에 아이들이 늘어난 듯했다. 원래부터 여기 있었던 걸까? 아이들은 자기들끼리 놀고 몸싸움을 해 대며, 똑같은 놀이를 지치지도 않고 새롭게 계속해 나간다. 덕분에 아이를 돌보는 이들이 놀라고 당혹해하기 일쑤였다.\n\n다음 목적지를 생각하며 광장을 둘러보는 중에도 머릿속에서는 계속해서 [1500_sickly_minor.GetFirstNamePossessive] 건강 상태가 신경 쓰였다."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\n[visiting_partner.GetFirstName](은)는 내 왼쪽에 서서 어떤 상점을 살펴보고 있었다. 상점에 가득히 있는 작디작은 병들 때문에 호기심이 생긴 모양이었다. 그런데 그 병에 담긴 액체는 모조리 [ROOT.Char.Custom('VenomousCreature')] 독이라고 한다.\n\n생각만으로도 피부에 벌레가 기어다니는 기분이다. 어디로 갈지 빨리 정해야겠다."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName](이)가 내 어깨를 툭 치며 무리를 지은 어떤 사람들을 가리켰다. 세상의 종말을 외치는 어떤 초라한 사람을 경비병들이 둘러싸고 있었다.\n\n나는 본능적으로 눈썹을 치켜올리면서도 이제 어디로 갈지 고민에 빠졌다."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n광장을 가로질러 지나가는데, [visiting_partner.GetFirstName](이)가 작은 조각 하나를 건넸다.\n\n나는 그 말린 식량을 씹으면서 어디로 갈지 고민에 빠졌다."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\n광장의 그늘진 구석에서, 한 사기꾼이 귀족을 설득하려고 빨간 모래의 치유력에 관해 끈질기게 말하고 있다.\n\n나는 둘의 다툼을 태평하게 관찰하며 어디로 갈지 고민에 빠졌다."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\n근처에 흑요석 거울을 파는 노점상이 있었다. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter](은)는 마침내 애써 흥분을 감추면서도 자기 모습을 살펴볼 기회를 놓치지 않았다.\n\n나는 그 모습에 유쾌한 기분을 느끼며 어디로 갈지 고민에 빠졌다."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\n작은 원형 홀 옆에서, [ROOT.Char.Custom('RandomReligiousTextName')] 필사본을 지닌 어떤 사기꾼이 초라한 차림의 사람들을 앞에 두고 무언가 낭독하고 있었다.\n\n나는 그런 모습을 비롯해 광장을 관찰하면서 어디로 갈지 고민에 빠졌다."
 gdp_visit_holding_decision_event.1500.a: "치유사들의 축복을 받아 보자."
 gdp_visit_holding_decision_event.1500.a_second: "치유사들에게 다시 가 보자."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "치유사라면 [1500_sickly_minor.GetFirstNameNoTooltip](을)를 도울 수 있을지도 모른다."
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip](이)가 아직도 나를 기다리고 있다."
 gdp_visit_holding_decision_event.1500.a.tt: "치유사 방문이 다음 기회 제공 가능: $gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "최근 치유사를 방문했습니다 - [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1500.b: "이 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship](은)는 흥미롭군."
 gdp_visit_holding_decision_event.1500.b_second: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship](은)는 다시 들러볼 만하군."
 gdp_visit_holding_decision_event.1500.b.tt: "지역 예배당 입장이 다음 기회 제공 가능:$gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "최근 현지 예배당을 방문했습니다 - [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1500.c: "정원이 흥미로워 보이는군."
 gdp_visit_holding_decision_event.1500.c_second: "정원을 다시 둘러보자."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ 신앙 성찰 및 [stress|E] 감소"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ 저장품 채집"
 gdp_visit_holding_decision_event.1500.c.tt: "정원 방문이 다음 기회 제공 가능: $gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "최근 정원을 방문했습니다 - [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1500.d: "저기 있는 사람이 설교자인가?"
 gdp_visit_holding_decision_event.1500.d_second: "[merchant_physician_recruit.GetFirstNameNoTooltip]에게 아직 볼일이 남아 있다."
 gdp_visit_holding_decision_event.1500.d.tt: "의사와의 대화가 다음 기회 제공 가능:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "다른 볼일을 보겠다."
 gdp_visit_holding_decision_event.1501.intro: "조명이 옅은 치유사의 오두막에서는 특유의 #EMP 냄새#!가 진동했다. #EMP 불쾌한#! 느낌은 아니었지만, 점차 몸에 스며드는 기분이었다.\n\n[merchant_healer_character.GetFirstName](은)는 높은 탁자 앞에 서서 약을 준비하느라 바빴다."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: 치유사"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ 우리가 들어서자 한 [merchant_healer_character.GetWomanMan]이 환한 미소로 우리를 맞이했다.\n\n\"누추한 곳에 오신 것을 환영합니다! 저는 [merchant_healer_character.GetFirstNameNoTooltip]입니다. 무엇을 도와드릴까요?\""
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "병을 앓고 있는 내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName](이)가 나와 함께 치유사의 오두막으로 들어왔다. [1500_sickly_minor.GetSheHe|U]는 침울하게 기침을 하면서, 내 부축을 받아 계단을 내려갔다.\n\n치유사 [merchant_healer_character.GetFirstName](은)는 나무 의자에서 일어나 음울한 표정으로 우리를 바라봤다. \"치료가 필요해서 오신 건가요?\""
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "치유사의 오두막으로 들어가는데, [merchant_healer_character.GetFirstName](은)는 한 노인에게 정화 절차를 수행하는 중이었다. [visiting_partner.GetFirstName](은)는 [merchant_healer_character.GetFirstNameNoTooltip](을)를 열심히 관찰하며 흥분한 눈빛으로 말했다. \"저도 #EMP 저걸#! 직접 해 보고 싶어요...\"\n\n[merchant_healer_character.GetFirstNameNoTooltip](은)는 그 목소리를 듣더니 고개를 돌려 말했다. \"오신 줄 몰랐네요! 아픈 곳이 있어서 오셨나요?\""
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ [merchant_healer_character.GetSheHe|U]는 고개를 들고 눈썹을 살짝 올리며 말했다. \"무사히 돌아오셨군요! 이번에는 어떻게 도와드릴까요?\""
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName](은)는 치료사의 오두막 구석에서 내가 돌아오길 기다리고 있었다. 그런데 난로 옆 부드러운 침구에 누워 조금도 움직이지 않는 모습이었다. 나는 본능적으로 다가가 [1500_sickly_minor.GetHerHis] 숨소리를 확인하고 머리를 쓰다듬었다.\n\n[merchant_healer_character.GetFirstName](은)는 [ROOT.Char.Custom('WritingInstrument')](을)를 내려놓더니 음울한 표정으로 말했다. \"무슨 일인가요?\""
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "치료사의 오두막에 들어서자마자 약초를 고르는 [merchant_healer_character.GetFirstName](이)가 보였다. 계단을 따라 계단을 내려가자 [merchant_healer_character.GetSheHe]가 우리를 올려다보며 말했다. \"아, 생각이 바뀐 겁니까?\"\n\n내 왼쪽에 있던 [visiting_partner.GetFirstNameNoTooltip](은)는 [merchant_healer_character.GetFirstNameNoTooltip](이)가 아까 보여준 시술을 직접 해 보고 싶어서 발을 동동 굴렀다."
 gdp_visit_holding_decision_event.1501.desc_returned_01: "계단을 따라 내려가서 치료사의 오두막으로 들어가는데, [merchant_healer_character.GetFirstName](은)는 다른 환자를 돌보고 있었다. [merchant_healer_character.GetSheHe|U]는 나를 흘깃 보더니 환자에게 방 안쪽의 침구에 앉도록 손짓으로 안내했다.\n\n[merchant_healer_character.GetSheHe|U]는 낡은 시트로 만든 임시 커튼을 닫아서 환자들의 눈이 닿지 않도록 가렸다.\n\n\"돌아오셨군요.\" [merchant_healer_character.GetSheHe]는 명료하게 말했다. \"제 도움이 필요한가요?\""
 gdp_visit_holding_decision_event.1501.desc_returned_02: "치료사의 오두막의 어둑한 실내로 다시 내려갔다. [merchant_healer_character.GetFirstName](은)는 조금 더 안쪽에 앉아서 낡은 기록을 읽고 있었다. 멀리서는 구분하기 어렵지만, 사람의 형태에 관한 묘사를 담은 글인 듯하다.\n\n[merchant_healer_character.GetSheHe|U]는 조심스럽게 일지를 덮어서 치우더니 나를 바라보며 차분한 목소리로 말했다. \"아, 돌아오셨군요. 아픈 곳이 생긴 건가요?\""
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\n여러 의료용품이 눈에 들어왔다. 그러나 그중에서도 더없이 아름다운 뿔 하나가 눈에 들어왔다."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\n방 저편 구석에는 언뜻 봐도 수준이 높은 [1500_health_artifact.GetName](이)가 다른 의료용품과 함께 고이 놓여있었다."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\n방 저편 구석에는 각종 의료용품이 선반을 가득 채우고 있었다. 특히 [1500_health_artifact.GetName](이)가 요란한 자태를 뽐내며 내 관심을 끌었다."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\n방 저편 구석에는 [1500_health_artifact.GetName](이)가 여전히 그 요란한 자태를 뽐내며 내 관심을 끌었다."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "\"[1500_health_artifact.GetNameNoTooltip]에 흥미가 있는데.\""
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "\"내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstNameNoTooltip]에게 치료가 필요해서 왔다!\""
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "치료 실패"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "처치법이 실패함"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "치료 성공"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|U]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]에 돌아왔을 땐 설교가 막 끝난 시점이었다. [merchant_clergy_character.GetFirstName](은)는 빗자루를 들고 조용히 청소했다. 기도와 성찰을 위해 여길 찾는 방문객들을 위해 성지를 깔끔하게 정돈하는 중이었다.\n\n내가 다가가자 [merchant_clergy_character.GetSheHe|U]는 고개를 들고 부드럽게 미소를 지었다. \"그분의 따스한 품으로 잘 돌아오셨습니다. 잠시 머무르며 풍경을 즐기는 건 어떠실까요?\""
 gdp_visit_holding_decision_event.1503.desc_returned_02: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]에 돌아왔을 때, [merchant_clergy_character.GetFirstName](은)는 강단 앞 벤치에 앉아서 명상에 잠겨 있었다.\n\n[merchant_clergy_character.GetSheHe|U]는 고개를 돌려 내가 다가오는 모습을 보며 말했다. \"바쁘게 돌아다니셨군요. 발이 지쳤을 텐데 잠깐 쉬었다 가시죠. 뭘 도와드릴까요?\""
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "아름답게 장식된 문을 지나 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship](으)로 들어가는데, [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]들이 일과를 마친 후 삼삼오오 흩어지고 있었다.\n\n잘 정돈된 길을 구경하고 있자니 [merchant_clergy_character.GetFirstName](이)가 뜻밖에도 나를 알아보고는 알 수 없는 표정으로 다가왔다. \"그분의 방황하는 자녀가 오셨군요. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]께서 당신을 문 앞까지 안전하게 인도하신 모양입니다!\""
 gdp_visit_holding_decision_event.1503.desc: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 관문을 지나가는데, 이 정교한 구조와 신성한 장식에 얼마나 많은 노력이 들어갔을지 짐작이 가서 경악했다.\n\n여길 담당하는 [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]들 중 하나가 나를 알아보고는 침착하게 다가왔다. \"반갑습니다, 그분의 자녀님. 저는 [merchant_clergy_character.GetFirstName]입니다. 무엇을 도와드릴까요?\""
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "#EMP 어디#! 보자..."
 gdp_visit_holding_decision_event.1503.b: "\"[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]께서 우리의 회사를 축복해 주실지도?\""
 gdp_visit_holding_decision_event.1503.c: "이 기부금이 필요한 사람은 바로 #EMP 나다#!!"
 gdp_visit_holding_decision_event.1503.c_guarded: "기부를 한 번 더 해야겠어. #EMP 내#! 주머니에."
 gdp_visit_holding_decision_event.1503.c_master_thief: "\"[visiting_partner.GetFirstNameNoTooltip], 경계 똑바로 해!\""
 gdp_visit_holding_decision_event.1503.c.flavor: "주의를 돌리고 동전 몇 개를 챙기자. 아주 쉬운 일이지."
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "흠. 경비들이 왠지 모르게 주변을 더 자주 돌아다니는 것 같은데..."
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "절도 성공"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "기부금 절도에 성공함"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "추방당함!"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "당신은 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]에서 추방됨"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "경비병 등장"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "기부금을 건네자 [merchant_clergy_character.GetFirstNamePossessive] 눈에 놀라움이 차오릅니다. \"당신... 그분의... 그분의 모습을 꼭 닮았군요... 그분께 맹세코...\" [merchant_clergy_character.GetSheHe]는 잠시 나를 바라보며 입을 뻐끔거립니다. 마치 물 밖으로 나온 물고기 같은 모양새입니다.\n\n[merchant_clergy_character.GetFirstNameNoTooltip](은)는 자기가 무슨 짓을 하고 있는지 겨우 깨닫더니 마음을 추스르고 목을 가다듬은 후 말합니다. \"당신의 여정에 #EMP 제#! 인생을 바칠 수 있다면 영광이겠습니다.\""
 gdp_visit_holding_decision_event.1504.desc: "내 어깨에 손을 얹더니, [merchant_clergy_character.GetFirstNamePossessive] 미소가 점차 환해졌다. \"실로 고귀하시군요. 모험가인 당신께서 돈을 기부한다는 게 쉬운 결정은 절대로 아니었을 것 잘 압니다.\"\n\n[merchant_clergy_character.GetSheHe|U]는 진중하게 고개를 끄덕이며 자기 옆구리에 손을 얹고 나를 가만히 바라봤다."
 gdp_visit_holding_decision_event.1504.a: "\"[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]께서 우리 사업을 축복해 주실지도?\""
 gdp_visit_holding_decision_event.1504.a_epiphany: "\"[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodNamePossessive] 은총에 흥미가 있을 뿐이야.\""
 gdp_visit_holding_decision_event.1504.b: "\"능력 있는 사람이 더 #EMP 필요한#! 상황이야.\""
 gdp_visit_holding_decision_event.1504.c: "\"동료가 되지 않겠다면 아무런 관심도 없어.\""
 gdp_visit_holding_decision_event.1504.c_epiphany: "... 지금은 사람을 구하고 있지 않아."
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: 정원"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "정원은 여전히 고요하다. 일부 방문객들은 의자에 앉아 조용히 대화를 나누고 있다. 나머지는 자연을 바라보며 묵묵히 감탄하기에 바쁘다.\n\n나는 나지막한 속삭임과 바람 소리에 집중했다. 나무 사이를 지나는 바람에 마음이 더 편안해졌다."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "이번에는 [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]의 어떤 나무 위에서 작은 새를 발견했다. 처음으로 날갯짓하려는 모습이었다.\n\n새는 둥지 가장자리에서 매끄럽게 치솟았다. 그러나 날개가 엉키며 갑자기 땅으로 곤두박질치기 시작했다... 다행히 바람이 새를 부드럽게 받쳤는지 무사히 비행에 성공했다. 안도감이 따뜻하게 마음을 채웠다."
 gdp_visit_holding_decision_event.1505.desc: "생울타리가 정원을 둘러싸고 있었다. 완만한 언덕에는 나무가 곳곳에 솟았다. 이따금 나뭇잎 사이로 새나 다람쥐가 눈에 보였다.\n\n이 모든 아름다움은 내게 강렬한 존재감으로 다가왔다. 온갖 시련과 고난을 겪는 동안, 어쩌면 [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]께서 계속 곁에 계셨던 것은 아닐까?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\n길을 따라 조금 더 올라가자, [visiting_partner.GetFirstName](이)가 주변의 식용 식물들을 더 살펴보고 있었다."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\n길을 따라 조금 더 올라가자, 더 많은 야생 먹거리가 오후 햇살을 받아서 고스란히 드러났다."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\n산책하는 내내 [visiting_partner.GetFirstName](이)가 식용 식물을 찾아낼 때마다 뒤에서 뭐라고 중얼거리는 소리가 들렸다."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\n시야 한쪽 구석에서는 맛있어 보이는 야생 과일과 약초들이 정원의 풍요로움에 힘을 보태고 있었다."
 gdp_visit_holding_decision_event.1505.a: "이렇게 평화로울 수가."
 gdp_visit_holding_decision_event.1505.a_convert: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip](이)가 그리 나쁜 것은 아닐지도."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "최근 이 정원에서 명상한 적이 있습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1505.b: "이 먹거리를 낭비하는 건 부끄러운 일이다."
 gdp_visit_holding_decision_event.1505.b_partner: "\"[visiting_partner.GetFirstNameNoTooltip], 이참에 배나 채울까?\""
 gdp_visit_holding_decision_event.1505.b_flavor: "수확의 시간이다!"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "최근 이 정원에서 수확했습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1505.c: "\"...#EMP [visiting_partner.GetFirstNameNoTooltip]#!, 숨겨진 구멍과 틈새가 너무 많아...\""
 gdp_visit_holding_decision_event.1505.c.flavor: "정말 신성하군."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "최근 이 정원에서 휴식을 취했습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$: 의사"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "[merchant_physician_recruit.GetFirstNamePossessive] 연구실 문이 살짝 열려 있다. 틈새로 [merchant_physician_recruit.GetFirstNameNoTooltip](이)가 손님의 머리카락을 잘라내고 있었다. 손님은 한마디 말도 없이 앉아 있었고, 가위는 무서울 정도로 날카롭고 얇은 모양새였다.\n\n문을 두드리고 들어가서 의사의 시선을 끌었다. \"오는 줄도 몰랐군요. 무슨 용건이죠?\""
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName](은)는 문밖에 서서 고통에 시달리는 듯한 한 [ROOT.Char.GetWomanMan]의 어깨를 살피고 있었다.\n\n[merchant_physician_recruit.GetSheHe|U]는 진단을 마치고 관절을 치료하는 방법을 알려준 후 나를 돌아봤다. \"또 왔군요. 이번에는 무슨 일인가요?\""
 gdp_visit_holding_decision_event.1507.desc_returned_03: "나는 조심스럽게 계단 위로 올라갔다. [merchant_physician_recruit.GetFirstNamePossessive] 연구실 앞에서 열린 문 안쪽을 살며시 들여다봤다.\n\n[merchant_physician_recruit.GetSheHe|U]는 몸을 크게 움직이며 운동에 열중하고 있었다. 스쿼트를 반복하며 땀을 뻘뻘 흘리는 중이었다.\n\n반복 운동을 마친 후, [merchant_physician_recruit.GetSheHe]는 이마의 땀을 닦으며 병을 집어 물을 마셨다. 그러다가 [merchant_physician_recruit.GetHerHis] 눈빛이 내게 날카롭게 꽂혔다. \"꽤 끈질긴 분이시네요?\""
 gdp_visit_holding_decision_event.1507_desc_intro: "[merchant_physician_recruit.GetFirstName](을)를 따라 점점 좁아지는 골목을 지났다. 계단을 올라 들어온 [merchant_physician_recruit.GetHerHis] 연구실에는 선반이 가득했다. 체액, 건강, 영성에 관한 기록과 인쇄물이 바닥부터 천장까지 쌓여 있었다.\n\n[merchant_physician_recruit.GetSheHe|U]는 딱 하나 있는 의자에 앉아서 무언가 고민하며 작은 부적을 쓰는 데 몰두했다. 그러다가 다시금 내 존재를 알아차렸다. "
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$\"아, 우리 어디서 본 적 있지 않나요? 무슨 일로 오셨죠?\"\n\n나는 조심스럽게 말을 골라서 대답했다."
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$\"아, 당신이군요. 무슨 일로 오셨죠?\"\n\n\"처지가 나쁜 사람들에게 강의하는 모습을 봤어.\" 그리고 잠시 주저하다가 말을 이었다."
 gdp_visit_holding_decision_event.1507.a: "\"혹시 나하고 같이 일해보겠나?\""
 gdp_visit_holding_decision_event.1507.b: "\"내 직원들의 영성을 강화하도록 도와주겠나?\""
 gdp_visit_holding_decision_event.1507.c: "\"솜씨를 #EMP 사용하지#! 않으면 녹이 스는 법이야. 내 회사에 들어오는 게 어떤가.\""
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName](이)가 당신의 평가에 동의함"
 gdp_visit_holding_decision_event.1507.c.failure: "[merchant_physician_recruit.GetShortUIName](을)를 꾀어내지 못함"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUIName](이)가 당신을 무시함"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "[THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] 부지로 돌아간 뒤 무엇을 더 할 수 있는지 살펴봄"
