l_korean:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "마침내 우리 공화국의 토대가 놓였다! 옹졸한 폭군과 용병 폭력배들도 더는 우리를 쟁기질이나 하고 고랑을 파는 신세로 묶어 놓지 못할 것이다. 저들의 다툼이 우리한테 고통과 슬픔을 안기는 일도 사라질 것이다.\n\n이제 공동체로 하나가 된 우리는 우리만의 운명을 만들어 나가며, 힘들게 얻어낸 자유를 지켜야 한다. 우리의 도시는 희망의 등대가 될 것이며, 그 성벽은 폭정을 막아내는 방패가 되리라."
 republic_event.0001.a: "새 시대의 시작이다!"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "옛 방식은 우리에게 큰 도움이 되어 주었고, 우리도 옛 방식을 언제나 기릴 것이다. 하지만 이제 씨족 전당으로는 우리의 변화를 감당할 수 없다. 시장, 성벽, 백성의 의지가 이제 다른 유형의 통치를 요구한다.\n\n오늘 우리는 [tribal|E] 통치를 버리고 [republic|E]를 설립했다. 도시는 하나의 목소리를 낼 것이며, 그 목소리는 우리의 목소리일 것이다."
 republic_event.0002.a: "도시가 이날을 기억할 것이다."
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "[actor.GetCapitalLocation.GetBaronyNameExplicitly]에 있는 그대의 무역 거점을 즉시 박탈하였음을 알리는 바요.\n\n물론 이는 [actor.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] 이득을 위해서요. 그대도 이해할 것이라 믿소."
 republic_event.0010.a: "#EMP 내#! 무역 거점이었는데!"
 republic_event.0012.desc: "그대는 더 이상 [trade_post_target_county.GetNameNoTierNoTooltip]에서 환영받을 수 없소! 그대의 무역 권리를 박탈하였소. 여기서 그대 소유의 모든 귀중품은 몰수될 것이며, 무역 거점 또한 완전히 파괴될 것이오."
 republic_event.0012.a: "내 무역품에 새로운 보금자리를 찾아줘야겠군..."
 republic_event.0020.t: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]의 국고"
 republic_event.0020.intro: "공화국의 예산을 조정할 때가 왔다."
 republic_event.0020.steward_desc: "눈썹을 찌푸린 [steward.GetShortUIName|U](이)가 장부를 들고 내 앞에 섰다. [steward.GetHerHim]의 뒤로는 두루마리, 서책, 재정 기록을 가득 든 보좌관들이 줄지어 늘어서 있었다.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip|U]. 이제 지출 현황을 #EMP 살펴야만#! 합니다. 국고의 새로운 예산을 짤 때가 왔습니다. 더는 미룰 수 없는 사안입니다.\""
 republic_event.0020.solo_desc: "두루마리, 서책, 재정 기록을 가득 든 사무원들이 나를 둘러쌌다. 모두 내가 검토를 마치기만을 기다리고 있었다.\n\n"
 republic_event.0020.income_desc: "현재 우리의 수입이 지출을 크게 넘어서고 있었다. 남는 금액을 더 유용하게 사용할 수 있을 듯했다."
 republic_event.0020.deficit_desc: "현재 우리의 지출은 너무도 컸고, 조치가 없다면 국고가 붕괴하게 될 것이다."
 republic_event.0020.fallback_desc: "지난 예산이 실행된 지도 몇 년이 흘렀다."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U](이)가 이미 예산을 검토해 보았으며, 현황은 좋아 보였다. 딱히 변경할 사항은 없었다."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "제안이 가득한 서류 여럿이 내 앞에 놓여 있었다. 각각 어디에 지출해야 할지, 어디서 절약해야 할지를 제시하며 국고가 가야 할 길을 서로 다르게 그리고 있었다.\n\n어느 것을 선택해야 할까?"
 republic_event.0021.a: "모두가 제대로 돈을 받게 하라."
 republic_event.0021.b: "균형 잡힌 봉급 체계가 제일 유용할 거다."
 republic_event.0021.c: "국가를 위한 추가 자금을 우선해야 한다."
 republic_event.0021.a.info_desc: "[treasury_budget_category|E] 초점: @gold_icon![treasury_salary_budget_short|E]\n대부분의 [patricians|E]는 높은 봉급을 선호함"
 republic_event.0021.b.info_desc: "[treasury_budget_category|E] 초점: @law_icon!균형\n[patricians|E]는 적절한 봉급을 받고, [liege|E]에게 충분한 [treasury|E]도 남겨 두는 균형 잡힌 예산"
 republic_event.0021.c.info_desc: "[treasury_budget_category|E] 초점: @treasury_icon!봉역\n봉급 예산을 낮게 책정하면 공화국에 쓸 자금도 늘어나며, [liege|E]이 원하는 대로 사용할 수 있는 추가 자금도 생김"
 republic_event.0030.desc: "유감스럽지만 내 시장에서 그대가 보유하고 있던 모든 독점권을 철회하기로 했소. 무역은 자유롭게 흘러가야 하는 법이니."
 republic_event.0030.a: "우리도 다른 모두와 마찬가지로 경쟁해야겠군..."
 republic_event.0040.desc: "이런 소식을 전하게 되어 유감이오. 그대를 [actor.GetConfederation.GetName]에서 제명하기로 했소."
 republic_event.0040.a: "다시 경쟁자가 됨"
 republic_event.0050.desc: "[title.GetName] 평의회가 나를 [new_holder.GetTitleAsNameNoTooltip] [new_holder.Custom('GetRepublicTermLength')]의 존엄한 직책에 선출했다."
 republic_event.0051.desc: "[new_holder.Custom('GetRepublicTermLength')]로 재선되었다. [title.GetName]에 영광 있으라."
 republic_term_length_1_desc: "[EmptyScope.ScriptValue('law_term_length_1_value')|0]년 임기"
 republic_term_length_2_desc: "[EmptyScope.ScriptValue('law_term_length_2_value')|0]년 임기"
 republic_term_length_3_desc: "[EmptyScope.ScriptValue('law_term_length_3_value')|0]년 임기"
 republic_term_length_4_desc: "[EmptyScope.ScriptValue('law_term_length_4_value')|0]년 임기"
 republic_term_length_5_desc: "[EmptyScope.ScriptValue('law_term_length_5_value')|0]년 임기"
 republic_term_length_indefinite_desc: "종신 임기"
 republic_event.0052.desc: "평의회의 존엄한 의원들 앞에 새로운 법률을 선보였다.\n\n\"[new_law.GetNameNoTooltip]\" 발의안은 철저한 심의를 거친 뒤 투표에 부쳐질 것이다."
 republic_event.0053.pass.desc: "평의회에서 \"[new_law.GetNameNoTooltip]\" 발의안이 승인되었으며, 공화국의 법률로 만들어졌다!"
 republic_event.0053.rejected.desc: "평의회에서 \"[new_law.GetNameNoTooltip]\" 발의안을 부결했다."
 republic_event.law.TT: "#bold 발의:#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P 통과:#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N 부결:#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold 유지:#! [current_law.GetName]"
 republic_event.assembly.response: "알겠다."
 republic_event.assembly.opening: "동료 시민 여러분,"
 rescind_trade_monopoly_notification_base_desc: "[actor.GetShortUINamePossessive] [trade_markets|E]에서 다음 대상이 보유했던 모든 [trade_monopolies|E]이 취소됨:"
 rescind_trade_monopoly_notification_confederation_desc: "[recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "당신의 [company|E]"
 republic_event.0100.t: "로마 공화국"
 republic_event.0100.desc: "로마. 오래전부터 많은 이는 단순한 도시의 이름이 아니라, 상징이자 #EMP 이상#!으로 그 단어를 읊조릴 날을 꿈꿔 왔다. 그리고 내가 그 꿈을 현실로 만들었다.\n\n봉역의 곳곳에서 축하가 울려 퍼진다. 시민, 아니... #EMP 로마인#!들은 우리가 다시 한번 문명의 중심이 될 내일을 맞이하게 될 것이다. 이제 먼 옛날 사라진 이상을 복원하는 작업이 시작된다. 이 어두운 시기에 우리를 인도해 줄 등불이자 희망의 등대가 되는 것이다."
 republic_event.0100.a: "모든 길은 다시 한번 로마로 통할 것이다."
 republic_event.0100.b: "로마는 단순한 장소가 아니라 이상이다."
