l_korean:
 gdp_tgf_coin_artifact: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip] 첫 주화"
 gdp_tgf_coin_artifact_desc: "한쪽 면에는 [tgf_market_holder.GetFirstNamePossessive] 얼굴이 새겨져 있고, 테두리에는 상인만 읽을 수 있을 만큼 작은 글씨가 적혀 있습니다. \"[tgf_coin_merchant.GetFirstName](이)가 [tgf_good.Custom('GetTradeGood')](을)를 공급함\""
 gdp_tgf_smith_weapon_axe: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] 도끼"
 gdp_tgf_smith_weapon_dagger: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] 단검"
 gdp_tgf_smith_weapon_hammer: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] 망치"
 gdp_tgf_smith_weapon_mace: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] 철퇴"
 gdp_tgf_smith_weapon_spear: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] 창"
 gdp_tgf_smith_weapon_sword: "[tgf_smith_patron.GetFirstNamePossessiveNoTooltip] [tgf_good.Custom('GetTradeGood')|U] 검"
 gdp_tgf_smith_weapon_desc: "[tgf_smith_patron.GetFirstName](이)가 지금껏 구입한 금속 중 가장 좋은 것을 재료로 삼아, [tgf_source_county.GetNameNoTier] 출신 [tgf_smith.GetFirstName](이)가 벼려 낸 무기입니다. 대장장이는 재료로 쓴 금속의 열 배에 달하는 값어치가 있다고 장담합니다."
 gdp_tgf_reading_stones_artifact_merchant: "[tgf_lens_merchant.GetFirstNamePossessiveNoTooltip] 독서석"
 gdp_tgf_reading_stones_artifact_lord: "[tgf_market_holder.GetFirstNamePossessiveNoTooltip] 독서석"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "[tgf_source_county.GetNameNoTier] 출신 [tgf_glassmaker.GetFirstName](이)가 연마한 투명한 유리 렌즈 두 개입니다. 세네카는 물을 채운 유리 구체를 통해 보면 작은 글씨도 크게 보인다고 기록했습니다. 이 렌즈만 있으면 어떤 계약서의 깨알 같은 글씨도 또렷하게 읽을 수 있습니다."
 gdp_tgf_showpiece_artifact: "[tgf_showpiece_merchant.GetFirstNamePossessiveNoTooltip] [tgf_good.GetNameNoTooltip] 진열장"
 gdp_tgf_showpiece_artifact_desc: "숙련된 [tgf_good.Custom('GetTgfGoodCrafter')] [tgf_crafter.GetFirstName](이)가 제작했으며, 모든 서랍의 안쪽에는 [tgf_showpiece_merchant.GetFirstNamePossessive] 최상급 [tgf_good.Custom('GetTradeGood')](이)가 깔려 있습니다. 구매자에게만 열어 보여 주고, 그 외 사람들에게는 잠가 둡니다."
 gdp_tgf_curio_grain: "품평회급 곡식 한 단"
 gdp_tgf_curio_grain_desc: "유난히 풍년이었던 해, 가장 좋은 밭에서 베어 낸 곡식입니다."
 gdp_tgf_curio_millet: "묵은 잡곡 단지"
 gdp_tgf_curio_millet_desc: "몇 년이나 묵었지만 새것처럼 멀쩡합니다. 잡곡은 오래 두고 먹을 수 있습니다."
 gdp_tgf_curio_rice: "흰쌀을 담은 그릇"
 gdp_tgf_curio_rice_desc: "왕겨를 벗기고 윤이 나도록 도정했습니다. 먹기 아까울 만큼 보기 좋습니다."
 gdp_tgf_curio_meat: "완벽하게 염장한 고기"
 gdp_tgf_curio_meat_desc: "소금에 어찌나 잘 절였는지, 주인이 죽은 뒤에도 멀쩡히 남아 있을지 모릅니다."
 gdp_tgf_curio_fish: "고정한 말린 생선"
 gdp_tgf_curio_fish_desc: "판자처럼 뻣뻣한 데다 거드름은 두 배로 피웁니다."
 gdp_tgf_curio_cheese: "둥근 숙성 치즈"
 gdp_tgf_curio_cheese_desc: "이제는 아무도 기억하지 못하는 어느 여름날, 눌러 만든 치즈입니다."
 gdp_tgf_curio_fruit: "설탕에 절인 과일 단지"
 gdp_tgf_curio_fruit_desc: "설탕에 절여 밀봉한 뒤, 특별한 날을 위해 아껴 두었습니다."
 gdp_tgf_curio_oil: "처음 짜낸 기름병"
 gdp_tgf_curio_oil_desc: "그해 처음 짜낸 기름으로, 초록빛이 감도는 황금색입니다."
 gdp_tgf_curio_honey: "밀봉한 꿀단지"
 gdp_tgf_curio_honey_desc: "짙은 호박빛입니다. 웬만한 묵은 포도주보다도 오래되었습니다."
 gdp_tgf_curio_tea: "압축한 차 덩어리"
 gdp_tgf_curio_tea_desc: "제 무게만큼 값어치를 하는 차입니다. 차밭에서 머나먼 길을 건너왔습니다."
 gdp_tgf_curio_horses: "우승마의 편자"
 gdp_tgf_curio_horses_desc: "경주에서 단 한 번도 진 적 없는 말의 편자라고 합니다. 적어도 판매자는 그렇게 장담했습니다."
 gdp_tgf_curio_cattle: "연마한 소뿔"
 gdp_tgf_curio_cattle_desc: "반짝반짝 윤이 나도록 연마했습니다. 잔치에서 술잔으로 쓰기에도 좋습니다."
 gdp_tgf_curio_silver: "흠 없는 은괴"
 gdp_tgf_curio_silver_desc: "손톱으로도 자국을 낼 수 있을 만큼 순도가 높습니다. 하지만 누구도 감히 흠집 낼 엄두를 내지 못합니다."
 gdp_tgf_curio_gold: "사금 덩어리"
 gdp_tgf_curio_gold_desc: "누구도 이름을 밝히려 하지 않는 강에서 씻어 낸 금덩이입니다."
 gdp_tgf_curio_iron: "완벽한 철 소재"
 gdp_tgf_curio_iron_desc: "치밀하고 어두운 빛을 띠며, 흠 하나 없습니다."
 gdp_tgf_curio_copper: "윤이 나는 구리 원판"
 gdp_tgf_curio_copper_desc: "광산에서 주조한 것으로, 처음 식었을 때처럼 반짝입니다."
 gdp_tgf_curio_beer: "무늬를 새긴 술잔"
 gdp_tgf_curio_beer_desc: "1파인트가 정확하게 들어갑니다. 하지만 한 잔만 마시고 끝내는 일은 드뭅니다."
 gdp_tgf_curio_wine: "전설적인 빈티지"
 gdp_tgf_curio_wine_desc: "포도 재배자들이 지금도 이야기를 속삭이는 연도에 나온 포도주 한 병입니다."
 gdp_tgf_curio_gems: "보석 원석"
 gdp_tgf_curio_gems_desc: "자갈처럼 거칠지만, 그 값은 마을 하나에 맞먹습니다."
 gdp_tgf_curio_amber: "호박석 덩어리"
 gdp_tgf_curio_amber_desc: "꿀빛을 띠며, 그 안에는 파리 한 마리가 영원히 갇혀 있습니다."
 gdp_tgf_curio_ivory: "세공한 상아 조각"
 gdp_tgf_curio_ivory_desc: "누군가 끈기 있게 조각해 낸 엄니 끝부분입니다."
 gdp_tgf_curio_jade: "강에서 발견한 옥돌"
 gdp_tgf_curio_jade_desc: "손에 쥐면 서늘합니다. 진짜 옥이란 언제나 그런 법입니다."
 gdp_tgf_curio_wood: "독특한 나뭇결의 옹이"
 gdp_tgf_curio_wood_desc: "물처럼 흐르는 나뭇결을 보입니다. 목각 장인들이 해마다 입찰에 나섭니다."
 gdp_tgf_curio_hemp: "완벽한 밧줄 타래"
 gdp_tgf_curio_hemp_desc: "어찌나 고르게 꼬였는지, 꼬아 만든 게 아니라 그려 놓은 것 같습니다."
 gdp_tgf_curio_wool: "황금 양털"
 gdp_tgf_curio_wool_desc: "전설 속 황금 양털은 아닙니다. 하지만 목동 말로는 그에 못지않다고 합니다."
 gdp_tgf_curio_cotton: "최상급 목화솜 뭉치"
 gdp_tgf_curio_cotton_desc: "솜털처럼 가볍고 서리처럼 하얗습니다."
 gdp_tgf_curio_flax: "비단처럼 고운 아마 타래"
 gdp_tgf_curio_flax_desc: "아마를 워낙 곱게 가공해서 해 질 무렵에는 비단으로 착각할 정도입니다."
 gdp_tgf_curio_textiles: "직조 명장의 옷감"
 gdp_tgf_curio_textiles_desc: "어찌나 촘촘하게 짰는지 빗물마저 튕겨 냅니다."
 gdp_tgf_curio_furs: "흠 없는 겨울 털가죽"
 gdp_tgf_curio_furs_desc: "한겨울, 털이 가장 두껍고 풍성할 때 얻은 가죽입니다."
 gdp_tgf_curio_leather: "무늬를 새긴 가죽 조각"
 gdp_tgf_curio_leather_desc: "무두질하고 무늬를 새겼으며, 천처럼 부드럽습니다."
 gdp_tgf_curio_sugar: "하얀 슈거로프 끝"
 gdp_tgf_curio_sugar_desc: "설탕 덩어리에서 가장 흰 부분을 전시하려고 따로 남겨 두었습니다."
 gdp_tgf_curio_spices: "희귀한 향신료 상자"
 gdp_tgf_curio_spices_desc: "일 년에 단 한 번, 정말 향신료가 있다는 걸 보이기 위해 엽니다."
 gdp_tgf_curio_ceramics: "흠 없는 유약 입힌 그릇"
 gdp_tgf_curio_ceramics_desc: "두드리면 종처럼 맑게 울립니다. 하지만 누구도 감히 두드리지 않습니다."
 gdp_tgf_curio_glass: "투명하고 작은 유리병"
 gdp_tgf_curio_glass_desc: "기포 하나 없습니다. 유리 장인은 뿌듯한 마음으로 은퇴했습니다."
 gdp_tgf_curio_jewelry: "걸작 브로치"
 gdp_tgf_curio_jewelry_desc: "고정하는 핀 하나 만드는 데만 한 달이 걸렸습니다."
 gdp_tgf_curio_lacquerware: "옻칠한 기념품 보관함"
 gdp_tgf_curio_lacquerware_desc: "옻칠을 서른 겹이나 올렸습니다. 안에 든 선물보다 상자가 더 눈부십니다."
 gdp_tgf_curio_silk: "완벽한 비단 자투리"
 gdp_tgf_curio_silk_desc: "베틀에서 짜 낸 최고의 비단을 시장에 내놓지 않고 따로 보관했습니다."
 gdp_tgf_curio_incense: "옅은 수지 덩어리"
 gdp_tgf_curio_incense_desc: "태우지 않아도 달콤한 향이 납니다. 태우면 더 향기롭습니다. 정작 한 번도 태운 적은 없습니다."
 gdp_tgf_curio_medicaments: "약제상의 약제 견본"
 gdp_tgf_curio_medicaments_desc: "온갖 병에 대비해 온갖 약을 한 번 쓸 분량씩 모아 놓았습니다."
 gdp_tgf_curio_stone: "조각이 새겨진 석재 파편"
 gdp_tgf_curio_stone_place: "[tgf_source_county.GetNameNoTierNoTooltip]산 조각이 새겨진 석재"
 gdp_tgf_curio_stone_desc: "살아 있는 어떤 석공보다도 오래된 물건이지만, 깎아 낸 솜씨는 오히려 더 뛰어납니다."
 gdp_tgf_curio_salt: "순백의 소금 덩어리"
 gdp_tgf_curio_salt_desc: "눈처럼 새하얗습니다. 회색 소금은 결코 이렇게 희지 않습니다."
 gdp_tgf_curio_alum: "주먹만 한 명반 결정"
 gdp_tgf_curio_alum_desc: "얼음처럼 투명하고, 혀가 아릴 만큼 떫습니다."
 gdp_tgf_curio_dyes: "자주색 염료 한 병"
 gdp_tgf_curio_dyes_desc: "한때 황제에게만 허용되었던 색입니다. 규정상으로는 지금도 그렇습니다."
 gdp_tgf_curio_books_paper: "채색 필사본 한 장"
 gdp_tgf_curio_books_paper_desc: "어디에서도 찾을 수 없는 책에서 나온, 흠잡을 데 없는 한 장입니다."
 gdp_tgf_itinerary_artifact: "순례 안내서"
 gdp_tgf_itinerary_artifact_desc: "길과 여관, 여울에 관한 정보가 정갈한 글씨로 적힌, 손때 묻고 해진 작은 책입니다. 여기에 기록된 장소 중 일부는 어느 지도에도 나와 있지 않습니다."
 gdp_tgf_first_sale_artifact: "[tgf_first_seller.GetFirstNamePossessiveNoTooltip] 첫 [tgf_good.GetNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "[tgf_first_seller.GetFirstName](이)가 처음 판매했던 [tgf_good.Custom('GetTradeGood')] [tgf_good.Custom('GetTgfGoodSmallest')]입니다. 처음 판 가격의 두 배를 주고 되사 보관했습니다. 팔 생각은 없습니다. 아마도."
 gdp_tgf_merchant_portrait_artifact: "상인의 초상화"
 gdp_tgf_merchant_portrait_artifact_desc: "동전이 수북이 쌓인 탁자 앞에서 흡족한 표정을 짓고 있는 상인의 초상화입니다."
 gdp_tgf_bale_book_artifact: "화물 속의 책"
 gdp_tgf_bale_book_artifact_desc: "상품에 습기가 스며들지 않도록 누군가가 이 책을 사용했습니다. 효과는 그럭저럭 있었습니다."
 gdp_tgf_handbook_practice_artifact: "상업 실무서"
 gdp_tgf_handbook_practice_artifact_desc: "도량형, 도로, 가격 등이 적혀 있습니다. 잠도 자지 않고 일한 게 분명한 상인이 남긴 기록입니다. 여백에는 다른 사람이 적어 놓은 계산이 빼곡합니다."
 gdp_tgf_handbook_roads_artifact: "도로와 시장 안내서"
 gdp_tgf_handbook_roads_artifact_desc: "주요 시장을 잇는 모든 길과 통행료, 여관은 물론, 어떤 나룻배 사공이 속임수를 쓰는지까지 기록되어 있습니다."
 gdp_tgf_handbook_mirror_artifact: "상인의 거울"
 gdp_tgf_handbook_mirror_artifact_desc: "무엇을 사야 하는지부터 누구를 믿어야 하는지까지, 상인을 위한 조언을 담았습니다. 다만 대부분은 누구를 믿지 말아야 하는지에 관한 내용입니다."
