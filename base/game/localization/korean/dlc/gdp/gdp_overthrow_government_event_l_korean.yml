l_korean:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "타도된 정부"
 overthrow_government_outcome.1001.desc: "모의가 절정에 다다랐다. 지금이 아니면 기회는 없다. 주요 공모자들이 도시 경비대의 병영, 평의회, 궁전에 배치되었다. 내 명령이 떨어지면 저들이 권력의 지렛대를 장악하며 옛 정권을 몰아내고 말 것이다.\n\n내일이면 평의회도 내 정권을 인정하고, 내게 반대하는 세력을 국가의 적으로 규정할 수밖에 없으리라."
 overthrow_government_outcome.1001.a: "유혈 사태도, 추방도 없다."
 overthrow_government_outcome.1001.b: "내 개인적인 적들."
 overthrow_government_outcome.1001.c: "우리에게 반대하는 이는 누구든 떠나야 한다."
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "굳건한 공화국"
 overthrow_government_outcome.1002.desc: "내 파트리치오들 사이의 모의가 드러났다. 불한당 같은 [owner.GetShortUINameNoTooltip]의 짓이었다. 다행히 이 모반은 바위처럼 단단한 내 영광스러운 정부에 부딪혀 빠르게 진압되었다!\n\n이 불한당들은 위엄을 갖춘 나를 사로잡으려고 했으나, 내 경비대 덕분에 저들의 시도가 무산되었다. 평의회와 군 역시 저들의 사악한 시도에도 아랑곳하지 않았으며, 여전히 내게 충성을 바친다."
 overthrow_government_outcome.1002.a: "저들을 붙잡아라!"
 overthrow_government_outcome.1002.b: "저들은 때가 되면 처리하겠다."
 overthrow_government_outcome.1002.c: "저들을 용서할 수 있게 되면 좋겠군."
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName](와)과 [owner.GetHerHis] [agents|E]들이 [criminal|E] 상태에서 사면되어 더 이상 국가의 적이 아니게 됨"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "타도"
 overthrow_government_outcome.1003.desc: "\"영주님!\" [craftsman_character.GetShortUINameNoTooltip](이)가 문을 박차고 들어오며 외쳤다. 목숨을 걸고 온 힘을 다해 달려온 것 같았다.\n\n\"음모입니다! 반역입니다! [owner.GetShortUINameNoTooltip](이)가 동조자들을 규합해 의회가 주군을 국가의 적으로 규탄하도록 추진하고 있습니다! 폭도들이 이쪽으로 오는 중입니다!\"\n\n[craftsman_character.GetSheHe|U]는 우리에 갇힌 짐승처럼 방을 서성이기 시작했다. \"어떻게 해야 합니까?\" [craftsman_character.GetSheHe]가 묻는다."
 overthrow_government_outcome.1003.b.desc: "\"영주님!\" [craftsman_character.GetShortUINameNoTooltip](이)가 문을 박차고 들어오며 외쳤다. 목숨을 걸고 온 힘을 다해 달려온 것 같았다.\n\n\"음모입니다! 반역입니다! [owner.GetShortUINameNoTooltip](이)가 동조자들을 규합해 의회가 새 정부의 수립을 선포하도록 추진했습니다. 시중에는 영주님께서 폐위되었다는 소문이 돌고 있습니다. 다만 새 정부가 모든 정적을 사면했다고 합니다.\"\n\n[craftsman_character.GetSheHe|U]는 낙담한 표정으로 나를 바라본다. \"어떻게 해야 합니까?\" [craftsman_character.GetSheHe]가 묻는다."
 overthrow_government_outcome.1003.a: "[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U](와)과 평의회 앞에서 내 입장을 호소하겠다."
 overthrow_government_outcome.1003.b: "망명해야겠군."
 overthrow_government_outcome.1003.c: "정치에서 한 발 물러나 겸허한 상인으로 살아가겠다."
 overthrow_government_outcome.1003.d: "당장은 아무것도 하지 않겠다. 정치란 원래 이런 법이지."
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "국가의 적"
 overthrow_government_outcome.1004.1.desc: "내가 국가의 적으로 규정되었다!"
 overthrow_government_outcome.1004.2.desc: "\n\n모든 시장 광장과 교회 문에 선언문이 붙었다. 내 삶과 재산이 위험에 빠졌다."
 overthrow_government_outcome.1004.3.desc: "\n\n당장 체포당해도 이상할 것이 없는 상황이다!"
 overthrow_government_outcome.1004.councilor.desc: "\n\n폐위된 정권의 의회에서 내가 요직을 맡았기 때문임이 틀림없다."
 overthrow_government_outcome.1004.personal.desc: "\n\n[owner.GetName](이)가 나를 사적인 적으로 여기니, 왜 그런지는 짐작하기 어렵지 않다."
 overthrow_government_outcome.1004.political.desc: "\n\n내가 유력한 파트리키면서 새 정권의 [owner.GetHouse.GetHouseAspiration.GetName] 의제에 앞장서 반대해 왔기 때문임이 틀림없다."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\n내가 정부를 전복하려는 음모의 공모자로 활동했기 때문임이 틀림없다."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "주사위는 던져졌다"
 overthrow_government_outcome.1005.desc: "[speaker.GetShortUINameNoTooltip](이)가 평의회 앞으로 나서 발언을 시작하자, 회의장에 팽팽한 긴장감이 감돈다.\n\n\"파트리키 여러분! 조국과 우리 공화국의 영광이 영원하기를! 유감스럽게도 [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U] [target.GetFirstNameNoTooltip]께서 부패와 공화국에 대한 반역을 이유로 축출되셨음을 알려 드립니다.\"\n\n탄성과 중얼거리는 소리가 회의장을 휩쓴다. 그러나 몇몇 유력 파트리키들은 자리에서 일어나 박수를 보낸다.\n\n\"긴급 포고령에 따라, 시민 [owner.GetFirstNameNoTooltip]께서 국가의 혼란을 바로잡고자 나서셨으며, 우리의 새로운 [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U](으)로 취임하셨습니다.\"\n\n자리에서 일어나는 파트리키가 늘어나면서 박수 소리도 점점 커진다."
 overthrow_government_outcome.1005.a: "공화국 만세!"
 overthrow_government_outcome.1005.b: "우우! 폭군! 반역이다!"
 government_overthrow_enemies.1001.b.custom: "다음 파트리키가 [criminals|E]가 됨:\n$EFFECT_LIST_BULLET$타도당한 [liege|E] 및 [councillors|E]\n$EFFECT_LIST_BULLET$당신의 [rivals|E] 및 [nemesis|E]\n$EFFECT_LIST_BULLET$당신을 향한 [opinion|E]이 #N -60#! 이하인 인물\n$EFFECT_LIST_BULLET$[rivalry|E] [house_relation|E]에 있는 [house_heads|E]\n$EFFECT_LIST_BULLET$해당 인물은 [assembly|E]에서 관용을 요청하거나 망명할 수 있음\n$EFFECT_LIST_BULLET$[friends|E], [lovers|E], [soulmates|E] 및 [blood_brothers|E]는 제외됨"
 government_overthrow_enemies.1001.c.custom: "다음 파트리키가 [criminals|E]가 됨:\n$EFFECT_LIST_BULLET$다른 [house_ambition|E]을 보유한 [powerful_vassal|E]\n$EFFECT_LIST_BULLET$타도당한 [liege|E] 및 [councillors|E]\n$EFFECT_LIST_BULLET$당신의 [rivals|E] 및 [nemesis|E]\n$EFFECT_LIST_BULLET$당신을 향한 [opinion|E]이 #N -60#! 이하인 인물\n$EFFECT_LIST_BULLET$[rivalry|E] [house_relation|E]에 있는 [house_heads|E]\n$EFFECT_LIST_BULLET$당신의 [agents|E]의 사적인 적\n$EFFECT_LIST_BULLET$해당 인물은 [assembly|E]에서 관용을 요청하거나 망명할 수 있음"
 government_overthrow_populace.1001.a.custom: "당신의 [realm|E] 내 모든 [Concept( 'county', '영지' )|E]"
 government_overthrow_populace.1001.a.description: "새 정권에 반대하는 인물들을 일괄 사면합니다."
 government_overthrow_forgiven.tt: "당신이 국가에 저지른 범죄를 사면받음"
 overthrow_government_outcome.tt.success.desc: "당신이 자신을 유창하게 변호함"
 overthrow_government_outcome.tt.success.toast: "당신의 행동이 공화국을 위한 사랑에서 비롯된 것이었음을 입증함"
 overthrow_government_outcome.tt.failure.desc: "당신의 연설을 아무도 귀담아듣지 않음"
 overthrow_government_outcome.tt.failure.toast: "당신이 야유받으며 평의회에서 퇴장당함"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip](이)가 소박한 상인이 됨"
 overthrow_government_enemy_of_the_state.tt: "평의회에서 당신을 국가의 적으로 규정함"
 overthrow_government_amnesty.tt: "평의회가 모든 음모 가담자를 일괄 사면함"
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip](이)가 당신에게 국가에 대항하는 음모를 꾸민 혐의로 체포 명령을 내림"
 overthrow_government_blanket_pardon.tt: "타도된 정부: 사면"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip](이)가 [the_new_dodge.GetHerHis] 모든 정적에게 사면을 선언합니다."
