 action_merchant_company_in_debt_desc: "보유 [gold|E]가 [gold_i|E]#V [EmptyScope.ScriptValue('company_debt_gold_threshold_value')|0]#! 미만으로 떨어져 [company|E]가 [debt|E] 상태에 빠졌습니다!\n\n회사가 채무 상태인 경우:\n$BULLET_WITH_TAB$[EmptyScope.ScriptValue('company_debt_direction_interval_months_value')|V0]개월마다 [company_direction|E] 진행도가 [company_sentiment_divided_i][company_sentiment_divided|E] 쪽으로 [EmptyScope.ScriptValue('company_debt_direction_shift_value')|V0]만큼 진행\n$BULLET_WITH_TAB$[war|E] 선포 불가\n\n부채를 많이 질수록 불이익이 더 커집니다. 현재 부채 수준에서 받는 효과는 다음과 같습니다.\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help 부채에 빠지면서 회사는 이미 [trade_acumen_i][acumen|E]를 잃었고, 그 결과 [company_size|E]의 성장도 멈췄습니다. 부채를 청산하면 [company_sentiment|E]이 더 악화되는 것을 막을 수 있습니다.#!"
