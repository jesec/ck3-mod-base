l_korean:
 option_boilerplate.tt.partner_aptitude: "#WEAK 이 결투는 당신의 [deputy_possessive|E] [aptitude|E]에 의해 결정됨#!"
 option_boilerplate.tt.partner_aptitude.success: "당신의 대리인이 성공함"
 option_boilerplate.tt.partner_aptitude.failure: "당신의 대리인이 실패함"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: [destination.GetBaronyNameExplicitlyNoTooltip]의 불평"
 gdp_merchant_unity_contract.1004.desc: "[local_ruler.GetTitledFirstNamePossessive] 서신은 짧았으며 요점만 담고 있었다. [destination.GetBaronyNameExplicitly]의 분노한 시민들이 내 무역상인 [trader.GetTitledFirstName]의 경영, 즉 내 회사에 의문을 품는다는 것이다.\n\n지역 상인, 사업가, 거주민 모두가 내 회사의 거래가 일관되지 못하다며 불평했다. [local_ruler.GetTitledFirstNameNoTooltip](은)는 이 문제를 빨리 마무리 짓고 [local_ruler.GetHerHis] 탄원인들을 조용히 시키고 싶어 한다.\n\n분명 [trader.GetTitledFirstNameNoTooltip](이)가 너무 제 주관을 발휘했던 모양이다. 여기 [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에 있었다면 엄격한 감시를 받았을 수도 있었을 텐데.\n\n이제 [destination.GetBaronyNameExplicitlyNoTooltip](으)로 가는 여정만이 남아 있다."
 gdp_merchant_unity_contract.1004.a: "출발하자."
 gdp_merchant_unity_contract.1004.tt.destination_list: "바로 [destination.GetBaronyNameExplicitly](으)로 이동 시작"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT [task_contract|E] 완료 조건:\n$EFFECT_LIST_BULLET$확언할 기회가 #V 3#!번 주어짐\n$TAB$$EFFECT_LIST_BULLET$#V 2#!번 확언하면 $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$#V 3#!번 확언하면 $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$#V 1#!번 확언하면 $label_success_standard$, $label_success_qualified$ 또는 $label_failure_standard$\n$EFFECT_LIST_BULLET$다음 도전과 마주할 수 있음\n$TAB$$EFFECT_LIST_BULLET$당신의 [Concept( 'stewardship', '관리력' )|E] 시험\n$TAB$$EFFECT_LIST_BULLET$[GetCourtPositionType('partner_court_position').GetName()] [deputy_possessive|E] [aptitude|E] 시험\n$TAB$$EFFECT_LIST_BULLET$당신의 [Concept( 'diplomacy', '외교력' )|E], [Concept( 'intrigue', '계책력' )|E], [Concept( 'learning', '학습력' )|E] 중 한 가지를 시험#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: 마을 광장"
 gdp_merchant_unity_contract.1010.desc.intro: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]인가?\" [local_ruler.GetTitledFirstName](은)는 [destination.GetBaronyNameExplicitly]에서 나와 내 일행을 마주치고는 한숨을 쉬었다. [local_ruler.GetHerHis] 수행단이 함께 있었는데, 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))] [trader.GetTitledFirstName](이)가 밧줄로 묶인 채 경비들에 둘러싸여 있었다."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "내 [GetCourtPositionType('partner_court_position').GetName()] [partner.GetFirstName](이)가 뒤에서 머리를 까닥였다. 경계심을 늦추지 않고 언제든 도울 준비가 된 모습이었다."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n\"그대 상인이 혼란을 일으켰더군. 우리 쪽 목격자들이 증언할 걸세.\" [local_ruler.GetFirstNameNoTooltip](이)가 말을 이어갔다. \"그대라면 이 일을 빠르게 해결해 줄 거라 믿겠네. 이런 사안에 낭비할 시간은 없단 말일세!\""
 gdp_merchant_unity_contract.1010.desc.outro: "\n\n나는 [person_c.GetTitledFirstName](와)과 [person_d.GetTitledFirstName](을)를 만나 불만 사항을 들어보라는 지시를 받았다. [trader.GetFirstNameNoTooltip](이)가 나를 보더니 이렇게 말했다. \"[ROOT.Char.GetTitleAsNameNoTooltip], 분명 절 이해해 주실 거라 믿습니다...\""
 gdp_merchant_unity_contract.1010.a: "[local_ruler.GetTitledFirstNameNoTooltip], 자세히 설명 좀 해주실 수 있겠습니까?"
 gdp_merchant_unity_contract.1010.a.tt: "바로 [THIS.Char.GetTitledFirstNamePossessive] 설명을 요청함"
 gdp_merchant_unity_contract.1010.b: "[person_c.GetTitledFirstNameNoTooltip](와)과 만나보도록 하지요."
 gdp_merchant_unity_contract.1010.c: "[person_d.GetTitledFirstNameNoTooltip](이)라면 얘기하고 싶어 안달이 나 있을 겁니다."
 gdp_merchant_unity_contract.1010.d: "이 상황을 당장 끝냅시다."
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "우리는 [char_current.GetTitleAsNamePossessive] 개인적이면서도 화려한 구역으로 안내를 받아 들어왔다. [char_current.GetSheHe|U]가 나를 어느 방으로 안내하며 앉으라고 손짓했는데, 분명 [destination.GetTitle.Custom('BaronyTownTypePossessive')] 유력자들이 회의할 때 사용하는 장소 같았다."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.GetTitledFirstName](은)는 나를 근처에 있는 [char_current.GetHerHis] 회사 땅으로 데려갔다. [char_current.GetHerHis] 사원들이 장부에 매일 이루어지는 거래의 결실을 바쁘게 적고 있는 곳이었다."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName](은)는 도시의 부두를 책임지며 부둣가에서 오가는 사람들을 지켜본다. [char_current.GetHerHis|U] 끝없이 쌓인 서류들은 선박들이 치러야 할 대금과 화물의 운송 및 적재를 기록하고 있었다."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName](은)는 [destination.GetTitle.GetBaseNameNoTierPossessive] 주 시장을 감독하며 행상인들이 올바른 허가를 받았는지, [local_ruler.GetTitleAsNamePossessiveNoTooltip] 법이 잘 지켜지고 있는지를 확인한다."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "[char_current.GetFirstName](은)는 자신의 대장간에서 편자에 망치질하느라 바빴다. [char_current.GetSheHe|U]는 내가 오는 줄도 몰랐고, 내 시선을 눈치채자 사과하며 도제에게 자기 일을 넘겨주었다."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "[char_current.GetFirstName](은)는 도시 외곽에 있는 자신의 무두질 공방에 있었는데, 악취가 진동하는 장소였다. [char_current.GetSheHe|U]는 냄새가 나는지도 모르는 모양이었다. 수많은 모피와 고객을 보니 수익이 악취를 능가한다는 사실을 알 수 있었다."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "[char_current.GetFirstName](은)는 자신의 공방에 있었다. 공기에는 [char_current.Custom('GetRandomAppropriateTree')]의 향기가 가득했다. 나를 발견한 [char_current.GetSheHe]가 조각하고 있던 물건을 옆으로 치웠다."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName](은)는 [destination.GetTitle.GetAdjectiveNoTooltip] 경비대의 우두머리였다. [char_current.GetHerHim]가 무기고에서 졸고 있었다. 잠에서 깬 [char_current.GetSheHe]는 내게 자리를 권하며, 휴식 시간이었다고 더듬거렸다."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "\"[ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip], 편히 말씀드리겠습니다.\" [char_current.GetSheHe]가 말했다. \"당신네 무역상이 온갖 종류의 속임수를 쓰면서"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n\"회사를 제대로 단속하십시오. 안 그러면 다른 데서 사업을 하셔야 할 겁니다.\""
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "\"어려운 일은 아니지 않습니까?\" [char_current.GetSheHe]가 미소를 지었다. \"공정하게 사업하는 것 말입니다. 당신네 거래와 관련해서 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip](이)가 좋지 않은 모습을 보이더군요...\""
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "\"경고하지요.\" [char_current.GetSheHe]가 미소를 지었다. \"[local_ruler.GetTitleAsNameNoTooltip]께서 지금껏 참아 주시긴 했지만, 그분의 인내심을 시험하지 않는 편이 좋을 겁니다.\""
 gdp_merchant_unity_contract.1011.desc.personality.market: "[char_current.GetSheHe]가 두 팔을 벌리며 미소를 지었다. \"여기서 영업하는 무역상 중에서도 특히 #EMP 당신#! 무역상 말입니다.\" [char_current.GetSheHe]가 나를 비난하듯 가리켰다. \"계속해서 불만이 제기되더군요.\""
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "\"이런 말이 있지요.\" [char_current.GetSheHe]가 얼굴을 찌푸렸다. \"#EMP 아니 땐 굴뚝에 연기 나지 않는다#!. 그래서 하는 소린데, 당신네 무역상한테 연기가 #EMP 정말#! 많이 나오더란 말입니다!\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "\"저는 사업을 언제나 떳떳하게 운영해 왔으며, 기록은 물론 고객과의 관계도 깔끔하게 유지합니다. 모든 사람이 저처럼 하질 않는다는 점이 안타깝군요...\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "\"[char_current.GetFaith.WealthGodName]께서는 모두를 지켜보십니다. 이는 부인할 수 없는 사실이고요. 그리고 저는 계속해서 그분의 편에 서려고 노력합니다. 그러지 않는 이들이 누군지는 곧 알게 되겠지요...\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "\"보십시오, 저도 다른 사람 못지않게... 아니, 그 사람들보다 더 돈을 좋아합니다! 근데 이런 식으로는 사업을 운영할 수가 없어요. 매번 방해받지 않습니까.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "\"그쪽은 말이 통하는 사람 같군요, [ROOT.Char.GetTitledFirstNameNoTooltip]. 이해해 주십시오. 당신네 사람이 우리한테 부당한 대우를 했으니, 우리도 도저히 참아 줄 수가 없습니다.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "\"전 터무니없는 소리나 하는 사람은 아닙니다. 그냥 있는 그대로 솔직하게 말할 뿐이고, 그러니 다른 사람들도 그렇게 해 줬으면 하죠. 당신네 무역상은 거짓말쟁이입니다. 제가 할 말은 그게 전부입니다.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "\"압니다, 알아요. 보기엔 저희가 알아서 잘 사는 것처럼 보이시겠지요. 하지만 제 거래는 운송에 크게 의존하고 있습니다. 그런데 당신네 무역상이 저한테 실망을 너무 여러 번 안겨줬다 이겁니다.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]. 저는 사업이든, 저보다 못한 사람이든, 아니면 더 나은 사람이든 모두 공평하게 대합니다. 근데 그 공평함이란 것도 모든 사람한테 보장이 되어야 소용이 있는 거죠. 그렇지 못하다면 뭐, #EMP 누군가#!는 피를 보게 된다 이 말입니다.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "\"우리 둘 다 바쁜 사람이지 않습니까? 그러니 털어놓고 말하겠습니다. 제가 필요한 걸 못 얻으면 제 사람들의 배를 불릴 수가 없습니다. 이 일을 꼭 해결하십시오.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "\"보십시오, [trader.GetFirstName]도 착한 사람이긴 하겠지만, 저도 참는 데 한계가 있고 선이 있습니다. 이 사람은 이미 한참 전에 그 선을 넘었고요.\""
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "\"그래서... 어떻게 하실 겁니까? 당신네 무역상이 여기서 많은 적을 만들었더군요. 그럴 필요가 전혀 없는데 말이지요. 우린 그저 정당한 대우를 바랄 뿐입니다.\""
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "배송 여러 건을 잘못 전달했더군요.\""
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "품질이 형편없는 상품을 전달했더군요.\""
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "대금을 제때 치르지 못했더군요.\""
 gdp_merchant_unity_contract.1011.a: "불일치를 논리적으로 설명하려 시도한다."
 gdp_merchant_unity_contract.1011.b: "내 명예로 [char_current.GetHerHim]를 설득한다."
 gdp_merchant_unity_contract.1011.c: "이야기를 지어내 버린다."
 gdp_merchant_unity_contract.1011.d.gold: "\"받으시오. 우리가 불편을 끼쳤으니.\""
 gdp_merchant_unity_contract.1011.d.competitiveness: "\"반드시 상황을 제대로 돌려놓겠소.\""
 gdp_merchant_unity_contract.1011.e: "\"혹시 #EMP 합의#!하는 건 어떻겠소?\""
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], 설명하도록."
 gdp_merchant_unity_contract.1011.f.partner_away: "내 [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]만 여기 있었더라도..."
 gdp_merchant_unity_contract.1011.f.partner_diff: "나한테 다른 [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]만 있었더라도..."
 gdp_merchant_unity_contract.1011.f.no_partner: "나한테 [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]만 있었더라도..."
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT 당신이 가능한 확언 기회 #V 3#!번 중에서 [task_contract.MakeScope.Var('assurances_given').GetValue|0V]번 확언함#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT 당신이 가능한 [characters|E] #V 3#!명 중에서 [task_contract.MakeScope.Var('chars_checked').GetValue|0V]명과 이야기함#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "당신이 #P +1#! 확언함"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "확언하지 않음"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "여기 이건 유지하고, 저건 빼도록 하자"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "잠깐, 안 돼. 이런. 진짜로?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "[char_current.GetHerHis] 어리석은 실수"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "모든 진술이 일관됨"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "자기 생각만큼 영리한 사람은 아니었음"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "당신보다 절반 정도는 더 영리했음"
 gdp_merchant_unity_contract.1011.learning.tt.success: "어디를 찾아봐야 할지 알았음"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "사방을 뒤져봤으나 아무것도 찾지 못했음"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: 성공!"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: 실패!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: 임무 무시함"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "[char_current.GetHerHis] 장부를 살펴보던 [char_current.GetTitledFirstName](이)가 불법 행위의 예시를 지적해 냈고, 기대했던 결과를 전혀 실현하지 못했거나 약속한 기준에도 미치지 못한 경비 지출을 발견했다."
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "나는 [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에서 우리 회사가 이룩한 좋은 평판은 물론, 부근의 명망 있는 사람들 사이에 널리 퍼진 사례에 대해 길게 이야기했다. 최근의 거래는 명백히 예외적인 경우이며, 상업을 위해서라면 반드시 일어나지 않게 막아야 한다."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "나는 최근의 어려움에 대해 두서없이 얘기하며 수도 없이 옆길로 샜고, 진실을 담은 세부 사항을 신중하게 여기저기 갖다 붙였다. 그러다가 거미줄처럼 짜인 거짓말에서 나조차 길을 잃을 정도가 되었다."
 gdp_merchant_unity_contract.1012.desc.method.learning: "우리는 대화를 나누며 하루를 #EMP 즐겁게#! 보냈다. [char_current.GetTitledFirstNamePossessive] [destination.GetBaronyNameExplicitly]에서의 사업 관련해서 상상할 수 있는 측면은 모두 얘기해 보았다. 어떠한 사항도 그냥 넘어가지 않았고, 모든 질문을 캐물었다."
 gdp_merchant_unity_contract.1012.desc.method.partner: "[partner.GetFirstName](이)가 질문을 주도했으며 [char_current.GetTitledFirstName](은)는 자리에 앉아 끝도 없이 쏟아지는 물음에 대답해야 했다. 처음에는 참을성 있는 모습이었지만 시간이 지나갈수록 그 인내심에도 한계가 온 듯했다."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "\"이 사안을 이해해 주시면 #EMP 참으로#! 고마울 것 같습니다.\" 나는 미소를 지으며 지갑으로 손을 뻗어 금화 몇 개를 탁자에 쏟아냈다. [char_current.GetSheHe|U]는 잠시 얼어붙은 채, 반짝이는 금속과 내 치켜 올라간 눈썹을 번갈아 바라보았다."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "\"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] 역시 이번 오해로 불편을 끼쳐드린 점에 대해 매우 안타깝게 생각합니다.\" 나는 조용히 말했다. \"제가 #EMP 개인적으로#! 그쪽의 손해를 보상해 드리지요.\""
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "그렇게 나는 할 수 있는 일을 다 했다. 이제 그만 이 일을 덮고 넘어갈 때다."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip](이)가 의미심장한 시선을 던지며 금화를 자기 쪽으로 가져갔다."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "[char_current.GetFirstNameNoTooltip](이)가 몹시 빠르게 분노하더니, 나더러 나가라는 듯이 문을 가리켰다."
 gdp_merchant_unity_contract.1012.desc.result.success: "요령을 부리고, 무역 상황이 얼마나 변덕스러운지에 대해 한탄하자 [char_current.GetFirstNameNoTooltip]도 내가 불일치 상황마다 대는 핑계를 천천히 이해해 갔다. 그래, 이건 다 장거리 상업의 슬픈 현실일 뿐이다."
 gdp_merchant_unity_contract.1012.desc.result.failure: "최선을 다했지만 [char_current.GetSheHe]는 내가 요점을 짚을 때마다 무시했다. 해결책을 내고 반박하거나, [char_current.GetHerHis] 경험에서 나온 예시를 제시하면서도 계속 불만스러운 태도였다."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "수풀 속에 있는 두 마리 새보다 손에 쥔 새 한 마리가 더 나은 법이다. 이 사람이 잘못된 방식으로 취득했을지도 모르는 이득 역시 그 손에 단단히 쥐어져 있었다. 덕분에 우리가 [char_current.GetHerHim]를 더 조사할 방법도 막혀 버렸지만."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "다음에도 행운이 우리와 함께하기를."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "다음에는 더 나은 성과를 거둘 수 있기를."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.GetSheHe|U]도 이건 뭐라고 못 하겠지."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "다음번에는 내 지갑을 지킬 수 있길..."
 gdp_merchant_unity_contract.1012.a: "다음은 [local_ruler.GetTitledFirstNameNoTooltip](이)다."
 gdp_merchant_unity_contract.1012.b: "다음, [person_c.GetTitledFirstNameNoTooltip](을)를 만나러 가자."
 gdp_merchant_unity_contract.1012.c: "[person_d.GetTitledFirstNameNoTooltip](이)가 기다린다..."
 gdp_merchant_unity_contract.1012.d: "이만 이 상황을 끝내자..."
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "계속해서 확언하려고 시도함"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "상황을 해결할 방법을 결정함"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: 해결"
 gdp_merchant_unity_contract.1021.desc.intro: "우리는 다시 한번 마을 광장에 모였다. [local_ruler.GetTitledFirstName](이)가 기대감에 가득 찬 고소인들과 내 무역상을 모아, 이번 사안에 대한 내 최종 의견을 들으려 하고 있었다.\n\n[person_c.GetFirstName](와)과 [person_d.GetFirstName](은)는 나를 바라보았고, [trader.GetFirstName](은)는 그들의 시선 아래에서 내가 도착한 이후 처음으로 초조해하고 있었다.\n\n내 직감에 따르면"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "지역 주민들은 확실히 내 편이 되었다."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "지역 주민들이 내 노력에 만족한 듯하다."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "어찌 되었든 나는 지역 주민들의 신뢰를 얻지 못했다."
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.GetTitleAsNameNoTooltip](이)가 하품했다. \"자, 그래서"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "그 사라진 배송은 어찌 된 거지?\""
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "그 품질이 형편없던 상품은 어찌 된 거지?\""
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "치르지 못한 대금은 어찌 된 거지?\""
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT 가능한 확언을 모두 했으므로, 당신의 넘치는 노력 덕분에 [trader.GetTitledFirstNameNoTooltip](을)를 처벌하지 않아도 $label_success_critical$을 거둘 수 있음#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT 충분한 확언을 했으므로, 당신의 노력 덕분에 [trader.GetTitledFirstNameNoTooltip](을)를 처벌하지 않더라도 $label_success_standard$을 거둘 확률이 높음#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT 충분한 확언을 하지 못했으므로, [trader.GetTitledFirstNameNoTooltip](을)를 처벌하지 않는다면 당신의 조잡한 노력으로 인해 저항이 발생할 수 있음#!"
 gdp_merchant_unity_contract.1021.a: "\"설명했다시피, 이건 안타까운 오해로 인한 문제입니다.\""
 gdp_merchant_unity_contract.1021.a.tt: "당신은 충분히 확언했다고 생각함"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "확언을 많이 한 경우"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "확언을 약간 했으며, 지역 주민이 받아들인 경우"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "확언을 하지 못했으며, 지역 주민의 반응이 좋지 않은 경우"
 gdp_merchant_unity_contract.1021.b: "세금을 납부하라. 반만."
 gdp_merchant_unity_contract.1021.b.tt: "[local_ruler.GetTitledFirstName]의 편을 들었으나 [trader.GetTitledFirstName]의 세금 부담을 줄여줌"
 gdp_merchant_unity_contract.1021.c: "\"이건 다 헛소리입니다. 비방에 헛소리라고요!\""
 gdp_merchant_unity_contract.1021.c.tt: "회사의 잘못이 없다고 딱 잘라 말함"
 gdp_merchant_unity_contract.1021.d: "\"[trader.GetTitledFirstNameNoTooltip](이)가 죄를 저질렀으며, 처벌해야 합니다.\""
 gdp_merchant_unity_contract.1021.d.tt: "회사를 위해 [trader.GetTitledFirstNameNoTooltip](을)를 희생함"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: 단순한 오해"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: 해결된 사안"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: 해결되지 못한 사안"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: 불만족"
 gdp_merchant_unity_contract.1022.desc.success_critical: "지역 주민들이 서로를 보며 기꺼이 고개를 끄덕였고, [trader.GetFirstName](은)는 환한 웃음을 지었다. [local_ruler.GetTitledFirstName](은)는 눈에 띄게 안심한 기색이었고, 놀란 것 같기도 했다. \"아주 좋군. 그렇다면 이번 사안은 해결된 것으로 하지!\" [local_ruler.GetSheHe]가 외쳤다.\n\n고소인들이 나한테 방문해 줘서 고맙고, 마음을 편하게 해 줘서 고맙다며 수많은 감사를 전했다. 회사는 이제 [destination.GetBaronyNameExplicitlyNoTooltip]에서 그 어느 때보다도 #EMP 큰#! 신뢰를 얻게 되었다."
 gdp_merchant_unity_contract.1022.desc.success_standard: "지역 주민들이 서로를 보며 무겁게 고개를 끄덕였고, [trader.GetFirstName](은)는 미소를 지었다. [local_ruler.GetTitledFirstName](은)는 머뭇거렸지만, 빠르게 상황을 넘겼다. \"좋다. 그렇다면 이번 사안은 해결된 것으로 봐야겠군.\" [local_ruler.GetSheHe]가 말했는데, 질문 같기도 했다.\n\n고소인들은 논의에 관해 이야기하며 만족스러운 얼굴이었다. [destination.GetBaronyNameExplicitlyNoTooltip]에서의 회사의 평판도 안전해진 듯하다. 일단은 말이다."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "잠시 긴장이 흐르는 동안, [local_ruler.GetTitledFirstName](와)과 [local_ruler.GetHerHis] 시종들이 내 빈약한 결론을 반박하려 하는 듯했다. 하지만 그 순간은 침묵 속에 가라앉았다.\n\n\"좋다...\" [local_ruler.GetTitleAsNameNoTooltip](이)가 한숨을 쉬며 불만이 가득한 고소인들을 바라보았다. \"다시는 이런 일이 벌어지지 않게 하도록.\"\n\n지역 주민들은 분명히 의심이 남은 눈치였지만, 이제 그건 [trader.GetFirstNamePossessive] 문제다."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "광장에 침묵이 내려앉았다.\n\n긴장과 어색함으로 가득한 정적이었다. 지역 주민들은 서로를 흘긋거렸고, 불만에 입을 찡그리며 거의 이를 드러내는 얼굴이 되었다.\n\n[local_ruler.GetTitledFirstName]도 으르렁거렸다. \"그게 다라고?\" 고소인들이 화를 내며 동의했다.\n\n초조해진 [trader.GetFirstNamePossessive] 목에서 침을 꿀꺽 삼키는 소리가 났고, 정적이 깨졌다. \"불편을 끼쳐 드려 정말 죄송합니다.\" [trader.GetSheHe]가 말했다. \"하지만 더 해 드릴 수 있는 게 없어요. 살다 보면... 이런 일도 일어나는 거잖습니까.\""
 gdp_merchant_unity_contract.1022.a: "더할 나위 없이 잘 풀렸군."
 gdp_merchant_unity_contract.1022.b: "끝이 좋으면 다 좋은 법..."
 gdp_merchant_unity_contract.1022.c: "거참, 더 잘 풀릴 수도 있었는데."
 gdp_merchant_unity_contract.1022.d: "어... 이만 가봐야겠다."
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: 부정"
 gdp_merchant_unity_contract.1023.desc: "고소인들은 말을 잃었고, 대신 화가 나서 속삭였다. [local_ruler.GetTitleAsName] 또한 여기서 더 어떻게 일을 끌어 나가야 할지 모르는 눈치였다.\n\n내가 말을 이어 나가자 [trader.GetFirstName]의 놀란 얼굴에 대담한 자부심이 차올랐다. \"우리 회사의 평판이 이런 하찮은 문제 때문에 진창으로 곤두박질치게 두지는 않을 겁니다.\"\n\n나는 고개를 높이 들었다. \"여기서 시간만 낭비했군요. [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에 급한 사업이 있건만!\""
 gdp_merchant_unity_contract.1023.a: "떠날 시간이다."
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: 짐마차 아래"
 gdp_merchant_unity_contract.1024.desc: "고소인들 사이에서 환호하는 소리가 터져 나왔다. 조금 놀란 기색의 [local_ruler.GetTitledFirstName](이)가 마을 경비대를 불러서 할 말을 잃은 [trader.GetFirstName](을)를 체포했다.\n\n\"자, 잠깐만요, [ROOT.Char.GetTitleAsNameNoTooltip]!\" 내 무역상이 외쳤다. 나는 느긋하게 손을 내저어 [trader.GetHerHim]를 치워 버렸다. 다행이군, 안 그래도 형편없는 무역상이었는데...\""
 gdp_merchant_unity_contract.1024.a: "꼭 필요한 희생이었다."
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: 고무적인 상재"
 gdp_merchant_unity_contract.1031.desc: "\"[ROOT.Char.GetTitledFirstNameNoTooltip]?\"\n\n장부를 보다가 고개를 들자... 이상하게 익숙해 보이는 [hopeful.GetCulture.GetName] [hopeful.GetWomanMan] 한 명이 있었다. 이 사람을 어디서 봤더라...\n\n\"저는 [hopeful.GetTitledFirstName](이)라고 합니다, [ROOT.Char.GetTitleAsNameNoTooltip]. 몇 년 전에 제 고향 [destination_1.GetBaseNameNoTier]에서 오해로 인한 문제를 처리해 주시지 않았습니까. 참으로 품위 있고 당당하게 해결해 주셨지요.\"\n\n\"그게, 제가 하던 사업이 망해 버려서 다른 일을 좀 찾고 있었습니다. 그래서 혹시... 저를 좀 받아주실 수 있을지...\""
 gdp_merchant_unity_contract.1031.a: "아주 좋다, 환영하지!"
 gdp_merchant_unity_contract.1031.b: "회사에는 자네가 필요 없다네."
