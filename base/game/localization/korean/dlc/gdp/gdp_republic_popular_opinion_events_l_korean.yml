l_korean:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "끓는 주전자"
 republic_popular_opinion_event.1001.desc: "요즘은 거리에서 파트리키라는 사실을 들켜 봤자 좋을 것이 없다.\n\n내 방황하는 눈빛과 걱정하는 표정을 알아본 [relation_01.GetName](이)가 외쳤다.\n\n\"망할, [ROOT.Char.GetFullName]. [event_location_01.GetName]의 파트리키는 외톨이처럼 다니지 않습니다. 자랑스러운 시민으로서 거리를 걸어 다녀야지요!\"\n\n[relation_01.GetSheHe|U]의 말이 맞다. 하지만 최근 들어 도시의 분위기는 긴장이 가득하다. 수면 아래에서 불만이 끓고 있다. 시위와 싸움이 도시에 만연하고, 어두워진 뒤에 무슨 일이 일어나고 있는지는 그저 상상에 맡길 수밖에 없다."
 republic_popular_opinion_event.1001.a: "\"맞는 말이군. 당당하게 고개를 들고 다녀야지.\""
 republic_popular_opinion_event.1001.b: "\"지금이야말로 경호원을 고용하기 좋을 때 같은데.\""
 republic_popular_opinion_event.1001.c: "\"폭도들이 우릴 다 죽일 걸세!\""
 republic_popular_opinion_event.1001.d: "\"나도 쉽게 당해주지는 않을 거다.\""
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "불만의 계절"
 republic_popular_opinion_event.1002.desc_1: "창문에 서 있자니 화난 목소리가 울려 퍼지는 게 들렸다. [event_location_01.GetName]에서 불만이 들끓고 있었다. 일꾼들은 도구를 내려놓고 일을 멈추거나 거리에서 행진하겠다며 위협한다. 정부의 상징은 어둠을 틈타 박살 나거나 파괴되고 있었다.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "돌아볼 때마다 시무룩한 얼굴, 방해, 숨죽여 중얼거리는 모욕이 나를 맞이했다."
 republic_popular_opinion_event.1002.desc_control_firm: "군중이 할 수 있는 일이라곤 반항을 상징하는 행위가 전부였다. 불법 집회가 일어날 조짐이 조금이라도 보이면 정부에서 가혹하고 효율적인 방식으로 진압하고 있으니까."
 republic_popular_opinion_event.1002.desc_control_strained: "다행히 소요 사태는 도시 경비대가 억제하고 있다. 주모자들은 매일 체포되어 차꼬에 묶인다. 혼란을 틈타 이득을 보려던 공모자들도 추적당하고 발각되었다. 지금은 질서가 유지되고 있다."
 republic_popular_opinion_event.1002.desc_control_slipping: "도시 경비대의 노력에도 불구하고 선동가들은 틈을 타 빠져나갔으며, 거리에 폭력이 만연하기 시작했다. 군중이 모여들었고, 그중에는 제때 해산시키지 못한 무리도 있었다. 밤은 폭력배와 불량배의 차지가 되었다."
 republic_popular_opinion_event.1002.desc_control_broken: "정부는 거리를 통제하지 못한다. 도시 경비대는 병영에 몸을 숨겼으며, 폭도가 궁전의 계단에서 파트리키를 괴롭히는 상황이다! 외국 공모자와 공작원이 있다는 소문도 널리 퍼졌다."
 republic_popular_opinion_event.1002.a: "난 정부를 지지한다!"
 republic_popular_opinion_event.1002.b: "내가 백성과 함께한다는 사실을 확실히 하겠다."
 republic_popular_opinion_event.1002.c: "이때는 조용히 있는 게 상책이지."
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "축제 정신"
 republic_popular_opinion_event.1003.desc: "[event_location_01.GetTitle.GetNamePossessive] 시장의 소란 속에서 [craftsman_character.GetName](이)라는 시민과 대화를 나눴는데, [craftsman_character.GetHerHis] 당나귀에 관한 농담 때문에 배를 잡고 웃었다.\n\n요즘에는 이 도시가 하나의 큰 가족처럼 느껴진다. 낯선 사람과 대화하는 일이 더 쉬워지고, 삶은 힘들어도 모두가 기분이 좋다. 당나귀가 즐겁게 울더니 나한테 자기 머리를 툭 갖다 댔다. \n\n\"요즘 평의회가 일을 참 잘하지 않습니까?\" [craftsman_character.GetFirstNameNoTooltip](이)가 그렇게 말하며 당나귀의 귀 뒤를 긁어 주었다. \"연회라도 열어서 축하하는 게 어떠십니까? 조합에서도 분명 힘을 보탤 텐데요. 좋은 인상도 남기고, 감사의 표시도 할 수 있을 테니까요.\""
 republic_popular_opinion_event.1003.a: "\"끝내주는 생각이로군!\""
 republic_popular_opinion_event.1003.b: "\"돈이 안 든다는 소린가?\""
 republic_popular_opinion_event.1003.c: "\"그보다는 그대에 관해 더 알고 싶은데.\""
 republic_popular_opinion_event.1003.tt: "당신의 다음 [feast|E] [activity|E] 비용이 #P 무료임.#!"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "야심 찬 기분"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName](와)과 나는 집 근처의 광장에서 [ROOT.Char.Custom('RegionalDrink')](을)를 마시며, 바쁘게 하루를 살아가며 일하는 시민들의 모습을 한가롭게 지켜보고 있었다. [relation_01.GetName](은)는 음료를 한 잔 마신 뒤 만족스럽게 한숨을 쉬었다.\n\n\"[ROOT.Char.GetFullName], 물 들어올 때 노를 저어야 하는 법입니다. 야망을 품는 거지요! 도시 분위기가 이렇게 좋으면 뭐든 할 수 있을 것 같단 말입니다.\" [relation_01.GetSheHe|U]가 잔을 들어 올리며 미소를 지었다. \"건배합시다. 새로운 기회와 넘쳐나는 돈을 위해서!\"\n\n나도 마주 웃으며 잔을 들어 올렸다."
 republic_popular_opinion_event.1004.a: "\"먼 곳으로 떠날 모험을 위해!\""
 republic_popular_opinion_event.1004.b: "\"새로운 사랑과 연애를 위해!\""
 republic_popular_opinion_event.1004.c: "\"명예와 영광을 위해!\""
 republic_popular_opinion_event.1004.d: "\"가족과 친구를 위해!\""
