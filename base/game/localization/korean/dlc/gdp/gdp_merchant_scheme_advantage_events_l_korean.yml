l_korean:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]: 발전 추진"
 gdp_merchant_scheme_advantage.1000.intro: "[task_contract_location.GetBaronyNameExplicitly]에서 우리의 사업을 더 빨리 완수할 방법을 고심하던 나는"
 gdp_merchant_scheme_advantage.1000.intro.rival: "경쟁자인 [rival.GetTitledFirstNamePossessive] 존재가 어떻게 우리를 방해하는지 알아보았다."
 gdp_merchant_scheme_advantage.1000.intro.partner: "내 동업자인 [portrait.GetTitledFirstName]에게서 해결책을 찾았다."
 gdp_merchant_scheme_advantage.1000.intro.agent: "내 사원인 [portrait.GetTitledFirstName]에게서 해결책을 찾았다."
 gdp_merchant_scheme_advantage.1000.intro.trader: "내 무역상 [portrait.GetTitledFirstName]에게서 해결책을 찾았다."
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\n[portrait.GetTitledFirstNameNoTooltip](이)가 진지하게 이 사안에 전력을 집중한다면, 이번 일을 금방 처리할 수 있을 텐데..."
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\n회사가 하나로 힘을 합치고 진정한 끈기를 발휘한다면, 이번 일을 금방 처리할 수 있을 텐데..."
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\n어쩌면 회사를 위해 내가 소매를 걷어붙이고 직접 일에 나서야 할 수도 있다. 그래야 다른 일로 넘어갈 수 있을 테니까..."
 gdp_merchant_scheme_advantage.1000.a: "\"[portrait.GetTitledFirstNameNoTooltip], 이러라고 돈 주는 줄 아나?!\""
 gdp_merchant_scheme_advantage.1000.a.flavor: "[associate_i|E] [portrait.GetTitledFirstNameNoTooltip](이)가 부담을 가짐"
 gdp_merchant_scheme_advantage.1000.b: "\"회사 전체가 더 분발해야 한다!\""
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] [company|E]가 부담을 가짐"
 gdp_merchant_scheme_advantage.1000.c: "\"좋다, 그냥 내가 하고 말지!\""
 gdp_merchant_scheme_advantage.1000.c.flavor: "[stress_i|E] 당신이 부담을 가짐"
 gdp_merchant_scheme_advantage.1000.d.associate: "\"자, [portrait.GetFirstNameNoTooltip](이)라면 더 할 수 있을 거다.\""
 gdp_merchant_scheme_advantage.1000.d.unity: "\"회사에 노는 사람만 가득하군!\""
 gdp_merchant_scheme_advantage.1000.d.stress: "\"내가 조금 더 일하면 되겠지...\""
 gdp_merchant_scheme_advantage.1000.e: "\"아, 집어치우자...\""
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName](와)과 나는 매일 마주 앉아 우리 목표에 더 가까워질 제일 나은 방법을 찾아 토론한다. 내 무역상이 [task_contract_location.GetBaronyNameExplicitly]에서 신뢰할 만한 인력이 부족하다는 점을 계속해서 지적했다.\n\n[trader.GetFirstNameNoTooltip](이)가 한숨을 쉬었다. \"그게, 우릴 도와줄 수도 있는 [recruit.GetWomanMan]이 있습니다."
 gdp_merchant_scheme_advantage.1010.desc.liege: "[recruit.GetFirstName](이)라는 사람인데, [recruit_liege.GetPrimaryTitle.GetDefinitiveName|l]의 [recruit_liege.GetTitledFirstName] 밑에서 일합니다...\""
 gdp_merchant_scheme_advantage.1010.desc.recruit: "[recruit.GetFirstName](이)라는 사람인데, 지역의 공모자이자 시장 해결사입니다...\""
 gdp_merchant_scheme_advantage.1010.a: "\"내가 그 사람하고 얘기해 보겠다...\""
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! 당신이 매력에 의존함"
 gdp_merchant_scheme_advantage.1010.b: "\"비용이 얼마가 들든 그 사람을 데려오라.\""
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! 당신이 돈에 의존함"
 gdp_merchant_scheme_advantage.1010.e: "\"하, 그럴 수고를 들일 만한 사람은 아니다.\""
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName](와)과 나는 매일 마주 앉아 우리 목표에 더 가까워질 제일 나은 방법을 찾아 토론한다. 결국 내 무역상은 우리의 [charter.GetName]에 대한 이야기를 꺼냈으며, 이것이 지금 우리를 향해 닫혀 있는 [task_contract_location.GetBaronyNameExplicitly]의 문을 여는 데 유용하리라는 얘기를 했다.\n\n[trader.GetFirstNameNoTooltip](이)가 미소를 지었다. \"어쨌든 [patron.GetTitledFirstNamePossessive] 서류니까 잘 활용하는 게 좋지 않겠습니까?\""
 gdp_merchant_scheme_advantage.1020.a: "\"그래, 우린 분명 [patron.GetTitleAsNamePossessiveNoTooltip] 지지를 등에 업고 있으니!\""
 gdp_merchant_scheme_advantage.1020.b: "\"우리 특허장은 따로 설명이 필요 없긴 하지.\""
 gdp_merchant_scheme_advantage.1020.e: "\"지금은 그럴 때가 아니다...\""
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "추진된 발전: 잠재력"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "해당 모략을 서두르려는 시도가 오히려 그 진전을 방해했습니다."
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "추진된 발전: 성장"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "추진된 발전: 국면"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "추진된 발전: 경쟁력"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "해당 모략을 서두르려는 시도가 무역 노력을 방해했습니다."
 gdp_merchant_scheme_advantage_outcome: "발전 추진"
 gdp_merchant_scheme_advantage.desc: "[opportunity|E] [scheme|E] [opportunities|E]를 추구"
 gdp_merchant_scheme_advantage_add_1_opportunity_tt: "[scheme|E]이 #P +1#! [scheme_opportunity_i|E][scheme_opportunity_opportunity|E] 획득"
 gdp_merchant_scheme_advantage_add_2_opportunities_tt: "[scheme|E]이 #P +2#! [scheme_opportunity_i|E][scheme_opportunity_opportunity|E] 획득"
 gdp_merchant_scheme_advantage_subtract_opportunity_tt: "[scheme|E]이 #N -1#! [scheme_opportunity_i|E][scheme_opportunity_opportunity|E] 상실"
 house_relation_reason_scheme_push_for_advantage_desc: "[char.GetShortUINameNotMe|U](이)가 [target_char.GetShortUINameNotMe](을)를 상대로 무역상의 이점을 추구했음"
