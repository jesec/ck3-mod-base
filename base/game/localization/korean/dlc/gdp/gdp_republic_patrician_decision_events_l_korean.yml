 custom_gp_weigh_house: "저울이 더럽혀지지 않게 유지할 수 있도록 공공 계량소 설립"
 custom_gp_improved_weigh_house: "공공 계량소 증축으로 공화국의 이익을 위한 보안 강화 진행"
 custom_gp_clock_tower: "시립 시계탑을 설립해 대중이 더 효율적으로 시간을 확인"
 custom_gp_improved_clock_tower: "시립 시계탑을 개선해 그 영광을 확장"
 custom_gp_civic_ward: "시정 관청을 건설해 도시에 예정된 건설을 확인"
