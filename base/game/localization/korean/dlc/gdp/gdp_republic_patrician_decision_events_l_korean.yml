 custom_gp_league_chapter_house: "연맹 지부 사무실을 설립해 연맹 회의 및 업무 처리 담당"
 custom_gp_improved_league_chapter_house: "연맹 지부 사무실을 향상해 외교 분야에서 더 편안한 회의를 진행"
 custom_gp_podesta_residence: "포데스타의 거주지를 건설해 지역 관료들의 수장을 위한 숙소 제공"
 custom_gp_improved_podesta_residence: "포데스타의 거주지를 개선해 지역 관료들의 수장을 위한 보상과 사기 제공"
 custom_gp_fountain: "대중에게 즐거움을 주고 도시의 영광을 돋보이게 하는 웅장한 분수"
 custom_gp_improved_fountain: "웅장한 분수를 향상해 거대한 수조와 송수로 추가"
 ##MODIFIERS
 gdp_opportunity_scheme_modifier: "뜻밖의 우연"
 gdp_opportunity_scheme_modifier_desc: "해당 모략은 성공을 향한 뜻밖의 기회를 마주했습니다."
 gdp_city_stroll_alms_modifier: "자선 행위"
 gdp_city_stroll_alms_modifier_desc: "해당 인물은 자신보다 불운한 이를 돌본 뒤 선의의 대상이 되었습니다."
 gdp_armchair_patrician_modifier: "방구석 파트리키"
 gdp_armchair_patrician_modifier_desc: "해당 인물은 도시 산책 대신 사무실에서의 업무를 선택했습니다."
 gdp_city_stroll_modifier: "아는 사람만 아는"
