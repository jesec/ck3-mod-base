l_korean:
 city_stroll_prefix: "도시 산책"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: 찾는 사람이 임자"
 gdp_republic_patrician_decision.1000.desc: "대로에서 벗어나 골목길로 접어드는 모퉁이를 돌았다. 그랬더니 지역 행상인이 이런 대화를 나누고 있었다.\n\n\"...근데 아무도 가지러 오질 않더라고.\" [local_character.GetWomanMan]이 [local_character.GetHerHis] 동행에게 어깨를 으쓱하고는 골목길에 어지럽게 널려 있는 [abandoned_trade_good.GetNameNoTooltip|l] 상자들을 가리켰다.\n\n아무도 앞으로 나서서 저 물건의 소유권을 주장하지 않았다. 나는 화물을 빠르게 훑어보았다. #EMP 기회로군#!."
 gdp_republic_patrician_decision.1000.a: "수요를 창출해 보는 게 어떨까..."
 gdp_republic_patrician_decision.1000.a.flavor: "[abandoned_trade_good.GetNameNoTooltip|l] 상자가 파손된 채 발견되었고, 그 내용물은 산산조각이 났다."
 gdp_republic_patrician_decision.1000.b: "\"아하, 이건 내 물건이라오!\""
 gdp_republic_patrician_decision.1000.c: "\"아, [liege_scope.GetTitledFirstNamePossessiveNoTooltip] 잃어버린 [abandoned_trade_good.GetNameNoTooltip|l] 아닌가! 고맙소.\""
 gdp_republic_patrician_decision.1000.d: "뭐, 내가 상관할 일은 아니니까."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: 정원에서의 하루"
 gdp_republic_patrician_decision.1010.desc: "숨겨진 오아시스를 찾아냈다. 다듬어지지 않은 진정한 원석이었다. [city_location.GetTitle.GetNameNoTier]의 구석과 골목 사이에 숨어 있는 작은 정원이다. 보행로는 예전에는 괜찮았을 테지만 지금은 많이 낡았다. 식물의 양도 적었지만 관리는 잘 되어 있었다. 아주 헌신적인 관리자의 보살핌을 받는 장소였다.\n\n귀족 무리뿐 아니라 상인, 평민, 일꾼들이 잠시 일에서 벗어나 녹색 풍경 속에서 짧은 휴식을 즐기고 있었다.\n\n정원을 한가로이 걷고 있으니 내 기분도 조금 가벼워졌고, 지고 있던 짐도 조금 더 견딜 만해졌다."
 gdp_republic_patrician_decision.1010.a: "여길 [city_location.GetTitle.GetNameNoTierNoTooltip] 최고의 정원으로 만들어야겠다!"
 gdp_republic_patrician_decision.1010.b: "보자, 이 작은 식물은 뭐지?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "흥미로운 식물을 발견함"
 gdp_republic_patrician_decision.1010.b.health_plant: "유익한 약초를 발견함"
 gdp_republic_patrician_decision.1010.c: "어디... 약간만 더 자유로워져 볼까..."
 gdp_republic_patrician_decision.1010.c.flavor: "편하게 쉬어 버린다. 마음이 정말 편하군!"
 gdp_republic_patrician_decision.1010.c.success: "당신이 들키지 않음"
 gdp_republic_patrician_decision.1010.c.failure: "당신이 들킴"
 gdp_republic_patrician_decision.1010.d: "정말 즐겁군!"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: [city_location.GetTitle.GetNameNoTierNoTooltip]의 대광장"
 gdp_republic_patrician_decision.1020.intro: "[city_location.GetCounty.GetTitle.GetAdjective] 귀족과 영주 사이에서 어떤 정치와 모략이 흘러가든, 대광장의 일상은 계속된다."
 gdp_republic_patrician_decision.1020.intro.01: "주방이 뜨겁게 타오르며 갓 만든 [ROOT.Char.Custom('GetLocalStreetFood')]의 맛있는 냄새가 코를 가득 채웠다."
 gdp_republic_patrician_decision.1020.intro.02: "반항적인 당나귀가 주인을 향해 크게 울었다. 주인은 당나귀에게 맹렬한 기세로 물을 뿌리며 두껍게 떡이 진 진흙을 씻어내려 하고 있었다."
 gdp_republic_patrician_decision.1020.intro.03: "나이 든 시민 여럿이 주위를 걸어 다니며 빵 가격과 오늘날 젊은이들의 오만함을 두고 불평하고 있었다."
 gdp_republic_patrician_decision.1020.intro.04: "[ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l] 무리가 둥글게 날아다니며 현지 음식 가판대를 굶주린 눈으로 주시하고 있었다."
 gdp_republic_patrician_decision.1020.intro.rain: "오늘 아침의 풍경에서는 어제 지나간 폭풍우의 흔적이 엿보였다."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\n저 너머에 [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip] 사람이 아닌 병사 무리가 보였다. 뭔가 장소를 잘못 찾아온 것 같고, 시선도 불안했다. 가끔 열기를 띠며 치닫는 저들의 토론 내용을 들어 보니, 새로운 후견자도 찾고 있는 모양이었다."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\n광장 가장자리에서는 거칠어 보이는 인물이 음침한 눈길로 지나가는 사람들을 바라보고 있었다. 가까이 가 보니, 이 사람이 최근 명망 있는 [liege_scope.GetHouse.GetBaseName]의 상인 계약을 종료하게 되었다며 한탄하는 소리를 들을 수 있었다. 존경받던 무역상의 운이 바닥난 걸까?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\n광장 가운데로 가니 한 의사가 쌓아 놓은 상자 위에서 체액에 대해 설교하고, 흑담즙의 균형을 더 쉽게 맞추는 방법에 관한 강의를 마무리하고 있었다. 나는 머뭇거리며 동의하듯 고개를 끄덕였다.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\n광장의 그늘진 모퉁이에 있는 가판대에서 완벽한 [ROOT.Char.Custom('RandomMediumObject')] 하나를 발견했다. 내 [scheme_to_boost.GetName|l] 모략에 분명 도움이 될 만한 물건이었다...$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\n광장을 내다보던 나는 뭔가 반짝이는 것을 발견했다. 어디서 나온 빛인지 찾아보려고 눈을 가늘게 뜬 채 바닥을 살펴보던 찰나, 흙에 거의 파묻히다시피 한 작은 보석 하나가 보였다.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\n광장 건너편에서 불운한 처지에 놓인 농노들이 부지 밖으로 호송되고 있었다. 어린아이 하나가 굶주림과 두려움에 가슴이 찢어지는 듯한 소리로 울기 시작했다. 구경꾼들은 최선을 다해 이 비참한 행렬을 못 본 척하고 있었다."
 gdp_republic_patrician_decision.1020.outro: "\n\n내 시종이 은근하게 목을 가다듬었다. 이제 집으로 가서 내 다른 책무에 전념할 시간이었다."
 gdp_republic_patrician_decision.1020.a: "한두 사람 정도는 먹여 살릴 수 있을 거다."
 gdp_republic_patrician_decision.1020.b: "저 병사들이 쓸모가 있겠군..."
 gdp_republic_patrician_decision.1020.c: "흠, 능숙한 무역상이라면 항상 필요하긴 하지..."
 gdp_republic_patrician_decision.1020.d: "저 의사는 날 위해 일해야 한다."
 gdp_republic_patrician_decision.1020.e: "일 먼저 하고, 산책은 나중에 하자."
 gdp_republic_patrician_decision.1020.f: "이것만 좀 닦아낼까..."
 gdp_republic_patrician_decision.1020.g: "볼 곳도 많고, 만날 사람도 많군!"
 gdp_republic_patrician_decision.1020.g.alternate: "이렇게 [GetPlayer.GetCapitalLocation.GetNameNoTooltip]의 하루가 또 지나간다."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: [city_location.GetTitle.GetNameNoTierPossessiveNoTooltip] 항만"
 gdp_republic_patrician_decision.1030.desc: "지역 항만으로 다가가자 생선과 썩어가는 해초 냄새가 점점 진해졌다. 어부, 어머니와 어린아이를 포함한 그 가족, 거기다 길고양이 무리까지 모두가 이 구역을 돌아다니며 일상을 보내고 있었다.\n\n걸어가는데 어부 두 명이 한탄하는 소리가 들렸다. \"...새 낚싯바늘은 장만했지. 그래도 새 그물만 있다면 할 수 있는 게 정말 많은데...\" 이들은 내가 있다는 사실을 눈치채자 조용해졌다."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\n나는 콧노래를 부르며 고개를 끄덕였다."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\n나는 콧노래를 부르며 고개를 끄덕였다. 길고양이가 내 다리에 몸을 붙이며 큰 소리로 골골거리고 있었다."
 gdp_republic_patrician_decision.1030.a: "\"날 설득해 보면 새 그물을 구해다 줄 수 있을지도 모르지...\""
 gdp_republic_patrician_decision.1030.a.flavor: "#EMP 그물로#! 이득을 볼 수도 있겠군!"
 gdp_republic_patrician_decision.1030.b: "\"그 생선을 대량으로 구매하면 가격은 어떻게 되나?\""
 gdp_republic_patrician_decision.1030.c: "고양이다!"
 gdp_republic_patrician_decision.1030.d: "\"날이 참 좋군.\""
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')]"
 gdp_republic_patrician_decision.1040.desc: "느긋하게 산책하던 나는 대광장에서 [liege_scope.GetTitledFirstNamePossessive] 최신 설치물과 마주했다. [ROOT.Char.Custom('GetGreatProjectDescription')](이)다.\n\n그런데 작업반장이 약간 곤란한 상황인 듯했다. [local_character.GetSheHe]는 이름과 인장이 있는 문서를 계속 바라보며 머리를 긁적이고 있었다. \"이... 관대한 기부자의... 인장 조각이 떨어져 나갔는데... 대체 누가 보낸 걸까, 흠...\"\n\n사업에 이름이 없는 성금이 있다? #EMP 흥미롭군.#!"
 gdp_republic_patrician_decision.1040.a: "\"내 성금이오! 우리가 한 거요!\""
 gdp_republic_patrician_decision.1040.a.success: "공로를 자신이 차지함"
 gdp_republic_patrician_decision.1040.a.failure: "당신이 발각됨"
 gdp_republic_patrician_decision.1040.b: "\"[liege_scope.GetTitledFirstNamePossessiveNoTooltip] 성금이오! 멋지군!\""
 gdp_republic_patrician_decision.1040.c: "뭐, 이건 내가 상관할 일은 아니니까."
 gdp_republic_patrician_decision.1040.c.flavor: "알아서 잘 해결하겠지."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')](이)가 [contribution_to_fund.GetName](을)를 획득함"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: 출발 실패"
 gdp_republic_patrician_decision.1100.desc: "나는 서재를 떠나 [city_location.GetTitle.GetNameNoTierPossessive] 멋진 거리로 산책을 나서기 전에, 마지막으로 내 주머니를 가볍게 두드려 보았다.\n\n그런데 이마가 문에 긁히며 묵직한 #EMP 쿵#! 소리가 났다. 이 망할 문이 #EMP 꼼짝하질 않는다#!! 팽창해서 끼었나?\n\n방을 둘러보니 창문이 있기는 했다. 하지만 저기서 떨어지면 분명히 뼈가 부러질 것이다.\n\n나는 생각해 보았다."
 gdp_republic_patrician_decision.1100.a: "\"거기 누구 없나? 경비병? 여봐라?!\""
 gdp_republic_patrician_decision.1100.a.flavor: "아니, 벽이 좁혀오진 않는다. 그럴 리가... 없겠지?"
 gdp_republic_patrician_decision.1100.b: "창문 아래에 충격을 완화할 방석을 많이 깔아두자!"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "몸이 운동하고 싶어서 안달이 났군!"
 gdp_republic_patrician_decision.1100.d: "그러면... 그냥 책상으로 돌아가야겠다."
 ##CUSTOM LOC
 custom_gp_expand_great_plaza_name: "거대 광장"
 custom_gp_expand_great_plaza: "광장의 확장"
 custom_gp_loggia: "공동 로지아를 건설해 상인과 공증인 모두에게 세련된 휴식처 제공"
 custom_gp_improved_loggia: "공동 로지아를 개선해 추가 사무 공간과 장소 창출"
 custom_gp_statute_hall: "법령 전당을 설립해 도시의 법과 질서를 유지"
 custom_gp_improved_statute_hall: "법령 전당을 확장해 보관소와 관료들의 편의 시설 증대"
 custom_gp_council_chamber: "대의회장을 건설해 도시 행정의 흐름을 원활하게 진행"
 custom_gp_improved_council_chamber: "대의회장을 개선해 의자와 편의 시설 추가"
 custom_gp_debt_office: "공공 채무 관리소를 설립해 도시의 국고 균형 유지"
 custom_gp_improved_debt_office: "공공 채무 관리소의 역량을 향상해, 국고의 흐름을 정상적으로 유지할 수 있도록 견제와 균형을 강화"
 custom_gp_civic_hospital: "시민들이 필요할 때 치료받을 수 있는 시립 병원 설립"
