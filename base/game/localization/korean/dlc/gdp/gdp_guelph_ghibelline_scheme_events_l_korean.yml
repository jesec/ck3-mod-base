l_korean:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]: 잃어버린 것"
 gdp_guelph_ghibelline_scheme.1000.desc: "나는 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]의 연례 축제에 왔다. 사방에서 기쁨과 동지애가 느껴졌다.\n\n떠들썩한 축제의 소란, 밝은색 천 장식과 맛있는 [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] 요리의 냄새가 거리에 가득했다. 지친 내 감각에도 단비 같은 광경이었다.\n\n그러다 우연히 근처 시장 가판대를 둘러보고 있던 [target.GetTitledFirstName](와)과 마주쳤다. 내 매력을 뽐낼 기회가 생긴 것이다."
 gdp_guelph_ghibelline_scheme.1000.a: "\"그러고 보니 #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]#!에서 이런 축제를 금지하려고 했다던데.\""
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "[ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')]의 악의를 성공적으로 입증함"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName](이)가 당신을 무시함"
 gdp_guelph_ghibelline_scheme.1000.b: "\"이 핀이 자네한테 정말 잘 어울리겠는데!\""
 gdp_guelph_ghibelline_scheme.1000.c: "내가 개입할 필요는 없지."
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]: 소문에 따르면..."
 gdp_guelph_ghibelline_scheme.1010.desc: "내 정보원에 따르면 우리의 #EMP 존경받는#! [ROOT.Char.Custom('GetGuelphGhibelline')] 지도자인 [target.GetTitledFirstName](이)가 최근 들어 부담을 느끼는 모습을 보였다. 힘든 책무의 무게로 버거워하는 듯하다.\n\n우리의 지지자들에게 적절한 서신 몇 통을 보내면 그 인상을 굳힐 수 있고, 이 짐을 지기에 더 #EMP 적합한#! 인물을 제안할 수도 있을 것이다."
 gdp_guelph_ghibelline_scheme.1010.a: "서신을 당장 작성한다."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "성공 확률은 당신의 @gg_involvement_icon! [gg_involvement|E]에 영향을 받음 (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "당신의 서신으로 많은 [ROOT.Char.Custom('GetGuelphsGhibellines')](이)가 당신의 우월한 지도력을 확신함"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "당신의 서신이 대의에 득보다 실이 됨"
 gdp_guelph_ghibelline_scheme.1010.b: "[ROOT.Char.GetHouse.GetName] 집안 사람이라면 누구든 위대한 지도자가 될 것이다!"
 gdp_guelph_ghibelline_scheme.1010.c: "그게 사실이라는 증거가 어디 있지?"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]: 달변"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "내 공모자 [court_agent.GetTitledFirstName](이)가 [target.GetTitledFirstNamePossessive] 궁정에서 멸시받는 궁정 신하들과 반체제 인사들의 귀를 사로잡은 듯하다."
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "내 공모자 [court_agent.GetTitledFirstName](이)가 [target.GetTitledFirstNamePossessive] 지도력에 불만을 가진 [target.Custom('GetGuelphsGhibellines')] 인물들의 공감을 얻은 듯하다."
 gdp_guelph_ghibelline_scheme.1020.intro: "내 공모자 [court_agent.GetTitledFirstName](이)가 [target.GetTitledFirstName]의 귀를 사로잡은 듯하다."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\n최근 들어 [court_agent.GetTitledFirstNameNoTooltip](와)과 서신을 주고받아야 했는데 늦어지고 있다. 혹시"
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "현지 선동가들을 끌어들여 우리 계획을 더 진행해야 할까?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "[court_agent.GetHerHim]한테 [target.GetFirstNameNoTooltip]에 대한 저들의 의심을 부추기라고 해야 할까?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "이를 기회로 [court_agent.GetHerHim]한테 [target.GetTitleAsNameNoTooltip] 앞에서 [ROOT.Char.Custom('GetGuelphsGhibellines')](을)를 옹호하라고 해야 할까?"
 gdp_guelph_ghibelline_scheme.1020.a: "대신 내 노력을 들인다."
 gdp_guelph_ghibelline_scheme.1020.b: "이... 불한당들을 활용해 보자."
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.GetTitledFirstNameNoTooltip]도 제 몫은 할 줄 알아야지."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName](이)가 당신의 계획을 성공적으로 진행함"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName](이)가 설득하지 못함"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U]는 내 평판에 집중해야 한다."
 gdp_guelph_ghibelline_scheme.1020.prestige: "실추된 위신"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "당신의 위신이 다소 실추되었습니다."
 gdp_guelph_ghibelline_scheme.1020.piety: "실추된 신앙도"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "당신의 신앙도가 다소 실추되었습니다."
 gdp_guelph_ghibelline_scheme.1020.e: "내 독실함은 이미 증명되었다!"
 gdp_guelph_ghibelline_scheme.1020.f: "관여하지 말자."
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]: 바퀴에 기름칠"
 gdp_guelph_ghibelline_scheme.1030.desc: "어느 날 아침, 돌아보던 중에 오랫동안 나와 함께했던 수행원 하나가 서둘러 다가왔다.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], [target.GetTitledFirstNamePossessive] 궁정의 정보원에 따르면 [target.GetTitleAsNameNoTooltip]의 [ROOT.Char.Custom('DescribeTargetSkill')] 실력이 꽤 어설프다고 합니다.\n\n혹시 이 상황을 우리한테 유리하게 활용할 수 있지 않겠습니까...?\""
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "어느 날 아침, 돌아보던 중에 내 [ROOT.Char.Custom2('RelationToMe', sly_character )] [sly_character.GetTitledFirstName](이)가 몰래 다가왔다.\n\n\"[target.GetPrimaryTitle.GetDefinitiveName](을)를 어리석은 [target.Custom('GetGuelphsGhibellines')]의 손아귀에서 #EMP 구하려는#! 우리 계획에 관한 일인데, [target.GetTitledFirstName]의 [ROOT.Char.Custom('DescribeTargetSkill')] 실력을 문제 삼는 게 어떻습니까?\n\n제가 듣기론 [target.GetSheHe]가 그쪽 방면에서 꽤 뒤떨어진다고 하던데.\""
 gdp_guelph_ghibelline_scheme.1030.a: "\"노력이 소문을 이길 것이다.\""
 gdp_guelph_ghibelline_scheme.1030.a.tt: "성공 확률은 당신의 @gg_involvement_icon! [gg_involvement|E]에 영향을 받음 (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "당신이 [target.GetShortUIName](을)를 약화함"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "당신의 노력이 헛수고로 끝남"
 gdp_guelph_ghibelline_scheme.1030.b: "\"이를 활용해 [target.GetHerHim]를 자기 궁정에서 약화해야겠다.\""
 gdp_guelph_ghibelline_scheme.1030.c: "\"이 소문을 더 키우자.\""
 gdp_guelph_ghibelline_scheme.1030.d: "\"그럴 이유는 없는 것 같군.\""
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.1262.desc: "큰 성공을 거뒀다! [target.GetTitledFirstName|U](이)가 마침내 사리를 분별했으며, 이제는 진정한 [owner.Custom('GetGuelphGhibelline')](이)가 되어 우리와 함께 선다.\n\n이 사람이라면 언젠가는 마음을 바꿀 줄 알았다니까."
 scheme_critical_moments.1262.a: "훌륭하다!"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.1263.desc: "#EMP 세상에는 별별 사람이 다 있다.#! 모두 실망하고 있다. 하지만 내가 아무리 설득하고, 토론하며 구슬리려 해도 [target.GetTitledFirstName](은)는 이 논쟁에서 옳은 쪽이 [target.Custom('GetGuelphsGhibellines')](이)라고 주장한다.\n\n말할 필요도 없겠지만, 이번에는 우리가 원만하게 헤어질 수 #EMP 없었다#!."
 scheme_critical_moments.1263.a: "#EMP [owner.Custom('InsultNounDumb')]#!!"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.1272.desc: "축하해야겠다! [owner.Custom('GetGuelphsGhibellines')]들이 하나씩 [target.GetTitledFirstName](을)를 향한 지지를 철회하고, 대신 내 인도를 따르고 있다.\n\n이제 [target.GetSheHe|U]도 물러나는 수밖에 없을 것이다."
 scheme_critical_moments.1272.a: "멋지군!"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.1273.desc: "우리의 노력에도 불구하고, [target.GetTitledFirstName](은)는 여전히 [owner.Custom('GetGuelphsGhibellines')]의 선두를 차지하고 있다. 내가 간신히 모았던 지지 세력마저 힘을 잃고 사라져 버렸다."
 scheme_critical_moments.1273.desc.secret: "\n\n그나마 [target.GetSheHe]가 아직 내 계획을 전혀 모르니 다행이군."
 scheme_critical_moments.1273.desc.discovered: "\n\n게다가 [target.GetSheHe]는 이 계획의 배후가 나라는 것까지 안다. 이 사실을 쉽게 잊어 줄 리는 없겠지."
 scheme_critical_moments.1273.a: "쯧, 쯧."
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.1282.desc: "큰 성공을 거뒀다! [target.GetTitledFirstName|U](이)가 마침내 사리를 분별했으며, 이제는 진정한 [owner.Custom('GetGuelphGhibelline')](이)가 되어 우리와 함께 선다.\n\n이 사람이라면 언젠가는 마음을 바꿀 줄 알았다니까."
 scheme_critical_moments.1282.a: "훌륭하다!"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.1283.desc: "#EMP 세상에는 별별 사람이 다 있다.#! 모두 실망하고 있다. 하지만 내가 아무리 설득하고, 토론하며 구슬리려 해도 [target.GetTitledFirstName](은)는 이 논쟁에서 옳은 쪽이 [target.Custom('GetGuelphsGhibellines')](이)라고 주장한다.\n\n말할 필요도 없겠지만, 이번에는 우리가 원만하게 헤어질 수 #EMP 없었다#!."
 scheme_critical_moments.1283.a: "#EMP [owner.Custom('InsultNounDumb')]#!!"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: 성공"
 scheme_critical_moments.1292.desc.intro: "멋진 소식이다. [target.GetTitledFirstName|U](이)가 훨씬 더 인자한 [target_character.GetTitledFirstName](으)로 교체된다고 한다!"
 scheme_critical_moments.1292.desc.intro.unknown: "멋진 소식이다. [target.GetTitledFirstName|U](이)가 대의에 충실한 적임자로 교체된다고 한다!"
 scheme_critical_moments.1292.desc: "\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')]에게는 정말로 명예로운 일이다. [target.GetPrimaryTitle.GetDefinitiveName](은)는 정당하고 올바르게 다스릴 테니, 이제 우리도 안심할 수 있게 되었다."
 scheme_critical_moments.1292.desc.discovered: "\n\n하지만 내가 개입했다는 사실이 드러나기는 했다. 그러니 앞으로는 나도 조심해야겠지..."
 scheme_critical_moments.1292.a: "옳소! 옳소!"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: 실패"
 scheme_critical_moments.1293.desc: "아무리 계획을 잘 세워도...\n\n#EMP 꼭 망치는 사람이 나타나기 마련이다.#! 그게 누군지는 알아내야 하겠지만, 일단 이번에는 [target.GetTitledFirstName](이)가 내 손아귀에서 빠져나갔다. 당분간은 망상에 빠진 [target.Custom('GetGuelphGhibelline')](이)가 [target.GetPrimaryTitle.GetDefinitiveName](을)를 다스리는 모습을 더 참아줘야 할 것 같다."
 scheme_critical_moments.1293.a: "#EMP 젠장#!!"
