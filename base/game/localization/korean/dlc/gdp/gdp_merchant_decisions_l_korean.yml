 gdp_decision.2000.t: "$forge_charter_decision$"
 gdp_decision.2000.desc: "창의적인 필체와 인장, 봉랍, 그리고 다른 관청의 격식들을 교묘하게 흉내 낸 끝에, 실로 감탄을 자아낼 정도의 작품이 이 파렴치한 위조범의 손끝에서 탄생했다.\n\n감히 말하건대, 이런 문서에 익숙한 관련자의 눈조차 속일 수 있을 것이다. 물론 너무 자세히 들여다보지만 않는다면..."
