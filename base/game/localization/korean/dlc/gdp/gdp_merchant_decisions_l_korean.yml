 gdp_decision.3000.opening: "[new_patron.Custom2('AppropriateGreetingPositive', new_client)]"
 gdp_decision.3000.desc: "나는 그대와 같이 존경받고 부지런한 상인들이 [new_patron.GetPrimaryTitle.GetDefinitiveName]에 와 주기를 바란다.\n\n그 대가로 그대가 우리 시장에서 우대받을 수 있도록 보장하겠다."
 gdp_decision.3000.a: "@move_company_icon! [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]에서의 장사는 이제 끝이다."
 gdp_decision.3000.b: "우린 어디로도 가지 않을 것이다!"
