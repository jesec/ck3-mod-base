 gdp_decision.3000.c.tt: "앞으로 누구도 [company|E] 이전을 권유하지 않게 됨"
 gdp_sponsor_merchant_company_decision: "상인 후원"
 gdp_sponsor_merchant_company_decision_desc: "무역이란 본디 손을 더럽히는 일이며, 나처럼 고상한 사람이 직접 나설 만한 일은 아니다. 하지만 궁정에 나의 전속 상인이 되어 무역을 대신해 줄 사람 하나쯤은 있지 않겠는가?"
 gdp_sponsor_merchant_company_decision_tooltip: "당신의 [courtiers|E] 중 한 명에게 자금을 지원하여 [merchant|E] [company|E]를 설립하게 하고, 설립과 동시에 해당 인물을 당신의 [client|E]로 삼음"
