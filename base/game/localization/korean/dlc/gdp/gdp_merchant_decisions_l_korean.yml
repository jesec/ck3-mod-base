 gdp_decision.3010.t: "[sponsored_courtier.GetNameNoTooltip]의 회사에서"
 gdp_decision.3010.desc: "\"제게 이런 중책을 맡겨 주시다니 영광입니다! 주군의 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] 하나도 허투루 쓰지 않겠습니다!\"\n\n[sponsored_courtier.GetNameNoTooltip](은)는 열의에 차 보인다. 이 방에 들어오기 전까지만 해도 내 신임을 받는 상인이 되리라고는 꿈에도 몰랐을 텐데 말이다.\n어쩌면 평생의 포부를 이루는 것보다 초기 투자금을 받아 자기 회사를 차릴 수 있다는 사실에 더 마음이 끌리는 것인지도 모르겠다."
 gdp_decision.3010.a: "회사를 꾸려 나갈 만큼은 주겠다."
 gdp_decision.3010.b: "기본 경비는 모두 주마."
 gdp_decision.3010.c: "상당한 자본금이 있다면 성공은 보장되겠지."
 gdp_decision.3010.d: "돈은 얼마든지 써도 좋다!"
 gdp_decision.3010.e: "좀 더 생각해 보도록 하지."
