 craft_artifact_desc: "[company|E] [domicile_artifact|E]을 제작하려 시도합니다."
 craft_artifact_desc_general: "$craft_artifact$ [scheme|E]은 당신과 당신의 [company|E]가 완전히 새로운 [domicile_artifact|E]을 제작하려 시도하는 [personal_scheme|E]입니다. 이 모략의 성공 여부는 자신의 [Concept( 'stewardship', '관리력' )|E]에 따라 갈립니다.\n\n[success_chance|E]에 영향을 주는 요소는 무수히 많지만, 주로 당신의 [stewardship_skill|E], 당신의 $antiquarian_merchant$의 [aptitude|E]에 영향을 받습니다."
 CRAFT_ARTIFACT_SUCCESS_DESC: "새로운 [domicile_artifact|E] 제작"
