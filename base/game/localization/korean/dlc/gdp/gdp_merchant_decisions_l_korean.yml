 craft_artifact_scheme.1000.t: "$craft_artifact$: 성공"
 craft_artifact_scheme.1000.intro.curio: "나는 옆에 사원이나 지역 조합원을 낀 채 공방에서 수많은 밤을 보내며 이것저것 만들어 보았다."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\n하지만 오늘, 그 모든 노력이 드디어 결실을 보았다! 작품을 보니 흔적마다 내 노력이 묻어 있었다. 그 모습을 보자 저절로 미소가 지어졌고, 이제 이걸 어디다 자랑스럽게 전시할지에 대한 생각만 들었다."
 craft_artifact_scheme.1000.intro.library: "나는 서재에서 수많은 밤을 보냈다. 잉크로 얼룩진 손에서 근육통이 느껴졌지만, 심지가 다 타들어 가는 동안에도 계속해서 글을 써 내려갔다."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\n하지만 오늘, 그 모든 노력이 드디어 결실을 보았다! 작품을 보니 구절마다 미소가 지어졌다. 이제 다른 사람들이 내가 휘갈겨 쓴 글을 읽게 된다는 생각밖에 들지 않았다."
 craft_artifact_scheme.1000.desc.curator: "\n\n작품을 살펴보던 내 유물 담당관 [curator.GetFirstNamePossessive] 눈이 빛났다. \"이건 #EMP 진정한#! 업적입니다, [ROOT.Char.GetTitleAsNameNoTooltip].\""
 craft_artifact_scheme.1000.a: "노력할 만한 가치가 있었군."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\n[ROOT.Char.GetPrimaryTitle.GetName|l]의 [ROOT.Char.GetTitledFirstName](이)가 제작했습니다."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\n[ROOT.Char.GetPrimaryTitle.GetName|l]의 [ROOT.Char.GetTitledFirstName](이)가 썼습니다."
 craft_artifact_scheme.2000.t: "$craft_artifact$: 실패"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\n내 구상을 현실로 만들어내려고 시도할 때마다 잘못된 계산이나 오해로 계획이 어긋났다. 방은 다시 고칠 수도 없는 버려진 시도의 잔해로 가득 차게 되었다..."
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\n쓰다 버린 종이가 아침마다 바닥을 가득 채웠고, 그나마 보관해 둔 얼마 안 되는 글도 이런저런 이유로 인해 내 의도를 폭넓게 담아내지 못하고 있었다..."
 craft_artifact_scheme.2000.desc.curator: "\n\n내 유물 담당관 [curator.GetFirstName](이)가 내 노력의 빈약한 결과를 살펴보다 한숨을 쉬었다. \"이제 패배를 인정할 때가 된 게 아닐까요?\""
 craft_artifact_scheme.2000.a: "이 짓도 이젠 질리는군..."
 craft_artifact_scheme.2000.b: "...내 노력을 헛수고로 만들 수는 없다!"
