l_korean:
 gdp_repudiate_usurious_loan_decision: "고리대금업 규탄"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip](이)가 공개적으로 이자를 붙인 대출 계약서를 작성했으며, 우리 [ROOT.Char.GetRite.PriestNeuterPlural]들은 이러한 계약이 그 누구도 구속할 수 없다고 본다. 그러니 이 빚을 갚는 대신 탕감되게 하자.\n\n이는 절도 행위가 아니다. [ROOT.Char.GetRite.GetAdjectiveNoTooltip] 법이다. 하지만 이곳과 바다 사이의 모든 상인은 이를 절도라 부를 것이다."
 gdp_repudiate_usurious_loan_decision_tooltip: "당신의 [clergy|E]가 채무를 [usury|E]으로 간주해 무효화하고 당신이 [gold|E]를 갖게 되지만, 대신 [merchants|E]들 사이에서 당신의 평판을 잃게 됨"
 gdp_repudiate_usurious_loan_decision_confirm: "죄악으로 맺어진 계약은 나를 구속할 수 없다!"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "이 [loan|E]을 상환할 여유가 없음"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "최근에 [creditor|E]를 규탄하지 않음"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X [merchants|E]들이 당분간 당신에게 신용을 줄 가능성이 낮아짐#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "당신의 [rite|E]가 대출을 죄악으로 간주해야 하며, 당신과 같은 [faith|E]의 [clergy|E] 영주가 이를 무효화할 수 있을 만큼 가까워야 함. 해당 영주는 당신과 [rite|E]가 같고, 당신의 [creditor|E] 또는 [rival|E]가 아니며, 당신과 전쟁 중이 아니어야 함\n#weak 당신의 [head_of_faith|E], 당신의 수도 [clerical_region|E] 또는 당신 위치의 소유주, 또는 당신의 [top_liege_possessive|E] 봉역에 있는 [clergy|E]#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "당신의 [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E](이)가 당신을 지지해야 함. 당신에 대한 #P 긍정적인#! [opinion|E]을 보유하거나, [strong_hook|E]이 있는 당신의 [puppet|E]여야 함"
 become_merchant_decision: "상인 되기"
 become_merchant_decision_desc: "사람의 풍습을 알지 못한다면 궁정에서의 직위가 무슨 소용이 있겠는가? 해외로 여행하여 봉역을 잇는 자가 되고자 하는 욕망이 너무 강해서 도저히 무시할 수 없다."
 become_merchant_decision_tooltip: "[titles|E]를 철회하고 [merchant|E] [company|E]를 설립함"
 become_merchant_decision_confirm: "지금이 거래할 때다!"
 become_merchant_decision_house_head_tt: "당신이 [house_head|E]이어야 함"
 gdp_recently_became_adventurer_decision_cooldown_tt: "당신이 #V 5년#! 동안 [adventurer|E]였음"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U](이)가 더 이상 [repudiated_lender.GetShortUIName]에게 대출금을 빚지지 않게 됨"
 abuse_charter_authority_decision: "특허장 권한 남용"
 abuse_charter_authority_decision_tooltip: "당신의 [charter|E]을 사용하여 [gold_i|E][gold|E]를 빼내고 당신의 [competitiveness_i|E][competitiveness|E]을 증가시킴"
 abuse_charter_authority_decision_desc: "나는 [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip]의 [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]에게 받은 특허장을 지니고 있으며, 이는 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]의 뜻을 법과 같게 만든다. 봉역의 군주가 우리를 뒷받침하는 한, 누구도 우리의 이익을 막아서지 못할 것이다."
 abuse_charter_authority_decision_confirm: "나는 [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]의 이름으로 행한다!"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "이곳에서는 [gurkhan_possessive|E] 권위가 인정받지 못함"
 abuse_charter_authority_decision.region_already_abused: "해당 토지는 이미 [gurkhan_possessive|E] 권한 남용을 목격함"
 abuse_charter_authority_decision.nothing_to_abuse: "이 [location|E]에는 남용할 수 있는 토지가 없음"
 gdp_charter_abused_market_modifier: "특허장 권한 남용됨"
 gdp_charter_abused_market_modifier_desc: "해당 인물은 자기 회사를 위해 특허장이 부여한 권한을 남용했습니다."
 gdp_charter_abused_market_county_modifier: "특허장 권한 남용됨"
 gdp_charter_abused_market_county_modifier_desc: "해당 영지는 특허장을 이용해 자신을 부유하게 만든 상인 회사에 의해 착취당했습니다."
 gdp_charter_leveraged_market_modifier: "특허장 소유주에게 밀려남"
 gdp_charter_leveraged_market_modifier_desc: "해당 인물의 회사는 봉역 영주의 특허장을 지닌 경쟁자에 의해 사운이 기울었습니다."
 gdp_charter_charitable_market_county_modifier: "특허장 하명에 의한 개발"
 gdp_charter_charitable_market_county_modifier_desc: "해당 영지는 특허장을 이용해 직접 개입한 상인 회사에 의해 개발되었습니다."
 gdp_decision.1000.t: "후원자의 분노"
 gdp_decision.1000.desc: "[patron.GetTitledFirstNameNoTooltipRegnal]의 궁정에서 전갈이 도착했다. 내 회사의 횡포에 대한 고발이 제기되어 내 후원자가 표정을 굳혔다고 한다.\n\n치안관들은 우리의 부정행위를 입증하는 혐의를 조목조목 열거했고, [patron.GetTitleAsNameNoTooltip](은)는 나에 대한 신뢰를 점차 잃게 되었다는 소식이었다.\n\n나의 후원자는 이제 우리의 소행에 관해 설명하라며 즉각적인 답변을 요구한다..."
 gdp_decision.1000.a: "\"심판을 받아들이겠습니다.\""
 gdp_decision.1000.b: "\"분명 이해하시겠지만, 저는 봉역을 위했을 뿐입니다...\""
 gdp_decision.1000.b.success: "당신의 후원자가 자비로움"
 gdp_decision.1000.b.failure: "당신의 후원자가 격분함"
 gdp_decision.1000.a.effects: "당신의 [merchant_patron|E]는 당신을 대상으로 [imprisonment_reason|E] 및 [execute_reason|E]를 획득합니다"
 gdp_decision.1000.a.severe_effects: "당신의 [merchant_patron|E]는 당신 및 당신의 [close_family_members|E]을 대상으로 [imprisonment_reason|E] 및 [execute_reason|E]를 획득합니다."
 gdp_decision.1000.a.survived_patrons_wrath: "당신의 [merchant_patron_possessive|E] 분노에서 살아남긴 했지만, 더 이상 해당 후원자의 권한을 남용할 수 없게 됩니다"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]의 상인들은 [ROOT.Char.GetTitleAsNameNoTooltip]인 내 이름으로 활동하며, 내 인장이 찍힌 특허장을 받은 자들이 특히 그러하다.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$그런 행상인 중 한 명인 [merchant.GetName](이)가 내 은혜를 이용해 특권을 휘둘러 백성들의 희생 위에 자기 배를 불린 것으로 보인다.\n\n이러한 방종은 분노해 마땅한 일이지만, 무역상들이 봉역에 가져다주는 이점도 따져봐야 한다."
 gdp_decision.1010.a: "[merchant.GetSheHe|U]는 이 문제에 답해야 할 것이다!"
 gdp_decision.1010.a.tt: "[merchant.GetShortUIName](이)가 [imprisoned|E]될 경우, 당신의 [charters|E]을 가진 다른 [clients|E]들이 당신의 권한을 남용하길 꺼리게 됨"
 gdp_decision.1010.b: "이번에는... 일단은 넘어가겠다."
 gdp_decision.1010.c: "이런 잡상인을 두고 말을 얹는 것은 내 체면을 깎는 짓이다."
 gdp_decision.1010.c.flavor: "당신의 권한을 남용하는 사태가 지속될 수 있습니다. 그러나 당신은 더 이상 알림을 받지 않게 됩니다."
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]...? 나는 그런 자에게 특허장을 준 적이 없다!"
 gdp_decision.1020.t: "[patron.GetTitleAsNameNoTooltip]의 이름으로"
 gdp_decision.1020.opening: "내 특허장을 한 번 흔들기만 하면, [patron.GetTitledFirstName]의 이름으로 [market_province.GetBaronyNameExplicitly]의 문과 치안관 사무실이 모조리 열린다.\n\n"
 gdp_decision.1020.market_holder: "지역 유력자 [market_holder.GetTitledFirstName](은)는 이 상황이 [patron.GetTitleAsNameNoTooltip]에게 알려질 것이라며 불만을 분명히 드러냈지만, 그자의 헛소리에는 아무 의미도 없다. 이 문서 자체가 반박이 불가능한 권위다.\n\n"
 gdp_decision.1020.closing: "마을이 내 손에 들어온 셈이다. 회사 직원들은 시장 시설을 확보하고, 정식 문서가 없는 모든 상품을 압수하며, 거짓 주장과 비난으로 경쟁자들을 괴롭힐 수 있다."
 gdp_decision.1020.a: "누구도 우리를 막을 수 없다."
 gdp_decision.1020.b: "[market_holder.GetTitledFirstNameNoTooltip](을)를 끼워줘야 한다."
 gdp_decision.1020.c: "마음이 바뀌었다."
 gdp_decision.1020.d: "\"내 #EMP 조사#!는 끝났다. 이번에는...\""
 gdp_decision.1020.b.success: "[patron.GetTitleAsNameNoTooltip]에게 한마디도 전해지지 않음"
 gdp_decision.1020.b.failure: "[patron.GetTitleAsNameNoTooltip](이)가 권한 남용에 관해 듣게 됨"
 benevolent_charter_authority_decision: "직접적인 지역 투자"
 benevolent_charter_authority_decision_tooltip: "당신의 [charter|E]을 사용하여 [building_i|E][building|E]을 개발하고 지역 [prosperity_i|E][prosperity|E]를 증가시킴"
 benevolent_charter_authority_decision_desc: "[ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip]의 [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]에게 승인을 받아, 나는 단순한 상인 회사의 권한을 넘어 봉역에 직접적으로 개입할 수 있는 영향력을 갖게 되었다."
 benevolent_charter_authority_decision_confirm: "[ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] 이름으로 많은 일을 추진할 수 있다."
 merchant_charter_intervention_county_cooldown: "지난 #V 5#!년 동안 [THIS.Char.GetDomicile.GetLocation.GetName]에 개입하지 않았음#!"
 gdp_decision.1200.t: "후원자의 기쁨"
 gdp_decision.1200.desc: "[patron.GetTitledFirstNameNoTooltipRegnal]의 궁정으로부터 소식이 닿았다. 그곳에서 내 회사의 진취성에 대한 격찬이 이어져 후원자가 기뻐했다고 한다.\n\n여러 목격자가 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l](와)과 최근의 개입에 관해 찬양시를 바쳤다.\n\n그 결과, [patron.GetTitleAsNameNoTooltip](은)는 회사에 다음과 같은 전언을 보냈다. \"훌륭하다, [ROOT.Char.GetTitledFirstNameNoTooltip], 그대의 노력이 봉역에 커다란 공로가 되었다!\""
 gdp_decision.1200.a: "\"회사가 봉사할 수 있어 기쁩니다.\""
 gdp_decision.1200.b: "\"인정도 좋지만, 보상도 좋습니다.\""
 gdp_decision.1200.b.flavor: "예의를 갖춰 말씀드리자면..."
 gdp_decision.1200.b.success: "당신의 후원자가 관대함"
 gdp_decision.1200.b.failure: "당신의 후원자는 실망함"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$그러한 행상인 중 한 명인 [merchant.GetName](은)는 왕국의 이익을 위해 자신의 특권을 사용하여 [market_province.GetBaronyNameExplicitlyNoTooltip] 개발에 투자한 것으로 보인다!\n\n이런 훌륭한 행동은 칭송받아야 마땅하며, 보상을 제공하면 더 많은 선행을 장려할 가능성이 있다."
 gdp_decision.1210.a: "이러한 진취성은 장려되어야 한다."
 gdp_decision.1210.a.tt: "당신의 [charters|E]을 가진 다른 [clients|E]들이 당신의 권한으로 선의를 행사하려는 의지가 더 커짐"
 gdp_decision.1210.b: "[ROOT.Char.GetFaith.HighGodName]께 맹세코, 정직한 상인이 #EMP 실제로#! 존재하다니!"
 gdp_decision.1210.c: "그런 일로 나를 귀찮게 하지 마라."
 gdp_decision.1210.c.flavor: "당신의 권한을 이용한 선의의 행사가 더 일어날 수 있습니다. 그러나 당신은 더 이상 알림을 받지 않게 됩니다."
 gdp_decision.1220.t: "[patron.GetTitleAsNameNoTooltip]의 이름으로"
 gdp_decision.1220.opening: "[market_province.GetBaronyNameExplicitly]에서 특허장을 보이며 나를 소개했다. 처음엔 지역 치안관들의 당혹감을 마주했지만, 나는 곧 우리 회사의 좋은 의도를 분명히 드러냈다.\n\n"
 gdp_decision.1220.market_holder: "지역 유력자 [market_holder.GetTitledFirstName](은)는 [market_holder.GetHerHis] 신민들 사이에서 생산과 상업을 장려하는 것에 가치가 있음을 발견하며, 다소 망설이면서도 관심을 가지고 내 제안을 들었다.\n\n"
 gdp_decision.1220.closing: "마을을 둘러보자, 주민들은 수리와 정비가 시급한 곳들을 금방 찾아내 하나하나 알려 주었다."
 gdp_decision.1220.a: "\"기다릴 게 뭐가 있겠나?\""
 gdp_decision.1220.d: "\"모두 매우 흥미롭지만, 다른 급한 일들이 있어서...\""
 press_the_advantage_decision: "우위 압박"
 press_the_advantage_decision_desc: "최근 우리의 성공으로 경쟁자들은 당황했으며 시장은 변동성이 커졌다. 이제는 압박으로 수익을 거둘 수 있는 곳에 직원, 호의, 그리고 어렵게 얻은 영향력을 투입할 때다."
 press_the_advantage_decision_tooltip: "[trade_route|E]에서 [competitiveness_i][trade_competitiveness|E]을 일정 기간 향상하기 위해 [competitive_pressure_i][competitive_pressure|E]을 사용함"
 press_the_advantage_decision_confirm: "우위를 밀어붙여라."
 merchant_competitive_pressure_gain_1_tt: "[competitive_pressure_i]#P 1#! [competitive_pressure|E] 획득"
 merchant_competitive_pressure_gain_2_tt: "[competitive_pressure_i]#P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! [competitive_pressure|E] 획득"
 merchant_competitive_pressure_spend_tt: "[competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [competitive_pressure|E] 소비"
 merchant_competitive_pressure_spend_cost_tt: "당신이 보유한 [competitive_pressure|E]이 [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! 이상임"
 merchant_competitive_pressure_below_max_tt: "당신이 보유한 [competitive_pressure_i][competitive_pressure|E]이 최대 수치 미만임 #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!"
 press_the_advantage_route_not_already_pressed_tt: "아직 [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]의 이점을 누리고 있지 않은 활성화된 [trade_route|E]가 있음"
 press_the_advantage_selected_route_has_trader_tt: "선택한 [trade_route|E]에 [trader|E]이 있음"
 press_the_advantage_selected_route_not_already_pressed_tt: "선택한 [trade_route|E]가 아직 [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip]의 이점을 누리고 있지 않음"
 merchant_competitive_pressure_route_modifier: "우위 압박"
 merchant_competitive_pressure_route_modifier_desc: "이 무역로는 경쟁자들이 어디서 취약한지 정확히 아는 직원들의 집중적인 관심을 받고 있습니다."
 choose_specialized_market_decision: "특화 시장 선택"
 choose_specialized_market_decision_desc: "시장의 관행, 관료, 숨겨진 경로를 잘 이해하는 회사는 낯선 거리도 집처럼 편하게 여길 수 있다. 우리 감찰관들의 노력을 행로에 있는 한 시장에 집중시키면 지역의 지식을 통해 상업적인 우위를 획득할 수 있다."
 choose_specialized_market_decision_tooltip: "당신의 [route_i][trade_routes|E]에 있는 [market_i][market|E]을 선택해 감찰관 특화 보너스를 획득함"
 choose_specialized_market_decision_confirm: "시장 연구하기"
 choose_specialized_market_decision_effect_tt: "선택한 [market_i][market|E]이 당신의 특화 [market_i][market|E]이 됨"
