 wipe_slate_merchant_decision: "새 출발"
 wipe_slate_merchant_decision_desc: "극한의 상황에서 어쩔 수 없이 범죄를 저질렀다고 해도 영원히 고통받아야 하는가? 모든 [ROOT.Char.GetFaith.GetAdherentNamePlural]들에겐 구원받을 자격이 없는 것인가?\n\n시간과 노동, 그리고 무엇보다도 #EMP 돈#!을 통해서, 세상은 거의 모든 죄를 용서해 준다."
