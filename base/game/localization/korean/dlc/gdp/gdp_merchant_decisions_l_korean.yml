 merchant_spending_spree_decision: "흥청망청 구매하기"
 merchant_spending_spree_decision_desc: "나는 수년에 걸쳐 다른 집안을 위한 상품의 무게를 재고, 가격을 매기며 흥정해 왔다. 정작 날 위한 상품을 사려고 애쓴 적은 없었다. 하루 정도는 지갑을 활짝 열고 가판대 사이를 돌아다니면서, 내 눈을 사로잡는 것은 무엇이든 사 봐도 괜찮을 것 같다."
 merchant_spending_spree_decision_tooltip: "[market|E]에서 [gold|E]를 자유롭게 소모해 당신과 [associates|E]들의 [stress|E]를 감소시키고 [prestige|E]을 획득하며, 일정 확률로 [domicile_artifact|E]을 획득할 수 있음"
