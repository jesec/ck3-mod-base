l_korean:
 gdp_republic_unrest.0001.t: "수도 봉기: 불만"
 gdp_republic_unrest.0001.desc: "인부와 조합 숙련공 무리가 안뜰에 모여들었다. 그들 중 하나가 앞으로 나왔다. \"세금 때문에 저희 다들 거지가 되기 직전입니다...\"\n\n예전에도 들은 적 있는 얘기였다. 내 문 앞까지 이런 불만을 가져오는 사람들은 이번이 처음도 아니고, 마지막도 아닐 것이다."
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "경비병! 이... 사람들을 치워 버리도록."
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "농노와는 협상 안 한다."
 gdp_republic_unrest.0001.b.success: "저들이 문제를 더 일으키지 않고 흩어짐"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "거부당한 이들이 분노하며 떠남"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "이 일은 자문회에 맡긴다."
 gdp_republic_unrest.0001.c.success: "일단 저들이 설득됨"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "저들이 미루려는 시도를 간파함"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "이번에는 양보하도록 하지."
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "수도 봉기: 차디찬 환대"
 gdp_republic_unrest.0011.desc: "시장을 지나가자 늘 그렇듯 크게 얘기하는 소리가 들렸다. 그런데 뭔가 평소와는 다른 느낌이 든다. 가판대가 조용해졌고 사람들도 마찬가지였다. 다들 날 불편하다는 시선으로 바라보기만 할 뿐이다.\n\n수년간 이 거리를 걸어 다녔는데, 이렇게 변한 적은 처음이었다."
 gdp_republic_unrest.0011.a: "그냥 나만 그렇게 느낀 거겠지."
 gdp_republic_unrest.0011.b: "사람을 보내 소문을 추적한다."
 gdp_republic_unrest.0011.b.success: "부하가 소문을 추적해 냄"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "소문이 계속됨"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "멈춰 서서 사람들과 얘기하겠다."
 gdp_republic_unrest.0011.c.success: "사람들이 당신의 행동에 고마워함"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "아무도 대화하려 하지 않음"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "음식과 포도주를 나눠주도록. 무슨 수를 써서라도."
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "수도 봉기: 익명의 편지"
 gdp_republic_unrest.0021.desc: "아침에 사무실에 도착하니 책상에 편지가 놓여 있었다. 인장도, 이름도 없었다. 편지는 내가 [ROOT.Char.GetTitleAsName](이)가 된 이후로 [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 상황이 얼마나 나빠졌는지를 매우 상세히 설명하고 있었다."
 gdp_republic_unrest.0021.a: "불에 던져 버린다."
 gdp_republic_unrest.0021.b: "이 서신에 꽤 공을 들인 것 같은데. 누군지 알아내라."
 gdp_republic_unrest.0021.b.success: "작성자를 알아냄"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "작성자의 정체를 알아내지 못함"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "공개적으로 답하겠다."
 gdp_republic_unrest.0021.c.success: "답이 좋은 반응을 얻음"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "답이 좋게 받아들여지지 않음"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "수도 봉기: 광장은 이제 저들의 것"
 gdp_republic_unrest.0101.desc: "\"일부 시민이 시장 광장을 점거하기 시작했는데... 그게 벌써 며칠째라고 합니다.\" 경비병이 내게 알렸다. \"[demagogue.GetFirstName](이)라는 [demagogue.GetWomanMan]이 사람들을 시끄럽게 선동하는 것 같습니다.\"\n\n이러면 내가 이 멍청이들한테 돈을 주는 이유가 없지 않나? 시장이 며칠이나 문을 닫았는데, 아무도 그 사실을 알려주지 않았다니!"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "어서 광장을 정리해라!"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "그 변설가의 신뢰도를 떨어뜨린다."
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName]의 신뢰도가 떨어짐"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "시도가 실패함"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "내가 직접 말해보겠다."
 gdp_republic_unrest.0101.c.success: "군중이 흩어짐"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "큰 야유를 직면함"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "그냥 해달라는 대로 해 줘라."
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "수도 봉기: 폐쇄된 구역"
 gdp_republic_unrest.0111.desc: "[closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )]에서 모든 연락을 끊었다는 소식을 듣게 됐다. 우리의 징세원을 인정하지 않고 있으며, 우리 경비병의 말에도 귀를 기울이지 않을 것이다."
 gdp_republic_unrest.0111.a: "징세원에게 경비대를 딸려 보낸다."
 gdp_republic_unrest.0111.b: "돈으로 해결하자."
 gdp_republic_unrest.0111.b.success: "저들이 원하던 것을 얻음"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "저들이 협상을 거부함"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "가서 직접 얘기해 보겠다."
 gdp_republic_unrest.0111.c.success: "저들이 귀를 기울임"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "언쟁을 벌이던 이들이 말을 듣지 않음"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "저러다 지쳐 나가떨어지겠지. 그랬으면 좋겠군."
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "수도 봉기: 형상"
 gdp_republic_unrest.0121.desc: "길을 걷던 나는 그대로 멈춰 섰다. 뭔가 내 의복과 비슷한 옷을 입은 못생긴 형상 하나가 공공연하게 매달려 있었다. 군중이 조용히 그 형상을 지켜보다가 나를 바라보았다.\n\n\"진짜랑 똑같네!\" 누군가 뒤에서 소리치자, 군중 속에서 큰 야유 소리가 일었다."
 gdp_republic_unrest.0121.a: "당장 저걸 끌어내려라!"
 gdp_republic_unrest.0121.a.flavor: "이곳의 그 누구도 자신이 본 광경을 얘기하지 못하게 하리라."
 gdp_republic_unrest.0121.b: "배후의 인물을 알아내라."
 gdp_republic_unrest.0121.b.success: "주도자를 처리함"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "주도자를 찾아내지 못함"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "이 일을 공개적으로 얘기하겠다."
 gdp_republic_unrest.0121.c.success: "사람들이 귀를 기울임"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "군중이 야유를 퍼부음"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "괜히 답해서 힘을 실어줄 필요는 없지."
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "수도 봉기: 도시가 불탄다"
 gdp_republic_unrest.0201.desc: "경비대가 나를 찾아오기도 전에, 멀리서 연기가 피어오르는 모습이 보였다. \"[demagogue.GetFirstName](이)라는 변설가가 사람들을 선동해 도시 지구에 불을 질렀다고 합니다.\"\n\n내 도시에 무슨 일이 일어나는 거지?"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "수비대 전원을 소집하라. 이 사태를 해결하도록."
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "내 말을 준비하라!"
 gdp_republic_unrest.0201.b.success: "폭도들이 흩어짐"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "궁전으로 달아나야 했음"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "광장에서 저들을 마주하겠다."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "군중이 내게 등을 돌림"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "필요하다면 국고를 털어서라도 돈을 줘라."
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "수도 봉기: 파업"
 gdp_republic_unrest.0211.desc: "시장을 지나가자 파업이 진행 중이라는 사실을 명백히 알 수 있었다. 아무도 나와서 자기 상품을 홍보하지 않는다. 가판대는 비어 있었고, 공방도 조용했다.\n\n조합에서 결단을 내렸고, 조합의 모든 일꾼이 그 결정을 따르는 것이 분명했다."
 gdp_republic_unrest.0211.a: "조합장들을 불러 대화한다."
 gdp_republic_unrest.0211.a.success: "합의에 도달함"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "저들이 나타나기를 거부함"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "이번에는 돈을 줘서 해결하자."
 gdp_republic_unrest.0211.b.success: "가격이 정해짐"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "저들이 절충안을 거부함"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "다들 일터로 돌려보내라. 당장."
 gdp_republic_unrest.0211.d: "저들의 요구를 들어준다."
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "수도 봉기: 격문"
 gdp_republic_unrest.0221.desc: "\"사람들이... 이제 이런 걸 퍼뜨리고 있습니다.\" 내 경비병 하나가 문서를 건네주며 이렇게 알려 왔다. \"도시 전역에 널려 있더군요.\"\n\n문서의 내용은 꽤 자세했다. 나를 개인적으로 모욕하며, 온갖 죄악을 저질렀다고 비난하고 있었다."
 gdp_republic_unrest.0221.a: "이걸 쓴 사람을 찾아내 처리하라."
 gdp_republic_unrest.0221.a.success: "출처를 찾아내 침묵시킴"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "작성자의 정체를 알아내지 못함"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "이 문서를 공개적으로 거부하겠다."
 gdp_republic_unrest.0221.b.success: "비난이 잦아들기 시작함"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "사람들이 나를 향해 야유함"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "모조리 사들여 거둬라."
 gdp_republic_unrest.0221.d: "이런 일은 알아서 가라앉기 마련이지."
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "수도 봉기: 관문에서"
 gdp_republic_unrest.0301.desc: "경비병들이 날 깨웠다. 우리 쪽으로 폭도 무리가 오고 있다는 것이다. 회당을 가로질러 걷는데 텅 비어 있었다... 대부분의 경비대가 나를 버리고 달아났다.\n\n창 밖을 내다보니 사람들이 소리를 지르고 환호하며 천천히 다가오는 모습이 보였다. 폭도가 나를 찾아오고 있다."
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "[ROOT.Char.GetTitleAsNameNoTooltip](은)는 오직 한 명뿐이다. 어디 와서 잡아보라지."
 gdp_republic_unrest.0301.a.success: "두 손이 떨릴 때까지 적을 모두 베어버렸고, 피투성이가 된 고요한 궁전만 남음"
 gdp_republic_unrest.0301.a.fail: "폭도 앞에 쓰러짐"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "순순히 당하진 않겠다!"
 gdp_republic_unrest.0301.b.success: "부하들과 함께 검으로 길을 뚫고 나감"
 gdp_republic_unrest.0301.b.fail: "수적으로 열세임"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "시종들의 문을 통해 빠져나간다."
 gdp_republic_unrest.0301.c.success: "몰래 빠져나가는 데 성공함"
 gdp_republic_unrest.0301.c.fail: "붙잡힘"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "내 치세도 끝이군."
 gdp_republic_unrest.0301.d.flavor: "창문으로 나서서 은퇴하겠다고 알린다. 그런 다음 비무장 상태로 걸어 나가며 날 살려 주기만을 바라야지."
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "수도 봉기: 대침묵"
 gdp_republic_unrest.0302.desc: "궁전은 조용해졌다.\n\n시체도 치워지지 않았으며, 반란군 잔당이 도망쳤던 관문은 아직도 열린 채였다. 내 손의 떨림도 멎었다. 일단은 그런 것 같다.\n\n난 아직 여기에 있었다."
 gdp_republic_unrest.0302.a: "내가... 살아남았어?"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "수도 봉기: 새로운 이름, 새로운 삶"
 gdp_republic_unrest.0303.desc: "내가 살아남았다.\n\n이제 도시는 저 멀리 뒤에 있으며, 이 거리에서는 아무도 내가 누군지 모른다. 작위도, 궁전도, 수년 동안 나를 정의했던 모든 것도... 이제는 사라지고 없다.\n\n하지만 난 살아남았다. 그게 중요한 것 아니겠는가. 이제 어디로 가면 좋을까?"
 gdp_republic_unrest.0303.a: "[destination_a.GetNameNoTierNoTooltip](으)로 향한다. 새출발이 기다린다."
 gdp_republic_unrest.0303.a.tt: "여행을 떠나 [destination_a.GetNameNoTier](으)로 내 본적지를 이전함"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip](이)라면 꽤 멀리 있지. 거기서 다시 시작하자."
 gdp_republic_unrest.0303.b.tt: "여행을 떠나 [destination_b.GetNameNoTier](으)로 내 본적지를 이전함"
 gdp_republic_unrest.0303.c: "내 이름을 아는 이가 없는 곳이 좋겠어. [destination_c.GetNameNoTierNoTooltip] 정도면 되겠지."
 gdp_republic_unrest.0303.c.tt: "여행을 떠나 [destination_c.GetNameNoTier](으)로 내 본적지를 이전함"
 gdp_republic_unrest.0303.d: "갈 만한 곳이 없군. 여기서 내 쓸모를 찾아보겠다."
 gdp_republic_unrest.0303.tt: "모든 [domicile_buildings|E]을 환불함"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.GetTitleAsNameNoTooltip]의 사망"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName](이)가 죽었다. 봉기 때 목숨을 잃었으며, 궁전은 조용해졌다.\n\n이제 앞으로 어떻게 될지는 아무도 모르는 일이다."
 gdp_republic_unrest.0304.a: "이제 모든 게 달라질 것이다."
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.GetTitleAsNameNoTooltip]의 실종"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName](이)가 사라졌다. 시신도, 작별 인사도 없었다. 폭도들이 관문에 있었지만, [old_doge.GetHeShe]는 야밤을 틈타 사라져 버렸다.\n\n이제 앞으로 어떻게 될지는 아무도 모르는 일이다."
 gdp_republic_unrest.0305.a: "이제 모든 게 달라질 것이다."
 gdp_republic_unrest.0306.t: "수도 봉기: 새로운 도시, 새로운 삶"
 gdp_republic_unrest.0306.desc: "기나긴 길을 뒤로했다. 하지만 돌아보지 않으려고 애를 썼다.\n\n이곳은 아직 내 이름을 모른다. 시장도 낯설지만 사람들은 더 낯설다. 하지만 여기서도 돈을 벌 수 있고 동맹을 결성할 수 있다. 가진 것은 얼마 안 되지만, 그래도 삶을 다시 꾸려갈 수 있다."
 gdp_republic_unrest.0306.a: "일을 시작해 볼까."
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "수도 봉기: 광장의 암살자"
 gdp_republic_unrest.0311.desc: "시장을 지나가자 군중이 내 앞에서 길을 열었다. 시끌벅적하던 이야기 소리도 잦아들었다. 갑자기 검을 꺼내 든 누군가가 내 쪽으로 달려왔다.\n\n경비병들은 너무 뒤에 있어 도움이 되지 못한다. 대응할 시간은 잠깐뿐이었다."
 gdp_republic_unrest.0311.a: "내 검이 어디 갔지?!"
 gdp_republic_unrest.0311.a.success: "겨우 제때 목숨을 구함"
 gdp_republic_unrest.0311.a.fail: "[assassin.GetSheHe|U]가 경호원보다 더 빨랐음"
 gdp_republic_unrest.0311.b: "여기서 빠져나가야겠다. 당장."
 gdp_republic_unrest.0311.b.success: "암살자를 간신히 피함"
 gdp_republic_unrest.0311.b.fail: "도망칠 곳이 없음"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "수도 봉기: 꿋꿋한 생존"
 gdp_republic_unrest.0312.desc: "혼란 속에 군중이 달아났다. 영문은 모르겠지만, 나는 아직 살아 있었다.\n\n나는 죽은 암살자의 시체를 내려다보았다. 경비병들이 [assassin.GetHerHim]를 붙잡아 처리한 뒤였다. [assassin.GetSheHe|U]는 도시에 있는 다른 기능공과 다를 것이 없어 보였다.\n\n보통 시민까지 나를 죽이려 한다면, 나는 대체 어디로 가야 안전하단 말인가?"
 gdp_republic_unrest.0312.a: "난... 집에 가야겠다."
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "수도 봉기: 피에는 피로"
 gdp_republic_unrest.0321.desc: "전령이 늦은 밤에 내 서재로 찾아와 편지를 건네주었다.\n\n도시에서 일부 폭도들이 내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetFirstName](을)를 붙잡았는데, 내가 아침까지 떠나지 않는다면 [heir.GetHerHis] 시신을 내 저택으로 보내겠다는 것이다."
 gdp_republic_unrest.0321.rival: "[heir.GetHerHim]를 가지라고 해라."
 gdp_republic_unrest.0321.a: "경비대를 동원한다. [heir.GetHerHim]를 데려와라."
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U](이)가 살아남음"
 gdp_republic_unrest.0321.a.success: "부하들이 제시간에 [heir.GetHerHim]를 구출함"
 gdp_republic_unrest.0321.a.fail: "부하들이 너무 늦음"
 gdp_republic_unrest.0321.b: "어디다 [heir.GetHerHim]를 가둬놨는지 알아내라."
 gdp_republic_unrest.0321.b.success: "[heir.GetHerHim]를 찾아냄"
 gdp_republic_unrest.0321.b.fail: "[heir.GetSheHe|U]를 찾지 못함"
 gdp_republic_unrest.0321.c: "가진 금화를 다 주겠다. [heir.GetHerHim]를 돌려주어라."
 gdp_republic_unrest.0321.d: "[heir.GetFirstNameNoTooltip] 없이는 작위도 의미가 없다."
 gdp_republic_unrest.0321.d.flavor: "[heir.GetHerHim]를 구할 수만 있다면 이 정도는 감수해야지."
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "수도 봉기: 무사 귀환"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip](이)가 약간 떨리는 미소를 지으며 내 서재 문으로 걸어 들어왔다. [heir.GetSheHe|U]는 괜찮고, 살아남았다. 지금은 그게 중요하다.\n\n앞으로 다시는 이런 일이 일어나지 않게 해야 한다."
 gdp_republic_unrest.0322.desc.rival: "시종이 내 방으로 들어와 소식을 전했다. [heir.GetFirstNameNoTooltip](이)가 돌아왔다는 것이다.\n\n다행이군. 일단은 승계에 문제가 없게 되었다. 앞으로 다시는 이런 일이 일어나지 않게 해야 한다."
 gdp_republic_unrest.0322.a: "아, 돌아왔군!"
 gdp_republic_unrest.0322.a.rival: "좋다. 이제 다시 일 얘기를 할 수 있겠군."
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "수도 봉기: 너무 늦다"
 gdp_republic_unrest.0323.desc: "어두워진 뒤에야 누군가 문을 두드렸다. 밖에서 목소리가 들리더니 조용해졌다.\n\n안뜰로 나가면서도 나는 이미 알았다. [heir.GetFirstNameNoTooltip](이)가 돌바닥에 누워 있었다. 폭도가 [heir.GetHerHim]의 유해를 집으로 보내준 것이다."
 gdp_republic_unrest.0323.desc.rival: "어두워진 뒤에야 누군가 문을 두드렸다. 안뜰로 나가면서도 나는 이미 알았다.\n\n[heir.GetFirstNameNoTooltip](이)가 돌바닥에 누워 있었다. 폭도가 [heir.GetHerHim]의 유해를 집으로 보내준 것이다. 나는 오래도록 그 자리에 서서 내 후계자의 시신을 바라보았다."
 gdp_republic_unrest.0323.a.child: "저들이 내 아이를 이렇게 학살하다니..."
 gdp_republic_unrest.0323.a: "[heir.GetFirstNameNoTooltip], 대체 무슨 짓을 당한 것이냐?"
