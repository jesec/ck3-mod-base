 every_patrician_tt: "모든 [patrician|E]"
 gdp_war_approval_decree_decision: "전쟁 승인 요청"
 gdp_war_approval_decree_decision_desc: "우리가 [war|E]을 선포할 수 있는 것은 오직 평의회의 뜻에 따른 것이다. 충분한 표를 확보하려면 몇몇에게 뇌물을 주어야 할 수도 있지만, 더 큰 대의를 위해서는 어쩔 수 없다."
 gdp_war_approval_decree_decision_tooltip: "[war|E]을 선포하기 위해 [assembly|E]의 허가를 요청함"
 gdp_war_approval_decree_decision_confirm: "전쟁 승인 요청"
 gdp_war_approval_decree_decision_effect_desc: "[war|E]을 선포할 허가를 얻습니다"
