l_korean:
 gdp_adopt_republic_government_decision: "공화제 이념 채택"
 gdp_adopt_republic_government_decision_desc: "거리를 떠도는 군중을 지켜보니, 저들은 일상적인 투쟁에 잔뜩 지쳐 있다. 우리의 [ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l] 방식이 정말로 영주에게 유일한 길인지 궁금해진다. 태생만이 아니라 얻어낸 인정을 통해 충성을 얻을 수는 없을까? 이제는 새로운 이상을 받아들이고 우리의 삶의 방식을 재구성할 때인지도 모른다."
 gdp_adopt_republic_government_decision_tooltip: "공화제 이념을 채택하여 [GetGovernment('republic_government').GetName](이)가 됨"
 gdp_adopt_republic_government_decision_confirm: "공화제 이념 채택"
 liege_has_granted_city_charter: "당신의 [liege|E]이 당신에게 도시 특허장 수여"
 liege_has_granted_city_charter_duration: "당신의 [liege|E]이 당신에게 도시 특허장 수여 #weak ([GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )]까지)#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X 당신은 더 이상 [GetTitleByKey('e_hre').GetName]의 [elector|E]가 아니게 됩니다#!"
 gdp_adopt_republican_ways_decision: "공화제 방식 채택"
 gdp_adopt_republican_ways_decision_desc: "한때 우리를 하나로 묶어 주던 모임은 이제 시장과 성벽의 무게에 짓눌리고 있다. [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]의 번영을 바란다면 낡은 부족의 방식을 버리고 도시가 공화제를 통해 스스로를 다스리게 해야 한다."
 gdp_adopt_republican_ways_decision_tooltip: "[tribal|E] 방식을 버리고 [republic|E]가 됨"
 gdp_adopt_republican_ways_decision_confirm: "공화제 방식 채택"
 gdp_tribal_capital_becomes_city_tt: "당신의 [realm_capital|E]가 [city_holding|E]가 됨"
 gdp_other_tribal_holdings_become_castles_tt: "봉역 내 그 밖의 모든 [tribal_holdings|E]는 [castle_holdings|E]가 됨"
 gdp_tribal_vassals_will_feudalize_tt: "당신의 [tribal|E] [vassals|E]들은 [feudal|E] 또는 [clan|E] [government|E]를 채택하게 됨"
 convert_to_feudalism_from_republic_decision: "[ROOT.Char.Custom('GetTribalReformGovernment')|U] 방식 도입"
 convert_to_feudalism_from_republic_decision_desc: "의회와 절차, 관료제가 우리의 통치 효율을 떨어뜨리고 있다. [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip](이)가 번영하려면 이러한 부담을 떨쳐 내야 한다."
 convert_to_feudalism_from_republic_decision_confirm: "[ROOT.Char.Custom('GetTribalReformGovernment')|U] 방식 도입"
 convert_to_feudalism_from_republic_decision_tooltip: "[government|E] 유형을 변경함"
 patricians_becomes_merchants_desc: "[patrician|E] [vassals|E]이 [merchants|E]이 됩니다"
 gdp_restore_roman_republic_decision: "로마 공화정 복원"
 gdp_restore_roman_republic_decision_desc: "로마 공화정은 자유와 번영의 등불이었으며, 모두가 본받아야 할 모범이었다. 하지만 이 세상의 수많은 것들과 마찬가지로 폐허가 되고 말았다. 이제 로마 공화정을 되살려 그 영광을 되찾을 때다!"
 gdp_restore_roman_republic_decision_tooltip: "로마 공화정 복원"
 gdp_restore_roman_republic_decision_confirm: "로마 공화정 복원"
 restore_roman_republic_make_rome_capital_desc: "[GetTitleByKey('c_roma_urbs').GetName](을)를 [realm_capital|E]로 삼을 수 있습니다"
 assembly_members_appointed_as_senators_desc: "[assembly|E] 의원 전원이 [republic_senators|E]으로 임명됩니다"
 gdp_popular_mandate_decision: "대중의 지지 호소"
 gdp_popular_mandate_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 주민들은 나를 사랑한다. 이제 그 호의를 이용해 내 연임을 지지하도록 주민들을 결집할 수 있다. 민중의 목소리는 의회에서도 힘을 발휘하며, 민중의 지지를 등에 업은 [ROOT.Char.GetTitleAsNameNoTooltip|l](은)는 표를 셀 때 더 유리한 위치에 선다.\n\n그 호의를 다소 잃게 되겠지만, 내게는 훗날이 아니라 당장의 표가 필요하다."
 gdp_popular_mandate_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]의 [popular_opinion|E]을 소비하여 다음 [election|E]에서 추가 표를 1개 얻음"
 gdp_popular_mandate_decision_confirm: "민중을 나에게 결집"
 gdp_popular_mandate_no_active_mandate_desc: "대중의 지지를 받고 있지 않습니다"
 gdp_civic_labor_decision: "시민 노동 동원"
 gdp_civic_labor_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 주민들의 호의는 금만큼이나 확실한 자원이다. 그 호의를 조금 쓰는 대가로 내 건설 사업에 노동력과 전문 지식을 보태 달라고 시민들에게 요청하겠다."
 gdp_civic_labor_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]의 [popular_opinion|E]을 소비하여 [ROOT.Char.GetTitleAsNameNoTooltip|l] 본적지 건설에 보너스를 얻음"
 gdp_civic_labor_decision_confirm: "시민들을 불러 모으겠다"
 gdp_popular_gifts_decision: "후견 요청"
 gdp_popular_gifts_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 주민들 사이에서 내가 누리는 지지는 좋은 지렛대가 된다. [ROOT.Char.GetTitleAsNameNoTooltip|l](이)가 유력 파트리키 가문들의 제안을 받고 있다고 널리 알리겠다. 그러면 저들은 서로 더 좋은 제안을 내놓으려고 경쟁할 것이다. 누가 앞서든 궁정에는 이득이다."
 gdp_popular_gifts_decision_tooltip: "[popular_opinion|E]을 소비해 부유한 파트리키 가문들이 총애를 얻기 위해 서로 경쟁하도록 압박하여, 궁정에 [gold|E]와 선물이 들어오게 합니다."
 gdp_popular_gifts_decision_confirm: "입찰 시작"
 gdp_popular_gifts_artifact_tt: "무작위 [artifact|E]을 선물로 받음"
 gdp_glorification_decision: "찬양을 받아들이다"
 gdp_glorification_decision_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 주민들이 내게 보내는 존경은 정치나 인기를 넘어선다. 그들은 나를 자신들의 지도자가 아니라, 도시가 육신을 입은 존재로서 기리고자 한다. 이 순간을 있는 그대로 받아들이겠다."
 gdp_glorification_decision_tooltip: "도시의 찬양을 받아들입니다. 평생 단 한 번뿐인 영예입니다."
 gdp_glorification_decision_confirm: "축하하게 두어라"
 gdp_glorification_artifact_tt: "당신이 #V $gdp_glorification_artifact_name$#! [artifact|E]을 획득함"
 gdp_glorification_artifact_name: "도시의 영예 메달"
 gdp_glorification_artifact_desc: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 시민들이 사랑하는 [ROOT.Char.GetTitleAsNameNoTooltip|l](을)를 기리며 수여한 기념 메달입니다."
 gdp_popular_mandate_decision_toast: "대중의 지지 확보"
 gdp_civic_labor_decision_toast: "시민 노동 동원"
 gdp_popular_gifts_decision_toast: "파트리키들이 후원 요청에 응함"
 gdp_glorification_decision_toast: "도시의 축하"
 gdp_fund_alms_decree_decision: "수도에서 자선 베풀기"
 gdp_fund_alms_decree_decision_desc: "[ROOT.Char.GetTitleAsNameNoTooltip](으)로서 [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]의 시민들을 돌보는 것이 내 의무다. 자선을 베푸는 데는 여러 이유가 있다. 어려운 이들을 돕고, 도시의 번영을 늘리고, 우리 사회를 묶어주는 결속을 강화하기 위해서다.\n\n그 동기가 무엇이든, 빈민을 돌보는 것은 대중의 호감을 유지하는 확실한 방법이다."
 gdp_fund_alms_decree_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]의 빈민들에게 자선을 제공함"
 gdp_fund_alms_decree_decision_confirm: "자선 제공"
 gdp_tax_holiday_decree_decision: "세금 감면"
 gdp_tax_holiday_decree_decision_desc: "앞으로 몇 년 동안 [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 시민들에게 부과되는 세금을 감면할 것이다. 그 부담은 국고가 떠안겠지만, 민중의 호의를 얻을 수 있다면 그만한 값어치는 있다."
 gdp_tax_holiday_decree_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]의 도시 세금을 감면하여 [popular_opinion|E]을 높임"
 gdp_tax_holiday_decree_decision_confirm: "도시 세금 감면"
 gdp_debt_forgiveness_decree_decision: "채무 탕감"
 gdp_debt_forgiveness_decree_decision_desc: "수많은 [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 시민들이 갚을 수 없는 빚에 짓눌려 있다. 이들이 도시에 진 빚을 탕감해 주면 부담을 덜어 주고 그 대가로 충성심을 얻을 수 있다. 국고를 이렇게 사용하는 데 모두가 찬성하지는 않겠지만, 민중의 지지를 받는 통치자는 굳건한 기반 위에 서 있다."
 gdp_debt_forgiveness_decree_decision_tooltip: "[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] 시민들의 채무를 탕감하여 [popular_opinion|E]을 크게 높임"
 gdp_debt_forgiveness_decree_decision_confirm: "채무 탕감"
 gdp_debt_forgiveness_upset_patricians_tt: "[GetHouseAspiration( 'republic_communal' ).GetName|V] [house_ambition|E]이 없는 모든 [vassal|E]"
 gdp_debt_forgiveness_pleased_patricians_tt: "[GetHouseAspiration( 'republic_communal' ).GetName|V] [house_ambition|E]이 있는 모든 [vassal|E]"
 gdp_finance_war_decree_decision: "전쟁 비용 조달"
 gdp_finance_war_decree_decision_desc: "전쟁은 끔찍한 일이며, 무엇보다 #EMP 비용이 많이 드는#! 일이다. 필요하다면 전쟁 자금을 확보하기 위해 전쟁세를 추가고 부과할 수 있다."
 gdp_finance_war_decree_decision_tooltip: "진행 중인 전쟁에 자금을 조달하기 위해 추가 세금을 부과함"
 gdp_finance_war_decree_decision_confirm: "징집병 전쟁세"
