 must_have_assembly_approval_execution_desc: "당신은 상대를 [execute|E]하기 위한 [assembly_possessive|E] 승인을 받지 #bold 않았습니다#!"
 gained_assembly_approval_execution_desc: "당신은 이미 [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName](을)를 [execute|E]하기 위한 [assembly_possessive|E] 승인을 받았습니다"
