 gdp_banishment_approval_decree_decision: "추방 승인 요청"
 gdp_banishment_approval_decree_decision_named: "[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat] 추방 요청"
 gdp_banishment_approval_decree_decision_desc: "우리 가운데 우리의 통치를 견디지 못하는 자들이 있으며, 우리의 통치 역시 더 이상 그들을 용납할 수 없다. 평의회의 동의를 얻는다면 그들을 우리 봉역에서 [banish|E]하여, 목숨을 빼앗을 경우 불러왔을 피의 분쟁은 피하면서 위험 요소를 제거할 수 있다."
 gdp_banishment_approval_decree_decision_tooltip: "당신이 기소한 인물을 [banish|E]할 수 있도록 [assembly|E]에 허가를 요청함"
 gdp_banishment_approval_decree_decision_confirm: "추방 승인 요청"
 gdp_banishment_approval_decree_decision_effect_desc: "[indicted_character.GetShortUIName](을)를 [banish|E]할 허가를 얻습니다"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "당신이 기소한 인물을 [banish|E]할 허가를 얻습니다"
 must_have_assembly_approval_banishment_desc: "당신은 상대를 [banish|E]하기 위한 [assembly_possessive|E] 승인을 받지 #bold 않았습니다#!"
 gained_assembly_approval_banishment_desc: "당신은 이미 [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName](을)를 [banish|E]하기 위한 [assembly_possessive|E] 승인을 받았습니다"
 gdp_proscription_approval_decree_decision: "일가 추방령 승인 요청"
 gdp_proscription_approval_decree_decision_named: "[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip] 집안 추방령 요청"
 gdp_proscription_approval_decree_decision_desc: "피는 속이지 않는다. 반역자의 혈족에게도 그 타락은 이어지며, 배신으로 물든 마음속에는 똑같은 악의가 도사리고 있다. 평의회가 동의한다면 그 일가 전체를 [banish|E]하여 이 불충한 혈통을 우리에게서 몰아낼 수 있다."
 gdp_proscription_approval_decree_decision_tooltip: "당신이 기소한 인물의 일가 전체를 [banish|E]할 수 있도록 [assembly|E]에 허가를 요청함"
 gdp_proscription_approval_decree_decision_confirm: "일가 추방령 승인 요청"
 gdp_proscription_approval_decree_decision_effect_desc: "[indicted_character.GetShortUINamePossessive] 일가 전체를 [banish|E]할 허가를 얻습니다"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "당신이 기소한 인물의 일가 전체를 [banish|E]할 허가를 얻습니다"
 must_have_assembly_approval_proscription_desc: "당신은 상대의 일가 전체를 [banish|E]할 [assembly_possessive|E] 승인을 받지 #bold 않았습니다#!"
 gained_assembly_approval_proscription_desc: "당신은 이미 [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINamePossessive] 일가 전체를 [banish|E]하기 위한 [assembly_possessive|E] 승인을 받았습니다"
 gdp_execution_approval_decree_decision: "처형 승인 요청"
 gdp_execution_approval_decree_decision_named: "[ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat] 처형 요청"
 gdp_execution_approval_decree_decision_desc: "우리의 통치는 자애롭지만, 여전히 그 근간 자체를 위협하려는 자들이 있다. 그들이 살아 숨 쉬는 한 마음을 놓을 수 없을 만큼 위험한 자들이다. 평의회의 승인을 얻는다면 그들을 [execute|E]하여 민중을 안심시킬 수 있다."
 gdp_execution_approval_decree_decision_tooltip: "당신이 기소한 인물을 [execute|E]할 수 있도록 [assembly|E]에 허가를 요청함"
