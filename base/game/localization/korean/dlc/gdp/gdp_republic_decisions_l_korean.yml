 gdp_sponsor_craft_guild_decision: "수공업 조합 후원"
 gdp_sponsor_craft_guild_decision_desc: "공화정에서는 수공업 조합으로 공식 인정받으면 상당한 혜택을 누릴 수 있다. 그래서 여러 직종의 기능공들은 공식 특허장을 마련해 평의회의 승인을 받고자 한다. 이들이 인가를 받도록 후견하면 도시에 이로우며, 관련 법안을 평의회에 제출한 파트리키는 새로 인가받은 조합의 후견자로 인정받는다."
 gdp_sponsor_craft_guild_decision_tooltip: "수공업 조합을 후원하면 [capital|E] [county|E]의 [prosperity_growth|E]과 [urban_tax|E]이 증가하고, [house_possessive|E] [trade_competitiveness|E] 및 [trade_expertise|E] 성장 또한 증가합니다."
 gdp_sponsor_craft_guild_decision_confirm: "새 수공업 조합 후원"
 gdp_request_noble_magistracy_decision: "귀족 정무관직 요청"
 gdp_request_noble_magistracy_decision_desc: "파트리키 신분으로는 대부분의 행정직을 맡을 수 없지만, 귀족 정무관에게만 허용되는 직위도 있다. 이런 직위는 젊고 야심 찬 파트리키가 국정 운영의 실무를 익히고 명성을 쌓기에 안성맞춤이다."
 gdp_request_noble_magistracy_decision_tooltip: "귀족 정무관직에 오르면 당신의 [heir_possessive|E] [dynasty_prestige|E] 및 [lifestyle_experience|E] 획득량과 [opinion|E]이 증가하며, 해당 인물의 [stress_gain|E]량 또한 증가하게 됨"
 gdp_request_noble_magistracy_decision_confirm: "후계자의 귀족 정무관직 요청"
 gdp_request_relief_from_bankruptcy_decision: "파산 구제 요청"
 gdp_request_relief_from_bankruptcy_decision_desc: "평의회는 유력 가문이 빈곤의 나락으로 떨어지지 않도록 공화국의 국고를 동원해 채권자들에게 진 빚과 악성 채무를 대신 상환할 수 있다. 이를 통해 몰락한 유력 가문 구성원은 파산의 위기에서 벗어나 재기할 기회를 얻는다."
 gdp_request_relief_from_bankruptcy_decision_tooltip: "파산 구제를 받으면 당신의 [gold|E] 채무를 [republic|E] [treasury|E]에서 대신 상환하게 됨"
