l_korean:
 merchant_house_unity: "회사 방향성"
 rapacious_cs: "탐욕적"
 rapacious_cs_desc: "#weak 친족의 책임은 끓어오르는 분노와 야심 속에서 오래전에 잊혔습니다. 회사의 필요가 그 구성원의 필요보다 우선하며, 이익이 모든 것보다 더 위에 있습니다.#!"
 opportunistic_cs: "기회주의적"
 opportunistic_cs_desc: "#weak 친족들은 좀처럼 협력하지 않고 혈연의 위계에 반발하며, 의무를 개인의 이익보다 부차적인 것으로 치부합니다.#!"
 balanced_cs: "균형적"
 balanced_cs_desc: "#weak 가족에 수장이 필요하긴 하지만, 그 구성원들은 간섭이나 평가 없이 자신의 일을 자유롭게 처리할 수 있어야 합니다.#!"
 grasping_cs: "출세지향적"
 grasping_cs_desc: "#weak 회사의 명성이 곧 구성원들의 명성입니다. 회사에서 가치 있는 일원이 되려면, 자신의 사회적 입지와 평판을 모두 향상시키려 노력해야 합니다.#!"
 ennobled_cs: "귀족적"
 ennobled_cs_desc: "#weak 의무와 존경에서 비롯된 끈질긴 충성심으로, 전체의 이익은 곧 수장의 이익과 같습니다. 가족의 끈으로 단단히 엮인 하나의 집단으로서, 회사는 가장 고귀한 가문들과 동등한 위치에 설 수 있을지도 모릅니다.#!"
 house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts: "[traders|E]으로 일하는 [house|E] 구성원은 더 높은 확률로 [trade_opportunities|E]를 제공합니다"
 house_unity_parameter_unity_risk_of_leaving: "다른 [rulers|E]의 [court|E] 초청에 대한 [associates|E]의 승낙 확률: #N +20#!"
 house_unity_parameter_unity_very_high_risk_of_leaving: "다른 [rulers|E]의 [court|E] 초청에 대한 [associates|E]의 승낙 확률: #N +50#!"
 house_unity_parameter_unity_deputy_positions_cost_less: "[deputy|E] 직위의 급여 감소: #P -50%#!"
 house_unity_parameter_unity_deputy_positions_cost_significantly_less: "[deputy|E] 직위의 급여 #EMP 대폭#! 감소: #P -85%#!"
 unity_merchant_can_petition_for_noble_standing_tt: "[company_sentiment|E]이 #V #emp $ennobled_cs$#!#!이어야 함"
 house_unity_parameter_unity_merchant_can_petition_for_noble_standing: "#V $merchant_purchase_land_interaction$#!의 #V $merchant_purchase_land_interaction_noble_standing$#! 선택지 및 #V $merchant_procure_estate_interaction$#! [interaction|E]을 사용할 수 있음"
 unity_merchant_can_request_complete_exploitative_monopolies_tt: "[complete_monopoly|E] 또는 [exploitative_monopoly|E]을 요청하려면 [company_sentiment|E]이 #V #emp $rapacious_cs$#!#!이어야 함"
 house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies: "#V $request_trade_monopoly_for_character_interaction$#! [interaction|E]으로 [complete_monopolies|E] 및 [exploitative_monopolies|E]을 요청할 수 있음"
 merchant_steady_hand_low_unity_modifier: "$merchant_house_unity$: 안정된 손길"
 merchant_steady_hand_low_unity_modifier_desc: "해당 인물은 무질서한 집안에도 불구하고 회사를 잘 끌어 나갑니다."
 merchant_house_of_knives_fractious_modifier: "$merchant_house_unity$: 칼날의 가문"
 merchant_house_of_knives_fractious_modifier_desc: "해당 인물의 집안은 불화가 가득하며, 암시된 위협 하나하나에도 무게가 실려 있습니다."
 merchant_house_of_knives_divided_modifier: "$merchant_house_unity$: 칼날의 가문"
 merchant_house_of_knives_divided_modifier_desc: "해당 인물의 집안은 분열이 심한 나머지, 회사에서 유일하게 통하는 언어는 이제 공포밖에 없습니다."
 merchant_family_mobilization_promote_diligence_modifier: "$merchant_house_unity$: 근면 장려"
 merchant_family_mobilization_promote_diligence_modifier_desc: "해당 인물은 더 탄탄한 무역과 더 예리한 경쟁을 향해 나아가는 진취적인 가문을 구축하고 있습니다."
 unity_regional_networks_decision: "지역적 이해 인정"
 unity_regional_networks_decision_desc: "내 가문의 구성원들은 자신의 독립적인 사업 이익을 격렬하게 지키지만, 내부 경쟁을 용인하면 회사 전체에 도움이 될 것이다."
 unity_regional_networks_decision_tooltip: "당신의 [house|E] 구성원들이 자신의 지역 무역 이익을 추구하도록 승인합니다"
 unity_regional_networks_decision_confirm: "거래 자유 장려"
 unity_family_business_decision: "가업 공식화"
 unity_family_business_decision_desc: "[ROOT.Char.GetHouse.GetName] 장원은 우리 무역망의 중심이며, 그 효율적인 관리가 우리 성공의 핵심이다."
 unity_family_business_decision_tooltip: "당신의 [company|E]와 무역망 관리에 당신의 [house|E] 구성원들을 동원합니다"
 unity_family_business_decision_confirm: "가족의 책임 정하기"
 unity_merchant_prosperity_decision: "번영 촉진"
 unity_merchant_prosperity_decision_desc: "번영하기 위해서는, 우리는 [ROOT.Char.GetDomicile.GetLocation.GetName] 지역을 가꾸어 우리의 야심을 뒷받침할 수 있도록 해야 한다."
 unity_merchant_prosperity_decision_tooltip: "당신의 [company|E] 소재지의 [prosperity|E]를 지원합니다"
 unity_merchant_prosperity_decision_confirm: "지역 번영 장려"
 unity_merchant_prosperity_decision_cooldown_tooltip: "[THIS.Char.GetHouse.GetName] [house|E]은 지난 #V 10#!년 동안 번영을 촉진했습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.GetHouse.MakeScope, 'unity_merchant_prosperity_decision_cooldown') )|V] 이후 다시 시행 가능#!"
 unity_required_level_not_met_tooltip: "당신의 [THIS.Char.Custom('GetHouseUnityLevelConcept')]가 이를 허용하지 않음"
 unity_merchant_bailiffs_decision: "지역 당국 지원"
