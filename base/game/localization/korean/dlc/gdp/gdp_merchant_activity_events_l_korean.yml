l_korean:
 gdp_merchant_activity_events.0001.t: "충족되지 못한 식욕"
 gdp_merchant_activity_events.0001.desc: "유흥이 진행되는데 굶주린 문객들이 점점 더 동요하며 불평하는 소리가 들려왔다. 음식 접시에는 부스러기밖에 없었고, 서둘러 음식을 다시 가져오는 시종도 보이지 않았다.\n\n[guest.GetTitledFirstName](이)가 [guest.Custom('quirk_neg_present')]. 빈 잔을 옆에 둔 [guest.GetHerHis] 의문은 이러했다. \"대체 이 망할 연회에서는 뭘 해야 술을 받을 수 있는 거지?\""
 gdp_merchant_activity_events.0001.host: "\n\n혹시 나한테 행사를 살릴 기회가 온 걸까?"
 gdp_merchant_activity_events.0001.guest: "\n\n혹시 나한테 주최자 [host.GetTitledFirstNamePossessive] 행사를 살릴 기회가 온 걸까?"
 gdp_merchant_activity_events.0001.a: "\"자, [host.GetTitledFirstNamePossessiveNoTooltip] 주방을 계속 가동해라. 비용을 아끼지 말라!\""
 gdp_merchant_activity_events.0001.a.host: "\"좋다, 주방을 #EMP 제대로#! 가동해야겠군!\""
 gdp_merchant_activity_events.0001.b: "이거 내가 거래에서 유리한 입장이 된 것 같은데."
 gdp_merchant_activity_events.0001.c: "\"[guest.GetTitledFirstNameNoTooltip], 감사한 줄을 알아야지!\""
 gdp_merchant_activity_events.0001.d: "\"마음에 안 들면 나가게!\""
 gdp_merchant_activity_events.0001.e: "\"회사 창고를 둘러봐야겠군.\""
 gdp_merchant_activity_events.0005.t: "이국적인 요청"
 gdp_merchant_activity_events.0005.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))] [admirer.GetTitledFirstName](이)가 이쪽을 향해 손짓했다. [guest.GetTitledFirstName](와)과의 대화에 함께하자는 것이었다.\n\n[admirer.GetFirstNameNoTooltip](은)는"
 gdp_merchant_activity_events.0005.desc_esteemed: "온화한"
 gdp_merchant_activity_events.0005.desc_fallback: "유쾌한"
 gdp_merchant_activity_events.0005.desc_outro: "눈빛을 하고 웃으며 말했다. \"내 [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))]한테 그대가 해외에서 마주쳤던 [luxury_artifact.Custom('GetLuxuryArtifactSentiment')]에 관해 얘기하고 있었소. 자, 어서 그 [luxury_artifact.GetName](을)를 어떻게 얻었는지 말해 주시오!\"\n\n이 귀족은 내가 익살스럽게 농담을 던지고 방방 뛰며 동반자를 즐겁게 해 주길 바라는 게 분명했다."
 gdp_merchant_activity_events.0005.a: "\"그렇게 대단한 업적은 아닌데...\""
 gdp_merchant_activity_events.0005.b: "\"그것 때문에 이 목숨과 팔다리를 걸었습니다!\""
 gdp_merchant_activity_events.0005.b.success: "각색이 진짜 있었던 일처럼 들림"
 gdp_merchant_activity_events.0005.b.failure: "당신의 거짓말이 발각됨"
 gdp_merchant_activity_events.0005.c: "\"잘 들어 보시지요!\""
 gdp_merchant_activity_events.0005.d: "\"제가 [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]에서 거래하는 사치품에 비하면 아무것도 아닙니다.\""
 gdp_merchant_activity_events.0010.t: "선물 나누기"
 gdp_merchant_activity_events.0010.desc: "동료 상인인 [merchant.GetTitledFirstName](은)는 도착하자마자 자신의 재력을 과시했다. 자신의 값비싼 보석을 쓰다듬고, 고급 [merchant.Custom('RegionalFabric')] 의복을 뽐내면서 [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip]에서 뻔뻔스럽게도 자기가 파는 [good.Custom('GetTradeGood')](을)를 홍보하고 있었다.\n\n나는 [merchant.GetHerHim]가 경외심 가득한 눈으로 지켜보는 시끌벅적한 군중 앞에서 내 [ROOT.Char.Custom2('RelationToMeShort', receiver)] [receiver.GetTitledFirstName]에게 선물을 주는 모습을 보았다."
 gdp_merchant_activity_events.0010.a: "당하고 있을 수만은 없지..."
 gdp_merchant_activity_events.0010.b: "\"[merchant.GetTitledFirstNameNoTooltip], 정말 사려 깊은 선물이군!\""
 gdp_merchant_activity_events.0010.b.success: "[merchant.GetFirstNameNoTooltip](을)를 무안하게 함"
 gdp_merchant_activity_events.0010.b.failure: "당신이 어리석어 보임"
 gdp_merchant_activity_events.0010.c: "어쩌라고."
 gdp_merchant_activity_events.0010.d: "\"자신보다 나은 사람 앞에서 자랑하는 건 무례한 일이다.\""
 gdp_merchant_activity_events.0015.t: "농노 무리"
 gdp_merchant_activity_events.0015.desc: "좋은 음료와 풍성한 음식, 벽난로의 따스한 온기와 함께하는 연회는 바깥에 펼쳐진 차가운 밤과 좋은 대조를 이루었다.\n\n바람을 좀 쐬려고 연회에서 빠져나왔는데 궁핍한 군중이 눈에 들어왔다. 평민들이 연회가 끝나면 남은 부스러기라도 먹을 수 있지 않을까 하는 희망에 벽 근처를 서성이고 있었다."
 gdp_merchant_activity_events.0015.a: "저들이 배불리 먹고 즐기도록 하라. 비용은 내가 대겠다!"
 gdp_merchant_activity_events.0015.b: "귀족들과 [ROOT.Char.Custom('RegionalDrink')](이)나 즐기는 게 낫겠군."
 gdp_merchant_activity_events.0015.b.alcohol: "귀족들과 [ROOT.Char.Custom('RegionalAlcoholicDrink')](이)나 즐기는 게 낫겠군."
 gdp_merchant_activity_events.0015.c: "여기야말로 내가 #EMP 진정#! 속한 곳이다."
 gdp_merchant_activity_events.0015.d: "저리 썩 꺼져라, 쓰레기들!"
 custom.every_attending_noble: "참석 중인 모든 [noble|E] [character|E]"
 gdp_merchant_activity_events.0020.t: "주시자의 관점"
 gdp_merchant_activity_events.0020.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))] [other.GetTitledFirstName](이)가 이번 행사를 위해 가장 아름다운 [fake_artifact.GetNameNoTooltip](을)를 준비했다는 소식이 들려왔다.\n\n대회당에서 문제의 그 [other.GetWomanMan]이 눈부신 의복을 입고, 가슴에 목걸이를 한 모습이 보였다. 내가 다가가자 [other.GetSheHe|U]는 [other.Custom('quirk_pos_present')]. 그리고 이렇게 말했다. \"최근에 내가 산 물건을 보았는지 모르겠는데. 제법 비싸더군, 그렇지 않나?\"\n\n회당의 수많은 촛불이 따스한 빛을 드리웠고, 보석이 아름답게 반짝였다. 하지만 내 노련한 눈에는 이 보석의 수많은 결점이 보였다."
 gdp_merchant_activity_events.0020.a: "\"우습군요! [other.GetFirstNameNoTooltip]께서 이 장신구가 귀중품이라 생각하시는 모양입니다.\""
 gdp_merchant_activity_events.0020.b: "#weak *속삭임*#! \"이 싸구려 보석은 제가 대신 치워 드리지요.\""
 gdp_merchant_activity_events.0020.b.tt: "[attraction|E] [opinion|E] [artifact|E]을 획득함"
 gdp_merchant_activity_events.0020.b.equipped_tt: "[other.GetTitledFirstName]에게 [fake_artifact.GetName](을)를 입수했음."
 gdp_merchant_activity_events.0020.c: "\"정말 귀중한 물건이군요.\""
 fake_artifact_name: "보석 목걸이"
 fake_artifact_desc: "예쁘게 반짝이는 멋진 목걸이. 하지만 가까이서 살펴보면 보석이 엉성하게 세공되었다는 것이 티가 납니다."
 gdp_merchant_activity_events.0025.t: "좋은 여행길"
 gdp_merchant_activity_events.0025.desc: "회당의 웃음과 대화 사이로 뜻밖의 소리가 들려왔다."
 gdp_merchant_activity_events.0025.desc_ape: "#EMP 우 우!#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP 키 키!#!"
 gdp_merchant_activity_events.0025.desc_cont: "누가 연회에 [luxury_artifact.Custom('GetDomicileArtifactCreatureType')](을)를 데려왔다고?\n\n군중을 둘러보던 나는 동료 상인 [merchant.GetTitledFirstName](이)가 이 생물의 소유자라는 사실을 발견했다. [merchant.GetSheHe|U]가 내 호기심 어린 시선을 눈치채고는 [merchant.Custom('quirk_pos_present')]. 그러더니 이렇게 말했다. \"수도 없이 여행을 다녔는데, 그중 한 곳에서 이 괜찮은 표본을 찾아냈지. 실은 내가 자주 가는 멋진 시장이 있어. 우리 회사 비밀이라네.\" [merchant.GetSheHe|U]가 뿌듯한 웃음을 지으며 자기 코를 살짝 건드렸다."
 gdp_merchant_activity_events.0025.a: "\"아, 어딘지 알 것 같군!\""
 gdp_merchant_activity_events.0025.b: "\"혹시 위치가 어딘지 알려 줄 수 있나?\""
 gdp_merchant_activity_events.0025.b.success: "설득력 있는 주장을 펼침"
 gdp_merchant_activity_events.0025.b.failure: "설득력 있는 주장을 펼치지 못함"
 gdp_merchant_activity_events.0025.c: "\"여행에 대해 더 말해 주게!\""
 gdp_merchant_activity_events.0025.tt.menagerie: "#V $menagerie_acquisition_contract$#! [luxury_contract_i][luxury_contract|E] 생성"
 gdp_merchant_activity_events.0025.tt.curio: "#V $find_curio_contract$#! [luxury_contract_i][luxury_contract|E] 생성"
