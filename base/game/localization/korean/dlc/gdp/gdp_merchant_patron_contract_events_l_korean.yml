l_korean:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: [patron.GetTitleAsNameNoTooltip]의 [patron.Custom('GetRoomPlural')|U]"
 gdp_merchant_patron_contract.0001.desc: "[patron.GetTitledFirstName](은)는 훌륭한 사람이다. [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]의 귀족, 사제, 상인, 평민 모두가 [patron.GetHerHis] 관심과 후원을 두고 경쟁한다.\n\n우리 회사가 계속 [patron.GetHerHis] 호의를 사려면 진솔한 모습을 보이면서도 동시에 신중하게 나아가야 한다. 더 약삭빠른 경쟁자에게 가려지지도 않고, [patron.GetHerHis] 관심에서 벗어나서도 안 된다.\n\n우리의 사업은 언제나 [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 유력한 이들의 입에 오르내려야 한다."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: 성공!"
 gdp_merchant_patron_contract.0002.desc: "[patron.GetTitledFirstName](은)는 머나먼 땅과 이곳저곳을 누비는 상업의 세계에 대한 내 이야기에 걷잡을 수 없이 빠져들었고, 저녁마다 연회 식탁에서 내 말에 귀를 기울였다.\n\n[patron.GetFirstNameNoTooltip](이)가 우리를 귀중한 동반자이자 친구로 환영하고 있다는 사실을 알게 되었으니, 나도 안심한 채 회사로 돌아갈 수 있게 되었다.\n\n[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에서 우리의 평판이 상당히 높아졌으며, 내 영향력에 대한 소문도 분명 널리 퍼져 나갈 것이다."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: 실패!"
 gdp_merchant_patron_contract.0003.desc: "[patron.GetTitledFirstName](이)가 나를 점점 더 적게 부른다. 내가 뭐 잘못했나? [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 궁정 신하들이 보이던 공손한 태도도 변했다. [patron.GetHerHis] 불쾌한 감정을 증명하는 듯하다.\n\n내 이야기가 [patron.GetHerHim]를 지루하게 했던 걸까? 혹시 상업이 변덕스럽다고 너무 많이 불평해서 그런 걸까? 아니면 내가 #EMP 귀족#!의 보이지 않는 선이라도 넘었던 걸까?\n\n이제 회사로 돌아가는 것 말고는 할 수 있는 게 없다. 입은 피해를 완화하고, 일을 제대로 바로잡아야지..."
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "감명받은 후원자"
 gdp_impressed_patron_modifier_desc: "해당 상인의 환심을 사고자 하는 노력에 후원자가 감명받았습니다."
 gdp_impressed_patron_critical_modifier: "감명받은 후원자"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "멸시하는 후원자"
 gdp_dismissive_patron_modifier_desc: "해당 상인의 환심을 사고자 하는 노력에 후원자가 전혀 감명받지 않았습니다."
