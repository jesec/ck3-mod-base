l_korean:
 # Trade
 game_concept_trade: "무역"
 game_concept_trade_desc: "$game_concept_trade$은 [republics|E], [trade_leagues|E], [merchants|E]의 생계 수단입니다.\n\n[trade_routes|E]는 [trade_markets|E]에서 오가는 [goods|E]의 수입과 수출을 담당하며, 시장의 [needs|E] 및 [surpluses|E]의 경우 해당 시장을 구성하는 [baronies|E] 내 [buildings|E]에 따라 정해집니다.\n\n한편 판매 가격은 봉토의 [prosperity|E]에 따라 달라지며, 판매에 참여하는 인물들은 [competitiveness|E] 및 [monopolies|E]을 사용해 시장을 장악합니다. 이득을 높이려면 시장에서 거래하는 이들 모두 자신의 무역로가 보유한 [capacity|E] 및 길이를 증가시키기 위해 노력해야 하며, 무역로마다 시장과 무역품의 수를 늘려야 합니다.\n\n[adventurers|E] 및 [nomads|E]을 제외한 모든 [government_forms|E]가 $game_concept_trade$에 참여할 수 있습니다."
 game_concept_trade_good: "무역품"
 game_concept_trade_goods: "무역품"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "무역품의"
 game_concept_trade_goods_possessive: "무역품의"
 game_concept_good: "상품"
 game_concept_goods: "상품"
 game_concept_basic_trade_good: "기본 무역품"
 game_concept_basic_trade_goods: "기본 무역품"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$은 [distribution_route|E]에 의해 이동할 수 있는 [trade_goods|E]입니다.\n\n반면 [profit_route|E] 또는 [commission_route|E]는 아무 $game_concept_trade_goods$이나 무역할 수 있습니다."
 game_concept_market_toll: "시장 통행료"
 game_concept_market_tolls: "시장 통행료"
 game_concept_toll: "통행료"
 game_concept_tolls: "통행료"
 game_concept_market_toll_desc: "$game_concept_market_tolls$는 [trade_market|E] 내에서 이루어지는 모든 판매에 매겨지는 요금입니다.\n\n[market_owner|E]가 통제하며, 소유주는 통행료로 발생하는 모든 금액을 획득합니다.\n\n$game_concept_market_tolls$가 낮은 시장은 [merchants|E]에게 수익성이 더 좋습니다.\n\n$game_concept_market_tolls$가 높으면 $game_concept_market_owner_possessive$ [income|E]이 증가하지만, $game_concept_merchants$이 $game_concept_market$에서 $game_concept_goods$을 판매해 모든 [profit_route|E]에서 얻는 수익이 감소합니다. 시장의 $game_concept_tolls$가 너무 높다면, $game_concept_merchants$이 대신 통행료가 덜한 $game_concept_markets$으로 가서 판매하게 될 수도 있습니다.\n\n[market_owner|E] 및 그 [direct_vassals|E], [tributaries|E], [clients|E]는 통행료가 면제됩니다."
 game_concept_good_possessive: "상품의"
 game_concept_goods_possessive: "상품의"
 game_concept_trade_good_desc: "$game_concept_trade_goods$은 [market|E]에서 구매하고 판매할 수 있습니다. 전 세계 곳곳에서 다양한 상품이 거래되며 [realms|E]의 [needs|E]를 충족시킵니다."
 game_concept_trade_category: "상품 범주"
 game_concept_trade_categories: "상품 범주"
 game_concept_trade_category_short: "범주"
 game_concept_trade_categories_short: "범주"
 game_concept_trade_category_desc: "$game_concept_trade_categories$는 [trade_goods|E]의 집단입니다. [trade_markets|E]에는 종종 특정 범주의 상품에 대한 [need|E]가 생깁니다. 이 경우, 해당 유형 내의 어떤 상품이든 필요를 충족시킬 수 있습니다."
 game_concept_trade_expertise: "무역 전문성"
 game_concept_expertise: "전문성"
 game_concept_trade_expertise_desc: "$game_concept_trade_expertise$은 특정 [trade_category|E]에서 거래를 진행한 실무 경험을 나타냅니다. 활성화된 [trade_routes|E]의 [primary_good|E]으로 획득합니다. 전문성이 증가하면 해당 범주를 취급할 때 수익성이 더 높아지며, [expertise_levels|E]가 높으면 범주에 따라 더 많은 보너스를 획득합니다."
 game_concept_trade_expertise_progress: "무역 전문성 진행도"
 game_concept_expertise_progress: "전문성 진행도"
 game_concept_trade_expertise_progress_desc: "[expertise|E] 점수마다 인물의 다음 [expertise_level|E]로의 진행도가 증가합니다."
 game_concept_trade_expertise_level: "무역 전문성 단계"
 game_concept_expertise_level: "전문성 단계"
 game_concept_expertise_levels: "전문성 단계"
 game_concept_trade_expertise_level_desc: "[trade_category|E]의 $game_concept_trade_expertise_level$는 [trade_company|E]가 해당 범주의 무역에서 얼마나 능숙한지를 나타내는 등급입니다.\n\n활성화된 [trade_routes|E]에서 [expertise_progress|E]를 누적해 발전시킬 수 있으며, 각 단계는 추가 [trade|E] 보너스를 제공합니다.\n\n범주에서 진행 중인 무역이 없으면 단계가 점차 낮아집니다(#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! 월간 전문성 진행도)."
 game_concept_trade_market: "무역 시장"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "무역 시장"
 game_concept_trade_market_possessive: "무역 시장의"
 game_concept_trade_markets_possessive: "무역 시장의"
 game_concept_market: "시장"
 game_concept_markets: "시장"
 game_concept_market_possessive: "시장의"
 game_concept_markets_possessive: "시장의"
 game_concept_trade_market_desc: "$game_concept_trade_market$은 해당 시장이 아우르는 모든 [holdings|E]의 [production|E] 및 [needs|E]를 통합하는 무역 중심지입니다.\n\n시장에서 지역의 생산량은 먼저 [buildings|E]의 [needs|E] 충족에 사용됩니다. 남은 생산량은 판매할 수 있는 [surplus|E]가 되며, 남아 있는 수요는 수입으로 충족해야만 합니다. [trade_routes|E]는 여러 시장을 연결해 그 사이로 [goods|E]을 운송할 수 있게 합니다.\n\n각 시장은 [market_owner|E]가 보유한 [market_capital|E]를 중심으로 하며, [market_prosperity|E]가 높을수록 해당 시장이 무역상에게 제시하는 [sell_prices|E]이 더 좋아집니다."
 game_concept_market_prosperity: "시장 번영도"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$는 [market|E] 내 모든 [Concept( 'counties', '영지' )|E]의 평균 [prosperity|E] 단계입니다.\n\n$game_concept_market_prosperity$가 높으면 시장 내 [goods|E]의 [sell_prices|E]이 증가하며, 해당 시장은 [merchants|E]에게 수익성이 더 높은 목적지가 됩니다."
 game_concept_market_capital: "시장 중심지"
 game_concept_market_capitals: "시장 중심지"
 game_concept_market_capital_possessive: "시장 중심지의"
 game_concept_market_capitals_possessive: "시장 중심지의"
 game_concept_market_capital_desc: "$game_concept_market_capital$는 [market|E]의 중심에 있는 [holding|E]로, 보통은 시장이 포괄하는 [duchy|E]의 [de_jure|E] 수도입니다.\n\n시장 중심지는 게임 시작 때 정해지며 이동하지 않습니다. 해당 [barony|E]을 보유하는 인물이 [market_owner|E]가 되며 시장을 지배합니다."
 game_concept_market_owner: "시장 소유주"
 game_concept_market_owners: "시장 소유주"
 game_concept_market_owner_possessive: "시장 소유주의"
 game_concept_market_owners_possessive: "시장 소유주의"
 game_concept_owner: "소유자"
 game_concept_owners: "소유자"
 game_concept_owner_possessive: "소유자의"
 game_concept_owners_possessive: "소유자의"
 game_concept_market_owner_desc: "$game_concept_market_owner$는 [market|E]의 [market_capital|E]를 보유하며, 이에 대한 지배 권리는 전쟁 또는 상속을 통한 해당 [barony|E]의 소유권 변경과 함께 이전됩니다.\n\n시장 소유주는 시장을 지배하며, 해당 시장에 연결된 [distribution_routes|E]를 생성할 수 있습니다. 또한 [commission_routes|E]에 있어 필수적인 동업자로서, 그 안에서 [monopolies|E] 권리를 부여하고 [market_toll|E]를 설정할 수 있습니다."
 game_concept_market_priority: "시장 우선순위"
 game_concept_market_priorities: "시장 우선순위"
 game_concept_market_priority_desc: "$game_concept_market_priority$는 [market|E]의 [holdings|E]에서 [needs|E]를 충족할 때, 해당 봉토가 혜택받는 순서를 이릅니다.\n\n첫 순서는 [market_capital|E]며, 다음으로는 시장 중심지의 나머지 [Concept( 'county', '영지' )|E]가 되고, 이어서 [county_capital|E]의 [settlement_size|E]가 큰 순서대로 나머지 [Concept( 'counties', '영지' )|E]가 자리합니다.\n\n각 [Concept( 'county', '영지' )|E] 내에서는 [county_capital|E]가 우선하며, 영지의 나머지 $game_concept_holdings$가 [settlement_size|E] 순서대로 그 뒤를 따릅니다.\n\n[holding|E] 내에서 [districts|E] 및 [buildings|E] 순서를 다시 지정해 특정한 [building|E]의 [needs|E]를 먼저 충족할 수 있습니다."
 game_concept_market_share: "시장 점유율"
 game_concept_market_shares: "시장 점유율"
 game_concept_market_share_desc: "$game_concept_market_share$은 [market|E]에서 [profit_route|E]가 거래할 수 있는 [trade_good|E]의 양으로, 당신의 $game_concept_competitiveness$에 따라 정해집니다.\n\n예시로 특정 $game_concept_good$의 무역에서 다른 이들의 경쟁력을 합친 것과 동일한 양의 $game_concept_competitiveness$을 보유한다면 당신의 $game_concept_market_share$은 50%가 됩니다. 해당 $game_concept_good$을 거래하는 다른 인물이 없다면 당신의 $game_concept_market_share$은 언제나 100%가 됩니다.\n\n이 경우에는 충분한 [capacity|E]만 보유하고 있다면, 모든 [surplus|E]를 구매하거나 판매해서 $game_concept_market$의 모든 [needs|E]를 충족할 수도 있습니다."
 game_concept_trade_route: "무역로"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "무역로"
 game_concept_trade_route_possessive: "무역로의"
 game_concept_trade_routes_possessive: "무역로의"
 game_concept_route: "행로"
 game_concept_routes: "행로"
 game_concept_route_possessive: "행로의"
 game_concept_routes_possessive: "행로의"
 game_concept_trade_route_desc: "[character|E]은 $game_concept_trade_route$를 통해 [trade|E]에 참여하여 [gold|E]를 획득하거나 자신의 [realm|E]의 수요를 충족시킬 수 있습니다. 이러한 경로에서는 여러 [markets|E]이 [goods|E]을 교환하며, 한쪽 시장의 [surplus|E]를 통해 다른 시장의 [needs|E]가 충족됩니다.\n\n무역로에는 세 가지 유형이 있습니다.\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E]: [dukes|E] 이상의 영주가 자신이 보유한 [buildings|E]의 [needs|E]를 충족하고자 사용합니다.\n$EFFECT_LIST_BULLET$[profit_route|E]: [merchants|E] 및 [republican|E] 영주가 [gold|E]를 획득하기 위해 사용합니다.\n$EFFECT_LIST_BULLET$[commission_route|E]: 수익 행로와 비슷하지만, 지주 영주가 일정 시간 내에 수요를 충족하고자 상인에게 부여하며 대금은 선금으로 한 번에 지급합니다.#!"
 game_concept_distribution_route: "유통 행로"
 game_concept_distribution_routes: "유통 행로"
 game_concept_distribution: "유통 행로"
 game_concept_distribution_route_possessive: "유통 행로의"
 game_concept_distribution_routes_possessive: "유통 행로의"
 game_concept_distribution_route_desc: "$game_concept_distribution_route$는 [trade_route|E]의 한 유형으로, [dukes|E] 이상의 인물이 [realm|E]의 공급을 충족하고자 사용합니다.\n\n두 [markets|E]을 연결하며, 한 곳의 $game_concept_market$에 [surplus|E]가 발생하면 다른 쪽 시장의 [needs|E] 충족에 사용됩니다. 다만 $game_concept_distribution_routes$는 오직 [basic_trade_goods|E]만 옮길 수 있습니다."
 game_concept_profit_route: "수익 행로"
 game_concept_profit_routes: "수익 행로"
 game_concept_profit: "수익"
 game_concept_profit_route_possessive: "수익 행로의"
 game_concept_profit_routes_possessive: "수익 행로의"
 game_concept_profit_route_desc: "$game_concept_profit_route$는 [trade_route|E]의 한 유형으로, [merchants|E] 및 [republican|E] [rulers|E]가 [gold|E]를 획득하고자 사용합니다.\n\n[trade_goods|E]이 [surplus|E] 상태인 곳에서 해당 상품을 값싸게 구매한 뒤, [needs|E]가 높은 곳에서 해당 상품을 팔아 [buy_price|E]과 [sell_price|E] 사이의 차익에서 이득을 챙깁니다."
 game_concept_trade_route_modifier: "무역로 변화 요소"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "무역로 변화 요소"
 game_concept_trade_route_modifier_desc: "이 [modifier|E]는 소유자의 모든 [trade_routes|E]에 적용됩니다. 변화시킬 수 있는 속성은 다음과 같습니다.\n$BULLET_WITH_TAB$[competitiveness_i][trade_competitiveness|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[route_i][route_length|E]\n$BULLET_WITH_TAB$[trade_goods_i][max_trade_goods_short|E]\n$BULLET_WITH_TAB$[market_i][max_trade_markets_short|E]"
 game_concept_commission_route: "의뢰 행로"
 game_concept_commission_route_desc: "$game_concept_commission_route$는 [merchant|E]이 [merchant_patron|E]를 위해 충족시켜야 하는 [trade_route|E]입니다.\n\n$game_concept_merchant$은 $game_concept_merchant_patron$에게 대가를 받고, $game_concept_commission_possessive$ 기간 동안 특정 [trade_good|E]을 지정된 [trade_market|E]으로 가져와야 합니다.\n\n$game_concept_merchant$은 한 번에 #V 1#!개의 $game_concept_commission_route$를 보유할 수 있습니다."
 game_concept_commission_routes: "의뢰 행로"
 game_concept_commission_route_possessive: "의뢰 행로의"
 game_concept_commission_routes_possessive: "의뢰 행로의"
 game_concept_commission: "의뢰"
 game_concept_commissions: "의뢰"
 game_concept_commission_possessive: "의뢰의"
 game_concept_commissions_possessive: "의뢰의"
 game_concept_commissioned_route: "의뢰 행로"
 game_concept_commissioned_routes: "의뢰 행로"
 game_concept_trade_route_length: "무역로 길이"
 game_concept_route_length: "행로 길이"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$는 [profit_route|E]가 연결할 수 있는 최대 [baronies|E]의 수로, 바다 및 항해 가능한 강도 포함됩니다. 이는 [company_buildings|E]을 강화하여 늘릴 수 있습니다."
 game_concept_max_trade_goods: "최대 무역품"
 game_concept_max_trade_goods_short: "무역품"
 game_concept_max_trade_goods_desc: "$game_concept_max_trade_goods$은 [route|E]에서 무역할 수 있는 서로 다른 [good|E] 유형의 수입니다. 이는 [company_buildings|E]을 강화하여 늘릴 수 있습니다.\n\n[profit_route|E]는 보너스에 상관없이 [goods|E]을 최대 #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#!까지만 운송할 수 있습니다."
 game_concept_max_trade_markets: "최대 무역 시장"
 game_concept_max_trade_markets_short: "무역 시장"
 game_concept_max_trade_markets_desc: "$game_concept_max_trade_markets$은 [character|E]이 [profit_route|E]에서 들르기로 선택할 수 있는 [markets|E]의 수입니다. 이는 [company_buildings|E]을 강화하여 늘릴 수 있습니다."
 game_concept_trade_route_capacity: "무역로 수용량"
 game_concept_trade_route_capacity_short: "무역 수용량"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "수용량"
 game_concept_trade_route_capacity_desc: "$game_concept_trade_route_capacity$은 [profit_route|E]에서 언제든 무역할 수 있는 [trade_goods|E]의 양을 결정합니다. 이는 [company_buildings|E]을 강화하여 늘릴 수 있습니다."
 game_concept_primary_good: "주요 상품"
 game_concept_primary_goods: "주요 상품"
 game_concept_primary_good_desc: "[merchants|E] 및 [patricians|E]는 하나의 [trade_good|E]을 [trade_routes|E]의 $game_concept_primary_good$으로 가집니다.\n\n이 상품을 무역하면 해당 상품의 [trade_category|E]에서 [trade_expertise|E]을 보유하게 됩니다."
 game_concept_road: "도로"
 game_concept_roads: "도로"
 game_concept_road_possessive: "도로의"
 game_concept_roads_possessive: "도로의"
 game_concept_road_desc: "[road|E]는 두 [markets|E]을 연결하며, 그 사이로 [trade_routes|E]가 이동할 수 있습니다.\n\n$game_concept_road$를 따라가는 $game_concept_trade_routes$는 해당 도로에서 혜택을 받으며, 주로 해당 무역로의 [trade_route_length|E]가 증가하게 됩니다.\n\n$game_concept_road$가 지나가는 [barony|E] 또한 직접적인 혜택을 받습니다. 이러한 혜택에는 [armies|E] 이동 속도 향상 등이 있습니다.\n\n$game_concept_road$가 제공하는 혜택은 [road_tier|E]에 따라 증가합니다."
 game_concept_road_tier: "도로 등급"
 game_concept_road_tiers: "도로 등급"
 game_concept_road_tier_short: "등급"
 game_concept_road_tier_desc: "$game_concept_road_tier$은 [road|E]의 개발 단계입니다. 개발되지 못한 거친 상태의 길에서 잘 다듬어진 간선 도로까지 발전할 수 있습니다.\n\n도로를 따라 [trade|E]이 더 많이 오갈수록 도로의 등급이 올라가며, 등급이 오를 때마다 이전 등급보다 더 많은 사용과 더 긴 시간이 필요합니다. 등급이 높으면 도로의 효과가 강화됩니다. 해당 도로를 사용하는 [trade_routes|E]의 [trade_route_length|E]가 증가하며, 이 도로가 지나가는 [baronies|E]에 더 강력한 보너스를 제공합니다.\n\n도로는 지도에 설정된 등급에서 시작하며, 게임 시작 시에는 최하위 등급보다 높은 등급의 도로만 표시됩니다."
 game_concept_building_need: "건물 수요"
 game_concept_building_needs: "건물 수요"
 game_concept_need: "수요"
 game_concept_needs: "수요"
 game_concept_building_need_desc: "[building|E]은 [trade_goods|E]에 대한 $game_concept_needs$를 보유하며, 수요가 충족되면 보너스를 제공합니다.\n\n$game_concept_needs$는 특정 [good|E] #weak ([GetTradeGoodType('trade_good_wine').GetName] 등)#! 또는 특정 [trade_category_short|E] #weak ([GetTradeGoodCategory('trade_category_alcohol').GetName] 등)#!의 아무 $game_concept_good$을 대상으로 생길 수 있습니다.\n\n모든 $game_concept_needs$는 지역 [market|E]의 $game_concept_trade_goods$으로 충족됩니다. 지역 $game_concept_market$에 해당 $game_concept_good$의 [surplus|E]가 없다면, 이 $game_concept_goods$은 [market_priority|E]에 따라 분배됩니다.\n\n$game_concept_needs$는 항상 선택 사항이며, 충족하지 못해도 불이익은 없습니다."
 game_concept_market_balance: "시장 수급량"
 game_concept_market_balances: "시장 수급량"
 game_concept_market_balance_short: "수급량"
 game_concept_market_balances_short: "수급량"
 game_concept_market_balance_desc: "각 [market|E]은 [trade_good|E] 또는 [goods|E] 범주마다 수급량을 보유합니다.\n\n수급량이 양수라면 [surplus|E] 상태입니다.\n\n수급량이 음수라면 시장의 [buildings|E]에 아직 충족되지 못한 [needs|E]가 있다는 뜻입니다."
 game_concept_trade_surplus: "시장 잉여"
 game_concept_trade_surpluses: "시장 잉여"
 game_concept_surplus: "잉여"
 game_concept_surpluses: "잉여"
 game_concept_trade_surplus_desc: "[market|E]에서 [trade_good|E]의 [production|E]이 [need|E]보다 많다면, 해당 상품은 $game_concept_surplus$ 상태입니다.\n\n이는 $game_concept_market$ 내 모든 [buildings|E]의 $game_concept_needs$가 충족되었다는 뜻입니다.\n\n이 초과 생산량은 [trade_routes|E]를 통해 다른 $game_concept_markets$으로 수출할 수 있습니다."
 game_concept_trade_deficit: "시장 결핍"
 game_concept_trade_deficits: "시장 결핍"
 game_concept_deficit: "결손"
 game_concept_deficits: "결손"
 game_concept_trade_deficit_desc: "[market|E]에서 [trade_good|E]의 [needs|E]가 그 [production|E]이나 수입량보다 많다면, 해당 상품은 $game_concept_deficit$ 상태입니다.\n\n이는 $game_concept_market$ 내 일부 [buildings|E]의 $game_concept_needs$가 충족되지 못했다는 뜻입니다.\n\n[trade_routes|E]를 통한 수입으로 $game_concept_deficit$을 메울 수 있습니다."
 game_concept_production: "생산량"
 game_concept_productions: "생산량"
 game_concept_trade_goods_production: "무역 상품 생산량"
 game_concept_produced: "생산"
 game_concept_production_desc: "$game_concept_production$은 [districts|E]와 그 [buildings|E]에서 매달 생산한 [trade_good|E]의 양입니다.\n\n[market|E] 내 $game_concept_production$이 해당 시장의 상품에 대한 [needs|E]를 능가하면, 초과한 생산량은 [surplus|E]가 되어 [trade|E]이 가능해집니다. 반대로 $game_concept_production$이 부족하면 수요를 맞추지 못합니다."
 game_concept_potential_production: "생산 잠재력"
 game_concept_potential_productions: "생산 잠재력"
 game_concept_potential_production_desc: "각 [county_possessive|E] 생산 잠재력에 따라 [county_capital|E]의 [resource_district|E]에서 어떤 [trade_goods|E] 원자재를 생산하는지가 정해집니다."
 game_concept_sell_price: "판매 가격"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "판매 가격"
 game_concept_sell_price_desc: "[market_possessive|E] $game_concept_sell_price$은 [need|E]가 있는 [trade_good|E]의 [gold|E] 가치입니다.\n\n[profit_routes|E] 소유주는 $game_concept_market$에서 자신의 [route|E]가 $game_concept_market_possessive$ $game_concept_needs$를 충족하고자 $game_concept_goods$을 판매할 때, 그 $game_concept_trade_good$의 $game_concept_sell_price$에 해당하는 이득을 획득합니다.\n\n[landed|E] [rulers|E]의 경우 더 많은 [merchants|E]이 $game_concept_market$으로 이끌리고, [tolls|E] 수입을 증가시키거나, $game_concept_need$가 충족될 가능성으로 인해 더 높은 $game_concept_sell_price$으로 이득을 볼 수 있습니다.\n\n$game_concept_tolls$는 판매하는 $game_concept_good$마다 부과되며 실제 $game_concept_sell_price$을 감소시킵니다.\n\n판매 가격은 대비되는 값인 [buy_price|E]과 마찬가지로 [market_prosperity|E]를 따라 증가합니다."
 game_concept_buy_price: "구매 가격"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "구매 가격"
 game_concept_buy_price_desc: "[market_possessive|E] $game_concept_buy_price$은 [surplus|E] 상태의 [trade_good|E]을 구매할 때 드는 [gold|E] 비용입니다.\n\n[profit_routes|E] 소유주는 $game_concept_market$에서 자신의 [route|E]가 $game_concept_surplus$ 상태의 $game_concept_goods$을 구매할 때, 그 $game_concept_trade_good$의 $game_concept_buy_price$에 해당하는 비용을 치릅니다.\n\n구매 가격은 대비되는 값인 [sell_price|E]과 마찬가지로 [market_prosperity|E]를 따라 증가합니다."
 game_concept_trade_monopoly: "무역 독점"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "무역 독점"
 game_concept_monopoly: "독점"
 game_concept_monopolies: "독점"
 game_concept_trade_monopoly_desc: "$game_concept_monopoly$의 소유자는 [market|E]에서 [goods|E]을 사고팔 수 있는 유일한 인물이 됩니다.\n\n$game_concept_monopoly$은 다양한 방식으로 적용됩니다.\n #indent_newline:4    $EFFECT_LIST_BULLET$일반 $game_concept_monopoly$은 하나의 [trade_category|E]에 적용되지만, [complete_monopoly|E]은 모든 상품 범주에 적용됩니다.\n$EFFECT_LIST_BULLET$[exploitative_monopoly|E] 소유자는 [needs|E]가 충족되기 전에 $game_concept_goods$ [production|E]을 먼저 구매할 수 있습니다.\n$EFFECT_LIST_BULLET$$game_concept_monopoly$은 [merchant|E], [republic|E] 또는 [trade_league|E] 전체에서 소유할 수 있습니다.#!\n\n$game_concept_monopolies$은 $request_trade_monopoly_for_character_interaction|V$ 상호작용으로 획득할 수 있습니다."
 game_concept_complete_monopoly: "완전 독점"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "완전 독점"
 game_concept_complete_monopoly_short: "완전"
 game_concept_complete_monopoly_desc: "$game_concept_complete_monopoly$은 [market|E] 내 모든 [trade_good|E]에 동시에 적용됩니다. 기본 [monopoly|E]과는 달리, 하나의 [trade_category|E]에만 국한되지 않습니다."
 game_concept_exploitative_monopoly: "착취 독점"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "착취 독점"
 game_concept_exploitative_monopoly_short: "착취"
 game_concept_exploitative_monopoly_desc: "$game_concept_exploitative_monopoly$은 [monopoly|E]의 한 유형으로, 이 독점의 소유자는 [market|E]의 [production|E]을 직접 구매할 수 있습니다.\n\n보통은 [surplus|E]만을 구매할 수 있습니다. 하지만 $game_concept_exploitative_monopoly$ 소유자는 지역 [building_needs|E]가 충족되기 전에 $game_concept_market$ 내 [buildings|E]의 $game_concept_production$을 먼저 구매할 수 있습니다."
 game_concept_trade_competitiveness: "무역 경쟁력"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "경쟁력"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "각 [profit_route|E]는 $game_concept_competitiveness$을 보유합니다. 이는 해당 행로가 [market|E]에서 무역할 수 있는 [trade_goods|E]의 양을 다른 $game_concept_profit_routes$와 비교하여 나타낸 수치입니다.\n\n보유한 특정 $game_concept_trade_good$에 대한 총 $game_concept_competitiveness$이 높을수록 [market_share|E]도 높아집니다.\n\n$game_concept_market$ 내 [monopoly|E]이 존재한다면, 해당 $game_concept_monopoly$의 소유자만 $game_concept_competitiveness$을 비교하게 됩니다."
 game_concept_competitive_pressure: "경쟁 압력"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "$game_concept_competitive_pressure$은 [merchant|E]이 획득한 단기적인 상업 영향력입니다. 고유한 [decisions|E] 또는 [interactions|E]에 사용해 특정 [trade_routes|E]에 특수한 우위를 부여할 수 있습니다."
 game_concept_put_on_notice: "견제"
 game_concept_put_on_notice_desc: "$game_concept_put_on_notice$는 [GetPerk('prepared_conscription_perk').GetName(GetPlayer)] [perk|E]로 잠금 해제되는 [character_interaction|E]입니다. [competitive_pressure_i][competitive_pressure|E]을 소모해, 당신의 [trade_route|E] [trade_markets|E] 중 한 곳에 있는 [merchant|E]을 상대로 경쟁자에 맞서는 [trade_opportunity|E]를 시작합니다."
 game_concept_ruthless_oversight: "무자비한 감독"
 game_concept_ruthless_oversight_desc: "$game_concept_ruthless_oversight$은 [GetPerk('fear_tax_perk').GetName(GetPlayer)] [perk|E]로 잠금 해제되는 [character_interaction|E]입니다. [dread|E], [opinion|E], [company_sentiment|E]을 대가로 인물의 [court_position|E] [aptitude|E]을 개선합니다."
 game_concept_request_merchant_charter: "상업 특허장 요청"
 game_concept_request_merchant_charter_desc: "$game_concept_request_merchant_charter$은 [merchant|E]이 [merchant_patron|E]에게 [charter|E]을 요청해 현지 [market|E]에서 특별한 권리를 갖도록 해 주는 [character_interaction|E]입니다."
 game_concept_monopolize_trade: "무역 독점"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "$game_concept_monopolize_trade$은 [merchant|E]이 [market_owner|E]에게 [gold|E]를 내는 대가로 [trade_monopoly|E]을 획득하는 [character_interaction|E]입니다."
 game_concept_trader: "무역상"
 game_concept_traders: "무역상"
 game_concept_trader_possessive: "무역상의"
 game_concept_traders_possessive: "무역상의"
 game_concept_trader_desc: "$game_concept_trader$은 [trade_route|E] 감독을 위해 배정된 [character|E]입니다.\n\n무역상은 행로 소유자의 [associate|E] 또는 [courtier|E]여야 하며, 한 번에 하나의 행로만 감독할 수 있습니다. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\n각 무역상은 행로의 특정 측면을 향상하는 임무를 맡습니다. 해당 임무에 대한 무역상의 [aptitude|E]은 [skills|E]에 따라 정해집니다.\n\n행로에서 업무를 수행하는 무역상은 각 [trade_market|E]에서 개인적인 [schemes|E]을 진행합니다. 모략에 실패하는 경우, [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )] [trait|E]을 보유하지 않았던 무역상은 해당 특성을 획득하게 됩니다. 이 특성을 이미 보유하고 있던 무역상은 무작위 [GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )] [trait_level_track|E]($trait_track_caravaneer$, $trait_track_artisan$, 또는 $trait_track_creditor$)에서 소량의 [trait_level_track_xp|E]를 획득합니다."
 game_concept_trader_council: "또한 소유자의 [spouse|E]인 경우를 제외하면 [council|E]에 참여할 수 없습니다."
 game_concept_trader_council_merchant: "소유자의 [spouse|E] 및 [deputies|E] 또한 $game_concept_traders$이 될 수 있습니다. 다만 [GetCourtPositionType('partner_court_position').GetName()] 및 [GetCourtPositionType('travel_leader_court_position').GetName()]의 경우는 제외입니다."
 #Merchant
 game_concept_merchant: "상인"
 game_concept_merchants: "상인"
 game_concept_merchant_possessive: "상인의"
 game_concept_merchants_possessive: "상인의"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "$game_concept_merchant$은 [company|E]의 일부로서 [trade|E]에 참여하는 [unlanded|E] [character|E]입니다.\n\n상인은 [trade_markets|E]의 [building_needs|E]를 충족하고자 노력합니다. 이들이 개인적인 부를 축적하고 사회적 지위를 향상하는 과정에서 경제가 활성화됩니다. 이 두 목표에서는 [gold|E]보다 [prestige|E]이 더 중요합니다. 위신은 [merchant_patron|E] 및 [associates|E]들과의 관계에서 상인의 입지를 높이고, 상인에게 힘을 실어주어 [trade_routes|E]를 확장하며 궁극적으로는 [trade_monopoly|E]을 확보하게 돕습니다."
 game_concept_merchant_family: "상인 가문"
 game_concept_merchant_families: "상인 가문"
 game_concept_merchant_family_possessive: "상인 가문의"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$은 [merchants|E] 또는 [republicans|E]처럼 무역에 참여하는 [houses|E]입니다. 이들은 [company|E]를 보유하고, [house_head|E]의 소유이며 그 통제를 받습니다. 봉역의 [trade|E] 및 [prosperity|E]에 있어 중요한 부분을 차지합니다."
 game_concept_associate: "사원"
 game_concept_associates: "사원"
 game_concept_associate_possessive: "사원의"
 game_concept_associates_possessive: "사원의"
 game_concept_associate_desc: "$game_concept_associates$은 [merchant|E] [company|E]에 속한 [unlanded|E] 인물입니다. 이들은 지주 영주의 [courtiers|E]와 비슷한 기능을 수행하며, [traders|E]으로서 [trade_routes|E]를 관리하고 [deputies|E]이 될 수 있습니다."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "대리인"
 game_concept_deputies: "대리인"
 game_concept_deputy_possessive: "대리인의"
 game_concept_deputies_possessive: "대리인의"
 game_concept_deputy_desc: "$game_concept_deputies$은 [merchant_families|E] 및 [companies|E]를 위해 일하며 다양한 기능을 수행합니다. 이들의 역할은 [company|E] [associates|E]에게 부여되는 [court_positions|E]와 비슷하며, 자신이 보유한 [aptitude|E]에 따라 임무 수행의 성공이 정해집니다."
 game_concept_company: "회사"
 game_concept_companies: "회사"
 game_concept_company_possessive: "회사의"
 game_concept_trade_company: "무역 회사"
 game_concept_trade_companies: "무역 회사"
 game_concept_company_desc: "$game_concept_trade_companies$는 [merchant_family_possessive|E] 작전 기지 역할을 하며, 회사와 연관된 모든 [trade_routes|E]가 시작되는 곳입니다.\n\n각 [GetGovernment( 'merchant_government' ).GetName]에는 $game_concept_trade_company$ [domicile|E]가 있습니다. [merchant_patron|E]가 존재하는 경우, $game_concept_merchant_possessive$ $game_concept_domicile$는 보통 [merchant_patron_possessive|E] [holding|E] 내에 위치합니다.\n\n[company_buildings|E]은 회사의 [domicile_buildings|E]로, 무역과 해당 건물에 연계된 모두에게 보너스를 제공합니다. 또한 $game_concept_company$는 [associates|E]과 그 가족 구성원, [deputies|E]으로 고용될 수 있는 [knights|E]에게 거주지를 제공합니다.\n\n#WEAK [courts|E]과 마찬가지로, $game_concept_companies$는 숫자는 적지만 초상화를 가질 정도의 중요도가 없는 무명의 [characters|E]들을 포함합니다.#!"
 game_concept_company_building: "회사 건물"
 game_concept_company_buildings: "회사 건물"
 game_concept_company_buildings_short: "건물"
 game_concept_company_building_desc: "$game_concept_company_buildings$은 [company|E]의 [domicile_buildings|E]입니다. 주로 [trade|E] 능력을 향상하며 여기에는 [trade_routes|E]의 [capacity|E], [route_length|E], [max_trade_goods_short|E], [max_trade_markets_short|E]도 포함됩니다."
 game_concept_usury: "고리대금업"
 game_concept_usurer: "고리대금업자"
 game_concept_usurers: "고리대금업자"
 game_concept_usurer_possessive: "고리대금업자의"
 game_concept_usurers_possessive: "고리대금업자의"
 game_concept_usurious: "고리대금업"
 game_concept_interest: "이자"
 game_concept_usury_desc: "$game_concept_usury$은 $game_concept_interest$를 받고 [gold|E]를 [lending|E]해 주는 행위입니다. 이 행위가 정직한 사업인지, [sin|E]인지는 [rite|E]의 [GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip] [doctrine|E]에 따라 정해집니다.\n\n고리대금업이 규탄받는 교파에서 [merchant|E]은 $loan_money_interaction|V$ [interaction|E]을 통해 생성한 모든 [loan|E]마다 [piety|E]를 상실합니다. $company_purpose_creditor|V$ 목적으로 운영되는 [company|E]의 경우, 일단 $game_concept_interest$가 공개되면 회사의 소유주는 영구적으로 $game_concept_usurer$라는 평판을 얻게 됩니다.\n\n#weak 일부 $game_concept_rites$에서는 $game_concept_interest$를 받고 대출해 주는 행위를 해당 [religion|E] 내에서만 금지하므로, $game_concept_merchants$은 해당 종교를 믿는 이를 제외한 다른 모두에게 자유롭게 대출이 가능합니다.#!"
 game_concept_loan: "대출"
 game_concept_loans: "대출"
 game_concept_loan_possessive: "대출의"
 game_concept_loans_possessive: "대출의"
 game_concept_loaned: "대출"
 game_concept_lending: "대출"
 game_concept_loan_desc: "$game_concept_loan$은 나중에 상환할 것으로 기대하며 빌려주는 [gold_i|E][gold|E]의 총합으로, $game_concept_interest$가 있는 경우도 있고 없는 경우도 있습니다.\n\n$game_concept_loans$은 보통 [debt|E] 상태거나 [war|E] 또는 다른 지출로 추가 자금이 필요한 [ruler|E]가 받습니다.\n\n$game_concept_loans$은 공개적으로 명시된 $game_concept_interest$, 숨겨진 $game_concept_interest$ 또는 $game_concept_interest$ 없이 받을 수 있으며, [faiths|E]마다 [usury|E]을 대하는 관점이 다릅니다.\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help $game_concept_loan$은 해당 대출에 합의한 인물들이 세상을 떠나도 지속될 수 있습니다. 양측 중 어느 한쪽이 사망하는 경우, [heir|E]가 있다면 대출은 해당 후계자에게 넘어갑니다.#!"
 loan_repayment_help: "#help [debtor|E]는 [GetDecisionWithKey('repay_loan_decision').GetName] [decision|E]을 사용해 $game_concept_loans$을 상환할 수 있으며, [creditor|E]는 #V 2#!년 이상이 지나면 #V $demand_repayment_interaction$#! [interaction|E]으로 대출금 상환을 요구할 수 있습니다.\n\n[GetLaw('company_purpose_creditor').GetName] [company_purpose|E]을 보유한 [merchants|E]은 [GetCourtPositionType( 'bailiff_court_position' ).GetName()]을 고용하고 #V $bailiff_collect_loans$#! [court_position_task|E]#!를 사용해 시간이 지남에 따라 [loans|E]을 상환받을 수 있습니다."
 game_concept_merchant_patron: "후원자"
 game_concept_merchant_patrons: "후원자"
 game_concept_merchant_patron_possessive: "후원자의"
 game_concept_merchant_patron_desc: "$game_concept_merchant_patron$는 [merchant_possessive|E] [domicile|E]가 위치한 [holding|E]의 [ruler|E]입니다.\n\n$game_concept_merchant$은 $game_concept_merchant_patron$의 [client|E]로 간주되며, 후견자에게 [taxes|E]을 내야 합니다."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "피후견자 상인"
 game_concept_client_merchants: "피후견자 상인"
 game_concept_client_merchant_possessive: "피후견자 상인의"
 game_concept_client: "피후견자"
 game_concept_client_possessive: "피후견자의"
 game_concept_clients: "피후견자"
 game_concept_client_merchant_desc: "$game_concept_client_merchant$은 [merchant|E] [character|E]입니다. 이 인물은 자신의 [merchant_patron|E]가 되는 [landed|E] [ruler|E]의 [realm|E] 내에 [company|E]를 보유합니다.\n\n$game_concept_client_merchant$은 후원자에게 [trade|E] 수입의 일부를 제공합니다. 이들은 후견자를 상대로 하는 전쟁이나 후견자에 맞서는 [faction|E]에 합류할 수 없으며, 회사를 다른 곳으로 옮기지 않는 한 후견자에게서 벗어날 수 없습니다."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "봉역 강탈"
 game_concept_seize_realm_cb_desc: "[merchant|E]이 [republic|E]를 수립하고 지주 상태가 될 수 있게 해 주는 [casus_belli|E]입니다. 공격자는 #V $gdp_merchant_seize_realm_call_debtor_interaction$#! [interaction|E]을 사용하면 @unspent_strong_hook_icon! [strong_hooks|E] #weak ($strong_indebted_hook$ 또는 $strong_loan_hook$)#!을 소모해 [independent|E] [rulers|E]에게 [allies|E]으로 [war|E]에 참전하게 강요할 수 있습니다."
 game_concept_company_purpose: "회사 목적"
 game_concept_company_purposes: "회사 목적"
 game_concept_company_purpose_desc: "$game_concept_company_purposes$은 [company|E]와 해당 회사를 보유한 [merchant_family|E]의 성격을 정하는 지령입니다.\n\n회사는 대금업, 가족적인 유대, 회사에서 다루는 상품의 품질과 희귀도, 또는 거리와 문화를 이어주는 연결망에 집중할 수 있습니다.\n\n각 목적에 따라 고유한 [interactions|E], [deputy|E] 직위 및 [trade|E] 보너스를 제공합니다."
 game_concept_trade_acumen: "무역 상재"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "상재"
 game_concept_trade_acumen_desc: "$game_concept_acumen$는 [merchant|E] [company|E]가 모든 [trade_categories|E]에서 [trade|E]으로 축적한 [gold|E]의 총액입니다.\n\n상재를 사용해 다른 [company_sizes|E]를 잠금 해제할 수 있으며, 상재는 소모할 수 없습니다."
 game_concept_company_size: "회사 규모"
 game_concept_company_sizes: "회사 규모"
 game_concept_company_size_desc: "$game_concept_company_size$는 [trade|E]에서 [merchant_family_possessive|E] 장악력을 나타내며, 단계마다 회사의 [competitiveness|E] 및 무역 능력이 대폭 증가합니다. 더 큰 규모로 성장하려면 [acumen|E]를 축적해야 합니다.\n\n규모는 네 가지 단계로 나뉩니다. [GetLaw('company_size_small').GetName], [GetLaw('company_size_medium').GetName], [GetLaw('company_size_large').GetName] 및 [GetLaw('company_size_huge').GetName]입니다."
 #Contracts
 game_concept_trade_contract: "무역 청부의뢰"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "무역 청부의뢰"
 game_concept_trade_contract_possessive: "무역 청부의뢰의"
 game_concept_trade_contracts_possessive: "무역 청부의뢰의"
 game_concept_trade_contract_desc: "$game_concept_trade_contracts$는 [merchant|E] [companies|E]가 [trade_routes|E]에 영향을 미치거나 먼 타지로 나가 귀중한 재물을 찾아볼 기회입니다.\n\n전자의 경우 [trade_opportunities|E], 후자의 경우 [luxury_contracts|E]로 불립니다."
 game_concept_trade_contract_tier: "무역 청부의뢰 등급"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "등급"
 game_concept_trade_contract_tier_desc: "[trade_contract|E]마다 $game_concept_trade_contract_tier_tier$을 보유하며, 이 등급에 따라 $game_concept_trade_contract$의 난이도와 보상이 달라집니다. 무역 청부의뢰 등급은 보통 무역 청부의뢰 위치의 [prosperity|E]에 따라 정해집니다."
 game_concept_luxury_contract: "사치품 청부의뢰"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "사치품 청부의뢰"
 game_concept_luxury_contract_possessive: "사치품 청부의뢰"
 game_concept_luxury_contracts_possessive: "사치품 청부의뢰"
 game_concept_luxury_contract_desc: "$game_concept_luxury_contracts$를 수행하려면 [merchant|E] [companies|E]가 먼 장소로 [travel|E]해 [domicile_artifact|E]을 입수해야 합니다.\n\n대상 [company_purpose|E]을 보유한 상인에게는 이러한 청부의뢰가 일정 확률로 매년 발생하며, [GetDecisionWithKey('gdp_visit_holding_decision').GetName] [decision|E]을 통해 획득할 수 있습니다."
 game_concept_trade_opportunity: "무역 기회"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "무역 기회"
 game_concept_trade_opportunity_possessive: "무역 기회의"
 game_concept_trade_opportunities_possessive: "무역 기회의"
 game_concept_opportunity: "기회"
 game_concept_opportunities: "기회"
 game_concept_opportunity_possessive: "기회의"
 game_concept_opportunities_possessive: "기회의"
 game_concept_trade_opportunity_desc: "$game_concept_trade_opportunities$는 [merchant|E] [companies|E]에게 [scheme|E]을 성공적으로 완료할 것을 요구합니다.\n\n보통은 순전히 사업적이지만(수익성 있는 [trade_goods|E] 홍보), 좀 더 적대적인 성격([market|E] 장악을 두고 경쟁자 가문과 벌이는 경쟁)을 띠는 경우도 있습니다.\n\n어떤 이유로든 $game_concept_scheme$이 실패하거나 중단될 경우 $game_concept_trade_opportunity$ 또한 실패로 돌아갑니다."
 game_concept_trade_opportunity_tier: "무역 기회 등급"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "등급"
 game_concept_trade_opportunity_tier_desc: "$game_concept_trade_opportunity_tier$은 청부의뢰가 위치한 지역의 [prosperity|E]를 반영합니다.\n\n$game_concept_trade_opportunity_tier$이 높을수록 보수 또한 높아집니다. 물론 과제의 난이도 또한 함께 높아지기 마련입니다."
 game_concept_trade_opportunity_scheme: "무역 기회 모략"
 game_concept_trade_opportunity_schemes: "무역 기회 모략"
 game_concept_trade_opportunity_scheme_possessive: "무역 기회 모략의"
 game_concept_trade_opportunity_schemes_possessive: "무역 기회 모략의"
 game_concept_trade_opportunity_scheme_trade_opportunity: "무역 기회"
 game_concept_trade_opportunity_scheme_opportunity: "기회"
 game_concept_opportunity_scheme: "기회 모략"
 game_concept_opportunity_schemes: "기회 모략"
 game_concept_opportunity_scheme_possessive: "기회 모략의"
 game_concept_opportunity_schemes_possessive: "기회 모략의"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "후원자 청부의뢰"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "후원자 청부의뢰"
 game_concept_patron_contract_possessive: "후원자 청부의뢰의"
 game_concept_patron_contracts_possessive: "후원자 청부의뢰의"
 game_concept_patron_contract_desc: "$game_concept_patron_contracts$는 [merchant|E] [companies|E]에게 [merchant_patron|E]를 상대로 한 [scheme|E]을 성공적으로 완료할 것을 요구합니다.\n\n이 청부의뢰는 보통 [diplomacy|E]가 중심이 되며, 후원자를 돕거나(시장의 분쟁 해결), 해당 상인의 뜻대로 후원자를 조종(경쟁자 상인의 가문 배척)하기도 합니다.\n\n어떤 이유로든 $game_concept_scheme$이 실패하거나 중단될 경우 $game_concept_patron_contract$ 또한 실패로 돌아갑니다."
 game_concept_patron_contract_scheme: "후원자 청부의뢰 모략"
 game_concept_patron_contract_schemes: "후원자 청부의뢰 모략"
 game_concept_patron_contract_scheme_possessive: "후원자 청부의뢰 모략의"
 game_concept_patron_contract_schemes_possessive: "후원자 청부의뢰 모략의"
 game_concept_patron_contract_scheme_patron_contract: "후원자 청부의뢰"
 game_concept_patron_scheme: "후원자 모략"
 game_concept_patron_schemes: "후원자 모략"
 game_concept_patron_scheme_possessive: "후원자 모략의"
 game_concept_patron_schemes_possessive: "후원자 모략의"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "방향성 청부의뢰"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "방향성 청부의뢰"
 game_concept_unity_contract_possessive: "방향성 청부의뢰의"
 game_concept_unity_contracts_possessive: "방향성 청부의뢰의"
 game_concept_unity_contract_desc: "$game_concept_unity_contracts$는 [merchant_possessive|E] [company_sentiment|E]이 낮으면 발생하며, 해결해야 할 문제를 제시합니다."
 game_concept_domicile_artifact: "본적지 유물"
 game_concept_domicile_artifacts: "본적지 유물"
 game_concept_domicile_artifact_desc: "$game_concept_domicile_artifact$은 [merchant_possessive|E] [company|E]에 전시되는 [artifact|E]입니다. [curios|E]과 [creatures|E]이 이에 해당합니다.\n\n$game_concept_domicile_artifacts$은 $game_concept_merchant_possessive$ 지속적인 [prestige|E] 수입의 주요 원천입니다.\n\n[character|E]이 보유할 수 있는 $game_concept_artifacts$의 수에는 한도가 존재하지 않으나, 해당 유형의 칸에 전시된 유물만이 효과를 발휘합니다.\n\n$game_concept_merchants$은 [luxury_contracts|E]를 성공적으로 완료하면 $game_concept_domicile_artifacts$을 획득할 수 있습니다."
 game_concept_menagerie: "동물원"
 game_concept_menagerie_creature: "동물원 생물"
 game_concept_menagerie_creatures: "동물원 생물"
 game_concept_creature: "생물"
 game_concept_creatures: "생물"
 game_concept_creature_desc: "$game_concept_creature$은 살아있는 동물입니다. [merchants|E]이 [luxury_contracts|E]를 완료하면 입수할 수 있습니다. \n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "수집품"
 game_concept_curios: "수집품"
 game_concept_curio_desc: "$game_concept_curio$은 희귀한 유형의 [artifact|E]입니다. [merchants|E]이 [luxury_contracts|E]를 완료하면 입수할 수 있습니다.\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "[company|E]에 [domicile_artifact|E]로 전시하면 지속적으로 [prestige|E]을 획득하게 됩니다."
 game_concept_guelph_ghibelline_precursor_situation: "$game_concept_guelph_ghibelline_situation$ 서막"
 game_concept_guelph_ghibelline_precursor_situation_desc: "[guelph_ghibelline_situation|E] [situation|E]의 서막입니다. 신성 로마 제국과 교황청 사이의 갈등을 심화시켰던 일련의 사건들입니다.\n\n#F 이는 [Glossary( '주님의 이름으로', 'IN_NOMINE_DOMINI_GLOSS' )] 칙서를 통한 교황 권위의 부활과 함께 시작되었는데, 당시 교황은 귀족이 교황 선출에 관여해서는 안 되며, 이는 로마에 모인 추기경들의 권한이라고 선언했습니다.\n\n이후 [Glossary( '교황 훈령', 'DICTATUS_PAPAE_GLOSS' )]과 서임권 투쟁에서 교황은 신이 자신에게 부여한 교황의 권리야말로 보편적인 권리이며, 교회 지도자를 임명하거나 파면할 수 있는 유일한 권한임을 선언했습니다. 주교들이 세속적인 지위 상징을 받으며 서임되는 모습은 바람직하지 않게 여겨졌습니다."
 game_concept_guelph_ghibelline_situation: "구엘프와 기벨린"
 game_concept_guelph_ghibelline_situation_desc: "교황([guelphs|E])과 신성 로마 제국([ghibellines|E]) 사이에 갈등이 발생한 상황입니다.\n\n시간이 지나며 이 상황은 북부 이탈리아의 통치자들이 제국의 개입을 더 원하는지, 아니면 자신들의 독립 상황을 그대로 유지할지와 관련된 지역 문제로 발전했습니다."
 game_concept_gg_involvement: "연루"
 game_concept_gg_involvement_desc: "[guelph_ghibelline_situation|E] [situation|E]에서 [ruler|E]의 $game_concept_gg_involvement$는 해당 인물이 상황의 상태에 얼마나 영향을 미쳤는지 나타내는 척도입니다. 이 수치는 주로 상대방에 대한 행동을 수행해서 획득합니다.\n\n여기에는 다음과 같은 행동이 포함됩니다.\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[imprison|E], [torture|E] 및 [execution|E] [interactions|E]\n$BULLET_WITH_TAB$[GetScheme('gg_switch_sides').GetTypeName] [scheme|E], $gg_recruit_partisan_interaction|V$ [interaction|E], [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V] [casus_belli|E] 등\n$BULLET_WITH_TAB$[situation_catalysts|E] 발동\n\n$game_concept_gg_involvement$ 결과:\n$BULLET_WITH_TAB$#V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#! 증가당 이에 따른 [GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip] [modifier|E] 적용\n$BULLET_WITH_TAB$당신의 진영이 상황을 종료할 경우 보상의 효과를 증가시키는 역할을 합니다.\n\n#F [guelph_ghibelline_precursor_situation|E] 동안에는 아직 $game_concept_gg_involvement$를 획득할 수 없으며, 갈등이 완전히 발발하기 전까지는 감소한 비율로 누적됩니다.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "구엘프"
 game_concept_guelphs: "구엘프"
 game_concept_guelph_desc: "구엘프는 [guelph_ghibelline_situation|E] [situation|E]의 분파로, 신성 로마 제국으로부터의 독립을 지지하며 나아가 신성한 주권을 옹호합니다.\n\n#F 그 이름은 역사적으로 바이에른의 공작이었던 벨프 가문에서 유래했으며, 입을 타고 전해지며 발음의 변화를 거쳐 구엘프라는 이름이 되었습니다.#!"
 game_concept_ghibelline: "기벨린"
 game_concept_ghibellines: "기벨린"
 game_concept_ghibelline_desc: "기벨린은 [guelph_ghibelline_situation|E] [situation|E]의 분파로, 신성 로마 제국이 북부 이탈리아의 도시 국가에 행사하는 영향력 및 지배력이 커지는 상황을 지지합니다.\n\n#F 기벨린이라는 이름은 바인스베르크 공성전 당시 호엔슈타우펜 가문의 구호에서 언급하던 바이블링겐성에서 비롯되었습니다.#!"
 game_concept_lombard_league: "롬바르디아 동맹"
 game_concept_lombard_league_desc: "북부 이탈리아 도시들이 결성한 동맹으로, $e_hre$이 주도하는 중앙 집권화를 향한 요구가 점점 더 거세지는 상황에 반대했습니다."
 game_concept_confederation_cohesion: "연맹체 결속"
 game_concept_cohesion: "결속"
 game_concept_confederation_cohesion_desc: "$game_concept_cohesion$은 [confederation|E]가 얼마나 견고하게 단결하는지를 나타내며 #V 0#!에서 #V 100#!까지의 수치로 측정됩니다. 모든 구성원이 매달 이 수치에 긍정적 또는 부정적으로 기여하며, 높은 $game_concept_cohesion$ 수준에서는 획득하는 기여량이 감소합니다.\n\n각 단계에 도달할 때마다 구성원이 받는 혜택이 증가합니다. $game_concept_cohesion$ 생성 요인과 단계별 보상은 연맹체 종류에 따라 다릅니다.\n\n연맹체의 $game_concept_cohesion$에는 다음과 같은 유형이 있습니다.\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "무역 연맹"
 game_concept_trade_league_desc: "$game_concept_trade_league$은 공화제 [rulers|E]가 상호적인 상업 및 방어 혜택을 얻고자 형성하거나 합류하는 [republics|E] [confederation|E]입니다.\n\n한 명의 구성원이 [leading_title|E]를 보유하며, 다른 구성원을 초대하거나 축출할 수 있는 유일한 구성원인 [trade_league_leader|E]의 역할을 합니다. 나머지 구성원은 [member_title|E]를 보유합니다.\n\n[league_cohesion|E]이 깊어질수록 그 구성원이 함께 누리는 혜택도 증가합니다."
 game_concept_trade_leagues: "무역 연맹"
 game_concept_trade_league_short: "연맹"
 game_concept_league_cohesion: "연맹 결속"
 game_concept_league_cohesion_desc: "$game_concept_cohesion$은 [trade_league|E]의 단결 정도를 나타내는 척도로, 단계마다 연맹 구성원이 받는 [trade|E] 혜택이 증가합니다. 이 수치가 #V 20#! 미만인 연맹은 결속이 느슨한 편이므로 구성원이 서로의 [wars|E]에 참전하거나 [trade_monopolies|E]을 요청할 수 없습니다.\n\n구성원은 자신의 [title_tier|E], [capital|E], [trade_league_leader|E]에 대한 [opinion|E]을 통해 결속을 생성합니다. 독점을 보유한 구성원은 더 많은 결속 수치를 생성하며, [trade_league_members_short|E]이 너무 많거나 너무 적으면 생성하는 결속의 정도가 감소합니다."
 game_concept_trade_league_leader: "무역 연맹 지도자"
 game_concept_trade_league_leader_desc: "무역 연맹 지도자는 [trade_league|E]의 공식적인 수장입니다.\n\n지도자는 새로운 구성원을 초대하거나 기존 구성원을 퇴출할 수 있는 유일한 $game_concept_trade_league$ [trade_league_member_short|E]입니다. 연맹이 창설되면 그 설립자가 지도자가 됩니다. 구성원들은 나중에 지도자 자리에 도전할 수 있습니다. 지도자가 떠나면 [title_tier|E], [capital|E] 내 [settlement_size|E], [prestige|E]을 바탕으로 다른 구성원이 그 자리를 물려받습니다."
 game_concept_trade_league_leader_short: "지도자"
 game_concept_trade_league_member: "무역 연맹 구성원"
 game_concept_trade_league_members: "무역 연맹 구성원"
 game_concept_trade_league_member_short: "구성원"
 game_concept_trade_league_members_short: "구성원"
 game_concept_trade_league_member_desc: "무역 연맹 구성원은 [trade_league|E]의 일부로, 구성원 [republics|E]의 [primary_title|E]로 이루어지는 [member_title|E]를 보유합니다.\n\n한 명의 구성원이 [leading_title|E]를 보유하며 [trade_league_leader|E]의 역할을 합니다."
 game_concept_league_focus: "연맹 주력"
 game_concept_league_focuses: "연맹 주력"
 game_concept_league_focus_desc: "$game_concept_league_focus$은 [trade_league|E]의 [trade_league_leader|E]가 선택하는 [trade_category|E]입니다. 각 [member_title|E]의 [holder|E]는 해당 범주에서 [trade_expertise|E], [production|E], [sell_price|E] 보너스를 받습니다."
 game_concept_patrician: "파트리치오"
 game_concept_patricians: "파트리치오"
 game_concept_patrician_possessive: "파트리치오의"
 game_concept_patrician_desc: "파트리치오는 [republic|E] 내의 유력한 [merchant|E] 가문을 이끄는 [house_head|E]입니다."
 game_concept_patrician_family: "파트리치오 가문"
 game_concept_patrician_families: "파트리치오 가문"
 game_concept_patrician_family_short: "가문"
 game_concept_patrician_family_desc: "$game_concept_patrician_family$은 [republic|E]에 속한 [merchant_family|E]입니다. 이들은 공화제에서 권력과 영향력을 보유한 고귀한 상류층으로, [consortery|E]를 [domicile|E]로 사용합니다.\n\n[county|E] [title_tier|E]의 공화제에서는 파트리키 가문이 한 개만 존재할 수 있지만, 더 높은 등급의 공화제에서는 파트리키 가문이 여럿 존재할 수 있으며 이는 당연한 현상입니다."
 game_concept_patrician_rating: "파트리치오 평가"
 game_concept_patrician_rating_short: "평가"
 game_concept_patrician_rating_desc: "[patrician_family|E]에는 $game_concept_patrician_rating$가 존재합니다. 이는 가문과 그 [patrician|E]가 [republic|E] 내에서 얼마나 중요하며 유력한지를 나타내는 수치입니다.\n\n평점이 높으면 파트리키와 그 [house|E]에 세 가지 단계로 나뉘는 보너스가 부여됩니다. 단계마다 다음과 같은 추가 혜택이 잠금 해제됩니다.\n$BULLET_WITH_TAB$[house_ambition|E] 개선\n$BULLET_WITH_TAB$[interactions|E] 승낙 확률 증가\n$BULLET_WITH_TAB$[governor_salary|E] 증가\n\n평점을 높이는 방식은 다양하며, 영향을 미치는 주요 요인은 다음과 같습니다.\n$BULLET_WITH_TAB$[patrician_possessive|E] [trade|E] 수입\n$BULLET_WITH_TAB$[republic|E] 통치\n$BULLET_WITH_TAB$[assembly|E] 및 [liege_possessive|E] [council|E] 의석 확보[AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$[house|E] 구성원이 [clerical_region|E] 보유\n$BULLET_WITH_TAB$[GetModifier('favored_by_pope_modifier').GetNameWithTooltip] [modifier|E] 보유"
 game_concept_patrician_rating_penalties_PAM: "파트리키가 [excommunicated|E]되거나, 알려진 [criminal|E]거나, [GetModifier('scorned_pope_modifier').GetNameWithTooltip]을 산 경우 평점이 감소합니다."
 game_concept_patrician_rating_penalties_NO_PAM: "파트리키가 [excommunicated|E]되거나, 알려진 [criminal|E]인 경우 평점이 감소합니다."
 game_concept_consortery: "콘소테리"
 game_concept_consorteries: "콘소테리"
 game_concept_consortery_possessive: "콘소테리의"
 game_concept_consortery_desc: "$game_concept_consortery$는 [patrician_family|E]의 거주지이자 [domicile|E]입니다. 일반적으로 [liege_possessive|E] [capital|E]에 위치합니다.\n\n$game_concept_consortery$는 [merchant_possessive|E] [trade_companies|E]와 마찬가지로 [company_buildings|E]을 [domicile_buildings|E]로 사용해 무역에서 가문의 기량과 경쟁력을 향상합니다.\n\n콘소테리는 [patrician_family|E] 작위를 따라 상속됩니다."
 game_concept_assembly: "평의회"
 game_concept_assembly_possessive: "평의회의"
 game_concept_assembly_desc: "평의회는 [realm|E]의 통치 기구입니다.\n\n평의회의 권한은 [laws|E]에 따라 정해지며 여기에는 법률 표결 및 승인, [republic_decrees|E]이 포함될 수 있습니다. 또는 [GetLaw('republican_elective_succession_law').GetName] 같은 일부 선거 [succession|E] 형태에서 후보에게 투표하기도 합니다."
 game_concept_republic_senate: "원로원"
 game_concept_republic_senate_possessive: "원로원의"
 game_concept_voting_session: "투표 회기"
 game_concept_voting_sessions: "투표 회기"
 game_concept_voting_session_desc: "$game_concept_voting_session$는 [assembly|E]에서 제안된 [law|E] 또는 [republic_decree|E]에 관한 결정을 내리는 과정입니다.\n\n회기가 진행되면 평의회 구성원은 본인의 찬성 여부에 따라 제안에 찬성할지 반대할지를 투표합니다. 회기가 종료되기 전에 충분한 수의 구성원이 찬성한다면 제안은 통과되며 효력을 발휘합니다.\n\n회기가 시작되기 전에 [councillor_task|E] 및 특정 [perks|E]를 통해 찬성도를 높일 수 있으며, [hook|E]을 이용하면 구성원이 자기 뜻을 따라 투표하도록 강제할 수 있습니다."
 game_concept_republic_decree: "공화제 칙령"
 game_concept_republic_decrees: "공화제 칙령"
 game_concept_republic_decree_short: "칙령"
 game_concept_republic_decrees_short: "칙령"
 game_concept_republic_decree_desc: "$game_concept_republic_decree$은 [republic|E]의 [decision|E] 유형이며 [assembly|E]의 승인을 받아야만 합니다.\n\n$game_concept_republic_decrees_short$의 유형은 여러 가지이나, 주로 [patricians|E], [realm_capital|E] 또는 공화국 전체에 영향을 미칩니다."
 game_concept_house_ambition: "가문 야심"
 game_concept_house_ambitions: "가문 야심"
 game_concept_house_ambition_desc: "[republic|E] 내 [house|E]마다 야심을 보유하고 있으며, 이는 각 집안의 구성원이 공화국에 영향을 미치고 싶어 하는 방식을 나타냅니다."
 game_concept_republic_administration: "공화제 행정"
 game_concept_republic_administration_short: "행정"
 game_concept_republic_administrations: "공화제 행정"
 game_concept_republic_administration_desc: "모든 [republics|E]에는 지정된 공화제 행정이 있으며, 이를 통해 해당 공화국의 전문 분야가 정해집니다.\n\n공화국의 [ruler|E]만이 행정을 변경할 수 있습니다.\n\n여러 행정 중에서 선택할 수 있으며, 각 행정은 고유한 혜택을 부여합니다.\n\n#help 가장 흔한 행정 형태는 [GetLaw( 'republic_type_communal' ).GetName], [GetLaw( 'republic_type_maritime' ).GetName] 및 [GetLaw( 'republic_type_civic' ).GetName]입니다.#!"
 game_concept_republic_senator: "원로원 의원"
 game_concept_republic_senators: "원로원 의원"
 game_concept_republic_senator_desc: "$game_concept_republic_senator$은 [GetLaw( 'republic_assembly_composition_roman_senate' ).GetName]에 의해 임명된 [assembly|E] 구성원입니다.\n\n원로원 의원은 [republic_possessive|E] [ruler|E] 또는 감찰관이 임명합니다.\n\n한 번에 정해진 수의 $game_concept_republic_senators$만 임명할 수 있으며, 이 수는 원로원 규모 [law|E]에 따라 정해집니다."
 game_concept_mercenary_limit: "용병 한도"
 game_concept_mercenary_limit_desc: "용병 한도는 [character|E]이 한 번에 고용할 수 있는 [mercenaries|E]의 수를 정합니다.\n\n용병 한도는 다음 조건에 따라 정해집니다.\n$BULLET_WITH_TAB$[martial_i][martial|E] [skill|E]\n$BULLET_WITH_TAB$[title_tier_i][title_tier|E]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
