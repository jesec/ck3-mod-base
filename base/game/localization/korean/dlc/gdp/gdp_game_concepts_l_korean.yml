 game_concept_charters: "특허장"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "$game_concept_charter$은 [merchant_patron|E]가 [clients|E]에게 부여하는 문서 [artifact|E]입니다.\n\n$game_concept_merchant_patron$의 인장이 찍힌 $game_concept_charter$ $game_concept_artifacts$을 보유한 $game_concept_merchants$은 다음이 가능합니다.\n$EFFECT_LIST_BULLET$#EMP #V $abuse_charter_authority_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $benevolent_charter_authority_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $leverage_charter_authority_interaction$#!#! [interaction|E]"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "$game_concept_make_a_request$은 [merchant_patron|E]에게 호의, 후원 또는 다른 지원을 요청할 때 사용되는 [interaction|E]입니다."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "$game_concept_request_contract_change$은 [vassal|E], [tributary|E], 또는 [client|E]가 자신의 [liege|E] 또는 [suzerain|E]와 책무를 재협상할 때 사용하는 [interaction|E]입니다."
 game_concept_leading_title: "주도 작위"
 game_concept_leading_title_desc: "[trade_league|E]과 같은 작위 기반 연맹체를 이끄는 [title|E]입니다.\n\n주도 작위의 [holder|E]는 연맹체의 [trade_league_leader|E]이기도 합니다."
 game_concept_client_contract: "피후견자 계약"
 game_concept_client_contracts: "피후견자 계약"
 game_concept_client_contract_desc: "$game_concept_client_contracts$은 [client|E] 및 [merchant_patron|E] 사이의 [obligations|E]를 정합니다.\n\n다음 네 가지의 책무를 협상할 수 있습니다. 후견자에게 바쳐야 하는 [trade|E] 수입의 양과 후견자가 지원하는 [prestige|E], [trade_competitiveness|E] 지원, 상인 가문을 위한 [marriages|E] 주선입니다.\n\n계약은 승계를 따라 상속되며, 상인이 자신의 [company|E]를 다른 [holding|E]로 이전하지 않는 한 끝나지 않습니다."
 game_concept_member_title: "구성원 작위"
 game_concept_member_title_desc: "[trade_league|E] 등 작위를 기반으로 하는 연맹체의 구성원이 보유하는 [title|E]입니다."
 game_concept_company_sentiment: "회사 방향성"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "방향성"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "$game_concept_company_sentiment$은 [merchant_family_possessive|E] 운영 방식 및 구성원이 서로를 어떻게 대하는지를 알 수 있는 척도입니다.\n\n여러 개의 [company_sentiment_levels|E]이 있으며, 각 단계는 [house|E] 구성원에게 다양한 이로운 효과와 불이익을 제공합니다.\n\n$game_concept_company_sentiment$은 $game_concept_company$의 전반적인 행동에 따라 달라집니다. [company_sentiment_positive_actions|E]은 보통 $game_concept_sentiment$을 [company_sentiment_concerted_i][company_sentiment_concerted|E] 방향으로 진행시키고, [company_sentiment_negative_actions|E]의 경우 [company_sentiment_divided_i][company_sentiment_divided|E] 방향으로 진행시킵니다.\n\n일반적으로 [house_heads|E]은 집안의 $game_concept_sentiment$에 다른 구성원보다 더 큰 영향을 줍니다."
 game_concept_company_sentiment_level: "회사 방향성 관점"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "회사 방향성 관점"
 game_concept_company_sentiment_level_desc: "$game_concept_company_sentiment_level$은 [company_sentiment|E]의 현재 상태입니다. $game_concept_sentiment$이 [company_sentiment_positive_actions|E]에 따라 [company_sentiment_concerted_i][company_sentiment_concerted|E] 방향으로 진행되거나 [company_sentiment_negative_actions|E]에 따라 [company_sentiment_divided_i][company_sentiment_divided|E] 방향으로 진행되면 활성화된 관점이 변합니다. 또한 각 관점은 [house|E] 구성원에게 다양한 이로운 효과와 불이익을 제공합니다.\n\n총 다섯 가지 관점이 존재합니다.\n$EFFECT_LIST_BULLET$[company_sentiment_divided_i][company_sentiment_divided|E]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious_i][company_sentiment_fractious|E]\n$EFFECT_LIST_BULLET$[company_sentiment_independent_i][company_sentiment_independent|E]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative_i][company_sentiment_cooperative|E]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted_i][company_sentiment_concerted|E]"
 game_concept_company_sentiment_divided: "탐욕적"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "기회주의적"
 game_concept_opportunistic: "$game_concept_company_sentiment_fractious$"
 game_concept_company_sentiment_independent: "균형적"
 game_concept_balanced: "$game_concept_company_sentiment_independent$"
 game_concept_company_sentiment_cooperative: "출세지향적"
 game_concept_grasping: "$game_concept_company_sentiment_cooperative$"
 game_concept_company_sentiment_concerted: "귀족적"
 game_concept_ennobled: "$game_concept_company_sentiment_concerted$"
 game_concept_company_sentiment_divided_i: "@company_sentiment_divided_icon!"
 game_concept_company_sentiment_fractious_i: "@company_sentiment_fractious_icon!"
 game_concept_company_sentiment_independent_i: "@company_sentiment_independent_icon!"
 game_concept_company_sentiment_cooperative_i: "@company_sentiment_cooperative_icon!"
 game_concept_company_sentiment_concerted_i: "@company_sentiment_concerted_icon!"
 game_concept_company_sentiment_divided_desc: "$game_concept_company_sentiment_divided$ [company_sentiment_level|E]은 가장 경쟁심 넘치는 관점입니다. [company|E]에서 이 관점을 채택하면 가문의 모든 구성원이 그 무엇보다도 수익을 가장 중시하며, 심지어는 서로와 마찰이 생기는 일도 감수하게 됩니다.\n\n#bold 이 $game_concept_company_sentiment_level$의 효과:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$[merchant_patron|E] 의견: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$#EMP #V $unity_regional_networks_decision$#!#! [decision|E]"
 game_concept_company_sentiment_fractious_desc: "$game_concept_company_sentiment_fractious$ [company_sentiment_level|E]은 [rapacious|E] 관점 다음으로 경쟁심이 높은 관점입니다. [company|E]에서 이 관점을 채택하면 구성원은 가족의 의무보다 개인의 이득을 우선으로 합니다.\n\n#bold 이 [company_sentiment_level|E]의 효과:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness_i][competitiveness|E]: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$#EMP #V $unity_establish_network_decision$#!#! [decision|E]"
 game_concept_company_sentiment_independent_desc: "$game_concept_company_sentiment_independent$ [company_sentiment_level|E]은 중도의 관점입니다. [company|E]에서 이 관점을 채택하면 가문에는 여전히 수장이 있어야 하지만, 그 구성원은 간섭이나 평가 없이 자기 일을 자유롭게 처리합니다.\n\n#bold 이 [company_sentiment_level|E]의 효과:#!\n$EFFECT_LIST_BULLET$#EMP #V $unity_consult_house_decision$#!#! [decision|E]"
 game_concept_company_sentiment_cooperative_desc: "$game_concept_company_sentiment_cooperative$ [company_sentiment_level|E]은 [ennobled|E] 다음으로 정통성을 중시하는 관점입니다. [company|E]에서 이 관점을 채택하면 회사의 명성이 곧 구성원의 명성이 되며, 각 구성원은 자신의 평판뿐 아니라 사회적 입지를 향상하고자 노력해야 합니다.\n\n#bold 이 [company_sentiment_level|E]의 효과:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$: #P +5%#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +10%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#! [decision|E]"
 game_concept_company_sentiment_concerted_desc: "$game_concept_company_sentiment_concerted$ [company_sentiment_level|E]은 가장 정통성을 중시하는 관점입니다. [company|E]에서 이 관점을 채택하면 의무와 존경에서 비롯된 충성심이 전체의 이익을 수장의 이익에 결속시키며, 해당 회사는 귀족 가문과 동등한 위치에 설 수도 있습니다.\n\n#bold 이 [company_sentiment_level|E]의 효과:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +25%#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$#EMP #V $unity_family_business_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_prosperity_decision$#!#! [decision|E]\n$EFFECT_LIST_BULLET$#EMP #V $unity_merchant_bailiffs_decision$#!#! [decision|E]"
 game_concept_company_sentiment_positive_actions: "정통성 행동"
 game_concept_company_sentiment_positive_actions_desc: "[company|E]에서 정통성 행동을 수행하면 [company_sentiment|E]이 [company_sentiment_concerted_i][company_sentiment_concerted|E] 방향으로 진행됩니다.\n\n[house_heads|E]은 #V $unity_merchant_promote_excess_decision$#! [decision|E]을 사용해 [company_sentiment|E]을 [company_sentiment_concerted_i][company_sentiment_concerted|E] 방향으로 크게 진행시킬 수 있습니다.\n\n#weak $game_concept_company_sentiment_positive_actions$의 예시:$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "수익 추구 행동"
 game_concept_company_sentiment_negative_actions_desc: "[company|E]에서 수익 추구 행동을 수행하면 [company_sentiment|E]이 [company_sentiment_divided_i][company_sentiment_divided|E] 방향으로 진행됩니다.\n\n[house_heads|E]은 #V $unity_merchant_promote_diligence_decision$#! [decision|E]을 사용해 [company_sentiment|E]을 [company_sentiment_divided_i][company_sentiment_divided|E] 방향으로 크게 진행시킬 수 있습니다.\n\n#weak $game_concept_company_sentiment_negative_actions$의 예시:$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ 집안과 귀족 사이의 $arrange_marriage_interaction$\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ 사원 요청 완료\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ 다른 상인 가문과의 $arrange_marriage_interaction$\n$EFFECT_LIST_BULLET$ 회사로 초대\n$EFFECT_LIST_BULLET$ 사원 요청 실패\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$"
 game_concept_republican_army: "공화제 부대"
 game_concept_republican_armies: "공화제 부대"
 game_concept_republican_army_desc: "$game_concept_republican_army$는 [republican|E] [government|E]인 [realm|E]에 의해 소집 및 유지되는 [army|E]입니다.\n\n이들은 오직 [title_men_at_arms|E]으로만 구성되며, [liege|E]으로 취임하는 인물의 통제를 따릅니다."
 REPUBLICAN_ARMY_CONCEPT: "[republican_army|E]"
 REPUBLICAN_ARMY_CONCEPT_NO_TOOLTIP: "$game_concept_republican_army$"
 REPUBLICAN_ARMIES_CONCEPT: "[republican_armies|E]"
 REPUBLICAN_ARMIES_CONCEPT_NO_TOOLTIP: "$game_concept_republican_armies$"
