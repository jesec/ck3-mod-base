l_korean:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "낮은 민중 의견: 동요하는 시민들"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "낮은 민중 의견: 위기에 빠진 도시"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "높은 민중 의견: 밝은 분위기"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "높은 민중 의견: 번영하는 도시"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "경제 침체"
 gdp_popular_opinion_mild_neg_prosperity_desc: "시민들의 불만으로 인해 도시에 대한 투자가 위축되었고, 장기적인 성장 속도가 둔화되었습니다."
 gdp_popular_opinion_mild_neg_taxes: "탈세"
 gdp_popular_opinion_mild_neg_taxes_desc: "불만을 품은 시민들이 세금 납부를 피할 방법을 찾고 있으며, 그 결과 모든 도시 지구의 수입이 감소하는 중입니다."
 gdp_popular_opinion_mild_neg_construction: "건설 지연"
 gdp_popular_opinion_mild_neg_construction_desc: "노동자와 장인들의 협조가 예전 같지 않아 비용이 증가하고 건설 속도가 느려지는 중입니다."
 gdp_popular_opinion_mild_neg_defense: "성벽 병력 부족"
 gdp_popular_opinion_mild_neg_defense_desc: "시민들이 도시 민병대 복무를 꺼리고 있어 도시 방어 체계의 병력이 부족합니다."
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "경제 붕괴"
 gdp_popular_opinion_severe_neg_prosperity_desc: "극심한 혼란으로 도시 경제가 무너졌습니다. 성장은 멈췄고 기존의 번영마저 쇠퇴하기 시작했습니다."
 gdp_popular_opinion_severe_neg_taxes: "조세 반란"
 gdp_popular_opinion_severe_neg_taxes_desc: "조세에 대한 공개적인 저항이 도시 전역으로 확산되면서 공공 수입이 크게 감소했습니다."
 gdp_popular_opinion_severe_neg_construction: "건설 파업"
 gdp_popular_opinion_severe_neg_construction_desc: "길드와 노동자들이 노동을 거부합니다. 건설은 극도로 느려졌으며 비용도 크게 증가했습니다."
 gdp_popular_opinion_severe_neg_defense: "수비대 탈영"
 gdp_popular_opinion_severe_neg_defense_desc: "병사들이 초소를 버리거나 복무를 거부합니다. 도시의 성벽은 거의 무방비 상태로 남겨졌습니다."
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "시민 투자"
 gdp_popular_opinion_mild_pos_prosperity_desc: "자신감에 찬 시민들은 도시의 미래를 위해 기꺼이 투자하고 있으며, 장기적인 번영이 서서히 다가오는 중입니다."
 gdp_popular_opinion_mild_pos_taxes: "성실한 납세자"
 gdp_popular_opinion_mild_pos_taxes_desc: "시민들은 불평 없이 세금을 납부하고 있으며, 그 결과 도시 각 지구의 수입이 증가하는 중입니다."
 gdp_popular_opinion_mild_pos_construction: "시민의 열의"
 gdp_popular_opinion_mild_pos_construction_desc: "길드와 장인들은 도시의 성장에 기여하기를 열망하고 있으며, 덕분에 새로운 건설 사업의 비용과 기간이 감소하는 추세입니다."
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "번영의 황금기"
 gdp_popular_opinion_strong_pos_prosperity_desc: "도시는 낙관론으로 활기를 띠고 있습니다. 시민과 상인들은 거리낌 없이 투자하고 있으며, 이는 강력하고 지속적인 성장을 끌어냅니다."
 gdp_popular_opinion_strong_pos_taxes: "넘쳐나는 국고"
 gdp_popular_opinion_strong_pos_taxes_desc: "시민들이 도시를 자랑스럽게 여기며, 이러한 태도는 전 지역에서의 성실한 납세로 이어지는 중입니다."
 gdp_popular_opinion_strong_pos_construction: "장인들의 건설 참여"
 gdp_popular_opinion_strong_pos_construction_desc: "최고의 장인과 기술자들이 도시에서 일할 영예를 두고 경쟁하고 있으며, 그 결과 모든 사업의 비용이 줄고 진행 속도가 빨라지는 중입니다."
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "신중한 판매상"
 gdp_popular_opinion_mild_neg_sell_price_desc: "도시의 불안감으로 인해 상인들이 경계심을 품게 되었고, 상품 공급을 줄이며 시장 전반의 가격이 하락합니다."
 gdp_popular_opinion_mild_neg_capacity: "시장 위축"
 gdp_popular_opinion_mild_neg_capacity_desc: "신뢰가 낮아지면서 일부 상인들이 활동을 축소했고, 시장의 수용력이 감소하는 중입니다."
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "시장 공황"
 gdp_popular_opinion_severe_neg_sell_price_desc: "위기가 찾아왔다는 분위기에 판매상들이 무너져 가는 시장에서 상품을 서둘러 처분하는 중이며, 그 결과 가격이 폭락하고 있습니다."
 gdp_popular_opinion_severe_neg_capacity: "상인 이탈"
 gdp_popular_opinion_severe_neg_capacity_desc: "유력한 상인들이 도시를 완전히 떠나면서 무역 시장의 규모가 크게 축소되었습니다."
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "자신만만한 판매상"
 gdp_popular_opinion_mild_pos_sell_price_desc: "도시의 긍정적인 분위기가 판매상들의 자신감을 북돋우면서 시장 전반의 물가가 소폭 상승합니다."
 gdp_popular_opinion_mild_pos_capacity: "성장하는 시장"
 gdp_popular_opinion_mild_pos_capacity_desc: "낙관적인 분위기가 새로운 무역상들을 도시로 끌어들이면서 시장의 수용력이 점차 확대되고 있습니다."
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "무역 호황"
 gdp_popular_opinion_strong_pos_sell_price_desc: "유례없는 시민의 자부심 덕분에 도시의 시장은 품질의 대명사가 되었고, 모든 상품이 높은 가격에 거래됩니다."
 gdp_popular_opinion_strong_pos_capacity: "번성하는 시장"
 gdp_popular_opinion_strong_pos_capacity_desc: "도시의 명성이 사방에서 상인들을 끌어들이고 있으며, 그 결과 무역 수용량이 크게 확대됩니다."
