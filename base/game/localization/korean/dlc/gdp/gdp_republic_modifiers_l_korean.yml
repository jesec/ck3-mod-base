l_korean:
 gdp_founded_republic_modifier: "공화국 창립자"
 gdp_founded_republic_modifier_desc: "해당 인물은 공화국을 세웠습니다."
 gdp_fund_alms_decree_modifier: "구휼"
 gdp_fund_alms_decree_modifier_desc: "해당 도시의 영주들은 최근 빈민에게 자선을 베풀며 관대함을 보였습니다."
 gdp_taxed_county_modifier: "전쟁세 납부"
 gdp_taxed_county_modifier_desc: "해당 영지는 최근 전쟁 자금을 마련하기 위해 막대한 세금을 납부했습니다."
 gdp_tax_holiday_decree_modifier: "세금 감면"
 gdp_tax_holiday_decree_modifier_desc: "칙령에 따라 도시 세금을 낮춘 덕분에 시민들의 호의를 얻었습니다."
 gdp_trade_support_modifier: "무역 지원"
 gdp_trade_support_modifier_desc: "해당 인물은 무역로를 개선하기 위해 공화국으로부터 무역 지원을 받았습니다."
 republic_reliable_caravans_modifier: "믿음직한 상단"
 republic_reliable_caravans_modifier_desc: "해당 인물의 무역로는 더욱 체계적으로 조직된 상단의 지원을 받고 있습니다."
 republic_premium_contracts_modifier: "우대 계약"
 republic_premium_contracts_modifier_desc: "해당 인물은 상품 판매를 위한 유리한 계약을 확보했습니다."
 republic_inspector_bribery_modifier: "감찰관 매수"
 republic_inspector_bribery_modifier_desc: "해당 인물의 시장 감찰관들은 뇌물에 매수되었습니다."
 gdp_glorification_modifier: "시민들의 찬사"
 gdp_glorification_modifier_desc: "해당 영주는 도시에서 공개적인 찬사를 받고 있으며, 거리와 평의회 회관 곳곳에서 그 이름과 초상을 기리고 있습니다.\n\n[GetLaw( 'republican_elective_succession_law' ).GetName] [voting_strength|E]: +1"
 gdp_civic_labor_modifier: "시민 노동"
 gdp_civic_labor_modifier_desc: "해당 영주는 수도 시민들에게 노동력과 전문 기술을 보태도록 요청했습니다. 시민들의 도움으로 본적지 건설에 드는 비용과 시간이 감소합니다."
 gdp_popular_mandate_modifier: "대중의 지지"
 gdp_popular_mandate_modifier_desc: "해당 영주는 자신의 집권이 계속되도록 수도 시민들의 지지를 결집시켰습니다. 그 결과 다음 선거에서 더 큰 영향력을 행사할 수 있습니다.\n\n#weak 이 [modifier|E]는 한 번의 선거에만 적용됩니다#!\n\n[GetLaw( 'republican_elective_succession_law' ).GetName] [voting_strength|E]: #P +1#!"
 gdp_patrician_promoted_voter_modifier: "홍보로 평판 향상"
 gdp_patrician_promoted_voter_modifier_desc: "성공적인 홍보 활동 덕분에 해당 인물의 공화국 내 위상이 높아졌습니다.\n[GetLaw( 'republican_elective_succession_law' ).GetName] [voting_strength|E]: #P +1#!"
 republic_procedural_advantage_modifier: "절차적 우위"
 republic_procedural_advantage_modifier_desc: "해당 인물은 다음 의회 투표에서 지지를 늘리는 데 필요한 절차와 서류를 준비했습니다."
 gdp_pledged_assembly_vote_modifier: "평의회 표 약속"
 gdp_pledged_assembly_vote_modifier_desc: "[assembly|E] 구성원들이 해당 인물에게 자신의 표를 약속했습니다.\n$EFFECT_LIST_BULLET$#V 이들은 다음 [voting_session|E]에서 해당 인물과 같은 표를 던질 것입니다#!"
 gdp_bawdy_song_modifier: "외설적인 노래"
 gdp_bawdy_song_modifier_desc: "해당 인물은 외설적인 노랫말에서 영감을 받았습니다."
 gdp_patriotic_song_modifier: "조국의 노래"
 gdp_patriotic_song_modifier_desc: "해당 인물은 [Glossary( '#bold 파트리아#!', 'carnival_patria_GLOSS' )]에 대한 사랑을 노래한 가사에서 영감을 받았습니다."
 gdp_spiritual_song_modifier: "영적인 노래"
 gdp_spiritual_song_modifier_desc: "해당 인물은 영적인 노랫말에서 영감을 받았습니다."
 gdp_rejected_dancefloor_modifier: "춤 거절당함"
 gdp_rejected_dancefloor_modifier_desc: "해당 인물은 춤 상대에게 거절당했습니다."
 gdp_accepted_dancefloor_modifier: "춤 승낙받음"
 gdp_accepted_dancefloor_modifier_desc: "해당 인물은 춤을 신청했고 승낙받았습니다."
 gdp_exquisite_mask_modifier: "정교한 가면"
 gdp_exquisite_mask_modifier_desc: "해당 인물은 카니발에서 정교한 가면을 착용했습니다."
 gdp_terrifying_mask_modifier: "무시무시한 가면"
 gdp_terrifying_mask_modifier_desc: "해당 인물은 카니발에서 무시무시한 가면을 착용했습니다."
 gdp_slanderous_grafitti_modifier: "비방 낙서"
 gdp_slanderous_grafitti_modifier_desc: "해당 인물의 가족은 도시 골목 곳곳의 낙서를 통해 비방당했습니다."
 gdp_domestic_chaos_modifier: "거처 혼란"
 gdp_domestic_chaos_modifier_desc: "해당 인물의 본적지는 완전히 난장판이 되었습니다."
 gdp_fragrant_egg_modifier: "향기로운 달걀 세례"
 gdp_fragrant_egg_modifier_desc: "해당 인물은 던져진 달걀껍데기에서 튄 향수를 뒤집어썼습니다."
 gdp_sympathetic_ear_scheme_modifier: "공감하는 사람"
 gdp_sympathetic_ear_scheme_modifier_desc: "해당 인물의 궁정에는 모략에 협조적인 인물이 있습니다."
 gdp_insane_arguments_modifier: "광기 어린 주장"
 gdp_insane_arguments_modifier_desc: "해당 인물은 광기 어린 주장을 접했습니다."
 gdp_fatalistic_arguments_modifier: "숙명론적 주장"
 gdp_fatalistic_arguments_modifier_desc: "해당 인물은 숙명론적 주장을 접했습니다."
 gdp_beautiful_arguments_modifier: "아름다운 주장"
 gdp_beautiful_arguments_modifier_desc: "해당 인물은 아름다운 사람의 조언을 받았습니다."
 gdp_ugly_arguments_modifier: "추한 주장"
 gdp_ugly_arguments_modifier_desc: "해당 인물은 추한 사람의 조언을 받았습니다."
 gdp_intellectual_debate_modifier: "지적 논쟁"
 gdp_intellectual_debate_modifier_desc: "뛰어난 토론가가 해당 인물에게 주장을 제시했습니다."
 gdp_advise_of_a_fool_modifier: "바보의 조언"
 gdp_advise_of_a_fool_modifier_desc: "어리석은 사람이 해당 인물에게 주장을 제시했습니다."
 gdp_a_way_with_words_modifier: "뛰어난 언변"
 gdp_a_way_with_words_modifier_desc: "언변이 뛰어난 사람이 해당 인물에게 주장을 제시했습니다."
 gdp_sympathetic_ear_scheme_modifier_tt: "\"당신의 [scheme|E]이 [GetModifier('gdp_sympathetic_ear_scheme_modifier').GetNameWithTooltip](을)를 획득함."
 gdp_business_sabotage_modifier: "사업 방해"
 gdp_business_sabotage_modifier_desc: "해당 인물은 경쟁자에게 방해 공작을 당했습니다."
 gdp_arson_modifier: "의문의 화재"
 gdp_arson_modifier_desc: "해당 인물의 집은 정체불명의 습격자들에게 방화당했습니다."
 gdp_hardened_position_modifier: "강경한 입장"
 gdp_hardened_position_modifier_desc: "해당 인물은 협박에 대응하여 자신의 입장을 더욱 강경하게 굳혔습니다."
 gdp_intimidated_modifier: "위협받음"
 gdp_intimidated_modifier_desc: "해당 인물은 위협을 받았습니다."
 gdp_trentina_quarantine_county_modifier: "해상 격리"
 gdp_trentina_quarantine_county_modifier_desc: "질병 확산을 막기 위해 해상 봉쇄가 시행되었습니다."
 gdp_trentina_quarantine_character_modifier: "해상 격리"
 gdp_trentina_quarantine_character_modifier_desc: "해당 인물은 해상 검역으로 인해 사업상의 이익에 차질을 빚고 있습니다."
 gdp_curfew_character_modifier: "야간 통금"
 gdp_curfew_character_modifier_desc: "해당 인물에게는 본인과 다른 이들이 문제에 휘말리는 것을 막기 위해 야간 통금이 적용되었습니다."
 gdp_state_protection_modifier: "국가 보호"
 gdp_state_protection_modifier_desc: "해당 인물은 평의회의 보호를 받고 있습니다."
 gdp_republic_grieving_parent_modifier: "슬픔"
 gdp_republic_grieving_parent_modifier_desc: "해당 인물은 폭도들의 폭력으로 후계자를 잃었습니다. 그 상실의 무게는 아직 가시지 않았습니다."
 gdp_exposed_spy_modifier: "불법적인 첩자"
 gdp_exposed_spy_modifier_desc: "해당 인물이 다른 이들을 염탐한 사실이 드러났습니다."
 gdp_dodging_council_modifier: "평의회 직무 회피"
 gdp_dodging_council_modifier_desc: "해당 인물은 평의회 직무에서 빠져나갈 방법을 찾아 다른 일에 더 많은 시간을 할애할 수 있게 되었습니다."
 gdp_exemption_from_council_modifier: "평의회 직무 면제"
 gdp_exemption_from_council_modifier_desc: "해당 인물은 자신의 사업상 이해관계에 집중할 수 있도록 평의회 직무를 면제받았습니다."
 gdp_wedded_to_the_sea_modifier: "바다와 혼인"
 gdp_wedded_to_the_sea_modifier_desc: "해당 인물은 공화국 전체가 지켜보는 가운데 바다에 신의를 맹세했습니다."
 gdp_learning_from_the_masses: "대중으로부터의 배움"
 gdp_learning_from_the_masses_desc: "해당 인물은 평범한 사람들의 일상을 살펴보며 무역에 관한 지식을 적극적으로 익히려 합니다."
 gdp_cooperation_correspondenti_house_modifier: "코리스폰덴티"
 gdp_cooperation_correspondenti_house_modifier_desc: "해당 집안은 다른 무역 집안과 손을 잡고 무역망 역량을 강화했습니다."
 gdp_cooperation_compagnia_house_modifier: "콤파니아"
 gdp_cooperation_compagnia_house_modifier_desc: "해당 집안은 다른 무역 집안과 손을 잡고 자원과 전문 지식을 서로 공유하고 있습니다."
 gdp_guild_sponsor_house_modifier: "수공업 조합 후원자"
 gdp_guild_sponsor_house_modifier_desc: "해당 집안은 평의회에서 새로운 수공업 조합의 설립을 지원한 결과, 해당 조합의 후견자가 되었습니다. "
 gdp_ancient_craft_house_modifier: "고대 수공업"
 gdp_ancient_craft_carpentry_supplies_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_books_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_incense_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_base_metals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_alcohol_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_comforts_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_meat_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_cereals_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_consumption_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_jewelry_materials_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_ancient_craft_luxury_items_house_modifier: "$gdp_ancient_craft_house_modifier$"
 gdp_republic_disgraced_patrician_house_modifier: "불명예스러운 파트리치오"
 gdp_republic_disgraced_patrician_house_modifier_desc: "해당 가문은 공화국을 파멸로 몰아넣고 불명예 속에 추방되었습니다. 시장에서 이들의 이름은 거의 영향력을 지니지 못하며, 이들을 좋게 말하는 사람은 더욱 드뭅니다."
 gdp_republic_unrest_guild_district_shutdown: "조합 지구: 폐쇄"
 gdp_republic_unrest_guild_district_shutdown_desc: "장인 조합들이 문을 닫았습니다. 공방과 작업장은 운영을 완전히 멈췄습니다."
 gdp_republic_unrest_market_district_shutdown: "상업 지구: 폐쇄"
 gdp_republic_unrest_market_district_shutdown_desc: "상업 지구가 봉쇄되어 텅 비었습니다. 도시의 무역과 상업 활동이 정체되었습니다."
 gdp_republic_unrest_port_district_shutdown: "항만 지구: 폐쇄"
 gdp_republic_unrest_port_district_shutdown_desc: "항구는 도시 당국의 통제에서 벗어나 폐쇄되었습니다. 해상 수입이 끊겼습니다."
 gdp_republic_unrest_bureaucratic_district_shutdown: "행정 지구: 폐쇄"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "행정 지구가 침묵에 잠겼습니다. 도시 수입이 징수되지 못하고 있습니다."
 gdp_republic_unrest_temple_district_shutdown: "종교 공동체 지구: 폐쇄"
 gdp_republic_unrest_temple_district_shutdown_desc: "종교 공동체 지구가 협조를 중단했습니다. 이에 따라 종교적 기부금이 더 이상 국고로 들어오지 않습니다."
 gdp_republic_unrest_entertainment_district_shutdown: "오락 지구: 폐쇄"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "오락 지구가 어둡고 텅 빈 모습이 되었습니다. 도시 수입이 타격을 받는 중입니다."
 gdp_republic_unrest_urban_housing_district_shutdown: "주거 지구: 폐쇄"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "주거 구역 전체에 바리케이드가 쌓여 고립되었습니다. 도시 세금 징수 체계가 무너졌습니다."
 gdp_republic_riot_aftermath: "폭동의 여파"
 gdp_republic_riot_aftermath_desc: "거리가 불타고 곡물 창고가 약탈당했으며, 도시 공동체는 깊은 상처를 입었습니다. 회복에는 오랜 시간이 걸릴 것입니다."
 gdp_republic_uprising_aftermath: "봉기의 여파"
 gdp_republic_uprising_aftermath_desc: "군중은 제지받지 않은 채 도시 곳곳에서 난동을 부렸습니다. 질서가 회복되려면 오랜 시간이 걸릴 것입니다."
 gdp_sponsored_guild_modifier: "후원받는 수공업 조합"
 gdp_sponsored_guild_modifier_desc: "장인들은 새로운 조합을 설립하도록 허가받았으며, 부유한 후원자의 지원도 받고 있습니다."
 gdp_secret_information_house_modifier: "외교 기밀"
 gdp_secret_information_house_modifier_desc: "해당 집안은 소속 공화국의 비밀 외교 협상 내막을 파악하여 혜택을 얻습니다."
 gdp_ambitions_aligned_house_modifier: "가문 야심 일치"
 gdp_ambitions_aligned_house_modifier_desc: "해당 집안은 공화국 내에서 같은 야심을 가진 다른 집안들과 이해관계를 일치시켰습니다."
 gdp_patrician_slandered_house_modifier: "$scheme_slandered_modifier$"
 gdp_patrician_slandered_house_modifier_desc: "해당 집안의 평판은 끊임없이 쏟아지는 자극적이고 악의적인 비방으로 크게 훼손되었습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_slander_rating_penalty_value' )|0=+]\n[house|E] 구성원의 [GetLaw('republican_elective_succession_law').GetName] 지지 점수: [EmptyScope.ScriptValue( 'republic_slander_election_value' )|0=+]"
 gdp_patrician_promoted_house_modifier: "홍보로 평판 향상"
 gdp_patrician_promoted_house_modifier_desc: "성공적인 홍보 활동 덕분에 해당 집안의 공화국 내 위상이 높아졌습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
 gdp_secured_republic_monopoly_modifier: "공화국 독점권 확보"
 gdp_secured_republic_monopoly_modifier_desc: "해당 인물은 소속 공화국을 위해 독점권을 확보했습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'secured_republic_monopoly_rating_bonus_value' )|0=+]"
 gdp_head_held_high_modifier: "당당히 든 고개"
 gdp_head_held_high_modifier_desc: "해당 인물은 온갖 조롱에도 기죽지 않고 당당히 고개를 들고 있습니다."
 gdp_training_for_the_worst_modifier: "최악의 상황에 대비한 훈련"
 gdp_training_for_the_worst_modifier_desc: "해당 인물은 혹시 모를 최악의 상황에 대비해 전투 기량을 연마하기로 했습니다."
 gdp_fear_of_the_mob_modifier: "성난 군중에 대한 공포"
 gdp_fear_of_the_mob_modifier_desc: "해당 인물은 언제 마음을 바꿀지 모르는 시민들 때문에 늘 불안에 떨고 있습니다."
 gdp_champion_of_the_people_modifier: "민중의 투사"
 gdp_champion_of_the_people_modifier_desc: "해당 인물은 자신이 민중의 투사라고 선언했습니다."
 gdp_champion_of_the_state_modifier: "정부의 투사"
 gdp_champion_of_the_state_modifier_desc: "해당 인물은 자신이 현 집권 정부의 투사라고 선언했습니다."
 gdp_guild_sponsored_feast_modifier: "조합이 후원한 연회"
 gdp_guild_sponsored_feast_modifier_desc: "도시의 조합들이 연회를 베풀겠다고 해당 인물에게 제안했습니다."
 gdp_broken_trust_modifier: "신뢰 상실"
 gdp_broken_trust_modifier_desc: "해당 인물은 개인적인 이익을 챙기려고 민중의 호의를 악용했습니다."
 gdp_toast_to_adventure_modifier: "모험을 향한 열망"
 gdp_toast_to_adventure_modifier_desc: "해당 인물은 먼 곳으로 떠나 모험을 펼치기를 꿈꿉니다."
 gdp_toast_to_romance_modifier: "사랑을 향한 열망"
 gdp_toast_to_romance_modifier_desc: "해당 인물은 사랑하는 사람을 만나 낭만적인 연애를 하기를 꿈꿉니다."
 gdp_toast_to_glory_modifier: "영광을 향한 열망"
 gdp_toast_to_glory_modifier_desc: "해당 인물은 영광을 얻기를 꿈꿉니다."
 gdp_toast_to_relations_modifier: "우정을 향한 열망"
 gdp_toast_to_relations_modifier_desc: "해당 인물은 우정을 쌓고 가족과의 유대를 돈독히 하기를 바랍니다.\n$befriend_interaction$ [interaction|E] 잠금 해제"
 gdp_republic_bureaucrat_modifier: "공화국 관료"
 gdp_republic_bureaucrat_modifier_desc: "해당 인물은 최근 입법 절차에서 탁월한 업무 능력을 발휘하며 각종 서류를 매우 효율적으로 처리했습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\n[voting_sessions|E] 도중 [assembly|E] 승인: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "법률 제정자"
 gdp_republic_law_maker_modifier_desc: "해당 인물은 최근 노련한 정치적 수완을 발휘하거나 인맥을 적극적으로 활용하여 자신이 발의한 법률안을 평의회에서 통과시켰습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "영향력 있는 무역 거점"
 gdp_dominate_market_trade_post_modifier_desc: "해당 시장에서는 한 유력 가문의 무역 거점들이 상당한 영향력을 행사하고 있습니다."
 gdp_trade_post_charity_modifier: "자선 활동"
 gdp_trade_post_charity_modifier_desc: "해당 인물은 병자와 빈민을 비롯한 어려운 이웃들을 돕기 위해 자선 활동을 벌였습니다."
 gdp_gather_popular_support_modifier: "대중의 인기인"
 gdp_gather_popular_support_modifier_desc: "해당 인물은 도시 시민들의 지지를 얻어 이름을 널리 알렸으며, 그 주장에 사람들이 귀를 기울이게 되었습니다."
 gdp_gather_popular_support_house_t3_modifier: "시민들의 각별한 지지 가문"
 gdp_gather_popular_support_house_t3_modifier_desc: "해당 집안은 도시 시민들의 각별한 지지를 받고 있습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_patrician_rating_bonus_value')|0=+]\n[house|E] 구성원의 [GetLaw('republican_elective_succession_law').GetName] 지지 점수: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t3_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t2_modifier: "시민들의 두터운 지지 가문"
 gdp_gather_popular_support_house_t2_modifier_desc: "해당 집안은 도시 시민들의 두터운 지지를 받고 있습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\n[house|E] 구성원의 [GetLaw('republican_elective_succession_law').GetName] 지지 점수: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "시민들의 지지 가문"
 gdp_gather_popular_support_house_t1_modifier_desc: "해당 집안은 도시 시민들의 지지를 받고 있습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\n[house|E] 구성원의 [GetLaw('republican_elective_succession_law').GetName] 지지 점수: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "폭압적인 시장"
 gdp_signorial_execute_and_banish_modifier_desc: "해당 인물은 공화국 시민들을 처형하거나 추방했으며, 앞으로도 이런 탄압을 계속하려는 야심을 품고 있습니다."
 gdp_ambition_promote_scheme_bonus_modifier: "파트리키 홍보"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "해당 인물은 다른 파트리키들의 평판을 높이려고 시간과 노력을 기울였고, 그 대가로 상대방의 호의를 얻었습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (평가는 중첩되지 않음)#!"
 gdp_noble_magistrate_modifier: "귀족 정무관직"
 gdp_noble_magistrate_modifier_desc: "해당 인물은 공직자로서 청렴과 명예를 지키며 공화국에 봉사하도록 하급 귀족 정무관직을 부여받았습니다."
 gdp_republic_plaza_prestige_modifier: "위신을 드높인 광장"
 gdp_republic_plaza_prestige_modifier_desc: "해당 인물은 대광장을 위해 힘을 보탠 덕분에 위신이 높아지고 시민들의 호의도 얻었습니다."
 gdp_republic_trader_competitiveness_modifier: "강경한 무역상"
 gdp_republic_trader_competitiveness_modifier_desc: "해당 인물은 거래에서 절대 양보하지 않는 냉철한 무역상입니다. 결국 물러서는 쪽은 언제나 상대방입니다."
 gdp_republic_plaza_chancery_modifier: "문서국 목재"
 gdp_republic_plaza_chancery_modifier_desc: "해당 인물은 문서고를 정비한 뒤 남은 목수들의 일손과 압착 장비, 잘 건조된 목재로 자신의 거처를 정비하고 있습니다."
 gdp_republic_plaza_scriptorium_modifier: "넉넉한 기록실"
 gdp_republic_plaza_scriptorium_modifier_desc: "해당 인물은 코뮌의 필경사들에게 물품을 공급한 적이 있으며, 품질 좋은 잉크와 안료도 넉넉히 보유하고 있습니다."
 gdp_republic_plaza_magistracy_modifier: "정무관의 예복"
 gdp_republic_plaza_magistracy_modifier_desc: "해당 인물은 사비를 들여 도시 정무관들의 예복을 마련했고, 그 덕분에 법을 다루는 자리마다 예우를 받고 있습니다."
 gdp_republic_plaza_popular_favor_modifier: "인망 좋은 허수아비"
 gdp_republic_plaza_popular_favor_modifier_desc: "해당 인물은 시민들의 마음을 움직이는 데 능숙하며, 시민들이 누리는 편의시설에 자신이 돈을 댔다는 사실도 빠짐없이 알립니다."
 gdp_republic_plaza_trade_capacity_modifier: "계량 및 봉인"
 gdp_republic_plaza_trade_capacity_modifier_desc: "해당 인물이 취급하는 상품은 계량할 때 아무런 이의도 받지 않으며, 계절이 지날수록 더 많은 상품이 거래됩니다."
 gdp_republic_plaza_expertise_modifier: "광장의 무역상"
 gdp_republic_plaza_expertise_modifier_desc: "해당 인물은 도시의 여러 상인에게 영향력을 행사하며, 보통은 수십 년에 걸쳐 쌓아야 할 상품과 무역에 관한 깊은 지식을 얻고 있습니다."
 gdp_republic_plaza_estate_income_modifier: "공공 채권자"
 gdp_republic_plaza_estate_income_modifier_desc: "코뮌이 해당 인물에게 빚을 지고 있으며, 이자는 어김없이 해당 인물의 회계 사무실로 지급됩니다."
 gdp_republic_plaza_physician_modifier: "의사의 호의"
 gdp_republic_plaza_physician_modifier_desc: "해당 인물은 도시의 병동에 약초와 치료제를 비축하는 비용을 부담했으며, 그 과정에서 자기 집안의 몫도 빠짐없이 챙겼습니다."
 gdp_republic_plaza_hired_swords_modifier: "용병단 급료 지급자"
 gdp_republic_plaza_hired_swords_modifier_desc: "해당 인물은 고용된 용병단이 급료를 제때 전액 받도록 책임지며, 용병들은 누가 그 돈을 댔는지 잊지 않습니다."
 gdp_republic_plaza_organized_worker_modifier: "노동력 조직자"
 gdp_republic_plaza_organized_worker_modifier_desc: "해당 인물은 대규모 건설 사업에 필요한 노동력을 조직하면서 그 과정에서 필요한 대규모 물류 관리에 관한 풍부한 지식을 쌓았습니다."
 gdp_republic_civic_works_labor_modifier: "조직화된 노동력"
 gdp_republic_civic_works_labor_modifier_desc: "공화국이 노동자들을 모아 체계적으로 배치한 덕분에 수도 전역에서 건설 작업이 더욱 빠르게 진행되고 있습니다."
 gdp_republic_civic_works_materials_modifier: "자재 조달"
 gdp_republic_civic_works_materials_modifier_desc: "건설 자재를 체계적으로 조달하고 비축한 결과, 수도 전역에서 건설 비용이 감소했습니다."
 gdp_republic_civic_works_amenities_modifier: "공공 편의시설"
 gdp_republic_civic_works_amenities_modifier_desc: "새로 마련된 목욕탕과 분수, 시민들이 모일 수 있는 공간 덕분에 도시 시민들의 기분이 한결 좋아졌습니다."
 gdp_republic_civic_works_market_modifier: "증설 시장"
 gdp_republic_civic_works_market_modifier_desc: "상업 지구를 확장하고 체계적으로 정비한 덕분에 더 많은 상인이 모여들고 수도의 무역 여건도 개선되었습니다."
 gdp_republic_civic_works_guilds_modifier: "기능공 조합 기금 출연"
 gdp_republic_civic_works_guilds_modifier_desc: "후원받은 조합들이 숙련된 장인들을 수도로 불러들인 덕분에 투자가 활발해지고 수도의 여건도 꾸준히 개선되고 있습니다."
 gdp_republic_civic_works_labor_character_modifier: "노동 인력망"
 gdp_republic_civic_works_labor_character_modifier_desc: "해당 영주는 시정 사업에 필요한 인력을 조직하면서 수도 곳곳의 숙련 노동자 및 도급업자들과 인맥을 쌓았습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "공급망"
 gdp_republic_civic_works_materials_character_modifier_desc: "시정 사업에 필요한 자재를 조달하면서 석재와 목재를 비롯한 각종 물자를 유리한 가격에 안정적으로 공급받을 길이 열렸습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "시정 후견자"
 gdp_republic_civic_works_amenities_character_modifier_desc: "해당 영주는 도시의 공공 편의시설에 자금을 지원한 덕분에 수도 시민들 사이에서 뚜렷한 호감을 얻었습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "시장 인맥"
 gdp_republic_civic_works_market_character_modifier_desc: "해당 영주는 수도의 상업 지구를 확장하면서 상인 및 무역상들과 인연을 맺었고, 이들은 그때 받은 도움을 잊지 않고 있습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "조합 후견자"
 gdp_republic_civic_works_guilds_character_modifier_desc: "해당 영주는 기능공 조합에 기금을 출연해 도시 장인들과 오랜 유대를 맺었고, 장인들의 감사는 영주의 위상을 높이는 데 도움이 되었습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "정착지 확장"
 gdp_republic_civic_works_settlement_modifier_desc: "수도의 기반 시설에 투자해 더 많은 사람이 살 수 있는 터전을 마련하자, 새로운 주민들이 몰려들기 시작했습니다."
 gdp_republic_civic_works_settlement_character_modifier: "도회지 투자자"
 gdp_republic_civic_works_settlement_character_modifier_desc: "해당 영주는 공화국 수도의 확장에 자금을 지원한 덕분에 도시의 발전 방향에 영향력을 행사할 수 있게 되었습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "시정 질서"
 gdp_republic_civic_works_order_modifier_desc: "경비 인력과 도시 기반 시설에 투자한 덕분에 수도의 질서가 개선되고 통치하기도 한결 수월해졌습니다."
 gdp_republic_civic_works_order_character_modifier: "시정 권위"
 gdp_republic_civic_works_order_character_modifier_desc: "해당 영주는 수도의 치안과 질서 유지에 자금을 지원한 덕분에 도시를 안정적으로 다스리고 행정을 훌륭하게 운영한다는 평판을 얻었습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "공립학교"
 gdp_republic_civic_works_school_modifier_desc: "해당 영지에는 공립학교 건설을 위해 상당한 자금이 지원되었습니다."
 gdp_republic_civic_works_school_character_modifier: "학교 후견자"
 gdp_republic_civic_works_school_character_modifier_desc: "해당 인물은 수도에 학교를 세우는 데 자금을 지원해 젊은 세대가 배움의 기회를 얻도록 했습니다.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
