 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$: 성공"
 gdp_trade_scheme.0012.desc_capacity: "[disrupted_trade_route.GetName|U](은)는 예전에 운송하던 상품을 모두 실어 나르기에는 공간이 부족할 것이다. 왜 장부의 숫자가 더는 맞지 않는지 [target.GetShortUIName](이)가 의아해하게 두자."
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U](은)는 시장에서 누리던 우선권과 특권을 잃었다. 이제 [target.GetShortUIName]에게 돈 벌기가 얼마나 어려운지 보여 주자."
 gdp_trade_scheme.0012.desc_discovered: "\n\n다만 내 부하 한 명이 발각되어 나까지 추적당할지도 모른다."
 gdp_trade_scheme.0012.a: "그 멍청이에게 행운이 따르길!"
 gdp_trade_scheme.0012.a_discovered: "그럴 만한 가치가 있었군."
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$: 실패"
 gdp_trade_scheme.0013.desc: "최선을 다했음에도 [target.GetShortUIName](와)과 [target.GetHerHis] 무역로는 여전히 예전처럼 아무 문제 없이 돌아가고 있다."
 gdp_trade_scheme.0013.desc_discovered: "\n\n게다가 내 무역상 한 명이 공작을 벌이려다 목격되었다. 우리 가문의 이름에 먹칠을 한 셈이다."
 gdp_trade_scheme.0013.a: "분통이 터지는군."
 gdp_destroyed_republic_opinion: "내 공화국을 무너뜨림"
 gdp_smuggler_opinion: "밀수업자"
