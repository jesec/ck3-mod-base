l_korean:
 gdp_improve_trade_capacity: "무역 수용량 개선"
 gdp_improve_trade_capacity_action: "무역 수용량 개선"
 gdp_improve_trade_capacity_desc: "내 무역로의 수용량을 늘릴 방법을 찾아보라고 지시했다."
 gdp_improve_trade_capacity_desc_general: "$gdp_improve_trade_capacity$은 [merchant|E]이나 [patrician|E]가 가솔들을 동원해 자신이 소유한 [trade_routes|E] 중 하나의 [trade_route_capacity|E]을 높이는 [trade_scheme|E]입니다."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "선택한 [trade_route|E]의 [capacity|E]이 #V 15년#! 동안 증가합니다"
 gdp_improve_trade_capacity_invalidated_title: "@scheme_icon! $gdp_improve_trade_capacity$ 모략 종료"
 gdp_improve_trade_competitiveness: "무역 경쟁력 개선"
 gdp_improve_trade_competitiveness_action: "무역 경쟁력 개선"
 gdp_improve_trade_competitiveness_desc: "경쟁 무역로보다 내 무역로가 우선권을 얻을 방법을 찾아보라고 지시했다."
 gdp_improve_trade_competitiveness_desc_general: "$gdp_improve_trade_competitiveness$은 [merchant|E]이나 [patrician|E]가 가솔들을 동원해 자신이 소유한 [trade_routes|E] 중 하나의 [trade_competitiveness|E]을 높이는 [trade_scheme|E]입니다."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "선택한 [trade_route|E]의 [competitiveness|E]이 #V 15년#! 동안 증가합니다"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! $gdp_improve_trade_competitiveness$ 모략 종료"
 gdp_improve_trade_expertise: "무역 전문성 개선"
 gdp_improve_trade_expertise_action: "무역 전문성 개선"
 gdp_improve_trade_expertise_desc: "우리 무역로의 운영 효율을 높일 방법을 찾도록 지시했다. 모두가 적절한 사람들을 알고 실수에서 교훈을 얻도록 하기 위해서다."
 gdp_improve_trade_expertise_desc_general: "$gdp_improve_trade_expertise$은 [merchant|E]이나 [patrician|E]가 가솔들을 동원해 자신이 보유한 [trade_routes|E] 중 하나의 [trade_expertise|E] 획득 속도를 높이는 [trade_scheme|E]입니다."
 GDP_IMPROVE_TRADE_EXPERTISE_SUCCESS_DESC: "선택한 [trade_route|E]의 [expertise|E]이 #V 15년#! 동안 더 빠르게 증가합니다"
 gdp_improve_trade_expertise_invalidated_title: "@scheme_icon! $gdp_improve_trade_expertise$ 모략 종료"
 GDP_IMPROVE_TRADE_ROUTES_STAFFED_ROUTES_DESC: "[trader|E]이 배치된 [trade_routes|E]: $VALUE|+=0$"
 GDP_IMPROVE_TRADE_ROUTES_ESTABLISHED_ROUTES_DESC: "오래 운영된 [trade_routes|E]: $VALUE|+=0$"
 gdp_improve_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName](이)가 더 이상 자신의 [trade_routes|E]를 운영하지 않음"
 gdp_improve_trade_routes_owner_has_no_routes: "[owner.GetShortUIName]에게 더 이상 개선할 [trade_route|E]가 남아 있지 않음"
 gdp_improve_trade_routes_needs_route_tt: "당신이 하나 이상의 [trade_route|E]를 소유함"
 gdp_improve_trade_routes_focused_route_gone: "[owner.GetShortUIName](이)가 선택한 [trade_route|E]가 더 이상 존재하지 않음"
 gdp_improve_trade_capacity_decision_success_tt: "[scheme|E] 성공 시, [selected_item.GetName|l](이)가 #V 15년#! 동안 [GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip] 획득"
 gdp_improve_trade_competitiveness_decision_success_tt: "[scheme|E] 성공 시, [selected_item.GetName|l](이)가 #V 15년#! 동안 [GetModifier('gdp_improve_trade_routes_competitiveness_modifier').GetNameWithTooltip] 획득"
 gdp_improve_trade_expertise_decision_success_tt: "[scheme|E] 성공 시, [selected_item.GetName|l](이)가 #V 15년#! 동안 [GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip] 획득"
 gdp_improve_trade_routes_capacity_modifier: "물류 개선"
 gdp_improve_trade_routes_competitiveness_modifier: "이권 확고"
 gdp_improve_trade_routes_expertise_modifier: "노련한 무역상"
 gdp_improve_trade_capacity_decision: "무역 모략: 수용량"
 gdp_improve_trade_capacity_decision_desc: "우리 무역상들이 상품을 실을 공간이 부족해 일부 상품을 가져가지 못한다는 것을 알고 있다. 투자와 조정만 거치면 우리가 방문하는 모든 시장에서 입지를 넓히는 것은 시간문제다."
 gdp_improve_trade_capacity_decision_tooltip: "선택한 [trade_route|E]를 대상으로 [GetScheme('gdp_improve_trade_capacity').GetTypeName] [scheme|E]을 시작함"
 gdp_improve_trade_capacity_decision_confirm: "공간과 일손을 확보하자."
 gdp_improve_trade_capacity_decision_effect_tt: "[selected_item.GetName|l]에 중점을 둔 [GetScheme('gdp_improve_trade_capacity').GetTypeName] [scheme|E]을 시작함"
 gdp_improve_trade_competitiveness_decision: "무역 모략: 경쟁력"
 gdp_improve_trade_competitiveness_decision_desc: "내 무역상들이 자주 찾는 시장 중에는 경쟁이 치열한 곳도 있다. 돈을 써야 할 사람들에게 돈을 쥐여 주고 현지인들과 소소한 거래를 성사시키면, 내 무역상들이 경쟁자들보다 우선권을 얻을 것이다."
 gdp_improve_trade_competitiveness_decision_tooltip: "선택한 [trade_route|E]를 대상으로 [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] [scheme|E]을 시작함"
 gdp_improve_trade_competitiveness_decision_confirm: "더 좋은 대우를 받아 내자."
 gdp_improve_trade_competitiveness_decision_effect_tt: "[selected_item.GetName|l]에 중점을 둔 [GetScheme('gdp_improve_trade_competitiveness').GetTypeName] [scheme|E]을 시작함"
 gdp_improve_trade_expertise_decision: "무역 모략: 전문성"
 gdp_improve_trade_expertise_decision_desc: "무역상들 말로는 우리가 일부 무역로를 운영하면서 같은 실수를 번번이 되풀이한다고 한다. 이제 그동안의 경험을 살려 무역로를 최대한 효율적으로 운영할 때다."
 gdp_improve_trade_expertise_decision_tooltip: "선택한 [trade_route|E]를 대상으로 [GetScheme('gdp_improve_trade_expertise').GetTypeName] [scheme|E]을 시작함"
 gdp_improve_trade_expertise_decision_confirm: "무역상들을 한 무역로에 배치하자."
 gdp_improve_trade_expertise_decision_effect_tt: "[selected_item.GetName|l]에 중점을 둔 [GetScheme('gdp_improve_trade_expertise').GetTypeName] [scheme|E]을 시작함"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$: 성공"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U](이)가 이제야 제 구실을 하고 있다. 무역상들에게서 드디어 내가 바라던 대로 더 많은 상품을 운송하게 되었다는 보고를 받았다."
 gdp_trade_scheme.0002.a: "들인 돈이 한 푼도 아깝지 않군."
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: 실패"
 gdp_trade_scheme.0003.desc: "최선을 다했지만 무역로의 운영은 예전과 조금도 달라지지 않았다. 화가 치밀지만, 시장이란 때로 이런 법이다."
 gdp_trade_scheme.0003.a: "다시 장부를 살펴봐야겠군."
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: 성공"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U](이)가 드디어 내가 기대했던 만큼 돈을 벌어들이고 있다. 내 무역상들이 경쟁자들보다 우선권을 얻었고, 우리는 이전보다 더 많은 돈을 벌고 있다."
 gdp_trade_scheme.0004.a: "베푼 호의가 헛되지 않았군."
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$: 성공"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U]의 운영 효율이 이전보다 높아졌고, 우리가 저지르는 실수도 줄었다. 그 과정에서 얻은 교훈은 앞으로 우리 집안이 번영하는 데 밑거름이 될 것이다."
 gdp_trade_scheme.0005.a: "앞으로도 쌓아 나가겠다."
 gdp_disrupt_trade_routes: "무역로 방해"
 gdp_disrupt_trade_routes_action: "무역로 방해:"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName](이)가 내 시장에서 거래하고 있다. 서기 몇 명에게 뇌물을 주고 소문 하나만 제대로 퍼뜨리면 [SCHEME.GetTargetCharacter.GetHerHis] [trade_routes|E] 중 하나를 망쳐 놓을 수 있을 것이다."
 gdp_disrupt_trade_routes_desc_general: "$gdp_disrupt_trade_routes$는 [merchant|E]이나 [patrician|E]가 경쟁자의 [trade_route|E] 연결망을 방해하는 [hostile_scheme|E]입니다. [intrigue|E]을 기반으로 하며, [agents|E]를 모집할 수 있습니다."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [trade_routes|E] 중 하나가 #N 20년#! 동안 약화됩니다"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "경쟁자의 [trade_routes|E]를 방해해도 당신의 정체가 드러나지 않습니다"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "당신이 [target.GetShortUIName](와)과 [trade_market|E] 공유: $VALUE|+=0$"
 gdp_disrupt_trade_routes_invalidated_title: "@scheme_icon! $gdp_disrupt_trade_routes$ 모략 종료"
 gdp_disrupt_trade_routes_owner_not_trade_ruler: "[owner.GetShortUIName](이)가 더 이상 자신의 [trade_routes|E]를 운영하지 않음"
 gdp_disrupt_trade_routes_target_not_trade_ruler: "[target.GetShortUIName](이)가 더 이상 자신의 [trade_routes|E]를 운영하지 않음"
 gdp_disrupt_trade_routes_target_has_no_routes: "[target.GetShortUIName]에게 더 이상 방해할 [trade_route|E]가 남아 있지 않음"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName](이)가 하나 이상의 [trade_route|E]를 소유함"
 gdp_disrupt_trade_routes_capacity_modifier: "물류 방해"
 gdp_disrupt_trade_routes_competitiveness_modifier: "평판 악화"
 gdp_disrupt_trade_routes_discovered_opinion: "내 무역로 방해"
 gdp_disrupt_trade_routes_target_notification: "[disrupted_trade_route.GetName|l]에서 문제 발생"
 gdp_disrupt_trade_routes_target_notification_tt: "내 [trade_routes|E] 중 하나에 무슨 문제가 생겼다. 무역상들도 원인을 알아내지 못했다."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "내 [trade_routes|E] 중 하나가 제대로 운영되지 않고 있다. 문제의 배후에 [owner.GetShortUIName]이 있다는 사실을 무역상들이 알아냈다."
 gdp_disrupt_trade_routes_target_caught_notification: "파괴 공작 발각"
 gdp_disrupt_trade_routes_target_caught_tt: "내 [trade_routes|E] 중 하나에서 [owner.GetShortUINamePossessive] 부하 한 명이 붙잡혔다. 그는 어떤 임무를 받고 왔는지 자백했다."
