l_korean:
 gdp_merchant_trade_opportunity.0001.t: "경쟁자에 도전: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "[task_contract_target.GetPrimaryTitle.GetNamePossessive] 존재는 우리 쪽에 계속 눈엣가시였으며, 우리의 전망과 이득에 해를 입혀 왔다. 특히 [local_market.GetShortName]에서는 더하다.\n\n이런 문제아는 처리해야만 하며, 무슨 수를 쓰든 우리가 현지 시장의 정당한 주인임을 보여주어야 한다."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "몇 날 며칠을 현지 상인들과 장광설을 벌인 끝에, [trade_market.GetShortName] 시장의 모든 것을 알아낸 우리는 [target_title.GetNamePossessive] 약점 또한 알게 되었다.\n\n저들의 현지 관계를 약화하고, 중요 지역에서 저들보다 싼 값에 팔거나 더 높은 값을 불러 이길 방법을 찾았다. 곧 저들의 수익도 평판과 함께 땅바닥으로 떨어지겠지!"
 gdp_merchant_trade_opportunity.0002.a: "우리 구역에서 얼쩡거리면 어떻게 되는지 가르쳐 주자."
 gdp_merchant_trade_opportunity.0002.b: "우리 패를 공개하면 저들의 존경을 얻을 수 있겠지."
 gdp_merchant_trade_opportunity.0002.b.tt: "당신은 [friend|E], [spouse|E]이거나 [SCOPE.ScriptValue('high_skill_rating')|V0] 이상의 [diplomacy|E]를 보유해야 하며, 부정적인 [relation|E]를 보유하거나 [house_feuding|E] 상태가 아니어야 함"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "[trade_market.GetShortName](와)과 더 멀리에서 [target_title.GetNamePossessive] 연락망을 파악하려던 우리의 시도가 큰 결실을 보지 못했다. 심지어 [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')]에서 우리의 평판까지 해를 입은 것 같다.\n\n서투른 거래로 인해 [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]의 입지만 더 단단해졌으며, 저들의 긴 무역로 연결망에는 가느다란 틈도 찾아볼 수 없었다..."
 gdp_merchant_trade_opportunity.0003.a: "젠장! 우리 수익이 날아가게 생겼군!"
 gdp_merchant_trade_opportunity.0011.t: "상품 홍보: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]의 붐비는 [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]에서는 행상인과 상인이 온갖 상품을 두고 치열한 경쟁을 벌이는 모습을 볼 수 있다.\n\n소란 속에 서 있으면 행인들이 끝없이 스쳐 간다. 그러다 보면 우리 상품을 어떻게 돋보이게 할 것이며, 어떻게 손님과 상점 주인들 모두의 눈길을 사로잡을 것인지 생각하게 된다..."
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "[target_title.GetBaseNameNoTierNoTooltip]에서 [trade_good_type.GetNameNoTooltip|l](을)를 홍보해 판매하려던 시도가 기반을 다진 것 같다. 많은 이가 우리의 \"훌륭한\" 제품을 찾고 있으며, 지역 전반에 걸쳐 매출도 꾸준히 증가하는 중이다.\n\n그 모든 판촉과 홍보 노력이 사람들의 지갑을 제대로 공략한 모양이다!"
 gdp_merchant_trade_opportunity.0012.a: "이 기회를 놓쳐서는 안 된다."
 gdp_merchant_trade_opportunity.0012.b: "벌써 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')] 냄새가 나는군!"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "우리의 노력이 손님을 끌어들이고 있다는 사실이 확실해졌다. 물론 우리 상품의 품질을 조금 과장하긴 했는데, 그 노력이 기대만큼 효과를 거두지는 못했지만 말이다...\n\n사실은 매출이 감소하고 있고, 구매자들 사이의 신뢰가 바닥나면서 [target_title.GetBaseNameNoTierNoTooltip] 전역의 [trade_good_type.GetNameNoTooltip|l]에 대한 수요도 줄고 있다."
 gdp_merchant_trade_opportunity.0013.a: "그래도 #EMP 이거야말로#! 최고급 [trade_good_type.GetNameNoTooltip|l]인데!"
 gdp_merchant_trade_opportunity.0021.t: "투자 장려: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip](을)를 돌아다니면 기반 시설의 결점이 많이 보인다. 도로의 상태에서부터 하찮은 창고 시설, 그리고 [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l] 자체까지.\n\n지역 영주들도 약간의 투자가 대단한 혜택을 가져다준다는 사실을 깨달아야만 한다. 그러지 못한다면, 우리가 직접 길을 뚫어야만 여기서 많은 연줄을 만들어 나갈 수 있다..."
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "[target_title.GetAdjectiveNoTooltip] 기반 시설의 결점과, 이를 개선해서 얻을 혜택을 빠르게 진단한 덕분에 우리는 원하던 사람들의 관심을 끌 수 있었다.\n\n씨앗이 이제 열매를 맺기 시작했다. [local_ruler.GetTitledFirstName]의 마음이 넘어왔으며 일이 시작될 예정이다. 거래의 흐름이 증가할 테니 지역 상인과 주민들 또한 머뭇거리면서도 벌써 우리를 축하하기 시작했다."
 gdp_merchant_trade_opportunity.0022.a: "뭔가를 해내려면 직접 하는 편이 낫다."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "이곳의 사람들에게 [target_title.GetAdjectiveNoTooltip] 기반 시설의 수많은 결점을 주지시키기 위한 우리의 시도는 민망하게도 별 성과를 올리지 못했고, 이 멍청한 사람들이 귀를 기울일 것 같지도 않다.\n\n실수가 계속되면 상황은 우리가 처음 왔을 때와 달라질 게 없을 것이고, 우리가 직접 일을 처리하지 않는다면 아무리 노력해 봤자 어리벙벙한 지역 관료와 상인만 남을 것이다..."
 gdp_merchant_trade_opportunity.0023.a: "무역 흐름을 어떻게든 이루어야만 한다."
 gdp_merchant_trade_opportunity.0023.b: "지역 사람들이 얼간이로군..."
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "[local_market.GetShortName]의 [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]에는 불운이 남긴 상처가 역력했다. 판자로 막히고 버려진 상점들은 이 힘든 시기에 상인들이 대거 떠나고 난 뒤, 정체되어 버린 무역의 흐름을 여실히 보여주고 있었다.\n\n하지만 이들은 손을 떨며 달아나봤자 상업에는 아무런 도움이 안 되며, 평화는 절대 보장할 수 없다는 사실을 배워야만 한다. 질서를 불러오고 저들의 빈 자리를 채우는 역할은 우리의 몫이 되었다."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: 성공"
 gdp_merchant_trade_opportunity.0032.desc: "막아버린 문 뒤에서 엿보던 [target_title.GetBaseNameNoTierNoTooltip]의 거주민들은 빠르게 우리의 목적을 이해했고, 우리는 시장과 창고 등지에서 민첩하게 입지를 굳힐 수 있었다.\n\n이 재조정을 따라가지 못하고 뒤처진 이들은 회복된 질서가 주는 혜택과 느리게 재생되어 가는 거래의 흐름을 마지못해 받아들일 수밖에 없었다."
 gdp_merchant_trade_opportunity.0032.a: "이런 게 좋은 사업이지..."
 gdp_merchant_trade_opportunity.0032.b: "여기서 할 일은 끝났다."
 every_county_province_custom: "[saved_county.GetName] 내 $recently_looted_modifier$ 상태인 모든 [holding|E]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: 실패"
 gdp_merchant_trade_opportunity.0033.desc: "[target_title.GetBaseNameNoTierNoTooltip]에서 우리가 보였던 공격적인 존재감, 그리고 거주민들을 우리 뜻대로 살살 움직여 보려던 시도는 널리 퍼진 적대감과 협력을 거부하는 고집을 불러왔다.\n\n지역 사람들과 현지 상인들은 우리를 상대로 연대했으며, 질서와 상업의 부흥을 위해 우리의 지배를 받아들이는 게 너무나 큰 대가라고 생각한다!"
 gdp_merchant_trade_opportunity.0033.a: "고집만 센 멍청이들!"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "[local_market.GetShortName]의 [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]에는 기능공 집단이 수도 없이 많다. 이들은 엄격한 관리 아래 밧줄부터 은식기까지 모든 것을 생산하며 지역 주민과 구매자들의 수요를 맞춘다.\n\n소개만 잘 받는다면 우리도 이런 실력 있는 장인들의 연결망에 접근해, 후원자로서 평판을 쌓을 수 있다. 그리고 어쩌면 수익을 낼 수 있는 방법이나 유행에 대해서도 배울 수 있을지 모른다."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: 성공"
 gdp_merchant_trade_opportunity.0042.desc: "우리의 금화가 [target_title.GetBaseNameNoTierNoTooltip]에서 괜찮은 연줄을 만들어냈다. 재능 있는 온갖 분야의 장인들에게 자금을 지원하면, 조합원들이 조용히 노력해 소박하면서도 놀라운 물건을 만들어낸다.\n\n후원자로 알려지니 모든 구역에서 따스한 환영을 받고, [inspired_artisan.Custom('InspirationArtisanType')] 생산에 자금을 지원해 줄 이를 찾고 있는 유명한 현지 기능공인 [inspired_artisan.GetFirstName]의 관심까지 얻게 되었다."
 gdp_merchant_trade_opportunity.0042.a: "우리 투자가 목표를 이뤘군."
 gdp_merchant_trade_opportunity.0042.b: "이런 기회는 놓칠 수 없지!"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: 실패"
 gdp_merchant_trade_opportunity.0043.desc: "현지 [target_title.GetBaseNameNoTierNoTooltip] 기능공들에게 접근하려던 우리의 시도는 매번 거절당했다. 우리의 금화와 관심은 마지못해 받아들여졌으며, 감사는 거의 받지 못했다.\n\n혹시 경쟁자의 조종으로 인한 오해 때문에 우리 평판이 해를 입었던 걸까? 아니면 뻔뻔하게 남의 일에 참견한다고 이렇게 된 건가? 진실은 영원히 알 수 없겠지..."
 gdp_merchant_trade_opportunity.0043.a: "하, 어차피 상품도 쓰레기 같더군..."
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "[task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip]의 [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l]에는 모든 시선과 몸짓에서 느껴지는 돈의 부름이 가득하다. 이곳은 우리의 금화를 부르고, 그 약속을 거부하지 못하는 사람들을 끌어내어 고객으로 만든다.\n\n[ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')](을)를 주는 사람보다 가져가는 사람을 찾는 게 더 쉽지만, 잘 파악해야 한다. [local_market.GetShortName]의 유력자들을 생각하고 낚싯줄을 드리워야 하며, 가치 있는 목표를 낚으려면 교활하게 인내해야 한다."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: 성공"
 gdp_merchant_trade_opportunity.0052.desc: "우리의 열린 자금줄에 대한 소문이 [target_title.GetBaseNameNoTierNoTooltip]에 퍼져나가자, 얼마 지나지 않아 [debtor.GetTitledFirstName]에게서 호기심을 유발하는 소박한 초대를 받았다.\n\n알고 보니 이 [debtor.Custom('LadyLordWomanMan')]께서 본인 장부에 약간의 \"융통성\"이 필요하신 모양이었다. 고작 상인 주제에, 이렇게 존경받는 분의 수단에 의심을 품을 수는 없는 법이니까..."
 gdp_merchant_trade_opportunity.0052.a: "\"여기서 장부를 조정합시다... #EMP [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]의 [debtor.GetTitleAsNameNoTooltip], [debtor.GetFirstNameNoTooltip] 님...#!\""
 gdp_merchant_trade_opportunity.0052.b: "\"죄송하지만 이번에는 힘들 것 같습니다.\""
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: 실패"
 gdp_merchant_trade_opportunity.0053.desc: "우리의 열린 자금줄에 대한 소문을 널리 퍼뜨렸지만, 성과는 미미했다. [target_title.GetBaseNameNoTierNoTooltip]의 현지 유력자들이 우리의 너그러운 제안을 강력하게 거부했다.\n\n우리가 거래를 잘못 처리했는지, 다른 상인의 사업에 간섭했던 건지, 아니면 이 지역 권력자들이 이유는 모르겠지만 그냥 널리 번영하고 있었던 건지는 알 수 없었다."
 gdp_merchant_trade_opportunity.0053.a: "상관없다. 결국에는 돌아올 테니까. 늘 그렇지..."
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName](이)가 흥미로운 소식을 가져왔다. [market_owner.GetName](이)가 [trade_good_type.GetNameNoTooltip|l](을)를 필요로 하며, 대량 운송을 해줄 수 있는 상인을 찾고 있다는 소식이었다. \n\n[task_contract_target.GetHouse.GetBaseName] 회사의 [task_contract_target.GetTitledFirstName](은)는 거들먹거리며 자기들이 확실히 거래를 체결할 수 있다고 자랑스럽게 선언한 바 있다. 간계와 술책을 활용하면 우리가 능가하는 것은 물론, 저들에게 주제까지 알려 줄 수 있을지 모른다."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: 성공"
 gdp_merchant_trade_opportunity.0062.desc: "[target_title.GetNamePossessive] 무역을 방해하려던 미묘한 시도가 우리에게 유리하게 흘러갔다. 입찰 경쟁의 날이 오면 [target_title.GetHolder.GetTitledFirstName](은)는 충격과 공포 속에 우리가 승리를 쟁취하는 모습을 가만히 바라봐야만 할 거다.\n\n[target_title.GetNameNoTooltip]의 평판은 크게 떨어졌으며, 우리는 이 힘의 공백을 활용해 이득을 보아야 한다."
 gdp_merchant_trade_opportunity.0062.a: "모두 계획대로 되고 있군..."
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: 실패"
 gdp_merchant_trade_opportunity.0063.desc: "속임수를 활용하려고 노력했으나, [target_title.GetHolder.GetTitledFirstName](은)는 또다시 우리를 능가하고 말았다. 우리는 수치스럽게도 [target_title.GetNameNoTier]에게 대패했음을 인정해야 했다.\n\n우리의 실수가 무엇인지는 모를 것이다. 혹시 너무 오만했던 걸까, 아니면 재정을 좀 더 다듬어야 했나? 일단 우리는 결국 패배했으며, 무거운 머리와 빈 주머니만 남게 되었다."
 gdp_merchant_trade_opportunity.0063.a: "다음번에는 이기고 말 테다..."
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName](이)가 배송된 [trade_good_type.Custom('GetTradeGood')](을)를 검사하며 [trade_good_type.Custom('GetTradeGoodUnitPlural')](을)를 자세히 살펴보았다. 취급이 잘못되어 흠이 생긴 것은 아닌지 각 죔쇠도 확인했다.\n\n상품이 언제나 최대의 잠재력을 발휘해 활용되지는 않으며, 방치나 무지로 인해 낭비되기도 한다. 가장 낮은 지위의 행상인부터 높은 지위의 도매상에 이르기까지, 배울 수 있는 점이라면 많다."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: 성공"
 gdp_merchant_trade_opportunity.0072.desc: "우리는 [destination.GetTitle.GetNameNoTierPossessiveNoTooltip] 분주한 [destination.Custom('GetRegionalMarketTermGloss')]에 있는 [destination.Custom('GetProvinceAdjective')] 가판대와 고요한 상업의 회당 사이를 돌아다니며 수많은 소식과 이야기, [trade_good_type.Custom('GetTradeGood')] 거래의 요령을 주워들었다.\n\n[trade_good_type.Custom('GetTradeGoodUnitPlural')] 보관과 운송부터 계절에 따른 수요와 품질 평가까지. 우리가 배운 내용은 분명 [local_market.GetName|l](와)과 그 너머의 상업에 도움이 될 것이다."
 gdp_merchant_trade_opportunity.0072.a: "[trade_good_type.Custom('GetTradeGood')]에 이토록 미묘한 매력이 있는지 누가 알았겠는가?"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: 실패"
 gdp_merchant_trade_opportunity.0073.desc: "[destination.GetTitle.GetNameNoTierPossessiveNoTooltip] 분주한 [destination.Custom('GetRegionalMarketTermGloss')]에 있는 [destination.Custom('GetProvinceAdjective')] 가판대와 고요한 상업의 회당 사이를 돌아다니며 수많은 날과 끝없는 시간을 보냈다. 하지만 [trade_good_type.Custom('GetTradeGood')] 거래 기술에 대해서는 조금도 더 알게 된 것이 없는 듯했다.\n\n무뚝뚝한 행상인과 무시하는 시선을 보내던 중개인들은 우리의 질문에 거의 답하지 않았고, 대신 경멸하는 얼굴로 바라보거나 신중하게 침묵을 지켰다. 그나마 들은 소식도 사소하거나 불필요하게 복잡한 이야기뿐이었다. "
 gdp_merchant_trade_opportunity.0073.a: "쳇, 저 사람들 도움 따위는 필요 없다!"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "최근 [market.GetName|l]에서 벌인 [contract_target.GetPrimaryTitle.GetDefinitiveNamePossessive|l] 행각을 두고 우리가 한탄하는 동안 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName](이)가 눈을 흘겼다.\n\n[contract_target.GetTitledFirstName], 그리고 [contract_target.GetSuzerain.GetTitledFirstName]에서 받는 [contract_target.GetHerHis] 지원을 어떻게 하지 않으면 우리는 뒤처질 것이다..."
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: 성공"
 gdp_merchant_trade_opportunity.0082.desc: "중개인을 꼬드기고 [target_title.GetDefinitiveName|l](와)과 그 망할 특허장을 비방한 우리의 끝없는 노력이 결실을 본 듯하다. 이제 많은 이가 [target_title.GetHolder.GetTitledFirstNamePossessive] 말을 그대로 받아들이기 전에 한 번 더 생각하게 되었다.\n\n[target_title.GetHolder.GetTitledFirstNamePossessiveNoTooltip] 서류에 찍힌 [target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive] 인장마저 그 진실성을 의심받는 수준이고, 이 소식은 양쪽 어디에서도 반갑게 들리지 않을 것이 분명했다."
 gdp_merchant_trade_opportunity.0082.a: "그쪽 서류는 [ROOT.Char.GetRite.NegativeAfterLife]에나 떨어지라지!"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: 실패"
 gdp_merchant_trade_opportunity.0083.desc: "정보망을 형성하고 [target_title.GetDefinitiveName|l]의 저주받을 대리인들을 대상으로 모략을 꾸미던 우리의 끝없는 노력이 허사로 돌아갔다. [target_title.GetHolder.GetSuzerain.GetTitledFirstNamePossessive] 인장이 찍힌 특허장 앞에서 우리의 접근 방식을 고려해 보는 이는 몇 없었다.\n\n[target_title.GetHolder.GetTitledFirstNamePossessive] 평판은 전과 다름없이 흠 하나 없었고, 우리는 바닥까지 떨어진 대가로 우리의 이름만 더럽히게 되었다..."
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName]께서 여전히 [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip](을)를 향해 웃어 주시는군..."
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0091.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName](와)과 함께 잔뜩 흐린 [destination.Custom('GetRegionalMarketTermGloss')](을)를 거닐고 있었다. 전쟁과 기근이라는 변화 때문에 [destination.GetBaronyNameExplicitlyNoTooltip]의 좋지 못한 상황이 명백히 드러나 보였다.\n\n골목에는 과부, 고아, 절름발이를 비롯해 우려스러울 만큼 많은 수의 거지가 가득했으며, 버려진 가판대 위로는 절망이 또 다른 구름처럼 드리워져 있었다."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: 성공"
 gdp_merchant_trade_opportunity.0092.desc: "지역을 돌아다니던 우리는 아직도 장사하고 있는 지역 행상인과 자영업자들을 찾아낼 수 있었다. 이들은"
 gdp_merchant_trade_opportunity.0092.war: "전쟁의 약탈에도 불구하고"
 gdp_merchant_trade_opportunity.0092.disaster: "천재지변의 접근에도 불구하고"
 gdp_merchant_trade_opportunity.0092.epidemic: "최근의 질병 사태에도 불구하고"
 gdp_merchant_trade_opportunity.0092.closing: "영업을 이어갔으며, 심지어는 장부에 어느 정도의 활력을 되찾아오기도 했다. 노력은 아무리 적어도 도움이 되는 법이다.\n\n날이 갈수록 [destination.GetBaronyNameExplicitlyNoTooltip]의 [destination.Custom('GetRegionalMarketTermGloss')]에는 메아리치는 목소리가 조금 더 늘어났으며, 가판대에는 반짝이는 상품이 조금씩 더 많이 올라왔고, 여관에는 방문객이 약간 더 많아졌다.\n\n날이 갈수록 [destination.GetBaronyNameExplicitlyNoTooltip]의 시장에는 메아리치는 목소리가 조금 더 늘어났으며, 가판대에는 반짝이는 상품이 조금씩 더 많이 올라왔고, 여관에는 방문객이 약간 더 많아졌다."
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip](은)는 머지않아 다시 번영할 것이다."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: 실패"
 gdp_merchant_trade_opportunity.0093.desc: "우리는 [destination.GetBaronyNameExplicitlyNoTooltip](을)를 따라 이동하며 선행을 베풀 능력이 되고, 지역 상업의 생명줄을 되살릴 자들의 손에 동전을 넘겨줄 기회를 찾아 헤맸다. 그러나 대부분은 헛된 시도였다.\n\n우리가 찾아낸 이는 대부분이 폭리를 챙기는 업자였으며, 그러므로 너그럽게 대할 가치도 없었다. 그렇지 않으면 아무런 도움도 되지 않는 위치의 사람이었다. 난관 앞에 낙천적인 태도를 유지하기는 힘들었고, 우리는 곧 절망과 좌절에 빠져들었다."
 gdp_merchant_trade_opportunity.0093.a: "우리가 더 할 수 있는 일이 없군..."
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName](와)과 나는 [destination.GetTitle.GetNameNoTierPossessive] 웅장한 [destination.Custom('GetRegionalMarketTermGloss')]에 서서 부산한 가판대들을 바라보며 감탄했다. 이곳에서 무역의 흐름은 추상적인 광경이 아니었으며, 발밑의 [ROOT.Char.Custom('GroundType')]만큼이나 명백한 사실이었다.\n\n우리처럼 거래를 체결하려고 애쓰는 상인이 가득한 이런 곳이라면, 우위나 호의를 얻는 데 실패하기도 어렵지 않겠는가?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: 성공"
 gdp_merchant_trade_opportunity.0102.desc: "지난 몇 주 동안 계속해서 움직였다. 회합과 접선책을 찾아 매일 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] 곳곳을 바쁘게 돌아다니기도 했지만, 기민한 외교와 그보다 더 영리한 사업 수완을 통해 지역 중개인 및 중간상과의 탄탄한 합의를 구축해 냈다.\n\n우리의 노력은 확실히 헛되지 않았다. 여기서 해낸 일이 큰 도움이 되어, 다가올 계절을 잘 맞이할 수 있게 되었다."
 gdp_merchant_trade_opportunity.0102.a: "우리의 씨앗이 열매를 낳기를!"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: 실패"
 gdp_merchant_trade_opportunity.0103.desc: "지역 중개인과 중간상의 환심을 사려 시도하고, 회합과 접선책을 찾아 매일 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly](을)를 가로질렀지만 상황은 시작했던 때와 별반 다를 것이 없었다.\n\n아무래도 앞으로 다가올 계절에는 어려움을 겪게 될 것 같다..."
 gdp_merchant_trade_opportunity.0103.a: "[ROOT.Char.GetRite.WealthGodName](이)여..."
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: 성공"
 gdp_merchant_trade_opportunity.0112.desc: "우리는 근면하게 일하며 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] 도시 곳곳에 그물을 던지고, 호의를 얻거나 뇌물을 줄 기회를 노렸다. 다행히 유리한 경매와 합의 몇 건이 체결되며 우리의 희망이 마침내 현실로 이루어졌고, 안전한 행로를 확보할 수 있었다.\n\n이제 평화롭게 등을 기대고 쉴 수 있다. 우리의 노력으로 안정적인 상품 흐름을 확보했으며, 이 상황이 앞으로도 지속되리라는 사실은 확실해졌으니까."
 gdp_merchant_trade_opportunity.0112.a: "[ROOT.Char.GetRite.WealthGodName]께서 우리에게 미소를 지으시는군!"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: 실패"
 gdp_merchant_trade_opportunity.0113.desc: "그토록 근면하게 일했건만. [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] 도시 곳곳에 그물을 던지고, 호의를 얻거나 뇌물을 줄 기회를 노렸지만 그 모든 게 허사가 되었다. 거칠게 요동치는 상업의 바다에 떨어진 빗방울처럼, 흔적도 없이 삼켜져 버린 것이다.\n\n우리가 바라는 할당량을 충족하는 데 필요한 상단 공간을 확보할 방법이 전혀 없으며, 당분간은 그럴 기회도 없다는 사실이 확실해졌다..."
 gdp_merchant_trade_opportunity.0113.a: "상단이 없다면 무역상이라 할 수 있겠는가..."
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName](와)과 나는 [destination.GetBaronyNameExplicitly]의 중계지를 걸어갔다. 이곳은 판매와 재판매의 중심지라 할 수 있으며, 온갖 종류의 상인들이 마주치고, 멀리 있는 미지의 목적지를 향해 상품을 운송하는 장소다.\n\n수많은 물자가 이 손에서 저 손으로 건너가는 이런 곳에서는 대량 구매, 즉 도매가격으로 진행하는 무역이 상인의 운명을 좌우하는 법이다..."
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: 성공"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n우리는 독사의 소굴에서 어떻게든 무사히 빠져나왔다. 거기다 탄탄한 약속 어음도 받아냈다. 덕분에 앞으로 다가올 계절을 위해, [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]에서 [trade_good_type.Custom('GetTradeGood')] [trade_good_type.Custom('GetTradeGoodUnitPlural')]의 경쟁력 있는 판매 가격을 확보할 수 있게 되었다!"
 gdp_merchant_trade_opportunity.0122.intro: "끝없는 흥정, 언쟁, 회유가 이어지며 며칠이 지나갔다. 내 시선은 정신없이 오가는 말과 이를 가는 소리 사이를 바쁘게 오갔고, 경매장에서는 가격이 울려 퍼졌다. [ROOT.Char.Custom('GroundType')]에는 버려진 전표, 쪽지, 잃은 돈 따위가 가득 널려 있었다."
 gdp_merchant_trade_opportunity.0122.a: "구매자의 시장이로군!"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: 실패"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n우리는 두들겨 맞고 진이 빠진 모양새로 독사의 소굴에서 빠져나왔다. 우리가 확보하려던 [trade_good_type.Custom('GetTradeGood')] 판매 가격을 보장받지도 못하고, 더 높은 값을 부른 경쟁자들에게 압도당했다..."
 gdp_merchant_trade_opportunity.0123.a: "판매자의 시장이로군..."
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$: 성공"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n우리는 독사의 소굴에서 어떻게든 무사히 빠져나왔다. 거기다 탄탄한 약속 어음도 받아냈다. 덕분에 앞으로 다가올 계절을 위해, [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]에서 [trade_good_type.Custom('GetTradeGood')] [trade_good_type.Custom('GetTradeGoodUnitPlural')]의 경쟁력 있는 구매 가격을 확보할 수 있게 되었다!"
 gdp_merchant_trade_opportunity.0132.a: "판매자의 시장이로군!"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: 실패"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\n우리는 두들겨 맞고 진이 빠진 모양새로 독사의 소굴에서 빠져나왔다. 우리가 확보하려던 [trade_good_type.Custom('GetTradeGood')] 구매 가격을 보장받지도 못하고, 더 높은 값을 부른 경쟁자들에게 압도당했다..."
 gdp_merchant_trade_opportunity.0133.a: "구매자의 시장이로군..."
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip]"
 gdp_merchant_trade_opportunity.0141.desc: "평화의 수호자이자 법의 옹호자인 [task_contract_target.GetTitledFirstName](이)가 [local_market.GetName|l]에서 판매 수익의 일부를 가져가는 건 당연한 일일지도 모른다.\n\n하지만 협상의 여지는 #EMP 언제나#! 존재하는 법. [task_contract_target.GetHerHim]에게 우리 행로의 가치를 알리고, [task_contract_target.GetSheHe]가 우리의 가련한 등에 지운 짐이 얼마나 무거운지를 잘 설명하기만 하면 된다..."
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: 성공"
 gdp_merchant_trade_opportunity.0142.desc: "[task_contract_target.GetTitledFirstName]의 회당에서 회유하고, 아첨하고, 끈질기게 설득하며 기나긴 나날을 보냈다. 계속 미소를 짓느라 아직도 볼이 아프지만, 그 노력이 헛되지는 않았다.\n\n우리는 통행료를 낮추는 데 성공했으며, 당분간 더 나은 수익을 확보할 수 있게 되었다."
 gdp_merchant_trade_opportunity.0142.a: "좋은 사업의 대가지."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: 실패"
 gdp_merchant_trade_opportunity.0143.desc: "[target.GetTitledFirstName]의 회당에서 회유하고, 아첨하고, 끈질기게 설득하며 기나긴 나날을 보냈다. 계속 미소를 짓느라 볼이 아프고, 서 있느라 다리에도 힘이 빠졌다. 이제 아무런 성과 없이 돌아가야만 한다...\n\n오늘 우리가 알현을 기다리고 있었는데 [target.GetTitleAsNamePossessiveNoTooltip] 경비병들이 고지식한 태도로 이렇게 설명했다. [target.GetSheHe]가 처리해야 할 더 시급한 사안이 있어, 유감스럽게도 우리를 돕지 못하게 됐다는 것이다..."
 gdp_merchant_trade_opportunity.0143.a: "[target.GetSheHe]가 참 융통성 있는 사람인 줄 알았는데..."
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "[local_market.GetName|l]의 중개인과 수금원들이 주변을 어슬렁거렸다. 이 자칼들은 옆구리에 찬 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] 자루를 짤랑이며 조롱하고 다닌다. 자루마다 [associate.GetFirstName](와)과 나 같은 훌륭한 상인의 주머니에서 털어낸, 정직하게 번 동전이 가득 차 있다...\n\n[owner.GetTitledFirstNamePossessive] 통행료는 이곳 사업에 있어 상당한 골칫거리다. [owner.GetHerHis] 탐욕 때문에 우리도 부정한 사업에 손을 댈 수밖에 없었다."
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: 성공"
 gdp_merchant_trade_opportunity.0152.desc: "열심히 노력한 끝에 현지 건달들 사이에서 괜찮은 접선책을 구했고, [trade_market.GetName|l]에서 나오는 상품을 위해 믿을 만한 #EMP 대체#! 행로를 확보했다.\n\n순진한 경비병의 코앞을 지나가는 상자와 화물마다 절약한 금액은 곧 산더미처럼 쌓일 것이다..."
 gdp_merchant_trade_opportunity.0152.a: "이건 #EMP 우리#! 돈이다."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: 실패"
 gdp_merchant_trade_opportunity.0153.desc: "[trade_market.GetName|l]에서 밀수 조직을 수립하려고 노력했지만, 시도할 때마다 방해받았다. 무능한 우리 공모자들, 현지 당국의 경계, 부정직한 지역 건달들까지...\n\n우리는 계속해서 대금을 낼 수밖에 없었고, 우리가 한 모든 노력은 정직한 중개인이라는 명성을 더럽히기만 했을 뿐이다."
 gdp_merchant_trade_opportunity.0153.a: "그냥 통행료를 낼 걸 그랬지..."
 gdp_merchant_trade_opportunity.1001.t: "바퀴에 기름칠"
 gdp_merchant_trade_opportunity.1001.desc: "우리의 [task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip] 인맥이 평소답지 않게 거래에서 소극적인 모습을 보였는데, 이 문제의 중심에는 지역 영주인 [local_ruler.GetTitledFirstName](이)가 있다는 사실이 드러났다.\n\n머지않아 우리는 위대하신 이 [local_ruler.GetWomanMan]에게 자기 땅에서 볼 \"#EMP 미래의 맛#!\"을 바치라는 서신을 받게 되었다..."
 gdp_merchant_trade_opportunity.1001.a: "#weak *한숨*#! 이 사람한테 [local_ruler.GetHerHis] [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')](을)를 주자..."
 gdp_merchant_trade_opportunity.1001.b: "#EMP 존경받는#! 분이라면 우리 상황을 이해해 주시겠지."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.GetTitledFirstNameNoTooltip](이)가 매료됨"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.GetTitledFirstNameNoTooltip](이)가 귀찮아함"
 gdp_merchant_trade_opportunity.1001.c: "\"그거 아십니까, [other_merchant.GetPrimaryTitle.GetNameNoTooltip|l](이)가 #EMP 진짜#! 제멋대로라던데요.\""
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.GetTitledFirstNameNoTooltip](이)가 미끼를 물었음"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip](이)가 불쾌해함"
 gdp_merchant_trade_opportunity.1001.d: "하, 어떻게든 되겠지."
 gdp_merchant_trade_opportunity.1011.t: "상호 관대"
 gdp_merchant_trade_opportunity.1011.desc: "[local_market.GetShortName]에서의 우리 거래가 현지 영주인 [local_ruler.GetTitledFirstName]의 시선을 끈 듯하다. 영주가 회사를 비공개 접견하기로 했으니까.\n\n내가 앞에 서자 [local_ruler.GetTitleAsNameNoTooltip](이)가 미소를 지었다. \"무역은 큰 이득을 가져다주지. 백성, 귀족, [local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] 모두에게 말일세! 문젯거리가 있다면 나한테 얘기해 보게. 도울 방도를 찾아볼 테니.\""
 gdp_merchant_trade_opportunity.1011.a: "#weak *에헴*#! \"사실 행로가 #EMP 매우#! 험난합니다...\""
 gdp_merchant_trade_opportunity.1011.b: "\"지역 [task_contract_location.Custom('GetRegionalMarketTerm')|l](을)를 위한 좋은 생각이 있는데요.\""
 gdp_merchant_trade_opportunity.1011.b.good: "당신의 조언이 괜찮음"
 gdp_merchant_trade_opportunity.1011.b.bad: "당신의 조언이 형편없음"
 gdp_merchant_trade_opportunity.1011.c: "\"[other_merchant.GetPrimaryTitle.GetNameNoTooltip] 때문에 상황이 힘듭니다.\""
 gdp_merchant_trade_opportunity.1011.c.fallback: "\"경쟁 때문에 상황이 힘듭니다.\""
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.GetTitledFirstNameNoTooltip](이)가 당신을 지지함"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.GetTitledFirstNameNoTooltip](이)가 [other_merchant.GetHouse.GetNameNoTooltip](을)를 지지함"
 gdp_merchant_trade_opportunity.1011.c.flavor: "[diplomacy_i|E][diplomacy|E], [opinion_i|E][opinion|E]을 기반으로 한 인기 경연"
 gdp_merchant_trade_opportunity.1011.d: "\"위대한 [local_ruler.GetTitleAsNameNoTooltip](와)과 자비로운 통치에 축복이 있기를.\""
 gdp_merchant_trade_opportunity.1021.t: "공통의 경쟁자"
 gdp_merchant_trade_opportunity.1021.desc: "[target.GetPrimaryTitle.GetName]의 망할 자식들 때문에 진이 빠진 나는 [other_merchant.GetPrimaryTitle.GetName]의 [other_merchant.GetTitledFirstName](이)가 다가오는 줄도 몰랐다. 이 사람은 [local_market.GetShortName] [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]의 또 다른 경쟁자였다.\n\n\"잘 만났군, [ROOT.Char.GetTitledFirstNameNoTooltip].\" [other_merchant.GetSheHe]가 제안했다. \"[target.GetHouse.GetNameNoTooltip] 상인 [target.GetTitledFirstName] 때문에 곤경을 겪는다는 얘기를 들었지. 그래서 말인데, 서로 돕는 게 어떻겠나?\""
 gdp_merchant_trade_opportunity.1021.a: "\"아주 좋네! 나한테 계획이 있는데...\""
 gdp_merchant_trade_opportunity.1021.b: "\"자네가 믿을 만한 사람인지 어떻게 확신하지?\""
 gdp_merchant_trade_opportunity.1021.b.good: "합의에 도달함"
 gdp_merchant_trade_opportunity.1021.b.bad: "치고받고 싸움"
 gdp_merchant_trade_opportunity.1021.c: "\"우리가 함께라면 그쪽을 곤란하게 할 수 있겠군.\""
 gdp_merchant_trade_opportunity.1021.d: "\"어림도 없지! 당신네 [other_merchant.GetHouse.GetNameNoTooltip]들이 더 나빠!\""
 gdp_merchant_trade_opportunity.1031.t: "무역 비밀"
 gdp_merchant_trade_opportunity.1031.desc: "[task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서 회사 기록을 꼼꼼히 훑어보던 중, 종이 몇 장이 빠져나오더니 바닥으로 떨어져 내렸다. 몸을 굽혀 종이를 줍고 돌아보니 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName](이)가 얼굴을 찡그린 채 머뭇거리고 있었다.\n\n서류를 훑어본 나는 눈썹을 치켜올렸다. [associate.GetFirstNameNoTooltip](이)가 불편해하는 이유가 곧 명백히 드러났으니까. 이 사람이 여기에서의 우리 사업에 꼭 필요한 정보를 숨기고 있었다! 앙심 때문에 이런 짓을 했단 말인가?"
 gdp_merchant_trade_opportunity.1031.a: "\"망할, [associate.GetFirstNameNoTooltip]! 대체 어디에 충성하는 거냐!\""
 gdp_merchant_trade_opportunity.1031.b: "\"대체 뭐가 불만이었나?\""
 gdp_merchant_trade_opportunity.1031.c: "\"#EMP 꺼져라!#! 더는 우리 회사를 위해 일하지 못할 거다!\""
 gdp_merchant_trade_opportunity.1041.t: "가족 노력"
 gdp_merchant_trade_opportunity.1041.desc: "분위기는 활기찼고, 회사에서 도는 이야기는 항상 최근 [task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서 거둔 여러 성공을 향하곤 했다. 우연히도 모두 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName](이)가 이룩한 성공이었다.\n\n[associate.GetHerHis|U] 재능을 진정한 상업의 천재라고 추켜올리는 찬사가 파다하지만, 각 사업은 사실 [ROOT.Char.GetHouse.GetNameNoTooltip] 곳곳의 수많은 인력과 화술이 열심히 노력한 결과이다."
 gdp_merchant_trade_opportunity.1041.a: "잘했다, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1041.b: "우리가 자네한테 제대로 일을 시키지 않았던 모양이군."
 gdp_merchant_trade_opportunity.1041.c: "자네의 노력은 정말 대단하네, 우리 모두의 모범이 되는 인물이야!"
 gdp_merchant_trade_opportunity.1051.t: "정착지 찾기"
 gdp_merchant_trade_opportunity.1051.desc: "[task_contract_location.Custom('GetRegionalMarketTermGloss')](을)를 걷고 있는데, 경쟁자인 [target.GetPrimaryTitle.GetName]의 [target.GetTitledFirstName](이)가 갑자기 내 앞에 나타났다! 하지만 [target.GetHerHis] 존중하는 듯한 태도에 나는 당황하고 말았다.\n\n\"이보게, [ROOT.Char.GetTitledFirstNameNoTooltip].\" [target.GetSheHe]가 한숨을 쉬었다. \"내 편히 말하지. 여기서 우리 이해관계는 서로 상충하고 있네. 서로 맞서 싸워 봤자 득 볼 사람은 아무도 없을 거야. 그러니 그만둬 주길 부탁하지. 대신"
 gdp_merchant_trade_opportunity.1051.desc.gold: "돈으로 그 대가를 치러 주겠네.\""
 gdp_merchant_trade_opportunity.1051.desc.luxury: "대신 머나먼 땅에 있는 경이로운 수집품에 대한 정보를 주겠네.\""
 gdp_merchant_trade_opportunity.1051.a: "\"맞는 말이군. 좋네, 받아들이지.\""
 gdp_merchant_trade_opportunity.1051.b: "\"여기 뭔가 있단 말일세... 협상하는 건 어떨까.\""
 gdp_merchant_trade_opportunity.1051.b.good: "[target.GetTitledFirstNameNoTooltip](이)가 수락함"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.GetTitledFirstNameNoTooltip](이)가 거절함"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName](이)가 당신을 기리며 [GetActivityType('activity_feast').GetName] [activity|E]을 주최할 것임"
 gdp_merchant_trade_opportunity.1052.t: "연회 무효화됨"
 trade_opportunity_gain_luxury_contract_tt: "[luxury_contract|E]를 획득하게 됨"
 gdp_merchant_trade_opportunity.1051.d: "\"하, 장사가 #EMP 정말#! 안 되나 본데! 어림도 없지.\""
 gdp_merchant_trade_opportunity.1061.t: "역량 분산"
 gdp_merchant_trade_opportunity.1061.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName](은)는 [task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서의 사업을 완수하는 데 노력을 집중하다 보니, [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l]에서 일상적인 흐름을 이어갈 능력이 불안정해지고 있다며 불평했다.\n\n\"뭔가 조치를 해야만 합니다, [ROOT.Char.GetTitleAsNameNoTooltip]. 이대로 계속한다면 하루에 주어진 시간은 부족하고, 회사의 일손도 부족하니 여기 상황을 통제하기가 어려워질 겁니다.\""
 gdp_merchant_trade_opportunity.1061.a: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip](은)는 시련 앞에 움츠러들지 않는다!"
 gdp_merchant_trade_opportunity.1061.a.good: "모든 것이 계획대로 흘러감"
 gdp_merchant_trade_opportunity.1061.a.bad: "당신이 무리하고 말았음"
 gdp_merchant_trade_opportunity.1061.b: "내가 있는 한 수익은 줄어들지 않는다."
 gdp_merchant_trade_opportunity.1061.already_tt: "이미 획득: [associate.GetShortUIName] #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! [stress|E], [scheme|E] #P +1#! [scheme_opportunity_i|E][scheme_opportunity_opportunity|E]"
 gdp_merchant_trade_opportunity.1071.t: "병목"
 gdp_merchant_trade_opportunity.1071.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName](이)가 끝도 없이 서성였다. 느긋하게 윙윙대는 파리 한 마리가 [associate.GetHerHis] 성질을 건드렸다. \"으아!\" [associate.GetSheHe]가 투덜거렸다. \"좀 보십시오, [ROOT.Char.GetTitleAsNameNoTooltip]. 여기 [task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서의 일이 제 자원에 무리를 주고 있습니다!\"\n\n전표와 장부를 자세히 살펴보니 [associate.GetHerHim]의 말이 맞았다. [associate.GetSheHe|U]가 한숨을 쉬었다. \"어느 정도는 타협해야 합니다. 이런 부담을 이대로 계속 진다면 여기 있는 우리 사무실도 무너지기 시작할 겁니다...\""
 gdp_merchant_trade_opportunity.1071.a: "하나의 목표에 헌신해야 한다."
 gdp_merchant_trade_opportunity.1071.d: "이 사안은 내게 넘기고, 자기 임무에 집중하도록."
 gdp_merchant_trade_opportunity.1081.t: "적임자"
 gdp_merchant_trade_opportunity.1081.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName](은)는 우리가 현재 [task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서 벌이는 사업의 세부 사항 대부분을 담당하고 있는데, 성과가 눈에 보인다! [associate.GetFirstName]의 능력을 보면 세세한 사항에도 주의를 기울일 줄 알며, 숙련된 무역상으로서의 다른 자질을 모두 지니고 있다.\n\n여기서 사업을 시작한 이래로 장부나 지시 사항을 다시 확인할 필요가 없어졌다."
 gdp_merchant_trade_opportunity.1081.a: "[associate.GetFirstNameNoTooltip], 계속 이대로만 해주게!"
 gdp_merchant_trade_opportunity.1081.b: "이런 추진력에는 보상이 따라야지."
 gdp_merchant_trade_opportunity.1081.c: "회사 전체가 이를 모범으로 삼아야 한다!"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip](이)가 모범이 됨"
 gdp_merchant_trade_opportunity.1081.c.trigger: "다른 [associate|E]의 관리력이 [stewardship_i|E][EmptyScope.ScriptValue('medium_skill_rating')|V0] 미만임"
 gdp_merchant_trade_opportunity.1081.c.tt: "다른 [associate_possessive|E] [Concept( 'stewardship', '관리력' )|E]이 [stewardship_i|E]#P 1#!만큼 증가함"
 gdp_merchant_trade_opportunity.1081.d: "당연히 [ROOT.Char.GetHouse.GetNameNoTooltip] 사람이 최고지."
 gdp_merchant_trade_opportunity.1091.t: "일머리 없는 사원"
 gdp_merchant_trade_opportunity.1091.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName](이)가 현재 [task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서 벌어지는 우리의 거래를 이끌고 있는데, 이제는 차라리 그러지 말기를 바라게 된다...\n\n매일 누가 게으르게 잘못 계산한 결과가 발견되거나, 불필요하게 연락을 기다리게 된 인맥의 불평을 들어야만 한다. 사업을 이렇게 대충 해서는 안 되는데!"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], 책부터 다시 살펴보자."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip](이)가 몇 가지를 배움"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip](은)는 가망이 없음"
 gdp_merchant_trade_opportunity.1091.c: "처리 못 한 일은 회사가 떠맡아야겠군."
 gdp_merchant_trade_opportunity.1091.d: "[associate.GetSheHe|U]도 나름대로 최선을 다하는 거겠지."
 gdp_merchant_trade_opportunity.1101.t: "종잣돈"
 gdp_merchant_trade_opportunity.1101.desc: "대출은 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')](이)가 넘치고, 때를 기다릴 줄 아는 인내심을 겸비한 이들에게는 사업이 될 수 있다. 열의에 찬 지역 투자자가 나한테 [task_contract_location.GetBaronyNameExplicitlyNoTooltip]에서 만나자고 요청해 왔다.\n\n나는 [investor.GetTitledFirstName]의 환영을 받았다."
 gdp_merchant_trade_opportunity.1101.ruler: "이 사람은 [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 지역 영주였다."
 gdp_merchant_trade_opportunity.1101.courtier: "이 사람은 지역 귀족의 궁정 신하였다."
 gdp_merchant_trade_opportunity.1101.adventurer: "이 사람은 견문이 넓으며 많은 추종자를 거느린 인물이었다."
 gdp_merchant_trade_opportunity.1101.fallback: "이 사람은 뒷배라 할 만한 것이 없었다."
 gdp_merchant_trade_opportunity.1101.end: "\"반갑소, [ROOT.Char.GetTitledFirstNameNoTooltip]!\" [investor.GetSheHe|U]가 열의에 찬 미소를 지었다. \"내 기꺼이 [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip|l] 후원자가 되겠소. 그 대가로 무얼 바라냐고? 뭐, 그건 나중에 얘기하기로 합시다.\""
 gdp_merchant_trade_opportunity.1101.a: "[investor.GetFirstNameNoTooltip], 우리만 믿으십시오."
 gdp_merchant_trade_opportunity.1101.c: "조금만 더 있다면 멀리까지 갈 수도 있습니다. 제 명예를 걸고 보증하지요."
 gdp_merchant_trade_opportunity.1101.d: "과찬이군요. 근데 이번에는 깔끔하게 운영하려고 하는 중이라서요."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName](이)가 #V 5#!년 후에 [gold_i|E][interest|0V](을)를 (#M 20%의 이자#!) 받으러 연락할 것임"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "드디어 그대의 존경받는 무역 회사에 투자한 결실을 돌려받을 때가 왔소.\n\n내 [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]의 수령을 기다리겠소."
 gdp_merchant_trade_opportunity.1102.a: "좋소. 자금을 잘 받기를."
 gdp_merchant_trade_opportunity.1102.b: "아, 어디 봅시다. [investor.GetFirstNameNoTooltip], 사실 비수기가 오는 바람에..."
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip](이)가 당신의 변명을 받아들임"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip](이)가 사기의 냄새를 맡음"
 gdp_merchant_trade_opportunity.1102.d: "그쪽은 우리한테 투자한 바 없습니다. 이게 전부입니다."
 gdp_merchant_trade_opportunity.9000.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]의 시급한 사업"
 gdp_merchant_trade_opportunity.9000.desc: "문제를 해결했으니, 이제 여기 [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l]에서는 다른 사업에 주의를 기울여야 한다.\n\n[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip](으)로 귀환하는 여정을 시작하기 전에 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]에서의 일을 좀 정리해 두는 게 좋을까?"
 gdp_merchant_trade_opportunity.9000.a: "이 사안을 살펴봐야겠군."
 gdp_merchant_trade_opportunity.9000.b: "이 일을 해결하자."
 gdp_merchant_trade_opportunity.9000.c: "이 사안을 확인해 보겠다."
 gdp_merchant_trade_opportunity.9000.d: "아니다, [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에 우리가 필요하다."
 gdp_merchant_trade_opportunity.9000.accept_tt: "당신이 [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly] 내 [THIS.TaskContract.GetType.GetName|V]에 대한 [THIS.TaskContract.GetEmployer.GetUINamePossessive] [trade_opportunity_tier_tier|E] [THIS.TaskContract.GetTaskContractTierValue|V] [trade_opportunity|E]를 수락하고 시작함"
 gdp_merchant_trade_opportunity.9010.t: "무역 기회: [task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "[task_contract_location.GetBaronyNameExplicitly]에서 중요한 회사 사업이 기다린다."
 gdp_merchant_trade_opportunity.9010.intro: "여기 [task_contract_location.GetBaronyNameExplicitly]에서 중요한 회사 사업이 기다린다."
 gdp_merchant_trade_opportunity.9010.desc: "내 임무는 내가 돌아올 때까지 사원들에게 맡겨야만 한다.\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "내가 다른 용무를 보는 동안, 내 [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName](이)가 이 사안을 맡으면 되겠지."
 gdp_merchant_trade_opportunity.9010.partner_busy: "내 [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName](은)는 지금 일을 맡기 힘들다. 내가 직접 살펴봐야 할 것 같군..."
 gdp_merchant_trade_opportunity.9010.candidate: "이런 중요한 사안을 믿고 맡길 이를 찾기 전까지는 내가 직접 나서야만 한다."
 gdp_merchant_trade_opportunity.9010.no_partner: "이런 중요한 사안을 믿고 맡길 이가 없으니, 내가 직접 나서야만 한다."
 gdp_merchant_trade_opportunity.9010.a: "낭비할 시간이 없다."
 gdp_merchant_trade_opportunity.9010.c: "그래, [partner.GetFirstNameNoTooltip]한테 맡기면 되겠군."
 gdp_merchant_trade_opportunity.9010.c.no_partner: "내 동업자라면 해낼 수 있다."
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUIName](이)가 이미 [trade_opportunity|E]에 연루되어 있음"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "당신의 동업자가 다른 [trade_opportunity|E]를 처리하느라 바쁨"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "당신의 [task_contract.GetType.GetName|V] [trade_opportunity|E]에 배정됨"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M [task_contract|E]를 완료할 때까지 이용할 수 없게 됨#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M 성공 확률은 [THIS.Char.GetHerHis] [aptitude|E]([THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )])을 기반으로 함#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_valid: "@warning_icon! #X [THIS.Char.GetSheHe]가 더 이상 당신의 [GetCourtPositionType('partner_court_position').GetName]가 아닌 경우 청부의뢰가 실패하게 됨#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "[THIS.Char.GetShortUIName|U](이)가 [task_contract_location.GetBaronyNameExplicitly]에서 당신의 [task_contract.GetType.GetName] [trade_opportunity|E]에 배정되었음"
 gdp_merchant_trade_opportunity.9010.d: "어쩌면 [candidate.GetFirstNameNoTooltip](이)가 적임자일지도 모르겠군."
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "이 임무의 적임자가 어딘가에 있을지도 모르지."
 gdp_merchant_trade_opportunity.9010.d.tt: "당신의 [associates|E]:\n$EFFECT_LIST_BULLET$[traders|E]이 아님\n$EFFECT_LIST_BULLET$당신의 [GetCourtPositionType('partner_court_position').GetName]가 될 수 있음"
 gdp_merchant_trade_opportunity.9010.e: "아, 됐어. 다른 사업이나 착수하자."
 gdp_merchant_trade_opportunity.9010.e.tt: "[task_contract|E]가 무시될 것임"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "바로 [task_contract_location.GetBaronyNameExplicitly](으)로 [traveling|E] 시작"
 gdp_merchant_trade_opportunity.9010.tt.start: "바로 [task_contract|E] 시작"
 gdp_merchant_trade_opportunity.9020.t: "무역 기회: [task_contract.GetType.GetName]"
 gdp_merchant_trade_opportunity.9020.intro: "내 [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] [partner.GetFirstName](이)가 마침내 [task_contract_location.GetBaronyNameExplicitly]에서 돌아왔으며, 일의 진전 상황에 대한 소식도 가져왔다.\n\n"
 gdp_merchant_trade_opportunity.9020.success: "[partner.GetSheHe|U]는 수많은 어려움에도 불구하고 자신이 회사의 이득과 자신의 명예를 위해, 사안을 어떻게 능숙히 해결해 나갔는지를 기쁜 목소리로 설명해 나갔다..."
 gdp_merchant_trade_opportunity.9020.failure: "[partner.GetSheHe|U]는 자신에게 배정된 일이 얼마나 어려웠으며, 그렇기에 최선을 다했음에도 회사가 손해를 보게 되었다는 이야기를 머뭇거리며 설명해 나갔다..."
 gdp_merchant_trade_opportunity.9020.a.success: "아주 잘했다, [partner.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.9020.a.failure: "내가 직접 처리할 걸 그랬군..."
 gdp_merchant_trade_opportunity.9050.t: "잃어버린 기회"
 gdp_merchant_trade_opportunity.9050.desc_opening: "유망하던 앞날이 어두워졌다.\n\n우리 여정의 목적이었던 [trade_destination.GetBaronyNameExplicitlyNoTooltip]의 무역 기회가 날아가 버렸다."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\n이제 남은 의문은 하나다. 이 불운한 길을 계속하는 게 과연 무슨 의미가 있겠냐는 것이다."
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "이 기회가 의존하고 있던 무역로는 이제 존재하지 않는다."
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip](은)는 이제 [trade_opportunity_route.GetName]에 있지 않다."
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "[trade_opportunity_route.GetName]에는 이제 이 기회를 맡은 무역상이 없다."
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "알고 보니 [trade_opportunity_route.GetName]의 소요가 저절로 해결되었다고 한다."
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "더는 우리를 기능공이라 부를 수 없으니, 이러한 사업을 계속 진행한다면 적절치 못할 것이다."
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "더는 우리를 채권자라 부를 수 없으니, 이러한 사업을 계속 진행한다면 적절치 못할 것이다."
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "지나가는 무역상들의 말에 따르면, 우리의 경쟁 회사가 모습을 감추었다고 한다."
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "더는 우리 목적지에 있는 중계지를 사용할 수 없을 것 같다."
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "지금은 우리가 감당하기로 했던 통행료를 더 이상 내지 않고 있다."
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "상황이 변하면 이런 일이 생기기 마련이다. 이제는 비단길도 우리가 여정을 처음 시작했을 때의 모습과는 많이 달라졌다. 따라서 우리가 그 흐름을 조종할 기회도 사라졌다."
 gdp_merchant_trade_opportunity.9050.reason_unknown: "지금은 무엇이 변한 것인지 확실히 알 수 없다."
 gdp_merchant_trade_opportunity.9050.a: "여기서 더 할 일은 없다."
 gdp_merchant_trade_opportunity.9050.b: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]에 뭐가 있는지 한번 살펴보자."
 gdp_merchant_trade_opportunity.9050.b.tt: "여행을 계속하다 #weak [trade_destination.GetBaronyNameExplicitly]에 도착해 방문함#!"
 gdp_merchant_trade_opportunity.9050.toast: "[trade_destination.GetBaronyNameExplicitlyNoTooltip]에서의 무역 기회 상실"
