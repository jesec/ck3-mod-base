l_korean:
 gdp_merchant_starting_capacity_modifier: "수용량 상승"
 gdp_merchant_starting_capacity_modifier_desc: "해당 인물의 회사는 상품을 대량으로 운송할 수 있습니다."
 gdp_voluntary_merchant_modifier: "자발적 상인"
 gdp_voluntary_merchant_modifier_desc: "해당 인물은 자신의 작위를 포기하고 상인으로서 이름을 알리고자 했습니다."
 gdp_patron_competitiveness_modifier: "경쟁력 유인"
 gdp_patron_competitiveness_modifier_desc: "해당 인물의 후원자는 자신의 사업을 더 널리 알리도록 설득당했습니다."
 gdp_romance_fan_modifier: "구제 불능 낭만주의자"
 gdp_romance_fan_modifier_desc: "해당 인물은 좋은 연애 이야기를 거부할 수 없습니다."
 gdp_nepotism_modifier: "족벌주의 장려"
 gdp_nepotism_modifier_desc: "해당 인물은 무슨 일이 있어도 가족이 우선이라고 생각합니다."
 gdp_merit_modifier: "능력 장려"
 gdp_merit_modifier_desc: "해당 인물은 이익이 어디서 오는지 신경 쓰지 않습니다."
 gdp_full_attention_modifier: "사업 집중"
 gdp_full_attention_modifier_desc: "해당 인물은 사소한 일로 시간을 낭비하지 않습니다."
 gdp_responsible_modifier: "책임 수용"
 gdp_responsible_modifier_desc: "해당 인물은 적어도 지금은 자신의 책임을 다하고 있습니다."
 gdp_cooperation_modifier: "협력적인 집안"
 gdp_cooperation_modifier_desc: "해당 인물은 상호 이익을 위해 다른 집안과 협력하기로 선택했습니다."
 gdp_guild_master_inpiration_diplomacy_modifier: "외교적 지도"
 gdp_guild_master_inpiration_diplomacy_modifier_desc: "해당 인물은 외교에 능숙한 조합장의 지도를 구했습니다."
 gdp_guild_master_inpiration_learning_modifier: "학문적 조언"
 gdp_guild_master_inpiration_learning_modifier_desc: "해당 인물은 학식 있는 조합장의 조언을 구했습니다."
 gdp_guild_master_inpiration_stewardship_modifier: "재정 교습"
 gdp_guild_master_inpiration_stewardship_modifier_desc: "해당 인물은 조합장의 교습을 구했습니다."
 gdp_boasted_market_competence_modifier: "상업적 수완 과시"
 gdp_boasted_market_competence_modifier_desc: "귀족들 앞에서 어리석은 행동을 하라는 후원자의 요청을 받았을 때, 해당 인물은 상황을 자신에게 유리하게 바꾸었습니다."
 gdp_driven_by_motivation_modifier: "야심에 이끌림"
 gdp_driven_by_motivation_modifier_desc: "해당 인물은 자신의 회사 소유주에게 가치를 제공하기 위해 최선을 다하고 있습니다."
 gdp_promoted_diligence_modifier: "근면 장려"
 gdp_promoted_diligence_modifier_desc: "해당 인물은 자신의 안녕이 위태로워질 위험에도 사업 노력을 두 배로 늘리라는 가장의 압박을 받았습니다."
 gdp_promoted_excess_modifier: "과잉 장려"
 gdp_promoted_excess_modifier_desc: "해당 인물은 사업은 잠시 밀어두고 사치스러운 생활을 하며, 외교와 회사의 사회적 평판을 향상하라는 독려를 받았습니다."
 gdp_oasis_of_hope_modifier: "희망의 오아시스"
 gdp_oasis_of_hope_modifier_desc: "해당 여행단은 사막에서 기적적으로 오아시스를 발견해 겨우 원기를 회복했습니다."
 gdp_low_morale_entourage_modifier: "의욕이 저하된 수행단"
 gdp_low_morale_entourage_modifier_desc: "해당 인물은 열기도 아랑곳하지 않고 사막을 헤치며 나아가기로 했습니다."
 organize_the_venture_scheme_modifier: "체계적인 사업"
 organize_the_venture_scheme_modifier_desc: "해당 청부의뢰 모략은 엄격해진 일정과 철저한 감독하에 시행되고 있습니다."
 merchant_undercut_the_competition_modifier: "무자비한 가격 경쟁"
 merchant_undercut_the_competition_modifier_desc: "해당 인물은 경쟁자들을 몰아내고자 이윤이 낮아지는 상황도 감수하고 있습니다."
 merchant_cornering_the_market_modifier: "시장 장악"
 merchant_cornering_the_market_modifier_desc: "해당 인물은 최근의 상업 압박을 이용해 시장에서 자신의 입지를 강화하고 있습니다."
 merchant_public_benefactor_modifier: "공공의 후원자"
 merchant_public_benefactor_modifier_desc: "해당 인물은 자신의 회사 본적지 근처의 공공사업을 후원하며 수익을 대중의 호의로 바꾸고 있습니다."
 merchant_private_profit_focus_modifier: "개인 수익"
 merchant_private_profit_focus_modifier_desc: "해당 인물은 대중의 평판을 희생해 회사의 초점을 개인 수익과 상업 우위 획득에 맞추고 있습니다."
 merchant_sponsored_public_works_county_modifier: "공공사업 후원"
 merchant_sponsored_public_works_county_modifier_desc: "해당 영지는 상인 회사의 공공사업과 공영 후원의 혜택을 받았습니다."
 gdp_merge_company_competitiveness_modifier: "우세한 무역상"
 gdp_merge_company_competitiveness_modifier_desc: "해당 인물은 경쟁 회사의 무역로를 해체하고 그 시장을 지배합니다."
 gdp_merchant_full_larder_modifier: "가득 찬 식품 저장고"
 gdp_merchant_full_larder_modifier_desc: "해당 인물은 굶주림에 시달리는 시장에 돌아갈 식량을 자기 식탁에 올리려고 빼돌렸으며, 그 뒤로 아쉬울 것 없이 지냈습니다."
 gdp_merchant_staying_vigilant: "경계 유지"
 gdp_merchant_staying_vigilant_desc: "해당 인물은 거래를 진행해 굶주림을 초래한 대가로 보복당할 것을 예상하고, 그림자 하나까지 주의 깊게 살핍니다."
 gdp_merchant_master_craft_tutelage_modifier: "장인에게 사사"
 gdp_merchant_master_craft_tutelage_modifier_desc: "해당 인물은 명장의 공방에서 시간을 보냈습니다."
 gdp_thirsty_traveler_modifier: "목마른 여행자"
 gdp_thirsty_traveler_modifier_desc: "해당 인물은 물 없이 오랫동안 먼 길을 가야 했습니다."
 gdp_pure_waters_modifier: "깨끗한 물"
 gdp_pure_waters_modifier_desc: "해당 인물의 일행은 정화된 물을 충분히 비축했고 갈증도 해소했습니다."
 gdp_rationing_water_modifier: "물 배급제"
 gdp_rationing_water_modifier_desc: "해당 인물의 일행은 물을 엄격하면서도 효과적으로 배급하고 있으며, 추가 수원을 찾아다니느라 이동 속도가 느려졌습니다."
 gdp_workout_modifier: "지친 근육"
 gdp_workout_modifier_desc: "나무를 베는 일은 고되기는 했지만 해당 인물에게 좋은 운동이 되었습니다. 시간이 지나면 힘을 회복할 것입니다."
 gdp_cat_rats_modifier: "고양이 발"
 gdp_cat_rats_modifier_desc: "해당 인물은 부지런한 고양이 덕분에 쥐 떼로부터 안전한 항해를 즐겼습니다."
 gdp_fishing_modifier: "낚시의 즐거움"
 gdp_fishing_modifier_desc: "해당 인물은 현장을 직접 경험하며 좋은 어획물의 가치를 잘 알게 되었습니다."
 gdp_catch_rats_modifier: "쥐잡이"
 gdp_catch_rats_modifier_desc: "해당 인물은 어둡고 비좁은 선박 화물칸에서 쥐를 잡아야만 했고, 이 때문에 건강을 해치게 되었습니다."
 dedicated_trade_studies: "무역 연구에 전념"
 dedicated_trade_studies_desc: "해당 인물은 공무의 길보다 상업을 선택했으며, 시장을 완벽히 파악하는 데 전념합니다."
 gdp_local_business_modifier: "지역 사업"
 gdp_local_business_modifier_desc: "해당 인물은 머나먼 비단길의 부를 좇기보다는 인근 시장에서 경합하는 길을 선택했습니다."
 gdp_silk_road_market_foothold_modifier: "비단길 기반"
 gdp_silk_road_market_foothold_modifier_desc: "해당 인물은 최근에 회사를 비단길 시장으로 옮겼으며, 새로 얻은 지역 인맥을 활용하고 있습니다."
 tgp_silk_road_interesting_innovations_modifier: "혁신에 대한 관심"
 tgp_silk_road_interesting_innovations_modifier_desc: "해당 인물은 비단길의 여러 혁신에 관심을 기울이며 견문을 넓혀 돌아왔습니다."
 gdp_silk_road_bargain_modifier: "비단길 거래 기회"
 gdp_silk_road_bargain_modifier_desc: "해당 인물은 비단길 시장에서 유리한 거래를 할 기회를 모색했습니다."
 gdp_silk_road_market_investment_modifier: "비단길 시장 투자"
 gdp_silk_road_market_investment_modifier_desc: "해당 인물은 이 비단길 시장에 투자하는 것이 유리하다고 판단했습니다."
 gdp_merchant_legacy_3_ennobled_modifier: "믿을 만한 상인"
 gdp_merchant_legacy_3_ennobled_modifier_desc: "해당 인물과 회사의 탁월한 사업 수완은 상류 사회에서도 인정받고 있습니다."
 gdp_merchant_legacy_3_rapacious_modifier: "꼼꼼한 회계 관리"
 gdp_merchant_legacy_3_rapacious_modifier_desc: "해당 인물은 회사의 모든 회계를 꼼꼼히 확인하며, 그 결과를 주요 사원들과 공유합니다."
