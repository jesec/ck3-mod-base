l_korean:
 gdp_trader_work_scheme_failure_toast_title: "[trader.GetShortUIName](이)가 시장에서 고전함"
 # Trader scheme outcome modifier names and descriptions
 gdp_trader_negotiate_deals_modifier: "유리한 조건"
 gdp_trader_negotiate_deals_modifier_desc: "이 시장에서 유리한 거래 조건이 협상되어 상단의 경쟁력이 향상되었습니다."
 gdp_trader_capacity_boost_modifier: "향상된 행로 수용력"
 gdp_trader_capacity_boost_modifier_desc: "무역 대상단의 물류 체계가 개선되어 이 행로의 수용력이 증가했습니다."
 gdp_trader_lobby_advantages_modifier: "로비를 통한 특혜"
 gdp_trader_lobby_advantages_modifier_desc: "시장 소유주로부터 특혜를 확보하여 이 시장에서의 경쟁력이 향상되었습니다."
 gdp_trader_undermine_competitor_modifier: "약화된 입지"
 gdp_trader_undermine_competitor_modifier_desc: "이 시장에서의 평판과 사업상의 입지가 훼손되었습니다."
 gdp_trader_safe_passage_modifier: "안전한 통행"
 gdp_trader_safe_passage_modifier_desc: "이 경로를 더욱 안전하고 빠르게 이동할 수 있도록 조치가 마련되었습니다."
 gdp_trader_exploring_new_markets_modifier: "시장 답사"
 gdp_trader_exploring_new_markets_modifier_desc: "이 시장에 대한 답사가 이루어졌으며, 유리한 구매 권리를 찾아냈습니다."
 gdp_trader_studying_local_crafts_modifier: "제작 통찰"
 gdp_trader_studying_local_crafts_modifier_desc: "현지 공방을 조사하여 이 무역상의 제작 기술이 향상되었으며, 인생관 경험치 획득량이 증가합니다."
 gdp_trader_undivided_focus_modifier: "온전한 집중"
 gdp_trader_undivided_focus_modifier_desc: "이 [trader|E]은 자신의 업무에 자유롭게 집중할 수 있습니다.\n[trader|E] [schemes|E] [scheme_success_chance|E] #P +15%#! 보너스"
 # Merchant trait success chance bonus descs
 gdp_trader_merchant_trait_journeyman_bonus: "노련한 무역상"
 gdp_trader_merchant_trait_expert_bonus: "숙련된 무역상"
 gdp_trader_merchant_trait_master_bonus: "거장 무역상"
 gdp_trader_house_member_success_bonus: "[house|E] 구성원"
 gdp_trader_scheme_shared_rules_tt: "\n[house|E] 구성원은 [scheme_success_chance|E]이 #P +10%#! 높습니다.\n#weak 실패 시:\n#![trader|E]의 [stress|E]가 #N 10#!만큼 증가합니다"
 # Stewardship schemes
 gdp_trader_negotiate_deals_scheme: "거래 협상"
 gdp_trader_negotiate_deals_scheme_desc: "당신의 무역상이 이 시장에서 유리한 구매 및 판매 가격을 확보하기 위해 현지 상인 및 관리들과 유리한 조건을 협상하려 합니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]에 #V 5년#! 동안 [competitiveness_i][trade_competitiveness|E] 증가 효과 적용$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_desc_general: "$gdp_trader_negotiate_deals_scheme$ [scheme|E]에서 [trader|E]은 유리한 구매 및 판매 가격을 확보하기 위해 현지 상인 및 관리들과 유리한 조건을 협상합니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]에 #V 5년#! 동안 [competitiveness_i][trade_competitiveness|E] 증가 효과 적용$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiate_deals_scheme_success_title: "무역상: 거래 협상 완료"
 gdp_trader_negotiate_deals_scheme_success_desc: "[trader.GetShortUIName](이)가 협상을 통해 [trader.GetCurrentLocation.GetName] 시장에서 새로운 몫을 확보했습니다."
 gdp_trader_finding_a_deal_scheme: "거래 성사"
 gdp_trader_finding_a_deal_scheme_desc: "당신의 무역상이 수익성 있는 기회를 찾아 작은 이익도 놓치지 않고 돈을 벌어들이려 합니다.\n\n#weak 성공 시:\n#![gold_i][gold|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_desc_general: "$gdp_trader_finding_a_deal_scheme$ [scheme|E]에서 [trader|E]은 수익성 있는 기회를 찾아 작은 이익도 놓치지 않고 돈을 벌어들입니다.\n\n#weak 성공 시:\n#![gold_i][gold|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_finding_a_deal_scheme_success_title: "무역상: 거래 성사 완료"
 gdp_trader_finding_a_deal_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 거래를 성사시켰습니다."
 gdp_trader_securing_surplus_scheme: "잉여 물자 확보"
 gdp_trader_securing_surplus_scheme_desc: "당신의 무역상이 이 시장의 잉여 상품을 찾아 무역로를 따라 운송하도록 주선하고, 일시적으로 수용량을 늘리려 합니다.\n\n#weak 성공 시:\n#!당신의 [company|E]가 이 [trade_route|E]에서 #V 5년#! 동안 [trade_route_capacity|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_desc_general: "$gdp_trader_securing_surplus_scheme$ [scheme|E]에서 [trader|E]은 잉여 상품을 찾아 무역로를 따라 운송하도록 주선하고, 일시적으로 수용량을 늘립니다.\n\n#weak 성공 시:\n#![company|E]가 이 [trade_route|E]에서 #V 5년#! 동안 [trade_route_capacity|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_securing_surplus_scheme_success_title: "무역상: 잉여 물자 확보 완료"
 gdp_trader_securing_surplus_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetName] 현지 장인들을 압박해 추가 상품을 확보했습니다."
 gdp_trader_appraising_market_scheme: "시장 평가"
 gdp_trader_appraising_market_scheme_desc: "당신의 무역상이 현지 시장 상황을 조사해 가장 유리한 거래 기회를 찾으려 합니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]에 #V 5년#! 동안 [competitiveness_i][trade_competitiveness|E] 증가 효과 적용$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_desc_general: "$gdp_trader_appraising_market_scheme$ [scheme|E]에서 [trader|E]은 현지 시장 상황을 조사해 가장 유리한 거래 기회를 찾습니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]에 #V 5년#! 동안 [competitiveness_i][trade_competitiveness|E] 증가 효과 적용$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_appraising_market_scheme_success_title: "무역상: 시장 평가 완료"
 gdp_trader_appraising_market_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 새로운 사업 기회를 발견했습니다."
 gdp_trader_organizing_caravan_scheme: "상단 정비"
 gdp_trader_organizing_caravan_scheme_desc: "당신의 무역상이 상단의 운영 효율을 높이고 조직 체계를 정비해 무역로를 따라 더 많은 상품을 운송할 수 있도록 하려 합니다.\n\n#weak 성공 시:\n#!당신의 [company|E]가 이 [trade_route|E]에서 #V 5년#! 동안 [trade_route_capacity|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_desc_general: "$gdp_trader_organizing_caravan_scheme$ [scheme|E]에서 [trader|E]은 대상단의 운영 효율을 높이고 조직 체계를 정비해 무역로를 따라 더 많은 상품을 운송할 수 있도록 합니다.\n\n#weak 성공 시:\n#![company|E]가 이 [trade_route|E]에서 #V 5년#! 동안 [trade_route_capacity|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_organizing_caravan_scheme_success_title: "무역상: 상단 정비 완료"
 gdp_trader_organizing_caravan_scheme_success_desc: "[trader.GetShortUIName](이)가 더 가벼운 포장재를 찾아냈습니다."
 gdp_trader_exploring_new_markets_scheme: "시장 확장"
 gdp_trader_exploring_new_markets_scheme_desc: "당신의 무역상이 회사가 아직 진출하지 않은 시장을 탐색하여 향후 무역의 기반을 마련하려 합니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]의 구매 가격이 #V 5년#! 동안 감소$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_desc_general: "$gdp_trader_exploring_new_markets_scheme$ [scheme|E]에서 [trader|E]은 회사가 아직 진출하지 않은 시장을 탐색하여 향후 무역의 기반을 마련합니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]의 구매 가격이 #V 5년#! 동안 감소$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_exploring_new_markets_scheme_success_title: "무역상: 시장 확장 완료"
 gdp_trader_exploring_new_markets_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 상품을 저렴하게 파는 상인들을 찾아냈습니다."
 gdp_trader_identifying_rare_goods_scheme: "희귀 상품 탐색"
 gdp_trader_identifying_rare_goods_scheme_desc: "당신의 무역상이 큰 수익을 기대하며 이 시장에서 희귀품이나 사치품을 찾으려 합니다.\n\n#weak 성공 시:\n#!상당한 양의 [gold_i][gold|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_desc_general: "$gdp_trader_identifying_rare_goods_scheme$ [scheme|E]에서 [trader|E]은 큰 수익을 기대하며 시장에서 희귀품이나 사치품을 찾습니다.\n\n#weak 성공 시:\n#!상당한 양의 [gold_i][gold|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_identifying_rare_goods_scheme_success_title: "무역상: 희귀 상품 탐색 완료"
 gdp_trader_identifying_rare_goods_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 귀중한 보석을 발견했습니다."
 # Diplomacy schemes
 gdp_trader_negotiating_with_ruler_scheme: "귀족과의 협상"
 gdp_trader_negotiating_with_ruler_scheme_desc: "당신의 무역상이 시장 소유자들과 우호적인 관계를 맺으려 합니다.\n\n#weak 성공 시:\n#!현지 영주의 [opinion_i][opinion|E]이 #V 5년#! 동안 증가$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_desc_general: "$gdp_trader_negotiating_with_ruler_scheme$ [scheme|E]에서 [trader|E]은 시장 소유자들과 우호적인 관계를 맺으려 합니다.\n\n#weak 성공 시:\n#!현지 영주의 [opinion_i][opinion|E]이 #V 5년#! 동안 증가$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_negotiating_with_ruler_scheme_success_title: "무역상: 귀족과의 협상 완료"
 gdp_trader_negotiating_with_ruler_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetName]의 영주에게 매우 좋은 인상을 남겼습니다."
 gdp_trader_building_connections_scheme: "인맥 구축"
 gdp_trader_building_connections_scheme_desc: "당신의 무역상이 영지의 비축 물자에 접근하기 위해 현지 관리들과 지속적인 인맥을 구축하려 합니다.\n\n#weak 성공 시:\n#!당신의 [company|E]가 이 [trade_route|E]에서 #V 5년#! 동안 [trade_route_capacity|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_desc_general: "$gdp_trader_building_connections_scheme$ [scheme|E]에서 [trader|E]은 영지의 비축 물자에 접근하기 위해 현지 관리들과 지속적인 인맥을 구축합니다.\n\n#weak 성공 시:\n#![company|E]가 이 [trade_route|E]에서 #V 5년#! 동안 [trade_route_capacity|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_connections_scheme_success_title: "무역상: 인맥 구축 완료"
 gdp_trader_building_connections_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]의 관리들을 설득해 더 많은 화물의 통과를 허락받았습니다."
 gdp_trader_lobbying_advantages_scheme: "특혜 로비"
 gdp_trader_lobbying_advantages_scheme_desc: "당신의 무역상이 시장 소유자에게 로비해 우대를 받고 회사의 경쟁력을 높이려 합니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]에 #V 5년#! 동안 [competitiveness_i][trade_competitiveness|E] 증가 효과 적용$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_desc_general: "$gdp_trader_lobbying_advantages_scheme$ [scheme|E]에서 [trader|E]은 시장 소유자에게 로비해 우대를 받고 회사의 경쟁력을 높입니다.\n\n#weak 성공 시:\n#!방문한 [trade_market|E]에 #V 5년#! 동안 [competitiveness_i][trade_competitiveness|E] 증가 효과 적용$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_lobbying_advantages_scheme_success_title: "무역상: 특혜 로비 완료"
 gdp_trader_lobbying_advantages_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 우대를 확보했습니다."
 gdp_trader_building_reputation_scheme: "평판 쌓기"
 gdp_trader_building_reputation_scheme_desc: "당신의 무역상이 이 지역에서 회사의 인지도와 평판을 높이려 합니다.\n\n#weak 성공 시:\n#![prestige_i][prestige|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_desc_general: "$gdp_trader_building_reputation_scheme$ [scheme|E]에서 [trader|E]은 해당 지역에서 회사의 인지도와 평판을 높입니다.\n\n#weak 성공 시:\n#![prestige_i][prestige|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_building_reputation_scheme_success_title: "무역상: 평판 쌓기 완료"
 gdp_trader_building_reputation_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 회사의 이름을 빛냈습니다."
 gdp_trader_championing_patron_scheme: "후원자의 이익 대변"
 gdp_trader_championing_patron_scheme_desc: "당신의 무역상이 이 시장에서 [merchant_patron|E]의 무역 이익을 대변하려 합니다.\n\n#weak 성공 시:\n#!당신의 [merchant_patron|E]의 [opinion_i][opinion|E] 증가, 소량의 [prestige_i][prestige|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_desc_general: "$gdp_trader_championing_patron_scheme$ [scheme|E]에서 [trader|E]은 시장에서 [merchant_patron|E]의 무역 이익을 대변합니다.\n\n#weak 성공 시:\n#![merchant_patron|E]의 [opinion_i][opinion|E] 증가, 소량의 [prestige_i][prestige|E] 획득$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_championing_patron_scheme_success_title: "무역상: 후원자의 이익 대변 완료"
 gdp_trader_championing_patron_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 [route_owner.GetSuzerain.GetShortUINamePossessive] 영향력을 강화했습니다."
 gdp_trader_entertaining_merchants_scheme: "상인 접대"
 gdp_trader_entertaining_merchants_scheme_desc: "당신의 무역상이 다른 상인 회사의 대표들을 접대하여 경쟁 [merchant|E]과의 관계를 개선하려 합니다.\n\n#weak 성공 시:\n#!경쟁 [merchant|E]의 [opinion_i][opinion|E]이 #V 5년#! 동안 증가$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_desc_general: "$gdp_trader_entertaining_merchants_scheme$ [scheme|E]에서 [trader|E]은 다른 상인 회사의 대표들을 접대하여 경쟁 [merchant|E]과의 관계를 개선합니다.\n\n#weak 성공 시:\n#!경쟁 [merchant|E]의 [opinion_i][opinion|E]이 #V 5년#! 동안 증가$gdp_trader_scheme_shared_rules_tt$"
 gdp_trader_entertaining_merchants_scheme_success_title: "무역상: 상인 접대 완료"
 gdp_trader_entertaining_merchants_scheme_success_desc: "[trader.GetShortUIName](이)가 [trader.GetCurrentLocation.GetNameNoTooltip]에서 경쟁 [merchant|E]의 환심을 사는 데 성공했습니다."
