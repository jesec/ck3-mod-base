 gdp_visit_holding_decision_event.1322.t: "거친 무뢰한"
 gdp_visit_holding_decision_event.1322.desc: "[hired_muscle_recruit.GetFirstName]에게 다가가자 [hired_muscle_recruit.GetHerHis] 수상한 눈빛이 나를 위아래로 훑는다.\n\n\"네가 누구 앞에 서 있는지 모르나? 나는 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]의 무패 챔피언이다. 너 같은 [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] 따위가 나와 싸워 이길 수 있다고 생각하다니, 배짱 하나는 인정해 주지.\"\n\n[hired_muscle_recruit.GetSheHe|U]는 위협하듯 주먹을 치켜든다."
 gdp_visit_holding_decision_event.1322.a: " 그 말을 반드시 후회하게 만들어 주겠다!"
 gdp_visit_holding_decision_event.1322.a.success: "[hired_muscle_recruit.GetFirstName]를 물리침"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName]가 당신을 물리침"
 gdp_visit_holding_decision_event.1322.b: "그 대신 나를 위해 싸워라."
 gdp_visit_holding_decision_event.1322.b.tt: "[hired_muscle_recruit.GetFirstNameNoTooltip] 고용에 필요한 @gold_icon![hired_muscle_recruit_cost|V0] [gold|E]를 $gdp_visit_holding_decision_event.1320.no_gold.tt$ "
 gdp_visit_holding_decision_event.1322.c: "이제 그만 가는 게 좋겠군..."
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1323.t: "수학에 밝은 학자"
 gdp_visit_holding_decision_event.1323.desc: "[numerate_recruit.GetFirstName](은)는 책에 코를 박고 있어 내가 바로 앞으로 다가갈 때까지도 눈치채지 못한다. [numerate_recruit.GetSheHe|U]는 골똘한 표정으로 나를 올려다본다.\n\n\"보아하니 제법 유능한 분 같군요. 제 작은 문제 하나만 좀 풀어 주시겠습니까?\"\n\n[numerate_recruit.GetSheHe]가 내민 장부에는 숫자와 계산식이 빼곡히 적혀 있다. 노점의 수입과 지출을 정리한 회계 장부인 듯하다."
 gdp_visit_holding_decision_event.1323.a: "이 숫자를 여기로 옮겨 보면..."
 gdp_visit_holding_decision_event.1323.a.success: "계산을 해결함"
 gdp_visit_holding_decision_event.1323.a.failure: "계산을 해결하지 못함"
 gdp_visit_holding_decision_event.1323.b: "차라리 #EMP 내#! 회사에서 이 일을 맡아보는 건 어떻겠나?"
 gdp_visit_holding_decision_event.1323.b.tt: "[numerate_recruit.GetFirstNameNoTooltip] 고용에 필요한 @gold_icon![numerate_recruit_cost|V0] [gold|E]를 $gdp_visit_holding_decision_event.1320.no_gold.tt$ "
 gdp_visit_holding_decision_event.1323.c: "다시 생각해 봤는데..."
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1324.t: "노련한 여행자"
 gdp_visit_holding_decision_event.1324.desc: "두 상인 사이의 긴장이 폭발 직전에 이르렀다. [traveler_recruit.GetFirstName](은)는 달래는 몸짓을 취하며 갈등을 가라앉히려 애쓴다. 서툰 [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]에도 불구하고, [traveler_recruit.GetSheHe]는 어느 정도 성공을 거둔다. 현지 문화에 익숙하지 않은 것이 분명한 사람치고는 훌륭한 노력이다.\n\n하지만 두 상인 모두 [traveler_recruit.GetSheHe]가 품질을 말하는 건지, 상품을 말하는 건지, 아니면 전혀 다른 무언가를 말하는 건지 알아듣지 못한다. 결국 말다툼은 교착 상태에 빠진다."
 gdp_visit_holding_decision_event.1324.a: "\"내가 중재해 보지.\""
 gdp_visit_holding_decision_event.1324.a.success: "당신의 해석에 설득력이 있음"
 gdp_visit_holding_decision_event.1324.a.failure: "당신의 개입이 반갑지 않음"
 gdp_visit_holding_decision_event.1324.b: "내겐 자네 같은 전문가가 필요해."
 gdp_visit_holding_decision_event.1324.b.tt: "[traveler_recruit.GetFirstNameNoTooltip] 고용에 필요한 @gold_icon![traveler_recruit_cost|V0] [gold|E]를 $gdp_visit_holding_decision_event.1320.no_gold.tt$ "
 gdp_visit_holding_decision_event.1324.c: "신경 쓸 여유가 없군..."
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1325.t: "거리의 아이"
 gdp_visit_holding_decision_event.1325.desc: "나는 이런 수법을 수도 없이 봐 왔기에, 그 [urchin_recruit.Custom('GirlBoy')]에게 조심스럽게 다가간다. 말을 꺼내기도 전에 앙상한 팔 하나가 내 손에 꾸러미를 떠넘긴다.\n\n\"선량하신 분, 부디 저와 이 아이에게 먹을 것을 조금만 베풀어 주실 수 없나요?\"\n\n[urchin_recruit.GetHerHis|U] 다른 손은 이미 내 주머니를 더듬고 있다. 예상했던 대로 꾸러미는 미끄러져 바닥에 떨어지고, 담요에 싸인 돌멩이 세 개가 모습을 드러낸다. 뻔한 속임수였지만, 대담하기는 했다."
 gdp_visit_holding_decision_event.1325.a: "당장 내 주머니에서 손 떼라!"
 gdp_visit_holding_decision_event.1325.a.success: "절도범을 잡아냄"
 gdp_visit_holding_decision_event.1325.a.failure: "대응이 너무 늦었음"
 gdp_visit_holding_decision_event.1325.b: "내 회사에는 손재주가 좋은 사람이 필요하다."
 gdp_visit_holding_decision_event.1325.b.tt: "[urchin_recruit.GetFirstNameNoTooltip] 고용에 필요한 @gold_icon![urchin_recruit_cost|V0] [gold|E]를 $gdp_visit_holding_decision_event.1320.no_gold.tt$ "
 gdp_visit_holding_decision_event.1325.c: "이쯤이면 됐다!"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1326.t: "약초사"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName](은)는 내가 가까이 다가가도 전혀 신경 쓰지 않는다. [herbalist_recruit.GetSheHe|U]는 재료를 정체 모를 혼합물로 빻는 작업에 완전히 몰두해 있다.\n\n\"[ROOT.Char.Custom('Abortifacient')](을)를 조금 넣고, [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]도 약간 넣은 다음, [ROOT.Char.Custom('RegionalDrink')]에 끓여 볼까. 그래... 그러면 될 것 같은데, 어떻게 생각하나?\"\n\n내 존재를 거의 의식하지도 않은 채, [herbalist_recruit.GetSheHe]는 몸을 돌려 절구를 내 코앞에 들이민다. 순간 코를 찌르는 강한 냄새가 밀려온다."
 gdp_visit_holding_decision_event.1326.a: " #EMP 흠#!, [ROOT.Char.Custom('Abortifacient')](을)를 조금 더 넣어 보는 건 어떻겠나?"
 gdp_visit_holding_decision_event.1326.a.success: "당신의 조언이 유익함"
 gdp_visit_holding_decision_event.1326.a.failure: "당신의 조언이 도움이 되지 않음"
 gdp_visit_holding_decision_event.1326.b: "내겐 자네 같은 솜씨를 지닌 사람이 필요하다."
 gdp_visit_holding_decision_event.1326.b.tt: "[herbalist_recruit.GetFirstNameNoTooltip] 고용에 필요한 @gold_icon![herbalist_recruit_cost|V0] [gold|E]를 $gdp_visit_holding_decision_event.1320.no_gold.tt$ "
 gdp_visit_holding_decision_event.1326.c: "이건 내 적성에 맞지 않는군."
 gdp_visit_holding_decision_event.1330.t: "승려"
 gdp_visit_holding_decision_event.1330.desc: "현지 찻집의 조용한 구석에서 승려 한 명이 촛불이 비추는 탁자에 톱풀 줄기를 펼쳐 놓고 점괘를 풀이하고 있다. 승려는 내 관심을 알아차리고 나를 바라본다.\n\n\"벗이여, 그대는 신탁을 따르는 제자인가? 열린 마음으로 진실하게 임한다면, 도는 그대에게 많은 것을 보여 줄 것이네.\""
 gdp_visit_holding_decision_event.1330.desc_returned_01: "찻집은 전보다 한산해졌다. [monk.GetFirstName](은)는 여전히 톱풀 줄기를 앞에 펼쳐 놓고 앉아 있고, 초는 더 많이 타들어 갔다.\n\n[monk.GetSheHe|U]는 고개조차 들지 않는다."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "내가 돌아왔을 때 [monk.GetFirstName](은)는 톱풀 줄기를 다시 천에 모아 담고 있다. 촛불이 꺼질 듯 일렁인다.\n\n\"끈질기군.\" [monk.GetSheHe]가 말한다. \"도는 두 번째 방문을 마다하지 않는다네. 그대는 어떤가?\""
 gdp_visit_holding_decision_event.1330.a: "우리 회사에도 학식 있는 동료가 있으면 좋겠군."
 gdp_visit_holding_decision_event.1330.a.tt: "[monk.GetFirstNameNoTooltip] 고용에 @gold_icon![monk_recruit_cost|V0] [gold|E] 필요"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "지금까지 무엇을 연구했는지 들어볼까."
 gdp_visit_holding_decision_event.1330.c: "하늘에 관해서라면 나도 아는 게 좀 있지."
 gdp_visit_holding_decision_event.1330.c.success: "[monk.GetFirstNameNoTooltip]에게 깊은 인상을 남김"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName](이)가 별다른 인상을 받지 못한 채 떠남"
 gdp_visit_holding_decision_event.1330.d: "나중에 해야겠군."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1333.t: "노련한 상단원"
 gdp_visit_holding_decision_event.1333.desc: "단봉낙타들이 우리 안의 비좁은 피신처에서 서로 몸을 바짝 붙이고 있다. 낙타들 사이에서는 이따금 끙끙거리는 소리와 발굽을 구르는 소리가 들린다. 그런데... #EMP 코 고는 소리#!?\n\n자세히 살펴보니 상단원 한 명이 안장가방에 기대어 잠들어 있다. [caravaneer.GetSheHe|U]는 내가 다가가는 소리에 잠에서 깨어 황급히 일어서더니 얼굴에 묻은 침을 닦는다.\n\n상단원이 설명한다. \"장담하건대 마구간 주인도 제가 여기 있다는 걸 알고 있습니다. 동물들의 안전과 제 마음의 평안을 위해서라도 저는 녀석들 곁을 떠나지 않습니다.\""
 gdp_visit_holding_decision_event.1333.desc_returned_01: "단봉낙타들은 여전히 우리 안에 빽빽하게 모여 있다. 이번에는 [caravaneer.GetFirstName](이)가 깨어서 안장을 고정하는 배띠를 손으로 훑고 있다.\n\n[caravaneer.GetSheHe|U]는 어깨 너머로 힐끗 돌아본다. \"또 당신이군요.\""
 gdp_visit_holding_decision_event.1333.desc_returned_02: "우리에서 끙 하는 소리가 들리고, 뒤이어 [caravaneer.GetFirstNamePossessive] 목소리가 들린다. \"구경하러 오셨다면 동물들이 구경값을 더 받을 겁니다.\"\n\n[caravaneer.GetSheHe|U]는 이제 옷을 제대로 갖춰 입고 안장가방 위에 앉아 내가 말을 걸 생각인지 지켜보고 있다."
 gdp_visit_holding_decision_event.1333.a: "\"자네 동물들을 지켜 주지.\""
 gdp_visit_holding_decision_event.1333.a.tt: "[caravaneer.GetFirstNameNoTooltip] 고용에 @gold_icon![caravaneer_recruit_cost|V0] [gold|E] 필요"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "\"여행길에 새로운 소식이라도 있나?\""
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "최근 도로에 관해 물었습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1333.c: "\"상단을 조직하는 일이라면 나도 아는 게 좀 있지...\""
 gdp_visit_holding_decision_event.1333.c.success: "[caravaneer.GetFirstNameNoTooltip]에게 깊은 인상을 남김"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName](이)가 동물들을 데리고 떠남"
 gdp_visit_holding_decision_event.1333.d: "나중에 해야겠군."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1334.t: "선장"
 gdp_visit_holding_decision_event.1334.desc: "부두가 사람들로 북적인다. 남녀 여러 명이 세월의 흔적이 역력한 선원 한 명의 주위에 모여 [sea_captain.GetHerHis] 배에 승선할 자리를 구하려 하고 있다.\n\n지나가던 두 사람이 속삭이는 소리가 들린다. \"너무 늦었어! [sea_captain.GetTitledFirstName|U]의 배에는 우리가 탈 자리가 없을 거야.\" 두 사람은 다른 선원을 찾는 대신 그가 다시 돌아올 때까지 기다리기로 한다.\n\n대체 이 사람은 누구일까? 그리고 [sea_captain.GetHerHis] 의족 안에서 짤랑거리는 저 소리는 설마 #EMP 금화#! 소리인가?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "[sea_captain.GetFirstName] 주위에 모였던 사람들이 줄어들었다. 마지막까지 승선을 부탁하던 사람들마저 떠나가는 동안 [sea_captain.GetSheHe|U]는 의족 안에 동전을 하나씩 넣고 있다.\n\n[sea_captain.GetSheHe|U]는 돌아보지도 않는다. \"다시 볼 줄은 몰랐군요.\""
 gdp_visit_holding_decision_event.1334.desc_returned_02: "[sea_captain.GetTitledFirstName|U](은)는 늦게 도착한 사람에게 다른 배로 가라고 손짓한다. [sea_captain.GetSheHe]가 몸을 돌리자 의족이 널빤지 바닥을 두드린다.\n\n\"벌써 돌아왔군요. 배에 탈 자리가 필요한 겁니까? 아니면 나를 찾아온 겁니까?\""
 gdp_visit_holding_decision_event.1334.a: "\"여기 있는 누구보다도 두 배의 돈을 낼 수 있네만.\""
 gdp_visit_holding_decision_event.1334.a.tt: "[sea_captain.GetFirstNameNoTooltip] 고용에 @gold_icon![sea_captain_recruit_cost|V0] [gold|E] 필요"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "\"이야기나 한두 개 들려주겠나?\""
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "최근 선장의 이야기를 들었습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1334.c: "\"상품을 거래하는 편이 훨씬 돈이 될 텐데.\""
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip](이)가 설득됨"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstName](이)가 출항함"
 gdp_visit_holding_decision_event.1334.d: "나중에 해야겠군."
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1335.t: "축제 어릿광대"
 gdp_visit_holding_decision_event.1335.desc: "거리 한쪽에서 공연을 펼치는 사람 주위로 관객들이 넋을 잃고 모여든다. 근처 상점의 손님들까지 공연을 보러 몰려들면서 시장의 거래가 완전히 멈춰 버린다.\n\n공연자가 [carnival_jester.GetHerHis] 팔을 펼치며 말한다. \"잘 보시오! 어두컴컴한 축제 공연장이 아니면 내 묘기를 펼칠 수 없다고 했던 분들! 나는 당신들과 달리 가면 뒤에 숨을 필요가 없소.\""
 gdp_visit_holding_decision_event.1335.desc_returned_01: "같은 거리 모퉁이지만 관객은 전보다 줄었다. 공연을 한 차례 마친 [carnival_jester.GetFirstName](은)는 나를 발견하더니, 마치 나도 공연의 일부인 양 두 팔을 활짝 펼친다.\n\n\"앙코르라도 원하시오?\""
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName](은)는 공연 소품을 천에 싸고 있다.\n\n\"이제 보니 나를 보러 찾아온 것 같군요.\""
 gdp_visit_holding_decision_event.1335.a: "\"내 회사에는 자네처럼 재치 넘치는 사람이 필요해.\""
 gdp_visit_holding_decision_event.1335.a.tt: "[carnival_jester.GetFirstNameNoTooltip] 고용에 @gold_icon![carnival_jester_recruit_cost|V0] [gold|E] 필요"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "\"이런 카니발에 관해 좀 더 듣고 싶은데.\""
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "최근 카니발에 관해 물었습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1335.c: "\"여기서 실력을 증명할 필요가 없지 않나?\""
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip](이)가 설득됨"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName](이)가 짐을 싸서 떠남"
 gdp_visit_holding_decision_event.1335.d: "나중에 해야겠군."
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1336.t: "제빵사"
 gdp_visit_holding_decision_event.1336.desc_intro: "근처 시장 좌판에서 갓 구운 [ROOT.Char.Custom('FavoriteTreat')]의 달콤한 냄새가 풍겨 온다. 구운 음식이 담긴 바구니가 빈자리마다 쌓여 있다.\n\n가게 주인은 한쪽에 서서 두 손으로 머리를 감싸 쥐고 있다. [cook.GetSheHe]는 나를 발견하고 입을 연다."
 gdp_visit_holding_decision_event.1336.desc_named_noble: "\"예전에는 [local_noble.GetTitledFirstNameNoTooltip](을)를 위해 일했는데, 이제는 '몸매를 관리한다'라며 저를 필요로 하지 않으십니다.\" [cook.GetSheHe|U]는 입술을 잘근잘근 깨문다. \"당신 같은 상인이라면 이것들을 거래할 수 있을지도 모르겠군요. 하지만 저는... 하루가 너무 짧습니다.\""
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "\"저택에서는 저를 부르지도 않습니다. 물건이 너무 많아서 도저히 다 팔 수가 없어요!\""
 gdp_visit_holding_decision_event.1336.desc_returned_01: "좌판에서는 여전히 [ROOT.Char.Custom('FavoriteTreat')] 냄새가 풍겨 온다. [cook.GetFirstName](은)는 돈을 받지 않고 낯선 사람에게 건넬 꾸러미를 또 하나 포장하고 있다.\n\n[cook.GetSheHe|U]는 나를 보고 한숨을 쉰다. \"아직도 저를 부르지 않았어요. 언제까지나 공짜로 나눠 줄 수는 없어요.\""
 gdp_visit_holding_decision_event.1336.desc_returned_02: "이제 바구니도 몇 개 남지 않았다. [cook.GetFirstName](은)는 소매에 밀가루가 묻은 채 판매대에 기대어 마지막 남은 빵들이 하나둘 사라지는 모습을 지켜보고 있다.\n\n\"제빵사가 필요하시다면,\" [cook.GetSheHe]가 말한다. \"좌판이 텅 비기 전에 말씀하세요.\""
 gdp_visit_holding_decision_event.1336.a: "\"내 회사에는 먹여 살려야 할 사람이 많아.\""
 gdp_visit_holding_decision_event.1336.a.tt: "[cook.GetFirstNameNoTooltip] 고용에 @gold_icon![cook_recruit_cost|V0] [gold|E] 필요"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.b: "회사 사람들의 식사를 책임지는 방법을 보여 주게."
 gdp_visit_holding_decision_event.1336.c: "누가 주방 일을 더 잘 아는지 겨뤄 보지."
 gdp_visit_holding_decision_event.1336.c.success: "[cook.GetFirstNameNoTooltip]에게 깊은 인상을 남김"
 gdp_visit_holding_decision_event.1336.c.failure: "[cook.GetFirstName](은)는 좌판을 접고 떠남"
 gdp_visit_holding_decision_event.1336.d: "나중에 해야겠군."
