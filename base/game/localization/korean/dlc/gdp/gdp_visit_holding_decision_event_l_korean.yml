 gdp_visit_holding_rare_recruit_skill.stewardship: "[ROOT.Char.GetFirstName](이)가 [ROOT.Char.Custom('GetVisitHoldingColoredStewardshipSkillLevel')] [stewardship_skill|E]을 보유함 ([stewardship_i][ROOT.Char.GetSkill( 'stewardship' )|V])"
 gdp_visit_holding_rare_recruit_skill.intrigue: "[ROOT.Char.GetFirstName](이)가 [ROOT.Char.Custom('GetVisitHoldingColoredIntrigueSkillLevel')] [intrigue_skill|E]을 보유함 ([intrigue_i][ROOT.Char.GetSkill( 'intrigue' )|V])"
