 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$장터 — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_DOCKS: "\n$EFFECT_LIST_BULLET$부두 — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_PATRON: "\n$EFFECT_LIST_BULLET$당신의 [ROOT.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip] 궁정 — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_EXHAUSTED_WORSHIP: "\n$EFFECT_LIST_BULLET$[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] — [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "이 [ROOT.Char.Custom('LocalHoldingTypeConcept')]에서 모든 기회를 살펴보았습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V] 후 새로운 선택지를 이용할 수 있습니다"
 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED_BLOCKER: "[CHARACTER.Custom('GetVisitHoldingDecisionAllOptionsExhaustedTooltip')]"
 gdp_visit_holding_decision_event.1000.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] [ROOT.Char.Custom('LocalHoldingTypeCapitalized')] 방문"
 gdp_visit_holding_decision_event.1000.desc: "해가 떠오르자 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]의 주민들이 하나둘 활동을 시작한다. 아침의 고요함은 하루를 시작하는 사람들의 활기찬 이야기 소리로 금세 자취를 감춘다. 눈썰미만 있다면 이 분주한 거리 곳곳에서 기회를 발견할 수 있다.\n\n오늘은 어디에서 행운을 찾아볼까?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "중계지에서 얻은 교훈"
 gdp_visit_holding_decision_event.1000.a: "조합으로 가 보자."
 gdp_visit_holding_decision_event.1000.a.tt: "조합 방문이 다음 기회 제공 가능: $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "조합에서 이용할 수 있는 모든 기회를 살펴보았습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "장터에서 이용할 수 있는 모든 기회를 살펴보았습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "부두에서 이용할 수 있는 모든 기회를 살펴보았습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "당분간 [THIS.Char.GetSuzerain.GetTitledFirstNamePossessiveNoTooltip] 궁정에서 더 이상 이용할 수 있는 기회가 없습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "알현을 청할 후원자가 없습니다"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "당분간 이 [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]에서 더 살펴볼 것이 없습니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V] 후 다시 시도하십시오"
 gdp_visit_holding_caught_stealing.tt: "최근 [THIS.Char.Custom('LocalHoldingTypeConcept')]의 [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]에서 도둑질을 하다가 걸렸습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]까지 출입이 금지되었습니다"
 gdp_visit_holding_decision_event.1000.b: "[patron.GetTitledFirstNameNoTooltip] 알현을 청해야겠다."
 gdp_visit_holding_decision_event.1000.c: "장터를 둘러보기 좋은 날이다."
 gdp_visit_holding_decision_event.1000.c.tt: "현지 시장 방문이 다음 기회 제공 가능: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "부두를 거닐기 좋은 날이다."
 gdp_visit_holding_decision_event.1000.e.tt: "부두 방문이 다음 기회 제공 가능: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] 경내가 흥미로워 보이는군."
 gdp_visit_holding_decision_event.1000.f.tt: "지역 예배당 방문이 다음 기회 제공 가능: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_cure$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$ [gold_i][gold|E]를 기부하여 [piety_i][piety|E] 획득"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$ 당신의 [health|E] 개선 또는 [diseases|E] 치료"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$ [character_modifier|E] 형태의 축복 획득"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ 공물에서 [gold_i][gold|E] 절도"
 gdp_visit_holding_decision_event.1000.d: "오늘 볼일은 이쯤이면 끝난 것 같다."
 gdp_visit_holding_decision_event.1000.d.tt: "일단 집으로 돌아감"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "\"사실, 마음이 바뀌었다.\""
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "이 [ROOT.Char.Custom('LocalHoldingTypeConcept')](을)를 살펴보지 않고 떠남"
 gdp_visit_holding_decision_event.1000.d.exhausted: "이제 할 일은 없는 것 같군..."
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "집으로 돌아갑니다. [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V] 후 새로운 기회를 이용할 수 있습니다"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "현재 당신의 [domicile|E]는 [merchant_patrons|E]의 영지 밖에 있음"
 gdp_visit_holding_decision_event.1110.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] 조합 방문"
 gdp_visit_holding_decision_event.1110.desc: "망치가 금속을 두드리는 소리가 조합 골목 곳곳에 울려 퍼진다. 길 건너편에서는 젊은 도제가 스승의 연장을 도예 공방으로 옮기고 있다. 수세대에 걸쳐 조합 회관은 숙련공을 뛰어난 장인으로 길러 왔다.\n\n길드에서는 상인을 위한 다양한 서비스를 제공한다. 오늘은 무엇을 찾아가 볼까?"
 gdp_visit_holding_decision_event.1110.a: "손질이 필요한 유물이 하나 있어."
 gdp_visit_holding_decision_event.1110.a.tt: "유물 담당관 방문이 다음 기회 제공 가능:\n$EFFECT_LIST_BULLET$ 당신의 일반 및 걸작 @artifact_icon![artifacts|E] 개선"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "최근 유물 담당관의 서비스를 이용했습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "일반 또는 걸작 [artifacts|E]을 보유하지 않음"
 gdp_visit_holding_decision_event.1110.b: "새 무기와 방어구를 장만하고 싶군."
 gdp_visit_holding_decision_event.1110.b.tt: "대장장이 방문이 다음 기회 제공 가능:\n$EFFECT_LIST_BULLET$ 일반, 걸작, 또는 저명한 무기와 방어구 @artifact_icon![artifacts|E] 구매"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "최근 대장장이로부터 물건을 구매했습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1110.c: "조합장과 만날 약속을 잡아보자."
 gdp_visit_holding_decision_event.1110.c.tt: "조합장과의 만남이 다음 기회 제공 가능:$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "최근 조합장과 만났습니다 — [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )] 후 다시 시도하십시오"
 gdp_visit_holding_decision_event.1110.d: "다른 곳으로 가 볼까?"
 gdp_visit_holding_decision_event.1110.d.tt: "일단 조합에서 떠남"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: 유물 담당관"
 gdp_visit_holding_decision_event.1111.desc: "유물 담당관의 작업실에 들어서자 곳곳에서 모인 진귀한 물건들이 눈길을 사로잡는다. 안쪽 작업대에서는 어떤 [curator.GetWomanMan]이 단검 손잡이에 최고급 보석을 세공하느라 몸을 굽히고 있다. 진열된 장식품 하나를 살펴보는 사이, [curator.GetSheHe]는 집중을 풀고 고개를 든다.\n\n\"아, 손님이시군요! [ROOT.Char.GetTitledFirstNameNoTooltip]께서 오늘은 무슨 용무로 오셨습니까?\""
 gdp_visit_holding_decision_event.1111.a: "[artifact_target_1.GetNameNoTooltip](을)를 손질해야 할 것 같다."
 gdp_visit_holding_decision_event.1111.a.tt: "[artifact_target_1.GetName](이)가 개선될 것임"
 gdp_visit_holding_decision_event.1111.b: "[artifact_target_2.GetNameNoTooltip]에 요즘 관심이 부족했던 것 같아서."
 gdp_visit_holding_decision_event.1111.b.tt: "[artifact_target_2.GetName](이)가 개선될 것임"
 gdp_visit_holding_decision_event.1111.c: "[artifact_target_3.GetNameNoTooltip]에 더 나아질 부분이 있을 것 같은데."
 gdp_visit_holding_decision_event.1111.c.tt: "[artifact_target_3.GetName](이)가 개선될 것임"
 gdp_visit_holding_decision_event.1111.d: "나중에 다시 와야겠군..."
 gdp_visit_holding_decision_event.1111.d.tt: "조합으로 돌아간 뒤 [THIS.Char.GetCurrentLocation.GetName]에서 무엇을 더 할 수 있는지 살펴봄"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: 대장장이"
 gdp_visit_holding_decision_event.1112.desc: "대장간에 들어서자 거의 견디기 힘들 정도의 화덕 열기가 온몸을 덮친다. 대검을 두드리던 대장장이는 내 등장에 작업을 멈춘다. [blacksmith.GetSheHe]는 이마에 묻은 땀과 그을음을 훔쳐 내고는 내게 시선을 돌렸다.\n\n\"어디 보자... 훌륭한 무기와 방어구를 하나 장만하러 오셨습니까, [ROOT.Char.GetTitleAsNameNoTooltip]? [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]에서 이보다 좋은 물건은 없을 겁니다.\""
 gdp_visit_holding_decision_event.1112.a: "[arms_armor_artifact_1.GetNameNoTooltip](이)라면 좋은 선택이 될 것 같군."
 gdp_visit_holding_decision_event.1112.b: "[arms_armor_artifact_2.GetNameNoTooltip](을)를 사는 것도 괜찮겠어."
 gdp_visit_holding_decision_event.1112.c: "[arms_armor_artifact_3.GetNameNoTooltip] 같은 물건이 필요해."
 gdp_visit_holding_decision_event.1112.d: "다시 생각해 보니, 오늘은 아닌 것 같군."
 gdp_visit_holding_decision_event.1112.d.tt: "조합으로 돌아간 뒤 [THIS.Char.GetCurrentLocation.GetName]에서 무엇을 더 할 수 있는지 살펴봄"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: 조합장의 안내"
 gdp_visit_holding_decision_event.1113.desc: "조합장 [guild_master.GetName](와)과의 만남은 [ROOT.Char.GetHouse.GetName] 회사에 큰 도움이 되었다. 먼지가 쌓인 사무실에서 서류와 책 더미에 둘러싸여 이야기를 나누다 보니 몇 시간이 순식간에 흘러갔다.\n\n[guild_master.GetNameNoTooltip](은)는 [guild_master.Custom('highest_skill_noun')]에 대해 남다른 통찰을 지니고 있다. [guild_master.GetHerHis|U] 이야기에 나와 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))] [visiting_associate.GetName](은)는 완전히 매료되어 더 많은 것을 배우고 싶어졌다."
 gdp_visit_holding_decision_event.1113.a.success: "당신과 [visiting_associate.GetName](이)가 새로운 지식을 쉽게 습득함"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "고대 문헌을 해독하는 일은 쉽지 않음"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "당신과 [visiting_associate.GetName](이)가 이해하기에는 계산식이 너무 어려움"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "복잡한 외교적 역학은 금방 이해하기에는 너무 어려움"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "배움이 아무런 결실을 맺지 못함."
 gdp_visit_holding_decision_event.1113.a: "나와 [visiting_associate.GetNameNoTooltip](이)가 조금 더 머물러도 되겠나?"
 gdp_visit_holding_decision_event.1113.a.child: "가르침이 [visiting_associate.GetNamePossessive] 교육에 도움이 됨"
 gdp_visit_holding_decision_event.1113.b: "\"[visiting_associate.GetFirstNameNoTooltip]에게 강의를 부탁하고 싶은데.\""
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName](이)가 [visiting_associate.GetNameNoTooltip]에게 다음 주제를 더 가르치게 됨:"
 gdp_visit_holding_decision_event.1113.c: "\"흥미롭군, 당장 적어둬야겠어!\""
