 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "번쩍이는 은화에 홀린 군중이 모여든다. [ROOT.Char.GetNamePossessive] 손놀림에 속아 넘어간 사람들은 도살장으로 끌려가는 양 떼처럼 줄지어 서 있다."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "낡은 갑옷을 걸친 [ROOT.Char.GetFirstName](은)는 우람한 몸을 벽에 기대고 서서, 초조한 듯 단검을 이리저리 돌리고 있다."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName](은)는 노점을 하나하나 살펴보며, 작은 장부에 세부 사항을 꼼꼼히 적어 내려간다."
 gdp_visit_holding_decision_event.1320.traveler.desc: "이국적인 복장을 한 [ROOT.Char.GetFirstName](은)는 서툰 [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName]까지 써 가며 두 무역상 사이의 분쟁을 중재하려 애쓰고 있다!"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName](은)는 그림자 속을 배회하며, 한 팔에는 꽁꽁 싸맨 아기를 안고 다른 손은 내민 채 다음 먹잇감을 찾고 있다."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "부상당한 상단원 곁에 몸을 웅크린 [ROOT.Char.GetFirstName](은)는 빠르게 근처의 잡초를 빻아서 습포제를 만들고 있다."
