 gdp_visit_holding_decision_effect_competitiveness: "\n$EFFECT_LIST_BULLET$ 당신의 [competitiveness_i][trade_competitiveness|E] 증가"
 gdp_visit_holding_decision_effect_prestige: "\n$EFFECT_LIST_BULLET$ [gold_i][gold|E]를 [prestige_i][prestige|E]으로 교환"
