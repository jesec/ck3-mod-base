 gdp_visit_holding_decision_effect_contracts: "\n$EFFECT_LIST_BULLET$ [luxury_contract_i][luxury_contracts|E] 발견"
 gdp_visit_holding_decision_effect_stress_loss: "\n$EFFECT_LIST_BULLET$ 당신의 [stress_loss_i][stress|E] 감소"
 gdp_visit_holding_decision_tt: "$gdp_visit_holding_decision_effect_intro$ $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$ $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$ $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 VISIT_HOLDING_DECISION_AVAILABLE_AREAS_HEADER: "\n#weak 아직 남은 기회:#!"
 VISIT_HOLDING_DECISION_AVAILABLE_GUILDS: "\n$EFFECT_LIST_BULLET$조합"
 VISIT_HOLDING_DECISION_AVAILABLE_MARKET: "\n$EFFECT_LIST_BULLET$장터"
