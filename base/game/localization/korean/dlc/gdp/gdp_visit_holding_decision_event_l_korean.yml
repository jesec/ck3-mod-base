 market_recruitment_success.t: "고용 성공"
 gdp_visit_holding_decision_event.1400.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] 부두 방문"
 gdp_visit_holding_decision_event.1400.intro: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]의 분주한 항구에서는 부두 노동자들이 온갖 크기의 화물을 부지런히 하역하고 있다."
 gdp_visit_holding_decision_event.1400.asia: "비단 상자와 찻잎 자루가 굳은살 박인 손길에 조심스레 옮겨진다. 머지않아 이 물건들은 거친 바다를 정크선에 실려 안전하게 운반되어, 알려진 세계 곳곳으로 진귀한 상품을 전하게 될 것이다."
 gdp_visit_holding_decision_event.1400.mena_india: "어수선한 항구 한가운데에서는 한 상인이 파손된 상자의 화물을 살펴보고 있다. 항구 반대편에서는 향신료를 담은 상자들이 험난한 항해를 견딜 수 있도록 꼼꼼히 봉인되고 있다."
 gdp_visit_holding_decision_event.1400.default: "곡물과 소금을 담은 자루들이 먼 나라를 향해 선적되고 있다. 거대한 참나무 코그선 한 척이 막 닻을 내렸고, 화려한 옷차림의 이국 상인들이 배에서 내려온다."
 gdp_visit_holding_decision_event.1400.outro: "상쾌한 바닷바람이 폐를 가득 채운다. 오늘은 행운의 바람이 내 편인지 확인해 보고 싶다.\n\n...다음에는 어디로 가 볼까?\n\n"
 gdp_visit_holding_decision_event.1400.b: "눈여겨볼 만한 사람이 없는지 찾아보자."
 gdp_visit_holding_decision_event.1400.b.tt: "부두 탐색이 다음 기회 제공 가능:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "저 선장과 이야기를 나눠 봐야겠군."
 gdp_visit_holding_decision_event.1400.d.tt: "선장에게 말 걸기\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "[sea_captain.GetFirstNameNoTooltip](와)과 다시 이야기를 나눠야겠어."
 gdp_visit_holding_decision_event.1400.c.tt: "일단은 부두에서 떠남"
 DECISION_ALREADY_VISITING_HOLDING: "[CHARACTER.Custom('IsAlreadyVisitingHolding')]"
 DECISION_ALREADY_VISITING_HOLDING_TIME: "해당 행동은 [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'gdp_visit_holding_is_visiting') )]부터 다시 사용할 수 있음"
 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "이미 봉토에 방문 중임"
 gdp_visit_holding_decision_event.1340.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]에서의 휴식"
 gdp_visit_holding_decision_event.1340.desc: "상업의 세계는 피곤한 법이다. 제대로 쉬지 않고서는 거래를 검토하는 것도, 가식적인 미소를 짓는 것도 한계가 있다.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "이 찻집에서는 잠시나마 회사 걱정을 잊을 수 있다.\n\n갓 우려낸 따끈한 차를 천천히 음미하며 현지 단골들과 시시한 이야기부터 새로운 소식과 소문까지 나누는 것만으로도 한결 마음이 편안해진다."
 gdp_visit_holding_decision_event.1340.hashish: "이곳에서는 하시시를 즐기며 잠시나마 회사 걱정을 잊을 수 있다.\n\n시원하고 조용한 곳에 앉아 현지 단골들과 시시한 이야기부터 새로운 소식과 소문까지 나누는 것만으로도 한결 마음이 편안해진다."
 gdp_visit_holding_decision_event.1340.drink: "이 술집에서는 잠시나마 회사의 걱정을 잊을 수 있다.\n\n맛 좋은 [ROOT.Char.Custom('RegionalAlcoholicDrink')] 한 잔을 홀짝이며 현지 단골들과 시시한 이야기부터 새로운 소식과 소문까지 나누는 것만으로도 한결 마음이 편안해진다."
 gdp_visit_holding_decision_event.1340.food: "이 연회장에서는 잠시나마 회사 걱정을 잊을 수 있다.\n\n푸짐하게 차려진 음식 사이에서 [ROOT.Char.Custom('FavoriteTreat')](을)를 조금씩 집어 먹으며 현지 단골들과 시시한 이야기부터 새로운 소식과 소문까지 나누는 것만으로도 한결 마음이 편안해진다."
 gdp_visit_holding_decision_event.1340.bath: "이 목욕탕에서는 잠시나마 회사 걱정을 잊을 수 있다.\n\n물에 몸을 담그고 피로를 풀며 현지 단골들과 시시한 이야기부터 새로운 소식과 소문까지 나누는 것만으로도 한결 마음이 편안해진다."
 gdp_visit_holding_decision_event.1340.a: "이런 시간을 더 자주 가져야겠어."
