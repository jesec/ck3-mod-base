 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName](이)가 가까이 오라고 내게 손짓한다. [charlatan_recruit.GetSheHe]는 크게 손을 휘저으며 외친다.\n\n\"좋습니다... 지원자가 한 분 나왔군요! 이 동전이 어느 면으로 떨어질지 맞히면 후하게 보답해 드리겠습니다.\"\n\n[charlatan_recruit.GetSheHe]가 손목을 한 번 튕기자 동전이 감쪽같이 사라진다. 군중은 숨을 죽인 채 내가 어떻게 나올지 지켜보고 있다."
 gdp_visit_holding_decision_event.1321.a: "소매에 가짜 동전을 숨겨 둔 것이 #EMP 분명하다#!."
