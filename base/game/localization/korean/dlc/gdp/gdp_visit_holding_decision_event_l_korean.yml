 gdp_visit_holding_rare_recruit_court_position.partner: "당신의 [GetCourtPositionType('partner_court_position').GetName()](으)로서 [ROOT.Char.GetFirstNamePossessiveNoTooltip] [aptitude|E]은 [ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('partner_court_position') )]임"
 gdp_visit_holding_rare_recruit_court_position.translator: "당신의 [GetCourtPositionType('translator_court_position').GetName()](으)로서 [ROOT.Char.GetFirstNamePossessiveNoTooltip] [aptitude|E]은 [ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('translator_court_position') )]임"
 gdp_visit_holding_rare_recruit_court_position.fixer: "당신의 [GetCourtPositionType('fixer_court_position').GetName()](으)로서 [ROOT.Char.GetFirstNamePossessiveNoTooltip] [aptitude|E]은 [ROOT.Char.GetCourtPositionAptitude( GetCourtPositionType('fixer_court_position') )]임"
