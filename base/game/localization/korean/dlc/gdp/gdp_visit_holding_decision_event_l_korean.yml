 gdp_visit_holding_decision_confirm: "임무를 시작하지!"
 gdp_visit_holding_decision_desc: "기회는 찾는 자에게 찾아오는 법. [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]의 이 [ROOT.Char.Custom('LocalHoldingTypeConcept')]에는 아직 개척되지 않은 가능성이 가득하다! 새로운 고객과 계약, 그리고 사업 기회가 당신을 기다린다."
 gdp_visit_holding_decision_effect_intro: "다음 기회 획득 가능:"
