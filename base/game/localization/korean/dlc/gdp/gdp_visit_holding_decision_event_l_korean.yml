 gdp_visit_holding_decision_event.1300.t: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] 장터 방문"
 gdp_visit_holding_decision_event.1300.asia: "위대한 비단길을 따라 자리한 다른 시장들처럼, 이곳에도 옥과 비단, 차 같은 사치품이 풍부하게 넘쳐난다.\n\n붐비는 거리 한가운데에서는 어떤 남자가 섬세한 도자기 화병을 수레에서 조심스레 내리고 있다. 그 옆에서는 화려한 옷차림의 이국 상인이 물건을 사려는 듯 노점을 둘러보고 있다."
 gdp_visit_holding_decision_event.1300.mena_india: "화려한 직물과 무늬를 새긴 도자기가 다소 어두운 골목을 환하게 물들인다. 향과 향신료 냄새가 공기를 가득 채워 사람들을 반긴다.\n\n골목 한구석에서는 행상이 지나가던 사람에게 최고급 황동 접시를 사라고 필사적으로 설득하고 있다. 거래를 성사하기에 더없이 좋은 순간이다."
 gdp_visit_holding_decision_event.1300.default: "신선한 농산물 향이 점점 불어나는 인파의 열기와 뒤섞인다. 비좁은 광장에서는 행상들이 서로 목청을 높이며 손님을 끌어모은다.\n\n\"[ROOT.Char.Custom('RegionalDrink')|U]! 오늘만 특별 할인!\" \"[ROOT.Char.Custom('RegionalEdibleMeat')] 최고급 부위를 살 마지막 기회!\"\n\n"
 gdp_visit_holding_decision_event.monk_hint: "한 남자가 고개를 푹 숙인 채 근처 찻집에서 나오며 불길한 징조가 어쩌고 하며 중얼거린다. 아무래도 안에서 누군가 점을 쳐 주고 있는 모양이다."
 gdp_visit_holding_decision_event.monk_hint_return: "찻집은 이제 한결 조용해졌지만, 점을 쳐 주는 승려는 아직 떠나지 않았다."
 gdp_visit_holding_decision_event.caravaneer_hint: "비바람에 시달린 상단 행렬이 거리를 가득 메우고 있다. 현지 마구간은 최근 밀려든 교역 수요를 감당하느라 애를 먹고 있다."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "상단은 아직 떠나지 않았다. 몰이꾼도 여전히 동물들 사이에서 기다리고 있다."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\n아주 노련한 선장이 오늘 자기 배에 승객을 태우고 있다는 소문이 돈다."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\n선장은 여전히 승객을 태우고 있고, 배 주변에 모인 사람들도 좀처럼 줄어들지 않는다."
 gdp_visit_holding_decision_event.carnival_jester_hint: "한 동료 상인이 거리 공연자 때문에 평소 찾아오던 손님들의 관심을 빼앗겼다며 불평하는 소리가 저절로 귀에 들어온다."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "거리 공연자는 여전히 사람들의 시선을 사로잡고 있고, 주변 상인들은 여전히 못마땅한 표정이다."
 gdp_visit_holding_decision_event.cook_hint: "많은 사람이 [ROOT.Char.Custom('FavoriteTreat')](을)를 손에 들고 돌아다니는 모습이 보인다. 그중 한 사람이 제빵사가 물건을 공짜로 나눠 주고 있다고 하는 말이 들린다."
 gdp_visit_holding_decision_event.cook_hint_return: "제빵사는 아직 좌판을 닫지 않았다."
 gdp_visit_holding_decision_event.1300.desc.fallback: "동전과 물건이 쉴 새 없이 오간다. 이 시장은 기회로 가득하다."
 gdp_visit_holding_decision_event.1300.a: "이국 무역상들은 어떤 소식을 가져왔을까?"
 gdp_visit_holding_decision_event.1300.a.tt: "무역상 대화 엿듣기가 다음 기회 제공 가능:$gdp_visit_holding_decision_effect_contracts$ "
