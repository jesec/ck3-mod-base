 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$: 기회 모색"
 gdp_visit_holding_decision_event.1310.desc: "최근 들어 이국의 짐승과 보물에 관한 이야기를 자주 듣게 되었다. 오늘은 시장을 샅샅이 뒤져 그 소문에 대해 더 잘 아는 사람을 찾아볼 생각이다.\n\n무역상 사이에서 낯선 억양을 쓰는 어떤 [foreigner.GetWomanMan]이 시큰둥한 표정의 현지 상인에게 먼 이국에서의 모험담을 자랑스럽게 늘어놓는 모습이 눈에 띈다. 물론 허풍쟁이일 수도 있지만, 어쩌면 [foreigner.GetHerHis] 이야기에 진실이 담겨 있을지도 모른다. 금화를 조금 쥐여 주면 더 많은 이야기를 들을 수 있을까..."
