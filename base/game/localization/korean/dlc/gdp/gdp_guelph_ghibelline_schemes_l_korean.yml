l_korean:
 #Side Switch Scheme
 gg_switch_sides: "변절 회유"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip](은)는 곧 이 상황에서 어느 입장이 #EMP 올바른#! 선택인지 깨닫게 될 것입니다..."
 gg_switch_sides_desc_general: "$gg_switch_sides$ [scheme|E]은 [scheme_target|E]이 [guelph_ghibelline_situation|E] [situation|E]에서 진영을 바꾸도록 설득하는 [political_scheme|E]입니다."
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.Custom('GetGuelphsGhibellinesConcept')]에 가담함"
 gg_switch_sides_invalidated_title: "@scheme_icon! $gg_switch_sides$ 모략 종료"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (모략)#!"
 gg_switch_sides_action: "회유"
 scheme_interaction_tt_gg_switch_sides: "[actor.Custom('GetGuelphsGhibellinesConcept')]에 가담하도록 [recipient.GetShortUINameNoTooltip]에게 회유를 시도함"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip](은)는 지난번에 당신이 [recipient.GetSheHe]에게 [actor.Custom('GetGuelphsGhibellinesConcept')]에 합류하라고 요구했을 때의 불쾌함을 잊지 않았음"
 #Claim Leadership Scheme
 gg_claim_leadership: "주도권 주장"
 gg_claim_leadership_desc: "[SCHEME.GetOwner.Custom('GetGuelphsGhibellines')](은)는 자신들의 지도자로 누가 가장 적합한지 곧 깨닫게 될 것입니다."
 gg_claim_leadership_desc_general: "$gg_claim_leadership$ [scheme|E]은 [guelph_ghibelline_situation|E] [situation|E]에서 [scheme_owner|E] 측 진영의 지도권을 차지하기 위한 [political_scheme|E]입니다. [diplomacy|E]에 기반한 [secret_scheme|E]으로, [agents|E]를 모집할 수 있습니다.\n\n현재 지도자에 비해 [scheme_owner|E]의 [gg_involvement|E]가 높을수록 [scheme_success_chance|E]이 증가합니다. 현재 지도자보다 [prestige_level|E]가 높아도 유리합니다."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U](이)가 [CHARACTER.Custom('GetGuelphsGhibellinesConcept')]의 새로운 지도자가 됨"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "[prestige|E] 손실 및 [TARGET_CHARACTER.GetShortUIName](와)과의 관계 악화를 피합니다"
 gg_claim_leadership_invalidated_title: "@scheme_icon! $gg_claim_leadership$ 모략 종료"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (모략)#!"
 gg_claim_leadership_action: "지도권 주장 대상"
 scheme_interaction_tt_gg_claim_leadership: "[recipient.GetShortUIName]에게서 [recipient.Custom('GetGuelphGhibellineConcept')] 지도권을 빼앗으려 시도함"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "중도파 포섭"
 gg_align_undecided_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip](은)는 [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')]에 공감하게 될 것입니다"
 gg_align_undecided_desc_general: "$gg_align_undecided$ [scheme|E]은 [scheme_target|E]이 [guelph_ghibelline_situation|E] [situation|E]에서 [scheme_owner|E]의 진영에 가담하도록 만드는 [political_scheme|E]입니다."
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.Custom('GetGuelphGhibellineConcept')](이)가 됨"
 gg_align_undecided_invalidated_title: "@scheme_icon! $gg_align_undecided$ 모략 종료"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (모략)#!"
 gg_align_undecided_action: "포섭"
 scheme_interaction_tt_gg_align_undecided: "[recipient.GetShortUIName](을)를 [actor.Custom('GetGuelphsGhibellinesConcept')] 진영에 포섭하려 시도함"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "영주 교체"
 gg_replace_ruler_desc: "[SCHEME.GetTargetCharacter.GetShortUINamePossessiveNoTooltip] 역할은 더 이상 필요하지 않습니다. [SCHEME.GetTargetCharacter.GetSheHe]는 조금 더... #EMP 이성적인#! 인물로 대체되어야 합니다."
 gg_replace_ruler_desc_general: "$gg_replace_ruler$ [scheme|E]은 [guelph_ghibelline_situation|E] [situation|E]에서 [scheme_target|E]을 [scheme_owner|E]의 진영에 충성하는 영주로 교체하는 것을 목표로 하는 [political_scheme|E]입니다."
 GG_REPLACE_RULER_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.Custom('GetGuelphGhibellineConcept')] 충성파로 대체됨"
 GG_REPLACE_RULER_DISCOVERY_DESC: "[prestige|E] 손실 및 [TARGET_CHARACTER.GetShortUIName](와)과의 관계 악화를 피합니다"
 gg_replace_ruler_invalidated_title: "@scheme_icon! $gg_replace_ruler$ 모략 종료"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (모략)#!"
 gg_replace_ruler_action: "교체"
 scheme_interaction_tt_gg_replace_ruler: "[recipient.GetShortUIName](을)를 [actor.Custom('GetGuelphGhibellineConcept')] 충성파로 교체하려 시도함"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip](은)는 지난번 교체 시도 이후 아직도 경계를 늦추지 않음"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "[GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] [situation_phase_phase|E] 동안에는 [GetSituation('guelph_ghibelline').GetName]의 지도자를 교체할 수 없음"
 #Invalidation
 scheme_gg_situation_ended: "[guelph_ghibelline_situation|E] 종료"
 scheme_owner_not_aligned: "당신은 더 이상 [guelph|E] 또는 [ghibelline|E]이 아님"
 scheme_target_not_aligned: "[target.GetShortUIName](은)는 더 이상 [guelph|E] 또는 [ghibelline|E]이 아님"
 scheme_target_not_undecided: "[target.GetShortUIName](은)는 더 이상 [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'undecided' ).GetName] 상태가 아님"
