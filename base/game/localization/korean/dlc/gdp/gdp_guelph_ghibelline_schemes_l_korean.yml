 scheme_target_might_get_reinstated: "[target.GetShortUIName](은)는 [GetCasusBelliType('reinstate_guelph_ghibelline_ruler_cb').GetName|V] [war|E]의 주요 방어자임"
 scheme_owner_is_already_leader: "당신은 이미 [owner.Custom('GetGuelphsGhibellinesConcept')]의 지도자임"
