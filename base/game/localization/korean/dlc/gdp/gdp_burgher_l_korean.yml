 gdp_burgher.0001.desc: "저희 [burgher_county.GetNameNoTier]의 [burgher_county.Custom('BurgherPluralNoun')]들에게 [burgher_county.Custom('BurgherDemandedPrivilege')](을)를 부여해 주실 것을 요구합니다. 그렇게 해 주시면 도시가 번성하며, 주군의 봉역에 더 큰 부를 안길 것입니다."
 gdp_burgher.0001.a: "합리적인 요청이군. 내 인장을 찍어라."
 gdp_burgher.0001.b: "거절한다!"
 gdp_burgher.0001.opening: "우리의 [ROOT.Char.Custom('LadyLordWomanMan')]에게,"
 gdp_burgher.0010.desc: "저희 [burgher_county.GetNameNoTierNoTooltip]의 [burgher_county.Custom('BurgherPluralNoun')]들에게 스스로 자치하고, 지도자를 선택하고, 저희의 이름으로 일을 진행할 수 있는 자유를 부여해 주시길 요청합니다. 권리를 부여해 주시지 않겠다면, 저희도 힘으로 쟁취하는 수밖에 없습니다."
 gdp_burgher.0010.a: "자유를 허락하라."
 gdp_burgher.0010.b: "그 잘난 #EMP \"권리\"#!를 두고 싸워 보라지."
 gdp_burgher.0020.t: "[freed_county.GetNameNoTierNoTooltip]의 자유"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier](은)는 자유를 얻어냈으며, 자치권과 정무관을 직접 임명할 특권도 획득하게 되었다.\n\n물론 그 모든 권리는 #EMP 내#! 지지가 없었다면 얻지 못했으리라."
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier](은)는 자유를 얻어냈으며, 자치권과 정무관을 직접 임명할 특권도 획득하게 되었다.\n\n물론 그 모든 권리는 #EMP 내#! 지지가 없었다면 얻지 못했으리라."
 gdp_burgher.0020.a: "집권자가 되는 부담을 기꺼이 받아들이겠다."
 gdp_burgher.0020.b: "그곳의 거물들 사이에 서겠다."
 gdp_burgher.0020.c: "저들의 호감이 많은 이득을 가져다줄 것이다."
 gdp_burgher_agitator_not_republic_head_tt: "당신이 #bold 아직#! [republic|E] 수장이 아니어야 함"
 gdp_burgher_agitator_outranks_republic_head_tt: "당신의 [title_tier|E]은 [burgher_ruler.GetTitledFirstName] 등급보다 낮아야 함"
 gdp_civic_agitation.0001.t: "불붙은 자유"
 gdp_civic_agitation.0001.desc: "모든 것이 제자리를 찾았다. [target.GetNameNoTier]의 사람들은 시민 자유를 향한 열렬한 열망을 불태웠으며, 내 공모자들은 이 불길을 부추겼다. 이들의 지도자는 시장 광장에서 부담스러운 세금과 불공정한 정무관들에 관해 열정적인 연설을 이어갔다.\n\n대표단이 자신들의 영주에게 가서 자치권을 요구할 준비를 하고 있다는 소식을 들었다. 이제 유일한 질문은, 과연 내가 그들과 함께할지다."
 gdp_civic_agitation.0001.a: "여기까지 왔으니 끝까지 가겠다."
 gdp_civic_agitation.0001.b: "저들은 내 비용으로 무장하고 말에 올라 몰려가야 한다."
 gdp_civic_agitation.0001.c: "군중이 자기들 생각이라 여기게 두자. 중요한 사람들은 이미 알고 있겠지."
 gdp_civic_agitation.0001.c.exposed: "상황을 받아들이고, 저들에게 더 이상 어떤 것도 약속하지 않는다."
 gdp_civic_agitation_sponsor_joins_war_tt: "[agitated_county.Custom('BurgherPluralNoun')]들의 영주가 거부한다면, 당신이 성민들과 함께 [war|E]에 참전하게 됨"
 gdp_civic_agitation_sponsor_war_chest_tt: "전쟁이 발생할 경우를 대비해 전문 병사 중대에 자금을 지원하게 됨"
 gdp_civic_agitation.0002.t: "잘못 쓴 돈"
 gdp_civic_agitation.0002.desc: "불만 사항이 목록으로 작성되어 [target.GetNameNoTier]의 사람들 앞에서 낭독되었고, 그 지도자들이 만났으나 #EMP 아무것도#! 하지 않았다.\n\n내 공모자들은 명백하게 드러난 사실 외에 무슨 일이 일어났는지 파악하지 못했다. 내 돈으로 저들한테 필요한 모든 것을 샀지만, 저들은 정작 산 것을 실제로 #EMP 활용할#! 용기가 없었던 모양이다."
 gdp_civic_agitation.0002.a: "이 비겁한 배신행위를 마음에 새겨두겠다."
 found_the_hanseatic_league_decision: "한자 동맹 수립"
 found_the_hanseatic_league_decision_tooltip: "[trade_league|E]의 [Concept( 'counties', '영지' )|E]들을 훨씬 더 강력한 상업 연맹체로 결속함"
 found_the_hanseatic_league_decision_confirm: "우리는 화합으로 번영한다"
 found_the_hanseatic_league_decision_desc: "왕들이 상상하는 권력은 왕관을 쓰고 검을 든 모습일 것이다. 하지만 우리는 사실이 다르다는 것을 안다. 권력은 모피를 두르고, 생선 냄새를 풍기며, 왕국을 파산시킬 수도 있는 금액이 기록된 장부를 들고 있다.\n\n혼자라면 우리는 세금을 내고, 약탈당하며, 위협받고 복종한다. 하지만 단결한다면 북쪽 바다에서는 우리와 맞설 수 있는 권력이 없다. 어떤 항만도 우리의 선박을 거부하지 못할 것이며, 그 어떤 외국 상인도 우리의 상품을 우리보다 더 싼 값에 팔지 못하고, 어떤 제후도 우리의 특권에 의문을 제기하려 들지 않을 것이다."
 found_the_hanseatic_league_cohesion_tt: "[trade_league|E] [cohesion|E]이 #V 95#! 이상이어야 함"
 found_the_hanseatic_league_members_tt: "[trade_league|E] 구성원이 #V 4#!명 이상이어야 함"
 found_the_hanseatic_league_message_title: "한자 탄생"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U](이)가 연맹을 선서로 맺어진 한자로 결속시켰습니다."
 league_needs_liege_consent_tt: "당신은 [vassal|E]으로서, 당신 [liege|E]의 동의 또는 자체적으로 참가할 수 있는 도시를 보유해야 함"
 gdp_hanseatic.0010.opening: "[the_league.GetName]에서,"
 gdp_hanseatic.0010.desc: "그대는 다른 누구도 아닌 그대의 이득을 위해, 그대의 이름으로 무역할 권리를 보유하고 있습니다.\n\n이러한 개인적인 합의는 우리를 약화시킵니다. 우리에게 그 권리를 넘겨주신다면 우리가 함께 더 큰 번영을 이룩할 수 있을 겁니다."
 gdp_hanseatic.0010.a: "[the_league.GetName]에게 권리를 넘기겠다."
 gdp_hanseatic.0010.b: "[hanse_city_title.GetNameNoTier]에 권리를 수여하겠다."
 gdp_hanseatic.0010.c: "이 권리는 내 것이며, #EMP 앞으로도 나만의 것이다#!."
