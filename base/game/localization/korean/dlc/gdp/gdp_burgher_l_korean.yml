 burgher_self_rule_free_city_tt: "새로운 [republic|E]가 [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|V]를 갖고 시작함"
 burgher_self_rule_chartered_city_tt: "새로운 [republic|E]가 [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|V]를 갖고 시작함"
 burgher_self_rule_new_capital_tt: "새로운 [republic|E]가 [burgher_new_capital.GetNameNoTier](을)를 [capital|E]로 삼음"
 BURGHER_WAR_NAME: "[ATTACKER.GetCulture.GetNameNoTooltip] 시민 봉기"
 burgher_war_victory_desc: "반란을 일으킨 모든 [Concept( 'county', '영지' )|E]는 자치 [republic|E]가 되며, [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|V]를 갖고 시작합니다. 필요한 경우 [capital|E]를 해당 [Concept( 'county', '영지' )|E]에서 가장 큰 도시로 이전합니다. 영지가 셋 이상이라면 #V $confederation_type_trade_league_name$#!을 형성하게 됩니다."
 burgher_war_victory_free_city_desc: "반란을 일으킨 모든 [Concept( 'county', '영지' )|E]는 자치 [republic|E]가 되며, [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|V]를 갖고 시작합니다. 필요한 경우 [capital|E]를 해당 [Concept( 'county', '영지' )|E]에서 가장 큰 도시로 이전합니다. 영지가 셋 이상이라면 #V $confederation_type_trade_league_name$#!을 형성하게 됩니다."
 burgher_war_white_peace_desc: "[faction|E]이 해산되며 주도 [Concept( 'county', '영지' )|E]는 약간의 시민 특권을 획득합니다. 이 영지들은 [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0]년 동안 다른 $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E]을 설립하지 않게 됩니다."
 burgher_war_defeat_desc: "[faction|E]이 해산되며, 반란을 일으킨 모든 [Concept( 'county', '영지' )|E]는 소유하고 있던 모든 시민 특권 및 [popular_opinion|E]을 상실합니다. 이 영지들은 [EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0]년 동안 다른 $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E]을 설립하지 않게 됩니다."
 burgher_war_ended_invalid.desc: "$BURGHER_WAR_CB_NAME$이 무효화되었습니다. 이제 $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E]에는 지도자가 없습니다!"
 civic_privileges_county_modifier: "시민 특권"
 civic_privileges_county_modifier_desc: "해당 영지는 약간의 시민 특권을 부여받았으나, 이 중에서 특허장에 명시된 특권은 없습니다."
 civic_privilege_market_rights_1_county_modifier: "제한된 시장 권리"
 civic_privilege_market_rights_1_county_modifier_desc: "해당 영지는 영주의 도량형 기준과 감독하에 시장을 열 권리를 부여받았습니다."
 civic_privilege_market_rights_2_county_modifier: "시장 권리"
 civic_privilege_market_rights_2_county_modifier_desc: "해당 영지는 자체적으로 시장을 열 권리와 저울을 부여받았으며, 무역에서 발생하는 이익도 상당 부분 차지합니다."
 civic_privilege_market_rights_3_county_modifier: "광범위한 시장 권리"
 civic_privilege_market_rights_3_county_modifier_desc: "해당 영지는 시장에 대한 거의 모든 통제권을 부여받았으며, 영주에게 돌아가는 무역 수익은 극히 일부에 불과합니다."
 civic_privilege_guild_rights_1_county_modifier: "제한된 조합 권리"
 civic_privilege_guild_rights_1_county_modifier_desc: "해당 영지의 공예가들은 단체를 조직할 권리를 부여받았으나, 조직의 장인들은 여전히 영주의 궁정에 복종해야 합니다."
 civic_privilege_guild_rights_2_county_modifier: "조합 권리"
 civic_privilege_guild_rights_2_county_modifier_desc: "해당 영지의 조합은 자체적인 기준을 정하고 장인을 선발할 권리를 부여받았습니다."
 civic_privilege_guild_rights_3_county_modifier: "광범위한 조합 권리"
 civic_privilege_guild_rights_3_county_modifier_desc: "해당 영지의 조합은 소속 장인과 생산 품목에 관해 거의 전적인 통제권을 부여받았습니다."
 civic_privilege_tax_exemption_1_county_modifier: "부분적인 시민 세금 면제"
 civic_privilege_tax_exemption_1_county_modifier_desc: "해당 영지의 도시는 영주에게 내야 하는 세금 일부를 면제받았습니다."
 civic_privilege_tax_exemption_2_county_modifier: "시민 세금 면제"
 civic_privilege_tax_exemption_2_county_modifier_desc: "해당 영지의 도시는 자체적으로 정한 세율에 따라 직접 세금을 징수할 권리를 부여받았습니다."
 civic_privilege_tax_exemption_3_county_modifier: "광범위한 시민 세금 면제"
 civic_privilege_tax_exemption_3_county_modifier_desc: "해당 영지의 도시는 세금 대부분을 면제받았으며, 명목상의 금액 외에는 거의 내지 않습니다."
 civic_privilege_militia_charter_1_county_modifier: "제한된 민병대 인가"
 civic_privilege_militia_charter_1_county_modifier_desc: "해당 영지의 도시는 자체 경비대를 운영할 권리를 부여받았으며, 이 경비대는 도시의 성벽 밖으로 나가서는 안 됩니다."
 civic_privilege_militia_charter_2_county_modifier: "민병대 인가"
 civic_privilege_militia_charter_2_county_modifier_desc: "해당 영지의 도시는 자체 민병대를 운영할 권리를 부여받았으며, 영주를 위해 행군하는 병력의 수는 더 줄었습니다."
 civic_privilege_militia_charter_3_county_modifier: "광범위한 민병대 인가"
 civic_privilege_militia_charter_3_county_modifier_desc: "해당 영지의 도시는 자체적으로 무장할 권리를 부여받았습니다. 영주를 위한 병력은 형식적이며 소수에 불과합니다."
 burgher_grievance_county_modifier: "시민 불만"
 burgher_grievance_county_modifier_desc: "해당 영지의 요구들이 거부당했으며, 영지의 사람들은 과거의 일을 그냥 넘길 생각이 없습니다."
 gdp_civic_agitation_county_modifier: "시민 선동"
 gdp_civic_agitation_county_modifier_desc: "해당 영지는 외부 세력의 개입으로 인해 영주에 맞서며 반감을 보입니다."
 gdp_civic_agitation_popular_republic_modifier: "대중의 목소리"
 gdp_civic_agitation_popular_republic_modifier_desc: "이 모략은 시민적 자유의 등불인 [GetLaw('republic_type_popular').GetName]의 수장에게 지지를 받고 있습니다."
 bestow_civic_liberties_interaction: "시민 자유 수여"
 bestow_civic_liberties_options_heading: "부여할 자유"
 bestow_civic_liberties_option_market_rights: "시장 권리"
 bestow_civic_liberties_option_guild_rights: "조합 권리"
 bestow_civic_liberties_option_tax_exemption: "세금 면제"
 bestow_civic_liberties_option_militia_charter: "민병대 인가"
 bestow_civic_liberties_interaction_desc: "당신의 [Concept( 'counties', '영지' )|E] 한 곳에 시민 특권을 부여하며 해당 영지의 [popular_opinion|E]을 높입니다"
 bestow_civic_liberties_no_charter_left_tt: "해당 [Concept( 'county', '영지' )|E]가 받을 수 있는 시민 특권이 남아 있어야 함"
 agitate_civic_unrest_interaction: "시민 소요 선동"
 agitate_civic_unrest_interaction_desc: "[recipient.GetShortUINamePossessiveNoTooltip] [Concept( 'counties', '영지' )|E] 중 한 곳을 선동해 자치를 요구하게 만들고, 거절당하는 경우 #V $BURGHER_WAR_CB_NAME$#! [casus_belli|E]으로 [war|E]을 시작하게 합니다"
 agitate_civic_unrest_eligible_tt: "해당 [Concept( 'county', '영지' )|E]를 상대로 #V $gdp_civic_agitation_scheme$#! [scheme|E]을 시작할 수 있어야 함"
 revoke_civic_liberties_interaction: "시민 자유 박탈"
 revoke_civic_liberties_interaction_desc: "높은 [popular_opinion|E] 비용을 감수하고 당신의 [Concept( 'counties', '영지' )|E] 한 곳에서 모든 시민 특권을 박탈합니다"
 revoke_civic_liberties_authority_tt: "당신의 [crown_authority|E]이 [GetLaw('crown_authority_1').GetName] 이상이어야 함"
 revoke_civic_liberties_no_privileges_tt: "해당 [Concept( 'county', '영지' )|E]에 박탈할 수 있는 시민 특권이 있어야 함"
 gdp_civic_agitation_scheme: "시민 소요 선동"
 gdp_civic_agitation_scheme_action: "다음 대상을 상대로 시민 소요 선동"
 gdp_civic_agitation_scheme_desc: "[SCHEME.GetTargetTitle.GetBaseNameNoTier]의 선한 사람들을 일깨워, 이들이 받아 마땅한 자치권을 요구하게 하겠다!"
 gdp_civic_agitation_scheme_desc_general: "$gdp_civic_agitation_scheme$은 [Concept( 'county', '영지' )|E]가 그 [ruler|E]에게 자치권을 요구하도록 선동하는 것이 목적인 [hostile_scheme|E]입니다. [intrigue|E]을 기반으로 하는 [secret_scheme|E]으로, [agents|E]를 모집할 수 있습니다.\n\n$gdp_civic_agitation_scheme$에 성공하면 대상 [Concept( 'county', '영지' )|E]가 $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E]을 결성합니다. 이 파벌은 요구가 거부될 경우 [war|E]을 일으킵니다.\n\n모든 [merchant|E]과 $republic_type_popular$ 수장은 선동을 실행할 수 있으며, 이들이 해방한 [republic|E]는 같은 유형을 채택합니다. 그 외 [republic|E] 수장은 [patrician_rating|E]가 [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V] 이상이어야 하며, 그 외 [republican|E] [house_heads|E]은 [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V] 이상이어야 합니다."
 gdp_civic_agitation_scheme_desc_success: "대상 [Concept( 'county', '영지' )|E]가 $FACTION_BURGHER_AUTONOMY_NAME$ [faction|E]을 설립하며 자치권을 요구함"
 gdp_civic_agitation_scheme_discovery_desc: "당신이 [Concept( 'county', '영지' )|E]를 선동한 사실이 드러나지 않음"
 gdp_civic_agitation_scheme_invalidated_title: "@scheme_icon! $gdp_civic_agitation_scheme$ 모략 종료"
 gdp_civic_agitation_scheme_invalidated_desc: "$gdp_civic_agitation_scheme$ [scheme|E]이 더 이상 유효하지 않습니다"
 SCHEME_TARGET_COUNTY_POPULAR_OPINION: "[popular_opinion|E]: $VALUE|+0=$"
 SCHEME_TARGET_COUNTY_PROSPERITY: "[county_prosperity|E]: $VALUE|+0=$"
 SCHEME_TARGET_COUNTY_CONTROL: "[county_control|E]: $VALUE|+0=$"
