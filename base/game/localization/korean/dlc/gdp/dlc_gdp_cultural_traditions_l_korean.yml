 tradition_silk_road_traders_name: "비단길 사업가"
 tradition_silk_road_traders_desc: "비단길은 동쪽과 서쪽 사이로 끊임없는 물류의 흐름을 이어줍니다. 비단, 차, 칠기, 비취를 비롯한 수많은 사치품이 긴 여정을 따라가며 이 지점에서 저 지점으로 전해집니다. 이러한 무역은 비단길을 따라 형성된 사회에 큰 영향을 미쳤습니다. 부유한 도시들은 장거리 무역에 직접 참여하거나, 그러한 무역에 종사하는 이들에게 상품을 판매합니다."
 tradition_monsoon_traders_name: "몬순 상인들"
 tradition_monsoon_traders_desc: "서쪽의 나쿠다에서 동쪽의 무역 조합과 신분 계급에 이르기까지. 인도양의 상인들은 대를 이어 후추, 면직물, 귀중한 상품 등을 시장으로 들여왔습니다."
