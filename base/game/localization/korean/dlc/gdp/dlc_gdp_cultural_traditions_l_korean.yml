l_korean:
 tradition_fortune_seekers_name: "타향에서 찾는 성공"
 tradition_fortune_seekers_desc: "이 문화는 빈손으로 고향을 떠나는 것을 수치스럽게 여기지 않으며, 물려받을 것이 거의 없는 이들이 타지로 나가 부를 찾기를 기대합니다. 그곳에서 이들은 수많은 길의 사정을 익히며, 모든 상품의 무게와 모든 대출의 조건도 배웁니다."
 culture_parameter_fortune_seekers_merchant_propensity: "해당 [culture|E]의 [characters|E]들이 높은 확률로 [merchants|E]이 됨"
