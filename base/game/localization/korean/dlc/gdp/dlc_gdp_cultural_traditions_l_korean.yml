 culture_parameter_saharan_merchant_domicile_buildings: "#V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#! 및 #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#! [domicile_buildings|E] 잠금 해제"
