 tradition_saharan_traders_name: "사하라 무역상"
 tradition_saharan_traders_desc: "사하라 사막은 장벽이 아니라 무역로이며, 사헬 지역과 서아프리카 내륙을 지중해 지역과 연결해 줍니다. 이는 오래전부터 전해져 내려온 진리입니다. 해당 문화는 이러한 교류에서 자신이 맡은 역할을 받아들였으며, 수많은 사람이 상단과 함께 이동하며 평생을 보냅니다."
 culture_parameter_oasis_villages_building_slot: "[GetTerrain( 'oasis' ).GetName]에서 #V [GetDistrictType('villages_district').GetName]#!, #V [GetDistrictType('religious_community_district').GetName]#!, #V [GetDistrictType('manor_houses_district').GetName]#! [districts|E]의 [building|E] 공간 #P +1#!"
