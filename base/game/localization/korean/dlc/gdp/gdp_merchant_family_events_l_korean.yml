l_korean:
 gdp_merchant_family.0001.t: "달아난 [house_member.Custom('GetBrideGroom')|U]"
 gdp_merchant_family.0001.desc: "어둠 속에서 비틀거리던 나는 [ROOT.Char.Custom2('RelationToMe', house_member)] [house_member.GetTitledFirstName](이)가 어느 [wedding_interest.GetWomanMan]과 함께 회사의 금고를 뒤지며, 숨죽인 목소리로 움직이라고 재촉하는 모습을 보았다.\n\n\"이게 다 뭐지?\" 내가 묻자 둘은 서로를 꽉 붙잡은 채 돌아보았다. 이방인인 줄 알았는데, 다름 아닌 [wedding_interest_house_head.GetTitledFirstNamePossessive] [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)](이)가 서 있었다.\n\n\"저희는 여기 더 머무를 생각 없습니다. 우리 가족들 사이의 악감정 때문에 계속 떨어져 지낼 수밖에 없으니, 떠나려고 합니다.\" [house_member.GetTitledFirstNameNoTooltip](이)가 말했다."
 gdp_merchant_family.0001.desc.stubborn_outro: "반항적으로 턱을 들고, [wedding_interest.GetTitledFirstNamePossessiveNoTooltip] 손을 꽉 잡고 있었다."
 gdp_merchant_family.0001.desc.fallback_outro: "괴로워하면서도 [wedding_interest.GetTitledFirstNamePossessiveNoTooltip] 손을 놓고, 내게 손을 뻗어 말 없는 간청을 하는 모습이었다."
 gdp_merchant_family.0001.a: "\"금화를 가지고 떠나라. 내가 축복하마.\""
 gdp_merchant_family.0001.b: "\"내가 뭘 해야 너희 둘을 머물게 할 수 있을까?\""
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName](이)가 당신에게 합류함"
 gdp_merchant_family.0001.b.failure: "[wedding_interest.GetFirstName](이)가 감명받지 않음"
 gdp_merchant_family.0001.c: "\"#EMP 아무데도#! 못 간다!\""
 gdp_merchant_family.0002.t: "물보다 진한"
 gdp_merchant_family.0002.desc_intro: "최근의 수익 보고를 검토하고 있었는데 [blood.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 성큼성큼 들어왔다. 누가 봐도 화가 난 얼굴이었다.\n\n\"이 [water.Custom('InsultAdjective')] [water.Custom('InsultNoun')] 자식이 선을 넘고 있습니다.\" [blood.GetSheHe]가 말했다. \"자꾸 위험을 감수하고, 선을 무시하면서 나머지 사람들을 전부 멍청이처럼 보이게 만듭니다. "
 gdp_merchant_family.0002.desc_adopted: "[ROOT.Char.GetHouse.GetName] 집안 사람이라고 보기 힘든 행동입니다.\""
 gdp_merchant_family.0002.desc_associate: "고작 회사의 사원 주제에 그렇게 행동해도 되는 겁니까?\""
 gdp_merchant_family.0002.desc_outro: "\n\n불평이 마침내 끝나자 나는 장부를 다시 바라보았다. 사실이 무엇이든, [water.GetFirstNameNoTooltip](은)는 수익을 창출하고 있으며 이는 분명한 성과였다."
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip](은)는 자기 위치를 깨달아야 한다."
 gdp_merchant_family.0002.a.unity_gain.desc: "사업 실적보다 가족의 혈연을 선택했음"
 gdp_merchant_family.0002.b: "[water.GetFirstNamePossessiveNoTooltip] 성과와 맞먹는 실적을 내고 나서 이야기하라."
 gdp_merchant_family.0002.b.unity_loss.desc: "가족의 혈연보다 사업 실적을 선택했음"
 gdp_merchant_family.0002.c: "\"이런 일에 신경 쓰기엔 너무 바빠서...\""
 gdp_merchant_family.0003.t: "치욕은 참지 않는다"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U](이)가 짜증 난 얼굴로 내게 다가왔다.\n\n\"제가 방금 무슨 말을 들었는지, 절대 못 믿으실 겁니다.\" [offended.GetSheHe]가 말했다. \"[offender.Custom2('MyCharacterIntroduction', ROOT.Char)](은)는 저를 모욕하고, 나아가 우리 집안을 모욕하는 게 재밌는 모양이더군요.\"\n\n사소하지만 의도적인 모욕이었다."
 gdp_merchant_family.0003.a: "[ROOT.Char.GetFaith.HighGodName] 집안이 반드시 사과하게 할 것이다!"
 gdp_merchant_family.0003.a.unity_gain.desc: "공개적인 모욕에 맞서 단결된 모습을 보임"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U](이)가 공개적으로 [target_char.GetShortUINamePossessive] 집안을 모욕했음"
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U], 저들이 말하지 않은 사실에 집중해라..."
 gdp_merchant_family.0003.b.unity_loss.desc: "모욕을 똑같이 맞받아치는 것을 거부했음"
 gdp_merchant_family.0003.c: "알아서 해결해라. 나는 할 일이 있어서."
 gdp_merchant_family.0003.c.unity_loss.desc: "우리 집안을 향한 모욕을 무시했음"
 gdp_merchant_family.0004.t: "상서로운 제안"
 gdp_merchant_family.0004.desc: "느긋하게 산책하던 중, 뜰 저편에서 낯선 목소리가 나를 불렀다. \"[ROOT.Char.Custom('FormOfAddressForLiege')], 드릴 말씀이 있습니다.\" [offer_2.GetFullName](이)가 내 앞에 서서 꿀을 바른 듯 달콤한 목소리로 말했다.\n\n\"[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U]께서 제안을 보내셨습니다. 제가 [offer.Custom2('YourCharacterIntroduction', ROOT.Char)]하고 결혼한다면 우리 두 집안 사이의 유대가 돈독해지게 됩니다.\" 나는 방금 들은 제안을 고려하느라 숨 쉬는 것을 잠시 잊고 말았다.\n\n\"그래서, [ROOT.Char.Custom('FormOfAddressForLiege')]께서는 어떻게 생각하시는지요?\""
 gdp_merchant_family.0004.a: "\"내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))]도 영광으로 여기겠군.\""
 gdp_merchant_family.0004.b: "\"상호 이득이 되는 거래는 어떻겠나?\""
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[target_char.GetShortUIName|U](와)과 [target_char.GetShortUINamePossessive] 상호 이득이 되는 거래가 체결됨"
 gdp_merchant_family.0004.c: "\"아쉽지만 거절해야겠군. 하지만 얼마든지 머무르다 가시오.\""
 gdp_merchant_family.0005.t: "[ROOT.Char.GetHouse.GetNameNoTooltip]의 수치"
 gdp_merchant_family.0005.desc: "소문에 따르면 [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 자신이 담당하고 있던 중요한 운송을 잘못 처리했으며, 이를 해결하지 않으면 우리의 평판이 크게 깎일 상황이었다. 나는 [wayward.GetHerHim]를 내 방으로 불러 이 일을 물어보기로 했다.\n\n\"정말로 죄송합니다, [wayward.Custom2('RelationToMe', ROOT.Char)]. 하지만 이 작은 사고 때문에 저를 탓하시면 안 됩니다. 제 혈육이, 우리 집안이 제 능력을 깎아내리려 하고 있습니다!\""
 gdp_merchant_family.0005.a: "\"이 망할 [wayward.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))]!\""
 gdp_merchant_family.0005.a.unity_loss.desc: "집안 구성원을 공개적으로 비난했음"
 gdp_merchant_family.0005.b: "\"우린 언제나 하나다.\""
 gdp_merchant_family.0005.b.unity_gain.desc: "함께 역경에 맞서기로 선택했음"
 gdp_merchant_family.0005.c: "\"해결해라.\""
 gdp_merchant_family.0010.t: "기울어지는 저울"
 gdp_merchant_family.0010.desc: "#EMP 쾅#! 소리와 함께 상자가 바닥에 부딪혔다. 평소와 다름없이 흘러가던 [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] 활동이 멈추었다. 돌아보니 내 사원들인 [attacker.GetTitledFirstName](와)과 [defender.GetTitledFirstName](이)가 서로 주먹다짐하기 일보 직전이었다.\n\n\"저는 이 가문을 위해 죽도록 일하고 있는데.\" [attacker.GetTitledFirstNameNoTooltip](이)가 [attacker.Custom('quirk_neg_present')]. 그 눈에는 광기가 번쩍이고 있었다. \"이 하찮은 인간은 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]에서 빈둥대고 있지 않습니까. 이 자식한테 제대로 본때를 보여줘야겠습니다. 어디 막아 보십시오.\""
 gdp_merchant_family.0010.a: "내 사원이라면 이딴 식으로 행동해선 안 되지."
 gdp_merchant_family.0010.a.tt.success: "갈등을 중재하는 데 성공함"
 gdp_merchant_family.0010.a.tt.failure: "갈등을 중재하는 데 실패함"
 gdp_merchant_family.0010.b: "어디 해 봐라. 우리가 분쟁을 어떻게 해결하는지 보여주도록."
 gdp_merchant_family.0010.c: "[defender.GetTitledFirstNameNoTooltip]한테 손이라도 대면 후회하게 될 거다!"
 gdp_merchant_family.0010.d: "마음대로 해라."
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial [attacker.GetShortUIName](와)과 [defender.GetShortUIName](이)가 서로를 상대로 [prowess_i][prowess|E] 및 [martial_i][martial|E] 결투를 시작하게 됨! 누군가가 다칠 것임#!"
 merchant_unity_fight_stopped: "회사 구성원 사이의 싸움을 막았음"
 merchant_unity_fight_promoted: "회사 구성원 사이의 싸움을 부추겼음"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip](이)가 승리함"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U]가 [defender.GetFirstName]에게 상처를 입힘"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip](이)가 승리함"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.GetSheHe|U]가 정당방위로 [attacker.GetFirstName]에게 상처를 입힘"
 gdp_merchant_family.0015.t: "사업상의 막역한 벗"
 gdp_merchant_family.0015.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]의 [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l]에는 익숙한 얼굴이 많지만, 그중에서 [tip_giver.GetShortUIName](이)가 눈을 마주치며 나를 따로 불러냈다. [tip_giver.GetSheHe]가 음흉한 미소를 지으며 장부를 건네주었다.\n\n\"아, [ROOT.Char.GetTitledFirstName]. 마침 그대 같은 사람을 찾고 있었는데! 제가 최근에 느낀 통찰을 얘기해 드리겠습니다. 앞으로도 계속 협력할 우리 사이를 위한 선물로 생각해 주시지요.\""
 gdp_merchant_family.0015.a: "\"함께라면 상당한 수익을 낼 수 있을 거요!\""
 gdp_merchant_family.0015.b: "\"내가 이걸 구매하도록 하지.\""
 gdp_merchant_family.0015.b.artifact: "내부자의 장부"
 gdp_merchant_family.0015.b.artifact.desc: "잘 숨겨둔 서책입니다. 시장의 수익, 이윤 폭, 유용한 거래처에 관한 내용이 담겨 있습니다."
 gdp_merchant_family.0015.c: "\"#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#!(이)가 이 일로 이득을 보겠군...\""
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U](와)과 [target_char.GetShortUIName](이)가 유익한 요령을 교환함"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U](이)가 [target_char.GetShortUINamePossessive] 요령을 [target_char.GetHerHim]를 상대로 사용함"
 gdp_merchant_family.0020.t: "재능 교환"
 gdp_merchant_family.0020.desc: "내 사업 접선책인 [house_friend.Custom('MistressMaster')|U] [house_friend.GetFirstName](이)가 늘 하던 회의에 늦어지고 있었다. [house_friend.GetSheHe]가 마침내 도착했는데, 뜻밖의 손님이 함께 있었다.\n\n\"이쪽은 제 [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))] [nepo_hire.GetFirstName]입니다. "
 gdp_merchant_family.0020.desc.diplomacy: "능숙한 외교관이지요. "
 gdp_merchant_family.0020.desc.martial: "완고한 전략가지요. "
 gdp_merchant_family.0020.desc.stewardship: "장부의 달인이지요. "
 gdp_merchant_family.0020.desc.intrigue: "영리한 [nepo_hire.GetWomanMan]이지요. "
 gdp_merchant_family.0020.desc.learning: "학식 있는 [nepo_hire.GetWomanMan]이지요. "
 gdp_merchant_family.0020.desc.outro: "[ROOT.Char.GetPrimaryTitle.GetName]에서 그대의 지도를 받는다면, 그 재능을 꽃피울 수 있는 인재입니다.\""
 gdp_merchant_family.0020.a: "\"[nepo_hire.GetFirstNameNoTooltip|U](을)를 환영하겠소.\""
 gdp_merchant_family.0020.a.unity_loss.desc: "호의를 베풀어 사원 직위를 내어줌"
 gdp_merchant_family.0020.b: "\"안타깝지만 빈자리가 없군.\""
 gdp_merchant_family.0020.b.unity_gain.desc: "외부인 고용을 거절함"
 gdp_merchant_family.0020.c: "\"이런 제안이라니, 나를 모욕하는군.\""
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U](이)가 [target_char.GetShortUINamePossessive] 친족을 자신의 회사에 받아들임"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U](이)가 [target_char.GetShortUINamePossessive] 친족을 거절함"
 gdp_merchant_family.0025.t: "사적인 감정 없이"
 gdp_merchant_family.0025.desc: "끝도 없이 이어지던 거래 계약서 더미의 마지막 서류에 서명하자 손목이 아파졌다. 오늘 밤의 일은 이만 마치려던 순간, [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 다가왔다. [leaving_associate.GetSheHe]는 초조한 듯 머뭇거리며 작은 양피지를 꺼내 들고 그 내용을 읽기 시작했다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], 죄송하지만 제가 [rival_poacher.GetPrimaryTitle.GetName]에서 도저히 거절할 수 없는 제안을 받았음을 알려드립니다. 개인적인 감정이 있어서 이러는 건 아니고, 그냥 좋은 사업 기회라서 이러는 겁니다.\""
 gdp_merchant_family.0025.a: "\"가거라. 내가 축복하마.\""
 gdp_merchant_family.0025.b: "\"그대 자리는 여기다. 우리와 함께해야지.\""
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U](이)가 [company|E]와 함께함"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip](이)가 머무르기로 함"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip](이)가 상관하지 않고 떠남"
 gdp_merchant_family.0025.c: "\"내게 빚을 진 거다. 명심하도록.\""
 gdp_merchant_family.0025.d: "\"좋다, 떠나라.\""
 gdp_merchant_family.0025.d.rival: "\"[rival_poacher.GetTitledFirstNameNoTooltip], 날 거슬렀던 날을 후회하게 될 거다!\""
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U](이)가 [CHARACTER.GetShortUIName]에게서 [associate|E]을 빼냄"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U](이)가 선의로 자기 [associate|E]을 [target_char.GetShortUINamePossessive] 회사에 내어줌"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U](이)가 [char.GetHouse.GetName]에게서 [associate|E]을 빼냄"
 gdp_merchant_family.0030.t: "사업이냐 쾌락이냐?"
 gdp_merchant_family.0030.desc: "나의 두 사원인 [house_member.GetTitledFirstName](와)과 [associate.GetTitledFirstName](이)가 #EMP 상당히 긴#! 식사 외출을 마친 뒤 [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] 사무실로 돌아왔는데, [ROOT.Char.Custom('RegionalAlcoholicDrink')] 한 병을 가져왔다.\n\n\"...그래서 내가 이랬지, 그 고양이는 돼지우리에 있어야 한다고!\" [house_member.GetTitledFirstNameNoTooltip]의 이야기에 [associate.GetTitledFirstNameNoTooltip](이)가 배를 잡고 웃었다.\n\n내가 나서지 않는다면, 이 두 사람은 하루 종일 생산적인 일이라고는 하나도 하지 못할 듯하다."
 gdp_merchant_family.0030.a: "\"제대로 된 술을 가져오도록 하지.\""
 gdp_merchant_family.0030.a.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l](은)는 최고만을 누려야 하는 법"
 gdp_merchant_family.0030.b: "\"배은망덕한 인간들 같으니, 일이나 해라!\""
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]에 게으름뱅이는 용납 못 함"
 gdp_merchant_family.0030.c: "이 우정이 어디로 이어지는지 두고 볼까."
 merchant_unity_breaks_encouraged: "시장에서 구할 수 있는 최고의 술만 마심"
 merchant_unity_breaks_discouraged: "업무 중 휴식을 막음"
 gdp_merchant_family.9000.t: "젊은 [ROOT.Char.GetHouse.GetNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip]"
 gdp_merchant_family.9000.desc: "나는 드디어 어엿한 [ROOT.Char.GetWomanMan]이 되었으며, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]의 정당한 [ROOT.Char.GetTitleAsNameNoTooltip|l](이)가 될 수 있을 만큼 나이를 먹었다. 이제 내 [ROOT.Char.Custom2('RelationToMeShort', predecessor)] [predecessor.GetFirstName](이)가 남긴 빈자리를 채워야 한다.\n\n사원들은 내가 회사를 이끌고, 상업의 세계에서 새로운 길과 기회를 찾아오기를 기대하고 있다. 나는 저들의 경험과 지혜에 의지해야 한다고 들었는데 말이다..."
 gdp_merchant_family.9000.a: "[educator.GetTitledFirstNamePossessiveNoTooltip] 인도가 유용하겠군."
 gdp_merchant_family.9000.b: "어디서부터 시작해야 할까..."
 gdp_merchant_family.9000.route_hint_tt: "이제 [distribution_routes|E]를 만들고 조정할 수 있음"
 gdp_merchant_family.9010.t: "상실에 빠진 회사"
 gdp_merchant_family.9010.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', previous_holder)] [previous_holder.GetFirstName](이)가 우리를 떠났다. [previous_holder.GetSheHe|U]는 회사의 존경받는 주인이었다. 이제 우리의 회당에는 웃음도 없고, 사무실에서는 열띤 토론도 벌어지지 않으며, 모두의 얼굴에 걱정이 가득하다.\n\n"
 gdp_merchant_family.9010.interim_generated: "모두가 [interim.GetFirstName](이)라는 [interim.GetWomanMan]에게 기대를 건다. 일 관리를 도와달라는 요청을 받고 온 인물이었다."
 gdp_merchant_family.9010.interim_relation: "모두가 내 [ROOT.Char.Custom2('RelationToMeShort', interim)] [interim.GetFirstName]에게 기대를 건다."
 gdp_merchant_family.9010.interim: "모두가 [ROOT.Char.Custom2('RelationToMePossessive', previous_holder)] 믿음직스러운 사원인 [interim.GetFirstName]에게 기대를 건다"
 gdp_merchant_family.9010.close: "이 사람이 [previous_holder.GetFirstNamePossessiveNoTooltip] 부재 동안 필요한 준비를 마쳤으며, 내가 경영을 맡을 수 있을 만큼 나이를 먹을 때까지 일상의 업무를 처리해 줄 것이다."
 gdp_merchant_family.9010.a: "상황이 참 빠르게 변하는군."
 gdp_merchant_family.9110.t: "무역의 기술"
 gdp_merchant_family.9110.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', trader)] [trader.GetFirstName](은)는 회사에서 가장 경험 많은 상인 중 한 명이며, 사무실에 있을 때가 거의 없다.\n\n[trader.GetSheHe|U]는 [route.GetName|l](을)를 관리하며, 마지막 [good.Custom('GetTradeGoodUnit')] 하나까지 판매자에게서 구매자에게로 안전히 전달되는지 확인하고, 그 과정에서 우리의 지갑을 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')](으)로 두둑하게 채운다.\n\n\"좋은 무역상은 동시에 여러 곳에 있을 줄 압니다.\" [trader.GetSheHe|U]가 미소를 지었다. \"[ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')]의 모든 가판대 주인, 그들의 고민은 물론 모든 마을과 상단 경비대의 사정까지 잘 아는 법이지요!\""
 gdp_merchant_family.9110.a: "내가 책임자가 되면 [trader.GetNameNoTooltip]처럼 되어야지."
 gdp_merchant_family.9110.b: "\"상단 이야기를 해 주세요!\""
 gdp_merchant_family.9110.b.tt: "성년이 되면 당신이 #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!에서 #V 10#! [trait_level_track_xp|E]를 획득하게 됨"
 gdp_merchant_family.9110.c: "\"저도 [good.Custom('GetTradeGood')] 무역상이 되고 싶어요!\""
 gdp_merchant_family.9110.c.tt: "성년이 되면 [merchant.GetPrimaryTitle.GetDefinitiveName|l](이)가 #V 450#! [category.GetNameWithIcon] [trade_expertise|E]을 획득하게 됨"
 gdp_merchant_family.9130.t: "젊은이의 야망"
 gdp_merchant_family.9130.desc: "회사의 일상적인 업무를 지켜보며 많은 것을 배웠고, 사원들 또한 나의 이해를 돕고자 나를 참여시키려 최선을 다해 노력하고 있다."
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName](은)는 드넓은 곳에서 무역하며, 그 장부에는 발음도 어렵고 [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]에서 멀리 있는 장소들이 가득하다. 이곳들이 어디인지는 짐작만 할 수 있을 따름이다."
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName](은)는 희귀하고 품질 좋은 물품을 조달하고, [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip] 장인들을 후견하는 것으로 유명하다."
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName](은)는 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')](을)를 거래해 호의를 사며, 그 장부는 [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]의 불운한 이와 도박꾼의 이름으로 가득하다."
 gdp_merchant_family.9130.fallback: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName](은)는 자리가 잘 잡혀 있으나, 특별히 유명한 것은 없다. 그저 [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]의 무역 가문 중 하나로, 동시에 여러 가지 사업에 손을 대고 있다."
 gdp_merchant_family.9130.a: "얼른 우리 회사를 이끄는 조타수가 되고 싶군."
 gdp_merchant_family.9130.a.caravaneer: "우리는 앞으로 더 멀리 나아가리라."
 gdp_merchant_family.9130.a.artisan: "우리 이름이 곧 품질의 보증이지."
 gdp_merchant_family.9130.a.creditor: "신용 거래가 우리 사업이다."
 gdp_merchant_family.9130.a.tt: "성년이 되면 당신이 #emp $trait_track_caravaneer$#!, #emp $trait_track_artisan$#!, #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!에서 각각 #V 5#! [trait_level_track_xp|E]를 획득하게 됨"
 gdp_merchant_family.9130.b: "드넓은 세상은 가능성으로 가득하다."
 gdp_merchant_family.9130.b.tt: "성년이 되면 당신이 #P 비용 소모 없이#! [GetLaw('company_purpose_caravaneer').GetName] [company_purpose|E]을 채택하며 #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!에서 #V 20#! [trait_level_track_xp|E]를 획득하게 됨"
 gdp_merchant_family.9130.c: "예쁜 장신구에 많은 돈이 쓰이지."
 gdp_merchant_family.9130.c.tt: "성년이 되면 당신이 #P 비용 소모 없이#! [GetLaw('company_purpose_artisan').GetName] [company_purpose|E]을 채택하며 #emp $trait_track_artisan$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!에서 #V 20#! [trait_level_track_xp|E]를 획득하게 됨"
 gdp_merchant_family.9130.d: "진정한 권력과 부는 영향력에 있는 법."
 gdp_merchant_family.9130.d.tt: "성년이 되면 당신이 #P 비용 소모 없이#! [GetLaw('company_purpose_creditor').GetName] [company_purpose|E]을 채택하며 #emp $trait_track_creditor$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#!에서 #V 20#! [trait_level_track_xp|E]를 획득하게 됨"
 company_purpose_child_blocker_tt: "당신이 [child|E]임"
 gdp_merchant_family.9140.t: "시장의 먹잇감"
 gdp_merchant_family.9140.desc: "나는 [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]의 답답한 사무실에서 [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]에 부를 안겨다 주는 무역로를 배웠고, 어느 무역로를 통해 돈을 벌려고 노력하고 있는지도 배웠다. 기억해야 할 장소와 상품이 너무도 많다.\n\n[associate.GetFirstName](이)가 탁자를 [ROOT.Char.Custom('WritingInstrument')](으)로 톡톡 두드리며 나를 공상에서 일깨웠다. \"집중하십시오! 사업에 관해 제대로 배우지 않으면 [ROOT.Char.GetTitleAsNameNoTooltip] 노릇도 못 합니다!\""
 gdp_merchant_family.9140.a: "\"[category_1.Custom('GetTradeGoodCategory')] 무역에 관해 알려주십시오.\""
 gdp_merchant_family.9140.a.tt: "성년이 되면 [merchant.GetPrimaryTitle.GetDefinitiveName|l](이)가 #V 450#! [category_1.GetNameWithIcon] [trade_expertise|E]을 획득하게 됨"
 gdp_merchant_family.9140.b: "\"[category_2.Custom('GetTradeGoodCategory')] 거래가 재미있을 것 같군요.\""
 gdp_merchant_family.9140.b.tt: "성년이 되면 [merchant.GetPrimaryTitle.GetDefinitiveName|l](이)가 #V 450#! [category_2.GetNameWithIcon] [trade_expertise|E]을 획득하게 됨"
 gdp_merchant_family.9140.c: "\"[category_3.Custom('GetTradeGoodCategory')] 유통에 관해 배우고 싶습니다.\""
 gdp_merchant_family.9140.c.tt: "성년이 되면 [merchant.GetPrimaryTitle.GetDefinitiveName|l](이)가 #V 450#! [category_3.GetNameWithIcon] [trade_expertise|E]을 획득하게 됨"
 gdp_merchant_family.9150.t: "심복"
 gdp_merchant_family.9150.desc: "나는 성년이 되기를 기다리며 하루 대부분을 회사 동업자 [partner.GetFirstName](을)를 수행하며 보냈다. [partner.GetHerHis] 거래와 회의를 따라다니며 배울 수 있는 것은 뭐든 배웠다.\n\n장부를 가지고 씨름하며 힘든 시간을 보낸 어느 날, [partner.GetSheHe|U]가 나를 돌아보았다. \"잘하고 계십니다, 어린 [ROOT.Char.GetTitleAsNameNoTooltip].\" [partner.GetSheHe]가 씩 웃으며 내게 동전을 튕겨 보냈다. \"사업은 쉬운 일이 아니지요. 하지만 [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')] [ROOT.Char.GetSuzerain.GetTitleAsName](와)과는 달리, 우릴 지탱해 주는 건 오로지 우리 노력뿐입니다.\""
 gdp_merchant_family.9150.a: "\"당신이나 우리 회사에 실망을 안기는 일은 없을 겁니다.\""
 gdp_merchant_family.9150.b: "\"[partner.GetFirstNameNoTooltip], 당신은 노력한 만큼 누릴 자격이 있습니다.\""
 gdp_merchant_family.9150.b.tt: "다음 #V 10#!년 동안 [partner.GetShortUINamePossessive] [GetCourtPositionType( 'partner_court_position' ).GetName()] [aptitude|E]: #p +1#!"
 gdp_merchant_family.9150.c: "\"하지만 [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip](이)가 없으면 우린 지금쯤 어떻게 됐을까요?\""
 gdp_merchant_family.9150.c.tt: "성년이 되면 당신이 #V 10#!년 동안 [GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip] [modifier|E]를 획득하게 됨"
 merchant_childhood_suzerain_modifier: "후견자의 아첨가"
 merchant_childhood_suzerain_modifier_desc: "해당 인물은 가장 큰 힘을 지닌 인물과 좋은 관계를 유지하는 일이 중요하다는 사실을 이해합니다."
 merchant_childhood_desc: "상인 아동기"
