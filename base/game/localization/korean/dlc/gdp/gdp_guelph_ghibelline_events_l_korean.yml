l_korean:
 guelphs_ghibellines_prefix: "구엘프와 기벨린:"
 gdp_guelph_ghibelline.0500.t: "구엘프와 기벨린"
 gdp_guelph_ghibelline.0500.intro.all: "수상한 시선. 멸시하는 코웃음... 한때는 유대가 돈독하던 이탈리아 북부 공동체에 [pope_scope.GetTitledFirstName](와)과 [ghibelline_leader.GetTitledFirstName] 사이의 갈등으로 균열이 생겼고, 이 틈이 점점 커지는 중이다.\n\n제국주의와 보호를 이유로 [ghibelline_leader.GetTitleAsNameNoTooltip]의 기벨린을 지지하는 이들은 교황청의 구엘프를 지지하며 독립성의 향상을 추구하는 이들과 맞서고 있다."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "수상한 시선. 멸시하는 코웃음... 한때는 유대가 돈독하던 이탈리아 북부 공동체에 배교자 [ghibelline_leader.GetTitleAsName](와)과 내 독실한 관료들 사이의 터무니없는 갈등으로 균열이 생겼고, 불행히도 이 틈이 점점 커지는 중이다.\n\n안전과 보호를 이유로 제국주의적인 기벨린을 지지하는 이들은 신을 경외하는 나의 구엘프 지지자들과 맞서고 있다. 내 지지자들은 그저 이 폭군 앞에서 자신들의 주권을 지키고자 할 뿐이다.\n\n함께라면 [ghibelline_leader.GetTitleAsNameNoTooltip]의 고집을 꺾고 이성적으로 판단하게 할 수 있다. 내 [ROOT.Char.Custom('GetHighestSkillAdjective')] 능력을 활용할 때가 왔다."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "수상한 시선. 멸시하는 코웃음... 한때는 유대가 돈독하던 이탈리아 북부 공동체에 교황청의 멍청이들과 나 사이의 갈등으로 균열이 생겼다고들 하고, 이 틈이 점점 커지는 중이다.\n\n안전과 보호를 이유로 기벨린을 지지하는 #EMP 나의#! 사람들은 교황령의 순진하기 짝이 없는 구엘프를 지지하며 불안과 허약한 독립을 추구하는 이들과 맞서고 있다.\n\n[ghibelline_leader.GetTitleAsNameNoTooltip]인 나는 저 교회의 구엘프 참견꾼들을 경계하게 되었다. 저들은 오래도록 내 권위를 끌어내려 왔으나, 이제는 어떻게든 순응해야 할 것이다..."
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\n우리는 축복을 받았다. 순종적인 지도자 [guelph_leader.GetFirstNameNoTooltip](이)가 우리의 목소리가 되어, 제국주의 압제자에 맞서 투쟁할 것이다. 나 또한 내 역할을 다할 것이고."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\n나는 우리의 [ghibelline_leader.GetTitleAsNameNoTooltip](이)가 우리에게 해를 끼치려는 이들에 맞서 우리의 백성과 봉역을 지켜낼 유일한 인물이라 믿는다. 답례로 나 또한 [ghibelline_leader.GetHerHis] 기벨린을 전폭적으로 지지하리라."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\n아직 내가 충성을 바칠 곳을 정하지 못했으니, 다투고 있는 양쪽을 신중히 저울질해야 한다. 그래야 [ROOT.Char.GetHouse.GetBaseName] 집안에 최선인 쪽으로 행동할 수 있을 테니까."
 gdp_guelph_ghibelline.0500.a: "나아가자!"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "그대가 이 성가신 갈등에서 지치지도 않고 [ROOT.Char.Custom('GetGuelphGhibellinePossessive')] 권력을 선전하며 강화하고 있더군.\n\n이 점에 대해 끝없는 감사의 마음을 전하겠소."
 gdp_guelph_ghibelline.1000.a: "정말 고맙군."
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "버려진 [actor.Custom('GetGuelphsGhibellines')](와)과 합류할 생각은 없소."
 gdp_guelph_ghibelline.5000.a: "현명하지 못하군."
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U](은)는 몇 년 동안 [recipient.GetShortUIName]에게 [actor.Custom('GetGuelphsGhibellines')] 합류를 요청할 수 없게 됨"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ 보름스 협약"
 gdp_guelph_ghibelline.6500.desc: "갈등이 꽤 오랜 시간 지속되고 있다. 내 필경사가 수많은 숙고 끝에 써 내려간 협의를 보여주었다.\n\n교회 임명권에서 [ghibelline_leader.GetTitleAsNamePossessive|U] 영향력에 제한이 생기지만, [ghibelline_leader.GetHerHim]는 선거에 참관할 수 있으며 결과가 논란을 일으키는 경우 이를 판단할 수 있게 된다.\n\n나는 이 협약이 우리 모두에게 미칠 영향에 대해 생각하며 턱을 긁적였다."
 gdp_guelph_ghibelline.6500.a: "이게 앞으로 나아갈 길이다."
 gdp_guelph_ghibelline.6500.b: "교황령의 권력은 #EMP 지고하다#!!"
 concordat_of_worms_fulfilled.t: "보름스 협약 이행됨"
 concordat_of_worms_abandoned.t: "보름스 협약 버려짐"
 hre_decides_the_outcome.tt: "[GetTitleByKey('e_hre').GetHolder.GetShortUIName](이)가 협약을 받아들일지 결정함"
 cow_phase_moves_to_agitation.tt: "[GetSituation('guelph_ghibelline').GetName] 상황이 서막 단계를 지나 [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName] 단계로 들어섬"
 cow_phase_moves_to_repose.tt: "[GetSituation('guelph_ghibelline').GetName] 상황이 서막 단계를 지나 [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] 단계로 들어섬"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "서로의 차이는 잠시 접어두고, 그대의 교회 임명권을 다룰 올바른 방식에 대해 합의합시다.\n\n대가로 [ROOT.Char.GetTitleAsNameNoTooltip|U](은)는 선거에 참석하며, 논란을 일으키는 결과를 처리할 수 있게 될 겁니다."
 gdp_guelph_ghibelline.6505.a: "이 정도면 충분하겠군..."
 gdp_guelph_ghibelline.6505.b: "용납할 수 없다!"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "[hre_kaiser.GetTitleAsName](이)가 이탈리아 북부에 눈독을 들이고 있고, 이 지역을 중앙 집권화하며 자신의 권력을 강화하려 한다는 소식이 들려오는 가운데 내 전령이 돌아왔다."
 gdp_guelph_ghibelline.7000.desc.all: "\n\n모든 응답자가 내 요청을 따라 롬바르디아 동맹에 합류했다.\n\n이제 우린 [hre_kaiser.GetTitleAsName](이)가 갑작스러운 움직임을 보이더라도 저항할 수 있을 만큼 강한 세력이 되었다...!"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\n응답자의 절반 이상이 내 요청을 따라 롬바르디아 동맹에 합류했다.\n\n이제 우린 [hre_kaiser.GetTitleAsName]에 맞설 수 있으며, 신성한 우방이 추가로 조력해 올지도 모른다..."
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\n응답자 중 일부만이 롬바르디아 동맹에 합류했다. 따라서 우려할 수밖에 없는 상황이 되었다.\n\n#EMP 하지만 별일 아니다!#! 신성한 도움을 약간만 받는다면 우리의 새로운 독립을 지켜낼 수 있을 것이다."
 gdp_guelph_ghibelline.7000.a: "변화의 시대다!"
 gdp_guelph_ghibelline.7000.b: "우리의 시간이 왔다!"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$ 합류?"
 gdp_guelph_ghibelline.7005.desc: "보아하니 [league_creator.GetTitledFirstName](은)는 명예를 아는 [league_creator.GetWomanMan]인 듯하다.\n\n[league_creator.GetSheHe]가 [hre_kaiser.GetTitleAsName]의 진격을 막으려는 시도로 [lombard_league_conf.GetName](을)를 창설했다는 소식이 들려왔다.\n\n제국의 족쇄에서 탈출할 생각이 있다면, 괜찮은 계획 같기는 하다..."
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "너무 서두르진 말자..."
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "전령의 말에 따르면, 논쟁을 초래하는 존재인 [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] #EMP [league_creator.GetTitledFirstName]#!(이)가 [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier]의 상황을 언짢게 여긴다고 한다. 거기다 이 기만적인 [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))](은)는 의지가 약한 양들을 설득해 자신의 편에 가담하게 했다!\n\n대체 #EMP 롬바르디아 동맹#!이 뭐란 말인가?!"
 gdp_guelph_ghibelline.7010.a: "이 불손한 짓을 그냥 넘어가서는 안 된다!"
 gdp_guelph_ghibelline.7010.b: "다른 사안에 신경 써야 한다."
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName](이)가 [league_creator.GetConfederation.GetName](을)를 창설했음 #weak (현재 구성원 #V [lombard_league_conf.GetMemberCount]#!명)#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "아쉽지만 롬바르디아 동맹은 그대의 #EMP 관대한#! 공헌 없이도 나아갈 수 있습니다."
 gdp_guelph_ghibelline.7015.a: "흐음."
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ 타협 도달"
 gdp_guelph_ghibelline.8500.desc: "구엘프와 기벨린의 각 대표자인 [guelph_leader.GetName](와)과 [ghibelline_leader.GetName](이)가 조약에 서명하고자 만났다. 군중 사이로 속삭임이 퍼져나갔다.\n\n어떤 이는 기뻐했지만, 어떤 이는 타협에 도달했다는 생각에 확실히 더 불안해하고 있었다. 자신이 옳다고 굳게 믿어온 신념을 양보할 수밖에 없는 상황이었기 때문이다.\n\n이후에는 군중이 관례대로 저녁 준비에 참여하러 흩어지기 시작했고, 숨죽여 나누는 대화 소리가 그 자리를 메웠다."
 gdp_guelph_ghibelline.8500.a: "드디어 끝이군."
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "아직도 그대의 방식이 잘못되었다는 걸 깨닫지 못한 것 같습니다. 명백히 잘못된 건 그대 [actor.Custom('GetGuelphsGhibellines')]들인데, 어째서 우리가 큰 양보를 해야 하지요?\n\n이렇게 어처구니없는 얘기만 아니었어도 재미있었을 텐데."
 gdp_guelph_ghibelline.8510.a: "참으로 무례하군!"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U](이)가 [GetSituation('guelph_ghibelline').GetName] [situation|E]을 끝내자는 당신의 제안을 거절함"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "합의는 외교적인 전시다. 그것만큼은 확실하다.\n\n[guelph_leader.GetName](와)과 [ghibelline_leader.GetName] 둘 다 양보했으며, 작은 승리를 거두었으나 민중 의견을 잃고 말았다.\n\n시간의 시련을 견뎌내고자 조약을 체결한다는 것은 절대로 사소한 위업이 아니다. 우리 중 과연 얼마나 많은 이가 과거를 뒤로 하고 앞을 내다보며, 더 환한 미래를 향해 나아갈 수 있을지는 두고 봐야 할 것이다."
 gdp_guelph_ghibelline.8520.a: "이게 최선이겠지."
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphGhibelline')] 승리"
 gdp_guelph_ghibelline.9000.desc.guelph: "정리되었다. 우리는 가장 신성한 권리를 지켜냈다. 앞으로 교황이 우리의 신성한 목자를 보호하며 선출할 수 있게 해 주는 지고한 권위 말이다.\n\n또한 그 야심으로 모두를 위험에 몰아넣을 [GetTitleByKey('e_hre').GetName]의 영향력을 제한하게 되었다.\n\n저 #EMP 방황하는#! 기벨린 세력은 무슨 일이 일어난 건지도 알지 못했다."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "드디어 제국을 [ROOT.Char.GetFaith.HighGodName]께서 의도하신 대로, 흔들리지 않는 손과 이성적인 정신으로 통치할 수 있는 우리의 절대적인 권리를 증명해 냈다.\n\n신성한 전달자에서 쫓겨난 자가 대체 어떻게 [GetTitleByKey('e_hre').GetName]의 땅을 통치할 최고의 인물을 가려낸단 말인가.\n\n교황이나 지지하는 구엘프 세력은 자기 영혼이나 보살피라고 하자. 우리는 #EMP 정말#! 중요한 것을 보살필 테니까."
 gdp_guelph_ghibelline.9000.a: "이제 축하해야겠군."
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ [ROOT.Char.Custom('GetGuelphGhibelline')] 패배"
 gdp_guelph_ghibelline.9010.desc.win: "우리는 수차례에 걸쳐 나약한 [ROOT.Char.Custom('GuelphGhibellineGetOpposite')]의 반대에 맞서며 대중의 지지를 얻어냈다.\n\n우리의 위엄 있는 지도자인 [victorious_leader.GetTitledFirstName](와)과 무소속 입법자들이 [ROOT.Char.Custom('GetGuelphsGhibellines')]에게 권리가 있음을 선언했으며, 계속 진행 중이던 이 #EMP 상황#!이 단번에 해결되었다.\n\n드디어 이 세상에도 이성의 빛이 드리우는구나!"
 gdp_guelph_ghibelline.9010.desc.lose: "우리의 지지 세력이 약해지고 있다. 이는 부정할 수 없는 사실이다.\n\n[ROOT.Char.Custom('GetGuelphsGhibellines')]의 권력이나 영향력은 예상했던 것만큼, 또 필요한 것만큼 멀리까지 미치지 못한다. 그리고 저 우둔한 [ROOT.Char.Custom('GuelphGhibellineGetOpposite')] 영주들은 지지 세력으로 압도적인 권력을 지닌 #EMP 무소속#! 입법자들을 긁어모았다.\n\n이제 [ROOT.Char.Custom('GetGuelphsGhibellines')]도 이 싸움을 포기하고, 더 실현 가능성이 있는 목표를 추구할 때가 왔다."
 gdp_guelph_ghibelline.9010.a.win: "이 순간을 만끽하자."
 gdp_guelph_ghibelline.9010.a.lose: "저 #EMP 뱀#! 같은 놈들!"
