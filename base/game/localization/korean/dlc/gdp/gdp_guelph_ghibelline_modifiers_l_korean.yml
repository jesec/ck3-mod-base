l_korean:
 guelph_member_modifier: "구엘프"
 guelph_member_modifier_desc: "해당 인물은 교황이 성직자를 직접 임명하고 선출할 권리를 지지합니다."
 ghibelline_member_modifier: "기벨린"
 ghibelline_member_modifier_desc: "해당 인물은 군주가 종교적 봉신들에게 영향력을 행사하고 충성을 요구할 권리를 지지합니다."
 left_guelphs_modifier: "전 구엘프"
 left_guelphs_modifier_desc: "해당 인물은 구엘프-기벨린 분쟁에서 구엘프 지지를 중단했습니다."
 left_ghibellines_modifier: "전 기벨린"
 left_ghibellines_modifier_desc: "해당 인물은 구엘프-기벨린 분쟁에서 기벨린 지지를 중단했습니다."
 gg_sworn_neutral_modifier: "중립 서약자"
 gg_sworn_neutral_modifier_desc: "해당 인물은 여러 사정으로 인해 구엘프-기벨린 분쟁에서 중립을 유지할 것을 맹세했습니다."
 guelph_victor_modifier: "위풍당당한 $guelph_member_modifier$"
 guelph_victor_modifier_desc: "해당 인물은 구엘프-기벨린 분쟁에서 교황령을 성공적으로 지지했습니다."
 favored_by_pope_modifier: "교황의 총애"
 favored_by_pope_modifier_desc: "해당 인물은 교황의 호의를 받고 있으며 특정한 특권을 누리고 있습니다."
 guelph_loser_modifier: "불명예스러운 $guelph_member_modifier$"
 guelph_loser_modifier_desc: "해당 인물은 구엘프-기벨린 분쟁에서 패배한 편을 지지했습니다."
 ghibelline_victor_modifier: "위풍당당한 $ghibelline_member_modifier$"
 ghibelline_victor_modifier_desc: "해당 인물은 구엘프-기벨린 분쟁에서 제국을 성공적으로 지지했습니다."
 scorned_pope_modifier: "교황의 미움"
 scorned_pope_modifier_desc: "해당 인물은 교황의 분노를 사 관계가 악화되었습니다."
 ghibelline_loser_modifier: "불명예스러운 $ghibelline_member_modifier$"
