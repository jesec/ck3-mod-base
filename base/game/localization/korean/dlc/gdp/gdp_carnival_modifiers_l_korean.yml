l_korean:
 gdp_carnival_prosperity_modifier: "카니발 번영"
 gdp_carnival_prosperity_modifier_desc: "성공적인 카니발 이후 해당 영지가 번영하고 있습니다."
 gdp_civic_commitment_modifier: "시민 헌신"
 gdp_civic_commitment_modifier_desc: "해당 인물은 공화국을 더 살기 좋은 곳으로 만드는 데 헌신하고 있습니다."
 gdp_down_to_earth_ruler_modifier: "소탈한 영주"
 gdp_down_to_earth_ruler_modifier_desc: "시민들은 해당 인물을 친근하고 공정한 통치자로 여기고 있습니다."
 gdp_self_aggrandizing_decorations_modifier: "과시적 장식"
 gdp_self_aggrandizing_decorations_modifier_desc: "해당 인물은 자신의 영광을 기리는 기념물을 세웠습니다."
 gdp_masked_face_modifier: "가면을 쓴 자"
 gdp_masked_face_modifier_desc: "해당 인물은 카니발 기간 동안 아름다운 가면 뒤에 얼굴을 숨기고 있습니다."
 gdp_masked_vigile_modifier: "가면 순시"
 gdp_masked_vigile_modifier_desc: "해당 인물은 카니발 기간 동안 가면을 쓰고 그림자 속을 누빕니다."
 gdp_order_and_business_modifier: "질서와 사업"
 gdp_order_and_business_modifier_desc: "해당 인물은 사업과 질서 유지에 집중하고 있습니다."
 gdp_echos_of_carnival_modifier: "카니발 정신"
 gdp_echos_of_carnival_modifier_desc: "해당 인물은 카니발 정신을 이어가고 있습니다."
 gdp_carnival_basic_celebration_modifier: "즐거워진 대중"
 gdp_carnival_basic_celebration_modifier_desc: "사람들이 축제를 통해 즐거운 시간을 보냈습니다."
 gdp_carnival_extensive_celebration_modifier: "고무된 대중"
 gdp_carnival_extensive_celebration_modifier_desc: "사람들은 축제를 통해 시민의 의무에 대한 의욕을 얻었습니다."
 gdp_carnival_extravagant_celebration_modifier: "숭앙하는 대중"
 gdp_carnival_extravagant_celebration_modifier_desc: "사람들은 자신들의 공화국에 대해 경외심을 느낍니다."
 gdp_masked_paranoia_modifier: "가면 편집증"
 gdp_masked_paranoia_modifier_desc: "해당 인물은 암살자들의 습격을 받고도 살아남았습니다. 하지만 그들은 아직 어딘가에 있습니다."
 gdp_terrifying_procession_modifier: "공포의 행렬"
 gdp_terrifying_procession_modifier_desc: "해당 인물은 누구도 자신을 함부로 건드릴 수 없다는 사실을 모두에게 상기시키기 위해 공포스러운 행렬을 거행했습니다."
 gdp_pious_procession_modifier: "경건한 행렬"
 gdp_pious_procession_modifier_desc: "해당 인물은 자신이 독실한 사람임을 모두에게 상기시키기 위해 행렬을 거행했습니다."
