 gdp_merchant.3000.t: "통역관의 조언"
 gdp_merchant.3000.desc: "내 통역관인 [translator.GetTitledFirstName](은)는 한동안 혼자 틀어박혀 있었다. 아마 외국의 서적이라도 연구하고 있던 모양이다. 그러다가 마침내 모습을 드러냈다.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip].\" [translator.GetSheHe]가 환한 얼굴로 말했다. \"[market.GetName|l]에서 들어온 보고를 확인해 봤는데, 그 속기로 쓴 [saved_culture.GetLanguage.GetName] 언어가 좀 어렵긴 하더군요. 그래도 현지 상품의 유통에 관해 정말 많은 내용이 있습니다!\""
 gdp_merchant.3000.a: "\"하나부터 끝까지 다 알고 싶군, [translator.GetFirstNameNoTooltip]!\""
 gdp_merchant.3000.a.tt: "[company|E]가 [market.GetName]에서 무역하는 모든 [trade_categories_short|E]의 [trade_expertise|E]을 획득함"
 gdp_merchant.3000.b: "\"나한테 그 언어를 가르쳐 줄 수 있나?\""
 gdp_merchant.3000.b.tt: "당신의 [scheme|E]이 [GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]를 획득함"
 gdp_merchant.3000.c: "\"알아낸 내용은 값을 가장 높이 부르는 사람한테 팔자.\""
 gdp_merchant.3000.d: "\"자네 언어 실력을 높이는 데 집중하도록.\""
 gdp_merchant_translator_buff_modifier: "통역관 교사"
 gdp_merchant.3010.t: "해결사의 발견"
 gdp_merchant.3010.desc: "내 해결사 [fixer.GetTitledFirstName](은)는 한동안 [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]에서 끈질기게 숨어 다녔다. 그러다 마침내 #EMP 상품#!을 찾았다는 모호한 내용의 쪽지와 함께 회동을 주선했다.\n\n[fixer.GetSheHe|U]는 비밀스럽게 자리에 앉더니"
 gdp_merchant.3010.desc.secret: "이내 미소를 지었다. \"시간은 좀 걸렸지만, [secret_haver.GetName](이)가 확실히 [secret.GetName](이)라는 증거를 찾았습니다!\""
 gdp_merchant.3010.desc.scheme: "걱정스러운 표정을 지었다. \"[ROOT.Char.GetTitleAsNameNoTooltip], 좋지 못한 소식이 있습니다. [scheme_owner.GetName](이)가 그대와 회사를 상대로 모략을 꾸미고 있었다는 사실을 알아냈습니다!\""
 gdp_merchant.3010.a: "\"정말 유용한 정보다. 더 가져오도록 하라!\""
 gdp_merchant.3010.b: "\"[fixer.GetFirstNameNoTooltip], 자네 참 교활한 사람이로군?\""
 gdp_merchant.3010.c: "\"난 부정한 방식으로 획득한 소문을 다루지 않네.\""
 gdp_merchant.3010.d: "\"이거 내 일에 유용하게 쓰일 수 있겠는데...\""
 gdp_merchant.3020.t: "집달관의 엄포"
 gdp_merchant.3020.desc: "내 집달관 [bailiff.GetTitledFirstName](은)는 채무자 목록을 살펴보면서 머뭇거리고 있었다. 우리의 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')](을)를 신속히 돌려받으려면 압박을 넣어야 할 수도 있는데 말이다.\n\n"
 gdp_merchant.3020.pressure: "\"[pressure_debtor_1.GetTitledFirstName](은)는 자금이 없지만, 최소한의 선의로 채무는 상환할 수 있을 겁니다...\" [bailiff.GetFirstNameNoTooltip](이)가 투덜거렸다.\n\n"
 gdp_merchant.3020.demand: "[bailiff.GetSheHe|U]가 한숨을 쉬었다. \"믿을 만한 소식통에 따르면 [demand_debtor_1.GetTitledFirstName](이)가 채무금을 낼 수 있다고 합니다... 근데 그냥 자기가 우리보다 더 낫다고 생각해서 안 하는 거고요!\"\n\n"
 gdp_merchant.3020.third: "\"그리고 [portrait_3.GetTitledFirstName]도 있는데...\" [bailiff.GetSheHe]가 중얼거렸다."
 gdp_merchant.3020.a: "\"그렇지. [pressure_debtor_1.GetFirstNameNoTooltip](은)는 #EMP 약간의#! 금액이라면 감당할 수 있지 않겠나?\""
 gdp_merchant.3020.a.tt: "당신에게 [gold_i]#V -[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#!만큼을 덜 빚지게 됨"
 gdp_merchant.3020.b: "\"[demand_debtor_1.GetTitledFirstNameNoTooltip](을)를 압박해라...\""
 gdp_merchant.3020.c: "\"[pressure_debtor_2.GetFirstNameNoTooltip]도 소액 상환이라면 가능하겠지.\""
 gdp_merchant.3020.d: "\"[demand_debtor_2.GetFirstNameNoTooltip](이)가 우릴 상대로 뻗대고 있군!\""
 gdp_merchant.3020.e: "\"[pressure_debtor_3.GetFirstNameNoTooltip]한테 책무를 져야 한다는 사실을 상기시켜 줘라.\""
 gdp_merchant.3020.f: "\"[demand_debtor_3.GetFirstNameNoTooltip]한테 확실한 신호를 보내야 할 때가 왔군.\""
 gdp_merchant.3020.g: "\"나한테 계속 빚을 지도록 두겠다.\""
