 gdp_usury_penance_loan_stands_tt: "숨겨진 [loan|E]이 그대로 유지됨"
 gdp_merchant.5010.t: "세부 항목"
 gdp_merchant.5010.desc: "내 채권자인 [lender.GetFirstName](이)가 내 대출금 정리를 완전히 정직하게 처리하지 않았다는 사실을 알게 되었다.\n\n숫자를 다시 살펴보니, 계약서의 세부 항목 조항을 보면 우리가 처음에 합의했던 것보다 더 높은 금액이 기록되어 있었다.\n\n우리 합의 내용에는 불일치가 있다. 내가 나서기만 한다면 모두가 이 사실을 알게 되겠지."
 gdp_merchant.5010.a: "비밀을 지킨다."
 gdp_merchant.5010.b: "[lender.GetSheHe|U]는 나한테 이자를 돌려줘야 할 거다."
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U]는 아무 이자도 받지 못할 거다."
 gdp_merchant.5010.c: "대출을 거부한다."
 gdp_usury_debtor_discover_interest_tt: "숨겨진 [interest|E] #weak ([gold_i|E]$VALUE|0V$)#!"
 gdp_usury_debtor_keep_secret_tt: "숨겨진 [interest|E]가 비밀로 유지됨"
 gdp_usury_debtor_demand_repayment_tt: "숨겨진 [interest|E]를 돌려 달라고 요구함"
 gdp_usury_debtor_inform_creditor_tt: "[lender.GetShortUINameNoTooltip]에게 편지를 보냄"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ 숨겨진 이자를 즉시 돌려주시오. 다시는 날 속이려 들지 마시오."
 gdp_merchant.5020.a: "유감스러운 소식이군."
 gdp_merchant.5020.a.tt: "숨겨진 이자를 돌려줌"
 gdp_usury_penance_interest_paid_back_tt: "숨겨진 [interest|E]를 더 이상 빚지지 않음"
 gdp_merchant.5020.desc_intro: "우리 대출 계약서를 다시 살펴봤는데, 그대가 나한테 사기를 치려 했다는 사실이 명백히 드러나 있더군!"
 gdp_usury_debtor_kept_secret_message: "비밀을 지킴"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.GetTitledFirstName](이)가 숨겨진 [interest|E]에 관해 알고 있으며, 이를 비밀에 부칠 것임"
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "그대가 내게 준 대출은 무효하니 없던 것으로 하시오. 다음번에 그대가 또 제안해 온다면, 더 신중하게 생각해 보겠소."
 gdp_merchant.5040.a: "배짱도 좋군!"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "이런 내용으로 서신을 보내게 되어 마음이 좋지 않지만, 이제는 탁 트인 길로 여행하는 고충과 시장에서의 끝없는 논쟁을 견디기가 힘든 상황입니다.\n\n잠깐이라도 좋으니, 부디 회사를 고향으로 귀환시켜 주실 수 있겠습니까?"
 gdp_merchant.0060.a: "그래야 한다면 어쩔 수 없지."
 gdp_merchant.0060.a.tt: "당신이 2년 이내에 [GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName] 결단을 이행하기로 함."
 gdp_merchant.0060.b: "극복해 내야 한다."
 gdp_merchant.0060.b.tt: "[associate.GetShortUIName](이)가 [stress_i]#N [associate.GetStress|0]#! [stress|E]를 보유함. [associate.GetSheHe|U]가 자신의 행로에서 [schemes|E]에 실패하면 계속해서 스트레스를 획득할 것임."
