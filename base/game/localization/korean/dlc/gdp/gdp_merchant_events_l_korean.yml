l_korean:
 gdp_merchant.0001.t: "금으로 만든 길"
 gdp_merchant.0001.desc: "나는 자유롭게 현지 시장으로 들어섰다. 길모퉁이마다 상인들의 외침이 들렸고, 근처의 공방에서 금속이 부딪히며 울리는 소리도 섞여 들었다. 길을 틀 때마다 [ROOT.Char.Custom('RegionalDrink')] 상자, 둘둘 말린 [ROOT.Char.Custom('RegionalFabric')], [ROOT.Char.Custom('GetRandomRegionalBird')] 우리를 가득 담은 수레가 이리저리 움직이고 있었다.\n\n바로 여기가 내 가문을 만들어 나갈 곳이다."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "내 첫 사업은 무엇이 될까?"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "신중히 고려한 끝에 저는 이제 상인으로서 살아가기로 했습니다. 지금이야말로 가장 활력이 넘치는 나이이며, 해외로 여행하고 싶은 열망이 저를 이끌고 있습니다. 언젠가는 우리 모두에게 이득이 될 사업 합의를 체결할 수 있기를 바랍니다. [old_primary_title.GetBaseNameNoTierNoTooltip](은)는 유능한 그대에게 맡기겠습니다."
 gdp_merchant.0002.a: "일이 흥미롭게 흘러가는군."
 gdp_merchant.0010.t: "가족 문제"
 gdp_merchant.0010.desc: "오늘의 가족 회담을 끝낸 뒤, 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetTitledFirstName](이)가 단호한 얼굴로 나를 향해 손짓했다.\n\n\"친애하는 [associate.Custom2('RelationToMe', ROOT.Char)]!"
 gdp_merchant.0010.desc.starting: "저는 이 회사가 시작될 때부터 일원으로 있었습니다.\""
 gdp_merchant.0010.desc.starting_fallback: "제가 이 가족을 위해 일한 지도 꽤 되었군요.\""
 gdp_merchant.0010.desc.cont: "[associate.GetSheHe]가 단어를 신중하게 고르며 말했다."
 gdp_merchant.0010.desc.children: "\"그대의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))]도 아직 나이가 차지 않았으니,"
 gdp_merchant.0010.desc.no_children: "\"그대는 성인 자녀가 없으니,"
 gdp_merchant.0010.desc.outro: "혹시 저를 입양해 주시는 게 어떨까 싶습니다. 한 식구가 되어 이 가족을 대표할 수 있다면 그만한 영광이 없을 것 같습니다.\""
 gdp_merchant.0010.a: "\"난 그대를 언제나 내 식구로 여겼지.\""
 merchant_adoption_event_tt: "[associate.GetShortUIName](이)가 당신의 [house|E]에 속하게 됨"
 merchant_unity_adoption_loss: "사원을 [house|E]에 받아들였음"
 gdp_merchant.0010.b: "\"그대는 아직 능력을 입증하지 못했다.\""
 gdp_merchant.0010.c: "\"내 한번 확인해 보고 알려 주겠네.\""
 gdp_merchant.0015.t: "사업용 얼굴"
 gdp_merchant.0015.desc: "[trade_route.GetNameNoTooltip|l](이)가 만들어졌으니, 우리의 무역 경로도 생겼다.\n\n이제 우리의 새로운 사업을 대표할 사람을 골라야 한다. 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))] [courtier_1.GetTitledFirstName](은)는 [courtier_1.Custom('quirk_pos_adjective')] 사람이고"
 gdp_merchant.0015.desc_good_intellect: "괜찮은 지성을 겸비했다. 누가 알겠는가. [courtier_1.GetSheHe]가 또 숨겨진 재능으로 우리를 놀라게 할지도 모르는 일이지."
 gdp_merchant.0015.desc_excellent_intellect: "훌륭한 지성을 겸비했다. [courtier_1.GetHerHim]라면 가문의 이름을 자랑스럽게 할 것이다."
 gdp_merchant.0015.desc_poor_intellect: "지적 능력이 그리 좋진 못하다. 어쩌면 [courtier_1.GetHerHim]가 이번 기회를 도전으로 삼아 자신의 실력을 향상할 수 있을지도 모른다."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip](이)가 적임자인 것 같군..."
 gdp_merchant.0015.b: "...하지만 [courtier_2.GetFirstNameNoTooltip](이)가 더 적임자 같다."
 gdp_merchant.0015.c: "인재는 내 가까이에 두어야 한다."
 gdp_merchant.0015.c.fallback: "아니지. 모두 여기 머물러야 한다."
 gdp_merchant.0015.c.tt: "배정한 [trader|E] 없이 [trade_route|E]를 시작함"
 gdp_merchant.0020.t: "사업 동반자"
 gdp_merchant.0020.desc: "가업을 이끄는 머리가 잘 돌아가려면 새로운 전망을 향해 시선을 돌릴 줄 아는 목이 훌륭해야 한다."
 gdp_merchant.0020.desc.partner_exists: "내 동업자인 [old_holder.GetFirstName](이)가 바로 이런 임무를 짊어져야 하는데, 이 사람은 계속 결실도 보지 못하는 사업에 우리의 시간과 돈을 낭비하고 있다."
 gdp_merchant.0020.desc.fallback: "지금은 이 역할을 맡아 동반자로서 내 옆에 자리할 사람을 고용하지 않았다."
 gdp_merchant.0020.desc.body: "회사에 가득한 긴장이 느껴진다. 야심이 조금이라도 있는 사람들은 서로 헐뜯고 허세를 부리고 있다.\n\n"
 gdp_merchant.0020.desc.outro_three: "그중에서 [candidate_2.GetTitledFirstName](와)과 [candidate_3.GetTitledFirstName](이)가 흔들림 없는 충성을 바칠 것을 맹세하며 자리를 얻으려 하고 있다.\n\n자기들보다 명백히 더 우월한 [candidate_1.GetTitledFirstName](을)를 앞서 나갈 수 있다면 무엇이든 할 태세였다."
 gdp_merchant.0020.desc.outro_two: "그중에서 [candidate_2.GetTitledFirstName](이)가 흔들림 없는 충성을 바칠 것을 맹세하며 자리를 얻으려 하고 있다.\n\n자기보다 명백히 더 우월한 [candidate_1.GetTitledFirstName](을)를 앞서 나갈 수 있다면 무엇이든 할 태세였다."
 gdp_merchant.0020.desc.outro_one: "그중에서 [candidate_1.GetTitledFirstName](이)가 흔들림 없는 충성을 바칠 것을 맹세하며 자리를 얻으려 하고 있다.\n\n자신과 자리 사이를 가로막는 이가 있다면 무슨 짓을 해서든 밀어낼 태세였다."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip]에게 기회를 주어야겠군."
 gdp_merchant.0020.a.custom: "다른 모든 후보"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip]에게 기회가 가야 한다."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip](이)가 가장 자격 있지."
 gdp_merchant.0020.d: "이 사람들은 각자 이미 신경 써야 할 일이 있는데..."
 gdp_merchant.0020.d.custom: "모든 후보"
 merchant_unity_partner_gain: "집안 구성원을 동반자로 고용했음"
 merchant_unity_partner_loss: "외부인을 동반자로 고용했음"
 gdp_merchant.0025.t: "존경받는 기능공"
 gdp_merchant.0025.desc: "\"[ROOT.Char.GetFirstNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip].\" 근처의 무두장에서 낯선 목소리가 나를 불렀다. 나는 염색 통에서 흘러나온 오물을 밟지 않으려 애쓰며 소리를 따라갔다.\n\n그러다 정신을 차려 보니... 웬 동물 사체가 나를 마주하는 것 아닌가? 사냥꾼이 자기 전리품을 자랑스럽게 보여주며 나를 향해 미소를 지었다.\n\n\"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U](은)는 뛰어난 장인들로 널리 알려져 있지요. 그러니 당신이 판매할 물건의 질은 그 물건을 만든 재료에 따라 정해진다는 사실도 아실 겁니다. 전 사냥꾼으로서, 당신처럼 안목 있는 구매자를 위해 최상의 물자를 조달하는 일을 생업으로 삼고 있고요.\""
 gdp_merchant.0025.a: "\"혹시 대량으로 거래할 생각이 있소?\""
 gdp_merchant.0025.b: "\"계속 말해보시오...\""
 merchant_unity_artisan_recruit_loss: "외부인을 영입함"
 merchant_unity_artisan_recruit_decline_gain: "사치품 재료에 관해 배움"
 gdp_merchant.0030.t: "무시할 수 없는 힘"
 gdp_merchant.0030.desc: "\"[ROOT.Char.GetFirstNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip|U], 여깁니다!\" 어느 [traveler.GetWomanMan]이 외치는 소리가 들렸다.\n\n돌아보니 대장장이가 자기 작업대에서 손을 흔들고 있었다. 가까이 걸어가는데, [traveler.GetSheHe]가 몸을 비틀고 구부리면서 용광로에서 나오는 불길에 몸을 비추자 [traveler.GetHerHis] 근육이 빛났다. 그 모습이 참...\n\n\"당신을 만나려고 한참 기다렸습니다. 당신 회사에서 #EMP 엄청난#! 명성을 쌓아 경쟁자를 압도하더군요. 그래서 당신 쪽에 내 힘을 보태고 싶습니다. 전 머리도 부수고, 검도 휘두를 줄 압니다. 필요하면 뭐든 하겠습니다.\""
 gdp_merchant.0030.a: "\"그 열정이 마음에 드는군.\""
 gdp_merchant.0030.b: "\"#EMP 에헴...#! 당신 작업물을 더 보여주시오.\""
 merchant_unity_creditor_recruit_loss: "외부인을 영입함"
 merchant_unity_creditor_recruit_decline_gain: "도가 지나친 회사 광신자를 내보냄"
 gdp_merchant.0035.t: "멀리까지 전해진 명성"
 gdp_merchant.0035.desc: "평소와 다르게 큰 소란이 일었다. 나는 앞에 놓인 장부에서 시선을 돌렸다.\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] 사무실 밖으로 나서니, 눈매가 예리한 상인이 서 있었다. [traveler.GetHerHis] 옷에는 며칠 동안 쌓인 먼지가 붙어 있었다.\n\n\"반갑습니다, [ROOT.Char.GetTitledFirstNameNoTooltip].\" [traveler.GetSheHe]가 말했다. \"길에서 만난 모두가 당신 이름을 알더군요. 지금까지 만난 사람들도 전부 당신을 만나보라고 했고요. 제가 앞으로 당신의 이름 아래에서 일할 수 있게 해 주시면 좋겠습니다.\""
 gdp_merchant.0035.a: "\"참으로 유능해 보이는 인재군!\""
 gdp_merchant.0035.b: "\"그보다는 먼 곳의 무역 소식을 듣고 싶은데.\""
 merchant_unity_caravaneer_recruit_loss: "외부인을 영입함"
 merchant_unity_caravaneer_recruit_decline_gain: "먼 곳의 시장에 관해 배움"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "[ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')]들은 비관적이었지만, 그래도 우리 요청에 대해 [recipient.GetTitledFirstNamePossessive] 동의를 받았으며 이제 기쁨의 분위기를 만끽하게 되었다! 드디어 우리만의 도시가 생기고, 우리 마음대로 다스릴 수 있는 공화국이 세워질 것이다!\n\n나는 [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]의 첫 [ROOT.Char.GetTitleAsNameNoTooltip](이)가 되어"
 gdp_merchant.0101.liege: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip](와)과 주변 지역을 종속된 도시로서 관리하며, 우리의 [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] 주인에게 의지하면서도 신세를 지게 된다."
 gdp_merchant.0101.independent: "시민의 이름으로, 다른 현지 귀족 가문과 나란히 하며 [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip](와)과 주변 지역을 다스리게 된다."
 gdp_merchant.0101.republic: "\n\n수많은 거래와 노력 끝에, 위대한 [ROOT.Char.GetHouse.GetBaseNameNoTooltip] 가문이 드디어 영원히 남을 유산을 이룩할 수 있게 되었다..."
 gdp_merchant.0101.a: "여기서 [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip] 사람들의 새로운 시대가 시작된다!"
 gdp_merchant.0102.desc: "제안을 받아 주셔서 정말로 기쁩니다!\n\n금화는 보내두었고, 이제 자리를 옮겨 [actor.GetPrimaryTitle.GetName](을)를 위한 특허장을 작성해"
 gdp_merchant.0102.liege: "그대의 부족한 봉신으로서 다스리겠습니다."
 gdp_merchant.0102.top_liege: "[new_liege.GetTitledFirstName] 아래에서 다스리겠습니다."
 gdp_merchant.0102.independent: "독립적인 도시로 다스리겠습니다."
 gdp_merchant.0103.desc: "정말 말도 안 되는 제안이로군. 내 작위를 돈으로 살 수 있다고 생각했나? #EMP 그대#!처럼 미천한 [actor.GetWomanMan] 따위가?!"
 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "수많은 논의가 끝났고, [recipient.GetTitledFirstName](은)는 우리의 두 회사와 집안을 합치자는 내 관대한 제안을 향한 흥미를 감추지 못했다.\n\n[recipient.GetSheHe||U]가 고개를 끄덕였다."
 gdp_merchant.0110.desc.personality.ai_honor: "\"이 사안에 관해서는 선택의 여지가 없는 것 같소. 하지만 나는 약속을 지킬 것이며, 나 자신의 이익을 챙기듯 성실하게 그대의 이익을 위해 일하겠소.\""
 gdp_merchant.0110.desc.personality.ai_zeal: "\"이것이 [recipient.GetFaith.WealthGodName]께서 우리를 위해 내어주신 길이라 믿소.\""
 gdp_merchant.0110.desc.personality.ai_greed: "\"그대와 우리 쪽 장부를 살펴보았소. 수치를 보니, 이 거래를 받아들이는 수밖에 없겠군.\""
 gdp_merchant.0110.desc.personality.ai_compassion: "\"회사와 상의해 보았는데, 우리 회사의 통합은 양쪽 모두에게 이익이 되는 기회라 생각되오.\""
 gdp_merchant.0110.desc.personality.ai_boldness: "\"그대의 제안을 받아들이겠소. 이제 서로 모호한 태도를 보이는 일은 없도록 합시다.\""
 gdp_merchant.0110.desc.personality.ai_rationality: "\"우리의 이득과 그대의 제안을 거절하는 비용을 자세히 따져보았소. 제안을 받아들이지.\""
 gdp_merchant.0110.desc.personality.ai_vengefulness: "\"선택의 여지가 없구려. 머리를 꽤 잘 쓰셨더군. 이번에는 그대의 승리요.\""
 gdp_merchant.0110.desc.personality.ai_energy: "\"받아들이겠소. 사무원들이 계약서를 작성하면 바로 내게 보내 주시오!\""
 gdp_merchant.0110.desc.personality.ai_sociability: "\"[recipient.GetHouse.GetBaseNameNoTooltip] 회사에서 그대의 제안을 받아들이겠소. 우리의 이름으로 거래하던 시절이 그립겠지만, 자존심에 집착한다면 어리석은 짓이 될 테니.\""
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "\"숙고 끝에 우리의 이해를 하나로 합치자는 그대의 제안을 받아들이기로 했소.\""
 gdp_merchant.0110.desc.closing: "\n\n\"우리의 무역로는 합의된 바와 같이 해체될 것이며, 오늘부터 [recipient.GetHouse.GetBaseNameNoTooltip]의 이름은 그대의 회사를 섬길 것이오.\""
 gdp_merchant.0110.a: "[recipient.GetHouse.GetBaseNameNoTooltip] 시장은 우리 것이다!"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "그대 자신과 [actor.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip] 중요성에 관해 잊으신 것 같구려. [recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip](은)는 절대로 그대의 사소한 이해 따위에 휘둘리지 않을 것이오."
 gdp_merchant.0111.a: "애초에 구상부터 잘못된 사업이었다."
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "[indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 봉역에 재정적인 지원이 절실히 필요하다는 소문이 널리 퍼졌다. 내가 그 상황을 해결해 줄 수도 있을 텐데... 물론 그러려면 대가를 받아야겠지만 말이다."
 gdp_purpose_events.0001.a: "이 상황을 헤쳐 나갈 방법일지도 모르겠군..."
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName](이)가 당신의 제안을 고려할 것임."
 gdp_purpose_events.0001.b: "뻔뻔하기는!"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "이 어려운 시기에 그대의 재정적인 도움이 필요하오. 조건을 제시하면 거절하지 않겠소. 다만 그 조건은 글로 명시할 수 있어야 하오."
 gdp_purpose_events.0002.a: "대출금과 이자를 비롯해 모든 것을 작성한다."
 gdp_purpose_events.0002.a.sin: "대출금과 고리대금 사항을 비롯해 모든 것을 작성한다."
 gdp_purpose_events.0002.c: "아무도 고리대금업이라 할 수 없도록 작성한다."
 gdp_purpose_events.0002.d: "금화를 보내고 답례로 아무것도 요청하지 않는다."
 gdp_purpose_events.0002.b: "정중하게 거절해야겠군..."
 gdp_purpose_events.0002_notification: "성공적인 대출"
 gdp_purpose_events.0002_fail_notification: "대출 거절"
 fund_maa: "@stationed_regiment_icon! [men_at_arms|E] [regiment|E]에 자금 지원"
 fund_mercenaries: "[mercenary_i|E][mercenary|E] 계약에 자금 지원"
 gdp_purpose_events.0003.desc: "전쟁으로 그대 봉역이 고통받고 있다는 사실이 널리 알려져 있습니다. [ruler.GetTitleAsNameNoTooltip]께서 앞으로 제게 친절을 베풀어 주신다면, 그대의 노력을 후원해 드릴 생각이 있습니다..."
 gdp_purpose_events.0003.a: "도움이라면 뭐든 받겠다!"
 gdp_purpose_events.0003.b: "친절? 절대 못 한다!"
 no_thanks.tt: "당신이 이번 기회를 그냥 넘김..."
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "이런 서신을 보내자니 괴롭지만, 현재 전쟁을 맞이한 상황에서 우리 봉역에 그대의 후원이 필요합니다. 도와주신다면 앞으로 그대에게 친절을 베풀어 보답하겠습니다."
 gdp_purpose_events.0004.a: "새로 창설한 특수 연대를 보내줘야겠군!"
 gdp_purpose_events.0004.b: "아는 사람들을 매수하면 될 것 같은데..."
 gdp_merchant.1002.t: "회사 설립"
 gdp_merchant.1002.desc: "내 앞의 책상에 빈 장부가 놓여 있었다. 열린 창문 밖에서 현지 [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')]의 소리가 [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l] 집무실로 들어왔다. 거래하며 흥정하는 소리, 수레바퀴가 삐걱거리는 소리, 우리에서 동물들이 내는 소리까지.\n\n서재는 수수했고, 조명은 은은하고 어두웠다. [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]의 무역상들과 경쟁하려면 혼자서는 어렵다. 회사에 도움이 될 사람을 고용하는 게 나으려나?"
 gdp_merchant.1002.a: "사업가의 정신을 지닌 인물이 필요하다."
 gdp_merchant.1002.a.tt: "당신은 [stewardship|E]에 능숙한 두 명의 [associates|E]과 함께 시작함"
 gdp_merchant.1002.b: "우리의 상대를 위협할 것이다."
 gdp_merchant.1002.b.tt: "당신은 [martial|E]에 능숙한 두 명의 [associates|E]과 함께 시작함"
 gdp_merchant.1002.c: "능숙한 협상가가 좋은 무역 협정을 체결하는 법."
 gdp_merchant.1002.c.tt: "당신은 [diplomacy|E]에 능숙한 두 명의 [associates|E]과 함께 시작함"
 gdp_merchant.1002.d: "여긴 학자들이 정말 많지!"
 gdp_merchant.1002.d.tt: "당신은 [learning|E]에 능숙한 두 명의 [associates|E]과 함께 시작함"
 gdp_merchant.1002.e: "교활함으로 우위에 설 수 있을 거다."
 gdp_merchant.1002.e.tt: "당신은 [intrigue|E]에 능숙한 두 명의 [associates|E]과 함께 시작함"
 gdp_merchant.1002.f: "아니, 아무도 필요 없다."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial [associates|E]을 얻기 전에는 [task_contracts|E] 수행이 어렵거나 불가능할 수 있음#!"
 gdp_merchant.1002.f.tt.associates: "초기 [associates|E] 없이, 이미 보유한 [family|E]과 [friends|E]들만 가진 채 시작함"
 gdp_merchant.1003.t: "회사 설립"
 gdp_merchant.1003.desc: "수많은 인파로 가득한 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')](이)가 내 앞에 펼쳐졌다. 거래가 성사되며 [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')](을)를 주고받는 광경이 한순간도 끊이지 않았다.\n\n사방이 교역으로 소란스러웠다. 수레바퀴가 삐걱거리고, 붐비는 우리 안에서 동물들이 소리를 질러 댔으며, 그 소음 뒤에는 서로 경쟁에서 앞서 나가길 바라는 내 동료 상인들이 고함을 치고 있었다.\n\n이곳에서는 온갖 종류의 상품이 오간다. 수많은 무역상과 경쟁하려면, 나도 노력을 집중해야 하지 않을까?"
 gdp_merchant.1003.a: "\"대량 운송을 확보하는 게 답이다.\""
 gdp_merchant.1003.b: "\"우리에 대한 [ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] 평가를 이용해야 한다.\""
 gdp_merchant.1003.b.tt: "[patron_contract|E]가 생성될 것임"
 gdp_merchant.1003.c: "\"우린 상인이다. 수익이 가장 중요하지.\""
 gdp_merchant.1100.t: "붐비는 회사"
 gdp_merchant.1100.desc: "내 [ROOT.Char.Custom2('RelationToMe', plaintiff)] [plaintiff.GetTitledFirstName](이)가 서재에 있던 내게 다가오며 말을 골랐다. \"[ROOT.Char.GetFirstNameNoTooltip]... 이건 가족 사업 아니었습니까? 그런데 점점 더 외지인한테 의존하는 것 같습니다.\"\n\n\"우리의 품위를 유지하려면 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]에서도 쓸데없는 부분을 잘라내야 합니다.\""
 gdp_merchant.1100.a: "\"더는 [associate_2.GetFirstNameNoTooltip](이)가 필요 없다.\""
 gdp_merchant.1100.b: "\"이제 [associate_1.GetFirstNameNoTooltip](와)과 갈라설 때도 됐지.\""
 gdp_merchant.1100.c: "\"그래, 어디 '쓸데없는 부분을 잘라내' 볼까...\""
 gdp_merchant.1100.d: "\"말도 안 되는 소리. 도움이라면 뭐든 필요한 판이다.\""
 merchant_overcrowding_ignored_loss: "회사의 과밀 상태를 무시함"
 merchant_overcrowding_fired_gain: "과밀 상태를 해결하고자 사원을 해고함"
 merchant_overcrowding_yeet_gain: "과밀 상태를 해결하고자 사원을 해고함"
 gdp_merchant.1200.t: "사원의 요청"
 gdp_merchant.1200.desc: "장부를 살펴보느라 고된 하루가 흘러갔다. 내 [ROOT.Char.Custom2('RelationToMe', requester)] [requester.GetTitledFirstName](이)가 문 근처에서 어슬렁거리며 나를 기다리고 있었다. \"아, [ROOT.Char.Custom2('RelationToMeAddress', requester)]! 여쭤볼 것이 있는데...\"\n\n"
 gdp_merchant.1200.desc.artifact: "\"회사가 그대의 지도 아래 막힘없이 나아갑니다. 여기 장부를 거쳐 가는 귀중한 물건도 정말 많고요. 혹시... 제가 그중 하나를 가져도 되겠습니까?\""
 gdp_merchant.1200.desc.activity: "\"회사는 열심히 일하고, 그대가 우리를 잘 이끌고 있습니다. 이제 슬슬 기억에 남을 행사를 열어 우리의 위업을 축하하는 게 어떻겠습니까?\""
 gdp_merchant.1200.desc.luxury_contract: "\"회사의 길은 그대의 지시 아래 잘 뻗어가고 있습니다. 하지만 저 바깥세상에는 수많은 놀라운 것들이 발견되기만을 기다리고 있을 겁니다...\""
 gdp_merchant.1200.a: "\"알겠다. 방법을 한번 알아보지.\""
 gdp_merchant.1200.b: "\"그만하지, 더 중요한 일을 처리해야 한다.\""
