 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName](이)가 이제 당신에게 [gold_i][outstanding|V0]만큼의 빚을 짐"
 gdp_merchant.3031.t: "공모자의 열정"
 gdp_merchant.3031.desc: "내 시장 공모자인 [market_agent.GetTitledFirstName](은)는 요즘 새벽까지 깨어 있으면서, 촛불이 거의 다 타들어 갈 때까지 장부를 살펴본다. 오늘 아침 [market_agent.GetSheHe]는 피곤으로 흐려진 눈을 끔뻑이며 내 서재로 들어왔다.\n\n\"[ROOT.Char.GetTitledFirstName]! 우리의 [market.GetName|l] 장부를 살펴보고 있었는데, 확실한 전망이 하나 있습니다. 이걸...\" #weak *하품*#! \"이용하지 않는다면 바보 같은 짓일 겁니다!\""
 gdp_merchant.3031.a: "\"잘했군, [market_agent.GetFirstNameNoTooltip]. 이제 가서 좀 자게!\""
 gdp_merchant.3031.a.tt: "[market.GetName|l]에 [trade_opportunity.GetType.GetName|V] [trade_opportunity|E]가 나타남"
 gdp_merchant.3031.b: "\"그건 됐으니, 우리가 지금 당면한 문제에 집중하게!\""
 gdp_merchant.3040.t: "유물 담당관의 염려"
 gdp_merchant.3040.desc: "내 유물 담당관 [antiquarian.GetTitledFirstName](은)는 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]의 수집품을 주의 깊게 살피며 유물들을 양호한 상태로 안전하게 보관하고, 가끔 찾아오는 손님에게 흥미로운 정보를 제공하곤 한다.\n\n어느 날 아침, 멈춰 서서 [artifact.GetName](을)를 구경하는데 때마침 [antiquarian.GetSheHe]가 모습을 드러냈다. \"아, [ROOT.Char.GetTitleAsNameNoTooltip]. 정말 특별한 소장품이지요. 근데 가끔은 이런 생각이 들긴 합니다. 이게 과연 나머지 소장품에 견줄 만한 물건일까요?\""
 gdp_merchant.3040.b: "\"이걸 떠나보낼 때가 온 것 같군. 구매자를 찾아보자.\""
 gdp_merchant.3040.c: "\"약간의 보수가 필요할 것 같은데.\""
 gdp_merchant.3040.c.tt: "[artifact.GetName](이)가 이미 새것에 가까운 상태임"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName](이)가 #V 생물#!임"
 gdp_merchant.3040.d: "\"헛소리. 수집품은 흠잡을 데 없다.\""
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "소박한 마을 사람이라면 천 조각 하나가 시장 가판대에 놓이기 위해 불타는 사막과 요동치는 바다를 가로지르는 여정을 겪는다는 사실을 잘 믿지 못할 것이다.\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]에서는 무역상, 짐승, 배의 이러한 고난이 흔하다. [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]의 말이라고는 단 한 마디도 들리지 않는 머나먼 동네에서도 우리의 운송에 의존하고 있다."
 gdp_merchant.8000.a: "회사에 걸맞은 명성이군!"
 gdp_merchant.8000.b: "그래도 내 뿌리를 잊어서는 안 된다."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "물물 교환으로 얻어낸 상품 꾸러미와 더미들, 지상의 귀중한 보석과 금속보다도 경이로운 것은 바로 사람의 손에서 재능을 통해 만들어지는 물건이다.\n\n기발한 장치, 숨이 멎을 듯 아름다운 장식, 섬세한 솜씨야말로 [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]의 생명줄이며, 우리의 이름은 품질과 신뢰의 상징이다."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "돈의 흐름이 멎는다면 위대한 왕들조차 거지만큼 무력해지기 마련이다. 하지만 거미줄의 수많은 가닥처럼 신용 거래망이 왕을 둘러싸고 있다.\n\n이 땅 전역의 궁정에서 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] 이름을 들을 수 있다. 그 이름은 중개와 거래에서 믿음을 주며, 어려울 때면 언제나 기꺼이 도울 준비가 되어 있지만, 가볍게 이용당하지는 않는다."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "여행의 서책"
 gdp_merchant.8010.desc: "나만큼 많은 것을 보고, 내 독특한 경험을 온전히 겪어 본 자는 거의 없다. 거지부터 강력한 지배자에 이르기까지, 모두에게 있어 이 세계의 머나먼 땅은 불확실하다. 따라서 이들은 그 어둠을 밝혀 줄 통찰과 여흥을 바란다.\n\n나는 자리에 앉아 [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier] 여행에서 겪었던 흥미진진한 사건을 떠올렸다. 그러면서 이방인들, 그리고 내 후손들이라면 무슨 이야기를 가장 듣고 싶어 할지 고민하기 시작했다."
 gdp_merchant.8010.a: "외국의 관습과 예법에 초점을 맞추겠다."
 gdp_merchant.8010.a.tt: "이 서책의 품질은 당신의 [GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|V] #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])#! 및 [GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|V] #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )])#! [trait_level_track_xp|E]에 크게 영향받을 것임"
 gdp_merchant.8010.b: "독자들은 무역의 요령과 시장 통찰을 바라겠지."
 gdp_merchant.8010.c: "내 책을 통해 이국의 도시와 경이를 묘사하겠다."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "예상보다 오랜 시간이 걸렸지만, 드디어 그럭저럭 만족스러운 글이 나온 것 같다. 나는 [poi.GetName](으)로 떠났던 여정에 관해 자세히 적었으며, 여행에서 겪었던 일화를 곁들였고, 이국적인 [author.Custom('GetTravelogueTopic')]에 대한 이야기를 특히 강조했다.\n\n"
 gdp_merchant.8011.weak: "책을 훑어본 나는 실망했다. 혹시 더 노력해야 하지 않았나 싶은 생각도 들었다. 하지만 이제 그만 깃펜을 내려놓을 때였다."
 gdp_merchant.8011.mid: "책을 훑어본 나는 내 작품에 뿌듯함을 느꼈다. 하지만 아직도 뭔가 특별한 매력이 없는 것 같다는 느낌이 들었다."
 gdp_merchant.8011.great: "책을 훑어본 나는 내가 직접 쓴 말을 보고도 웃음을 참지 못했다. 구절을 읽을 때면 그 순간을 다시 새롭게 겪는 듯 짜릿한 기분이 들었다. 기억에 남을 만한 작품이 나왔다!"
 gdp_merchant.8011.a: "일단은 내가 간직해야지."
 gdp_merchant.8011.b: "이 책은 회사 서재를 장식할 것이다."
 travelogue_description_full: "상인 [author.GetTitledFirstName](이)가 쓴 공상이 가미된 [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier] 여행기입니다. 외국의 [author.Custom('GetTravelogueTopic')]에 대한 경험에서 우러나온 저자의 통찰을 확인할 수 있습니다.\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]의 여행"
 travelogue_name_2: "[poi.GetCounty.GetName](으)로 가는 길"
 travelogue_name_3: "여행자 [author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]"
 travelogue_name_4: "[poi.GetCounty.GetName](으)로"
 travelogue_name_5: "[author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]에서의 모험"
 travelogue_name_6: "[author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip] 여행"
 travelogue_name_7: "머나먼 땅"
 travelogue_name_8: "그리고 다시 돌아오다"
 travelogue_name_9: "[poi.GetCulture.GetCollectiveNounNoTooltip]에 관해서"
 travelogue_name_10: "신비의 [poi.GetTitle.Custom('BaronyTownType')|U], [poi.GetNameNoTierNoTooltip]"
 travelogue_name_11: "일천"
 travelogue_name_12: "여행"
 travelogue_name_13: "여정"
 travelogue_name_14: "[author.GetFirstNamePossessiveNoTooltip] 모험"
 travelogue_topic_customs: "관습"
 travelogue_topic_markets: "시장"
 travelogue_topic_places: "장소"
 travelogue_description_quality_weak: "조악한 솜씨로 쓰였으며, 몹시 허황된 서책입니다."
 travelogue_description_quality_mid: "통찰력이 엿보이는 구절이 약간 실려 있는 서책입니다."
 travelogue_description_quality_great: "극적이고 탁월한 솜씨로 쓰인 강렬한 서책입니다."
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: 호기심 많은 방문객"
 gdp_merchant.8021.suzerain: "영광스럽게도 내 후원자 [visitor.GetTitledFirstName](이)가"
 gdp_merchant.8021.merchant: "동료 상인이자 [visitor.GetPrimaryTitle.GetDefinitiveName]의 소유주인 [visitor.GetTitledFirstName](이)가"
 gdp_merchant.8021.laamp: "[visitor.GetPrimaryTitle.GetDefinitiveName](이)라는 여행자 무리의 지도자인 [visitor.GetTitledFirstName](이)가"
 gdp_merchant.8021.ruler: "기쁘게도 지역 영주인 [visitor.GetTitledFirstName](이)가"
 gdp_merchant.8021.fallback: "겸허한 여행자인 [visitor.GetTitledFirstName](이)가"
 gdp_merchant.8021.desc: "내 거주지에서 나를 찾았다.\n\n[visitor.GetSheHe|U]는 우리의 소장품을 둘러보며 얼굴이 환해졌고, 표정을 보니 경이로움에 사로잡힌 듯했다.\n\n\"이렇게 만나서 반갑소, [ROOT.Char.GetTitledFirstNameNoTooltip]! 그대 회사의 위업은 물론이고, 그대의 이국적인 소장품에 관한 얘기도 들었소... 혹시 이야기를 좀...\" [visitor.GetSheHe]가 숨을 들이켜더니 [artifact.GetName](을)를 바라보았다.\n\n\"아니! 이건 또 뭐요...?\""
 gdp_merchant.8021.curio: "[visitor.GetSheHe|U]는 그 유물을 사방에서 살펴보았다. 여기에 엮인 사연을 전부 듣기 전까지는 만족하지 않겠다는 듯한 모습이었다."
 gdp_merchant.8021.library: "[visitor.GetSheHe|U]는 조심스럽게 그 책장을 넘기며 끝도 없이 질문을 퍼부었다."
 gdp_merchant.8021.creature: "[visitor.GetSheHe|U]는 짐승의 우아한 모습에 감탄했고, 먹이를 먹는 모습을 즐겁게 지켜보았다."
 gdp_merchant.8021.a: "맞습니다, 대단하긴 하지요."
 gdp_merchant.8021.b: "혹시 가질 생각 없습니까?"
 gdp_merchant.9021.opening: "반갑소, [merchant.GetTitledFirstNameNoTooltip]."
 gdp_merchant.9021.diarch.desc: "[commissioner.GetName]의 [commissioner.GetDiarchTitle](으)로서, [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]에게 할 의뢰가 있소."
 gdp_merchant.9021.no_diarch.desc: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]에게 할 의뢰가 있소."
 gdp_merchant.9021.desc: "\n\n[trade_market.GetName|l]에 [target.GetName](이)가 부족하오. 이 지역에 이 상품을 들여준다면, 그만한 보상을 하겠소."
 gdp_merchant.9021.a: "의뢰를 받아들이겠습니다."
 gdp_merchant.9021.b: "안타깝지만 거절해야 할 것 같습니다."
 gdp_merchant.9021.b.cooldown_tt: "#V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#!년 동안 다른 [commission|E] 요청을 받지 않게 됨"
 gdp_merchant.9005.t: "강제 퇴출"
 gdp_merchant.9005.desc_intro: "내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName](이)가 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] 사무실로 들이닥쳤다. [courtier.GetHerHis] 얼굴은 붉게 달아올라 있었다.\n\n\"후원자 [expeller.GetTitledFirstName](이)가 이렇게 전했습니다.\" [courtier.GetSheHe]가 말했다. \"우리 회사가 당장 장부를 닫고 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]에서 떠나야 한답니다!\"\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.GetTitledFirstName|U](이)가 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]에게 [expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip]에서 나갈 것을 명령했다.\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "우리를 향한 [expeller.GetTitledFirstNamePossessiveNoTooltip] 신뢰가 바닥나 버렸군."
 gdp_merchant.9005.desc_body.enemies: "[expeller.GetTitledFirstNamePossessiveNoTooltip] 적대감에는 끝이 없나?"
 gdp_merchant.9005.desc_body.fallback: "우리가 여기서 그렇게 많은 일을 했는데..."
 gdp_merchant.9005.a: "결국 이렇게 됐군."
 gdp_merchant.9005.a.tt: "당신의 [company|E]가 [expeller.GetShortUINamePossessive] [realm|E]을 떠나게 됨"
 gdp_merchant.9100.t: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] 파트리키 가문"
 gdp_merchant.9100.desc: "[new_patrician_liege.GetPrimaryTitle.GetNameNoTier]의 콧대 높은 가문들 앞에 우리의 능력을 충분히 증명하고, [new_patrician_liege.GetTitledFirstName]에게 적절한 #emp 보상#!을 주자 우리 가문의 승격 요청이 승인되었다.\n\n드디어 [ROOT.Char.GetHouse.GetBaseName](이)가 단순한 상인 가문이 아니며, 이 [new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]의 평의회에서 다른 존경받는 파트리키 가문과 함께 앉을 수 있고, 심지어 법에 따라 [new_patrician_liege.GetHouse.GetBaseName](와)과도 동일하다는 사실을 의심의 여지 없이 단언해 줄 문서를 손에 넣었다!"
 gdp_merchant.9100.a: "첫 평의회에 참석할 순간이 무척 기다려지는군."
 merchant_patrician_transition_domicile_tt: "당신의 [domicile_buildings|E]이 유지됨"
 gdp_merchant.9110.t: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] 상인 가문"
 gdp_merchant.9110.desc: "옛 공화국이 무너지자, [ROOT.Char.GetHouse.GetBaseName](을)를 포함해 [new_merchant_location.GetBaronyNameExplicitly]의 자랑스럽던 파트리키 가문들은 단순한 상인 가문으로 하락했으며 운명과 현지 영주인 [ROOT.Char.GetSuzerain.GetTitledFirstName]의 변덕에 좌우되는 신세가 되었다.\n\n평의회와 공화국의 보호를 빼앗겼으니, 예전의 위상을 어느 정도라도 유지하고 싶다면 이제 [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier]의 법에 의지해야만 한다."
 gdp_merchant.9110.a: "어쩌다 이 지경이 됐지..."
 broke_deal_opinion: "거래 파기"
 gdp_repudiated_my_loan_opinion: "내 대출을 거부함"
 gdp_interest_free_loan_opinion: "이자 없이 대출함"
 gdp_usurious_loan_opinion: "내게 고리대금업으로 금화를 대출해 줌"
 gdp_merchant_unity_intermarriage_desc: "다른 [merchant|E] [house|E]과 결혼함"
 gdp_merchant_unity_noble_marriage_desc: "귀족 [house|E]과 결혼함"
 gdp_merchant.2000.t: "텅 빈 시장: [needed_good.GetNameNoTooltip]"
 gdp_merchant.2000.desc.intro: "나는 "
 gdp_merchant.2000.desc.disaster: "재해가 닥친 "
 gdp_merchant.2000.desc.war: "전쟁에 짓밟힌 "
 gdp_merchant.2000.desc.plague: "역병이 지나간 "
 gdp_merchant.2000.desc.unrest: "무질서한 "
 gdp_merchant.2000.desc.stalls: "[starving_province.GetNameNoTooltip]의 거리를 걷다가, 평소 사람이 붐비던 [starving_province.Custom('GetRegionalMarketTermGloss')](이)가 조용하다는 사실을 눈치챘다.\n\n음식 가판대는 오래된 [ROOT.Char.Custom('GetLocalStreetFoodPlural')], 썩은 [ROOT.Char.Custom('RegionalRootVegetablePlural')] 몇 가지를 제외하고는 거의 비어 있었다. 수척해진 사람들이 거리 양옆에서 쓰레기 더미를 뒤지고 있었다."
 gdp_merchant.2000.a: "남은 것이라도 잘 붙들고 있어야겠다."
 gdp_merchant.2000.b: "사람들이 탓할 이를 찾겠군."
 gdp_merchant.2000.c: "이건 내가 상관할 문제가 아니다."
 gdp_merchant.2010.t: "[craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip] 독점:"
 gdp_merchant.2010.t.smith: "대장장이"
 gdp_merchant.2010.t.goldsmith: "금세공인"
 gdp_merchant.2010.t.carpenter: "목수"
 gdp_merchant.2010.t.tanner: "무두장이"
 gdp_merchant.2010.t.potter: "도공"
 gdp_merchant.2010.desc.intro: "내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName](은)는 [workshop_province.GetName]에 있다는 장인 [craftsman.GetFirstName]에 관해 끝도 없이 얘기해 댔다. 이제 그 사람의 작품을 마주하고 나니, 왜 그렇게 난리였는지 알 것 같았다.\n\n[craftsman.GetFirstNameNoTooltip](은)는 작업하던 물건에서 눈도 떼지 않은 채 나를 맞이했다. \"제 작품은 편하게 둘러보시지요.\"\n\n나는 "
 gdp_merchant.2010.desc.weapon: "훌륭한 무기를 보고 경외심을 느꼈다."
 gdp_merchant.2010.desc.chalice: "정교하게 세공된 성배를 보고 경외심을 느꼈다."
 gdp_merchant.2010.desc.box: "정교하게 조각된 나무 상자를 보고 경외심을 느꼈다."
 gdp_merchant.2010.desc.saddle: "완벽하게 조각된 안장을 보고 경외심을 느꼈다."
 gdp_merchant.2010.desc.vase: "섬세하게 칠한 도자기 꽃병을 보고 경외심을 느꼈다."
 gdp_merchant.2010.desc.craftsmanship: "이건 평범한 재주가 아니었다."
 gdp_merchant.2010.a: "이런 재능을 낭비해서는 안 되지."
 gdp_merchant.2010.b: "그대가 [associate.GetFirstNameNoTooltip]에게 뭔가 가르쳐 줄 수 있으면 좋겠군."
 gdp_merchant.2010.c: "여기서 그대의 기술을 구경하고 싶네만."
 gdp_merchant.2015.t: "[counsel_good.GetNameNoTooltip]의 대가"
 gdp_merchant.2015.desc: "내 후견자 [patron.GetTitledFirstName]에게서 뜻밖의 부름이 왔다. [patron.GetHerHis] [patron.Custom('quirk_neg_adjective')] 성정을 떠올리며 나는 두려움 속에 알현실로 들어섰다.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], 얘기 좀 합시다. [counsel_good.GetNameNoTooltip]의 품질과 시장 가치에 관해 알려 주겠소?\""
 gdp_merchant.2015.a: "\"마침 제가 그 분야를 잘 알아서 말입니다.\""
 gdp_merchant.2015.a.tt: "[counsel_category.GetName] [trade_category_short|E]에서 [expertise_level|E] #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! 이상에 도달해야 함"
 gdp_merchant.2015.b: "\"제가 조금 아는 게 있기는 한데...\""
 gdp_merchant.2015.a.monopoly.tt: "[monopoly_i][trade_monopoly|E] 승낙 확률: [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip](이)가 당신을 권위자로 여김"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip](이)가 당신의 거짓말을 간파함"
 gdp_merchant.2015.b.monopoly.tt: "[monopoly_i][trade_monopoly|E] 승낙 확률: [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "\"제 삶의 목표는 단순한 무역 그 이상입니다.\""
 gdp_merchant.2020.t: "탁자의 자리"
 gdp_merchant.2020.desc: "[patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]의 내 후견자 [patron.GetTitledFirstName](이)가 소유한 [patron.GetCapitalLocation.GetHolding.GetType.GetName|l]에서 식사하는 영광을 얻게 되었다. 내 자리로 걸어가는데 [courtier_1.Custom('NoblewomanNobleman')] [courtier_1.GetTitledFirstName](이)가 이글거리는 눈으로 나를 지켜보았다. 다른 문객을 향한 [courtier_1.GetHerHis|U] 속삭임은 거의 들리지 않았지만, \"쓰레기\"라든가 \"평범한 행상인한테서 받은 뇌물\" 따위의 말은 알아들을 수 있었다. [patron.GetFirstNameNoTooltip](이)가 일어서서 입을 열자 말소리들이 사라졌다.\n\n\"신뢰하는 동료들, 새로 알게 된 지인들, 헤어진 지 오래였던 형제들이여. 오늘 밤 이곳에 모였으니 내 환대를 즐기시기를 바라오. 연회를 시작합시다!\""
 gdp_merchant.2020.a: "\"멋지군, 이런 기회를 앞으로 더 자주 가집시다!\""
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName](은)는 가급적 빠르게 #weak (1~3개월 이내에)#! [GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName](을)를 시작할 것임"
 gdp_merchant.2020.b: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] 가문이 마땅히 받아야 할 인정을 받게 되겠군."
 gdp_merchant.2020.b.unity_gain.desc: "귀족 사이에서 우리 집안의 이름으로 자리를 차지함"
 gdp_merchant.2020.c: "\"좋습니다, 이제 사업 얘기를 합시다!\""
 gdp_merchant.2020.c.unity_loss.desc: "진정으로 중요한 사안인 사업에 집중함"
 gdp_merchant.2025.t: "열등한 상인"
 gdp_merchant.2025.desc: "[charter_rival.GetTitledFirstName](은)는 평소처럼 책무의 부름이 있어도 나타나지 않았다. 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] [patron.GetTitledFirstName](와)과 나는 함께 [charter_rival.GetHerHis] 도착을 기다렸다. 그러나 결국 [charter_rival.GetHerHim] 없이 이번 달의 장부를 살펴보기로 했다.\n\n증명이 끝나지 않은 거래 계약서가 여전히 탁자에 널려 있었지만, [patron.GetFirstNameNoTooltip](은)는 양피지를 옆으로 밀어 치우더니 나한테 시선을 돌렸다.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], 우리 둘만 있으니 묻는 얘긴데, 그대는 [charter_rival.GetFirstNameNoTooltip](을)를 #EMP 진심으로#! 어떻게 여기나? [charter_rival.GetHerHim]에게 특허장을 내렸는데, 옳은 선택이었다고 생각하나?\""
 gdp_merchant.2025.a: "\"저한테 주시는 게 더 낫지 않겠습니까?\""
 gdp_merchant.2025.a.charter.tt: "[charter_i][request_merchant_charter|E] 승낙 확률: [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "\"[patron.Custom('FormOfAddressForLiege')], 그 훌륭하신 판단력을 믿습니다.\""
 gdp_merchant.2025.b.unity_gain.desc: "후견자의 판단력을 신뢰한다는 사실을 보여줌"
 gdp_merchant.4000.t: "길 바깥의 우리 자리"
 gdp_merchant.4000.desc.intro: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] 시장에 들어섰더니 내 상인들이 외딴 골목으로 밀려나 있었다. 이들의 탁자는 근처에 있는 돼지우리의 오물 사이에 박혀 있었다.\n\n"
 gdp_merchant.4000.desc.patron: "내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))](이)가"
 gdp_merchant.4000.desc.patron_representative: "[patron.GetTitledFirstNamePossessive] [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))] [market_character.GetName](이)가"
 gdp_merchant.4000.desc.body: "바람이 불어오는 쪽에 멀찍이 서서, 사원들이 나한테 불평을 쏟아내는 모습을 지켜보며 히죽이고 있었다.\n\n내가 다가가자 [market_character.GetFirstNameNoTooltip](이)가 말했다."
 gdp_merchant.4000.desc.body.patron: "\"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l] 사업에 딱 걸맞은 자리 아닌가?\" [market_character.GetSheHe|U]가 돼지들을 향해 손짓했다."
 gdp_merchant.4000.desc.body.patron_representative: "\"자네 후견자를 대신해 내가 왔지.\" [market_character.GetHerHis] 턱을 들어 올린 모습과 그 눈에 깃든 반짝임을 보아하니, 이 소식을 전달하는 임무가 무척 즐거운 모양이었다."
 gdp_merchant.4000.desc.outro: "\"자네는 우리 관습을 따르지도 않고, [Glossary( '공자', 'CONFUCIUS_GLOSS' )]의 말씀에 귀를 기울인 적도 없지. 생각을 바꾸기 전까지는 여기가 자네 자리가 될 걸세.\""
 gdp_merchant.4000.b: "도에 관해 배워야겠다."
 gdp_merchant.4000.b.tt: "다음 [GetActivityType('activity_adult_education').GetName](을)를 [GetTrait('confucian_education').GetName(GetNullCharacter)] 중심지에서 주최한다면 주최에 드는 [gold|E] 비용이 #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')]%#! 감소함"
 gdp_merchant.4000.c: "내가 본때를 보여주지..."
 gdp_merchant.4010.t: "배움의 문"
 gdp_merchant.4010.desc: "시장에서 긴 하루를 보낸 뒤, 차를 마시며 마무리하고 있었다. 이 지역의 학자가 이따금 호기심 가득한 눈으로 나를 바라보곤 했다.\n\n\"[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip](은)는 남을 업신여기는 무리야.\" [student.GetHerHim]가 친구에게 중얼거리는 소리가 들려왔다. \"올바른 의례를 따르는 우리보다 자기들이 낫다고 생각하는 놈들이야. 우린 성실하게 시험을 치러 합격하지 않았나. 반면에 [ROOT.Char.GetFirstNameNoTooltip](은)는, 남을 착취하는 것 말고 지금까지 이룬 게 뭐가 있지?\""
 gdp_merchant.4010.a: "그 시험이란 거, 별로 어렵진 않겠지."
 gdp_merchant.4010.b: "\"자네들은 누구의 차를 마시고 있나?\""
 gdp_merchant.4010.c: "\"이곳에서 없어도 되는 고객이 있다면 그게 누굴까?\""
 gdp_merchant.4020.t: "비단길"
 gdp_merchant.4020.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]에 들어서자 인파에 갇혔다. 사람과 짐승 모두가 [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownTypePossessive')] 문을 통해 쏟아져 나와 끝없는 상단 행렬에 합류하고 있었다. 이곳의 단봉낙타들은 짐을 얼마나 실었는지 그 높이가 코끼리만큼이나 높았고, 등에 짊어진 그 엄청난 짐의 무게로 인해 몸이 이리저리 기울어지고 있었다.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "거리의 모퉁이마다 무역상들이 믿기지 않을 만큼 엄청난 양의 상품을 내리고 있었다.\n\n음식을 아예 옆으로 밀어놓은 가판대도 보였다. 생산량이 너무도 많아, 상하기 전에 다 팔아치우는 게 불가능하기 때문이었다."
 gdp_merchant.4020.desc.steady_trading: "한 곳에 이렇게 많은 상품이 모인 것은 처음 보았다. 이곳에는 사람이 너무도 많아, 우리는 시끄러운 군중으로 이루어진 하나의 덩어리가 되어버렸다.\n\n어느 상단의 행렬이 흔들리면 항상 채찍을 휘두르는 주인이 나타나곤 했다."
 gdp_merchant.4020.desc.hardship: "외국어로 여기저기서 흘러가는 대화를 주워들은 결과, 이 시장은 지금 힘든 시기를 겪고 있었다.\n\n이곳이 가장 번성하던 시절에는 어떤 모습이었을까. 오가는 상품의 양만 해도 상상을 초월했을 것이다..."
 gdp_merchant.4020.a: "이게 미래로 향하는 길이다."
 gdp_merchant.4030.t: "머나먼 곳의 부"
 gdp_merchant.4030.desc.intro: "내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName](이)가 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] 사무실에 들어왔다. 눈이 반짝이고 있었는데, 금 더미를 바라볼 때 말고는 보여준 적 없던 눈빛이었다.\n\n[associate.GetSheHe|U]가 상자를 건네주었다. 열어 보니"
 gdp_merchant.4030.desc.silk: "여태껏 본 것 중에서 가장 고운 비단이 있었다. 매우 얇고 믿을 수 없을 만큼 가벼웠다.\n\n"
 gdp_merchant.4030.desc.spice: "갓 갈아낸 향긋한 가루가 있었다.\n\n\"[rumoured_market_owner.Custom('RegionalSpice')](이)라고 한답니다.\" [associate.GetSheHe]가 알려 주었다."
 gdp_merchant.4030.desc.jade: "표면을 유리처럼 매끄러워질 때까지 다듬어 광을 낸 옥이 있었다.\n\n"
 gdp_merchant.4030.desc.ivory: "작은 성채의 모습을 새긴 상아 조각이 있었다.\n\n"
 gdp_merchant.4030.desc.outro: "\"비단길에 [rumoured_market_owner.GetCulture.GetNameNoTooltip|l] 연줄이 있다는 상인한테서 샀습니다. 우리가 여기 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]에서 버는 금화는 이 사람들이 [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]의 [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')]에서 버는 것에 비하면 아무것도 아니더군요.\""
 gdp_merchant.4030.a: "\"비단길이라고 했나?\""
 gdp_merchant_4030_a_tt: "당신이 다음 #V 5#!년 이내에 [company|E]를 [rumoured_market.GetName](으)로 옮기면 #V 10년#! 동안 해당 [market|E] 내에서 [GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip]을 획득함"
 gdp_merchant.4030.b: "\"고맙네. 정말 사려 깊은 선물이로군.\""
 gdp_merchant.4030.c: "\"[associate.GetFirstNameNoTooltip], 우린 여기서 중요한 사업을 진행하고 있네.\""
 merchant_unity_local_business: "[silk_road|E]보다 근처의 사업을 우선함"
 gdp_merchant.4030.artifact.silk: "[rumoured_market_location.GetBaronyNameExplicitlyNoTooltip] 비단"
 gdp_merchant.4030.artifact.silk.desc: "비단길의 시장에서 구매한 아주 얇은 비단 견본입니다. 믿기지 않을 만큼 가벼우며, 매끄러운 감촉을 자랑합니다."
 gdp_merchant.4030.artifact.spice: "향신료 주머니"
 gdp_merchant.4030.artifact.spice.desc: "비단길의 시장에서 가져온 향긋한 향신료 주머니입니다."
 gdp_merchant.4030.artifact.jade: "광택 있는 옥"
 gdp_merchant.4030.artifact.jade.desc: "비단길의 시장에서 온 옥입니다. 표면을 유리처럼 매끄러워질 때까지 다듬어 광을 냈습니다."
 gdp_merchant.4030.artifact.ivory: "상아 성채"
 gdp_merchant.4030.artifact.ivory.desc: "비단길의 시장에서 온 상아 조각입니다. 공들인 손길로 작은 성채의 모습을 새겨 놓았습니다."
 gdp_merchant.5000.t: "발각된 이자"
 gdp_merchant.5000.desc.debtor: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] 사무실로 향하는 문이 벌컥 열렸다. 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName](이)가 내 사원들을 옆에 낀 채 들어왔다."
 gdp_merchant.5000.desc.debtor_paranoid: "문이 삐걱거리는 소리로 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName](이)가 다가온다는 사실을 알 수 있었다. [accuser.GetSheHe]는 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] 사무실 안으로 부드럽게 걸어 들어왔다."
 gdp_merchant.5000.desc.bishop: "두건을 쓴 인물이 다가오자 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]의 문간이 어두워졌다. 얼마 지나지 않아 [accuser.GetFirstName] [accuser.Custom('GetActualBishopTitle')](이)가 내 사원들을 따라 들어와 내 앞에 섰다."
 gdp_merchant.5000.desc.clergy: "두건을 쓴 인물이 다가오자 [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]의 문간이 어두워졌다. 얼마 지나지 않아 [accuser.GetFirstName] [accuser.Custom('PriestTitle')](이)가 내 사원들을 따라 들어와 내 앞에 섰다."
 gdp_merchant.5000.desc.steward: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] 사무실로 향하는 문이 벌컥 열렸다. [debtor.GetFirstNamePossessive] [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))](이)가 내 사원들을 옆에 낀 채 성큼성큼 들어왔다."
 gdp_merchant.5000.desc.break: "\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, '나', debtor.GetTitledFirstName )]한테 지급한 대출금에 불일치가 있는 것 같소.\" [accuser.GetSheHe]가 말했다."
 gdp_merchant.5000.desc.accepted: "\"거짓말을 듣는 건 좋아하지 않아서. 회사의 장부를 보여주시오. 사실관계를 명확히 해 봅시다.\""
 gdp_merchant.5000.desc.discouraged.debtor: "\"[accuser.GetFaith.Custom('HouseOfWorshipBase')]에서 고리대금업을 못마땅하게 여긴다는 사실은 잘 알 거요. 상황을 여기서 확실히 정리하고, 이 일로는 더 얘기하지 않도록 합시다.\""
 gdp_merchant.5000.desc.shunned.debtor: "\"[accuser.Custom('DefaultPriestTitlePlural')]들이 이 사실을 알게 되면 그대와 그대 사업을 호되게 비판하겠지. 난 그대가 살아날 기회를 주러 온 거요.\""
 gdp_merchant.5000.desc.accepted.steward: "\"그대의 후견자는 거짓말을 싫어하시는 분이오. 회사의 장부를 보여주시오. 숫자를 바로잡아 봅시다.\""
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "\"세상에 공짜로 얻을 수 있는 건 없소. 그대도 상인이니 잘 알 텐데? 그런데도... 뭐, 일단 이 문제는 지금 여기서 조용히 해결했으면 하오. 안 그러면 이 실수로 그대의 사업이 해를 입고, 더 나아가 상업에도 해를 끼칠 수 있으니.\""
 gdp_merchant.5000.desc.shunned: "\"그대가 사업을 진행하는 방식은 참으로 비열하오. 상인이 존재하지도 않는 걸 팔다니? 용서를 빌지 않는다면 이 일을 법정까지 끌고 갈 수밖에 없소.\""
 gdp_merchant.5000.a: "\"내가 [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip](을)를 대신한다는 사실을 모르시오?\""
 gdp_merchant.5000.a.debtor: "\"설마 우리 거래에 해를 끼칠 생각은 없겠지요?\""
 gdp_merchant.5000.b: "\"보상으로 우리 자산을 가져가시오.\""
 gdp_merchant.5000.c: "\"자, 세부 항목을 살펴봅시다.\""
 gdp_merchant.5000.c.success: "당신의 회계가 흠잡을 데 없음"
 gdp_merchant.5000.c.failure: "숫자가 엉성함"
 gdp_merchant.5000.c.critical: "이자가 조잡하게 숨겨져 있음"
 gdp_merchant.5000.d: "\"이자를 양보해 줄 수 있을 것 같군...\""
 gdp_merchant.5000.e: "\"대출은 없던 일로 합시다.\""
 gdp_usury_penance_seized_goods_modifier: "압류당한 상단"
 gdp_usury_penance_seized_goods_modifier_desc: "해당 인물의 사업은 숨겨졌던 이자 대출이 발각되며 타격을 입었습니다."
 gdp_usury_penance_same_faith_scandal_modifier: "알려진 고리대금업자"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "해당 인물은 부정직한 고리대금업 행위를 발각당해 타격을 입었습니다."
 gdp_usury_penance_forgive_interest_tt: "숨겨진 [interest|E]가 탕감됨 #weak ([TARGET_CHARACTER.GetShortUIName](이)가 [gold_i|E]$VALUE|0V$의 빚을 짐)#!"
