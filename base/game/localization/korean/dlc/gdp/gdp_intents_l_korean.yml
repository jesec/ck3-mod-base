l_korean:
 schmooze_intent: "친교 맺기"
 schmooze_intent_desc: "사업의 바퀴에 기름칠하며 [competitiveness|E]을 개선할 방법을 찾습니다."
 gdp_merchant_schmooze_modifier: "귀족과의 친교"
 gdp_merchant_schmooze_modifier_desc: "해당 인물은 연회에서 이 시장의 현지 귀족과 친교를 맺었습니다."
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U](이)가 [TARGET_CHARACTER.GetShortUINameNoTooltip](와)과 친교를 맺음"
 gdp_schmooze_successful: "[CHARACTER.GetTitledFirstName](이)가 기회를 놓치지 않고 [TARGET_CHARACTER.GetShortUINameNoTooltip](와)과 친교를 맺음"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U](이)가 귀족과 친교를 맺음"
 gdp_schmooze_successful_empty: "[CHARACTER.GetTitledFirstName](이)가 기회를 놓치지 않고 귀족과 친교를 맺음"
 gdp_schmooze_events.1000.t: "[schmoozee.GetFirstNameNoTooltip](와)과의 친교"
 gdp_schmooze_events.1000.desc: "우리 상인들은 귀족과 어깨를 나란히 할 기회가 생기면 주저 없이 뛰어들어야 한다. 영리한 말이나 괜찮은 선물 하나만 건네도 이 귀족이 사업의 길을 가로막거나, 경쟁자의 사업을 지지하는 일을 막을 수 있다.\n\n역겨운 아첨과 지나치게 직설적인 태도 사이에서 아슬아슬하게 줄타기하며, 최선을 다해 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))] [schmoozee.GetTitledFirstName]의 마음을 얻어야 한다."
 gdp_schmooze_events.1000.a: "\"[schmoozee.GetTitleAsNameNoTooltip], 이 선물을 받아주십시오.\""
 gdp_schmooze_events.1000.b: "\"저처럼 하잘것없는 상인은 저보다 나은 분을 본받아야 하는 법이지요.\""
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip](이)가 우쭐해함"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip](이)가 어이없어함"
 gdp_schmooze_events.1000.c: "\"그대와 대화할 수 있어 참으로 영광입니다.\""
 gdp_schmooze_events.1000.d: "\"전 [schmoozee.GetTitleAsNameNoTooltip]에 걸맞은 수많은 물건을 거래하지요!\""
 gdp_schmooze_events.1010.t: "선의의 경쟁"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName](와)과 나는 식사를 함께하며 [ROOT.Char.Custom('RegionalDrink')](을)를 마시고 [ROOT.Char.Custom('GetExpensiveMeal')](을)를 먹었다. 그러면서 각자의 회사가 이룬 성공을 번갈아 가며 뽐냈다."
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName](와)과 나는 [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] 그늘에서 각자의 회사가 이룬 성공을 번갈아 가며 뽐냈다."
 gdp_schmooze_events.1010.outro: "\n\n서로 엄포를 놓긴 했지만, 많은 사안에서 우리의 의견이 일치했다. 이 사람이 나한테 유용할지도 모른다는 생각이 들었다. 아마 상대도 같은 생각을 했을 것이다."
 gdp_schmooze_events.1010.a: "\"돈만 준다면야 자리를 내드릴 수 있소.\""
 gdp_schmooze_events.1010.b: "\"받으시오. 이제 우리 앞길을 막지 마시오.\""
 gdp_schmooze_events.1010.c: "\"내 칭찬을 퍼뜨려 준다면 나 역시 그대의 칭찬을 퍼뜨리겠소.\""
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip](이)가 동의함"
 gdp_schmooze_events.1010.c.failure: "[schmoozee.GetFirstNameNoTooltip](이)가 관심을 보이지 않음"
 gdp_schmooze_events.1010.d: "지금은 때가 아니다."
 gdp_schmooze_events.1030.t: "분산된 주의"
 gdp_schmooze_events.1030.feast: "저녁이 지나간다. 나는 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))] [schmoozee_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))] [schmoozee_2.GetTitledFirstName] 사이에 끼어 있었다. 귀족들은 구운 [schmoozer.Custom('GetRegionalFish')] 요리를 앞에 두고 사업과 중개에 관한 가상의 원칙을 주제로 느긋하게 토론하고 있었다."
 gdp_schmooze_events.1030.hunt: "사냥이 이어진다. 나는 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))] [schmoozee_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))] [schmoozee_2.GetTitledFirstName] 사이에 끼어 있었다. 사냥개가 사냥감의 냄새를 찾아다니는 동안, 귀족들은 사업과 중개에 관한 가상의 원칙을 주제로 느긋하게 토론하고 있었다."
 gdp_schmooze_events.1030.outro: "\n\n마침내 [schmoozee_1.GetFirstNameNoTooltip](이)가 얘기를 마무리하려는지 나를 바라보았다. \"자, [schmoozer.GetTitledFirstNameNoTooltip]. 그대는 상인 아닌가. 그대도 이 일에 관해서라면 할 얘기가 많을 텐데?\""
 gdp_schmooze_events.1030.a: "\"핵심을 짚으셨습니다, [schmoozee_1.GetTitleAsNameNoTooltip].\""
 gdp_schmooze_events.1030.b: "\"[schmoozee_2.GetTitledFirstNameNoTooltip] 님이 잘 알고 계시는군요.\""
 gdp_schmooze_events.1030.c: "\"두 분의 통찰력이 대단합니다. 정말로요.\""
 gdp_schmooze_events.1030.c.success: "귀족들이 우쭐해함"
 gdp_schmooze_events.1030.c.failure: "귀족들이 어이없어함"
 gdp_schmooze_events.1030.d: "\"제가 어떻게 감히 평하겠습니까.\""
 gdp_schmooze_events.1050.t: "시장 이동"
 gdp_schmooze_events.1050.feast: "축제가 잠시 중지되며 문객들이 서로 어울리고 시종들이 흐름을 따라잡을 기회가 생겼다."
 gdp_schmooze_events.1050.hunt: "우리는 잠시 멈춰 [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')] [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')](을)를 살펴보았다. 사냥개와 몰이꾼이 먼저 앞으로 나아갔다."
 gdp_schmooze_events.1050.outro: "그런데 나도 모르게 우리 시장의 주요 인사들을 골라내고 있었다.\n\n[schmoozee_1.GetTitledFirstName](은)는 [market_1.GetLocationTitle.GetNameNoTier]에서 알아두면 좋은 인물이고, [schmoozee_2.GetTitledFirstName] 또한 [market_2.GetLocationTitle.GetNameNoTier]에서 비슷한 위치를 차지하고 있다."
 gdp_schmooze_events.1050.three: "또한 [market_3.GetLocationTitle.GetNameNoTier]에 근거지를 둔 [schmoozee_3.GetTitledFirstName]의 모습도 보였다."
 gdp_schmooze_events.1050.a: "\"[schmoozee_1.GetFirstNameNoTooltip], 그대와 얘기해 보고 싶었는데!\""
 gdp_schmooze_events.1050.b: "\"[schmoozee_2.GetFirstNameNoTooltip], 아주 재미있는 얘기를 들었지 뭐요.\""
 gdp_schmooze_events.1050.c: "\"[schmoozee_3.GetFirstNameNoTooltip], 수다나 좀 떨어 봅시다!\""
 gdp_schmooze_events.1050.d: "시장은 안 그래도 잘 굴러가고 있다."
 gdp_schmooze_events.1060.t: "관심 다툼"
 gdp_schmooze_events.1060.feast: "하인들이 여러 식탁을 돌며 잔을 채우고 다음 요리를 내려놓았다."
 gdp_schmooze_events.1060.hunt: "우리는 잠시 멈춰 물주머니에서 물도 마시고, 다리를 뻗으며 쉬었다."
 gdp_schmooze_events.1060.outro: "내 경쟁자인 [rival.GetName](이)가 뻔뻔하게도 [schmoozee.GetName]에게 아첨하는 모습이 보였다.\n\n음흉한 이 [rival.GetWomanMan]은 히죽거리며 자기 무역상들이 가져다줄 혜택을 떠벌렸고, 그러면서 내 사원들은 악당에 허풍쟁이나 다름없다고 일축했다!"
 gdp_schmooze_events.1060.a: "\"아니, 시시한 [rival.GetHouse.GetBaseNameNoTooltip] 집안 사업이야말로 어린애 장난이지!\""
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip](이)가 멍청이처럼 보임"
 gdp_schmooze_events.1060.a.failure: "당신이 멍청이처럼 보임"
 gdp_schmooze_events.1060.b: "\"그쯤 하지! 우리 장부는 아주 탄탄하다고.\""
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip](이)가 설득됨"
 gdp_schmooze_events.1060.b.failure: "당신의 주장에 설득력이 부족함"
 gdp_schmooze_events.1060.c: "알아서 떠들게 두자."
 activity_used_trade_market_luxury_items_modifier: "사회적 수요"
 activity_used_trade_market_luxury_items_modifier_desc: "한 상인이 해당 시장의 사치품을 빼돌려 활동에 사용하고 있습니다."
 activity_used_trade_market_comforts_modifier: "사회적 수요"
 activity_used_trade_market_comforts_modifier_desc: "한 상인이 해당 시장의 생활용품을 빼돌려 활동에 사용하고 있습니다."
