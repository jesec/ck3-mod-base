l_korean:
 gdp_tgf_heavier_loads_modifier: "더 무거운 짐"
 gdp_tgf_seven_storehouses_modifier: "일곱 개의 저장고"
 gdp_tgf_seven_storehouses_modifier_desc: "이 상인은 흉년에 대비해 저장고를 지었으며, 모든 저장고를 언제나 가득 채워 둡니다."
 gdp_tgf_sweet_reputation_modifier: "달콤한 평판"
 gdp_tgf_sweet_reputation_modifier_desc: "이 상인은 한때 왕자의 연회에 진짜 새보다 커다란 설탕 새 조형물을 보냈습니다. 그것을 맛본 사람들은 지금도 그 맛을 잊지 못하고 이야기합니다."
 gdp_tgf_beekeeper_modifier: "양봉업자"
 gdp_tgf_beekeeper_modifier_desc: "이 상인은 창고 서까래에서 벌을 기릅니다. 벌들은 꿀로 집세를 내고, 상인은 직접 벌을 기르며 어떤 책보다도 많은 것을 배웠습니다."
 gdp_tgf_alcohol_opportunist_modifier: "우연한 포도주 양조업자"
 gdp_tgf_alcohol_opportunist_modifier_desc: "이 상인은 한때 과일 화물을 방치했다가 썩은 과일이 포도주로 변하는 일을 겪었습니다. 그때부터 값싼 술통을 보면 그냥 지나치지 못합니다."
 gdp_tgf_two_grades_modifier: "두 등급의 기름"
 gdp_tgf_two_grades_modifier_desc: "이 상인은 탁한 기름 찌꺼기는 등잔용으로, 맑은 기름은 식사용으로 판매하며 품질에 따라 값을 달리 받습니다."
 gdp_tgf_road_millet_modifier: "여행용 잡곡"
 gdp_tgf_road_millet_modifier_desc: "이 상인은 여행할 때 잡곡 한 자루를 꼭 챙깁니다. 잡곡은 몇 년이 지나도 상하지 않고, 그걸 먹는 사람도 오랫동안 버틸 수 있습니다."
 gdp_tgf_cheap_rice_modifier: "값싼 쌀"
 gdp_tgf_cheap_rice_modifier_desc: "해당 영지 시장에서는 현미가 저렴해서 식량을 구하지 못해 굶는 사람이 없습니다."
 gdp_tgf_keeps_the_fast_modifier: "금식 준수"
 gdp_tgf_keeps_the_fast_modifier_desc: "이 상인은 일 년 내내 고기를 팔면서도 남들과 함께 금식을 지킵니다. 따라서 배고픈 사람들이 무엇을 사려고 돈을 낼지 누구보다 잘 압니다."
 gdp_tgf_parchment_supplier_modifier: "양피지 공급업자"
 gdp_tgf_parchment_supplier_modifier_desc: "이 상인이 취급하는 최상급 가죽은 책의 낱장으로 만들어집니다. 어딘가에서는 그 위에 신성한 말씀이 기록됩니다."
 gdp_tgf_temple_supplier_modifier: "사원 공급업자"
 gdp_tgf_temple_supplier_modifier_desc: "사원들은 향을 구입할 때 이 상인을 먼저 찾으며, 가끔은 상인을 위해 기도까지 올립니다."
 gdp_tgf_chancery_stationer_modifier: "관청 납품업자"
 gdp_tgf_chancery_stationer_modifier_desc: "이 상인은 관청에 종이를 납품하며, 그 소식을 들은 서기들은 하나같이 같은 종이를 쓰고 싶어 합니다."
 gdp_tgf_tall_mast_modifier: "높은 돛대"
 gdp_tgf_tall_mast_modifier_desc: "이 상인의 배에는 이 해안 일대에서 가장 훌륭한 돛대가 설치되어 있으며, 그 덕분에 더 멀리 항해할 수 있습니다."
 gdp_tgf_our_timber_modifier: "우리 목재로 선박 건조"
 gdp_tgf_our_timber_modifier_desc: "이 무역로에서 거래되는 목재로 돛대를 만들자, 상품을 이전보다 더 먼 곳까지 운송할 수 있게 되었습니다."
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
 gdp_tgf_our_timber_renowned_modifier_desc: "$gdp_tgf_our_timber_modifier_desc$"
 gdp_tgf_heavier_loads_modifier_desc: "이 무역로에서는 안전은 뒷전으로 미룬 채 화물을 잔뜩 싣고 운송합니다."
 gdp_tgf_builders_rate_castle_full_modifier: "성벽 건축용 석재"
 gdp_tgf_builders_rate_castle_full_modifier_desc: "해당 영지의 성채에는 건축 자재가 건축업자 우대 가격으로 공급됩니다."
 gdp_tgf_builders_rate_castle_small_modifier: "비싼 값을 치른 성벽"
 gdp_tgf_builders_rate_castle_small_modifier_desc: "해당 영지의 성채에는 건축 자재가 공급되지만, 상당한 비용이 듭니다."
 gdp_tgf_builders_rate_church_full_modifier: "사원 건축용 석재"
 gdp_tgf_builders_rate_church_full_modifier_desc: "해당 영지의 사원에는 건축 자재가 건축업자 우대 가격으로 공급됩니다."
 gdp_tgf_builders_rate_church_small_modifier: "비싼 값을 치른 사원"
 gdp_tgf_builders_rate_church_small_modifier_desc: "해당 영지의 사원에는 건축 자재가 공급되지만, 상당한 비용이 듭니다."
 gdp_tgf_builders_rate_city_full_modifier: "부두 건설용 목재"
 gdp_tgf_builders_rate_city_full_modifier_desc: "해당 영지의 도시에는 건축 자재가 건축업자 우대 가격으로 공급됩니다."
 gdp_tgf_builders_rate_city_small_modifier: "비싼 값을 치른 부두"
 gdp_tgf_builders_rate_city_small_modifier_desc: "해당 영지의 도시에는 건축 자재가 공급되지만, 상당한 비용이 듭니다."
 gdp_tgf_builders_rate_generic_full_modifier: "우대 가격"
 gdp_tgf_builders_rate_generic_full_modifier_desc: "해당 영지의 건축업자들은 우대 가격으로 자재를 공급받습니다."
 gdp_tgf_builders_rate_generic_small_modifier: "상인 거래가"
 gdp_tgf_builders_rate_generic_small_modifier_desc: "해당 영지의 건축업자들은 상인이 제시한 가격으로 자재를 공급받습니다."
 gdp_tgf_keep_the_best_modifier: "재고 중 최상급품"
 gdp_tgf_keep_the_best_modifier_desc: "해당 인물은 가장 품질이 좋은 건설 자재를 자신의 공사에 쓰려고 따로 남겨 두었습니다."
 gdp_tgf_plentiful_stalls_modifier: "풍족한 가판대"
 gdp_tgf_plentiful_stalls_modifier_desc: "한 상인이 해당 영지의 시장 가판대마다 숲에서 얻은 최상급 수확물을 가득 공급했습니다."
 gdp_tgf_well_supplied_host_modifier: "보급이 원활한 군대"
 gdp_tgf_well_supplied_host_modifier_desc: "해당 인물의 군대는 상인이 꾸준히 공급하는 물자 덕분에 행군을 이어 갑니다."
 gdp_tgf_bee_stung_modifier: "벌에 쏘임"
 gdp_tgf_bee_stung_modifier_desc: "해당 인물은 벌이 가득한 창고에서 벌들에게 맞섰다가 호되게 당했습니다."
 gdp_tgf_awake_and_alert_modifier: "또렷한 정신"
 gdp_tgf_awake_and_alert_modifier_desc: "해당 인물은 차를 주전자째 마시며 장부의 숫자를 밤새 계산합니다."
 gdp_tgf_tea_drinker_modifier: "애차가"
 gdp_tgf_tea_drinker_modifier_desc: "해당 인물은 상인에게서 차 마시는 습관을 배웠고, 덕분에 정신도 한층 맑아졌습니다."
 gdp_tgf_well_grazed_meadows_modifier: "잘 방목된 초원"
 gdp_tgf_well_grazed_meadows_modifier_desc: "상인의 가축들은 해당 영지의 초원에서 풀을 뜯으며 살이 올랐고, 방목이 끝난 뒤에는 풀도 이전보다 더 푸르러졌습니다."
 gdp_tgf_lacquer_rash_modifier: "옻오름"
 gdp_tgf_lacquer_rash_modifier_desc: "해당 인물은 옻칠이 굳기도 전에 손을 댔습니다. 결국 옻이 이기고 말았습니다."
 gdp_tgf_curing_room_modifier: "옻칠 경화실"
 gdp_tgf_curing_room_modifier_desc: "이 상인은 습도가 높은 방에서 옻칠을 한 겹씩 굳힙니다. 구매자들도 그 차이를 알아봅니다."
 gdp_tgf_theriac_supply_modifier: "테리아카 공급"
 gdp_tgf_theriac_supply_modifier_desc: "해당 영지 시장에서는 어떤 상인이 보유한 재료로 조제한 테리아카가 판매됩니다."
 gdp_tgf_theriac_dose_modifier: "테리아카 한 포"
 gdp_tgf_theriac_dose_modifier_desc: "해당 인물은 테리아카를 한 차례 복용한 뒤 그 효능을 장담합니다."
 gdp_tgf_theriac_peddlers_modifier: "테리아카 행상인"
 gdp_tgf_theriac_peddlers_modifier_desc: "이 무역로의 어느 도시에서나 테리아카가 잘 팔리므로, 대상단이 화물을 절반도 채우지 못한 채 이동하는 일은 없습니다."
