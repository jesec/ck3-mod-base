 gdp_tgf_known_mark_modifier: "알려진 표식"
 gdp_tgf_known_mark_modifier_desc: "이 무역로의 구매자들은 어떤 상인의 표식을 다른 모든 상인의 표식보다 먼저 찾습니다."
 gdp_tgf_kept_edge_modifier: "영업 비밀"
 gdp_tgf_kept_edge_modifier_desc: "해당 인물은 큰돈을 제시받고도 공급업자들의 이름을 밝히지 않았습니다."
 gdp_tgf_price_war_modifier: "뼈를 깎는 할인"
 gdp_tgf_price_war_modifier_desc: "해당 인물은 가격을 극한까지 낮췄고, 경쟁자의 이익도 바닥을 쳤습니다."
 gdp_tgf_vein_share_modifier: "상인의 채굴 지원"
 gdp_tgf_vein_share_modifier_desc: "해당 영지의 채굴 사업 지분을 어떤 상인이 사들였으며, 채굴한 물량을 마지막 한 수레까지 확보하려 합니다."
 gdp_tgf_ballast_trick_modifier: "수익을 내는 바닥짐"
 gdp_tgf_ballast_trick_modifier_desc: "이 무역로에서는 바닥짐조차 이익을 남깁니다."
 gdp_tgf_hop_trader_modifier: "홉 무역상"
 gdp_tgf_hop_trader_modifier_desc: "이 상인은 홉을 넣어 빚은 맥주를 판매합니다. 이 맥주는 아주 먼 길을 운송해도 신선함을 유지하며, 영주에게 그루트 세금을 낼 필요도 없습니다."
