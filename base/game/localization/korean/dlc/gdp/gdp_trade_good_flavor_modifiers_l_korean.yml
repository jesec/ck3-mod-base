 gdp_tgf_packed_tight_modifier_desc: "이 무역로를 오가는 수레는 화물을 너무 빽빽하게 실어 삐걱거릴 지경입니다."
 gdp_tgf_packed_tight_renowned_modifier: "$gdp_tgf_packed_tight_modifier$"
 gdp_tgf_packed_tight_renowned_modifier_desc: "$gdp_tgf_packed_tight_modifier_desc$"
 gdp_tgf_packed_well_modifier: "꼼꼼한 포장"
 gdp_tgf_packed_well_modifier_desc: "이 무역로에서는 상품을 꼼꼼히 포장하기 때문에 수레 한 대에 실을 수 있는 양이 줄어듭니다."
 gdp_tgf_sealed_stock_wait_modifier: "봉인 대기"
 gdp_tgf_sealed_stock_wait_modifier_desc: "이 무역로의 수레들은 시장의 봉인 담당자를 기다리고 있습니다."
 gdp_tgf_quick_seal_modifier: "뇌물로 얻는 봉인"
 gdp_tgf_quick_seal_modifier_desc: "이 무역로에서는 봉인 담당자의 일 처리가 빠릅니다. 뇌물도 한몫합니다."
 gdp_tgf_quick_seal_renowned_modifier: "$gdp_tgf_quick_seal_modifier$"
 gdp_tgf_quick_seal_renowned_modifier_desc: "$gdp_tgf_quick_seal_modifier_desc$"
 gdp_tgf_broker_reach_modifier: "중개인의 거래망"
 gdp_tgf_broker_reach_modifier_desc: "중개상은 해당 인물의 무역로가 닿지 않는 먼 지역의 구매자들에게도 상품을 판매합니다."
 gdp_tgf_broker_reach_renowned_modifier: "$gdp_tgf_broker_reach_modifier$"
 gdp_tgf_broker_reach_renowned_modifier_desc: "$gdp_tgf_broker_reach_modifier_desc$"
 gdp_tgf_trained_hand_modifier: "숙련된 도제"
 gdp_tgf_trained_hand_modifier_desc: "총명하고 젊은 도제가 이 무역로의 운영을 돕습니다."
 gdp_tgf_trained_hand_renowned_modifier: "$gdp_tgf_trained_hand_modifier$"
 gdp_tgf_trained_hand_renowned_modifier_desc: "$gdp_tgf_trained_hand_modifier_desc$"
 gdp_tgf_extra_hands_modifier: "추가 인력"
 gdp_tgf_extra_hands_modifier_desc: "한 상인이 해당 영지 공방과 농지에 추가 인력을 고용할 비용을 지불합니다."
 gdp_tgf_extra_hands_renowned_modifier: "$gdp_tgf_extra_hands_modifier$"
 gdp_tgf_extra_hands_renowned_modifier_desc: "$gdp_tgf_extra_hands_modifier_desc$"
 gdp_tgf_outbid_modifier: "상회 입찰"
 gdp_tgf_outbid_modifier_desc: "경쟁자들은 이제 해당 인물과 입찰 경쟁을 벌이지 않는 편이 낫다는 것을 압니다."
