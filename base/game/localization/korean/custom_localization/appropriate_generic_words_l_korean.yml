 #Food and drink glosses
 ABALONE_GLOSS: "전복은 살이 단단하며 육질이 좋아 귀하게 여겨집니다."
 SEA_CUCUMBER_GLOSS: "부드러운 해양 생물로, 중국 고급 요리의 진미입니다."
 SWALLOW_NEST_GLOSS: "희귀한 새 둥지로 만든 호화로운 탕 요리입니다."
 ENTREMETS_GLOSS: "각 요리 사이에 나오는 공들인 단 음식, 또는 깜짝 요리입니다."
 MOCHI_GLOSS: "찹쌀을 빻아 만든 쫀득한 떡입니다."
 DURIAN_GLOSS: "거대한 열대 과일입니다. 강한 향기와 크림 같은 과육의 풍부한 맛으로 유명합니다."
 AQUA_VITAE_GLOSS: "도수 높은 증류주입니다. 약용 음료로 귀하게 여겨졌습니다."
 TRIBUTE_CHILLED_TEA_GLOSS: "얼음 또는 눈으로 차갑게 식힌 고급 차입니다. 궁정의 선물로 보내지곤 했습니다."
 EMPEROR_TEA_GLOSS: "궁정에서만 마시던 최고급 황실 차입니다."
 BAIJIU_GLOSS: "중국의 도수 높은 술로, 곡물을 증류해 만듭니다."
 HANAKUSA_GLOSS: "꽃과 잎을 혼합해 우려내는 일본의 약초 음료입니다."
 PEARL_POWDER_GLOSS: "갈아낸 진주는 값비싼 강장제로 쓰였습니다."
 CHRYSANTHEMUM_BEER_GLOSS: "국화의 향이 더해진 도수 낮은 양조주입니다."
 SHARBAT_GLOSS: "달게 만든 과일 음료입니다. 향신료를 더해 차갑게 마시곤 합니다."
 SAMBUSA_GLOSS: "반죽에 향신료를 넣은 고기 또는 채소로 속을 채우고 튀겨낸 음식입니다."
 PAKHALA_GLOSS: "인도 동부에서 발효한 쌀뜨물로 만드는 차가운 음식입니다."
 PILAU_GLOSS: "향신료로 양념하고 고기 또는 채소를 더해 요리한 밥입니다."
 PASTILLA_GLOSS: "마그레브식 파이입니다. 향신료를 더한 고기를 얇은 반죽으로 싸서 요리합니다."
 BOTUO_GLOSS: "두툼한 밀가루 만두 또는 국수를 넣고 삶아 먹는 중국의 탕입니다."
 SPHOUNGATA_GLOSS: "달걀을 풀어 만드는 비잔티움식 오믈렛입니다."
 TARICHOS_GLOSS: "소금에 절여 말린 생선으로, 비잔티움의 주요 음식이었습니다."
 BING_GLOSS: "중국식 납작한 빵 또는 판에서 구운 빵입니다."
 MANTOU_GLOSS: "부드럽게 쪄낸 중국의 밀가루 빵입니다."
 ZOSUI_GLOSS: "국물에 끓여 만드는 일본의 쌀죽입니다."
 KIMCHI_GLOSS: "채소에 소금과 향신료를 넣고 발효시키는 한국 음식입니다."
 BUBUR_GLOSS: "말레이 제도의 쌀죽입니다."
 #Oldest record of the word: Codex diplomaticus Caietanus, 997 - https://en.wikipedia.org/wiki/History_of_pizza
 PIZZA_GLOSS: "이탈리아 남부의 납작하고 둥근 빵입니다. 아메리카에서 토마토가 들어오기 훨씬 전부터 만들어지고 있었습니다. 서기 997년에 체결된 가에타의 임차 계약에 따르면, 임차인은 주교에게 크리스마스와 부활절에 각각 피자 12개를 주어야 했습니다."
 #Vaddaradhane, c. 920 - https://en.wikipedia.org/wiki/Idli
 IDLI_GLOSS: "인도 남부에서 검은 렌틸콩으로 만들어 먹던 작은 케이크입니다. 서기 920년경에 쓰인 칸나다 설화집에는 이 음식이 이미 이달리게라는 이름으로 등장합니다."
 #Etienne Boileau, Livre des metiers - https://en.wikipedia.org/wiki/Oublie
 OUBLIE_GLOSS: "뜨거운 철판 사이에서 구워낸 얇은 웨이퍼를 만 것입니다. 1260년대에는 파리에 우블리 장인 조합이 있었으며, 이들은 밤에 길거리에서 소리 높여 외치며 장사했습니다."
 BLIN_GLOSS: "철판에 구워 뜨거울 때 바로 먹는 얇은 팬케이크입니다. 사순절 전 축제에서 무더기로 만들어졌습니다."
 #https://en.wikipedia.org/wiki/Obwarzanek_krakowski
 OBWARZANEK_GLOSS: "고리 모양 반죽을 삶은 뒤 구워내 줄에 꿰어 팔았습니다. 크라쿠프에서는 이 빵을 오브바자네크라 불렀으며, 1394년에는 왕실 궁정에서도 이 빵을 구매했습니다."
 #Pogača, from Latin focacia - https://en.wikipedia.org/wiki/Poga%C4%8Da
 POGACA_GLOSS: "화덕의 재 속에서 구워내는 둥근 납작빵입니다. 그 이름은 라틴어로 '화덕의 빵'을 의미하는 단어인 포카치아에서 유래했습니다."
 FUL_GLOSS: "오랜 시간 푹 끓여낸 누에콩은 이집트 도시에서 일상적으로 먹는 음식이었습니다."
 INJERA_GLOSS: "발효한 테프로 만든 푹신하고 큰 납작빵입니다. 접시와 숟가락의 역할을 동시에 해내는 음식입니다."
 #Narezushi, the fermented form of sushi before the Edo period - https://en.wikipedia.org/wiki/Narezushi
 NAREZUSHI_GLOSS: "소금에 절인 쌀에 생선을 넣고 몇 달간 숙성합니다. 이후에 쌀을 긁어내고 생선만 먹습니다."
 AKARA_GLOSS: "검은눈콩을 갈아서 야자유에 튀겨 만든 음식입니다."
 FURA_GLOSS: "잡곡 반죽을 찐 뒤 공 모양으로 빚어, 시큼한 발효 우유에 섞어 먹는 음식입니다."
 TSAMPA_GLOSS: "보릿가루를 볶아 버터를 넣고 반죽한 뒤 손가락으로 집어 먹는 음식입니다."
 #William of Rubruck, Itinerarium (1253-1255), on the dried curds he calls grut - https://en.wikipedia.org/wiki/Aaruul
 AARUUL_GLOSS: "햇빛에 바짝 말린 응유는 모든 여정에서 유용한 식량이 되어주었습니다. 빌럼 판 루브뢱이 1253년 몽골인들 사이에서 발견한 음식입니다."
