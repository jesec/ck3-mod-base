 #Food and drink glosses
 ABALONE_GLOSS: "전복은 살이 단단하며 육질이 좋아 귀하게 여겨집니다."
 SEA_CUCUMBER_GLOSS: "부드러운 해양 생물로, 중국 고급 요리의 진미입니다."
 SWALLOW_NEST_GLOSS: "희귀한 새 둥지로 만든 호화로운 탕 요리입니다."
 ENTREMETS_GLOSS: "세심하게 조리된 달콤한 음식으로, 숨겨져 있다가 각 요리 사이에 제공되기도 합니다."
 MOCHI_GLOSS: "찹쌀을 빻아 만든 쫀득한 떡입니다."
 DURIAN_GLOSS: "거대한 열대 과일입니다. 강한 향기와 크림 같은 과육의 풍부한 맛으로 유명합니다."
 AQUA_VITAE_GLOSS: "도수 높은 증류주입니다. 약용 음료로 귀하게 여겨졌습니다."
 TRIBUTE_CHILLED_TEA_GLOSS: "얼음 또는 눈으로 차갑게 식힌 고급 차입니다. 궁정의 선물로 보내지곤 했습니다."
 EMPEROR_TEA_GLOSS: "궁정에서만 마시던 최고급 황실 차입니다."
 BAIJIU_GLOSS: "중국의 도수 높은 술로, 곡물을 증류해 만듭니다."
 HANAKUSA_GLOSS: "꽃과 잎을 혼합해 우려내는 일본의 약초 음료입니다."
 PEARL_POWDER_GLOSS: "갈아낸 진주는 값비싼 강장제로 쓰였습니다."
 CHRYSANTHEMUM_BEER_GLOSS: "국화의 향이 더해진 도수 낮은 양조주입니다."
 SHARBAT_GLOSS: "달게 만든 과일 음료입니다. 향신료를 더해 차갑게 마시곤 합니다."
 SAMBUSA_GLOSS: "반죽에 향신료를 넣은 고기 또는 채소로 속을 채우고 튀겨낸 음식입니다."
 PAKHALA_GLOSS: "동인도 지역에서 발효한 쌀뜨물로 만드는 차가운 음식입니다."
 PILAU_GLOSS: "향신료로 양념하고 고기 또는 채소를 더해 요리한 밥입니다."
 PASTILLA_GLOSS: "마그레브식 파이입니다. 향신료를 더한 고기를 얇은 반죽으로 싸서 요리합니다."
 BOTUO_GLOSS: "두터운 밀가루 만두 또는 국수를 넣고 삶아 먹는 중국의 탕입니다."
 SPHOUNGATA_GLOSS: "달걀을 풀어 만드는 비잔티움식 오믈렛입니다."
 TARICHOS_GLOSS: "소금에 절여 말린 생선으로, 비잔티움의 주요 음식이었습니다."
 BING_GLOSS: "중국식 납작한 빵 또는 판에서 구운 빵입니다."
 MANTOU_GLOSS: "부드럽게 쪄낸 중국의 밀가루 빵입니다."
 ZOSUI_GLOSS: "묽은 국물이 나도록 요리한 일본의 쌀죽입니다."
 KIMCHI_GLOSS: "채소에 소금과 향신료를 넣고 발효시키는 한국 음식입니다."
 BUBUR_GLOSS: "말레이 제도의 쌀죽입니다."
