 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "그대의 악행이 아일랜드와 중국까지 파다하오."
 greeting_supplimentary.negative.greek: "그대의 그 저속한 성격은 그리스 연극의 소재로 삼을 법 하군."
 greeting_supplimentary.negative.insult.1: "그대 몸속의 체액이 모두 썩어 문드러지길 바라오."
 greeting_supplimentary.negative.insult.2: "그대의 여생이 짧고 비참하기를 바라오."
 greeting_supplimentary.negative.insult.3: "지혜가 언제나 그대를 빗겨가기를 바라오."
 greeting_supplimentary.negative.insult_muslim.1: "그대의 7대조 할아버지가 지옥에나 가있기를 바라오."
 greeting_supplimentary.negative.insult_muslim.2: "죽은 낙타 배 속에 그대를 처넣고 산 채로 꿰맸으면 하오이다."
 greeting_supplimentary.negative.insult_muslim.3: "알라께서 그대의 가문을 파괴하시기를 바라오."
 greeting_supplimentary.negative.insult_muslim.4: "그대는 지저분한 개자식이나 다름없소."
 greeting_supplimentary.negative.insult_muslim.5: "자칼들이 묻히지도 못한 그대의 유해를 두고 다투기를 바라오."
 greeting_supplimentary.negative.insult_muslim.6: "그대의 우물에는 모래가, 천막에는 전갈이 가득하기를."
 greeting_supplimentary.negative.insult_christian.1: "성자들마저 그대의 대의를 저버리기를."
 greeting_supplimentary.negative.insult_christian.2: "모든 기도에서 그대의 이름이 지워질 것이오."
 greeting_supplimentary.negative.insult_norse.1: "그대 조상들이 그대 영혼에 침이나 뱉기를."
 greeting_supplimentary.negative.insult_norse.2: "그대의 용기는 겨울의 살얼음보다 더 얕군."
 greeting_supplimentary.negative.insult_byzantine.1: "콘스탄티노폴리스의 쥐들도 그대의 악취 앞에서는 달아날 거요."
 greeting_supplimentary.negative.insult.4: "그대의 들판에서는 아무것도 맺지 못하고, 그 우물은 말라버릴 거요."
 greeting_supplimentary.negative.insult.unreliable_swine: "도무지 믿을 수가 없는 돼지 같은 인간이군."
 greeting_supplimentary.negative.insult.oathbreaker: "그대는 거짓말쟁이이자 맹세를 깨 버린 자요."
 greeting_supplimentary.negative.insult_jewish.1: "그대의 이름이 산 자들의 책에서 지워지기를."
 greeting_supplimentary.negative.insult_zoroastrian.1: "어둠이 그대가 돌보는 불을 삼켜버리기를."
 greeting_supplimentary.negative.insult_hindu.1: "그대는 정의로운 길에서 멀리 벗어났소. 내가 그대를 더 멀리 내쫓을 것이오."
 greeting_supplimentary.negative.insult_christian.3: "지옥이 활짝 열려 그대를 맞이하기를."
 greeting_supplimentary.negative.insult_norse.3: "까마귀 떼가 그대의 시체로 호화로운 연회를 벌일 것이오."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "그대와 그대의 가문에 축복이 함께하기를."
 greeting_supplimentary.positive.flattery.2: "그대의 지혜와 자비는 전설적이오."
 greeting_supplimentary.positive.flattery.3: "평화가 함께하기를."
 greeting_supplimentary.positive.flattery.4: "조화와 만족 속에 살아가기를."
 greeting_supplimentary.positive.flattery.5: "그대의 무자비함이 부럽소이다."
 greeting_supplimentary.positive.flattery.6: "그대의 왕성한 식욕이 온 세상의 칭송을 부르고 있소."
 greeting_supplimentary.positive.flattery.7: "그대의 명성이 국경까지 널리 퍼졌소."
 greeting_supplimentary.positive.flattery.8: "그대의 혈통이 천 년 동안 이어지기를."
 greeting_supplimentary.positive.flattery.9: "신께서 그대가 검을 쥐는 팔을 강건하게 지켜 주시기를."
 greeting_supplimentary.positive.flattery.10: "그대 집안에 평화와 풍요가 가득하기를."
 greeting_supplimentary.positive.flattery.11: "행운이 그대의 깃발을 향해 미소 짓기를."
 greeting_supplimentary.positive.flattery_chinese.1: "그대에게 천상의 축복이 있기를."
 greeting_supplimentary.positive.flattery_chinese.2: "그대의 땅이 언제나 번영하기를."
 greeting_supplimentary.positive.flattery_chinese.3: "힘과 활력이 그대의 치세를 축복하기를."
 greeting_supplimentary.positive.flattery_norse.1: "신께서 그대에게 순풍과 살찐 가축을 안겨 주시기를."
 greeting_supplimentary.positive.flattery_byzantine.1: "도시의 영광이 그대의 집안을 비추기를."
 greeting_supplimentary.positive.flattery_jewish.1: "거룩한 분께서 그대의 집안에 평화의 축복을 내리시기를."
 greeting_supplimentary.positive.flattery.12: "그대의 지혜는 조언을 구하는 자들을 위한 빛이오."
 greeting_supplimentary.positive.flattery.13: "천상이 앞으로도 그대에게 은총을 내리기를."
