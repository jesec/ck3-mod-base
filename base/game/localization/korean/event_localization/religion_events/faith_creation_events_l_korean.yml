l_korean:
 faith_creation.1001.t.schism: "[reformed_faith.GetAdjectiveNoTooltip] 분열"
 faith_creation.1001.t.reformation: "[reformed_faith.GetAdjectiveNoTooltip] 개혁"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetName] 내에서 새로운 분열이 생겼다. [reformer.GetTitledFirstName](와)과 [reformer.GetHerHis] 추종자들이 근본이 된 신앙인 [old_faith.GetName]에서 갈라져 나왔으며, 한때 이들이 따르던 [old_rite.GetAdjective] 교파는 새로운 신앙의 씨앗이 되었다."
 faith_creation.1001.desc.reformation: "[reformed_faith.GetAdherentNamePlural] 사이에서도 저명한 인사로 손꼽히는 [reformer.GetTitledFirstName](이)가 각지의 모든 [reformer.Custom('DefaultPriestTitle')](을)를 소집했다. 흩어진 의식을 하나의 교파로 모으고, 이를 바탕으로 신앙을 위한 정식 교리를 수립하기 위함이었다."
 faith_creation.1001.desc.schism.personal: "[old_faith.GetAdjective] [old_faith.AltPriestTermPlural](은)는 길을 잃었으며, 더 이상 우리의 인도를 믿고 맡길 수 없다. 나는 생각이 같은 [reformer.Custom('DefaultPriestTitlePlural')]들을 소집했으며, 우리가 [old_rite.GetName](을)를 바탕으로 만들어낸 것은 이제 더는 근본이 된 신앙에 속하지 않는다."
 faith_creation.1001.desc.reformation.personal: "드디어 나는 전 세계의 저명한 [reformer.Custom('DefaultPriestTitle')]들을 모두 소집했다. 흩어진 의식을 하나의 교파로 모으고, 이를 바탕으로 지금부터 우리의 신앙을 이끌어 줄 교리를 수립하기 위함이었다."
 faith_creation.1001.desc.schism.personal.hof: "[old_hof.GetTitledFirstName](와)과 [old_faith.GetAdjective] [old_faith.AltPriestTermPlural]들이 신자들을 잘못된 길로 이끄는 한, 더는 무릎을 꿇지 않겠다. 나는 같은 신념을 나누는 [reformer.Custom('DefaultPriestTitlePlural')]들을 소집했다. 그리고 우리가 지키던 [old_rite.GetAdjective] 교파를 바탕으로 하되, [old_faith.GetName]에 빚졌다고 할 것은 하나도 없는 새로운 신앙을 만들어냈다."
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName](이)가 [old_hof.GetTitledFirstName]의 권위를 버렸으며, 자신의 추종자들을 이끌고 [old_faith.GetName]에서 나갔다. 저들이 지키는 [old_rite.GetAdjective] 교파는 이제 오직 자신만을 책임져야 하는 신앙의 뿌리가 되었다."
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\n열정이 넘치는 [reformer.Custom('DefaultPriestTitlePlural')](은)는 새로운 믿음을 전파해야 한다면서 [reformed_faith.GHWNamePlural]의 발족에 관한 얘기를 입에 올렸다."
 faith_creation.1001.desc.outlook.pacifism: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')](이)가 전쟁은 고통과 증오를 퍼뜨릴 뿐이라면서 폭력 행위와 유혈 사태를 규탄하고 나섰다. "
 faith_creation.1001.desc.outlook.dogmatic: "\n\n[reformer.Custom('DefaultPriestTitlePlural')](이)가 [reformed_faith.GetNameNoTooltip](이)야말로 유일하고도 참된 신앙이라 주장하고 나섰다."
 faith_creation.1001.desc.outlook.accepting: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')](이)가 협동하면서 관용을 베풀라며 사람들을 고무했다. 그들은 불신자에게도 차별을 두지 않았다."
 faith_creation.1001.desc.outlook.fallback: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')](이)가 다른 신앙의 실용적이고도 균형 잡힌 관점을 받아들이기로 했다."
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "그러면서 참된 헌신을 보여줄 방법은 인신공양을 통해서 [reformed_faith.HighGodName](을)를 기리는 방법뿐이라고 주장했다!"
 faith_creation.1001.desc.belief.indulgent: "그러면서 지지자들에게 살점에 대한 욕구를 충족시키며 삶을 마음껏 즐기기를 장려했다."
 faith_creation.1001.desc.belief.incest: "그러면서 가까운 친족과의 결혼을 허가하고는 가족 사이의 유대 관계는 신성한 것이므로 이러한 결혼 역시 축복받을 거라는 주장을 펼쳤다."
 faith_creation.1001.desc.belief.aniconism: "그러면서 한낱 인형 따위로는 [reformed_faith.HighGodName]의 위대함을 담을 수 없다고 주장하며 종교에 관련된 우상의 사용을 금지했다."
 faith_creation.1001.desc.belief.ascetic: "그러면서 물질을 추구하는 행위는 영혼의 충족을 방해하는 걸림돌일 뿐이라면서 추종자들로 하여금 금욕할 것을 장려했다."
 faith_creation.1001.desc.belief.spirits: "그러면서 격동의 시기를 헤쳐나가는 신도들을 인도하기 위하여 정령에게 도움을 구했다."
 faith_creation.1001.desc.belief.superstition: "그러면서 옛날부터 이어진 여러 미신이나 신화를 공식적인 교리의 일환으로 받아들였다."
 faith_creation.1001.desc.belief.nature: "그러면서 자연에 존중해야 하며, 자신들의 이익을 위하여 착취를 일삼는 무리로부터 자연을 보전하고 지켜낼 방법을 찾아야 한다고 주장했다."
 faith_creation.1001.desc.belief.community: "그러면서 외부인을 받아들이길 망설이는 [reformed_faith.GetAdherentNamePluralNoTooltip](와)과 깊은 유대 관계를 지닌 공동체를 형성하자고 주장했다. 이에 따라 새로운 신앙에 지지자들의 문화적인 전통을 받아들이자고도 했다."
 faith_creation.1001.desc.belief.pain: "그러면서 고난과 고통을 통해 육신을 낮춰야 하며, 고행이야말로 영혼을 정화하며 신자를 [reformed_faith.HighGodName]에게 더 가까이 데려다주는 길이라고 주장했다."
 faith_creation.1001.desc.belief.iconoclasm: "그러면서 거짓된 신의 우상과 제단을 모두 파괴하고, 이런 것들이 세워져 있는 곳은 어디든 불태워야 한다고 했다."
 faith_creation.1001.desc.belief.militant: "그러면서 독신자는 그 무엇보다도 병사이며, 검날로 신앙을 전파해야 한다고 주장했다."
 faith_creation.1001.desc.belief.veneration: "그러면서 세상을 떠난 성인을 중보자로 공경하고, 그 성물을 기리며 기도에서 성인들의 이름을 부르자고 했다."
 faith_creation.1001.desc.belief.sacraments: "그러면서 은총은 다른 누구도 아닌 서품받은 자의 손에서 행해지는 성스러운 의식을 통해 흐른다고 주장했다."
 faith_creation.1001.desc.belief.penance: "그러면서 모든 영혼은 죄로 얼룩진 채 태어나며, 고해와 보속을 통해서만 정화할 수 있다고 주장했다."
 faith_creation.1001.desc.belief.christology: "그러면서 교리의 중대한 문제를 정리했고, 모든 신자가 천명해야만 하는 용어를 통해 신성의 본질을 규정했다."
 faith_creation.1001.desc.belief.rebirth: "그러면서 영혼은 윤회의 위대한 수레바퀴에 묶여 있으니, 다음 삶은 이전 삶에서의 행위에 따라 정해진다고 주장했다."
 faith_creation.1001.desc.belief.learning: "그러면서 배움이야말로 가장 중요하므로, 세상을 연구하는 것이야말로 [reformed_faith.HighGodName]의 마음을 더 잘 아는 길이라고 했다."
 faith_creation.1001.desc.belief.law: "그러면서 신성한 법이 그 무엇보다도 중요하므로, 교리의 모든 단어를 글자 그대로 따라야 한다고 주장했다."
 faith_creation.1001.desc.belief.missionary: "그러면서 어떠한 영혼도 암흑 속에 남겨지지 않도록 말씀을 지상 곳곳에 퍼뜨리기로 맹세했다."
 faith_creation.1001.desc.belief.hierarchy: "그러면서 만물이 각자에게 맞는 자리를 지켜야 하며, 모든 영혼이 자신의 위에 정해진 질서를 따라야만 조화가 흐른다고 주장했다."
 faith_creation.1001.desc.belief.charity: "그러면서 신자들이 자선으로 고난에 맞서고, 빈자와 병자와 이방인 모두를 돌봐야 한다고 주장했다."
 faith_creation.1001.desc.belief.family: "그러면서 친족의 유대를 신성하게 여기고, 선조를 기리며 많은 자손을 두는 것이야말로 숭배의 행위라고 가르쳤다."
 faith_creation.1001.desc.belief.sacred_sites: "그러면서 헌신의 증거로 위대한 돌 기념비를 세우고, 여러 세대에 걸쳐 이어질 성지를 만들었다."
 faith_creation.1001.desc.belief.worldly: "그러면서 헌신을 세속적이고 실용적인 관점으로 해석했고, 돈과 타협과 시기적절한 침묵 또한 기도만큼이나 신앙을 섬기는 방법이라고 주장했다."
 faith_creation.1001.desc.belief.syncretic: "그러면서 이웃의 믿음을 자신의 믿음과 함께 받아들였고, 여러 길이 결국에는 같은 진리로 이어진다고 믿었다."
 faith_creation.1001.desc.belief.fallback: "그러면서 지지자들에게 오랜 분쟁은 잊고 새로운 신앙을 위해 힘을 합치자고 청했다."
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip](이)가 격화되고 있는 [reformed_faith.GetAdjectiveNoTooltip] 운동을 이끌 사람으로 선출되었다. [reformer.GetSheHe]에게는 [reformed_faith.ReligiousHeadName](이)란 직함이 주어졌는데, 이는 후대의 계승자들에게 이어질 명망 있는 직책을 일컫는 칭호였다."
 faith_creation.1001.desc.temporal.personal: "\n\n격화되고 있는 [reformed_faith.GetAdjectiveNoTooltip] 운동을 이끌 사람으로 선택받았다. 내게는 [reformed_faith.ReligiousHeadName](이)란 직함이 주어졌는데, 이는 내 후손들에게 이어질 명망 있는 직책을 일컫는 칭호였다."
 faith_creation.1001.desc.spiritual: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')](은)는 [reformed_hof.GetFirstNameNoTooltip](을)를 새로운 [reformed_faith.ReligiousHeadName](으)로 선택했다. 이 사람이 다른 모든 [reformed_faith.GetAdjectiveNoTooltip] 교파의 기준이 되는 주류 교파를 정하며, 신앙 전반에 걸쳐 일어나는 분쟁을 중재하게 된다."
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')](은)는 [reformed_hof.GetFirstNameNoTooltip](을)를 [reformed_faith.ReligiousHeadName](으)로 계속 두는 길을 선택했다. [reformed_hof.GetSheHe]는 앞으로도 다른 모든 [reformed_faith.GetAdjectiveNoTooltip] 교파의 기준이 되는 주류 교파를 정하며, 신앙 전반에 걸쳐 일어나는 분쟁을 중재하게 된다."
 faith_creation.1001.desc.no_head: "\n\n격화되고 있는 운동에서 종교 지도자를 정하지 않기로 했다. 대신 교파가 각자의 가르침을 유지하며, [reformer.Custom('DefaultPriestTitle')]마다 각자의 [reformed_faith.HouseOfWorship]의 부름에 응답하기로 했다."
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.GetAdherentNamePluralNoTooltip](은)는 예언대로 [reformed_faith.ReligiousHeadName](이)가 나타나기를 기다리기로 했다. 모든 신도를 결집시켜서 [reformed_faith.GetAdjectiveNoTooltip]의 새로운 황금기를 이끌어낼 위대한 지도자가 찾아올 거라면서 말이다."
 faith_creation.1001.o.frightened: "[ROOT.Char.GetFaith.random_GoodGodNames]께서 피에 굶주린 [second.Custom('GetUnbelieverNamePlural')]에게서 우릴 보호하시니!"
 faith_creation.1001.o.heretical: "[ROOT.Char.GetFaith.HighGodName]에 맞선 이단자들에게 죗값을 묻겠노라!"
 faith_creation.1001.o.crusader: "[ROOT.Char.GetFaith.GHWName]에 시달리다 보면 [second.Custom('GetUnbelieverNamePlural')] 놈들도 분수를 깨닫게 되겠지!"
 faith_creation.1001.o.interested: "어떤 국면이 이어질지 계속 주시해야겠어."
 faith_creation.1001.o.uninterested: "[second.Custom('GetUnbelieverNamePlural')](이)가 무얼 믿는지는 중요치 않다."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "[holy_sites|E]를 생성, 강등, 승격, 채택 또는 포기할 수 있는 #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!개의 자유 행동을 획득"
 faith_creation.1001.o.personal: "[ROOT.Char.GetFaith.HighGodName]께서 우리를 보살피고 계심을 세상에 보여주겠노라!"
 faith_creation.1002.t: "찢어진 교파"
 faith_creation.1002.t.new_faith: "우리만의 신앙"
 faith_creation.1002.desc.intro.founder: "내 [old_rite.GetAdjective] 교파가 길을 잃었다. 기도와 원리가 하나씩 벗어나기 시작하더니, 이제는 더 이상 [old_faith.GetName](이)라 할 수 없게 되었다."
 faith_creation.1002.desc.intro.member: "우리의 [old_rite.GetAdjective] 교파가 [founder.GetTitledFirstName] 아래에서 길을 잃었다. 기도와 원리가 하나씩 벗어나기 시작하더니, 이제는 더 이상 [old_faith.GetName](이)라 할 수 없게 되었다."
 faith_creation.1002.desc.intro.observer: "[founder.GetTitledFirstName]의 [old_rite.GetAdjective] 교파가 길을 잃었다. 기도와 원리가 하나씩 벗어나기 시작하더니, 이제는 더 이상 [old_faith.GetName](이)라 할 수 없게 되었다."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName](이)가 심판을 선고했다. 길을 잃은 무리는 쫓겨나며, 뿌리와 가지가 모두 잘려 나가게 된다."
 faith_creation.1002.desc.anathema.no_hof: "\n\n모든 제단에서 [old_faith.GetName]의 [old_faith.AltPriestTermPlural](이)가 심판을 선고했다. 길을 잃은 무리는 쫓겨나며, 뿌리와 가지가 모두 잘려 나가게 된다."
 faith_creation.1002.desc.new_head.personal: "뒤따라오는 짐은 나의 몫이 되었다. 나는 이제 [new_faith.GetName]의 [new_faith.ReligiousHeadName|U](이)다."
 faith_creation.1002.desc.new_head.founder: "저들을 밖으로 인도한 자가 여전히 그 무리를 이끈다. [founder.GetFirstNameNoTooltip](이)가 [new_faith.GetName]의 [new_faith.ReligiousHeadName|U](이)가 되었다."
 faith_creation.1002.desc.new_head.other: "이제 [new_hof.GetTitledFirstName](이)가 [new_faith.GetName]의 [new_faith.ReligiousHeadName|U](이)다."
 faith_creation.1002.desc.new_head.none: "새로운 무리를 이끄는 목자는 없다. 저들의 [new_faith.AltPriestTermPlural](은)는 오직 자신의 부름에만 답한다."
 faith_creation.1002.desc.outro.new_faith: "\n\n우리만의 신앙과 법. 그러나 그 불은 이제 막 타오르기 시작했으며, 이제 [old_faith.GetName]에서 질책뿐만 아니라 검으로 우리에게 맞설지도 모른다."
 faith_creation.1002.desc.outro.old_faith: "\n\n[old_rite.GetName]에 속하던 모든 영지와 영혼이 단 한 번에 [old_faith.GetName](을)를 떠났다. 저들은 더 이상 친족이라 할 수 없으며, 곧 전쟁에서 만나게 될지도 모른다."
 faith_creation.1002.a: "드디어 우리만의 신앙이 생겼다."
 faith_creation.1002.a.founder: "길은 언제나 우리 것이었으니. 이제는 그 이름 또한 우리 것이다."
 faith_creation.1002.b: "지금도, 그리고 앞으로도 이단일 것이다."
 faith_creation.1002.b.hof: "울타리 바깥의 세상이 얼마나 냉혹한지 가르쳐 줘야겠군."
 faith_creation.1002.consequences.tt: "[new_faith.GetName](이)가 이제 완전히 분리된 [faith|E]이 됨\n$EFFECT_LIST_BULLET$옛 [rite|E]의 모든 [followers|E] 및 [Concept( 'counties', '영지' )|E]가 이제 새로운 신앙에 속함\n$EFFECT_LIST_BULLET$[new_faith.GetName] 및 [old_faith.GetName] 사이에 [faith_hostility|E]가 적용되며, 이에 따라 [holy_wars|E]이 발발할 수 있음\n$EFFECT_LIST_BULLET$두 신앙이 더 이상 [head_of_faith|E]를 공유하지 않음"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName](이)가 [holy_sites|E]를 생성, 강등, 승격, 채택 또는 포기할 수 있는 #V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#!개의 자유 행동을 획득함"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName](이)가 [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName](을)를 상실함"
 faith_creation.1010.t: "[faith.ReligiousHeadName|U](으)로 공표된 [HoF.GetFirstNameNoTooltip]"
 faith_creation.1010.desc.start: "우리 신앙이 지닌 정당성에 의구심을 갖는 날이 없으리라 생각했다. 그렇게 영적인 지도자 없이 견뎌야 하는 기간이 이어졌다. 하지만 이제 그런 시련도 끝이 났다."
 faith_creation.1010.desc.temporal.personal: "날 진정한 [faith.ReligiousHeadName|U](으)로 추대하라고 [faith.AltPriestTermPlural](을)를 설득하는 데 성공한 덕분이다."
 faith_creation.1010.desc.temporal: "[HoF.GetTitledFirstName](이)가 자신을 진정한 [faith.ReligiousHeadName|U](으)로 추대하라며 [faith.AltPriestTermPlural](을)를 설득해내는 데 성공한 덕분이다."
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural](을)를 소집하여, [HoF.GetFirstName](을)를 주류 교파의 수호자이자 진정한 [faith.ReligiousHeadName|U](으)로 선출해 내는 데 성공한 덕분이다."
 faith_creation.1010.desc.end: "\n\n그렇게 독실한 신도들은 지도자 아래 하나가 되었다. [faith.GetNameNoTooltip]의 황금기가 눈앞으로 성큼 다가온 듯했다."
 faith_creation.1010.desc.end.personal: "\n\n그렇게 독실한 신도들은 내 아래 하나가 되었다. [faith.GetNameNoTooltip]의 황금기가 눈앞으로 성큼 다가온 듯했다."
 faith_creation.1010.a: "[faith.HighGodName]께 영광 있으라!"
 faith_creation.1011.message.title: "종교 지도자 선출"
 faith_creation.1011.message.desc: "[faith.GetAdjective] [faith.AltPriestTermPlural](이)가 [faith.ReligiousHeadName|U] [HoF.GetFirstName](을)를 [head_of_faith|E]로 선포함"
 faith_creation.1021.t: "울타리 안의 교파"
 faith_creation.1021.t.founder: "우리만의 교파"
 faith_creation.1021.desc.intro.founder: "[new_rite.GetName](이)가 선언되었으며, 그 추종자들은 나를 우러러본다. 우리는 여전히 [old_faith.GetAdherentNamePlural](이)지만, 더는 [source_rite.GetAdjective]의 일원이 아니다."
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName](이)가 [old_faith.GetName] 내에서 새로운 교파를 창설했다. 그 추종자들은 교파를 [new_rite.GetName](이)라 부르며, 자신들만의 의례를 따라 [old_faith.GetAdjective] 신앙을 지킨다."
 faith_creation.1021.desc.divergence.minor: "\n\n이 교파는 사소한 부분에서만 [source_rite.GetAdjective](와)과 차이를 보인다."
 faith_creation.1021.desc.divergence.moderate: "\n\n이 교파의 의식은 [source_rite.GetAdjective](을)를 따르는 대부분의 이에게 낯설게 느껴질 것이다."
 faith_creation.1021.desc.divergence.major: "\n\n이 교파의 실천은 의심을 불러일으킬 만큼 [source_rite.GetAdjectiveNoTooltip]에서 멀리 벗어나 있다."
 faith_creation.1021.desc.differing.tenet: "가장 큰 차이는 [differing_tenet.GetBaseName](이)다."
 faith_creation.1021.desc.differing.doctrine: "가장 큰 차이는 [differing_doctrine.GetDescriptiveName](이)다."
 faith_creation.1021.desc.differing.fallback: "분리의 기준이 되는 실천 방식은 없다."
 faith_creation.1021.desc.outro.founder.mainline: "\n\n우리는 [old_faith.GetNameNoTooltip]에서 다른 교파를 판단하는 기준이 되는 주류 교파를 뒤로 하고 나아왔다. 저들이 주제넘다고 해도 상관없다."
 faith_creation.1021.desc.outro.founder.branch: "\n\n우리는 이미 새로운 분파였다. 이제는 우리가 만든 교파에 속하게 되었으며, 우리 스스로 책임을 감당해야 한다."
 faith_creation.1021.desc.outro.observer: "\n\n새로운 교파는 자주 생겨나곤 한다. 이 교파가 뿌리를 내릴지, 시들지, 이단으로 곪아갈지는 두고 봐야 할 일이다."
 faith_creation.1021.a.founder: "신자들 사이에 조용히 퍼지게 두자."
 faith_creation.1021.b.founder: "봉역 전체에 널리 알리자."
 faith_creation.1021.a: "살아있는 신앙에는 수많은 교파를 둘 자리가 있다."
 faith_creation.1021.b: "모든 이단은 새로운 것에서 시작되는 법."
