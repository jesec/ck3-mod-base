l_korean:
 religious_interaction.1.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.desc: "오랜 시간을 기도하고 숙고한 끝에 [secondary_recipient.GetWifeHusband]인 [secondary_recipient.GetFirstNameNoTooltip](와)과 이혼하겠다는 그대의 청을 받아들이기로 했소."
 religious_interaction.1.consanguinity: "그 사유는 근친 관계요."
 religious_interaction.1.fallback: "그 사유는 간통이 의심된다는 것이오."
 religious_interaction.1.adultery: "그 사유는 간통이오."
 religious_interaction.1.different_faith: "그 사유는 적대 신앙을 지지한다는 것이오."
 religious_interaction.1.eunuch: "그 사유는 한 [secondary_recipient.GetWomanMan]으로서의 자질이 없다는 것이오."
 religious_interaction.1.a: "유감이군, [secondary_recipient.GetFirstNameNoTooltip]."
 religious_interaction.1.price_feud: "\n\n그러나 이 일로 둘의 사이가 갈라질 일은 없을 것이라 보는데, 안 그렇소? 그러므로 그대를 대신해 내가 [secondary_recipient.GetFirstName]의 부정한 혐의를 [secondary_recipient.GetHouse.GetName] 집안 전체에 알렸소.\n\n그대의 [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] 가족은 이제... #EMP 영구적인#! 작별에 관심이 있는 것 같더군."
 religious_interaction.1.price_lease: "\n\n이 거짓 선언에는 대가가 따르오. [lease_order.GetName]에게 [barony_to_lease.GetName](을)를 임차하는 거요. 그대가 [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]에게 행했던 것처럼 이 신앙의 종들을 버리기라도 한다면... 그대의 영혼은 두 배로 더럽혀질 것이오."
 religious_interaction.1.price_hook: "\n\n이 의심스러운 선포로 그대의 [recipient.GetTitleAsName](이)가 그대에게 어떤 호의를 안겨 주었는지 생각해 보시오. 또한, 주는 것 역시 받는 것만큼이나 좋은 일이라는 사실을 명심하시오."
 religious_interaction.1.price_vows: "\n\n이는 빈약한 기반에 근거하며... 따라서 내 증거를 마련했으니, [secondary_recipient.GetFirstNameNoTooltip](은)는 그대의 [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))](이)가 되기 전에, [joining_order_title.GetAdjective] [secondary_recipient.Custom('SisterBrother')](으)로서 서약한 바 있소.\n\n내 직접 [secondary_recipient.GetHerHis] 헌신을 죽는 날까지 지키도록 할 것이오."
 religious_interaction.1.price_none: "\n\n물론 이는 터무니없는 촌극이오. 내 영혼을 더럽힌 추악한 거래지. 그러나 양심상 차마 그대에게 [secondary_recipient.GetFirstNameNoTooltip](와)과 부부 침상을 같이 써야 한다고 강요할 수는 없소."
 religious_interaction.1.a_feud: "이 사악한 [recipient.GetFaith.PriestNeuter] 같으니! 대체 무슨 짓을 한 거요?!"
 religious_interaction.1.a_hook: "[actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]에서 벗어났으며... [recipient.GetTitleAsNameNoTooltip](을)를 떠안게 되었군."
 religious_interaction.6.price_feud: "\n\n그러나 이 일로 둘의 사이가 갈라질 일은 없을 것이라 보는데, 안 그렇소? 그러므로 [actor.GetFirstNamePossessiveNoTooltip] 입장을 대신해 내가 [secondary_recipient.GetFirstName]의 부정한 혐의를 [secondary_recipient.GetHouse.GetName] 집안 전체에 알렸소.\n\n[actor.GetHerHis|U] [actor.Custom2('RelationToMePossessive', SCOPE.sC('secondary_recipient'))] 가족은 이제... #EMP 영구적인#! 작별에 관심이 있는 것 같더군."
 religious_interaction.6.price_lease: "\n\n이 거짓 선언에는 대가가 따르오. [lease_order.GetName]에게 [barony_to_lease.GetName](을)를 임차하는 거요. [secondary_recipient.GetFirstNameNoTooltip](이)가 [actor.GetHerHis] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))]에게 행했던 것처럼 이 신앙의 종들을 버리기라도 한다면... [actor.GetHerHis] 영혼은 두 배로 더럽혀질 것이오."
 religious_interaction.6.price_hook: "\n\n이 의심스러운 선포로 그대의 [recipient.GetTitleAsName](이)가 그대에게 어떤 호의를 안겨 주었는지 생각해 보시오. 또한, 주는 것 역시 받는 것만큼이나 좋은 일이라는 사실을 명심하시오."
 religious_interaction.6.price_vows: "\n\n이는 빈약한 기반에 근거하며... 따라서 내 증거를 마련했으니, [secondary_recipient.GetFirstNameNoTooltip](은)는 [actor.GetFirstNamePossessiveNoTooltip] [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))](이)가 되기 전에, [joining_order_title.GetAdjective] [secondary_recipient.Custom('SisterBrother')](으)로서 서약한 바 있소.\n\n내 직접 [secondary_recipient.GetHerHis] 헌신을 죽는 날까지 지키도록 할 것이오."
 religious_interaction.6.price_none: "\n\n물론 이는 터무니없는 촌극이오. 내 영혼을 더럽힌 추악한 거래지. 그러나 양심상 차마 [actor.GetFirstNameNoTooltip]에게 [secondary_recipient.GetFirstNameNoTooltip](와)과 부부 침상을 같이 써야 한다고 강요할 수는 없소."
 religious_interaction.2.desc: "오랜 시간을 숙고한 끝에 가문 내에서 화제의 중심이었던 일에 대한 결심이 섰소. [secondary_recipient.GetWifeHusband]인 [secondary_recipient.GetFirstNameNoTooltip](와)과 이혼하겠다는 그대의 청을 받아들이리다."
 religious_interaction.2.infertility: "그 사유는 신방에 들기를 거부했다는 것이오."
 religious_interaction.2.adultery: "그 사유는 타인과 동침하여 결혼의 신성함을 모독했다는 것이오."
 religious_interaction.3.desc_subordinate: "지상에 있는 [actor.GetFaith.HighGodNamePossessive] 모든 대표자를 대신해, 그대의 청을 받아들이겠소."
 religious_interaction.3.desc: "역경에 처한 상태란 점을 고려해서, 그대의 청을 받아들이기로 했소."
 religious_interaction.3.defensive_war: "이 자금으로 [war_target.GetTitledFirstName](와)과 그자가 이끄는 [war_target.GetFaith.GetAdjective] 무리로부터 그대의 믿음을 지켜내기를 바라리다!"
 religious_interaction.2.offensive_war: "이 자금으로 [war_target.GetTitledFirstName](을)를 상대로 한 전쟁에서 승리하기를 바라리다!"
 religious_interaction.3.fallback: "이 자금으로 그대의 영지에 참된 신앙을 퍼뜨릴 수 있기를 바라리다!"
 religious_interaction.3.a: "[ROOT.Char.GetFaith.WealthGodName](을)를 찬미하라! 국세가 환급되었나니!"
 religious_interaction.3.b: "이 자금이 승리를 불러올 거요!"
 religious_interaction.3.c: "이 자금을 현명하게 사용하겠소."
 religious_interaction.3.d: "이 금화라면 병들어 있던 재정을 치료할 수 있을 거요!"
 religious_interaction.32.desc: "심사숙고한 끝에 그대의 청을 거절하기로 했소."
 religious_interaction.32.a: "이럴 수가!"
 religious_interaction.4.desc: "그대의 청을 숙고한 끝에 [target.GetName]에 대한 권리를 인정하기로 했소."
 religious_interaction.4.child: "[secondary_recipient.GetTitledFirstName](은)는 어린아이에 불과하기에, 그대가 개입할 만한 여지가 있다고 판단한 거요."
 religious_interaction.4.they_are_female: "[secondary_recipient.GetTitledFirstName](은)는 여성이기에, 그대가 개입할 만한 여지가 있다고 판단한 거요."
 religious_interaction.4.they_are_male: "[secondary_recipient.GetTitledFirstName](은)는 남성이기에, 그대가 개입할 만한 여지가 있다고 판단한 거요."
 religious_interaction.4.fallback: "그대의 조상이 이 땅을 통치했단 사실을 증명할 반박하지 못할 증거가 있더구려."
 religious_interaction.4.a: "내가 정당한 통치자임을 증명해냈다!"
 religious_interaction.42.desc: "심사숙고한 끝에 [target.GetName](을)를 내어달라는 그대의 청을 거절하기로 했소."
 religious_interaction.42.a: "젠장!"
 religious_interaction.5.child: "그대는 채 성년이 되지 못한 몸이오."
 religious_interaction.5.they_are_female: "그대에게는 여성스러운 측면이 다분하오."
 religious_interaction.5.they_are_male: "그대에게는 남성스러운 측면이 다분하오."
 religious_interaction.5.fallback: "그대는 신앙심이 부족한 사람이오."
 religious_interaction.5.outro: "교회 측에서 크게 우려해도 이상할 게 없는 사안이지."
 religious_interaction.5.outro_different_recipient: "그래서 [target.GetName](을)를 내어달라는 [actor.GetName]의 청을 받아들이기로 했소."
 religious_interaction.5.self: "그것이 내 권리이기에, 나는 [target.GetName]에 대한 권리를 주장하기로 했소."
 religious_interaction.5.a: "감히 나를 희롱하다니!"
 religious_interaction.6.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.desc: "오랜 시간을 기도하고 숙고한 끝에 [secondary_recipient.GetFirstNameNoTooltip](와)과 이혼하겠다는 [secondary_actor.GetFirstNameNoTooltip]의 청을 받아들이기로 했소."
 religious_interaction.6.consanguinity: "그 사유는 근친 관계요."
 religious_interaction.6.fallback: "그 사유는 간통이 의심된다는 것이오."
 religious_interaction.6.adultery: "그 사유는 간통이오."
 religious_interaction.6.different_faith: "그 사유는 적대 신앙을 지지한다는 것이오."
 religious_interaction.6.eunuch: "그 사유는 [actor.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))](으)로서의 자질이 없다는 것이오."
 religious_interaction.6.a: "이제 [actor.GetFirstNameNoTooltip](와)과 [secondary_recipient.GetFirstNameNoTooltip](은)는 아무 사이가 아니다."
 religious_interaction.1001.t.fatwa: "파트와가 발의되다!"
 religious_interaction.1001.t: "법에 의거한 비난을 받다!"
 religious_interaction.1001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]인 [actor.GetTitledFirstName](이)가 [actor.GetFaith.PriestNeuterPlural](이)가 작성한 서한에 의거하여 날 범죄자라 규탄했다!\n\n그 서한을 법적 근거로 삼아서 날 [recipient.GetFaith.GetAdjective] 영지를 통치하기에 부적합한 인물로 몰려고 하겠지."
 religious_interaction.1001.a: "주군만 아니었다면, 어떻게 했을 텐데..."
 religious_interaction.1001.a.revoke_tt: "[actor.GetTitledFirstName](이)가 지위를 [revoke|E]할 수도 있음"
 #Religious Head of Faith Interactions
 religious_interaction.1010_subordinate: "가장 신성한 [actor.GetFaith.GetAdjective]의 귀, 가장 거룩한 [actor.GetFaith.GetAdjective]의 심장에 닿는 그대의 중재자로서, 그대가 진 죄악의 무게를 유예해 주겠소.\n\n그대는 넉넉한 헌금을 기부함으로써 용서받았소."
 religious_interaction.1010: "속죄할 방법을 찾으려 하다니, 칭찬받아 마땅한 일이오. 넉넉하게 기부해준 보답으로 그대를 축복해주리다."
 religious_interaction.1011: "이런 금화 따위로는 속죄하지 못할 만큼 끔찍한 악행을 저질렀잖소. 진정으로 속죄하길 원한다면, 그대의 방식을 바꿔서 진정으로 용서를 구하고 있단 사실을 증명해 보이시오. 기부는 그런 다음에 받아들이도록 하겠소."
 religious_interaction.excommunication.opening: "[excommunication_issuer.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1020: "[actor.GetTitledFirstName]에게서 그대가 악행을 저질렀단 충격적인 소식을 전해 들었소."
 religious_interaction.1020.requested: "[actor.GetTitledFirstName]에게서 그대가 악행을 저질렀다는 충격적인 보고를 받았소. [actor.GetHerHis] 권고를 따라, 그대를 [recipient.GetFaith.GetAdjective] 신앙에서 파문하였소.\n\n[recipient.GetFaith.HighGodName]께서 그대의 영혼에 자비를 베푸시기를."
 religious_interaction.1020.sin: "[actor.GetTitledFirstName](이)가 그대의 [my_sinful_trait.GetName( ROOT.Char )] 천성에 대한 충격적인 보고를 전해 왔소. [actor.GetHerHis] 권고를 따라 그대를 [recipient.GetFaith.GetAdjective] 신앙에서 파문하였소.\n\n[recipient.GetFaith.HighGodName]께서 그대의 영혼에 자비를 베푸시기를."
 religious_interaction.1020.empire: "그대의 제위에 대한 명분이 [recipient.GetFaith.GetAdjective] 신앙을 분열시켰소. 따라서 [actor.GetTitledFirstNamePossessive] 권고를 따라 그대를 파문하였소."
 religious_interaction.1020.a.tt_petition: "#help [piety|E]를 획득합니다. 1년 뒤 당신의 [head_of_faith|E]에게 직접 탄원해 #high $petition_head_of_faith_decision_option_repentance$#!를 선택합니다. [Concept( 'excommunicated_recovery', '해소 방법' )|E]을 확인하세요.#!"
 religious_interaction.1020.a.tt_declaration: "#help [piety|E]를 획득합니다. 1년 뒤 유효한 성직자에게 #high $declaration_of_repentance_interaction$#!을 사용하세요. [Concept( 'excommunicated_recovery', '해소 방법' )|E]을 확인하세요.#!"
 religious_interaction.1020.a: "보속을 받아들이고 사죄를 추구하겠다."
 religious_interaction.1020.b: "망할 [actor.GetFirstNameNoTooltip]!"
 religious_interaction.1020.b.tt: "#help [stress|E]가 감소합니다. [actor.GetShortUIName](와)과의 [rivalry|E] 관계 진행도가 증가합니다.#!"
 religious_interaction.1020.c: "[actor.GetHerHim]의 말을 듣다니, 망할 [recipient.GetTitleAsNameNoTooltip]!"
 religious_interaction.1020.c.tt: "#help [stress|E]가 감소합니다. [recipient.GetShortUIName](와)과의 [rivalry|E] 관계 진행도가 증가합니다. [GetTrait('cynical').GetName( GetNullCharacter )], [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('arbitrary').GetName( GetNullCharacter )] 특성을 보유한 [courtiers|E]가 찬성합니다.#!"
 religious_interaction.1021.generic: "우리는 죄악 속에 태어났으니, 누구나 잘못을 저지를 수 있소. 하지만 그대는 그리스도의 길을 걸으려는 시도조차 하지 않는구려."
 religious_interaction.1021.empire: "이 말세에 그대는 기독교 세계의 요구보다 자신의 야심을 먼저 생각했소. 그대의 제국을 향한 명분은 교회의 몸에 생긴 궤양이나 다름없소!"
 religious_interaction.1021.clergy_hostility: "우리 사이의 원한은 잘 알려져 있소. 그러나 내가 그대를 내쫓는 이유는 그대가 죄악을 사랑하며, 명령에 불복종하기 때문이오."
 religious_interaction.1021.sin: "그대의 [my_sinful_trait.GetName( ROOT.Char )] 성격은 누구나 잘 알고 있소. 그대와 같은 이가 무리를 잘못된 길로 이끄는 것을 두고 볼 수 없소."
 religious_interaction.1021.conclusion: "\n\n그대를 [actor.GetFaith.GetAdjective] 신앙에서 파문하였소. [actor.GetFaith.HighGodName]께서 그대의 영혼에 자비를 베푸시기를."
 religious_interaction.1021.a: "교회의 판단을 따르겠다."
 religious_interaction.1021.b: "내 왕관은 [actor.GetTitleAsNameNoTooltip](이)가 아니라 [recipient.GetFaith.HighGodName]께서 주신 것이다!"
 religious_interaction.1021.b.tt: "#help [stress|E]가 감소합니다. [actor.GetShortUIName](와)과의 [rivalry|E] 관계 진행도가 증가합니다. [GetTrait('cynical').GetName( GetNullCharacter )], [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('arbitrary').GetName( GetNullCharacter )] 특성을 보유한 [courtiers|E]가 찬성합니다.#!"
 religious_interaction.1022: "그대에게서 [secondary_recipient.GetTitledFirstNamePossessive] 악행에 관한 이야기를 들었을 때만큼 당황스러웠던 적은 없었소. 참으로 고통스러운 결정이지만, [actor.GetFaith.GetAdjective] 신앙의 미래를 위해서라도 그를 파문해야겠구려."
 religious_interaction.1022.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 파문 요청을 수락함"
 religious_interaction.1023: "같은 신을 섬기는 [actor.GetFaith.GetAdherentName](을)를 파문하려 들다니, 대체 뭐 하자는 거요? [actor.GetFaith.GetAdjective] 신앙은 정치적인 이득을 얻기 위해 이용해도 좋을 도구가 아니오! 이런 터무니없는 부탁을 했는데도 제명당하지 않았다는 사실에 감사하면서 사시오! "
 religious_interaction.1023.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 파문 요청을 거부함"
 religious_interaction.1024: "그대가 진정으로 죄를 뉘우쳤으며, 속죄하기 위해 갖은 애를 썼다는 사실을 인정하리다. [actor.GetFaith.GetAdjective] 신앙을 저버리는 통탄할 일을 저지르긴 했지만, 근래에 들어 보여줬던 행동을 고려한다면 재차 기회를 줘도 괜찮지 않을까 싶소.\n\n이에 따라 그대에게 내려졌던 파문 조치를 철회하겠소. 다시 한번 [actor.GetFaith.GetAdjective]에 귀의한 것을 환영하는 바요."
 religious_interaction.1024.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 파문 조치를 철회함"
 religious_interaction.1025: "날 가벼운 마음으로 파문을 공표하는 사람이라 생각했소? 그렇게 얄팍한 사과로 잘못을 덮으려고 했던 거요? 어디 마음대로 해보시오. 악독한 마음을 고쳐먹었단 걸 증명해낼 때까지는 [actor.GetFaith.GetAdjective]에 발도 못 붙이게 만들어줄 테니."
 religious_interaction.1025.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 파문 조치 철회를 거부함"
 religious_interaction.1030: "오랜 시간을 숙고해봤습니다. 당신의 말은 진실되고 현명한 것이었더군요. 수도회에 들어가서 [actor.GetFaith.HighGodName](을)를 섬기며 새로운 삶을 시작해볼까 합니다."
 religious_interaction.1031: "신성한 맹세를 제안해 주다니, 영광입니다. 그러나 [recipient.GetFaith.HighGodName|U]께서는 수도원 벽 너머에 저를 위한 계획을 세워 두신 것 같습니다. 제 영혼과 양심을 생각하면 도저히 그 말을 할 수가 없군요."
 religious_interaction.1031.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 서원 요청을 거부함"
 religious_interaction.1000.positive: "현명한 태도를 보인 [recipient.GetFirstNameNoTooltip]한테 감사할 따름이다."
 religious_interaction.1000.negative: "이렇게 유감스러운 일이 있나."
 religious_interaction.1000.strong_negative: "젠장!"
 religious_interaction.1024.positive: "현명한 태도를 보인 [recipient.GetFirstNameNoTooltip]한테 감사할 따름이다."
 religious_interaction.2002.desc: "당신이 보여준 빛을 좇아 [ROOT.Char.GetFaith.GetName](으)로 개종하겠나이다!"
 religious_interaction.2002.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 개종 요구를 받아들임"
 religious_interaction.2002.a: "[ROOT.Char.GetFaith.HighGodName]께서 축복하시기를!"
 religious_interaction.2003.desc: "속물적인 사탕발림 따위로는 내 믿음을 흔들 수 없습니다. [recipient.GetFaith.DivineRealm]에서 보상받을 날을 기다릴 생각이니까."
 religious_interaction.2003.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 개종 요구를 거부함"
 religious_interaction.2003.hooking_out: "\n\n내게 빚을 졌다는 사실을 명심했으면 좋겠군요. 참된 신자가 되겠답시고 절 쫓아다니진 말아줬으면 좋겠습니다."
 religious_interaction.2003.a: "그대가 구원받기를 바랐던 것뿐이오."
 religious_interaction.2003.b: "이번 생에 그 빚을 갚는 게 어떻겠소!"
 religious_interaction.2003.c: "이대로 도망치게 놔두진 않겠소!"
 religious_interaction.2003.d: "내가 무슨 말을 했는지 깨달을 날이 올 거요."
 religious_interaction.2011.desc: "저 역시도 당신처럼 열광하고 싶지만, [recipient.GetFaith.HouseOfWorshipPlural](을)를 재단장하고 농민들을 개종시키는 비용이 만만치 않더군요.\n\n그 비용을 대신 내준다면, [ROOT.Char.GetFaith.HighGodName](을)를 위해 기도드릴 수도 있을 것 같은데..."
 religious_interaction.2011.toast_puppeteer: "금화를 치르지 않는 한 [recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 요구를 거부함"
 religious_interaction.2011.a: "신앙을 위해서라면 뭐든 해야지."
 religious_interaction.2011.b: "그쪽이 구원받는 데 돈을 치를 생각은 없소!"
 religious_interaction.2011.c: "금화보다 더 값어치 있는 것들을 위한 일이잖소."
 religious_interaction.2012.desc: "당신의 신앙에 어떤 지혜가 깃들어 있는지 깨달았습니다. 하지만 어둠에서 빛으로 향하는 여정은 길고 고되기 마련이지요.\n\n필요한 물자를 지원해 주겠노라 약조한다면, 그 여정이 수월해지지 않을까 싶은데..."
 religious_interaction.2012.toast_puppeteer: "호의를 약속하지 않는 한 [recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 요구를 거부함"
 religious_interaction.2012.a: "받아들이리다. 어디까지나 신자들을 위하여."
 religious_interaction.2012.b: "귀의하니 마니 흥정할 생각은 없소!"
 religious_interaction.2012.c: "우선 다른 빚부터 갚은 뒤에 얘기합시다."
 religious_interaction.2015.desc: "[actor.GetRite.GetName](이)가 당신에게 힘을 실어주었군요. 그대가 [actor.GetFaith.HighGodName]에게서 얻는 힘을 더 잘 이해하고 싶습니다."
 religious_interaction.2015.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUIName]에게 신앙을 학습하는 동안 기다려 달라고 함"
 religious_interaction.2015.a: "[actor.GetFaith.GoodGodNames]의 길을 가르쳐 주겠소."
 religious_interaction.2015.b: "오늘 [actor.GetFaith.GoodGodNames] 앞에 절하라!"
 religious_interaction.2015.c: "직접 실천하면서 배우는 게 좋을 것 같군."
 religious_interaction.2016.desc: "그대가 요청했던 대로, 내 감독 아래에서 [actor.GetFaith.GoodGodNames]의 가르침을 배우도록 하시오."
 religious_interaction.2016.a: "시작하지."
 religious_interaction.2016.a.tt: "당신이 [actor.GetShortUINameNoTooltip](와)과 [GetScheme('study_faith').GetTypeName](을)를 시작하게 됨."
 religious_interaction.2021.opening: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2021.desc: "[puppet_or_actor.Custom2('AppropriateGreeting', ROOT.Char)]\n나를 따라 빛에 귀의할 때가 되었소, [puppet_or_actor.Custom2('RelationToMe', SCOPE.sC('recipient'))]. 내게 엄청난 빚을 지고 있잖소. 이를 고려해서 [puppet_or_actor.GetFaith.GetName](으)로 개종해 줬으면 하오!"
 religious_interaction.2021.a: "그게... 알겠습니다, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('puppet_or_actor'))]."
 #######################################################
 ### Sun Trial by Mathilda Bjarnehed & Nick Meredith ###
 #######################################################
 #I have been left in the sun to die!
 religious_interaction.2100.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] 심판"
 religious_interaction.2100.desc: "어두운 감방에서 얼마나 오랜 시간을 보냈는지 알 사람은 [ROOT.Char.GetFaith.HighGodName]뿐이리라. 가혹한 땡볕에 눈이 멀 것만 같았다. 경비대가 날 [imprisoner.Custom('FortifiedBuilding')] 밖으로 데려가더니, 놀라우리만치 엄숙한 분위기의 황무지로 데려갔다. 참으로 유난스럽다고 느껴질 정도였다.\n\n"
 religious_interaction.2100.descwaterlogged: "태양이 밝게 빛났고, 내가 밟고 있던 습지가 말라붙어 진득하게 발목을 잡았다. 얼마 지나지 않아서 나를 수감시킨 [imprisoner.GetTitledFirstName](이)가 [imprisoner.Custom('DefaultPriestTitlePlural')] 여럿과 함께 다가왔다. 거만하면서도 조심스럽게 물에 젖은 수풀을 가로지르는 모양새였다.\n\n"
 religious_interaction.2100.descpleasant: "태양이 밝게 빛났고, 내가 밟고 있던 땅은 건강하고 푸르러 보였다. 얼마 지나지 않아서 나를 수감시킨 [imprisoner.GetTitledFirstName](이)가 [imprisoner.Custom('DefaultPriestTitlePlural')] 여럿과 함께 다가왔다. 그런데 분위기가 어쩐지 심상치 않았다.\n\n"
 religious_interaction.2100.descforest: "태양이 밝게 빛나며 나무 아래로 햇살을 만들었다. 얼마 지나지 않아서 나를 수감시킨 [imprisoner.GetTitledFirstName](이)가 [imprisoner.Custom('DefaultPriestTitlePlural')] 여럿과 함께 덤불에서 길을 뚫으며 다가왔다.\n\n"
 religious_interaction.2100.descoasis: "햇빛이 사막을 뒤덮으며 오아시스 수면에서 반사되었다. 얼마 지나지 않아서 나를 수감시킨 [imprisoner.GetTitledFirstName](이)가 [imprisoner.Custom('DefaultPriestTitlePlural')] 여럿과 함께 물을 첨벙이며 다가왔다.\n\n"
 religious_interaction.2100.deschostile: "십수 명의 [imprisoner.Custom('DefaultPriestTitlePlural')] 옆에 자리한 [imprisoner.GetTitledFirstName](이)가 눈에 들어왔다. 그 순간, 이 짧은 여정의 목적이 무엇인지를 알게 되었다.\n\n\"[ROOT.Char.GetFullNameNoTooltip](은)는 들어라. 너희는 말뚝에 묶인 채로 이 자리에 남겨질 거다. [imprisoner.GetFaith.HighGodName]께서 너희의 운명을 결정지으시겠지. 무고한 자는 살아남을 것이요, 죄지은 자는 스러질 것이다.\""
 religious_interaction.2100.middledefault: "\"너희의 죄는 전능하신 [imprisoner.GetFaith.HighGodName|U]께서 심판하실 것이다.\" [imprisoner.GetSheHe|U]가 낮은 목소리로 말했다. 간수들이 다가와서 내 사지를 말뚝에 고정했다. [imprisoner.Custom('DefaultPriestTitlePlural')]들은 팔을 뻗은 채 장송가를 불렀다. 그리고 모두 떠나갔다. 나는 홀로 남아 갈증으로 죽을 것이다."
 religious_interaction.2100.middleoasis: "\"너희의 죄는 전능하신 [imprisoner.GetFaith.HighGodName|U]께서 심판하실 것이다.\" [imprisoner.GetSheHe|U]가 낮은 목소리로 말했다. 간수들이 다가와서 내 사지를 말뚝에 고정했다. 가슴까지 오아시스에 잠겼다. [imprisoner.Custom('DefaultPriestTitlePlural')]들은 팔을 뻗은 채 장송가를 불렀다. 그리고 모두 떠나갔다. 나는 홀로 남아 갈증으로 죽을 것이다."
 religious_interaction.2100.endwaterlogged: "\n\n나는 눈을 돌려 물에 잠긴 주변을 살폈다."
 religious_interaction.2100.endpleasant: "\n\n나는 눈을 돌려 쾌적한 주변 환경을 살폈다."
 religious_interaction.2100.endforest: "\n\n나는 눈을 돌려 푸르른 주변 환경을 살폈다."
 religious_interaction.2100.endoasis: "\n\n나는 시선을 내려 물을 바라봤다."
 religious_interaction.2100.a.believer: "[imprisoner.GetFaith.HighGodName|U]께서 공정한 판결을 내리시리니!"
 religious_interaction.2100.a.unbeliever: "날 여기에 #EMP 놔두고#! 갈 생각이야?!"
 religious_interaction.2100.a.confused: "음..."
 religious_interaction.2100.a.success: "심판에서 살아남음"
 religious_interaction.2100.a.failure: "햇볕 아래서 죽음을 맞이함"
 #I have survived!
 religious_interaction.2101.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] 자비"
 religious_interaction.2101.start.desc: "물을 줘! 물을 달라고! 목이, 머리가, 피부가... 타는 것만 같아!\n\n[ROOT.Char.GetFaith.DevilName](이)가 고통에 겨운 모습을 비웃고 있진 않을까?[ROOT.Char.GetFaith.WaterGodName]께서 마실 물을 내려주신다면 좋을 텐데. 마시고 또 마셔도 이 갈증은 가라앉을 기미가 보이지 않는다."
 religious_interaction.2101.end.desc: "\n\n[imprisoner.GetTitledFirstName](이)가 돌아와서는 내 입가에다가 물병을 쑤셔 박았다. 흐릿하기만 했던 정신이 맑아졌다. [imprisoner.GetTitleAsNameNoTooltip](은)는 내가 살아 있다는 사실에 살짝 실망한 눈치를 보였다. 하지만 신의 판단이 그렇다는데 어쩌겠는가."
 religious_interaction.2101.desc.pleasant: "나는 뜬금없이 밖에서 지내게 된 시간을 거의 #EMP 즐기다시피#! 했다. 새들은 지저귀고, 햇볕은 내 몸을 데웠다. 튀어 오르는 빗물은 몸을 씻고 갈증을 달랬다.\n\n돌아온 [imprisoner.GetTitledFirstName](은)는 나의 활기찬 모습과 선한 영혼에 분노한 것이 분명했다. 하지만 자신이 정한 기준을 회피할 수도 없었다. 이것이 신께서 심판한 결과였으니까!"
 religious_interaction.2101.desc.oasis: "나는 오아시스의 시원한 물속에서 보내게 된 시간을 #EMP 즐기다시피#! 했다. 뙤약볕이 따갑게 내리쬐긴 했지만, 밧줄이 느슨해서 몸을 숙여 물을 마실 수 있을 정도였다.\n\n돌아온 [imprisoner.GetTitledFirstName](은)는 나의 멀쩡한 모습에 분노한 것이 분명했다. 하지만 자신이 정한 기준을 회피할 수도 없었다. 이것이 신께서 심판한 결과였으니까!"
 religious_interaction.2101.a: "나는 결백하다!"
 #They survived...
 religious_interaction.2102.desc: "[prisoner.GetTitledFirstNamePossessive] 시련이 끝나기 전날 밤, 의식을 잃은 채로 겨우 숨만 붙어 있던 [prisoner.GetHerHim]를 발견했다.\n\n\"이건 기적이야!\" 하늘을 향해 손을 치켜든 [ROOT.Char.Custom('DefaultPriestTitle')](이)가 입을 열었다. \"[ROOT.Char.GetFaith.HighGodName|U]께서 응답하셨도다! 이 자는 결백하다!\""
 religious_interaction.2102.oasis: "나는 물보라를 일으키며 오아시스로 들어가 [prisoner.GetTitledFirstName]에게 다가갔다. [prisoner.GetSheHe]는 여전히 말뚝에 고정되어 있었다. 다만 의식은 흐릿해 보였으면서도 아주 건강한 상태라는 사실이 고스란히 드러났다.\n\n\"이건 기적이야!\" 하늘을 향해 손을 치켜든 [ROOT.Char.Custom('DefaultPriestTitle')](이)가 입을 열었다. \"[ROOT.Char.GetFaith.HighGodName|U]께서 응답하셨도다! 이자는 결백하다!\"\n\n[ROOT.Char.Custom('DefaultPriestTitlePlural')](이)가 [prisoner.GetFirstNameNoTooltip](을)를 풀어주는 모습에 나는 좌절하여 이를 갈았다. 왜 하필 저 녀석을 #EMP 여기에#! 놔둬야 했던 거지?!"
 religious_interaction.2102.pleasant: "나는 물보라를 일으키며 오아시스로 들어가 [prisoner.GetTitledFirstName]에게 다가갔다. [prisoner.GetSheHe]는 여전히 말뚝에 고정되어 있었다. 다만 의식은 흐릿해 보였으면서도 #EMP 웃음#!이 입가를 떠나지 않는 모습이었다.\n\n\"이건 기적이야!\" 하늘을 향해 손을 치켜든 [ROOT.Char.Custom('DefaultPriestTitle')](이)가 입을 열었다. \"[ROOT.Char.GetFaith.HighGodName|U]께서 응답하셨도다! 이자는 결백하다!\"\n\n[ROOT.Char.Custom('DefaultPriestTitlePlural')](이)가 [prisoner.GetFirstNameNoTooltip](을)를 풀어주는 모습에 나는 좌절하여 이를 갈았다. 왜 하필 저 녀석을 #EMP 여기에#! 놔둬야 했던 거지?!"
 religious_interaction.2102.a: "모든 게 [ROOT.Char.GetFaith.HighGodNamePossessive|U] 뜻이로다."
 religious_interaction.2102.b: "죽은 사람이나 다름없어 보이는데..."
 religious_interaction.2102.b.tt: "[ROOT.Char.GetFaith.HighGodName|U]께서 #EMP 항상#! 옳으신 건 아니잖아!"
 religious_interaction.2102.b.success: "개입했다는 사실이 발각되지 않음"
 religious_interaction.2102.b.failure: "살인자였다는 사실을 발각당함"
 #I have died...
 religious_interaction.2103.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] 격노"
 religious_interaction.2103.end.desc: "\n\n이게 그분의 뜻이라면, 받아들이는 게 옳은 거겠지. 내가... 악한 사람이었던 걸지도..."
 religious_interaction.2103.desc.pleasant: "뭘 그렇게 확신했던 걸까. 내가 병신이지. 이렇게 오래 밖에 있으면 누구든 사나워질 거야. 그걸 이제야 알겠어. 낮에는 태양이, 밤에는 바람이 나를 괴롭힌다. 하늘은 끔찍할 정도로 구름 한 점 없이 맑다.\n\n물... 물은 어디에 있나. 사방이 자연이니 물이 없을 리 없건만, 목을 축일 물은 한 방울도 없구나. 절망적인 생각만이 머리를 가득 채운다."
 religious_interaction.2103.desc.waterlogged: "바람과 태양이 나를 끊임없이 괴롭힌다. 그나마 홍수처럼 하늘을 뒤덮은 비구름 덕분에 갈증으로 죽을 일은 없다. 먹구름이 또 밀려오는 모습을 보고 있자면 미소가 절로 지어진다.\n\n갑자기 세상이 흔들린다. 처음에는 느끼기도 힘들 정도였지만, 진동이 점차 빨라진다. 잠시 후, 말뚝이 점차 기울어지며 웅덩이로 쓰러지고 있다는 사실을 깨달았다!\n\n몸이 물에 부딪히며 물보라를 일으킨다. 온몸을 비틀며 탈출하려 애써 보지만 아무 소용도 없다. 팔다리는 묶여 있고, 말뚝의 무게 때문에 얕은 웅덩이 속으로 더 깊이 파고든다. 비명을 질러도 소리가 나오지 않는다. 입안으로 물이 밀려와서 빈 공간을 가득 채운다."
 religious_interaction.2103.desc.oasis: "심판을 받는 것일까, 뙤약볕이 피부를 뜨겁게 달군다. 그나마 오아시스 물속에 매달려 가슴까지 차오른 물 덕분에 시원함도 같이 느껴진다.\n\n갑자기 세상이 흔들린다. 처음에는 느끼기도 힘들 정도였지만, 진동이 점차 빨라진다. 말뚝을 고정하던 부드러운 모래가 가라앉는 모양이다. 눈 깜짝할 사이에 나는 오아시스에 완전히 빠지고 말았다.\n\n몸이 물에 부딪히며 물보라를 일으킨다. 온몸을 비틀며 탈출하려 애써 보지만 아무 소용도 없다. 팔다리는 묶여 있고, 말뚝의 무게 때문에 오아시스 속으로 더 깊이 파고든다. 비명을 질러도 귀에 들리는 소리는 없다. 입안으로 물이 밀려와서 빈 공간을 가득 채운다."
 religious_interaction.2103.a: "너... 너무 힘들어..."
 religious_interaction.2103.b: " #DIE1 부...#! #DIE2 부글...#!"
 #They died!
 religious_interaction.2104.desc: "[prisoner.GetTitledFirstNamePossessive] 시련이 끝나기 전날 밤, [prisoner.GetSheHe]는 우리가 다가갔음에도 불구하고 미동조차 하지 않았다. 하인 하나가 말라붙은 입가에 물병을 가져갔다. 하지만 [prisoner.GetSheHe]는 아무런 반응을 보이지 않았고, 물줄기는 턱을 따라 흘러내렸다.\n\n\"[ROOT.Char.GetFaith.HighGodName|U]께서 응답하셨도다!\" 하늘을 향해 손을 치켜든 [ROOT.Char.Custom('DefaultPriestTitle')](이)가 입을 열었다. \"죄지은 자로다!\""
 religious_interaction.2104.desc.drowned: "말뚝에 묶어 둔 [prisoner.GetTitledFirstName]에게 다가가는데, 무언가 잘못되었다는 사실이 금세 분명해진다. 말뚝이 앞으로 넘어지면서 [prisoner.GetHerHim] 또한 웅덩이에 곧장 빠졌다. 사지를 묶은 밧줄이 역할을 다한 건 물론이고, 말뚝 무게까지 더해졌으니 [prisoner.GetTitledFirstName](이)가 살아날 기회 따윈 없었겠지.\n\n\"[ROOT.Char.GetFaith.HighGodName|U]께서 응답하셨도다!\" 하늘을 향해 손을 치켜든 [ROOT.Char.Custom('DefaultPriestTitle')](이)가 입을 열었다. \"죄지은 자로다!\""
 religious_interaction.2104.desc.oasisdrowned: "말뚝에 묶어 둔 [prisoner.GetTitledFirstName]에게 다가가는데, 무언가 잘못되었다는 사실이 금세 분명해진다. 말뚝이 앞으로 넘어지면서 [prisoner.GetHerHim] 또한 오아시스에 곧장 빠졌다. 사지를 묶은 밧줄이 역할을 다한 건 물론이고, 말뚝 무게까지 더해졌으니 [prisoner.GetTitledFirstName](이)가 살아날 기회 따윈 없었겠지.\n\n\"[ROOT.Char.GetFaith.HighGodName|U]께서 응답하셨도다!\" 하늘을 향해 손을 치켜든 [ROOT.Char.Custom('DefaultPriestTitle')](이)가 입을 열었다. \"죄지은 자로다!\""
 religious_interaction.2104.b.drowned: "흠. 뭐 그런 관점도 있을 수 있지..."
 ##############################################
 ### Literalist Debate by Ewan Cowhig Croft ###
 ##############################################
 religious_interaction.2400.t: "대규모 공청회"
 religious_interaction.2400.desc: "[puppet_or_actor.GetTitledFirstNamePossessive] 열화와 같은 편지를 읽어내리던 종자가 두려움에 몸을 떨었다. 그 편지에는 우리의 신앙에서 제시한 미덕과 죄악에 대해 공청회를 벌이자는 내용이 적혀 있었다. 내가 [recipient.GetFaith.GetNameNoTooltip]의 기본 원리를 제대로 따르고 있는지에 의구심이 든다는 내용도 함께였다.\n\n내 신앙심에 대한 [puppet_or_actor.GetShortUINamePossessiveNoTooltip] 의견이 확실히 담긴 편지였기에, 하인들도 놀란 마음에 말을 더듬었다."
 religious_interaction.2400.a: "그 개자식이! 도전을 받아들이지!"
 religious_interaction.2400.a.tt_success: "공청회에서 [puppet_or_actor.GetShortUINameNoTooltip](이)가 망신을 당함"
 religious_interaction.2400.a.tt_fail: "[puppet_or_actor.GetShortUINameNoTooltip](이)가 내 신앙심에 의문을 제기하는 데 성공함"
 religious_interaction.2400.b: "같잖은 일에 휘말려서 [recipient.GetFaith.HighGodNamePossessive] 이름을 더럽힐 수는 없지."
 religious_interaction.2400.b.tt: "[puppet_or_actor.GetShortUINameNoTooltip](이)가 해당 사실을 알게 됨"
 religious_interaction.2400.b_turned_down: "[recipient.GetShortUIName|U](이)가 논쟁을 벌이자는 요청을 거부함"
 religious_interaction.2400.b_turned_down_puppeteer: "[recipient.GetShortUIName|U](이)가 논쟁을 벌이자는 [puppet_or_actor.GetShortUINamePossessive] 요청을 거부함"
 used_literalist_debate_modifier: "최근 논쟁을 벌임"
 used_literalist_debate_modifier_desc: "해당 인물은 최근 신앙의 본질에 관한 논쟁을 벌였습니다."
 literally_debated_modifier: "최근 논쟁을 벌임"
 literally_debated_modifier_desc: "해당 인물은 최근 신앙의 본질에 관한 논쟁에 참여했습니다."
 religious_interaction.2401.desc_intro: "[debate_locale.GetNameNoTierNoTooltip]의 거대한 회당에서 논쟁 상대와 마주하게 되었다. 흔들거리는 탁자를 낀 채로 겨우 몇 발짝 떨어진 우리를 구경꾼들이 둘러쌌다. 군중들 사이로 쉿 하는 소리가 들려왔다. 다들 논쟁이 시작되기를 기다리는 눈치였다.\n\n"
 religious_interaction.2401.desc_won: "한 시간 가까이 이어진 논쟁으로 [recipient.GetTitledFirstName](을)를 무너뜨렸다. 신앙심과 도덕심을 꼬집으면서, [puppet_or_actor.GetFaith.HighGodName](을)를 향한 충성에도 의구심을 제기하는 식으로 말이다. 성난 군중이 [recipient.GetTitledFirstNameNoTooltip]에게 썩은 달걀과 곰팡이가 핀 양배추를 내던졌고, 결국 [recipient.GetSheHe]는 회당에서 도망쳐 버렸다."
 religious_interaction.2401.desc_lost: "곧장 [recipient.GetTitledFirstNamePossessive] 맹공격이 이어졌다. 내게는 반박할 틈조차 주어지지 않았다. 이내 군중들이 그자를 승리자라면서 떠받들기 시작했다.\n\n쏟아지는 썩은 야채에 맞서 근근이 버티던 중이었는데, 농노 하나가 머리 위로 살아 있는 닭을 던졌다. 자리를 피하는 수밖에 없었다."
 religious_interaction.2401.a_won: "내가 [puppet_or_actor.GetFaith.HighGodName]께서 사랑하는 자가 아니라고?"
 religious_interaction.2401.a_lost: "[puppet_or_actor.GetFaith.GetReligion.GetNameNoTooltip](이)가 뭔지도 모르는 무지렁이 주제에!"
 religious_interaction.2402.desc_won: "기가 죽을 만한 얘기와 경건한 비판을 퍼부어줬더니, [puppet_or_actor.GetTitledFirstNamePossessive] 기세가 그대로 꺾였다. 자신만만한 태도로 논쟁을 벌이자고 제안한 건 그쪽인데도 말이다. 얼마 지나지 않아 군중 역시 비난을 퍼붓기 시작했다. 곧이어 썩어버린 채소와 성난 수탉 한 마리가 날아왔고, 상대는 자리를 피할 수밖에 없었다."
 religious_interaction.2402.desc_lost: "최선을 다해서 대처했지만, [puppet_or_actor.GetTitledFirstName](은)는 자신의 논지를 매우 잘 끌어 나갔다. 머지않아 군중들이 [puppet_or_actor.GetHerHis] 손을 들어줬다. [puppet_or_actor.GetSheHe|U]는 한 시간이 넘도록 날 힐책했다. 하늘 아래서 지었던 죄를 전부 고발하면서, [recipient.GetFaith.HighGodName](을)를 향한 충성심에도 의구심이 든다는 얘기까지 에둘러 말했다.\n\n결국 나는 자리를 피하고 말았다. 군중이 썩은 채소를 내던지기 시작했던 탓이다."
 religious_interaction.2403.desc: "[victim.GetTitledFirstName](은)는 상대조차 되지 않았다. 본인은 잘 준비했다고 생각했겠지만, 그런 하잘것없는 논리 따위야 날파리를 쫓듯이 받아치면 그만이었다. 모든 논점에서 반박당한 [victim.GetFirstNameNoTooltip](이)가 급소를 얻어맞은 것처럼 움찔거렸다. 그렇게 시간이 흐르자, [victim.GetSheHe]는 자신을 변론하기에도 급급한 상태가 되었다. 그 모습에 군중들도 침묵했다.\n\n\"그런 이유라는 거다.\" 그렇게 말한 나는 극적인 순간에 손을 치켜들었다. 비난하듯이 뻗은 손가락이 맞은편을 가리켰다. \"네놈은 결코...\"\n숨을 헉 하고 들이키는 [victim.GetFirstNameNoTooltip](을)를 보고는 말을 멈췄다. [victim.GetHerHis] 손이"
 religious_interaction.2403.conclusion_either: "가슴팍을 움켜쥐고 있었다."
 religious_interaction.2403.conclusion_man: "팔을 움켜쥐고 있었다."
 religious_interaction.2403.conclusion_woman: "아랫배를 움켜쥐고 있었다."
 religious_interaction.2403.a.low_compassion: "\"겁쟁이가 따로 없군.\""
 religious_interaction.2403.a.zealous: "\"[ROOT.Char.GetFaith.PantheonTerm](이)가 승자를 알아봤나 본데.\""
 religious_interaction.2403.a.stubborn: "\"이봐, 아직 끝난 것도 아니라고!\""
 religious_interaction.2403.a: "\"이봐, 괜찮은 거야?\""
 religious_interaction.2403.a.tt: "심장마비로 고통받던 [victim.GetShortUIName](이)가 [character_death_dies|E]함"
 religious_interaction.2500.desc: "마침내 정신을 차리다니... [ROOT.Char.GetFaith.HighGodNameAlternate]께서 도우심이라! 진정한 신앙을 받아들이게 된 것을 축하하오."
 religious_interaction.2500.toast_puppeteer: "[recipient.GetShortUIName](이)가 전쟁 중에 [puppet_or_actor.GetShortUINamePossessive] 개종 제안을 받아들임"
 religious_interaction.2500.a: "[ROOT.Char.GetFaith.HighGodName](을)를 찬미하라!"
 religious_interaction.2501.desc: "지금 장난하자는 거요? 정치적 도피를 하겠답시고 속이 뻔히 보이는 수작을 부리다니, 그래 봤자 [recipient.GetFaith.HighGodName]의 진노는 피할 수 없소!"
 religious_interaction.2501.toast_puppeteer: "[recipient.GetShortUIName](이)가 전쟁 중에 [puppet_or_actor.GetShortUINamePossessive] 개종 제안을 거부함"
 #########################
 #Exaltation of Pain tenet
 #########################
 religious_interaction.2600.t: "은총의 수업"
 religious_interaction.2600.desc.recipient: "[actor.GetTitledFirstName|U](이)가 내 손을 부드럽게 잡는다. 그리고 이번 의식에서 사용할 날카롭고 뭉툭한 도구들 앞으로 이끈다. 그중 하나의 날이 빛을 받아 반짝인다. 왠지 모를 평온함이 나를 감싼다.\n\n나는 그 도구를 손에 쥐고 [actor.GetHerHim]에게 돌아서라고 손짓한다. [actor.GetSheHe]가 상의를 걷어 올리자 흉터 하나 없는 등이 드러난다. 나는 작업을 시작한다. [actor.GetHerHis] 입에서는 신음이 흐르다가 낮은 콧소리로 점차 바뀐다.\n\n나의 은총을 가다듬기 위해 어떤 도구를 써야 할지는 이미 알고 있다."
 religious_interaction.2600.desc.actor: "[recipient.GetTitledFirstName|U](은)는 초월로 이끌 도구들을 조심스럽게 살핀다. 약간의 떨림과 기대에 찬 표정이 동시에 나타난다.\n\n나는 [recipient.GetHerHis] 손목을 붙잡고 날카로운 칼날을 쥐여준다. 그리고 그 끝을 내 가슴에 조심스럽게 가져다 댄다. \"굉장히 부드럽게 해야 합니다. 손을 떨지 마시오. 우린 지금 굉장히 가느다란 외줄을 타는 거요.\"\n\n[recipient.GetFirstNameNoTooltip](은)는 내 눈을 바라보며 고개를 끄덕인다. 그리고 본인의 상의 단추를 천천히 푼다. 아직 흉터 하나 없는 순수한 피부가 드러난다. 곧 [recipient.GetFaith.HighGodName]의 은총이 깃들 피부가."
 religious_interaction.2600.a: "\"함께 초월로 나아가자.\""
 religious_interaction.2610.desc: "아쉽지만 이번에는 처리해야 할 중요한 일이 있어서... 다음에 더 뜨겁게 그분을 섬길 기회가 있을 거요!"
 religious_interaction.2610.a: "안타깝군."
 religious_interaction.2620.t: "고통의 하사"
 religious_interaction.2620.desc.actor: "내가 채찍을 들어 올리자 [recipient.GetTitledFirstName](이)가 무릎을 꿇었다. 고통은 은총이며, 나는 [recipient.GetHerHis] 고행을 통해 [actor.GetFaith.HighGodName]께 더 가까워진다."
 religious_interaction.2620.desc.recipient: "나는 채찍을 들어 올리는 [actor.GetTitledFirstName] 앞에 무릎을 꿇었다. 고통은 은총이며, 내 고행을 통해 [actor.GetSheHe]가 [actor.GetFaith.HighGodName]께 더 가까워진다."
 religious_interaction.2620.a: "고통으로 더 가까워지자."
 attempted_transcendence_together_opinion: "함께 초월을 시도함"
 monastic_donation_interaction: "수도회에 기부하기"
 monastic_donation_interaction_desc: "[gold|E]를 주면 [recipient.GetShortUINamePossessive] 수도자들이 당신의 구원과 [spiritual_fulfillment|E]을 위해 기도하게 됩니다."
 INTERACTION_CEREMONIAL_HUMBLING: "특별 중보기도를 위해 간절히 애원하기"
 INTERACTION_HUGE_DONATION: "상당한 기부를 하기"
 monastics_praying_for_grievous_sins_modifier: "수도회 중보기도"
 monastics_praying_for_grievous_sins_modifier_desc: "해당 인물은 수도회의 도움을 구걸하며 큰 수치를 느꼈으나, 이제 신성한 기도가 위안을 가져다줍니다."
