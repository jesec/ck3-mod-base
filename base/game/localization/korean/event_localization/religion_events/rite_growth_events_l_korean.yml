l_korean:
 rite_growth.0010.t: "새로운 [origin_faith.GetReligion.GetAdjectiveNoTooltip] 교파"
 rite_growth.0010.desc.intro.relation: "새롭게 창설된 교파의 중심에서 내 [GetPlayer.Custom2('RelationToMeShort', founder.Self)] [founder.GetFirstName](이)가 "
 rite_growth.0010.desc.intro.descriptor_archbishop: "새롭게 창설된 교파의 중심에서 [founder.GetCulture.GetName] 대주교 [founder.GetFirstName](이)가 "
 rite_growth.0010.desc.intro.descriptor_ruler: "새롭게 창설된 교파의 중심에서 [founder.GetTitledFirstName](이)가 "
 rite_growth.0010.desc.opener.archbishopric: "[founder_clerical_title.GetNameNoTier](을)를 관리한다.\n\n"
 rite_growth.0010.desc.opener.lands: "[founder.GetPrimaryTitle.GetBaseNameNoTier]의 땅을 다스린다.\n\n"
 rite_growth.0010.desc.divergence.minor: "추종자들에게 [new_rite.GetName](으)로 불리는 이 교파는 [source_rite.GetAdjective](와)과 아주 약간 다르며, "
 rite_growth.0010.desc.divergence.moderate: "추종자들에게 [new_rite.GetName](으)로 불리는 이 교파의 방식은 [source_rite.GetAdjective]의 추종자 대부분에게 낯설게 다가오며, "
 rite_growth.0010.desc.divergence.major: "추종자들에게 [new_rite.GetName](으)로 불리는 이 교파의 실천 방식은 [source_rite.GetAdjective]의 신자 대부분에게 이단에 가깝게 느껴지며, "
 rite_growth.0010.desc.differing.tenet: "그중에서도 가장 눈에 띄는 차이는 [differing_tenet.GetBaseName](이)다."
 rite_growth.0010.desc.differing.doctrine: "그중에서도 가장 눈에 띄는 차이는 [differing_doctrine.GetDescriptiveName](이)다."
 rite_growth.0010.desc.differing.fallback: "교리의 차이는 너무도 미묘해 쉽게 이름을 붙이기 힘들다."
 rite_growth.0010.desc.outro.wildfire: "\n\n이 새로운 가르침이 [origin_faith.GetAdjective] 사이로 빠르게 퍼져나가고 있다."
 rite_growth.0010.a: "내 영혼은 [ROOT.Char.GetRite.GetNameNoTooltip] 속에서 안전하다."
 rite_growth.0010.b: "[new_rite.GetNameNoTooltip](을)를 실천해야겠군!"
 rite_growth.0010.c: "아무래도 이단 같은데..."
 counties_and_court_converts: "[source_rite.GetName]의 [Concept( 'counties', '영지' )|E] 및 [courtiers|E]가 [new_rite.GetName](으)로 개종할 것임"
 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNoTooltip](이)가 교파를 채택함"
 rite_growth.0011.notification.desc: "[convert_ruler.GetTitledFirstName](이)가 [founder.GetTitledFirstName](와)과 합류해 [new_rite.GetName](을)를 실천함"
 iberian_struggle_blocks_holy_war_tt: "[holy_war|E] 선포가 [iberian_struggle|E]에 방해받지 않아야 함"
