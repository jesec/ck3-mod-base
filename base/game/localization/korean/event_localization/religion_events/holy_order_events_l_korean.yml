l_korean:
 holy_order_hired_message: "기사수도회 고용"
 holy_order.hired_message: "[actor.GetUIName](이)가 [holy_order.GetName](을)를 소집함"
 holy_order_hired_by_enemy_message: "적대적인 기사수도회"
 holy_order.hired_by_enemy: "[actor.GetUIName](이)가 소집한 [holy_order.GetName](와)과 적대적인 관계가 됨"
 holy_order.destroyed_message: "[title.GetName](이)가 파멸함"
 holy_order_expanded: "기사수도회 확장"
 holy_order.new_lease: "[holy_order.GetName](이)가 [former_holder.GetTitledFirstName](으)로부터 [barony.GetName](을)를 임차함"
 monastic_holy_order_expanded: "수도회 확장"
 holy_order.0001.t: "기사수도회"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U](이)가 나와의 작별을 기다리며 서 있었다. [recipient.GetHerHis] 소지품과 수행단도 길을 떠날 준비가 되어 있었다.\n\n"
 holy_order.0001.desc_demand: "\"이것도 명예라면 명예겠지요...\" [recipient.GetSheHe]가 투덜거렸다. \"이상한 이교도 땅에서 싸우다가 죽게 될지도 모르다니. [actor.GetPrimaryTitle.GetNameNoTier](을)를 위해 싸우다 죽을 줄 알았건만...\"\n\n[recipient.GetSheHe|U]가 말에 오르며 물었다. \"어디로 가게 될까요?\""
 holy_order.0001.desc: "\"그런데 말입니다, [ROOT.Char.Custom('FormOfAddressForLiege')]. 제가 경건한 마음으로 벼린 칼을 들고 섬기게 될 곳은 어디입니까?\""
 holy_order.0001.desc_relation: "\"제 검이 벌써 이교도의 더러운 은신처를 갈망하는군요, [recipient.Custom2('RelationToMeShort', ROOT.Char)]! 그런데 어디로 말을 몰아야 하며, 제 새로운 [recipient.Custom('SisterBrother')]가 될 자는 누굽니까?\""
 holy_order.0001.a: "그대는 [holy_order_1.GetName]에 합류할 것이오."
 holy_order.0001.b: "[holy_order_2.GetName](이)가 그대의 보금자리요."
 holy_order.0001.c: "[holy_order_3.GetName]에서 그대를 받아들일 거요."
 holy_order.0001.d: "[holy_order_4.GetName]의 골칫거리가 되어줬으면 하오."
 holy_order.0001.e: "내가 실수했군. 여기에 머물도록 하시오."
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 기사수도회 소집을 허용함"
 holy_order.0002.desc_angry: "나는 신성한 말을 내뱉었으며, 그대의 의지가 나를 묶었듯 나 또한 [ROOT.Char.GetFaith.HighGodName]께 묶이게 되었소."
 holy_order.0002.desc: "높으신 분을 섬기고자 부름에 답하오. 정의를 실현하는 길에 함께하게 해줘서 감사드릴 따름이오."
 holy_order.0002.a_demand: "잘됐군. 이제 가서 조용히 [ROOT.Char.GetFaith.PositiveAfterLife](을)를 기다리시오."
 holy_order.0002.a: "그대라면 [ROOT.Char.GetFaith.HighGodName](을)를 잘 섬길 수 있을 거요."
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 요청을 따라 서원함"
 char_interaction.0001.opening_low_piety: "그대처럼 [ROOT.GetCharacter.Custom('GetSinfulShameful')] 사람이라면 [ROOT.Char.GetFaith.HighGodName]의 성스러운 기사단을 오체투지를 한 채로 맞이해야 하오... 물욕이 어쩌니 걱정하기 전에, 자기 영혼의 구원에 대해 생각해 보시오."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "금화가 절실한 상황이라고 들었소. [order.GetName](이)가 그 부름에 답하겠소."
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName]께서 웃어주시는구나!"
 holy_order.0200.b: "하... 하지만 돈이 필요한데!"
 holy_order.0202.second_time: "성전 기사단에 #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! 금화를 빚졌단 사실을 잊지 않기를 바라오."
 holy_order.0202.opening: "성전 기사단에 #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! 금화를 빚졌잖소."
 holy_order.0202.desc: "금화를 갚지 않는다면, 다른 방법으로 변제하게 만들 거요. [ROOT.Char.GetFaith.HighGodName]께서 용인하시겠지만, 그대는 용인하지 못할 그런 방법으로 말이오."
 holy_order.0202.a: "약조했던 대로 이행하겠소."
 holy_order.0202.a_no: "빚이라면 갚겠소! 일단은 자금부터 마련하고..."
 holy_order.0202.a._not.tt: "@warning_icon! #X [gold_i][gold|E]가 부족함#!"
 holy_order.0202.b_christian: "인내라는 미덕도 모르는 건가?"
 holy_order.0202.b: "같은 신을 섬기는 교우니... 기한을 좀 늘려줬으면 좋겠는데!"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip](이)가 기한을 5년 늘려줌"
 holy_order.0202.c: "다른 방법으로 빚을 변제할 수는 없을까?"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip](이)가 청하고 싶은 게 있다고 함#!"
 holy_order.0202.d: "금화라면 내가 가지고 있는 편이 유용할 것 같은데!"
 holy_order.0203.desc: "약속을 깨는 사람을 달갑게 맞이할 수는 없소. 설령 그게 [ROOT.Char.GetFaith.HighGodNameAlternate](이)라 할지라도 말이오. 이 상황을 조금이라도 만회하고 싶다면, [ROOT.Char.GetFaith.HighGodNamePossessive] 일을 확실히 행할 수 있게 [province.GetName](을)를 임차해 주시오."
 holy_order.0203.a: "[province.GetNameNoTierNoTooltip](을)를 내어드리리다."
 holy_order.0203.b: "터무니없는 요구로군!"
 holy_order.0204.desc: "약속을 저버리는 사람을 달갑게 맞이할 수는 없소. 설령 그게 [ROOT.Char.GetFaith.HighGodNameAlternate](이)라 할지라도 말이오. 이 상황을 조금이라도 만회하고 싶다면, 그대의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]인 [child.GetTitledFirstName](을)를 보내서 [ROOT.Char.GetFaith.HighGodNamePossessive] 일을 행하게 하시오."
 holy_order.0204.a: "고... 곧장 그 아이를 보내도록 하리다."
 holy_order.0204.a.tt: "성전 기사단에 빚졌던 금화가 전부 변제됨"
 holy_order.0205.desc: "빚을 져놓고 이 난리라니! 탐욕을 부린 탓에 망신을 당한 거요! [ROOT.Char.GetFaith.ReligiousHeadName] 측에 이 사실을 알리도록 하겠소!"
 holy_order.0205.a: "빌어먹을!"
 holy_order_letter.opening: "[ROOT.Char.GetFaith.HighGodNameAlternate](을)를 섬기는 동료에게,"
 holy_order.1001.intro: "열성 넘치는 영혼들이 [holy_order.GetName](으)로 몰려들어 [ROOT.Char.GetFaith.GetAdjective] 신앙을 위해 필멸의 육신을 바칠 준비가 되어 있습니다. 우리의 [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]들을 수용할 땅이 더 필요합니다."
 holy_order.1001.end: "\n\n여기에는 [target_barony.GetName](이)가 걸맞아 보이더군요. 신성한 대의를 위해 우리가 임차해도 되겠습니까?"
 holy_order.1001.a: "청을 받아들이겠소. [ROOT.Char.GetFaith.HighGodName](을)를 위하여!"
 holy_order.1001.b: "그렇다면 [alternative_barony.GetNameNoTierNoTooltip](으)로도 충분하지 않겠소?"
 holy_order.1001.c: "거절하리다. 이 땅은 내어줄 수 없소."
 holy_order.1011.intro: "[target_barony.GetName]에는 가꾸어 나갈 수 있는 좋은 땅이 있고, 제 [grandmaster.Custom('SistersBrothers')]들의 수도원 생활에 알맞을 듯한 괜찮은 [grandmaster.GetFaith.HouseOfWorship]도 있습니다."
 holy_order.1011.end: "\n\n[holy_order.GetName](이)가 이곳에 수도원을 세울 수 있도록 중개인 역할을 해 주시겠습니까?"
 holy_order.1011.a: "수도회는 [target_barony.GetNameNoTierNoTooltip](을)를 임차해도 좋다."
 holy_order.1011.b: "[alternative_barony.GetNameNoTierNoTooltip]도 평온한 곳이지 않은가?"
 holy_order.1011.c: "아쉽지만 그대의 [grandmaster.Custom('SistersBrothers')]들은 다른 곳을 알아봐야겠군."
 holy_order.2001.t: "신성한 목적"
 holy_order.2001.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]인 [child.GetFirstName](이)가 찾아왔다. 이내 그 아이에게 진지하게 논의하고 싶은 바가 있다는 사실을 깨달았다.\n\n\"[ROOT.Char.Custom('MotherFather')|U], 계속 여기에 머물렀다간 다른 사람의 그림자에 휘둘리는 신세로 평생을 보내야 할 것 같습니다. [holy_order.GetName]에 합류하여 [child.GetFaith.HighGodName](을)를 섬길 수 있게 허락해 주십시오. 오랫동안 숙고한 끝에 내린 결정입니다. 그리하고 싶습니다.\""
 holy_order.2001.a: "[child.GetFaith.HighGodNameAlternate]께서 널 인도해 주시기를 바라마."
 holy_order.2001.b: "원대한 계획은 아니지만, 널 위해 따로 생각해둔 바가 있다."
 holy_order.2002.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))]인 [sibling.GetTitledFirstName](이)가 앞으로 어떡할 생각인지를 알려줬다. 오랜 시간을 숙고하면서 결정한 사안인 게 분명했다.\n\n\"여기선 내가 할 수 있는 일이 없어. 어차피 누군가를 섬길 운명이라면, [sibling.GetFaith.HighGodName](을)를 섬기고 싶어. [holy_order.GetName]에 합류하는 것도 그 때문이야.\""
 holy_order.2002.a: "왜 그런 선택을 했는지 이해해."
 holy_order.2002.b: "그렇게 #EMP 놔두진 않겠어#!!"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "[grandmaster.GetFaith.GetAdjective] 신앙에 위협이 되는 존재를 막아설 진정한 전사가 필요하던 참이었소.\n소질이 충만하면서도 물려받을 게 적은 사람을 찾는 중이었지. 그대의 [child.Custom('DaughterSon')]인 [child.GetTitledFirstName]에게는 [holy_order_scope.GetName](을)를 섬기는 삶이 훨씬 잘 어울린다고 생각하오. 우리 곁에서 수련하며 배움을 구한다면, 언젠가 그 아이도 가문의 이름을 빛낼 수 있을 거요."
 holy_order.2003.a: "참된 [child.GetFaith.GetAdherentName](으)로서 살아갈 수 있기를."
 holy_order.2003.child_joins_order: "[child.GetFirstName](이)가 [GetTrait('order_member').GetName( child.Self )](이)가 되어 [grandmaster.GetTitledFirstNameNoTooltip]의 궁정에 합류함"
 holy_order.2003.b: "차라리 [alternative_child.GetFirstNameNoTooltip](을)를 훈련시키는 건 어떻소?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName](이)가 [GetTrait('order_member').GetName( alternative_child.Self )](이)가 되어 [grandmaster.GetTitledFirstNameNoTooltip]의 궁정에 합류함"
 holy_order.2003.c: "그 아이는 나와 함께 여기 머무를 거요."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "[child.GetFaith.HighGodNameAlternate](을)를 위해서 평생을 바쳤건만. 그분께서는 제가 가족을 저버리길 바라지 않으시는 모양입니다.\n\n[grandmaster.GetTitledFirstName](이)가 옛 삶을 되찾으라면서 떠날 기회를 줬습니다. 다시 한 번 [ROOT.Char.Custom('GetCourt')]의 일원이 되라고 말입니다."
 holy_order.2004.a: "집에 돌아온 걸 환영한다!"
 holy_order.2004.b: "물러가라. 여기엔 네가 있을 자리가 없으니."
 holy_order.2005.t: "귀향"
 holy_order.2005.desc: "[child.GetTitledFirstNamePossessive] 방문이 평소보다 길어지고 있다. 문제는 [child.Custom('DaughterSon')](이)란 녀석이 내 [ROOT.Char.Custom('GetCourt')]에 틀어박혀서는 음식이나 축내면서 하인들을 괴롭히고 있기에, [holy_order.GetName]에는 언제 돌아갈 생각인지에 대해서 물어봤다. 그런데 그렇게 열렬한 목소리로 답할 줄이야, 유감스러운 상황이었다.\n\n\"전에 말씀드렸지 않나요, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName](이)가 아량을 베풀어서 [child.GetFaith.GetName](을)를 위해 짊어져야 덜어줬다고 그랬잖아요! 마침내 집에 돌아온 겁니다! 가문을 섬길 수 있게 되었다고요!\""
 holy_order.2005.a: "그러니까... 여기에 계속 머무른단 얘기지?"
 holy_order.destroyed_title: "기사수도회 해산"
 holy_order.2010.t: "새로운 수도회"
 holy_order.2010.desc: "옛 수도회의 은수자, 신비주의자, 만족하지 못한 제자들이 [barony.GetNameNoTier]에 모여들어 황야에 새로운 집을 짓고자 수년 동안 노력했다. [leader.GetFirstName] [leader.Custom('SisterBrother')|U]라는 [leader.GetWomanMan]이 자연스럽게 이 신흥 수도회 '[leader.GetPrimaryTitle.GetName]'의 우두머리가 되었다... 하지만 이 사안에 대해 아직 #EMP 내#! 위엄 있는 의견을 내지 않았다. 또한 이 수도회에서 생활 방식의 중심으로 소중히 여길 신성한 계율도 아직 제안하지 않은 상황이다.\n\n이 순수한 신자들의 합창이 [barony.GetNameNoTierNoTooltip]에서 무엇을 노래로 불러야 할까? 저들은 무엇을 위해 노력하며 충만한 삶을 살고, 생각하고, 글을 써야 할까? 또한 누가 이들을 이끌어야 할 것인가?"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )], 그리고 [monk_tenet_1.GetFirstNameNoTooltip] [monk_tenet_1.Custom('SisterBrother')|U]다."
 holy_order.2010.5: "[tenet_5.GetName( order_rite )], 그리고 [monk_tenet_2.GetFirstNameNoTooltip] [monk_tenet_2.Custom('SisterBrother')|U]다."
 holy_order.2010.6: "[tenet_6.GetName( order_rite )], 그리고 [monk_tenet_3.GetFirstNameNoTooltip] [monk_tenet_3.Custom('SisterBrother')|U]다."
 holy_order.2010.d: "[tenet_1.GetName( order_rite )], 그리고 [monk_tenet_1.GetFirstNameNoTooltip] [monk_tenet_1.Custom('SisterBrother')|U]다."
 holy_order.2010.e: "[tenet_2.GetName( order_rite )], 그리고 [monk_tenet_2.GetFirstNameNoTooltip] [monk_tenet_2.Custom('SisterBrother')|U]다."
 holy_order.2010.f: "[tenet_3.GetName( order_rite )], 그리고 [monk_tenet_3.GetFirstNameNoTooltip] [monk_tenet_3.Custom('SisterBrother')|U]다."
 monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )](이)가 [monastic_order.GetName]에서 지지하는 [core_tenet|E]가 될 것임"
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName](이)가 [tenet_pick.GetName( order_rite )](을)를 지지함"
 founded_monastic_order_modifier: "수도회 창설"
 founded_monastic_order_modifier_desc: "이 현명한 영주는 새로운 수도회의 구상과 창설을 도왔으며, 신에게 직접 호소하는 새로운 길을 열었습니다."
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName](이)가 [monastic_order.GetName]의 [ruler|E]가 됨"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName](이)가 [monastic_order.GetName]의 [ruler|E]로 남음"
 holy_order.2009.t: "수도원 건설"
 holy_order.2009.desc: "[province.GetCulture.GetCollectiveNoun]의 사랑을 받는 조용한 [province.GetTerrain.GetNameNoTooltip|l] 한가운데, 언젠가 세워질 [province.GetName] 수도원의 초석을 놓을 것이다.\n\n일꾼들이 소박한 봉헌자들과 함께 힘을 합쳐 땅에 벽을 세우고, 근면한 신체로 신앙심 가득한 찬가를 부를 것이다. [potential_leader.GetName] [potential_leader.Custom('SisterBrother')|U]처럼 최초의 명예로운 수도자들도 이곳을 찾아와 거닐며, 예배당과 식당을 위한 계획을 제시했다.\n\n몇 년 안에 여기서 새로운 수도회가 탄생하리라. 그리고 이 수도회는 돌과 [ROOT.Char.Custom('GetWritingMaterial')](은)는 물론, 더 많은 수도자를 필요로 하게 될 것이다."
 holy_order.2009.a: "이 새로운 수도회는 내가 지지하는 이가 이끌어야만 한다."
 holy_order.2009.b: "많은 수도자가 지금의 수도회에서 고통받고 있지..."
 holy_order.2009.b.tt: "...그러니 이 새로운 수도회를 장악할 수 있다면 윗사람을 버릴 것이다. 새로운 규율을 써 내려갈 수 있는 자유를 위해서."
 holy_order.2009.c: "거친 고행자와 열광적인 젊은이를 모집한다."
 monastic_order_creation_increased_spiritual_fulfillment: "[monastic_holy_order|E]와 [interactions|E]을 하면 #high 50년#! 동안 더 많은 [spiritual_fulfillment|E]을 받게 됨"
 monastic_founder_become_saint_tt: "[chosen_leader.GetShortUIName](이)가 #high 65+#! [GetTrait('devoted').GetName( chosen_leader.Self )] [trait_level_track_xp|E]를 보유하거나 [piety_level|E]가 @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L] 이상이라면 사망 후 [GetTrait('saint').GetName( chosen_leader.Self )]로 추대될 것임"
 holy_order.2020.t: "수도 서원"
 holy_order.2020.desc: "내 주장을 마주한 [recipient.GetFirstNamePossessive] 새로운 의복을 걸친 등이 나의 [ROOT.Char.Custom('ResidenceBuilding')]에서 돌아섰다. 속세의 [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l](와)과 귀족을 등진 것이다. [recipient.GetSheHe|U]는 [archabbot.GetPrimaryTitle.GetName]에 추대되었다.\n\n수도회의 다른 [recipient.Custom('SistersBrothers')]들과 마찬가지로 [recipient.GetFirstNameNoTooltip] 또한 신성한 공동체에 의무를 다하며 충실할 것을 맹세했다. [recipient.GetSheHe|U]는 자신의 육신을 [recipient.GetFaith.HighGodName]에게 바치며, 자신의 마음을 바쳐 [recipient.GetFaith.PositiveAfterLife](을)를 우러러본다.\n\n[recipient.GetFirstNameNoTooltip](은)는 [archabbot.GetCapitalLocation.GetName] 또는 수도회의 다른 성역에 거주하며 탐구와 사색의 삶을 살기 시작할 것이다."
 holy_order.2020.aa: "수도회가 근면한 인재를 얻었군."
 holy_order.2020.aa.tt: "[recipient.GetFirstNamePossessiveNoTooltip] 관리 능력이라면 저들의 쉼 없는 노동과도 잘 맞을 것이다."
 holy_order.2020.a: "수도회가 현명한 제자를 얻었군."
 holy_order.2020.a.tt: "이 속세에서 학식 있는 [recipient.GetFirstNameNoTooltip]에게 어울릴 만한 곳은 여기뿐이다."
 holy_order.2020.b: "그 후원자의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))](은)는 부엌데기 따위가 아니다..."
 holy_order.2020.c: "기부를 하면 [recipient.GetFirstNameNoTooltip](이)가 확실히 보살핌받겠지."
 holy_order.2020.d: "[recipient.GetHerHis|U] 삶은 이제 수도회의 것이다."
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 요청으로 수도회에 합류했음"
 take_vows_improve_education_learning_tt: "@skill_learning_icon![learning|E] [education|E] 결과가 개선될 것임"
 take_vows_improve_education_stewardship_tt: "@skill_stewardship_icon![stewardship|E] [education|E] 결과가 개선될 것임"
 recently_joined_holy_order_desc: "[recipient.GetShortUIName](은)는 최근 5년 이내에 수도회에 합류했음"
 child_in_holy_order_desc: "[recipient.GetShortUIName](은)는 수도회에 서원하기로 한 아이임"
 custom.every_domain_monastic_order: "당신의 [domain|E] 내 모든 [monastic_holy_order|E]"
 order_gains_minor_tenet_popularity_tt: "상대의 [core_tenet|E]가 #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! [tenet_popularity|E] 획득"
 new_order_gains_minor_tenet_popularity_tt: "당신의 새로운 [monastic_holy_order|E]가 수도회 [core_tenet|E]에 추가로 #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#!의 [tenet_popularity|E]를 제공하게 됨"
 holy_order.2030.t: "헌금: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "내 재물이 [recipient.GetTitledFirstNamePossessive] 수도원 금고로 보내졌다. 경건한 토지 경작, 신성한 경전의 필사, [recipient.GetPrimaryTitle.GetName]의 세속적인 목적을 위해 사용될 헌금이다...\n\n...그리고 내 영혼의 불멸을 위해 천 번의 기도가 행해지겠지. 수도자들은 기도를 위해 살아가며, 듣기로는 저들의 유일하며 정의로운 헌신 덕분에 [ROOT.Char.GetFaith.random_GoodGodNames|U]께서 저들의 기도에 특히 귀를 더 잘 기울이신다고 한다.\n\n#EMP [actor.GetFaith.HighGodName|U](이)여, 저들이 제 이름을 부르는 소리가 들리시나이까?#!"
 holy_order.2030.desc_desperate_plea: "#EMP 제가 얼마나 그대의 자비를 바라고 있는지 아십니까? 저는 가련한 거지나 다름없습니다!#!"
 holy_order.2030.desc_huge_donation: "#EMP 제가 얼마나 많은 돈을 바쳤는지 아십니까...?#!"
 holy_order.2030.a: "내 구원을 옹호해 줄 자들이 늘었군."
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 수도원 헌금을 받음"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U]님,"
 holy_order.2031.desc: "그대의 요청을 고려하며 기도해 보았는데, 그 어떤 헌금으로도 우리 수도자들이 그대를 위해 [recipient.GetFaith.HighGodName]께 기도를 드리게 만들 수는 없었습니다. 그대의 구원은 우리조차도 건드릴 수 없는 문제인 듯합니다."
 holy_order.2031.a: "망할! 그나마 돈은 가지고 있으니 다행이군."
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 수도원 헌금을 거부함"
 already_has_monastic_lease_tt: "[target.GetNameNoTier](은)는 이미 [monastic_holy_order|E]에 [leased|E] 상태임"
 lease_title_to_existing_monastic_order_interaction: "수도원 하사"
 lease_title_to_existing_monastic_order_interaction_desc: "[recipient.GetPrimaryTitle.GetName]에게 [temple_holding|E]를 [lease|E]해 주어 [spiritual_fulfillment|E], [piety|E]를 획득하고 수도회에 대한 접근성을 높임"
 INTERACTION_LEASE_DONATION: "부속 재산 구매"
 no_valid_temple_holdings_to_lease_tt: "당신의 [domain|E] 내 [lease|E] 가능한 [temple_holdings|E]가 없음"
 monastic_onslaught_modifier_tt: "[target_county.GetName](이)가 #high 20년#! 동안 [GetModifier('monastic_onslaught_modifier').GetNameWithTooltip](을)를 획득함"
 holy_order.2040.opening: "후원자이신 [actor.GetPrimaryTitle.GetNameNoTier]의 [actor.GetFirstName],"
 holy_order.2040.desc: "됐습니다. [recipient.GetPrimaryTitle.GetNameNoTier]의 지부가 [target.GetNameNoTier]의 [actor.GetFaith.HouseOfWorship]에 인접하게 되었습니다. [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier]의 심장부인 이곳에서 우리는 [recipient.GetCapitalLocation.GetName] 도서관의 고대 문헌을 보관하겠습니다.\n\n"
 holy_order.2040.desc_nuns: "여기서 우리의 [recipient.GetFaith.DevoteeFemalePlural]들이 그대를 위한 기도를 [actor.GetFaith.HighGodName]께 바치겠습니다."
 holy_order.2040.desc_monks: "여기서 우리의 [recipient.GetFaith.DevoteeMalePlural]들이 그대를 위한 기도를 [actor.GetFaith.HighGodName]께 바치겠습니다."
 holy_order.2040.desc_huge_donation: "그대의 신성한 자선에 수도회가 감사드립니다."
 holy_order.2040.desc_rite: "\n\n본 지부에서도 우리 수도회의 모든 지부와 마찬가지로 [recipient.GetRite.GetName](을)를 지킬 것임을 알려드립니다."
 holy_order.2040.a: "그대의 수도회가 번영하기를!"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 남작령 임차 제안을 수락함"
 holy_order.2041.opening: "[actor.GetPrimaryTitle.GetNameNoTier]의 [actor.GetFirstName],"
 holy_order.2041.desc: "우리는 가장 순수한 [recipient.GetFaith.HighGodNamePossessive] 신자로서 [recipient.GetFaith.PositiveAfterLife]의 신성함을 이 하잘것없는 지상으로 전달합니다... 하지만 [actor.GetPrimaryTitle.GetNameNoTier]의 봉역에 우리의 기도로도 몰아낼 수 없는 역병이 닥친 듯합니다.\n\n그대 봉역의 영혼은 비참하게도 [recipient.GetFaith.HighGodName](와)과 단절되어 있으므로, [recipient.GetPrimaryTitle.GetName](은)는 [target.GetNameNoTier](으)로 갈 수 없습니다."
 holy_order.2041.a: "순수하기는 개뿔, 어리석은 놈들!"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUINamePossessive] 남작령 임차 제안을 거부함"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial [monastic_order.GetName](이)가 [holy_order_vicinity|E]에 진입해 [interactions|E]을 이용할 수 있게 됨#!"
 holy_order.2050.t: "[barony.GetNameNoTierNoTooltip]에서 일어난 운동"
 holy_order.2050.desc: "\"[target_order.GetName](은)는 사막의 은둔자가 그러했듯... 아직 고통받고 있는가?\" [clerical_helper.GetNamePossessive] 열렬한 서신은 모두 이런 식으로 시작되었다.\n\n\"[target_lessee.GetTitledFirstName](이)가 몸에 황금을 두르고 있는가?\" [barony.GetNameNoTier]에서 개혁가들의 설교를 들어보면 이런 식으로 끝난다. #EMP \"새로운 길! 새로운 규율!\"#!\n\n수도원은 경건한 개혁과 반대 의견이 공존하는 온상이 되어가고 있다. 거주자들은 더 이상 [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip](이)라 하기도 힘들며, 진부한 [target_order_tenet.GetName( founder.GetRite )] 대화로는 거의 만족하지도 않는다. 그러나 이들의 개혁 정신은 여전히 하나의 새로운 원칙과 하나의 정신으로 향해야만 한다."
