l_korean:
 yearly_republic.1001.t: "침대로 오세요"
 yearly_republic.1001.desc: "자정이 가까워지자, 내 [spouse_target.GetWifeHusband] [spouse_target.GetTitledFirstName](이)가 서류에 파묻힌 채 장부를 다시 살펴보고 있던 나를 찾아왔다.\n\n\"이만 침대로 오세요.\" [spouse_target.GetSheHe]가 간청했다. \"일은 내일 해도 되지 않아요?\"\n\n[spouse_target.GetFirstNameNoTooltip](이)가 사려 깊은 얼굴로 말했다. \"아니면, 일을 좀 도와 드릴까요?\""
 yearly_republic.1001.a: "촛불을 더 가져오는 게 좋겠군, 내 사랑."
 yearly_republic.1001.b: "업무가 한참 밀렸단 말이오. 날 내버려두시오!"
 yearly_republic.1001.c: "그대만 내 곁에 있다면야, 세상은 얼마든지 기다리라지."
 yearly_republic.1001.communal: "모든 [vassals|E]이 #value 당신#!을 향한 의견을 #P 10#!만큼 획득함"
 yearly_republic.1002.t: "가시 돋친 결혼"
 yearly_republic.1002.desc: "나와 [spouse_target.GetTitledFirstName]의 결혼은 불화로 가득했다. 우리는 그 어떤 것에도 의견이 맞지 않았다. 분명 [spouse_target.GetSheHe]는 자기 친족에게 잦은 서신을 보내며 내 '결점'을 세세히 알리고 있으리라.\n\n결혼을 통해 내 사업적 이해를 [spouse_target.GetDynastyHouseName] 집안과 더 가까이 연결할 수 있을 줄 알았는데, 도시에서 저들의 사원이나 고객을 볼 때면 그 눈에는 불신이 가득했다.\n\n무언가 해야 한다. 그러지 않으면 이 독 같은 감정이 우리 두 가문의 사람들 사이로 계속 퍼져 나갈 것이다. 감염된 상처에서 흐르는 상한 피처럼 말이다."
 yearly_republic.1002.a: "[spouse_target.GetFirstNameNoTooltip](와)과 그 가문의 환심을 사겠다."
 yearly_republic.1002.b: "[spouse_target.GetHerHis] 편지가 내 찬사를 담도록 위조하겠다."
 yearly_republic.1002.c: "[ROOT.Char.GetFaith.random_GoodGodNames]께 맹세하지. 그대 보기에 더 나은 사람이 되겠다고."
 yearly_republic.1002.d: "저들 마음대로 생각하라지."
 yearly_republic.1002.tt.falsifying_success.desc: "당신이 더 좋게 보이도록 배우자의 편지를 고침"
 yearly_republic.1002.falsifying_success.toast: "[spouse_target.GetDynastyHouseName]에서 당신이 나아졌다고 믿음"
 yearly_republic.1002.tt.falsifying_failure.desc: "배우자의 편지를 위조하려던 시도가 실패함"
 yearly_republic.1002.falsifying_failure.toast: "[spouse_target.GetDynastyHouseName]의 당신을 향한 의견이 더 나빠짐"
 yearly_republic.1002.tt.impress_spouse_success.desc: "배우자가 당신의 노력에 감명받음"
 yearly_republic.1002.impress_spouse_success.toast: "[spouse_target.GetDynastyHouseName]에서 당신의 노력을 인정함"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "배우자가 당신의 노력에 감명받지 않음"
 yearly_republic.1002.impress_spouse_failure.toast: "[spouse_target.GetDynastyHouseName]에서 당신을 가망 없다고 봄"
 yearly_republic.1003.t: "뒷골목 명예"
 yearly_republic.1003.desc: "\"어리석은 것! 길거리에서 싸움을 벌이면 집안 사이의 불화로 번질 수도 있다! 네 꼴을 좀 봐라! 피가 나지 않느냐!\" 내 [spouse_target.GetWifeHusband] [spouse_target.GetTitledFirstName](이)가 내 [ROOT.Char.Custom2('RelationToMeShort', rook_01)] [rook_01.GetTitledFirstName]의 모습을 보고 이렇게 외쳤다. 하지만 이 젊은 한량은 그저 웃을 뿐이었고, [rook_01.GetHerHis] 핏방울이 바닥으로 떨어져 내렸다.\n\n\"제 상대는 이보다 더 심합니다! 그 [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))] [rook_02.GetFirstName](은)는 수치 속에 절뚝거리며 집으로 돌아갔으니까요.\"\n\n이런 애송이 폭력배들을 봤나! 무기를 들고 허세나 부리며 거리를 배회하고, 싸움에 휘말리는 것은 물론 온갖 종류의 사악한 행위를 벌이며 즐긴다.\n\n\"그냥 잠깐 싸웠던 겁니다. 너무 마음 졸이지 마세요, [rook_01.Custom2('RelationToMeShort', spouse_target)]. 우리 가문이 비방을 당했으니, 가문의 이름을 지키려고 나섰을 뿐입니다.\""
 yearly_republic.1003.a: "아, 젊음은 어리석도다."
 yearly_republic.1003.b: "[rook_02.GetNameNoTooltip](이)가 잘못한 게 틀림없군. 배상을 요구하겠다!"
 yearly_republic.1003.c: "상황을 매끄럽게 해결할 수 있게 [rook_02.GetDynastyHouseNameNoTooltip] 쪽에 선물을 보내자."
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "내 가문을 향한 그대의 비난은 사실무근이고, 무의미하며, 타당한 근거도 없소.\n\n우리한테서 아무것도 기대하지 마시오. 단, 유감스럽게도 그쪽이 이 문제를 더 끌고 나가기로 한다면, 우리 가문의 검이 정중하게 그대의 목으로 찾아갈 줄 아시오."
 yearly_republic.1004.b.desc: "[other_house_character_01.GetDynastyHouseName] 가문의 수장으로서, 우리 가문 사이에 벌어진 이번 불화를 매우 유감스럽게 생각하오. 불편을 안겨 드려 죄송하게 생각하며, 사과의 뜻으로 이 선물을 드리니 받아 주시길 바라오."
 yearly_republic.1004.a: "이런 무례를 범한 걸 후회하게 될 거다!"
 yearly_republic.1004.b: "좋다, 때가 되면 우리의 보상을 받게 되리라."
 yearly_republic.1004.c: "마땅히 받아야 할 것을 받아들인다."
 yearly_republic.1004.d: "이것으로 우리 사이의 불화를 끝냅시다."
 yearly_republic.1005.t: "대중의 거부권"
 yearly_republic.1005.desc: "내 가문과 [other_house_character_01.GetDynastyHouseName] 가문 사이의 불화가 다시 한번 [capital_01.GetName]의 길거리로 퍼져 나갔다. 우리의 운송업자들은 통행권을 두고 다퉜고, 그 바람에 길이 막혀버렸다. 또 사소한 불만이 치솟겠군, 내가 그렇게 생각한 순간이었다. 군중이 내 저택의 문 앞으로 모여들었다.\n\n\"이제 그만합시다!\" 한 남자가 외쳤다. \"[ROOT.Char.GetDynastyHouseName]하고 [other_house_character_01.GetDynastyHouseNameNoTooltip](이)가 다투면 우리 일을 할 수가 없습니다. 두 가문의 불행에 도시를 끌어들이는 일은 그만두시오!\"\n\n내 [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] [house_member_01.GetTitledFirstName](이)가 저들의 주제넘은 태도에 코웃음을 쳤다. \"자기들이 누군데 우리한테 명령하려 들지?\""
 yearly_republic.1005.a: "아니다, [ROOT.Char.Custom2('RelationToMeShort', house_member_01)]. 이제는 [other_house_character_01.GetDynastyHouseNameNoTooltip](와)과 마주 앉을 때다."
 yearly_republic.1005.b: "내 웅변 실력이면 상황을 [other_house_character_01.GetDynastyHouseNameNoTooltip] 가문의 탓으로 돌릴 수 있겠지."
 yearly_republic.1005.c: "경비병! 이 폭도들을 문 앞에서 몰아내라."
 yearly_republic.1005.tt.oratory_blame.desc: "당신의 웅변술로 군중을 현혹함"
 yearly_republic.1005.tt.oratory_blame.toast: "당신이 [other_house_character_01.GetDynastyHouseName] 가문에 문제를 떠넘김"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "조롱하는 군중 속에 소리가 묻힘"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "[other_house_character_01.GetDynastyHouseName] 가문에 문제를 떠넘기지 못함"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "그대 말이 맞소. 이제 마주 앉아 냉철해진 머리로 생각할 때요. 아직 태어나지 않은 후손들과 공화국의 지속적인 이익을 위해서라도 말이오. 그대와 만나겠소."
 yearly_republic.1006.b.desc: "안타깝지만 그대가 우리 얼굴에 대고 거짓말을 할 기회를 줄 이유는 없소. 분명 우리한테 해악을 끼칠 수 있는 더 편리한 각도를 모색하고 있는 게 틀림없군. 협상의 여지는 없을 거요."
 yearly_republic.1006.a: "훌륭하군!"
 yearly_republic.1006.b: "젠장!"
 yearly_republic.1007.t: "[ROOT.Char.GetDynastyHouseNameNoTooltip](와)과 [other_house_character_01.GetDynastyHouseNameNoTooltip] 사이의 긴장 완화"
 yearly_republic.1007.desc: "공기가 긴장으로 팽팽했다. 나는 중립 시설 안에서 [other_house_character_01.GetTitledFirstName](와)과 마주보고 앉았다. 우리의 고객들은 두 편으로 나뉘어 방을 가득 채웠다. 전장에서 서로를 살펴보는 두 군대처럼. 분명 그 망토 속에는 단검을 숨기고 있겠지.\n\n\"어디.\" [other_house_character_01.GetFirstNameNoTooltip](이)가 차분한 목소리로 말했다. \"하실 말이 있으면 해 보시오.\"\n\n방에 있던 모두가 나를 바라보았다. 나는 정신을 가다듬으며 입을 열었다."
 yearly_republic.1007.a: "이 불화는 사업에도 좋지 않소."
 yearly_republic.1007.b: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip](으)로서 화해합시다."
 yearly_republic.1007.c: "피라면 이미 쏟았지. 이제 피로써 연을 맺읍시다."
 yearly_republic.1007.d: "강철로 승부를 내지. 지금 당장, 바로 여기서!"
 yearly_republic.1007.tt.detente_business.desc: "[other_house_character_01.GetShortUINameNoTooltip]에게 당신의 주장을 이해시킴"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip](이)가 설득됨"
 yearly_republic.1007.tt.detente_business_failure.desc: "[other_house_character_01.GetShortUINameNoTooltip]에게 당신의 주장을 이해시키지 못함"
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip](이)가 완전히 설득되지 않음"
 yearly_republic.1007.detente_business.change.desc: "두 가문이 사업적 이유로 화해하기로 동의함"
 yearly_republic.1007.piety.change.desc: "두 가문이 [ROOT.Char.GetFaith.HighGodName](을)를 향한 사랑 때문에 화해하기로 동의함."
 yearly_republic.1007.detente_marriage.change.desc: "두 가문이 결혼을 통해 화해하기로 동의함."
 yearly_republic.1007.duel_win.desc: "결투에서 승리함"
 yearly_republic.1007.duel_win.toast: "당신이 [other_house_character_01.GetShortUINameNoTooltip](을)를 찌름"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip](이)가 결투에서 승리함"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip](이)가 당신을 찌름"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip](이)가 상처를 입거나 살해당함"
 yearly_republic.1007.duel_loss.custom: "당신이 상처를 입거나 살해당함"
 yearly_republic.1007.c.tt.suitable_pair: "두 가문에 서로 결혼할 수 있으며 결혼한 상태가 아닌 구성원이 있음"
 house_relation_reason_falsify_good_desc: "가문 지도자의 좋은 성품에 관해 얘기하는 편지를 받음"
 house_relation_reason_falsify_bad_desc: "가문 지도자가 편지를 위조했다는 사실을 알아냄"
 house_relation_reason_thorny_desc: "불행한 결혼으로 불화가 퍼짐"
 house_relation_reason_bribery_good_desc: "배우자에게 금과 장신구를 퍼부음"
 house_relation_reason_street_combat_desc: "두 가문의 젊은이들이 길거리에서 싸움을 벌임"
 house_relation_reason_business_argument_desc: "사업의 장점을 논의함"
 house_relation_reason_house_blamed_desc: "사회 혼란의 원인으로 지목됨"
 house_relation_reason_houses_aligned_desc: "뜻이 맞는 가문들이 모인 자리에서 함께 대응하기로 함"
 house_relation_reason_cooperation_desc: "가문 사이의 협력이 깊어졌습니다."
 demand_reparation_for_fight_desc: "배상을 요구하는 편지를 보냄"
 pay_reparation_for_fight_desc: "사과하는 편지를 선물과 함께 보냄"
 offer_a_sitdown_desc: "긴장 완화를 제안하는 편지를 보냄"
 yearly_republic.1008.t: "상인의 옷을 입은 늑대"
 yearly_republic.1008.desc: "제법 흥미로운 정보가 내 귀에 들어왔다.\n[other_patrician_01.GetTitledFirstNamePossessive] 휘하에 있는 상인 선장 중 하나가 지중해 부근에서 무역 청부의뢰를 수행하다가 무차별적인 도적질을 벌였으며, 나중에는 그렇게 얻은 화물을 팔아 개인적인 이득을 챙겼다는 것이다. 이것이 양의 탈을 쓴 늑대가 아니면 무어란 말인가!\n\n[other_patrician_01.GetFirstNameNoTooltip]도 이 모략에 동참했는지는 알 수 없다. 하지만 그 여부는 선박과 화물을 약탈당한 평의회 구성원에게는 별로 중요하지 않을 것이다."
 yearly_republic.1008.a: "그 선장을 당장 고용해 나를 위해 일하게 한다."
 yearly_republic.1008.b: "선장이 전리품을 나누겠다고 할 때까지 위협한다."
 yearly_republic.1008.c: "[other_patrician_01.GetFirstNameNoTooltip](을)를 위협해 우위를 얻어낸다."
 yearly_republic.1009.t: "비밀의 살롱"
 yearly_republic.1009.desc: "나는 [patrician_spouse_01.GetTitledFirstName]의 아늑한 살롱에 앉아서 오후를 보냈다.\n\n내 [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName](와)과 대화하며 [patrician_spouse_01.Custom('GetExpensiveDrink')](을)를 마시던 중이었는데, 큰 가림막 가까이에 있는 벽에서 작은 그림자가 움직이는 게 보였다. 좀 더 지켜보니, 누군가의 팔이 작지만 정밀하게 움직이면서 만들어 내는 그림자였다. [relation_01.GetFirstNameNoTooltip](이)가 멈추자 그 움직임도 멈췄다. 저 가림막 뒤에서 누군가가 살롱 내의 모든 이야기를 받아적고 있었다!\n\n아무래도 우리 [patrician_spouse_01.Custom('HostessHost')]인 [patrician_spouse_01.GetFirstNameNoTooltip](와)과 [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband] [patrician_husband_01.GetTitledFirstName](이)가 손님들의 대화를 엿듣고 있는 모양이었다."
 yearly_republic.1009.a: "모두에게 이 사악한 모략을 경고해야겠다!"
 yearly_republic.1009.a.tt: "#value 당신#!을 향한 의견을 #P 20#! 획득하며 [patrician_spouse_01.GetShortUINameNoTooltip], [patrician_husband_01.GetShortUINameNoTooltip](을)를 향한 의견이 #N -25#! 감소함"
 yearly_republic.1009.b: "근사한 생각이군! 나도 해봐야겠다."
 yearly_republic.1009.c: "[patrician_spouse_01.GetFirstNameNoTooltip](와)과 [patrician_husband_01.GetWifeHusband]에게 비밀을 지키라고 협박한다."
 yearly_republic.1009.c.success.desc: "[patrician_spouse_01.GetShortUINameNoTooltip]보다 한 수 앞섬"
 yearly_republic.1009.c.success.toast: "[patrician_husband_01.GetShortUINameNoTooltip]에 대한 강한 구실을 획득함"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip](이)가 당신보다 앞섬"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip](이)가 당신의 경쟁자에 더 가까워짐"
 yearly_republic.1009.flavor: "무슨 얘기를 들을지 누가 알겠나?"
 yearly_republic.1009.b.secret_learned: "당신의 염탐이 비밀을 밝혀냄"
 yearly_republic.1010.t: "서까래 위의 파트리치오"
 yearly_republic.1010.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.GetTitledFirstName](이)가 한가롭게 걷던 나를 발견하더니, 가까이 와 속삭였다.\n\n\"[ambassador_01.GetFirstName] 대사가 [ambassador_mission_location_01.GetName]에서 돌아왔는데, 오늘 밤 궁에서 열리는 비밀 자문회에서 보고한다고 합니다.\"\n\n[relation_01.GetSheHe|U]가 고개를 저었다. \"아, 그 보고가 전체 평의회에 나오기 전에 내용을 들을 수만 있다면, 사업에서 엄청난 우위를 차지할 수 있을 텐데요!\"\n\n[relation_01.GetFirstNameNoTooltip](이)가 그 말을 하는 순간, 저 멀리에 서 있는 궁전의 지붕이 눈에 들어왔다."
 yearly_republic.1010.a: "궁전 지붕의 타일을 뜯어내고 엿들어야겠다."
 yearly_republic.1010.b: "혹시 [ambassador_01.GetFirstNameNoTooltip](이)가 설득이 되려나?"
 yearly_republic.1010.c: "때가 되면 내용을 알게 되겠지."
 yearly_republic.1010.a.success.desc: "보고를 엿들음"
 yearly_republic.1010.a.success.toast: "보고를 엿들음"
 yearly_republic.1010.a.mixed.desc: "지붕에서 떨어짐"
 yearly_republic.1010.a.mixed.toast: "지붕에서 떨어짐"
 yearly_republic.1010.a.failure.desc: "회의장으로 떨어짐"
 yearly_republic.1010.a.failure.toast: "회의장으로 떨어짐"
 yearly_republic.1010.a.mixed.custom: "당신과 [relation_01.GetShortUIName](이)가 [GetTrait('wounded_1').GetName( GetNullCharacter )|LV] [trait|E]을 획득함"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUIName|U](이)가 당신과 [relation_01.GetShortUIName](을)를 향한 [opinion|E]을 #N 25#! 상실함 #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW 범죄 — [republic_ruler.GetShortUIName](이)가 둘 모두를 정당하게 투옥할 수 있음#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip](이)가 뇌물을 받아들임"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip](이)가 당신의 제안에 불쾌해함"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip](이)가 당신에게 보고를 넘김"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip](이)가 뇌물을 거부함"
 yearly_republic.1011.t: "자문회로의 소환"
 yearly_republic.1011.desc: "나는 소환을 받았으며, 공화국을 굴러가게 하는 수많은 비밀 자문회 중 하나에 다시 참석하게 되었다.\n\n이런 책무로 인해 가족과 사업에 할애할 시간이 부족하지만, 파트리치오인 나는 타당한 이유나 평의회의 허가가 없으면 소환을 거부해서는 안 된다."
 yearly_republic.1011.a: "의사에게 내가 아파서 누워 있다고 증언하게 해야겠다."
 yearly_republic.1011.b: "내 [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)](이)가 아프니, 집에 머물러 있을 이유가 되겠지."
 yearly_republic.1011.c: "평의회에 5년간의 예외 허가를 요청해야겠다."
 yearly_republic.1011.d: "참석하는 게 내 의무다."
 yearly_republic.1011.c.success.desc: "평의회가 허가를 내림"
 yearly_republic.1011.c.success.toast: "평의회가 당신에게 허가를 내렸음"
 yearly_republic.1011.c.failure.desc: "평의회가 허가를 거부함"
 yearly_republic.1011.c.failure.toast: "평의회가 당신에게 허가를 내리는 것을 거부했음"
 yearly_republic.1012.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip] 행렬"
 yearly_republic.1012.desc: "군중의 기대감이 치솟았다. [ROOT.Char.GetTitleAsNamePossessive] 행렬이 궁의 문을 나서며 도시를 가로지르는 행진을 시작했다.\n\n처음에는 중요도와 위신을 기준으로 늘어선 관료들이 나섰고, 다음으로는 나였다. 가장 훌륭한 의복을 입은 [ROOT.Char.GetTitleAsNameNoTooltip] 말이다. 높이 들어 올려진 내 권위의 상징 앞에 사람들이 감탄했다. \n내 뒤에는 각 가문의 명예에 따라 늘어선 파트리치오들이 행진했다.\n\n이 위엄 있는 의식에서 각자 자리를 지키며, 우리 공화국의 위계와 영광을 모두의 앞에 보여주었다!"
 yearly_republic.1012.a: "공화국을 위해! 백성을 위해!"
 yearly_republic.1012.b: "평의회에 영광 있으라!"
 yearly_republic.1012.c: "이 모든 게 내 영광의 반영이다!"
 yearly_republic.1012.c.tt: "다음 #V 10#!년 동안 $republican_despot_succession_law$ [succession_law|E] 통과에 소모되는 [prestige|E]이 #P 50%#! 감소함"
 yearly_republic.1013.t: "바다와의 결혼"
 yearly_republic.1013.desc: "[Glossary( '#bold 부친토로#!', 'BUCENTAUR_GLOSS' )]가 평행사도의 마지막 부분을 지나가자, 소금기 가득한 드넓은 아드리아해가 눈앞에 펼쳐졌다. [bishop_01.GetTitledFirstName](이)가 의식용 반지를 건네주며 뒤로 물러났다.\n나는 모여든 고위 인사들이 볼 수 있게 반지를 높이 들어 올렸고, 고대의 의식을 따라 초록빛 파도 속으로 반지를 던졌다.\n\n\"[Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )]\" 내가 선언하자 배에 탄 군중이 찬성하듯 우렁차게 외쳤다. 우리의 부와 힘의 원천, 바다와 우리 공화국의 혼인이 이루어졌다."
 yearly_republic.1013.a: "우리가 파도를 지배한다!"
 yearly_republic.1013.b: "어리석고 공허한 의식이군."
 yearly_republic.1013.c: "내가 간다, 내 사랑아!"
 yearly_republic.1013.d: "바다에 진실하리라!"
 yearly_republic.1014.t: "가문의 뜻 일치시키기"
 yearly_republic.1014.desc: "[faction_head_01.GetHouse.GetHouseAspiration.GetName] 야심을 지닌 가장들이 [faction_head_01.GetTitledFirstName]의 초대를 받아 한 자리에 모였다.\n\n\"친구들이여! 이런 시기야말로 우리가 힘을 합치고 이해관계를 일치시켜야 합니다. 그렇지 않으면 사랑하는 우리 공화국의 다른 세력이 우릴 분리하고 짓밟을 기회를 잡을 겁니다.\"\n\n우리는 밤새 긴 토론을 벌였다. 우리 사이의 분열은 많지만, 그 간격을 메우고 하나 된 전선을 만들 수 있는 강력한 목소리가 나올 기회는 있다."
 yearly_republic.1014.a: "\"모두 구엘프에 합류합시다.\""
 yearly_republic.1014.b: "\"모두 기벨린에 합류합시다.\""
 yearly_republic.1014.c: "\"우리 가문 사이의 유대를 강화합시다.\""
 yearly_republic.1014.d: "\"우리 사이의 모든 경쟁을 끝냅시다.\""
 yearly_republic.1014.e: "\"우리의 사업적 이해를 일치시킵시다.\""
 yearly_republic.1014.e.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E]을 보유한 모든 [patricians|E]가 2년 동안 [GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip]를 획득함"
 yearly_republic.1014.a.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E]을 보유한 모든 [patricians|E]가 [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName] [situation_participant_group|E]의 구성원이 됨"
 yearly_republic.1014.b.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E]을 보유한 모든 [patricians|E]가 [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName] [situation_participant_group|E]의 구성원이 됨"
 yearly_republic.1014.c.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E]을 보유한 모든 [patricians|E]의 서로에 대한 [house_relations|E]가 개선됨"
 yearly_republic.1014.d.tt: "[faction_head_01.GetHouse.GetHouseAspiration.GetName] [house_ambition|E]을 보유한 [patricians|E] 사이의 경쟁심 및 적대감이 사라짐"
 yearly_republic.1014.tt.align_guelphs_success.desc: "소집에서 사람들을 설득했으며, 가문들이 구엘프에 충성을 맹세함"
 yearly_republic.1014.align_guelphs_success.toast: "가문들이 구엘프로 돌아섬"
 yearly_republic.1014.tt.align_guelphs_failure.desc: "토론이 틀어지며, 가문들이 각자의 관점을 고수함"
 yearly_republic.1014.align_guelphs_failure.toast: "가문들의 분열이 유지됨"
 yearly_republic.1014.tt.align_ghibellines_success.desc: "소집에서 사람들을 설득했으며, 가문들이 기벨린에 충성을 맹세함"
 yearly_republic.1014.align_ghibellines_success.toast: "가문들이 기벨린으로 돌아섬"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "토론이 틀어지며, 가문들이 각자의 관점을 고수함"
 yearly_republic.1014.align_ghibellines_failure.toast: "가문들의 분열이 유지됨"
 yearly_republic.1014.d.toast: "오랜 원한이 해소됨"
 yearly_republic.1014.e.toast: "가문들이 이해관계를 일치시킴"
 yearly_republic.1015.t: "표를 위한 금화"
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName|U](이)가 시장을 걷고 있던 나를 발견했다. [patrician.GetSheHe|U]는 만면에 미소를 지은 채 다가오더니 신중하게 목소리를 낮췄다.\n\n\"아, 평의회의 따분한 투표에서 벗어나 휴식을 취하니 참 좋군요. 어디에 투표해야 할지 모를 때도 종종 있다니까요. 그대처럼 현명한 이는 안개 낀 바다의 황금 등대와도 같아서, 저 같은 가련한 사람이 험난한 정치 문제에서도 길을 찾을 수 있도록 인도해 주지요.\" [patrician.GetSheHe|U]가 일부러 크게 한숨을 쉬었다.\n\n\"근데, 마침 동전이 부족해서 말입니다. 다음번에 평의회에서 투표하게 되면, 이 가난한 뱃사공은 어디로 뱃머리를 돌려야 할까요?\""
 yearly_republic.1015.a: "얼마면 될지 말이나 하시오."
 yearly_republic.1015.c: "내 제안은 그 자체의 가치만으로도 충분하오."
 yearly_republic.1016.t: "두들겨 패서 표 얻기"
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U](은)는 버릇없는 무지렁이지만, 평의회의 투표권을 가지고 있기는 매한가지다. \"설득한다면\" 내 마음대로 쓸 수 있는 표다.\n\n[patrician.GetHerHim]에게 압박을 좀 가하기만 하면 된다. [patrician.GetSheHe]가 나 같은 사람에게 실망을 안긴다면 어떤 결과가 따라올지 이해할 수 있도록 말이다."
 yearly_republic.1016.a: "[patrician.GetHerHis] 사업적인 이해관계를 방해한다."
 yearly_republic.1016.b: "폭력배들을 매복시켰다가 [patrician.GetHerHis] 궁정 신하를 두들겨 팬다."
 yearly_republic.1016.c: "[patrician.GetHerHis] 집에 불을 지른다."
 yearly_republic.1016.d: "[patrician.GetHerHim]에게 공포가 뭔지 가르쳐주겠다!"
 yearly_republic.1016.e: "[patrician.GetHerHim]가 양심에 따라 투표하게 두자."
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip](이)가 당신의 뜻대로 투표할 것을 맹세함"
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip](을)를 본보기로 삼겠다."
 yearly_republic.1017.t: "철학자 왕"
 yearly_republic.1017.desc: "저녁 식사가 늦은 시간까지 이어졌다. 술이 흐르며 혀도 풀려 갔다.\n[debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName](와)과 나는 지상의 모든 주제를 가지고 토론했다.\n\n놀랍게도 나는 공화국에서 가장 학식 있는 파트리치오들과 대화를 나누고 있는 모양이었다. 참으로 걸출한 인물들이라 할 만했다. 다음번에 평의회가 소집될 때, 건전한 논쟁과 뛰어난 사유를 통해 내 뜻을 따라 투표하게 설득할 수 있을 만한 사람들 말이다."
 yearly_republic.1017.a: "훌륭한 웅변술이라면 저들을 설득할 수 있겠지."
 yearly_republic.1017.b: "내 건실한 추론이라면 저들이 매혹될 것이다."
 yearly_republic.1017.c: "듣고 배우는 게 더 나을지도 모르겠군."
 yearly_republic.1017.a.success.desc: "식탁에서 가장 뛰어난 연설가인 [debater_orator.GetFirstNameNoTooltip](을)를 말로 압도함"
 yearly_republic.1017.a.success.toast: "식탁의 사람들을 설득함"
 yearly_republic.1017.a.failure.desc: "식탁에서 가장 뛰어난 연설가인 [debater_orator.GetFirstNameNoTooltip]에게 휘말려 횡설수설함"
 yearly_republic.1017.a.failure.toast: "당신의 수사학이 호응을 끌어내지 못함"
 yearly_republic.1017.b.success.desc: "식탁에서 가장 학식 있는 사람인 [debater_scholar.GetFirstNameNoTooltip]의 논리를 압도함"
 yearly_republic.1017.b.success.toast: "식탁의 사람들이 설득됨"
 yearly_republic.1017.b.failure.desc: "식탁에서 가장 학식 있는 사람인 [debater_scholar.GetFirstNameNoTooltip](이)가 당신의 논리에서 꼬투리를 잡음"
 yearly_republic.1017.b.failure.toast: "당신의 주장이 꼬투리를 잡힘"
 yearly_republic.1017.c.toast: "경청하며 보낸 밤"
 yearly_republic.1017.c.tt: "밤의 토론이 낮은 확률로 당신에게 오래도록 기억될 흔적을 남김"
 yearly_republic.1017.c.insight.toast: "토론이 흔적을 남김"
 yearly_republic.1018.t: "오다 주웠네"
 yearly_republic.1018.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName](이)가 예고도 없이 내 문 앞에 나타났다. 인사를 나누며 진심이 느껴지는 포옹을 한 [benefactor_01.GetFirstNameNoTooltip](은)는 나를 밖으로 안내했는데, 물품과 장신구로 가득 찬 수레가 기다리고 있었다.\n\n\"말도 없이 불쑥 찾아와서 미안하네. 하지만 여길 지나가던 중이었는데, 그대라면 이걸 좋아할 것 같다는 생각이 들더군. 최근의 여행에서 확보한 [new_curio.GetType](이)라네.\"\n\n[benefactor_01.GetSheHe|U]가 수레에서 천을 들어 올리자 [new_curio.GetName](이)가 드러났다."
 yearly_republic.1018.a: "\"감사합니다, [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]!\""
 yearly_republic.1018.b: "좋은 가격에 팔 수 있을지도?"
 yearly_republic.1018_domicile_curio_sold_tt: "당신이 나중에 [new_curio.GetName](을)를 판매함."
 yearly_republic.1019.t: "섬세한 안목"
 yearly_republic.1019.desc: "어느 날 나는 [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetShortUIName](와)과 함께 [event_location_01.GetName]의 거리를 걷고 있었다. 이곳에는 항상 살펴보고 의논할 거리가 넘쳐난다.\n\n\"저 상품을 쌓아놓는 모습 좀 보게. [target_city.GetNameNoTooltip] 사람들은 훨씬 더 잘하던데 말이지. [ROOT.Char.GetFirstNameNoTooltip], 약간의 주의만 기울인다면 우리 주변의 사람한테서도 배울 게 참 많다네.\""
 yearly_republic.1019.a: "\"여행하시는 동안 [experience_trade_category_01.GetNameNoTooltip]에 관해서도 배우셨습니까?\""
 yearly_republic.1019.b: "\"시장의 [experience_trade_category_02.GetNameNoTooltip] 사업에 관해 얘기해 볼까요.\""
 yearly_republic.1019.c: "매일 관찰하는 습관을 들여야겠군."
 yearly_republic.1020.t: "목욕탕 거래"
 yearly_republic.1020.desc: "\"...사업은 믿을 수 있는 동반자 사이에서 번창하는 법이니까.\"\n\n[house_benefactor_01.GetFirstName](이)가 머리 위로 물 한 양동이를 붓더니, 다시 진지한 얼굴을 하며 나를 돌아보았다. \"[ROOT.Char.GetFirstName], 우린 그대의 가문을 존중한다네.\"\n\n목욕탕의 증기가 시야를 흐렸고, 뜨끈한 물에 내 근육도 녹는 듯했다.\n\n\"그대와 그대의 식구들은 우리 [house_benefactor_01.GetDynastyHouseNameNoTooltip] 가문에게 좋은 친구가 되어 주었지. 그러니 우리의 협력 관계를 더 깊이 다지는 것이 당연하다고 생각되네. 이는 두 가문 모두에게 도움이 될 걸세.\""
 yearly_republic.1020.a: "\"해외에서 공모자와 접선책을 공유하며 영향력을 넓혀야 합니다.\""
 yearly_republic.1020.b: "\"전문 지식을 공유하며 함께 강해집시다.\""
 ## GLOSS
 BUCENTAUR_GLOSS: "부친토로는 베네치아의 도금된 공식 바지선이었습니다. 아르세날레의 노잡이들이 노를 저었으며, 의례 시에만 사용되었습니다."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! — 라틴어로 \"바다여, 진실하고 영원한 지배의 상징으로 그대와 혼인하노라\"라는 뜻입니다."
