l_korean:
 influence_house_ambition_ongoing.1001.tt: "공감하는 사람"
 influence_house_ambition_ongoing.1001.desc: "[target.GetFirstNamePossessive] 회사에서 공감해 줄 사람만 찾을 수 있다면, [target.GetHerHis] 의견을 돌려 내 관점에 동조하도록 할 수 있다.\n\n대화하기도 즐겁고, 언변이 뛰어난 사람을 고르는 게 좋겠다. 외모가 괜찮은 사람이라면 더 좋을 테고.\n\n[target.GetFirstNamePossessive] 궁정 신하들에 관해서 신중하게 묻고 다닌 끝에 후보를 둘로 좁혔다. [target_associate_01.GetFirstName], 그리고 [target_associate_02.GetFirstName](이)다."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip](이)가 좋은 선택이지."
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip](이)라면 자기 상사한테 이야기할 수 있겠지."
 influence_house_ambition_ongoing.1001.c: "아니. 내 말이면 충분하다."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip](이)가 당신을 대신해 타당한 주장을 펼침"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip](이)가 타당한 주장을 펼치지 못함"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip](이)가 당신을 대신해 타당한 주장을 펼침"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip](이)가 타당한 주장을 펼치지 못함"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "당신을 돕는 대가로 돈을 원함."
 influence_house_ambition_ongoing.1001.cooltip.relation: "대가를 아무것도 바라지 않음."
 influence_house_ambition_ongoing.1001.cooltip.lewd: "\"다른\" 보상을 제안함."
 influence_house_ambition_ongoing.1001.cooltip.ambition: "대가로 보상을 바람."
 influence_house_ambition_ongoing.1002.tt: "혹독한 협상"
 influence_house_ambition_ongoing.1002.desc: "[target.GetFirstName](이)가 과연 날 진지하게 여기는 게 맞는지 의심이 간다. 내가 듣는 거라곤 공허한 약속과 지연에 끝도 없이 장광설로 이어지는 토론뿐이다.\n\n이제 내 불만을 알릴 때가 왔다. 대놓고 말하기보다는, [target.GetFirstName]한테 나쯤 되는 [ROOT.Char.GetTitleAsNameNoTooltip]의 심기를 거스른다면 그에 따른 결과가 닥칠 거라는 사실을 이해시켜 줘야겠지!"
 influence_house_ambition_ongoing.1002.a: "[target.GetHerHis] 사업적인 이해관계를 방해한다."
 influence_house_ambition_ongoing.1002.b: "폭력배들을 매복시켰다가 [target.GetHerHis] 궁정 신하를 두들겨 팬다."
 influence_house_ambition_ongoing.1002.c: "[target.GetHerHis] 집에 불을 지른다."
 influence_house_ambition_ongoing.1002.d: "[target.GetHerHim]에게 공포가 뭔지 가르쳐주겠다!"
 influence_house_ambition_ongoing.1002.e: "조금만 더 두고 보겠다."
