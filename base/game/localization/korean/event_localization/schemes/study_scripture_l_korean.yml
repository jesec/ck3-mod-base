l_korean:
 study_scripture_outcome.10.t: "$study_scripture_title$공부의 원칙"
 study_scripture_outcome.10.desc: "책들이 독서대 위에 펼쳐져 있다. 그 안에는 [ROOT.Char.GetFaith.GetAdjective] 교리의 조항들이 차분한 필체로 정성스럽게 옮겨 적혀 있다. 어둠 속에서 촛불 하나가 가물거린다. 아래의 [ROOT.Char.GetFaith.HouseOfWorship]에서는 신자들이 늘 그렇듯 기다리고 있다.\n\n"
 study_scripture_outcome.10.desc_quote: "맨 위의 페이지에는 나보다 먼저 이 책을 읽은 누군가가 #EMP \"[ROOT.Char.Custom('RandomStudyVerseFragment')]\"#! 구절에 밑줄을 그어 두었다.\n\n나는 이 성스러운 글에 얼마나 전념할 것인가?"
 study_scripture_outcome.10.desc_generic: "나는 성스러운 배움에 얼마나 전념할 것인가?"
 study_scripture_outcome.10.a: "세상은 수도원 문 밖에서 기다리게 하자."
 study_scripture_outcome.10.b: "[ROOT.Char.Custom('StudyOfficesWord')]에 정해진 시간이 있듯, 공부에도 정해진 시간을 두겠다."
 study_scripture_outcome.10.c: "영이 이끄는 대로 읽겠다."
 no_change_study_scripture_tt: "당신의 [GetScheme('study_scripture').GetTypeName] [scheme|E]이 변경 없이 진행됨"
 study_scripture_outcome.110.t: "$study_scripture_title$성스러운 글"
 study_scripture_outcome.110.desc: "[ROOT.Char.GetFaith.GetName]의 주요 문헌들을 한 줄 한 줄 읽어나간다. 짧게 남은 촛불 아래로 녹은 밀랍이 고이고, 여백 그림 속 토끼와 달팽이는 서로 다투고 있다.\n\n"
 study_scripture_outcome.110.desc_quote: "한 구절이 내게 말을 건다.\n#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!\n\n[ROOT.Char.GetFaith.HighGodNamePossessive] 신자들을 목자로서 이끌어야 한다면, 이 말씀을 마음에 새겨야 한다."
 study_scripture_outcome.110.desc_generic: "[ROOT.Char.GetFaith.HighGodNamePossessive] 신자들을 목자로서 이끌어야 한다면, 이 말씀을 마음에 새겨야 한다."
 study_scripture_outcome.110.a: "어떤 대가를 치르더라도 배워야 한다."
 study_scripture_outcome.110.b: "이해는 때가 되면 찾아올 것이다."
 study_scripture_outcome.120.t: "$study_scripture_title$방대한 주석"
 study_scripture_outcome.120.desc: "내가 맡은 양 떼를 이끌기 전에, 먼저 나 자신을 다스리는 법을 배워야 한다. [commentary_writer.GetTitledFirstName]의 주석이 내 앞에 펼쳐져 있다. [ROOT.Char.GetFaith.ReligiousText] 연구에 평생을 바쳐 남긴 결과물로, 가시덤불처럼 빽빽하고 그보다도 훨씬 까다롭다. 한 줄을 헤쳐 나갈 때마다 세 줄이 더 모습을 드러낸다.\n\n오직 규율로만 이를 이겨낼 수 있으리라."
 study_scripture_outcome.120.a: "더 깊은 의미를 찾기 위해 본문을 샅샅이 살필 것이다."
 study_scripture_outcome.120.b: "일정한 시간, 꾸준한 진전."
 study_scripture_outcome.120.c: "매일 밤 한 장이면 충분하다."
 scholar_xp_high_tt: "당신의 학문을 크게 심화함"
 scholar_xp_low_tt: "당신의 학문을 다소 심화함"
 study_scripture_outcome.130.t: "$study_scripture_title$여백 속의 인내"
 study_scripture_outcome.130.desc: "왜 도무지 뜻이 잡히지 않는가? 그 구절을 네 번째로 읽지만, 그 뜻은 주먹처럼 굳게 닫혀 버린다. 이마를 책상에 살며시 댄다.\n\n\"촛불을 가져왔습니다.\" 문간에서 내 [ROOT.Char.Custom2('RelationToMeShort', tutor)], [tutor.GetFirstName](이)가 말한다. \"아, 옛 주석서들이군요. 이 페이지들은 잘 알고 있습니다. 잠시 함께 읽을까요?\"\n\n고개를 든다. 어쩌면 도움의 손길이야말로 바로 내게 필요한 것인지도 모른다."
 study_scripture_outcome.130.a: "가르쳐 달라. 배움을 마다할 자존심을 세우지는 않겠다."
 study_scripture_outcome.130.b: "잠시 내 곁에 앉아 있어라. 본문은 잠시 미뤄 두어도 된다."
 study_scripture_outcome.140.t: "$study_scripture_title$[ROOT.Char.Custom('StudyParishWord')|U] 앞에서 설교하기"
 study_scripture_outcome.140.desc: "한숨을 쉬며 책을 덮는다. 교리는 모두 이 안에 있다. 그러나 [preacher.GetTitledFirstName](이)가 지난번 내 앞에서 설교했을 때, 그 안에는 삼단논법 따위는 전혀 없었다. 오직 [ROOT.Char.GetFaith.HighGodNamePossessive] 꾸밈없는 진리만이 있었다. [ROOT.Char.Custom('StudyParishWord')]도 눈물을 흘렸다. #EMP 나#! 또한 눈물을 흘렸다."
 study_scripture_outcome.140.a: "교리가 따로 있고, 전달 방식이 따로 있다. 둘 다 배우겠다."
 study_scripture_outcome.140.b: "내 소명은 책이지, [ROOT.Char.Custom('StudyPulpitWord')](이)가 아니다."
 study_scripture_outcome.150.t: "$study_scripture_title$세속 재산"
 study_scripture_outcome.150.desc: "\"함께 걸으시지요.\" 아침에 나의 [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )] [steward_scope.GetFirstName](이)가 한쪽 팔에 장부를 끼고 밖으로 나오라는 듯 손짓하며 말한다.\n\n\"성전의 밭, 방앗간, 십일조 창고를 보십시오. 어느 것이 가득 찼는지, 어느 것이 새는지, 어느 것이 이중으로 약속되어 있는지 살펴야 합니다. 양 떼는 은총만으로 먹일 수 없습니다.\""
 study_scripture_outcome.150.a: "장부 다루는 법을 가르쳐 달라."
 study_scripture_outcome.150.b: "산책을 하면 머리는 조금 맑아지겠지."
 study_scripture_outcome.160.t: "$study_scripture_title$학식 있는 교우"
 study_scripture_outcome.160.desc: "공부를 이어 가다 보니 [colleague.GetTitledFirstName](와)과 서신을 주고받게 되었다. [colleague.GetHerHis] 신심은 거처의 담장 너머까지 널리 알려져 있다.\n\n"
 study_scripture_outcome.160.desc_distant: "우리는 신앙 문제를 두고 편지를 주고받는다. 질문과 논박, 교정이 쉴 새 없이 오간다. [colleague.GetHerHis|U] 필체는 형편없지만, 그 추론만은 타당하다."
 study_scripture_outcome.160.a: "제대로 논박해 보자."
 study_scripture_outcome.160.b: "학식 있는 [ROOT.Char.GetWomanMan]이라면 자신의 관할이 어떻게 운영되는지 알아야 한다."
 study_scripture_outcome.160.c: "함께 다시 문헌으로 돌아가자."
 piety_gain_high_tt: "상당한 신앙도 획득"
 piety_gain_low_tt: "약간의 신앙도 획득"
 study_scripture_outcome.170.t: "$study_scripture_title$인장이 찍힌 편지"
 study_scripture_outcome.170.desc: "나의 [ROOT.Char.Custom2('RelationToMeShort', letterman)] [letterman.GetFirstName](이)가 무언가를 성물처럼 들고 들어온다. 바로 [senior.GetTitledFirstName]의 인장이 찍힌 편지다.\n\n\"그대의 공부에 관한 소식은 그대가 생각하는 것보다 훨씬 멀리 퍼졌소. 책을 읽는 목자가 있으니 신앙도 더욱 풍요롭소. 계속 정진하시오. 내 총애를 확신해도 좋소.\"\n\n"
 study_scripture_outcome.170.desc_quote: "편지는 다른 내용과 따로 구분해 적은 한 구절로 끝난다.\n#EMP \"[ROOT.Char.Custom('RandomBibleQuoteShort')]\"#!"
 study_scripture_outcome.170.desc_generic: "편지는 [ROOT.Char.GetFaith.HighGodNamePossessive] 이름으로 내리는 축복으로 끝나며, 그 문구는 다른 내용보다 큰 글씨로 적혀 있다."
 study_scripture_outcome.170.a: "이에 걸맞은 답신을 작성하겠다."
 study_scripture_outcome.170.b: "어쩌면 [senior.GetSheHe]는 내 학문적 성취를 조금 더... 공개적으로 칭찬해 줄 수도 있지 않을까?"
 study_scripture_outcome.170.c: "다시 읽자. 이번에는 천천히."
 study_scripture_outcome.171.t: "$study_scripture_title$신자들에게 보내는 서신"
 study_scripture_outcome.171.desc: "[ROOT.Char.GetFaith.GetName] 곳곳에서 편지가 온다. 전례의 한 단어를 두고 다투는 성직자들, 자신이 품은 의심에 겁먹은 마을 [ROOT.Char.GetFaith.PriestNeuterPlural]들, 살아 있는 누구도 그 옳고 그름을 확인할 수 없는 번역을 두고 판정을 내려 달라 매달리는 학자. 논쟁에 종지부를 찍는 것은 내 인장이다.\n\n"
 study_scripture_outcome.171.desc_quote: "오늘 밤의 편지에는 기대라도 하듯 성구 하나가 인용되어 있다.\n#EMP \"[ROOT.Char.Custom('RandomBibleQuoteShort')]\"#!\n\n책상 위의 편지 더미가 높아져 간다. 그리고 내 배움도 조용히 깊어져 간다."
 study_scripture_outcome.171.desc_generic: "책상 위의 편지 더미가 높아져 간다. 그리고 내 배움도 조용히 깊어져 간다."
 study_scripture_outcome.171.a: "모든 편지에 답하자. 그것이 목자의 역할이다."
 study_scripture_outcome.171.b: "필경사들에게 내 답신을 신앙 공동체 곳곳에 널리 전하게 하자."
 study_scripture_outcome.171.c: "오늘 밤만큼은 내가 학생이다. 편지는 나중에 답해도 된다."
 study_scripture_outcome.172.t: "$study_scripture_title$사목교서"
 study_scripture_outcome.172.desc: "오늘 밤에는 목자들이 먼 회중에게 보낸 서신을 공부한다. [ROOT.Char.Custom('StudyParishWord')]에서 [ROOT.Char.Custom('StudyParishWord')]에 이르기까지 설교와 가르침은 크게 다르다.\n\n[pastoral_lord.GetTitledFirstName]의 영지에 있는 [pastoral_county.GetNameNoTier]의 신자들이 떠오른다. 그들은 그곳에서 교회를 유지하고 있다. 내 손길이 미치지 않는 먼 곳에 있으며, 내 지도도 받지 못한다... 어쩌면 이제는 내가 직접 그들에게 편지를 쓸 때인지도 모른다.\n\n깃펜을 든다. #EMP [pastoral_county.GetNameNoTier]의 신자들에게...#!"
 study_scripture_outcome.172.a: "보내자."
 study_scripture_outcome.172.b: "편지를 쓰는 것 자체가 교훈이었다. 그것으로 충분하다."
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName](이)가 [pastoral_county.GetNameNoTier] 사람들에게 편지를 보냈음"
 study_scripture_outcome.180.t: "$study_scripture_title$짐을 내려놓음"
 study_scripture_outcome.180.desc: "턱을 굳게 다물고 어깨에 잔뜩 힘을 준 채 책을 읽기 시작한다. 이번에도 그저 또 하나의 의무를 견뎌 내야 하리라 생각한다.\n\n"
 study_scripture_outcome.180.desc_confession: "첫 페이지와 마지막 페이지 사이의 어느 순간, 내 영혼이 와르르 무너진다. 그동안 내가 짊어져 온 모든 것을 오직 [ROOT.Char.GetFaith.HighGodName]께만 소리 내어 털어놓는다. 그 무게가 사라진다.\n\n몇 달 만에 처음으로, 앞으로 나아갈 길이 선명하게 보인다."
 study_scripture_outcome.180.desc_generic: "첫 페이지와 마지막 페이지 사이의 어느 순간, 어깨를 짓누르던 무게가 스르르 사라진다. 마치 베일이 걷힌 듯하다.\n\n몇 달 만에 처음으로, 앞으로 나아갈 길이 선명하게 보인다."
 study_scripture_outcome.180.a: "자, 다음에는 무엇을 읽을까..."
 study_scripture_outcome.190.t: "$study_scripture_title$학자 후원"
 study_scripture_outcome.190.desc: "학문에도 정치가 있다. 적절한 회의체에 보내는 필사본 한 권, 적절한 자리에 앉히는 유망한 독경자, 적절한 곳에서 호의적으로 오르내리는 내 이름...\n\n나는 부지런히 노력한다. 하지만 아무도 알아주지 않는 노력은 헛된 노력이다."
 study_scripture_outcome.190.a: "시노드에 내 이름이 알려지게 하라."
 study_scripture_outcome.190.b: "신학자들에게 필기 내용을 공유해 달라고 하자."
 study_scripture_outcome.190.c: "신비가들은 내 연구를 알아야 한다."
 study_scripture_outcome.190.d: "내 신심은 그 자체로 온전하다."
 study_scripture_outcome.200.t: "$study_scripture_title$환시"
 study_scripture_outcome.200.desc: "글자가 끝나고 다른 무언가가 시작되는 페이지가 있다. [GetTrait('lifestyle_mystic').GetName( mystic )](으)로 알려진 [mystic.GetTitledFirstName](은)는 한낮보다 밝은 어둠과 말이 다한 뒤에도 이어지는 기도에 관해 쓴다. 그리고 [ROOT.Char.GetFaith.GetName](은)는 감히 두드리는 자에게는 그런 문도 있다고 가르친다.\n\n촛불이 꺼질 때까지 읽는다. 그러고는 어둠 속에 오래도록 앉아 귀를 기울인다."
 study_scripture_outcome.200.a: "그 어둠 속에는 무언가가 기다리고 있었다. 그것을 찾아 나서겠다."
 study_scripture_outcome.200.b: "나를 시험해 보라, 신비여. 나는 두렵지 않다."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip]에게 존경의 서신을 보내야 마땅하다."
 study_scripture_outcome.200.d: "그 문은 기억해 두고, 더 평이한 공부를 계속하겠다."
 study_scripture_outcome.300.t: "$study_scripture_title$철야의 밤"
 study_scripture_outcome.300.desc: "[ROOT.Char.GetFaith.HouseOfWorship](은)는 차갑고 완전히 고요하다. 마지막 기도 시간과 첫 기도 시간 사이에는 아무에게도 속하지 않는 한 시간이 있고, 나는 그 시간을 내 것으로 만들었다. 촛불 하나, 어둠, 그리고 불꽃 주위로 바싹 다가드는 신비.\n\n침묵 너머에서 무언가가 기다린다. 그것은 인내할 줄 안다. 오늘 밤은 나도 그렇다."
 study_scripture_outcome.300.a: "더 깊이. 더 깊이 들어가겠다."
 study_scripture_outcome.300.b: "한 시간의 고요, 그다음은 잠."
 study_scripture_outcome.300.c: "철야를 지켜냈다. 그것으로 충분하다."
 study_scripture_outcome.100.t: "$study_scripture_title$계승 문제"
 study_scripture_outcome.100.desc: "선출에 관한 교회법 조항을 앞에 펼쳐 놓자 밤이 내린다. 희미한 빛이 페이지를 비춘다. 누가 선출될 수 있고, 누가 그들을 선출할 수 있는지, 어떤 선례는 지켜졌고 어떤 선례는 굽혀졌는지... 읽을 인내심이 있는 자라면 그 모든 것을 여기서 찾을 수 있다.\n\n늙은 이들은 죽는다. 콘클라베가 열린다. 그리고 추기경들은 정작 필요할 때 누가 법을 알고 있었는지 기억한다."
 study_scripture_outcome.100.a: "언젠가 그 질문이 제기될 것이다. 내가 그 답이 되겠다."
 study_scripture_outcome.100.b: "지혜에는 시간이 필요하다. 야망은 기다리게 두자."
 study_scripture_outcome.100.c: "차라리 자러 가는 게 낫겠다..."
 pam_ss_papabile_tt: "교황 승계에 대한 당신의 [papabile_score|E]가 #P +10#! 증가함"
 study_scripture_outcome.101.t: "$study_scripture_title$명망 있는 주해가"
 study_scripture_outcome.101.desc: "식어버린 저녁을 먹다가, 한입 먹고 다음 한입을 뜨는 사이에 답이 찾아온다. 마침내 그 구절을 어떻게 읽어야 하는지 알겠다.\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!\n\n여러 세대에 걸친 [Glossary('주해가', 'GLOSS_EXEGETE')]들이 이 말들을 두고 논쟁해 왔다. 이제 그 의미가 완전히 명확해 보인다. 문제는 내 해석을 어떻게 할지다."
 study_scripture_outcome.101.desc_generic: "여러 세대에 걸친 [Glossary('주해가', 'GLOSS_EXEGETE')]들이 이 말들을 두고 논쟁해 왔다. 이제 그 의미가 완전히 명확해 보인다. 문제는 내 해석을 어떻게 할지다."
 study_scripture_outcome.101.a: "다음 축일에 [ROOT.Char.Custom('StudyPulpitWord')]에서 이를 설교하자."
 study_scripture_outcome.101.b: "학식 있는 이들 사이에 조용히 돌리자."
 study_scripture_outcome.101.c: "침묵 속에서 내게 주어졌다. 침묵 속에서 돌려주겠다."
 GLOSS_EXEGETE: "주해를 하는 사람을 뜻합니다. 문헌, 특히 종교 경전을 비판적으로 설명하거나 해석하거나 해설하는 데 능숙한 전문가 또는 학자입니다."
 study_scripture_outcome.102.t: "$study_scripture_title$명료한 교리 이해"
 study_scripture_outcome.102.desc: "[ROOT.Char.GetFaith.GetName]의 교리는 수년 동안 내 머릿속에 자리해 왔지만, 몇몇 가르침은 끝내 제대로 이해되지 않았다.\n\n"
 study_scripture_outcome.102.desc_tenet: "오늘 밤, [pam_ss_clarity_tenet.GetBaseName|U](이)가 마침내 명확히 이해된다. 무엇을 요구하고 무엇을 용서하며 그 경계가 어디에 있는지. 어떤 학자 앞에서도 이를 옹호하거나 아이에게 설명할 수 있을 만큼 제대로 이해했다."
 study_scripture_outcome.102.desc_generic: "오늘 밤, 그 가르침이 마침내 명확히 이해된다. 무엇을 요구하고 무엇을 용서하며 그 경계가 어디에 있는지. 어떤 학자 앞에서도 이를 옹호하거나 아이에게 설명할 수 있을 만큼 제대로 이해했다."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!"
 study_scripture_outcome.102.a: "빛이 희미해지기 전에 글로 남겨 두어야 한다."
 study_scripture_outcome.102.b: "그 기쁨만으로 충분하다."
 study_scripture_outcome.102.c: "계시조차 아침까지 기다려도 된다."
 study_scripture_outcome.121.t: "$study_scripture_title$스승"
 study_scripture_outcome.121.desc: "촛불이 진작 꺼졌어야 할 시간이 한참 지난 뒤, 도서관에서 나의 [ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )] [student_courtier.GetTitledFirstName](을)를 발견한다. 지금 수준으로는 몇 단계나 벅찬 책을 앞에 두고 몸을 잔뜩 숙인 채다.\n\n\"용서해 주십시오, [ROOT.Char.Custom('FormOfAddressForLiege')].\" 깜짝 놀란 [student_courtier.GetSheHe|U]는 말을 더듬는다. \"저... 저는 그냥 이 책을 읽을 수만 있으면 해서...\n\n그 책을 실제로 #EMP 읽어 본#! 스승이 있었다면 얼마나 많은 것을 내놓았을까 하는 생각이 든다."
 study_scripture_outcome.121.a: "함께 제대로 읽자."
 study_scripture_outcome.121.b: "[student_courtier.GetHerHim]를 후원하겠다."
 study_scripture_outcome.121.c: "[student_courtier.GetHerHim]를 혼자 공부하도록 내버려 두자. 그게 인격을 단련하는 법이다."
 study_scripture_outcome.122.t: "$study_scripture_title$교리문답"
 study_scripture_outcome.122.desc: "내 공부가 결실을 맺었다. 오늘 밤, 내 [ROOT.Char.Custom('ResidenceBuilding')]의 [ROOT.Char.Custom('ResidenceBuildingHallsType')]에 가솔을 모으고 그 앞에서 [ROOT.Char.GetFaith.ReligiousText](을)를 펼친다.\n\n나는 읽는다. 그들은 듣는다. 이내 질문이 이어진다. 어떤 것은 단순하고, 어떤 것은 놀라울 만큼 날카롭다. 성스러운 배움을 갈망하는 것은 나만이 아닌 모양이다."
 study_scripture_outcome.122.a: "모두에게 한 줄씩. 그것이 할 일이다."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U](은)는 총명하다. [pupil.GetHerHim]를 더 가르치겠다."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U](은)는 끝난 뒤에도 자리를 뜨지 않았다. 문은 열려 있다."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U](은)는 충분히 배웠다. [devout.GetHerHim]에게 내 축복을 내려 주자."
 study_scripture_outcome.123.t: "$study_scripture_title$[ROOT.Char.Custom('StudySeminaryWord')|U]의 문"
 study_scripture_outcome.123.desc: "내 공부에 대한 소문이 순례자와 행상인을 따라 퍼져 나갔고, 오늘은 그들이 학생이 되려는 자 하나를 내게 데려왔다. [aspirant.GetTitledFirstName](은)는 길에 지친 고집스러운 모습으로 내 문 앞에 서 있다. 떨리는 [aspirant.GetHerHis] 손에는 빌린 책 한 권을 꽉 움켜쥐고 있다.\n\n설교하는 내용을 직접 읽는 분이라고 들었습니다. 저를 가르쳐 주십시오. 그러면 섬기겠습니다."
 study_scripture_outcome.123.a: "아. 신앙의 첫 글자부터 시작한다."
 study_scripture_outcome.123.b: "내 궁정은 [ROOT.Char.Custom('StudySeminaryWord')](이)가 아니다."
 study_scripture_outcome.400.t: "$study_scripture_title$의사여, 네 자신을 고치라"
 study_scripture_outcome.400.desc: "그 구절에서 문득 멈칫한다. 그 단죄가 불편할 만큼 낯익다.\n\n"
 study_scripture_outcome.400.desc_generic: "글에는 내 이름이 적혀 있지 않다. 그런데도 나를 지목한다. 내가 [penance_sin.GetName( ROOT.Char )](이)라고. 명백하게, 조금의 자비도 없이... 마치 글쓴이가 나를 알기라도 했던 것처럼."
 study_scripture_outcome.400.desc_end: "\n\n책을 덮고 더 읽지 않을 수도 있다. 하지만 그 고발은 그대로 남는다."
 study_scripture_outcome.400.a: "치료법은 단 하나뿐이다. 보속."
 study_scripture_outcome.400.b: "무슨 일이 있어도 계속 읽어야 한다."
 study_scripture_outcome.400.c: "성인은 설교한다. 죄인은 통치한다."
 study_scripture_outcome.410.t: "$study_scripture_title$이상한 주석"
 study_scripture_outcome.410.desc: "빌린 고서의 이전 독자는 여백에 자기 생각을 남겨 놓았다. 반론과 기도, 그리고 [pam_ss_margin_tenet.GetBaseName](이)라는 원리에 관한 기록이다.\n\n이런 낙서는 무시해야 한다. 그런데 나는 오히려 어느새 두 번이나 읽고 있다."
 study_scripture_outcome.410.a: "이제 세 번째로 읽자. 천천히."
 study_scripture_outcome.410.b: "이토록 진지하게 제기된 오류라면 제대로 논박해 줄 가치가 있다."
 study_scripture_outcome.410.c: "모조리 불 속에 던져넣겠다."
 study_scripture_outcome.430.t: "$study_scripture_title$원리와 마음"
 study_scripture_outcome.430.desc: "[ROOT.Char.GetFaith.GetName]의 여러 가르침 가운데 무엇보다 내 마음에 품은 것이 하나 있다. 바로 [pam_ss_heart_tenet.GetBaseName](이)다. 이를 옹호할 수 있기 훨씬 전부터 품어 온 가르침이다. 오늘 밤에는 결점을 찾아보며 그 가르침을 파고든다.\n\n"
 study_scripture_outcome.430.desc_quote: "여러 문헌이 한목소리로 답한다.\n#EMP \"[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]\"#!\n\n결점은 애초부터 가르침에 있지 않았다."
 study_scripture_outcome.430.desc_generic: "여러 문헌이 내 목소리보다 오래되고 흔들림 없는 한목소리로 답한다. 결점은 애초부터 가르침에 있지 않았다."
 study_scripture_outcome.430.a: "나는 이를 믿는다. 내가 이를 삶으로 실천하는 모습을 온 [ROOT.Char.Custom('StudyParishWord')]에 보여 주자."
 study_scripture_outcome.430.b: "이를 옹호하는 글을 쓰겠다."
 study_scripture_outcome.430.c: "너무 꼼꼼히 들여다보면 어떤 가르침에든 결점은 있다..."
 pam_ss_spread_tenet_tt: "당신의 옹호문이 최대 #V 3#!명의 [rulers|E]를 움직여 [pam_ss_heart_tenet.GetBaseName](을)를 받아들이게 할 수도 있음"
 pam_ss_conviction_spread_tt: "$study_scripture_title$개인 원리 채택됨"
 study_scripture_outcome.1000.t: "$study_scripture_title$책망받은 목자"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U](은)는 목소리를 높이지 않는다. 그럴 필요도 없다.\n\n\"네 공부에는 먼지만 쌓이고 있다고 들었다. 배우려 하지 않는 목자는 방향을 잃은 양 떼를 거느린다. 너는 남들보다 더 많은 것을 받았다. 그것으로 무엇을 했느냐?\"\n\n그 뒤의 침묵은 어떤 고함보다도 더 괴롭다."
 study_scripture_outcome.1000.desc_letter: "편지에는 [senior.GetTitledFirstName]의 인장이 찍혀 있고, 절제된 문장 하나하나가 돌처럼 묵직하게 꽂힌다.\n\n\"네 공부가 흔들리고 있다는 소식이 들려왔다. 배우려 하지 않는 목자는 [ROOT.Char.GetHerHis] 양 떼를 그릇된 길로 이끈다. 너는 남들보다 더 많은 것을 받았다. 다음에는 더 나은 소식이 들리기를 기대하겠다.\"\n\n서명은 없다. 인장만으로 충분하다."
 study_scripture_outcome.1000.desc_dream: "꿈속에서 나는 모든 책에 내 이름이 적혀 있고 모든 페이지가 백지인 거대한 도서관에 서 있다. 수많은 성스러운 형상에서 익히 보아 온 인물이 마지막 책을 부드럽게 덮는다. 죽은 이의 눈을 감겨 주듯이.\n\n\"너는 남들보다 더 많은 것을 받았다.\" 성자가 말한다. 잠에서 깨어도 그 말은 여전히 방 안에 남아 있다."
 study_scripture_outcome.1000.a: "다시는 부족하다는 평가를 받지 않겠다."
 study_scripture_outcome.1000.b: "더는 감당할 수 없다. 이제 그만이다... 영원히."
 study_scripture_outcome.1000.c: "이제 그만. 쉬어야겠다."
 never_study_scripture_again_tt: "당신은 #N 다시는#! [GetScheme('study_scripture').GetTypeName] [scheme|E]에 착수할 수 없음"
 study_scripture_outcome.1010.t: "$study_scripture_title$잉크의 선물"
 study_scripture_outcome.1010.desc: "[sender.GetTitledFirstName]에게서 소포가 도착했다."
 study_scripture_outcome.1010.end_christian: "리본이 내가 계속 제대로 익히지 못했던 바로 그 구절을 표시하고 있다.\n\n#EMP \"[ROOT.Char.Custom('RandomRelevantBibleQuote')]\"#!\n\n후한 데다 쓸모까지 있는 선물이다."
 study_scripture_outcome.1010.end: "안에는 정교하게 제본된 신심서 한 권이 있다. 페이지마다 기도문과 주석, 정교한 채색화로 가득하다.\n\n후한 데다 쓸모까지 있는 선물이다. 계속 나를 피해 가던 답이 이미 이 페이지들 사이에 있을지도 모른다."
 study_scripture_outcome.1010.a: "이 선물을 잘 활용하겠다."
 study_scripture_outcome.1010.b: "훌륭한 책이군. 내 책장에 꽂아 두면 보기 좋겠다."
 pam_ss_devotional_book_name: "신심서"
 pam_ss_devotional_book_description: "성스러운 문헌과 주석을 담아 필사하고 금박으로 장식한 채색 필사본. 필사와 금박 장식에서 신앙심이 역력히 드러납니다. 받는 이에게 읽기를 권하는 구절을 리본으로 표시합니다."
 study_scripture_outcome.1020.t: "$study_scripture_title$육신의 고행"
 study_scripture_outcome.1020.desc: "오늘 밤에도 문헌 앞에서 패배한다. 지난밤에도 그랬고, 그 전날 밤에도 그랬다. 눈은 자꾸 글자에서 벗어나고, 생각은 저녁 식사와 침대, 교리만 아니면 무엇이든 향한다.\n\n문제는 몸이다. 옛 금욕 수행자들은 알고 있었다. 안락함은 [ROOT.Char.GetFaith.DevilName]의 가장 조용한 종복이며, 굶주림은 영혼을 벼린다. 어쩌면 영이 나아가려면 먼저 육체의 욕구부터 억눌러야 하는지도 모른다."
 study_scripture_outcome.1020.a: "채찍이 잡념을 몰아낼 것이다."
 study_scripture_outcome.1020.b: "몸을 굶겨라, 영혼을 살찌워라."
 study_scripture_outcome.1020.c: "아니면 저녁을 먹고 자고, 내일 새로 시작하거나."
 study_scripture_outcome.1030.t: "$study_scripture_title$암자 수도원 은거"
 study_scripture_outcome.1030.desc: "공부에 진전이 없다. 똑같은 책상, 똑같은 촛불, 똑같은 패배만이 반복된다. 그래서 지위와 상관없이 신앙에 헌신하는 나의 [ROOT.Char.Custom2( 'RelationToMeShort', counselor )] [counselor.GetTitledFirstName]에게 찾아간다.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "\"너무 많은 벽을 짊어지고 오셨군요.\" [counselor.GetFirstNameNoTooltip]의 말을 듣는 와중에, 시선은 텅 빈 독방, 하나뿐인 등불, 그리고 침묵을 향한다. \"옛 은수자들은 알고 있었습니다. 모든 것을 걷어 내면, 남는 것이 바로 찾으시던 것입니다.\""
 study_scripture_outcome.1030.desc_monastery: "\"영주처럼 읽으시는군요.\" [counselor.GetFirstNameNoTooltip]의 말투는 부드럽다. \"글줄을 정복하고, 세금을 계산하듯 읽은 분량을 헤아리시지요. 여기서는 같은 한 줄을 일주일 동안 읽습니다. 그 한 줄이 도리어 우리를 읽을 때까지.\""
 study_scripture_outcome.1030.a: "내 공부를 위해 축복을 청하자."
 study_scripture_outcome.1030.b: "그렇다면 같은 한 줄을 두 주 동안 읽겠다."
 study_scripture_outcome.1030.c: "이를 두고 기도하고, 그것으로 끝내겠다."
 study_scripture_outcome.1040.t: "$study_scripture_title$또 하나의 손길"
 study_scripture_outcome.1040.desc_acolyte: "나는 도움을 청하지 않았다. 그런데도 도움은 찾아왔다. 나의 [ROOT.Char.Custom2( 'RelationToMeShort', helper )] [helper.GetTitledFirstName](은)는 내 노트를 정리하고, 알맞은 주석을 찾아내고, 촛불 심지를 다듬었다. [helper.GetSheHe|U]는 내 습관까지 말없이 파악해 두었다. 내가 어떤 구절에서 한숨을 쉬는지까지도.\n\n\"푹 쉬셔야 기도도 더 잘하십니다.\" [helper.GetSheHe]는 담담히 말하며 따뜻한 [helper.Custom('GetLocalStreetFood')]까지 내 노트 옆에 내려놓는다."
 study_scripture_outcome.1040.desc_partner: "나의 [ROOT.Char.Custom2( 'RelationToMeShort', helper )] [helper.GetTitledFirstName](이)가 살며시 들어와 내 손에 들린 고서를 가져가 한 줄을 소리 내어 읽는다. 그 말씀은 성스럽다. [ROOT.Char.GetFaith.HighGodName]이시여, 용서하소서. 하지만 오늘 밤 내 눈에는 그보다 더 성스러운 것이 있다. 바로 [helper.GetHerHis] [helper.Custom('ObjectifiedFeature')]이다.\n\n\"제가 도와드리죠.\" [helper.GetSheHe]는 촛불의 온기를 함께 느낄 만큼 가까이에서 나직이 속삭인다. \"그게 제가 원하는 바입니다.\""
 study_scripture_outcome.1040.a: "그럼 새벽까지 받아 적어라. 함께 끝내자."
 study_scripture_outcome.1040.b: "그럼 한 시간만 함께하자."
 study_scripture_outcome.1040.c: "그 마음만으로도 충분하다."
 study_scripture_outcome.1040.d: "더 가까이 와라. 촛불빛은 멀리까지 닿지 않으니까..."
 study_scripture_outcome.1050.t: "$study_scripture_title$영혼의 어두운 밤"
 study_scripture_outcome.1050.desc: "너무 깊이 읽어 버렸다. 자정을 넘긴 어느 순간 답은 질문으로, 확신은 의심으로 바뀌었다.\n\n"
 study_scripture_outcome.1050.desc_quote: "이런 침묵을 겪은 것은 내가 처음이 아니다. #EMP \"저의 신이시여, 어찌하여 저를 버리셨나이까?\"#!\n\n촛불은 타오른다. 침묵은 계속된다. 이제 어떻게 해야 하나?"
 study_scripture_outcome.1050.desc_generic: "시대를 막론하고 거룩한 이들조차 이런 의심을 겪어 왔다. [ROOT.Char.GetFaith.HighGodName]께서 숨을 죽인 듯 아무 대답도 하지 않고, 그 이유조차 알려 주지 않는 순간을.\n\n촛불은 타오른다. 침묵은 이어진다. 이제 어떻게 해야 하나?"
 study_scripture_outcome.1050.a: "의심도 다른 것과 다를 바 없는 하나의 글줄이다."
 study_scripture_outcome.1050.b: "어쩌면 침묵이 답일지도 모른다."
 study_scripture_outcome.1050.c: "말 너머로, 의심 너머로, 신비 그 자체로 들어가자."
 study_scripture_outcome.1060.t: "$study_scripture_title$규율의 [Select_CString( order_head.IsFemale, '자매들', '형제들' )]"
 study_scripture_outcome.1060.desc_house: "공부는 뜻대로 풀리지 않고, 제대로 얻은 것도 거의 없다. 하지만 이 소식이 [order_head.GetPrimaryTitle.GetNameNoTier|l]까지 전해졌다. 그 수도회는 [order_house_county.GetNameNoTier]에 수도원을 두고 있다. 오늘은 그들의 수레가 삐걱거리며 내 안뜰로 들어온다. 필사한 주석서와 촛불 한 상자, [order_head.GetTitledFirstName]의 인장으로 봉인한 편지가 실려 있다.\n\n\"수도 규칙이 이어지는 한, 목자가 홀로 공부하게 두지는 않습니다. 말씀만 하십시오. 저희가 가진 것은 무엇이든 내어드리겠습니다.\""
 study_scripture_outcome.1060.desc_far: "내가 공부에 애를 먹고 있다는 소식이 멀리까지 퍼져, 급기야 [order_head.GetPrimaryTitle.GetNameNoTier|l]까지 닿았다. 오늘은 그들의 수레가 삐걱거리며 내 안뜰로 들어온다. 필사한 주석서와 촛불 한 상자, [order_head.GetTitledFirstName]의 인장으로 봉인한 편지가 실려 있다.\n\n\"수도 규칙이 이어지는 한, 목자가 홀로 공부하게 두지는 않습니다. 말씀만 하십시오. 저희가 가진 것은 무엇이든 내어드리겠습니다.\""
 study_scripture_outcome.1060.a: "이 사본들을 필사한 모든 이에게 감사한다."
 study_scripture_outcome.1060.b: "학식 있는 성직자 한 명을 보내 달라."
 study_scripture_outcome.1060.c: "저들에게 [ROOT.Char.GetFaith.HighGodName]의 가호가 있기를."
 pam_ss_lettered_brother_tt: "수도회의 #EMP 학식 있는 성직자#! 한 명이 당신의 [court|E]에 합류함"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U](이)가 [order_head.GetPrimaryTitle.GetNameNoTier|l]에서 도착함"
