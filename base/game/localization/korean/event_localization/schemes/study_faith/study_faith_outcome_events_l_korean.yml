l_korean:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "[target.GetAdherentNameNoTooltip] 발견!"
 study_faith_outcome.0010.desc: "내가 따로 넣었던 문의와 작은 뇌물이 드디어 빛을 발했다! 이제 [study_faith_target.GetShortUIName](이)가 내 앞에 서 있었다. 아마도 [target.GetAdherentName](이)겠지.\n\n"
 study_faith_outcome.0010.desc.in_realm: "내 봉역에 있는 [target.GetAdherentName](을)를 만나게 해 달라고 요청했던 지도 얼마 되지 않았다. 이제 [study_faith_target.GetShortUIName](이)가 내 부름에 응답해 앞에 서 있었다.\n\n"
 study_faith_outcome.0010.d.intimidated: "\"무엇이 필요하십니까, [ROOT.Char.GetTitleAsName]?\" [study_faith_target.GetSheHe]가 떨면서 물었다. 경비들은 의심하는 눈초리로 [study_faith_target.GetHerHim]를 쳐다보았다. 마법을 부릴 기미만 보여도 바로 나설 태세였다."
 study_faith_outcome.0010.d.safe: "\"어떻게 도와드리면 되겠습니까, [ROOT.Char.GetTitleAsName]?\" [study_faith_target.GetSheHe]가 조금 겁먹은 기색으로 말했다. 내 수색에 관한 소문을 들은 경비들이 호기심을 숨기지 못하고 [study_faith_target.GetHerHim]를 바라보았다."
 study_faith_outcome.0010.a: "자네한테서 [target.GetNameNoTooltip](을)를 배우고 싶군."
 study_faith_outcome.0010.b: "마음이 바뀌었다."
 study_faith_outcome.0010.b.desc: "자신에게 맞는 삶을 살아가도록 [study_faith_target.GetShortUIName](을)를 놓아주게 됨"
 study_faith_outcome.0101.t: "[actor.GetFaith.HighGodName](와)과 잘 아는 사이"
 study_faith_outcome.0101.desc: "[actor.GetRite.GetName](을)를 힘들게 공부한 결과, 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName](을)를 더 잘 이해하게 되었다. 하지만 무엇보다도 [actor.GetFaith.GoodGodNames]의 길을 걷는 방법을 알게 되었다."
 study_faith_outcome.0101.a: "이제 개종할 때가 왔군."
 study_faith_outcome.0101.b: "[ROOT.Char.GetFaith.GoodGodNames](을)를 버릴 수는 없다!"
 study_faith_outcome.0102.desc: "무지한 나를 이끌어 준 그대의 인내심과 관대함에 감사하오. 이제 [actor.GetFaith.GoodGodNames]의 길을 걷겠소."
 study_faith_outcome.0102.a: "그게 마땅한 행동이었다."
 study_faith_outcome.0103.desc: "나는 [recipient.GetFaith.GoodGodNames]에 충성을 바쳤다! [recipient.GetRite.GetName](을)를 버리진 않을 것이다."
 study_faith_outcome.0103.a: "불복에는 대가가 따르는 법..."
 study_faith_outcome.0111.t: "[actor.GetRite.GetNameNoTooltip](을)를 이해하기 위한 노력"
 study_faith_outcome.0111.desc: "[actor.GetRite.GetName](을)를 힘들게 공부한 결과, 남은 게 없다! [actor.GetFaith.GoodGodNames]의 길을 걷지도 못했고, 내 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetFirstNamePossessive] 믿음이 잘못된 것 같아 걱정이 된다."
 study_faith_outcome.0111.a: "개종하면 이해가 따라올지도 모르지..."
 study_faith_outcome.0111.b: "한층 더 노력해야겠다."
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$: 돌파구"
 study_faith_outcome.1000.desc: "뼈를 깎는 노력 끝에 드디어 이해가 되기 시작했다. 책을 읽느라 헤아릴 수 없이 많은 시간을 쏟아붓고, 의식을 연습한다고 밤잠을 설치고, [target.GetFaith.GetAdjective] 신학 수업을 정말 얼마나 들었는지... 그 모든 노력이 마침내 하나가 되어 [target.GetRite.GetAdjective] 교파를 더 명확히 이해할 수 있게 되었다.\n\n공부하면서 [target.GetTitledFirstName](을)를 따라 하려고 노력했다. 하지만 이제는 [target.GetSheHe]가 [target.GetRite.GetName] 교파의 \"따뜻한 품\"에서 어떤 식으로 편하게 느끼는지 이해가 되기 시작했다."
 study_faith_outcome.1000.a: "그 어떤 믿음의 실천 방식이든 다 배울 수 있다!"
 study_faith_outcome.1000.b: "내 방식보다 [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip] 교파가 더 말이 되는 것 같군..."
 study_faith_outcome.1200.t: "$study_faith$: 명확해진 원리"
 study_faith_outcome.1200.desc: "서재의 익숙한 벽이 내 조용한 승리를 바라보았다. 나는 [discovered_tenet.GetName( target.GetRite )]에서 [target.GetRite.GetAdjective](이)가 지닌 가치를 확인하고 있었다. 이상하긴 했지만, 상상력을 조금 발휘하니 [target.GetTitledFirstName](와)과 [target.GetHerHis] 친척이 이 낯선 방식을 실천하는 모습이 그려졌다.\n\n기나긴 길에서 이제 막 한 걸음을 나섰을 뿐이다. 그러나 [target.GetRite.GetNameNoTooltip] 교파를 향한 나의 여정은 조금씩 앞으로 나아가고 있다."
 study_faith_outcome.1200.a: "이 [target.GetRite.GetAdjectiveNoTooltip]의 실천 방식을 더 많이 알고 싶군!"
 study_faith_outcome.1200.b: "흥미롭군. [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )](와)과는 어떤 연관이 있는지 궁금한걸!"
 study_faith_outcome.1200.c: "이거 좀 불편해지는군..."
 study_faith_outcome.1400.t: "$study_faith$: [target.GetRite.GetNameNoTooltip]의 관습"
 study_faith_outcome.1400.desc: "[target.GetRite.GetName] 교파를 이해하려면 형이상학적인 체계뿐만 아니라, 이 교파가 일상에 미치는 평범한 영향력 또한 연구해야 한다.\n\n[discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]의 개념을 숙고한 결과, 여기에 함축된 내용을 충분히 파악하고 이 개념을 [target.GetRite.GetNameNoTooltip]의 실천 방식과 하나로 다시 묶어낼 수 있었다."
 study_faith_outcome.1400.alt1.desc: "\n\n결국, 이를 통해 저들의 [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )] 실천 방식에 담긴 미묘한 뜻을 밝혀낼 수 있었다!"
 study_faith_outcome.1400.alt2.desc: "\n\n거대한 그림의 한 조각에 불과하지만, 조각을 찾아낼 때마다 [target.GetRite.GetNameNoTooltip] 교파를 전체적으로 이해하는 데 조금씩 가까워지고 있다."
 study_faith_outcome.1400.a: "유용한 지식이군. 계속 나아가자."
 study_faith_outcome.1400.b: "밤새 공부해야겠군."
 study_faith_outcome.1400.c: "[target.GetShortUINameNoTooltip]한테 더 물어봐야겠다."
 study_faith_outcome.1500.t: "$study_faith$: 능력 밖의 일"
 study_faith_outcome.1500.desc: "오랜 공부를 통해 외부인치고는 많은 것을 배웠다. [target.GetRite.GetName] [rite|E]의 수수께끼는 처음부터 이 교파를 믿어 온 이들을 위해 남겨두어야 할 것 같다. 그 답은 교파의 입문자에게만 전해지며 그 어떤 문헌이나 관찰 기록, 심지어는 가장 인내심 강한 스승에게서도 찾을 수 없었다.\n\n이제 알 만한 것은 다 알았다."
 study_faith_outcome.1500.a: "배울 수 있는 건 다 배웠다."
 study_faith_outcome.1500.toast: "$study_faith$ 종료"
 study_faith_outcome.1500.toast.desc: "외부인이 습득할 수 있는 [target.GetRite.GetName] [rite|E]의 [core_tenet|E] 및 [doctrine|E]를 모두 배웠습니다."
 study_faith_scheme_stays_active: "[scheme|E]이 활성화된 상태로 남음"
 study_faith_outcome.3000.t: "$study_faith$: 학습 재개?"
 study_faith_outcome.3000.desc: "안타깝게도 [target.GetTitledFirstName](은)는 이제 없다. 애석한 일이다. [target.GetFaith.GetName]의 더 자세한 내용을 지도해 줄 사람을 찾고 있었는데.\n\n하지만 그렇다고 해서 공부를 소홀히 할 생각은 없다. 본보기로 삼을 다른 사람을 찾으면 그만이지!"
 study_faith_outcome.3000.alt1.desc: "안타깝게도 [target.GetTitledFirstName](은)는 [target.GetFaith.GetName]의 더 자세한 내용을 지도할 수 있는 인재가 아니었다.\n\n하지만 그렇다고 해서 공부를 소홀히 할 생각은 없다. 본보기로 삼을 다른 사람을 찾으면 그만이지!"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip](이)야말로 열렬한 숭배자다!"
 study_faith_outcome.3000.b: "혹시 [potential_continuation_target_2.GetTitledFirstNameNoTooltip](은)는 어떨까? [potential_continuation_target_2.GetHerHis|U] 신학이 흥미롭던데."
 study_faith_outcome.3000.c: "[potential_continuation_target_3.GetTitledFirstNameNoTooltip](은)는 어떨까?"
 study_faith_outcome.3000.d: "아, 그러잖아도 공부를 관둘 핑계만 찾고 있었는데 말이지! 만세!"
 study_faith_scheme_retains_progress: "[scheme|E]이 이전 진행도를 모두 유지함"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U]이 교파를 공부함!"
 child_studied_faith_desc: "[owner.Custom('GetDaughterSon')]이 [target.GetRite.GetName] [rite|E]에 대해 더 배움"
 child_studied_faith_invalidated_title: "자녀의 교파 학습 모략 무효화"
 child_studied_faith_invalidated_desc: "자녀의 [GetScheme('study_faith').GetTypeName] [scheme|E]이 무효화됨"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$: 유년기의 용이함"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: 경험의 용이함"
 study_faith_ongoing.1000.desc.young: "[scheme.GetTargetCharacter.GetFaith.GetName] 공부가 놀라울 정도로 순조롭게 진행되고 있다. 온 세상의 기운을 받은 기분이라고나 할까!"
 study_faith_ongoing.1000.desc.theologian: "[scheme.GetTargetCharacter.GetFaith.GetName] 순조롭게 진행되고 있다. 저들의 체계는 확실히 다른 신앙들과는 전혀 다르다!"
 study_faith_ongoing.1000.desc: "\n\n\"#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\"\n\n굳이 표현하자면, 말의 세세한 부분을 파악해 나가는 도중에도 신앙의 정신이 명료하게 느껴지는 것 같다.\n\n이런 빈틈없는 집중력으로 계속한다면, 머지않아 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]의 모든 비밀을 전부 손에 넣게 될 거다!"
 study_faith_ongoing.1000.a: "내 #EMP 모든#! 시간을 쏟아붓겠어!"
 study_faith_ongoing.1000.b: "다른 데 시간을 쓰고 싶은데..."
 study_faith_ongoing.1010.t: "$study_faith$: 사적인 이해"
 study_faith_ongoing.1010.desc: "#EMP \"[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]\"#!\n\n인기척을 느낀 나는 [scheme.GetTargetCharacter.GetFaith.GetAdjective] 경전을 분석하는 글에서 눈을 떼고 고개를 들었다. [lover_target.GetFirstName](이)가 음흉한 눈을 하고 나한테 몸을 기울이고 있었다.\n\n\"혹시 그거 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]에 대한 글인가요?\" [lover_target.GetSheHe]가 물었다.\n\n\"궁정에 동료 신자가 있다니, 게다가 그 신자가 [ROOT.Char.GetTitleTierName](이)라니 이렇게 기쁠 수가! 혹시 제가 좀 더... 사적인 방법으로 이해를 도와드려도 될까요?\""
 study_faith_ongoing.1010.a: "방해받지 않게 내 방으로 갑시다."
 study_faith_ongoing.1010.b: "그냥 그대 같은 [lover_target.Custom('GetDerogatoryNonbeliever')](을)를 공부하는 거요!"
 study_faith_ongoing.1010.c: "사라져라, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. 집중에 방해된다!"
 study_faith_ongoing.1010.c.tt: "#EMP 당신이 [lover_target.GetHerHis] 앞에서 문을 닫고 공부를 재개함#!"
 study_faith_ongoing.1011.t: "$study_faith$: 거짓된 길"
 study_faith_ongoing.1011.desc: "의심한 지는 좀 됐다. 함정이 섞인 질문을 몇 개 던져 보니, [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] 거짓이 드러났다. [scheme.GetTargetCharacter.GetSheHe]가 뭐라고 주장하든, [scheme.GetTargetCharacter.GetFaith.GetName]에 대한 [scheme.GetTargetCharacter.GetHerHis] 믿음은 진실되지 못하다!\n\n불신자의 연극을 알게 된 것만으로도 흥미롭긴 하다. 그러나 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]에 대한 내 이해가 의미 있는 진전을 이루려면 더 독실한 신자를 찾는 게 나을지도 모른다..."
 study_faith_ongoing.1011.a: "더는 [scheme.GetTargetCharacter.GetShortUINameNoTooltip]에게 의지할 수 없다."
 study_faith_ongoing.1011.b: "[scheme.GetTargetCharacter.GetSheHe]가 그토록 잘 숨기고 있었다면, 나 또한 그럴 수 있을지도..."
 study_faith_ongoing.1011.c: "그러면 [scheme.GetTargetCharacter.GetShortUINameNoTooltip](은)는 #EMP 대체#! 뭘 믿는 거지?"
 study_faith_ongoing.1011.c.tt: "[scheme.GetTargetCharacter.GetHerHis] 비밀스러운 믿음이 뭔지 캐내야겠다."
 study_faith_ongoing.1012.t: "$study_faith$: 고대 교파 실천가"
 study_faith_ongoing.1012.desc: "[scheme.GetTargetCharacter.GetTitledFirstNamePossessive] 신앙을 탐구하고자 하는 내 시도가 다소 예상치 못한 결실을 보았다. [scheme.GetTargetCharacter.GetSheHe]는 분명히 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip](을)를 믿지 않는 불신자다. 그러나 [actual_faith.GetName]의 기이한 잊힌 의례를 따르는 것 같다. 그 방식은... 꼭 주술을 닮았다.\n\n이 발견에 나는 매우 놀랐다. 혹시 이 사실을 유리하게 이용할 수는 없을까?"
 study_faith_ongoing.1012.a: "흠, 이것도 꽤 #EMP 흥미로운#! 사실이로군."
 study_faith_ongoing.1012.b: "날 가르칠 새로운 스승이 필요하다."
 study_faith_ongoing.1012.b.tt: "[scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] 공부를 계속할 수 있도록 비슷한 스승을 구하게 됨"
 study_faith_ongoing.1012.c: "이게 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]보다 훨씬 더 설득력 있는 것 같은데!"
 study_faith_ongoing.1012.c.tt: "이제 [actual_faith.GetNameNoTooltip](을)를 공부하게 됨"
 study_faith_ongoing.1013.t: "$study_faith$: 신비주의자보다 과묵한"
 study_faith_ongoing.1013.desc: "[scheme.GetTargetCharacter.GetTitledFirstNamePossessive] 신앙을 탐구하려던 내 시도가 실패로 돌아갔다. [scheme.GetTargetCharacter.GetHerHis] 독실한 위장 뒤에 숨겨진 세상을 향한 관점에서는 그 어떤 신학적인 토대도 찾아볼 수 없었다.\n\n어쩌면 [scheme.GetTargetCharacter.GetSheHe]는 단순히 편의성, 영향력, 아니면 안전을 위해 [scheme.GetTargetCharacter.GetFaith.GetName]의 원칙을 따르고 있는 것이 아닐까?\n\n이유가 뭐든, 이 [scheme.GetTargetCharacter.GetWomanMan]은 자신이 주장하는 믿음에 진지하게 헌신하고 있지 않다는 사실이 분명해졌다."
 study_faith_ongoing.1013.a: "괜히 시간만 낭비했군! [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip](와)과는 이제 끝이다."
 study_faith_ongoing.1020.t: "$study_faith$: 현지의 신자"
 study_faith_ongoing.1020.desc: "내가 [scheme.GetTargetCharacter.GetFaith.GetAdjective]의 실천을 공부한다는 얘기가 [faith_helper.GetTitledFirstName]의 귀에도 들어간 모양이다. [faith_helper.GetSheHe|U]는 현지의 실천가였고, 내 학습을 돕겠다고 제안했다.\n\n\"그저 제 노력에 대해 약간의 감사 표시만 해 주십사 합니다, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [faith_helper.GetSheHe|U]가 [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "도와만 준다면야, 돈은 챙겨주겠네."
 study_faith_ongoing.1020.b: "호의는 호의로 갚는 것 아니겠나."
 study_faith_ongoing.1020.c: "아니, 아무 대가 없이 도와주겠다니 자네 #EMP 정말 이타적인#! 친구로구먼?"
 study_faith_ongoing.1020.d: "마음만 받겠네. 나 혼자서도 잘할 수 있어."
 study_faith_ongoing.1020.c.success: "[faith_helper.GetFirstNameNoTooltip](을)를 회유하여 도움을 받음"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip](이)가 당신의 조종 시도를 간파함"
 study_faith_ongoing.1030.t: "$study_faith$: 오래된 [scheme.GetTargetCharacter.GetFaith.ReligiousText|U]"
 study_faith_ongoing.1030.desc: "한 [chosen_peasant.GetWomanMan]이 욕심 그득한 웃음을 지으며 다가왔다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [scheme.GetTargetCharacter.GetFaith.GetName]의 길을 공부하고 계신다던데, 맞습니까? 저희 아버지께서 [holy_site.GetNameNoTier]에 여행을 떠나셨다가, 이 [scheme.GetTargetCharacter.GetFaith.ReligiousText](을)를 가지고 오셨습니다!\"\n\n\"저는 글을 못 읽으니 쓸모가 없는지라, 대가로 돈을 좀 주신다면 이걸 기꺼이 드리겠습니다.\""
 study_faith_ongoing.1030.a: "이런 우연이 있나. 내 금화를 받도록."
 study_faith_ongoing.1030.b: "이건 생각보다 희귀한 경전이 아니던데..."
 study_faith_ongoing.1030.b.flavor: "이 잡상인과 흥정하기"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName](이)가 조건을 받아들임"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName](이)가 당신의 제안에 모욕감을 느낌"
 study_faith_ongoing.1030.c: "경비대, 이 이교도의 경전을 빼앗아라."
 study_faith_ongoing.1030.d: "사기꾼 같으니! 썩 꺼져라..."
 study_faith_ongoing.1040.t: "$study_faith$: 존경심"
 study_faith_ongoing.1040.desc: "이렇게 좋을 수가! [target.GetTitledFirstName](이)가 [scheme.GetTargetCharacter.GetFaith.GetAdjective] 믿음을 배우고자 하는 내 노력을 치하한다는 서신을 여럿 받았다. [target.GetSheHe|U]는 더 나아가, 나를 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip](을)를 공부하는 걸출한 [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] 신자로 명명했다!\n\n노력을 인정받으니 기분이 좋구나!"
 study_faith_ongoing.1040.a: "필경사! 감사의 답장을 보내도록 하시오."
 study_faith_ongoing.1040.b: "[target.GetFirstNamePossessiveNoTooltip] 믿음을 표출하는 방식이 정말 눈부시군..."
 study_faith_ongoing.1040.c: "쯧! 다른 사람의 평가 따윈 필요 없다! 중요한 건 #EMP 나 자신#!의 평가뿐!"
 study_faith_ongoing.1050.t: "$study_faith$: 방해의 악취"
 study_faith_ongoing.1050.desc: "[scheme.GetTargetCharacter.GetFaith.GetName]의 혼란스럽기도 하고, 모순되기도 하는 원리를 서술해 놓았던 내 기록이 서재 여기저기에 흩뿌려져 있었다. 몇 달간의 노력이 갈기갈기 찢어져 있고, 창가에는 종이가 낱장으로 흩어져 있다. 내 학습장의 일부가 버려졌다는 뜻이기도 했다.\n\n이걸 어쩐다, 처음부터 다시 시작해야 하나?!\n\n#EMP 킁킁...#!근데 이 역겨운 냄새는 뭐지? 유향이나 백단향 같은 게... 꽃향기와 섞인 듯한데? 이 냄새를 맡으니 [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))] [sabotage_rival.GetTitledFirstName]의 우쭐해하는 얼굴이 떠올랐다. 분명 [sabotage_rival.GetSheHe]가 내 파멸을 불러온 것이다..."
 study_faith_ongoing.1050.a: "내 학습장... 안 돼! 그간의 노력이 물거품이 되다니!"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip], #EMP 이 죽어 마땅한 놈#!!"
 study_faith_ongoing.1050.c: "하하! 내 이럴 줄 알고 진작 #EMP 예비 학습장#!을 만들어뒀지."
 study_faith_ongoing.1060.t: "$study_faith$: 무지한 해석"
 study_faith_ongoing.1060.desc: "내 진전 정도를 시험하기 위해 [scheme.GetTargetCharacter.GetFaith.GetAdjective] 신자인 내 [ROOT.Char.Custom2('RelationToMeShort', offended_character)] [offended_character.GetTitledFirstName] 앞에서 [scheme.GetTargetCharacter.GetFaith.ReligiousText|U]의 한 구절을 요약해 보기로 했다. #EMP \"[offended_character.GetFaith.PriestNeuter](은)는 [target.Custom('GetAccessory')](을)를 들어올려야 한다, 그래야 [target.Custom('FormOfAddressForLiege')](이)가 [target.GetCurrentLocation.Custom('get_region_flower_type')](을)를 꺾을 수 있으므로...\"#!\n\n\"그대의 해석은 정말 말도 안 되는군! 내 [offended_character.GetFaith.PriestNeuterPlural](은)는 [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))](이)고, [offended_character.GetFaith.HighGodName]께서는 [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))](이)라는 소리 아닌가!?\"\n\n아무래도 [scheme.GetTargetCharacter.GetFaith.GetAdjective] 실천 방식의 핵심을 잡으려던 내 시도가 아직 부족한 모양이다..."
 study_faith_ongoing.1060.a: "내 반성의 표시로 이걸 받아주시길."
 study_faith_ongoing.1060.b: "난 그저 [offended_character.GetFaith.PriestNeuter]의 덕행을 극찬하려던 것이었는데!"
 study_faith_ongoing.1060.c: "그거 아는가!? [offended_character.GetFaith.HighGodName](은)는 #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)](이)다!#!"
 study_faith_ongoing.1060.d: "그저 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip](을)를 더 잘 이해하려고 했던 건데!"
 study_faith_ongoing.1060.b.success: "[offended_character.GetHerHim]를 속여 당신이 [offended_character.GetHerHis] [offended_character.GetFaith.PriestNeuterPlural](을)를 #EMP 칭찬#!한 것이라고 생각하게 만듦"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip](이)가 당신의 거짓말을 간파함"
 study_faith_ongoing.1060.d.success: "전부 오해라고 해명하는 데 성공함"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip](이)가 당신을 믿지 않음"
 study_faith_ongoing.1070.t: "$study_faith$: 지저분한 신화"
 study_faith_ongoing.1070.desc: "[target.GetTitledFirstNamePossessive] [scheme.GetTargetCharacter.GetFaith.GetAdjective] 신화 경전 선물에 궁정이 떠들썩해졌다. 많은 이가 바라보는 가운데, 나는 경전을 살피며 가장 흥미로운 구절을 큰 소리로 읽었다.\n\n처음에는 [ROOT.Char.GetFaith.EvilGodNames](이)가 날 상대로 더러운 수작을 벌이는 줄 알았다. 하지만 특히 충격적인 구절 몇 개를 철저히 살펴본 결과, 이건 분명 음란한 내용을 담은 글이 틀림없었다.\n\n아니, 성스러운 경전에 [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] [ROOT.Char.Custom('ObjectifiedFeature')]에 대한 이야기가 왜 나온단 말인가?! [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "경비대, 이 빌어먹을 책을 치워버려라!"
 study_faith_ongoing.1070.b: "감히 날 보고 웃어?! #EMP 모조리 태형#!이다."
 study_faith_ongoing.1070.c: "뭐, 어떻게 보면 교육적인 내용이 #EMP 맞긴 하지#!..."
 study_faith_ongoing.1080.t: "$study_faith$: 훌륭한 교사"
 study_faith_ongoing.1080.desc: "내 [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName](은)는 내가 [scheme.GetTargetCharacter.GetFaith.GetName]의 더 자세한 내용을 이해할 수 있도록 끊임없는 도움을 주고 있다.\n\n[court_tutor.GetHerHis|U] 교육에 대한 헌신은 정말 귀감이 될 만하다! [court_tutor.GetSheHe]는 언제나 [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] 경전을 가까이에 두고 있으며, 내 대화 상대로 학식 있는 [scheme.GetTargetCharacter.GetFaith.PriestNeuter](을)를 소개해 주기도 한다.\n\n[court_tutor.GetHerHis] 도움이 없었더라면 내 배움도 이 경지까지 이르진 못했으리라."
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], 그대는 보상을 받아 마땅하오!"
 study_faith_ongoing.1080.b: "그저 본분에 충실했을 뿐이지."
 study_faith_ongoing.1090.t: "$study_faith$: 이해 불가!"
 study_faith_ongoing.1090.desc.intro: "[scheme.GetTargetCharacter.GetFaith.GetName]의 신학을 도무지 이해할 수가 없다!"
 study_faith_ongoing.1090.tenet.desc: "특히 [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )]에 대한 믿음은 전혀 감이 안 잡힌다."
 study_faith_ongoing.1090.doctrine.desc: "특히 [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )](이)가 전혀 감이 안 잡힌다."
 study_faith_ongoing.1090.desc.main: "\n\n머리가 꽉 차서 터질 것 같다! 한 개념을 익히면 다른 개념이 바로 밀려나 잊히고 만다."
 study_faith_ongoing.1090.friend.desc: "\n\n\"계속하게, [ROOT.Char.Custom('ComplimentAdjective')] 친구. 난 자네를 믿어!\"\n\n다행히도 [helpful_friend.GetTitledFirstName](이)가 항상 곁에서 이 낯선 가르침을 이해할 수 있도록 도와준다. 역시 난 축복받은 존재라니까."
 study_faith_ongoing.1090.no_friend.desc: "\n\n휴식이 필요한 건 아닐까?"
 study_faith_ongoing.1090.a: "[helpful_friend.GetFirstNameNoTooltip]의 인도라면 언제든 기댈 수 있지!"
 study_faith_ongoing.1090.b: "아무리 이상하게 느껴지더라도, 인내하며 계속하리라!"
 study_faith_ongoing.1090.c: "책은 잠시 멀리해야겠군..."
 study_faith_ongoing.1090.d: "가망이 없군!"
 study_faith_ongoing.1100.t: "$study_faith$: [target.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1100.desc: "내가 [scheme.GetTargetCharacter.GetFaith.GetName](을)를 성실히 공부하고 있다는 소식이 퍼져나갔다.\n\n사람들이 나를 '[target.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]'라고 부른다. 혼란을 일으킬 수도 있는 이름이기는 한데..."
 study_faith_ongoing.1100.a: "재치 있는 연설을 하면 내 사람들은 물론 [target.GetFaith.GetAdherentNamePluralNoTooltip]들도 회유할 수 있겠지!"
 study_faith_ongoing.1100.b: "내 공부는 내 일이다. 한눈팔지 말자!"
 study_faith_ongoing.1100.c: "[scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip](이)가 분명 감명받겠지!"
 study_faith_ongoing.1100.a.success: "환상적인 연설을 함"
 study_faith_ongoing.1100.a.success.tt: "[root_scope.GetFaith.GetNameNoTooltip] 또는 [target.GetFaith.GetNameNoTooltip]를 믿는 모든 궁정 신하 또는 문객"
 study_faith_ongoing.1100.a.failure: "바보 꼴을 자초함"
 study_faith_ongoing.1110.t: "$study_faith$: [target.GetFaith.GetAdjectiveNoTooltip] 시의 유혹"
 study_faith_ongoing.1110.desc: "아, [poet_location.GetCounty.GetName]의 [the_poet.GetFirstName](이)가 쓴 '[poet_location.Custom('GetTerrainTypePlural')|U]의 [poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U]'(이)로군. 아주 훌륭한 [scheme.GetTargetCharacter.GetFaith.GetAdjective] 시집이지!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n시야말로 신앙을 들여다볼 수 있는 창문 아닐까?"
 study_faith_ongoing.1110.a: "[target.GetFaith.GetAdjectiveNoTooltip] 시를 한번 써봐야겠다!"
 study_faith_ongoing.1110.b: "[ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip](을)를 위한 #EMP 낭만적인#! 시를 낭송해 볼까?"
 study_faith_ongoing.1110.c: "이 시의 종교적 특성을 분석해 보자."
 study_faith_ongoing.1110.a.success: "시에 소질이 있음을 발견함"
 study_faith_ongoing.1110.a.failure: "시를 쓰려고 시도했지만 결과가 초라함"
 study_faith_ongoing.1120.t: "$study_faith$: 이단 이야기"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n\"[ROOT.Char.GetTitleTierName](이)가 외국 신앙의 우화를 공부하다니? 부끄러운 줄도 모르는 겁니까!?\" 내 [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName](이)가 외쳤다.\n\n\"그대가 이단의 교리를 가까이한다는 사실을 적들이 알기라도 하면, 놈들은 온 힘을 다해 그대를 이단자로 몰아갈 겁니다!\"\n\n[scheme.GetTargetCharacter.GetFaith.GetAdjective]의 글을 고른 내 선택이 [ROOT.Char.Custom('GetCourt')]의 비열한 인간들과 적에게 오해를 불러일으킬 수도 있을 것 같다."
 study_faith_ongoing.1120.a: "아니다! 이건... #EMP 존엄한 [target.GetFaith.GetAdjectiveNoTooltip]의 신학 논문이다!#!"
 study_faith_ongoing.1120.b: "감히 날 이단으로 몰아? 내 본때를 보여주지!"
 study_faith_ongoing.1120.c: "옳은 말이군. [ROOT.Char.GetTitleTierName]의 수준에는 안 어울리는 글이지."
 study_faith_ongoing.1120.d: "사람들이 어떻게 생각하든 무슨 상관인가. 이 글이 얼마나 계몽적인데!"
 study_faith_ongoing.1120.a.success: "[zealot.GetFirstNameNoTooltip](을)를 속임"
 study_faith_ongoing.1120.a.failure: "당신의 이단 글에 대한 취향이 널리 알려짐"
 study_faith_ongoing.1120.b.tt: "[zealot.GetFirstName](와)과 #V 결투#!하여 오만불손함에 대한 벌을 내림!\n#weak 해당 결투에서는 목숨을 잃지 않음#!\n당신이 승리할 경우, [prestige_i] [prestige|E] 및 [scheme|E]을 위한 [modifier|E]를 획득함. 패배할 경우, 당신은 조롱의 대상이 됨.\n\n당신의 [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[zealot.GetFirstNamePossessive] [prowess|E]: [prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "[zealot.GetFirstNameNoTooltip](와)과의 결투가 무효화됨"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "\"항복하겠습니다! 제발 용서해 주십시오. 정신박약자가 아니라는 건 확실히 알았습니다! 부디 목숨만큼은!\" [zealot.GetTitledFirstName](이)가 외쳤다.\n\n이제 #EMP 날#! 모욕해선 안 된다는 걸 깨달았겠지."
 study_faith_ongoing.1123.a: "현명한 [ROOT.Char.Custom('GetAnimalType')|U](이)가 말했지. \"너보다 나은 사람을 모욕하지 말거라!\""
 study_faith_ongoing.1123.b: "지하 감옥에 처넣어 그 오만불손함의 죄를 묻겠다!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "바닥에 드러누워 있는데 [zealot.GetTitledFirstName](이)가 옆에 침을 내뱉었다.\n\n\"나약해 빠졌군. [ROOT.Char.GetTitleTierName] 간판이 아까울 정도로 하찮아. 자, 내 호의를 베풀어 그 멍청한 서책을 모조리 없애주지.\" [zealot.GetSheHe]가 말했다."
 study_faith_ongoing.1124.a: "학습에 차질이 생겼군..."
 study_faith_ongoing.1130.t: "$study_faith$: 신앙의 즐거움"
 study_faith_ongoing.1130.desc: "\"아, 내 사랑 [ROOT.Char.GetFirstNameNoTooltip]! 내가 각별하게 여기는 [scheme.GetTargetCharacter.GetFaith.GetName]에 대해 배우고 있다던데, 정말인가요? 날 이해하려고 노력해 주다니, 정말 고마워요!\" [lover_to_help.GetTitledFirstName](이)가 [lover_to_help.Custom('quirk_pos_pp')].\n\n\"내가 도울 수 있는 게 있다면 #EMP 뭐든#! 할게요.\""
 study_faith_ongoing.1130.a: "도움의 손길을 마다하는 건 예의가 아니지!"
 study_faith_ongoing.1130.b: "가장 즐거운 방법이 하나 생각나는데."
 study_faith_ongoing.1130.c: "혼자 공부하는 게 좋을 것 같군."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip](은)는 추파를 던지긴 해도 가르치는 능력은 훌륭함"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip](은)는 신학의 일부분에 불과한 감각적인 요소에 초점을 맞추고 당신을 가르쳤으며, 당신은 그 모든 것을 신앙과 어떻게 아울러야 할지 감을 잡지 못함"
 study_faith_ongoing.1130.a.failure.toast: "[lover_to_help.GetFirstNameNoTooltip](은)는 도움이 되기보다는 추파만 던짐"
 study_faith_ongoing.1140.t: "$study_faith$: 인도의 손길"
 study_faith_ongoing.1140.desc: "\"[scheme.GetTargetCharacter.GetFaith.GetName]에 대해 더 배우도록 하게. [ROOT.Char.GetTitleTierName](으)로서 입지를 다시는 데 보탬이 될 테니까!\" 내 [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName](이)가 외쳤다.\n\n\"난 태어날 때부터 [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]의 방식으로 살아왔지. [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))], 혹시 내 도움이 필요하진 않나?\""
 study_faith_ongoing.1140.a: "이 원리 말인데, 이해가 잘 안되더군..."
 study_faith_ongoing.1140.b: "앞으로 내 수업에 함께하는 건 어떻겠나?"
 study_faith_ongoing.1200.t: "$study_faith$: 이교도 사냥개"
 study_faith_ongoing.1200.desc: "나는 수수께끼 같은 [scheme.GetTargetCharacter.GetFaith.GetName](을)를 배우며 기록한 것을 잘 정리해 두었다. 이것이야말로 내가 또 다른 믿음의 체계라는 혼돈을 관리할 수 있게 해 주는 유일한 수단이다. 하지만 이 기록들이 원래 있던 자리에서 사라졌다.\n\n[ROOT.Char.Custom('DogStoryName')]의 축축한 코가 익숙하게 내 손을 찾았다. 나는 이 절망스러운 상황에서 잠시 벗어나고자 내 사랑스러운 개를 내려다보았다.\n\n녀석은 나를 올려다보며 뿌듯하게 꼬리를 흔들고 있었다. 그 순간 나는 보고야 말았다. 녀석이 내 기록장을 입에 한가득 물고 있었다..."
 study_faith_ongoing.1200.a: "뭐, 그렇다고 녀석에게 화를 낼 순 없지!"
 study_faith_ongoing.1200.b: "잠깐 산책 좀 다녀올까? 이리 온."
 study_faith_ongoing.1200.c: "그건 장난감이 아니야! 이 #EMP 못된#! 녀석!"
 study_faith_ongoing.1300.t: "$study_faith$: 체험 학습"
 study_faith_ongoing.1300.desc: "[ROOT.Char.GetCurrentLocation.GetTitle.GetName](을)를 지나가던 중, 현지인들이 [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip](을)를 기념하는 모습을 보았다. 한 [interlocutor.GetWomanMan]이 다가오더니 함께 하자고 권유했다. 우리는 [ROOT.Char.GetFaith.GetAdherentNamePlural]들이었는데도 말이다.\n\n내 일행은 함정일지도 모른다며 사이로 끼어들려고 했다.\n\n위험이 무슨 상관이냐. [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]에 대해 이렇게 직접 배울 기회가 어디 흔한 줄 아나!"
 study_faith_ongoing.1300.a: "안내해 주게!"
 study_faith_ongoing.1300.a.flavor: "사소한 [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] 의례일 뿐인데. 문제 될 게 있겠나?"
 study_faith_ongoing.1300.b: "[interlocutor.GetHerHis] 신앙의 내용을 주제로 토론할 수 있다면 참으로 유익하겠군."
 study_faith_ongoing.1300.b.flavor: "당신은 [interlocutor.GetFirstNameNoTooltip](와)과 즐거운 토론을 시도함"
 study_faith_ongoing.1300.b.success: "당신은 [interlocutor.GetFirstNameNoTooltip](와)과 열띤 토론을 나눔"
 study_faith_ongoing.1300.b.failure: "당신은 [interlocutor.GetFirstNameNoTooltip](와)과 소통하는 데 실패함"
 study_faith_ongoing.1300.c: "\"나랑 같이 [next_destination.GetNameNoTooltip](으)로 가세나!\""
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "나방은 별들의 글을 알지 못해도 불꽃을 찾아낸다. 마찬가지로 영혼은 이름을 알지 못하는 신을 향해서도 온몸을 내던진다."
 holy_text_indeterminate_quote_2: "사막의 바람에 폭군의 발자국이 지워지면, 모래는 오직 목마른 자와 친절을 베푼 자의 흔적만을 기억한다."
 holy_text_indeterminate_quote_3: "강은 돌을 가리지 않고 닦아낸다. 하지만 모든 돌은 인내의 물살 속에서 왕관에 걸맞은 보석으로 거듭나기 마련이다."
 holy_text_indeterminate_quote_4: "지혜의 샘을 마시면 그 무게에 그대의 등이 굽으리라."
 holy_text_indeterminate_quote_5: "어느 날 산이 고개를 숙였다. 왕이나 군대를 향해서가 아니라, 감히 질문을 던진 아이를 향해서였다."
 holy_text_indeterminate_quote_6: "숨겨진 자는 먼저 의심의 속삭임으로 말문을 트신다. 그리하여 그대가 마침내 답할 때, 믿음은 온전히 그대의 것이 되리라."
 holy_text_indeterminate_quote_7: "제단에 바친 거짓말은 모두 연기가 되어 돌아오지만, 정직한 눈물은 씨앗이 되어 천상의 정원에 뿌려지리라."
 holy_text_indeterminate_quote_8: "그대의 길에 드리우는 어둠을 저주하지 말라. 덕분에 그대의 불꽃이 불타오를 용기를 얻을 수 있으니."
 holy_text_indeterminate_quote_9: "빛나는 자는 교만한 이의 기도를 헤아리지 않으며, 아무도 보지 않는 곳에서 행해지는 고요한 자비만을 헤아리신다."
 holy_text_indeterminate_quote_10: "세계가 '내 것'과 '네 것'으로 나뉘었을 때, 신성한 자는 웃음을 터뜨리셨다. 그분의 눈에는 '우리의 것'만 보였기 때문이다."
