l_korean:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ 폭염에 갇히다"
 gdp_travel_events.1000.desc: "[ROOT.Char.GetCurrentLocation.GetName]의 사구는 끝없는 모래의 바다를 이루며 지평선 너머로 뻗어 나갔다. 태양의 열기가 모래 표면에 계속해서 변하며 최면을 거는 듯한 무늬를 그려냈다. 땀에 흠뻑 젖었고, 주변에 그늘도 없는 상황이었지만 멈춰서서 쉬기로 했다. 내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetFirstName](이)가 눈을 크게 뜬 채 나를 돌아보았다. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], 더위를 두려워하지 마십시오. 지난밤에 [entourage_member_one.GetFaith.HighGodName]께서 제게 축복을 내려주셨습니다! 여기서 멀지 않은 곳에 있는 오아시스의 환영을 보았단 말입니다.\""
 gdp_travel_events.1000.a: "이쪽으로 가면 나올 걸세!"
 gdp_travel_events.1000.b: "선택지가 얼마 없군. 어디 믿어 보지."
 gdp_travel_events.1000.b.success: "[entourage_member_one.GetFaith.HighGodName](을)를 찬양하라, 오아시스가 실재함"
 gdp_travel_events.1000.b.failure: "신기루에 불과했음"
 gdp_travel_events.1000.c: "환영 따위를 믿을 생각은 없다."
 low_caravaneer_experience_reason_tooltip: "$trait_track_caravaneer$ 계통에서 #V 100#!의 [trait_level_track_xp|E] 필요 ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])"
 gdp_travel_events.1010.t: "길 잃은 여행자"
 gdp_travel_events.1010.desc: "[ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')]의 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]에서 뻗어 나온 길을 가던 우리 상단은 야영지를 설치할 준비를 했다. 편하게 자리를 잡고 저녁을 맞이하려던 순간, 뒤쪽에서 희미한 목소리가 났다.\n\n\"실례합니다, [ROOT.Char.Custom('FormOfAddressForLiege')]. 저는 가족과 함께 상단에서 떨어져 나온 여행자들입니다. 가진 것은 많이 없지만, 오늘 밤 제 [traveler_child.Custom('GetDaughterSon')]을 안전하게 지켜 주시기만 한다면 뭐든 드리겠습니다.\""
 gdp_travel_events.1010.a: "돈은 넣어 두게. 함께 가지."
 gdp_travel_events.1010.b: "지켜 줄 수야 있지... 약간의 대가만 치른다면."
 gdp_travel_events.1010.c: "#EMP 뭐든#! 준다고 했겠다..."
 gdp_travel_events.1010.d: "먹여 살려야 할 사람이 이미 너무 많아서."
 gdp_travel_events.1020.t: "길 위의 이야기"
 gdp_travel_events.1020.desc.intro: "내 [ROOT.Char.Custom('GetDonkeyDromedary')](이)가 [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')](을)를 걸어가는 동안, [journey_start.GetName]부터 이어진 여정의 먼 거리가 엉덩이로 뼈저리게 느껴져 왔다. 이 여행이 전혀 괴롭지 않아 보이는 내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName](이)가 옆으로 다가왔는데, 무언가를 말하고 싶어 하는 눈치였다.\n\n"
 gdp_travel_events.1020.desc.caravaneer: "\"[ROOT.Char.Custom('FormOfAddressForLiege')], 짧은 이야기를 하나 들려드릴까 합니다. 지난번에 [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]에서 온 거마관하고 얘기했거든요. 그 사람이 글쎄 엄청난 항해 장치에 대해 이야기했는데...\""
 gdp_travel_events.1020.desc.artisan: "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')](이)가 훌륭한 옷감 염색약이라는 사실 아셨습니까? 그 꽃잎을 따다가 갈면...\""
 gdp_travel_events.1020.desc.creditor: "\"재미있는 사실 하나 알려 드릴까요, [ROOT.Char.Custom('FormOfAddressForLiege')]. 어떤 곳에서는 약탈이 #EMP 합법일수도#! 있다고 합니다. 상대가 자신한테 빚을 지고 있으면 된다더라고요. 말이 나온 김에, 지난번에 저하고 사촌이 같이...\""
 gdp_travel_events.1020.desc.war_profiteer: "\"[ROOT.Char.Custom('FormOfAddressForLiege')], 재미있는 이야기 하나 들려드리겠습니다. 이 [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]에서 위대한 전투가 벌어진 적이 있었다고 해요. 여기가 바로 전설적인 검사가 쓰러진 자리였다는데, [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]처럼 적을 찢어발기던 전사였다고 합니다...\""
 gdp_travel_events.1020.a: "흥미롭군. 더 얘기해 보게."
 gdp_travel_events.1020.b: "[ROOT.Char.Custom('my_subject_of_interest')] 얘기나 더 하지."
 gdp_travel_events.1020.c: "조용히 말을 타고 싶군."
 gdp_travel_events.1020.b.success: "논의의 주제를 바꿈"
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip](이)가 당신의 말을 들을 생각이 없음"
 gdp_travel_events.1030.t: "사악한 속삭임"
 gdp_travel_events.1030.desc: "내 [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))] [ambitious_associate.GetFirstName](이)가 다가오더니, 듣는 이가 없는지 확인하려는 듯 주변을 둘러보았다. [ambitious_associate.GetSheHe|U]는 더 가까이 와서 이렇게 속삭였다.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], 동업자 [current_partner.GetFirstName]에 관한 걱정스러운 얘기를 들었습니다. 회사에서 [current_partner.GetSheHe]가 #EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!(이)라는 소문이 돕니다. 그게 사실이라면, [current_partner.GetHerHim]도 심판을 받아야 합니다!\n\n...그리고, 이 심각한 소식을 전한 이에게도 보상이 따라야 하지 않을까요?\""
 gdp_travel_events.1030.a: "진실을 알아야겠다!"
 gdp_travel_events.1030.a.unity_loss.desc: "동업자의 본성을 밝혀냄"
 gdp_travel_events.1030.b: "굳이 추측에 매달리고 싶진 않군."
 gdp_travel_events.1030.b.unity_gain.desc: "동업자에 관한 추측성 소문에 넘어가기를 거부함"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ 관리되지 않은 우물"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName](이)가 오래된 우물을 들여다보고는 코를 찡그렸다.\n\n관리된 지 한참 된 우물이었다. 돌은 이끼로 뒤덮였으며, 양동이는 반쯤 썩었고 물에서는 목마른 자도 삼키지 못하고 망설일 만큼 고약한 악취가 났다.\n\n불행히도 우리의 물주머니는 거의 텅 비어 흐느적거리는 상태였다. 갈증도 참을 수 없을 만큼 심해지고 있었다."
 gdp_travel_events.1040.a: "조금 더럽다고 해서 나 같은 사람에게 해가 되지는 않겠지!"
 gdp_travel_events.1040.b: "물을 정화하는 법을 알고 있다."
 gdp_travel_events.1040.c: "남은 물을 배분해야만 한다."
 gdp_travel_events.1040.d: "목마르고 기나긴 길이 되겠군."
 gdp_travel_events.1040.e: "한 모금만 마셔 볼까..."
 gdp_travel_events.1040.e.critical_failure.tt: "당신의 질병이 악화함."
 gdp_travel_events.1040.e.success: "물을 마셔도 안전함."
 gdp_travel_events.1040.e.success.desc: "우물에서 물을 마신 뒤 상쾌한 기분이 됨."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ 무너진 나무"
 gdp_travel_events.1050.desc: "폭풍이 [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]의 [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')](을)를 휩쓸고 지나갔으며, 그 바람에 뿌리가 뽑힌 나무가 길을 가로막고 쓰러져 있었다. 지역 노동자들이 파편을 잘라냈으나, 우리가 지나갈 수 있게 되려면 시간이 더 걸린다.\n\n막힌 길 주위의 [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')](을)를 통해 지나갈 수는 있지만, 위태롭게 기울어진 나무들 때문에 위험한 우회로가 될 듯했다."
 gdp_travel_events.1050.x: "내 말 [ROOT.Char.Custom('WarhorseStoryName')](이)라면 이 잔해를 치울 수 있다!"
 gdp_travel_events.1050.a: "내 손을 유용하게 쓰는 게 낫겠군."
 gdp_travel_events.1050.b: "저들의 방식에서 배워갈 게 있을지도 모른다."
 gdp_travel_events.1050.c: "막힌 곳 주위로 돌아갈 길을 찾아보자."
 gdp_travel_events.1050.d: "노동자들이 일을 끝내길 기다리자."
 gdp_travel_events.1050.c.success: "쓰러진 나무 주위로 돌아가는 길을 찾음."
 gdp_travel_events.1050.c.failure: "야생에서 다치게 됨."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ 화물칸의 쥐"
 gdp_travel_events.1060.desc: "배의 화물칸이 쥐 떼로 가득 찼다. 녀석들이 우리 저장품을 탐욕스럽게 먹어 치우고 있다. 누군가는 보관 방식이 적절하지 못했다며, 느슨한 뚜껑과 낡은 자루를 탓한다. 또 누군가는 믿기 힘들 만큼 거대한 쥐 떼의 규모를 탓한다.\n\n이유가 뭐든 우리는 이 싸움에서 빠르게 지고 있다. 더러운 쥐 녀석들이 모든 걸 먹어 치우고 빼앗기 전에 조치해야만 한다."
 gdp_travel_events.1060.x: "내 고양이 [ROOT.Char.Custom('CatStoryName')]에게 맡기지."
 gdp_travel_events.1060.a: "\"작살과 튼튼한 그물을 가져와라!\""
 gdp_travel_events.1060.b: "내가 직접 저장 문제를 해결하겠다!"
 gdp_travel_events.1060.c: "항로를 항구로 돌리고 보급품을 다시 채운다."
 gdp_travel_events.1060.d: "다들 쥐 사냥에 나서라!"
 gdp_travel_events.1060.b.tt: "당신이 [GetTradeGoodCategory('trade_category_cereals').GetName] [expertise|E]을 #V 25#! 이상 보유해야 함"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ 등에 붙은 과녁"
 gdp_travel_events.1070.desc: "어느 순간 지평선에 먼지가 일었다. 다음 순간, 강도 무리가 돌무더기 능선에서 말을 세우고 있었다.\n\n\"멈춰라!\" 강도들의 우두머리가 나를 불렀다. \"[ROOT.Char.GetTitleAsNameNoTooltip|l], 얻은 금을 순순히 넘겨주시지. 그러면 아무도 다치지 않고 넘어갈 수 있다.\""
 gdp_travel_events.1070.a: "\"이 자식들, 나한테는 [ROOT.Char.GetSuzerain.GetShortUINamePossessive] 보호가 함께한다!\""
 gdp_travel_events.1070.a.success: "후견자의 이름 덕분에 안전히 지나감"
 gdp_travel_events.1070.b: "\"어디 뺏어가 보시지!\""
 gdp_travel_events.1070.b.success: "도적들을 몰아냄"
 gdp_travel_events.1070.b.failure: "도적들이 당신의 금화를 가져감"
 gdp_travel_events.1070.c: "\"지나가게만 해 준다면 뭐든 주겠다.\""
 gdp_travel_events.2000.t: "기울어진 탑"
 gdp_travel_events.2000.desc: "내 눈이... 이상한 건가? 지금 내가 생각보다 삐딱하게 서 있는 건가? 아니다. 내 감각은 틀리지 않았다. 비록 눈앞에 펼쳐진 광경은 비현실적이었지만 말이다. #EMP 웅장한 [GetBuildingType('tower_of_pisa').GetNameNoTooltip]이 기울어지고 있다#!!\n\n\"여기 땅은 분리된 우유처럼 물렁물렁합니다, [ROOT.Char.Custom('FormOfAddressForLiege')].\" 내 옆에 서 있던 석공장 [mason.GetFirstName](이)가 말했다. \"꼭대기까지 겨우 4분의 1쯤 올라갔을 때였나, 그때부터 기울어지기 시작하더군요. 그래도 결국 끝까지 다 올렸습니다.\"\n\n\"정말 엄청나지 않습니까?\""
 gdp_travel_events.2000.a: "적어도 이 #EMP 특이한#! 모습 덕분에 여행자들이 찾아오지 않을까...?"
 gdp_travel_events.2000.b: "그대는 천재 아니면 광인이로군. 그대를 고용하지!"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip],"
 gdp_travel_events.2002.desc: "기쁜 마음으로 알려드립니다. 석공들이 마침내 위엄 있는 [GetBuildingType('tower_of_pisa').GetNameNoTooltip]을 완성했습니다.\n\n하지만 피사에서 다른 특이한 소문을 들었다는 사실도 알려 드려야겠군요. 여행자들이 살면서 #EMP 이런#! 건물은 정말 처음 본다고 이야기하고 있습니다. 아무래도 건설 과정에 무언가 잘못된 게 있던 건 아닌지 걱정됩니다."
 gdp_travel_events.2002.a: "저들의 작품은 내가 직접 보고 판단하겠다."
 gdp_travel_events.2002.b: "꼿꼿이 서 있기만 하다면 상관없다."
