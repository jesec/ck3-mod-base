l_korean:
 culture_notification.0010.t: "버려진 전통"
 culture_notification.0010.desc: "[this_player.GetCulture.GetName] [culture|E]가 [tradition.GetName] [tradition|E]을 버림"
 culture_notification.0011.t: "수용된 전통"
 culture_notification.0011.desc: "[this_player.GetCulture.GetName] [culture|E]가 [tradition.GetName] [tradition|E]을 수용함"
 culture_notification.1001.t: "혼합 문화: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "[founder.GetTitledFirstName](이)가 [parent_1.GetName] 및 [parent_2.GetName] 문화를 바탕으로 [new_culture.GetName|V] [hybrid_culture|E](을)를 형성함"
 culture_notification.1011.t: "[new_culture.GetNameNoTooltip]의 혼합"
 culture_notification.1011.intro: "수년에 걸친 교류로 [parent_1.GetName](와)과 [parent_2.GetName]의 사람들이 매우 가까워졌으며, 그 사이에서 새로운 것이 뿌리를 내리기 시작했다. 자신을 [new_culture.GetName](이)라 부르는 사람들이었다.\n\n"
 culture_notification.1011.blend: "혼합은 명백했다. 이들은 [tradition_1.GetName]의 [parent_1.GetNameNoTooltip] 전통을 [tradition_2.GetName]의 [parent_2.GetNameNoTooltip] 관습과 함께 지켰다. 두 가지 모두 이 새로운 사람들을 정의하는 특성이었다."
 culture_notification.1011.blend_fallback: "부모가 된 두 문화 중 어느 쪽도 우세를 보이지 않았다. [new_culture.GetNameNoTooltip]의 방식은 두 세계를 매끄럽게 합쳐 놓았다."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "[parent_1.GetName](와)과 [parent_2.GetName] [cultures|E]에서 [hybrid_culture|E] [new_culture.GetName](이)가 형성됨"
 culture_notification.1101.t: "분화된 문화: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName](이)가 [parent_1.GetName]의 [divergent_culture|E]인 [new_culture.GetName|V](을)를 창시함"
 culture_notification.1111.t: "[new_culture.GetNameNoTooltip]의 분화"
 culture_notification.1111.intro: "이곳에는 달라진 방언이 있고, 저곳에는 새로운 관습이 생겼다. 처음에는 놓치기 쉬웠다. 하지만 더는 아니다. 이제 [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]의 [parent_1.GetCollectiveNoun](은)는 자신을 [new_culture.GetName](이)라 부른다.\n\n"
 culture_notification.1111.tradition.new: "선조들의 전통이 [new_tradition.GetName]에게 자리를 내어주고 있다."
 culture_notification.1111.tradition.lost: "저들은 [parent_1.GetCollectiveNounNoTooltip]의 [lost_tradition.GetName] 방식을 버렸다."
 culture_notification.1111.ethos.bellicose: "적과 경쟁자에 둘러싸인 [new_culture.GetCollectiveNounNoTooltip]에서 운명을 무력에 맡기는 [new_culture.GetEthos.GetName](이)가 탄생했다."
 culture_notification.1111.ethos.bureaucratic: "[new_culture.GetCollectiveNounNoTooltip](은)는 긴 인가와 그보다 더 길게 적힌 연대기에서 편안함을 느끼는 [new_culture.GetEthos.GetName](으)로 변했다."
 culture_notification.1111.ethos.courtly: "[new_culture.GetCollectiveNounNoTooltip](은)는 예의와 의식에 헌신하며, 이제 [new_culture.GetEthos.GetName]의 방식으로 살아간다."
 culture_notification.1111.ethos.communal: "[new_culture.GetCollectiveNounNoTooltip](은)는 승리와 비극을 함께 나누며, 이웃과 끈끈한 유대로 묶여 있는 [new_culture.GetEthos.GetName](이)가 되었다."
 culture_notification.1111.ethos.stoic: "예측할 수 없는 위험한 세계에서 [new_culture.GetCollectiveNounNoTooltip](은)는 그 무엇보다도 기개를 중시하는 [new_culture.GetEthos.GetName](이)가 되었다."
 culture_notification.1111.ethos.spiritual: "[new_culture.GetCollectiveNounNoTooltip](은)는 내면에서 답을 탐구하며, 그 어느 때보다 독실한 [new_culture.GetEthos.GetName] 사람들이 되었다."
 culture_notification.1111.ethos.egalitatian: "이제 [new_culture.GetCollectiveNounNoTooltip]에서는 공덕을 혈통보다 더 중시한다. 이들은 [new_culture.GetEthos.GetName] 사회를 이루었다."
 culture_notification.1111.ethos.unchanged: "삶을 대하는 관점은 바뀌지 않았으나, 정책과 경계가 나뉘면서 하나였던 사람들이 두 무리가 되었다."
 culture_notification.1111.outro.other: "\n\n간계 때문이든 신념 덕분이든, 이제 이 문화적 각성의 선두에는 [founder.GetTitledFirstName](이)가 서 있다."
 culture_notification.1111.outro.founder: "\n\n[new_culture.GetNameNoTooltip] 사람들은 이제 나를 우러러본다. 우리의 미래는 여기서부터 시작이다."
 culture_notification.1111.a.other: "앞으로 어떤 상황이 펼쳐질지 두고 봐야겠군."
 culture_notification.1111.a.founder: "새로운 시대와 민족을 위하여!"
 culture_notification_tooltip: "[parent_1.GetName] [culture|E]에서 [divergent_culture|E] [new_culture.GetName](이)가 분화됨"
