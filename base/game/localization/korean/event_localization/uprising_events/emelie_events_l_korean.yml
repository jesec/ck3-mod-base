l_korean:
 # Cataclyst event
 blotsven.0001.t: "뜻밖의 방문"
 blotsven.0001.desc: "어느 날, [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)](이)가 밤늦게 내 문을 두드리더니 사람들이 동요하고 있다는 이야기를 전했다. [ROOT.Char.GetTopLiege.GetTitledFirstName](이)가 매년 치르는 블로트를 거부하고 있다. 하지만 이 희생제를 치르지 않으면 불화와 기근이 닥치게 된다! [chaplain.GetSheHe|U]는 이 블로트가 얼마나 중요한지를 강조하며, 사람들이 이번 블로트의 주최자를 [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier]의 진정하고도 정당한 [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip](으)로 여길 거라고 했다.\n\n\"백성을 위해 블로트를 행하시겠습니까?\""
 blotsven.0001.a: "흥미로운 관점이군. 한번 살펴보겠다."
 blotsven.0001.a.tt: "블로트 활동을 시작하고 완료해 명분을 획득함."
 blotsven.0001.b: "하, 어림도 없지!"
 blotsven.0001.b.tt: "신들을 기쁘게 할 수 있는 기회를 저버림"
 # Eskil barges in
 blotsven.0002.t: "날뛰는 전도사"
 blotsven.0002.desc: "블로트가 시작하기 바로 직전이었다. 철의 반지에 대해 맹세하려는데 소란이 일었다. 군중 한 무리가 진입하더니, 비명을 지르는 남자가 우리의 신성한 원으로 끼어들었다.\n\n\"[eskil.GetFaith.HighGodName|U]의 이름으로, 당장 멈춰라!\" 남자가 외치며 두 팔을 미친 듯이 흔들었다.\n\n남자는 두 손을 머리 위로 뻗고, 이 이교도 행위를 하는 사람들에게 천벌을 내려 달라며 하늘을 향해 외쳤다. 그게 명령이라도 되었던 듯 하늘에서 비가 내리기 시작했다. 눈을 깜박이는 순간, 번개 줄기가 하늘을 가로질렀다."
 blotsven.0002.a: "가장 가까이 있는 돌을 집어다가 남자를 향해 던진다."
 blotsven.0002.a.tt: "전도사한테 돌 던지는 거야 흔한 일이지."
 blotsven.0002.b: "도끼를 집어 들고 남자의 머리를 노린다."
 blotsven.0002.b.tt: "이 천둥이야말로 #S 저 사람#!을 벌하는 토르의 일격이다."
 blotsven.0002.c: "왠지 모르게 저 사람의 얘기가 듣고 싶어지는군..."
 blotsven.0002.c.tt: "블로트를 중단하고 [eskil.GetFaith.GetName](으)로 개종함."
 blotsven.0002.toast.m.tt: "[eskil.GetTitledFirstName](이)가 내 손에 불구가 됨."
 blotsven.0002.toast.k.tt: "[eskil.GetTitledFirstName](이)가 내게 살해당함."
 # He missed
 blotsven.0003.t: "분노한 전도사"
 blotsven.0003.desc: "[eskil.GetTitledFirstName](이)가 큰 소리를 지르며 펄쩍 뛰었다. 내 투척이 빗나갔고, 이제 격노한 전도사를 상대해야만 한다."
 blotsven.0003.a: "놈을 죽여라!"
 blotsven.0003.a.tt: "주변 사람들에게 내가 실패한 일의 마무리를 시킨다."
 blotsven.0003.b: "징조인가? 저 사람의 신이 내 신보다 강할지도 모르겠군..."
 blotsven.0003.b.tt: "블로트를 중단하고 [eskil.GetFaith.GetName](으)로 개종함."
 blotsven.0003.toast.tt: "[eskil.GetTitledFirstName](이)가 내 명령으로 처형당함."
 blotsven.0003.toast.desc.tt: "남자의 사람들이 시체를 수습해 투나로 가져감."
 # Ending event
 blotsven.0004.t: "재탄생과 귀환"
 blotsven.0004.desc: "둥글게 모여 있던 사람들은 사라졌으며, 작게 무리를 이루거나 혼자서 언덕을 따라 내려간다. 새로운 [ROOT.Char.GetWomanMan]이 된 기분이다. 왕국을 얻지는 못했을지라도, 내 영혼은 영원히 구원받았다."
 blotsven.0004.a: "이제 집으로 가야겠다."
 gruesome_activity_eskil_slain_title: "에스킬을 살해함"
 gruesome_activity_eskil_slain: "에스킬이 살해당했습니다. 희생을 치른 에스킬은 성자가 되었습니다."
