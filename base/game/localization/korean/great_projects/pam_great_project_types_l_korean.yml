 pam_mass_rite_construct_new_shrines_value_desc: "대상 [duchy|E] 내 [county|E] 하나당 #weak (각 @gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_construct_new_shrines_value')|-0])#!"
 pam_mass_rite_integrate_existing_rituals_value_desc: "대상 [duchy|E] 내 [county|E] 하나당 #weak (각 @gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_integrate_existing_rituals_value')|-0])#!"
 pam_mass_rite_promote_faithful_relocation_value_desc: "대상 [duchy|E] 내 [county|E] 하나당 #weak (각 @gold_icon! [EmptyScope.ScriptValue('pam_mass_rite_promote_faithful_relocation_value')|-0])#!"
 great_project_type_pam_mass_rite_conversion: "대규모 개종"
 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "충분한 자원만 있다면, 우리는 단지 개별 이교도가 아니라 이교 [realms|E] 전체에 주님의 빛을 전할 수 있다. 우리의 가르침을 통해 그들은 가장 올바른 [rite|E]를 배우게 될 것이며, 그에 따라 [christendom|E] 또한 확장될 것이다."
 great_project_type_pam_mass_rite_conversion_desc_generic: "충분한 자원만 있다면, 우리는 흩어진 개종자들을 넘어 적대적인 [faiths|E]들이 아직 지배력을 유지하는 [realms|E] 전체에 우리 신앙의 가르침을 전할 수 있다. 우리의 가르침을 통해 저들의 백성은 올바른 [rite|E]를 배우게 될 것이며, 이는 온 땅에 걸쳐 우리의 세력을 강화할 것이다."
