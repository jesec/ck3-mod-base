l_korean:
 great_project_type_pam_cathedral_01: "$building_type_great_project_cathedral_01$ 건립"
 great_project_type_pam_cathedral_01_desc: "견고한 석조 성벽 위에, 장엄한 돔과 높은 탑 위에 찬란한 십자가를 세워라! 경이로운 천상의 빛을 이 땅으로 불러와 성스러운 고위 성직자의 옥좌와 제단 위에 비추게 하라.\n\n오랜 세월에 걸친 숭고한 노고 끝에, 마침내 거대한 신앙의 등불이 밝혀져 가까이에서든 멀리에서든 찾아오는 신자들을 비출 것이다."
 great_project_type_pam_cathedral_02: "$building_type_great_project_cathedral_02$ 건립"
 great_project_type_pam_cathedral_02_desc: "뾰족한 아치를 높이 세우고 스테인드글라스를 찬란히 빛내라!\n\n라자로처럼 이 장엄한 대성당도 다시 태어나 우리를 새로운 시대로 이끌 것이다."
 great_project_type_pam_cathedral_03: "$building_type_great_project_cathedral_03$ 건립"
 great_project_type_pam_cathedral_03_desc: "섬세한 창살 장식과 굽이치는 석조 장식으로 성스러운 불꽃의 관을 씌워, 영광을 간직해 온 이 건축물에 새로운 시대가 도래했음을 알려라!\n\n오랜 증축 끝에 기존 [GetBuilding('great_project_cathedral_02').GetName|V](은)는 마침내 [GetBuilding('great_project_cathedral_03').GetName|V](으)로 완성될 것이다. 그 첨탑들은 종말의 때를 지나도록 신자들을 인도할 것이다."
