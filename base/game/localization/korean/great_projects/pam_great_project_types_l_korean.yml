 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$: [province.GetNameNoTooltip]의 성화 프레스코"
 pam_great_projects_events.0002.desc: "사제들은 하느님의 말씀을 연구할지라도, 주님의 진리와 영광을 신도들에게 전하는 것은 성스러운 성화다.\n\n필요한 자금이 충족되고 성화 화가들이 모였으니, 이제 아치와 벽, 천장을 장식할 성경 속 장면을 결정해야 한다."
 pam_great_projects_events.0002.a: "그리스도의 탄생을 경배하는 동방박사 세 사람."
 pam_great_projects_events.0002.b: "사자와 함께 광야에 있는 성 예로니모."
 pam_great_projects_events.0002.c: "이집트를 떠나 가나안으로 향하는 아브라함과 롯."
 pam_great_projects_events.0002.d: "복되신 동정 마리아께 전해진 수태고지."
 pam_great_projects_events.0002.e: "주님에 대한 지식으로 불타오르는 성 아우구스티누스의 심장."
 pam_great_projects_events.0002.f: "사도들의 발을 씻는 그리스도."
 pam_great_projects_events.0002.mystic_xp: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]을 가진 인물에게 추가 [trait_level_track_xp|E]를 제공하게 됨"
 pam_great_projects_events.0002.scholar_xp: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]을 가진 인물에게 [trait_level_track_xp|E]를 제공하게 됨"
 pam_great_projects_events.0002.pilgrim_xp: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]을 가진 인물에게 [trait_level_track_xp|E]를 제공하게 됨"
 pam_great_projects_events.0002.piety: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 @piety_icon![piety|E]을 제공하게 됨"
 pam_great_projects_events.0002.learning_xp: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]이 신자들에게 @skill_learning_icon![learning|E] [lifestyle_experience|lE] 및 [spiritual_fulfillment|E]을 제공하게 됨"
 pam_great_projects_events.0002.stress_loss: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 @stress_loss_icon![stress_loss|E]를 제공하게 됨"
 cathedral_stained_glass_contributor_tt: "당신이 [GetPrestigeLevelName('(int32)2')] [prestige_level|E] 이상, [GetPietyLevelName('(int32)3')] [piety_level|E] 이상, 또는 [kingdom|E] 등급 [title|E]를 보유함"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: [province.GetNameNoTooltip](을)를 물들이는 빛"
 pam_great_projects_events.0003.desc: "\"#EMP 빛나는 것은 빛나는 것과 밝게 어우러져 빛나며, 새로운 빛이 가득 스며든 이 고귀한 작품 또한 찬란히 빛이 나겠지.#!\" [religion_buddy.GetTitledFirstName](이)가 햇빛에 반짝이는 재단 유리를 바라보며 말한다.\n\n유리 장인 [glazier.GetTitledFirstName](은)는 우리가 여러 도안을 더 자세히 살펴볼 수 있도록 회칠한 탁자 위에 [Glossary('도가니 착색 유리','POT_METAL_GLOSS')] 조각들을 펼쳐 놓았다.\n\n나는 선언한다. \"이 창은 본당에서도, [province.GetNameNoTooltip] 어디에서도 보일 테니 반드시 다음 내용을 묘사해야 한다...\""
 pam_great_projects_events.0003.a: "[ROOT.Char.GetDynastyNameNoTooltip]의 정통성을 뒷받침하도록 이새의 나무."
 pam_great_projects_events.0003.a.flavor: "[Glossary('이새의 나무','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]이 [travel|E] 지도자로서 방문하는 [dynasty|E] 구성원에게 @dynasty_prestige_icon![dynasty_prestige|E]을 제공하게 됨"
 pam_great_projects_events.0003.b: "당신의 초상화와 문장이 들어간 기증판."
 pam_great_projects_events.0003.b.tt: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 방문객들에게 @prestige_icon![prestige|E]을 제공하게 됨"
 pam_great_projects_events.0003.c: "먼 곳의 신자들을 모을 수 있도록, 순례자의 기적을 그린 장면들."
 pam_great_projects_events.0003.c.tt: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]을 가진 인물에게 추가 [trait_level_track_xp|E]를 제공하게 됨"
 pam_great_projects_events.0003.d: "성모 마리아를 그린 창, 그 앞에는 꺼지지 않는 등불."
 pam_great_projects_events.0003.d.flavor: "그는 유리에 새긴 [blessed_mary.GetTitledFirstName]의 성화 앞에 기름등과 촛불을 항상 밝혀 둘 것이다."
 pam_great_projects_events.0003.d.tt: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]이 @stress_loss_icon![stress_loss|E] 및 [spiritual_fulfillment|E]을 제공하게 됨"
 pam_great_projects_events.0003.d.dulia.tt: "[GetTenetType('tenet_dulia').GetBaseName](을)를 [personal_tenet|E]로 삼고 있으면 방문 시 더 많은 [spiritual_fulfillment|E]을 획득함"
 pam_great_projects_events.0003.e: "왕의 손에 순교하는 과정을 담은 연작."
 pam_great_projects_events.0003.e.tt: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 열광적인 방문객에게 @piety_icon![piety|E] 및 @stress_loss_icon![stress_loss|E]를 추가로 부여함."
 pam_great_projects_events.0003.e.owner_msg.title: "유리에 새긴 순교"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName](이)가 [grand_cathedral|E]에 설치할 순교 장면의 스테인드글라스 연작을 의뢰했습니다. 그 장면들은 당신에게 더욱 깊은 신심을 불러일으킵니다."
 TREE_OF_JESSE_GLOSS: "이새의 나무는 다윗의 아버지 이새가 누워 있는 모습에서 뻗어 나오는 그리스도의 계보를 묘사합니다. 교회의 스테인드글라스 창에는 성경 속 왕가의 계보를 당대의 왕조와 연관 지어 묘사하여 왕권의 신성함을 나타내기도 했습니다. 대표적인 사례는 샤르트르와 생드니에서 찾아볼 수 있습니다."
 POT_METAL_GLOSS: "도가니 착색 유리는 용융 도가니에서 유리 원료에 금속 산화물을 섞어 착색합니다. 따라서 색이 표면에만 입혀지는 것이 아니라 유리판 전체에 배어 있습니다. 숙련된 유리 장인, 즉 비트레아리우스는 식힌 유리판을 조각으로 잘라 회칠한 판 위에 늘어놓고 빛이 어떻게 비치는지 살펴본 뒤, 납테를 둘러 창을 완성했습니다."
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: 최초의 반석"
 pam_great_projects_events.0005.desc.intro: "첫 주춧돌이 놓였다! 도토리가 자라나 참나무가 되듯, [owner.GetTitledFirstName]의 주교좌는 사람들에게 신앙심을 일깨우는 기념비로 성장할 것이다. 돌 하나하나와 목재 하나하나가 [owner.GetPrimaryTitle.GetNameNoTier](와)과 더 넓은 기독교 세계의 모든 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]에게 [ROOT.Char.GetFaith.HighGodName]의 영광을 드러내리라.\n\n건축 자금을 아낌없이 지원한 [CharMyFirstNames(founder)|U]의 관대함은 종소리를 타고 퍼져 모든 예배자의 입에 오르내릴 것이다."
 pam_great_projects_events.0005.desc.contributor: "\n\n특히 [optional_contributor.GetTitledFirstNamePossessive] [contribution.GetName] 기여는 우리의 [cathedral_building.GetName](을)를 더욱 불멸의 존재로 만들 것이다."
 pam_great_projects_events.0005.desc.outro: "위대한 공사를 시작하자!"
 pam_great_projects_events.0005.a: "\"그 완성은 우리 아이들이 보게 될 것이다.\""
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: 신성한 질서에 따른 설계"
 pam_great_projects_events.0006.desc.intro_architect: "나의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName](이)가 가리킨 곳에는"
 pam_great_projects_events.0006.desc.intro_no_architect: "내가 바라보는 저 앞에서는"
 pam_great_projects_events.0006.desc.intro: "일렬로 박힌 나무 말뚝 사이로 밧줄이 팽팽하게 이어져 거대한 십자가 윤곽을 그리고 있다. 앞으로 들어설 십자형 건물의 모습이 눈앞에 펼쳐진다."
 pam_great_projects_events.0006.desc.steward_founder: "\n\n공부하면서 이 방식을 본 적이 있다!\n\n\"그대들은 필시 $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n\"하지만 이토록 장대한 건축물을 어떻게 설계하는 것이오?\" 내가 묻는다."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n\"우린 $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "[Glossary('아드 쿠아드라툼','AD_QUADRATUM_GLOSS')]을 사용하고 있소! 주께서 우리에게 신성한 질서를 내려 주셨으니, 정사각형을 이용하면 그 어떤 [ROOT.Char.Custom('ResidenceBuilding')]보다도 장대한 건물을 지을 수 있는 비례를 산출할 수 있다고 하오.\""
 pam_great_projects_events.0006.desc.foundations: "\n\n곧 토대를 마련하기 위한 굴착이 시작될 것이다."
 pam_great_projects_events.0006.a: "[founder.GetDynastyNameNoTooltip] 선조들을 위한 지하 묘실을 파자."
 pam_great_projects_events.0006.a.tt: "[founder.GetDynastyName] [dynasty|E]을 기리는 [GetDomicileBuilding('cathedral_crypt_01').GetName|V]이 [owner.GetShortUINamePossessive] [cathedral_complex|E]에 건설됨"
 pam_great_projects_events.0006.b: "순례자들을 수용할 수 있도록 본당을 확장하자."
 pam_great_projects_events.0006.b.tt: "[grand_cathedral|E]이 완공되면, 해당 [point_of_interest|E]은 방문하는 순례자들에게 더 많은 [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait_level_track_xp|E] 및 @piety_icon![piety|E]를 제공하게 됨"
 pam_great_projects_events.0006.c: "이 일은 오직 주님께서만 이끄실 수 있다."
 AD_QUADRATUM_GLOSS: "#EMP 아드 쿠아드라툼#!은 \"정사각형 방식\"을 뜻하는 라틴어입니다. 중세 석공 장인들은 간단한 비례 체계를 이용해 건축 부지에 건물의 평면을 잡았습니다. 이들은 정사각형의 한 변과 대각선 사이의 비율을 이용했습니다. 두 길이를 각각 변으로 삼은 직사각형은 조화로운 형태를 이룬다고 여겨졌습니다. 석공은 이 하나의 기본 단위에서 크고 작은 정사각형과 직사각형을 연속으로 도출하여, 설계의 각 부분이 서로 정확하게 맞물리도록 할 수 있었습니다."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: 솟구치는 천상의 늑골"
 pam_great_projects_events.0007.desc.intro_architect: "나의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName](이)가 거대한 들보의 숲 사이로 나를 안내한다. 대성당의 비계는 그 자체로 하나의 목조 교회처럼 우뚝 서서, 석조 궁륭을 만드는 데 여념이 없는 석공들을 받치고 있다."
 pam_great_projects_events.0007.desc.intro_no_architect: "나는 거대한 들보의 숲 사이를 걷는다. 대성당의 비계는 그 자체로 하나의 목조 교회처럼 우뚝 서서, 궁륭을 만드는 석공들을 받치고 있다."
 pam_great_projects_events.0007.desc.architect: "\n\n\"이 궁륭들이 완성되면 신자들을 비바람으로부터 보호하고, 우리의 기도를 드높은 천상으로 인도할 것입니다.\""
 pam_great_projects_events.0007.desc.architect_says: "[architect.GetSheHe]가 말했다."
 pam_great_projects_events.0007.desc.outro: "\n\n완성된 궁륭 한 구획에 시선이 닿는다. 그 모습에서 요나를 삼킨 거대한 물고기의 늑골이 떠오른다. 하느님의 집이 이토록 영광스러우니 그 아래에서는 바닷속으로도 별들 사이로도 옮겨진 듯한 기분을 느낄 수 있다."
 pam_great_projects_events.0007.a: "궁륭을 밤하늘로 장식하자."
 pam_great_projects_events.0007.a.tt: "[grand_cathedral|E]이 완공되면 해당 [point_of_interest|E]이 [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]을 보유한 인물에게 더 많은 [trait_level_track_xp|E]를 제공하게 됨"
 pam_great_projects_events.0007.b: "요나처럼 회개할 것을 설교하자."
 pam_great_projects_events.0007.b.tt: "당신의 [faith|E]이 @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [fervor|E]을 획득함"
 pam_great_projects_events.0007.c: "석공들이 일을 계속하게 두자."
 fervor_gain_cathedral_jonah_sermon: "[grand_cathedral|E] 건설 현장에서 회개를 설교함"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: 주님의 목소리를 주조하다"
 pam_great_projects_events.0008.desc.intro: "건설은 순조롭게 진행되고 있지만, 대성당에는 아직 [owner.GetPrimaryTitle.GetNameNoTier] 전역의 신자들을 불러 모을 목소리가 없다."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName](은)는 거대한 청동 종을 주조해야 한다고 내게 말한다!"
 pam_great_projects_events.0008.desc.no_architect: "\n\n그러니 종을 주조해야 한다!"
 pam_great_projects_events.0008.desc.need_bell: "위험하고도 막대한 비용이 드는 작업이다. [founder.GetPrimaryTitle.GetNameNoTier]의 금고는 원자재 비용만으로도 벌써 휘청이고 있다."
 pam_great_projects_events.0008.desc.plague_named: "\n\n안타깝게도 종 제작자는 [epidemic.GetName]에 의해 목숨을 잃었다."
 pam_great_projects_events.0008.desc.plague_generic: "\n\n안타깝게도 종 제작자는 최근 역병으로 목숨을 잃었다."
 pam_great_projects_events.0008.desc.outro: "그의 아들 [bell_maker_son.GetFirstName](은)는 아버지의 임종을 지키며 비전의 기술을 전수받았으며, 자신이 종을 주조할 수 있다고 나를 안심시킨다."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n지역 장인 밑에서 수련한 야심 찬 젊은 청동 제작자 [bell_maker_son.GetFirstName](이)가 나섰다. [bell_maker_son.GetSheHe|U]는 [owner.GetPrimaryTitle.GetNameNoTier]의 [cathedral_building.GetName]에 걸맞은 종을 주조해 자신의 능력을 증명하고자 한다."
 pam_great_projects_events.0008.a: "실패하면 죽이겠다."
 pam_great_projects_events.0008.a.tt: "주조에 실패하면 당신이 [bell_maker_son.GetShortUIName](을)를 처형하게 됨"
 pam_great_projects_events.0008.belltower_may.tt: "[owner.GetShortUINamePossessive] [cathedral_complex|E]에 [GetDomicileBuilding('cathedral_belltower_02').GetName|V]를 건설할 수 있음"
 pam_great_projects_events.0008.aa: "실패하면 온몸의 살가죽을 벗겨 버리겠다."
 pam_great_projects_events.0008.b: "그가 주님의 도구가 될지도 모른다."
 pam_great_projects_events.0008.b.tt: "[bell_maker_son.GetShortUIName](이)가 종을 주조할 수 있으리라 믿음"
 pam_great_projects_events.0008.b.flavor: "다윗이 골리앗을 쓰러뜨렸을 때도 그저 어린 목동에 불과하지 않았던가?"
 pam_great_projects_events.0008.c: "장인의 아들이 아니어도 좋으니, 실력이 검증된 사람을 찾자."
 pam_great_projects_events.0008.duel.success: "주조 성공! [owner.GetShortUINamePossessive] [cathedral_complex|E]에 [GetDomicileBuilding('cathedral_belltower_02').GetName|V]가 건설될 예정입니다"
 pam_great_projects_events.0008.duel.failure: "주조 실패... 이제 어떻게 할지 결정해야 합니다"
 pam_cathedral_bell_casting_duel: "[CHARACTER.GetShortUINamePossessive|U] [learning|E]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: 그리고 주님께서 말씀하셨다"
 pam_great_projects_events.0009.desc.body: "나는 [bell_maker_son.GetFirstName](이)가 이리저리 뛰어다니며 일꾼들을 지휘하는 모습을 지켜본다.\n\n[bell_maker_son.GetSheHe|U]은(는) 끊임없이 아버지의 옛 작업자들에게 이의를 제기하며, 주조 구덩이의 위치와 주형에 쓸 적절한 점토를 고르는 일부터 용광로를 가동하는 일까지 자신의 방식을 고집한다."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName](와)과 나는 [bell_maker_son.GetFirstName](이)가 이리저리 뛰어다니며 일꾼들을 지휘하는 모습을 지켜본다.\n\n[bell_maker_son.GetSheHe|U]는 끊임없이 아버지의 옛 작업자들의 말을 반박하고 그들에게 이의를 제기하며, 주조 구덩이의 위치와 주형에 쓸 적절한 점토를 고르는 일부터 용광로를 가동하는 일까지 자신의 방식을 고집한다."
 pam_great_projects_events.0009.desc.success_end: "\n\n녹아내린 청동이 마치 하느님의 손길에 이끌리듯 주형 안으로 순조롭게 흘러들어 가고, 온전한 종으로 모습을 드러낸다. 종을 들어 올리자, 모든 [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]에게 들리도록 우렁찬 부름을 울린다.\n\n\"주님의 집으로 오라!\""
 pam_great_projects_events.0009.a: "[province.GetNameNoTooltip]의 [province.Custom('GetTerrainType')|l]에 주님의 목소리가 울려 퍼지게 하라."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: 파멸을 알리는 전조!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\n녹아내린 청동이 주형 안에서 비명을 지르지만, 그나마 온전한 종으로 모습을 드러낸다. 종을 들어 올린 뒤 당겨 놓는다. 그러나 추가 타종부를 때리자 둔탁한 소리만 들린다. 뒤이어 쩍 하고 금이 가는 소리가 난다. 파멸을 알리는 전조다!"
 pam_great_projects_events.0010.a: "약속은 지켜야 한다."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U](이)가 처형됨"
 pam_great_projects_events.0010.b: "금이 간 종만으로도 충분한 벌이다."
 pam_great_projects_events.0010.b.faith: "주님께서는 아직 저자에게 맡기실 뜻이 있으시다."
 pam_great_projects_events.0010.c: "청동을 녹여라. 더 날카로운 것을 만들어라."
 pam_great_projects_events.0010.c.tt: "금이 간 종을 녹여 고문 도구로 다시 주조하고, [bell_maker_son.GetShortUIName](을)를 그 첫 희생자로 삼음. 앞으로 [founder.GetCapitalLocation.GetNameNoTooltip]의 장인들은 순종이 무엇인지 알게 될 것임."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "당신이 대신 [intrigue_lifestyle|E] [experience|E]를 획득함"
 pam_great_projects_events.0010.d: "이번 일을 겸손의 교훈으로 삼자."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: 마치 주님의 손길처럼"
 pam_great_projects_events.0011.desc.intro: "[province.GetNameNoTooltip]의 [cathedral_building.GetName] 건설 현황을 살피던 중, 회전하는 거대한 목조 구조물에서 나는 날카로운 마찰음이 귀를 때린다."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName](은)는 일꾼 두 명이 안에서 걷고 있는 거대한 답차를 가리킨다."
 pam_great_projects_events.0011.desc.no_architect: "\n\n소음의 근원을 찾아보니, 일꾼 두 명이 안에서 걷고 있는 거대한 답차가 보인다."
 pam_great_projects_events.0011.desc.outro: "\n\n마치 하느님의 손길이라도 닿은 듯, 답차에 연결된 밧줄과 도르래가 갓 다듬은 거대한 [Glossary('마름돌','ASHLAR_GLOSS')] 덩어리와 모르타르 양동이를 공사 중인 지붕까지 들어 올린다. 아래 작업장에서 인부들이 직접 날랐다면 허리가 휘었을 엄청난 짐을 경외심에 차 바라본다."
 pam_great_projects_events.0011.a: "우리 [founder.GetCulture.GetCollectiveNounNoTooltip]들은 이 거대한 바퀴에서 배울 수 있는 모든 것을 배워야 한다."
 pam_great_projects_events.0011.a.tt: "당신의 [culture|E]가 현재 [cultural_fascination|E]에 대해 @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#!의 진행도를 획득함"
 pam_great_projects_events.0011.b: "[founder.GetCapitalLocation.GetNameNoTooltip]의 수많은 공사에 이 장치가 도움이 되겠군!"
 pam_great_projects_events.0011.c: "대단하긴 하지만, 이런 일은 주님의 위업으로 맡기도록 하자."
 ASHLAR_GLOSS: "마름돌은 정확한 치수로 자르고 다듬어 네모반듯하고 매끈하게 가공한 석재입니다. 대성당을 짓는 데 필요한 높이까지 돌을 들어 올린 뒤 서로 정확히 맞물리게 하려면 사전에 치밀하게 계획해야 했습니다."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: 더 높은 부름"
 pam_great_projects_events.0013.desc: "머리 위에서 목수들의 나무망치 소리가 둔탁하게 울려 퍼진다. 머지않아 주님의 말씀이 이곳에서 신자들을 휘감을 울림을 미리 들려주는 듯하다.\n\n[architect.GetFirstName](이)가 설명한다. \"참사회원들이 전례를 이끌 소박한 노래석을 만들 겁니다. 바로 우리만의 [Glossary('칸토리아','CANTORIA_GLOSS')]이지요! 사람에게 말할 때와 주님께 아뢸 때는 다른 목소리를 내야 하지 않겠습니까.\" [architect.GetSheHe|U]는 곧바로 어린 성가대원 [choir_boy.GetFirstName](을)를 앞으로 부른다.\n\n그 아이는 비계를 재빠르게 올라가 천사 같은 음성을 내뿜는다. 소리가 벽을 타고 울려 퍼져 내 몸속으로 파고들자, 마치 주님께서 나를 관통해 지나가신 듯하다."
 pam_great_projects_events.0013.a: "단을 더 넓혀라. 목소리는 많으면 많을수록 좋다."
 pam_great_projects_events.0013.b: "이 천사를 내 궁정에 데려와야겠다."
 pam_great_projects_events.0013.castrato: "이 목소리를 주님의 성가대 연단에 바치도록 보존하라."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U]의 변성을 막기 위해 거세함"
 pam_great_projects_events.0013.c: "이런 연출은 내 돈을 더 뜯어내려는 수작이다!"
 pam_great_projects_events.0013.d: "벅차오르는 감정을 견딜 수 없으니 이만 물러나야겠다."
 CANTORIA_GLOSS: "칸토리아는 교회 내부의 높은 곳에 설치된 발코니로, 흔히 성가대석 위나 교차부 근처에 자리했습니다. 성가대가 이곳에서 전례를 이끌었으며, 후대에는 오르간도 사용되었습니다."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: 변함없는 주님의 사랑"
 pam_great_projects_events.0012.desc: "서쪽 정면이 완성되었다! 이제 정문은 [Glossary('배랑','NARTHEX_GLOSS')]을 지나 들어올 신자들을 맞이할 준비가 되었다. [cathedral_building.GetName](을)를 완공하는 데는 평생이 걸릴지도 모르지만, [owner.GetPrimaryTitle.GetNameNoTier]의 선량한 그리스도인들은 앞으로도 변함없이 이어질 주님의 사랑을 믿어야 한다. 나는 설교를 시작한다...\n\n#EMP \"[ROOT.Char.Custom('RandomBibleQuote')]\"#!\n\n...이 성경 말씀을 교훈으로 남겨 주리라."
 NARTHEX_GLOSS: "배랑은 교회의 서쪽 출입문과 신랑 사이에 자리한 전실입니다. 신자들은 이곳을 지나 성스러운 공간으로 들어갔으며, 엄격한 전례를 따르는 교회에서는 참회자와 예비 신자를 미사에 참여한 일반 신자들과 분리해 머물게 하기도 했습니다."
 pam_great_projects_events.0012.a: "\"화평케 하는 자는 복이 있나니...\""
 pam_great_projects_events.0012.a.flavor: "\"[Glossary('...저희가 하나님의 아들이라 일컬음을 받을 것임이요.','MATTHEW_5_9_GLOSS')]\""
 pam_great_projects_events.0012.a.tt: "[owner.GetPrimaryTitle.GetNameNoTier]의 모든 [owner.GetFaith.GetAdjective] [Concept( 'county', '영지' )|E]가 #V 10년#! 동안 [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]를 획득함\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "\"게으른 자여 개미에게로 가서...\""
 pam_great_projects_events.0012.b.flavor: "\"[Glossary('...그 하는 것을 보고 지혜를 얻으라.','PROVERBS_6_6_GLOSS')]\""
 pam_great_projects_events.0012.b.tt: "[owner.GetPrimaryTitle.GetNameNoTier]의 모든 [owner.GetFaith.GetAdjective] [Concept( 'county', '영지' )|E]가 #V 10년#! 동안 [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]를 획득함\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "\"형제들아 내가 우리 주...\""
 pam_great_projects_events.0012.c.flavor: "\"[Glossary('...예수 그리스도의 이름으로 너희를 권하노니 다 같은 말을 하고 너희 가운데 분쟁이 없이 같은 마음과 같은 뜻으로 온전히 합하라.','1_CORINTHIANS_1_10_GLOSS')]\""
 pam_great_projects_events.0012.c.tt: "[owner.GetPrimaryTitle.GetNameNoTier]의 모든 [owner.GetFaith.GetAdjective] [Concept( 'county', '영지' )|E]가 #V 10년#! 동안 [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]를 획득함\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "\"항상 기뻐하라, 쉬지 말고 기도하라...\""
 pam_great_projects_events.0012.d.flavor: "\"[Glossary('...범사에 감사하라 이는 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라. 성령을 소멸치 말며. 예언을 멸시치 말라.','1_THESSALONIANS_5_16_20_GLOSS')]\""
 pam_great_projects_events.0012.d.tt: "[owner.GetPrimaryTitle.GetNameNoTier]의 모든 [owner.GetFaith.GetAdjective] [Concept( 'county', '영지' )|E]가 #V 10년#! 동안 [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]를 획득함\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "\"이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니...\""
 pam_great_projects_events.0012.e.flavor: "\"[Glossary('모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 경주하며.','HEBREWS_12_1_GLOSS')]\""
 pam_great_projects_events.0012.e.tt: "[owner.GetPrimaryTitle.GetNameNoTier]의 모든 [owner.GetFaith.GetAdjective] [Concept( 'county', '영지' )|E]가 #V 10년#! 동안 [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V]를 획득함\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "\"그는 간곤한 자에게 손을 펴며...\""
 pam_great_projects_events.0012.f.flavor: "\"[Glossary('...궁핍한 자를 위하여 손을 내밀며.','PROVERBS_31_20_GLOSS')]\""
 pam_great_projects_events.0012.f.tt: "[owner.GetPrimaryTitle.GetNameNoTier]의 모든 [owner.GetFaith.GetAdjective] [Concept( 'county', '영지' )|E]가 #V 10년#! 동안 [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V]를 획득함\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak [archdiocese|E] 내 [owner.GetFaith.GetAdjective] [rulers|E]들이 더 명예롭고 자비롭게 [behave|E]하게 됨#!#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak [archdiocese|E] 내 [owner.GetFaith.GetAdjective] [rulers|E]들이 더 근면하고 활발하게 [behave|E]하게 됨#!#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak [archdiocese|E] 내 [owner.GetFaith.GetAdjective] [rulers|E]들이 더 사교적이고 명예롭게 [behave|E]하게 됨#!#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak [archdiocese|E] 내 [owner.GetFaith.GetAdjective] [rulers|E]들이 더 자비롭고 덜 탐욕스럽게 [behave|E]하게 됨#!#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak [archdiocese|E] 내 [owner.GetFaith.GetAdjective] [rulers|E]들이 신앙에 더 열광적이고 대담하게 [behave|E]하게 됨#!#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak [archdiocese|E] 내 [owner.GetFaith.GetAdjective] [rulers|E]들이 더 열광적이고 활기차게 [behave|E]하게 됨#!#!"
 pam_cathedral_west_portal_sermon_toast: "[owner.GetPrimaryTitle.GetNameNoTier]의 대성당 설교"
 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: 첨탑의 완성"
 pam_great_projects_events.0020.desc: "마침내 첨탑마다 십자가가 세워졌다. 오래전 그 언덕 위 [Glossary('골고다','GOLGOTHA_GLOSS')]에서 그리스도께서 지셨던 십자가와도 같은 모습이다. 그것들은 우리를 구원하시기 위해 겪으신 그분의 고난을 일깨우는 표식이자, 매 안식일마다 흘러나와 우리의 죄를 씻어 줄 그분의 피에 대한 약속으로 우뚝 서 있다.\n\n공사가 시작된 이래로 아들은 아버지가 되었고, 아버지는 늙어 결국 땅속에 묻혔다. 그러나 그들의 고귀한 노동과 땀, 그리고 피는 돌 속에 영원히 새겨졌다.\n\n제국은 몰락할지라도, [province.GetName]의 [cathedral_building.GetName](은)는 주님의 사랑과 함께 영원히 남을 것이다."
 pam_great_projects_events.0020.a: "가까운 곳에서든 먼 곳에서든, 우리 곁에서 함께 예배하라!"
 GOLGOTHA_GLOSS: "골고다는 라틴어 #EMP Calvariae locus#!, 즉 '해골의 장소'에서 유래한 이름으로, 로마 시대 예루살렘에 있던 해골 모양의 언덕이자 예수의 십자가형이 이루어진 장소였다. 처형은 성벽 바깥, 그가 묻힌 무덤에서 멀지 않은 곳에서 이루어졌다. 현재 이 장소는 [GetBuilding('dome_of_the_rock_01').GetName|V] 인근의 성묘 교회 안에 자리하고 있다."
 poi_grand_cathedral_visit: "[province.GetNameNoTooltip]의 대성당 방문"
