 ## Event - the duel
 carnival.1010.t: "결투"
 carnival.1010.desc: "가면을 쓴 두 이방인이 맞서기 시작했다. 군중이 공간을 만들자 두 결투자는 서로를 바라보며 원을 그리기 시작했고, 칼을 뽑았다! 이들의 눈에는 증오가 가득했다. 단순히 피를 약간 보는 것만으로는 끝나지 않을 것 같았다."
 carnival.1010.a.desc: "\n\n나는 그저 군중 속의 또 다른 가면 쓴 사람이 되어 지켜보았다."
 carnival.1010.b.desc: "나를 알아차린 군중은 내가 개입할지 말지 궁금해하는 눈치였다."
 carnival.1010.a: "경비대를 불러 결투를 해산시킨다."
 carnival.1010.b: "이들을 설득해 멈추게 한다."
 carnival.1010.c: "이들에게 명령해 멈추게 한다."
 carnival.1010.d: "결투를 진행해라."
 cooltip.carnival.1010_duel_diplomacy_success: "결투를 막음"
 cooltip.carnival.1010_duel_diplomacy_fail: "결투를 막지 못함"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName](이)가 결투에서 패배했으며 다치거나 사망할 수 있음."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName](이)가 결투에서 패배했으며 다치거나 사망할 수 있음."
 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName](이)가 결투에서 승리함"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName](이)가 결투에서 승리함"
 carnival.1010_duel_guards_success.desc: "경비대가 달려옴"
 carnival.1010_duel_guards_fail.desc: "경비대가 너무 늦음"
 carnival.1010_duel_guards_success_toast: "경비대가 결투를 중단시킴"
 carnival.1010_duel_guards_failure_toast: "경비대가 너무 늦어 결투를 중단시키지 못함"
 carnival.1010_duel_diplomacy_success_toast: "결투를 막았음"
 carnival.1010_duel_diplomacy_fail_toast: "결투를 막지 못했음"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName](이)가 결투에서 다침"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName](이)가 결투에서 살해당함"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName](이)가 결투에서 다침"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName](이)가 결투에서 살해당함"
 carnival.1010.duel_stop.log_title: "결투를 막음"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip](이)가 [duelist_01.GetFirstNameNoTooltip](와)과 [duelist_02.GetFirstNameNoTooltip] 사이의 결투를 막았음"
 carnival.1010.duel_continue.log_title: "결투를 막지 못함"
 carnival.1010.duel_continue.log: "[carnival_main.GetShortUIName|U](이)가 [duelist_01.GetShortUIName](와)과 [duelist_02.GetShortUIName] 사이의 결투를 막지 못했음"
 ## Event - Gracious Host
 carnival.1011.t: "자애로운 주최자"
 carnival.1011.desc: "카니발은 내 궁의 문을 사람들에게 열어, 나의 부와 취향을 보여줄 완벽한 기회다. [house_member01.GetFirstNameNoTooltip](와)과 함께 이 점에 대해 논의하던 나는 누구를 초대할지 고민했다. [house_member01.GetSheHe|U]가 좋은 제안을 해 주긴 했다. 하지만 최종 결정은 나의 몫이다."
 carnival.1011.a: "궁 전체를 장식하고 비용을 아끼지 말아라!"
 carnival.1011.b: "빈곤한 자들에게 문을 열어라!"
 carnival.1011.c: "가장 저명한 문객만 초대하라!"
 carnival.1011.d: "대식구만 초대하는 것으로 하라."
 ## Event - Puppet theater
 carnival.1012.t: "꼭두각시 극장"
 carnival.1012.desc: "평민들은 꼭두각시 극장을 무척 좋아하며, 익살과 외설스러운 공연에 넋을 잃는다. 기괴한 꼭두각시 인형은 사회 각계각층을 풍자하며 간음하고, 싸우고 다투며 온갖 희한한 싸움에 휘말린다.\n\n[carnival_location.GetName]의 카니발은 이런 꼭두각시 인형사들을 끌어들였고, 백성들은 이들을 좋아한다. 그러나 [carnival_host.GetFaith.PriestNeuterPlural]들은 이 저속한 유흥을 걱정하고 있다."
 carnival.1012.a: "공연을 몰래 관람해야겠다."
 carnival.1012.b: "극단을 매수해 나만의 공연을 만들게 해야지!"
 carnival.1012.c: "공연을 공개적으로 관람하겠다!"
 carnival.1012.d: "무대 뒤에서 재주꾼들을 몰래 질책한다."
 carnival.1012.e: "이런 저속한 공연은 금지해야 한다."
 ## Event - The Mask Maker
 carnival.1013.t: "가면 제작자"
 carnival.1013.desc: "사람이 거의 빠진 안뜰을 지나가던 나는 나이든 [mask_maker.GetWomanMan]이 가면을 만드는 모습을 보았다. [mask_maker.GetHerHim]의 옆에는 작품이 가득한 가판대가 있었는데, 온갖 종류의 가면이 줄지어 놓여 있었다.\n\n참으로 훌륭한 솜씨였다."
 carnival.1013.a: "전부 다 사서 만나는 사람마다 나눠 줘야겠군!"
 carnival.1013.b: "가면 제작자에게 공방을 차릴 자금을 지원한다."
 carnival.1013.c: "날 위한 멋진 가면을 산다."
 carnival.1013.d: "날 위한 무시무시한 가면을 산다."
 carnival.1013.maskmaker_workshop.log_title: "가면 제작자의 공방에 투자함"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName](이)가 가면 제작자가 공방을 차릴 수 있도록 도와주었음"
 ## Event - Holy Fools
 carnival.1014.t: "신성한 광대"
 carnival.1014.desc: "신성한 행렬의 풍자가 거리를 따라 이어지고 있었다. 사제, 수도사, 심지어 우리 신앙에서 가장 드높은 지도자까지 희화화한 복장이었다! 성직자를 대놓고 조롱하는 행렬이었다."
 carnival.1014_2.a.desc: "\n\n나는 군중 속에 모습을 숨기고 있었다."
 carnival.1014_2.b.desc: "\n\n사람들이 반응을 기다리듯 나를 쳐다보았다."
 carnival.1014.a: "몰래 경비대를 불러 이 희화화 행렬을 해산시킨다."
 carnival.1014.b: "저들의 죄악을 비난한다!"
 carnival.1014.c: "조롱에 합류한다."
 carnival.1014.d: "군중 속으로 조용히 빠져나간다."
 carnival.1014.e: "이렇게 웃어 보는 게 몇 년 만인지!"
 cooltip.carnival.1014.non_believer: "#weak #EMP 당신의 불신자 [secret|E]로 인해 [stress|E] 감소#!#!"
 carnival.1014.secret.tt.toast: "당신은 자신이 사실 불신자였다는 사실을 깨달음"
 carnival.1014.mockery.tt.toast: "죄책감과 안도감을 모두 느낌"
 ## Event - The Cat
 carnival.1015.t: "고양이"
 carnival.1015.desc: "저녁 내내 작은 그림자가 나를 따라다녔다. 모퉁이를 돌 때마다 눈 두 개가 반짝이며 거칠게 #EMP \"야옹\"#! 하는 소리가 들렸다.\n\n\"친구를 만드신 것 같군요.\" [observer_01.GetTitledFirstName](이)가 이 사실을 지적하며 웃음을 터뜨렸다. 고양이가 또 내 다리에 몸을 문지르고 있었다."
 carnival.1015.a: "이렇게 될 운명이었나 보군!"
 carnival.1015.b: "분명 저쪽도 너하고 더 오래 있고 싶어 할 거다."
 carnival.1015.c: "[family_member01.GetTitledFirstName]에게 반려동물이 필요할 것 같군."
 carnival.1015.adopt_cat.log_title: "고양이를 입양함"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName](이)가 고양이를 입양했음"
 ## Event - Lover's mask
 carnival.1016.t: "연인의 가면"
 carnival.1016.desc: "축하의 소란 속에 [carnival_location.GetName]의 거리를 거닐던 중, 골목에서 음악이 울려 퍼지는 소리가 들렸다. 술집에서 잔치를 벌이는 인파가 거리로 쏟아져 나오고 있었다. 사방에서 평민과 파트리치오가 친하게 어울렸고, 계급과 특권 대신 가면이 그 자리를 차지했다.\n\n누가 어깨를 두드려서 돌아보니 가면을 쓴 [woo_character.GetWomanMan]이 서 있었다. [woo_character.GetSheHe|U]는 극적인 자세를 취해 보이더니 키득거렸다. 낯선 사람이 가면을 벗자, 다름 아닌 [woo_character.GetNameNoTooltip]의 얼굴이 드러났다.\n\n #EMP \"안녕하십니까, 혹시 저하고 저녁을 함께 보내실 생각은 없으신지요? 가면 쓴 이방인 둘이서 카니발을 즐기는 겁니다.\"#! [woo_character.GetSheHe]가 과장되게 예의를 차린 인사를 하며 말했다."
 carnival.1016.a: "이렇게 반가울 데가! 앞장서게, #EMP \"이방인.\"#!"
 carnival.1016.b: "#BOLD 친구#!와 함께한다면 좋을 것 같은데."
 carnival.1016.c: "서로 이방인답게 지내는 게 좋겠군."
 ## Event - In candle light
 carnival.1017.t: "촛불 빛 속에서"
 carnival.1017.desc: "조용한 술집에 [intent_target.GetNameNoTooltip](이)가 있었다. 밖에서는 카니발의 소란이 이어졌지만 내부는 아늑했고, 촛불로 밝혀져 있었다. [intent_target.GetNameNoTooltip](은)는 내가 들어오는데도 책을 읽고 있었다. 집중하느라 눈썹을 찌푸린 채로.\n\n분명 재치 있는 대화라면 내 매력으로 [intent_target.GetHerHim]의 관심을 끌 수 있겠지."
 carnival.1017.a: "문학에 대한 지식으로 [intent_target.GetHerHim]에게 감명을 준다."
 carnival.1017.b: "재미있는 농담으로 [intent_target.GetHerHim]가 책을 잊게 만든다."
 carnival.1017.c: "[intent_target.GetHerHim]에게 책을 다 읽고 나면 내가 읽어도 되겠느냐고 묻는다."
 carnival.1017.a.tt.failure.desc: "아, 단순한 사람에게 잘 맞는 책이로군"
 carnival.1017.a.tt.success.desc: "이걸 보니까 다른 책이 떠오르는군."
 carnival.1017.b.tt.success.desc: "[intent_target.GetHerHis] 관심을 책에서 다른 곳으로 돌림"
 carnival.1017.a.tt.success.toast: "당신의 폭넓은 지식에 [intent_target.GetTitledFirstName](이)가 관심을 가짐"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName](이)가 당신을 지루하고 거만하다고 생각함"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName](이)가 책을 까맣게 잊어버림"
 carnival.1017.b.tt.failure: "[intent_target.GetTitledFirstName](이)가 책에 계속 코를 박고 집중함"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName](이)가 당신보다 책이 더 재미있다고 생각함"
 carnival.1017.c.tt.toast: "당신과 [intent_target.GetTitledFirstName](은)는 흥미로운 책에 관해 토론하며 사이가 더 가까워짐"
 ## Event - Flowers & song
 carnival.1018.t: "사랑과 놀이"
 carnival.1018.desc: "힘과 실력의 시합을 관람하려는 군중이 광장으로 모여들었다. 레슬링, 달리기, 줄다리기 같은 시합이 벌어지며 사람들이 환호했다. 분위기도 즐겁고 우호적이었다.\n\n[intent_target.GetTitledFirstName](은)는 시합에서 펼쳐지는 기량에 감명받은 듯했다. [intent_target.GetHerHis] 시선이 계속해서 [contender.GetTitledFirstName](을)를 향했다. 내가 [intent_target.GetHerHis] 호의를 얻으려면 어떻게든 상대를 능가해 보여야 한다."
 carnival.1018.a: "레슬링 경기장에서 [contender.GetHerHim]를 이겨 보이겠다!"
 carnival.1018.b: "혹시 [contender.GetSheHe]를 설득하면 져 주지 않을까?"
 carnival.1018.c: "[intent_target.GetTitledFirstNameNoTooltip] 앞에서 [contender.GetHerHim]를 조롱한다."
 carnival.1018.d: "이 시합은 참가하고 싶지 않군."
 carnival.1018.a.success.desc: "[contender.GetTitledFirstNameNoTooltip](을)를 이김"
 carnival.1018.a.success.toast: "[intent_target.GetTitledFirstNameNoTooltip](이)가 당신의 기량에 감명받음"
 carnival.1018.a.failure: "당신이 엉덩방아를 찧으며 넘어짐"
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip](이)가 당신이 있다는 사실을 잊어버림"
 carnival.1018.b.success: "진짜처럼 보이게 만드는 데 성공함"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip](이)가 당신을 투사라고 부름"
 carnival.1018.b.failure: "시합이 너무 뻔하게 조작됨"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip](이)가 당신을 사기꾼이라고 부름"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip](이)가 즐거워하며 매료됨"
 ## Event - A mask in the crowd
 carnival.1019.t: "군중 속 가면"
 carnival.1019.desc: "군중 사이로 계속 똑같은 가면이 보인다. 거리를 걸어가면 가만히 웃고 있는 광대의 얼굴이 계속 시야 구석에 보인다. 수많은 가면 속에서 그 가면이 계속해서 나타난다. 누가 날 미행하는 건가? 그 생각만으로도 피가 차갑게 얼어붙는 듯하다.\n\n나는 대로를 벗어났는데, 그 가면 쓴 사람이 따라왔다. 분명 날 해치러 오는 게 틀림없다!"
 carnival.1019.a: "습격을 준비한다."
 carnival.1019.b: "경비대가 있는 광장으로 유인한다."
 carnival.1019.c: "도와달라고 외친다."
 cooltip.carnival.1019.tt.assassination_success: "습격자를 살해함"
 cooltip.carnival.1019.tt.assassination_fended: "습격자에게 상처를 입힘"
 cooltip.carnival.1019.tt.assassination_captured: "습격자가 투옥됨"
 cooltip.carnival.1019.tt.assassination_scream: "당신의 외침에 암살자들이 흩어짐"
 carnival.1019.tt.assassination_success.desc: "습격자를 베어버림"
 carnival.1019.tt.assassination_fended.desc: "습격자를 막아냄"
 carnival.1019.tt.assassination_wounded.desc: "당신이 다침"
 carnival.1019.tt.assassination_killed.desc: "습격자가 당신을 살해함"
 carnival.1019.tt.assassination_gotaway.desc: "도망치는 데 성공함"
 carnival.1019.tt.assassination_cornered.desc: "구석으로 몰림"
 carnival.1019.tt.assassination_captured.desc: "경비대가 암살자를 붙잡음"
 carnival.1019.tt.assassination_fended_toast: "당신이 추격자를 찌르고 골목으로 도망쳤음"
 carnival.1019.tt.assassination_wounded_toast: "습격자가 당신에게 상처를 입히고 그림자 속으로 사라짐"
 carnival.1019.tt.assassination_success_toast: "암살자 [murder_01.GetFirstNameNoTooltip](이)가 사망함"
 carnival.1019.tt.assassination_gotaway_toast: "당신이 습격자로부터 달아났음"
 carnival.1019.tt.assassination_captured_toast: "암살자 [murderer_01.GetFirstNameNoTooltip](이)가 감옥에 갇혔음"
 ## Event - Thundering hooves
 carnival.1020.t: "우레와 같은 말발굽"
 carnival.1020.desc: "[murder_victim.GetNameNoTooltip](와)과 [murder_victim.GetHerHis] [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip](을)를 발견했는데, 연회를 막 떠나려 하는 중인 듯했다.\n\n나는 말의 고삐를 당기며 [murder_victim.GetFirstNameNoTooltip](이)가 주최자에게 작별 인사를 하기를 기다렸다. 내 목표물은 길 바로 건너편에서 발굽을 내리찍고 있는 위협을 전혀 감지하지 못하고 있었다.\n\n놓칠 수 없는 기회지만, 무고한 이들이 휘말려 다칠 수 있는 위험도 있다."
 carnival.1020.a: "말을 달려 지나가면서 둘 모두를 베어버리겠다."
 carnival.1020.b: "가자, [ROOT.Char.Custom('WarhorseStoryName')]! 저들은 날 두려워하게 될 거다."
 carnival.1020.c: "[murder_victim.GetFirstNameNoTooltip](을)를 짓밟으며 달려간다. 끔찍한 사고인 거지."
 carnival.1020.d: "고용한 이들에게 손짓해 내 사냥감을 추적하게 한다."
 carnival.1020.e: "오늘은 아니다. 너무 위험하군."
 carnival.1020.tt.horse.hit.desc: "희생자가 말발굽에 짓밟힘"
 carnival.1020.tt.horse.miss.desc: "말이 목표물을 놓침"
 carnival.1020.tt.horse.hit.toast: "희생자가 말발굽에 짓밟혔음"
 carnival.1020.tt.horse.miss.toast: "말이 목표물을 놓쳤음"
 carnival.1020.murder_horse.log_title: "군마 난동"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName](이)가 자신의 군마인 [carnival_main.Custom('WarhorseStoryName')](을)를 타고 [murder_victim.GetShortUIName](을)를 짓밟아 버렸음"
 carnival.1020.accident.log_title: "끔찍한 사고"
 carnival.1020.accident.log: "[murder_victim.GetShortUIName](이)가 말에게 짓밟히는 끔찍한 사고를 당해 사망함"
