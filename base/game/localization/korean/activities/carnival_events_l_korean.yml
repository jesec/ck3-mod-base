 ## Event - Procession of My Own
 carnival.1022.t: "나만의 행렬"
 carnival.1022.desc: "도시는 모두를 위해 카니발 비용을 부담하고, 적절한 유흥을 즐길 수 있는 금화도 충분하다. 하지만 재력이 있으며 진취력을 갖춘 시민이라면 우리 축제를 한층 더 화려하게 만들 수 있으리라.\n\n내가 공헌한다면 동료들이 나를 시기하면서도 우러러볼 테고, 아랫사람들의 눈에는 내가 옛 귀족처럼 빛나 보일 것이다. 그렇다. 고대 도시국가의 귀족들도 자신들의 부를 널리 알리지 않았는가! 내가 영광스러운 행렬을 후원한다면, 내 이름이 모두의 입에 오르내리겠지!\n\n #BOLD 근데 주제를 뭐로 정해야 할까?#!"
 carnival.1022.a: "내 업적을 기리는 #BOLD 아름다운#! 행렬로 하자!"
 carnival.1022.b: "공포와 존경심을 심어 줄 #BOLD 위협적인#! 행렬이 좋겠군!"
 carnival.1022.c: "내 신앙심을 보여줄 #BOLD 종교적인#! 행렬이 좋겠다!"
 carnival.1022.d: "다시 생각해 보니, 돈을 다른 데 쓰는 게 좋겠군."
 custom.carnival.1022.guestopinion: "카니발의 모든 문객"
 custom.zealot_carnival.1022.guestopinion: "카니발의 모든 [GetVassalStance( 'zealot' ).GetTextIcon] 문객"
 ## Event - Legacy in marble
 carnival.1023.t: "대리석에 새긴 유산"
 carnival.1023.desc: "나는 어렸을 적부터 고대 도시국가의 이야기를 듣고 자랐다. 그곳의 귀족들은 예술을 후원하는 훌륭한 사람들이었다. 영광스럽던 과거의 웅장한 건물들은 이제 폐허가 되었으나, 그 예술과 미는 아직도 우리에게 영감을 준다. 그러니 예술가를 후원하면 이 위엄 있는 사회에서 내 이름의 격을 높일 수 있겠지.\n\n상상해 보라. 내 명성이 이 삶은 물론이고 후세까지 널리 전해지는 거다!\n\n사람들이 대리석, 돌, 목재로 빚어내 무지개의 색을 입은 아름다운 작품을 우러러보게 하자! [Glossary( '#bold 파트리아#!', 'carnival_patria_GLOSS' )]의 영광, 선조에 대한 공경, 그리고 [ROOT.Char.GetDynastyHouseName]집안의 위신을 위해!"
 carnival.1023.a: "젊은 예술가를 위한 시합을 후원한다."
 carnival.1023.b: "공공 광장의 새로운 벽화와 장식을 의뢰한다."
 carnival.1023.c: "도시의 설립자를 표현한 조각상들을 주문한다."
 carnival.1023.d: "잠깐, 예술이 이렇게 비싸다고!?"
 ## Event - Whispers behind the mask
 carnival.1024.t: "가면 뒤 속삭임"
 carnival.1024.desc: "카니발의 유흥이 소용돌이치며 선은 흐려지고, 사람들은 예절 감각을 잃어간다. 옆에 있던 가면 쓴 사람의 정체가 무엇이었는지, 그 사람이 무엇을 기억할지는 아무도 모른다.\n\n[hook_target.GetTitledFirstNameNoTooltip]도 완전히 선을 넘었다. 저녁 내내 눈이 마주치면 누구든 함께 춤을 추고, 내일이 없는 사람처럼 먹고 마셨다. 누가 듣고 있는지 상관도 안 하고 웃으며 대화를 나누기도 했다. 거기다 명백히 추문을 일으킬 정도의 춤을 추기도 했다. 내가 #BOLD 가면 뒤에서 지켜보고 있다#!는 사실은 까맣게 모른 채로 말이다.\n\n #BOLD 창피를 당하지 않게 해 줄 수도 있겠지만, 이 사실을 이용해 [hook_target.GetTitledFirstNameNoTooltip](이)가 내게 빚을 지게 할 수도 있다.#!"
 carnival.1024.a: "친구로서 [hook_target.GetHerHim]를 계속 지켜봐야겠군."
 carnival.1024.b: "나중에 누가 이 일을 걸고넘어진다면 [hook_target.GetHerHim]도 참 곤란하겠어."
 carnival.1024.c: "[hook_target.GetHerHis] 집안에 친구로서 경고해 두는 게 좋겠다."
 carnival.1024.d: "자기 실수는 [hook_target.GetTitledFirstNameNoTooltip](이)가 알아서 처리하게 둬야지."
 carnival.1025.t: "장신구와 환상적인 야수"
 carnival.1025.into_desc: "나는 어느 외국 상인의 노점 앞에 섰다. 머나먼 곳에서 온 기이한 물건이 진열되어 있는데, 이국적인 짐승들을 가둬 둔 우리도 전시하고 있었다. 이 동물원의 소리와 냄새는 정말 대단했다.\n\n\"한번 구경하고 가세요! 놀라운 것들을 팝니다!\" 상인이 크게 외치며 자기 물건을 향해 손짓했다.\n\n\"최고급 품질의 [merchant_trinket.GetName]입니다. 거기다 [merchant_creature.Custom('GetCarnival1025PitchArticle')] [merchant_creature.GetName]도 있고요."
 carnival_1025_creature_lion_desc: "아프리카의 만티코어입니다. 전설 속의 식인 짐승이죠.\""
 carnival_1025_creature_caracal_desc: "작지만 꽤 사납습니다!\""
 carnival_1025_creature_lynx_desc: "순식간에 나무를 타고 올라가는데, 이 녀석의 소변에서 마법의 효능을 지닌 결정이 나옵니다!\""
 carnival_1025_creature_tiger_desc: "페르시아 전설에 나오는 흉포한 식인 짐승입니다!\""
 carnival_1025_creature_leopard_desc: "고대 서적에도 나온 짐승입니다!\""
 carnival_1025_creature_bear_desc: "앞다리를 들고 설 줄도 알고, 사람 머리 크기의 돌을 공처럼 던지며 묘기를 부립니다!\""
 carnival_1025_creature_elephant_desc: "어느 미친 연금술사가 만든 짐승입니다!\""
 carnival_1025_creature_peacock_desc: "불꽃에서 태어난 짐승입니다!\""
 carnival_1025_creature_parrot_desc: "말도 하고, 찬송가도 부를 줄 압니다!\""
 carnival_1025_creature_cockatoo_desc: "참으로 보기 힘든 짐승이지요!\""
 carnival_1025_creature_crane_desc: "이 우아한 모습을 좀 보십시오!\""
 carnival_1025_creature_monkey_desc: "지옥의 구덩이에서 온 짐승입니다!\""
 carnival.1025.a: "\"멋지군. 장신구를 사겠다.\""
 carnival.1025.b_1: "\"대단하군. 짐승은 내가 데려가겠다.\""
 carnival.1025.b_2: "\"이 녀석은 그저 [merchant_creature.Custom('GetCarnival1025RealBeastArticle')] [merchant_creature.Custom('GetCarnival1025RealBeastName')] 같은데.\""
 carnival.1025.c: "구경은 공짜니까."
 carnival.1025.embarrassed_merchant: "상인이 민망해하며 가격을 할인해 줌."
