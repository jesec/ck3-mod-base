 carnival.1020.both_accident.log: "[murder_victim.GetShortUIName](와)과 [bystander.GetShortUIName](이)가 말에게 짓밟히는 끔찍한 사고를 당해 사망함"
 carnival.1020.bystander_accident.log_title: "끔찍한 사고"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName](이)가 말에게 짓밟히는 끔찍한 사고를 당해 사망함"
 carnival.1020.sword.log_title: "마상 살인"
 carnival.1020.sword.log: "[murder_victim.GetShortUIName](와)과 [bystander.GetShortUIName](이)가 말을 탄 기수에 의해 두 동강이 남"
 carnival.1020.miss.log_title: "말에게 짓밟힐 뻔한 [murder_victim.GetShortUIName]"
 carnival.1020.miss.log: "[murder_victim.GetShortUIName](은)는 [carnival_main.GetShortUIName](이)가 자신을 짓밟으려 했으며, 이는 명백한 살해 시도라고 주장함"
 ## Event - The Arrow
 carnival.1021.t: "화살"
 carnival.1021.desc: "내가 있는 유리한 고지는 조용했다. 나무가 삐걱대는 소리, 창문 너머로 부드럽게 들리는 거리의 소리가 전부였다. 바깥 아래쪽 안뜰에서 내 목표물인 [murder_victim.GetFirstNameNoTooltip](은)는 내 시선도, 내 옆에 있는 [SCOPE.Custom('UniqueBowOrJustBow')]도 눈치채지 못하고 있었다.\n\n혹시 일손이 더 필요할까 봐 폭력배인 [bandit_01.GetFirstNameNoTooltip]도 고용해 데려왔다.\n\n내가 활시위를 당기는 순간 [murder_victim.GetFirstNameNoTooltip](이)가 고개를 들었다. [murder_victim.GetHerHis] 시선이 창문을 살펴보고 있었다!"
 carnival.1021.a: "날 보기 전에 쏴 버린다."
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip], 쏘도록. 나는 탈출로를 확보하겠다."
 carnival.1021.c: "몸을 숙인다. 더 나은 기회를 기다리도록 하자."
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip](이)가 잘못된 사람을 살해함"
