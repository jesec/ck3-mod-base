 ## Event - Dead End
 carnival.1111.t: "막다른 길"
 carnival.1111.desc: "암살자들에 맞서 사투를 벌이던 나는 목에 통증을 느꼈다. 암살자의 동료가 뒤에서 날 찌른 것이다. 나는 쓰러졌고, 바닥이 올라오며 부딪혔다. 사지에서 힘이 빠져나간다. 거친 숨은 피거품이 되어 입술로 흘러나왔다."
 carnival.1111.a: "이렇게 끝나서는 안 되는데."
