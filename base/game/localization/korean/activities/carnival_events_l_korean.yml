 ## GLOSS
 carnival_GLOSS: "카니발은 라틴어 'carnis levare', 즉 '고기를 치우다'라는 말에서 탄생한 단어입니다. 사순절의 금욕 기간 전에 마지막으로 벌이는 연회를 뜻하며, 사육제라고도 합니다."
 carnival_patria_GLOSS: "#EMP 파트리아#!는 라틴어로 \"나라\" 또는 \"조국\"을 뜻하는 단어입니다. 중세에 #EMP 파트리아#!는 속주, 도시 또는 공화국에 속해 있다는 자부심을 나타내는 표현으로 사용되었습니다."
