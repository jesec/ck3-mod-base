l_korean:
 ## Event - Carnival Opening
 carnival.1001.t: "경이로운 시간"
 carnival.1001.desc: "준비가 완료됐다.\n\n대로변에는 화려한 깃발이 가득하고, 행렬이 [carnival_location.GetName]의 골목과 거리로 굽이치며 나아간다. 군중이 광장으로 몰려들었다. 부자거나 가난하거나, 추하거나 아름답거나 상관없다. 이 가면 쓴 얼굴의 바다에서 우린 모두 하나며 동일한 존재니까.\n\n정말 엄청난 광경이 펼쳐지겠군!"
 carnival.1001.a: "이제 가면을 쓸 때다. [Glossary( '#bold 고기를 치워라!#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "이제 날 찾아보시지, 암살자들아!"
 carnival.1001.c: "가면은 결점도 흉터도 모두 감춰 주는 법..."
 ## Event - Carnival Closing
 carnival.1002.t: "일상으로의 복귀"
 carnival.1002.desc: "거리에는 카니발의 잔재가 흩어져 있었다. 버려진 가면과 장식이 배수로에 가득했고, 난봉꾼들이 지친 몸을 이끌고 집으로 향했다. 우리는 서로의 차이를 잊은 채 연회에 참석했고, 춤추고 놀이를 즐겼으며, 함께 웃으며 도시를 하나로 만들었다.\n\n카니발의 화려하던 순간은 당분간 대기에 남아 우리가 누구인지를 상기시켜 주겠지만, 우리는 곧 보통의 일상과 계급, 노역과 책무로 돌아올 것이다. 카니발이 다시 한번 돌아올 때까지 말이다."
 carnival.1002.a: "일을 시작할 때로군."
 carnival.1002.b: "매일 이렇게 보낸다면 어떨까?"
 carnival.1002.c: "질서를 되찾는다는 건 좋은 일이다."
 ## Event - A chance for mischief
 carnival.1003.t: "장난의 기회"
 carnival.1003.desc: "[house_target.GetDynastyHouseName] 집안의 요란한 거주지를 방문한 나는 질 좋은 [house_target.Custom('RegionalFabric')] 휘장, 수백 송이의 [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')], 사방에 가득한 시종들, 마지막으로 고객들에게 거들먹거리는 [house_target.GetName]의 모습을 보았다. 저들을 조금 겸손하게 만들어 주고 싶은 욕구가 치솟았다.\n\n이런 장난이야말로 카니발의 정신 아닌가?\n\n몰래 악당을 좀 고용해야겠다."
 carnival.1003.a: "[house_target.GetFirstNameNoTooltip]한테 썩은 달걀을 던져라!"
 carnival.1003.b: "악마 차림을 하고 날뛰며 [house_target.GetHerHis] 궁을 휩쓸어라."
 carnival.1003.c: "대로에 [house_target.GetHerHis] 가족 얘기를 담은 무례한 낙서를 하자."
 carnival.1003.d: "다시 생각해 보니 좀 아닌 것 같다."
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName](이)가 부끄러워 밖에 나가지도 못함"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName](이)가 정신이 나가버림"
 carnival.1003.tt.irritable_toast: "[house_member.GetShortUINamePossessive] 피가 분노로 끓어오름"
 carnival.1003.throw_eggs_log_title: "달걀 세례"
 carnival.1003.throw_eggs_log: "[house_target.GetDynastyHouseName] 집안의 저택이 달걀로 뒤덮임"
 carnival.1003.mischief.insanity.log_title: "악마의 폭동"
 carnival.1003.mischief.insanity.log: "악마 차림을 한 폭력배들이 폭동을 일으켜 [house_member.GetShortUIName](이)가 정신이 나가버릴 지경이 됨"
 carnival.1003.mischief.irritable.log_title: "악마의 폭동"
 carnival.1003.mischief.irritable.log: "악마 차림을 한 폭력배들이 폭동을 일으켜 [house_member.GetShortUIName](이)가 주변의 모든 사람에게 짜증을 냄"
 carnival.1003.mischief.reclusive.log_title: "악마의 폭동"
 carnival.1003.mischief.reclusive.log: "악마 차림을 한 폭력배들이 폭동을 일으키는 바람에 [house_member.GetShortUIName](이)가 은둔했음"
 ## Event - House Relations
 carnival.1004.t: "집안 관계"
 carnival.1004.desc: "분열한 도시는 오래가지 못한다. 따라서 나는 [carnival_location.GetName]의 정계에 연관된 강력한 집안과 뜻을 같이해야만 한다.\n\n나는 연회 도중에 [other_house_leader01.GetName](을)를 따로 데리고 나와서 우리 [ROOT.Char.GetDynastyHouseName] 집안과 [other_house_leader01.GetHerHis] [other_house_leader01.GetDynastyHouseName] 집안이 좋은 사이를 유지하면 얻게 될 혜택에 관해 설명했다."
 carnival.1004.a: "우리 장부는 끝이 없고, 지갑은 아주 깊다네!"
 carnival.1004.b: "사업에서 협력한다면 양쪽에 모두 이득일세."
 carnival.1004.c: "자네 집안은 [ROOT.Char.GetDynastyHouseNameNoTooltip] 집안보다 한참 아래지."
 carnival.1004.d: "두 집안의 관계는 이전과 같아야 하네."
 ## Event - Prank a friend
 carnival.1005.t: "친구 놀리기"
 carnival.1005.desc: "카니발만큼 친구에게 장난을 치기 좋은 때도 없다. 물론 악의는 전혀 없는 장난을 얘기하는 것이다.\n\n마침 내 친구 [friend.GetName](이)가 [bystander.GetName](와)과 이야기하고 있었고, 나는 재미있을 만한 장난을 순식간에 여러 개 떠올렸다!"
 carnival.1005.a: "나뭇가지로 두 사람에게 결투를 신청한다!"
 carnival.1005.b: "변장한 채 [friend.GetHerHim]에게 부딪힌 다음, 만들어낸 가짜 언어로 대화한다."
 carnival.1005.c: "향수로 가득 채우고, 그림을 그린 알껍데기를 잔뜩 던져 줘야겠군!"
 carnival.1005.d: "아니지. 내 장난을 남한테 강요할 수는 없다."
 carnival.1005.tt.stick_success.desc: "즐거운 막대기 전투를 벌임"
 carnival.1005.tt.stick_failure.desc: "놀이가 너무 거칠어짐"
 carnival.1005.tt.success.desc: "당신의 유창함에 모두가 웃음을 터뜨림"
 carnival.1005.tt.failure.desc: "상대가 당신을 아둔한 당나귀라고 함"
 carnival.1005.tt.disguise_success.desc: "상대를 즐겁게 함"
 carnival.1005.tt.disguise_failure.desc: "혼동하는 바람에 상대가 짜증을 냄"
 carnival.1005.tt.success.toast: "당신의 유창함에 모두가 웃음을 터뜨렸음"
 carnival.1005.tt.failure.toast: "상대가 당신을 아둔한 당나귀라고 했음"
 carnival.1005.tt.egg_success.toast: "친구가 향기로운 깜짝선물을 즐겼음"
 carnival.1005.tt.egg_failure.toast: "친구가 냄새를 싫어했음"
 ## Event - The entertainer
 carnival.1006.t: "재주꾼"
 carnival.1006.desc: "카니발은 온갖 종류의 재주꾼이 몰리는 성수기다. 나는 실력 있는 음악가들이 모인 극단에서 노래와 시, 악기로 이야기를 풀어내는 소리에 귀를 기울였다."
 carnival.1006.a: "음악가들에게 돈을 주고 위대한 나를 기리는 노래를 부르게 한다!"
 carnival.1006.b: "중개인을 시켜 저들 중에서 가장 뛰어난 자를 영입한다."
 carnival.1006.c: "잘 알려진 곡조를 요청해야겠군."
 carnival.1006.d: "근처의 [dancer_character.GetWomanMan]에게 춤을 추자고 한다!"
 cooltip.carnival.1006.bawdy_song.tt: "외설스러운 노래를 요청함"
 cooltip.carnival.1006.patriotic_song.tt: "[Glossary( '#bold 파트리아#!', 'carnival_patria_GLOSS' )]에 대한 노래를 요청함"
 cooltip.carnival.1006.spiritual_song.tt: "영적인 노래를 요청함"
 carnival.1006.tt.dance_success.desc: "[dancer_character.GetWomanMan]이 춤추자는 제안을 승낙함"
 carnival.1006.tt.dance_failure.desc: "[dancer_character.GetWomanMan]이 춤추자는 제안을 거절함"
 carnival.1006.tt.dance_success.toast: "[dancer_character.GetFirstNameNoTooltip](와)과 춤을 춤"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip](이)가 당신과의 춤을 거절함"
 carnival.1006.bawdy_song.tt.toast: "외설적인 노래를 들음!"
 carnival.1006.patriotic_song.tt.toast: "[Glossary( '#bold 파트리아#!', 'carnival_patria_GLOSS' )]에 대한 노래를 들음!"
 carnival.1006.spiritual_song.tt.toast: "영적인 노래를 들음!"
 carnival.1006.recruit_entertainer.log_title: "재주꾼 영입"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip](이)가 [entertainer_character.GetFirstNameNoTooltip](을)를 영입했음"
 ## Event - Learning to juggle
 carnival.1007.t: "곡예 배우기"
 carnival.1007.desc: "음유시인, 곡예사, 광대가 [carnival_location.GetName]의 대로에서 사람들을 즐겁게 했다. 특히 곡예사가 내 눈을 사로잡았다. 칼과 공을 계속해서 공중에 띄우는데, 그 실력이 정말 존경스러웠다.\n\n곡예사 한 명이 앞으로 나오더니, 재미로 한번 해 보지 않겠냐며 권했다.\n\n\"공 하나, 둘, 아니면 셋까지... 떨어뜨리지 않고 몇 개까지 가능하시겠습니까?\""
 carnival.1007.a: "아무나 내기해도 좋다, 난 공 세 개도 띄울 수 있으니까!"
 carnival.1007.b: "공 두 개면 충분하지."
 carnival.1007.c: "칼 두 개는 어떤가?"
 carnival.1007.d: "난 이런 하찮은 장난이 어울리는 사람이 아니다."
 carnival.1007.juggling_success.tt.toast: "곡예에 성공함"
 carnival.1007.juggling_fail.tt.toast: "공을 떨어뜨림"
 carnival.1007.juggling_athletic.tt.toast: "곡예는 신체와 감각을 훈련하는 좋은 방법임"
 carnival.1007.juggling_k.success.tt.toast: "칼 곡예에 성공함"
 carnival.1007.juggling_k.fail.tt.toast: "칼 곡예를 시도하다 베임"
 carnival.1007.blademaster.log_title: "칼을 향한 심취"
 carnival.1007.blademaster.log: "[carnival_main.GetFirstNameNoTooltip](이)가 칼로 곡예를 한 뒤, 날카로운 칼날을 가지고 노는 데 심취하게 됨"
 ## Event - A wild dance
 carnival.1008.t: "거친 춤"
 carnival.1008.desc: "중앙 광장에 가면 쓴 춤꾼들이 바다를 이루었고, 음악과 웃음이 뒤섞였다. 낯선 이들이 만나고 또 헤어지며, 소용돌이치는 춤 속에 상대가 계속 바뀌었다.\n\n나는 광장 가장자리에 서 있었는데, 이 분위기에 전염될 것 같았다!"
 carnival.1008.a: "\"가장 훌륭한 춤꾼에게 금화를 주겠다!\""
 carnival.1008.b: "계속 춤추자, 내 다리가 풀릴 때까지!"
 carnival.1008.c: "춤이 이끄는 대로 흘러가야지."
 carnival.1008.d: "그냥 이 순간을 즐기자."
 carnival.1008.strong.tt.toast: "춤추는 다리"
 carnival.1008.exhausted.tt.toast: "춤을 추다가 지침!"
 carnival.1008.hurt.tt.toast: "춤을 추다가 다침!"
 ## Event - A drink with a craftsman
 carnival.1009.t: "명장 [craftsman_character.Custom('CraftsmanDescOption')](와)과의 한 잔"
 carnival.1009.desc: "나는 [craftsman_character.Custom('CraftsmanDescOption')|l] 거리의 잘 지어진 어느 건물에서 한 명장과 대화를 나누게 되었다.\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.GetSheHe|U]는 [carnival_host.GetTitleAsNameNoTooltip](을)를 직접 만나게 되어 무척 놀란 듯했다."
 carnival.1009.1_b.desc: "가면을 쓴 나는 안심했다. [craftsman_character.GetSheHe]는 내가 누군지 모를 것이다."
 carnival.1009.2_a.desc: "나는 흥미로워하며 귀를 기울였다. [craftsman_character.GetSheHe]는 도시 관리가 형편없고, 무역 상황이 좋지 않은 건 [carnival_host.GetTitleAsNameNoTooltip]의 탓이라며 불평하고 있었다."
 carnival.1009.2_b.desc: "나는 흥미로워하며 귀를 기울였다. [craftsman_character.GetSheHe]는 [carnival_host.GetTitleAsNameNoTooltip](이)가 도시를 훌륭하게 관리한다며 찬사를 보내고, [carnival_host.GetHerHis] 건강을 기원하며 잔을 들어 올리고 있었다."
 carnival.1009.2_c.desc: "[craftsman_character.GetSheHe|l]는 도시가 잘 경영되고 있어 행복해 보였고, 나한테 찬사를 퍼부었다."
 carnival.1009.2_d.desc: "[craftsman_character.GetSheHe|U]는 말이 없어지더니 최근 들어 사는 게 쉽지가 않다며 시무룩하게 털어놓았다."
 carnival.1009.a: "이 일을 가슴에 새기고 더 노력해야겠다."
 carnival.1009.b: "경비병을 보내 이 무례한 인간을 본보기로 삼아야겠다."
 carnival.1009.c: "\"그러면 어디 그대가 처리해 보게, 자문위원!\""
 carnival.1009.d: "내가 누군지 밝히고 도시를 위해 더 노력하겠다고 약속해야겠다."
 carnival.1009.e: "이런 정직한 찬사는 몇 달 만에 처음 듣는군."
 carnival.1009.f: "그럴 줄 알았어! 도시 일로 부담을 가질 필요는 없지."
 carnival.1009.g: "예상했던 대로군. 나를 기리는 조각상을 만들어야겠다."
 carnival.1009.h: "[craftsman_character.Custom('CraftsmanDescOption')](이)가 본심을 털어놓도록 설득함"
 carnival.1009.i: "\"보이지 않는 세력이 우리 공화국을 약화시키고 있다네, 친구여.\""
 carnival.1009.j: "\"내 노고에는 마땅히 보상이 따라야지 않겠는가?\""
 carnival.1009.k: "\"이 행운은 우리 공화국이 함께 이룬 성과다!\""
 carnival.1009.l: "고개를 끄덕이고 계속 [ROOT.Char.Custom('RegionalDrink')]만 마신다."
 carnival.1009.m: "여기 수다나 떨려고 온 줄 아나, 난 싸우러 온 거다!"
 carnival.1009.n: "\"훌륭한 [craftsman_character.Custom('CraftsmanDescOption')|l]에게 부탁하겠네, 무역에 대한 지식을 나한테 가르쳐 주게!\""
 carnival.1009.o: "중개인을 통해 장인을 영입한다."
 carnival.1009.p: "\"술은 내가 사지, 친구.\""
 custom.carnival.1009.spreading_ill_rumors: "[culture|E] 또는 [faith|E]가 다른 모든 [courtier|E]"
 custom.carnival.1009.shared_praise: "모든 [courtier|E]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U](이)가 #V 기능공#! [inspiration|E]을 획득함"
 carnival.1009.drunk.tt.toast: "술에 취해버림"
 carnival.1009.tasty.tt.toast: "음, 맛있군!"
 carnival.1009.skillup.tt.toast: "명장에게서 배움"
 carnival.1009.patron.tt.toast: "사원을 얻음"
 carnival.1009.councilor.log_title: "새 자문위원"
 carnival.1009.councilor.log: "[craftsman_character.GetShortUIName|U](이)가 [councillor|E]으로 임명됨"
 carnival.1009.recruiting.log_title: "명장 [craftsman_character.Custom('CraftsmanDescOption')|U](을)를 영입했음"
 carnival.1009.recruiting.log: "[craftsman_character.GetShortUIName|U](이)가 [carnival_main.GetFirstNameNoTooltip]에 의해 영입되었음"
 carnival.1009.learning_trade.log_title: "명장에게 배움"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip](이)가 명장 [craftsman_character.Custom('CraftsmanDescOption')|l]에게서 약간의 지식을 얻었음"
