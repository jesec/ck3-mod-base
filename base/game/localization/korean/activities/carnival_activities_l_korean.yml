l_korean:
 activity_carnival: "카니발"
 activity_carnival_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] 카니발"
 activity_carnival_owner: "주최자"
 activity_carnival_desc: "화려한 카니발을 열어 시민들을 달래고 즐겁게 할 수 있습니다! 당신은 물론 당신의 신하들도 계급과 차이를 모두 잊고 즐길 기회입니다. 가면을 쓴 축제의 환락과 유흥, 음식이 주는 즐거움에 푹 빠져보십시오!\n\n모두가 공화국의 역사와 문화를 기념하고자 안달이 나 있습니다. 이때야말로 당신의 재력을 과시해 경쟁자들의 시기심을 불러일으키거나, 신분을 숨긴 채 대중 속을 헤치고 다니며 이들의 거리낌없는 생각과 걱정거리를 엿볼 좋은 기회입니다."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$일정 확률로 [prestige_i][prestige|E] 획득\n$BULLET_WITH_TAB$일정 확률로 [piety_i][piety|E] 획득\n$BULLET_WITH_TAB$참가자가 일정 확률로 다른 [activity_guest_short_possessive|E] [opinion_i|E] [opinion|E] 획득\n$BULLET_WITH_TAB$일정 확률로 참가자의 [stress_loss_i][stress|E] 감소\n$BULLET_WITH_TAB$일정 확률로 [Concept( 'county', '영지' )|E] 내 [control_i|E] [control|E] 개선\n$BULLET_WITH_TAB$일정 확률로 [Concept( 'county', '영지' )|E] 내 [prosperity_i|E] [prosperity|E] 개선\n$BULLET_WITH_TAB$일정 확률로 [popular_opinion_i|E] [popular_opinion|E] 개선\n"
 activity_carnival_guest_help_text: "카니발은 재능을 갖춘 평민을 발견하고, 사업 인맥을 만들 훌륭한 기회입니다. 물론 단순히 [stress_loss_i][stress|E]를 감소시키기에도 좋습니다."
 activity_carnival_province_desc: "[ROOT.Province.GetName]에서 카니발을 계획함"
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ 참가자가 일정 확률로 [prestige|E]을 획득합니다.\n$BULLET_WITH_TAB$ 참가자가 일정 확률로 다른 참가자의 [opinion|E]을 얻습니다.\n$BULLET_WITH_TAB$ 일정 확률로 참가자의 [stress_loss_i][stress|E]가 감소합니다."
 activity_carnival_conclusion_desc: "[GetActivityType( 'activity_carnival' ).GetName]이 종료되었습니다."
 activity_carnival_selection_tooltip: "가면을 쓴 축제의 환락으로 백성을 즐겁게 하십시오.\n\n예상 보상:\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$[control_i|E] [control|E]\n$BULLET_WITH_TAB$[prosperity_i|E] [prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]"
 carnival_decoration_basic: "기본 장식"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ [prestige|E] 획득량 감소\n\n#weak 도시는 지금 이 모습 그대로도 아름답지 않습니까?#!"
 carnival_decoration_extensive: "대대적인 장식"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$[prestige|E] 획득\n\n#weak 꽃과 직물, 구성을 맞춘 여러 물건으로 도시를 장식해 시민들을 일상 저편의 놀라운 세계로 초대합니다.#!"
 carnival_decoration_extravagant: "사치스러운 장식"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ [prestige|E] 획득량 대폭 증가\n\n#weak 도시 전체를 뒤바꿉니다. 거리와 광장 장식에 비용을 아끼지 않고 상상 속의 경이로운 세상으로 바꿔 놓습니다.#!"
 carnival_entertainment_basic: "기본 유흥"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ [popular_opinion|E] 획득량 감소\n\n#weak 곡예사 몇 명하고 가수 하나만 있으면 충분합니다.#!"
 carnival_entertainment_extensive: "대대적인 유흥"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ [popular_opinion|E] 획득\n\n#weak 배우, 곡예사, 광대, 음유시인 공연단을 고용해 군중에 놀라움과 즐거움을 선사합니다.#!"
 carnival_entertainment_extravagant: "사치스러운 유흥"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ [popular_opinion|E] 획득량 대폭 증가\n\n#weak 광장을 전 세계에서 온 재주꾼들로 가득 채워 대중이 온갖 종류의 이국적인 공연에 넋을 잃고 즐거워하게 합니다.#!"
 go_incognito_intent: "잠행"
 go_incognito_intent_desc: "가면을 쓴 참가자로 카니발에 참가해 정체를 숨기고 군중에 섞여 듭니다.\n#EMP #low [secret_i] [secrets|E]을 알게 되며 익명으로 행동합니다."
 flaunt_wealth_intent: "재력 과시"
 flaunt_wealth_intent_desc: "시선을 사로잡는 복장을 차려입고, 사치스럽게 돈을 뿌릴 기회를 찾아다닙니다.\n#EMP #low  [prestige_i] [prestige|E] 및 [popular_opinion_i] [popular_opinion|E]을 획득합니다."
 activity_carnival_host_an_a: "$host_activity_a$"
 carnival_base_cost: "기본 비용"
 activity_carnival_destination_selection: ""
 carnival_option_decoration: "카니발 장식"
 carnival_option_entertainment: "카니발 유흥"
 carnival_phase: "$activity_carnival$"
 carnival_phase_desc: "백성이 미소와 웃음으로 기뻐하는 모습을 보는 즐거움은 감히 헤아릴 수 없습니다."
 carnival_conc_reward_title: "카니발 마무리"
 carnival_conc_reward: "[ROOT.Char.GetShortUINameNoTooltip](이)가 성공적인 카니발을 주최함"
