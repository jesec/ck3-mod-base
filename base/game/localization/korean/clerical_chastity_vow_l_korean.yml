l_korean:
 request_clerical_chastity_interaction: "정결 요구"
 request_clerical_chastity_interaction_desc: "[recipient.GetShortUINameNoTooltip]에게 [recipient.GetFaith.HighGodName] 앞에서 정결 서원을 하도록 요구합니다. 승낙하면 [recipient.GetSheHe]는 장기간 [fertility|E] 불이익을 받으며, 서원이 끝나거나 철회될 때까지 유혹이나 구애를 시작할 수 없습니다."
 request_clerical_chastity_notification_text: "이 서원을 함으로써 그대의 육신은 [actor.GetFaith.HighGodName] 앞에 구속된다. 그대의 순종이 [actor.GetFaith.GetAdjectiveNoTooltip] 신앙을 기릴 것이니."
 clerical_chastity_offer_piety: "신앙도 제공"
 clerical_chastity_recipient_must_be_in_reach_tt: "[recipient.GetShortUINameNoTooltip](이)가 직접 소유한 [Concept( 'county', '영지' )|E]가 [puppet_or_actor.GetShortUINamePossessiveNoTooltip] 영지 중 하나와 인접한 경우가 아니라면, 당신이 [head_of_faith|E]이거나 [duchy|E] 이상의 [title|E]를 보유해야 함"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[recipient.GetShortUINameNoTooltip](이)가 직접 소유한 [Concept( 'county', '영지' )|E]가 [puppet_or_actor.GetShortUINamePossessiveNoTooltip] 영지 중 하나와 인접한 경우가 아니라면, [puppet_or_actor.GetShortUINameNoTooltip](이)가 [head_of_faith|E]이거나 [duchy|E] 이상의 [title|E]를 보유해야 함"
 clerical_chastity_vow_blocks_scheme_tt: "당신이 [GetModifier( 'clerical_chastity_vow_modifier' ).GetNameWithTooltip|L]에 구속되지 않아야 함"
 request_clerical_chastity_actor_toast: "요구를 승낙함"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUIName]의 요구를 승낙함"
 request_clerical_chastity_recipient_toast: "정결을 서약함"
 request_clerical_chastity_decline_actor_toast: "요구를 거부함"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName](이)가 [puppet_or_actor.GetShortUIName]의 요구를 거부함"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName( recipient.Self )] 특성이 내 [faith|E]에서 미덕임: $VALUE|=+0$"
 clerical_chastity_ai_rival: "[actor.GetShortUINameNoTooltip|U]의 경쟁자임: $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "내 [clerical_region|E]이 [realm_capital|E]에 있음: $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "추가 [piety|E] 제공: $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[recipient.GetSheHe|U]가 [recipient.GetTitleAsNameNoTooltip|U]임: $VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "정결 서원 철회"
 renounce_clerical_chastity_vow_decision_confirm: "서원 철회"
 renounce_clerical_chastity_vow_decision_desc: "사제가 내 정결을 요구했기에 서원했다. 이를 무효로 할 수는 있으나, 신성한 약속을 깨뜨린다면 내 [piety|E]가 낮아지며 양심에 무거운 짐을 지게 될 것이다."
 renounce_clerical_chastity_vow_decision_tooltip: "서원이 만료되기 전에 종료함. [piety|E]를 상실하며 [stress|E]를 받고 10년 동안 당신의 [clergy_opinion|E]이 감소함."
 renounce_clerical_chastity_vow_toast: "서원 철회함"
 renounce_clerical_chastity_vow_toast_desc: "당신이 정결 서원을 철회함."
