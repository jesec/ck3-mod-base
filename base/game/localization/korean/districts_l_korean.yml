 ### Economy ###
 guild_district: "조합 지구"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]"
 guild_district_desc_flavor: "이곳의 조합 전당에는 도시의 가장 뛰어난 기능공들이 머물며 각자의 영업 비밀을 빈틈없이 지키고 있습니다. 이들은 훌륭한 작품을 만들고, 높은 가격에 판매하며 그 도제들은 과중한 업무에 시달립니다."
 market_district: "상업 지구"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[gold_i][buy_prices|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax_short|E] 및 [artisan_tax_i][artisan_tax|E]"
 market_district_desc_flavor: "지역의 농민, 장인, 상인들이 이 부산한 광장을 새벽부터 밤까지 가득 채웁니다. 도시에서 생산하지 못하는 물품이 있다면 이곳에서 '공정한' 가격에 구매할 수 있습니다."
 port_district: "항만 지구"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]"
 port_district_desc_flavor: "부두와 창고가 해안을 따라 늘어서 있으며, 항만 근로자들이 온갖 크기의 선박에서 화물을 내립니다. 바다 건너에서 무엇이 들어오든, 가장 먼저 이곳을 거쳐야 합니다."
 entrepot_location_district: "중계 지구"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax|E]"
 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', '건물을 통해 상품을 재판매하여 장거리 무역을 할 수 있습니다' )|E]\n\n수입한 상품은 이 창고에서 수량이 파악되고 분류된 뒤 시장으로 보내집니다. 이곳의 상인들은 어느 상품이 부족한지 항상 잘 알고 있으며, 그 상황에 맞춰 가격을 책정합니다."
 entrepot_holding_district_level_2_tt: "[holding_district|E] #V 2#!단계가 필요"
 entrepot_holding_district_level_3_tt: "[holding_district|E] #V 3#!단계가 필요"
 entrepot_holding_district_level_4_tt: "[holding_district|E] #V 4#!단계가 필요"
 holding_district_level_2_tt: "[holding_district|E] #V 2#!단계 필요"
 holding_district_level_3_tt: "[holding_district|E] #V 3#!단계 필요"
 holding_district_level_4_tt: "[holding_district|E] #V 4#!단계 필요"
 ### Fortification ###
 border_forts_district: "국경 요새 지구"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[control_i][control|E]"
 border_forts_district_desc_flavor: "여러 요새가 남작령의 경계를 지킵니다. 요새마다 모든 길목과 여울을 잘 아는 병사들이 배치되어 있습니다. 이곳으로 온 약탈자들이 멀리까지 가는 데 성공한 적은 거의 없습니다."
 walls_district: "성벽 지구"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]"
 walls_district_desc_flavor: "견고한 돌 성벽이 도시를 둘러싸 약탈자를 막아내는 훌륭한 방비를 제공합니다. 마을 사람들은 관문 통행료를 두고 불평하지만, 그래도 강도를 당하는 것보다는 낫습니다."
 ### Military ###
 military_district: "군사 지구"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[siege_weapon_i][siege_weapons|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 military_district_desc_flavor: "견고한 병영은 봉역 병사들의 숙소가 되어주고, 식사와 훈련을 담당하며 행군할 준비를 갖추게 합니다. 물론 병사들이 술에 취하지 않게 단속하는 것은 별개의 문제지만요."
 ### Civic ###
 bureaucratic_district: "행정 지구"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i][vassals|E]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[tax_collector|E] 및 [governor_efficiency|E]"
 bureaucratic_district_desc_flavor: "이 전당에서는 다양한 계급의 관료들이 봉역 업무를 필사하고, 인장을 찍으며 정리합니다. 이들의 일이 찬사를 받는 경우는 드뭅니다. 하지만 이들이 사라진다면 봉역은 머지않아 마비될 겁니다."
 household_district: "왕실 궁역"
 imperial_household_district: "황실 궁역"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 household_district_desc_flavor: "영주는 이 웅장한 전당에서 정무를 봅니다. 높은 성벽 안에서는 시종부터 숙련된 장인과 자문위원에 이르기까지 수많은 이들이 봉역의 위엄을 떠받칩니다. 그중에는 이 지구를 한 번도 떠나지 않은 채 평생을 보내는 이들도 있습니다."
 mandala_district: "만다라 지구"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][dynasty_prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 mandala_district_desc_flavor: "이 신성한 구역의 사원과 조각상, 의식은 모두 같은 이야기를 전하고 있습니다. 바로 왕이 신의 뜻을 받들어 통치한다는 사실입니다. 이는 꽤 자주, 큰 소리로 전해지는 이야기입니다."
 temple_district: "종교 공동체"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 temple_district_desc_flavor: "이 구역에는 성지들이 모여 있습니다. 그 종소리, 성가, 기도의 부름이 하루의 시간을 알려줍니다. 성직자들은 이곳에서 영주 못지않은 영향력을 행사합니다."
 temple_district_christian: "교회 공동체"
 temple_district_islamic: "모스크 지구"
 ### Metropolitan ###
 entertainment_district: "오락 지구"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_tax|E]"
 entertainment_district_desc_flavor: "음악, 놀이를 비롯한 다양한 구경거리가 온 계층의 주민을 이 구역으로 끌어들입니다. 귀족은 이 광경을 즐기지 않는 척하고, 농민은 그런 귀족을 모르는 척합니다."
 patrician_district: "파트리치오 지구"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 patrician_district_desc_flavor: "부유한 가정이 가득한 이 구역에서는 대리석, 비단, 수입한 향신료를 흔히 볼 수 있습니다. 이곳의 가문들은 서로와 혼인하고, 대출을 해 주는 동시에 서로를 대상으로 음모를 꾸밉니다."
 urban_housing_district: "주거 지구"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E] & [settlement_size_growth_short|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[urban_districts|E] 잠금 해제"
 urban_housing_district_desc_flavor: "시민 대부분은 이 붐비는 거리에서 살아가며, 여러 가족이 한 지붕 아래 모여 지냅니다. 전원 지역에서 온 사람에게는 더 나은 삶으로 가는 첫 단계와 같은 곳입니다."
 ### Rural ###
 manor_houses_district: "저택동 지구"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] 및 [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 manor_houses_district_desc_flavor: "전원 지역 곳곳에는 저택동이 있습니다. 저택동은 주변 토지를 관리하는 약소 귀족 가문의 집입니다. 곡물과 돈은 위로 흘러가며, 불만도 그와 함께 흘러갑니다."
 religious_community_district: "종교 공동체 지구"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 religious_community_district_desc_flavor: "신자들은 이 조용한 공동체에 모여 속세와 떨어진 삶을 살아가며, 기도하고 농사를 짓고 성서를 필사합니다. 그러나 세상은 이들에게 끊임없이 문제를 안겨줍니다."
 villages_district: "마을 지구"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E] 감소\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]\n$BULLET_WITH_TAB$[rural_districts|E] 잠금 해제"
 villages_district_desc_flavor: "도시의 성벽 너머, 전원 지역에 흩어져 있는 마을마다 들판과 우물이 있습니다. 이곳에서 농민들은 고마워할 줄 모르는 도시를 위한 음식을 생산합니다."
 ### Tribal ###
 tribal_economy_prestige_district: "연회장 지구"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]"
 tribal_economy_prestige_district_desc_flavor: "이 연회장에서는 부족이 모여 먹고, 마시며 각자의 위업을 자랑합니다. 잔이 오갈 때마다 이들의 이야기에도 조금씩 살이 붙습니다."
 tribal_military_district: "전사 집회소 지구"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 tribal_military_district_desc_flavor: "부족의 전사들은 이 집회소에서 무기의 날을 갈고, 지난번 약탈의 이야기를 나눕니다. 젊은이들은 그 이야기에 귀를 기울이며 각자의 약탈을 계획합니다."
 tribal_wanua_district: "완틸란 지구"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i][barter_goods|E]\n$BULLET_WITH_TAB$[vassal_limit_i][vassal_limit|E]\n$BULLET_WITH_TAB$[domain_limit_i][domain_limit|E]"
 tribal_wanua_district_desc_flavor: "사람들은 탁 트인 전당에 모여 장로에게 불만 사항을 전하고, 장로들은 들은 바를 반드시 족장에게 전달합니다."
 ### Duchy ###
 bailiwick_district: "집달 관할 지구"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] 및 [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 bailiwick_district_desc_flavor: "공작령의 모든 비용은 전원 지역에서 치릅니다. 집달관이 이 지구에서 그 과정을 들판, 가축 떼, 마을마다 차례대로 확실하게 감독합니다."
 staple_district: "거래소 지구"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E], [commerce_tax_i][commerce_tax_short|E], [artisan_tax_i][artisan_tax_short|E] 및 [maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 staple_district_desc_flavor: "거래소 지구에는 창고와 저울이 많으며 물품의 수량을 확인하는 방이 가득합니다. 이곳에서 공작령의 가장 귀중한 무역 상품의 무게를 재고, 세금을 매기며 보호합니다."
 endowment_district: "교회 헌납지 지구"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 endowment_district_desc_flavor: "교회 헌납지에 주어지는 모든 선물은 영원히 헌납지의 소유가 되며, 이곳의 성직자는 아무도 기억하지 못하는 영주로부터 받은 인가를 소유하고 있습니다."
 assay_district: "시금소 지구"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E] 및 [civic_tax_i][civic_tax|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[vassal_i][vassals|E]"
 assay_district_desc_flavor: "이 지구는 동전을 주조할 때마다 몇 닢을 상자에 넣어 보관합니다. 혹시 주조자들이 욕심을 부릴 수도 있으니, 나중에 동전을 꺼내 시험해 보기 위함입니다."
 military_duchy_capital_district: "연병장 지구"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E] 및 [fort_level|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]"
 military_duchy_capital_district_desc_flavor: "이 지구로 소집된 모든 병사의 이름과 무기, 말은 명단에 기록됩니다. 소집에 나타나지 않은 이들 역시 기록됩니다."
 ducal_residence_district: "공작 거주지 지구"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 ducal_residence_district_desc_flavor: "공작의 지위에 걸맞은 전당과 정원이 지구의 문객을 맞이합니다. 공작령의 업무 대부분은 궁정이 아니라 이곳의 식사 자리에서 해결됩니다."
 royal_residence_district: "왕실 거주지 지구"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 royal_residence_district_desc_flavor: "왕의 지위에 걸맞은 전당과 정원이 지구의 문객을 맞이합니다. 봉역의 업무 대부분은 궁정이 아니라 이곳의 식사 자리에서 해결됩니다."
 governance_district: "국정 구역"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 governance_district_desc_flavor: "다양한 지위의 관료들이 이 지구의 전당에서 일합니다. 속주의 세금을 확인하고, 곡창을 감찰하며, 수비대의 봉급을 지급하는 곳입니다."
 forestry_district: "임업 지구"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_glass').GetNameWithIcon], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_meat').GetNameWithIcon]"
 forestry_district_desc_flavor: "이곳의 숲은 집과 선박, 불에 필요한 목재를 제공하며 나무를 벌목할 권리는 철저하게 보호됩니다. 목재를 훔친다면 사슴을 밀렵한 죄만큼 엄중하게 처벌받습니다."
 grain_district: "곡물 재배 지구"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 grain_district_desc_flavor: "곡물은 모든 경제의 근간입니다. 이 지구의 들판에서는 수많은 곡물이 자라납니다. 빵으로 만들어지지 않는 곡물은 양조에 사용되거나, 증류되거나 판매됩니다."
 wool_district: "양 사육 지구"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon], [GetTradeGoodType('trade_good_leather').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 wool_district_desc_flavor: "양 떼가 이 지구의 목초지에서 풀을 뜯고, 양모는 자루 단위로 봉역 곳곳의 방직공에게 팔려 나갑니다. 많은 위대한 상인이 하나의 양 떼를 시작으로 재산을 불려 나갔습니다."
 cattle_district: "소 사육 지구"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_meat').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 cattle_district_desc_flavor: "소들이 이 지구의 목초지에서 풀을 뜯습니다. 소는 고기와 우유를 제공하고, 그 힘으로 밭을 갈 수 있어 귀하게 여겨지는 가축입니다. 많은 지역에서는 여전히 신부의 지참금을 소로 치르고 있습니다."
 cotton_district: "목화 재배 지구"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 cotton_district_desc_flavor: "이 지구의 들판에는 하얀 목화송이가 익어가며, 손으로 수확한 목화는 더미 단위로 판매됩니다. 먼 곳에 사는 사람들은 목화가 작은 양을 키워내는 식물에서 자라난다고 알고 있기도 합니다."
 stone_district: "채석 지구"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 stone_district_desc_flavor: "이 지구의 구릉지 곳곳에는 채석장이 있습니다. 봉역의 성벽, 사원, 성채에 쓰일 석재를 채굴하는 곳입니다. 봉역의 여러 훌륭한 건물도 이곳의 비탈에서 시작되었습니다."
 fish_district: "어업 지구"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 fish_district_desc_flavor: "이 지구의 생선은 날로 먹기도 하지만, 염장하거나 훈제하거나 말리기도 하며 물이 드문 먼 내륙 지방에서 거래됩니다. 어획량이 풍성하면 마을을 한 달 동안 먹여 살릴 수 있습니다."
 wine_district: "포도원 지구"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 wine_district_desc_flavor: "이 지구의 포도원에서 기르는 포도는 식탁으로 나가거나 건조되기도 하지만, 그 무엇보다도 포도주에 사용됩니다. 품질이 좋은 포도주는 수십 년 동안 기억되며, 품질이 나쁜 포도주는 그보다 더 오래 기억에 남습니다."
 oil_district: "올리브 재배 지구"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 oil_district_desc_flavor: "이 지구에서 생산한 기름은 등불을 밝히고 요리에 쓰이며, 신자에게 도유하고 부유한 이의 피부를 부드럽게 합니다. 거의 모든 곳에 사용되는 물품이므로, 기름 없이 살아갈 수 있는 가정은 드뭅니다."
 rice_district: "벼 재배 지구"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 rice_district_desc_flavor: "물에 잠긴 논이 펼쳐진 땅입니다. 마을 전체가 벼를 심고, 잡초를 뽑고 수확하며 논을 돌봅니다. 쌀농사는 어느 가족이든 혼자서 감당하기에는 너무 고된 일이기 때문입니다."
 millet_district: "수수 재배 지구"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_wood').GetNameWithIcon]"
 millet_district_desc_flavor: "이곳의 건조한 평야는 잡곡과 수수밭으로 뒤덮여 있습니다. 곡식은 말에 탄 기수를 가릴 정도로 높이 자랍니다. 이 곡물들은 알이 작고 단단해 수년간 보관해도 상하지 않습니다."
 mine_district: "광업 지구"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon]"
 mine_district_desc_flavor: "이 지구의 땅에는 철, 은, 소금 등이 잠들어 있습니다. 무엇이 묻혀 있든, 지상보다 지하에서 더 많은 시간을 보내는 광부들이 전부 채굴해 냅니다."
 salt_district: "염전 지구"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 salt_district_desc_flavor: "이곳의 소금이 없다면 흉년을 대비해 고기나 생선을 보존할 수도 없고, 부대를 먹여 살릴 수도 없습니다. 대량의 소금을 공급하는 이 지구는 그 사실을 매우 잘 알고 있습니다."
 amber_district: "호박 채취 지구"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "폭풍이 지나가면 이곳의 물가로 호박이 밀려오며, 모래밭과 내륙의 습지에서도 호박을 캐낼 수 있습니다. 안에 곤충이 갇힌 호박은 행운을 가져다주는 물건으로 여겨집니다."
 silk_district: "양잠 지구"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 silk_district_desc_flavor: "비단은 이 지구의 작은 애벌레에서 시작됩니다. 애벌레는 밤낮으로 뽕잎을 먹으며 자라납니다. 의복 하나를 만들려면 수천 개의 애벌레 고치가 필요합니다."
 furs_district: "모피 지구"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 furs_district_desc_flavor: "이 지구의 사냥꾼은 짐승의 털이 가장 두꺼워지며, 값도 가장 비싸지는 추운 계절에 밖으로 나섭니다. 훌륭한 모피 하나로 한 계절의 벌이에 맞먹는 돈을 벌 수도 있습니다."
 spices_district: "향신료 재배 지구"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 spices_district_desc_flavor: "이곳의 향신료는 껍질, 싹, 열매, 뿌리, 꽃의 암술을 포함해 식물의 모든 부분에서 나옵니다. 모든 향신료는 손으로 수확하고 정성껏 말려서 만듭니다."
 tea_district: "차 재배 지구"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 tea_district_desc_flavor: "이 지구의 가파른 비탈에는 아침마다 안개가 걸려 있으며, 이곳에서 차 덤불이 자라납니다. 가장 질 좋은 잎은 어릴 때 수확하는데, 한 번에 싹 하나와 잎 두 장을 따는 방식입니다."
 dyes_district: "염료 생산 지구"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 dyes_district_desc_flavor: "이 지구의 염료는 뿌리, 잎, 열매, 심지어는 으깬 곤충에서도 나옵니다. 깊이 있고 오래 지속되는 색상이 나오려면 염료에 천을 열두 번 넘게 담가야 할 수도 있습니다."
 ivory_district: "상아 수렵 지구"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 ivory_district_desc_flavor: "이 지구에서는 코끼리를 포획해 길들이고 전쟁, 노동, 숭배를 목적으로 훈련합니다. 상아는 코끼리가 지닌 가치의 극히 일부일 뿐입니다."
 sugar_district: "사탕수수 재배 지구"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 sugar_district_desc_flavor: "이 지구에서는 사탕수수가 높이 자랍니다. 사탕수수를 으깬 뒤 달콤한 즙을 짜내고, 즙이 단단한 덩어리가 될 때까지 졸입니다. 먼 곳에서는 이 덩어리 하나가 암소보다 더 비쌉니다."
 incense_district: "향 채취 지구"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 incense_district_desc_flavor: "이 지구에서는 나무껍질에서 나온 진액을 햇빛에 굳혀 향을 만듭니다. 그 연기가 세계 전역의 사원에서 솟아오르고 있습니다."
 medicaments_district: "약초 채취 지구"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 medicaments_district_desc_flavor: "이 지구의 정원과 야생에서는 약용 식물이 자랍니다. 사람을 치유하는 풀과 해치는 풀을 구분할 수 있는 사람들이 이러한 약초를 채집합니다."
 ceramics_district: "도자기 생산 지구"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_glass').GetNameWithIcon]"
 ceramics_district_desc_flavor: "이 지구의 점토는 입자가 매우 고운 탓에, 도공들이 몇 주나 걸리는 길을 찾아와 채집해 가기도 합니다. 여기서 구워낸 최고의 작품은 두드리면 종처럼 맑은 소리를 냅니다."
 hemp_district: "삼 재배 지구"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 hemp_district_desc_flavor: "이 지구는 삼이 자라는 들판으로 뒤덮여 있습니다. 삼을 자르고 물에 담근 뒤 두드려 밧줄, 천, 캔버스가 되는 섬유를 만들어냅니다."
 flax_district: "아마 재배 지구"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 flax_district_desc_flavor: "여기서는 아마를 잘라내지 않고 뿌리까지 뽑아내, 섬유의 모든 부분을 남김없이 활용합니다. 아마 씨앗은 압착한 뒤 동물의 먹이로 줍니다."
 honey_district: "양봉 지구"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] 및 [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 honey_district_desc_flavor: "이곳에서는 짚, 점토 또는 빈 통나무로 만든 벌집에서 벌들을 기릅니다. 꿀을 채집할 때는 연기로 벌을 진정시킵니다. 대부분의 사람이 살면서 접하게 되는 유일한 단맛은 바로 이 꿀일 겁니다."
 fruit_district: "과수 지구"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] 및 [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]가능한 생산: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 fruit_district_desc_flavor: "이 지구의 비탈과 계곡에는 과일나무가 자라는 과수원이 가득합니다. 여기서 수확한 과일은 그대로 먹거나, 햇빛에 말리거나 압착하여 사용합니다."
 horses_district: "말 사육 지구"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 horses_district_desc_flavor: "드넓은 목초지, 방목장, 마구간이 가득한 지구입니다. 이곳에서는 말들을 기르고 길들여서 봉역 곳곳의 기수들에게 팝니다."
