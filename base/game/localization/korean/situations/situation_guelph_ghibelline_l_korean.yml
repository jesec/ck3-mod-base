 situation_guelph_ghibelline_phase_ad_interim_desc_short: "이 [GetSituation('guelph_ghibelline').GetName] [situation_phase|E]은 [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName] 및 [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName](이)가 다음 국면이 [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] 또는 [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName] 중 어느 쪽이 될지 결정하는 분기점입니다...\n\n$precursor_situation_leader_help$"
