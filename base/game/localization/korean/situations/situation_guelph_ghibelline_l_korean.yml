 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "[GetSituation('guelph_ghibelline').GetName] [situation|E]에서 [guelphs|E]의 지도자입니다.\n\n[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] 및 [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] 서막 [situation_phase|E] 동안에는 $religiousheadname_pope$이 [guelphs|E]를 이끌며, 투쟁은 역사적 구도에 따라 격화됩니다. 지도자 고유의 [decisions|E]은 서막 국면이 본격적인 분쟁으로 전환된 뒤에야 사용할 수 있습니다.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "[GetSituation('guelph_ghibelline').GetName] [situation|E]에서 [guelphs|E]의 지도자입니다.\n\n이 지도자는 고유 [decisions|E]을 사용하여 분쟁의 향방을 조정할 수 있습니다:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! 및 #V $guelph_ghibelline_conflict_decision$#!로 [situation|E]을 비교적 평온한 [situation_phase|E]과 갈등이 격한 [situation_phase|E] 사이에서 전환\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#!로 [guelphs|E]가 우세할 때 [guelphs|E]의 승리로 상황을 종결\n$BULLET_WITH_TAB$지도자 자리에서 물러나 적합한 지지자에게 자리를 넘기는 결단$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "$ghibelline$ 지도자"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "[GetSituation('guelph_ghibelline').GetName] [situation|E]에서 [ghibellines|E]의 지도자입니다.\n\n[GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] 및 [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] 서막 [situation_phase|E] 동안에는 [GetTitleByKey('e_hre').GetName]의 영주가 [ghibellines|E]을 이끌며, 투쟁은 역사적 구도에 따라 격화됩니다. 지도자 고유의 [decisions|E]은 서막 국면이 본격적인 분쟁으로 전환된 뒤에야 사용할 수 있습니다.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "[GetSituation('guelph_ghibelline').GetName] [situation|E]에서 [ghibellines|E]의 지도자입니다.\n\n이 지도자는 고유 [decisions|E]을 사용하여 분쟁의 향방을 조정할 수 있습니다:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! 및 #V $guelph_ghibelline_conflict_decision$#!로 [situation|E]을 비교적 평온한 [situation_phase|E]과 갈등이 격한 [situation_phase|E] 사이에서 전환\n$BULLET_WITH_TAB$#V $ghibelline_victory_decision$#!로 [ghibellines|E]이 우세할 때 [ghibellines|E]의 승리로 상황을 종결\n$BULLET_WITH_TAB$지도자 자리에서 물러나 적합한 지지자에게 자리를 넘기는 결단$gg_leader_group_help$"
