 situation_guelph_ghibelline_phase_agitation: "선동"
 situation_guelph_ghibelline_phase_agitation_desc_short: "이 [GetSituation('guelph_ghibelline').GetName] [situation_phase|E]에서는 갈등이 더욱 심화되어, 승리한 진영의 세력을 키우기 위한 전투와 전쟁이 벌어집니다.\n\n분쟁 중 어느 한쪽의 세력이 70% 이상이 되면 국면은 즉시 다음 중 하나로 진행됩니다.\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
