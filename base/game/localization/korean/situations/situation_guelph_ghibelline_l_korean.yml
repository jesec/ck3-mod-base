 situation_guelph_ghibelline_phase_dictatus_papae: "교황 훈령"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "이 [GetSituation('guelph_ghibelline').GetName] [situation_phase|E]은 이전 [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] 국면이 격화된 단계입니다.\n\n이제 군주와 교회 봉신의 관계는 더욱 경직됩니다. 봉신들은 보편적 권력을 주장하는 $religiousheadname_pope$과 자신의 주권을 유지하려는 주군 사이에서 갈등하게 됩니다.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "대략 [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V][Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), '년', '년' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), '달', '달' ) )] 후 상황이 격화되어 [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] 또는 [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName] [situation_phase_phase|E]에 돌입합니다"
 gg_dictatus_papae_transition_desc: "교황 훈령의 원칙 대부분이 (...)"
