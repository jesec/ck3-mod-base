l_korean:
 msg_passive_learned_tenet_abroad_desc: "[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]에서 [passive_learn_source.GetRite.GetAdjective] [rite|E]를 따르는 [passive_learn_source.GetTitledFirstName](을)를 관찰한 결과, 당신은 [passive_learn_tenet.GetBaseName] [core_tenet|E]에 대한 [agnostic_knowledge|E]을 얻게 되었습니다."
 msg_passive_learned_doctrine_abroad_desc: "[passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]에서 [passive_learn_source.GetRite.GetAdjective] [rite|E]를 따르는 [passive_learn_source.GetTitledFirstName](을)를 관찰한 결과, 당신은 [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )] [doctrine|E]에 대한 [agnostic_knowledge|E]을 얻게 되었습니다."
 msg_passive_learned_rite_abroad_desc: "당신은 [passive_learn_source.GetTitledFirstNameNoTooltip](을)를 통해 [passive_learn_source.GetRite.GetAdjective] [rite|E]의 [core_tenets|E]와 [doctrines|E]에 대한 [agnostic_knowledge|E]을 얻게 되었습니다."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "당신은 [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]에서 [passive_learn_rite.GetAdjective] [rite|E]의 [passive_learn_tenet.GetBaseName] [core_tenet|E]에 대한 [agnostic_knowledge|E]을 얻게 되었습니다."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "당신은 [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier]에서 [passive_learn_rite.GetAdjective] [rite|E]의 [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )] [doctrine|E]에 대한 [agnostic_knowledge|E]을 얻게 되었습니다."
 rite_travel_events.1000.t: "여행 중인 [passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "해가 질 무렵, 여행 중인 [passive_learn_rite.GetAdherentName] 하나가 모닥불가에 합류했다.\n\n밤이 깊어지자 우리는 [passive_learn_source.Custom('RegionalDrink')](와)과 [passive_learn_source.Custom('RegionalEdibleMeat')](을)를 나누며 이야기를 주고받았다. [passive_learn_source.GetSheHe|U]는 자기 민족의 신성한 가르침과 [passive_learn_rite.GetNameNoTooltip]의 삶과 실천 방식에 대해 이야기했다. 그 말 한마디 한마디에는 굳은 신념이 담겨 있었다."
 rite_travel_events.1000.a: "참으로 통찰력 있는 이야기군."
 rite_travel_events.1000.b: "[passive_learn_source.GetSheHe|U]는 나와 함께해야 한다."
 rite_travel_events.1000.c: "그런 이단에는 귀를 기울일 생각이 없다."
 rite_travel_events.2000.t: "계시"
 rite_travel_events.2000.desc: "[location.GetName]의 [location.GetTerrain.GetNameNoTooltip](을)를 지나던 중, 사람들이 모여 있는 모습을 발견했다.\n\n설교자가 [passive_learn_tenet.GetBaseName](이)라는 무언가에 대해 이야기하고 있었다. 한 번도 들어 본 적 없는 것이었지만, 이상하게도 [passive_learn_source.GetHerHis] 말이 마음에 와닿았다.\n\n그냥 지나칠 생각이었다. 하지만 나는 발길을 멈추고 귀를 기울였다.\n\n이것은... 이것이야말로 진실이다."
 rite_travel_events.2000.a: "[ROOT.Char.GetFaith.HighGodName]께서 내게 바라시는 일이다."
 rite_travel_events.2000.b: "나는 이교도가 아니다!"
