l_korean:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "성 베드로의 뼈"
 artifact_relic_peter_bones_desc: "사도들의 우두머리이자 로마의 제1대 주교인 사도 베드로의 뼈입니다."
 artifact_relic_paul_bones_name: "성 바울로의 뼈"
 artifact_relic_paul_bones_desc: "아쿠아에 살비아에에서 순교한 사도 바울의 뼈입니다."
 artifact_relic_crown_of_thorns_name: "가시관"
 artifact_relic_crown_of_thorns_desc: "그리스도가 십자가형을 당하기 전 그 머리에 씌워졌던 가시관입니다."
 artifact_relic_baptist_arm_name: "세례 요한의 오른팔"
 artifact_relic_baptist_arm_desc: "세례 요한의 오른쪽 팔뚝으로, 요르단에서 그리스도에게 세례를 베푼 바로 그 손이라고 전해집니다."
 artifact_relic_true_cross_name: "성십자가의 조각"
 artifact_relic_true_cross_desc: "그리스도가 못 박혔던 십자가의 조각으로, 도금된 성유물함에 안치되어 있습니다."
 artifact_relic_bones_of_james_name: "성 야고보의 뼈"
 artifact_relic_bones_of_james_desc: "대 야고보 사도의 뼈입니다. 기독교 세계 전역의 순례자가 이 유해를 찾아 모여듭니다."
 artifact_relic_mark_name: "성 마르코의 머리"
 artifact_relic_mark_desc: "알렉산드리아 교회를 세운 복음사가 마르코의 잘린 머리입니다."
 artifact_relic_lance_antioch_name: "안티오키아의 성창"
 artifact_relic_lance_antioch_desc: "그리스도의 옆구리를 찔렀다고 전해지는 철제 창날입니다."
 artifact_relic_tabot_name: "언약의 타보트"
 artifact_relic_tabot_desc: "언약궤를 상징하는 축성된 석판으로, 에티오피아 성물 중에서 가장 신성하게 여겨지는 유물입니다."
 artifact_relic_nine_saints_name: "아홉 성자의 뼈"
 artifact_relic_nine_saints_desc: "아홉 성자의 뼈는 칼케돈 논쟁을 피해 악숨으로 피난 온 시리아 수도사들의 것입니다. 이들은 에티오피아 최초의 수도원을 설립했으며, 고지대 곳곳에 합성론적 기독교를 퍼뜨렸습니다."
 artifact_relic_thomas_name: "성 토마스의 성물"
 artifact_relic_thomas_desc: "성 토마스의 뼈와 피로 얼룩진 창끝입니다. 성 토마스는 케랄라에 믿음을 전파했으며, 그곳에서 순교했다고 전해집니다."
 artifact_relic_augustine_pallium_name: "성 아우구스티누스의 팔리움"
 artifact_relic_augustine_pallium_desc: "잉글랜드의 첫 대주교이자 사도인 캔터베리의 아우구스티누스가 사용했던 팔리움입니다."
 artifact_relic_three_magi_name: "세 동방박사의 성물"
 artifact_relic_three_magi_desc: "별을 따라 베들레헴까지 갔던 동방박사 세 사람의 뼈입니다."
 artifact_relic_becket_name: "성 토마스 베켓의 성물"
 artifact_relic_becket_desc: "피에 젖은 의복과 토마스 베켓의 두개골입니다. 토마스 베켓은 1170년에 자신의 대성당에서 순교했으며, 순식간에 잉글랜드 기독교 세계에서 가장 위대한 성자가 되었습니다."
 artifact_relic_ursula_name: "성 우르술라의 뼈"
 artifact_relic_ursula_desc: "우르술라 및 그녀와 동행했던 동정녀 순교자들의 뼈로, 쾰른의 묘지에서 발굴되었습니다."
 artifact_relic_ignatius_name: "성 이그나티우스의 뼈"
 artifact_relic_ignatius_desc: "안티오키아의 2대 총대주교이자 사도 요한의 제자였던 이그나티우스의 뼈입니다. 그는 트라야누스 황제 치세에 로마에서 순교했습니다."
 # Islamic
 artifact_relic_black_stone_name: "검은 돌의 조각"
 artifact_relic_black_stone_desc: "카바의 검은 돌에서 떨어져나온 반짝이는 검은 파편입니다. 선지자가 직접 입을 맞췄다고 전해지며, 모든 핫즈 순례자의 경배를 받는 유물입니다."
 artifact_relic_dhulfiqar_name: "줄피카르"
 artifact_relic_dhulfiqar_desc: "선지자가 알리에게 주었다고 전해지는 검으로, 칼날이 두 갈래로 갈라져 있습니다. 신이 인정한 통치의 징표이며 움마 전역에서 숭배받고 있습니다."
 artifact_relic_buraq_footprint_name: "부라크의 발자국"
 artifact_relic_buraq_footprint_desc: "발자국이 남은 돌입니다. 선지자가 천국으로 승천할 때, 선지자를 태운 부라크가 예루살렘의 기반석에 발자국을 남겼다고 합니다."
 artifact_relic_sword_of_ali_name: "알리의 검"
 artifact_relic_sword_of_ali_desc: "알리 이븐 아비 탈리브가 바드르와 시핀에서 휘둘렀다고 여겨지는 검입니다."
 artifact_relic_abu_hanifa_turban_name: "아부 하니파의 터번"
 artifact_relic_abu_hanifa_turban_desc: "하나피 마드하브의 창시자인 아부 하니파 안누만의 학자 터번입니다. 모든 하나피 순례자에게 수니파 법학의 구심점이 되는 유물입니다."
 artifact_relic_prophet_sandals_name: "선지자의 샌들"
 artifact_relic_prophet_sandals_desc: "선지자가 신었다는 가죽 샌들입니다. 움마 전역의 독실한 장인들이 나알의 형태로 끊임없이 모방해 왔습니다."
 # Jewish
 artifact_relic_western_wall_name: "통곡의 벽의 돌"
 artifact_relic_western_wall_desc: "통곡의 벽에서 발굴된 다듬어진 돌입니다. 서기 70년, 로마가 성전을 파괴한 뒤 남겨진 소수의 유적 중 하나인 제2성전의 기반에 있었습니다."
 artifact_relic_tablets_name: "석판의 조각"
 artifact_relic_tablets_desc: "시나이산에서 화가 난 모세가 율법의 석판을 던져 버렸을 때, 석판에서 쪼개져 나왔다고 전해지는 돌 조각입니다."
 # Buddhist
 artifact_relic_bodhi_leaf_name: "보리수잎"
 artifact_relic_bodhi_leaf_desc: "부다가야에 있는 보리수의 잎을 보존한 것입니다. 부처가 이 보리수 아래에서 깨달음을 얻었다고 합니다."
 artifact_relic_vajrasana_name: "바즈라사나의 조각"
 artifact_relic_vajrasana_desc: "윤이 나는 바즈라사나, 즉 금강보좌의 파편입니다. 금강보좌는 보리수 밑의 자리로, 부처는 깨달음을 얻는 순간까지 이곳에 움직이지 않고 앉아 있었다고 합니다."
 artifact_relic_dhamek_name: "다메크 불탑의 사리"
 artifact_relic_dhamek_desc: "부처가 최초의 제자들에게 불법을 설파했던 녹야원에서 온 부처의 신성한 성물입니다."
 artifact_relic_jowo_name: "조워 샤카무니"
 artifact_relic_jowo_desc: "중국에서 옮겨진 어린 부처의 축성된 상입니다. 티베트인들은 이를 가장 신성한 조각상으로 여깁니다."
 artifact_relic_sacred_tooth_name: "부처의 신성한 치아"
 artifact_relic_sacred_tooth_desc: "4세기에 칼링가에서 옮겨진 부처의 왼쪽 송곳니입니다. 왕권의 수호물로서, 이 성물을 관리하는 자는 다른 누구보다 우월한 통치자로서 정당화됩니다."
 # Hindu
 artifact_relic_lingam_name: "비슈바나트 링가"
 artifact_relic_lingam_desc: "갠지스의 가장 성스러운 도시, 바라나시에 있는 대사원의 시바 링가에서 나온 성스러운 파편입니다."
 artifact_relic_trishul_name: "시바의 트리슐"
 artifact_relic_trishul_desc: "시바가 직접 사용했다고 전해지는 세 갈래 삼지창입니다. 신의 창조, 보존, 파괴에 대한 지배력을 상징합니다."
 artifact_relic_krishna_stone_name: "크리슈나 탄생의 돌"
 artifact_relic_krishna_stone_desc: "마투라의 크리슈나 잔마부미에서 나온 낡은 돌입니다. 전승에서 크리슈나가 태어난 곳으로 꼽는 바로 그 장소입니다."
 artifact_relic_rama_footprint_name: "라마의 발자국"
 artifact_relic_rama_footprint_desc: "라마의 발자국이 찍힌 돌로, 그가 태어난 곳인 아요디아에서 옮겨 왔습니다."
 # Jain
 artifact_relic_palitana_tirtha_name: "팔리타나의 티르타"
 artifact_relic_palitana_tirtha_desc: "성스러운 돌 성물입니다. 자이나교 전통에서 신성한 티르타로 여기는 팔리타나의 샤트룬자야 언덕에서 나왔습니다."
 artifact_relic_parshvanatha_paduka_name: "파르슈바나타의 차란 파두카"
 artifact_relic_parshvanatha_paduka_desc: "차란 파두카는 제23대 티르탕카라 파르슈바나타의 발자국이 찍힌 돌입니다."
 artifact_relic_shikharji_nishidhi_name: "티르탕카라의 니시디"
 artifact_relic_shikharji_nishidhi_desc: "24명의 티르탕카라 중 20명이 해탈의 경지에 이른 곳이자 자이나교의 가장 신성한 티르타인 삼메드 시카르 산의 봉우리에서 온 니시디 기념비석입니다."
 # Zoroastrian
 artifact_relic_atash_bahram_name: "아두르 파른바그의 불씨"
 artifact_relic_atash_bahram_desc: "사제들이 모시는 성화인 위대한 아타쉬 베흐람에서 나온 타오르는 불씨입니다. 불의 사원에서 여전히 이 불씨를 돌보고 있습니다."
 # Norse
 artifact_relic_yggdrasil_branch_name: "이그드라실의 가지"
 artifact_relic_yggdrasil_branch_desc: "웁살라 신전의 신성한 나무에서 떨어졌다고 여겨지는 나뭇가지입니다. 이 나무에는 희생된 제물의 사체가 아직도 매달려 있습니다."
 # Slavic
 artifact_relic_perun_idol_name: "페룬의 우상"
 artifact_relic_perun_idol_desc: "슬라브 신 중에서 최고신이자 천둥의 신인 페룬의 모습을 조각한 나무 우상입니다. 블라디미르 공이 세웠습니다."
 # Tengri
 artifact_relic_suldetug_name: "슐드 툭 깃발"
 artifact_relic_suldetug_desc: "야크 꼬리로 만들어진 검은색 깃발입니다. 전쟁의 신이 깃드는 영적인 그릇으로, 초원의 칸 앞에서 휘날리는 깃발이었습니다."
 # Shinto
 artifact_relic_yata_kagami_name: "야타노카가미"
 artifact_relic_yata_kagami_desc: "전통적으로 일본의 삼종신기 중 하나로 여겨지는 청동 거울로, 태양의 여신인 아마테라스를 동굴에서 나오게 한 유물로 전해집니다."
 artifact_relic_shin_no_mihashira_name: "신노미하시라"
 artifact_relic_shin_no_mihashira_desc: "내궁의 가장 깊은 성역 아래에 묻힌 신성한 중심 기둥인 신노미하시라의 파편입니다. 이세의 신비 중에서도 가장 비밀스럽고 성스러운 것으로 여겨지며, 시키넨 센구 재건이 진행될 때마다 새롭게 단장합니다."
 # Confucian
 artifact_relic_kong_tomb_name: "공자 묘비석"
 artifact_relic_kong_tomb_desc: "곡부에 있는 공자의 무덤에서 나온 석비입니다. 공씨 가문에서 대대로 숭배해 온 유물입니다."
 artifact_relic_analects_name: "공자의 논어"
 artifact_relic_analects_desc: "초기에 만들어진 논어 죽간입니다. 공자의 언행을 모은 경전으로, 중국 학자들이 수 세대에 걸쳐 연구해 왔습니다."
 # Hellenic
 artifact_relic_athena_promachos_name: "아테나 프로마코스 조각"
 artifact_relic_athena_promachos_desc: "한때 아크로폴리스를 굽어보던 거대한 아테나 동상에서 나온 청동 파편입니다."
 # West African
 artifact_relic_opa_oranmiyan_name: "오파 오란미얀"
 artifact_relic_opa_oranmiyan_desc: "전설적인 왕 오란미얀의 화강암 지팡이입니다. 요루바의 고대 기원으로 여겨지는 신성한 땅 이페에 세워졌습니다."
 artifact_relic_oshe_shango_name: "오쉐 샹고"
 artifact_relic_oshe_shango_desc: "오쉐 샹고는 머리가 두 개 달린 도끼로, 폭풍의 신 샹고의 쌍둥이 천둥석을 본따 만들어졌습니다. 제사장들이 황홀경 속에 춤을 추며 이 도끼를 높이 들어 올립니다."
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "신성한 우상"
 artifact_misc_relic_idol_desc: "조각된 우상으로, 의식이 진행되는 동안 신이 깃드는 신체입니다."
 artifact_misc_relic_stele_name: "선조 비석"
 artifact_misc_relic_stele_desc: "사제단의 혈통을 새긴 석판으로, 대를 이어 전해지는 증거입니다."
 artifact_misc_relic_mask_name: "의식용 가면"
 artifact_misc_relic_mask_desc: "드높은 의례에서 사용되는 의식용 가면으로, 신성한 존재가 깃드는 그릇입니다."
 artifact_misc_relic_banner_name: "신성한 깃발"
 artifact_misc_relic_banner_desc: "성지에서 거행된 모든 위대한 의식에 참석했던 축성된 깃발입니다. 그 천에는 바쳐진 제물의 연기가 가득 묻어 있습니다."
