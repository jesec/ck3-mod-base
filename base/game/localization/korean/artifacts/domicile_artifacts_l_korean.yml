 creature_type_lion_desc: "동물의 왕이자 용맹을 상징하는 짐승이 사슬에 묶여 굴복했습니다. 이제 우리 안에서 자신을 묶은 줄이 허락하는 만큼만 배회할 수 있는 신세가 되었습니다."
 creature_type_caracal_desc: "거대한 고양이를 닮은 짐승입니다. 우리 안을 맴돌며 장식용으로 배치해 둔 물건이 무엇이든 찢어발깁니다."
 creature_type_lynx_desc: "소심하지만 다부진 고양이입니다. 지면으로 몸을 낮추고 귀를 잔뜩 젖힌 채, 자기 자리 주변을 정신없이 살피느라 바쁩니다."
 creature_type_tiger_desc: "산짐승의 왕이라 불리는 무시무시한 동물입니다. 쉽게 화를 내며 송곳니를 드러내고, 방문객들을 겁에 질리게 합니다."
 creature_type_leopard_desc: "유연하며 우아하면서도 치명적인 동물입니다. 인내심 많고 영리한 생물로, 놀라운 도약력을 자랑합니다."
 creature_type_bear_desc: "흉포한 곰입니다. 느릿느릿 움직여 다니며 항상 먹을 것을 찾습니다. 그 거대한 발을 휘둘러 뼈를 나뭇가지처럼 부술 수 있습니다."
 creature_type_elephant_desc: "거대하지만 놀라울 만큼 온순한 동물입니다. 코를 매우 능숙하게 움직이며 모든 방문객을 놀라게 하고 재미를 줍니다."
 creature_type_peacock_desc: "품위 있고 자부심이 넘치는 새로, 독특한 울음소리를 냅니다. 그 어떤 정원에서도 눈부시게 빛이 납니다."
 creature_type_parrot_desc: "사람의 말을 흉내 낼 줄 아는 활기찬 짐승입니다. 문객을 즐겁게 해 주는 데 제격입니다."
 creature_type_crane_desc: "날렵한 날개를 가진 고귀한 새입니다. 행운과 영원한 젊음을 상징합니다."
 creature_type_cockatoo_desc: "밝은색 깃털을 가진 화려한 새입니다. 예리한 눈빛으로 영리하게 주변을 훑어봅니다."
 creature_type_monkey_desc: "이 사교성 넘치는 유인원은 그 행동과 표정이 놀라울 만큼 인간과 비슷하며, 사랑스러운 동료가 되어줍니다."
 creature_type_lion_reforged_desc: "동물의 왕이자 용맹의 상징입니다. $creature_history_entry$"
 creature_type_caracal_reforged_desc: "사나운 짐승입니다. $creature_history_entry$"
 creature_type_lynx_reforged_desc: "귀 끝에 뾰족한 털이 있는 거대한 고양잇과 짐승입니다. $creature_history_entry$"
 creature_type_tiger_reforged_desc: "산짐승의 왕이라 불리는 무시무시한 동물입니다. $creature_history_entry$"
 creature_type_leopard_reforged_desc: "점박이 무늬가 있는 거대한 고양잇과 동물입니다. $creature_history_entry$"
 creature_type_bear_reforged_desc: "흉포한 곰입니다. $creature_history_entry$"
 creature_type_elephant_reforged_desc: "거대하지만 놀라울 만큼 온순한 동물입니다. $creature_history_entry$"
 creature_type_peacock_reforged_desc: "품위 있고 자부심이 넘치는 새입니다. $creature_history_entry$"
 creature_type_parrot_reforged_desc: "화려한 이국의 새입니다. $creature_history_entry$"
 creature_type_crane_reforged_desc: "행운과 재산의 상징입니다. $creature_history_entry$"
 creature_type_cockatoo_reforged_desc: "밝은색 깃털을 가진 새입니다. $creature_history_entry$"
 creature_type_monkey_reforged_desc: "호기심 많은 짐승입니다. $creature_history_entry$"
 creature_history_entry: "한때 [artifact.MakeScope.Var('og_owner').Char.GetHouse.GetNameNoTooltip]의 동물원에 있었으며, 방문객에게 기쁨을 가져다주고 감탄을 불러일으켰습니다."
