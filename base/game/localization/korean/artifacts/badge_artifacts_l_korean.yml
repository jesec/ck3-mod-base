l_korean:
 #Pilgrim Badges
 maria_conch_name: "성모 마리아 고둥"
 maria_conch_description: "순례를 떠났을 때 받은 순례자 휘장입니다."
 maria_conch_description_protection: "[badge_location.GetProvince.GetBaronyNameExplicitly](으)로 순례를 떠났을 때 받은 보호의 순례자 휘장입니다."
 maria_conch_description_prosperity: "[badge_location.GetProvince.GetBaronyNameExplicitly](으)로 순례를 떠났을 때 받은 번영의 순례자 휘장입니다."
 santiago_badge_name: "성 야고보의 조가비"
 santiago_badge_description: "가리비 모양의 순례자 휘장입니다. 산티아고 데 콤포스텔라의 성지로 이어지는 카미노 데 산티아고를 걸었던 성 야고보의 길을 따르는 순례를 기념합니다."
 jerusalem_badge_name: "예루살렘 십자가"
 jerusalem_badge_description: "정사각형 십자가 모양의 순례자 휘장입니다. 우아하고 복잡한 상징으로, 성스러운 도시 예루살렘으로 향하는 순례를 기념합니다."
 rome_badge_name: "성 베드로의 열쇠"
 rome_badge_description: "후광으로 에워싸인 성 베드로와 성 바울로가 있는 열쇠 모양의 순례자 휘장입니다. 성스러운 도시 로마로 향하는 순례를 기념합니다."
 generic_badge_name_1: "매우 작은 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 휘장"
 generic_badge_name_2: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]의 기념품"
 generic_badge_name_3: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 상징"
 generic_badge_name_4: "섬세한 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 핀"
 protection_badge_name_1: "[newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]의 굳센 핀"
 protection_badge_name_2: "단단한 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 기념품"
 prosperity_badge_name_1: "광택 있는 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 장식품"
 prosperity_badge_name_2: "빛나는 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 휘장"
 prosperity_badge_name_3: "정교한 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 핀"
 virility_badge_name_1: "견고한 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 핀"
 virility_badge_name_2: "축복받은 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 장식품"
 wisdom_badge_name_1: "가려진 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 핀"
 wisdom_badge_name_2: "티 없는 [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] 장식품"
 generic_badge_protection_desc: "튼튼한 순례자 휘장입니다. [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]에서 획득했으며, 착용자에게 보호의 힘을 불어넣어 준다는 소문이 있습니다."
 generic_badge_prosperity_desc: "반짝이는 순례자 휘장입니다. [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]에서 획득했으며, 착용자에게 번영을 가져다준다는 소문이 있습니다."
 generic_badge_virility_desc: "열성의 빛을 담은 순례자 휘장입니다. [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]에서 획득했으며, 착용자에게 활력을 가져다준다는 소문이 있습니다."
 generic_badge_wisdom_desc: "신비로운 순례자 휘장입니다. [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]에서 획득했으며, 착용자에게 지혜와 명상의 힘을 가져다준다는 소문이 있습니다."
