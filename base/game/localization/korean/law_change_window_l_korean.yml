 LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T 승계법 변경 찬성#!\n[Character.GetShortUIName](은)는 [succession_law|E] 변경에 찬성하거나, 최소한 반대는 하지 않습니다.\n\n다음과 같은 이유 등으로 인해 찬성합니다.\n$BULLET_WITH_TAB$당신을 향해 긍정적인 [opinion|E]을 갖고 있음\n$BULLET_WITH_TAB$당신에게 [cowed|E]한 상태임\n$BULLET_WITH_TAB$(누군가에 의해) [imprisoned|E]된 상태임"
