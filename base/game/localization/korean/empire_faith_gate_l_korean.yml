l_korean:
 rule_empire_faith_gate: "개혁된 신앙에 의한 제국 작위 제한"
 setting_empire_faith_gate_on: "#high 활성화됨#!"
 setting_empire_faith_gate_no_hof_exempt: "#high 활성화됨#!, 지도자가 없는 경우 면제"
 setting_empire_faith_gate_off: "비활성화됨"
 setting_empire_faith_gate_on_desc: "[empire|E] [titles|E]를 창설하려면 [organized|E]된 [faith|E] 및 [head_of_faith|E]의 승인이 필요합니다. [feudal|E], [clan|E], [tribal|E] [rulers|E]에게 적용됩니다."
 setting_empire_faith_gate_no_hof_exempt_desc: "[empire|E] [titles|E]을 창설하려면 [organized|E] [faith|E]을 믿어야 하며 [head_of_faith|E]의 승인이 필요합니다. 단, [head_of_faith|E]가 없는 [faiths|E]은 승인 요건에서 면제됩니다. [feudal|E], [clan|E], [tribal|E] [rulers|E]에게 적용됩니다."
 setting_empire_faith_gate_off_desc: "일반적인 조건을 충족하면 누구나 [empire|E] [titles|E]를 창설할 수 있습니다."
 empire_faith_gate_organized_faith_required: "[empire|E]을 창설하려면 당신의 [faith|E]이 [organized|E] 상태여야 함"
 empire_faith_gate_hof_spiritual_good_terms: "[head_of_faith|E]와 우호적인 관계여야 함"
 empire_faith_gate_hof_temporal_is_hof: "당신이 [head_of_faith|E]"
 empire_faith_gate_hof_temporal_good_terms: "[head_of_faith|E]가 당신을 향해 긍정적인 [opinion|E]을 보유해야 함"
 empire_faith_gate_powerful_vassals_approve: "대다수의 [powerful_vassals|E]이 당신을 향해 긍정적인 [opinion|E]을 보유해야 함 #weak ([THIS.Char.MakeScope.ScriptValue('powerful_vassals_positive_opinion_value')|0]/[THIS.Char.MakeScope.ScriptValue('powerful_vassals_count_value')|0])#!"
 empire_faith_gate_contested_legitimacy_applied: "대립 제국"
 empire_faith_gate_contested_legitimacy_applied_desc: "[THIS.Char.GetShortUINamePossessive|U], 그리고 [SCOPE.sC('efg_other_emperor').GetShortUINamePossessive] [empires|E]이 이제 패권을 두고 대립합니다."
 empire_faith_gate_create_title_contested_warning_1: "@warning_icon! #warning 당신의 [faith|E]에 속한 또 다른 독립 [empire|E]이 이미 존재하므로, 이 [empire|E]을 창설하면 3년 뒤 [GetModifier( 'multi_empire_same_faith_penalty_1' ).GetNameWithTooltip|L] [modifier|E]를 받게 됩니다.#!"
 empire_faith_gate_create_title_contested_warning_2: "@warning_icon! #warning 당신의 [faith|E]에 속한 다수의 독립 [empire|E]이 이미 존재하므로, 이 [empires|E]을 창설하면 3년 뒤 [GetModifier( 'multi_empire_same_faith_penalty_2' ).GetNameWithTooltip|L] [modifier|E]를 받게 됩니다.#!"
 empire_faith_gate_create_title_contested_warning_3: "@warning_icon! #warning 당신의 [faith|E]에 속한 여러 독립 [empire|E]이 이미 존재하므로, 이 [empires|E]을 창설하면 3년 뒤 [GetModifier( 'multi_empire_same_faith_penalty_3' ).GetNameWithTooltip|L] [modifier|E]를 받게 됩니다.#!"
 empire_faith_gate_create_title_contested_warning_1_inline: "\n\n$empire_faith_gate_create_title_contested_warning_1$"
 empire_faith_gate_create_title_contested_warning_2_inline: "\n\n$empire_faith_gate_create_title_contested_warning_2$"
