 dissolve_empire_war_desc: "우리 [faith|E]의 [excommunicated|E]당한 [ruler|E]의 [empire|E]을 해체하기 위해 전쟁을 선포합니다."
 dissolve_empire_war_victory_desc: "[excommunicated|E]당한 [emperor|E]이 [empire|E] [title|E]를 박탈당하며, 해당 작위는 파괴됩니다."
 dissolve_empire_war_victory_desc_defender: "[empire|E]이 해체되었습니다. [empire|E] [title|E]가 파괴됩니다."
 dissolve_empire_war_white_peace_desc: "전쟁은 결론 없이 끝났습니다. 어느 쪽도 우위를 점하지 못했습니다."
 dissolve_empire_war_white_peace_desc_defender: "[empire|E] 해체 전쟁이 결론을 내지 못하고 종료되었습니다."
 dissolve_empire_war_defeat_desc: "[empire|E]을 해체하려는 시도가 실패했습니다."
 dissolve_empire_war_defeat_desc_attacker: "[empire|E]을 해체하려는 우리의 시도가 실패했습니다. 그 대가를 치르게 될 것입니다."
 dissolve_empire_war_defeat_desc_defender: "[empire|E]을 해체하려는 시도가 격퇴되었습니다."
 dissolve_empire_war_invalidated_no_excommunication: "방어자가 더 이상 [excommunicated|E]자가 아닙니다."
 dissolve_empire_war_invalidated_no_empire: "방어자가 더 이상 [empire|E] [title|E]를 보유하지 않습니다."
 game_concept_dissolve_empire_casus_belli: "$dissolve_empire_war$"
 game_concept_dissolve_empire_casus_belli_desc: "같은 [faith|E]의 [ruler|E]가 [excommunicated|E]당한 [emperor|E]에게 [war|E]을 선포하고, 승리 시 해당 [empire|E] [title|E]를 파괴할 수 있게 하는 [casus_belli|E]입니다."
 multi_empire_same_faith_penalty_1: "대립 패권"
 multi_empire_same_faith_penalty_1_desc: "같은 [faith|E]의 다른 [emperor|E]가 우리 [empire|E]의 패권에 도전합니다"
 multi_empire_same_faith_penalty_2: "도전받는 패권"
 multi_empire_same_faith_penalty_2_desc: "같은 [faith|E]의 다수의 [emperors|E]가 우리 [empire|E]의 패권에 도전합니다"
 multi_empire_same_faith_penalty_3: "분열된 패권"
 multi_empire_same_faith_penalty_3_desc: "같은 [faith|E]의 여러 [emperors|E]가 우리 [empire|E]의 패권을 분열시킵니다"
 action_efg_request_excommunication: "@hof_icon! 당신의 신앙에 제국이 너무 많습니다"
 action_efg_request_excommunication_label: "@hof_icon! 당신의 신앙에 제국이 너무 많습니다"
 action_efg_request_excommunication_desc: "[recipient.GetShortUIName|U](은)는 당신의 [faith|E]에 속한 대립 [empire|E]를 다스리며, 당신이 유일한 정통 [emperor|E]라는 당신의 주장을 위협하고 있습니다.\n\n#help 당신의 [head_of_faith|E] [secondary_recipient.GetShortUIName]에게 [recipient.GetHerHim]의 파문을 요청하십시오. [excommunicated|E]당한 황제는 [dissolve_empire_casus_belli|E] [casus_belli|E]의 대상으로 공격할 수 있으며, 이를 통해 상대 [empire|E]를 파괴할 수 있습니다.#!"
 action_efg_request_excommunication_click: "#I 클릭하여 $request_excommunication_interaction$ 열기#!"
 action_efg_request_excommunication_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNoTooltip]"
 action_efg_request_excommunication_combined_group_name: "@hof_icon! 당신의 신앙에 제국이 너무 많습니다"
 action_efg_request_excommunication_combined_group_label: "@hof_icon! 당신의 신앙에 제국이 너무 많습니다"
 action_efg_request_excommunication_combined_group_description: "당신의 [faith|E]에 속한 여러 대립 [emperors|E]가, 당신이 유일한 정통 [emperor|E]라는 당신의 주장을 위협하고 있습니다.\n\n#help 당신의 [head_of_faith|E] [secondary_recipient.GetShortUIName]에게 대립 황제들의 파문을 요청하십시오. [excommunicated|E]당한 황제는 [dissolve_empire_casus_belli|E]의 대상으로 공격할 수 있으며, 이를 통해 상대 [empire|E]을 파괴할 수 있습니다.#!"
 empire_faith_gate_panel_organized_faith: "당신이 [organized|E]된 [faith|E]에 속함"
 empire_faith_gate_panel_hof_approval: "당신이 [head_of_faith|E]의 인정을 받음"
 empire_faith_gate_panel_vassals_approve: "당신의 [powerful_vassals|E] 대다수가 당신을 지지함"
 empire_faith_gate_reformation_piety_level: "[piety_level|E]가 [GetModifier( 'piety_level_2' ).GetNameWithTooltip|L] 이상이어야 함"
 empire_faith_gate_reformation_tribal_authority: "$game_concept_absolute_tribal_authority$을 보유해야 함"
 empire_faith_gate_reformation_holy_site: "최소 세 곳의 [holy_sites|E]가 해당 [faith|E] 인물의 소유여야 함"
 empire_faith_gate.0002.t: "진정한 황제"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUIName](은)는 오직 나만이 가져야 할 황제의 존엄을 주장하고 있다. 이를 묵과한다면 신자들은 머지않아 내 [legitimacy|E]을 의심하게 될 것이다."
 empire_faith_gate.0002.a: "소문을 퍼뜨려라. [efg_primary_rival.GetHerHis|U] 제국은 나의 제국보다 오래가지 못할 것이다."
 empire_faith_gate.0002.b: "우리 신앙에는 단 하나의 진정한 황제만 존재한다. 바로 나다."
 empire_faith_gate.0002.c: "때가 무르익으면 움직이겠다."
 efg_contested_wrath: "기사단 선전"
 efg_contested_wrath_desc: "대립 황제에 맞서 우리 제국의 정통성을 전파하도록 기사들을 활용함으로써, 전사들의 사기를 북돋우고 대중의 존경을 얻고 있습니다."
 efg_divine_mandate: "신성한 명분"
 efg_divine_mandate_desc: "세속의 모든 경쟁자 위에서 신성한 권위를 선포함으로써, 신자들이 우리에게 결집하고 있습니다."
 efg_contested_patience: "인내의 결집"
 efg_contested_patience_desc: "내부를 다지는 데 집중함으로써, 적절한 순간을 기다리는 동안 우리의 봉역은 매 순간 더 강해지고 있습니다."
