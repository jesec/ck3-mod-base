 trade_category_non_construction: "자재 제외 상품"
 trade_category_non_construction_desc: "건설 자재를 제외한 모든 무역품을 포함하며, 목재, 삼, 석재는 포함하지 않습니다."
 trade_category_non_food: "식품 제외 상품"
 trade_category_non_food_desc: "기초 식품을 제외한 모든 무역품을 포함하며, 곡물, 잡곡, 쌀, 과일, 육류, 생선, 치즈는 포함하지 않습니다."
 trade_category_non_medicinal: "약품 제외 상품"
 trade_category_non_medicinal_desc: "약품을 제외한 모든 무역품을 포함합니다."
 trade_category_non_luxury: "사치 제외 상품"
 trade_category_non_luxury_desc: "비단, 향신료, 장신구, 치즈, 과일, 기름, 꿀, 차 등 사치품과 기호품을 제외한 모든 무역품을 포함합니다."
 trade_category_food: "기본 음식"
 trade_category_food_desc: "곡물, 조, 쌀, 과일, 육류, 생선, 치즈를 비롯하여, 모든 인구를 지탱하는 필수 식량입니다. 안정적인 식량 공급은 모든 정착지와 군대, 가정이 유지되기 위한 첫 번째 조건입니다."
 trade_category_beasts_of_burden: "사역 동물"
 trade_category_beasts_of_burden_desc: "말과 소를 비롯한 농업과 운송에 필수적인 가축입니다. 이들은 농경을 돕고 물자를 운반하며, 모든 봉역의 농촌 경제를 떠받칩니다."
 trade_category_minerals: "광물"
 trade_category_minerals_desc: "금속, 보석, 소금, 명반을 비롯하여 광산과 채석장을 통해 땅에서 얻는 자원입니다. 이는 모든 산업이 의존하는 대장간, 조폐소, 공방에 공급됩니다."
 trade_category_luxury: "사치"
 trade_category_luxury_desc: "비단과 향신료, 상아와 보석에 이르기까지, 부유하고 권력 있는 이들이 탐내는 희귀하고 값비싼 물품입니다. 이는 위신과 세련됨의 상징이며, 가장 번영한 궁정만이 이를 감당할 수 있습니다."
 trade_category_refined_goods: "가공품"
 trade_category_alcohol: "주류"
 trade_category_alcohol_desc: "맥주와 포도주는 단순한 기호품을 넘어선 존재입니다. 오염된 물을 대신할 안전한 음료이자 종교적 성례에 사용되며, 술집과 궁정에서는 사회생활에 필수적인 요소로 여겨집니다."
 trade_category_liqour_raw_materials: "증류"
 trade_category_precious_metals: "귀금속"
 trade_category_precious_metals_desc: "은과 금은 조폐소와 국고를 떠받치는 핵심 자원입니다. 귀금속은 화폐로 사용될 뿐 아니라 정교한 공예품 제작과 신분 과시에 필수적인 재료이기도 합니다."
 trade_category_jewelry_materials: "귀석"
 trade_category_jewelry_materials_desc: "보석과 호박석, 상아, 옥을 비롯한 희귀하고 이국적인 원료들로, 아름다움 때문에 높은 가치를 지닙니다. 이들은 고가에 거래되며 사치 공예품과 종교 장식품 제작에 필수적인 재료입니다."
 trade_category_crops: "작물"
 trade_category_crops_desc: "곡물과 사탕수수, 목화, 아마를 비롯한 경작 작물입니다. 정성껏 가꾼 밭과 관개 시설을 통해 재배되며, 농경 공동체를 지탱하는 풍요의 기반을 이룹니다."
 trade_category_base_metals: "기본 금속"
 trade_category_base_metals_desc: "철과 구리는 산업과 전쟁을 떠받치는 실용적인 금속입니다. 철은 무기와 도구, 갑옷 제작에 사용되며, 구리는 합금 제조와 일상적인 금속 세공에 필수적입니다."
 trade_category_cereals: "곡물"
 trade_category_cereals_desc: "곡물과 조, 쌀을 비롯한 주요 식량 작물입니다. 곡물은 모든 식단의 기반을 이루며 가장 널리 거래되는 상품 중 하나로, 도시와 군대를 먹여 살리는 데 필수적입니다."
 trade_category_meat: "육류"
 trade_category_meat_desc: "저장하거나 염장한 육류와 생선입니다. 단백질이 풍부한 이러한 식량은 가정과 주둔지, 그리고 신선한 식량을 구하기 어려운 장거리 항해를 떠받칩니다."
 trade_category_comforts: "생활용품"
 trade_category_comforts_desc: "치즈와 과일, 올리브유, 꿀, 차처럼 단순한 생존을 넘어 일상생활의 풍요를 더하는 식품입니다. 이러한 물품은 삶의 질을 높여 주며, 모든 정착 공동체에서 꾸준한 수요를 지닙니다."
 trade_category_clothes: "의류"
 trade_category_clothes_desc: "직물과 모피, 가죽을 비롯한 의복과 의류 재료입니다. 거친 작업복에서 고급 의상에 이르기까지, 옷은 모든 봉역의 주민에게 필수적인 생필품입니다."
 trade_category_luxury_consumption: "사치 소비재"
 trade_category_luxury_consumption_desc: "설탕과 향신료를 비롯하여, 먼 나라에서 들여오는 값비싸고 수요가 높은 물품입니다. 이러한 물품은 음식의 풍미를 더하고 약재로도 쓰이지만, 소수의 특권층만이 이를 누릴 수 있습니다."
 trade_category_luxury_items: "사치품"
 trade_category_luxury_items_desc: "도자기와 유리, 보석, 칠기, 비단을 비롯한 지위와 문화를 상징하는 정교한 물품입니다. 이는 번영하고 세련된 궁정의 상징입니다."
 trade_category_construction_materials: "건설 자재"
 trade_category_mandala_arms: "기본 무기"
 trade_category_mandala_arms_desc: "주로 구리와 목재로 이루어진, 군대를 무장시키기 위한 기본 재료입니다. 이는 더욱 강력한 단조 무기를 갖추지 못한 봉역에 창과 방패를 비롯한 기초적인 전쟁 도구를 제공합니다."
 trade_category_carpentry_supplies: "목공품"
 trade_category_carpentry_supplies_desc: "목재와 삼으로 이루어진 건축과 항해의 원재료입니다. 목재는 건물과 선박의 골조를 이루며, 삼은 해상 무역에 필수적인 밧줄과 삭구 제작에 쓰입니다."
 trade_category_rural_goods: "지역 상품"
 trade_category_rural_goods_desc: "작물과 가축, 목재, 그리고 땅속에서 캐낸 귀중한 광물을 아우르는 농촌의 산물입니다. 이는 농촌에서 생산되어 이를 가공하는 도시와 마을로 흘러 들어가는 원자재입니다."
 trade_category_agricultural_goods: "농산물"
 trade_category_agricultural_goods_desc: "곡물과 섬유부터 포도주와 꿀, 가축에 이르기까지 농장과 경작지에서 생산되는 모든 산물입니다. 이러한 상품은 정착 농업 경제의 폭넓은 생산력을 보여 줍니다."
 trade_category_bast_fibres: "인피섬유"
 trade_category_fabrics: "직물"
 trade_category_fabrics_desc: "양모와 목화, 아마를 비롯한 섬유 원료입니다. 이는 농산물과 완성된 직물 사이의 중간재로, 봉역 전역의 직조 공방에 공급됩니다."
 trade_category_guild_goods: "조합 상품"
 trade_category_guild_goods_desc: "맥주와 직물, 유리, 보석 등을 비롯해 도시 조합의 공방에서 생산되는 정교한 공예품입니다. 이는 노련한 숙련공들이 만들어 내는 완성품입니다."
 trade_category_cheap_common: "일상품"
 trade_category_cheap_common_desc: "곡물과 생선부터 목재와 석재에 이르기까지, 거의 모든 시장에서 찾아볼 수 있는 저렴하고 흔한 상품입니다. 낮은 가격과 풍부한 공급 덕분에 지역 교역의 일상적인 기반을 이룹니다."
 trade_category_fine_goods: "고급 상품"
 trade_category_fine_goods_desc: "세계의 거대한 시장을 오가는 고가의 상품입니다. 이는 부와 지위, 그리고 문명화된 삶을 상징하는 재화입니다."
 trade_category_staple_goods: "기반 상품"
 trade_category_staple_goods_desc: "도시와 군대를 떠받치는 대량 소비 상품입니다. 사람들이 모여 사는 곳이라면 어디든 이러한 물자가 흘러들어야 합니다."
 trade_category_stone: "석재"
 trade_category_stone_desc: "요새와 교회, 공공 시설을 건설하는 데 사용되는 채석 석재입니다. 현지 매장량이 부족한 지역에서는 대규모 건축 사업을 위해 반드시 수입해야 합니다."
 trade_category_salt: "소금"
 trade_category_salt_desc: "식품 보존과 식생활에 필수적인 광물입니다. 소금은 육류와 생선을 저장하고 가죽을 무두질하는 데 쓰이며, 고대부터 장거리 교역을 이끄는 주요 상품이었습니다."
 trade_category_alum: "명반"
 trade_category_alum_desc: "염료를 직물에 고착시키는 매염제로 주로 사용되는 다용도 광물성 염류입니다. 무두질과 의약 분야에도 활용되며, 희소성 때문에 전략적 가치가 높은 상품입니다."
 trade_category_dyes: "염료"
 trade_category_dyes_desc: "식물과 광물, 곤충에서 얻는 선명한 색소입니다. 염료는 직물의 염색부터 도자기의 유약 처리, 화려한 필사본 제작에 이르기까지 다양한 공예 분야에서 사용됩니다."
 trade_category_books: "서적"
 trade_category_books_desc: "필사본과 그것이 기록되는 종이 및 양피지입니다. 서적은 교육과 행정, 지식의 전승에 핵심적인 역할을 하며, 문해력이 퍼진 곳이라면 어디서든 수요가 있습니다."
 trade_category_incense: "향"
 trade_category_incense_desc: "세계 각지의 종교 의식에서 태우는 향기로운 수지와 혼합물입니다. 독실한 공동체라면 어디서든 교회와 사원, 성소를 유지하기 위해 안정적인 공급이 필수적입니다."
 trade_category_medicaments: "의약품"
 trade_category_medicaments_desc: "의사와 치유사들이 사용하는 치료제와 약초, 의약 화합물입니다. 의약품의 공급은 질병과 부상으로 인한 피해를 줄여 주며, 성장하는 모든 정착지에 필수적입니다."
 trade_good_wood: "목재"
 trade_good_wood_desc: "목재는 주택과 선박, 가구 제작에 필수적인 건축 자재입니다. 질 좋고 단단한 나무는 언제나 현지에서 구할 수 있는 것이 아니므로, 삼림 지대에서 수입해야 할 수도 있습니다."
 trade_good_stone: "석재"
 trade_good_stone_desc: "석회암과 사암, 대리석 광맥에서 채굴되는 석재는 대규모 건축에 필수적인 자원입니다. 무겁고 운송 비용이 많이 들기 때문에, 천연 산지가 아닌 지역에서는 부족한 경우가 잦습니다."
 trade_good_wool: "양모"
 trade_good_wool_desc: "양의 털을 깎아 세척한 양모는 중세 유럽에서 가장 중요한 섬유 자원이었습니다. 양모는 실로 방적되고 직물로 짜여, 거대한 직조 산업의 원료가 됩니다."
 trade_good_cotton: "면"
 trade_good_cotton_desc: "인도에서 이집트까지 각종 온난한 지역에서 재배되는 목화는 양모보다 가볍고 통기성이 뛰어난 섬유를 제공합니다. 방적과 직조를 거친 목화는 이슬람 세계를 비롯한 여러 지역의 직물 교역을 떠받치는 기반입니다."
 trade_good_leather: "가죽"
 trade_good_leather_desc: "동물 생가죽을 무두질하여 만든, 질기고 가공하기 쉬운 재료입니다. 가죽은 장화와 허리띠, 안장, 갑옷, 책 제본 등에 사용되며 모든 문화권에서 기본적인 공예 재료로 쓰입니다."
 trade_good_flax: "아마"
 trade_good_flax_desc: "아마는 아마포 섬유와 씨앗에서 추출하는 아마인유를 얻기 위해 재배되는, 인류가 가장 오래전부터 길러 온 작물 가운데 하나입니다. 수확에는 많은 노동력이 필요하지만 다른 섬유 작물만큼 재배 조건이 까다롭지 않아 거의 어디서나 기를 수 있습니다."
 trade_good_hemp: "삼"
 trade_good_hemp_desc: "질긴 섬유를 얻기 위해 재배되는 다용도 식물입니다. 삼 섬유는 밧줄로 꼬거나 돛천으로 짜고, 선박의 틈새를 메우는 데에도 사용됩니다. 삼은 해양 경제와 건축 산업 전반에 필수적인 자원입니다."
 trade_good_salt: "소금"
 trade_good_salt_desc: "소금은 염전과 암염 광산, 염수 샘에서 얻는 필수 보존제이자 식생활에 필요한 광물입니다. 부패를 막는 뛰어난 효능 덕분에, 역사상 가장 꾸준히 거래된 상품 가운데 하나로 자리 잡았습니다."
 trade_good_grain: "곡물"
 trade_good_grain_desc: "빵과 죽을 만드는 밀가루로 제분되는 곡물은 중세 세계에서 가장 중요한 작물입니다. 서방의 밀에서 북방의 호밀에 이르기까지, 곡물은 농민과 귀족 모두를 먹여 살립니다."
 trade_good_fruit: "과일"
 trade_good_fruit_desc: "생과일과 건과일은 중세인의 식단에 단맛과 다양성을 더해 줍니다. 사과와 배, 무화과 같은 과수원 작물은 북방의 수요를 충족하기 위해 따뜻한 지역에서 거래됩니다."
 trade_good_meat: "염장육"
 trade_good_meat_desc: "염장하거나 훈제하고 건조하여 부패를 막은 육류는 중요한 단백질 공급원입니다. 이는 원정 중인 군대와 식량이 부족한 겨울철의 가정을 떠받칩니다."
 trade_good_fish: "생선"
 trade_good_fish_desc: "건조하거나 염장하고 훈제한 생선은 오랫동안 상하지 않아 해안이나 강에서 멀리 떨어진 지역에서도 중요한 단백질 공급원이 됩니다. 특히 청어와 대구는 장거리 해상 교역을 이끄는 핵심 상품이었습니다."
 trade_good_cattle: "소"
 trade_good_cattle_desc: "소는 밭을 가는 데 필요한 힘을 제공할 뿐 아니라 우유와 고기, 가죽도 생산합니다. 소는 가장 다재다능한 가축이며, 우수한 품종을 확보하는 것은 농업 경제의 모든 면에 도움이 됩니다."
 trade_good_horses: "말"
 trade_good_horses_desc: "말은 중세 세계의 대표적인 역용 및 승용 동물로, 농업과 운송, 전쟁에 필수적입니다. 특히 초원 지대와 이베리아산 우수 품종은 높은 가치를 인정받았습니다."
 trade_good_cheese: "치즈"
 trade_good_cheese_desc: "우유를 응고시키고 숙성하여 만드는 저장성 유제품입니다. 치즈는 신선한 우유보다 훨씬 오래 보관할 수 있으며, 계절과 관계없이 안정적인 지방과 단백질 공급원이 됩니다."
 trade_good_beer: "맥주"
 trade_good_beer_desc: "곡물을 발효해서 빚은 맥주는 북유럽의 일상적인 음료입니다. 도수는 낮지만 영양가가 높으며, 많은 도시에서는 물보다 안전하게 마실 수 있어 사회 전 계층에서 소비됩니다."
 trade_good_wine: "포도주"
 trade_good_wine_desc: "포도를 발효해서 만드는 포도주는 교회와 귀족, 부유층의 음료로서 중세 문화에서 특별한 위치를 차지했습니다. 지중해와 라인 계곡의 포도밭에서 생산되어 널리 거래됩니다."
 trade_good_oil: "올리브유"
 trade_good_oil_desc: "올리브에서 짜낸 이 기름은 지중해 세계 전역에서 식용 유지이자 등잔 연료, 비누의 원료로 사용됩니다. 북쪽 지역으로 갈수록 그 중요성은 줄어들며, 동물성 지방과 버터가 이를 대신합니다."
 trade_good_honey: "꿀"
 trade_good_honey_desc: "꿀은 중세 세계의 대표적인 감미료였으며, 벌꿀술과 의약품, 식품 보존에도 사용되었습니다. 양봉은 세계 곳곳에서 이루어지지만, 품질 좋은 꿀은 높은 가격에 거래됩니다."
 trade_good_rice: "쌀"
 trade_good_rice_desc: "남아시아와 동아시아를 대표하는 곡물인 쌀은 물이 가득한 논과 따뜻한 기후를 필요로 하지만, 매우 풍부한 수확량을 자랑합니다. 쌀은 방대한 인구의 식생활 기반을 이룹니다."
 trade_good_millet: "수수"
 trade_good_millet_desc: "척박한 토양과 건조한 기후에서도 잘 자라는 강인한 곡물 작물입니다. 수수는 아프리카와 중앙아시아, 인도의 건조한 지역에서 주요 식량으로 소비됩니다."
 trade_good_iron: "쇠"
 trade_good_iron_desc: "중세 세계를 떠받치는 핵심 금속인 쇠는 광석을 제련하여 도구와 무기, 편자, 못을 만드는 데 사용됩니다. 장인과 병사들에게 쇠가 꾸준히 공급되지 않는다면 어떤 정착지도 성장할 수 없습니다."
 trade_good_alum: "명반"
 trade_good_alum_desc: "명반은 지혈, 유리 마감, 가죽 무두질 등에 쓰이는 희귀한 염류입니다. 가장 중요한 용도는 매염제로, 직물을 표백하고 염료가 직물에 훨씬 잘 달라붙도록 해 줍니다.\n\n명반은 중동과 같은 따뜻한 지역에서는 천연 상태로 발견되며, 세계 다른 지역에서는 명반석에서 추출할 수도 있습니다."
 trade_good_jade: "옥"
 trade_good_jade_desc: "옥은 동아시아에서 중요한 문화적 의미를 지닌, 단단하고 아름다운 광물입니다. 각종 도구와 장신구, 의례용 물품 제작에 사용됩니다. 중국 궁정에서는 막대한 값에 거래되며, 덕행과 지위의 상징으로 여겨집니다."
 trade_good_gold: "금"
 trade_good_gold_desc: "금속 가운데 가장 귀한 금은 왕실 국고와 최고 가치 화폐의 기반입니다. 희소성과 광택 덕분에 왕관과 성유물, 장식품 제작에 선호되는 재료입니다."
 trade_good_silver: "은"
 trade_good_silver_desc: "화폐용 금속으로 가장 널리 쓰이는 은은 주화로 주조되어 알려진 세계 전역에서 유통됩니다. 화폐 외에도 보석과 식기, 아름다운 종교 용품 제작에 사용됩니다."
 trade_good_amber: "호박"
 trade_good_amber_desc: "주로 발트해 연안에서 발견되는 화석화된 수지인 호박석은 고대부터 거래되어 왔습니다. 따뜻한 황금빛 색감과 뛰어난 가공성 덕분에 구슬과 펜던트, 장식품 재료로 귀하게 여겨집니다."
 trade_good_copper: "구리"
 trade_good_copper_desc: "구리는 무르고 가공하기 쉬운 성질 때문에 조리용 그릇과 교회 종, 청동과 황동 같은 합금 제작에 사용됩니다. 따뜻한 색감 덕분에 장식용 금속 세공에도 널리 쓰입니다."
 trade_good_gems: "보석"
 trade_good_gems_desc: "루비와 사파이어, 에메랄드를 비롯한 보석은 모든 무역로에서 가장 가치 있는 상품 가운데 하나입니다. 세공과 연마를 거친 보석은 왕관과 성유물함, 권력자들의 장신구를 장식합니다."
 trade_good_silk: "비단"
 trade_good_silk_desc: "모든 섬유 가운데 가장 고급스러운 비단은 누에고치에서 뽑은 실로 짜며, 뛰어난 부드러움과 광택을 자랑합니다. 중국에서 시작된 비단은 세계에서 가장 가치 있는 교역품 중 하나입니다."
 trade_good_textiles: "방직물"
 trade_good_textiles_desc: "양모와 목화, 아마, 혼합 섬유로 짠 직물입니다. 고급 방직물은 중세 세계에서 가장 활발하게 거래되는 상품 가운데 하나였으며, 플랑드르와 이탈리아, 중동의 공방들이 특히 유명했습니다."
 trade_good_furs: "모피"
 trade_good_furs_desc: "북방의 숲에서 포획한 여우와 담비, 검은담비, 비버 등의 가죽입니다. 모피 의복은 부와 지위의 상징이며, 귀족 궁정의 수요가 막대한 이익을 낳는 교역을 이끌고 있습니다."
 trade_good_books_paper: "서적 & 종이"
 trade_good_books_paper_desc: "손으로 필사한 문서와 그것을 기록하는 양피지 및 종이입니다. 서적은 법전과 종교 문헌, 축적된 지식을 보존하며, 행정과 학문이 발달한 곳이라면 어디서든 수요가 있습니다."
 trade_good_spices: "향신료"
 trade_good_spices_desc: "후추와 계피, 정향, 육두구를 비롯한 남아시아와 동남아시아산 향신료는 세계에서 가장 가치 있는 상품 가운데 하나입니다. 향신료는 음식을 보존하고 풍미를 더하며, 부의 상징으로 여겨집니다."
 trade_good_tea: "차"
 trade_good_tea_desc: "차나무의 잎을 말리고 가공해 만드는 차는 극동 지역을 대표하는 음료입니다. 차는 비단길을 따라 서쪽으로 전파되었으며, 독자적인 교역품으로서 중요성을 얻었습니다."
 trade_good_dyes: "염료"
 trade_good_dyes_desc: "쪽과 꼭두서니 같은 식물, 케르메스 같은 곤충, 그리고 각종 광물에서 추출한 색소입니다. 염료는 직물과 도자기, 채색 필사본에 선명한 색을 더하며, 이를 필요로 하는 공예 산업에 필수적인 자원입니다."
 trade_good_jewelry: "장신구"
 trade_good_jewelry_desc: "귀금속에 보석과 법랑, 유리를 결합해 만든 완성품입니다. 장신구는 중세 세계에서 개인의 부를 가장 잘 드러내는 상징이며, 선물이나 외교적 증표로도 사용됩니다."
 trade_good_ivory: "상아"
 trade_good_ivory_desc: "코끼리 이빨을 깎아 만든 상아는 위신과 신앙심을 상징하는 재료입니다. 상아는 장식 조각과 체스 말, 성유물함 장식판, 그리고 가장 화려한 장식품 제작에 사용됩니다."
 trade_good_glass: "유리"
 trade_good_glass_desc: "불어서 성형한 유리 용기와 창유리, 장식품입니다. 베네치아와 이슬람 세계의 정교한 유리 공예품은 높은 가격에 거래되며, 보다 단순한 유리 제품도 교회와 부유한 가정에서 점차 널리 사용되고 있습니다."
 trade_good_sugar: "설탕"
 trade_good_sugar_desc: "따뜻한 남부 지역에서 재배한 사탕수수를 정제해 얻는 설탕은 희귀하고 값비싼 사치품입니다. 설탕은 감미료와 약재로 쓰일 뿐 아니라, 부유층의 주방에서 신분을 드러내는 재료로도 사용됩니다."
 trade_good_incense: "향"
 trade_good_incense_desc: "유향과 몰약 같은 향기로운 수지로, 여러 종교의 의식에서 태워집니다. 향을 생산하려면 따뜻한 기후와 특정 수종이 필요하며, 아라비아와 에티오피아, 인도 등지에서 수출됩니다."
 trade_good_ceramics: "도자기"
 trade_good_ceramics_desc: "뛰어난 장인 정신과 예술성을 바탕으로 제작된 고급 도기와 자기입니다. 중국과 이슬람 세계의 우수한 도자기는 수요가 높은 사치품이자 장식품으로 여겨집니다."
 trade_good_lacquerware: "칠기"
 trade_good_lacquerware_desc: "옻칠 수지를 여러 겹 입혀 만든 물품으로, 동아시아에서는 뛰어난 내구성과 광택으로 높이 평가받습니다. 칠기 상자와 쟁반, 가구는 실크로드를 따라 멀리까지 수출되는 고급 상품입니다."
 trade_good_medicaments: "의약품"
 trade_good_medicaments_desc: "의사와 약제상들이 사용하는 다양한 건조 약초와 광물 화합물, 가공 약품입니다. 의약품의 확보는 상처 치료와 질병 관리, 그리고 건강한 인구 유지에 매우 중요합니다."
