 trade_category_forest_goods_desc: "영토의 내륙 지역에서 동물을 포획하거나 나무를 벌목하거나 자원을 채취하여 얻는 상품입니다.\n\n이 상품을 생산하는 [resource_districts|E]:\n$BULLET_WITH_TAB$[GetDistrictType('forestry_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('furs_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('honey_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('ivory_district').GetName]"
