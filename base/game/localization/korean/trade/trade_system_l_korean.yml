 trade_category_farmed_goods_desc: "현지에서 농작물을 재배하거나 가축을 사육하여 생산한 뒤 수출하는 상품입니다.\n\n이 상품을 생산하는 [resource_districts|E]:\n$BULLET_WITH_TAB$[GetDistrictType('grain_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('rice_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('millet_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('cattle_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('horses_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('wool_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('cotton_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('flax_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('hemp_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('fruit_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('sugar_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('wine_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('oil_district').GetName]"
 trade_category_farmed_goods_name: "농경 자원 상품"
 trade_category_cultivated_luxuries: "특용 자원 상품"
 trade_category_cultivated_luxuries_desc: "넓은 경작지보다는 전문 재배 농장에서 주로 생산되는 상품입니다.\n\n이 상품을 생산하는 [resource_districts|E]:\n$BULLET_WITH_TAB$[GetDistrictType('silk_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('spices_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('tea_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('incense_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('medicaments_district').GetName]"
 trade_category_cultivated_luxuries_name: "특용 자원 상품"
 trade_category_artisanal_goods: "가공 자원 상품"
 trade_category_artisanal_goods_desc: "수출하기 전에 현지 공동체에서 다른 대부분의 상품보다 더 많은 가공을 거치는 상품입니다.\n\n이 상품을 생산하는 [resource_districts|E]:\n$BULLET_WITH_TAB$[GetDistrictType('dyes_district').GetName]\n$BULLET_WITH_TAB$[GetDistrictType('ceramics_district').GetName]"
