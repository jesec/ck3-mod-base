 piety_level_dread_or_hook_tt: "[actor.GetShortUIName|U](은)는 다음 중 하나를 충족해야 함:\n$EFFECT_LIST_BULLET$[piety_level|E] @piety_level_2_icon_christian![GetModifier( 'piety_level_2' ).GetNameWithTooltip] 이상 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]에 대한 @weak_hook_icon![hook|E] 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName](을)를 [intimidated_i][intimidated|E]당한 상대로 만듦"
 piety_level_3_dread_or_hook_tt: "[actor.GetShortUIName|U](은)는 다음 중 하나를 충족해야 함:\n$EFFECT_LIST_BULLET$[piety_level|E] @piety_level_3_icon_christian![GetModifier( 'piety_level_3' ).GetNameWithTooltip] 이상 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]에 대한 @weak_hook_icon![hook|E] 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName](을)를 [terrified_i][cowed|E]하게 만듦\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive] [head_of_faith|E] 또는 [challenger_hof|E] 되기"
 piety_level_4_dread_or_strong_hook_tt: "[actor.GetShortUIName|U](은)는 다음 중 하나를 충족해야 함:\n$EFFECT_LIST_BULLET$[piety_level|E] @piety_level_4_icon_christian![GetModifier( 'piety_level_4' ).GetNameWithTooltip] 이상 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]에 대한 @unspent_strong_hook_icon![strong_hook|E] 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName](을)를 [terrified_i][cowed|E]하게 만듦\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive] [head_of_faith|E] 또는 [challenger_hof|E] 되기"
 pam_empire_dread_or_strong_hook_tt: "[actor.GetShortUIName|U](은)는 다음 중 하나를 충족해야 함:\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]에 대한 @unspent_strong_hook_icon![strong_hook|E] 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName](을)를 [terrified_i][cowed|E]하게 만듦\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive] [head_of_faith|E] 또는 [challenger_hof|E] 되기"
 external_theocratic_puppet_reqs_tt: "[actor.GetShortUIName|U](은)는 다음 중 하나를 충족해야 함:\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]에 대한 @weak_hook_icon![hook|E] 보유, 또는 [recipient.GetSheHe]가 [king|E] 이상일 경우 @unspent_strong_hook_icon![strong_hook|E] 보유\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive] [religious_superior|E] 이상이 됨\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName](을)를 [puppeted|E]로 만든 적 있음\n$EFFECT_LIST_BULLET$[recipient.GetShortUINamePossessive] [house|E] [house_head|E] 되기\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName]의 [liege|E] 이상이 되며, [recipient.GetHerHim]를 [terrified_i][cowed|E]하게 만듦\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName](와)과 [friends|E], [lovers|E], 또는 [soulmates|E] 되기\n$EFFECT_LIST_BULLET$[recipient.GetShortUIName] @prison_icon![imprisoning|E] 중"
