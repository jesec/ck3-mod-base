 pam_interactions_events.0120.opening: "[recipient.GetFaith.GetReligion.GetAdjective]의 저명한 [recipient.GetFirstName]에게,"
 pam_interactions_events.0120.desc_religious_head_actor: "[recipient.GetFaith.CreatorName]께서 최초의 [recipient.GetWomenMen]을 창조하신 이래, 당신 같은 [recipient.GetTitleAsName](은)는 본 적이 없습니다! 명하신 대로 따르겠습니다. 복종할 수 있어 영광입니다.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "저 혼자서는 신자들을 이끌 수 없습니다. [recipient.GetFaith.HighGodNamePossessive] 백성 가운데 으뜸인 [recipient.GetTitleAsName]조차 세속의 이치를 따를 수밖에 없습니다. 그러니 [actor.GetTitleAsName], 당신을 돕고 복종하겠습니다.\n\n"
 pam_interactions_events.0120.desc: "제 소임을 다하며 영혼들을 보살필 수 있다니 복된 일입니다. [recipient.GetFaith.HighGodNamePossessive] 명에 따라, 그리고 당신의 명까지도 말입니다. 할 수 있는 모든 일에 최선을 다하겠습니다.\n\n"
 pam_interactions_events.0120.desc_lunacy: "제 영혼마저 죽어 가는 것 같아 두렵습니다... 이제는 당신의 조언만이 조금이나마 위안이 됩니다...\n\n"
 pam_interactions_events.0120.desc_dread: "파멸시켜야 할 자들을 파멸시킵시다. [recipient.GetFaith.HighGodName]께서 버리신 자들을... 그분께서 저를 버리신 것처럼.\n\n"
 pam_interactions_events.0120.desc_piety: "[recipient.GetFaith.HighGodName|U]께서 우리에게 성스러운 사명을 심어 주셨기 때문입니다!\n\n"
 pam_interactions_events.0120.desc_friendly: "제 [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))](을)를 향한 사랑과 절대적인 신뢰가 앞으로 닥칠 일들을 헤쳐 나가게 해 줄 것입니다.\n\n"
 pam_interactions_events.0120.desc_skill: "당신의 탁월한 지도 아래... 대단한 일에 함께하게 되리라 기대합니다.\n\n"
 pam_interactions_events.0120.outro: "어떤 기도를 들어 드리면 되겠습니까?"
 pam_interactions_events.0120.a: "내 모든 기도를, [recipient.GetTitleAsNameNoTooltip]!"
 pam_interactions_events.0121.opening: "존귀하신 [ROOT.Char.GetTitleAsName]이시여,"
 pam_interactions_events.0121.desc_honor: "이로써 저는 [recipient.GetPrimaryTitle.GetNameNoTier]의 [recipient.GetTitleAsName](으)로서 누려 온 자부심을 내려놓고, 당신의 조언을 소중히 여기며 따르겠습니다.\n\n"
 pam_interactions_events.0121.desc: "[recipient.GetPrimaryTitle.GetNameNoTier]의 [recipient.GetTitleAsName](은)는 당신의 권력 놀음에서 그 역할을 다하고, 당신이 이 현세에 간섭하는 것을 돕겠습니다.\n\n"
 pam_interactions_events.0121.desc_lunacy: "당신의 말씀이 맞습니다. 제 궁정은 헛소리꾼과 거짓말쟁이들의 소굴입니다. 제 꿈은 어둡기만 합니다. 오직 당신의 말만이 제게 이해가 되고, 오직 당신의 약만이 저를 치유할 수 있습니다...\n\n"
 pam_interactions_events.0121.desc_dread: "저는 당신의 손에 들린 무기입니다. 의심도, 양심의 가책도 없습니다.\n\n"
 pam_interactions_events.0121.desc_piety: "제 의심을 떨쳐 내게 해 주시고, [recipient.GetFaith.HighGodNamePossessive] 사랑을 얻을 길을 보여 주십시오!\n\n"
 pam_interactions_events.0121.desc_friendly: "저의 [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], 당신을 전적으로 신뢰하며, 결코 당신을 실망시키지 않겠다고 맹세합니다.\n\n"
 pam_interactions_events.0121.desc_skill: "당신께서 제 영지의 일을 면밀히 살펴보며, 제가 실패하도록 내버려 두지 않으시리라 믿습니다.\n\n"
 pam_interactions_events.0121.outro: "그럼 이제 당신의 계획을 실행에 옮깁시다."
 pam_interactions_events.0121.a: "[recipient.GetTitleAsNameNoTooltip|U](이)라고는 해도, [recipient.GetSheHe]는 [recipient.GetHerHis] 교회를 섬긴다."
