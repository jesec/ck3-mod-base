 request_elevation_interaction: "승격 요청"
 request_elevation_interaction_desc: "당신의 [clerical_region|E]의 [clerical_title|E]가 공석이든 당신의 [superior|E]이 보유하고 있든, 해당 작위의 수여를 [head_of_faith|E]에게 탄원합니다"
 request_elevation_interaction_notification: "[target.GetNameNoTier]에는 그에 걸맞은 목자가 부족합니다. 저를 그 자리에 앉혀 주십시오. 그러면 그곳의 양 떼가 흔들림 없이 이끄는 손길을 알게 될 것입니다."
 request_elevation_cannot_unseat_player_tt: "다른 플레이어가 통치하는 [clerical_title|E]의 [holder|E]를 자리에서 끌어내릴 수 없음"
 request_elevation_interaction_toast_title: "승격됨!"
 request_elevation_interaction_toast_title_puppeteer: "[puppet_or_actor.GetShortUIName](이)가 승격되었습니다!"
 request_ecclesiastical_title_expansion_interaction: "성직 작위 확장 요청"
 request_ecclesiastical_title_expansion_interaction_desc: "당신의 [head_of_faith|E]에게 탄원하여 [clerical_region|E]을 인접한 [duchy|E]까지 확장합니다.\n\n선택한 [duchy|E]의 모든 [Concept( 'de_jure', '규범상' )|E] 영지가 당신의 [clerical_region|E]에 추가됩니다."
 request_ecclesiastical_title_expansion_interaction_notification: "[target.GetNameNoTier]의 신자들에게는 영적 지도가 부족합니다. [actor.GetFaith.HighGodName]의 영광을 위하여 이 땅을 제 대교구의 관할 아래 두어 주십시오."
 request_ecclesiastical_title_expansion_accepted_tt: "성직 작위 확장됨"
 recipient_secondary_request_ecclesiastical_title_expansion_interaction: "소유주"
 puppet_action_description_puppet_action_request_ecclesiastical_title_expansion: "#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_expansion_interaction')]#! [interaction|E]을 사용하여 당신의 [clerical_region|E]을 인접한 [duchy|E]까지 확장해 달라고 [head_of_faith|E]에게 탄원합니다"
 request_ecclesiastical_title_merger_interaction: "성직 작위 통합 요청"
 request_ecclesiastical_title_merger_interaction_desc: "이웃 성직 지역을 당신의 [capital_possessive|E] [clerical_region_possessive|E] 소속으로 흡수하도록 승인해 달라고 당신의 [head_of_faith|E]에게 탄원합니다"
 request_ecclesiastical_title_merger_interaction_notification: "[target.GetNameNoTier]의 양 떼는 단호하게 이끌어 줄 손길이 없어 길을 잃고 헤매지만, 제 양 떼는 번성하고 있습니다. 그 주교좌를 제게 맡겨 주십시오. 그러면 두 관할로 나뉘어 있던 양 떼를 한 명의 충실한 목자가 돌볼 것입니다."
 request_ecclesiastical_title_merger_accepted_tt: "성직 작위 통합됨"
 request_ecclesiastical_title_merger_absorbed_tt: "성직 작위 상실"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "조건을 충족하는 이웃 [clerical_region|E]이 없습니다. 당신의 [clerical_region|E]은 신앙이 같은 [clerical_region|E] 하나 이상과 접해야 합니다."
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#! [interaction|E]을 사용하여 이웃 [clerical_region|E]을 당신의 해당 지역에 합병해 달라고 [head_of_faith|E]에게 탄원합니다"
 rival_ecclesiastical_title_merged: "[CHARACTER.GetShortUIName](이)가 [TARGET_CHARACTER.GetShortUINamePossessive] [clerical_title|E]를 흡수했습니다."
 request_ecclesiastical_title_creation_interaction: "성직 작위 생성 요청"
 request_ecclesiastical_title_creation_interaction_desc: "당신의 [realm|E] 내에 새로운 [clerical_title|E]를 설립해 달라고 [head_of_faith|E]에게 탄원합니다\n\n새로운 성직 작위를 둘 [title|E]와 첫 [holder|E]를 선택합니다\n\n#weak 새로운 [clerical_region|E]은 해당 작위가 속한 [Concept( 'de_jure', '규범상' )|E] [kingdom|E]의 [Concept( 'de_jure', '규범상' )|E] [county|E] 중 아직 어느 [clerical_region|E]도 보유하지 않은 곳을 모두 관할합니다#!"
 request_ecclesiastical_title_creation_interaction_notification: "제 영지의 신자들은 자신들의 사정도 모르는 낯선 이들의 사목을 멀리서 받고 있습니다. 제가 지정하는 중심지에 새로운 주교좌를 세우도록 승인해 주십시오. 필요한 것은 무엇 하나 부족하지 않게 하겠습니다."
 request_ecclesiastical_title_creation_accepted_tt: "[new_title.GetNameNoTooltip] 생성됨"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "당신이 [Concept( 'de_jure', '규범상' )|E] [capital|E]에 새 [clerical_region|E]을 설립할 수 있는 [duchy|E] 이상의 [title|E]를 보유하지 않음"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip](이)가 [Concept( 'de_jure', '규범상' )|E] [capital|E]에 새 [clerical_region|E]을 설립할 수 있는 [duchy|E] 이상의 [title|E]를 보유하지 않음"
 pam_new_clerical_region_invalid_anchor_tt: "이 [title|E]의 [Concept( 'de_jure', '규범상' )|E] [capital|E]는 탄원자의 [faith|E]을 따르고 탄원자의 [realm|E] 내에 있어야 하며, 이미 [clerical_region|E]에 속해 있지 않아야 함"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "이미 [clerical_region|E]을 보유하고 있지 않은 [clergy|E] 후보가 필요함"
 recipient_secondary_request_ecclesiastical_title_creation_interaction: "소유주"
 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#! [interaction|E]을 사용하여 직접 선택한 [title|E]를 기반으로 새로운 [clerical_region|E] [title|E]를 창설해 달라고 [head_of_faith|E]에게 탄원합니다"
 request_create_new_ecclesiastical_title_effect_tt: "[target_kingdom.GetName]의 [Concept( 'de_jure', '규범상' )|E] [capital|E]에 새로운 [clerical_title|E]가 생성되어 해당 작위의 [Concept( 'de_jure', '규범상' )|E] [kingdom|E]의 아직 [clerical_region|E]에 있지 않은 모든 [Concept( 'de_jure', '규범상' )|E] [county|E]을 포함하며, [new_ecclesiastical_holder.GetShortUIName]에게 수여됨"
 request_ecclesiastical_title_split_interaction: "교계 작위 분할 요청"
 request_ecclesiastical_title_split_interaction_desc: "기존 [clerical_region|E]의 일부를 떼어 새로운 교계 [title|E]를 창설하도록 당신의 [head_of_faith|E]에게 탄원합니다.\n\n당신이 세속 [ruler|E]일 경우, 새로운 작위는 당신의 [capital|E]를 중심으로 창설되어 당신이 선택한 [holder|E]에게 수여됩니다. 당신이 지주 성직자라면 당신이 첫 [holder|E]로 임명됩니다.\n\n#weak 분할은 봉역 경계를 따릅니다. 새로운 [title|E]는 해당 [clerical_region|E] 내에서 당신이 보유한 [Concept( 'counties', '영지' )|E]만을 관할하며 (당신이 성직자라면 당신의 [liege|E]이 보유한 영지), 따라서 [realm|E]이 클수록 더 많은 영역이 분리됩니다.#!"
 request_ecclesiastical_title_split_interaction_notification: "목자 한 명이 이토록 넓은 양 떼를 모두 살필 수는 없습니다. 이 땅을 떼어 새로운 주교좌를 세워 주십시오. 그러면 그곳의 어떤 영혼도 다시는 사목의 손길에서 소외되지 않을 것입니다."
 clerical_title_split_tt: "[puppet_superior.GetName]의 [clerical_region|E]에서 [puppet_liege.GetTitledFirstNamePossessive] [realm|E]에 해당하는 영역을 분리하여 새로운 교계 작위를 창설하며, [new_ecclesiastical_holder.GetName](이)가 첫 [holder|E]가 됨"
 request_ecclesiastical_title_split_effect_tt: "[split_source_clerical_region.GetName]에서 [puppet_or_actor.GetTitledFirstNamePossessive] [realm|E]에 해당하는 영역을 분리하여 새로운 [clerical_title|E]를 창설하고, [new_ecclesiastical_holder.GetShortUIName]에게 수여함"
 request_ecclesiastical_title_split_accepted_tt: "교계 작위 분할"
 request_ecclesiastical_title_split_lost_tt: "성직 지역 축소"
 actor_secondary_request_ecclesiastical_title_split_interaction: "새로운 소유주"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "현재 소유주"
 pam_split_no_region_to_split_tt: "당신의 [realm|E] 내에 분리할 수 있는 [clerical_region|E]의 일부가 있어야 합니다"
 pam_split_no_region_to_split_tt_puppeteer: "[puppet_or_actor.GetShortUINamePossessiveNoTooltip] [realm|E] 내에 분리할 수 있는 [clerical_region|E]의 일부가 있어야 합니다"
 pam_split_capital_is_region_seat_tt: "[puppet_or_actor.GetShortUINamePossessiveNoTooltip|U] [capital|E]는 분할하려는 [clerical_region|E]의 [clerical_region_capital|E]일 수 없음"
 pam_split_no_eligible_holder_tt: "새로운 [clerical_title|E]의 [holder|E]가 될 자격을 갖춘 인물이 있어야 합니다"
 pam_split_too_small_tt: "새로운 [clerical_region|E]가 너무 작습니다. 최소 #V 3#!개 [counties|E]을 포함해야 합니다"
 pam_split_liege_capital_is_region_seat_tt: "당신의 [liege|E]의 [capital|E]는 분할하려는 [clerical_region|E]의 [clerical_region_capital|E]일 수 없음"
 pam_split_larger_than_superior_tt: "새로운 [clerical_region|E]은 현 [holder|E]가 유지하는 영역보다 클 수 없습니다"
 pam_split_region_is_religious_head_seat_tt: "[head_of_faith|E] 또는 [head_of_rite|E]의 소재지인 [clerical_region|E]은 분할할 수 없음"
 request_clerical_elector_title_interaction: "추기경직 요청"
 request_clerical_elector_title_interaction_desc: "당신을 [cardinal|E]으로 임명하도록 당신의 [head_of_faith|E]에게 탄원합니다. 당신의 [head_of_faith|E]는 당신의 [superior|e]이 됩니다."
 request_clerical_elector_title_interaction_notification: "저는 말과 행동으로 신앙을 지켜 왔으며, 이제는 더욱 가까이에서 신앙을 섬기고자 합니다. 제게 붉은 모자를 씌워 주십시오. 그러면 추기경단이 뜻을 모을 때 제가 누구의 편에 설지는 결코 의심하지 않으실 것입니다."
 request_clerical_elector_title_interaction_toast: "추기경직 승인됨"
 request_clerical_elector_title_interaction_decline_toast: "[recipient.GetShortUINameNoTooltip|U](이)가 [puppet_or_actor.GetShortUINamePossessiveNoTooltip]의 [cardinalate|E] 요청을 거부함"
 request_clerical_elector_title_interaction_accept_tt: "[recipient.GetShortUINameNoTooltip|U](이)가 [puppet_or_actor.GetShortUINamePossessiveNoTooltip]의 [cardinalate|E] 요청을 수락함"
 external_theological_agent_puppet: "성직 영주 꼭두각시"
 external_clerical_puppet: "[external_clerical_puppet|E]"
 has_relation_external_clerical_puppet: "이미 [external_clerical_puppet|E]임"
 external_theological_agent_puppet_desc: "성직 [puppet|E]는 당신의 [realm|E] 밖에 있는 [archbishops|E], [cardinals|E], 또는 [head_of_faith|E]입니다. 이들은 강력한 권한을 지니며 누군가를 [excommunicate|E]할 수 있습니다."
 external_ruler_puppet: "세속 영주 꼭두각시"
 external_ruler_puppet_desc: "사랑, 두려움 또는 의무로 얽매인 [ruler|E]. 당신을 위한 [scheme|E]을 실행하도록 명령하고, 그들의 [realm|E]까지 당신의 뜻에 따라 움직이게 하십시오."
 # Religious - PAM (additions)
 puppet_action_description_puppet_action_request_ecclesiastical_title_split: "#V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_split_interaction')]#! [interaction|E]을 사용하여 기존 [clerical_region|E]에서 새로운 [clerical_title|E]를 분리하도록 [head_of_faith|E]에게 탄원합니다"
 puppet_action_description_puppet_action_demand_church_succession_hof: "[head_of_faith|E]로서 #V [GetPlayer.GetPlayerInteractionName('demand_church_succession_religious_head_interaction')]#! [interaction|E]을 사용하여 같은 [faith|E]에 속한 [rulerpossessive|E]의 대표 [title|E]를 예비 상속 대상으로 서약하게 합니다"
 puppet_action_description_puppet_action_give_cardinal_order: "#V [GetPlayer.GetPlayerInteractionName('give_cardinal_order_interaction')]#! [interaction|E]을 사용하여 해당 [baronies|E]에 지역 [modifiers|E]를 적용합니다"
 puppet_action_description_puppet_action_appoint_cardinal: "#V [GetPlayer.GetPlayerInteractionName('appoint_cardinal_interaction')]#! [interaction|E]을 사용하여 같은 [faith|E]에 속한 [clergy|E] 구성원을 [cardinal|E]으로 승격합니다"
 puppet_action_description_puppet_action_destroy_cardinalate: "#V [GetPlayer.GetPlayerInteractionName('destroy_cardinalate_interaction')]#! [interaction|E]을 사용하여 [cardinalate|E]을 해체하고 그 소유주를 [college_of_cardinals|E]에서 제외합니다"
 puppet_action_description_puppet_action_ecclesiastic_grant_claim: "#V [GetPlayer.GetPlayerInteractionName('ecclesiastic_grant_claim_interaction')]#! [interaction|E]을 사용하여 같은 [faith|E]에 속한 [rulerpossessive|E]의 [title|E]에 대한 [pressed_claim|E]을 얻습니다"
 puppet_action_description_puppet_action_sway_ruler_to_my_rite: "#V [GetPlayer.GetPlayerInteractionName('sway_ruler_to_my_rite_interaction')]#! [interaction|E]을 사용하여 같은 [faith|E]에 속한 [ruler|E]를 끌어들입니다"
 # Religious
 puppet_action_description_puppet_action_demand_conversion: "#V [GetPlayer.GetPlayerInteractionName('demand_conversion_interaction')]#! [interaction|E]을 사용하여 같은 [house|E]에 속한 [ruler|E]가 당신의 [faith|E]을 채택하도록 강요합니다"
 puppet_action_description_puppet_action_demand_conversion_vassal_ruler: "#V [GetPlayer.GetPlayerInteractionName('demand_conversion_vassal_ruler_interaction')]#! [interaction|E]을 사용하여 [vassal|E] 또는 [tributary|E]이 당신의 [faith|E]을 채택하도록 강요합니다"
 puppet_action_description_puppet_action_request_clerical_chastity: "#V [GetPlayer.GetPlayerInteractionName('request_clerical_chastity_interaction')]#! [interaction|E]을 사용하여 같은 신앙에 속한 성인을 성직 서원에 구속합니다"
