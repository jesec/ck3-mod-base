 spiritual_puppeteer_modifier_cleric: "구원을 향해 조종됨"
 spiritual_puppeteer_modifier_cleric_desc: "해당 인물은 정체를 알 수 없는 어떤 영적 지도자에 의해... 옳은 일을 하도록 인도받고 있다고 굳게 믿습니다."
