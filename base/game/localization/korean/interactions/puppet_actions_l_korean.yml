 beloved_puppeteer_modifier: "타인에게 자신을 맡김"
 beloved_puppeteer_modifier_desc: "자기 뜻을 굽히지 않는 주인이 해당 인물의 마음을 줄로 쥐고 흔들고 있으며, 해당 인물은 사랑에 빠져 이 모든 것이 자신을 위한 최선이라고 믿습니다."
