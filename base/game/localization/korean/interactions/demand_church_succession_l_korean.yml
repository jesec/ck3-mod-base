l_korean:
 demand_church_succession_interaction: "교회 승계 요구"
 demand_church_succession_religious_head_interaction: "교회 승계 선포"
 demand_church_succession_interaction_desc: "[recipient.GetTitledFirstName](이)가 정당한 후계자 없이 세상을 떠날 경우, [recipient.GetSheHe]가 다스리던 영지는 [fallback_heir|E]로서 [actor.GetPrimaryTitle.GetName]의 소유주에게 넘어갑니다."
 demand_church_succession_religious_head_interaction_desc: "[actor.GetFaith.GetAdjective] [faith|E]의 [head_of_faith|E]로서, [recipient.GetTitledFirstName](이)가 후계자 없이 사망할 [recipient.GetSheHe]의 봉역이 [actor.GetPrimaryTitle.GetName]에게 귀속되도록 선포합니다."
 demand_church_succession_target_in_reach: "[recipient.GetShortUINamePossessive] [realm|E]은 [actor.GetShortUINamePossessive] [realm|E]과 맞닿아 있지 않으며, [actor.GetShortUINamePossessive] [archdiocese|E] 범위 안에도 없음"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName](은)는 이미 다른 성직자 또는 [fallback_heir|E]에게 [recipient.GetHerHis] 승계를 약속했음"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName](은)는 [elective_succession|E] 또는 [advanced_succession|E]가 적용된 [recipient.GetHerHis] [primary_title|E]를 보유하고 있습니다"
 demand_church_succession_recently_refused_tt: "[recipient.GetTitledFirstName](은)는 최근 교회 승계 요구를 거부했으며, 이후 10년 동안 같은 요구를 다시 받지 않음"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "교회 승계 요구"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[recipient.GetTitledFirstName](이)가 후계자 없이 사망할 경우, [recipient.GetHerHis] 봉역이 [actor.GetPrimaryTitle.GetName]에게 넘어가야 한다고 [actor.GetTitledFirstName](이)가 요구합니다."
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName](이)가 [faith|E]에 귀속됨"
 demand_church_succession_actor_toast_desc: "[recipient.GetSheHe]가 후계자 없이 사망할 경우, [actor.GetPrimaryTitle.GetName](이)가 [recipient.GetHerHis] 봉역을 상속합니다."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName](은)는 [recipient.GetTitledFirstName](을)를 [faith|E]에 귀속시켰습니다"
 demand_church_succession_actor_toast_desc_puppeteer: "[recipient.GetSheHe]가 후계자 없이 사망할 경우, [puppet_or_actor.GetPrimaryTitle.GetName](이)가 [recipient.GetHerHis] 봉역을 상속합니다."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "[actor.GetFaith.HighGodNamePossessive] 은총으로, 승계 문제에 관해 서신을 보냅니다."
 demand_church_succession.0001.desc.archbishop: "당신의 영지를 보살피는 대교구에서, 승계 문제에 관해 서신을 보냅니다."
 demand_church_succession.0001.desc.bishop: "당신의 목자가 승계 문제에 관해 서신을 보냅니다."
 demand_church_succession.0001.desc.head_of_faith_generic: "신앙의 [actor.GetTitleAsNameNoTooltip](으)로서, 승계 문제에 관해 서신을 보냅니다."
 demand_church_succession.0001.desc.theocrat_generic: "[actor.GetFaith.HighGodName]의 제단에서, 승계 문제에 관해 서신을 보냅니다."
 demand_church_succession.0001.flavour.zealous: "\n\n오해는 하지 마십시오."
 demand_church_succession.0001.flavour.ambitious: "\n\n솔직히 말씀드리겠습니다."
 demand_church_succession.0001.flavour.deceitful: "\n\n분명 위안이 되는 내용일 겁니다."
 demand_church_succession.0001.flavour.greedy: "\n\n단도직입적으로 말씀드리겠습니다."
 demand_church_succession.0001.flavour.compassionate: "\n\n[recipient.GetTitledFirstName], 이런 말씀을 드려야 함을 용서하십시오. 하지만"
 demand_church_succession.0001.flavour.default: "\n\n분명히 말씀드리겠습니다."
 demand_church_succession.0001.recipient.elderly_childless: "화롯가의 요람은 비어 있고, 당신의 혈통은 당신 대에서 끊깁니다. 신도들은 기다릴 것이며, 때가 되면 이를 상속받을 것입니다."
 demand_church_succession.0001.recipient.childless: "당신에게는 현재 자녀가 없습니다. [actor.GetFaith.HighGodName]께서 이를 바꾸지 않으신다면, 당신의 영지는 신앙을 위해 쓰일 것입니다."
 demand_church_succession.0001.recipient.one_child: "당신과 가문의 단절 사이에는 단 한 명의 자녀만이 남아 있습니다. [actor.GetFaith.HighGodName]께서 그 아이를 데려가신다면, 신도들은 통치할 준비를 마칠 것입니다."
 demand_church_succession.0001.recipient.default: "세월은 모든 약속을 시샘합니다. 당신의 약속이 이루어지지 않는다면, 당신의 영지는 우리에게 넘어와 [actor.GetFaith.HighGodNamePossessive] 이름 아래 다스려질 것입니다."
 demand_church_succession.0001.a: "그렇게 기록되었으니, 그렇게 되리라."
 demand_church_succession.0001.b: "그렇다면 후계자를 하나 만들어야겠군."
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip](이)가 선을 넘는군."
 demand_church_succession.0001.c.tt: "[fallback_heir_title|E] 합의가 철회되고 10년 동안 교회 승계 요구를 다시 받지 않지만, [actor.GetTitledFirstName](은)는 이 모욕을 쉽게 잊지 않을 것임"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "그대의 요구는 읽었고, 거절하겠다. 내 영지는 결코 교회에 넘어가지 않을 것이다. [actor.GetTitledFirstName], 그대는 제단을 돌보라. 나는 내 영지를 돌볼 테니."
 demand_church_succession.0002.a: "이 무례는 오래도록 기억하리라."
 demand_church_succession_fertility_modifier: "후계자를 볼 결심"
 demand_church_succession_fertility_modifier_desc: "영지가 성직자들의 손에 넘어가지 않도록, 해당 인물은 후계를 보기 위한 노력을 배가했습니다."
 defied_church_succession_opinion: "내 승계 명분에 반기를 듦"
 meddling_church_opinion: "내 승계 에 간섭함"
