l_korean:
 christian_fulfillment_level_0: "파멸에 이른"
 christian_fulfillment_level_1: "버림받은"
 christian_fulfillment_level_2: "고뇌하는"
 christian_fulfillment_level_3: "참회하는"
 christian_fulfillment_level_4: "사면받은"
 christian_fulfillment_level_5: "평안한"
 christian_fulfillment_level_6: "은총받은"
 default_fulfillment_level_0: "방황하는"
 default_fulfillment_level_1: "모색하는"
 default_fulfillment_level_2: "지켜보는"
 default_fulfillment_level_3: "독실한"
 default_fulfillment_level_4: "평온한"
 industrious_junior_members_modifier: "근면한 수련자"
 foolish_convert_modifier: "어리석은 개종자"
 foolish_convert_modifier_desc: "이 어리석은 자는 기존과 크게 다른 신앙 체계를 지닌 [rite|E]로 경솔하게 개종했으며, 새로운 신앙생활에 적응하는 데 큰 어려움을 겪고 있습니다."
 reckless_convert_modifier: "경솔한 개종자"
 reckless_convert_modifier_desc: "해당 인물은 충분한 준비 없이 다른 신앙 체계를 지닌 [rite|E]로 개종했으며, 새로운 신앙생활에 적응하는 데 어려움을 겪고 있습니다."
 informed_convert_modifier: "준비된 개종자"
 informed_convert_modifier_desc: "해당 인물은 이 결정이 가져올 새로운 도전에 충분히 대비한 상태에서 다른 신앙 체계를 지닌 [rite|E]로 개종하기로 했습니다."
 study_faith_learning_mannerism: "관습 배우기"
 study_faith_learning_mannerism_desc: "효율은 다소 떨어지지만, [rite|E]와 관련된 관습과 외적 의례를 익히는 것은 장기적으로 구체적인 성과를 가져올 수 있습니다."
 study_faith_newfound_coherence: "새롭게 발견한 일관성"
 study_faith_newfound_coherence_desc: "지금까지 이 [rite|E]를 연구하며 발견한 모순점들은 장애물이 아니라 오히려 도움이 되었습니다. 두 신앙 체계의 차이점을 하나하나 맞춰 보며 대상의 [core_tenets|E]와 [doctrines|E]에 담긴 진정한 의미를 더 깊이 이해하게 되었습니다."
 study_faith_cautious_studies: "신중한 학습"
 study_faith_cautious_studies_desc: "이 [rite|E]는 느긋하게 연구하는 편이 낫습니다. 낯설고 받아들이기 어려운 관점을 충분한 시간을 들여 이해하기 쉬운 형태로 재해석하고, 이질적인 사고방식에 익숙해질 수 있기 때문입니다."
 study_faith_slow_and_steady: "더딘 학습자"
 study_faith_slow_and_steady_desc: "해당 인물은 접하게 된 낯선 관습의 양에 압도되었으며, 이를 이해하고 소화하려는 노력이 정신적 역량을 갉아먹고 있습니다."
 study_faith_cramming_side_studies: "보충 학습"
 study_faith_cramming_side_studies_desc: "이 학생은 이 [rite|E]의 내면적 원리에 깊이 빠져, 다른 일을 하고 있을 때조차 연구 내용을 받아 적는 모습이 자주 목격됩니다."
 followers_of_dead_faith_scheme_modifier: "세월에 잊힌 지식"
 followers_of_dead_faith_scheme_modifier_desc: "해당 [faith|E]은 더 이상 공개적으로 신봉되지 않아 신자를 찾기가 매우 어렵습니다."
 appealing_theology_modifier: "매력적인 신학"
 appealing_theology_modifier_desc: "해당 인물은 특히 마음에 드는 이방의 신학 문헌을 발견했습니다."
 suspicions_of_heresy_modifier: "이단 의혹"
 suspicions_of_heresy_modifier_desc: "해당 인물은 이방의 신학 문헌을 읽는 모습이 자주 목격되어, 같은 신앙을 가진 이들로부터 신앙심을 의심받고 있습니다."
 monastic_onslaught_modifier: "수도회 기반"
 monastic_onslaught_modifier_desc: "세속 후원자의 전폭적인 지원을 받는 수도회가 지역 경제 활동을 이끌고 있습니다."
 pam_monastic_order_improvement_modifier: "수도회 지원"
 pam_monastic_order_improvement_modifier_desc: "수도회가 노동력과 조언으로 해당 영지를 지원하고 있습니다."
 pam_military_order_improvement_modifier: "축복받은 무장"
 pam_military_order_improvement_modifier_desc: "성전 기사단의 전사들이 지역 징집병을 훈련하며 이 영지의 기강을 다지고 있습니다."
 pam_tithes_or_mercy_harsh_tithes_modifier: "강제적 십일조"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "가혹하게 십일조를 거두어들인 탓에, 지역 공동체가 군주에게 깊은 반감을 품고 있습니다."
 pam_tithes_or_mercy_show_mercy_modifier: "자비로운 십일조"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "세금 징수에서 관용을 베푼 덕분에, 지역 공동체의 신뢰와 호의가 커졌습니다."
 pam_blissful_harmony_gospel_modifier: "좋은 삶의 복음"
 pam_blissful_harmony_gospel_modifier_desc: "영주의 설교는 평화와 신앙심, 질서 있는 삶을 찬양합니다."
 pam_blissful_harmony_restless_ambition_modifier: "채워지지 않는 야심"
 pam_blissful_harmony_restless_ambition_modifier_desc: "잠깐의 행복을 맛본 뒤, 해당 인물은 더 많은 것을 갈망하게 되었습니다."
 pam_stone_for_god_estate_build_discount_modifier: "하느님의 집을 위한 석재"
 pam_stone_for_god_estate_build_discount_modifier_desc: "해당 인물은 건축가의 예리한 안목을 발휘해 석재를 확보할 길을 마련했습니다."
 pam_relocating_faithfuls_to_frontiers: "신자 변방 이주"
 pam_relocating_faithfuls_to_frontiers_desc: "이 영지는 같은 [rite|E] 신자들에게 포교를 위해 다른 [realm|E]으로 이주하도록 장려하고 있습니다."
 pam_moving_faithfuls_to_frontiers: "신자 유입"
 pam_moving_faithfuls_to_frontiers_desc: "이 영지에는 다른 [faith|E]을 믿는 사람들이 이주해 와 포교 활동을 하고 있습니다.\n#weak 이로 인해 #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! [interaction|E] 비용이 감소합니다.#!"
 pam_building_new_shrines: "새로운 성소 건설"
 pam_building_new_shrines_desc: "이 영지에는 다른 [faith|E]을 믿는 사람들이 이주해 와 새로운 성소를 세우고 있습니다.\n#weak 이로 인해 #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! [interaction|E] 비용이 감소합니다.#!"
 pam_grand_cathedral_started_modifier: "총대성당 건설 착수"
 pam_grand_cathedral_started_modifier_desc: "해당 인물은 총대성당 건설을 시작하는 데 필요한 자원을 모았습니다. 여러 세대에 걸쳐 이어질 이 사업은 이미 신에 대한 헌신을 보여 주는 위대한 증거가 되었습니다."
 pam_grand_cathedral_completed_modifier: "총대성당 건설 완료"
 pam_grand_cathedral_completed_modifier_desc: "해당 인물은 총대성당 건설을 완수하는 데 필요한 자원을 모았습니다. 여러 세대에 걸쳐 이어진 이 사업은 신에 대한 헌신을 보여 주는 위대한 증거입니다."
 pam_grand_cathedral_02_started_modifier: "총대성당 확장 공사"
 pam_grand_cathedral_02_started_modifier_desc: "해당 인물은 기존 총대성당을 한층 더 웅장하게 확장하는 데 필요한 자원을 모았습니다. 여러 세대에 걸쳐 진행되는 이 대공사는 하느님을 향한 해당 인물의 헌신을 여실히 보여 줍니다."
 pam_grand_cathedral_02_completed_modifier: "총대성당 확장 완료"
 pam_grand_cathedral_02_completed_modifier_desc: "해당 인물은 총대성당 확장 공사를 감독했습니다."
 pam_grand_cathedral_family_contributed_south_modifier: "총대성당 예배당 자금 지원"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "해당 가문에는 총대성당 예배당 건설 자금을 댄 인물이 있습니다. 여러 세대에 걸쳐 이어진 이 사업은 신에 대한 헌신을 보여 주는 위대한 증거입니다."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "대성당 지하 묘실 후원"
 pam_cathedral_founder_crypt_modifier_desc: "해당 인물은 총대성당 아래에 자신의 가문을 위한 지하 묘실을 조성하는 데 자금을 댔습니다."
 pam_cathedral_bell_cracked_lesson_modifier: "금이 간 종의 교훈"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "해당 영지의 석공들은 종 주조 실패의 수치를 만회하고자 더욱 신중하게 작업합니다."
 pam_cathedral_bell_bronze_torture_implements_modifier: "청동 고문 도구"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "잘못 주조된 대성당 종에서 나온 폐청동은 공포의 도구로 다시 주조되었습니다. 종 제작자가 그 첫 희생자가 되었습니다. 이제 기능공들은 실패의 대가를 알고 있습니다."
 pam_cathedral_treadwheel_crane_modifier: "답차 기중기"
 pam_cathedral_treadwheel_crane_modifier_desc: "대성당 건설 현장에서 가져온 거대한 답차식 기중기가 수도에 설치되었습니다."
 pam_cathedral_cantoria_scam_modifier: "들통난 계략"
 pam_cathedral_cantoria_scam_modifier_desc: "사기성 계략을 밝혀낸 뒤, 건축 인부들은 다시금 비용을 아끼며 공사를 서두릅니다."
 pam_cathedral_famed_choir_boy_modifier: "궁정의 천상의 목소리"
 pam_cathedral_famed_choir_boy_modifier_desc: "비현실적으로 아름다운 목소리를 지닌 소년 성가대원이 해당 궁정에 품격을 더합니다."
 pam_cathedral_sermon_peace_county_modifier: "평화의 설교"
 pam_cathedral_sermon_peace_county_modifier_desc: "새 대성당 정문에서 행한 영주의 설교로 해당 영지의 주민들이 더욱 만족하게 되었으며, 순례자들도 더욱 안전하게 도로를 오갈 수 있게 되었습니다."
 pam_cathedral_sermon_peace_ruler_modifier: "평화로 이끌림"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "해당 영주는 그리스도의 평화에 관한 대성당 설교에 감화되었습니다."
 pam_cathedral_sermon_diligence_county_modifier: "근면의 설교"
 pam_cathedral_sermon_diligence_county_modifier_desc: "새 대성당 정문에서 행한 영주의 설교가 교회 건축 인부와 석공들을 북돋아 부지런히 일하게 했습니다."
 pam_cathedral_sermon_diligence_ruler_modifier: "근면으로 이끌림"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "해당 영주는 경건한 노동에 관한 대성당 설교에 감화되었습니다."
 pam_cathedral_sermon_unity_county_modifier: "일치의 설교"
 pam_cathedral_sermon_unity_county_modifier_desc: "새 대성당 정문에서 행한 영주의 설교로 해당 영지 공동체의 순종심이 더욱 굳건해졌습니다."
 pam_cathedral_sermon_unity_ruler_modifier: "화합으로 이끌림"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "해당 영주는 그리스도적 교제에 관한 대성당 설교에 감화되었습니다."
 pam_cathedral_sermon_charity_county_modifier: "자선의 설교"
 pam_cathedral_sermon_charity_county_modifier_desc: "새 대성당 정문에서 행한 영주의 설교로 해당 영지의 주민들이 지갑을 열고 마음도 따뜻해졌습니다."
 pam_cathedral_sermon_charity_ruler_modifier: "자선으로 이끌림"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "해당 영주는 아낌없이 베푸는 자비에 관한 대성당 설교에 감화되었습니다."
 pam_cathedral_sermon_perseverance_county_modifier: "인내의 설교"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "새 대성당 정문에서 행한 영주의 설교로 해당 영지에서 경건한 정진과 질서 있는 성장이 되살아났습니다."
 pam_cathedral_sermon_perseverance_ruler_modifier: "열광으로 이끌림"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "해당 영주는 믿음의 경주를 달리는 것에 관한 대성당 설교에 감화되었습니다."
 pam_cathedral_sermon_rejoice_county_modifier: "환희의 설교"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "새 대성당 정문에서 행한 영주의 설교가 주님의 변함없는 사랑에 대한 희망으로 신자들의 마음을 북돋았습니다."
 pam_cathedral_sermon_rejoice_ruler_modifier: "기쁨으로 이끌림"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "해당 영주는 주님 안에서 기뻐하는 것에 관한 대성당 설교에 감화되었습니다."
 pam_cardinal_order_improve_development_modifier: "개발 증진 추기경 명령"
 pam_cardinal_order_improve_development_modifier_desc: "상관의 명령에 따라 추기경이 해당 대교구의 발전을 도모하고 있습니다."
 pam_cardinal_order_convert_faith_modifier: "신앙 개종 추기경 명령"
 pam_cardinal_order_convert_faith_modifier_desc: "상급자의 명에 따라 추기경이 현지 대교구와 인접 지역에서 개종을 촉진하는 데 힘씁니다.\n\n$EFFECT_LIST_BULLET$해당 [Concept( 'county', '영지' )|E]의 [convert_county|E]: #P +25%#!"
 pam_cardinal_order_increase_control_modifier: "영지 장악력 증진 추기경 명령"
 pam_cardinal_order_increase_control_modifier_desc: "상관의 명령에 따라 추기경이 해당 대교구 주민들을 안정시키고 있습니다."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "문화 심취 가속 명령"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "상관의 명령에 따라 추기경이 새로운 기술 연구를 가속하고 있습니다."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "역병 저항력 증진 추기경 명령"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "상관의 명령에 따라 추기경이 역병 대응을 위해 교회의 자원을 동원하고 있습니다."
 pam_cardinal_order_improve_legitimacy_modifier: "정통성 강화 추기경 명령"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "상관의 명령에 따라 추기경이 해당 대교구 영주들의 정통성을 강화하고 있습니다."
 pam_cardinal_order_undermine_legitimacy_modifier: "정통성 약화 추기경 명령"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "상관의 명령에 따라 추기경이 해당 대교구 영주들의 정통성을 약화시키고 있습니다."
 heathen_mandate_modifier: "이교도의 정통성 설파"
 heathen_mandate_modifier_desc: "이교도 군주의 성직자들이 이 땅의 영혼에 대한 권리를 주장하고 있습니다. 거짓된 신앙이 그 혐오스러운 주장을 뒷받침합니다."
 pam_recently_baptized_at_domicile_modifier: "최근 세례받음"
 pam_recently_baptized_at_domicile_modifier_desc: "해당 인물은 자신이 속한 대교구 대성당 단지의 세례당에서 세례를 받았습니다."
 pam_khachkar_ancestral_county: "선조의 하치카르"
 pam_khachkar_ancestral_county_custom_desc: "[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetHerHis] [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)](이)가 [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed](을)를 떠올리며 이 룬돌을 세우노라"
 pam_denied_new_pope_modifier: "새 교황을 인정하지 않음"
 pam_denied_new_pope_modifier_desc: "해당 인물은 새로 선출된 교황을 인정하기를 거부했습니다."
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "성화된 위상"
 pam_dulia_relic_piety_per_dread_modifier: "순교자의 기운"
 pam_dulia_relic_piety_per_knight_modifier: "군세의 축복"
 pam_dulia_relic_stress_loss_per_piety_modifier: "위로의 은총"
 pam_dulia_relic_piety_per_legitimacy_modifier: "성자들의 기름부음"
 pam_dulia_relic_learning_per_piety_modifier: "깨우침을 얻은 신심"
 pam_dulia_relic_monthly_piety_modifier: "은총의 샘"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "신조의 중재자"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "해당 인물은 보편 공의회가 토론을 시작하기도 전에 신조의 문구를 둘러싼 다툼을 해결했습니다."
 pam_ecumenical_council_primacy_upheld_modifier: "수위권 수호"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "해당 인물은 공개 공의회에서 이 신앙의 교회들이 어느 직위의 권위에 따르는지를 질문받았고, 의장으로서 그 문제에 결론을 내렸습니다."
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "새로운 중보자"
 pam_dulia_new_saint_modifier_desc: "해당 인물은 최근 새로운 성자가 선포된 일에 고무되었습니다."
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "모든 성지의 순례자"
 pam_pilgrim_of_every_holy_site_modifier_desc: "해당 인물은 자신이 믿는 신앙의 모든 성지에서 철야 기도를 드렸습니다."
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "지켜진 인륜"
 tenet_harmonious_society_five_bonds_modifier_desc: "군신유의, 부자유친, 부부유별, 장유유서, 붕우유신. 해당 인물은 이러한 오륜 중 하나를 원만하게 유지하고 있습니다."
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "서품의 계보"
 tenet_apostolic_succession_episcopate_modifier_desc: "해당 인물의 신앙은 이전 주교들로부터 끊임없이 이어지는 계보를 통해 각 주교를 서품합니다. 이는 오랜 역사 속에서 존중받아 온 정통성의 원천입니다."
 modifier_definition_value_per_theocratic_vassal: "\t#weak [theocratic_vassal|E] 수에 따라 증가 (최대 [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "신자들의 성가대"
 tenet_divine_liturgy_choirs_modifier_desc: "해당 인물의 교회들은 여러 세대 동안 변함없이 같은 시각에 같은 말씀을 노래합니다."
 modifier_definition_value_per_held_temple: "\t#weak 보유한 [temple_holding|E]에 따라 증가 (최대 [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "합당하게 집전됨"
 tenet_divine_liturgy_officiant_modifier_desc: "해당 인물은 자신의 신앙의 성찬 전례를 매우 중시합니다."
 tenet_divine_liturgy_schola_cantorum_modifier: "성가 학교"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "성가 학교를 두는 주군은 귀 기울일 만한 전례 담당자를 곁에 두게 됩니다."
 tenet_pentarchy_holy_site_modifier: "총대주교좌"
 tenet_pentarchy_holy_site_modifier_desc: "해당 영지의 성지는 신자들의 보살핌 아래 번영합니다."
 tenet_polyamory_new_beloved_modifier: "새 사랑으로 빛남"
 tenet_polyamory_new_beloved_modifier_desc: "해당 인물은 새로운 연인 덕분에 구름 위를 걷는 기분입니다."
 modifier_definition_value_per_chaplain_learning: "\t#weak [court_chaplain|E] [learning|E] 점수에 따라 증가 (최대 [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "잠벌의 빚"
 tenet_purgatory_sin_penalty_modifier_desc: "고해한 죄는 용서받지만, 그 죄로 생긴 잠벌의 빚까지 탕감되는 것은 아닙니다. 현세에서 갚지 않은 몫은 내세에서 치러야 하며, 해당 인물이 둘 중 어느 쪽을 택했는지는 신자들의 눈에도 뻔히 보입니다."
 tenet_original_sin_sinners_insight_modifier: "죄인의 통찰"
 tenet_original_sin_sinners_insight_modifier_desc: "죄의 무게를 짊어진 자는 다른 이들 안에서 죄가 어디에 숨는지 정확히 압니다."
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "피를 본"
 pam_holy_weapon_1_artifact_modifier_desc: "그 [faith|E]의 적들을 상대로 승리를 거둘 때 이 [holy_relic|E]도 전장에 함께했습니다. 독실한 신자들이 이 유물을 주목하기 시작했습니다."
 pam_holy_weapon_2_artifact_modifier: "전장에서 입증된"
 pam_holy_weapon_2_artifact_modifier_desc: "다른 [religions|E] 세력과의 전투에서 수없이 많은 승리를 거둔 끝에, 신자들은 더 이상 이를 단순한 운으로 치부하지 않습니다."
 pam_holy_weapon_3_artifact_modifier: "명망 높은 성물"
 pam_holy_weapon_3_artifact_modifier_desc: "어디를 가든 그 명성이 먼저 퍼집니다. 열광적인 신자들은 이 성물을 보는 것만으로도 용기를 얻습니다."
 pam_holy_weapon_4_artifact_modifier: "섭리의 도구"
 pam_holy_weapon_4_artifact_modifier_desc: "이 성물을 지닌 사람은 누구든 섬기는 신의 뜻을 행하는 것으로 여겨지며, 함께 싸우는 이들도 더욱 맹렬히 싸웁니다."
 # Challenge Head of Faith war aftermath
 pam_house_schismatic_sponsor_modifier: "분열주의 후원자"
 pam_house_schismatic_sponsor_modifier_desc: "해당 집안은 도전에 실패한 [challenger_hof|E]를 후원했습니다."
 pam_house_martyred_pontiff_modifier: "집안의 순교자"
 pam_house_martyred_pontiff_modifier_desc: "해당 집안 구성원 한 명이 [head_of_faith|E]를 둘러싼 전쟁 후 사망했습니다."
 pam_deposed_pontiff_modifier: "퇴위한 교계 지도자"
 pam_deposed_pontiff_modifier_desc: "해당 인물은 [head_of_faith|E] 자리에서 퇴위당했습니다."
 pam_ch_hof_sacred_bloodguilt_modifier: "피 흘린 죄"
 pam_ch_hof_sacred_bloodguilt_modifier_desc: "해당 인물은 [head_of_faith|E]를 둘러싼 전쟁에서 누군가를 죽였습니다."
 pam_ch_hof_penitent_road_modifier: "보속 서약"
 pam_ch_hof_penitent_road_modifier_desc: "해당 인물은 [head_of_faith|E]를 둘러싼 전쟁과 관련해 판결을 받은 후 보속을 하기로 맹세했습니다."
 pam_blessed_passing_modifier: "복된 죽음"
 pam_blessed_passing_modifier_desc: "해당 인물의 전임자는 거룩하게 된 죽음으로 생명을 바쳤으며, 그 은총이 해당 인물에게 머물러 있습니다."
