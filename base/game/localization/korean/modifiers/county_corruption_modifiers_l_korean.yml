l_korean:
 county_corruption_inefficient_tax_collection_modifier: "무능한 조세 징수"
 county_corruption_inefficient_tax_collection_modifier_desc: "[county_corruption|E]\n영지의 조세 징수 노력이 기대에 미치지 못하고 있습니다."
 county_corruption_inefficient_tax_collection_modifier_2: "조직적 조세 사기"
 county_corruption_inefficient_tax_collection_modifier_2_desc: "[county_corruption|E]\n해당 영지에서는 조세 사기가 만연해졌습니다."
 county_corruption_inefficient_tax_collection_modifier_3: "조세 체계 붕괴"
 county_corruption_inefficient_tax_collection_modifier_3_desc: "[county_corruption|E]\n해당 영지에서는 사실상 모든 세금 징수가 붕괴되었습니다."
 county_corruption_deserting_levies_modifier: "징집병 탈영"
 county_corruption_deserting_levies_modifier_desc: "[county_corruption|E]\n이 영지의 징집병들이 대규모 탈영을 벌이고 있습니다."
 county_corruption_deserting_levies_modifier_2: "대규모 탈영"
 county_corruption_deserting_levies_modifier_2_desc: "[county_corruption|E]\n해당 영지 전역에서 징집병들이 대규모로 탈영하고 있습니다."
 county_corruption_deserting_levies_modifier_3: "징집 체계 붕괴"
 county_corruption_deserting_levies_modifier_3_desc: "[county_corruption|E]\n해당 영지의 징집 체계는 완전히 붕괴되었습니다."
 county_corruption_smuggling_ring_modifier: "밀수 조직"
 county_corruption_smuggling_ring_modifier_desc: "[county_corruption|E]\n밀수업자들이 영지 도처에서 활개 치고 있습니다."
 county_corruption_smuggling_ring_modifier_2: "뿌리내린 밀수 조직"
 county_corruption_smuggling_ring_modifier_2_desc: "[county_corruption|E]\n밀수업자들이 해당 영지 전역에 광범위한 조직망을 구축했습니다."
 county_corruption_smuggling_ring_modifier_3: "만연한 밀수"
 county_corruption_smuggling_ring_modifier_3_desc: "[county_corruption|E]\n해당 영지에서는 가치 있는 물품 대부분이 세무 관리의 눈을 피해 유통되고 있습니다."
 county_corruption_bandits_rampant_modifier: "횡행하는 도적"
 county_corruption_bandits_rampant_modifier_desc: "[county_corruption|E]\n도적 떼가 영지에서 마음껏 활개 치고 있습니다."
 county_corruption_bandits_rampant_modifier_2: "도적단"
 county_corruption_bandits_rampant_modifier_2_desc: "[county_corruption|E]\n강력한 도적 떼가 해당 영지 내부에 세력을 구축했습니다."
 county_corruption_bandits_rampant_modifier_3: "만연하는 도적 떼"
 county_corruption_bandits_rampant_modifier_3_desc: "[county_corruption|E]\n도적들은 해당 영지가 마치 자신의 구역인 양 거리낌 없이 활개치고 있습니다."
 county_corruption_inefficient_census_modifier: "비효율적인 인구 조사"
 county_corruption_inefficient_census_modifier_desc: "영주가 이 영지에 누가 얼마만큼 거주하고 있는지 파악하지 못하고 있습니다."
 county_corruption_inefficient_census_modifier_2: "인구조사 체계 붕괴"
 county_corruption_inefficient_census_modifier_2_desc: "영지 행정은 주민과 토지 대부분의 현황을 파악하지 못하고 있습니다."
 county_corruption_inefficient_census_modifier_3: "행정 마비"
 county_corruption_inefficient_census_modifier_3_desc: "누가 이곳에 살고 무엇을 소유하며, 얼마나 세금을 내야 하는지 아무도 알지 못합니다."
 county_corruption_lack_of_sheriffs_modifier: "치안관 부족"
 county_corruption_lack_of_sheriffs_modifier_desc: "[county_corruption|E]\n이 영지의 봉토를 통제할 치안관이 부족합니다."
 county_corruption_lack_of_sheriffs_modifier_2: "무법지대"
 county_corruption_lack_of_sheriffs_modifier_2_desc: "[county_corruption|E]\n해당 영지 대부분에서 치안 유지 체계가 붕괴되었습니다."
 county_corruption_lack_of_sheriffs_modifier_3: "통치 불능 영지"
 county_corruption_lack_of_sheriffs_modifier_3_desc: "[county_corruption|E]\n해당 영지에 대한 통치는 이름만 남아 있을 뿐입니다."
 county_corruption_lack_of_courts_modifier: "법정에 대한 불신"
 county_corruption_lack_of_courts_modifier_desc: "[county_corruption|E]\n이 영지에서 발생한 농노 사건을 판결할 법정이 부족합니다."
 county_corruption_lack_of_courts_modifier_2: "법률 경시 풍조"
 county_corruption_lack_of_courts_modifier_2_desc: "[county_corruption|E]\n해당 영지의 주민들은 영주에게 정의를 기대하기를 대부분 포기했습니다."
 county_corruption_lack_of_courts_modifier_3: "사법 체계 붕괴"
 county_corruption_lack_of_courts_modifier_3_desc: "[county_corruption|E]\n해당 영지에서는 법률과 법원에 대한 존중이 완전히 사라졌습니다."
 county_corruption_thieves_guild_modifier: "횡행하는 절도"
 county_corruption_thieves_guild_modifier_desc: "[county_corruption|E]\n해당 영지에서는 도둑들이 거리낌 없이 활개치고 있습니다."
 county_corruption_thieves_guild_modifier_2: "강도단"
 county_corruption_thieves_guild_modifier_2_desc: "[county_corruption|E]\n범죄자들이 해당 영지 전역에 검은 손길을 뻗쳤습니다."
 county_corruption_thieves_guild_modifier_3: "도둑 조합"
 county_corruption_thieves_guild_modifier_3_desc: "[county_corruption|E]\n해당 영지에서는 도둑 조합이 상업과 이동을 사실상 통제하고 있습니다."
 county_corruption_unsafe_highways_modifier: "위험한 대로"
 county_corruption_unsafe_highways_modifier_desc: "[county_corruption|E]\n이 영지에서는 대로를 오가는 것이 밤중에 숲을 배회하는 것보다 위험합니다."
 county_corruption_unsafe_highways_modifier_2: "위험천만한 길"
 county_corruption_unsafe_highways_modifier_2_desc: "[county_corruption|E]\n해당 영지의 도로는 오가는 모든 이에게 공포의 대상이 되었습니다."
 county_corruption_unsafe_highways_modifier_3: "통행 불능 도로"
 county_corruption_unsafe_highways_modifier_3_desc: "[county_corruption|E]\n해당 영지의 도로는 선량한 사람들이 다니기 어려울 정도로 위험해졌습니다."
 county_corruption_uncooperative_guilds_modifier: "비협조적 조합"
 county_corruption_uncooperative_guilds_modifier_desc: "[county_corruption|E]\n현지의 조합들이 영주에게 협조하기를 꺼리고 있습니다."
 county_corruption_uncooperative_guilds_modifier_2: "비협조적인 조합"
 county_corruption_uncooperative_guilds_modifier_2_desc: "[county_corruption|E]\n조합들은 해당 영지에서 이루어지는 모든 공적 업무를 적극적으로 방해하고 있습니다."
 county_corruption_uncooperative_guilds_modifier_3: "반항적인 조합"
 county_corruption_uncooperative_guilds_modifier_3_desc: "[county_corruption|E]\n조합들이 해당 영지의 영주에게 공개적으로 반기를 들었습니다."
 county_corruption_lackluster_administration_modifier: "활기를 잃은 행정"
 county_corruption_lackluster_administration_modifier_desc: "[county_corruption|E]\n해당 영지의 영주는 더 이상 적절한 행정을 유지할 자금을 마련하지 못하고 있습니다."
 county_corruption_lackluster_administration_modifier_2: "흔들리는 행정"
 county_corruption_lackluster_administration_modifier_2_desc: "[county_corruption|E]\n해당 영지 전반의 행정 체계가 대부분 제 기능을 잃었습니다."
 county_corruption_lackluster_administration_modifier_3: "행정 붕괴"
 county_corruption_lackluster_administration_modifier_3_desc: "[county_corruption|E]\n해당 영지에 남아 있던 얼마 안 되는 행정 체계마저 완전히 방치되었습니다."
 county_corruption_roaming_bandits_modifier: "배회하는 도적단"
 county_corruption_roaming_bandits_modifier_desc: "[county_corruption|E]\n도적 무리가 해당 영지를 여행하는 이들을 공포에 몰아넣고 있습니다!"
 county_corruption_roaming_bandits_modifier_2: "도적 창궐"
 county_corruption_roaming_bandits_modifier_2_desc: "[county_corruption|E]\n무자비한 도적들이 해당 영지 곳곳에서 활개치고 있습니다."
 county_corruption_roaming_bandits_modifier_3: "도적 점거"
 county_corruption_roaming_bandits_modifier_3_desc: "[county_corruption|E]\n흉악한 도적들이 해당 영지를 거리낌 없이 돌아다니며 선량한 주민들을 공포에 떨게 하고 있습니다."
 county_corruption_wild_beast_attacks_modifier: "야생 짐승의 습격"
 county_corruption_wild_beast_attacks_modifier_desc: "[county_corruption|E]\n해당 영지에서는 대규모의 야생 짐승 무리가 양과 목축민을 가리지 않고 잡아먹습니다."
 county_corruption_wild_beast_attacks_modifier_2: "야생 짐승 창궐"
 county_corruption_wild_beast_attacks_modifier_2_desc: "[county_corruption|E]\n야생 짐승의 숫자가 해당 영지 전역에서 위험할 정도로 늘어났습니다."
 county_corruption_wild_beast_attacks_modifier_3: "맹수 창궐"
 county_corruption_wild_beast_attacks_modifier_3_desc: "[county_corruption|E]\n대형 맹수들이 해당 영지를 거리낌 없이 돌아다니며 가축과 그 주인들까지 공격하고 있습니다."
 county_corruption_upset_shepherds_modifier: "언짢은 목동"
 county_corruption_upset_shepherds_modifier_desc: "[county_corruption|E]\n해당 영지의 목동들이 언짢아하며 무리를 보살피는 일을 등한시하고 있습니다."
 county_corruption_upset_shepherds_modifier_2: "반기를 든 목동"
 county_corruption_upset_shepherds_modifier_2_desc: "[county_corruption|E]\n해당 영지의 목동들은 영주에게 공개적으로 반기를 들었습니다."
 county_corruption_upset_shepherds_modifier_3: "목축 붕괴"
 county_corruption_upset_shepherds_modifier_3_desc: "[county_corruption|E]\n해당 영지의 목축 역량은 완전히 붕괴되었습니다."
 county_corruption_rogue_warriors_modifier: "탈주 전사들"
 county_corruption_rogue_warriors_modifier_desc: "[county_corruption|E]\n전사 무리가 해당 영지에서 싸움을 일으키며 사람들을 갈취하고 있습니다."
 county_corruption_rogue_warriors_modifier_2: "탈주 전투단"
 county_corruption_rogue_warriors_modifier_2_desc: "[county_corruption|E]\n탈주 전사들이 전투단을 결성해 해당 영지를 유린하고 있습니다."
 county_corruption_rogue_warriors_modifier_3: "탈주 군벌"
 county_corruption_rogue_warriors_modifier_3_desc: "[county_corruption|E]\n해당 영지는 누구에게도 복종하지 않는 지방 군벌들에 의해 분할 지배되고 있습니다."
 county_corruption_unruly_nomads_modifier: "무질서 유목민"
 county_corruption_unruly_nomads_modifier_desc: "[county_corruption|E]\n해당 영지에서 살아가는 유목민에게는 질서가 없으며 걸핏하면 언쟁을 벌이느라 바쁩니다."
 county_corruption_unruly_nomads_modifier_2: "불복하는 유목민"
 county_corruption_unruly_nomads_modifier_2_desc: "[county_corruption|E]\n해당 영지의 유목민들은 같은 혈족이 아닌 이들의 권위를 거의 인정하지 않습니다."
 county_corruption_unruly_nomads_modifier_3: "반항하는 유목민"
 county_corruption_unruly_nomads_modifier_3_desc: "[county_corruption|E]\n해당 영지 전역의 유목민들은 공개적인 반란 직전까지 이르렀습니다."
