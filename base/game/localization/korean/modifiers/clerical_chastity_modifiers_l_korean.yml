 clerical_chastity_renounced_vow_clergy_disapproval_modifier: "신성한 약속 파기"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier_desc: "공개적으로 한 정결 서원을 저버렸기에, 해당 인물은 [clergy|E]의 의심 어린 시선을 받고 있습니다."
