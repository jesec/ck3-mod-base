l_korean:
 unity_antagonistic_maa_modifier: "충직한 군대 장교"
 unity_antagonistic_maa_modifier_desc: "해당 집안 구성원들은 자원을 모아 군대 내 병력을 증강하고 있습니다.\n\n"
 unity_competitive_spies_modifier: "계책 연결망"
 unity_competitive_spies_modifier_desc: "해당 집안 구성원들은 음모를 공유하며 집안만의 첩자망을 운영합니다.\n\n"
 unity_competitive_spies_landless_merchant_modifier: "계책 연결망"
 unity_competitive_spies_landless_merchant_modifier_desc: "해당 집안 구성원들은 음모를 공유하며 집안만의 첩자망을 운영합니다.\n\n"
 unity_impassive_tax_modifier: "행정 개선"
 unity_impassive_tax_modifier_desc: "해당 집안 구성원들은 향상된 행정 효율에 흡족하고 있습니다.\n\n"
 unity_friendly_bailiff_modifier: "강제 집달관"
 unity_friendly_bailiff_modifier_desc: "해당 집안 구성원들은 주군과 협력하여 봉역 전체의 부정부패를 줄이고 있습니다.\n\n"
 unity_harmonious_placation_modifier: "누그러짐"
 unity_harmonious_placation_modifier_desc: "해당 집안 구성원들은 주군의 조화로운 통치를 재확인하였습니다.\n\n"
 unity_house_organized_for_war_modifier: "전쟁 대비"
 unity_house_organized_for_war_modifier_desc: "해당 집안 구성원 모두가 전쟁 준비에 헌신하고 있습니다.\n[rulers|E]가 [warlike_i|E][ai_warlike_personality|L] [economical_archetype|E]을 채택함"
 unity_house_focused_on_economy_modifier: "경제 장려"
 unity_house_focused_on_economy_modifier_desc: "해당 집안 구성원들은 경제 발전을 위하여 열성적으로 활동하고 있습니다.\n[rulers|E]가 [builder_i][ai_economical_boom_personality|L] [economical_archetype|E]을 채택함"
 unity_house_focused_on_diplomacy_modifier: "외교 활동"
 unity_house_focused_on_diplomacy_modifier_desc: "해당 집안 구성원들은 영향력 행사에 힘쓰고 있습니다."
 fp3_unity_promoted_prosperity_modifier: "번영 촉진"
 fp3_unity_promoted_prosperity_modifier_desc: "해당 집안 구성원들은 협력하여 영지를 개발하고 있습니다."
 fp3_unity_improved_logistics_modifier: "공동 군대 병참"
 fp3_unity_improved_logistics_modifier_desc: "해당 집안 구성원들은 군대 병참과 물자를 공동으로 처리합니다."
 unity_family_business_landless_merchant_modifier: "체계적인 가업"
 unity_family_business_landless_merchant_modifier_desc: "해당 집안의 장원은 분주하게 돌아가며, 구성원들은 맡은 지시를 충실히 이행합니다.\n\n"
 unity_regional_networks_landless_merchant_modifier: "지역 상업망"
 unity_regional_networks_landless_merchant_modifier_desc: "해당 집안 구성원들의 다양한 사업 분야가 가장의 인정을 받았습니다.\n\n"
 unity_merchant_development_modifier: "개발 촉진"
 unity_merchant_development_modifier_desc: "해당 영지에 기반을 둔 상인들이 도시 개발을 촉진하고 있습니다.\n\n"
 unity_merchant_bailiffs_modifier: "도회지 집달관"
 unity_merchant_bailiffs_modifier_desc: "해당 영지에 기반을 둔 상인들이 법과 질서를 확립하는 데 기여하고 있습니다.\n\n"
 unity_merchant_prosperity_modifier: "공동체 지원"
 unity_merchant_prosperity_modifier_desc: "지역 상인들은 자신의 재산을 해당 공동체에 아낌없이 기부하여 모두의 삶을 향상시키고 있습니다."
 MODIFIER_DEFINITION_VALUE_PER_MERCHANT_UNITY_MEMBER: " \t#weak [house|E] 구성원의 수에 따라 증가#!"
 MODIFIER_DEFINITION_MAIN_DESC_HOUSE_UNITY_LANDESS_MERCHANT: "이 변화 요소는 독립 [merchant|E]이거나 [court_position|E]를 맡은 [house|E] 구성원 수에 따라 증가합니다 (#bold $MULTIPLIER|0$#!/#bold 10#!)"
 unity_promoting_diligence_modifier: "근면 장려"
 unity_promoting_diligence_modifier_desc: "해당 집안 구성원들은 장부를 꼼꼼히 살피고 이익이 될 만한 기회를 하나도 놓치지 않으면서 회사의 무역 활동을 개선하고 이윤을 늘리기 위해 쉴 새 없이 일해야 합니다.\n\n"
 unity_promoting_excess_modifier: "사치 장려"
 unity_promoting_excess_modifier_desc: "해당 집안 구성원들은 호화로운 생활을 즐기는 데 돈을 아끼지 않으며 자신의 평판과 회사의 위신을 높이고 있습니다.\n\n"
