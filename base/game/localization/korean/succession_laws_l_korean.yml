 celestial_grand_marshal_appointment_succession_law_effects: "\n[succession|E]는 [merit_level|E] 및 [merit_pools|E]에 기반합니다.\n\n오직 [minister_grand_marshal|E]만 사용하는 [appointment_succession_law|E]의 한 유형입니다. 해당 직위는 [merit_levels|E]가 가장 높은 지휘관들에게만 주어집니다. $celestial_grand_marshal_appointment_succession_law$에 따르면 [title|E]는 [candidate_score|E]가 가장 높은 후보자에게 상속됩니다. 점수는 주로 [martial_skill|E], 획득한 [commander_traits|E], [influence|E] 사용 등에 영향을 받습니다."
