 female_only_law_subname: "모계"
 male_only_law_effects: "$EFFECT_LIST_BULLET$여성은 피상속 자격이 없음\n$EFFECT_LIST_BULLET$여성은 [claims|E]을 상속받을 수 없음\n$EFFECT_LIST_BULLET$남성 [rulers|E]는 신봉 중인 [faith|E]이 [GetDoctrineType('doctrine_concubines').GetBaseName] 혹은 [GetDoctrineType('doctrine_polygamy').GetBaseName] [doctrine|E]를 도입하고 있을 때, [concubines|E]이나 여러 명의 [spouses|E]를 둘 수 있음"
 male_preference_law_effects: "$EFFECT_LIST_BULLET$남성이 승계 과정에서 여성보다 우선권을 가짐\n$EFFECT_LIST_BULLET$남성 [rulers|E]는 신봉 중인 [faith|E]이 [GetDoctrineType('doctrine_concubines').GetBaseName] 혹은 [GetDoctrineType('doctrine_polygamy').GetBaseName] [doctrine|E]를 도입하고 있다면 [concubines|E]이나 여러 명의 [spouses|E]를 둘 수 있음"
 equal_law_effects: "$EFFECT_LIST_BULLET$남성과 여성이 승계 과정에서 동일한 자격을 가짐\n$EFFECT_LIST_BULLET$모든 [rulers|E]는 신봉 중인 [faith|E]이 [GetDoctrineType('doctrine_concubines').GetBaseName] 혹은 [GetDoctrineType('doctrine_polygamy').GetBaseName] [doctrine|E]를 도입하고 있다면 [concubines|E]이나 여러 명의 [spouses|E]를 둘 수 있음"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$여성이 승계 과정에서 남성보다 우선권을 가짐\n$EFFECT_LIST_BULLET$여성 [rulers|E]는 신봉 중인 [faith|E]이 [GetDoctrineType('doctrine_concubines').GetBaseName] 혹은 [GetDoctrineType('doctrine_polygamy').GetBaseName] [doctrine|E]를 도입하고 있다면 [concubines|E]이나 여러 명의 [spouses|E]를 둘 수 있음"
 female_only_law_effects: "$EFFECT_LIST_BULLET$남성은 피상속 자격이 없음\n$EFFECT_LIST_BULLET$남성은 [claims|E]을 상속받을 수 없음\n$EFFECT_LIST_BULLET$여성 [rulers|E]는 신봉 중인 [faith|E]이 [GetDoctrineType('doctrine_concubines').GetBaseName] 혹은 [GetDoctrineType('doctrine_polygamy').GetBaseName] [doctrine|E]를 도입하고 있다면 [concubines|E]이나 여러 명의 [spouses|E]를 둘 수 있음"
 gender_preference_law_not_for_clergy_tt: "교계 및 신정 [rulers|E]는 자신의 [rite|E]의 성직 허용 성별 [doctrine|E]가 정하는 바에 따라 [GetLaw('male_only_law').GetName], [GetLaw('female_only_law').GetName] 또는 [GetLaw('equal_law').GetName] [gender_law|E]만 사용할 수 있음"
