 landless_adventurer_succession_law_effects: "$landless_adventurer_succession_law$ 시행 시, 야영지 [title|E]는 당신의 나이가 가장 많은 [child|E] (또는 가장 가까운 친척) 중 현재 소유한 [titles|E]가 없으면서 당신의 [courtier|E]인 인물이 상속하게 됩니다. 해당되는 인물이 없을 경우, 기량이 가장 높은 [follower|E]가 상속합니다."
 #MPO
 single_heir_succession_kurultai_law: "쿠룰타이"
 single_heir_succession_kurultai_law_subname: "장자 상속"
 single_heir_succession_kurultai_law_effects: "쿠룰타이 계승에서 차기 계승자를 정할 때는 [council|E]가 중요한 역할을 맡습니다. [kurultai|E] 내에서 이견이 발생할 경우, 혼란한 승계로 이어집니다.\n\n혼란한 계승에서는 승계 순위가 불분명해지며, [heir|E]는 통치를 시작할 때 부정적인 영향을 겪게 됩니다.\n\n반면, 모든 쿠룰타이가 한 목소리를 낸다면 봉역에서 안정적인 승계가 발생하며, [heir|E]는 강력한 지지자들의 지원을 받아 옥좌에 오르게 됩니다."
 law_of_the_land_succession_law: "토지 승계법"
 law_of_the_land_succession_law_subname: "[holding_type|E]이 계승자 지정"
 law_of_the_land_succession_law_effects: "해당 [county|E]이 수도 [barony|E]의 [holding_type|E]에 따라 상속하려면 특정 [government|E]가 필요합니다. 이때 조건을 충족하는 인물이 [realm|E]의 [line_of_succession|E]에 있을 경우 상속이 진행됩니다.\n\n조건을 만족하는 인물이 없을 경우 현지의 인물 한 명이 [title|E]를 상속하여 [independent|E] 영주가 됩니다."
 succession_law_changed: "작위 승계법 변경"
 confederation_elective_succession_law: "연맹체 선거제"
 confederation_elective_succession_law_subname: "[vassals]의 실권 소유"
 confederation_elective_candidates: "식구, 손주, 봉신"
 confederation_elective_candidates_tooltip: "봉건 선거제에서 적법한 후보자가 되기 위해선 다음의 조건 중 하나를 만족해야 합니다.\n$EFFECT_LIST_BULLET$현재 영주의 적법한 [close_family|E] 구성원\n$EFFECT_LIST_BULLET$[vassal|E]"
 confederation_elective_succession_law_effects: "[ruler|E] 및 모든 직속 [vassals|E]은 자신 및 영주의 [close_family|E] 중에서 [title_heir|E] 후보를 지명할 수 있습니다. [voting_strength|E]은 주로 [prestige_level|E], [piety_level|E], [count|E] [title_tier|E] [vassals|E]의 수에 의해 결정됩니다."
 confederation_elective_electors: "$feudal_elective_electors$"
 confederation_elective_electors_tooltip: "연맹체 선거제에서 적법한 [elector|E]가 되기 위하여, 봉신은 다음의 조건 중 하나를 만족해야 합니다.\n$EFFECT_LIST_BULLET$[count|E] [rank|E] 이상\n$EFFECT_LIST_BULLET$[title|E]의 직속 [vassal|E]\n$EFFECT_LIST_BULLET$부족 또는 유목 [government|E] 보유\n$EFFECT_LIST_BULLET$[GetTrait('incapable').GetName( GetNullCharacter )] [trait|E] 미보유\n$EFFECT_LIST_BULLET$[title|E] 소유주와 [war|E] 중이 아님"
 #TGP
 mandala_succession_law: "만다라 승계"
 mandala_succession_law_subname: "만다라 승계"
 mandala_succession_law_effects: "$mandala_succession_law$는 당신의 맏자녀가 당신의 [titles|E]를 상속받도록 합니다.\n\n승계 시 새로운 영주가 봉역 전역과 그 [tributaries|E]에 대한 장악력을 유지하려면 [mandala_trials|E]을 통과해야 합니다.\n\n"
 celestial_appointment_succession_law: "천조 임명 승계"
 celestial_appointment_succession_law_subname: "점수가 가장 높은 후보가 상속"
