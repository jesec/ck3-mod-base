 celestial_ministry_appointment_succession_law_effects: "\n[succession|E]는 [merit_level|E] 및 [merit_pools|E]에 기반합니다.\n\n[appointment_succession_law|E]의 한 유형입니다. $celestial_appointment_succession_law$은 상서성 [titles|E]에 대한 승계 방식입니다. 이는 [merit_levels|E]가 가장 높은 이에게 배정되는 매우 중요한 직위입니다. [movements|E], [merit|E], [influence|E]이 후보자의 [candidate_score|E]를 높이는 데 중요한 역할을 합니다."
