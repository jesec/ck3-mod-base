l_korean:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "건물 수요"
 action_reactive_advice_building_needs: "조언: $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "당신의 [buildings|E]에는 현지 [market|E]에서 공급되는 [trade_goods|E]에 대한 [needs|E]가 있습니다. 이를 열어 이러한 수요를 충족하는 방법을 알아보십시오."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "[domain|E]에 있는 [buildings|E]을 최대한 활용하려면, 건물이 필요한 [trade_goods|E]을 공급받을 수 있도록 해야 합니다.\n\n그 방법을 알아봅시다!"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "먼저 당신의 [domain|E]을 살펴봅시다."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "(강조된) 봉역 패널에서 직할령 탭을 여십시오"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "이곳에는 당신의 [domain|E]에 속한 모든 [holdings|E]가 표시됩니다.\n\n각 봉토가 속한 [Concept( 'county', '영지' )|E]는 [market|E]에 포함됩니다. [buildings|E]에서 생산하고 소비하는 모든 [goods|E]은 이러한 시장에서 거래됩니다."
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "이제 당신의 [holdings|E] 중 하나를 살펴봅시다."
 reactive_advice_building_needs_step_open_county_view_prompt: "(강조된) 봉토 중 하나를 클릭하십시오"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "이것들은 당신의 [holding|E]에 있는 [districts|E]입니다. 각 지구에는 [goods|E]을 생산하고 소비하는 [buildings|E]이 있습니다."
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "예시로 당신의 [holding_district|E]의 [needs|E]를 살펴봅시다."
 reactive_advice_building_needs_step_open_district_view_prompt: "(강조된) $game_concept_holding_district$를 클릭하십시오#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "여기에서는 [district|E]에 있는 각 [building|E]의 효과를 확인할 수 있습니다.\n\n일부 효과는 활성화되려면 [Concept( 'county', '영지' )|E]의 [market|E]에서 [trade_goods|E]을 소비해야 합니다.\n\n예를 들어 [holding_district|E]는 [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon] 및 [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon]를 소비할 수 있을 때 [holding|E]에 [food_supply|E]을 제공합니다.\n\n[need|E]를 충족하지 못하더라도 별도의 불이익은 없으며 모든 $game_concept_buildings$은 필요한 $game_concept_trade_goods$을 확보하지 못해도 일정한 혜택을 제공합니다."
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "특정 [trade_good|E]이 필요한 것이 아니라 어떤 [trade_category_short|E]에 속한 $game_concept_goods$을 어떤 조합으로든 확보하면 충분한 경우가 많습니다. 예를 들어 [building|E]에 [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon] 수요가 있을 경우, [GetTradeGoodType('trade_good_grain').GetNameWithIcon], [GetTradeGoodType('trade_good_millet').GetNameWithIcon] 또는 [GetTradeGoodType('trade_good_rice').GetNameWithIcon] 중 어느 것으로든 충족할 수 있습니다.\n\n또한 일부 [needs|E]는 여러 번 충족할 수 있으며 요구 수량을 채울 때마다 해당 효과가 다시 적용됩니다."
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "그렇다면 [buildings|E]에 필요한 [trade_goods|E]은 어디에서 공급될까요? \n\n[Concept( 'county', '영지' )|E]에서 소비되는 각 무역품은 해당 영지의 [market|E]에서 공급됩니다."
 reactive_advice_building_needs_step_open_market_view_prompt: "(강조된) 영지의 시장을 여십시오"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "이곳은 해당 [Concept( 'county', '영지' )|E]의 [market|E]입니다. 일반적으로 시장은 하나의 [duchy|E]에 속한 [Concept( 'counties', '영지' )|E]들을 모두 포함합니다."
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "여기에서는 각 [trade_good|E]과 해당 상품에 [surplus|E]가 있는지, 충족되지 않은 [need|E]가 있는지 확인할 수 있습니다.\n\n미충족 수요가 있는 경우(#N 수급량이 음수#!), [market|E]에 있는 일부 [buildings|E]이 [needs|E]를 충족하지 못하고 있다는 뜻입니다.\n\n잉여가 있는 경우(#P 수급량이 양수#!), 시장에 있는 모든 [buildings|E]의 해당 상품 수요가 충족되었으며 남는 상품은 [trade_routes|E]를 통해 수출할 수 있습니다.\n\n#I $game_concept_trade_good$을 클릭하면 시장과 지도에서 해당 상품의 현황을 확인할 수 있습니다.#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "미충족 [need|E]가 있다면 여러 방법으로 이를 해결할 수 있습니다.\n\n$BULLET_WITH_TAB$해당 [market|E]에 속한 지역에 [trade_good|E]을 생산하는 [buildings|E]을 건설합니다.\n$BULLET_WITH_TAB$당신의 [realm|E]에 속한 두 $game_concept_markets$ 사이에 [distribution_route|E]를 개설합니다.\n$BULLET_WITH_TAB$당신의 [client_merchants|E] 중 한 명에게 $game_concept_trade_good$ 수입을 의뢰합니다.\n\n하지만 모든 $game_concept_needs$를 쉽게 충족할 수 있는 것은 아니며, 때로는 $game_concept_need$를 미충족 상태로 두는 편이 낫기도 합니다."
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "건설 대기열"
 action_reactive_advice_construction_queue: "조언: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "건설 작업 하나를 대기열에 추가했습니다. 이를 열어 모든 건설 작업을 관리하는 방법을 알아보십시오."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "건설 하나를 대기열에 추가했습니다!\n\n지금 당장 [building|E] 비용을 감당할 수 없더라도, 비용을 감당할 수 있게 되었을 때 건설되도록 대기열에 추가할 수 있습니다.\n\n건설 대기열을 살펴봅시다."
 reactive_advice_construction_queue_intro_prompt: "(강조된) $BUILD_QUEUE_WINDOW_TITLE$ 패널을 여십시오"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "지금까지 모든 [holdings|E]에서 대기열에 추가한 건설 작업이 여기에 표시됩니다.\n\n비용을 지불할 수 있고 다른 모든 조건도 충족되면, 비용이 자동으로 지불되고 건설이 시작됩니다.\n\n건설은 대기열에 추가한 순서대로 시작되지만, 여기에서 끌어서 놓아 순서를 변경할 수 있습니다."
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "[gold|E]나 다른 자원을 조금 남겨 두고 싶다면 여기에서 따로 남겨 둘 수 있습니다.\n\n이는 대기 중인 건설을 시작하는 데 사용되지 않으므로, 비상시에 쓸 여유분을 항상 확보할 수 있습니다."
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "건설 대기열에 대해 알아볼 내용은 이것으로 끝입니다. 마음껏 건설해 보십시오!"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "무역로"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "다른 이들이 들판에서 땀 흘려 일하거나 가난한 이들에게 세금을 거두는 동안 당신은 [goods|E]을 유통해 이윤을 남깁니다.\n\n[trade_routes|E]는 [merchants|E]과 [republics|E]가 [gold|E]를 버는 주요 수단입니다."
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "먼저 거래할 [trade_good|E]을 선택해야 합니다.\n\n지금 표시된 상품들은 당신에게 추천하는 상품이지만 특정 상품을 찾고 있다면 모든 무역 상품을 살펴볼 수도 있습니다."
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "지도에서는 선택한 [trade_good|E]을 거래하는 모든 [markets|E]을 확인할 수 있습니다.\n\n무역을 하려면 상품의 [surplus|E]가 있는 시장(#trade_surplus 청록색#!)과 해당 상품의 [need|E]가 있는 곳(#trade_need 금색#!)을 연결해야 합니다.\n\n시장에 다른 [merchants|E]이 몰려 있다면 당신의 [competitiveness|E]에 따라 그곳에 있는 상품 중 일부만 거래할 수 있습니다.\n\n저렴하게 구매하고 비싸게 판매할수록 더 많은 이윤을 남길 수 있습니다.\n\n#I 시장을 클릭하여 무역로에 추가하거나 무역로에서 제외하십시오.#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "[route|E]에 [markets|E]을 추가하면 선택한 [good|E]이 해당 무역로를 통해 운송되며 이곳에 표시됩니다.\n\n가장 왼쪽에 있는 상품이 [primary_good|E]이며 해당 상품을 거래하면 [trade_expertise|E]을 획득합니다. 시간이 지나면서 전문성이 쌓이면 해당 상품의 [trade_category|E]에 따라 다양한 혜택을 얻을 수 있습니다.\n\n#I 상품을 2종 이상 운송한다면 다른 상품을 맨 앞으로 끌어다 놓아 $game_concept_primary_good$으로 지정할 수 있습니다#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "운송할 수 있는 [goods|E]의 종류 수와 총 [capacity|E]에는 제한이 있습니다.\n\n당신의 [company|E]에 [company_buildings_short|E]을 건설하면 이러한 한도를 늘릴 수 있습니다."
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "마찬가지로 무역로에도 [trade_route_length|E] 제한이 있으며 경유할 수 있는 [markets|E]의 수도 제한됩니다."
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "마지막으로 당신의 [associates|E] 한 명을 [trader|E]으로 배정할 수 있습니다. 어떤 임무를 맡기느냐에 따라 해당 인물은 [route|E]의 각기 다른 측면을 개선합니다."
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "[company|E]를 발전시키면 더 많은 [routes|E]를 이용할 수 있으며 무역로의 도달 범위와 거래량도 늘릴 수 있습니다.\n\n이렇게 하면 더욱 많은 [gold|E]를 벌 수 있습니다!"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "상인 되기"
 action_reactive_advice_merchant_introduction: "조언: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "당신은 [merchant|E]입니다! 이 항목을 열어 사업 운영의 기본을 알아보십시오."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "당신은 [merchant|E]입니다!\n\n[trade|E]은 당신의 [company|E]에 생명과도 같지만, 돈을 버는 것이 사업의 전부는 아닙니다."
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "먼저 당신의 [company|E]를 장기적으로 성장시키는 방법부터 살펴보겠습니다."
 reactive_advice_merchant_introduction_open_overview_prompt: "(강조된) 봉역 패널에서 개요 탭을 여십시오."
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "이것은 당신의 [company_size|E]로 $game_concept_company_possessive$ 세력을 가늠하는 주요 척도입니다.\n\n$game_concept_company$가 성장할수록 [kings|E]이나 [emperors|E]처럼 높은 [rank|E]의 [rulers|E]들이 당신에게 관심을 보이기 시작합니다."
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "이곳은 당신의 [company|E] [domicile|E]로 사업 활동의 거점입니다.\n\n여기에서 [gold|E]와 [prestige|E]을 사용해 [domicile_buildings|E]을 건설하면 $game_concept_company$를 더욱 발전시킬 수 있습니다."
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "이것은 [company_purpose|E]으로 당신의 $game_concept_company$가 어떤 사업에 주력할지 결정합니다.\n\n기본적으로 무역상 목적이 설정되어 있지만 이를 변경하여 [artifacts|E], 사치품 또는 대부업에 주력할 수도 있습니다."
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "하지만 당신이 [merchant|E]이라 해도 지역 영주의 지배에서 자유로울 수는 없습니다."
 reactive_advice_merchant_introduction_open_patronage_prompt: "(강조된) $MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$ 탭을 여십시오."
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "해당 인물은 당신의 [merchant_patron|E]로서, 당신의 [domicile|E]가 위치한 [holding|E]의 [ruler|E]입니다.\n\n당신은 $game_concept_merchant_patron$에게 세금을 납부해야 하지만 이러한 관계를 통해 혜택을 얻을 수도 있습니다.\n\n예를 들어 [client_contract|E]을 변경하여 $game_concept_merchant_patron$에게 무역 활동에 대한 지원을 요청하거나 귀족에게 [marriages|E]을 제안하기 쉽게 만들 수 있습니다."
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "대개 당신은 [merchant_patron|E]에게 속한 유일한 [client|E] [merchant|E]이 아닙니다.\n\n다른 $game_concept_clients$도 당신과 같은 곳을 거점으로 무역하며 특별 [charter|E]은 단 한 명의 $game_concept_client$만 보유할 수 있습니다. $game_concept_charter$을 보유하면 특별한 [decisions|E]을 통해 무역 활동을 강화할 수 있습니다."
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "마지막으로 지금껏 미뤄 둔 가장 중요한 이야기, 바로 돈 버는 방법을 알아볼 차례입니다."
 reactive_advice_merchant_introduction_open_trade_prompt: "(강조된) 무역 패널에서 무역로 탭을 여십시오."
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "이곳에 표시된 것은 당신의 [trade_routes|E]로, [gold|E]를 버는 주요 수단입니다.\n\n$game_concept_company$를 발전시키면 더 많은 $game_concept_routes$를 운영하고 무역로를 더 먼 곳까지 연결하며 더 많은 [goods|E]을 운송할 수 있습니다. 그만큼 더 많은 $game_concept_gold$를 벌 수 있습니다."
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "이것이 바로 [merchant|E]의 길입니다. [trade_routes|E]에서 [gold|E]를 벌고 그 돈으로 [prestige|E]과 [company_size|E]를 높이는 것입니다.\n\n책임감을 갖고 체계적으로 사업을 운영하는 $game_concept_merchants$의 사업은 언젠가 부유한 [rulers|E]들이 소유한 사업마저 능가할 것입니다!"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "회사 방향성"
 action_reactive_advice_company_direction: "조언: $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "시간이 지나면 [company_direction|E]이 바뀔 수 있습니다. 화면을 열어 자세한 내용을 확인해 보십시오."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "모든 [merchants|E]이 같은 목표를 추구하는 것은 아닙니다. [gold|E] 자체가 힘이지만, 어떤 이들은 가문과 귀족의 지위를 더욱 중시합니다."
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "[company_direction|E]은 [house|E]과 관련된 요소이니, 함께 살펴보겠습니다."
 reactive_advice_company_direction_open_house_prompt: "(강조된) 당신의 집안을 선택하십시오."
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "[sentiment|E] 탭으로 이동하십시오."
 reactive_advice_company_direction_open_direction_tab_prompt: "(강조된) 방향성 탭을 여십시오."
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "이것은 당신의 [company_direction|E]입니다. 처음에는 [company_sentiment_independent|E] 상태이지만 [company_sentiment_divided|E] 또는 [company_sentiment_concerted|E]에 가까워질 수 있습니다.\n\n[noble|E] [houses|E]과 혼인 관계를 맺으면 $game_concept_company_sentiment_concerted$에 가까워지고 다른 [merchants|E]과 혼인하면 $game_concept_company_sentiment_divided$에 가까워집니다."
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "건설 후원"
 action_reactive_advice_sponsor_construction: "조언: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "다른 [characters_possessive|E] [holdings|E]에서 [buildings|E] 건설을 후원할 수 있습니다. 이 항목을 열어 방법을 알아보십시오."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "이제 다른 [characters_possessive|E] [holdings|E]에 있는 [buildings|E] 증축을 후원할 수 있습니다."
 reactive_advice_sponsor_construction_select_holding_prompt: "지도에서 원하는 봉토를 선택하십시오"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "이제 해당 봉토의 [districts|E] 하나를 선택하십시오."
 reactive_advice_sponsor_construction_open_district_prompt: "(강조된) 지구를 선택하십시오."
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "이곳에서 건설을 후원할 수 있습니다! 단, [buildings|E]을 #EMP 증축#!하는 것만 가능하며 일반 [districts|E]에서만 후원할 수 있다는 점에 유의하십시오.\n\n건설을 후원하는 주된 목적은 [holding_possessive|E] [market|E]에서 특정 [trade_good|E]의 [surplus|E]나 [need|E]를 늘리는 것입니다. 이렇게 하면 해당 $game_concept_market$을 당신의 [profit_routes|E] 중 하나에 연결하여 더 많은 [gold|E]를 벌 수 있습니다."
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "공화제 정치"
 action_reactive_advice_republican_politics: "조언: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "당신은 [republic|E]의 일원입니다. 이 항목을 열어 공화정의 정치 운영 방식을 자세히 알아보십시오."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "[house_head|E]인 당신은 고결한 [republic|E]의 일원입니다!\n\n[patrician_family|E]의 수장으로서 다른 $game_concept_patrician_families$들과 함께 어느 정도 민주적인 절차를 거쳐 공화정을 다스립니다. 현재 $game_concept_republic$의 [ruler|E]가 아니더라도 [gold|E]와 영향력만 있다면 언제든 정치에 참여할 수 있습니다."
 reactive_advice_republican_politics_intro_prompt: "(강조된) 공화정 패널의 개요 탭을 여십시오."
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "시민들 사이에 차이가 있듯 모든 [republics|E]의 위상이 같지는 않습니다. 각 $game_concept_republic$에는 여기 표시된 것처럼 [title_tier|E]과 [republic_administration|E]이 있습니다.\n\n[ruler|E]는 [prestige|E]과 [treasury|E] 자금을 사용해 $game_concept_republic$의 $game_concept_title_tier$을 높이고, 이를 통해 세력을 강화할 수 있습니다.\n\n현재 $game_concept_ruler$는 $game_concept_republic$의 전반적인 방향을 결정하는 $game_concept_republic_administration$ 또한 변경할 수 있습니다."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "바로 이 인물이 앞서 언급한 [ruler|E]입니다!\n\n다른 [governments|E]의 전제적인 통치와 달리 [republic|E]에서는 선거로 $game_concept_ruler$를 선출하며, 임기도 제한되어 있습니다.\n\n하지만 같은 $game_concept_ruler$가 재선될 수 있으므로 현직 통치자가 선두 후보인 경우도 드물지 않습니다."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "[ruler|E]의 권력은 [assembly|E]의 견제를 받습니다. 이제 평의회를 살펴보겠습니다."
 reactive_advice_republican_politics_open_assembly_prompt: "(강조된) 평의회 탭을 여십시오."
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "[ruler|E]의 권력에도 한계가 있습니다. 모든 [law|E] 개정과 [republic_decree_short|E]은 [assembly|E]의 승인을 받아야 합니다. $game_concept_assembly$ 의원은 $game_concept_law$ 개정을 직접 제안할 수도 있습니다.\n\n$game_concept_assembly$에는 보통 [republic|E]의 [patrician_families|E]들이 참여합니다. 이들에게 현대적인 의미의 이념이 있는 것은 아니지만, 각 가문에는 투표에 영향을 미치는 [house_ambition|E]이 있습니다.\n\n$game_concept_republic$가 반드시 민주주의의 다양성과 혼란을 감수해야 하는 것은 아닙니다. 어떤 $game_concept_laws$이 통과되느냐에 따라 $game_concept_assembly$와 $game_concept_ruler$ 사이의 권력 균형이 달라질 수 있습니다."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "[assembly|E]에는 대개 [patrician_families|E]들이 참여하니, 이제 이들에 대해 알아보겠습니다."
 reactive_advice_republican_politics_open_families_prompt: "(강조된) 가문 탭을 여십시오"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "이들은 [republic|E]의 [patrician_families|E]입니다.\n\n당신의 가족을 포함한 모든 가족에는 [patrician_rating|E]가 있습니다. [trade|E]을 통한 수입을 늘리고 [assembly|E]에서 의석을 확보하거나 [ruler|E]의 [council|E]에 진출하면 $game_concept_patrician_rating$가 높아집니다.\n\n$game_concept_patrician_rating$가 높으면 [house_ambition|E]의 효과가 강화됩니다. 심지어 정부를 전복할 수도 있습니다!"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "[republic|E]의 운명은 당신의 손에 달려 있습니다.\n\n공화국을 어떻게 이끌어 갈지도 당신의 선택입니다. 권력을 당신의 가문에만 집중시키겠습니까? 아니면 다른 이들과 나누시겠습니까?\n\n[trade_routes|E]를 통해 [patrician_rating|E]가 높아질수록 당신의 권력과 영향력도 커집니다."
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "이곳에서는 직접 [distribution_routes|E]를 생성할 수 있습니다.\n\n유통 행로를 이용하면 당신의 [realm|E] 내 [markets|E]에서 발생하는 [needs|E]를 충족하기 위해 [trade_goods|E]을 운송할 수 있습니다."
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "[distribution_route|E]는 [trade_goods|E]을 물량 제한 없이 운송할 수 있지만, 운송 대상은 이곳에 표시된 [basic_trade_goods|E]으로 한정됩니다.\n\n따라서 운송할 $game_concept_trade_good$을 직접 선택할 필요가 없습니다.\n\n#I 기본 무역품을 선택하면 지도에서 해당 무역품의 [market_balance|E]을 확인할 수 있습니다#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "지도에서 각 [market|E]의 이름 아래에 어떤 [basic_trade_goods|E]의 [surplus|E]가 발생했는지 확인할 수 있습니다. 이는 해당 시장에서 무역품을 다른 곳으로 운송할 수 있다는 뜻입니다."
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "마찬가지로 미충족 [needs|E]도 표시됩니다. 이는 해당 [market|E]으로 [basic_trade_goods|E]을 운송할 수 있다는 뜻입니다."
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "[distribution_route|E]는 두 [markets|E]만 연결할 수 있으며, [goods|E]은 양방향으로 운송됩니다.\n\n행로에 시장 두 곳을 추가하면 강조 표시된 창에서 [needs|E]가 어떻게 충족되는지 확인할 수 있습니다.\n\n행로가 당신의 [realm|E] 내에서 물자를 운송하므로 [buy_price|E]이나 [tolls|E]를 지불할 필요가 없습니다.\n\n#I 시장을 행로에 추가하거나 행로에서 제거하려면 지도에서 해당 시장을 클릭하십시오#!"
