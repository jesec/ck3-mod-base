l_korean:
 bm_1178_merchants: "구엘프와 기벨린"
 bm_1178_merchants_desc: "구엘프파와 기벨린파 사이의 갈등은 오래전부터 예고되어 있었습니다. 11세기 말의 서임권 위기를 시작으로 이 갈등은 한 세기에 걸쳐 계속 이어져 왔습니다.\n\n프리드리히 바르바로사가 카이저 자리에 오르며 갈등은 격화되었고, 이제 이탈리아의 모두가 편을 선택하고 있습니다. 기벨린파는 카이저를 지지하며, 구엘프파는 로마의 교황 편을 듭니다.\n\n#bold 갈등은 이탈리아의 공화국 내부뿐 아니라, 여러 공화국 사이에서 격렬하게 불타고 있습니다. 이 갈등에서 편을 선택하고 승리로 이끄세요.#!"
 bookmark_merchants_1178_marco_sanudo: "마르코 사누도"
 bookmark_merchants_1178_marco_sanudo_subheading: "베네치아 파트리치오"
 bookmark_merchants_1178_enrico_dandolo: "엔리코 단돌로"
 bookmark_merchants_1178_marco_sanudo_desc: "사누도 가문은 베네치아의 오래된 귀족 가문 중 하나로, 전성기에 여러 번 도제 직위를 보유했던 전설적인 칸디아노 가문과도 관련이 있는 것으로 여겨집니다.\n\n젊은 후손인 마르코는 아버지가 세상을 떠난 뒤 가문의 수장이 되었으며, 자신의 삼촌이자 역사에 제4차 십자군 전쟁을 일으킨 인물로 알려질 엔리코 단돌로와도 가까운 사이입니다.\n\n#bold 주어진 운명을 따라 군도의 공작이 될 수 있겠습니까?#!"
 bookmark_merchants_1178_humbert_savoy: "사보이의 움베르토 3세"
 bookmark_merchants_1178_humbert_savoy_subheading: "사보이 공작 #b #bol (구엘프)#!#!"
 bookmark_merchants_1178_thomas_savoy: "토마소"
 bookmark_merchants_1178_humbert_savoy_desc: "사보이의 공작 움베르토는 지역 수도원에 아낌없이 기부하고, 세 번째 아내가 세상을 떠난 뒤에는 한동안 세속의 삶에서 물러나며 본인의 경건함을 증명했습니다.\n\n구엘프파의 편을 든 움베르토는 프리드리히 바르바로사와 대립하게 되었으며, 그 대가로 땅을 빼앗기고 약탈당했습니다.\n\n#bold 카이저의 손아귀에서 사보이의 땅을 지켜낼 수 있겠습니까?#!"
 bookmark_merchants_1178_guido_guerra: "구이도 구에라 3세"
 bookmark_merchants_1178_guido_guerra_subheading: "카센티노 백작 #color_yellow #bol (기벨린)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "리날도"
 bookmark_merchants_1178_guido_guerra_desc: "구이디 가문은 수백 년 동안 아르노강 상류를 다스려 온 백작 가문이며, 토스카나에서도 이들보다 오랜 혈통을 내세울 수 있는 가문은 거의 없습니다.\n\n구이도 구에라는 평생 제국을 위해 봉사했습니다. 그는 밀라노 공성전에 참여했고, 바르바로사가 내린 특권장은 아펜니노산맥 양쪽 사면에 걸친 그의 성과 각종 권리, 광산을 공식적으로 인정합니다.\n\n#bold 당신의 백작령을 역사에 길이 남을 곳으로 만들 수 있겠습니까?#!"
 bookmark_merchants_1178_speronella_dalesmanni: "스페로넬라 달레스마니"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "파도바 파트리치오 #b #bol (구엘프)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "에젤리노 다 로마노"
 bookmark_merchants_1178_pietro_iii: "피에트로 트라베르사리"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "스페로넬라는 십대 시절, 파도바의 제국 대리인 파가노 델라 토레에게 납치당한 적이 있습니다. 남동생이 스페로넬라를 구출하면서 제국 대리인을 타도했으며, 그의 몰락과 함께 파도바는 자유 코뮌이 되었습니다.\n\n#bold 자유로운 여성으로서, 당신의 전설적인 지위를 이용해 정치적인 권력이나 재산을 차지할 수 있겠습니까?#!"
 bookmark_merchants_1178_konrad_urslingen: "콘라드 폰 우르슬링겐"
 bookmark_merchants_1178_konrad_urslingen_subheading: "스폴레토 공작 #color_yellow #bol (기벨린)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "유타"
 bookmark_merchants_1178_konrad_urslingen_desc: "젊은 독일 공작 콘라드는 황제의 후원으로 이탈리아 공국을 다스립니다. 또한 반도의 중심부에 자리하며 남북을 잇는 길이 한데 모이는 스폴레토를 통치합니다. 그의 권위는 황제의 후원에 달려 있으나, 황제는 알프스 반대편의 먼 곳에 있습니다.\n\n#bold 당신은 과연 이탈리아반도의 중심부를 차지할 수 있을까요? 아니면 백성이 당신의 통치를 거부하게 될까요?#!"
