l_korean:
 bm_1066_merchants: "상업의 경로"
 bm_1066_merchants_desc: "봉역이 번성하려면 단순히 자급자족에서 그치지 않고 물자의 흐름을 계속 이어가야 합니다. 영주는 혈통만 가지고는 대규모 작전에서 승리할 수 없습니다. 무기와 저장품은 물론, 군대에 힘을 실어 줄 외세의 도움까지 조달하려면 금화가 있어야 합니다.\n\n상인들은 모든 무역과 거래의 배후에서 활동하며 상단과 선박을 이끌고 전설적인 행로를 오갑니다. 이들은 받아 마땅한 인정을 받지 못한다면 자신들을 위한 장소를 직접 만들어, 시민이 직접 통치하는 새로운 유형의 도시를 세울 것입니다.\n\n#bold 재력이 곧 권력의 척도인 이 시대에, 과연 당신은 가문을 이끌고 시장을 장악하며 역사에 흔적을 남길 무역 제국을 다스릴 수 있겠습니까?"
 bookmark_merchants_domenico_contarini: "도메니코 콘타리니"
 bookmark_merchants_domenico_contarini_subheading: "베네치아 도제"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "이븐 자라다"
 bookmark_merchants_ibn_jarada_subheading: "바그다드 상인"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "손충"
 bookmark_merchants_sun_zhong_subheading: "명주의 상인"
 bookmark_merchants_sun_zhong_desc: "명주의 항만은 송나라와 동쪽 바다가 만나는 곳이며, 손충은 이곳에 활기를 불어넣는 인물이 되었습니다. 손충의 창고에서 나온 비단과 도자기는 일본과 고려로 향하며, 향과 은은 그 반대 방향에서 들어옵니다. 교통에 세금을 부과하던 관료들은 보고를 올리는 것보다 시기적절하게 건네는 선물이 더 싸게 먹힌다는 사실을 배웠습니다.\n\n#bold 비단길의 동쪽 해안은 상단의 길이 아니라 항구입니다. 과연 손씨 가문에 그 어떤 궁정도 흔들지 못할 명성을 안길 수 있겠습니까?#!"
 bookmark_merchants_vitale_faliero: "비탈레 팔리에로"
 bookmark_merchants_vitale_faliero_subheading: "베네치아 파트리치오"
 bookmark_merchants_vitale_faliero_desc: "팔리에로는 베네치아의 가장 야망 넘치는 상인 가문이며, 비탈레는 경쟁자들도 감히 닿지 못하는 머나먼 동쪽까지 자신의 회사를 진출시켰습니다. 비잔티움의 무역로, 아드리아해에 도사린 노르만의 압박, 도시 의회의 질투심 많은 경쟁자가 사방에서 밀려듭니다.\n\n#bold 베네치아는 두 세계로 통하는 갈림길에 서 있습니다. 당신은 팔리에로 가문을 이끌어 두 세계를 모두 장악할 수 있겠습니까?#!"
 bookmark_merchants_wuhsha_al_dallala: "중개인 우샤"
 bookmark_merchants_wuhsha_al_dallala_subheading: "카이로 중개인"
 bookmark_merchants_wuhsha_al_dallala_desc: "엄청난 부를 소유한 여성인 우샤 알 달랄라는 자기 재산은 물론, 적에 관해서도 낱낱이 파악하고 있습니다.\n\n우샤는 독립적인 성향으로 인해 회당에서 추방되었습니다. 하지만 우샤는 인내할 줄 알았고, 자신을 거스른 이들에게 복수할 때만을 기다리고 있습니다.\n\n#bold 과연 당신은 대출이라는 수단을 활용해 상대에게 굴욕을 안길 능력을 갖추고 있을까요?#!"
 bookmark_merchants_greek_salvidi_1: "힐렐 살비디"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "아부 사이드"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "우샤의 아들"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "나탈 사후"
 bookmark_merchants_nattal_sahu_subheading: "델리의 거상"
 bookmark_merchants_nattal_sahu_desc: "요기니푸르의 시장에서는 사후라는 이름에 존경을 표할 수밖에 없습니다. 나탈은 델리의 자이나교 상인 공동체 수장이자, 토마라의 왕인 아낭가팔 2세의 신뢰를 받는 조언자이며 서부 항구에서 벵골 시장까지 이어지는 무역망을 구축했습니다.\n\n#bold 왕의 신뢰와 상인의 재치를 겸비한 당신은 과연 그 두 가지를 넘어 오래도록 이어질 자산을 만들어낼 수 있을까요?#!"
 bookmark_merchants_new_merchant_company: "사용자 지정 인물"
 bookmark_merchants_new_merchant_company_subheading: "비단길 상인"
 bookmark_merchants_new_merchant_company_desc: "비단길은 황제와 왕의 소유가 아닙니다. 그 길을 걸어갈 만큼 대담한 자만이 비단길을 손에 넣을 수 있습니다.\n\n동과 서의 교차로에서 당신만의 상인 회사를 설립하세요. 상단을 하나씩 만들며 무역 제국을 세우고, 사마르칸트의 바자르에서 지중해 항구까지 이어지는 연결을 형성해야 합니다.\n\n#bold 당신의 가문은 과연 수백 곳의 도시에 그 이름을 떨칠 수 있을까요?#!"
