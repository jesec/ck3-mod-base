 building_type_republic_council_chamber_01: "대의회 회의실"
 building_type_republic_council_chamber_01_desc: "일정한 지위와 자격을 인정받아 등록된 시민들이 모두 앉을 만큼 자리가 마련되어 있습니다. 의회는 이곳에서 조세 대장을 놓고 논쟁하고, 그해의 결산을 승인하며, 추첨으로 도시의 공직자를 뽑습니다."
