 building_type_republic_clock_tower_01: "공공 시계탑"
 building_type_republic_clock_tower_01_desc: "정교한 기계식 시계가 도시의 지붕 너머까지 종소리를 울려 시각을 알립니다. 이 시계탑은 코뮌이 방문객들에게 내세우는 자랑거리이며, 상인들의 하루 일과도 해가 뜨고 지는 시간이 아니라 도시가 정한 시각에 따라 움직이게 됩니다."
