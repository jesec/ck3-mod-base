 building_type_republic_debt_office_01: "공공 채무 관리소"
 building_type_republic_debt_office_01_desc: "도시는 시민들에게 돈을 빌리는 대가로 이자를 지급합니다. 시민들이 보유한 공채 지분은 다른 상품처럼 거래되며, 이렇게 조달한 자금으로 도시는 재정을 유지하고 고용한 용병 부대의 급료를 지급합니다."
