 building_type_republic_fountain_01: "분수대"
 building_type_republic_fountain_01_desc: "분수대와 연못, 송수로는 도시의 아름다움과 번영을 상징합니다. 이 시설들은 도시 주민들에게 물을 공급하는 데에도 중요한 역할을 합니다."
