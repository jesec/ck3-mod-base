 building_type_republic_loggia_01: "공용 회랑"
 building_type_republic_loggia_01_desc: "광장 가장자리를 따라 아치형 회랑이 이어져 있습니다. 상인들은 그늘에서 흥정하며 거래를 성사시키고, 공증인들은 기둥 사이에 책상을 차려 업무를 봅니다. 비가 내리면 시민들이 이곳으로 몰려와 비를 피합니다."
