 building_type_republic_weigh_house_01: "공인 계량소"
 building_type_republic_weigh_house_01_desc: "도시 소유의 저울과 공인 도량형 기구는 잠가 보관하며, 선서한 관리들이 이를 검사합니다. 이곳을 거치는 화물은 꾸러미마다 수수료를 내고 무게를 재야 하며, 상인들은 측정 결과에 이의를 제기할 수 없습니다."
