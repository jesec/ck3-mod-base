 building_type_republic_statute_hall_01: "법령당"
 building_type_republic_statute_hall_01_desc: "코뮌의 법령을 보관하고 사본을 만들며 해마다 낭독합니다. 따라서 관리들은 법령을 몰랐다고 변명할 수 없고, 시민들도 법령을 고지받지 못했다고 주장할 수 없습니다."
