 building_type_republic_civic_hospital_01: "시립 병원"
 building_type_republic_civic_hospital_01_desc: "코뮌이 병동을 마련하고 직원들의 인건비도 부담합니다. 이곳에서는 가난한 환자들을 길거리에서 죽도록 방치하지 않고 받아들여 돌봅니다. 시민들이 건강해야 도시의 생산 활동에도 힘을 보탤 수 있습니다."
