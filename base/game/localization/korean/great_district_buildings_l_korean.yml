 building_type_republic_podesta_residence_01_desc: "포데스타는 다른 도시에서 정해진 임기 동안 초빙한 관리로, 급료를 지급받고 도시의 공금으로 마련된 관저에서 생활합니다. 포데스타는 이 도시에 재산을 소유할 수 없으며, 친족도 없으므로 도시 내부의 분쟁에서 어느 한쪽을 편들 이유가 없습니다."
