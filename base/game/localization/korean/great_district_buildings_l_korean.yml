 building_type_republic_league_chapter_house_01: "연맹 대표단 회관"
 building_type_republic_league_chapter_house_01_desc: "연맹 도시 대표들을 위한 숙소와 귀중품 보관실, 회의장이 마련되어 있습니다. 연맹이 회의를 열면 대표들이 이곳에 모이며, 천 마일이나 떨어진 항구 도시들도 이곳에서 맺은 협약을 따라야 합니다."
