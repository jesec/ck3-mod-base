 theocratic_elective_pious: "경건"
 theocratic_elective_pious_desc: "#flavor 추기경단은 누구도 자격 없다고 할 수 없는 인물, 그 삶이 이미 성인의 생애와 다름없는 추기경을 후보로 내세워야 한다.#!\n\n#EMP $theocratic_elective_pious$#! 후보가 되려면 성스러움에서 다른 모든 [cardinal|E]을 앞서야 합니다. [piety_level|E]가 단연 가장 큰 비중을 차지하며, 그다음은 [learning|E]과 [GetTrait('lifestyle_scholar').GetName( GetPlayer )], [GetTrait('pilgrim').GetName( GetPlayer )], 또는 [GetTrait('lifestyle_mystic').GetName( GetPlayer )]로 살아온 세월입니다. [sin|E] 하나의 감점은 [virtue|E] 하나의 가점보다 큽니다.[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "민심"
 theocratic_elective_populist_desc: "#flavor 신자들이 따르지 않는 교황은 교황이라 할 수도 없다. 그러니 추기경단은 이미 거리에서 환호받는 인물을 후보로 내세운다.#!\n\n#EMP $theocratic_elective_populist$#! 후보가 되려면 명예에서 다른 모든 [cardinal|E]을 앞서야 합니다. [prestige_level|E]와 [diplomacy|E]를 높이고, [college_of_cardinals|E] 내에 [friends|E]를 두고, [tenet_popularity|E]가 높은 [personal_tenets|E]를 보유하며, [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E]을 사용하십시오.[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "권세"
 theocratic_elective_powerful_desc: "#flavor 성 베드로의 옥좌에는 추종자만큼이나 적도 있으니, 추기경단은 그 자리를 지켜낼 힘을 갖춘 고위 성직자를 후보로 내세운다.#!\n\n#EMP $theocratic_elective_powerful$#! 후보가 되려면 세속적 영향력에서 다른 모든 [cardinal|E]을 앞서야 합니다. 당신의 [rite|E]를 더 많은 [Concept( 'counties', '영지' )|E]에 퍼뜨리고, [holy_sites|E]를 보유하며, [dynasty_prestige_level|E]를 높이십시오. 아니면 #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! [character_interaction|E]을 사용해 돈으로 선두에 올라서는 것도 한 방법입니다.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
