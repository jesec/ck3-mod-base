 petition_head_of_faith_reclaim_offering_tt: "#weak 이번 탄원을 위해 준비해 두었던 것이 반환됩니다:#!"
 # Invalidation event
 petition_head_of_faith.0601.t: "탄원 중단"
 petition_head_of_faith.0601.desc.no_head: "내 주장을 제시할 준비를 마쳤을 때는 이미 내 탄원을 받아 줄 적절한 영적 목자가 더 이상 없었다."
 petition_head_of_faith.0601.desc.head_dead: "내 탄원이 받아들여지기도 전에 [recipient.GetTitledFirstName](이)가 사망했다."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName](이)가 투옥되어 정식 탄원을 받을 수 없다."
 petition_head_of_faith.0601.desc.head_changed: "내 신앙의 수장이 바뀌어 더 이상 [recipient.GetTitledFirstName]에게 탄원할 수 없다."
 petition_head_of_faith.0601.desc.at_war: "[recipient.GetTitledFirstName](와)과 전쟁 중에는 정식으로 탄원할 수 없다."
 petition_head_of_faith.0601.desc.repentance_resolved: "더 이상 거둬들일 파문이 없다."
 petition_head_of_faith.0601.desc.repentance_too_soon: "지난 징계 이후 얼마 지나지 않았으므로 내 회개는 받아들여지지 않을 것이다."
 petition_head_of_faith.0601.desc.target_dead: "탄원이 받아들여지기도 전에 [petition_target.GetTitledFirstName](이)가 사망했다."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName](은)는 더 이상 내 신앙에 속하지 않으므로 정식 파문을 요청할 수 없다."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName](은)는 더 이상 왕 이상의 영주가 아니므로 이 정식 탄원의 대상에서 제외된다."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName](은)는 이미 파문당했다."
 petition_head_of_faith.0601.desc.fallback: "더 이상 탄원을 진행할 수 없게 되었고, 여정은 수포로 돌아갔다."
 petition_head_of_faith.0601.desc.refund.piety: "이번 탄원을 위해 바쳤던 신앙의 공물이 반환되었다."
 petition_head_of_faith.0601.desc.refund.none: "적어도 아직 오간 것은 아무것도 없었다."
 petition_head_of_faith.0601.a: "어쩔 수 없지."
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "탄원: 회개"
 petition_head_of_faith.1000.t.excommunication: "탄원: 파문"
 petition_head_of_faith.1000.desc.court_low_grandeur: "한때 웅장했던 궁전이 내 주위에서 폐허가 되어 가고 있다. 부디 이것이 [recipient.GetFaith.ReligiousHeadName]의 영적 빈곤을 보여 주는 모습이 아니기를 바란다.\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "대회당으로 이름난 이 궁전에 들어서니 절로 겸허해진다. 부디 이 천상의 황금빛 장식이 그 안에 깃든 정의와 영적 풍요를 보여 주는 것이기를 바란다.\n\n"
 petition_head_of_faith.1000.desc.intro: "지상에서 신을 대리하는 이가 저기에 앉아 있다."
 petition_head_of_faith.1000.desc.recipient_sinful: "[recipient.GetSheHe]가 [petition_hof_gravest_sin.GetName(recipient)] 자라는 것은 익히 알려진 사실이건만, 무슨 악마의 농간을 부렸는지 [recipient.GetSheHe]는 성 베드로의 옥좌까지 기어코 차지했다."
 petition_head_of_faith.1000.desc.recipient_virtuous: "[recipient.GetHerHis] 판단은 분명 [recipient.GetHerHis] [petition_hof_gravest_virtue.GetName(recipient)] 본성의 영향을 받을 것이다."
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.GetHerHis|U] 쇠약해진 건강은 분명 고귀한 헌신으로 살아온 삶의 결실일 것이다."
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.GetHerHis|U] 쇠약해진 건강은 분명 파멸적인 방종으로 살아온 대가일 것이다."
 petition_head_of_faith.1000.desc.address: "\n\n나는 [recipient.GetHerHim] 앞에서 탄원을 올린다. \"거룩하신 [recipient.GetMotherFather|U],"
 petition_head_of_faith.1000.desc.repentance: "겸허한 마음으로 찾아와, 제 영혼에 내려진 징계에서 풀어 주시기를 간청하고 다시 신자들의 공동체로 받아 주시기를 기도하나이다.\""
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName](은)는 신을 거스르는 죄를 저질렀나이다. 저는 그저 겸허한 전령으로 찾아왔을 뿐, [petition_target.GetHerHis] 불멸의 영혼을 심판하는 것은 마땅히 당신의 권한입니다.\""
 petition_head_of_faith.1000.a.argue: "내 주장을 펼치겠다."
 petition_head_of_faith.1000.a.argue_tt: "알현 중 [recipient.GetShortUINameNoTooltip](을)를 설득하려 시도함"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n\"그대의 말을 들었노라, 나의 자녀여. 탄원의 구체적인 내용을 말하라. 호의적으로 받아들이리라.\""
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n\"그대의 탄원은 우리 앞에 놓였노라. 교회법과 거룩한 교회가 요구하는 바에 따라 판단하리라.\""
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n\"그럴듯한 말이야 쉽게 할 수 있는 법. 주께서 요구하시는 만큼 의심을 품고 그대의 탄원을 받아들이겠노라,\""
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n\"감히 이곳까지 찾아오다니 분수를 모르는구나. 다음에 할 말은 신중히 골라야 할 것이다.\""
 petition_head_of_faith.1000.desc.conclusion: "[recipient.GetSheHe]는 그렇게 말하며 기대 어린 눈으로 기다린다."
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "탄원: [actor.GetTitledFirstNamePossessiveNoTooltip] 회개"
 petition_head_of_faith.1310.desc.intro: "\"거룩하신 [ROOT.Char.GetMotherFather|U], 저는 파문당하여 성사에서 배제되고 신자들과의 친교도 끊겼나이다. 간청하오니 제 영혼에 내려진 이 징계를 거두시어 다시 친교를 나눌 수 있게 해 주소서.\" 무릎을 꿇은 [actor.GetTitledFirstName](이)가 말한다.\n\n\"신 앞에서 그대의 통회를 분명히 드러내라.\" 나는 답한다."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n\"거룩하신 [ROOT.Char.GetMotherFather|U], 당신께선 언제나 자비를 베풀어 주셨나이다. 저는 세속의 호의를 구하는 것이 아니라, 오직 신과 거룩한 교회께서 제 통회가 진실함을 알아주시기만을 바라나이다.\""
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n\"신 앞에서 저는 여느 참회자와 다름없이 서 있으며, 오직 교회법에 따른 공정한 판단만을 구하나이다.\""
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n\"저를 그럴듯한 말로 미혹하려는 [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )](으)로 여기지 마소서. [ROOT.Char.GetFaith.HighGodName](와)과 지상의 대리자 앞에 맹세하건대, 저는 진심으로 참회하고 있나이다.\""
 petition_head_of_faith.1310.serpent.christian: "동산의 뱀"
 petition_head_of_faith.1310.serpent.generic: "뱀"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n\"우리는 세속에서는 서로 원수였나이다. 세속의 일에서 저를 좋게 말씀해 달라는 것이 아니라, 제 보속을 인정하시어 제 영혼을 위태롭게 하지 말아 주소서.\""
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n\"그대가 [petition_gravest_sin.GetName(actor)] 자라는 이야기가 우리에게까지 들려오는구나. 그럴듯한 말만으로는 얼룩진 영혼에 대한 답이 되지 못한다. 어떤 개심을 보이겠느냐?\""
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n\"그대의 이름에는 악덕이 거의 따라붙지 않는구나. 어쩌면 파문이 그 역할을 다했을지도. 그대의 영혼이 겉으로 보이는 모습과 일치하는지 지켜보겠다.\""
 petition_head_of_faith.1310.a: "\"일어나라, 나의 자녀여. 그대를 신자들의 친교로 다시 받아들이노라.\""
 petition_head_of_faith.1310.b: "\"징계는 그대로 유지하겠다. 그대의 회개가 명백해지거든 다시 오라.\""
 petition_head_of_faith.1320.t: "탄원: [petition_target.GetTitledFirstNamePossessiveNoTooltip] 파문"
 petition_head_of_faith.1320.desc.intro: "\"거룩하신 [ROOT.Char.GetMotherFather|U], [petition_target.GetTitledFirstName](은)는 신을 거스르는 죄를 저질렀나이다. 이 썩은 부분을 도려내지 않는다면 우리 모두의 영혼이 위태로워질 것입니다.\" [actor.GetTitledFirstName](이)가 말한다.\n\n\"우리는 파문을 사사로운 무기로 휘두르지 않는다. 신 앞에서 고발 내용을 분명히 밝히라.\" 나는 답한다."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n\"거룩하신 [ROOT.Char.GetMotherFather|U], 언제나 제게 공정한 판단을 내려 주셨나이다. 저는 세속의 호의를 구하는 것이 아니라, 오직 신과 거룩한 교회께서 [petition_target.GetTitledFirstNamePossessiveNoTooltip] 죄과가 진실임을 알아주시기만을 바라나이다."
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n\"저는 주 예수 그리스도의 한낱 신민으로서 신 앞에 이 고발을 올리며, 오직 거룩한 교회가 요구하는 공정한 판단만을 청하나이다."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n\"저를 그럴듯한 말로 사사로운 다툼을 해결하려는 동산의 뱀으로 여기지 마소서. [ROOT.Char.GetFaith.HighGodName](와)과 지상의 대리자 앞에 맹세하건대, 이 고발은 정당하나이다."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n\"우리는 세속에서는 서로 원수였으나, 부디 교회법이 요구하는 바에 따라 [petition_target.GetTitledFirstNamePossessiveNoTooltip] 영혼을 헤아려 주소서."
 petition_head_of_faith.1320.desc.target_sinful: "[petition_target.GetTitledFirstNamePossessiveNoTooltip] 죄라는 썩은 병폐는 [petition_target.GetHerHis] [petition_gravest_sin.GetName(petition_target)] 본성에서 비롯되었나이다.\""
 petition_head_of_faith.1320.desc.finish: "[actor.GetTitledFirstName](은)는 그렇게 말을 맺는다."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNamePossessiveNoTooltip] 태도는 그 사악함을 잘 숨기고 있지만, 주께 인도를 구하신다면 [petition_target.GetHerHis] 죄가 분명히 드러나리라 믿나이다.\""
 petition_head_of_faith.1320.a: "\"[petition_target.GetHerHim]를 신자들의 친교에서 내치겠다.\""
 petition_head_of_faith.1320.b: "\"그대의 주장은 설득력이 없다. [petition_target.GetHerHim]에게는 어떠한 징계도 내리지 않겠다.\""
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "파문 선고"
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName](이)가 일어나 주님의 정의를 집행한다.\n\n\"[petition_target.GetTitledFirstName](을)를 파문하여 신자들의 공동체에서 끊어 내노라. 진정으로 회개할 때까지 [petition_target.GetHerHis] 영혼은 위험에 처할 것이다.\""
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName]께서 그 종복을 통해 말씀하셨다."
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "탄원 거부"
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName](이)가 일어나 주님의 정의를 집행한다.\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "\"그대가 거론한 죄악은 그토록 무서운 선고를 내릴 만큼 중대하지 않다. [petition_target.GetTitledFirstName](을)를 파문하지 않겠다.\""
 petition_head_of_faith.2030.desc.finesse: "\"우리는 군주의 돈을 받고 신자를 내치지 않는다. 카이사르의 것으로 [recipient.GetFaith.HighGodName]의 심판을 살 수는 없다.\""
 petition_head_of_faith.2030.desc.learning_duel: "\"교회법을 고의로 왜곡하여 [petition_target.GetTitleAsNameNoTooltip](을)를 옭아매려는 것이냐? 그대의... 학식을 근거로 [petition_target.GetTitledFirstName](을)를 파문하지는 않겠다.\""
 petition_head_of_faith.2030.desc.fallback: "\"참으로 주제넘구나! [petition_target.GetTitledFirstName](을)를 파문해야 할 이유가 보이지 않는다.\""
 petition_head_of_faith.2030.a: "아무래도 [recipient.GetFaith.HighGodName]께서 그 종복을 통해 말씀하신 모양이군."
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "논증"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "\"성서와 교회의 교회법을 근거로 [petition_target.GetTitledFirstNamePossessiveNoTooltip]의 죄를 입증하려는 것인가? [petition_target.GetSheHe]가 우상 앞에 절하기라도 했나?\""
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "\"이 돌십자가 아래에서 [petition_target.GetTitledFirstNameNoTooltip](을)를 고발하려는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "\"[petition_target.GetTitledFirstNameNoTooltip](은)는 성모의 자비를 받을 자격조차 없다는 것인가? 그대는 정녕 한 점의 얼룩도 없는 옷을 입고 이 자리에 섰단 말인가?\""
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "\"사사로운 원한에 격분한 나머지, 중대한 죄의 증거도 없이 [petition_target.GetTitledFirstNameNoTooltip](을)를 성스러운 전례에서 내치라는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "\"[petition_target.GetTitledFirstNameNoTooltip](을)를 그리스도의 제단에서 배제하려는 것인가? [petition_target.GetHerHim]에게 우리 주의 살이 주는 양식을 거부하고자 하나? [petition_target.GetSheHe]는 이제 성혈을 마시지 못해야 한다는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_communion: "\"[petition_target.GetTitledFirstNameNoTooltip](을)를 신자들의 친교에서 내치는 것이 마땅하다고 보는가?\""
 petition_head_of_faith.2000.desc.atmosphere_confession: "\"고해의 비밀 아래 털어놓은 말을 근거로 [petition_target.GetTitledFirstNameNoTooltip]에게 처분을 내리라는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "\"더 온건한 수단으로 [petition_target.GetTitledFirstNameNoTooltip](을)를 죄에서 돌이키려는 시도가 실패하기도 전에, [petition_target.GetHerHim]를 성급하게 내치라는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "\"우리가 사도들의 권위를 내세워 지상에서도 천상에서도 [petition_target.GetTitledFirstNameNoTooltip](을)를 단죄하기를 바라는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "\"[petition_target.GetTitledFirstNameNoTooltip](을)를 단죄하겠다며 교회법 연구에 열중하던 우리를 방해하는구나. 그대의 논변은 교부들의 저술과 성서에 근거하고 있는가?\""
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "\"성스러운 시기에 피를 흘리거나 교회 영지에서 폭력을 저질렀다는 이유로 [petition_target.GetTitledFirstNameNoTooltip]에게 제재를 가하기를 바라는 것인가? [petition_target.GetSheHe]는 신의 평화와 휴전을 어겼는가?\""
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "\"[petition_target.GetTitledFirstNameNoTooltip]에 대한 그대의 불만을 이 자리에서 심판하는 것이 최선이겠나? 차라리 둘 다 십자가를 받고 그리스도의 적들과 싸우는 것이 낫지 않겠는가?\""
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "\"분열하는 기독교 세계를 하나로 붙들어 두려고 우리 다섯 총대주교좌가 애쓰는 와중에, [petition_target.GetTitledFirstNameNoTooltip](을)를 내쳐 달라고 찾아온 것이냐? 온 [Glossary( '오이쿠메네', 'OIKOUMENE_GLOSS' )]가 그대의 고발을 지지하리라 믿는가?\""
 petition_head_of_faith.2000.desc.atmosphere_dulia: "\"[petition_target.GetTitledFirstNameNoTooltip](이)가 공공연한 경멸로 순교자 공경을 모욕하기라도 했는가?\""
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "\"[petition_target.GetTitledFirstNameNoTooltip](을)를 내치라는 것이구나. [petition_target.GetSheHe]가 불순종과 나태 속에서 살아왔다는 증거라도 보여라. 무위야말로 영혼의 적이니.\""
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "\"우리가 [petition_target.GetTitledFirstNameNoTooltip](을)를 단죄하기를 바라는 것인가? [petition_target.GetSheHe] 홀로 아담의 죄악을 물려받기라도 한 것처럼? 모든 영혼은 타락으로 상처 입은 채 세상에 태어나지만, 교회는 죄악으로 기우는 성향을 탐닉하는 자가 아니고서는 누구도 내치지 않는다.\""
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "\"그토록 화려하게 차려입고 [petition_target.GetTitledFirstNameNoTooltip]에게 정의를 행하라며 목소리를 높이는구나. 정작 우리 탁발 수도사들은 허름한 옷가지만 걸치고 빈자들 사이를 떠돌고 있거늘. 탁발 수도사라면 오히려 인내를 권하지 않겠는가? 아니면 그 죄가 그토록 중하다는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "\"[petition_target.GetTitledFirstNameNoTooltip]에게 내리는 성사를 거부하길 바라는구나. 천상에서 그리스도와 함께 누릴, 영원한 생명의 풍요에 대한 [petition_target.GetHerHis] 몫마저 위태롭게 하겠다는 것이냐? 우리가 청빈을 서약하는 곳은 지상이니라.\""
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "\"[petition_target.GetHerHis] 원수의 말만 믿고 그리스도의 군사를 내치라는 것인가?\""
 petition_head_of_faith.2000.desc.atmosphere_fallback: "\"거룩한 교회가 그대와 [petition_target.GetTitledFirstNameNoTooltip]의 다툼을 어떻게 해결해 주기를 바라는 것인가?\""
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n\"우리가 파문을 군주의 사사로운 무기로 휘두르지 않는다는 것은 그대도 알 터. 어떤 처분이 정의에 합당한지 우리가 판단하겠다. 신 앞에서 그대의 주장을 밝려라!\" 거룩한 [recipient.GetMotherFather|U]가 엄명한다."
 petition_head_of_faith.2000.desc.target_sinful: "\n\n[recipient.GetFaith.GetReligiousHeadTitle.GetNamePossessive] 말은 공정하게 들려야 하겠지만, [petition_target.GetTitledFirstNamePossessiveNoTooltip] 죄악된 본성에 관한 소문이 이미 이 성스러운 전당에까지 들어온 것이 분명하다. 나는 그저 [petition_target.GetHerHis] 죄과를 확인하기만 하면 된다."
 petition_head_of_faith.2000.desc.target_clean: "\n\n[recipient.GetTitledFirstName] 또한 [petition_target.GetTitledFirstNameNoTooltip](이)가 죄악을 두르고 있지는 않다는 것을 아는 듯하다. 이 자리에서 제시할 사악함의 증거가 없으니, 내가 바라는 정의를 이루려면 다른 길을 찾아야겠다."
 OIKOUMENE_GLOSS: "\"사람이 사는 세계\"를 뜻하는 그리스어입니다. 동로마의 표현에서 #bold 오이쿠메네#!는 문명 세계, 즉 제국과 그 교회가 관할하는 더 넓은 기독교 질서를 가리켰습니다."
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "신 앞에서 [petition_target.GetTitledFirstNameNoTooltip](이)가 [petition_gravest_sin.GetName(petition_target)] 자임을 선언하겠다."
 petition_head_of_faith.2000.a.cite_sins_fallback: "신 앞에서 [petition_target.GetTitledFirstNamePossessiveNoTooltip] 죄악을 열거하겠다."
 petition_head_of_faith.2000.b.finesse: "\"교회에는 필요한 것이 많지요. 그중 몇 가지는 제가 보살피도록 허락해 주십시오.\""
 petition_head_of_faith.2000.c.learning_duel: "난해한 성서 구절을 인용해 사악한 [petition_target.GetTitleAsNameNoTooltip](을)를 옭아매겠다."
 petition_head_of_faith.2000.d.hook: "[recipient.GetFaith.ReligiousHeadName]에게 몇 가지... 사적인 일을 상기시키겠다."
 petition_head_of_faith.2000.e.withdraw: "...이 일은 [petition_target.GetFaith.HighGodName](와)과 [petition_target.GetTitledFirstNameNoTooltip] 사이의 문제인지도 모르겠군."
 petition_head_of_faith.5000.e.withdraw: "...아직은 내 준비가 부족했던 것 같군."
 petition_head_of_faith_hook_committed_tt: "이를 성사시키기 위해 [hook|E]을 소모함"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip](은)는 사특한 자라기보단 선량한 자임"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName](을)를 설득함"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName](이)가 납득함"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName](이)가 여전히 납득하지 않음"
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName](이)가 모욕감을 느낌"
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName](이)가 당신의 논증을 일축함"
 petition_head_of_faith_affronted_opinion: "뇌물에 모욕당함"
 petition_head_of_faith_affronted_opinion_desc: "해당 인물은 금화로 종교적 판결을 사려 든 탄원인에게 모욕감을 느꼈습니다."
 petition_head_of_faith_dismissed_debate_opinion: "논증에 마음이 움직이지 않음"
 petition_head_of_faith_dismissed_debate_opinion_desc: "해당 인물은 교회법을 왜곡한 논증으로 자신을 설득하지 못한 탄원인을 물리쳤습니다."
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "사죄 요청"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "당신의 [head_of_faith|E]에게 찾아가 [excommunication|E]을 거두어 주기를 간청합니다."
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "[recipient.GetCapitalLocation.GetName](으)로 이동하여 당신의 [excommunication|E]을 거두어 주기를 [recipient.GetTitledFirstName]에게 정식으로 탄원함"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "고해성사"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "\"사죄를 구하러 왔구나. 오직 성서와 보속만이 그대를 정화할 수 있음을 알면서도 새긴 우상 앞에 절하였느냐?\""
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "\"이 조각된 돌십자가의 발치에 사죄를 간청하러 온 것이기를 바란다.\""
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "\"성모께서는 자비로 충만하시나, 그분의 자비만을 이유로 그대에게 내려진 징계를 거둘 수는 없다.\""
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "\"다시금 성찬 전례에 참여하고자 하는구나. 무엇이 그대를 제단과 신자들에게서 멀어지게 했는지 숙고하라.\""
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "\"그대는 그리스도의 제단과 그분의 살과 피라는 양식을 거부당하였다.\""
 petition_head_of_faith.5000.desc.atmosphere_communion: "\"그대는 지금 신자들의 친교에서 단절되어 있다.\""
 petition_head_of_faith.5000.desc.atmosphere_confession: "\"고해성사는 모든 것을 숨김없이 진실하게 고백할 것을 요구한다.\""
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "\"파문은 교회가 내리는 약이다. 삶을 바로잡고 정화의 기간을 단축할 수 있도록 그대에게 주어진 선물이지.\""
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "\"우리는 베드로의 열쇠를 지니고 있다. 그대가 진실로 참회한다면 이 권위로 그대를 풀어 줄 수 있다.\""
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "\"화해를 구하는구나. 교령집의 장과 구분 하나하나에 따라 교회법의 요구를 충족하라.\""
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "\"그대의 죄가 신의 평화와 신의 휴전을 어긴 것이냐? 성스러운 시기에 피를 흘렸느냐?\""
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "\"명목상으로만 십자가를 받고 정작 기독교 세계를 해쳤다면, 명백히 법을 어긴 것이다.\""
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "\"다섯 총대주교좌가 지켜보고 있다. 온 [Glossary( '오이쿠메네', 'OIKOUMENE_GLOSS' )]가 지켜보는 가운데 사죄의 가치를 떨어뜨리지는 않겠다.\""
 petition_head_of_faith.5000.desc.atmosphere_dulia: "\"순교자들은 자신의 피로 천상에서의 자리를 얻었다.\""
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "\"무위는 영혼의 적이다. 통회하는 마음으로만 무릎 꿇지 말고, 보속과 기도와 노고를 행할 각오로 무릎 꿇어라.\""
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "\"그대도 우리 모두와 마찬가지로 죄를 안고 태어났다. 어찌 그 유산에 새로운 악행까지 보태려 하느냐?\""
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "\"우리 탁발 수도사들은 해진 수도복 한 벌만 걸친 채 빈자들 사이를 떠돈다.\""
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "\"우리가 지상에서 추구하는 것은 청빈의 서약이다. 재물로도 지위로도 성사를 되살 수는 없다.\""
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "\"그대는 가슴에 십자가를 달고서도 기독교 세계에 죄를 지었다.\""
 petition_head_of_faith.5000.desc.atmosphere_fallback: "\"긴 순례를 했다는 것만으로 사죄를 받을 수 있는 것은 아니다.\""
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n\"우리가 겉치레나 아첨을 이유로 징계를 거두지는 않는다는 것을 그대도 알 터. 신 앞에서 그대의 통회를 분명히 드러내라!\" 거룩한 [recipient.GetMotherFather|U]가 엄명한다."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\n내가 [petition_gravest_sin.GetName(actor)] 자라는 소문이 이 성스러운 전당에까지 분명 들어왔을 것이다."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\n드러내 놓을 만한 큰 악행이 없으니, 파문이 유익한 교정의 역할을 다했다는 것을 분명 이 자리에서도 알아줄 것이다."
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "아무것도 숨기지 않고 내 죄를 고백하겠다."
 petition_head_of_faith.5000.b.canon_law: "교회법에 따라 내가 화해를 받아야 한다고 논증하겠다."
 petition_head_of_faith.5000.c.weep: "이 자리의 자비에 온전히 맡기겠다."
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName]의 마음이 움직임"
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName]의 마음이 움직이지 않음"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName](이)가 당신의 고해를 받아들임"
