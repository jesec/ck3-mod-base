 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "사죄 승인"
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName](이)가 일어나 주님의 자비를 베푼다.\n\n\"일어나라, 나의 자녀여. 그대는 신자들의 친교로 돌아왔다. 그대의 영혼에 내려진 파문은 해제되었다.\""
 petition_head_of_faith.5020.a: "[recipient.GetFaith.HighGodName]께 감사드리나이다."
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "사죄 거부"
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName](이)가 일어나 주님의 정의를 집행한다.\n\n"
 petition_head_of_faith.5030.desc.confess: "\"그대의 고해에는 진정성이 없구나."
 petition_head_of_faith.5030.desc.canon_law: "\"그대의 보잘것없는 학식이 그대의 영혼을 그대로 비추는구나."
 petition_head_of_faith.5030.desc.weep: "\"눈물이 곧 보속은 아니다."
 petition_head_of_faith.5030.desc.fallback: "\"참으로 주제넘구나."
 petition_head_of_faith.5030.desc.conclusion: " 징계는 그대로 유지될 것이다.\""
 petition_head_of_faith.5030.a: "아무래도 [recipient.GetFaith.HighGodName]께서 그 종복을 통해 말씀하신 모양이군."
