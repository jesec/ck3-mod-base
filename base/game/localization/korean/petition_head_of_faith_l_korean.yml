 petition_antipope_decision_desc: "내 $anti_religious_head_name$의 궁정으로 가서 정식으로 탄원을 올리겠다. [ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetName]의 [ROOT.Char.GetFaith.ReligiousHeadTitleName](은)는 이제 더 이상 내가 탄원을 올릴 상대가 아니다."
 petition_antipope_decision_tooltip: "당신의 [challenger_hof|E]에게 찾아가 호의를 탄원함"
 petition_antipope_decision_confirm: "탄원 준비"
 petition_head_of_faith_decision_effects_major_piety: "탄원을 준비할 때 [piety_i][EmptyScope.ScriptValue('major_piety_value')|V0] [piety|E]를 소모합니다. 탄원을 철회하거나 [travel|E]을 취소하거나 탄원이 중단되면 돌려받습니다. 주장을 펼쳤으나 [petition_recipient.GetShortUINameNoTooltip](을)를 설득하지 못하면 #EMP 돌려받지 못합니다#!."
 petition_head_of_faith_decision_effects_massive_piety: "탄원을 준비할 때 [piety_i][EmptyScope.ScriptValue('massive_piety_value')|V0] [piety|E]를 소모합니다. 탄원을 철회하거나 [travel|E]을 취소하거나 탄원이 중단되면 돌려받습니다. 주장을 펼쳤으나 [petition_recipient.GetShortUINameNoTooltip](을)를 설득하지 못하면 #EMP 돌려받지 못합니다#!."
 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.GetShortUIName](은)는 해당 탄원을 #P 승낙할 가능성이 매우 높습니다#! #weak (당신을 향한 [petition_recipient.GetHerHis] [opinion|E]에 의해, 알현에서 영향력을 행사할 수 있음)#!"
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.GetShortUIName](은)는 해당 탄원을 #P 승낙할 가능성이 있습니다#! #weak (당신을 향한 [petition_recipient.GetHerHis] [opinion|E]에 의해, 알현에서 영향력을 행사할 수 있음)#!"
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.GetShortUIName](은)는 해당 탄원을 #N 거절할 가능성이 있습니다#! #weak (당신을 향한 [petition_recipient.GetHerHis] [opinion|E]에 의해, 알현에서 영향력을 행사할 수 있음)#!"
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.GetShortUIName](은)는 해당 탄원을 #N 거절할 가능성이 매우 높습니다#! #weak (당신과 당신의 관계를 향한 [petition_recipient.GetHerHis] [opinion|E]에 의해, 알현에서 영향력을 행사할 수 있음)#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak [petition_recipient.GetFaith.GetName]의 기준에 따라, 대상의 [sinful|E] 및 [virtuous|E] [traits|E]이 알현에서 제시할 수 있는 주장에 영향을 줍니다.#!"
 petition_head_of_faith_decision_hook_available: "[petition_recipient.GetTitledFirstName]에게 [hook|E]을 사용하여 [piety|E] 비용을 면제받습니다"
 petition_head_of_faith_decision_cost_major_piety: "[piety_i][EmptyScope.ScriptValue('major_piety_value')|V0] [piety|E] 또는 [hook|E] 필요"
