 NOT_petition_head_of_faith_decision_cost_massive_piety: "$petition_head_of_faith_decision_cost_massive_piety$"
 petition_head_of_faith_decision_confirm: "탄원 준비"
 petition_head_of_faith_excommunication_setup_interaction: "파문 요청"
