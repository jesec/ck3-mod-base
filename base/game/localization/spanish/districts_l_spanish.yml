l_spanish:
 DISTRICT_DEBUG_KEY: "#D DEBUG KEY:#! [DistrictType.GetKey]"
 DISTRICT_DEBUG_FULL: "#D DEBUG KEY AND DESC:#!\n[District.GetKey]\n[District.GetDescKey]"
 bureacratic_district_capital_trigger: "[root_scope.GetName] es la [Concept('realm_capital', 'capital de tu señorío')|E]"
 civic_district_capital_trigger: "[root_scope.GetName] es tu [capital|El]"
 household_district_government_trigger: "Tu [government|El] es [feudal|El], de [clan|El], [administrative|El], [celestial|El], [meritocratic|El], [ritsuryo|El] o [soryo|El]"
 household_district_top_liege_trigger: "Eres un [independent_ruler|El], como se requiere para los [governments|El] de tipo [administrative|El], [celestial|El] y [meritocratic|El]"
 bureaucratic_district_ledger_or_administrative_trigger: "El titular tiene un [government|El] [Concept('administrative', 'administrativo')|E] o la [culture|El] de esta [barony|El] ha descubierto la [innovation|El] #V $innovation_ledger$#!"
 port_district_water_trigger: "Esta [barony|El] #bol no#! está junto a la costa o un río"
 temple_district_trigger: "No es la [Concept('county_capital', 'capital de un condado')|E], un [temple|El], ni una [temple_citadel|El]"
 metropolitan_district_city_trigger: "Esto es una [city_holding|El]"
 ### Holdings ###
 castle_holding_district: "Distrito de posesión con castillo"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "Distrito de posesión tribal"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "Distrito de posesión urbana"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "Distrito de posesión consagrada"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "Distrito de asentamiento nómada"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "Distrito de asentamiento pastoril"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "Distrito de posesión de ciudadela santuario"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"
 DISTRICT_FOCUS_HEADING: "#low Enfoque de distrito\n#!"
 UNLOCKS_DISTRICTS: "#low [districts|E] desbloqueados#!"
 ### Economy ###
 guild_district: "Distrito de gremios"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax|E] [artisan_tax_i]\n$BULLET_WITH_TAB$[prosperity|E] [prosperity_i]\n$BULLET_WITH_TAB$[trade_goods|E] [trade_goods_i]\n$BULLET_WITH_TAB$[sell_prices|E] [gold_i]"
 guild_district_desc_flavor: "El gremio aloja aquí a los mejores artesanos de la ciudad, que guardan celosamente los secretos de su oficio. Sus obras son excelentes, los precios son altos y sus aprendices están saturados de trabajo."
 market_district: "Distrito del mercado"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity|E] [prosperity_i]\n$BULLET_WITH_TAB$[sell_prices|E] [gold_i]\n$BULLET_WITH_TAB$[buy_prices|E] [gold_i]\n$BULLET_WITH_TAB$[commerce_tax_short|E] [commerce_tax_i] e [artisan_tax|E] [artisan_tax_i]"
 market_district_desc_flavor: "Campesinos locales, artesanos y mercaderes abarrotan esta bulliciosa plaza del alba al ocaso. Lo que la ciudad no pueda producir, se puede comprar aquí a un precio «justo»."
 port_district: "Distrito del puerto"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity|E] [prosperity_i]\n$BULLET_WITH_TAB$[trade_route_capacity_short|E] [trade_route_capacity_i]\n$BULLET_WITH_TAB$[maritime_tax|E] [maritime_tax_i]\n$BULLET_WITH_TAB$[settlement_size|E] [settlement_size_i]"
 port_district_desc_flavor: "Embarcaderos y almacenes se alinean en el muelle, donde los mozos de cubierta transportan cargamentos desde naves de todo tamaño. Todo aquello que venga del otro lado del mar pasa primero por aquí."
 entrepot_location_district: "Distrito de centro de intercambio"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax|E] [commerce_tax_i]"
 entrepot_location_district_desc_flavor: "[Concept( 'entrepot', 'Permite la reventa de artículos a larga distancia mediante sus edificios' )|E]\n\nLos artículos importados se cuentan, ordenan y envían al mercado desde estos almacenes. Los mercaderes de aquí siempre saben lo que escasea y cobran de acuerdo a ello."
 entrepot_holding_district_level_2_tt: "Requiere nivel #V 2#! del [holding_district|El]"
 entrepot_holding_district_level_3_tt: "Requiere nivel #V 3#! del [holding_district|El]"
 entrepot_holding_district_level_4_tt: "Requiere nivel #V 4#! del [holding_district|El]"
 holding_district_level_2_tt: "Requiere nivel #V 2#! del [holding_district|El]"
 holding_district_level_3_tt: "Requiere nivel #V 3#! del [holding_district|El]"
 holding_district_level_4_tt: "Requiere nivel #V 4#! del [holding_district|El]"
 ### Fortification ###
 border_forts_district: "Distrito de fuertes fronterizos"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison|E] [garrison_i]\n$BULLET_WITH_TAB$[stationed_regiment|E] [stationed_regiment_i]\n$BULLET_WITH_TAB$[levies|E] [levies_i]\n$BULLET_WITH_TAB$[control|E] [control_i]"
 border_forts_district_desc_flavor: "Una cadena de fuertes defiende los bordes de la baronía, cada uno de ellos guarnecido por soldados que conocen todos los caminos y vados. Los asaltantes que vienen en esta dirección no suelen llegar lejos."
 walls_district: "Distrito de murallas"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level|E] [fort_level_i]\n$BULLET_WITH_TAB$[control|E] [control_i]\n$BULLET_WITH_TAB$[garrison|E] [garrison_i]"
 walls_district_desc_flavor: "Robustos muros de piedra rodean la ciudad y ofrecen una protección excelente contra asaltantes. Los habitantes de la ciudad refunfuñan con el peaje de la puerta, pero aun así, es más barato que ser robado."
 ### Military ###
 military_district: "Distrito militar"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies|E] [levies_i]\n$BULLET_WITH_TAB$[stationed_regiment|E] [stationed_regiment_i]\n$BULLET_WITH_TAB$[siege_weapons|E] [siege_weapon_i]\n$BULLET_WITH_TAB$[garrison|E] [garrison_i]\n$BULLET_WITH_TAB$[supply|E] [supply_i]"
 military_district_desc_flavor: "Barracones robustos alojan a los soldados del señorío, los mantienen alimentados, entrenados y listos para marchar. Mantenerlos sobrios es otra cosa."
 ### Civic ###
 bureaucratic_district: "Distrito burocrático"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassals|E] [vassal_i]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence|E] [influence_i]\n$BULLET_WITH_TAB$[tax_collector|E] y [governor_efficiency|El]"
 bureaucratic_district_desc_flavor: "En estos salones, funcionarios de todo rango copian, sellan y rellenan los asuntos del señorío. Su trabajo rara vez recibe alabanzas, pero sin ellos, el señorío se paralizaría muy rápidamente."
 household_district: "Casa real"
 imperial_household_district: "Casa imperial"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E] [prestige_i]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knights|E] [knight_i]\n$BULLET_WITH_TAB$[opinion|E] [opinion_i]"
 household_district_desc_flavor: "En estos grandes salones el gobernante celebra la corte. Tras altos muros, servidores, artesanos capaces y consejeros por igual mantienen la majestad del señorío. Algunos pasan la vida entera aquí, sin abandonar este distrito."
 mandala_district: "Distrito mandala"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety|E] [piety_i]\n$BULLET_WITH_TAB$[dynasty_prestige|E] [dynasty_prestige_i]\n$BULLET_WITH_TAB$[tax|E] [gold_i]\n$BULLET_WITH_TAB$[opinion|E] [opinion_i]"
 mandala_district_desc_flavor: "Todo templo, estatua y ceremonia de este barrio sagrado cuenta la misma historia: el rey reina por la voluntad de los dioses. Se dice muy a menudo y en voz muy alta."
 temple_district: "Enclave religioso"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety|E] [piety_i]\n$BULLET_WITH_TAB$[religious_tax|E] [religious_tax_i]\n$BULLET_WITH_TAB$[epidemic_resistance|E] [epidemic_resistance_i]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]"
 temple_district_desc_flavor: "Lugares santos abarrotan este barrio; sus campanas, cánticos o llamadas a la oración marcan todas las horas del día. Aquí el clero tiene casi tanta influencia como el señor."
 temple_district_christian: "Enclave eclesiástico"
 temple_district_islamic: "Distrito de mezquitas"
 ### Metropolitan ###
 entertainment_district: "Distrito de entretenimiento"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]\n$BULLET_WITH_TAB$[urban_tax|E] [urban_tax_i]"
 entertainment_district_desc_flavor: "Música, juegos y espectáculos de todo tipo atraen a habitantes de toda clase a este barrio. Los nobles fingen no disfrutar de ellos y los campesinos fingen no ver a los nobles."
 patrician_district: "Distrito patricio"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size|E] [settlement_size_i]\n$BULLET_WITH_TAB$[prestige|E] [prestige_i]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]"
 patrician_district_desc_flavor: "Es frecuente ver mármol, seda y especias importadas en este barrio de casas acaudaladas. Las familias de este lugar se casan entre ellas, se prestan entre ellas y conspiran unas contra otras."
 urban_housing_district: "Distrito de vivienda"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size|E] [settlement_size_i] y [settlement_size_growth_short|El]\n$BULLET_WITH_TAB$[urban_taxes_short|E] [urban_tax_i] e [artisan_tax|E] [artisan_tax_i]\n$BULLET_WITH_TAB$Desbloquea [urban_districts|El]"
 urban_housing_district_desc_flavor: "La mayoría de la gente de la ciudad vive en estas calles abarrotadas, con varias familias bajo un techo. Para los recién llegados del campo, este es el primer paso para una vida mejor."
 ### Rural ###
 manor_houses_district: "Distrito de casas señoriales"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control|E] [control_i]\n$BULLET_WITH_TAB$[fort_level|E] [fort_level_i]\n$BULLET_WITH_TAB$ [agricultural_tax_short|E] [agricultural_tax_i] e [woodland_tax|El] [woodland_tax_i]\n$BULLET_WITH_TAB$[supply|E] [supply_i]"
 manor_houses_district_desc_flavor: "En la campiña, las casas señoriales son el hogar de familias nobles menores, que supervisan las tierras que las rodean. Cereales y monedas van hacia arriba y las quejas los acompañan."
 religious_community_district: "Distrito de comunidad religiosa"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety|E] [piety_i]\n$BULLET_WITH_TAB$[religious_tax|E] [religious_tax_i]\n$BULLET_WITH_TAB$[epidemic_resistance|E] [epidemic_resistance_i]\n$BULLET_WITH_TAB$[travel_danger|E] [travel_danger_i]"
 religious_community_district_desc_flavor: "Los devotos se reúnen en esta comunidad silenciosa para vivir separados del mundo, rezar, cultivar y copiar textos sagrados. Sin embargo, el mundo sigue enviándoles sus problemas."
 villages_district: "Distrito de aldeas"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size|E] [settlement_size_i] reducido\n$BULLET_WITH_TAB$[trade_goods_production|E] [trade_goods_i]\n$BULLET_WITH_TAB$[agricultural_tax_short|E] [agricultural_tax_i] e [woodland_tax|El] [woodland_tax_i]\n$BULLET_WITH_TAB$[supply|E] [supply_i]\n$BULLET_WITH_TAB$Desbloquea [rural_districts|El]"
 villages_district_desc_flavor: "Las aldeas salpican la campiña más allá de las murallas de la ciudad, cada una con campos y pozo propios. Aquí, los campesinos cultivan los alimentos que la ciudad da por sentados."
 ### Tribal ###
 tribal_economy_prestige_district: "Distrito de salones de banquetes"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E] [prestige_i]\n$BULLET_WITH_TAB$[tax|E] [gold_i]"
 tribal_economy_prestige_district_desc_flavor: "En estos salones de banquetes, la tribu se reúne para comer, beber y alardear de sus hazañas. Las historias se exageran un poco más con cada copa."
 tribal_military_district: "Distrito de alojamientos de guerra"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies|E] [levies_i]\n$BULLET_WITH_TAB$[men_at_arms|E] [men_at_arms_i]"
 tribal_military_district_desc_flavor: "Los guerreros de la tribu afilan sus armas en estos alojamientos e intercambian historias de asaltos pasados. Los jóvenes escuchan con atención y ya planean sus propias expediciones."
 tribal_wanua_district: "Distrito de wantilans"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods|E] [barter_goods_i]\n$BULLET_WITH_TAB$[vassal_limit|E] [vassal_limit_i]\n$BULLET_WITH_TAB$[domain_limit|E] [domain_limit_i]"
 tribal_wanua_district_desc_flavor: "La gente se reúne en estos salones abiertos para exponer sus agravios ante los ancianos y, por su parte, los ancianos se aseguran de que el jefe también los oiga."
 ### Duchy ###
 bailiwick_district: "Distrito de bailía"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_short|E] [agricultural_tax_i] e [woodland_tax|El] [woodland_tax_i]\n$BULLET_WITH_TAB$[trade_goods_production|E] [trade_goods_i]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]"
 bailiwick_district_desc_flavor: "El campo paga todo lo que hace el ducado y, en este distrito, los alguaciles se ocupan de ello; un campo, rebaño y aldea por vez."
 staple_district: "Distrito de despensa"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_taxes_short|E] [urban_tax_i], [commerce_tax_short|E] [commerce_tax_i], [artisan_tax_short|E] [artisan_tax_i] e [maritime_tax|E] [maritime_tax_i]\n$BULLET_WITH_TAB$[sell_prices|E] [gold_i]\n$BULLET_WITH_TAB$[trade_route_capacity_short|E] [trade_route_capacity_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 staple_district_desc_flavor: "Almacenes, balanzas y salas de cuentas ocupan el distrito de despensa, donde el comercio más valioso del ducado se pesa, se grava y se protege."
 endowment_district: "Distrito de donaciones"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax|E] [religious_tax_i]\n$BULLET_WITH_TAB$[piety|E] [piety_i]\n$BULLET_WITH_TAB$[epidemic_resistance|E] [epidemic_resistance_i]\n$BULLET_WITH_TAB$[travel_danger|E] [travel_danger_i]"
 endowment_district_desc_flavor: "Todo regalo hecho a esta donación se hace a perpetuidad y el clero de aquí posee privilegios de gobernantes cuyos nombres nadie más recuerda."
 assay_district: "Distrito de ensayo"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax|E] [mining_tax_i] e [civic_tax|E] [civic_tax_i]\n$BULLET_WITH_TAB$[control|E] [control_i]\n$BULLET_WITH_TAB$[influence|E] [influence_i]\n$BULLET_WITH_TAB$[vassals|E] [vassal_i]"
 assay_district_desc_flavor: "Unas cuantas monedas de cada envío acuñado en este distrito se guardan en un cofre para probar su ley más adelante, por si los acuñadores se volvieran codiciosos."
 military_duchy_capital_district: "Distrito de terrenos de reunión"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies|E] [levies_i]\n$BULLET_WITH_TAB$[stationed_regiment|E] [stationed_regiment_i]\n$BULLET_WITH_TAB$[garrison|E] [garrison_i] y [fort_level|El]\n$BULLET_WITH_TAB$[knights|E] [knight_i]"
 military_duchy_capital_district_desc_flavor: "Todo soldado que se congrega en este distrito se ve registrado: nombre, armas y caballo. Y quienes no aparecen también quedan registrados."
 ducal_residence_district: "Distrito de residencia ducal"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E] [prestige_i]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]\n$BULLET_WITH_TAB$[prosperity|E] [prosperity_i]\n$BULLET_WITH_TAB$[stress|E] [stress_i]"
 ducal_residence_district_desc_flavor: "Los huéspedes de este distrito se alojan en salones y jardines dignos de un duque, y más negocios del ducado se resuelven aquí durante una cena que en la corte."
 royal_residence_district: "Distrito de residencia real"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige|E] [prestige_i]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]\n$BULLET_WITH_TAB$[prosperity|E] [prosperity_i]\n$BULLET_WITH_TAB$[stress|E] [stress_i]"
 royal_residence_district_desc_flavor: "Los huéspedes de este distrito se alojan en salones y jardines dignos de un rey, y más negocios del señorío se resuelven aquí durante una cena que en la corte."
 governance_district: "Distrito de gobernanza"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control|E] [control_i]\n$BULLET_WITH_TAB$[influence|E] [influence_i]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i]\n$BULLET_WITH_TAB$[men_at_arms|E] [men_at_arms_i]"
 governance_district_desc_flavor: "Funcionarios de todos los rangos trabajan en los salones de este distrito, donde se cuentan los impuestos de la provincia, se inspeccionan sus graneros y se paga a sus guarniciones."
 forestry_district: "Distrito de bosques"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E] [woodland_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_glass').GetNameWithIcon], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon] y [GetTradeGoodType('trade_good_meat').GetNameWithIcon]"
 forestry_district_desc_flavor: "Los bosques de este lugar proporcionan madera para casas, barcos y hogueras, y el derecho a cortarlos se defiende con uñas y dientes. Robar madera se castiga casi tan severamente como la caza furtiva de ciervos."
 grain_district: "Distrito de cultivo de cereales"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|E] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 grain_district_desc_flavor: "Los cereales son la columna vertebral de toda economía y los campos de este distrito los cultivan en cantidad. Lo que no se convierte en pan, se elabora, se destila o se vende."
 wool_district: "Distrito de cría de ovejas"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon], [GetTradeGoodType('trade_good_leather').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon] y [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 wool_district_desc_flavor: "Rebaños de ovejas pacen en los pastos de este distrito y su lana se vende por sacos a tejedores de todo el señorío. La fortuna de más de un gran mercader empezó con un simple rebaño."
 cattle_district: "Distrito de cría de ganado"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|E] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_meat').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon] y [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 cattle_district_desc_flavor: "El ganado pace en los pastos de este distrito y es valorado por su carne, su leche y su fuerza con el arado. En muchos lugares, la dote de una novia aún se cuenta en vacas."
 cotton_district: "Distrito de cultivo de algodón"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] y [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 cotton_district_desc_flavor: "Las cápsulas de algodón blanco maduran en los campos de este distrito, se recogen a mano y se venden en fardos. Algunas gentes que viven lejos creen que crece de plantas que dan ovejitas."
 stone_district: "Distrito de canteras"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax|E] [mining_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 stone_district_desc_flavor: "Las canteras marcan las colinas de este distrito, donde se cortan piedras para murallas, templos y castillos de todo el señorío. Algunos de sus mejores edificios comenzaron en una ladera de aquí."
 fish_district: "Distrito de pesca"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax|E] [maritime_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 fish_district_desc_flavor: "El pescado de este distrito se come fresco, salado, ahumado o secado, y es vendido en el interior, donde el agua escasea. Una buena pesca puede alimentar a una aldea entera durante un mes."
 wine_district: "Distrito de viñedos"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 wine_district_desc_flavor: "Los viñedos de este distrito producen uvas para la mesa, para secar y, sobre todo, para hacer vino. Una buena añada se recuerda durante décadas, y una mala, más tiempo todavía."
 oil_district: "Distrito de olivares"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 oil_district_desc_flavor: "El aceite de este distrito alimenta lámparas y cocinas, unge a los fieles e incluso suaviza la piel de los ricos. Hay pocas cosas que no pueda hacer y pocas casas que carezcan de él."
 rice_district: "Distrito de cultivo de arroz"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] y [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 rice_district_desc_flavor: "Aquí los arrozales inundados ocupan las tierras, y los atienden aldeas enteras que plantan, arrancan malas hierbas y cosechan todos juntos. El cultivo de arroz es demasiado trabajo para una sola familia."
 millet_district: "Distrito de cultivo de mijo"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Posible producción [trade_goods_i]: [GetTradeGoodType('trade_good_wood').GetNameWithIcon]"
 millet_district_desc_flavor: "Aquí los campos de mijo y sorgo cubren las llanuras secas, tan altos como para ocultar a un jinete. Sus granos pequeños y duros pueden conservarse durante años sin que se echen a perder."
 mine_district: "Distrito minero"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax|E] [mining_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon]"
 mine_district_desc_flavor: "Todo lo que se encuentre bajo este distrito, ya sea hierro, plata o sal, lo excavan los mineros, que pasan más parte de su vida bajo la superficie que sobre ella."
 salt_district: "Distrito de extracción de sal"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax|E] [mining_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 salt_district_desc_flavor: "Sin sal no se puede conservar la carne ni el pescado para los meses de escasez ni alimentar a un ejército. Este distrito suministra una gran cantidad de ella, y lo sabe."
 amber_district: "Distrito de extracción de ámbar"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E] [woodland_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "La corriente trae aquí ámbar tras las tormentas y este se saca de la arena y marismas tierra adentro. Se cree que una pieza que contenga un insecto atrapado en su interior trae buena suerte."
 silk_district: "Distrito de cultivo de seda"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] y [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 silk_district_desc_flavor: "La seda de este distrito comienza como unos pequeños gusanos, alimentados con hojas de morera día y noche. Una sola vestidura requiere miles de capullos."
 furs_district: "Distrito peletero"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E] [woodland_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 furs_district_desc_flavor: "Los tramperos de este distrito salen en los meses más fríos, cuando la piel de los animales es más gruesa y valiosa. Una sola piel de calidad puede equivaler al salario de una estación."
 spices_district: "Distrito de cultivo de especias"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 spices_district_desc_flavor: "Aquí las especias provienen de cualquier parte de una planta: corteza, brotes, bayas, raíces o hebras de la flor. Todo se recoge a mano y se seca con cuidado."
 tea_district: "Distrito de cultivo de té"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 tea_district_desc_flavor: "Los arbustos de té crecen en las empinadas laderas de este distrito, donde el rocío flota por las mañanas. Las mejores hojas se recogen verdes, un solo brote y dos hojas por vez."
 dyes_district: "Distrito de tintorería"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 dyes_district_desc_flavor: "Los tintes de este distrito provienen de raíces, hojas, bayas y hasta insectos aplastados. Conseguir un color intenso y duradero puede requerir una docena de baños."
 ivory_district: "Distrito de caza de marfil"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax|E] [woodland_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 ivory_district_desc_flavor: "Los elefantes de este distrito se capturan, doman y adiestran para la guerra, el trabajo y el culto. Su marfil es solo una parte de su valor."
 sugar_district: "Distrito de cultivo de azúcar"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 sugar_district_desc_flavor: "La caña de azúcar crece alta en este distrito y se aplasta para conseguir su dulce jugo, que luego se cuece en barras duras. Muy lejos, una sola barra puede valer más que una vaca."
 incense_district: "Distrito de recolección de incienso"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 incense_district_desc_flavor: "El incienso de este distrito es resina que se sangra de árboles y se deja endurecer al sol. Su humo se eleva en templos por todo el mundo conocido."
 medicaments_district: "Distrito de recolección de plantas medicinales"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax|E] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 medicaments_district_desc_flavor: "Las hierbas medicinales crecen en los jardines y zonas silvestres de este distrito, y son recogidas por gente que sabe qué hojas curan y cuáles dañan."
 ceramics_district: "Distrito de fabricación de cerámica"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax|E] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_glass').GetNameWithIcon]"
 ceramics_district_desc_flavor: "La arcilla de este distrito es tan buena que los alfareros viajan durante semanas para extraerla. Las mejores piezas cocidas aquí resuenan como una campana al golpearlas."
 hemp_district: "Distrito de cultivo de cáñamo"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 hemp_district_desc_flavor: "Campos de cáñamo cubren este distrito, cuya producción se corta, deja en remojo y bate para sacar fibras que serán cuerdas, telas y lienzos."
 flax_district: "Distrito de cultivo de lino"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] y [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 flax_district_desc_flavor: "El lino se arranca de raíz en lugar de ser cortado, para preservar hasta el último centímetro de la fibra. Sus semillas son prensadas y con el resultado se alimenta a los animales."
 honey_district: "Distrito de colmenas"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] y [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 honey_district_desc_flavor: "Aquí las abejas se guardan en colmenas de paja, arcilla o troncos huecos y se tranquilizan con humo cuando se extrae la miel. Para la mayoría de la gente, es el único dulzor que probarán."
 fruit_district: "Distrito de recolección de fruta"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i] e [artisan_tax|El] [artisan_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]\n$BULLET_WITH_TAB$Producción posible [trade_goods_i]: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 fruit_district_desc_flavor: "Huertos frutales cubren las laderas y valles de este distrito y su fruta se come fresca, secada al sol o exprimida."
 horses_district: "Distrito de cría de caballos"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax|E] [agricultural_tax_i]\n$BULLET_WITH_TAB$[settlement_size_baseline|E] [settlement_size_i]"
 horses_district_desc_flavor: "Pastos abiertos, prados y establos llenan este distrito, donde se crían caballos, se doman y se venden a jinetes de todo el señorío."
