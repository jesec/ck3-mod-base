 theocratic_elective_pious: "El Piadoso"
 theocratic_elective_pious_desc: "#flavor El Colegio debe presentar un nombre que nadie pueda llamar indigno, un cardenal cuya vida sea la de un santo.#!\n\nPara convertirte en #EMP $theocratic_elective_pious$#!, destaca frente a cualquier otro [cardinal|El] en santidad. El [piety_level|El] es lo que más influye, seguido del [learning|El] y una vida de [GetTrait('lifestyle_scholar').GetName( GetPlayer )|l], [GetTrait('pilgrim').GetName( GetPlayer )|l] o [GetTrait('lifestyle_mystic').GetName( GetPlayer )|l]. Un solo [sin|El] con tu nombre resta más que lo que aporta una [virtue|El].[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "El Populista"
 theocratic_elective_populist_desc: "#flavor Un papa al que los fieles no siguen no es papa en absoluto; así pues, el Colegio propone un nombre que ya vitorean en las calles.#!\n\nPara convertirte en #EMP $theocratic_elective_populist$#!, destaca en fama frente a cualquier otro [cardinal|El]. Aumenta tu [prestige_level|El] y [diplomacy|El], ten [friends|El] en el [college_of_cardinals|E], ten [personal_tenets|El] con alta [tenet_popularity|E] y usa la [decision|lE] [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName].[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "El Poderoso"
 theocratic_elective_powerful_desc: "#flavor El trono de San Pedro tiene tanto enemigos como fieles; así pues, el Colegio propone a un prelado con los medios para sostenerlo.#!\n\nPara convertirte en #EMP $theocratic_elective_powerful$#!, destaca frente a cualquier otro [cardinal|El] en cuanto a relevancia en el mundo. Observa cómo tu [rite|El] se extiende por más [counties|El], mantén [holy_sites|El], eleva el [dynasty_prestige_level|El] o usa la [character_interaction|El] #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! para comprar tu camino hacia delante.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
