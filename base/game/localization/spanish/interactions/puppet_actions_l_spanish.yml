 request_clerical_elector_title_interaction_desc: "Pide a tu [head_of_faith|El] que te nombre [cardinal|El]. Tu [head_of_faith|El] pasará a ser tu [superior|El]"
 request_clerical_elector_title_interaction_notification: "He mantenido la fe con palabras y con hechos, y ahora pido poder servirla más de cerca. Concededme el capelo rojo y, cuando el colegio se pronuncie, nunca dudaréis de cuál será mi postura."
