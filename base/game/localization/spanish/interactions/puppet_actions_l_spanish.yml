 request_ecclesiastical_title_expansion_interaction_desc: "Pide a tu [head_of_faith|El] que amplíe tu [clerical_region|El] a un [duchy|El] adyacente\n\nTodos los condados [de_jure|El] del [duchy|El] elegido se añadirán a tu [clerical_region|El]"
 request_ecclesiastical_title_expansion_interaction_notification: "A los fieles de [target.GetNameNoTier] les falta un líder espiritual. Que estas tierras pasen a formar parte de mi archidiócesis, por la gloria de [actor.GetFaith.HighGodName]."
