 puppet_action_description_puppet_action_convert_to_religion: "Usa la [interaction|El] #V [GetPlayer.GetPlayerInteractionName('convert_to_religion_interaction')]#! para adoptar voluntariamente la [faith|El] de tu [liege|El] o [suzerain|El]"
