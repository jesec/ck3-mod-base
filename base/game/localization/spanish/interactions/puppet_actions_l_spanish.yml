 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "Usa la [interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#! para pedir al [head_of_faith|El] que funde un nuevo [title|El] de [clerical_region|El] afianzado a un [title|El] que tú elijas"
 request_create_new_ecclesiastical_title_effect_tt: "Se crea un [clerical_title|El] nuevo en la [capital|El] [de_jure|El] de [target_kingdom.GetName], que abarca todo [county|El] [de_jure|El] del [kingdom|El] [de_jure|El] de esa sede que no fuera parte ya de una [clerical_region|El], y se concede a [new_ecclesiastical_holder.GetShortUIName]"
 request_ecclesiastical_title_split_interaction: "Solicitar escisión de título eclesiástico"
 request_ecclesiastical_title_split_interaction_desc: "Pide a tu [head_of_faith|El] que trocee el [title|El] eclesiástico de una [clerical_region|El] existente y cree otro nuevo\n\nSi eres un [ruler|El] secular, se fundará en tu [capital|El] y se concederá al [holder|El] que escojas; si eres un clérigo terrateniente, serás tú su primer [holder|El]\n\n#weak La escisión seguirá las fronteras del señorío: el nuevo [title|El] abarcará solo los [counties|El] dentro de esta [clerical_region|El] tuya (o de tu [liege|El], si es que eres del clero), por lo que un [realm|El] más grande se llevará una parte mayor#!"
 request_ecclesiastical_title_split_interaction_notification: "Ningún pastor puede cuidar por sí solo de un rebaño tan extenso. Cread una nueva sede a partir de estas tierras y, así, ninguna alma que more en ellas volverá a pasar inadvertida."
 clerical_title_split_tt: "Se escinde y crea un nuevo título eclesiástico que abarca el [realm|El] [puppet_liege.Custom('ES_DelDela')] [puppet_liege.GetTitledFirstName|l] a partir de la [clerical_region|El] de [puppet_superior.GetName], y [new_ecclesiastical_holder.GetName] se convierte en su primer[new_ecclesiastical_holder.Custom('ES_XA')] [holder|El]"
 request_ecclesiastical_title_split_effect_tt: "Un [clerical_title|El] que abarca el [realm|El] [puppet_or_actor.Custom('ES_DelDela')] [puppet_or_actor.GetTitledFirstName|l] ha sido escindido de [split_source_clerical_region.GetName] y concedido a [new_ecclesiastical_holder.GetShortUIName]"
 request_ecclesiastical_title_split_accepted_tt: "Título eclesiástico escindido"
 request_ecclesiastical_title_split_lost_tt: "Región clerical reducida"
 actor_secondary_request_ecclesiastical_title_split_interaction: "Nuevo titular"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "Titular actual"
 pam_split_no_region_to_split_tt: "Debe formar parte de una [clerical_region|El] dentro de tu [realm|El] que se pueda trocear"
 pam_split_no_region_to_split_tt_puppeteer: "Debe formar parte de una [clerical_region|El] dentro del [realm|El] de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)] que se pueda trocear"
 pam_split_capital_is_region_seat_tt: "La [capital|El] de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)] no puede ser la [clerical_region_capital|El] de la [clerical_region|El] que se escinde"
 pam_split_no_eligible_holder_tt: "Debe haber un [holder|El] elegible para el nuevo [clerical_title|El]"
 pam_split_too_small_tt: "La nueva [clerical_region|El] sería demasiado pequeña: debe contener al menos #V 3#! [counties|El]"
