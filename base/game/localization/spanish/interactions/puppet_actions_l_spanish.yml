 puppet_modifier_removal.t: "Fin de la influencia del titiritero"
 modifier_removed_when_puppeting_ends_tt: "#weak #EMP Los [modifiers|El] del [puppet|El] duran mientras [recipient.GetShortUIName] sea tu [puppet|El]"
 IS_LOYAL: "[recipient.GetShortUIName] es [GetTrait('loyal').GetName( GetNullCharacter )|l]: $VALUE|=+0$"
 YOUR_GENDER_REASON: "Le molesta que le domine un[actor.Custom('ES_XA')] [actor.GetWomanMan]: $VALUE|=+0$"
 FORMER_PUPPET_REASON: "Fue tu títere con anterioridad: $VALUE|=+0$"
 SUCCESSION_RELATION_HEIR: "Heredero"
 pam_interactions_events.0120.opening: "A la figura [recipient.GetFaith.GetReligion.GetAdjective] de [recipient.GetFirstName]:"
 pam_interactions_events.0120.desc_religious_head_actor: "En verdad, desde que [recipient.GetFaith.CreatorName] engendró [recipient.Custom('ES_AlAla')] primer[recipient.Custom('ES_XA')] [recipient.GetWomenMen], ¡nunca hemos conocido un[recipient.Custom('ES_XA')] [recipient.GetTitleAsName|l] de vuestra calidad! Me pongo a vuestras órdenes, es un privilegio para mí obedecer.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "No puedo guiar a los fieles sin ayuda. Incluso [recipient.Custom('ES_ElLa')] primer[recipient.Custom('ES_OA')] entre el pueblo de [recipient.GetFaith.HighGodName], [recipient.Custom('ES_ElLa')] [recipient.GetTitleAsName|l] mism[recipient.Custom('ES_OA')], debe someterse a las costumbres de este mundo. Por lo tanto, os ayudaré y obedeceré, oh, [actor.GetTitleAsName|l].\n\n"
 pam_interactions_events.0120.desc: "Bendit[recipient.Custom('ES_OA')] soy en mi deber, pues debo atender a las almas tanto por orden de [recipient.GetFaith.HighGodName] como ¿por la vuestra? Me esforzaré por hacer todo lo que pueda.\n\n"
 pam_interactions_events.0120.desc_lunacy: "Pues temo que mi propio espíritu se esté muriendo… y ningún consejo, salvo el vuestro, me brinda consuelo alguno…\n\n"
 pam_interactions_events.0120.desc_dread: "Destruyamos juntos a quien deba ser destruido: aquellos a los que [recipient.GetFaith.HighGodName] ha abandonado… como [recipient.GetFaith.HighGodNameSheHe|U] me ha abandonado a mí.\n\n"
 pam_interactions_events.0120.desc_piety: "¡Pues [recipient.Custom('ES_ElLa')] mismísim[recipient.Custom('ES_OA')] [recipient.GetFaith.HighGodName|U] nos ha imbuido con un propósito sagrado!\n\n"
 pam_interactions_events.0120.desc_friendly: "Mi amor por mi [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] y mi absoluta confianza me guiarán por lo que está por venir.\n\n"
 pam_interactions_events.0120.desc_skill: "Bajo vuestra hábil dirección… espero formar parte de grandes cosas.\n\n"
 pam_interactions_events.0120.outro: "¿Cuáles de vuestras plegarias serán escuchadas?"
 pam_interactions_events.0120.a: "¡Todas las que tengo, oh, [recipient.GetTitleAsNameNoTooltip|l]!"
 pam_interactions_events.0121.opening: "Oh, venerable [ROOT.Char.GetTitleAsName|l]:"
 pam_interactions_events.0121.desc_honor: "Por la presente, dejo a un lado el orgullo que he sentido como [recipient.GetTitleAsName|l] de [recipient.GetPrimaryTitle.GetNameNoTier] y seguiré fielmente vuestros consejos.\n\n"
 pam_interactions_events.0121.desc: "[recipient.Custom('ES_ElLa')] [recipient.GetTitleAsName|l] de [recipient.GetPrimaryTitle.GetNameNoTier] desempeñará su papel en vuestros juegos de poder y os ayudará a medrar en este mundo mortal.\n\n"
 pam_interactions_events.0121.desc_lunacy: "Como decís: mi corte es un lugar de charlatanes y mentirosos. Mis sueños son oscuros. Solo vuestras palabras tienen sentido para mí, solo vuestros remedios pueden curarme…\n\n"
 pam_interactions_events.0121.desc_dread: "Soy un arma puesta en vuestras manos. Sin dudas, sin escrúpulos.\n\n"
 pam_interactions_events.0121.desc_piety: "¡Liberadme de mis dudas y mostradme el camino para ganarme el amor de [recipient.GetFaith.HighGodName]!\n\n"
 pam_interactions_events.0121.desc_friendly: "Mi [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], confío plenamente en vos y juro que no os fallaré.\n\n"
 pam_interactions_events.0121.desc_skill: "Confío en que, al velar atentamente por los asuntos de mi señorío, no permitiréis que yo falle.\n\n"
 pam_interactions_events.0121.outro: "Dejad que nos ocupemos de vuestros planes."
 pam_interactions_events.0121.a: "Por muy [recipient.GetTitleAsNameNoTooltip|l] que sea, sirve a su iglesia."
