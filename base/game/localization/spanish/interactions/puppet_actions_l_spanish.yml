 request_ecclesiastical_title_merger_interaction: "Solicitar fusión de título clerical"
 request_ecclesiastical_title_merger_interaction_desc: "Pide a tu [head_of_faith|El] que autorice la incorporación de un territorio vecino a la [clerical_region|El] de tu [Concept('capital_possessive', 'capital')|E]"
 request_ecclesiastical_title_merger_interaction_notification: "El rebaño de [target.GetNameNoTier] anda perdido por falta de mano firme, mientras que el mío prospera. Que esa sede pase a mi cargo, y un[ROOT.Char.Custom('ES_XA')] sol[ROOT.Char.Custom('ES_OA')] pastor[ROOT.Char.Custom('ES_XA')] fiel cuidará de lo que dos han dividido."
 request_ecclesiastical_title_merger_accepted_tt: "Título clerical fusionado"
 request_ecclesiastical_title_merger_absorbed_tt: "Título clerical perdido"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "No hay ninguna [clerical_region|El] vecina elegible: tu [clerical_region|El] debe compartir frontera al menos con una [clerical_region|El] de la misma fe"
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "Usa la [interaction|El] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#! para pedir a tu [head_of_faith|El] que fusione una [clerical_region|El] vecina con la tuya"
 rival_ecclesiastical_title_merged: "[CHARACTER.GetShortUIName] [CHARACTER.LocalPlayerString( 'absorbiste', 'absorbió' )] el [clerical_title|El] de [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu personaje', TARGET_CHARACTER.GetShortUIName )]."
 request_ecclesiastical_title_creation_interaction: "Solicitar creación de título clerical"
 request_ecclesiastical_title_creation_interaction_desc: "Pide a tu [head_of_faith|El] que establezca un nuevo [clerical_title|El] en tu [realm|El]\n\nTú eliges el [title|El] correspondiente y a su primer [holder|El]\n\n#weak La nueva [clerical_region|El] abarca todo [county|El] [de_jure|El] del [kingdom|El] [de_jure|El] de la sede que no pertenezca aún a ninguna [clerical_region|El]#!"
 request_ecclesiastical_title_creation_interaction_notification: "Los fieles de mis tierras son pastoreados desde la distancia por forasteros que no los conocen. Aprobad la creación de una nueva sede en el emplazamiento que yo nombre, y a mi grey no le faltará de nada."
 request_ecclesiastical_title_creation_accepted_tt: "Creación de [new_title.GetNameNoTooltip]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "No posees un [duchy|El] o [title|El] superior cuya [capital|El] [de_jure|El] pueda albergar una nueva [clerical_region|El]"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip] no posee un [duchy|El] o [title|El] superior cuya [capital|El] [de_jure|El] pueda albergar una nueva [clerical_region|El]"
 pam_new_clerical_region_invalid_anchor_tt: "La [capital|El] [de_jure|El] de este [title|El] debe ser de la [faith|El] del peticionario, estar en su [realm|El] y no estar ya dentro de una [clerical_region|El]"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "Requiere un candidato del [clergy|El] que no tenga aún una [clerical_region|El]"
