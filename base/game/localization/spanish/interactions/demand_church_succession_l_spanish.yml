l_spanish:
 demand_church_succession_interaction: "Exigir la sucesión de la Iglesia"
 demand_church_succession_religious_head_interaction: "Decretar la sucesión de la Iglesia"
 demand_church_succession_interaction_desc: "Si [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l] abandonase este mundo sin un heredero, las tierras que posee pasarían a manos del titular de [actor.GetPrimaryTitle.GetName] como [fallback_heir|El]."
 demand_church_succession_religious_head_interaction_desc: "Como [head_of_faith|El] de la [faith|El] [actor.GetFaith.GetAdjective], decreto que el señorío [recipient.Custom('ES_DelDela')] [recipient.GetTitledFirstName|l] recaerá en [actor.GetPrimaryTitle.GetName] si [recipient.GetSheHe] muere sin un heredero."
 demand_church_succession_target_in_reach: "El [realm|El] de [recipient.GetShortUIName] no limita con el [realm|El] de [actor.GetShortUIName] y no está en la [archdiocese|El] de [actor.GetShortUIName]"
 demand_church_succession_no_existing_fallback: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] ya le ha prometido la sucesión a otro clérigo o [fallback_heir|El]"
 demand_church_succession_no_elective: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] aplica en su [primary_title|El] una [elective_succession|El] o [advanced_succession|El]"
 demand_church_succession_recently_refused_tt: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] desafió recientemente una exigencia de sucesión de la Iglesia y se ha escudado ante exigencias similares en los próximos diez años"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Exigir la sucesión de la Iglesia"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.Custom('ES_ElLa')|U] [actor.GetTitledFirstName|l] exige que, si [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l] muere sin heredero, su señorío pase a manos de [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_actor_toast: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] está vinculad[recipient.Custom('ES_OA')] a la [faith|El]"
 demand_church_succession_actor_toast_desc: "Si muere sin tener un heredero, [actor.GetPrimaryTitle.GetName] heredará su señorío."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName] ha afianzado [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstName|l] a la [faith|El]"
 demand_church_succession_actor_toast_desc_puppeteer: "Si muere sin tener un heredero, [puppet_or_actor.GetPrimaryTitle.GetName] heredará su señorío."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "Por la gracia de [actor.GetFaith.HighGodName], os escribimos en relación al asunto de la herencia."
 demand_church_succession.0001.desc.archbishop: "Desde mi archidiócesis, que vela por vuestras tierras, os escribo sobre el asunto de la herencia."
 demand_church_succession.0001.desc.bishop: "Vuestro pastor os escribe por el asunto de la herencia."
 demand_church_succession.0001.desc.head_of_faith_generic: "Como [actor.GetTitleAsNameNoTooltip|l] de la fe, os escribo por el asunto de la herencia."
 demand_church_succession.0001.desc.theocrat_generic: "Desde el altar de [actor.GetFaith.HighGodName], os escribo sobre el asunto de la herencia."
 demand_church_succession.0001.flavour.zealous: "\n\nNo os confundáis:"
 demand_church_succession.0001.flavour.ambitious: "\n\nHablemos con franqueza:"
 demand_church_succession.0001.flavour.deceitful: "\n\nSin duda, esto os agradará:"
 demand_church_succession.0001.flavour.greedy: "\n\nIré al grano:"
 demand_church_succession.0001.flavour.compassionate: "\n\nPerdonad la necesidad, [recipient.GetTitledFirstName|l], pero…"
 demand_church_succession.0001.flavour.default: "\n\nLo diré sin rodeos:"
 demand_church_succession.0001.recipient.elderly_childless: "la cuna junto al fuego de vuestro hogar está vacía, y el linaje acaba con vos. Los fieles esperarán y, con el tiempo, heredarán."
 demand_church_succession.0001.recipient.childless: "no tenéis hijos vivos. Si [actor.GetFaith.HighGodName] no hace que esto cambie, vuestras tierras servirán a la fe."
 demand_church_succession.0001.recipient.one_child: "un solo descendiente se interpone entre vos y el final. Si [actor.GetFaith.HighGodName] lo reclama, los fieles estarán listos para gobernar."
 demand_church_succession.0001.recipient.default: "los años sienten celos de las promesas. Si la vuestra falla, vuestras tierras pasarán a ser nuestras y las gobernaremos en nombre de [actor.GetFaith.HighGodName]."
 demand_church_succession.0001.a: "Así está escrito y así será."
 demand_church_succession.0001.b: "Será mejor que sea [ROOT.Char.GetMotherFather] de un heredero, entonces."
 demand_church_succession.0001.c: "[actor.Custom('ES_ElLa')|U] [actor.GetTitledFirstNameNoTooltip|l] se sobrepasa."
 demand_church_succession.0001.c.tt: "Resuelves el asunto del [fallback_heir_title|El] y te escudas de futuras exigencias de sucesión de la Iglesia en los próximos diez años, pero [actor.Custom('ES_ElLa')] [actor.GetTitledFirstNameNoTooltip|l] no olvidará ese desliz"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "He leído vuestra exigencia y me opongo a ella. Mi señorío no caerá en manos de la Iglesia. Atended vuestro altar, [actor.GetTitledFirstName|l], y yo atenderé mis tierras."
 demand_church_succession.0002.a: "La insolencia será recordada."
 demand_church_succession_fertility_modifier: "Ha decidido engendrar un heredero"
 demand_church_succession_fertility_modifier_desc: "Con la idea de mantener el señorío lejos de las manos de los clérigos, este personaje ha redoblado sus esfuerzos en el lecho conyugal."
 defied_church_succession_opinion: "Rechazó mi derecho a la sucesión"
 meddling_church_opinion: "Se interpuso en mi sucesión"
