l_spanish:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ atrapados en una ola de calor"
 gdp_travel_events.1000.desc: "Las dunas de [ROOT.Char.GetCurrentLocation.GetName] se extienden más allá del horizonte en un mar de arena sin fin. El calor del sol pinta un patrón cambiante e hipnótico sobre la superficie. Empapados de sudor sin una sombra a la visa, nos paramos a descansar. Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetFirstName] se vuelve hacia mí con los ojos abiertos de par en par. \n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], no temáis el calor, ¡pues anoche recibí una bendición de [entourage_member_one.GetFaith.HighGodName]! La visión de un oasis no lejos de aquí»."
 gdp_travel_events.1000.a: "¡En realidad, debería ser por aquí!"
 gdp_travel_events.1000.b: "No nos quedan opciones, probemos."
 gdp_travel_events.1000.b.success: "Alabemos a [entourage_member_one.GetFaith.HighGodName], el oasis es real"
 gdp_travel_events.1000.b.failure: "No ha sido más que un espejismo"
 gdp_travel_events.1000.c: "No depositaré mi confianza en visiones."
 low_caravaneer_experience_reason_tooltip: "Requiere #V 100#! de [trait_level_track_xp|E] en la pista de $trait_track_caravaneer$ ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])"
 gdp_travel_events.1010.t: "Viajeros perdidos"
 gdp_travel_events.1010.desc: "Por el camino de tal [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], nuestra caravana se prepara para levantar el campamento. En cuanto estamos a punto de ponernos cómodos para pasar la noche, una voz débil nos llama a la espalda.\n\n«Disculpadme, [ROOT.Char.Custom('FormOfAddressForLiege')]. Mi familia y yo somos viajeros separados de nuestra caravana. No tenemos mucho que ofrecer, pero daré lo que sea para que mi [traveler_child.Custom('GetDaughterSon')] esté a salvo esta noche."
 gdp_travel_events.1010.a: "Guardaos vuestras monedas. Venid con nosotros."
 gdp_travel_events.1010.b: "Podemos acogeros… por un precio módico."
 gdp_travel_events.1010.c: "#EMP Lo que sea#!, decís…"
 gdp_travel_events.1010.d: "Tenemos demasiadas bocas que alimentar."
 gdp_travel_events.1020.t: "Datos en el camino"
 gdp_travel_events.1020.desc.intro: "Siento profundamente en el trasero la distancia del viaje desde [journey_start.GetName] según mi [ROOT.Char.Custom('GetDonkeyDromedary')] trota por el terreno de [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]. Pero a mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] no parece afectarle la excursión cuando se sitúa a mi lado, con ganas de contarme algo.\n\n"
 gdp_travel_events.1020.desc.caravaneer: "«Una pequeña anécdota, [ROOT.Char.Custom('FormOfAddressForLiege')], el otro día hablé con el jefe de una caravana de [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]. Me habló de un artilugio de navegación magnífico…»."
 gdp_travel_events.1020.desc.artisan: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U], ¿sabíais que se emplea [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] para hacer un tinte estupendo? Si tomamos los pétalos y los molemos…»."
 gdp_travel_events.1020.desc.creditor: "«Algo gracioso, [ROOT.Char.Custom('FormOfAddressForLiege')]; en algunos lugares el saqueo #EMP puede#! ser legal si la víctima está en deuda con nosotros. Eso me recuerda a cuando mis primos y yo…»."
 gdp_travel_events.1020.desc.war_profiteer: "«Un dato interesante para vos, [ROOT.Char.Custom('FormOfAddressForLiege')]; este terreno de [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] fue en el pasado el lugar de una gran batalla. Aquí cayó un gran espadachín, se dice que despedazaba a sus enemigos como un ejemplar de [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]…»."
 gdp_travel_events.1020.a: "Fascinante, contadme más."
 gdp_travel_events.1020.b: "Mejor hablemos de [ROOT.Char.Custom('my_subject_of_interest')]."
 gdp_travel_events.1020.c: "Prefiero cabalgar en silencio."
 gdp_travel_events.1020.b.success: "Cambias el tema de la conversación"
 gdp_travel_events.1020.b.failure: "A [associate.GetFirstNameNoTooltip] no le interesa escucharte"
 gdp_travel_events.1030.t: "Susurros viles"
 gdp_travel_events.1030.desc: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))] [ambitious_associate.GetFirstName] se desliza hasta mí y echa un vistazo alrededor para ver si hay espectadores. Se encorva más cerca y susurra:\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], he oído noticias preocupantes sobre [current_partner.GetFirstName], vuestr[current_partner.Custom('ES_OA')] soci[current_partner.Custom('ES_OA')]. En la compañía se cuenta que #EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!. Si es cierto, ¡debemos llevar[current_partner.GetHerHim] ante la justicia!\n\n… y ¿tal vez hubiera una recompensa para quien os trajo estas graves noticias?»."
 gdp_travel_events.1030.a: "¡Debo saber la verdad!"
 gdp_travel_events.1030.a.unity_loss.desc: "Descubierta la naturaleza de tu soci[current_partner.Custom('ES_OA')]"
 gdp_travel_events.1030.b: "No deseo hacer conjeturas."
 gdp_travel_events.1030.b.unity_gain.desc: "Te niegas a participar en habladurías sobre tu soci[current_partner.Custom('ES_OA')]"
 gdp_travel_events.1040.t: "$travel_danger_prefix$ pozo descuidado"
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName] se asoma a un pozo viejo y arruga la nariz.\n\nEl pozo lleva demasiado tiempo sin atender. Tiene las rocas llenas de maleza, el cubo está medio podrido y sus aguas han adquirido una fetidez tal que hasta un hombre sediento dudaría en beber.\n\nPor desgracia, nuestras cantimploras están flácidas, casi vacías y la sed se vuelve insoportable."
 gdp_travel_events.1040.a: "¡Un poco de porquería no puede hacer daño a un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] como yo!"
 gdp_travel_events.1040.b: "Sé un modo de purificar el agua."
 gdp_travel_events.1040.c: "Tendremos que racionar el agua que nos quede."
 gdp_travel_events.1040.d: "Será un viaje largo y sediento."
 gdp_travel_events.1040.e: "Tal vez solo un sorbo…"
 gdp_travel_events.1040.e.critical_failure.tt: "Tu enfermedad empeora."
 gdp_travel_events.1040.e.success: "El agua es potable."
 gdp_travel_events.1040.e.success.desc: "Bebes del pozo y te sientes refrescad[ROOT.Char.Custom('ES_OA')]."
 gdp_travel_events.1050.t: "$travel_danger_prefix$ troncos abatidos"
 gdp_travel_events.1050.desc: "Una tormenta ha arrasado el terreno de [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], arrancando árboles de cuajo, que ahora yacen tirados por el camino. Los trabajadores locales cortan los restos, pero llevará un tiempo hasta que podamos pasar.\n\nEl terreno de [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] que rodea el obstáculo se puede atravesar, pero unos árboles en un equilibrio precario lo convierten en un desvío peligroso."
 gdp_travel_events.1050.x: "¡Mi corcel, [ROOT.Char.Custom('WarhorseStoryName')], apartará estos obstáculos!"
 gdp_travel_events.1050.a: "También podría usar las manos."
 gdp_travel_events.1050.b: "Podríamos aprender de sus métodos."
 gdp_travel_events.1050.c: "Encontremos un modo de rodear el obstáculo."
 gdp_travel_events.1050.d: "Esperaremos a que los trabajadores terminen."
 gdp_travel_events.1050.c.success: "Encuentras un camino entre los árboles caídos."
 gdp_travel_events.1050.c.failure: "Te acabas hiriendo en la naturaleza."
 gdp_travel_events.1060.t: "$travel_danger_prefix$ ratas en la bodega"
 gdp_travel_events.1060.desc: "La bodega del barco está llena de ratas que se dan un festín con nuestras provisiones. Algunos le echan la culpa a un almacenamiento inadecuado, cierres sueltos y sacos desgastados. Otros al increíble tamaño de la plaga.\n\nSea cual sea el motivo, perdemos rápidamente la batalla y debemos actuar antes de que las asquerosas ratas se zampen todo lo que tenemos y acabemos sin nada."
 gdp_travel_events.1060.x: "Que mi gato, [ROOT.Char.Custom('CatStoryName')], se ocupe de esto."
 gdp_travel_events.1060.a: "«¡Traedme un arpón y una buena red!»."
 gdp_travel_events.1060.b: "¡Yo personalmente solucionaré el problema de almacenamiento!"
 gdp_travel_events.1060.c: "Poner rumbo a un puerto y reponer suministros."
 gdp_travel_events.1060.d: "¡Todos a cazar ratas!"
 gdp_travel_events.1060.b.tt: "Debes tener al menos #V 25#! de [expertise|El] en [GetTradeGoodCategory('trade_category_cereals').GetName|l]"
 gdp_travel_events.1070.t: "$travel_danger_prefix$ una diana en la espalda"
 gdp_travel_events.1070.desc: "Hace un momento había polvo en el horizonte, al siguiente divisamos una partida de malhechores que encabritan sus caballos sobre una cresta con escombros.\n\n«¡Alto!», me grita su líder. «Entregadnos pacíficamente el oro que ganasteis, [ROOT.Char.GetTitleAsNameNoTooltip|l], y nadie saldrá herido»."
 gdp_travel_events.1070.a: "«¡Viajo bajo la protección de [ROOT.Char.GetSuzerain.GetShortUIName], sabandijas!»."
 gdp_travel_events.1070.a.success: "El nombre de tu patr[ROOT.Char.GetSuzerain.Custom('ES_OnOna')] te da paso libre"
 gdp_travel_events.1070.b: "«¡Nos lo tendréis que quitar!»."
 gdp_travel_events.1070.b.success: "Rechazas a los bandidos"
 gdp_travel_events.1070.b.failure: "Los bandidos se llevan tu oro"
 gdp_travel_events.1070.c: "«Lo que sea si nos dejáis pasar»."
 gdp_travel_events.2000.t: "La torre inclinada"
 gdp_travel_events.2000.desc: "¿Me falla… la vista? ¿Mis pies no están tan firmes en el suelo como los siento? No, los sentidos no me fallan, a pesar de lo irreal de la visión que tengo ante mí. ¡#EMP La gran [GetBuildingType('tower_of_pisa').GetNameNoTooltip|l] se inclina#!!\n\n«El terreno aquí es tan firme como la leche cuajada, [ROOT.Char.Custom('FormOfAddressForLiege')]», dice [mason.GetFirstName], [mason.Custom('ES_ElLa')] albañil mayor que está a mi lado. «Empezó a inclinarse cuando ya estábamos a un cuarto de la altura, pero al final conseguimos terminarla.\n\n«Es magnífica, ¿verdad?»."
 gdp_travel_events.2000.a: "Tal vez su #EMP peculiaridad#! atraiga a los viajeros, ¿no?"
 gdp_travel_events.2000.b: "O sois un[mason.Custom('ES_XA')] geni[mason.Custom('ES_OA')] o estáis loc[mason.Custom('ES_OA')]. ¡Os contrato!"
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip],"
 gdp_travel_events.2002.desc: "Nuestros albañiles se alegran de informar de que por fin está terminada la majestuosa [GetBuildingType('tower_of_pisa').GetNameNoTooltip|l].\n\nMas debo informar de que también he oído noticias peculiares de Pisa, de viajeros que hablan de un edificio #EMP muy#! distinto de todo lo que han visto antes. Me temo que puede algo haya fallado en su construcción."
 gdp_travel_events.2002.a: "Yo juzgaré el trabajo con mis propios ojos."
 gdp_travel_events.2002.b: "Me da lo mismo mientras se mantenga erguida."
