l_spanish:
 culture_notification.0010.t: "Tradición abandonada"
 culture_notification.0010.desc: "La [culture|lE] [this_player.GetCulture.GetName] ha abandonado la tradición [tradition.GetName|l]"
 culture_notification.0011.t: "Tradición adoptada"
 culture_notification.0011.desc: "La [culture|lE] [this_player.GetCulture.GetName] ha adoptado la tradición [tradition.GetName|l]"
 culture_notification.1001.t: "Cultura híbrida: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1001.desc: "[founder.GetTitledFirstName] ha formado la [hybrid_culture|lE] [new_culture.GetName|V] a partir de las culturas [parent_1.GetNameNoTooltip] y [parent_2.GetNameNoTooltip]"
 culture_notification.1011.t: "La hibridación [new_culture.GetNameNoTooltip]"
 culture_notification.1011.intro: "Años de intercambio han atraído a las gentes de [parent_1.GetName] y [parent_2.GetName]; tanto que algo nuevo ha arraigado, una comunidad que se hace llamar [new_culture.GetName].\n\n"
 culture_notification.1011.blend: "La mezcla es obvia. Conservan la tradición [tradition_1.GetName] de [parent_1.GetNameNoTooltip], junto con la costumbre de [tradition_2.GetName] de [parent_2.GetNameNoTooltip]. Juntas, definen a este nuevo pueblo."
 culture_notification.1011.blend_fallback: "Ninguno de los progenitores reclama la mayoría; la usanza [new_culture.GetNameNoTooltip] combina ambos mundos a la perfección."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "La [hybrid_culture|lE] [new_culture.GetName] se ha formado a partir de las [cultures|lE] [parent_1.GetName] y [parent_2.GetName]"
 culture_notification.1101.t: "Cultura divergida: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "[founder.GetTitledFirstName] ha creado la cultura [new_culture.GetName|V], [Concept( 'divergent_culture', 'divergente' )|E] de la [parent_1.GetNameNoTooltip]"
 culture_notification.1111.t: "La divergencia [new_culture.GetNameNoTooltip]"
 culture_notification.1111.intro: "Un dialecto alterado por aquí, una costumbre nueva por allá…, algo fácil de obviar. Pero se acabó, los [parent_1.GetCollectiveNoun] de [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ahora se hacen llamar la nación [new_culture.GetName].\n\n"
 culture_notification.1111.tradition.new: "Las tradiciones de sus predecesores dejan paso a [new_tradition.GetName]."
 culture_notification.1111.tradition.lost: "La costumbre [lost_tradition.GetName] de los [parent_1.GetCollectiveNounNoTooltip] que han abandonado."
 culture_notification.1111.ethos.bellicose: "Acosados por enemigos y rivales, los [new_culture.GetCollectiveNounNoTooltip] han generado una ética [new_culture.GetEthos.GetName] y confiado su fortuna a la fuerza de las armas."
 culture_notification.1111.ethos.bureaucratic: "Los [new_culture.GetCollectiveNounNoTooltip] han recurrido a una ética [new_culture.GetEthos.GetName] y se consuelan en extensos privilegios y crónicas más extensas si cabe."
 culture_notification.1111.ethos.courtly: "Entregados a los modales y la ceremonia, los [new_culture.GetCollectiveNounNoTooltip] ahora se dedican a una manera de vivir [new_culture.GetEthos.GetName]."
 culture_notification.1111.ethos.communal: "En un triunfo y una tragedia por igual compartidos, los [new_culture.GetCollectiveNounNoTooltip] han adoptado la usanza [new_culture.GetEthos.GetName], estrechamente unida a sus vecinos."
 culture_notification.1111.ethos.stoic: "En un mundo peligroso e impredecible, los [new_culture.GetCollectiveNounNoTooltip] han adoptado la manera [new_culture.GetEthos.GetName] y valoran la fuerza de espíritu por encima de todo."
 culture_notification.1111.ethos.spiritual: "Buscando respuestas en sí mismos, los [new_culture.GetCollectiveNounNoTooltip] se han convertido en una nación [new_culture.GetEthos.GetName], más devotos que nunca."
 culture_notification.1111.ethos.egalitatian: "Ahora, entre los [new_culture.GetCollectiveNounNoTooltip], el origen cuenta menos que el mérito; la suya es una sociedad [new_culture.GetName]."
 culture_notification.1111.ethos.unchanged: "Su perspectiva sobre la vida no ha cambiado, pero las divisiones sobre políticas y fronteras han convertido un pueblo en dos."
 culture_notification.1111.outro.other: "\n\nYa sea por astucia o por convicción, [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l] ahora se encuentra a la cabeza de este despertar cultural."
 culture_notification.1111.outro.founder: "\n\nLa nación [new_culture.GetNameNoTooltip] ahora se fija en mí. Nuestro futuro empieza aquí."
 culture_notification.1111.a.other: "Veremos cómo se desarrolla la situación."
 culture_notification.1111.a.founder: "¡Por una era nueva, una época nueva, un pueblo nuevo!"
 culture_notification_tooltip: "La [divergent_culture|E] [new_culture.GetName] se ha separado de la [culture|lE] [parent_1.GetName]."
