 yearly_republic.1015.t: "Oro por votos"
 yearly_republic.1015.desc: "[patrician.Custom('ES_ElLa')|U] [patrician.GetTitledFirstName|l] me encuentra cuando daba un paseo por el mercado. Se me acerca, tod[patrician.Custom('ES_OA')] sonrisas y una voz cuidadosamente baja.\n\n«Ah, qué agradable tomarse un descanso del tremendo asunto que son las votaciones en la asamblea. A menudo me hallo perplej[patrician.Custom('ES_OA')] sobre cómo votar. Una mente sabia como la vuestra es como faro dorado en un mar brumoso, que permite [Select_CString(patrician.IsFemale, 'a las desdichadas', 'a los desdichados' )] como yo hallar la ruta en cuestiones políticas tan tirantes», suspira con aire dramático.\n\n«Pero me encuentro falt[patrician.Custom('ES_OA')] de metálico. ¿Cómo debería [Select_CString(patrician.IsFemale, 'una pobre barquera', 'un pobre barquero' )] dirigir su proa la próxima vez que la asamblea llame a votar?»."
 yearly_republic.1015.a: "Poned un precio."
 yearly_republic.1015.c: "Mis propuestas se sostendrán por sus méritos propios."
 yearly_republic.1016.t: "Sacar el voto a palos"
 yearly_republic.1016.desc: "[patrician.Custom('ES_ElLa')|U] [patrician.GetTitledFirstName|l] es un gusano insolente, pero tiene igualmente un voto en la asamblea; uno que podría «convencer» para ponerlo a mi disposición.\n\nSolo tengo que ejercer algo de presión sobre su persona, para que entienda las consecuencias que conlleva decepcionar a alguien como yo."
 yearly_republic.1016.a: "Sabotear sus intereses comerciales."
 yearly_republic.1016.b: "Que unos matones aguarden a uno de sus cortesanos y le den una paliza."
 yearly_republic.1016.c: "Prender fuego a su hogar."
 yearly_republic.1016.d: "¡Le enseñaré lo que es el temor!"
 yearly_republic.1016.e: "Que vote según su conciencia."
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip] se compromete a votar igual que tú"
 yearly_republic.1016.d.tt: "Se dará ejemplo con los [house_member.GetNameNoTooltip]."
 yearly_republic.1017.t: "Reyes filósofos"
 yearly_republic.1017.desc: "La cena se ha prolongado hasta altas horas de la madrugada; las bebidas corren y las lenguas se sueltan.\n[debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName] y yo hemos debatido sobre todo tema conocido.\n\nCaigo en que dialogo con algunos de los patricios más doctos de la república; una compañía ciertamente ilustre. La clase de gente a la que se podría convencer para que votaran a mi favor la próxima vez que la asamblea se reúna, si uso unos argumentos sensatos y un pensamiento brillante."
 yearly_republic.1017.a: "Una oratoria brillante les convencerá."
 yearly_republic.1017.b: "La sensatez de mi razonamiento les deslumbrará."
 yearly_republic.1017.c: "Tal vez sea mejor escuchar y aprender."
 yearly_republic.1017.a.success.desc: "Superas en retórica a [debater_orator.GetFirstNameNoTooltip], [debater_orator.Custom('ES_ElLa')] mejor orador[debater_orator.Custom('ES_XA')] de la mesa"
 yearly_republic.1017.a.success.toast: "Te has ganado a la mesa"
 yearly_republic.1017.a.failure.desc: "[debater_orator.GetFirstNameNoTooltip], [debater_orator.Custom('ES_ElLa')] mejor orador[debater_orator.Custom('ES_XA')] de la mesa, te mete en una discusión sin fin"
 yearly_republic.1017.a.failure.toast: "Tu retórica fracasa"
 yearly_republic.1017.b.success.desc: "Superas en argumentos a [debater_scholar.GetFirstNameNoTooltip], la mente más culta de la mesa"
 yearly_republic.1017.b.success.toast: "La mesa queda convencida"
 yearly_republic.1017.b.failure.desc: "[debater_scholar.GetFirstNameNoTooltip], la mente más culta de la mesa, hace pedazos tu argumento"
 yearly_republic.1017.b.failure.toast: "Tu argumento es destrozado"
 yearly_republic.1017.c.toast: "Una noche pasada escuchando"
 yearly_republic.1017.c.tt: "Hay una pequeña posibilidad de que el debate nocturno deje una huella permanente en ti"
 yearly_republic.1017.c.insight.toast: "El debate deja huella"
 yearly_republic.1018.t: "Cuando traen regalos"
 yearly_republic.1018.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName] llega a mis puertas sin avisar. Después de intercambiar saludos y un abrazo sincero, [benefactor_01.GetFirstNameNoTooltip] me lleva fuera hasta un carromato cargado con artículos y alhajas.\n\n«Perdonad que no os avisara de mi visita, pero pasaba por aquí y se me ocurrió que vos disfrutaríais con tal [new_curio.GetType|l] que conseguí en mis viajes recientes».\n\n[benefactor_01.GetSheHe|U] levanta un lienzo del carromato para revelar su [new_curio.GetName|l]."
 yearly_republic.1018.a: "«¡Gracias, [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] mí[benefactor_01.Custom('ES_OA')]!»."
 yearly_republic.1018.b: "A lo mejor se le podría sacar un buen precio."
 yearly_republic.1018_domicile_curio_sold_tt: "Luego vendes tu [new_curio.GetName|l]."
 yearly_republic.1019.t: "Vista para los detalles"
 yearly_republic.1019.desc: "Otro día que recorro las calles de [event_location_01.GetName] con mi [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetShortUIName]. Siempre hay algo a lo que mirar y discutir.\n\n«Mirad cómo almacenan ese producto; he visto cómo lo hacían mucho mejor en [target_city.GetNameNoTooltip]. Os diré una cosa, [ROOT.Char.GetFirstNameNoTooltip], hay mucho que aprender de la gente que nos rodea, con solo prestar algo de atención."
 yearly_republic.1019.a: "«¿Aprendisteis sobre [experience_trade_category_01.GetNameNoTooltip|l] en vuestros viajes?»."
 yearly_republic.1019.b: "«Discutamos los negocios de [experience_trade_category_02.GetNameNoTooltip|l] en el mercado»."
 yearly_republic.1019.c: "Debería convertir la observación en un hábito diario."
 yearly_republic.1020.t: "El acuerdo de la casa de baños"
 yearly_republic.1020.desc: "«… después de todo, los negocios prosperan entre socios de confianza».\n\nTras echarse un cubo de agua por encima, [house_benefactor_01.GetFirstName] se gira de nuevo hacia mí con una expresión seria. «Vuestra familia cuenta con nuestro respeto, [ROOT.Char.GetFirstName]».\n\nEl vapor de la casa de baños me nubla la vista y el agua me relaja los músculos.\n\n«Vos y los vuestros habéis sido buenos amigos de la casa [house_benefactor_01.GetDynastyHouseNameNoTooltip] y me parece que lo natural es profundizar en nuestra cooperación, para beneficio de ambas casas»."
 yearly_republic.1020.a: "«Deberíamos compartir agentes y contactos en el extranjero para ampliar nuestro alcance»."
 yearly_republic.1020.b: "«Compartamos nuestra pericia y crezcamos más fuertes juntos»."
 ## GLOSS
 BUCENTAUR_GLOSS: "El Bucintoro era la galera dorada estatal de Venecia, impulsada por remeros del Arsenal y que solo se empleaba para ceremonias."
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! — en latín significa «nos te desposamos, mar, en señal de domino verdadero y perpetuo»."
