 yearly_republic.1014.align_ghibellines_success.toast: "Las casas se vuelven gibelinas"
 yearly_republic.1014.tt.align_ghibellines_failure.desc: "El debate se agría y las casas siguen sus propios consejos"
 yearly_republic.1014.align_ghibellines_failure.toast: "Las casas se mantienen divididas"
