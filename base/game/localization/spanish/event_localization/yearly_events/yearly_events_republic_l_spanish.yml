l_spanish:
 yearly_republic.1001.t: "Venid al lecho, amor"
 yearly_republic.1001.desc: "Incluso cuando se acerca la medianoche, mi [spouse_target.GetWifeHusband], [spouse_target.Custom('ES_ElLa')] [spouse_target.GetTitledFirstName|l], me encuentra otra vez absorbid[ROOT.Char.Custom('ES_OA')] por documentos, revisando de nuevo los libros de cuentas.\n\n«Venid al lecho, [ROOT.Char.GetWifeHusband] mí[ROOT.Char.Custom('ES_OA')]», ruega. «¿No podrá esperar el trabajo hasta mañana?».\n\n«O», dice [spouse_target.GetFirstNameNoTooltip] pensativ[spouse_target.Custom('ES_OA')], «¿tal vez debería compartir vuestras labores?»."
 yearly_republic.1001.a: "Traednos más velas, amor mío."
 yearly_republic.1001.b: "Voy muy atrasad[ROOT.Char.Custom('ES_OA')] en mis deberes. ¡Dejadme en paz!"
 yearly_republic.1001.c: "El mundo puede esperar mientras te tenga."
 yearly_republic.1001.communal: "Todos los [vassals|lE] ganan #P 10#! de opinión sobre #value ti#!"
 yearly_republic.1002.t: "Matrimonio complicado"
 yearly_republic.1002.desc: "Mi matrimonio con [spouse_target.Custom('ES_ElLa')] [spouse_target.GetTitledFirstName|l] ha visto mucha discusión. Parece que no estamos de acuerdo en nada. No me cabe duda de que [spouse_target.GetFirstNameNoTooltip] mantiene informada a su gente sobre mis «carencias» a través de su frecuente correspondencia.\n\nTenía la esperanza de que mi matrimonio uniera mis intereses comerciales a la casa [spouse_target.GetDynastyHouseName], pero cada vez que encuentro a sus agentes o clientes en la ciudad, veo desconfianza en su mirada.\n\nComo no haga algo, el sentimiento tóxico se extenderá por las filas de ambas familias, como la sangre podrida de una herida infectada."
 yearly_republic.1002.a: "Compraré la gratitud de [spouse_target.GetFirstNameNoTooltip] y de su casa."
 yearly_republic.1002.b: "Falsificaré sus cartas para cantar mis alabanzas."
 yearly_republic.1002.c: "A [ROOT.Char.GetFaith.random_GoodGodNames] juro que me haré mejor a vuestros ojos."
 yearly_republic.1002.d: "Que piensen lo que quieran."
 yearly_republic.1002.tt.falsifying_success.desc: "Modifica las cartas de tu cónyuge para quedar mejor"
 yearly_republic.1002.falsifying_success.toast: "La casa [spouse_target.GetDynastyHouseName] se convence de que has mejorado"
 yearly_republic.1002.tt.falsifying_failure.desc: "Fracasas en tu intento de falsificar las cartas de tu cónyuge"
 yearly_republic.1002.falsifying_failure.toast: "La opinión de la casa [spouse_target.GetDynastyHouseName] sobre ti empeora aún más"
 yearly_republic.1002.tt.impress_spouse_success.desc: "Tu cónyuge queda impresionad[spouse_target.Custom('ES_OA')] por tus esfuerzos"
 yearly_republic.1002.impress_spouse_success.toast: "La casa [spouse_target.GetDynastyHouseName] aprueba tus esfuerzos"
 yearly_republic.1002.tt.impress_spouse_failure.desc: "A tu cónyuge no le impresionan tus esfuerzos"
 yearly_republic.1002.impress_spouse_failure.toast: "La casa [spouse_target.GetDynastyHouseName] te considera una causa perdida"
 yearly_republic.1003.t: "Honor en los callejones"
 yearly_republic.1003.desc: "«¡Zoquete! ¡Pelear en la calle puede provocar una enemistad entre casas! Pero miraos, ¡si estáis sangrando!». Mi [spouse_target.GetWifeHusband], [spouse_target.Custom('ES_ElLa')] [spouse_target.GetTitledFirstName|l], grita a la vista de mi [ROOT.Char.Custom2('RelationToMeShort', rook_01)], [rook_01.Custom('ES_ElLa')] [rook_01.GetTitledFirstName|l]; pero tan irresponsable joven se limita a reírse, mientras gotea sangre en mi suelo.\n\n«¡Mi oponente quedó mucho peor! Esa especie de [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))] que es [rook_02.GetFirstName] ahora cojea humillad[rook_02.Custom('ES_OA')] de vuelta a su casa con el rabo entre las piernas».\n\n¡Condenada sea esta juventud! Recorren las calles con armas y arrogancia, se meten en peleas y cometen toda clase de fechorías para divertirse.\n\n«Solo fue una pequeña riña. No os inquietéis, [rook_01.Custom2('RelationToMeShort', spouse_target)]. Solo defendí el nombre de la familia contra una calumnia»."
 yearly_republic.1003.a: "Ah, las locuras de la juventud."
 yearly_republic.1003.b: "Está claro que la culpa fue de [rook_02.GetNameNoTooltip]. ¡Exigimos una compensación!"
 yearly_republic.1003.c: "Enviaremos un obsequio a la casa [rook_02.GetDynastyHouseNameNoTooltip] para tratar de arreglar las cosas."
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly_republic.1004.a.desc: "Vuestras acusaciones contra mi casa son infundadas, vanas y carecen absolutamente de sentido.\n\nNada recibiréis de nosotros, salvo las corteses atenciones de nuestras espadas en vuestros gaznates si es que, lamentablemente, decidís seguir insistiendo en el tema."
 yearly_republic.1004.b.desc: "Como cabeza de la casa [other_house_character_01.GetDynastyHouseName], lamento profundamente este desencuentro entre nuestras familias. He de disculparme por las molestias y rogar que aceptéis este obsequio como expresión de mi pesadumbre."
 yearly_republic.1004.a: "¡Lamentarán esta falta de respeto!"
 yearly_republic.1004.b: "Sea, ya nos resarciremos en su momento."
 yearly_republic.1004.c: "Aceptamos lo que nos toca."
 yearly_republic.1004.d: "Que este sea el fin de la discordia entre nosotros."
 yearly_republic.1005.t: "Veto de las masas"
 yearly_republic.1005.desc: "Las desavenencias entre mi casa y la casa [other_house_character_01.GetDynastyHouseName] se han extendido de nuevo a las calles de [capital_01.GetName] y nuestros carreteros se pelean por el derecho de paso hasta que la misma carretera queda bloqueada. Otra bronca menor, pensaba, hasta que una muchedumbre se agolpa ante mi puerta.\n\n«¡Basta ya!», grita uno. «No podemos llevar a cabo nuestros asuntos mientras [ROOT.Char.GetDynastyHouseName] y [other_house_character_01.GetDynastyHouseNameNoTooltip] riñen. ¡Dejad de arrastrar a la ciudad a vuestras miserias!».\n\nMi [ROOT.Char.Custom2('RelationToMeShort', house_member_01)], [house_member_01.Custom('ES_ElLa')] [house_member_01.GetTitledFirstName|l], se mofa ante su atrevimiento. «¿Quiénes son para dictar nuestra conducta?»."
 yearly_republic.1005.a: "No, [ROOT.Char.Custom2('RelationToMeShort', house_member_01)]. Es hora de sentarnos a hablar con la casa [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.b: "Mi habilidad oratoria pasa la culpa a la casa [other_house_character_01.GetDynastyHouseNameNoTooltip]."
 yearly_republic.1005.c: "¡Guardias! Expulsad a esta gente de mi puerta."
 yearly_republic.1005.tt.oratory_blame.desc: "Confunde a la masa con tu oratoria"
 yearly_republic.1005.tt.oratory_blame.toast: "Cargas la culpa a la casa [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Tu voz queda ahogada entre los abucheos de la multitud"
 yearly_republic.1005.tt.oratory_blame_failure.toast: "No logras cargar la culpa a la casa [other_house_character_01.GetDynastyHouseName]"
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly_republic.1006.a.desc: "Tenéis mucha razón. Ha llegado la hora de sentarse y dejar que prevalezca la razón, por el bien de aquellos aún por nacer y el bien duradero de la república. Nos reuniremos con vos."
 yearly_republic.1006.b.desc: "Por desgracia, no vemos motivo para concederos la oportunidad de que nos mintáis a la cara. Sin duda, solo buscáis una situación mejor para hacernos daño. No habrá negociaciones."
 yearly_republic.1006.a: "¡Excelente!"
 yearly_republic.1006.b: "¡Maldición!"
 yearly_republic.1007.t: "Tregua entre [ROOT.Char.GetDynastyHouseNameNoTooltip] y [other_house_character_01.GetDynastyHouseNameNoTooltip]"
 yearly_republic.1007.desc: "Se puede sentir la tensión en el aire cuando me siento ante [other_house_character_01.Custom('ES_ElLa')] [other_house_character_01.GetTitledFirstName|l] en un establecimiento neutral. Nuestros clientes abarrotan la sala, divididos en dos bandos, como dos ejércitos que se observan en un campo de batalla. Hay dagas ocultas entre las capas, no me cabe duda.\n\n«Sea pues», dice [other_house_character_01.GetFirstNameNoTooltip] con voz cautelosa. «Decid lo que queréis decir».\n\nTodos los ojos de la sala se fijan en mí mientras pongo en orden mis pensamientos y comienzo."
 yearly_republic.1007.a: "Esta enemistad es mala para los negocios."
 yearly_republic.1007.b: "Deberíamos hacer las paces, como [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] que somos."
 yearly_republic.1007.c: "Se ha vertido sangre; que la sangre nos una."
 yearly_republic.1007.d: "Solucionémoslo con acero, ¡aquí y ahora!"
 yearly_republic.1007.tt.detente_business.desc: "Convences a [other_house_character_01.GetShortUINameNoTooltip] de tu argumento"
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip] se convence"
 yearly_republic.1007.tt.detente_business_failure.desc: "Tu argumento no logra convencer a [other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.tt.detente_business_failure.toast: "No convences del todo a [other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.detente_business.change.desc: "Ambas casas aceptan resolver sus diferencias por motivos comerciales"
 yearly_republic.1007.piety.change.desc: "Ambas casas aceptan resolver sus diferencias por amor a [ROOT.Char.GetFaith.HighGodName]."
 yearly_republic.1007.detente_marriage.change.desc: "Ambas casas aceptan resolver sus diferencias con un matrimonio."
 yearly_republic.1007.duel_win.desc: "Ganas el duelo"
 yearly_republic.1007.duel_win.toast: "Apuñalas a [other_house_character_01.GetShortUINameNoTooltip]"
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip] gana el duelo"
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip] te apuñala"
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip] resulta herid[other_house_character_01.Custom('ES_OA')] o muere"
 yearly_republic.1007.duel_loss.custom: "Resultas herid[ROOT.Char.Custom('ES_OA')] o mueres"
 yearly_republic.1007.c.tt.suitable_pair: "Ambas casas tienen miembros solteros a los que pueden casar"
 house_relation_reason_falsify_good_desc: "Recibió cartas que hablaban sobre el buen carácter del jefe de la casa"
 house_relation_reason_falsify_bad_desc: "Descubrió que el jefe de la casa falsificó cartas"
 house_relation_reason_thorny_desc: "Un matrimonio infeliz extiende la discordia"
 house_relation_reason_bribery_good_desc: "Colmó a su cónyuge de oro y joyas"
 house_relation_reason_street_combat_desc: "Peleas callejeras entre las juventudes de ambas casas"
 house_relation_reason_business_argument_desc: "Discutió las ventajas de los negocios"
 house_relation_reason_house_blamed_desc: "Culpado por la agitación social"
 house_relation_reason_houses_aligned_desc: "Hizo causa común en una reunión de casas con ideas similares"
 house_relation_reason_cooperation_desc: "Profundizada la cooperación entre las casas."
 demand_reparation_for_fight_desc: "Envió una carta que exigía compensación"
 pay_reparation_for_fight_desc: "Envió una carta con un regalo y una disculpa"
 offer_a_sitdown_desc: "Envió una carta con una oferta de tregua"
 yearly_republic.1008.t: "Lobos con piel de mercaderes"
 yearly_republic.1008.desc: "Una información interesante ha llegado a mis oídos:\nUn[bandit_01.Custom('ES_OA')] de [Select_CString(bandit_01.IsFemale, 'las capitanas', 'los capitanes' )] mercaderes al servicio [other_patrician_01.Custom('ES_DelDela')] [other_patrician_01.GetTitledFirstName|l] ha hecho algunas incursiones en el oficio de la piratería mientras llevaba a cabo contratos comerciales por el Mediterráneo y, posteriormente, ha vendido cargamentos capturados para su beneficio personal. ¡Un[bandit_01.Custom('ES_XA')] verdader[bandit_01.Custom('ES_OA')] lob[bandit_01.Custom('ES_OA')] con piel de cordero!\n\nSi bien es imposible saber si [other_patrician_01.GetFirstNameNoTooltip] está involucrad[other_patrician_01.Custom('ES_OA')] en esto, eso importará poco a los miembros de la asamblea cuyos barcos y cargamentos han sido saqueados."
 yearly_republic.1008.a: "Contrata al capitán para que trabaje para ti de inmediato."
 yearly_republic.1008.b: "Amenaza [Select_CString(bandit_01.IsFemale, 'a la capitana', 'al capitán' )] para que comparta el botín"
 yearly_republic.1008.c: "Amenaza a [other_patrician_01.GetFirstNameNoTooltip] para conseguir una baza."
 yearly_republic.1009.t: "Salón de secretos"
 yearly_republic.1009.desc: "Paso la tarde sentad[ROOT.Char.Custom('ES_OA')] en un salón acogedor que pertenece [patrician_spouse_01.Custom('ES_AlAla')] [patrician_spouse_01.GetTitledFirstName|l].\n\nMientras hablaba con mi [ROOT.Char.Custom2('RelationToMeShort', relation_01)], [relation_01.Custom('ES_ElLa')] [relation_01.GetTitledFirstName|l], y disfrutaba de su [patrician_spouse_01.Custom('GetExpensiveDrink')], percibo una pequeña sombra que se mueve en una pared cercana a una gran mampara. Tras cierta observación, deduzco que es de un brazo que realiza movimientos sucintos y precisos; [relation_01.GetFirstNameNoTooltip] deja de hablar y el movimiento se detiene también; ¡detrás de esa mampara alguien transcribe todas las palabras que se pronuncian en el salón!\n\nSe ve que nuestr[patrician_spouse_01.Custom('ES_OA')] [patrician_spouse_01.Custom('HostessHost')], [patrician_spouse_01.GetFirstNameNoTooltip], y su [patrician_husband_01.GetWifeHusband], [patrician_husband_01.Custom('ES_ElLa')] [patrician_husband_01.GetTitledFirstName|l], espían las conversaciones de sus invitados."
 yearly_republic.1009.a: "¡Debo avisar a todo el mundo de este malvado plan!"
 yearly_republic.1009.a.tt: "Ganancia de #P 20#! de opinión sobre #value ti#! y #N -25#! de opinión de [patrician_spouse_01.GetShortUINameNoTooltip] y [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.b: "¡Una idea genial! Debería intentarlo yo también."
 yearly_republic.1009.c: "Chantajear a [patrician_spouse_01.GetFirstNameNoTooltip] y a su [patrician_husband_01.GetWifeHusband] a cambio de guardar el secreto."
 yearly_republic.1009.c.success.desc: "Superas en ingenio a [patrician_spouse_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.success.toast: "Ganas un anzuelo fuerte sobre [patrician_husband_01.GetShortUINameNoTooltip]"
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip] te supera en ingenio"
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip] se acerca a convertirse en tu rival"
 yearly_republic.1009.flavor: "¿Quién sabe qué se puede descubrir?"
 yearly_republic.1009.b.secret_learned: "Tus trabajos de espionaje descubrieron un secreto"
 yearly_republic.1010.t: "El patricio en el tejado"
 yearly_republic.1010.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', relation_01)], [relation_01.Custom('ES_ElLa')] [relation_01.GetTitledFirstName|l], me encuentra dando un paseo y se acerca para susurrarme:\n\n«[ambassador_01.Custom('ES_ElLa')|U] embajador[ambassador_01.Custom('ES_XA')] [ambassador_01.GetFirstName] ha regresado de [ambassador_mission_location_01.GetName] y esta noche informará a un consejo cerrado en palacio».\n\nSacude la cabeza. «¡Imaginad qué ventaja comercial sería conocer ese informe antes de que se presente a la asamblea!».\n\nMientras [relation_01.GetFirstNameNoTooltip] dice esto, el tejado del palacio se vislumbra a lo lejos."
 yearly_republic.1010.a: "Levantaremos algunas tejas del tejado del palacio y escucharemos."
 yearly_republic.1010.b: "¿Tal vez podríamos persuadir a [ambassador_01.GetFirstNameNoTooltip]?"
 yearly_republic.1010.c: "Lo sabremos a su debido momento."
 yearly_republic.1010.a.success.desc: "Oís el informe"
 yearly_republic.1010.a.success.toast: "Oís el informe"
 yearly_republic.1010.a.mixed.desc: "Os caéis del tejado"
 yearly_republic.1010.a.mixed.toast: "Os caéis del tejado"
 yearly_republic.1010.a.failure.desc: "Caéis en la cámara"
 yearly_republic.1010.a.failure.toast: "Caéis en la cámara"
 yearly_republic.1010.a.mixed.custom: "[relation_01.GetShortUIName] y tú ganáis el [trait|El] [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUIName|U] pierde #N 25#! de [opinion|El] sobre [relation_01.GetShortUIName] y sobre ti #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW Delito — Da derecho legal a [republic_ruler.GetShortUIName] a encarcelaros#!"
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip] es receptiv[ambassador_01.Custom('ES_OA')] a un soborno"
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip] se siente ofendid[ambassador_01.Custom('ES_OA')] por tu petición"
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip] te da el informe"
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip] rechaza el soborno"
 yearly_republic.1011.t: "Convocatoria al consejo"
 yearly_republic.1011.desc: "De nuevo se me convoca a participar en otro de los muchos consejos secretos que hacen funcionar la república.\n\nTales obligaciones me quitan tiempo con mi familia y mis negocios, mas, como patrici[ROOT.Char.Custom('ES_OA')], no puedo rechazar una convocatoria sin un motivo válido o el permiso de la asamblea."
 yearly_republic.1011.a: "Haré que mi médico dé fe de que estoy postrad[ROOT.Char.Custom('ES_OA')] en el lecho."
 yearly_republic.1011.b: "Como mi querid[sick_person_01.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)] está enferm[sick_person_01.Custom('ES_OA')], tengo un buen motivo para quedarme en casa."
 yearly_republic.1011.c: "Le pediré a la asamblea un permiso excepcional de 5 años."
 yearly_republic.1011.d: "Acudir es mi deber."
 yearly_republic.1011.c.success.desc: "La asamblea te concede el permiso"
 yearly_republic.1011.c.success.toast: "La asamblea te concedió el permiso"
 yearly_republic.1011.c.failure.desc: "La asamblea te deniega el permiso"
 yearly_republic.1011.c.failure.toast: "La asamblea te denegó el permiso"
 yearly_republic.1012.t: "Procesión [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 yearly_republic.1012.desc: "Las expectativas de la multitud son palpables cuando la procesión [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitleAsName|l] sale por la puerta del palacio y comienza su marcha por la ciudad.\n\nPrimero vienen los funcionarios públicos en orden de importancia y prestigio, después yo, [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetTitleAsNameNoTooltip|l], con las más elegantes galas del Estado; los símbolos de mi autoridad bien altos para que el pueblo se maraville. \nDetrás de mí, marchan los patricios, ordenados según la eminencia de su casa.\n\nTodos están en su sitio, ¡la jerarquía y gloria de nuestra república puestas de manifiesto para que todos las vean en esta ceremonia venerable!"
 yearly_republic.1012.a: "¡Por la república! ¡Por el pueblo!"
 yearly_republic.1012.b: "¡Gloria a la asamblea!"
 yearly_republic.1012.c: "¡Todo es un reflejo de MI gloria!"
 yearly_republic.1012.c.tt: "Durante los próximos #V 10#! años, aprobar la [succession_law|El] $republican_despot_succession_law$ cuesta un #P 50 %#! menos de [prestige|El]"
 yearly_republic.1013.t: "Esponsales con el mar"
 yearly_republic.1013.desc: "El [Glossary( '#bold Bucintoro#!', 'BUCENTAUR_GLOSS' )] ha sobrepasado el último de los islotes de barrera, y la extensión salina del mar Adriático se extiende ante mí. [bishop_01.Custom('ES_ElLa')|U] [bishop_01.GetTitledFirstName|l] me entrega el anillo ceremonial y retrocede.\nLo sostengo en alto para que lo vean los dignatarios reunidos y, según los antiguos ritos, lo lanzo a las olas verdes.\n\n«[Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )]», declaro, y cuando la multitud a bordo ruge dando su aprobación a mis palabras, los esponsales de nuestra república con el mar, la fuente de nuestra riqueza y poder, se han completado."
 yearly_republic.1013.a: "¡Gobernamos el mar!"
 yearly_republic.1013.b: "Un ritual necio y frívolo."
 yearly_republic.1013.c: "¡Ya voy, amor mío!"
 yearly_republic.1013.d: "¡Al mar seré fiel!"
 yearly_republic.1014.t: "Alinear las casas"
 yearly_republic.1014.desc: "A invitación [faction_head_01.Custom('ES_DelDela')] [faction_head_01.GetTitledFirstName|l], se han reunido los jefes de las casas con aspiración de [faction_head_01.GetHouse.GetHouseAspiration.GetName|l].\n\n«¡Amigos míos! En momentos como estos tenemos que unirnos y alinear nuestros intereses. No sea que otros alineamientos de nuestra amada república encuentren una oportunidad para dividirnos y aplastarnos».\n\nDebatimos hasta bien entrada la noche y, si bien nuestras divisiones son muchas, tenemos la oportunidad de crear una voz fuerte que repare las brechas y cree un frente unido."
 yearly_republic.1014.a: "«Debemos unirnos todos a los güelfos»."
 yearly_republic.1014.b: "«Debemos unirnos todos a los gibelinos»."
 yearly_republic.1014.c: "«Reforcemos los vínculos entre nuestras casas»."
 yearly_republic.1014.d: "«Todas las rivalidades entre nosotros tienen que acabar»."
 yearly_republic.1014.e: "«Debemos alinear nuestros intereses comerciales»."
 yearly_republic.1014.e.tt: "Todos los [patricians|El] con la [house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] ganan [GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip] durante 2 años"
 yearly_republic.1014.a.tt: "Todos los [patricians|El] con la [house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] se convierten en miembros del [situation_participant_group|El] [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName|l]"
 yearly_republic.1014.b.tt: "Todos los [patricians|El] con la [house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] se convierten en miembros del [situation_participant_group|El] [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName|l]"
 yearly_republic.1014.c.tt: "Todos los [patricians|El] con la [house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName] mejoran sus [house_relations|El] entre ellos"
 yearly_republic.1014.d.tt: "Se pone fin a las rivalidades y enemistades entre los [patricians|El] con la [house_ambition|El] [faction_head_01.GetHouse.GetHouseAspiration.GetName]"
 yearly_republic.1014.tt.align_guelphs_success.desc: "Se gana la reunión y las casas se comprometen con los güelfos"
