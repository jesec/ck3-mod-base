l_spanish:
 faith_creation.1001.t.schism: "El cisma [reformed_faith.GetAdherentNameNoTooltip]"
 faith_creation.1001.t.reformation: "La reforma [reformed_faith.GetAdjectiveNoTooltip]"
 faith_creation.1001.desc.schism: "Se ha abierto un nuevo cisma en el [reformed_faith.GetReligion.GetName|l]. [reformer.Custom('ES_ElLa')|U] [reformer.GetTitledFirstName|l] y sus seguidores se han separado del [old_faith.GetName|l], su fe matriz, y el rito [old_rite.GetAdherentName] que observaban se ha convertido en la semilla de una fe propia."
 faith_creation.1001.desc.reformation: "[reformer.Custom('ES_ElLa')|U] [reformer.GetTitledFirstName|l], una figura destacada entre los [reformed_faith.GetAdherentNamePlural], ha reunido a todos los [reformer.Custom('DefaultPriestTitle')] del país para compilar sus prácticas desperdigadas en un solo rito y, a partir de este, instituir la doctrina oficial de la fe."
 faith_creation.1001.desc.schism.personal: "Los [old_faith.AltPriestTermPlural] de la fe [old_faith.GetAdjective] se han descarriado y ya no podemos confiar en ellos para que nos guíen. He reunido a unos [reformer.Custom('DefaultPriestTitlePlural')] que opinan como yo y hemos decidido que el [old_rite.GetName|l] ya no pertenece a nuestra fe matriz."
 faith_creation.1001.desc.reformation.personal: "Al fin he conseguido reunir a todo [reformer.Custom('DefaultPriestTitle')] importante del mundo para unir nuestras prácticas desperdigadas en un solo rito y, a partir de este, instituir la doctrina oficial que guie nuestra fe de aquí en adelante."
 faith_creation.1001.desc.schism.personal.hof: "No seguiré de rodillas mientras [old_hof.Custom('ES_ElLa')] [old_hof.GetTitledFirstName|l] y los [old_faith.AltPriestTermPlural] [old_faith.GetAdherentNamePlural] descarrían a los fieles. He reunido a [reformer.Custom('DefaultPriestTitlePlural')] que comparten mi convicción y, a partir del rito [old_rite.GetAdherentName] que conservamos, hemos forjado una fe que no le debe nada al [old_faith.GetName|l]."
 faith_creation.1001.desc.schism.hof: "[reformer.Custom('ES_ElLa')|U] [reformer.GetTitledFirstName|l] ha rechazado la autoridad [old_hof.Custom('ES_DelDela')] [old_hof.GetTitledFirstName|l] y sacado a sus seguidores del [old_faith.GetName|l]. El rito [old_rite.GetAdherentName] que observan allí ahora es la raíz de una fe que no responde ante nadie más."
 #Pick one line from this set (Outlook):
 faith_creation.1001.desc.outlook.ghw: "\n\nLos [reformer.Custom('DefaultPriestTitlePlural')] fervientes ya hablan de lanzar [reformed_faith.GHWNamePlural|l] para extender su nueva fe por todo el mundo y"
 faith_creation.1001.desc.outlook.pacifism: "\n\nEstos [reformer.Custom('DefaultPriestTitlePlural')] de la fe [reformed_faith.GetAdjectiveNoTooltip] han condenado la violencia y el derramamiento de sangre, pues solo llevan al sufrimiento y al odio, y"
 faith_creation.1001.desc.outlook.dogmatic: "\n\nEstos [reformer.Custom('DefaultPriestTitlePlural')] han proclamado que la fe [reformed_faith.GetAdjectiveNoTooltip] es la única verdadera, y"
 faith_creation.1001.desc.outlook.accepting: "\n\nEstos [reformer.Custom('DefaultPriestTitlePlural')] de la fe [reformed_faith.GetAdjectiveNoTooltip] han promovido la colaboración y tolerancia incluso con los no creyentes, y"
 faith_creation.1001.desc.outlook.fallback: "\n\nEstos [reformer.Custom('DefaultPriestTitlePlural')] de la fe [reformed_faith.GetAdjectiveNoTooltip] han adoptado una visión pragmática y equilibrada de otras fes y"
 #And one line from this second set (Beliefs):
 faith_creation.1001.desc.belief.sacrifice: "¡afirman que la única forma de mostrar la devoción es honrando a [reformed_faith.HighGodName] con sacrificios humanos!"
 faith_creation.1001.desc.belief.indulgent: "animan a los fieles a entregarse a los placeres de la carne y aprovechar sus vidas al máximo."
 faith_creation.1001.desc.belief.incest: "aprueban los matrimonios entre familiares cercanos, pues consideran sagrados estos vínculos familiares y tales matrimonios son bendecidos."
 faith_creation.1001.desc.belief.aniconism: "rechazan el uso de todo simbolismo religioso, pues afirman que las efigies no pueden captar la grandeza de [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.ascetic: "promueven el ascetismo entre sus seguidores, pues afirman que el deseo materialista impide la realización espiritual."
 faith_creation.1001.desc.belief.spirits: "solicitan la ayuda de los espíritus para ayudar a guiar a los fieles en estos tiempos convulsos."
 faith_creation.1001.desc.belief.superstition: "muchas supersticiones antiguas e historias míticas han sido canonizadas en la doctrina oficial."
 faith_creation.1001.desc.belief.nature: "tienen un gran respeto por la naturaleza misma, pues buscan preservarla y protegerla de aquellos que la explotan en beneficio propio."
 faith_creation.1001.desc.belief.community: "la nueva fe se ha mezclado con las tradiciones culturales de sus fieles para formar comunidades de [reformed_faith.GetAdherentNamePluralNoTooltip] muy unidos y reacios a admitir forasteros."
 faith_creation.1001.desc.belief.pain: "enseñan que hay que humillar la carne mediante privaciones y dolor, pues el sufrimiento purifica el alma y lleva a los fieles más cerca de [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.iconoclasm: "reclaman que se derriben los ídolos y altares de los falsos dioses y se quemen allí donde se encuentren."
 faith_creation.1001.desc.belief.militant: "sostienen que los fieles son ante todo soldados, llamados a portar la fe en el filo de la espada."
 faith_creation.1001.desc.belief.veneration: "veneran a los santos difuntos como intercesores, honran sus reliquias y pronuncian sus nombres en oraciones."
 faith_creation.1001.desc.belief.sacraments: "sostienen que la gracia solo fluye a través de los ritos sagrados, administrados por manos ordenadas y nadie más."
 faith_creation.1001.desc.belief.penance: "enseñan que toda alma nace manchada y solo se puede limpiar a través de la confesión y la penitencia."
 faith_creation.1001.desc.belief.christology: "han zanjado una gran cuestión de la doctrina, estableciendo la propia naturaleza de la divinidad en términos que todos los fieles han de profesar."
 faith_creation.1001.desc.belief.rebirth: "sostienen que el alma está unida a un gran ciclo de renacimiento, que cada vida está modelada por las obras de la anterior."
 faith_creation.1001.desc.belief.learning: "valoran el conocimiento por encima de casi todo; sostienen que estudiar el mundo es conocer mejor la mente de [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.law: "ponen la ley sagrada por encima de todo e insisten en que toda palabra de la doctrina debe obedecerse al pie de la letra."
 faith_creation.1001.desc.belief.missionary: "han jurado llevar la Palabra a todos los rincones de la tierra, para que no quede ningún alma en la oscuridad."
 faith_creation.1001.desc.belief.hierarchy: "enseñan que todo está en el lugar que le corresponde y que la armonía solo fluye cuando todas las almas honran el orden establecido sobre ellas."
 faith_creation.1001.desc.belief.charity: "llaman a los fieles a responder a las privaciones con caridad y a cuidar de pobres, enfermos y forasteros por igual."
 faith_creation.1001.desc.belief.family: "sostienen que los vínculos de parentesco son sagrados, por lo que enseñan que venerar a los antepasados y tener muchos hijos son en sí actos de culto."
 faith_creation.1001.desc.belief.sacred_sites: "levantan grandes monumentos de piedra como testimonio de su devoción, terrenos sagrados que perdurarán durante generaciones."
 faith_creation.1001.desc.belief.worldly: "asumen una visión terrenal y pragmática de la devoción al sostener que las monedas, el compromiso y un silencio bien usado pueden servir a la fe tan bien como la oración."
 faith_creation.1001.desc.belief.syncretic: "integran las creencias de sus vecinos en las suyas y sostienen que muchos caminos pueden llevar a la misma verdad."
 faith_creation.1001.desc.belief.fallback: "piden a todos los fieles que dejen a un lado las viejas disputas y se unan por el bien de la nueva fe."
 #End with a reference to
 faith_creation.1001.desc.temporal: "\n\n[reformer.GetFirstNameNoTooltip] ha elegido dirigir personalmente la floreciente fe [reformed_faith.GetAdjectiveNoTooltip] y asumir el título de [reformed_faith.ReligiousHeadName], un puesto eminente que, al parecer, dejará a su heredero."
 faith_creation.1001.desc.temporal.personal: "\n\nHe elegido dirigir personalmente la floreciente fe [reformed_faith.GetAdjectiveNoTooltip] y asumir el título de [reformed_faith.ReligiousHeadName|l], un puesto eminente que dejaré a mis sucesores."
 faith_creation.1001.desc.spiritual: "\n\nLos [reformer.Custom('DefaultPriestTitlePlural')] de la fe [reformed_faith.GetAdjectiveNoTooltip] han elegido a [reformed_hof.GetFirstNameNoTooltip] como su nuev[reformed_hof.Custom('ES_OA')] [reformed_faith.ReligiousHeadName|l], quien moldeará el rito principal frente al cual se medirá cualquier rito [reformed_faith.GetAdherentNameNoTooltip] y arbitrará en las discusiones de la fe."
 faith_creation.1001.desc.spiritual.sameold: "\n\nLos [reformer.Custom('DefaultPriestTitlePlural')] de la fe [reformed_faith.GetAdjectiveNoTooltip] han elegido mantener a [reformed_hof.GetFirstNameNoTooltip] como [reformed_faith.ReligiousHeadName|l]. Seguirá moldeando el rito principal frente al cual se medirá cualquier rito [reformed_faith.GetAdherentNameNoTooltip] y arbitrará en las discusiones de la fe."
 faith_creation.1001.desc.no_head: "\n\nEl movimiento floreciente ha decidido no instaurar una cabeza religiosa y, en lugar de eso, prefiere que cada rito conserve sus propias enseñanzas y que cada [reformer.Custom('DefaultPriestTitle')] responda por su [reformed_faith.HouseOfWorship]."
 faith_creation.1001.desc.no_holy_sites: "\n\nLos [reformed_faith.GetAdherentNamePluralNoTooltip] esperan ansiosos la llegada profetizada de su [reformed_faith.ReligiousHeadName|l], un gran líder que reunirá a todos los fieles en torno a su persona y llevará a la fe [reformed_faith.GetAdjectiveNoTooltip] a una nueva edad de oro."
 faith_creation.1001.o.frightened: "¡[ROOT.Char.GetFaith.random_GoodGodNames] nos salve de estos sanguinarios [second.Custom('GetUnbelieverNamePlural')]!"
 faith_creation.1001.o.heretical: "¡Estos herejes pagarán por sus crímenes contra [ROOT.Char.GetFaith.HighGodName]!"
 faith_creation.1001.o.crusader: "¡Una [ROOT.Char.GetFaith.GHWName|l] o dos pondrán en su sitio a esos [second.Custom('GetUnbelieverNamePlural')]!"
 faith_creation.1001.o.interested: "No debemos perder de vista este nuevo acontecimiento…"
 faith_creation.1001.o.uninterested: "No importa en qué crean estos [second.Custom('GetUnbelieverNamePlural')]."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Se ganan #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! acciones gratuitas para crear, degradar, elevar o abandonar [holy_sites|El]"
 faith_creation.1001.o.personal: "¡El mundo verá que [ROOT.Char.GetFaith.HighGodName] nos favorece!"
 faith_creation.1002.t: "Un rito desgarrado"
 faith_creation.1002.t.new_faith: "Nuestra propia fe"
 faith_creation.1002.desc.intro.founder: "Mi antiguo rito [old_faith.GetAdherentName] se ha descarriado, oración a oración, dogma a dogma, hasta que ya no es [old_faith.GetName|l]."
 faith_creation.1002.desc.intro.member: "Nuestro rito [old_faith.GetAdherentName] se ha descarriado, oración a oración, dogma a dogma, hasta que ya no es [old_faith.GetName|l]."
 faith_creation.1002.desc.intro.observer: "El rito [old_faith.GetAdherentName] [founder.Custom('ES_DelDela')] [founder.GetTitledFirstName|l] se ha descarriado, oración a oración, dogma a dogma, hasta que ya no es [old_faith.GetName|l]."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.Custom('ES_ElLa')|U] [old_hof.GetTitledFirstName|l] dicta sentencia: el rebaño extraviado queda expulsado y se corta completamente con ellos."
 faith_creation.1002.desc.anathema.no_hof: "\n\nLos [old_faith.AltPriestTermPlural] del [old_faith.GetName|l] dictan sentencia desde cada altar: el rebaño extraviado queda expulsado y se corta completamente con ellos."
 faith_creation.1002.desc.new_head.personal: "La carga de lo que prosigue es mía: ahora me alzo como [new_faith.ReligiousHeadName|l] del [new_faith.GetName|l]."
 faith_creation.1002.desc.new_head.founder: "Quien los llevó hasta allí sigue al frente: [founder.GetFirstNameNoTooltip], [new_faith.ReligiousHeadName|l] del [new_faith.GetName|l]."
 faith_creation.1002.desc.new_head.other: "[new_hof.Custom('ES_ElLa')|U] [new_hof.GetTitledFirstName|l] ahora se alza como [new_faith.ReligiousHeadName|l] del [new_faith.GetName|l]."
 faith_creation.1002.desc.new_head.none: "No hay un único pastor que guíe el rebaño: sus [new_faith.AltPriestTermPlural] solo responden ante ellos."
 faith_creation.1002.desc.outro.new_faith: "\n\nNuestra propia fe, nuestra propia ley, pero el fuego que se ha prendido es nuevo y el [old_faith.GetName|l] puede enfrentarse a nosotros con espada y censura."
 faith_creation.1002.desc.outro.old_faith: "\n\nTodo condado y alma que era fiel al [old_rite.GetName|l] abandona el [old_faith.GetName|l] de golpe. Ya no son de los nuestros y puede que pronto nos topemos con ellos en guerra abierta."
 faith_creation.1002.a: "Nuestra propia fe, al fin."
 faith_creation.1002.a.founder: "El camino siempre fue nuestro, y ahora el nombre también."
 faith_creation.1002.b: "Herejes, ahora y para siempre."
 faith_creation.1002.b.hof: "Que aprendan cuánto frío hace fuera del redil."
 faith_creation.1002.consequences.tt: "El [new_faith.GetName|l] ahora es una [faith|El] completamente aparte:\n$EFFECT_LIST_BULLET$Todos los [followers|El] y los [counties|El] del [rite|El] anterior ahora pertenecen a la nueva fe\n$EFFECT_LIST_BULLET$Existe una [faith_hostility|El] entre el [new_faith.GetName|l] y el [old_faith.GetName|l], lo que permite [holy_wars|El]\n$EFFECT_LIST_BULLET$Las dos fes dejan de compartir [head_of_faith|El]"
 faith_creation.1002.a.free_holy_site_actions: "El [new_faith.GetName|l] gana #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! acciones gratuitas para crear, degradar, elevar o abandonar [holy_sites|El]"
 faith_creation.1002.a.lost_ecumenism: "El [new_faith.GetName|l] pierde [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip] proclamad[HoF.Custom('ES_OA')] [faith.ReligiousHeadName|U]"
 faith_creation.1010.desc.start: "Aunque la rectitud de nuestra fe nunca estuvo en duda, ha sido complicado soportar este tiempo sin un líder espiritual. Esta penalidad ha llegado a su fin ahora que"
 faith_creation.1010.desc.temporal.personal: "he convencido a los [faith.AltPriestTermPlural] de que me acepten como el único [faith.ReligiousHeadName|U]."
 faith_creation.1010.desc.temporal: "[HoF.GetTitledFirstName] ha conseguido convencer a los [faith.AltPriestTermPlural] de que [HoF.Custom('ES_LoLa')] acepten como el únic[HoF.Custom('ES_OA')] y verdader[HoF.Custom('ES_OA')] [faith.ReligiousHeadName|U]."
 faith_creation.1010.desc.spiritual: "los [faith.AltPriestTermPlural] se reunieron para elegir a [HoF.GetFirstName] como únic[HoF.Custom('ES_OA')] y verdader[HoF.Custom('ES_OA')] [faith.ReligiousHeadName|l], [Select_CString(HoF.IsFemale, 'guardiana', 'guardián' )] del rito principal."
 faith_creation.1010.desc.end: "\n\nLos fieles se han unido en torno a un solo líder y parece que está al llegar una nueva edad de oro para el [faith.GetNameNoTooltip]."
 faith_creation.1010.desc.end.personal: "\n\n¡Los fieles se han unido finalmente en torno a mí y guiaré al [faith.GetNameNoTooltip] hacia una nueva edad de oro!"
 faith_creation.1010.a: "¡Gloria a [faith.HighGodName]!"
 faith_creation.1011.message.title: "Establecida cabeza de la fe"
 faith_creation.1011.message.desc: "Los [faith.AltPriestTermPlural] de la fe [faith.GetAdjective] han nombrado [HoF.Custom('ES_AlAla')] [faith.ReligiousHeadName] [HoF.GetFirstName] su nuev[HoF.Custom('ES_OA')] [head_of_faith|lE]"
 faith_creation.1021.t: "Un rito en la ortodoxia"
 faith_creation.1021.t.founder: "Nuestro propio rito"
 faith_creation.1021.desc.intro.founder: "Se ha proclamado el [new_rite.GetName|l] y quienes lo siguen se fijan en mí. Continuamos siendo [old_faith.GetAdherentNamePlural], pero ya no seguimos la ortodoxia [source_rite.GetAdjective]."
 faith_creation.1021.desc.intro.observer: "[founder.Custom('ES_ElLa')|U] [founder.GetTitledFirstName|l] ha fundado un rito nuevo en el [old_faith.GetName|l]. Sus seguidores lo llaman [new_rite.GetName|l] y mantienen la fe [old_faith.GetAdjective] con prácticas propias."
 faith_creation.1021.desc.divergence.minor: "\n\nSolo diverge de la ortodoxia [source_rite.GetAdjective] en detalles. "
 faith_creation.1021.desc.divergence.moderate: "\n\nSus prácticas no encajarían bien con la mayoría de los que mantienen la ortodoxia [source_rite.GetAdjective]. "
 faith_creation.1021.desc.divergence.major: "\n\nSus prácticas se alejan lo bastante de la tradición [source_rite.GetAdjectiveNoTooltip] como para levantar sospechas. "
 faith_creation.1021.desc.differing.tenet: "La diferencia más notable es esta: [differing_tenet.GetBaseName|l]."
 faith_creation.1021.desc.differing.doctrine: "La diferencia más notable es esta: [differing_doctrine.GetDescriptiveName|l]."
 faith_creation.1021.desc.differing.fallback: "La división no está señalada por una sola práctica."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nHemos dejado el rito principal detrás, la medida por la cual el [old_faith.GetNameNoTooltip|l] juzga a los demás. Que lo llamen atrevimiento."
 faith_creation.1021.desc.outro.founder.branch: "\n\nYa éramos una rama; ahora somos un árbol propio y respondemos por él."
 faith_creation.1021.desc.outro.observer: "\n\nNuevos ritos aparecen a menudo. Queda por ver si este arraigará, se marchitará o caerá en la herejía."
 faith_creation.1021.a.founder: "Difundámoslo en silencio, entre los devotos."
 faith_creation.1021.b.founder: "Que se entere el señorío entero."
 faith_creation.1021.a: "Una fe viva tiene sitio para muchos ritos."
 faith_creation.1021.b: "Toda herejía comienza como una innovación."
