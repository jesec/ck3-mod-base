l_spanish:
 rite_growth.0010.t: "Un nuevo rito para el alma [origin_faith.GetReligion.GetAdjectiveNoTooltip]"
 rite_growth.0010.desc.intro.relation: "En el centro de un nuevo rito recién fundado se encuentra tu [GetPlayer.Custom2('RelationToMeShort', founder.Self)] [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_archbishop: "En el centro de un nuevo rito recién fundado se encuentra [founder.Custom('ES_ElLa')] arzobisp[founder.Custom('ES_OA')] [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_ruler: "En el centro de un nuevo rito recién fundado se encuentra [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l], "
 rite_growth.0010.desc.opener.archbishopric: "quien preside sobre su [founder_clerical_title.GetNameNoTier].\n\n"
 rite_growth.0010.desc.opener.lands: "quien gobierna las tierras de [founder.GetPrimaryTitle.GetBaseNameNoTier].\n\n"
 rite_growth.0010.desc.divergence.minor: "Sus seguidores lo conocen como «[new_rite.GetName|l]», un rito que apenas difiere de la ortodoxia [source_rite.GetAdjective], "
 rite_growth.0010.desc.divergence.moderate: "Sus seguidores lo conocen como «[new_rite.GetName|l]», y los modos de este rito resultan extraños para la mayoría de los seguidores de la ortodoxia [source_rite.GetAdjective], "
 rite_growth.0010.desc.divergence.major: "Sus seguidores lo conocen como «[new_rite.GetName|l]», las prácticas de este rito rozan la herejía para la mayoría de practicantes de la ortodoxia [source_rite.GetAdjective], "
 rite_growth.0010.desc.differing.tenet: "y la discrepancia más llamativa es [differing_tenet.GetBaseName|l]."
 rite_growth.0010.desc.differing.doctrine: "y la discrepancia más llamativa es [differing_doctrine.GetDescriptiveName|l]."
 rite_growth.0010.desc.differing.fallback: "pero la diferencia doctrinal es demasiado sutil para ponerle nombre con facilidad."
 rite_growth.0010.desc.outro.wildfire: "\n\nEstas nuevas enseñanzas se propagan rápidamente entre la grey [origin_faith.GetAdjective]."
 rite_growth.0010.a: "Mi alma está a salvo con el [ROOT.Char.GetRite.GetNameNoTooltip|l]."
 rite_growth.0010.b: "¡Debería practicar el [new_rite.GetNameNoTooltip|l]!"
 rite_growth.0010.c: "A mí me huele a herejía…"
 counties_and_court_converts: "Los [counties|El] y [courtiers|El] del [source_rite.GetName|l] se convertirán al [new_rite.GetName|l]"
 rite_growth.0011.notification.title: "[convert_ruler.GetShortUINameNoTooltip] adopta el rito"
 rite_growth.0011.notification.desc: "[convert_ruler.Custom('ES_ElLa')|U] [convert_ruler.GetTitledFirstName|l] se ha unido [founder.Custom('ES_AlAla')] [founder.GetTitledFirstName|l] en la práctica del [new_rite.GetName|l]"
 iberian_struggle_blocks_holy_war_tt: "Declarar una [holy_war|El] no debe estar bloqueado por la [iberian_struggle|El]"
