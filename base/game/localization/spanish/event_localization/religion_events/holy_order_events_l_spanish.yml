l_spanish:
 holy_order_hired_message: "Orden militar contratada"
 holy_order.hired_message: "La orden de [holy_order.GetName] ha sido llamada por [actor.GetUIName]"
 holy_order_hired_by_enemy_message: "Orden militar enemiga"
 holy_order.hired_by_enemy: "La orden de [holy_order.GetName] ha sido llamada por [actor.GetUIName] y ahora se enfrenta a nosotros"
 holy_order.destroyed_message: "[title.GetName] ha sido destruido."
 holy_order_expanded: "La orden militar se expande"
 holy_order.new_lease: "[holy_order.GetName] ahora arrienda [barony.GetName] [former_holder.Custom('ES_AlAla')] [former_holder.GetTitledFirstName|l]"
 monastic_holy_order_expanded: "La orden monástica se expande"
 holy_order.0001.t: "La orden militar"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] aguarda mi despedida, con sus pertenencias y su séquito listos para partir.\n\n"
 holy_order.0001.desc_demand: "«Supongo que hay honor en esto…», murmura. «Morir intentando reclamar una tierra extraña y pagana. Pensé que moriría luchando por [actor.GetPrimaryTitle.GetNameNoTier]…».\n\nAl montar en su caballo, pregunta: «¿Hacia dónde debo ir?»."
 holy_order.0001.desc: "«Entonces, [ROOT.Char.Custom('FormOfAddressForLiege')], ¿a qué orden debo servir con mi corazón devoto y mi espada presta?»."
 holy_order.0001.desc_relation: "«¡Mi espada ya está deseando probar la miserable piel de los paganos, [recipient.Custom2('RelationToMeShort', ROOT.Char)]! Pero ¿hacia dónde he de cabalgar? ¿Quiénes serán mis [recipient.Custom('SisterBrother')]s ahora?»."
 holy_order.0001.a: "Os uniréis a la orden de [holy_order_1.GetName]."
 holy_order.0001.b: "Vuestro lugar es la orden de [holy_order_2.GetName]."
 holy_order.0001.c: "La orden de [holy_order_3.GetName] os espera."
 holy_order.0001.d: "Ahora ya eres un problema de la orden [holy_order_4.GetName]."
 holy_order.0001.e: "He cometido un error… ¡Este es tu sitio!"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'aceptaste', 'aceptó')] la llamada de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)] a una orden militar"
 holy_order.0002.desc_angry: "He pronunciado las palabras sagradas y, así como vuestra voluntad me ha atado, ahora yo también poseo un vínculo con [ROOT.Char.GetFaith.HighGodName]."
 holy_order.0002.desc: "Responderé a la llamada para servir a un poder superior. Os doy las gracias por acercarme a este camino de rectitud."
 holy_order.0002.a_demand: "Bien. Ahora, ahora aguardad vuestra entrada en [ROOT.Char.GetFaith.PositiveAfterLife] en silencio."
 holy_order.0002.a: "¡Seguro que servirás a [ROOT.Char.GetFaith.HighGodName] con diligencia!"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'tomaste', 'tomó')] los votos a petición de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)]"
 char_interaction.0001.opening_low_piety: "Que un ser tan [ROOT.GetCharacter.Custom('GetSinfulShameful')|l] como vos se arrastre a una santa orden al servicio de [ROOT.Char.GetFaith.HighGodName]… Pensad en redimir vuestra alma antes de preocuparos por las riquezas materiales."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "He oído vuestra súplica de oro y la orden [order.GetName] responderá a vuestra llamada."
 holy_order.0200.a: "¡[ROOT.Char.GetFaith.HighGodName] me sonríe!"
 holy_order.0200.b: "Pero… ¡Pero necesito el dinero!"
 holy_order.0202.second_time: "Una vez más os recuerdo que le debéis a mi orden #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! de oro."
 holy_order.0202.opening: "Debéis a mi orden #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! de oro."
 holy_order.0202.desc: "Si no devolvéis el oro, encontraremos formas alternativas para que nos paguéis… Serán formas convenientes para [ROOT.Char.GetFaith.HighGodName], pero algo menos para vos."
 holy_order.0202.a: "Por supuesto que respetaré nuestro acuerdo."
 holy_order.0202.a_no: "¡Pagaré! Solo dejad que encuentre el oro…"
 holy_order.0202.a._not.tt: "@warning_icon! #X No hay bastante [gold|lE] [gold_i]#!"
 holy_order.0202.b_christian: "¿La paciencia no es una virtud?"
 holy_order.0202.b: "De un alma devota a otra… ¡Por favor, dadme más tiempo!"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip|l] te dará cinco años más"
 holy_order.0202.c: "¿No podríamos encontrar una forma de pago alternativo…?"
 holy_order.0202.c.tt: "@warning_icon! #X El/La [recipient.GetTitleAsNameNoTooltip] te pedirá algo#!"
 holy_order.0202.d: "¡El oro es más útil en mis manos!"
 holy_order.0203.desc: "Ni [ROOT.Char.GetFaith.HighGodNameAlternate] ni yo vemos con buenos ojos a quienes incumplen su palabra. Para corregir este desaire, nos arrendaréis [province.GetName] para que podamos seguir realizando la obra [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0203.a: "Por supuesto, la provincia de [province.GetNameNoTierNoTooltip] será vuestra."
 holy_order.0203.b: "¡Es una petición ridícula!"
 holy_order.0204.desc: "Ni [ROOT.Char.GetFaith.HighGodNameAlternate] ni yo vemos con buenos ojos a quienes incumplen su palabra. Para corregir este desaire, nos enviarás a vuestr[child.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstName|l] para realizar la obra [ROOT.Char.GetFaith.HighGodNamePossessive]."
 holy_order.0204.a: "Os… Os [child.GetHerHim] enviaré enseguida."
 holy_order.0204.a.tt: "Ya no le deberás oro a la orden"
 holy_order.0205.desc: "Todo este asunto sobre el préstamo ha sido una vergonzosa exhibición de vuestra codicia. ¡Me encargaré de que el [ROOT.Char.GetFaith.ReligiousHeadName] se entere de esto!"
 holy_order.0205.a: "¡Maldición!"
 holy_order_letter.opening: "Herman[ROOT.Char.Custom('ES_OA')] servidor[ROOT.Char.Custom('ES_XA')] de [ROOT.Char.GetFaith.HighGodNameAlternate],"
 holy_order.1001.intro: "Almas fervientes acuden en masa a la orden de [holy_order.GetName], dispuestas a entregar sus cuerpos mortales por la fe [ROOT.Char.GetFaith.GetAdjective]. Necesitamos más tierras y cuarteles para nuestros [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )|l]."
 holy_order.1001.end: "\n\nLas tierras de [target_barony.GetName] son ideales para este propósito. ¿Podríamos arrendarlas al servicio de nuestra causa sagrada?"
 holy_order.1001.a: "Se os concede vuestra petición. ¡Por [ROOT.Char.GetFaith.HighGodName]!"
 holy_order.1001.b: "¿Y [alternative_barony.GetNameNoTierNoTooltip] no os serviría igual de bien?"
 holy_order.1001.c: "No, no cederé estas tierras."
 holy_order.1011.intro: "En [target_barony.GetName], hay buenas tierras que atender y un/a [grandmaster.GetFaith.HouseOfWorship] excelente que una congregación de mis [grandmaster.Custom('SistersBrothers')] podría atender bien."
 holy_order.1011.end: "\n\n¿Podríais vos negociar en nuestro nombre para que la orden de [holy_order.GetName] funde un monasterio allí?"
 holy_order.1011.a: "La orden puede arrendar [target_barony.GetNameNoTierNoTooltip]."
 holy_order.1011.b: "¿No hay más tranquilidad en [alternative_barony.GetNameNoTierNoTooltip]?"
 holy_order.1011.c: "Témome que debéis enviar a vuestr[grandmaster.Custom('ES_OA')]s [grandmaster.Custom('SistersBrothers')] a otro lugar."
 holy_order.2001.t: "Un propósito divino"
 holy_order.2001.desc: "Cuando mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] viene a verme, entiendo enseguida que tiene que hablar de algo muy importante.\n\n«[ROOT.Char.Custom('MotherFather')|U], mi vida aquí estará siempre a la sombra de otros. Dejad que me una a la orden de [holy_order.GetName] y servir a [child.GetFaith.HighGodName]. Lo he pensado mucho y esto es lo que deseo hacer»."
 holy_order.2001.a: "Que [child.GetFaith.HighGodNameAlternate] te guíe, [child.Custom('DaughterSon')] mí[child.Custom('ES_OA')]."
 holy_order.2001.b: "Tengo planes para ti, aunque no sean grandes."
 holy_order.2002.desc: "Cuando mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))] [sibling.GetTitledFirstName|l] me cuenta sus planes, queda claro que lleva mucho tiempo reflexionando sobre ellos.\n\n«Aquí tengo poco que hacer y, si tengo que servir a alguien, prefiero servir a [sibling.GetFaith.HighGodName] en persona. Me uniré a la orden de [holy_order.GetName]»."
 holy_order.2002.a: "Entiendo tu decisión, [sibling.Custom('SisterBrother')]."
 holy_order.2002.b: "¡Claro que #EMP no#! lo vas a hacer!"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "Siempre se necesitarán auténticos guerreros que detengan cualquier amenaza contra la fe [grandmaster.GetFaith.GetAdjective].\nCon tantos talentos y tan pocas posibilidades de heredar, creo que vuestr[child.Custom('ES_OA')] [child.Custom('DaughterSon')] [child.GetTitledFirstName|l] tendría una vida mejor sirviendo a la orden de [holy_order_scope.GetName]. Con nosotros se entrenará, aprenderá y dará gran honor a vuestro nombre."
 holy_order.2003.a: "Su vida seguirá los verdaderos preceptos [child.GetFaith.GetAdherentNamePlural]."
 holy_order.2003.child_joins_order: "[child.GetFirstName] consigue [GetTrait('order_member').GetName( child.Self )] y se une a la corte de [grandmaster.GetTitledFirstNameNoTooltip|l]"
 holy_order.2003.b: "¿Y no podríais entrenar a [alternative_child.GetFirstNameNoTooltip]?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName] consigue [GetTrait('order_member').GetName( alternative_child.Self )] y se une a la corte de [grandmaster.GetTitledFirstNameNoTooltip|l]"
 holy_order.2003.c: "Su lugar está aquí conmigo."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "He dedicado mi vida a [child.GetFaith.HighGodNameAlternate], pero [child.GetFaith.HighGodNameSheHe] no desearía que ignorase a mi propia familia.\n\n[grandmaster.Custom('ES_ElLa')|U] [grandmaster.GetTitledFirstName|l] me ha dado permiso para volver a mi antigua vida y ser parte de nuevo de vuestra [ROOT.Char.Custom('GetCourt')|l]."
 holy_order.2004.a: "¡Bienvenid[child.Custom('ES_OA')] a casa, [child.Custom('DaughterSon')] mí[child.Custom('ES_OA')]!"
 holy_order.2004.b: "No. Aquí ya no hay sitio para ti."
 holy_order.2005.t: "Un regreso al hogar"
 holy_order.2005.desc: "La visita [child.Custom('ES_DelDela')] [child.GetTitledFirstName|l] se alarga más de lo normal. Cuando mi [child.Custom('DaughterSon')] se instala en mi [ROOT.Char.Custom('GetCourt')|l], atiborrándose de mi comida y molestando a mis sirvientes, menciono el asunto de su vuelta con la orden de [holy_order.GetName]. Desgraciadamente, su respuesta fue entusiasta.\n\n«¿No os habéis enterado, [ROOT.Char.Custom('MotherFather')]? ¡[grandmaster.Custom('ES_ElLa')|U] [grandmaster.GetTitledFirstName|l] ha tenido la generosidad de liberarme de mis deberes para con el [child.GetFaith.GetName|l]! He vuelto a casa al fin, con mi familia»."
 holy_order.2005.a: "Así que has… ¿venido a quedarte?"
 holy_order.destroyed_title: "Orden militar disuelta"
 holy_order.2010.t: "Una nueva orden monástica"
 holy_order.2010.desc: "Ermitaños, místicos y discípulos insatisfechos de antiguas órdenes se han reunido en [barony.GetNameNoTier] y han trabajado durante años para construir su nuevo hogar en tierras salvajes. Un[leader.Custom('ES_XA')] [leader.GetWomanMan] a quien llaman [leader.Custom('ES_ElLa')] [leader.Custom('SisterBrother')] [leader.GetFirstName] se ha alzado como líder natural de esta floreciente orden, [leader.GetPrimaryTitle.GetName]…, pero mi #EMP augusta voz#! aún no ha dado su opinión al respecto. Todavía debo proponer un sagrado precepto y consagrarlo como pilar en torno al cual se estructurará el modo de vida de la orden.\n\n¿Qué cantará este coro de devotos puros en [barony.GetNameNoTierNoTooltip]? ¿Para qué se esforzarán en llevar una vida plena, sobre qué pensarán y escribirán? ¿Y quién los guiará en este proceso?"
 holy_order.2010.4: "[tenet_4.GetName( order_rite )] y [monk_tenet_1.Custom('ES_ElLa')] [monk_tenet_1.Custom('SisterBrother')] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.5: "[tenet_5.GetName( order_rite )] y [monk_tenet_2.Custom('ES_ElLa')] [monk_tenet_2.Custom('SisterBrother')] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.6: "[tenet_6.GetName( order_rite )] y [monk_tenet_3.Custom('ES_ElLa')] [monk_tenet_3.Custom('SisterBrother')] [monk_tenet_3.GetFirstNameNoTooltip]."
 holy_order.2010.d: "[tenet_1.GetName( order_rite )] y [monk_tenet_1.Custom('ES_ElLa')] [monk_tenet_1.Custom('SisterBrother')] [monk_tenet_1.GetFirstNameNoTooltip]."
 holy_order.2010.e: "[tenet_2.GetName( order_rite )] y [monk_tenet_2.Custom('ES_ElLa')] [monk_tenet_2.Custom('SisterBrother')] [monk_tenet_2.GetFirstNameNoTooltip]."
 holy_order.2010.f: "[tenet_3.GetName( order_rite )] y [monk_tenet_3.Custom('ES_ElLa')] [monk_tenet_3.Custom('SisterBrother')] [monk_tenet_3.GetFirstNameNoTooltip]."
 monastic_tenet_pick_tt: "El [core_tenet|El] defendido por la orden de [monastic_order.GetName] será: [tenet_pick.GetName( order_rite )|l]."
 monastic_order_tenet_advocated_tt: "La orden de [monastic_order.GetName] defiende: [tenet_pick.GetName( order_rite )|l]"
 founded_monastic_order_modifier: "Fundación de orden monástica"
 founded_monastic_order_modifier_desc: "Con su sabiduría, este personaje ayudó a la concepción y a la creación de una nueva orden monástica, y al hacerlo, lanzó una apelación directamente a lo divino."
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] se convierte en [ruler|El] de la orden de [monastic_order.GetName]"
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] permanece como [ruler|El] de la orden de [monastic_order.GetName]"
 holy_order.2009.t: "La construcción de un monasterio"
 holy_order.2009.desc: "Entre apacibles [province.GetTerrain.GetNameNoTooltip|l], en un lugar amado por los [province.GetCulture.GetCollectiveNoun], coloco la primera piedra que algún día albergará el monasterio de [province.GetName].\n\nMis trabajadores se unen a los humildes oblatos para erigir los muros, cantando piadosos himnos con el esfuerzo de sus cuerpos. Los primeros monjes honrados, como [potential_leader.Custom('ES_ElLa')] [potential_leader.Custom('SisterBrother')] [potential_leader.GetName], han venido hasta aquí y han trazado planes para las capillas y los refectorios.\n\nEn cuestión de años, una nueva orden nacerá. Y, además de piedras y [ROOT.Char.Custom('GetWritingMaterial')], esta nueva orden necesitará miembros juramentados."
 holy_order.2009.a: "Esta nueva orden debe ser guiada por aquellos a los que apoyo."
 holy_order.2009.b: "Muchos monjes no están satisfechos con su orden actual…"
 holy_order.2009.b.tt: "… y abandonarían a sus superiores para servir a los maestros de esta nueva orden, por la libertad de escribir una nueva regla."
 holy_order.2009.c: "Reunid a los ascetas asilvestrados y a los jóvenes fervientes."
 monastic_order_creation_increased_spiritual_fulfillment: "Las [interactions|El] con la [monastic_holy_order|El] proporcionarán una [spiritual_fulfillment|El] aumentada durante #high 50 años#!"
 monastic_founder_become_saint_tt: "Se nombrará a [chosen_leader.GetShortUIName] [GetTrait('saint').GetName( chosen_leader.Self )|l] tras su muerte, si tiene #high más de 65#! [trait_level_track_xp|El] de [GetTrait('devoted').GetName( chosen_leader.Self )] o un [piety_level|El] de al menos [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L] @piety_level_4_icon_christian!"
 holy_order.2020.t: "Votos monásticos"
 holy_order.2020.desc: "Por insistencia mía, [recipient.GetFirstName] da la espalda, ahora cubierta con la túnica, a mi [ROOT.Char.Custom('ResidenceBuilding')], y a la nobleza y [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] del mundo profano. Ha sido investid[recipient.Custom('ES_OA')] como [archabbot.GetPrimaryTitle.GetName|l].\n\nComo [recipient.Custom('ES_LoLa')]s demás [recipient.Custom('SistersBrothers')] de su orden, [recipient.GetFirstNameNoTooltip] jura lealtad y fidelidad a su sagrada comunidad. Consagra su cuerpo a [recipient.GetFaith.HighGodName], y su mente a la reverencia de [recipient.GetFaith.PositiveAfterLife].\n\n[recipient.GetFirstNameNoTooltip] ha de residir en [archabbot.GetCapitalLocation.GetName] o en otro de los santuarios de la orden, y comenzar allí su vida de estudios y contemplación."
 holy_order.2020.aa: "La orden ha ganado una mente diligente."
 holy_order.2020.aa.tt: "Las habilidades administrativas de [recipient.GetFirstNameNoTooltip] le servirán bien en sus interminables labores."
 holy_order.2020.a: "La orden ha ganado un[recipient.Custom('ES_XA')] sabi[recipient.Custom('ES_OA')] discípul[recipient.Custom('ES_OA')]."
 holy_order.2020.a.tt: "Ningún lugar de este mundo mortal podría ser más apropiado para [recipient.Custom('ES_ElLa')] erudit[recipient.Custom('ES_OA')] [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.b: "[recipient.Custom('ES_ElLa')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] de su patrón no es moz[recipient.Custom('ES_OA')] de cocina…"
 holy_order.2020.c: "Seguro que un donativo garantiza que se mime a [recipient.GetFirstNameNoTooltip]."
 holy_order.2020.d: "Su vida ahora pertenece a la orden."
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'te uniste', 'se unió')] a una orden monástica a petición de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)]"
 take_vows_improve_education_learning_tt: "El resultado de la [education|El] de [learning|El] @skill_learning_icon! mejorará"
 take_vows_improve_education_stewardship_tt: "El resultado de la [education|El] de [stewardship|El] @skill_stewardship_icon! mejorará"
 recently_joined_holy_order_desc: "[recipient.GetShortUIName] se ha unido a su orden en los 5 últimos años"
 child_in_holy_order_desc: "[recipient.GetShortUIName] es un[recipient.Custom('ES_XA')] niñ[recipient.Custom('ES_OA')] prometid[recipient.Custom('ES_OA')] a su orden"
 custom.every_domain_monastic_order: "Toda [monastic_holy_order|El] en tu [domain|El]"
 order_gains_minor_tenet_popularity_tt: "Su [core_tenet|El] gana #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! de [tenet_popularity|El]"
 new_order_gains_minor_tenet_popularity_tt: "Tu nueva [monastic_holy_order|El] proporcionará #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! extra de [tenet_popularity|El] a su [core_tenet|El]"
 holy_order.2030.t: "Donativo: [recipient.GetPrimaryTitle.GetNameNoTooltip]"
 holy_order.2030.desc: "Mis riquezas se envían a las arcas de los monasterios [recipient.Custom('ES_DelDela')] [recipient.GetTitledFirstName|l]. Un donativo que financiará los respetables trabajos en estas tierras, la copia de los textos sagrados, los propósitos mundanos de [recipient.GetPrimaryTitle.GetName|l]…\n\n… y miles de plegarias dedicadas a la causa de mi alma inmortal. Los monjes viven para rezar, y su justa y singular devoción —o eso dicen— implica que [ROOT.Char.GetFaith.random_GoodGodNames|U] se preocupa especialmente de escuchar sus rezos.\n\n#EMP [actor.GetFaith.HighGodName|U], ¿les oyes decir mi nombre?#!"
 holy_order.2030.desc_desperate_plea: "#EMP ¿Sabes cuánto me he humillado y he rogado —como un ser miserable— por tu piedad?#!"
 holy_order.2030.desc_huge_donation: "#EMP ¿Has visto la fortuna de la que me he desprendido…?#!"
 holy_order.2030.a: "Nuevos partidarios de mi salvación."
 holy_order.2030.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'aceptaste', 'aceptó')] la donación monástica de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)]"
 holy_order.2031.opening: "[actor.GetCustom('SisterBrother')|U],"
 holy_order.2031.desc: "He pensado y he rezado por vuestra petición, y me temo que no hay donativo que pueda convencer a mis monjes para que rueguen a [recipient.GetFaith.HighGodName] en vuestro nombre. Vuestra salvación está fuera de nuestro alcance."
 holy_order.2031.a: "¡Bah! Al menos sigo teniendo mi dinero."
 holy_order.2031.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'rechazaste', 'rechazó ')] la donación monástica de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)]"
 already_has_monastic_lease_tt: "[target.GetNameNoTier] ya se ha [leased|El] a una [monastic_holy_order|El]"
 lease_title_to_existing_monastic_order_interaction: "Otorgar un monasterio"
 lease_title_to_existing_monastic_order_interaction_desc: "[Concept('lease', 'Arrienda')|E] una [temple_holding|El] a [recipient.GetPrimaryTitle.GetName|l], lo que aumenta la [spiritual_fulfillment|El], la [piety|El] y el mayor acceso a la orden"
 INTERACTION_LEASE_DONATION: "Comprar propiedades auxiliares"
 no_valid_temple_holdings_to_lease_tt: "No hay [temple_holdings|El] en tu [domain|El] que estén disponibles para [Concept('lease', 'arrendar')|E]"
 monastic_onslaught_modifier_tt: "[target_county.GetName] obtiene [GetModifier('monastic_onslaught_modifier').GetNameWithTooltip] durante #high 20 años#!"
 holy_order.2040.opening: "[actor.GetFirstName] de [actor.GetPrimaryTitle.GetNameNoTier], oh, gran benefactor[actor.Custom('ES_XA')],"
 holy_order.2040.desc: "Está hecho. Un capítulo de [recipient.GetPrimaryTitle.GetNameNoTier] se unirá a mi [actor.GetFaith.HouseOfWorship] en [target.GetNameNoTier], y allí, en el corazón de [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier], almacenaremos los textos antiguos de las bibliotecas de [recipient.GetCapitalLocation.GetName].\n\n"
 holy_order.2040.desc_nuns: "Y allí, nuestras [recipient.GetFaith.DevoteeFemalePlural] recitarán sus plegarias a [actor.GetFaith.HighGodName] en vuestro nombre."
 holy_order.2040.desc_monks: "Y allí, nuestros [recipient.GetFaith.DevoteeMalePlural] recitarán sus plegarias a [actor.GetFaith.HighGodName] en vuestro nombre."
 holy_order.2040.desc_huge_donation: "Tal es la gratitud de la orden por vuestra caridad santa."
 holy_order.2040.desc_rite: "\n\nSabed que el capítulo mantendrá el cumplimiento del [recipient.GetRite.GetName|l], tal como hacen todas las casas de nuestra orden."
 holy_order.2040.a: "¡Por la prosperidad de vuestra orden!"
 holy_order.2040.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'aceptaste', 'aceptó')] la oferta de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)] de arrendar una baronía"
 holy_order.2041.opening: "[actor.GetFirstName] de [actor.GetPrimaryTitle.GetNameNoTier],"
 holy_order.2041.desc: "Nosotros, los devotos de mayor pureza de [recipient.GetFaith.HighGodName], quienes traemos la suprema santidad de [recipient.GetFaith.PositiveAfterLife] a esta miserable Tierra…, tememos que una plaga haya caído sobre el señorío de [actor.GetPrimaryTitle.GetNameNoTier] que ni siquiera nuestras plegarias pueden disipar.\n\nMientras el espíritu de vuestro señorío se halle abyectamente divorciado de [recipient.GetFaith.HighGodName], vuestro [recipient.GetPrimaryTitle.GetName] no podrá aventurarse a [target.GetNameNoTier]."
 holy_order.2041.a: "¿Qué «pureza»? ¡Insensatos!"
 holy_order.2041.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'rechazaste', 'rechazó ')] la oferta de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)] de arrendar una baronía"
 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial La orden de [monastic_order.GetName] entrará en la [holy_order_vicinity|El], permitiendo sus [interactions|El]#!"
 holy_order.2050.t: "Un movimiento surge en [barony.GetNameNoTierNoTooltip]"
 holy_order.2050.desc: "«¿Sigue padeciendo [target_order.GetName]… como padecieron los ermitaños en el desierto?», así comienzan todas las feroces misivas de [clerical_helper.GetName].\n\n«¿[target_lessee.Custom('ES_ElLa')|U] [target_lessee.GetTitledFirstName|l] se viste de oro?», preguntan los sermones de los reformistas de [barony.GetNameNoTier], y terminan con: #EMP «¡Una nueva senda! ¡Una nueva norma!».#!\n\nEl monasterio se convierte rápidamente en un hervidero de reformas y disensiones piadosas. Sus residentes prácticamente ya no siguen la ortodoxia [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] y apenas se conforman con la palabrería añeja del [target_order_tenet.GetName( founder.GetRite )|l]. Pero su espíritu reformista ha de dirigirse a un nuevo principio y a una sola mente."
 msg_order_movement_took_monastery.t: "Movimiento [chosen_leader.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 movement_took_monastery_notification_3_tt: "[new_holy_order.GetName] tomó [barony.GetNameNoTier] y otros [Concept( 'leases', 'arrendamientos' )|E] de [target_order.GetName]"
 movement_took_monastery_notification_2_tt: "[new_holy_order.GetName] tomó [barony.GetNameNoTier] y [lease_2.GetNameNoTier] de [target_order.GetName]"
 movement_took_monastery_notification_tt: "[new_holy_order.GetName] tomó el [Concept( 'lease', 'arrendamiento' )|E] de [barony.GetNameNoTier] de [target_order.GetName]"
 movement_took_monastery_patron_notification_tt: "[founder.GetShortUIName] aprobó esta [monastic_holy_order|El] reformadora."
