l_spanish:
 # find adherent mini-scheme success outcome event
 study_faith_outcome.0010.t: "¡[target.GetAdherentNameNoTooltip] encontrado!"
 study_faith_outcome.0010.desc: "¡Mis pesquisas discretas y pequeños sobornos han dado fruto! Ahora ante mí se halla [study_faith_target.GetShortUIName], que se supone que pertenece al credo [target.GetAdherentName].\n\n"
 study_faith_outcome.0010.desc.in_realm: "No ha pasado mucho desde que solicité conocer a un [target.GetAdherentName] de mi señorío. Ahora tengo ante mí a [study_faith_target.GetShortUIName], que ha respondido a mi llamada.\n\n"
 study_faith_outcome.0010.d.intimidated: "«¿Qué queréis de mí, mi [ROOT.Char.GetTitleAsName|l]?», pregunta temblando. Los guardias [study_faith_target.GetHerHim] miran con recelo, listos para actuar a la primera señal de brujería."
 study_faith_outcome.0010.d.safe: "«¿Cómo puedo serviros, mi [ROOT.Char.GetTitleAsName|l]?», pregunta, algo intimidad[study_faith_target.Custom('ES_OA')]. Mis guardias no pueden evitar mirar[study_faith_target.GetHerHim] con curiosidad, conscientes de los rumores de mi búsqueda."
 study_faith_outcome.0010.a: "Permitidme estudiar el [target.GetNameNoTooltip|l] vuestro."
 study_faith_outcome.0010.b: "He cambiado de idea."
 study_faith_outcome.0010.b.desc: "Se dejará ir a [study_faith_target.GetShortUIName] para que viva su vida como mejor le plazca"
 study_faith_outcome.0101.t: "Conoce a [actor.GetFaith.HighGodName]"
 study_faith_outcome.0101.desc: "Un estudio riguroso del [actor.GetRite.GetName|l] me ha llevado a una mejor comprensión de mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName] y, por encima de todo, a recorrer el camino de [actor.GetFaith.GoodGodNames]"
 study_faith_outcome.0101.a: "Es hora de comprometerme con la conversión."
 study_faith_outcome.0101.b: "¡No puedo abandonar a [ROOT.Char.GetFaith.GoodGodNames]!"
 study_faith_outcome.0102.desc: "Os agradezco vuestra paciencia y generosidad al guiarme en mi ignorancia. Ahora recorro el camino de [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0102.a: "Era lo que tenía que hacer."
 study_faith_outcome.0103.desc: "¡Mi lealtad es para con [recipient.GetFaith.GoodGodNames]! No se me hará olvidar el [recipient.GetRite.GetName|l]."
 study_faith_outcome.0103.a: "La insubordinación tiene un precio…"
 study_faith_outcome.0111.t: "Esforzándose por comprender el [actor.GetRite.GetNameNoTooltip|l]"
 study_faith_outcome.0111.desc: "¡El estudio riguroso del [actor.GetRite.GetName|l] no me ha llevado a ninguna parte! No solo me cuesta recorrer el camino de [actor.GetFaith.GoodGodNames], sino que temo que mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetFirstName] yerra en sus creencias."
 study_faith_outcome.0111.a: "A lo mejor la comprensión llegará con la conversión…"
 study_faith_outcome.0111.b: "Redoblaré mis esfuerzos."
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 # OUTCOME EVENTS
 study_faith_outcome.1000.t: "$study_faith$: un avance"
 study_faith_outcome.1000.desc: "Después de todo mi trabajo, por fin todas las piezas acaban por encajar. Horas interminables devorando libros, noches en vela ensayando los rituales, innumerables lecciones para dominar la teología [target.GetFaith.GetAdjective]… Todo ha convergido al final en una comprensión clara de la práctica [target.GetRite.GetAdjective].\n\nEn mi empeño he intentado imitar [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l], pero ahora empiezo a comprender que se sentiría más cómod[target.Custom('ES_OA')] con el «cálido abrazo» de otro rito, el [target.GetRite.GetName|l]."
 study_faith_outcome.1000.a: "¡Puedo aprender sobre cualquier práctica de cualquier fe!"
 study_faith_outcome.1000.b: "Este rito, el [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip|l], tiene más sentido para mí que mis propias tradiciones…"
 study_faith_outcome.1200.t: "$study_faith$: centrarse en un dogma"
 study_faith_outcome.1200.desc: "Las familiares paredes de mi estudio son testigos de mi victoria callada mientras resuelvo el valor [target.GetRite.GetAdherentName] del [discovered_tenet.GetName( target.GetRite )|l]. Por extraño que parezca, con algo de esfuerzo, puedo imaginarme [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l] y a sus parientes participando en esta práctica ajena.\n\nNo es sino un paso en un camino largo, pero mi recorrido por el [target.GetRite.GetNameNoTooltip|l] avanza poco a poco igualmente."
 study_faith_outcome.1200.a: "¡Ansío saber más sobre los [target.GetRite.GetAdherentNamePluralNoTooltip]!"
 study_faith_outcome.1200.b: "Fascinante. ¡Me pregunto qué relación tendrá con el [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )|l]!"
 study_faith_outcome.1200.c: "Esto me incomoda…"
 study_faith_outcome.1400.t: "$study_faith$: costumbres del [target.GetRite.GetNameNoTooltip|l]"
 study_faith_outcome.1400.desc: "Para comprender el [target.GetRite.GetName|l], no solo es importante estudiar su marco metafísico, sino también su influencia mundana en la vida diaria.\n\nTras reflexionar sobre el concepto de [discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )], he comprendido suficiente sobre sus implicaciones para conectar dicho concepto con las prácticas del [target.GetRite.GetName|l] en su totalidad."
 study_faith_outcome.1400.alt1.desc: "\n\n¡A su vez, esto ha puesto de manifiesto ciertos matices en su práctica de la doctrina de [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]!"
 study_faith_outcome.1400.alt2.desc: "\n\nNo es más que una pieza de un rompecabezas mucho mayor y, sin embargo, cada pieza me acerca un poco más a comprender el [target.GetRite.GetNameNoTooltip|l] en su conjunto."
 study_faith_outcome.1400.a: "Un conocimiento útil. Adelante."
 study_faith_outcome.1400.b: "Hincaré los codos."
 study_faith_outcome.1400.c: "Presionaré a [target.GetShortUINameNoTooltip] para saber más."
 study_faith_outcome.1500.t: "$study_faith$: más allá de mi alcance"
 study_faith_outcome.1500.desc: "Mucho estudiar me ha llevado lo más lejos que puede llegar un[ROOT.Char.Custom('ES_XA')] extrañ[ROOT.Char.Custom('ES_OA')]. Cualquier misterio que le reste a este [rite|El] llamado [target.GetRite.GetName|l] queda reservado para aquellos criados en el mismo; entregado a sus propios iniciados y protegido de cualquier texto, observación o incluso del maestro más paciente.\n\nAhora sé todo lo que podía saber."
 study_faith_outcome.1500.a: "He aprendido todo lo que podía."
 study_faith_outcome.1500.toast: "$study_faith$ concluido"
 study_faith_outcome.1500.toast.desc: "Has aprendido todo [core_tenet|El] y [doctrine|El] de este [rite|El], el [target.GetRite.GetName|l], que puede conocer alguien de fuera."
 study_faith_scheme_stays_active: "La [scheme|El] permanece activa"
 study_faith_outcome.3000.t: "$study_faith$: ¿reanudar los estudios?"
 study_faith_outcome.3000.desc: "Por desgracia, [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] ya no está entre nosotros. Es una pena, me fijaba en [target.GetSheHe] para que me orientase en las particularidades del [target.GetFaith.GetName|l].\n\nDicho esto, no necesito interrumpir mis estudios, ¡solo debo encontrar a otra persona a quien emular!"
 study_faith_outcome.3000.alt1.desc: "Por desgracia, [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] no era la mejor opción para que me orientase en las particularidades del [target.GetFaith.GetName|l].\n\nDicho esto, no necesito interrumpir mis estudios, ¡solo debo encontrar a otra persona a quien emular!"
 study_faith_outcome.3000.a: "¡[potential_continuation_target_1.Custom('ES_ElLa')|U] [potential_continuation_target_1.GetTitledFirstNameNoTooltip|l] es un[potential_continuation_target_1.Custom('ES_XA')] creyente de gran fervor!"
 study_faith_outcome.3000.b: "¿Quizás [potential_continuation_target_2.Custom('ES_ElLa')] [potential_continuation_target_2.GetTitledFirstNameNoTooltip|l]? Su teología es interesante."
 study_faith_outcome.3000.c: "¿Tal vez [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d: "¡Bien, estaba buscando una razón para dejar de estudiar! ¡Hurra!"
 study_faith_scheme_retains_progress: "La [scheme|lE] mantiene todo el progreso previo"
 child_studied_faith_title: "¡Mi [owner.Custom('GetDaughterSon')] estudia un rito!"
 child_studied_faith_desc: "Tu [owner.Custom('GetDaughterSon')] ha aprendido más sobre el [rite|El] llamado [target.GetRite.GetName|l]"
 child_studied_faith_invalidated_title: "Invalidación de la conjura de estudio de rito de tu retoño"
 child_studied_faith_invalidated_desc: "La [scheme|lE] de [GetScheme('study_faith').GetTypeName] de tu retoño fue invalidada"
 # ONGOING EVENTS
 study_faith_ongoing.1000.t: "$study_faith$: la facilidad de la juventud"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: la facilidad de la experiencia"
 study_faith_ongoing.1000.desc.young: "Mis estudios del [scheme.GetTargetCharacter.GetFaith.GetName|l] progresan fantásticamente. ¡Es como si tuviera toda la concentración y energía del mundo!"
 study_faith_ongoing.1000.desc.theologian: "Mis estudios del [scheme.GetTargetCharacter.GetFaith.GetName|l] van muy bien. ¡Es evidente que sus bases no son tan distintas a las de las otras fes!"
 study_faith_ongoing.1000.desc: "\n\n«#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!»\n\nAunque solo parafraseo, siento que el espíritu de la fe está claro, incluso mientras analizo los detalles detrás de las palabras.\n\n¡Si no pierdo la concentración, pronto poseeré todos los secretos del [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!"
 study_faith_ongoing.1000.a: "¡Dedicaré #EMP todo#! mi tiempo a esto!"
 study_faith_ongoing.1000.b: "Prefiero pasar el tiempo con otra cosa…"
 study_faith_ongoing.1010.t: "$study_faith$: un conocimiento íntimo"
 study_faith_ongoing.1010.desc: "#EMP «[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]»#!\n\nSintiendo una presencia, me despego de mi análisis de esta obra [scheme.GetTargetCharacter.GetFaith.GetAdjective]. [lover_target.GetFirstName] se inclina sobre mí con una mirada de deseo.\n\n«¿Son textos sobre el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]?», me pregunta.\n\n«Qué maravilla contar con otr[ROOT.Char.Custom('ES_OA')] creyente en la corte, ¡y es [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetTitleTierName|l], ni más ni menos! ¿Quizás pueda ayudaros con mis… conocimientos íntimos?»."
 study_faith_ongoing.1010.a: "Retirémonos a mis aposentos, y que no nos molesten."
 study_faith_ongoing.1010.b: "Solo te estaba estudiando a ti, [lover_target.Custom('GetDerogatoryNonbeliever')], ¡eso es todo!"
 study_faith_ongoing.1010.c: "Vade retro, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. ¡Debo concentrarme!"
 study_faith_ongoing.1010.c.tt: "#EMP Cierras la puerta en sus narices y continúas tus estudios#!"
 study_faith_ongoing.1011.t: "$study_faith$: una pista falsa"
 study_faith_ongoing.1011.desc: "Tenía mis sospechas, y tras unas cuantas preguntas capciosas, la falsedad [scheme.GetTargetCharacter.Custom('ES_DelDela')] [scheme.GetTargetCharacter.GetTitledFirstName|l] ha quedado de manifiesto. ¡A pesar de lo que dice, su fe en el [scheme.GetTargetCharacter.GetFaith.GetName|l] no es sincera!\n\nAunque profundizar en el engaño de alguien que no cree es interesante de por sí, para que mis conocimientos sobre el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l] progresen correctamente, será mejor que encuentre un practicante más fiel…"
 study_faith_ongoing.1011.a: "Ya no puedo confiar en [scheme.GetTargetCharacter.GetShortUINameNoTooltip]."
 study_faith_ongoing.1011.b: "Si lo ha estado ocultando tan bien, quizá yo también pueda…"
 study_faith_ongoing.1011.c: "Bueno, entonces… ¿En #EMP qué#! cree [scheme.GetTargetCharacter.GetShortUINameNoTooltip]?"
 study_faith_ongoing.1011.c.tt: "Intentaré indagar en sus creencias secretas."
 study_faith_ongoing.1012.t: "$study_faith$: practicante de antiguos ritos"
 study_faith_ongoing.1012.desc: "Mis intentos de investigar la fe [scheme.GetTargetCharacter.Custom('ES_DelDela')] [scheme.GetTargetCharacter.GetTitledFirstName|l] han dado sus frutos, de manera inesperada. Aunque sin duda no cree en el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l], parece que sigue los extraños y olvidados ritos del [actual_faith.GetName|l]. Estas prácticas no difieren demasiado de la… brujería.\n\nEl descubrimiento me inquieta. ¿Hay alguna manera de que esto pueda beneficiarme?"
 study_faith_ongoing.1012.a: "Vaya, es #EMP interesante#! saberlo."
 study_faith_ongoing.1012.b: "Necesitaré a alguien que me enseñe en mis estudios."
 study_faith_ongoing.1012.b.tt: "Intentarás encontrar un profesor similar para continuar estudiando el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]"
 study_faith_ongoing.1012.c: "¡Esto parece mucho más interesante que el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!"
 study_faith_ongoing.1012.c.tt: "Ahora estudiarás el [actual_faith.GetNameNoTooltip|l]"
 study_faith_ongoing.1013.t: "$study_faith$: más cómico que místico"
 study_faith_ongoing.1013.desc: "Mis intentos por investigar la fe [scheme.GetTargetCharacter.Custom('ES_DelDela')] [scheme.GetTargetCharacter.GetTitledFirstName|l] han fallado. Detrás de su devota fachada, su visión del mundo parece estar completamente desprovista de cualquier fundamento teológico.\n\nQuizá siga los principios del [scheme.GetTargetCharacter.GetFaith.GetName|l] simplemente por conveniencia, influencia o seguridad.\n\nSea cual sea el motivo, está claro que est[scheme.GetTargetCharacter.Custom('ES_EA')] [scheme.GetTargetCharacter.GetWomanMan] no se toma en serio las creencias que profesa."
 study_faith_ongoing.1013.a: "¡Una pérdida de tiempo! Me he cansado del [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]."
 study_faith_ongoing.1020.t: "$study_faith$: creyente local"
 study_faith_ongoing.1020.desc: "Parece que ha llegado a los oídos [faith_helper.Custom('ES_DelDela')] [faith_helper.GetTitledFirstName|l] que estoy estudiando la fe [scheme.GetTargetCharacter.GetFaith.GetAdjective]. Es un[faith_helper.Custom('ES_XA')] practicante nativ[faith_helper.Custom('ES_OA')] y se ofrece a ayudarme en los estudios.\n\n«No pido más que la apreciación por mi trabajo, mi [ROOT.Char.Custom('FormOfAddressForLiege')]», dice [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "Si me ayudáis, este oro será vuestro."
 study_faith_ongoing.1020.b: "¿Favor por favor?"
 study_faith_ongoing.1020.c: "¡Oh, eres #EMP tan altruista#! al ofrecerte a ayudarme gratis!"
 study_faith_ongoing.1020.d: "Gracias, pero creo que me las puedo apañar sol[ROOT.Char.Custom('ES_OA')]."
 study_faith_ongoing.1020.c.success: "Camelas a [faith_helper.GetFirstNameNoTooltip] para que te ayude"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] descubre tu manipulación"
 study_faith_ongoing.1030.t: "$study_faith$: [scheme.GetTargetCharacter.GetFaith.ReligiousText|U] de la antigüedad"
 study_faith_ongoing.1030.desc: "Un[chosen_peasant.Custom('ES_XA')] [chosen_peasant.GetWomanMan] se acerca a mí con una sonrisa materialista.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], ¿es cierto que estáis estudiando las costumbres del [scheme.GetTargetCharacter.GetFaith.GetName|l]? ¡Mi padre trajo este texto que llaman [scheme.GetTargetCharacter.GetFaith.ReligiousText] de uno de sus viajes a [holy_site.GetNameNoTier]!».\n\n«No me sirve de nada, ya que no sé leer. Con gusto os lo daría, a cambio de algunas monedas."
 study_faith_ongoing.1030.a: "Qué fortuito. Mi oro es vuestro."
 study_faith_ongoing.1030.b: "Esto no es tan raro como pensáis…"
 study_faith_ongoing.1030.b.flavor: "Regatear con este vendedor de baratijas"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] acepta el trato"
 study_faith_ongoing.1030.b.failure: "Tu oferta es insultante para [chosen_peasant.GetFirstName]"
 study_faith_ongoing.1030.c: "Guardias, quitadle estos textos paganos."
 study_faith_ongoing.1030.d: "¡Mangante! Largaos de mi vista…"
 study_faith_ongoing.1040.t: "$study_faith$: admiración"
 study_faith_ongoing.1040.desc: "¡Qué bendición! He recibido varias misivas en las que [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] alaba mis esfuerzos por aprender más sobre la fe [scheme.GetTargetCharacter.GetFaith.GetAdjective]. ¡Ha llegado hasta el punto de decir que soy la persona de fe [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] más preeminente que conoce en el estudio del [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!\n\n¡Sienta bien recibir reconocimiento por mi trabajo!"
 study_faith_ongoing.1040.a: "¡Escribanos! ¡Responded con unas palabras de agradecimiento!"
 study_faith_ongoing.1040.b: "La expresión de fe de [target.GetFirstNameNoTooltip] es esclarecedora…"
 study_faith_ongoing.1040.c: "¡Bah! ¡No necesito más validación que #EMP la mía propia#!!"
 study_faith_ongoing.1050.t: "$study_faith$: el tufo del sabotaje"
 study_faith_ongoing.1050.desc: "Mis notas, en las que resumo los principios a veces confusos y contradictorios del [scheme.GetTargetCharacter.GetFaith.GetName|l], están tiradas por todo mi estudio. El trabajo de muchos meses está ahora desgarrado y destrozado ante mí. Una hoja suelta en la ventana sugiere que algunos apuntes se han volado.\n\n¿Debo empezar otra vez desde cero?\n\n#EMP Snif, snif…#!¿Qué es ese olor demencial? ¿Incienso o sándalo mezclado con algo… floral? El olor me evoca el engreído y [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] semblante de mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))], [sabotage_rival.Custom('ES_ElLa')] [sabotage_rival.GetTitledFirstName|l]. [sabotage_rival.GetSheHe|U] es quien me ha traído la ruina…"
 study_faith_ongoing.1050.a: "Mis apuntes… ¡no! ¡Tanto trabajo, esfumado!"
 study_faith_ongoing.1050.b: "¡[sabotage_rival.GetTitledFirstNameNoTooltip] merece #EMP MORIR!#!"
 study_faith_ongoing.1050.c: "¡Ja! ¡Siempre guardo #EMP una copia de mis apuntes!#!"
 study_faith_ongoing.1060.t: "$study_faith$: una interpretación ignorante"
 study_faith_ongoing.1060.desc: "Para poner a prueba mi progreso, intento resumir un párrafo de mi [scheme.GetTargetCharacter.GetFaith.ReligiousText|U] a mi [scheme.GetTargetCharacter.GetFaith.GetAdjective] [ROOT.Char.Custom2('RelationToMeShort', offended_character)], [offended_character.Custom('ES_ElLa')] [offended_character.GetTitledFirstName|l]. #EMP «… [offended_character.Custom('ES_ElLa')] [offended_character.GetFaith.PriestNeuter] ha de levantar su [target.Custom('GetAccessory')] para que su [target.Custom('FormOfAddressForLiege')] pueda arrancar un ejemplar de [target.GetCurrentLocation.Custom('get_region_flower_type')]…».#!.\n\n«¡Tu interpretación no tiene ningún sentido! ¡Hace que mi [offended_character.GetFaith.PriestNeuter] parezca [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))] y que [offended_character.GetFaith.HighGodName] parezca [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!».\n\nQuizá mi comprensión de los detalles más complejos de la fe [scheme.GetTargetCharacter.GetFaith.GetAdjective] aún sea deficiente…"
 study_faith_ongoing.1060.a: "Por favor, acepta esto como muestra de mi arrepentimiento."
 study_faith_ongoing.1060.b: "¡Mi objetivo era ensalzar las virtudes de tu [offended_character.GetFaith.PriestNeuter]!"
 study_faith_ongoing.1060.c: "¡¿Pues sabes qué?! ¡[offended_character.GetFaith.HighGodName] es #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!"
 study_faith_ongoing.1060.d: "¡Solo deseaba conocer mejor el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1060.b.success: "[offended_character.GetHerHim|U] engañas para que crea que #EMP alababas#! a sus [offended_character.GetFaith.PriestNeuterPlural]"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] descubre la mentira"
 study_faith_ongoing.1060.d.success: "Consigues explicar que fue un malentendido"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] no te cree"
 study_faith_ongoing.1070.t: "$study_faith$: mitos sórdidos"
 study_faith_ongoing.1070.desc: "El regalo [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l], unos textos mitológicos [scheme.GetTargetCharacter.GetFaith.GetAdherentNamePlural], ha causado revuelo en la corte. Muchos me observan mientras los leo atentamente, pronunciando en voz alta los fragmentos más interesantes.\n\nA primera vista, supongo que [ROOT.Char.GetFaith.EvilGodNames] me está gastando una broma sórdida, pero tras una investigación concienzuda de algunos de los pasajes más estimulantes, queda claro que este texto es de naturaleza erótica.\n\n¿«[ROOT.Char.Custom('ObjectifiedFeature')|U]»? ¿Qué hace una referencia a [scheme.GetTargetCharacter.GetFaith.FertilityGodName] en un texto sagrado? [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "¡Guardias, libraos de este condenado libro!"
 study_faith_ongoing.1070.b: "¡¿Osáis reíros de mí?! #EMP Azotadlos.#!"
 study_faith_ongoing.1070.c: "Bueno, en cierto modo #EMP es#! educativo…"
 study_faith_ongoing.1080.t: "$study_faith$: una gran mentoría"
 study_faith_ongoing.1080.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] ha sido incansable en sus esfuerzos por ayudarme a entender los detalles más complejos del [scheme.GetTargetCharacter.GetFaith.GetName|l].\n\n¡Su dedicación al arte de la enseñanza es toda una inspiración! Siempre tiene un texto [scheme.GetTargetCharacter.GetFaith.GetAdherentNameNoTooltip] a mano o me encuentra a [scheme.GetTargetCharacter.GetFaith.PriestNeuterPlural] ilustres con quien conversar.\n\nCiertamente, nunca habría adquirido estos conocimientos si no hubiese contado con su ayuda."
 study_faith_ongoing.1080.a: "¡[court_tutor.GetFirstNameNoTooltip], te mereces una recompensa!"
 study_faith_ongoing.1080.b: "Está haciendo bien su trabajo"
 study_faith_ongoing.1090.t: "$study_faith$: ¡incomprensible!"
 study_faith_ongoing.1090.desc.intro: "¡Es imposible comprender la teología que hay detrás del [scheme.GetTargetCharacter.GetFaith.GetName|l]!"
 study_faith_ongoing.1090.tenet.desc: "En particular, la creencia de [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )] se me escapa."
 study_faith_ongoing.1090.doctrine.desc: "En particular, [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )] se me escapa."
 study_faith_ongoing.1090.desc.main: "\n\n¡Mi cráneo está lleno! En cuanto entra un nuevo concepto, otro es empujado al abismo del olvido."
 study_faith_ongoing.1090.friend.desc: "\n\n«Sigue, amig[ROOT.Char.Custom('ES_OA')] [ROOT.Char.Custom('ComplimentAdjective')], ¡yo creo en ti!».\n\nPor fortuna, [helpful_friend.Custom('ES_ElLa')] [helpful_friend.GetTitledFirstName|l] siempre está ahí para ayudarme con estos conocimientos tan extraños para mí. Es realmente una bendición."
 study_faith_ongoing.1090.no_friend.desc: "\n\nTal vez necesite un descanso."
 study_faith_ongoing.1090.a: "¡Siempre puedo contar con la orientación de [helpful_friend.GetFirstNameNoTooltip]!"
 study_faith_ongoing.1090.b: "¡No importa lo extraño que parezca, debo insistir!"
 study_faith_ongoing.1090.c: "Tengo que dejar los libros un rato…"
 study_faith_ongoing.1090.d: "¡Esto no sirve de nada!"
 study_faith_ongoing.1100.t: "$study_faith$: [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] de fe [target.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1100.desc: "Se ha corrido la voz sobre mi diligente estudio del [scheme.GetTargetCharacter.GetFaith.GetName|l].\n\nSe refieren a mí como «el vástago [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] de fe [target.GetFaith.GetAdjectiveNoTooltip]», un título que podría llevar a confusión…"
 study_faith_ongoing.1100.a: "¡Un discurso inteligente calmará a mi gente y a los [target.GetFaith.GetAdherentNamePluralNoTooltip]!"
 study_faith_ongoing.1100.b: "Mis estudios son asunto mío. ¡No habrá distracciones!"
 study_faith_ongoing.1100.c: "¡Sin duda, impresionaré [scheme.GetTargetCharacter.Custom('ES_AlAla')] [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip|l]!"
 study_faith_ongoing.1100.a.success: "Pronuncias un discurso fantástico"
 study_faith_ongoing.1100.a.success.tt: "Todo cortesano o invitado del [root_scope.GetFaith.GetNameNoTooltip|l] o del [target.GetFaith.GetNameNoTooltip|l]"
 study_faith_ongoing.1100.a.failure: "Quedas en ridículo"
 study_faith_ongoing.1110.t: "$study_faith$: la atracción de la poesía [target.GetFaith.GetAdjectiveNoTooltip]"
 study_faith_ongoing.1110.desc: "Ah, «[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] de [poet_location.Custom('GetTerrainTypePlural')|U]», una obra de [the_poet.GetFirstName] de [poet_location.GetCounty.GetName]. ¡Ciertamente se trata de una gran colección de poesía [scheme.GetTargetCharacter.GetFaith.GetAdjective]!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nQuizá la poesía sea una ventana hacia la fe…"
 study_faith_ongoing.1110.a: "¡Probaré con un verso de la fe [target.GetFaith.GetAdjectiveNoTooltip]!"
 study_faith_ongoing.1110.b: "¿Recito un poema #EMP romántico#! para mi [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip]?"
 study_faith_ongoing.1110.c: "Analizaré las cualidades religiosas del poema."
 study_faith_ongoing.1110.a.success: "Descubres que tienes talento para la poesía"
 study_faith_ongoing.1110.a.failure: "Tus tentativas en la poesía son desastrosas"
 study_faith_ongoing.1120.t: "$study_faith$: historias heréticas"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n«¿[ROOT.Char.Custom('ES_ElLa')|U] [ROOT.Char.GetTitleTierName|l], estudiando las fábulas de una fe extranjera? ¿No tenéis vergüenza?», exclama mi [ROOT.Char.Custom2('RelationToMeShort', zealot)], [zealot.Custom('ES_ElLa')] [zealot.GetTitledFirstName|l].\n\n«Si vuestros enemigos descubren que fraternizáis con ideas heréticas, ¡harán todo lo que esté en su mano para retrataros como hereje!».\n\nQuizá la elección de este texto [scheme.GetTargetCharacter.GetFaith.GetAdherentName] pueda ser malinterpretada por los enemigos de mi [ROOT.Char.Custom('GetCourt')] y otros cretinos."
 study_faith_ongoing.1120.a: "¡No! ¡Estos son… los #EMP venerables tratados teológicos de la fe [target.GetFaith.GetAdjectiveNoTooltip]!#!"
 study_faith_ongoing.1120.b: "¿Osas acusarme de herejía? ¡Te vas a enterar!"
 study_faith_ongoing.1120.c: "Tenéis razón. Estos textos no son propios de un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleTierName|l]."
 study_faith_ongoing.1120.d: "Que la gente piense lo que quiera. ¡Estas escrituras son muy ilustrativas!"
 study_faith_ongoing.1120.a.success: "Engañas a [zealot.GetFirstNameNoTooltip]"
 study_faith_ongoing.1120.a.failure: "Tu gusto por la lectura hereje es de dominio público"
 study_faith_ongoing.1120.b.tt: "#V ¡Te bates con#! [zealot.GetFirstName] por su insolencia!\n#weak Este duelo NO es a muerte.#!\nSi vences, ganarás [prestige|lE] [prestige_i] y un [modifier|lE] para la [scheme|lE]. Si pierdes, se te ridiculizará.\n\nTu [prowess|lE]: #V [root_for_loc.GetProwess]#! [prowess_i]\n[prowess|E] de [zealot.GetFirstName]: #V [zealot.GetProwess]#! [prowess_i]"
 study_faith_ongoing.1121.trigger_failure: "Mi duelo contra [zealot.GetFirstNameNoTooltip] ha sido invalidado"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "«¡Me rindo! Perdonadme, por favor, ¡no tenéis la mente débil para nada! ¡Solo perdonadme la vida!», exclama [zealot.Char.Custom('ES_ElLa')] [zealot.GetTitledFirstName|l].\n\nEso le enseñará a no #EMP insultarme#!."
 study_faith_ongoing.1123.a: "Como ya dijo el/la [ROOT.Char.Custom('GetAnimalType')] sagaz: «¡No insultes a tus superiores!»."
 study_faith_ongoing.1123.b: "¡Te pudrirás en las mazmorras por tu insolencia!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.Char.Custom('ES_ElLa')|U] [zealot.GetTitledFirstName|l] escupe al suelo, justo al lado de donde yaces.\n\n«Eres un ejemplo débil y patético de lo que significa ser [ROOT.Char.GetTitleTierName|l]. Ahora te haré un favor y te libraré de esos libros ridículos», dice [zealot.GetSheHe]."
 study_faith_ongoing.1124.a: "Un revés en mis estudios…"
 study_faith_ongoing.1130.t: "$study_faith$: placeres de la fe"
 study_faith_ongoing.1130.desc: "«¡Ah, querid[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetFirstNameNoTooltip]! ¿Estás aprendiendo mi adorado [scheme.GetTargetCharacter.GetFaith.GetName|l]? ¡Valoro el esfuerzo que haces para entenderme!», dice [lover_to_help.Custom('quirk_pos_pp')] [lover_to_help.Custom('ES_ElLa')] [lover_to_help.GetTitledFirstName|l].\n\n«Será un placer ayudaros #EMP como mejor pueda#!»."
 study_faith_ongoing.1130.a: "¡Aceptaré cualquier ayuda que pueda conseguir!"
 study_faith_ongoing.1130.b: "Sé de una forma que podría ser muy agradable."
 study_faith_ongoing.1130.c: "Preferiría estudiar sin compañía."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] es un[lover_to_help.Custom('ES_XA')] buen[lover_to_help.Custom('ES_XA')] profesor[lover_to_help.Custom('ES_XA')], aunque le gusta flirtear"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] centra tus lecciones en elementos muy específicos y sensuales de la teología, y eres incapaz de ver cómo puede ser esto compatible con la fe en su conjunto"
 study_faith_ongoing.1130.a.failure.toast: "La ayuda de [lover_to_help.GetFirstNameNoTooltip] es demasiado insinuante como para resultar útil."
 study_faith_ongoing.1140.t: "$study_faith$: una mano guía"
 study_faith_ongoing.1140.desc: "«Te recomiendo que aprendas más sobre el [scheme.GetTargetCharacter.GetFaith.GetName|l]. Seguramente refuerce tu posición como [ROOT.Char.GetTitleTierName|l]», exclama mi [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName].\n\n«Conozco las costumbres del [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l] desde que nací. ¿Tal vez podría ser de ayuda, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?»."
 study_faith_ongoing.1140.a: "¿Me ayudas a entender este dogma?"
 study_faith_ongoing.1140.b: "¿Te gustaría acompañarme en mis sesiones de estudio?"
 study_faith_ongoing.1200.t: "$study_faith$: un sabueso pagano"
 study_faith_ongoing.1200.desc: "En mis esfuerzos por aprender los misterios del [scheme.GetTargetCharacter.GetFaith.GetName|l], mantengo una ordenada colección de notas. Cierto es que es mi único medio para controlar el caos de otro sistema de creencias. Por desgracia, parece que algunas se me han extraviado.\n\nNoto una sensación familiar cuando el hocico húmedo de [ROOT.Char.Custom('DogStoryName')] se frota con mi mano. Miro a mi querido perro, deseando encontrar un respiro ante mi frustración.\n\nMientras me mira, el animal mueve la cola con orgullo. Es entonces cuando me doy cuenta de que tiene mis notas firmemente agarradas entre los dientes…"
 study_faith_ongoing.1200.a: "¡No podría enfadarme contigo!"
 study_faith_ongoing.1200.b: "¿Quieres dar un paseo? Vamos allá."
 study_faith_ongoing.1200.c: "¡No es un juguete! ¡Perro #EMP malo#!!"
 study_faith_ongoing.1300.t: "$study_faith$: aprender con la práctica"
 study_faith_ongoing.1300.desc: "Al pasar por [ROOT.Char.GetCurrentLocation.GetTitle.GetName], vemos a los lugareños enzarzados en una celebración [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip]. Un[interlocutor.Custom('ES_XA')] [interlocutor.GetWomanMan] se nos acerca y nos invita a participar, aunque somos [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nMi comitiva intenta interponerse entre nosotros, temiendo que pueda tratarse de una trampa.\n\nDa igual si hay que correr el riesgo. ¡Es una ocasión excelente para aprender de primera mano sobre el [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip|l]!"
 study_faith_ongoing.1300.a: "¡Mostradme el camino!"
 study_faith_ongoing.1300.a.flavor: "Es solo un pequeño ritual de la fe [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip], ¿qué peligro puede haber?"
 study_faith_ongoing.1300.b: "Debatir los detalles de su fe sin duda será lo más instructivo."
 study_faith_ongoing.1300.b.flavor: "Intentas entablar un debate amistoso con [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.success: "Mantienes un debate apasionante con [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.b.failure: "No consigues comunicarte con [interlocutor.GetFirstNameNoTooltip]"
 study_faith_ongoing.1300.c: "«¡Uníos a nuestro viaje a [next_destination.GetNameNoTooltip]!»."
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "Al igual que la polilla no conoce el guion de las estrellas para encontrar la llama, el alma no necesita nombrar a lo Divino para ser consumida por ello."
 holy_text_indeterminate_quote_2: "Cuando el viento del desierto borró las huellas del tirano, la arena solo recordó el paso de los sedientos y los amables."
 holy_text_indeterminate_quote_3: "El río elige las piedras que pule, y sin embargo, en su paciente fluir, las hace dignas de una corona."
 holy_text_indeterminate_quote_4: "Bebe de la fuente del conocimiento y así tu espalda se doblará."
 holy_text_indeterminate_quote_5: "El día que la montaña se postró, no fue ante reyes ni ejércitos, sino ante el niño que se atrevió a hacerle una pregunta."
 holy_text_indeterminate_quote_6: "El Oculto habla primero con susurros de duda para que, cuando finalmente respondas, tu fe sea tuya."
 holy_text_indeterminate_quote_7: "Cada mentira ofrecida ante el altar regresa en forma de humo, pero cada lágrima honesta cae como una semilla en los jardines del cielo."
 holy_text_indeterminate_quote_8: "No maldigas la oscuridad que oculta tu camino, está ahí para que tu llama aprenda el coraje para arder."
 holy_text_indeterminate_quote_9: "El Radiante no cuenta los rezos de los orgullosos, sino las piedades calladas cuando no hay miradas observando."
 holy_text_indeterminate_quote_10: "Cuando el mundo se dividía entre lo «mío» y lo «tuyo», la Divinidad reía, porque ante sus ojos solo era «nuestro»."
