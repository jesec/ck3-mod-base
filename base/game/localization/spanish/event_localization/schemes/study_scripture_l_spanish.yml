l_spanish:
 study_scripture_outcome.10.t: "$study_scripture_title$una regla de estudio"
 study_scripture_outcome.10.desc: "Los libros yacen abiertos sobre el atril: los artículos de la doctrina [ROOT.Char.GetFaith.GetAdjective] se han copiado con letra paciente. Una vela parpadea en la oscuridad. Abajo, en el/la [ROOT.Char.GetFaith.HouseOfWorship], los fieles esperan, como siempre lo hacen.\n\n"
 study_scripture_outcome.10.desc_quote: "En la primera página, algún lector antes de mí ha subrayado un único fragmento: #EMP «[ROOT.Char.Custom('RandomStudyVerseFragment')]».#!\n\n¿Cuánto de mi propio ser entregaré a la página sagrada?"
 study_scripture_outcome.10.desc_generic: "¿Cuánto de mi ser entregaré al aprendizaje sagrado?"
 study_scripture_outcome.10.a: "Que el mundo espere más allá de la puerta del claustro."
 study_scripture_outcome.10.b: "El estudio tendrá sus horas, y [ROOT.Char.Custom('StudyOfficesWord')], las suyas."
 study_scripture_outcome.10.c: "Leeré según me inspire el espíritu."
 no_change_study_scripture_tt: "Tu [scheme|El] [GetScheme('study_scripture').GetTypeName] progresa sin cambios"
 study_scripture_outcome.110.t: "$study_scripture_title$la página sagrada"
 study_scripture_outcome.110.desc: "Trabajo línea a línea los grandes textos del [ROOT.Char.GetFaith.GetName|l], la cera se acumula bajo la vela consumida mientras los conejos y los caracoles de la marginalia discuten entre sí.\n\n"
 study_scripture_outcome.110.desc_quote: "Hay un pasaje que me llega al alma:\n#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]».#!\n\nSi he de guiar a los fieles de [ROOT.Char.GetFaith.HighGodName], estas son las palabras que debo llevar en mi corazón."
 study_scripture_outcome.110.desc_generic: "Si he de guiar a los fieles de [ROOT.Char.GetFaith.HighGodName], estas son las palabras que debo llevar en mi corazón."
 study_scripture_outcome.110.a: "Debo aprender, cueste lo que cueste."
 study_scripture_outcome.110.b: "La comprensión llegará a su debido tiempo."
 study_scripture_outcome.120.t: "$study_scripture_title$el largo comentario"
 study_scripture_outcome.120.desc: "Antes de poder guiar a mi rebaño, debo aprender a guiarme a mí mism[ROOT.Char.Custom('ES_OA')]. El comentario [commentary_writer.Custom('ES_DelDela')] [commentary_writer.GetTitledFirstName|l] yace abierto ante mí: toda una vida de trabajo de otro erudito sobre el libro sagrado de la fe [ROOT.Char.GetFaith.GetAdjective], denso como una zarza y el doble de afilado. Cada línea que despejo revela tres más.\n\nSolo a través de la disciplina saldré adelante."
 study_scripture_outcome.120.a: "Peinaré el texto en busca de un significado más profundo."
 study_scripture_outcome.120.b: "Horas constantes, progreso constante."
 study_scripture_outcome.120.c: "Una página cada noche es suficiente."
 scholar_xp_high_tt: "Profundizas considerablemente en tu estudio"
 scholar_xp_low_tt: "Profundizas ligeramente en tu estudio"
 study_scripture_outcome.130.t: "$study_scripture_title$paciencia en los márgenes"
 study_scripture_outcome.130.desc: "¿Por qué no logro entenderlo? Leo el pasaje por cuarta vez y se me cierra como un puño. Apoyo suavemente la frente contra el escritorio.\n\n«Te he traído una vela», dice mi [ROOT.Char.Custom2('RelationToMeShort', tutor)|l], [tutor.GetFirstName], desde la puerta. «Ah, los viejos comentarios. Conozco bien esas páginas. ¿Las leemos juntos un rato?».\n\nAlzo la vista. Quizá una mano amiga sea justo lo que necesito."
 study_scripture_outcome.130.a: "Enséñame. No me puede el orgullo a la hora de aprender."
 study_scripture_outcome.130.b: "Siéntate conmigo un rato; el texto puede esperar."
 study_scripture_outcome.140.t: "$study_scripture_title$predicando a la [ROOT.Char.Custom('StudyParishWord')]"
 study_scripture_outcome.140.desc: "Cierro el libro con un suspiro. Toda la doctrina está aquí y, sin embargo, la última vez que [preacher.Custom('ES_ElLa')] [preacher.GetTitledFirstName|l] predicó ante mí, no había ningún silogismo en ello: solo la verdad pura y simple de [ROOT.Char.GetFaith.HighGodName]. La [ROOT.Char.Custom('StudyParishWord')] lloró. #EMP Yo#! lloré."
 study_scripture_outcome.140.a: "Está la doctrina y está la forma de transmitirla. Aprenderé ambas cosas."
 study_scripture_outcome.140.b: "Mi vocación es la página, no el [ROOT.Char.Custom('StudyPulpitWord')]."
 study_scripture_outcome.150.t: "$study_scripture_title$las temporalidades"
 study_scripture_outcome.150.desc: "«Acompañadme», me dice mi [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )|l], [steward_scope.GetFirstName], con el libro de cuentas bajo el brazo, haciéndome señas para que salga a la mañana.\n\n«Los campos del templo, el molino, los graneros del diezmo… Fijaos en cuáles están llenos, cuáles tienen goteras y cuáles se prometen por partida doble. No se puede alimentar a un rebaño solo con la gracia»."
 study_scripture_outcome.150.a: "Enseñadme los libros de cuentas."
 study_scripture_outcome.150.b: "Un paseo me despejará la cabeza, cuando menos."
 study_scripture_outcome.160.t: "$study_scripture_title$compañía docta"
 study_scripture_outcome.160.desc: "Mis estudios me han llevado a mantener correspondencia con [colleague.Custom('ES_ElLa')] [colleague.GetTitledFirstName|l], cuya devoción es objeto de elogios mucho más allá de sus propias paredes.\n\n"
 study_scripture_outcome.160.desc_distant: "Intercambiamos cartas sobre cuestiones de fe: preguntas, argumentos y correcciones que van y vienen. Su letra es horrible, pero su razonamiento es sólido."
 study_scripture_outcome.160.a: "Discutámoslo como es debido."
 study_scripture_outcome.160.b: "Una persona instruida debería saber cómo se gobierna su sede."
 study_scripture_outcome.160.c: "Volvamos juntos a los textos."
 piety_gain_high_tt: "Ganancia de piedad significativa"
 piety_gain_low_tt: "Ganancia de piedad leve"
 study_scripture_outcome.170.t: "$study_scripture_title$una carta lacrada"
 study_scripture_outcome.170.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], me la trae como si fuera una reliquia: una carta que lleva el sello [senior.Custom('ES_DelDela')] [senior.GetTitledFirstName|l].\n\n«La noticia de vuestros estudios ha llegado más lejos de lo que imagináis. La fe se enriquece con un pastor que lee. Perseverad y tened por segura mi gracia».\n\n"
 study_scripture_outcome.170.desc_quote: "La carta termina con un único versículo, destacado del resto:\n#EMP «[ROOT.Char.Custom('RandomBibleQuoteShort')]».#!"
 study_scripture_outcome.170.desc_generic: "La carta termina con una bendición en nombre de [ROOT.Char.GetFaith.HighGodName], escrita en letra más grande que el resto."
 study_scripture_outcome.170.a: "Redactaré una respuesta adecuada."
 study_scripture_outcome.170.b: "Tal vez [senior.GetSheHe] podría elogiar mi erudición de forma más… pública."
 study_scripture_outcome.170.c: "Vuelve a leerlo. Esta vez, despacio."
 study_scripture_outcome.171.t: "$study_scripture_title$cartas a los fieles"
 study_scripture_outcome.171.desc: "Recibo cartas de todos los rincones del [ROOT.Char.GetFaith.GetName|l]. Clérigos que discuten por una palabra de la liturgia, [ROOT.Char.GetFaith.PriestNeuterPlural] de pueblo asustados por sus propias dudas, un erudito que suplica un veredicto sobre una interpretación que nadie vivo puede verificar. El mío es el sello que zanja las discusiones.\n\n"
 study_scripture_outcome.171.desc_quote: "La carta de esta noche me cita las Escrituras, con esperanza:\n#EMP «[ROOT.Char.Custom('RandomBibleQuoteShort')]».#!\n\nCrece el montón sobre mi escritorio. Y, como quien no quiere la cosa, también mi conocimiento."
 study_scripture_outcome.171.desc_generic: "Crece el montón sobre mi escritorio. Y, como quien no quiere la cosa, también mi conocimiento."
 study_scripture_outcome.171.a: "Responde a todas ellas. Para eso están los pastores."
 study_scripture_outcome.171.b: "Que los copistas difundan mis respuestas a todos los rincones de la fe."
 study_scripture_outcome.171.c: "Esta noche soy estudiante. Las cartas pueden esperar."
 study_scripture_outcome.172.t: "$study_scripture_title$carta pastoral"
 study_scripture_outcome.172.desc: "Esta noche estudio las cartas escritas por los pastores a congregaciones lejanas: los sermones y las palabras de instrucción varían mucho de [ROOT.Char.Custom('StudyParishWord')] a [ROOT.Char.Custom('StudyParishWord')].\n\nMis pensamientos se dirigen a los fieles de [pastoral_county.GetNameNoTier], en las tierras [pastoral_lord.Custom('ES_DelDela')] [pastoral_lord.GetTitledFirstName|l]. Allí tienen una iglesia. Están lejos de mi alcance y carecen de mi guía… Quizá sea hora de que les escriba en persona.\n\nTomo la pluma. #EMP «A los fieles de [pastoral_county.GetNameNoTier]…».#!"
 study_scripture_outcome.172.a: "Mandadla."
 study_scripture_outcome.172.b: "La lección estaba en escribirla. Con eso basta."
 study_scripture_outcome.172.toast: "[owner.Custom('ES_ElLa')|U] [owner.GetTitledFirstName|l] ha enviado una carta a las gentes de [pastoral_county.GetNameNoTier]"
 study_scripture_outcome.180.t: "$study_scripture_title$el desahogo"
 study_scripture_outcome.180.desc: "Empiezo a leer con la mandíbula apretada y los hombros tensos, a la espera tener que soportar otra obligación.\n\n"
 study_scripture_outcome.180.desc_confession: "En algún punto entre la primera y la última página, mi alma se desmorona. Todo lo que llevo cargando, se lo digo en voz alta a nadie más que a [ROOT.Char.GetFaith.HighGodName]. El peso ha desaparecido.\n\nPor primera vez en meses, el camino que tengo por delante se presenta despejado."
 study_scripture_outcome.180.desc_generic: "En algún punto entre la primera y la última página, el peso va desapareciendo de mis hombros. Es como si se hubiera levantado un velo.\n\nPor primera vez en meses, el camino que tengo por delante se presenta despejado."
 study_scripture_outcome.180.a: "Y ahora, a por la siguiente lectura…"
 study_scripture_outcome.190.t: "$study_scripture_title$el mecenazgo de los eruditos"
 study_scripture_outcome.190.desc: "El aprendizaje también tiene su política. Un libro copiado enviado al consejo adecuado, un prometedor lector sentado en la mesa pertinente, mi nombre mencionado favorablemente en los círculos apropiados…\n\nTrabajo con diligencia. Pero la diligencia que pasa desapercibida es una diligencia desperdiciada."
 study_scripture_outcome.190.a: "Aseguraos de que el sínodo escuche mi nombre."
 study_scripture_outcome.190.b: "Pedid a los teólogos que compartan sus apuntes."
 study_scripture_outcome.190.c: "Los místicos deberían conocer mi obra."
 study_scripture_outcome.190.d: "Mi devoción se sostiene por sí sola."
 study_scripture_outcome.200.t: "$study_scripture_title$persona visionaria"
 study_scripture_outcome.200.desc: "Hay páginas en las que las letras terminan y algo más comienza. [mystic.Custom('ES_ElLa')|U] [mystic.GetTitledFirstName|l] sobresale en el saber [GetTrait('lifestyle_mystic').GetName( mystic )|l] y escribe sobre una oscuridad más brillante que el mediodía, de una oración que continúa cuando las palabras se agotan, y el [ROOT.Char.GetFaith.GetName|l] enseña que esas puertas existen para quienes se atreven a llamar.\n\nLeí hasta que se apagó la vela. Luego, me quedé sentad[ROOT.Char.Custom('ES_OA')] un buen rato en la oscuridad, escuchando."
 study_scripture_outcome.200.a: "Algo aguarda en esa oscuridad. Lo buscaré."
 study_scripture_outcome.200.b: "Ponedme a prueba, misterios. No tengo miedo."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] se merece una carta de admiración."
 study_scripture_outcome.200.d: "Tomaré nota de la puerta y me ceñiré a un estudio más sencillo."
 study_scripture_outcome.300.t: "$study_scripture_title$noche de vigilia"
 study_scripture_outcome.300.desc: "El frío y el silencio absoluto reinan en el/la [ROOT.Char.GetFaith.HouseOfWorship]. Entre el último oficio y el primero hay una hora que no pertenece a nadie, y la he hecho mía: una sola vela, la oscuridad y el misterio que se cierne sobre la llama.\n\nAlgo espera tras el silencio. Es paciente. Esta noche, yo también."
 study_scripture_outcome.300.a: "Más hondo. Ahondaré más."
 study_scripture_outcome.300.b: "Una hora de quietud, luego a dormir."
 study_scripture_outcome.300.c: "He montado guardia; con eso basta."
 study_scripture_outcome.100.t: "$study_scripture_title$una cuestión de sucesión"
 study_scripture_outcome.100.desc: "Cae la noche mientras tengo ante mí los cánones de la elección, cuyas páginas alumbran una tenue luz. Quién puede ser nombrado, quién puede nombrarlos, qué precedentes se respetan y cuáles se eluden… Todo está aquí, para quienes tengan la paciencia de leerlo.\n\nLos ancianos mueren. Se reúnen los cónclaves. Y los cardenales recuerdan quién conocía la ley cuando importaba."
 study_scripture_outcome.100.a: "Algún día se planteará la pregunta. Y yo seré la respuesta."
 study_scripture_outcome.100.b: "La sabiduría lleva tiempo; que la ambición espere."
 study_scripture_outcome.100.c: "Será mejor que me vaya a dormir…"
 pam_ss_papabile_tt: "Tu [papabile_score|El] para la sucesión papal aumenta en #P +10#!"
 study_scripture_outcome.101.t: "$study_scripture_title$exégeta de renombre"
 study_scripture_outcome.101.desc: "La respuesta me llega durante una cena fría, entre un bocado y otro. Por fin, sé cómo interpretar el pasaje:\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]».#!\n\nGeneraciones de [Glossary('exégetas', 'GLOSS_EXEGETE')] han discutido sobre estas palabras. Ahora su significado parece meridanamente claro. La cuestión es qué hacer con mi interpretación."
 study_scripture_outcome.101.desc_generic: "Generaciones de [Glossary('exégetas', 'GLOSS_EXEGETE')] han discutido sobre estas palabras. Ahora su significado parece meridanamente claro. La cuestión es qué hacer con mi interpretación."
 study_scripture_outcome.101.a: "Predicarla desde el [ROOT.Char.Custom('StudyPulpitWord')] en la próxima fiesta."
 study_scripture_outcome.101.b: "Difundirla discretamente entre los instruidos."
 study_scripture_outcome.101.c: "Me llegó en silencio; en silencio la devuelvo."
 GLOSS_EXEGETE: "Persona que se dedica a la exégesis: experto o erudito especializado en explicar, interpretar o exponer de forma crítica un texto, especialmente las escrituras religiosas."
 study_scripture_outcome.102.t: "$study_scripture_title$claridad doctrinal"
 study_scripture_outcome.102.desc: "Durante años, las doctrinas del [ROOT.Char.GetFaith.GetName|l] han estado en mi mente, pero algunas enseñanzas nunca llegaron a cobrar sentido para mí.\n\n"
 study_scripture_outcome.102.desc_tenet: "Esta noche, el dogma [pam_ss_clarity_tenet.GetBaseName] se aclara por fin: lo que exige, lo que perdona y dónde están sus límites. Lo entiendo lo suficientemente bien como para defenderlo ante cualquier erudito o explicárselo a un niño."
 study_scripture_outcome.102.desc_generic: "Esta noche, las enseñanzas quedan claras por fin: lo que exigen, lo que perdonan y dónde están sus límites. Las entiendo lo suficientemente bien como para defenderlas ante cualquier erudito o explicárselas a un niño."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]».#!"
 study_scripture_outcome.102.a: "Debo plasmarlo por escrito antes de que se desvanezca la luz."
 study_scripture_outcome.102.b: "Me basta con la alegría que me genera."
 study_scripture_outcome.102.c: "Incluso esta revelación puede esperar hasta la mañana."
 study_scripture_outcome.121.t: "$study_scripture_title$quien enseña"
 study_scripture_outcome.121.desc: "Hallo a mi [ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )], [student_courtier.Custom('ES_ElLa')] [student_courtier.GetTitledFirstName|l], en la biblioteca mucho después de que las velas deberían haberse apagado, encorvad[student_courtier.Custom('ES_OA')] sobre un texto que le queda demasiado grande para su nivel de conocimiento.\n\n«Ruego que me perdonéis, [ROOT.Char.Custom('FormOfAddressForLiege')]», balbucea sobresaltad[student_courtier.Custom('ES_OA')]. «Yo… ojalá me hubiera leído este tomo…».\n\nRecuerdo lo que habría dado yo por tener un profesor que se hubiera #EMP leído#! el libro de verdad."
 study_scripture_outcome.121.a: "Lo leeremos como es debido, juntos."
 study_scripture_outcome.121.b: "[student_courtier.Custom('ES_LoLa')|U] apadrinaré."
 study_scripture_outcome.121.c: "Dejemos que estudie a solas. Eso forja el carácter."
 study_scripture_outcome.122.t: "$study_scripture_title$el catecismo"
 study_scripture_outcome.122.desc: "Mis estudios han dado sus frutos. Esta noche, reúno a mi familia en los [ROOT.Char.Custom('ResidenceBuildingHallsType')] de mi [ROOT.Char.Custom('ResidenceBuilding')] y abro ante ellos el libro sagrado de la fe [ROOT.Char.GetFaith.GetAdjective].\n\nYo leo. Ellos escuchan. Pronto surgen las preguntas: algunas sencillas, otras sorprendentemente agudas. Parece que no soy la única persona con ganas de aprender sobre lo sagrado."
 study_scripture_outcome.122.a: "Línea a línea, para todos. Esa es la tarea."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] tiene una mente aguda. Le enseñaré más."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] se quedó un rato más después. La puerta está abierta."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] ya ha aprendido lo suficiente. Que reciba mi bendición."
 study_scripture_outcome.123.t: "$study_scripture_title$la puerta del [ROOT.Char.Custom('StudySeminaryWord')]"
 study_scripture_outcome.123.desc: "La noticia de mis estudios ha viajado con los peregrinos y mercaderes ambulantes, y hoy me han traído a un[aspirant.Custom('ES_XA')] aspirante a alumn[aspirant.Custom('ES_OA')]. [aspirant.Custom('ES_ElLa')|U] [aspirant.GetTitledFirstName|l] está ante mi puerta, cansad[aspirant.Custom('ES_OA')] del camino y perseverante, con un libro prestado entre sus temblorosas manos.\n\n«Dicen que realmente leéis lo que predicáis. Enseñadme y serviré»."
 study_scripture_outcome.123.a: "Ah, comenzaremos con el abecedario de la fe."
 study_scripture_outcome.123.b: "Mi corte no es ningún [ROOT.Char.Custom('StudySeminaryWord')]."
 study_scripture_outcome.400.t: "$study_scripture_title$médico, cúrate a ti mismo"
 study_scripture_outcome.400.desc: "Este pasaje me hace detenerme. Su condena me resulta incómodamente familiar.\n\n"
 study_scripture_outcome.400.desc_generic: "El texto no me nombra, y sin embargo lo hace: soy [penance_sin.GetName( ROOT.Char )|l] —dice a las claras y sin piedad—, como si el autor me conociera."
 study_scripture_outcome.400.desc_end: "\n\nPodría cerrar el libro y no seguir leyendo. Pero la acusación seguiría ahí."
 study_scripture_outcome.400.a: "Solo hay un remedio. La penitencia."
 study_scripture_outcome.400.b: "Debo seguir leyendo, pase lo que pase."
 study_scripture_outcome.400.c: "Los santos predican. Los pecadores mandan."
 study_scripture_outcome.410.t: "$study_scripture_title$comentarios extraños"
 study_scripture_outcome.410.desc: "El códice es prestado, y su anterior lector dejó sus propios pensamientos en los márgenes: objeciones, oraciones y apuntes sobre el dogma que llaman [pam_ss_margin_tenet.GetBaseName].\n\nDebería ignorar estos garabatos. En cambio, me encuentro leyéndolos dos veces."
 study_scripture_outcome.410.a: "Y ahora una tercera vez, despacio."
 study_scripture_outcome.410.b: "Un error tan grave merece una refutación adecuada."
 study_scripture_outcome.410.c: "Al fuego, con la página y todo."
 study_scripture_outcome.430.t: "$study_scripture_title$el dogma y el corazón"
 study_scripture_outcome.430.desc: "De las enseñanzas del [ROOT.Char.GetFaith.GetName|l], hay una que hago mía por encima de todas las demás: [pam_ss_heart_tenet.GetBaseName], que llevo conmigo desde mucho antes de poder defenderla. Esta noche centro mi estudio en ella, buscando fallos.\n\n"
 study_scripture_outcome.430.desc_quote: "Los textos responden con una sola voz:\n#EMP «[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]».#!\n\nEl fallo nunca estuvo en la enseñanza."
 study_scripture_outcome.430.desc_generic: "Los textos responden con una sola voz, más antigua y firme que la mía. El fallo nunca estuvo en la enseñanza."
 study_scripture_outcome.430.a: "Lo creo. Que toda la [ROOT.Char.Custom('StudyParishWord')] me vea vivirlo."
 study_scripture_outcome.430.b: "Escribiré en su defensa."
 study_scripture_outcome.430.c: "Examinadas detenidamente, todas las enseñanzas tiene sus fallos…"
 pam_ss_spread_tenet_tt: "Tu defensa por escrito podría convencer hasta a #V 3#! [rulers|El] para que abracen el dogma [pam_ss_heart_tenet.GetBaseName]"
 pam_ss_conviction_spread_tt: "$study_scripture_title$dogma personal adoptado"
 study_scripture_outcome.1000.t: "$study_scripture_title$amonestación a pastor"
 study_scripture_outcome.1000.desc_present: "[senior.Custom('ES_ElLa')|U] [senior.GetTitledFirstName|l] no alza la voz. No necesita hacerlo.\n\n«Me dicen que vuestros estudios acumulan polvo. Un pastor que no quiere aprender tiene un rebaño sin rumbo. Se os ha dado más que a la mayoría: ¿qué habéis hecho con ello?».\n\nEl silencio que sigue es peor que cualquier grito."
 study_scripture_outcome.1000.desc_letter: "La carta lleva el sello [senior.Custom('ES_DelDela')|l] [senior.GetTitledFirstName|l] y cada meditada línea cae como una piedra:\n\n«Me ha llegado la noticia de que vuestros estudios flaquean. Un pastor que no quiere aprender desvía a su rebaño del buen camino. Se os ha dado más que a la mayoría. Espero oír mejores noticias».\n\nNo hay firma. El sello basta."
 study_scripture_outcome.1000.desc_dream: "En el sueño, me encuentro en una gran biblioteca donde todos los libros llevan mi nombre y todas las páginas están en blanco. Una figura que reconozco de cientos de imágenes sagradas cierra la última de ellas, con delicadeza, como se cierran los ojos de un difunto.\n\n«Se te ha dado más que a la mayoría», dice el santo, y me despierto con esas palabras aún resonando en la estancia."
 study_scripture_outcome.1000.a: "No me volverán a hallar en falta."
 study_scripture_outcome.1000.b: "No puedo seguir cargando con esto. Ya basta… para siempre."
 study_scripture_outcome.1000.c: "Ya basta. Necesito descansar."
 never_study_scripture_again_tt: "#N Nunca#! podrás volver a emprender una [scheme|El] [GetScheme('study_scripture').GetTypeName]"
 study_scripture_outcome.1010.t: "$study_scripture_title$un obsequio de tinta"
 study_scripture_outcome.1010.desc: "Llega un paquete [sender.Custom('ES_DelDela')] [sender.GetTitledFirstName|l]."
 study_scripture_outcome.1010.end_christian: "Una cinta marca precisamente el pasaje que no he logrado dominar:\n\n#EMP «[ROOT.Char.Custom('RandomRelevantBibleQuote')]».#!\n\nUn regalo generoso y útil."
 study_scripture_outcome.1010.end: "En su interior hay un devocionario con una bonita encuadernación, páginas llenas de oraciones, comentarios y cuidadosas iluminaciones.\n\nUn regalo generoso y útil. Las respuestas que se me han escapado quizá se hallen entre estas páginas."
 study_scripture_outcome.1010.a: "Le daré buen uso a este regalo."
 study_scripture_outcome.1010.b: "Un libro magnífico. Quedará muy bien en mi estantería."
 pam_ss_devotional_book_name: "Devocionario"
 pam_ss_devotional_book_description: "Un volumen iluminado de textos sagrados y comentarios, copiado y dorado a la hoja con evidente devoción. Una cinta marca el pasaje que su destinatario más necesitaba leer."
 study_scripture_outcome.1020.t: "$study_scripture_title$mortificación de la carne"
 study_scripture_outcome.1020.desc: "Los textos me superan esta noche, como lo hicieron anoche y la noche anterior. Mis ojos se desvían de la página; mi mente divaga hacia la cena, hacia la cama, hacia cualquier cosa que no sea la doctrina.\n\nEl problema es el cuerpo. Los antiguos ascetas lo sabían: la comodidad es el siervo más silencioso de [ROOT.Char.GetFaith.DevilName], y el hambre agudiza el alma. Quizá la carne deba ceder para que el espíritu pueda avanzar."
 study_scripture_outcome.1020.a: "El flagelo me despejará la mente."
 study_scripture_outcome.1020.b: "Mata de hambre al cuerpo y alimenta el alma."
 study_scripture_outcome.1020.c: "O quizá la cena, a la cama y un nuevo comienzo mañana."
 study_scripture_outcome.1030.t: "$study_scripture_title$retiro al claustro"
 study_scripture_outcome.1030.desc: "Mis estudios se han estancado. El mismo escritorio, la misma vela, las mismas derrotas. Así que busco a mi [ROOT.Char.Custom2( 'RelationToMeShort', counselor )], [counselor.Custom('ES_ElLa')] [counselor.GetTitledFirstName|l], cuya devoción no exige de rangos.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "«Traéis demasiados muros con vos», dice [counselor.GetFirstNameNoTooltip], señalando con un gesto la celda desnuda, la única lámpara, el silencio. «Los antiguos ermitaños lo sabían: despojaos de todo, y lo que quede es lo que estábais buscando»."
 study_scripture_outcome.1030.desc_monastery: "«Leéis como si fuerais gobernante», dice [counselor.GetFirstNameNoTooltip] sin malicia. «Conquistando páginas, contándolas como si fueran impuestos. Aquí leemos la misma línea durante una semana, hasta que ella nos lee a nosotros»."
 study_scripture_outcome.1030.a: "Organizar una bendición para mi estudio."
 study_scripture_outcome.1030.b: "Entonces, leeré la misma línea durante dos semanas."
 study_scripture_outcome.1030.c: "Rezaré sobre este asunto y lo dejaré ahí."
 study_scripture_outcome.1040.t: "$study_scripture_title$un segundo par de manos"
 study_scripture_outcome.1040.desc_acolyte: "«No pedí ayuda. Pero llegó de todos modos. Mi [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.Custom('ES_ElLa')] [helper.GetTitledFirstName|l], ha ordenado mis apuntes, ha encontrado el comentario adecuado y ha recortado mi vela. Se ha aprendido discretamente mis hábitos, incluso qué pasajes me hacen suspirar.\n\n«Rezáis mejor cuando estáis descansad[ROOT.Char.Custom('ES_OA')]», dice [helper.GetSheHe] con sencillez, mientras deja un plato de [helper.Custom('GetLocalStreetFood')] calentito junto a mis apuntes»."
 study_scripture_outcome.1040.desc_partner: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.Custom('ES_ElLa')] [helper.GetTitledFirstName|l], se acerca, me quita el códice de las manos y lee la línea en voz alta. Las palabras son sagradas. [ROOT.Char.GetFaith.HighGodName], perdóname: esta noche encuentro su [helper.Custom('ObjectifiedFeature')] aún más sagrado.\n\n«Dejadme ayudaros», murmura lo suficientemente cerca como para compartir el calor de la vela. «Quiero hacerlo»."
 study_scripture_outcome.1040.a: "Entonces, escribid al dictado hasta el amanecer. Terminemos esto."
 study_scripture_outcome.1040.b: "Una hora juntos, entonces."
 study_scripture_outcome.1040.c: "Esa amabilidad ya es ayuda suficiente."
 study_scripture_outcome.1040.d: "Acercaos más, la luz de la vela no llega muy lejos…"
 study_scripture_outcome.1050.t: "$study_scripture_title$la noche oscura del alma"
 study_scripture_outcome.1050.desc: "He leído demasiado. En algún momento, pasada la medianoche, las respuestas dieron paso a las preguntas, y la certeza, a la duda.\n\n"
 study_scripture_outcome.1050.desc_quote: "No soy la primera persona en enfrentarse a semejante silencio. #EMP «Dios mío, Dios mío, ¿por qué me has abandonado?».#!\n\nLa vela arde. El silencio persiste. ¿Y ahora qué?"
 study_scripture_outcome.1050.desc_generic: "Los santos de todas las épocas han conocido esa duda: la hora en que [ROOT.Char.GetFaith.HighGodName] contiene el aliento y no dice por qué.\n\nLa vela arde. El silencio persiste. ¿Y ahora qué?"
 study_scripture_outcome.1050.a: "La duda es un texto como cualquier otro."
 study_scripture_outcome.1050.b: "Quizá el silencio sea la respuesta."
 study_scripture_outcome.1050.c: "Más allá de las palabras, más allá de la duda… hacia el misterio mismo."
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, 'hermanas', 'hermanos' )] de la Regla"
 study_scripture_outcome.1060.desc_house: "Me cuesta mucho y he aprendido poco de valía. Sin embargo, la noticia ha llegado hasta [order_head.GetPrimaryTitle.GetNameNoTier|l], cuya orden tiene una casa en [order_house_county.GetNameNoTier]. Hoy, un carro suyo entra chirriando en mi patio: comentarios copiados, una caja de velas y una carta con el sello [order_head.Custom('ES_DelDela')] [order_head.GetTitledFirstName|l].\n\n«Ningún pastor estudiará en soledad mientras la Regla perdure. Solo tenéis que decirlo, y lo que es nuestro será vuestro»."
 study_scripture_outcome.1060.desc_far: "Noticias de mis dificultades han llegado muy lejos, hasta [order_head.GetPrimaryTitle.GetNameNoTier|l]. Hoy, un carro suyo entra chirriando en mi patio: comentarios copiados, una caja de velas y una carta con el sello [order_head.Custom('ES_DelDela')] [order_head.GetTitledFirstName|l].\n\n«Ningún pastor estudiará en soledad mientras la Regla perdure. Solo tenéis que decirlo, y lo que es nuestro será vuestro»."
 study_scripture_outcome.1060.a: "Mi agradecimiento a todos los que han hecho las copias."
 study_scripture_outcome.1060.b: "Enviadme a uno de vuestros clérigos letrados."
 study_scripture_outcome.1060.c: "Que [ROOT.Char.GetFaith.HighGodName] los proteja."
 pam_ss_lettered_brother_tt: "Un #EMP clérigo letrado#! de la orden se une a tu [court|El]"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U] llega desde [order_head.GetPrimaryTitle.GetNameNoTier|l]"
