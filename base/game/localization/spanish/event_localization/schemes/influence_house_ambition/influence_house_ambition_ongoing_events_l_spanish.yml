l_spanish:
 influence_house_ambition_ongoing.1001.tt: "Un oído amigo"
 influence_house_ambition_ongoing.1001.desc: "Hallar un oído amigo en la compañía de [target.GetFirstName] me ayudaría a influir en su opinión y hacerle ver las cosas a mi manera.\n\nMejor elegir a alguien elocuente y de trato fácil. Tampoco vendría mal que fuese agradable a la vista.\n\nTras indagar discretamente sobre la corte de [target.GetFirstName], he encontrado dos [Select_CString(And(target_associate_01.IsFemale, target_associate_02.IsFemale), 'candidatas', 'candidatos')]: [target_associate_01.GetFirstName] y [target_associate_02.GetFirstName]."
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip] es una buena elección."
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip] me ayudaría a llegar a su señor[target.Custom('ES_XA')]."
 influence_house_ambition_ongoing.1001.c: "No. Mis palabras bastarán."
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip] presenta un argumento convincente en tu favor"
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip] no logra formular un buen argumento"
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip] presenta un argumento convincente en tu favor"
 influence_house_ambition_ongoing.1001_2_failure.desc: "[target_associate_02.GetFirstNameNoTooltip] no logra formular un buen argumento"
 influence_house_ambition_ongoing.1001_1_success.toast: "$influence_house_ambition_ongoing.1001_1_success.desc$"
 influence_house_ambition_ongoing.1001_1_failure.toast: "$influence_house_ambition_ongoing.1001_1_failure.desc$"
 influence_house_ambition_ongoing.1001_2_success.toast: "$influence_house_ambition_ongoing.1001_2_success.desc$"
 influence_house_ambition_ongoing.1001_2_failure.toast: "$influence_house_ambition_ongoing.1001_2_failure.desc$"
 influence_house_ambition_ongoing.1001.cooltip.greedy: "Quiere un pago por ayudarte."
 influence_house_ambition_ongoing.1001.cooltip.relation: "No pide nada a cambio."
 influence_house_ambition_ongoing.1001.cooltip.lewd: "Sugiere una recompensa «alternativa»."
 influence_house_ambition_ongoing.1001.cooltip.ambition: "Quiere un favor a cambio."
 influence_house_ambition_ongoing.1002.tt: "Negociaciones duras"
 influence_house_ambition_ongoing.1002.desc: "Me empiezo a preguntar si [target.GetFirstName] me toma en serio siquiera. No hago más que oír promesas vagas, retrasos y debates ampulosos interminables.\n\nHa llegado la hora de dar a conocer mi disgusto. No directamente, ¡sino de un modo que haga entender a [target.GetFirstName] que disgustar a un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] de mi calibre tiene consecuencias!"
 influence_house_ambition_ongoing.1002.a: "Sabotear sus intereses de negocios."
 influence_house_ambition_ongoing.1002.b: "Que unos matones aguarden a uno de sus cortesanos y le den una paliza."
 influence_house_ambition_ongoing.1002.c: "Prender fuego a su hogar."
 influence_house_ambition_ongoing.1002.d: "¡Le enseñaré lo que es el temor!"
 influence_house_ambition_ongoing.1002.e: "Tendré un poco más de paciencia."
