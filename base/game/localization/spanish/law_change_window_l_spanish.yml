 LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T Aprueba cambios en la ley de sucesión#!\n[Character.GetShortUIName] aprueba cambios en la [succession_law|lE], o bien no puede oponerse.\n\nLos aprueba por una de estas razones:\n$BULLET_WITH_TAB$Su [opinion|lE] sobre ti es positiva\n$BULLET_WITH_TAB$Se siente [cowed|lE] por ti\n$BULLET_WITH_TAB$Ha sido [imprisoned|lE] (sea o no por ti)"
 LAW_CHANGE_WINDOW_POWERFUL_OPPOSE_TT: "#T Rechaza cambios en la ley de sucesión#!\n[Character.GetShortUIName] impide cambios en la [succession_law|lE].\n\nPara que los apruebe, es necesario uno de estos casos:\n$BULLET_WITH_TAB$Que su [opinion|lE] sobre ti sea positiva.\n$BULLET_WITH_TAB$Que esté [cowed|lE] por ti\n$BULLET_WITH_TAB$Que esté [imprisoned|lE] (sea por ti o por otros)"
