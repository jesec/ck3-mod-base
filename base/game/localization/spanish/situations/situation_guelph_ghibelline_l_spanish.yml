 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "«En nombre del Señor»: una bula papal escrita por el $religiousheadname_pope$ Nicolás II el 13 de abril de 1059. Reunía una importante serie de reformas en las elecciones papales de la época. La más notable era la exclusión de los monarcas en el proceso de elección y confirmación, lo que convertía a los cardinales-obispos en los únicos electores."
 DICTATUS_PAPAE_GLOSS: "El «dictado papal»: una compilación de 27 sentencias de autoridad del $religiousheadname_pope$. Lo dictó el $religiousheadname_pope$ Gregorio VII en el año 1075, y durante ese mismo periodo de tiempo, surgió la querella de las investiduras."
