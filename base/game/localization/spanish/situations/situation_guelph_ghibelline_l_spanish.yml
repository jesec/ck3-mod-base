 ad_interim_desc: "$situation_guelph_ghibelline_phase_ad_interim_desc_short$"
 situation_guelph_ghibelline_phase_ad_interim: "Concordato de Worms"
 situation_guelph_ghibelline_phase_ad_interim_desc_short: "Esta [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] es el punto crítico en el que el [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName|l] y el [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName|l] deciden si la siguiente fase será de [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName|l] o [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName|l]…\n\n$precursor_situation_leader_help$"
 agitation: "$situation_guelph_ghibelline_phase_agitation$"
 agitation_desc: "$situation_guelph_ghibelline_phase_agitation_desc_short$"
 situation_guelph_ghibelline_phase_agitation: "Agitación"
 situation_guelph_ghibelline_phase_agitation_desc_short: "Este tipo de [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] viene marcada por el aumento en el número de conflictos y su escalada; se libran batallas y guerras para aumentar el poder del bando vencedor.\n\nSi algún bando del conflicto tiene ≥70 % de poder, la fase progresa directamente a:\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
 guelph_advantage: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_advantage_desc: "$situation_guelph_ghibelline_phase_guelph_advantage_desc_short$"
 situation_guelph_ghibelline_phase_guelph_advantage: "Ventaja de los güelfos"
 situation_guelph_ghibelline_phase_guelph_advantage_desc_short: "Esta [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] denota que los [guelphs|El] tienen ventaja en esta [situation_phase_phase|El] llena de conflictos.\n\nComo consecuencia directa, los $guelphs$ disfrutan de bonificaciones adicionales, pero a quienes gozan de un poder inmenso también se les pondrá a prueba, de vez en cuando…"
 ghibelline_advantage: "$situation_guelph_ghibelline_phase_ghibelline_advantage$"
 ghibelline_advantage_desc: "$situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short$"
 situation_guelph_ghibelline_phase_ghibelline_advantage: "Ventaja de los gibelinos"
 situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short: "Esta [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] denota que los [ghibellines|El] tienen ventaja en esta [situation_phase_phase|El] llena de conflictos.\n\nComo consecuencia directa, los $ghibellines$ disfrutan de bonificaciones adicionales, pero a quienes gozan de un poder inmenso también se les pondrá a prueba, de vez en cuando…"
 repose: "$situation_guelph_ghibelline_phase_repose$"
 repose_desc: "$situation_guelph_ghibelline_phase_repose_desc_short$"
