 guelph_ghibelline_sub_region_core_desc: "Todos los [counties|El] en los [kingdoms|El] italianos y alemanes del [GetTitleByKey('e_hre').GetDefinitiveName], donde los [guelphs|El] y los [ghibellines|El] se enfrentan"
 #Participant Groups
 gg_leader_group_help: "#help \n\nLa falta de un líder en uno de los bandos terminará la situación en favor de la parte opuesta.#!"
 guelph_ghibelline_participant_group_guelph_leader: "Líder $guelph$"
 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main' )]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "El líder de los [guelphs|El] en la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nDurante las [Concept('situation_phase', 'fases de situación')|E] de preludio [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] y [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName], el $religiousheadname_pope$ lidera a los [guelphs|El] y la lucha escala siguiendo las líneas históricas. Las [decisions|El] propias de un líder solo están disponibles cuando el preludio da paso al conflicto abierto.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "El líder de los [guelphs|El] en la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nEste líder toma [decisions|El] únicas para dirigir el conflicto:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! y #V $guelph_ghibelline_conflict_decision$#! para mover la [situation|El] entre una [situation_phase|El] más calmada y otra más conflictiva\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#! para poner fin a la situación a favor de los [guelphs|El] mientras tienen la ventaja\n$BULLET_WITH_TAB$Una decisión para retirarse y pasar el liderazgo a un partidario adecuado$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "Líder $ghibelline$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization( GetSituation( 'guelph_ghibelline' ).GetTopCurrentPhase.GetType.HasParameter( 'gg_precursor_phase' ), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main' )]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "El líder de los [ghibellines|El] en la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nDurante las [Concept('situation_phase', 'fases de situación')|E] de preludio [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] y [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName], el gobernante del [GetTitleByKey('e_hre').GetName] lidera a los [ghibellines|El] y la lucha escala siguiendo las líneas históricas. Las [decisions|El] propias de un líder solo están disponibles cuando el preludio da paso al conflicto abierto.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "El líder de los [ghibellines|El] en la [situation|El] [GetSituation('guelph_ghibelline').GetName].\n\nEste líder toma [decisions|El] únicas para dirigir el conflicto:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! y #V $guelph_ghibelline_conflict_decision$#! para mover la [situation|El] entre una [situation_phase|El] más calmada y otra más conflictiva\n$BULLET_WITH_TAB$#V $ghibelline_victory_decision$#! para poner fin a la situación a favor de los [ghibellines|El] mientras tienen la ventaja\n$BULLET_WITH_TAB$Una decisión para retirarse y pasar el liderazgo a un partidario adecuado$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_member: "Partidario $guelph$"
