 situation_guelph_ghibelline_phase_repose_desc_short: "Esta [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] permite que la región disfrute de un periodo de paz y rejuvenecimiento, pero solo por un tiempo breve.\n\nIncitar escaramuzas y guerras es difícil y estará mal visto."
