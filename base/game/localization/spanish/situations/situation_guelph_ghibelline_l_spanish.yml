 guelph_ghibelline_participant_group_ghibelline_member_desc: "Un partidario del bando [ghibelline|El] de la [situation|El] [GetSituation('guelph_ghibelline').GetName]"
 guelph_ghibelline_participant_group_undecided: "No decidido"
 guelph_ghibelline_participant_group_undecided_desc: "Un grupo que aún no se ha decidido en la [situation|El] [GetSituation('guelph_ghibelline').GetName]. Podría convencerse para unirse a uno de los dos bandos si se emplean los medios adecuados.\n\n#BOL No#! activa [situation_catalysts|El] y es menos probable que obtenga [gg_involvement|El]."
 guelph_ghibelline_participant_group_outsider: "Forastero"
 guelph_ghibelline_participant_group_outsider_desc: "Un forastero en la [situation|El] [GetSituation('guelph_ghibelline').GetName]. Suelen ser aventureros sin tierras y otros tipos de mercenarios.\n\n#BOL No#! activa [situation_catalysts|El] #BOL ni#! gana [gg_involvement|El]."
