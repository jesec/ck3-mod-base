 precursor_situation_leader_help: "#help En esta [situation_phase_phase|El], el gobernante del [GetTitleByKey('e_hre').GetDefinitiveName] debe ser [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_leader' ).GetName|l] y el $religiousheadname_pope$ debe ser [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_leader' ).GetName|l].#!"
 situation_guelph_ghibelline_phase_in_nomine_domini: "Resurgimiento papal"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "Esta [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] es un periodo relativamente tranquilo con pocas ramificaciones inmediatas.\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "En aproximadamente [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1' ), 'año', 'años' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1' ), 'mes', 'meses' ) )], la situación escalará y entrará en la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]"
 gg_nomine_domini_transition_desc: "Si bien la mayoría de los principios del Dictatus papae (…)"
 dictatus_papae: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "Dictatus papae"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "Esta [situation_phase|El] de [GetSituation('guelph_ghibelline').GetName] es una escalada de la anterior fase [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName].\n\nLa relación entre los monarcas y sus vasallos eclesiásticos se endurece: los vasallos están divididos, ya que por un lado el $religiousheadname_pope$ clama tener poder universal, y por otro lado, sus señores quieren mantener su soberanía.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "En aproximadamente [Select_CFixedPoint( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms') )|0V] [Select_CString( GreaterThanOrEqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1' ), 'año', 'años' ), Select_CString( EqualTo_CFixedPoint( EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)1' ), 'mes', 'meses' ) )], la situación escalará y entrará en la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] o [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName]"
 gg_dictatus_papae_transition_desc: "Si bien la mayoría de los principios del Dictatus papae (…)"
