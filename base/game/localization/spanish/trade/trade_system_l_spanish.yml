 trade_category_non_construction: "Artículos no relacionados con la construcción"
 trade_category_non_construction_desc: "Toda mercadería menos los materiales de construcción; no incluye madera, cáñamo ni piedra."
 trade_category_non_food: "Artículos no comestibles"
 trade_category_non_food_desc: "Toda mercadería menos los alimentos básicos; no incluye grano, mijo, arroz, fruta, carne, pescado ni queso."
 trade_category_non_medicinal: "Artículos no medicinales"
 trade_category_non_medicinal_desc: "Toda mercadería menos los medicamentos."
 trade_category_non_luxury: "Artículos no relacionados con el lujo"
 trade_category_non_luxury_desc: "Toda mercadería menos los artículos de lujo y comodidades, como seda, especias, joyería, queso, fruta, aceite, miel y té."
 trade_category_food: "Comida básica"
 trade_category_food_desc: "Los alimentos esenciales que mantienen a la población, entre los que se incluyen el grano, el mijo, el arroz, la fruta, la carne, el pescado y el queso. Un suministro continuo es el primer requisito de cualquier asentamiento, ejército o casa."
 trade_category_beasts_of_burden: "Bestias de carga"
 trade_category_beasts_of_burden_desc: "Los animales, como los caballos y el ganado, son esenciales para la agricultura y el transporte. Hacen funcionar las granjas, transportan la mercancía y sostienen la economía rural de cualquier señorío."
 trade_category_minerals: "Minerales"
 trade_category_minerals_desc: "Los recursos obtenidos de la tierra a través de la minería y las canteras, entre los que se incluyen metales, gemas, sal y alumbre. Alimentan las forjas, las cecas y los talleres artesanos de los que depende toda la industria."
 trade_category_luxury: "Lujo"
 trade_category_luxury_desc: "Artículos poco comunes y caros codiciados por los ricos y poderosos, desde sedas y especias hasta marfil y joyas. Confieren un aura de prestigio y refinamiento y solo se los pueden permitir las cortes más prósperas."
 trade_category_refined_goods: "Artículos refinados"
 trade_category_alcohol: "Alcohol"
 trade_category_alcohol_desc: "La cerveza y el vino son mucho más que simples caprichos. Son alternativas seguras al agua contaminada, acompañan en los sacramentos religiosos y satisfacen las necesidades sociales en las tabernas y en la corte."
 trade_category_liqour_raw_materials: "Destilables"
 trade_category_precious_metals: "Metales preciosos"
 trade_category_precious_metals_desc: "La plata y el oro son el alma de las casas de la moneda y los tesoros. Además de su uso monetario, los metales preciosos son esenciales para crear artesanía fina y como símbolo de estatus."
 trade_category_jewelry_materials: "Piedras preciosas"
 trade_category_jewelry_materials_desc: "Materias primas poco comunes y exóticas valoradas por su belleza, entre las que se incluyen las gemas, el ámbar, el marfil y el jade. Alcanzan precios elevados y son esenciales en la artesanía de lujo y en la ornamentación religiosa."
 trade_category_crops: "Cultivos"
 trade_category_crops_desc: "Cosechas de campos de cultivo como el cereal, el azúcar, el algodón y el lino. Crecen en parcelas cuidadas e irrigadas, y constituyen la riqueza natural sobre la que se construyen las comunidades agrícolas."
 trade_category_base_metals: "Metales base"
 trade_category_base_metals_desc: "El hierro y el cobre son metales prácticos que sustentan la industria y el arte de la guerra. Con el hierro se moldean armas, herramientas y armaduras, y el cobre es esencial en las aleaciones y en los trabajos metálicos cotidianos."
 trade_category_cereals: "Cereales"
 trade_category_cereals_desc: "Cultivos básicos como el grano, el mijo y el arroz. Los cereales son la base de cualquier dieta y están entre las mercaderías más comercializadas; son esenciales para alimentar a ciudades y ejércitos."
 trade_category_meat: "Carnes"
 trade_category_meat_desc: "Carnes y pescados curados y conservados. Son suministros ricos en proteínas que sostienen a casas y guarniciones, y permiten realizar viajes largos a los que no pueden llevarse productos más frescos."
 trade_category_comforts: "Comodidades"
 trade_category_comforts_desc: "Alimentos del día a día no incluidos entre los alimentos básicos, como el queso, la fruta, el aceite de oliva, la miel y el té. Las comodidades mejoran la calidad de vida y son muy demandadas en todas las comunidades asentadas."
 trade_category_clothes: "Ropa"
 trade_category_clothes_desc: "Prendas acabadas y materiales de confección como textiles, pieles y cuero. Desde la indumentaria para los trabajos más pesados hasta las galas más elegantes, la ropa es una necesidad fundamental para todas las personas del señorío."
 trade_category_luxury_consumption: "Consumibles de lujo"
 trade_category_luxury_consumption_desc: "Mercancías costosas y codiciadas traídas de tierras lejanas, como el azúcar y las especias. Mejoran las comidas, se usan en la medicina y solo se las pueden permitir unos pocos privilegiados."
 trade_category_luxury_items: "Artículos de lujo"
 trade_category_luxury_items_desc: "Objetos de elaboración refinada entre los que se incluyen cerámica, vidrio, joyas, productos lacados y seda. Son los emblemas de una corte próspera y sofisticada."
 trade_category_construction_materials: "Materiales de construcción"
 trade_category_mandala_arms: "Armas rudimentarias"
 trade_category_mandala_arms_desc: "Materiales sencillos para armar a una hueste, principalmente de cobre y madera. Suministran de lanzas, escudos e instrumentos de guerra fundamentales a los señoríos que carecen de acceso a armamento forjado más formidable."
 trade_category_carpentry_supplies: "Objetos de carpintería"
 trade_category_carpentry_supplies_desc: "Madera y cáñamo, las materias primas de la construcción y la navegación. La madera aporta estructura a los edificios y embarcaciones, y el cáñamo proporciona las cuerdas y los aparejos esenciales para el comercio marítimo."
 trade_category_rural_goods: "Artículos rurales"
 trade_category_rural_goods_desc: "La riqueza bruta del campo, que abarca cultivos, ganado, madera y minerales valiosos obtenidos de la tierra. Estas son las materias primas que fluyen desde la tierra a los pueblos y ciudades que las procesan."
 trade_category_agricultural_goods: "Artículos agrícolas"
 trade_category_agricultural_goods_desc: "La producción de las granjas y el campo, que incluye desde cereales y fibras hasta vino, miel y ganado. Estas mercaderías representan la producción ampliada de una economía agrícola asentada."
 trade_category_bast_fibres: "Fibra vegetal"
 trade_category_fabrics: "Tela"
 trade_category_fabrics_desc: "Fibras textiles en bruto como la lana, el algodón y el lino. Son el producto intermedio entre la materia prima procedente de la agricultura y la manufactura textil acabada, que abastece los telares de todo el señorío."
 trade_category_guild_goods: "Artículos de gremio"
 trade_category_guild_goods_desc: "Mercancías elaboradas con maestría en los talleres de los gremios urbanos, entre las que se incluyen la cerveza, los textiles, el vidrio y las joyas. Son el producto terminado del talento profesional."
 trade_category_cheap_common: "Artículos comunes"
 trade_category_cheap_common_desc: "Mercancías asequibles y ubicuas en casi todos los mercados, que abarcan desde el grano y el pescado a la madera y la piedra. Su bajo valor y abundancia hacen de ellas el sustento diario del comercio local."
 trade_category_fine_goods: "Artículos elaborados"
 trade_category_fine_goods_desc: "Mercancías de gran valor que se mueven por los grandes mercados de todo el mundo. Son la divisa de los ricos, símbolos de estatus y de una vida civilizada."
 trade_category_staple_goods: "Artículos básicos"
 trade_category_staple_goods_desc: "Productos que se venden a granel para sostener ciudades y ejércitos. Allá donde vive un gran número de personas, estas mercancías deben fluir."
 trade_category_stone: "Piedra"
 trade_category_stone_desc: "Piedra extraída de canteras para construir fortificaciones, iglesias e infraestructura. Donde los depósitos locales escasean, se debe importar para cualquier proyecto de construcción serio."
 trade_category_salt: "Sal"
 trade_category_salt_desc: "Un mineral esencial para la conservación y las necesidades dietéticas. La sal permite la preservación de la carne y el pescado y el curtido de las pieles, y ha sido un motor del comercio de larga distancia desde tiempos antiguos."
 trade_category_alum: "Alumbre"
 trade_category_alum_desc: "Una sal mineral versátil que se usa principalmente como mordiente para fijar los tintes en los textiles. También se emplea en el curtido y la medicina, y su escasez la convierte en una materia prima de gran valor estratégico."
 trade_category_dyes: "Tintes"
 trade_category_dyes_desc: "Colorantes de colores vivos derivados de las plantas, los minerales y los insectos. Los tintes se usan para distintas artesanías, como fijar color en las prendas, esmaltar la cerámica o iluminar manuscritos con tintas de colores brillantes."
 trade_category_books: "Libros"
 trade_category_books_desc: "Son los manuscritos y el papel o el pergamino en el que se escriben. Los libros son centrales en la educación, la administración y la transmisión del conocimiento, y son un producto demandado en comunidades letradas."
 trade_category_incense: "Incienso"
 trade_category_incense_desc: "Resinas aromáticas y compuestos que se queman en las ceremonias religiosas de todo el mundo. Un suministro constante es esencial en las iglesias, templos y santuarios de cualquier comunidad devota."
 trade_category_medicaments: "Medicamentos"
 trade_category_medicaments_desc: "Los remedios, hierbas y compuestos medicinales usados por médicos y sanadores. El acceso a los medicamentos reduce los estragos provocados por las enfermedades y las lesiones y es vital para un asentamiento en crecimiento."
 trade_good_wood: "Madera"
 trade_good_wood_desc: "La madera es un material de construcción esencial para casas, barcos y mobiliario. La madera dura de buena calidad no siempre está disponible y puede que sea necesario importarla de regiones boscosas."
 trade_good_stone: "Piedra"
 trade_good_stone_desc: "Extraída de los depósitos de piedra caliza, arenisca y mármol, la piedra es esencial para cualquier construcción seria. Es pesada y difícil de transportar, y suele ser escasa fuera de sus afloramientos naturales."
 trade_good_wool: "Lana"
 trade_good_wool_desc: "La lana esquilada de las ovejas, tras pasar por un proceso de limpieza, es la fibra textil más importante de la Europa medieval. Se enrolla en ovillos y se teje para formar tela, lo que proporciona la materia prima para una industria textil mucho más amplia."
 trade_good_cotton: "Algodón"
 trade_good_cotton_desc: "El algodón se cultiva en regiones cálidas desde la India hasta Egipto, y produce una fibra más ligera y transpirable que la lana. Se enrolla en ovillos y se teje, constituyendo la base de la mayor parte del comercio textil del mundo islámico y más allá."
 trade_good_leather: "Cuero"
 trade_good_leather_desc: "Las pieles animales curtidas se convierten en un material resistente con el que se puede trabajar. El cuero se usa en botas, cinturones, sillas de montar, armaduras y encuadernaciones, por lo que se trata de un producto fundamental para la artesanía de todas las culturas."
 trade_good_flax: "Lino"
 trade_good_flax_desc: "Se cultiva tanto por sus fibras como por el aceite de linaza que se puede extraer de sus semillas. Es uno de los cultivos más antiguos conocidos por la humanidad. Aunque su cosecha exige un esfuerzo intenso, no es tan particular como otros cultivos de fibra y puede crecer casi en cualquier parte."
 trade_good_hemp: "Cáñamo"
 trade_good_hemp_desc: "Una planta versátil cultivada por sus fibras fuertes, que se enrollan para formar cuerdas, se tejen para crear velas de navegación o se usan para calafatear. El cáñamo es esencial en la economía marítima y la construcción de todo el mundo."
 trade_good_salt: "Sal"
 trade_good_salt_desc: "La sal se extrae de estanques de evaporación, minas de sal o manantiales de salmuera, y es un conservante y un mineral esencial en toda dieta. Su capacidad para evitar que la materia se eche a perder la convierte en una de las materias primas con las que más se ha comerciado a lo largo de la historia."
 trade_good_grain: "Grano"
 trade_good_grain_desc: "El grano se muele para hacer harina con la que elaborar panes y gachas, y es uno de los cultivos más importantes del mundo medieval. Desde el trigo del oeste hasta el centeno del norte, alimenta a nobles y campesinos por igual."
 trade_good_fruit: "Fruta"
 trade_good_fruit_desc: "La fruta fresca y deshidratada proporciona dulzura y variedad a la dieta medieval. Los frutos de la huerta como las manzanas, las peras y los higos son traídos desde regiones más cálidas para satisfacer la demanda del norte."
 trade_good_meat: "Carne curada"
 trade_good_meat_desc: "La carne curada mediante procesos de salado, ahumado o secado evita que se eche a perder, y es una fuente esencial de proteína. Mantienen a los ejércitos en las campañas y a las familias en los largos meses de invierno."
 trade_good_fish: "Pescado"
 trade_good_fish_desc: "El pescado seco, salado o ahumado puede recorrer largas distancias sin echarse a perder, lo que lo convierte en una fuente de proteínas muy importante para cualquier viaje lejos de las costas o los ríos. Los arenques y el bacalao en particular impulsan el comercio marítimo a gran distancia."
 trade_good_cattle: "Ganado"
 trade_good_cattle_desc: "El ganado bovino proporciona fuerza de tiro para arar campos, además de leche, carne y pieles. Es el ganado más versátil, y el acceso a buenos animales de crianza mejora cualquier economía agraria."
 trade_good_horses: "Caballos"
 trade_good_horses_desc: "Los caballos son la principal fuerza de tiro y las monturas del mundo medieval, y son esenciales para la agricultura, el transporte y la guerra. Los ejemplares selectos de las estepas y de Iberia son especialmente valiosos."
 trade_good_cheese: "Queso"
 trade_good_cheese_desc: "Producto lácteo conservado que se prepara a partir del cuajado y la maduración de la leche. El queso se conserva más tiempo que la leche fresca y es una fuente fiable de grasas y proteínas que aguanta el paso de las estaciones."
 trade_good_beer: "Cerveza"
 trade_good_beer_desc: "Elaborada a partir de grano fermentado, la cerveza es la bebida cotidiana del norte de Europa. Es baja en alcohol y nutritiva, es más segura que beber agua en muchas poblaciones y la consumen todas las clases sociales."
 trade_good_wine: "Vino"
 trade_good_wine_desc: "El vino se produce a partir de uvas fermentadas y ocupa un lugar privilegiado en la cultura medieval como bebida de la iglesia, la nobleza y la gente pudiente. Es llevado a todas partes desde los viñedos del Mediterráneo y el valle del Rin."
 trade_good_oil: "Aceite de oliva"
 trade_good_oil_desc: "Este aceite se obtiene del prensado de las aceitunas y se usa para freír, como combustible para candiles y como base de jabones en todo el mundo mediterráneo. Su importancia es menor en el norte, donde las grasas animales y la mantequilla lo reemplazan."
 trade_good_honey: "Miel"
 trade_good_honey_desc: "La miel es el principal endulzante del mundo medieval, y se usa para el hidromiel, la medicina y la conservación de la carne. Las abejas se crían en todo el mundo, pero la miel de buena calidad puede llegar a alcanzar un precio elevado."
 trade_good_rice: "Arroz"
 trade_good_rice_desc: "El arroz es el principal cereal del sur y el este de Asia y requiere arrozales irrigados y un clima templado, pero genera una producción abundante. Es el alimento base de poblaciones extensas."
 trade_good_millet: "Mijo"
 trade_good_millet_desc: "El mijo es un cereal resistente que crece en suelos pobres en nutrientes y climas secos donde otros granos no brotan. Es el alimento base de buena parte de África, Asia Central y las zonas más áridas de la India."
 trade_good_iron: "Hierro"
 trade_good_iron_desc: "El hierro es el metal que impulsa el mundo medieval. Sus menas se funden para fabricar herramientas, armas, herraduras y clavos. Ningún asentamiento puede desarrollarse sin un suministro continuado de hierro para sus artesanos y soldados."
 trade_good_alum: "Alumbre"
 trade_good_alum_desc: "El alumbre es una sal rara con propiedades como la capacidad de detener el sangrado, útil para hacer acabados en vidrio o curtir el cuero. Se usa principalmente como mordiente para blanquear y conseguir que los tintes se adhieran mejor a los tejidos.\n\nEl alumbre se encuentra en su estado natural en zonas cálidas como Oriente Medio, pero también se puede extraer de rocas de alunita en otras zonas del mundo."
 trade_good_jade: "Jade"
 trade_good_jade_desc: "El jade es una piedra hermosa y dura de gran significado cultural en Asia Oriental, y se usa para fabricar herramientas, ornamentos y objetos para rituales. Alcanza elevados precios en las cortes chinas y es símbolo de virtud y rango."
 trade_good_gold: "Oro"
 trade_good_gold_desc: "El oro es el metal más preciado, constituye la base de las tesorerías reales y posee el valor más alto en la acuñación de moneda. Su rareza y lustre lo convierten en el material favorito para coronas, reliquias y objetos de exhibición."
 trade_good_silver: "Plata"
 trade_good_silver_desc: "La plata es el metal monetario más común; se acuña en monedas que circulan por todo el mundo conocido. Además de su uso como divisa, se trabaja para crear joyas, vajillas y objetos religiosos de gran belleza."
 trade_good_amber: "Ámbar"
 trade_good_amber_desc: "Resina de árbol fosilizada, muy común en las orillas del Báltico, con la que se ha comerciado desde tiempos antiguos. Su color dorado cálido y su manejabilidad le aportan gran valor para su uso en cuentas, collares y objetos decorativos."
 trade_good_copper: "Cobre"
 trade_good_copper_desc: "Metal blando y fácil de trabajar que se usa en menaje de cocina, campanas de iglesias y aleaciones como el bronce y el latón. Su color cálido también lo hace muy popular como metal decorativo."
 trade_good_gems: "Gemas"
 trade_good_gems_desc: "Gemas preciosas entre las que se incluyen rubíes, zafiros y esmeraldas, que constituyen unas de las mercaderías más valiosas de cualquier ruta comercial. Una vez talladas y pulidas, se usan para adornar coronas, relicarios y las joyas de los poderosos."
 trade_good_silk: "Seda"
 trade_good_silk_desc: "La más elegante de todas las fibras textiles, tejida a partir de los capullos de los gusanos de seda para crear prendas de extraordinaria suavidad y lustre. La seda es originaria de China, y es unas de las mercaderías más intercambiadas en todo el mundo."
 trade_good_textiles: "Textiles"
 trade_good_textiles_desc: "Textiles tejidos a partir de lana, algodón, lino o fibras compuestas. Los textiles refinados son una de las mercaderías más comerciadas del mundo medieval, con talleres reconocidos en Flandes, Italia y Oriente Medio."
 trade_good_furs: "Pieles"
 trade_good_furs_desc: "Pieles de zorro, armiño, martas, castores y otros animales cazados con trampas en los bosques del norte. Las prendas de piel son un símbolo de riqueza y rango, y la demanda por parte de las cortes nobles supone un negocio muy lucrativo."
 trade_good_books_paper: "Libros y papel"
 trade_good_books_paper_desc: "Manuscritos hechos a mano y los pergaminos o papeles en los que se escriben. Los libros conservan los códigos jurídicos, los textos religiosos y el conocimiento acumulado, y son un producto demandado en lugares donde florecen la administración y el aprendizaje."
 trade_good_spices: "Especias"
 trade_good_spices_desc: "Pimienta, canela, clavo, nuez moscada y otras especias aromáticas del sur y el sudeste de Asia están entre las mercaderías más valiosas del mundo. Conservan la comida, le dan sabor y son un símbolo de riqueza."
 trade_good_tea: "Té"
 trade_good_tea_desc: "El té, preparado a partir de las hojas secas y procesadas de la planta del té, es la bebida distintiva del Lejano Oriente. Se extiende hacia el oeste a lo largo de la Ruta de la Seda, ganando importancia como producto comercial por derecho propio."
 trade_good_dyes: "Tintes"
 trade_good_dyes_desc: "Colorantes extraídos de plantas como la hierba pastel y la rubia roja, de insectos como el quermes y de minerales. Los tintes aportan a las prendas, las cerámicas y los manuscritos unos colores vivos esenciales para las industrias artesanas que dependen de ellos."
 trade_good_jewelry: "Joyas"
 trade_good_jewelry_desc: "Piezas acabadas que combinan metales preciosos con gemas, esmalte o vidrio. Las joyas son la marca más visible de riqueza personal en el mundo medieval y suelen intercambiarse como regalos o como obsequio diplomático."
 trade_good_ivory: "Marfil"
 trade_good_ivory_desc: "Tallado a partir de los colmillos de elefantes, el marfil es un material de prestigio y devoción. Se usa para tallados ornamentales, piezas de ajedrez, retablos de relicarios y en los objetos decorativos más ostentosos."
 trade_good_glass: "Cristal"
 trade_good_glass_desc: "Al cristal se le sopla y se le da forma para crear vajillas, cristales de ventanas y objetos decorativos. Las mejores piezas de cristal de Venecia y del mundo islámico alcanzan altos precios, mientras que las piezas más sencillas se usan cada vez más en iglesias y en los hogares de familias acaudaladas."
 trade_good_sugar: "Azúcar"
 trade_good_sugar_desc: "El azúcar se refina a partir de la caña de azúcar que crece en las regiones cálidas del sur, y es un lujo caro y poco común. Se usa como endulzante, medicina e ingrediente de alto estatus en las cocinas de los ricos."
 trade_good_incense: "Incienso"
 trade_good_incense_desc: "Resinas aromáticas como el incienso y la mirra, que arden en las ceremonias religiosas de todas las fes. El incienso requiere calor y árboles especializados para su producción, y se exporta desde Arabia, Etiopía y la India."
 trade_good_ceramics: "Cerámica"
 trade_good_ceramics_desc: "Cerámica y porcelana de buena calidad fabricada para los altos estándares de la artesanía y el arte. Las mejores piezas de China y del mundo islámico son una mercadería de lujo muy codiciada y apreciada como decoración."
 trade_good_lacquerware: "Artesanía de laca"
 trade_good_lacquerware_desc: "Objetos bañados con múltiples capas de resina de laca, valorados en Asia Oriental por su dureza y acabado brillante. Las cajas, bandejas y muebles de laca son exportaciones de lujo que recorren largas distancias en las rutas de la seda."
 trade_good_medicaments: "Medicamentos"
 trade_good_medicaments_desc: "Un amplio surtido de hierbas secas y compuestos minerales, junto con remedios procesados utilizados por médicos y boticarios. El acceso a los medicamentos es vital para tratar heridas, controlar las enfermedades y mantener a la población sana."
