l_spanish:
 christian_fulfillment_level_0: "Condenado"
 christian_fulfillment_level_1: "Desamparado"
 christian_fulfillment_level_2: "Afligido"
 christian_fulfillment_level_3: "Penitente"
 christian_fulfillment_level_4: "Absuelto"
 christian_fulfillment_level_5: "Estable"
 christian_fulfillment_level_6: "En gracia"
 default_fulfillment_level_0: "Desorientado"
 default_fulfillment_level_1: "Buscador"
 default_fulfillment_level_2: "Practicante"
 default_fulfillment_level_3: "Devoto"
 default_fulfillment_level_4: "En paz"
 industrious_junior_members_modifier: "Novicios diligentes"
 foolish_convert_modifier: "Conversión necia"
 foolish_convert_modifier_desc: "Esta necia persona ha decidido precipitadamente convertirse a un [rite|El] con un sistema de creencias muy diferente, y está teniendo dificultades para adaptarse a su nueva vida espiritual."
 reckless_convert_modifier: "Conversión imprudente"
 reckless_convert_modifier_desc: "Esta persona ha decidido convertirse a un [rite|El] con un sistema de creencias diferente sin tener una preparación adecuada, y está teniendo dificultades para adaptarse a su nueva vida espiritual."
 informed_convert_modifier: "Conversión preparada"
 informed_convert_modifier_desc: "Esta persona ha decidido convertirse a un [rite|El] con un sistema de creencias diferente con una preparación adecuada para los nuevos desafíos que supondrá esta decisión."
 study_faith_learning_mannerism: "Aprender las costumbres"
 study_faith_learning_mannerism_desc: "Aunque sea menos eficiente, aprender las costumbres y los rituales externos relacionados con un [rite|El] puede dar resultados a la larga."
 study_faith_newfound_coherence: "Coherencia recién descubierta"
 study_faith_newfound_coherence_desc: "Las incoherencias encontradas hasta ahora en el estudio de este [rite|El] han resultado ser un recurso en lugar de un obstáculo. Al unir las diferencias entre dos sistemas de creencias, se comprende mejor el verdadero significado detrás de los [core_tenets|El] y [doctrines|El] del objeto de estudio."
 study_faith_cautious_studies: "Estudios cautelosos"
 study_faith_cautious_studies_desc: "Este [rite|El] se estudia mejor a ritmo lento, lo que permita tomarse el tiempo suficiente para replantearse ideas incómodas y convertirlas en fragmentos más digeribles, y acostumbrarse a su extraña forma de pensar."
 study_faith_slow_and_steady: "Aprendizaje lento"
 study_faith_slow_and_steady_desc: "Esta persona se ha visto abrumada por la cantidad de prácticas poco familiares a las que se ha visto expuesta, y los esfuerzos para digerir esos conocimientos están haciendo mella en su destreza mental."
 study_faith_cramming_side_studies: "Horas de estudio extra"
 study_faith_cramming_side_studies_desc: "Esta persona está tan absorbida por el estudio del funcionamiento interno de este [rite|El] que a menudo toma apuntes…, incluso cuando está ocupada con otra cosa."
 followers_of_dead_faith_scheme_modifier: "Conocimiento perdido con el paso del tiempo"
 followers_of_dead_faith_scheme_modifier_desc: "Ya no se practica abiertamente la [faith|El], por lo que resulta muy difícil encontrar practicantes."
 appealing_theology_modifier: "Teología atractiva"
 appealing_theology_modifier_desc: "Este personaje ha descubierto un texto teológico extranjero que le resulta particularmente atractivo."
 suspicions_of_heresy_modifier: "Sospechas de herejía"
 suspicions_of_heresy_modifier_desc: "A menudo se ve a este personaje leyendo textos teológicos extranjeros, lo que hace que otros sospechen acerca de su devoción."
 monastic_onslaught_modifier: "Cimientos monásticos"
 monastic_onslaught_modifier_desc: "Una orden monástica, con el amplio respaldo de un patrón secular, impulsa la actividad económica de la zona."
 pam_monastic_order_improvement_modifier: "Ayuda monástica"
 pam_monastic_order_improvement_modifier_desc: "Una orden monástica ayuda a este condado ofreciendo mano de obra y consejo."
 pam_military_order_improvement_modifier: "Fuerza bendecida"
 pam_military_order_improvement_modifier_desc: "Los guerreros de la orden militar entrenan a las levas locales y enseñan disciplina en este condado."
 pam_tithes_or_mercy_harsh_tithes_modifier: "Diezmos forzosos"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "El diezmo se cobra por las malas, generando resentimiento por parte de las comunidades locales hacia su soberano."
 pam_tithes_or_mercy_show_mercy_modifier: "Diezmos clementes"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "La indulgencia en el cobro de impuestos ha mejorado la confianza y la buena voluntad entre las comunidades locales."
 pam_blissful_harmony_gospel_modifier: "Evangelio de la buena vida"
 pam_blissful_harmony_gospel_modifier_desc: "Las prédicas del gobernante celebran la paz, la piedad y una vida ordenada."
 pam_blissful_harmony_restless_ambition_modifier: "Ambición inquieta"
 pam_blissful_harmony_restless_ambition_modifier_desc: "Un momento de dicha deja a este personaje con ganas de más."
 pam_stone_for_god_estate_build_discount_modifier: "Piedra para la casa de Dios"
 pam_stone_for_god_estate_build_discount_modifier_desc: "El agudo ojo de arquitecto de este personaje hizo posible acceder a la piedra."
 pam_relocating_faithfuls_to_frontiers: "Reubicar fieles a las fronteras"
 pam_relocating_faithfuls_to_frontiers_desc: "Este condado anima a la gente practicante del mismo [rite|El] a mudarse a un [realm|El] distinto para hacer proselitismo."
 pam_moving_faithfuls_to_frontiers: "Movimiento de fieles"
 pam_moving_faithfuls_to_frontiers_desc: "Gente de distinta [faith|El] se está mudando a este condado para hacer proselitismo.\n#weak Hace que la [interaction|El] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! sea más barata.#!"
 pam_building_new_shrines: "Construir nuevos santuarios"
 pam_building_new_shrines_desc: "Gente de distinta [faith|El] se está mudando a este condado para construir nuevos santuarios.\n #weak Hace que la [interaction|El] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! sea más barata.#!"
 pam_grand_cathedral_started_modifier: "Construcción de gran catedral iniciada"
 pam_grand_cathedral_started_modifier_desc: "Este personaje ha reunido los recursos necesarios para comenzar la construcción de una gran catedral. Este proyecto, que se extenderá a lo largo de varias generaciones, demuestra su gran devoción a Dios."
 pam_grand_cathedral_completed_modifier: "Construcción de gran catedral completada"
 pam_grand_cathedral_completed_modifier_desc: "Este personaje ha reunido los recursos necesarios para completar la construcción de una gran catedral. Este proyecto, ejecutado a lo largo de varias generaciones, demuestra su gran devoción a Dios."
 pam_grand_cathedral_02_started_modifier: "Construcción de gran catedral ampliada"
 pam_grand_cathedral_02_started_modifier_desc: "Este personaje ha reunido los recursos para elevar una gran catedral existente a mayores alturas. Este proyecto, que se extenderá a lo largo de varias generaciones, demuestra su gran devoción a Dios."
 pam_grand_cathedral_02_completed_modifier: "Ampliación de gran catedral completada"
 pam_grand_cathedral_02_completed_modifier_desc: "Este personaje ha supervisado la ampliación de una gran catedral."
 pam_grand_cathedral_family_contributed_south_modifier: "Financiación de capilla de gran catedral"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "Un miembro de esta dinastía ha financiado la capilla de una gran catedral. Este proyecto, ejecutado a lo largo de varias generaciones, demuestra su gran devoción a Dios."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Mecenas de la cripta de la catedral"
 pam_cathedral_founder_crypt_modifier_desc: "Este personaje ha financiado una cripta para su dinastía bajo una gran catedral."
 pam_cathedral_bell_cracked_lesson_modifier: "Lecciones de la campana agrietada"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Los albañiles de este condado trabajan con mayor prudencia para compensar la vergüenza de haber fallado en la fundición de una campana."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Instrumentos de tortura de bronce"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Volvieron a fundir la chatarra de bronce procedente de una campana de catedral mal fundida para convertirla en instrumentos de terror. El campanero fue su primera víctima. Ahora los artesanos conocen el precio del fracaso."
 pam_cathedral_treadwheel_crane_modifier: "Grúa de rueda"
 pam_cathedral_treadwheel_crane_modifier_desc: "Se ha erigido en la capital una enorme grúa de rueda procedente de las obras de la catedral."
 pam_cathedral_cantoria_scam_modifier: "Artimaña al descubierto"
 pam_cathedral_cantoria_scam_modifier_desc: "Tras haber desenmascarado un engaño fraudulento, los constructores trabajan con renovada austeridad y premura."
 pam_cathedral_famed_choir_boy_modifier: "Voz angelical en la corte"
 pam_cathedral_famed_choir_boy_modifier_desc: "Un niño del coro con una voz sobrenatural aporta gracia a esta corte."
 pam_cathedral_sermon_peace_county_modifier: "Sermón de paz"
 pam_cathedral_sermon_peace_county_modifier_desc: "Las prédicas de un gobernante en el nuevo portal de la catedral han dejado más satisfecho a este condado y los peregrinos pueden recorrer sus caminos con mayor seguridad."
 pam_cathedral_sermon_peace_ruler_modifier: "Prédica hacia la paz"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "Este gobernante se ha sentido conmovido por un sermón en la catedral sobre la paz de Cristo."
 pam_cathedral_sermon_diligence_county_modifier: "Sermón sobre la diligencia"
 pam_cathedral_sermon_diligence_county_modifier_desc: "Las prédicas de un gobernante en el nuevo portal de la catedral han impulsado a los constructores de la iglesia y a los albañiles a trabajar con mayor ahínco."
 pam_cathedral_sermon_diligence_ruler_modifier: "Prédica hacia la laboriosidad"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "Este gobernante se ha sentido conmovido por un sermón en la catedral sobre el trabajo piadoso."
 pam_cathedral_sermon_unity_county_modifier: "Sermón sobre la unidad"
 pam_cathedral_sermon_unity_county_modifier_desc: "Las prédicas de un gobernante en el nuevo portal de la catedral han afianzado la obediencia de la comunidad en este condado."
 pam_cathedral_sermon_unity_ruler_modifier: "Prédica hacia la concordia"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "Este gobernante se ha sentido conmovido por un sermón en la catedral sobre la fraternidad cristiana."
 pam_cathedral_sermon_charity_county_modifier: "Sermón sobre la caridad"
 pam_cathedral_sermon_charity_county_modifier_desc: "Las prédicas de un gobernante en el nuevo portal de la catedral han aflojado las bolsas y reconfortado los corazones en este condado."
 pam_cathedral_sermon_charity_ruler_modifier: "Prédica hacia la caridad"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "Este gobernante se ha sentido conmovido por un sermón en la catedral sobre la misericordia generosa."
 pam_cathedral_sermon_perseverance_county_modifier: "Sermón sobre la perseverancia"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "Las prédicas de un gobernante en el nuevo portal de la catedral han renovado los esfuerzos piadosos y el crecimiento ordenado en este condado."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Prédica hacia el fervor"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "Este gobernante se ha sentido conmovido por un sermón en la catedral sobre correr la carrera de la fe."
 pam_cathedral_sermon_rejoice_county_modifier: "Sermón sobre el regocijo"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "Las prédicas de un gobernante en el nuevo portal de la catedral han llenado a los fieles de esperanza en el amor inquebrantable del Señor."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Prédica hacia la alegría"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "Este gobernante se ha sentido conmovido por un sermón en la catedral sobre regocijarse en el Señor."
 pam_cardinal_order_improve_development_modifier: "Orden cardenal: fomentar el desarrollo"
 pam_cardinal_order_improve_development_modifier_desc: "Por orden de su superior, un cardenal trabaja para fomentar el desarrollo dentro de la archidiócesis local."
 pam_cardinal_order_convert_faith_modifier: "Orden cardenal: convertir a la fe"
 pam_cardinal_order_convert_faith_modifier_desc: "Por orden de su superior, un cardenal trabaja para fomentar la conversión dentro de la archidiócesis local y las tierras fronterizas.\n\n$EFFECT_LIST_BULLET$[convert_county|E] en este [county|El]: #P +25 %#!"
 pam_cardinal_order_increase_control_modifier: "Orden cardenal: aumentar el control de condado"
 pam_cardinal_order_increase_control_modifier_desc: "Por orden de su superior, un cardenal trabaja para pacificar a la población dentro de la archidiócesis local."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Orden de acelerar la fascinación cultural"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "Por orden de su superior, un cardenal trabaja para acelerar la investigación de nuevas tecnologías."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Orden cardenal: mejorar la resistencia a la peste"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "Por orden de su superior, un cardenal moviliza recursos de la Iglesia para ayudar a mitigar la peste."
 pam_cardinal_order_improve_legitimacy_modifier: "Orden cardenal: mejorar la legitimidad"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "Por orden de su superior, un cardenal trabaja para mejorar la legitimidad de los gobernantes en la archidiócesis local."
 pam_cardinal_order_undermine_legitimacy_modifier: "Orden cardenal: socavar la legitimidad"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "Por orden de su superior, un cardenal trabaja para socavar la legitimidad de los gobernantes en la archidiócesis local."
 heathen_mandate_modifier: "Los paganos predican su legitimidad"
 heathen_mandate_modifier_desc: "Los hombres santos de un gobernante pagano reclaman las almas de esta tierra. Sus detestables reivindicaciones se apoyan en su falsa fe."
 pam_recently_baptized_at_domicile_modifier: "Bautizo reciente"
 pam_recently_baptized_at_domicile_modifier_desc: "Este personaje se bautizó en el baptisterio del complejo de la catedral de su archidiócesis."
 pam_khachkar_ancestral_county: "Jachkar ancestral"
 pam_khachkar_ancestral_county_custom_desc: "Erigido para [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed] por su [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"
 pam_denied_new_pope_modifier: "Rechazo al nuevo papa"
 pam_denied_new_pope_modifier_desc: "Este personaje se ha negado a reconocer al papa recién elegido."
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "Posición santificada"
 pam_dulia_relic_piety_per_dread_modifier: "Aura de mártir"
 pam_dulia_relic_piety_per_knight_modifier: "Bendición de la Hostia"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Gracia consoladora"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Unción por los santos"
 pam_dulia_relic_learning_per_piety_modifier: "Devoción iluminada"
 pam_dulia_relic_monthly_piety_modifier: "Manantial de gracia"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "Árbitro del credo"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "Este personaje ha resuelto una disputa sobre la interpretación del credo antes de que un concilio ecuménico hubiese iniciado siquiera el debate."
 pam_ecumenical_council_primacy_upheld_modifier: "Defensa de la primacía"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "A este personaje se le ha preguntado en un concilio público ante qué autoridad han de responder las iglesias de la fe y ha zanjado la cuestión desde su posición."
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "Un nuevo intercesor"
 pam_dulia_new_saint_modifier_desc: "Este personaje se ha inspirado con la reciente proclamación de un nuevo santo."
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "Peregrinación a cada sede"
 pam_pilgrim_of_every_holy_site_modifier_desc: "Este personaje ha velado en cada lugar sagrado de su fe."
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "Un vínculo mantenido"
 tenet_harmonious_society_five_bonds_modifier_desc: "Gobernante y súbdito, padre e hijo, esposo y esposa, hermano mayor y hermano menor, amigo y amigo. Este personaje mantiene una de estas relaciones en buen estado."
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "Cadena de ordenación"
 tenet_apostolic_succession_episcopate_modifier_desc: "La fe de este personaje ordena a cada obispo mediante una línea ininterrumpida de obispos anteriores, una fuente histórica de legitimidad respetada."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Aumento por cada [theocratic_vassal|El] (máx. [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "Coros de los fieles"
 tenet_divine_liturgy_choirs_modifier_desc: "En las iglesias de este personaje se cantan las mismas palabras a las mismas horas, sin cambios desde hace generaciones."
 modifier_definition_value_per_held_temple: "\t#weak Aumento por [temple_holding|El] que se tenga (máx. [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "Oficiada como es debido"
 tenet_divine_liturgy_officiant_modifier_desc: "Este personaje se toma la liturgia divina de su fe con una seriedad extrema."
 tenet_divine_liturgy_schola_cantorum_modifier: "Schola cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "Un señor que mantiene una escuela de cantos sacros mantiene un liturgista al que merece la pena escuchar."
 tenet_pentarchy_holy_site_modifier: "Sede patriarcal"
 tenet_pentarchy_holy_site_modifier_desc: "El lugar santo de este condado florece bajo la administración de los fieles."
 tenet_polyamory_new_beloved_modifier: "Radiante con nuevo amor"
 tenet_polyamory_new_beloved_modifier_desc: "Un nuevo amor hace que este personaje esté en las nubes."
 modifier_definition_value_per_chaplain_learning: "\t#weak Aumento por punto de [learning|El] de [court_chaplain|El] (máx. [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "Deuda de castigo"
 tenet_purgatory_sin_penalty_modifier_desc: "Un pecado confesado es un pecado perdonado, pero la deuda de castigo que conlleva no queda por ello cancelada. Lo que no se paga en esta vida se cobra en la siguiente, y los fieles pueden ver perfectamente cuál de las dos ha elegido este personaje."
 tenet_original_sin_sinners_insight_modifier: "Entendimiento del pecador"
 tenet_original_sin_sinners_insight_modifier_desc: "Quien carga el peso del pecado sabe exactamente dónde se esconde en otros."
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "Manchada de sangre"
 pam_holy_weapon_1_artifact_modifier_desc: "Esta [holy_relic|El] ha sido llevada a la victoria contra los enemigos de su [faith|El]. Los devotos han comenzado a fijarse en ella."
 pam_holy_weapon_2_artifact_modifier: "Probada en la guerra"
 pam_holy_weapon_2_artifact_modifier_desc: "Tantas han sido las batallas ganadas contra otras [religions|El] que los fieles ya no lo atribuyen a la suerte."
 pam_holy_weapon_3_artifact_modifier: "Reliquia de renombre"
 pam_holy_weapon_3_artifact_modifier_desc: "Su nombre la precede. Los fervientes se animan al verla."
 pam_holy_weapon_4_artifact_modifier: "Instrumento de la Providencia"
 pam_holy_weapon_4_artifact_modifier_desc: "Se considera que quien lo porta está cumpliendo la voluntad de su dios y quienes cabalgan a su lado luchan con más ahínco por ello."
 # Challenge Head of Faith war aftermath
 pam_house_schismatic_sponsor_modifier: "Patrón cismático"
 pam_house_schismatic_sponsor_modifier_desc: "Esta casa ha respaldado a un [challenger_hof|El] que ha fracasado."
 pam_house_martyred_pontiff_modifier: "Mártir de la casa"
 pam_house_martyred_pontiff_modifier_desc: "Un miembro de esta casa ha muerto después de una guerra por el [head_of_faith|El]."
 pam_deposed_pontiff_modifier: "Cabeza de la fe depuesto"
 pam_deposed_pontiff_modifier_desc: "Este personaje ha sido depuesto como [head_of_faith|El]."
 pam_ch_hof_sacred_bloodguilt_modifier: "Culpa sangrienta"
 pam_ch_hof_sacred_bloodguilt_modifier_desc: "Este personaje ha asesinado a alguien en una guerra por el [head_of_faith|El]."
 pam_ch_hof_penitent_road_modifier: "Voto de penitencia"
 pam_ch_hof_penitent_road_modifier_desc: "Este personaje ha jurado hacer penitencia tras ser juzgado en una guerra por el [head_of_faith|El]."
 pam_blessed_passing_modifier: "Fallecimiento bendecido"
 pam_blessed_passing_modifier_desc: "El predecesor de este personaje entregó la vida en una muerte santificada y su gracia descansa sobre él."
