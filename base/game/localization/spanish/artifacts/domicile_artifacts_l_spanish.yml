 creature_type_lion_desc: "El rey de las bestias, el símbolo del valor, ahora encadenado y sometido. Ronda por su jaula hasta donde le permiten las cadenas."
 creature_type_caracal_desc: "Una gran criatura similar a un gato. Ronda por su recinto, destroza toda decoración que se pone en su jaula."
 creature_type_lynx_desc: "Un felino bajo, fornido y tímido. Se mantiene cerca del suelo con orejas echadas hacia atrás; sus ojos registran frenéticos lo que rodea su punto de observación."
 creature_type_tiger_desc: "Una criatura temible, el rey de las bestias de las montañas. Es fácil provocar su ira y hacerle mostrar los colmillos, para susto de visitantes."
 creature_type_leopard_desc: "Un animal ligero, grácil y también mortal. Es una criatura paciente e inteligente, capaz de dar saltos impresionantes."
 creature_type_bear_desc: "Un oso feroz que avanza pesado en su búsqueda constante de comida. Sus zarpas enormes pueden romper huesos como si fueran ramitas."
 creature_type_elephant_desc: "Un gigante engañosamente manso. Su trompa es extremadamente hábil, para sorpresa y deleite de todos los visitantes."
 creature_type_peacock_desc: "Un ave orgullosa y digna con un canto inconfundible. El mayor atractivo de cualquier jardín."
 creature_type_parrot_desc: "Un espécimen muy vivaz con la habilidad de imitar sonidos humanos: un bonito truco a la hora de entretener a los invitados"
 creature_type_crane_desc: "Un animal noble de alas ligeras. El símbolo de la buena suerte y la juventud eterna."
 creature_type_cockatoo_desc: "Un pájaro de colores de plumaje brillante y vista rápida y aguda."
 creature_type_monkey_desc: "Este simio sociable es un compañero adorable, con comportamiento y expresiones deliciosamente humanas."
 creature_type_lion_reforged_desc: "El rey de las bestias, el símbolo del valor. $creature_history_entry$"
 creature_type_caracal_reforged_desc: "Una criatura feroz. $creature_history_entry$"
