l_spanish:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "Huesos de san Pedro"
 artifact_relic_peter_bones_desc: "Los huesos del apóstol Pedro, príncipe de los apóstoles y primer obispo de Roma."
 artifact_relic_paul_bones_name: "Huesos de san Pablo"
 artifact_relic_paul_bones_desc: "Los huesos del apóstol Pablo, martirizado en Acque Salvie."
 artifact_relic_crown_of_thorns_name: "Corona de espinas"
 artifact_relic_crown_of_thorns_desc: "La corona de espinas apretada sobre la cabeza de Cristo antes de la crucifixión."
 artifact_relic_baptist_arm_name: "Brazo derecho de san Juan Bautista"
 artifact_relic_baptist_arm_desc: "El antebrazo derecho de Juan Bautista; se dice que es la mano misma que bautizó a Cristo en el río Jordán."
 artifact_relic_true_cross_name: "Fragmento de la Vera Cruz"
 artifact_relic_true_cross_desc: "Astilla de la cruz en la que fue crucificado Cristo, engastada en un relicario dorado."
 artifact_relic_bones_of_james_name: "Huesos del santo Santiago"
 artifact_relic_bones_of_james_desc: "Los huesos del apóstol Santiago el Mayor, que atraen a los peregrinos de toda la cristiandad."
 artifact_relic_mark_name: "Cabeza de san Marcos"
 artifact_relic_mark_desc: "La cabeza cortada de Marcos el evangelista, fundador de la Iglesia de Alejandría."
 artifact_relic_lance_antioch_name: "Santa Lanza de Antioquía"
 artifact_relic_lance_antioch_desc: "Punta de lanza de hierro que, según se dice, perforó el costado de Cristo."
 artifact_relic_tabot_name: "Tabot de la Alianza"
 artifact_relic_tabot_desc: "Tablilla de piedra consagrada que representa el Arca de la Alianza. Es venerada como la reliquia etíope más sagrada."
 artifact_relic_nine_saints_name: "Huesos de los nueve santos"
 artifact_relic_nine_saints_desc: "Huesos de los nueve santos: monjes siríacos que huyeron de las controversias calcedonias hacia Axum y fundaron los primeros monasterios de Etiopía, propagando la cristiandad miafisista en las tierras altas."
 artifact_relic_thomas_name: "Reliquias del apóstol Tomás"
 artifact_relic_thomas_desc: "Los huesos y la punta de lanza manchada de sangre del apóstol Tomás, de quien se dice que trajo la fe a Kerala y fue martirizado allí."
 artifact_relic_augustine_pallium_name: "Palio de san Agustín"
 artifact_relic_augustine_pallium_desc: "El palio llevado por Agustín de Canterbury, primer arzobispo y apóstol de Inglaterra."
 artifact_relic_three_magi_name: "Reliquias de los Reyes Magos"
 artifact_relic_three_magi_desc: "Los huesos de los Reyes Magos que siguieron la estrella hasta Belén."
 artifact_relic_becket_name: "Reliquias de santo Tomás Becket"
 artifact_relic_becket_desc: "La vestimenta manchada en sangre y el cráneo de Tomás Becket, martirizado en su propia catedral en 1170 y rápidamente aclamado como el mayor santo de toda la cristiandad en Inglaterra."
 artifact_relic_ursula_name: "Huesos de santa Úrsula"
 artifact_relic_ursula_desc: "Los huesos de Úrsula y sus compañeras mártires vírgenes, desenterrados de los cementerios de Colonia."
 artifact_relic_ignatius_name: "Huesos de san Ignacio"
 artifact_relic_ignatius_desc: "Los huesos de Ignacio, segundo patriarca de Antioquía y discípulo del apóstol Juan, que fue martirizado en Roma durante el reinado de Trajano."
 # Islamic
 artifact_relic_black_stone_name: "Fragmento de la Piedra Negra"
 artifact_relic_black_stone_desc: "Un fragmento negro pulido desprendido de la Piedra Negra de la Kaaba, besado por el mismísimo Profeta y venerado por todos los peregrinos del hach."
 artifact_relic_dhulfiqar_name: "Zulfiqar"
 artifact_relic_dhulfiqar_desc: "La espada de hoja hendida del Profeta, la cual se dice que le regaló a Alí. Adorada en toda la umma como símbolo de su gobierno divino."
 artifact_relic_buraq_footprint_name: "Huella del Buraq"
 artifact_relic_buraq_footprint_desc: "Piedra con la huella que dejó el Buraq cuando el Profeta ascendió a los cielos desde la Piedra Fundacional de Jerusalén."
 artifact_relic_sword_of_ali_name: "Espada de Alí"
 artifact_relic_sword_of_ali_desc: "Espada que se cree que Alí ibn Abi Tálib blandió en las batallas de Badr y Siffín."
 artifact_relic_abu_hanifa_turban_name: "Turbante de Abu Hanífa"
 artifact_relic_abu_hanifa_turban_desc: "El turbante de erudito de Abu Hanífa an-Nu'man, fundador del madhab hanafí: un polo de la jurisprudencia sunita para todo peregrino hanafí."
 artifact_relic_prophet_sandals_name: "Sandalias del Profeta"
 artifact_relic_prophet_sandals_desc: "Sandalias de cuero que se dice que llevó el Profeta. Los artesanos más devotos de toda la umma hicieron un número infinito de copias con la forma de esta na'l."
 # Jewish
 artifact_relic_western_wall_name: "Piedra del Muro de las Lamentaciones"
 artifact_relic_western_wall_desc: "Piedra labrada extraída de la muralla occidental de la plataforma del Segundo Templo. Uno de los pocos restos que quedaron tras la destrucción romana del templo en el año 70 de la era común."
 artifact_relic_tablets_name: "Fragmento de las tablas"
 artifact_relic_tablets_desc: "Fragmento de piedra que, según se cree, se desprendió de las Tablas de la Ley en el monte Sinaí cuando Moisés las arrojó en un arrebato de ira."
 # Buddhist
 artifact_relic_bodhi_leaf_name: "Hoja del árbol bodhi"
 artifact_relic_bodhi_leaf_desc: "Hoja conservada del bodhi en Bodh Gaya, el árbol bajo cuya sombra el Buda obtuvo la iluminación."
 artifact_relic_vajrasana_name: "Fragmento del Vajrasana"
 artifact_relic_vajrasana_desc: "Fragmento pulido del Vajrasana, el trono de diamante bajo el árbol bodhi, donde el Buda se sentó inamovible hasta el momento de la iluminación."
 artifact_relic_dhamek_name: "Sarira de la estupa Dhamek"
 artifact_relic_dhamek_desc: "Sagrada reliquia del Buda procedente de Sarnath, donde enseñó el dharma a sus primeros discípulos."
 artifact_relic_jowo_name: "Jowo Shakyamuni"
 artifact_relic_jowo_desc: "Imagen consagrada del joven Buda traída desde China. Los tibetanos la consideran la más sagrada de las estatuas."
 artifact_relic_sacred_tooth_name: "Diente sagrado de Buda"
 artifact_relic_sacred_tooth_desc: "El colmillo izquierdo de Buda, traído desde Kalinga en el siglo IV. Es un paladio de la realeza cuya custodia legitima a su gobernante por encima de todos los demás."
 # Hindu
 artifact_relic_lingam_name: "Vishvanath Lingam"
 artifact_relic_lingam_desc: "Fragmento sagrado del Shiva-lingam del gran templo de Varanasi, la más sagrada de las ciudades del Ganges."
 artifact_relic_trishul_name: "Trishul de Shiva"
 artifact_relic_trishul_desc: "Tridente de tres puntas que se dice que blandió el propio Shiva. Un símbolo del dominio del dios sobre la creación, la preservación y la destrucción."
 artifact_relic_krishna_stone_name: "Piedra del nacimiento de Krishna"
 artifact_relic_krishna_stone_desc: "Piedra desgastada del janmabhumi de Krishna en Mathura, el lugar exacto que la tradición señala como el lugar de nacimiento de Krishna."
 artifact_relic_rama_footprint_name: "Huella de Rama"
 artifact_relic_rama_footprint_desc: "Piedra con la huella del propio Rama, traída desde Ayodhya, su lugar de nacimiento."
 # Jain
 artifact_relic_palitana_tirtha_name: "Tirtha de Palitana"
 artifact_relic_palitana_tirtha_desc: "Piedra reliquia sagrada de las colinas de Shatrunjaya en Palitana, la tirtha más sagrada en la tradición jainista."
 artifact_relic_parshvanatha_paduka_name: "Charan Paduka de Parsuá"
 artifact_relic_parshvanatha_paduka_desc: "La Charan Paduka, una piedra con la huella plantar del vigésimo tercer tirthankara, Parsuá."
 artifact_relic_shikharji_nishidhi_name: "Nishidhi de los tirthankaras"
 artifact_relic_shikharji_nishidhi_desc: "Piedras conmemorativas nishidhi de las cumbres del monte Sammed-Shikhar, donde veinte de los veinticuatro tirthankaras obtuvieron el moksha, la tirtha más sagrada del jainismo."
 # Zoroastrian
 artifact_relic_atash_bahram_name: "Brasas de Adur Farnbag"
 artifact_relic_atash_bahram_desc: "Brasas ardientes traídas del gran Atash Bahram, el sagrado fuego de los sacerdotes, que aún prende en el templo del fuego."
 # Norse
 artifact_relic_yggdrasil_branch_name: "Rama de Yggdrasil"
 artifact_relic_yggdrasil_branch_desc: "Rama que se dice que cayó del árbol sagrado del templo de Upsala, donde cuelgan aún los cuerpos sacrificados como ofrendas."
 # Slavic
 artifact_relic_perun_idol_name: "Ídolo de Perún"
 artifact_relic_perun_idol_desc: "Ídolo de madera del dios del trueno Perún, señor de los dioses eslavos, erigido por el príncipe Vladimir."
 # Tengri
 artifact_relic_suldetug_name: "Estandarte de Sülde-tug"
 artifact_relic_suldetug_desc: "Estandarte negro de cola de yak, el recipiente del espíritu del dios de la guerra, llevado por los kanes de la estepa."
 # Shinto
 artifact_relic_yata_kagami_name: "Yata no Kagami"
 artifact_relic_yata_kagami_desc: "Espejo de bronce que tradicionalmente se identifica con uno de los tres tesoros imperiales de Japón y se dice que sacó a la diosa del sol Amaterasu de su cueva."
 artifact_relic_shin_no_mihashira_name: "Shin no Mihashira"
 artifact_relic_shin_no_mihashira_desc: "Astilla del Shin no Mihashira, el sagrado pilar central enterrado en el santuario interior del Naikū. Se considera uno de los misterios más ocultos y sagrados de Ise y se renueva en cada reconstrucción del shikinen sengū."
 # Confucian
 artifact_relic_kong_tomb_name: "Estela de la tumba de Kong"
 artifact_relic_kong_tomb_desc: "Tablilla grabada en piedra de la tumba de Confucio en Qufu. Venerada por varias generaciones de la familia Kong."
 artifact_relic_analects_name: "Analectas de Confucio"
 artifact_relic_analects_desc: "Una copia temprana escrita en tiras de bambú de las Analectas, una recopilación de pensamientos del maestro Kong, estudiada a lo largo de varias generaciones de eruditos chinos."
 # Hellenic
 artifact_relic_athena_promachos_name: "Fragmento de Atenea Promacos"
 artifact_relic_athena_promachos_desc: "Fragmento de bronce de la colosal estatua de Atenea que solía vigilar desde la Acrópolis."
 # West African
 artifact_relic_opa_oranmiyan_name: "Opa Oranmiyan"
 artifact_relic_opa_oranmiyan_desc: "La vara de granito del legendario rey Oranmiyán, enviado a la sagrada tierra de Ife, la cuna ancestral de los yoruba."
 artifact_relic_oshe_shango_name: "Oshe Shango"
 artifact_relic_oshe_shango_desc: "La Oshe Shango, un hacha doble creada a imagen de las piedras trueno gemelas del dios-tormenta Shango, portada en alto por sus sacerdotes durante los bailes extáticos."
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "Ídolo sagrado"
 artifact_misc_relic_idol_desc: "Ídolo tallado que es la morada física del dios durante el ritual."
 artifact_misc_relic_stele_name: "Estela ancestral"
 artifact_misc_relic_stele_desc: "Losa de piedra grabada donde se recoge el linaje del sacerdocio, testigo del paso de las generaciones."
 artifact_misc_relic_mask_name: "Máscara ritual"
 artifact_misc_relic_mask_desc: "Máscara ceremonial llevada en los ritos más importantes, receptáculo de la presencia divina."
 artifact_misc_relic_banner_name: "Estandarte sagrado"
 artifact_misc_relic_banner_desc: "Estandarte consagrado que preside todos los grandes ritos en el lugar sagrado. Su tela está impregnada del humo de las ofrendas."
