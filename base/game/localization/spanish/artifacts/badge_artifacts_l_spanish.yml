 maria_conch_description: "Una insignia de peregrinación recibida cuando se peregrina."
 maria_conch_description_protection: "Una insignia de peregrinación protectora recibida cuando se peregrina a [badge_location.GetProvince.GetBaronyNameExplicitly]."
