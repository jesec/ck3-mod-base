l_spanish:
 msg_passive_learned_tenet_abroad_desc: "Al observar [passive_learn_source.Custom('ES_AlAla')] [passive_learn_source.GetTitledFirstName|l] del [rite|El] del [passive_learn_hor.GetRite.GetName|El] en [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], has obtenido [agnostic_knowledge|El] del [core_tenet|El] [passive_learn_tenet.GetBaseName]."
 msg_passive_learned_doctrine_abroad_desc: "Al observar [passive_learn_source.Custom('ES_AlAla')] [passive_learn_source.GetTitledFirstName|l] del [rite|El] del [passive_learn_hor.GetRite.GetName|El] en [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], has obtenido [agnostic_knowledge|El] de la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]."
 msg_passive_learned_rite_abroad_desc: "A través [passive_learn_source.Custom('ES_DelDela')] [passive_learn_source.GetTitledFirstNameNoTooltip|l], has obtenido [agnostic_knowledge|El] de los [core_tenets|El] y [doctrines|El] del [rite|El] del [passive_learn_source.GetRite.GetName|El]."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "En [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], has obtenido [agnostic_knowledge|El] del [core_tenet|El] [passive_learn_tenet.GetBaseName] del [rite|El] del [passive_learn_rite.GetName|El]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "En [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier], has obtenido [agnostic_knowledge|El] de la [doctrine|El] [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )] del [rite|El] del [passive_learn_rite.GetName|El]."
 rite_travel_events.1000.t: "Un [passive_learn_rite.GetAdherentNameNoTooltip] de paso"
 rite_travel_events.1000.desc: "Anochece y un [passive_learn_rite.GetAdherentName] de paso se nos une junto a la hoguera.\n\nA medida que avanza la noche, compartimos [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')] e historias. Me habla de las sagradas escrituras de su gente, de cómo se vive y se practica el [passive_learn_rite.GetNameNoTooltip|l]. Hay convicción en sus palabras."
 rite_travel_events.1000.a: "Qué profundo."
 rite_travel_events.1000.b: "Debería unirse a mí."
 rite_travel_events.1000.c: "No prestaré mi oído a tales herejías."
 rite_travel_events.2000.t: "Revelación"
 rite_travel_events.2000.desc: "Mientras viajaba por el/la [location.GetTerrain.GetNameNoTooltip] de [location.GetName], encontré a una multitud.\n\nUn[passive_learn_source.Custom('ES_XA')] predicador[passive_learn_source.Custom('ES_XA')] hablaba de algo llamado «[passive_learn_tenet.GetBaseName]». Nunca había oído hablar de ello, y sin embargo, sentí atracción por sus palabras.\n\nQuería pasar de largo, pero acabé escuchando.\n\nEsto... esto es la verdad."
 rite_travel_events.2000.a: "Esto es lo que [ROOT.Char.GetFaith.HighGodName] espera de mí."
 rite_travel_events.2000.b: "¡No caeré en el paganismo!"
