 #Food and drink glosses
 ABALONE_GLOSS: "Un marisco valorado de carne firme y sustanciosa."
 SEA_CUCUMBER_GLOSS: "Una criatura marina blanda que se considera un manjar en la alta cocina china."
 SWALLOW_NEST_GLOSS: "El nido de un pájaro poco común disuelto en una sopa de lujo."
 ENTREMETS_GLOSS: "Un dulce elaborado o platillo sorpresa servido entre platos."
 MOCHI_GLOSS: "Un pastel chicloso de arroz glutinoso machacado."
 DURIAN_GLOSS: "Una gran fruta tropical famosa por su fuerte olor y carne cremosa y sabrosa."
 AQUA_VITAE_GLOSS: "Aguardientes fuertes que se valoran como bebida medicinal."
 TRIBUTE_CHILLED_TEA_GLOSS: "Té refinado enfriado con hielo o nieve, enviado como regalo cortesano."
 EMPEROR_TEA_GLOSS: "Las mejores hojas de té imperial, reservadas para la corte."
 BAIJIU_GLOSS: "Un aguardiente chino fuerte, destilado del cereal."
 HANAKUSA_GLOSS: "Una infusión herbal, mezcla de flores y hojas de Japón."
 PEARL_POWDER_GLOSS: "Perlas molidas usadas como un tónico costoso."
 CHRYSANTHEMUM_BEER_GLOSS: "Una cerveza ligera sazonada con crisantemo."
 SHARBAT_GLOSS: "Una bebida de fruta dulce, a menudo enfriada y con especias."
 SAMBUSA_GLOSS: "Un hojaldre frito relleno de carne o verduras especiadas."
 PAKHALA_GLOSS: "Un plato refrescante de agua de arroz fermentada del este de la India."
 PILAU_GLOSS: "Arroz sazonado cocinado con especias y carne o verduras."
 PASTILLA_GLOSS: "Un pastel del Magreb: carne especiada envuelta en una pasta fina."
 BOTUO_GLOSS: "Un bollo grueso de trigo o sopa de fideos de China."
 SPHOUNGATA_GLOSS: "Una tortilla al estilo bizantino de huevos batidos."
 TARICHOS_GLOSS: "Pescado salado y secado, un básico bizantino."
 BING_GLOSS: "Un pan ácimo o tortita a la parrilla de China."
 MANTOU_GLOSS: "Un bollo blando de trigo al vapor de China."
 ZOSUI_GLOSS: "Gachas de arroz de Japón, cocidas en caldo."
 KIMCHI_GLOSS: "Verduras de Corea fermentadas con sal y especias."
 BUBUR_GLOSS: "Gachas de arroz del archipiélago malayo."
 #Oldest record of the word: Codex diplomaticus Caietanus, 997 - https://en.wikipedia.org/wiki/History_of_pizza
 PIZZA_GLOSS: "Un pan redondo y plano del sur de Italia, que se horneaba mucho antes de que llegaran los tomates de América. En virtud de un contrato firmado en Gaeta en el año 997, un arrendatario le debía al obispo doce hogazas en Navidad y doce en Pascua."
 #Vaddaradhane, c. 920 - https://en.wikipedia.org/wiki/Idli
 IDLI_GLOSS: "Una pequeña tortita de harina de lentejas negras del sur de la India. Ya aparece mencionada en un libro de relatos canarés del año 920, con el nombre de «iddalige»."
 #Etienne Boileau, Livre des metiers - https://en.wikipedia.org/wiki/Oublie
 OUBLIE_GLOSS: "Un fino barquillo horneado entre planchas de hierro calientes. París tenía un gremio de oblateros cerca del año 1260, que anunciaban sus mercancías por las calles de noche."
 BLIN_GLOSS: "Una tortita fina que se come caliente, recién salida de la plancha, y se prepara en grandes cantidades para el festín antes de la Cuaresma."
 #https://en.wikipedia.org/wiki/Obwarzanek_krakowski
 OBWARZANEK_GLOSS: "Un anillo de masa hervida y luego horneada, que se vende trenzado. Los cracovianos lo llaman «obwarzanki», y la corte real los compraba ya en 1394."
 #Pogača, from Latin focacia - https://en.wikipedia.org/wiki/Poga%C4%8Da
 POGACA_GLOSS: "Un pan ácimo, fino y redondo horneado en las cenizas del hogar. El nombre viene del latín «focacia», el pan del hogar."
 FUL_GLOSS: "Las habas se cocinan a fuego lento y son la comida diaria de los pueblos egipcios."
 INJERA_GLOSS: "Un pan plano, ancho y esponjoso hecho de teff fermentado, que sirve de plato y cuchara a la vez."
 #Narezushi, the fermented form of sushi before the Edo period - https://en.wikipedia.org/wiki/Narezushi
 NAREZUSHI_GLOSS: "Pescado envuelto en arroz salado, al que se deja fermentar durante meses. Luego, el arroz se retira y solo se come el pescado."
 AKARA_GLOSS: "Judías carillas molidas y fritas en aceite de palma."
 FURA_GLOSS: "Masa de mijo cocinada al vapor, machacada hasta hacer bolitas y mezclada con leche agria."
 TSAMPA_GLOSS: "Harina de cebada tostada y amasada con mantequilla, que se come con los dedos."
 #William of Rubruck, Itinerarium (1253-1255), on the dried curds he calls grut - https://en.wikipedia.org/wiki/Aaruul
 AARUUL_GLOSS: "Cuajada que se deja secar al sol y se lleva en cada viaje. Rubruquis la descubrió en un campamento mongol en 1253."
