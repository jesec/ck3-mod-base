 #Food and drink glosses
 ABALONE_GLOSS: "Un marisco valorado de carne firme y sustanciosa."
 SEA_CUCUMBER_GLOSS: "Una criatura marina blanda que se considera un manjar en la alta cocina china."
 SWALLOW_NEST_GLOSS: "El nido de un pájaro poco común disuelto en una sopa de lujo."
 ENTREMETS_GLOSS: "Un dulce elaborado o platillo sorpresa servido entre platos."
 MOCHI_GLOSS: "Un pastel chicloso de arroz glutinoso machacado."
 DURIAN_GLOSS: "Una gran fruta tropical famosa por su fuerte olor y carne cremosa y sabrosa."
 AQUA_VITAE_GLOSS: "Aguardientes fuertes que se valoran como bebida medicinal."
 TRIBUTE_CHILLED_TEA_GLOSS: "Té refinado enfriado con hielo o nieve, enviado como regalo cortesano."
 EMPEROR_TEA_GLOSS: "Las mejores hojas de té imperial, reservadas para la corte."
 BAIJIU_GLOSS: "Un aguardiente chino fuerte, destilado del cereal."
 HANAKUSA_GLOSS: "Una infusión herbal, mezcla de flores y hojas de Japón."
 PEARL_POWDER_GLOSS: "Perlas molidas usadas como un tónico costoso."
 CHRYSANTHEMUM_BEER_GLOSS: "Una cerveza ligera sazonada con crisantemo."
 SHARBAT_GLOSS: "Una bebida de fruta dulce, a menudo enfriada y con especias."
 SAMBUSA_GLOSS: "Un hojaldre frito relleno de carne o verduras especiadas."
 PAKHALA_GLOSS: "Un plato refrescante de agua de arroz fermentada del este de la India."
 PILAU_GLOSS: "Arroz sazonado cocinado con especias y carne o verduras."
 PASTILLA_GLOSS: "Un pastel del Magreb: carne especiada envuelta en una pasta fina."
 BOTUO_GLOSS: "Un bollo grueso de trigo o sopa de fideos de China."
 SPHOUNGATA_GLOSS: "Una tortilla al estilo bizantino de huevos batidos."
 TARICHOS_GLOSS: "Pescado salado y secado, un básico bizantino."
 BING_GLOSS: "Un pan ácimo o tortita a la parrilla de China."
 MANTOU_GLOSS: "Un bollo blando de trigo al vapor de China."
 ZOSUI_GLOSS: "Gachas de arroz de Japón, cocidas en caldo."
 KIMCHI_GLOSS: "Verduras de Corea fermentadas con sal y especias."
 BUBUR_GLOSS: "Gachas de arroz del archipiélago malayo."
