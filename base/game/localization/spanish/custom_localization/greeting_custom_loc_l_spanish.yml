 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "Las historias de tus fechorías son famosas de Irlanda a Catay."
 greeting_supplimentary.negative.greek: "Tu baja calaña es el tema de obras de teatro griegas."
 greeting_supplimentary.negative.insult.1: "Que los humores se te pudran en el cuerpo."
 greeting_supplimentary.negative.insult.2: "Que tu vida sea corta y miserable."
 greeting_supplimentary.negative.insult.3: "Que la sabiduría te esquive."
 greeting_supplimentary.negative.insult_muslim.1: "Maldito sea tu séptimo abuelo."
 greeting_supplimentary.negative.insult_muslim.2: "Así te cosan dentro del vientre de un camello muerto."
 greeting_supplimentary.negative.insult_muslim.3: "Así Alá destruya tu casa."
 greeting_supplimentary.negative.insult_muslim.4: "Hijo de un perro sarnoso."
 greeting_supplimentary.negative.insult_muslim.5: "Así riñan los chacales por vuestros huesos sin enterrar."
 greeting_supplimentary.negative.insult_muslim.6: "Así se llenen de arena vuestros pozos, y vuestras tiendas, de escorpiones."
 greeting_supplimentary.negative.insult_christian.1: "Así olviden los santos vuestra causa."
 greeting_supplimentary.negative.insult_christian.2: "Sea borrado vuestro nombre de toda oración."
 greeting_supplimentary.negative.insult_norse.1: "Escupan sobre vuestra sombra vuestros antepasados."
 greeting_supplimentary.negative.insult_norse.2: "Vuestro valor es más fino que el hielo en invierno."
 greeting_supplimentary.negative.insult_byzantine.1: "Huyan de vuestro hedor hasta las ratas de Constantinopla."
 greeting_supplimentary.negative.insult.4: "Queden yermos vuestros campos y séquense vuestros pozos."
 greeting_supplimentary.negative.insult.unreliable_swine: "Cerdo desleal."
 greeting_supplimentary.negative.insult.oathbreaker: "Sois [Select_CString(second.IsFemale, 'una mentirosa', 'un mentiroso' )] y un[second.Custom('ES_XA')] rompejuramentos."
 greeting_supplimentary.negative.insult_jewish.1: "Sea tachado vuestro nombre del libro de la vida."
 greeting_supplimentary.negative.insult_zoroastrian.1: "Apague la oscuridad el fuego que afirmáis cuidar."
 greeting_supplimentary.negative.insult_hindu.1: "Os habéis alejado del camino de la rectitud, y más os alejaré yo."
 greeting_supplimentary.negative.insult_christian.3: "Se abra el infierno para recibiros."
 greeting_supplimentary.negative.insult_norse.3: "Gran festín se darán los cuervos con vuestros muertos."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('PositiveSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "Bendiciones para ti y para tu casa."
 greeting_supplimentary.positive.flattery.2: "Tu sabiduría y clemencia son legendarias."
 greeting_supplimentary.positive.flattery.3: "La paz sea contigo."
 greeting_supplimentary.positive.flattery.4: "Que vivas en armonía y satisfacción."
 greeting_supplimentary.positive.flattery.5: "Tu implacabilidad es envidiable."
 greeting_supplimentary.positive.flattery.6: "Tus grandes apetitos son célebres en todo el mundo."
 greeting_supplimentary.positive.flattery.7: "Vuestro renombre os precede en cada frontera."
 greeting_supplimentary.positive.flattery.8: "Dure vuestro linaje un millar de años."
 greeting_supplimentary.positive.flattery.9: "Dios mantenga la fuerza en el brazo de vuestra espada."
 greeting_supplimentary.positive.flattery.10: "Paz y abundancia sobre vuestra casa."
 greeting_supplimentary.positive.flattery.11: "Sonría la fortuna a vuestros estandartes."
 greeting_supplimentary.positive.flattery_chinese.1: "Las bendiciones del cielo sobre vos."
 greeting_supplimentary.positive.flattery_chinese.2: "Prosperen siempre vuestras tierras."
 greeting_supplimentary.positive.flattery_chinese.3: "La fuerza y el vigor bendigan vuestro reinado."
 greeting_supplimentary.positive.flattery_norse.1: "Los dioses os proporcionen buenos vientos y ganado gordo."
 greeting_supplimentary.positive.flattery_byzantine.1: "Reluzca la gloria de la ciudad sobre vuestra casa."
 greeting_supplimentary.positive.flattery_jewish.1: "Bendiga el Santísimo vuestra casa con la paz."
 greeting_supplimentary.positive.flattery.12: "Vuestra sabiduría es un faro para quienes buscan consejo."
 greeting_supplimentary.positive.flattery.13: "Os tenga el cielo en su favor."
