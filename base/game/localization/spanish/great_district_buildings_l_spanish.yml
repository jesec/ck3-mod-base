 building_type_republic_statute_hall_01: "Salón de estatutos"
 building_type_republic_statute_hall_01_desc: "La cámara donde se guardan las leyes del pueblo, y se copian y se leen en voz alta cada año, para que ningún magistrado pueda alegar que no tenía conocimiento sobre ellas, y para que ningún ciudadano pueda decir que no estaba avisado."
