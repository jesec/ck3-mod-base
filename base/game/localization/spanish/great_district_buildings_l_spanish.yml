 building_type_republic_civic_hospital_01: "Hospital cívico"
 building_type_republic_civic_hospital_01_desc: "Pabellones donados por la comuna, atendidos por personal pagado por esta, donde los pobres enfermos son aceptados en lugar de dejar que se mueran en las calles. Un ciudadano sano es un ciudadano productivo."
