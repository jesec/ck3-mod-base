 building_type_republic_clock_tower_01: "Torre del reloj cívica"
 building_type_republic_clock_tower_01_desc: "Una maravilla mecánica que da las horas sobre los tejados. Es el orgullo de la comuna cuando llegan visitantes y somete la jornada laboral de los mercaderes a la autoridad de la ciudad, en lugar de a la autoridad del sol."
