 building_type_republic_loggia_01: "Logia comunal"
 building_type_republic_loggia_01_desc: "Una galería porticada que rodea la plaza. Los mercaderes cierran acuerdos a la sombra, los notarios montan sus mesas entre las columnas y toda la ciudad se refugia allí cuando llueve."
