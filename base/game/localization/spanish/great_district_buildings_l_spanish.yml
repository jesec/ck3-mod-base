 building_type_republic_council_chamber_01: "Gran sala del consejo"
 building_type_republic_council_chamber_01_desc: "Cada ciudadano con una posición dispone de un banco en esta sala, donde el consejo discute sobre impuestos, aprueba las cuentas anuales y reparte los cargos para las oficinas de la ciudad."
