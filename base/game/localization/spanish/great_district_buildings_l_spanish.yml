 building_type_republic_debt_office_01: "Oficina de deuda pública"
 building_type_republic_debt_office_01_desc: "La ciudad toma prestado de sus propios ciudadanos y les paga intereses por el privilegio. Las participaciones cambian de manos como cualquier otro producto, y el procedimiento mantiene la solvencia del tesoro y la puntualidad de los pagos a las compañías contratadas."
