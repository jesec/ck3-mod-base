 building_type_republic_weigh_house_01: "Casa de mediciones pública"
 building_type_republic_weigh_house_01_desc: "Aquí es donde se guardan bajo llave las básculas y sistemas de medición sellados de la ciudad, supervisados por funcionarios jurados. Cada fardo que entra se pesa a cambio de una comisión, y ningún mercader puede cuestionar el resultado."
