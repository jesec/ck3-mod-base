 petition_head_of_faith_decision_effects_massive_piety: "Gasta [EmptyScope.ScriptValue('massive_piety_value')|V0] de [piety|lE] [piety_i] cuando prepares tu petición. Te será devuelta si te retiras, cancelas el [travel|El] o la petición es abandonada. La #EMP perderás#! si expones tus argumentos y no logras persuadir a [petition_recipient.GetShortUINameNoTooltip]."
