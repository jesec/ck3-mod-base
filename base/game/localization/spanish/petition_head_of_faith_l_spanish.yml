 # Invalidation event
 petition_head_of_faith.0601.t: "Petición abandonada"
 petition_head_of_faith.0601.desc.no_head: "Para cuando estoy en condiciones de exponer mi caso, ya no hay ningún pastor espiritual adecuado que atienda mi petición."
 petition_head_of_faith.0601.desc.head_dead: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] ha muerto antes de poder escuchar mi petición."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] está en prisión y no puede recibir peticiones formales."
 petition_head_of_faith.0601.desc.head_changed: "Han cambiado al cabeza de mi fe y ya no se puede presentar mi petición [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstName|l]."
 petition_head_of_faith.0601.desc.at_war: "No puedo hacer una petición formal mientras esté en guerra con [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l]."
 petition_head_of_faith.0601.desc.repentance_resolved: "Ya no hay ninguna excomunión que levantar."
 petition_head_of_faith.0601.desc.repentance_too_soon: "Mi arrepentimiento no sería escuchado tan poco tiempo después de mi última amonestación."
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] ha muerto antes de poder escuchar la petición."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] ya no es de mi misma fe, por lo que no se puede exigir una excomunión formal."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] ya no es monarca ni gobernante suprem[petition_target.Custom('ES_OA')], por lo que queda fuera del ámbito de esta petición formal."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] ya ha sido excomulgad[petition_target.Custom('ES_OA')]."
 petition_head_of_faith.0601.desc.fallback: "Mi petición ya no puede seguir adelante, y el viaje queda en nada."
 petition_head_of_faith.0601.desc.refund.piety: "Me devuelven la piadosa ofrenda que había entregado para esta petición."
 petition_head_of_faith.0601.desc.refund.none: "Por lo menos, nada había cambiado de manos aún."
 petition_head_of_faith.0601.a: "Que así sea."
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "Petición: arrepentimiento"
 petition_head_of_faith.1000.t.excommunication: "Petición: excomunión"
 petition_head_of_faith.1000.desc.court_low_grandeur: "El palacio, antaño grandioso, yace en ruinas a mi alrededor. Rezo para que esto no sea un reflejo de la pobreza espiritual [recipient.Custom('ES_DelDela')] [recipient.GetFaith.ReligiousHeadName|l].\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "Entrar en este palacio, famoso por sus grandiosos salones, es una verdadera lección de humildad. Rezo para que sus dorados celestiales sean un reflejo de la justicia y la riqueza espiritual que alberga en su interior.\n\n"
 petition_head_of_faith.1000.desc.intro: "Aquí se sienta quien representa a Dios en la tierra. "
 petition_head_of_faith.1000.desc.recipient_sinful: "Aunque es bien conocido su carácter [petition_hof_gravest_sin.GetName(recipient)|l], por algún ardid diabólico ha logrado llegar hasta el trono de san Pedro."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Seguro que su carácter [petition_hof_gravest_virtue.GetName(recipient)|l] guía su criterio."
 petition_head_of_faith.1000.desc.health_noble: "\n\nSu deteriorada salud es, sin duda, fruto de una vida de noble esfuerzo."
 petition_head_of_faith.1000.desc.health_excess: "\n\nSu deteriorada salud es, sin duda, el resultado de una vida marcada por destructivos excesos."
 petition_head_of_faith.1000.desc.address: "\n\nPresento mi solicitud ante [recipient.Custom('ES_ElElla')]: «Sant[recipient.Custom('ES_OA')] [recipient.GetMotherFather], "
 petition_head_of_faith.1000.desc.repentance: "vengo con humildad a suplicar que se me libere de la amonestación impuesta a mi alma y a rogar que se me readmita en la comunión de los fieles»."
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstName|l] ha cometido delitos contra Dios. Yo me limito a transmitir humildemente el mensaje; por descontado, os corresponde a vos juzgar su alma inmortal»."
 petition_head_of_faith.1000.a.argue: "Expondré mis argumentos."
 petition_head_of_faith.1000.a.argue_tt: "Intenta persuadir a [recipient.GetShortUINameNoTooltip] durante la audiencia"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n«Os hemos escuchado. Exponed los detalles de vuestra petición y la recibiremos con benevolencia»,"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n«Vuestra petición queda presentada. La juzgaremos según exigen el canon y la Santa Iglesia»,"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n«Es fácil pronunciar palabras amables. Acogemos vuestra petición con el escepticismo que exige el Señor»,"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n«Es muy atrevido por vuestra parte venir aquí. Sopesad bien vuestras próximas palabras»,"
 petition_head_of_faith.1000.desc.conclusion: "manifiesta [recipient.GetSheHe], aguardando con expectación."
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "Petición: arrepentimiento [actor.Custom('ES_DelDela')] [actor.GetTitledFirstNameNoTooltip|l]"
 petition_head_of_faith.1310.desc.intro: "«Sant[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetMotherFather], se me ha excomulgado, privado de los sacramentos y separado de los fieles. Os lo ruego, levantad esta amonestación que pesa sobre mi alma y devolvedme a la comunión», implora [actor.Custom('ES_ElLa')] [actor.GetTitledFirstName|l] arrodillándose.\n\n«Manifestad abiertamente vuestra contrición ante Dios», replico yo."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n«Siempre me habéis tratado con amor al prójimo, sant[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetMotherFather]. No pido ningún favor terrenal, solo que Dios y la Santa Iglesia vean la verdad de mi arrepentimiento."
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n«Me presento ante Dios como cualquier penitente y solo pido justicia según el derecho canónico»."
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n«No me toméis por [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], que emplea palabras bonitas para desviaros del camino. Juro ante [ROOT.Char.GetFaith.HighGodName] y su representante en la Tierra que penitente soy»."
 petition_head_of_faith.1310.serpent.christian: "la sierpe del jardín"
 petition_head_of_faith.1310.serpent.generic: "una sierpe"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n«Nos enfrentamos en el pasado. No os pido que habléis bien de mí en asuntos terrenales, sino que reconozcáis mi penitencia y no pongáis en peligro mi alma»."
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n«Nos ha llegado la noticia de que tenéis un carácter [petition_gravest_sin.GetName(actor)|l]. Las palabras amables no bastan para redimir un alma mancillada. ¿Qué reparación ofrecéis?»."
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n«Pocos vicios se aferran a vuestro nombre. Quizá la excomunión haya obrado de manera beneficiosa. Veremos si vuestra alma está a la altura de vuestro porte»."
 petition_head_of_faith.1310.a: "«Levantaos. Se os readmite en la comunión de los fieles»."
 petition_head_of_faith.1310.b: "«La amonestación sigue en pie. Volved cuando vuestro arrepentimiento sea evidente»."
 petition_head_of_faith.1320.t: "Petición: excomunión [petition_target.Custom('ES_DelDela')] [petition_target.GetTitledFirstNameNoTooltip|l]"
 petition_head_of_faith.1320.desc.intro: "«Sant[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetMotherFather], [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstName|l] ha cometido delitos contra Dios. Si no se erradica esta podredumbre, todas nuestras almas estarán en peligro», expone [actor.Custom('ES_ElLa')] [actor.GetTitledFirstName|l].\n\n«No empleamos la excomunión como arma privada de los príncipes. Dejad clara vuestra acusación ante Dios», replico yo."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n«Siempre me habéis tratado con justicia, sant[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetMotherFather]. No pido ningún favor terrenal, solo que Dios y la Santa Iglesia vean la verdad de las transgresiones [petition_target.Custom('ES_DelDela')] [petition_target.GetTitledFirstNameNoTooltip|l]."
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n«Ante Dios, presento esta denuncia como simple creyente de nuestro Señor Jesucristo, y solo pido lo que requiere la justicia de la Santa Iglesia."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n«No me veáis como la sierpe del jardín que emplea palabras bonitas para zanjar una disputa privada, juro ante [ROOT.Char.GetFaith.HighGodName] y su representante en la Tierra que estos cargos son justos."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n«Nos hemos enfrentado en el mundo, pero juzgad el alma [petition_target.Custom('ES_DelDela')] [petition_target.GetTitledFirstNameNoTooltip|l] tal y como exige el canon."
 petition_head_of_faith.1320.desc.target_sinful: "La podredumbre de los pecados [petition_target.Custom('ES_DelDela')] [petition_target.GetTitledFirstNameNoTooltip|l] proviene de su carácter [petition_gravest_sin.GetName(petition_target)|l]»,"
 petition_head_of_faith.1320.desc.finish: "concluye [actor.Custom('ES_ElLa')] [actor.GetTitledFirstName|l]."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstNameNoTooltip|l] oculta bien su maldad, mas tengo fe en que, si pedís consejo al Señor, su pecado quedará claro»."
 petition_head_of_faith.1320.a: "«[petition_target.Custom('ES_LoLa')|U] expulso de la comunión de los fieles»."
 petition_head_of_faith.1320.b: "«Vuestros argumentos no convencen, no se impondrá amonestación alguna sobre [petition_target.Custom('ES_ElElla')]»."
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "Se dicta la excomunión"
 petition_head_of_faith.2020.desc: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] se levanta para dispensar la justicia del Señor:\n\n«[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] queda excomulgad[petition_target.Custom('ES_OA')], separad[petition_target.Custom('ES_OA')] de la comunidad de los fieles, su alma condenada al peligro hasta que su arrepentimiento sea sincero»."
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName] ha hablado a través de Su sierv[recipient.Custom('ES_OA')]."
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "La petición es rechazada"
 petition_head_of_faith.2030.desc.intro: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] se levanta para dispensar la justicia del Señor:\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "«Los pecados que nombráis no son lo bastante graves como para merecer tan terrible sentencia. [petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] no será excomulgad[petition_target.Custom('ES_OA')]»."
 petition_head_of_faith.2030.desc.finesse: "«No expulsamos a los fieles por la moneda de un príncipe. Lo que es del César no puede comprar juicios de [recipient.GetFaith.HighGodName]»."
 petition_head_of_faith.2030.desc.learning_duel: "«Atraparíais a un[petition_target.Custom('ES_XA')] [petition_target.GetTitleAsNameNoTooltip|l] en distorsiones deliberadas del derecho canónico? [petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstName|l] no será excomulgad[petition_target.Custom('ES_OA')] por… la fuerza de vuestra erudición»."
 petition_head_of_faith.2030.desc.fallback: "«¡Mucho presumís! No veo razón por la que [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstName|l] deba ser excomulgad[petition_target.Custom('ES_OA')]»."
 petition_head_of_faith.2030.a: "Supongo que [recipient.GetFaith.HighGodName] ha hablado a través de Su sierv[recipient.Custom('ES_OA')]."
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "La discusión"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "«¿Podríais demostrar los delitos cometidos por [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] según las Escrituras y los cánones de la Iglesia? ¿Se ha estado postrando ante imágenes talladas?»."
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "«¿Presentaríais cargos contra [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] al pie de la cruz de piedra?»."
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "«¿Acaso [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] no merece la misericordia de la Madre de Dios? ¿Venís vos aquí con vestiduras sin mácula?»."
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "«¿Queréis que expulsemos [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l] de la sagrada liturgia al calor de una rencilla privada y no por evidencia de un pecado grave?»."
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "«¿Excluiríais del altar de Cristo [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l]? ¿Le negaríais alimentarse del alma de nuestro Señor? ¿Acaso [petition_target.GetSheHe] no debería volver a beber de Su sangre?»."
 petition_head_of_faith.2000.desc.atmosphere_communion: "¿Consideraríais oportuno expulsar [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l] de la comunión de los fieles?»."
 petition_head_of_faith.2000.desc.atmosphere_confession: "«¿Queréis que actuemos contra [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] por lo que se ha dicho bajo secreto de confesión?»."
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "«¿Queréis que expulsemos [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l] antes de probar con medios más amables para apartar[petition_target.Custom('ES_LoLa')] del pecado?»."
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "«¿Pretendéis invocar la autoridad de los apóstoles para que condenemos [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l] en la tierra y en el cielo?»."
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "«Nos distraéis de nuestro estudio de los cánones para condenar [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l]. ¿Se basa vuestra retórica en los escritos de los Padres de la Iglesia y en las Escrituras?»."
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "«¿Queréis que actuemos contra [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] por la sangre derramada en tiempo sagrado o por actos de violencia en tierras de la Iglesia? ¿Ha infringido la Paz y Tregua de Dios?»."
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "«¿Es este el lugar más adecuado para juzgar vuestra queja contra [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l]? ¿No sería mejor que tomaseis la cruz y luchaseis contra los enemigos de Cristo?»."
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "«¿Acudís a nosotros para que expulsemos a [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l] mientras nosotros, los cinco tronos patriarcales, intentamos mantener unida una cristiandad díscola? ¿Creéis que toda la [Glossary( 'ecúmene', 'OIKOUMENE_GLOSS' )] respaldaría vuestra acusación?»."
 petition_head_of_faith.2000.desc.atmosphere_dulia: "«¿Ha ofendido [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] la veneración de los mártires con abierto desprecio?»."
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "«Queréis que expulsemos [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l]. Dadnos alguna prueba de que ha vivido en la desobediencia y la pereza, pues la ociosidad es enemiga del alma»."
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "«¿Queréis que condenemos [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l] como si [petition_target.GetSheHe] fuera [petition_target.Custom('ES_ElLa')] únic[petition_target.Custom('ES_OA')] hereder[petition_target.Custom('ES_OA')] de la culpa de Adán? Toda alma llega al mundo herida por la Caída, pero la Iglesia no expulsa a nadie salvo a aquellos que se deleiten en su inclinaciones pecaminosas»."
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "«Venís clamando justicia contra [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] con vuestras mejores galas mientras nuestros frailes andan entre los pobres sin más ropa que la que llevan puesta. ¿Un mendicante no aconsejaría más bien paciencia, o tan grande es el pecado?»."
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "«¿Le negaríais los sacramentos [petition_target.Custom('ES_AlAla')] [petition_target.GetTitledFirstNameNoTooltip|l]? ¿Pondríais en peligro la parte que le corresponde de las riquezas de la vida eterna con Cristo en el cielo? Es en la tierra donde buscamos los votos de pobreza»."
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "«¿Queréis que expulsemos a un[petition_target.Custom('ES_XA')] soldado de Cristo basándonos en la palabra de su enemigo?»."
 petition_head_of_faith.2000.desc.atmosphere_fallback: "«¿Cómo queréis que la Santa Iglesia resuelva vuestra disputa con [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l]?»."
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n«Debéis saber que no utilizamos la excomunión como arma privada de príncipes. Nosotros decidiremos qué justicia debe imponerse. ¡Exponed vuestro caso ante Dios!», exige [recipient.Custom('ES_ElLa')] sant[recipient.Custom('ES_OA')] [recipient.GetMotherFather]."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nAunque las palabras [recipient.Custom('ES_DelDela')] [recipient.GetFaith.GetReligiousHeadTitle.GetName|l] parezcan imparciales, es evidente que la noticia de la naturaleza pecaminosa [petition_target.Custom('ES_DelDela')] [petition_target.GetTitledFirstNameNoTooltip|l] ya ha llegado a estos salones sagrados. No me queda más que confirmar sus transgresiones»."
 petition_head_of_faith.2000.desc.target_clean: "\n\nParece que [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l] sabe que [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] no tiene mácula de pecado. Sin pruebas de maldad que presentar ante el tribunal, tendré que encontrar otro camino hacia la justicia que busco»."
 OIKOUMENE_GLOSS: "Del término griego «oikoumene», que significa «el mundo habitado». En el lenguaje del Imperio romano de Oriente, #bold ecúmene#! se refería al mundo civilizado: el imperio y el orden cristiano más amplio que supervisaba su Iglesia."
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "Proclama ante Dios que [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l] es de carácter [petition_gravest_sin.GetName(petition_target)|l]."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Nombra los pecados [petition_target.Custom('ES_DelDela')] [petition_target.GetTitledFirstNameNoTooltip|l] ante Dios."
 petition_head_of_faith.2000.b.finesse: "«La Iglesia tiene muchas necesidades. Dejad que me ocupe de algunas de ellas»."
 petition_head_of_faith.2000.c.learning_duel: "Citaré pasajes concretos de las Escrituras para tender una trampa [petition_target.Custom('ES_AlAla')] malvad[petition_target.Custom('ES_OA')] [petition_target.GetTitleAsNameNoTooltip|l]."
 petition_head_of_faith.2000.d.hook: "Recuerda [recipient.Custom('ES_AlAla')] [recipient.GetFaith.ReligiousHeadName|l] ciertos… asuntos privados."
 petition_head_of_faith.2000.e.withdraw: "… quizá esto sea algo entre [petition_target.GetFaith.HighGodName] y [petition_target.Custom('ES_ElLa')] [petition_target.GetTitledFirstNameNoTooltip|l]."
 petition_head_of_faith.5000.e.withdraw: "… quizá aún no estoy list[ROOT.Char.Custom('ES_OA')] para esto."
 petition_head_of_faith_hook_committed_tt: "Vas a gastar un [hook|El] para encargarte de esto"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.Custom('ES_ElLa')|U] [petition_target.GetTitledFirstNameNoTooltip|l] es más virtuos[petition_target.Custom('ES_OA')] que pecaminos[petition_target.Custom('ES_OA')]"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] ha sido persuadid[recipient.Custom('ES_OA')]"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] ha sido convencid[recipient.Custom('ES_OA')]"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] aún no está convencid[recipient.Custom('ES_OA')]"
 petition_head_of_faith_argument_affronted: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] está ofendid[recipient.Custom('ES_OA')]"
 petition_head_of_faith_argument_dismissed: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] rechaza tu argumento"
 petition_head_of_faith_affronted_opinion: "Se ofendió por soborno"
 petition_head_of_faith_affronted_opinion_desc: "Este personaje se sintió ofendido por un peticionario que se ofreció a comprar un juicio religioso con oro."
 petition_head_of_faith_dismissed_debate_opinion: "Impasible ante los argumentos"
 petition_head_of_faith_dismissed_debate_opinion_desc: "Este personaje rechazó a un peticionario cuyas interpretaciones erróneas del canon no le convencieron."
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "Buscar absolución"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Viaja para ver a tu [head_of_faith|El] y ruégale que te levante la [excommunication|El]."
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Viajarás a [recipient.GetCapitalLocation.GetName] y pedirás formalmente [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstName|l] que te levante la [excommunication|El]"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "La confesión"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "«Venís en busca de la absolución. ¿Os habéis postrado ante imágenes talladas sabiendo que solo las Escrituras y la penitencia os purificarán?»."
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "«Espero que vengáis a suplicar el perdón a los pies de la cruz de piedra tallada»."
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "«La Madre de Dios está llena de misericordia, pero no podemos levantar vuestra amonestación solo por Ella»."
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "«Buscáis nuevamente la divina liturgia. Reflexionad sobre lo que os ha mantenido lejos del altar y de los fieles»."
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "«Se os ha negado el altar de Cristo y el alimento de Su carne y Su sangre»."
 petition_head_of_faith.5000.desc.atmosphere_communion: "«Se os ha apartado de la comunión de los fieles»."
 petition_head_of_faith.5000.desc.atmosphere_confession: "«El sacramento de la confesión exige un relato completo y veraz»."
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "«La excomunión es el remedio de la Iglesia. Un don que se os concede para que podáis enmendar vuestra vida y acortar vuestro purgatorio»."
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "«Tenemos las llaves de san Pedro. Esta autoridad puede liberaros si en verdad os arrepentís»."
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "«Buscáis la reconciliación. Cumplid la ley según los capítulos y distinciones del \"Decretum\"»."
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "«¿Vuestro pecado ha sido la ruptura de la Paz y Tregua de Dios? ¿Habéis derramado sangre en tiempo sagrado?»."
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "«Si os habéis hecho pasar por cristiano y, aun así, habéis perjudicado a la cristiandad, estáis infringiendo claramente la ley»."
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "«Los cinco tronos patriarcales observan. No desmereceremos la absolución mientras toda la [Glossary( 'ecúmene', 'OIKOUMENE_GLOSS' )] nos contempla»."
 petition_head_of_faith.5000.desc.atmosphere_dulia: "«Los mártires se ganaron su lugar en el cielo con su sangre»."
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "«La ociosidad es enemiga del alma. Arrodillaos no solo con contrición, sino también con disposición hacia la penitencia, la oración y el esfuerzo»."
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "«Nacisteis en pecado, como todos nosotros. ¿Por qué añadir nuevas maldades a esa herencia?»."
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "«Nuestros frailes andan entre los pobres con nada más que hábitos raídos»."
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "«Buscamos los votos de pobreza en la tierra. Ni la riqueza ni el rango pueden recomprar los sacramentos»."
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "«Portabais la cruz en el pecho y, sin embargo, ofendisteis a la cristiandad»."
 petition_head_of_faith.5000.desc.atmosphere_fallback: "«No os ganaréis la absolución solo con una larga peregrinación»."
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n«Debéis saber que no retiramos una amonestación por aparentar o por adulación. ¡Mostrad claramente vuestra contrición ante Dios!», exige [recipient.Custom('ES_ElLa')] sant[recipient.Custom('ES_OA')] [recipient.GetMotherFather]."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nSeguro que ya han llegado a estos salones sagrados noticias de mi carácter [petition_gravest_sin.GetName(actor)|l]."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nSin necesidad de sacar a la luz grandes maldades, el tribunal comprenderá sin género de duda que la excomunión ha tenido un efecto beneficioso."
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "Confesaré mis pecados, sin guardarme nada."
 petition_head_of_faith.5000.b.canon_law: "Argüiré que la ley de la Iglesia exige mi reconciliación."
 petition_head_of_faith.5000.c.weep: "Me pongo en manos de la misericordia del tribunal."
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] se conmueve"
 petition_head_of_faith_repentance_duel_failure: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] se muestra impasible"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] acepta tu confesión"
 petition_head_of_faith_repentance_confess_duel_failure: "Tu palabras no convencen [recipient.Custom('ES_AlAla')] [recipient.GetFaith.ReligiousHeadName|l]"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.Custom('ES_AlAla')|U] [recipient.GetFaith.ReligiousHeadName|l] le conmueve tu humildad"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.Custom('ES_AlAla')|U] [recipient.GetFaith.ReligiousHeadName|l] no le impresiona tu demostración"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "Absolución concedida"
 petition_head_of_faith.5020.desc: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] se levanta para dispensar la justicia del Señor:\n\n«Levantaos. Se os readmite en la comunión de los fieles. Se levanta la expulsión que pesaba sobre vuestra alma»."
 petition_head_of_faith.5020.a: "Demos gracias a [recipient.GetFaith.HighGodName]."
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "Sin absolución"
 petition_head_of_faith.5030.desc.intro: "[recipient.Custom('ES_ElLa')|U] [recipient.GetFaith.ReligiousHeadName|l] se levanta para dispensar la justicia del Señor:\n\n"
 petition_head_of_faith.5030.desc.confess: "«Vuestra confesión suena falsa."
 petition_head_of_faith.5030.desc.canon_law: "«Vuestra escasa erudición es un reflejo de vuestra alma."
 petition_head_of_faith.5030.desc.weep: "«Las lágrimas no son penitencia."
 petition_head_of_faith.5030.desc.fallback: "«Dais muchas cosas por sentadas."
 petition_head_of_faith.5030.desc.conclusion: " La amonestación sigue en pie»."
 petition_head_of_faith.5030.a: "Supongo que [recipient.GetFaith.HighGodName] ha hablado a través de Su sierv[recipient.Custom('ES_OA')]."
