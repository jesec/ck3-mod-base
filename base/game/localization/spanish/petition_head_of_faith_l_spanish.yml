 petition_head_of_faith_decision_receptive_hostile: "#N Es muy probable#! que [petition_recipient.GetShortUIName] rechace esta petición #weak (en función de su [opinion|El] sobre ti y de tus relaciones; se le puede influir durante la audiencia)#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak Los [traits|El] [Concept('sinful', 'pecaminosos')|E] y [Concept('virtuous', 'virtuosos')|E] de tu objetivo, a juicio de [petition_recipient.GetFaith.GetName], afectan a las opciones de tus argumentos en la audiencia.#!"
 petition_head_of_faith_decision_hook_available: "Usa tu [hook|El] sobre [petition_recipient.Custom('ES_ElLa')] [petition_recipient.GetTitledFirstName|l] para prescindir del coste en [piety|El]"
