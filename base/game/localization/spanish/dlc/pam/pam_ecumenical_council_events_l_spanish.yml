 ecumenical_council_events.0101.t: "Las palabras aprendidas"
 ecumenical_council_events.0101.desc: "Los eruditos intercambian citas por toda la sala y cada versículo agudiza la discusión.\n\n«Mi [lead_conservative.GetFaith.ReligiousText|U] lo deja claro», insiste [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «El [ec_current_topic.GetName( activity.GetHost.GetRite )|l] no ha de cambiar».\n\n«Leed el párrafo que he citado en su totalidad», responde [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]. «¡Descubriréis que prácticamente insiste en este cambio!»."
 ecumenical_council_events.0101.support: "Señalar el contexto ausente de su párrafo."
 ecumenical_council_events.0101.support_duel: "Superar su argumentación con un mayor conocimiento."
 ecumenical_council_events.0101.support_duel.success: "Aceptan el cambio nacido del texto"
 ecumenical_council_events.0101.support_duel.success_halved: "Algunos aceptan el cambio nacido del texto"
 ecumenical_council_events.0101.support_duel.failure: "Siguen diciendo que el texto está en contra"
 ecumenical_council_events.0101.oppose: "Apoyar [lead_conservative.Custom('ES_AlAla')] [lead_conservative.GetTitledFirstNameNoTooltip|l]: el texto debe mantenerse intacto."
 ecumenical_council_events.0101.oppose_duel: "Impugnar que el cambio nazca del párrafo."
 ecumenical_council_events.0101.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
