 ecumenical_council_events.0106.t: "La lealtad debida"
 ecumenical_council_events.0106.desc: "Mis vasallos y yo nos reunimos en una de las cámaras.\n\n«Incluso aquí, vuestr[ROOT.Char.Custom('ES_OA')] soberan[ROOT.Char.Custom('ES_OA')] es vuestr[ROOT.Char.Custom('ES_OA')] señor[ROOT.Char.Custom('ES_XA')]», advierte [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l] a [ROOT.Char.Custom('ES_LoLa')]s demás. «Si nuestr[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsName|l] no habla en favor de esta innovación herética, entonces vuestras voces también deben callar».\n\n«¡Nuestr[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] nos indica nuestro lugar en otras circunstancias, ¡pero aquí no!», replica [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0106.desc_innovator: "Mis vasallos y yo nos reunimos en una de las cámaras.\n\n«Un[ROOT.Char.Custom('ES_XA')] soberan[ROOT.Char.Custom('ES_OA')] merece una respuesta», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «Por desgracia, creo que este tema le supera. ¡Solo [lead_conservative.GetFaith.HighGodName] dirige nuestros corazones y [lead_conservative.GetFaith.HighGodName] traza la línea que debemos defender inequívocamente!».\n\n«Ah, pero los deseos de nuestr[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] no se oponen a los [ROOT.Char.GetFaith.HighGodNamePossessive]!», replica [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]. «¡Meditad sobre vuestro juramento y escuchad su sabiduría!»."
 ecumenical_council_events.0106.support: "«Como [ROOT.Char.GetTitleAsNameNoTooltip|l], soy representante de [ROOT.Char.GetFaith.HighGodName]!»."
 ecumenical_council_events.0106.support_duel: "Exige el servicio leal que juraron estos vasallos."
 ecumenical_council_events.0106.support_duel.success: "Te obedecerán"
 ecumenical_council_events.0106.support_duel.success_halved: "Algunos te obedecerán"
 ecumenical_council_events.0106.support_duel.failure: "Tus vasallos reservan su lealtad para [lead_conservative.GetFaith.HighGodName]"
 ecumenical_council_events.0106.oppose: "Apoyar [lead_conservative.Custom('ES_AlAla')] [lead_conservative.GetTitledFirstName|l]: esto va más allá de un soberan[ROOT.Char.Custom('ES_OA')]."
 ecumenical_council_events.0106.oppose_duel: "Impugnar que los deseos de un señor no se oponen a los de Dios."
 ecumenical_council_events.0106.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0106.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0106.oppose_duel.failure: "Su respuesta se mantiene"
