 ecumenical_council_events.0115.t: "Susurros y bazas"
 ecumenical_council_events.0115.desc: "Me duele admitirlo, pero no [Select_CString(ROOT.Char.IsFemale, 'todas las preladas', 'todos los clérigos' )] se han ganado sus vestiduras con nobleza. Incluso entre este cuerpo augusto, soy agudamente consciente de quienes prefieren las sombras a la luz pura de las Escrituras. No me lleva mucho toparme con murmullos en la oscuridad.\n\n«Toda alma aquí tiene hambre de… algo. Nosotr[lead_innovator.Custom('ES_OA')]s, [lead_innovator.Custom('ES_LoLa')]s prudentes, debemos preguntarnos quién pagará el precio de tal hambre», deja caer [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l] en oídos predispuestos. «Ideología atrevida, reformas apasionadas…, nada puede ser más costoso…».\n\nOtra víbora, [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l], se alza para rebatirle: «¿Creéis que #EMP vosotr[lead_innovator.Custom('ES_OA')]s#! pagaréis el precio del caos? En los tiempos de desorden que se avecinan, ¿cuándo seremos libres de jugar como deseemos…?»."
 ecumenical_council_events.0115.support: "El desorden tiene sus ventajas."
 ecumenical_council_events.0115.support_duel: "Hablar sobre oportunidades a aquellos lo bastante listos como para escuchar."
 ecumenical_council_events.0115.support_duel.success: "Su codicia [Select_CString(lead_conservative.IsFemale, 'las', 'los' )] impele a escucharte"
 ecumenical_council_events.0115.support_duel.success_halved: "Algunos buscan el desorden"
 ecumenical_council_events.0115.support_duel.failure: "Demuestran estar ciegos ante la oportunidad"
 ecumenical_council_events.0115.oppose: "Una breve comida y después los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] pasaremos hambre para siempre."
 ecumenical_council_events.0115.oppose_duel: "Buscad la verdad en las Escrituras o estaréis perdidos."
 ecumenical_council_events.0115.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0115.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0115.oppose_duel.failure: "Están cegados por deseos oscuros"
