 ecumenical_council_events.0102.t: "Plegarias enfrentadas"
 ecumenical_council_events.0102.desc: "Aquellos asistentes con mayor devoción se han dividido en dos grupos de rezo sobre la propuesta.\n\n[lead_conservative.Custom('ES_ElLa')|U] [lead_innovator.GetTitledFirstName|l] llama a [lead_innovator.GetFaith.HighGodName] para afirmar que sus revelaciones son un reflejo de Su voluntad. El grupo [lead_conservative.Custom('ES_DelDela')] [lead_conservative.GetTitledFirstName|l] responde a esto de inmediato suplicando a [lead_innovator.GetFaith.random_GoodGodNames] la conservación de las tradiciones que tanto tiempo han servido a la Iglesia."
 ecumenical_council_events.0102.support: "Unirse a las plegarias a favor del cambio."
 ecumenical_council_events.0102.support_duel: "Predicar el cambio hasta que su círculo ceda."
 ecumenical_council_events.0102.support_duel.success: "Tu sermón convence a los clérigos que se resistían"
 ecumenical_council_events.0102.support_duel.success_halved: "Tu sermón convence a algunos de los clérigos que se resistían"
 ecumenical_council_events.0102.support_duel.failure: "Sus plegarias se mantienen; tu sermón fracasa"
 ecumenical_council_events.0102.oppose: "Unirse a las plegarias a favor de la antigua tradición."
 ecumenical_council_events.0102.oppose_duel: "Predicar por la antigua tradición hasta que su círculo ceda."
 ecumenical_council_events.0102.oppose_duel.success: "Tu sermón convence a los clérigos reformistas"
