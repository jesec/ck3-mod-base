 ecumenical_council_events.0081.desc.conservative_passed: "A pesar de la defensa de nuestra tradición, los reformadores ganaron la votación. Se adopta el cambio a pesar de nuestras dudas."
 ecumenical_council_events.0081.desc.conservative_failed: "Los que defendimos la tradición hemos aguantado. La propuesta queda rechazada y nuestro rito se mantiene."
 ecumenical_council_events.0081.desc.neutral: "El concilio da su veredicto y el asunto queda resuelto."
 ecumenical_council_events.0081.a: "Decidido está pues."
