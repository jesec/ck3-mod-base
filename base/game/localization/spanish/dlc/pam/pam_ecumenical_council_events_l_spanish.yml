 # ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "Canosos gruñones"
 ecumenical_council_events.0111.desc: "[Select_CString(And(lead_conservative.IsFemale, lead_innovator.IsFemale), 'Ancianas canosas', 'Ancianos canosos')] les siguen dando vueltas a las discusiones.\n\n«Hemos visto concilios empezar y terminar y en todos se han cometido errores. En lugar de corregir esas tergiversaciones, ¡parece que queramos aprobar más!», refunfuña [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l].\n\n«¡[lead_conservative.Custom('RegionalFarmAnimal')|U] fósil! ¡Ya dijiste lo mismo la última vez y seguirás refunfuñando igual cuando estés en la tumba!», vocifera a su vez [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0111.support: "¡Este cambio arreglará los errores antiguos!"
 ecumenical_council_events.0111.support_duel: "Repite los argumentos en favor de los oídos ancianos."
 ecumenical_council_events.0111.support_duel.success: "Acaban aceptando a regañadientes"
 ecumenical_council_events.0111.support_duel.success_halved: "Algunos aceptan la rectificación"
 ecumenical_council_events.0111.support_duel.failure: "Siguen gritando «¡Tergiversación!»"
 ecumenical_council_events.0111.oppose: "Apoyar [lead_conservative.Custom('ES_AlAla')] [lead_conservative.GetTitledFirstNameNoTooltip|l]: basta de necedades."
 ecumenical_council_events.0111.oppose_duel: "¡Haz polvo intelectual a [Select_CString(ROOT.Char.IsFemale, 'las viejas soñadoras', 'los viejos soñadores' )]!"
 ecumenical_council_events.0111.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0111.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0111.oppose_duel.failure: "Los innovadores se mantienen limpios"
 ecumenical_council_events.0111.conservatives_custom: "[ec_conservatives|E] ancianos (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0111.conservatives_custom_halved: "[ec_conservatives|E] ancianos (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0111.innovators_custom: "[ec_innovators|E] ancianos (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0111.innovators_custom_halved: "[ec_innovators|E] ancianos (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0112.t: "Enfermedad en el señorío"
 ecumenical_council_events.0112.desc: "«¡Los muertos se apilan en mis tierras! Al principio me pregunté la causa del castigo [lead_conservative.GetFaith.HighGodNamePossessive], ¡pero ahora todo está claro! La humanidad sufre porque nuestro mundo rechaza esta mutación del derecho canónico», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l].\n\n«¿Tal es la ceguera que causa vuestro odio hacia este concilio que sois incapaz de ver nuestra salvación?», replica [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]. «¡Nuestra reforma aplacará la ira de [lead_innovator.GetFaith.HighGodName]!»."
 ecumenical_council_events.0112.support: "Sí. [ROOT.Char.GetFaith.HighGodName|U] exige que la Iglesia cambie."
 ecumenical_council_events.0112.support_duel: "¡Usar esa lógica inquebrantable contra [lead_conservative.GetSheHe] puede funcionar!"
 ecumenical_council_events.0112.support_duel.success: "Muchos ven el fin de la ira divina"
 ecumenical_council_events.0112.support_duel.success_halved: "Algunos intentarán aplacar a [lead_innovator.GetFaith.HighGodName]"
 ecumenical_council_events.0112.support_duel.failure: "Destruir el derecho canónico es un riesgo demasiado elevado"
 ecumenical_council_events.0112.oppose: "¡Y enfurecer a [ROOT.Char.GetFaith.HighGodName] lo es más!"
 ecumenical_council_events.0112.oppose_duel: "Advertirles de que esto puede destruir el derecho canónico."
 ecumenical_council_events.0112.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0112.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0112.oppose_duel.failure: "Siguen teniendo esperanzas en el cambio"
 ecumenical_council_events.0112.conservatives_custom: "[ec_conservatives|E] frente a una [epidemic|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0112.conservatives_custom_halved: "[ec_conservatives|E] frente a una [epidemic|El] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0112.innovators_custom: "[ec_innovators|E] frente a una [epidemic|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0112.innovators_custom_halved: "[ec_innovators|E] frente a una [epidemic|El] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0113.t: "Fe en armas"
 ecumenical_council_events.0113.desc: "Aquell[ROOT.Char.Custom('ES_OA')]s cuyos señoríos sufren bajo las armas malvadas de otras fes se mantienen aparte de la asamblea en simpatía mutua.\n\n«Los enemigos de la fe queman mis campos», proclama [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l], «¿y mientras reñimos por sueños absurdos? ¿Como si una espada no nos atravesase el corazón?».\n\n«Un credo fracturado es un escudo roto», responde [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]. «¡Fijemos el canon y luchemos como un solo pueblo renovado!»."
 ecumenical_council_events.0113.support: "Estaría bien volver a saborear la esperanza."
 ecumenical_council_events.0113.support_duel: "¡Reparemos la Iglesia, nuestro escudo!"
 ecumenical_council_events.0113.support_duel.success: "Todos aceptan y lucharán como uno solo"
 ecumenical_council_events.0113.support_duel.success_halved: "Se convence a algunos para realizar la reforma"
 ecumenical_council_events.0113.support_duel.failure: "No recuerdan lo que es la esperanza"
 ecumenical_council_events.0113.oppose: "¿No hay asuntos más urgentes que esta estupidez?"
 ecumenical_council_events.0113.oppose_duel: "Adviérteles contra esta temeridad."
 ecumenical_council_events.0113.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0113.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0113.oppose_duel.failure: "Mantienen una esperanza vana"
 ecumenical_council_events.0113.conservatives_custom: "[ec_conservatives|E] [Concept('besieged', 'asediados')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0113.conservatives_custom_halved: "[ec_conservatives|E] [Concept('besieged', 'asediados')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0113.innovators_custom: "[ec_innovators|E] [Concept('besieged', 'asediados')|E] (#V [feature_innovators_size]#!)"
