 ecumenical_council_events.0107.t: "Su primer concilio"
 ecumenical_council_events.0107.desc: "Un grupo de [Select_CString(ROOT.Char.IsFemale, 'preladas', 'clérigos' )] jóvenes parlotean, claramente emocionad[ROOT.Char.Custom('ES_OA')]s por lo que para much[ROOT.Char.Custom('ES_OA')]s de ell[ROOT.Char.Custom('ES_OA')]s es su primer concilio.\n\n«Un movimiento está surgiendo aquí: ¿no sentís el toque de [lead_innovator.GetFaith.HouseholdGodName]? ¡Dejemos una señal en la Iglesia, con una audacia olvidada hace tiempo!», dice [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstNameNoTooltip|l].\n\n«¡Imbéciles desdeñables! ¡Debemos inclinarnos ante los padres de la Iglesia y rechazar tan repugnantes innovaciones!», insiste [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]."
 ecumenical_council_events.0107.support: "¡Una mañana para la fe!"
 ecumenical_council_events.0107.support_duel: "Rebatir esta cobardía conservadora."
 ecumenical_council_events.0107.support_duel.success: "Sus ojos se iluminan con la ilusión"
 ecumenical_council_events.0107.support_duel.success_halved: "Algunos juran su apoyo"
 ecumenical_council_events.0107.support_duel.failure: "Siguen desdeñosos"
 ecumenical_council_events.0107.oppose: "[lead_conservative.Custom('ES_ElLa')|U] [lead_conservative.GetTitledFirstNameNoTooltip|l] dice la verdad."
 ecumenical_council_events.0107.oppose_duel: "¡Condenemos los peligros de la audacia!"
 ecumenical_council_events.0107.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0107.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0107.oppose_duel.failure: "Desprecian tu cobardía"
 ecumenical_council_events.0107.conservatives_custom: "[ec_conservatives|E] jóvenes (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0107.conservatives_custom_halved: "[ec_conservatives|E] jóvenes (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0107.innovators_custom: "[ec_innovators|E] jóvenes (#V [feature_innovators_size]#!)"
