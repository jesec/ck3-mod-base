 ecumenical_council_events.0104.t: "Clérigos de mi sangre"
 ecumenical_council_events.0104.desc: "[Select_CString(ROOT.Char.IsFemale, 'Las preladas', 'Los clérigos' )] entre mi gente discuten sobre si la casa [ROOT.Char.GetHouse.GetName] debe usar su influencia. [lead_conservative.Custom('ES_ElLa')|U] [lead_conservative.GetTitledFirstName|l] afirma: «Nuestra casa no debe dividirse en público, ¡y yo no me pondré de parte [host.Custom('ES_DelDela')] [host.GetTitledFirstName|l]!».\n\n[lead_innovator.Custom('ES_ElLa')|U] [lead_innovator.GetTitledFirstName|l] hace un gesto cómico a espaldas [lead_conservative.Custom('ES_DelDela')] [lead_conservative.GetTitledFirstNameNoTooltip|l] para dar a entender que no toda mi casa está empeñada en contra de la innovación."
 ecumenical_council_events.0104.support: "Instar a la casa [ROOT.Char.GetHouse.GetNameNoTooltip] para que se pronuncie a favor."
 ecumenical_council_events.0104.support_duel: "Ganarse a aquellos en contra de la innovación."
 ecumenical_council_events.0104.support_duel.success: "Tu casa se pronunciará a favor"
 ecumenical_council_events.0104.support_duel.success_halved: "Algunos se pondrán a favor"
 ecumenical_council_events.0104.support_duel.failure: "Tu casa está dividida"
 ecumenical_council_events.0104.oppose: "Ponerse de lado de [lead_conservative.GetFirstNameNoTooltip] contra la innovación."
 ecumenical_council_events.0104.oppose_duel: "Advertir a [lead_innovator.GetFirstNameNoTooltip]: la casa no debe dividirse."
 ecumenical_council_events.0104.oppose_duel.success: "Tus familiares deciden rechazar el cambio"
 ecumenical_council_events.0104.oppose_duel.success_halved: "Algunos familiares tuyos rechazan el cambio"
 ecumenical_council_events.0104.oppose_duel.failure: "[lead_innovator.Custom('ES_ElLa')|U] [lead_innovator.GetTitledFirstNameNoTooltip|l] se mantiene en sus trece"
 ecumenical_council_events.0104.conservatives_custom: "[ec_conservatives|E] de tu [dynasty|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0104.conservatives_custom_halved: "[ec_conservatives|E] de tu [dynasty|El] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0104.innovators_custom: "[ec_innovators|E] de tu [dynasty|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0104.innovators_custom_halved: "[ec_innovators|E] de tu [dynasty|El] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0105.t: "Susceptibilidad [ROOT.Char.GetCulture.GetNameNoTooltip]"
 ecumenical_council_events.0105.desc: "Los sonidos familiares del [ROOT.Char.GetCulture.GetLanguage.GetName] destacan entre las muchas lenguas que se hablan aquí. Es, por supuesto, [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l], que insiste a los nuestros.\n\n«¡Los [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] no tenemos apetito por semejantes innovaciones!», clama.\n\n«¿Preferís acaso que se nos culpe de la inacción de la Iglesia?», le disputa [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0105.support: "No habláis por todos, [lead_conservative.GetFirstNameNoTooltip]."
 ecumenical_council_events.0105.support_duel: "Nosotros, los [lead_conservative.GetCulture.GetCollectiveNounNoTooltip] tenemos una larga historia de innovación."
 ecumenical_council_events.0105.support_duel.success: "Todos los presentes acuerdan pronunciarse a favor"
 ecumenical_council_events.0105.support_duel.success_halved: "Algunos aceptan pronunciarse a favor"
 ecumenical_council_events.0105.support_duel.failure: "Siguen rechazando la innovación"
 ecumenical_council_events.0105.oppose: "¡Apoyemos la tradición [ROOT.Char.GetCulture.GetNameNoTooltip]!"
 ecumenical_council_events.0105.oppose_duel: "Argumentar a favor de la tradición."
