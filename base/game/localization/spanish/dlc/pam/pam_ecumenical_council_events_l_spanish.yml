 ecumenical_council_events.0118.t: "Tradiciones de una sede lejana"
 ecumenical_council_events.0118.desc: "[lead_conservative.Custom('ES_ElLa')|U] [lead_conservative.GetTitledFirstName|l], figura prominente del concilio de ascendencia [lead_conservative.GetCulture.GetNameNoTooltip], se posiciona con un grupo de [Select_CString(lead_conservative.IsFemale, 'otras preladas', 'otros clérigos' )] que han viajado desde lejos a favor de conservar las tradiciones de la Iglesia.\n\n«La comunidad [lead_conservative.GetFaith.GetAdjective] es tan extensa como el amor de [lead_conservative.GetFaith.HighGodName]», dice. «Nuestra esperanza es que esta peregrinación no haya sido para observar [lead_innovator.Custom('ES_AlAla')] [lead_innovator.GetTitledFirstName|l] predicar en favor de demoler la obra de los padres de la Iglesia»."
 ecumenical_council_events.0118.support: "Las peregrinaciones más duras procuran las mayores revelaciones."
 ecumenical_council_events.0118.support_duel: "Convéncelos de la visión de [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0118.support_duel.success: "Aceptan que las tradiciones de los padres están seguras"
 ecumenical_council_events.0118.support_duel.success_halved: "Algunos aceptan que las tradiciones de los padres están seguras"
 ecumenical_council_events.0118.support_duel.failure: "Siguen temiendo la predicación [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstName|l]"
 ecumenical_council_events.0118.oppose: "«Respetemos vuestro sacrificio»."
 ecumenical_council_events.0118.oppose_duel: "«Predicaré contra [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstNameNoTooltip|l]»."
 ecumenical_council_events.0118.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
