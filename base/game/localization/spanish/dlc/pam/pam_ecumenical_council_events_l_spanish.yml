 ecumenical_council_events.0120.t: "Nombres en la crónica"
 ecumenical_council_events.0120.desc: "[Select_CString(lead_conservative.IsFemale, 'Algunas de las invitadas', 'Algunos de los invitados' )] más célebres se mantienen lejos de la asamblea; reflexionan sobre cómo quedarán sus reputaciones cuando todo quede por escrito.\n\n«Mi apellido se encuentra en toda crónica escrita recientemente. ¿Qué necesidad tengo de que se vincule a un decreto que puede ser ridiculizado por toda la eternidad?», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l].\n\n«Se recordará a quienes solucionaron la disputa, no a quienes no se mancharon la manos. Y así es como se me recordará», responde [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0120.support: "«¿Acaso no sois líderes de la Iglesia?»."
 ecumenical_council_events.0120.support_duel: "«¡No seréis [Select_CString(ROOT.Char.IsFemale, 'la única', 'el único' )]!»."
 ecumenical_council_events.0120.support_duel.success: "[lead_innovator.GetHerHim|U]s escéptic[lead_innovator.Custom('ES_OA')]s se entregan a la historia"
 ecumenical_council_events.0120.support_duel.success_halved: "Algunos se entregan a la historia"
 ecumenical_council_events.0120.support_duel.failure: "Se mantienen evasivos"
 ecumenical_council_events.0120.oppose: "No uniré mi nombre al de un hazmerreír."
 ecumenical_council_events.0120.oppose_duel: "«Los necios solventan disputan… imponiendo patrañas»."
 ecumenical_council_events.0120.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0120.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0120.oppose_duel.failure: "No caen en tu insulto"
 ecumenical_council_events.0120.conservatives_custom: "[ec_conservatives|E] de mucho [prestige|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0120.conservatives_custom_halved: "[ec_conservatives|E] de mucho [prestige|El] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0120.innovators_custom: "[ec_innovators|E] de mucho [prestige|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0120.innovators_custom_halved: "[ec_innovators|E] de mucho [prestige|El] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0122.t: "Mientras aún pueda"
 ecumenical_council_events.0122.desc: "Algun[ROOT.Char.Custom('ES_OA')]s [Select_CString(ROOT.Char.IsFemale, 'preladas', 'clérigos' )] delicad[ROOT.Char.Custom('ES_OA')]s de salud se apartan de la aglomeración de la sala para buscar el calor del sol.\n\n«Me pregunto si escucharé el cierre del concilio antes de encontrarme con [lead_conservative.GetFaith.HighGodName]…, antes de que vaya al hedor de [lead_conservative.GetFaith.NegativeAfterLife] y sus horrores más recientes», resuella [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l].\n\n«Poco os queda que perder, [lead_conservative.GetFirstNameNoTooltip], pero asumo que aún os queda alguna esperanza que ofrecer al mundo, ¿quizás se os bendiga para ir a [lead_innovator.GetFaith.PositiveAfterLife]?», responde [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0122.support: "«¡Por [ROOT.Char.GetFaith.HighGodName], los últimos momentos son muy valiosos!»."
 ecumenical_council_events.0122.support_duel: "No veré a [ROOT.Char.GetFaith.HighGodName] habiendo guardado silencio."
 ecumenical_council_events.0122.support_duel.success: "Se les inspira para realizar una obra final reformadora"
 ecumenical_council_events.0122.support_duel.success_halved: "Se inspira a algunos para realizar una obra final reformadora"
 ecumenical_council_events.0122.support_duel.failure: "Se consumirán amargad[lead_conservative.Custom('ES_OA')]s"
 ecumenical_council_events.0122.oppose: "Nuestras últimas fuerzas pertenecen a [ROOT.Char.GetFaith.HighGodName] y a Su Palabra."
 ecumenical_council_events.0122.oppose_duel: "«¡No mancillemos nuestras vidas con esto!»."
 ecumenical_council_events.0122.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0122.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0122.oppose_duel.failure: "Se mantendrán en la condenación"
 ecumenical_council_events.0122.conservatives_custom: "[ec_conservatives|E] con mala [health|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0122.conservatives_custom_halved: "[ec_conservatives|E] con mala [health|El] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0122.innovators_custom: "[ec_innovators|E] con mala [health|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0122.innovators_custom_halved: "[ec_innovators|E] con mala [health|El] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0123.t: "Si llegara pronto la guerra"
 ecumenical_council_events.0123.desc: "Encuentro a mis aliad[ROOT.Char.Custom('ES_OA')]s riñendo, casi como las huestes chocan entre ellas en el campo de batalla. Es un mal presagio.\n\n«¡Voto a tal, solo tenemos un interés en común! No me pidáis que vote como si fuera una mascota, un perro atado a la correa [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitledFirstName|l]!», salta [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l].\n\n«¿Qué debo pensar de un[lead_conservative.Custom('ES_XA')] aliad[lead_conservative.Custom('ES_OA')] que es incapaz de expresar con palabras sencillas aquello a lo que se ha comprometido con [ROOT.Char.GetPrimaryTitle.GetNameNoTier] en su vida mortal?», replica [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0123.support: "«Debo reclamar todas las lealtades, sí»."
 ecumenical_council_events.0123.support_duel: "Advierte que lo consideras una afrenta."
 ecumenical_council_events.0123.support_duel.success: "Tus aliados estarán de tu lado"
 ecumenical_council_events.0123.support_duel.success_halved: "Algunos aliados estarán de tu lado"
 ecumenical_council_events.0123.support_duel.failure: "Es imposible coaccionar a tus aliados"
 ecumenical_council_events.0123.oppose: "«Aquí solo tenéis lealtad a las Escrituras»."
 ecumenical_council_events.0123.oppose_duel: "Pediré la lealtad… de aliad[lead_innovator.Custom('ES_OA')]s como [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.oppose_duel.success: "Tus aliados ceden"
 ecumenical_council_events.0123.oppose_duel.success_halved: "Algunos aliados ceden"
 ecumenical_council_events.0123.oppose_duel.failure: "Tus aliados no se unirán a la oposición"
 ecumenical_council_events.0123.conservatives_custom: "[ec_conservatives|E] [Concept('allied', 'aliados')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0123.conservatives_custom_halved: "[ec_conservatives|E] [Concept('allied', 'aliados')|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0123.innovators_custom: "[ec_innovators|E] [Concept('allied', 'aliados')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0123.innovators_custom_halved: "[ec_innovators|E] [Concept('allied', 'aliados')|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0126.t: "Entre rivales"
 ecumenical_council_events.0126.desc: "Cuesta lo suyo encontrar [rival.Custom('ES_AlAla')] [rival.GetTitledFirstName|l], mi [ROOT.Char.Custom2('RelationToMe', rival)], entre la asamblea.\n\n«No me cabe duda de que sabéis por qué estoy aquí», gruñe. «Dad vuestra opinión, elegid un bando… Solo ansío votar en vuestra contra»."
 ecumenical_council_events.0126.a: "Votad conforme a vuestra conciencia, no vuestro odio."
 ecumenical_council_events.0126.b: "Seguid con vuestro desprecio. No me pondré a vuestra altura."
 ecumenical_council_events.0126.c: "El concilio [rival.GetHerHim] ha distraído…"
 ecumenical_council_events.0126.c.tt: "La [scheme|lE] tendrá #P mayor#! [success_chance|lE]"
 ecumenical_council_events.0126.conservatives_custom: "[ec_conservatives|E] entre tus [rivals|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0126.innovators_custom: "[ec_innovators|E] entre tus [rivals|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0129.t: "Miedo en la sala"
 ecumenical_council_events.0129.desc: "Aquellos que ya se estremecen ante mí observan el debate con ojos trémulos como cucharones de nata. [lead_conservative.Custom('ES_ElLa')|U] más humilde de ell[lead_conservative.Custom('ES_OA')]s, [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l], ni me mira a la cara:\n\n«Expresad vuestra opinión», susurra [lead_conservative.GetSheHe]. «Ya sé lo que pasará si me niego»."
 ecumenical_council_events.0129.support: "La crueldad jamás me ha fallado."
 ecumenical_council_events.0129.support_duel: "Me aseguraré de que el resto también lo sepa."
 ecumenical_council_events.0129.support_duel.success: "El miedo les hace doblegarse ante ti"
 ecumenical_council_events.0129.support_duel.success_halved: "El miedo solo esclaviza a algunos"
 ecumenical_council_events.0129.support_duel.failure: "El miedo cuaja en rebeldía"
 ecumenical_council_events.0129.oppose: "Y, de este modo, el terror devora a la esperanza."
 ecumenical_council_events.0129.oppose_duel: "No permitiré que nadie me desafíe."
 ecumenical_council_events.0129.oppose_duel.success: "Los temerosos obedecen"
 ecumenical_council_events.0129.oppose_duel.success_halved: "Algunos aliados obedecen"
