 ecumenical_council_events.0103.t: "El precio del cambio"
 ecumenical_council_events.0103.desc: "«¡Vuestra intransigencia será nuestro fin!», grita [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l].\n\n«Los fieles de [lead_conservative.GetPrimaryTitle.GetNameNoTooltip] agradecerían un patrón que restaure su [lead_conservative.Custom('GetFaithTemple')]», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]."
 ecumenical_council_events.0103.support: "Ofrecer patronazgo."
 ecumenical_council_events.0103.support_duel: "Detallar cómo se enriquecería su rebaño."
 ecumenical_council_events.0103.support_duel.success: "Todos ven el valor de la innovación"
 ecumenical_council_events.0103.support_duel.success_halved: "Algunos aceptan el valor de la innovación"
 ecumenical_council_events.0103.support_duel.failure: "Todos niegan su voto"
 ecumenical_council_events.0103.oppose: "Ofrecer patronazgo."
 ecumenical_council_events.0103.oppose_duel: "Advertir que la innovación empobrecería a su rebaño."
 ecumenical_council_events.0103.oppose_duel.success: "Aprenden a temer esta blasfemia"
 ecumenical_council_events.0103.oppose_duel.success_halved: "Algunos evitan esta blasfemia"
 ecumenical_council_events.0103.oppose_duel.failure: "Todos rechazan la intransigencia"
