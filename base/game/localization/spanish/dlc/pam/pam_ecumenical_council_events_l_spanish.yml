 ecumenical_council_events.0116.t: "¿Y esto quién lo paga?"
 ecumenical_council_events.0116.desc: "Encuentro a administradores de varias sedes encorvardos sobre un pergamino, discutiendo cifras como si la asamblea fuera una contaduría.\n\n«Mi diócesis no se puede permitir otra alteración», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «Nuevos libros para cada parroquia. Jinetes a cada [lead_conservative.GetFaith.HouseOfWorship] de toda aldea. Si la propuesta se aprueba, no podremos estirar tanto el diezmo».\n\n«¿Y si fracasa?», pregunta [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]. «Hemos malgastado años en disputas. Esa plata desaparecerá de un modo u otro. Mejor gastar lo que quede en una ley que los fieles respeten»."
 ecumenical_council_events.0116.support: "Sí, ¿por qué llorar por una plata que ya se ha gastado?"
 ecumenical_council_events.0116.support_duel: "Argumenta de esta manera: ¡el apoyo es una inversión!"
 ecumenical_council_events.0116.support_duel.success: "La reforma les tienta"
 ecumenical_council_events.0116.support_duel.success_halved: "Algunos aceptan esta formulación"
 ecumenical_council_events.0116.support_duel.failure: "Siguen quejándose de los gastos"
 ecumenical_council_events.0116.oppose: "Mi diócesis no se puede permitir esta alteración."
 ecumenical_council_events.0116.oppose_duel: "«¡Es una irresponsabilidad financiera, por [ROOT.Char.GetFaith.HighGodName]!»."
 ecumenical_council_events.0116.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] se retracta"
 ecumenical_council_events.0116.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] se retractan"
 ecumenical_council_events.0116.oppose_duel.failure: "Se empeñan en su inversión"
 ecumenical_council_events.0116.conservatives_custom: "[ec_conservatives|E] de [stewardship|El] elevada (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0116.conservatives_custom_halved: "[ec_conservatives|E] de [stewardship|El] elevada (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0116.innovators_custom: "[ec_innovators|E] de [stewardship|El] elevada (#V [feature_innovators_size]#!)"
