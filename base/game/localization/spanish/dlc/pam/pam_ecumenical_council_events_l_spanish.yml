 friend_defended_piety_at_ec_reason_corresponding: "Muchos testigos han declarado que [TARGET_CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.LocalPlayerString( 'defendiste', 'defendió' )] la piedad de [Select_CString(CHARACTER.IsLocalPlayer,'tu persona', CHARACTER.GetShortUIName)] en un concilio ecuménico."
