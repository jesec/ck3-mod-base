 ecumenical_council_events.0117.t: "Demasiadas enmiendas"
 ecumenical_council_events.0117.desc: "Descubro a dos [Select_CString(And(lead_conservative.IsFemale, lead_innovator.IsFemale), 'negociadoras curtidas', 'negociadores curtidos')] redactando en los márgenes del decreto, tachando y reponiendo una cláusula como si un tratado fuera.\n\n«¡Dejadlo como está! Nos arriesgamos a que la mitad de ellos se marchen antes de haber afrontado los asuntos más peliagudos», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «Me he pasado meses manteniendo a esta gente en una sola mesa. Suavizadlo o perderemos el concilio mismo ».\n\n«¿Y dejar este desbarajuste que nadie hará cumplir cuando el concilio termine?», responde [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0117.support: "Debemos ser convincentes. Debemos ser claros."
 ecumenical_council_events.0117.support_duel: "Mejor un decreto firme que uno mudo, ¿no?"
 ecumenical_council_events.0117.support_duel.success: "Aceptan un barullo que no se hará cumplir"
 ecumenical_council_events.0117.support_duel.success_halved: "Algunos aceptan un barullo que no se hará cumplir"
 ecumenical_council_events.0117.support_duel.failure: "Siguen temiendo quedar apartados"
 ecumenical_council_events.0117.oppose: "¡No podemos permitirnos perder el concilio!"
 ecumenical_council_events.0117.oppose_duel: "Esto es muy burdo, ¡no se aprobará jamás!"
 ecumenical_council_events.0117.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0117.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0117.oppose_duel.failure: "Se obstinan en su mensaje"
