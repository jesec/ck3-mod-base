l_spanish:
 ecumenical_council_events.0001: "El Concilio de [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "[my_location.GetBaronyNameExplicitly] ha decorado sus [ROOT.Char.GetFaith.HouseOfWorshipPlural] bellamente para la ocasión. Lo mejor de la cristiandad ha respondido"
 ecumenical_council_events.0001.host: "a mi llamada."
 ecumenical_council_events.0001.dislikes_host: "al [host.Custom('InsultAdjective')] llamamiento [host.Custom('ES_DelDela')] [host.GetTitledFirstName|l]."
 ecumenical_council_events.0001.likes_host: "al [host.Custom('ComplimentAdjective')] llamamiento [host.Custom('ES_DelDela')] [host.GetTitledFirstName|l]."
 ecumenical_council_events.0001.neutral: "al llamamiento [host.Custom('ES_DelDela')] [host.GetTitledFirstName|l]."
 ecumenical_council_events.0001.intent_arrived: "\n\nY ya he visto que [intent_target.Custom('ES_ElLa')] [intent_target.GetTitledFirstName|l] está en la asamblea. ¡Perfecto!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nEs solo cuestión de tiempo que [intent_target.Custom('ES_ElLa')] [intent_target.GetTitledFirstName|l] haga su aparición…"
 ecumenical_council_events.0001.no_intent_target: "\n\n¡Tendré que esperar su llegada!"
 ecumenical_council_events.0001.a.bad: "Si hemos de hacerlo…"
 ecumenical_council_events.0001.a.good: "Sagrado es nuestro deber."
 ecumenical_council_events.0002.t: "La citación"
 ecumenical_council_events.0002.desc_intro: "Ahora se pueden abrir las puertas al/a la [host.GetFaith.HouseOfWorship] y nuestra gran obra puede comenzar. Como preparativo, es hora de formar alianzas."
 ecumenical_council_events.0002.reformist: "entre reyes y sacerdotes por igual."
 ecumenical_council_events.schism_crisis_intro: "\n\nLos saludos son cálidos, los silencios tras ellos, no. Roma y Constantinopla ya no intercambian cortesías; toda riña sin curar es otra grieta en el Cuerpo único de Cristo."
 ecumenical_council_events.0002.first_tenet: "\n\nEl aire vibra con chácharas. Los convocados empiezan a formular sus posturas sobre [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )|l] y otros asuntos apremiantes."
 ecumenical_council_events.0002.host: "\n\nExtiendo los brazos y doy la bienvenida a mis hijos para afrontar juntos nuestra tarea trascendental."
 ecumenical_council_events.0002.guest: "\n\n«Bienvenidos, hijos míos. ¡Que el Señor nos guíe en nuestra tarea trascendental!». [host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l] nos invita a avanzar."
 ecumenical_council_events.0002.a: "Amén."
 ecumenical_council_events.0010.t: "Nuestra postura sobre [ec_debate_topic_1.GetNameNoTooltip( ROOT.GetCharacter.GetRite )|l]"
 ecumenical_council_events.0010.desc.intro: "El primer debate se centra en torno a [ec_debate_topic_1.GetName( ROOT.GetCharacter.GetRite )|l]. El derecho canónico actual sostiene su posición como [host.Custom('GetEcumenicalDebateTenet1StatusText')|l]. [lead_portrait.Custom('ES_ElLa')|U] [lead_portrait.GetTitledFirstName|l] da el pie:\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n«Cada vez más gente considera esto como algo central en su culto», informa mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )|l] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n«Prohibir una práctica tiene sus riesgos, pero en este caso está justificado», me tranquiliza mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n«La práctica sigue siendo popular. Proclamar su condena… tiene ciertos riesgos», expresa preocupación mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n«La práctica pierde popularidad. Es el momento oportuno para acabar con su aprobación», aconseja mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n«La práctica gana popularidad. Sería prudente estudiar su aprobación», sugiere mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n«Es una práctica desconocida y una causa peligrosa que defender», advierte mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('court_chaplain') )] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.fallback.explanation: "«Se trata de una enseñanza que nuestra fe aún tiene que situar firmemente en su lugar; ahora lo que se sitúa ante este concilio es un acto de deliberación»."
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "«Se nos pregunta si debemos mantener una Paz y tregua de [ROOT.Char.GetFaith.HighGodName]. ¿Deben nuestras gentes jurar proteger iglesias, clérigos e individuos desarmados de saqueos y derramamientos de sangre? ¿Bajo ninguna circunstancia nadie puede tomar las armas en épocas santas, so pena de veto de la Iglesia [ROOT.Char.GetFaith.GetAdjective]?»."
 ecumenical_council_events.0010.desc.dulia.explanation: "«Se nos pregunta si los santos deben tener tanta veneración. ¿Deben considerarse sagradas sus reliquias, respetar los días de su festividad y buscar su intercesión, conservando la adoración solamente a [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "«Se nos pregunta si, con la consagración del sacerdote, el pan y el vino del altar de verdad se convierten en el Cuerpo y la Sangre de Cristo»."
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "«Se nos pregunta si la vida sacra debe conjugar la oración y el trabajo? ¿El ocio es el enemigo del alma? ¿Ha de venerarse nuestro trabajo en los campos o el scriptorium tanto como las horas de [ROOT.Char.Custom('GetReligiousRite')|l]?»."
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "«Se nos pregunta si la Santa Madre María, la que dio luz a Dios, debe ser venerada por encima de los demás santos»."
 ecumenical_council_events.0010.desc.simony.explanation: "«Se nos pregunta si los santos oficios, las bendiciones o los sacramentos se pueden comprar y vender a cambio de oro»."
 ecumenical_council_events.0010.desc.monophysitism.explanation: "«Se nos pregunta si Cristo solo tiene una naturaleza, completamente divina, y si su humanidad es absorbida de modo que nada más que la divinidad permanecería en el Verbo hecho carne»."
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "«Se nos pregunta si la Iglesia [ROOT.Char.GetFaith.GetAdjective] debe vivir como en los Hechos de los apóstoles. ¿Debemos lanzar a nuestros misioneros, con fervor apostólico, para llevar la Palabra de Dios a quienes aún están entre tinieblas?»."
 ecumenical_council_events.0010.desc.purgatory.explanation: "«Se nos pregunta si las almas, ni condenadas ni puras, se purgan tras la muerte. ¿Les ayudan las oraciones y ritos de los vivos antes de presentarse ante [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "«Se nos pregunta si engendrar hijos es una orden sagrada. ¿Deben los fieles llenar la tierra con su descendencia?»."
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "«Se nos pregunta si de verdad la autoridad de los obispos proviene de su sucesión ininterrumpida desde los apóstoles»."
 ecumenical_council_events.0010.desc.confession.explanation: "«Se nos pregunta si todo [ROOT.Char.GetFaith.GetAdherentName] debe confesar sus pecados a un sacerdote para conseguir absolución. ¿Debe mantenerse inviolable el sello de la confesión?»."
 ecumenical_council_events.0010.desc.original_sin.explanation: "«Se nos pregunta si toda alma hereda el pecado de Adán. ¿Estamos mancillados desde el nacimiento y necesitamos la gracia bautismal?»."
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "«Se nos pregunta si los santos ángeles están ordenados en grados bajo [ROOT.Char.GetFaith.HighGodName], con cada nivel encima del siguiente. ¿Deben los cargos de la Iglesia [ROOT.Char.GetFaith.GetAdjective] reflejar el orden celestial?»."
 ecumenical_council_events.0010.desc.miles_christi.explanation: "«Se nos pregunta si los fieles debe ser soldados de Cristo. ¿Estamos obligados a tomar la espada y defender a la Iglesia [ROOT.Char.GetFaith.GetAdjective] cuando se nos convoque?»."
 ecumenical_council_events.0010.desc.scholasticism.explanation: "«Se nos pregunta si la fe debe buscar la comprensión mediante la razón. ¿Las escuelas deben poner la dialéctica y la filosofía al servicio y la defensa de la doctrina?»."
 ecumenical_council_events.0010.desc.adoptionism.explanation: "«Se nos pregunta si Cristo, en Su humanidad, es Hijo de [ROOT.Char.GetFaith.HighGodName] por adopción»."
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "«Se nos pregunta si el amor por el prójimo debe unir a todo [ROOT.Char.GetFaith.GetAdherentName], incluso al forastero y al enemigo, como medida segura del amor a [ROOT.Char.GetFaith.HighGodName]»."
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "«Se nos pregunta si el [ROOT.Char.Custom('GetReligiousRite')|l], con cánticos, incienso y una liturgia organizada, es el camino principal por el cual los fieles se acercan a [ROOT.Char.GetFaith.HighGodName]»."
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "\"Se nos pregunta si, en Cristo, lo divino y humano son una naturaleza encarnada sin división ni confusión»."
 ecumenical_council_events.0010.desc.hesychasm.explanation: "«Se nos pregunta si la calma santa y la sencilla oración del corazón, —repetida sin fin— pueden conceder al alma la visión de la luz increada [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.anachoresis.explanation: "«Se nos pregunta si apartarse del mundo es santo. ¿Es la soledad del ermitaño el verdadero camino a [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "«Se nos pregunta si el alma se enriquece cuando el cuerpo se somete a las restricciones del ayuno, el cilicio y el flagelo»."
 ecumenical_council_events.0010.desc.holy_myron.explanation: "«Se nos pregunta si el santo [Glossary( 'crisma', 'CHRISM_GLOSS' )] debe sellar bautismos y coronaciones con el regalo del Espíritu Santo»."
 CHRISM_GLOSS: "El crisma, de origen griego, significa \"unción\". Consagrado por un obispo, el #bold crisma#! es un aceite sagrado oloroso que se emplea para uncir a los fieles en el bautismo y la confirmación. Y a veces en coronaciones reales."
 ecumenical_council_events.0010.desc.khachkar.explanation: "«Se nos pregunta si las cruces de piedra grabadas deben mantenerse entre nosotros como testimonio público de la fe para señalar el terreno sagrado y a los difuntos»."
 ecumenical_council_events.0010.desc.philanthropia.explanation: "«Se nos pregunta si cuidar a los pobres es un deber vinculante para la Iglesia [ROOT.Char.GetFaith.GetAdjective]. ¿Debemos reunir limosnas para levantar hospitales y casas de misericordia?»."
 ecumenical_council_events.0010.desc.aniconism.explanation: "«Se nos pregunta si debemos expulsar de nuestras iglesias toda imagen sagrada. ¿De verdad su veneración es idolatría de imágenes mundanas que aparta nuestros ojos y mentes de [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "«Se nos pregunta si debemos leer las Escrituras en busca de sentidos espirituales secretos. ¿Tal vez los conocimientos griegos y las alegorías abren lo que la letra oculta por sí misma?»."
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "«Se nos pregunta si tomar la cruz y marchar con un propósito santo es en sí mismo devoción a Cristo. ¿Debe la espada peregrinar y reclamar lo que los infieles ocupan?»."
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "«Se nos pregunta si los placeres de la carne acercan el alma a lo divino. ¿Debemos honrar y procurar el placer en lugar de rechazarlo como pecado?»."
 ecumenical_council_events.0010.desc.communal_identity.explanation: "«Se nos pregunta si la fe y el pueblo son uno ante [ROOT.Char.GetFaith.HighGodName]. ¿Deben los extraños permanecer apartados del verdadero rebaño?»."
 ecumenical_council_events.0010.desc.communion.explanation: "«Se nos pregunta si los ritos sagrados compartidos invocan la presencia de [ROOT.Char.GetFaith.HighGodName]. ¿No habremos de contar entre nuestro rebaño a quienes no se unan a estos?»."
 ecumenical_council_events.0010.desc.consolamentum.explanation: "«Se nos pregunta si, cuando la muerte acecha, una limpieza espiritual final puede purgar todo pecado y si, a cambio, los purgados deben abstenerse de comer y de la vida misma no sea que vuelva el pecado»."
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "«Se nos pregunta si el matrimonio debe conservarse entre el linaje sagrado, incluso entre familiares cuya cercanía habría considerado prohibida la Iglesia [ROOT.Char.GetFaith.GetAdjective]»."
 ecumenical_council_events.0010.desc.gnosticism.explanation: "«Se nos pregunta si la salvación reside en el conocimiento oculto, que solo se revela a los iniciados, lo que libera la chispa divina, que regresa a su origen»."
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "«Se nos pregunta si los frailes no deben poseer nada. ¿Tienen que ir de pueblo en pueblo, vivir de limosnas y predicar la Palabra de [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.pacifism.explanation: "«Se nos pregunta si en la vida del [ROOT.Char.GetFaith.GetAdherentName] no hay lugar para la espada. ¿Es falsa la idea de una guerra justa?»."
 ecumenical_council_events.0010.desc.pentarchy.explanation: "«Se nos pregunta si la Iglesia [ROOT.Char.GetFaith.GetAdjective] debe ser administrada por las cinco sedes patriarcales en un gobierno colegiado. ¿No niega esto la primacía del intercesor principal [ROOT.Char.GetFaith.HighGodNamePossessive]?»."
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "«Se nos pregunta si la fe debe mantenerse constante frente a persecuciones, privaciones o dudas. ¿Estamos obligados a mantenernos firmes cueste lo que cueste?»."
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "«Se nos pregunta si el mejor modo de servir a [ROOT.Char.GetFaith.HighGodName] es hacer voto de pobreza, como hicieron los apóstoles»."
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "«Se nos pregunta si debemos dejar el rebaño en paz para que conserve sus tradiciones. ¿No ha de inmiscuirse la Iglesia [ROOT.Char.GetFaith.GetAdjective] con extraños ni invitar a su interferencia?»."
 ecumenical_council_events.0010.desc.adaptive.explanation: "«Se nos pregunta si exigir la adhesión universal a nuestras costumbres y restricciones daña al rebaño. Mientras el corazón de nuestra fe permanezca inalterado, ¿nuestras leyes han de adaptarse al mundo en el que existen?»."
 ecumenical_council_events.0010.desc.esotericism.explanation: "«Se nos pregunta si los misterios de [ROOT.Char.GetFaith.HighGodName] nos impelen a buscar el conocimiento del mundo que nos rodea»."
 ecumenical_council_events.0010.desc.legalism.explanation: "«Se nos pregunta si la ley sagrada debe atar todo acto de la vida [ROOT.Char.GetFaith.GetAdjective]. ¿Ningún pecador, por real o imperial que sea, está por encima de la ley?»."
 ecumenical_council_events.0010.desc.literalism.explanation: "«Se nos pregunta si las Santas Escrituras se mantienen inmutables y completas, como único depósito de la sabiduría [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.reincarnation.explanation: "«Se nos pregunta si el alma regresa a través de muchas vidas, en lugar de afrontar el juicio [ROOT.Char.GetFaith.HighGodNamePossessive] una sola vez»."
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "«Se nos pregunta si los doctores de la Iglesia [ROOT.Char.GetFaith.GetAdjective] pueden promulgar sentencias vinculantes sobre toda cuestión relativa a fe y derecho»."
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "«Se nos pregunta si la vida [ROOT.Char.GetFaith.GetAdjective] debe modelarse en torno a la lucha y la sumisión. ¿Debe el creyente entregarse completamente a la voluntad [ROOT.Char.GetFaith.HighGodNamePossessive]?»."
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "«Se nos pregunta si un [ROOT.Char.GetFaith.GetAdherentName] puede fingir otra fe sometido a persecución»."
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "«Se nos pregunta si podemos mantener a no creyentes bajo un gobierno [ROOT.Char.GetFaith.GetAdherentName] solo con que paguen un impuesto de protección»."
 ecumenical_council_events.0010.desc.asceticism.explanation: "«Se nos pregunta si se ha de buscar a [ROOT.Char.GetFaith.HighGodName] mediante el hambre, la indigencia y el rechazo de la comodidad»."
 ecumenical_council_events.0010.desc.bhakti.explanation: "«Se nos pregunta si toda alma debe unirse, en amorosa devoción, a un aspecto de la divinidad»."
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "«Se nos pregunta si está prohibido hacer daño a los seres vivos. ¿Hemos de evitar dañar hasta a las bestias humildes y los insectos?»."
 ecumenical_council_events.0010.desc.inner_journey.explanation: "«Se nos pregunta si se busca a [ROOT.Char.GetFaith.HighGodName] principalmente mediante la meditación y el conocimiento del propio ser»."
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "«Se nos pregunta si tenemos el deber sagrado de recibir a nuestra mesa a todo extraño»."
 ecumenical_council_events.0010.desc.adorcism.explanation: "«Se nos pregunta si los espíritus de este mundo deben ser honrados y bien recibidos para que nos ayuden, en lugar de ser expulsados como poderes impuros»."
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "«Se nos pregunta si debemos honrar a nuestros antepasados con oraciones y ofrendas para que cuiden de nosotros y nos guíen»."
 ecumenical_council_events.0010.desc.astrology.explanation: "«Se nos pregunta si se puede leer la voluntad [ROOT.Char.GetFaith.HighGodNamePossessive] en las estrellas. ¿Albergan los cielos los secretos de nuestro destino?»."
 ecumenical_council_events.0010.desc.hedonistic.explanation: "«Se nos pregunta si el placer es un obsequio que buscar como forma de adoración»."
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "«Se nos pregunta si se pueden ofrecer vidas humanas en el altar. ¿Hay que derramar sangre por [ROOT.Char.GetFaith.HighGodName] como obsequio sagrado?»."
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "«Se nos pregunta si ciertas almas están marcadas desde el nacimiento para el poder sagrado y el liderazgo espiritual, elegidas antes de cualquier unción de la Iglesia [ROOT.Char.GetFaith.GetAdjective]»."
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "«Se nos pregunta si el calendario [ROOT.Char.GetFaith.GetAdherentName] debe estar lleno de fiestas sagradas que unan a los fieles»."
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "«Se nos pregunta si se debe preparar el parto con ritos sagrados. ¿Hay que purificar el lugar de nacimiento para que [ROOT.Char.GetFaith.HighGodName] bendiga a la madre y al hijo?»."
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "«Se nos pregunta si las arboledas, los ríos caudalosos o los valles besados por el rocío son santos. ¿Es en la naturaleza salvaje donde debemos buscar a [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.sun_worship.explanation: "«Se nos pregunta si debemos dirigir nuestras plegarias al sol. Esta luz que da la vida… ¿es [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.warmonger.explanation: "«Se nos pregunta si la guerra y la conquista son de por sí un servicio sagrado. ¿Es la espada el método más seguro para difundir la palabra de [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "«Se nos pregunta si los días sagrados pueden estar señalados con espectáculos sangrientos y crueles. ¿Son tales festejos el verdadero culto a [ROOT.Char.GetFaith.HighGodName]?»."
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "«Se nos pregunta si los lugares más altos y las raíces de la tierra son santos. ¿Debemos buscar a [ROOT.Char.GetFaith.HighGodName] entre las cumbres y junto a las sendas ocultas de piedra?»."
 ecumenical_council_events.0010.desc.household_gods.explanation: "«Se nos pregunta si en una casa [ROOT.Char.GetFaith.GetAdjective] se debe seguir honrando a los dioses domésticos y del hogar»."
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "«Se nos pregunta si debemos entretejer en nuestra fe los ritos y cánones del Lejano Oriente»."
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "«Se nos pregunta si podemos aprender de las fes de Oriente —que conviven juntas sin calificar la una a la otra de malvada— aunque no compartamos a sus dioses orientales»."
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "«Se nos pregunta si se deben dejar intactas las viejas costumbre populares de los nuevos conversos: aprender de ellas en silencio más que expulsarlas y condenarlas»."
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "«Se nos pregunta si aquellos fuera de Cristo pueden no obstante venerar Sus enseñanzas y ejemplo sin confesar que Él sea el Dios verdadero»."
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "«Se nos pregunta si se debe recoger la ley de los sarracenos en la Iglesia [ROOT.Char.GetFaith.GetAdjective] y mezclar sus enseñanzas con el Evangelio»."
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "«Se nos pregunta si debemos recibir en la Iglesia [ROOT.Char.GetFaith.GetAdjective] la ley y el conocimiento de los judíos, aunque no compartamos todas sus afirmaciones»."
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "«Se nos pregunta si el dolor en sí es sagrado. ¿Es proporcionar dolor una bendición, y es recibirlo una gracia de [ROOT.Char.GetFaith.HighGodName|U]?»."
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "«Se nos pregunta si la santidad reside en abandonar las ciudades y adoptar la vida en la naturaleza; existir de nuevo en un estado primario del ser»."
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "«Se nos pregunta si el dominio sobre el mundo viviente es una meta sagrada. ¿Tomar el poder cumplirá la voluntad [ROOT.Char.GetFaith.HighGodNamePossessive]?»."
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "«Se nos pregunta si se puede consumir la carne de los muertos como rito sagrado»."
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "«Se nos pregunta si el engaño puede ser sagrado. ¿Pueden mentir los fieles y creer incluso sus propias mentiras cuando la verdad podría poner la fe en peligro?»."
 ecumenical_council_events.0010.desc.polyamory.explanation: "«Se nos pregunta si los fieles pueden compartir su amor con muchos y expulsar la idea de que solo una única alma puede poseer el afecto de otra»."
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "«Se nos pregunta si se deben entregar vidas humanas en ceremonias sagradas. ¿Pueden los voluntarios entregarse, y los culpables, ser entregados, en el altar [ROOT.Char.GetFaith.GetAdherentName]?»."
 ecumenical_council_events.0010.desc.megaliths.explanation: "«Se nos pregunta si debemos levantar grandes monumentos de piedra en honor a la gloria [ROOT.Char.GetFaith.HighGodNamePossessive]»."
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "«Se nos pregunta si los fieles deben compartir todas sus posesiones»."
 ecumenical_council_events.0010.desc.pure_land.explanation: "«Se nos pregunta si solo se puede alcanzar el reino bendito más allá del sufrimiento mediante la confianza y la devoción, y no con riquezas, estudios y dominio de los ritos»."
 ecumenical_council_events.0010.desc.no_mind.explanation: "«Se nos pregunta si se busca a [ROOT.Char.GetFaith.HighGodName] mediante el vaciado de la mente y el silencio del propio ser»."
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "«Se nos pregunta si los lugares más altos son, en verdad, elevados y santos. ¿Es mejor buscar a [ROOT.Char.GetFaith.HighGodName] en las cumbres de las montañas?»."
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "«Se nos pregunta si esta era es cada vez más oscura y si los demonios caminan disfrazados de piadosos. ¿Debemos acabar con tales enemigos para defender la ley santa de su decadencia?»."
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "«Se nos pregunta si debemos tomar las cabezas de los caídos como trofeos sagrados»."
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "«Se nos pregunta si la búsqueda de conocimiento es un deber sagrado»."
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "«Se nos pregunta si el gobierno justo es una obligación sagrada a la cual deben atenerse los príncipes [ROOT.Char.GetFaith.GetAdherentNamePlural]»."
 ecumenical_council_events.0010.desc.filial_piety.explanation: "«Se nos pregunta si [ROOT.Char.GetFaith.HighGodName] exige honrar a nuestros padres y ancianos»."
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "«Se nos pregunta si la armonía social, con cada alma en su lugar, es el corazón del orden [ROOT.Char.GetFaith.GetAdherentName]»."
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "«Se nos pregunta si la destrucción en sí puede ser sagrada. ¿Es derribar lo antiguo lo que [ROOT.Char.GetFaith.HighGodName] nos exige?»."
 ecumenical_council_events.0010.desc.preservation.explanation: "«Se nos pregunta si la santidad reside en levantar y conservar lo construido. ¿Hay que cuidar las obras y templos [ROOT.Char.GetFaith.GetAdherentNamePlural] para que prosperen eternamente?»."
 ecumenical_council_events.0010.desc.takamin.explanation: "«Se nos pregunta si el poderoso oso es un recipiente de la divinidad. ¿Debe considerarse sagrada la caza de tan gran bestia y su muerte llevada a cabo con respeto sacro?»."
 ecumenical_council_events.0010.a_1: "Reemplazará a [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_2: "Haremos sitio retirando [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] debe irse."
 ecumenical_council_events.0010.b: "¡Prohibid su práctica!"
 ecumenical_council_events.0010.c: "Por ahora permitiré su observancia sin más."
 ecumenical_council_events.0010.d: "Al menos reconozcamos la existencia de este dogma."
