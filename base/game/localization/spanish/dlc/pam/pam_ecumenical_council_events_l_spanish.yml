 ecumenical_council_events.0114.t: "Armados con fe y acero"
 ecumenical_council_events.0114.desc.intro: "Como acostumbran a hacer quienes han conocido la guerra, l[Select_CString(And(lead_conservative.IsFemale, lead_innovator.IsFemale), 'las viejas guerreras', 'los viejos guerreros')] en la asamblea se juntan para pasar las horas en compañía.\n\n«Vive [lead_innovator.GetFaith.HighGodName], será bueno que se acuerden estos cambios. ¡Los fieles unidos de nuevo bajo un solo estandarte!», plantea [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]\n\n"
 ecumenical_council_events.0114.desc.conservative: "«Bastantes [ec_hostile_faith.GetAdherentNamePlural] hemos abatido ya tal como estamos», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «¿No bendice ya [lead_conservative.GetFaith.WarGodName] nuestros estandartes?»."
 ecumenical_council_events.0114.desc.conservative_generic: "«Bastantes enemigos hemos abatido ya tal como estamos», dice [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «¿No bendice ya [lead_conservative.GetFaith.WarGodName] nuestros estandartes?»."
 ecumenical_council_events.0114.support: "Enarbolemos bien alto un nuevo estandarte bendecido."
 ecumenical_council_events.0114.support_duel: "¡Reclutemos a los temerosos [ROOT.Char.GetFaith.HighGodNamePossessive] bajo su bendecido estandarte!"
 ecumenical_council_events.0114.support_duel.success: "Un[lead_conservative.Custom('ES_XA')] [Select_CString(lead_conservative.IsFemale, 'guerrera', 'soldado' )] debe servir"
 ecumenical_council_events.0114.support_duel.success_halved: "Se recluta a algunos"
 ecumenical_council_events.0114.support_duel.failure: "Se obstinan en su idea"
 ecumenical_council_events.0114.oppose: "Apoyar [lead_conservative.Custom('ES_AlAla')] [lead_conservative.GetTitledFirstNameNoTooltip|l], defensor[lead_conservative.Custom('ES_XA')] de la ortodoxia."
 ecumenical_council_events.0114.oppose_duel: "Sea, ¡un duelo de palabras!"
 ecumenical_council_events.0114.oppose_duel.success: "La cohorte [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0114.oppose_duel.success_halved: "Algunos de la cohorte [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
