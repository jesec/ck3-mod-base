 pam_ecumenical_council_overruled_guests_custom: "Los invitados del rito contra el cual se dictaminó, más mandados que escuchados"
 pam_rite_quarrel_championed_opinion: "Se puso del lado de mi rito en un concilio ecuménico"
 pam_rite_quarrel_slighted_opinion: "Se puso del lado del otro rito en un concilio ecuménico"
 pam_rite_quarrel_overruled_opinion: "Decidió en contra de mi rito en un concilio ecuménico"
 ecumenical_council_summons_events.0060.t: "Primero entre iguales"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.Custom('ES_ElLa')|U] [ec_roman_champion.GetTitledFirstName|l] habla por el [GetRiteByKey('roman_rite').GetName|l] y no lo deja pasar:\n\n«Toda iglesia responde ante Roma, ¡y Roma no responde ante nadie!».\n\n[ec_greek_champion.Custom('ES_ElLa')|U] [ec_greek_champion.GetTitledFirstName|l] descuenta los cinco patriarcas con los dedos:\n\n«¿Cuál de ellos se ha arrodillado jamás?»."
 ecumenical_council_summons_events.0060.a: "«Paz, [Select_CString(And(ec_roman_champion.IsFemale, ec_greek_champion.IsFemale), 'hermanas', 'hermanos')]. El concilio todavía no ha empezado»."
 ecumenical_council_summons_events.0060.a.success: "Se [Select_CString(And(ec_roman_champion.IsFemale, ec_greek_champion.IsFemale), 'las', 'les')] calma antes de que la sala pueda tomar partido"
 ecumenical_council_summons_events.0060.a.failure: "No me escuchan y la sala toma partido"
 ecumenical_council_summons_events.0060.b: "A Pedro se le dieron las llaves y Roma las conserva."
 ecumenical_council_summons_events.0060.c: "Roma es la primera entre iguales, nada más."
 ecumenical_council_summons_events.0060.d: "Yo ostento el cargo. Se ha acabado la cuestión."
 ecumenical_council_summons_events.0061.t: "Y el Hijo"
 ecumenical_council_summons_events.0061.desc: "«Dos palabras», dice [ec_greek_champion.Custom('ES_ElLa')] [ec_greek_champion.GetTitledFirstName|l] del [GetRiteByKey('byzantine_rite').GetName|l]. «Dos palabras de los [GetRiteByKey('roman_rite').GetAdherentNamePlural] deslizadas en el credo sin preguntar jamás a Oriente».\n\n«La verdad no necesita el permiso de nadie, solo el de Dios», responde [ec_roman_champion.Custom('ES_ElLa')] [ec_roman_champion.GetTitledFirstName|l]."
 ecumenical_council_summons_events.0061.a: "El credo ha sobrevivido a cosas peores que a una riña por él."
 ecumenical_council_summons_events.0061.a.success: "La formulación se deja a un lado antes de que los argumentos se enconen"
 ecumenical_council_summons_events.0061.a.failure: "Los argumentos se enconan en la doctrina en ambos bandos"
 ecumenical_council_summons_events.0061.b: "Se añadieron esas palabras porque son ciertas."
 ecumenical_council_summons_events.0061.c: "Un concilio escribió el credo. Solo un concilio puede cambiarlo."
 ecumenical_council_summons_events.0061.d: "El credo se pronunciará como yo lo pronuncie."
 ecumenical_council_summons_events.0062.t: "El pan en el altar"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.Custom('ES_ElLa')|U] [ec_roman_champion.GetTitledFirstName|l] sostiene una oblea, pálida y fina como una moneda, y dice:\n\n«Los [GetRiteByKey('roman_rite').GetAdherentNamePlural] jamás han necesitado más».\n\n[ec_greek_champion.Custom('ES_ElLa')|U] [ec_greek_champion.GetTitledFirstName|l] pone una rebanada de pan fermentado a su lado y pregunta:\n\n«¿Entonces los [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] han estado equivocados desde los apóstoles?»."
 ecumenical_council_summons_events.0062.a: "Ambos panes se bendecirán en mi altar mañana y comeremos de ambos."
 ecumenical_council_summons_events.0062.a.success: "Se comen ambos panes y la riña se acaba con ellos."
 ecumenical_council_summons_events.0062.a.failure: "Dos altares se levantan esa mañana y nadie cruza entre ellos."
 ecumenical_council_summons_events.0062.b: "Ácimo, como fue en la última cena."
 ecumenical_council_summons_events.0062.c: "Pan fermentado, elevado como el Señor."
 ecumenical_council_summons_events.0062.d: "El pan es pan. Lo que importa es la bendición."
 ecumenical_council_summons_events.0063.t: "Cosas de lenguaje"
 ecumenical_council_summons_events.0063.desc: "Las oraciones se leen en latín. Los bancos de los [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] esperan la traducción y la que reciben es errónea. [ec_greek_champion.Custom('ES_ElLa')|U] [ec_greek_champion.GetTitledFirstName|l] musita:\n\n«Los romanos arguyen como abogados. Palabrería sin sustancia».\n\n«Los griegos arguyen como filósofos. No llegan a ninguna conclusión», replica [ec_roman_champion.Custom('ES_ElLa')] [ec_roman_champion.GetTitledFirstName|l]."
 ecumenical_council_summons_events.0063.a: "Encontremos entonces palabras que lo transmitan en ambas lenguas."
 ecumenical_council_summons_events.0063.a.success: "Se encuentra una formulación que ningún bando puede retorcer"
 ecumenical_council_summons_events.0063.a.failure: "Ambos bandos se marchan convencidos de que el otro arguyó de mala fe"
 ecumenical_council_summons_events.0063.b: "Decidlo en latín y decidlo sin rodeos."
 ecumenical_council_summons_events.0063.c: "Los padres escribieron en griego. Podemos conseguir leerlo."
 ecumenical_council_summons_events.0063.d: "Sale en ambas lenguas, bajo mi nombre. Y se acabó."
