 ecumenical_council_events.doctrine.t: "La cuestión de [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )|l]"
 ecumenical_council_events.doctrine.intro: "La cuestión de [ec_debate_topic_3.GetGroup.GetName( ROOT.GetCharacter.GetFaith )|l] es el tema final por escuchar. [ec_debate_topic_3.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] es la postura actual del derecho canónico. [lead_portrait.Custom('ES_ElLa')|U] [lead_portrait.GetTitledFirstName|l] comienza:\n\n"
 ecumenical_council_events.doctrine.chaplain_suggestion: "\n\n«[ec_chaplain_pick.GetDescriptiveName( ROOT.GetCharacter.GetFaith )] es lo más adecuado para las necesidades del [ROOT.Char.GetFaith.GetName|l]», recomienda [court_chaplain.GetName]."
 ecumenical_council_events.0031.t: "$ecumenical_council_events.doctrine.t$"
 ecumenical_council_events.0031.desc.intro: "$ecumenical_council_events.doctrine.intro$"
 ecumenical_council_events.0031.desc.proposal: "«[host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l] ha propuesto graciosamente que la idea de [ec_proposed_doctrine.GetDescriptiveName( ROOT.GetCharacter.GetFaith )|l] sea la nueva norma»."
 ecumenical_council_events.0031.a: "$ecumenical_council_events.0011.a$"
 ecumenical_council_events.0031.b: "$ecumenical_council_events.0011.b$"
 ecumenical_council_events.0040.t: "El fin del concilio"
 ecumenical_council_events.0040.desc: "Tras un proceso complejo, el concilio llega a su fin."
 ecumenical_council_events.0040.desc.change: "Bajo mi dirección, el [ROOT.Char.GetFaith.GetName|l] ha alterado sus cimientos. ¡Ahora, a predicar estas noticias al pueblo llano!"
 ecumenical_council_events.0040.desc.status_quo: "He fracasado a la hora de transmitir cualquiera de los cambios que había propuesto. El [ROOT.Char.GetFaith.GetName|l] sigue como estaba."
