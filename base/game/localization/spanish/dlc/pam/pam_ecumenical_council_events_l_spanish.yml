 # Flavor Events
 ecumenical_council_summons_events.0001.t: "Las preocupaciones [guest_1.Custom('ES_DelDela')] [guest_1.GetTitleAsNameNoTooltip|l]"
 ecumenical_council_summons_events.0001.desc: "«Y este asunto mío…, vive [guest_1.GetFaith.HighGodName], me consume. Apenas duermo…». [guest_1.Custom('ES_ElLa')|U] [guest_1.GetTitledFirstName|l] se confiesa [guest_2.Custom('ES_AlAla')] [guest_2.GetTitledFirstName|l] con un susurro afligido.\n\n«Lo entiendo…», asiente [guest_2.GetFirstNameNoTooltip]. «Quizás si hablarais con nuestr[host.Custom('ES_OA')] anfitri[host.Custom('ES_OnOna')], [host.Custom('ES_ElLa')] [host.GetTitleAsNameNoTooltip|l], podría daros consejo espiritual»."
 ecumenical_council_summons_events.0001.a: "Qué le preocupará tanto…"
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Descubres el secreto de [guest_1.GetShortUIName]"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip] solo necesita consuelo amigo."
 ecumenical_council_summons_events.0001.c: "Es mejor no saber."
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'consolaste', 'consoló' )] a [TARGET_CHARACTER.LocalPlayerString( 'tu persona', TARGET_CHARACTER.GetShortUIName )] respecto a[TARGET_CHARACTER.LocalPlayerString( ' tu', 'l' )] secreto[TARGET_CHARACTER.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )]."
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'consolaste', 'consoló' )] a [CHARACTER.LocalPlayerString( 'tu persona', CHARACTER.GetShortUIName )] respecto a[CHARACTER.LocalPlayerString( ' tu', 'l' )] secreto[CHARACTER.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )]."
 rival_eavesdropped_on_secret_reason: "Pillaron a [CHARACTER.GetShortUIName] cuando intentaba espiar un secreto de [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu persona', TARGET_CHARACTER.GetShortUIName )] en un concilio."
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName] [Select_CString( CHARACTER.IsLocalPlayer, 'pillaste', 'pilló' )] a [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu personaje', TARGET_CHARACTER.GetShortUIName )] cuando intentaba espiar un secreto de [Select_CString( CHARACTER.IsLocalPlayer, 'tu persona', CHARACTER.GetShortUIName )] en un concilio."
 ecumenical_council_summons_events.0010.t: "El secreto"
 ecumenical_council_summons_events.0010.desc: "Nuestro anfitri[host.Custom('ES_OnOna')], [host.Custom('ES_ElLa')] [host.GetTitledFirstName|l], no parece darse cuenta de mi presencia mientras un sirviente [host.Custom('ES_LoLa')] ayuda a ponerse las vestiduras.\n\n«[host.GetFaith.HighGodName] me perdone…», murmura. «Estos rumores sobre mis… tendencias. ¡Quién podría pensar que yo, [host.Custom('ES_ElLa')] Vicari[host.Custom('ES_OA')] de Cristo, disfruto de semejantes inclinaciones! Estos rumores jamás deben llegar a los oídos de mis cardenales»."
 ecumenical_council_summons_events.0010.a: "«No veo que os arrepintáis, [host.GetTitleAsNameNoTooltip|l]»."
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Descubres el secreto de [host.GetShortUIName]"
 ecumenical_council_summons_events.0010.b: "«[ROOT.Char.Custom('RandomBibleQuoteShort')]»"
 ecumenical_council_summons_events.0010.b.flavor: "¡Encontrará consuelo en las escrituras!"
 ecumenical_council_summons_events.0010.c: "Hay cosas que es mejor no saber."
 ecumenical_council_summons_events.0020.t: "Problemas logísticos"
 ecumenical_council_summons_events.0020.desc.intro: "«Si así ha de ser…». [host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l] despide a uno de los sacerdotes con un gesto.\n\n«¡[ROOT.Char.GetTitledFirstNameNoTooltip]!», dice llamándome."
 ecumenical_council_summons_events.0020.desc.caravans: "«Las caravanas que transportaban nuestras provisiones no han llegado aún."
 ecumenical_council_summons_events.0020.desc.servants: "«Sencillamente, no hay suficientes sirvientes para atender a todos nuestros invitados."
 ecumenical_council_summons_events.0020.desc.overcrowded: "«Sencillamente, hay demasiados invitados para los alojamientos organizados en [ROOT.Char.GetCurrentLocation.GetName] para nuestro concilio."
 ecumenical_council_summons_events.0020.desc.outro: "Supongo que no tendréis una solución para nuestros problemas, ¿verdad?»."
 ecumenical_council_summons_events.0020.aaa: "«Estas son mis tierras, Vuestra Santidad. Lo solucionaré»."
 ecumenical_council_summons_events.0020.aa: "Conozco a #EMP mucha#! gente que me debe un favor…"
 ecumenical_council_summons_events.0020.a: "«¡Nada que no se pueda arreglar con oro, Vuestra Santidad!»."
 ecumenical_council_summons_events.0020.b: "«¡Reclamaré los favores que se me deben!»."
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName] me recordará como una candidatura influyente…"
 ecumenical_council_summons_events.0020.c: "Solo puedo ofrecer una modesta plegaria…"
 ecumenical_council_summons_events.0020.papabile_tt: "Tu [papabile_score|El] para la sucesión papal aumenta en #P +10#!"
 ecumenical_council_summons_events.0030.t: "A merced de los elementos"
 ecumenical_council_summons_events.0030.desc.intro: "El viento aúlla y la lluvia inunda los caminos a medida que se acerca el concilio."
 ecumenical_council_summons_events.0030.desc.dry_season: "Algo bastante inusual en esta época del año."
 ecumenical_council_summons_events.0030.desc.wet_season: "Un clima tan inclemente era de esperar en esta época del año."
 ecumenical_council_summons_events.0030.desc.outro: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )], [chaplain.GetFirstName], no puede contener los temblores.\n\n«Mi señor[ROOT.Char.Custom('ES_XA')]… Temo no poder asistir al concilio. Esta tormenta, este frío… No es bueno para mi cuerpo. Tengo mucha flema…»."
 ecumenical_council_summons_events.0030.aa: "«¡He leído #EMP mucho#! acerca de esta aflicción!»."
 ecumenical_council_summons_events.0030.a: "¡Debo llamar al mejor médico!"
 ecumenical_council_summons_events.0030.b: "«Os recordaré en mis rezos»."
 ecumenical_council_summons_events.0030.c: "La vida sigue su curso."
 ecumenical_council_summons_events.0040.t: "Miedo escénico"
 ecumenical_council_summons_events.0040.desc: "A medida que se acerca el concilio, descubro a mi [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('chaplain') )] [chaplain.GetFirstName] caminando de manera nerviosa por el patio.\n\n«Está la cuestión del símbolo de [ROOT.Char.GetFaith.ReligiousSymbol], por supuesto, sí… y también el tema de [chaplain.CustomFixedRandom('random_learning_topic')]…», [chaplain.GetHerHim] oigo murmurar para sus adentros."
 ecumenical_council_summons_events.0040.aa: "«Debes recordar a [ROOT.Char.GetFaith.KnowledgeGodName], [chaplain.GetFirstNameNoTooltip]»."
 ecumenical_council_summons_events.0040.aa.flavor: "Un poco de consejo espiritual le tranquilizaría."
 ecumenical_council_summons_events.0040.a: "Debo recordarle que también me representa a mí."
 ecumenical_council_summons_events.0040.a.tt.success: "Tu diplomacia dará sus frutos"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName] no tiene claras tus intenciones"
 ecumenical_council_summons_events.0040.b: "Siempre puedo aprovechar mi posición a su favor…"
 ecumenical_council_summons_events.0040.c: "Nada que no pueda solucionar un rezo."
 friend_reassured_at_council: "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'tranquilizaste', 'tranquilizó' )] a [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu persona', TARGET_CHARACTER.GetShortUIName )] en un concilio ecuménico."
 friend_reassured_at_council_corresponding: "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'conseguiste', 'consiguió' )] tranquilizar[CHARACTER.LocalPlayerString( 'te', 'se' )] gracias a [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'ti', TARGET_CHARACTER.GetShortUIName )] en un concilio ecuménico."
 ecumenical_council_summons_events.0050.t: "Fe cuestionada"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.Custom('ES_ElLa')|U] [pious_guest.GetTitledFirstName|l] apenas puede contener la risa al ver [non_pious_guest.Custom('ES_AlAla')] [non_pious_guest.GetTitledFirstName|l].\n\n«¿Habéis visto esto, [ROOT.Char.GetTitleAsNameNoTooltip|l]?», dice dirigiéndose a mí. «¡Habremos de alabar a [non_pious_guest.GetFirstNameNoTooltip]! Había empezado a pensar que el único trono que conoce es el de las [Glossary( 'casas de baño', 'BATHHOUSES_GLOSS' )]."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "Y, aun así, se considera cabeza de todos los [ROOT.Char.GetFaith.GetAdherentNamePlural]»."
 ecumenical_council_summons_events.0050.aaa: "[chaplain.Custom('ES_ElLa')|U] [chaplain.GetTitledFirstNameNoTooltip|l] sería la persona perfecta para este trabajo."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Me maravilla que haya decidido unirse a nosotros en este concilio»."
 ecumenical_council_summons_events.0050.aa: "Un buen pastor debe alzarse entre su rebaño…"
 ecumenical_council_summons_events.0050.a: "«Debo informar a #EMP todos#! sobre esto… por un precio»."
 ecumenical_council_summons_events.0050.b: "«¿Y #EMP vos#! cómo sabéis quién frecuenta las casas de baño, [pious_guest.GetTitleAsNameNoTooltip|l]?»"
 ecumenical_council_summons_events.0050.c: "Doy gracias a [ROOT.Char.GetFaith.HighGodName] por este divertimento."
 BATHHOUSES_GLOSS: "En muchos pueblos medievales, las casas de baño —originalmente destinadas a humildes abluciones— se ganaron una notoria reputación. Sus oscuras habitaciones ofrecían la suficiente privacidad para que los trabajadores del placer llevaran a cabo sus tareas."
