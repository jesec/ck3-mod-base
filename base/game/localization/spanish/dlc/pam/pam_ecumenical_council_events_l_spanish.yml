 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "El concilio vota"
 ecumenical_council_events.0081.desc.innovator_passed: "Quienes alegamos a favor del cambio nos hemos impuesto. Nuestro razonamiento ha influido en bastantes del concilio y se ha adoptado la nueva vía."
