 ecumenical_council_events.0108.t: "Entre amigos"
 ecumenical_council_events.0108.desc: "Es un alivio encontrar [friend.Custom('ES_AlAla')] [friend.GetTitledFirstName|l], mi [ROOT.Char.Custom2('RelationToMe', friend)], en la asamblea.\n\n«Sin duda, vos conocéis mi posición», dice. «Decid una palabra y os seguiré»."
 ecumenical_council_events.0108.a: "Estad conmigo, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b: "Ateneos a vuestras propias convicciones."
 ecumenical_council_events.0108.conservatives_custom: "[ec_conservatives|E] entre tus [friends|El] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.innovators_custom: "[ec_innovators|E] entre tus [friends|El] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.t: "Descontentos callados"
 ecumenical_council_events.0109.desc: "Lejos de la asamblea, un pequeño concilio parece estar tramando algo. ¿Quién puede estar intentando rehacer la fe sin mí?\n\n«Si este tema se puede cuestionar, ¿por qué no los demás?», advierte [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]. «No abriré esa puerta ni invitaré a la incertidumbre a entrar en la casa de [lead_conservative.GetFaith.HighGodName]».\n\n«¿No sentís impaciencia por libraros de las tradiciones que ya no nos sirven?», responde [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l]."
 ecumenical_council_events.0109.support: "Vendrá bien un oído amigo."
 ecumenical_council_events.0109.support_duel: "Sé cómo hacer que los cautos escuchen…"
 ecumenical_council_events.0109.support_duel.success: "No se bloqueará el camino"
 ecumenical_council_events.0109.support_duel.success_halved: "Algunos te escuchan"
 ecumenical_council_events.0109.support_duel.failure: "Cierran filas contra ti"
 ecumenical_council_events.0109.oppose: "Cierran esa puerta en silencio."
 ecumenical_council_events.0109.oppose_duel: "«¿Siempre negociáis con el caos, [lead_innovator.GetFirstNameNoTooltip]?»."
 ecumenical_council_events.0109.oppose_duel.success: "No se arriesgarán a provocar el caos"
 ecumenical_council_events.0109.oppose_duel.success_halved: "Algunos retiran su apoyo"
 ecumenical_council_events.0109.oppose_duel.failure: "Siguen deseando la discordia y la ruina"
 ecumenical_council_events.0109.conservatives_custom: "[ec_conservatives|E] reformistas (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0109.conservatives_custom_halved: "[ec_conservatives|E] reformistas (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0109.innovators_custom: "[ec_innovators|E] reformistas (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.innovators_custom_halved: "[ec_innovators|E] reformistas (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0110.t: "Ambición desmedida"
 ecumenical_council_events.0110.desc: "«¡Solo es una enmienda menor!», dice [lead_innovator.Custom('ES_ElLa')] [lead_innovator.GetTitledFirstName|l], «y nos situaríamos en una buena posición para la candidatura a [lead_innovator.GetFaith.ReligiousHeadName|l], si ayudamos a que se apruebe».\n\n«¡Vuestra ambición desmedida vuela demasiado alto y será la perdición de todos», se burla [lead_conservative.Custom('ES_ElLa')] [lead_conservative.GetTitledFirstName|l]."
 ecumenical_council_events.0110.support: "Un poco de ambición es pertinente"
 ecumenical_council_events.0110.support_duel: "¡Argumentad más para avanzar!"
 ecumenical_council_events.0110.support_duel.success: "Aceptan: no es más que una enmienda menor"
 ecumenical_council_events.0110.support_duel.success_halved: "Algunos aceptan las ventajas de apoyarla"
 ecumenical_council_events.0110.support_duel.failure: "Tu ambición es obvia"
 ecumenical_council_events.0110.oppose: "El orgullo precede a la caída"
 ecumenical_council_events.0110.oppose_duel: "¡Advertir contra los males de la ambición!"
 ecumenical_council_events.0110.oppose_duel.success: "El grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] cede"
 ecumenical_council_events.0110.oppose_duel.success_halved: "Algunos del grupo [lead_innovator.Custom('ES_DelDela')] [lead_innovator.GetTitledFirstNameNoTooltip|l] ceden"
 ecumenical_council_events.0110.oppose_duel.failure: "Se atienen a su apoyo a la enmienda"
 ecumenical_council_events.0110.conservatives_custom: "[ec_conservatives|E] ambiciosos (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0110.conservatives_custom_halved: "[ec_conservatives|E] ambiciosos (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0110.innovators_custom: "[ec_innovators|E] ambiciosos (#V [feature_innovators_size]#!)"
