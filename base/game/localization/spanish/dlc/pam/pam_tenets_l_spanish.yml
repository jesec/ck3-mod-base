 tenet_khachkar_default_name: "Jachkares"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "Los jachkares se alzan como testigos eternos de nuestra fe. Tallado con diseños enrevesados de cruces, vides y símbolos sagrados, cada jachkar es una plegaria en piedra, la glorificación de la cruz a través de la cual se salvó el mundo.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Contexto histórico del jachkar','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "Igual que los armenios levantan sus cruces de piedra hacia el cielo, marquemos nosotros esta tierra con los símbolos de la salvación, la cruz de nuestro Señor Jesucristo.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Contexto histórico de la crux lapidea','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "Monumentos de piedra, tallados con símbolos sagrados, que atestiguan la victoria de Cristo y permanecen como recordatorios eternos para los fieles.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Contexto histórico del líthinos staurós','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "Cruces de piedras talladas con imaginería religiosa enrevesada que actúan como monumentos sagrados que indican lugares sagrados, rememoran a los difuntos y celebran la divina providencia.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Contexto histórico del jachkar','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "Los jachkares, del armenio #weak khach#! («cruz») y #weak k'ar#! («piedra»), son estelas de piedra con tallas enrevesadas que presentan una cruz, a menudo situada en una roseta o rueda de eternidad. Únicos de la cultura cristiana armenia, señalan lugares sagrados, conmemoran eventos y victorias y sirven para recordar a los difuntos.\n\nLa tradición nació en el siglo IX por las cruces de madera erigidas por san Gregorio el Iluminador sobre templos paganos tras la conversión de Armenia en el año 301 d. C., y alcanzó su cenit en los siglos XII y XIII bajo los príncipes zakáridas. Cada jachkar es único, la obra de maestros talladores como Momik de Noravank, y se cree que algunos jachkares poseen poderes milagrosos y se han convertido en destinos de peregrinación."
 doctrine_parameter_tenet_khachkar_decision_unlock: "Se puede usar la [decision|El] [GetDecisionWithKey('pam_raise_khachkar_decision').GetName] durante #V 5#! años tras heredar de un pariente cercano de una [dynasty|El]"
