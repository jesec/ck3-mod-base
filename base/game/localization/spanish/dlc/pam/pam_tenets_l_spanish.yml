 pam_luke_16_11_greek: "[Glossary('Ei oũn en to adíko mamōna pistoì ouk egénesthe, tò alēthinòn tís hymĩn pisteúsei?', 'LUKE_16_11_GREEK_GLOSS')]" #εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
