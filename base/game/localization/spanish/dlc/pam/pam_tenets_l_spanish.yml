 pam_philippians_4_21_greek: "[Glossary('Aspásasthe pánta hágion en Christo Iēsoũ. aspázontai hymãs hoi sỳn emoì adelphoí.', 'PHILIPPIANS_4_21_GREEK_GLOSS')]" #ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
