 pam_matthew_12_32_latin: "[Glossary('Et quicumque dixerit verbum contra Filium hominis, remittetur ei: qui autem dixerit contra Spiritum Sanctum, non remittetur ei neque in hoc saeculo, neque in futuro.','MATTHEW_12_32_LATIN_GLOSS')]"
