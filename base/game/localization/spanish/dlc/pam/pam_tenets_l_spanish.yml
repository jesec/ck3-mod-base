 pam_acts_7_59_greek: "[Glossary('Kaì elithoboloun tòn Stéphanon epikaloúmenon kaì légonta; kýrie Iēsoũ, déxai tò pneũmá mou.', 'ACTS_7_59_GREEK_GLOSS')]" #καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου.
 pam_luke_22_19_greek: "[Glossary('Kaì labon árton eucharistesas éklasen kaì édōken autoĩs légōn; Toũtó estin tò sõmá mou tò hypèr hymõn didómenon; toũto poieĩte eis ten emen anάmnēsin.', 'LUKE_22_19_GREEK_GLOSS')]" #καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
 pam_1_corinthians_1_10_greek: "[Glossary('Parakalõ dè hymãs, adelphoí, dià toũ onómatos toũ kyríou hēmõn Iēsoũ Christoũ, hína tò autò légēte pántes kaì me e en hymĩn schísmata, ẽte dè katērtisménoi en to auto noï kaì en te aute gnome.', '1_CORINTHIANS_1_10_GREEK_GLOSS')]" #παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
 pam_1_corinthians_10_16_greek: "[Glossary('Tò poterion tẽs eulogías hò eulogoũmen, ouchì koinōnía estin toũ haímatos toũ Christoũ? tòn árton hòn klõmen, ouchì koinōnía toũ somatos toũ Christoũ estín?', '1_CORINTHIANS_10_16_GREEK_GLOSS')]" #τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστίν;
 pam_1_corinthians_10_17_greek: "[Glossary('hóti heĩs ártos, hèn sõma hoi polloí esmen, hoi gàr pántes ek toũ henòs ártou metéchomen.', '1_CORINTHIANS_10_17_GREEK_GLOSS')]" #ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
 pam_john_6_41_greek: "[Glossary('Egóggyzon oũn hoi Ioudaĩoi perì autoũ hóti eĩpen; Ego eimi ho ártos ho katabàs ek toũ ouranoũ', 'JOHN_6_41_GREEK_GLOSS')]" #ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ.
 pam_1_thessalonians_5_16_20_greek: "[Glossary('Pántote chaírete, adialeíptōs proseúchesthe, en pantì eucharistẽite; toũto gàr thélēma theoũ en Christo Iēsoũ eis hymãs. tò pneũma me sbénnyte, prophēteías me exoutheneĩte', '1_THESSALONIANS_5_16_20_GREEK_GLOSS')]" #πάντοτε χαίρετε, ἀδιαλείπτως προσεύχεσθε, ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς. τὸ πνεῦμα μὴ σβέννυτε, προφητείας μὴ ἐξουθενεῖτε
 pam_1_thessalonians_4_11_greek: "[Glossary('Kaì philotimeĩsthai hēsychάzein kaì prάssein tà ídia kaì ergάzesthai taĩs chersìn hymõn, kathos hymĩn parēngeílamen', '1_THESSALONIANS_4_11_GREEK_GLOSS')]" #καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν
 pam_proverbs_6_6_greek: "[Glossary('Noesei te parabolen kaì skoteinòn lógon rheseis te sophon kaì ainígmata.', 'PROVERBS_6_6_GREEK_GLOSS')]" #νοήσει τε παραβολὴν καὶ σκοτεινὸν λόγον ῥήσεις τε σοφῶν καὶ αἰνίγματα.
 pam_john_19_26_27_greek: "[Glossary('Iēsoũs oũn idon ten mētéra kaì tòn mathēten parestõta hòn ēgάpa légei te mētrí; Gýnai, íde ho hyiós sou. eĩta légei to mathēte; Íde hē metēr sou. kaì ap ekeínēs tẽs horas élaben ho mathētes auten eis tà ídia.', 'JOHN_19_26_27_GREEK_GLOSS')]" #Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ μητρί· Γύναι, ἴδε ὁ υἱός σου. εἶτα λέγει τῷ μαθητῷ· Ἴδε ἡ μήτηρ σου. καὶ ἀπ᾽ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
 pam_isaiah_7_14_greek: "[Glossary('Dià toũto dosei Kýrios autòs hymĩn sēmeĩon; idoù hē parthénos en gastrì héxei, kaì téxetai hyión, kaì kaléseis tò ónoma autoũ Emmanouel.', 'ISAIAH_7_14_GREEK_GLOSS')]" #διὰ τοῦτο δώσει Κύριος αὐτὸς ὑμῖν σημεῖον· ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει, καὶ τέξεται υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἐμμανουήλ·
 pam_proverbs_31_20_greek: "[Glossary('Ithi pròs tòn mýrmēka, o oknēré, kaì zelōson idon tàs hodoùs autoũ kaì genoũ ekeínou sophoteros;', 'PROVERBS_31_20_GREEK_GLOSS')]" #Ἰθι πρὸς τὸν μύρμηκα, ὦ ὀκνηρέ, καὶ ζήλωσον ἰδὼν τὰς ὁδοὺς αὐτοῦ καὶ γενοῦ ἐκείνου σοφώτερος·
 pam_revelation_12_1_greek: "[Glossary('Kaì sēmeĩon méga ophthē en to ourano, gyne peribeblēménē tòn helion, kaì hē selenē hypokάtō tõn podõn autẽs kaì epì tẽs kephalẽs autẽs stéphanos astérōn dodeka', 'REVELATION_12_1_GREEK_GLOSS')]" #καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα
 pam_acts_8_18_greek: "[Glossary('Idon dè ho Símōn hóti dià tẽs epithéseōs tõn cheirõn tõn apostólōn dídotai tò pneũma prosenenken autoĩs chremata', 'ACTS_8_18_GREEK_GLOSS')]" #ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
