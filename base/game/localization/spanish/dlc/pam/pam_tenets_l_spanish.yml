 CELESTIAL_HIERARCHY_DEVOTION_ACCEPTANCE_REASON: "[piety_level|E] relativo: $VALUE|=+0$"
 CELESTIAL_HIERARCHY_PUPPET_ACCEPTANCE_REASON: "Autoridad clerical frente a un [ruler|El] secular: $VALUE|=+0$"
 # Miles Christi tenet
 tenet_miles_christi_latin_name: "Miles Christi" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "Stratiōtēs christoũ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "Soldados de Cristo"
 tenet_miles_christi_latin_desc: "Alzaos firmes pues, ceñíos las espaldas con la verdad, y tened la rectitud como peto. Luchad la buena lucha de la fe como un verdadero soldado de Cristo.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Contexto histórico del miles Christi','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "Todo cristiano fiel debe estar preparado para sufrir por Cristo, mantenerse firme contra las fuerzas espirituales de la maldad y soportar las penalidades con el valor de un soldado.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Contexto histórico del stratiōtēs christoũ','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "Se llama a los fieles a ser soldados espirituales que luchen contra el pecado y el mal con la armadura de Dios, listos para padecer por Cristo como los soldados padecen por su comandante.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Contexto histórico de los soldados de Cristo','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "El concepto del «soldado de Cristo» (miles Christi) tiene raíces profundas en la tradición cristiana; se origina en las epístolas de san Pablo donde usa metáforas militares para describir la vida espiritual. Durante el periodo medieval, este concepto se ha aplicado tanto a la guerra literal como la espiritual.\n\nLas órdenes militares como los caballeros templarios y los hospitalarios personificaron este ideal al combinar la disciplina monástica con la destreza marcial. Bernardo de Claraval en su «De laude novae militiae» alabó a estos monjes-guerreros como ejemplos de virtud cristiana que no luchaban por las ganancias materiales, sino por la defensa de la cristiandad."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Finalizar una [war|El] con [white_peace|El] como defensor contra la misma [faith|El] proporciona #P 100#! de [piety|El] @piety_icon! y [legitimacy|El] @legitimacy_icon!, cada valor aumenta según el nivel de [title|El] de ambos bandos, y #P 5#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Comandar un [siege|El] o una [battle|El] victoriosa proporciona #P 3#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "Ganar [battles|El] contra otra [religion|El] mientras se porta un arma que es una [holy_relic|El] la mejora mediante cuatro bendiciones, hasta un máximo de #P 50#! victorias"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "Caridad"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "Aquello que hagáis por mis hermanos, lo haréis por mí. Dar limosna y ocuparse de los pobres no son meros deberes cívicos, sino un modo de acercarnos al mismo Cristo.\n\n[Glossary('Contexto histórico de la caritas','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "La philanthrōpia —el amor a la humanidad— encontró su máxima expresión en los hospitales, hospicios y limosnas eclesiásticos e imperiales de la Nueva Roma. Dar de comer al hambriento y rescatar al cautivo es imitar a Cristo, que se vació por nuestro bien.\n\n[Glossary('Contexto histórico de la philanthrōpía','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "La fe valora la entrega generosa de limosnas, el cuidado de los pobres y la caridad institucional como deber cristiano vital, puesto que sigue a los padres y el ejemplo de los primeros hospicios y hospitales.\n\n[Glossary('Contexto histórico de la caridad','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "En la cristiandad bizantina, la philanthrōpia se refería tanto a la virtud del amor universal como a las instituciones concretas —hospitales, xenodochia, orfanatos y limosnerías— apoyadas por emperadores, obispos y fieles. Basilio de Cesarea, Juan Crisóstomo y emperadores posteriores, como Justiniano, vincularon la legitimidad imperial con el cuidado de los necesitados. La Iglesia no glorificaba la guerra como un camino para la santidad; insistía en que la riqueza y el poder se justifican en parte por cómo ayudan a los pobres."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "Puedes nombrar un [GetCourtPositionType('high_almoner_court_position').GetName|l] a partir de un rango de [county|El] y superior"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Rescatar a otro [character|El] concede [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon! en función del [gold|El] @gold_icon! que se pague"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[characters|E] de carácter [GetTrait('generous').GetName( GetNullCharacter )|l]: #P +10#! [opinion|El] de la misma fe, #P +20 %#! [development_growth|El]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[characters|E] con el rasgo [GetTrait('greedy').GetName( GetNullCharacter )]: #N -10#! de [opinion|El] de la misma fe, #N -25 %#! de ganancia de [piety|El] @piety_icon!"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "Enviar un [gift|El] a un [character|El] con [Concept('debt', 'deudas')|E] da [prestige|El] @prestige_icon! y [piety|El] @piety_icon!"
 pam_philanthropia_ransom_toast: "Por tu dogma personal [GetTenetType('tenet_philanthropia').GetName( GetPlayer.GetRite )]"
 # Scholasticism tenet
 tenet_scholasticism_latin_name: "Sacra doctrina" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "Escolástica"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "La búsqueda del conocimiento es una forma de adoración, pues para entender la creación, debemos acercarnos a comprender al Creador. Busca la sabiduría y te será concedida.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Contexto histórico de la sacra doctrina','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "La fe y la razón no se oponen, sino que se complementan, porque Dios nos dio mentes para buscar la verdad y corazones para amarle. Mediante el estudio y la contemplación, ascendemos a un conocimiento superior.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Contexto histórico del skholastikē','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "Mediante una indagación intelectual rigurosa y el método dialéctico, se pueden reconciliar fe y razón y alcanzar una comprensión más profunda de la verdad divina.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Contexto histórico de la escolástica','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "La escolástica fue el método dominante de aprendizaje en las universidades europeas medievales y alcanzó su cénit en los siglos XII y XIII. Buscaba reconciliar la teología cristiana con la filosofía clásica, en particular las obras de Aristóteles.\n\nGrandes pensadores escolásticos como Anselmo de Canterbury, Pedro Abelardo, Alberto Magno y Tomás de Aquino desarrollaron acercamientos sistemáticos a la teología que recalcaban el rigor lógico y el debate. La «Summa theologica» de Tomás de Aquino sigue siendo el logro supremo del método escolástico al intentar sintetizar todo el conocimiento humano en un marco cristiano."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Visitar [points_of_interest|El] en [counties|El] [GetReligionByKey('judaism_religion').GetAdherentNamePlural], [GetReligionByKey('islam_religion').GetAdherentNamePlural] y [GetReligionByKey('zoroastrianism_religion').GetAdherentNamePlural] da [piety|El] @spiritual_fulfillment_icon!, [learning|El], [experience|El] y [spiritual_fulfillment|El] @piety_icon! adicionales"
 doctrine_parameter_tenet_scholasticism_university_bonus: "Completar una [GetActivityType('activity_adult_education').GetName|l] concede un [modifier|El] [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip] de larga duración"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[scheme_success_chance|E] de [GetScheme('study_scripture').GetTypeName]: #P +10 %#! [success_chance_i]"
 doctrine_parameter_tenet_scholasticism_university_chance: "Probabilidad anual de ganar [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip] sin estudiar, mejorada mediante el [learning|El], el [piety_level|El] y los idiomas conocidos"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "Hacer una [GetActivityType('activity_adult_education').GetName] cuesta un #P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')] %#! menos de [gold|El] @gold_icon!"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization( HasDlcFeature( 'legacy_of_persia' ), 'tenet_scholasticism_court_scholar_effect', 'blank_line' )]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "Puedes nombrar a un [GetCourtPositionType('court_scholar_court_position').GetName|l] sin la [culture_tradition|El] $tradition_fp3_beacon_of_learning_name$, sin #P ningún salario#!"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "La búsqueda del conocimiento es una forma de adoración, pues para entender la creación, debemos acercarnos a comprender al Creador."
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "Un estudio itinerante"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.Custom('ES_ElLa')|U] [pam_studium_scholar.GetTitledFirstName|l] se ha pasado el último trecho del camino discutiendo el tema con vos y, en algún punto entre una [barony|El] y la siguiente, decidió que sería mejor zanjar el asunto por escrito."
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "Diliges proximum" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn plēsíon" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "Amarás al prójimo"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "Miremos a los demás como si fuera a través de Tus ojos, menos juzgadores, más amorosos y considerémoslos como nosotros, como una obra que Tú completarás en su debido momento con Tus manos.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Contexto histórico del diliges proximum','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "¿Qué hay más dulce y hermoso que el amor del prójimo? El amor es una bendición, y el odio, un tormento. Todas las leyes y los profetas sostienen estos dos mandamientos: amarás al Señor tu Dios con todo tu corazón y al prójimo como a ti mismo\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Contexto histórico del agapēseis tòn plēsíon','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "El amor al prójimo es inseparable del amor de Dios, y mediante obras de caridad y misericordia, cumplimos plenamente la ley divina.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Contexto histórico del amarás al prójimo','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "El mandamiento de amar al prójimo es vital en la ética cristiana, sacado del Levítico 19:18 y elevado por Cristo hasta situarse junto al amor a Dios como resumen de toda la ley divina. Los primeros padres de la Iglesia, como Clemente de Alejandría y Juan Crisóstomo, recalcaron que el amor verdadero debe extenderse más allá de la familia y amigos y abarcar a toda la humanidad, incluidos extraños y enemigos. Esta enseñanza inspiró el desarrollo de instituciones benéficas cristianas, hospitales y la práctica de la donación de limosnas durante todo el periodo medieval."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "Los [counties|El] de esta [faith|El] con #P 60+#! de [county_opinion|El] pueden conseguir el [modifier|El] [GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "Los [buildings|El] de tipo $building_type_hospices_01$ reducen el [travel_danger|El] en el [county|El] entre #P 3#! y #P 10#!, y esto sube con cada nivel"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "Los [buildings|El] de tipo $building_type_hospices_01$ conceden de #P +2#! a #P +10#! de [epidemic_resistance|El] en la [province|El], y esto sube con cada nivel"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "La [scheme_success_chance|El] de [GetScheme('sway').GetTypeName] contra [characters|El] de fuera de tu [realm|El]: #P +20 %#! [success_chance_i]"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "Aceptación de #high $offer_vassalization_interaction$#!: #P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$: $VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "El amor al prójimo es inseparable del amor a Dios; mediante obras de caridad y misericordia obedecemos la ley divina."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "Divinum officium" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "Theía Leitourgía" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "Liturgia divina"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "La liturgia sagrada es el cielo en la tierra, donde nos unimos a los ángeles y los santos en adoración eterna. Santo, santo, santo es el Señor del universo, llena está la tierra de Su gloria.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Contexto histórico del divinum officium','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "En la liturgia divina los fieles toman parte en la adoración celestial y trascienden el tiempo y el espacio para presentarse ante el trono de Dios con los querubines y serafines.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Contexto histórico de la theía leitourgía','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "La liturgia es la principal expresión de la fe, donde se encuentran el cielo y la tierra, y los fieles toman parte en la eterna adoración de Dios junto a los ángeles y los santos.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Contexto histórico de la liturgia divina','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "La liturgia divina se desarrolló a partir de los primeros servicios de culto cristiano, con la liturgia de san Basilio y la de san Juan Crisóstomo convertidas en las formas estándar en el cristianismo oriental. Estas liturgias reforzaron la participación mística de los fieles en el culto celestial, con ceremonias elaboradas, incienso, iconos y cánticos para crear una experiencia sensorial de lo divino. La liturgia no se entendía solo como la mera adoración humana a Dios, sino como la entrada de los fieles a la adoración eterna del cielo, que trasciende los límites del tiempo y el espacio."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "Concede [GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "Concede [GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "Tu [court_chaplain|El] gana #P +2#! de [learning|El]"
 tenet_aniconism_latin_name: "Iconomachia" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "Oh, Señor. Solo Tú eres digno de adoración. Sálvanos de la trampa de los ídolos, para que Te adoremos a Ti en espíritu y en verdad, no mediante imágenes hechas por manos humanas, sino a través de los corazones puros que alzamos hacia Ti.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Contexto histórico de la iconomachia','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "La veneración de imágenes no está aprobada por las Escrituras ni por la tradición de los padres. La iconoclasia es la verdadera enseñanza de la Iglesia que purifica a los fieles de la idolatría a las imágenes.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Contexto histórico del eikonomakhía','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "No te fabricarás ídolos ni figura de nada. La adoración de ídolos es una corrupción de la fe verdadera.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Contexto histórico del aniconismo','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "El rechazo, la prohibición y la destrucción de imágenes religiosas tiene raíces profundas en las tradiciones abrahámicas. En el cristianismo, su expresión más significativa fue la primera iconoclasia bizantina (726-843 d. C.) iniciada por el emperador León III y continuada por Constantino V; un periodo de destrucción generalizada de imágenes religiosas y de persecución de quienes veneraban iconos.\n\nLos iconoclastas sostenían que la veneración de iconos violaba la prohibición bíblica contra imágenes talladas. El segundo concilio de Nicea del 787 d. C. condenó la iconoclasia al señalar las similitudes entre la adoración a través de los iconos y del Evangelio escrito. La iconoclasia resurgió bajo León V en el 814 d. C. Tendencias anicónicas similares aparecieron más tarde en distintos movimientos protestantes."
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "Alexandrinē katēkhēsis" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "Oh, Cristo, sabiduría eterna de Dios, ilumina nuestras mentes para que podamos percibir los misterios ocultos de Tu Sagrada Escritura. Danos ojos para ver más allá de la letra, el espíritu que da la vida.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Contexto histórico de la catechesis alexandrina','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "La tradición alejandrina sostiene que la sabiduría divina se revela mediante la interpretación alegórica de las Escrituras. Cristo es el Logos, el Verbo divino a través del cual se accede a conocer toda la verdad.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Contexto histórico de la alexandrinē katēkhēsis','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "La escuela alejandrina recalca la interpretación alegórica de las Escrituras y la síntesis de la teología cristiana con la filosofía griega en la búsqueda del significado espiritual profundo bajo el texto literal.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Contexto histórico de la escuela catequística de Alejandría','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "La escuela catequística de Alejandría, fundada a finales del siglo II, fue la primera institución cristiana de educación superior. Con maestros como Clemente de Alejandría y Orígenes, desarrolló un método sofisticado de interpretación bíblica que buscaba significados alegóricos y espirituales en las Escrituras. La escuela combinó la teología cristiana con la filosofía platónica al argüir que el conocimiento griego abrió el camino al Evangelio.\n\nLos métodos exegéticos y especulaciones teológicas de Orígenes influyeron profundamente en el cristianismo oriental, si bien el énfasis de la escuela en el método alegórico contrastaba con el acercamiento más literal de la escuela de Antioquía."
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "Filius adoptivus" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "Adopcionismo"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "Oh, Padre, que te fijaste en Jesús, el hombre justo y Lo elegiste como Tuyo propio, haz que nosotros también seamos dignos de la adopción. Igual que Tú Le elevaste de las aguas y Lo declaraste Tu amado, elévanos también a nosotros de nuestra pequeñez hasta Tu divina familia.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Contexto histórico del filius adoptivus','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "Oh, Dios, que elevas al humilde y eliges al justo para Ti, Te alabamos por el misterio de la adopción. Igual que Cristo fue elevado a la condición de hijo por Tu gracia, que también a nosotros se nos cuente entre Tus hijos.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Contexto histórico de la hyiothesía','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "Oh, Señor, ayúdanos a comprender el misterio de la exaltación de Tu Hijo. Que podamos seguir Su ejemplo de rectitud para que nosotros también seamos llamados hijos de Dios.\n\n$pam_mark_1_11_default$\n\n[Glossary('Contexto histórico del adopcionismo','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "El adopcionismo sostiene que Jesús nació siendo un hombre normal que posteriormente fue «adoptado» como Hijo de Dios, generalmente en su bautismo, cuando el Espíritu Santo cayó sobre él. Sus primeras formas aparecieron en el siglo II, con Teódoto de Bizancio, que enseñaba un monarquianismo dinámico que recalcaba la unidad de Dios.\n\nEsta enseñanza reapareció en la Hispania del siglo VIII con el arzobispo Elipando de Toledo y el obispo Félix de Urgel, que distinguían entre la naturaleza divina de Cristo, eternamente engendrada, y su naturaleza humana, adoptada. El concilio de Fráncfort del 794 d. C. condenó el adopcionismo hispano como herejía. Pese a su condena, las ideas adopcionistas influyeron en movimientos antitrinitarios posteriores."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "La [interaction|El] [adopt|E] siempre está disponible, sin los requisitos habituales (aunque su objetivo debe seguir siendo elegible y una pareja de matrimonio subordinada no puede adoptar)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "Los [vassals|El] y niños que siguen este [rite|El] no se resienten por una [Concept( 'adopt', 'adopción' )|E] (de #N -10#! a #N -25#! de [opinion|El] evitada)"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "Siempre tienes disponible la [interaction|El] [adopt|E], sin los requisitos habituales (aunque su objetivo debe seguir siendo elegible)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "[legitimacy|E] @legitimacy_icon!, [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon! al [adopt|El] a un [character|El]"
 pam_adoptionism_adopt_sp_toast: "Dogma personal de [GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "La [interaction|El] [Concept( 'legitimized_bastard', 'Legitimar bastardo')|E] cuesta un #P 50 %#! menos de [prestige|El] @prestige_icon!, siempre que tu [faith|El] lo permita"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "Se puede usar la [interaction|El] [Concept( 'legitimized_bastard', 'Legitimar bastardo')|E] con tus propios [children|El] o de otra [house|El], siempre que tu [faith|El] lo permita"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "Énoplon proskýnēma" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "Oh, Señor, da fuerza a nuestros brazos al tomar la cruz en Tu santo nombre. Guía nuestros pasos en el viaje sagrado para que podamos defender la fe y liberar los lugares santos de manos del infiel.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Contexto histórico de la peregrinatio armata','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "Se convoca a los fieles a seguir a Cristo, no solo espiritualmente, sino en defensa de los lugares santos. La peregrinación armada es un acto de devoción, un viaje de fe protegido por la espada.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Contexto histórico del énoplon proskýnēma','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "La peregrinación a los lugares santos es un deber sagrado y los fieles están convocados a proteger estos lugares y a los demás peregrinos por la fuerza de las armas si fuere preciso.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Contexto histórico de las peregrinaciones armadas','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "Una combinación de la práctica espiritual de visitar lugares sagrados con la acción militar para defenderlos o retomarlos. Las cruzadas, que empezaron en 1095 con la llamada del papa Urbano II en el concilio de Clermont, representan la forma más organizada de peregrinación armada. A los cruzados se les concedían indulgencias plenarias y se consideraba que su servicio militar era un acto de penitencia y devoción.\n\nEl concepto partía de tradiciones anteriores de guerras penitenciales y de la defensa del cristianismo contra amenazas externas, y transformó la peregrinación de un viaje pacífico a una expresión militante de la fe."
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "Populus Dei" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "Laòs Theoũ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "Somos el linaje elegido, un sacerdocio real, una nación santa, destacada por Dios. Proclamemos Sus poderosos logros y caminemos dignos de nuestra vocación como Su pueblo.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Contexto histórico del populus Dei','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "Convocados a salir de las tinieblas y a Su maravillosa luz, los fieles forman una nación santa, un pueblo para la posesión de Dios. Nuestra identidad se encuentra en Cristo, quien ha hecho de nosotros un solo cuerpo.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Contexto histórico del laòs Theoũ','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "Los fieles están unidos como el pueblo elegido de Dios, una comunidad separada del mundo que comparte una identidad común y un propósito en Cristo.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Contexto histórico de la identidad comunal','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "El concepto de la Iglesia como el «pueblo de Dios» proviene de las imágenes del Antiguo Testamento de Israel como el pueblo elegido de Dios, reinterpretado a través de los ojos del Nuevo Testamento. Los primeros cristianos se entendían como un nuevo Israel, unido no por sangre ni etnia, sino por la fe en Cristo.\n\nEsta identidad comunal transcendía los límites sociales, étnicos y nacionales y creaba una hermandad universal. El Lumen gentium del concilio vaticano segundo dio un papel importante al «pueblo de Dios» como una imagen eclesiológica que recalcaba la naturaleza peregrina de la Iglesia y la dignidad común de todos los bautizados."
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "Consolamentum"
 tenet_consolamentum_latin_desc: "Oh, Señor, hemos luchado el noble combate, terminado la carrera, conservado la fe. Recibe a Tu servidor en el consuelo del Espíritu, para que su alma se libere de los lazos de este mundo material.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Contexto histórico del consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "A través de la imposición de manos y la oración de los fieles, el espíritu recibe el consuelo divino. Se ha luchado el noble combate, se ha terminado la carrera y la fe se ha mantenido hasta el final.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Contexto histórico del paráklēsis','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "Mediante el sagrado ritual del consuelo espiritual, los creyentes reciben el Espíritu Santo y se preparan para su viaje de este mundo al siguiente.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Contexto histórico del consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "El consolamentum era el sacramento central de la fe cátara, que combinaba elementos del bautismo, la confirmación, la ordenación y la extrema unción. Administrado mediante la imposición de manos, se creía que confería el Espíritu Santo y liberaba el alma del mundo material.\n\nPara la mayoría de los creyentes, solo se recibía en el lecho de muerte, mientras que quienes lo recibían en plena salud se convertían en «perfecti» o «bons hommes», entregados a una vida de ascetismo estricto. El rito tiene sus raíces en las primitivas prácticas cristianas del bautismo espiritual y muestran una posible influencia de tradiciones bogomilas orientales."
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "Hieròs gámos" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "Oh, Señor, no es por lujuria que nos unimos en esta unión sagrada, sino con sinceridad y en la verdad. Concédenos que encontremos la bendición y que envejezcamos juntos al tiempo que conservamos la santidad de nuestro lazo.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Contexto histórico del matrimonium sacrum','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "El matrimonio en la comunidad de la fe conserva el linaje sagrado y mantiene la pureza ante Dios. No en la lujuria, sino en la verdad, tales uniones son bendecidas, que marido y mujer encuentren la bendición.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Contexto histórico del hieròs gámos','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "El matrimonio sagrado dentro de la comunidad de fe conserva la puridad espiritual y preserva la santidad del linaje religioso a lo largo de las generaciones.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Contexto histórico del matrimonio divino','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "El concepto de matrimonio sagrado o endogamia, desposarse solo dentro de comunidades religiosas, tiene raíces antiguas en muchas tradiciones. En el zoroastrianismo, se practicaba el xwedodah (matrimonio entre parientes) para conservar el mérito espiritual y la propiedad familiar. La práctica aspiraba a mantener la pureza religiosa, consolidar el poder espiritual y perpetuar los linajes sagrados y reales.\n\nSi bien polémico y a menudo mal entendido por observadores externos, los practicantes consideraban tales matrimonios como el cumplimiento de los mandamientos divinos para preservar la santidad de su comunidad."
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "Oh, sabiduría divina, escondida antes de los siglos, revélanos los misterios del reino espiritual. Libera nuestras almas de la prisión de la materia para que podamos ascender a la plenitud de la luz y el conocimiento.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Contexto histórico del gnosis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "La verdadera salvación llega mediante el gnosis, el conocimiento secreto de las cosas divinas ocultas del mundo material. Narramos la sabiduría de Dios en misterio, la sabiduría secreta predestinada antes de los siglos para nuestra gloria.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Contexto histórico del gnõsis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "La salvación se logra mediante el conocimiento espiritual secreto que revela la chispa divina de su interior y el sendero para escapar del mundo material creado por el demiurgo.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Contexto histórico del gnosticismo','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "El gnosticismo engloba diferentes movimientos religiosos del cristianismo primitivo que recalcaban la salvación a través del gnosis, o el conocimiento esotérico. Los gnósticos solían considerar el mundo material la creación imperfecta de una deidad menor (el demiurgo), mientras que el verdadero Dios se mantenía oculto y trascendente. Se creía que las almas humanas contenían chispas divinas atrapadas en la materia, que se podían liberar mediante el conocimiento secreto.\n\nMaestros gnósticos importantes fueron Valentín, Basílides y Marción. Padres de la Iglesia como Ireneo y Tertuliano escribieron extensamente contra las enseñanza gnósticas, consideradas desviaciones heréticas del cristianismo apostólico."
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "Pax et bonum" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "Ptōkhoì kērykes" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "Oh, Señor, igual que Tú mandaste a Tus apóstoles sin oro ni plata, que también nosotros marchemos en pobreza, confiando solo en tu providencia. Concédenos la gracia de predicar Tu evangelio en sencillez y verdad.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Contexto histórico de pax et bonum','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "Siguiendo el ejemplo de Cristo, que no tenía lugar donde reposar la cabeza, los predicadores mendicantes abrazan la pobreza voluntaria. Sin llevar nada para el viaje, confían en la provisión de Dios mientras predican el Evangelio.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Contexto histórico de los ptōkhoì kērykes','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "Órdenes religiosas dedicadas a la pobreza y la predicación que vagan sin posesiones para propagar la fe y confían en la divina providencia para sus necesidades diarias.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Contexto histórico de los predicadores mendicantes','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "Las órdenes mendicantes emergieron en el siglo XIII como respuesta a la riqueza y sofisticación de la Iglesia oficial. El segundo concilio de Lyon de 1274 reconoció cuatro órdenes principales: carmelitas, franciscanos de Francisco de Asís, dominicos de Domingo de Guzmán y agustinos.\n\nAl contrario que las órdenes monásticas que tenían posesiones colectivas, las mendicantes abrazaban la pobreza colectiva, así como la individual, y vivían casi exclusivamente de las limosnas. Se centraban en núcleos urbanos, predicaban en pueblos y ciudades y les daban importancia a la educación y la formación. El ideal mendicante provenía directamente de las instrucciones de Cristo a los apóstoles en Mateo 10:9-10 de no llevar nada en su viaje."
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "Quinque sedes" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "Allá donde los fieles se reúnen en nombre de Cristo, Él está entre ellos. Las cinco grandes sedes de Roma, Constantinopla, Alejandría, Antioquía y Jerusalén son los pilares de la Iglesia.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Contexto histórico de quinque sedes','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "La Iglesia está gobernada por los cinco patriarcados fundados en los tiempos de los apóstoles. Allá donde dos o tres se reúnen en Su nombre, Cristo está presente. Su autoridad se ejerce por todo el mundo.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Contexto histórico de la pentarkhía','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "La Iglesia universal está gobernada por cinco antiguas sedes patriarcales, cada una con autoridad sobre su región y mantienen la unidad mediante la comunión conciliar.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Contexto histórico de la pentarquía','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "La pentarquía era el modelo de gobierno de la Iglesia, que reconocía cinco sedes patriarcales principales: Roma, Constantinopla, Alejandría, Antioquía y Jerusalén. Oficializada en el concilio de Calcedonia del 451 d. C., reflejaba la importancia política de estas ciudades en el Imperio romano. Cada patriarca ejercía la autoridad sobre su región y las disputas se solventaban en concilios ecuménicos.\n\nEste sistema jamás fue aceptado completamente por Roma, que reclamaba la supremacía papal, y se vio sacudido por el asedio de Alejandría en el 641 d. C. y roto tras el Gran Cisma de 1054. El cristianismo ortodoxo oriental siguió respetando el ideal pentárquico cuando más adelante se fundaron nuevos patriarcados en Rusia, Serbia y otros lugares."
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "Fides Indefessa" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "Pístis akatapónētos" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "Oh, Señor, refuerza nuestra fe, esa sustancia de aquello que anhelamos, la convicción de aquello invisible. Que nos mantengamos firmes contra toda adversidad, sin vacilar nunca en nuestra convicción por ti.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Contexto histórico de la fides indefessa','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "La fe es la seguridad de aquello que anhelamos, la seguridad en aquello invisible. Mediante una creencia inquebrantable, los fieles superan todas las pruebas y persecuciones y se mantienen firmes hasta la muerte.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Contexto histórico de la pístis akatapónētos','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "Una fe que no se puede quebrantar por persecuciones, pruebas o dudas. Los creyentes son llamados a mantenerse firmes en sus convicciones sin importar las consecuencias materiales.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Contexto histórico de la fe constante','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "Los ejemplos de mártires y confesores han sido presentados como modelos a seguir en toda la historia del cristianismo. Desde las primeras persecuciones bajo Nerón y Diocleciano hasta los padecimientos posteriores, a misioneros que viajan y mueren al intentar convertir a poblaciones hostiles, como Adalberto de Praga, los cristianos han sido llamados a mantener la fe hasta la muerte.\n\nLa convicción de que la fe debe ser defendida, preservada y difundida sin importar el coste ha inspirado a muchos movimientos monásticos y empresas misioneras. Las historias de santos que soportaron la tortura y la ejecución por sus creencias han servido para reforzar la resolución de los fieles y ofrecer un camino de salvación garantizado."
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "Miafisismo"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "El concilio de Éfeso no fue un latrocinio. El error de Calcedonia debía corregirse. La naturaleza divina y humana están unidas sin confusión ni cambio, ni división ni separación en la única persona de Cristo.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Contexto histórico del miaphysitismus','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "El concilio de Éfeso no erró al rehabilitar a Eutiquio y condenar a Flaviano. Cristo posee una única naturaleza unida humana y divina, plenamente Dios y plenamente hombre, unidos sin confusión ni separación.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Contexto histórico del miaphysitismós ','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "Cristo tiene una naturaleza única que es tanto divina como humana, unida inseparablemente en la encarnación.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Contexto histórico del miafisismo','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "Del griego «mia», #weak una#!, y «physis», #weak naturaleza#!, el miafisismo sostiene que en Cristo, las naturalezas divina y humana están unidas en una sola naturaleza compuesta, sin confusión ni separación. Defendida por Cirilo de Alejandría, que empleaba la fórmula #weak mia physis tou theou logou sesarkōménē#! (una naturaleza encarnada de Dios el Verbo), se distingue del monofisismo por conservar la realidad completa de ambas naturalezas dentro de la unidad.\n\nEl concilio de Calcedonia del 451 d. C. rechazó esta fórmula en favor del diofisismo (dos naturalezas), y las iglesias ortodoxas orientales (copta, armenia, etíope y siriaca) se separaron de la Iglesia bizantina y han mantenido su miafisismo hasta hoy en día."
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[characters|E] con el rasgo [GetTrait('honest').GetName( GetNullCharacter )]: #P +10 %#! de ganancia de [piety|El] @piety_icon! y #P +10#! de [opinion|El] deL [clergy|El]"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[characters|E] con el rasgo [GetTrait('deceitful').GetName( GetNullCharacter )]: #N -10 %#! de ganancia de [piety|El] @piety_icon! y #N -10#! de [opinion|El] deL [clergy|El]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! de [piety|El] [piety_i] cada año mientras tu [liege|El] no comparta tu [faith|El]"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "Hesicasmo"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "Oh, Señor, concédenos la gracia de la santa quietud. Que Te encontremos a ti, que vives en la luz inaccesible. Enséñanos a rezar sin cesar, que nuestros corazones se conviertan en templos de Tu presencia.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Contexto histórico del hesychasmus','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "Señor Jesucristo, Hijo de Dios, ten piedad de mí, un pecador. Mediante la paz de cuerpo y mente, mediante la repetición incesante de la plegaria del corazón, que pueda elevarme a la theoria, la visión de la luz divina increada.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Contexto histórico del hēsykhasmós','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "Mediante la paz interior, la oración contemplativa y la repetición de la plegaria de Jesús, los fieles pueden experimentar la comunión directa con Dios y contemplar Su luz increada.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Contexto histórico del hesicasmo','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "El hesicasmo, del griego #weak hēsykhía#!, que significa quietud, es una tradición contemplativa del cristianismo oriental que pone el foco en el rezo del corazón y tiene raíces en las prácticas de los padres del desierto de Egipto del siglo IV. La repetición de la plegaria de Jesús,#weak  Señor Jesucristo, Hijo de Dios, ten piedad de mí, pecador#! se convirtió en la práctica central de la espiritualidad hesicasta, coordinada a menudo con la respiración y los latidos del corazón.\n\nEn el siglo XIV, san Gregorio Palamás defendió a los monjes hesicastas del monte Athos y su concepto de la luz del Tabor, la luz divina increada de la Transfiguración, contra las acusaciones de herejía de Barlaam de Calabria. Los concilios de Constantinopla de 1341 y 1351 respaldaron a Palamás y confirmaron el hesicasmo como parte de la doctrina ortodoxa."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "#P Aumento#! de [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por tomar la [decision|El] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName] en tu [capital|El]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "Las #high $spiritual_counsel_interaction$#! del [clergy|El] de este [rite|El] proporcionan más [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "[characters|E] con el rasgo [GetTrait('patient').GetName( GetNullCharacter )]: #P +10 %#! de ganancia de [piety|El] @piety_icon! y #P +10 %#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[characters|E] con el rasgo [GetTrait('impatient').GetName( GetNullCharacter )]: #N -10 %#! de ganancia de [piety|El] @piety_icon!"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[characters|E] de carácter [GetTrait('journaller').GetName( GetNullCharacter )], [GetTrait('contrite').GetName( GetNullCharacter )], [GetTrait('confider').GetName( GetNullCharacter )] y [GetTrait('flagellant').GetName( GetNullCharacter )]: #P +10 %#! de pérdida de [stress|El] y #P +5 %#! de ganancia de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "Ganancia de [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon! al librarse de un nivel de [stress|El] (como mucho una vez al año)"
 pam_hesychasm_meditation_toast: "Por tu [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l]: bonificación por meditar en silencio en tu hogar"
 pam_hesychasm_stillness_toast: "Por tu [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l]: paz de corazón"
 hesychasm_anachoresis_mortification_exclusivity_desc: "Los personajes solo pueden tener uno de estos [core_tenets|El] a la vez: [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )|l], [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )|l], [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l], [GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )|l]"
 # Anachoresis tenet
 tenet_anachoresis_latin_name: "Vita eremitica" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "Anacoresis"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "Oh, Señor, igual que Tú llevaste a Tu Hijo al desierto para prepararlo para Su ministerio, llévanos también al desierto de nuestros corazones. Que en soledad y silencio podamos escapar de las distracciones del mundo y solo a Ti encontremos.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Contexto histórico del vita eremitica','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "Benditos sean quienes se apartan del mundo, pues ellos encontrarán a Dios en el silencio del desierto. Si los profetas moraron en cavernas y hoyos en la tierra, igual hacen los servidores de Dios que buscan la soledad para luchar contra las pasiones.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Contexto histórico del anakhōrēsis','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "Al apartarse de la sociedad terrenal al desierto, los fieles pueden lograr pureza espiritual, someter sus pasiones y acercarse a Dios mediante la oración en solitario y la disciplina ascética.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Contexto histórico de la anacoresis','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "Anacoresis, del griego #weak anakhorēsis#!, que significa «retiro», era la práctica de los ermitaños cristianos que se retiraban de la sociedad al desierto en busca de una vida de oración, ayuno y combate espiritual contra las fuerzas demoníacas. Este movimiento comenzó en Egipto en el siglo III con san Pablo de Tebas, a quien se considera tradicionalmente el primer eremita cristiano, y que huyó de la persecución del emperador Decio al desierto tebano hacia el año 250 d. C.\n\nLos anacoretas siguieron siendo algo habitual a lo largo de la Edad Media, viviendo en celdas aisladas adosadas a monasterios y recibiendo la eucaristía a través de un ventanuco llamado hagioscopio. Textos de orientación como la «Ancrene Wisse» de la Inglaterra del siglo XIII establecían las normas para ermitaños de ambos sexos."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "Gana el [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "#P Aumento#! de [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por tomar la [decision|El] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName] lejos de tu [capital|El]"
 religious_decision.0211_anachoresis_tt: "#EMP Por tu [personal_tenet|El] [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetFaith )]:#!"
 doctrine_parameter_tenet_anachoresis_always_cave_hermit: "Desbloquea el [court_position|lE] de [GetCourtPositionType('cave_hermit_court_position').GetName()|l]"
 tenet_anachoresis_always_cave_hermit_name: "el [court_position|El] de [GetCourtPositionType('cave_hermit_court_position').GetName()|l]"
 pam_anachoresis_meditation_toast: "Por tu [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetFaith )|l]: bonificación por meditar en aislamiento"
 pam_anachoresis_tenet_title: "[core_tenet|E] $tenet_anachoresis_default_name$"
 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "Mortificatio Carnis" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs sarkós" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "Mortificación de la carne"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "Oh, Señor, concédenos la gracia para crucificar nuestra carne con sus pasiones y deseos. Que mediante el santo sufrimiento compartamos la pasión de Cristo y mortifiquemos los actos del cuerpo, para que podamos vivir de verdad.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Contexto histórico de la mortificatio carnis','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "Mediante ayunos, vigilias y mortificación corporal, los siervos de Dios dominan la carne y la someten para que el espíritu pueda remontar hacia el cielo.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Contexto histórico del nekrōsis tẽs sarkós','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "Los fieles mortifican la carne y sus deseos pecaminosos, compartiendo así el sufrimiento de Cristo para purificar el alma y lograr la perfección espiritual.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Contexto histórico de la mortificación de la carne','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "El [trait|El] [GetTrait('scarred').GetName( GetNullCharacter )] concede [piety|El] @piety_icon! y [opinion|El] de los fieles"
 doctrine_parameter_tenet_mortification_revel_bonus: "Obtienes [spiritual_fulfillment|El] @spiritual_fulfillment_icon! y el [trait|El] [GetTrait('flagellant').GetName( GetNullCharacter )] cuando tomas la [decision|El] [GetDecisionWithKey('stress_loss_flagellant_decision').GetName]"
 doctrine_parameter_tenet_mortification_holy_scars: "Se gana el [trait|El] [GetTrait('scarred').GetName( GetNullCharacter )] al abrazar este [personal_tenet|El]"
 doctrine_parameter_tenet_mortification_suffering_sanctifies: "Ganas [piety|El] @piety_icon! y pierdes [stress|El] cada vez que sufres una herida"
 doctrine_parameter_tenet_mortification_mortify_flesh: "Puede usar la [decision|El] [GetDecisionWithKey('stress_loss_flagellant_decision').GetName]"
