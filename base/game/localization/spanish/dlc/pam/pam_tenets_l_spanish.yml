 pam_john_19_26_27_latin: "[Glossary('Cum vidisset ergo Jesus matrem, et discipulum stantem, quem diligebat, dicit matri suae: Mulier, ecce filius tuus. Deinde dicit discipulo: Ecce mater tua. Et ex illa hora accepit eam discipulus in sua.','JOHN_19_26_27_LATIN_GLOSS')]"
