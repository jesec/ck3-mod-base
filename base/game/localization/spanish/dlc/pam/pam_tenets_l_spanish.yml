 # PAM TENETS
 full_tenet_name: "$CUSTOM_NAME$ #weak ($DEFAULT_NAME$)#!"
 # Peace of God Tenet
 tenet_peace_of_god_irish_name: "Cáin Adomnáin" # DO NOT TRANSLATE
 tenet_peace_of_god_latin_name: "Pax et Treuga Dei" # DO NOT TRANSLATE
 tenet_peace_of_god_greek_name: "Ekekheiría Theoũ" # DO NOT TRANSLATE
 tenet_peace_of_god_default_name: "Paz de Dios"
 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "Conocida como la Ley de Inocentes, puso normas que garantizasen la seguridad de los no combatientes durante las guerras. A los infractores, junto con aquellos que no hicieran nada para impedir el delito, se les sometía a castigos seculares y maldiciones rituales.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Contexto histórico de la Cáin Adomnáin','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "Deben de respetarse indefectiblemente las treguas de Adviento hasta el octavo de la Epifanía. Si alguien tratare de romper la tregua, pronuncie su obispo sentencia de excomunión.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Contexto histórico de la Pax et Treuga Dei','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "Los discípulos de Cristo, quien lo hizo todo por la paz, deben ser artesanos de la paz. Sin amor por los otros, sin una actitud de paz hacia los hombres, nadie puede ser llamado un verdadero servidor de Cristo.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Contexto histórico de la Ekekheiría Theoũ','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "La violencia sin sentido contra nuestros hermanos es una afrenta a Dios.\n\n[Glossary('Contexto histórico de la Paz de Dios','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "A lo largo de la Edad Media, distintos movimientos cristianos buscaron limitar el derramamiento de sangre al imponer unas reglas formales de enfrentamiento. De la Cáin Adomnáin irlandesa del siglo VII al movimiento de la Paz de Dios de la Francia del siglo X, estos intentos se centraron en proteger a las gentes y las propiedades de la Iglesia al limitar la violencia contra los no combatientes y restringir las guerras entre la nobleza a momentos y lugares determinados.\n\nEstas reglas a veces se extendían a los no creyentes. El canon XXI del tercer concilio de Letrán de 1179 imponía treguas periódicas para toda la cristiandad, mientras que el canon XXVII exhortaba a tomar las armas contra cátaros, vascos y otros herejes."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Declarar la [war|El] a un [ruler|El] de la misma [faith|El] cuesta [piety|El] @piety_icon!"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "Los [rulers|El] con el rasgo [GetTrait('zealous').GetName( GetNullCharacter )] son menos propensos a declarar la [war|El] dentro de la [faith|El]"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "Es mucho menos probable que los [rulers|El] de este [rite|El] respondan a la [interaction|El] #high $ecclesiastic_incite_holy_war_interaction$#!"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "La [interaction|El] #high $purchase_truce_interaction$#! cuesta un #P 50%#! menos y se acepta con más facilidad"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "No se puede [Concept( 'raid', 'asaltar' )|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "Cada #V 5 años#! de [peace|El] conceden a los [rulers|El] una recompensa, que suele ser [legitimacy|El] @legitimacy_icon!"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "Pasar #V 5 años#! en [peace|El] proporciona #P 1#! punto de [skill|El] al azar"
 doctrine_parameter_tenet_peace_of_god_excommunication: "Los defensores principales no pagan [piety|El] @piety_icon! para [excommunicate|El] a atacantes de la misma [faith|El]"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "Romper una [truce|El] dentro de la misma [faith|El] provoca la [excommunication|El] inmediata"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "El [clergy|El] resuelve las disputas sobre tierras y títulos con mayor rapidez y cobra un #P 25 %#! menos de [piety|El] @piety_icon!, [gold|El] @gold_icon! y [prestige|El] @prestige_icon!."
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: has estado en paz"
 # Dulia tenet
 tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
 tenet_dulia_default_name: "Veneración de santos"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "Quienes eligen servir al Señor como sus cimientos deben ser venerados. La santidad es su cuerpo eterno, sagradas sus reliquias y santo su recuerdo.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Contexto histórico de la dulía','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "De hieroconfesores y miróforas a necios de Dios, la Iglesia ha honrado a aquellos que han mostrado una devoción excepcional a Dios con un título especial y la conmemoración un día específico del calendario litúrgico.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Contexto histórico de la hagiokatátaxis','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "Que todos aquellos que busquen la intercesión de los santos se les acerquen con respeto y devoción.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Contexto histórico de la veneración de los santos','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "En los primeros días de la cristiandad, los mártires —aquellos que murieron por la fe— eran venerados y sus reliquias conservadas como objetos sagrados. A partir del siglo IV, los confesores —aquellos que habían confesado su fe no con la muerte, sino mediante la palabra y la vida— también fueron honrados.\n\nLa aprobación de su estatus era al principio otorgada por obispos locales, tras realizar una investigación sobre su vida y milagros. San Udalrico, obispo de Augsburgo, confirmado por el papa Juan XV en el 993, fue el primer santo fuera de Roma sujeto a una canonización papal. Un decreto del papa Alejandro III en 1170 otorgó la prerrogativa de la canonización al papa en exclusiva."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "Las [decisions|El] [GetDecisionWithKey('pam_canonize_saint_decision').GetName] y [GetDecisionWithKey('pam_extract_relic_decision').GetName] cuestan un #P 15 %#! menos de [piety|El] @piety_icon! y [gold|El] @gold_icon!"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "Los [artifacts|El] de la [decision|El] [GetDecisionWithKey('pam_extract_relic_decision').GetName] conllevan #P 1#! bendición extra aleatoria"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "La [decision|El] [GetDecisionWithKey('pam_extract_relic_decision').GetName] aplicada sobre un miembro de la [dynasty|El] proporciona #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! de [dynasty_prestige|El]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Canonizar a un santo concede a todo [ruler|El] de la [faith|El] $pam_dulia_new_saint_modifier$ durante #EMP 5#! años"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "Transustanciación"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "Sin embargo, en el sacramento de la Eucaristía, la consagración del pan no termina en la nada, sino en el cuerpo de Cristo. De lo contrario, no se podría explicar cómo el cuerpo de Cristo empieza a existir bajo el sacramento. Pues no empieza a existir allí mediante un movimiento local, ya que si no, dejaría de existir en el cielo.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Contexto histórico de la Transubstantiatio','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "Mas Él está presente cierta y realmente, de tal modo que tras la consagración del pan y el vino, el pan se transmuta, transubstancia en el mismo cuerpo del Señor.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Contexto histórico de la metousíōsis','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "Antes de la consagración tiene otro nombre; tras ella, se le llama sangre. Y vosotros decís, amén, es decir, así es.\n\n$pam_luke_22_19_default$\n\n[Glossary('Contexto histórico de la transustanciación','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "La naturaleza de la presencia de Cristo en la Eucaristía ha sido sujeto de debate teológico desde la Iglesia primitiva. Si bien la divinidad del pan y el vino como cuerpo y sangre de Cristo raramente se discutían, su naturaleza exacta fueron fuente de muchos debates, sectas y cismas. Tomás de Aquino desarrolló más profundamente la interpretación católica en el siglo XIII. Se definió formalmente en el cuarto concilio de Letrán de 1215. Durante la misa, la sustancia del pan y el vino se convierte en la sustancia del cuerpo y la sangre de Cristo, si bien se mantienen los accidentes (la apariencia) del pan y el vino."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Velocidad de [fabricate_claim|El]: #p +20 %#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "Ora et Labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "Ora y trabaja"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "Ser obediente al superior, ser paciente en medio de las dificultades. Aceptar las tareas más duras y considerarse un trabajador insignificante.\n#weak Capítulo VII de la Regla de san Benito#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Contexto histórico del Ora et labora','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "Sin interrupción, día y noche, los monjes han de celebrar el servicio divino. Sus coros que se alternan y sus salmos incesantes dan gloria a su orden y a Dios.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Contexto histórico de los akoímētoi','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "Rezar es trabajar y trabajar es rezar. La ociosidad es enemiga del alma y hemos de ser diligentes en pensamiento y acción.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('Contexto histórico del Ora y trabaja','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "Salida de la regla de san Benito, el lema #weak Ora et labora#! condensa el ideal monástico de oración y trabajo. Se esperaba que los monjes dedicasen horas específicas del día a la oración común, la meditación personal y el trabajo manual. Este equilibrio se entendía como esencial para el crecimiento espiritual y la disciplina. Los monasterios benedictinos se convirtieron en centros de conocimiento, agricultura y arte que contribuyeron significativamente a la vida cultural y económica de la Europa medieval."
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "Theotókos" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "Madre de Dios"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "Bajo tu compasión nos refugiamos. No desdeñes nuestras peticiones en tiempo de dificultades, mas sálvanos de los peligros, solo tú pura, solo tú bendita.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Contexto histórico de la hiperdulía','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "Acepta nuestras plegarias y llévalas hasta tu Hijo y nuestro Dios para que Él pueda, en tu nombre, iluminar y salvar nuestras almas. Santísima Theotokos, ¡sálvanos!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Contexto histórico de la theotókos','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "Bendita Virgen María, Madre de Dios, Madre de la merced, Madona.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Contexto histórico de la Madre de Dios','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "Desde los principios de la cristiandad, María, la madre de Jesús, ha tenido un lugar especial de honor y veneración. El concilio de Éfeso de 431 d. C. proclamó su título de Theotokos, #weak La que da luz a Dios#!, a la vez que condenó la preferencia nestoriana de Christotokos, #weak La que da a luz a Cristo#!. San Juan Damasceno escribió en el siglo VIII que María estaba elevada por encima de todos los demás santos por su papel único en la historia de la salvación. Con el paso de los siglos se desarrollaron y definieron formalmente por las iglesias cristianas distintas doctrinas referentes a María, como su Inmaculada concepción y Asunción."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "Los [claims|El] de mujeres ya no están debilitados debido a las [gender_laws|El]"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Permite [laws|lE]: sucesión de [GetLaw('female_preference_law').GetName|l]"
 # Simony tenet
 tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
 tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
 tenet_simony_default_name: "Simonía"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "Dios creó el dinero bajo la tierra que nos entregó como un favor para nosotros Sus elegidos.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Contexto histórico de la simonia','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "Dios creó el dinero bajo la tierra que nos entregó como un favor para nosotros Sus elegidos.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Contexto histórico de la simōnía','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "Dios creó el dinero bajo la tierra que nos entregó como un favor para nosotros Sus elegidos.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Contexto histórico de la simonía','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "La práctica de vender los cargos eclesiásticos, reliquias y prácticas. Su nombre proviene de Simón el Mago, un samaritano que #weak cautivaba#! a la gente y ofreció dinero a los apóstoles por el bautismo.\n\nUna multitud de sínodos, desde el de Elvira del 305 d. C. hasta el concilio de Trento de 1545 d. C. han condenado la simonía con fuerza e impuesto los castigos espirituales y laicos más fuertes. Si una práctica se condena tantas veces durante tantos siglos significa que era bastante común. También criticada en la 95ª tesis de Martín Lutero y el 19º canto del Infierno de Dante: #weak Rapaces que toman las cosas de Dios, ¡que deberían ser las novias de la Justicia y las hacen fornicar por oro y plata!#!"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[castle_holdings|E] y [church_holdings|El]: [tax|El] por nivel de [piety|El] @piety_icon!: #P + 0,1 [gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "Puede pagar [gold|El] @gold_icon! para garantizar la aceptación de la [character_interaction|El] #high $take_monastic_vows_interaction$#!"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "Puede pagar [gold|El] @gold_icon! por [titles|El] clericales con la [interaction|El] #high $buy_ecclesiastical_title_interaction$#!"
 tenet_simony_ecclesiastical_purchase_name: "la [interaction|El] #high $buy_ecclesiastical_title_interaction$#!"
 doctrine_parameter_tenet_simony_gold_donations: "Las donaciones de [gold|El] @gold_icon! son #P 5 veces#! más persuasivas a la hora de hacer una petición al [clergy|El]"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "Probabilidad anual entre el #P 25 %#! y #P 75 %#!, mayor si eres adinerado, de #P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "El [head_of_faith|El] siempre acepta obsequios de [gold|El] @gold_icon! para levantar una [excommunication|El]"
 doctrine_parameter_tenet_simony_personal_gifts: "Los regalos reducen el [stress|El], conceden un poco de [spiritual_fulfillment|El] @spiritual_fulfillment_icon! y acumulan el doble de [opinion|El]"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "Sincretismo aceptado"
 pam_personal_syncretism_county_modifier_desc: "La población local respeta las tradiciones sincréticas personales de su gobernante y prospera bajo su mandato."
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "Monofisismo"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "El Hijo es uno y una su naturaleza, aunque se conciba que ha asumido la carne con un alma racional.\n\n$pam_john_1_1_latin$\n\n[Glossary('Contexto histórico del monophysitismus','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "Una fisis del Verbo encarnado.\n\n$pam_john_1_1_greek$\n\n[Glossary('Contexto histórico del monophysitismós','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "Cristo tiene una sola naturaleza, totalmente divina.\n\n$pam_john_1_1_default$\n\n[Glossary('Contexto histórico del monofisismo','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "Del griego «monos», #weak único#! y «physis», #weak naturaleza#!, este dogma afirma que Jesucristo solo tiene una naturaleza divina, el Verbo encarnado de Dios. Condenado como herejía en el concilio de Calcedonia del 451 d. C., sin embargo, encontró el apoyo del emperador Basilisco y la protección del emperador Justiniano I. Esto provocó cismas como el de los acéfalos, que rechazaban la autoridad del patriarca de Alejandría, y los docetistas, que creían que la naturaleza humana de Jesús era una mera ilusión."
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[characters|E] con el rasgo [GetTrait('theologian').GetName( GetNullCharacter )]: #P +10 %#! de ganancia de [piety|El] @piety_icon!, #P +5#! de [opinion|El] de fervorosos y #P +10 % #! de experiencia de [lifestyle|El]"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[characters|E] con el rasgo [GetTrait('stubborn').GetName( GetNullCharacter )]: #P +10 %#! de ganancia de [piety|El] @piety_icon! y #P +10#! de [opinion|El] [Concept('clergy', 'clerical')|E]"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[characters|El] con el rasgo [GetTrait('trusting').GetName( GetNullCharacter )]: #N -10 %#! de ganancia de [piety|El] @piety_icon! y #N -10#! de [opinion|El] [Concept('clergy', 'clerical')|E]"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "Contra otras [faiths|El] de tu [religion|El]: [convert_county|El] se hace un #P +25 %#! más rápido, #P +20#! a la probabilidad de que los [characters|El] acepten la conversión"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "Práxeis tõn apostólōn" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "Proselitismo ferviente"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "Igual que Moisés se presentó ante el faraón y proclamó Tu misión ante él, nuestros misioneros se presentan ante otros.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Contexto histórico del actus apostolorum','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "Regreso a Ti, a Tu pueblo, al regalo que Tú me haces. Los dirijo con Tu poderosa diestra y los protejo bajo la sombra de Tus alas.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Contexto histórico del práxeis tõn apostólōn','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "Llevad la luz divina a aquellos en tinieblas y la esperanza a aquellos que desesperan.\n\n$pam_acts_1_8_default$\n\n[Glossary('Contexto histórico del proselitismo ferviente','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "El cristianismo se extendió rápidamente en los primeros siglos después de Cristo, gracias sobre todo a los esfuerzos misioneros de los apóstoles y los primeros discípulos. Sus viajes les llevaron por todo el Imperio romano para fundar comunidades cristianas y convertir individuos de diferentes orígenes. El fervor por el proselitismo estaba impulsado por una profunda convicción en el mensaje de salvación mediante Jesucristo y llevó a que el cristianismo creciera y pasara de una pequeña secta del judaísmo a una religión principal a escala mundial.\n\nEn la era medieval, muchos futuros santos y mártires realizarían viajes misioneros a tierras paganas para difundir sin descanso la fe cristiana."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Menos requisitos para la [decision|El] [GetDecisionWithKey('zealous_missionary_prep_decision').GetName], que tomarán más [adventurers|El]"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Convertir [characters|El] da #P 50#! @legitimacy_icon!; que tu [court_chaplain|El] convierta un [county|El] proporciona #P 100#! @legitimacy_icon! y #P 5#! @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "Convertir a un [character|El] da #P 3#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon! o #P 10#! por convertir a un [ruler|El] con tierras"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Tu [head_of_rite|El] gana #P +25#! de aceptación al convencer a [characters|El] para unirse a este [rite|El]"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "Tu ventaja de [learning|El] vale #P el doble#! a la hora de exigir la conversión de [characters|El]"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "Convertir a un [ruler|El] da entre #P 25#! y #P 1500#! de [piety|El] @piety_icon!; esto aumenta notablemente según el nivel de su [title|El]"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "Por el dogma [GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )]"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "Purgatorio"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "Temo más el castigo de abajo, mi alma se siente inquieta, en incertidumbre; ya siento las pesadas losas del primer nivel.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Contexto histórico del purgatorium','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "Y la gente que está en el cielo porque no tiene cuerpo no puede crecer en theosis, así que nuestras oraciones los ayudan a ello.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Contexto histórico del kathartērion ','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "La purificación final de aquellos que murieron en estado de Gracia y solo deja en ellos la santidad necesaria para entrar en el Gozo del cielo.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Contexto histórico del purgatorio','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "Si bien la idea de las almas en un estado de transición, a la espera de subir al cielo, era una creencia generalizada, la naturaleza exacta de este estado se debatía a menudo. Que fuera un lugar, un estado de la mente, una pura metáfora o una limpieza física variaba entre los teólogos y denominaciones. Santa Catalina de Génova escribió que es un estado tanto de alegría como de dolor voluntario por los pecados propios, mientras que Orígenes de Alejandría escribió sobre que Dios es un fuego devorador.\n\nLa Iglesia católica formalizó la doctrina del purgatorio en los concilios de Florencia(1439) y Trento (1545-63) para definirlo como un estado temporal de purificación y se enseña que las oraciones y las buenas obras de los vivos pueden beneficiar a las almas que allí se encuentran."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "Es menos probable que los [characters|El] [Concept('sinful', 'pecaminosos')|El] se unan a [factions|El] (#N -15#! por [sin|El] con el que carguen)"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "Los [rulers|El] [Concept('sinful', 'pecaminosos')|El] ganan un #N 10 %#! menos de [piety|El] @piety_icon! por cada [sin|El] con el que carguen"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "Los ataques de [stress|El] pueden sustituri [traits|El] [Concept('sinful', 'pecaminosos')|El] por [virtues|El]; esto es más probable cuanto más fuerte sea el ataque"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "Los [characters|El] [Concept('excommunicated', 'excomulgados')|El] de este [rite|El] se expían mediante penitencia: #P +25 %#! de ganancia de [piety|El] @piety_icon! y #P +10#! de [opinion|El] de la misma fe"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|E] cuesta menos [prestige|El] @prestige_icon! y no reduce tu [prestige_level|El]"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "Gana #P 50#! de [piety|El] @piety_icon! por cada [sin|El] con el que cargase un [Concept('family', 'familiar')|E] cercano que muera"
 pam_purgatory_prayers_for_the_dead_toast: "Por tu [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )|l]: plegarias por los difuntos"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "Crescite et Multiplicamini" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì plēthýnesthe" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "Sed fecundos y multiplicaos"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "La pareja no solo se entrega a sí misma, sino a la realidad de los niños, que son un reflejo vivo de su amor, una síntesis viva e inseparable de su ser.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Contexto histórico del crescite et multiplicamini','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "Contemplad, los hijos son un legado del Señor, el fruto del vientre una recompensa.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Contexto histórico del auxánesthe kaì plēthýnesthe','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "En el plan de Dios, la familia es una comunidad íntima de vida y amor, un trabajo que encontrará plena satisfacción, como todo aquello creado y redimido en el Reino de Dios.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Contexto histórico del Sed fecundos y multiplicaos','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "Sed fecundos y multiplicaos es un mandamiento encontrado en Génesis 1:28, donde Dios ordena a Adán y Eva procrear y llenar la tierra."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Es bastante más fácil cortejar a tu cónyuge y otorga una importante bonificación de [fertility|El]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "Siempre es posible divorciarse de un cónyuge con poca [fertility|El]"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "Los recién nacidos obtienen una bonificación de [health|El] según lo cercana que sea la relación de sus progenitores"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "Criado con cariño"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "Criado con amor"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "Criado con devoción"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "Un niño o niña nacido de una unión llena de amor crece rodeado del cariño de ambos padres y, gracias a ello, se desarrolla plenamente"
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "Al nacer y alcanzar la edad adulta:\n$BULLET_WITH_TAB$El #V hijo#! recibe [GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip] durante 2 años.\n$BULLET_WITH_TAB$Los #V padres#! reciben [GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip] durante 2 años."
 tenet_be_fruitful_and_multiply_child_modifier: "Bendecido"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "La veneración fervorosa de la fertilidad lleva a que todos los fieles cuiden y se centren más en los más pequeños y sus progenitores."
 tenet_be_fruitful_and_multiply_parent_modifier: "Adorado por su fecundidad"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "Successio Apostolica" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "Apostolikē diadokhē" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "Sucesión apostólica"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "La primacía de honor y jurisdicción que Cristo otorgó al apóstol Pedro y que heredan sus sucesores, los papas.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Contexto histórico de la successio apostolica','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "De la iglesia de Roma, Lino, hijo de Claudia, fue el primero, ordenado por Pablo.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Contexto histórico del apostolikē diadokhē','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "La línea ininterrumpida de obispos desde los apóstoles hasta el día de hoy que garantiza la verdadera transmisión de la fe.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Contexto histórico de la sucesión apostólica','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "La doctrina de la sucesión apostólica sostiene que la autoridad de los obispos proviene de una cadena ininterrumpida de ordenaciones que se remonta a los mismos apóstoles. Ireneo de Lyon, en el siglo II, usó la sucesión apostólica como argumento contra las herejías gnósticas al probar que las auténticas enseñanzas de Cristo se conservaban mediante los legítimos obispos de la Iglesia.\n\nA partir del siglo XIII en adelante, los papas han ostentado el anillo del pescador, símbolo de la sucesión desde san Pedro. La Iglesia ortodoxa oriental reconoce el linaje de los papas occidentales y su papel en la cristiandad primitiva, pero no le dan a Pedro una posición superior sobre el resto de los apóstoles y consideran al papa Lino el primer obispo de Roma."
 tenet_apostolic_succession_requires_head_of_faith_tt: "Tu [faith|El] debe tener un [head_of_faith|El]"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "Los [theocratic_vassals|El] de la misma [faith|E] tienen menos [legitimacy_expectations|El] de su [liege|El]"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "Concede [GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "Al avanzar un [cardinal|El], su [papabile_score|El] aumenta en #P 10#!"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "Si el [Concept('head_of_faith', 'cabeza de tu fe')|E] predica tu [legitimacy|El] @legitimacy_icon! en persona, recibes [legitimacy|El] @legitimacy_icon! extra"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "Deponer a un [antipope|El] concede [legitimacy|El] @legitimacy_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 # Confession tenet
 tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
 tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
 tenet_confession_default_name: "Sacramento de la confesión"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "Bendíceme, Padre, porque he pecado. ¡Dios misericordioso! Me postro a tus pies, te confieso mis pecados con toda sinceridad a ti y a tu sacerdote\n\n$pam_james_5_16_latin$\n\n[Glossary('Contexto histórico de la confessio','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "¡Escucha la oración del pobre desdichado que soy y destruye a la serpiente que mora dentro de mí, oh, Señor!\n\n$pam_james_5_16_greek$\n\n[Glossary('Contexto histórico de la exomológēsis','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "Mediante la confesión, los pecadores pueden recibir la absolución y reconciliarse con Dios y con la Iglesia.\n\n$pam_james_5_16_default$\n\n[Glossary('Contexto histórico del sacramento de la confesión','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "La práctica de confesar los pecados ha evolucionado significativamente a lo largo de la historia cristiana. En la Iglesia primitiva era común la confesión pública de los pecados graves. La confesión privada se generalizó en las iglesias celtas durante el siglo VI y se extendió por la cristiandad occidental. El cuarto concilio de Letrán de 1215 ordenó la confesión anual para todos los cristianos. El sello de la confesión, la confidencialidad absoluta sobre los pecados confesados, se convirtió en una característica definitoria del sacramento y los sacerdotes están dispuestos a afrontar el martirio antes que romper este sello."
 doctrine_parameter_tenet_confession_priests_secrets: "Un [court_chaplain|El] de tu [faith|El] que practique también la confesión, y, o bien tenga un opinión positiva de ti, o bien tengas un anzuelo fuerte sobre él, tiene una mayor eficacia en la [Concept('councillor_task', 'tarea')|E] $task_find_secrets$"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "Las #high $spiritual_counsel_interaction$#! del [clergy|El] de este [rite|El] proporcionan más [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "Las [schemes|El] de [GetScheme('study_scripture').GetTypeName|l] alivian más [stress|El]"
 doctrine_parameter_tenet_confession_confess_sins_decision: "Se puede usar la [decision|El] [GetDecisionWithKey('pam_decision_confession').GetName]"
 # Original Sin tenet
 tenet_original_sin_latin_name: "Peccatum Originale" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "Propatorikē hamartía" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "Pecado original"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "Todos los hombres perdieron su inocencia con la mentira de Adán. Las consecuencias en la naturaleza, debilitada e inclinada al mal, persisten en el hombre y lo convocan a una contienda espiritual. \n\n$pam_romans_5_12_latin$\n\n[Glossary('Contexto histórico del peccatum originale','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "Creador y Hacedor nuestro, nuestra es la culpa, de Adán y Eva, al escuchar a Satanás, blasfemaron. Por egoísmo fueron inducidos al error. Debilitaron la naturaleza de la humanidad. La imaginación de nuestro corazón es malvada.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Contexto histórico del propatorikē hamartía','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "La humanidad entera hereda la mancha de primer pecado de Adán, del cual solo la gracia divina a través de Cristo puede redimirnos.\n\n$pam_romans_5_12_default$\n\n[Glossary('Contexto histórico del pecado original','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "La doctrina del pecado original fue desarrollada a fondo por san Agustín de Hipona a principios del siglo V, especialmente en respuesta a la herejía pelagiana que negaba que los pecados se heredasen. Agustín enseñó que el pecado de Adán se transmitió a todos sus descendientes y corrompió la naturaleza humana, lo que hace imposible la salvación sin la gracia divina. El concilio de Cartago del 418 d. C. confirmó esta enseñanza y se convirtió en una piedra angular de la teología cristiana occidental. El cristianismo oriental desarrolló una compresión ligeramente distinta al poner el énfasis en el pecado ancestral más que en la culpa heredada directamente."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "La [councillor_task|El] de [promote_culture|El] es un #P 25 %#! más rápida en [counties|El] del mismo [rite|El]"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "A los [counties|El] de esta [faith|El] les lleva un #N 50 %#! más de tiempo [Concept( 'promote_culture', 'cambiar la cultura' )|El] si el [liege|El] es de una [faith|El] distinta"
 doctrine_parameter_tenet_original_sin_sinners_insight: "Ganas #P +10#! de probabilidad de éxito máxima de una [scheme|El] hostil por cada [sin|El] con el que cargues"
 doctrine_parameter_tenet_original_sin_baptism_piety: "Cuando nazca tu hijo, ganas #P 50#! de [piety|El] @piety_icon!; el recién nacido será bautizado con #P 250#! de [piety|El] @piety_icon!"
 pam_original_sin_baptism_toast: "Por tu [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )|l]: se ha limpiado la mácula del recién nacido"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "Hierarchia caelestis" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "Ouranía hierarkhía" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "Jerarquía celestial"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "Ángeles santos que rodeáis mi trono y familia. Padre celestial, que Tus ángeles acallen toda voz de condenación y miedo contra mí y lleven raudos mis oraciones a Tu trono.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Contexto histórico de la hierarchia caelestis','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "Esté contiguo un ángel guardián, un consejero sabio y compañero del pueblo cristiano que traiga iluminación, fuerza, alegría, paz y consuelo.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Contexto histórico de la ouranía hierarkhía','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "Los ángeles están organizados en nueve órdenes, de los serafines a los ángeles comunes; cada una de ellas sirve a Dios en su papel ordenado y cuidan de la humanidad.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Contexto histórico de la jerarquía celestial','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "El concepto de la jerarquía celestial fue estructurado por Pseudo-Dionisio Areopagita en el siglo V o VI con su obra «De coelesti hierarchia». Organizaba a los ángeles en tres triadas: la más elevada consistía en serafines, querubines y tronos; la media en dominios, virtudes y poderes, y la inferior en principalidades, arcángeles y ángeles.\n\nEsta jerarquía influyó profundamente en la teología cristiana medieval y fue adoptada por el cristianismo occidental y oriental. Tomás de Aquino incorporó esta angelología en su «Summa theologica» y modeló las representaciones artísticas del cielo durante la Edad Media."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Contratar [court_positions|El] con mucha [aptitude|El] concede #P 3#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!; descartar o revocar a los titulares cuesta #N 3#!"
 pam_celestial_hierarchy_hire_sp_toast: "Dogma personal de [GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "Los titulares de [court_positions|El] de la [faith|El] de su [liege|El] ganan [aptitude|El] por su [piety_level|El]"
 doctrine_parameter_tenet_celestial_hierarchy_clergy_acceptance: "El [clergy|El] gana #P +20#! de aceptación de [interaction|El] al actuar frente a [rulers|El] seculares"
 doctrine_parameter_tenet_celestial_hierarchy_religious_relations_bonus: "La [councillor_task|El] [religious_relations|E] es un #P [EmptyScope.ScriptValue('celestial_hierarchy_religious_relations_percentage_loc')] %#! más efectiva"
 doctrine_parameter_tenet_celestial_hierarchy_interaction_acceptance: "La aceptación de [interaction|El] con la misma [faith|El] cambia en #P +10#! por [piety_level|El] por encima del objetivo y #N -10#! por nivel por debajo"
