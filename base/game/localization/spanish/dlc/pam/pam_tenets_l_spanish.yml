 pam_luke_1_79_greek: "[Glossary('Epiphãnai toĩs en skótei kaì skia thanátou kathēménois, toũ kateuthỹnai toùs pódas hēmõn eis hodòn eirenēs.', 'LUKE_1_79_GREEK_GLOSS')]" #ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
 pam_colossians_3_15_greek: "[Glossary('Kaì hē eirenē toũ Christoũ brabeuétō en taĩs kardíais hymõn, eis hen kaì eklethēte en henì somati; kaì euchάristoi gínesthe.', 'COLOSSIANS_3_15_GREEK_GLOSS')]" #καὶ ἡ εἰρήνη τοῦ Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
