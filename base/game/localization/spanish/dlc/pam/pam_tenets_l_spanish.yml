 pam_mortification_flagellant_gain_toast: "Por tu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l]: has adoptado la ruta [GetTrait('flagellant').GetName( GetPlayer.Self )|El]"
 pam_mortification_holy_scars_toast: "Por tu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l]: el flagelo ha dejado cicatrices sagradas en tu carne"
 pam_mortification_suffering_sanctifies_toast: "Por tu [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )|l]: ofreces a Dios el sufrimiento de la carne"
 tenet_mortification_of_the_flesh_historical_desc: "Basada en la llamada de san Pablo a dar #weak muerte a las obras del cuerpo#! (Romanos 8:13) y su declaración de que #weak golpea su cuerpo y lo somete#! (1 Corintios 9:27), la mortificación se convirtió en una práctica central del ascetismo cristiano en los primeros siglos. Sus practicantes más extremos eran los estilitas: san Simeón el Viejo vivió 37 años sobre una columna cerca de Alepo, entregado a la oración constante y soportando el calor abrasador y el frío cortante.\n\nLa autoflagelación se extendió por la cristiandad occidental medieval, destacando entre sus defensores san Pedro Damián (1007-1072). El movimiento flagelante de los siglos XIII y XIV llevó a grupos de seglares a procesionar por las ciudades mientras se azotaban como penitencia en épocas de epidemias y desastres."
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "Qeddus Meron" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "Sanctum Chrisma" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "Hágion Mýron" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "Santo myron"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "Por el santo meron, consagrado por el abuna, los fieles reciben el sello del Espíritu Santo. Igual que la paloma descendió sobre Cristo durante Su bautismo en el Jordán, también el Espíritu desciende sobre los recién bautizados mediante esta unción sagrada que los señala como hijos de Dios.\n\n$pam_john_3_5_default$\n\n[Glossary('Contexto histórico del qeddus meron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "A través del santo crisma, consagrado por el obispo, los fieles reciben el sello del regalo del Espíritu Santo. La unción completa la gracia del bautismo.\n\n$pam_john_3_5_latin$\n\n[Glossary('Contexto histórico del sanctum chrisma','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "El santo myron, consagrado por el patriarca, es el sello del regalo del Espíritu Santo. A través de esta unción sagrada, los recién iluminados reciben la plenitud de los regalos del Espíritu y se convierten en templos del Dios viviente.\n\n$pam_john_3_5_greek$\n\n[Glossary('Contexto histórico del hágion mýron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "El santo myron, también llamado crisma, es un aceite especialmente consagrado que se usa en el sacramento de la confirmación para sellar a los recién bautizados con el regalo del Espíritu Santo, lo que completa su iniciación en la Iglesia.\n\n$pam_john_3_5_default$\n\n[Glossary('Contexto histórico del santo myron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "El santo crisma o #weak myron#!, que proviene del griego mýron —«aceite fragante» o «ungüento»—, se emplea en el sacramento de la crismación o confirmación. En Oriente, sigue inmediatamente al bautismo, incluso para los bebés; en Occidente, la confirmación suele administrarla por separado un obispo. La unción tiene profundas raíces bíblicas: tanto #weak Cristo#! como #weak Mesías#! significan #weak ungido#!.\n\nLa consagración de un nuevo myron es un evento poco común y solemne: siempre se añade una parte del lote anterior al nuevo para crear una cadena ininterrumpida que se remonta hasta los mismísimos apóstoles. Según la tradición etíope, la receta de #weak meron#! fue traída por los Nueve Santos, misioneros siriacos del siglo V, y su consagración es competencia exclusiva del patriarca, el abuna."
 doctrine_parameter_tenet_holy_myron_artifact: "Puedes enviar al [court_chaplain|El] a crear un [artifact|El] con #V santo myron#!, mediante la [decision|El] [GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName]; sus cargas se gastan en bendecir [artifacts|El][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: ", tu [coronation|El]"
 pam_holy_myron_param_funeral_append: " y los muertos en [funerals|El]"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Puedes regalar cargas de tu [artifact|El], el #V santo myron#!, a otros gobernantes y así ganar [piety|El] @piety_icon! y [opinion|El]"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Tu bebé gana el [modifier|El] [GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip] durante #V 16#! años; un carga del [artifact|El] #V santo myron#! proporciona el [modifier|El] [GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip] permanentemente"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "Al caer víctima de una [Concept('ill', 'enfermedad')|E]: se gana [spiritual_fulfillment|El] @spiritual_fulfillment_icon!, se pierde [stress|El] y se obtiene el [modifier|El] [GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip] durante #V 2#! años"
 # Khachkar tenet
 tenet_khachkar_armenian_name: "Jachkar" # DO NOT TRANSLATE
 tenet_khachkar_latin_name: "Crux Lapidea" # DO NOT TRANSLATE
