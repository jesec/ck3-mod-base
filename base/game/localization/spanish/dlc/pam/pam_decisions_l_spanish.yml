 pam_decision_events.0002.t: "Una muestra de devoción"
 pam_decision_events.0002.desc.intro: "[my_chaplain.Custom('ES_ElLa')|U] [my_chaplain.GetTitledFirstName|l] permanece junto a mí, al lado del altar. Los suaves rayos del sol iluminan"
 pam_decision_events.0002.desc.uncrowned: "mi ropa como un manto sagrado."
 pam_decision_events.0002.desc.crowned: "mi corona como un halo."
 pam_decision_events.0002.desc.mid: "\n\n«[ROOT.Char.Custom('RandomBibleQuote')]…», se prolonga su sermón"
 pam_decision_events.0002.desc.bad: "mientras me esfuerzo por prestar atención."
 pam_decision_events.0002.desc.good: "mientras el público parece estar únicamente centrado en mí."
 pam_decision_events.0002.desc.neutral: "mientras observo caras impresionadas entre el público."
 pam_decision_events.0002.desc.outro: "\n\n«Y nuestr[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetNameNoTooltip], sabi[ROOT.Char.Custom('ES_OA')] y virtuos[ROOT.Char.Custom('ES_OA')], nos liderará en estos tiempos nefastos»."
 pam_decision_events.0002.a: "He de dirigirme a la multitud personalmente."
 pam_decision_events.0002.b: "Un simple gesto de asentimiento bastará."
 pam_mentor_sp_decision: "Proporcionar consejo espiritual"
 pam_mentor_sp_decision_desc: "Quien camina a la luz [ROOT.Char.GetFaith.HighGodNamePossessive] tiene el deber de guiar a aquellos perdidos en las tinieblas y a aquellos cuya juventud puede llevarlos a perderse en pensamiento o en obra."
 pam_mentor_sp_decision_desc_tooltip: "Ayudar a un niño con su [spiritual_fulfillment|El]"
 pam_mentor_sp_decision_confirm: "Hablar y escuchar."
 pam_mentor_sp_decision_sp_tooltip: "Tu [spiritual_fulfillment|El] está al menos en #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_mentor_sp_decision_tooltip_effect: "Aumentarás la [spiritual_fulfillment|El] de tu [primary_heir|El] o [favorite_child|El]"
 pam_mentor_sp_decision_valid_child_tt: "Debes tener un [child|lE] que:\n$BULLET_WITH_TAB$Sea de la misma [faith|lE] que tú\n$BULLET_WITH_TAB$Tenga al menos #V 16#! años\n$BULLET_WITH_TAB$Sea tu [primary_heir|lE] o tu [favorite_child|lE]\n$BULLET_WITH_TAB$Tenga un [spiritual_fulfillment|El] de menos de #V 75#!\n$BULLET_WITH_TAB$No haya recibido consejo espiritual anteriormente"
 pam_mentor_sp_decision_primary_heir_tt: "Tu [primary_heir|El] debe:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "Heredero principal"
 pam_mentor_sp_decision_primary_favorite_child_tt: "Tu [favorite_child|El] debe:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "Hijo preferido"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$Ser de la misma [faith|lE] que tú\n$BULLET_WITH_TAB$Tener al menos #V 16#! años\n$BULLET_WITH_TAB$Tener un [spiritual_fulfillment|El] de menos de #V 75#!\n$BULLET_WITH_TAB$No haber recibido consejo espiritual anteriormente"
 pam_decision_events.0003.t: "La lección más importante"
 pam_decision_events.0003.desc.intro: "La noche ha caído y la fortaleza está tranquila. Mi [target_child.Custom('GetDaughterSon')] se sienta a mi lado en la capilla privada.\n\nLe echo un vistazo."
 pam_decision_events.0003.desc.bad: "Su cara hundida, su mirada desinteresada, casi como si estuviera dormid[target_child.Custom('ES_OA')].\n\n«[ROOT.Char.GetMotherFather|U]», me pregunta impaciente, «¿por qué me habéis hecho llamar?»."
 pam_decision_events.0003.desc.good: "Sus ojos brillan por la luz de las velas. Es un[target_child.Custom('ES_XA')] buen[target_child.Custom('ES_XA')] [target_child.GetWomanMan].\n\n«[ROOT.Char.GetMotherFather|U]», pregunta, «¿he hecho algo malo?»."
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U]. Ya es lo suficientemente mayor.\n\n«[ROOT.Char.GetMotherFather|U]», me pregunta con voz suave, «¿qué se ha de hacer para vivir de manera justa?»."
 pam_decision_events.0003.a: "Un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] podrid[ROOT.Char.Custom('ES_OA')] pronto envenenará su [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 pam_decision_events.0003.b: "Solo debes… portarte bien."
 grudge_pressured_me_sp: "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'desarrollaste', 'desarrolló' )] rencor contra [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'ti', TARGET_CHARACTER.GetShortUIName)] después de que [TARGET_CHARACTER.GetShortUIName] le [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'presionaras', 'presionara')] sobre su realización espiritual."
