 pam_decision_events.0030.b.decline: "[religious_authority.Custom('ES_ElLa')|U] [religious_authority.GetTitleAsName|l] denigra tu reino"
 pam_decision_events.0030.opening: "Santísim[religious_authority.Custom('ES_OA')] [religious_authority.GetMotherFather],"
 pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName] solo ordena a unos pocos que sirvan como guardianes de sus hijos en la fe [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip], como soberanos a cargo de los bellos territorios que entregó a la Tierra.\n\nY yo pido ser un[king_aspirant.Custom('ES_OA')] de es[king_aspirant.Custom('ES_OA')]s poc[king_aspirant.Custom('ES_OA')]s bendecid[king_aspirant.Custom('ES_OA')]s. Cread un reino de [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], y lo defenderé de todo mal."
 pam_decision_events.0030.a: "A partir de este momento, queda consagrado un nuevo reino de fe [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip]."
 pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName] no tiene tales planes para vos, [king_aspirant.GetFirstNameNoTooltip]…"
 pam_decision_events.0031.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] de fe [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 pam_decision_events.0031.desc.self_crowning: "¿Qué tierra ha sido más bendecida que [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? ¿Qué feudo merece más los auspicios reales? ¿Acaso no ha guardado [ROOT.Char.GetFaith.WarGodName] a su gente del mal y ha preservado mi santa sede entre sus fronteras?\n\n Empleando la voluntad de [ROOT.Char.GetFaith.HighGodName], he consagrado mi [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Me he convertido en [ROOT.Char.Custom('ES_ElLa')] sant[ROOT.Char.Custom('ES_OA')] guardi[ROOT.Char.Custom('ES_AnAna')] de esta tierra, y mi voluntad nunca más será despreciada.\n\nVasallos y devotos por igual, ¡arrodillaos! Los buenos [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural] saben adorar a su [ROOT.Char.GetTitleAsName|l]."
 pam_decision_events.0031.desc_three_duchies: "Por decreto [religious_authority.Custom('ES_DelDela')] [religious_authority.GetTitledFirstNameRegnal|l], las tierras de mi señorío se alinean como estrellas destinadas en un cielo en continuo movimiento. A partir de la bendecida unión de [duchy_1.GetName], [duchy_2.GetName] y [duchy_3.GetName], se ha creado mi [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\n¡Y, con un alma justa y merecedora, llega un[ROOT.Char.Custom('ES_XA')] nuev[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsName|l]! Es por mandato [religious_authority.Char.Custom('ES_DelDela')] [religious_authority.GetTitleAsNameNoTooltip|l] que me he alzado, y ahora en su línea he de gobernar."
 pam_decision_events.0031.desc: "Por decreto [religious_authority.Custom('ES_DelDela')] [religious_authority.GetTitledFirstNameRegnal|l], un nuevo nombre de [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] se ha escrito en los anales. ¡Los [ROOT.Char.GetFaith.PriestNeuterPlural] y el pueblo me han alzado con gran exaltación! Mientras [ROOT.Char.GetPrimaryTitle.GetNameNoTier] continúe escapando de las garras de los paganos y los herejes, seguiré siendo su just[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsName|l] de fe [ROOT.Char.GetFaith.GetAdjective].\n\n[religious_authority.Custom('ES_ElLa')|U] [religious_authority.GetTitleAsNameNoTooltip|l], mi creador[religious_authority.Custom('ES_XA')], ha bendecido este modesto señorío… y seguramente tendrá interés en mis obras reales."
 pam_decision_events.0031.a: "Que [ROOT.Char.GetFaith.HighGodName] ame por siempre mi [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 any_landed_duchy_title_tt: "Al menos un [duchy|El] que posees es un [title|El] [landed|El] #weak #EMP (no una [clerical_region|El] ni una [noble_family|El])#!#!"
 head_of_faith_tt: "Tu [faith|lE] tiene [head_of_faith|lE]"
 custom.every_empire_secular_ruler: "Todo [ruler|El] secular de la misma [faith|El] en el [empire|El] [de_jure|El] de tu [realm|El]"
 NEW_CREATED_TITLE_NAME_LANDLESS: "[name_title.GetBaseNameNoTierNoTooltip]"
 head_of_rite_is_not_lieges_head_of_rite_tt: "Tu [head_of_rite|El] no es también el [head_of_rite|El] de tu [liege|El]"
 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "Eres [head_of_rite|El] de [recipient.GetShortUIName], pero no [head_of_rite|El] de su [liege|El]"
 pam_personal_sacrifice_of_wealth_decision: "Sacrificar riquezas"
 pam_personal_sacrifice_of_wealth_decision_desc: "Ofrece parte de tu riqueza con devoción para fomentar el desarrollo en un condado bajo tu protección."
 pam_personal_sacrifice_of_wealth_decision_tooltip: "Gasta [gold|El] para aumentar el [development_growth|El] de un [county|El] seleccionado y ganar [spiritual_fulfillment|El]"
 pam_personal_sacrifice_of_wealth_decision_confirm: "Hacer la ofrenda"
 pam_personal_sacrifice_of_wealth_decision_toast: "Creada inversión devota"
 pam_develop_clerical_court_decision: "Educar al clero de tu corte"
 pam_develop_clerical_court_decision_desc_christian: "Los escribanos ociosos son malos servidores de [ROOT.Char.GetFaith.HighGodName]. Reuniré a mi casa, ordenaré a los dignos, educaré a los ordenados y convocaré a novicios a mis puertas."
 pam_develop_clerical_court_decision_desc: "Los sirvientes ociosos no honran a [ROOT.Char.GetFaith.HighGodName]. Reuniré a mi casa, elevaré al [clergy|El] a los dignos, educaré a quienes sirvan y convocaré a novicios a mis puertas."
 pam_develop_clerical_court_decision_tooltip: "Ordenar, instruir o reclutar [clergy|El] para tu corte"
 pam_develop_clerical_court_decision_confirm: "Reunir a la casa"
 pam_develop_clerical_court_decision_tt: "Reúnes a tu casa y eliges #EMP una#! de estas opciones:\n$EFFECT_LIST_BULLET$ Hasta [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [courtiers|El] laicos se unen al [clergy|El], y cada uno te proporciona [piety|El] [piety_i] extra\n$EFFECT_LIST_BULLET$ Hasta [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] [Concept('clergy', 'clérigos')|E] de la corte ganan [learning|El]ؘ [learning_i] y el [trait|El]/[trait_level_track_xp|El] de [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] o [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ Hasta [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] novicios de las tierras de alrededor se unirán a tu corte y al [clergy|El]\n\nSea cual sea el sendero que elijas, ganas [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] de [piety|El] [piety_i]\n\n#weak Las recompensas se ajustan con tu [learning|El], [piety_level|El] y tus [traits|El] religiosos; a veces, una rara oportunidad se presenta sola#!"
 pam_develop_clerical_court_decision_candidates_tt: "Tienes un [courtier|El] digno de ser ordenado o instruido, o un candidato merecedor vive cerca"
 pam_clerical_court_joins_clergy_tt: "Se une al [clergy|El] del [pam_clerical_patron.GetFaith.GetName|l]"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName] se une al clero"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName] crece en sabiduría"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName] responde a la llamada"
 pam_oblate_patron_reason: "Un célebre patrón de novicios"
 pam_oblate_patron_modifier: "Patrón de novicios"
 pam_oblate_patron_modifier_desc: "Este personaje es célebre por apoyar a aquellos llamados al servicio religioso. Los votos resultan baratos y los progenitores se separan de sus hijos de modo más voluntario."
 pam_scriptorium_modifier: "Salón de escribanos"
 pam_scriptorium_modifier_desc: "Este personaje mantiene un salón de escribanos cuyo trabajo atrae a la capital a mentes ilustradas."
 pam_decision_events.0032.t: "Cuidar del rebaño"
 pam_decision_events.0032.desc.intro.christian: "Me dirijo a los escribanos y clérigos de mi casa, mientras pienso en quién será ordenado y quién aún desea mi guía."
 pam_decision_events.0032.desc.intro: "Me dirijo a aquellos que sirven a [ROOT.Char.GetFaith.GetName] en mi corte: ¿quiénes entrarán a Su servicio y quiénes desean mi guía?"
 pam_decision_events.0032.desc.pupil: "\n\nMi pupil[pam_clerical_pupil.Custom('ES_OA')] [pam_clerical_pupil.GetFirstName], destaca en la oración, ansios[pam_clerical_pupil.Custom('ES_OA')] por demostrar su valía."
 pam_decision_events.0032.desc.no_pupil: "\n\nMuy pocos de ellos han entrado al servicio de la fe; una carencia que busco solventar."
 pam_decision_events.0032.desc.novice: "\n\nMás allá de mi casa, un[pam_clerical_novice.Custom('ES_XA')] desconocid[pam_clerical_novice.Custom('ES_OA')] prometedor[pam_clerical_novice.Custom('ES_XA')] de nombre [pam_clerical_novice.GetFirstName] ruega un lugar al servicio de la fe."
 pam_decision_events.0032.desc.outro.christian: "\n\n¿Cómo cuidaré del rebaño que [ROOT.Char.GetFaith.HighGodName] me ha confiado?"
 pam_decision_events.0032.desc.outro: "\n\n¿Cómo estaré a la altura de aquellos que [ROOT.Char.GetFaith.HighGodName] me ha confiado?"
 pam_decision_events.0032.prodigy: "¡Mi pupil[pam_clerical_pupil.Custom('ES_OA')] tiene un don divino!"
 pam_decision_events.0032.oblates: "Que todos sepan que acojo a aquellos llamados al servicio."
 pam_decision_events.0032.piety: "Su devoción refuerza la mía propia."
 pam_decision_events.0032.novice: "Un alma prometedora; acoged[pam_clerical_novice.GetHerHim] de inmediato."
 pam_decision_events.0032.miracle: "Dicen que mi pupil[pam_clerical_pupil.Custom('ES_OA')] obra maravillas."
 pam_decision_events.0032.relic.christian: "¡Este texto sagrado debe estar en mi tesoro!"
 pam_decision_events.0032.relic: "Que estos escritos enriquezcan mi corte."
 pam_decision_events.0032.language: "Pondré a mi pupil[pam_clerical_pupil.Custom('ES_OA')] a estudiar los textos sagrados."
 pam_decision_events.0032.scriptorium.christian: "Pondré a trabajar a toda pluma de mi scriptorium."
 pam_decision_events.0032.scriptorium: "Pondré a trabajar a todo escribano de mi corte."
 pam_decision_events.0032.a.christian: "Ordenar a los más merecedores de mi casa."
 pam_decision_events.0032.a: "Elevar al servicio de la fe a los más merecedores de mi casa."
 pam_decision_events.0032.a.tt: "Hasta [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] de tus [courtiers|El] laicos más ilustrados #weak (familiares incluidos)#! cada uno:\n$EFFECT_LIST_BULLET$ Se une al [clergy|El] del [pam_clerical_patron.GetFaith.GetName|l]\n$EFFECT_LIST_BULLET$ Gana [learning|El] [learning_i] y [opinion|El] sobre ti\n$EFFECT_LIST_BULLET$ Te concede [piety|El] [piety_i]"
 pam_decision_events.0032.b: "Instruir al clero que ya está a mi cuidado."
 pam_decision_events.0032.b.tt: "Hasta [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] de los [Concept('clergy', 'clérigos')|E] más ilustrados de tu corte cada uno:\n$EFFECT_LIST_BULLET$ Gana [learning|El] [learning_i] #weak (hasta [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Gana o aumenta el [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] o [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_decision_events.0032.c.named: "Acoge a [pam_clerical_novice.GetFirstNameNoTooltip] y haz saber que los novicios son bienvenidos."
 pam_decision_events.0032.c: "Haced saber que los novicios son bienvenidos."
 pam_decision_events.0032.c.tt: "Hasta [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] novicio(s) de las tierras circundantes:\n$EFFECT_LIST_BULLET$ Se une(n) a tu corte y al [clergy|El] del [pam_clerical_patron.GetFaith.GetName|l]\n$EFFECT_LIST_BULLET$ Se convierte(n) a tu [rite|El]"
 pam_seize_capital_clerical_region_decision: "Tomar la región clerical"
 pam_seize_capital_clerical_region_decision_desc: "Mi propia capital se encuentra en una [clerical_region|El] que no poseo. Ningún [archbishop|El] debería sentarse por encima del trono desde el que gobierno: aquel [title|El] pertenece al [head_of_faith|El]"
 pam_seize_capital_clerical_region_decision_tooltip: "Toma la [clerical_region|El] en la que está tu capital y depón a su [archbishop|El] si la sede no está vacante"
 pam_seize_capital_clerical_region_decision_confirm: "Tomar la sede"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName] es depuest[pam_deposed_archbishop.Custom('ES_OA')]"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName] pasa a tus manos"
