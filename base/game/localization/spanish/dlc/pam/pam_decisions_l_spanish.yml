 pam_determine_patron_saint_decision_desc: "Desde sus tronos celestiales, los santos observan las luchas de los gobernantes mortales y miden el temple de sus almas.\n\nDejadme elegir un patrón cuya virtud dé forma a mi camino y cuya intercesión fortalezca mi mano ante [ROOT.GetCharacter.GetFaith.HighGodName] y los hombres."
