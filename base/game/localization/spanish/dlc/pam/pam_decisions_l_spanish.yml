 pam_decision_events.0009.t: "Una administración sagrada"
 pam_decision_events.0009.desc: "Adoro colocar mi [ROOT.Char.Custom('ReligiousHeadHeadgear')] sobre mi cabeza y hablar a mis devotos [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n«La antigua tradición de los feudos nos fue útil hasta que empezamos a descarriarnos. Impulsados por la palabra de [ROOT.Char.GetFaith.HighGodName], es [ROOT.Char.GetFaith.HighGodNameSheHe|U] quien define cómo debemos gobernar en [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Yo solo soy Su humilde servidor[ROOT.Char.Custom('ES_XA')], al igual que todos vosotros»."
