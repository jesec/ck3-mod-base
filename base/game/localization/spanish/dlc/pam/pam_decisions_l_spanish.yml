 consecrate_kingdom_decision: "Consagrar un nuevo reino"
 consecrate_kingdom_decision_desc_self: "[ROOT.Char.GetFaith.HighGodName] es quien hace a los monarcas, y yo soy quien habla en nombre de [ROOT.Char.GetFaith.HighGodName]. ¿Acaso hay soberan[ROOT.Char.Custom('ES_OA')] más adecuad[ROOT.Char.Custom('ES_OA')] para gobernar en las tierras de los fieles?"
 consecrate_kingdom_decision_desc: "[ROOT.Char.GetFaith.HighGodName] es quien hace a los monarcas. En momentos de necesidad, puede incluso hacer que surjan de entre la nobleza más humilde.\n\nY estamos en un momento así. Rogaré que ponga una corona sagrada sobre mi cabeza."
 consecrate_kingdom_decision_confirm: "Asumir un mandato real"
 consecrate_kingdom_decision_tooltip: "Funda un nuevo [title|El] de [kingdom|El] con el respaldo de la alta autoridad espiritual, no de la base del poder de tu [realm|El]"
