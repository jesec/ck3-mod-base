 pam_renounce_papal_candidacy_decision: "Renunciar a ser [ROOT.Char.GetFaith.ReligiousHeadTitleName|l]"
 pam_renounce_papal_candidacy_decision_embrace: "Aspirar a ser [ROOT.Char.GetFaith.ReligiousHeadTitleName|l]"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Hay quienes pasan la vida entera escalando hacia el trono del [ROOT.Char.GetFaith.ReligiousHeadName|l] y he contemplado lo que la escalada les hacía.\n\nQue los [Concept('cardinal', 'cardenales')|E] sepan que no me presentaré cuando se elija al siguiente [ROOT.Char.GetFaith.ReligiousHeadName|l]. Tengo trabajo aquí, en mi propia sede."
 pam_renounce_papal_candidacy_decision_desc_embrace: "En el pasado hice saber que no me presentaría al trono del [ROOT.Char.GetFaith.ReligiousHeadName|l]. Era joven entonces y el [ROOT.Char.GetFaith.GetName|l] se hallaba en manos más gentiles.\n\nQue los [Concept('cardinal', 'cardenales')|E] sepan que, después de todo, sí que estoy dispuest[ROOT.Char.Custom('ES_OA')]"
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Retirarse de que se te tenga en cuenta como siguiente [head_of_faith|El]"
