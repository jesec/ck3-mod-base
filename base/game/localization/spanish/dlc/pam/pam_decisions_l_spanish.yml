 pam_bull_events.0004.desc.tenet_permitted: "«Todos los que creéis en [tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l], sabed que ahora se permite bajo el permiso de [bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip]»."
