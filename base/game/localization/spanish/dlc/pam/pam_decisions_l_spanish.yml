 pam_decision_events.0015.t: "Divulgar mis actos piadosos"
 pam_decision_events.0015.desc.intro.no_praiser: "Mis leales sacerdotes comparten"
 pam_decision_events.0015.desc.intro.praiser: "Mi influyente [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.Custom('ES_ElLa')] [my_praiser.GetTitledFirstName|l], comparte"
 pam_decision_events.0015.desc.intro: "el encomio redactado por mi [GetDomicileBuilding('chancery_01').GetName|l]:\n\n«Los actos virtuosos son como semillas plantadas por el Señor, que esperan florecer en piadosa abundancia. Todos deben conocer a [praise_worthy_priest.GetName] por su noble"
 pam_decision_events.0015.desc.virtuoustrait: "y [my_virtuous_trait.GetName(praise_worthy_priest)|l]"
 pam_decision_events.0015.desc.mid: "virtud, guiada por"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]…»"
 pam_decision_events.0015.desc.novirtuoustenet: "Dios…»."
 pam_decision_events.0015.desc.bad: "\n\nA pesar de las palabras de alabanza, mi corazón teme el beso de fuego del infierno."
 pam_decision_events.0015.desc.good: "\n\nVerdaderamente soy un instrumento del Señor, una manifestación de su belleza en la Tierra."
 pam_decision_events.0015.desc.neutral: "\n\nA pesar de las palabras de alabanza, solo en la muerte sabré si mi alma ha servido bien al Señor."
 pam_decision_events.0015.desc.outro: "\n\n«… ¡En efecto, por la rectitud de sus actos, esta es la clase de [praise_worthy_priest.GetWomanMan] que algún día liderará la Iglesia!»."
 pam_decision_events.0015.b: "«He obrado muchos milagros»."
 pam_decision_events.0015.b.flavor: "¿Por qué conformarse con el papado, cuando es posible la canonización?"
 pam_decision_events.0015.b.tt: "#V Aumentar probabilidad de canonización#! después de la muerte\n#weak Hace falta una [dynasty|El] para la canonización#!"
 pam_decision_events.0015.c: "Si el Señor desea que sea líder…"
 pam_decision_events.0015.c.flavor: "… responderé ante la situación"
 pam_decision_events.0015.c.tt: "#V Aumentar la puntuación de elección#! para [praise_worthy_priest_superior_title.GetName|l]: #P +30#!"
 pam_decision_events.0015.d: "Que no salga otro nombre."
 pam_decision_events.0015.d.flavor: "Vaciad las arca de mi devoción. No quedaré en segundo lugar."
 pam_decision_events.0015.d.tt: "#V Aumentar la puntuación de elección#! para [praise_worthy_priest_superior_title.GetName|l]: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, bastante como para quedar en primer lugar como $theocratic_elective_populist$\nRequiere [praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] de [piety|El] @piety_icon!"
