 pam_kowtow_to_pope_needs_head_of_faith_tt: "Tu [faith|El] debe tener un [head_of_faith|El]"
 pam_kowtow_to_pope_toast: "Te doblegas ante tu [ROOT.Char.GetFaith.ReligiousHeadName]"
 pam_decision_events.0001.a.confession_random_outcome: "Tu [court_chaplain|El] puede pedirte algo o puede que oigas algo durante la confesión…"
 pam_decision_events.0001.a.piety: "Tu confesión parecía sincera"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName] se ha enterado de cierta información"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName] no aprueba tus rasgos pecaminosos"
