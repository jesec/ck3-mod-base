 pam_proclaim_living_word_decision_realm_rite_tt: "Todo [county|El] de tu [realm|El] sigue tu [rite|El] y al menos hay #V 5#! de estos"
 pam_proclaim_living_word_decision_effect_tt: "Elegirás entre:\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_shepherd_of_the_faithful_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$ [GetModifier( 'pam_herald_fire_and_sword_modifier' ).GetNameWithTooltip]"
 pam_decision_events.0021.t: "La Palabra Viva"
 pam_decision_events.0021.desc: "No hay espacio para arrodillarse en mi [ROOT.Char.Custom('GetFaithTemple')]. Peregrinos y [ROOT.Char.GetFaith.PriestNeuterPlural] rezan codo con codo, los barones se apretujan con los mendigos, y aun así siguen congregándose grandes multitudes a las puertas.\n\nMis hazañas se han contado con mayor detalle que lo que cualquier cronista podría precisar: todos los senderos que recorrí, cada vigilia que guardé y cada moneda que di en nombre de [ROOT.Char.GetFaith.HighGodName]. Uno de mis [ROOT.Char.GetFaith.PriestNeuterPlural] me coge de la mano y la presiona contra el altar [ROOT.Char.GetFaith.HighGodNamePossessive]: «Hablad, y os escucharemos».\n\nEl silencio que le sucede me pertenece. Cómo decida llenarlo resonará más allá de estos muros."
 pam_decision_events.0021.a: "Que la piedad sea mi sermón."
 pam_decision_events.0021.b: "Portaré la palabra con fuego y espada."
 pam_herald_shepherd_of_the_faithful_modifier: "Pastor de fieles"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Este personaje ha proclamado su deber sagrado con palabras piadosas y los fieles lo han adorado por ello."
 pam_herald_fire_and_sword_modifier: "Fuego y espada"
 pam_herald_fire_and_sword_modifier_desc: "Este personaje ha proclamado su deber sagrado como una llamada a las armas y los guerreros de la fe se han congregado en torno a su estandarte."
 pam_convert_to_theocracy_decision: "Adoptar el gobierno teocrático"
 pam_convert_to_theocracy_decision_desc: "La jerarquía actual es una perversión de las reglas establecidas por [ROOT.Char.GetFaith.GoodGodNames]. Me ha sido concedida la única vía para enmendarla, con la que alabaré a [ROOT.Char.GetFaith.GoodGodNames] y cumpliré mi deber con mi gente al mismo tiempo. Esta es la palabra de [ROOT.Char.GetFaith.GoodGodNames]."
 pam_convert_to_theocracy_decision_confirm: "Ejercer la autoridad de [ROOT.Char.GetFaith.HighGodName|U]"
 pam_convert_to_theocracy_decision_tooltip: "Cambia tu [government|El] a una [theocracy|El]"
 pam_convert_theocracy_to_feudal_decision: "Restaurar el gobierno temporal"
 pam_convert_theocracy_to_feudal_decision_desc: "Como autoridad nominal de la ley de [ROOT.Char.GetFaith.HighGodName|U], los [ROOT.Char.GetFaith.GetAdherentNamePlural] acuden a mí en busca de consejo espiritual. Sin embargo, me siento incapaz de desempeñar dicha tarea y delego tales juicios en mi [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName|l]. \n\n¡Dado que mi experiencia es temporal, es justo que acepte una corona secular! Ni [ROOT.Char.GetFaith.PriestNeuterPlural], ni tan siquiera [ROOT.Char.GetFaith.HighGodName]: que el pueblo sepa que soy yo quien está a cargo."
 pam_convert_theocracy_to_feudal_decision_tooltip: "Convertir tu [realm|El] en [feudal|El] en lugar de una [theocracy|El]"
 pam_convert_theocracy_to_feudal_decision_confirm: "Devolver el señorío a los mortales"
