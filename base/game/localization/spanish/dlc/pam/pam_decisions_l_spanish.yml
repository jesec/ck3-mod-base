 pam_decision_events.0008.t: "Recaudar los diezmos"
 pam_decision_events.0008.desc.intro: "Las arcas están a rebosar en [ROOT.Char.GetFaith.HouseOfWorshipPlural] dentro de mi alcance. El sonido de mis guardias entrando a los templos suele ir seguido del tintineo de las monedas.\n\n"
 pam_decision_events.0008.desc.chaplain: "«¿Es que ahora [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetTitleAsNameNoTooltip|l] se divierte humillando a los siervos de [ROOT.Char.GetFaith.HighGodName]?», reprende [chaplain.Custom('ES_ElLa')] [chaplain.GetTitledFirstName|l]. «¿Os produce placer desvalijar su casa como a una #EMP sucia#! prostituta?»."
 pam_decision_events.0008.desc.fallback: "Los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] apartan la cara llenos de repulsión. Los siervos de [ROOT.Char.GetFaith.HighGodName] parecen terriblemente interesados en el oro."
 pam_decision_events.0008.a: "¿La generosidad no es una virtud?"
