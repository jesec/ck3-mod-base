 pam_promulgate_word_of_pious_deeds_decision: "Divulgar mis actos piadosos"
 pam_promulgate_word_of_pious_deeds_decision_desc: "Mi cancillería ha redactado un encomio en el que se alaban mis actos cristianos. Aunque es impropio que ensalce mis propias virtudes, aquellos cercanos a mí desean dar a conocer mi devoción a todos los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nCon tal divulgación, podría extender la idea de que soy [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetWomanMan] más apropiad[ROOT.Char.Custom('ES_OA')] para subir al trono de san Pedro… o incluso más alto."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Aumentar la puntuación de elección#! para [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)|l]: #P +30#! o mejorar las probabilidades de [canonization|El]"
