 nick_the_reconciler: "e/la de la Reconciliación"
 nick_the_reconciler_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha sanado la ruptura en el mundo cristiano y ha traído de vuelta a la comunión a las antiguas sedes."
 nick_the_concordant: "[CHARACTER.Custom('ES_ElLa')] Concordante"
