 pam_decision_last_rites_desc: "#EMP ¡Ten piedad de mí, oh, [ROOT.Char.GetFaith.HighGodName]! Limpia mi maldad y purifica mis pecados.#!\n\nAntes de que se produzca mi inminente partida de esta existencia carnal, quiero dejar mi alma preparada. Protegiéndome de la influencia del infierno, podré entonces tener una buena muerte y encontrar la vida eterna en la morada del Reino de los Cielos."
