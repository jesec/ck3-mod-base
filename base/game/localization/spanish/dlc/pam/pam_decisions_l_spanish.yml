 pam_bull_events.0002.desc.tenet_permitted: "«Todos los que creéis en [tenet_scope.GetName( ROOT.GetCharacter.GetRite )|l], sabed que ahora se permite en [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]»."
 pam_bull_events.0002.desc.tenet_forbidden: "«Nuestro hogar no es lugar para la doctrina de [tenet_scope.GetName( ROOT.GetCharacter.GetRite )]. Que todos sus practicantes sepan que están violando la santidad de la Iglesia, y que han cometido un pecado mortal»."
