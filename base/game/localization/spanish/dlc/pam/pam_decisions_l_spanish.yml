 pam_kingdom_of_heaven.0001.t: "El Reino de los Cielos"
 pam_kingdom_of_heaven.0001.desc: "«El reino de Dios se parece a un hombre que echa semilla en la tierra. Él duerme de noche y se levanta de mañana; la semilla germina y va creciendo, sin que él sepa cómo».\n\nMe vuelvo hacia la cristiandad. En los dedos sostengo polvo de Tierra Santa.\n\n«La tierra va produciendo fruto sola: primero los tallos», abro la mano y el polvo se disipa en el aire. «Luego la espiga», señalo mi pueblo. «Después el grano». Alzo el báculo.\n\n«Cuando el grano está a punto, se usa la hoz, porque ha llegado la siega»."
 pam_kingdom_of_heaven.0001.a: "No abandonaré [previous_capital.GetNameNoTooltip]."
 pam_kingdom_of_heaven.0001.b: "¿Qué es la sede de san Pedro comparada con la sede de Cristo?"
