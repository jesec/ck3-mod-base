 pam_decision_events.0001.t: "Confesión"
 pam_decision_events.0001.desc.intro: "[chaplain.Custom('ES_ElLa')|U] [chaplain.GetTitledFirstName|l] espera pacientemente en la capilla vacía.\n\n"
 pam_decision_events.0001.desc.bad: "Su severa mirada imita a la que espero del Padre."
 pam_decision_events.0001.desc.good: "Incluso aunque la carga que llevo sobre mis hombros no sea tan pesada, se puede aligerar."
 pam_decision_events.0001.desc.neutral: "Como un animal de un rebaño que se ha perdido, con dudas acerca de la bondad de mi corazón, me acerco a [chaplain.GetSheHe]."
 pam_decision_events.0001.desc.sin.preamble: "\n\nLa culpa que siento por mis pecados no me es ajena."
 pam_decision_events.0001.desc.sin.lustful: "He dejado que la lujuria domine mi voluntad."
 pam_decision_events.0001.desc.sin.chaste: "La castidad se ha convertido en un frío refugio del deber."
 pam_decision_events.0001.desc.sin.gluttonous: "He saciado mi apetito sin contenerme un ápice."
 pam_decision_events.0001.desc.sin.temperate: "Mi templanza se ha endurecido hasta convertirse en negación de las necesidades."
 pam_decision_events.0001.desc.sin.greedy: "Me he aferrado al dinero cuando tendría que haberlo donado."
 pam_decision_events.0001.desc.sin.generous: "Mi generosidad ha superado a mi sabiduría y me ha dejado sin nada."
 pam_decision_events.0001.desc.sin.lazy: "La pereza me ha alejado de la oración y el deber."
 pam_decision_events.0001.desc.sin.diligent: "Mi afán por el trabajo ha desplazado a la piedad."
 pam_decision_events.0001.desc.sin.wrathful: "La ira me ha conducido al pecado."
 pam_decision_events.0001.desc.sin.calm: "Mi calma ha sido indiferencia disfrazada de virtud."
 pam_decision_events.0001.desc.sin.patient: "Mi paciencia se ha transformado en cobarde aplazamiento."
 pam_decision_events.0001.desc.sin.impatient: "La impaciencia me ha endurecido y me ha vuelto imprudente."
 pam_decision_events.0001.desc.sin.arrogant: "El orgullo ha henchido mi corazón."
 pam_decision_events.0001.desc.sin.humble: "La falsa humildad me ha alejado de la verdad."
 pam_decision_events.0001.desc.sin.deceitful: "He dicho mentiras y he ocultado mi falta de honestidad."
 pam_decision_events.0001.desc.sin.honest: "Mi franqueza ha herido cuando era necesario tener tacto."
 pam_decision_events.0001.desc.sin.craven: "El miedo me ha hecho olvidar lo que era correcto."
 pam_decision_events.0001.desc.sin.brave: "Mi osadía ha superado a la prudencia y me he vuelto imprudente."
 pam_decision_events.0001.desc.sin.shy: "La timidez me ha alejado del bien que debía hacer."
 pam_decision_events.0001.desc.sin.gregarious: "Mi amor por la compañía ha ahogado mi consciencia."
 pam_decision_events.0001.desc.sin.ambitious: "La ambición ha superado mi consciencia."
 pam_decision_events.0001.desc.sin.content: "Mi complacencia ha embotado mi sed de justicia."
 pam_decision_events.0001.desc.sin.arbitrary: "He gobernado por el capricho en vez de con justicia."
 pam_decision_events.0001.desc.sin.just: "Mi justicia ha sido despiadada y orgullosa."
 pam_decision_events.0001.desc.sin.cynical: "El cinismo ha corroído mi fe."
 pam_decision_events.0001.desc.sin.zealous: "Mi fanatismo ha ardido más que mi caridad."
 pam_decision_events.0001.desc.sin.paranoid: "Mis sospechas han envenenado mis tratos con los demás."
 pam_decision_events.0001.desc.sin.trusting: "La confianza me ha cegado frente a la maldad."
 pam_decision_events.0001.desc.sin.compassionate: "La compasión me ha llevado a excusar lo que debía condenar."
 pam_decision_events.0001.desc.sin.callous: "He endurecido mi corazón frente al sufrimiento ajeno."
 pam_decision_events.0001.desc.sin.stubborn: "Mi obstinación me ha impedido ver lo que era justo."
 pam_decision_events.0001.desc.sin.fickle: "Mi volubilidad ha hecho que mi palabra sea poco fiable."
 pam_decision_events.0001.desc.sin.eccentric: "Mis excentricidades han escandalizado a los fieles."
 pam_decision_events.0001.desc.sin.vengeful: "La venganza me ha consumido."
 pam_decision_events.0001.desc.sin.forgiving: "Me he precipitado a la hora de perdonar las ofensas más graves."
 pam_decision_events.0001.desc.sin.sadistic: "He obtenido placer en la crueldad."
 pam_decision_events.0001.desc.outro: "\n\n«[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]»"
 pam_decision_events.0001.a: "Perdonadme, [chaplain.GetMotherFather], porque he pecado."
 pam_john_20_22_english: "Recibid el Espíritu Santo. A quienes les perdonéis los pecados, les quedan perdonados; a quienes se los retengáis, les quedan retenidos."
 JOHN_20_22_GLOSS: "#weak Juan 20:22-23, SBCEE#!"
 pam_decision_act_of_devotion: "Escenificar un acto de devoción"
 pam_decision_act_of_devotion_desc: "¡Mi profunda conexión interior con [ROOT.Char.GetFaith.HighGodName] es tan fuerte que debo exteriorizarla!\n\nReunid a mis [ROOT.Char.GetFaith.PriestNeuterPlural] y celebrad una gran misa, a la que acuda todo el señorío. Que vean cuán devot[ROOT.Char.Custom('ES_OA')] es su señor[ROOT.Char.Custom('ES_XA')]."
 pam_decision_act_of_devotion_desc_tooltip: "Cambiar [piety|El] por [prestige|El]"
 pam_decision_act_of_devotion_tooltip_effect: "Elegirás entre:\n$BULLET_WITH_TAB$ #P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! de [prestige|El] [prestige_i]\n$BULLET_WITH_TAB$ #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! de [prestige|El] [prestige_i] y un [prestige_level|El] adicional a cambio de un [piety_level|El]"
 pam_decision_act_of_devotion_confirm: "¡Que suenen las campanas!"
 pam_decision_act_of_devotion_sp_tooltip: "Tu [spiritual_fulfillment|El] está al menos en #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "Tu [prestige_level|El] debe ser inferior a [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]"
 pam_confession_penalty_modifier: "Penitencia de confesión"
 pam_confession_penalty_modifier_desc: "Este personaje debe llevar a cabo una acción a petición de su confesor"
 pam_meddled_in_clerical_appointments_modifier: "Interferencia en nombramientos clericales"
 pam_meddled_in_clerical_appointments_modifier_desc: "Este [ruler|El] ha reemplazado a la fuerza al [holder|El] de un [clerical_title|El], lo que ha enfurecido al [clergy|El]."
 pam_kowtowed_to_pope_modifier: "Doblegarse ante la Iglesia"
 pam_kowtowed_to_pope_modifier_desc: "Este [ruler|El] se ha postrado ante la Iglesia y se ha comprometido a apoyar la doctrina #EMP espiritual, revocable#! en el concilio que pone fin a la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]. Desaparecerá cuando el concilio resuelva la controversia."
 pam_kowtow_to_pope_decision: "Doblegarse ante [ROOT.Char.GetFaith.ReligiousHeadName|l]"
 pam_kowtow_to_pope_decision_desc: "La corona y el báculo están enfrentados sobre quién nombra a los titulares de títulos clericales. En lugar de arriesgarse a un desafío abierto, mejor agachar la cabeza ante [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetFaith.ReligiousHeadName|l] y ponerse de lado de los fieles cuando se convoque el gran concilio para solucionar el asunto."
 pam_kowtow_to_pope_decision_tooltip: "Comprometerse a apoyar el derecho de la Iglesia a los nombramientos"
 pam_kowtow_to_pope_decision_confirm: "Doblegarse"
 pam_kowtow_to_pope_effect_tt: "Apoyarás la doctrina #EMP espiritual, revocable#! en el concilio que pone fin a la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]."
