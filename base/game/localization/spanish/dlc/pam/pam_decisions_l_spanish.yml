 pam_raise_khachkar_decision: "Alzar un jachkar"
 pam_raise_khachkar_decision_desc: "[GetTenetType('tenet_khachkar').GetName( ROOT.Char.GetRite )] enseña que a los muertos se los honra mejor tallando la piedra. Debo alzar una cruz ornamentada para que mi estirpe sea recordada. Crearé una conexión entre los vivos, los muertos y la tierra."
