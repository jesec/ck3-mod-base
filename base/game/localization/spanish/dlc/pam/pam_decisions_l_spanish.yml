 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Puede que debas revelar un [secret|El]"
 pam_decision_events.0005.details: "Tendrás oportunidades para [lease|El] [titles|El] o, si no tienes ninguno disponible, donar [gold|El] a [monastic_holy_orders|El], [holy_orders|El] o a [the_christian_church|El], lo que proporcionará [modifiers|El] beneficiosos para tu [player_heir|El]"
 pam_decision_events.0005.t: "Últimos sacramentos: mi hora final"
 pam_decision_events.0005.desc.healthtrait: "El pecado me ha vuelto [death_trait.GetName(soon_dead)|l] y probablemente será la causa de mi muerte inminente."
 pam_decision_events.0005.desc.bad: "Me he esforzado por honrar a [ROOT.Char.GetFaith.HighGodName] y en mi arrogancia he intentado ocultar mis pecados de sus omnipresentes ojos.\n\n"
 pam_decision_events.0005.desc.good: "En su misericordia, siento que los ángeles están cerca, protegiendo mi alma de los demonios que intentan llevársela.\n\n"
 pam_decision_events.0005.desc.neutral: "Aunque he intentado honrar a [ROOT.Char.GetFaith.HighGodName], a medida que me aproximo al umbral de la eternidad, me preocupa que mi alma sea juzgada inapropiada para entrar en el Reino de los Cielos.\n\n"
 pam_decision_events.0005.desc.notalone: "A mi lado están mi [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))], [fam_or_friend_1.GetFirstName], y otros que rezarán por mi alma."
 pam_decision_events.0005.desc.alone: "En soledad, tiemblo de miedo, pues no hay seres queridos cerca que recen por mi alma."
 pam_decision_events.0005.desc.outro: "Mi confesor, con el [Glossary('sacramentario','SACRAMENTARY_GLOSS')] en mano, me advierte: «¡Recibid a [ROOT.Char.GetFaith.HighGodName] sin engaños!».\n\nHasta el rey David, lleno de pecado, quedó purificado después de confesarse…[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "El sacramento de la penitencia se halla ante mí."
 pam_decision_events.0005.b: "¡Que el diablo me lleve! Alejad a este sacerdote de mí."
 pam_psalm_51_english: "«Desobedeciéndote… he pecado y he hecho el mal… Tu sentencia es justa e irreprochable cuando emites tu juicio."
 SACRAMENTARY_GLOSS: "El sacramentario o el #EMP liturgikon#! fueron libros usados en los servicios litúrgicos llevados a cabo por un sacerdote u obispo cristiano. Dependiendo de la era o de la región, podían contener textos para recitar o cantar, junto con los de los sacramentos."
 pam_decision_events.0006.t: "Últimos sacramentos: mi pecado está siempre ante mí"
 pam_decision_events.0006.intro: "«Errar es humano. Pero sin confesión, no hay absolución», dice [confessor.Custom('ES_ElLa')] [confessor.GetTitledFirstName|l]."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\nMis pecados han sido graves y frecuentes. Mi alma me pesa, agarrada por los ardientes dedos de Satanás, que intenta llevarse lo que claramente le pertenece.\n\n"
 pam_decision_events.0006.desc.good: "\n\nMi corazón está tranquilo porque mis acciones han seguido la voluntad del Señor.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nComo [ROOT.Char.GetWomanMan] que soy, el pecado me ha encontrado a pesar de mis buenas intenciones.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "¡Cuán a menudo se ha visto mi alma descarriada a causa de mi carácter [my_sinful_trait.GetName(soon_dead)|l]!"
 pam_decision_events.0006.desc.secret_sin: "He escondido en un puerto de oscuridad que soy [my_secret.GetName]."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "¡Quizá lo peor de todo sea que soy [my_criminal_trait.GetName(soon_dead)|l]! Mi sofocante culpa estrangula hasta mi aliento."
 pam_decision_events.0006.desc.sin_default: "Mis pecados, aunque ciertamente son muchos, son difíciles de recordar. Seguro que en cuanto hable con [confessor.Custom('ES_ElLa')] [confessor.GetTitledFirstNameNoTooltip|l] fluyen como un océano que pretende desbordar un dique."
 pam_decision_events.0006.desc.sin_default_good_sp: "Que [ROOT.Char.GetFaith.HighGodName] aplaste mis huesos y desaparezca la desigualdad."
 pam_decision_events.0006.desc.outro: "Debo confesar mis pecados con la debida contrición o se me negará la Eucaristía."
 pam_decision_events.0006.a: "«Perdonadme, [confessor.GetMotherFather]…»"
 pam_decision_events.0006.b: "Algunos pecados deben irse a la tumba conmigo."
 pam_decision_events.0006.b.flavor: "Confiesas algunos pecados, pero te contienes con secretos que podrían implicar a otros."
 pam_decision_events.0007.t: "Últimos sacramentos: carne, sangre y óleo"
 pam_decision_events.0007.intro: "Así ha pasado la cuenta de mis pecados. Una cosa es deber una perra chica y otra diez mil talentos.\n\nMi confesor presenta el pan y el vino consagrados."
 pam_decision_events.0007.desc.bad: "Incluso ahora que la carne y la sangre de mi Señor se presentan ante mí, oigo los susurros de diablos que me ruegan que haga entrega de mi alma para que pueda seguir viviendo y disfrutando de los placeres mundanos.\n\n"
 pam_decision_events.0007.desc.good: "Despojándome de toda carga, me lanzo al abrazo de la muerte. Ansío consumir la carne y la sangre de mi Señor, de quien pronto estaré cerca.\n\n"
 pam_decision_events.0007.desc.neutral: "Que la carne y la sangre del Señor me protejan de los demonios que acechan como lobos para arrastrarme en mi hora final.\n\n"
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U] unge mi frente, mis manos y mis pies con el óleo santo."
 pam_decision_events.0007.desc.oil.bad: "Mi alma sigue angustiada.\n\n"
 pam_decision_events.0007.desc.oil.good: "Mi alma brilla con el amor del Señor.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "Mi alma, protegida, se siente lista para emprender su viaje.\n\n"
 pam_decision_events.0007.desc.outro: "Tras completar el [Glossary('viaticum','VIATICUM_GLOSS')] y la [Glossary('unción','UNCTION_GLOSS')], puedo decidir quién rezará por mí."
 VIATICUM_GLOSS: "Significa «la provisión para un viaje» en latín. El viaticum es el nombre del sacramento de la comunión o de la Eucaristía en el contexto de los últimos sacramentos. El viaje en cuestión es el paso a la vida eterna en el más allá."
 UNCTION_GLOSS: "La extremaunción es como se conoce a la unción de los enfermos con los santos óleos, cuando están «in extremis» o cercanos a la muerte. Se hace para preparar su paso a la vida eterna."
 pam_decision_events.0007.a: "Que la orden de [monastic_order.GetName] rece por mí."
 pam_decision_events.0007.b: "Yo reforzaría la orden de [military_order.GetName]."
 pam_decision_events.0007.c: "[religious_head.Custom('ES_ElLa')|U] [religious_head.GetTitledFirstNameNoTooltip|l] tendrá mi riqueza, y yo sus rezos."
 pam_decision_events.0007.d: "Una palabra piadosa [confessor.Custom('ES_AlAla')] [confessor.GetTitledFirstNameNoTooltip|l] basta."
