 pam_decision_confession_name_low: "Confesar mis pecados"
 pam_decision_confession_desc: "Cuando un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] es consciente de la culpa que acarrea, debe confesar sus pecados."
 pam_decision_confession_tooltip: "Confesar tus pecados"
 pam_decision_confession_tooltip_sp_effect: "Obtendrás un poco de [spiritual_fulfillment|El]"
 pam_decision_confession_tooltip_stress_effect: "Perderás un poco de [stress|El]"
 pam_decision_confession_confirm: "Llamar a [ROOT.Char.GetFaith.PriestNeuter]"
