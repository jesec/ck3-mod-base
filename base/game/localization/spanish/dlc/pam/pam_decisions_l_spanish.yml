 pam_antipope_events.0001.t: "[ROOT.Char.GetFaith.ReligiousHeadName|U] rival"
 pam_antipope_events.0001.desc.intro: "Todo el [ROOT.Char.GetRite.GetName|l] parece estar reunido aquí, en su [ROOT.Char.GetFaith.HouseOfWorship].\n\n"
 pam_antipope_events.0001.desc.self: "Alzo la mano bien alto. El falso gobierno [pope.Custom('ES_DelDela')] [pope.GetTitledFirstName|l] pronto llegará a su fin. Depende de mí guiar a su maltratado rebaño a partir de ahora."
 pam_antipope_events.0001.desc.sponsor: "«¡Que los heraldos proclamen que #EMP yo#! soy [antipope.Custom('ES_ElLa')] verdader[antipope.Custom('ES_OA')] [ROOT.Char.GetFaith.ReligiousHeadName|U]!», brama [antipope.Custom('ES_ElLa')] [antipope.GetTitledFirstName|l]. «¡Que todos sepan que [pope.Custom('ES_ElLa')] fals[pope.Custom('ES_OA')] [pope.GetTitledFirstName|l] se esconde en su palacio de [pope_capital.GetName] mientras los fieles deambulan desatendidos y sin nadie que los guíe!».\n\nSe gira hacia mí. «Pero no temáis más. [ROOT.Char.Custom('ES_ElLa')|U] piados[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitledFirstName|l] ha decidido poner fin a vuestras penas. Y yo estoy con [ROOT.Char.Custom('ES_ElElla')]»."
 pam_antipope_events.0001.a: "Que el [ROOT.Char.GetFaith.GetNameNoTooltip|l] tiemble."
 pam_antipope_events.0002.opening: "[ROOT.Char.Custom('ES_AlAla')|U] [ROOT.Char.GetTitledFirstNameNoTooltip|l] de fe [ROOT.Char.GetFaith.GetAdjectiveNoTooltip],"
 pam_antipope_events.0002.desc.challenger_sponsor: "Sabed que yo, [sponsor.Custom('ES_ElLa')] [sponsor.GetTitledFirstName|l], he alzado [antipope.Custom('ES_AlAla')] [antipope.GetTitledFirstName|l]"
 pam_antipope_events.0002.desc.antipope_self: "Sabed que yo, [sponsor.Custom('ES_ElLa')] [sponsor.GetTitledFirstName|l], me he alzado"
 pam_antipope_events.0002.desc.outro: "como [ROOT.Char.GetFaith.ReligiousHeadName] rival, en oposición [pope.Custom('ES_AlAla')] fals[pope.Custom('ES_OA')] [pope.GetTitledFirstName|l] y para guiar a los fieles del [antipope.GetRite.GetName|l], como exige nuestra tradición."
 pam_antipope_events.0002.a: "¿Mi $anti_religious_head_name$ rival…?"
