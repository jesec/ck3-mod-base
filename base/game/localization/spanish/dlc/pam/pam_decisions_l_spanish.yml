 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUIName] te pide que contrates un [GetCourtPositionType('high_almoner_court_position').GetName()|l]"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUIName] te pide que no declares guerras ofensivas en al menos #V 5 años#!"
