 pam_proclaim_living_word_decision: "Proclamar la Palabra Viva"
 pam_proclaim_living_word_decision_desc: "Los fieles susurran que [ROOT.Char.GetFaith.HighGodName] me ha señalado. Los peregrinos mencionan mi nombre en los santuarios de los caminos y [ROOT.Char.GetFaith.PriestNeuterPlural] citan mis juicios como si fueran escrituras.\n\nQue todos los altares lo proclamen: a través de mí, la Palabra Viva se manifiesta."
