 pam_decision_events.0011.opening: "A los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de cada territorio:"
 pam_decision_events.0011.desc.permitted: "He dado mi visto bueno a este asunto. A partir de hoy, [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetFaith )] se considerará una de las enseñanzas aceptadas de nuestra fe.\n\nAquellos que lo practicaban en las sombras pueden dar un paso al frente."
 pam_decision_events.0011.desc.prohibited: "He dado mi visto bueno a este asunto. A partir de hoy, [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetFaith )] se considerará un anatema. Aquellos que se aferran a él se apartan de los fieles."
 pam_decision_events.0011.desc.fallback: "He hecho una proclamación que tiene que ver con [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetFaith )]."
 pam_decision_events.0011.b: "Y sin embargo mantengo la fe en esta enseñanza…"
 pam_decision_events.0012.opening: "A los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de cada territorio:"
 pam_decision_events.0012.desc: "[bull_issuer.Custom('ES_ElLa')|U] [bull_issuer.GetTitledFirstName|l] ha declarado herejía al [heresy_rite.GetName|l].\n\nQue todos los gobernantes de la fe se enteren."
 pam_decision_events.0012.a: "Que así sea."
 pam_decision_events.0013.opening: "[ROOT.Char.Custom('ES_AlAla')|U] [ROOT.Char.GetTitledFirstNameNoTooltip|l], que en su día se contó entre los fieles,"
 pam_decision_events.0013.desc.intro: "Está hecho. El [heresy_rite.GetName|l] se proclama herejía y todos aquellos que se aferren a él quedan apartados del [bull_issuer.GetFaith.GetName|l], por completo."
 pam_decision_events.0013.desc.outro: "\n\nAsí que elegid: arrodillaos una vez más y se os acogerá de nuevo en el redil, o aferraos a vuestra falsedad y se os condenará."
 pam_decision_events.0013.a: "Nos mantendremos firmes, y con gusto."
 pam_decision_events.0013.b: "No me expulséis. Acogedme de nuevo."
