 pam_decision_events.0004.t: "Un nuevo comienzo"
 pam_decision_events.0004.desc: "Durante años, he llevado ornamentos en lugar de un estandarte. Sin embargo, el rango y el poder han llegado hasta a mí de todos modos.\n\n¿Por qué ha de desaparecer mi legado conmigo, sencillamente porque nací sin nombre?"
