 pam_bull_events.0003.desc.heresiarch: "y su líder, [heresiarch.Custom('ES_ElLa')] [heresiarch.GetTitledFirstName|l], será llamad[heresiarch.Custom('ES_OA')] heresiarca»."
 pam_bull_events.0003.desc.no_heresiarch: "por los siglos que vendrán»."
