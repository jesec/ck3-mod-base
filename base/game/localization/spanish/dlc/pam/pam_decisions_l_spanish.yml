 pam_bull_events.0001.desc: "«Os exhorto a todos a que os opongáis a los infieles de [title.GetName], liberéis estas tierras de su tiranía y recuperéis a los miles de hermanos cautivos de sus garras».\n\n«Para que la dignidad del nombre cristiano crezca con el tiempo, y que vuestro valor, que es alabado a través del mundo entero, permanezca intacto e inalterable»."
