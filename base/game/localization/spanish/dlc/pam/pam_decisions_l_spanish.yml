 pam_decision_events.0019.t: "Defensor de los peregrinos"
 pam_decision_events.0019.desc: "Se enviará una carta a todos los [ROOT.Char.GetFaith.GetAdherentNamePlural] con mi mensaje:\n\n«Los caminos a los lugares sagrados se han vuelto peligrosos. Que todos sepan que los fieles podrán portar armas en sus peregrinaciones y que podrán defenderse contra cualquiera que se interponga en su camino hacia el paraíso»."
 pam_decision_events.0019.a: "Oh, Señor, fortalece nuestras armas."
 pam_decision_events.0018.opening: "A los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de cada territorio:"
 pam_decision_events.0018.desc.armed_pilgrimages: "He dado mi visto bueno a este asunto. A partir de hoy, [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )] será una de las principales creencias del [hof_scope.GetFaith.GetName|l].\n\nQue todos los gobernantes de la fe lo sepan."
 pam_decision_events.0018.desc.struggle_submission: "He dado mi visto bueno a este asunto. A partir de hoy, [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )] será una de las principales creencias del [hof_scope.GetFaith.GetName|l].\n\nQue todos los gobernantes de la fe lo sepan."
 pam_decision_events.0018.a: "Que así sea."
 pam_decision_events.0017.t: "Alzar un jachkar ancestral"
 pam_decision_events.0017.desc: "He elegido un lugar alto desde el que la cruz de piedra vigilará [khachkar_location.GetNameNoTier].\n\nDejaré que los maestros talladores creen algo realmente aleccionador que conmemore [khachkar_ancestor.Custom('ES_AlAla')] [khachkar_ancestor.GetTitledFirstNameNicknamed|l]. Una cruz rodeada de rosetas, ornamentos y una inscripción con la que su [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] honró su memoria.\n\nQue los peregrinos de la zona recen a sus pies y que todos vean que nuestro gobierno sobre estas tierras es justo."
 pam_decision_events.0017.a: "Que la cruz se mantenga allí durante muchos años."
 pam_decision_events.0017.b: "No es un buen momento."
