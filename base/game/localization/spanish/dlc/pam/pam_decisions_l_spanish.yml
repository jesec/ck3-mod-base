 pam_invite_syncretic_exiles_decision: "Invitar a exiliados sincréticos"
 pam_invite_syncretic_exiles_decision_desc: "Comunidades exiliadas de una religión a la que respetamos vagan en busca de un hogar seguro. Puedo invitarlos a asentarse en mi señorío y compartir sus tradiciones."
 pam_invite_syncretic_exiles_decision_tooltip: "Invita a exiliados de una familia religiosa reconocida por su sincretismo personal, lo que aumenta el [development|El] al tiempo que cambia la [faith|El] o el [rite|El] local.\n\nCuesta una gran cantidad de [piety|El]."
 pam_invite_syncretic_exiles_decision_confirm: "Invitar a los exiliados"
 pam_invite_syncretic_exiles_decision_effect: "Un grupo de exiliados acudirá a ti para pedir refugio en tus [counties|El], lo que aumentará el [development|El] si bien cambiará la [faith|El] o el [rite|El] local."
 pam_invite_syncretic_exiles_no_pool: "No hay exiliados religiosos que encajen a los que invitar"
