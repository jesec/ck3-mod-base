l_spanish:
 pam_theocratic_ruler_events.0001.t: "Una donación para la Iglesia"
 pam_theocratic_ruler_events.0001.desc: "Un mercader acomodado ha dejado en herencia una donación para la Iglesia y la suma no es que sea insignificante.\n\nMi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] ha traído las cifras y la declaración de intenciones. Me mira esperando mi opinión. \n\n«El testamento estipula que los fondos han de usarse para reforzar la creencia en [ROOT.Char.GetFaith.HighGodName]»."
 pam_theocratic_ruler_events.0001.a: "Encuentro pruebas de que gestionó mal fondos sagrados…"
 pam_theocratic_ruler_events.0001.b: "«Razonemos juntos como clero»."
 pam_theocratic_ruler_events.0001.c: "Esto va al tesoro, con mucho agradecimiento y cuidado."
 pam_theocratic_ruler_events.0001.b.success: "Los caminos de los dioses son misteriosos"
 pam_theocratic_ruler_events.0001.b.failure: "[Select_CString(subordinate_priest.IsFemale, 'La sacerdotisa', 'El sacerdote' )] no entra en razón"
 pam_theocratic_ruler_events.0001.b.toast.success: "[subordinate_priest.GetHerHim|U] persuades y te quedas la donación."
 pam_theocratic_ruler_events.0001.b.toast.failure: "Se queda la donación para [ROOT.Char.GetFaith.HighGodName]."
 pam_theocratic_ruler_events.0002.t: "Un viajero del otro lado de la frontera"
 pam_theocratic_ruler_events.0002.desc: "Se me informa de que [foreign_ruler.Custom('ES_ElLa')] [foreign_ruler.GetTitledFirstName|l], vecin[foreign_ruler.Custom('ES_OA')] y seguidor[foreign_ruler.Custom('ES_XA')] de las antiguas tradiciones del [foreign_ruler.GetFaith.GetName|l], ha entrado en mis tierras.\n\nEl pequeño séquito tiene otro destino, pero su ruta [foreign_ruler.GerHerHim] trae tan cerca que se espera que [foreign_ruler.GerHerHim] reciba formalmente en mi corte. \n\n¿Cómo he de recibirle?"
 pam_theocratic_ruler_events.0002.a: "Un regalo modesto y una oferta de paz."
 pam_theocratic_ruler_events.0002.b: "«Busco un entendimiento sincero entre nuestros pueblos»."
 pam_theocratic_ruler_events.0002.b.success: "Mi cortesía se [foreign_ruler.GerHerHim] gana"
 pam_theocratic_ruler_events.0002.b.failure: "Mis palabras suenan vacías"
 pam_theocratic_ruler_events.0002.b.toast.success: "Tu cortesía gana, la tolerancia entre vuestros pueblos aumenta"
 pam_theocratic_ruler_events.0002.b.toast.failure: "Ni se inmuta; tus palabras suenan vacías"
 pam_theocratic_ruler_events.0002.b.acceptance: "Embajada cortesana"
 pam_theocratic_ruler_events.0002.c: "Los paganos no tienen sitio en nuestras tierras."
 TRUCE_PAM_NEIGHBOR_GIFT: "\nUna tregua basada en regalos y un respeto mutuo entre vecinos"
 pam_theocratic_ruler_events.0003.t: "Consejo para una frontera endurecida"
 pam_theocratic_ruler_events.0003.desc: "Bastante han puesto a prueba mis tierras la guerra y los asaltantes. Convoco [advisor.Custom('ES_AlAla')] [advisor.GetTitledFirstName|l], mi [advisor.GetCouncilTitle|l] de confianza, y valoramos qué hay que hacer. \n\n«Podemos ponernos en contacto con [alliance_target.Custom('ES_ElLa')] [alliance_target.GetTitledFirstName|l]. Al ser otr[alliance_target.Custom('ES_OA')] gobernante teocrátic[alliance_target.Custom('ES_OA')] de nuestra fe, podría acudir en nuestra ayuda».\n\n¿O debería llevar esta carga sobre mis propios hombros?"
 pam_theocratic_ruler_events.0003.a: "Mandad enviados. Debemos estar [Select_CString(And(ROOT.Char.IsFemale, alliance_target.IsFemale), 'unidas', 'unidos')]."
 pam_theocratic_ruler_events.0003.a.tt: "Formas una [alliance|El] con [alliance_target.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0003.b: "Reclutar campesinos fieles para la defensa de la frontera."
 pam_theocratic_ruler_events.0003.b.army: "Campesinos fieles"
 pam_theocratic_ruler_events.0003.c: "Enviar ayuda y restaurar un condado asaltado hace poco."
 pam_theocratic_ruler_events.0003.d: "Dejo esto en manos [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_theocratic_ruler_events.0004.t: "Hermanos como vecinos"
 pam_theocratic_ruler_events.0004.desc: "Como tenemos tan cerca [monastic_order_head.GetPrimaryTitle.GetName], he invitado [monastic_order_head.Custom('ES_AlAla')] [monastic_order_head.GetTitledFirstName|l] para analizar cómo podemos profundizar nuestra colaboración.\n\n«[monastic_order_head.GetFaith.HighGodName] no nos juzga por nuestro orgullo, sino por nuestra voluntad para servir», dice con calma [monastic_order_head.Custom('ES_ElLa')] [monastic_order_head.GetTitledFirstNameNoTooltip|l]."
 pam_theocratic_ruler_events.0004.a: "Por favor, que vuestros hermanos bendigan nuestras tierras."
 pam_theocratic_ruler_events.0004.b: "Vuestr[monastic_monk.Custom('ES_OA')] discípul[monastic_monk.Custom('ES_OA')] [monastic_monk.GetTitledFirstNameNoTooltip|l] reforzaría mi corte."
 pam_theocratic_ruler_events.0004.c: "Compartamos algunas plegarias."
 pam_theocratic_ruler_events.0005.t: "Espadas para la fe"
 pam_theocratic_ruler_events.0005.desc: "Con [military_order_head.GetPrimaryTitle.GetName] instalad[military_order_head.Custom('ES_OA')] en mi señorío, invito [military_order_head.Custom('ES_AlAla')] [military_order_head.GetTitledFirstName|l] a analizar cómo las espadas de los fieles podrían sernos útiles.\n\n«[military_order_head.GetFaith.HighGodName] no bendice el acero ocioso, sino aquel que se alza en defensa de los fieles», dice [military_order_head.Custom('ES_ElLa')] [military_order_head.GetTitledFirstNameNoTooltip|l] mientras su seguidor[order_knight.Custom('ES_XA')], [order_knight.GetTitledFirstName|l], asiente con la cabeza en silencio a su lado."
 pam_theocratic_ruler_events.0005.a: "Adiestrad a mis [ROOT.Char.Custom('GetFighterTermPlural')|l] según la disciplina de vuestra orden."
 pam_theocratic_ruler_events.0005.b: "Que [order_knight.Custom('ES_ElLa')] [order_knight.GetTitledFirstNameNoTooltip|l] se quede como mi guardaespaldas."
 pam_theocratic_ruler_events.0005.c: "Hablemos de la guerra justa."
 pam_theocratic_ruler_events.0006.t: "Diezmos o clemencia"
 pam_theocratic_ruler_events.0006.desc: "Traen ante mí [Select_CString(local_peasant_leader.IsFemale, 'a la jefa', 'al jefe' )] de una aldea, [local_peasant_leader.GetTitledFirstName]. Su gente ha retenido diezmos de la Iglesia y ahora alega dificultades.\n\n«El invierno fue cruel, mi [ROOT.Char.GetLadyLord], y nuestros graneros están casi vacíos», dice con voz temblorosa.\n\nLa cuestión es sencilla: meter en cintura el condado a través del miedo o conservar la paz usando la clemencia."
 pam_theocratic_ruler_events.0006.a: "No se hacen excepciones, capturad [local_peasant_leader.Custom('ES_AlAla')] cabecilla."
 pam_theocratic_ruler_events.0006.a.tt: "Ganas [EmptyScope.ScriptValue('minor_gold_value')|0] [gold_i], encarcelas a [local_peasant_leader.GetShortUINameNoTooltip] y [troubled_county.GetName] consigue #N Diezmos forzosos#! durante 5 años ([county_opinion|El] #N -20#!)."
 pam_theocratic_ruler_events.0006.b: "Dejadlo pasar. La clemencia también sirve a Dios."
 pam_theocratic_ruler_events.0006.b.tt: "Ganas [EmptyScope.ScriptValue('minor_piety_gain')|0] [piety_i] y [troubled_county.GetName] consigue #P Diezmos clementes#! durante 5 años ([county_opinion|El] #P +20#!)."
 pam_theocratic_ruler_events.0006.c: "Mi administrador me ha fallado. La culpa es suya."
 pam_theocratic_ruler_events.0006.c.tt: "Si es posible, ganas un [hook|El] sobre [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] (se usa un anzuelo de obligación más fuerte cuando esté disponible). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] pierde [opinion|El] de ti (#N -20#!, decae a lo largo de 5 años)."
 pam_theocratic_ruler_events.0007.t: "Armonía dichosa"
 pam_theocratic_ruler_events.0007.desc: "Cuando los suaves rayos del sol elevan el rocío de la mañana y calientan las piedras del patio de la iglesia, caigo en la cuenta: por una vez el deber no se aferra a mi manga. Hasta una abeja laboriosa parece hacer descansos para calentarse la espalda con los rayos del amanecer.\n\nMis tierras están en orden silencioso. Hay oro en las arcas y mi rebaño está satisfecho y siente respeto. Hasta mi soberan[ROOT.Char.GetLiege.Custom('ES_OA')], [ROOT.Char.GetLiege.Custom('ES_ElLa')] [ROOT.Char.GetLiege.GetTitledFirstName|l], habla con aprobación de cómo dirijo a sus súbditos hacia Cristo."
 pam_theocratic_ruler_events.0007.a: "La paz es dulce, pero [ROOT.Char.GetFaith.HighGodName] sigue teniendo grandes obras para mí."
 pam_theocratic_ruler_events.0007.b: "Difundid el evangelio de una vida piadosa y ordenada."
 pam_theocratic_ruler_events.0007.c: "Dejadme escuchar en quietud."
 pam_theocratic_ruler_events.0008.t: "Piedra sobre piedra"
 pam_theocratic_ruler_events.0008.desc: "Desde que heredé [stone_province.GetName], un castillo con [GetBuilding('curtain_walls_01').GetName|l], he observado esta impresionante obra de piedra hecha para un gobierno más secular. ¿Pero de verdad los fieles necesitan semejantes defensas?\n\nMi finca no tiene [GetDomicileBuilding('episcopal_palace_01').GetName|l] digno de mi nombre y, sin embargo, aquí tenemos piedra tallada levantada por manos mundanas."
 pam_theocratic_ruler_events.0008.a: "Me vendría bien la piedra sobrante de esas murallas primitivas."
 pam_theocratic_ruler_events.0008.b: "Derribad las murallas y levantad mi [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip|l]."
 pam_theocratic_ruler_events.0008.c: "Toda obra de manos humanas es una oración manifiesta."
 pam_theocratic_ruler_events.0008.c.flavor: "Tienes el dogma [GetTenetType('tenet_ora_et_labora').GetName( ROOT.Char.GetRite )]"
 pam_theocratic_ruler_events.0008.d: "Podrían necesitar las murallas."
 pam_theocratic_ruler_events.0009.t: "Intentar ser el pastor"
 pam_theocratic_ruler_events.0009.desc: "He recibido informes llenos de lágrimas de parte de mi congregación; me transmiten que [heir.Custom('ES_ElLa')] [heir.GetTitledFirstName|l] ha perdido los estribos en su último sermón y que no son capaces de adherirse a las restricciones que [heir.GetSheHe] les exige.\n\nCuando se le cuestiona, monta en cólera.\n\n«¡Oh, viles pecador[heir.Custom('ES_EA')]s! No soporto sus patéticos intentos de redención»."
 pam_theocratic_ruler_events.0009.a: "«El pastor mantiene la calma. Atemperad vuestra pasión»."
 pam_theocratic_ruler_events.0009.a.success: "Tu consejo le hace efecto"
 pam_theocratic_ruler_events.0009.a.failure: "Tus palabras no consiguen calmar[heir.GetHerHim]"
 pam_theocratic_ruler_events.0009.a.toast.success: "Consejo exitoso"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Consejo fallido"
 pam_theocratic_ruler_events.0009.b: "Niego con la cabeza de pura decepción."
 pam_theocratic_ruler_events.0009.b.flavor: " No tiene mi bendición y es indign[heir.Custom('ES_OA')] para gobernar "
 pam_theocratic_ruler_events.0009.c: "«Repetid vuestras oraciones. Disciplinad la carne»."
 pam_theocratic_ruler_events.0010.t: "La espada o el báculo"
 pam_theocratic_ruler_events.0010.desc: "Como gobernante de mis tierras, me he visto obligad[ROOT.Char.Custom('ES_OA')] a servir a [ROOT.Char.GetFaith.HighGodName] con la espada además de con bendiciones.\n\nCon una claridad nítida recuerdo cuando [pilgrimage_memory.GetDescription|l] y cuando [battle_memory.GetDescription|l]. Los cadáveres se apilan en los campos; mis seguidores saben que no rehúyo la tarea en cuestión.\n\nAl considerar el futuro del señorío, tanto mi [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle|l], [ROOT.Char.GetCouncillor('councillor_marshal').Custom('ES_ElLa')] [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName|l], como mi [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle|l], [ROOT.Char.GetCouncillor('councillor_court_chaplain').Custom('ES_ElLa')] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName|l], quieren que ponga su herramienta a la vanguardia de nuestra labor."
 pam_theocratic_ruler_events.0010.a: "Honrar la espada."
 pam_theocratic_ruler_events.0010.b: "El báculo debe dirigir."
 pam_theocratic_ruler_events.0010.c: "Que la espada y el báculo sirvan juntos."
 pam_theocratic_ruler_events.0011.t: "Reposo para el caballero caído"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.Custom('ES_ElLa')|U] [landed_subject.GetTitledFirstName|l] se arrodilla ante mí con noticias de su pariente que cayó defendiendo a [ROOT.Char.GetFaith.HighGodName]. \n\n«Se mantuvo firme contra un sinfín de paganos, pero sus heridas eran demasiado graves. Al menos pudimos despedirnos». \n\n«Por favor, dadle un lugar de descanso bajo el pasillo del altar, con la espada a su lado. Os lo agradeceré eternamente»."
 pam_theocratic_ruler_events.0011.a: "Pagad por la piedra y aquí descansará."
 pam_theocratic_ruler_events.0011.a.flavor: "El caballero descansará dentro de la iglesia."
 pam_theocratic_ruler_events.0011.b: "Podemos utilizar la cripta, si donáis la espada."
 pam_theocratic_ruler_events.0011.b.flavor: "El caballero reposará sin su espada."
 pam_theocratic_ruler_events.0011.c: "Los guerreros deben estar bajo el cielo abierto."
 pam_theocratic_ruler_events.0011.c.flavor: "Se enterrará al caballero fuera de los muros de la iglesia."
 pam_fallen_knight_crusader_sword_name: "Espada de cruzado"
 pam_fallen_knight_crusader_sword_desc: "Una espada sostenida por un caballero que murió defendiendo la fe. Marcada con muescas de espadas paganas y con una pequeña cruz grabada en la empuñadura."
 pam_theocratic_ruler_events.0012.t: "Una arboleda antes sagrada"
 pam_theocratic_ruler_events.0012.desc: "Mi séquito se frena donde el bosque se cierra en torno al sendero. [grove_subject.Custom('ES_ElLa')|U] [grove_subject.GetTitledFirstName|l], un[grove_subject.Custom('ES_OA')] de [grove_subject.Custom('ES_LoLa')]s fieles de [grove_county.GetNameNoTier], sale de entre los árboles con los brazos abiertos en saludo.\n\n«Si de verdad deseáis ganaros al rebaño de estas tierras, debéis escuchar y aceptar lo que [ROOT.Char.GetFaith.HighGodName] ya plantó aquí. Construid un templo junto a las antiguas arboledas de [grove_province.GetName] y el pueblo sabrá de quién sois pastor[ROOT.Char.Custom('ES_XA')]»."
 pam_theocratic_ruler_events.0012.a: "Que la naturaleza guíe mi fe."
 pam_theocratic_ruler_events.0012.b: "Mostradme esas arboledas."
 pam_theocratic_ruler_events.0012.b.success: "Tus hombres vuelven luego para recoger madera"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip] descubre tu artimaña"
 pam_theocratic_ruler_events.0012.b.toast.success: "Se cortan los árboles antiguos para sacar dinero."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip] difunde la noticia de tu profanación."
 pam_theocratic_ruler_events.0012.c: "Estas tierras salvajes apestan al diablo."
 pam_theocratic_ruler_events.0013.t: "Una inspiración angelical"
 pam_theocratic_ruler_events.0013.desc: "Hoy en la misa, como si hubiera sido alcanzada por la inspiración divina, una voz se alzó por encima de los cantores, diáfana y sobrenatural en su belleza.\n\nLos fieles quedaron en silencio cuando cantó [angelic_singer.Custom('ES_ElLa')] [angelic_singer.GetTitledFirstName|l], y tiempo después de que la última nota se extinguiera, me descubrí aún escuchando."
 pam_theocratic_ruler_events.0013.a: "«Vuestro don pertenece a [ROOT.Char.GetFaith.HighGodName]. Tomad los votos y servid»."
 pam_theocratic_ruler_events.0013.a.success: "Tus palabras [angelic_singer.GetHerHim] conmueven a la devoción"
 pam_theocratic_ruler_events.0013.a.failure: "No se persuadirá a [angelic_singer.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip] toma los votos y se une a tu corte."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip] rehúsa y se marcha."
 pam_theocratic_ruler_events.0013.b: "Sed mi invitad[angelic_singer.Custom('ES_OA')]; me gustaría volver a oír esa voz."
 pam_theocratic_ruler_events.0013.c: "Que canten nuestros cantores."
 pam_theocratic_ruler_events.0014.t: "El ruego de un converso"
 pam_theocratic_ruler_events.0014.desc: "En mi sermón, [convert_peasant.Custom('ES_ElLa')] [convert_peasant.GetTitledFirstName|l], convers[convert_peasant.Custom('ES_OA')] de la comunidad [convert_peasant.GetCulture.GetNameNoTooltip] y de las viejas tradiciones del [neighbour_faith.GetNameNoTooltip|l], se abre paso entre la muchedumbre.\n\n«Aún se puede aprender mucho de las antiguas costumbres. Sé que si hallarais en vuestro corazón consideración por ellas, nuestro pueblo sabría que vos respetáis nuestras tradiciones. Mi gente acudirá en masa a vuestro lado y os apoyará en cada empresa».\n\nY aguarda mi bendición, así como una muda inclinación de cabeza como respuesta."
 pam_theocratic_ruler_events.0014.a: "Apartad a esta escoria de mi vista."
 pam_theocratic_ruler_events.0014.a.flavor: "Tienes el [trait|El] [GetTrait('arrogant').GetName( GetNullCharacter )]"
 pam_theocratic_ruler_events.0014.a.acceptance: "Ruego [convert_peasant.Custom('ES_DelDela')] convers[convert_peasant.Custom('ES_OA')] rechazado"
 pam_theocratic_ruler_events.0014.b: "Adoptar el dogma [offered_tenet_a.GetBaseNameNoTooltip] como propio."
 pam_theocratic_ruler_events.0014.b.tt: "Tu próxima contribución #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! al [great_project|El] [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] es gratis."
 pam_theocratic_ruler_events.0014.c: "Adoptar el dogma [offered_tenet_b.GetBaseNameNoTooltip] como propio."
 pam_theocratic_ruler_events.0014.c.tt: "Tu próxima contribución #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! al [great_project|El] [GetGreatProjectType('pam_mass_rite_conversion').GetName|V] es gratis."
 pam_theocratic_ruler_events.0014.d: "¿Acaso las ovejas dirigen al pastor?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "El ruego de un converso"
 pam_theocratic_ruler_events.0015.t: "Guiar a los sucesores"
 pam_theocratic_ruler_events.0015.desc: "Después de mí, la sede necesitará un pastor que dirija en la oración, así como en el juicio. Se ha convocado [succession_heir_first.Custom('ES_AlAla')] [succession_heir_first.GetTitledFirstName|l], en primer lugar en la línea de sucesión, y [succession_heir_second.Custom('ES_AlAla')] [succession_heir_second.GetTitledFirstName|l], justo detrás, a recitar las Escrituras ante mí en privado. \n\n[Select_CString(And(succession_heir_first.IsFemale, succession_heir_second.IsFemale), 'Una de ellas', 'Uno de ellos')] heredará mi carga y hoy no puedo formar equitativamente a [Select_CString(And(succession_heir_first.IsFemale, succession_heir_second.IsFemale), 'ambas', 'ambos')].\n\n«[Select_CString(And(succession_heir_first.IsFemale, succession_heir_second.IsFemale), 'Hijas mías', 'Hijos míos')] en la fe: mostradme no solo lo que habéis memorizado, sino lo que hayáis hecho vuestro»."
 pam_theocratic_ruler_events.0015.a: "Tutelar a [succession_heir_first.GetFirstNameNoTooltip] en las Escrituras."
 pam_theocratic_ruler_events.0015.b: "Guiar a [succession_heir_second.GetFirstNameNoTooltip] en los textos sagrados."
 pam_theocratic_ruler_events.0015.c: "Yo soy [Select_CString(ROOT.Char.IsFemale, 'la pastora', 'el pastor' )]; yo recitaré."
 pam_theocratic_ruler_events.0015.c.success: "Tus conocimientos eclipsan sus recitados."
 pam_theocratic_ruler_events.0015.c.failure: "Te trabas con un párrafo que conocen de memoria."
 pam_theocratic_ruler_events.0015.c.toast.success: "Tu dominio de la doctrina les impresiona."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Tus subordinados intercambian miradas ante tu error."
