l_spanish:
 # Activity: The Investiture Council
 activity_investiture_council: "El concilio sobre las investiduras"
 activity_investiture_council_desc: "Un concilio convocado al término de la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] para zanjar, de una vez por todas, quién debe investir al clero, si la Iglesia o la corona."
 activity_investiture_council_province_desc: "Celebra aquí el concilio sobre las investiduras."
 activity_investiture_council_host_desc: "Convoca el concilio sobre las investiduras para zanjar la cuestión de los nombramientos del clero."
 activity_investiture_council_guest_desc: "Asiste al concilio sobre las investiduras y da tu opinión sobre los nombramientos del clero."
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council: "El viaje de [Character.GetFirstNameNoTooltip] al concilio sobre las investiduras"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value: "Convocatoria recibida al concilio sobre las investiduras"
 pam_investiture_council_start_log_title: "Se reúne el concilio sobre las investiduras"
 pam_investiture_council_start_log: "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] inauguró el concilio sobre las investiduras para zanjar la cuestión de los nombramientos del clero."
 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title: "Se impone la Iglesia"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] ha proclamado la resolución del concilio: el clero será investido únicamente por la Iglesia y ninguna corona podrá deponerlo."
 pam_investiture_council_concluded_temporal_log_title: "Se impone la corona"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] ha proclamado la resolución del concilio: el clero será investido únicamente por la Iglesia, pero un señor secular aún puede deponer al prelado que le falle."
 pam_investiture_council_conclusion.intro: "El concilio sobre las investiduras ha llegado a su conclusión."
 pam_investiture_council_conclusion.spiritual: "Los padres reunidos defendieron el derecho exclusivo de la Iglesia a investir al clero para ponerlo fuera del alcance de toda corona: una vez consagrado, un prelado posee el cargo de modo vitalicio.\n\nHa terminado la larga [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l]; la Iglesia sale victoriosa y se dedica de inmediato a reformarse desde dentro."
 pam_investiture_council_conclusion.temporal: "Los padres reunidos dejan a la Iglesia los nombramientos del clero, pero mantienen el derecho de los señores seculares a deponer a los prelados que les fallen. Ha terminado la larga [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l], pero la autoridad de la Iglesia disminuye y su unidad es ahora más frágil."
 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived: "Prelado\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "Conservador\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "Innovador\n[Character.GetShortUINameNoTooltip|U]"
 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt: "Ha sustituido la [doctrine|El] de nombramiento clerical [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l] por la [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName|l]"
 pam_investiture_resolution_temporal_tt: "Ha sustituido la [doctrine|El] de nombramiento clerical [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l] por la [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName|l]"
 # Activity phase names + descriptions
 investiture_council_phase_summons: "Citación"
 investiture_council_phase_summons_desc: "Los fieles se congregan a medida que se difunde la noticia de la inminente decisión sobre los nombramientos del clero."
 investiture_council_phase_debate: "El debate"
 investiture_council_phase_debate_desc: "El concilio debate quién debe investir al clero, si la Iglesia o la corona, y somete la cuestión a votación."
 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t: "Llegada"
 pam_investiture_council_events.0001.desc: "[arrival_host.Custom('ES_ElLa')|U] [arrival_host.GetTitledFirstName|l] me recibe calurosamente en el umbral cuando llego; la sala, a sus espaldas, ya bulle con la presencia de los prelados y príncipes de la fe. Pronto se someterá a la asamblea la gran cuestión de los nombramientos del clero."
 pam_investiture_council_events.0001.a: "Es un honor encontrarme entre ellos."
 pam_investiture_council_events.0001.a.tt: "El debate comenzará en cuanto llegue el resto de invitados."
 # The council convenes (host)
 pam_investiture_council_events.0002.t: "Un momento decisivo para la Iglesia"
 pam_investiture_council_events.0002.desc: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] ha seguido su curso. Ahora, los fieles aquí reunidos deben decidir cómo se nombrará al clero en lo sucesivo, y yo me propongo velar por que se respete la autoridad de la Iglesia."
 pam_investiture_council_events.0002.a: "Así sea."
 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t: "Comienza el debate"
 pam_investiture_council_events.0003.desc: "La asamblea enmudece mientras el concilio aborda la cuestión que ha enfrentado a la Iglesia con la corona: quién debe investir al clero. Cada voz aquí presente ayudará a decidirlo."
 pam_investiture_council_events.0003.a: "Es la hora."
 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t: "Una palabra en el oído adecuado"
 pam_investiture_council_events.0032.desc: "La votación aún no está decidida. Una palabra persuasiva en el oído adecuado podría hacer que los indecisos del bando contrario se sumen a mi causa, aunque una alegación torpe podría salirme cara."
 pam_investiture_council_events.0032.a: "Influir en la asamblea para que se sume a mi causa."
 pam_investiture_council_events.0032.b: "Dejarlo estar."
 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t: "El peso de la corona"
 pam_investiture_council_events.0033.desc: "No tengo derecho a voto en esta asamblea de clérigos, pero un señor secular no carece de recursos. Una bolsa bien llena afloja las conciencias y un argumento bien planteado puede mover a los indecisos. Podría apoyar la reivindicación de la Iglesia o la de la corona, o mantenerme en silencio."
 pam_investiture_council_events.0033.a: "Intentemos sobornar para que voten a favor de la Iglesia."
 pam_investiture_council_events.0033.b: "Intentemos convencer para que voten a favor de la Iglesia."
 pam_investiture_council_events.0033.c: "Intentaré sobornar para que se decanten por lo temporal."
 pam_investiture_council_events.0033.d: "Intentaré convencer para que se decanten por lo temporal."
 pam_investiture_council_events.0033.e: "Te mantienes al margen."
 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title: "La asamblea responde"
 pam_investiture_persuade_toast_swayed_tt: "Has influido en #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! votantes."
 pam_investiture_persuade_toast_backfired_tt: "Tu traspié hizo que #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! votantes se decantaran por la otra opción."
 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt: "Hay votantes que aún no están del lado de la Iglesia y a los que hay que convencer"
 pam_investiture_persuade_target_temporal_tt: "Hay votantes que aún no están del lado de la corona y a los que hay que convencer"
 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator: "Influye en hasta #P 10#! votantes a favor de la causa de la Iglesia."
 pam_investiture_persuade_tt_great_conservative: "Influye en hasta #P 10#! votantes a favor de la causa de la corona."
 pam_investiture_persuade_tt_good_innovator: "Influye en hasta #P 5#! votantes a favor de la causa de la Iglesia."
 pam_investiture_persuade_tt_good_conservative: "Influye en hasta #P 5#! votantes a favor de la causa de la corona."
 pam_investiture_persuade_tt_modest_innovator: "Influye en hasta #P 3#! votantes a favor de la causa de la Iglesia."
 pam_investiture_persuade_tt_modest_conservative: "Influye en hasta #P 3#! votantes a favor de la causa de la corona."
 pam_investiture_persuade_tt_backfire_innovator: "Un traspiés hace que #N 5#! personas voten a favor de la causa de la Iglesia."
 pam_investiture_persuade_tt_backfire_conservative: "Un traspiés hace que #N 5#! personas voten a favor de la causa de la corona."
 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t: "El concilio te convoca"
 pam_investiture_council_events.0004.desc: "Me ha llegado la noticia de que se va a reunir el concilio sobre las investiduras para decidir acerca de los nombramientos del clero, pero me hallo muy lejos de donde debería estar. Podría dejar lo que estoy haciendo y cabalgar a toda prisa para dar mi opinión, o dejar que el asunto se resuelva sin mí."
 pam_investiture_council_events.0004.a: "Dejarlo todo y cabalgar hacia el concilio."
 pam_investiture_council_events.0004.b: "Dejar que decidan sin mí."
 pam_investiture_council_haste_modifier: "Carrera hacia el concilio"
 pam_investiture_council_haste_modifier_desc: "Este [ruler|El] ha abandonado todo lo demás para llegar al concilio sobre las investiduras antes de que se pronuncien sobre el nombramiento del [clergy|El]."
 # The debate opens (host)
 pam_investiture_council_events.0010.t: "El derecho de la Iglesia"
 pam_investiture_council_events.0010.desc: "Planteo el asunto ante el concilio: el derecho a investir al clero pertenece a la Iglesia y ninguna corona puede deshacer lo que esta ha consagrado. Que la asamblea se pronuncie y que sus voces decidan."
 pam_investiture_council_events.0010.a: "Defender la autoridad de la Iglesia."
 # The debate: guest picks a side
 pam_investiture_council_events.0031.t: "¿De qué lado estáis?"
 pam_investiture_council_events.0031.desc: "El cabeza de la fe reclama el derecho exclusivo de la Iglesia a nombrar al clero, fuera del alcance de ninguna corona para deshacerlo. Los señores seculares querrían conservar el derecho a deponer a cualquier prelado que les falle. El concilio aguarda tu voz."
 pam_investiture_council_events.0031.a: "Apoyar a la Iglesia: nombramientos por parte de la Iglesia, vitalicios."
 pam_investiture_council_events.0031.b: "Defender a las coronas: nombramiento por parte de la Iglesia, pero revocables por los señores."
 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening: "Santísimo Padre:"
 pam_investiture_council_events.0060.desc.spiritual: "El concilio ha concluido y, dado que no os hallabais entre nosotros, he plasmado el resultado en pergamino al momento. Los padres aquí reunidos han afirmado el derecho exclusivo de la Iglesia a investir al clero y lo han puesto fuera del alcance de cualquier corona: aquellos que consagre dispondrán del cargo de modo vitalicio. La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] ha finalizado."
 pam_investiture_council_events.0060.desc.temporal: "El concilio ha concluido y, dado que no os hallabais entre nosotros, he plasmado el resultado en pergamino al momento. Me entristece escribir que los padres aquí reunidos, si bien han dejado los nombramientos en nuestras manos, han concedido a los señores seculares el permiso para deponer a cualquier prelado que les falle. La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] ha finalizado."
 pam_investiture_council_events.0060.a: "Leer el decreto."
 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening: "Mi señor:"
 pam_investiture_council_events.0061.desc.spiritual: "Llega noticia a tu capilla desde el gran concilio. Los padres reunidos han reafirmado el derecho exclusivo de la Iglesia a investir al clero y aquellos que esta nombre se encuentran ahora fuera de tu poder para deponerlos. La larga [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] ha finalizado y el báculo conserva lo que la corona codiciaba."
 pam_investiture_council_events.0061.desc.temporal: "Llega noticia a tu capilla desde el gran concilio. Los padres reunidos han dejado los nombramientos del clero a la Iglesia, pero aún puedes deponer de su cargo a todo prelado que te falle. La larga [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] ha finalizado y la corona ha prevalecido sobre el báculo."
 pam_investiture_council_events.0061.a: "Pues ya está decidido."
 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t: "Se reúne un concilio"
 pam_investiture_council_events.0050.desc.named: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] se acerca a su fin y un concilio decidirá sobre los nombramientos del clero.\n\nSe encarga de presidirlo [investiture_nominee_host.Custom('ES_ElLa')] [investiture_nominee_host.GetTitledFirstName|l]. Como cabeza de la fe, se espera que asistas y expreses tu opinión sobre la decisión, aunque se te informará del resultado aunque no lo hagas."
 pam_investiture_council_events.0050.desc: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] se acerca a su fin y un concilio debe decidir sobre los nombramientos del clero. Dado que no lo presidirás tú, asumirá la tarea en tu lugar un arzobispo de alto rango de la fe. Aun así, puedes asistir y expresar tu opinión."
 pam_investiture_council_events.0050.a: "Muy bien."
 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast: "Finaliza la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip|l]"
 pam_investiture_crisis_lapsed_tt: "Al no haberse convocado ningún concilio, la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] expira a favor de la Iglesia: a partir de ahora, el clero será nombrado por la Iglesia y conservará el cargo de modo vitalicio."
