l_spanish:
 pam_sf_devotion_modifier: "Devoción por la prosperidad"
 pam_sf_devotion_modifier_desc: "Este personaje ha tenido un gesto privado de devoción, que se ha recompensado silenciosamente con piedad y monedas."
 pam_sf_grace_modifier: "Gracia recibida"
 pam_sf_grace_modifier_desc: "Este personaje ha recibido una gracia, una acción de agradecimiento o un voto silencioso que eleva el espíritu."
 pam_sf_consolation_modifier: "En paz"
 pam_sf_consolation_modifier_desc: "Este personaje está en paz."
 pam_sf_visionary_renown_modifier: "Una visión proclamada"
 pam_sf_visionary_renown_modifier_desc: "Este personaje ha proclamado una visión divina a la corte, lo que ha realzado su posición."
 pam_sf_consecrated_arms_modifier: "Armas consagradas"
 pam_sf_consecrated_arms_modifier_desc: "Este personaje ha bendecido las armas de su casa en una festividad sagrada."
 pam_sf_serenity_modifier: "Rituales públicos ensalzados"
 pam_sf_serenity_modifier_desc: "La devoción pública de este personaje le ha hecho ganarse el favor del clero y la corte."
 pam_sf_humiliated_modifier: "Votos humillantes"
 pam_sf_humiliated_modifier_desc: "Este personaje se ha visto forzado a tomar los votos sagrados y recluirse en un claustro."
 pam_sf_promised_acclaim_modifier: "La promesa de un peregrino"
 pam_sf_promised_acclaim_modifier_desc: "El clérigo del señorío de este personaje se ha comprometido a proclamar su próxima peregrinación completada a la gente de la capital.\n\nAl completar una peregrinación, su [capital|El] ganará [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip] durante #V 15#! años."
 pam_sf_extolled_pilgrimage_county_modifier: "La bienvenida de un peregrino"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "La noticia de la peregrinación de su gobernante resuena por todo el condado, y la gente se nutre del orgullo que genera."
 pam_sf_free_feast_discount_desc: "Un festín en el horizonte"
 pam_sf_free_feast_modifier: "Deseo de festín"
 pam_sf_free_feast_modifier_desc: "Un atisbo de indulgencia divina ha aumentado el apetito de este personaje:\n$EFFECT_LIST_BULLET$Coste del siguiente [GetActivityType( 'activity_feast').GetName|l]: #P -100 %#! [gold_i]\n#weak Se gasta al comenzar el festín.#!"
 pam_sf_pilgrimage_funded_modifier: "Peregrinación patrocinada"
 pam_sf_pilgrimage_funded_modifier_desc: "Un patrón se ha comprometido a cubrir parte del coste de la siguiente peregrinación de este personaje:\n$EFFECT_LIST_BULLET$Coste de [GetActivityType( 'activity_pilgrimage').GetName|l]: #P -50 %#! [gold_i]"
 pam_sf_pilgrimage_funded_discount_desc: "Peregrinación patrocinada"
 pam_sf_ear_of_clergy_modifier: "El oído del clero"
 pam_sf_ear_of_clergy_modifier_desc: "El más probable que la Iglesia acepte las peticiones de este personaje:\n$EFFECT_LIST_BULLET$#V Aceptación de $hof_ask_for_claim_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$#V Aceptación de $hof_ask_for_gold_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$#V Aceptación de $request_excommunication_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$#V Aceptación de $request_legitimacy_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$#V Aceptación de $ecclesiastic_grant_claim_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$#V Aceptación de $strengthen_claim_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$#V Aceptación de $request_enforce_succession_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Aceptación de #V $request_white_peace_interaction$#!: #P +25#!"
 pam_religious_delirium_modifier: "Delirio religioso"
 pam_religious_delirium_modifier_desc: "Este personaje tiene la certeza de que le habla el mismísimo cielo:\n$EFFECT_LIST_BULLET$Ganancia de [spiritual_fulfillment|El]: #P +50 %#!\n$EFFECT_LIST_BULLET$Pérdida de [spiritual_fulfillment|El]: #N +50 %#!"
 pam_sf_church_builder_modifier: "Constructor de iglesias"
 pam_sf_church_builder_modifier_desc: "Tras haber erigido una primera casa de culto, este personaje construye iglesias un poco más barato y gana un suministro constante de piedad."
 pam_sf_scriptorium_county_modifier: "Trabajo de escribas"
 pam_sf_scriptorium_county_modifier_desc: "Los eruditos asentados copian y conservan las cuentas de esta posesión."
 pam_sf_doctrine_clarity_modifier: "Epifanía"
 pam_sf_doctrine_clarity_modifier_desc: "Este personaje ha tenido un momento de claridad poco común, una epifanía."
 pam_sf_favorable_omen_modifier: "Presagio favorable"
 pam_sf_favorable_omen_modifier_desc: "Este personaje interpreta los cielos como una señal del favor divino, y con la bendición aumenta el ánimo de los fieles."
 pam_sf_omen_of_victory_modifier: "Presagio de victoria"
 pam_sf_omen_of_victory_modifier_desc: "Seguros de que los cielos prometen la victoria, este personaje y su hueste marchan sin miedo."
 pam_sf_demon_torment_modifier: "Tormento demoníaco"
 pam_sf_demon_torment_modifier_desc: "Este personaje está convencido de que lo atormenta un demonio y necesita construir una [holding|El] de [GetBuilding('temple_01').GetName|l] o salir de [GetActivityType('activity_pilgrimage').GetName|l]."
 pam_sf_besieged_by_demons_modifier: "Asedio demoníaco"
 pam_sf_besieged_by_demons_modifier_desc: "La mente de este personaje sufre un asalto demoníaco, y delira y se convulsiona apartándose cada vez más de la cordura con cada día que pasa."
 pam_sf_grief_solace_modifier: "Consuelo de un espíritu"
 pam_sf_grief_solace_modifier_desc: "Este personaje ha encontrado consuelo pacífico tras afirmar haber recibido la visita de una aparición."
 pam_sf_grief_warning_modifier: "Advertencia de un espíritu"
 pam_sf_grief_warning_modifier_desc: "Este personaje cree que una aparición le ha hecho una advertencia."
 pam_sf_peace_of_god_modifier: "Paz de Dios"
 pam_sf_peace_of_god_modifier_desc: "Este personaje ha jurado la paz de Dios y la ha impuesto en todo el señorío."
 pam_sf_immured_anchorite_modifier: "Anacoreta enclaustrado"
 pam_sf_immured_anchorite_modifier_desc: "Este templo tiene a un anacoreta enclaustrado entre sus muros."
 pam_sf_voice_of_jesus_modifier: "Voz de Dios"
 pam_sf_voice_of_jesus_modifier_desc: "Este personaje fue apelado por una voz divina y se transfiguró; sus facultades mejoraron, como si la mano de Dios lo hubiese tocado."
 pam_sf_stroke_of_god_modifier: "Golpe de Dios"
 pam_sf_stroke_of_god_modifier_desc: "Una repentina apoplejía ha atacado a este personaje: lo que los médicos conocen como «el golpe de Dios», una sacudida divina que inunda el cerebro y deja la mente y el cuerpo tullidos a su paso."
 pam_sf_lingering_stench_modifier: "Hedor persistente"
 pam_sf_lingering_stench_modifier_desc: "Por mucho que lo intente, este personaje no puede dejar de oler el hedor de los pies de los pobres que ha lavado."
 pam_sf_site_of_miracle_county_modifier: "Lugar de un milagro"
 pam_sf_site_of_miracle_county_modifier_desc: "En este condado se ha obrado un milagro, lo que atrae a peregrinos y bandidos por igual."
 pam_sf_consecrated_county_modifier: "Reciente consagración"
 pam_sf_consecrated_county_modifier_desc: "Este condado tiene una nueva iglesia consagrada."
 pam_sf_flagellant_cults_county_modifier: "Cultos flagelantes"
 pam_sf_flagellant_cults_county_modifier_desc: "Bandas de penitentes que se flagelan a sí mismos recorren las calles de este condado."
 pam_sf_relic_procession_county_modifier: "El santo marcha"
 pam_sf_relic_procession_county_modifier_desc: "La reliquia de un santo es llevada a través de este condado en solemne procesión, y la gente se siente un poco más orgullosa por ello."
 pam_sf_blessed_bell_county_modifier: "Bautismo de la campana"
 pam_sf_blessed_bell_county_modifier_desc: "La campana de la iglesia de este condado ha sido lavada, ungida y bautizada. La gente confía en su voz para dispersar las tormentas y a los enemigos por igual."
 pam_sf_church_ale_county_modifier: "Cerveza de la iglesia"
 pam_sf_church_ale_county_modifier_desc: "El gobernante de este condado se ha bebido la cerveza de la iglesia con la parroquia, y la parroquia no ha dejado de hablar de ello."
 pam_sf_safe_passage_modifier: "Paso seguro"
 pam_sf_safe_passage_modifier_desc: "A este viajero se le ha concedido paso seguro y escoltado tras un rescate en mitad del camino."
 pam_sf_waylaid_road_modifier: "Emboscada en el camino"
 pam_sf_waylaid_road_modifier_desc: "El trayecto de este viajero se ha vuelto peligroso tras un ataque en el camino."
 pam_sf_penance_lustful_modifier: "Contención de lujuria"
 pam_sf_penance_lustful_modifier_desc: "Este personaje está haciendo penitencia por su lujuria; controla su deseo a costa de tener menos hijos."
 pam_sf_penance_chaste_modifier: "Abandono de la contención"
 pam_sf_penance_chaste_modifier_desc: "Este personaje está dejando de lado una castidad que su fe considera pecaminosa, contra su propia naturaleza."
 pam_sf_penance_gluttonous_modifier: "Días de ayuno"
 pam_sf_penance_gluttonous_modifier_desc: "Este personaje está ayunando en penitencia por su gula, con el fin de agotar el cuerpo para alimentar el alma."
 pam_sf_penance_temperate_modifier: "Fin del largo ayuno"
 pam_sf_penance_temperate_modifier_desc: "Este personaje está abandonando una templanza que su fe considera pecaminosa para convertirse en un libertino de corazón y bolsillo."
 pam_sf_penance_greedy_modifier: "Caridad penitente"
 pam_sf_penance_greedy_modifier_desc: "Este personaje está dando limosnas en penitencia por su codicia, y al aligerar sus arcas también aligera su conciencia."
 pam_sf_penance_generous_modifier: "Cierre de la bolsa"
 pam_sf_penance_generous_modifier_desc: "Este personaje está reprimiendo una generosidad que su fe considera pecaminosa, y ahora es más rico pero también más resentido."
 pam_sf_penance_lazy_modifier: "Trabajo penitente"
 pam_sf_penance_lazy_modifier_desc: "Este personaje está trabajando duro en penitencia por su pereza."
 pam_sf_penance_diligent_modifier: "Descanso obligado"
 pam_sf_penance_diligent_modifier_desc: "Este personaje está dejando a un lado una diligencia que su fe considera pecaminosa, por lo que está más tranquilo pero también es menos productivo."
 pam_sf_penance_wrathful_modifier: "Ira controlada"
 pam_sf_penance_wrathful_modifier_desc: "Este personaje está sofocando su ira en penitencia, y ahora tiene un trato más gentil y una espada menos afilada."
 pam_sf_penance_calm_modifier: "Elevación del espíritu"
 pam_sf_penance_calm_modifier_desc: "Este personaje está convirtiendo una calma que su fe considera pecaminosa en fervor, y ahora es más feroz pero también está más tenso."
 pam_sf_penance_patient_modifier: "Ritmo forzado"
 pam_sf_penance_patient_modifier_desc: "Este personaje está dejando a un lado una paciencia que su fe considera pecaminosa, y se está volviendo una persona precipitada e intranquila."
 pam_sf_penance_impatient_modifier: "Paciencia cultivada"
 pam_sf_penance_impatient_modifier_desc: "Este personaje está controlando su temperamento impaciente en penitencia, y la espera se le hace eterna."
 pam_sf_penance_arrogant_modifier: "Práctica de la humildad"
 pam_sf_penance_arrogant_modifier_desc: "Este personaje está humillando su orgulloso porte en penitencia, y con ello está perdiendo su renombre."
 pam_sf_penance_humble_modifier: "Adopción de una actitud orgullosa"
 pam_sf_penance_humble_modifier_desc: "Este personaje está adoptando un orgullo que su fe exige por encima de la humildad, y está obteniendo renombre a la vez que aumenta su vanidad."
 pam_sf_penance_deceitful_modifier: "Un voto de inocencia"
 pam_sf_penance_deceitful_modifier_desc: "Este personaje está cumpliendo un voto de honestidad en penitencia por su engaño, y su astucia se está viendo mermada."
 pam_sf_penance_honest_modifier: "Aprender a disimular"
 pam_sf_penance_honest_modifier_desc: "Este personaje está aprendiendo la astucia que su fe prefiere antes que la honestidad, y se está volviendo más astuto a costa de ser menos fiable."
 pam_sf_penance_craven_modifier: "Confrontación del miedo"
 pam_sf_penance_craven_modifier_desc: "Este personaje se mantiene firme en penitencia por su cobardía, y le aterra cada segundo que pasa."
 pam_sf_penance_brave_modifier: "Templando el valor"
 pam_sf_penance_brave_modifier_desc: "Este personaje está reprimiendo un valor que su fe considera pecaminoso, y el guerrero se está volviendo demasiado cauteloso."
 pam_sf_penance_shy_modifier: "Audacia forzada"
 pam_sf_penance_shy_modifier_desc: "Este personaje se ve obligado a mostrar audacia en penitencia por su naturaleza retraída, y cada encuentro le supone un reto."
 pam_sf_penance_gregarious_modifier: "Retirada en silencio"
 pam_sf_penance_gregarious_modifier_desc: "Este personaje está abandonando sus juergas pecaminosas por el silencio, y pocos amigos le quedan."
 pam_sf_penance_ambitious_modifier: "Ambición reprimida"
 pam_sf_penance_ambitious_modifier_desc: "Este personaje está conteniendo la ambición de su mirada en penitencia, y con ello está perdiendo renombre."
 pam_sf_penance_content_modifier: "Deseo ardiente"
 pam_sf_penance_content_modifier_desc: "Este personaje está alimentando el deseo en contra de la contención que su fe considera pecaminosa, y con ello aumenta su inquietud y su ambición."
 pam_sf_penance_arbitrary_modifier: "Gobierno justo"
 pam_sf_penance_arbitrary_modifier_desc: "Este personaje gobierna con justicia en penitencia por sus decisiones arbitrarias, y ahora es más justo pero también más pobre."
 pam_sf_penance_just_modifier: "Gobierno caprichoso"
 pam_sf_penance_just_modifier_desc: "Este personaje gobierna según los caprichos que su fe exige frente a la justicia, y es más rico pero también menos querido."
 pam_sf_penance_cynical_modifier: "Reavivando la fe"
 pam_sf_penance_cynical_modifier_desc: "Este personaje está reavivando su fe en penitencia por su cinismo, y siente que la fe lo arropa de una manera poco familiar."
 pam_sf_penance_zealous_modifier: "Atemperando el fervor"
 pam_sf_penance_zealous_modifier_desc: "Este personaje está atemperando un fervor que su fe considera excesivo, y los devotos muestran una actitud fría hacia él."
 pam_sf_penance_paranoid_modifier: "Aprendiendo a confiar"
 pam_sf_penance_paranoid_modifier_desc: "Este personaje está aprendiendo a confiar en penitencia por su suspicacia; ahora deja las puertas abiertas y tiene la guardia baja."
 pam_sf_penance_trusting_modifier: "Guardia del corazón"
 pam_sf_penance_trusting_modifier_desc: "Este personaje está aprendiendo a proteger un corazón que su fe considera demasiado confiado; ahora es más cauteloso pero también más frío."
 pam_sf_penance_compassionate_modifier: "Abandono de la clemencia"
 pam_sf_penance_compassionate_modifier_desc: "Este personaje está abandonando una clemencia que su fe considera pecaminosa, y otros están aprendiendo a temer la dureza de su semblante."
 pam_sf_penance_callous_modifier: "Cultivando la piedad"
 pam_sf_penance_callous_modifier_desc: "Este personaje está cultivando la piedad en penitencia por su insensibilidad, y ahora es más benévolo y se está desvaneciendo el miedo que antes causaba."
 pam_sf_penance_sadistic_modifier: "Renuncia a la crueldad"
 pam_sf_penance_sadistic_modifier_desc: "Este personaje está renunciando a la crueldad en penitencia; el terror que antes causaba se desvanece."
 pam_sf_penance_stubborn_modifier: "Voluntad doblegada"
 pam_sf_penance_stubborn_modifier_desc: "Este personaje está doblegando su voluntad para corregir su testarudez en penitencia, y ahora cede donde antes no lo hacía."
 pam_sf_penance_fickle_modifier: "Enderezando el alma"
 pam_sf_penance_fickle_modifier_desc: "Este personaje se mantiene firme en penitencia por su alma voluble, y ahora resulta irritante."
 pam_sf_penance_eccentric_modifier: "Aceptación de las convenciones"
 pam_sf_penance_eccentric_modifier_desc: "Este personaje está dejando a un lado sus pensamientos extraños en penitencia por su excentricidad."
 pam_sf_penance_vengeful_modifier: "Practicar el perdón"
 pam_sf_penance_vengeful_modifier_desc: "Este personaje está dejando atrás viejos rencores en penitencia por su vengatividad, y ahora es más gentil con los cautivos, pero también más lento en tomar represalias."
 pam_sf_penance_forgiving_modifier: "Alimentar el rencor"
 pam_sf_penance_forgiving_modifier_desc: "Este personaje está alimentando el rencor que su fe exige frente al perdón, y se está volviendo más frío y temido."
 pam_mystical_birthright_spiritual_leader_modifier: "Derechos de nacimiento prometedores"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Una marca congénita presente desde el nacimiento ha guiado la crianza espiritual de este personaje."
 pam_personal_sacrifice_of_wealth_county_modifier: "Inversión devota"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "La ofrenda devota de este gobernante está fomentando el crecimiento de este condado."
 pam_sf_grinding_modifier: "Trabajo sin alma"
 pam_sf_grinding_modifier_desc: "Este personaje se mata a trabajar, y su alma se resiente."
