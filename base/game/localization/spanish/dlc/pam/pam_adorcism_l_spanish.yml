l_spanish:
 pam_curse_enemy_decision: "Maldecir a un enemigo"
 pam_curse_enemy_decision_desc: "#F ¿Quién es tan necio como para ponerse en mi contra? Diré su nombre ante los espíritus y volcaré sobre él todo agravio, insulto y maldición. Que ría mientras pueda; pronto llegará su juicio.#!"
 pam_curse_enemy_decision_tooltip: "Realiza un ritual contra un rival u oponente en una de tus [wars|El]"
 pam_curse_enemy_decision_confirm: "Comenzar el ritual"
 pam_curse_enemy_decision_valid_target: "Tienes un [rival|El], [nemesis|El] o enemigo de guerra adulto vivo"
 pam_curse_enemy_decision_selected_target_valid: "El enemigo seleccionado sigue siendo un [rival|El], [nemesis|El] o enemigo de guerra adulto vivo"
 pam_curse_enemy_decision_no_item_selected: "Ningún enemigo seleccionado"
 pam_seek_war_aid_decision: "Buscar ayuda para la guerra"
 pam_seek_war_aid_decision_desc: "#F La guerra pone a prueba algo más que armas y números. Solicitaré a los espíritus comprensión, vigor o resistencia para sacar adelante mi causa frente a las pruebas que me aguardan.#!"
 pam_seek_war_aid_decision_tooltip: "Pide ayuda a los espíritus para tus guerras actuales"
 pam_seek_war_aid_decision_confirm: "Llamar a los espíritus"
 pam_adorcism_events.0001.t: "Un nombre ante los espíritus"
 pam_adorcism_events.0001.desc: "En un lugar apartado, garabateo el nombre [pam_adorcism_curse_target.Custom('ES_DelDela')] [pam_adorcism_curse_target.GetTitledFirstName|l] en la tierra y digo en voz alta todos los agravios. Este rito no rompe huesos ni marchita cosechas, no es su objetivo.\n\nCuando me levanto, mi ira se ha enfriado en un propósito. Todo rumor sobre [pam_adorcism_curse_target.GetSheHe] parece ahora un hilo que espera a que se tire de él."
 pam_adorcism_events.0001.a: "Mi propósito está claro."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], he dicho vuestro nombre ante los espíritus y os he echado una maldición. Cuando la desgracia os encuentre, recordad que fue mi voluntad la que la llamó."
 pam_adorcism_events.0002.desc.default: "\n\nHe dicho vuestro nombre ante los espíritus y os he echado una maldición. Cuando la desgracia os encuentre, recordad que fue mi voluntad la que la llamó."
 pam_adorcism_events.0002.a: "Que alguien traiga a mi [ROOT.Char.GetFaith.PriestNeuter]… ¡y deprisa!"
 pam_adorcism_events.0002.a.flavor: "La maldición atormenta tus pensamientos, toda sombra asemeja un augurio."
 pam_adorcism_events.0101.t: "Consejos de los invisibles"
 pam_adorcism_events.0101.desc: "Más allá de la última fogata de mi campamento, vierto una ofrenda y escucho mientras los ruidos de la hueste se apagan a mi espalda. El viento agita el polvo; no trae una voz clara, pero el ritual calma mis pensamientos.\n\nDebo decidir qué ayuda buscar para mi próxima campaña."
 pam_adorcism_events.0101.a: "Mostradme la ruta a la victoria."
 pam_adorcism_events.0101.b: "Dadle fuerza al brazo de mi espada."
 pam_adorcism_events.0101.c: "Dad aguante a mi hueste."
 pam_adorcism_curse_focus_modifier: "Ira redirigida"
 pam_adorcism_curse_focus_modifier_desc: "Este personaje dio nombre al objeto de su ira y lo expulsó mediante un ritual."
 pam_adorcism_ill_omen_modifier: "Marcado por un mal augurio"
 pam_adorcism_ill_omen_modifier_desc: "Los miembros del rito de este personaje lo miran con sospecha tras los rumores de una maldición."
 pam_adorcism_curse_anxiety_modifier: "El temor de la maldición"
 pam_adorcism_curse_anxiety_modifier_desc: "Este personaje no puede quitarse de encima la idea de que toda desgracia que le ha ocurrido ha sido llamada contra él."
 pam_adorcism_battle_guidance_modifier: "Estrategia guiada por los espíritus"
 pam_adorcism_battle_guidance_modifier_desc: "Este personaje cree que los espíritus le han revelado señales favorables para la batalla."
 pam_adorcism_personal_vigor_modifier: "Fuerza concedida por los espíritus"
 pam_adorcism_personal_vigor_modifier_desc: "La confianza en el ritual le da a este personaje fuerza para el combate personal."
 pam_adorcism_campaign_endurance_modifier: "Apoyo espiritual para la hueste"
 pam_adorcism_campaign_endurance_modifier_desc: "Los ejércitos de este personaje aguantarán campañas largas con una convicción renovada."
