l_spanish:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "La escritura glagolítica"
 slavic_rite.1000.desc: "«Adelante, herman[greek_preacher.Custom('ES_OA')] [greek_preacher.GetFirstName]», mi [court_chaplain.GetActiveCouncilTask.GetPositionName|l] conduce [greek_preacher.Custom('ES_AlAla')] [greek_preacher.Custom('MyPriestTitle')], seguidor[greek_preacher.Custom('ES_XA')] de la liturgia [GetRiteByKey('byzantine_rite').GetAdjective].\n\n«Bendito sea vuestro señorío, oh, [ROOT.Char.GetTitleAsNameNoTooltip|l]. Mis hermanos también avanzan en una escritura para vuestro pueblo. Mas, ay, trabajamos bajo la sombra y la amenaza constante de sacerdotes [GetRiteByKey('carolingian_christianity').GetAdherentNamePlural] que aspiran a reclamar autoridad eclesiástica sobre vuestras tierras. [Glossary('Cirilo y Metodio', 'CYRIL_AND_METHODIUS_GLOSS')] me han pedido que os solicite más tiempo para desarrollar una estrategia con la que evitar conflictos y negociar una solución diplomática»."
 slavic_rite.1000.a: "Hemos llegado tan lejos que cuento con ellos."
 slavic_rite.1000.a_tt: "[Glossary( 'Cirilo y Metodio', 'CYRIL_AND_METHODIUS_GLOSS' )], los hermanos que crearon una nueva escritura eslava, pronto te informarán de su siguiente paso para extender un nuevo [rite|El] de alma [court_chaplain.GetFaith.GetAdjective] en tu señorío."
 slavic_rite.1000.b: "Mejor abandonar este rumbo que sentir el furor [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip]."
 slavic_rite.1000.b_tt: "Se abandonan todos los esfuerzos para desarrollar una escritura local y fundar un [rite|El] nuevo por parte de [Glossary( 'Cirilo y Metodio', 'CYRIL_AND_METHODIUS_GLOSS' )]."
 slavic_rite.1000.b_tt_2: "La [story_cycle|El] $story_slavic_rite$ termina."
 # Travel to Rome Initiation
 slavic_rite.0001.t: "La misión morava"
 slavic_rite.0001.desc: "Me alivia ver de nuevo a [Glossary( 'Cirilo y Metodio', 'CYRIL_AND_METHODIUS_GLOSS' )] y espero que tengan un plan para lidiar con la injerencia [GetRiteByKey('carolingian_christianity').GetAdjective].\n\n«Honorable [ROOT.Char.GetTitleAsNameNoTooltip|l], parece ser que el único modo de garantizar la seguridad de la forma de culto de vuestro pueblo es viajar a [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] y recibir la bendición [pope_scope.Custom('ES_DelDela')] [pope_scope.GetTitledFirstName|l]».\n\nEspero que la autoridad del trono de san Pedro refrene a los avasalladores [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip], pero parece que solo respetan a los suyos."
 slavic_rite.0001.a: "Id con dios."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName] y [methodius_scope.GetFirstName] emprenderán el viaje. Si tienen éxito, su regreso inspirará un nuevo movimiento religioso a través de tu señorío."
 slavic_rite.0001.b: "No os dejaré marchar con las manos vacías."
 slavic_rite_travel_toast_title: "Cirilo y Metodio comienzan su viaje"
 slavic_rite_moravian_mission_gift_sent_tooltip: "Se enviará un obsequio a [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Los hermanos te informarán de su recepción cuando regresen."
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "Nacimiento del [methodius_scope.GetRite.GetName|l]"
 slavic_rite.0003.desc: "Me han informado de que [methodius_scope.GetFirstNameNoTooltip], con ayuda [moravia_liege_scope.Custom('ES_DelDela')] [moravia_liege_scope.GetTitledFirstNameNoTooltip|l], está intentando extender una nueva forma de practicar el [methodius_scope.GetFaith.GetNameNoTooltip|l] a lo largo y ancho de las tierras de la nación [moravia_liege_scope.GetCulture.GetNameNoTooltip]. Mis eruditos lo llaman [methodius_scope.GetRite.GetName|l].\n\nA pesar de nuestros esfuerzos por atraer a los lugareños, [methodius_scope.GetFirstNameNoTooltip] ha conseguido la aprobación [pope_scope.Custom('ES_DelDela')] [pope_scope.GetTitledFirstName|l] para aplicar sobre ellos esta nueva escritura."
 slavic_rite.0003.a: "Veamos qué éxito tiene."
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "El [methodius_scope.GetRite.GetNameNoTooltip|l] de la nación [ROOT.Char.GetCulture.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "Unas noticias intrigantes han llegado a mi corte esta mañana.\n\n[liege_scope.Custom('ES_ElLa')|U] [liege_scope.GetTitledFirstNameNoTooltip|l] ha permitido que [Select_CString(methodius_scope.IsFemale, 'la sacerdotisa', 'el sacerdote' )] de estirpe [methodius_scope.GetCulture.GetNameNoTooltip], [methodius_scope.GetFirstName], extienda sus costumbres profanas en nuestras tierras a lo largo de años. Debemos moldear el [methodius_scope.GetFaith.GetNameNoTooltip|l] para dar tranquilidad a aquellos que desean practicar las tradiciones de la cultura [ROOT.Char.GetCulture.GetNameNoTooltip].\n\nÚltimamente, ha habido demasiado alboroto respecto a la naturaleza espiritual de nuestras tradiciones. Tendré que pensar cómo voy a proceder en cuanto a esto."
 slavic_rite.0004.desc_chalcedonian: "Nuestr[liege_scope.Custom('ES_OA')] [liege_scope.GetTitleAsNameNoTooltip|l] ha decretado que la proclamación del [methodius_scope.GetRite.GetNameNoTooltip|l] se extienda por todo su señorío. Según mis eruditos, es una forma mucho más conveniente de practicar el [methodius_scope.GetFaith.GetNameNoTooltip|l] sin comprometer nuestro modo de vida.\n\n¿Quizá merezca la pena dedicarle nuestra atención?"
 slavic_rite.0004.a_pagan: "Las costumbres de nuestros antepasados son superiores."
 slavic_rite.0004.b_pagan: "Quizá tengan algo de razón…"
 slavic_rite.0004.a_chalcedonian: "No deseo apartarme del camino de la verdad."
 slavic_rite.0004.b_chalcedonian: "Traed a los eruditos."
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "Un viaje agridulce"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName] se halla ante mí, sol[methodius_scope.Custom('ES_OA')] esta vez, tras su regreso de [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Cuando le pregunto sobre [cyril_scope.GetFirstName], su expresión se altera.\n\n«La buena noticia, piados[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsNameNoTooltip|l], es que [pope_scope.Custom('ES_ElLa')] [pope_scope.GetTitledFirstName|l] nos ha dado su bendición para que difundamos la fe entre la gente de la cultura [ROOT.Char.GetCulture.GetNameNoTooltip] y por todo vuestro señorío, usando nuestros propios métodos y escrituras», dice antes de respirar profundamente. «Pero, por desgracia, me vi obligado a dejar atrás a mi hermano. Haré todo lo que pueda para asegurar que nuestros esfuerzos no sean en vano. Que [ROOT.Char.GetFaith.HighGodName] nos ayude»."
 slavic_rite.0005.a: "¡Juntos, haremos que vuestro hermano se enorgullezca!"
 slavic_rite.0005.b: "Lo menos que puedo hacer es honrar su legado."
 pam_cyril_statue_modifier: "Monumento a Cirilo"
 pam_brothers_travel_safety_modifier: "Viaje cauto"
 slavic_rite.0005.c: "Buena suerte en vuestra misión."
 slavic_rite_mass_conversion_tooltip: "Se ha previsto un [great_project|El] de conversión en masa en todos los [duchies|El] de [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] con la meta de convertir sus [counties|El] al [methodius_scope.GetRite.GetName|l]"
 slavic_rite_moravian_mission_gift_received_tooltip: "Tu regalo para [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] se ha recibido con gratitud."
 slavic_rite_ecclesiastical_title_creation_tooltip: "Se ha creado el $slavic_rite_ecclesiastical_title$ y [methodius_scope.GetFirstName] es su primer[methodius_scope.Custom('ES_XA')] [holder|El]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ de Moravia"
 slavic_rite_ecclesiastical_title_name: "Moravia"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "Fin de la misión morava"
 slavic_rite.0006.desc.brothers_are_dead: "Con el fallecimiento de los hermanos [Glossary('Cirilo y Metodio', 'CYRIL_AND_METHODIUS_GLOSS')] no hay nadie lo bastante cualificado para continuar su obra litúrgica. Debemos desarrollar un enfoque propio para llevar a cabo la conversión completa de mi pueblo si aún lo deseamos."
 slavic_rite.0006.desc.no_longer_christian: "He visto la senda a la gloria. Lo que antaño me motivó para llevar la felicidad a mi pueblo y a mi casa, ahora me parece absolutamente insignificante. La ruta a la que ellos estaban destinados era diferente de lo que yo deseaba para ellos. Por suerte, [ROOT.Char.GetFaith.HighGodName] nos mostró la senda correcta."
 slavic_rite.0006.desc.no_longer_king: "Eventos recientes y la pérdida de mi posición poderosa me han enseñado a no asumir más de lo que puedo manejar. Ahora mismo no podemos sostener la misión morava. Tal vez cuando nos recuperemos, podamos volver a intentarlo bajo nuevas condiciones.\n\nHasta entonces, hay que proteger [ROOT.Char.GetPrimaryTitle.GetNameNoTier] para que no sufra el mismo destino."
 slavic_rite.0006.desc.no_longer_slav: "Es probable que mis antepasados no se sintieran muy orgullosos de en quién me he convertido.\n\nQue así sea. No son ellos quienes deciden cómo gobernar [ROOT.Char.GetPrimaryTitle.GetNameNoTier], sino yo únicamente."
 slavic_rite.0006.a.brothers_are_dead: "No tenía futuro…"
 slavic_rite.0006.a.no_longer_christian: "¡Alabemos a [ROOT.Char.GetFaith.HighGodName]!"
 slavic_rite.0006.a.no_longer_king: "Ya no me puedo permitir semejantes ambiciones."
 slavic_rite.0006.a.no_longer_slav: "El alfabeto glagolítico fue una carga para mi pueblo."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$ para evangelizar el señorío ha quedado obsoleta."
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "Un señorío unido por [ROOT.Char.GetFaith.HighGodName]"
 slavic_rite.0007.desc: "«#italic … que bajo su reinado llevemos una vida tranquila y apacible\ncon toda devoción y dignidad.\n\nPorque Tuyo es el reino, Tuyo el poder y la gloria,\nahora y por los siglos de los siglos. Amén».#!\n\nCuando [archdiocese_holder.Custom('ES_ElLa')] [archdiocese_holder.GetTitledFirstName|l] termina la plegaria, una sensación de bendición eterna se apodera de mi alma. Nuestra misión para que nuestra propia tradición celestial alcanzase todos los rincones de mi señorío ha salido triunfante. Que [ROOT.Char.GetFaith.HighGodName] bendiga mi casa, a [Glossary( 'Cirilo y Metodio', 'CYRIL_AND_METHODIUS_GLOSS' )] y a toda la buena gente de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 slavic_rite.0007.a: "Estábamos destinados a recorrer el camino consagrado."
 pam_slavic_rite_clergy_opinion_modifier: "Monarca bendecido"
 slavic_rite.0007.b: "No hay nada que mi pueblo no pueda sobrellevar."
 pam_slavic_rite_culture_opinion_modifier: "Monarca del pueblo"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "Predicadores clandestinos"
 slavic_rite.0010.desc: "Escoltad[undercover_preacher.Custom('ES_OA')] por mi capellán, [court_chaplain.GetTitledFirstName], un[undercover_preacher.Custom('ES_XA')] [undercover_preacher.Custom('MyPriestTitle')|l] de procedencia [undercover_preacher.GetCulture.GetNameNoTooltip] y su séquito de predicadores entran en mi salón con desfachatez en sus rostros.\n\n«Saludos, mi [ROOT.Char.GetTitleAsNameNoTooltip|l]. Hemos encontrado a estos intrusos cuando predicaban la palabra de [ROOT.Char.GetFaith.HighGodName] sin respetar la autoridad [court_chaplain_superior.Custom('ES_DelDela')] [court_chaplain_superior.GetTitledFirstName|l] ni la vuestra». Hace una pausa para observar a los forasteros de la cabeza a los pies antes de volverse hacia mí.\n\n«Se dice que ya llevan un tiempo acechando en las sombras para persuadir y mancillar las almas de vuestros confiados súbditos. ¿Cómo queréis que nos ocupemos de ellos?»."
 slavic_rite.0010.a: "Marchaos y no volváis jamás a mis tierras."
 slavic_rite.0010.b: "Parece que nuestras advertencias anteriores no han bastado."
 slavic_rite.0010.c: "No tenéis por qué afrontar la decepción de vuestros señores."
 slavic_rite.0010.c.success: "[undercover_preacher.GetSheHe|U] está ansios[undercover_preacher.Custom('ES_OA')] por comenzar una nueva vida en tu corte"
 slavic_rite.0010.c.failure: "No [undercover_preacher.GetHerHim] persuades"
 preacher_recruited.t: "Predicador reclutado"
 preacher_left.t: "El predicador se ha ido"
 # 0020
 slavic_rite.0020.t: "Permiso para una causa piadosa"
 slavic_rite.0020.desc: "«No desean aprovecharse de los lugareños, mi [ROOT.Char.GetTitleAsNameNoTooltip|l]. Los predicadores itinerantes [court_chaplain_superior.Custom('ES_DelDela')] [court_chaplain_superior.GetTitledFirstName|l], en ese aspecto, son muy considerados. Hasta quisieron hablar con vos, lo que es de una humildad encomiable. Una confirmación les facilitaría considerablemente el trabajo a ellos y a vuestro pueblo».\n\nLos esfuerzos [court_chaplain.Custom('ES_DelDela')] [court_chaplain.GetTitledFirstName|l] para persuadirme en nombre de los otros son notables, pero no puedo evitar preguntarme si no debería más bien centrarse en ayudar a mi pueblo a librarse de sus antiguas tradiciones.\n\n«Tengo la sensación de que este es el modo que tiene [ROOT.Char.GetFaith.HighGodName] de proporcionaros una oportunidad para que estemos más cerca»."
 slavic_rite.0020.a: "Cuanto antes se libre mi pueblo de su impiedad, mejor."
 pam_slavic_rite_great_project_speed_modifier: "Proyecto de conversión financiado"
 slavic_rite.0020.b: "Esto es todo lo que podemos dar."
 slavic_rite.0020.c: "Por supuesto que no."
 # 0030
 slavic_rite.0030.t: "Un debate entre Occidente y Oriente"
 slavic_rite.0030.desc: "Una brisa suave agita las hojas en el jardín del monasterio mientras los dos clérigos invitados [court_chaplain_superior.Custom('ES_DelDela')] [court_chaplain_superior.GetTitledFirstName|l] se encuentran frente a frente entre grupos que debaten. Uno viste según la tradición oriental, el otro cuenta con la autoridad occidental. Sus voces al principio humildes ganan confianza y pasión.\n\nDiscuten muchos tópicos litúrgicos, pasan del debate erudito a argumentos fascinantes mientras yo me intereso cada vez más con cada frase.\n\nEsto es más que una conversación; simboliza una competición entre dos mundos, lo que permite intuir una armonía frágil o una división profunda."
 slavic_rite.0030.a: "[visiting_byzantine_clergy.Custom('ES_ElLa')|U] [visiting_byzantine_clergy.Custom('MyPriestTitle')|l] de la tradición [visiting_byzantine_clergy.GetCulture.GetNameNoTooltip] tiene bastante razón."
 slavic_rite.0030.b: "El argumento de [visiting_carolingian_clergy.GetNameNoTooltip] tiene algo de intrigante."
 slavic_rite.0030.c: "El conocimiento es el conocimiento. Estoy de acuerdo con [Select_CString(And(visiting_byzantine_clergy.IsFemale, visiting_carolingian_clergy.IsFemale), 'ambas', 'ambos')]."
 slavic_rite.0030.d: "Nuestras tradiciones son superiores a estos principios antiguos."
