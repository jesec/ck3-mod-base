l_spanish:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "Ampolla de santo myron"
 pam_holy_myron_artifact_desc_common: "Un recipiente con tapón que contiene crisma consagrado: [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')] macerado en aceite de oliva puro, con una gota del lote anterior mezclada con el nuevo, de modo que la cadena de bendición se mantenga ininterrumpida desde los apóstoles."
 pam_holy_myron_artifact_desc_masterwork: "Un recipiente con tapón que contiene crisma consagrado: [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')], [Glossary('incienso','pam_myron_gloss_frankincense')] y [Glossary('mirra','pam_myron_gloss_myrrh')] macerados en aceite de oliva puro, con una gota del lote anterior mezclada con el nuevo, de modo que la cadena de bendición se mantenga ininterrumpida desde los apóstoles."
 pam_holy_myron_artifact_desc_famed: "Un recipiente con tapón que contiene crisma consagrado: [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')], [Glossary('incienso','pam_myron_gloss_frankincense')], [Glossary('mirra','pam_myron_gloss_myrrh')], [Glossary('nardo','pam_myron_gloss_spikenard')] y [Glossary('canela','pam_myron_gloss_cinnamon')] macerados en aceite de oliva puro, con una gota del lote anterior mezclada con el nuevo, de modo que la cadena de bendición se mantenga ininterrumpida desde los apóstoles."
 pam_holy_myron_artifact_desc_illustrious: "Un recipiente con tapón que contiene crisma consagrado, combinado a la perfección según las más antiguas recetas: [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')], [Glossary('incienso','pam_myron_gloss_frankincense')], [Glossary('mirra','pam_myron_gloss_myrrh')], [Glossary('nardo','pam_myron_gloss_spikenard')], [Glossary('canela','pam_myron_gloss_cinnamon')], [Glossary('cálamo','pam_myron_gloss_calamus')] y [Glossary('casia','pam_myron_gloss_cassia')] macerados en aceite de oliva puro, con una gota del lote anterior mezclada con el nuevo, de modo que la cadena de bendición se mantenga ininterrumpida desde los apóstoles."
 pam_holy_myron_charges_line: "Unciones restantes: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "El afamado bálsamo de Judea: una resina fragante que segrega un arbusto bajo cultivado en Jericó y Ein Guedi, junto al mar Muerto; gota a gota, el perfume más caro del mundo antiguo. Es el corazón del crisma, y sus plantaciones, celosamente guardadas, no crecen en ningún otro lugar."
 pam_myron_gloss_frankincense: "Una resina dorada que se extrae de los árboles nudosos del sur de Arabia y que apenas hay en ningún otro lugar de la tierra. Quemada ante los altares desde tiempos inmemoriales, endulza el crisma mientras su humo eleva la oración."
 pam_myron_gloss_myrrh: "Una resina amarga, oscura como la sangre, que segregan los árboles de espino del sur de Arabia y del Cuerno de África. Mencionada en el libro del Éxodo entre los ingredientes del óleo de la santa unción, fue ofrecida ante el Niño Dios por los Magos y llevada a Su sepulcro por los fieles."
 pam_myron_gloss_spikenard: "Un aceite denso y dulce, prensado de las raíces de una planta que solo crece en las altas montañas de Oriente y que se transporta hasta los puertos de la India. Con tal nardo fue ungido el Señor en Betania, a un precio que escandalizó a los discípulos."
 pam_myron_gloss_cinnamon: "La corteza interior dulce de árboles de la India y de islas de más allá, mencionada en el libro del Éxodo entre los ingredientes del óleo de la santa unción. Cruza medio mundo antes de llegar a cualquier altar cristiano."
 pam_myron_gloss_calamus: "La caña dulce de las Escrituras: una caña aromática recogida en lejanos pantanos de Oriente, mencionada en el libro del Éxodo entre los ingredientes del óleo de la santa unción."
 pam_myron_gloss_cassia: "Un pariente más grueso de la canela, extraído de árboles del Lejano Oriente y mencionada en el libro del Éxodo entre los ingredientes del óleo de la santa unción."
 ### Modifiers
 pam_holy_myron_vessel_modifier: "Recipiente del santo myron"
 pam_holy_myron_vessel_modifier_desc: "Este recipiente contiene crisma consagrado, y el aroma del [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')] lo santifica por guardarlo."
 pam_holy_myron_vessel_potent_modifier: "Recipiente de santo myron potente"
 pam_holy_myron_vessel_potent_modifier_desc: "Este recipiente contiene crisma de una potencia excepcional, rico en [Glossary('incienso','pam_myron_gloss_frankincense')] y [Glossary('nardo','pam_myron_gloss_spikenard')]; su fragancia por sí sola es sinónimo de santidad."
 pam_chrismated_artifact_modifier: "Crismado"
 pam_chrismated_artifact_modifier_desc: "Este artefacto ha sido ungido con el santo myron y a él se aferra aún el aroma de la [Glossary('mirra','pam_myron_gloss_myrrh')]."
 pam_chrismated_regalia_modifier: "Vestiduras crismadas"
 pam_chrismated_regalia_modifier_desc: "Este artefacto fue ungido con el santo myron durante una coronación, y la bendición no se ha desvanecido."
 pam_holy_myron_pilgrim_modifier: "Portador de los bálsamos"
 pam_holy_myron_pilgrim_modifier_desc: "Este personaje viaja en busca de los ingredientes para el santo myron —[Glossary('bálsamo','pam_myron_gloss_balsam')], [Glossary('incienso','pam_myron_gloss_frankincense')] y cosas poco comunes— y no corre ningún riesgo en el camino."
 pam_chrismated_child_modifier: "Crismado"
 pam_chrismated_child_modifier_desc: "Este personaje recibió la unción al poco de nacer, sellada con el don del Espíritu Santo mediante aceite bendito."
 pam_myron_chrismated_child_modifier: "Crismado con el santo myron"
 pam_myron_chrismated_child_modifier_desc: "Este personaje recibió la unción al poco de nacer con el propio santo myron —[Glossary('bálsamo de Judea','pam_myron_gloss_balsam')] sobre la frente del neonato—, una unción que nunca se desvanecerá."
 pam_anointed_with_holy_oil_modifier: "Ungido con óleo santo"
 pam_anointed_with_holy_oil_modifier_desc: "Este personaje ha recibido la unción de los enfermos: [Glossary('bálsamo','pam_myron_gloss_balsam')] —aceite de oliva sobre la frente y las manos— que fortalece el cuerpo y el alma durante la prueba."
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "Preparar el santo myron"
 pam_prepare_holy_myron_decision_tooltip: "Envía a tu [court_chaplain|El] a por bálsamos raros y a consagrar una #V ampolla de santo myron#!, un [artifact|El] cuyo contenido se gasta por cargas en unciones sagradas"
 pam_prepare_holy_myron_decision_desc: "El santo crisma no se elabora con lo que pueda sobrar de las cocinas. Las Escrituras nombran sus ingredientes —[Glossary('mirra','pam_myron_gloss_myrrh')], [Glossary('canela','pam_myron_gloss_cinnamon')] dulce, [Glossary('cálamo','pam_myron_gloss_calamus')] y [Glossary('casia','pam_myron_gloss_cassia')] en aceite de oliva puro—, y cada uno debe traerse de las tierras donde crece.\n\nCuanto más lejos llegue la expedición, más rica será la mezcla que regrese para ser consagrada. Pero el viaje es largo y rara vez favorable: los bandidos y las fiebres pueden reducir el lote o acabar con la vida de quien lo transporta."
 pam_prepare_holy_myron_decision_confirm: "Enviar la expedición"
 pam_prepare_holy_myron_decision_needs_chaplain: "Tu [court_chaplain|El] debe ser un adulto disponible que no se encuentre ya de viaje"
 pam_prepare_holy_myron_decision_already_owned: "No debes poseer ya una ampolla de santo myron"
 pam_prepare_holy_myron_decision_journey_underway: "Tu [court_chaplain|El] ya está reuniendo los bálsamos"
 pam_prepare_holy_myron_decision_levant_name: "El bálsamo de Judea"
 pam_prepare_holy_myron_decision_levant_desc: "Tu [court_chaplain|El] consigue [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')] en #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, un único destino y la mezcla más sencilla.\n\nProduce una ampolla [common|El] de santo myron."
 pam_prepare_holy_myron_decision_arabia_name: "Bálsamo e incienso"
 pam_prepare_holy_myron_decision_arabia_desc: "Tu [court_chaplain|El] consigue [Glossary('bálsamo','pam_myron_gloss_balsam')] en #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, luego [Glossary('incienso','pam_myron_gloss_frankincense')] y [Glossary('mirra','pam_myron_gloss_myrrh')] en #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, dos destinos a lo largo de la ruta del incienso.\n\nProduce una ampolla [Concept('masterwork', 'maestra')|E] de santo myron."
 pam_prepare_holy_myron_decision_india_name: "Todos los ingredientes sagrados"
 pam_prepare_holy_myron_decision_india_desc: "Tu [court_chaplain|El] consigue [Glossary('bálsamo','pam_myron_gloss_balsam')] en #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('incienso','pam_myron_gloss_frankincense')] y [Glossary('mirra','pam_myron_gloss_myrrh')] en #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, y [Glossary('nardo','pam_myron_gloss_spikenard')] y [Glossary('canela','pam_myron_gloss_cinnamon')] en #V [GetTitleByKey('c_kerala').GetNameNoTier]#!, un largo viaje.\n\nProduce una ampolla [famed|El] de santo myron. En cambio, si tu [court_chaplain|El] sigue las viejas recetas al pie de la letra —una probabilidad del #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0] %#!, que varía en función de su [learning|El]—, el lote es [illustrious|El]."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "Debes poder permitirte un gasto de [GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] de [gold|El] [gold_i]"
 pam_prepare_holy_myron_decision_afford_india_tt: "Debes poder permitirte un gasto de [GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] de [gold|El] [gold_i]"
 pam_prepare_holy_myron_journey_toast: "Parte la expedición a por el santo myron"
 pam_prepare_holy_myron_journey_toast_tt: "Tu [court_chaplain|El] parte a reunir los ingredientes necesarios para el santo myron"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Tu [court_chaplain|El] parte a #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. A su regreso, se consagrará un ampolla [common|El] de santo myron, si el viaje es favorable"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Tu [court_chaplain|El] parte a #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! y #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. A su regreso, se consagrará una ampolla [Concept('masterwork', 'maestra')|E] de santo myron (los bandidos e infortunios del camino pueden reducir el lote)"
 pam_prepare_holy_myron_decision_india_effect_tt: "Tu [court_chaplain|El] parte a #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! y #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. A su regreso, se consagrará una ampolla [famed|El] de santo myron, con una probabilidad del #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0] %#! de que esta sea [illustrious|El] (los bandidos e infortunios del camino pueden reducir el lote)"
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]:"
 pam_holy_myron.0011.desc_levant: "Os escribo desde las orillas del Mar Salado, donde el [Glossary('bálsamo de Judea','pam_myron_gloss_balsam')] brota de la corteza herida como lágrimas de oro. Los cultivadores regatearon con dureza, pero la resina es pura; una sola gota sobre la muñeca perfuma una estancia entera. El primero de los ingredientes ya está asegurado."
 pam_holy_myron.0011.desc_arabia: "La ruta del incienso fue larga y los pozos distaban mucho entre sí, pero Dhofar nos ha dado aquello que veníamos a buscar: [Glossary('incienso','pam_myron_gloss_frankincense')] pálido como el hielo de la mañana y [Glossary('mirra','pam_myron_gloss_myrrh')] oscura como la sangre vieja. Los jefes de caravanas de aquí aseguran que no hay resina más fina en ningún puerto del mundo. Yo les creo, y en consecuencia les pagué."
 pam_holy_myron.0011.desc_india: "La travesía marítima puso a prueba a todas las almas a bordo, pero los mercados de la costa de Malabar albergan maravillas: [Glossary('nardo','pam_myron_gloss_spikenard')] de las altas montañas y [Glossary('canela','pam_myron_gloss_cinnamon')] más dulce que ninguna que haya conocido. El último de los ingredientes ya está en nuestras manos. Emprendemos el regreso a casa."
 pam_holy_myron.0011.a: "Qué el resto del camino sea rápido."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], nos ha sobrevenido la desgracia:"
 pam_holy_myron.0012.desc: "Hombres armados bloquean el paso más adelante. Se autodenominan cobradores de peaje, aunque ninguna corona les otorgó jamás tal derecho. Han contado nuestros cofres y conocen su valor, pero nos dejarán pasar sin saquearnos si pagamos un precio.\n\nAguardo vuestras instrucciones y mantengo a mano los bálsamos."
 pam_holy_myron.0012.a: "Pagadles, el crisma vale más que las monedas."
 pam_holy_myron.0012.b: "Las monedas de la Iglesia no son para bandidos."
 pam_holy_myron.0012.b.tt: "Los bálsamos reunidos serán saqueados y el último lote de santo myron será de #N peor calidad#!"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U]:"
 pam_holy_myron.0013.desc: "Me ha asaltado una fiebre en el camino. Me tiemblan las manos mientras escribo, y la mujer del posadero me jura y perjura sobre la eficacia de tres remedios distintos, a cual más repugnante. No temáis por los bálsamos: están secos, sellados y mejor custodiados que yo. Proseguiré el viaje tan pronto como pueda ponerme en pie."
 pam_holy_myron.0013.a: "Rezaré por [myron_chaplain.Custom('ES_ElElla')]."
 pam_holy_myron_journey_abandoned_toast: "Se abandona la expedición a por el santo myron"
 pam_holy_myron.0020.t: "Finaliza el viaje"
 pam_holy_myron.0020.desc: "La carta de un mercader trae la noticia: [myron_chaplain.Custom('ES_ElLa')] [myron_chaplain.GetTitledFirstName|l], a quien envié a reunir los ingredientes para el santo myron, ha muerto lejos de su hogar. Los bálsamos se han dispersado entre extraños, y ningún crisma llegará de mi dinero ni de su esfuerzo."
 pam_holy_myron.0020.a: "Que [ROOT.Char.GetFaith.HighGodName] [myron_chaplain.Custom('ES_LoLa')] tenga en Su gloria."
 pam_holy_myron.0100.t: "La consagración del myron"
 pam_holy_myron.0100.desc.intro: "[myron_chaplain.Custom('ES_ElLa')|U] [myron_chaplain.GetTitledFirstName|l], fatigad[myron_chaplain.Custom('ES_OA')] por el camino, regresa al fin a mi lado, y mi corte huele el cargamento antes de verlo. A puerta cerrada se mezcla el aceite y se incorpora una gota del viejo myron al nuevo, tal como se viene haciendo desde tiempos de los Apóstoles.\n\n"
 pam_holy_myron.0100.desc_full: "Todos los ingredientes han sobrevivido al viaje. Dorado y fragante, el crisma ya preparado se vierte en su ampolla y se coloca ante mi altar."
 pam_holy_myron.0100.desc_robbed: "Se ha perdido mucho por el camino, y la mezcla es más diluida de lo que esperaba; no obstante, la consagración restaura lo que el viaje ha mermado, y la ampolla se coloca ante mi altar de todos modos."
 pam_holy_myron.0100.a: "La cadena de la bendición permanece intacta."
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "Una última unción"
 pam_holy_myron.0200.desc: "Los dolientes se apartan a mi paso mientras me acerco al féretro y me traen la [pam_holy_myron_artifact.GetName|l]. Ante la mirada de la corte reunida, una cruz de santo crisma sobre la frente enviará [deceased.Custom('ES_AlAla')] [deceased.GetTitledFirstName|l] ante el trono de [ROOT.Char.GetFaith.HighGodName] marcad[deceased.Custom('ES_OA')] como un[deceased.Custom('ES_OA')] de los ungidos, un honor que todas las almas presentes presenciarán y contarán. Sin embargo, cada gota que derrame sobre los muertos es una gota que los vivos nunca verán."
 pam_holy_myron.0200.a: "Que se unja a [deceased.GetFirstNameNoTooltip]."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip]#! será vist[deceased.Custom('ES_OA')] con mejores ojos cuando se considere su canonización"
 pam_holy_myron.0200.b: "El crisma es para los vivos."
 pam_holy_myron.0200.b.tt: "Tú administras el santo crisma para aquellos a quienes este aún pueda bendecir"
 ### Spending the oil
 pam_holy_myron_spend_tt: "Se ha gastado una carga de tu ampolla de santo myron"
 pam_holy_myron_spend_last_tt: "Se ha gastado la #N última#! carga de tu ampolla de santo myron; se #N perderá#! el recipiente vacío"
 pam_holy_myron_vessel_spent_toast: "Contenido de la ampolla agotado"
 pam_holy_myron_vessel_spent_tt: "Tras verter su última dosis de crisma, se retira el recipiente"
 ### Coronation
 pam_holy_myron_coronation_option: "Que el santo myron selle esta corona."
 pam_holy_myron_coronation_option.flavor: "Gasta una carga del santo crisma en tu propia unción."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nEn una coronación se le aplicó el santo myron y aún conserva tal bendición."
 pam_holy_myron_coronation_memory: "se le ungió con el santo myron"
 pam_holy_myron_coronation_memory_desc: "En mi coronación, [anointer.Custom('ES_ElLa')] [anointer.GetTitledFirstName|l] me ungió con el santo crisma."
 pam_holy_myron_coronation_memory_desc_second_perspective: "en tu coronación, [anointer.Custom('ES_ElLa')] [anointer.GetTitledFirstName|l] te ungió con el santo crisma."
 pam_holy_myron_coronation_memory_desc_third_perspective: "en su coronación, [owner.Custom('ES_ElLa')] [owner.GetTitledFirstName|l] fue ungid[owner.Custom('ES_OA')] con el santo crisma."
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "Ungir un artefacto con el santo myron"
 pam_anoint_artifact_decision_tooltip: "Gasta una carga del santo myron para marcar uno de tus [artifacts|El] como [sanctified|El], sin importar lo que tus principios permitirían normalmente"
 pam_anoint_artifact_decision_desc: "El crisma no pide permiso al clero. Todo lo que toque —ya sea una espada, un libro o una bagatela— queda [sanctified|El] por el propio óleo a ojos del [ROOT.Char.GetFaith.GetName|l], y ningún dogma ni obispo puede oponerse a ello."
 pam_anoint_artifact_decision_confirm: "Ungir"
 pam_anoint_artifact_decision_no_item_selected: "Ningún [artifact|lE] seleccionado"
 pam_anoint_artifact_needs_myron_tt: "Debe poseer una #V ampolla de santo myron#! en la que quede óleo"
 pam_anoint_artifact_has_eligible_artifact_tt: "Debe poseer un [artifact|El] que no haya sido ya [sanctified|El]"
 pam_anoint_artifact_not_myron_tt: "El santo myron no se puede ungir a sí mismo"
 pam_anoint_artifact_not_already_chrismated_tt: "No se debe haber crismado ya"
 pam_anoint_artifact_toast: "Artefacto crismado"
 pam_chrismated_artifact_name: "[pam_anointed_artifact.GetNameNoTooltip] que se ha crismado"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\nSe ungió con el santo myron y reluce tenuemente con el óleo sagrado."
 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "Regalar el santo myron"
 pam_give_holy_myron_interaction_desc: "Llena una ampolla nueva con tu propio santo myron y regálasela a [recipient.GetShortUIName]. Tu recipiente pierde una carga; ganas [piety|El] y la gratitud de [recipient.GetShortUIName]."
 pam_give_holy_myron_recipient_toast: "Un obsequio de santo myron"
 pam_give_holy_myron_recipient_tt: "Recibes un [artifact|E] de ampolla [common|El] de santo myron que contiene una sola carga"
 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "Crismación de recién nacido"
 pam_holy_myron_unction_toast: "La unción de los enfermos"
 pam_holy_myron.0300.t: "El sello del Espíritu"
 pam_holy_myron.0300.desc: "Mi [child.Custom('GetDaughterSon')] [child.GetFirstName] llora en brazos del [myron_officiant.GetFaith.PriestNeuter] mientras traen el crisma.\n\nLa iglesia dispone de óleo bendito suficiente para todos los recién nacidos, pero mi propia ampolla de santo myron está al alcance de la mano, y una sola y reluciente gota de ella sellaría a este niño para toda la vida."
 pam_holy_myron.0300.desc_twin: "\n\nY no una frente, sino dos: [pam_myron_twin.GetFirstName] yace envuelt[pam_myron_twin.Custom('ES_OA')] junto a su gemel[pam_myron_twin.Custom('ES_OA')], a la espera del mismo sello."
 pam_holy_myron.0300.a: "Basta con el óleo bendito de la iglesia."
 pam_holy_myron.0300.b: "Solo servirá el santo myron."
