l_spanish:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] se extiende a lo largo de muchos señoríos y se compone de una miríada de pueblos diversos, cada uno con sus lenguas, culturas y conflictos.\n\nAunque las disputas doctrinales son tan antiguas como la Iglesia, en los tiempos que corren, devastados por las plagas, las guerras y la herejía, nuestra unidad se pone a prueba.\n\nDel mismo modo que [st_paul.GetName] apóstol pidió a los corintios que buscaran la unidad, los [christians|El] deben escuchar su consejo y [Glossary( 'non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS' )]. De lo contrario, nos veremos sumidos en la herejía, convertidos en meros títeres del Anticristo.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Nuestros blandos vecinos, los [christians|El], siguen a un dios débil y celoso, y discuten como niños sobre la naturaleza de su muñeco. Mientras tanto, su vigilancia se adormece y sus espadas se mueren de hambre, pues mucho tiempo ha pasado desde la última vez que devoraron un verdadero festín de sangre.\n\nPretenden enviarnos hombres santos para propagar su debilidad por nuestras tierras. ¡Antes les haremos nosotros también una visita y saquearemos sus arcas! Con nuestro ejemplo, aprenderán a ser fuertes otra vez."
 pam_the_christian_church.0051.desc.heathen_rulers: "Nuestros vecinos [christians|El] son gente rudimentaria y pendenciera. Son como el cieno en el agua, un tosco espejo de los fieles de [ROOT.Char.GetFaith.HighGodName]. Atrapados en el pasado, sus falsas creencias solo los llevarán a la ruina.\n\nSus tesoros, insignificantes como ellos mismos, están ahí para que los tomemos. Su gente, indisciplinada como es, aguarda lista para que la sometan."
 pam_the_christian_church.0051.desc.heretic_rulers: "El burro que se sienta en la sede de [st_peter.GetName] nos llama herejes por ser verdaderos creyentes. Si Cristo renaciera, seguramente se haría fariseo y volvería a pedir la crucifixión de nuestro Señor.\n\n¡Observad la división entre los que llamamos Cristo a nuestro Señor! El falso obispo de Roma es quien ha plantado la semilla de la discordia.\n\nEste vicerregente de Satanás no dudaría en martirizarnos. Debemos extirpar esta corrupción, ¡por la salvación de todos los [christians|El]!"
 pam_the_christian_church.0051.desc.western: "Con el poder del obispo de Roma disminuido, debemos reparar estas brechas en la fe ahora que el Juicio Final se acerca."
 pam_the_christian_church.0051.desc.eastern: "Asediados por los enemigos de Cristo, debemos buscar una causa común con el obispo de Roma ahora que el Juicio Final se acerca."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nEl concilio ha autorizado que las coronas depongan a los prelados nombrados por la Iglesia."
 pam_the_christian_church.0051.desc.oriental_orthodox: "«[Glossary( 'Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS' )]». Debemos devolver a nuestro hermano a la luz a medida que se acerca el Juicio Final."
 pam_the_christian_church.0051.a: "¡Que Cristo sea nuestro guía!"
 pam_the_christian_church.0051.b: "No debemos perder de vista a estos creyentes de Cristo."
 MIAPHYSITISM_GLOSS: "#bold «¡Hay una sola naturaleza del Verbo de Dios hecho carne!»#!, proclamó san Cirilo de Alejandría en el Concilio de Éfeso en el año 431 d. C. Esta visión cristológica conocida como miafisismo es la que suele sostener la ortodoxia oriental."
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0052.desc.intro: "Un coro de voces resuena en la oscuridad que rodea a [GetSituation('the_christian_church').GetTopSubRegion.GetName].\n\n#EMP «¡Roma va camino de convertirse en una Sodoma moderna!»#!.\n\n#EMP «¡El Papa es la prostituta y el proxeneta a la vez!»#!.\n\nIncluso aquellos con una visión más moderada han de reconocer que la Iglesia está en crisis y necesita reformas."
 pam_the_christian_church.0052.desc.unreformed_pagan: "Nuestros vecinos, los [christians|El] débiles en espíritu, claman: «¡El fin está cerca, nuestro Papa es tan salvaje como los paganos!».\n\nAl menos hay algo de cierto en todo esto. ¡Ayudémosles a encontrar el final que tanto se empeñan en anunciar!"
 pam_the_christian_church.0052.desc.heathen_rulers: "«¡Nuestra Iglesia está en crisis!», claman los [christians|El].\n\nEstá bien que reconozcan lo que siempre hemos sabido. Esos necios paganos solo pueden esperar acabar siguiendo nuestro ejemplo algún día, abrazando los principios de [ROOT.Char.GetFaith.HighGodName].\n\nSus tesoros, por insignificantes que sean, están listos para que los tomemos. Sus tesoros, insignificantes como ellos mismos, están ahí para que los tomemos. Su gente, indisciplinada como es, aguarda lista para que la sometan."
 pam_the_christian_church.0052.desc.heretic_rulers: "¡Debemos detener a este Anticristo ataviado con la túnica de san Pedro!"
 pam_the_christian_church.0052.desc.western: "El cambio debe hallarse primero en Roma, solo entonces sanará [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip]."
 pam_the_christian_church.0052.desc.eastern: "Asediados por los enemigos de Cristo, debemos curar la corrupción en Roma o nos consumirá."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "¡Que el Señor ilumine nuestro camino!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0053.desc.intro: "¡Regocijémonos con el progreso de nuestra misión! Las fronteras de [GetSituation('the_christian_church').GetTopSubRegion.GetName] se expanden a medida que esos brutos paganos aprenden a recorrer la senda de Cristo.\n\nLamentablemente, no todos acogen de buen grado las enseñanzas de la Iglesia. ¡Pero no temáis, si rechazan a nuestros misioneros, se aprenderán nuestros rezos con el filo de nuestras espadas apuntando a sus cuellos!\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "Los [christians|El] llegan a nuestras tierras con sus hombres santos. Si les damos la espalda, regresarán con espadas.\n\nAunque muchos de los nuestros quieran mantener los principios de [ROOT.Char.GetFaith.HighGodName], hay otros que ven ventajas en servir a ese Cristo que dice ser Dios hecho hombre. El poder se otorgaría por orden divina, la iglesia podría servirnos de mensajera y, lo más interesante de todo, recaudarían impuestos."
 pam_the_christian_church.0053.desc.heathen_rulers: "Nuestros vecinos los [christians|El] obligan a los idólatras a convertirse, cuando merecen poco más que ser asesinados.\n\nPese a que el filo de sus espadas nos apunta, [ROOT.Char.GetFaith.HighGodName] abre ante nosotros una ventana de oportunidad. Sus tesoros, insignificantes como ellos mismos, están ahí para que los tomemos. Su gente, indisciplinada como es, aguarda lista para que la sometan."
 pam_the_christian_church.0053.desc.heretic_rulers: "¡El impostor de Roma pretende convertir a los paganos a su desencaminado culto! Este Anticristo no tiene bastante con envenenar las mentes de los [christians|El], sino que su perverso apetito le pide atraer a esos idólatras ingenuos hacia su abrazo infernal."
 pam_the_christian_church.0053.desc.western: "Debemos ocuparnos de dirigir a estos cristianos recién nacidos a realizar el culto del [ROOT.Char.GetRite.GetName|l], tal como lo aprobó el trono de San Pedro."
 pam_the_christian_church.0053.desc.eastern: "Cuando Roma afirma que solo busca la conversión de aquellos fuera de [GetSituation('the_christian_church').GetTopSubRegion.GetName], debemos permanecer vigilantes, no sea que nos roben nuestro [ROOT.Char.GetRite.GetName|l] o, peor aún, vuelvan sus espadas, recién empapadas en sangre pagana, contra otros cristianos."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.Custom('ES_ElLa')|U] [christianity.GetReligiousHead.GetTitledFirstName|l] tiene una tarea complicada por delante, pero la Iglesia todavía se puede rescatar.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\n¡Sin embargo, todavía se puede rescatar a la Iglesia!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Puede que nuestra fe en Dios sea inquebrantable, pero muchos han perdido la fe en la Iglesia. El clero, que en su momento dio ejemplo con sus acciones siguiendo el camino de Cristo, ha perdido mucha de su independencia, y se ha convertido en un instrumento de la influencia de emperadores y reyes."
 pam_the_christian_church.0054.desc.unreformed_pagan: "Los [christianity.GetAdherentNamePlural] desgarran su propio tejido clerical y esperan que Dios no se fije en los remiendos. Si están ocupados remendando casullas y anales, tal vez envíen menos clérigos a molestar en nuestras arboledas y santuarios fluviales."
 pam_the_christian_church.0054.desc.heathen_rulers: "Los [christianity.GetAdherentNamePlural] ensayan una gran renovación de sus leyes y altares; cada facción proclama un servicio más puro al dios del sufrimiento. Podemos tomar nota de sus nuevos lemas, pero el filo de nuestras hachas seguirá respondiendo con más claridad que sus concilios."
 pam_the_christian_church.0054.desc.heretic_rulers: "¡Los sectarios de Roma ahora riñen por reformas! Lo que ellos llaman renovación es solo reordenar el mismo yugo, ceñido con unas pretensiones más mortíferas de superioridad moral. Que su reforma abra cráneos en sus basílicas antes de que se acuerden de nosotros."
 pam_the_christian_church.0054.desc.western: "Aunque algunos llamarían a esta rectificación del timón una reforma, la gente teme la innovación y puede ser más receptiva si se presenta como un «regreso a las formas de antaño»."
 pam_the_christian_church.0054.desc.eastern: "Roma, o cualquiera que sea la cámara curial que afirme ser el árbitro de la ecúmene, trabaja para pulir sus ritos: nuevos cánones, nuevos juramentos, nuevas recriminaciones por pecados viejos. Observamos, censuramos y reforzamos nuestros propios sínodos para que una templanza occidental no se confunda con un yugo universal."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nEl concilio ha decidido a favor de los derechos de nombramiento vitalicio de la Iglesia."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nPríncipes laicos presionan a los obispos [christianity.GetReligiousHeadTitle.Custom('ES_DelDela')] [christianity.GetReligiousHeadTitle.GetName|l] para conseguir sus juramentos, como si la ordenación fuera otra granja que arrendar. Mientras tanto, [christianity.GetReligiousHeadTitle.Custom('ES_ElLa')] [christianity.GetReligiousHeadTitle.GetName|l] prohíbe a las manos coronadas bendecir mitras que no haya consagrado personalmente.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nYa que no hay un pastor indiscutible, cada trono inviste a sus propios obispos; las túnicas son sagradas, pero las consagraciones huelen más a monedas que a incienso.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "De un extremo a otro de [GetSituation('the_christian_church').GetTopSubRegion.GetName], la enemistad entre el altar y la corona ya no son simples rumores."
 pam_the_christian_church.0055.desc.unreformed_pagan: "Mientras los [christianity.GetAdherentNamePlural] disputan si una corona o una mitra puede ordenar a un obispo, menos misioneros se fijan en nosotros. Que reyes y pontífices se atraganten con sus privilegios; su división deja tranquilas nuestras arboledas."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "Roma clama a voz en grito contra la tiranía en las investiduras, ¡pero cubriría con grilletes a nuestros maestros si los alcanzase! ¡Romped primero vuestros collares antes de darnos lecciones, fariseos!"
 pam_the_christian_church.0055.desc.western: "Si torcemos el báculo demasiado hacia el cetro, los dos podrían combinarse.\n\n"
 pam_the_christian_church.0055.desc.eastern: "Los reyes de Occidente pelean con Roma por anillos y báculos; sus modos pecaminosos mancillan la institución entera.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0056.desc.intro: "A lo largo de [GetSituation('the_christian_church').GetTopSubRegion.GetName], los fieles claman por la liberación del Santo Sepulcro. Se saca brillo a las cruces para marchar, se empeñan reliquias para preparar cofres de guerra.\n\nEl fervor arde con pasión, pero si este se enfría, el celo se puede convertir en duda con la misma rapidez que la ceniza se escapa de una pira.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Sus predicadores belicistas exigen cruzadas mientras descuidan sus propias tierras; que los romanos se consuman en dunas lejanas."
 pam_the_christian_church.0056.desc.western: "El acero puede conseguir lo que los sermones no alcanzan.\n\n"
 pam_the_christian_church.0056.desc.eastern: "Las huestes occidentales marchan hacia Tierra Santa.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ — [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip|l]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ bajo la mirada atenta [christianity.GetReligiousHeadTitle.Custom('ES_DelDela')] [christianity.GetReligiousHeadTitle.GetName|l].\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nAunque carezca de un pastor indiscutible, el destino de la fe es volver a hallar la razón.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "Las disputas de la Iglesia se detienen. [GetSituation('the_christian_church').GetTopSubRegion.GetName] da la bienvenida a una era de paz y comunión."
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "Las escuelas pueden apilar un argumento sobre otro, mas la mayoría de las almas siguen alcanzando a Dios a través de las palabras de un sacerdote.\n\nNo debemos olvidar que la nuestra es una religión popular."
 pam_the_christian_church.0057.desc.eastern: "Seguimos cantando plegarias mientras los escritorios occidentales crujen bajo tratados pesados. La armonía es bien recibida, peros sus disputas académicas no deberían entrar en nuestras cancillerías."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "Se ha convocado un concilio"
 pam_the_christian_church.0058.desc: "Los largos años de la [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] llegan a su punto culminante. Se convoca un concilio para decidir de una vez por todas quién debe investir al clero: la Iglesia o la corona."
 pam_the_christian_church.0058.a: "Decidamos pues."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "El concilio se reúne"
 pam_the_christian_church.0059.desc.located: "Las convocatorias se enviaron y los padres de la Iglesia se reúnen para el concilio sobre las investiduras, llamados por [investiture_convene_host.Custom('ES_ElLa')] [investiture_convene_host.GetTitledFirstName|l] a [investiture_convene_location.GetName]. Su decisión decidirá en toda la cristiandad si es la Iglesia o la corona quien inviste al clero."
 pam_the_christian_church.0059.desc: "Las convocatorias se enviaron y los padres de la Iglesia se reúnen para el concilio sobre las investiduras. Su decisión decidirá en toda la cristiandad si es la Iglesia o la corona quien inviste al clero."
 pam_the_christian_church.0059.a: "Que deliberen."
 pam_the_christian_church_not_hof_trigger_tt: "No eres el cabeza de la fe"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "Pronto se reunirá un concilio especial de la Iglesia para decidir la [doctrine|El] de tu [faith|El] sobre los siguientes nombramientos clericales."
 pam_the_christian_church.0060.t: "Sin divisiones entre vosotros"
 pam_the_christian_church.0060.desc: "La cristiandad se encuentra al borde del precipicio. El [schism_mainline_rite.GetName|l] reclama la herencia de los apóstoles, mientras que el [schism_competitor_rite.GetName|l] no cede.\n\nCristo en persona avisó de que [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )|l]. Si se deja que la herida se infecte en esta crisis, la Iglesia jamás volverá a hablar con una sola voz."
 pam_the_christian_church.0060.a: "Estoy con el [schism_mainline_rite.GetNameNoTooltip|l]."
 pam_the_christian_church.0060.a.tt: "Contribuye hacia la [decision|El] [GetDecisionWithKey('pam_cause_great_schism_decision').GetName]"
 pam_the_christian_church.0060.b: "Estoy con el [schism_competitor_rite.GetNameNoTooltip|l]."
 pam_the_christian_church.0060.b.tt: "Contribuye hacia la [decision|El] [GetDecisionWithKey('pam_cause_great_schism_decision').GetName]"
 pam_the_christian_church.0060.c: "Un cuerpo debe tener dos brazos."
 pam_the_christian_church.0060.c.tt: "Contribuye hacia la [decision|El] [GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]"
 pam_the_christian_church.0061.t: "El Gran Cisma"
 pam_the_christian_church.0061.desc: "Los enviados de parte de [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] han formulado su sentencia sobre el altar:\n\n«Caiga el anatema sobre [schism_eastern_faith.GetReligiousHead.GetFirstName], falsamente llamad[schism_eastern_faith.GetReligiousHead.Custom('ES_OA')] [schism_eastern_faith.ReligiousHeadName|l], y sus seguidores. ¡[Glossary( 'Maranatá', 'MARANATHA_GLOSS' )] con todos los herejes! No, con el diablo y sus ángeles, a menos que se desdiga».\n\n«Sea anatema este documento impío, junto con aquellos que lo editaron, lo escribieron o tuvieron alguna relación con él», replica [schism_eastern_faith.Custom('ES_ElLa')] [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip|l].\n\nLos fieles quedan divididos entre [schism_western_faith.GetAdherentNamePlural] y [schism_eastern_faith.GetAdherentNamePlural]. Ahora mi alma es [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 pam_the_christian_church.0061.desc.bystander: "Llegan noticias de [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]: los legados han dejado una sentencia de anatema en el altar y [schism_eastern_faith.GetReligiousHead.Custom('ES_ElLa')] [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip|l] les ha pagado con la misma moneda.\n\nLa que antaño decía ser una sola Iglesia ahora está divida en [schism_western_faith.GetAdherentNamePlural] y [schism_eastern_faith.GetAdherentNamePlural]. Su disputa nunca fue la mía y no afecta a la fe del [ROOT.Char.GetFaith.GetName|l], sin embargo, es un espectáculo triste de contemplar."
 pam_the_christian_church.0061.a: "Que así sea."
 pam_the_christian_church.0061.a.shame: "Qué verdadera lástima."
 pam_the_christian_church.0061.a.bystander: "Es una pena ver pelearse a los hermanos."
 MARANATHA_GLOSS: "Una expresión aramea que significa #bold «¡El Señor viene!»#! de 1 Corintios 16:22; se convirtió en una fórmula de anatema: aquellos excomulgados quedan expulsados hasta el regreso del Señor."
 pam_the_christian_church.0062.t: "Comunión conservada"
 pam_the_christian_church.0062.desc: "La herida que amenazaba con escindir la cristiandad ha sido reparada. Gracias al trabajo [schism_peacemaker.Custom('ES_DelDela')] [schism_peacemaker.GetTitledFirstName|l], las sedes peleadas son convocadas a una sola mesa.\n\n[Glossary( 'Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus… Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS' )]\n\nEl [ROOT.Char.GetFaith.GetName|l] sigue en comunión."
 pam_the_christian_church.0062.a: "Bendito sea el Señor."
 pam_the_christian_church.0062.a.peacemaker: "No habrá una única sede que gobierne al resto."
 pam_the_christian_church.0062.b: "Que [new_head_of_faith.Custom('ES_ElLa')] [new_head_of_faith.GetTitledFirstNameNoTooltip|l] nos guíe a todos."
 pam_the_christian_church.0062.b.self: "Entonces todo el rebaño responderá ante mí."
 pam_the_christian_church.0063.t: "Aquel que quedó atrás"
 pam_the_christian_church.0063.desc: "Me he pasado al [ROOT.Char.GetRite.GetName|l], mas [schism_dissenter.Custom('ES_ElLa')] [schism_dissenter.GetTitledFirstName|l] no me ha seguido. Sigue planteando dudas sobre mi alma y mi antigua comunidad:\n\n«Nos habéis abandonado», dice con voz queda. «Cuando la misma Iglesia se parta en dos…, y lo hará…, vos y yo nos encontremos en extremos opuestos de la herida»."
 pam_the_christian_church.0063.a: "El mismo Dios nos oye a [Select_CString(And(ROOT.Char.IsFemale, schism_dissenter.IsFemale), 'las dos', 'los dos')]."
 pam_the_christian_church.0063.b: "Dejad que os muestre por qué me he pasado."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.Custom('ES_ElLa')|U] [schism_dissenter.GetTitledFirstNameNoTooltip|l] se pasa conmigo"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.Custom('ES_ElLa')|U] [schism_dissenter.GetTitledFirstNameNoTooltip|l] no se convencerá"
 pam_the_christian_church.0063.c: "Guardaos vuestros miedos para vos."
 pam_the_christian_church.0064.t: "La herida se abrirá"
 pam_the_christian_church.0064.desc.opening.self_mainline: "Mi voz truena contra la [schism_competitor_head.Custom('ES_DelDela')] [schism_competitor_head.GetTitledFirstName|l]."
 pam_the_christian_church.0064.desc.opening.self_competitor: "Mi voz truena contra la [schism_mainline_head.Custom('ES_DelDela')] [schism_mainline_head.GetTitledFirstName|l]."
 pam_the_christian_church.0064.desc.opening: "Las voces [schism_mainline_head.Custom('ES_DelDela')] [schism_mainline_head.GetTitledFirstName|l] y [schism_competitor_head.Custom('ES_DelDela')] [schism_competitor_head.GetTitledFirstName|l] truenan la una contra la otra."
 pam_the_christian_church.0064.desc: "No veo ruta de regreso a la concordia entre el [schism_mainline_rite.GetName|l] y el [schism_competitor_rite.GetName|l].\n\nLa advertencia de la Escrituras se ha vuelto sentencia: [Glossary( 'Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS' )]. La comunión en la [christianity.GetName|l] aún no se ha roto, pero la herida se abrirá. La hora es inevitable."
 pam_the_christian_church.0064.a: "Dios, no nos abandonéis."
 pam_the_christian_church.0064.a.tt: "El progreso del Gran Cisma ha llegado a su umbral"
