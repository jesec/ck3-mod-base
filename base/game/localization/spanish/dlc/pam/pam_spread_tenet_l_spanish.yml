l_spanish:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "Evangelizar dogma"
 spread_personal_tenet_intent_desc: "Quieres predicar tu propio [personal_tenet|El] a invitados receptivos, que lo puedan adoptar como suyo propio, lo cual aumentaría la [tenet_popularity|El]."
 spread_personal_tenet_intent_not_valid_desc: "Ya no posees un [personal_tenet|El]"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Desbloquea la [intent|El] #EMP $spread_personal_tenet_intent$#! en [activities|El] con invitados, lo que te permite aumentar la [tenet_popularity|El]"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U] [Select_CString( first.IsLocalPlayer, 'ganas', 'gana' )] a [Select_CString( second.IsLocalPlayer, 'tu persona', second.GetShortUINameNoTooltip )]"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U] [Select_CString( first.IsLocalPlayer, 'ganas', 'gana' )] a [Select_CString( second.IsLocalPlayer, 'tu persona', second.GetShortUINameNoTooltip )]"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nPero lo que me colma el corazón es [spread_tenet.GetBaseName], una creencia que mi propia fe condena. Hablar de ello aquí es poner mi destino en manos de cada uno de los que me escuchan."
 pam_spread_tenet_option_scripture: "Las propias Escrituras hablan por mí."
 pam_spread_tenet_option_preach: "¡Escuchad lo que tengo por verdad!"
 pam_spread_tenet_option_forbidden: "La verdad merece el riesgo. Acercaos."
 pam_spread_tenet_option_decline: "En otra ocasión, tal vez."
 pam_spread_tenet_forbidden_flavor: "No todos los oídos que me prestan atención son amistosos…"
 pam_spread_tenet_overheard_toast: "Oídos hostiles"
 pam_spread_tenet_events.0001.t: "Charla de sobremesa"
 pam_spread_tenet_events.0001.desc: "La mesa rebosa de [ROOT.Char.Custom('GetExpensiveMeal')] de buena calidad, y el salón resuena con brindis y risas.\n\n«Habláis como alguien que ha reflexionado largo y tendido sobre asuntos sagrados», dice [pam_spread_listener_1.Custom('ES_ElLa')] [pam_spread_listener_1.GetTitledFirstName|l], inclinándose hacia las bandejas repletas de [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')]. «Contadme más».\n\nLa mesa se queda en silencio. Un público bien dispuesto, con oídos atentos…"
 pam_spread_tenet_events.0101.t: "En torno al fuego"
 pam_spread_tenet_events.0101.desc: "Un breve respiro en la cacería. Nos sentamos juntos alrededor del fuego, mientras una pieza de [ROOT.Char.Custom('GetRandomRegionalSmallGame')] chisporrotea en el espetón.\n\n«Una persecución como esta dirige el alma hacia asuntos menos mundanos», murmura [pam_spread_listener_1.Custom('ES_ElLa')] [pam_spread_listener_1.GetTitledFirstName|l], sin apartar la mirada de las llamas.\n\nA la luz del fuego y en el silencio, los oídos prestan atención a lo que se dice."
 pam_spread_tenet_events.0201.t: "Entre combates"
 pam_spread_tenet_events.0201.desc: "La liza queda vacía entre un combate y otro. Los escuderos se llevan las lanzas astilladas mientras la multitud busca sombra y charla trivial.\n\n«Cada vencedor da las gracias a [ROOT.Char.GetFaith.HighGodName], y cada perdedor maldice a [ROOT.Char.GetFaith.DevilName]», bromea [pam_spread_listener_1.Custom('ES_ElLa')] [pam_spread_listener_1.GetTitledFirstName|l] a mi lado. «¿Acaso alguno de ellos se pregunta por qué?».\n\nUna pausa, un banco donde se sientan notables ociosos y una pregunta flotando en el aire."
 pam_spread_tenet_events.0301.t: "Un brindis por la convicción"
 pam_spread_tenet_events.0301.desc: "Se alzan copas una tras otra: por los recién casados, por los herederos que han de nacer.\n\n«¡Y por [ROOT.Char.GetFaith.HighGodName], que une a todas las almas!», añade [pam_spread_listener_1.Custom('ES_ElLa')] [pam_spread_listener_1.GetTitledFirstName|l], entre un murmullo de aprobación.\n\nLos corazones aquí están abiertos al amor, a la esperanza, a lo sagrado. Las palabras que se pronuncien ahora echarán raíces."
 pam_spread_tenet_events.0401.t: "Palabras en el velatorio"
 pam_spread_tenet_events.0401.desc: "Los dolientes se reúnen en pequeños grupos, intercambiando palabras amables sobre el difunto y el destino que nos aguarda a todos.\n\n«A todos nos llega nuestra hora», dice [pam_spread_listener_1.Custom('ES_ElLa')] [pam_spread_listener_1.GetTitledFirstName|l] en voz baja a mi lado. «Y, con todo, seguimos discutiendo por tonterías».\n\nEl dolor abre en canal el alma…"
