 PAM_CHALLENGE_HOF_WAR_CB_NAME: "Desafío al [head_of_faith|El]"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "El [challenger_hof|El] al que patrocinas se apodera de los títulos del [head_of_faith|El] y el [attacker.GetRite.GetName|l] se convierte en el [mainline_rite|El]."
 pam_challenge_hof_cb_victory_desc_attacker: "Te apoderas de los títulos del [head_of_faith|El] y el [attacker.GetRite.GetName|l] se convierte en el [mainline_rite|El]."
 pam_challenge_hof_cb_victory_desc: "El [challenger_hof|El] se convierte en [head_of_faith|lE]."
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U] sigue siendo el [head_of_faith|lE]."
 pam_challenge_hof_cb_defeat_desc_attacker: "Tu desafío al [head_of_faith|El] fracasa."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "La guerra ha terminado: el defensor ya no es [head_of_faith|El]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "La guerra ha terminado: ya no hay ningún aspirante a ser cabeza de la fe."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U] [Select_CString(new_hof.IsLocalPlayer, 'te vuelves', 'se vuelve')] [vassal|El] de [Select_CString(sponsor.IsLocalPlayer,'tu personaje', sponsor.GetShortUIName)]"
 PAM_ANTIKING_WAR_CB_NAME: "Derrocamiento del [challenger_hof|El]"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "Eliminas al [challenger_hof|El] de [defender.GetShortUIName] y te ganas la gratitud de [attacker.GetFaith.GetReligiousHead.GetShortUIName]."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "Eliminas al [challenger_hof|El] de [defender.GetShortUIName]"
 pam_antiking_cb_victory_desc: "Se ha depuesto al [challenger_hof|El]."
 pam_antiking_cb_white_peace_desc: "El [challenger_hof|El] persiste."
 pam_antiking_cb_defeat_desc_attacker: "Tu intento de eliminar al [challenger_hof|El] fracasa."
 pam_antiking_cb_defeat_desc: "El [challenger_hof|El] sobrevive."
 msg_pam_antiking_cb_invalidated_message: "La guerra ha terminado: el defensor ya no patrocina a un [challenger_hof|El]."
 pam_humiliation_cb_papabile_score_loss_tt: "La [papabile_score|El] de [Select_CString(defender.IsLocalPlayer,'tu personaje', defender.GetShortUIName)] para la sucesión papal se reduce en #N -25#!"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "La [papabile_score|El] de [Select_CString(attacker.IsLocalPlayer,'tu personaje', attacker.GetShortUIName)] para la sucesión papal se reduce en #N -25#!"
 pam_clerical_disgrace_modifier: "Desgracia clerical"
 pam_clerical_disgrace_modifier_desc: "Este personaje fue humillado en una guerra religiosa, lo que debilitó su [candidate_score|El] para [clerical_titles|El]."
 pam_clerical_disgrace_candidacy_penalty_desc: "Humillación en una guerra religiosa"
 pam_antipope_events.0010.t: "El pretendiente, derribado"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('ES_ElLa')|U] [pam_ch_hof_challenger.GetTitledFirstName|l] [pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')] cismátic[pam_ch_hof_challenger.Custom('ES_OA')] se arrodilla ante mí, despojad[pam_ch_hof_challenger.Custom('ES_OA')] de su falso título de [ROOT.Char.GetFaith.ReligiousHeadTitleName|l].\n\nSiempre desafiante, afirma: «El Arca está allí donde me alzo. No a vuestros pies».\n\nDiríase que su lengua sigue al servicio de Satanás."
 pam_antipope_events.0010.desc: "[pam_ch_hof_challenger.Custom('ES_ElLa')|U] pretendiente, [pam_ch_hof_challenger.Custom('ES_ElLa')] [pam_ch_hof_challenger.GetTitledFirstName|l], se arrodilla ante mí, despojad[pam_ch_hof_challenger.Custom('ES_OA')] de su falso título de [ROOT.Char.GetFaith.ReligiousHeadTitleName|l].\n\nSiempre desafiante, responde: «Soy [pam_ch_hof_challenger.Custom('ES_ElLa')] verdader[pam_ch_hof_challenger.Custom('ES_OA')] [ROOT.Char.GetFaith.ReligiousHeadName|l]»."
 pam_antipope_events.0010.a.christian: "Una celda le hará tan penitente como Jonás."
 pam_antipope_events.0010.a: "Encerrad[pam_ch_hof_challenger.GetHerHim]."
 pam_antipope_events.0010.b.christian: "Ejecutad[pam_ch_hof_challenger.GetHerHim]. El Señor reconoce a los suyos."
 pam_antipope_events.0010.b: "Ejecutad[pam_ch_hof_challenger.GetHerHim]. [ROOT.Char.GetFaith.HighGodName] juzgará lo demás."
 pam_antipope_events.0010.c: "Mostrar clemencia."
 pam_antipope_events.0010.d: "Gritará el nombre de quien es de verdad [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_challenge_hof_war_random_permanent_harm_tt: "Sufre una herida permanente al azar"
 pam_antipope_events.0011.t: "El precio del patronazgo"
 pam_antipope_events.0011.desc.christian: "La bolsa [pam_ch_hof_sponsor.Custom('ES_DelDela')] [pam_ch_hof_sponsor.GetTitledFirstName|l] impulsó esta ruptura maligna al elevar a un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetFaith.ReligiousHeadName|l] rival contra el [ROOT.Char.GetRite.GetName|l].\n\nLas Escrituras no son amables con tales patrones: [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.GetSheHe|U] alza la mirada, desafiante hasta el fin: «No sois [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetFaith.ReligiousHeadName|l], sino [Select_CString(ROOT.Char.IsFemale, 'una monja falsaria', 'un monje falsario' )]. Bajad, bajad, junto a los condenados para toda la eternidad»."
 pam_antipope_events.0011.desc: "El oro [pam_ch_hof_sponsor.Custom('ES_DelDela')] [pam_ch_hof_sponsor.GetTitledFirstName|l] elevó a un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetFaith.ReligiousHeadName|l] rival para dividir a los [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip].\n\n[pam_ch_hof_sponsor.GetSheHe|U] alza la mirada: «No sois [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetFaith.ReligiousHeadName|l]. Sois un[ROOT.Char.Custom('ES_XA')] farsante»."
 pam_antipope_events.0011.a: "Embargad la bolsa que impulsó esto."
 pam_antipope_events.0011.b: "Ejecutad[pam_ch_hof_sponsor.GetHerHim]. La aceptación tiene un precio."
 pam_antipope_events.0011.c: "La vergüenza sobre su casa es bastante castigo."
 pam_antipope_events.0011.d: "Azotad[pam_ch_hof_sponsor.GetHerHim] hasta que la carne ceda."
 pam_romans_1_32_english: "Los que hacen estas cosas son dignos de muerte; no solo las practican, sino que incluso aprueban a los que las hacen."
 ROMANS_1_32_GLOSS: "#weak Romanos 1:32, SBCEE#!"
 pam_antipope_events.0012.t: "Juicio a los depuestos"
 pam_antipope_events.0012.t.christian: "Una sentencia para el soldado de Satanás"
 pam_antipope_events.0012.intro.christian: "El [ROOT.Char.GetRite.GetName|l] responde ante mí. [pam_ch_hof_old_hof.Custom('ES_ElLa')|U] fals[pam_ch_hof_old_hof.Custom('ES_OA')] [ROOT.Char.GetFaith.ReligiousHeadName|l], [pam_ch_hof_old_hof.Custom('ES_ElLa')] [pam_ch_hof_old_hof.GetTitledFirstName|l], se arrodilla a mis pies."
 pam_antipope_events.0012.intro: "Los [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] responden ante mí. [pam_ch_hof_old_hof.Custom('ES_ElLa')|U] fals[pam_ch_hof_old_hof.Custom('ES_OA')] [ROOT.Char.GetFaith.ReligiousHeadName|l], [pam_ch_hof_old_hof.Custom('ES_ElLa')] [pam_ch_hof_old_hof.GetTitledFirstName|l], se arrodilla a mis pies."
 pam_antipope_events.0012.intro.sponsor: "Mi [ROOT.Char.GetFaith.ReligiousHeadName|l] [pam_ch_hof_new_hof.GetFirstName] está sentad[pam_ch_hof_new_hof.Custom('ES_OA')] en el trono. [pam_ch_hof_old_hof.Custom('ES_ElLa')|U] pretendiente, [pam_ch_hof_old_hof.Custom('ES_ElLa')] [pam_ch_hof_old_hof.GetTitledFirstName|l], se arrodilla ante mí."
 pam_antipope_events.0012.dialogue.christian: "\n\nSiempre desafiante, [pam_ch_hof_old_hof.GetSheHe] escupe: «Habéis tomado el trono de la paz con la espada».\n\n«El Señor vio apropiado darme las herramientas necesarias para llevar a cabo Su plan», replico."
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.GetSheHe|U] dice: «Lo tomasteis por la espada».\n\n«Y por la espada lo mantengo», replico."
 pam_antipope_events.0012.a: "Una celda enfriará este orgullo."
 pam_antipope_events.0012.b: "Dos cabezas crean un monstruo; una debe desaparecer."
 pam_antipope_events.0012.c: "Ya ha habido bastante discordia. Dejemos que se vaya en paz."
 pam_antipope_events.0012.d: "Gritará el nombre de quien es de verdad [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_antipope_events.0014.t: "Juicio sobre mí"
 pam_antipope_events.0014.intro.judge: "«Eximo a los [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] de toda obediencia a vos», dice [pam_ch_hof_judge.Custom('ES_ElLa')] [pam_ch_hof_judge.GetTitledFirstName|l]."
 pam_antipope_events.0014.intro.mercy.christian: "«Id y no pequéis más», dice [pam_ch_hof_judge.Custom('ES_ElLa')] [pam_ch_hof_judge.GetTitledFirstName|l]."
 pam_antipope_events.0014.intro.mercy: "«Id y no volváis a este camino», dice [pam_ch_hof_judge.Custom('ES_ElLa')] [pam_ch_hof_judge.GetTitledFirstName|l]."
 pam_antipope_events.0014.desc.condemned.christian: "\n\nAmé la justicia y odié la iniquidad, por eso muero."
 pam_antipope_events.0014.desc.condemned: "\n\nMuero por aquello que creo."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.GetSheHe|U] y sus hombres se ríen de mí mientras azotan mi cuerpo. Pero no soy más que un cascarón, el grano ya ha sido trillado."
 pam_antipope_events.0014.desc.captive.christian: "\n\nMe dieron una celda. Siempre me han dicho que una celda es suficiente para [Select_CString(ROOT.Char.IsFemale, 'una mujer santa', 'un hombre santo' )]."
 pam_antipope_events.0014.desc.captive: "\n\nMe dieron una celda. Es todo lo que se me permite."
 pam_antipope_events.0014.desc.spared.christian: "\n\nParece que las piedras se quedarán en sus manos y que puedo marchar libre. No desaprovecharé esta clemencia."
 pam_antipope_events.0014.desc.spared: "\n\nParece que puedo marchar libre. No desaprovecharé esta clemencia."
 pam_antipope_events.0014.desc.generic: "\n\nSe ha dictado sentencia. Lo que pase a continuación me corresponde a mí."
 pam_antipope_events.0014.a: "Que se recuerde mi casa como fiel a [ROOT.Char.GetFaith.HighGodName]."
 pam_antipope_events.0014.b: "Sus manos no quedarán limpias."
 pam_antipope_events.0014.b.toast: "Te has manchado de [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName|l]"
 pam_antipope_events.0014.c: "Proteger a mi casa de esta humillación."
 pam_antipope_events.0014.d: "Haré las paces con quien de verdad es [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_antipope_events.0014.e: "La villanía que [pam_ch_hof_judge.Custom('ES_ElLa')] [pam_ch_hof_judge.GetTitledFirstNameNoTooltip|l] me enseñó, la llevaré a cabo."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "Caminaré descalz[ROOT.Char.Custom('ES_OA')] hasta haber cumplido mi penitencia."
 pam_antipope_events.0015.opening: "[ROOT.Char.Custom('ES_AlAla')|U] [ROOT.Char.GetTitledFirstNameNoTooltip|l] de fe [ROOT.Char.GetFaith.GetAdjectiveNoTooltip],"
 pam_antipope_events.0015.desc.defender_victory.christian: "Sabed que el desafío cismático al/a la [ROOT.Char.GetFaith.ReligiousHeadName|l] ha sido aplastado. El mandato del pretendiente ha sido destruido y el [ROOT.Char.GetRite.GetName|l] se mantiene firme. Que ningún príncipe ni prelado dude de a quién le deben lealtad."
 pam_antipope_events.0015.desc.defender_victory: "Sabed que el desafío al/a la [ROOT.Char.GetFaith.ReligiousHeadName|l] ha sido aplastado. El mandato del pretendiente ha sido destruido y el [ROOT.Char.GetRite.GetName|l] se mantiene firme. Que ningún gobernante dude de a quién le debe lealtad."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Sabed que la guerra por el/la [ROOT.Char.GetFaith.ReligiousHeadTitleName|l] ha terminado. He liberado la sede del yugo de Satanás y el [ROOT.Char.GetRite.GetName|l] seguirá mis órdenes."
 pam_antipope_events.0015.desc.attacker_victory: "Sabed que la guerra por el/la [ROOT.Char.GetFaith.ReligiousHeadTitleName|l] ha terminado. Yo ocupo la sede y los [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] me siguen. Que los fieles sepan que reina un[ROOT.Char.Custom('ES_XA')] nuev[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetFaith.ReligiousHeadName|l]."
 pam_antipope_events.0015.a: "Que así sea."
