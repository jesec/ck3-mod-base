l_spanish:
 pam_clergy_events.0001.t: "Quo nomine vis vocari?"
 pam_clergy_events.0001.desc: "Mi [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] se vuelve a la siguiente línea en blanco del registro de los sucesores de san Pedro, un testimonio vivo de la [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )|l].\n\n#emp «El nombre que elijáis sobrevivirá vuestro reinado mil generaciones».#! \n\nSu pluma indica el lugar donde irá la tinta.\n\n#emp «Quo nomine vis vocari?».#!"
 pam_clergy_events.0001.a: "Que se conozca para la eternidad."
 pam_clergy_events.0003.t: "Un dogma rehecho"
 pam_clergy_events.0003.desc: "Un dogma principal del [pam_recast_rite.GetNameNoTooltip|l] ha cambiado bajo [pam_recast_pope.Custom('ES_ElLa')] [pam_recast_pope.GetTitledFirstName|l]: [tenet_to_remove.GetBaseName|l] da paso a [tenet_to_add.GetBaseName|l]."
 pam_clergy_events.0010.t: "La voluntad [actor.Custom('ES_DelDela')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]"
 pam_clergy_events.0010.desc.intro: "Como [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l], soy una extensión de la voluntad [actor.Custom('ES_DelDela')] sant[actor.Custom('ES_OA')] [actor.Custom('GetMotherFather')].\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))], a quien respeto por encima de todos los demás, guía mi mano en mis deberes como [cardinalate.GetHolder.GetTitleAsNameNoTooltip|l].\n\n"
 pam_clergy_events.0010.desc: "En su infinita sabiduría, [actor.Custom('ES_ElLa')] [actor.GetTitledFirstName|l] ha entendido que debo dedicarme"
 pam_clergy_events.0010.desc.develop: "al desarrollo de las obras públicas para la prosperidad de todos los [recipient.GetFaith.GetAdherentNamePlural] de [archdiocese.GetName]."
 pam_clergy_events.0010.desc.convert_faith: "a una misión para impulsar la conversión de los [ROOT.Char.Custom('GetUnbelieverNamePlural')] en [archdiocese.GetName] y sus cercanías."
 pam_clergy_events.0010.desc.increase_control: "a una misión para pacificar al populacho de [archdiocese.GetName]."
 pam_clergy_events.0010.desc.cultural_fascination: "a una misión para acelerar la investigación de nueva tecnología para su gente, los [actor.GetCulture.GetCollectiveNoun]."
 pam_clergy_events.0010.desc.epidemic_resistance: "a poner en orden los recursos de la Iglesia para ayudar a mitigar la peste en [archdiocese.GetName]."
 pam_clergy_events.0010.desc.improve_legitimacy: "a una misión para reforzar la legitimidad de toda monarquía [recipient.GetFaith.GetAdjective] en [archdiocese.GetName]."
 pam_clergy_events.0010.desc.undermine_legitimacy: "a una misión para socavar la legitimidad de toda monarquía [recipient.GetFaith.GetAdjective] en [archdiocese.GetName]."
 pam_clergy_events.0010.a: "«¡Lo haré, [actor.Custom('FormOfAddressForLiege')]!»."
 pam_clergy_events.0010.b: "Los diezmos se podrían gastar mejor…"
 pam_clergy_events.0030.t: "Habemus papam"
 pam_clergy_events.0030.t.female: "Habemus mamam"
 pam_clergy_events.0030.desc: "Una humareda blanca anuncia [Select_CString(new_pope.IsFemale, 'a la nueva', 'al nuevo' )] [new_pope.GetTitledFirstName|l] en el centro de [new_pope.GetCurrentLocation.GetName]:\n\n«Que los santos apóstoles Pedro y Pablo en cuyo poder y autoridad confiamos, intercedan por nosotros ante el Señor. Y que la bendición de Dios Todopoderoso, Padre, Hijo y Espíritu Santo descienda sobre vosotros y siga con vosotros para siempre».\n\n«Amén»."
 pam_clergy_events.0030.a: "Gloria al trono de san Pedro."
 pam_clergy_events.0030.b: "Parece que ha aparecido un falso profeta."
 pam_clergy_events.0030.b.tt: "La [decision|El] [GetDecisionWithKey('declare_antipope_decision').GetName] sale más barata durante #V 15 años#!"
 pam_clergy_events.0030.aa: "¿A quién le importan los asuntos de la Iglesia?"
 pam_clergy_events.0030.aa.tt: "Los siguientes eventos de Habemus papam aparecerán como mensajes"
 pam_clergy_events.0030.feed: "Se ha elegido [head_of_faith|El] [new_pope.Custom('ES_AlAla')] [new_pope.GetTitledFirstName|l]."
 pam_clergy_events.0040.opening: "[ROOT.Char.Custom('ES_AlAla')|U] piados[ROOT.Char.Custom('ES_OA')] [head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)],"
 pam_clergy_events.0040.desc: "Con el santo Colegio reducido, he considerado justo elevaros al cardenalato. Que vuestra piedad y sabiduría refuercen la Iglesia en esta hora de necesidad."
 pam_clergy_events.0040.appoint_tt: "Se te nombra [Concept('cardinal',Select_CString(ROOT.Char.IsFemale,'cardenala', 'cardenal'))|E]"
 pam_clergy_events.0040.a: "Acepto esta carga sagrada."
 pam_clergy_events.0041.opening: "A la sede de san Pedro,"
 pam_clergy_events.0041.desc: "El Colegio Cardenalicio se encuentra incompleto y aún no habéis llenado los asientos vacantes por nuestr[ROOT.Char.Custom('ES_OA')]s [ROOT.Char.GetWomenMen] más piados[ROOT.Char.Custom('ES_OA')]s.\n\n¡No dejaré desprotegida a la Iglesia! Asumiré el bonete rojo personalmente."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U] se proclama [Concept('cardinal',Select_CString(cardinal_candidate.IsFemale,'cardenala', 'cardenal'))|E]"
 pam_clergy_events.0041.a: "No olvidaremos tal insolencia."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "Los asientos del Colegio permanecen vacíos y la Iglesia no puede esperar a ceremonias. Varios de nuestros miembros más piadosos han tomado el capelo rojo y el Colegio vuelve a estar completo.\n\nConfiamos en que perdonaréis nuestro apresuramiento."
 pam_clergy_events.0042.a: "Un Colegio lleno me sirve mejor que uno vacío."
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "Un cambio sísmico en la fe"
 pam_clergy_events.0051.desc: "Mi asiento en [county.GetNameNoTier|U] tiembla debajo de mí. Las almas a cuyo servicio había dedicado mi vida ahora oran como [new_faith.GetAdherentNamePlural].\n\n¿Me convierto y conservo el control? Podría preocuparme por el pueblo de [title.GetName], pero ¿puedo ayudar de modo significativo a aquellos que ya no son [old_faith.GetAdherentNamePlural]? ¡¿Puede salir algo bueno de que se nos obligue a practicar el [new_faith.GetNameNoTooltip|l]?!"
 pam_clergy_events.0051.a: "Lo que sea necesario para servir a mi rebaño."
 pam_clergy_events.0051.a.keep_see_tt: "Conservas el control sobre [title.GetName]"
 pam_clergy_events.0051.b: "Solo puedo servir a otros [old_faith.GetAdherentNamePluralNoTooltip]."
 pam_clergy_events.0051.b.tt: "Todos tus [titles|lE] [Concept( 'landed', 'con tierras' )|E] son destruidos"
 pam_clergy_events.0051.c: "Acepto el fin de mi cargo."
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Levantarás un [camp|El] [adventurer|El]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER Es [game_over|El] para ti#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "El fin de [title.GetNameNoTooltip]"
 pam_clergy_events.0052.desc: "Sin importar cómo ocurriera, ya no puedo guiar a [title.GetDefinitiveName]. Lo que la Iglesia puso en el pasado en mis manos ahora sale de ellas."
 pam_clergy_events.0052.a: "Así sea."
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "Un[new_prelate.Custom('ES_XA')] [new_prelate.GetDynasty.GetNameNoTooltip] en el trono de San Pedro"
 pam_clergy_events.0060.t.head_of_faith: "Un[new_prelate.Custom('ES_XA')] [new_prelate.GetFaith.ReligiousHeadName|l] [new_prelate.GetDynasty.GetNameNoTooltip]"
 pam_clergy_events.0060.t.antipope: "Un[new_prelate.Custom('ES_XA')] [new_prelate.GetDynasty.GetNameNoTooltip] reclama el título de [new_prelate.GetFaith.ReligiousHeadTitleName|l]"
 pam_clergy_events.0060.t.archbishop: "Un[new_prelate.Custom('ES_XA')] [new_prelate.GetDynasty.GetNameNoTooltip] toma el báculo"
 pam_clergy_events.0060.desc.intro: "Habíamos buscado guiar a la cristiandad, ya fuera desde el trono o desde el púlpito. Ahora [new_prelate.GetFaith.HighGodName|U] ha visto apropiado elevar a los [new_prelate.GetDynasty.GetName] a nuevas cotas.\n\n"
 pam_clergy_events.0060.desc.pope: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] ha sido elevad[new_prelate.Custom('ES_OA')] al trono de San Pedro, vicari[new_prelate.Custom('ES_OA')] [new_prelate.GetFaith.HighGodNamePossessive] en la Tierra."
 pam_clergy_events.0060.desc.head_of_faith: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] posee [prelate_title.GetDefinitiveName]."
 pam_clergy_events.0060.desc.hof_outro: "Reyes y emperadores no son más que niños a la sombra de la voluntad de su sant[new_prelate.Custom('ES_OA')] [new_prelate.Custom('GetMotherFather')]. Un ejército de [new_prelate.GetFaith.BishopMalePlural] ahora está a las órdenes de un[new_prelate.Custom('ES_XA')] [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] ha sido proclamad[new_prelate.Custom('ES_OA')] [new_prelate.GetFaith.ReligiousHeadName|l] mientras hay otra persona en el trono. Todo [new_prelate.GetFaith.GetAdherentName] ahora debe elegir quién es [new_prelate.Custom('ES_ElLa')] representante de [new_prelate.GetFaith.HighGodName|U]. Hasta que se solucione, nuestras almas están en peligro."
 pam_clergy_events.0060.desc.archbishop: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] ha sido investid[new_prelate.Custom('ES_OA')] con [prelate_title.GetDefinitiveName]. Diezmos, abadías y la consagración de todo nuevo [new_prelate.GetFaith.BishopNeuter] por debajo de [new_prelate.GetSheHe] ahora están guiados por un[new_prelate.Custom('ES_XA')] [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\nSu nueva fe es el [new_prelate.GetFaith.GetNameNoTooltip|l] y no el [ROOT.Char.GetFaith.GetNameNoTooltip|l], pero somos familia igual."
 pam_clergy_events.0060.a: "Una bendición para la Iglesia y los [new_prelate.GetDynasty.GetNameNoTooltip] por igual."
 pam_clergy_events.0060.a.antipope: "Yo no tengo que heredar su disputa."
 pam_clergy_events.0060.b: "Me gustaría echarle un vistazo más detenido a [prelate_title.GetDefinitiveNameNoTooltip]."
 pam_clergy_events.0060.b.antipope: "Solo yo puedo solucionar la crisis."
 pam_clergy_events.0060.b.tt: "@warning_icon! Abandonarás a tu personaje actual y no podrás volver a jugar con él luego.\n\n#TUT Cuando [new_prelate.GetShortUINameNoTooltip] muera, jugarás como tu [player_heir|El], quien heredará el cargo [ecclesiastical|El] por [appointment|El] o elección, pero no por sucesión [Concept('dynasty', 'dinástica')|E].#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.Custom('ES_ElLa')|U] [new_prelate.GetTitledFirstName|l] no comparte tu fe. Continuarías como [new_prelate.GetFaith.GetAdherentName]."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.Custom('ES_ElLa')|U] [new_prelate.GetTitledFirstName|l] ocupa el cargo más por desafío que por elección. Todos los que rechacen su reclamación vendrán a por el cargo."
