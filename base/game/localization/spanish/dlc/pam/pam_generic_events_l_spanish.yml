l_spanish:
 pam_generic_events.0001.t: "Erudito de la fe"
 pam_generic_events.0001.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )] [chaplain.GetFirstName] parece haberse inmerso en la lectura cuando entro en mi [ROOT.Char.GetFaith.HouseOfWorship].\n\n«Ah, [ROOT.Char.Custom('FormOfAddressForLiege')]», dice cuando al fin se da cuenta de mi presencia. «¿Ha aumentado vuestro interés por la palabra de [ROOT.Char.GetFaith.HighGodName]? Puedo enseñaros su camino»."
 pam_generic_events.0001.a: "Un trabajo que merece la pena."
 pam_generic_events.0001.b: "Gobernar ya precisa toda mi atención."
 pam_generic_events.0002.t: "¿Soy buen[doubting_child.Custom('ES_OA')]?"
 pam_generic_events.0002.desc.intro: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', doubting_child )], [doubting_child.GetFirstName], se cuela en mis aposentos mucho después de que las velas se hayan apagado. Lágrimas recorren sus mejillas.\n\n«¿Soy una buena persona?», susurra. «Si ser como soy es un pecado…"
 pam_generic_events.0002.desc.sin: "tan #EMP repulsivamente#! [sinful_trait.GetName( ROOT.Char )|l]…"
 pam_generic_events.0002.desc.sp: "si mi alma se siente tan vacía…"
 pam_generic_events.0002.desc.outro: "¿cómo puede seguir queriéndome [ROOT.Char.GetFaith.HighGodName]?»."
 pam_generic_events.0002.a: "Líbrate de lo que te avergüenza."
 pam_generic_events.0002.b: "Ya se te quiere."
 pam_generic_events.0002.c: "Recemos entonces."
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName] [Select_CString( CHARACTER.IsLocalPlayer, 'consolaste', 'consoló' )] a [TARGET_CHARACTER.GetShortUIName] cuando dudó de su propia bondad."
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'consolaste', 'consoló' )] a [CHARACTER.GetShortUIName] cuando dudó de su propia bondad."
 pam_generic_events.0003.t: "Lo que eres"
 pam_generic_events.0003.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', worried_spouse )], [worried_spouse.GetFirstName], me espera después del anochecer entre los setos. Sus manos se crispan en su regazo.\n\n«Eres tan #EMP [sinful_trait.GetName( ROOT.Char )|l]#!», dice en voz baja. «Nos avergüenza a [Select_CString(And(ROOT.Char.IsFemale, worried_spouse.IsFemale), 'ambas', 'ambos')] ante [ROOT.Char.GetFaith.HighGodName]. ¿Cómo puede importarte tan poco tu fe? ¿No ves lo que te hace?»."
 pam_generic_events.0003.a: "¿Por ti? Haré enmienda."
 pam_generic_events.0003.b: "Así me ha hecho [ROOT.Char.GetFaith.HighGodName]."
 pam_generic_events.0003.c: "Te preocupas demasiado."
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'prometiste', 'prometió' )] a [TARGET_CHARACTER.GetShortUIName] hacer enmienda y salir en peregrinación."
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'prometiste', 'prometió' )] a [CHARACTER.GetShortUIName] hacer enmienda y salir en peregrinación."
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUIName|U] se negó a arrepentirse cuando [TARGET_CHARACTER.GetShortUIName] [Select_CString( CHARACTER.IsLocalPlayer, 'te', 'le' )] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'suplicaste', 'suplicó' )] que cambiara."
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se negó a arrepentirse cuando [CHARACTER.GetShortUIName] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'te', 'le' )] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'suplicaste', 'suplicó' )] que cambiara."
 pam_generic_events.0004.t: "Una luz en la oscuridad"
 pam_generic_events.0004.desc: "El reciento de [ROOT.Char.GetFaith.HouseOfWorship] está completamente vacío. Una neblina se alza en espiral entre las columnas y las velas parpadean en torno al recuerdo de mi [ROOT.Char.Custom2( 'RelationToMeShort', deceased )], [deceased.GetFirstName], que [deceased.GetDeathReasonHideKiller].\n\nMi [ROOT.Char.Custom2( 'RelationToMeShort', comforter )], [comforter.GetFirstName], se sienta tan cerca que su manga roza la mía. «El duelo es un camino», dice con dulzura. «Recorredlo y tal vez encontréis [ROOT.Char.GetFaith.PositiveAfterLife] al final»."
 pam_generic_events.0004.a: "¡Fui yo! ¡#EMP Yo#! lo hice!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP En la casa de mi Padre hay muchas moradas.#!"
 JOHN_14_2_GLOSS: "#weak Juan 14:2, SBCEE#!"
 pam_generic_events.0004.c: "Recemos entonces."
 pam_generic_events.0004.d: "Venid. Beberemos por su recuerdo."
 pam_generic_events.0005.t: "Un puño leal"
 pam_generic_events.0005.desc: "«¡¿Cómo #EMP osa#!?!».\n\nMi [ROOT.Char.Custom2( 'RelationToMeShort', loyal_vassal )], [loyal_vassal.Custom('ES_ElLa')] [loyal_vassal.GetTitledFirstName|l], recorre la cámara del consejo con la espada a medio desenvainar.\n\n«¿Cómo osa [clerical_holder.Custom('ES_ElLa')] [clerical_holder.GetTitledFirstName|l] a dejaros fuera?». [loyal_vassal.GetFirstNameNoTooltip] escupe al suelo. «Tengo hombres en [clerical_region.GetName]. Decid una palabra y le haremos una visita»."
 pam_generic_events.0005.a: "Sea, id."
 pam_generic_events.0005.a.tt: "[loyal_vassal.Custom('ES_ElLa')|U] [loyal_vassal.GetTitledFirstName|l] viajará a [clerical_holder.GetCapitalLocation.GetName]. A su regreso, ganarás [dread|El] y [opinion|El] de tus [Concept('vassal', 'vasallos')|E] de tipo [GetVassalStance('belligerent').GetName|l] [GetVassalStance('belligerent').GetTextIcon]."
 pam_generic_events.0005.b: "Hay métodos más inteligentes."
 pam_generic_events.0005.b.tt: "Ganas una bonificación #P enorme#! para las [schemes|El] de [GetScheme('murder').GetTypeName|l] dirigidas contra [clerical_holder.GetShortUIName] durante #V 15 años#!"
 pam_generic_events.0005.c: "Se me ha enseñado a poner la otra mejilla."
 pam_generic_events.0005.c.tt: "La [character_interaction|El] #V $declaration_of_repentance_interaction$#! aumenta su aceptación en #P +20#! durante #V 10 años#!"
 pam_generic_events.0005.c.tt2: "Hay más probabilidades de que se use contra ti la [character_interaction|El] #V $lift_excommunication_interaction$#! en los próximos #V 10 años#!"
 pam_turned_the_other_cheek_accept_reason: "Puso la otra mejilla"
 PAM_GENERIC_0005_MURDER_BONUS: "Un vasallo leal tiene hombres en el dominio de este objetivo: $VALUE|+0=$"
 pam_generic_events.0007.opening: "[ROOT.Char.Custom('ES_AlAla')] [ROOT.Char.GetTitledFirstName|l]"
 pam_generic_events.0007.desc: "La obra está hecha. Encontré [clerical_holder.Custom('ES_AlAla')] [clerical_holder.GetTitledFirstName|l] y [clerical_holder.GetHerHim] dejé sangrando."
 pam_generic_events.0007.a: "Bien."
 pam_generic_events.0008.t: "Una voz en la oscuridad"
 pam_generic_events.0008.desc: "La cena reposa pesada en mi tripa mientras camino a tumbos hacia la alcoba. La vista se me nubla y el pasillo se ladea.\n\nY entonces… una voz. «Qué [ROOT.Char.GetTitleAsNameNoTooltip|l] tan [virtuous_trait.GetName( ROOT.Char )|l]…», dice. «Cuánta virtud. Agradáis a vuestro señor».\n\n¿De verdad es [ROOT.Char.GetFaith.HighGodName]? ¿O solo es el malestar que siento?"
 pam_generic_events.0008.a: "Sí. #EMP ¡Sí!#!"
 pam_generic_events.0008.b: "¡Tiene que ser Él!"
 pam_generic_events.0008.c: "Los antiguos poderes se agitan…"
 pam_generic_events.0008.d: "A veces la comida tiene estos efectos."
 pam_generic_events.0008.e: "Será… ¿será algo que he comido?"
 pam_generic_events.0008.f: "Mejor rezar algo por si acaso."
 pam_generic_events.0009.t: "Las llamas del infierno"
 pam_generic_events.0009.desc: "Despierto empapad[ROOT.Char.Custom('ES_OA')]; el corazón martillea contra mis costillas.\n\nEn mi sueño, ardía. La carne se fundía de mis huesos como si fuera mantequilla. «¡[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]! ¡[sinful_trait.GetNameNoTooltip( ROOT.Char )|U]!», me gritaba una horda de demonios.\n\nLas llamas de mi [ROOT.Char.GetFaith.NegativeAfterLife] me reclamaban y todos los gritos eran míos."
 pam_generic_events.0009.a: "El flagelo conoce el camino."
 pam_generic_events.0009.b: "Responderé a la carne con carne."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Lavaos las manos, pecadores; purificad el corazón, los inconstantes.#!"
 JAMES_4_8_GLOSS: "#weak Santiago 4:8, SBCEE#!"
 pam_generic_events.0009.d: "Hablar con [comforting_courtier.Custom('ES_ElLa')] [comforting_courtier.GetTitledFirstName|l] siempre ayuda."
 pam_generic_events.0009.e: "Un sueño solo es un sueño."
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'buscaste', 'buscó' )] consuelo en [TARGET_CHARACTER.GetShortUIName] tras una pesadilla de condenación."
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.LocalPlayerString( 'buscaste', 'buscó' )] consuelo en [CHARACTER.GetShortUIName] tras una pesadilla de condenación."
 pam_generic_events.0010.t: "Caza bendecida"
 pam_generic_events.0010.desc: "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')|U] se abren ante nuestros ojos. El sonido atronador de decenas de caballos al galope pronto les sigue, con [hunting_ruler.GetName] orgullosamente al frente.\n\n#EMP «¡Soooo!».#! Alza una mano a modo de saludo y hace parar a su séquito. «¡Alabemos a [ROOT.Char.GetFaith.HighGodName] por este tiempo!», declara, «¡y por las presas que vamos a cazar!»."
 pam_generic_events.0010.a: "Un consejo, si lo queréis…"
 pam_generic_events.0010.b: "Tenéis una vista tan aguda como afilada es vuestra lanza."
 pam_generic_events.0010.b.success: "Tu halago es bien recibido"
 pam_generic_events.0010.b.failure: "Tu halago fracasa"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.GetFirstNameNoTooltip] se toma tu halago a pecho"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.GetFirstNameNoTooltip] se irrita por tu adulación hueca"
 pam_generic_events.0010.b.tt: "Es más probable que [hunting_ruler.Custom('ES_ElLa')] [hunting_ruler.GetTitledFirstName|l] acepte la [character_interaction|El] #high $negotiate_alliance_interaction$#! durante #V 10 años#!"
 pam_generic_events.0010.c: "¡Alabemos, sí!"
 pam_generic_events.0010.d: "Prestadme algunos de vuestros jinetes para el camino."
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'alabaste', 'alabó' )] la habilidad de [TARGET_CHARACTER.LocalPlayerString( 'tu personaje', TARGET_CHARACTER.GetShortUIName )] en la caza."
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'alabaste', 'alabó' )] la habilidad de [CHARACTER.LocalPlayerString( 'tu personaje', CHARACTER.GetShortUIName )] en la caza."
 pam_praised_hunting_alliance_accept_reason: "Alabó mi cacería"
 pam_generic_events.0011.t: "Un punto de pecado"
 pam_generic_events.0011.desc: "Los actos pecaminosos [sinful_courtier.Custom('ES_DelDela')] [sinful_courtier.GetTitledFirstName|l] se llevan produciendo desde hace demasiado. Mi corte bulle de rumores sobre su comportamiento [sinful_trait.GetName( ROOT.Char )|l] y he visto a sirvientes echarse atrás cuando [sinful_courtier.GetSheHe] pasa.\n\n«¡[ROOT.Char.Custom('FormOfAddressForLiege')|U]!», exclama cuando entro en el estudio [sinful_courtier.Custom('quirk_neg_pp')]. «Qué honor estar en vuestra presencia»."
 pam_generic_events.0011.a: "Abandonaréis vuestro proceder [sinful_trait.GetNameNoTooltip( ROOT.Char )|l]."
 pam_generic_events.0011.b: "Escuchad las lecciones que [ROOT.Char.GetFaith.HighGodName] nos enseña."
 pam_generic_events.0011.b.success: "La lección cala"
 pam_generic_events.0011.b.failure: "Rechaza la enseñanza"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.GetFirstNameNoTooltip] comprende el peso de su pecado"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.GetFirstNameNoTooltip] se encoge de hombros ante tu lección"
 pam_generic_events.0011.c: "Esto no es bueno para vos…"
 pam_generic_events.0011.c.success: "Un consejo gentil [sinful_courtier.GetHerHim] ablanda"
 pam_generic_events.0011.c.failure: "Tu gentileza solo obtiene desdén"
 pam_generic_events.0011.c.toast.success: "A [sinful_courtier.GetFirstNameNoTooltip] le conmueve tu preocupación"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.GetFirstNameNoTooltip] toma tu amabilidad por debilidad"
 pam_generic_events.0011.d: "A lo mejor no es tan grave."
