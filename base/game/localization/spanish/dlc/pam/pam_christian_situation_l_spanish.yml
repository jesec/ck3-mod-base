 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "Hasta qué punto han empujado los actos de división entre [GetRiteByKey('roman_rite').GetAdherentNamePlural] y [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] a la cristiandad hacia el [Concept( 'schism', 'Gran Cisma')|E].\n\nUna vez que se acumulan suficientes agravios, la Iglesia se puede acabar dividiendo. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon!#alert_trial El [GetFaithByKey( 'christian_faith').GetName|l] no puede crear un [head_of_faith|El] hasta que el [Concept( 'schism', 'Gran Cisma')|E] tenga lugar o se impida#!\n\n#help Aumenta por:\n$BULLET_WITH_TAB$Una votación en un [GetActivityType('activity_ecumenical_council').GetName|l] elimina un [core_tenet|El] o [doctrine|El] de los [rites|El]\n$BULLET_WITH_TAB$Una disputa entre los dos ritos antes de los debates de un [GetActivityType('activity_ecumenical_council').GetName|l]\n$BULLET_WITH_TAB$Una [war|El] entre [kings|El] o superiores de los dos ritos que pertenezcan a [GetSituation('the_christian_church').GetName|l]\n$BULLET_WITH_TAB$El [holy_site|El] de un rito se convierte al otro\n$BULLET_WITH_TAB$Se degrada un [holy_site|El] de cualquiera de los ritos\n$BULLET_WITH_TAB$Un [head_of_rite|El] es asesinado por el otro rito#!"
