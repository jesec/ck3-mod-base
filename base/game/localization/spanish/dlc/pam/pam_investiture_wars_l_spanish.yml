l_spanish:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Conflicto de las investiduras"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "Tu victoria obliga a [defender.GetShortUIName] y a su bando a aceptar tu postura respecto a los nombramientos del clero."
 pam_investiture_conflict_cb_victory_desc_defender: "La victoria de [attacker.GetShortUIName] te obliga a ti y a tus partidarios a aceptar su postura sobre los nombramientos del clero."
 pam_investiture_conflict_cb_victory_desc: "Se impone [attacker.GetShortUIName], lo que obliga a [defender.GetShortUIName] y a su bando a aceptar la postura de [attacker.GetShortUIName] sobre los nombramientos del clero."
 pam_investiture_conflict_cb_white_peace_desc: "La disputa sobre los nombramientos del clero termina sin resolución: no ha cedido ninguna de las partes."
 pam_investiture_conflict_cb_defeat_desc_attacker: "Tu derrota te obliga a ti y a tus partidarios a aceptar la postura de [defender.GetShortUIName] sobre los nombramientos del clero."
 pam_investiture_conflict_cb_defeat_desc_defender: "Te impones, lo que obliga a [attacker.GetShortUIName] y a su bando a aceptar tu postura respecto a los nombramientos del clero."
 pam_investiture_conflict_cb_defeat_desc: "Se impone [defender.GetShortUIName], lo que obliga a [attacker.GetShortUIName] y a su bando a aceptar la postura de [defender.GetShortUIName] respecto a los nombramientos del clero."
 msg_pam_investiture_conflict_cb_invalidated_message: "La [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName|l] ha terminado; el conflicto de las investiduras ya no es válido."
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "Aún #EMP no#! se ha convocado el concilio sobre las investiduras"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "Te obligan a ceder"
 pam_investiture_conflict_forced_stance_tt: "Te derrotan en el conflicto de las investiduras y no tienes más remedio que aceptar la postura del vencedor sobre los nombramientos del clero en el próximo concilio."
