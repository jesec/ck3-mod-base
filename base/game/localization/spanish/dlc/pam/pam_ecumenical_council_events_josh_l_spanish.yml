l_spanish:
 ecumenical_council_events_josh.0001.t: "Asesinato en las completas"
 ecumenical_council_events_josh.0001.desc: "Los fieles son muy predecibles. Mientras [murder_target.Custom('ES_ElLa')] [murder_target.GetTitledFirstName|l] se arrodilla para rezar las [Glossary( 'completas', 'COMPLINE_GLOSS' )], yo acecho en las sombras. \n\nSus largas plegarias [murder_target.GetHerHim] dejan expuest[murder_target.Custom('ES_OA')]. Cuando estamos a solas, incluso las túnicas más elegantes, sean de uniforme o de terciopelo, podrían convertirse en una soga."
 ecumenical_council_events_josh.0001.a: "Intentar apretar sus vestiduras."
 ecumenical_council_events_josh.0001.a.tt: "Demasiado apretado"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.GetSheHe|U] se escapa de mí"
 ecumenical_council_events_josh.0001.a.toast.success: "El asesinato ha tenido éxito"
 ecumenical_council_events_josh.0001.a.toast.failure: "El intento de asesinato ha fracasado"
 ecumenical_council_events_josh.0001.a.flavor: "Alguien que reza tanto seguramente peca más de la cuenta…"
 ecumenical_council_events_josh.0001.b: "Durante un acto sagrado no…"
 COMPLINE_GLOSS: "Las completas son el rezo de la noche. El último rezo en la Liturgia de las Horas, el ciclo de rezos diarios empleado en la tradición cristiana."
 ecumenical_council_events_josh.0010.t: "Una celebración santa"
 ecumenical_council_events_josh.0010.desc: "El clero se ha reunido, y no hay mayor gozo que celebrar a una de las estrellas que nos guían. Este mes, nos parece adecuado honrar [monthly_saint.Custom('ES_AlAla')] [monthly_saint.GetTitledFirstName|l].\n\n«En el nombre de [ROOT.Char.GetFaith.HighGodName], conduciremos el culto de estos días»."
 ecumenical_council_events_josh.0010.a: "Dedicar la misa."
 ecumenical_council_events_josh.0010.b: "Daré un sermón."
 ecumenical_council_events_josh.0010.c: "Añadir simplemente un salmo o un himno más."
 ecumenical_council_events_josh.0011.t: "Como un trueno"
 ecumenical_council_events_josh.0011.desc: "Cuando saludo a los invitados, no puedo evitar ver [guest_giant.Custom('ES_AlAla')] [guest_giant.GetTitledFirstName|l] destacando entre la multitud con su enorme figura. Pero es al hablar cuando vislumbro su verdadero potencial: «Saludos, mis compañeros guardianes de la fe». \n\nCon su voz atronadora, podría ser muy útil. A los salmos de las [Glossary( 'vísperas', 'VESPER_GLOSS' )] les vendría bien otra voz grave…"
 ecumenical_council_events_josh.0011.a: "Que su voz haga llegar nuestras plegarias hasta [ROOT.Char.GetFaith.HighGodName]."
 ecumenical_council_events_josh.0011.a.flavor: "[ROOT.Char.GetFaith.HighGodName] y todos los presentes reunidos se asombran."
 ecumenical_council_events_josh.0011.b: "Podría aprovechar su resonante apoyo en el debate."
 ecumenical_council_events_josh.0011.b.tt: "Se convierte en alguien en quien confiar"
 ecumenical_council_events_josh.0011.b.tt2: "Solo se puede confiar en [guest_giant.GetSheHe] cuando recibe su parte"
 ecumenical_council_events_josh.0011.b.toast.success: "[guest_giant.GetHerHim|U] convences para que te apoye."
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.GetSheHe|U] quiere algo a cambio de su apoyo."
 ecumenical_council_events_josh.0011.b.flavor: "Con [guest_giant.Custom('ES_ElLa')] [guest_giant.GetTitledFirstName|l] gritando su aprobación en los momentos más apropiados, seguramente tendré las de ganar."
 ecumenical_council_events_josh.0011.c: "[guest_giant.GetSheHe|U] es [Select_CString(guest_giant.IsFemale, 'una invitada', 'un invitado')], no un instrumento."
 ecumenical_council_events_josh.0011.c.flavor: "Dejemos que encuentre su sitio entre nosotros."
 ecumenical_council_events_josh.0011.c.tt: "No presionas [guest_giant.Custom('ES_AlAla')] [guest_giant.GetTitledFirstName|l] al coro ni al debate"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.LocalPlayerString( 'decidiste', 'decidió' )] apoyar a [CHARACTER.GetShortUIName] en un concilio ecuménico."
 VESPER_GLOSS: "Las vísperas son el rezo de la tarde. Normalmente, el rezo antes de la cena en la Liturgia de las Horas, el ciclo de rezos diarios empleado en la tradición cristiana."
 ecumenical_council_events_josh.0012.t: "El anillo de un obispo"
 ecumenical_council_events_josh.0012.desc: "Me he dado cuenta de que [guest_bishoplover.Custom('ES_ElLa')] [guest_bishoplover.GetTitledFirstName|l] y [guest_bishop.Custom('ES_ElLa')] [guest_bishop.GetTitledFirstName|l] han sido inseparables desde que comenzó el concilio. Esta mañana en el [Glossary( 'laudes', 'LAUD_GLOSS' )], [guest_bishoplover.GetFirstName] ha llegado tarde y con el pelo desaliñado. ¿Eso que veo en su dedo es el anillo de [guest_bishop.GetFirstName]? Amablemente, le hago saber lo que he visto y arqueo una ceja. \n\nDándose cuenta de su error, con gran sonrojo y tartamudeando, me responde. \n\n «Por favor, no debe saberlo nadie…»."
 ecumenical_council_events_josh.0012.b: "«Dadme el anillo y guardad silencio»."
 ecumenical_council_events_josh.0012.c: "«Esto queda entre vos, [ROOT.Char.GetFaith.HighGodName] y yo»."
 ecumenical_council_events_josh.0012.bishopringname: "El anillo del obispo"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nUna señal visible del ministerio apostólico de su portador."
 LAUD_GLOSS: "El laudes es el rezo de la mañana. Normalmente, el rezo antes del desayuno en la Liturgia de las Horas, el ciclo de rezos diarios empleado en la tradición cristiana."
 ecumenical_council_events_josh.0013.t: "Un crimen de la moda"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.Custom('ES_ElLa')|U] [fashion_criminal.GetTitledFirstName|l] se yergue vestid[fashion_criminal.Custom('ES_OA')] en todo su esplendor. Luce una vestimenta recién tejida para la ocasión, sin duda un regalo de su adorado rebaño. Un bordado de [ROOT.Char.GetFaith.WealthGodName] mira fijamente desde la estola de seda. \n\n¡Cómo se atreve! ¿Está violando abiertamente los dogmas del [fashion_criminal.GetFaith.GetName|l] o es solo un acto de vanidad?"
 ecumenical_council_events_josh.0013.a: "«Apartad esta deshonra de mi vista»."
 ecumenical_council_events_josh.0013.b: "«¡Marchaos, habéis demostrado ser indign[fashion_criminal.Custom('ES_OA')]!»."
 ecumenical_council_events_josh.0013.b.toast.success: "Consigues que [fashion_criminal.Custom('ES_LoLa')] expulsen."
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.GetSheHe|U] consigue quedarse en el concilio."
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] ha vestido una prenda inapropiada en un concilio ecuménico."
 ecumenical_council_events_josh.0020.t: "Un faro de fervor"
 ecumenical_council_events_josh.0020.desc.intro: "«¡Mirad este pilar de [ROOT.Char.GetFaith.GetName]! Un testimonio real de cómo los virtuosos siguen a la cruz». \n\n[host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l]"
 ecumenical_council_events_josh.0020.desc_battle_memory: " se refiere a cuando [faith_battle_memory.GetDescription]. Hemos de oponernos a los paganos a cada oportunidad que tengamos. Alzo mi espada y acepto su alabanza. ¡Por los fieles!»."
 ecumenical_council_events_josh.0020.desc.fallback: " reconoce mis contribuciones recientes a la fe. Que mi presencia sea requerida en la compañía del clero aquí reunido hincha mi pecho de orgullo»."
 ecumenical_council_events_josh.0020.a: "«¡Prevaleceremos en el nombre de [ROOT.Char.GetFaith.HighGodName]!»."
 ecumenical_council_events_josh.0020.a.flavor: "Mis acciones han conmovido al clero presente."
 ecumenical_council_events_josh.0020.b: "Me bañaré de gloria."
 ecumenical_council_events_josh.0021.t: "En la luz"
 ecumenical_council_events_josh.0021.desc: "Un rayo de luz se desliza por el suelo a medida que el debate se extiende. Intervengo, y de repente todas las miradas están puestas sobre mí. \n\nComo si mis palabras no fuesen suficiente, la luz divina fortalece mi causa. Mi oponente de debate, [council_opponent.GetFirstName], ha quedado en la sombra. Sus argumentos parecen aún más turbios."
 ecumenical_council_events_josh.0021.a: "Aprovechar la ventaja contra [council_opponent.GetFirstName]."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U] abandona a los [ec_conservatives|El] y se une a los [ec_innovators|El]"
 ecumenical_council_events_josh.0021.b: "Que la luz conquiste a la asamblea."
 ecumenical_council_events_josh.0021.b.ct: "Hasta #V 3#! [ec_conservatives|El] se unen a los [ec_innovators|El]"
 ecumenical_council_events_josh.0021.c: "Que contemplen mi esplendor."
 ecumenical_council_events_josh.0021.c.ct: "Añade #V 50#! de inversión de [appointment|El] para un [clerical_title|El]"
 ecumenical_council_events_josh.0022.t: "Unidos en la fe"
 ecumenical_council_events_josh.0022.desc: "Cuando hacía las rondas en el concilio, [host.Custom('ES_ElLa')] [host.GetTitledFirstName|l] vio la oportunidad de alinear a sus partidarios contra las amenazas externas, y nos hizo llamar [alliance_target.Custom('ES_AlAla')] [alliance_target.GetTitledFirstName|l] y a mí.\n\n«Mis fieles, así como permanecéis firmes en la fe, debéis mantener la unidad cuando os enfrentéis a la adversidad»."
 ecumenical_council_events_josh.0022.a: "Que la Iglesia bendiga nuestra alianza."
 ecumenical_council_events_josh.0022.a.flavor: "Usaré mi postura piadosa para sellar la alianza."
 ecumenical_council_events_josh.0022.b: "La lianza se construirá sobre las bases del entendimiento mutuo."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.GetSheHe|U] accede a la alianza."
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.GetSheHe|U] se toma tus propuestas como una ofensa."
 ecumenical_council_events_josh.0022.b.flavor: "Mi trato encantador hacia la gente seguramente bastará."
 ecumenical_council_events_josh.0022.c: "El concilio no es lugar."
 ecumenical_council_events_josh.0022.c.flavor: "Basta con una reverencia de respeto."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.LocalPlayerString( 'rechazaste', 'rechazó' )] una alianza inapropiada."
 ecumenical_council_events_josh.0023.t: "Reza por mí"
 ecumenical_council_events_josh.0023.desc: "«Que la gracia y la paz sean contigo». [host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l] está bendiciendo a los invitados que se le acercan. Podría aprovechar el momento para arrojarme delante de este pilar de la fe. Si consigo que me incluya en los rezos del [Glossary( 'laudes', 'LAUD_GLOSS' )], seguro que estaré más cerca de la salvación. \n\n «Echaos a un lado y dejad de decir tonterías. Estáis ralentizando el avance de la cola», susurra [prayer_opponent.GetFirstName|U], que espera su turno detrás de mí."
 ecumenical_council_events_josh.0023.a: "«Un considerable donativo, para que me tengáis en vuestras plegarias»."
 ecumenical_council_events_josh.0023.b: "Besar el dobladillo de sus vestiduras"
 ecumenical_council_events_josh.0023.b.tt: "Me aseguro de que escuche mi petición"
 ecumenical_council_events_josh.0023.b.tt2: "Rompo con el protocolo y me aparto"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l] rezará por ti."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.Custom('ES_ElLa')|U] [host.GetTitledFirstName|l] rechaza tu petición."
 ecumenical_council_events_josh.0023.c: "Es mejor quedarse a un lado y mostrar piedad."
 ecumenical_council_events_josh.0024.t: "La belleza de los misterios"
 ecumenical_council_events_josh.0024.desc: "Algunas personas vienen aquí buscando hablar de los misterios sagrados, ansiosas de hacer nuevas interpretaciones y discutir. [tenet_target_a.GetName] es un[tenet_target_a.Custom('ES_OA')] de tales asistentes.\n\n«¡[tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )]! [tenet_target_a_shareable_tenet.GetName( tenet_target_a.GetRite )], hermanos. ¡Honrad las restricciones que [ROOT.Char.GetFaith.HighGodName] ha situado ante nosotros, buscad la sabiduría en este idea y alcanzaréis a entender lo divino!».\n\nVoces se alzan y bajan entre la muchedumbre. [tenet_target_b.Custom('ES_ElLa')|U] [tenet_target_b.GetTitledFirstName|l] de corazón [tenet_target_b.Custom('FormalComplimentAdjective')], mientras tanto, se ve cautivad[tenet_target_b.Custom('ES_OA')] por un nuevo texto. Las únicas palabras que consigo entender son: «[tenet_target_b_shareable_tenet.GetName( tenet_target_b.GetRite )]»."
 ecumenical_council_events_josh.0024.a: "«¿Sabiduría decís, [tenet_target_a.GetFirstNameNoTooltip]?»."
 ecumenical_council_events_josh.0024.b: "Ese libro parece bastante interesante."
 ecumenical_council_events_josh.0024.c: "[ROOT.Char.GetFaith.HighGodName] ya me ha enseñado el camino verdadero."
 ecumenical_council_events_josh.0025.t: "Un teólogo de más"
 ecumenical_council_events_josh.0025.desc: "Se produce un alboroto en un extremo de la gran reunión. Algunas personas poco comunes se sacuden el polvo del camino; [Select_CString(ROOT.Char.IsFemale, 'nuestras preladas', ' nuestros prelados' )] murmuran y miran fijamente, y hacen gestos de rechazo a [theologian.Custom('ES_LoLa')]s recién llegad[theologian.Custom('ES_OA')]s. [theologian.Custom('ES_ElLa')|U] [theologian.GetWomanMan] que capitanea a [Select_CString(theologian.IsFemale, 'las desconocidas', 'los desconocidos' )] brama:\n\n«He viajado desde lejos para dar testimonio por mis hermanos [theologian.GetFaith.GetAdherentNamePlural]. Nuestros padres de antaño, los apóstoles, eran como hermanos. Entonces, ¿por qué no se me puede admitir en vuestro concilio?»."
 ecumenical_council_events_josh.0025.a: "La entrada tiene un coste…"
 ecumenical_council_events_josh.0025.a.flavor: "Puedo añadir[theologian.GetHerHim] a mi lista de invitados."
 ecumenical_council_events_josh.0025.b: "«¡Vuestras enseñanzas son una vergüenza!»."
 ecumenical_council_events_josh.0025.c: "«Fascinante. Celebremos nuestro propio concilio luego»."
 ecumenical_council_events_josh.0025.d: "Conducir[theologian.GetHerHim] educadamente fuera."
