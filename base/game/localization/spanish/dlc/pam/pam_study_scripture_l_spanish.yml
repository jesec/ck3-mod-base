 # Scheme modifiers
 pam_lapsed_studies_modifier: "Estudios abandonados"
 pam_lapsed_studies_modifier_desc: "Este personaje, llevado por la desesperación, ha abandonado los estudios sagrados."
 pam_renewed_zeal_modifier: "Fervor renovado"
 pam_renewed_zeal_modifier_desc: "Este personaje, tras ser severamente amonestado, ha retomado sus estudios.\n[success_chance|E] de [GetScheme('study_scripture').GetTypeName|l] : #P +10%#!"
 pam_inspired_study_modifier: "Estudio inspirado"
 pam_inspired_study_modifier_desc: "Un obsequio bien pensado contribuye al avance de estos estudios."
 pam_cloistered_rigor_modifier: "Rigor enclaustrado"
 pam_cloistered_rigor_modifier_desc: "Estos estudios se llevan a cabo a puerta cerrada, con un rigor inquebrantable."
 pam_cloistered_rigor_personal_modifier: "Vida recluida en el estudio"
 pam_cloistered_rigor_personal_modifier_desc: "Este personaje se ha apartado de los asuntos mundanos para dedicarse al estudio sagrado con un rigor inquebrantable."
 pam_measured_devotion_modifier: "Devoción mesurada"
 pam_measured_devotion_modifier_desc: "Estos estudios avanzan de forma constante, en las horas que se les dedican."
 pam_measured_devotion_personal_modifier: "Estudiante con devoción por las Escrituras"
 pam_measured_devotion_personal_modifier_desc: "Este personaje se dedica al estudio sagrado con una devoción constante y mesurada."
 pam_mortified_flesh_modifier: "Mortificación de la carne"
 pam_mortified_flesh_modifier_desc: "El ayuno y las vigilias han agudizado la mente para estos estudios."
 pam_divine_favor_modifier: "Favor divino"
 pam_divine_favor_modifier_desc: "Estos estudios se desarrollan bajo una bendición."
 pam_devoted_acolyte_modifier: "Acólito devoto"
 pam_devoted_acolyte_modifier_desc: "Un devoto ayudante atiende todas las necesidades de estos estudios."
 pam_amanuensis_modifier: "Amanuense fiel"
 pam_amanuensis_modifier_desc: "Un fiel asistente mantiene las notas y las páginas en perfecto orden."
 pam_persistent_devotions_modifier: "Devociones persistentes"
 pam_persistent_devotions_modifier_desc: "Los contratiempos no han hecho más que reforzar la disciplina de estos estudios."
 pam_renowned_exegete_modifier: "Exégeta de renombre"
 pam_renowned_exegete_modifier_desc: "La lectura de los textos sagrados por parte de este personaje lo convierte en un [Glossary('exégeta', 'GLOSS_EXEGETE')]."
 pam_doctrinal_clarity_modifier: "Claridad doctrinal"
 pam_doctrinal_clarity_modifier_desc: "Este personaje ve las doctrinas de su fe con una claridad poco común.\n\nAceptación de $sway_ruler_to_my_rite_interaction$: #p +20#!\nAceptación de $pam_evangelize_personal_tenet_interaction$: #p +20#!\nCoste de [piety|El] de $pam_evangelize_personal_tenet_interaction$ : #p -50 %#!"
 pam_known_in_the_synod_modifier: "Conocido en el sínodo"
 pam_known_in_the_synod_modifier_desc: "Entre el clero se comenta la erudición de este personaje."
 pam_assisted_by_theologians_modifier: "Asistido por teólogos"
 pam_assisted_by_theologians_modifier_desc: "Unos teólogos eruditos están ayudando a este personaje."
 pam_known_by_mystics_modifier: "Conocido por los místicos"
 pam_known_by_mystics_modifier_desc: "Este personaje goza de gran prestigio entre místicos y contemplativos."
 pam_monastic_copyists_modifier: "Copistas monásticos"
 pam_monastic_copyists_modifier_desc: "Incansables copistas monásticos proporcionan textos nuevos a estos estudios."
 pam_charterhouse_silence_modifier: "El silencio de la cartuja"
 pam_charterhouse_silence_modifier_desc: "La disciplina de los contemplativos silenciosos da solidez a estos estudios."
 pam_pastoral_letter_county_modifier: "Una carta pastoral"
 pam_pastoral_letter_county_modifier_desc: "En cada servicio se lee en voz alta una carta de consuelo e instrucción de un lejano pastor de la fe."
