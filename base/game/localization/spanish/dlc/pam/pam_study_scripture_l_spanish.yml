 pam_ss_fragment_proverbs_4_7: "El principio de la sabiduría es…"
 pam_ss_fragment_joshua_1_8: "Medítalo día y noche…"
 pam_ss_fragment_matthew_7_7: "Buscad y encontraréis…"
 pam_ss_fragment_james_1_5: "Si alguno de vosotros carece de sabiduría…"
 pam_ss_fragment_2_timothy_2_15: "Procura con toda diligencia presentarte ante Dios como digno de aprobación…"
 pam_ss_fragment_verbum_domini: "Verbum Domini manet in aeternum…"
 pam_ss_fragment_generic_1: "Los misterios se intensifican…"
 pam_ss_fragment_generic_2: "La sabiduría echa raíces…"
 pam_ss_fragment_generic_3: "Los textos despliegan su significado…"
