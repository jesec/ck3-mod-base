l_spanish:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "Estudio religioso"
 study_scripture_action: "Estudio religioso"
 study_scripture_desc: "Me dedicaré al estudio sagrado: [GetPlayer.GetFaith.ReligiousText], doctrinas de mi fe y misterios que van más allá de ellas."
 study_scripture_desc_general: "$study_scripture$ es una [personal_scheme|lE] con la que intentas ganar [piety|lE], [skill|lE] y el [trait|lE] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "Tus habilidades mejoran, ganas piedad o encuentras una oportunidad"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "Aceptas de buen grado [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]: $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "Aceptas de buen grado [GetTenetType('tenet_scholasticism').GetBaseName]: $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "[learning|E] de tu superior clerical: $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "Tienes [GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip|l]: $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "Tu [stress|El] pesa en tus estudios: $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "Tienes el rasgo [GetTrait('zealous').GetName( owner )]: $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "Tienes el rasgo [GetTrait('cynical').GetName( owner )]: $VALUE|+0=$"
 pam_study_scripture_decision: "Estudiar el libro sagrado de la fe [ROOT.Char.GetFaith.GetAdjective]"
 pam_study_scripture_decision_desc: "El libro sagrado de la fe [ROOT.Char.GetFaith.GetAdjective] no se lee solo, ni las doctrinas del [ROOT.Char.GetFaith.GetName|l] se revelan a mentes ociosas. Dedica las horas comprendidas entre [ROOT.Char.Custom('StudyOfficesWord')] a estudiar y a contemplar, y deja que el rebaño vea cómo aprende su pastor."
 pam_study_scripture_decision_tooltip: "Empieza una [scheme|El] de [GetScheme('study_scripture').GetTypeName|l] contigo como objetivo"
 pam_study_scripture_decision_tt: "Comienzas una [scheme|lE] de [GetScheme('study_scripture').GetTypeName|l] contigo como objetivo\n\nRecompensas previstas:\n$EFFECT_LIST_BULLET$ [piety|E] [piety_i]\n$EFFECT_LIST_BULLET$ El [trait|lE]/[trait_level_track_xp|lE] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ [skill|E] [learning_i][stewardship_i][diplomacy_i] #weak (hasta 8)#!\n$EFFECT_LIST_BULLET$ Oportunidades entre el [clergy|El]\n\nInconvenientes:\n$EFFECT_LIST_BULLET$ Puedes ganar [stress|El] [stress_i]\n$EFFECT_LIST_BULLET$ Se reduce la ganancia de [prestige|El] [prestige_i]"
 pam_study_scripture_decision_confirm: "Que empiece la lección."
 pam_study_scripture_decision_req_tt: "No estás realizando ya una [scheme|lE] de [GetScheme('study_scripture').GetTypeName|l]"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial Terminará tu [personal_scheme|lE] en curso#!"
 study_scripture_title: "$study_scripture$: "
 study_scripture_outcome_piety: "$study_scripture_title$devoción recompensada"
 study_scripture_outcome_fragment_tt: "#EMP «[owner.Custom('RandomStudyVerseFragment')]»#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$una visión de las Escrituras"
 study_scripture_outcome_mystery: "$study_scripture_title$un atisbo de los misterios"
 study_scripture_outcome_stress: "$study_scripture_title$un estudio agotador"
