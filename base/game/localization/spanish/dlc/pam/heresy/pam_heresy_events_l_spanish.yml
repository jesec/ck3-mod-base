l_spanish:
 ##############################################
 # PAM heresy system - rite type localization #
 ##############################################
 cathar_rite: "Catarismo"
 cathar_rite_name: "Catarismo"
 cathar_rite_adj: "cátara"
 cathar_rite_adherent: "cátaro"
 cathar_rite_adherent_plural: "cátaros"
 cathar_rite_desc: "Un rito austero dualista que sostiene que el mundo material es obra de un demiurgo malvado. Sus «perfecti» hacen votos de pobreza y de castidad, rechazan los sacramentos de la Iglesia oficial y niegan el servicio militar en nombre de Dios."
 waldensian_rite: "Valdesianismo"
 waldensian_rite_name: "Valdesianismo"
 waldensian_rite_adj: "valdense"
 waldensian_rite_adherent: "valdense"
 waldensian_rite_adherent_plural: "valdenses"
 waldensian_rite_desc: "Un rito de predicadores mendicantes descalzos que insiste en que los laicos pueden predicar las Escrituras, que la Iglesia institucional no posee exclusividad sobre la gracia y que los cristianos no deben tener propiedades ni tomar las armas."
 lollard_rite: "Lolardismo"
 lollard_rite_name: "Lolardismo"
 lollard_rite_adj: "lolarda"
 lollard_rite_adherent: "lolardo"
 lollard_rite_adherent_plural: "lolardos"
 lollard_rite_desc: "Un rito reformista vernáculo que rechaza los rituales adornados, la transustanciación, el culto a las reliquias y el clero acaudalado. La Biblia se lee en la lengua común y se considera que cada creyente es un sacerdote por derecho propio."
 hussite_rite: "Husitismo"
 hussite_rite_name: "Husitismo"
 hussite_rite_adj: "husita"
 hussite_rite_adherent: "husita"
 hussite_rite_adherent_plural: "husitas"
 hussite_rite_desc: "Un rito reformador bohemio que exige el cáliz para el laicado, que las Escrituras estén en la lengua vernácula y poner fin a la riqueza del clero y a la venta de indulgencias. Sus predicadores se apoyan en gran medida en los argumentos de Wycliffe y en la convicción apasionada de que Roma se había desviado del sendero apostólico."
 joachimite_rite: "Joaquinismo"
 joachimite_rite_name: "Joaquinismo"
 joachimite_rite_adj: "joaquinita"
 joachimite_rite_adherent: "joaquinita"
 joachimite_rite_adherent_plural: "joaquinitas"
 joachimite_rite_desc: "Un rito apocalíptico que divide la historia en tres edades: la del Padre, la del Hijo y la próxima edad del Espíritu Santo donde la Iglesia institucional se deshará y surgirá una nueva orden contemplativa. Sus practicantes vagan sumidos en una pobreza apostólica, predican en mercados y aguardan con esperanza el inminente fin del mundo."
 iconoclast_rite: "Iconoclasismo"
 iconoclast_rite_name: "Rito iconoclasta"
 iconoclast_rite_adj: "iconoclasta"
 iconoclast_rite_adherent: "iconoclasta"
 iconoclast_rite_adherent_plural: "iconoclastas"
 iconoclast_rite_desc: "Un renacimiento del antiguo movimiento aniconista oriental que condena la veneración de las imágenes por ser idolatría disfrazada y que exige que iglesias y hogares sean despojados de iconos."
 bogomilist_rite: "Bogomilismo"
 bogomilist_rite_name: "Bogomilismo"
 bogomilist_rite_adj: "bogomila"
 bogomilist_rite_adherent: "bogomilo"
 bogomilist_rite_adherent_plural: "bogomilos"
 bogomilist_rite_desc: "Un rito eslavo dualista que se remonta al sacerdote Bogomil. Sus predicadores viajan descalzos, rechazan la jerarquía, se niegan a llevar armas y enseñan que Satanás fue quien creó el mundo visible."
 paulician_rite: "Paulicianismo"
 paulician_rite_name: "Paulicianismo"
 paulician_rite_adj: "pauliciana"
 paulician_rite_adherent: "pauliciano"
 paulician_rite_adherent_plural: "paulicianos"
 paulician_rite_desc: "Un rito marcial dualista nacido en Asia Menor; desdeña los iconos y la jerarquía oficial, valora la lectura de las epístolas de San Pablo sin mediaciones y está dispuesto a tomar las armas en defensa de su pureza."
 messalian_rite: "Mesalianismo"
 messalian_rite_name: "Mesalianismo"
 messalian_rite_adj: "mesaliana"
 messalian_rite_adherent: "mesaliano"
 messalian_rite_adherent_plural: "mesalianos"
 messalian_rite_desc: "Un rito ascético esotérico que sostiene que las oraciones ininterrumpidas son el único sacramento relevante y que, una vez que un creyente ha expulsado al demonio que vivía en su interior, ningún acto carnal puede volver a mancillarlo."
 adoptionist_rite: "Adopcionismo"
 adoptionist_rite_name: "Adopcionismo"
 adoptionist_rite_adj: "adopcionista"
 adoptionist_rite_adherent: "adopcionista"
 adoptionist_rite_adherent_plural: "adopcionistas"
 adoptionist_rite_desc: "Un rito cristológico hispánico que sostiene que, en su humanidad, Cristo es el Hijo adoptado de Dios, no natural; una doctrina que la iglesia carolingia consideró que era un nestorianismo disfrazado."
 ###################################
 # Fervor reset descriptions       #
 ###################################
 pam_heresy_fervor_reset_component_1_desc: "Los fieles se unieron contra una [rite_divergence|El] en expansión"
 pam_heresy_fervor_reset_component_2_desc: "Los fieles se unieron contra un nuevo [rite|El] cismático"
 pam_heresy_fervor_reset_component_3_desc: "Los fieles se unieron contra una herejía revivida"
 ###################################
 # Component 1 - Light divergence  #
 ###################################
 heresy_light.0010.t: "Divergencia herética"
 heresy_light.0010.desc.intro.descriptor_archbishop: "El arzobispo [founder.GetFirstName] de etnia [founder.GetCulture.GetName] "
 heresy_light.0010.desc.intro.descriptor_ruler: "[founder.Custom('ES_ElLa')|U] [founder.GetTitledFirstName|l] "
 heresy_light.0010.desc.opener.archbishopric: "de [founder_clerical_title.GetNameNoTier] "
 heresy_light.0010.desc.opener.lands: "de [founder.GetPrimaryTitle.GetBaseNameNoTier] "
 heresy_light.0010.desc.body.uneasy: "ha desviado aún más el [new_rite.GetName|l] de su raíz [source_rite.GetAdjective], "
 heresy_light.0010.desc.body.alarming: "ha alejado el [new_rite.GetName|l] peligrosamente de la práctica [source_rite.GetAdjective] aceptada, "
 heresy_light.0010.desc.body.dangerous: "ha desviado el [new_rite.GetName|l] en algo que la comunidad [source_rite.GetAdjective] apenas puede reconocer, "
 heresy_light.0010.desc.differing.tenet: "y la discrepancia más llamativa es [differing_tenet.GetBaseName|l]."
 heresy_light.0010.desc.differing.doctrine: "y la discrepancia más llamativa es [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )|l]."
 heresy_light.0010.desc.differing.fallback: "los nuevos puntos de énfasis son demasiado sutiles para un solo nombre."
 heresy_light.0010.desc.outro: "\n\nTodavía no son herejes, pero el límite ya no está demasiado lejos."
 heresy_light.0010.desc.outro.own_rite: "\n\nTodavía no somos herejes, pero el límite ya no está demasiado lejos."
 heresy_light.0010.a: "Rezaré pidiendo dirección."
 heresy_light.0010.b: "Hay sabiduría en el [new_rite.GetNameNoTooltip|l]. Recorreré esa senda."
 heresy_light.0010.c: "A mí me huele a herejía…"
 heresy_light.0010.c.own_rite: "Entonces, adelante. La senda es nuestra."
 heresy_light.notification.member.title: "Nuestro rito se desvía"
 heresy_light.notification.member.tt: "El [new_rite.GetName|l] se ha desviado más de la ortodoxia [source_rite.GetAdjective] bajo [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l]."
 heresy_light.notification.hof.title: "Un rito se desvía hacia la herejía"
 heresy_light.notification.hof.tt: "El [new_rite.GetName|l] ha dado un bandazo aún mayor de la ortodoxia [source_rite.GetAdjective] bajo [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l]."
 heresy_light.notification.mainline.title: "Un rito vecino se desvía"
 heresy_light.notification.mainline.tt: "El [new_rite.GetName|l] se ha desviado más de la ortodoxia [source_rite.GetAdjective] bajo [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l]."
 ###################################################
 # Component 2 - New dangerously divergent rite    #
 ###################################################
 heresy_dangerous_rite.0010.t: "Un rito herético"
 heresy_dangerous_rite.0010.desc.intro.descriptor_archbishop: "El arzobispo [founder.GetFirstName] de etnia [founder.GetCulture.GetName] "
 heresy_dangerous_rite.0010.desc.intro.descriptor_ruler: "[founder.Custom('ES_ElLa')|U] [founder.GetTitledFirstName|l] "
 heresy_dangerous_rite.0010.desc.opener.archbishopric: "de [founder_clerical_title.GetNameNoTier] "
 heresy_dangerous_rite.0010.desc.opener.lands: "de [founder.GetPrimaryTitle.GetBaseNameNoTier] "
 heresy_dangerous_rite.0010.desc.body.alarming: "ha roto abiertamente con la ortodoxia [source_rite.GetAdjective] y ha proclamado el [new_rite.GetName|l]; "
 heresy_dangerous_rite.0010.desc.body.severe: "se ha liberado de la ortodoxia [source_rite.GetAdjective] a todos los efectos y ha proclamado el [new_rite.GetName|l]; "
 heresy_dangerous_rite.0010.desc.differing.tenet: "el más osado de sus nuevos edictos, se predica [differing_tenet.GetBaseName|l] abiertamente."
 heresy_dangerous_rite.0010.desc.differing.doctrine: "el más osado de sus nuevos edictos, se predica [differing_doctrine.GetDescriptiveName( source_rite.GetFaith.Self )|l] abiertamente."
 heresy_dangerous_rite.0010.desc.differing.fallback: "los nuevos edictos son demasiados para fijar una línea única."
 heresy_dangerous_rite.0010.desc.outro: "\n\nLos predicadores ya se extienden por el señorío: [origin_faith.ReligiousText] en una mano, antorcha en la otra. Los ancianos del [origin_faith.GetName|l] no tendrán nada amable que decir de ello.\n\nUna herejía potencial ha sido puesta por escrito y clamada desde el púlpito; la espada y el fuego responderán donde los sermones no alcancen."
 heresy_dangerous_rite.0010.a: "Comencemos."
 heresy_dangerous_rite.0010.c: "A mí me huele a herejía…"
 heresy_dangerous_rite.spread.title: "El nuevo rito se propaga"
 ###################################################
 # Component 3 - Historical heresy outbreak        #
 ###################################################
 # First-fire titles for the named historical heresies use the iconic founder.
 # Resurgences and the always-anonymous heresies fall back on a generic title.
 heresy_historical.0050.t.lollard.first: "La herejía de Wycliffe"
 heresy_historical.0050.t.hussite.first: "La herejía de Hus"
 heresy_historical.0050.t.joachimite.first: "La herejía de Joaquín"
 heresy_historical.0050.t.cathar.first: "La herejía cátara"
 heresy_historical.0050.t.waldensian.first: "La herejía de Valdo"
 heresy_historical.0050.t.bogomilist.first: "La herejía de Bogomil"
 heresy_historical.0050.t.resurgence: "La herejía [heresy_faith.GetAdjectiveNoTooltip] regresa"
 heresy_historical.0050.t.fallback: "Una herejía [heresy_faith.GetAdjectiveNoTooltip]"
 heresy_historical.0050.desc.nearby.first: "[founder.Custom('ES_ElLa')|U] [founder.GetTitledFirstName|l] predica la causa [heresy_faith.GetAdjective] en [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]: lo bastante cerca como para no poder negar la noticia. Nuestros [origin_faith.PriestMalePlural] [founder.GetHerHim] denuncian desde el púlpito y, de algún modo, eso solo consigue que sus palabras se extiendan más aún.\n\n"
 heresy_historical.0050.desc.nearby.resurgence: "La causa [heresy_faith.GetAdjective] se ha reavivado en [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] bajo [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l]: el antiguo fuego, tan lejos de nosotros como siempre. Los cortesanos y el pueblo llano recuerdan por igual por qué fue tan peligroso la primera vez.\n\n"
 heresy_historical.0050.desc.distant.first: "Desde [epicenter_ruler.GetCapitalLocation.GetTitle.GetName], siempre tan lejos, llega la noticia [founder.Custom('ES_DelDela')] [founder.GetTitledFirstName|l], que ha prendido la llama de la causa [heresy_faith.GetAdjective]. Peregrinos y mercaderes transportan sus sermones por los caminos; la única cuestión es cuándo llegarán sus palabras a nuestra puerta.\n\n"
 heresy_historical.0050.desc.distant.resurgence: "Desde las tierras lejanas de [epicenter_ruler.GetCapitalLocation.GetTitle.GetName] llega la noticia que todo prelado ha temido: la causa [heresy_faith.GetAdjective] se ha reavivado bajo [founder.Custom('ES_ElLa')] [founder.GetTitledFirstName|l], como si ni fuego, ni decreto ni concilio la hubieran silenciado jamás.\n\n"
 heresy_historical.0050.desc.insider.first: "[founder.Custom('ES_ElLa')|U] [founder.GetTitledFirstName|l] ha sacado a la luz la causa [heresy_faith.GetAdjective] en [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]. El susurro de los años se ha convertido en un sermón que el mundo entero escuchará.\n\n"
 heresy_historical.0050.desc.insider.resurgence: "[founder.Custom('ES_ElLa')|U] [founder.GetTitledFirstName|l] ha revivido la causa [heresy_faith.GetAdjective] en [epicenter_ruler.GetCapitalLocation.GetTitle.GetName]; el viejo fuego, reavivado. Nuestro movimiento no se ha olvidado.\n\n"
 heresy_historical.0050.gloss.lollard: "[founder.GetSheHe|U] predica las Escrituras en la lengua común, ni tierra para el clero ni teatro en el altar."
 heresy_historical.0050.gloss.hussite: "[founder.GetSheHe|U] predica la comunión en dos especies para los laicos, las Escrituras en bohemio y una Iglesia desprovista de sus dignidades compradas."
 heresy_historical.0050.gloss.joachimite: "[founder.GetSheHe|U] predica la inminente Edad del Espíritu, en la cual las ordenes sacerdotales de Roma darán paso a una Iglesia contemplativa de hombres pobres."
 heresy_historical.0050.gloss.cathar: "[founder.GetSheHe|U] predica un dualismo extremo, proclama que el mundo es la obra de un dios malvado y que la Iglesia de Roma es la ramera de Babilonia."
 heresy_historical.0050.gloss.waldensian: "[founder.GetSheHe|U] predica una Iglesia pobre de predicadores descalzos; sin juramentos, ni guerra, ni monopolio sacerdotal de la Palabra."
 heresy_historical.0050.gloss.bogomilist: "[founder.GetSheHe|U] predica un dualismo eslavo: el mundo es de Satanás y solo la oración incesante recupera el alma."
 heresy_historical.0050.gloss.paulician: "[founder.GetSheHe|U] predica el antiguo fuego oriental: dualismo, iconoclasia y una lectura estricta de san Pablo. Sus seguidores prefieren la espada a la pira."
 heresy_historical.0050.gloss.iconoclast: "[founder.GetSheHe|U] predica el renacimiento de la causa iconoclasta: todo Cristo pintado y santo dorado son ídolos, el segundo concilio de Nicea fue un error que nunca se reparó."
 heresy_historical.0050.gloss.adoptionist: "[founder.GetSheHe|U] predica de nuevo el antiguo argumento hispano: Cristo adoptado, no natural, en su humanidad."
 heresy_historical.0050.gloss.messalian: "[founder.GetSheHe|U] predica sobre la oración incesante por encima de cualquier sacramento y sobre el demonio que mora en nosotros y que ningún sacerdote puede expulsar."
 heresy_historical.0050.gloss.generic: "[founder.GetSheHe|U] predica una doctrina de una estricta renovación, sacada de la tradición [heresy_faith.GetAdjective] y afilada al extremo."
 heresy_historical.0050.history.lollard: "\n\nComenzó en Oxford, con maestros haciendo preguntas sencillas sobre la ley canónica, y ahora se extiende de claustro a pueblo en la escritura inglesa, con más rapidez de la que puede confiscar ningún cura de parroquia."
 heresy_historical.0050.history.hussite: "\n\nFue en la capilla de Belén en Praga: sermones en bohemio, el cáliz para los laicos; la Corona hizo la vista gorda. La curia no lo hará."
 heresy_historical.0050.history.joachimite: "\n\nComenzó en un claustro de Calabria, donde un abad leyó el Apocalipsis como un calendario y contó los años para la siguiente era. Unos franciscanos espirituales continuaron la cuenta; ahora predicadores laicos la llevan a cada plaza de mercado."
 heresy_historical.0050.history.cathar: "\n\nCruzó los Balcanes y arraigó en los salones del Languedoc; ahora condes, tejedores y vizcondes lo siguen por igual. Los perfecti caminan descalzos y rechazan los juramentos; los creyentes a su alrededor crecen con cada estación."
 heresy_historical.0050.history.waldensian: "\n\nComenzó con un mercader de Lyon que entregó sus bienes a los pobres y predicó en las calles. El sínodo le silenció; en cambio, los predicadores llegaron a los valles alpinos, descalzos y en parejas."
 heresy_historical.0050.history.bogomilist: "\n\nSe agitó por primera vez con el zar Pedro, cuando los curas rurales enseñaron que el pan y el vino no eran más que pan y vino. Los patriarcas lo anatemizaron; la doctrina se hundió en la campiña eslava y jamás se fue del todo."
 heresy_historical.0050.history.paulician: "\n\nEl fuego es más antiguo que ninguna catedral del Bósforo; una lectura estricta de san Pablo prendió en las tierras altas de Armenia y en el pasado se midió contra el imperio desde Tefrique."
 heresy_historical.0050.history.iconoclast: "\n\nEn dos ocasiones el imperio vació sus iglesias de Cristos pintados y santos dorados; en dos ocasiones los iconos regresaron y en dos ocasiones la cuestión quedó enterrada. Y ahora el antiguo argumento vuelve a surgir."
 heresy_historical.0050.history.adoptionist: "\n\nEl argumento es ibérico, nacido en las tierras fronterizas donde una reunión de obispos decidió que el hijo del carpintero fue adoptado en la gloria en lugar de nacer en ella. Fráncfort y Aquisgrán lo condenaron; las tierras fronterizas siguen preguntando."
 heresy_historical.0050.history.messalian: "\n\nBrotó en los desiertos de Mesopotamia, donde monjes errantes rezaban sin dormir y sostenían que toda alma albergaba un demonio que ningún sacerdote podía exorcizar. Éfeso los condenó, pero ellos siguieron igual con su vagar."
 heresy_historical.0050.history.generic: "\n\nToda era produce su propio fuego; claustros que rompen sus reglas, predicadores que abandonan la catedral para no volver. Este ahora mismo está de camino."
 heresy_historical.0050.a: "Su causa es justa; la abrazaré."
 heresy_historical.0050.b: "Cuánta convicción… Ojalá fuera yo."
 heresy_historical.0050.c: "Herejes…"
 heresy_historical.0050.c.insider: "Aguantaremos. La causa crece."
 heresy_historical.spread.title: "La herejía se extiende."
