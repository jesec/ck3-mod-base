 pam_tenet_events.0004.opening.hof: "Mi estimad[diverged_rite.Custom('ES_OA')] [diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip|l],"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "Os escribo para informaros de que el [diverged_rite.GetName|El] ha adoptado el dogma de [diverged_added_tenet.GetBaseName].\n\nUn rito que guía bien a su gente fortalece la fe [diverged_rite.GetFaith.GetAdjective] en su conjunto. Es algo que todos saben."
 pam_tenet_events.0004.desc.forward_doctrine: "Os escribo para informaros de que el [diverged_rite.GetName|El] ahora sigue formalmente la doctrina de [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )|l].\n\nUn rito que sabe guiar a su gente fortalece la fe [diverged_rite.GetFaith.GetAdjective] en su conjunto. Es algo que todos saben."
 pam_tenet_events.0004.desc.backward_tenet: "Os escribo para informaros de que el [diverged_rite.GetName|El] ha abrazado el dogma de [diverged_added_tenet.GetBaseName].\n\nCon ello, nos acercamos más al [diverged_rite.GetFaith.GetMainRite.GetName|El]. Cuando sus ritos hablan con una sola voz, ¡florece la fe [diverged_rite.GetFaith.GetAdjective]!"
 pam_tenet_events.0004.desc.backward_doctrine: "Os escribo para informaros de que el [diverged_rite.GetName|El] ahora observa la doctrina de [diverged_added_doctrine.GetDescriptiveName( diverged_rite.GetFaith.Self )|l].\n\nCon ello, nos acercamos más al [diverged_rite.GetFaith.GetMainRite.GetName|El]. Cuando sus ritos hablan con una sola voz, ¡florece la fe [diverged_rite.GetFaith.GetAdjective]!"
 pam_tenet_events.0004.a: "Que así sea."
 pam_tenet_events.0004.a.tt.diverged: "El [rite|El] del [diverged_rite.GetName|El] se ha desviado más del [mainline_rite|El] del [diverged_rite.GetFaith.GetMainRite.GetName|El], lo que provoca que el [fervor|El] [fervor_i] anual disminuya más rápido"
 pam_tenet_events.0004.a.tt.consolidated: "El [rite|El] del [diverged_rite.GetName|El] se ha acercado más al [mainline_rite|El] del [diverged_rite.GetFaith.GetMainRite.GetName|El], lo que provoca que el [fervor|El] [fervor_i] anual disminuya más lento"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "He dado la mitad de lo que tengo para ayudar a los pobres, y mi alma se ha enriquecido con tal gesto.\n\nAhora os pido la mitad de lo vuestro para hacer lo mismo. Las manos vacías se perdonan. Las llenas se recuerdan."
 pam_tenet_events.0005.a: "Si mi [redistributing_liege.GetTitleAsNameNoTooltip|l] puede soportarlo, yo también."
 pam_tenet_events.0005.b: "Mis manos están llenas, y así seguirán."
 pam_tenet_events.0005.b.tt: "Vuestros cofres se quedan como están, y nada reciben vuestros [counties|El]"
 pam_tenet_events.0006.t: "Las enseñanzas ocultas"
 pam_tenet_events.0006.desc_intro: "Los libros sin marcar yacen abiertos ante mí, con sus diagramas al descubierto y sus nombres, que ningunos labios deben pronunciar. Esta es la enseñanza que los devotos sinceros tienen advertido no tocar nunca, y yo he regalado una noche con ella."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.Custom('ES_ElLa')|U] [mystic_witness.GetTitledFirstName|l] llega hasta el umbral y se detiene allí. «Hay una razón por la que estas cosas se mantienen bajo llave y oración», murmura [mystic_witness.GetSheHe]. «Lo que leáis ahí dentro, no podréis dejar de saberlo»."
 pam_tenet_events.0006.desc_alone: "\n\nNadie de mi corte se sentará conmigo a leer estas páginas. Sea lo que sea lo que me espere en ellas, lo afrontaré sin consejo alguno."
 pam_tenet_events.0006.a: "Nada en estas páginas está por encima de mí. Seguid leyendo."
 pam_tenet_events.0006.b: "Hasta donde aguante la luz de la lámpara, ni un renglón más."
 pam_tenet_events.0007.t: "Consejo de los muertos"
 pam_tenet_events.0007.desc: "Las puertas están atrancadas y las lámparas están apagadas; el mundo se va reduciendo hasta que solo quedan una única llama vacilante y el humo que se arremolina densamente a mi alrededor. Ya puedo sentir la presencia [guiding_forebear.Custom('ES_DelDela')] [guiding_forebear.GetTitledFirstName|l] retorciéndose tras el velo de humo.\n\nEn la oscuridad, pongo al descubierto las dolorosas aflicciones que no oso nombrar a la luz del día. Los espíritus no responden como lo hacen los mortales, sino a través de susurros sepulcrales, el crepitar de una llama intermitente, el roce furtivo del aire invisible y los espectros que se agitan entre el humo.\n\nEn mi desesperación por encontrar guía, mis ojos se fijan en cada señal en busca de la respuesta que más necesito."
 pam_tenet_events.0007.a: "Prestadme la sabiduría que os ha guiado."
 pam_tenet_events.0007.b: "Concededme suficiente paz para afrontar el amanecer."
 pam_tenet_events.0008.t: "Un yo recordado"
 pam_tenet_events.0008.desc: "El sello, la copa, el anillo que arrebataron de la mano de mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))], [remembered_forebear.Custom('ES_ElLa')] [remembered_forebear.GetTitledFirstName|l]. He hecho que los traigan ante mí, y con ellos me quedo más allá del punto en que se sienten prestados.\n\nNo aparece nada. No se dice nada. No me hablan de [remembered_forebear.Custom('ES_ElElla')], me recuerdan a mí, y ese recordatorio es una naturaleza que dejé atrás con aquella vida, no algo que haya perdido."
 pam_tenet_events.0008.a: "Así era yo: de carácter [remembered_trait_1.GetNameNoTooltip( ROOT.Char )|l], hasta la médula."
 pam_tenet_events.0008.b: "Me despierto con espíritu [remembered_trait_2.GetNameNoTooltip( ROOT.Char )|l], y sé que es propio de mí."
 pam_tenet_events.0008.c: "Sí. Yo era de talante [remembered_trait_3.GetNameNoTooltip( ROOT.Char )|l] por entonces, y puedo serlo otra vez."
 pam_tenet_events.0008.d: "Esas vidas han pasado. Yo sigo siendo yo mism[ROOT.Char.Custom('ES_OA')]."
 pam_tenet_events.0009.t: "Abrir los cofres"
 pam_tenet_events.0009.desc_intro: "Han sacado los cofres al patio y me han puesto las llaves en la mano."
 pam_tenet_events.0009.desc_witness: " [redistribution_witness.Custom('ES_ElLa')|U] [redistribution_witness.GetTitledFirstName|l] recorre la fila.\n\n«Un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] generos[ROOT.Char.Custom('ES_OA')] sigue siendo un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l]», dice [redistribution_witness.GetSheHe]. «Nadie se salva por dar mucho, sino solo por no tener nada que conservar»."
 pam_tenet_events.0009.desc_alone: " Nadie ha salido a apoyarme. Los administradores mantienen la distancia y esperan."
 pam_tenet_events.0009.desc_end: "\n\nLo mío lo puedo abrir con un giro de muñeca. El resto tendré que tomarlo."
 pam_tenet_events.0009.a: "Romped los candados. Que cada uno tome lo que le corresponda."
 pam_tenet_events.0009.flavor: "Los vasallos a los que les sobre el dinero se verán obligados a abrir sus arcas, vuestros condados serán cada vez más libres y difíciles de gobernar, y aquellos que no compartan este principio os guardarán rencor por ello."
 pam_tenet_events.0009.b: "Un momento. Solo tiene que desaparecer mi propia riqueza."
 pam_tenet_events.0009.b.tt: "Solo compartís lo que es vuestro. Vuestros [vassals|El] mantienen cerrados sus cofres y no os guardan rencor por esto"
 pam_tenet_events.0010.t: "Lo que debe la carne"
 pam_tenet_events.0010.desc_intro: "El flagelo yace donde siempre. Junto a él, esta noche, están los grilletes y el puñal corto, traídos quedamente, pero no lo usará más mano que la mía."
 pam_tenet_events.0010.desc_alone: "\n\nNadie me sostendrá la lámpara esta noche. Sea lo que sea lo que tome de esa mesa, lo haré sin que nadie lo vea."
 pam_tenet_events.0010.a: "El flagelo, hasta mi mente guarda silencio."
 pam_tenet_events.0010.b: "Dejad que me libre de la visión del mundo."
 pam_tenet_events.0010.c: "Quitad el apetito y el pecado se irá con él."
