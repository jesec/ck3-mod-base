l_spanish:
 game_concept_puppet: "Títere"
 game_concept_puppets: "Títeres"
 game_concept_puppeted: "Manipulado"
 game_concept_puppeting: "Manipular"
 game_concept_puppet_type: "Tipo de títere"
 game_concept_puppet_types: "Tipos de títeres"
 game_concept_puppet_type_desc: "Todo [puppet|El] tiene siempre un tipo que determina las acciones que puede emprender por ti.\n\nSi bien la mayoría de sus acciones especiales son compartidas, cada $game_concept_puppet_type$ tiene acciones únicas solo disponibles para ese tipo.\n\nPor ejemplo, un [clerical_puppet|El] puede [excommunicate|El] a alguien por ti, mientras que a un [external_ruler_puppet|El] se le puede obligar a liberar a un [tributary|El] o a divorciarse de su [spouse|El].\n\nSolo puedes tener un $game_concept_puppet$ de cada tipo."
 game_concept_puppet_desc: "Un títere es un [character|El] bajo el control de un [puppeteer|El], que puede llevar a cabo acciones especiales de títere a través de este.\n\nActuar mediante un títere abre puertas que de otro modo permanecerían cerradas: un [clerical_puppet|El] puede solicitar [clerical_titles|El] o una [excommunication|El] en tu nombre, mientras que a un [external_ruler_puppet|El] se le puede obligar a liberar [tributaries|El], conceder la independencia o divorciarse de su [spouse|El].\n\nLas acciones disponibles dependen del [puppet_type|El]."
 game_concept_puppeteer: "Titiritero"
 game_concept_puppeteers: "Titiriteros"
 game_concept_puppeteer_possessive: "del titiritero"
 game_concept_puppeteers_possessive: "de los titiriteros"
 game_concept_puppeteer_desc: "Un titiritero es un [character|El] que ejerce control sobre uno o más [puppets|El].\n\nAl actuar a través de sus títeres, el titiritero ostenta poderes que su posición no le proporciona, como el alcance del [clergy|El] o la autoridad de otro [realm|El]."
 game_concept_clerical_puppet: "Clérigo del señorío títere"
 game_concept_clerical_puppets: "Clérigos del señorío títeres"
 game_concept_clerical_puppet_desc: "Un [realm_priest|El] que es un [puppet|El] de su [liege|El].\n\nA través de este, su titiritero puede inmiscuirse en los asuntos de la [faith|El]: hacer peticiones al [head_of_faith|El] para solicitar [clerical_titles|El] o una [excommunication|El], gestionar [holy_sites|El], fundar un [rite|El] nuevo o celebrar un [ecumenical_council|El]."
 game_concept_external_clerical_puppet: "Gobernante clerical títere"
 game_concept_external_clerical_puppets: "Gobernantes clericales títeres"
 game_concept_external_clerical_puppet_desc: "Un miembro poderoso del [clergy|El] —un [archbishop|El] o hasta el [head_of_faith|El]— que se ha convertido en el [puppet|El] de otro [ruler|El].\n\nCuanto más poderoso es el clérigo, mayor el alcance: un cabeza de la fe manipulado puede [excommunicate|El] a tus enemigos, nombrar [cardinals|El], conceder un [pressed_claim|El] o incitar a una [holy_war|El] por ti."
 game_concept_external_ruler_puppet: "Gobernante secular títere"
 game_concept_external_ruler_puppets: "Gobernantes seculares títeres"
 game_concept_external_ruler_puppet_desc: "Un [ruler|El] no [Concept('clergy', 'clerical')|E] que se ha convertido en [puppet|El] de otro [character|El].\n\nMediante este títere, puedes interferir en los asuntos de otros [realms|El]; por ejemplo, usando [schemes|El] o [Concept('imprisonment', 'encarcelamientos')|E].\n\n\nPara conseguir este tipo de títeres, hay que usar la [interaction|El] #V $make_external_ruler_puppet_interaction$#!, que se desbloquea si se cumple al menos una de estas condiciones:\n$BULLET_WITH_TAB$Eres un [vassal|El] [Concept('clergy', 'clerical')|E] del objetivo\n$BULLET_WITH_TAB$Eres un [GetTrait('seducer').GetName( GetNullCharacter )|l] y el objetivo es tu [lover|El] o tu [soulmate|El] si el objetivo tiene nivel de [king|El] o superior\n$BULLET_WITH_TAB$Eres un [GetTrait('torturer').GetName( GetNullCharacter )|l] y tienes al objetivo en tu [dungeon|El]\n$BULLET_WITH_TAB$Eres alguien de [GetTrait('family_first').GetName( GetNullCharacter )|l] y el objetivo es un [Concept('close_family', 'familiar cercano')|E] tuyo\n$BULLET_WITH_TAB$Eres un [GetTrait('diplomat').GetName( GetNullCharacter )|l] y el objetivo es un [independent_ruler|El]\n$BULLET_WITH_TAB$Eres [GetTrait('gallant').GetName( GetNullCharacter )|l] y el objetivo es tu [spouse|El]\n$BULLET_WITH_TAB$Eres [diarch|El] del objetivo en una [entrenched_regency|El]"
 game_concept_ecumenical_council: "Concilio ecuménico"
 game_concept_ecumenical_council_desc: "Un $game_concept_ecumenical_council$ es una [activity|El] en la cual el sumo [clergy|El] de toda la cristiandad se reúne para acordar el futuro de la Iglesia.\n\nA través de debates consecutivos, los prelados reunidos llegan a una decisión sobre el [tenet_status|El] de los [core_tenets|El] disputados: pueden declararlos [Concept('permitted_tenet_status', 'permitidos')|E], [Concept('prohibited_tenet_status', 'prohibidos')|E] o elevarlos al [Concept('core_tenet_status', 'estatus de dogma principal')|E] y fijar las [doctrines|El] de la [faith|El]."
 game_concept_ecumenical_councils: "Concilios ecuménicos"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "Cisma"
 game_concept_schism_desc: "El Gran $game_concept_schism$ es el momento en que la [faith|El] cristiana unificada se rompe en los [rites|El] romano y griego, y se divide en $catholic$ y $orthodox$.\n\nEs una amenaza cuando la [situation|El] de [the_christian_church|lE] entra en ciertos [the_christian_church_chapters_short|El] y los gobernantes de toda la cristiandad deben elegir un bando. A menos que las divisiones se solventen —o se fuerce una división— mediante [decisions|El], la separación será permanente cuando termine el capítulo."
 game_concept_schisms: "Cismas"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "Título clerical"
 game_concept_clerical_titles: "Títulos clericales"
 game_concept_clerical_title_desc: "$game_concept_clerical_title$ es aquel [title|El] [ecclesiastical|El] en posesión de un miembro del [clergy|El] que gobierna una [clerical_region|El] dentro de una [faith|El]. Para las fes [Concept('christian', 'cristianas')|E] asume la forma de [archdiocese|El].\n\nSu titular es el [religious_superior|El] del [clergy|El] en la región y normalmente recibe el título del [head_of_faith|El]."
 game_concept_the_christian_church: "La Iglesia cristiana"
 game_concept_the_christian_church_desc: "La Iglesia cristiana es el cuerpo eclesiástico que supervisa y guía a los seguidores de Jesucristo, representada como una [situation|El] que progresa por una secuencia de [the_christian_church_chapters_short|El].\n\nSus límites abarcan toda [archdiocese|El] del mundo; todo [ruler|El] [christian|El] de grado [county|El] o superior con alguna parte de su [realm|El] dentro de una archidiócesis es miembro, ya sea clerical o secular."
 game_concept_christendom: "Cristiandad"
 game_concept_christendom_desc: "La $game_concept_christendom$ engloba a los [realm|El]s de todos los [ruler|El]s [christian|El]s [independent|El]s que pertenezcan a la [situation|El] de [the_christian_church|El]."
 game_concept_christian: "Cristiano"
 game_concept_christians: "Cristianos"
 game_concept_christian_possessive: "del cristiano"
 game_concept_christian_desc: "Seguidor de la [religion|El] cristiana."
 game_concept_papal_bull: "Bula papal"
 game_concept_papal_bulls: "Bulas papales"
 game_concept_bull: "Bula"
 game_concept_bulls: "Bulas"
 game_concept_papal_bull_desc: "Una bula papal es un decreto solemne proclamado por el [head_of_faith|El] de una [faith|El] [Concept('christian', 'cristiana')|E], que porta la autoridad completa de [the_christian_church|El] tras la voluntad de su autor.\n\nUn [head_of_faith|El] cristiano con bastante [church_authority|El] puede proclamar una con la [decision|El] [GetDecisionWithKey('enact_a_bull_decision').GetName], a cambio de [piety|El] para:\n\n$EFFECT_LIST_BULLET$Llamar a una [great_holy_war|El]\n$EFFECT_LIST_BULLET$Denunciar un [rite|El] como [heresy|El]\n$EFFECT_LIST_BULLET$Declarar que un [core_tenet|El] es [permitted_tenet_status|El] o [prohibited_tenet_status|El]"
 game_concept_situation_the_christian_church_phase: "Capítulo de la Iglesia cristiana"
 game_concept_the_christian_church_chapter_short: "Capítulo"
 game_concept_the_christian_church_chapters_short: "Capítulos"
 game_concept_situation_the_christian_church_phases: "Capítulos de la Iglesia cristiana"
 game_concept_situation_the_christian_church_phase_desc: "Los capítulos son las [situation_phases|El] de [the_christian_church|El]. Hay siete capítulos en total, organizados en cuatro [the_christian_church_chapter_types|El]."
 game_concept_the_christian_church_chapter_type: "Tipo de capítulo"
 game_concept_the_christian_church_chapter_types: "Tipos de capítulo"
 game_concept_the_christian_church_chapter_type_desc: "Hay cuatro $game_concept_the_christian_church_chapter_types$ en [the_christian_church|El]; se clasifican en [situation_the_christian_church_phases|El].\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|El], [the_christian_church_crisis_short|El], [the_christian_church_zeal_short|El] y [the_christian_church_stability_short|El]"
 game_concept_the_christian_church_unstable: "Capítulo de inestabilidad"
 game_concept_the_christian_church_unstable_short: "Inestabilidad"
 game_concept_the_christian_church_unstable_desc: "Un #high $game_concept_the_christian_church_unstable$#! de [the_christian_church|El] es uno en el cual hay poca obediencia:\n\nEs más fácil persuadir a los [rulers|El] para pasar a un [rite|El] distinto, las excomuniones son más frecuentes y el [gold|El] se puede gastar en beneficio propio.\n\n#high $fragile_unity$#! y #high $reform_phase$#! son [the_christian_church_chapters_short|El] de $game_concept_the_christian_church_unstable_short$."
 game_concept_the_christian_church_zeal: "Capítulo de celo"
 game_concept_the_christian_church_zeal_short: "Celo"
 game_concept_the_christian_church_zeal_desc: "Un #high $game_concept_the_christian_church_zeal$#! aviva el fuego hacia el exterior:\n\nPuede haber conversiones en masa, las [great_holy_wars|El] pueden ser más comunes, las [papal_bulls|El] pueden ser más frecuentes y la conversión a una [faith|El], más fácil.\n\n#high $conversion_phase$#! y #high $crusade_phase$#! son [the_christian_church_chapters_short|El] de $game_concept_the_christian_church_zeal_short$."
 game_concept_the_christian_church_stability: "Capítulo de estabilidad"
 game_concept_the_christian_church_stability_short: "Estabilidad"
 game_concept_the_christian_church_stability_desc: "Un #high $game_concept_the_christian_church_stability$#! es una realidad poco común para [the_christian_church|El]:\n\nResulta más barato construir una [temple_holding|El], las grandes catedrales progresan más deprisa, es más probable que los [characters|El] lleguen a tener un carácter [GetTrait('devoted').GetName( GetNullCharacter )|l] y el Gran Cisma se puede reparar.\n\n#high $concord$#! es el único $game_concept_the_christian_church_stability$."
 game_concept_the_christian_church_crisis: "Capítulo de crisis"
 game_concept_the_christian_church_crisis_short: "Crisis"
 game_concept_the_christian_church_crisis_desc: "Un #high $game_concept_the_christian_church_crisis$#! es aquel donde [the_christian_church|El] está más abrasada:\n\nLas indulgencias pueden ser más baratas, los [ecumenical_councils|El] más frecuentes, los [rulers|El] pueden nombrar a su propio [court_chaplain|El], los [Concept('clergy', 'clérigos')|El] se pueden casar, el [head_of_faith|El] puede negarse a celebrar una [anointment|El] y los [taxes|El] pueden sufrir.\n\n#high $saeculum_obscurum$#! y #high $investiture_crisis$#! son [the_christian_church_chapters_short|El] de $game_concept_the_christian_church_crisis_short$."
 game_concept_head_of_rite: "Cabeza del rito"
 game_concept_head_of_rite_desc: "El [character|El] principal de un [rite|El] es el [head_of_faith|El] si lo sigue; si no, el titular de la [clerical_region|El] donde el rito tenga más seguimiento y, sin otra alternativa, el [ruler|El] que reine sobre la mayoría de [counties|El] [rite_possessive|E].\n\nSolo el $game_concept_head_of_rite$ puede modificar los [core_tenets|El] y [doctrines|El] [rite_possessive|E] y es este quien habla por su rebaño cuando la Iglesia tiende al [schism|El]."
 game_concept_ecclesiastical: "Eclesiástico"
 game_concept_ecclesiastical_government: "Gobierno eclesiástico"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "El $game_concept_ecclesiastical$ es una [government_form|El] [Concept('theocratic', 'teocrática')|E] en posesión de [rulers|El] [Concept('clergy', 'clericales')|E] [Concept('christian', 'cristianos')|E] como [bishops|El] y [archbishops|El].\n\nLa mayoría de los gobernantes eclesiásticos son [vassals|El] teocráticos cuyas [temple_holdings|El] son [Concept('lease', 'arrendamientos')|E] de un [liege|El] secular y responden ante el [head_of_faith|El], aunque un [bishop|El] que posea [titles|El] [Concept('landed', 'con tierras')|E] no [Concept('leased', 'arrendadas')|E] puede reinar como [ruler|El] eclesiástico [independent|El] por derecho propio. El poder que tal gobernante tenga sobre sus propios [vassals|El] se ve determinado por su [church_authority|El]."
 game_concept_lease_contract: "Contrato de arrendamiento"
 game_concept_lease_contract_desc: "Las condiciones legales por las cuales un personaje [Concept( 'leasing', 'arrenda' )|E] un título. También determina quién es su [religious_superior|El]."
 game_concept_church_obligations: "Obligaciones de la iglesia"
 game_concept_church_obligations_desc: "Las obligaciones de la iglesia representan las obligaciones combinadas sobre los ingresos de una [church_holding|El]. Estas se pagan al [superior|El], [head_of_faith|El] o el [ruler|El] secular local. Un ejemplo es la [church_centralization|El] y las [secular_obligations|El]."
 game_concept_church_centralization: "Centralización de la iglesia"
 game_concept_minimal_centralization: "Centralización mínima"
 game_concept_mild_centralization: "Centralización media"
 game_concept_strong_centralization: "Centralización fuerte"
 game_concept_church_centralization_desc: "La $game_concept_church_centralization$ representa hasta qué punto la Iglesia ha adoptado la autoridad centralizada y las estructuras financieras. Una centralización más fuerte significa que más ingresos ascienden por la jerarquía clerical.\n\nLos tipos son:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "Obligaciones seculares"
 game_concept_personal_obligations: "Obligaciones personales"
 game_concept_fixed_obligations: "Obligaciones fijas"
 game_concept_secular_obligations_desc: "Las $game_concept_secular_obligations$ representan cómo se decide qué cantidad de ingresos de las [church_holdings|El] pertenece al [secular_ruler|El].\n\nLos tipos son:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nAdemás, en algunos capítulos los gobernantes seculares ejercen poder local sobre la Iglesia:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "Superior religioso"
 game_concept_religious_superiors: "Superiores religiosos"
 game_concept_superior: "Superior"
 game_concept_religious_superior_desc: "Un superior religioso es un [character|El] que posee jurisdicción religiosa sobre uno o más clérigos [Concept( 'subordinate', 'subordinados' )|E] en una estructura religiosa jerárquica."
 game_concept_religious_subordinate: "Subordinado religioso"
 game_concept_religious_subordinates: "Subordinados religiosos"
 game_concept_subordinate: "Subordinado"
 game_concept_subordinates: "Subordinados"
 game_concept_religious_subordinate_desc: "Un subordinado religioso es un [character|El] con un [religious_superior|El] dentro de una estructura jerárquica religiosa."
 game_concept_clerical_region: "Región clerical"
 game_concept_clerical_regions: "Regiones clericales"
 game_concept_clerical_region_possessive: "de la región clerical"
 game_concept_clerical_regions_possessive: "de las regiones clericales"
 game_concept_clerical_region_desc: "Una región clerical es una región geográfica bajo la jurisdicción de un [clerical_title|El]. Cualquier miembro del clero dentro de la región será [subordinate|El] del poseedor del [title|El] asociado a la región.\n\nUn [ruler|El] pertenece a la región clerical que contenga su [county|El] [capital|El], y se funda una nueva región en la [capital|El] del [primary_title|El] de su fundador. La región clerical puede abarcar múltiples [realms|El] y tener subordinados que estén en distintos señoríos.\n\nUn $game_concept_ruler$ solo puede poseer una $game_concept_clerical_region$ a la vez. Si al gobernante se le concede una región nueva, perderá toda la tierra poseída en los confines de la anterior."
 game_concept_clerical_region_capital: "Capital de la región clerical"
 game_concept_clerical_region_capitals: "Capitales de regiones clericales"
 game_concept_clerical_region_capital_desc: "La capital de la región clerical es el [county|El] sobre el que se fundó una [clerical_region|El] en un [ecclesiastical_estate|El], que actúa como sede del [clerical_title|El] que gobierna la región. Al contrario que una [de_jure_capital|El], está fijada a la región y no se puede trasladar."
 clerical_electors: "Cardenales"
 game_concept_archdiocese: "Archidiócesis"
 game_concept_archdioceses: "Archidiócesis"
 game_concept_archdiocese_desc: "La archidiócesis es la forma [Concept('christian', 'cristiana')|E] de una [clerical_region|El], un dominio eclesiástico en posesión de un [archbishop|El] en su [clerical_title|El] y asentado en un [county|El] capital, donde se puede construir una [grand_cathedral|El].\n\nUn [ruler|El] [christian|El] responde en asuntos espirituales ante el [archbishop|El] de la archidiócesis que contenga su [county|El] [capital|El], y el territorio sometido a las archidiócesis constituye en su conjunto la [situation|El] de [the_christian_church|El]."
 game_concept_grand_cathedral: "Gran catedral"
 game_concept_grand_cathedrals: "Grandes catedrales"
 game_concept_grand_cathedral_desc: "Una gran catedral es un [great_building|El] levantado mediante un [great_project|El] en la capital de una [archdiocese|El], la sede de su [archbishop|El].\n\nConstruir la primera catedral es un acto monumental de devoción: su fundador gana [piety|El], [legitimacy|El] y [spiritual_fulfillment|El] duraderas, una casilla extra de [personal_tenet|El] y una bonificación permanente en su [opinion|El] por parte de otros de su misma [faith|El]. Una vez construida, atrae peregrinos cristianos de toda la [christendom|El], extiende el [cathedral_complex|El] del titular y más adelante se puede ampliar a [GetBuilding('great_project_cathedral_02').GetName|Vl] o [GetBuilding('great_project_cathedral_03').GetName|Vl]."
 game_concept_monastic_holy_order: "Orden monástica"
 game_concept_monastic_holy_orders: "Órdenes monásticas"
 game_concept_monastic_holy_order_possessive: "de la ordenes monásticas"
 game_concept_monastic_holy_orders_possessive: "de las órdenes monásticas"
 game_concept_monastic: "Monástico"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "Una orden monástica es un tipo de [Concept('holy_order', 'orden religiosa')|E] dedicada a la oración, el aprendizaje y la difusión de un solo [core_tenet|El]. Pertenece al [rite|El] de su fundador y defiende los [core_tenets|El] [rite_possessive|E] en cuestión para propagar su práctica entre los fieles.\n\nDirigida por su [archabbot|El], una orden monástica se sustenta con las [temple_holdings|El] y el [gold|El] que conceden sus [monastic_order_patrons|El]. A cambio, la orden proporciona [spiritual_fulfillment|El] y [piety|El].\n\nTodo [ruler|El] cuya [faith|El] permita el monacato puede fundar una con la [decision|El] #high Fundar orden monástica#!."
 game_concept_monastic_order_patron: "Patrón de orden monástica"
 game_concept_monastic_order_patrons: "Patrones de orden monástica"
 game_concept_monastic_order_patronize: "Patrocinar"
 game_concept_monastic_order_patronized: "Patrocinado"
 game_concept_monastic_order_patronage: "Patronazgo"
 game_concept_monastic_order_patron_desc: "El patrón de una orden monástica es un [ruler|El] [ecclesiastical|El] o secular de [title_tier|El] [duchy|El] o superior de que sostiene una [monastic_holy_order|El], normalmente, el gobernante que la fundó. El patrón dota a la orden de riqueza terrenal al arrendarle [temple_holdings|El] y donar [gold|El] a sus arcas.\n\nA cambio de esta generosidad, el patrón gana [piety|El] y [spiritual_fulfillment|El]. Además también pueden controlar al líder de la orden y hacerle llevar a cabo interacciones [Concept('clerical', 'clericales')|E] como [puppet|El]."
 game_concept_mendicant: "Mendicante"
 game_concept_rite: "Rito"
 game_concept_rite_possessive: "del rito"
 game_concept_rites_possessive: "de los ritos"
 game_concept_rite_desc: "Un rito es una rama de una [faith|El]: una variación local de sus prácticas religiosas dirigida por un [head_of_rite|El] y seguida por sus propios [counties|El] y [characters|El]. Toda fe tiene un [mainline_rite|El] y puede desarrollar varios más.\n\nUn rito se define por los [core_tenets|El] y [doctrines|El] que defiende. Una fe define si un dogma es [permitted_tenet_status|El] o [prohibited_tenet_status|El] según su [mainline_rite|El], y cuanto más se opongan a estos juicios las decisiones [rite_possessive|El], mayor será la [rite_divergence|El]: los ritos divergentes socavan el [fervor|El] [faithpossessive|El], pueden verse como una [heresy|El], y con #V 100#! de [divergence|El], separarse como una [faith|El] propia.\n\nLos piadosos pueden fundar nuevos ritos, se puede influir a los [rulers|El] para que pasen de un rito a otro y solo el [head_of_rite|El] puede modificar el rito."
 game_concept_rites: "Ritos"
 game_concept_archabbot: "Abad"
 game_concept_archabbot_desc: "$game_concept_archabbot$ es el [ruler|El] de una [monastic_holy_order|El] y [Concept('head_of_rite', 'cabeza')|E] del [rite|El] que defiende su orden al dirigir a sus miembros en el estudio, contemplación y difusión de sus [core_tenets|El].\n\nUna orden puede tener el sustento de un [Concept('monastic_order_patron', 'patrón')|E], cuyo [monastic_order_patronage|El] le proporciona riquezas e influencia.\n\nA la muerte del $game_concept_archabbot$, sus [titles|El] pasan a un sucesor, normalmente el [courtier|El] con mayor [learning|El]."
 game_concept_archbishop: "Arzobispo"
 game_concept_archbishops: "Arzobispos"
 game_concept_archbishop_possessive: "del arzobispo"
 game_concept_archbishops_possessive: "de los arzobispos"
 game_concept_archbishop_desc: "Un arzobispo es el titular cristiano de una [archdiocese|El], un [clerical_title|El] de nivel ducado cuya [clerical_region|El] puede extenderse a lo largo de varios [realms|El].\n\nComo [religious_superior|El] de [bishops|El] y [clergy|El] menor de la región, un arzobispo se sitúa por encima de un [bishop|El] normal y a su vez responde ante el [head_of_faith|El]."
 game_concept_bishop: "obispo"
 game_concept_bishops: "obispos"
 game_concept_bishop_possessive: "del obispo"
 game_concept_bishops_possessive: "de los obispos"
 game_concept_bishop_desc: "$game_concept_bishop$ es un miembro del [clergy|El] de una [faith|El] cristiana que posee o arrienda [temple_holdings|El].\n\nEl obispo reside en una [archdiocese|El] y responde ante su [archbishop|El] como [religious_superior|El]. Un obispo sin tierras con títulos [Concept('leased', 'arrendados')|E] sirve bajo un [liege|El] secular; un obispo con [titles|El] [Concept('landed', 'con tierras')|E] no [Concept('leased', 'arrendados')|E] puede reinar como [ruler|El] [ecclesiastical|El]."
 game_concept_rite_divergence: "Divergencia"
 game_concept_rite_divergent: "Divergente"
 game_concept_divergence: "Divergencia"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "La divergencia mide hasta qué punto se han separado los [core_tenets|El] y [doctrines|El] [rite_possessive|E] de la [faith|El] matriz. Un rito que adopte dogmas [prohibited_tenet_status|El]s como [core_tenet_status|El] es más divergente.\n\nUna divergencia alta debilita el [fervor|El] de la fe matriz y la aparición de [heresy|El] se vuelve más común. Un rito que alcance el #V 100#! de divergencia será declarado automáticamente herejía y se convertirá en una [faith|El] nueva."
 game_concept_spiritual_fulfillment: "Realización espiritual"
 game_concept_spiritual_fulfillment_desc: "La $game_concept_spiritual_fulfillment$ representa en qué medida se siente un [character|El] en paz respecto a su [faith|El].\n\nEl valor de referencia se calcula en función de los [traits|El] que tenga, y de si estos se consideran [Concept( 'sinful', 'pecaminosos' )|E] o [Concept( 'virtuous', 'virtuosos' )|E].\n\nLa $game_concept_spiritual_fulfillment$ se puede ganar o perder actuando de formas que la [faith|El] considere apropiadas, y se pueden adoptar [personal_tenets|El] para contrarrestar los rasgos negativos."
 game_concept_fulfillment: "Realización"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "Nivel de realización espiritual"
 game_concept_spiritual_fulfillment_levels: "Niveles de realización espiritual"
 game_concept_spiritual_fulfillment_level_desc: "La [spiritual_fulfillment|El] de un [character|El] se divide en $game_concept_spiritual_fulfillment_levels$ por umbrales, cada uno con sus efectos.\n\nLos niveles más bajos complican su vida y abaratan las acciones pecaminosas. Los niveles más elevados facilitan la devoción y abren nuevas opciones religiosas."
 game_concept_personal_tenet: "Dogma personal"
 game_concept_personal_tenet_desc: "$game_concept_personal_tenet$ es [Concept('core_tenet', 'aquel')|E] que un [ruler|El] adopta como parte central de su espiritualidad.\n\nAdoptar un $game_concept_personal_tenet$ que es [core_tenet_status|El] o que la [faith|El] ha [permitted_tenet_status|El] proporciona [spiritual_fulfillment|El], mientras que asumir uno [prohibited_tenet_status|El] generará un [secret|El]. Los $game_concept_personal_tenets$ también proporcionan efectos extras y desbloquean mecánicas especiales.\n\nLa cantidad de $game_concept_personal_tenets$ a los que un personaje se puede adherir se ve afectada por su [piety_level|El] y el [trait|El] [GetTrait('theologian').GetName( GetNullCharacter )]."
 game_concept_personal_tenets: "Dogmas personales"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "Cardenal"
 game_concept_cardinals: "Cardenales"
 game_concept_cardinal_possessive: "del cardenal"
 game_concept_cardinals_possessive: "de los cardenales"
 game_concept_cardinalate: "Cardenalato"
 game_concept_cardinalates: "Cardenalatos"
 game_concept_cardinal_desc: "Un miembro del [clergy|El] elegido por el papa para ayudarle a ejercer la voluntad de [the_christian_church|El]. Todos los miembros del [college_of_cardinals|E] son tanto candidatos como electores del papado y tienen una [papabile_score|El]."
 game_concept_college_of_cardinals: "Colegio Cardenalicio"
 game_concept_college_of_cardinals_desc: "El $game_concept_college_of_cardinals$ es el cuerpo de [cardinals|El] que da consejo al papa y elige al siguiente [head_of_faith|El] de [the_christian_church|El].\n\nTodo [cardinal|El] es tanto candidato como elector del papado."
 game_concept_papabile_score: "Puntuación de papa"
 game_concept_papabile_scores: "Puntuaciones de papa"
 game_concept_papabile_score_desc: "Todos los miembros del [college_of_cardinals|E] tienen una $game_concept_papabile_score$ que tiene en cuenta sus [traits|El], [piety_level|El], [rite|El] y la [opinion|El] de otros cardenales.\n\nLos [cardinals|El] con la mayor $game_concept_papabile_score$ pueden recibir más votos durante una elección papal.\n\nLa $game_concept_papabile_score$ puede aumentar mediante la [character_interaction|El] #high $increase_papabile_score_interaction$#! y la [decision|El] [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]."
 game_concept_mainline_rite: "Rito principal"
 game_concept_mainline_rite_desc: "El [rite|El] principal representa el conjunto de creencias más prominentes de una [faith|El]. Un $game_concept_rite$ que no pertenezca a la línea principal se considera [rite_divergent|El] de ese rito.\n\nQué $game_concept_rite$ se considera principal depende de si la $game_concept_faith$ tiene un [head_of_faith|El].\n\nSi lo tiene, el rito principal es aquel que siga ese personaje. Eso significa que puede cambiar cuando un sucesor de un $game_concept_rite$ diferente ocupe su lugar, lo que incluye un posible [challenger_hof|El].\n\nSin $game_concept_head_of_faith$, cualquier $game_concept_rite$ que acumule más [counties|El] seguidores que el principal, lo suplantará, siempre que controle por lo menos tantos [holy_sites|El] como el $game_concept_rite$ al que aspira a reemplazar."
 game_concept_mainline_rites: "Ritos principales"
 game_concept_mainline_rite_short: "Principal"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "Estatus de dogma"
 game_concept_tenet_status_desc: "El $game_concept_tenet_status$ describe la postura de un [rite|El] hacia un [core_tenet|El] o una [doctrine|El]. A ambos se les aplica la misma escala de cinco niveles, ordenados de menor a mayor compromiso:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|E]: el $game_concept_rite$ no es consciente de este $game_concept_core_tenet$ o $game_concept_doctrine$.\n$EFFECT_LIST_BULLET$[known_tenet_status|E]: el $game_concept_rite$ lo conoce, pero ni fomenta ni prohíbe su práctica.\n$EFFECT_LIST_BULLET$[permitted_tenet_status|E]: el $game_concept_rite$ aprueba su práctica.\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|E]: el $game_concept_rite$ prohíbe expresamente su práctica.\n$EFFECT_LIST_BULLET$[core_tenet_status|E]: el $game_concept_rite$ fomenta activamente la práctica del $game_concept_core_tenet$.\n\nEl estatus de un $game_concept_rite$ sobre cierto $game_concept_core_tenet$ o cierta $game_concept_doctrine$ decide si se puede elegir a la hora de crear o divergir un $game_concept_rite$, y si los [followers|El] sufrirán penalizaciones espirituales por tomar parte en ello.\n\nEs distinto del [tenet_knowledge|El] de un [character|El], que describe su consciencia personal más que la postura del $game_concept_rite$."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "Desconocido"
 game_concept_unknown_tenet_status_desc: "Un [tenet_status|El] $game_concept_unknown_tenet_status$ indica que el [rite|El] no es consciente en absoluto de este [core_tenet|El] o [doctrine|El]. Los [followers|El] del $game_concept_rite$ no lo conocen implícitamente y no pueden escogerlo a la hora de crear un $game_concept_rite$ nuevo ni como [personal_tenet|El]."
 game_concept_known_tenet_status: "Conocido"
 game_concept_known_tenet_status_desc: "Un [tenet_status|El] $game_concept_known_tenet_status$ indica que el [rite|El] conoce el [core_tenet|El] o la [doctrine|El], pero ni lo promueve ni permite su práctica. Se puede tener en cuenta a la hora de crear o divergir el $game_concept_rite$ y puede ascender a un [tenet_status|El] superior."
 game_concept_permitted_tenet_status: "Permitido"
 game_concept_permit_tenet_status: "Permitir"
 game_concept_permitted_tenet_status_desc: "Un [tenet_status|El] $game_concept_permitted_tenet_status$ indica que el [rite|El] aprueba este [core_tenet|El] o esta [doctrine|El] sin que lo promueva directamente. Un [character|El] del $game_concept_rite$ puede adoptar el $game_concept_core_tenet$ como [personal_tenet|El] sin una penalización espiritual."
 game_concept_prohibited_tenet_status: "Prohibido"
 game_concept_prohibit_tenet_status: "Prohibir"
 game_concept_prohibited_tenet_status_desc: "Un [tenet_status|El] $game_concept_prohibited_tenet_status$ significa que el [rite|El] prohíbe explícitamente este [core_tenet|El] o [doctrine|El]. El [character|El] del $game_concept_rite$ que adopte tal $game_concept_core_tenet$ como [personal_tenet|El] lo guardará en [secret|El], y el $game_concept_rite$ que adopte [core_tenets|El] [Concept('prohibited_tenet_status', 'prohibidos')|E] como [core_tenet_status|El] se vuelve más [rite_divergent|El] de su [faith|El]."
 game_concept_core_tenet_status: "Central"
 game_concept_core_tenet_status_desc: "Un [tenet_status|El] $game_concept_core_tenet_status$ indica que el [rite|El] promueve activamente este [core_tenet|El] o [doctrine|El] como una de las prácticas que lo definen. Todos los [followers|El] del $game_concept_rite$ están sometidos a sus efectos."
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "Conocimiento religioso"
 game_concept_doctrine_knowledge: "Conocimiento doctrinal"
 game_concept_rite_knowledge: "Conocimiento del rito"
 game_concept_agnostic_knowledge: "Conocimiento"
 game_concept_tenet_knowledge_desc: "Los personajes no conocen todos los detalles de cada práctica religiosa.\n\nSe pueden usar dogmas y doctrinas conocidos a la hora de crear un $game_concept_rite$ [rite_divergent|El], y se pueden adoptar como [personal_tenets|El]. Conocer todos los $game_concept_core_tenets$ y las $game_concept_doctrines$ de un $game_concept_rite$ facilita la conversión.\n\nTú conoces todos los [core_tenets|El] y [doctrines|El] de tu [faith|El]. Se pueden conseguir nuevos conocimientos a través de relaciones como [spouses|El] o [friends|El], en [Concept('traveling', 'viajes')|E], [activities|El] o con la [scheme|El] Estudio de rito."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "Consagrado"
 game_concept_enshrine: "Consagrar"
 game_concept_enshrined_desc: "Una [holy_relic|El] consagrada en un [holy_site|El] activa las bonificaciones de lugar sagrado y mejora las bonificaciones que otorga, aumentadas por los niveles totales de [rarity|El] de todos los artefactos consagrados.\n\nUn artefacto consagrado ya no pertenece a un personaje, pero el [holder|El], [top_liege|El] o el titular de la [clerical_region|El] del lugar sagrado pueden interactuar con este. El artefacto deja de deteriorarse. Solo puedes consagrar reliquias sagradas de tu [faith|El]; las reliquias sagradas consagradas de otras fes no proporcionan beneficios.\n\nPuede haber recompensas o costes relacionados con la consagración o la retirada de un artefacto consagrado."
 game_concept_holy_relic: "Reliquia sagrada"
 game_concept_holy_relics: "Reliquias sagradas"
 game_concept_holy_relic_desc: "$game_concept_holy_relic$ es aquel [artifact|El] posee un significado religioso para una [faith|El]. Una $game_concept_holy_relic$ se puede [Concept('enshrined', 'consagrar')|E] en un [holy_site|El] de esa fe para conseguir beneficios.\n\nAlgunos artefactos son inherentemente sagrados para una fe, pero también se pueden [Concept('sanctified', 'santificar')|E] para convertirse en una reliquia sagrada."
 game_concept_sanctified: "Santificado"
 game_concept_sanctify: "Santificar"
 game_concept_sanctifying: "Santificar"
 game_concept_sanctified_desc: "Santificar un [artifact|El] lo convierte en [holy_relic|El] para una [faith|El]. Un artefacto puede ser santificado por varias fes."
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Finca eclesiástica"
 game_concept_ecclesiastical_estates: "Fincas eclesiásticas"
 game_concept_ecclesiastical_estate_desc: "Una $game_concept_ecclesiastical_estate$ —o $game_concept_cathedral_complex$— es un tipo de [domicile|El] vinculado a un [clerical_title|El], que representa las propiedades más personales de un [archbishop|El] y su sede. El [clergy|El] menor de un [GetGovernment('ecclesiastical_government').GetName|l] debe llegar a la altura de tal [title|El] antes de que se le conceda una.\n\nAquí se pueden construir [ecclesiastical_estate_buildings|El] para aumentar la riqueza, [piety|El] y [spiritual_fulfillment|El] del titular. La $game_concept_ecclesiastical_estate$ no cambia de ubicación y la heredará el siguiente [holder|El] del título."
 game_concept_ecclesiastical_estate_building: "Edificio de finca eclesiástica"
 game_concept_ecclesiastical_estate_buildings: "Edificios de finca eclesiástica"
 game_concept_ecclesiastical_estate_building_desc: "Los $game_concept_ecclesiastical_estate_buildings$ son mejoras únicas y permanentes de una [ecclesiastical_estate|El].\n\nHay disponible una gran variedad de estructuras que el titular puede construir para generar ingresos privados, [piety|El], [spiritual_fulfillment|El] y acceder a una serie de [decisions|El], [interactions|El] y más."
 game_concept_cathedral_complex: "Complejo catedralicio"
 game_concept_cathedral_complexes: "Complejos catedralicios"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "Edificio de $game_concept_cathedral_complex$"
 game_concept_cathedral_complex_buildings: "Edificios de $game_concept_cathedral_complex$"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "Canonizado"
 game_concept_canonized_desc: "Un [character|El] que, a su muerte, ha sido proclamado santo o el equivalente de otra fe, como valí o ancestro venerado, por lo que gana el [trait|El] [GetTrait('saint').GetName( GetNullCharacter )].\n\nUna vida virtuosa puede acabar en $game_concept_canonization$: se solicita mediante una [decision|El], puede requerir la bendición del [head_of_faith|El] y se sella al consagrar el lugar de enterramiento del santo. A partir de ese momento, su lugar de descanso atrae a viajeros piadosos y sus restos pueden dar [holy_relics|El]."
 game_concept_canonization: "Canonización"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Santidad"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "Una [interaction|El] que refuerza un [unpressed_claim|El] y lo convierte en [pressed_claim|El] mediante el respaldo de un [ruler|El] [ecclesiastical|El] o [theocratic|El] relevante."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "Una [interaction|El] que proporciona un [claim|El] sobre un [title|El] que pertenece a otro [ruler|El]. Requiere la aceptación de un [character|El] [ecclesiastical|El] o [theocratic|El] relevante."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "Una [interaction|El] que facilita la transferencia pacífica de un [title|El] o [vassal|El] entre dos [rulers|El], la cual se basa en la aceptación del [ruler|El] objetivo y un intercesor secundario.\n\nLa negativa normalmente costará [piety|El] y [legitimacy|El] al receptor, así como un coste extra seleccionado por la parte implicada como método para obligar a su aceptación.\n\nEl intercesor, un gobernante [ecclesiastical|El] o [theocratic|El] relevante, puede tanto prohibir que esta interacción suceda como obligar a que se acepte con la [law|El] [GetLaw('church_authority_3').GetName]."
 game_concept_challenger_hof: "Cabeza de la fe antagonista"
 game_concept_antipope: "Antipapa"
 game_concept_challenger_hof_desc: "$game_concept_challenger_hof$ es un [head_of_faith|El] rival que se alza contra el $game_concept_head_of_faith$ del [mainline_rite|El].\n\nUn [ruler|El] puede patrocinar a un miembro de su [clergy|El] como $game_concept_challenger_hof$. En otros casos, un [ruler|El] [Concept('clergy', 'clerical')|E] o de una [faith|El] con un cabeza temporal de la fe puede proclamarse pretendiente\n\nUn $game_concept_challenger_hof$ patrocinado asume el [rite|El] de su patrocinador, se convierte en su [external_clerical_puppet|El] y le debe un [weak_hook|El].\n\nEl $game_concept_head_of_faith$ del $game_concept_mainline_rite$ no puede [excommunicate|El] a nadie que siga a un $game_concept_challenger_hof$: al patrocinador y a sus [vassals|El].\n\nTodo aquel que siga a un $game_concept_challenger_hof$ presenta sus peticiones clericales a este en lugar de al cabeza de la fe del rito principal; entre ellas estas [interactions|El]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nUn $game_concept_challenger_hof$ o su patrocinador pueden usar el [casus_belli|El] [pam_challenge_hof_cb|E] contra el $game_concept_head_of_faith$ legítimo.\n\n[kings|E] (o superiores) rivales de la misma [faith|El] pueden usar en su lugar el [pam_antiking_cb|El] contra un patrocinador y destronar al pretendiente rival."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "Desafío al cabeza de la fe"
 game_concept_pam_challenge_hof_cb_desc: "Un [casus_belli|El] empleado por un [challenger_hof|El] o su patrocinador contra el [head_of_faith|El] legítimo de su [faith|El]. La victoria impone al $game_concept_challenger_hof$ como $game_concept_head_of_faith$ y hace a su [rite|El] el [mainline_rite|El]. El patrocinador que gane la guerra y supere en nivel a su $game_concept_challenger_hof$ también lo asume como [vassal|El]."
 game_concept_pam_antiking_cb: "Derrocamiento del antipapa"
 game_concept_pam_antiking_cb_desc: "Un [casus_belli|El] disponible para [kings|El] [Concept('christian', 'cristianos')|E] y gobernantes de mayor nivel que ni patrocinan ni actúan como [challenger_hof|El]. Se libra contra un patrocinador [independent|El] de su propia [faith|El] para derrocar a un $game_concept_challenger_hof$ y ganarse la gratitud del [head_of_faith|El] legítimo."
 game_concept_petition_antipope_indulgences_interaction: "Buscar la indulgencia del antipapa"
 game_concept_petition_antipope_indulgences_interaction_desc: "Una [interaction|El] disponible para cualquiera que siga a un [challenger_hof|El]. Paga [gold|El] a tu $game_concept_antipope$ para obtener su perdón y [piety|El], evitando al [head_of_faith|El] del [mainline_rite|El]. Su patrocinador se acepta automáticamente."
 game_concept_petition_antipope_gold_interaction: "Pedir oro al antipapa"
 game_concept_petition_antipope_gold_interaction_desc: "Una [interaction|El] disponible para cualquiera que siga a un [challenger_hof|El]. Solicita [gold|El] a tu $game_concept_antipope$. Su patrocinador se acepta automáticamente."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "Una [decision|El] disponible para prelados y gobernantes poderosos que impulsa a [the_christian_church|El] al capítulo de su elección."
 game_concept_tenet_popularity: "Popularidad dogmática"
 game_concept_tenet_popularity_desc: "A medida que los [personal_tenets|El] se extienden dentro de una [faith|El], su práctica se hace más común. La $game_concept_tenet_popularity$ indica lo extendido que está un [core_tenet|El] y afecta a la probabilidad de que se elija como tema de debate en un [ecumenical_council|El] o como objetivo de una [papal_bull|El].\n\nCuanto mayor sea la popularidad de un dogma, más cantidad de [clergy|El] se pondrá de su parte cuando se debata en un [ecumenical_council|El]. Cuando un dogma alcance una $game_concept_tenet_popularity$ de #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#!, es muy probable que el [head_of_faith|El] lo proclame [permitted_tenet_status|El] con independencia de sus convicciones."
 game_concept_ecumenical_council_innovator: "Innovador"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Innovadores"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Los innovadores son [activity_guests_short|El] en la [activity|El] de [ecumenical_council|El] que votan con el [activity_host_short|El] en sus sugerencias de cambiar el estatus de un [core_tenet|El] o una [doctrine|El].\n\nSe oponen directamente a los [ec_conservatives|El], los invitados que votan en contra de cualquier cambio y buscan conservar el statu quo.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help Los [characters|El] a los que se les permite votar son: el [clergy|El], [rulers|El] con un [clerical_puppet|El] y el [activity_host|El]#!"
 game_concept_ecumenical_council_conservative: "Conservador"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Conservadores"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "Los conservadores son [activity_guests_short|El] en la [activity|El] de [ecumenical_council|El] que votan contra el [activity_host_short|El] en sus sugerencias de cambiar el estatus de un [core_tenet|El] o una [doctrine|El].\n\nSe oponen directamente a los [ec_innovators|El], los invitados que buscan dar carácter oficial a los cambios.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "Una [interaction|El] que los [rulers|El] [Concept('ecclesiastical', 'eclesiásticos')|E] usan para extender su [clerical_region|El] hacia los [counties|El] [de_jure|El] de un [duchy|El] adyacente.\n\nSolo es posible con la aprobación del [head_of_faith|El]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "Una [interaction|El] por la cual [rulers|El] [Concept('ecclesiastical', 'eclesiásticos')|E] pueden hacer que los gobernantes seculares de la misma [faith|El] declaren una [holy_war|El] a gobernantes de fes hostiles."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "Una [interaction|El] por la cual [rulers|El] [Concept('ecclesiastical', 'eclesiásticos')|E] pueden hacer que los gobernantes seculares de la misma [faith|El] declaren la [war|El] para reivindicar un [claim|El] sobre un [ruler|El] secular."
 game_concept_treasury_cardinal_budget: "Presupuesto cardenalicio"
 game_concept_treasury_cardinal_budget_short: "Cardenal"
 game_concept_treasury_cardinal_budget_benefices: "Beneficios cardenalicios"
 game_concept_treasury_cardinal_budget_desc: "Tesoro distribuido a los [cardinals|El] procedente de la tesorería central de la Iglesia que representa los [Glossary( 'beneficios', 'CARDINAL_BENEFICES_GLOSS' )] directos e indirectos que tienen asignados."
 CARDINAL_BENEFICES_GLOSS: "Los beneficios eran propiedades locales o lejanas, cargos o ingresos papales compartidos que se podían conceder a un miembro del clero #i in commendam#! (en confianza). Generaban unos ingresos, normalmente sin responsabilidades administrativas directas."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "Una [interaction|El] por la que una autoridad [clerical|El] cambia la comodidad de la [spiritual_fulfillment|El] por un [hook|El]"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "Una [interaction|El] que exige a otro [character|El] que realice el voto de castidad y asuma una penalización de [fertility|El] a largo plazo."
 game_concept_military_holy_order: "Orden militar"
 game_concept_military_holy_orders: "Órdenes militares"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "de la orden militar"
 game_concept_military_holy_orders_possessive: "de las órdenes militares"
 game_concept_military_holy_order_desc: "Una $game_concept_military_holy_order$ es un tipo de [holy_order|El] integrada por guerreros que han jurado defender y extender las tierras de su [faith|El].\n\nLos gobernantes de la misma fe pueden contratar a una orden si están en [war|El] contra $game_concept_faith$ [Concept( 'faith_hostile', 'hostiles' )|E] o [Concept( 'faith_evil', 'malignas' )|E] a cambio de [piety|El]. Cuando termine esa guerra, la orden dejará de luchar por esos gobernantes.\n\nUna orden puede tener un [Concept( 'military_holy_order_patron', 'patrón' )|E], que no tiene que pagar para utilizar sus servicios."
 game_concept_military_holy_order_patron: "Patrón de orden militar"
 game_concept_military_holy_order_patronage: "Patronazgo de orden militar"
 game_concept_military_holy_order_patronize: "Patrocinar"
 game_concept_military_holy_order_patron_desc: "El patrón de una [military_holy_order|El] es un [ruler|El] de [title_tier|El] [duke|El] o superior que comparte [faith|El] con esta y cuyo [realm|El] contiene la capital de la orden.\n\nUn patrón puede pedir el apoyo gratuito de la orden militar contra los enemigos religiosos en lugar de pagar [piety|El].\n\nEl patronazgo se puede perder ante [vassals|El] de [title_tier|E] [duke|El] o superior, si se cede la capital de la orden."
