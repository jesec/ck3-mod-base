l_spanish:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "Una práctica más allá de tu propia [faith|El] se ha alojado en tus pensamientos y has ganado [agnostic_knowledge|El] del [core_tenet|El] [pam_sf_seeded_tenet.GetBaseName]"
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsFemale, 'ama', 'apa' )][Select_CString(CHARACTER.IsLocalPlayer, 'drinaste', 'drinó')] a [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu personaje', TARGET_CHARACTER.GetShortUIName)] y el parentesco espiritual se convirtió en amistad."
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString( TARGET_CHARACTER.IsFemale, 'ama', 'apa' )][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'drinaste', 'drinó')] a [Select_CString( CHARACTER.IsLocalPlayer, 'tu personaje', CHARACTER.GetShortUIName)] y el parentesco espiritual se convirtió en amistad."
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'os unisteis', 'se unieron')] por una convicción de fe compartida"
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'entablasteis', 'entablaron')] la más íntima de las amistades, un vínculo ahondado por una convicción de fe compartida."
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'protegiste', 'protegió' )] a [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu persona', TARGET_CHARACTER.GetShortUIName )] de la persecución religiosa."
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'protegiste', 'protegió' )] a [Select_CString( CHARACTER.IsLocalPlayer, 'tu persona', CHARACTER.GetShortUIName )] de la persecución religiosa."
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'os hicisteis', 'se hicieron')] amantes; una atracción nacida de una convicción de fe compartida."
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'os hicisteis', 'se hicieron')] amantes en una noche de sagrado desenfreno compartido."
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'encontrasteis', 'encontraron')] más que absolución en el confesionario y [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'os hicisteis', 'se hicieron')] amantes."
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'os hicisteis', 'se hicieron')] amantes tras debatir sobre las complejidades de la fe."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName] y [TARGET_CHARACTER.GetShortUIName] [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'os hicisteis', 'se hicieron')] almas gemelas, un amor ahondado por una convicción de fe compartida."
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'vendiste', 'vendió')] el santo oficio de [Select_CString( TARGET_CHARACTER.IsLocalPlayer, 'tu personaje', TARGET_CHARACTER.GetShortUIName)] a un extraño que podía pagarlo."
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'vendiste', 'vendió')] el santo oficio de [Select_CString( CHARACTER.IsLocalPlayer, 'tu personaje', CHARACTER.GetShortUIName)] a un extraño que podía pagarlo."
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'obligaste', 'obligó')] a [CHARACTER.GetShortUIName] a entrar en un monasterio y le [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'hiciste', 'hizo')] tomar los votos."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'obligaste', 'obligó')] a [TARGET_CHARACTER.GetShortUIName] a entrar en un monasterio y le [Select_CString(CHARACTER.IsLocalPlayer, 'hiciste', 'hizo')] tomar los votos."
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "reverendo padre"
 pam_my_liege_reverend_mother: "reverenda madre"
 pam_my_liege_captain: "capitán"
 pam_my_liege_khan: "gran kan"
 pam_my_liege_khatun: "gran khatun"
 pam_my_liege_chieftain: "mi cacique"
 pam_my_liege_serene_lord: "serenísimo señor"
 pam_my_liege_serene_lady: "serenísima señora"
 pam_my_liege_lord: "mi señor"
 pam_my_liege_lady: "mi señora"
 pam_my_liege_liege: "mi señor"
 pam_secular_faith_events.0001.t: "Humo sagrado"
 pam_secular_faith_events.0001.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], transporta el incensario por el pasillo. Un humo sagrado asciende hacia las vigas y lleva consigo las oraciones murmuradas de la congregación.\n\nPor un instante, la creación entera parece llegar a [ROOT.Char.GetFaith.PositiveAfterLife] y yo con ella."
 pam_secular_faith_events.0001.a: "Me perderé en la oración."
 pam_secular_faith_events.0001.b: "Este rito se debe dedicar a [ROOT.Char.GetFaith.WealthGodName]."
 pam_secular_faith_events.0001.c: "Mi [ROOT.Char.Custom('GetCourt')|l] debe participar en esta devoción."
 pam_secular_faith_events.0002.t: "Pikuach nefesh"
 pam_secular_faith_events.0002.desc: "¡[traveler_in_danger.Custom('ES_ElLa')|U] [traveler_in_danger.GetTitledFirstName|l], un[traveler_in_danger.Custom('ES_XA')] viajer[traveler_in_danger.Custom('ES_OA')] que recorría mis tierras, ha sido atacad[traveler_in_danger.Custom('ES_OA')] por bandidos en [background_terrain_scope.GetName]!\n\nSu vida corre peligro, pero está prohibido tomar las armas el día sagrado [ROOT.Char.GetFaith.HighGodNamePossessive]. No me corresponde romper el sabbat. Si espero hasta el anochecer, podré cabalgar, pero solo para enterrar[traveler_in_danger.GetHerHim].\n\nSin embargo, ¿puedo quedarme sin hacer nada cuando hay una vida en juego?"
 pam_secular_faith_events.0002.a: "Una vida pesa más que cualquier otra cosa. A los caballos."
 pam_secular_faith_events.0002.b: "Debo consultar con mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )|l] [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0002.c: "No romperé el sabbat."
 pam_secular_faith_events.0003.t: "Una visión en la noche"
 pam_secular_faith_events.0003.desc: "Despierto dominad[ROOT.Char.Custom('ES_OA')] por algo más que un sueño: una columna de fuego, una voz que conocía mi nombre, un rostro que no puedo olvidar…\n\n¿Fue [ROOT.Char.GetFaith.HighGodName] que vino a mí [ROOT.Char.GetFaith.HealthGodName]? O [ROOT.Char.GetFaith.DevilName] con un diestro disfraz…\n\nTal vez solo haya sido un humor agitado de la sangre."
 pam_secular_faith_events.0003.a: "La voz susurraba verdades benditas…"
 pam_secular_faith_events.0003.b: "Humores agitados… He de leer sobre esos casos."
 pam_secular_faith_events.0003.c: "¡Mi [ROOT.Char.Custom('GetCourt')|l] debe oír lo que he visto!"
 pam_secular_faith_events.0004.t: "Verdad prohibida"
 pam_secular_faith_events.0004.desc: "No puedo dormir, me asaltan las dudas y recorro [ROOT.Char.Custom('ResidenceBuildingHallsType')] en tinieblas de mi [ROOT.Char.Custom('ResidenceBuilding')|l].\n\nLa mente sigue regresando a algo que mi fe condena: [pam_sf_forbidden_tenet.GetBaseName]. Debería preocuparme, pero me siento como si hubiera cierta verdad justa en esta creencia y no puedo desterrar este pensamiento."
 pam_secular_faith_events.0004.a: "Me aferraré a esta verdad…, pero en silencio."
 pam_secular_faith_events.0004.b: "No. No me descarriaré."
 pam_secular_faith_events.0005.t: "A la luz de las velas"
 pam_secular_faith_events.0005.desc_intro: "Se supone que el estudio nocturno me calmaría la mente, pero le sigo dando vueltas a un párrafo.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "Se refiere al dogma que llaman [pam_sf_revelation_tenet.GetBaseName], una práctica que mi propia fe jamás aceptaría. Me digo que es algo propio de bárbaros."
 pam_secular_faith_events.0005.desc_doctrine: "Se refiere a la doctrina de [pam_sf_revelation_doctrine.GetDescriptiveName( ROOT.Char.GetFaith.Self )|l], una enseñanza que mi propia fe jamás aceptaría. Me digo que es un error."
 pam_secular_faith_events.0005.desc_end: "Y, sin embargo, a la luz de las velas, creo entender cómo otra alma puede aferrarse a algo así."
 pam_secular_faith_events.0005.a: "Debo poner mis pensamientos por escrito."
 pam_secular_faith_events.0005.b: "No hay nada de malo en entender."
 pam_secular_faith_events.0005.c: "La oración expulsará estos pensamientos."
 pam_secular_faith_events.0006.t: "Huesos de un santo"
 pam_secular_faith_events.0006.desc: "Un[relic_seller.Custom('ES_XA')] peregrin[relic_seller.Custom('ES_OA')] muy viajad[relic_seller.Custom('ES_OA')] me llama la atención en el mercado. En sus manos temblorosas hay una falange amarillenta.\n\n«El hueso de un santo», jura [relic_seller.Custom('ES_ElLa')] [relic_seller.GetWomanMan]. «Lo encontré en mis viaje a [GetTitleByKey('c_jerusalem').GetNameNoTier], pero estaría más seguro en manos de un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l]».\n\nUn ojo instruido podría juzgar la afirmación. Qué conveniente que la reliquia esté en venta."
 pam_secular_faith_events.0006.a: "Dejad que lo valore ante de despedirme de mis monedas."
 pam_secular_faith_events.0006.b: "Lo tendré."
 pam_secular_faith_events.0006.c: "No me interesan los huesos de un desconocido. Marchaos."
 pam_sf_acquire_relic_tt: "Ganas un [artifact|El] de reliquia de [rarity|El] común"
 pam_sf_examine_relic_tt: "Ganas un [artifact|El] de reliquia cuya [rarity|El] se ve afectada por tu [learning_skill|E] [learning_i]"
 pam_sf_acquire_relic_toast: "Reliquia sagrada adquirida"
 pam_sf_fingerbone_relic_name: "Falange de san/santa [SCOPE.Custom('PamFingerboneSaint')]"
 pam_sf_fingerbone_relic_desc: "Una falange amarillenta, venerada como reliquia de san/santa [SCOPE.Custom('PamFingerboneSaint')] y guardada en un pequeño relicario"
 pam_secular_faith_events.0007.t: "Obispo arrogante"
 pam_secular_faith_events.0007.desc: "Tengo un[defiant_bishop.Custom('ES_XA')] [defiant_bishop.GetTitleAsNameNoTooltip|l], [defiant_bishop.GetFirstName], muy orgullos[defiant_bishop.Custom('ES_OA')], con buenas conexiones y discretamente segur[defiant_bishop.Custom('ES_OA')] de estar por encima de mí. Algunos sirvientes han caído enfermos hace poco y preciso que [defiant_bishop.GetSheHe] bendiga mi casa.\n\nTras obviar mis llamamientos durante días, acaba llegando: «Debo pedir perdón por el retraso», dice con una sonrisa, «pero respondo ante un señor más grande que cualquier [ROOT.Char.GetTitleAsNameNoTooltip|l]»."
 pam_secular_faith_events.0007.a: "Procedamos con la dignidad que se merece vuestro cargo."
 pam_secular_faith_events.0007.b: "Limitaos a realizar el rito, por favor."
 pam_secular_faith_events.0007.c: "¡Puede que [ROOT.Char.GetFaith.HighGodName] reine sobre vos! ¡Pero en la tierra vuestr[ROOT.Char.Custom('ES_OA')] señor[ROOT.Char.Custom('ES_XA')] soy yo! ¡Marchaos!"
 pam_secular_faith_events.0008.t: "El peso del pecado"
 pam_secular_faith_events.0008.desc: "Las velas se consumen y el mismo pensamiento regresa. Mi fe considera que el hecho de ser [penance_sin.GetName( ROOT.Char )|l] es un pecado.\n\nNo importa cuánto intente apartar esta idea, la culpa se mantiene.\n\n«Disciplinaos y vuestra alma se liberará de sus cargas». Mi [ROOT.Char.Custom2( 'RelationToMeShort', confessor )], [confessor.GetFirstName], ni reprende ni condena. «Seguid esta penitencia. No os descarriéis»."
 pam_secular_faith_events.0008.a: "Haré lo que [confessor.GetFirstNameNoTooltip] aconseja."
 pam_secular_faith_events.0008.b: "Ahora no. No estoy list[ROOT.Char.Custom('ES_OA')]."
 pam_secular_faith_events.0009.t: "Un extraño semejante a Cristo"
 pam_secular_faith_events.0009.desc: "Ante mis puertas se presenta a solas un[stranger.Custom('ES_XA')] extrañ[stranger.Custom('ES_OA')] con cicatrices y mano estirada que pide limosna.\n\n«Espero no molestaros [ROOT.Char.GetTitleAsNameNoTooltip|l] de talante [ROOT.Char.Custom('ComplimentAdjective')]», dice con una gentil inclinación. «Si vuestra fortuna lo permite, os rogaría una nimia porción de ella».\n\nEs una persona inusitadamente elocuente para ser [Select_CString(stranger.IsFemale, 'una mendiga', 'un mendigo' )]. Uno nunca sabe a quién rechaza."
 pam_secular_faith_events.0009.a: "Adelante, he abierto mi [ROOT.Char.Custom('ResidenceBuilding')] para vos."
 pam_secular_faith_events.0009.b: "Tomad este pan e id en paz."
 pam_secular_faith_events.0010.t: "Quien vino del frío"
 pam_secular_faith_events.0010.desc_blessed: "[Select_CString(stranger.IsFemale, 'La mujer', 'El hombre' )] a quien dejé cruzar las puertas no es [Select_CString(stranger.IsFemale, 'una vagabunda', 'un vagabundo' )] cualquiera; habla sobre las Escrituras y el arte de gobernar con tal facilidad que hasta mis eruditos callan para escuchar.\n\nParece que sí que [ROOT.Char.GetFaith.HighGodName] si ha acudido a mis puertas después de todo. No dejaré que se vaya."
 pam_secular_faith_events.0010.desc_thief: "Despierto con la chimenea apagada y una caja de caudales abierta.\n\nEl pan y el cobijo se pagaron con la más antigua de las traiciones.\n\n[stranger.GetFirstName] desapareció en la noche y mi fortuna con [stranger.GetSheHe].\n\nPara cuando la casa entera despierta, ya está más allá de mis murallas y lejos de mi alcance."
 pam_secular_faith_events.0010.a: "Se os envió aquí por un motivo."
 pam_secular_faith_events.0010.b: "Invité a una serpiente a mi mesa."
 pam_secular_faith_events.0011.t: "Los penitentes"
 pam_secular_faith_events.0011.desc: "Me despierto no con un trueno, sino con el chasquido de los flagelos.\n\nUn grupo de penitentes se ha reunido en el exterior de mi [ROOT.Char.Custom('ResidenceBuilding')]. Tienen los lomos en carne viva y ensangrentados mientras proclaman que [ROOT.Char.GetFaith.HighGodName] exige la [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetNullCharacter.GetRite )|l].\n\nMi casa entera me mira pidiendo orientación."
 pam_secular_faith_events.0011.a: "¿Habrá una verdad profunda en esto?"
 pam_secular_faith_events.0011.b: "Dadme un latigazo, pues yo también he pecado."
 pam_secular_faith_events.0011.c: "¡Expulsad esta locura de mis tierras!"
 pam_secular_faith_events.0012.t: "Bendición de las armas"
 pam_secular_faith_events.0012.desc: "La paz es un préstamo, jamás un regalo.\n\nEn el banquete de [ROOT.Char.GetFaith.WarGodName], mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], se ofrece a consagrar las armas de mi casa.\n\n«Que Dios, que dio a David fuerza sobre Goliat, proporcione esa misma fuerza a la casa [ROOT.Char.GetHouse.GetBaseName] y que siempre acudáis en defensa del débil», reza."
 pam_secular_faith_events.0012.a: "Bendecid mis estandartes y espadas para el día que lo necesite."
 pam_secular_faith_events.0012.b: "Mejor recemos por la paz."
 pam_secular_faith_events.0012.c: "Una bendición en silencio bastará."
 pam_secular_faith_events.0013.t: "Una muerte anunciada"
 pam_secular_faith_events.0013.desc: "Traen ante mí a [Select_CString(prophet.IsFemale, 'una predicadora', 'un predicador' )] de mirada enloquecida. Se le acusa de [Select_CString(prophet.IsFemale, 'agitadora y agorera', 'agitador y agorero' )] y no pierde un instante en señalar con el dedo a mi [ROOT.Char.Custom2( 'RelationToMeShort', doomed_soul )], [doomed_soul.Custom('ES_ElLa')] [doomed_soul.GetTitledFirstName|l].\n\n«¡Apuntad esto!», grita. «Antes de la próxima luna, [doomed_soul.GetSheHe] yacerá frí[doomed_soul.Custom('ES_OA')] sobre la tierra. ¡[ROOT.Char.GetFaith.HighGodName] me ha mostrado hasta la hora!».\n\nSu certeza es inquietante. El miedo de [doomed_soul.GetFirstNameNoTooltip], más aún."
 pam_secular_faith_events.0013.a: "[ROOT.Char.GetFaith.HighGodName] habla a través de bocas extrañas…"
 pam_secular_faith_events.0013.b: "¡Largo de aquí, loc[prophet.Custom('ES_OA')] de atar!"
 prophecy_foretold_tt: "Se ha pronunciado una profecía, ¿y si es verdad?"
 prophecy_foretold_2_tt: "Se ha pronunciado una profecía, ¡un completo absurdo!"
 pam_secular_faith_events.0014.t: "La hora de la profecía"
 pam_secular_faith_events.0014.desc_fulfilled: "Ha pasado una nueva luna y [doomed_soul.Custom('ES_ElLa')] [doomed_soul.GetTitledFirstName|l] ha muerto mientras dormía.\n\n[Select_CString(prophet.IsFemale, 'La predicadora harapienta', 'El predicador harapiento' )] predijo hasta la hora. No puedo olvidarme de eso.\n\n¿Fue la profecía… o el miedo encarnado?"
 pam_secular_faith_events.0014.desc_failed: "Ha pasado una nueva luna y [doomed_soul.Custom('ES_ElLa')] [doomed_soul.GetTitledFirstName|l] sigue con vida. La hora que [Select_CString(prophet.IsFemale, 'la predicadora harapienta', 'el predicador harapiento' )] predijo llegó y se fue sin llevarse nada a su paso.\n\nSerá [Select_CString(prophet.IsFemale, 'una necia', 'un necio' )] o un fraude, pero, desde luego, no es la voz de [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nMe siento bastante idiota."
 pam_secular_faith_events.0014.a: "¡Es [Select_CString(prophet.IsFemale, 'una auténtica profetisa', 'un auténtico profeta' )]!"
 pam_secular_faith_events.0014.b: "[ROOT.Char.GetFaith.HighGodName] actúa de forma misteriosa."
 pam_secular_faith_events.0014.c: "¡¿Por qué me creí su dichosa profecía?!"
 pam_secular_faith_events.0014.d: "Debería haber creído la profecía…"
 pam_secular_faith_events.0014.e: "¡[Select_CString(prophet.IsFemale, 'La predicadora', 'El predicador' )] era un fraude, tal como dije!"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U] gana una [inspiration|El] religiosa"
 pam_secular_faith_events.0015.t: "El icono lloroso"
 pam_secular_faith_events.0015.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], me lleva corriendo a [miracle_church.GetName]. En su interior, los ojos pintados de un santo lloran un aceite fragante.\n\nLas noticias de un milagro corren más que cualquier mensajero, y los milagros son algo poderoso y peligroso."
 pam_secular_faith_events.0015.a: "¿Un milagro? Habrá que examinarlo."
 pam_secular_faith_events.0015.b: "Que vengan los fieles. Los recibiremos."
 pam_secular_faith_events.0015.c: "Esta bendición no se debe compartir."
 pam_secular_faith_events.0015.d: "¡Mi señorío está bendecido!"
 no_miracles_tt: "Este milagro huele raro…"
 pam_secular_faith_events.0016.t: "Un precio para el púlpito"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [candidate.GetWomanMan] entra en mi [ROOT.Char.Custom('ResidenceBuilding')], no para pedir un favor, sino para comprar uno.\n\n«Vuestr[old_realm_priest.Custom('ES_OA')] [old_realm_priest.GetCouncilTitle|l], [old_realm_priest.GetFirstName], es [Select_CString(old_realm_priest.IsFemale, 'una buena pastora', 'un buen pastor' )]», musita y deja caer una bolsa llena sobre la mesa. «Mas yo sería un[candidate.Custom('ES_OA')] más… agradecid[candidate.Custom('ES_OA')]. Nombradme para su cargo y cosechad la bendición [ROOT.Char.GetFaith.WealthGodNamePossessive]»."
 pam_secular_faith_events.0016.desc_sanctioned: "\n\nNo hay que avergonzarse de la [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )|l] y la plata viene bien."
 pam_secular_faith_events.0016.desc_sinful: "\n\nLa [GetTenetType('tenet_simony').GetName( GetNullCharacter.GetRite )|l] es un pecado. Aceptar ese oro me mancillaría el alma."
 pam_secular_faith_events.0016.a: "El oro pesa más que el pecado, al fin y al cabo…"
 pam_secular_faith_events.0016.b: "Un precio justo, justamente pagado. El cargo es vuestro."
 pam_secular_faith_events.0016.c: "El cargo no está a la venta."
 pam_secular_faith_events.0017.t: "Herejes en mi [ROOT.Char.Custom('GetCourt')]"
 pam_secular_faith_events.0017.desc: "«¡Hereje!», mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], indica acusadoramente con el dedo a [accused.GetFirstName]. «¿No veis la vil influencia [accused.GetRite.GetAdjective] de [accused.GetFirstNameNoTooltip] sobre vuestro/a [ROOT.Char.Custom('GetCourt')]? ¡[accused.GetFirstNameNoTooltip] debe arrepentirse y aceptar a [ROOT.Char.GetFaith.HighGodName]!».\n\n[accused.GetFirstNameNoTooltip] mantiene un rostro estoico, aunque es evidente que la acusación le duele."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip], dejad que os traiga a la fe."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip] se convierte"
 pam_secular_faith_events.0017.a.failure: "A [accused.GetFirstName] no le conmueve"
 pam_secular_faith_events.0017.b: "Entonces arrepentíos en una celda. Apresad[accused.GetHerHim]."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip] está bajo mi protección. Basta ya."
 pam_secular_faith_events.0018.t: "Una criatura para Dios"
 pam_secular_faith_events.0018.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )], [pious_child.GetFirstName], no es como los demás niños. Cuando los otros juegan, [pious_child.GetSheHe] se pasa el tiempo en la capilla.\n\n«Jamás he visto [Select_CString(pious_child.IsFemale, 'una niña', 'un niño' )] como [pious_child.GetSheHe]», dice en voz baja mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName]. «[pious_child.GetFirstNameNoTooltip] se pasa horas rezando y llora durante la misa. Está más que claro: [pious_child.GetFirstNameNoTooltip] desea un estilo de vida más [GetTrait('devoted').GetName( pious_child )|l]»."
 pam_secular_faith_events.0018.a: "Sirve a [ROOT.Char.GetFaith.HighGodName], pero quédate aquí."
 pam_secular_faith_events.0018.b: "La Iglesia se quedará con mi [pious_child.Custom('GetDaughterSon')]."
 pam_secular_faith_events.0018.c: "No, pertenece a la casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0019.t: "La paz de Dios"
 pam_secular_faith_events.0019.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], llega con graves noticias.\n\n«Un hermano no matará a su hermano a la vista [ROOT.Char.GetFaith.HighGodNamePossessive]», proclama. «[feud_attacker.Custom('ES_ElLa')|U] [feud_attacker.GetTitledFirstName|l] y [feud_defender.Custom('ES_ElLa')] [feud_defender.GetTitledFirstName|l] han desenvainado sus espadas para enfrentarse, ¡y son los humildes quienes sufrirán por su disputa!».\n\n«Terminad con esto. Que la [GetTenetType('tenet_peace_of_god')GetName( GetPlayer.GetRite )|l] les ate»."
 pam_secular_faith_events.0019.a: "Voto a [ROOT.Char.GetFaith.HighGodName] que habrá paz."
 pam_secular_faith_events.0019.b: "Los señores que desenvainen sus aceros responderán por ello."
 pam_secular_faith_events.0019.c: "Yo juzgo las riñas de mis vasallos."
 pam_sf_peace_of_god_ends_wars_tt: "Toda [war|El] entre tus [vassals|El] termina en una [white_peace|El]"
 pam_secular_faith_events.0020.t: "El/La [ROOT.Char.GetFaith.HouseOfWorship] de [temple_location.GetNameNoTooltip]"
 pam_secular_faith_events.0020.desc: "Los albañiles ponen la última piedra en el primer/la primera [ROOT.Char.GetFaith.HouseOfWorship] que he levantado aquí en el/la [temple_location.Custom('TerrainTypeProvince')] de [temple_location.GetName] con su [temple_location.Custom('TerrainTypeProvincePrefix')].\n\nMi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], recorre el recinto, incensario en mano.\n\n«Se os recordará por el número de [ROOT.Char.GetFaith.HouseOfWorshipPlural] que dediquéis a [ROOT.Char.GetFaith.HighGodName]», dice. «Que este evento sea el primero de muchos»."
 pam_secular_faith_events.0020.a: "Dirigid nuestra plegaria, [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0020.b: "Que [consecrated_county.GetNameNoTierNoTooltip] florezca en torno a mi [ROOT.Char.GetFaith.HouseOfWorship]."
 pam_secular_faith_events.0020.c: "Buscaré sabiduría entre estos muros."
 pam_secular_faith_events.0020.d: "Solo acabo de empezar la obra [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0021.t: "Una señal en los cielos"
 pam_secular_faith_events.0021.desc: "El sueño no llega. Busco la silenciosa oscuridad de mi [ROOT.Char.Custom('GetCourtyard')] y levanto la vista al cielo. Esta noche, los cielos me muestran [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nEstas señales jamás carecen de significado."
 pam_omen_blood_moon: "una luna carmesí"
 pam_omen_star_host: "un grupo de estrellas donde no debería haber ninguna"
 pam_omen_comet: "un cometa con dos colas"
 pam_omen_falling_stars: "una lluvia de estrellas fugaces"
 pam_omen_moon_halo: "un anillo de luz pálida en torno a la luna"
 pam_omen_eclipse: "una luna eclipsada en un creciente cobrizo"
 pam_omen_wandering_star: "una estrella errante luminosa"
 pam_secular_faith_events.0021.a: "Estudiaré este presagio."
 pam_secular_faith_events.0021.b: "Ahí se refleja el favor [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_secular_faith_events.0021.c: "¡Tal signo presagia conquistas!"
 pam_secular_faith_events.0021.d: "El cielo no me debe respuestas."
 pam_secular_faith_events.0022.t: "El toque [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 pam_secular_faith_events.0022.desc_intro: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', sick_courtier )], [sick_courtier.GetFirstName], camina hacia mí arrastrando los pies, pálid[sick_courtier.Custom('ES_OA')] e insegur[sick_courtier.Custom('ES_OA')].\n\n"
 pam_secular_faith_events.0022.desc_ill: "«Me consumo, [ROOT.Char.Custom('FormOfAddressForLiege')], [illness_trait.GetName( GetNullCharacter )] horrible, sin curación a la vista. ¡Ni [Select_CString(physician.IsFemale, 'la galena', 'el médico' )], [physician.Custom('ES_ElLa')] [physician.GetTitledFirstName|l], sabe qué me ocurre!», gime.\n\n"
 pam_secular_faith_events.0022.desc_other: "«Me consumo, afectad[sick_courtier.Custom('ES_OA')] de [illness_trait.GetName|l], sin curación a la vista. ¡Ni [physician.Custom('ES_ElLa')], [physician.GetTitledFirstName|l] sabe qué me ocurre!», gime.\n\n"
 pam_secular_faith_events.0022.desc_end: "«Se dice que una mano coronada lleva consigo la gracia [ROOT.Char.GetFaith.HighGodNamePossessive]. Es la última esperanza que me queda»."
 pam_secular_faith_events.0022.a: "Venid. Dejad que os imponga las manos."
 pam_secular_faith_events.0022.b: "No…, os bendeciré desde donde estoy."
 pam_sf_kings_touch_gamble_tt: "Puede que mi toque le devuelva la salud a [sick_courtier.GetFirstName] o que su enfermedad se extienda a mí…"
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName] sale de su lecho de enfermedad"
 pam_sf_kings_touch_infected_toast: "En cambio, cojo la enfermedad"
 pam_sf_kings_touch_nothing_toast: "Mi toque no le trae cambios a [sick_courtier.GetFirstName]"
 pam_secular_faith_events.0023.t: "Un escribano errante"
 pam_secular_faith_events.0023.desc: "Traen ante mí a un [Select_CString(scholar.IsFemale, 'una mujer escuálida', 'un hombre escuálido' )], con manchas de tinta en los dedos y volúmenes bajo el brazo.\n\n«Me llamo [scholar.GetFirstName], soy [Select_CString(physician.IsFemale, 'escribana y erudita', 'escribano y erudito' )]». Continúa: «No tengo ni hogar ni patrón. Estas manos mías no se han hecho para el trabajo físico, sino para poner las palabras de un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] sobre [ROOT.Char.Custom('GetWritingMaterial')]».\n\n«Os lo ruego, dadme pan y un techo y os serviré fielmente»."
 pam_secular_faith_events.0023.a: "¿[Select_CString(scholar.IsFemale, 'Una erudita', 'Un erudito' )]? Enseñadme lo que sabéis."
 pam_secular_faith_events.0023.b: "[scholar_church.GetNameNoTooltip] necesita de vos."
 pam_secular_faith_events.0023.c: "Mis libros de cuentas necesitan una mano firme."
 pam_secular_faith_events.0023.d: "No preciso de vos. Marchaos."
 pam_secular_faith_events.0024.t: "En el monasterio"
 pam_secular_faith_events.0024.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', rival_character )] [rival_character.GetFirstName] es, para variar, una especie de [rival_character.Custom2('InsultNounClumsy', ROOT.Char)] [rival_character.Custom2('InsultAdjectiveClumsy', ROOT.Char)] y de [rival_character.Custom2('InsultNoun', ROOT.Char)] [rival_character.Custom2('InsultAdjective', ROOT.Char)] en mi [ROOT.Char.Custom('GetCourt')]. Pero mi humor mejora con una carta [archbishop.Custom('ES_DelDela')] [archbishop.GetTitledFirstName|l] de [archdiocese.GetName].\n\n«[rival_character.GetFirstName] serviría bien a [ROOT.Char.GetFaith.HighGodName]», me escribe. «El monasterio [rival_character.GetHerHim] acogería con agrado».\n\nEl mundo olvida rápidamente a quienes se postran allá."
 pam_secular_faith_events.0024.a: "¡Y es así como [ROOT.Char.GetFaith.HighGodName] recibe a [Select_CString(rival.IsFemale, 'otra servidora', 'otro servidor' )] «dispuest[rival.Custom('ES_OA')]!"
 pam_secular_faith_events.0024.b: "Prefiero tener a mis enemigos a la vista."
 pam_secular_faith_events.0025.t: "[Select_CString(ROOT.Char.IsFemale, 'Madrina', 'Padrino' )]"
 pam_secular_faith_events.0025.desc: "«Anhelo unirme a la fe [ROOT.Char.GetFaith.GetAdjective], en cuerpo y alma», dice solemne mi [ROOT.Char.Custom2( 'RelationToMeShort', converting_char )] [converting_char.GetFirstName]. «Deseo que me bauticen y ser parte del pueblo [ROOT.Char.GetRite.GetAdherentName]… y os pido que estéis a mi lado como mi [Select_CString(ROOT.Char.IsFemale, 'madrina', 'padrino' )]»."
 pam_secular_faith_events.0025.a: "¡Así todos verán nuestro nuevo vínculo!"
 pam_secular_faith_events.0025.b: "La fe no necesita grandes espectáculos."
 pam_secular_faith_events.0025.c: "No puedo aceptar tal honor."
 pam_secular_faith_events.0026.t: "Un alma asediada"
 pam_secular_faith_events.0026.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', afflicted )], [afflicted.GetFirstName], no ha estado nunca muy cuerd[afflicted.Custom('ES_OA')]…, pero es que ya está irreconocible.\n\n«¡[ROOT.Char.GetFaith.EvilGodNames]! ¡Tengo a [ROOT.Char.GetFaith.EvilGodNames] dentro de mí!», desvaría mientras se convulsiona en el suelo de mi [ROOT.Char.GetFaith.HouseOfWorship].\n\nMi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], empalidece. «[ROOT.Char.Custom('FormOfAddressForLiege')|U], me temo que su alma está asediada por demonios. El único modo de ayudar[afflicted.GetHerHim] es llevar a cabo un exorcismo»."
 pam_secular_faith_events.0026.a: "Necesita buenos cuidados."
 pam_secular_faith_events.0026.b: "Dirigiré el exorcismo en persona."
 pam_secular_faith_events.0026.c: "Esto es trabajo sagrado. Encargaos vos."
 pam_secular_faith_events.0026.d: "¡Echad[afflicted.GetHerHim], antes de que cunda el pánico!"
 pam_sf_exorcism_success_toast: "El exorcismo tiene éxito"
 pam_sf_exorcism_failed_toast: "El exorcismo fracasa"
 pam_secular_faith_events.0027.t: "Crisis de fe"
 pam_secular_faith_events.0027.desc: "«¿Me oyes, [ROOT.Char.GetFaith.HighGodName]?», susurro. Pero, en el fondo, sé que [ROOT.Char.GetFaith.HighGodNameSheHe|U] no escucha a [Select_CString(ROOT.Char.IsFemale, 'pecadoras', 'pecadores' )] como yo.\n\n¿Habré malinterpretado Su voluntad? ¿El [old_tenet.GetName( ROOT.Char.GetRite )|l] no es la verdadera forma de Su sabiduría?\n\nLa luz cae sobre el crucifijo y la esperanza se despierta en mí."
 pam_secular_faith_events.0027.a: "¡[ROOT.Char.GetFaith.HighGodName] exige [new_tenet.GetNameNoTooltip( ROOT.Char.GetRite )|l]!"
 pam_secular_faith_events.0027.b: "¿Y si tal vez… [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )|l]?"
 pam_secular_faith_events.0027.c: "Estoy condenad[ROOT.Char.Custom('ES_OA')]. Y todos los demás también lo estarán…"
 pam_secular_faith_events.0028.t: "Mi alma, en paz"
 pam_secular_faith_events.0028.desc: "Me arrodillo en mi [ROOT.Char.GetFaith.HouseOfWorship] y la presencia de [ROOT.Char.GetFaith.HighGodName] penetra en cada rincón de mi alma.\n\nVenerar el [old_tenet.GetName( ROOT.Char.GetRite )|l] me ha mostrado la verdad. Jamás había conocido una paz semejante. ¿Cómo puedo guardarme para mí tanta alegría? ¿No debería llevar a otros a la misma luz, mostrarles la verdad?"
 pam_secular_faith_events.0028.a: "Encontraré oídos deseosos."
 pam_secular_faith_events.0028.b: "¡Pero mi verdadera pasión es el [forbidden_tenet.GetNameNoTooltip( ROOT.Char.GetRite )|l]!"
 pam_secular_faith_events.0028.c: "Debería poner mis sentimientos en [ROOT.Char.Custom('GetWritingMaterial')]."
 pam_secular_faith_events.0029.t: "Una visita de los difuntos"
 pam_secular_faith_events.0029.desc: "«Despierta, [ROOT.Char.GetFirstNameNoTooltip]», suena una voz familiar. «Estoy aquí, [departed.Custom2( 'RelationToMeShort', root_scope )]…, ahora que me necesitas».\n\nDespierto, tengo la frente empapada en sudor. La aparición parpadea un breve instante antes de desaparecer.\n\n¿Se trataba de… mi [ROOT.Char.Custom2( 'RelationToMeShort', departed )]?"
 pam_secular_faith_events.0029.a: "[departed.GetSheHe|U] está bien y cuida de mí."
 pam_secular_faith_events.0029.b: "¿Era… una advertencia?"
 pam_secular_faith_events.0029.c: "Una jugarreta de la mente y nada más."
 pam_secular_faith_events.0030.t: "[would_be_anchorite.Custom('ES_ElLa')|U] anacoreta"
 pam_secular_faith_events.0030.desc: "«Deseo acercarme a [ROOT.Char.GetFaith.HighGodName]», dice solemne mi [ROOT.Char.Custom2( 'RelationToMeShort', would_be_anchorite )], [would_be_anchorite.GetFirstName]. «El mundo está lleno de distracciones y anhelo una soledad completa».\n\nSe fija en los muros de mi [ROOT.Char.Custom('ResidenceBuilding')] y los sigue con la punta de los dedos.\n\n«El/La [ROOT.Char.GetFaith.HouseOfWorship] de [church_scope.GetName] es una belleza. Deseo encerrarme entre sus muros y pasar el resto de la vida en una plegaria ininterrumpida»."
 pam_secular_faith_events.0030.a: "Si es lo que deseáis, mis albañiles están a vuestra disposición."
 pam_secular_faith_events.0030.b: "No, no os concederé eso."
 pam_secular_faith_events.0031.t: "Una discusión entre eruditos"
 pam_secular_faith_events.0031.desc: "«¿Cómo puede nadie negar la santidad de [tenet_1.GetBaseName]?», grita mi [ROOT.Char.Custom2( 'RelationToMeShort', disputant_one )] [disputant_one.GetFirstName].\n\n«¡Qué necedad! Está claro como el agua que [tenet_2.GetBaseName] nos acerca a lo divino! ¿Es que no habéis aprendido nada?», replica mi [ROOT.Char.Custom2( 'RelationToMeShort', disputant_two )] [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.a: "¿Un debate erudito? Voy a por mis apuntes…"
 pam_secular_faith_events.0031.b: "[tenet_1.GetBaseNameNoTooltip] me atrae."
 pam_secular_faith_events.0031.c: "Me parece que [tenet_2.GetBaseNameNoTooltip] tiene razón."
 pam_secular_faith_events.0031.d: "Un/a [ROOT.Char.Custom('GetCourt')|l] con animación es una con erudición."
 pam_secular_faith_events.0032.t: "La hora de la tentación"
 pam_secular_faith_events.0032.desc_food: "Despierto con la almohada húmeda de saliva. Las cocinas emiten olor a [ROOT.Char.Custom('RegionalEdibleMeat')] a la parrilla y a [ROOT.Char.Custom('GetRandomRegionalSmallGame')] con relleno de [ROOT.Char.Custom('GetFoodDetail')], mientras que el entrechocar de copas de [ROOT.Char.Custom('RegionalDrink')] y las voces alegres se dispersan por mis [ROOT.Char.Custom('ResidenceBuildingHallsType')].\n\nAl ser [vice_trait.GetName( GetNullCharacter )], los [ROOT.Char.GetFaith.PriestNeuterPlural] me han ordenado ayunar…, ¿pero por qué [ROOT.Char.GetFaith.HighGodName] me pone a prueba precisamente esta noche?\n\nMi resolución desaparece con cada rugido de mi estómago."
 pam_secular_faith_events.0032.a: "¡Mis ansias están justificadas por [ROOT.Char.GetFaith.HighGodName]!"
 pam_secular_faith_events.0032.b: "No. El ayuno se mantiene y yo también."
 pam_secular_faith_events.0032.c: "Un bocadito de nada… ¿Quién se va a enterar?"
 pam_secular_faith_events.0033.t: "Sermones de almohada"
 pam_secular_faith_events.0033.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', believing_spouse )], [believing_spouse.GetFirstName], sigue el [believing_spouse.GetRite.GetName|l], cuyas enseñanzas me susurra con deleite de noche.\n\n«[believing_spouse.Custom2( 'RelationToMeShort', root_scope )] [ROOT.Char.Custom('RomanticComplimentAdjective')] de mi alma, ¿sabías que [new_tenet.Custom('GetGenericTenetSentence')|l]? ¿No es #EMP fascinante?#!», me pregunta abrazándome.\n\nSu pasión es tan encantadora como su sonrisa."
 pam_secular_faith_events.0033.a: "Vaya, cuéntame más…"
 pam_secular_faith_events.0033.b: "¡#EMP Tú#! sí que eres fascinante! Ven aquí."
 pam_secular_faith_events.0033.c: "Por favor, [believing_spouse.Custom('RomanticComplimentNoun')|l] de mi corazón, tengo que dormir."
 pam_secular_faith_events.0034.t: "La criatura encontrada"
 pam_secular_faith_events.0034.desc: "No es propio de mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName] el llegar tarde. El silencio de mi [ROOT.Char.GetFaith.HouseOfWorship] se quiebra con los débiles lloros de una criaturita.\n\n«Misericorde [ROOT.Char.GetFaith.HighGodName]…», susurra [chaplain.GetFirstNameNoTooltip], meciéndo[foundling.GetHerHim] con delicadeza. «Abandonar[foundling.GetHerHim] por tener la mácula de [trait_scope.GetName( GetNullCharacter )|l]… Ningún alma se merece semejante destino».\n\nLos deditos [Select_CString(foundling.IsFemale, 'de la niña', 'del niño' )] se cierran sobre su pulgar."
 pam_secular_faith_events.0034.a: "[ROOT.Char.GetFaith.HighGodName] me ha dado un[foundling.Custom('ES_XA')] [foundling.Custom('GetDaughterSon')]."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip] se ocupará de [foundling.GetSheHe]."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip] criará [Select_CString(foundling.IsFemale, 'a la niña', 'al niño' )]."
 pam_secular_faith_events.0034.d: "No me importa lo que le pase."
 pam_secular_faith_events.0035.t: "La mortificación"
 pam_secular_faith_events.0035.desc: "Hay sangre en el suelo. Al seguir el sonido de los azotes, encuentro a mi [ROOT.Char.Custom2( 'RelationToMeShort', sufferer )], [sufferer.GetFirstName]. Tiene un flagelo carmesí en sus manos y las lágrimas recorren sus mejillas.\n\n«Las pasiones de mi impulso [sinful_trait.GetName( GetNullCharacter )|l] amenazan con consumirme», jadea. «Mejor la picadura del látigo que el fuego de la tentación».\n\n«Este dolor pasa, el de [ROOT.Char.GetFaith.NegativeAfterLife], no»."
 pam_secular_faith_events.0035.a: "Intrigante…, pasadme el flagelo."
 pam_secular_faith_events.0035.b: "Que se mortifique."
 pam_secular_faith_events.0035.c: "Por el amor [ROOT.Char.GetFaith.HighGodNamePossessive], detened esta locura."
 pam_sf_scourge_abandoned_toast: "El flagelo abandonado"
 pam_secular_faith_events.0036.t: "La sabiduría de un[hermit.Custom('ES_XA')] anacoreta"
 pam_secular_faith_events.0036.desc: "Un[hermit.Custom('ES_XA')] [hermit.GetWomanMan] harapient[hermit.Custom('ES_OA')] pide audiencia; afirma ser un[hermit.Custom('ES_XA')] anacoreta del lejano territorio de [hermit_location.Custom('TerrainTypeProvince')] de [hermit_location.GetName].\n\n«Desde hace siete noches [ROOT.Char.GetFaith.HighGodName] me niega el sueño», dice sever[hermit.Custom('ES_OA')]. «No para castigarme, sino para llenar mis pensamientos con verdades para otros, para vos».\n\n«Escuchad mis palabras y prestad atención. Después volveré a mi soledad»."
 pam_secular_faith_events.0036.a: "¿Qué misterios me impartiréis?"
 pam_secular_faith_events.0036.b: "Deseo aprender."
 pam_secular_faith_events.0036.c: "Marchaos, pordioser[hermit.Custom('ES_OA')]."
 pam_secular_faith_events.0037.t: "Revelación carnal"
 pam_secular_faith_events.0037.desc_wanderer: "Fluyen los tragos de [ROOT.Char.Custom('RegionalAlcoholicDrink')] de noche y [reveler.GetFirstName], un[reveler.Custom('ES_XA')] trotamundos de paso, se inclina hacia mí."
 pam_secular_faith_events.0037.desc_normal: "Fluyen los tragos de [ROOT.Char.Custom('RegionalAlcoholicDrink')] de noche y mi [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], se inclina hacia mí."
 pam_secular_faith_events.0037.desc: "Pronto nada más me llama la atención salvo su/s [reveler.Custom('ObjectifiedFeature')].\n\n«Hay oraciones que se rezan con la lengua», dice quitándose lentamente su [reveler.Custom('GetClothingArticle')]. «Y hay oraciones que se rezan con la carne. Dejad que os muestre [reveler.Custom('pam_sf_carnal_art')|l], mi [ROOT.Char.Custom('RaunchyComplimentNoun')]».\n\nMe ofrece la mano. «El éxtasis por llegar rivalizará con la bendición de [ROOT.Char.GetFaith.PositiveAfterLife]»."
 pam_secular_faith_events.0037.a: "Mostradme. Cerrad la puerta que tenéis detrás."
 pam_secular_faith_events.0037.b: "Tapaos, [reveler.GetWomanMan]."
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "la serpiente enredada"
 pam_sf_carnal_art_2: "el río ascendiente"
 pam_sf_carnal_art_3: "las enredaderas enmarañadas"
 pam_sf_carnal_art_4: "el abrazo estrecho"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "el bambú partido"
 pam_sf_carnal_art_6: "la amazona"
 pam_sf_carnal_art_7: "el loto desplegado"
 pam_sf_carnal_art_8: "la esposa de Indra"
 pam_sf_carnal_art_9: "la cobra alzada"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "el nudo de los amantes"
 pam_sf_carnal_art_11: "la rosa y la espina"
 pam_sf_carnal_art_12: "el secreto del trovador"
 pam_sf_carnal_art_13: "la llama sostenida"
 pam_secular_faith_events.0038.t: "Un bocado del paraíso"
 pam_secular_faith_events.0038.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', reveler )], [reveler.GetFirstName], llena otro plato de [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')] y me sonríe desde el otro lado de la mesa.\n\n«Vos buscáis a [ROOT.Char.GetFaith.HighGodName] con las tripas rugiendo y la copa vacía. Yo [ROOT.Char.GetFaith.CreatorHerHim|U] encuentro en la fruta madura, la carne sabrosa, las risas y las canciones», [reveler.GetSheHe] alza una copa rebosante.\n\n«Los regalos [ROOT.Char.GetFaith.HighGodNamePossessive] son para saborearse, [ROOT.Char.Custom('FormOfAddressForLiege')]. ¿Desperdiciar lo que se nos ha dado? ¡Ese sí que es un pecado horrible!»."
 pam_secular_faith_events.0038.a: "Tal vez la santidad está en la copa…"
 pam_secular_faith_events.0038.b: "Entonces deberé celebrar un festín en su honor."
 pam_secular_faith_events.0038.c: "Decadencia disfrazada de devoción. No."
 pam_secular_faith_events.0039.t: "Una oración en la oscuridad"
 pam_secular_faith_events.0039.desc: "Mi [ROOT.Char.Custom2( 'RelationToMe', spymaster_scope )], [spymaster_scope.GetFirstName], se me acerca, aún inquiet[spymaster_scope.Custom('ES_OA')] por los frutos de su astucia.\n\n«Me arrodillé junto [secret_keeper.Custom('ES_AlAla')] [secret_keeper.GetTitledFirstName|l] en la oración, [ROOT.Char.Custom('FormOfAddressForLiege')], y mentí; un pequeño embuste piadoso, susurrado para soltarle la lengua».\n\n«Me confesó [secret_keeper.Custom('GetSecretCrimeConfessionIndef')] en la casa de [ROOT.Char.GetFaith.HighGodName]», dice bajando la voz. «Hablé según las [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )|l]… ¿Tal vez este engaño es una obligación que le debemos a [ROOT.Char.GetFaith.HighGodName]?»."
 pam_secular_faith_events.0039.a: "[ROOT.Char.GetFaith.HighGodName] trabaja en las sombras…"
 pam_secular_faith_events.0039.b: "Un truco lamentable… Contadme el secreto."
 pam_secular_faith_events.0040.t: "Carne de los fieles"
 pam_secular_faith_events.0040.desc: "Terminado el refrigerio de la tarde, mi [ROOT.Char.Custom2( 'RelationToMeShort', scholar )], [scholar.GetFirstName], abre un tomo muy usado. Está a punto de empezar otra lección.\n\n«Los [Glossary( 'isedones', 'ISSEDONES_GLOSS' )] no enterraban a sus muertos, [ROOT.Char.Custom('FormOfAddressForLiege')]. ¡Se daban un banquete con ellos!», dice, apenas parando para tomar aliento. «La carne del padre se mezclaba con la de añojo, y el cráneo se revestía de oro y se apreciaba como una reliquia sagrada. Para ellos, era la expresión más pura de amor que ningún hijo podía mostrar».\n\n«¿Y lo mejor de todo?», se sonríe. «El mismo Heródoto no los consideraba ni malignos ni locos. #EMP \"La costumbre\",#! decía, #EMP \"manda sobre todo\"#!»."
 pam_secular_faith_events.0040.a: "Sí, lo sé todo al respecto."
 pam_secular_faith_events.0040.b: "Una costumbre lúgubre… Contadme más."
 pam_secular_faith_events.0040.c: "¡Voto a [ROOT.Char.GetFaith.HighGodName], [scholar.GetWomanMan]! ¡Que estoy comiendo!"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "Un pueblo de las lejanas estepas del norte descrito por el antiguo historiador griego Heródoto. Cuando moría el padre de alguien, su familia sacrificaba ganado, mezclaba la carne con la del difunto y la compartía en un festín funeral solemne. Se apartaba el cráneo, se limpiaba y se bañaba en oro para conservarlo como reliquia sagrada a la que se ofrecían sacrificios todos los años. Heródoto situó esos ritos al nivel de la cremación griega, no para condenarlos sino para mostrar que «la costumbre manda sobre todo» y que cada pueblo cree que sus modos son los más justos."
 pam_secular_faith_events.0041.t: "La verdad desnuda"
 pam_secular_faith_events.0041.desc: "Cuando paseaba por los jardines, veo a un[adamite.Custom('ES_XA')] extrañ[adamite.Custom('ES_OA')] en mis jardines entre los parterres de [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')], tomando frutas de mi [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')]; está como vino al mundo; sus únicos adornos son las hojas que caen.\n\n«¡Oh, un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsName|l]! ¿Por qué os escondéis detrás de la ropa y la corona?», pregunta sin vergüenza ante [ROOT.Char.GetFaith.HighGodName] ni ante mí. «He adoptado la primera inocencia, cuando vivíamos desnudos y sin miedo».\n\nDespués muerde otra pieza de fruta y el jugo le corre por la piel. «Tal vez vos también deberíais probar»."
 pam_secular_faith_events.0041.a: "Yo también anhelo esta libertad."
 pam_secular_faith_events.0041.b: "Comed mi fruta, contad vuestra historia y marchaos."
 pam_secular_faith_events.0041.c: "Haces encerrar [Select_CString(adamite.IsFemale, 'a la intrusa', 'al intruso' )]."
 pam_secular_faith_events.0042.t: "El camino se vuelve más fácil"
 pam_secular_faith_events.0042.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', sponsor_character )], [sponsor_character.GetFirstName], se encuentra conmigo en el jardín con una bolsa abierta y una sonrisa cálida.\n\n«Dejadme cargar con el coste de vuestra [GetActivityType( 'activity_pilgrimage').GetName|l], [ROOT.Char.Custom('FormOfAddressForLiege')]. El camino del peregrino no es lugar donde contar monedas; caminad libre y rezad por [Select_CString(And(ROOT.Char.IsFemale, sponsor_character.IsFemale), 'las dos', 'los dos')]».\n\nLas monedas son reales. Tal como es la confianza tras ellas."
 pam_secular_faith_events.0042.a: "Recorreré el camino con un corazón agradecido."
 pam_secular_faith_events.0042.b: "Tomaré las monedas y me las quedaré."
 pam_secular_faith_events.0042.c: "Guardaos las monedas, [Select_CString(sponsor_character.IsFemale, 'amiga mía', 'amigo mío' )]."
 pam_sf_pilgrimage_sponsor_tt: "Si llevas a cabo una [GetActivityType( 'activity_pilgrimage').GetName|l] en #V 7#! años, la opinión sobre ti de [sponsor_character.GetFirstName] subirá en #P 50#!"
 pam_sf_pilgrimage_sponsor_toast: "Un patrón lleno de gozo"
 pam_secular_faith_events.0043.t: "La bienvenida de un peregrino"
 pam_secular_faith_events.0043.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', holy_man )], [holy_man.GetFirstName], toma mis manos ante al altar.\n\n«Recorred el camino del peregrino, [ROOT.Char.Custom('FormOfAddressForLiege')]. Cuando regreséis, anunciaré vuestra [GetActivityType( 'activity_pilgrimage').GetName|l] en todo rincón de [capital_county.GetNameNoTier]. Vuestro pueblo sabrá que su [ROOT.Char.GetTitleAsNameNoTooltip|l] se arrodilló por ellos»."
 pam_secular_faith_events.0043.a: "Entonces tomaré el camino del peregrino."
 pam_secular_faith_events.0043.b: "Tengo asuntos más terrenales que atender."
 pam_sf_extolled_pilgrimage_toast: "El pueblo se regocija"
 pam_secular_faith_events.0044.t: "El oído del clero"
 pam_secular_faith_events.0044.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', friendly_bishop )], [friendly_bishop.GetFirstName], llega con un buen humor poco común.\n\n«Últimamente gozo del favor de mis colegas: obispos, abades, las voces que tienen peso en la Iglesia. Si precisáis de su sabiduría piadosa o su autoridad moral, puedo hablar en vuestro nombre».\n\nEl favor de [friendly_bishop.GetFirstNameNoTooltip] con [ROOT.Char.GetFaith.PriestNeuterPlural] hambrientos de poder se gasta fácilmente."
 pam_secular_faith_events.0044.a: "Hablad en mi nombre, pues."
 pam_secular_faith_events.0044.b: "Vuestra amistad es bendición suficiente."
 pam_secular_faith_events.0045.t: "Epifanía"
 pam_secular_faith_events.0045.desc: "Una claridad que golpea como el relámpago en un cielo despejado.\n\nDoctrina. Dogmas. Ritos. Creencias. Lo que antes se asemejaba a un millar de ideas dispersas ahora forma una sola verdad ante mí."
 pam_secular_faith_events.0045.a: "El futuro me hace señas para que dirija."
 pam_secular_faith_events.0045.b: "Disfrutaré del momento."
 pam_secular_faith_events.0046.t: "Convicción compartida"
 pam_secular_faith_events.0046.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', intimate )], [intimate.GetFirstName], no puede ocultar su convicción mientras habla sobre el [shared_tenet.GetName( intimate.GetRite )|l].\n\n«[shared_tenet.GetNameNoTooltip( GetNullCharacter.GetRite )] le da sentido a todo lo que hago», dice. «Solo una cosa significa tanto para mí… vos, mi [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))] [ROOT.Char.Custom('ComplimentAdjective')]».\n\nUna sola lágrima le recorre la mejilla. «Tan solo quería que lo supierais»."
 pam_secular_faith_events.0046.a: "¡Que la convicción compartida ahonde nuestro vínculo!"
 pam_secular_faith_events.0046.b: "Compartir esta convicción… es como amor."
 pam_secular_faith_events.0046.c: "Gracias por compartir."
 pam_secular_faith_events.0047.t: "Devoción sacerdotal"
 pam_secular_faith_events.0047.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], se santigua e inclina la cabeza.\n\n«[ROOT.Char.GetFaith.HighGodName] ha puesto la corona sobre vuestra testa por un motivo. Al serviros con fidelidad, sirvo a Su voluntad», proclama.\n\n«He jurado lealtad a [ROOT.Char.GetFaith.HighGodName]. Ahora también os la juraré a vos»."
 pam_secular_faith_events.0047.a: "Entonces servidme en cuerpo y mente."
 pam_secular_faith_events.0047.b: "Siempre debéis servir primero a [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0048.t: "Sueños demoníacos"
 pam_secular_faith_events.0048.desc: "Despierto, pero no me puedo mover.\n\nUna figura retorcida baila ante mí, entre carcajadas. ¿Un demonio? El terror me llena poco a poco. «Je… je… Cuánto pesan tus pecados. ¡[ROOT.Char.GetFaith.EvilGodNames] se apoderará de ti muy pronto!».\n\nSueño o demonio, no puedo ignorar lo que he visto. Debo hacer las paces con [ROOT.Char.GetFaith.HighGodName]."
 pam_secular_faith_events.0048.a: "Este sueño… tiene que significar algo."
 pam_secular_faith_events.0048.b: "Solo es un sueño. A dormir de nuevo."
 pam_secular_faith_events.0048.c: "¡[ROOT.Char.GetFaith.HighGodName] me guarde! He de arrepentirme."
 pam_sf_demon_torment_modifier_tt: "Para librarse del modificador, debes construir una [holding|El] de [GetBuilding('temple_01').GetName|l] o salir de [GetActivityType('activity_pilgrimage').GetName|l]"
 pam_sf_demon_torment_lifted_toast: "El tormento se levanta"
 pam_secular_faith_events.0049.t: "«Jerarquía celestial»"
 pam_secular_faith_events.0049.desc: "Los sonidos que salen de mi capilla no son de plegaria.\n\n«Sí, ¡#emp SÍ#!, vuestra Ilustrísima! ¡Mostrad a est[lustful_priest.Custom('ES_EA')] miserable pecador[lustful_priest.Custom('ES_XA')] su lugar en la [GetTenetType('tenet_celestial_hierarchy').GetName( GetNullCharacter.GetRite )|l]!», grita extasiad[lustful_priest.Custom('ES_OA')] mi [ROOT.Char.Custom2( 'RelationToMeShort', lustful_priest )] [lustful_priest.GetFirstName]. «Soy un gusano que se retuerce en la inmundicia, lleno de lujuria terrenal. #emp ¡CASTIGADME!#!».\n\nVoto a [ROOT.Char.GetFaith.HighGodName], ¡¿pero qué pasa en mi capilla?!"
 pam_secular_faith_events.0049.a: "Será algo ritual, tendré que… tomar notas."
 pam_secular_faith_events.0049.b: "Si ocurre en #EMP mi#! capilla, ¡entonces #emp yo#! me apunto!"
 pam_secular_faith_events.0049.c: "¡¿[lustful_priest.GetFirstNameNoTooltip] tiene esas desviaciones?! Repugnante, pero útil."
 pam_secular_faith_events.0050.t: "Un[chaplain.Custom('ES_XA')] [chaplain.GetCouncilTitle|l] muy [chaplain.Custom('RomanticComplimentAdjective')]"
 pam_secular_faith_events.0050.desc: "Las velas titilantes de mi [ROOT.Char.GetFaith.HouseOfWorship] hacen poco para distraerme de los pensamientos impuros que me llenan la cabeza.\n\n«Seguidme al confesionario, [ROOT.Char.Custom('FormOfAddressForLiege')]», susurra mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )]. Mis ojos se demoran en su/s [chaplain.Custom('ObjectifiedFeature')]. «Sea lo que sea que cargue vuestra alma, contadlo sin miedo».\n\nLa [GetTenetType('tenet_confession')GetName( GetPlayer.GetRite )|l] es sagrada…, pero un pecado pesa más que los demás: tal [chaplain.Custom('AdmiredFeature')] de [chaplain.GetFirstName]."
 pam_secular_faith_events.0050.a: "… ¿Hay sitio para dos en el confesionario?"
 pam_secular_faith_events.0050.b: "Perdonadme, [chaplain.GetMotherFather], porque tengo pensamientos impuros."
 pam_secular_faith_events.0051.t: "Dios, tu Señor"
 pam_secular_faith_events.0051.desc: "#EMP «Soy Dios, tu Señor»,#! una voz retumbante resuena en mi [ROOT.Char.GetFaith.HouseOfWorship]. #EMP «Te arrodillarás ante mí».#!\n\nCaigo de rodillas, se me nubla vista. Me despejo un chorro de sangre del rostro.\n\n#EMP «Yo, Dios, tu Señor, te ordeno: has de obedecerme con toda tu alma y tu corazón».#! Una voz se convierte en un centenar. Un centenar en un millar. #EMP «Si no lo hicieres, Yo te maldeciré hasta tu destrucción, porque me habrás abandonado a Mí, a Dios, tu Señor».#!"
 pam_secular_faith_events.0051.a: "Obedeceré…"
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Ocurrirá algo horrible o hermoso…#!"
 pam_sf_lord_your_god_tt: "Por favor, [ROOT.Char.GetFaith.HighGodName]…, tened piedad."
 pam_sf_voice_of_jesus_toast: "La voz de Jesús"
 pam_sf_stroke_of_god_toast: "Un golpe de Dios"
 pam_secular_faith_events.0052.t: "Después de que faltéis"
 pam_secular_faith_events.0052.desc: "En mi [ROOT.Char.GetFaith.HouseOfWorship] de [resting_church.GetNameNoTier], mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], se detiene ante las lápidas desgastadas de aquellos que reinaron antes que yo.\n\n«[ROOT.Char.GetFaith.HighGodName] os ha concedido más inviernos que a la mayoría, [ROOT.Char.Custom('FormOfAddressForLiege')]. No es pecado alguno decidir cómo reposaréis».\n\n«Vuestro semblante distinguido grabado en piedra o [Glossary( 'los simples hábitos', 'AD_SUCCURRENDUM_GLOSS' )] de [Select_CString(ROOT.Char.IsFemale, 'una monja', 'un monje' )]; la elección es vuestra»."
 pam_secular_faith_events.0052.a: "Gravad mi semblante, pero más joven y bien parecid[ROOT.Char.Custom('ES_OA')]."
 pam_secular_faith_events.0052.b: "Bastará con el simple hábito."
 pam_secular_faith_events.0052.c: "La tumba es paciente."
 pam_sf_effigy_planned_tt: "Si se celebra un [GetActivityType( 'activity_funeral').GetName|l] por ti a tu muerte, su anfitrión ganará #P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! de [prestige|El] [prestige_i]"
 pam_sf_cowl_burial_planned_tt: "Si se celebra un [GetActivityType( 'activity_funeral').GetName|l] por ti a tu muerte, su anfitrión ganará #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! de [piety|El] [piety_i]"
 pam_sf_effigy_unveiled_toast: "La efigie revelada"
 pam_sf_cowl_burial_toast: "Reposar en el hábito"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "Morir #G ad succurrendum#! —tras tomar los votos de monje y vestir sus hábitos en el lecho de muerte— fue el recurso final de muchos grandes señores en la cristiandad medieval. Al ser enterrado con un hábito humilde en lugar de con sedas, el gobernante moribundo esperaba que a la hora del Juicio se le contase entre los hermanos humildes en lugar de entre los poderosos."
 pam_secular_faith_events.0053.t: "Cuando el santo marcha"
 pam_secular_faith_events.0053.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], levanta la tapa de un relicario con el cuidado de una comadrona. En su interior yace el tesoro de mi casa: la maravilla de [procession_relic.GetName|l].\n\n«La santidad guardada a cal y canto no ayuda a nadie, [ROOT.Char.Custom('FormOfAddressForLiege')]», dice. «Conceded a vuestro pueblo una [Glossary( 'ostensión', 'OSTENSION_GLOSS' )]; dejad que vean la reliquia y que esta bendiga toda calle entre aquí y las puertas»."
 pam_secular_faith_events.0053.a: "Yo en persona portaré el relicario."
 pam_secular_faith_events.0053.b: "Guardaré la vigilia a solas."
 pam_secular_faith_events.0053.c: "No me atrevo a moverla."
 pam_sf_procession_gamble_tt: "Las calles no son una cámara acorazada, el artefacto puede sufrir daños…"
 pam_sf_relic_jostled_toast: "Empujones entre la muchedumbre"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "La exhibición solemne de las reliquias de un santo. En los días de fiesta mayor, las reliquias salían de sus cámaras y se llevaban en procesión por calles y campos para que la bendición unida al altar llegase a toda alma a su paso. Una reliquia en procesión atrae multitudes, monedas y renombre allá por donde pasa."
 pam_secular_faith_events.0054.t: "La jofaina y el paño"
 pam_secular_faith_events.0054.desc: "La jofaina humea a mis pies y mi [ROOT.Char.Custom('GetCourt')|l] se ha reunido para observar. En el taburete ante mí se sienta un[pauper.Custom('ES_XA')] [pauper.Custom2('dummy_peasant_profession', pauper)], notablemente nervios[pauper.Custom('ES_OA')], sus pies cubiertos de suciedad. El olor es… perceptible.\n\nEn esta noche, el mismísimo Salvador se arrodilló con jofaina y paño. El [Glossary( 'mandatum', 'MANDATUM_GLOSS' )] está preparado, el agua está caliente y todos los ojos de la sala están fijos en mí.\n\nSolo queda arrodillarse… o pensárselo mejor."
 pam_secular_faith_events.0054.deviant: "#EMP Limpiaré esos pies deliciosos con la lengua.#!"
 pam_secular_faith_events.0054.a: "Arrodillarse y tomar el paño."
 pam_secular_faith_events.0054.b: "Arrodillarse y besar esos pies cansados."
 pam_secular_faith_events.0054.c: "No…, no puedo. Llevaos la jofaina."
 pam_sf_odorous_feet_tt: "La santidad me llenará al arrodillarme… o el olor de los pies del campesinado no me abandonará nunca"
 pam_sf_odorous_feet_toast: "El hedor persiste"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "El rito del lavado de pies, nombrado tras las palabras de Cristo en la Última cena: #G «Mandatum novum do vobis»#!, «Os doy un mandamiento nuevo». Todos los años, el jueves antes de la Pascua, los emperadores de Constantinopla y reyes por todo Occidente se arrodillaban con una jofaina y un paño ante unos pobres elegidos, les lavaban los pies y ponían plata en sus manos; por una tarde, la cabeza más poderosa se inclinaba ante la más humilde."
 pam_secular_faith_events.0055.t: "La voz de bronce"
 pam_secular_faith_events.0055.desc: "La antigua campana de la [bell_church.GetName] se rajó y, por lo tanto, hubo que refundirla. Hoy, la nueva cuelga reluciente en la torre. Bajo ella se encuentra mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], con agua, óleo santo y sal.\n\n«Una campana debe ser [Glossary( 'bautizada', 'BELL_BAPTISM_GLOSS' )] antes de darle voz a [ROOT.Char.GetFaith.HighGodName]», insiste con las mangas ya enrolladas. «Lavada, ungida y bautizada y tras ello ni demonio ni tormenta podrá silenciar su voz»."
 pam_secular_faith_events.0055.a: "Que sea lavada, ungida y bautizada, pues."
 pam_secular_faith_events.0055.b: "Es bronce, no un alma, eso dicen las capitulares."
 pam_secular_faith_events.0055.c: "Bastará con una bendición breve. Que resuene."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "Las campanas de las iglesias se consagraban tanto como los mismos cristianos: lavadas con agua bendita, ungidas con óleo, bautizadas con el nombre de un santo, y hay quienes hasta las apadrinaban. La #G Admonitio generalis#! de Carlomagno prohibió el bautismo de campanas en el 789, pero la costumbre continuó igual durante siglos. Se creía que una campana cristianada dispersaba tormentas, granizo y demonios allá donde llegaba su voz; más tarde los fundidores moldearon sus campanas con el lema #G Fulgura frango#!, «Rompo los relámpagos»."
 pam_secular_faith_events.0056.t: "Un gorrión en la sala"
 pam_secular_faith_events.0056.desc: "Un gorrión entra disparado desde la oscuridad invernal, recorre la longitud de mi [ROOT.Char.Custom('ResidenceBuildingHallType')] entre risas y humo y desaparece por una [ROOT.Char.Custom('ResidenceBuildingWindowType')].\n\nMi [ROOT.Char.Custom('GetCourt')] ríe. Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], no.\n\n«[Glossary( 'Así es la vida del hombre', 'BEDE_SPARROW_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]: un momento de luz y calor tras otro de oscuridad, y vuelta a ella. Lo que ocurre antes y después, solo [ROOT.Char.GetFaith.HighGodName] lo conoce»."
 pam_secular_faith_events.0056.scholar: "Beda escribió lo mismo, casi palabra por palabra."
 pam_secular_faith_events.0056.a: "Entonces que el momento en la luz se pase bien."
 pam_secular_faith_events.0056.b: "Era un pájaro. Más vino."
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "En la crónica de Beda, un consejero del rey Edwin de Northumbria asemejaba la vida del hombre a la de un gorrión que sobrevuela un cálido salón de banquetes en una noche invernal: un breve paso por la luz y la comodidad para salir a la noche, sin saber nada de lo que pasa antes ni después. Si la nueva fe podía hablar de lo que había más allá de la sala, argumentaba, mercería seguirse. Y Edwin quedó persuadido."
 pam_secular_faith_events.0057.t: "La cerveza de iglesia"
 pam_secular_faith_events.0057.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], se encuentra en el patio de mi [ale_church.GetName] entre mesas donde se sienta la mitad de la parroquia y barriles recién traídos de la [GetBuilding('breweries_01').GetName|l], con una jarra rebosante en mano.\n\n«El tejado tiene goteras, [ROOT.Char.Custom('FormOfAddressForLiege')], y el diezmo no es suficiente. Así que los hermanos la elaboran, nosotros la vendemos y la parroquia se bebe la [Glossary( 'cerveza de iglesia', 'CHURCH_ALE_GLOSS' )] hasta que hayamos pagado el tejado».\n\n«Cada jarra es una buena acción. ¿Queréis una?»."
 pam_secular_faith_events.0057.a: "Dadme una copa, pues. Por el tejado."
 pam_secular_faith_events.0057.b: "Dejad la cerveza. Yo pagaré el tejado."
 pam_secular_faith_events.0057.c: "¿Beber? ¿En terreno sagrado? Servid entonces."
 pam_sf_church_ale_gamble_tt: "Cada copa es por el tejado y la cerveza de la parroquia es fuerte…"
 pam_sf_church_ale_toast: "Mañana llegará la resaca"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "Una fiesta parroquial donde en el patio de la iglesia se vendía la cerveza elaborada con la malta que les habían donado; las ganancias iban al mantenimiento de la iglesia: un tejado con goteras, una campana nueva, pan para los pobres. Los sínodos no dejaban de condenar el beber en terreno sagrado y las parroquias no dejaban de elaborar cerveza; para muchas iglesias de pueblo, la cerveza aportaba mucho más que el diezmo."
 pam_secular_faith_events.0058.t: "Quid mus sumit?"
 pam_secular_faith_events.0058.desc: "Mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], irrumpe pálid[chaplain.Custom('ES_OA')] como el paño del altar y sostiene una pequeña [Glossary( 'píxide', 'PYX_GLOSS' )] de plata como si le quemase las manos.\n\n«Un ratón, [ROOT.Char.Custom('FormOfAddressForLiege')]. ¡Royó la caja esta noche y se comió el [Glossary( 'pan consagrado', 'RESERVED_HOST_GLOSS' )]!».\n\nApenas puede hablar. «Los eruditos se preguntan [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )]: entonces, ¿qué se comió el ratón? ¿Qué debo hacer?»."
 pam_secular_faith_events.0058.scholar: "Calmaos. El ratón comió pan y nada más."
 pam_secular_faith_events.0058.mean: "¡¿Dejasteis que un #EMP ratón#! se cenase a [ROOT.Char.GetFaith.HighGodName]?! ¡Fuera de mi [ROOT.Char.Custom('GetCourt')]!"
 pam_secular_faith_events.0058.a: "Comprad una píxide con un cierre mejor."
 pam_secular_faith_events.0058.b: "¿Entonces el ratón se ha condenado? ¡Ja!"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#!: «¿qué se comió el ratón?» Una cuestión que los eruditos han debatido a conciencia: si un ratón roe la hostia consagrada, ¿se ha comido el cuerpo de Dios? El derecho canónico dispone penitencia para los sacerdotes que sean descuidados al guardar el sacramento y los grandes doctores decidieron que el ratón solo se come la apariencia de pan; el sacramento se retira de los dientes indignos."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "Una cajita con tapa, normalmente de plata o dorada, donde se guarda el pan consagrado para la misa. El derecho canónico exige que se guarde limpia, cerrada con llave y a salvo de manos profanas… o visitantes hambrientos."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "Pan consagrado en la misa y apartado después, guardado en la iglesia para que enfermos y moribundos puedan recibirlo en cualquier momento. Una vez consagrado, se entiende que el pan es el verdadero cuerpo de Dios, por lo que guardarlo a salvo es de suma importancia."
 pam_secular_faith_events.0059.t: "El día del Señor"
 pam_secular_faith_events.0059.desc: "Al amanecer, corre la voz de que se ha visto un ejemplar de [sighting_county.Custom('GetAnimalType')] [sighting_county.Custom('GetAnimalAdjective')] en las zonas de [sighting_province.Custom('GetTerrainTypePlural')] de [sighting_county.GetBaseNameNoTier]. Los sabuesos aúllan y los caballos pisotean el suelo del patio, pero mi [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], se planta en la puerta.\n\n«Hoy es [Glossary( 'el día de descanso', 'LORDS_DAY_GLOSS' )], [ROOT.Char.Custom('FormOfAddressForLiege')]. ¡La campana ha repicado y la misa aguarda!».\n\n«Seis días os ha dado [ROOT.Char.GetFaith.HighGodName] para cabalgar. ¿También codiciáis este?»."
 pam_secular_faith_events.0059.a: "Desensillad a los caballos. Oiremos misa."
 pam_secular_faith_events.0059.b: "Mi [sighting_county.Custom('GetAnimalType')] no espera. ¡A caballo!"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "El primer día de la semana, conservado santo en recuerdo de la Resurrección. En este, los concilios eclesiásticos prohibieron el trabajo servil, los mercados y la diversión frívola, y los reyes cristianos convirtieron la prohibición en ley… Aunque muchos señores consideraban la caza como el sermón, un asunto entre ellos y Dios."
 pam_secular_faith_events.0060.t: "Una vida libre de cargas"
 pam_secular_faith_events.0060.desc: "Cuando cabalgo por las calles de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], angustiad[ROOT.Char.Custom('ES_OA')] por mis arcas vacías y mi confusión interna, vislumbro a un[hermit.Custom('ES_XA')] mendig[hermit.Custom('ES_OA')].\n\nLibre de posesiones mundanas, baila con la paz y la comprensión de alguien que ha aceptado su lugar en el mundo. Un alma liberada de las pesadumbres que sufro.\n\nQuizás [hermit.GetSheHe] ve una verdad que también podría liberarme."
 pam_secular_faith_events.0060.a: "¡Cuanto menos tengo, más soy!"
 pam_secular_faith_events.0060.b: "¡Volveré a dorar esta jaula mía!"
 pam_secular_faith_events.0060.c: "Sacadme de esta lluvia."
