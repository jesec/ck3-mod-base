l_spanish:
 # Canonizing Saints
 # Christian faiths use Saint/Canonize wording; religions with an attested term for the venerated dead use it (Wali, Divus, Siddha, Kami - see pam_saint_custom_loc.txt); everything else uses Venerated Ancestor/Venerate (matches the vanilla saint trait and 20_pam_flavorization.txt). Three mechanisms: (1) scopeless keys pick the _saint/_va variant via SelectLocalization on the local player's religion, and the _va branch pulls its per-religion noun from a custom loc on GetPlayer; (2) scope-bearing keys whose only divergence is a single word/phrase swap just that fragment via a custom loc, keeping the sentence one key so its saved scopes stay live (called on the saint's scope where one exists, so gendered terms resolve); (3) clause-level scope-bearing keys (petition_sent, 0001.a.tt, 0002.desc, 0003.desc) keep the _saint/_va split and branch in script (triggered_desc), because their wording diverges across several phrases and they lean on multiple saved scopes a custom loc can't carry.
 # Canonize decision
 pam_canonize_saint_decision: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] [GetPlayer.Custom('PamVenerateObjectTitle')|l]"
 pam_canonize_saint_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_desc_saint', 'pam_canonize_saint_decision_desc_va' )]"
 pam_canonize_saint_decision_desc_saint: "Propondré que se reconozca a uno de mis parientes fallecidos como santo, de este modo será consagrado y descansará bajo la luz."
 pam_canonize_saint_decision_desc_va: "Elevaré a uno de mis parientes fallecidos para que sea honrado como [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], y sus restos descansarán en un santuario para ser [GetPlayer.Custom('PamConsecratedEnshrined')]s como merecen."
 pam_canonize_saint_decision_tooltip: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonize_saint_decision_tooltip_saint', 'pam_canonize_saint_decision_tooltip_va' )]"
 pam_canonize_saint_decision_tooltip_saint: "Eleva a un miembro fallecido de tu [dynasty|El] a la [sainthood|El]."
 pam_canonize_saint_decision_tooltip_va: "Eleva a un miembro fallecido de tu [dynasty|El] a [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]."
 pam_canonize_saint_decision_confirm: "Elegir un lugar de descanso"
 pam_canonize_saint_decision_req_candidate: "Un ancestro #EMP fallecido#! de tu [dynasty|El] sin un rasgo [sinful|El] y al menos un rasgo [virtuous|El], a quien aún no se venere"
 pam_canonize_saint_decision_req_site: "Una [Concept('ecclesiastical_domicile','finca eclesiástica')|E] con una [Concept('ecclesiastical_domicile_building','catedral')|E] en tu [realm|El] en la que consagrarlo o, cuando todas estén ocupadas, una provincia vecina"
 pam_canonize_saint_decision_req_site_holy_site: "Un [Concept('holy_site','lugar sagrado')|E] de tu [faith|El] en tu [realm|El] en el que consagrarlo o, cuando todos estén ocupados, una provincia vecina"
 pam_canonize_saint_decision_canonize_tt: "[GetPlayer.Custom('PamCanonizeVenerateVerb')|U] al cabeza de la dinastía elegido que ya no está entre nosotros, [GetPlayer.Custom('PamConsecratingEnshrining')] sus restos"
 pam_canonize_saint_decision_choose_1_tt: "Elige la [Concept('ecclesiastical_domicile_building','catedral')|E] en tu [realm|El] en la que consagrarlo"
 pam_canonize_saint_decision_choose_1_holy_site_tt: "Elige el [Concept('holy_site','lugar sagrado')|E] de tu [faith|El] en tu [realm|El] en el que consagrarlo"
 # Clause-level split kept in script (triggered_desc): three phrases diverge and the sentence needs saint_candidate / consecration_province / petition_recipient, which a custom loc can't all carry.
 pam_canonize_saint_petition_sent_tt_saint: "Se enviará una petición [petition_recipient.Custom('ES_AlAla')] [petition_recipient.GetTitledFirstName|l] para que apruebe el reconocimiento de [saint_candidate.GetFirstName] como [Concept('canonized','sant')|E][saint_candidate.Custom('ES_OA')] y su consagración en [consecration_province.GetName]"
 pam_canonize_saint_petition_sent_tt_va: "Se enviará una petición [petition_recipient.Custom('ES_AlAla')] [petition_recipient.GetTitledFirstName|l] para que apruebe el reconocimiento de [saint_candidate.GetFirstName] como [saint_candidate.Custom('PamVeneratedSaintOrAncestor')] y sea [GetPlayer.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]"
 # Sentence stays a single key (saint_candidate / canonizer saved scopes stay live via custom_tooltip); only the canonize/venerate verb swaps, via the PamCanonizeVenerateVerb custom loc.
 pam_canonize_saint_hof_chance_tt: "A juzgar por el número de [Concept('trait','rasgos')|E] virtuosos de [saint_candidate.GetShortUIName], [canonizer.Custom('ES_ElLa')] [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName|l] tiene un #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance')|0%]#! de probabilidad de conceder la petición para [GetPlayer.Custom('PamCanonizeVenerateVerb')]l[saint_candidate.Custom('ES_OA')]"
 pam_canonize_saint_hof_chance_cynical_tt: "A juzgar por el número de [Concept('trait','rasgos')|E] virtuosos de [saint_candidate.GetShortUIName], aún atemperados por la naturaleza cínica [canonizer.Custom('ES_DelDela')] [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName|l], est[canonizer.Custom('ES_EA')] tiene un #EMP [saint_candidate.MakeScope.ScriptValue('pam_hof_canonization_accept_chance_cynical')|0%]#! de probabilidad de conceder la petición para [GetPlayer.Custom('PamCanonizeVenerateVerb')]l[saint_candidate.Custom('ES_OA')]"
 pam_canonize_saint_hof_chance_puppet_tt: "Dado que [canonizer.GetFaith.GetReligiousHead.Custom('ES_ElLa')] [canonizer.GetFaith.GetReligiousHead.GetTitledFirstName|l] responde ante ti, es #EMP seguro#! que se te concederá la petición de [GetPlayer.Custom('PamCanonizeVenerateVerb')] a [saint_candidate.GetShortUIName]"
 # Custom-loc vocabulary fragments (Christian / per-religion / fallback), referenced only by pam_saint_custom_loc.txt. The surrounding sentences stay full keys so their saved scopes stay live. Terms match the saint flavorization (20_pam_flavorization.txt) and trait names.
 pam_canonize_verb_christian: "canonizar"
 pam_canonize_verb_hellenism: "deificar"
 pam_canonize_verb_confucianism: "honorificar"
 pam_canonize_verb_taoism: "investir"
 pam_canonize_verb_other: "venerar"
 pam_saint_noun_christian: "[Concept('canonized','santo')|E]"
 pam_saint_noun_islam: "[Concept('canonized','valí')|E]"
 pam_saint_noun_islam_female: "[Concept('canonized','valiya')|E]"
 pam_saint_noun_hellenism: "[Concept('canonized','divus')|E]"
 pam_saint_noun_hellenism_female: "[Concept('canonized','diva')|E]"
 pam_saint_noun_jainism: "[Concept('canonized','siddha')|E]"
 pam_saint_noun_shintoism: "[Concept('canonized','kami')|E]"
 pam_saint_noun_confucianism: "[Concept('canonized','shengxian')|E]"
 pam_saint_noun_buddhism: "[Concept('canonized','ārya')|E]"
 pam_saint_noun_taoism: "[Concept('canonized','zhenren')|E]"
 pam_saint_noun_judaism: "[Concept('canonized','tzadik')|E]"
 pam_saint_noun_other: "ancestro venerado"
 # Every branch carries its own article (a/an varies per term) - the calling sentence must not add one.
 pam_venerated_saint_christian: "un santo"
 pam_venerated_saint_christian_capitalized: "un Santo"
 pam_venerated_saint_islam: "un valí"
 pam_venerated_saint_islam_female: "una valiya"
 pam_venerated_saint_hellenism: "un divus"
 pam_venerated_saint_hellenism_female: "una diva"
 pam_venerated_saint_jainism: "un siddha"
 pam_venerated_saint_shintoism: "un kami"
 pam_venerated_saint_confucianism: "un shengxian"
 pam_venerated_saint_buddhism: "un ārya"
 pam_venerated_saint_taoism: "un zhenren"
 pam_venerated_saint_judaism: "un tzadik"
 pam_venerated_saint_judaism_female: "una tzadeket"
 pam_venerated_saint_other: "un ancestro venerado"
 pam_blessed_ones_christian: "los benditos"
 pam_blessed_ones_islam: "los valíes"
 pam_blessed_ones_hellenism: "los divi"
 pam_blessed_ones_jainism: "los siddhas"
 pam_blessed_ones_shintoism: "los kamis"
 pam_blessed_ones_confucianism: "los shengxian"
 pam_blessed_ones_buddhism: "los āryas"
 pam_blessed_ones_taoism: "los zhenren"
 pam_blessed_ones_judaism: "los tzadik"
 pam_blessed_ones_other: "los ancestros venerados"
 # Plain bare noun for names/titles/possessives (no concept link, capitalized fallback), via PamSaintOrAncestorTitleNoun.
 pam_saint_title_noun_christian: "Santo"
 pam_saint_title_noun_islam: "Valí"
 pam_saint_title_noun_hellenism: "Divus"
 pam_saint_title_noun_jainism: "Siddha"
 pam_saint_title_noun_shintoism: "Kami"
 pam_saint_title_noun_confucianism: "Shengxian"
 pam_saint_title_noun_buddhism: "Ārya"
 pam_saint_title_noun_taoism: "Zhenren"
 pam_saint_title_noun_judaism: "Tzadik"
 pam_saint_title_noun_other: "Ancestro venerado"
 # Title-cased fallbacks for the name-context commands; the bespoke branches reuse the pam_venerated_saint_* fragments above.
 pam_venerated_saint_other_title: "un ancestro venerado"
 pam_venerate_object_other: "un ancestro"
 pam_consecrate_christian: "sacralizar"
 pam_consecrate_others: "consagrar"
 pam_consecrate_christian_past: "sacralizado"
 pam_consecrate_others_past: "consagrado"
 pam_consecrate_christian_present: "sacralizando"
 pam_consecrate_others_present: "consagrando"
 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va' )]"
 pam_choose_consecration_site_decision_saint: "Consagrar al santo"
 pam_choose_consecration_site_decision_va: "Consagrar a [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va' )]"
 pam_choose_consecration_site_decision_desc_saint: "Elegiré la [Concept('ecclesiastical_domicile_building','catedral')|E] de mi [realm|El] en la que consagrar a este [Concept('canonized','santo')|E] y donde reposarán sus restos, que atraerán a los fieles."
 pam_choose_consecration_site_decision_desc_va: "Elegiré el lugar sagrado de mi [realm|El] en el que consagrar a este [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] y donde reposarán sus restos, que atraerán a los fieles."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va' )]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "Elegiré el [Concept('holy_site','lugar sagrado')|E] de mi [faith|El] en mi [realm|El] en el que consagrar a este [Concept('canonized','santo')|E] y donde reposarán sus restos, que atraerán a los fieles."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Elegiré el [Concept('holy_site','lugar sagrado')|E] de mi [faith|El] en mi [realm|El] en el que consagrar a este [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] y donde reposarán sus restos, que atraerán a los fieles."
 pam_choose_consecration_site_decision_tooltip: "Elige dónde consagrar al [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] elegido."
 pam_choose_consecration_site_decision_confirm: "Consagrar"
 pam_choose_consecration_site_decision_select_tt: "Selecciona un lugar en el que consagrar al [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "Extraer una reliquia"
 pam_extract_relic_decision_desc: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] descansa [GetPlayer.Custom('PamConsecratedEnshrined')] en mi señorío. Si se le rinde la debida veneración, se podrá obtener una reliquia de sus restos con la que bendecir a los fieles."
 pam_extract_relic_decision_tooltip: "Toma una reliquia de un [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] enterrado en las tierras que controlas."
 pam_extract_relic_decision_confirm: "Extraer la reliquia"
 pam_extract_relic_decision_req_saint: "[GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] del que puedes obtener una reliquia descansa en tu [realm|El]"
 pam_extract_relic_decision_req_saint_count: "[CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] de [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact','reliquias')|E] extraídas de [CHARACTER.GetShortUIName] hasta ahora"
 pam_extract_relic_decision_extract_tt: "Crea una sagrada [Concept('artifact','reliquia')|E] a partir de restos de [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_extract_relic_decision_choose_tt: "Elige de qué [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')] enterrado obtener una [Concept('artifact','reliquia')|E]"
 pam_extract_relic_decision_item_valid_tt: "Aún se puede obtener una [Concept('artifact','reliquia')|E] sagrada de este [GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]."
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "La petición ha partido"
 pam_saint_events.0001.desc: "La causa de [saint_candidate.GetFirstName] se ha preparado, y un lugar de honor en [consecration_province.GetName] está esperando sus restos bendecidos.\n\nEl asunto ya no está en mis manos: la petición ha partido hacia [petition_recipient.Custom('ES_ElLa')] [petition_recipient.GetTitledFirstName|l], y solo puedo rezar para que su juicio sea favorable."
 pam_saint_events.0001.a: "Entonces, esperaremos y rezaremos."
 pam_saint_events.0001.a.tt_saint: "Una petición para reconocer a [saint_candidate.GetFirstName] como [Concept('canonized','sant')|E][saint_candidate.Custom('ES_OA')] y consagrarl[saint_candidate.Custom('ES_OA')] en [consecration_province.GetName] se ha enviado [petition_recipient.Custom('ES_AlAla')] [petition_recipient.GetTitledFirstName|l]. Su respuesta llegará con el tiempo."
 pam_saint_events.0001.a.tt_va: "Se ha enviado [petition_recipient.Custom('ES_AlAla')] [petition_recipient.GetTitledFirstName|l] una petición para honrar a [saint_candidate.GetFirstName] como [saint_candidate.Custom('PamVeneratedSaintOrAncestor')] y que sea [saint_candidate.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]. Su respuesta llegará con el tiempo."
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va' )]"
 pam_saint_events.0002.t_saint: "Una petición de santidad"
 pam_saint_events.0002.t_va: "Una petición de veneración"
 pam_saint_events.0002.desc_saint: "[canonizer.Custom('ES_ElLa')|U] [canonizer.GetTitledFirstName|l] nos ruega que sumemos a [saint_candidate.GetFirstName] entre los santos bendecidos, y consagremos su cuerpo en [consecration_province.GetName]."
 pam_saint_events.0002.desc_va: "[canonizer.Custom('ES_ElLa')|U] [canonizer.GetTitledFirstName|l] nos ruega que honremos a [saint_candidate.GetFirstName] entre [saint_candidate.Custom('PamBlessedOnesOrAncestors')], cuyo cuerpo está [saint_candidate.Custom('PamConsecratedEnshrined')] en [consecration_province.GetName]."
 pam_saint_events.0002.desc.traits_1: "\n\nEn vida, [saint_candidate.GetFirstNameNoTooltip] fue un[saint_candidate.Custom('ES_XA')] [saint_candidate.GetWomanMan] conocid[saint_candidate.Custom('ES_OA')] por ser [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_2: "\n\nEn vida, [saint_candidate.GetFirstNameNoTooltip] fue un[saint_candidate.Custom('ES_XA')] [saint_candidate.GetWomanMan] conocid[saint_candidate.Custom('ES_OA')] por ser [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l] y [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.traits_3: "\n\nEn vida, [saint_candidate.GetFirstNameNoTooltip] fue un[saint_candidate.Custom('ES_XA')] [saint_candidate.GetWomanMan] conocid[saint_candidate.Custom('ES_OA')] por ser [pam_saint_ptrait_1.GetNameNoTooltip( saint_candidate.Self )|l], [pam_saint_ptrait_2.GetNameNoTooltip( saint_candidate.Self )|l] y [pam_saint_ptrait_3.GetNameNoTooltip( saint_candidate.Self )|l]."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va' )]"
 pam_saint_events.0002.desc.virtue_1_saint: "Una luz parpadeante emana de esta alma; una llama modesta, y sin embargo, no cualquier santo se forja en un fuego tan grande.\n\nSu juicio recae en nosotros."
 pam_saint_events.0002.desc.virtue_1_va: "Una luz parpadeante emana de esta alma; una llama modesta, y sin embargo, no cualquier alma venerada se forja en un fuego tan grande.\n\nSu juicio recae en nosotros."
 pam_saint_events.0002.desc.virtue_2: "El propósito de esta alma de agradar a [saint_candidate.GetFaith.HighGodName] no debía subestimarse, pues era la señal de una evidente, aunque imperfecta, gracia.\n\nSu juicio recae en nosotros."
 pam_saint_events.0002.desc.virtue_3: "La virtud es la encarnación de esta alma; raro es el mortal que representa a lo divino de una manera tan sencilla.\n\nSu juicio recae en nosotros."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName] verdaderamente se lo merece."
 pam_saint_events.0002.a.dynasty_opinion_tt: "Los miembros de la [Concept('dynasty','dinastía')|E] [canonizer.GetFaith.GetAdjective] de [canonizer.GetShortUIName] ganan #P 10#! de [Concept('opinion','opinión')|E] sobre ti durante 20 años"
 pam_saint_events.0002.b: "No lo aprobamos."
 pam_saint_events.0002.b.dynasty_opinion_tt: "Los miembros de la [Concept('dynasty','dinastía')|E] [canonizer.GetFaith.GetAdjective] de [canonizer.GetShortUIName] pierden #N 10#! de [Concept('opinion','opinión')|E] sobre ti durante 20 años"
 # Opinion Modifiers
 pam_canonization_approved_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_approved_petitioner_opinion_saint', 'pam_canonization_approved_petitioner_opinion_va' )]"
 pam_canonization_approved_petitioner_opinion_saint: "Canonización de miembro de la [dynasty|El] aprobada"
 pam_canonization_approved_petitioner_opinion_va: "Veneración de miembro de la [dynasty|El] aprobada"
 pam_canonization_approved_dynasty_opinion: "$pam_canonization_approved_petitioner_opinion$"
 pam_canonization_denied_petitioner_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_denied_petitioner_opinion_saint', 'pam_canonization_denied_petitioner_opinion_va' )]"
 pam_canonization_denied_petitioner_opinion_saint: "Canonización de miembro de la [dynasty|El] denegada"
 pam_canonization_denied_petitioner_opinion_va: "Veneración de miembro de la [dynasty|El] denegada"
 pam_canonization_denied_dynasty_opinion: "$pam_canonization_denied_petitioner_opinion$"
 pam_canonization_celebrated_dynasty_opinion: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_canonization_celebrated_dynasty_opinion_saint', 'pam_canonization_celebrated_dynasty_opinion_va' )]"
 pam_canonization_celebrated_dynasty_opinion_saint: "Canonización de un miembro de la [dynasty|El]"
 pam_canonization_celebrated_dynasty_opinion_va: "Veneración de un miembro de la [dynasty|El]"
 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va' )]"
 pam_saint_events.0003.t_saint: "Un nuevo santo"
 pam_saint_events.0003.t_va: "Un nuevo [GetPlayer.Custom('PamSaintOrAncestorTitleNoun')|l]"
 pam_saint_events.0003.desc_saint: "Está hecho. [saint_candidate.GetFirstName] ha pasado a formar parte de los santos y se ha consagrado en [consecration_province.GetName]. Que su luz bendiga a los [saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip] por las generaciones que vendrán."
 pam_saint_events.0003.desc_va: "Está hecho. Se honra a [saint_candidate.GetFirstName] en [consecration_province.GetName] al habérsele [saint_candidate.Custom('PamConsecratedEnshrined')] entre [saint_candidate.Custom('PamBlessedOnesOrAncestors')]. Que su luz bendiga a nuestro señorío por las generaciones venideras."
 pam_saint_events.0003.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va' )]"
 pam_saint_events.0003.a_saint: "Deo gratias."
 pam_saint_events.0003.a_va: "Damos las gracias."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Los miembros de tu [Concept('dynasty','dinastía')|E] que comparten tu [faith|El] ganan #P 20#! de [Concept('opinion','opinión')|E] sobre ti durante 20 años"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va' )]"
 pam_saint_events.0004.t_saint: "Santidad negada"
 pam_saint_events.0004.t_va: "Veneración negada"
 pam_saint_events.0004.desc: "Nuestra petición para [GetPlayer.Custom('PamCanonizeVenerateVerb')] a [saint_candidate.GetFirstName] ha sido rechazada por [petition_recipient.Custom('ES_ElLa')] [petition_recipient.GetTitledFirstName|l]. Por ahora [saint_candidate.GetFirstName] no se contará entre [GetPlayer.Custom('PamBlessedOnesOrAncestors')]."
 pam_saint_events.0004.a: "Que así sea."
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "Relicario preparado"
 pam_saint_events.0005.desc: "En [extract_site.GetName] manos reverentes se aprestan en solemne labor para que pueda extraerse una reliquia sagrada de los restos bendecidos de [relic_saint.GetShortUIName].\n\nSe están llevando a cabo los preparativos para celebrar esta ocasión sagrada."
 pam_saint_events.0005.a: "Hagámoslo con suma reverencia."
 pam_saint_events.0005.a.tt: "Pronto se podrá obtener una [Concept('artifact','reliquia')|E] sagrada de [relic_saint.GetShortUIName] en [extract_site.GetName]."
 # The relic is drawn
 pam_saint_events.0006.t: "Una reliquia sagrada"
 pam_saint_events.0006.desc_relic: "De los restos sagrados de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')]s en [extract_site.GetName], hemos extraído una reliquia sagrada: #EMP [relic_artifact.GetName]#!. Que bendiga a los creyentes de mi señorío por las generaciones que vendrán."
 pam_saint_events.0006.desc: "De los restos sagrados de [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')]s en [extract_site.GetName], se ha extraído una [Concept('artifact','reliquia')|E] sagrada que bendecirá nuestro señorío."
 pam_saint_events.0006.a: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va' )]"
 pam_saint_events.0006.a_saint: "¡Gloria Deo!"
 pam_saint_events.0006.a_va: "Damos las gracias."
 pam_saint_events.0006.a.tt: "Se ha extraído la reliquia «[relic_artifact.GetName]», que ahora descansa bajo tu custodia."
 pam_dulia_relic_dynasty_prestige_tt: "Por el dogma [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )]:"
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "Por el dogma [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )], todo [ruler|El] de tu [faith|El] gana $pam_dulia_new_saint_modifier$ durante #EMP 5#! años"
 pam_dulia_new_saint_message_t: "Un nuevo intercesor"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.Custom('ES_ElLa')|U] [pam_new_saint.GetTitledFirstName|l] ha sido elevad[pam_new_saint.Custom('ES_OA')] a los altares, y los fieles del [pam_new_saint.GetFaith.GetName|l] han ganado un[pam_new_saint.Custom('ES_XA')] defensor[pam_new_saint.Custom('ES_XA')] ante Dios."
