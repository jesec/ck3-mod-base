 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "Un elegante relicario en el que se guarda un dedo sagrado extraído de los restos bendecidos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_desc: "Un elegante relicario en el que se guarda un diente sagrado extraído de los restos bendecidos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_desc: "Un elegante relicario en el que se guarda una costilla sagrada extraída de los restos bendecidos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hair_desc: "Un elegante relicario donde se guarda un mechón del sagrado cabello de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_vestment_desc: "Un elegante relicario donde se guarda un fragmento de las vestiduras de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_hand_desc: "Un elegante relicario en el que se conserva la mano sagrada de los restos bendecidos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_arm_desc: "Un elegante relicario en el que se conserva el brazo sagrado de los restos bendecidos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_desc: "Un elegante relicario en el que se conserva el venerado cráneo de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_blood_desc: "Un elegante relicario donde se guarda un vial de la sagrada sangre de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_heart_desc: "Un elegante relicario en el que se guarda el sagrado corazón de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_effigy_desc: "Una efigie creada a semejanza de [relic_creator_saint.GetShortUINameNotMe], venerada y honrada por los fieles."
 pam_saint_relic_letter_desc: "Un elegante relicario en el que se guarda una carta escrita por [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_drawing_desc: "Un famoso retrato de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_stationery_desc: "Un juego de utensilios de escritorio que usó [relic_creator_saint.GetShortUINameNotMe]. Dicen que aporta sabiduría a quien lo posee."
 pam_saint_relic_ash_desc: "Un elegante relicario en el que se guardan las sagradas cenizas de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_canopic_jar_desc: "Un recipiente que contiene los órganos internos de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_staff_desc: "Un bastón que usó [relic_creator_saint.GetShortUINameNotMe] en su viaje de peregrinación."
 pam_saint_relic_water_filter_desc: "Un paño que usó [relic_creator_saint.GetShortUINameNotMe] como filtro de agua en su viaje de peregrinación."
 pam_saint_relic_bowl_desc: "Un cuenco que usó [relic_creator_saint.GetShortUINameNotMe] mientras mendigaba comida en sus viajes de peregrinación."
 pam_saint_relic_robe_desc: "Un elegante relicario en el que se guarda la sagrada túnica de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_sword_desc: "Una espada sagrada que empuñó [relic_creator_saint.GetShortUINameNotMe], que dicen que otorga protección y fuerza divinas a los fieles que la porten."
 pam_saint_relic_sarira_desc: "Un elegante relicario en el que se guarda una sarira de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_skull_buddhism_desc: "Un elegante relicario en el que se guarda una sarira: la ushnisha de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_finger_buddhism_desc: "Un elegante relicario en el que se guarda una sarira: un dedo de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_buddhism_desc: "Un elegante relicario en el que se guarda una sarira: un diente de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_buddhism_desc: "Un elegante relicario en el que se guarda una sarira: una costilla de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "Un talismán que dibujó [relic_creator_saint.GetShortUINameNotMe]. Se dice que puede ahuyentar el mal o curar a quien lo posea."
 pam_saint_relic_pellet_desc: "Un frasco de píldoras de inmortalidad elaborado por [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_footprint_desc: "Un elegante relicario en el que se guarda la huella del pie de [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_afarganyu_desc: "Un afarganyu que poseía [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_ring_desc: "Un anillo sagrado que poseía [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_bracelet_desc: "Un brazalete sagrado que poseía [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_commentary_desc: "Una colección de comentarios escritos por [relic_creator_saint.GetShortUINameNotMe] que muestran su interpretación del libro sagrado de la fe [relic_creator_saint.GetFaith.GetAdjective]."
 pam_saint_relic_tzitzit_desc: "Una hebra sagrada del tzitzit de [relic_creator_saint.GetShortUINameNotMe] que muestra su piedad."
 pam_saint_relic_relic_desc: "Un elegante relicario en el que se guarda la reliquia sagrada de [relic_creator_saint.GetShortUINameNotMe]."
 # Buried-saint point of interest
 poi_buried_saint: "Tumba de [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')|l]"
 poi_buried_saint.visit: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va' )]"
 poi_buried_saint.visit_saint: "Visita a la santa tumba"
 poi_buried_saint.visit_va: "Visita a la tumba ancestral"
 poi_buried_saint.visit_desc: "Al visitar la tumba de [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')], te embarga un sentimiento de devoción."
 poi_buried_saint.preset_visit_desc: "Te detienes ante la tumba de [visited_saint.GetShortUIName] para rendirle homenaje."
 poi_buried_saint.foreign_visit: "Visita a la tumba antigua"
 poi_buried_saint.foreign_visit_desc: "Tu fe no venera a [visited_saint.GetShortUIName], pero hay mucho que aprender en esta tumba."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Presentar tus respetos a cambio de una modesta cantidad de [piety_i|E][piety|El], con la opción de extraer una [Concept('artifact','reliquia')|E] sagrada por #EMP menos#! de lo que costaría si lo hicieras a distancia."
 pam_poi_buried_saint_on_visit_relic_tt: "Presentar tu respetos a [visited_saint.GetShortUIName] con la opción de extraer una [Concept('artifact','reliquia')|E] sagrada por #EMP menos#! de lo que costaría si lo hicieras a distancia."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Presentar tus respetos a [visited_saint.GetShortUIName], el [visited_saint.Custom('PamSaintOrAncestorNoun')] a quien se enterró aquí."
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "En la tumba de [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.desc: "Mis viajes me han traído hasta el lugar de descanso de [visited_saint.GetShortUIName], [visited_saint.Custom('PamSaintOrAncestorNoun')] de mi fe. El aire se nota pesado y cargado de santidad, y en torno a la tumba los fieles se arrodillan para rezar en silencio."
 pam_saint_events.0007.a: "Presentaré mis respetos y seguiré mi camino."
 pam_saint_events.0007.b: "Extraigamos una reliquia sagrada."
 pam_saint_events.0007.b.tt: "Se puede extraer una [Concept('artifact','reliquia')|E] sagrada de los restos de [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.b.toast: "Extracción de reliquia sagrada"
 pam_saint_events.0007.b.toast_desc: "Con manos reverentes, hemos extraído la reliquia «[relic_artifact.GetName]» de los restos de [visited_saint.GetShortUINameNoTooltip]. Con ella bendeciremos mi [realm|El]."
