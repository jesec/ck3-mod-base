l_spanish:
 pam_religious_artifact_events.0001.t: "Una empresa sagrada"
 pam_religious_artifact_events.0001.desc: "«[ROOT.Char.Custom('FormOfAddressForLiege')|U]», mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] entra en la habitación con una sonrisa. «¡Lo he visto en sueños!».\n\n«Una hermosa obra de arte, cuidadosamente elaborada a partir de las gemas más delicadas, dedicada a [ROOT.Char.GetFaith.HighGodName|U] y únicamente a [ROOT.Char.GetFaith.HighGodName|U]. ¡Dotadme de los medios necesarios y regresaré con el artefacto más bello que podría imaginar un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l]!».\n\nUna promesa osada, pero ¿cómo de habitual es que [ROOT.Char.GetFaith.HighGodName|U] te bendiga con una visión?"
 pam_religious_artifact_events.0001.aa: "¡Parece que solo queréis aflojar mi bolsa!"
 pam_religious_artifact_events.0001.a: "¡Mi piedad no conoce límites!"
 pam_religious_artifact_events.0001.b: "[ROOT.Char.GetFaith.HighGodName|U] no necesita baratijas."
 pam_religious_artifact_events.0002.desc: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('inspiration_owner'))] [inspiration_owner.GetFirstName] me ha llamado a la capilla del castillo. El motivo se aclara de inmediato, cuando orgullosamente me presenta el encargo que más esperaba recibir.\n\n[newly_created_artifact.GetDesc]"
 pam_religious_artifact_events.0002.a: "¡Buen trabajo, [inspiration_owner.GetFirstNameNoTooltip]!"
 create_artifact_religious_artifact_tooltip: "[inspiration_owner.GetShortUIName] ha creado [newly_created_artifact.GetName] de [SCOPE.Custom('ArtifactQuality')] factura"
