l_spanish:
 # Monastic funeral — the order's care when a funeral is held at one of its houses
 # Funeral planner province line (activity_funeral province_description / ai_will_select_province)
 activity_funeral_monastic: "#P +++ Monasterio#!\n"
 pam_monastic_funeral.0001.t: "Plegarias sin fin"
 pam_monastic_funeral.0001.desc.intro: "Los últimos cánticos se desvanecen bajo las criptas. Se han terminado los ritos en honor [deceased.Custom('ES_DelDela')] [deceased.GetTitledFirstName|l] y el silencio vuelve a asentarse en la casa de [abbot.GetPrimaryTitle.GetNameNoTier|l].\n\n"
 pam_monastic_funeral.0001.desc.brothers: "Los hermanos forman en fila de a dos, capuchas subidas, y nos dejan en un silencio reverente."
 pam_monastic_funeral.0001.desc.sisters: "Las hermanas forman en fila de a dos, capuchas subidas, y nos dejan en un silencio reverente."
 pam_monastic_funeral.0001.desc.outro: "\n\n[abbot.Custom('ES_ElLa')|U] [abbot.GetTitledFirstName|l] sigue a mi lado. «Aquí los difuntos están a buen recaudo, [ROOT.Char.Custom('FormOfAddressForLiege')]», me dice. «Y nuestras oraciones no han de acabar en la tumba. Su nombre destacará en [Glossary( 'nuestros obituarios', 'PAM_NECROLOGY_GLOSS' )] mientras haya una voz que los lea»."
 pam_monastic_funeral.0001.a: "Rezad por mi casa, ahora y siempre."
 pam_monastic_funeral.0001.b: "Invitar a los peregrinos a rezar por el alma de [deceased.GetFirstNameNoTooltip]."
 pam_monastic_funeral.0001.c: "Los difuntos están bien guardados. Me basta con eso."
 # Monastic register of the dead, read aloud in the daily office - https://en.wikipedia.org/wiki/Necrology
 PAM_NECROLOGY_GLOSS: "El registro donde una casa monástica anotaba los nombres de sus difuntos; hermanos, patrones y benefactores por igual. Todos los días se leían los nombres de fallecidos en capítulo y la comunidad rezaba por esas almas; una vez un nombre quedaba registrado, se recordaba mientras existiera la casa."
 pam_monastic_commemoration_modifier: "Rememoración perpetua"
 pam_monastic_commemoration_modifier_desc: "La casa de este personaje está registrada en el obituario de una orden monástica, se recuerda a sus difuntos en las plegarias diarias de la orden."
 pam_monastic_chronicle_modifier: "Lugar de descanso nobiliario"
 pam_monastic_chronicle_modifier_desc: "El lugar de reposo eterno de un miembro de la nobleza atrae a peregrinos piadosos a rezar por su alma."
