l_spanish:
 only_theocratic_tt: "El [government|El] de [Select_CString( THIS.Char.IsLocalPlayer, 'tu señorío', THIS.Char.GetShortUIName )] no permite nombramientos [Concept( 'theocratic', 'teocráticos' )|E] #weak ([THIS.Char.GetGovernment.GetAdjective|l])#!"
 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U] deben pertenecer al [clergy|El], o el [THIS.Char.GetFaith.GetName|l] debe tener la [doctrine|El] $doctrine_theocracy_lay_clergy_name$"
 can_be_appointed_interaction_can_inherit_tt: "Los [titles|El] deben poder ser heredados por [THIS.Char.GetWomenMen] #weak (no de carácter [GetTrait('disinherited').GetName( THIS.Char )|l], [GetTrait('gallivanter').GetName( THIS.Char )|l] o [GetTrait('order_member').GetName( THIS.Char )|l])#!"
 theocracy_lease: "Arriendo teocrático"
 theocracy_lease_desc: "Esta posesión está [Concept('leased', 'arrendada')|E] a un [Concept( 'realm_priest', 'clérigo del señorío' )|El] de la [faith|El] del titular.\n\nContribuirá con [tax|El] y [levies|El] a su [liege|El] (si tiene permiso) y a su [religious_superior|El].\n\nSu superior religioso es el [Concept( 'realm_priest', 'clérigo del señorío' )|El] de su [liege|El], si tienen la misma fe. Si no, será el [head_of_faith|El] de su fe."
 ecclesiastical_lease: "Arriendo eclesiástico"
 ecclesiastical_lease_desc: "Esta posesión está [Concept('leased', 'arrendada')|El] a un [Concept( 'realm_priest', 'clérigo del señorío' )|El] de la [faith|El] [Concept('ecclesiastical', 'eclesiástica')|E] del titular.\n\nContribuirá con [tax|El] y [levies|El] a su [liege|El] (si tiene permiso), a su [religious_superior|El] y a su [head_of_faith|El] directamente.\n\nSu superior religioso es el [holder|El] del [clerical_title|El] eclesiástico al que pertenezca la capital de su señor. Si no, será el [head_of_faith|El] de su fe."
