 pam_interactions_events.0090.opening: "Oh, [puppet_or_actor.GetMotherFather] del señorío,"
 pam_interactions_events.0090.desc: "¡Verdaderamente, la mirada de [recipient.GetFaith.HighGodName] se ha posado sobre [recipient.GetPrimaryTitle.GetNameNoTier] para concederle su benevolente favor! Tras vuestro dictamen, me he convertido en [recipient.GetTitleAsName|l] de estas tierras, y los fieles de fe [recipient.GetFaith.GetAdjective] se alegran.\n\nProtegeré [recipient.GetPrimaryTitle.GetTierAsName|l] con mi vida. Con mis leyes, gobernaré sabiamente. Con mi espada y cetro, gobernaré con firmeza. Y escucharé atentamente vuestro consejo."
