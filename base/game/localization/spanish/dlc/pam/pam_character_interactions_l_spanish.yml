 pam_clergy_land_forced_success_tt: "@alert_icon! #alert_trial #EMP #bold ¡[recipient.GetShortUIName] solo aceptará esta [interaction|El] si se le obliga!#!#!#!"
 pam_clergy_land_possible_success_tt: "@warning_icon! #X #bold [recipient.GetShortUIName] debe estar convencid[recipient.Custom('ES_OA')] y aun así puede rechazar esta [interaction|El]#!#!"
 clergy_land_if_accepted_tt: "#alert_trial #bold Si [recipient.GetShortUIName] acepta:#!#!"
 clergy_transfer_vassal_tt: "[target.GetHolder.GetShortUIName|U] [Select_CString(target.IsLocalPlayer, 'te vuelves', 'se vuelve')] [vassal|El] de [Select_CString(actor.IsLocalPlayer,'tu personaje', actor.GetShortUIName)]"
 # Clerical land transfer events
 # player Priest refuses event
 pam_interactions_events.0031.opening: "Mi obstinad[actor.Custom('ES_OA')] [actor.Custom('GetDaughterSon')],"
 pam_interactions_events.0031.desc: "[actor.GetFaith.HighGodName] os dio labios para pronunciar palabras justas. [actor.GetFaith.HighGodName] os dio manos para blandir la espada. Y [actor.GetFaith.HighGodName] dio los [actor.GetFaith.PriestNeuterPlural] al mundo para que escucharais su sabiduría. \n\nConsumid[actor.Custom('ES_OA')] por la codicia, pronunciáis palabras injustas. Acosad[actor.Custom('ES_OA')] por la duda aterradora, guardáis la espada que ansiáis usar contra [target.GetNameNoTier].\n\nY, de este modo, la cuestión se resume a esto: escuchad mi sabiduría… y dejad [target.GetTierAsName|l] en paz."
 pam_interactions_events.0031.a: "¡[secondary_recipient.Custom('ES_ElLa')|U] [secondary_recipient.GetTitleAsNameNoTooltip|l] rechaza mi causa!"
 # Player clergy response event
 pam_interactions_events.0033.opening: "Guardián del orden celestial y terrenal,"
 pam_interactions_events.0033_de_jure: "Busco vuestra ayuda. Proclamo que mi poder se extiende legítimamente sobre [target.GetName], que me pertenece por derecho de iure. Armadme con vuestra aprobación para convencer a [recipient.GetName] sin derramar sangre.\n\n"
 pam_interactions_events.0033_claim: "Busco hacer realidad mi reclamación sobre [target.GetNameNoTier]. Concededme vuestra aprobación santa para que [recipient.GetName] me ceda su [target.GetTierAsName|l] sin derramar sangre [actor.GetFaith.GetAdjective].\n\n"
 pam_interactions_events.0033_threaten: "Si rechazarais esta petición… seríais #EMP vos#! quien deba explicar a [ROOT.Char.GetFaith.HighGodName] la gran masacre e incendios que infligiré en [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0033_succession: "Si habláis en mi favor, esto os prometo: si muero como [actor.GetTitleAsName|l] de [actor.GetPrimaryTitle.GetNameNoTier] —sin ningún vástago de mi casa—, entonces [actor.GetPrimaryTitle.GetNameNoTier] pasará a la iglesia."
 pam_interactions_events.0033_pilgrimage: "A cambio de vuestra santa anuencia en este asunto terrenal, os prometo realizar una peregrinación: un acto de gratitud por las bendiciones que [actor.GetFaith.HighGodName] me ha concedido."
 pam_interactions_events.0033_use_hook: "No habréis olvidado… que vuestro nombre está consignado a mis órdenes y que las palabras de vuestra pluma deben ser las de mis deseos, ¿verdad?"
 pam_interactions_events.0033_offer_hook: "Prestar vuestra reputación piadosa a mi causa no es poco favor. Apoyadme en esta política terrenal y a cambio yo os apoyaré en días venideros."
 pam_interactions_events.0033_donate: "Dadme vuestra ayuda, enriqueced mi señorío con tierras y yo donaré de buena gana a vuestras arcas piadosas."
 pam_interactions_events.0033_fallback: "A menos que las inicie un mediador santo, estas negociaciones por tierras y títulos no llevarán a nada. ¿Añadiréis vuestra autoridad sagrada a mi causa?"
 pam_interactions_events.0033.aa: "Sí. Está hecho."
 pam_interactions_events.0033.a: "[target.GetNameNoTierNoTooltip] debe ser de [actor.GetFirstNameNoTooltip], según mi decreto."
 pam_interactions_events.0033.a.tt: "Enviad una misiva [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstNameNoTooltip|l]: ¡aferrarse a su tierra poseída de modo injusto es despreciar a [secondary_recipient.GetFaith.HighGodName] y [secondary_recipient.Custom('ES_AlAla')] [secondary_recipient.GetTitleAsNameNoTooltip|l]!"
 pam_interactions_events.0033.b: "No puedo aprobar esta petición impertinente."
 pam_interactions_events.0033.b.tt: "El mundo está bien ordenado tal como está. [recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstNameNoTooltipRegnal|l] debe conservar [target.GetNameNoTierNoTooltip]."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName] intentará convencer a [Select_CString(recipient.IsLocalPlayer,'tu personaje', recipient.GetShortUIName)] de que le [Select_CString(recipient.IsLocalPlayer, 'des', 'de')] [target.GetName] y puede fracasar#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName] puede obligar a [Select_CString(recipient.IsLocalPlayer,'tu personaje', recipient.GetShortUIName)] a que le [Select_CString(recipient.IsLocalPlayer, 'des', 'de')] [target.GetName], pero también podría arriesgarse a fallar#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'darás', 'dará')] [target.GetName] a [actor.GetShortUIName] sin resistencia.#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Tu [law|El] [GetLaw('church_authority_3').GetName] te permite obligar a [recipient.GetShortUIName] a entregar [target.GetName] a [actor.GetShortUIName] sin resistencia#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "Como mediador[ROOT.Char.Custom('ES_XA')] santo, doy por lo tanto comienzo a las negociaciones."
 pam_interactions_events.0032_intro: "Habéis cuidado bien de [target.GetNameNoTier], pero es la voluntad de [recipient.GetFaith.HighGodName] que tal [target.GetTierAsNameNoTooltip|l] pertenezca a [actor.GetName]. ¿Podremos conseguir, por favor, que le cedáis las tierras sin derramar sangre?\n\n"
 pam_interactions_events.0032_de_jure: "Pues [target.GetNameNoTierNoTooltip] le pertenece por derecho #EMP de iure#!."
 pam_interactions_events.0032_claim: "Pues, a los ojos del Todopoderoso, sus derechos sobre [target.GetNameNoTierNoTooltip] son los más reales de todos."
 pam_interactions_events.0032.aa: "Veamos, dónde tengo la pluma…"
 pam_interactions_events.0032.aa.flavor: "Al mundo entero demostraré esto: que [recipient.GetFaith.HighGodName] ha negado a estos embusteros pecaminosos toda virtud [recipient.GetFaith.GetAdjectiveNoTooltip]. Lo único que poseen y poseerán es una temeridad insolente."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP El intento de [actor.GetShortUIName] de ganar [target.GetName] fracasa#!#!#!"
 pam_interactions_events.0032.a: "Si [actor.GetFaith.HighGodName] lo desea, renunciaré a [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0032.b: "No. No me habéis convencido."
 pam_interactions_events.0032.b.tt: "Si se pudiera silenciar fácilmente [actor.Custom('ES_AlAla')] [actor.GetTitledFirstNameNoTooltip|l] y [secondary_recipient.Custom('ES_AlAla')] [secondary_recipient.GetTitledFirstNameNoTooltip|l]…"
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold Puede persuadirte de aceptar su toma de [target.GetName] con uno de estos métodos:#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "Negociaciones por [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0030.desc_intro_envoy: "En terreno sagrado, mi enviad[secondary_recipient.Custom('ES_OA')], [secondary_recipient.Custom('ES_ElLa')|l] [secondary_recipient.GetTitledFirstNameRegnal|l], presentará mi argumento por [target.GetNameNoTier]."
 pam_interactions_events.0030.desc_intro: "Con la bendición [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstNameRegnal|l] y la protección del terreno sagrado, presento mi argumento por [target.GetNameNoTier]."
 pam_interactions_events.0030.desc: "Palabras de concordia pacífica, reforzadas con amenazas de guerra. Declaraciones sobre mis derechos establecidos. Y más y más…\n\n"
 pam_interactions_events.0030.desc_target: "No se expulsará [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstNameNicknamed|l] de su [target.GetTierAsNameNoTooltip|l] tan fácilmente. Este asunto de tierras debe solucionarse con promesas terrenales o amenazas malignas."
 pam_interactions_events.0030.desc_vassal: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstNameNicknamed|l] no se desprenderá de su control sobre [vassal.GetName] tan fácilmente. Tendré que ganar a mi vasall[vassal.Custom('ES_OA')] con ofertas doradas o amenazas aterradoras."
 pam_interactions_events.0030.a: "Recordad a [recipient.GetFirstNameNoTooltip] que tiene ciertas… obligaciones."
 pam_interactions_events.0030.a.flavor: "¡Y que es [actor.Custom('ES_ElLa')] [actor.GetTitleAsNameNoTooltip|l] de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] quien puede exigirlas!"
 pam_interactions_events.0030.b: "No me hace falta tal [ROOT.Char.Custom2('RelationToMe', recipient)]. Preciso [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0030.b.flavor: "Dejemos algo claro: si [recipient.GetFirstNameNoTooltip] se niega a esto, [recipient.GetSheHe] deja de ser nada para ti."
 pam_interactions_events.0030.c: "Si [recipient.GetSheHe] no cede, mancillará este terreno sagrado."
 pam_interactions_events.0030.c.tt: "¡Arremeted contra tan vil pecador[recipient.Custom('ES_XA')] con calumnias inmundas! ¡Que caigan maldiciones y desprecio sobre todos! ¡[secondary_recipient.Custom('ES_ElLa')|U] [secondary_recipient.GetTitledFirstNameNoTooltip|l] y los demás [actor.GetFaith.PriestNeuterPlural] harán que [recipient.GetFirstNameNoTooltip] se rinda!"
 pam_interactions_events.0030.d: "Amenazar con montar un escándalo deslegitimador sobre esto."
 pam_interactions_events.0030.d.flavor: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitleAsNameNoTooltip|l], ya poco respetad[recipient.Custom('ES_OA')], apenas podrá resistir si se ponen en peligro su renombre y reputación…"
 pam_interactions_events.0030.e: "Ofrecer comprar su [target.GetTierAsNameNoTooltip|l] sin más."
 pam_interactions_events.0030.f: "Dejo esto a [ROOT.Char.GetFaith.HighGodName] y al juicio de [recipient.GetFirstNameNoTooltip]."
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold ¡Si no hay incentivos, es improbable que [recipient.GetShortUIName] acepte!#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Si no hay incentivos, es menos probable que [recipient.GetShortUIName] acepte#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "La disputa de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.Custom('ES_ElLa')|U] [secondary_recipient.GetTitledFirstNameRegnal|l] profundiza en sus argumentos sobre [target.GetNameNoTier] por el bien de [actor.GetName], y también, según afirma, por el orden divino [recipient.GetFaith.HighGodNamePossessive] y la casta clerical [recipient.GetFaith.GetAdjective]."
 pam_interactions_events.0034.desc_intro: "[actor.GetName] presenta su argumento por [target.GetNameNoTier]: repasa la petición protegida y respaldada por la fe [recipient.GetFaith.GetAdjective]."
 pam_interactions_events.0034.desc_vassal: "Da igual que jurase ser leal hasta la muerte a [target.GetHolder.GetName]. Esa lealtad, al parecer, se puede negociar."
 pam_interactions_events.0034.desc_target: "Da igual que tal [target.GetTierAsNameNoTooltip|l] me pertenezca por sangre y conquista. Todo en esta tierra se puede negociar."
 pam_interactions_events.0034.desc: "\n\nAbordad[ROOT.Char.Custom('ES_OA')] en terreno sagrado, soporto en paz estos asaltos contra mis derechos. Solo puedo meditar sobre lo que se me ofrece…\n\n"
 pam_interactions_events.0034.desc_method_hook: "La promesa de que las obligaciones que [actor.Custom('ES_ElLa')] [actor.GetTitledFirstNameNoTooltip|l] tenía sobre mí serán anuladas."
 pam_interactions_events.0034.desc_method_relation: "Un final desastroso a toda la calidez, confianza y amor que había entre [Select_CString(And(ROOT.Char.IsFemale, actor.IsFemale), 'nosotras', 'nosotros')]. Su corazón, según [actor.GetFirstNameNoTooltip], está en este asunto de tierras.\n\nMe odiará para siempre por negárselas."
 pam_interactions_events.0034.desc_method_piety: "La amenaza de mi relación ya frágil con la fe indica un desastre. También pondría en peligro la [actor.Custom('ES_DelDela')] [actor.GetTitledFirstNameNoTooltip|l], pero su piedad está más asentada que la mía."
 pam_interactions_events.0034.desc_method_legitimacy: "Una tremenda amenaza contra mi legitimidad. Una riña pública espantosa por [target.GetNameNoTierNoTooltip], un escándalo que nos convertiría en un hazmerreír…"
 pam_interactions_events.0034.desc_method_gold: "Un montón de monedas relucientes. Un precio aceptable, afirma [actor.Custom('ES_ElLa')] [actor.GetTitleAsNameNoTooltip|l], por [target.GetTierAsNameNoTooltip]."
 pam_interactions_events.0034.desc_no_method: "… #EMP nada de nada#!. Solo la exigencia hecha por [target.GetNameNoTier] y la suposición de que temo la burla de los [recipient.GetFaith.PriestNeuterPlural] y los horrores de la guerra."
 pam_interactions_events.0034.a: "[actor.GetSheHe|U] puede alzar su estandarte sobre [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0034.b: "[target.GetTierAsNameNoTooltip] me pertenecerá mientras viva."
 pam_interactions_events.0035.t: "Se adquiere [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0035.desc_intro: "¡Tras cierta deliberación, [recipient.GetFirstNameNicknamed] se rinde! Las negociaciones sobre la cesión de [target.GetNameNoTier] son rápidas y fructíferas.\n\nSe cumplimenta el decreto [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstName|l] sobre mis derechos."
 pam_interactions_events.0035.desc_hook: "La obligación que tenía sobre [recipient.GetFirstNameNoTooltip] se ha cumplido honorablemente."
 pam_interactions_events.0035.desc_relation: "Sí, se han derramado lágrimas amargas y ha terminado la alegría y la admiración. He atormentado profundamente a [recipient.GetFirstNameNoTooltip] por mi ansia de hacerme con [target.GetNameNoTierNoTooltip]. Pero…"
 pam_interactions_events.0035.desc_piety: "Y, de este modo, mis amenazas de ahogarnos a mí y a [recipient.GetFirstNameNoTooltip] en la malvada ignominia… no tendrán que hacerse realidad."
 pam_interactions_events.0035.desc_legitimacy: "Y, de este modo, mis amenazas de polémica y calumnias… no tendrán que hacerse realidad."
 pam_interactions_events.0035.desc_gold: "Habiendo avisado a mis pagadores y acreedores, pagaré el precio con gusto."
 pam_interactions_events.0035.desc_fallback: "¡Tal poder invirtió [actor.GetFaith.HighGodName] en nuestros [actor.GetFaith.PriestNeuterPlural] [actor.GetFaith.GetAdherentNamePlural] y en mí! Sin necesidad de ejércitos o de librar una guerra, el mundo se reorganiza a nuestra orden."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName] me jurará lealtad."
 pam_interactions_events.0035.desc: "\n\nTal [target.GetTierAsNameNoTooltip|l] me pertenece."
 pam_interactions_events.0035.a: "¡Que se levanten mis estandartes a lo ancho y largo de [target.GetNameNoTierNoTooltip]!"
 pam_interactions_events.0036.t: "El rechazo de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0036.desc_intro_afraid_admin: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] da su respuesta guardad[recipient.Custom('ES_OA')] por soldados aguerridos, poco relajados a pesar de la pacífica mediación [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstName|l]:\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] da su respuesta guardad[recipient.Custom('ES_OA')] por [recipient.Custom('KnightCulturePluralNoTooltip')|l] corpulentos, poco relajados a pesar de la pacífica mediación [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstName|l]:\n\n"
 pam_interactions_events.0036.desc_intro_pious: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] da su repuesta sol[recipient.Custom('ES_OA')] y erguid[recipient.Custom('ES_OA')], envalentonad[recipient.Custom('ES_OA')] por la mediación pacífica [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstName|l]:\n\n"
 pam_interactions_events.0036.desc_intro_admin: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] da su respuesta flanquead[recipient.Custom('ES_OA')] por guardaespaldas que dejan ver su desprecio por la pacífica mediación [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstName|l]:\n\n"
 pam_interactions_events.0036.desc_intro: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstName|l] da su respuesta flanqueado[recipient.Custom('ES_OA')] por [recipient.Custom('KnightCulturePluralNoTooltip')|l] corpulentos que dejan ver su desprecio por la pacífica mediación [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstName|l]:\n\n"
 pam_interactions_events.0036.desc_hook: "«[target.GetNameNoTier] ocupa un lugar en mi corazón superior al de cualquier obligación que podáis invocar sobre mí."
 pam_interactions_events.0036.desc_relation: "«[actor.Custom('ES_ElLa')|U] [actor.GetTitleAsName|l] de [actor.GetPrimaryTitle.GetNameNoTier] escupe sobre mi corazón. Desgarra mi alma. No quiero saber más de [actor.GetSheHe]."
 pam_interactions_events.0036.desc_piety: "«Si os niego [target.GetNameNoTier], ¿nos envileceréis a [Select_CString(And(recipient.IsFemale, actor.IsFemale), 'ambas', 'ambos')] con pecados y acusaciones? Sea."
 pam_interactions_events.0036.desc_legitimacy: "«Contad mentiras ponzoñosas. Volved a la gente de [target.GetNameNoTier], a todas las gentes, en contra de [Select_CString(And(recipient.IsFemale, actor.IsFemale), 'ambas', 'ambos')]."
 pam_interactions_events.0036.desc_gold: "«¿Creéis que se puede comprar [target.GetNameNoTier] con oro y plata? Una transacción demasiado sencilla para tan noble [target.GetTierAsNameNoTooltip]."
 pam_interactions_events.0036.desc_fallback: "«¿Puede un[actor.Custom('ES_XA')] [actor.GetTitleAsName|l] y un[secondary_recipient.Custom('ES_XA')] [secondary_recipient.GetTitleAsNameNoTooltip|l] ganar [target.GetNameNoTier] con unas simples palabras? No."
 pam_interactions_events.0036.desc_afraid: "Mandad [recipient.GetFaith.PriestNeuterPlural] y les daré la bienvenida. Mandad enviados y con ellos trataré…».\n\n«Pero no puedo renunciar a mi [target.GetTierAsNameNoTooltip|l] así»."
 pam_interactions_events.0036.desc_pious: "Mandad más [recipient.GetFaith.PriestNeuterPlural] corruptos, mandad más huestes diabólicas armadas a [target_capital.GetTitle.GetNameNoTier]…».\n\n«No renunciaré a mi [target.GetTierAsNameNoTooltip|l] que [recipient.GetFaith.HighGodName] me entregó»."
 pam_interactions_events.0036.desc: "Mandad más [recipient.GetFaith.PriestNeuterPlural] estridentes, mandad a [target_capital.GetTitle.GetNameNoTier] más huestes armadas de [actor.Custom('GetFighterTermPlural')|l]…».\n\n«No renunciaré tan fácilmente a mi [target.GetTierAsNameNoTooltip|l]»."
 pam_interactions_events.0036.a_relation: "¡¿Cómo ha podido rechazarme?!"
 pam_interactions_events.0036.a: "¿Rechaza la voluntad [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitleAsNameNoTooltip|l]? Qué vergüenza…"
 clergy_land_transfer_refusal_tt: "Se negó a ceder [target.GetName] a [Select_CString(actor.IsLocalPlayer,'tu personaje', actor.GetUIName)]"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 pam_interactions_events.0037.desc: "Lamento lo inesperado de estas nuevas, pero he de informaros: [actor.Custom('ES_ElLa')] [actor.GetTitleAsName|l] de [actor.GetPrimaryTitle.GetNameNoTier] es vuestr[actor.Custom('ES_OA')] soberan[actor.Custom('ES_OA')] a partir de ahora.\n\nTal es la voluntad [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstNameRegnal|l], quien dirigió las negociaciones por [ROOT.Char.GetPrimaryTitle.GetTierAsName] entre [actor.Custom('ES_ElLa')] [actor.GetTitledFirstNameNicknamed|l] y mi persona. Así como habéis sido fiel a [recipient.GetPrimaryTitle.GetNameNoTier], sedlo también a [Select_CString(actor.IsFemale, 'vuestra nueva señora', 'vuestro nuevo señor' )]."
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName] se ha convertido en tu [liege|El]"
 pam_interactions_events.0037.a: "Mi juramento está anulado. Por lo tanto, nadie puede darme órdenes."
 pam_interactions_events.0037.a.tt: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstNameNoTooltip|l] ha entregado su soberanía. Y si [actor.Custom('ES_ElLa')] [actor.GetTitledFirstNameNoTooltip|l] desea tomarla, deberá venir a [target.GetNameNoTierNoTooltip] bien armad[actor.Custom('ES_OA')]."
 pam_interactions_events.0037.b: "¿[actor.GetPrimaryTitle.GetNameNoTierNoTooltip]? ¿De verdad?"
 pam_interactions_events.0037.b.tt: "Donde antaño mi pueblo contemplaba [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], supongo que ahora tendrá que fijarse en [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 clergy_transfer_land_third_person_tt: "[recipient.Custom('ES_ElLa')|U] [recipient.GetTitledFirstNameNoTooltipRegnal|l] cede [target.GetNameNoTierNoTooltip]"
 clergy_land_transfer_acceptance_tt: "[secondary_recipient.Custom('ES_ElLa')|U] [secondary_recipient.GetTitledFirstNameNoTooltip|l] intercede en tu nombre"
 clergy_land_interaction_recipient_forced_tt: "#P #bold #EMP ¡[recipient.GetShortUIName] no se puede negar y [target.GetName] será para ti!#!#!#!"
 clergy_land_interaction_recipient_possible_tt: "#alert_trial Si [recipient.GetShortUIName] #bold acepta#!:#!"
 clergy_land_interaction_recipient_refuse_tt: "#alert_trial Si [recipient.GetShortUIName] #bold se niega#!:#!"
 clergy_land_increased_possibility_hook_tt: "#EMP #weak La aceptación es más probable por la personalidad honorable de [Select_CString(recipient.IsLocalPlayer,'tu personaje', recipient.GetShortUIName)]#!#!"
