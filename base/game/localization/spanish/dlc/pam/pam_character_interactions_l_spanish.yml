 pam_interactions_events.0094.opening: "¡Legítim[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsName|l]!"
 pam_interactions_events.0094.desc_conversion: "¡Propagad la palabra de [cleric.GetFaith.HighGodName] por [target.GetNameNoTier]! No escatiméis en usar la vara con sus gentes descarriadas, ni la fuerza de vuestros [ROOT.Char.Custom('GetFighterTermPlural')|l] en defensa de las virtudes de estas tierras.\n\nTal [target.GetTierAsNameNoTooltip] existe para que lo gobernéis. Se ha sometido a la providencia de todo [ROOT.Char.GetTitleAsName|l] de origen [ROOT.Char.GetPrimaryTitle.GetAdjective] , #EMP de iure#! hasta el fin de los tiempos."
 pam_interactions_events.0094.desc: "¡Es un día bendito para los [cleric.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTooltip]! Oh, ¡cuánto han anhelado ser uno con sus hermanos y hermanas de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nLo que había vivido en los corazones de todo [target.GetAdjectiveNoTooltip] se ha convertido en ley por [cleric.Custom('ES_ElLa')] [cleric.GetTitleAsName|l] [cleric.GetFaith.HighGodNamePossessive]: los soberanos de muchas tierras ahora reconocen tal [target.GetTierAsNameNoTooltip] como parte #EMP de iure#! del señorío de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip] y [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] están unidos para toda la eternidad."
 pam_interactions_events.0095.opening: "[ROOT.Char.GetTitleAsName] de [target_county.GetNameNoTier] y tierras diversas,"
 pam_interactions_events.0095.desc: "¡Contáis con la bendición de [cleric.GetFaith.HighGodName]! En Su sabiduría, [cleric.GetFaith.HighGodNameSheHe|U] ha puesto la totalidad de [target.GetName] bajo la protección eterna [de_jure_master.Custom('ES_DelDela')] [de_jure_master.GetTitleAsName|l] de [de_jure_master.GetPrimaryTitle.GetName].\n\nComo [cleric.GetTitleAsName|l], expido este decreto en nombre de los [cleric.GetFaith.GetAdherentNamePlural] de hogar [target.GetAdjectiveNoTooltip], [de_jure_master.Custom('ES_ElLa')] [de_jure_master.GetTitleAsNameNoTooltip|l] y aquellos que conocen la sabiduría de esta división #EMP de iure#! de los señoríos mortales [cleric.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0095.a: "¡Maldita sea la codicia de los [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip]!"
 pam_interactions_events.0095.a_same_faith: "Ciertamente, quién sino [ROOT.Char.GetFaith.HighGodName] puede repartir señoríos."
