 pam_interactions_events.0001.opening: "Noble [ROOT.Char.GetTitledFirstNameRegnal|l],"
 pam_interactions_events.0001.hook_intro: "¡Por supuesto! He de asistiros,"
 pam_interactions_events.0001.intro: "Es un derecho y cumple que busquéis la aprobación [recipient.Custom('ES_DelDela')] [recipient.GetTitleAsName|l],"
 pam_interactions_events.0001: "pues todos los títulos de la fe [recipient.GetFaith.GetReligion.GetAdjective] de este mundo solo se sostienen por la santa voluntad [recipient.GetFaith.HighGodNamePossessive]."
 pam_interactions_events.0001.mid: "los/las [recipient.GetFaith.HouseOfWorshipPlural] de vuestro señorío resonarán con sermones que eleven vuestro mandato y alaben a [recipient.GetFaith.HighGodName] por traer un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] como vos a [actor.GetPrimaryTitle.GetNameNoTier]."
 pam_interactions_events.0001.tithe: "\n\nMientras se pague el diezmo,"
 pam_interactions_events.0001.hook: "\n\nMi favor a vos:"
 pam_interactions_events.0001.monks: "\n\nLos monasterios y"
 pam_interactions_events.0001.donate: "\n\nEn gratitud por vuestra donación,"
 pam_interactions_events.0001.normal: "\n\nTras insistir yo,"
 pam_interactions_events.0001_disgust: "\n\nNo desacreditéis estas palabras con obras malvadas."
 pam_interactions_events.0001_disapprove: "\n\nPor favor, haced justicia a estas palabras de alabanza."
 pam_interactions_events.0001_approve: "\n\nLos nuestros serán unos elogios verdaderos y agradecidos."
 pam_interactions_events.0001_offer_hook_end: "\n\nQue no se olvide este favor."
 pam_interactions_events.0001.a.low_zeal: "Bueno es que la gente se convenza más fácilmente que yo…"
 pam_interactions_events.0001.a.high_zeal: "¡Dudar de mí es dudar de la palabra de [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0001.a: "Pues [ROOT.Char.GetFaith.HighGodName] me entregó [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0001.toast_puppeteer: "[recipient.GetShortUIName] [Select_CString(recipient.IsLocalPlayer, 'concediste', 'concedió')] [legitimacy|El] clerical a [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)]"
 pam_interactions_events.0002.opening: "[ROOT.Char.GetTitledFirstNameRegnal],"
 pam_interactions_events.0002: "Los símbolos de vuestra autoridad ya llenan vuestras manos, engalanan vuestro cuerpo… ¿Qué necesidad tenéis de las voces reverentes que sirven a [recipient.GetFaith.HighGodName]? Las herramientas que empleáis son fuerza brutal, obras oscuras y complots espantosos.\n\nGuardad bien vuestras galas de origen [ROOT.Char.Custom('GetTitleTierAdjective')], porque los servidores de [recipient.GetFaith.HighGodName] no intervendrán para que las conservéis."
 pam_interactions_events.0002.a: "¡Qué arrogancia la de estos [recipient.GetFaith.PriestNeuterPlural]!"
