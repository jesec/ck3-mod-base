 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal],"
 pam_interactions_events.0050.desc: "En mi [puppet_or_actor.GetFaith.ReligiousText], el matrimonio es una unión sagrada, pero en el mundo vivo de hombres y mujeres… es una posibilidad del todo imperfecta.\n\nOs habéis negado a permitir la separación entre [secondary_recipient.Custom('ES_ElLa')] [secondary_recipient.GetTitledFirstName|l] y yo. ¿Qué vamos a hacer con este desastre…?"
 pam_interactions_events.0050.aa: "El deseo carnal es lo que os trae miseria."
 pam_interactions_events.0050.aa.tt: "Enseñad a est[puppet_or_actor.Custom('ES_EA')] infeliz lo que le hace falta para renunciar a todas sus necesidades y anhelos de la carne…"
 pam_interactions_events.0050.a: "¿El camino que guía a [recipient.GetFaith.PositiveAfterLife]? El amor. La devoción."
 pam_interactions_events.0050.a.tt: "Con tu orientación, esta pareja al borde de la ruptura encontrará la salvación el uno en el otro."
 pam_interactions_events.0050.b: "Honrad los votos que hicisteis ante [recipient.GetFaith.GoodGodNames]."
 pam_interactions_events.0050.c: "¡Este desprecio al matrimonio sagrado es una blasfemia!"
 pam_interactions_events.0050.d: "Rezad juntos por que [recipient.GetFaith.HighGodName] os oriente."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\n¡Es una unión incestuosa, un acuerdo antinatural al que debéis poner fin!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\n¡Nuestra fe [puppet_or_actor.GetFaith.GetAdjective] me obliga a sacar a est[secondary_recipient.Custom('ES_EA')] [secondary_recipient.GetWomanMan] de mi lecho!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nSabed que existen acusaciones sobre la impotencia lamentable de [secondary_recipient.GetFirstNameNoTooltip]…"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n¡[secondary_recipient.GetFirstNameNoTooltip] comete abiertamente el vil incesto, despreciando nuestra unión! ¡Es una vergüenza!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n¡[secondary_recipient.GetFirstNameNoTooltip] no me ha sido fiel, y todos lo saben!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\n¡[puppet_or_actor.GetFaith.HighGodName] quiere que me case con un hombre! Y [secondary_recipient.GetFirstNameNoTooltip]… carece de virilidad, por así decirlo."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\n¡Vive [puppet_or_actor.GetFaith.HighGodName]! ¡El demonio de mi [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] ha intentado asesinarme!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n¡[secondary_recipient.GetFirstNameNoTooltip] practica la poligamia! No soy más que un[secondary_recipient.Custom('ES_OA')] más en su caterva de consortes. ¡Liberadme!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\n[puppet_or_actor.GetFaith.HighGodName] no querrá que comparta cama con un[secondary_recipient.Custom('ES_XA')] vil pagan[secondary_recipient.Custom('ES_OA')] de la fe [secondary_recipient.GetFaith.GetAdjective], ¿verdad?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\n¡El motivo por el que os lo pido no es ningún secreto! [secondary_recipient.GetFirstNameNoTooltip], es[secondary_recipient.Custom('ES_EA')] [puppet_or_actor.Custom2('InsultNoun', SCOPE.sC('secondary_recipient'))] lasciv[secondary_recipient.Custom('ES_OA')], me ha sido infiel."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nNuestro matrimonio no tiene hijos, ni esperanzas de engendrarlos jamás."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\n¡Debéis buscar alguna justificación, por [puppet_or_actor.GetFaith.HighGodName]! Aunque mi odio por [secondary_recipient.GetFirstNameNoTooltip] debería ser un motivo más que suficiente."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nNo tengo nada que lo justifique legalmente…, mas confío en vuestro dominio de la ley religiosa para #EMP encontrar#! algún motivo para la anulación."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\n¡Es una unión incestuosa, un acuerdo antinatural al que debéis poner fin!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\n¡Nuestra fe [puppet_or_actor.GetFaith.GetAdjective] me obliga a sacar a est[secondary_recipient.Custom('ES_EA')] [secondary_recipient.GetWomanMan] del lecho de mi [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]!"
