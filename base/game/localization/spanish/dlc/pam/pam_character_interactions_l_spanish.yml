 DEMAND_DIVORCE_NOTIFICATION: "Recae sobre mí exigir que repudiéis a vuestr[secondary_recipient.Custom('ES_OA')] cónyuge, [secondary_recipient.Custom('ES_ElLa')] [secondary_recipient.GetTitledFirstName|l]."
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nCompartís sangre con [secondary_recipient.GetFirstNameNoTooltip] y el mundo entero lo sabe. Un incesto semejante no se puede tolerar ante [actor.GetFaith.HighGodName]."
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nVuestra unión se mofa del lecho matrimonial tal como lo ordenó [actor.GetFaith.HighGodName]. No se puede tolerar."
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip] se postra ante dioses extraños, mas comparte vuestro lecho. No puedo permitir que continúe semejante unión."
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip] se ha apartado de la fe verdadera y arrastra vuestra alma consigo. La unión no puede seguir."
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\nEl mundo entero sabe que [secondary_recipient.GetFirstNameNoTooltip] ha traicionado vuestro lecho matrimonial. Lo que está roto debe finalizarse ahora."
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\nMantenéis a [secondary_recipient.GetFirstNameNoTooltip] como un[secondary_recipient.Custom('ES_XA')] cónyuge de much[secondary_recipient.Custom('ES_OA')]s, un arreglo que [actor.GetFaith.HighGodName] aborrece. Esto no puede seguir."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nEruditos han trazado vuestro linaje y el de [secondary_recipient.GetFirstNameNoTooltip], y los han encontrado entrelazados en grados prohibidos. Consanguinidad; los hallazgos son bastante concluyentes."
