 pam_ask_subordinates_for_gold_interaction: "Pedir oro a un subordinado"
 pam_ask_subordinates_for_gold_interaction_extra_icon: "$hook_extra_icon$"
 pam_ask_subordinates_for_gold_interaction_desc: "Pide a tu [subordinate|El] que te envíe [gold|El]"
 pam_ask_subordinates_for_gold_interaction_title: "[recipient.GetShortUIName] envía una contribución"
 pam_ask_subordinates_for_gold_interaction_notification: "Fue mi mano la que os entregó el cargo que ocupáis, y lo que rinde jamás fue solamente vuestro. Mis cargas son nuestras cargas. Enviad aquello de lo que vuestras arcas se puedan desprender, para que sirva a [actor.GetFaith.HighGodName] donde haya mayor necesidad."
 request_ecclesiastical_treasury_interaction: "Solicitar tesoro de la Iglesia"
 request_ecclesiastical_treasury_interaction_extra_icon: "$hook_extra_icon$"
 request_ecclesiastical_treasury_interaction_desc: "Pide [gold|El] de su [treasury|El] a tu [religious_superior|El] o [subordinate|El]"
