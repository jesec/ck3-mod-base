 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "¡[actor.GetFirstName], oh, [actor.GetTitledFirstNameNoTooltip|l], [actor.Custom('ES_ElLa')] injustamente desposeíd[actor.Custom('ES_OA')]!"
 pam_interactions_events.0020_threatened: "¡Detened los impuestos punitivos, la vil censura, la fuerza maligna que ejerceríais contra mis [secondary_recipient.GetFaith.HouseOfWorshipPlural] que siguen la ley [secondary_recipient.GetFaith.GetReligion.GetAdjective]! Vuestra temible resolución se necesitará en días venideros, pues los derechos sobre [target.GetNameNoTier] son vuestros."
 pam_interactions_events.0020_offer_hook: "Vuestra promesa de favorecer a [secondary_recipient.GetPrimaryTitle.GetNameNoTier] ha impulsado mi mano y, de este modo, ¡he desenterrado vuestro derecho, tanto tiempo despreciado, a reclamar [target.GetNameNoTier]!"
 pam_interactions_events.0020_indebted: "Este humilde [secondary_recipient.GetFaith.PriestNeuter] está en deuda con vos, de modo que he buscado —y encontrado— ¡pruebas indiscutibles de que [target.GetNameNoTier] pertenece legítimamente a vuestro linaje y se os había denegado!"
 pam_interactions_events.0020: "Tenéis el derecho a reclamar [target.GetNameNoTier]: ¡un derecho antiguo por la providencia divina! He proporcionado pruebas a vuestro consejo de que es así."
 pam_interactions_events.0020_end: "\n\n[recipient.Custom('ES_AlAla')|U] [recipient.GetNameRegnal|l] no le hará mucha gracia esta revelación. Pero [secondary_recipient.GetFaith.FateGodName] no escuchará las protestas de un[recipient.Custom('ES_XA')] embuster[recipient.Custom('ES_OA')]."
 pam_interactions_events.0020.a.low_zeal: "Y así se reescribe la historia…"
 pam_interactions_events.0020.a.high_zeal: "¡[target.GetNameNoTierNoTooltip] me pertenece por derecho sagrado!"
 pam_interactions_events.0020.a: "He presentado la reclamación y que se fastidie [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstNameNoTooltip|l]."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName] [Select_CString(puppet_or_actor.IsLocalPlayer, 'te', 'le')] [Select_CString(secondary_recipient.IsLocalPlayer, 'concediste', 'concedió')] a [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)] derechos sobre [target.GetNameNoTier]"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName],"
 pam_interactions_events.0021: "Si vuestro destino fuera gobernar [target.GetNameNoTier], ¿no os habría entregado [secondary_recipient.GetFaith.HighGodName] su posesión como derecho de nacimiento?\n\nNo, no desairaré [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstNameRegnal|l] ni ofenderé nuestras almas mortales —la mía y la vuestra— escribiendo falsedades para vuestra causa maligna.\n\nRezad por ver el error de vuestras actuaciones."
 pam_interactions_events.0021.a: "¡Los muros de su [secondary_recipient.GetFaith.HouseOfWorship] le dan ese valor insensato!"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName] [Select_CString(secondary_recipient.IsLocalPlayer, 'rechazaste', 'rechazó ')] la petición de derechos sobre [target.GetNameNoTier] de [Select_CString(puppet_or_actor.IsLocalPlayer,'tu personaje', puppet_or_actor.GetShortUIName)]"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "Titular de mi derecho de nacimiento,"
 pam_interactions_events.0022_shrimp: "Si bien no soy más que un[actor.Custom('ES_XA')] simple [actor.GetTitleAsName|l], los [secondary_recipient.GetFaith.AltPriestTermPlural] de la fe [actor.GetFaith.GetAdjective] han descubierto que en mi linaje corre un antiguo derecho a [target.GetName] en su totalidad."
 pam_interactions_events.0022_shark: "[target.GetName] está entre los títulos que pasaron de [actor.GetFaith.HighGodName] a mi linaje [actor.Custom('GetTitleTierAdjective')]. Siempre fue así, aunque no se hubiera conocido hasta ahora."
 pam_interactions_events.0022: "Entre los eruditos doctos hace mucho que se sabe —y se ha demostrado recientemente— que [target.GetName] me pertenece y puedo reclamar su propiedad."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.Custom('ES_ElLa')|U] [secondary_recipient.GetTitledFirstNameRegnal|l] ha dado su santa aprobación a mis derechos. [secondary_recipient.GetPrimaryTitle.GetName] me apoya hasta el final.\n\nY de este modo empiezo a rezar y a esperar que un día se me reciba como señor[ROOT.Char.Custom('ES_XA')] de la belleza de [target.GetNameNoTierNoTooltip]…"
 pam_interactions_events.0022.a: "¡Mentiras! ¡Una reclamación falsa apoyada por un[secondary_recipient.Custom('ES_XA')] [secondary_recipient.GetFaith.PriestNeuter] fals[secondary_recipient.Custom('ES_OA')]!"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "Sant[secondary_recipient.Custom('ES_OA')] [secondary_recipient.GetMotherFather|U],"
 pam_interactions_events.0023_shrimp: "Si contase con unos derechos legítimos, ¿no dirigiría [target.GetName] con mayor virtud que [recipient.GetFirstNameRegnal], semejante [actor.Custom2('InsultAdjective', recipient)]? Por favor, permitid que la luz [actor.GetFaith.HighGodNamePossessive] reluzca sobre est[actor.Custom('ES_EA')] humilde [actor.GetTitleAsName|l]."
 pam_interactions_events.0023_shark: "Según la voluntad [actor.GetFaith.HighGodNamePossessive], ya soy [actor.Custom('ES_ElLa')] señor[actor.Custom('ES_XA')] y protector[actor.Custom('ES_XA')] de diversas tierras y gentes. Sin embargo, [target.GetName] se sitúa más allá de mi señorío y de mis derechos."
 pam_interactions_events.0023: "Hay confusión entre los fieles. Algunos desean sinceramente que reclame [target.GetName], mientras que otros niegan que tenga ningún derecho al título."
 pam_interactions_events.0023_end: "\n\nCiertamente, alguien tan doct[secondary_recipient.Custom('ES_OA')] como vos podría #EMP descubrir#! la prueba necesaria en los archivos… ¿y aprobar mi reclamación sobre [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0023.a: "Que [target.GetNameNoTierNoTooltip] sea para ti, [actor.Custom('GetDaughterSon')] mí[actor.Custom('ES_OA')]."
 pam_interactions_events.0023.b: "Un[secondary_recipient.Custom('ES_XA')] [secondary_recipient.GetTitleAsNameNoTooltip|l] no debe entregarse a falsedades."
