 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY: "\n\n¡[secondary_recipient.GetFirstNameNoTooltip] no ha sido fiel a mi [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], y todos lo saben!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY: "\n\n¡[puppet_or_actor.GetFaith.HighGodName] quiere que mi [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] se case con un hombre! Y [secondary_recipient.GetFirstNameNoTooltip]… carece de virilidad, por así decirlo."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\n¡Por [puppet_or_actor.GetFaith.HighGodName]! ¡Ese demonio de [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] ha intentado asesinar a mi [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))]!"
