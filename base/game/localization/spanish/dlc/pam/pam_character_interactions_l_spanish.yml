 pam_interactions_events.0072.opening: "Vil [recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)],"
 pam_interactions_events.0072.desc_joined_war: "Acudo a vos ahora. Como misioner[puppet_or_actor.Custom('ES_OA')], para traer luz a vuestra oscuridad. Como [puppet_or_actor.GetMotherFather], para imponer castigo.\n\nY al lado de vuestr[puppet_or_actor.Custom('ES_OA')] [puppet_or_actor.Custom('MotherFather')] llega un[secondary_recipient.Custom('ES_XA')] guerrer[secondary_recipient.Custom('ES_OA')] de [puppet_or_actor.GetFaith.GoodGodNames], [secondary_recipient.GetName]. Sus ejércitos liberarán a [target.GetNameNoTier] de su maldad."
 pam_interactions_events.0072.desc: "Es muy tarde para vos. De nada sirve arrepentirse ahora.\n\n¡Contemplad cómo las corrompidas tierras de [recipient.GetPrimaryTitle.GetNameNoTier] son arrasadas! ¡Cómo los siervos de [puppet_or_actor.GetFaith.DevilName] son masacrados! ¡He hecho que los fieles alcen las armas y he enviado a [secondary_recipient.GetName] a destruiros!"
 pam_interactions_events.0072.a: "¡Qué cruel es [puppet_or_actor.GetFaith.HighGodName] para lanzarnos a semejantes [puppet_or_actor.GetWomenMen]!"
