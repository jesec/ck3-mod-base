 ecclesiastical_de_jure_shifting_grant_interaction_notification: "Como un[puppet_or_actor.Custom('ES_XA')] [puppet_or_actor.GetMotherFather] que se preocupa por un hijo amado, deseo que [puppet_or_actor.GetPrimaryTitle.GetName] críe y proteja [target.GetName] para toda la eternidad. Con un decreto lo convertiremos en un vínculo legal y sagrado."
 pam_interactions_events.0096.opening: "¡Juiciosa es la mano de [ROOT.Char.GetFaith.random_GoodGodNames]!"
 pam_interactions_events.0096.desc: "¡La extirpación de [target.GetNameNoTier] de [former_de_jure_liege.GetNameNoTier] es una obra muy sabia y bendita!\n\nQue suceda como habéis decretado: a lo largo de los siglos, [de_jure_master.GetPrimaryTitle.GetNameNoTier] será un sostén entre est[target.Custom('ES_EA')] [target.GetTierAsNameNoTooltip|l] y [ROOT.Char.GetFaith.PositiveAfterLife], para que los [ROOT.Char.GetFaith.GetAdherentNamePlural] fieles a la fe [target.GetAdjectiveNoTooltip] sean guiados eternamente a la luz [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nAdoptaré esto en mi juramento sagrado [de_jure_master.Custom('GetTitleTierAdjective')]."
 pam_interactions_events.0096.a: "Que esta, en verdad, demuestre ser una unión armoniosa."
