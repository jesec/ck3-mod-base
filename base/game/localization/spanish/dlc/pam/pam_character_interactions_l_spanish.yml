 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U] debe estar en el [realm|El] de [excommunicator.GetShortUIName], un [county|El] vecino o la [clerical_region|El] de [excommunicator.GetShortUIName]"
 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U] puede [excommunicate|El] a [secondary_recipient.GetShortUIName] directamente"
 no_valid_excommunicator_tt: "Como tu [faith|El] no tiene [head_of_faith|El] [theocratic|El], a [secondary_recipient.GetShortUIName] solo le puede [Concept('excommunicated', 'excomulgar')|E] un [ruler|El] [ecclesiastical|El] poderoso siempre que se produzca uno de estos casos:\n$EFFECT_LIST_BULLET$Es su [liege|El] o superior\n$EFFECT_LIST_BULLET$Es un [ruler|El] vecino o tiene su [realm_capital|El] en su [clerical_region|El]\n$EFFECT_LIST_BULLET$Es [superior|El] o está por encima de su [court_chaplain|El]\n$EFFECT_LIST_BULLET$Es su [court_chaplain|El] y no tiene [superior|El]"
