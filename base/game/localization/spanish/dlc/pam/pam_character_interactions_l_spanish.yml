 divorce_justified_secondary_tt: "Cualquiera de lo siguiente:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] ha intentado asesinar a [secondary_actor.GetShortUIName]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] es de carácter [GetTrait('adulterer').GetName( secondary_recipient )|l]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] tiene muy poca [fertility|El] y su matrimonio no tiene hijos\n$EFFECT_LIST_BULLET$La [faith|El] de [secondary_recipient.GetShortUIName] es [faith_hostile|El] o [faith_evil|El]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] tiene múltiples [spouses|E], a pesar de que la poligamia está prohibida\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] es impotente\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName] tiene un amante con quien practica el [Concept('incestuous', 'incesto')|E]\n$EFFECT_LIST_BULLET$El matrimonio de [secondary_actor.GetShortUIName] con [secondary_recipient.GetShortUIName] es [incestuous|El]\n$EFFECT_LIST_BULLET$El matrimonio de [secondary_actor.GetShortUIName] con [secondary_recipient.GetShortUIName] es del mismo sexo, lo que está prohibido"
