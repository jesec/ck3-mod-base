 pam_interactions_events.0010: "¿Cuánto tiempo lleva olvidado el reparto de tierras y títulos [actor.GetFaith.HighGodNamePossessive]? ¿Cuánto tiempo lleva languideciendo el pueblo en su [target.GetTierAsNameNoTooltip] sin un pastor de sangre [actor.GetHouse.GetName]?\n\nReivindicaré vuestros derechos sobre [target.GetNameNoTierNoTooltip] en toda corte, consejo y tratado.\n\nEstos derechos vuestros no morirán con vos."
