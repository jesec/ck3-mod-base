 pam_interactions_events.0100.t: "Basta de bastardía"
 pam_interactions_events.0100.desc: "Ante [ROOT.Char.GetFaith.HighGodName] y los fieles reunidos, [actor.Custom('ES_ElLa')] [actor.GetTitledFirstName|l] me ha proclamado legítim[ROOT.Char.Custom('ES_OA')]. Lo que el nacimiento me negó, el clero me lo ha concedido con ritos santos y un trazo de tinta.\n\nQue ninguna lengua vuelva a llamarme bastard[ROOT.Char.Custom('ES_OA')]."
