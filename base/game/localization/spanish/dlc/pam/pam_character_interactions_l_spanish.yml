 pam_interactions_events.0101.opening: "Bendiciones sobre vuestra casa,"
 pam_interactions_events.0101.desc: "Es una alegría daros nuevas felices. He proclamado la legitimidad de nacimiento de vuestr[recipient.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstNameNoTooltip] ante [ROOT.Char.GetFaith.HighGodName].\n\nNinguna ley ni habladuría podrá usar su nacimiento contra [recipient.GetSheHe] nunca más."
