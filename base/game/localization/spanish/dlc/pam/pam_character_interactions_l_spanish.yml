 pam_interactions_events.0097.opening: "[ROOT.Char.Custom('GetDaughterSon')|U] del pueblo [ROOT.Char.Custom('GetTitleTierAdjective')],"
 pam_interactions_events.0097.desc: "Vuestra petición queda concedida, [target.GetName] ha estado vacante mientras el rebaño [ROOT.Char.GetFaith.GetAdherentName] carecía de pastor, lo que es mal modo de honrar a [ROOT.Char.GetFaith.HighGodName].\n\nLlevadlo con humildad. Un [title|El] dado por la Iglesia, la Iglesia lo recordará."
 pam_interactions_events.0097.desc_holy_war: "Vuestra petición queda concedida y vuestro juramento queda registrado donde no se olvidará. [target.GetName] es para vos, mas una parte de esas tierras aún se inclina ante aquellos que niegan a [ROOT.Char.GetFaith.HighGodName].\n\nId a tomar aquello que vuestro título denomina vuestro. Ningún [ROOT.Char.GetFaith.PriestNeuter] fiel cuestionará vuestra guerra, pero dentro de cinco años preguntaremos qué fue de todo aquello y un juramento inerte es uno roto."
