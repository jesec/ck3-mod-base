 pam_interactions_events.0070.t: "Una guerra por [puppet_or_actor.Custom('ES_ElLa')] [puppet_or_actor.GetTitleAsNameNoTooltip|l]"
 pam_interactions_events.0070.desc_intro_pagan: "«Malvados paganos de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_heretic: "«[recipient.GetFaith.GetAdherentNamePlural|U] herejes de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_infidel: "«Infieles de fe [recipient.GetFaith.GetReligion.GetAdjective] de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_heathen: "«[recipient.GetFaith.GetReligion.GetAdherentNamePlural|U] paganos de [target.GetNameNoTier],"
 pam_interactions_events.0070.desc: "#EMP muerte, ruina y condenación por la espada es lo que os espera#!», grita [puppet_or_actor.Custom('ES_ElLa')] [puppet_or_actor.GetTitledFirstNameRegnal|l], y su mensaje es llevado a las masas inquietas de [secondary_recipient.GetPrimaryTitle.GetNameNoTier].\n\n«¡Alzad el estandarte sagrado de [ROOT.Char.GetFaith.random_GoodGodNames], [ROOT.Char.GetTitledFirstName|l]! ¡Os llamo para que expulséis [recipient.Custom('ES_AlAla')] [recipient.GetTitledFirstName|l] de las tierras de [target.GetNameNoTierNoTooltip]! ¡Para que echéis a sus [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] de [recipient.GetPrimaryTitle.GetName] a las llamas de [ROOT.Char.GetFaith.NegativeAfterLife]!».\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "¡Bien cierto es que [puppet_or_actor.Custom('ES_ElLa')] [puppet_or_actor.GetTitleAsNameNoTooltip|l] anhela extender el dominio [puppet_or_actor.GetFaith.HighGodNamePossessive]! Jura cabalgar hacia la guerra en persona y poner sus fuerzas a mi disposición."
 pam_interactions_events.0070.desc_outro_funding_war: "Estas exigencias están respaldadas con dinero: [puppet_or_actor.Custom('ES_ElLa')] [puppet_or_actor.GetTitleAsNameNoTooltip|l] promete un cofre de guerra lleno de fondos, para que no sea únicamente la fe lo que aliente a mis [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 pam_interactions_events.0070.a: "«¡[ROOT.Char.GetFaith.WarGodName] está con nosotros! #EMP ¡A la guerra!#!»."
 pam_interactions_events.0070.b: "Dejad a la gente [recipient.Custom('ES_DelDela')] [recipient.GetTitledFirstNameNoTooltip|l] en paz."
 cultural_acceptance_gain_refused_incited_holy_war: "Un gobernante secular evitó que una guerra santa tuviera lugar"
 pam_interactions_events.0071.t: "Conquista de [ROOT.Char.GetFaith.HighGodName] de [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0071.desc_intro: "¡En los gritos de batalla, en los cánticos y en los rezos antes de la victoria, la palabra sagrada de [ROOT.Char.GetFaith.HighGodName] se hace llegar a los [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] y su [target.GetTierAsNameNoTooltip|l]! Desde su principal [ROOT.Char.GetFaith.HouseOfWorship] de [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier], [secondary_recipient.GetName] proclama la guerra santa contra"
 pam_interactions_events.0071.desc_intro_pagan: "los paganos de [recipient.GetPrimaryTitle.GetName|l].\n\n¡Como brutos animales, [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l] y sus [recipient.GetCulture.GetCollectiveNoun] sin duda se dispersarán ante la legítima llegada de los ejércitos [secondary_recipient.GetFaith.GetAdherentNamePlural] de [secondary_recipient.GetPrimaryTitle.GetNameNoTier]!"
 pam_interactions_events.0071.desc_intro_heretic: "los herejes de [recipient.GetPrimaryTitle.GetName|l].\n\n¡En una gran marea de sangre, [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l] y sus sucios [recipient.GetFaith.GetAdherentNamePlural] serán barridos de estas tierras! ¡Ahora y por siempre, contra aquellos que corrompen la palabra de [ROOT.Char.GetFaith.HighGodName]!"
 pam_interactions_events.0071.desc_intro_infidel: "[recipient.Custom('ES_ElLa')] [recipient.GetTitleAsName|l] de [recipient.GetPrimaryTitle.GetNameNoTier].\n\n¡Los infieles [recipient.GetFaith.GetAdherentNamePlural], como todos los que antes han fracasado ante la #EMP yihad#! del Profeta, pronto serán obligados a rendirse!"
 pam_interactions_events.0071.desc_intro_heathen: "[recipient.Custom('ES_ElLa')] [recipient.GetTitleAsName|l] de [recipient.GetPrimaryTitle.GetNameNoTier].\n\n¡En nombre de [ROOT.Char.GetFaith.WarGodName], aplastará a las huestes paganas! Y todas las gentes de fe [ROOT.Char.GetFaith.GetReligion.GetAdjective] observarán atónitas."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nMis propias tropas no se quedarán de brazos cruzados. ¡No! Invadirán [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] junto [secondary_recipient.Custom('ES_AlAla')] [secondary_recipient.GetTitledFirstNameNoTooltip|l] y sus [secondary_recipient.Custom('KnightCulturePluralNoTooltip')|l]."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nDesde [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] y más allá, fervientes guerreros se reúnen bajo el estandarte [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstNameNoTooltip|l]."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nSolo el favor de [ROOT.Char.GetFaith.HighGodName] promete la victoria [secondary_recipient.Custom('ES_DelDela')] [secondary_recipient.GetTitledFirstNameNoTooltip|l]. Pero mi generoso donativo me asegura su confianza."
 pam_interactions_events.0071.a: "Que aquellos que mueran por esta causa sean por siempre envidiados."
