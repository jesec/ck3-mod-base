 pam_interactions_events.0060.t: "Justificar el divorcio"
 pam_interactions_events.0060.desc: "[puppet_or_actor.Custom('ES_ElLa')|U] [puppet_or_actor.GetTitledFirstName|l] desea poner fin a su matrimonio, sí, pero pese a todo el odio que [puppet_or_actor.GetSheHe] y [secondary_recipient.Custom('ES_ElLa')] [secondary_recipient.GetTitledFirstName|l] se tengan… su unión se realizó ante [puppet_or_actor.GetFaith.HighGodName]. Y no tienen motivos sólidos para ponerle fin.\n\nPor tanto, debo elaborar una mentira que reivindique la nulidad de su matrimonio. Una blasfemia que quizás se merezca alguna recompensa…"
 pam_interactions_events.0060.a: "Esta separación merece… un gran escándalo."
 pam_interactions_events.0060.a.tt: "¡No elaboraré ninguna mentira noble, sino viles acusaciones contra [secondary_recipient.GetFirstNameNoTooltip]! Su familia se verá obligada a acudir en su defensa… y la familia de [puppet_or_actor.GetFirstNameNoTooltip] también en la suya."
 pam_interactions_events.0060.b: "Hacer que tal [puppet_or_actor.GetTitleAsNameNoTooltip|l] done tierras a los fieles."
 pam_interactions_events.0060.b.tt: "Dar un título a la orden de [lease_order.GetName] suavizará el peso que ejerce sobre las almas de todos…"
 pam_interactions_events.0060.c: "Un favor que merece otro favor a cambio."
 pam_interactions_events.0060.d: "Reivindicar que [secondary_recipient.GetFirstNameNoTooltip] se prometió al clero."
 pam_interactions_events.0060.d.tt: "Si [secondary_recipient.GetSheHe] tomó los votos con la orden [divorcee_joining_order.GetName] hace tiempo, ¡este matrimonio debe invalidarse! Y después de esto, ¿quién mejor para guiar la nueva vida de [secondary_recipient.GetFirstNameNoTooltip] que yo?"
 pam_interactions_events.0060.e: "No exigir nada a la infeliz pareja."
