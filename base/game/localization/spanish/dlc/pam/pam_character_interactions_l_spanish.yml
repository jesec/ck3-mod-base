 pam_interactions_events.0091.opening: "Mi benefactor[ROOT.Char.Custom('ES_XA')],"
 pam_interactions_events.0091.desc_hook_theocrat: "Vuestra intercesión supone una gran responsabilidad. Mientras que con una mano sostengo el cayado de pastor[recipient.Custom('ES_XA')], con la otra me aferro a [recipient.GetFaith.HighGodName]. ¡Así ha de ser, pues soy su más fiel sirviente! [target.GetNameNoTier] es un gran regalo, que agradezco enormemente.\n\nQue todos en estas tierras lo sepan: por la voluntad [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitledFirstNameRegnal|l], ¡mi [target.GetTierAsName|l] pertenece al clero!"
 pam_interactions_events.0091.desc_hook: "Vuestra intercesión supone una gran responsabilidad. Mientras que con una mano sostengo el cetro de gobernante, con la otra me aferro a [recipient.GetFaith.HighGodName]. Así ha de ser. [target.GetNameNoTier] es un gran regalo, que agradezco enormemente.\n\nQue todos en estas tierras lo sepan: por la voluntad [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitledFirstNameRegnal|l], ¡[target.GetTierAsName|l] me pertenece!"
 pam_interactions_events.0091.desc: "Vuestra intercesión es una bendición más grande de lo que podía imaginar. Largo es el alcance [ROOT.Char.Custom('ES_DelDela')] sant[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetMotherFather], y benévolo también, ¡gracias a [recipient.GetFaith.HighGodName]!\n\n[target.GetName] es una tierra noble. Llevaré este título y gobernaré sobre los [recipient.GetFaith.GetAdherentNamePlural] con humildad y gracia."
 pam_interactions_events.0091.a: "Observaré [target.GetNameNoTierNoTooltip] con entusiasmo."
 pam_interactions_events.0092.opening_theocratic: "Reverente [ROOT.Char.GetFaith.PriestNeuter],"
 pam_interactions_events.0092.opening: "Hij[ROOT.Char.Custom('ES_OA')] del pueblo [ROOT.Char.Custom('GetTitleTierAdjective')],"
 pam_interactions_events.0092.desc_hook: "Mientras rezáis por el enorme regalo que [recipient.GetFaith.HighGodName] y sus prelados os han procurado, considerad bien si verdaderamente sois dign[ROOT.Char.Custom('ES_OA')] de semejante [target.GetTierAsName|l]. Quizá queden aún actos de devoción que hacer por vuestra parte.\n\nTenéis mi consejo a vuestra disposición para tal menester. Debemos asegurarnos de que vuestro gobierno en [target.GetNameNoTierNoTooltip] complazca y sirva a [recipient.GetFaith.HighGodName]."
 pam_interactions_events.0092.desc: "¡Celebro la proclamación de tan ilustre [target.GetTierAsNameNoTooltip|l]!\n\nGuiándome por mis rezos, me he interesado especialmente por vuestro avance. Solo os pido que gobernéis bien, y que vuestro gobierno sea una bendición para los [recipient.GetFaith.GetAdherentNamePlural] de [target.GetNameNoTier|l]."
 pam_interactions_events.0092.a: "¡Un mandato directo de [recipient.GetFaith.PositiveAfterLife]!"
