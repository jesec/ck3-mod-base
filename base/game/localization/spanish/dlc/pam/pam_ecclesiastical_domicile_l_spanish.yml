 #Interaction reference tooltips
 pam_estate_interaction_tt_demand_child_as_monk_interaction: "Exige que alguien entregue un [child|El], descendiente o [courtier|El] menor de edad a su cuidado como [GetTrait('devoted').GetName( GetNullCharacter )|l], lo que lo sacará de cualquier [succession|El] y lo convertirá en tu [courtier|El]."
 pam_estate_interaction_tt_demand_church_succession_interaction: "Si alguien abandonase este mundo sin un heredero, las tierras que posee pasarían a mis manos como [fallback_heir|El]."
 pam_estate_interaction_tt_demand_divorce_interaction: "Exige que alguien repudie a un cónyuge cuyo matrimonio ofende a la [faith|El]… o se le puede dar esa impresión."
 pam_estate_interaction_tt_ecclesiastic_consecrate_kingdom_interaction: "Crea un nuevo [kingdom|El] para alguien; obtendrás un [hook|El] a cambio"
 pam_estate_interaction_tt_ecclesiastical_bestow_title_interaction: "Usa tu autoridad espiritual y concede un [title|El] que no esté creado aún directamente a alguien, lo que aumentará potencialmente su [rank|El]"
