 pam_estate_interaction_tt_pam_evangelize_personal_tenet_interaction: "Evangeliza tu [personal_tenet|El] para alguien y úrgele para que lo adopte como dogma personal"
 pam_estate_interaction_tt_request_clerical_chastity_interaction: "Exige a alguien que haga un voto de castidad ante [GetPlayer.GetFaith.HighGodName]. Si acepta, sufrirá una penalización a largo plazo en su [fertility|El] y no podrá iniciar una seducción o un cortejo hasta que el voto termine o renuncie a él."
