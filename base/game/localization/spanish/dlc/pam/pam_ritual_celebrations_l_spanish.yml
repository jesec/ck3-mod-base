l_spanish:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Desbloquea el [intent|E] $praise_the_gods_intent$ para [Concept('activities', 'actividades')|E] de [GetActivityType('activity_feast').GetName|l]"
 praise_the_gods_intent: "Honrar lo divino"
 praise_the_gods_intent_desc: "Convierte una celebración comunal en adoración para buscar el conocimiento religioso, la profundización espiritual y la camaradería durante el festín."
 praise_the_gods_intent_not_valid_desc: "Ya no sigues personalmente el [tenet|El] [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )]"
 pam_ritual_celebrations_events.0001.t: "Un festín de revelación"
 pam_ritual_celebrations_events.0001.desc: "A medida que las bandejas se vacían y las copas se llenan, un brindis a [ROOT.Char.GetFaith.WealthGodName] inspira el siguiente. Pronto, el salón se inunda de rezos, historias sagradas y debate teológico animado.\n\nEn la calidez de la celebración, parece que todos alcanzan a comprenderse, ya sea por la energía de la camaradería o a través de las silenciosas plegarias."
 pam_ritual_celebrations_events.0001.a: "Que la juerga se convierta en adoración."
 pam_ritual_celebrations_events.0001.b: "Me retiraré y rezaré en solemne reflexión."
 pam_praise_the_gods_revelation_outcome_tt: "Una sagrada verdad emerge del clamor de la celebración"
 pam_praise_the_gods_belief_outcome_tt: "Una enseñanza recordada a medias abre un nuevo camino para la creencia"
 pam_praise_the_gods_legend_outcome_tt: "Las historias sagradas de esta anoche arraigarán como una leyenda que las generaciones venideras repetirán"
 pam_praise_the_gods_clergy_outcome_tt: "La alabanza en común te acerca a un miembro del [clergy|El] de tu mesa"
 pam_praise_the_gods_scholar_outcome_tt: "El debate de esta noche ha despertado un hambre acuciante por el aprendizaje sagrado"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Todo rezo y parábola agudiza aún más tu control del aprendizaje sagrado"
 pam_praise_the_gods_revelation_toast: "Revelación entre la juerga"
 pam_praise_the_gods_belief_toast: "Conocimiento teológico"
 pam_praise_the_gods_legend_toast: "Una historia sagrada echa raíces"
 pam_praise_the_gods_clergy_toast: "Unidos en alabanza a [ROOT.Char.GetFaith.WealthGodName]"
 pam_praise_the_gods_scholar_toast: "Sabiduría encontrada en el festín"
 pam_praise_the_gods_scholar_xp_toast: "Profundización en el estudio"
 pam_praise_the_gods_clergy_bond_opinion: "Unidos en la celebración divina"
 pam_praise_the_gods_log_title: "Se ha honrado lo divino"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'buscaste', 'buscó' )] el conocimiento divino a través de los rezos, historias y debates del festín"
 pam_praise_the_gods_quiet_log_title: "Rezó con tranquila devoción"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U] [Select_CString( CHARACTER.IsLocalPlayer, 'te retiraste', 'se retiró' )] de la celebración para buscar la paz divina en el rezo tranquilo"
