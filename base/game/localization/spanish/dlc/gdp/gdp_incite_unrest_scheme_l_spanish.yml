l_spanish:
 # Scheme
 gdp_incite_unrest_scheme: "Incitar al descontento"
 gdp_incite_unrest_scheme_desc: "Extender sedición y descontento entre el pueblo llano de la capital para que se vuelva contra su gobernante."
 gdp_incite_unrest_scheme_desc_general: "Extender sedición y descontento entre el pueblo llano de la capital para que se vuelva contra su gobernante."
 gdp_incite_unrest_scheme_action: "Incitar al descontento contra"
 GDP_INCITE_UNREST_SUCCESS_DESC: "Unos agitadores han alterado al populacho. Caerá la opinión popular en la capital condal del señor."
 GDP_INCITE_UNREST_DISCOVERY_DESC: "La conjura para incitar al descontento en la capital ha sido descubierta."
 # Scheme invalidation
 gdp_incite_unrest_scheme_invalidated_title: "Conjura abandonada"
 gdp_incite_unrest_scheme_owner_not_republic: "Ya no tenemos un gobierno republicano y no podemos perseguir esta conjura."
 # Interaction
 gdp_incite_unrest_start_interaction: "Incitar al descontento"
 gdp_incite_unrest_scheme_interaction_tt_approved: "Trabajar en secreto para extender la disensión entre el pueblo llano de [recipient.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip|V], lo que reduce la [popular_opinion|El] [recipient.Custom('ES_DelDela')] [recipient.GetTitledFirstNameNoTooltip|l]."
 gdp_incite_unrest_scheme_start_notification: "Conjura iniciada"
 gdp_incite_unrest_scheme_target_tt: "Alguien conjura contra ti."
 # Success messages
 gdp_incite_unrest_scheme_success_t: "El descontento se extiende"
 gdp_incite_unrest_scheme_success_liege_t: "Descontento en la capital"
 # Failure message
 gdp_incite_unrest_scheme_failure_t: "La conjura se extingue"
 gdp_incite_unrest_scheme_failure_desc: "Nuestros agitadores no han logrado fomentar el descontento contra [scope:target.Custom('ES_ElLa')] [scope:target.GetTitledFirstName|l] y el plan se ha quedado en un intento; la población permanece impasible."
 # Discovered message
 gdp_incite_unrest_scheme_discovered_t: "Complot revelado"
 # Agent success event
 gdp_incite_unrest_scheme_event.0005.desc: "Los agitadores han hecho su trabajo. El descontento se extiende por las calles de [target.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] y [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] pierde la confianza del pueblo."
 gdp_incite_unrest_scheme_event.0005.a: "El pueblo está listo para que le empujen más allá."
 # Liege success event
 gdp_incite_unrest_scheme_event.0006.desc: "Rumores de descontento han arraigado en [This.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. Alguien ha estado agitando al pueblo llano contra [This.GetSheHe] y sus agravios cada vez suenen más fuerte."
 gdp_incite_unrest_scheme_event.0006.a: "Tengo que restaurar el orden."
 # County modifier
 gdp_incite_unrest_county_modifier: "Sembrado de sedición"
 gdp_incite_unrest_county_modifier_desc: "Aquí han estado actuando agitadores que han extendido agravios y han vuelto al populacho contra su gobernante."
 # Character modifier
 gdp_caught_inciting_unrest_modifier: "Conjurador desacreditado"
 gdp_caught_inciting_unrest_modifier_desc: "Este patricio fue descubierto cuando fomentaba el descontento contra el líder de la república. Otras casas y votantes lo miran con sospecha."
