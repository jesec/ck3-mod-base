l_spanish:
 republic_event.0001.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0001.desc: "¡Por fin hemos puesto los cimientos de nuestra república! Los tiranos mezquinos y sus matones a sueldo ya no nos encadenarán al yugo y al surco. Sus rencillas ya no nos traerán pena ni dolor.\n\nAhora, unidos como una sola comunidad forjaremos nuestro destino y defenderemos nuestra libertad ganada con esfuerzo. Que nuestra ciudad destaque como un faro de esperanza y que nuestras murallas sean un escudo contra la tiranía."
 republic_event.0001.a: "¡El comienzo de una nueva era!"
 republic_event.0002.t: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 republic_event.0002.desc: "Las viejas tradiciones nos han servido bien y siempre las honraremos. Sin embargo, la sala del clan ya no puede albergar aquello en lo que nos hemos convertido. Mercados, murallas y la voluntad del pueblo exigen ahora una clase distinta de gobierno.\n\nHoy dejamos a un lado el gobierno [tribal|El] y fundamos una [republic|El]. Que la ciudad hable con una sola voz y que esa voz sea la nuestra."
 republic_event.0002.a: "La ciudad recordará esto."
 republic_event.0010.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 republic_event.0010.desc: "Por la presente os informo de que he revocado vuestro puesto comercial en [actor.GetCapitalLocation.GetBaronyNameExplicitly] con efecto inmediato.\n\nEs, por supuesto, en beneficio de [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]. Confío en que lo entenderéis."
 republic_event.0010.a: "¡Pero era #EMP mi#! puesto comercial!"
 republic_event.0012.desc: "¡Ya no sois bien recibid[ROOT.Char.Custom('ES_OA')] en [trade_post_target_county.GetNameNoTierNoTooltip]! Considerad revocados vuestros derechos comerciales. Todo aquello de valor que tengáis aquí será confiscado y el puesto comercial será arrasado."
 republic_event.0012.a: "Tendré que encontrar un nuevo hogar para mis mercaderías…"
 republic_event.0020.t: "El tesoro [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 republic_event.0020.intro: "Ha llegado la hora de revisar el presupuesto de la república."
 republic_event.0020.steward_desc: "[steward.GetShortUIName|U] se encuentra ante mí, ceño fruncido, libro de cuentas en mano. Una pequeña tropa de ayudantes se encuentra a su espalda, van cargados con pergaminos, tomos y notas fiscales.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip|U]. #EMP Debemos#! repasar nuestros gastos y preparar un nuevo presupuesto para el tesoro. Me temo que este asunto no puede esperar."
 republic_event.0020.solo_desc: "Me veo rodead[ROOT.Char.Custom('ES_OA')] por una pequeña tropa de ayudantes, van cargados con pergaminos, tomos y notas fiscales. Todos esperan a que termine mi revisión.\n\n"
 republic_event.0020.income_desc: "Nuestros ingresos actuales superan con mucho nuestros gastos y los deberíamos emplear mejor."
 republic_event.0020.deficit_desc: "Nuestros gastos son demasiado grandes y el tesoro se desplomará si no actuamos."
 republic_event.0020.fallback_desc: "Hace muchos años desde que entró en vigor el último presupuesto."
 republic_event.0020.a: "$tgp_china_ministry.0100.a$"
 republic_event.0020.b: "$tgp_china_ministry.0100.b$"
 republic_event.0020.c: "$tgp_china_ministry.0100.c$"
 republic_event.0020.c_no_change: "[steward.GetShortUIName|U] ya ha revisado el presupuesto y está en buena forma. No tiene cambios que hacer."
 republic_event.0020.a_tooltip: "$tgp_china_ministry.0100.a_tooltip$"
 republic_event.0021.desc: "Varios documentos con propuestas se encuentran ante mí, cada uno traza un rumbo distinto para el tesoro: dónde gastar y dónde cerrar la bolsa.\n\n¿Cuál he de elegir?"
 republic_event.0021.a: "Aseguraos de que a todos se les paga bien."
 republic_event.0021.b: "Unos salarios equilibrados será lo que mejor nos venga."
 republic_event.0021.c: "Debemos dar prioridad a los fondos extra para el Estado."
 republic_event.0021.a.info_desc: "Enfoque de [treasury_budget_category|El]: [treasury_salary_budget_short|El] @gold_icon!\nA la mayoría de los [patricians|El] les gustan los salarios altos"
 republic_event.0021.b.info_desc: "Enfoque de [treasury_budget_category|El]: equilibrado @law_icon!\nUn presupuesto bien equilibrado que garantiza que los [patricians|El] tiene un salario decente y también deja bastante [treasury|El] para el [liege|El]"
 republic_event.0021.c.info_desc: "Enfoque de [treasury_budget_category|El]: señorío @treasury_icon!\nUn salario bajo significa más dinero para la república… y concede al [liege|El] fondos extra para gastar como vea apropiado"
 republic_event.0030.desc: "Lamento informaros que he rescindido todos vuestros monopolios en mis mercados. El comercio debe fluir libremente."
 republic_event.0030.a: "Tendremos que competir como todo el mundo…"
 republic_event.0040.desc: "Lamento informaros de que he decidido retiraros de [actor.GetConfederation.GetName]."
 republic_event.0040.a: "Competidores una vez más"
 republic_event.0050.desc: "La asamblea de [title.GetName] me ha elegido para el augusto cargo de [new_holder.GetTitleAsNameNoTooltip|l] [new_holder.Custom('GetRepublicTermLength')]."
 republic_event.0051.desc: "Me han reelegido [new_holder.Custom('GetRepublicTermLength')]. Gloria a [title.GetName]."
 republic_term_length_1_desc: "para un mandato de [EmptyScope.ScriptValue('law_term_length_1_value')|0] años"
 republic_term_length_2_desc: "para un mandato de [EmptyScope.ScriptValue('law_term_length_2_value')|0] años"
 republic_term_length_3_desc: "para un mandato de [EmptyScope.ScriptValue('law_term_length_3_value')|0] años"
 republic_term_length_4_desc: "para un mandato de [EmptyScope.ScriptValue('law_term_length_4_value')|0] años"
 republic_term_length_5_desc: "para un mandato de [EmptyScope.ScriptValue('law_term_length_5_value')|0] años"
 republic_term_length_indefinite_desc: "de manera vitalicia"
 republic_event.0052.desc: "He presentado una nueva ley a los augustos miembros de la asamblea.\n\nLa propuesta «[new_law.GetNameNoTooltip]» se someterá a votación tras una deliberación."
 republic_event.0053.pass.desc: "¡La propuesta «[new_law.GetNameNoTooltip]» se ha aprobado y se ha convertido en ley de la república!"
 republic_event.0053.rejected.desc: "La asamblea ha rechazado la propuesta «[new_law.GetNameNoTooltip]»."
 republic_event.law.TT: "#bold Propuesto:#! [new_law.GetName]"
 republic_event.law_passed.TT: "#bold #P Aprobado:#!#! [new_law.GetName]"
 republic_event.law_rejected.TT: "#bold #N Rechazado:#!#! [new_law.GetName]"
 republic_event.law_kept.TT: "#bold Mantenido:#! [current_law.GetName]"
 republic_event.assembly.response: "Entendido."
 republic_event.assembly.opening: "Ciudadanos,"
 rescind_trade_monopoly_notification_base_desc: "Todos los [trade_monopolies|El] han sido cancelados en los [trade_markets|El] de [actor.GetShortUIName] que pertenecían a:"
 rescind_trade_monopoly_notification_confederation_desc: "[recipient.GetConfederation.GetName|V]"
 rescind_trade_monopoly_notification_title_desc: "[recipient.GetPrimaryTitle.GetName]"
 rescind_trade_monopoly_notification_character_desc: "Tu [company|El]"
 republic_event.0100.t: "La república de Roma"
 republic_event.0100.desc: "Roma. Pronunciar esa palabra, no como el nombre de una ciudad, sino como un símbolo, un #EMP ideal#!, ha sido el sueño de muchos. Y yo he hecho ese sueño realidad.\n\nOigo resonar las celebraciones en todos los rincones del señorío. Los ciudadanos, no, los #EMP romanos#!, encontrarán un mañana en el cual volveremos a estar en el centro de la civilización. Comienza ahora el trabajo de restaurar los ideales perdidos de la antigüedad para convertirse en un faro de esperanza, una luz que nos guíe en estos tiempos oscuros."
 republic_event.0100.a: "Todos los caminos volverán a llevar a Roma."
 republic_event.0100.b: "Roma no es solo un lugar, es un ideal."
