 gdp_merchant_family.9140.t: "Carne de mercado"
 gdp_merchant_family.9140.desc: "Desde las abarrotadas oficinas de [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly], se me enseña acerca de las rutas comerciales donde [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] gana una fortuna, o eso intenta. Hay tantos lugares y artículos que recordar.\n\nSe me saca de mi ensoñación cuando [associate.GetFirstName] golpea la mesa con su [ROOT.Char.Custom('WritingInstrument')]. «¡Ven, [ROOT.Char.Custom('GirlBoy')]! ¡Valiente [ROOT.Char.GetTitleAsNameNoTooltip|l] serás si no aprendes sobre nuestro negocio!»."
 gdp_merchant_family.9140.a: "«Contadme más sobre el comercio de [category_1.Custom('GetTradeGoodCategory')]»."
 gdp_merchant_family.9140.a.tt: "Con la mayoría de edad, [merchant.GetPrimaryTitle.GetDefinitiveName|l] ganará #V 450#! de [trade_expertise|El] [category_1.GetNameWithIcon]"
 gdp_merchant_family.9140.b: "«Tratar con [category_2.Custom('GetTradeGoodCategory')] me fascina»."
 gdp_merchant_family.9140.b.tt: "Con la mayoría de edad, [merchant.GetPrimaryTitle.GetDefinitiveName|l] ganará #V 450#! de [trade_expertise|El] [category_2.GetNameWithIcon]"
 gdp_merchant_family.9140.c: "«Quiero aprender sobre los movimientos de [category_3.Custom('GetTradeGoodCategory')]»."
 gdp_merchant_family.9140.c.tt: "Con la mayoría de edad, [merchant.GetPrimaryTitle.GetDefinitiveName|l] ganará #V 450#! de [trade_expertise|El] [category_3.GetNameWithIcon]"
 gdp_merchant_family.9150.t: "Mi mano derecha"
 gdp_merchant_family.9150.desc: "A la espera de mi edad adulta, paso gran parte del día entrenando con el soci[partner.Custom('ES_OA')] de la compañía, [partner.GetFirstName]. Sigo sus tratos y reuniones, acumulando todos los conocimientos que puedo.\n\nUn día se vuelve hacia mí tras una ardua sesión con los libros de cuentas. «Lo hacéis bien, joven [ROOT.Char.GetTitleAsNameNoTooltip|l]», sonríe y me tira una moneda. «El negocio no es fácil, pero al contrario que [ROOT.Char.GetSuzerain.Custom('ES_ElLa')] [ROOT.Char.GetSuzerain.GetTitleAsName|l] [ROOT.Char.GetSuzerain.Custom('GetGovernmentLegitimacyAdjective')], nuestra labor nos mantiene a flote»."
 gdp_merchant_family.9150.a: "«No os decepcionaré ni a vos ni a la compañía»."
 gdp_merchant_family.9150.b: "«Os lo habéis ganado más que de sobra, [partner.GetFirstNameNoTooltip]»."
 gdp_merchant_family.9150.b.tt: "Durante los próximos #V 10#! años, la [aptitude|El] de [GetCourtPositionType( 'partner_court_position' ).GetName()|l] de [partner.GetShortUIName]: #p +1#!"
 gdp_merchant_family.9150.c: "«Y, sin embargo, ¿dónde estaríamos sin [ROOT.Char.GetSuzerain.Custom('ES_ElLa')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l]?»."
 gdp_merchant_family.9150.c.tt: "Con la mayoría de edad, ganarás el [modifier|El] [GetModifier('merchant_childhood_suzerain_modifier').GetNameWithTooltip] durante #V 10#! años"
 merchant_childhood_suzerain_modifier: "Agradable al patrón"
 merchant_childhood_suzerain_modifier_desc: "Este personaje entiende la importancia de mantener buenas relaciones con aquellos que tienen más poder."
