l_spanish:
 gdp_merchant_family.0001.t: "[house_member.Custom('GetBrideGroom')|U] a la fuga"
 gdp_merchant_family.0001.desc: "Una caída en la oscuridad descubre a mi [ROOT.Char.Custom2('RelationToMe', house_member)], [house_member.Custom('ES_ElLa')] [house_member.GetTitledFirstName|l], mientras revuelve en las arcas de la compañía, con un[wedding_interest.Custom('ES_XA')] [wedding_interest.GetWomanMan] a su lado, que le urge en voz baja.\n\n«¿Qué significa esto?», pregunto, y la pareja se da la vuelta, agarrándose [Select_CString(And(house_member.IsFemale, wedding_interest.IsFemale), 'la una a la otra', 'el uno a la otra')]. Ahora reconozco [Select_CString(wedding_interest.IsFemale, 'a la desconocida', 'al desconocido' )] como [wedding_interest_house_head.Custom2('RelationToMe', wedding_interest)] [wedding_interest_house_head.Custom('ES_DelDela')] [wedding_interest_house_head.GetTitledFirstName|l].\n\n«No seguiremos más tiempo aquí. El veneno entre nuestras familias nos separará, así que hemos decidido fugarnos», dice [house_member.Custom('ES_ElLa')] [house_member.GetTitledFirstNameNoTooltip|l],"
 gdp_merchant_family.0001.desc.stubborn_outro: "barbilla levantada desafiante y mano estrechando la [wedding_interest.Custom('ES_DelDela')] [wedding_interest.GetTitledFirstNameNoTooltip|l]."
 gdp_merchant_family.0001.desc.fallback_outro: "soltando la mano [wedding_interest.Custom('ES_DelDela')] [wedding_interest.GetTitledFirstNameNoTooltip|l], aunque parece que le duela hacerlo, y extendiéndola hacia mí en una súplica muda."
 gdp_merchant_family.0001.a: "«Tomad el oro y marchad con mi bendición»."
 gdp_merchant_family.0001.b: "«¿Qué puedo hacer para convenceros para que os quedéis?»."
 gdp_merchant_family.0001.b.success: "[wedding_interest.GetFirstName] se une a vosotros"
 gdp_merchant_family.0001.b.failure: "A [wedding_interest.GetFirstName] no le impresiona"
 gdp_merchant_family.0001.c: "«¡No iréis a #EMP ninguna parte#!!»."
 gdp_merchant_family.0002.t: "La familia es lo primero"
 gdp_merchant_family.0002.desc_intro: "Revisaba el último informe de beneficios cuando irrumpe [blood.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n«Esta especie de [water.Custom('InsultNoun')] [water.Custom('InsultAdjective')] se pasa de la raya», salta. «Corre riesgos, hace caso omiso de los límites y nos deja a los demás como idiotas de remate. "
 gdp_merchant_family.0002.desc_adopted: "No es nada correcto para un[water.Custom('ES_XA')] integrante de la casa [ROOT.Char.GetHouse.GetName]»."
 gdp_merchant_family.0002.desc_associate: "No es nada correcto para un[water.Custom('ES_XA')] simple asociad[water.Custom('ES_OA')] de nuestra compañía»."
 gdp_merchant_family.0002.desc_outro: "\n\nCuando las protestas terminan por fin, vuelvo a mirar el libro de cuentas. Aunque lo demás pueda ser cierto, [water.GetFirstNameNoTooltip] trae beneficios y cuesta discutir con los resultados."
 gdp_merchant_family.0002.a: "[water.GetFirstNameNoTooltip] debe saber cuál es su lugar."
 gdp_merchant_family.0002.a.unity_gain.desc: "eligió a la familia por encima del mérito comercial"
 gdp_merchant_family.0002.b: "Volved cuando tengáis los resultados de [water.GetFirstNameNoTooltip]."
 gdp_merchant_family.0002.b.unity_loss.desc: "eligió el mérito comercial por encima de la familia"
 gdp_merchant_family.0002.c: "«Estoy demasiado ocupad[ROOT.Char.Custom('ES_OA')] para esto…»."
 gdp_merchant_family.0003.t: "No tolerar el deshonor"
 gdp_merchant_family.0003.desc: "[offended.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se me acerca claramente ofendid[offended.Custom('ES_OA')].\n\n«No os creeréis lo que me han dicho», cuenta. «[offender.Custom2('MyCharacterIntroduction', ROOT.Char)] pensó que sería gracioso insultarme a mí, y por extensión, a nuestra casa».\n\nEl desaire es mezquino, pero intencionado."
 gdp_merchant_family.0003.a: "¡Voto a [ROOT.Char.GetFaith.HighGodName] que la casa de [offender.GetHouse.GetNameNoTooltip] se habrá de disculpar!"
 gdp_merchant_family.0003.a.unity_gain.desc: "presentado un frente unido contra un insulto público"
 house_relation_reason_gdp_merchant_family.0003.a.relation_damage.desc_desc: "[target_char.GetShortUIName|U] [target_char.LocalPlayerString( 'insultaste', 'insultó' )] públicamente a la casa de [Select_CString( target_char.IsLocalPlayer, 'tu personaje', target_char.GetShortUIName )]"
 gdp_merchant_family.0003.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offended'))|U], centraos en lo que no dicen…"
 gdp_merchant_family.0003.b.unity_loss.desc: "rechazo a responder a un insulto con otro"
 gdp_merchant_family.0003.c: "Ocupaos vos. Yo tengo otros asuntos que atender."
 gdp_merchant_family.0003.c.unity_loss.desc: "ignorado un insulto contra nuestra casa"
 gdp_merchant_family.0004.t: "Una oferta prometedora"
 gdp_merchant_family.0004.desc: "Cuando disfrutaba de un paseo agradable, oigo una voz desconocida que se dirige a mí desde el otro extremo del patio. «Me gustaría contaros algo, [ROOT.Char.Custom('FormOfAddressForLiege')]». [offer_2.GetFullName] se halla de pie frente a mí; habla con un tono empalagoso.\n\n«[foreign_liege.Custom2('MyCharacterIntroduction', offer_2)|U] me envía con una propuesta. He de desposarme con [offer.Custom2('YourCharacterIntroduction', ROOT.Char)] y reforzar los lazos entre nuestras dos casas». Aguanto la respiración un momento sin darme cuenta mientras reflexiono sobre la oferta.\n\n«Y bien, ¿qué dice [ROOT.Char.Custom('FormOfAddressForLiege')]?»."
 gdp_merchant_family.0004.a: "«Será un honor para mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('offer'))]»."
 gdp_merchant_family.0004.b: "«¿Qué os parece un acuerdo que beneficie a todos?»."
 house_relation_reason_gdp_merchant_family.0004.b.relation_improve.desc_desc: "[char.GetShortUIName|U] y [target_char.GetShortUIName] [Select_CString(Or(char.IsLocalPlayer, target_char.IsLocalPlayer), 'firmasteis', 'firmaron')] un acuerdo que beneficiaba a ambos"
 gdp_merchant_family.0004.c: "«He de rechazarlo con todo respeto, pero os invito a quedaros»."
 gdp_merchant_family.0005.t: "Una vergüenza para los [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.0005.desc: "Me ha llegado el rumor de que [wayward.Custom2('MyCharacterIntroduction', ROOT.Char)] ha perdido un envío crucial del que era responsable, algo que mancharía gravemente nuestra reputación si no se soluciona. [wayward.GetHerHim|U] llamo a mis aposentos para interrogar[wayward.GetHerHim] al respecto.\n\n«Lo siento mucho, [wayward.Custom2('RelationToMe', ROOT.Char)], pero no me culpéis a mí de este percance. ¡Mi propia sangre, mi propia casa busca perjudicarme!»."
 gdp_merchant_family.0005.a: "«Yo te maldigo, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('wayward'))] [wayward.Custom('InsultAdjective')]!»."
 gdp_merchant_family.0005.a.unity_loss.desc: "condenación pública de un miembro de la casa"
 gdp_merchant_family.0005.b: "«Estamos unidos, siempre»."
 gdp_merchant_family.0005.b.unity_gain.desc: "elección de afrontar las adversidades todos juntos"
 gdp_merchant_family.0005.c: "«Solucionadlo»."
 gdp_merchant_family.0010.t: "La gota que colma el vaso"
 gdp_merchant_family.0010.desc: "Con un #EMP ESTRUENDO#!, unas cajas impactan contra el suelo y la actividad normal del [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')] se detiene. Me giro para ver a mis dos [Select_CString(And(attacker.IsFemale, defender.IsFemale), 'asociadas', 'asociados')], [attacker.Custom('ES_ElLa')] [attacker.GetTitledFirstName|l] y [defender.Custom('ES_ElLa')] [defender.GetTitledFirstName|l], a punto de llegar las manos.\n\n«Me mato a trabajar por esta familia», dice [attacker.Custom('ES_ElLa')] [attacker.GetTitledFirstNameNoTooltip|l] y [attacker.Custom('quirk_neg_present')]; la ira refulge en sus ojos. «Mientras, este triste ejemplo de [defender.GetWomanMan] pierde el tiempo por [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Si no me detenéis, juro que le meto la razón en la cabeza a palos»."
 gdp_merchant_family.0010.a: "Así no se comportan mis asociados."
 gdp_merchant_family.0010.a.tt.success: "Consigues mediar en el conflicto"
 gdp_merchant_family.0010.a.tt.failure: "Fracasas a la hora de mediar en el conflicto"
 gdp_merchant_family.0010.b: "Adelante, mostradles a todos cómo resolvemos las cosas."
 gdp_merchant_family.0010.c: "¡Lamentaréis haberle levantado la mano [defender.Custom('ES_AlAla')] [defender.GetTitledFirstNameNoTooltip|l]!"
 gdp_merchant_family.0010.d: "Haced lo que os plazca."
 gdp_merchant_family.0010.tt.duel: "@alert_icon! #alert_trial ¡[attacker.GetShortUIName] y [defender.GetShortUIName] empezarán un duelo combinado de [prowess|El] [prowess_i] y [Concept('martial', 'marcialidad' )|E] [martial_i] entre [Select_CString(And(attacker.IsFemale, defender.IsFemale), 'ellas', 'ellos')]! Alguien saldrá herido#!"
 merchant_unity_fight_stopped: "detenida una pelea entre miembros de la compañía"
 merchant_unity_fight_promoted: "promovida una pelea entre miembros de la compañía"
 gdp_merchant_family.0010.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] vence"
 gdp_merchant_family.0010.tt.attacker_won.tt: "[attacker.GetSheHe|U] hirió a [defender.GetFirstName]"
 gdp_merchant_family.0010.tt.defender_won: "[defender.GetFirstNameNoTooltip] vence"
 gdp_merchant_family.0010.tt.defender_won.tt: "[defender.GetSheHe|U] hirió a [attacker.GetFirstName] en defensa propia"
 gdp_merchant_family.0015.t: "Confidente de negocios"
 gdp_merchant_family.0015.desc: "De entre todos los rostros familiares del [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], [tip_giver.GetShortUIName] capta mi atención y me lleva a un lado. Con una sonrisa taimada, me entrega un libro de cuentas.\n\n«Ah, [ROOT.Char.GetTitledFirstName|l], ¡justo a quien buscaba! Dejad que comparta con vos mis descubrimientos más recientes; consideradlo un obsequio por nuestra colaboración continuada»."
 gdp_merchant_family.0015.a: "«¡[Select_CString(And(ROOT.Char.IsFemale, tip_giver.IsFemale), 'Juntas', 'Juntos')] podríamos conseguir grandes beneficios!»."
 gdp_merchant_family.0015.b: "«Dejad que os lo compre»."
 gdp_merchant_family.0015.b.artifact: "Libro de cuentas de alguien informado"
 gdp_merchant_family.0015.b.artifact.desc: "Un libro bien vigilado de beneficios comerciales, márgenes y contactos útiles"
 gdp_merchant_family.0015.c: "«#EMP [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]#! se beneficiará de esto…»."
 house_relation_reason_gdp_merchant_family.0015.a.relation_improve.desc_desc: "[char.GetShortUIName|U] y [target_char.GetShortUIName] [Select_CString(Or(char.IsLocalPlayer, target_char.IsLocalPlayer), 'intercambiasteis', 'intercambiaron')] un consejo lucrativo"
 house_relation_reason_gdp_merchant_family.0015.c.relation_damage.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsLocalPlayer, 'usaste', 'usó')] el consejo de [target_char.GetShortUIName] contra [target_char.GetSheHe]"
 gdp_merchant_family.0020.t: "Intercambio de talentos"
 gdp_merchant_family.0020.desc: "Mi contacto de negocios, [house_friend.Custom('MistressMaster')|l] [house_friend.GetFirstName], llega tarde a nuestra reunión habitual. Cuando por fin aparece, tiene una compañía inesperada.\n\n«[ROOT.Char.Custom('MistressMaster')|U], est[nepo_hire.Custom('ES_EA')] es mi [house_friend.Custom2('RelationToMe', SCOPE.sC('nepo_hire'))] [nepo_hire.GetFirstName], "
 gdp_merchant_family.0020.desc.diplomacy: "[Select_CString(nepo_hire.IsFemale, 'una diplomática', 'un diplomático' )] capaz. "
 gdp_merchant_family.0020.desc.martial: "un[nepo_hire.Custom('ES_XA')] estratega obstinad[nepo_hire.Custom('ES_OA')]. "
 gdp_merchant_family.0020.desc.stewardship: "un[nepo_hire.Custom('ES_OA')] maestr[nepo_hire.Custom('ES_OA')] con los libros. "
 gdp_merchant_family.0020.desc.intrigue: "un[nepo_hire.Custom('ES_XA')] [nepo_hire.GetWomanMan] ingenios[nepo_hire.Custom('ES_OA')]. "
 gdp_merchant_family.0020.desc.learning: "un[nepo_hire.Custom('ES_XA')] [nepo_hire.GetWomanMan] doct[nepo_hire.Custom('ES_OA')]. "
 gdp_merchant_family.0020.desc.outro: "Seguro que florecería bajo vuestra supervisión en [ROOT.Char.GetPrimaryTitle.GetName]»."
 gdp_merchant_family.0020.a: "«[nepo_hire.GetFirstNameNoTooltip|U] es bienvenid[nepo_hire.Custom('ES_OA')]»."
 gdp_merchant_family.0020.a.unity_loss.desc: "concedió un puesto de asociado como favor"
 gdp_merchant_family.0020.b: "«Me temo que no tenemos vacantes»."
 gdp_merchant_family.0020.b.unity_gain.desc: "rechazó contratar a un extraño"
 gdp_merchant_family.0020.c: "«Esta propuesta me insulta»."
 house_relation_reason_gdp_merchant_family.0020.a.relation_improve.desc_desc: "[char.GetShortUIName|U] metió a un familiar de [target_char.GetShortUIName] en su compañía"
 house_relation_reason_gdp_merchant_family.0020.c.relation_damage.desc_desc: "[char.GetShortUIName|U] rechazó al familiar de [target_char.GetShortUIName]"
 gdp_merchant_family.0025.t: "Nada personal"
 gdp_merchant_family.0025.desc: "Me duelen las muñecas al firmar el último de lo que parecía una pila interminable de acuerdos comerciales. Justo cuando estaba a punto de retirarme a descansar, se me acerca [leaving_associate.Custom2('MyCharacterIntroduction', ROOT.Char)]. Tartamudeando de los nervios, sostiene un pequeño pergamino y comienza a recitar su contenido.\n\n«[ROOT.Char.Custom('FormOfAddressForLiege')|U], lamento informaros de que he recibido una oferta de parte de [rival_poacher.GetPrimaryTitle.GetName] que no puedo rechazar. No sois vos, son solo negocios»."
 gdp_merchant_family.0025.a: "«Id con mi bendición»."
 gdp_merchant_family.0025.b: "«Vuestro lugar está aquí, con nosotros»."
 gdp_merchant_family.0025.b.tt: "[leaving_associate.GetShortUIName|U] se queda en la [company|El]"
 gdp_merchant_family.0025.b.success: "[leaving_associate.GetFirstNameNoTooltip] acepta quedarse"
 gdp_merchant_family.0025.b.fail: "[leaving_associate.GetFirstNameNoTooltip] se marcha igual"
 gdp_merchant_family.0025.c: "«Recordad, estáis en deuda conmigo»."
 gdp_merchant_family.0025.d: "«Sea, marchaos»."
 gdp_merchant_family.0025.d.rival: "«[rival_poacher.GetTitledFirstNameNoTooltip], ¡maldeciréis el día en que decidisteis enfurecerme!»."
 gdp_merchant_family.0025.d.rival.desc: "[TARGET_CHARACTER.GetShortUIName|U] reclutó a un [associate|El] de [Select_CString(CHARACTER.IsLocalPlayer,'tu compañía', CHARACTER.GetShortUIName)]"
 house_relation_reason_gdp_merchant_family.0025.a.relation_improve.desc_desc: "[char.GetShortUIName|U] [Select_CString(char.IsLocalPlayer, 'liberaste', 'liberó')] a un [associate|El] a la compañía de [target_char.GetShortUIName] de buena fe"
 house_relation_reason_gdp_merchant_family.0025.d.relation_damage.desc_desc: "[target_char.GetShortUIName|U] reclutó a un [associate|El] de [char.GetHouse.GetName]"
 gdp_merchant_family.0030.t: "¿Negocios o placer?"
 gdp_merchant_family.0030.desc: "Dos de mis [Select_CString(And(house_member.IsFemale, associate.IsFemale), 'asociadas', 'asociados')], [house_member.Custom('ES_ElLa')] [house_member.GetTitledFirstName|l] y [associate.Custom('ES_ElLa')] [associate.GetTitledFirstName|l], regresan a la oficina de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l] tras una #EMP extensa#! escapada para comer y traen consigo una jarra de [ROOT.Char.Custom('RegionalAlcoholicDrink')].\n\n«… y voy y le suelto, ¡ese gato debería estar en una pocilga!», dice [house_member.Custom('ES_ElLa')] [house_member.GetTitledFirstNameNoTooltip|l], consiguiendo una carcajada [associate.Custom('ES_DelDela')] [associate.GetTitledFirstNameNoTooltip|l].\n\nComo no actúe, es muy probable que [Select_CString(And(house_member.IsFemale, associate.IsFemale), 'estas dos', 'estos dos')] no hagan nada de provecho en lo que queda de día."
 gdp_merchant_family.0030.a: "«Id a buscar una botella de verdad»."
 gdp_merchant_family.0030.a.flavor: "Solo lo mejor para [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]"
 gdp_merchant_family.0030.b: "«¡De vuelta al trabajo, pandilla de [Select_CString(And(house_member.IsFemale, associate.IsFemale), 'desagradecidas', 'ingratos')]!»."
 gdp_merchant_family.0030.b.flavor: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] no tolerará haraganes"
 gdp_merchant_family.0030.c: "Veamos dónde lleva esta amistad."
 merchant_unity_breaks_encouraged: "solo bebe lo mejor que ofrece el mercado"
 merchant_unity_breaks_discouraged: "desalentó descensos en el trabajo"
 gdp_merchant_family.9000.t: "Joven [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetHouse.GetNameNoTooltip]"
 gdp_merchant_family.9000.desc: "Al fin soy tod[ROOT.Char.Custom('ES_OA')] un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] y lo bastante mayor para asumir mi lugar legítimo como [ROOT.Char.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Debo reemplazar a mi [ROOT.Char.Custom2('RelationToMeShort', predecessor)], [predecessor.GetFirstName].\n\nMi asociados ahora se fijan en mí para que dirija nuestra empresa y encuentre nuevos rumbos y oportunidades en el mundo del comercio, aunque se me diga que debo apoyarme en su experiencia y sabiduría…"
 gdp_merchant_family.9000.a: "La guía [educator.Custom('ES_DelDela')] [educator.GetTitledFirstNameNoTooltip|l] será inestimable."
 gdp_merchant_family.9000.b: "Por dónde empezar…"
 gdp_merchant_family.9000.route_hint_tt: "Ahora puedes crear y editar [distribution_routes|El]"
 gdp_merchant_family.9010.t: "Una compañía desamparada"
 gdp_merchant_family.9010.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', previous_holder)], [previous_holder.GetFirstName], nos ha dejado. Era [previous_holder.Custom('ES_ElLa')] [previous_holder.Custom('MistressMaster')] más respetad[previous_holder.Custom('ES_OA')] de la compañía. No habrá más risas en nuestros salones, ni más debates apasionados en las oficinas y todos parecen muy preocupados.\n\n"
 gdp_merchant_family.9010.interim_generated: "Todos dirigen la mirada a un[interim.Custom('ES_XA')] [interim.GetWomanMan] de nombre [interim.GetFirstName], a quien se llamó para ayudar a gestionar los asuntos y"
 gdp_merchant_family.9010.interim_relation: "Todos dirigen la mirada a mi [ROOT.Char.Custom2('RelationToMeShort', interim)], [interim.GetFirstName], quien"
 gdp_merchant_family.9010.interim: "Todos dirigen la mirada a [interim.GetFirstName], asociad[interim.Custom('ES_OA')] de confianza [ROOT.Char.Custom2('RelationToMePossessive', previous_holder)], quien"
 gdp_merchant_family.9010.close: "lo organizó todo en ausencia de [previous_holder.GetFirstNameNoTooltip] y se ocupará de las gestiones cotidianas hasta que yo sea lo bastante mayor para encargarme."
 gdp_merchant_family.9010.a: "Las cosas han cambiado tan deprisa."
 gdp_merchant_family.9110.t: "Trucos del negocio"
 gdp_merchant_family.9110.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', trader)], [trader.GetFirstName], está entre [trader.Custom('ES_LoLa')]s comerciantes más experimentad[trader.Custom('ES_OA')]s de la compañía y rara vez está en la oficina.\n\nGestiona [route.GetName|l] y se ocupa de que la totalidad de [good.Custom('GetTradeGoodUnit')] consiga llegar segura de vendedor a comprador, engordando de paso nuestra bolsa con [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')].\n\n«Un[trader.Custom('ES_XA')] buen[trader.Custom('ES_XA')] comerciante está en todas partes a la vez», sonríe. «Conoce los rostros de cada puesto del [ROOT.Char.GetDomicile.GetLocation.Custom('GetRegionalMarketTermGloss')], sus problemas ¡y los de cada guardia de ciudad y de caravana!»."
 gdp_merchant_family.9110.a: "Cuando esté al mando, seré como [trader.GetNameNoTooltip]."
 gdp_merchant_family.9110.b: "«¡Contadme más sobre las caravanas!»."
 gdp_merchant_family.9110.b.tt: "Con la mayoría de edad, ganarás #V 10#! de [trait_level_track_xp|El] de #emp $trait_track_caravaneer$#! #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#!"
 gdp_merchant_family.9110.c: "«Yo también quiero ser un[ROOT.Char.Custom('ES_XA')] buen[ROOT.Char.Custom('ES_XA')] comerciante de [good.Custom('GetTradeGood')]!»."
 gdp_merchant_family.9110.c.tt: "Con la mayoría de edad, [merchant.GetPrimaryTitle.GetDefinitiveName|l] ganará #V 450#! de [trade_expertise|El] [category.GetNameWithIcon]"
 gdp_merchant_family.9130.t: "Las ambiciones de la juventud"
 gdp_merchant_family.9130.desc: "Aprendo mucho al observar los negocios diarios de la compañía, y mis asociados se esfuerzan cuanto pueden para incluirme y así aumentar mi comprensión."
 gdp_merchant_family.9130.caravaneer: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] comercia por todas partes y sus libros de cuentas están llenos de lugares que no sé ni cómo pronunciar, lejos de [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitly]. Dónde es, solo puedo imaginarlo."
 gdp_merchant_family.9130.artisan: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] es célebre por proveer artículos inusuales y de calidad y patrocinar el mundo artesano [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 gdp_merchant_family.9130.creditor: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] es célebre por intercambiar [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationDGlossPlural')] por favores; sus libros de cuentas están llenos de nombres de los desafortunados y jugadores empedernidos del territorio [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 gdp_merchant_family.9130.fallback: "\n\nLa posición de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] está reconocida, pero no es célebre por nada en particular. Solo es una de las muchas casas comerciales del territorio [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetAdjectiveNoTooltip], implicada en muchos negocios."
 gdp_merchant_family.9130.a: "Estoy deseando llevar el timón."
 gdp_merchant_family.9130.a.caravaneer: "E iremos más lejos aún."
 gdp_merchant_family.9130.a.artisan: "Nuestro nombre es un sello de calidad."
