 gdp_improve_trade_routes_owner_has_no_routes: "A [owner.GetShortUIName] ya no le queda ni una sola [trade_route|El] que mejorar"
 gdp_improve_trade_routes_needs_route_tt: "Posees al menos una [trade_route|El]"
 gdp_improve_trade_routes_focused_route_gone: "La [trade_route|El] en la que [owner.GetShortUIName] ha elegido trabajar ya no existe"
 gdp_improve_trade_capacity_decision_success_tt: "Si la [scheme|El] tiene éxito, [selected_item.GetName|l] gana [GetModifier('gdp_improve_trade_routes_capacity_modifier').GetNameWithTooltip] durante #V 15 años#!"
 gdp_improve_trade_competitiveness_decision_success_tt: "Si la [scheme|El] tiene éxito, [selected_item.GetName|l] gana [GetModifier('gdp_improve_trade_routes_competitiveness_modifier').GetNameWithTooltip] durante #V 15 años#!"
 gdp_improve_trade_expertise_decision_success_tt: "Si la [scheme|El] tiene éxito, [selected_item.GetName|l] gana [GetModifier('gdp_improve_trade_routes_expertise_modifier').GetNameWithTooltip] durante #V 15 años#!"
 gdp_improve_trade_routes_capacity_modifier: "Logística mejorada"
 gdp_improve_trade_routes_competitiveness_modifier: "Intereses enquistados"
 gdp_improve_trade_routes_expertise_modifier: "Comerciantes veteranos"
 gdp_improve_trade_capacity_decision: "Conjura comercial: capacidad"
 gdp_improve_trade_capacity_decision_desc: "Soy consciente de que hay artículos que no podemos llevarnos porque nuestros comerciantes no tienen espacio para transportarlos. Si hacemos algunas inversiones y ajustes, será solo cuestión de tiempo que podamos aumentar nuestra presencia en todos los mercados que visitamos."
 gdp_improve_trade_capacity_decision_tooltip: "Comienza una [scheme|El] para [GetScheme('gdp_improve_trade_capacity').GetTypeName|l] en una [trade_route|El] de tu elección"
 gdp_improve_trade_capacity_decision_confirm: "Encontrar el espacio y las manos."
 gdp_improve_trade_capacity_decision_effect_tt: "Comienza una [scheme|El] para [GetScheme('gdp_improve_trade_capacity').GetTypeName|l], centrada en [selected_item.GetName|l]"
 gdp_improve_trade_competitiveness_decision: "Conjura comercial: competitividad"
 gdp_improve_trade_competitiveness_decision_desc: "La competencia es feroz en algunos mercados que mis comerciantes visitan habitualmente. Si hago llegar algunas monedas a las manos adecuadas y cierro algunos acuerdos menores con los lugareños, priorizarán a mis comerciantes antes que a la competencia."
 gdp_improve_trade_competitiveness_decision_tooltip: "Comienza una [scheme|El] para [GetScheme('gdp_improve_trade_competitiveness').GetTypeName|l] en una [trade_route|El] de tu elección"
 gdp_improve_trade_competitiveness_decision_confirm: "Conseguidnos una mejor bienvenida."
 gdp_improve_trade_competitiveness_decision_effect_tt: "Comienza una [scheme|El] para [GetScheme('gdp_improve_trade_competitiveness').GetTypeName|l], centrada en [selected_item.GetName|l]"
 gdp_improve_trade_expertise_decision: "Conjura comercial: pericia"
 gdp_improve_trade_expertise_decision_desc: "Mis comerciantes me dicen que solemos cometer siempre los mismos errores en algunas de nuestras rutas comerciales. Es hora de que echemos mano de nuestra experiencia y nos aseguremos de que nuestras rutas sean lo más eficientes posible."
 gdp_improve_trade_expertise_decision_tooltip: "Comienza una [scheme|El] para [GetScheme('gdp_improve_trade_expertise').GetTypeName|l] en una [trade_route|El] de tu elección"
 gdp_improve_trade_expertise_decision_confirm: "Enviadlos a una ruta."
 gdp_improve_trade_expertise_decision_effect_tt: "Comienza una [scheme|El] para [GetScheme('gdp_improve_trade_expertise').GetTypeName|l], centrada en [selected_item.GetName|l]"
 gdp_trade_scheme.0002.t: "$gdp_improve_trade_capacity$: éxito"
 gdp_trade_scheme.0002.desc: "[improved_trade_route.GetName|U] está yendo por fin de la manera en la que se suponía que debía ir. Mis comerciantes me han informado de que por fin estamos trayendo más artículos, como esperaba."
 gdp_trade_scheme.0002.a: "Merece la pena todo el dinero que he invertido."
 gdp_trade_scheme.0003.t: "[scheme.GetNameNoTooltip]: fracaso"
 gdp_trade_scheme.0003.desc: "A pesar de mis intentos, la ruta comercial se sigue recorriendo de la misma forma. Es irritante, pero a veces el mercado es así."
 gdp_trade_scheme.0003.a: "De vuelta a los libros de cuentas."
 gdp_trade_scheme.0004.t: "$gdp_improve_trade_competitiveness$: éxito"
 gdp_trade_scheme.0004.desc: "[improved_trade_route.GetName|U] por fin está generando el dinero que esperaba que produjera. Están priorizando a mis comerciantes por encima de la competencia y estamos ganando más dinero que antes."
 gdp_trade_scheme.0004.a: "Los favores que hemos hecho han merecido la pena."
 gdp_trade_scheme.0005.t: "$gdp_improve_trade_expertise$: éxito"
 gdp_trade_scheme.0005.desc: "[improved_trade_route.GetName|U] es ahora más eficaz que antes y cometemos menos errores. Este aprendizaje asentará los cimientos para las futuras fortunas de mi casa."
 gdp_trade_scheme.0005.a: "Y seguiré construyendo."
 gdp_disrupt_trade_routes: "Desbaratar rutas comerciales"
 gdp_disrupt_trade_routes_action: "Desbaratar rutas comerciales de"
 gdp_disrupt_trade_routes_desc: "[SCHEME.GetTargetCharacter.GetShortUIName] comercia en mis mercados. Unos cuantos escribanos sobornados y varios rumores bien lanzados bastarán para arruinar una de sus [trade_routes|El]."
 gdp_disrupt_trade_routes_desc_general: "$gdp_disrupt_trade_routes$ es una [hostile_scheme|El] en la que un [merchant|El] o [patrician|El] trabaja para desbaratar la red de [Concept('trade_route', 'rutas comerciales')|E] de un rival. Se basa en la [intrigue|El] y se pueden reclutar [agents|El]."
 GDP_DISRUPT_TRADE_ROUTES_SUCCESS_DESC: "Una de las [trade_routes|El] de [TARGET_CHARACTER.GetShortUIName] se deteriora durante #N 20 años#!"
 GDP_DISRUPT_TRADE_ROUTES_DISCOVERY_DESC: "Desbaratar las [trade_routes|El] de un rival no te expone"
 GDP_DISRUPT_TRADE_ROUTES_SHARED_MARKET_DESC: "Compartes un [trade_market|El] con [target.GetShortUIName]: $VALUE|+=0$"
