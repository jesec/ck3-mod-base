 gdp_disrupt_trade_routes_target_has_no_routes: "A [target.GetShortUIName] ya no le queda ni una sola [trade_route|El] que desbaratar"
 gdp_disrupt_trade_routes_target_needs_route_tt: "[target.GetShortUIName] posee al menos una [trade_route|El]"
 gdp_disrupt_trade_routes_capacity_modifier: "Logística desbaratada"
 gdp_disrupt_trade_routes_competitiveness_modifier: "Reputación envenenada"
 gdp_disrupt_trade_routes_discovered_opinion: "Desbarató mis rutas comerciales"
 gdp_disrupt_trade_routes_target_notification: "Problemas en [disrupted_trade_route.GetName|l]"
 gdp_disrupt_trade_routes_target_notification_tt: "Algo ha ido mal en una de mis [trade_routes|El]. Mis comerciantes no saben decirme qué."
 gdp_disrupt_trade_routes_target_notification_discovered_tt: "Una de mis [trade_routes|El] está yendo mal y mis comerciantes han señalado el origen en [owner.GetShortUIName]."
 gdp_disrupt_trade_routes_target_caught_notification: "Sabotaje descubierto"
 gdp_disrupt_trade_routes_target_caught_tt: "Uno de los hombres de [owner.GetShortUIName] ha sido capturado en una de mis [trade_routes|El] y ha admitido a qué lo habían enviado."
