l_spanish:
 gdp_improve_trade_capacity: "Mejorar capacidad comercial"
 gdp_improve_trade_capacity_action: "Mejorar capacidad comercial"
 gdp_improve_trade_capacity_desc: "He encargado a mi gente que busque formas de mejorar la capacidad de mis rutas comerciales."
 gdp_improve_trade_capacity_desc_general: "$gdp_improve_trade_capacity$ es una [trade_scheme|El] en la que un [merchant|El] o [patrician|El] pone su casa a trabajar para aumentar la [trade_route_capacity|El] de una de sus [trade_routes|El]."
 GDP_IMPROVE_TRADE_CAPACITY_SUCCESS_DESC: "La [trade_route|El] elegida gana [capacity|El] durante #V 15 años#!"
 gdp_improve_trade_capacity_invalidated_title: "@scheme_icon! La conjura $gdp_improve_trade_capacity$ termina"
 gdp_improve_trade_competitiveness: "Mejorar la competitividad comercial"
 gdp_improve_trade_competitiveness_action: "Mejorar la competitividad comercial"
 gdp_improve_trade_competitiveness_desc: "He encargado a mi gente que busque formas de asegurar que mis rutas se priorizan antes que las de la competencia."
 gdp_improve_trade_competitiveness_desc_general: "$gdp_improve_trade_competitiveness$ es una [trade_scheme|El] en la que un [merchant|El] o [patrician|El] pone su casa a trabajar para aumentar la [trade_competitiveness|El] de una de sus [trade_routes|El]."
 GDP_IMPROVE_TRADE_COMPETITIVENESS_SUCCESS_DESC: "La [trade_route|El] elegida gana [competitiveness|El] durante #V 15 años#!"
 gdp_improve_trade_competitiveness_invalidated_title: "@scheme_icon! La conjura $gdp_improve_trade_competitiveness$ termina"
 gdp_improve_trade_expertise: "Mejorar la pericia comercial"
 gdp_improve_trade_expertise_action: "Mejorar la pericia comercial"
 gdp_improve_trade_expertise_desc: "He encargado a mi gente que busque formas de mejorar la eficiencia en nuestras rutas, lo que garantiza que todos conozcamos a la gente adecuada y aprendamos de nuestros errores."
 gdp_improve_trade_expertise_desc_general: "$gdp_improve_trade_expertise$ es una [trade_scheme|El] en la que un [merchant|El] o [patrician|El] pone su casa a trabajar para aumentar la velocidad con la que una de sus [trade_routes|El] gana [trade_expertise|El]."
 GDP_IMPROVE_TRADE_EXPERTISE_SUCCESS_DESC: "La [trade_route|El] elegida gana [expertise|El] más rápido durante #V 15 años#!"
 gdp_improve_trade_expertise_invalidated_title: "@scheme_icon! La conjura $gdp_improve_trade_expertise$ termina"
