 gdp_trade_scheme.0012.t: "$gdp_disrupt_trade_routes$: éxito"
 gdp_trade_scheme.0012.desc_capacity: "A [disrupted_trade_route.GetName|U] le va a faltar espacio para llevar todos los artículos que solía llevar antes. Dejad que [target.GetShortUIName] se pregunte por qué no salen las cuentas en sus libros."
 gdp_trade_scheme.0012.desc_competitiveness: "[disrupted_trade_route.GetName|U] ya no tiene las prioridades y privilegios que tenía antiguamente en los mercados. Dejad que [target.GetShortUIName] vea lo difícil que es hacer dinero ahora."
 gdp_trade_scheme.0012.desc_discovered: "\n\nHan encontrado a uno de mis hombres, así que puede que sigan el rastro hasta mí."
 gdp_trade_scheme.0012.a: "Suerte para los necios."
 gdp_trade_scheme.0012.a_discovered: "Merece la pena."
 gdp_trade_scheme.0013.t: "$gdp_disrupt_trade_routes$: fracaso"
 gdp_trade_scheme.0013.desc: "A pesar de nuestros intentos, [target.GetShortUIName] y sus rutas comerciales están llevando sus negocios tan bien como siempre."
 gdp_trade_scheme.0013.desc_discovered: "\n\nY han visto a uno de mis comerciantes intentando manipular el negocio. Una vergüenza para el nombre de mi casa."
 gdp_trade_scheme.0013.a: "Es irritante."
 gdp_destroyed_republic_opinion: "Destruyó mi república"
 gdp_smuggler_opinion: "Contrabandista"
