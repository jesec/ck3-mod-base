l_spanish:
 gdp_visit_holding_decision_event.1200.t: "Visita a patrón"
 gdp_visit_holding_decision_event.1200.intro_desc: "Al entrar en el/la [ROOT.Char.GetCurrentLocation.GetHolding.GetType.GetName|l] de [ROOT.Char.GetCurrentLocation.GetName], me impacta su opulencia. Hay artefactos y ornamentos de incalculable valor allá donde miro: tapices de [patron.Custom('RegionalFabric')], estatuas y mobiliario tallado por manos expertas. El rico aroma a [patron.Custom('GetExpensiveMeal')] llena el aire.\n\nEntre sirvientes apresurados, "
 gdp_visit_holding_decision_event.1200.all_available_desc: "distingo a [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] anunciando mi llegada, con [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] a su vera. Debo recuperar la compostura y hacer mi propuesta."
 gdp_visit_holding_decision_event.1200.patron_available_desc: "distingo a [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] haciéndome gestos para que me acerque. Supongo que significa que soy su máxima prioridad. Debo recuperar la compostura y hacer mi propuesta."
 gdp_visit_holding_decision_event.1200.steward_available_desc: "distingo a [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] haciéndome gestos para que me acerque, pero no hay ni rastro de [patron.Custom2('MyCharacterIntroduction', ROOT.Char)]. Supongo que asuntos más urgentes le impiden recibirme. Debo recuperar la compostura y hacer mi propuesta."
 gdp_visit_holding_decision_event.1200.representative_desc: "descubro a [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] esperando para recibirme de parte de [patron.GetTitledFirstNameNoTooltip], que según me han dicho, se encuentra indispuest[patron.Custom('ES_OA')]. Debo recuperar la compostura y hacer mi propuesta."
 gdp_visit_holding_decision_event.1200.none_available_desc: "sigo intentando encontrar a [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] o a alguien a quien pueda hacerle llegar mi petición, pero en vano. Debería haber reservado una cita."
 gdp_visit_holding_decision_event.1200.a: "Quiero un mayor control de los mercados de cultura [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1200.a.tt: "Tu propuesta podría ofrecer la siguiente oportunidad:$gdp_visit_holding_decision_effect_competitiveness$"
 gdp_visit_holding_decision_event.1200.b: "Buscaré oportunidades de inversión."
 gdp_visit_holding_decision_event.1200.b.tt: "Buscar operaciones financieras podría ofrecer las siguientes oportunidades:$gdp_visit_holding_decision_effect_prestige$ "
 gdp_visit_holding_decision_event.1200.c: "Pensándolo mejor…"
 gdp_visit_holding_decision_event.1200.c.tt: "Volver para ver qué más puede ofrecer [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.success: "Mi lista de asociados impresiona [negotiator.Custom('ES_AlAla')] [negotiator.GetTitledFirstNameNoTooltip|l]"
 gdp_visit_holding_decision_event.1200.a_diplomacy.failure: "Los nombres que menciono son insignificantes"
 gdp_visit_holding_decision_event.1200.a_diplomacy.critical_failure: "Mis palabras ofenden"
 gdp_visit_holding_decision_event.1200.a_stewardship.success: "Mis habilidades organizativas convencen [negotiator.Custom('ES_AlAla')] [negotiator.GetTitledFirstNameNoTooltip|l]"
 gdp_visit_holding_decision_event.1200.a_stewardship.failure: "Tartamudeo mi argumento"
 gdp_visit_holding_decision_event.1200.a_stewardship.critical_failure: "Mis libros de cuentas muestran signos de malversación"
 gdp_visit_holding_decision_event.1200.a_intrigue.success: "Logro convencer [neighboring_ruler.Custom('ES_AlAla')] [neighboring_ruler.GetFirstNameNoTooltip|l]"
 gdp_visit_holding_decision_event.1200.a_intrigue.failure: "No se ha persuadido [neighboring_ruler.Custom('ES_AlAla')] [neighboring_ruler.GetFirstNameNoTooltip|l]"
 gdp_visit_holding_decision_event.1200.a_intrigue.critical_failure: "[negotiator.Custom('ES_AlAla')|U] [negotiator.GetTitledFirstNameNoTooltip|l] le han ofendido mis mentiras"
 gdp_visit_holding_decision_event.1200.a_learning.success: "[negotiator.Custom('ES_AlAla')|U] [negotiator.GetTitledFirstNameNoTooltip|l] le impresionan mis conocimientos"
 gdp_visit_holding_decision_event.1200.a_learning.failure: "Mi análisis de la teoría económica aburre profundamente [negotiator.Custom('ES_AlAla')] [negotiator.GetTitledFirstNameNoTooltip|l]"
 gdp_visit_holding_decision_event.1200.a_learning.critical_failure: "De algún modo he conseguido que [negotiator.Custom('ES_ElLa')] [negotiator.GetTitledFirstNameNoTooltip|l] se sienta idiota"
 gdp_visit_holding_decision_event.1200.a_martial.success: "Mi conocimiento sobre logística marcial ha impresionado [negotiator.Custom('ES_AlAla')] [negotiator.GetTitledFirstNameNoTooltip|l]"
 gdp_visit_holding_decision_event.1200.a_martial.failure: "Termino sonando a farsante"
 gdp_visit_holding_decision_event.1200.a_martial.critical_failure: "Mis ejemplos suenan como amenazas"
 gdp_visit_holding_decision_event.1200.a_prowess.success: "[negotiator.Custom('ES_AlAla')|U] [negotiator.GetTitledFirstNameNoTooltip|l] le impresiona profundamente mi poder"
 gdp_visit_holding_decision_event.1200.a_prowess.failure: "[negotiator.Custom('ES_ElLa')|U] [negotiator.GetTitledFirstNameNoTooltip|l] bosteza"
 gdp_visit_holding_decision_event.1200.a_prowess.critical_failure: "[negotiator.Custom('ES_ElLa')|U] [negotiator.GetTitledFirstNameNoTooltip|l] malinterpreta mi exhibición física como una amenaza"
 gdp_visit_holding_decision_event.1200.a.competitiveness_cooldown.tt: "Has solicitado privilegios de comercio a [patron.GetShortUIName] hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_competitiveness') )]"
 gdp_visit_holding_decision_event.1200.b.prestige_cooldown.tt: "Has intercambiado oro por prestigio con [patron.GetShortUIName] hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_patron_prestige') )]"
 gdp_visit_holding_decision_event.1201.t: "$gdp_visit_holding_decision_event.1200.t$: un mercado competitivo"
 gdp_visit_holding_decision_event.1201.all_available_desc: "Con un gesto de invitación, [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] me pide que me acerque. Apresuradamente, repaso mi propuesta una última vez. Es de absoluta importancia para la compañía de mercaderes de [ROOT.Char.GetHouse.GetName] que este acuerdo salga adelante.\n\nAl aproximarme, noto un aire de superioridad en [patron.GetFirstName].\n\n «Hacednos una oferta clara y puede que tenga la amabilidad de considerarla…»."
 gdp_visit_holding_decision_event.1201.patron_available_desc: "Con un gesto intimidante, [patron.Custom2('MyCharacterIntroduction', ROOT.Char)] me pide que me acerque. Apresuradamente, repaso mi propuesta una última vez. Es de suma importancia para la compañía de mercaderes de [ROOT.Char.GetHouse.GetName] que este acuerdo salga adelante.\n\nAl acercarme, noto un aire de superioridad en [patron.GetFirstName].\n\n «Hacednos una oferta clara y puede que tenga la amabilidad de considerarla…»."
 gdp_visit_holding_decision_event.1201.steward_available_desc: "Con un gesto de invitación, [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] me pide que me acerque. Apresuradamente, repaso mi propuesta una última vez. Es de absoluta importancia para la compañía de mercaderes de [ROOT.Char.GetHouse.GetName] que este acuerdo salga adelante.\n\n«Hacednos una oferta clara y yo evaluaré si se alinea con los intereses [patron.Custom('ES_DelDela')] [patron.GetTitledFirstName|l]»."
 gdp_visit_holding_decision_event.1201.representative_desc: "Con un gesto comedido, [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] me pide que me acerque. Apresuradamente, repaso mi propuesta una última vez. Es de absoluta importancia para la compañía de mercaderes de [ROOT.Char.GetHouse.GetName] que este acuerdo salga adelante.\n\n«Hacednos una oferta clara y yo evaluaré si se alinea con los intereses [patron.Custom('ES_DelDela')] [patron.GetTitledFirstName|l]»."
 gdp_visit_holding_decision_event.1201.a: "«Dejadme comprobar esa propuesta de contrato…»."
 gdp_visit_holding_decision_event.1201.b: "«Las palabras atan, ¿no es cierto?»."
 gdp_visit_holding_decision_event.1201.c: "Da igual."
 gdp_visit_holding_decision_event.1201.c.tt: "Regresa a tu audiencia para ver qué más podrías proponer"
 gdp_visit_holding_decision_event.1202.t: "$gdp_visit_holding_decision_event.1200.t$: una proposición de inversión"
 gdp_visit_holding_decision_event.1202.all_available_desc: "Permanezco de brazos cruzados mientras [patron.GetFirstName] lee mi propuesta. Frunce ligeramente el ceño antes de separar la vista de los documentos.\n\n«Mmm. Ya veo… Supongo que podría apoyaros a vos y a vuestra compañía de [ROOT.Char.GetHouse.GetName] a cambio de esta suma. Será suficiente para que obtengáis cierto respeto, ¿no, [ROOT.Char.GetFirstNameNoTooltip]?»."
 gdp_visit_holding_decision_event.1202.patron_available_desc: "[patron.Custom2('MyCharacterIntroduction', ROOT.Char)] parece mostrar interés, pues noto cierto gesto [negotiator.Custom('ComplimentAdjective')] en [negotiator.GetHerHim] cuando le relato mi propuesta.\n\n«Esto será suficiente para que os ganéis algo de respeto, [ROOT.Char.GetFirstNameNoTooltip]»."
 gdp_visit_holding_decision_event.1202.steward_available_desc: "Permanezco pacientemente al lado de [steward.GetFirstName] mientras lee mi propuesta. Visiblemente intrigad[steward.Custom('ES_OA')] por su contenido, levanta la vista para mirarme.\n\n«Esta propuesta está muy bien redactada, eso os lo concedo… Supongo que podría apoyaros a vos y a vuestra compañía de [ROOT.Char.GetHouse.GetName] ante [patron.Custom('ES_ElLa')] [patron.GetTitledFirstName|l]»."
 gdp_visit_holding_decision_event.1202.representative_desc: "Permanezco pacientemente al lado de [negotiator.Custom2('MyCharacterIntroduction', ROOT.Char)] mientras lee mi propuesta en nombre [patron.Custom('ES_DelDela')] [patron.GetTitledFirstNameNoTooltip|l]. Visiblemente intrigad[steward.Custom('ES_OA')] por su contenido, levanta la vista para mirarme.\n\n«Esta propuesta está muy bien redactada, eso os lo concedo… Supongo que podría apoyaros a vos y a vuestra compañía [ROOT.Char.GetHouse.GetName] ante [patron.Custom('ES_ElLa')] [patron.GetTitledFirstName|l]»."
 gdp_visit_holding_decision_event.1202.a: "«A lo mejor podríamos negociar…»."
 gdp_visit_holding_decision_event.1202.b: "«Acepto vuestra oferta»."
 gdp_visit_holding_decision_event.1202.b.success: "¡La transacción se ha completado!"
 gdp_guards_were_summoned.tt: "[patron.GetShortUIName] no quiere verte en un tiempo; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1200_guards_summoned') )]"
 gdp_caught_stealing.tt: "Te descubrieron robando en un lugar sagrado hace poco, así que estás desterrad[ROOT.Char.Custom('ES_OA')] hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )]"
 gdp_visit_holding_decision_event.1000.b.tt: "Un llamamiento a tu [merchant_patron|El] podría ofrecerte las siguientes oportunidades: $gdp_visit_holding_decision_effect_competitiveness$ $gdp_visit_holding_decision_effect_prestige$"
 gdp_visit_holding_decision_event.1200.a.negotiator.tt: "Tu [merchant_patron|El] o su representante debe estar presente"
 gdp_visit_holding_decision_event.1500.t: "Visita a [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1500.desc_returned_01: "De vuelta al recinto del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], todo sigue igual. Según el sol se desplaza por el cielo, los edificios adyacentes a la plaza se turnan para proporcionar sombra a la explanada abierta"
 gdp_visit_holding_decision_event.1500.desc_returned_02: "Un aroma intenso a incienso se cuela implacable en mis fosas nasales mientras camino a zancadas bajo la apagada luz del sol de vuelta al recinto del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_healer: "Entrecierro los ojos mientas regreso de la oscuridad de la choza de sanación para encontrar el camino de vuelta a la plaza del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_church: "Al cruzar de nuevo las puertas del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], un sosiego idílico sigue conmigo cuando me encuentro de nuevo en la plaza de dicho lugar."
 gdp_visit_holding_decision_event.1500.desc_returned_from_garden: "Regreso del sereno jardín sintiéndome más liger[ROOT.Char.Custom('ES_OA')] mientras presto atención al bullicio de la plaza del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc_returned_from_physician: "Sigo los callejones cada vez más estrechos al volver del estudio de [merchant_physician_recruit.GetFirstNameNoTooltip] y me encuentro de nuevo en el recinto del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]."
 gdp_visit_holding_decision_event.1500.desc: "Hay cierta paz en la plaza del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], a pesar de que hay mucho comercio, [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuterPlural] y ayudantes alrededor.\n\nUn/a [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] impresionante se halla en el centro, y a los lados veo carteles con afirmaciones audaces de curación, así como un jardín anexo para la reflexión silenciosa sobre [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_sickly_minor: "\n\nEn un extremo de la plaza, un devoto predica sobre una mejor salud física y, como ya acordamos, han llevado a mi enferm[1500_sickly_minor.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName] a la cabaña [Select_CString(laamp_healer_character.IsFemale, 'de la sanadora', 'del sanador' )], donde me aguarda."
 gdp_visit_holding_decision_event.1500.desc_outro_physician: "\n\nEn un rincón de la plaza, un[merchant_physician_recruit.Custom('ES_XA')] devot[merchant_physician_recruit.Custom('ES_OA')] predica sobre cómo una mejor salud corporal mejora nuestra salud espiritual. Se alza firme a pesar de la interrupción ocasional del público de campesinos."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor: "\n\nSegún acordamos en el campamento con uno de los asistentes, han acompañado a mi enferm[1500_sickly_minor.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName], a la cabaña [Select_CString(laamp_healer_character.IsFemale, 'de la sanadora', 'del sanador' )], donde me aguarda."
 gdp_visit_holding_decision_event.1500.desc_outro_partner: "\n\n[visiting_partner.GetFirstName] asiente con agradecimiento y ya observa puestos curiosos y lugares de interés alrededor de la ocupada plaza."
 gdp_visit_holding_decision_event.1500.desc_outro: "\n\nMe encuentro en un estado de satisfacción al contemplar la plaza e inhalo profundamente un par de veces mientras reflexiono sobre el siguiente destino."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_finished: "\n\n[visiting_partner.GetFirstName], que ya empieza a sentir el cansancio, dice: «No soy de [visiting_partner.GetHerHim]s que se quejan, pero… ¿no crees que ya hemos terminado aquí, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?»."
 gdp_visit_holding_decision_event.1500.desc_outro_return_finished: "\n\nTras pasar una cantidad de tiempo considerable aquí en la plaza del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], me siento a gusto de cómo ha transcurrido el día y busco cómo volver lo más deprisa a la plaza mayor."
 gdp_visit_holding_decision_event.1500.desc_outro_physician_return: "\n\n[Select_CString(merchant_physician_recruit.IsFemale, 'La predicadora devota','El predicador devoto' )] sigue pregonando sus enseñanzas relacionadas con la salud, pero parece que se acerca al final de la lección."
 gdp_visit_holding_decision_event.1500.desc_outro_sickly_minor_return: "\n\nPor algún motivo, ahora parece que hay un montón de niños en la plaza. ¿Estuvieron siempre aquí? Juegan, riñen y todo el rato encuentran nuevos modos de hacer cosas de toda la vida, y no pocas veces, para sorpresa y disgusto de sus cuidadores.\n\nYo le sigo dando vueltas en la cabeza al estado de salud de [1500_sickly_minor.GetFirstName], mientras miro por la plaza en busca de mi nuevo destino."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_01: "\n\nA mi izquierda, [visiting_partner.GetFirstName] examina con curiosidad un puesto cubierto de botellitas pequeñísimas, supuestamente llenas de gotas de veneno de [ROOT.Char.Custom('VenomousCreature')].\n\nLa mera idea me pone la piel de gallina, mientras decido dónde ir a continuación."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_02: "\n\n[visiting_partner.GetFirstName] me da un empujoncito en el hombro, señalando a los guardias que escoltan a [Select_CString(ROOT.Char.IsFemale, 'una mujer andrajosa','un hombre andrajoso' )] fuera del recinto, que grita algo sobre el fin del mundo.\n\nArqueo las cejas por instinto mientras observo la conmoción y reflexiono sobre qué hacer a continuación."
 gdp_visit_holding_decision_event.1500.desc_outro_return_partner_03: "\n\n[visiting_partner.GetFirstName] me pasa un bocado mientras paseamos por la plaza.\n\nMasco concienzudamente las raciones secas mientras pienso en cuál será mi próximo movimiento."
 gdp_visit_holding_decision_event.1500.desc_outro_return_01: "\n\nEn un rincón sombreado de la plaza, un charlatán intenta convnecer a un[ROOT.Char.Custom('ES_XA')] noble de las propiedades curativas de la arena roja.\n\nObservo indiferente su discusión mientras pienso en cuál será mi próximo movimiento."
 gdp_visit_holding_decision_event.1500.desc_outro_return_02: "\n\nEn un puesto cercano que tiene espejos de obsidiana; un [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] intenta ocultar su emoción cuando por fin tiene la oportunidad de echarse un vistazo.\n\nLevemente divertid[ROOT.Char.Custom('ES_OA')], intento decidir dónde ir a continuación."
 gdp_visit_holding_decision_event.1500.desc_outro_return_03: "\n\nJunto a la pequeña rotonda, un charlatán que carga con transcripciones de [ROOT.Char.Custom('RandomReligiousTextName')] lee el texto en voz alta para un público modesto.\n\nEscucho distraíd[ROOT.Char.Custom('ES_OA')] mientras observo la plaza y pienso qué hacer a continuación."
 gdp_visit_holding_decision_event.1500.a: "Buscaré la bendición de los sanadores."
 gdp_visit_holding_decision_event.1500.a_second: "Regresaré con los sanadores."
 gdp_visit_holding_decision_event.1500.a_sickly_minor: "Quizá los sanadores puedan ayudar a [1500_sickly_minor.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1500.a_second_sickly_minor: "[1500_sickly_minor.GetFirstNameNoTooltip] sigue esperándome."
 gdp_visit_holding_decision_event.1500.a.tt: "Una visita a los sanadores podría ofrecer la siguiente oportunidad: $gdp_visit_holding_decision_effect_cure$"
 gdp_visit_holding_decision_event.1500.a.cooldown.tt: "Has visitado a los sanadores hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_healer_recently') )]"
 gdp_visit_holding_decision_event.1500.b: "Semejante [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] me intriga."
 gdp_visit_holding_decision_event.1500.b_second: "Semejante [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] se merece otra visita."
 gdp_visit_holding_decision_event.1500.b.tt: "Entrar en el lugar de adoración local podría ofrecer las siguientes oportunidades: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_event.1500.b.cooldown.tt: "Has visitado la casa de culto local hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_holy_site_recently') )]"
 gdp_visit_holding_decision_event.1500.c: "Los jardines parecen interesantes."
 gdp_visit_holding_decision_event.1500.c_second: "Echaré otro vistazo a los jardines."
 gdp_visit_holding_decision_effect_garden_contemplate: "\n$EFFECT_LIST_BULLET$ Reflexionar sobre la fe y reducir el [stress|El]"
 gdp_visit_holding_decision_effect_garden_forage: "\n$EFFECT_LIST_BULLET$ Buscar provisiones"
 gdp_visit_holding_decision_event.1500.c.tt: "Una visita a los jardines podría ofrecer las siguientes oportunidades:$gdp_visit_holding_decision_effect_garden_contemplate$ $gdp_visit_holding_decision_effect_garden_forage$"
 gdp_visit_holding_decision_event.1500.c.cooldown.tt: "Has visitado los jardines hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_used_garden_recently') )]"
 gdp_visit_holding_decision_event.1500.d: "¿Es un predicador?"
 gdp_visit_holding_decision_event.1500.d_second: "Tengo asuntos sin resolver con [merchant_physician_recruit.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1500.d.tt: "Hablar con el médico podría ofrecer la siguiente oportunidad:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1500.e: "Atenderé a otros asuntos."
 gdp_visit_holding_decision_event.1501.intro: "La luz es más tenue y hay un #EMP aroma#! peculiar en la choza de sanación. No #EMP desagradable#!, pero abrumador.\n\n[merchant_healer_character.GetFirstName] está de pie ante una mesa alta y prepara un brebaje."
 gdp_visit_holding_decision_event.1501.t: "$gdp_visit_holding_decision_event.1500.t$: [merchant_healer_character.Custom('ES_ElLa')] sanador[merchant_healer_character.Custom('ES_XA')]"
 gdp_visit_holding_decision_event.1501.desc: "$gdp_visit_holding_decision_event.1501.intro$ Cuando entramos, un[merchant_healer_character.Custom('ES_XA')] [merchant_healer_character.GetWomanMan] nos mira con una sonrisa radiante.\n\n«¡Bienvenidos a mi humilde morada! Soy [merchant_healer_character.GetFirstNameNoTooltip]. ¿Cómo puedo ayudaros?»."
 gdp_visit_holding_decision_event.1501.desc_sickly_minor: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1500_sickly_minor'))] [1500_sickly_minor.GetFirstName], que está enferm[1500_sickly_minor.Custom('ES_OA')], se une a mí en la choza de sanación. Tose sombrí[1500_sickly_minor.Custom('ES_OA')] mientras [1500_sickly_minor.GetHerHim] llevo abajo.\n\n[Select_CString(merchant_healer_character.IsFemale, 'La sanadora', 'El sanador' )], [merchant_healer_character.GetFirstName], se levanta de su taburete de madera y me mira taciturn[merchant_healer_character.Custom('ES_OA')]: «¿Requerís mis servicios?»."
 gdp_visit_holding_decision_event.1501.desc_physician_partner: "Cuando entramos en la choza de sanación, [merchant_healer_character.GetFirstName] se encuentra realizando una purga a un[ROOT.Char.Custom('ES_XA')] ancian[ROOT.Char.Custom('ES_OA')]. [visiting_partner.GetFirstName] observa entusiasta a [merchant_healer_character.GetFirstNameNoTooltip], con un brillo de emoción en la mirada: «No me importaría probar #EMP eso#!…».\n\n[merchant_healer_character.GetFirstNameNoTooltip] levanta la mirada cuando nos oye: «¡No os había visto! ¿Qué os aqueja?»."
 gdp_visit_holding_decision_event.1501.desc_reused_healer: "$gdp_visit_holding_decision_event.1501.intro$ Alza la mirada, arqueando ligeramente las cejas: «¡Veo que habéis vuelto de una pieza! ¿Cómo puedo ayudaros esta vez?»."
 gdp_visit_holding_decision_event.1501.desc_returned_sickly_minor: "[1500_sickly_minor.GetFirstName] descansa sobre un lecho blando cerca del hornillo en un rincón de la choza de sanación, esperando que regrese. Por instinto, me inclino a comprobar su respiración y le acaricio el pelo.\n\n[merchant_healer_character.GetFirstName] deja su [ROOT.Char.Custom('WritingInstrument')] y me mira con gesto adusto: «¿Qué fue lo que acordamos?»."
 gdp_visit_holding_decision_event.1501.desc_returned_physician_partner: "Al entrar en la choza de sanación, [merchant_healer_character.GetFirstName] se inclina sobre algunas hierbas, pero levanta la mirada cuando bajamos por la escalera: «Ah, ¿así que habéis cambiado de idea?».\n\nA mi izquierda, [visiting_partner.GetFirstNameNoTooltip] alterna el peso de su cuerpo de un pie a otro, aún desea probar el procedimiento que vimos realizar antes a [merchant_healer_character.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1501.desc_returned_01: "[merchant_healer_character.GetFirstName] está atendiendo a otro paciente cuando bajo por las escaleras y entro en la choza de sanación. Me mira y, a continuación, indica al paciente que se tumbe en algún lecho más alejado en la estancia.\n\nDespués, procede a cerrar una cortina improvisada hecha con una sábana gastada para darle al paciente y a [Select_CString(And(ROOT.Char.IsFemale, merchant_healer_character.IsFemale), 'nosotras', 'nosotros')] algo de intimidad.\n\n«Ya veo que habéis vuelto», señala diligente. «¿Necesitáis mi ayuda con algo?»."
 gdp_visit_holding_decision_event.1501.desc_returned_02: "Cuando bajo otra vez a la choza de sanación levemente iluminada, [merchant_healer_character.GetFirstName] se sienta un poco más al fondo, hojeando las páginas de un diario de alguna clase. Cuesta discernirlo a distancia, pero parece contener representaciones del cuerpo humano.\n\n[merchant_healer_character.GetFirstNameNoTooltip] cierra cuidadosamente el diario, lo aparta y, a continuación, me mira para comentar con voz tranquila: «Ah, habéis regresado pues. Después de todo, ¿algo os aqueja?»."
 gdp_visit_holding_decision_event.1501.desc_outro_horn: "\n\nPor el rabillo del ojo, veo algunas alhajas medicinales, de entre las cuales un cuerno magnífico me llama la atención."
 gdp_visit_holding_decision_event.1501.desc_outro_return_horn: "\n\nUn poco más dentro de la estancia, tan munificente [1500_health_artifact.GetName] sigue en su lugar de descanso con el resto de alhajas medicinales."
 gdp_visit_holding_decision_event.1501.desc_outro_artifact: "\n\nUn poco más adentro de la estancia, en un estante lleno de alhajas medicinales, descubro tal [1500_health_artifact.GetName] de aspecto tan curioso que reclama mi interés."
 gdp_visit_holding_decision_event.1501.desc_outro_return_artifact: "\n\nUn poco más adentro de la estancia, su [1500_health_artifact.GetName] sigue reclamando mi interés."
 gdp_visit_holding_decision_event.1501.a: "$ep3_laamp_decision_event.1041.a$"
 gdp_visit_holding_decision_event.1501.a_ill: "$ep3_laamp_decision_event.1041.a_ill$"
 gdp_visit_holding_decision_event.1501.b: "«Me interesa esto: [1500_health_artifact.GetNameNoTooltip]»."
 gdp_visit_holding_decision_event.1501.c: "$ep3_laamp_decision_event.1041.c$"
 gdp_visit_holding_decision_event.1501.c.flavor: "$ep3_laamp_decision_event.1041.c.flavor$"
 gdp_visit_holding_decision_event.1501.d: "«¡[1500_sickly_minor.GetFirstNameNoTooltip], mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1500_sickly_minor'))], necesita tratamiento!»."
 gdp_visit_holding_decision_event.1501.d.partner: "$ep3_laamp_decision_event.1041.d.partner$"
 gdp_visit_holding_decision_event.1501.e: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1501.treatment_failure.t: "Fallo de tratamiento"
 gdp_visit_holding_decision_event.1501.treatment_failure.desc: "El tratamiento falla"
 gdp_visit_holding_decision_event.1501.treatment_success.t: "El tratamiento tiene éxito"
 gdp_visit_holding_decision_event.1501.return.tt: "$return_to_holy_site$"
 gdp_visit_holding_decision_event.1503.t: "$gdp_visit_holding_decision_event.1500.t$: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.desc_returned_01: "Acaba de terminar un sermón cuando regresamos al/a la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship]. [merchant_clergy_character.Custom('ES_ElLa')|U] [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName] da vueltas con una escoba, ordenando y preparando el lugar sagrado para cualquier visitante que llegue en busca de oración y meditación.\n\nLevanta la mirada cuando me acerco, una sonrisa suave dobla sus labios: «Bienvenid[ROOT.Char.Custom('ES_OA')] de nuevo a Su cálido abrazo. ¿Por qué no os quedáis un poco y disfrutáis del marco?»."
 gdp_visit_holding_decision_event.1503.desc_returned_02: "[merchant_clergy_character.Custom('ES_ElLa')|U] [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName] se sienta en uno de los bancos delante del púlpito, al parecer entregad[merchant_clergy_character.Custom('ES_OA')] a la reflexión, cuando entro de nuevo en su [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship].\n\nGira la cabeza en mi dirección, mirándome por encima del hombro mientras me acerco. «Tanto trabajo. Deja que estos pies cansados reposen un poco, [Select_CString(ROOT.Char.IsFemale, 'hija mía','hijo mío' )]. ¿Cómo te puedo ayudar?»."
 gdp_visit_holding_decision_event.1503.desc_reused_clergy: "Cuando atravieso las notables puertas de semejante [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], [merchant_clergy_character.Custom('ES_LoLa')]s [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]s que cuidan de este lugar acaban de terminar de repartirse las labores del día.\n\nEscudriño el pasillo principal y reconozco inesperadamente [merchant_clergy_character.Custom('ES_AlAla')] [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName], quien, a su vez, me echa una mirada indescifrable y se acerca: «[Select_CString(ROOT.Char.IsFemale, 'Mi hija díscola','Mi hijo díscolo' )]. ¡[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] te ha traído [Select_CString(ROOT.Char.IsFemale, 'sana y salva','sano y salvo' )] de nuevo a nuestra puerta!»."
 gdp_visit_holding_decision_event.1503.desc: "Al atravesar las puertas de semejante [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], me sorprende cuánto se ha trabajado en las estructuras exquisitas y la decoración sagrada.\n\nUn[merchant_clergy_character.Custom('ES_OA')] [Select_CString(laamp_clergy_character.IsFemale, 'de las','de los' )] [GetTrait('devoted').GetNameNoTooltip( merchant_clergy_character )|l]s que cuidan del lugar se fija en mí y viene seren[merchant_clergy_character.Custom('ES_OA')]: «Saludos, [Select_CString(ROOT.Char.IsFemale, 'hija mía','hijo mío' )]. Soy [merchant_clergy_character.Custom('ES_ElLa')] [merchant_clergy_character.Custom('SisterBrother')] [merchant_clergy_character.GetFirstName]. ¿En qué te puedo ayudar?»."
 gdp_visit_holding_decision_event.1503.desc_outro: "$ep3_laamp_decision_event.1043.desc_outro$"
 gdp_visit_holding_decision_event.1503.desc_outro_thief: "$ep3_laamp_decision_event.1043.desc_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro_thief: "$ep3_laamp_decision_event.1043.desc_return_outro_thief$"
 gdp_visit_holding_decision_event.1503.desc_return_outro: "$ep3_laamp_decision_event.1043.desc_return_outro$"
 gdp_visit_holding_decision_event.1503.a: "$ep3_laamp_decision_event.1043.a$"
 gdp_visit_holding_decision_event.1503.a.flavor_unzealous: "#EMP Supongo#!…"
 gdp_visit_holding_decision_event.1503.b: "«Quizá [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] podría bendecir a nuestra compañía»."
 gdp_visit_holding_decision_event.1503.c: "Está claro que #EMP yo#! necesito esos donativos."
 gdp_visit_holding_decision_event.1503.c_guarded: "Una donación más, a #EMP mi#! bolsa."
 gdp_visit_holding_decision_event.1503.c_master_thief: "«Pst, [visiting_partner.GetFirstNameNoTooltip], ¡vigila!»."
 gdp_visit_holding_decision_event.1503.c.flavor: "Crear una distracción, sisar algunas monedas. Fácil."
 gdp_visit_holding_decision_event.1503.c.flavor_guarded: "Hum. Por algún motivo, los guardias circulan mucho más a menudo por estas partes…"
 gdp_visit_holding_decision_event.1503.c.thievery_success.t: "Robo exitoso"
 gdp_visit_holding_decision_event.1503.c.thievery_success.desc: "Consigues robar las donaciones"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.t: "¡Expulsión!"
 gdp_visit_holding_decision_event.1503.c.thievery_failure.desc: "Se te expulsa del/de la [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.t: "Guardias llamados"
 gdp_visit_holding_decision_event.1503.c.thievery_critical_failure.desc: "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 gdp_visit_holding_decision_event.1503.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1504.t: "$gdp_visit_holding_decision_event.1503.t$"
 gdp_visit_holding_decision_event.1504.desc_epiphany: "Cuando entrego la donación, los ojos de [merchant_clergy_character.GetFirstName] se abren de la impresión: «Sois… Tenéis justo Su… Su…, juro que…», me mira durante un momento, abre y cierra la boca en vez de decir palabras, como un pez fuera del agua.\n\nEntonces, cuando se da cuenta de lo que hace, [merchant_clergy_character.GetFirstNameNoTooltip] se recompone y se aclara la garganta: «Sería un honor donar #EMP mi#! vida a vuestra causa»."
 gdp_visit_holding_decision_event.1504.desc: "La sonrisa de [merchant_clergy_character.GetFirstName] se amplía mientras se inclina y me pone una mano en el hombro: «Muy generoso de tu parte, [Select_CString(ROOT.Char.IsFemale, 'hija mía','hijo mío' )]. Entiendo que a [Select_CString(ROOT.Char.IsFemale, 'una','un' )] mercader como tú no siempre le resulta fácil donar efectivo».\n\nAsiente con tono sentencioso y la mano vuelve a su costado mientras se fija en mí."
 gdp_visit_holding_decision_event.1504.a: "«Quizá [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] podría bendecir a nuestro negocio»."
 gdp_visit_holding_decision_event.1504.a_epiphany: "«Solo me interesa la gracia de [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]»."
 gdp_visit_holding_decision_event.1504.b: "«#EMP Podríamos#! emplear otro cuerpo capaz»."
 gdp_visit_holding_decision_event.1504.c: "«Nada me interesa más que el prójimo»."
 gdp_visit_holding_decision_event.1504.c_epiphany: "… ahora mismo no contratamos a nadie."
 gdp_visit_holding_decision_event.1505.t: "$gdp_visit_holding_decision_event.1500.t$: el jardín"
 gdp_visit_holding_decision_event.1505.desc_returned_01: "El jardín sigue en silencio y algunos visitantes conversan en voz baja en las zonas con asientos mientras que otros se han embarcado en reflexión silenciosa, viendo el devenir de la naturaleza.\n\nEscucho el murmullo y la brisa, el viento en los árboles, y, de repente, me siento más en paz."
 gdp_visit_holding_decision_event.1505.desc_returned_02: "En esta ocasión, veo un pajarito en una rama de [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')], a punto de probar las alas por primera vez.\n\nSupera sin problemas el borde del nido, pero las alas se le lían de alguna manera y, durante unos instantes, el pajarito cae sin control hasta que… el viento atrapa suavemente al ave y la pone a salvo. Una sensación de alivio se extiende por mi pecho."
 gdp_visit_holding_decision_event.1505.desc: "El jardín está enmarcado por setos, y los árboles se extienden por las suaves colinas, donde se puede ver algún que otro pájaro y ardilla entre el follaje.\n\nPercibo aquí una presencia fuerte, atrapada en esta belleza. ¿Y si [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] ha estado siempre conmigo durante todas mis pruebas y tribulaciones…?"
 gdp_visit_holding_decision_event.1505.desc_outro_return_partner: "\n\nUn poco más adelante por el camino, [visiting_partner.GetFirstName] les echa otro vistazo a las plantas comestibles de la zona."
 gdp_visit_holding_decision_event.1505.desc_outro_return_gardener: "\n\nY más adelante por el camino, vislumbro más bocados salvajes estirándose con el sol de la tarde."
 gdp_visit_holding_decision_event.1505.desc_outro_partner: "\n\nA mis espaldas, oigo a [visiting_partner.GetFirstName] murmurar cada vez que nos cruzamos con otra extraña planta comestible en nuestro paseo."
 gdp_visit_holding_decision_event.1505.desc_outro_gardener: "\n\nPor el rabillo del ojo, veo frutos y hierbas silvestres de aspecto delicioso que contribuyen a la exquisitez del jardín."
 gdp_visit_holding_decision_event.1505.a: "Me siento en paz."
 gdp_visit_holding_decision_event.1505.a_convert: "Quizás el [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip] no sea tan malo, después de todo."
 gdp_visit_holding_decision_event.1505.a.cooldown.tt: "Has contemplado este jardín hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_contemplated_garden_recently') )]"
 gdp_visit_holding_decision_event.1505.b: "Sería una lástima que estos bocados se echasen a perder."
 gdp_visit_holding_decision_event.1505.b_partner: "«[visiting_partner.GetFirstNameNoTooltip], ¿y si hacemos algo de forrajeo?»."
 gdp_visit_holding_decision_event.1505.b_flavor: "¡Es hora de la cosecha!"
 gdp_visit_holding_decision_event.1505.b.cooldown.tt: "Has cosechado este jardín hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_has_harvested_recently') )]"
 gdp_visit_holding_decision_event.1505.c: "«… tantos rincones y resquicios ocultos, #EMP [visiting_partner.GetFirstNameNoTooltip]#!…»."
 gdp_visit_holding_decision_event.1505.c.flavor: "Ciertamente divino."
 gdp_visit_holding_decision_event.1505.c.cooldown.tt: "Te has relajado en este jardín hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1505_garden_unwinded_recently') )]"
 gdp_visit_holding_decision_event.1505.d: "$ep3_laamp_decision_event.1021.d$"
 gdp_visit_holding_decision_event.1507.t: "$gdp_visit_holding_decision_event.1500.t$: [merchant_physician_recruit.Custom('ES_ElLa')] médic[merchant_physician_recruit.Custom('ES_OA')]"
 gdp_visit_holding_decision_event.1507.desc_returned_01: "La puerta al estudio de [merchant_physician_recruit.GetFirstName] está ligeramente entornada, y a través de la rendija veo a [merchant_physician_recruit.GetFirstNameNoTooltip] cortarle el pelo a un cliente, que permanece muy quieto, usando unas tijeras espantosamente afiladas y finas.\n\nLlamo a la puerta y entro, haciendo que la atención [Select_CString(merchant_physician_recruit.IsFemale, 'de la médica', 'del médico' )] se vuelva hacia mí: «Muy sigilos[ROOT.Char.Custom('ES_OA')]. ¿Qué queréis?»."
 gdp_visit_holding_decision_event.1507.desc_returned_02: "[merchant_physician_recruit.GetFirstName] está al otro lado de su puerta, revisando el hombro de un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan], al parecer dolorid[ROOT.Char.Custom('ES_OA')].\n\n[merchant_physician_recruit.GetSheHe|U] termina la visita dando instrucciones sobre cómo curar mejor la articulación y luego se vuelve hacia mí: «Habéis vuelto. ¿Queréis algo esta vez?»."
 gdp_visit_holding_decision_event.1507.desc_returned_03: "Mientras subo con cautela las escaleras que conducen al estudio de [merchant_physician_recruit.GetFirstName], atisbo por la puerta abierta.\n\nParece estar enfrascad[merchant_physician_recruit.Custom('ES_OA')] en alguna especie de ejercicio físico, sudando a mares. Se acuclilla, se levanta y vuelve a empezar sin parar.\n\nDespués de una serie de repeticiones, se detiene, se quita el sudor de la frente y le echa un trago a una botella cercana. Su mirada, ahora afilada como un cuchillo, se centra en mí: «Sois bastante persistente, ¿no?»."
 gdp_visit_holding_decision_event.1507_desc_intro: "Sigo a [merchant_physician_recruit.GetFirstName] por un callejón estrecho y subo unas escaleras hasta llegar a su estudio. La estancia está abarrotada hasta el techo, con estantes que contienen escritos y grabados relacionados con humores, salud y espiritualidad.\n\nSe sienta en la única silla detrás del escritorio, acariciando descuidadamente un pequeño talismán y por fin nota mi presencia: "
 gdp_visit_holding_decision_event.1507.desc_reused_physician: "$gdp_visit_holding_decision_event.1507_desc_intro$«Oh. ¿No os he visto antes en alguna parte? ¿Qué queréis?».\n\nSopeso con cuidado mis palabras antes de responder:"
 gdp_visit_holding_decision_event.1507.desc: "$gdp_visit_holding_decision_event.1507_desc_intro$«Oh. Vos. ¿Queréis algo?».\n\n«Os vi dando un sermón a los desfavorecidos», respondo, y dudo antes de continuar:"
 gdp_visit_holding_decision_event.1507.a: "«¿Queréis trabajar para mí?»."
 gdp_visit_holding_decision_event.1507.b: "«¡Ayudadme a reforzar el espíritu de mis asociados!»."
 gdp_visit_holding_decision_event.1507.c: "«Tenéis que #EMP usar#! vuestras habilidades para seguir en forma. Uníos a mi compañía»."
 gdp_visit_holding_decision_event.1507.c.success: "[merchant_physician_recruit.GetShortUIName] coincide con tu evaluación"
 gdp_visit_holding_decision_event.1507.c.failure: "No logras atraer a [merchant_physician_recruit.GetShortUIName]"
 gdp_visit_holding_decision_event.1507.c.failure.tt: "[merchant_physician_recruit.GetShortUIName] empieza a no hacerte ni caso"
 gdp_visit_holding_decision_event.1507.d: "$ep3_laamp_decision_event.1021.d$"
 return_to_holy_site: "Regresar a las tierras de [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] para ver qué más tienen que ofrecer"
