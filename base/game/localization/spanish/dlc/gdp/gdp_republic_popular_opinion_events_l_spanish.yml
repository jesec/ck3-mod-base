l_spanish:
 # Tier: severe negative
 republic_popular_opinion_event.1001.t: "Un caldero en ebullición"
 republic_popular_opinion_event.1001.desc: "En estos días no es bueno que en las calles se nos reconozca como patricios.\n\nAl ver mi mirada ansiosa y mi expresión preocupada, [relation_01.GetName] exclama:\n\n«Voto a tal, [ROOT.Char.GetFullName]. Los patricios de [event_location_01.GetName] no se aíslan en sus casas, ¡recorren las calles como ciudadanos orgullosos!».\n\nTiene razón, pero de un tiempo a esta parte el ambiente en la ciudad es tenso. Protestas y riñas plagan la ciudad y solo puedo imaginarme qué pasará al caer la noche."
 republic_popular_opinion_event.1001.a: "«Tenéis razón. Debemos mantener la cabeza bien alta»."
 republic_popular_opinion_event.1001.b: "«Puede que sea un buen momento para hacerme con un guardaespaldas»."
 republic_popular_opinion_event.1001.c: "«¡La chusma nos matará a todos!»."
 republic_popular_opinion_event.1001.d: "«No seré una presa fácil»."
 # Tier: mild negative
 republic_popular_opinion_event.1002.t: "Temporada de descontento"
 republic_popular_opinion_event.1002.desc_1: "De pie ante mi ventana, oigo resonar voces furiosas; [event_location_01.GetName] bulle por el descontento. Los trabajadores amenazan con dejar sus herramientas o marchar por las calles. Los símbolos del gobierno son destrozados o estropeados bajo la protección de la oscuridad.\n\n"
 republic_popular_opinion_event.1002.desc_2: "[ROOT.Char.Custom('GetRepublicCapitalControlDesc')]\n\n"
 republic_popular_opinion_event.1002.desc_3: "Allá donde voy, se me recibe con rostros taciturnos, obstrucción e insultos mascullados."
 republic_popular_opinion_event.1002.desc_control_firm: "Todo lo que la muchedumbre puede hacer son gestos simbólicos de rebeldía, ya que el gobierno aplasta la más mínima señal de reunión ilegal con una eficiencia brutal."
 republic_popular_opinion_event.1002.desc_control_strained: "Gracias a [ROOT.Char.GetFaith.HighGodName], los brotes de descontento son reducidos por la guardia de la ciudad. Sus líderes son arrestados y puestos en el cepo a diario. Los agentes que intentan aprovecharse del caos son cazados y descubiertos. El orden aguanta por ahora."
 republic_popular_opinion_event.1002.desc_control_slipping: "A pesar de todo el trabajo de la guardia de la ciudad, los agitadores se escabullen y la violencia plaga las calles. Se reúnen turbas y no se disuelven a tiempo. La noche pertenece a bandas y rufianes."
 republic_popular_opinion_event.1002.desc_control_broken: "El gobierno ha perdido el control de las calles. La guardia de la ciudad se esconde en sus cuarteles ¡y la turba acosa a los patricios en las mismas escaleras de palacio! Abundan los rumores de agentes y saboteadores extranjeros."
 republic_popular_opinion_event.1002.a: "¡Estoy con el gobierno!"
 republic_popular_opinion_event.1002.b: "Dejaré claro que estoy con el pueblo."
 republic_popular_opinion_event.1002.c: "Mejor mantener la cabeza gacha."
 # Tier: mild positive
 republic_popular_opinion_event.1003.t: "Espíritu festivo"
 republic_popular_opinion_event.1003.desc: "Ente el bullicio y ajetreo del mercado de [event_location_01.GetTitle.GetName], me encuentro hablando con un[craftsman_character.Custom('ES_XA')] ciudadan[craftsman_character.Custom('ES_OA')] de nombre [craftsman_character.GetName] y los chistes sobre su burro hacen que me parta de risa.\n\nÚltimamente noto que la ciudad es como una gran familia; hablar con desconocidos resulta más fácil y todos están de buen humor, a pesar de las duras exigencias de la vida. El burro rebuzna feliz y me da con la cabeza. \n\n«La asamblea hace un buen trabajo, ¿no?», dice [craftsman_character.GetFirstNameNoTooltip] y rasca al burro detrás de las orejas. «¿Por qué no lo celebráis y organizáis un banquete? Seguro que los gremios arriman el hombro para dar una buena impresión y mostrar su aprecio»."
 republic_popular_opinion_event.1003.a: "«¡Es una idea fantástica!»."
 republic_popular_opinion_event.1003.b: "«¿Habéis dicho gratis?»."
 republic_popular_opinion_event.1003.c: "«Prefiero conoceros mejor»."
 republic_popular_opinion_event.1003.tt: "Tu próxima [activity|El] de [feast|El] es #P gratis. #!"
 # Tier: strong positive
 republic_popular_opinion_event.1004.t: "Sintiendo la ambición"
 republic_popular_opinion_event.1004.desc: "[relation_01.GetName] y yo disfrutamos de unos tragos de [ROOT.Char.Custom('RegionalDrink')] en una plaza cerca de mi casa; observamos sin hacer nada el bullicio y el trabajo de los ciudadanos en su día a día. [relation_01.GetName] suspira con satisfacción tras un sorbo a su bebida.\n\n«Os lo aseguro, [ROOT.Char.GetFullName]: hay que aprovechar el momento. ¡Seamos ambiciosos, os digo! Con la ciudad de tan buen humor, todo parece posible». Levanta la copa y sonríe. «Un brindis: ¡por las nuevas oportunidades y las monedas a raudales!».\n\nDevuelvo la sonrisa y levanto la copa."
 republic_popular_opinion_event.1004.a: "«¡Por las aventuras lejanas!»."
 republic_popular_opinion_event.1004.b: "«¡Por los nuevos amores y romances!»."
 republic_popular_opinion_event.1004.c: "«¡Por la fama y la gloria!»."
 republic_popular_opinion_event.1004.d: "«¡Por la familia y los amigos!»."
