l_spanish:
 gdp_tgf_coin_artifact: "Primera moneda de [tgf_market_holder.GetFirstNameNoTooltip]"
 gdp_tgf_coin_artifact_desc: "El rostro de [tgf_market_holder.GetFirstName] en una cara, y en el canto, en letras demasiado pequeñas para que las lea nadie salvo un mercader: [tgf_coin_merchant.GetFirstName] abasteció de [tgf_good.Custom('GetTradeGood')|l]."
 gdp_tgf_smith_weapon_axe: "Hacha de [tgf_good.Custom('GetTradeGood')] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_dagger: "Daga de [tgf_good.Custom('GetTradeGood')] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_hammer: "Martillo de [tgf_good.Custom('GetTradeGood')] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_mace: "Maza de [tgf_good.Custom('GetTradeGood')] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_spear: "Lanza de [tgf_good.Custom('GetTradeGood')] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_sword: "Espada de [tgf_good.Custom('GetTradeGood')] de [tgf_smith_patron.GetFirstNameNoTooltip]"
 gdp_tgf_smith_weapon_desc: "Producto de la forja de [tgf_smith.GetFirstName] de [tgf_source_county.GetNameNoTier], hecho a partir del mejor lingote que [tgf_smith_patron.GetFirstName] compró jamás. Vale diez veces el valor del metal, o eso jura el herrero."
 gdp_tgf_reading_stones_artifact_merchant: "Piedras de lectura de [tgf_lens_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_reading_stones_artifact_lord: "Piedras de lectura de [tgf_market_holder.GetFirstNameNoTooltip]"
 # Seneca, Naturales Quaestiones 1.6.5, on letters enlarged through a glass globe of water - https://en.wikipedia.org/wiki/Magnifying_glass
 gdp_tgf_reading_stones_artifact_desc: "Dos lentes de cristal transparente, pulidas por [tgf_glassmaker.GetFirstName] de [tgf_source_county.GetNameNoTier]. Séneca escribió que las letras pequeñas se hinchaban con un pequeño globo de cristal lleno de agua. Estas hacen grande la letra pequeña de cualquier contrato."
 gdp_tgf_showpiece_artifact: "Gabinete de [tgf_good.GetNameNoTooltip|l] de [tgf_showpiece_merchant.GetFirstNameNoTooltip]"
 gdp_tgf_showpiece_artifact_desc: "Creado por [tgf_crafter.GetFirstName], maestr[tgf_crafter.Custom('ES_OA')] [tgf_good.Custom('GetTgfGoodCrafter')]. Cada cajón está forrado con lo mejor en [tgf_good.Custom('GetTradeGood')|l] de [tgf_showpiece_merchant.GetFirstName]. Está abierto a los compradores y cerrado a todos los demás."
 gdp_tgf_curio_grain: "Una gavilla de cereal valioso"
 gdp_tgf_curio_grain_desc: "Cortado del mejor campo en un año muy bueno."
 gdp_tgf_curio_millet: "Un tarro de mijo viejo"
 gdp_tgf_curio_millet_desc: "Con varios años y como si fuera nuevo. El mijo aguanta."
 gdp_tgf_curio_rice: "Un cuenco de arroz blanco"
 gdp_tgf_curio_rice_desc: "Descascarillado, pulido y demasiado bonito para comerlo."
 gdp_tgf_curio_meat: "Una tajada perfectamente salada"
 gdp_tgf_curio_meat_desc: "Tan bien salada que puede sobrevivir a su dueño."
 gdp_tgf_curio_fish: "Un pescado seco, montado"
 gdp_tgf_curio_fish_desc: "Más tieso que una plancha y el doble de orgulloso."
 gdp_tgf_curio_cheese: "Una rueda de queso curado"
 gdp_tgf_curio_cheese_desc: "Prensado un verano que nadie más recuerda."
 gdp_tgf_curio_fruit: "Un tarro de fruta en conserva"
 gdp_tgf_curio_fruit_desc: "Confitada, sellada y guardada para un día que lo merezca."
 gdp_tgf_curio_oil: "Una vasija con el primer prensado"
 gdp_tgf_curio_oil_desc: "De un verde dorado, del primer prensado del año."
 gdp_tgf_curio_honey: "Un tarro de miel sellado"
 gdp_tgf_curio_honey_desc: "Tan oscura como el ámbar. Más vieja que algunas cosechas."
 gdp_tgf_curio_tea: "Un ladrillo de té prensado"
 gdp_tgf_curio_tea_desc: "Vale su peso en oro, muy lejos del jardín."
 gdp_tgf_curio_horses: "La herradura de un campeón"
 gdp_tgf_curio_horses_desc: "De un caballo que jamás perdió una carrera. O eso jura el vendedor."
 gdp_tgf_curio_cattle: "Un cuerno de vaca pulido"
 gdp_tgf_curio_cattle_desc: "Pulido hasta brillar. Bueno para beber en banquetes."
 gdp_tgf_curio_silver: "Un lingote de plata perfecto"
 gdp_tgf_curio_silver_desc: "Lo bastante puro como para ponerle una marca, pero nadie se atreve."
 gdp_tgf_curio_gold: "Una pepita de oro fluvial"
 gdp_tgf_curio_gold_desc: "Sacada de un río al que nadie da nombre."
 gdp_tgf_curio_iron: "Una plancha de oro perfecta"
 gdp_tgf_curio_iron_desc: "Densa, oscura y sin un solo fallo."
 gdp_tgf_curio_copper: "Un círculo de cobre reluciente"
 gdp_tgf_curio_copper_desc: "Fundido en la mina, tan brillante como el día en que se enfrió."
 gdp_tgf_curio_beer: "Un jarra tallada"
 gdp_tgf_curio_beer_desc: "Contiene exacta y sinceramente una pinta. Pocas veces se usa para tomar una sola."
 gdp_tgf_curio_wine: "Una cosecha legendaria"
 gdp_tgf_curio_wine_desc: "Una botella de un año del que los viticultores aún susurran."
 gdp_tgf_curio_gems: "Una gema en bruto"
 gdp_tgf_curio_gems_desc: "Tan basta como la grava y con el valor de una aldea."
 gdp_tgf_curio_amber: "Un trozo de ámbar"
 gdp_tgf_curio_amber_desc: "Del color de la miel, con una mosca atrapada dentro para siempre."
 gdp_tgf_curio_ivory: "Una esquirla de marfil tallado"
 gdp_tgf_curio_ivory_desc: "La punta de un colmillo, tallado por alguien con paciencia."
 gdp_tgf_curio_jade: "Un guijarro de jade de río"
 gdp_tgf_curio_jade_desc: "Frío en la mano, como siempre lo está el verdadero jade."
 gdp_tgf_curio_wood: "Un nudo de madera con marcas"
 gdp_tgf_curio_wood_desc: "Vetas como el agua que corre. Los talladores se la disputan todos los años."
 gdp_tgf_curio_hemp: "Un rollo perfecto de cuerda"
 gdp_tgf_curio_hemp_desc: "Una cuerda tan uniforme que parece extraída y no retorcida."
 gdp_tgf_curio_wool: "Un vellón dorado"
 gdp_tgf_curio_wool_desc: "No es el famoso vellocino. Pero por poco, dice el pastor."
 gdp_tgf_curio_cotton: "Una bola del mejor algodón"
 gdp_tgf_curio_cotton_desc: "Tan ligera como el plumón y tan blanca como la escarcha."
 gdp_tgf_curio_flax: "Una madeja de lino sedoso"
 gdp_tgf_curio_flax_desc: "Un lino tan fino que de noche parece seda."
 gdp_tgf_curio_textiles: "El rollo de un maestro tejedor"
 gdp_tgf_curio_textiles_desc: "Un tejido tan apretado que repele la lluvia."
 gdp_tgf_curio_furs: "Una piel invernal impecable"
 gdp_tgf_curio_furs_desc: "Conseguida en pleno invierno, cuando el pelaje es más grueso."
 gdp_tgf_curio_leather: "Un tablero de cuero labrado"
 gdp_tgf_curio_leather_desc: "Curtido, labrado y tan suave como el paño."
 gdp_tgf_curio_sugar: "La punta de un pan de azúcar blanco"
 gdp_tgf_curio_sugar_desc: "La parte más blanca del pan, guardada para exhibirla."
 gdp_tgf_curio_spices: "Una caja de especias poco comunes"
 gdp_tgf_curio_spices_desc: "Se abre una vez al año para demostrar que existe."
 gdp_tgf_curio_ceramics: "Un cuenco esmaltado perfecto"
 gdp_tgf_curio_ceramics_desc: "Resuena como una campana cuando se golpea. Nadie lo toca."
 gdp_tgf_curio_glass: "Un vial de cristal transparente"
 gdp_tgf_curio_glass_desc: "Ni una burbuja en su interior. El soplador de vidrio se jubiló orgulloso."
 gdp_tgf_curio_jewelry: "Un broche que es una obra maestra"
 gdp_tgf_curio_jewelry_desc: "Solo el cierre llevó un mes."
 gdp_tgf_curio_lacquerware: "Una caja de recuerdos lacada"
 gdp_tgf_curio_lacquerware_desc: "De treinta capas. Eclipsa el regalo de su interior."
 gdp_tgf_curio_silk: "Un retal de seda perfecta"
 gdp_tgf_curio_silk_desc: "La mejor obra del telar, sacado del mercado."
 gdp_tgf_curio_incense: "Un trozo de resina pálida"
 gdp_tgf_curio_incense_desc: "Dulce antes de quemarla. Más dulce cuando se quema. Jamás quemada."
 gdp_tgf_curio_medicaments: "Un muestrario de boticario"
 gdp_tgf_curio_medicaments_desc: "Una dosis de todo, contra todo."
 gdp_tgf_curio_stone: "El fragmento de una piedra labrada"
 gdp_tgf_curio_stone_place: "Una piedra labrada de [tgf_source_county.GetNameNoTierNoTooltip]"
 gdp_tgf_curio_stone_desc: "Más antigua que cualquier albañil vivo y mejor tallada."
 gdp_tgf_curio_salt: "Una pastilla de sal blanca pura"
 gdp_tgf_curio_salt_desc: "Blanca como la nieve, como nunca es la sal gris."
 gdp_tgf_curio_alum: "Un cristal de alumbre del tamaño de un puño"
 gdp_tgf_curio_alum_desc: "Transparente como el hielo y ácido a la lengua."
 gdp_tgf_curio_dyes: "Un vial de púrpura auténtico"
 gdp_tgf_curio_dyes_desc: "Un color antaño reservado para los emperadores. Técnicamente aún lo es."
 gdp_tgf_curio_books_paper: "Una página miniada"
 gdp_tgf_curio_books_paper_desc: "Una página perfecta de un libro que nadie puede encontrar."
 gdp_tgf_itinerary_artifact: "El itinerario de un peregrino"
 gdp_tgf_itinerary_artifact_desc: "Un pequeño libro gastado que indica caminos, posadas y vados, escrito con una mano cuidadosa. Algunos de esos lugares no salen en ningún mapa."
 gdp_tgf_first_sale_artifact: "La primera venta de [tgf_good.GetNameNoTooltip] de [tgf_first_seller.GetFirstNameNoTooltip]"
 gdp_tgf_first_sale_artifact_desc: "El/La [tgf_good.Custom('GetTgfGoodSmallest')] de [tgf_good.Custom('GetTradeGood')|l] que [tgf_first_seller.GetFirstName] vendió por primera vez, que recompró al doble de su precio y que enmarcó. No está a la venta. Probablemente."
 gdp_tgf_merchant_portrait_artifact: "Retrato de un mercader"
 gdp_tgf_merchant_portrait_artifact_desc: "Un mercader sentado a una mesa de cuentas, pintado con una pila de monedas y aire de gran satisfacción."
 gdp_tgf_bale_book_artifact: "Un libro del cargamento"
 gdp_tgf_bale_book_artifact_desc: "Alguien lo usó para prevenir la humedad de los artículos de un mercader. Funcionó, en gran medida."
 gdp_tgf_handbook_practice_artifact: "La práctica del comercio"
 gdp_tgf_handbook_practice_artifact_desc: "Pesos, medidas, caminos y precios, apuntados por un mercader que al parecer nunca dormía. Los márgenes están llenos de sumas de otra persona."
 gdp_tgf_handbook_roads_artifact: "El libro de los caminos y los mercados"
 gdp_tgf_handbook_roads_artifact_desc: "Todo camino entre los grandes mercados, con los cánones, las posadas y cuál barquero es un timador."
 gdp_tgf_handbook_mirror_artifact: "El espejo del mercader"
 gdp_tgf_handbook_mirror_artifact_desc: "Consejos para un mercader, desde qué comprar a de quién fiarse. En su mayor parte es de quién no fiarse."
