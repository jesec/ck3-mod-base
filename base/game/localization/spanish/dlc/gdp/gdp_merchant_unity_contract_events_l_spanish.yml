l_spanish:
 option_boilerplate.tt.partner_aptitude: "#WEAK Este duelo se decide por la [aptitude|lE] de tu [deputy|lE]#!"
 option_boilerplate.tt.partner_aptitude.success: "Tu delegado tiene éxito"
 option_boilerplate.tt.partner_aptitude.failure: "Tu delegado fracasa"
 gdp_merchant_unity_contract.1004.t: "$unity_irregularities_contract$: quejas en [destination.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_unity_contract.1004.desc: "La misiva [local_ruler.Custom('ES_DelDela')] [local_ruler.GetTitledFirstName|l] es corta y va al grano: la conducta de mi comerciante, [trader.Custom('ES_ElLa')] [trader.GetTitledFirstName|l], y, por consiguiente, de mi compañía, ha sido cuestionada por los irritados habitantes de [destination.GetBaronyNameExplicitly].\n\nMercaderes locales, dueños de negocios y residentes, todos presentan quejas sobre irregularidades en los tratos de mi compañía. [local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] ansía poner fin a este asunto y sosegar a sus peticionarios.\n\nEstá claro que [trader.Custom('ES_ElLa')] [trader.GetTitledFirstNameNoTooltip|l] se ha estado tomando demasiadas libertades, lejos del examen al que estaría sujet[trader.Custom('ES_OA')] aquí en [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nLo único que resta es viajar a [destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_unity_contract.1004.a: "Pongámonos en marcha."
 gdp_merchant_unity_contract.1004.tt.destination_list: "Empiezas inmediatamente el viaje a [destination.GetBaronyNameExplicitly]"
 gdp_merchant_unity_contract.1004.tt.explanation: "#TUT Para cumplir el [task_contract|El]:\n$EFFECT_LIST_BULLET$Tendrás #V 3#! oportunidades para dar garantías:\n$TAB$$EFFECT_LIST_BULLET$#V 2#! garantías aseguran el $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$#V 3#! garantías aseguran un $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$#V 1#! garantía podría llevar a un $label_success_standard$, un $label_success_qualified$ o un $label_failure_standard$\n$EFFECT_LIST_BULLET$Los retos pueden ser:\n$TAB$$EFFECT_LIST_BULLET$Poner a prueba tu [stewardship|El]\n$TAB$$EFFECT_LIST_BULLET$Poner a prueba la [aptitude|El] de tu [deputy|El] [GetCourtPositionType('partner_court_position').GetName()|l]\n$TAB$$EFFECT_LIST_BULLET$Poner a prueba tu [diplomacy|El], [intrigue|El] o [learning|El]#!"
 gdp_merchant_unity_contract.1010.t: "$unity_irregularities_contract$: la plaza del pueblo"
 gdp_merchant_unity_contract.1010.desc.intro: "«¿[ROOT.Char.GetTitledFirstNameNoTooltip], supongo?», suspira [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstName|l] cuando mi partida y yo nos encontramos con su séquito en [destination.GetBaronyNameExplicitly]. Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('trader'))], [trader.Custom('ES_ElLa')] [trader.GetTitledFirstName|l], va detrás, seguid[trader.Custom('ES_OA')] por guardias."
 gdp_merchant_unity_contract.1010.desc.intro.has_partner: "Mi [GetCourtPositionType('partner_court_position').GetName()|l] [partner.GetFirstName] se mueve por detrás de mí, alerta y list[partner.Custom('ES_OA')] para ayudar."
 gdp_merchant_unity_contract.1010.desc.midtro: "\n\n«Este comerciante vuestr[trader.Custom('ES_OA')] ha causado unos cuantos trastornos, de lo que darán fe nuestros testigos», continúa [local_ruler.GetFirstNameNoTooltip]. «Confío en que resolveréis esto con presteza, ¡no puedo perder el tiempo en estos asuntos!»."
 gdp_merchant_unity_contract.1010.desc.outro: "\n\nSe me dirige a ver y escuchar los motivos de queja [person_c.Custom('ES_DelDela')] [person_c.GetTitledFirstName|l] y [person_d.Custom('ES_ElLa')] [person_d.GetTitledFirstName|l]. [trader.GetFirstNameNoTooltip] me echa una mirada que dice «[ROOT.Char.GetTitleAsNameNoTooltip], vamos, vos entenderéis…»."
 gdp_merchant_unity_contract.1010.a: "Buen[local_ruler.Custom('ES_XA')] [local_ruler.GetTitledFirstNameNoTooltip|l], ¿podríais ponerme al corriente?"
 gdp_merchant_unity_contract.1010.a.tt: "Buscas inmediatamente la explicación [THIS.Char.Custom('ES_DelDela')] [THIS.Char.GetTitledFirstName|l]"
 gdp_merchant_unity_contract.1010.b: "Nos veremos con [person_c.Custom('ES_ElLa')] [person_c.GetTitledFirstNameNoTooltip|l]."
 gdp_merchant_unity_contract.1010.c: "[person_d.Custom('ES_ElLa')|U] [person_d.GetTitledFirstNameNoTooltip|l] ansía hablar con [Select_CString(And(ROOT.Char.IsFemale, local_ruler.IsFemale), 'nosotras', 'nosotros')]."
 gdp_merchant_unity_contract.1010.d: "Acabemos con esto enseguida."
 gdp_merchant_unity_contract.1011.t: "$unity_irregularities_contract$: [char_current.GetTitledFirstNameNoTooltip]"
 gdp_merchant_unity_contract.1011.desc.business.local_ruler: "Nos escoltan hasta las dependencias privadas y poco modestas [char_current.Custom('ES_DelDela')] [char_current.GetTitleAsNameNoTooltip|l]. [char_current.GetFirstNameNoTooltip] me lleva a una sala que obviamente sirve para que hablen las personas más importantes [destination.GetTitle.Custom('BaronyTownTypePossessive')] e indica un asiento."
 gdp_merchant_unity_contract.1011.desc.business.merchant: "[char_current.Custom('ES_ElLa')|U] [char_current.GetTitledFirstName|l] me lleva al cercano local de su compañía, donde sus asociados rellenan los libros de cuentas con los frutos de los tratos del día."
 gdp_merchant_unity_contract.1011.desc.business.docks: "[char_current.GetFirstName] está a cargo del puerto de la ciudad y observa las entradas y salidas desde los muelles. Un sinfín de papeles registran los cargos que deben pagar las naves y los cargamentos entregados y estibados."
 gdp_merchant_unity_contract.1011.desc.business.market: "[char_current.GetFirstName] supervisa el marcado principal de [destination.GetTitle.GetBaseNameNoTier] y se asegura de que todos los vendedores tengan licencia y de que se cumpla la ley [local_ruler.Custom('ES_DelDela')] [local_ruler.GetTitleAsNameNoTooltip|l]."
 gdp_merchant_unity_contract.1011.desc.business.smithy: "Encuentro a [char_current.GetFirstName] en su herrería, está ocupad[char_current.Custom('ES_OA')] martilleando unas herraduras. Ni se entera de que me acerco y se disculpa cuando su mirada encuentra la mía y le pasa el trabajo a un aprendiz."
 gdp_merchant_unity_contract.1011.desc.business.tannery: "Encuentro a [char_current.GetFirstName] en su curtiduría, un lugar fétido en las afueras de la ciudad. Ni se entera del hedor, y las muchas pieles y clientes dan fe de que los beneficios superan con mucho el mal olor."
 gdp_merchant_unity_contract.1011.desc.business.carpentry: "Encuentro a [char_current.GetFirstName] en su taller, el ambiente es denso con el aroma de [char_current.Custom('GetRandomAppropriateTree')]. Al verme deja a un lado las piezas que estaba tallando."
 gdp_merchant_unity_contract.1011.desc.business.town_watch: "[char_current.GetFirstName] dirige el cuerpo de guardia [destination.GetTitle.GetAdjectiveNoTooltip] y me [char_current.GetHerHim] encuentro echando una cabezada en la armería. Al despertar me ofrece un asiento, mientras farfulla que estaba haciendo un descanso."
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler: "«Hablemos sin rodeos, [ROOT.Char.GetTitledFirstNameOnlyNotMeNoTooltip]», empieza. «Me han dicho que vuestr[trader.Custom('ES_OA')] [trader.GetWomanMan] está involucrad[trader.Custom('ES_OA')] en toda clase de engaños y"
 gdp_merchant_unity_contract.1011.desc.personality.local_ruler.closing: "\n\n«Poned vuestra compañía en orden o habréis de encontrar otro lugar donde hacer negocios»."
 gdp_merchant_unity_contract.1011.desc.personality.merchant: "«¿Es tan difícil…», sonríe, «llevar vuestros negocios limpiamente? En lo que respecta a vuestros tratos, [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] no sale muy bien…»"
 gdp_merchant_unity_contract.1011.desc.personality.courtier: "«Os lo advierto», sonríe, «[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitleAsNameNoTooltip|l] ha tenido paciencia hasta ahora, pero no os conviene poner[local_ruler.GetHerHim] a prueba»."
 gdp_merchant_unity_contract.1011.desc.personality.market: "«De todos los comerciantes que operan aquí», sonríe abriendo los brazos. «Sobre [trader.Custom('ES_ElLa')] #EMP vuestr[trader.Custom('ES_OA')]#!», me señala acusador[char_current.Custom('ES_XA')], «recibo quejas constantes»."
 gdp_merchant_unity_contract.1011.desc.personality.town_watch: "«Aquí tenemos un dicho», se sonríe. «#EMP Donde hay humo, hay fuego#!, ¡y vuestr[trader.Custom('ES_OA')] comerciante hace #EMP mucho#! humo, os lo aseguro!»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_honor: "«Siempre he llevado mis negocios con rectitud; mantengo unos registros correctos y unas buenas relaciones con mis clientes. Es una lástima que no todos nos molestemos en hacer lo mismo…»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_zeal: "«No le demos más vueltas, [char_current.GetFaith.WealthGodName] nos observa a todos y yo me aseguro de estar a buenas con la divinidad. Quienes no, pronto lo descubrirán…»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_greed: "«Mirad, me gusta llevarme una moneda tanto como cualquier otr[char_current.Custom('ES_OA')], ¡puede que más! Pero es imposible llevar un negocio en el que no se me paga a la mínima»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_compassion: "«Parecéis una persona razonable, [ROOT.Char.GetTitledFirstNameNoTooltip|l]. Entended que vuestr[trader.Custom('ES_OA')] [trader.GetWomanMan] nos ha perjudicado y no nos lo podemos permitir»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_boldness: "«Me considero una persona práctica, hablo clar[char_current.Custom('ES_OA')] y espero que los demás hablen claro conmigo. Vuestr[trader.Custom('ES_OA')] [trader.GetWomanMan] es un[trader.Custom('ES_XA')] mentiros[trader.Custom('ES_OA')]. Y no hay nada más que añadir»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_rationality: "«Ya sé, ya sé, parece que nos va bien, pero dependo de envíos para hacer negocios y vuestr[trader.Custom('ES_OA')] [trader.GetWomanMan] me ha fallado demasiadas veces»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_vengefulness: "«Me gusta actuar con justicia, [ROOT.Char.GetTitledFirstNameNoTooltip|l], en los negocios, con mis subordinados y mis superiores. Pero la justicia solo se consigue si todos formamos parte del mismo grupo; si no, en fin, así nace el resentimiento en #EMP algunos#!»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_energy: "«Soy una persona ocupada; vos también lo sois, así que seré franc[char_current.Custom('ES_OA')]. Si no tengo lo que preciso, no puedo dar de comer a los míos. Quiero que esto se solucione»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_sociability: "«Mirad, estoy segur[char_current.Custom('ES_OA')] de que [trader.GetFirstName] en el fondo es una persona decente, pero mi tolerancia tiene un límite y [trader.GetSheHe] lo superó hace mucho tiempo»."
 gdp_merchant_unity_contract.1011.desc.personality.ai_personality_fallback: "«Así que… ¿qué vais a hacer? Vuestr[trader.Custom('ES_OA')] [trader.GetWomanMan] se ha hecho muchos enemigos aquí sin necesidad. Solo queremos que se nos trate con decencia»."
 gdp_merchant_unity_contract.1011.desc.irregularity.missing: "extravió varios envíos»."
 gdp_merchant_unity_contract.1011.desc.irregularity.quality: "entregó productos de mala calidad»."
 gdp_merchant_unity_contract.1011.desc.irregularity.dues: "no pagó los cargos debidos»."
 gdp_merchant_unity_contract.1011.a: "Intenta justificar las discrepancias."
 gdp_merchant_unity_contract.1011.b: "Intenta convencer[char_current.GetHerHim] de tu honor."
 gdp_merchant_unity_contract.1011.c: "Le cuentas un cuento."
 gdp_merchant_unity_contract.1011.d.gold: "«Tomad esto por vuestras molestias»."
 gdp_merchant_unity_contract.1011.d.competitiveness: "«Me encargaré de que se arreglen las cosas»."
 gdp_merchant_unity_contract.1011.e: "«¿No podríamos llegar quizá a un #EMP arreglo#!?»."
 gdp_merchant_unity_contract.1011.f.partner: "[partner.GetFirstNameNoTooltip|U], explicadlo vos."
 gdp_merchant_unity_contract.1011.f.partner_away: "Si mi [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] estuviera aquí…"
 gdp_merchant_unity_contract.1011.f.partner_diff: "Si tuviera un [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l] diferente…"
 gdp_merchant_unity_contract.1011.f.no_partner: "Ojala tuviera un [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l]…"
 gdp_merchant_unity_contract.1011.tt.current_assurances: "#TUT Has dado [task_contract.MakeScope.Var('assurances_given').GetValue|0V] garantías de las #V 3#! posibles#!"
 gdp_merchant_unity_contract.1011.tt.chars_checked: "#TUT Has hablado con [task_contract.MakeScope.Var('chars_checked').GetValue|0V] [characters|lE] de los #V 3#! posibles#!"
 gdp_merchant_unity_contract.1011.tt.success_increases_score: "Das #P +1#! garantía"
 gdp_merchant_unity_contract.1011.tt.failure_gives_no_score: "No se dan garantías"
 gdp_merchant_unity_contract.1011.stewardship.tt.success: "Se lleva uno aquí, allí se pierde una entrada"
 gdp_merchant_unity_contract.1011.stewardship.tt.failure: "No, esperad. Oh, ¿de verdad?"
 gdp_merchant_unity_contract.1011.diplomacy.tt.success: "Un necio error por su parte"
 gdp_merchant_unity_contract.1011.diplomacy.tt.failure: "Todas sus palabras son consistentes"
 gdp_merchant_unity_contract.1011.intrigue.tt.success: "No es tan inteligente como se cree"
 gdp_merchant_unity_contract.1011.intrigue.tt.failure: "Es el doble de inteligente que tú"
 gdp_merchant_unity_contract.1011.learning.tt.success: "Sabes dónde buscar"
 gdp_merchant_unity_contract.1011.learning.tt.failure: "Buscas por todas partes sin encontrar nada"
 gdp_merchant_unity_contract.1012.t.success: "$unity_irregularities_contract$: ¡éxito!"
 gdp_merchant_unity_contract.1012.t.failure: "$unity_irregularities_contract$: ¡fracaso!"
 gdp_merchant_unity_contract.1012.t.ignored: "$unity_irregularities_contract$: tarea ignorada"
 gdp_merchant_unity_contract.1012.desc.method.stewardship: "Al revisar sus libros de cuentas, [char_current.Custom('ES_ElLa')] [char_current.GetTitledFirstName|l] señala ejemplos de actividades ilícitas, desembolsos que jamás tuvieron reintegro o fueron menores de lo acordado."
 gdp_merchant_unity_contract.1012.desc.method.diplomacy: "Hablo largo y tendido sobre la buena reputación de mi compañía en [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] y su buena fama entre las buenas gentes de la zona. Las transacciones recientes son, evidentemente, una aberración que debe ser puesta aparte por el bien del comercio."
 gdp_merchant_unity_contract.1012.desc.method.intrigue: "Tejo una enrevesada historia de dificultades recientes, con muchas evasivas sin sentido y una sensata inserción de detalles verídicos, hasta el punto que pierdo la pista de la red de mentiras."
 gdp_merchant_unity_contract.1012.desc.method.learning: "Hablamos durante lo que #EMP parece#! la mayor parte del día y discutimos todos los aspectos concebibles de los negocios [char_current.Custom('ES_DelDela')] [char_current.GetTitledFirstName|l] en [destination.GetBaronyNameExplicitly]. No queda piedra sin levantar, ni pregunta sin hacer."
 gdp_merchant_unity_contract.1012.desc.method.partner: "Con [partner.GetFirstName] al frente de la entrevista, [char_current.Custom('ES_ElLa')] [char_current.GetTitledFirstName|l] se sienta para responder lo que parece una andanada interminable de preguntas. Al principio con paciencia; después, cada vez menos con el paso del tiempo."
 gdp_merchant_unity_contract.1012.desc.method.bribe.gold: "«Vuestra comprensión en este asunto se agradecería #EMP mucho#!». Sonrío, meto la mano en mi bolsa y echo unas cuentas monedas sobre la mesa. [char_current.GetFirstNameNoTooltip] se queda congelad[char_current.Custom('ES_OA')] un instante, echando una ojeada al metal brillante y a la ceja que tengo alzada."
 gdp_merchant_unity_contract.1012.desc.method.reimburse: "«[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] lamenta terriblemente vuestras molestias en este malentendido», engatuso. «Yo #EMP personalmente#! reembolsaré vuestras pérdidas»."
 gdp_merchant_unity_contract.1012.desc.result.outro.all_done: "Y, de este modo, he hecho todo lo posible. Es hora de pasar página."
 gdp_merchant_unity_contract.1012.desc.result.bribe_success: "[char_current.GetFirstNameNoTooltip] me echa una mirada de reconocimiento y mueve las monedas hacia sí."
 gdp_merchant_unity_contract.1012.desc.result.bribe_failure: "La sorpresa de [char_current.GetFirstNameNoTooltip] se convierte rápidamente en ira y se me señala la puerta."
 gdp_merchant_unity_contract.1012.desc.result.success: "Con algunos embustes y algo de lamento por los caprichos del comercio, [char_current.GetFirstNameNoTooltip] acepta poco a poco mis excusas por cada una de las inconsistencias. Son solo las tristes realidades del comercio a larga distancia."
 gdp_merchant_unity_contract.1012.desc.result.failure: "A pesar de mis intentos, [char_current.GetFirstNameNoTooltip] rechaza cada uno de mis argumentos, presenta una solución, refutación o ejemplo a partir de su experiencia y sigue sin quedar satisfech[char_current.Custom('ES_OA')]."
 gdp_merchant_unity_contract.1012.desc.result.reimburse: "Más vale pájaro en mano que ciento volando, y las ganancias probablemente ilícitas de est[char_current.Custom('ES_EA')] [char_current.GetWomanMan] reposan perfectamente en mi mano; aunque el hecho de conseguirlas haya reducido nuestra capacidad de investigar a su persona."
 gdp_merchant_unity_contract.1012.desc.result.outro.success: "Ojalá tengamos la misma suerte con el siguiente encargo."
 gdp_merchant_unity_contract.1012.desc.result.outro.failure: "Espero que lo hagamos mejor con el siguiente encargo."
 gdp_merchant_unity_contract.1012.desc.result.outro.reimburse: "[char_current.GetSheHe|U] no puede discutir con eso."
 gdp_merchant_unity_contract.1012.desc.result.outro.bribe: "Espero que mi bolsa sobreviva a nuestra próxima visita…"
 gdp_merchant_unity_contract.1012.a: "Ahora [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstNameNoTooltip|l]."
 gdp_merchant_unity_contract.1012.b: "Adelante, a ver [person_c.Custom('ES_AlAla')] [person_c.GetTitledFirstNameNoTooltip|l]."
 gdp_merchant_unity_contract.1012.c: "[person_c.Custom('ES_ElLa')|U] [person_d.GetTitledFirstNameNoTooltip|l] nos aguarda…"
 gdp_merchant_unity_contract.1012.d: "Acabemos con esto ya…"
 gdp_merchant_unity_contract.1012.tt.boilerplate.continue_investigation: "Sigues intentando dar garantías"
 gdp_merchant_unity_contract.1012.tt.boilerplate.end_investigation: "Decides cómo solucionar la situación"
 gdp_merchant_unity_contract.1021.t: "$unity_irregularities_contract$: resolución"
 gdp_merchant_unity_contract.1021.desc.intro: "Nos volvemos a reunir en la plaza de la ciudad, donde [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstName|l] ha convocado a los demandantes a la expectativa y a mi comerciante para oír mi opinión definitiva sobre el asunto.\n\n[person_c.GetFirstName] y [person_d.GetFirstName] me miran, mientras que [trader.GetFirstName] parece estar nervios[trader.Custom('ES_OA')], inquiet[trader.Custom('ES_OA')] ante la mirada de estas personas.\n\nEl instinto me dice que"
 gdp_merchant_unity_contract.1021.desc.assurances_given.three: "me he ganado el apoyo de los lugareños."
 gdp_merchant_unity_contract.1021.desc.assurances_given.two: "los lugareños parecen algo satisfechos con mis esfuerzos."
 gdp_merchant_unity_contract.1021.desc.assurances_given.one_or_less: "no me he ganado la confianza de los lugareños."
 gdp_merchant_unity_contract.1021.desc.body: "\n\n[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitleAsNameNoTooltip|l] bosteza, «Veamos, ¿qué pasa con"
 gdp_merchant_unity_contract.1021.desc.irregularity.missing: "esos envíos perdidos?»."
 gdp_merchant_unity_contract.1021.desc.irregularity.quality: "esos artículos de mala calidad?»."
 gdp_merchant_unity_contract.1021.desc.irregularity.dues: "esas obligaciones sin pagar?»."
 gdp_merchant_unity_contract.1021.tt.clue_total.exceptional_achievable: "#TUT Tras haber dado todas las garantías posibles, tus esfuerzos exagerados han bastado para forzar un $label_success_critical$ aunque no castigues [trader.Custom('ES_AlAla')] [trader.GetTitledFirstNameNoTooltip|l]#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.normal_achievable: "#TUT Con suficientes garantías, tus esfuerzos seguramente terminen en $label_success_standard$ aunque no castigues [trader.Custom('ES_AlAla')] [trader.GetTitledFirstNameNoTooltip|l]#!"
 gdp_merchant_unity_contract.1021.tt.clue_total.failure_possible: "#TUT Como las garantías no han sido suficientes, tus esfuerzos chapuceros pueden provocar resistencia si no castigas [trader.Custom('ES_AlAla')] [trader.GetTitledFirstNameNoTooltip|l]#!"
 gdp_merchant_unity_contract.1021.a: "«Como he explicado, solo se ha tratado de un malentendido lamentable»."
 gdp_merchant_unity_contract.1021.a.tt: "Consideras que tus garantías son suficientes"
 gdp_merchant_unity_contract.1021.a.tt.success_standard: "Si das demasiadas garantías"
 gdp_merchant_unity_contract.1021.a.tt.success_qualified: "Si das algunas garantías y los lugareños ceden"
 gdp_merchant_unity_contract.1021.a.tt.failure_standard: "Si no das garantías y los lugareños reaccionan mal"
 gdp_merchant_unity_contract.1021.b: "Pagaréis… la mitad."
 gdp_merchant_unity_contract.1021.b.tt: "Fallas a favor [local_ruler.Custom('ES_DelDela')] [local_ruler.GetTitledFirstName|l], pero, no obstante, reduces la carga fiscal sobre [trader.Custom('ES_ElLa')] [trader.GetTitledFirstName|l]"
 gdp_merchant_unity_contract.1021.c: "«Este asunto no son más que sandeces. ¡Calumnias y sandeces!»."
 gdp_merchant_unity_contract.1021.c.tt: "Niegas directamente transgresión alguna de la compañía"
 gdp_merchant_unity_contract.1021.d: "«[trader.Custom('ES_ElLa')|U] [trader.GetTitledFirstNameNoTooltip|l] es culpable y se le castigará»."
 gdp_merchant_unity_contract.1021.d.tt: "Sacrificas [trader.Custom('ES_AlAla')] [trader.GetTitledFirstNameNoTooltip|l] por la compañía"
 gdp_merchant_unity_contract.1022.t.success_critical: "$unity_irregularities_contract$: un simple malentendido"
 gdp_merchant_unity_contract.1022.t.success_standard: "$unity_irregularities_contract$: un asunto resuelto"
 gdp_merchant_unity_contract.1022.t.success_qualified_insufficient_assurances: "$unity_irregularities_contract$: un asunto no resuelto"
 gdp_merchant_unity_contract.1022.t.failure_standard: "$unity_irregularities_contract$: poco satisfactorio"
 gdp_merchant_unity_contract.1022.desc.success_critical: "Los lugareños se miran unos a otros entusiasmados, mientras [trader.GetFirstName] sonríe radiante. [local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstName|l] siente un claro alivio, así como cierta sorpresa. «Muy bien, ¡pues entonces el caso está cerrado!», vocifera.\n\nLos demandantes me agradecen extensamente la visita y se sosiegan. De un modo u otro, ahora en [destination.GetBaronyNameExplicitlyNoTooltip] se confía en la compañía #EMP más#! que nunca."
 gdp_merchant_unity_contract.1022.desc.success_standard: "Los lugareños se miran unos a otros, asienten lentamente mientras [trader.GetFirstName] sonríe. [local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstName] vacila, pero rápidamente sigue adelante. «Bien. En tal caso, el asunto queda cerrado», dice, casi preguntando.\n\nLos demandantes parecen bastante satisfechos mientras discuten los argumentos. Parece que la reputación de la compañía en [destination.GetBaronyNameExplicitlyNoTooltip] está a salvo, por ahora."
 gdp_merchant_unity_contract.1022.desc.success_qualified_insufficient_evidence: "Durante un instante, breve pero tenso, parece que [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstName|l] y sus lacayos van a protestar contra mi débil conclusión, pero el momento pasa en silencio rápidamente.\n\n«Está bien…», [local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitleAsNameNoTooltip|l] suspira, mientras se fija en los demandantes insatisfechos. «Aseguraos de que no vuelva a pasar nada parecido».\n\nEstá claro que los lugareños tienen sus dudas, pero eso es problema de [trader.GetFirstName]."
 gdp_merchant_unity_contract.1022.desc.failure_standard: "El silencio cae sobre la plaza.\n\nUn silencio tenso e incómodo, mientras los lugareños se miran entre ellos, el disgusto retuerce sus bocas hasta que casi gruñen.\n\n[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstName|l] masculla «¿Y ya está?», con el apoyo furioso de los demandantes.\n\n[trader.GetFirstName] traga con dificultad y rompe el silencio. «Lamento mucho las molestias», ofrece. «Pero no se puede hacer más; estas cosas… pasan»."
 gdp_merchant_unity_contract.1022.a: "No podría haber salido mejor."
 gdp_merchant_unity_contract.1022.b: "Bien está lo que bien acaba…"
 gdp_merchant_unity_contract.1022.c: "Bueno, podría haber salido mejor."
 gdp_merchant_unity_contract.1022.d: "Ah… Hora de irse."
 gdp_merchant_unity_contract.1023.t: "$unity_irregularities_contract$: negación"
 gdp_merchant_unity_contract.1023.desc: "Los demandantes quedan atónitos, eso es obvio por sus furiosos cuchicheos. [local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitleAsName|l] no tiene claro cómo proceder.\n\nLa sorpresa de [trader.GetFirstName] se convierte en un orgullo reforzado mientras continúo: «No permitiré que se manche la reputación de mi compañía por semejantes nimiedades».\n\nSigo altaner[ROOT.Char.Custom('ES_OA')]: «Me habéis hecho perder el tiempo aquí, ¡cuando tengo asuntos urgentes en [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!»."
 gdp_merchant_unity_contract.1023.a: "Hora de irse."
 gdp_merchant_unity_contract.1024.t: "$unity_irregularities_contract$: a los perros"
 gdp_merchant_unity_contract.1024.desc: "Un coro de vítores estalla entre los demandantes y [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstName|l] llama a los guardias de la ciudad para que pongan grilletes [trader.Custom('ES_AlAla')] atónit[trader.Custom('ES_OA')] [trader.GetFirstName].\n\n«¡Pe- pero, [ROOT.Char.GetTitleAsNameNoTooltip|l]!», croa mi comerciante. Le digo adiós lánguidamente con la mano, «Buen viaje; en el fondo era un[trader.Custom('ES_XA')] comerciante pésim[trader.Custom('ES_OA')]…»."
 gdp_merchant_unity_contract.1024.a: "Un sacrificio necesario."
 gdp_merchant_unity_contract.1031.t: "$unity_irregularities_contract$: una visión inspiradora"
 gdp_merchant_unity_contract.1031.desc: "«¿[ROOT.Char.GetTitledFirstNameNoTooltip]?».\n\nLevanto la vista de mis libros de cuentas para ver a… ¿un[hopeful.Custom('ES_XA')] [hopeful.GetWomanMan] de etnia [hopeful.GetCulture.GetName]? ¿De qué [hopeful.GetHerHim] conoceré…?\n\n«[ROOT.Char.GetTitleAsNameNoTooltip], soy [hopeful.Custom('ES_ElLa')] [hopeful.GetTitledFirstName|l]. Resolvisteis un malentendido en mi ciudad natal, [destination_1.GetBaseNameNoTier], hace años y creo que lo hicisteis con dignidad y aplomo».\n\n«En todo caso, mi negocio se vino abajo hace mucho y me encuentro buscando empleo. Se me ocurrió que vos… podríais tener algo…»."
 gdp_merchant_unity_contract.1031.a: "¡Sea, bienvenid[hopeful.Custom('ES_OA')] a bordo!"
 gdp_merchant_unity_contract.1031.b: "A la compañía no le servís para nada."
