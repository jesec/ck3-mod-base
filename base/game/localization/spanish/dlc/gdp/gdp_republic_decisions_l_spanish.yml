l_spanish:
 gdp_adopt_republic_government_decision: "Adoptar ideales republicanos"
 gdp_adopt_republic_government_decision_desc: "Observo a la multitud vagar por la calle, agotados por el esfuerzo diario. Hace que me pregunte si nuestro sistema [ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l] es realmente el único camino que puede seguir un gobernante. ¿Podría ganarme la lealtad por merecida aprobación en lugar de simplemente por mi derecho de nacimiento? Quizá sea hora de abrazar nuevos ideales y replantearnos nuestro estilo de vida."
 gdp_adopt_republic_government_decision_tooltip: "Adoptar ideales republicanos y convertirse en [GetGovernment('republic_government').GetName|l]"
 gdp_adopt_republic_government_decision_confirm: "Adoptar ideales republicanos"
 liege_has_granted_city_charter: "Tu [liege|El] te ha otorgado un privilegio de ciudad"
 liege_has_granted_city_charter_duration: "Tu [liege|El] te ha otorgado un privilegio de ciudad #weak (hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( founding_ruler.MakeScope, 'has_liege_permission_to_found_republic') )])#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X Ya no serás [elector|El] en el [GetTitleByKey('e_hre').GetName]#!"
 gdp_adopt_republican_ways_decision: "Adoptar costumbres republicanas"
 gdp_adopt_republican_ways_decision_desc: "Las reuniones que antaño nos unieron ahora sufren bajo el peso de mercados y murallas. Si [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] quiere prosperar, debemos dejar a un lado las antiguas costumbres tribales y dejar que la ciudad se gobierne como una república."
 gdp_adopt_republican_ways_decision_tooltip: "Dejar atrás las costumbres [Concept('tribal', 'tribales')|E] y convertirse en una [republic|El]"
 gdp_adopt_republican_ways_decision_confirm: "Adoptar costumbres republicanas"
 gdp_tribal_capital_becomes_city_tt: "Tu [realm_capital|El] será una [city_holding|El]"
 gdp_other_tribal_holdings_become_castles_tt: "Todas las demás [tribal_holdings|El] del señorío se convertirán en [castle_holdings|El]"
 gdp_tribal_vassals_will_feudalize_tt: "Tus [vassals|El] [Concept('tribal', 'tribales')|E] adoptarán el [government|El] [feudal|El] o de [clan|El]"
 convert_to_feudalism_from_republic_decision: "Adoptar el método [ROOT.Char.Custom('GetTribalReformGovernment')]"
 convert_to_feudalism_from_republic_decision_desc: "Las asambleas, los procesos y la burocracia ralentizan la efectividad de nuestro gobierno. Si [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ha de prosperar, debemos librarnos de estas cargas."
 convert_to_feudalism_from_republic_decision_confirm: "Adoptar el método [ROOT.Char.Custom('GetTribalReformGovernment')]"
 convert_to_feudalism_from_republic_decision_tooltip: "Cambiar tipo de [government|El]"
 patricians_becomes_merchants_desc: "[vassals|E] [Concept('patrician','patricios')|E]se vuelven [merchants|El]"
 gdp_restore_roman_republic_decision: "Restaurar la República romana"
 gdp_restore_roman_republic_decision_desc: "La República romana fue un faro de libertad y prosperidad, un modelo que todos deberían seguir. Y, sin embargo, ahora es una ruina, como tantas cosas de este mundo. ¡Es hora de devolverla a la vida y restaurar su gloria!"
 gdp_restore_roman_republic_decision_tooltip: "Restaurar la República romana"
 gdp_restore_roman_republic_decision_confirm: "Restaurar la República romana"
 restore_roman_republic_make_rome_capital_desc: "Puedes elegir hacer de [GetTitleByKey('c_roma_urbs').GetName] la [realm_capital|El]"
 assembly_members_appointed_as_senators_desc: "Todos los miembros de la [assembly|El] serán nombrados [republic_senators|El]"
 gdp_popular_mandate_decision: "Llamar al apoyo popular"
 gdp_popular_mandate_decision_desc: "El pueblo de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] me adora. Podría usar esa buena voluntad ahora para agruparlos en torno a la continuidad de mi puesto. La voz de las masas tiene peso en la asamblea y un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] que tenga a la gente de su parte cuenta con una baza más fuerte a la hora de contar los votos.\n\nEse favor tendrá un coste, pero las votaciones se ganan hoy, no mañana."
 gdp_popular_mandate_decision_tooltip: "Gasta [popular_opinion|El] en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para ganar un voto extra en la próxima [election|El]"
 gdp_popular_mandate_decision_confirm: "Agrupar a la gente a mi alrededor"
 gdp_popular_mandate_no_active_mandate_desc: "No tiene apoyo popular"
 gdp_civic_labor_decision: "Dirigir un trabajo cívico"
 gdp_civic_labor_decision_desc: "La buena voluntad de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] es un recurso igual que el oro. Convocaré a los ciudadanos para que me cedan su esfuerzo y pericia para mis trabajos de construcción a cambio de gastar algo de esa buena voluntad."
 gdp_civic_labor_decision_tooltip: "Gasta [popular_opinion|El] en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para ganar bonificaciones para la construcción del domicilio [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 gdp_civic_labor_decision_confirm: "Convocar a los ciudadanos"
 gdp_popular_gifts_decision: "Solicitar patrocinio"
 gdp_popular_gifts_decision_desc: "Mi posición entre las gentes de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] me da ventaja. Dejaré que se sepa que [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetTitleAsNameNoTooltip|l] recibe ofertas de grandes casas patricias y competirán para superarse entre ellas. Sea como sea, el palacio gana."
 gdp_popular_gifts_decision_tooltip: "Gasta [popular_opinion|El] para presionar a las familias patricias ricas para que compitan por tu favor; así ganarás [gold|El] y regalos para el palacio"
 gdp_popular_gifts_decision_confirm: "Abrir las ofertas"
 gdp_popular_gifts_artifact_tt: "Recibes un [artifact|El] de regalo al azar"
 gdp_glorification_decision: "Aceptar exaltación"
 gdp_glorification_decision_desc: "El pueblo de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] me tiene en una consideración que va más allá de la política o la popularidad. No desean rendirme honores como a su líder, sino como a la ciudad hecha carne. Aceptaré este momento por lo que es."
 gdp_glorification_decision_tooltip: "Aceptar la exaltación de la ciudad. Un honor único en la vida."
 gdp_glorification_decision_confirm: "Que festejen"
 gdp_glorification_artifact_tt: "Recibes el [artifact|El] #V $gdp_glorification_artifact_name$#!"
 gdp_glorification_artifact_name: "Medallón de la gloria cívica"
 gdp_glorification_artifact_desc: "Un medallón conmemorativo obsequiado por los ciudadanos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] en honor de su amad[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitleAsNameNoTooltip|l]."
 gdp_popular_mandate_decision_toast: "Apoyo popular conseguido"
 gdp_civic_labor_decision_toast: "Esfuerzo cívico movilizado"
 gdp_popular_gifts_decision_toast: "Los patricios responden a la llamada"
 gdp_glorification_decision_toast: "La ciudad festeja"
 gdp_fund_alms_decree_decision: "Dar limosna en la capital"
 gdp_fund_alms_decree_decision_desc: "Como [ROOT.Char.GetTitleAsNameNoTooltip|l], tengo la responsabilidad de garantizar que los ciudadanos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] dispongan de todo lo que precisen. Hay muchos motivos para dar limosna: para ayudar a los más desfavorecidos, para contribuir a la prosperidad de la ciudad y para fortalecer los vínculos que mantienen unida a nuestra sociedad.\n\nSea cual sea el motivo, proveer a los pobres es una manera fiable de ganarse el favor de las masas."
 gdp_fund_alms_decree_decision_tooltip: "Dar limosna a los pobres en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 gdp_fund_alms_decree_decision_confirm: "Dar limosna"
 gdp_tax_holiday_decree_decision: "Reducción de impuestos"
 gdp_tax_holiday_decree_decision_desc: "En los años venideros, se reducirán los impuestos recaudados en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. La tesorería cubrirá el coste, pero la buena voluntad del pueblo merece pagar ese precio."
 gdp_tax_holiday_decree_decision_tooltip: "Reduce los impuestos urbanos en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para aumentar la [popular_opinion|El]"
 gdp_tax_holiday_decree_decision_confirm: "Condonar los impuestos de la ciudad"
 gdp_debt_forgiveness_decree_decision: "Perdón de deudas"
 gdp_debt_forgiveness_decree_decision_desc: "Muchos ciudadanos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] cargan con deudas que no pueden devolver. Al cancelar lo que adeudan a la ciudad, les ofrecemos un alivio y nos ganamos su lealtad a cambio. No todo el mundo aprobará este uso del tesoro, pero el gobernante que tiene al pueblo de su parte se alza sobre terreno firme."
 gdp_debt_forgiveness_decree_decision_tooltip: "Cancela las deudas ciudadanas en [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] para obtener un impulso significativo de la [popular_opinion|El]"
 gdp_debt_forgiveness_decree_decision_confirm: "Cancelar las deudas"
 gdp_debt_forgiveness_upset_patricians_tt: "Todo [vassal|El] sin la [house_ambition|El] [GetHouseAspiration( 'republic_communal' ).GetName|V]"
 gdp_debt_forgiveness_pleased_patricians_tt: "Todo [vassal|El] con la [house_ambition|El] [GetHouseAspiration( 'republic_communal' ).GetName|V]"
 gdp_finance_war_decree_decision: "Financiar esfuerzo de guerra"
 gdp_finance_war_decree_decision_desc: "La guerra es un asunto horrible, y por encima de todo, #EMP caro#!. Si fuera necesario, podemos recaudar impuestos de guerra adicionales para asegurar fondos para el esfuerzo de guerra."
 gdp_finance_war_decree_decision_tooltip: "Recaudar impuestos extras para financiar las guerras en curso"
 gdp_finance_war_decree_decision_confirm: "Recaudar impuesto de guerra"
