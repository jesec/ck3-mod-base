 gdp_war_approval_decree_decision: "Solicitar aprobación para guerra"
 gdp_war_approval_decree_decision_desc: "Solo podremos declarar la [war|El] por voluntad de la asamblea. Puede que sea necesario untar unas cuantas manos para asegurarnos los votos, pero es por el bien mayor."
 gdp_war_approval_decree_decision_tooltip: "Solicitar permiso a la [assembly|El] para declarar la [war|El]"
