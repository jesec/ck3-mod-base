 gdp_overthrow_government_decision: "Derrocar gobierno"
 gdp_overthrow_government_decision_desc: "El liderazgo de esta república está podrido hasta el corazón. Ha llegado la hora de tomar el timón de la nave del Estado y destronar a los corruptos y débiles para que la virtud republicana gobierne de nuevo [ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nEncontraré partidarios y juntos derrocaremos al gobierno de [ROOT.Char.GetLiege.GetNameNoTooltip]."
 gdp_overthrow_government_decision_tooltip: "Derroca al gobierno actual de la [republic|El] y sitúate como su gobernante"
 gdp_overthrow_government_decision_confirm: "¡Salvadnos de los tiranos!"
 you_are_patrician_desc: "Eres un [patrician|El] sin tierras."
 overthrow_government_effect_tooltip: "#WEAK Esta decisión comenzará una [hostile_scheme|El] para derrocar el gobierno.#!\n$EFFECT_LIST_BULLET$ Puedes convertirte en el nuevo [liege|El]\n$EFFECT_LIST_BULLET$ Tus [rivals|El] o enemigos políticos pueden abandonar la [republic|El]\n$EFFECT_LIST_BULLET$ Las leyes de la república cambiarán para ajustarse a las ambiciones de tu casa sin la aprobación de la [assembly|El]\n@alert_icon! #alert_trial Conspirar contra el Estado es un [crime|El] grave, si se descubre#!"
 gdp_overthrow_agent_focus_balance: "Disposición de [agent|El] equilibrada"
 gdp_overthrow_agent_focus_success: "Centrarse en [agents|El] que aumenten el [scheme_potential|El]"
 gdp_overthrow_agent_focus_speed: "Centrarse en [agents|El] que reduzcan la [scheme_speed|El]"
 gdp_overthrow_agent_focus_secrecy: "Centrarse en [agents|El] que aumenten el [secrecy|El]"
