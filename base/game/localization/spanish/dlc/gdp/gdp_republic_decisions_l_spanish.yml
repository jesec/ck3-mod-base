 DECREE_PLAGUE_APOCALYPTIC_DESC: "Un brote de [epidemic|El] apocalíptico en el [realm|El]"
 DECREE_PLAGUE_MAJOR_DESC: "Un brote de [epidemic|El] importante en el [realm|El]"
