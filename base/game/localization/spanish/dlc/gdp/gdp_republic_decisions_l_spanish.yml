 gained_assembly_approval_banishment_desc: "Ya has obtenido la aprobación de la [assembly|El] para [banish|El] a [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName]"
 gdp_proscription_approval_decree_decision: "Solicitar aprobación para proscripción"
 gdp_proscription_approval_decree_decision_named: "Solicitar la proscripción de la familia [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip]"
 gdp_proscription_approval_decree_decision_desc: "La sangre es delatora: los parientes de un traidor comparten su mancha y portan la misma maldad en sus pérfidos corazones. Si la asamblea consiente, podremos [banish|El] a toda su familia y librarnos de un linaje abyecto."
 gdp_proscription_approval_decree_decision_tooltip: "Solicita permiso a la [assembly|El] para [banish|El] a la familia entera del personaje al que has acusado"
 gdp_proscription_approval_decree_decision_confirm: "Solicitar aprobación para proscripción"
 gdp_proscription_approval_decree_decision_effect_desc: "Obtienes permiso para [banish|El] a toda la familia de [indicted_character.GetShortUIName]"
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "Obtienes permiso para [banish|El] a toda la familia de un personaje al que has acusado"
