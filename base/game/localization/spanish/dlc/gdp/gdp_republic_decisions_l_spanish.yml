 agent_focus_secrecy_tooltip: "$overthrow_government_interaction.tt.agent_focus_secrecy$"
 gdp_quarantine_ship_decree_decision: "Cuarentena treintena"
 gdp_quarantine_ship_decree_decision_desc: "#bold Por voluntad de la asamblea:#!\nSe impone una cuarentena de treinta días para detener la propagación de los vapores dañinos que desembocan en la peste y otras dolencias."
 gdp_quarantine_ship_decree_decision_tooltip: "Impone una cuarentena a los barcos que entren en el puerto para aumentar la [epidemic_resistance|El], pero a costa de [competitiveness|El] para todas las [trade_routes|El] conectadas con el [trade_market|El] de la [capital|El]"
 gdp_quarantine_ship_decree_decision_confirm: "Impuesta una cuarentena treintena"
