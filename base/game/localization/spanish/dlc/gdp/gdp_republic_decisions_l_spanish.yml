 gdp_execution_approval_decree_decision: "Solicitar aprobación de ejecución"
 gdp_execution_approval_decree_decision_named: "Solicitar la ejecución de [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_execution_approval_decree_decision_desc: "A pesar de la benevolencia de nuestro gobierno, sigue habiendo quienes amenazarían sus mismos cimientos. Tal es el riesgo que suponen que no podremos descansar mientras sigan respirando; con la aprobación de la asamblea, podremos [Concept('execute', 'ejecutarlos')|E] y tranquilizar los corazones de nuestro pueblo."
 gdp_execution_approval_decree_decision_tooltip: "Solicita permiso a la [assembly|El] para [Concept('execute', 'ejecutar')|E] al personaje al que has acusado"
