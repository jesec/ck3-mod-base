 gdp_banishment_approval_decree_decision: "Solicitar aprobación de destierro"
 gdp_banishment_approval_decree_decision_named: "Solicitar el destierro de [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat]"
 gdp_banishment_approval_decree_decision_desc: "Hay entre nosotros aquellos que no se someten a nuestras normas y a los que estas ya no pueden someter. Con la aprobación de la asamblea, los [Concept('banish', 'desterraremos')|E] de nuestro señorío y así extirpamos un elemento peligroso sin el riesgo de la enemistad a muerte que acarrearía un final más permanente"
 gdp_banishment_approval_decree_decision_tooltip: "Solicita permiso a la [assembly|El] para [banish|El] al personaje al que has acusado"
 gdp_banishment_approval_decree_decision_confirm: "Solicitar aprobación de destierro"
 gdp_banishment_approval_decree_decision_effect_desc: "Obtienes permiso para [banish|El] a [indicted_character.GetShortUIName]"
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "Obtienes permiso para [banish|El] a un personaje al que has acusado"
