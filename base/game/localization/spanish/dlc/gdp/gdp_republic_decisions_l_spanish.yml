 DECREE_PLAGUE_NONE_DESC: "No hay ningún brote de [epidemic|El] en el [realm|El]"
 gdp_enforce_curfew_decree_decision: "Toque de queda nocturno"
 gdp_enforce_curfew_decree_decision_desc: "#bold Por voluntad de la asamblea:#!\nPor la presente se impone y se aplicará un toque de queda estricto para reducir las actividades criminales durante las horas de la noche."
 gdp_enforce_curfew_decree_decision_tooltip: "Se ha impuesto un toque de queda nocturno para restringir el comportamiento ilícito y frustrar las conjuras criminales"
 gdp_enforce_curfew_decree_decision_confirm: "Impuesto un toque de queda nocturno"
 gdp_enforce_curfew_decree_decision_effect_desc: "El toque de queda nocturno reducirá la efectividad de toda [hostile_scheme|El] y aumentará el [control|El]"
 gdp_republic_curfew_desc: "Todos los [vassals|El] de la [capital|El]"
 gdp_sponsor_craft_guild_decision: "Patrocinar gremio artesano"
 gdp_sponsor_craft_guild_decision_desc: "En una república, ser reconocido como gremio artesano ofrece muchos beneficios; por lo tanto, los artesanos de muchas profesiones buscan que la asamblea redacte y apruebe un privilegio oficial para ellos. Patrocinarlos en este proyecto no solo es bueno para la ciudad, sino que además, el patricio que presente el proyecto ante la asamblea será considerado el patrón del nuevo gremio."
 gdp_sponsor_craft_guild_decision_tooltip: "Patrocinar un gremio artesano aumentará el [prosperity_growth|El] y el [urban_tax|El] en el [county|El] de la [capital|El] y aumentará el crecimiento de la [trade_competitiveness|El] y la [trade_expertise|El] de tu [house|El]"
 gdp_sponsor_craft_guild_decision_confirm: "Patrocinar un nuevo gremio artesano"
 gdp_request_noble_magistracy_decision: "Solicitar magistratura noble"
 gdp_request_noble_magistracy_decision_desc: "Si bien aquellos de posición patricia están excluidos de la mayoría de los puestos de funcionarios, hay cargos reservados a los magistrados nobles; un trabajo perfecto para que un patricio joven y ambicioso aprenda los mecanismos del Estado y se gane cierta reputación."
 gdp_request_noble_magistracy_decision_tooltip: "La magistratura noble aumentará la ganancia de [dynasty_prestige|El], de [lifestyle_experience|El] y la [opinion|El] de tu [heir|El] y aumentará su [stress_gain|El]"
 gdp_request_noble_magistracy_decision_confirm: "Solicitar una magistratura noble para tu heredero"
 gdp_request_relief_from_bankruptcy_decision: "Solicitar rescate de la bancarrota"
 gdp_request_relief_from_bankruptcy_decision_desc: "Para aseguramos de que familias prominentes no caigan en la miseria, la asamblea puede usar las arcas de la república para pagar deudas y a acreedores; es dar al patricio arruinado una oportunidad para recuperarse del filo de la bancarrota."
 gdp_request_relief_from_bankruptcy_decision_tooltip: "El rescate de la bancarrota saldará tus deudas de [gold|El] con el [treasury|El] de la [republic|El]"
 gdp_request_relief_from_bankruptcy_decision_confirm: "Solicitar rescate de la bancarrota"
 gdp_petition_for_state_protection_decision: "Solicitar protección del Estado"
 gdp_petition_for_state_protection_decision_desc: "El Estado puede extender un elevado grado de protección a quienes son dignos de ella."
 gdp_petition_for_state_protection_decision_tooltip: "La protección del Estado reducirá mucho la efectividad de una [hostile_scheme|El] contra el personaje protegido."
