l_spanish:
 gdp_merchant_scheme_advantage.1000.t: "[task_contract.GetType.GetName]: presionar para obtener ventaja"
 gdp_merchant_scheme_advantage.1000.intro: "Reflexionando sobre cómo acelerar nuestros negocios aquí en [task_contract_location.GetBaronyNameExplicitly], me fijo en"
 gdp_merchant_scheme_advantage.1000.intro.rival: "cómo la presencia de nuestr[rival.Custom('ES_OA')] rival, [rival.Custom('ES_ElLa')] [rival.GetTitledFirstName|l], nos obstaculiza."
 gdp_merchant_scheme_advantage.1000.intro.partner: "mi soci[portrait.Custom('ES_OA')], [portrait.Custom('ES_ElLa')] [portrait.GetTitledFirstName|l], en busca de soluciones."
 gdp_merchant_scheme_advantage.1000.intro.agent: "mi asociad[portrait.Custom('ES_OA')], [portrait.Custom('ES_ElLa')] [portrait.GetTitledFirstName|l], en busca de soluciones."
 gdp_merchant_scheme_advantage.1000.intro.trader: "mi comerciante, [portrait.Custom('ES_ElLa')] [portrait.GetTitledFirstName|l], en busca de soluciones."
 gdp_merchant_scheme_advantage.1000.desc.associate: "\n\nSi [portrait.Custom('ES_ElLa')] [portrait.GetTitledFirstNameNoTooltip|l] se lo tomase en serio y dedicase toda su atención al asunto, seguro que podríamos superar esto en un abrir y cerrar de ojos…"
 gdp_merchant_scheme_advantage.1000.desc.unity: "\n\nSi la compañía actuase unida y se pusiera manos a la obra, seguro que podríamos superar esto en un abrir y cerrar de ojos…"
 gdp_merchant_scheme_advantage.1000.desc.stress: "\n\nA lo mejor, por el bien de la compañía, debería arrimar el hombro e intentar hacer algo de trabajo, para pasar a otros asuntos…"
 gdp_merchant_scheme_advantage.1000.a: "«¡¿Para qué os pago, [portrait.GetTitledFirstNameNoTooltip|l]?!»."
 gdp_merchant_scheme_advantage.1000.a.flavor: "[portrait.Custom('ES_ElLa')|U] [portrait.GetTitledFirstNameNoTooltip|l] [associate_i|E] asume la carga"
 gdp_merchant_scheme_advantage.1000.b: "«¡La compañía entera tiene que espabilar de una vez!»."
 gdp_merchant_scheme_advantage.1000.b.flavor: "[company_sentiment_i|E] La [company|El] está agobiada"
 gdp_merchant_scheme_advantage.1000.c: "«Está bien, ¡tendré que hacerlo yo!»."
 gdp_merchant_scheme_advantage.1000.c.flavor: "Tú asumes la carga [stress_i|E]"
 gdp_merchant_scheme_advantage.1000.d.associate: "«Vamos, seguro que [portrait.Custom('ES_ElLa')|U] [portrait.GetTitledFirstNameNoTooltip|l] puede hacer más»."
 gdp_merchant_scheme_advantage.1000.d.unity: "«¡Esta compañía está llena de holgazanes!»."
 gdp_merchant_scheme_advantage.1000.d.stress: "«Solo tengo que trabajar un poco más…»."
 gdp_merchant_scheme_advantage.1000.e: "«Ah, olvidadlo…»."
 gdp_merchant_scheme_advantage.1010.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1010.intro: "[trader.GetFirstName] y yo nos sentamos todos los días y debatimos el mejor modo de hacer realidad nuestras metas. Mi comerciante saca a colación una y otra vez nuestra falta de mano de obra de confianza en [task_contract_location.GetBaronyNameExplicitly].\n\n«¿Sabéis?», suspira [trader.GetFirstNameNoTooltip], «Hay un[recruit.Custom('ES_XA')] [recruit.GetWomanMan] que nos podría ayudar."
 gdp_merchant_scheme_advantage.1010.desc.liege: "Se llama [recruit.GetFirstName], es lacay[recruit.Custom('ES_OA')] [recruit_liege.Custom('ES_DelDela')] [recruit_liege.GetTitledFirstName|l] de [recruit_liege.GetPrimaryTitle.GetDefinitiveName|l]…»."
 gdp_merchant_scheme_advantage.1010.desc.recruit: "Se llama [recruit.GetFirstName], es un[recruit.Custom('ES_XA')] agente local y facilitador[recruit.Custom('ES_XA')] del mercado…»."
 gdp_merchant_scheme_advantage.1010.a: "«Dejadme hablar con [recruit.GetSheHe]…\""
 gdp_merchant_scheme_advantage.1010.a.flavor: "@skill_diplomacy_icon! Confías en tus encantos"
 gdp_merchant_scheme_advantage.1010.b: "«Traed[recruit.GetHerHim], cueste lo que cueste»."
 gdp_merchant_scheme_advantage.1010.b.flavor: "@gold_icon! Confías en el vil metal"
 gdp_merchant_scheme_advantage.1010.e: "«Bah, no merece la pena los problemas»."
 gdp_merchant_scheme_advantage.1020.t: "$gdp_merchant_scheme_advantage.1000.t$"
 gdp_merchant_scheme_advantage.1020.desc: "[trader.GetFirstName] y yo nos sentamos todos los días y debatimos el mejor modo de hacer realidad nuestras metas. Al final, mi comerciante acaba por mencionar el tema de nuestro privilegio de [charter.GetName] y cómo se podría usar para abrir puertas que ahora mismo tenemos cerradas en [task_contract_location.GetBaronyNameExplicitly].\n\n«Después de todo», sonríe [trader.GetFirstNameNoTooltip], «¿Por qué no dar un buen uso al papel [patron.Custom('ES_DelDela')] [patron.GetTitledFirstName|l]?»."
 gdp_merchant_scheme_advantage.1020.a: "«Sí, seguro que tenemos el apoyo [patron.Custom('ES_DelDela')] [patron.GetTitleAsNameNoTooltip|l]!»."
 gdp_merchant_scheme_advantage.1020.b: "«Desde luego, nuestro privilegio habla por sí mismo»."
 gdp_merchant_scheme_advantage.1020.e: "«Este no es el momento…»."
 gdp_merchant_scheme_advantage_success_chance_potential_modifier: "Ventajas impulsadas: potencial"
 gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc: "Los intentos de acelerar esta conjura solo han obstaculizado su progreso."
 gdp_merchant_scheme_advantage_success_chance_growth_modifier: "Ventajas impulsadas: crecimiento"
 gdp_merchant_scheme_advantage_success_chance_growth_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_success_chance_length_modifier: "Ventajas impulsadas: fase"
 gdp_merchant_scheme_advantage_success_chance_length_modifier_desc: "$gdp_merchant_scheme_advantage_success_chance_potential_modifier_desc$"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier: "Ventajas impulsadas: competitividad"
 gdp_merchant_scheme_advantage_market_competitiveness_modifier_desc: "Los intentos de acelerar esta conjura han obstaculizado los esfuerzos comerciales."
 gdp_merchant_scheme_advantage_outcome: "Presionar para obtener ventajas"
 gdp_merchant_scheme_advantage.desc: "presión por la [opportunity|El] de tener [opportunities|El] de [scheme|El]"
 gdp_merchant_scheme_advantage_add_1_opportunity_tt: "La [scheme|El] gana #P +1#! [scheme_opportunity_opportunity|El] [scheme_opportunity_i|E]"
