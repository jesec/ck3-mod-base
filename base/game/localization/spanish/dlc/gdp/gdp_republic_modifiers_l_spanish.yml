 gdp_republic_disgraced_patrician_house_modifier_desc: "Esta casa llevó a la república a la ruina y fue expulsada en deshonor. Su nombre tiene poca relevancia en los mercados y pocos siguen hablando bien de ellos."
 gdp_republic_unrest_guild_district_shutdown: "Distrito de gremios: cerrado"
 gdp_republic_unrest_guild_district_shutdown_desc: "Los gremios artesanos han cerrado sus puertas. Artesanías y talleres se han detenido."
 gdp_republic_unrest_market_district_shutdown: "Distrito del mercado: cerrado"
 gdp_republic_unrest_market_district_shutdown_desc: "El distrito del mercado está cerrado y vacío. El comercio y las transacciones de la ciudad se han detenido."
 gdp_republic_unrest_port_district_shutdown: "Distrito del puerto: cerrado"
 gdp_republic_unrest_port_district_shutdown_desc: "El puerto ha quedado cerrado por la autoridad civil. Los ingresos marítimos se han secado."
 gdp_republic_unrest_bureaucratic_district_shutdown: "Distrito burocrático: cerrado"
 gdp_republic_unrest_bureaucratic_district_shutdown_desc: "El distrito administrativo ha quedado en silencio. Los ingresos cívicos no se recaudan."
 gdp_republic_unrest_temple_district_shutdown: "Distrito de enclave religioso: cerrado"
 gdp_republic_unrest_temple_district_shutdown_desc: "El distrito del enclave religioso ha retirado su cooperación. Las donaciones piadosas han dejado de llegar a la tesorería."
 gdp_republic_unrest_entertainment_district_shutdown: "Distrito de entretenimiento: cerrado"
 gdp_republic_unrest_entertainment_district_shutdown_desc: "El barrio del entretenimiento ha quedado a oscuras y vacío. Los ingresos urbanos han acusado el golpe."
 gdp_republic_unrest_urban_housing_district_shutdown: "Distrito de vivienda: cerrado"
 gdp_republic_unrest_urban_housing_district_shutdown_desc: "Un barrio residencial entero se ha cerrado. La recaudación de impuestos urbanos se ha venido abajo."
 gdp_republic_riot_aftermath: "Secuelas de la revuelta"
 gdp_republic_riot_aftermath_desc: "Calles quemadas, graneros saqueados y el tejido social desgarrado. La recuperación será lenta."
 gdp_republic_uprising_aftermath: "Secuelas del alzamiento"
 gdp_republic_uprising_aftermath_desc: "Los descontrolados arrasaron la ciudad. El orden no regresará pronto."
 gdp_sponsored_guild_modifier: "Gremio artesano patrocinado"
