 gdp_republic_bureaucrat_modifier: "Burócrata republicano"
 gdp_republic_bureaucrat_modifier_desc: "Este personaje ha mostrado hace poco gran capacidad en el proceso legislativo, gestionando el papeleo con la máxima eficiencia.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_patrician_rating_bonus_value')|0=+]\nAprobación de la [assembly|El] en [voting_sessions|El]: [EmptyScope.ScriptValue('gdp_republic_bureaucrat_assembly_approval_bonus_value')|0=+]"
 gdp_republic_law_maker_modifier: "Legislador"
 gdp_republic_law_maker_modifier_desc: "Este personaje, ya sea mediante astutas maniobras o tirando de hilos, ha conseguido garantizar la aprobación de la asamblea para su propuesta de ley.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_republic_law_maker_patrician_rating_bonus_value')|0=+]"
 gdp_dominate_market_trade_post_modifier: "Puestos comerciales influyentes"
 gdp_dominate_market_trade_post_modifier_desc: "Este mercado se ve muy influido por los puestos comerciales de un patricio."
 gdp_trade_post_charity_modifier: "Evento caritativo celebrado"
 gdp_trade_post_charity_modifier_desc: "Este personaje celebró un evento caritativo para el pueblo llano, para beneficio de los enfermos, los pobres y los necesitados."
 gdp_gather_popular_support_modifier: "Popular entre el pueblo"
 gdp_gather_popular_support_modifier_desc: "Este personaje ha ganado apoyos entre la gente de la ciudad, lo que hace que su nombre sea conocido y su voz sea oída."
