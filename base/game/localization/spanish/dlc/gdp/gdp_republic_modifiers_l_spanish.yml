 gdp_gather_popular_support_house_t2_modifier: "Familia fuerte del pueblo"
 gdp_gather_popular_support_house_t2_modifier_desc: "Esta casa tiene un fuerte apoyo de la gente de la ciudad.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_patrician_rating_bonus_value')|0=+]\nPuntuación de apoyo a [GetLaw('republican_elective_succession_law').GetName|l] de miembros de la [house|El]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t2_elective_bonus_value')|0=+]"
 gdp_gather_popular_support_house_t1_modifier: "Familia del pueblo"
 gdp_gather_popular_support_house_t1_modifier_desc: "Esta casa tiene apoyo de la gente de la ciudad.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_patrician_rating_bonus_value')|0=+]\nPuntuación de apoyo a [GetLaw('republican_elective_succession_law').GetName|l] de miembros de la [house|El]: [EmptyScope.ScriptValue('gdp_gather_popular_support_house_t1_elective_bonus_value')|0=+]"
 gdp_signorial_execute_and_banish_modifier: "Alcalde déspota"
 gdp_signorial_execute_and_banish_modifier_desc: "Este personaje ha ejecutado y desterrado a ciudadanos de la república, y ambiciona más aún."
 gdp_ambition_promote_scheme_bonus_modifier: "Patricios promovidos"
 gdp_ambition_promote_scheme_bonus_modifier_desc: "Este personaje ha dedicado tiempo y esfuerzo a mejorar la reputación de otro patricio, con lo que se ha ganado su buena voluntad.\n[patrician_rating|E]: [EmptyScope.ScriptValue('gdp_ambition_promote_scheme_bonus_value')|0=+] #weak (el estatus no se acumula)#!"
 gdp_noble_magistrate_modifier: "Puesto de magistrado noble"
 gdp_noble_magistrate_modifier_desc: "A este personaje se le ha dado una magistratura noble menor para que sirva a la república con integridad y honor en calidad oficial."
 gdp_republic_plaza_prestige_modifier: "Plaza prestigiosa"
 gdp_republic_plaza_prestige_modifier_desc: "Este personaje ha contribuido a la gran plaza, con lo que ha ganado prestigio y favor público."
 gdp_republic_trader_competitiveness_modifier: "Comerciante firme"
 gdp_republic_trader_competitiveness_modifier_desc: "Este personaje es un comerciante de sangre fría que no cede ante nada. Son los demás los que se pliegan a él."
 gdp_republic_plaza_chancery_modifier: "Madera de cancillería"
 gdp_republic_plaza_chancery_modifier_desc: "Este personaje ha suministrado al archivo carpinteros, prensas y madera de sobra, y está aprovechando el excedente en casa."
 gdp_republic_plaza_scriptorium_modifier: "Scriptorium bien aprovisionado"
 gdp_republic_plaza_scriptorium_modifier_desc: "Este personaje posee una montaña de pigmentos y tintas de gran calidad, ya que suministra a los copistas de la comuna."
 gdp_republic_plaza_magistracy_modifier: "Túnicas de oficio"
 gdp_republic_plaza_magistracy_modifier_desc: "Este personaje ha vestido a los magistrados de la ciudad de su propio bolsillo, y por ello es bien recibido allá donde se hable de ley."
 gdp_republic_plaza_popular_favor_modifier: "Figura decorativa popular"
 gdp_republic_plaza_popular_favor_modifier_desc: "Este personaje es un experto en influir en la multitud, y se asegura de que todos sepan exactamente de quién es el dinero que ha pagado sus comodidades."
 gdp_republic_plaza_trade_capacity_modifier: "Medido y sellado"
 gdp_republic_plaza_trade_capacity_modifier_desc: "Los artículos de este personaje pasan por las básculas sin disputas, y cada temporada cambian de manos en lotes grandes."
 gdp_republic_plaza_expertise_modifier: "Comerciante de la plaza"
 gdp_republic_plaza_expertise_modifier_desc: "Este personaje ejerce influencia sobre muchos de los comerciantes de la ciudad, con lo que obtiene información sobre productos y comercio que de otro modo tardaría décadas en conseguir."
 gdp_republic_plaza_estate_income_modifier: "Acreedor público"
 gdp_republic_plaza_estate_income_modifier_desc: "La comuna le debe dinero a este personaje, y el interés llega puntualmente a su casa de contabilidad."
 gdp_republic_plaza_physician_modifier: "Favor del médico"
 gdp_republic_plaza_physician_modifier_desc: "Este personaje ha pagado para abastecer los hospitales de la ciudad con hierbas y remedios, lo que garantiza que a su propia casa nunca le falten."
 gdp_republic_plaza_hired_swords_modifier: "Pagador de compañías"
 gdp_republic_plaza_hired_swords_modifier_desc: "Este personaje se asegura de que las compañías contratadas reciban su pago pronto e íntegro, y recuerda de qué bolsa procede el dinero."
 gdp_republic_plaza_organized_worker_modifier: "Organizador de mano de obra"
 gdp_republic_plaza_organized_worker_modifier_desc: "Este personaje organizó a la mano de obra para completar unos proyectos de construcción enormes y aprendió mucho sobre la logística a gran escala que le acompañan."
 gdp_republic_civic_works_labor_modifier: "Trabajo organizado"
 gdp_republic_civic_works_labor_modifier_desc: "La república ha reunido y organizado a los trabajadores, lo que ha acelerado la construcción en la capital."
 gdp_republic_civic_works_materials_modifier: "Materiales obtenidos"
 gdp_republic_civic_works_materials_modifier_desc: "El esfuerzo coordinado por obtener y almacenar materiales de edificación ha reducido los costes de construcción en la capital."
 gdp_republic_civic_works_amenities_modifier: "Comodidades públicas"
 gdp_republic_civic_works_amenities_modifier_desc: "Nuevos baños, fuentes y espacios de reunión han subido el ánimo de la gente de la ciudad."
 gdp_republic_civic_works_market_modifier: "Mercado ampliado"
 gdp_republic_civic_works_market_modifier_desc: "Un distrito de mercado más grande y mejor organizado ha atraído a más mercaderes y ha mejorado las condiciones de comercio de la capital."
 gdp_republic_civic_works_guilds_modifier: "Donación para gremios de artesanos"
 gdp_republic_civic_works_guilds_modifier_desc: "Los gremios patrocinados han traído a artesanos hábiles a la capital, lo que ha atraído la inversión y está mejorando poco a poco sus condiciones."
 gdp_republic_civic_works_labor_character_modifier: "Red de trabajo"
 gdp_republic_civic_works_labor_character_modifier_desc: "Organizar la fuerza de trabajo para las obras públicas ha permitido a este gobernante conocer a trabajadores hábiles y contratistas en toda la capital.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_materials_character_modifier: "Red de suministros"
 gdp_republic_civic_works_materials_character_modifier_desc: "Suministrar materiales para las obras públicas ha abierto canales fiables de obtención de piedra, madera y otros suministros a precios favorables.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_amenities_character_modifier: "Patrón cívico"
 gdp_republic_civic_works_amenities_character_modifier_desc: "Financiar las comodidades públicas de la ciudad ha hecho que este gobernante se gane de manera evidente la buena voluntad de la gente de la capital.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_market_character_modifier: "Contactos de mercado"
 gdp_republic_civic_works_market_character_modifier_desc: "Ampliar el distrito del mercado de la capital ha puesto a este gobernante en contacto con comerciantes y mercaderes que recordarán este favor.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_guilds_character_modifier: "Patrón de gremio"
 gdp_republic_civic_works_guilds_character_modifier_desc: "Patrocinar a los gremios ha creado lazos duraderos con los artesanos de la ciudad, cuya gratitud refleja bien la posición de este gobernante.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_settlement_modifier: "Expansión de asentamiento"
 gdp_republic_civic_works_settlement_modifier_desc: "La inversión en la infraestructura urbana de la capital ha creado espacio para más personas, que han comenzado a venir."
 gdp_republic_civic_works_settlement_character_modifier: "Inversión urbana"
 gdp_republic_civic_works_settlement_character_modifier_desc: "Financiar la expansión de la capital de la república ha hecho que este gobernante gane influencia sobre el crecimiento de la ciudad.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_order_modifier: "Orden cívico"
 gdp_republic_civic_works_order_modifier_desc: "La inversión en guardias e infraestructura pública ha hecho que la capital esté más ordenada y sea más fácil de gobernar."
 gdp_republic_civic_works_order_character_modifier: "Autoridad cívica"
 gdp_republic_civic_works_order_character_modifier_desc: "Financiar el orden cívico en la capital ha hecho que este gobernante gane reputación por su gobierno sólido y estable.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
 gdp_republic_civic_works_school_modifier: "Escuelas públicas"
 gdp_republic_civic_works_school_modifier_desc: "Este condado ha recibido una financiación considerable para la construcción de escuelas públicas."
 gdp_republic_civic_works_school_character_modifier: "Mecenas de escuelas"
 gdp_republic_civic_works_school_character_modifier_desc: "Este personaje ha financiado la construcción de escuelas en la capital, lo que ha ofrecido formación y aprendizaje a los jóvenes.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_civic_works_patrician_rating_bonus_value' )|0=+]"
