 gdp_taxed_county_modifier: "Impuesto de guerra pagado"
 gdp_taxed_county_modifier_desc: "Este condado recientemente ha pagado grandes impuestos para financiar los esfuerzos de guerra."
 gdp_tax_holiday_decree_modifier: "Reducción de impuestos"
