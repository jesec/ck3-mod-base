 gdp_trade_support_modifier: "Apoyo al comercio"
 gdp_trade_support_modifier_desc: "Este personaje ha recibido apoyo al comercio por parte de una república para mejorar sus rutas comerciales."
 republic_reliable_caravans_modifier: "Caravanas fiables"
 republic_reliable_caravans_modifier_desc: "Las rutas comerciales de este personaje se ven apoyadas por caravanas bien organizadas."
 republic_premium_contracts_modifier: "Contratos de primera"
 republic_premium_contracts_modifier_desc: "Este personaje ha conseguido contratos favorables para la venta de artículos."
 republic_inspector_bribery_modifier: "Sobornos a inspectores"
 republic_inspector_bribery_modifier_desc: "Los inspectores de mercado de este personaje han quedado en una situación comprometida al aceptar sobornos."
 gdp_glorification_modifier: "Exaltación"
 gdp_glorification_modifier_desc: "Este gobernante ha sido exaltado públicamente por su ciudad; su nombre y su semblante se festejan por las calles y en salones de la asamblea por igual.\n\n[voting_strength|E] de [GetLaw( 'republican_elective_succession_law' ).GetName]: +1"
 gdp_civic_labor_modifier: "Trabajo cívico"
 gdp_civic_labor_modifier_desc: "Los ciudadanos de la capital del gobernante han sido convocados para prestar su esfuerzo y pericia, lo que reduce el coste y el tiempo de la construcción del domicilio."
 gdp_popular_mandate_modifier: "Apoyo popular"
 gdp_popular_mandate_modifier_desc: "Este gobernante ha congregado a los ciudadanos de la capital en torno a su liderazgo prolongado, lo que da un peso extra a su voz en la próxima elección.\n\n#weak Este [modifier|El] dura una elección#!\n\n[voting_strength|E] de [GetLaw( 'republican_elective_succession_law' ).GetName]: #P +1#!"
 gdp_patrician_promoted_voter_modifier: "Reputación promovida"
 gdp_patrician_promoted_voter_modifier_desc: "La posición de este personaje en la república se ha visto impulsada por una campaña promocional exitosa.\n[voting_strength|E] de [GetLaw( 'republican_elective_succession_law' ).GetName]: #P +1#!"
 republic_procedural_advantage_modifier: "Ventaja de procedimientos"
 republic_procedural_advantage_modifier_desc: "Este personaje ha preparado los procedimientos y formularios necesarios para mejorar los apoyos en la próxima votación de la asamblea."
 gdp_pledged_assembly_vote_modifier: "Votos de la asamblea prometidos"
 gdp_pledged_assembly_vote_modifier_desc: "Los miembros de la [assembly|El] se han comprometido a votar como este personaje.\n$EFFECT_LIST_BULLET$#V Votarán como este personaje lo haga en la siguiente [voting_session|El]#!"
 gdp_bawdy_song_modifier: "Canción picante"
