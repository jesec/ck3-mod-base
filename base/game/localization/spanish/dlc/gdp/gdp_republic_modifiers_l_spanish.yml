 gdp_patrician_promoted_house_modifier_desc: "La posición de esta casa en la república se ha visto impulsada por una campaña promocional exitosa.\n[patrician_rating|E]: [EmptyScope.ScriptValue( 'gdp_patrician_promote_rating_bonus_value' )|0=+]"
