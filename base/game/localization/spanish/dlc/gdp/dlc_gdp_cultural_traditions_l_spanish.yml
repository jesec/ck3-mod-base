 culture_parameter_county_tier_trade_league_founding: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_county_tier_trade_league_founding_has_dlc', 'blank_line' )]"
 culture_parameter_county_tier_trade_league_founding_has_dlc: "Los [rulers|El] de nivel [county|El] pueden fundar una [trade_league|El]"
 tradition_roman_law_name: "Derecho romano"
 tradition_roman_law_desc: "Las leyes romanas construyeron estas tierras en el pasado. Se enseña derecho a todas las personas de importancia de esta cultura, y se emplea en todos los aspectos de la sociedad. Campesinos, artesanos, viudas, nobles, mercaderes y todos los demás confían en lo que dice la ley para solucionar conflictos."
 culture_parameter_roman_law_cheaper_university: "Enviar a un [ward|El] a la universidad y celebrar la [activity|El] [GetActivityType('activity_adult_education').GetName] cuesta #P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#! [gold_i]"
 culture_parameter_roman_law_university_bonuses: "Los [buildings|El] de universidad proporcionan beneficios extra"
 culture_parameter_roman_law_education_bonuses: "Los [education_traits|El] de [learning|El] y [stewardship|El], los [education_traits|El] de quinto nivel, tienen bonificaciones extra de [trade_competitiveness|El] [competitiveness_i] y [stewardship_skill|El] [stewardship_i]"
 culture_parameter_roman_law_legal_buildings_in_guild_district: "Las líneas de [buildings|lE] #V [GetBuildingType('notary_1').GetName]#! y #V [GetBuildingType('court_of_law_1').GetName]#! se pueden construir en el #V [GetDistrictType('guild_district').GetName|l]#!"
 culture_parameter_roman_law_legal_buildings_popular_opinion: "Las líneas de [buildings|lE] #V [GetBuildingType('market_court_1').GetName]#!, #V [GetBuildingType('notary_1').GetName]#! y #V [GetBuildingType('court_of_law_1').GetName]#! proporcionan [popular_opinion|El] [popular_opinion_i] extra"
 culture_parameter_roman_law_notariate_domicile_building: "Desbloquea el [domicile_building|El] #V [GetDomicileBuilding('merchant_company_notariate_01').GetName]#!"
 tradition_civic_religion_name: "Religión cívica"
 tradition_civic_religion_desc: "Este pueblo deja que gremios y fraternidades se ocupen de los asuntos religiosos. Todo, desde cuidar de los pobres a defender la ciudad o construir una iglesia, es responsabilidad de grupos de ciudadanos piadosos."
 culture_parameter_civic_religion_temple_district_restriction: "El [district|El] #V [GetDistrictType('temple_district').GetName]#! no está disponible para [secular_rulers|El]"
 culture_parameter_civic_religion_guild_building_slots: "El #V [GetDistrictType('guild_district').GetName|l]#! tiene #P +2#! casillas de [building|El]"
 culture_parameter_civic_religion_guild_charity_buildings: "Las líneas de [buildings|lE] #V [GetBuildingType('charities_1').GetName]#!, #V [GetBuildingType('hospitals_1').GetName]#!, #V [GetBuildingType('scribe_shop_1').GetName]#! y #V [GetBuildingType('scholarly_guilds_1').GetName]#! se pueden construir en el #V [GetDistrictType('guild_district').GetName|l]#!"
 culture_parameter_civic_religion_basilica: "Desbloquea la línea de [Concept('buildings', 'edificios')|E] [GetBuildingType('republic_basilica_01').GetName|V] en el [GetDistrictType('republic_great_plaza_district').GetName|Vl] para [republics|El]"
 culture_parameter_civic_religion_cathedral_civic_tax: "Los [buildings|El] de catedral también proporcionan [civic_tax|El]"
 culture_parameter_civic_religion_reduced_tenet_change_stress: "Cambiar un [personal_tenet|El] causa menos [stress|El]"
 culture_parameter_civic_religion_education_piety_bonuses: "Los [education_traits|El] de [diplomacy|El] y la línea de [traits|El] [GetTrait('education_republican_knowledge_3').GetName( GetNullCharacter )] otorgan [piety|El] [piety_i] adicional"
 culture_parameter_civic_religion_trait_piety_bonuses: "Los [traits|El] [GetTrait('gregarious').GetName( GetNullCharacter )] y [GetTrait('family_first').GetName( GetNullCharacter )] dan [piety|El] [piety_i] adicional"
 culture_parameter_unlock_improved_republic_militia: "Los [rulers|El] [Concept('republican', 'republicanos')|E] pueden promulgar la [law|El] #V $republic_army_organization_2_improved_levy$#!"
 tradition_contado_name: "Contado"
 tradition_contado_desc: "Un patrón de pueblecitos fortificados salpica las tierras de esta cultura, a menudo establecidos originalmente por terratenientes locales. Mediante la aparcería, los terratenientes urbanos se han distanciado del día a día de las labores del campo."
 culture_parameter_contado_castello_buildings: "La línea de [buildings|lE] #V [GetBuildingType('castello_1').GetName]#! se puede construir en el #V [GetDistrictType('villages_district').GetName|l]#!"
 culture_parameter_contado_borghi_buildings: "La línea de [buildings|lE] #V [GetBuildingType('borghi_1').GetName]#! se puede construir en el #V [GetDistrictType('walls_district').GetName|l]#!"
 culture_parameter_contado_towers_domicile_building: "Desbloquea el [domicile_building|El] #V [GetDomicileBuilding('merchant_company_towers_01').GetName]#!"
 tradition_contract_warfare_name: "Guerra por contrato"
 tradition_contract_warfare_desc: "Esta cultura ha dado al arte de la guerra un carácter institucional, más allá de levas y ejércitos ciudadanos. Las tropas trabajan bajo un contrato y los oficiales negocian las metas de la campaña con ciudades y señores. Matar ha pasado de ser un asunto personal a uno profesional."
 culture_parameter_unlock_innovation_condottieri: "La [innovation|El] #high $innovation_condottieri$#! está disponible en la [era|El] $culture_era_late_medieval$"
 culture_parameter_contract_warfare_single_combat: "Los [rulers|El] con un [commander_trait|El], un [education_trait|El] [martial|El] o el [trait|El] [GetTrait('brave').GetName( GetNullCharacter )] pueden usar la [interaction|El] #V $challenge_to_single_combat_nomadic_interaction$#! sobre [characters|El] de [title_tier|El] igual o menor que no sean su [liege|El]"
 culture_has_university_desc: "La [culture|lE] no está presente en ningún [county|lE] con una universidad"
 cultrad_republic_government_type: "Tu [government|El] es [GetGovernment( 'republic_government' ).GetName|l]"
 cultrad_has_military_district: "Tienes una [holding|El] con un #V [GetDistrictType('military_district').GetName|l]#!"
 culture_in_oasis_desc: "La [culture|lE] no está presente en ningún [county|lE] con [terrain|lE] de [GetTerrain( 'oasis' ).GetName|l]"
