l_spanish:
 tradition_fortune_seekers_name: "Buscadores de fortuna"
 tradition_fortune_seekers_desc: "Esta cultura no se avergüenza de abandonar el hogar sin nada, y espera que aquellos que se queden hereden poco y busquen su fortuna en el extranjero. Allí aprenden los caminos de innumerables carreteras, y con ello, el peso de cada artículo y los términos de cada préstamo."
 culture_parameter_fortune_seekers_merchant_propensity: "Es más probable que los [characters|El] de esta [culture|El] sean [Concept('merchants', 'mercaderes')|E]"
 culture_parameter_fortune_seekers_wine_storage_domicile_building: "Desbloquea el [domicile_building|El] #V [GetDomicileBuilding('merchant_company_wine_storage_01').GetName]#!"
 tradition_saharan_traders_name: "Comerciantes saharianos"
 tradition_saharan_traders_desc: "Es una verdad antigua que el desierto del Sáhara no es tanto una barrera como una carretera para el comercio, que conecta el Sahel y el interior de África Occidental con el Mediterráneo. Esta cultura ha asumido su papel en este intercambio y hay muchos que viven su vida entera en caravanas."
 culture_parameter_oasis_villages_building_slot: "Los [districts|lE] #V [GetDistrictType('villages_district').GetName]#!, #V [GetDistrictType('religious_community_district').GetName]#! y #V [GetDistrictType('manor_houses_district').GetName]#! tienen #P +1#! casilla de [building|El] en [GetTerrain( 'oasis' ).GetName|l]"
 culture_parameter_saharan_seasoned_traveler_route_length: "Cada nivel de la pista #V $trait_track_danger$#! del [trait|El] [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] concede #P +1#! a la [trade_route_length|El]"
 culture_parameter_saharan_merchant_domicile_buildings: "Desbloquea los [domicile_buildings|El] #V [GetDomicileBuilding('merchant_company_tuareg_guide_station_01').GetName]#! y #V [GetDomicileBuilding('merchant_company_ornamented_courtyard_01').GetName]#!"
 culture_parameter_caravan_escort_compound_domicile_building: "Desbloquea el [domicile_building|El] #V [GetDomicileBuilding('merchant_company_caravan_escort_compound_01').GetName]#!"
 tradition_silk_road_traders_name: "Emprendedores de la Ruta de la Seda"
 tradition_silk_road_traders_desc: "La Ruta de la Seda trae una corriente constante de bienes entre Oriente y Occidente. Seda, té, objetos lacados, jade y otros muchos artículos caros se trasladan de estación en estación por el largo periplo. Esto ha dado forma a las sociedades tocadas por la ruta. En las ciudades ricas, la gente o bien participa directamente en el comercio a larga distancia o vende a aquellos que sí lo hacen."
 tradition_monsoon_traders_name: "Mercaderes del monzón"
 tradition_monsoon_traders_desc: "De los nakhudas del oeste a los gremios de comerciantes y castas del este, los mercaderes del océano Índico han traído pimienta, telas de algodón y bienes preciosos al mercado, generación tras generación."
 culture_parameter_caravanserai_hospitality: "Los [characters|El] de esta [culture|El] pueden usar la [interaction|El] #V $host_honored_guest_interaction$#!"
 culture_parameter_stewardship_gain_from_foreign_poi: "Visitar un [point_of_interest|El] en las tierras de otra [culture|El] otorga [lifestyle_experience|El] de [stewardship|El]"
 culture_parameter_silk_road_market_expertise: "La [decision|El] #V $visit_silk_road_market_decision$#! te beneficia más"
 culture_parameter_silk_road_oasis_urban_building_slots: "Los [districts|lE] #V [GetDistrictType('urban_housing_district').GetName]#! y #V [GetDistrictType('guild_district').GetName]#! tienen #P +1#! casilla de [building|El] en [GetTerrain( 'oasis' ).GetName|l]"
 culture_parameter_silk_road_market_owner_bonuses: "Los [buildings|El] de mercado de la Ruta de la Seda proporcionan [commerce_tax|El] adicional"
 culture_parameter_silk_road_merchant_domicile_buildings: "Desbloquea los [domicile_buildings|El] #V [GetDomicileBuilding('merchant_company_mulberry_plant_school_01').GetName]#! y #V [GetDomicileBuilding('merchant_company_chinese_merchant_enclave_01').GetName]#!"
 culture_parameter_monsoon_traveler_trade_bonuses: "La pista #V $trait_track_travel$#! del [trait|El] [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )] da [trade_competitiveness|El] [competitiveness_i] adicional y la pista #V $trait_track_danger$#! da [capacity|El] [trade_route_capacity_i] adicional"
 culture_parameter_monsoon_port_buildings_settlement_size: "Los [buildings|El] en el [district|lE] #V [GetDistrictType('port_district').GetName]#! proporcionan #P +[EmptyScope.ScriptValue('province_size_tier_1')|0]#! de [settlement_size|El]"
 culture_parameter_monsoon_merchant_domicile_buildings: "Desbloquea los [domicile_buildings|El] #V [GetDomicileBuilding('merchant_company_diaspora_network_01').GetName]#! y #V [GetDomicileBuilding('merchant_company_spice_traders_guild_01').GetName]#!"
 tradition_binding_oaths_name: "Juramentos vinculantes"
 tradition_binding_oaths_desc: "Los tratos se deben cumplir. Esta gente cree que un contrato hecho jamás se puede romper. No se soporta a quienes rompen un juramento."
 culture_parameter_binding_oaths_harsh_break_penalties: "Romper una [truce|El], denunciar a un [creditor|El] o delatarse como [GetTrait('dealbreaker').GetName( GetNullCharacter )|l] provoca una pérdida de [opinion|El] aún mayor para esta [culture|El] y cuesta el #N 10 %#! de la [acumen|El] de una [company|El]"
 culture_parameter_binding_oaths_word_is_trusted: "Otros [rulers|El] tienen más probabilidad de aceptar su [interaction|El] #V $negotiate_alliance_interaction$#! y de responder a su [interaction|El] #V $call_ally_interaction$#!, que cuesta #P -50 %#! [prestige_i]"
 culture_parameter_good_faith_traits_more_common: "Los [traits|El] [GetTrait('honest').GetName( GetNullCharacter )] y [GetTrait('trusting').GetName( GetNullCharacter )] son más comunes"
 culture_parameter_good_faith_trait_bonuses: "Los [traits|El] [GetTrait('honest').GetName( GetNullCharacter )] y [GetTrait('trusting').GetName( GetNullCharacter )] tienen bonificaciones adicionales"
 culture_parameter_better_stewardship_education: "Es más probable que los [children|El] de esta [culture|El] reciban una buena [education|El] en [stewardship|El]"
 binding_oaths_broke_word_modifier: "Quebrantajuramentos"
 binding_oaths_alliance_accept_reason: "Tu [tradition|El] [GetCultureTradition('tradition_binding_oaths').GetName] te obliga a cumplir tu palabra: $VALUE|=+0$"
 binding_oaths_call_to_arms_reason: "Mi [tradition|El] [GetCultureTradition('tradition_binding_oaths').GetName] me obliga a cumplir con nuestra [alliance|El]: $VALUE|=+0$"
 culture_parameter_unlock_carnival_activity: "Los [rulers|El] [Concept('republican', 'republicanos')|E] pueden celebrar la [activity|El] [GetActivityType('activity_carnival').GetName]"
 culture_parameter_merchant_propensity_bonus: "Es más probable que los [characters|El] de esta [culture|El] sean [Concept('merchants', 'mercaderes')|E]"
 culture_parameter_trade_league_cohesion_bonus: "[SelectLocalization( HasDlcFeature( 'silk_and_silver' ), 'culture_parameter_trade_league_cohesion_bonus_has_dlc', 'blank_line' )]"
