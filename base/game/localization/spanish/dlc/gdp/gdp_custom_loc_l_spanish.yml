l_spanish:
 dinar: "dinar"
 dinar_plural: "dinares"
 dinar_gloss: "[Glossary('dinar', 'DINAR_GLOSS')]"
 dinar_gloss_plural: "[Glossary('dinares', 'DINAR_GLOSS')]"
 DINAR_GLOSS: "El #bold dinar#!, o #emp denar#!, fue una moneda de oro creada por los Omeyas en el siglo VII para imitar al [Glossary('sólido', 'SOLIDUS_GLOSS')] de oro bizantino, aunque su nombre proviene del [Glossary('denario', 'DENARIUS_GLOSS')] de plata.\n\nSe extendió por el mundo árabe y este nombre se sigue usando como unidad de muchas monedas actuales."
 denarius: "denario"
 denarius_plural: "denarios"
 denarius_gloss: "[Glossary('denario', 'DENARIUS_GLOSS')]"
 denarius_gloss_plural: "[Glossary('denarios', 'DENARIUS_GLOSS')]"
 DENARIUS_GLOSS: "El #bold denario#! fue originalmente una moneda de plata de la república romana, que se devaluó mucho en el periodo imperial.\n\nA pesar de ello, el término sobrevivió como sinónimo de moneda en la zona de influencia romana y su nombre se mantuvo en el posterior [Glossary('denar', 'PENNY_GLOSS')] de plata carolingio y el [Glossary('dinar', 'DINAR_GLOSS')] de oro árabe."
 ducat: "ducado"
 ducat_plural: "ducados"
 ducat_gloss: "[Glossary('ducado', 'DUCAT_GLOSS')]"
 ducat_gloss_plural: "[Glossary('ducados', 'DUCAT_GLOSS')]"
 DUCAT_GLOSS: "El #bold ducato#!, o #emp dogado#!, fue una moneda de oro acuñada por Venecia en el siglo XIII a imitación del [Glossary('florín', 'FLORIN_GLOSS')] florentino y el #emp genovino#! genovés, en respuesta a las devaluaciones del [Glossary('sólido', 'SOLIDUS_GLOSS')] de oro bizantino. Su nombre previene del título de #emp dux#! de Venecia.\n\nPronto fue muy apreciado en los intercambios comerciales y se extendió por Europa y más allá, y fue copiado como estándar."
 dirham: "dírham"
 dirham_plural: "dírhams"
 dirham_gloss: "[Glossary('dírham', 'DIRHAM_GLOSS')]"
 dirham_gloss_plural: "[Glossary('dirhams', 'DIRHAM_GLOSS')]"
 DIRHAM_GLOSS: "El #bold dírham#!, o #emp dram#!, fue una moneda de plata acuñada por los Omeyas en el siglo VII y adoptada por todo el mundo de habla árabe; su nombre proviene del antiguo #emp dracma#! de plata griego de los periodos clásico y helenístico.\n\nSe convirtió en la unidad estándar del mundo árabe al extenderse por doquier y su nombre se sigue usando como unidad de muchas monedas actuales."
 aureus: "áureo"
 aureus_plural: "áureos"
 aureus_gloss: "[Glossary('áureo', 'AUREUS_GLOSS')]"
 aureus_gloss_plural: "[Glossary('áureos', 'AUREUS_GLOSS')]"
 solidus: "sólido"
 solidus_plural: "sólidos"
 solidus_gloss: "[Glossary('sólido', 'SOLIDUS_GLOSS')]"
 solidus_gloss_plural: "[Glossary('sólidos', 'SOLIDUS_GLOSS')]"
 SOLIDUS_GLOSS: "El #bold sólido#!, o #emp nomisma#! (literalmente «moneda»), fue una moneda de oro acuñada por los bizantinos en el siglo IV para reemplazar al anterior [Glossary('áureo', 'AUREUS_GLOSS')] romano, hasta que fue reemplazado a su vez por el [Glossary('hiperpirón', 'HYPERPYRON_GLOSS')] en el siglo XI.\n\nLas monedas de oro de las repúblicas italianas, como el [Glossary('ducado', 'DUCAT_GLOSS')], el [Glossary('florín', 'FLORIN_GLOSS')] y el #emp genovino#!, nacieron como respuesta a la devaluación de este en el siglo XIII.\n\nEn el norte de Europa se le conoció como #emp chelín#!, hasta que las reformas de Carlomagno estandarizaron el valor de intercambio en plata de ese nombre en el siglo VIII."
 hyperpyron: "hiperpirón"
 hyperpyron_plural: "hiperpirones"
 hyperpyron_gloss: "[Glossary('hiperpirón', 'HYPERPYRON_GLOSS')]"
 hyperpyron_gloss_plural: "[Glossary('hiperpirones', 'HYPERPYRON_GLOSS')]"
 HYPERPYRON_GLOSS: "El #bold hiperpirón#!, que significa «superrefinado» y fue conocido en Europa como #emp besante#!, fue una moneda de oro acuñada por los bizantinos en el siglo XI para reemplazar al anterior [Glossary('sólido', 'SOLIDUS_GLOSS')] de oro.\n\nSi bien no fue tan devaluado como el #emp sólido#!, su valor se habría reducido tanto en el siglo XIII que animó a la introducción del [Glossary('ducado', 'DUCAT_GLOSS')], el [Glossary('florín', 'FLORIN_GLOSS')] y el #emp genovino#! de las repúblicas italianas."
 bezant: "besante"
 bezant_plural: "besantes"
 bezant_gloss: "[Glossary('besante', 'HYPERPYRON_GLOSS')]"
 bezant_gloss_plural: "[Glossary('besantes', 'HYPERPYRON_GLOSS')]"
 florin: "florín"
 florin_plural: "florines"
 florin_gloss: "[Glossary('florín', 'FLORIN_GLOSS')]"
 florin_gloss_plural: "[Glossary('florines', 'FLORIN_GLOSS')]"
 FLORIN_GLOSS: "El #bold florín#! fue una moneda de oro acuñada por la república de Florencia en el siglo XIII como respuesta a las devaluaciones del [Glossary('sólido', 'SOLIDUS_GLOSS')] y el [Glossary('hiperpirón', 'HYPERPYRON_GLOSS')] bizantinos, a los que pronto siguieron el #emp genovino#! genovés y el [Glossary('ducado', 'DUCAT_GLOSS')] veneciano.\n\nComo el #emp ducado#!, se convirtió en una moneda de intercambio ampliamente extendida, con muchas cecas por toda Europa que acuñaban copias, y su nombre sobrevive en el #emp forint#! húngaro."
 penny: "penique"
 penny_plural: "peniques"
 penny_gloss: "[Glossary('penique', 'PENNY_GLOSS')]"
 penny_gloss_plural: "[Glossary('peniques', 'PENNY_GLOSS')]"
 PENNY_GLOSS: "El #bold pfennig#!, o #emp penique#!, fue una moneda de plata estandarizada introducida por Carlomagno en el siglo VIII como equivalente al anterior [Glossary('denario', 'DENARIUS_GLOSS')] de plata omnipresente en el mundo romano.\n\nPronto se extendió y se copió, normalizándose en toda Europa, y nombres como #emp denar#!, #emp denier#! o #emp dinero#! se usaron de manera intercambiable para referirse a las monedas de plata de su mismo peso durante siglos."
 pfennig: "pfennig"
 pfennig_plural: "pfennigs"
 pfennig_gloss: "[Glossary('pfennig', 'PENNY_GLOSS')]"
 pfennig_gloss_plural: "[Glossary('pfennigs', 'PENNY_GLOSS')]"
 denier: "denier"
 denier_plural: "deniers"
 denier_gloss: "[Glossary('denier', 'PENNY_GLOSS')]"
 denier_gloss_plural: "[Glossary('deniers', 'PENNY_GLOSS')]"
 dinero: "dinero"
 dinero_plural: "dineros"
 dinero_gloss: "[Glossary('dinero', 'PENNY_GLOSS')]"
 dinero_gloss_plural: "[Glossary('dineros', 'PENNY_GLOSS')]"
 denaro: "denaro"
 denaro_plural: "denaros"
 denaro_gloss: "[Glossary('denaro', 'PENNY_GLOSS')]"
 denaro_gloss_plural: "[Glossary('denaros', 'PENNY_GLOSS')]"
 denar: "denar"
 denar_plural: "denar"
 denar_gloss: "[Glossary('denar', 'PENNY_GLOSS')]"
 denar_gloss_plural: "[Glossary('denar', 'PENNY_GLOSS')]"
 groschen: "groschen"
 groschen_plural: "groschen"
 groschen_gloss: "[Glossary('groschen', 'GROSCHEN_GLOSS')]"
 groschen_gloss_plural: "[Glossary('groschen', 'GROSCHEN_GLOSS')]"
 GROSCHEN_GLOSS: "El #bold groschen#!, o «penique gordo», fue una moneda de plata más pesada acuñada por el duque Meinhard II de Tirol en el siglo XII en respuesta al #emp grosso#! veneciano equivalente, la cual valía al principio 12 [Glossary('pfennigs', 'PENNY_GLOSS')].\n\nEl estándar pronto se extendió por Europa, con las cecas de Kutná Hora en Bohemia y Friburgo en Meissen como fuentes más notables."
 tongbao: "tongbao"
 tongbao_plural: "tongbao"
 tongbao_gloss: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 tongbao_gloss_plural: "[Glossary('tongbao', 'TONGBBAO_GLOSS')]"
 TONGBBAO_GLOSS: "#bold Tongbao#!, que significa «tesoro que circula», es el nombre que se dio a las monedas de tipo [Glossary('qian', 'QIAN_GLOSS')] fundidas en una aleación de bronce y acuñadas por primera vez por la dinastía Tang en el siglo VII.\n\nSe convirtieron en las unidades estándar de intercambio en toda la esfera china. Hoy en día se emplean en la medicina china tradicional y se consideran objetos de buena suerte."
 qian: "qian"
 qian_plural: "qian"
 qian_gloss: "[Glossary('qian', 'QIAN_GLOSS')]"
 qian_gloss_plural: "[Glossary('qian', 'QIAN_GLOSS')]"
 QIAN_GLOSS: "#bold Qian#!, que significa «dinero», es el término general para las omnipresentes monedas de aleación de cobre que se empleaban como unidades de intercambio en China al principio del periodo de los Reinos combatientes.\n\nSus agujeros cuadrados facilitaban, con una barra, el limado masivo de los bordes de las piezas fundidas, como también permitían atarlas en grandes paquetes para el intercambio, normalmente, en tiras de mil. Inspiraron monedas fundidas similares en Japón, Corea, Vietnam y más allá."
 mon_coin: "mon"
 mon_coin_plural: "mon"
 mon_coin_gloss: "[Glossary('mon', 'QIAN_GLOSS')]"
 mon_coin_gloss_plural: "[Glossary('mon', 'QIAN_GLOSS')]"
 tanka: "tanka"
 tanka_plural: "tanka"
 tanka_gloss: "[Glossary('tanka', 'TANKA_GLOSS')]"
 tanka_gloss_plural: "[Glossary('tanka', 'TANKA_GLOSS')]"
 TANKA_GLOSS: "El #bold tanka#!, o #emp taka#!, fue una moneda de plata emitida por el sultanato de Delhi en el siglo XIII.\n\nSe extendió por la India y regiones vecinas, donde fue muy copiada; se convirtió en una unidad de intercambio estándar en la Ruta de la Seda."
 jital: "jital"
 jital_plural: "jital"
 jital_gloss: "[Glossary('jital', 'JITAL_GLOSS')]"
 jital_gloss_plural: "[Glossary('jital', 'JITAL_GLOSS')]"
 JITAL_GLOSS: "Los #bold jital#! eran al principio unas monedas de plata con un diseño de un toro y un jinete que aparecieron en Kabul en el siglo VIII.\n\nEl diseño se extendió por la región, con muchas copias acuñadas, y finalmente se acabó devaluando, al alearse más y más con cobre. Los #emp jital#! llegaron a ser completamente de cobre en el siglo XVI."
 coin: "moneda"
 coin_plural: "monedas"
 coin_gloss: "moneda"
 coin_gloss_plural: "monedas"
 bazaar: "bazar"
 bazaar_plural: "bazares"
 bazaar_gloss: "[Glossary('bazar', 'BAZAAR_GLOSS')]"
 bazaar_gloss_plural: "[Glossary('bazares', 'BAZAAR_GLOSS')]"
 BAZAAR_GLOSS: "#bold Bazar#!, originalmente #emp bazaar#!, significa «mercado» en persa y proviene del protoindoeuropeo. Posteriormente pasó al árabe y ahora su uso está muy extendido por Asia occidental, la India y más allá."
 khrom: "khrom"
 khrom_plural: "khroms"
 khrom_gloss: "[Glossary('khrom', 'KHROM_GLOSS')]"
 khrom_gloss_plural: "[Glossary('khroms', 'KHROM_GLOSS')]"
 KHROM_GLOSS: "#bold Khrom#! significa «mercado» en tibetano, término que se extendió regionalmente a lo largo de la Ruta de la Seda."
 shuka: "shuka"
 shuka_plural: "shukas"
 shuka_gloss: "[Glossary('shuka', 'SHUKA_GLOSS')]"
 shuka_gloss_plural: "[Glossary('shukas', 'SHUKA_GLOSS')]"
 SHUKA_GLOSS: "#bold Shuka#! es como se dice «mercado» en los idiomas del Cáucaso. Al igual que el árabe [Glossary('suq', 'SUQ_GLOSS')], fue un préstamo de la palabra acadia para «calle», pero a través del siríaco."
 suq: "suq"
 suq_plural: "suqs"
 suq_gloss: "[Glossary('suq', 'SUQ_GLOSS')]"
 suq_gloss_plural: "[Glossary('suqs', 'SUQ_GLOSS')]"
 SUQ_GLOSS: "#bold Suq#!, también escrito #emp souk#!, es mercado en árabe. Al principio, fue un préstamo de la palabra «calle» en acadio, pero a través del arameo. Ahora es un término común en el mundo musulmán y más allá."
 market_custom: "mercado"
 market_custom_plural: "mercados"
 market_custom_gloss: "mercado"
 market_custom_gloss_plural: "mercados"
 burgher: "burgués"
