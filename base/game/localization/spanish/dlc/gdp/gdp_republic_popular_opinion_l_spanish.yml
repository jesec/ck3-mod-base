l_spanish:
 # Republic Popular Opinion: Interface message titles
 # Mild negative: popular_opinion in [-50, 0)
 gdp_popular_opinion_mild_negative_title: "Opinión popular baja: gente inquieta"
 # Severe negative: popular_opinion < -50
 gdp_popular_opinion_severe_negative_title: "Opinión popular baja: ciudad en crisis"
 # Mild positive: popular_opinion in [25, 50)
 gdp_popular_opinion_mild_positive_title: "Opinión popular elevada: buen humor"
 # Strong positive: popular_opinion >= 50
 gdp_popular_opinion_strong_positive_title: "Opinión popular elevada: la ciudad florece"
 # County modifiers: Mild negative
 gdp_popular_opinion_mild_neg_prosperity: "Estancamiento económico"
 gdp_popular_opinion_mild_neg_prosperity_desc: "El descontento popular ha hecho que los ciudadanos sean reticentes a invertir en la ciudad, lo que reduce su crecimiento a largo plazo."
 gdp_popular_opinion_mild_neg_taxes: "Evasión de impuestos"
 gdp_popular_opinion_mild_neg_taxes_desc: "Ciudadanos resentidos encuentran modos de evitar pagar lo que les corresponde, lo que reduce los ingresos de todos los distritos de la ciudad."
 gdp_popular_opinion_mild_neg_construction: "Retrasos en la construcción"
 gdp_popular_opinion_mild_neg_construction_desc: "Trabajadores y artesanos colaboran menos que antes, lo que sube los costes y ralentiza el progreso de la construcción."
 gdp_popular_opinion_mild_neg_defense: "Murallas poco defendidas"
 gdp_popular_opinion_mild_neg_defense_desc: "Los ciudadanos no están dispuestos a servir en la milicia cívica, lo que deja las defensas de la ciudad bajo mínimos."
 # County modifiers: Severe negative
 gdp_popular_opinion_severe_neg_prosperity: "Colapso económico"
 gdp_popular_opinion_severe_neg_prosperity_desc: "Un profundo descontento ha quebrado la economía de la ciudad. El crecimiento se ha estancado y la prosperidad existente se empieza a erosionar."
 gdp_popular_opinion_severe_neg_taxes: "Revuelta tributaria"
 gdp_popular_opinion_severe_neg_taxes_desc: "Una resistencia abierta a los impuestos se ha extendido por todos los distritos de la ciudad, lo que reduce gravemente los ingresos públicos."
 gdp_popular_opinion_severe_neg_construction: "Huelgas de construcción"
 gdp_popular_opinion_severe_neg_construction_desc: "Gremios y trabajadores se niegan a trabajar. La construcción se ha vuelto extremadamente lenta y cara."
 gdp_popular_opinion_severe_neg_defense: "Deserción de la guarnición"
 gdp_popular_opinion_severe_neg_defense_desc: "Los soldados han abandonado sus puestos o se niegan a servir. Las murallas de la ciudad están casi abandonadas."
 # County modifiers: Mild positive
 gdp_popular_opinion_mild_pos_prosperity: "Inversión cívica"
 gdp_popular_opinion_mild_pos_prosperity_desc: "Una ciudadanía confiada vuelca su buena voluntad en el futuro de la ciudad e impulsa cuidadosamente su prosperidad a largo plazo."
 gdp_popular_opinion_mild_pos_taxes: "Contribuyentes dispuestos"
 gdp_popular_opinion_mild_pos_taxes_desc: "Los ciudadanos pagan los impuestos sin quejas, lo que trae más ingresos de todos los distritos de la ciudad."
 gdp_popular_opinion_mild_pos_construction: "Entusiasmo cívico"
 gdp_popular_opinion_mild_pos_construction_desc: "Gremios y artesanos están ansiosos por contribuir al crecimiento de la ciudad, lo que reduce el coste y el tiempo de finalización de las nuevas obras."
 # County modifiers: Strong positive
 gdp_popular_opinion_strong_pos_prosperity: "Edad de oro de prosperidad"
 gdp_popular_opinion_strong_pos_prosperity_desc: "La ciudad rebosa optimismo. Ciudadanos y mercaderes por igual invierten libremente e impulsan un crecimiento fuerte y sostenido."
 gdp_popular_opinion_strong_pos_taxes: "Arcas rebosantes"
 gdp_popular_opinion_strong_pos_taxes_desc: "El orgullo del pueblo por su ciudad se traduce directamente en una aceptación generosa de los impuestos en todos los distritos."
 gdp_popular_opinion_strong_pos_construction: "Construcción de obras maestras"
 gdp_popular_opinion_strong_pos_construction_desc: "Los mejores artesanos y trabajadores compiten por el honor de trabajar en la ciudad, lo que reduce los costes y acelera cada proyecto."
 # Market modifiers: Mild negative
 gdp_popular_opinion_mild_neg_sell_price: "Vendedores cautelosos"
 gdp_popular_opinion_mild_neg_sell_price_desc: "La inquietud en la ciudad ha vuelto precavidos a los comerciantes, que retienen artículos y reducen precios por todo el mercado."
 gdp_popular_opinion_mild_neg_capacity: "Indecisión en el mercado"
 gdp_popular_opinion_mild_neg_capacity_desc: "Una reducción de la confianza ha hecho que algunos mercaderes reduzcan su presencia, lo que ha tensado la capacidad del mercado."
 # Market modifiers: Severe negative
 gdp_popular_opinion_severe_neg_sell_price: "Pánico en el mercado"
 gdp_popular_opinion_severe_neg_sell_price_desc: "La crisis en la calle ha hecho caer bruscamente los precios y los vendedores se apresuran a librarse de artículos en un mercado desplomado."
 gdp_popular_opinion_severe_neg_capacity: "Fuga de mercaderes"
 gdp_popular_opinion_severe_neg_capacity_desc: "Mercaderes importantes abandonan la ciudad en masa, lo que empequeñece dramáticamente el mercado."
 # Market modifiers: Mild positive
 gdp_popular_opinion_mild_pos_sell_price: "Vendedores confiados"
 gdp_popular_opinion_mild_pos_sell_price_desc: "Un humor positivo en la ciudad ha impulsado la confianza de los vendedores, lo que empuja hacia arriba los precios del mercado."
 gdp_popular_opinion_mild_pos_capacity: "Mercado en crecimiento"
 gdp_popular_opinion_mild_pos_capacity_desc: "El optimismo atrae a la ciudad a nuevos comerciantes y mercaderes, lo que expande la capacidad del mercado."
 # Market modifiers: Strong positive
 gdp_popular_opinion_strong_pos_sell_price: "Comercio en auge"
 gdp_popular_opinion_strong_pos_sell_price_desc: "Un orgullo cívico excepcional ha convertido el mercado de la ciudad en sinónimo de calidad, lo que lleva a precios de lujo para todos los artículos."
 gdp_popular_opinion_strong_pos_capacity: "Mercado próspero"
 gdp_popular_opinion_strong_pos_capacity_desc: "La reputación de la ciudad atrae a mercaderes de todos los lugares, lo que amplía significativamente su capacidad comercial."
