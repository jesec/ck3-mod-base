l_spanish:
 city_stroll_prefix: "Un paseo por la ciudad"
 #Come across some left behind cargo
 gdp_republic_patrician_decision.1000.t: "$city_stroll_prefix$: quien lo encuentra se lo queda"
 gdp_republic_patrician_decision.1000.desc: "Giro una esquina para entrar en un callejón lejos de la calle principal y me topo con un[local_character.Custom('ES_XA')] vendedor[local_character.Custom('ES_XA')] local en plena conversación:\n\n«… y no vino nadie a recogerlo…», se encoje de hombros ante su compañero y señala las cajas de [abandoned_trade_good.GetNameNoTooltip|l] desparramadas en el callejón.\n\nNadie da un paso adelante, ni reclama la propiedad del lote. Mesuro rápidamente la carga. Una #EMP oportunidad#!."
 gdp_republic_patrician_decision.1000.a: "¿Y si creamos alguna demanda…?"
 gdp_republic_patrician_decision.1000.a.flavor: "Las cajas de [abandoned_trade_good.GetNameNoTooltip|l] resultan estar rotas, y su contenido, hecho añicos."
 gdp_republic_patrician_decision.1000.b: "«Ajajá, es que es mío, ¿veis?»."
 gdp_republic_patrician_decision.1000.c: "«Ah, ¡el cargamento perdido de [abandoned_trade_good.GetNameNoTooltip|l] [liege_scope.Custom('ES_DelDela')] [liege_scope.GetTitledFirstNameNoTooltip|l]! Muchas gracias»."
 gdp_republic_patrician_decision.1000.d: "Bueno, no es asunto mío."
 #What a nice, relaxing garden stroll
 gdp_republic_patrician_decision.1010.t: "$city_stroll_prefix$: un día en el jardín"
 gdp_republic_patrician_decision.1010.desc: "Encuentro un oasis oculto; una auténtica joya en bruto, en un pequeño jardín alojado entre los recodos y callejones de [city_location.GetTitle.GetNameNoTier]. Los senderos han visto días mejores y hay pocas plantas, pero bien cuidadas. Un sitio con un cuidador muy entregado.\n\nGrupos de nobles, mercaderes, plebeyos y trabajadores se sientan en la vegetación y disfrutan de un breve descanso de su trabajo.\n\nDoy una vuelta, se me alegra un poco el ánimo y mis cargas parecen algo más soportables."
 gdp_republic_patrician_decision.1010.a: "¡Lo convertiremos en el mejor jardín de [city_location.GetTitle.GetNameNoTierNoTooltip]!"
 gdp_republic_patrician_decision.1010.b: "¿Pero qué plantita es esta?"
 gdp_republic_patrician_decision.1010.b.poison_plant: "Encuentras plantas intrigantes"
 gdp_republic_patrician_decision.1010.b.health_plant: "Encuentras hierbas beneficiosas"
 gdp_republic_patrician_decision.1010.c: "Dejadme… estar un poco más libre…"
 gdp_republic_patrician_decision.1010.c.flavor: "Dejemos salir todo. ¡Qué relajante!"
 gdp_republic_patrician_decision.1010.c.success: "No te han detectado aún"
 gdp_republic_patrician_decision.1010.c.failure: "Te han descubierto"
 gdp_republic_patrician_decision.1010.d: "¡Delicioso!"
 #Explore the Great Plaza
 gdp_republic_patrician_decision.1020.t: "$city_stroll_prefix$: la gran plaza de [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1020.intro: "Da igual la política y las intrigas de nobles y gobernantes del país [city_location.GetCounty.GetTitle.GetAdjective], la vida en la gran plaza continúa."
 gdp_republic_patrician_decision.1020.intro.01: "Un aroma delicioso a ración recién hecha de [ROOT.Char.Custom('GetLocalStreetFood')] me llena las fosas nasales según arden las cocinas."
 gdp_republic_patrician_decision.1020.intro.02: "Un burro protestón rebuzna a su dueño, que intenta lavarlo furiosamente y quitarle de encima las capas de barro incrustado."
 gdp_republic_patrician_decision.1020.intro.03: "Varios ciudadanos mayores dan un paseo, emitiendo sonidos de reprobación ante el precio del pan y la arrogancia de la juventud de hoy en día."
 gdp_republic_patrician_decision.1020.intro.04: "Una bandada de [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBirdPlural')|l] da vueltas sobre el área, observando con hambre los puestos de comida."
 gdp_republic_patrician_decision.1020.intro.rain: "Esta mañana, levantada sobre el telón del temporal de ayer."
 gdp_republic_patrician_decision.1020.desc.maa: "\n\nEn la distancia veo un grupo de soldados, no naturales de [city_location.GetCounty.GetTitle.GetNameNoTierNoTooltip]. Parecen fuera de sitio y tienen un aspecto inquieto. Por lo que llego a oír de sus discusiones a veces intensas, buscan un patrón nuevo."
 gdp_republic_patrician_decision.1020.desc.trader: "\n\nAl borde de la plaza, una figura rústica obsequia a los transeúntes con miradas hurañas. Según me acerco a [local_character.GetSheHe], llego a oír sus quejas por el final reciente de su prestigioso contrato de mercader con [liege_scope.GetHouse.GetBaseName]. ¿Un[local_character.Custom('ES_XA')] comerciante apreciad[local_character.Custom('ES_OA')] con mala fortuna?"
 gdp_republic_patrician_decision.1020.desc.physician: "\n\nEn medio de la plaza, subido a una pila de cajas, un médico termina una lección sobre fluidos corporales y cómo equilibrar más fácilmente la bilis negra. Asiento con vacilación. $gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.scheme: "\n\nEn un puesto en un rincón sombrío de la plaza, atisbo la perfección hecha [ROOT.Char.Custom('RandomMediumObject')]; algo que seguramente me ayudaría en la intriga de [scheme_to_boost.GetName|l] scheme…$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.jewellery: "\n\nAl echar un vistazo a la plaza, vislumbro algo que reluce. Entorno los ojos para encontrar el origen y atisbo una pequeña joya, casi cubierta entera de polvo.$gdp_republic_patrician_decision.1020.outro$"
 gdp_republic_patrician_decision.1020.desc.generic: "\n\nAl otro lado de la plaza, un pequeño grupo de campesinos menos afortunados son escoltados fuera del recinto. Uno de los niños más pequeños llora desgarradoramente de hambre y miedo, mientras que los espectadores hacen lo que pueden para obviar tan triste procesión."
 gdp_republic_patrician_decision.1020.outro: "\n\nMi sirviente se aclara la garganta con sutileza para que sea consciente de que es hora de volver a casa a gestionar mis otras responsabilidades."
 gdp_republic_patrician_decision.1020.a: "Podría alimentar una boca o dos."
 gdp_republic_patrician_decision.1020.b: "Esos soldados podrían ser útiles…"
 gdp_republic_patrician_decision.1020.c: "Hum, otro comerciante competente siempre viene bien…"
 gdp_republic_patrician_decision.1020.d: "Ese médico debería trabajar para mí."
 gdp_republic_patrician_decision.1020.e: "El trabajo primero, el paseo, después."
 gdp_republic_patrician_decision.1020.f: "Solo despejaré esto…"
 gdp_republic_patrician_decision.1020.g: "¡Sitios que ver, gente a la que conocer!"
 gdp_republic_patrician_decision.1020.g.alternate: "Un día más en [GetPlayer.GetCapitalLocation.GetNameNoTooltip]."
 #Harbor - help local fishermen invest in better nets
 gdp_republic_patrician_decision.1030.t: "$city_stroll_prefix$: puerto de [city_location.GetTitle.GetNameNoTierNoTooltip]"
 gdp_republic_patrician_decision.1030.desc: "El olor a pescado y a algas podridas aumenta según nos acercamos al puerto local. Pescadores con familias, madres y niños pequeños, así como un puñado de gatos callejeros, todos se quedan por la zona y llevan a cabo las tareas diarias.\n\nMientras caminamos, oigo a dos pescadores quejarse: «… y claro que tuvimos que conseguir anzuelos nuevos. Pero nos iría mejor con redes…». Se quedan en silencio cuando se dan cuenta de mi presencia."
 gdp_republic_patrician_decision.1030.desc.outro: "\n\nMusito algo y asiento."
 gdp_republic_patrician_decision.1030.desc.outro.cat: "\n\nMusito algo y asiento mientras un gato callejero se acerca a mi pierna, ronroneando intensamente."
 gdp_republic_patrician_decision.1030.a: "«Se me podría convencer para conseguir redes nuevas…»."
 gdp_republic_patrician_decision.1030.a.flavor: "¡Esto podría #EMP pescar#! un beneficio!"
 gdp_republic_patrician_decision.1030.b: "«¿Cuánto me descontáis si os compro el pescado al por mayor?»."
 gdp_republic_patrician_decision.1030.c: "¡Gato!"
 gdp_republic_patrician_decision.1030.d: "«Un día maravilloso, ¿verdad?»"
 #Great Plaza/Great project -- now, who.. who contributed this?
 gdp_republic_patrician_decision.1040.t: "$city_stroll_prefix$: [ROOT.Char.Custom('GetGreatProjectName')|l]"
 gdp_republic_patrician_decision.1040.desc: "En mi paseo por placer, me doy con la nueva historia [liege_scope.Custom('ES_DelDela')] [liege_scope.GetTitledFirstName|l] en la gran plaza: [ROOT.Char.Custom('GetGreatProjectDescription')|l].\n\nPero [local_character.Custom('ES_ElLa')] capataz parece estar un poco perdido, pues sigue mirando la hoja de nombres y sellos, mientras se rasca la cabeza: «Esta… generosa contribución… al sello le falta una parte… quién será el remitente, hum…».\n\n¿Una contribución al proyecto sin marcar? #EMP Intrigante.#!"
 gdp_republic_patrician_decision.1040.a: "«¡Mi contribución! ¡Lo logramos!»."
 gdp_republic_patrician_decision.1040.a.success: "Te llevas el crédito de la contribución"
 gdp_republic_patrician_decision.1040.a.failure: "Te pillan"
 gdp_republic_patrician_decision.1040.b: "«¡La contribución [liege_scope.Custom('ES_DelDela')] [liege_scope.GetTitledFirstNameNoTooltip|l]! ¡Espléndido!»."
 gdp_republic_patrician_decision.1040.c: "Bueno, no es asunto mío."
 gdp_republic_patrician_decision.1040.c.flavor: "Seguro que lo resolverá."
 gdp_republic_patrician_decision.1040.c.tt: "[THIS.Char.Custom('GetGreatProjectName')] gana [contribution_to_fund.GetName]"
 #The door to your study is stuck. Shucks!
 gdp_republic_patrician_decision.1100.t: "$city_stroll_prefix$: fracaso de lanzamiento"
 gdp_republic_patrician_decision.1100.desc: "Le doy una palmadita a mi bolsa en un último movimiento antes de salir de mi estudio para dar un paso por las encantadoras calles de [city_location.GetTitle.GetNameNoTier].\n\nSuena un leve #EMP golpe seco#! cuando doy con la frente en la puerta. ¡Esta maldita cosa #EMP no se abre#!! ¿Se ha hinchado?\n\nEcho un vistazo a la estancia y hay una ventana, pero la caída seguramente me rompería un hueso o dos.\n\nIntento pensar."
 gdp_republic_patrician_decision.1100.a: "«¿Ho-hola? ¿Guardias? ¡¿SIRVIENTES?!»."
 gdp_republic_patrician_decision.1100.a.flavor: "No, las paredes no se me vienen encima. No es así… ¿no?"
 gdp_republic_patrician_decision.1100.b: "¡Está bastante acolchado debajo de la ventana!"
 gdp_republic_patrician_decision.1100.b.success: "$playdate.3007.a.success$"
 gdp_republic_patrician_decision.1100.b.failure: "$playdate.3007.a.failure$"
 gdp_republic_patrician_decision.1100.c: "¡El cuerpo me pide un poco de ejercicio!"
 gdp_republic_patrician_decision.1100.d: "Creo que… volveré a mi escritorio."
 ##CUSTOM LOC
 custom_gp_expand_great_plaza_name: "Plaza aún mayor"
 custom_gp_expand_great_plaza: "la expansión de la plaza en sí"
 custom_gp_loggia: "la construcción de la logia comunal, que proporcione un refugio refinado a mercaderes y notarios por igual"
 custom_gp_improved_loggia: "la refinación de la logia comunal, que genere más espacio de oficina y ubicaciones"
 custom_gp_statute_hall: "la creación de un salón de estatutos, los cuales mantengan la ley y el orden en la ciudad"
 custom_gp_improved_statute_hall: "la expansión del salón de estatutos para aumentar el almacenamiento y las comodidades de los funcionarios"
 custom_gp_council_chamber: "la construcción de la gran sala del consejo, que permita un flujo ininterrumpido de administración en la ciudad"
 custom_gp_improved_council_chamber: "la mejora de la gran sala del consejo, que añada más bancos y comodidades"
 custom_gp_debt_office: "la fundación de la oficina de deuda pública, que equilibre el tesoro de la ciudad"
 custom_gp_improved_debt_office: "el aumento de la capacidad de la oficina de deuda pública, que mejore los controles y balances para mantener el tesoro encarrilado"
 custom_gp_civic_hospital: "la fundación del hospital cívico, donde se cuidará a los ciudadanos cuando más lo necesiten"
 custom_gp_improved_civic_hospital: "la mejora y ampliación del hospital cívico, para mantener a los ciudadanos sanos y productivos"
 custom_gp_weigh_house: "la creación de la casa de mediciones pública, para conservar la impoluta reputación de las balanzas"
 custom_gp_improved_weigh_house: "la ampliación de la casa de mediciones pública, que refuerce la seguridad para beneficio de la república"
 custom_gp_clock_tower: "la construcción de la torre del reloj cívica, que permita al público estar al tanto de la hora"
 custom_gp_improved_clock_tower: "la mejora de la torre del reloj cívica, que aumente su esplendor"
 custom_gp_civic_ward: "la construcción del pabellón cívico, donde se mantenga un registro de las futuras construcciones de la ciudad"
 custom_gp_improved_civic_ward: "la ampliación del pabellón cívico, que aumente la capacidad y cantidad de funcionarios para gestionar preceptos"
 custom_gp_league_chapter_house: "la creación de la casa del capítulo de la liga, para gestionar asambleas y mandatos de la liga"
 custom_gp_improved_league_chapter_house: "la mejora de la casa del capítulo de la liga, que permita asambleas más cómodas en nombre de la diplomacia"
 custom_gp_podesta_residence: "la construcción de la residencia de la podestá, donde alojar al líder de los funcionarios locales"
 custom_gp_improved_podesta_residence: "la mejora de la residencia de la podestá, un modo de recompensar y aumentar el atractivo del puesto de líder de los funcionarios locales"
 custom_gp_fountain: "las grandes fuentes, para disfrute del público y beneficio del esplendor de la ciudad"
 custom_gp_improved_fountain: "la mejora de las grandes fuentes que añadan grandes estanques y un acueducto"
