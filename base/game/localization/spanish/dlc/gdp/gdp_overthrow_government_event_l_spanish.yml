l_spanish:
 ####################
 ## OUTCOME EVENTS ##
 ####################
 # GOVERNMENT OVERTHROWN (Owner)
 overthrow_government_outcome.1001.t: "Gobierno derrocado"
 overthrow_government_outcome.1001.desc: "La conspiración ha alcanzado su punto culminante. Es ahora o nunca. Se ha situado a agentes clave en los barracones de la guardia de la ciudad, la asamblea y el palacio. A mi orden, se apoderarán de los mecanismos del poder y se asegurarán de que el antiguo orden es expulsado.\n\nMañana la asamblea no tendrá más elección que reconocer mi régimen y condenar a mis oponentes como enemigos del Estado."
 overthrow_government_outcome.1001.a: "Sin sangre ni exilios."
 overthrow_government_outcome.1001.b: "Mis enemigos personales."
 overthrow_government_outcome.1001.c: "Todo el que se nos oponga debe marcharse."
 # GOVERNMENT STANDS (Target)
 overthrow_government_outcome.1002.t: "La república se mantiene"
 overthrow_government_outcome.1002.desc: "Ha salido a la luz una conspiración entre mis patricios, organizada por es[owner.Custom('ES_EA')] canalla de [owner.GetShortUINameNoTooltip]. ¡Por suerte, el golpe ha chocado rápidamente contra la roca de mi gobierno glorioso!\n\nEsos bribones han intentado apoderarse de mi augusta persona, pero la guardia ha repelido el intento. La asamblea y el ejército me siguen siendo leales pese a sus viles esfuerzos."
 overthrow_government_outcome.1002.a: "¡Detenedlos a todos!"
 overthrow_government_outcome.1002.b: "Me ocuparé de ellos en su momento."
 overthrow_government_outcome.1002.c: "Encontraré fuerzas en mi corazón para perdonarles."
 overthrow_government_outcome_forgive_tt: "[owner.GetShortUIName] y sus [agents|El] son absueltos de su posición de [Concept('criminal', 'delincuentes')|E] y ya no son enemigos del Estado"
 # OVERTHROWN (Target)
 overthrow_government_outcome.1003.t: "Derrocado"
 overthrow_government_outcome.1003.desc: "«¡Mi señor[ROOT.Char.Custom('ES_XA')]!», grita [craftsman_character.GetShortUINameNoTooltip] cuando irrumpe por la puerta, con aspecto de haber tenido que correr para salvar la vida.\n\n«¡Conspiración! ¡Traición! ¡[owner.GetShortUINameNoTooltip] ha reunido simpatizantes y presiona a la asamblea para que os condene como enemig[ROOT.Char.Custom('ES_OA')] del Estado! ¡Los matones se acercan!».\n\n[craftsman_character.GetFirstNameNoTooltip] recorre la estancia como un animal enjaulado. «¿Qué hacemos?», pregunta."
 overthrow_government_outcome.1003.b.desc: "«¡Mi señor[ROOT.Char.Custom('ES_XA')]!», grita [craftsman_character.GetShortUINameNoTooltip] cuando irrumpe por la puerta, con aspecto de haber tenido que correr para salvar la vida.\n\n«¡Conspiración! ¡Traición! ¡[owner.GetShortUINameNoTooltip] ha reunido simpatizantes y presiona a la asamblea para proclamar un nuevo gobierno. En la calle se dice que os han depuesto, pero que el nuevo gobierno ha perdonado a todos sus enemigos políticos».\n\nMe mira cabizba[craftsman_character.Custom('ES_OA')]. «¿Qué hacemos?», pregunta."
 overthrow_government_outcome.1003.a: "Presentaré mi caso ante [ROOT.Char.GetLiege.Custom('ES_ElLa')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|l] y la asamblea."
 overthrow_government_outcome.1003.b: "Me exiliaré."
 overthrow_government_outcome.1003.c: "Me apartaré de la política y seré un[ROOT.Char.Custom('ES_XA')] humilde mercader."
 overthrow_government_outcome.1003.d: "Nada por ahora. Así es la marea de la política."
 # ENEMY OF THE STATE (Owner/Agents/Enemies)
 overthrow_government_outcome.1004.t: "Enemigo del Estado"
 overthrow_government_outcome.1004.1.desc: "¡Se me ha proclamado enemigo del Estado!"
 overthrow_government_outcome.1004.2.desc: "\n\nLa declaración se ha colgado en toda plaza de mercado y puerta de iglesia. Mi vida y propiedades corren peligro."
 overthrow_government_outcome.1004.3.desc: "\n\n¡Me pueden arrestar en cualquier momento!"
 overthrow_government_outcome.1004.councilor.desc: "\n\nSin duda, debido a mi posición importante en el consejo del régimen depuesto."
 overthrow_government_outcome.1004.personal.desc: "\n\nDado que [owner.GetName] me ve como un enemigo personal, es fácil adivinar por qué."
 overthrow_government_outcome.1004.political.desc: "\n\nSin duda, debido a mi posición como patrici[ROOT.Char.Custom('ES_OA')] importante con una voz prominente contra la agenda de [owner.GetHouse.GetHouseAspiration.GetName] en el nuevo régimen."
 overthrow_government_outcome.1004.conspiracy.desc: "\n\nSin duda, debido a mi posición como agente en la conspiración para derrocar al gobierno."
 overthrow_government_outcome.1004.a: "$overthrow_government_outcome.1003.a$"
 overthrow_government_outcome.1004.b: "$overthrow_government_outcome.1003.b$"
 overthrow_government_outcome.1004.c: "$overthrow_government_outcome.1003.c$"
 # DIE HAS BEEN CAST (Patricians)
 overthrow_government_outcome.1005.t: "La suerte está echada"
 overthrow_government_outcome.1005.desc: "Hay una expectativa tensa en el aire cuando [speaker.GetShortUINameNoTooltip] da un paso adelante y toma la palabra ante la asamblea.\n\n«¡Patricios! Viva la patria y la República. Me duele informaros de que nuestr[ROOT.Char.GetLiege.Custom('ES_OA')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|l] [target.GetFirstNameNoTooltip] ha sido depuest[ROOT.Char.GetLiege.Custom('ES_OA')], acusad[ROOT.Char.GetLiege.Custom('ES_OA')] de corrupción y traición contra la República…».\n\nUna oleada de exclamaciones y murmullos se apodera del salón, pero unos cuantos patricios influyentes se levantan y aplauden.\n\n«Mediante un decreto de emergencia, [owner.Custom('ES_ElLa')] ciudadan[owner.Custom('ES_OA')] [owner.GetFirstNameNoTooltip] ha intervenido para corregir el rumbo de la nave del Estado como nuestr[owner.Custom('ES_OA')] nuev[owner.Custom('ES_OA')] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|l]».\n\nLos aplausos se hacen más fuertes según se levantan más patricios."
 overthrow_government_outcome.1005.a: "¡Viva la República!"
 overthrow_government_outcome.1005.b: "¡Fuera! ¡Tiranía! ¡Traición!"
 government_overthrow_enemies.1001.b.custom: "Estos patricios se vuelven [criminals|El]:\n$EFFECT_LIST_BULLET$El [liege|El] derrocado y los [councillors|El]\n$EFFECT_LIST_BULLET$Tus [rivals|El] y [nemesis|El]\n$EFFECT_LIST_BULLET$Los personajes con #N -60#! de [opinion|El] sobre ti o menos\n$EFFECT_LIST_BULLET$Los [house_heads|El] con la [house_relation|El] de [rivalry|El]\n$EFFECT_LIST_BULLET$Pueden pedir clemencia en la [assembly|El] o exiliarse\n$EFFECT_LIST_BULLET$[friends|E], [lovers|El], [soulmates|El] y [blood_brothers|El] quedan excluidos"
 government_overthrow_enemies.1001.c.custom: "Estos patricios se vuelven en [criminals|El]:\n$EFFECT_LIST_BULLET$Todo [powerful_vassal|El] con una [house_ambition|El] diferente\n$EFFECT_LIST_BULLET$El [liege|El] derrocado y los [councillors|El]\n$EFFECT_LIST_BULLET$Tus [rivals|El] y [nemesis|El]\n$EFFECT_LIST_BULLET$Los personajes con #N -60#! de [opinion|El] sobre ti o menos\n$EFFECT_LIST_BULLET$Los [house_heads|El] con la [house_relation|El] de [rivalry|El]\n$EFFECT_LIST_BULLET$Los enemigos personales de tus [agents|El]\n$EFFECT_LIST_BULLET$Pueden pedir clemencia en la [assembly|El] o exiliarse"
 government_overthrow_populace.1001.a.custom: "Todo [county|lE] de tu [realm|lE]"
 government_overthrow_populace.1001.a.description: "Ofreces una amnistía a los oponentes del nuevo régimen."
 government_overthrow_forgiven.tt: "Se te absuelve de tus delitos contra el Estado"
 overthrow_government_outcome.tt.success.desc: "Has defendido tus acciones con elocuencia"
 overthrow_government_outcome.tt.success.toast: "Demuestras que tus acciones fueron por amor a la República"
 overthrow_government_outcome.tt.failure.desc: "Tu discurso cae en oídos sordos"
 overthrow_government_outcome.tt.failure.toast: "Se te abuchea y se te expulsa de la asamblea"
 overthrow_government_become_merchant.tt: "[ROOT.Char.GetShortUINameNoTooltip] se vuelve un[ROOT.Char.Custom('ES_XA')] mercader humilde"
 overthrow_government_enemy_of_the_state.tt: "La asamblea te ha proclamado enemigo del Estado"
 overthrow_government_amnesty.tt: "La asamblea ha ofrecido una amnistía a todos los conspiradores"
 overthrow_government_arrested.tt: "[target.GetShortUINameNoTooltip] ha ordenado que te arresten por tu papel al conspirar contra el Estado."
 overthrow_government_blanket_pardon.tt: "Gobierno derrocado: perdón"
 overthrow_government_blanket_pardon.desc: "[the_new_dodge.GetShortUINameNoTooltip] ha emitido una declaración de clemencia para todos sus enemigos políticos."
