 choose_specialized_market_selected_market_is_new_tt: "El [market|El] [market_i] seleccionado aún no es tu [market|El] [market_i] especializado"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "La compañía ha investigado las costumbres locales, los funcionarios y los hábitos comerciales de este mercado."
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "Esta compañía tiene un cuidadoso régimen de investigación de este mercado."
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "Esta compañía ya ha hecho un esquema de los puestos, almacenes y arreglos no verbales de este mercado al detalle."
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "Esta compañía conoce este mercado con la confianza de un dominio prolongado."
 pious_patronage_decision: "Patronazgo piadoso"
 pious_patronage_decision_desc: "La fe abre puertas que las monedas por si solas no pueden. Al financiar santuarios, clérigos y obras de caridad en un mercado que ya se ha unido a nuestras rutas, podemos convertir la devoción compartida en confianza comercial."
 pious_patronage_decision_tooltip: "Gastar [piety|El] [piety_i] para mejorar tu [trade_competitiveness|El] [competitiveness_i] en un [market|El] [market_i]"
 pious_patronage_decision_confirm: "Financiar a los fieles"
