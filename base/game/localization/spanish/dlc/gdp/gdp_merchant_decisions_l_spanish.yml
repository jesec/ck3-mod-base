 gdp_sponsor_merchant_company_decision: "Patrocinar mercader"
 gdp_sponsor_merchant_company_decision_desc: "El comercio es un negocio célebre por su suciedad y no es para alguien de mi refinamiento. Dicho esto, ¿no tendré a alguien en mi corte que pueda ser mi mercader personal y llevarlo a cabo por mí?"
 gdp_sponsor_merchant_company_decision_tooltip: "Financia a uno de tus [courtiers|El] para que encuentre una [company|El] [Concept('merchant', 'mercante')|E] que empiece como tu [client|El]"
