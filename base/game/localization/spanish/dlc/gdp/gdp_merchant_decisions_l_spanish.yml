 wipe_slate_merchant_decision: "Tabla rasa"
 wipe_slate_merchant_decision_desc: "¿Debe alguien sufrir por siempre por los delitos cometidos en las circunstancias más extremas? ¿No tienen todos los [ROOT.Char.GetFaith.GetAdherentNamePlural] derecho a un camino a la redención?\n\nCon tiempo, energías y —lo más importante— #EMP monedas#!, el mundo entero puede perdonar toda clase de pecados."
 wipe_slate_merchant_decision_tooltip: "Expía tu reputación como [GetTrait('dealbreaker').GetName( GetNullCharacter )|l]"
 wipe_slate_merchant_decision_confirm: "¡La cosa mejora día a día!"
 merchant_spending_spree_decision: "Frenesí de gastos"
 merchant_spending_spree_decision_desc: "Año tras año peso, valoro y regateo por artículos destinados a otras casas, y ni una sola vez para mí. Me sentaría bien pasar un día entre los puestos con la bolsa abierta para comprar aquello que me llame la atención."
 merchant_spending_spree_decision_tooltip: "Gasta [gold|El] en el [market|El] libremente para aliviar tu [stress|El] y el de tus [associates|lE] y ganar [prestige|El], con la posibilidad de ganar un [domicile_artifact|El]"
