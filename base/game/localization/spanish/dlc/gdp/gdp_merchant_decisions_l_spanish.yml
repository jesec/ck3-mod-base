l_spanish:
 gdp_repudiate_usurious_loan_decision: "Denunciar un préstamo usurario"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip] redactó descaradamente un préstamo con intereses y nuestros [ROOT.Char.GetRite.PriestNeuterPlural] sostienen que semejante acuerdo no puede atar a nadie. Que la deuda quede anulada en lugar de pagada.\n\nNo es un robo, sino la ley [ROOT.Char.GetRite.GetAdjectiveNoTooltip], si bien todo mercader entre aquí y el mar lo considerará un robo."
 gdp_repudiate_usurious_loan_decision_tooltip: "Que tu [clergy|El] anule la deuda por ser [usury|El]; te quedarás el [gold|El] a costa de tu reputación entre los [merchants|El]"
 gdp_repudiate_usurious_loan_decision_confirm: "¡Ningún contrato hecho en pecado me ata!"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "No te puedes permitir devolver este [loan|El]"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "No has denunciado a un [creditor|El] recientemente"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X Es poco probable que los [merchants|El] te extiendan un crédito en el futuro inmediato#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "Tu [rite|El] debe considerar el préstamo un pecado, y un gobernante del [clergy|El] de tu [faith|El] debe estar lo bastante cerca para anularlo: debe ser alguien cuyo [rite|El] lo acepte, que no sea ni tu [creditor|El] ni tu [rival|El] y que no esté en guerra contigo\n#weak Tu [head_of_faith|El], el titular de la [clerical_region|El] de tu capital o de tu ubicación o cualquier miembro del [clergy|El] en el señorío de tu [top_liege|El].#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "Tu [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|El] debe respaldarte: debe tener una [opinion|El] #P positiva#! de ti o ser tu [puppet|El] con un [strong_hook|El]"
 become_merchant_decision: "Hacerse mercader"
 become_merchant_decision_desc: "¿De qué sirve trabajar en la corte si no se conocen las costumbres de los hombres? El deseo de viajar al extranjero y de convertirse en alguien que una señoríos… es demasiado fuerte como para ignorarlo."
 become_merchant_decision_tooltip: "Retirar tus [titles|El] y fundar una [company|El] de [Concept('merchant', 'mercaderes')|E]"
 become_merchant_decision_confirm: "¡Es el momento de comerciar!"
 become_merchant_decision_house_head_tt: "Debes ser [house_head|lE]"
 gdp_recently_became_adventurer_decision_cooldown_tt: "Llevas #V 5 años#! siendo [adventurer|El]"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U] ya no deberá un préstamo a [Select_CString(repudiated_lender.IsLocalPlayer,'tu personaje', repudiated_lender.GetShortUIName)]"
 abuse_charter_authority_decision: "Abusar de autoridad del privilegio"
 abuse_charter_authority_decision_tooltip: "Usar tu [charter|El] para obtener [gold|El] [gold_i|E] y aumentar tu [competitiveness|El] [competitiveness_i|E]"
 abuse_charter_authority_decision_desc: "Llevo un privilegio [ROOT.Char.GetSuzerain.Custom('ES_DelDela')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], que equipara la voluntad de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] con la ley. Con la soberanía del señorío respaldándonos, nadie se interpondrá entre nosotros y nuestros intereses."
 abuse_charter_authority_decision_confirm: "¡Actúo en nombre [ROOT.Char.GetSuzerain.Custom('ES_DelDela')] [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip|l]!"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "Aquí no se reconoce la autoridad del [gurkhan|lE]"
 abuse_charter_authority_decision.region_already_abused: "Estas tierras ya han sufrido el abuso de la autoridad del [gurkhan|lE]"
 abuse_charter_authority_decision.nothing_to_abuse: "No hay tierra apta para abusar en esta [location|lE]"
 gdp_charter_abused_market_modifier: "Abuso de autoridad del privilegio"
 gdp_charter_abused_market_modifier_desc: "Este personaje ha abusado de la autoridad que le concedía su privilegio en favor de su compañía."
 gdp_charter_abused_market_county_modifier: "Abuso de autoridad del privilegio"
 gdp_charter_abused_market_county_modifier_desc: "Una compañía de mercaderes se ha aprovechado de su privilegio para explotar este condado y enriquecerse."
 gdp_charter_leveraged_market_modifier: "Apartados por una compañía con privilegios"
 gdp_charter_leveraged_market_modifier_desc: "La compañía de este personaje ha visto desplomarse su fortuna debido a los privilegios que el gobernante del señorío ha otorgado a su rival."
 gdp_charter_charitable_market_county_modifier: "Desarrollo por mandato de privilegio"
 gdp_charter_charitable_market_county_modifier_desc: "Una compañía de mercaderes ha usado su privilegio para intervenir directamente y desarrollar este condado."
 gdp_decision.1000.t: "Interés del patrón"
 gdp_decision.1000.desc: "Un mensajero trae noticias de los salones [patron.Custom('ES_DelDela')] [patron.GetTitledFirstNameNoTooltipRegnal|l], donde se lanzaron acusaciones sobre los abusos de mi compañía ante mi patr[patron.Custom('ES_OnOna')], que observaba impertérrit[patron.Custom('ES_OA')].\n\nMe dijeron que los magistrados enumeraron minuciosamente sus alegaciones sobre mi mala conducta, y que [patron.Custom('ES_ElLa')] [patron.GetTitleAsNameNoTooltip|l] poco a poco se volvió en mi contra.\n\nMi patrón ahora exige una respuesta inmediata, en la que dé explicaciones sobre dichos abusos…"
 gdp_decision.1000.a: "«Acepto el juicio»."
 gdp_decision.1000.b: "«Seguro que entenderéis que lo hice por el señorío…»."
 gdp_decision.1000.b.success: "Tu patr[patron.Custom('ES_OnOna')] tiene piedad"
 gdp_decision.1000.b.failure: "Tu patr[patron.Custom('ES_OnOna')] se enfada"
 gdp_decision.1000.a.effects: "Tu [merchant_patron|El] obtiene un [imprisonment_reason|El] y un [execute_reason|El] contra ti"
 gdp_decision.1000.a.severe_effects: "Tu [merchant_patron|El] obtiene un [imprisonment_reason|lE] y un [execute_reason|lE] contra ti y tus [close_family_members|lE]."
 gdp_decision.1000.a.survived_patrons_wrath: "A pesar de haber soportado la ira de tu [merchant_patron|El], no podrás volver a abusar de su autoridad"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "Como [ROOT.Char.GetTitleAsNameNoTooltip|l], los comerciantes de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] operan en mi nombre, y nadie lo hace más que aquellos a los que se les han otorgado cartas de privilegios con mi sello.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$Parece que un[merchant.Custom('ES_XA')] mercader, [merchant.GetName], se ha aprovechado de mi favor, haciendo alarde de su autoridad privilegiada para enriquecerse a costa de la gente.\n\nEs indignante que se tome estas libertades, pero debo valorar los beneficios que comerciantes como [merchant.GetSheHe] traen al señorío."
 gdp_decision.1010.a: "¡[merchant.GetSheHe|U] responderá por esto!"
 gdp_decision.1010.a.tt: "Otros [clients|El] con tus [charters|El] estarán menos dispuestos a abusar de tu autoridad si se [Concept('imprisoned', 'encarcela')|E] a [merchant.GetShortUIName]."
 gdp_decision.1010.b: "Lo dejaré pasar… por ahora."
 gdp_decision.1010.c: "Estas rencillas entre tenderos están por debajo de mí."
 gdp_decision.1010.c.flavor: "Puede que haya nuevos abusos de tu autoridad, pero ya no se te notificarán más"
 gdp_decision.1010.d: "¿[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]…? ¡Yo nunca le di ningún privilegio!"
 gdp_decision.1020.t: "En el nombre [patron.Custom('ES_DelDela')] [patron.GetTitleAsNameNoTooltip|l]"
 gdp_decision.1020.opening: "Con solo agitar mi carta de privilegio, las puertas de [market_province.GetBaronyNameExplicitly] y las oficinas de sus magistrados se abrirán en nombre [patron.Custom('ES_DelDela')] [patron.GetTitledFirstName|l].\n\n"
 gdp_decision.1020.market_holder: "El pez gordo de la zona, [market_holder.Custom('ES_ElLa')] [market_holder.GetTitledFirstName|l], ha dejado claro su descontento, bramando que [patron.Custom('ES_ElLa')] [patron.GetTitleAsNameNoTooltip|l] se enterará de esto, pero sus ladridos son nada. Este documento no admite discusión.\n\n"
 gdp_decision.1020.closing: "Ahora que controlo la ciudad a mi antojo, los agentes de la compañía podrán asegurar las instalaciones comerciales, apoderarse de mercancías sin los documentos apropiados y causar problemas a nuestros competidores con acusaciones y reclamaciones espurias."
 gdp_decision.1020.a: "Nadie se interpondrá en nuestro camino."
 gdp_decision.1020.b: "Deberíamos incluir [market_holder.Custom('ES_AlAla')] [market_holder.GetTitledFirstNameNoTooltip|l]."
 gdp_decision.1020.c: "He cambiado de idea."
 gdp_decision.1020.d: "«Mi #EMP inspección#! ha concluido. Esta vez…»."
 gdp_decision.1020.b.success: "Ni una palabra [patron.Custom('ES_AlAla')] [patron.GetTitleAsNameNoTooltip|l]"
 gdp_decision.1020.b.failure: "[patron.Custom('ES_ElLa')|U] [patron.GetTitleAsNameNoTooltip|l] se ha enterado de este abuso"
 benevolent_charter_authority_decision: "Inversión local directa"
 benevolent_charter_authority_decision_tooltip: "Usar tu [charter|El] para desarrollar un [building|El] [building_i|E] y aumentar la [prosperity|El] [prosperity_i|E]"
 benevolent_charter_authority_decision_desc: "Con la sanción [ROOT.Char.GetSuzerain.Custom('ES_DelDela')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], tengo influencia para intervenir directamente en el señorío, lo que normalmente estaría fuera de las competencias de una simple compañía de mercaderes."
 benevolent_charter_authority_decision_confirm: "Se puede hacer mucho bien en nombre [ROOT.Char.GetSuzerain.Custom('ES_DelDela')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l]."
 merchant_charter_intervention_county_cooldown: "No ha intervenido en [THIS.Char.GetDomicile.GetLocation.GetName] en los últimos #V 5#! años#!"
 gdp_decision.1200.t: "El placer de un patrón"
 gdp_decision.1200.desc: "Se dice en los salones [patron.Custom('ES_DelDela')] [patron.GetTitledFirstNameNoTooltipRegnal|l] que se ha alabado efusivamente la iniciativa de mi compañía ante mi complacid[patron.Custom('ES_OA')] patrón.\n\nVarios testigos se deshicieron en elogios a [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] y sus recientes intervenciones.\n\nEn consecuencia, [patron.Custom('ES_ElLa')] [patron.GetTitleAsNameNoTooltip|l] ha enviado un mensaje a la compañía: «Querid[ROOT.Char.Custom('ES_OA')] [ROOT.Char.GetTitledFirstNameNoTooltip|l], ¡vuestros esfuerzos son un orgullo para el señorío!»."
 gdp_decision.1200.a: "«La compañía se complace en ser de utilidad»."
 gdp_decision.1200.b: "«Agradezco el reconocimiento, pero también su recompensa»."
 gdp_decision.1200.b.flavor: "Con el debido respeto…"
 gdp_decision.1200.b.success: "Tu patr[patron.Custom('ES_OnOna')] es generos[patron.Custom('ES_OA')]"
 gdp_decision.1200.b.failure: "Tu patr[patron.Custom('ES_OnOna')] se decepciona"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$¡Parece que ciert[merchant.Custom('ES_OA')] comerciante, [merchant.GetName], ha usado su autoridad privilegiada en beneficio del señorío y ha invertido en el desarrollo de [market_province.GetBaronyNameExplicitlyNoTooltip]!\n\nSemejante conducta meritoria es digna de elogio, aunque probablemente ofrecer algún incentivo fomente una mayor benevolencia."
 gdp_decision.1210.a: "Deberíamos incentivar una iniciativa así."
 gdp_decision.1210.a.tt: "Otros [clients|El] con tus [charters|El] estarán más dispuestos a ejercer tu autoridad con benevolencia"
 gdp_decision.1210.b: "¡Por [ROOT.Char.GetFaith.HighGodName], quizás #EMP sí#! que existan los comerciantes honestos!"
 gdp_decision.1210.c: "No me molestéis con asuntos tan triviales."
 gdp_decision.1210.c.flavor: "Puede que se produzcan nuevos ejercicios benevolentes de tu autoridad, pero ya no se te notificarán más"
 gdp_decision.1220.t: "En el nombre [patron.Custom('ES_DelDela')] [patron.GetTitleAsNameNoTooltip|l]"
 gdp_decision.1220.opening: "Mis incorporaciones a [market_province.GetBaronyNameExplicitly], con la carta de privilegio en mano, al principio causaron consternación entre los magistrados locales, pero pronto dejé claro que las intenciones de mi compañía eran buenas.\n\n"
 gdp_decision.1220.market_holder: "El pez gordo local, [market_holder.Custom('ES_ElLa')] [market_holder.GetTitledFirstName|l], escucha mi propuesta con interés tentativo, y encuentra cierto mérito en animar la producción y el comercio entre sus súbditos.\n\n"
 gdp_decision.1220.closing: "Al dar vueltas por el lugar, se hacen evidentes varias zonas que necesitan reparaciones y mejoras, señaladas por los residentes."
 gdp_decision.1220.a: "«Bueno, ¿a qué esperamos?»."
 gdp_decision.1220.d: "«Es todo muy interesante, pero hay otros asuntos…»."
 press_the_advantage_decision: "Aprovechar la ventaja"
 press_the_advantage_decision_desc: "Nuestros éxitos recientes han desestabilizado a nuestros rivales y han generado incertidumbre en los mercados. Es el momento de invertir en agentes y favores, y convertir la influencia ganada con tanto esfuerzo en una estrategia que transforme la presión en ganancias."
 press_the_advantage_decision_tooltip: "Gastar [competitive_pressure|El] [competitive_pressure_i] para ganar [trade_competitiveness|El] [competitiveness_i] en una [trade_route|El] durante un tiempo"
 press_the_advantage_decision_confirm: "Aprovechemos la ventaja."
