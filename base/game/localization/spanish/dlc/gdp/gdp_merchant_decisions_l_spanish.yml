 merchant_write_travelogue_decision_desc: "Desde los campesinos hasta su [ROOT.Char.GetSuzerain.GetTopLiege.GetTitleAsNameNoTooltip|l], la gente de [ROOT.Char.GetSuzerain.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] y el mundo entero están deseando escuchar historias sobre tierras distantes y pueblos exóticos."
 merchant_write_travelogue_decision_tooltip: "Comienza a trabajar en un [artifact|El] de libro de tipo diario de viajes basado en tus experiencias"
