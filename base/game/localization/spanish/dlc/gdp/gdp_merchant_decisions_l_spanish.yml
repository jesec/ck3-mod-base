 gdp_decision.2000.t: "$forge_charter_decision$"
 gdp_decision.2000.desc: "Con una caligrafía creativa y una astuta imitación de los sellos, ceras y otros símbolos oficiales, el falsificador sin escrúpulos crea una obra digna de alabanza.\n\nMe atrevo a decir que este tipo de documentos, siempre que no se examinen con atención, podrían engañar al ojo más experto…"
 gdp_decision.2000.a: "Debemos tener cuidado."
