 pious_patronage_market_modifier: "Patronazgo piadoso"
 pious_patronage_market_modifier_desc: "Esta compañía se beneficia de un patronazgo religioso en este mercado."
 organize_the_venture_decision: "Organizar la empresa"
 organize_the_venture_decision_desc: "Ya hay en curso una empresa prometedora. Con calendarios firmes, instrucciones estrictas y la influencia de la compañía detrás de ella, se puede obligar a que la obra avance."
