 CRAFT_ARTIFACT_DECISION_NEXT_STEP_BUTTON: "Elegir artefacto"
 craft_artifact: "Fabricar artefacto"
 craft_artifact_action: "Fabricar artefacto"
 craft_artifact_desc: "Intentaré producir un [domicile_artifact|El] de [company|El]."
 craft_artifact_desc_general: "La [scheme|El] $craft_artifact$ es una [personal_scheme|El] en la que tu [company|El] y tú intentáis crear un [domicile_artifact|El] totalmente nuevo. Esta conjura depende en su mayor parte de tu [stewardship|El].\n\nLa [success_chance|El] se ve afectada por muchas cosas, pero sobre todo por tu [stewardship_skill|El] y la [aptitude|El] de tu $antiquarian_merchant$."
 CRAFT_ARTIFACT_SUCCESS_DESC: "Crear un [domicile_artifact|El] nuevo"
 craft_artifact_invalidated_title: "Termina la conjura $craft_artifact$"
 craft_artifact_scheme.1000.t: "$craft_artifact$: éxito"
 craft_artifact_scheme.1000.intro.curio: "Me he pasado una noche tras otra en el taller, con un asociado o un[ROOT.Char.Custom('ES_XA')] integrante de los gremios locales a mi lado, dando forma a un objeto u otro."
 craft_artifact_scheme.1000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\n¡Pero hoy al fin puedo decir que tanto trabajo ha dado sus frutos! Al mirar la pieza, cada una de las marcas que dejó mi esfuerzo me saca una sonrisa y solo pienso en dónde exhibirla con orgullo."
 craft_artifact_scheme.1000.intro.library: "Me he pasado una noche tras otra encorvad[ROOT.Char.Custom('ES_OA')] en mi estudio, con las manos manchadas de tinta que garabatean entre calambres, mientras las velas se consumen."
 craft_artifact_scheme.1000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\n¡Pero hoy al fin puedo decir que tanto trabajo ha dado sus frutos! Al mirar la pieza, cada párrafo me saca una sonrisa y solo pienso en que otros lean sus líneas."
 craft_artifact_scheme.1000.desc.curator: "\n\nLos ojos de mi conservador[curator.Custom('ES_XA')], [curator.GetFirstName], se iluminan al examinar la obra. «Es un #EMP auténtico#! logro, [ROOT.Char.GetTitleAsNameNoTooltip|l]»."
 craft_artifact_scheme.1000.a: "El esfuerzo ha valido la pena."
 craft_artifact_desc_curio: "[newly_created_artifact.GetDesc]\n\nObra [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitledFirstName|l] de [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_desc_library: "[newly_created_artifact.GetDesc]\n\nObra [ROOT.Char.Custom('ES_DelDela')] [ROOT.Char.GetTitledFirstName|l] de [ROOT.Char.GetPrimaryTitle.GetName|l]."
 craft_artifact_scheme.2000.t: "$craft_artifact$: fracaso"
 craft_artifact_scheme.2000.desc.curio: "$craft_artifact_scheme.1000.intro.curio$\n\nCada intento de hacer realidad mi idea se ha visto frustrado por fallos de cálculo o malentendidos, y la estancia está llena de restos de intentos abandonados que no se pudieron reaprovechar…"
 craft_artifact_scheme.2000.desc.library: "$craft_artifact_scheme.1000.intro.library$\n\nCada mañana, restos descartados de escritura ensucian el suelo y las pocas partes que he conservado fallan de un modo u otro en hacer realidad la magnitud de mi intento…"
 craft_artifact_scheme.2000.desc.curator: "\n\nMi conservador[curator.Custom('ES_XA')], [curator.GetFirstName], suspira al mirar los magros resultados de mis esfuerzos. «¿No será quizás hora de aceptar la derrota?»."
 craft_artifact_scheme.2000.a: "Me he hartado de esto…"
 craft_artifact_scheme.2000.b: "¡pero mi trabajo no puede desperdiciarse!"
