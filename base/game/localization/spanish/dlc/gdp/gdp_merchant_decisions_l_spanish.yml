 gdp_sponsor_merchant_company_decision_costs_tt: "Coste de cada [company_size|El] inicial:\n$BULLET_WITH_TAB$[GetLaw('company_size_small').GetName]: [SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_small_value')|0] @gold_icon!\n$BULLET_WITH_TAB$[GetLaw('company_size_medium').GetName]: [SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_medium_value')|0] @gold_icon!\n$BULLET_WITH_TAB$[GetLaw('company_size_large').GetName]: [SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_large_value')|0] @gold_icon!\n$BULLET_WITH_TAB$[GetLaw('company_size_huge').GetName]: [SCOPE.ScriptValue('gdp_sponsor_merchant_company_cost_huge_value')|0] @gold_icon!"
