 merchant_competitive_pressure_route_modifier: "Ventaja aprovechada"
 merchant_competitive_pressure_route_modifier_desc: "Esta ruta comercial es el foco de atención de agentes que saben exactamente en qué punto son vulnerables los competidores."
 choose_specialized_market_decision: "Elegir mercado especializado"
 choose_specialized_market_decision_desc: "Una compañía que entiende a los funcionarios, hábitos y canales ocultos de un mercado puede convertir calles extrañas en un hogar. Al centrar a nuestros inspectores en un mercado de nuestras rutas, podemos convertir el conocimiento local en ventaja comercial."
 choose_specialized_market_decision_tooltip: "Elige un [market|El] [market_i] en una de tus [trade_routes|El] [route_i] para recibir la bonificación de especialización de tu inspector"
 choose_specialized_market_decision_confirm: "Estudiar el mercado"
