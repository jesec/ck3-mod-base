 set_company_focus_decision: "Fijar enfoque de compañía"
 set_company_focus_decision_desc: "Una compañía no vive solo de libros de cuentas. Obligaciones públicas, márgenes privados y el trabajo cotidiano del comercio, todos compiten por conseguir atención."
 set_company_focus_decision_tooltip: "Elegir un enfoque en curso para tu compañía de mercaderes"
 set_company_focus_decision_confirm: "Fijar enfoque"
 company_focus_none_name: "Sin enfoque de compañía"
 company_focus_none_desc: "Detener tu enfoque de compañía actual."
