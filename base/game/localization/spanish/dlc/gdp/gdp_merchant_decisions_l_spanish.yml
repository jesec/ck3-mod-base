 gdp_decision.3010.t: "En la compañía de [sponsored_courtier.GetNameNoTooltip]"
 gdp_decision.3010.desc: "«¡Es un honor que deseéis depositar en mí esta responsabilidad! Me aseguraré de que todos vuestros [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] cuenten».\n\n[sponsored_courtier.GetNameNoTooltip] parece entusiasmad[sponsored_courtier.Custom('ES_OA')], incluso aunque no supiera que iba a ser mi mercader de confianza antes de entrar en la estancia.\nQuizás sea la idea de la financiación inicial y de gastarla para montar su propia compañía lo que le atrae más que cumplir una ambición de toda la vida."
 gdp_decision.3010.a: "Os daré lo suficiente para ir tirando."
 gdp_decision.3010.b: "Se subvencionan todos los gastos básicos."
 gdp_decision.3010.c: "Una cantidad considerable de capital garantizará el éxito."
 gdp_decision.3010.d: "¡No repararemos en gastos!"
 gdp_decision.3010.e: "Podemos pensárnoslo un poco más."
