 gdp_decision.3000.desc: "Busco mercaderes trabajadores y admirables como vos, que se reubiquen en [new_patron.GetPrimaryTitle.GetDefinitiveName].\n\nA cambio, garantizaré que os beneficiéis de nuestros mercados."
