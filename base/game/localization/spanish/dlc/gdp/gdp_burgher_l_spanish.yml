 gdp_burgher.0001.desc: "Nosotros, los [burgher_county.Custom('BurgherPluralNoun')] de [burgher_county.GetNameNoTier], os pedimos que nos concedáis [burgher_county.Custom('BurgherDemandedPrivilege')], para que nuestro pueblo prospere y traiga grandes riquezas a vuestro señorío."
 gdp_burgher.0001.a: "Es un propuesta razonable. Le concedo mi aprobación."
 gdp_burgher.0001.b: "¡Me niego!"
 gdp_burgher.0001.opening: "A nuestr[ROOT.Char.Custom('ES_OA')], [ROOT.Char.Custom('LadyLordWomanMan')],"
 gdp_burgher.0010.desc: "Nos, los [burgher_county.Custom('BurgherPluralNoun')] de [burgher_county.GetNameNoTier], os pedimos que nos concedáis la libertad para gobernarnos a nosotros mismos, elegir a nuestros propios líderes y gestionar nuestros asuntos en nuestro nombre o, si no, nos veremos obligados a tomar a la fuerza lo que no nos concedáis por vuestra gracia."
 gdp_burgher.0010.a: "Dadles la libertad."
 gdp_burgher.0010.b: "Que luchen por sus #EMP «derechos»#!."
 gdp_burgher.0020.t: "La libertad de [freed_county.GetNameNoTierNoTooltip]"
 gdp_burgher.0020.desc: "[freed_county.GetNameNoTier] se ha ganado la libertad, y con ella, el privilegio de gobernarse a sí mismos y nombrar a sus propios magistrados.\n\nNada de ello, por supuesto, hubiera sido posible sin #EMP mi#! apoyo."
 gdp_burgher.0020.desc.assembly_head: "[freed_county.GetNameNoTier] se ha ganado la libertad, y con ella, el privilegio de gobernarse a sí mismos y nombrar a sus propios magistrados.\n\nNada de ello, por supuesto, hubiera sido posible sin #EMP mi#! apoyo."
 gdp_burgher.0020.a: "La carga del liderazgo es una que aceptaré con agrado."
 gdp_burgher.0020.b: "Asumiré mi lugar entre sus magistrados."
 gdp_burgher.0020.c: "Su buena voluntad será beneficio suficiente."
 gdp_burgher_agitator_not_republic_head_tt: "#bold No#! debes dirigir ya una [republic|El]"
 gdp_burgher_agitator_outranks_republic_head_tt: "Tu [title_tier|El] debe ser inferior al [burgher_ruler.Custom('ES_DelDela')] [burgher_ruler.GetTitledFirstName|l]"
 gdp_civic_agitation.0001.t: "Libertad prendida"
 gdp_civic_agitation.0001.desc: "Todo ha encajado en su sitio. El pueblo de [target.GetNameNoTier] arde con el deseo más fervoroso de libertad cívica que mis agentes han podido inflamar, mientras que sus líderes pronuncian discursos apasionados sobre impuestos onerosos y magistrados injustos en la plaza del mercado.\n\nMe dicen que una delegación se prepara para acudir a su señor para exigir el derecho a gobernarse a sí mismos. La única cuestión que queda es si yo cabalgaré con ellos."
 gdp_civic_agitation.0001.a: "Ya que he llegado hasta aquí, tendré que llegar hasta el final."
 gdp_civic_agitation.0001.b: "Deben marchar con fuerza, montados y armados, con todo pagado por mí."
 gdp_civic_agitation.0001.c: "Que las masas crean que es idea suya. Los que importan saben la verdad."
 gdp_civic_agitation.0001.c.exposed: "Asumámoslo y no les prometamos más"
 gdp_civic_agitation_sponsor_joins_war_tt: "Te unirás a la [war|El] junto a los [agitated_county.Custom('BurgherPluralNoun')], si su gobernante los rechaza"
 gdp_civic_agitation_sponsor_war_chest_tt: "Financiarás una compañía de soldados profesionales en caso de que estalle una guerra"
 gdp_civic_agitation.0002.t: "Dinero mal empleado"
 gdp_civic_agitation.0002.desc: "Se redactó una lista de agravios, se leyó ante el pueblo de [target.GetNameNoTier] y sus líderes se reunieron y no hicieron #EMP nada#!.\n\nMis agentes no tienen información de lo que ocurrió, más allá de lo evidente. Mi dinero compró todo lo que podían necesitar, salvo el valor para #EMP usarlo#!."
 gdp_civic_agitation.0002.a: "No me olvidaré de esta perfidia pusilánime."
 found_the_hanseatic_league_decision: "Fundar la Liga Hanseática"
 found_the_hanseatic_league_decision_tooltip: "Une a los [counties|El] de tu [trade_league|El] en una confederación mercantil más poderosa todavía"
 found_the_hanseatic_league_decision_confirm: "En la concordancia encontramos la prosperidad"
 found_the_hanseatic_league_decision_desc: "Los reyes imaginan que el poder lleva corona y porta espada. Nosotros conocemos una verdad distinta. El poder llega envuelto en pieles, huele a pesado y porta libros de cuentas que registran sumas que arruinarían a reinos.\n\nSolos se nos grava, saquea y amenaza para que seamos dóciles; unidos no hay poder en los mares del norte que se nos resista. Ningún puerto rechazará a nuestras naves, los artículos de ningún mercader extranjero serán más baratos que los nuestros, ni ningún príncipe deseará impugnar nuestros privilegios."
 found_the_hanseatic_league_cohesion_tt: "La [trade_league|El] debe tener al menos #V 95#! de [cohesion|El]"
 found_the_hanseatic_league_members_tt: "La [trade_league|El] debe tener #V 4#! miembros"
 found_the_hanseatic_league_message_title: "Ha nacido una hansa"
 found_the_hanseatic_league_message_desc: "[hanse_founder.GetUIName|U] [Select_CString(hanse_founder.IsLocalPlayer, 'has', 'ha')] unido la liga para formar una hansa juramentada."
 league_needs_liege_consent_tt: "Como [vassal|El], debes tener el consentimiento de tu [liege|El] o ser una ciudad libre para unirse por voluntad propia"
 gdp_hanseatic.0010.opening: "De la [the_league.GetName],"
 gdp_hanseatic.0010.desc: "Tenéis derechos comerciales propios para vuestro beneficio y el de nadie más.\n\nTales acuerdos individuales nos socavan. Os pedimos que los cedáis en nuestro favor, para que todos prosperemos juntos."
 gdp_hanseatic.0010.a: "Los cederemos a la [the_league.GetName]."
 gdp_hanseatic.0010.b: "Se los conferiré a [hanse_city_title.GetNameNoTier]."
 gdp_hanseatic.0010.c: "Esos derechos son míos, #EMP y míos seguirán siendo#!."
