 civic_privileges_county_modifier: "Privilegios cívicos"
 civic_privileges_county_modifier_desc: "A este condado se le han concedido privilegios cívicos menores, ninguno de ellos ha quedo registrado en un privilegio superior."
 civic_privilege_market_rights_1_county_modifier: "Derechos de mercado limitados"
 civic_privilege_market_rights_1_county_modifier_desc: "A este condado se la ha concedido el derecho a celebrar un mercado bajo las medidas y supervisión de su señor."
 civic_privilege_market_rights_2_county_modifier: "Derechos de mercado"
 civic_privilege_market_rights_2_county_modifier_desc: "A este condado se le han concedido balanzas y días de mercados propios y mantiene una cuota sustancial de comercio."
 civic_privilege_market_rights_3_county_modifier: "Derechos de mercado extensos"
 civic_privilege_market_rights_3_county_modifier_desc: "A este condado se le ha concedido un control casi total de su mercado y deja a su señor con una exigua cuota de comercio."
 civic_privilege_guild_rights_1_county_modifier: "Derechos de gremios limitados"
 civic_privilege_guild_rights_1_county_modifier_desc: "A los artesanos de este condado se les ha concedido el derecho a organizarse, si bien sus maestros aún responden ante la corte del señor."
 civic_privilege_guild_rights_2_county_modifier: "Derechos de gremios"
 civic_privilege_guild_rights_2_county_modifier_desc: "A los gremios de este condado se les ha concedido el derecho a fijar sus propios estándares y aceptar a sus propios maestros."
 civic_privilege_guild_rights_3_county_modifier: "Derechos de gremios extensos"
 civic_privilege_guild_rights_3_county_modifier_desc: "A los gremios de este condado se les ha concedido un control casi total de sus oficios y de lo que se hace en ellos."
 civic_privilege_tax_exemption_1_county_modifier: "Exención parcial de impuestos cívicos"
 civic_privilege_tax_exemption_1_county_modifier_desc: "A la ciudad de este condado se le ha concedido una reducción de algunas de las obligaciones que debe a su señor."
 civic_privilege_tax_exemption_2_county_modifier: "Exención de impuestos cívicos"
 civic_privilege_tax_exemption_2_county_modifier_desc: "A la ciudad de este condado se le ha concedido el derecho a recaudar sus propios impuestos a los tipos que ellos elijan."
 civic_privilege_tax_exemption_3_county_modifier: "Exención extensa de impuestos cívicos"
 civic_privilege_tax_exemption_3_county_modifier_desc: "A la ciudad de este condado se le ha eximido de la mayoría de sus impuestos y entrega poco más allá de una suma simbólica."
 civic_privilege_militia_charter_1_county_modifier: "Privilegio de milicia limitado"
 civic_privilege_militia_charter_1_county_modifier_desc: "A la ciudad de este condado se le ha concedido una guardia propia, siempre y cuando no se aventure más allá de sus murallas."
 civic_privilege_militia_charter_2_county_modifier: "Privilegio de milicia"
 civic_privilege_militia_charter_2_county_modifier_desc: "A la ciudad de este condado se le ha concedido una milicia propia y pocas de sus tropas marchan por su señor."
 civic_privilege_militia_charter_3_county_modifier: "Privilegio de milicia extenso"
 civic_privilege_militia_charter_3_county_modifier_desc: "A la ciudad de este condado se le ha concedido el derecho a armarse y solo cede a su señor unos pocos soldados simbólicos."
