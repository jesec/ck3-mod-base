 BURGHER_WAR_NAME: "Revuelta cívica [ATTACKER.GetCulture.GetNameNoTooltip]"
 burgher_war_victory_desc: "Todo [county|El] rebelde se convierte en una [republic|El] autogobernada, comenzando con [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_chartered' )|Vl], y moviendo su [capital|El] a la ciudad más grande del [county|El] si es necesario. Tres o más formarán una #V $confederation_type_trade_league_name$#!"
 burgher_war_victory_free_city_desc: "Todo [county|El] rebelde se convierte en una [republic|El] autogobernada, comenzando con [GetSubjectContractType( 'republic_government_free_city' ).GetObligationName( 'republic_government_free_city_granted' )|Vl], y moviendo su [capital|El] a la ciudad más grande del [county|El] si es necesario. Tres o más formarán una #V $confederation_type_trade_league_name$#!"
 burgher_war_white_peace_desc: "La [faction|El] se deshace y al [county|El] principal se le concede un privilegio cívico menor. Sus condados no volverán a crear otra [faction|El] en favor de la $FACTION_BURGHER_AUTONOMY_NAME$ durante [EmptyScope.ScriptValue('burgher_white_peace_cooldown_years_value')|0] años."
 burgher_war_defeat_desc: "La [faction|El] se deshace y todo [county|El] rebelde pierde cualquier privilegio cívico que tuviera, junto con [popular_opinion|El]. Sus condados no volverán a crear otra [faction|El] en favor de la $FACTION_BURGHER_AUTONOMY_NAME$ durante [EmptyScope.ScriptValue('burgher_defeat_cooldown_years_value')|0] años."
