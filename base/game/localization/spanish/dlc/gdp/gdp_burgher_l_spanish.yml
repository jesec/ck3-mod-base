 gdp_civic_agitation_scheme_desc_general: "$gdp_civic_agitation_scheme$ es una [hostile_scheme|El] que busca incitar a un [county|El] para que exija autogobierno a su [ruler|El]. Es una [secret_scheme|El] basada en la [intrigue|El], que permite reclutar [agents|El].\n\n$gdp_civic_agitation_scheme$ con éxito provocará que el [county|El] objetivo cree una [faction|El] por la $FACTION_BURGHER_AUTONOMY_NAME$, que irá a la [war|El] si se rechazan sus exigencias.\n\nCualquier [merchant|El] puede incitar, igual que el líder de una $republic_type_popular$, y cualquier [republic|El] que se libere adoptará el mismo tipo. Otros líderes de la [republic|El] deben tener un [patrician_rating|El] de al menos [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_2_value')|0V] y los otros [house_heads|El] [Concept('republic', 'de la república')|E] precisan al menos [EmptyScope.ScriptValue('gdp_patrician_house_score_threshold_3_value')|0V]."
 gdp_civic_agitation_scheme_desc_success: "El [county|El] crea una [faction|El] en favor de la $FACTION_BURGHER_AUTONOMY_NAME$ y exige autogobierno"
