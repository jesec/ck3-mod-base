l_spanish:
 ### MENAGERIE
 gdp_merchant_luxury_contract.0001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.0001.desc: "Al atravesar los/las [local_province.Custom('GetTerrainLandPlural')] de [local_county.GetNameNoTierNoTooltip], mi partida alcanza las cercanías del asentamiento local y levantamos nuestro campamento en las afueras con [local_province.Custom('GetProvinceFoliageDescAdjective')],"
 gdp_merchant_luxury_contract.0001.desc.locals: "Un grupo de aldeanos de paso responde a nuestras torpes preguntas sobre la fauna local con peculiares pero inconfundibles imitaciones de"
 gdp_merchant_luxury_contract.0001.desc.locals_language: "Un grupo de aldeanos de paso responden a nuestras preguntas con unas cuantas historias sobre"
 gdp_merchant_luxury_contract.0001.desc.jungle: "la atmósfera cargada con néctar dulce."
 gdp_merchant_luxury_contract.0001.desc.mountain: "una corriente de aire que silba entre las ramas."
 gdp_merchant_luxury_contract.0001.desc.desert: "un sol implacable que abrasa el paisaje silencioso."
 gdp_merchant_luxury_contract.0001.desc.plains: "un embriagador aroma de flores silvestres."
 gdp_merchant_luxury_contract.0001.desc.big_cat: "gatos terribles."
 gdp_merchant_luxury_contract.0001.desc.small_cat: "gatos astutos."
 gdp_merchant_luxury_contract.0001.desc.bear: "osos feroces."
 gdp_merchant_luxury_contract.0001.desc.monkey: "monos traviesos."
 gdp_merchant_luxury_contract.0001.desc.elephant: "elefantes majestuosos."
 gdp_merchant_luxury_contract.0001.desc.bear_cat: "gatos terribles y osos feroces."
 gdp_merchant_luxury_contract.0001.desc.bear_elephant: "osos feroces y elefantes majestuosos."
 gdp_merchant_luxury_contract.0001.desc.elephant_cat: "gatos terribles y elefantes majestuosos."
 gdp_merchant_luxury_contract.0001.desc.monkey_cat: "monos traviesos y gatos terribles."
 gdp_merchant_luxury_contract.0001.desc.monkey_elephant: "monos traviesos y elefantes majestuosos."
 gdp_merchant_luxury_contract.0001.desc.bird: "aves cautivadoras."
 gdp_merchant_luxury_contract.0001.desc.close: "¡Al menos parece que estamos tras la pista correcta!"
 gdp_merchant_luxury_contract.0001.a: "¡Las bestias de la naturaleza aguardan!"
 gdp_merchant_luxury_contract.0001.a.flavor: "Favorece la exhibición de [Concept('martial', 'marcialidad' )|E] [martial_i|E], [intrigue|El] [intrigue_i|E] y [prowess|El] [prowess_i|E]"
 gdp_merchant_luxury_contract.0001.a.tt: "Intentar conseguir un [domicile_artifact|El] de #V criatura#! en la naturaleza"
 gdp_merchant_luxury_contract.0001.b: "A ver qué encontramos en tal [local_barony.Custom('BaronyTownType')]."
 gdp_merchant_luxury_contract.0001.b.flavor: "Favorece la exhibición de [diplomacy|El] [diplomacy_i|E], [stewardship|El] [stewardship_i|E] y [gold|El] [gold_i|E]"
 gdp_merchant_luxury_contract.0001.b.tt: "Intentar conseguir un [domicile_artifact|El] de #V criatura#! en el centro urbano"
 gdp_merchant_luxury_contract_back_to_town_tt: "Vuelves a semejante [local_barony.Custom('BaronyTownType')|l]"
 gdp_merchant_luxury_contract_back_to_wilderness_tt: "Vuelves a la naturaleza"
 gdp_merchant_luxury_contract.0011.t: "[task_contract.GetType.GetName]: un toque local"
 gdp_merchant_luxury_contract.0011.desc: "Mientras vagaba por los senderos desconocidos de [local_province.GetBaronyNameExplicitlyNoTooltip], pronto me topo con un [local_province.Custom('GetRegionalMarketTermGloss')] [local_province.Custom('GetProvinceAdjective')], donde un[rich_local.Custom('ES_XA')] [rich_local.GetWomanMan] del lugar bien vestid[rich_local.Custom('ES_OA')], imposible de pasar por alto, empieza a hablar"
 gdp_merchant_luxury_contract.0011.cage: "¡junto a un ejemplar enjaulado de [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0011.shoulder: "¡con [rich_local.Custom('GetAnimalArticle')] ejemplar de [rich_local.Custom('GetAnimalType')] en el hombro!"
 gdp_merchant_luxury_contract.0011.leashed: "¡a su lado lleva un ejemplar de [rich_local.Custom('GetAnimalType')] con una correa!"
 gdp_merchant_luxury_contract.0011.close: "\n\nSaco de unos vendedores locales que es [rich_local.Custom('ES_ElLa')] [rich_local.GetTitledFirstName|l], un[rich_local.Custom('ES_XA')] potentad[rich_local.Custom('ES_OA')] [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', rich_local)] del lugar a quien le interesan los animales salvajes y exóticos.\n\n¿Igual puedo llegar a un trato con [rich_local.GetSheHe]?"
 gdp_merchant_luxury_contract.0011.a: "«Buen[rich_local.Custom('ES_XA')] [rich_local.GetWomanMan], ¿podemos hablar sobre ese espléndido espécimen de [rich_local.Custom('GetAnimalType')]?»."
 gdp_merchant_luxury_contract.0011.a.success: "Te vende su [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0011.a.failure: "Rechaza tu oferta"
 gdp_merchant_luxury_contract.0011.b: "Ya encontraré uno propio…"
 gdp_merchant_luxury_contract.some_other_way: "Tienes que hallar otro modo de adquirir una criatura"
 gdp_merchant_luxury_contract.0012.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0012.desc: "[rich_local.Custom('ES_ElLa')|U] [rich_local.GetTitledFirstName|l] me mira de arriba abajo con curiosidad mientras me presento y hago un efusivo elogio de su criatura.\n\n"
 gdp_merchant_luxury_contract.0012.success: "Su expresión se anima según hablo, se empapa con avidez de mis halagos y pregunta con emoción qué hago tan lejos de casa.\n\nPronto llegamos a un acuerdo sobre el precio ¡y de repente me encuentro con que ahora me enorgullezco de poseer un magnífico ejemplar de [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0012.failure: "Pero su expresión se agría pronto, primero con un ceño fruncido, luego con una burla despectiva, para pasar a rechazarme directamente con un gesto para que sus asistentes me echen.\n\n[Select_CString(rich_local.IsFemale, 'Esa payasa pomposa', 'Ese bufón pomposo' )] me trata como si #EMP yo#! fuese tal [rich_local.Custom('GetAnimalType')]…"
 gdp_merchant_luxury_contract.0012.a: "¡Será la comidilla de [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_luxury_contract.0012.b: "Esperad, ¡mirad, puedo ofrecer más!"
 gdp_merchant_luxury_contract.0012.c: "¿Dónde vive es[rich_local.Custom('ES_EA')] idiota? ¡Ese ejemplar de [rich_local.Custom('GetAnimalType')] #EMP será#! para mí!"
 gdp_merchant_luxury_contract.0012.c.success: "Le afanas su [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0012.c.failure: "Escapas de los guardias por los pelos"
 gdp_merchant_luxury_contract.0012.d: "#weak *niego con la cabeza#! «Olvidadlo, ya me haré con un ejemplar por mí mism[ROOT.Char.Custom('ES_OA')]»."
 gdp_merchant_luxury_contract.0012.e: "Ya me he hartado de esto…"
 gdp_merchant_luxury_contract.0013.t: "$gdp_merchant_luxury_contract.0011.t$"
 gdp_merchant_luxury_contract.0013.desc: "No costó encontrar el recinto [rich_local.Custom('ES_DelDela')] [rich_local.GetTitledFirstName|l] en [local_province.GetBaronyNameExplicitlyNoTooltip] y contratar a unos cuantos brutos locales en la taberna antes de colarnos y arramblar el lugar al caer la oscuridad.\n\n"
 gdp_merchant_luxury_contract.0013.success: "Casi fue demasiado fácil irrumpir en el perímetro y cuando quisimos darnos cuenta ya estábamos a varias calles de distancia con las orejas prestas para oír cualquier señal de alarma.\n\n¡Lo único que se oye es a mi [rich_local.Custom('GetAnimal')] que [rich_local.Custom('GetAnimalSoundPresent')] por lo bajo!"
 gdp_merchant_luxury_contract.0013.failure: "¡Por desgracia, hasta ahí llegó mi suerte! Escapé de los guardas por los pelos, atraído por un/a [rich_local.Custom('GetAnimalSoundParticiple')] a traición de esa mala bestia de [rich_local.Custom('GetAnimal')] al hacerse añicos el plan…\n\n¡Seguro que la gente de [rich_local.GetFirstNameNoTooltip] ya me está buscando!"
 gdp_merchant_luxury_contract.0013.a: "¡Haberme vendido el animal, idiota!"
 gdp_merchant_luxury_contract.0013.b: "¡He de largarme de aquí de inmediato!"
 gdp_merchant_luxury_contract.0021.t: "[task_contract.GetType.GetName]: el bestiario"
 gdp_merchant_luxury_contract.0021.desc: "En la maraña que es el [local_province.Custom('GetRegionalMarketTermGloss')] de [local_barony.Custom('BaronyTownType')], un hedor y un rugido bestial me atraen hasta un[dealer.Custom('ES_XA')] [dealer.GetWomanMan] de aspecto [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', dealer)] tras un puesto destartalado, el claro [local_province.Custom('GetProvinceAdjective')] lleno de jaulas de [local_province.Custom('GetRandomRegionalWood')] de toda clase.\n\nAl ver mi interés, me hace gestos ansiosos. ¡Qué espectáculo para la vista! Un magnífico ejemplar de [ROOT.Char.Custom('GetAnimalType')] me llama la atención de inmediato. Mientras admiro su/s [ROOT.Char.Custom('GetAnimalFeature')], un ejemplar bastante triste de [dealer.Custom('GetAnimalType')] [dealer.Custom('GetAnimalSoundPresent')] como protesta.\n\nLos ojos [dealer.Custom('ES_DelDela')] mercachifle brillan con avidez mientras examino sus animales."
 gdp_merchant_luxury_contract.0021.a: "«Qué hermosura… ¡Debo tener este ejemplar de [ROOT.Char.Custom('GetAnimalType')]!»."
 gdp_merchant_luxury_contract.0021.b: "Seguro que en [local_province.GetBaronyNameExplicitlyNoTooltip] también regatean…"
 gdp_merchant_luxury_contract.0021.b.success_critical: "Llegas a un trato magistral"
 gdp_merchant_luxury_contract.0021.b.success: "Ahorras unas cuantas monedas"
 gdp_merchant_luxury_contract.0021.b.failure: "Solo empeoras las cosas"
 gdp_merchant_luxury_contract.0021.b.tt: "Tendrás la opción de rechazar"
 gdp_merchant_luxury_contract.0021.c: "#weak *señalas*#! «¡Me quedaré con ese espécimen de [dealer.Custom('GetAnimalType')]!»"
 gdp_merchant_luxury_contract.0021.d: "«Solo miraba»."
 task_contract_success_pseudo: "#P Éxito:#!"
 gdp_merchant_luxury_contract.0022.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0022.desc: "[dealer.Custom('ES_ElLa')|U] comerciante hace un guiño, un[dealer.Custom('ES_XA')] vendedor[dealer.Custom('ES_XA')] nato. Avanzamos y retrocedemos durante lo que parecen años mientras señalamos cada marca en el [ROOT.Char.Custom('GetAnimalHide')] del ejemplar de [ROOT.Char.Custom('GetAnimal')] y debatimos las cualidades de cómo [ROOT.Char.Custom('GetAnimalSoundPresent')].\n\n"
 gdp_merchant_luxury_contract.0022.success: "Presento un argumento convincente y [dealer.GetSheHe] se aturulla un poco ante mis razonamientos. Al poco, se rinde y rebaja el precio sustancialmente, aunque siempre hay un límite…"
 gdp_merchant_luxury_contract.0022.neutral: "Mis argumentos han debido de tener un cierto impacto en [dealer.GetSheHe], pues baja el precio un poco, aunque no cederá un ápice más…"
 gdp_merchant_luxury_contract.0022.failure: "Parece que le he caído mal, porque ha subido el precio y ahora está muy obstinad[dealer.Custom('ES_OA')]…"
 gdp_merchant_luxury_contract.0022.a: "«Trato hecho»."
 gdp_merchant_luxury_contract.0022.b: "«En realidad quiero el ejemplar de [dealer.Custom('GetAnimalType')]…»."
 gdp_merchant_luxury_contract.0022.c: "#weak *niego con la cabeza*#! «Olvidadlo»."
 gdp_merchant_luxury_contract.0023.t: "$gdp_merchant_luxury_contract.0021.t$"
 gdp_merchant_luxury_contract.0023.desc: "¡Al fin he logrado lo que me había propuesto y ahora me enorgullezco de poseer un magnífico espécimen de [ROOT.Char.Custom('GetAnimalType')]! La magnífica criatura está amarrada como es debido, lista para unirse a nuestra caravana de vuelta a casa.\n\n¡Ya veréis cuando la vean en [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]!"
 gdp_merchant_luxury_contract.0023.a: "Vamos."
 gdp_merchant_luxury_contract.0041.t: "[task_contract.GetType.GetName]: de caza"
 gdp_merchant_luxury_contract.0041.desc: "Salgo del sendero y me adentro en el/la [local_province.Custom('GetTerrainType')], apartando [local_province.Custom('GetProvinceFoliageDesc')] en busca de cualquier señal de una bestia. Solo los cantos de las aves rompen este inquietante silencio. Me ato más fuerte la capa.\n\nY cuando estaba a punto de salir de un matorral, ¡casi me la pierdo! Entre [local_province.Custom('GetProvinceGroundDesc')], ¡huellas inconfundibles de [ROOT.Char.Custom('GetAnimalTrack')]! Un/a [ROOT.Char.Custom('GetAnimalSound')] de improviso a lo lejos lo confirma: ¡al menos un ejemplar de [ROOT.Char.Custom('GetAnimalType')] merodea cerca!"
 gdp_merchant_luxury_contract.0041.a: "¡Adelante, antes de que escape!"
 gdp_merchant_luxury_contract.0041.a.tt: "Persigues al ejemplar de [THIS.Char.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0041.b: "Ol-olvidadlo, ¡regresemos!"
 gdp_merchant_luxury_contract.0042.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0042.desc: "Cuando apartaba [local_province.Custom('GetProvinceFoliageDesc')], vislumbro un [ROOT.Char.Custom('GetAnimalHide')] de color [ROOT.Char.Custom('GetAnimalColor')] por el rabillo del ojo. Temiendo lo peor, me doy la vuelta, ¡el corazón casi se me sale del pecho!\n\nAnte mí se sienta un pequeño ejemplar desaliñado de [ROOT.Char.Custom('GetAnimalType')], solo un [ROOT.Char.Custom('GetAnimalChild')]. Sus grandes ojos curiosos me miran sin miedo. Miro alrededor, pero parece estar bastante solo, sin padres ni [ROOT.Char.Custom('GetAnimalGroup')] a la vista…"
 gdp_merchant_luxury_contract.0042.a: "¡Yo busco a una bestia adulta!"
 gdp_merchant_luxury_contract.0042.a.tt: "Continúo en busca de un [artifact|El] de un ejemplar adulto de [THIS.Char.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0042.b: "A lo mejor podría poner una trampa…"
 gdp_merchant_luxury_contract.0042.b.success: "Usas al [ROOT.Char.Custom('GetAnimalChild')] como cebo"
 gdp_merchant_luxury_contract.0042.b.success.tt: "También ganas un [artifact|El] de un ejemplar adulto de [THIS.Char.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0042.b.failure: "Fallas y el [ROOT.Char.Custom('GetAnimalChild')] escapa"
 gdp_merchant_luxury_contract.0042.c: "Es hora de irse. ¡Y #EMP tú#! te vienes conmigo, pequeñín!"
 baby_creature_artifact_name: "[ROOT.Char.Custom('GetAnimalChild')|U] [baby_creature.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.0043.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0043.desc: "Me sorprende un destello en [local_province.Custom('GetProvinceFoliageDesc')], ¡y pensar que una bestia podría acecharme me hace temer lo peor!\n\nEs un poco de alivio que solo sea un[hunter.Custom('ES_XA')] cazador[hunter.Custom('ES_XA')] local que me mira con sospecha y una flecha encocada.\n\n«Ja, ¿venís por los/las [ROOT.Char.Custom('GetAnimalPlural')]? No había visto antes gente como vos»."
 gdp_merchant_luxury_contract.0043.a: "Bueno y ¿podríais… ayudarme?"
 gdp_merchant_luxury_contract.0043.b: "¡Sería un honor cazar a vuestro lado!"
 gdp_merchant_luxury_contract.0043.b.success: "[hunter.GetFirstNameNoTooltip] te ayuda"
 gdp_merchant_luxury_contract.0043.b.success_tt: "Tendrás una probabilidad mayor de tener éxito"
 gdp_merchant_luxury_contract.0043.b.failure: "[hunter.GetFirstNameNoTooltip] te rechaza"
 gdp_merchant_luxury_contract.0043.c: "Apartaos de mi camino."
 gdp_merchant_luxury_contract.0044.t: "$gdp_merchant_luxury_contract.0041.t$"
 gdp_merchant_luxury_contract.0044.bait: "Basta con llevar al cebo en forma de [ROOT.Char.Custom('GetAnimalChild')] a un claro adecuado y atarlo al suelo con unas cuerdas.\n\n"
 gdp_merchant_luxury_contract.0044.trapper: "[hunter.GetFirstName] es una ayuda bien recibida, con un conocimiento profundo del/de la [local_province.Custom('GetTerrainType')] local y sus moradores. ¡Pronto seguimos el rastro de ese ejemplar de [ROOT.Char.Custom('GetAnimal')]!\n\n"
 gdp_merchant_luxury_contract.0044.desc: "Avanzamos lento por un paisaje al que no estamos acostumbrados, con muchos pasos en falso y senderos doblados, ¡pero seguimos el rastro de ese ejemplar de [ROOT.Char.Custom('GetAnimal')]!\n\n"
 gdp_merchant_luxury_contract.0044.bait_success: "Claro, su [ROOT.Char.Custom('GetAnimalSoundParticiple')] suave pronto atrae la atención de un espécimen adulto de [ROOT.Char.Custom('GetAnimaltype')]. Vemos a la bestia observando con cautela desde [local_province.Custom('GetProvinceFoliageDesc')]. Al final se acerca con cuidado a su [ROOT.Char.Custom('GetAnimalChild')], ¡y hacemos saltar la trampa!"
 gdp_merchant_luxury_contract.0044.bait_failure: "O debería haber sido así… Tras pasar un tiempo sentado y [ROOT.Char.Custom('GetAnimalSoundParticiple')] con suavidad, el maldito bicho salta con todas sus fuerzas, se libera y desaparece en [local_province.Custom('GetProvinceFoliageDesc')]…"
 gdp_merchant_luxury_contract.0044.success: "Tenemos la suerte de toparnos con el ejemplar de [ROOT.Char.Custom('GetAnimalType')] casi desprevenido en [local_province.Custom('GetProvinceFoliageDesc')], y con un precipitado movimiento [ROOT.Char.Custom('GetAnimalColor')] y su [ROOT.Char.Custom('GetAnimalSoundParticiple')] ¡la bestia queda atrapada en una red!"
 gdp_merchant_luxury_contract.0044.failure: "Pero las cosas pronto salen mal. En cuanto vemos a la bestia, se escapa hacia la zona de [local_province.Custom('GetTerrainLand')] con un precipitado movimiento [ROOT.Char.Custom('GetAnimalColor')] y su [ROOT.Char.Custom('GetAnimalSoundParticiple')], demasiado asustada para que la capturemos."
 gdp_merchant_luxury_contract.0044.a: "¡Qué pareja más bonita haréis!"
 gdp_merchant_luxury_contract.0044.b: "¡Condenadas bestias!"
 gdp_merchant_luxury_contract.0044.c: "¡Ya te tengo!"
 gdp_merchant_luxury_contract.0044.d: "¡Condenada bestia!"
 gdp_merchant_luxury_contract.0044.e: "¿Qué os parecería ver [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], [hunter.GetFirstNameNoTooltip]?"
 gdp_merchant_luxury_contract.0051.t: "[task_contract.GetType.GetName]: caza furtiva"
 gdp_merchant_luxury_contract.0051.desc: "Llegamos a un pueblo [local_province.Custom('GetProvinceGroundDescAdjective')] y preguntamos por la fauna local. El jefe nos avisa muy en serio de que nos marchemos; nos explica que un pez gordo local, «[rich_local.GetName]», caza [rich_local.Custom('GetAnimalPlural')] en la zona.\n\nAntes de marcharnos, aparece un[hunter.Custom('ES_XA')] pueblerin[hunter.Custom('ES_OA')] [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', hunter)], ¡que discute en voz baja de que sería fácil capturar un ejemplar de [rich_local.Custom('GetAnimalPlural')] [rich_local.Custom('ES_DelDela')] [rich_local.GetTitleAsNameNoTooltip|l]!\n\nUna idea osada, pero ¿tal vez una oportunidad demasiado buena como para dejarla pasar?"
 gdp_merchant_luxury_contract.0051.a: "¿Un ejemplar de [rich_local.Custom('GetAnimalType')]? ¡Vamos ya!"
 gdp_merchant_luxury_contract.0051.a.flavor: "Los lugareños serán castigados…"
 gdp_merchant_luxury_contract.0051.a.tt: "Intentarás robarle la pieza furtivamente a [rich_local.GetShortUIName]"
 gdp_merchant_luxury_contract.0051.b: "No me meteré con un[rich_local.Custom('ES_XA')] [rich_local.GetTitleAsNameNoTooltip|l]…"
 gdp_merchant_luxury_contract.0052.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0052.desc: "Mi guía, [hunter.GetFirstName], nos dirige con rapidez por [local_province.Custom('GetProvinceFoliageDesc')], atravesamos la zona de [local_province.Custom('GetTerrainTypePlural')] con una velocidad impresionante. Al llegar a un claro, se detiene de repente y pone la oreja.\n\n«¡Silencio!», chista apartándome de la vista, «Están cerca».\n\nEn solo un instante, la partida galopa a nuestro lado y nos supera, revolviendo [local_province.Custom('GetProvinceGroundDesc')] mientras los cazadores gritan alejándose.\n\nEntonces, lo oigo, ¡el [rich_local.Custom('GetAnimalSound')] de un espécimen de [rich_local.Custom('GetAnimalType')]!"
 gdp_merchant_luxury_contract.0052.a: "¡Que viene! ¡La red!"
 gdp_merchant_luxury_contract.0052.a.success: "Capturas al ejemplar de [rich_local.Custom('GetAnimalType')]"
 gdp_merchant_luxury_contract.0052.a.neutral: "El ejemplar de [rich_local.Custom('GetAnimalType')] se te escapa"
 gdp_merchant_luxury_contract.0052.a.failure: "El ejemplar de [rich_local.Custom('GetAnimalType')] te hiere"
 gdp_merchant_luxury_contract.0052.b: "¡Escondeos! ¡Estamos perdidos!"
 gdp_merchant_luxury_contract.0052.b.tt: "El ejemplar de [rich_local.Custom('GetAnimalType')] se escapa"
 gdp_merchant_luxury_contract.0053.t: "$gdp_merchant_luxury_contract.0051.t$"
 gdp_merchant_luxury_contract.0053.desc: "Regresamos al pueblo, donde el jefe sale hecho una furia; grita que los hombres [rich_local.Custom('ES_DelDela')] [rich_local.GetTitledFirstName|l] han estado allí, ¡buscando a los cazadores furtivos!\n\n"
 gdp_merchant_luxury_contract.0053.success: "[hunter.GetFirstName] mira culpable al ejemplar encadenado de [rich_local.Custom('GetAnimalType')], aunque no con tanta culpabilidad como para ocultar su orgullo."
 gdp_merchant_luxury_contract.0053.failure: "[hunter.GetFirstName] mira con frustración al suelo mientras el resto del pueblo pone mala cara.\n\nCuando se dirige a su morada, aparece un espécimen amarrado de [hunter.Custom('GetAnimalType')] que [hunter.Custom('GetAnimalWalkParticiple')] por [local_province.Custom('GetProvinceGroundDesc')]."
 gdp_merchant_luxury_contract.0053.a: "«Qué maravillosa criatura…»."
 gdp_merchant_luxury_contract.0053.b: "«… ¡Le contaré [rich_local.Custom('ES_AlAla')] [rich_local.GetTitleAsNameNoTooltip|l] quién capturó a esta criatura!»."
 gdp_merchant_luxury_contract.0053.b.flavor: "A [hunter.GetFirstNameNoTooltip] le impresiona tu osadía"
 gdp_merchant_luxury_contract.0053.c: "«Fue una idea horrible…»."
 gdp_merchant_luxury_contract.0053.d: "«… aun así, me vendría bien alguien como vos, [hunter.GetFirstNameNoTooltip]»."
 gdp_merchant_luxury_contract.0053.e: "«¡No me dijisteis que ya teníais un espécimen de [hunter.Custom('GetAnimalType')]!»."
 ##### PROCURE CURIO
 gdp_merchant_luxury_contract.1001.t: "[task_contract.GetType.GetName]: [local_county.GetNameNoTierNoTooltip]"
 gdp_merchant_luxury_contract.1001.desc: "Esta mañana divisamos el/la [local_barony.Custom('BaronyTownType')] de [local_province.GetBaronyNameExplicitlyNoTooltip], nuestro anhelado destino, que emerge entre [local_province.Custom('GetTerrainLandPlural')]"
 gdp_merchant_luxury_contract.1001.desc.locals: "En la puerta, los aldeanos de paso respondieron a nuestras preguntas sobre indicaciones con dificultad en un burdo [local_county.GetCountyData.GetCulture.GetLanguage.GetName], pero señalaron un"
 gdp_merchant_luxury_contract.1001.desc.locals_language: "En la puerta, un grupo de aldeanos de paso responden a nuestras preguntas en [local_county.GetCountyData.GetCulture.GetLanguage.GetName] con indicaciones a un"
 gdp_merchant_luxury_contract.1001.desc.religious: "gran sepulcro santo en [religious_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.scholarly: "centro de erudición en [scholarly_building_province.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_luxury_contract.1001.desc.fallback: "mercado local."
 gdp_merchant_luxury_contract.1001.a: "En el [local_province.Custom('GetRegionalMarketTerm')] local habrá algo."
 gdp_merchant_luxury_contract.1001.a.flavor: "Favorece la exhibición de [stewardship|El] [stewardship_i|E] y [gold|El] [gold_i|E]"
 gdp_merchant_luxury_contract.1001.a.tt: "Intentar conseguir un [domicile_artifact|El] de tipo #V curiosidad#! en el mercado"
 gdp_merchant_luxury_contract.1001.d: "¡El gran [local_province.Custom('GetRegionalMarketTerm')] nos llama!"
 gdp_merchant_luxury_contract.1001.d.flavor: "$gdp_merchant_luxury_contract.1001.a.flavor$"
 gdp_merchant_luxury_contract.1001.d.tt: "$gdp_merchant_luxury_contract.1001.a.tt$"
 gdp_merchant_luxury_contract.1001.e: "Busquemos este lugar sagrado."
 gdp_merchant_luxury_contract.1001.e.flavor: "Favorece la exhibición de [piety|El] [piety_i|E] y [learning|El] [learning_i|E]"
 gdp_merchant_luxury_contract.1001.e.tt: "Intentar conseguir un [domicile_artifact|El] de tipo #V curiosidad#! en el centro religioso"
 gdp_merchant_luxury_contract.1001.f: "Hay mucho que podemos aprender aquí."
 gdp_merchant_luxury_contract.1001.f.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [diplomacy|El] [diplomacy_i|E]"
 gdp_merchant_luxury_contract.1001.f.tt: "Intentar conseguir un [domicile_artifact|El] de tipo #V curiosidad#! en el centro de enseñanza"
 gdp_merchant_luxury_contract.1001.return.religious: "Volvamos al lugar sagrado…"
 gdp_merchant_luxury_contract.1001.return.scholarly: "Encontremos el centro de aprendizaje…"
 gdp_merchant_luxury_contract.1001.return.urban: "Creo que solo iré al mercado…"
 gdp_merchant_luxury_contract.1001.give_up: "¡Ah, olvidadlo!"
 gdp_merchant_luxury_contract.1001.fallback: "No me iré de [local_province.GetBaronyNameExplicitlyNoTooltip] con las manos vacías."
 gdp_merchant_luxury_contract.1001.fallback.flavor: "Encuentras alguna bagatela en el [local_province.Custom('GetRegionalMarketTermGloss')]"
 ### MARKET SITE
 gdp_merchant_luxury_contract.1101.t: "[task_contract.GetType.GetName]: centro de comercio"
 gdp_merchant_luxury_contract.1101.desc: "El/La [local_province.GetTitle.Custom('BaronyTownType')] de [local_province.GetBaronyNameExplicitlyNoTooltip] bulle con negocios mientras los lugareños y viajeros buscan artículos de toda clase entre las vistas, sonidos y olores del [local_province.Custom('GetRegionalMarketTermGloss')] [local_province.Custom('GetProvinceAdjective')].\n\n"
 gdp_merchant_luxury_contract.1101.urchin: "En un rincón oscuro vislumbro a un[urchin.Custom('ES_XA')] pilluel[urchin.Custom('ES_OA')] con unos ojos redondos y relucientes que examinan la corriente constante de transeúntes."
 gdp_merchant_luxury_contract.1101.antiques: "Un puesto torcido de antigüedades lleno de baratijas de [local_province.Custom('GetRandomRegionalWood')] y metal deslustrado despierta mi curiosidad para gran deleite [dealer.Custom('ES_DelDela')] [dealer.GetWomanMan] [dealer.Custom('GetYoungMiddleAgedOld')] que lo lleva."
 gdp_merchant_luxury_contract.1101.bookseller: "El toldo raído de [ROOT.Char.Custom('RegionalFabric')] de una tienda sombría oculta una multitud de pergaminos deshilachados y volúmenes apretujados contra sus paredes, vigilados por un[dealer.Custom('ES_XA')] [dealer.GetWomanMan] [dealer.Custom('GetYoungMiddleAgedOld')]."
 gdp_merchant_luxury_contract.1101.travelers: "Una banda de [traveler.GetCulture.GetCollectiveNoun] curtidos se ha instalado en una plaza cercana; sus atuendos y habla los distingue de la gente [local_province.GetCulture.GetName]."
 gdp_merchant_luxury_contract.1101.tavern: "Al otro lado, el jolgorio subido de tono de una taberna atrae mi atención a un[gambler.Custom('ES_XA')] jugador[gambler.Custom('ES_XA')] de aspecto tosco que retuerce la bolsa que acaba de liberar de un rival distraído."
 gdp_merchant_luxury_contract.1101.merchant: "Me fijo en un[other_merchant.Custom('ES_XA')] [other_merchant.GetWomanMan] bien vestid[other_merchant.Custom('ES_OA')] que azuza el lento avance de una caravana por la ciudad. Está claro que es[other_merchant.Custom('ES_EA')] mercader local es como yo."
 gdp_merchant_luxury_contract.1101.a: "Es[urchin.Custom('ES_EA')] niñ[urchin.Custom('ES_OA')] parece… #EMP astut[urchin.Custom('ES_OA')]#!."
 gdp_merchant_luxury_contract.1101.a.flavor: "Favorece la exhibición de [intrigue|El] [intrigue_i|E] y [diplomacy|El] [diplomacy_i|E]"
 gdp_merchant_luxury_contract.1101.a.tt: "A ver qué dice [urchin.Custom('ES_ElLa')] pilluel[urchin.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1101.b: "Ese vendedor[dealer.Custom('ES_XA')] podría tener algo interesante…"
 gdp_merchant_luxury_contract.1101.b.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [gold|El] [gold_i|E]"
 gdp_merchant_luxury_contract.1101.b.tt: "Intentas comprar una antigüedad interesante"
 gdp_merchant_luxury_contract.1101.c: "Tiene que haber un libro interesante o dos en este lugar."
 gdp_merchant_luxury_contract.1101.c.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [gold|El] [gold_i|E]"
 gdp_merchant_luxury_contract.1101.c.tt: "Intentas comprar un libro interesante"
 gdp_merchant_luxury_contract.1101.d: "Esos [traveler.GetCulture.GetCollectiveNounNoTooltip] habrán visto unas cuantas cosas."
 gdp_merchant_luxury_contract.1101.d.lingua: "Una oportunidad para poner a prueba mi [traveler.GetCulture.GetLanguage.GetNameNoTooltip]."
 gdp_merchant_luxury_contract.1101.d.flavor: "Favorece la exhibición de [diplomacy|El] [diplomacy_i|E] y [learning|El] [learning_i|E]"
 gdp_merchant_luxury_contract.1101.d.tt: "Conversas con los viajeros"
 gdp_merchant_luxury_contract.1101.e: "No me puedo resistir a un juego de azar…"
 gdp_merchant_luxury_contract.1101.e.flavor: "Favorece la exhibición de [intrigue|El] [intrigue_i|E] y azar"
 gdp_merchant_luxury_contract.1101.e.tt: "Ves qué se le puede ganar [gambler.Custom('ES_AlAla')] jugador[gambler.Custom('ES_XA')]"
 gdp_merchant_luxury_contract.1101.f: "Ah, un[other_merchant.Custom('ES_XA')] competidor[other_merchant.Custom('ES_XA')] me entenderá."
 gdp_merchant_luxury_contract.1101.f.flavor: "Favorece la exhibición de [stewardship|El] [stewardship_i|E] y [prestige_level|El] [prestige_i|E]"
 gdp_merchant_luxury_contract.1101.f.tt: "A ver qué dice [other_merchant.Custom('ES_ElLa')] mercader"
 gdp_merchant_luxury_contract.1102.urchin: "Es difícil que [urchin.GetFirstName] baje la guardia, desde luego. Intento ganárme[urchin.GetHerHim] con desdén por los transeúntes y cuentos de lo duras que son las calles de [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\n"
 gdp_merchant_luxury_contract.1102.urchin.success_critical: "Mis historias sobre lugares lejanos y la vida de mercader pican su interés. Cuando estoy a punto de hacer una oferta, ¡[urchin.GetSheHe] me ofrece las joyas si me [urchin.GetHerHim] llevo conmigo!"
 gdp_merchant_luxury_contract.1102.urchin.success: "Cuando creo que ya hemos avanzado bastante para ir al grano, le pregunto cuánto quiere por las joyas. Con una sonrisa taimada, me da el precio."
 gdp_merchant_luxury_contract.1102.urchin.failure: "Cuando creo que ya hemos avanzado bastante para ir al grano, le pregunto cuánto quiere por las joyas. [urchin.GetFirstNameNoTooltip] se limita a torcer el gesto y me dice que me pierda."
 gdp_merchant_luxury_contract.1102.antiques: "[dealer.Custom('ES_ElLa')|U] astut[dealer.Custom('ES_OA')] vendedor[dealer.Custom('ES_XA')] y yo estamos un tiempo dando vueltas, discutiendo sobre la calidad de la construcción de la pieza, su edad y su estado.\n\nAl final, es[dealer.Custom('ES_EA')] desgraciad[dealer.Custom('ES_OA')] [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] y yo llegamos a un punto muerto."
 gdp_merchant_luxury_contract.1102.antiques.success: "Tengo que decir que el precio no está mal, mejor de lo que habría esperado."
 gdp_merchant_luxury_contract.1102.antiques.failure: "No puedo decir que me alegre el resultado, y me parece que se han aprovechado de mí."
 gdp_merchant_luxury_contract.1102.bookseller: "[dealer.Custom('ES_ElLa')|U] astut[dealer.Custom('ES_OA')] vendedor[dealer.Custom('ES_XA')] y yo estamos un tiempo dando vueltas, discutiendo sobre el origen del libro, su edad y su estado.\n\nAl final, es[dealer.Custom('ES_EA')] desgraciad[dealer.Custom('ES_OA')] [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('dealer') )] y yo llegamos a un punto muerto."
 gdp_merchant_luxury_contract.1102.bookseller.success: "$gdp_merchant_luxury_contract.1102.antiques.success$"
 gdp_merchant_luxury_contract.1102.bookseller.failure: "$gdp_merchant_luxury_contract.1102.antiques.failure$"
 gdp_merchant_luxury_contract.1102.travelers: "El grupo se hace a mi compañía; es evidente que soy lo más interesante que han visto en todo el día y pronto intercambiamos historias sobre nuestros viajes."
 gdp_merchant_luxury_contract.1102.travelers.success: "\n\nNo pasa mucho hasta que compartimos el pan, reímos y bromeamos sobre nuestras desgracias y experiencias comunes en [local_province.GetBaronyNameExplicitly]. [traveler.GetFirstName] me pone un paquete en la mano cuando nos despedimos y me da un cálido abrazo."
 gdp_merchant_luxury_contract.1102.travelers.failure: "\n\nTras compartir unos cuantos chismes, me quedo rápidamente sin nada de qué que hablar y los [traveler.GetCulture.GetCollectiveNoun] no ocultan que desean que siga mi camino."
 gdp_merchant_luxury_contract.1102.tavern: "Las cosas parecen igualadas según calentamos los dados, ganamos una ronda o dos alternativamente mientras intercambiamos monedas y mofas, pero no me cabe duda de que [gambler.GetFirstName] es un hueso duro de roer.\n\n"
 gdp_merchant_luxury_contract.1102.tavern.success: "¡Hoy [merchant.GetFaith.WealthGodName] me sonríe! Con una ventaja inicial abrumadora, dejo a [gambler.GetFirstNameNoTooltip] boquiabiert[gambler.Custom('ES_OA')] y maldiciendo mientras se hunde más y más, hasta que sale hech[gambler.Custom('ES_OA')] una furia, ¡y tira sus dados a la calle!"
 gdp_merchant_luxury_contract.1102.tavern.failure: "Lleva su tiempo, pero al final consigo coger ventaja para poner a prueba la paciencia de [gambler.GetFirstNameNoTooltip] hasta que se rinde y me jacto de mis monedas."
 gdp_merchant_luxury_contract.1102.tavern.failure_critical: "[gambler.GetSheHe|U] no tarda mucho en tirar de todos sus recursos y rápidamente pierdo varias rondas, la paciencia y las monedas de mi bolsa. Hago una triste retirada frente a la jactancia de [gambler.GetFirstNameNoTooltip]."
 gdp_merchant_luxury_contract.1102.merchant: "En unas oficinas tranquilas cerca del [local_province.Custom('GetRegionalMarketTermGloss')], [other_merchant.Custom('ES_ElLa')] [other_merchant.GetTitledFirstName|l] y yo discutimos nuestros negocios largo y tendido, meditando sobre conexiones mutuas en sitios remotos y presumiendo de nuestros éxitos.\n\n"
 gdp_merchant_luxury_contract.1102.merchant.success: "Congeniamos mucho, compartimos unas copas de [other_merchant.Custom('RegionalDrink')] y el pan al tiempo que intercambiamos consejos y discutimos posibilidades futuras de ganancias mutuas. Triste por despedirse, [other_merchant.GetFirstNameNoTooltip] me entrega algunas muestras valiosas como regalo de despedida."
 gdp_merchant_luxury_contract.1102.merchant.failure: "No parece que tengamos mucho en común; a cada [Select_CString(And(ROOT.Char.IsFemale, other_merchant.IsFemale), 'una', 'uno')] le irritan los alardes [Select_CString(And(ROOT.Char.IsFemale, other_merchant.IsFemale), 'de la otra', 'del otro')] y la falta de ganas de compartir información útil alguna. Pronto me separo de tan insípid[other_merchant.Custom('ES_OA')] [other_merchant.GetWomanMan]."
 gdp_merchant_luxury_contract.1102.a: "Esto servirá."
 gdp_merchant_luxury_contract.1102.b: "Esto tendrá que valer…"
 gdp_merchant_luxury_contract.1111.desc: "Atravieso la calle de un asentamiento [local_province.Custom('GetProvinceAdjective')] hacia es[urchin.Custom('ES_EA')] [urchin.Custom('GirlBoy')]. Al verme, sus ojos penetrantes buscan una explicación, pero le dejo claro que no soy una amenaza al acercarme con disimulo a la pared contra la que se apoya.\n\nLa sugerencia de una alhaja reluciente brilla atractiva en su mano, pero la guarda rápidamente mientras [urchin.GetSheHe] me sigue la mirada. «¿Qué queréis?», espeta. «Me llamo [urchin.GetFirstName]. Estas calles son #EMP mías#!»."
 gdp_merchant_luxury_contract.1111.a: "Parece que sabes unas cuantas cosas."
 gdp_merchant_luxury_contract.1111.a.success_critical: "Te ganas su confianza"
 gdp_merchant_luxury_contract.1111.a.success: "Compras su botín"
 gdp_merchant_luxury_contract.1111.a.failure: "Te ganas su desprecio"
 gdp_merchant_luxury_contract.1111.artifact.urchin: "[urchin.GetFirstName] hurtó la alhaja en las calles de [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1111.artifact.ring: "Anillo [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.ring.desc: "$artifact_ring_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.brooch: "Broche [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.brooch.desc: "$artifact_brooch_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1111.artifact.necklace: "Collar [local_county.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1111.artifact.necklace.desc: "$artifact_necklace_description$ $gdp_merchant_luxury_contract.1111.artifact.urchin$"
 gdp_merchant_luxury_contract.1121.desc: "Me muestro indiferente mientras examino los artículos ofrecidos, sin mostrar mis verdaderos intereses, aunque cuesta saber hasta qué punto convenzo al vendedor.\n\nTengo el corazón decidido en un objeto en particular que destaca por encima del resto; el tiempo ha hecho que su estilo resulte exótico incluso aquí, donde fue creado."
 gdp_merchant_luxury_contract.1121.a: "Hablemos del precio…"
 gdp_merchant_luxury_contract.1121.a.success_critical: "Regateas hasta sacar un precio muy bueno"
 gdp_merchant_luxury_contract.1121.a.success: "Regateas hasta sacar un buen precio"
 gdp_merchant_luxury_contract.1121.a.failure: "[dealer.GetSheHe] sabe negociar"
 gdp_merchant_luxury_contract.1121.artifact.weapon: "[artifact.GetName] con solera"
 gdp_merchant_luxury_contract.1121.artifact.weapon.desc: "[artifact.GetDesc] Ya no se puede usar en combate por el desgaste provocado por el paso del tiempo."
 gdp_merchant_luxury_contract.1121.artifact.bowl: "Cuenco antiguo de artesanía [local_province.GetCounty.GetCulture.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.1121.artifact.plate: "Plato antiguo de artesanía [local_province.GetCounty.GetCulture.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.1121.artifact.urn: "Urna antigua [local_province.GetCounty.GetCulture.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.1131.desc: "Me muestro indiferente mientras examino las obras ofrecidas, sin mostrar mis verdaderos intereses, si bien cuesta saber hasta qué punto convenzo al vendedor.\n\nTengo el corazón decidido en una encuadernación en particular que destaca por encima del resto; por lo que entiendo, una obra rara y que se ha pasado por alto."
 gdp_merchant_luxury_contract.1131.a: "$gdp_merchant_luxury_contract.1121.a$"
 gdp_merchant_luxury_contract.1131.a.success_critical: "$gdp_merchant_luxury_contract.1121.a.success_critical$"
 gdp_merchant_luxury_contract.1131.a.success: "$gdp_merchant_luxury_contract.1121.a.success$"
 gdp_merchant_luxury_contract.1131.a.failure: "$gdp_merchant_luxury_contract.1121.a.failure$"
 gdp_merchant_luxury_contract.1131.artifact.book.desc: "[artifact.GetDesc] Se adquirió de un vendedor en [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1141.desc: "Me acerco [leader.Custom('ES_AlAla')] líder [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('traveler') )] de la banda con una sonrisa cálida y la esperanza de que nuestra situación mutua de extranjería sea un factor que nos una en un lugar extraño.\n\n[traveler.GetSheHe|U] dice llamarse [traveler.GetFirstName]. A su vez me presento como «[merchant.GetNameNoTooltip]. Habéis oído hablar de mí, ¿verdad?», medio en broma, medio en serio."
 gdp_merchant_luxury_contract.1141.a: "¡Tendréis algunas historias interesantes!"
 gdp_merchant_luxury_contract.1141.a.flavor: "Una prueba de tu [diplomacy|El] [diplomacy_i|E] y [prestige_level|El] [prestige_i|E]"
 gdp_merchant_luxury_contract.1141.a.success: "Te llevas bien con [traveler.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1141.a.failure: "[traveler.GetFirstNameNoTooltip] se cansa de ti"
 gdp_merchant_luxury_contract.1141.artifact.weapon.desc: "[artifact.GetDesc] Se adquirió de un vendedor en [local_province.GetBaronyNameExplicitly]; ya no se puede usar para el combate por el desgaste provocado por el paso del tiempo."
 gdp_merchant_luxury_contract.1141.artifact.brooch: "Broche de artesanía [traveler.GetCulture.GetNameNoTooltip]"
 gdp_merchant_luxury_contract.1141.artifact.brooch.desc: "$artifact_brooch_description$ Se adquirió de unos viajeros de [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1151.desc: "Tras desplazar la cortina y acceder al antro sombrío, me uno a los depravados y vagabundos. En el centro de la estancia, se sienta [gambler.Custom('ES_ElLa')] jugador[gambler.Custom('ES_XA')] mientras cuenta monedas muy alegre.\n\nTomo asiento justo enfrente mientras [gambler.GetSheHe] me estudia con las cejas arqueadas. «Queréis jugar, ¿no?», sonríe. «Me llamo [gambler.GetFirstName] y no lloréis cuando me lleve vuestras monedas»."
 gdp_merchant_luxury_contract.1151.a: "Juguemos."
 gdp_merchant_luxury_contract.1151.a.flavor: "Una prueba de tu [intrigue|El] [intrigue_i|E] y azar"
 gdp_merchant_luxury_contract.1151.a.success: "[gambler.GetHerHim|U] dejas limpi[gambler.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1151.a.failure: "Ganas algunas monedas"
 gdp_merchant_luxury_contract.1151.a.failure_critical: "Pierdes algunas monedas"
 gdp_merchant_luxury_contract.1151.artifact.dice: "Dado de la suerte de un[gambler.Custom('ES_XA')] jugador[gambler.Custom('ES_XA')]"
 gdp_merchant_luxury_contract.1151.artifact.dice.desc: "El dado duramente conquistado de [gambler.GetFirstName], un[gambler.Custom('ES_XA')] granuja y jugador[gambler.Custom('ES_XA')] de [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1161.desc: "Interrumpo las quejas [other_merchant.Custom('ES_DelDela')] mercader y me presento como líder de [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], que se halla en [merchant.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], haciendo notar que no estoy aquí por negocios.\n\nA cambio, descubro que [other_merchant.GetSheHe] es [other_merchant.GetName], proviene de [other_merchant.GetCapitalLocation.GetBaronyNameExplicitly], y aquí trata con [merchant_good.GetName|l]. Tras habernos estudiado, [other_merchant.GetFirstNameNoTooltip] se ofrece a sentarse conmigo en alguna parte."
 gdp_merchant_luxury_contract.1161.a: "Tenemos mucho de lo que poder hablar."
 gdp_merchant_luxury_contract.1161.a.flavor: "Una prueba de tu [stewardship|El] [stewardship_i|E] y [prestige_level|El] [prestige_i|E]"
 gdp_merchant_luxury_contract.1161.a.success: "[other_merchant.GetFirstNameNoTooltip] se hace a tu compañía"
 gdp_merchant_luxury_contract.1161.a.failure: "[other_merchant.GetFirstNameNoTooltip] es implacable"
 gdp_merchant_luxury_contract.1161.artifact.fabric: "Muestras de tejido"
 gdp_merchant_luxury_contract.1161.artifact.fabric.desc: "Muestras de [other_merchant.Custom('RegionalFabric')] de [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip] que los comerciantes emplean en sus tratos."
 gdp_merchant_luxury_contract.1161.artifact.gem: "Muestras de gemas"
 gdp_merchant_luxury_contract.1161.artifact.gem.desc: "Muestras de piedras preciosas de [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip] que los comerciantes emplean en sus tratos."
 gdp_merchant_luxury_contract.1161.artifact.gold: "Muestras de metales"
 gdp_merchant_luxury_contract.1161.artifact.gold.desc: "Muestras de metales preciosos de [local_county.GetDeJureLiege.GetBaseNameNoTierNoTooltip] que los comerciantes emplean en sus tratos."
 ### RELIGIOUS SITE
 gdp_merchant_luxury_contract.1501.t: "[task_contract.GetType.GetName]: centro religioso"
 gdp_merchant_luxury_contract.1501.desc: "Seguimos los pasos de incontables peregrinos y fieles, y pronto nos topamos con la magnificencia del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l] de [religious_building_province.GetName].\n\n"
 gdp_merchant_luxury_contract.1501.site: "El sepulcro es un gran monumento al fervor por [religious_building_faith.HighGodName] de la antigua clase gobernante [religious_building_faith.GetReligion.GetAdjective]. Desde su interior se oyen los melódicos murmullos de un servicio en curso."
 gdp_merchant_luxury_contract.1501.tombs: "No muy lejos hay un afloramiento de lápidas desgastadas y marcadas con el símbolo de [religious_building_faith.ReligiousSymbol], cubiertas de vegetación y erosionadas tras tantas estaciones."
 gdp_merchant_luxury_contract.1501.pilgrim: "Filas ordenadas de devotos, sus ropas los señalan como peregrinos, esperan para entrar. Un grupo destaca en particular, ya que portan una especie de relicario entre todos."
 gdp_merchant_luxury_contract.1501.monks: "Cerca, un grupo de monjes se apiña en silencio a la sombra para meditar e intercambiar palabras quedas mientras el mundo se mueve a su alrededor con languidez."
 gdp_merchant_luxury_contract.1501.keepsake: "Al acercarme al edificio me fijo en un trozo gastado de mampostería donde varias piedras se han ido soltando y partiendo con el paso del tiempo."
 gdp_merchant_luxury_contract.1501.apostate: "Un[pilgrim.Custom('ES_XA')] [pilgrim.GetWomanMan], sol[pilgrim.Custom('ES_OA')] y con aspecto preocupado, se sienta a la sombra del edificio; codos en las rodillas, una mano en su rostro y la otra en un librito."
 gdp_merchant_luxury_contract.1501.a: "Quiero ver el interior."
 gdp_merchant_luxury_contract.1501.a.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [piety|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1501.a.tt: "Ves lo que te aguarda dentro de tal [religious_building_faith.HouseOfWorship]"
 gdp_merchant_luxury_contract.1501.b: "Debe de haber algo en esas tumbas…"
 gdp_merchant_luxury_contract.1501.b.flavor: "Favorece la exhibición de [intrigue|El] [intrigue_i|E] y [prowess|El] [prowess_i|E]"
 gdp_merchant_luxury_contract.1501.b.tt: "Regresas por la noche para saquear una tumba"
 gdp_merchant_luxury_contract.1501.c: "Esos peregrinos tienen pinta de crédulos…"
 gdp_merchant_luxury_contract.1501.c.flavor: "Favorece la exhibición de [intrigue|El] [intrigue_i|E] y [diplomacy|El] [diplomacy_i|E]"
 gdp_merchant_luxury_contract.1501.c.tt: "Intentas ganarte a un peregrino"
 gdp_merchant_luxury_contract.1501.d: "Deseo hablar con esos monjes."
 gdp_merchant_luxury_contract.1501.d.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [piety|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1501.d.tt: "Inicias un diálogo con los monjes"
 gdp_merchant_luxury_contract.1501.e: "Nadie se fijará en una piedra menos…"
 gdp_merchant_luxury_contract.1501.e.flavor: "Favorece la exhibición de [intrigue|El] [intrigue_i|E] y [prowess|El] [prowess_i|E]"
 gdp_merchant_luxury_contract.1501.e.tt: "Intentas hurtar un trozo del edificio"
 gdp_merchant_luxury_contract.1501.f: "Parece que es[pilgrim.Custom('ES_EA')] [pilgrim.GetWomanMan] necesita ayuda."
 gdp_merchant_luxury_contract.1501.f.flavor: "Favorece la exhibición de [diplomacy|El] [diplomacy_i|E] y [piety|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1501.f.tt: "Entablas conversación con [pilgrim.Custom('ES_ElLa')] peregrin[pilgrim.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1502.site: "[priest.Custom('ES_ElLa')|U] [priest.Custom('PriestTitle')] me mira cuidadosamente de arriba abajo, sopesa mis palabras y semblante mientras los devotos pasan a nuestro lado musitando oraciones y deseos.\n\n"
 gdp_merchant_luxury_contract.1502.site.success: "Al final, [priest.GetSheHe] suspira: «No puedo rechazar vuestra fervorosa petición». Estira la mano hacia un libro cercano, sus dedos recorren la portada un momento antes de entregármelo.\n\n«Tomad esto, [Select_CString(ROOT.Char.IsFemale, 'amiga mía', 'amigo mío' )]. Ojalá encontréis la palabra de [religious_building_faith.HighGodNameAlternate] en su interior»."
 gdp_merchant_luxury_contract.1502.site.failure: "Al final, [priest.GetSheHe] frunce el ceño. «Fuera de aquí, os habéis equivocado de lugar. Estamos en un/a [religious_building_faith.HouseOfWorship], un lugar de culto. Hoy no tengo tiempo para vuestras necedades».\n\nVarios devotos se giran para verme marchar."
 gdp_merchant_luxury_contract.1502.pilgrim: "Mediante unas preguntas amistosas me acabo enterando de que han traído una reliquia aquí para donarla a tal [pilgrim.GetFaith.HouseOfWorship], después de adquirirla cerca de su ciudad natal.\n\nHago una exhibición de alarma y finjo preocuparme por ellos, ¡pues les han estafado descaradamente!\n\n"
 gdp_merchant_luxury_contract.1502.pilgrim.success: "Disgustados, pero no enfadados, los veo marcharse y tirar la cajita al vertedero más allá del recinto."
 gdp_merchant_luxury_contract.1502.pilgrim.failure: "Sin embargo, su reacción me pilla por sorpresa, ya que arrojan la reliquia al suelo, la golpean y la pisotean hasta hacerla añicos, para gran consternación de la muchedumbre.\n\nSerá mejor que me vaya…"
 gdp_merchant_luxury_contract.1502.tomb: "¡Estas tumbas son más difíciles de reventar de lo que parece! Acabamos abriendo uno los monumentos más magníficos con un esfuerzo poderoso.\n\nMe seco el sudor para escudriñar el oscuro interior y veo algo; meto la mano con cautela y lo saco.\n\n«¡Traed la luz!», susurro impaciente.\n\nEn las manos sostengo…"
 gdp_merchant_luxury_contract.1502.tomb.success_critical: "¡una urna de factura excelente y decoración elegante!"
 gdp_merchant_luxury_contract.1502.tomb.success: "¿una urna gastada y dañada?"
 gdp_merchant_luxury_contract.1502.tomb.failure: "¿un #EMP hueso#!?"
 gdp_merchant_luxury_contract.1502.monks: "¡Estos monjes son más interesantes de lo que había pensado! Una vida en el cenobio genera muchas interpretaciones e ideas curiosas, desde su [monk.GetFaith.ReligiousText] a los misterios de [monk.GetFaith.TricksterGodName].\n\n"
 gdp_merchant_luxury_contract.1502.monks.success: "Entablamos una gran conversación y los monjes parecen tristes por tener que despedirse de mí. [monk.GetFirstName] me pone algo en la mano, sonriéndome con calidez."
 gdp_merchant_luxury_contract.1502.monks.failure: "Sin embargo, parece que [monk.GetFirstName] pierde el interés cada vez que hablo, disgustad[monk.Custom('ES_OA')] o desatent[monk.Custom('ES_OA')], y pronto deja claro que llevo demasiado tiempo en su compañía."
 gdp_merchant_luxury_contract.1502.keepsake: "Con una última mirada rápida a mi espalda, hago el máximo esfuerzo para echar abajo, atrapar y agarrar un trozo en un solo movimiento fluido.\n\n"
 gdp_merchant_luxury_contract.1502.keepsake.success: "Con gracia y destreza, saco un trocito del muro y lo oculto bajo la capa mientras camino con despreocupación. ¡Parece que nadie se ha dado cuenta!"
 gdp_merchant_luxury_contract.1502.keepsake.failure: "Mis torpes movimientos me llevan al suelo con un trompazo y me hacen bufar de dolor mientras varios peregrinos desplazan la mirada entre el muro y mi persona con incredulidad."
 gdp_merchant_luxury_contract.1502.apostate: "[pilgrim.Custom('ES_ElLa')|U] [pilgrim.GetWomanMan] no protesta cuando me siento junto a [pilgrim.GetSheHe] mientras evoco en voz baja mis pasajes favoritos del/de la [merchant.GetFaith.ReligiousText], pero [pilgrim.GetSheHe] pronto deja de llorar, distraíd[pilgrim.Custom('ES_OA')] por mis palabras.\n\n"
 gdp_merchant_luxury_contract.1502.apostate.success_critical: "Siento que mis palabras [pilgrim.GetHerHim] han conmovido y, desde luego, no tarda mucho en dejar claro que desea abandonar este lugar, ¡y unirse a mí en el sendero de [merchant.GetFaith.HighGodNameAlternate]!"
 gdp_merchant_luxury_contract.1502.apostate.success: "Mientras leo, noto un cambio en su ánimo, como si se hubiera quitado un peso de encima.\n\nSin una palabra, se levanta y sale del recinto, con su libro destrozado abandonado a mi lado."
 gdp_merchant_luxury_contract.1502.apostate.failure: "Pero no pasa mucho hasta que su semblante se endurece y le anima una nueva emoción: la ira.\n\nSus gritos de que [pilgrim.GetHerHim] dirijo a la apostasía —¡y en el terreno de un/a [pilgrim.GetFaith.HouseOfWorship], nada menos!— pronto atraen espectadores indignados…"
 gdp_merchant_luxury_contract.1502.a.critical: "¡Esto servirá muy bien!"
 gdp_merchant_luxury_contract.1502.a: "Esto servirá."
 gdp_merchant_luxury_contract.1502.b: "Esto tendrá que valer…"
 gdp_merchant_luxury_contract.1511.desc: "Cuando el sol se ha puesto, regresamos sigilosamente a las proximidades del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l] en busca de riquezas entre las tumbas olvidadas de lugareños fallecidos hace mucho.\n\nCon miedo a que nos descubran, nos cuidamos de evitar las rutas normales y al final nos encontramos en el cementerio frío y silencioso."
 gdp_merchant_luxury_contract.1511.a: "¡Abramos una tumba y con rapidez!"
 gdp_merchant_luxury_contract.1511.a.flavor: "Una prueba de tu [intrigue|El] [intrigue_i|E] y [prowess|El] [prowess_i|E]"
 gdp_merchant_luxury_contract.1511.a.success_critical: "Encuentras un artefacto valioso"
 gdp_merchant_luxury_contract.1511.a.success_critical.tt: "Encuentras un [domicile_artifact|El] de tipo #V curiosidad#! de alta calidad"
 gdp_merchant_luxury_contract.1511.a.success: "Encuentras un artefacto sencillo"
 gdp_merchant_luxury_contract.1511.a.success.tt: "Encuentras un [domicile_artifact|El] de tipo #V curiosidad#! de baja calidad"
 gdp_merchant_luxury_contract.1511.a.failure: "No encuentras nada de interés"
 gdp_merchant_luxury_contract.1511.a.failure.tt: "Encuentras un [domicile_artifact|El] de tipo #V curiosidad#!"
 gdp_merchant_luxury_contract.1511.artifact.urn: "Ajuar funerario de fe [religious_building_faith.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1511.artifact.urn.desc: "Una urna de la tumba de un [religious_building_faith.GetAdherentName] fallecido hace mucho, robada del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1511.artifact.skull: "Cráneo saqueado"
 gdp_merchant_luxury_contract.1511.artifact.skull.desc: "El cráneo de un [religious_building_faith.GetAdherentName] fallecido hace mucho, robado de una tumba del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1511.artifact.bone: "[priest.Custom('RandomSaintBone')] de un saqueo"
 gdp_merchant_luxury_contract.1511.artifact.bone.desc: "El hueso de un [religious_building_faith.GetAdherentName] fallecido hace mucho, robado de una tumba del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1521.desc: "Al atravesar las grandes puertas en una relativa oscuridad, me encuentro en una entrada adornada, cuyo aire pesa con aromas exóticos de ritos y ofrendas.\n\nLos fieles se agolpan en torno a un[priest.Custom('ES_XA')] [priest.GetWomanMan], [priest.Custom('ES_ElLa')] [priest.Custom('PriestTitle')], que habla con los congregantes, quienes me descubren al instante; está claro que aquí llamo la atención.\n\n[priest.GetSheHe|U] se precipita sobre mí [merchant.Custom2( 'QuirkAdverbPosOrNeg', SCOPE.sC('priest') )], «Saludos; destacáis en mi [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]».\n\n«¿Qué buscáis aquí?», pregunta mirándome con curiosidad. «¿Seguís los preceptos del [religious_building_faith.GetNameNoTooltip|l]?»."
 gdp_merchant_luxury_contract.1521.a: "Quiero aprender todo lo posible sobre [religious_building_faith.GetNameNoTooltip]."
 gdp_merchant_luxury_contract.1521.a.flavor: "Una prueba de tu [learning|El] [learning_i|E] y [piety_level|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1521.a.success: "[priest.Custom('ES_ElLa')|U] [priest.Custom('PriestTitle')] me ofrece un texto"
 gdp_merchant_luxury_contract.1521.a.failure: "[priest.Custom('ES_ElLa')|U] [priest.Custom('PriestTitle')] sospecha"
 gdp_merchant_luxury_contract.1531.desc: "El grupo peregrino [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('pilgrim') )] me observa con sospecha según me acerco, aferrando su humilde reliquia mientras intento echarle un buen vistazo.\n\nDesde luego es un objeto de cierta importancia para los [pilgrim.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip] y sería interesante en [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nSeguro que puedo convencer a estos pueblerinos de que un [pilgrim.GetFaith.PriestNeuter] sin escrúpulos les ha engañado…"
 gdp_merchant_luxury_contract.1531.a: "Es una falsificación obvia; hay centenares de ellas en [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]…"
 gdp_merchant_luxury_contract.1531.a.success: "Los peregrinos abandonan la reliquia"
 gdp_merchant_luxury_contract.1531.a.failure: "Los peregrinos están enfadados"
 gdp_merchant_luxury_contract.1541.desc: "Al principio, los monjes me miran con recelo, desconcertados por mis costumbres extranjeras, pero no pueden ocultar su curiosidad; sobre todo cuando dejo claro que deseo debatir de teología.\n\nLos más jóvenes no están seguros, pero [monk.GetFirstName], su líder [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('monk') )], me da la bienvenida a su círculo y me acribilla a preguntas sobre mis viajes."
 gdp_merchant_luxury_contract.1541.a: "Sí, sí, ¿pero qué pensáis de [monk.GetFaith.WealthGodName]?"
 gdp_merchant_luxury_contract.1541.a.flavor: "Una prueba de tu [learning|El] [learning_i|E] y [piety_level|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1541.a.success: "Los monjes se divierten con el debate"
 gdp_merchant_luxury_contract.1541.a.failure: "Los monjes se sienten decepcionados"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads: "Cuentas para la oración [religious_building_faith.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1541.artifact.prayer_beads.desc: "Una sarta de cuentas de oración [religious_building_faith.GetAdjective]; un regalo de un monje del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1541.artifact.icon: "Icono de tradición [religious_building_faith.GetAdjectiveNoTooltip]"
 gdp_merchant_luxury_contract.1541.artifact.icon.desc: "Un [SCOPE.Custom('ArtifactArticleWealth')|l] icono de [SCOPE.Custom('ArtifactQuality')] factura que representa a [newly_created_artifact.GetFeatureText('icon_decoration')]; un regalo de [monk.GetFirstName], monj[monk.Custom('ES_EA')] del/de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1551.desc: "Mirando a mi alrededor subrepticiamente, paseo de modo indiferente por el/la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l], sonrío educad[ROOT.Char.Custom('ES_OA')] con quienes me cruzo y aparento admirar la arquitectura.\n\nPoco a poco me dirijo a una zona de mampostería, que ya parece algo suelta, en uno de los lugares más tranquilos del perímetro del complejo."
 gdp_merchant_luxury_contract.1551.a: "Solo he de encontrar el momento adecuado…"
 gdp_merchant_luxury_contract.1551.a.success: "Te llevas un trozo de mampostería"
 gdp_merchant_luxury_contract.1551.a.failure: "Te pillan con las manos en la masa"
 gdp_merchant_luxury_contract.1551.artifact.edifice: "Mampostería santa"
 gdp_merchant_luxury_contract.1551.artifact.edifice.desc: "Un trocito de mampostería del centro religioso del/ de la [religious_building_district.GetType.GetPrimaryBuildingType.GetName|l], afanado como recuerdo."
 gdp_merchant_luxury_contract.1561.desc: "Según me acerco a est[pilgrim.Custom('ES_EA')] [pilgrim.GetWomanMan], me queda claro que se trata de un[pilgrim.Custom('ES_XA')] peregrin[pilgrim.Custom('ES_OA')], como otros muchos por aquí, cargad[pilgrim.Custom('ES_OA')] con su equipo de viaje y quemad[pilgrim.Custom('ES_OA')] por el sol.\n\nCapto que se llama [pilgrim.GetFirstName] y que, tras muchas desventuras, ha perdido la fe en [pilgrim.GetFaith.HighGodName], la mayor deidad [pilgrim.GetFaith.GetAdjectiveNoTooltip]. Ni esta peregrinación ha conseguido devolvérsela.\n\nMe fijo en su [pilgrim.GetFaith.ReligiousText], un volumen manchado de lágrimas y muy desgastado. Un testimonio de su angustia."
 gdp_merchant_luxury_contract.1561.a: "Mi [merchant.GetFaith.ReligiousText] tiene las repuestas…"
 gdp_merchant_luxury_contract.1561.a.flavor: "Una prueba de tu [diplomacy|El] [diplomacy_i|E] y [piety_level|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1561.a.success_critical: "[pilgrim.GetFirstNameNoTooltip] se convierte"
 gdp_merchant_luxury_contract.1561.a.success: "[pilgrim.GetFirstNameNoTooltip] se anima"
 gdp_merchant_luxury_contract.1561.a.failure: "[pilgrim.GetFirstNameNoTooltip] se enfurece"
 gdp_merchant_luxury_contract.1561.artifact.holy_book: "[religious_building_faith.ReligiousText|U] con manchas de lágrimas"
 gdp_merchant_luxury_contract.1561.artifact.holy_book.desc: "Las escrituras religiosas personales del credo [pilgrim.GetFaith.GetAdherentNameNoTooltip] de [pilgrim.GetFirstName], quien ha perdido la fe."
 ### UNIVERSITY SITE
 gdp_merchant_luxury_contract.1601.t: "[task_contract.GetType.GetName]: nexo de conocimiento"
 gdp_merchant_luxury_contract.1601.desc: "Me impresiona la escala del/de la [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName|l], sus terrenos y salones que resuenan con los debates y la fascinación de tantas almas estudiosas.\n\n"
 gdp_merchant_luxury_contract.1601.dean: "Un[scholar.Custom('ES_XA')] [scholar.GetWomanMan], [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] sin parar, corre de un lado a otro flanquead[scholar.Custom('ES_OA')] por asistentes, rechazando altaner[scholar.Custom('ES_OA')] a sus colegas. Es evidente que está al mando."
 gdp_merchant_luxury_contract.1601.sages: "Bajo un árbol del recinto, un[sage.Custom('ES_XA')] ancian[sage.Custom('ES_OA')] está sentad[sage.Custom('ES_XA')] en silencio, tal vez reflexiona sobre alguna profunda cuestión del universo, tal vez solo echa una cabezada."
 gdp_merchant_luxury_contract.1601.library: "Al cruzar una puerta, vislumbro a un[scholar.Custom('ES_XA')] [scholar.GetWomanMan] [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )] a solas en una biblioteca impresionante, rodead[scholar.Custom('ES_OA')] por montones de textos. Lee en silencio y parece en estado de dicha."
 gdp_merchant_luxury_contract.1601.physician: "En otra estancia, un[physician.Custom('ES_XA')] [physician.GetWomanMan] se alza sobre una macabra colección de especímenes, animales y humanos por igual e instrumentos diversos. Espero que sea un[physician.Custom('ES_XA')] médic[physician.Custom('ES_OA')]…"
 gdp_merchant_luxury_contract.1601.student: "Es difícil no notar a un grupo especialmente jaranero de estudiantes que discuten de buena fe, se ríen a todo volumen y se toman el pelo en un rincón a la sombra del patio central."
 gdp_merchant_luxury_contract.1601.botanist: "En un rincón tranquilo del complejo me topo con una estancia que alberga una extraña colección de plantas y bestias, conservadas y catalogadas por un[botanist.Custom('ES_XA')] [botanist.GetWomanMan] [merchant.Custom2( 'QuirkAdjectivePosOrNeg', SCOPE.sC('scholar') )]"
 gdp_merchant_luxury_contract.1601.a: "Será quien manda aquí."
 gdp_merchant_luxury_contract.1601.a.flavor: "Favorece la exhibición de [diplomacy|El] [diplomacy_i|E] y [prestige_level|El] [prestige_i|E]"
 gdp_merchant_luxury_contract.1601.a.tt: "Te acercas a esa persona"
 gdp_merchant_luxury_contract.1601.b: "Es[sage.Custom('ES_EA')] ancian[sage.Custom('ES_OA')] me atrae…"
 gdp_merchant_luxury_contract.1601.b.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [piety_level|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1601.b.tt: "Te acercas [sage.Custom('ES_AlAla')] sabi[sage.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1601.c: "Siempre se puede encontrar conocimiento en una biblioteca."
 gdp_merchant_luxury_contract.1601.c.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [diplomacy|El] [diplomacy_i|E]"
 gdp_merchant_luxury_contract.1601.c.tt: "Entras en la biblioteca"
 gdp_merchant_luxury_contract.1601.d: "El camino de la medicina es fascinante."
 gdp_merchant_luxury_contract.1601.d.flavor: "Favorece la exhibición de [learning|El] [learning_i|E]"
 gdp_merchant_luxury_contract.1601.d.tt: "Te acercas [physician.Custom('ES_AlAla')] médic[physician.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1601.e: "Esos estudiantes parecen divertidos."
 gdp_merchant_luxury_contract.1601.e.flavor: "Favorece la exhibición de [diplomacy|El] [diplomacy_i|E] y [prowess|El] [prowess_i|E]"
 gdp_merchant_luxury_contract.1601.e.tt: "Te acercas a los estudiantes"
 gdp_merchant_luxury_contract.1601.f: "La colección de especímenes es impresionante."
 gdp_merchant_luxury_contract.1601.f.flavor: "Favorece la exhibición de [learning|El] [learning_i|E] y [diplomacy|El] [diplomacy_i|E]"
 gdp_merchant_luxury_contract.1601.f.tt: "Examinas la colección"
 gdp_merchant_luxury_contract.1601.artifact.collection.desc: "En un principio, parte de la colección del/de la [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName|l]."
 gdp_merchant_luxury_contract.1602.dean: "[scholar.GetFirstName] sigue mi planteamiento hasta haberme explicado de un modo claro. Después de todo, soy de una tierra lejana, donde este texto no se sostiene.\n\nTras haber presentado los argumentos necesarios, le doy espacio para hablar y aguardo expectante."
 gdp_merchant_luxury_contract.1602.dean.success: "Una sonrisa ancha se extiende por su rostro mientras agarra los papeles oficiales que certifican mis… cualidades."
 gdp_merchant_luxury_contract.1602.dean.failure: "Su rostro impasible se endurece y, con torpeza, me pide que me vaya."
 gdp_merchant_luxury_contract.1602.sages: "Hablamos sobre filosofía lo que me parece una eternidad, le damos vueltas a cuestiones sobre las que apenas había hablado, sin fijarnos en cómo se oscurece el cielo y se apaga el murmullo de otro día de negocios.\n\n"
 gdp_merchant_luxury_contract.1602.sages.success: "Por fin [sage.Custom('ES_ElLa')] [sage.GetWomanMan] [sage.Custom('GetYoungMiddleAgedOld')] se levanta, se saca algo de las ropas y me lo pasa con una mirada de complicidad y un asentimiento, para desaparecer sin más."
 gdp_merchant_luxury_contract.1602.sages.failure: "Por fin [sage.Custom('ES_ElLa')] [sage.GetWomanMan] [sage.Custom('GetYoungMiddleAgedOld')] se levanta, se arregla las ropas y desaparece sin más. Al menos he disfrutado de nuestra conversación…"
 gdp_merchant_luxury_contract.1602.library: "Muestro interés por su material de lectura y entonces se presenta como [scholar.GetFirstName]. Se pasa un tiempo enumerando las muchas obras que ha leído y las que tiene por leer como parte de sus estudios, para preguntarme mi opinión sobre cada una de ellas.\n\n"
 gdp_merchant_luxury_contract.1602.library.success: "[scholar.GetFirstNameNoTooltip] pronto sonríe como un niño y cuando al final llega la hora de marcharme, me pasa un pequeño volumen con un guiño travieso."
 gdp_merchant_luxury_contract.1602.library.failure: "[scholar.GetFirstNameNoTooltip] pierde rápidamente el interés en mí y mis respuestas; se vuelve de malos modos hacia sus escribanos, así que me marcho."
 gdp_merchant_luxury_contract.1602.physician: "Expreso mi interés en el tema de la anatomía y contribuyo cuanto puedo. [physician.GetFirstNameNoTooltip] habla largo y tendido sobre el funcionamiento del cuerpo, hasta agarra objetos óseos para explicar sus ideas.\n\n"
 gdp_merchant_luxury_contract.1602.physician.success: "A [physician.GetFirstNameNoTooltip] parece impresionarle mi conocimiento, se lamenta de la ignorancia de sus estudiantes y colegas y me entrega un artículo."
 gdp_merchant_luxury_contract.1602.physician.failure: "[physician.GetFirstNameNoTooltip] pone los ojos en blanco, impaciente, ante mis preguntas y explicaciones inseguras y rápidamente encuentra cualquier mala excusa para echarme de la estancia."
 gdp_merchant_luxury_contract.1602.student: "Armamos una escandalera en [student.Custom('GetPubName')], mientras me rodea un grupo de jóvenes juerguistas, les cuento historias de mis viajes y respondo a sus muchas preguntas.\n\n"
 gdp_merchant_luxury_contract.1602.student.success: "Vamos de taberna en taberna y pronto se hace de día. Nos despedimos tras una última charla a un lado del camino y uno de ellos me pone algo en la mano. ¡Vaya noche!"
 gdp_merchant_luxury_contract.1602.student.failure: "Al principio la cosas parecen ir bien, pero pronto se cansan de mi compañía y me encuentro sol[ROOT.Char.Custom('ES_OA')] con mi copa en la parte mala de la ciudad. ¿Qué he dicho?"
 gdp_merchant_luxury_contract.1602.botanist: "[botanist.GetFirstName] me guía con ganas por la colección y me indica artículos curiosos y hermosos.\n\n"
 gdp_merchant_luxury_contract.1602.botanist.success: "A [botanist.GetSheHe] [botanist.GetHerHim] anima sobremanera mi interés, ya que asiento con entusiasmo cuando me señala la rareza y procedencia de los artículos.\n\nCuando al fin tengo que marcharme, me regala un objeto pequeño por el que parecí interesarme."
 gdp_merchant_luxury_contract.1602.botanist.failure: "Parece que soy incapaz de apreciar la colección o su guía y pronto me deja claro que mi presencia no añade nada a sus necesidades…"
 gdp_merchant_luxury_contract.1602.a: "¡Lo apreciaré!"
 gdp_merchant_luxury_contract.1602.b: "Algo es algo, supongo."
 gdp_merchant_luxury_contract.1611.desc: "Con cierto desdén al principio, [scholar.Custom('ES_ElLa')] decan[scholar.Custom('ES_OA')] se siente claramente halagad[scholar.Custom('ES_OA')] cuando le dejo claro que soy un[merchant.Custom('ES_XA')] mercader exitos[merchant.Custom('ES_OA')] del lejano país de [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip], y se presenta teatralmente como «[scholar.Custom('MistressMaster')] [scholar.GetFirstName]».\n\nMe invita a su despacho privado, mientras indica peculiaridades y curiosidades arquitectónicas durante el camino. «Y, decidme, ¿qué puedo hacer por vos, buen[merchant.Custom('ES_XA')] [merchant.GetTitledFirstNameNoTooltip|l]?», se sonríe."
 gdp_merchant_luxury_contract.1611.a: "Ojalá hubiera podido estudiar aquí…"
 gdp_merchant_luxury_contract.1611.a.flavor: "Una prueba de tu [diplomacy|El] [diplomacy_i|E] y [prestige_level|El] [prestige_i|E]"
 gdp_merchant_luxury_contract.1611.a.success_critical: "Se te otorga un diploma de honor"
 gdp_merchant_luxury_contract.1611.a.success: "Se te ofrece un diploma de honor a cambio de dinero"
 gdp_merchant_luxury_contract.1611.a.failure: "[scholar.GetFirstNameNoTooltip] se siente ofendid[scholar.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1611.artifact.certificate: "Diploma de honor"
 gdp_merchant_luxury_contract.1611.artifact.certificate.desc: "Un certificado honorario de conocimiento, entregado por el deán del/de la [scholarly_building_district.GetType.GetPrimaryBuildingType.GetName|l] de [local_province.GetBaronyNameExplicitly]."
 gdp_merchant_luxury_contract.1621.desc: "Me acerco [sage.Custom('ES_AlAla')] sabi[sage.Custom('ES_OA')] con cautela y cuidado de no molestar impropiamente su profunda concentración; ¡sin embargo, es [sage.GetSheHe] quien me sorprende!\n\n«¿Os gustaría uniros a mí?», pregunta tranquilamente sin volverse ni tan siquiera abrir los ojos. «Venid y sentaos».\n\nAcepto su oferta con humildad y me acomodo a su lado con toda la gracia que puedo.\n\n«Me llamo [sage.GetFirstName]», carraspea. «¿Qué os trae a este lugar?»."
 gdp_merchant_luxury_contract.1621.a: "No…, no lo sé."
 gdp_merchant_luxury_contract.1621.a.flavor: "Una prueba de tu [learning|El] [learning_i|E] y [piety_level|El] [piety_i|E]"
 gdp_merchant_luxury_contract.1621.a.success: "[sage.GetSheHe|U] está animad[sage.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1621.a.failure: "[sage.GetSheHe|U] está decepcionad[sage.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1631.desc: "Entro en una estancia de lo que parece un conjunto interminable de estanterías rellenas hasta arriba de pergaminos, saturada con los olores mohosos de tinta vieja y papel.\n\nMe acerco sin hacer ruido [scholar.Custom('ES_AlAla')] sabi[scholar.Custom('ES_OA')] silencios[scholar.Custom('ES_OA')], hasta que al final capto su mirada. Al principio activamente desdeños[scholar.Custom('ES_OA')], se le suaviza la mirada cuando mi condición extranjera parece picarle la curiosidad. "
 gdp_merchant_luxury_contract.1631.a: "¿Qué leéis, amig[scholar.Custom('ES_OA')]?"
 gdp_merchant_luxury_contract.1631.a.success: "A [scholar.GetSheHe] le impresiona tu conocimiento"
 gdp_merchant_luxury_contract.1631.a.failure: "[scholar.GetSheHe|U] cree que eres [Select_CString(ROOT.Char.IsFemale, 'una cateta', 'un patán' )]"
 gdp_merchant_luxury_contract.1631.artifact.book.desc: "[artifact.GetDesc] $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.desc: "Una escena macabra me aguarda. Incontables huesos, humanos y de otros tipos, presentados en filas ordenadas, mientras un[physician.Custom('ES_XA')] [physician.GetWomanMan] los revisa y toquetea [merchant.Custom2('QuirkAdjectivePosOrNeg', physician)] para beneficio de un surtido de estudiantes.\n\n[physician.GetSheHe|U] se acaba fijando en mí con una mirada socarrona y me hace gestos para que me una al grupo. Capto que se trata de [physician.GetFirstName] y me alivia saber que es un[physician.Custom('ES_XA')] [physician.GetWomanMan] de medicina."
 gdp_merchant_luxury_contract.1641.a: "Oh, ¿no es eso un hueso de [merchant.Custom('RandomSaintBone')|l]?"
 gdp_merchant_luxury_contract.1641.a.success: "[physician.GetFirstNameNoTooltip] queda impresionad[physician.Custom('ES_OA')]"
 gdp_merchant_luxury_contract.1641.a.failure: "Disgustas a [physician.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1641.artifact.elixir.desc: "$artifact_elixir_description$. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.bone: "[physician.Custom('RandomSaintBone')] de humano"
 gdp_merchant_luxury_contract.1641.artifact.bone.desc: "Un hueso que se emplea como material didáctico en medicina. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1641.artifact.skull: "Cráneo humano"
 gdp_merchant_luxury_contract.1641.artifact.skull.desc: "Un cráneo que se emplea como material didáctico en medicina. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1651.desc: "Según me acerco al grupo, me presento. Los estudiantes hacen un círculo a mi alrededor, riendo entre ellos, pero claramente intrigados por el acercamiento de un[ROOT.Char.Custom('ES_XA')] desconocid[ROOT.Char.Custom('ES_OA')].\n\nEn cuanto se enteran de que soy un[ROOT.Char.Custom('ES_XA')] mercader muy viajad[ROOT.Char.Custom('ES_OA')] de las lejanas tierras de [merchant.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTierNoTooltip] les pica la curiosidad y me invitan a un establecimiento cercano de mala fama para… un refrigerio."
 gdp_merchant_luxury_contract.1651.a: "¡A la taberna!"
 gdp_merchant_luxury_contract.1651.a.success: "Entretienes a los estudiantes"
 gdp_merchant_luxury_contract.1651.a.failure: "Aburres a los estudiantes"
 gdp_merchant_luxury_contract.1661.desc: "Al entrar en la sala extraña, me quedo pasmad[ROOT.Char.Custom('ES_OA')]. Jamás había visto semejante colección, la incontable exhibición de colores, pétalos y hojas, pieles y plumas, un banquete para los sentidos y un compendio de la naturaleza…\n\nRegreso a la realidad cuando [botanist.Custom('ES_ElLa')] administrador[botanist.Custom('ES_XA')] del lugar se presenta como [botanist.GetFirstName] y se ofrece a hacer una visita guiada por el lugar."
 gdp_merchant_luxury_contract.1661.a: "¡Os lo agradezco!"
 gdp_merchant_luxury_contract.1661.a.success: "[botanist.GetFirstNameNoTooltip] agradece tu interés"
 gdp_merchant_luxury_contract.1661.a.failure: "Decepcionas a [botanist.GetFirstNameNoTooltip]"
 gdp_merchant_luxury_contract.1661.artifact.flower.desc: "$artifact_pressed_flower_description$ $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.animal.desc: "El/La [newly_created_artifact.Custom('ArtifactAnimalTrinketType')] de un ejemplar de [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
 gdp_merchant_luxury_contract.1661.artifact.feather.desc: "La pluma de un espécimen de [owner.Custom('GetAnimalType')]. $gdp_merchant_luxury_contract.1601.artifact.collection.desc$"
