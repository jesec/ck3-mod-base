 patrician_promote_ambition_bonus_tt: "Si tiene éxito:"
 scheme_critical_moments.1142.desc_patrician_self: "Todas las energías y recursos volcados en mi campaña de autopromoción han dado sus frutos.\n\nMi posición entre mis iguales ha mejorado, nuevos partidarios acuden en masa a mi [house|El], ¡y estoy más cerca que nunca de alcanzar mi meta!"
 scheme_critical_moments.1142.desc_patrician_other: "Todas las energías y recursos volcados en promover la causa [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l] han dado sus frutos.\n\nSu reputación entre sus iguales ha mejorado, ahora nuevos partidarios están convencidos de su valía, ¡y su posición en la [republic|El] es un poco más alta!"
 scheme_critical_moments.1143.desc_patrician_self: "Todas las energías y recursos volcados en mi campaña de autopromoción no han sido suficientes. Nadie se convenció de mi valía ni influyeron mis promesas o sobornos, así que mi posición permanece inalterada.\n\nTendré que pensar en algo distinto para promocionar mi [house|El]."
 scheme_critical_moments.1143.desc_patrician_other: "$scheme_critical_moments.1143.desc_other$"
 patrician_promote_success_toast: "¡Posición promocionada!"
 patrician_promote_toast_scheme_desc: "Tu [target.Custom2('RelationToMeShort', SCOPE.sC('owner'))], [owner.GetShortUINameNoTooltip|U], ha promocionado tu posición"
