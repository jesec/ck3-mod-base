 patrician_find_secrets_desc_general: "En una [scheme|El] de encontrar secretos, intentas revelar un [secret|El] criminal o vergonzoso relativo a otra [patrician_family|El]."
 PATRICIAN_FIND_SECRETS_SUCCESS_DESC: "Desvelarás un [secret|El] perteneciente a la [patrician_family|El] de [SCHEME.GetTargetCharacter.GetShortUIName], si existe."
 PATRICIAN_FIND_SECRETS_DISCOVERY_DESC: "No te expones por intentar desvelar un [secret|El]"
