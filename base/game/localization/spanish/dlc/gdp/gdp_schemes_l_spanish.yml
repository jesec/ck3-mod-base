 scheme_critical_moments.8602.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.8602.desc: "Los magistrados de [trade_post_county.GetName] tienen un precio, y parece ser modesto. Sello a sello, la propiedad de [trade_post_province.GetName] pasa a ser nuestra.\n\nCuando [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] se entera, nuestros agentes ya están despachando a sus empleados y quitando sus colores de la puerta."
 scheme_critical_moments.8602.a: "Bonito domicilio. Y ahora es nuestro."
 scheme_critical_moments.8603.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.8603.desc: "Se ha sobornado a todo el que se podía sobornar y no se ha cumplido ni una sola de las promesas. Los magistrados de [trade_post_county.GetName] se embolsaron mi dinero sin molestarse siquiera en defender mi derecho a la propiedad.\n\nEl dominio [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l] sobre este lugar permanece imperturbable."
 scheme_critical_moments.8603.discovered: "\n\nPeor aún, [target.Custom('ES_ElLa')] [target.GetTitledFirstNameNoTooltip|l] sabe exactamente qué mano estaba intentando acercarse a su bolsa…"
 scheme_critical_moments.8603.fallback: "\n\nAl menos nuestra participación en el asunto continúa siendo un secreto."
 scheme_critical_moments.8603.a: "Monedas desperdiciadas en hombres sin fe."
 scheme_critical_moments.8603.tt.failed: "¡[scheme.GetOwner.GetShortUIName|U] ha intentado arrebatarte tu [trade_post|El] de [trade_post_province.GetNameNoTooltip], pero ha fallado!"
 scheme_critical_moments.8604.t: "Puesto comercial arrebatado: [trade_post_province.GetNameNoTooltip]"
 scheme_critical_moments.8604.desc: "Un jinete trae noticias de [trade_post_county.GetName]: han echado a nuestro agente a la calle y los magistrados locales me han declarado persona non grata a la vez que han nombrado a otro dueño para el puesto comercial de [trade_post_province.GetName].\n\nAños de comercio, provisión y buena voluntad ganada con esfuerzo, borrados de un plumazo por hombres a los que ya habíamos pagado."
 scheme_critical_moments.8604.discovered: "\n\nY ahora [owner.Custom('ES_ElLa')] [owner.GetTitledFirstName|l] ocupa mi lugar, como si siempre hubiera sido suyo. ¡#EMP No#! olvidaremos esto!"
 scheme_critical_moments.8604.a: "¡Expulsados ante nuestra propia puerta!"
 steal_trade_post_failed_toast: "Intento de arrebatar puesto comercial"
 steal_trade_post_host_toast: "El puesto comercial cambia de manos"
 steal_trade_post_host_toast_desc: "El [trade_post|El] en [trade_post_province.GetName] ha pasado de [target.GetShortUIName] a [owner.GetShortUIName]"
