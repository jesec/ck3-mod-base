 hostile_takeover_desc_general: "$hostile_takeover$ es aquella [Concept( 'hostile_scheme', 'conjura hostil' )|E] que busca hacerse con los recursos de una [company|lE] [merchant|El] rival. Se basa en la [Concept( 'intrigue', 'intriga' )|E] y [stewardship|El], y se pueden reclutar [Concept( 'agents', 'agentes' )|E].\n\nSi se logra realizar la $hostile_takeover$ con éxito, la $game_concept_company$ del [Concept( 'scheme_target', 'objetivo de la conjura' )|E] quedará destruida y eso impulsará la [competitiveness|lE] del [Concept( 'scheme_owner', 'líder de la conjura' )|E]."
