 gdp_patrician_find_secrets.0002.t: "$scheme_critical_moments.1132.t$"
 gdp_patrician_find_secrets.0002.desc: "Casi siento lástima por la familia [target.GetHouse.GetName], dado lo dispuestos —#EMP e incluso entusiasmados#!— que estaban sus sirvientes y supuestos asociados a revelar sus secretos más morbosos a mis agentes. #EMP Casi#!.\n\n¡La prueba que tengo en mis manos es innegable; [secret_holder.Custom('ES_ElLa')] [secret_holder.GetTitledFirstName|l] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]!"
 gdp_patrician_find_secrets.0002.a: "Su reputación está en mis manos."
 gdp_patrician_find_secrets.0003.t: "$scheme_critical_moments.1133.t$"
 gdp_patrician_find_secrets.0003.desc.nothing_to_find: "Mis agentes han rebuscado entre los documentos tirados por la familia [target.GetHouse.GetName], han coaccionado a sus sirvientes y han llenado los bolsillos de cada chismoso del mercado, y a pesar de todo, no han encontrado nada de valor.\n\nSean cuales sean los secretos que [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] guarde tras sus puertas, están demasiado enterrados como para poder distinguirlos o no existen en realidad."
 gdp_patrician_find_secrets.0003.desc.outmatched: "Mis agentes han acechado a la familia [target.GetHouse.GetName] a cada uno de sus pasos, pero apenas han conseguido ver ni una mísera sombra de sus secretos. Sus puertas están más cerradas que la bolsa de un avaro y sus sirvientes guardan sus lenguas con tanto celo que hacen incluso dudar de si poseen este órgano o no.\n\nSean cuales sean los depravados actos que [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] ha cometido, nos sabemos más ahora que el principio."
 gdp_patrician_find_secrets.0003.a: "¡[ROOT.Char.Custom('CulturalCurse')|U]! No ha servido de nada."
