 scheme_critical_moments.8402.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.8402.desc: "En el corazón de [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], observo a los magistrados [target_patron.Custom('ES_DelDela')] [target_patron.GetTitledFirstName|l] examinando lánguida y minuciosamente montañas de documentos. Cada sello satisfactorio confirma otro recurso de [target.GetHouse.GetName] que se transfiere a [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l].\n\nLa serenidad del zumbido de una mosca que perezosamente sobrevuela sus cabezas se ve repentinamente interrumpida por la irrupción de [target.GetFirstName] en la cámara.\n\n#EMP «¡TÚ!»#!, grita airad[target_patron.Custom('ES_OA')]. «¡¿Cómo?! #DIE2 ¿Por qué…?#!»."
 scheme_critical_moments.8402.a: "Solo es bueno para el negocio…"
 scheme_critical_moments.8403.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.8403.desc: "Tras muchas idas y venidas, y tras todo el hostigamiento [target_patron.Custom('ES_DelDela')] [target_patron.GetTitledFirstName|l], no pudimos dar las pinceladas finales antes de que [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] se diera cuenta de que algo iba mal…\n\n[target.GetPrimaryTitle.GetDefinitiveName] ha adoptado firmemente una postura defensiva, lo que ha acabado con nuestra posibilidad de burlar a esos cerdos en los tribunales."
 scheme_critical_moments.8403.discovered: "\n\nPara colmo, está claro que [target.Custom('ES_ElLa')] [target.GetTitledFirstNameNoTooltip|l] sabe que somos los que están detrás de esto…"
 scheme_critical_moments.8403.fallback: "\n\nLa clara ignorancia [target.Custom('ES_DelDela')] [target.GetTitledFirstNameNoTooltip|l] sobre nuestra participación en este asunto nos da, sin embargo, una pequeña esperanza…"
 scheme_critical_moments.8403.a: "Un clásico…"
 scheme_critical_moments.8403.tt.failed: "[scheme.GetOwner.GetShortUIName|U] ha intentado llevar a cabo una $hostile_takeover$ de la compañía de [target.GetShortUIName], ¡pero ha fracasado!"
 scheme_critical_moments.8404.t: "Toma de control hostil: [owner.GetPrimaryTitle.GetDefinitiveNameNoTooltip]"
 scheme_critical_moments.8404.desc: "Tras prestar atención al recuento diario de nuestras rutas y revolver en el barro en busca de posibilidades, hoy nos hemos dado cuenta de que nos estábamos centrando en lo que no debíamos.\n\n¡Ha llegado una misiva muy breve desde [target_patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], una formalidad que confirma un proceso judicial en el tribunal en el día de hoy, con el fin de disolver nuestra compañía y poner todos sus recursos #EMP en manos#! de [owner.GetPrimaryTitle.GetDefinitiveName|l]!\n\nPero, para cuando llego, ya es demasiado tarde, si es que hubiese habido alguna forma de detener esto…\n\n¡Esa comadreja [owner.Custom('ES_DelDela')] [owner.GetTitledFirstName|l] sonríe con malicia, mientras me observa revolviendo desesperadamente los documentos, todos firmados por mi patr[target_patron.Custom('ES_OnOna')], [target_patron.Custom('ES_ElLa')] [target_patron.GetTitledFirstName|l]!"
 scheme_critical_moments.8404.a: "¡¿Cómo?! #DIE2 ¿Por qué…?#!"
