 steal_market_insights_action: "Robar pericia de"
 steal_market_insights_desc_general: "$steal_market_insights$ es una [Concept( 'hostile_scheme', 'conjura hostil' )|E] que busca robar la [expertise|El] de una [company|lE] [merchant|El] rival. Se basa en la [Concept( 'intrigue', 'intriga' )|E] y [stewardship|El], y se pueden reclutar [Concept( 'agents', 'agentes' )|E].\n\nSi se logra $steal_market_insights$ con éxito, la [company|El] del [scheme_owner|El] obtendrá $game_concept_expertise$ en todas las [trade_categories|El] en las que la $game_concept_company$ del [scheme_target|El] tenga más $game_concept_expertise$."
