 scheme_critical_moments.8502.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.8502.desc: "Poco a poco, libros de cuentas robados, chismes desmenuzados y pedacitos obtenidos a cambio de favores pintan un cuadro de los muchos compradores, vendedores y otros contactos de [target.GetPrimaryTitle.GetDefinitiveName|l].\n\nSin duda esta información nos permitirá competir mejor por los artículos favoritos [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l] en condiciones más equitativas."
 scheme_critical_moments.8502.discovered: "\n\nAl menos, nuestras indagaciones han pasado desapercibidas para [target.Custom('ES_ElLa')] [target.GetTitledFirstNameNoTooltip|l]…"
 scheme_critical_moments.8502.a: "¡Excelente!"
 scheme_critical_moments.8502.tt.success: "[scheme.GetOwner.GetShortUIName|U] ha sido capaz de $steal_market_insights$ de la compañía de [target.GetShortUIName], ¡pero [scheme.GetOwner.Custom('ES_LoLa')] han descubierto!"
 scheme_critical_moments.8503.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.8503.desc: "Tantos días intercambiando palabras con los comerciantes y tantas noches interminables susurrando a la luz de las velas no nos han revelado nada sobre las operaciones de [target.GetPrimaryTitle.GetDefinitiveName|l]…\n\nIncluso los documentos traídos de las propias oficinas [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l] no eran más que garabatos sin sentido y cuentas viejas."
 scheme_critical_moments.8503.discovered: "\n\nPeor aún: parece que [target.Custom('ES_ElLa')] [target.GetTitledFirstNameNoTooltip|l] se ha enterado de nuestras intrigas."
 scheme_critical_moments.8503.fallback: "\n\nSin embargo, podemos respirar tranquilos; parece que [target.Custom('ES_ElLa')] [target.GetTitledFirstNameNoTooltip|l] no se ha enterado de nuestra conjura."
 scheme_critical_moments.8503.a: "Una pérdida de tiempo…"
 scheme_critical_moments.8503.tt.failed: "[scheme.GetOwner.GetShortUIName|U] ha intentado $steal_market_insights$ de la compañía de [target.GetShortUIName], ¡pero ha fracasado!"
