l_spanish:
 # Trade
 game_concept_trade: "Comercio"
 game_concept_trade_desc: "El $game_concept_trade$ es el sustento de las [republics|El], las [trade_leagues|El] y los [merchants|El].\n\nLas [trade_routes|El] sirven para la importación y exportación de [goods|El] desde los [trade_markets|El] y hasta estos, mientras que las [needs|El] y los [surpluses|El] de los mercados se ven dictados por los [buildings|El] de las [baronies|El] constituyentes.\n\nPor otra parte, el precio de venta queda determinado por la [prosperity|El] de la posesión, y los personajes involucrados en las ventas emplean la [competitiveness|El] y los [monopolies|El] para dominar los mercados. Para aumentar los beneficios, quien comercie en un mercado debería esforzarse por aumentar la [capacity|El] y la extensión de sus rutas, así como el número de mercados y mercaderías por ruta.\n\nTodas las [government_forms|El], salvo [adventurers|El] y [nomads|El], pueden involucrarse en el $game_concept_trade$."
 game_concept_trade_good: "Mercadería"
 game_concept_trade_goods: "Mercaderías"
 game_concept_trade_goods_i: "@trade_goods_icon!"
 game_concept_trade_good_possessive: "de la mercadería"
 game_concept_trade_goods_possessive: "de las mercaderías"
 game_concept_good: "Artículo"
 game_concept_goods: "Artículos"
 game_concept_basic_trade_good: "Mercadería básica"
 game_concept_basic_trade_goods: "Mercaderías básicas"
 game_concept_basic_trade_good_desc: "$game_concept_basic_trade_goods$ son [Concept('trade_goods', 'aquellas')|E] que se pueden trasladar por una [distribution_route|El].\n\nPor el contrario, una [profit_route|El] o [commission_route|El] puede comerciar con todo tipo de $game_concept_trade_goods$."
 game_concept_market_toll: "Canon de mercado"
 game_concept_market_tolls: "Cánones de mercado"
 game_concept_toll: "Canon"
 game_concept_tolls: "Cánones"
 game_concept_market_toll_desc: "$game_concept_market_tolls$ son los impuestos que se cobran con cada venta que se hace en un [trade_market|El].\n\nLos controla el [market_owner|El], quien también recibe todas las tasas de estos.\n\nLos mercados con cánones bajos son más rentables para los [merchants|El].\n\nLos $game_concept_market_tolls$ altos aumentan los [income|El] $game_concept_market_owner_possessive$, pero recortan los beneficios que los $game_concept_merchants$ obtienen en cada [profit_route|El] cuando venden $game_concept_goods$ en el $game_concept_market$. Unos cánones muy elevados pueden obligar a los mercaderes a vender en $game_concept_markets$ menos tasados.\n\nEl [market_owner|El] y sus [direct_vassals|El], [tributaries|El] y [clients|El] están exentos de pagar cánones."
 game_concept_good_possessive: "del artículo"
 game_concept_goods_possessive: "de los artículos"
 game_concept_trade_good_desc: "Las $game_concept_trade_goods$ se pueden comprar y vender en el [market|El]. Se comercia por todo el mundo con una gran variedad de artículos para satisfacer las [needs|El] de los [realms|El]."
 game_concept_trade_category: "Categoría de artículo"
 game_concept_trade_categories: "Categorías de artículos"
 game_concept_trade_category_short: "Categoría"
 game_concept_trade_categories_short: "Categorías"
 game_concept_trade_category_desc: "Las $game_concept_trade_categories$ es cómo se agrupan las [trade_goods|lE]. Los [trade_markets|El] suelen tener [need|El] de artículos de una cierta categoría. Cualquier artículo de esa categoría satisfará esa necesidad."
 game_concept_trade_expertise: "Pericia comercial"
 game_concept_expertise: "Pericia"
 game_concept_trade_expertise_desc: "La $game_concept_trade_expertise$ representa la experiencia práctica de comerciar en una [trade_category|El] específica. Se gana a partir del [primary_good|El] de las [trade_routes|El] activas. Según crece la pericia, resulta más rentable gestionar esa categoría, y unos [expertise_levels|El] altos conceden mayores bonificaciones que dependen de la categoría."
 game_concept_trade_expertise_progress: "Progreso de pericia comercial"
 game_concept_expertise_progress: "Progreso de pericia"
 game_concept_trade_expertise_progress_desc: "Cada punto de [expertise|El] aumenta el progreso de un personaje hacia el siguiente [expertise_level|El]."
 game_concept_trade_expertise_level: "Nivel de pericia comercial"
 game_concept_expertise_level: "Nivel de pericia"
 game_concept_expertise_levels: "Niveles de pericia"
 game_concept_trade_expertise_level_desc: "El $game_concept_trade_expertise_level$ de una [trade_category|El] es una ordenación que refleja la experiencia que tiene una [trade_company|El] en comerciar en esa categoría.\n\nAvanza según se acumula [expertise_progress|El] de las [trade_routes|El] activas y cada nivel proporciona bonificaciones [Concept('trade', 'comerciales' )|E] extra.\n\nSin comercio activo en la categoría, el nivel bajará poco a poco (#N -[GetDefine('NTrade', 'TRADE_CATEGORY_BASE_MONTHLY_XP_DECLINE')|0]#! progreso de pericia mensual)."
 game_concept_trade_market: "Mercado comercial"
 game_concept_market_i: "@trade_market_icon!"
 game_concept_trade_markets: "Mercados comerciales"
 game_concept_trade_market_possessive: "del mercado comercial"
 game_concept_trade_markets_possessive: "de los mercados comerciales"
 game_concept_market: "Mercado"
 game_concept_markets: "Mercados"
 game_concept_market_possessive: "del mercado"
 game_concept_markets_possessive: "de los mercados"
 game_concept_trade_market_desc: "Un $game_concept_trade_market$ es un centro de comercio que consolida la [production|El] y las [needs|El] de todas las [holdings|El] que engloba.\n\nEn un mercado, la producción local se usa primero para satisfacer las [needs|El] de sus [buildings|El]; lo que reste se convierte en [surplus|El] que se puede vender, mientras que las necesidades no satisfechas tendrán que cubrirse con importaciones. Las [trade_routes|El] conectan mercados para transportar [goods|El] entre ellos.\n\nCada mercado se centra en torno a una [market_capital|El] en posesión del [market_owner|El], y cuanto mayor es su [Concept('market_prosperity', 'prosperidad' )|E], mejores serán los [sell_prices|El] que ofrezca a los comerciantes."
 game_concept_market_prosperity: "Prosperidad de mercado"
 game_concept_market_prosperity_i: "@prosperity_icon!"
 game_concept_market_prosperity_desc: "$game_concept_market_prosperity$ es el nivel medio de [prosperity|El] en todos los [counties|El] de un [market|El].\n\nUna $game_concept_market_prosperity$ alta aumenta los [sell_prices|El] de los [goods|El] en el mercado, lo que lo convierte en un destino más lucrativo para los [merchants|El]."
 game_concept_market_capital: "Capital de mercado"
 game_concept_market_capitals: "Capitales de mercados"
 game_concept_market_capital_possessive: "de la capital de mercado"
 game_concept_market_capitals_possessive: "de las capitales de mercados"
 game_concept_market_capital_desc: "La $game_concept_market_capital$ es la [holding|El] en el corazón de un [market|El], usualmente la capital [de_jure|El] del [duchy|El] que abarca el mercado.\n\nSe fija al principio de la partida y no se modifica. Quien posea esta [barony|El] se convierte en [market_owner|El] y controla dicho mercado."
 game_concept_market_owner: "Dueño del mercado"
 game_concept_market_owners: "Dueños de mercados"
 game_concept_market_owner_possessive: "del dueño del mercado"
 game_concept_market_owners_possessive: "de los dueños de los mercados"
 game_concept_owner: "Dueño"
 game_concept_owners: "Dueños"
 game_concept_owner_possessive: "del dueño"
 game_concept_owners_possessive: "de los dueños"
 game_concept_market_owner_desc: "El $game_concept_market_owner$ es quien posee la [Concept('market_capital', 'capital' )|El] de un [market|El], cuyo control se transfiere con la posesión de su [barony|El] mediante guerra o herencia.\n\nEl dueño del mercado lo controla; puede crear [distribution_routes|El] conectadas con este, es el socio necesario para [commission_routes|El], puede ofrecer [monopolies|El] en dicho mercado y fijar su [market_toll|El]."
 game_concept_market_priority: "Prioridad del mercado"
 game_concept_market_priorities: "Prioridades del mercado"
 game_concept_market_priority_desc: "$game_concept_market_priority$ es el orden por el cual se sirve a las [holdings|El] de un [market|El] a la hora de cubrir sus [needs|El].\n\nPrimero va la [market_capital|El], luego el resto de su [county|El], seguido de los otros $game_concept_counties$ por el [Concept('settlement_size', 'tamaño de asentamiento')|E] de sus [Concept('county_capital', 'capitales')|E].\n\nDentro de cada $game_concept_county$, la [county_capital|El] va en primer lugar y, a continuación, las otras $game_concept_holdings$ según el [Concept('settlement_size', 'tamaño de su asentamiento')|E].\n\nDentro de la [holding|El], puedes reordenar los [districts|El] y [buildings|El] para asegurarte de que el [building|El] correcto cubra sus [needs|El] primero."
 game_concept_market_share: "Cuota de mercado"
 game_concept_market_shares: "Cuotas de mercado"
 game_concept_market_share_desc: "Tu $game_concept_market_share$ es la cantidad de una [trade_good|El] con la que tu [profit_route|El] puede comerciar en un [market|El], dicha cantidad viene determinada por tu $game_concept_competitiveness$.\n\nPor ejemplo, si tienes tanta competitividad como todos los demás combinados en un cierto $game_concept_good$, tu $game_concept_market_share$ será del 50 %. Si nadie más comercia con ese artículo, tu cuota de mercado es siempre del 100 %.\n\nLlegados a ese punto, podrás comprar todo el [surplus|El] o venderlo para cubrir todas las [needs|El] de ese $game_concept_market$, siempre que tengas [capacity|El] suficiente."
 game_concept_trade_route: "Ruta comercial"
 game_concept_route_i: "@trade_route_icon!"
 game_concept_distribution_route_i: "@distribution_route_icon!"
 game_concept_trade_routes: "Rutas comerciales"
 game_concept_trade_route_possessive: "de la ruta comercial"
 game_concept_trade_routes_possessive: "de las rutas comerciales"
 game_concept_route: "Ruta"
 game_concept_routes: "Rutas"
 game_concept_route_possessive: "de la ruta"
 game_concept_routes_possessive: "de las rutas"
 game_concept_trade_route_desc: "Una $game_concept_trade_route$ permite a un [character|El] involucrarse en el [trade|El] para conseguir [gold|El] o satisfacer las demandas de su [realm|El]. Estos canales intercambian [goods|El] entre [markets|El], y se llevan el [surplus|El] de uno para satisfacer las [needs|El] del otro.\n\nHay tres tipos de rutas:\n #indent_newline:4    $EFFECT_LIST_BULLET$[distribution_route|E]: usada por [dukes|El] y superiores para satisfacer las [needs|El] de sus [buildings|El].\n$EFFECT_LIST_BULLET$[profit_route|E]: usadas por gobernantes [merchants|El] y [Concept('republican', 'republicanos')|E] para generar [gold|El].\n$EFFECT_LIST_BULLET$[commission_route|E]: similar a las rutas de beneficio, pero emitidas por gobernantes con títulos para que mercaderes cubran ciertas necesidades durante un tiempo limitado, con un único pago por adelantado.#!"
 game_concept_distribution_route: "Ruta de distribución"
 game_concept_distribution_routes: "Rutas de distribución"
 game_concept_distribution: "Distribución"
 game_concept_distribution_route_possessive: "de la ruta de distribución"
 game_concept_distribution_routes_possessive: "de las rutas de distribución"
 game_concept_distribution_route_desc: "$game_concept_distribution_route$ es un tipo de [Concept('trade_route', 'ruta' )|E] usado por [dukes|El] o gobernantes de nivel superior para proveer a su propio [realm|El].\n\nConecta dos [markets|El] y cualquier [surplus|El] en uno de ellos se usa para cubrir las [needs|El] del otro. Sin embargo, solo se pueden mover [basic_trade_goods|El] a través de $game_concept_distribution_routes$."
 game_concept_profit_route: "Ruta de beneficio"
 game_concept_profit_routes: "Rutas de beneficio"
 game_concept_profit: "Beneficio"
 game_concept_profit_route_possessive: "de la ruta de beneficio"
 game_concept_profit_routes_possessive: "de las rutas de beneficio"
 game_concept_profit_route_desc: "$game_concept_profit_route$ es un tipo de [Concept('trade_route', 'ruta' )|E] usado por [rulers|El] [merchants|El] y [Concept('republican', 'republicanos')|E] para ganar [gold|El].\n\nSe compran [trade_goods|El] baratas donde hay [surplus|El] y se venden donde las [needs|El] sean altas para sacar beneficio de la diferencia entre el [buy_price|El] y el de [Concept('sell_price', 'venta')|E]."
 game_concept_trade_route_modifier: "Modificador de ruta comercial"
 game_concept_trade_route_modifier_i: "@trade_route_icon!"
 game_concept_trade_route_modifiers: "Modificadores de rutas comerciales"
 game_concept_trade_route_modifier_desc: "Este [modifier|El] se aplica a todas las [trade_routes|El] de su titular. Los atributos que se pueden modificar son:\n$BULLET_WITH_TAB$[trade_competitiveness|E] [competitiveness_i]\n$BULLET_WITH_TAB$[trade_route_capacity_short|E] [trade_route_capacity_i]\n$BULLET_WITH_TAB$[route_length|E] [route_i]\n$BULLET_WITH_TAB$[max_trade_goods_short|E] [trade_goods_i]\n$BULLET_WITH_TAB$[max_trade_markets_short|E] [market_i]"
 game_concept_commission_route: "Ruta de encargo"
 game_concept_commission_route_desc: "$game_concept_commission_route$ es aquella [Concept('trade_route', 'ruta' )|E] que un [merchant|El] cubre en favor de su [merchant_patron|El].\n\nEl $game_concept_merchant_patron$ paga al $game_concept_merchant$ para traer una [trade_good|El] específica al [Concept('trade_market', 'mercado' )|E] indicado mientras dure el $game_concept_commission$.\n\nUn $game_concept_merchant$ puede tener #V 1#! $game_concept_commission_route$ a la vez."
 game_concept_commission_routes: "Rutas de encargo"
 game_concept_commission_route_possessive: "de la ruta de encargo"
 game_concept_commission_routes_possessive: "de las rutas de encargo"
 game_concept_commission: "Encargo"
 game_concept_commissions: "Encargos"
 game_concept_commission_possessive: "del encargo"
 game_concept_commissions_possessive: "de los encargos"
 game_concept_commissioned_route: "Ruta encargada"
 game_concept_commissioned_routes: "Rutas encargadas"
 game_concept_trade_route_length: "Longitud de la ruta comercial"
 game_concept_route_length: "Longitud de ruta"
 game_concept_trade_route_length_i: "@trade_route_length_icon!"
 game_concept_trade_route_length_desc: "$game_concept_trade_route_length$ es el número máximo de [baronies|El] por las que se puede extender una [profit_route|El], incluyendo mares y ríos navegables. Puede aumentar si se mejoran los [company_buildings|El]."
 game_concept_max_trade_goods: "Máximo de mercaderías"
 game_concept_max_trade_goods_short: "Mercaderías"
 game_concept_max_trade_goods_desc: "El $game_concept_max_trade_goods$ es el número de distintos tipos de [Concept('good', 'artículos')|E] con los que se puede comerciar en una [route|El]. Puede aumentar si se mejoran los [company_buildings|El].\n\nUna [profit_route|El] jamás podrá tener más de #V [GetDefine('NTrade', 'MAX_TRADE_GOODS_ON_ROUTE_CAP')|0]#! [goods|El], independientemente de sus bonificaciones."
 game_concept_max_trade_markets: "Máximo de mercados comerciales"
 game_concept_max_trade_markets_short: "Mercados comerciales"
 game_concept_max_trade_markets_desc: "El $game_concept_max_trade_markets$ es la cantidad de [markets|El] que un [character|El] puede elegir como paradas en una [profit_route|El]. Puede aumentar si se mejoran los [company_buildings|El]."
 game_concept_trade_route_capacity: "Capacidad de ruta comercial"
 game_concept_trade_route_capacity_short: "Capacidad comercial"
 game_concept_trade_route_capacity_i: "@trade_capacity!"
 game_concept_capacity: "Capacidad"
 game_concept_trade_route_capacity_desc: "La $game_concept_trade_route_capacity$ establece la cantidad de [trade_goods|El] con las que se puede comerciar en una [profit_route|El] en un momento dado. Puede aumentar si se mejoran los [company_buildings|El]."
 game_concept_primary_good: "Artículo principal"
 game_concept_primary_goods: "Artículos principales"
 game_concept_primary_good_desc: "Los [merchants|El] y [patricians|El] tienen una [trade_good|El] que es el $game_concept_primary_good$ de sus [trade_routes|El].\n\nComerciar con este proporciona [trade_expertise|El] en la [trade_category|El] de ese artículo."
 game_concept_road: "Carretera"
 game_concept_roads: "Carreteras"
 game_concept_road_possessive: "de la carretera"
 game_concept_roads_possessive: "de las carreteras"
 game_concept_road_desc: "Una [road|El] conecta dos [markets|El] y permite que las [trade_routes|El] discurran entre ellos.\n\nLas $game_concept_trade_routes$ se benefician de recorrer una $game_concept_road$, sobre todo porque aumenta su [trade_route_length|El].\n\nUna $game_concept_road$ también beneficia directamente a la [barony|El] que atraviesa, como por ejemplo, aumentando la rapidez de movimiento de los [armies|El].\n\nLos beneficios de una carretera aumentan con su [Concept( 'road_tier', 'grado')|E]."
 game_concept_road_tier: "Grado de carretera"
 game_concept_road_tiers: "Grados de carretera"
 game_concept_road_tier_short: "Grado"
 game_concept_road_tier_desc: "$game_concept_road_tier$ indica el nivel de desarrollo de una [road|El], abarca desde una pista basta y sin desarrollar a una vía bien construida.\n\nUna carretera avanza de grado cuanto más [trade|El] pase por ella, y cada grado requiere más tiempo y tarda más en completarse que el anterior. Los grados superiores refuerzan los efectos de la carretera: mayor [trade_route_length|El] para las [trade_routes|El] que la usen y bonificaciones más potentes para las [baronies|El] que atraviese.\n\nLas carreteras comienzan con un grado fijo en el mapa y solo aquellas por encima del grado mínimo aparecen al principio de la partida."
 game_concept_building_need: "Necesidad del edificio"
 game_concept_building_needs: "Necesidades de los edificios"
 game_concept_need: "Necesidad"
 game_concept_needs: "Necesidades"
 game_concept_building_need_desc: "Un [building|El] puede tener $game_concept_needs$ de [trade_goods|El], las cuales proporcionan bonificaciones si se cubren.\n\nLas necesidades pueden ser de un [good|El] específico #weak (como [GetTradeGoodType('trade_good_wine').GetName|l])#! o de cualquier $game_concept_good$ de una cierta [trade_category_short|El] #weak (como [GetTradeGoodCategory('trade_category_alcohol').GetName|l])#!.\n\nTodas las necesidades se satisfacen con las $game_concept_trade_goods$ del [market|El] local. Si no hay un [surplus|El] del $game_concept_good$ en el $game_concept_market$ local, los $game_concept_goods$ se repartirán según la [market_priority|El].\n\nLas $game_concept_needs$ son siempre opcionales; no hay ningún inconveniente en no cubrirlas."
 game_concept_market_balance: "Balance de mercado"
 game_concept_market_balances: "Balances de mercado"
 game_concept_market_balance_short: "Balance"
 game_concept_market_balances_short: "Balances"
 game_concept_market_balance_desc: "Todo [market|El] tiene un balance para cada [trade_good|El] o categoría de [goods|El].\n\nSi el balance es positivo, hay [surplus|El].\n\nSi es negativo, habrá [buildings|El] en el mercado con [needs|El] no satisfechas."
 game_concept_trade_surplus: "Excedente de mercado"
 game_concept_trade_surpluses: "Excedentes de mercado"
 game_concept_surplus: "Excedente"
 game_concept_surpluses: "Excedentes"
 game_concept_trade_surplus_desc: "Una [trade_good|El] tiene $game_concept_surplus$ en un [market|El] si hay más [production|El] que [need|El].\n\nEsto implica que todos los [buildings|El] del $game_concept_market$ tienen satisfechas sus $game_concept_needs$t.\n\nEste exceso se puede exportar a través de [trade_routes|El] a otros $game_concept_markets$."
 game_concept_trade_deficit: "Déficit de mercado"
 game_concept_trade_deficits: "Déficits de mercado"
 game_concept_deficit: "Déficit"
 game_concept_deficits: "Déficits"
 game_concept_trade_deficit_desc: "Una [trade_good|El] tiene $game_concept_deficit$ en un [market|El] si hay más [needs|El] que [production|El] o importación.\n\nEsto significa que algunos [buildings|El] del $game_concept_market$ no verán satisfechas sus $game_concept_needs$.\n\nLa importación a través de [trade_routes|El] puede ayudar a cubrir el $game_concept_deficit$."
 game_concept_production: "Producción"
 game_concept_productions: "Producciones"
 game_concept_trade_goods_production: "Producción de mercaderías"
 game_concept_produced: "Producido"
 game_concept_production_desc: "La $game_concept_production$ es la cantidad de [trade_good|El] que se crea cada mes en los [districts|El] y sus [buildings|El].\n\nCuando la $game_concept_production$ en un [market|El] supera las [needs|El] de un artículo de un mercado, el exceso se convierte en [surplus|El] disponible para el [trade|El]. Cuando la $game_concept_production$ se queda corta, las necesidades quedan insatisfechas."
 game_concept_potential_production: "Producción potencial"
 game_concept_potential_productions: "Producción potencial"
 game_concept_potential_production_desc: "La producción potencial de cada [county|El] determina qué [trade_goods|El] se pueden producir en el [resource_district|El] de la [county_capital|El]."
 game_concept_sell_price: "Precio de venta"
 game_concept_sell_price_i: "@gold_icon!"
 game_concept_sell_prices: "Precios de venta"
 game_concept_sell_price_desc: "El $game_concept_sell_price$ de un [market|El] es el valor en [gold|El] de una [trade_good|El] de la que hay [need|El].\n\nLos dueños de las [profit_routes|El] ganan el precio de venta de una $game_concept_trade_good$ en un $game_concept_market$ cuando su [route|El] vende $game_concept_goods$ allí para satisfacer las $game_concept_needs$ $game_concept_market_possessive$.\n\nLos [rulers|El] [Concept('landed', 'con tierras' )|E] también se benefician de un precio de venta elevado, ya que más [merchants|El] se verán atraídos al mercado, lo que aumentará los ingresos de los [tolls|El], o la probabilidad de que se satisfaga la $game_concept_need$.\n\nSe pagan $game_concept_tolls$ por cada $game_concept_good$ vendido, lo que reduce el $game_concept_sell_price$ real.\n\nDel mismo modo, su contrapartida, el [buy_price|El], aumenta con la [Concept('market_prosperity', 'prosperidad del mercado' )|E]."
 game_concept_buy_price: "Precio de compra"
 game_concept_buy_price_i: "@gold_icon!"
 game_concept_buy_prices: "Precios de compra"
 game_concept_buy_price_desc: "El $game_concept_buy_price$ de un [market|El] es el coste en [gold|El] de una [trade_good|El] con [surplus|El].\n\nLos dueños de las [profit_routes|El] pagan el precio de venta de una $game_concept_trade_good$ en un $game_concept_market$ cuando su [route|El] compra $game_concept_goods$ allí con $game_concept_surplus$.\n\nDel mismo modo, su contrapartida, el [sell_price|El], aumenta con la [Concept('market_prosperity', 'prosperidad del mercado' )|E]."
 game_concept_trade_monopoly: "Monopolio comercial"
 game_concept_monopoly_i: "@trade_monopoly!"
 game_concept_trade_monopolies: "Monopolios comerciales"
 game_concept_monopoly: "Monopolio"
 game_concept_monopolies: "Monopolios"
 game_concept_trade_monopoly_desc: "Un $game_concept_monopoly$ permite que solo su dueño compre y venda [goods|El] en un [market|El].\n\nUn monopolio se puede aplicar de distintos modos:\n #indent_newline:4    $EFFECT_LIST_BULLET$Un monopolio normal se aplica a una sola [trade_category|El], mientras que un [complete_monopoly|El] se aplica a todas.\n$EFFECT_LIST_BULLET$Un [exploitative_monopoly|El] permite a su dueño comprar la [production|El] de $game_concept_goods$ antes incluso de que se satisfagan las [needs|El].\n$EFFECT_LIST_BULLET$Un $game_concept_monopoly$ puede pertenecer a un [merchant|El], una [republic|El] o una [trade_league|El] entera.#!\n\nSe pueden adquirir $game_concept_monopolies$ con la interacción $request_trade_monopoly_for_character_interaction|V$."
 game_concept_complete_monopoly: "Monopolio completo"
 game_concept_complete_monopoly_i: "@trade_monopoly!"
 game_concept_complete_monopolies: "Monopolios completos"
 game_concept_complete_monopoly_short: "Completo"
 game_concept_complete_monopoly_desc: "$game_concept_complete_monopoly$ es el que abarca toda [trade_good|El] de un [market|El] a la vez. A diferencia de un [monopoly|El] básico, no se limita a una [trade_category|El]."
 game_concept_exploitative_monopoly: "Monopolio explotador"
 game_concept_exploitative_monopoly_i: "@trade_monopoly_exploitative!"
 game_concept_exploitative_monopolies: "Monopolios explotadores"
 game_concept_exploitative_monopoly_short: "Explotador"
 game_concept_exploitative_monopoly_desc: "El $game_concept_exploitative_monopoly$ es un tipo de [monopoly|El] que permite a su dueño comprar directamente la [production|El] del [market|El].\n\nNormalmente solo se puede comprar el [surplus|El], pero a diferencia de los otros monopolios, el dueño de un monopolio explotador puede comprar la $game_concept_production$ de los [buildings|El] del $game_concept_market$ antes de que se cubran las [building_needs|El] locales."
 game_concept_trade_competitiveness: "Competitividad comercial"
 game_concept_trade_competitiveness_i: "@competitiveness_icon!"
 game_concept_competitiveness: "Competitividad"
 game_concept_competitiveness_i: "@competitiveness_icon!"
 game_concept_trade_competitiveness_desc: "Toda [profit_route|El] tiene su $game_concept_competitiveness$: la cantidad de [trade_goods|El] con las se puede comerciar en un [market|El] cuando se compite con otras $game_concept_profit_routes$.\n\nCuanta más competitividad total poseas de una $game_concept_trade_good$, mayor será tu [market_share|El].\n\nSi hay un [monopoly|El] en el $game_concept_market$, solo los propietarios de ese $game_concept_monopoly$ compararán su $game_concept_competitiveness$."
 game_concept_competitive_pressure: "Presión competitiva"
 game_concept_competitive_pressure_i: "@competitive_pressure_icon!"
 game_concept_competitive_pressure_desc: "La $game_concept_competitive_pressure$ representa una baza comercial temporal que gana un [merchant|El]. Se puede gastar en [decisions|El] e [interactions|El] únicas que den ventajas especiales a [trade_routes|El] específicas."
 game_concept_put_on_notice: "Poner sobre aviso"
 game_concept_put_on_notice_desc: "$game_concept_put_on_notice$ es una [character_interaction|El] desbloqueada por el [perk|El] [GetPerk('prepared_conscription_perk').GetName(GetPlayer)]. Gasta [competitive_pressure|El] [competitive_pressure_i] para empezar una [trade_opportunity|El] rivalizada contra un [merchant|El] en uno de los [trade_markets|El] de tu [trade_route|El]."
 game_concept_ruthless_oversight: "Supervisión implacable"
 game_concept_ruthless_oversight_desc: "$game_concept_ruthless_oversight$ es una [character_interaction|El] desbloqueada por el [perk|El] [GetPerk('fear_tax_perk').GetName(GetPlayer)]. Puede aumentar la [aptitude|El] de un [court_position|El] de un personaje a costa de [dread|El], [opinion|El] y [company_sentiment|El]."
 game_concept_request_merchant_charter: "Solicitar privilegio mercante"
 game_concept_request_merchant_charter_desc: "$game_concept_request_merchant_charter$ es una [character_interaction|El] que permite a un [merchant|El] pedir a su [merchant_patron|El] un [charter|El], que le proporcione derechos especiales en su [market|El] local."
 game_concept_monopolize_trade: "Monopolizar comercio"
 game_concept_monopolize_trade_i: "@trade_monopoly!"
 game_concept_monopolize_trade_desc: "$game_concept_monopolize_trade$ es una [character_interaction|El] que permite a un [merchant|El] pagar [gold|El] a un [market_owner|El] a cambio de un [trade_monopoly|El]."
 game_concept_trader: "Comerciante"
 game_concept_traders: "Comerciantes"
 game_concept_trader_possessive: "del comerciante"
 game_concept_traders_possessive: "de los comerciantes"
 game_concept_trader_desc: "$game_concept_trader$ es el [character|El] asignado a supervisar una [trade_route|El].\n\nPuede ser [associate|El] o [courtier|El] del dueño de la ruta y solo puede supervisar una ruta a la vez. [SelectLocalization( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_merchant' ), 'game_concept_trader_council_merchant', 'game_concept_trader_council' )]\n\nA cada comerciante se le asigna una tarea que mejora cierto aspecto de la ruta. Su [aptitude|El] para esa tarea depende de sus [skills|El].\n\nA la vez que trabaja en una ruta, el comerciante lleva a cabo [schemes|El] personales en cada [trade_market|El]. Si una conjura fracasa, gana el [trait|El] [GetTrait('lifestyle_merchant').GetName( GetNullCharacter )], si es que no lo tiene ya. Si es así, en su lugar gana una pequeña cantidad de [trait_level_track_xp|El] de una [trait_level_track|El] tipo [GetTrait('lifestyle_merchant').GetNameNoTooltip( GetNullCharacter )|l] aleatoria ($trait_track_caravaneer$, $trait_track_artisan$ o $trait_track_creditor$)."
 game_concept_trader_council: "Salvo el [spouse|El] del dueño, no se puede sentar también en el [council|El]."
 game_concept_trader_council_merchant: "El [spouse|El] y [deputies|El] del dueño también pueden ser $game_concept_traders$, salvo el [GetCourtPositionType('partner_court_position').GetName()|l] y el [GetCourtPositionType('travel_leader_court_position').GetName()|l]."
 #Merchant
 game_concept_merchant: "Mercader"
 game_concept_merchants: "Mercaderes"
 game_concept_merchant_possessive: "del mercader"
 game_concept_merchants_possessive: "de los mercaderes"
 game_concept_merchant_i: "@government_type_merchant!"
 game_concept_merchant_desc: "$game_concept_merchant$ es el [character|El] [Concept('unlanded', 'sin tierras' )|E] que se involucra en el [trade|El] como parte de una [company|El].\n\nEstos individuos buscan satisfacer las [building_needs|El] de los [trade_markets|El], reforzando la economía en pos de la riqueza personal y mejorando su posición social. De estas metas, el [prestige|El] vale más que el [gold|El], puesto que les permite elevar su posición con su [merchant_patron|El] y [associates|El], lo que les da poder para expandir sus [trade_routes|El] y llegar a conseguir un [trade_monopoly|El]."
 game_concept_merchant_family: "Familia de mercaderes"
 game_concept_merchant_families: "Familias de mercaderes"
 game_concept_merchant_family_possessive: "de la familia de mercaderes"
 game_concept_merchant_family_desc: "$game_concept_merchant_families$ son aquellas [houses|El] que se involucran en el comercio como [merchants|El] o [republicans|El]. Poseen una [company|El], que controla y posee el [house_head|El] y son una parte vital del [trade|El] y [prosperity|El] del señorío."
 game_concept_associate: "Asociado"
 game_concept_associates: "Asociados"
 game_concept_associate_possessive: "del asociado"
 game_concept_associates_possessive: "de los asociados"
 game_concept_associate_desc: "$game_concept_associates$ son personajes [Concept('unlanded', 'sin tierras' )|E] que pertenecen a una [company|El] [Concept('merchant', 'de mercaderes')|E]. Tienen funciones similares a las de los [courtiers|El] de un gobernante con títulos y pueden gestionar las [trade_routes|El] como [traders|El] y llegar a ser [deputies|El]."
 game_concept_associate_i: "@courtier_icon!"
 game_concept_deputy: "Delegado"
 game_concept_deputies: "Delegados"
 game_concept_deputy_possessive: "del delegado"
 game_concept_deputies_possessive: "de los delegados"
 game_concept_deputy_desc: "Los $game_concept_deputies$ sirven a las [merchant_families|El] y a sus [companies|El] en distintas funciones. Sus papeles se asemejan a los [court_positions|El], se entregan a [associates|El] de la [company|El] y su [aptitude|El] determina el éxito que tendrán con sus tareas."
 game_concept_company: "Compañía"
 game_concept_companies: "Compañías"
 game_concept_company_possessive: "de la compañía"
 game_concept_trade_company: "Compañía comercial"
 game_concept_trade_companies: "Compañías comerciales"
 game_concept_company_desc: "Las $game_concept_trade_companies$ son la base de operaciones de una [merchant_family|El] desde la cual comienzan todas sus [trade_routes|El] asociadas.\n\nTodo [GetGovernment( 'merchant_government' ).GetName|l] tiene un [domicile|El] de $game_concept_trade_company$. Si hay un [merchant_patron|El], el $game_concept_domicile$ $game_concept_merchant_possessive$ suele ubicarse en la [holding|El] de su [merchant_patron|El].\n\nLos [company_buildings|El] son los [domicile_buildings|El] de la compañía, que proporcionan bonificaciones al comercio y a todos los asociados a este. La $game_concept_company$ también ofrece residencia a sus [associates|El], junto con familiares y [knights|El], a los que se puede contratar como [deputies|El].\n\n#WEAK Al igual que las [courts|El], las $game_concept_companies$ incluyen [characters|El] sin nombre ni importancia como para tener retrato (si bien son los menos).#!"
 game_concept_company_building: "Edificio de compañía"
 game_concept_company_buildings: "Edificios de compañía"
 game_concept_company_buildings_short: "Edificios"
 game_concept_company_building_desc: "Los $game_concept_company_buildings$ son los [domicile_buildings|El] de una [company|El]. Principalmente mejoran el [trade|El], incluyendo la [capacity|El], la [route_length|El], el [max_trade_goods_short|El] y los [max_trade_markets_short|El] en [trade_routes|El]."
 game_concept_usury: "Usura"
 game_concept_usurer: "Usurero"
 game_concept_usurers: "Usureros"
 game_concept_usurer_possessive: "del usurero"
 game_concept_usurers_possessive: "de los usureros"
 game_concept_usurious: "Usurario"
 game_concept_interest: "Interés"
 game_concept_usury_desc: "$game_concept_usury$ es [lending|El] [gold|El] con $game_concept_interest$. Que sea un negocio honrado o un [sin|El] lo decide la [doctrine|El] [GetDoctrine('doctrine_usury_accepted').GetGroup.GetBaseNameNoTooltip] de un [rite|El].\n\nAllí donde se condena, un [merchant|El] pierde [piety|El] con cada [loan|El] hecho mediante la [interaction|El] $loan_money_interaction|V$, y una [company|El] que tenga el propósito $company_purpose_creditor|V$ consigue una reputación duradera como $game_concept_usurer$ para su propietario una vez que el $game_concept_interest$ se hace público.\n\n#weak Algunos $game_concept_rites$ solo restringen los préstamos con $game_concept_interest$ al conjunto de su [religion|El], lo que da libertad a sus $game_concept_merchants$ para ofrecer préstamos a los demás.#!"
 game_concept_loan: "Préstamo"
 game_concept_loans: "Préstamos"
 game_concept_loan_possessive: "del préstamo"
 game_concept_loans_possessive: "de los préstamos"
 game_concept_loaned: "Prestado"
 game_concept_lending: "Prestar"
 game_concept_loan_desc: "$game_concept_loan$ es una suma de [gold|El] [gold_i|E] entregada con la esperanza de que sea devuelta, con o sin $game_concept_interest$.\n\nLos $game_concept_loans$ generalmente los pide un [ruler|El] que se encuentra [Concept('debt', 'endeudado' )|E] o que necesita fondos extra para una [war|El] u otros gastos.\n\nLos $game_concept_loans$ se pueden conceder con $game_concept_interest$ declarado abiertamente, con un $game_concept_interest$ oculto o sin $game_concept_interest$, y las distintas [faiths|El] tienen opiniones distintas sobre la [usury|El].\n\n$loan_inheritance_hint$\n\n$loan_repayment_help$"
 loan_inheritance_hint: "#help Un $game_concept_loan$ puede sobrevivir a la gente que lo negoció: cuando alguna de las partes muere, pasa a su [heir|El], si es que lo tiene#!"
 loan_repayment_help: "#help Un [debtor|El] puede devolver los $game_concept_loans$ mediante [decision|El] [GetDecisionWithKey('repay_loan_decision').GetName], y un [creditor|El] puede exigirlo a través de la [interaction|El] #V $demand_repayment_interaction$#! cuando hayan pasado al menos #V 2#! años\n\nLos [merchants|El] con el [company_purpose|El] [GetLaw('company_purpose_creditor').GetName] también pueden recuperar [loans|El] con el tiempo si emplean un puesto de [GetCourtPositionType( 'bailiff_court_position' ).GetName()|l] y usan la [court_position_task|El] #V $bailiff_collect_loans$#!#!"
 game_concept_merchant_patron: "Patrón"
 game_concept_merchant_patrons: "Patrones"
 game_concept_merchant_patron_possessive: "del patrón"
 game_concept_merchant_patron_desc: "$game_concept_merchant_patron$ es el [ruler|El] de la [holding|El] donde se sitúa el [domicile|El] de un [merchant|El].\n\nAl $game_concept_merchant$ se le considera [client|El] del $game_concept_merchant_patron$ y deberá pagarle [taxes|El]."
 game_concept_merchant_tributary_patron: "$game_concept_merchant_patron$"
 game_concept_merchant_tributary_patron_plural: "$game_concept_merchant_patrons$"
 game_concept_client_merchant: "Mercader cliente"
 game_concept_client_merchants: "Mercaderes clientes"
 game_concept_client_merchant_possessive: "del mercader cliente"
 game_concept_client: "Cliente"
 game_concept_client_possessive: "del cliente"
 game_concept_clients: "Clientes"
 game_concept_client_merchant_desc: "Un $game_concept_client_merchant$ es un [character|El] [merchant|El]. Posee una [company|El] en el [realm|El] de un [ruler|El] [Concept('landed', 'con tierras')|E], que se convierte en su [merchant_patron|El].\n\nEl $game_concept_client_merchant$ proporciona a su patrón una parte de los ingresos del [trade|El]. No se puede unir a una guerra o [faction|El] contra su patrón ni puede liberarse a menos que traslade su compañía a otro lugar."
 game_concept_merchant_tributary_client: "$game_concept_client$"
 game_concept_merchant_tributary_client_plural: "$game_concept_clients$"
 game_concept_seize_realm_cb: "Arrebatar el señorío"
 game_concept_seize_realm_cb_desc: "Un [casus_belli|El] que permite a un [merchant|El] fundar una [republic|El] y conseguir un título con tierras. El atacante puede usar la [interaction|El] #V $gdp_merchant_seize_realm_call_debtor_interaction$#! para gastar [strong_hooks|El] @unspent_strong_hook_icon! #weak ($strong_indebted_hook$ o $strong_loan_hook$)#! y obligar a [rulers|El] [Concept('independent', 'independientes')|E] a unirse a esta [war|El] como [allies|El]."
 game_concept_company_purpose: "Propósito de compañía"
 game_concept_company_purposes: "Propósitos de compañía"
 game_concept_company_purpose_desc: "Los $game_concept_company_purposes$ son las directivas que determinan una [company|El] y su [merchant_family|El].\n\nUna compañía puede centrarse en los préstamos, la fiabilidad familiar, la calidad y rareza de sus mercaderías o el alcance de su red para salvar distancias y unir culturas.\n\nLos distintos propósitos proporcionan [interactions|El] únicas, puestos de [deputy|El] y bonificaciones de [trade|El]."
 game_concept_trade_acumen: "Perspicacia comercial"
 game_concept_trade_acumen_i: "@trade_acumen!"
 game_concept_acumen: "Perspicacia"
 game_concept_trade_acumen_desc: "La $game_concept_acumen$ representa la cantidad total de [gold|El] que una [company|El] de [Concept('merchant', 'mercaderes')|E] ha acumulado mediante el [trade|El] en todas las [trade_categories|El].\n\nLa perspicacia se emplea para desbloquear diferentes [company_sizes|El] y no se puede gastar."
 game_concept_company_size: "Tamaño de compañía"
 game_concept_company_sizes: "Tamaños de compañía"
 game_concept_company_size_desc: "El $game_concept_company_size$ representa la dominación de una [merchant_family|El] sobre el [trade|El]; cada nivel aumenta enormemente su [competitiveness|El] y capacidades comerciales. Ascender a un tamaño superior requiere acumular [acumen|El].\n\nExisten cuatro tamaños: [GetLaw('company_size_small').GetName|l], [GetLaw('company_size_medium').GetName|l], [GetLaw('company_size_large').GetName|l] e [GetLaw('company_size_huge').GetName|l]."
 #Contracts
 game_concept_trade_contract: "Contrato comercial"
 game_concept_trade_contract_i: "@government_type_merchant!"
 game_concept_trade_contracts: "Contratos comerciales"
 game_concept_trade_contract_possessive: "del contrato comercial"
 game_concept_trade_contracts_possessive: "de los contratos comerciales"
 game_concept_trade_contract_desc: "Los $game_concept_trade_contracts$ son las vías por las que las [companies|El] [Concept('merchant', 'de mercaderes' )|E] influyen en sus [trade_routes|El] o buscan riquezas valiosas en tierras lejanas.\n\nLas primeras se conocen como [trade_opportunities|El] y las otras como [luxury_contracts|El]."
 game_concept_trade_contract_tier: "Nivel de contrato comercial"
 game_concept_trade_contract_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_contract_tier_tier: "Nivel"
 game_concept_trade_contract_tier_desc: "Cada [trade_contract|El] tiene un $game_concept_trade_contract_tier_tier$ que determina tanto la dificultad como la recompensa del $game_concept_trade_contract$. Se suele basar en la [prosperity|El] de su ubicación."
 game_concept_luxury_contract: "Contrato de lujo"
 game_concept_luxury_contract_i: "@luxury_contract!"
 game_concept_luxury_contracts: "Contratos de lujo"
 game_concept_luxury_contract_possessive: "del contrato de lujo"
 game_concept_luxury_contracts_possessive: "de los contratos de lujo"
 game_concept_luxury_contract_desc: "Un $game_concept_luxury_contracts$ requiere que [companies|El] [Concept('merchant', 'mercantiles')|E] [Concept('travel', 'viajen')|E] a una ubicación lejana para intentar conseguir un [domicile_artifact|El].\n\nEstos contratos pueden generarse anualmente para los mercaderes con el [company_purpose|El] «Caravanero» y se pueden adquirir mediante la [decision|El] [GetDecisionWithKey('gdp_visit_holding_decision').GetName]"
 game_concept_trade_opportunity: "Oportunidad comercial"
 game_concept_trade_opportunity_i: "@trade_opportunity_icon!"
 game_concept_trade_opportunities: "Oportunidades comerciales"
 game_concept_trade_opportunity_possessive: "de la oportunidad comercial"
 game_concept_trade_opportunities_possessive: "de las oportunidades comerciales"
 game_concept_opportunity: "Oportunidad"
 game_concept_opportunities: "Oportunidades"
 game_concept_opportunity_possessive: "de la oportunidad"
 game_concept_opportunities_possessive: "de las oportunidades"
 game_concept_trade_opportunity_desc: "Las $game_concept_trade_opportunities$ requieren que las [companies|El] [Concept('merchant', 'de mercaderes' )|E] cumplan con éxito una [scheme|El].\n\nNormalmente suelen ser estrictamente negocios (como promocionar [trade_goods|El] rentables), pero también pueden ser más antagónicos (como competir con una familia rival por el control de un [market|El]).\n\nSi la $game_concept_scheme$ fracasa o se abandona por cualquier motivo, también fracasa la $game_concept_trade_opportunity$."
 game_concept_trade_opportunity_tier: "Nivel de oportunidad comercial"
 game_concept_trade_opportunity_tier_i: "@task_contract_tier_icon!"
 game_concept_trade_opportunity_tier_tier: "Nivel"
 game_concept_trade_opportunity_tier_desc: "El $game_concept_trade_opportunity_tier$ refleja la [prosperity|El] de la ubicación donde se sitúa el contrato.\n\nCuanto mayor sea el $game_concept_trade_opportunity_tier$, mayor será la paga, si bien la dificultad de la tarea también será mayor."
 game_concept_trade_opportunity_scheme: "Conjura de oportunidad comercial"
 game_concept_trade_opportunity_schemes: "Conjuras de oportunidad comercial"
 game_concept_trade_opportunity_scheme_possessive: "de la conjura de oportunidad comercial"
 game_concept_trade_opportunity_schemes_possessive: "de las conjuras de oportunidad comercial"
 game_concept_trade_opportunity_scheme_trade_opportunity: "Oportunidad comercial"
 game_concept_trade_opportunity_scheme_opportunity: "Oportunidad"
 game_concept_opportunity_scheme: "Conjura de oportunidad"
 game_concept_opportunity_schemes: "Conjuras de oportunidad"
 game_concept_opportunity_scheme_possessive: "de la conjura de oportunidad"
 game_concept_opportunity_schemes_possessive: "de las conjuras de oportunidad"
 game_concept_trade_opportunity_scheme_desc: "$game_concept_trade_opportunity_desc$"
 game_concept_patron_contract: "Contrato de patrón"
 game_concept_patron_contract_i: "@task_contract_icon!"
 game_concept_patron_contracts: "Contratos de patrón"
 game_concept_patron_contract_possessive: "del contrato de patrón"
 game_concept_patron_contracts_possessive: "de los contratos de patrón"
 game_concept_patron_contract_desc: "Los $game_concept_patron_contracts$ requieren que las [companies|El] [Concept('merchant', 'de mercaderes' )|E] cumplan con éxito una [scheme|El] contra su [merchant_patron|El].\n\nNormalmente tienden hacia la [diplomacy|El] para ayudar a los deseos del patrón (como solucionar una disputa comercial) o para que se dobleguen a la voluntad del mercader (como expulsar a una familia mercader rival).\n\nSi la $game_concept_scheme$ fracasa o se abandona por cualquier motivo, también fracasa el $game_concept_patron_contract$."
 game_concept_patron_contract_scheme: "Conjura de contrato de patrón"
 game_concept_patron_contract_schemes: "Conjuras de contrato de patrón"
 game_concept_patron_contract_scheme_possessive: "de la conjura de contrato de patrón"
 game_concept_patron_contract_schemes_possessive: "de las conjuras de contrato de patrón"
 game_concept_patron_contract_scheme_patron_contract: "Contrato de patrón"
 game_concept_patron_scheme: "Conjura de patrón"
 game_concept_patron_schemes: "Conjuras de patrón"
 game_concept_patron_scheme_possessive: "de la conjura de patrón"
 game_concept_patron_schemes_possessive: "de las conjuras de patrón"
 game_concept_patron_contract_scheme_desc: "$game_concept_patron_contract_desc$"
 game_concept_unity_contract: "Contrato de dirección"
 game_concept_unity_contract_i: "@unity_contract!"
 game_concept_unity_contracts: "Contratos de dirección"
 game_concept_unity_contract_possessive: "del contrato de dirección"
 game_concept_unity_contracts_possessive: "de los contratos de dirección"
 game_concept_unity_contract_desc: "Los $game_concept_unity_contracts$ surgen cuando la [company_sentiment|El] de un [merchant|El] es baja, lo que presenta un problema que hay que afrontar."
 game_concept_domicile_artifact: "Artefacto de domicilio"
 game_concept_domicile_artifacts: "Artefactos de domicilio"
 game_concept_domicile_artifact_desc: "$game_concept_domicile_artifact$ es [Concept( 'artifact', 'aquel' )|E] que se guarda en la [company|El] de un [Concept('merchant_possessive', 'mercader')|E], como una [curios|El] y [creatures|El].\n\nLos $game_concept_domicile_artifacts$ son la fuente primaria de ingresos pasivos de [prestige|El] de un mercader.\n\nUn [character|El] puede tener todos los $game_concept_artifacts$ que desee, pero para que hagan efecto tendrán que estar dispuestos en una casilla de su tipo.\n\nLos $game_concept_merchants$ pueden adquirir $game_concept_domicile_artifacts$ al completar con éxito [luxury_contracts|El]."
 game_concept_menagerie: "Casa de fieras"
 game_concept_menagerie_creature: "Criatura de casa de fieras"
 game_concept_menagerie_creatures: "Criaturas de casa de fieras"
 game_concept_creature: "Criatura"
 game_concept_creatures: "Criaturas"
 game_concept_creature_desc: "Una $game_concept_creature$ es un animal vivo obtenido a través de los [merchants|El] al completar [luxury_contracts|El]. \n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_curio: "Curiosidad"
 game_concept_curios: "Curiosidades"
 game_concept_curio_desc: "Una $game_concept_curio$ es un tipo de [artifact|El] poco común obtenido a través de [merchants|El] al completar [luxury_contracts|El].\n\n$game_concept_gain_domicile_artifact_desc$"
 game_concept_gain_domicile_artifact_desc: "Se puede mostrar como [domicile_artifact|El] en una [company|El] para conseguir una entrada constante de [prestige|El]."
 game_concept_guelph_ghibelline_precursor_situation: "Preludio de $game_concept_guelph_ghibelline_situation$"
 game_concept_guelph_ghibelline_precursor_situation_desc: "Un preludio de la [situation|El] [guelph_ghibelline_situation|E]; es una serie de eventos que profundizan el conflicto entre el Sacro Imperio Romano y el papado.\n\n#F Todo comenzó con el renacer papal de [Glossary( 'In nomine Domini', 'IN_NOMINE_DOMINI_GLOSS' )], donde el papa de aquel entonces proclamó que la nobleza no debía participar en las elecciones papales, solo los cardenales reunidos en Roma.\n\nDespués, durante el [Glossary( 'Dictatus Papae', 'DICTATUS_PAPAE_GLOSS' )] y la controversia de las investiduras, el papa afirmó que el poder que Dios confiere a los papas es universal y el único que puede nombrar o deponer a los eclesiásticos. Aquellos obispos a los que se investía portando símbolos laicos de su cargo eran mal vistos."
 game_concept_guelph_ghibelline_situation: "Güelfos y gibelinos"
 game_concept_guelph_ghibelline_situation_desc: "Una situación que surgió como un conflicto entre el papa ([guelphs|El]) y el Sacro Imperio Romano ([ghibellines|El]).\n\nCon el paso del tiempo evolucionó a un asunto local sobre si los gobernantes del norte de Italia querían una mayor implicación del imperio o conservar intacta su independencia."
 game_concept_gg_involvement: "Implicación"
 game_concept_gg_involvement_desc: "La $game_concept_gg_involvement$ de un [ruler|El] en la [situation|El] de [guelph_ghibelline_situation|El] indica cuánto ha afectado el personaje al estado de la situación. Esto se consigue principalmente al actuar contra el bando opuesto.\n\nTales acciones incluyen:\n$BULLET_WITH_TAB$[hostile_schemes|E]\n$BULLET_WITH_TAB$[interactions|E] de [Concept('imprison', 'encarcelamiento')|E], [torture|El] y [execution|El]\n$BULLET_WITH_TAB$La [scheme|El] [GetScheme('gg_switch_sides').GetTypeName], la [interaction|El] $gg_recruit_partisan_interaction|V$, el [casus_belli|El] [GetCasusBelliType('displace_guelph_ghibelline_ruler_cb').GetName|V], etc.\n$BULLET_WITH_TAB$Desencadenar [situation_catalysts|El]\n\nA cambio, la $game_concept_gg_involvement$:\n$BULLET_WITH_TAB$Aplica el [modifier|El] [GetModifier( 'gg_involvement_modifier' ).GetNameWithTooltip] a escala por un incremento de #V [FixedPointToInt(EmptyScope.ScriptValue('gg_involvement_modifier_cap'))|O]#!\n$BULLET_WITH_TAB$Funciona como multiplicador de recompensas si tu bando termina la situación.\n\n#F Durante el [guelph_ghibelline_precursor_situation|El], no se puede ganar $game_concept_gg_involvement$ y esta se acumula a un ritmo menor hasta que el conflicto estalle del todo.#!"
 game_concept_gg_involvement_i: "@gg_involvement_icon!"
 game_concept_guelph: "Güelfo"
 game_concept_guelphs: "Güelfos"
 game_concept_guelph_desc: "En la [situation|El] de [guelph_ghibelline_situation|El], los güelfos son el bando que apoya la independencia respecto al Sacro Imperio Romano y, por extensión, la soberanía divina.\n\n#F El nombre de «güelfo» proviene de la casa de Welf, los históricos duques de Baviera, transformado por su paso de boca en boca y las pronunciaciones.#!"
 game_concept_ghibelline: "Gibelino"
 game_concept_ghibellines: "Gibelinos"
 game_concept_ghibelline_desc: "En la [situation|El] de [guelph_ghibelline_situation|El], los gibelinos son el bando que apoya que el Sacro Imperio Romano ejerza una mayor influencia y control sobre las entrometidas ciudades estado del norte de Italia.\n\n#F El nombre de «gibelino» proviene del grito de guerra de los Hohenstaufen, una referencia al castillo de Wibellingen durante el asedio de Weinsberg.#!"
 game_concept_lombard_league: "Liga Lombarda"
 game_concept_lombard_league_desc: "Una liga formada por las ciudades del norte de Italia que se oponían a las exigencias cada vez mayores de centralización imperial del $e_hre$."
 game_concept_confederation_cohesion: "Cohesión de la confederación"
 game_concept_cohesion: "Cohesión"
 game_concept_confederation_cohesion_desc: "La $game_concept_cohesion$ indica la firmeza con la que está unida una [confederation|El], de #V 0#! a #V 100#!. Cada integrante contribuye a ella mensualmente, para bien o para mal, y la ganancia se reduce con una cohesión alta.\n\nCada nivel al que se llegue proporciona beneficios progresivos a sus integrantes. Qué es lo que genera cohesión y cuál es la recompensa de cada nivel depende de qué clase de confederación sea.\n\nLas confederaciones usan estos tipos de $game_concept_cohesion$:\n$BULLET_WITH_TAB$[bloc_cohesion|E]\n$BULLET_WITH_TAB$[league_cohesion|E]"
 game_concept_trade_league: "Liga comercial"
 game_concept_trade_league_desc: "Una $game_concept_trade_league$ es una [confederation|El] de [republics|El] que los [rulers|El] republicanos pueden formar o a la que pueden unirse para conseguir beneficios comerciales y defensivos mutuos.\n\nUn miembro posee el [leading_title|El] y actúa como [trade_league_leader|El] (es el único miembro que puede invitar o expulsar a otros), mientras que los demás poseen un [member_title|El].\n\nSus miembros disfrutan de mayores beneficios según aumenta la [league_cohesion|El]."
 game_concept_trade_leagues: "Ligas comerciales"
 game_concept_trade_league_short: "Liga"
 game_concept_league_cohesion: "Cohesión de la liga"
 game_concept_league_cohesion_desc: "La $game_concept_cohesion$ mide la unidad de una [trade_league|El], y cada nivel al que se llegue proporciona beneficios de [trade|El] progresivos a sus integrantes. Por debajo de #V 20#!, la liga está demasiado desunida como para que los miembros se unan a las [wars|El] de otros o pidan [trade_monopolies|El].\n\nLos miembros generan cohesión a partir de su [title_tier|El], su [capital|El] y su [opinion|El] sobre el [trade_league_leader|El]. Los monopolios poseídos añaden más, mientras que tener muy pocos [trade_league_members_short|El] o demasiados pueden deshacerla."
 game_concept_trade_league_leader: "Líder de liga comercial"
 game_concept_trade_league_leader_desc: "El líder de una liga comercial es la cabeza oficial de una [trade_league|El].\n\nEl líder es el único [trade_league_member_short|El] de una $game_concept_trade_league$ que puede invitar a nuevos miembros o expulsar a miembros existentes. Una liga comienza con su fundador como líder. Más adelante, los miembros pueden reclamar el liderazgo. Si un líder se marcha, otro miembro lo sucede dependiendo de su [title_tier|El], el [settlement_size|El] de la [capital|El] y su [prestige|El]."
 game_concept_trade_league_leader_short: "Líder"
 game_concept_trade_league_member: "Miembro de liga comercial"
 game_concept_trade_league_members: "Miembros de liga comercial"
 game_concept_trade_league_member_short: "Miembro"
 game_concept_trade_league_members_short: "Miembros"
 game_concept_trade_league_member_desc: "El miembro de liga comercial forma parte de una [trade_league|El] al poseer una [member_title|El], que constituido por el [primary_title|El] de las [republics|El] integrantes.\n\nUn miembro posee el [leading_title|El] y actúa como [trade_league_leader|El]."
 game_concept_league_focus: "Enfoque de liga"
 game_concept_league_focuses: "Enfoques de liga"
 game_concept_league_focus_desc: "$game_concept_league_focus$ es una [trade_category|El] elegida por el [trade_league_leader|El] de una [trade_league|El]. El [holder|El] de cada [member_title|El] gana bonificaciones de [trade_expertise|El], [production|El] y [sell_price|El] por dicha categoría."
 game_concept_patrician: "Patricio"
 game_concept_patricians: "Patricios"
 game_concept_patrician_possessive: "del patricio"
 game_concept_patrician_desc: "El patricio es el [house_head|El] de una familia [Concept('merchant', 'de mercaderes' )|E] principal en una [republic|El]."
 game_concept_patrician_family: "Familia patricia"
 game_concept_patrician_families: "Familias patricias"
 game_concept_patrician_family_short: "Familia"
 game_concept_patrician_family_desc: "Una $game_concept_patrician_family$ es una [merchant_family|El] que forma parte de una [republic|El]. Es la élite aristocrática que posee el poder y la influencia en la república y usa la [consortery|lE] como [domicile|El].\n\nUna república de [title_tier|El] [county|El] solo puede tener una familia patricia, mientras que las repúblicas de niveles superiores pueden tener varias y se espera que así sea."
 game_concept_patrician_rating: "Estatus patricio"
 game_concept_patrician_rating_short: "Estatus"
 game_concept_patrician_rating_desc: "Una [patrician_family|El] tiene un $game_concept_patrician_rating$, que representa lo esencial e influyente que es una familia y su [patrician|El] dentro de la [republic|El].\n\nTener un estatus alto proporcionará bonificaciones al [patrician|El] y a su [house|El], repartidas en tres niveles distintos. Cada nivel desbloquea beneficios añadidos, como:\n$BULLET_WITH_TAB$Mejora de la [house_ambition|El]\n$BULLET_WITH_TAB$Aumento de aceptación en las [interactions|El]\n$BULLET_WITH_TAB$Aumento del [governor_salary|El]\n\nHay muchos modos de aumentar el estatus; entre los factores principales se incluyen:\n$BULLET_WITH_TAB$Ingresos [Concept('trade', 'comerciales')|E] [patrician_possessive|E]\n$BULLET_WITH_TAB$Gobernar la [republic|El]\n$BULLET_WITH_TAB$Asegurar asientos en la [assembly|El] y el [council|lE] [liege_possessive|E][AddLocalizationIf( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_church_factors' )]\n\n[SelectLocalization( HasDlcFeature( 'by_god_alone' ), 'game_concept_patrician_rating_penalties_PAM', 'game_concept_patrician_rating_penalties_NO_PAM' )]"
 game_concept_patrician_rating_church_factors: "\n$BULLET_WITH_TAB$Miembros de la [house|El] que posean una [clerical_region|El]\n$BULLET_WITH_TAB$Tener el [modifier|El] [GetModifier('favored_by_pope_modifier').GetNameWithTooltip]"
 game_concept_patrician_rating_penalties_PAM: "El estatus se reduce si el patricio resulta [excommunicated|El], es un [criminal|El] conocido o un [GetModifier('scorned_pope_modifier').GetNameWithTooltip|l]."
 game_concept_patrician_rating_penalties_NO_PAM: "El estatus se reduce si el patricio resulta [excommunicated|El] o es un [criminal|El] conocido."
 game_concept_consortery: "Cotería"
 game_concept_consorteries: "Coterías"
 game_concept_consortery_possessive: "de la cotería"
 game_concept_consortery_desc: "$game_concept_consortery$ es la residencia y [domicile|El] de una [patrician_family|El]. Suele estar situada en la [capital|El] de su [liege|El]. \n\nParecida a las [trade_companies|El] de un [merchant|El], la cotería usa [company_buildings|El] como [domicile_buildings|El] para aumentar la destreza y competitividad comercial de la casa.\n\nSe hereda junto con el título de la [patrician_family|El]."
 game_concept_assembly: "Asamblea"
 game_concept_assembly_possessive: "de la asamblea"
 game_concept_assembly_desc: "La asamblea es el órgano soberano de un [realm|El].\n\nLas responsabilidades de la asamblea se determinan según las [laws|El] y pueden implicar votar y aprobar leyes, [republic_decrees|El] o votar a los candidatos en algunas formas de [succession|El] electiva, como la ley de [GetLaw('republican_elective_succession_law').GetName|l]."
 game_concept_republic_senate: "Senado"
 game_concept_republic_senate_possessive: "del senado"
 game_concept_voting_session: "Sesión de votación"
 game_concept_voting_sessions: "Sesiones de votación"
 game_concept_voting_session_desc: "La $game_concept_voting_session$ es el proceso por el cual una [assembly|El] decide sobre una [law|El] o un [republic_decree|El] presentados.\n\nCuando hay una sesión en curso, sus miembros pueden emitir sus votos a favor o en contra de la propuesta según su aprobación. Si bastantes miembros dan su aprobación antes de que termine la sesión, la propuesta queda aprobada y entra en vigor.\n\nSe puede aumentar la aprobación antes de una sesión a través de una [councillor_task|El] y ciertos [perks|El], y se puede gastar un [hook|El] para obligar a un miembro a votar como tú quieras."
 game_concept_republic_decree: "Decreto de la república"
 game_concept_republic_decrees: "Decretos de la república"
 game_concept_republic_decree_short: "Decreto"
 game_concept_republic_decrees_short: "Decretos"
 game_concept_republic_decree_desc: "$game_concept_republic_decree$ es un tipo de [decision|El] para las [Concept('republic', 'repúblicas')|E] que la [assembly|El] debe aprobar.\n\nSi bien hay distintas clases de $game_concept_republic_decrees_short$, la mayoría suelen afectar a los [patricians|El], a la [realm_capital|El] o a la república en general."
 game_concept_house_ambition: "Ambición de la casa"
 game_concept_house_ambitions: "Ambiciones de la casa"
 game_concept_house_ambition_desc: "Toda [house|El] en una [republic|El] tiene una ambición que señala cómo los miembros de esta quieren afectar a la república."
 game_concept_republic_administration: "Administración de república"
 game_concept_republic_administration_short: "Administración"
 game_concept_republic_administrations: "Administraciones de república"
 game_concept_republic_administration_desc: "Todas las [republics|El] tienen una administración que decide en qué se especializa la república.\n\nSolo el [ruler|El] de la república puede cambiar la administración de esta.\n\nHay distintas administraciones entre las que elegir, cada una con beneficios únicos propios.\n\n#help Las administraciones más comunes son [GetLaw( 'republic_type_communal' ).GetName|l], [GetLaw( 'republic_type_maritime' ).GetName|l] y [GetLaw( 'republic_type_civic' ).GetName|l].#!"
 game_concept_republic_senator: "Senador"
 game_concept_republic_senators: "Senadores"
 game_concept_republic_senator_desc: "$game_concept_republic_senator$ es un miembro de la [assembly|El] nombrado usando el [GetLaw( 'republic_assembly_composition_roman_senate' ).GetName].\n\nLos senadores son nombrados por el [ruler|El] o el censor de la [republic|El].\n\nSolo se puede nombrar un número fijo de $game_concept_republic_senators$ al mismo tiempo, y se decide por la [law|El] de tamaño del senado."
 game_concept_mercenary_limit: "Límite de mercenarios"
 game_concept_mercenary_limit_desc: "El límite de mercenarios indica cuántos [mercenaries|El] puede contratar a la vez un [character|El].\n\nEl límite de mercenarios se decide por:\n$BULLET_WITH_TAB$[skill|E] [martial|El] [martial_i]\n$BULLET_WITH_TAB$[title_tier|E] [title_tier_i]\n$BULLET_WITH_TAB$[government_form|E]\n$BULLET_WITH_TAB$[lifestyles|E]"
 # No tooltip versions
 tributary_default_no_tooltip: "Tributario"
 tributary_default_no_tooltip_plural: "Tributarios"
 merchant_tributary_client_no_tooltip: "Cliente"
 merchant_tributary_client_no_tooltip_plural: "Clientes"
 suzerain_default_no_tooltip: "Soberano"
 suzerain_default_no_tooltip_plural: "Soberanos"
 merchant_tributary_patron_no_tooltip: "Patrón"
 merchant_tributary_patron_no_tooltip_plural: "Patrones"
 # Lowercase versions
 tributary_default_no_tooltip_lowercase: "tributario"
 tributary_default_no_tooltip_lowercase_plural: "tributarios"
 tributary_default_no_tooltip_lowercase_plural_possessive: "de los tributarios"
 merchant_tributary_client_no_tooltip_lowercase: "cliente"
 merchant_tributary_client_no_tooltip_lowercase_plural: "clientes"
 merchant_tributary_client_no_tooltip_lowercase_plural_possessive: "de los clientes"
 suzerain_default_no_tooltip_lowercase: "soberano"
 suzerain_default_no_tooltip_lowercase_plural: "soberanos"
 suzerain_default_no_tooltip_lowercase_plural_possessive: "de los soberanos"
 merchant_tributary_patron_no_tooltip_lowercase: "patrón"
 merchant_tributary_patron_no_tooltip_lowercase_plural: "patrones"
 merchant_tributary_patron_no_tooltip_lowercase_plural_possessive: "de los patrones"
 # Game Concept Versions
 merchant_tributary_patron: "[merchant_patron|E]"
 merchant_tributary_patron_plural: "[merchant_patrons|E]"
 merchant_tributary_client: "[client|E]"
 merchant_tributary_client_plural: "[clients|E]"
 tributary_default: "[tributary|E]"
 tributary_default_plural: "[tributaries|E]"
 suzerain_default: "[suzerain|E]"
 suzerain_default_plural: "[suzerains|E]"
 game_concept_merchant_charter: "Privilegio mercante"
 game_concept_merchant_charters: "Privilegios mercantes"
 game_concept_charter: "Privilegio"
 game_concept_charters: "Privilegios"
 game_concept_charter_i: "@charter_icon!"
 game_concept_merchant_charter_desc: "Un $game_concept_charter$ es un [artifact|El] de tipo documento que un [merchant_patron|El] entrega a uno de sus [clients|El].\n\nLos $game_concept_merchants$ con $game_concept_artifacts$ de tipo $game_concept_charter$ que llevan el sello de su $game_concept_merchant_patron$ acceden a:\n$EFFECT_LIST_BULLET$#EMP #V La [decision|El] $abuse_charter_authority_decision$#!#!\n$EFFECT_LIST_BULLET$#EMP #V La [decision|El] $benevolent_charter_authority_decision$#!#!\n$EFFECT_LIST_BULLET$#EMP #V La [interaction|El] $leverage_charter_authority_interaction$#!#!"
 game_concept_make_a_request: "$patron_request_interaction$"
 game_concept_make_a_request_desc: "$game_concept_make_a_request$ es una [interaction|El] que se emplea para pedir favores, patrocinio u otros apoyos a un [merchant_patron|El]."
 game_concept_request_contract_change: "$subject_modify_tributary_contract_interaction$"
 game_concept_request_contract_change_desc: "$game_concept_request_contract_change$ es una [interaction|El] que emplea un [vassal|El], [tributary|El] o [client|El] para renegociar sus obligaciones para con su [liege|El] o [suzerain|El]."
 game_concept_leading_title: "Título principal"
 game_concept_leading_title_desc: "El [title|El] que lidera una confederación basada en títulos, como una [trade_league|El].\n\nEl [holder|El] del título principal es el [Concept('trade_league_leader', 'líder' )|E] de la confederación."
 game_concept_client_contract: "Pacto clientelar"
 game_concept_client_contracts: "Pactos clientelares"
 game_concept_client_contract_desc: "Los $game_concept_client_contracts$ son aquellos que regulan las [obligations|El] entre un [client|El] y su [merchant_patron|El].\n\nSe pueden negociar cuatro obligaciones: la parte de los ingresos de [trade|El] que se paga al patrón, el respaldo en [prestige|El] del patrón, el apoyo a la [trade_competitiveness|El] y la facilitación de [marriages|El] en nombre de la compañía de mercaderes.\n\nEl pacto se hereda llegada la sucesión y no se puede deshacer a menos que el mercader traslade su [company|El] a una [holding|El] nueva."
 game_concept_member_title: "Título de miembro"
 game_concept_member_title_desc: "Un [title|El] integrante de una confederación basada en títulos, como una [trade_league|El]."
 game_concept_company_sentiment: "Dirección de la compañía"
 game_concept_company_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_direction: "$game_concept_company_sentiment$"
 game_concept_company_direction_i: "$game_concept_company_sentiment_i$"
 game_concept_sentiment: "Dirección"
 game_concept_sentiment_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_desc: "La $game_concept_company_sentiment$ representa los procedimientos de una [merchant_family|El] y la actitud que los miembros tienen entre ellos.\n\nHay varias [company_sentiment_levels|El] y cada una proporciona diversos beneficios y penalizaciones a los miembros de la [house|El].\n\nLa dirección de la compañía cambia dependiendo de las acciones que los miembros de la $game_concept_company$ emprendan en su conjunto. Las [company_sentiment_positive_actions|El] normalmente impulsarán la dirección hacia [company_sentiment_concerted|E] [company_sentiment_concerted_i], mientas que las [company_sentiment_negative_actions|El] impulsarán a la compañía hacia [company_sentiment_divided|E] [company_sentiment_divided_i].\n\nGeneralmente, los [Concept('house_heads', 'jefes de las casas')|E] tienen un grado mayor de influencia sobre la $game_concept_sentiment$ de su casa que otros miembros."
 game_concept_company_sentiment_level: "Postura de la dirección de la compañía"
 game_concept_company_sentiment_level_i: "@company_sentiment_icon!"
 game_concept_company_sentiment_levels: "Posturas de la dirección de la compañía"
 game_concept_company_sentiment_level_desc: "La $game_concept_company_sentiment_level$ es el estado actual de [company_sentiment|El]. La postura activa cambia a medida que la dirección se dirige hacia [company_sentiment_concerted|E] [company_sentiment_concerted_i] mediante [company_sentiment_positive_actions|lE] o hacia [company_sentiment_divided|E] [company_sentiment_divided_i] por [company_sentiment_negative_actions|lE], y cada postura proporciona a los miembros de una [house|lE] distintos beneficios y penalizaciones.\n\nHay cinco posturas distintas:\n$EFFECT_LIST_BULLET$[company_sentiment_divided|E] [company_sentiment_divided_i]\n$EFFECT_LIST_BULLET$[company_sentiment_fractious|E] [company_sentiment_fractious_i]\n$EFFECT_LIST_BULLET$[company_sentiment_independent|E] [company_sentiment_independent_i]\n$EFFECT_LIST_BULLET$[company_sentiment_cooperative|E] [company_sentiment_cooperative_i]\n$EFFECT_LIST_BULLET$[company_sentiment_concerted|E] [company_sentiment_concerted_i]"
 game_concept_company_sentiment_divided: "Voraz"
 game_concept_rapacious: "$game_concept_company_sentiment_divided$"
 game_concept_company_sentiment_fractious: "Oportunista"
