 game_concept_company_sentiment_divided_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_divided$ es la postura más competitiva. Cuando una [company|El] la adopta, todo miembro de la familia se centra en los beneficios por encima de todo, aunque les lleve a pisarse entre ellos.\n\n#bold Efectos de esta $game_concept_company_sentiment_level$:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -20#!\n$EFFECT_LIST_BULLET$Opinión de [merchant_patron|El]: #P +20#!\n$EFFECT_LIST_BULLET$[competitiveness|E] [competitiveness_i]: #P +25 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_very_high_risk_of_leaving$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_request_complete_exploitative_monopolies$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_regional_networks_decision$#!#!"
 game_concept_company_sentiment_fractious_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_fractious$ es una postura muy competitiva, solo por detrás de la [rapacious|El]. Cuando una [company|El] la adopta, sus miembros ponen los intereses individuales por encima del deber familiar.\n\n#bold Efectos de esta [company_sentiment_level|El]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #N -10#!\n$EFFECT_LIST_BULLET$[competitiveness|E] [competitiveness_i]: #P +10 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_risk_of_leaving$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_establish_network_decision$#!#!"
 game_concept_company_sentiment_independent_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_independent$ es la postura media. Cuando una [company|El] la adopta, la familia sigue necesitando una figura respetada, pero los miembros tienen libertad para gestionar sus propios asuntos sin interferencia ni juicio.\n\n#bold Efectos de esta [company_sentiment_level|El]:#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_consult_house_decision$#!#!"
 game_concept_company_sentiment_cooperative_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_cooperative$ es una postura muy centrada en la legitimidad, solo por detrás de la [ennobled|El]. Cuando una [company|El] la adopta, la reputación de esta y la de sus miembros se hacen una sola, y cada miembro debe esforzarse por mejorar su imagen, así como su posición social.\n\n#bold Efectos de esta [company_sentiment_level|El]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +10#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_LIFESTYLE_XP_GAIN_MULT$: #P +5 %#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +10 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_less$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_prosperity_decision$#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_bailiffs_decision$#!#!"
 game_concept_company_sentiment_concerted_desc: "La [company_sentiment_level|El] $game_concept_company_sentiment_concerted$ es la postura más centrada en la legitimidad. Cuando una [company|El] la adopta, la lealtad nacida del deber y el respeto une los intereses del conjunto con los de la cabeza y la compañía puede encontrarse en una posición semejante con las familias nobles.\n\n#bold Efectos de esta [company_sentiment_level|El]:#!\n$EFFECT_LIST_BULLET$$MOD_DYNASTY_HOUSE_OPINION$: #P +20#!\n$EFFECT_LIST_BULLET$$MOD_MONTHLY_PRESTIGE_GAIN_MULT$: #P +25 %#!\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_unlock_befriend_scheme$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_more_likely_to_spawn_opportunity_contracts$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_deputy_positions_cost_significantly_less$\n$EFFECT_LIST_BULLET$$house_unity_parameter_unity_merchant_can_petition_for_noble_standing$\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_family_business_decision$#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_prosperity_decision$#!#!\n$EFFECT_LIST_BULLET$[decision|E] #EMP #V $unity_merchant_bailiffs_decision$#!#!"
 game_concept_company_sentiment_positive_actions: "Acciones legitimadoras"
 game_concept_company_sentiment_positive_actions_desc: "Las acciones legitimadoras que realice tu [company|El] moverán la [Concept('company_sentiment', 'dirección de tu compañía ')|E] hacia [company_sentiment_concerted|E] [company_sentiment_concerted_i].\n\nLos [house_heads|El] pueden usar la [decision|El] #V $unity_merchant_promote_excess_decision$#! para impulsar mucho la [Concept('company_sentiment', 'dirección')|E] hacia [company_sentiment_concerted|E] [company_sentiment_concerted_i]\n\n#weak Algunos ejemplos de $game_concept_company_sentiment_positive_actions$ son:$company_sentiment_increase_examples$#!"
 game_concept_company_sentiment_negative_actions: "Acciones lucrativas"
 game_concept_company_sentiment_negative_actions_desc: "Las acciones lucrativas que realice tu [company|El] moverán la [Concept('company_sentiment', 'dirección de tu compañía ')|E] hacia [company_sentiment_divided|E] [company_sentiment_divided_i].\n\nLos [house_heads|El] pueden usar la [decision|El] #V $unity_merchant_promote_diligence_decision$#! para impulsar mucho la [Concept('company_sentiment', 'dirección')|E] hacia [company_sentiment_divided|E] [company_sentiment_divided_i]\n\n#weak Algunos ejemplos de $game_concept_company_sentiment_negative_actions$ son:$company_sentiment_decrease_examples$#!"
 company_sentiment_increase_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ entre la casa y la nobleza\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ Completar la petición de un asociado\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 company_sentiment_decrease_examples: "\n$EFFECT_LIST_BULLET$ $arrange_marriage_interaction$ con otra casa mercante\n$EFFECT_LIST_BULLET$ Invitar a la compañía\n$EFFECT_LIST_BULLET$ Fracasar en la petición de un asociado\n$EFFECT_LIST_BULLET$ $merchant_adopt_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$"
