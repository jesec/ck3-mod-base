l_spanish:
 gdp_merchant_activity_events.0001.t: "Apetitos no saciados"
 gdp_merchant_activity_events.0001.desc: "Mientras se desarrolla la diversión, oigo refunfuñar a unos invitados hambrientos y cada vez más inquietos. Los platos de la comida solo contienen migas y ningún sirviente corre a reemplazarlos.\n\n[guest.Custom('ES_ElLa')|U] [guest.GetTitledFirstName|l] [guest.Custom('quirk_neg_present')]; tiene una copa vacía a su lado y pregunta: «¿Qué hay que hacer para conseguir una bebida en este condenado banquete?»."
 gdp_merchant_activity_events.0001.host: "\n\n¿Podría ser mi oportunidad para ayudar a animar la ocasión?"
 gdp_merchant_activity_events.0001.guest: "\n\n¿Podría ser mi oportunidad para ayudar a animar el evento de [Select_CString(host.IsFemale, 'nuestra anfitriona', 'nuestro anfitrión' )], [host.Custom('ES_ElLa')] [host.GetTitledFirstName|l]?"
 gdp_merchant_activity_events.0001.a: "«Vamos, poned en marcha las cocinas [host.Custom('ES_DelDela')] [host.GetTitledFirstNameNoTooltip|l], ¡no reparéis en gastos!»."
 gdp_merchant_activity_events.0001.a.host: "«Está bien, ¡me encargaré de poner las cocinas en marcha #EMP de verdad#!!»."
 gdp_merchant_activity_events.0001.b: "Parece que estoy en buena posición para negociar."
 gdp_merchant_activity_events.0001.c: "«¡Mostrad más agradecimiento, [guest.GetTitledFirstNameNoTooltip|l]!»."
 gdp_merchant_activity_events.0001.d: "«¡Si no os place, marchaos!»."
 gdp_merchant_activity_events.0001.e: "«Tomad de los almacenes de la compañía»."
 gdp_merchant_activity_events.0005.t: "Una petición exótica"
 gdp_merchant_activity_events.0005.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('admirer'))], [admirer.Custom('ES_ElLa')] [admirer.GetTitledFirstName|l], me hace gestos para que me una a la conversación con [guest.Custom('ES_ElLa')] [guest.GetTitledFirstName|l].\n\n[admirer.Custom('ES_ElLa')|U] [admirer.GetTitledFirstName|l] sonríe con"
 gdp_merchant_activity_events.0005.desc_esteemed: "calidez"
 gdp_merchant_activity_events.0005.desc_fallback: "diversión"
 gdp_merchant_activity_events.0005.desc_outro: "en la mirada y dice: «Le estaba hablando a mi [admirer.Custom2('RelationToMeShort', SCOPE.sC('guest'))] sobre vuestro descubrimiento de semejante [luxury_artifact.Custom('GetLuxuryArtifactSentiment')|l] en otras tierras. Adelante, ¡contadnos cómo os hicisteis con tal [luxury_artifact.GetName|l]!».\n\nEstá claro que quiere que exagere y que haga alguna chanza para que se entretengan."
 gdp_merchant_activity_events.0005.a: "«No fue gran cosa…»."
 gdp_merchant_activity_events.0005.b: "«¡Arriesgué vida y miembros por ese objeto!»."
 gdp_merchant_activity_events.0005.b.success: "Tus florituras suenan verdaderas"
 gdp_merchant_activity_events.0005.b.failure: "Te pillan las mentiras"
 gdp_merchant_activity_events.0005.c: "«¡Escuchad y escuchad con atención!»."
 gdp_merchant_activity_events.0005.d: "«No es nada comparado con los lujos con los que comercio en [ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip]»."
 gdp_merchant_activity_events.0010.t: "El regalo de dar"
 gdp_merchant_activity_events.0010.desc: "En cuanto llega mi colega mercader, [merchant.Custom('ES_ElLa')] [merchant.GetTitledFirstName|l], empieza a alardear de sus riquezas. Acaricia joyas caras, exhibe buenas ropas de [merchant.Custom('RegionalFabric')] y promociona sin pudor sus [good.Custom('GetTradeGoodUnitPlural')] de [good.Custom('GetTradeGood')] que vende en [merchant.GetTradeMarketForMerchant.GetLocationTitle.GetNameNoTierNoTooltip].\n\n[merchant.GetHerHim|U] pillo cuando da un regalo a mi [ROOT.Char.Custom2('RelationToMeShort', receiver)], [receiver.Custom('ES_ElLa')] [receiver.GetTitledFirstName|l], ante un grupo de espectadores pasmados."
 gdp_merchant_activity_events.0010.a: "Yo también sé jugar a eso…"
 gdp_merchant_activity_events.0010.b: "«¡Qué regalo más considerado, [merchant.GetTitledFirstNameNoTooltip|l]!»."
 gdp_merchant_activity_events.0010.b.success: "Le das una lección a [merchant.GetFirstNameNoTooltip]"
 gdp_merchant_activity_events.0010.b.failure: "Quedas como un[ROOT.Char.Custom('ES_XA')] idiota"
 gdp_merchant_activity_events.0010.c: "Da igual."
 gdp_merchant_activity_events.0010.d: "«Es de mal gusto alardear ante nuestros superiores»."
 gdp_merchant_activity_events.0015.t: "La suerte del campesino"
 gdp_merchant_activity_events.0015.desc: "El banquete, con buena bebida, mucha comida y el agradable calor del hogar, es un contraste marcado del frío de la noche en el exterior.\n\nAcabo de alejarme de los festejos para respirar algo de aire cuando observo a una muchedumbre indigente: un conjunto de plebeyos que rondan junto a los muros, a la espera de conseguir algunas migajas del banquete cuando termine."
 gdp_merchant_activity_events.0015.a: "Dejadles comer y que se diviertan, ¡yo invito!"
 gdp_merchant_activity_events.0015.b: "Prefiero compartir algo de [ROOT.Char.Custom('RegionalDrink')] con los nobles."
 gdp_merchant_activity_events.0015.b.alcohol: "Prefiero compartir unos tragos de [ROOT.Char.Custom('RegionalAlcoholicDrink')] con los nobles."
 gdp_merchant_activity_events.0015.c: "Este es mi sitio #EMP de verdad#!."
 gdp_merchant_activity_events.0015.d: "¡Largo de aquí, escoria de estanque!"
 custom.every_attending_noble: "Todo [character|El] [noble|El] asistente"
 gdp_merchant_activity_events.0020.t: "Según quién mira"
 gdp_merchant_activity_events.0020.desc: "Llegan noticias de que mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other'))], [other.Custom('ES_ElLa')] [other.GetTitledFirstName|l], lleva para la ocasión su [fake_artifact.GetNameNoTooltip|l] de suma elegancia.\n\n[other.Custom('ES_LoLa')|U] localizo en el gran salón, con un aspecto resplandeciente, y veo el collar que reposa sobre su pecho. [other.GetSheHe|U] [other.Custom('quirk_pos_present')] cuando me acerco y dice: «¿Habéis visto mi última adquisición? Un precio sublime, ¿no os parece?».\n\nLa cálida luz de las muchas velas del salón se refleja en la gema de manera agradable, pero, con mi ojo experto, no puedo evitar fijarme en sus muchos defectos."
 gdp_merchant_activity_events.0020.a: "«¡Desternillante! [other.GetFirstNameNoTooltip] cree que esta bagatela vale algo»."
 gdp_merchant_activity_events.0020.b: "#weak *susurro*#!«Dejad que os libre de esa bisutería defectuosa»."
 gdp_merchant_activity_events.0020.b.tt: "Ganas un [artifact|El] de [opinion|El] y [attraction|El]"
 gdp_merchant_activity_events.0020.b.equipped_tt: "Consecución de [fake_artifact.GetName|l] [other.Custom('ES_DelDela')] [other.GetTitledFirstName|l]."
 gdp_merchant_activity_events.0020.c: "«Un objeto sumamente preciado, en verdad»."
 fake_artifact_name: "Collar de gemas"
 fake_artifact_desc: "Un bonito collar que brilla bastante, pero que si se observa con atención se puede ver lo chapucero del corte de las gemas."
 gdp_merchant_activity_events.0025.t: "Un camino muy transitado"
 gdp_merchant_activity_events.0025.desc: "Entre risas y charlas del salón, oigo un sonido inesperado…"
 gdp_merchant_activity_events.0025.desc_ape: "#EMP ¡UH, UH, UH!#!"
 gdp_merchant_activity_events.0025.desc_bird: "#EMP ¡KIII, KIII!#!"
 gdp_merchant_activity_events.0025.desc_cont: "— ¿Alguien ha traído lo que parece ser un ejemplar de [luxury_artifact.Custom('GetDomicileArtifactCreatureType')] al banquete?\n\nAl inspeccionar la multitud, descubro [merchant.Custom('ES_AlAla')] dueñ[merchant.Custom('ES_OA')] de la criatura, otr[merchant.Custom('ES_OA')] mercader: [merchant.GetTitledFirstName|l]. Al fijarse en mi mirada curiosa, [merchant.Custom('quirk_pos_present')] y dice: «Adquirí este espécimen sublime en el transcurso de uno de mis muchos viajes. Existe un mercado encantador que suelo visitar. Un secreto de la compañía». [merchant.GetFirstName] se golpea levemente la nariz con una sonrisita de satisfacción."
 gdp_merchant_activity_events.0025.a: "«¡Ah, creo que sé de qué lugar habláis!»."
 gdp_merchant_activity_events.0025.b: "«¿Podría convenceros para revelar su ubicación?»."
 gdp_merchant_activity_events.0025.b.success: "Presentas unos argumentos convincentes"
 gdp_merchant_activity_events.0025.b.failure: "No consigues presentar unos argumentos convincentes"
 gdp_merchant_activity_events.0025.c: "«¡Contadme más sobre vuestros viajes!»."
 gdp_merchant_activity_events.0025.tt.menagerie: "Crear un [luxury_contract|El] [luxury_contract_i] #V $menagerie_acquisition_contract$#!"
 gdp_merchant_activity_events.0025.tt.curio: "Crear un [luxury_contract|El] [luxury_contract_i] #V $find_curio_contract$#!"
