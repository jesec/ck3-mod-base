l_spanish:
 gdp_merchant_patron_contract.0001.t: "[task_contract.GetType.GetName]: las [patron.Custom('GetRoomPlural')] [patron.Custom('ES_DelDela')] [patron.GetTitleAsNameNoTooltip|l]"
 gdp_merchant_patron_contract.0001.desc: "[patron.Custom('ES_ElLa')|U] [patron.GetTitledFirstName|l] es un[patron.Custom('ES_XA')] gran [patron.GetWomanMan], y nobles, sacerdotes, comerciantes y plebeyos por igual de [patron.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] y más allá compiten por su atención y mecenazgo.\n\nDebemos ser directos, pero también ir con cuidado, si queremos asegurarnos de que la compañía siga a buenas con [patron.GetSheHe], sin vernos eclipsados por un rival más astuto ni perder su atención.\n\nNuestro negocio debe estar siempre en boca de las personas más influyentes de [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_patron_contract.0001.a: "$merchant_base_patron_contract_schemes.0000.generic_option.success_chance$"
 gdp_merchant_patron_contract.0001.b: "$merchant_base_patron_contract_schemes.0000.generic_option.speed$"
 gdp_merchant_patron_contract.0001.c: "$merchant_base_patron_contract_schemes.0000.generic_option.progress$"
 gdp_merchant_patron_contract.0001.d: "$merchant_base_patron_contract_schemes.0000.generic_option.nothing$"
 gdp_merchant_patron_contract.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 gdp_merchant_patron_contract.0002.t: "$gdp_merchant_patron_contract.0001.t$: ¡éxito!"
 gdp_merchant_patron_contract.0002.desc: "[patron.Custom('ES_ElLa')|U] [patron.GetTitledFirstName|l] no se ha podido resistir a mis historias sobre tierras lejanas y los mundos entrecruzados del comercio, y está pendiente de mis palabras cada velada en la mesa de banquetes.\n\nPuedo regresar a la compañía con la seguridad de saber que [patron.GetFirstNameNoTooltip] nos considera unos colaboradores valiosos y unos amigos bienvenidos.\n\nNuestra reputación se ha visto reforzada considerablemente en [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], y no cabe duda de que las historias de mi influencia me precederán en sitios más lejanos."
 gdp_merchant_patron_contract.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_merchant_patron_contract.0003.t: "$gdp_merchant_patron_contract.0001.t$: ¡fracaso!"
 gdp_merchant_patron_contract.0003.desc: "[patron.Custom('ES_ElLa')|U] [patron.GetTitledFirstName|l] cada vez me convoca menos; ¿habré hecho algo mal? Un cambio en los modales de los cortesanos de [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] me confirma su disgusto.\n\n¿Le aburrieron mis anécdotas? ¿Demasiados comentarios sobre bobadas del comercio? ¿Sobrepasé algún límite invisible sobre la #EMP nobleza#!?\n\nAhora ya no se puede hacer nada, salvo volver a la compañía, mitigar los daños y dejar de nuevo las cosas en su sitio…"
 gdp_merchant_patron_contract.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 gdp_impressed_patron_modifier: "Patrón impresionado"
 gdp_impressed_patron_modifier_desc: "Los esfuerzos de este mercader por congraciarse con su patrón le han dejado una buena impresión."
 gdp_impressed_patron_critical_modifier: "Patrón impresionado"
 gdp_impressed_patron_critical_modifier_desc: "$gdp_impressed_patron_modifier_desc$"
 gdp_dismissive_patron_modifier: "Patrón desdeñoso"
 gdp_dismissive_patron_modifier_desc: "Los intentos de un mercader por congraciarse con su patrón han decepcionado a este."
