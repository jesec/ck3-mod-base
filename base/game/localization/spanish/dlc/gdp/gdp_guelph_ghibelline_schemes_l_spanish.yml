l_spanish:
 #Side Switch Scheme
 gg_switch_sides: "Persuadir para cambiar de bando"
 gg_switch_sides_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] pronto entenderá cuál es el alineamiento #EMP correcto#! en esta situación…"
 gg_switch_sides_desc_general: "La [scheme|lE] $gg_switch_sides$ es [Concept('political_scheme', 'aquella')|E] que busca convencer al [scheme_target|lE] para que cambie de bando en la [situation|El] [guelph_ghibelline_situation|E]."
 GG_SWITCH_SIDES_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] se une a los [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_switch_sides_invalidated_title: "@scheme_icon! La conjura $gg_switch_sides$ termina"
 #Side Switch Interaction
 start_gg_switch_sides_interaction: "$gg_switch_sides$ #weak (conjura)#!"
 gg_switch_sides_action: "Coaccionar"
 scheme_interaction_tt_gg_switch_sides: "Intentar coaccionar a [recipient.GetShortUINameNoTooltip] para que se una a los [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_switch_sides_interaction_notification: "$gg_switch_sides$"
 gg_switch_sides_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip] sigue contrariad[recipient.Custom('ES_OA')] por la última vez que solicitaste que se uniese a los [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 #Claim Leadership Scheme
 gg_claim_leadership: "Reclamar liderazgo"
 gg_claim_leadership_desc: "Los [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')|l] pronto entenderán quién está mejor preparado para ser líder"
 gg_claim_leadership_desc_general: "La [scheme|lE] $gg_claim_leadership$ es una [political_scheme|El] que busca hacer que el [scheme_owner|El] sea el líder de su bando en la [situation|El] [guelph_ghibelline_situation|E]. Es una [secret_scheme|El] basada en la [diplomacy|El] que permite reclutar [agents|El].\n\nCuanta más [gg_involvement|El] tenga el [scheme_owner|El] en comparación con el líder actual, más alta será la [scheme_success_chance|El]. Superar al líder en [prestige_level|El] también ayuda."
 GG_CLAIM_LEADERSHIP_SUCCESS_DESC: "[CHARACTER.GetShortUIName|U] se convierte en el nuevo líder de los [CHARACTER.Custom('GetGuelphsGhibellinesConcept')|l]"
 GG_CLAIM_LEADERSHIP_DISCOVERY_DESC: "Evitas perder [prestige|El] y empeorar la relación con [TARGET_CHARACTER.GetShortUIName]"
 gg_claim_leadership_invalidated_title: "@scheme_icon! La conjura $gg_claim_leadership$ termina"
 #Claim Leadership Interaction
 start_gg_claim_leadership_interaction: "$gg_claim_leadership$ #weak (conjura)#!"
 gg_claim_leadership_action: "Reclamar liderazgo a otro personaje"
 scheme_interaction_tt_gg_claim_leadership: "Intentar hacerse con el liderazgo [recipient.Custom('GetGuelphGhibellineConcept')|l] de [recipient.GetShortUIName]"
 gg_claim_leadership_interaction_notification: "$gg_claim_leadership$"
 #Align Undecided Scheme
 gg_align_undecided: "Alineamiento no decidido"
 gg_align_undecided_desc: "Se obligará a [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] a simpatizar con los [SCHEME.GetOwner.Custom('GetGuelphsGhibellines')|l]"
 gg_align_undecided_desc_general: "La [political_scheme|lE] $gg_align_undecided$ pretende hacer que el [scheme_target|El] se una al bando del [scheme_owner|El] en la [situation|El] [guelph_ghibelline_situation|E]."
 GG_ALIGN_UNDECIDED_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUIName|U] se hace del bando [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]"
 gg_align_undecided_invalidated_title: "@scheme_icon! La conjura $gg_align_undecided$ termina"
 #Align Undecided Interaction
 start_gg_align_undecided_interaction: "$gg_align_undecided$ #weak (conjura)#!"
 gg_align_undecided_action: "Alinearse"
 scheme_interaction_tt_gg_align_undecided: "Intentar alinear a [recipient.GetShortUIName] con los [actor.Custom('GetGuelphsGhibellinesConcept')|l]"
 gg_align_undecided_interaction_notification: "$gg_align_undecided$"
 #Replace Ruler Scheme
 gg_replace_ruler: "Reemplazar gobernante"
 gg_replace_ruler_desc: "Los servicios de [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] ya no son necesarios. Debemos sustituirlos por los de alguien un poco más… #EMP racional#!."
 gg_replace_ruler_desc_general: "La [political_scheme|lE] $gg_replace_ruler$ pretende sustituir al [scheme_target|El] por un gobernante que sea leal al bando del [scheme_owner|El] en la [situation|El] [guelph_ghibelline_situation|E]."
 GG_REPLACE_RULER_SUCCESS_DESC: "Se sustituye a [TARGET_CHARACTER.GetShortUIName|U] por alguien leal al bando [CHARACTER.Custom('GetGuelphGhibellineConcept')|l]"
 GG_REPLACE_RULER_DISCOVERY_DESC: "Evitas perder [prestige|El] y empeorar la relación con [TARGET_CHARACTER.GetShortUIName]"
 gg_replace_ruler_invalidated_title: "@scheme_icon! La conjura $gg_replace_ruler$ termina"
 #Replace Ruler Interaction
 start_gg_replace_ruler_interaction: "$gg_replace_ruler$ #weak (conjura)#!"
 gg_replace_ruler_action: "Reemplazar"
 scheme_interaction_tt_gg_replace_ruler: "Intentar reemplazar a [recipient.GetShortUIName] con alguien leal al bando [actor.Custom('GetGuelphGhibellineConcept')|l]"
 gg_replace_ruler_interaction_notification: "$gg_replace_ruler$"
 gg_replace_ruler_interaction_cooldown_active_tt: "[recipient.GetShortUINameNoTooltip] sigue en alerta desde la última vez que intentaste sustituirl[recipient.Custom('ES_OA')]"
 gg_replace_ruler_no_replace_leader_dictatus_tt: "No puedes sustituir a un líder [GetSituation('guelph_ghibelline').GetName|l] si estás en la [situation_phase_phase|El] [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName]"
