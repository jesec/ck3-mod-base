l_spanish:
 # Trade-good flavor pool (gdp_trade_good_flavor)
 # 1001 - Counting Stock
 gdp_trade_good_flavor.1001.t: "Haciendo inventario"
 gdp_trade_good_flavor.1001.desc: "Cuento mis [tgf_good.Custom('GetTradeGoodUnitPlural')] de [tgf_good.Custom('GetTradeGood')] una vez más antes de irme a la cama. Trescientas doce unidades, y cada una de ellas se ha vendido ya… al menos en mi cabeza.\n\nLas vuelvo a contar. Solo para asegurarme."
 gdp_trade_good_flavor.1001.a: "Todo esto. Todo esto es mío."
 gdp_trade_good_flavor.1001.b: "Los libros de cuentas deben coincidir conmigo."
 # 1002 - Word Travels
 gdp_trade_good_flavor.1002.t: "Las noticias vuelan"
 gdp_trade_good_flavor.1002.desc: "Me han llegado noticias: en su mesa, [tgf_market_holder.Custom('ES_ElLa')] [tgf_market_holder.GetTitledFirstName|l] ha estado alabando lo que vendo, [tgf_good.Custom('GetTgfGoodLook')]. [tgf_market_holder.GetSheHe|U] quiere más, y sus vecinos le han oído decirlo.\n\nAprecio los halagos, pero los halagos de un[tgf_market_holder.Custom('ES_XA')] [tgf_market_holder.GetWomanMan] que sigue comprando son mucho mejores."
 gdp_trade_good_flavor.1002.a: "Un regalo para mi comprador[tgf_market_holder.Custom('ES_XA')] favorit[tgf_market_holder.Custom('ES_OA')]."
 gdp_trade_good_flavor.1002.b: "Entonces puede pagar más."
 gdp_trade_good_flavor.1002.c: "Que hablen."
 # 1003 - From the Source
 gdp_trade_good_flavor.1003.t: "De origen"
 gdp_trade_good_flavor.1003.desc: "«En la cultura [tgf_source_culture.GetName], los trabajadores conocen sus mercancías hasta la última muestra de [tgf_good.Custom('GetTgfGoodSmallest')]», escribe mi comerciante, [tgf_trader.GetFirstName], desde [tgf_source_county.GetNameNoTier]. «Con mi producto, [tgf_good.Custom('GetTradeGood')], [tgf_good.Custom('GetTgfGoodMade')], nadie escatima en gastos».\n\nSi se conoce el origen, la mitad del trabajo de vender el producto está hecho."
 gdp_trade_good_flavor.1003.a: "Cada detalle vale dinero."
 gdp_trade_good_flavor.1003.b: "Ahora sé lo que debería costar."
 gdp_trade_good_flavor.1003.c: "Respeto, de parte de un[ROOT.Char.Custom('ES_XA')] comerciante a otr[tgf_trader.Custom('ES_OA')]."
 # 1004 - An Open Road
 gdp_trade_good_flavor.1004.t: "Una carretera abierta"
 gdp_trade_good_flavor.1004.desc: "Mi comerciante, [tgf_trader.GetFirstName], sonríe como [tgf_trader.GetWomanMan] que ya se ha gastado su parte. «La ruta está totalmente abierta, y preguntan específicamente por tu producto, [tgf_good.Custom('GetTgfGoodLook')]».\n\nLos años buenos pasan rápido. Será mejor aprovechar este."
 gdp_trade_good_flavor.1004.a: "Vendamos mientras la ruta nos sea benévola."
 gdp_trade_good_flavor.1004.b: "Todo buen año enseña una lección. Aprendámosla."
 gdp_trade_good_flavor.1004.c: "¡Invirtamos en más carromatos!"
 # 1005 - Dreams of Profit
 gdp_trade_good_flavor.1005.t: "Sueños de beneficio"
 gdp_trade_good_flavor.1005.desc: "He vuelto a soñar con mi almacén de [tgf_good.Custom('GetTradeGood')]. Infinidad de [tgf_good.Custom('GetTradeGoodUnitPlural')], hasta las vigas, y yo sobre mi producto, observando a los compradores desde arriba pelearse por ser los primeros en pagar.\n\n"
 gdp_trade_good_flavor.1005.desc.livestock: "He vuelto a soñar con mi producto: [tgf_good.Custom('GetTradeGood')]. Rebaños enteros, llenando todos los caminos que van al mercado, y yo cabalgando a la cabeza de la columna, contando a los compradores que vienen corriendo hacia mí.\n\n"
 gdp_trade_good_flavor.1005.desc.outro: "Me he despertado riendo. Luego, he empezado a escribir números. De aquí a nada, ¡me haré de oro!"
 gdp_trade_good_flavor.1005.a: "¿Por qué debería seguir siendo solo un sueño?"
 gdp_trade_good_flavor.1005.a.tt: "Pronto se presentará una nueva [trade_opportunity|El]"
 gdp_trade_good_flavor.1005.b: "Los números cuadrarán. Yo haré que lo hagan."
 gdp_trade_good_flavor.1005.c: "Cinco minutos más haciéndome de oro… Zz#DIE1 zz#!#DIE2 zz…#!"
 # 1006 - Fools Who Check
 gdp_trade_good_flavor.1006.t: "Idiotas que no comprueban"
 gdp_trade_good_flavor.1006.desc: "Mi comerciante, [tgf_trader.GetFirstName], me lleva a un lado del almacén. «[tgf_good.Custom('GetTradeGood')|U] de [tgf_source_county.GetNameNoTier]… [tgf_good.Custom('GetTgfGoodFlaw')]. ¡Se creen que somos idiotas que no comprueban la mercancía!».\n\nHan intentado timarme. En lugar de ello, me han ofrecido un descuento."
 gdp_trade_good_flavor.1006.a: "La mercancía mediocre debería tener un precio mediocre."
 gdp_trade_good_flavor.1006.b: "Je. Hemos sido más inteligentes."
 # 1007 - Ask for It by Name
 gdp_trade_good_flavor.1007.t: "Preguntar por su nombre"
 gdp_trade_good_flavor.1007.desc: "Mi comerciante, [tgf_trader.GetFirstName], trae extrañas noticias de [tgf_source_county.GetNameNoTier]. «¡[tgf_good.Custom('GetTradeGood')|U], [tgf_good.Custom('GetTgfGoodSold')], y los [tgf_source_culture.GetCollectiveNoun] siguen pidiendo «#EMP [tgf_good.Custom('GetTradeGood')] de [ROOT.Char.GetHouse.GetName]#!» por su nombre, y pagando más de la cuenta por ello! ¡Nos estamos quedando sin existencias!».\n\nMi nombre, por lo que parece, vale dinero."
 gdp_trade_good_flavor.1007.a: "Estampad mi sello en cada [tgf_good.Custom('GetTradeGoodUnit')]."
 gdp_trade_good_flavor.1007.b: "¡Vended, vended, vended!"
 # 1008 - The Appraiser
 gdp_trade_good_flavor.1008.t: "Alabanza de [tgf_good.GetNameNoTooltip|l]"
 gdp_trade_good_flavor.1008.desc: "Una carta llega con el sello [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l]. «Me han ofrecido [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')], y mi administrador no sabe distinguir la buena calidad de la mala. ¿Podríais echarle un vistazo con vuestro ojo de comerciante?».\n\nResulta halagador. Pero los halagos cuestan más."
 gdp_trade_good_flavor.1008.a: "La verdad, pesada y medida."
 gdp_trade_good_flavor.1008.b: "Magnífico. No había visto nada igual."
 gdp_trade_good_flavor.1008.c: "Las opiniones de los expertos se venden, no se regalan."
 # 1009 - Learn to Count
 gdp_trade_good_flavor.1009.t: "Aprendiendo a contar"
 gdp_trade_good_flavor.1009.desc: "Pillo a mi hereder[tgf_heir.Custom('ES_OA')], [tgf_heir.GetFirstName], en el almacén, observando [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] como si hubiera monedas escondidas debajo.\n\n"
 gdp_trade_good_flavor.1009.desc.livestock: "Pillo a mi hereder[tgf_heir.Custom('ES_OA')], [tgf_heir.GetFirstName], en los corrales, evaluando [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] como si hubiera monedas escondidas debajo de su piel.\n\n"
 gdp_trade_good_flavor.1009.desc.outro: "Buen instinto. Ya es hora de que alguien se lo afine."
 gdp_trade_good_flavor.1009.a: "Ven. Observa lo que hago."
 gdp_trade_good_flavor.1009.b: "Cuenta, venga. Dos veces."
 # 1010 - The Imitator
 gdp_trade_good_flavor.1010.t: "[tgf_rival.Custom('ES_ElLa')|U] imitador[tgf_rival.Custom('ES_XA')]"
 gdp_trade_good_flavor.1010.desc: "Me devuelven una caja en [tgf_source_county.GetNameNoTier] por no estar «al nivel de calidad habitual». No es mía, pero parece que alguien ha copiado mi marca hasta el último detalle.\n\n"
 gdp_trade_good_flavor.1010.desc.livestock: "Me devuelven una de mis bestias en [tgf_source_county.GetNameNoTier] por no estar «al nivel de calidad habitual». No es mía, pero parece que alguien ha copiado mi hierro hasta el último detalle.\n\n"
 gdp_trade_good_flavor.1010.desc.outro: "Mi comerciante, [tgf_trader.GetFirstName], señala [tgf_rival.Custom('ES_AlAla')] falsificador[tgf_rival.Custom('ES_XA')]: [tgf_rival.GetFirstName], de la [tgf_rival.Custom('GetTgfCompanyWord')|l] [tgf_rival.GetHouse.GetBaseNameNoTooltip]. Copia bien, eso hay que reconocérselo."
 gdp_trade_good_flavor.1010.a: "Acabad con estas falsificaciones, cueste lo que cueste."
 gdp_trade_good_flavor.1010.b: "Que todas las casas se enteren de este insulto."
 gdp_trade_good_flavor.1010.c: "La imitación está ayudando a popularizar mi nombre gratis."
 house_relation_tgf_imitation_desc: "[ROOT.Char.GetShortUINameNotMe|U] ha convertido las falsificaciones de [tgf_rival.GetShortUINameNotMy] en un asunto entre sus casas."
 house_relation_reason_tgf_imitation_desc: "[char.GetShortUINameNotMe|U] ha convertido las falsificaciones de [target_char.GetShortUINamePossessiveNotMy] en un asunto entre sus casas."
 # 1011 - The Price of Names
 gdp_trade_good_flavor.1011.t: "El precio de [tgf_good.GetNameNoTooltip|l]"
 gdp_trade_good_flavor.1011.desc: "[tgf_envoy.GetFirstName|U], comerciante a sueldo de la [tgf_rival.Custom('GetTgfCompanyWord')|l] [tgf_rival.GetHouse.GetBaseNameNoTooltip], me encuentra en mi almacén y me lanza una bolsa pesada sobre la mesa. «Mi am[tgf_rival.Custom('ES_OA')], [tgf_rival.GetFirstName], quiere los nombres de vuestros vendedores de [tgf_good.Custom('GetTradeGood')]. De todos. La bolsa os lo pide amablemente».\n\nNo está comprando nombres. Está comprando años de trabajo por mi parte."
 gdp_trade_good_flavor.1011.a: "Los nombres son solo tinta. Pagad."
 gdp_trade_good_flavor.1011.b: "Mi ventaja no está a la venta."
 # 1012 - A Truce of Traders
 gdp_trade_good_flavor.1012.t: "Una tregua de comerciantes"
 gdp_trade_good_flavor.1012.desc: "[tgf_ally.GetFirstName|U] vende [tgf_good.Custom('GetTradeGood')] en [tgf_source_county.GetNameNoTier], al igual que yo, y cada temporada ajustamos nuestros precios al límite. Hoy, me ha enviado una carta para ofrecer una tregua: si dejamos de bajar los precios, nuestras dos casas comerán bien.\n\nLa paz, al parecer, puede comprarse como cualquier otra cosa."
 gdp_trade_good_flavor.1012.a: "De acuerdo. Comeremos todos bien."
 gdp_trade_good_flavor.1012.b: "Puedo pasar más hambre que [tgf_ally.GetSheHe]."
 house_relation_tgf_truce_desc: "[ROOT.Char.GetShortUINameNotMe|U] y [tgf_ally.GetShortUINameNotMe] han accedido a dejar de abaratar los precios para competir entre sí."
 house_relation_reason_tgf_truce_desc: "[char.GetShortUINameNotMe|U] y [target_char.GetShortUINameNotMe] han accedido a dejar de abaratar los precios para competir entre sí."
 # 1013 - A Private Price
 gdp_trade_good_flavor.1013.t: "Un precio privado"
 gdp_trade_good_flavor.1013.desc: "Recibo una carta con el sello [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l]. «Compras [tgf_good.Custom('GetTradeGood')] en mi mercado. Hazlo solo allí, y pagarás menos que ningún otro mercader».\n\nLa exclusividad es otra forma de atadura, pero la tarifa es buena."
 gdp_trade_good_flavor.1013.a: "Su mercado, mi descuento. Está hecho."
 gdp_trade_good_flavor.1013.b: "No me inclino ante los libros de cuentas de nadie."
 # 1014 - Ask the Old Hands
 gdp_trade_good_flavor.1014.t: "El consejo de los mayores"
 gdp_trade_good_flavor.1014.desc: "Un[tgf_porter.Custom('ES_XA')] transportista de edad avanzada está descargando su mercancía en el almacén de [tgf_source_county.GetNameNoTier]. «Perdonad, pero estáis revisando mal vuestra mercancía de [tgf_good.Custom('GetTradeGood')]». Me enseña cómo se hace: así, y así.\n\nUna vida entera transportando [tgf_good.Custom('GetTradeGoodUnitPlural')] le ha enseñado más que a la mayoría."
 gdp_trade_good_flavor.1014.desc.livestock: "Un[tgf_porter.Custom('ES_XA')] arrier[tgf_porter.Custom('ES_OA')] de edad avanzada está llevando su ganado al mercado de [tgf_source_county.GetNameNoTier]. «Perdonad, pero estáis juzgando mal vuestro rebaño de [tgf_good.Custom('GetTradeGood')]». Me enseña cómo se hace: así, y así.\n\nUna vida entera llevando [tgf_good.Custom('GetTradeGood')] al mercado le ha enseñado más que a la mayoría."
 gdp_trade_good_flavor.1014.a: "Aquí tenéis. La sabiduría merece pagarse."
 gdp_trade_good_flavor.1014.b: "Continuad. Os escucho."
 # 1015 - A Beginner's Mistake
 gdp_trade_good_flavor.1015.t: "Error de principiante"
 gdp_trade_good_flavor.1015.desc: "En algún lugar de [tgf_source_county.GetNameNoTier], el comerciante que me vendió [tgf_good.Custom('GetTradeGood')] está brindando por mí. He pagado un precio de locos, y me he dado cuenta tarde.\n\nBueno. Los necios que aprenden… dejan de ser necios."
 gdp_trade_good_flavor.1015.a: "Una lección cara sigue siendo una lección."
 gdp_trade_good_flavor.1015.b: "Ya basta. Esta noche los libros de cuentas descansarán."
 # 1016 - The Merchant's Handbook
 gdp_trade_good_flavor.1016.t: "El manual del mercader"
 gdp_trade_good_flavor.1016.desc.intro: "Calzado en una caja de [tgf_good.Custom('GetTradeGood')], envuelto para protegerlo de la humedad, encuentro una copia de "
 gdp_trade_good_flavor.1016.desc.intro_livestock: "Entre el equipamiento que vino con el último cargamento de [tgf_good.Custom('GetTradeGood')] que compré, envuelto para protegerlo de la humedad, encuentro una copia de "
 gdp_trade_good_flavor.1016.desc.book_1: "La práctica del comercio"
 gdp_trade_good_flavor.1016.desc.book_2: "El libro de los caminos y los mercados"
 gdp_trade_good_flavor.1016.desc.book_3: "El espejo del mercader"
 gdp_trade_good_flavor.1016.desc.outro: "; pesos, medidas, caminos y precios, apuntados por un mercader que al parecer nunca dormía.\n\nAlguien ha perdido un tesoro. Lo aprovecharé."
 gdp_trade_good_flavor.1016.a: "Leerlo hasta que me duela la espalda."
 gdp_trade_good_flavor.1016.b: "Los libros tan poco comunes alcanzan precios elevados."
 # 1017 - The Feel of It
 gdp_trade_good_flavor.1017.t: "Aprended cómo se hace"
 gdp_trade_good_flavor.1017.desc: "En [tgf_source_county.GetNameNoTier], un vendedor de los [tgf_seller.GetCulture.GetCollectiveNoun], [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] en mano, me pide el precio de tres. «Sois principiante en esto, ¿verdad? Pues aprended cómo se hace».\n\n"
 gdp_trade_good_flavor.1017.desc.livestock: "En [tgf_source_county.GetNameNoTier], un vendedor de los [tgf_seller.GetCulture.GetCollectiveNoun], haciendo desfilar su [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] ante mí, me pide el precio de tres. «Sois principiante en esto, ¿verdad? Pues aprended cómo se hace».\n\n"
 gdp_trade_good_flavor.1017.desc.outro: "Insolente. Tiene razón, pero es insolente."
 gdp_trade_good_flavor.1017.a: "Tomad el dinero. Enseñadme."
 gdp_trade_good_flavor.1017.b: "Por supuesto que no."
 # 1018 - Wrong Measure
 gdp_trade_good_flavor.1018.t: "Medida incorrecta"
 gdp_trade_good_flavor.1018.desc: "Mi comerciante, [tgf_trader.GetFirstName], descubre que hemos estado vendiendo [tgf_good.Custom('GetTradeGood')] con las medidas de la cultura [ROOT.Char.GetCulture.GetName], que son un poco más pequeñas que las de la cultura [tgf_source_culture.GetName] que los compradores asumen. Cada [tgf_good.Custom('GetTradeGoodUnit')] que hemos vendido podría haber ingresado más.\n\nUn error involuntario. Que siga siéndolo depende de mí."
 gdp_trade_good_flavor.1018.a: "Corregid las medidas. Todas."
 gdp_trade_good_flavor.1018.b: "La diferencia se queda en mi bolsa."
 gdp_trade_good_flavor.1018.c: "Pesad con sus valores, y decidlo abiertamente."
 # 1019 - Two Goods, One Buyer
 gdp_trade_good_flavor.1019.t: "Dos artículos, un comprador"
 gdp_trade_good_flavor.1019.desc: "Recibo una carta [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l]. «Enviadme vuestra mercancía de [tgf_good.Custom('GetTradeGood')]. Y también [tgf_good_b.Custom('GetTradeGood')], ambas cosas no valen nada sin la otra».\n\n"
 gdp_trade_good_flavor.1019.desc.generic: "Recibo una carta [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l]. «Enviadme vuestra mercancía de [tgf_good.Custom('GetTradeGood')]. Y también [tgf_good_b.Custom('GetTradeGood')], en el mismo envío».\n\n"
 gdp_trade_good_flavor.1019.desc.outro: "Dos artículos, un comprador, un precio. Mi cuenta aritmética favorita."
 gdp_trade_good_flavor.1019.a: "Vendedlo en conjunto, con un precio de conjunto."
 gdp_trade_good_flavor.1019.b: "Por separado. El dinero ahora es mejor que el dinero después."
 # 1020 - The Builder's Rate
 gdp_trade_good_flavor.1020.t: "A precio de constructor"
 gdp_trade_good_flavor.1020.desc: "Los andamios ascienden por cada rincón de [tgf_build_county.GetNameNoTier]. [tgf_market_holder.Custom('ES_ElLa')|U] [tgf_market_holder.GetTitledFirstName|l] está construyendo, y cada carro que se dirige a las obras está cargado con mi mercancía de [tgf_good.Custom('GetTradeGood')]. [tgf_market_holder.GetSheHe|U] me escribe para pedir un precio de constructor: la misma cantidad de [tgf_good.Custom('GetTradeGood')], un poco más barata, hasta que los muros se sostengan firmes.\n\nCada muro que está erigiendo ya es la mitad mío."
 gdp_trade_good_flavor.1020.a: "Habrá un precio de constructor."
 gdp_trade_good_flavor.1020.b: "Un precio, sí. Un regalo, no."
 gdp_trade_good_flavor.1020.c: "Favor con favor se paga."
 gdp_trade_good_flavor.1020.d: "Lo mejor me lo sigo quedando yo."
 # 1021 - Know the Goods
 gdp_trade_good_flavor.1021.t: "Conocer la mercancía"
 gdp_trade_good_flavor.1021.desc: "Cada negocio tiene su maestro, y los maestros #EMP nunca dejan#! de aprender. Esta noche me quedaré a solas en mis almacenes con una lámpara y mis mejores [tgf_good.Custom('GetTradeGoodUnitPlural')] de [tgf_good.Custom('GetTradeGood')], que estudiaré hasta que la luz se apague.\n\nHay un motivo por el que lo mío se vende y lo de los demás no."
 gdp_trade_good_flavor.1021.desc.livestock: "Cada negocio tiene su maestro, y los maestros nunca dejan de aprender. Esta noche me quedaré a solas con un farol y mis mejores ejemplares de [tgf_good.Custom('GetTradeGood')], que estudiaré desde los dientes hasta la cola.\n\nHay un motivo por el que lo mío se vende y lo de los demás no."
 gdp_trade_good_flavor.1021.desc.books: "Cada negocio tiene su maestro, y los maestros #EMP nunca dejan#! de aprender. Esta noche me quedaré a solas en mis almacenes con una lámpara y mis mejores libros, que estudiaré hasta que la luz se apague.\n\nHay un motivo por el que lo mío se vende y lo de los demás no."
 gdp_trade_good_flavor.1021.a: "Me quedaré esto. Me servirá para medir todo lo demás."
 gdp_trade_good_flavor.1021.b: "Siempre hay algo más que aprender."
 # 1022 - A Name for the Trade
 gdp_trade_good_flavor.1022.t: "Un nombre para el negocio"
 gdp_trade_good_flavor.1022.desc: "En [tgf_source_county.GetNameNoTier] ya no mencionan mi nombre. Dicen «[tgf_good.Custom('GetTgfGoodNickname')]», y todos saben a quién se refieren. #bold A mí.#!\n\nLos señores conceden títulos. Pero los nombres los conceden los mercados, y los elogios de un mercado se ganan."
 gdp_trade_good_flavor.1022.a: "Vulgar. Efectivo pero vulgar."
 gdp_trade_good_flavor.1022.b: "Dejadlos. El nombre es bueno para el negocio."
 # 1023 - A Choke on Supply
 gdp_trade_good_flavor.1023.t: "Un cuello de botella en el suministro"
 gdp_trade_good_flavor.1023.desc: "«Compráis más rápido de lo que podemos producir», dice [tgf_foreman.GetFirstName], capataz de [tgf_source_county.GetNameNoTier], mientras observo mi mercancía de [tgf_good.Custom('GetTradeGood')], [tgf_good.Custom('GetTgfGoodMade')]. «No hay tantos trabajadores disponibles».\n\nMás mano de obra cuesta dinero. Alejar a los compradores es más caro aún."
 gdp_trade_good_flavor.1023.a: "Contratad a más gente. Pagaré."
 gdp_trade_good_flavor.1023.b: "Venid a trabajar conmigo en su lugar."
 gdp_trade_good_flavor.1023.c: "Entonces, mostradme cómo se hace."
 # 1024 - Under the Hammer
 gdp_trade_good_flavor.1024.t: "Bajo el martillo"
 gdp_trade_good_flavor.1024.desc: "«¡Cuarenta [tgf_good.Custom('GetTradeGoodUnitPlural')] de [tgf_good.Custom('GetTradeGood')] para el mejor postor!». En el [tgf_source_province.Custom('GetRegionalMarketTerm')] de [tgf_source_county.GetNameNoTier], [tgf_rival.GetFirstName], de la [tgf_rival.Custom('GetTgfCompanyWord')|l] [tgf_rival.GetHouse.GetBaseNameNoTooltip], alza la mano antes de que el subastador haya terminado de presentar el artículo.\n\n[tgf_rival.GetSheHe|U] me mira y sonríe. Piensa que este lote ya le pertenece…"
 gdp_trade_good_flavor.1024.a: "Subo un poco más su puja, sea cual sea."
 gdp_trade_good_flavor.1024.b: "Subid más y más la puja… ¡y será toda vuestra, [tgf_rival.GetFirstNameNoTooltip]!"
 gdp_trade_good_flavor.1024.c: "Que puje cuanto quiera. Veré quién gana."
 # 1025 - First at the Quay
 gdp_trade_good_flavor.1025.t: "Los primeros del muelle"
 gdp_trade_good_flavor.1025.desc: "«Veinte barcos en el muelle y una grúa», dice [tgf_docks_boss.GetFirstName], que dirige a los estibadores de [tgf_source_county.GetNameNoTier]. «Quien consiga desembarcar su carga de [tgf_good.Custom('GetTradeGood')] primero fija el precio de la temporada. Los vuestros pueden desembarcar primero».\n\nMe extiende la mano, con la palma hacia arriba."
 gdp_trade_good_flavor.1025.a: "El primero en salir del barco fija el precio."
 gdp_trade_good_flavor.1025.b: "Entonces, lo venderé aquí, nada más salir del muelle."
 gdp_trade_good_flavor.1025.c: "Dejad que los otros desembarquen primero, y observad qué piden."
 # 1026 - By the Handful
 gdp_trade_good_flavor.1026.t: "A puñados"
 gdp_trade_good_flavor.1026.desc: "«De [tgf_good.Custom('GetTgfGoodSmallest')] en [tgf_good.Custom('GetTgfGoodSmallest')], así es como compran los pobres», dice [tgf_stallholder.GetFirstName], quien mantiene un puesto en el mercado de [tgf_source_county.GetNameNoTier]. Ha partido [tgf_good.Custom('GetTgfGoodUnitArticle')] [tgf_good.Custom('GetTradeGoodUnit')] de mi mercancía de [tgf_good.Custom('GetTradeGood')] en cien partes más pequeñas, y vende cada una de ellas por un poco más de su valor.\n\n«Mantened mi suministro, y seguiré pagándoos»."
 gdp_trade_good_flavor.1026.a: "[tgf_good.Custom('GetTradeGoodUnit')|U] reciente siempre que se necesite. Trato hecho."
 gdp_trade_good_flavor.1026.b: "Vendédselo por lo que puedan pagar."
 gdp_trade_good_flavor.1026.c: "Llevaos el lote ya. Dinero en mano."
 # 1027 - Market Day
 gdp_trade_good_flavor.1027.t: "Día de mercado"
 gdp_trade_good_flavor.1027.desc: "«¡[tgf_good.Custom('GetTradeGood')|U]! ¡[tgf_good.Custom('GetTgfGoodLook')|U]! ¿Quién necesita [tgf_good.Custom('GetTradeGood')]?». Hoy es día de mercado en [tgf_source_county.GetNameNoTier], y apenas se oye a mi pregonero. Todo comprador del condado reunido en un mismo lugar, con el dinero en las manos.\n\n¡Solo necesito que se lo gasten #EMP conmigo!#!"
 gdp_trade_good_flavor.1027.a: "Necesito la mejor voz. A cualquier coste."
 gdp_trade_good_flavor.1027.b: "Nada de puestos. Yo me encargaré de reunir a la multitud."
 # 1028 - Foreign Coin
 gdp_trade_good_flavor.1028.t: "Moneda extranjera"
 gdp_trade_good_flavor.1028.desc: "[tgf_buyer.GetFirstName], comprador en [tgf_source_county.GetNameNoTier], quiere mi producto, [tgf_good.Custom('GetTradeGood')], y paga en [tgf_buyer.Custom('GetCurrencyDenominationGlossPlural')]. «El dinero es dinero», dice.\n\nEl dinero es dinero, es cierto, y le digo lo que valen sus monedas para mí. Deja de sonreír."
 gdp_trade_good_flavor.1028.a: "De acuerdo. El dinero es dinero."
 gdp_trade_good_flavor.1028.b: "Mi precio, o no hay trato."
 gdp_trade_good_flavor.1028.c: "En lugar de eso, pagadme en [tgf_good_b.Custom('GetTradeGood')]."
 # 1029 - Years on the Road
 gdp_trade_good_flavor.1029.t: "Años en la carretera"
 gdp_trade_good_flavor.1029.desc: "«Durante tres años, esta carretera ha llevado vuestra mercancía de [tgf_good.Custom('GetTradeGood')]», dice mi comerciante, [tgf_trader.GetFirstName], alzando su copa. «¡Y no se ha perdido [tgf_good.Custom('GetTradeGoodUnit')] mientras yo me encargaba de ello!».\n\nHa perdido cinco. Pero esta noche, le dejaré tener la gloria."
 gdp_trade_good_flavor.1029.a: "¡Lo habéis hecho bien!"
 gdp_trade_good_flavor.1029.b: "Por los próximos tres años."
 gdp_trade_good_flavor.1029.c: "La próxima vez, más lejos. Mucho más lejos."
 # 1030 - Watching It Sell
 gdp_trade_good_flavor.1030.t: "Observar cómo se vende"
 gdp_trade_good_flavor.1030.desc: "«Eso de ahí es mercancía auténtica de los [ROOT.Char.GetHouse.GetName]: [tgf_good.Custom('GetTradeGood')]», dice un comprador en el mercado de [tgf_source_county.GetNameNoTier], señalando mis [tgf_good.Custom('GetTradeGoodUnitPlural')]. «¡[tgf_good.Custom('GetTgfGoodLook')|U]!».\n\nNo tiene ni idea de que tiene justo detrás a un miembro de la casa [ROOT.Char.GetHouse.GetName].\n\nPodría decir algo. O simplemente disfrutar de esto."
 gdp_trade_good_flavor.1030.a: "No decir nada. Escuchar qué quiere."
 gdp_trade_good_flavor.1030.b: "Por supuesto. Lo sabré yo."
 # 1031 - Outside Money
 gdp_trade_good_flavor.1031.t: "Dinero de fuera"
 gdp_trade_good_flavor.1031.desc: "[tgf_investor_a.GetFirstName] y [tgf_investor_b.GetFirstName], dos [tgf_market_holder.Custom('GetRegionalUrbanEliteTermPlural')] de [tgf_source_county.GetNameNoTier], han comprado mi mercancía de [tgf_good.Custom('GetTradeGood')] durante años. Ahora quieren una parte.\n\n«Una parte de vuestro negocio», dice [tgf_investor_a.GetFirstNameNoTooltip], mientras [tgf_investor_b.GetFirstNameNoTooltip] cuenta las monedas. «Pagamos bien, y hacemos pocas preguntas».\n\nHarán preguntas. Como siempre hacen los inversores."
 gdp_trade_good_flavor.1031.a: "Vuestra moneda, mis beneficios. Algunos de ellos."
 gdp_trade_good_flavor.1031.b: "Este negocio se queda en la familia."
 gdp_tgf_kept_in_family_unity_desc: "Se ha mantenido el negocio en la familia"
 # 1032 - The Display Room
 gdp_trade_good_flavor.1032.t: "La sala de exposición"
 gdp_trade_good_flavor.1032.desc: "«¿Eso que veo es [tgf_good.Custom('GetTradeGood')]?», pregunta todo visitante que se detiene en mi salón. Lo es: de lo mejor que tengo, [tgf_good.Custom('GetTgfGoodLook')], dispuesto donde nadie pueda perderlo de vista.\n\nNadie se marcha de mi casa sin saber lo que vendo."
 gdp_trade_good_flavor.1032.desc.livestock: "«¿Eso que veo son [tgf_good.Custom('GetTradeGood')]?», pregunta todo visitante que se detiene en mi salón, caminando a su alrededor. Lo son: de lo mejor que tengo, [tgf_good.Custom('GetTgfGoodLook')], en establos donde nadie se los pueda perder.\n\nNadie se marcha de mi casa sin saber lo que vendo. O sin mirarse los zapatos."
 gdp_trade_good_flavor.1032.a: "Que miren. Los rumores se extenderán."
 gdp_trade_good_flavor.1032.b: "Tomadlo como un obsequio."
 # 1033 - Keeping Your Hand In
 gdp_trade_good_flavor.1033.t: "Mantener una mano dentro"
 gdp_trade_good_flavor.1033.desc: "Un antiguo proveedor de [tgf_good.Custom('GetTradeGood')] me escribe: «He guardado lo mejor de este año de [tgf_good.Custom('GetTradeGood')] para vos, por el precio de siempre. ¿No volveríais a comprar?».\n\nYa había dejado ese negocio, pero mi ojo para los tratos con [tgf_good.Custom('GetTradeGood')] sigue estando afinado. Un ojo como el mío vale dinero, si lo sigo usando."
 gdp_trade_good_flavor.1033.a: "Escribirle de nuevo. Mantener mi ojo afinado."
 gdp_trade_good_flavor.1033.b: "Mi conocimiento está a la venta. Por un precio."
 gdp_trade_good_flavor.1033.c: "Dejarlo pasar. Ahora tengo otros negocios."
 # 1034 - The Itinerary
 gdp_trade_good_flavor.1034.t: "El itinerario"
 gdp_trade_good_flavor.1034.desc: "[tgf_pilgrim.GetFirstName], un[tgf_pilgrim.Custom('ES_XA')] peregrin[tgf_pilgrim.Custom('ES_OA')] alojad[tgf_pilgrim.Custom('ES_OA')] en [tgf_source_county.GetNameNoTier], manosea un viejo librillo desgastado. «Toda carretera, posada y vado entre este lugar y el mar está recogido aquí. Y en los márgenes, todo mercado que paga bien por el suministro de [tgf_good.Custom('GetTradeGood')]. Es vuestro, por un precio».\n\nHa llegado más lejos que cualquiera de mis carromatos."
 gdp_trade_good_flavor.1034.a: "Poned un precio, peregrin[tgf_pilgrim.Custom('ES_OA')]."
 gdp_trade_good_flavor.1034.b: "Lo copiaré esta noche y lo devolveré por la mañana."
 gdp_trade_good_flavor.1034.c: "Decidme lo que visteis en los mercados."
 # 1035 - Talking Shop
 gdp_trade_good_flavor.1035.t: "Conversaciones de trabajo"
 gdp_trade_good_flavor.1035.desc: "«Bueno, ¿y con qué comerciáis?», pregunta mi invitad[tgf_guest.Custom('ES_OA')], [tgf_guest.GetFirstName], en nuestro paseo tras la cena. Menudo error. Para cuando termino de explicarle cómo he levantado mi negocio de [tgf_good.Custom('GetTradeGood')] ([tgf_good.Custom('GetTgfGoodMade')]), ya hemos recorrido todo el mercado dos veces.\n\n[tgf_guest.GetSheHe|U] no ha intentado cambiar de tema ni una sola vez. Así es como se reconoce a un buen comprador."
 gdp_trade_good_flavor.1035.a: "¿Discutimos las condiciones tomando el postre?"
 gdp_trade_good_flavor.1035.b: "Ya basta de hablar de mí. ¿Dónde compráis vos?"
 gdp_trade_good_flavor.1035.c: "Dejad que os cuente cómo hice mi primera fortuna."
 # 1036 - The Packing Floor
 gdp_trade_good_flavor.1036.t: "Fase de empaquetado"
 gdp_trade_good_flavor.1036.desc: "«Un tercio más de [tgf_good.Custom('GetTradeGoodUnitPlural')] en cada carro», dice mi comerciante, [tgf_trader.GetFirstName], mostrándome cómo hacerlo. «Una parte se perderá en el camino, y los compradores se quejarán. La mayoría no».\n\n«La mayoría» es un número que me gusta. «Una parte» es un número con el que puedo vivir."
 gdp_trade_good_flavor.1036.a: "Dejad todo bien compacto. El beneficio está en los huecos."
 gdp_trade_good_flavor.1036.b: "Empaquetad todo bien. Los compradores juzgarán lo primero que abran."
 gdp_trade_good_flavor.1036.c: "Dejadlo. Hasta ahora está funcionando bien."
 # 1037 - The Market Seal
 gdp_trade_good_flavor.1037.t: "El sello del mercado"
 # Market sealers, such as the English aulnager who measured and sealed cloth - https://en.wikipedia.org/wiki/Aulnager
 TGF_SEALER_GLOSS: "El funcionario del mercado que comprobaba la calidad de los artículos y su peso y medidas reales, y estampaba un sello de cera o de plomo en aquellos que cumplían los requisitos. Muchos pueblos prohibían la venta de tela y otras mercancías que no contaban con este sello, y el funcionario cobraba una comisión por cada uno que estampaba."
 gdp_trade_good_flavor.1037.desc: "«La mercancía sellada se vende más cara. Todo el mundo lo sabe», dice [tgf_sealer.GetFirstName], [Glossary( 'sellador', 'TGF_SEALER_GLOSS' )][tgf_sealer.Custom('ES_XA')] del mercado de [tgf_source_county.GetNameNoTier], sin levantar la vista de su banco. «Y sello según el orden en que recibo el pago, no según el orden en que me lo piden».\n\nMis carros llenos de [tgf_good.Custom('GetTradeGood')] esperan al sol. Al igual que mis beneficios."
 gdp_trade_good_flavor.1037.a: "Pues esperemos. Si hay que sellar, se sellará."
 gdp_trade_good_flavor.1037.b: "Tomad. Y ahora, sellad más rápido."
 gdp_trade_good_flavor.1037.c: "Mi nombre es un sello más que suficiente."
 # 1038 - The Broker
 gdp_trade_good_flavor.1038.t: "El negociante"
 gdp_trade_good_flavor.1038.desc: "«Conozco a compradores de los que nunca habéis oído hablar, en pueblos en los que nunca habéis estado», dice [tgf_broker.GetFirstName], negociante del mercado de [tgf_source_county.GetNameNoTier], mientras me sirve una copa que no he pedido. «Vuestro negocio de [tgf_good.Custom('GetTradeGood')], su dinero, mi parte».\n\nTres partes. Y solo una de ellas bebe gratis."
 gdp_trade_good_flavor.1038.a: "Buscadlos, y os llevaréis vuestra parte."
 gdp_trade_good_flavor.1038.b: "Encontraré a mis propios compradores, gracias."
 # 1039 - The Trader's Apprentice
 gdp_trade_good_flavor.1039.t: "Aprendiz de comerciante"
 gdp_trade_good_flavor.1039.desc: "«Aquí hay alguien que cuenta más rápido que yo», dice mi comerciante [tgf_trader.GetFirstName], empujando a un[tgf_youth.Custom('ES_XA')] escuálid[tgf_youth.Custom('ES_OA')] joven llamad[tgf_youth.Custom('ES_OA')] [tgf_youth.GetFirstName] hacia delante. [tgf_youth.GetFirstNameNoTooltip] me dice los precios de mi mercancía de [tgf_good.Custom('GetTradeGood')] en nuestros dos mercados de corrido, antes de que pueda preguntar.\n\nMantener a un[tgf_youth.Custom('ES_XA')] chic[tgf_youth.Custom('ES_OA')] inteligente cuesta dinero. Pero tener a un[tgf_youth.Custom('ES_XA')] chic[tgf_youth.Custom('ES_OA')] inteligente trabajando para mí lo recupera rápido."
 gdp_trade_good_flavor.1039.a: "[tgf_youth.GetFirstNameNoTooltip] se queda conmigo."
 gdp_trade_good_flavor.1039.b: "Mantened [tgf_youth.Custom('ES_AlAla')] joven, [tgf_trader.GetFirstNameNoTooltip]. Enseñadle bien."
 gdp_trade_good_flavor.1039.c: "Ya tengo suficientes bocas que alimentar."
 gdp_tgf_family_only_unity_desc: "La compañía queda en familia."
 # 1040 - Swimming in It
 gdp_trade_good_flavor.1040.t: "Nadando entre mercancía"
 gdp_trade_good_flavor.1040.desc: "Por la noche, el almacén es todo mío. Pilas de [tgf_good.Custom('GetTgfGoodLook')] se elevan bien alto por encima de mi cabeza. Dejo que un puñado corra por mis manos, de [tgf_good.Custom('GetTgfGoodSmallest')] en [tgf_good.Custom('GetTgfGoodSmallest')].\n\nUn pensamiento me invade. ¿Y si… #EMP nadara entre esas pilas?#!"
 gdp_trade_good_flavor.1040.a: "¡Lanzarme de lleno, feliz como una perdiz!"
 gdp_trade_good_flavor.1040.a.toast: "Un aterrizaje brusco"
 gdp_trade_good_flavor.1040.b: "No. Hay que contar todo. Cada [tgf_good.Custom('GetTgfGoodSmallest')]."
 # 1041 - The First Sale
 gdp_trade_good_flavor.1041.t: "La primera venta"
 gdp_trade_good_flavor.1041.desc: "Al limpiar un antiguo arcón, encuentro algo envuelto en tela: mi primera venta, un/a [tgf_good.Custom('GetTgfGoodSmallest')] de [tgf_good.Custom('GetTradeGood')]. Volví a comprarla hace años, al doble de su precio.\n\nSin nadie para ser testigo alrededor, llevo el tesoro hacia la luz y le digo lo lejos que hemos llegado. Todas las monedas que he ganado con cada uno de sus hijos."
 gdp_trade_good_flavor.1041.a: "Hay que enmarcar esto y colgarlo donde pueda verlo."
 gdp_trade_good_flavor.1041.b: "Una reliquia de mi ascenso. Alguien pagaría por esto."
 # 1042 - Coin Under the Pillow
 gdp_trade_good_flavor.1042.t: "Monedas debajo de la almohada"
 gdp_trade_good_flavor.1042.desc: "«Buenas noches, monedas», digo cada noche, con la bolsa bajo la almohada. Todo lo que mi negocio de [tgf_good.Custom('GetTradeGood')] me ha hecho ganar esta temporada.\n\nEs la almohada más dura que he tenido nunca, y la única que vale una fortuna."
 gdp_trade_good_flavor.1042.a: "Dormir encima. Dormir encima de todo."
 gdp_trade_good_flavor.1042.b: "No sirve de nada debajo de la almohada. Compraré más [tgf_good.Custom('GetTradeGood')]."
 # 1043 - Portrait With Coins
 gdp_trade_good_flavor.1043.t: "Retratos con monedas"
 gdp_trade_good_flavor.1043.desc: "«Vos, en vuestra mesa. Con la mercancía de [tgf_good.Custom('GetTradeGood')] a un lado, y las monedas al otro», dice [tgf_painter.GetFirstName], un pintor que pasaba por [tgf_source_county.GetNameNoTier], mientras busca el encuadre con sus manos. «Que pinte toda moneda, que todo quede [Glossary( 'contado', 'TGF_MONEYLENDER_PORTRAIT_GLOSS' )]».\n\nUn[tgf_painter.Custom('ES_XA')] [tgf_painter.GetWomanMan] que sabe contar me cae bien."
 gdp_trade_good_flavor.1043.a: "Pintad. Cada moneda."
 gdp_trade_good_flavor.1043.b: "Pintad las monedas… #EMP más grandes.#!"
 gdp_trade_good_flavor.1043.c: "Un pintor no es un cliente."
 # Petrus Christus, A Goldsmith in His Shop (1449) - https://en.wikipedia.org/wiki/A_Goldsmith_in_his_Shop
 TGF_MONEYLENDER_PORTRAIT_GLOSS: "A los mercaderes y los dueños de las casas de cambio les encantaba ser retratados en el trabajo, entre sus monedas y balanzas. Petrus Christus pintó a un orfebre pesando un anillo para unos novios en 1449."
 # 1044 - A Purse Too Heavy
 gdp_trade_good_flavor.1044.t: "Una bolsa demasiado pesada"
 gdp_trade_good_flavor.1044.desc: "«¿Debería llamar a otro sirviente, [ROOT.Char.Custom('FormOfAddressForLiege')]?», me pregunta [tgf_servant.GetFirstName]. Mi bolsa, a rebosar de dinero obtenido con las ventas de [tgf_good.Custom('GetTradeGood')] esta temporada, ahora necesita su propio sirviente que la transporte detrás de mí.\n\nEstoy considerando hacerme con un carro."
 gdp_trade_good_flavor.1044.a: "Sí. Dos sirvientes. Y que caminen con lentamente."
 gdp_trade_good_flavor.1044.b: "No. Un carro. ¡Y que lleve mi nombre pintado!"
 gdp_trade_good_flavor.1044.c: "Primero, al mercado de [tgf_good.Custom('GetTradeGood')], [tgf_servant.GetFirstNameNoTooltip]."
 # 1045 - Profit and Piety
 gdp_trade_good_flavor.1045.t: "Beneficio y piedad"
 gdp_trade_good_flavor.1045.desc: "Mis libros de cuentas se inician [Glossary( 'a la antigua usanza', 'TGF_DATINI_GLOSS' )], en nombre de [ROOT.Char.GetFaith.HighGodName] y del beneficio. Este año, el beneficio ha llenado cuarenta páginas, y ni una sola de esas monedas ha ido a parar a [ROOT.Char.GetFaith.HighGodName].\n\nTodo mercader sabe que los socios merecen recibir su parte."
 gdp_trade_good_flavor.1045.a: "Que mi socio reciba una parte justa."
 gdp_trade_good_flavor.1045.b: "Una hora tranquila con [ROOT.Char.GetFaith.HighGodName], y luego, de vuelta a los libros de cuentas."
 gdp_trade_good_flavor.1045.c: "[ROOT.Char.GetFaith.HighGodName] me ha dado un don para esto. Sería de mala educación parar ahora."
 # Pharaoh's dream of the seven fat and seven lean cows, Genesis 41 and Quran 12 - https://en.wikipedia.org/wiki/Joseph_(Genesis)
 TGF_SEVEN_YEARS_GLOSS: "En la historia de José, contada en la Torá, la Biblia y el Corán, el faraón de Egipto sueña con siete vacas gordas comidas por siete escuálidas. José lo interpreta como siete años de abundancia y siete de hambruna, y llena los graneros de Egipto a tiempo."
 # Francesco Datini's ledger heading - https://en.wikipedia.org/wiki/Francesco_di_Marco_Datini
 TGF_DATINI_GLOSS: "Francesco Datini, comerciante de Prato, comenzaba sus libros de cuentas con el encabezado «En nombre de Dios y del beneficio». Murió siendo uno de los hombres más ricos de la Toscana."
 # 1046 - One of Their Own
 gdp_trade_good_flavor.1046.t: "Uno de los suyos"
 gdp_trade_good_flavor.1046.desc: "«La mitad de [tgf_source_county.GetNameNoTier] son [tgf_source_culture.GetCollectiveNoun], como yo», me cuenta mi comerciante [tgf_trader.GetFirstName]. «Las puertas que se abren para mí permanecen cerradas para vos. Los precios que bajan para mí nunca bajan para [ROOT.Char.GetCulture.GetCollectiveNoun] como vos».\n\n[tgf_trader.GetFirstNameNoTooltip] no lo dice con maldad. Decido escuchar solo la parte en la que habla de precios."
 gdp_trade_good_flavor.1046.a: "A partir de ahora, hablaréis solo vos."
 gdp_trade_good_flavor.1046.b: "Tomad. No dejéis que nadie os tiente."
 gdp_trade_good_flavor.1046.c: "Entonces, aprenderé sus costumbres."
 # 1047 - Flooded Market
 gdp_trade_good_flavor.1047.t: "Mercado abarrotado"
 gdp_trade_good_flavor.1047.desc: "[tgf_rival.GetFirstName], de la [tgf_rival.Custom('GetTgfCompanyWord')|l] [tgf_rival.GetHouse.GetBaseNameNoTooltip], está vendiendo [tgf_good.Custom('GetTradeGood')] en [tgf_source_county.GetNameNoTier] por menos de lo que cuesta llevar la mercancía allí. Mi comerciante, [tgf_trader.GetFirstName], está que trina.\n\nTengo curiosidad. Si algo está tan barato, tiene que haber alguien que lo compre. Preferiblemente, debería ser yo."
 gdp_trade_good_flavor.1047.a: "Si [tgf_rival.GetFirstNameNoTooltip] quiere regalarlo, yo lo tomaré."
 gdp_trade_good_flavor.1047.b: "Dejad que [tgf_rival.GetFirstNameNoTooltip] venda a pérdidas. Yo mantendré mi negocio de [tgf_good.Custom('GetTradeGood')]."
 # 1048 - Manuscript in a Bale
 gdp_trade_good_flavor.1048.t: "Manuscrito en un fardo"
 gdp_trade_good_flavor.1048.desc: "Alguien en [tgf_source_county.GetNameNoTier] terminó de empaquetar mi postrer [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] con páginas antiguas para controlar la humedad. Mi comerciante, [tgf_trader.GetFirstName], desenvuelve todo con cuidado. «Un [Glossary( 'libro', 'TGF_HOUSE_OF_WISDOM_GLOSS' )], o al menos la mayor parte de él. Seguro que alguien lo echa de menos».\n\nHe pagado por el cargamento de [tgf_good.Custom('GetTradeGood')]. El libro se incluía gratis, y puede que valga más."
 gdp_trade_good_flavor.1048.a: "Lo conservaré."
 gdp_trade_good_flavor.1048.b: "Venderlo con el cargamento de [tgf_good.Custom('GetTradeGood')]."
 gdp_trade_good_flavor.1048.c: "Devolverlo a [tgf_source_county.GetNameNoTierNoTooltip]."
 # Translation in Baghdad - https://en.wikipedia.org/wiki/House_of_Wisdom
 TGF_HOUSE_OF_WISDOM_GLOSS: "Los libros cruzaban las fronteras en los paquetes de los mercaderes. En la Casa de la Sabiduría de Bagdad, los eruditos traducían obras griegas, persas e indias al árabe, y muchas llegaban al latín desde allí."
 # 1049 - Merchants From Home
 gdp_trade_good_flavor.1049.t: "Mercaderes de casa"
 gdp_trade_good_flavor.1049.desc: "Mi comerciante, [tgf_trader.GetFirstName], escribe desde [tgf_source_county.GetNameNoTier]. «Hay todo un [Glossary( 'barrio', 'TGF_DIASPORA_GLOSS' )] de [ROOT.Char.GetCulture.GetCollectiveNoun] aquí, lejos de casa y echándola de menos. Todos en casa conocen el nombre de [ROOT.Char.GetHouse.GetBaseNameNoTooltip]. Cuando lo oyen aquí, se forma una multitud».\n\nLa nostalgia por el hogar, por lo que parece, es una oportunidad de negocio."
 gdp_trade_good_flavor.1049.a: "Venderles como vendemos en casa."
 gdp_trade_good_flavor.1049.b: "Que su anciano vuelva a casa y se una a mi compañía."
 gdp_trade_good_flavor.1049.c: "Merece la pena pagar por un bocado del hogar."
 # Trade diasporas - https://en.wikipedia.org/wiki/Trade_diaspora
 TGF_DIASPORA_GLOSS: "Los mercaderes que se asentaron en el extranjero construyeron barrios a su manera: los sogdianos en la Ruta de la Seda, los venecianos en Constantinopla y los comerciantes judíos desde El Cairo hasta Adén. Sus parientes en casa comerciaban a través de ellos."
 # 1050 - The Salt Road
 gdp_trade_good_flavor.1050.t: "El camino de [tgf_good.GetNameNoTooltip|l]"
 gdp_trade_good_flavor.1050.desc: "Me presentan a [tgf_smuggler.GetFirstName], [Glossary( 'contrabandista', 'TGF_SMUGGLER_GLOSS' )] de [tgf_source_county.GetNameNoTier], cuyo truco consiste en que cada [tgf_good.Custom('GetTradeGoodUnit')] en la parte superior de los carros sea lo que peor se oferta —[tgf_good.Custom('GetTgfGoodFlaw')]—, para que los recaudadores de impuestos [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l] no profundicen más.\n\n«A la mitad del precio del mercado», dice [tgf_smuggler.GetFirstNameNoTooltip]. «Debajo de cada [tgf_good.Custom('GetTradeGoodUnit')] de la parte de arriba, está perfecto»."
 gdp_trade_good_flavor.1050.a: "A la mitad de precio es mi precio favorito."
 gdp_trade_good_flavor.1050.a.toast: "La noticia se extiende"
 gdp_trade_good_flavor.1050.b: "[tgf_market_holder.Custom('ES_ElLa')|U] [tgf_market_holder.GetTitledFirstNameNoTooltip|l] estará agradecid[tgf_market_holder.Custom('ES_OA')]. Por vuestra cabeza."
 gdp_trade_good_flavor.1050.c: "¿Engañar a los recaudadores de impuestos? Os contrato."
 # Huang Chao, salt smuggler and rebel - https://en.wikipedia.org/wiki/Huang_Chao
 TGF_SMUGGLER_GLOSS: "Allí donde los gobernantes ponen impuestos a los artículos, los contrabandistas se los saltan. La sal, gravada en casi todas partes, hacía que estos fueran enormemente ricos: Huang Chao, un contrabandista de sal en la China de los Tang, lideró una rebelión que se hizo con la capital de los Tang, Chang'an."
 # 2001 - A Heavy Harvest
 gdp_trade_good_flavor.2001.t: "Una cosecha pesada"
 gdp_trade_good_flavor.2001.desc: "Me llegan noticias de [tgf_source_county.GetNameNoTier], donde compro mi mercancía de [tgf_good.Custom('GetTradeGood')]. Los campesinos de cultura [tgf_source_culture.GetName] han traído la mejor cosecha de toda una generación, y no cabe en los almacenes.\n\n"
 gdp_trade_good_flavor.2001.desc.livestock: "Me llegan noticias de [tgf_source_county.GetNameNoTier], donde compro mis rebaños de [tgf_good.Custom('GetTradeGood')]. Los pastores de cultura [tgf_source_culture.GetName] han tenido el mejor año de toda una generación. Cada corral está lleno y no hay suficiente pasto para todos.\n\n"
 gdp_trade_good_flavor.2001.desc.outro: "Su mejor año. Mi mejor precio."
 gdp_trade_good_flavor.2001.a: "Fijar el precio mientras lo celebran."
 gdp_trade_good_flavor.2001.b: "Echar un vistazo. Descubrir cómo lo han cultivado."
 gdp_trade_good_flavor.2001.b.livestock: "Echar un vistazo. Descubrir cómo los han criado."
 # 2002 - The Hunter's Haul
 gdp_trade_good_flavor.2002.t: "El botín del cazador"
 gdp_trade_good_flavor.2002.desc: "«Los [tgf_good.Custom('GetTgfGoodGatherers')] de [tgf_source_county.GetNameNoTier] se han superado a sí mismos», me cuenta mi comerciante, [tgf_trader.GetFirstName]. «La carga de [tgf_good.Custom('GetTradeGood')] de toda una temporada en un solo envío, lo mejor que han enviado nunca. Ya están llegando las ofertas».\n\n¿Venderlo todo o conservar la mejor selección? El dilema favorito de un comerciante."
 gdp_trade_good_flavor.2002.a: "Venderlo mientras el precio esté alto."
 gdp_trade_good_flavor.2002.b: "Me quedo con la mejor selección."
 gdp_trade_good_flavor.2002.c: "Inundad los puestos. Que todos reciban su parte."
 # 2003 - A Rich Vein
 gdp_trade_good_flavor.2003.t: "Una veta abundante"
 gdp_trade_good_flavor.2003.desc: "Mi comerciante, [tgf_trader.GetFirstName], llega sonriendo del camino hacia [tgf_source_county.GetNameNoTier]. «Un nuevo filón: abundante, poco profundo. Todos los mineros del condado hacen cola para trabajar en él. Hoy el comercio de [tgf_good.Custom('GetTradeGood')] será barato. Y más barato aún si invertimos en el filón».\n\nNunca he visto un filón que permanezca barato demasiado tiempo."
 gdp_trade_good_flavor.2003.desc.amber: "Mi comerciante, [tgf_trader.GetFirstName], llega sonriendo del camino hacia [tgf_source_county.GetNameNoTier]. «Las tormentas de otoño nos han arrojado más [tgf_good.Custom('GetTradeGood')] de lo que nadie puede recordar, y todas las familias de la costa han salido a recolectar. Hoy el comercio de [tgf_good.Custom('GetTradeGood')] será barato. Y más barato aún si #EMP pagamos nosotros#! a los recolectores».\n\nEl mar nunca es tan generoso durante demasiado tiempo."
 gdp_trade_good_flavor.2003.a: "Invertir en el filón."
 gdp_trade_good_flavor.2003.a.amber: "Pagar a los recolectores."
 gdp_trade_good_flavor.2003.b: "Comprad mientras los carros estén a rebosar."
 # 2004 - Trade Secrets
 gdp_trade_good_flavor.2004.t: "El secreto vale su peso en oro"
 gdp_trade_good_flavor.2004.desc: "«¡Un color nuevo!», mi comerciante, [tgf_trader.GetFirstName], ha traído una muestra todo el camino desde [tgf_source_county.GetNameNoTier], y el tintorero jura que nadie más conoce el secreto.\n\n"
 gdp_trade_good_flavor.2004.desc.ceramics: "«¡Un esmalte nuevo!», mi comerciante, [tgf_trader.GetFirstName], ha traído una muestra todo el camino desde [tgf_source_county.GetNameNoTier], y el taller jura que nadie más conoce el secreto.\n\n"
 gdp_trade_good_flavor.2004.desc.outro: "Los secretos son caros. Los secretos exclusivos valen su precio."
 gdp_trade_good_flavor.2004.a: "Poned un precio. El secreto es mío."
 gdp_trade_good_flavor.2004.b: "Admirarlo, anotarlo y continuar."
 # 2005 - A Matter of Taste
 gdp_trade_good_flavor.2005.t: "Probar la mercancía"
 gdp_trade_good_flavor.2005.desc: "Un mercader debe conocer su producto, así que pruebo mi mercancía de [tgf_good.Custom('GetTradeGood')]. Una vez por el deber, dos veces para asegurarme y una tercera vez únicamente por placer. Al caer la noche, ya no queda [tgf_good.Custom('GetTradeGoodUnit')].\n\nQué delicia. Los [tgf_source_culture.GetCollectiveNoun] pagarían el doble por esto."
 gdp_trade_good_flavor.2005.a: "El doble. Que paguen el doble."
 gdp_trade_good_flavor.2005.b: "Mmm. Lo hago solo por la calidad. Una vez más."
 # 2006 - Dress the Part
 gdp_trade_good_flavor.2006.t: "Vestirse para la ocasión"
 gdp_trade_good_flavor.2006.desc: "Si quieres vender [tgf_good.Custom('GetTradeGood')], viste [tgf_good.Custom('GetTradeGood')]. Llego al mercado ataviándome con lo mejor de mi propio inventario, y observo cómo los compradores me miran una y otra vez.\n\nLos artículos hablan por mí. Yo solo los luzco."
 gdp_trade_good_flavor.2006.a: "Sienta bien. Se queda."
 gdp_trade_good_flavor.2006.a.tt_furs: "Llevas tu abrigo de pieles a partir de ahora"
 gdp_trade_good_flavor.2006.a.tt_leather: "Llevas tu abrigo de cuero a partir de ahora"
 gdp_trade_good_flavor.2006.a.tt_silk: "Llevas tu manto de seda a partir de ahora"
 gdp_trade_good_flavor.2006.a.tt_textiles: "Llevas tu mejor capa a partir de ahora"
 gdp_trade_good_flavor.2006.b: "Que la mercancía hable por mí."
 # 2007 - Face Value
 gdp_trade_good_flavor.2007.t: "El valor de un rostro"
 gdp_trade_good_flavor.2007.desc: "«Estamparé mi cara en [tgf_market_holder.Custom('GetCurrencyDenominationGlossPlural')] de nueva acuñación», me dice [tgf_market_holder.Custom('ES_ElLa')] [tgf_market_holder.GetTitledFirstName|l], «y necesitaré tu mercancía de [tgf_good.Custom('GetTradeGood')]. Quiero un suministro constante, a precio de amigo».\n\nSu cara, mi metal, una moneda. La historia nos recordará."
 gdp_trade_good_flavor.2007.a: "¡A precio de amigo! Venga, fabricad la primera."
 gdp_trade_good_flavor.2007.b: "Al precio real. El dinero es dinero."
 gdp_trade_good_flavor.2007.c: "¿A precio de amigo? Tengo mejores cosas que hacer."
 # 2008 - Intact
 gdp_trade_good_flavor.2008.t: "Intacto"
 gdp_trade_good_flavor.2008.desc: "«No hemos registrado ni una sola pérdida de [tgf_good.Custom('GetTradeGoodUnit')]», me dice mi comerciante, [tgf_trader.GetFirstName], con satisfacción. «No hemos desperdiciado nada, nada se ha roto, ni lo han robado. Cada [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] ha llegado como partió».\n\nEso no es suerte. Es habilidad, y la habilidad se enseña."
 gdp_trade_good_flavor.2008.a: "Mostradme cómo lo habéis empaquetado."
 gdp_trade_good_flavor.2008.b: "Unas manos cuidadosas. Impresionante."
 gdp_trade_good_flavor.2008.c: "Decídselo a los compradores. Los artículos enteros se venden más caros."
 # 2009 - Other Men See Armies
 gdp_trade_good_flavor.2009.t: "Donde otr[ROOT.Char.Custom('ES_OA')]s [ROOT.Char.Custom('WomenMen')] ven ejércitos"
 gdp_trade_good_flavor.2009.desc: "La guerra ha llegado [tgf_market_holder.Custom('ES_AlAla')] [tgf_market_holder.GetTitledFirstName|l], y la guerra come [tgf_good.Custom('GetTradeGood')]. Sus intendentes compran todo lo que mi ruta puede transportar, y preguntan cuándo llega más.\n\nDonde otr[ROOT.Char.Custom('ES_OA')]s [ROOT.Char.Custom('WomenMen')] ven ejércitos, yo veo clientes."
 gdp_trade_good_flavor.2009.a: "La guerra paga por adelantado."
 gdp_trade_good_flavor.2009.b: "Los privilegios, por escrito, ya."
 gdp_trade_good_flavor.2009.c: "Recordad quién os armó."
 # 2010 - The Guild Knocks
 gdp_trade_good_flavor.2010.t: "El gremio toca a la puerta"
 gdp_trade_good_flavor.2010.desc: "El gremio de [tgf_source_county.GetNameNoTier], de cultura [tgf_source_culture.GetName], me ha escrito una carta muy educada. Mis precios bajos están reduciendo sus beneficios, y solicitan acordar un precio juntos, antes de que alguien salga mal parado.\n\nLos gremios piden las cosas con cortesía, pero solo lo hacen una vez."
 gdp_trade_good_flavor.2010.a: "Que paguen la tarifa. Fijad un precio."
 gdp_trade_good_flavor.2010.b: "Que lo pidan por las malas."
 # 2011 - Rulers Set Fashions
 gdp_trade_good_flavor.2011.t: "Los gobernantes establecen las modas"
 gdp_trade_good_flavor.2011.desc: "La palabra viaja más rápido que los carros: [tgf_market_holder.Custom('ES_ElLa')] [tgf_market_holder.GetTitledFirstName|l] llevó mi producto, [tgf_good.Custom('GetTradeGood')], ante toda su corte en [tgf_source_county.GetNameNoTier], y la mitad de los cortesanos le preguntaron de dónde procedía.\n\nLos gobernantes marcan las tendencias. Los mercaderes, los precios."
 gdp_trade_good_flavor.2011.a: "Decidles a todos quién le ha dado esa maravilla de [tgf_good.Custom('GetTradeGood')]."
 gdp_trade_good_flavor.2011.b: "Subir el precio mientras están mirando."
 # 2012 - Sample the Goods
 gdp_trade_good_flavor.2012.t: "Catar el producto"
 gdp_trade_good_flavor.2012.desc: "[tgf_good.Custom('GetTradeGoodUnitPlural')|U] de [tgf_good.Custom('GetTradeGood')] me devuelven la mirada. Ha sido un mes flojo, mi cabeza no descansa, y me rodea la mejor bebida que el dinero puede comprar.\n\nUn control de calidad. Nadie tiene que saberlo."
 gdp_trade_good_flavor.2012.a: "Control de calidad. De todo."
 gdp_trade_good_flavor.2012.a.toast: "Una prueba de más"
 gdp_trade_good_flavor.2012.b: "No. El inventario se respeta."
 # 2013 - A Masterwork Order
 gdp_trade_good_flavor.2013.t: "El encargo de una obra maestra"
 gdp_trade_good_flavor.2013.desc: "«Dadme vuestro mejor género de [tgf_good.Custom('GetTradeGood')] y la tarifa de un[tgf_crafter.Custom('ES_XA')] maestr[tgf_crafter.Custom('ES_OA')]», dice [tgf_crafter.GetFirstName], [tgf_crafter.Custom('ES_ElLa')] mejor [tgf_good.Custom('GetTgfGoodCrafter')] de [tgf_source_county.GetNameNoTier], «y os crearé algo que nunca ha visto nadie hasta ahora».\n\nMi bolsa lo está considerando. Mi orgullo ya está de acuerdo."
 gdp_trade_good_flavor.2013.a: "Acepto la tarifa. Sorprendedme."
 gdp_trade_good_flavor.2013.b: "Mis artículos no necesitan adornos."
 # 2014 - Their Dish, Our Good
 gdp_trade_good_flavor.2014.t: "Su plato, nuestros productos"
 gdp_trade_good_flavor.2014.desc: "«Ahora echan [tgf_good.Custom('GetTradeGood')] a sus platos de [tgf_source_province.Custom('GetTgfLocalDish')]», dice mi comerciante, [tgf_trader.GetFirstName]. «Todos en [tgf_source_county.GetNameNoTier] lo hacen. Los cocineros dicen que es una nueva costumbre, y ya nadie se acuerda cómo se hacía antes».\n\nYo ni siquiera he probado ese plato de [tgf_source_province.Custom('GetTgfLocalDish')], pero nunca había sentido tanto orgullo."
 gdp_trade_good_flavor.2014.a: "Pues que paguen por las nuevas costumbres."
 gdp_trade_good_flavor.2014.b: "Más carros. Los cocineros tienen hambre."
 # 2015 - Paid in Goods
 gdp_trade_good_flavor.2015.t: "Pagado en artículos"
 gdp_trade_good_flavor.2015.desc: "«Queremos más dinero», dice [tgf_spokesperson.GetFirstName], hablando en nombre de los [tgf_good.Custom('GetTgfGoodGatherers')] de [tgf_source_county.GetNameNoTier]. Les ofrezco mi producto, [tgf_good.Custom('GetTradeGood')], en lugar de ello.\n\n«Vosotros lo recogéis», señalo. «¡Seguro que os gusta!».\n\nNo les gusta para nada."
 gdp_trade_good_flavor.2015.a: "Pagarles. Con dinero."
 gdp_trade_good_flavor.2015.b: "Darles una parte de los beneficios."
 gdp_trade_good_flavor.2015.c: "Los artículos también son un salario."
 # 2016 - Money Doesn't Stink
 gdp_trade_good_flavor.2016.t: "El dinero no huele"
 gdp_trade_good_flavor.2016.desc: "«Sí huele», dice un comprador en [tgf_source_county.GetNameNoTier], sosteniendo [tgf_good.Custom('GetTradeGood')] de mi negocio con el brazo bien extendido. [tgf_good.Custom('GetTgfGoodFlaw')|U], según me dicen.\n\nCojo las monedas del comprador y las huelo. [Glossary( 'No huele a nada', 'TGF_PECUNIA_NON_OLET_GLOSS' )]."
 gdp_trade_good_flavor.2016.a: "Vender a compradores con la nariz taponada."
 gdp_trade_good_flavor.2016.b: "¿Quizá exista algún remedio para el olor?"
 gdp_trade_good_flavor.2016.c: "Mantener el dinero debajo de mi nariz. Todo el día."
 # Pecunia non olet - https://en.wikipedia.org/wiki/Pecunia_non_olet
 TGF_PECUNIA_NON_OLET_GLOSS: "#G Pecunia non olet#!, «el dinero no huele». Se dice que, para dejarlo claro, el emperador romano Vespasiano sostuvo una moneda procedente de los impuestos sobre los urinarios públicos debajo de la nariz de su hijo."
 # 2017 - Seven Fat Years
 gdp_trade_good_flavor.2017.t: "Siete años de abundancia"
 gdp_trade_good_flavor.2017.desc: "Sueño con siete años de vacas gordas y siete años de vacas flacas[ROOT.Char.GetFaith.Custom('GetTgfSevenYearsRef')]. Me despierto y hago los cálculos antes del desayuno.\n\nCuesten lo que cuesten esos años de escasez, mi negocio de [tgf_good.Custom('GetTradeGood')] lo compensará con más ingresos."
 gdp_trade_good_flavor.2017.a: "Guardad todo. Cada [tgf_good.Custom('GetTradeGoodUnit')]."
 gdp_trade_good_flavor.2017.b: "Comprar más ahora que es barato."
 gdp_trade_good_flavor.2017.c: "Las vacas no son libros de cuentas. Vuelve a dormirte."
 # 2018 - Somebody's Cattle
 gdp_trade_good_flavor.2018.t: "El ganado ajeno"
 gdp_trade_good_flavor.2018.desc: "Salgo para encontrar mi puerta bloqueada por todo un grupo de [tgf_good.Custom('GetTradeGood')], y mi comerciante, [tgf_trader.GetFirstName], sonriendo en medio. «[tgf_raider.GetFirstName], un[tgf_raider.Custom('ES_XA')] [Glossary( 'asaltante', 'TGF_CATTLE_RAID_GLOSS' )], los ha traído de los pastos [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l]. No preguntéis cómo. Por la mitad del precio del mercado».\n\nLlevan la marca de [tgf_market_holder.GetFirstNameNoTooltip] en cada costado.\n\n«Esas marcas…», añade [tgf_trader.GetFirstNameNoTooltip], «se pueden cambiar»."
 gdp_trade_good_flavor.2018.a: "Es una ganga, da igual la marca que lleven."
 gdp_trade_good_flavor.2018.a.toast: "Alguien reconoce la marca"
 rival_tgf_bought_stolen_herd: "[TARGET_CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.LocalPlayerString( 'has', 'ha' )] comprado a sabiendas bestias robadas del ganado de [CHARACTER.LocalPlayerString( 'tu personaje', CHARACTER.GetShortUIName )]."
 rival_tgf_bought_stolen_herd_corresponding: "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'has', 'ha' )] comprado a sabiendas bestias robadas del ganado de [TARGET_CHARACTER.LocalPlayerString( 'tu personaje', TARGET_CHARACTER.GetShortUIName )]."
 gdp_trade_good_flavor.2018.b: "[tgf_market_holder.Custom('ES_ElLa')|U] [tgf_market_holder.GetTitledFirstNameNoTooltip|l] me las pagará por esto."
 gdp_trade_good_flavor.2018.c: "Sacrificadlas, rápido."
 # The Cattle Raid of Cooley - https://en.wikipedia.org/wiki/T%C3%A1in_B%C3%B3_C%C3%BAailnge
 TGF_CATTLE_RAID_GLOSS: "Asaltar el ganado de un vecino era una antigua costumbre y un asunto muy serio. La gran épica irlandesa Táin Bó Cúailnge habla de una guerra provocada por un simple toro."
 # 2019 - A Dry Court's Thirst
 gdp_trade_good_flavor.2019.t: "Una corte sedienta"
 gdp_trade_good_flavor.2019.desc: "«La corte [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l] nunca bebe [tgf_good.Custom('GetTradeGood')]», me cuenta mi comerciante, [tgf_trader.GetFirstName]. «Pero la corte [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstNameNoTooltip|l] ha pedido cuarenta [tgf_good.Custom('GetTradeGoodUnitPlural')] de nuestro producto. Ambas cosas son ciertas, por lo visto».\n\nLa fe de [tgf_market_holder.GetFirstNameNoTooltip] [Glossary( 'prohíbe beber', 'TGF_ABU_NUWAS_GLOSS' )]. Pero nada prohíbe un sobreprecio."
 gdp_trade_good_flavor.2019.a: "Etiquetad los barriles como vinagre."
 gdp_trade_good_flavor.2019.b: "Duplicad el precio. ¿A quién se van a quejar?"
 gdp_trade_good_flavor.2019.b.toast: "Otro proveedor"
 gdp_trade_good_flavor.2019.b.toast_good: "El precio íntegro"
 gdp_trade_good_flavor.2019.c: "No merece la pena que me juegue el cuello. Vended en otra parte."
 # Abu Nuwas, wine poet at the Abbasid court - https://en.wikipedia.org/wiki/Abu_Nuwas
 TGF_ABU_NUWAS_GLOSS: "El vino, prohibido en muchas cortes, era muy apreciado en la mayoría de ellas. Abu Nuwas, poeta en la corte del califa Harún al-Rashid, escribió algunos de los mejores poemas sobre el vino en árabe."
 # 3001 - A Perfect Wheel
 gdp_trade_good_flavor.3001.t: "Una rueda perfecta"
 gdp_trade_good_flavor.3001.desc: "Ya me llega el olor desde el almacén antes de verlo. Una rueda de queso tan madura y deliciosa que hasta los transportistas le han puesto un guardia, medio en broma, medio en serio.\n\nSi la vendo, tendré dinero para pagar un festín. Si la guardo, haré yo el festín con ella."
 gdp_trade_good_flavor.3001.a: "Protegedla con vuestra vida."
 gdp_trade_good_flavor.3001.b: "Todo tiene un precio. Hasta la perfección."
 # 3002 - A Famous Complaint
 gdp_trade_good_flavor.3002.t: "Una famosa queja"
 # The complaint tablet to Ea-nasir, c. 1750 BC - https://en.wikipedia.org/wiki/Complaint_tablet_to_Ea-nasir
 TGF_EA_NASIR_GLOSS: "La queja más antigua de un cliente que se conoce: una tablilla de arcilla de Ur, con casi tres mil años de antigüedad ya, en la que un tal Nanni reprende al comerciante Ea-nasir por entregar lingotes de cobre de mala calidad y tratar a su mensajero con desprecio."
 gdp_trade_good_flavor.3002.desc: "[tgf_market_holder.Custom('ES_ElLa')|U] [tgf_market_holder.GetTitledFirstName|l] ha escrito que mi cobre es de mala calidad y que mis lingotes son demasiado ligeros. Y es verdad.\n\n«¿Por quién me tomáis, que me tratáis con semejante [Glossary( 'desprecio', 'TGF_EA_NASIR_GLOSS' )]?».\n\nL[tgf_market_holder.Custom('ES_OA')] tenía por un[tgf_market_holder.Custom('ES_XA')] buen[tgf_market_holder.Custom('ES_XA')] client[tgf_market_holder.Custom('ES_EA')]. Y ya ha pagado."
 gdp_trade_good_flavor.3002.a: "[tgf_market_holder.GetSheHe|U] comprará de nuevo. Siempre lo hace."
 gdp_trade_good_flavor.3002.a.toast: "Nunca más"
 gdp_trade_good_flavor.3002.a.toast_good: "Otra vez a por más"
 gdp_trade_good_flavor.3002.b: "Mi cobre es auténtico. ¡Que lo compruebe!"
 gdp_trade_good_flavor.3002.b.toast_bad: "Con las manos en la masa"
 gdp_trade_good_flavor.3002.b.toast_good: "La prueba tiene éxito"
 rival_tgf_light_ingots: "[TARGET_CHARACTER.GetShortUIName|U] [TARGET_CHARACTER.LocalPlayerString( 'le vendiste', 'le vendió' )] lingotes más ligeros de lo normal a [CHARACTER.LocalPlayerString( 'tu personaje', CHARACTER.GetShortUIName )], jurando que eran auténticos."
 rival_tgf_light_ingots_corresponding: "[CHARACTER.GetShortUIName|U] [CHARACTER.LocalPlayerString( 'le vendiste', 'le vendió' )] lingotes más ligeros de lo normal a [TARGET_CHARACTER.LocalPlayerString( 'tu personaje', TARGET_CHARACTER.GetShortUIName )], jurando que eran auténticos."
 gdp_trade_good_flavor.3002.c: "Mis disculpas, los lingotes serán mejores la próxima vez."
 # 3003 - Rent in Pepper
 gdp_trade_good_flavor.3003.t: "Pagar con pimienta"
 # Peppercorn rents in medieval England - https://en.wikipedia.org/wiki/Peppercorn_(law)
 TGF_PEPPER_GLOSS: "La pimienta casi valía su peso en plata, y a menudo se aceptaba como pago. En Londres, las leyes del rey Etelredo, en torno al año 1000, fijaban que parte del canon de los mercaderes alemanes debía pagarse en pimienta."
 gdp_trade_good_flavor.3003.desc: "A un[tgf_debtor.Custom('ES_OA)] de mis deudores en [tgf_source_county.GetNameNoTier], [tgf_debtor.GetFirstName], no le queda más dinero, así que en lugar de eso me paga en [Glossary( 'pimienta', 'TGF_PEPPER_GLOSS' )], [tgf_good.Custom('GetTradeGoodUnit')] a [tgf_good.Custom('GetTradeGoodUnit')], hasta que mi mesa huele como un pequeño mercado de especias.\n\nLa cuento dos veces. El precio no está mal. Y [tgf_debtor.GetFirstNameNoTooltip] no será [tgf_debtor.Custom('ES_ElLa')] únic[tgf_debtor.Custom('ES_OA)]."
 gdp_trade_good_flavor.3003.a: "En ese caso, aceptaré la pimienta."
 gdp_trade_good_flavor.3003.b: "Monedas. Reunidlas como sea."
 gdp_trade_good_flavor.3003.c: "Trabajad para mí. La deuda puede esperar."
 # 3004 - A Letter Full of Complaints
 gdp_trade_good_flavor.3004.t: "Una carta llena de quejas"
 # The Cairo Geniza merchant letters, famously full of flax grievances - https://en.wikipedia.org/wiki/Cairo_Geniza
 TGF_GENIZA_GLOSS: "Cartas de mercaderes acumuladas durante siglos, como las que se conservan en la guenizá del Cairo, un almacén de documentos descartados de la sinagoga, registran el comercio por el Mediterráneo con gran detalle, todo envuelto de quejas. Los mercaderes de lino son los que más protestan."
 gdp_trade_good_flavor.3004.desc: "Mi comerciante, [tgf_trader.GetFirstName], ha vendido todo fardo de mi lino en [tgf_source_county.GetNameNoTier] a un buen precio. Su [Glossary( 'carta', 'TGF_GENIZA_GLOSS' )] dice eso, en una sola línea. El resto del documento es una ristra de cuarenta líneas con quejas sobre la humedad, los transportistas, los compradores, el empaquetado…\n\nEl beneficio va primero, las quejas después. Me preocuparía si fuera a la inversa."
 gdp_trade_good_flavor.3004.a: "Una sola línea hablando de beneficios. La leo otra vez."
 gdp_trade_good_flavor.3004.b: "Cuarenta líneas de consejos gratis."
 # 3005 - A Subtlety
 gdp_trade_good_flavor.3005.t: "Una sutileza"
 # Sugar sculptures served between feast courses - https://en.wikipedia.org/wiki/Sugar_sculpture
 TGF_SUBTLETY_GLOSS: "Una obra de arte de azúcar y pasta de almendra que se servía entre plato y plato de un banquete, con castillos, barcos y bestias esculpidas para deleite de los invitados. Las mayores sutilezas eran, como los postres, grandes declaraciones políticas."
 gdp_trade_good_flavor.3005.desc: "«[tgf_market_holder.Custom('ES_ElLa')|U] [tgf_market_holder.GetTitledFirstName|l] quiere comer [ROOT.Char.Custom('GetRandomRegionalBird')] de azúcar», me dice mi comerciante [tgf_trader.GetFirstName]. «El doble de su tamaño real y con cada pluma esculpida en detalle, y lo quiere en su mesa antes del solsticio de verano. Una [Glossary( 'sutileza', 'TGF_SUBTLETY_GLOSS' )] para coronar su festín».\n\nEl azúcar se derrite. La reputación se mantiene."
 gdp_trade_good_flavor.3005.a: "Lo haré. Y será inmenso."
 gdp_trade_good_flavor.3005.a.success: "Todo el banquete se queda mudo"
 gdp_trade_good_flavor.3005.a.failure: "Un pajarito asimétrico"
 gdp_trade_good_flavor.3005.b: "Precios dignos de las delicias de un festín."
 gdp_trade_good_flavor.3005.c: "Vendo azúcar, no esculturas."
 # 3006 - The Swarm
 gdp_trade_good_flavor.3006.t: "El enjambre"
 gdp_trade_good_flavor.3006.desc: "Las abejas llegaron sin que nadie las invitara, construyeron su panal entre las vigas y ahora producen miel en mi almacén, sin pagar un alquiler.\n\nEstos nuevos inquilinos pagarán con miel. Hay tratos peores… si no tenemos en cuenta los picotazos."
 gdp_trade_good_flavor.3006.a: "Miel gratis. ¿Qué podría costar?"
 gdp_trade_good_flavor.3006.a.toast: "¡Me han picado!"
 gdp_trade_good_flavor.3006.b: "Que trabajen gratis a cambio de vivir aquí."
 # 3007 - Another Pot of Tea
 gdp_trade_good_flavor.3007.t: "Otra tetera"
 gdp_trade_good_flavor.3007.desc: "Una taza mientras reviso la mercancía. Otra, porque la primera hizo efecto. A medianoche, ya he vuelto a contar por segunda vez tres libros de cuentas y he redactado dos cartas, y me siento genial.\n\nO se trata de un cargamento muy bueno, o tengo un hábito que me está saliendo caro."
 gdp_trade_good_flavor.3007.a: "Otra tetera. Todas las mañanas."
 gdp_trade_good_flavor.3007.b: "Servidlo a toda la compañía."
 # 3008 - Before It Turns
 gdp_trade_good_flavor.3008.t: "Antes de que cambie"
 gdp_trade_good_flavor.3008.desc: "Mi comerciante, [tgf_trader.GetFirstName], abre mi [tgf_good.Custom('GetTradeGoodUnit')] de [tgf_good.Custom('GetTradeGood')] y hace una mueca. «La niebla del río se ha metido dentro. Ya está blanda. Y a finales de la semana, le habrá salido moho».\n\nLa fruta seca se mantiene durante años. La mojada, durante días. El tiempo es dinero."
 gdp_trade_good_flavor.3008.a: "Volved a secarla, y hacedlo bien."
 gdp_trade_good_flavor.3008.b: "Dejad que fermente y llamadla vino."
 # 3009 - The Midnight Oil
 gdp_trade_good_flavor.3009.t: "Trabajando hasta tarde"
 gdp_trade_good_flavor.3009.desc: "El aceite de la lámpara se agota una hora antes de que termine con los libros de cuentas, así que quemo mi propio inventario de [tgf_good.Custom('GetTradeGood')] de buena calidad que esperaba vender. No brilla más que los turbios restos que tiramos.\n\nNo brilla más, pero los compradores siguen pagando tres veces más por ello."
 gdp_trade_good_flavor.3009.a: "Vender los posos para las lámparas, y el aceite bueno para las mesas."
 gdp_trade_good_flavor.3009.b: "Quemadlo. Las cuentas van primero."
 gdp_trade_good_flavor.3009.c: "A la cama. El aceite también puede descansar."
 # 3010 - In the Blade
 gdp_trade_good_flavor.3010.t: "Aún en pie"
 # Buying grain "in the blade", condemned as usury by medieval canon law - https://en.wikipedia.org/wiki/Usury#Middle_Ages
 TGF_IN_THE_BLADE_GLOSS: "El grano que se compraba «aún en pie» se pagaba mientras aún estaba verde en el campo, a un precio mucho más bajo de lo que podía alcanzar tras la cosecha. Los predicadores y canonistas condenaron la práctica como usura encubierta."
 gdp_trade_good_flavor.3010.desc.condemned: "Mi fe lo llama usura. Mis libros de cuentas lo llaman descuento."
 gdp_trade_good_flavor.3010.desc.permitted: "Algunas fes lo llaman usura. La mía lo llama anticiparse."
 gdp_trade_good_flavor.3010.desc.intro: "«Está verde ahora, pero en verano será dorado», me dice [tgf_peasant.GetFirstName] de [tgf_source_county.GetNameNoTier], con el barro llegándole hasta las rodillas. «Pagadme por el valor que tiene hoy, [Glossary( 'aún en pie', 'TGF_IN_THE_BLADE_GLOSS' )], y la cosecha será vuestra».\n\n"
 gdp_trade_good_flavor.3010.a: "La cosecha del próximo año al precio de este."
 gdp_trade_good_flavor.3010.b: "Conservad el cultivo hasta que crezca."
 # 3011 - Ten-Year Millet
 gdp_trade_good_flavor.3011.t: "Mijo de hace diez años"
 gdp_trade_good_flavor.3011.desc: "Tras el inventario más reciente, encuentro [tgf_good.Custom('GetTradeGoodUnitPlural')] de mijo de hace años, olvidado y sin contar. Los granos se conservan aún en buenas condiciones. El mijo aguanta.\n\nSuministros gratis de mi yo del pasado. La mejor herencia posible."
 gdp_trade_good_flavor.3011.a: "Venderlo. Es lo que querría mi yo del pasado."
 gdp_trade_good_flavor.3011.b: "Empaquetarlo para el camino. El mijo aguanta."
 gdp_trade_good_flavor.3011.c: "Volver a contar todo lo almacenado."
 # 3012 - Polished or Not
 gdp_trade_good_flavor.3012.t: "Pulido o no"
 gdp_trade_good_flavor.3012.desc: "El arroz pulido es blanco, ligero y muy codiciado en las mesas más pudientes. El arroz sin pulir es pesado, marrón y común en cualquier mesa. Mi comerciante, [tgf_trader.GetFirstName], quiere saber qué clase de mercader soy.\n\nSoy la clase de mercader a la que le gusta que le paguen."
 gdp_trade_good_flavor.3012.a: "Pulidlo. Las mesas adineradas pagarán bien."
 gdp_trade_good_flavor.3012.b: "Vended el arroz marrón y barato a todo el mundo."
 gdp_trade_good_flavor.3012.c: "Pulid el mejor. Vended el resto de color marrón."
 # 3013 - Before the Fast
 gdp_trade_good_flavor.3013.t: "Antes de ayunar"
 gdp_trade_good_flavor.3013.desc: "«¡El periodo de [tgf_source_faith.Custom('GetTgfFastName')] comenzará pronto!», me escribe mi comerciante, [tgf_trader.GetFirstName], de forma apresurada desde [tgf_source_county.GetNameNoTier]. «Nadie tocará la carne durante semanas. Y cuando esto pase, nadie querrá otra cosa».\n\nUn comprador hambriento nunca regatea."
 gdp_trade_good_flavor.3013.desc_ramadan: "«¡El Ramadán comenzará pronto!», me escribe mi comerciante, [tgf_trader.GetFirstName], de forma apresurada desde [tgf_source_county.GetNameNoTier]. «Nadie comerá hasta que se ponga el sol. Y cuando esto suceda, nadie comerá otra cosa que no sea carne».\n\nUn comprador hambriento nunca regatea."
 gdp_trade_good_flavor.3013.a: "Yo también mantendré el ayuno. La carne puede esperar."
 gdp_trade_good_flavor.3013.b: "Saladla, y esperad a que aparezca el hambre."
 gdp_trade_good_flavor.3013.c: "Vendedla toda en un último festín antes del ayuno."
 # 3014 - Look It in the Mouth
 gdp_trade_good_flavor.3014.t: "A caballo regalado…"
 gdp_trade_good_flavor.3014.desc: "[tgf_dealer.GetFirstName|U], comerciante de caballos, jura por todo lo sagrado: «Cuatro años, amig[ROOT.Char.Custom('ES_OA')], cinco como mucho. ¡Mirad qué pelaje!». El pelaje está muy bien, pero me doy cuenta de que está intentando que no le vea los dientes.\n\nHay un dicho sobre los caballos regalados. Este no es ningún regalo."
 gdp_trade_good_flavor.3014.a: "Abridle la boca de par en par. Veamos esos dientes."
 gdp_trade_good_flavor.3014.b: "Viejo o no, me lo quedo."
 gdp_trade_good_flavor.3014.c: "Se os da bien vender. Uníos a mi compañía."
 # 3015 - Fatten for Market
 gdp_trade_good_flavor.3015.t: "Engordados para el mercado"
 gdp_trade_good_flavor.3015.desc: "«El ganado llegó a [tgf_source_county.GetNameNoTier] escuálido y agotado, como si fueran fantasmas», me dice mi comerciante, [tgf_trader.GetFirstName]. «[tgf_market_holder.Custom('ES_ElLa')|U] [tgf_market_holder.GetTitledFirstName|l] tiene una buena zona de pasto cerca, y nos la ofrece. Por un precio, claro».\n\nLa grasa vende. Y la hierba es más barata que la grasa."
 gdp_trade_good_flavor.3015.a: "Pagar por la hierba. Vender la grasa."
 gdp_trade_good_flavor.3015.b: "Las bestias flacas siguen teniendo valor."
 # 3016 - Calfskin for the Scribes
 gdp_trade_good_flavor.3016.t: "Cuero de ternero para los escribas"
 gdp_trade_good_flavor.3016.desc: "[tgf_chaplain.Custom('ES_ElLa')|U] [tgf_chaplain.GetTitledFirstName|l], capellán [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l], camina hasta mi curtiduría como un peregrino eligiendo reliquias. «Este cuero tan fino podría portar la palabra sagrada durante miles de años», dice.\n\nUn cuero que dura miles de años. No está mal para una vaca."
 gdp_trade_good_flavor.3016.a: "Coged los mejores, como regalo."
 gdp_trade_good_flavor.3016.b: "Para los escribas, entonces. Que les dure."
 gdp_trade_good_flavor.3016.c: "Prefiero venderlo a los zapateros."
 # 3017 - Buying the Clip
 gdp_trade_good_flavor.3017.t: "Comprar la esquila"
 # Cistercian abbeys selling their wool clip years in advance to Italian and Flemish merchants - https://en.wikipedia.org/wiki/Cistercians
 TGF_WOOL_CLIP_GLOSS: "Las abadías cistercienses vendían su esquila de lana anual a los mercaderes italianos y flamencos con años de antelación, recibiendo dinero por un vellón que aún no había crecido. Muchas casas se endeudaron enormemente por ello."
 gdp_trade_good_flavor.3017.desc: "«[tgf_abbot.Custom('ES_ElLa')|U] [tgf_abbot.GetTitledFirstName|l] nos ofrece la lana de [tgf_abbey.GetNameNoTier] para los próximos años», me dice mi comerciante, [tgf_trader.GetFirstName]. «[Glossary( 'Años de esquila', 'TGF_WOOL_CLIP_GLOSS' )], pagados ahora, que se entregarán vellón a vellón. Quieren el dinero hoy».\n\nPlanifican por adelantado, al igual que los mercaderes."
 gdp_trade_good_flavor.3017.a: "Dinero ahora, lana durante años."
 gdp_trade_good_flavor.3017.b: "Prefiero que mis ovejas ya estén esquiladas."
 # 3018 - The Vegetable Lamb
 gdp_trade_good_flavor.3018.t: "El cordero vegetal"
 # The Vegetable Lamb of Tartary, a medieval legend explaining cotton - https://en.wikipedia.org/wiki/Vegetable_Lamb_of_Tartary
 TGF_VEGETABLE_LAMB_GLOSS: "Eruditos y viajeros cuentan una leyenda: en el lejano Oriente crece una planta que alberga corderos vivos en sus tallos, los cuales pastan la tierra a su alrededor hasta que el pie se marchita. Es una manera de explicar el origen del algodón, una lana que crece en las plantas."
 gdp_trade_good_flavor.3018.desc: "[tgf_buyer.GetFirstName|U], un[tgf_buyer.Custom('ES_XA')] comprador[tgf_buyer.Custom('ES_XA')] de [tgf_source_county.GetNameNoTier], le da la vuelta a un copo de mi algodón con curiosidad. «¿Es cierto? Dicen que sale de una planta que alberga corderos en su interior, que pastan alrededor hasta que el pie se seca».\n\n[Glossary( 'El cordero vegetal', 'TGF_VEGETABLE_LAMB_GLOSS' )]. Los milagros se venden bien."
 gdp_trade_good_flavor.3018.a: "Es cierto, palabra por palabra. Y muy infrecuente."
 gdp_trade_good_flavor.3018.b: "No hay corderos. Solo es una planta algodonosa."
 # 3019 - Spolia
 gdp_trade_good_flavor.3019.t: "Spolia"
 # Reuse of ancient building stone - https://en.wikipedia.org/wiki/Spolia
 TGF_SPOLIA_GLOSS: "La piedra que se sacaba de los edificios antiguos y se volvía a usar en los nuevos. Columnas, tallas y bloques con inscripciones de ruinas antiguas acabaron en iglesias, murallas y casas por todo el mundo medieval."
 gdp_trade_good_flavor.3019.desc: "«Los hombres de la cantera han dejado de trabajar», confiesa mi comerciante, [tgf_trader.GetFirstName], en una carta desde [tgf_source_county.GetNameNoTier]. «En su lugar, están sacando el material de ruinas antiguas: columnas, tallas, lo que sea».\n\n[Glossary( 'Spolia', 'TGF_SPOLIA_GLOSS' )]. Piedra antigua, precio nuevo."
 gdp_trade_good_flavor.3019.a: "Piedra antigua, a precios de antaño."
 gdp_trade_good_flavor.3019.b: "Guardad las mejores tallas para mí."
 # 3020 - The Mast Trunk
 gdp_trade_good_flavor.3020.t: "El tronco del mástil"
 gdp_trade_good_flavor.3020.desc: "«Los constructores navales [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l] quieren todo nuestro suministro de [tgf_good.Custom('GetTradeGood')]», me dice mi comerciante [tgf_trader.GetFirstName]. «Y no les vale cualquier madera. Solo quieren los troncos más largos y rectos para hacer mástiles. Saben que la madera perfecta es poco común».\n\nLas cosas poco comunes nunca se deberían vender con prisa."
 gdp_trade_good_flavor.3020.a: "El mejor tronco será para mi barco."
 gdp_trade_good_flavor.3020.b: "Vendido. Los mástiles no esperan a nadie."
 gdp_trade_good_flavor.3020.c: "Que esperen. El precio subirá."
 # 3021 - The Tent of Smoke
 gdp_trade_good_flavor.3021.t: "Una tienda de humo"
 gdp_trade_good_flavor.3021.t_bhang: "Una taza de bhang"
 gdp_trade_good_flavor.3021.t_hashish: "Dulzura a puerta cerrada"
 # Herodotus on the Scythians throwing hemp seed on hot stones in closed tents - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_TENT_GLOSS: "Heródoto escribió que los escitas lanzaban semillas de cáñamo a piedras al rojo vivo dentro de tiendas de fieltro cerradas, y aullaban de alegría con el humo que se generaba. La gente de la estepa mantuvo la costumbre mucho tiempo después."
 gdp_trade_good_flavor.3021.desc: "[tgf_hemp_host.GetSheHe|U] lanza semillas de cáñamo a las piedras calientes de su tienda y surge humo. «[Glossary( 'Respira', 'TGF_HEMP_TENT_GLOSS' )], mercader. Así es como hacemos negocios aquí».\n\nLo hago puramente por razones comerciales, claro está."
 # Bhang among the five sacred plants of the Atharvaveda - https://en.wikipedia.org/wiki/Bhang
 TGF_HEMP_BHANG_GLOSS: "El Atharvaveda nombra el bhang como una de las cinco plantas sagradas. Las hojas de cáñamo se trituran añadiendo leche, mantequilla india y especias para crear una bebida que se toma en los festivales y se ofrece a Shiva."
 gdp_trade_good_flavor.3021.desc_bhang: "[tgf_hemp_host.GetSheHe|U] muele las hojas de cáñamo con leche y especias, y me entrega una taza. «[Glossary( 'Bhang', 'TGF_HEMP_BHANG_GLOSS' )], mercader. En los festivales, todo el pueblo lo bebe. Esta noche, vos haréis lo mismo».\n\nNegarse sería de mala educación, y la mala educación no es buena para el negocio."
 # Hashish in Ayyubid and Mamluk Egypt and Syria - https://en.wikipedia.org/wiki/History_of_cannabis
 TGF_HEMP_HASHISH_GLOSS: "El hachís, una resina de cáñamo comida en pastas y dulces, se extendió por Egipto y Siria a partir del siglo XII. Algunos sufíes lo ensalzaban como un medio para alcanzar el éxtasis, mientras que los juristas lo condenaban y los gobernantes quemaban campos enteros."
 gdp_trade_good_flavor.3021.desc_hashish: "[tgf_hemp_host.GetSheHe|U] cierra la puerta y desenvuelve un pequeño dulce de resina de cáñamo prensada. «[Glossary( 'Hachís', 'TGF_HEMP_HASHISH_GLOSS' )], mercader. Los juristas no lo ven bien. Pero no están aquí ahora mismo».\n\nRechazar a un comprador sería de mala educación."
 gdp_trade_good_flavor.3021.desc.intro: "«¿[tgf_good.Custom('GetTradeGood')|U] [tgf_good.Custom('GetTgfHempUse')]?», se ríe [tgf_hemp_host.Custom('ES_ElLa')] [tgf_hemp_host.GetTitledFirstName|l] de [tgf_source_county.GetNameNoTier]. «Tenemos un uso mejor para ello».\n\n"
 gdp_trade_good_flavor.3021.a: "Los negocios son los negocios. Pasadme la semilla."
 gdp_trade_good_flavor.3021.a_bhang: "Los negocios son los negocios. Pasadme la taza."
 gdp_trade_good_flavor.3021.a_hashish: "Los negocios son los negocios. Pasadme los dulces."
 gdp_trade_good_flavor.3021.b: "Vendedlo. Necesito tener la mente despejada."
 gdp_trade_good_flavor.3021.a.toast_habit: "Un nuevo hábito"
 # 3022 - A Blade From My Best
 gdp_trade_good_flavor.3022.t: "Una hoja de mi mejor mercancía"
 gdp_trade_good_flavor.3022.desc: "Un[tgf_smith.Custom('ES_XA')] herrer[tgf_smith.Custom('ES_OA')] de [tgf_source_county.GetNameNoTier] llamad[tgf_source_county.Custom('ES_OA')] [tgf_smith.GetFirstName] pesa uno de mis lingotes de hierro en sus manos y sonríe. «Dadme lo mejor que tengáis de esto, y os daré una hoja que vale diez veces más que el metal».\n\nDiez veces. Sabe cómo hablarle a un mercader."
 gdp_trade_good_flavor.3022.a: "Forjadla. A ver si merece la pena."
 gdp_trade_good_flavor.3022.b: "Enseñadme qué lingotes son los mejores."
 # 3023 - The Lapidary's Claim
 gdp_trade_good_flavor.3023.t: "Una reclamación lapidaria"
 # Medieval lapidaries, books on the powers of stones - https://en.wikipedia.org/wiki/Lapidary
 TGF_LAPIDARY_GLOSS: "Un cortador y pulidor de gemas que suele leer tratados sobre piedras preciosas: sus libros relatan los poderes ocultos de cada piedra, desde zafiros que protegen de venenos a amatistas que previenen la borrachera."
 gdp_trade_good_flavor.3023.desc: "[tgf_lapidary.GetFirstName|U], que practica el oficio de [Glossary( 'lapidario', 'TGF_LAPIDARY_GLOSS' )] en [tgf_source_county.GetNameNoTier], sostiene una de mis gemas a la luz con expresión muy seria. «Esta piedra protege contra [ROOT.Char.Custom('GetTgfAilment')]. Así está escrito en los libros».\n\nLo que no está escrito aún es su precio."
 gdp_trade_good_flavor.3023.a: "Vendedlo junto a tal afirmación, con un precio acorde."
 gdp_trade_good_flavor.3023.b: "Uníos a mi compañía. Traed vuestros libros."
 gdp_trade_good_flavor.3023.c: "No refutaré lo que digan los libros."
 # 3024 - The Gentleman's Stone
 gdp_trade_good_flavor.3024.t: "Piedra de caballero"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], que conoce bien el jade, golpea cada una de mis piezas contra sus dientes y escucha. Aparta dos de ellas. «Esteatita. Y de la buena». El resto solo recibe una ligera inclinación de cabeza en señal de aprobación.\n\nAlguien que sabe distinguir lo auténtico de lo falso vale más que cualquiera de las dos cosas."
 gdp_trade_good_flavor.3024.a: "Aplastad las falsas. E identificad al proveedor."
 gdp_trade_good_flavor.3024.b: "Uníos a mi compañía. Vuestro ojo vale mucho."
 gdp_trade_good_flavor.3024.c: "Enseñadme ese truco con los dientes."
 # 3025 - Porcelain Ballast
 gdp_trade_good_flavor.3025.t: "Lastre de porcelana"
 gdp_trade_good_flavor.3025.desc: "Mi comerciante, [tgf_trader.GetFirstName], está muy satisfech[tgf_trader.Custom('ES_OA')] consigo mism[tgf_trader.Custom('ES_OA')]. «El barco necesitaba lastre: el cargamento de [tgf_good.Custom('GetTradeGoodUnitPlural')] de la cerámica que vendemos pesa mucho. El capitán apenas nos ha cobrado nada».\n\nUn cargamento que paga su propio transporte. Así me gusta."
 gdp_trade_good_flavor.3025.a: "Poned lo ahorrado en el siguiente cargamento."
 gdp_trade_good_flavor.3025.b: "Aprendamos cómo estibarlo como lastre."
 # 3026 - The Sap Bites
 gdp_trade_good_flavor.3026.t: "Heridas de savia"
 # Urushi lacquer curing - https://en.wikipedia.org/wiki/Lacquerware
 TGF_LACQUER_CURE_GLOSS: "La laca no se seca al aire. Cada capa de savia del árbol debe endurecerse durante días en una habitación húmeda y templada, y una pieza de buena calidad necesita decenas de capas. Hasta que se endurece, la savia provoca ampollas en la piel que toca."
 gdp_trade_good_flavor.3026.desc: "Han llegado [tgf_good.Custom('GetTradeGoodUnitPlural')] de productos lacados nuevos antes de la última capa [Glossary( 'curada', 'TGF_LACQUER_CURE_GLOSS' )]. El acabado es perfecto: intenso, brillante y casi húmedo. Mis dedos desean tocarlo.\n\nQuienes trabajan con laca dicen que la savia provoca heridas en la piel. Sospecho que exageran."
 gdp_trade_good_flavor.3026.a: "Construir una habitación húmeda para que se cure bien."
 gdp_trade_good_flavor.3026.b: "Solo un toquecito. Para asegurarme."
 gdp_trade_good_flavor.3026.b.toast_rash: "Heridas de laca"
 gdp_trade_good_flavor.3026.c: "Dejad que se cure. Las cosas buenas se hacen esperar."
 # 3027 - Reading Stones
 gdp_trade_good_flavor.3027.t: "Piedras de lectura"
 gdp_trade_good_flavor.3027.desc.intro: "[tgf_glassmaker.GetFirstName], fabricante de vidrio de [tgf_source_county.GetNameNoTier], coloca dos piedras pulidas sobre mi libro de cuentas. Los pequeños números ahora parecen más grandes, oscuros y nítidos. «Para los ojos viejos, amig[ROOT.Char.Custom('ES_OA')]. O los cansados».\n\n"
 gdp_trade_good_flavor.3027.desc.old_eyes: "Los míos son ambas cosas. Por primera vez desde hace años, puedo leer la letra pequeña de cada contrato."
 gdp_trade_good_flavor.3027.desc.young_eyes: "Mis ojos no son ni lo uno ni lo otro, pero ahora puedo leer la letra pequeña de los contratos."
 gdp_trade_good_flavor.3027.a: "Un par para mí. Envolvedlas bien."
 gdp_trade_good_flavor.3027.b: "Enviadle un par [tgf_trader.Custom('ES_AlAla')] [tgf_trader.GetTitledFirstNameNoTooltip|l]."
 gdp_trade_good_flavor.3027.c: "Las piedras no. Su secreto."
 # 3028 - Feast-Day Prices
 gdp_trade_good_flavor.3028.t: "Precios de día de festín"
 gdp_trade_good_flavor.3028.desc.christian: "«Llegan los días sagrados», me dice mi comerciante [tgf_trader.GetFirstName], que acaba de llegar de [tgf_source_county.GetNameNoTier]. «Todo comprador busca incienso para los Reyes Magos, y nadie regatea con lo que va a quemar en el altar».\n\n"
 gdp_trade_good_flavor.3028.desc: "«Llegan los días sagrados», me dice mi comerciante [tgf_trader.GetFirstName], que acaba de llegar de [tgf_source_county.GetNameNoTier]. «Todo comprador busca incienso que pueda poner en el santuario sagrado, y nadie regatea con lo que va a quemar en el altar».\n\n"
 gdp_trade_good_flavor.3028.desc.outro: "Un comprador que no regatea es un regalo de [ROOT.Char.GetFaith.HighGodName]."
 gdp_trade_good_flavor.3028.a: "Quemaré un poco para mí, para el festín."
 gdp_trade_good_flavor.3028.b: "El templo elige primero, por un precio."
 gdp_trade_good_flavor.3028.c: "Días de festín, precios de festín."
 # 3029 - Theriac
 gdp_trade_good_flavor.3029.t: "Triaca"
 # Theriac, the medieval cure-all of dozens of ingredients - https://en.wikipedia.org/wiki/Theriac
 TGF_THERIAC_GLOSS: "Un famoso remedio para todo, creado a partir de la infusión de una decena de ingredientes, que a menudo incluían carne de víbora y opio, y que se dejaba madurar durante años. Los galenos lo recetaban para los envenenamientos, la peste y prácticamente para todo."
 gdp_trade_good_flavor.3029.desc: "[tgf_apothecary.GetFirstName|U], boticari[tgf_apothecary.Custom('ES_OA')] de [tgf_source_county.GetNameNoTier], nos envía una misiva con aroma a hierbas. «Tenéis justo el inventario que necesito para mi [Glossary( 'triaca', 'TGF_THERIAC_GLOSS' )]. Contra el veneno, la peste y todas las demás aflicciones».\n\nQue funcione o no, ya es cosa suya y de sus pacientes. Yo solo me preocupo de vender."
 gdp_trade_good_flavor.3029.a: "Cread la infusión, y vendedla a lo largo de mis rutas."
 gdp_trade_good_flavor.3029.b: "Sesenta y cuatro ingredientes. Suministrados por mí."
 gdp_trade_good_flavor.3029.c: "Enseñadme la receta. Y dadme una dosis."
 # 3030 - No Paper for Charters
 gdp_trade_good_flavor.3030.t: "Nada de papel para los privilegios"
 # Frederick II forbidding paper for public documents in the Kingdom of Sicily, 1231 - https://en.wikipedia.org/wiki/History_of_paper
 TGF_PAPER_GLOSS: "En 1231, el emperador Federico II prohibió a las notarías del reino de Sicilia escribir documentos públicos en papel, el cual consideraba demasiado frágil para ser fiable. Solo servía el pergamino."
 gdp_trade_good_flavor.3030.desc: "«Los escribanos [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l] [Glossary( 'no tocarán el papel', 'TGF_PAPER_GLOSS' )] para nada que sea oficial», me dice mi comerciante, [tgf_trader.GetFirstName], al regresar de [tgf_source_county.GetNameNoTier] sin haberse recuperado aún del disgusto. «Solo pergamino, dicen. Como si fuera sagrado».\n\nToda regla se puede discutir."
 gdp_trade_good_flavor.3030.a: "Discutir el caso. El papel es el futuro."
 gdp_trade_good_flavor.3030.a.success: "La cancillería necesita papel"
 gdp_trade_good_flavor.3030.a.failure: "La cancillería se queda con el pergamino"
 gdp_trade_good_flavor.3030.b: "Entonces, comprarán mi pergamino."
 gdp_trade_good_flavor.3030.c: "Entonces, descubriré qué quieren."
 # 3031 - Gruit or Hops
 gdp_trade_good_flavor.3031.t: "Gruit o lúpulo"
 # Gruit, the herb mixture that flavored ale before hops, often taxed by lords - https://en.wikipedia.org/wiki/Gruit
 TGF_GRUIT_GLOSS: "Una mezcla de hierbas, como el mirto y la milenrama, que aromatizaba la cerveza y la conservaba antes del empleo del lúpulo. Muchos gobernantes se reservaban el derecho de venderlo y, por tanto, gravaban cada elaboración."
 gdp_trade_good_flavor.3031.desc: "«Lúpulo», me susurra [tgf_brewer.GetFirstName], un fabricante de [tgf_source_county.GetNameNoTier], junto a mis barriles. «Cerveza que se conservaba durante meses. Y nadie puede poner impuestos al lúpulo». En [tgf_source_county.GetNameNoTier], todo cervecero debe comprar el [Glossary( 'gruit', 'TGF_GRUIT_GLOSS' )] [tgf_market_holder.Custom('ES_DelDela')] [tgf_market_holder.GetTitledFirstName|l] y pagar impuestos por ello.\n\nAlguien debe pagar siempre por el progreso."
 gdp_trade_good_flavor.3031.a: "Lúpulo, entonces. Hagámoslo viajar."
 gdp_trade_good_flavor.3031.b: "Gruit, como prefiera [tgf_market_holder.Custom('ES_ElLa')] [tgf_market_holder.GetTitleAsNameNoTooltip|l]."
 gdp_trade_good_flavor.3031.c: "Un poco de ambos, en cada barril."
 # 3032 - A Basket of Fruit
 gdp_trade_good_flavor.3032.t: "Una cesta de fruta"
 gdp_trade_good_flavor.3032.desc: "En [tgf_source_county.GetNameNoTier], se comen [tgf_fruit_province.Custom('get_region_fruit_plural')] directamente a cestas llenas, y raramente llegan más lejos del siguiente pueblo.\n\nSi la fruta estuviera deshidratada, se conservaría. Si la enviáramos, se vendería. Me como una pieza y me voy a por mis libros de cuentas."
 gdp_trade_good_flavor.3032.a: "Descubrir quién cultiva y en qué cantidad."
 gdp_trade_good_flavor.3032.b: "Otra más. Por el bien de la investigación."
