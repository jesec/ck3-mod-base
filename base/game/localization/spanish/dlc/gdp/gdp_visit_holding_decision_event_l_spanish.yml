 VISIT_HOLDING_DECISION_ALL_OPTIONS_EXHAUSTED: "Has explorado todas las oportunidades de [ROOT.Char.Custom('LocalHoldingTypeConcept')|l]. Nuevas opciones estarán disponibles tras [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
