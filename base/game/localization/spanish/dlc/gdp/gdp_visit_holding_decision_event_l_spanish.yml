 gdp_visit_holding_decision_event.1000.t: "Visitar [ROOT.Char.Custom('LocalHoldingTypeCapitalized')|l] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1000.desc: "Cuando el sol se levanta, lo acompañan los habitantes de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. La calma de la mañana pronto se ve interrumpida por el animado bullicio de la gente en sus actividades diarias. El observador atento puede encontrar oportunidades a la vuelta de cada esquina en estas calles abarrotadas.\n\n¿Hacia dónde debería dirigirme para buscar mi fortuna hoy?"
 gdp_visit_holding_decision_event.1000.entrepot_stewardship.toast: "Lecciones del centro de intercambio"
 gdp_visit_holding_decision_event.1000.a: "Debería dirigirme a los gremios"
 gdp_visit_holding_decision_event.1000.a.tt: "Una visita a los gremios podría ofrecer las siguientes oportunidades: $gdp_visit_holding_decision_effect_artifact$ $gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1000.guilds.inaccessible.tt: "Has explorado todo lo que tenían que ofrecer los gremios. Prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_guilds_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.market.inaccessible.tt: "Has explorado todo lo que tenía que ofrecer el mercado. Prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.docks.inaccessible.tt: "Has explorado todo lo que tenían que ofrecer los muelles. Prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.inaccessible.tt: "Has agotado todas las oportunidades en la corte [THIS.Char.GetSuzerain.Custom('ES_DelDela')] [THIS.Char.GetSuzerain.GetTitledFirstNameNoTooltip|l] por ahora. Prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_patron_area_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.patron.no_patron.tt: "No tienes ningún patrón cuya audiencia puedas buscar"
 gdp_visit_holding_decision_event.1000.worship.inaccessible.tt: "Has explorado todo lo que tenía que ofrecer este/a [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l]. Prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_worship_area_refresh_tracker') )|V]"
 gdp_visit_holding_caught_stealing.tt: "Te descubrieron robando en este/a [THIS.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship|l] de [THIS.Char.Custom('LocalHoldingTypeConcept')|l]. Se te ha expulsado hasta [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1500_caught_stealing') )|V]"
 gdp_visit_holding_decision_event.1000.b: "Debería buscar una audiencia con [patron.Custom('ES_ElLa')] [patron.GetTitledFirstNameNoTooltip|l]."
 gdp_visit_holding_decision_event.1000.c: "Un día perfecto para recorrer el mercado."
 gdp_visit_holding_decision_event.1000.c.tt: "Una visita al mercado local podría ofrecer las siguientes oportunidades: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.e: "Un buen día para dar un paseo por el muelle."
 gdp_visit_holding_decision_event.1000.e.tt: "Una visita a los muelles podría ofrecer las siguientes oportunidades: $gdp_visit_holding_decision_effect_recruit$ $gdp_visit_holding_decision_effect_contracts$ $gdp_visit_holding_decision_effect_stress_loss$"
 gdp_visit_holding_decision_event.1000.f: "El recinto del/de la [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] parece interesante."
 gdp_visit_holding_decision_event.1000.f.tt: "Una visita al lugar de adoración local podría ofrecer las siguientes oportunidades: $gdp_visit_holding_decision_effect_donate$ $gdp_visit_holding_decision_effect_cure$ $gdp_visit_holding_decision_effect_blessing$ $gdp_visit_holding_decision_effect_rob_money$"
 gdp_visit_holding_decision_effect_donate: "\n$EFFECT_LIST_BULLET$ Donar [gold|El] [gold_i] para ganar [piety|El] [piety_i]"
 gdp_visit_holding_decision_effect_cure: "\n$EFFECT_LIST_BULLET$ Mejorar tu [health|El] o curar [diseases|El]"
 gdp_visit_holding_decision_effect_blessing: "\n$EFFECT_LIST_BULLET$ Obtener una bendición en forma de [character_modifier|El]"
 gdp_visit_holding_decision_effect_rob_money: "\n$EFFECT_LIST_BULLET$ Robar [gold|El] [gold_i] de las ofrendas"
 gdp_visit_holding_decision_event.1000.d: "Creo que he terminado con los recados de hoy."
 gdp_visit_holding_decision_event.1000.d.tt: "Volver a casa por ahora"
 gdp_visit_holding_decision_event.1000.d.changed_mind: "«De hecho, he cambiado de idea»."
 gdp_visit_holding_decision_event.1000.d.changed_mind.tt: "Irte sin explorar tal [ROOT.Char.Custom('LocalHoldingTypeConcept')|l]"
 gdp_visit_holding_decision_event.1000.d.exhausted: "Parece que no queda más por hacer…"
 gdp_visit_holding_decision_event.1000.d.exhausted.tt: "Regresar a casa. Nuevas oportunidades estarán disponibles tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'visit_holding_all_options_refresh_tracker') )|V]"
 gdp_visit_holding_decision_event.1000.not_in_patron_realm.tt: "Tu [domicile|El] actualmente no está en el señorío de tus [merchant_patrons|El]"
 gdp_visit_holding_decision_event.1110.t: "Visita a los gremios de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1110.desc: "El sonido del martillo contra el metal resuena en los callejones de los gremios. Al bajar la calle, un joven aprendiz lleva las herramientas de su maestro a un taller de alfarería. Durante generaciones, estos gremios han forjado las habilidades de los jornaleros hasta convertirlos en expertos artesanos. \n\nLos gremios ofrecen una gran variedad de servicios para los comerciantes, ¿cuál de ellos visitaré hoy?"
 gdp_visit_holding_decision_event.1110.a: "A uno de mis artefactos le vendría bien que lo puliera."
 gdp_visit_holding_decision_event.1110.a.tt: "Una visita al conservador ofrecería la siguiente oportunidad:\n$EFFECT_LIST_BULLET$ Mejorar tus [artifacts|El] @artifact_icon! comunes y las obras maestras"
 gdp_visit_holding_decision_event.1110.a.cooldown.tt: "Has usado hace poco los servicios del conservador. Vuelve a intentarlo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_improved_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.a.no.arfitfacts.tt: "No tienes [artifacts|El] comunes ni obras maestras"
 gdp_visit_holding_decision_event.1110.b: "Me apetecen armas y armaduras nuevas."
 gdp_visit_holding_decision_event.1110.b.tt: "Un viaje al herrero ofrecería la siguiente oportunidad:\n$EFFECT_LIST_BULLET$ Comprar [artifacts|El] @artifact_icon! de armas y armaduras de tipo común, célebres u obras maestras"
 gdp_visit_holding_decision_event.1110.b.cooldown.tt: "Has comprado hace poco una cosa al herrero. Vuelve a intentarlo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1111_has_bought_artifact_recently') )]"
 gdp_visit_holding_decision_event.1110.c: "Debería concertar una reunión con el maestro de un gremio."
 gdp_visit_holding_decision_event.1110.c.tt: "Una reunión con el maestro de un gremio ofrecería la siguiente oportunidad:$gdp_visit_holding_decision_effect_guild$"
 gdp_visit_holding_decision_event.1110.c.cooldown.tt: "Te has reunido hace poco con el maestro de un gremio. Vuelve a intentarlo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1110_visited_guild_master_recently') )]"
 gdp_visit_holding_decision_event.1110.d: "Quizá debería ir a otra parte."
 gdp_visit_holding_decision_event.1110.d.tt: "Dejar los gremios por ahora"
 gdp_visit_holding_decision_event.1111.t: "$gdp_visit_holding_decision_event.1110.t$: el conservador"
 gdp_visit_holding_decision_event.1111.desc: "Al entrar en el taller [curator.Custom('ES_DelDela')] conservador[curator.Custom('ES_XA')], me sorprende ver objetos fascinantes por doquier. Al fondo, en una mesa de trabajo, un[curator.Custom('ES_XA')] [curator.GetWomanMan] se inclina sobre una daga en cuya empuñadura está grabando joyas de una calidad finísima. Cuando me detengo a inspeccionar las alhajas de una de las vitrinas, rompo su concentración.\n\n«¡Ah, un[ROOT.Char.Custom('ES_XA')] posible client[ROOT.Char.Custom('ES_EA')]! ¿Cómo puedo serviros, [ROOT.Char.GetTitledFirstNameNoTooltip|l]?»."
 gdp_visit_holding_decision_event.1111.a: "A mi [artifact_target_1.GetNameNoTooltip] le vendría bien un pulido."
 gdp_visit_holding_decision_event.1111.a.tt: "Tu [artifact_target_1.GetName] obtendrá una mejora"
 gdp_visit_holding_decision_event.1111.b: "Estaría bien darle un poco de amor a mi [artifact_target_2.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1111.b.tt: "Tu [artifact_target_2.GetName] obtendrá una mejora"
 gdp_visit_holding_decision_event.1111.c: "Podría perfeccionar mi [artifact_target_3.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1111.c.tt: "Tu [artifact_target_3.GetName] obtendrá una mejora"
 gdp_visit_holding_decision_event.1111.d: "Quizá tenga que volver más adelante…"
 gdp_visit_holding_decision_event.1111.d.tt: "Volver a los gremios y ver qué más tiene que ofrecer [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1112.t: "$gdp_visit_holding_decision_event.1110.t$: el herrero"
 gdp_visit_holding_decision_event.1112.desc: "Al entrar en la herrería, siento el insoportable calor de la forja. [blacksmith.Custom('ES_ElLa')|U] artesan[blacksmith.Custom('ES_OA')], que estaba forjando una espada ancha, se ve abruptamente interrumpid[blacksmith.Custom('ES_OA')] por mi entrada. Mientras se limpia una mezcla de sudor y hollín de la frente, se gira para dedicarme su atención.\n\n«¿Qué tenemos aquí? ¿Mi [ROOT.Char.GetTitleAsNameNoTooltip|l] ha venido a adquirir algunas de las armas y armaduras que ofrezco? Es lo mejor que encontraréis en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]»."
 gdp_visit_holding_decision_event.1112.a: "Esto sería una buena compra: [arms_armor_artifact_1.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1112.b: "Debería comprar esto: [arms_armor_artifact_2.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1112.c: "Me vendría bien esto: [arms_armor_artifact_3.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1112.d: "Pensándolo mejor, no quiero nada hoy."
 gdp_visit_holding_decision_event.1112.d.tt: "Volver a los gremios y ver qué más tiene que ofrecer [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1113.t: "$gdp_visit_holding_decision_event.1110.t$: guía del maestro de gremio"
 gdp_visit_holding_decision_event.1113.desc: "La reunión con el maestro de gremio [guild_master.GetName] ha demostrado ser fructífera para la compañía [ROOT.Char.GetHouse.GetName]. En la polvorienta oficina, entre montañas de papeles y libros, las horas se han pasado volando.\n\n[guild_master.GetNameNoTooltip] posee una maestría única en [guild_master.Custom('highest_skill_noun')|l]. Su conversación nos ha fascinado a mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_associate'))] [visiting_associate.GetName] y a mí, y ahora deseamos saber más."
 gdp_visit_holding_decision_event.1113.a.success: "[visiting_associate.GetName] y tú absorbéis los nuevos conocimientos con ganas"
 gdp_visit_holding_decision_event.1113.a_learning.failure: "Descifrar los manuscritos antiguos no es tarea sencilla"
 gdp_visit_holding_decision_event.1113.a_stewardship.failure: "Estas ecuaciones son demasiado difíciles para que [visiting_associate.GetName] y tú las entendáis"
 gdp_visit_holding_decision_event.1113.a_diplomacy.failure: "Los grandes esfuerzos diplomáticos son demasiado complejos"
 gdp_visit_holding_decision_event.1113.a.failure.tt: "La lección cae en oídos sordos."
 gdp_visit_holding_decision_event.1113.a: "«¿Quizá [visiting_associate.GetNameNoTooltip] y yo podríamos quedarnos un poco más?»."
 gdp_visit_holding_decision_event.1113.a.child: "La lección beneficiará a la educación de [visiting_associate.GetName]"
 gdp_visit_holding_decision_event.1113.b: "«A [visiting_associate.GetFirstNameNoTooltip] le vendría bien otra lección sobre el tema»."
 gdp_visit_holding_decision_event.1113.b.tt: "[guild_master.GetName] le enseñará a [visiting_associate.GetNameNoTooltip] más sobre el tema:"
 gdp_visit_holding_decision_event.1113.c: "«Interesante, ¡tendré que apuntarlo!»."
 gdp_visit_holding_decision_event.1113.c.tt: "El conocimiento de [guild_master.GetName] será útil para la compañía [THIS.Char.GetHouse.GetName]"
 gdp_visit_holding_decision_event.1113.d: "Ya basta de [guild_master.Custom('highest_skill_noun')|l] por hoy."
 gdp_visit_holding_decision_event.1113.d.tt: "Volver a los gremios y ver qué más tiene que ofrecer [THIS.Char.GetCurrentLocation.GetName]"
 gdp_visit_holding_decision_event.1300.t: "Visita al mercado de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1300.asia: "Como en todos los mercados a lo largo de la gran Ruta de la Seda, mercancías de lujo como el jade, la seda y el té abundan por aquí.\n\nEn medio de una calle llena de gente, un hombre descarga con cuidado unos jarrones de delicada porcelana de un carro. Cerca de él, un comerciante extranjero vestido con ropas coloridas merodea por los puestos, deseoso de hacer una compra."
 gdp_visit_holding_decision_event.1300.mena_india: "La tela colorida y la cerámica decorada con distintos motivos alegran el que de no ser por ellas sería un callejón sombrío. El incienso y las especias perfuman el aire con un aroma que invita a acercarse.\n\nEn una esquina oscura, un comerciante intenta convencer desesperadamente a un escéptico para que compre sus platos de cobre de increíble calidad. Es el momento perfecto para cerrar un trato."
 gdp_visit_holding_decision_event.1300.default: "El olor de los productos frescos se mezcla con el de la multitud agolpada. Los comerciantes de la bulliciosa plaza compiten por la atención a gritos.\n\n «¡[ROOT.Char.Custom('RegionalDrink')|U]! ¡Es una oferta especial, solo por hoy!». «¡Última oportunidad para comprar este estupendo corte de [ROOT.Char.Custom('RegionalEdibleMeat')]!».\n\n"
 gdp_visit_holding_decision_event.monk_hint: "Un hombre deja el salón del té cercano con la cabeza baja, murmurando algo sobre malos presagios. Al parecer, alguien dentro está haciendo adivinaciones sobre el futuro."
 gdp_visit_holding_decision_event.monk_hint_return: "El salón de té está ahora más tranquilo, pero el monje adivino todavía no se ha ido."
 gdp_visit_holding_decision_event.caravaneer_hint: "Una procesión de caravanas maltratadas por el mal tiempo llena la calle, mientras los establos de la zona se esfuerzan por seguir el ritmo tras el aumento de la actividad comercial."
 gdp_visit_holding_decision_event.caravaneer_hint_return: "Las caravanas no se han movido. El conductor sigue entre los animales, esperando."
 gdp_visit_holding_decision_event.sea_captain_hint: "\n\nSe rumorea que [Select_CString( sea_captain.IsFemale, 'una capitana', 'un capitán')] con bastante experiencia está admitiendo pasajeros en su barco hoy."
 gdp_visit_holding_decision_event.sea_captain_hint_return: "\n\n[Select_CString( sea_captain.IsFemale, 'La capitana', 'El capitán')] del barco sigue aceptando pasajeros y la multitud que se acumula alrededor de su nave no disminuye."
 gdp_visit_holding_decision_event.carnival_jester_hint: "No puedo evitar escuchar una conversación de otro compañero mercader; se queja de ciert[carnival_jester.Custom('ES_OA')] artista callejer[carnival_jester.Custom('ES_OA')] que está robando la atención de sus clientes habituales."
 gdp_visit_holding_decision_event.carnival_jester_hint_return: "[carnival_jester.Custom('ES_ElLa')|U] artista callejer[carnival_jester.Custom('ES_OA')] sigue reteniendo a la muchedumbre, y a los mercaderes cercanos no les agrada."
 gdp_visit_holding_decision_event.cook_hint: "Me doy cuenta de que hay un montón de personas caminando con [ROOT.Char.Custom('FavoriteTreat')] en las manos. Oigo a uno de ellos decir que una repostería está regalando sus productos."
 gdp_visit_holding_decision_event.cook_hint_return: "El puesto de repostería aún no ha cerrado."
 gdp_visit_holding_decision_event.1300.desc.fallback: "Las monedas y los recursos cambian de manos a un ritmo frenético. En el mercado abundan las oportunidades."
 gdp_visit_holding_decision_event.1300.a: "¿Qué novedades traerán los comerciantes extranjeros?"
 gdp_visit_holding_decision_event.1300.a.tt: "Escuchar a hurtadillas a los comerciantes podría ofrecer la siguiente oportunidad:$gdp_visit_holding_decision_effect_contracts$ "
 gdp_visit_holding_decision_event.1300.a.cooldown.tt: "Has creado contratos hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1310_has_created_contract_recently') )]"
 gdp_visit_holding_decision_event.1300.b: "Debería echar un ojo, a ver si encuentro nuevos colaboradores capaces."
 gdp_visit_holding_decision_event.1300.b.cooldown.tt: "Has intentado reclutar asociados hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1320_has_recruited_recently') )]"
 gdp_visit_holding_decision_event.1300.b.tt: "Recorrer el mercado podría ofrecer la siguiente oportunidad:$gdp_visit_holding_decision_effect_recruit$"
