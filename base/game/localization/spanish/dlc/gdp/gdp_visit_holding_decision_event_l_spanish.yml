 gdp_visit_holding_rare_recruit_skill.stewardship: "[ROOT.Char.GetFirstName] tiene [ROOT.Char.Custom('GetVisitHoldingColoredStewardshipSkillLevel')] de [stewardship_skill|El] ([ROOT.Char.GetSkill( 'stewardship' )|V] [stewardship_i])"
