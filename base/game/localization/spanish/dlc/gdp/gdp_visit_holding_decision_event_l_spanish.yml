 VISIT_HOLDING_DECISION_EXHAUSTED_MARKET: "\n$EFFECT_LIST_BULLET$El mercado: [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'visit_holding_market_dock_area_refresh_tracker') )|V]"
