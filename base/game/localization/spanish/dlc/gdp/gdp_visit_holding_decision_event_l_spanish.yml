 gdp_visit_holding_decision_event.1310.t: "$gdp_visit_holding_decision_event.1300.t$: buscando oportunidades"
 gdp_visit_holding_decision_event.1310.desc: "Últimamente, he oído muchas historias de bestias y riquezas extranjeras. Hoy, recorreré el mercado para ver si encuentro a alguien que sepa más sobre estos rumores.\n\nEntre los comerciantes, veo a un[foreigner.Custom('ES_XA')] [foreigner.GetWomanMan] con un extraño acento foráneo alardear orgullosamente de sus hazañas en tierras lejanas ante un mercader local que no parece prestarle demasiada atención. A lo mejor solo está fanfarroneando, o quizá haya algo de cierto en sus historias. Puede que un poco de oro consiga hacer que hable…"
 spawn_merchant_contract_interaction_duplicate_tt: "Ya tienes un [task_contract|El] de este tipo aceptado o disponible"
 spawn_merchant_contract_interaction_route_tt: "No tienes [trade_routes|El] activas con un [trader|El] asignado"
 spawn_merchant_contract_interaction_cooldown_tt: "Este tipo de [task_contract|El] está en cuenta atrás"
 gdp_visit_holding_decision_event.1310.a: "Quiero saber más sobre estas criaturas exóticas."
 gdp_visit_holding_decision_event.1310.a.tt: "Crear un [luxury_contract|El] [luxury_contract_i] de [menagerie|El] en el mapa"
 gdp_visit_holding_decision_event.1310.b: "Me llaman bastante la atención estas curiosidades."
 gdp_visit_holding_decision_event.1310.b.tt: "Crear un [luxury_contract|El] [luxury_contract_i] de [curio|El] en el mapa"
 gdp_visit_holding_decision_event.1310.c: "Debería invertir en la compañía [ROOT.Char.GetHouse.GetNameNoTooltip] en su lugar"
 gdp_visit_holding_decision_event.1310.c.tt: "Crear una [trade_opportunity|El] [trade_opportunity_i] de [company_purpose|El] en el mapa"
 gdp_visit_holding_decision_event.1310.d: "Debería mirar en otra parte…"
