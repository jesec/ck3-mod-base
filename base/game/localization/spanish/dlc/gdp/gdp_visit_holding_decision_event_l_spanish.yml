 gdp_visit_holding_decision_event.1320.desc: "¡Observando a la multitud, tres posibles candidatos me llaman la atención!"
 gdp_visit_holding_decision_event.1320.first_character_desc: "[market_first_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.second_character_desc: "[market_second_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.third_character_desc: "[market_third_recruit.Custom('GetVisitHolding1320CharacterDesc')]"
 gdp_visit_holding_decision_event.1320.mid.desc: "\n\n"
 gdp_visit_holding_decision_event.1320.charlatan.desc: "Una multitud se reúne, hipnotizada por el resplandor de la plata. La prestidigitación de [ROOT.Char.GetName] los dispone a formar cola como corderos en el matadero."
 gdp_visit_holding_decision_event.1320.hired_muscle.desc: "Ataviad[ROOT.Char.Custom('ES_OA')] con una armadura muy desgastada, [ROOT.Char.GetFirstName] apoya su musculosa envergadura en la pared, haciendo girar su daga con impaciencia."
 gdp_visit_holding_decision_event.1320.numerate.desc: "[ROOT.Char.GetFirstName] inspecciona los puestos uno a uno, anotando meticulosamente los detalles en un libro de cuentas compacto."
 gdp_visit_holding_decision_event.1320.traveler.desc: "¡Ataviad[ROOT.Char.Custom('ES_OA')] con atuendo extranjero, [ROOT.Char.GetFirstName] intenta mediar en un conflicto entre dos comerciantes, usando su [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName] chapurreado, ni más ni menos!"
 gdp_visit_holding_decision_event.1320.urchin.desc: "[ROOT.Char.GetFirstName] merodea entre las sombras, con un bebé enrollado en mantas en un brazo y la otra palma de la mano extendida, en busca de la siguiente víctima desprevenida."
 gdp_visit_holding_decision_event.1320.herbalist.desc: "Encorvad[ROOT.Char.Custom('ES_OA')] junto a un caravanero herido, [ROOT.Char.GetFirstName] elabora rápidamente una pócima curativa a partir de unas hierbas cercanas."
 gdp_visit_holding_decision_event.1320.a: "[market_first_recruit.GetNameNoTooltip] parece interesante."
 gdp_visit_holding_decision_event.1320.option.tt: "Podrás reclutar a [THIS.Char.GetFirstName] como personaje [associate|El] si haces lo siguiente:"
