 gdp_visit_holding_decision_event.1400.t: "Visita a los muelles de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1400.intro: "En el ajetreado puerto de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], los estibadores descargan diligentemente mercancía de todas las formas y tamaños."
 gdp_visit_holding_decision_event.1400.asia: "Cajas de seda y sacos de hojas de té son manipulados con cuidado por manos callosas. Pronto, proporcionarán al resto del mundo conocido las maravillas que contienen, transportadas a buen recaudo por los djongs a través de mares embravecidos."
 gdp_visit_holding_decision_event.1400.mena_india: "En medio del caos, un comerciante inspecciona la carga de unas cajas dañadas. En el otro extremo del puerto, se sellan con cuidado cajas de especias para que sobrevivan al peligroso viaje a través del océano."
 gdp_visit_holding_decision_event.1400.default: "Sacos de grano y sal son enviados a tierras lejanas por mar. Una grandiosa coca de roble acaba de echar el ancla, y de ella desembarca un grupo de comerciantes extranjeros ataviados con ropas de colores."
 gdp_visit_holding_decision_event.1400.outro: "El aire fresco llena mis pulmones y estoy impaciente por ver cómo me sonreirán hoy los vientos de la fortuna.\n\n… ¿A dónde debería ir ahora?\n\n"
 gdp_visit_holding_decision_event.1400.b: "Debería echar un ojo, a ver si veo a alguien interesante."
 gdp_visit_holding_decision_event.1400.b.tt: "Recorrer el muelle podría ofrecer la siguiente oportunidad:$gdp_visit_holding_decision_effect_recruit$"
 gdp_visit_holding_decision_event.1400.d: "Debería tener unas palabras con [Select_CString( sea_captain.IsFemale, 'la capitana', 'el capitán')]."
 gdp_visit_holding_decision_event.1400.d.tt: "Hablar con [Select_CString( sea_captain.IsFemale, 'la capitana', 'el capitán')]\n$gdp_visit_holding_rare_spawn_alert.tt$"
 gdp_visit_holding_decision_event.1400.d_second: "Debería hablar otra vez con [sea_captain.GetFirstNameNoTooltip]."
 gdp_visit_holding_decision_event.1400.c.tt: "Dejar el muelle por ahora"
 DECISION_ALREADY_VISITING_HOLDING: "[CHARACTER.Custom('IsAlreadyVisitingHolding')]"
 DECISION_ALREADY_VISITING_HOLDING_TIME: "Esta acción volverá a estar disponible en [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'gdp_visit_holding_is_visiting') )]"
 DECISION_ALREADY_VISITING_HOLDING_NO_TIME: "Ya estás visitando una posesión"
 gdp_visit_holding_decision_event.1340.t: "Tiempo de inactividad en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_visit_holding_decision_event.1340.desc: "El mundo del comercio puede ser muy exigente a veces, y no podemos examinar todos los tratos y sonreír con falsedad a todo el mundo sin tomar descansos de vez en cuando.\n\n"
 gdp_visit_holding_decision_event.1340.tea: "Aquí en la casa del té puedo olvidarme de los problemas de la compañía durante un rato.\n\nEs un alivio disfrutar de una sencilla taza de té humeante, intercambiando charlas, noticias y rumores con los habituales."
 gdp_visit_holding_decision_event.1340.hashish: "Aquí en la casa del hachís puedo olvidarme de los problemas de la compañía durante un rato.\n\nEs un alivio poder sentarme en un rincón fresco y tranquilo para compartir charlas, noticias y rumores con los habituales."
 gdp_visit_holding_decision_event.1340.drink: "Aquí en la taberna puedo olvidarme de los problemas de la compañía durante un rato.\n\nEs un alivio poder saborear una buena copa de [ROOT.Char.Custom('RegionalAlcoholicDrink')], intercambiando charlas, noticias y rumores con los habituales."
 gdp_visit_holding_decision_event.1340.food: "Aquí en la sala de banquetes puedo olvidarme de los problemas de la compañía durante un rato.\n\nEs un alivio poder picotear de un buen festín, hincándole el diente a un plato de [ROOT.Char.Custom('FavoriteTreat')], mientras intercambio charlas, noticias y rumores con los habituales."
 gdp_visit_holding_decision_event.1340.bath: "Aquí en la casa de baños puedo olvidarme de los problemas de la compañía durante un rato.\n\nEs un alivio poder zambullirme en las aguas curativas para compartir charlas, noticias y rumores con los habituales."
 gdp_visit_holding_decision_event.1340.a: "Debería hacer esto más a menudo."
