 gdp_visit_holding_decision_event.1320.b: "[market_second_recruit.GetNameNoTooltip] parece una opción prometedora."
 gdp_visit_holding_decision_event.1320.c: "[market_third_recruit.GetNameNoTooltip] llama mi atención."
 gdp_visit_holding_decision_event.1320.d: "Nadie me ha llamado la atención…"
 gdp_visit_holding_decision_event.1320.d.tt: "Volver al mercado y ver qué más tiene que ofrecer [THIS.Char.GetCurrentLocation.GetName]."
 gdp_visit_holding_decision_event.1320.e: "Nadie me ha llamado la atención…"
 gdp_visit_holding_decision_event.1320.e.tt: "Volver a los muelles y ver qué más tiene que ofrecer [THIS.Char.GetCurrentLocation.GetNameNoTooltip]."
 gdp_visit_holding_decision_event.1320.tt: "Volver y ver qué otros reclutas interesantes hay"
 gdp_visit_holding_decision_event.1321.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1321.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1321.t: "Charlatanería"
 gdp_visit_holding_decision_event.1321.desc: "[charlatan_recruit.GetFirstName] me dice que me acerque. Agitando la mano, proclama:\n\n«Vaya… ¡Parece que tenemos un[ROOT.Char.Custom('ES_XA')] voluntari[ROOT.Char.Custom('ES_OA')]! Si conseguís adivinar si saldrá cara o cruz en la moneda, os daré una generosa recompensa».\n\nCon un movimiento de muñeca fugaz, hace desaparecer la moneda. El público aguarda mi siguiente movimiento con expectación y en silencio."
 gdp_visit_holding_decision_event.1321.a: "#EMP Claramente#! guardas una moneda falsa bajo la manga."
 gdp_visit_holding_decision_event.1321.a.success: "Logras desvelar el engaño"
 gdp_visit_holding_decision_event.1321.a.failure: "No consigues desvelar el engaño"
 gdp_visit_holding_decision_event.1321.b: "Un engaño patético. Deberíais trabajar para mí en lugar de hacer eso."
 gdp_visit_holding_decision_event.1321.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ Se necesita [charlatan_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [charlatan_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1321.c: "No tengo tiempo para trucos…"
 gdp_visit_holding_decision_event.1322.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1322.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1322.t: "El pícaro rudo"
 gdp_visit_holding_decision_event.1322.desc: "Al acercarme a [hired_muscle_recruit.GetFirstName], noto como me tantea con suspicacia.\n\n«¿No sabéis quién soy? Soy [charlatan_recruit.Custom('ES_ElLa')] campe[charlatan_recruit.Custom('ES_OnOna')] invencible de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Tenéis agallas si pensabais que semejante [hired_muscle_recruit.Custom2('InsultNoun', ROOT.Char)] como vos puede vencerme en combate».\n\nAlza su puño en un gesto amenazante hacia mí."
 gdp_visit_holding_decision_event.1322.a: "¡Haré que se coma sus palabras!"
 gdp_visit_holding_decision_event.1322.a.success: "Derrotas a [hired_muscle_recruit.GetFirstName]"
 gdp_visit_holding_decision_event.1322.a.failure: "[hired_muscle_recruit.GetFirstName] te da una paliza"
 gdp_visit_holding_decision_event.1322.b: "Luchad en mi lugar."
 gdp_visit_holding_decision_event.1322.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ Se necesita [hired_muscle_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [hired_muscle_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1322.c: "Creo que debería irme ya…"
 gdp_visit_holding_decision_event.1323.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1323.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1323.t: "El erudito de números"
 gdp_visit_holding_decision_event.1323.desc: "Con la nariz hundida en su libro, [numerate_recruit.GetFirstName] apenas se da cuenta de mi presencia hasta que me acerco mucho. Me mira con una expresión reflexiva.\n\n«Parecéis un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] capaz. Tal vez podáis ayudarme a resolver este problema».\n\nLa hoja que sostiene ante mí está llena de números y cálculos. Parece un balance de gastos e ingresos de los puestos del mercado."
 gdp_visit_holding_decision_event.1323.a: "Como veis, si movemos este número aquí…"
 gdp_visit_holding_decision_event.1323.a.success: "Resuelves la ecuación"
 gdp_visit_holding_decision_event.1323.a.failure: "No logras resolver la ecuación"
 gdp_visit_holding_decision_event.1323.b: "¿No preferiríais hacer esto mismo para #EMP mi#! compañía?"
 gdp_visit_holding_decision_event.1323.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ Se necesita [numerate_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [numerate_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1323.c: "Pensándolo mejor…"
 gdp_visit_holding_decision_event.1324.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1324.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1324.t: "El viajero veterano"
 gdp_visit_holding_decision_event.1324.desc: "La tensión entre los dos comerciantes ha llegado a un punto crítico. Empleando gestos sosegados, [traveler_recruit.GetFirstName] trata de calmar los ánimos. A pesar de su pobre dominio del [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetLanguage.GetName], consigue tener cierto éxito. El esfuerzo es admirable para alguien que no tiene familiaridad alguna con la cultura local.\n\nSin embargo, ningún comerciante puede determinar si se refiere a la calidad, a las mercancías o a algo totalmente distinto, y la disputa acaba en punto muerto."
 gdp_visit_holding_decision_event.1324.a: "«Dejadme que intente mediar»."
 gdp_visit_holding_decision_event.1324.a.success: "Tu interpretación es convincente"
 gdp_visit_holding_decision_event.1324.a.failure: "Tu interrupción no es bienvenida"
 gdp_visit_holding_decision_event.1324.b: "Me vendría bien alguien con vuestra experiencia."
 gdp_visit_holding_decision_event.1324.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ Se necesita [traveler_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [traveler_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1324.c: "No me molestaré…"
 gdp_visit_holding_decision_event.1325.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1325.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1325.t: "[urchin_recruit.Custom('ES_ElLa')|U] golf[urchin_recruit.Custom('ES_OA')]"
 gdp_visit_holding_decision_event.1325.desc: "Ya he visto este numerito muchas veces, así que sé cómo acercarme [urchin_recruit.Custom('ES_AlAla')] [urchin_recruit.Custom('GirlBoy')] con tacto. Antes de que hable, un frágil brazo me lanza el bulto a las manos.\n\n«Por favor, amable [ROOT.Char.GetWomanMan], ¿podría darme un poco de comida para el bebé y para mí?».\n\nSu otra mano ya está tanteando mi bolsa. El bulto se me desliza y cae al suelo, revelando tres rocas envueltas en una manta, como sospechaba. El engaño era obvio, pero hay que reconocerle su astucia."
 gdp_visit_holding_decision_event.1325.a: "¡Quita esa mano de mi bolsa ya mismo!"
 gdp_visit_holding_decision_event.1325.a.success: "Atrapas al ladrón"
 gdp_visit_holding_decision_event.1325.a.failure: "Demasiado lento"
 gdp_visit_holding_decision_event.1325.b: "A mi compañía le vendría bien un par de manos ágiles."
 gdp_visit_holding_decision_event.1325.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ Se necesita [urchin_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [urchin_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1325.c: "¡Ya es suficiente!"
 gdp_visit_holding_decision_event.1326.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1326.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1326.t: "[herbalist_recruit.Custom('ES_ElLa')|U] herborista"
 gdp_visit_holding_decision_event.1326.desc: "[herbalist_recruit.GetFirstName] no me presta atención cuando me acerco. Está concentrad[herbalist_recruit.Custom('ES_OA')] en los movimientos del mortero con el que tritura los ingredientes para convertirlos en una mezcla ambigua.\n\n«Un poco de [ROOT.Char.Custom('Abortifacient')], y quizás algo de [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')], y luego tal vez lo deje hervir para hacer [ROOT.Char.Custom('RegionalDrink')]. Sí... Con eso bastaría, ¿no?».\n\nTeniendo apenas en cuenta mi presencia, se gira hacia mí y acerca el mortero a mi nariz. Un fuerte olor me golpea."
 gdp_visit_holding_decision_event.1326.a: " #EMP Mmm#!, si se me permite la sugerencia, ¿qué tal si se le añade [ROOT.Char.Custom('Abortifacient')]?"
 gdp_visit_holding_decision_event.1326.a.success: "Tu sugerencia ha sido útil"
 gdp_visit_holding_decision_event.1326.a.failure: "Tu sugerencia no ha sido útil"
 gdp_visit_holding_decision_event.1326.b: "Me vendría bien alguien con vuestras habilidades."
 gdp_visit_holding_decision_event.1326.b.tt: "$gdp_visit_holding_decision_event.1320.no_gold.tt$ Se necesita [herbalist_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [herbalist_recruit.GetFirstNameNoTooltip] "
 gdp_visit_holding_decision_event.1326.c: "Creo que esto no es para mí."
 gdp_visit_holding_decision_event.1330.t: "[monk.Custom('ES_ElLa')|U] monj[monk.Custom('ES_EA')]"
 gdp_visit_holding_decision_event.1330.desc: "En una tranquila esquina de un salón del té local me encuentro a un[monk.Custom('ES_XA')] monj[monk.Custom('ES_EA')] adivinando el significado de los tallos de milenrama que tiene ante [monk.Custom('ES_ElElla')], con su mesa iluminada por la luz de las velas. Me mira, notando mi interés.\n\n«¿Eres discípul[ROOT.Char.Custom('ES_OA')] del oráculo, amig[ROOT.Char.Custom('ES_OA')]? Si tu mente es abierta y honesta, el Camino tiene mucho que mostrarte»."
 gdp_visit_holding_decision_event.1330.desc_returned_01: "El salón de té está más vacío que antes. [monk.GetFirstName] sigue sentad[monk.Custom('ES_OA')] con la milenrama ante [monk.Custom('ES_ElElla')], y la vela más consumida que antes.\n\n[monk.GetSheHe|U] no alza la mirada."
 gdp_visit_holding_decision_event.1330.desc_returned_02: "[monk.GetFirstName] está barriendo las ramas con un trapo cuando regreso. La vela vacila.\n\n«Persistente», dice. «Al Camino no le importa que hagáis una segunda visita. ¿Y a vos?»."
 gdp_visit_holding_decision_event.1330.a: "A mi compañía le vendría bien alguien con conocimientos."
 gdp_visit_holding_decision_event.1330.a.tt: "Se necesita [monk_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [monk.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1330.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1330.b: "Decidme lo que habéis estado estudiando."
 gdp_visit_holding_decision_event.1330.c: "Sé alguna que otra cosa sobre el cielo."
 gdp_visit_holding_decision_event.1330.c.success: "Has impresionado a [monk.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1330.c.failure: "[monk.GetFirstName] se aleja, no has conseguido impresionarle"
 gdp_visit_holding_decision_event.1330.d: "Puede que en otra ocasión."
 gdp_visit_holding_decision_event.1333.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1333.t: "[caravaneer.Custom('ES_ElLa')|U] caravaner[caravaneer.Custom('ES_OA')] veteran[caravaneer.Custom('ES_OA')]"
 gdp_visit_holding_decision_event.1333.desc: "Los dromedarios se apiñan en el escaso refugio que les ofrecen sus corrales. Procedentes de la manada, se oye algún gruñido ocasional, las pisadas de las pezuñas y lo que parecen ser… ¿#EMP ronquidos#!?\n\nAl mirar más de cerca, veo a un[caravaneer.Custom('ES_XA')] caravaner[caravaneer.Custom('ES_OA')] dormid[caravaneer.Custom('ES_OA')] junto a sus alforjas. Se despierta al oír que me aproximo y rápidamente se pone en pie, limpiándose la baba que le corre por la cara.\n\nSe pone a dar explicaciones: «Os aseguro que el dueño del establo sabe que estoy aquí. Nunca dejo solos a mis animales, por su seguridad, y por mi tranquilidad»."
 gdp_visit_holding_decision_event.1333.desc_returned_01: "Los dromedarios siguen apiñados en el corral. Esta vez, [caravaneer.GetFirstName] está despiert[caravaneer.Custom('ES_OA')], y con una mano sostiene la cincha de su montura.\n\nTe mira por encima del hombro: «Vos otra vez»."
 gdp_visit_holding_decision_event.1333.desc_returned_02: "Se oye un gruñido procedente del corral, y luego la voz de [caravaneer.GetFirstName]: «Si habéis venido a mirar, los animales cobran el doble».\n\nAhora está sentad[caravaneer.Custom('ES_OA')] encima de las alforjas, completamente vestid[caravaneer.Custom('ES_OA')], esperando para ver si quiero hablar»."
 gdp_visit_holding_decision_event.1333.a: "«Mantendré a vuestros animales protegidos»."
 gdp_visit_holding_decision_event.1333.a.tt: "Se necesita [caravaneer_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [caravaneer.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1333.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1333.b: "«¿Qué noticias hay de los caminos?»."
 gdp_visit_holding_decision_event.1333.b.cooldown.tt: "Has preguntado sobre los caminos hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1333_gained_caravaneer_xp_recently') )]"
 gdp_visit_holding_decision_event.1333.c: "«Alguna cosa sé sobre organización de caravanas…»."
 gdp_visit_holding_decision_event.1333.c.success: "Impresionas a [caravaneer.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1333.c.failure: "[caravaneer.GetFirstName] coge a sus animales y se va"
 gdp_visit_holding_decision_event.1333.d: "Puede que en otra ocasión."
 gdp_visit_holding_decision_event.1334.t_docks: "$gdp_visit_holding_decision_event.1400.t$:"
 gdp_visit_holding_decision_event.1334.t: "[Select_CString( sea_captain.IsFemale, 'La capitana', 'El capitán')] del barco"
 gdp_visit_holding_decision_event.1334.desc: "En el muelle, un grupo de mujeres y hombres se acumulan en torno a un[sea_captain.Custom('ES_XA')] mariner[sea_captain.Custom('ES_OA')] veteran[sea_captain.Custom('ES_OA')] con la esperanza de conseguir pasaje a bordo de su nave.\n\nDescubro a un par de transeúntes susurrando: «¡Llegamos tarde! [sea_captain.Custom('ES_ElLa')|U] [sea_captain.GetTitledFirstName|l] no tendrá sitio para nosotros». En lugar de dirigirse a otro marinero, prefieren esperar a su siguiente llegada.\n\n¿Quién es exactamente est[sea_captain.Custom('ES_EA')] [sea_captain.GetWomanMan], y eso que tintinea en el interior de su pata de palo es #EMP oro#!?"
 gdp_visit_holding_decision_event.1334.desc_returned_01: "La multitud que rodeaba a [sea_captain.GetFirstName] casi se ha dispersado. [sea_captain.GetSheHe|U] está metiendo monedas en su pata de palo, una a una, mientras las últimas personas que han acudido a pedirle algo se marchan.\n\nNi se molesta en girarse. «No esperaba veros de nuevo»."
 gdp_visit_holding_decision_event.1334.desc_returned_02: "Un rezagado llega y [sea_captain.Custom('ES_ElLa')] [sea_captain.GetTitledFirstName|l] le hace señas para que se dirija a otro barco. La pata golpea los tablones de madera cuando se gira.\n\n«Otra vez aquí. ¿Queríais un camarote o es a mí a quien estáis buscando?»."
 gdp_visit_holding_decision_event.1334.a: "«Puedo pagar el doble que cualquiera de estos»."
 gdp_visit_holding_decision_event.1334.a.tt: "Se necesita [sea_captain_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [sea_captain.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1334.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1334.b: "«¿Me contáis alguna historia?»."
 gdp_visit_holding_decision_event.1334.b.cooldown.tt: "Has escuchado la historia de [Select_CString( sea_captain.IsFemale, 'una capitana', 'un capitán')] hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1334_gained_traveler_xp_recently') )]"
 gdp_visit_holding_decision_event.1334.c: "«Comerciar con artículos es un negocio mucho más lucrativo»."
 gdp_visit_holding_decision_event.1334.c.success: "[sea_captain.GetFirstNameNoTooltip] se convence"
 gdp_visit_holding_decision_event.1334.c.failure: "[sea_captain.GetFirstNameNoTooltip] se aleja"
 gdp_visit_holding_decision_event.1334.d: "Puede que en otra ocasión."
 gdp_visit_holding_decision_event.1335.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1335.t: "[Select_CString( carnival_jester.IsFemale, 'Bufona', 'Bufón')] de carnaval"
 gdp_visit_holding_decision_event.1335.desc: "Un público entusiasmado rodea a un[carnival_jester.Custom('ES_XA')] [carnival_jester.GetWomanMan] que actúa en una esquina de la calle, atrayendo a los compradores de los puestos de venta cercanos y haciendo que la actividad del mercado se detenga.\n\n[carnival_jester.Custom('ES_ElLa')|U] artista extiende los brazos y dice: «Mirad, todos los que me decíais que mis trucos no funcionarían si no es en la penumbra del carnaval. Yo, a diferencia de vosotros, no necesito ocultarme tras ninguna máscara»."
 gdp_visit_holding_decision_event.1335.desc_returned_01: "La misma esquina, con una multitud más reducida. [carnival_jester.GetFirstName] termina una acrobacia, se da cuenta de mi presencia y extiende sus brazos como si formase parte de la actuación.\n\n«¿Otra?»."
 gdp_visit_holding_decision_event.1335.desc_returned_02: "[carnival_jester.GetFirstName] está guardando sus bártulos en un saco de tela.\n\n«Empiezo a pensar que soy yo a quien estáis buscando»."
 gdp_visit_holding_decision_event.1335.a: "«Mi compañía necesita astucia como la vuestra»."
 gdp_visit_holding_decision_event.1335.a.tt: "Se necesita [carnival_jester_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [carnival_jester.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1335.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1335.b: "«Habladme más sobre esos carnavales»."
 gdp_visit_holding_decision_event.1335.b.cooldown.tt: "Has preguntado sobre los carnavales hace poco; prueba de nuevo tras [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1335_gained_creditor_xp_recently') )]"
 gdp_visit_holding_decision_event.1335.c: "«¿Seguro que no tenéis nada más que probar aquí?»."
 gdp_visit_holding_decision_event.1335.c.success: "[carnival_jester.GetFirstNameNoTooltip] se convence"
 gdp_visit_holding_decision_event.1335.c.failure: "[carnival_jester.GetFirstName] recoge sus cosas y se va"
 gdp_visit_holding_decision_event.1335.d: "Puede que en otra ocasión."
 gdp_visit_holding_decision_event.1336.t_market: "$gdp_visit_holding_decision_event.1300.t$:"
 gdp_visit_holding_decision_event.1336.t: "[Select_CString( cook.IsFemale, 'La repostera', 'El repostero')]"
 gdp_visit_holding_decision_event.1336.desc_intro: "El dulce olor a [ROOT.Char.Custom('FavoriteTreat')] reciente del horno llega de un puesto cercano en el mercado. Cestas llenas de productos horneados se apilan en todas las superficies disponibles.\n\n[cook.Custom('ES_ElLa')|U] [cook.GetWomanMan] a quien pertenece la tienda permanece al lado, con las manos en la cabeza. Cuando me ve, dice:"
 gdp_visit_holding_decision_event.1336.desc_named_noble: "«Solía trabajar para [local_noble.Custom('ES_ElLa')] [local_noble.GetTitledFirstNameNoTooltip|l], pero ahora está \"controlando su silueta\" y ya no le hago ninguna falta». Se muerde los labios. «Quizá un[ROOT.Char.Custom('ES_XA')] comerciante como vos podría vender esto. Porque lo que es a mí… simplemente no me dan las horas del día»."
 gdp_visit_holding_decision_event.1336.desc_unknown_noble: "«No creo que vengan a buscarme. ¡Y tengo más de lo que puedo llegar a vender!»."
 gdp_visit_holding_decision_event.1336.desc_returned_01: "El puesto huele aún a [ROOT.Char.Custom('FavoriteTreat')]. [cook.GetFirstName] está empaquetando otro lote para un extraño que no ha pagado.\n\nCuando me ve, suspira. «Todavía no han venido a solicitar mis servicios. No puedo seguir regalando el producto»."
 gdp_visit_holding_decision_event.1336.desc_returned_02: "Ya quedan menos cestas. [cook.GetFirstName] se inclina sobre el mostrador, con las mangas llenas de harina, observando cómo se llevan las últimas hogazas.\n\n«Si necesitáis a un[cook.Custom('ES_XA')] reposter[cook.Custom('ES_OA')]», dice, «decidlo antes de que se vacíe el puesto»."
 gdp_visit_holding_decision_event.1336.a: "«Mi compañía tiene muchas bocas que alimentar»."
 gdp_visit_holding_decision_event.1336.a.tt: "Se necesita [cook_recruit_cost|V0] de [gold|El] @gold_icon! para reclutar a [cook.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt: "[TARGET_CHARACTER.Custom('GetVisitHoldingRareRecruitAptitudeLine')]"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_first: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.recruit_benefits.tt_third: "$gdp_visit_holding_decision_event.1336.recruit_benefits.tt$"
 gdp_visit_holding_decision_event.1336.b: "Enseñadme cómo haríais para mantener a una compañía alimentada."
 gdp_visit_holding_decision_event.1336.c: "A ver a quién se le da mejor la cocina."
 gdp_visit_holding_decision_event.1336.c.success: "Has impresionado a [cook.GetFirstNameNoTooltip]"
 gdp_visit_holding_decision_event.1336.c.failure: "[cook.GetFirstName] cierra el puesto y se va"
 gdp_visit_holding_decision_event.1336.d: "Puede que en otra ocasión."
