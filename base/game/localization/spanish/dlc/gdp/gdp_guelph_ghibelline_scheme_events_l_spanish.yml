l_spanish:
 #Look! Isn't my side great!
 gdp_guelph_ghibelline_scheme.1000.t: "[scheme.GetNameNoTooltip]: lo que se pierde"
 gdp_guelph_ghibelline_scheme.1000.desc: "Me hallo en la feria anual de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], donde la alegría y la camaradería son palpables.\n\nEl barullo de los revoltosos festejos, los adornos de telas de colores brillantes y el olor de todo delicioso plato [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjectiveNoTooltip] flotan en las calles; una delicia para mis sentidos agotados.\n\nEs una coincidencia que me tope con [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l], quien mira con ansias un puesto de mercado cercano, y veo una oportunidad para poner a trabajar mis encantos."
 gdp_guelph_ghibelline_scheme.1000.a: "«Sabéis que los #EMP [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l]#! quisieron prohibir estos festejos, ¿no?»."
 gdp_guelph_ghibelline_scheme.1000.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1000.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1000.a.desc.success: "Logras argumentar sobre la mala voluntad de los [ROOT.Char.Custom('GuelphsGhibellinesGetOpposite')|l]"
 gdp_guelph_ghibelline_scheme.1000.a.desc.failure: "[target.GetShortUIName] no te hace ni caso"
 gdp_guelph_ghibelline_scheme.1000.b: "«¡Esta insignia os quedaría estupenda, amig[target.Custom('ES_OA')]!»."
 gdp_guelph_ghibelline_scheme.1000.c: "No tengo por qué intervenir."
 #Turn the partisans against the current leader
 gdp_guelph_ghibelline_scheme.1010.t: "[scheme.GetNameNoTooltip]: se rumorea…"
 gdp_guelph_ghibelline_scheme.1010.desc: "Mis informantes me dicen que [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l], nuestr[target.Custom('ES_OA')] #EMP estimad[target.Custom('ES_OA')]#! líder del bando [ROOT.Char.Custom('GetGuelphGhibelline')|l], parecía en cierta forma abrumad[target.Custom('ES_OA')] últimamente, al tener que cargar con el peso de su oneroso deber.\n\nUnas cuantas cartas enviadas a los partisanos adecuados podrían ayudar a confirmar esta impresión y sugerir que necesitamos a alguien más #EMP merecedor#! de soportar dicha carga."
 gdp_guelph_ghibelline_scheme.1010.a: "Redactad esas cartas de inmediato."
 gdp_guelph_ghibelline_scheme.1010.a.tt: "Las probabilidades de éxito están modificadas por tu [gg_involvement|El] @gg_involvement_icon! (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1010.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1010.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1010.a.desc.success: "Tus cartas convencen a muchos [ROOT.Char.Custom('GetGuelphsGhibellines')|l] de tu liderazgo superior"
 gdp_guelph_ghibelline_scheme.1010.a.desc.failure: "Tus cartas hacen más daño a tu causa que bien"
 gdp_guelph_ghibelline_scheme.1010.b: "¡Cualquiera de la casa [ROOT.Char.GetHouse.GetName] sería un gran líder!"
 gdp_guelph_ghibelline_scheme.1010.c: "¿Quién decide qué es siquiera verdad?"
 #Have an agent at the target's court assist your scheme
 gdp_guelph_ghibelline_scheme.1020.t: "[scheme.GetNameNoTooltip]: pico de oro"
 gdp_guelph_ghibelline_scheme.1020.intro.replace_ruler: "Parece que mi agente, [court_agent.Custom('ES_ElLa')] [court_agent.GetTitledFirstName|l], se ha ganado la atención de un grupo de cortesanos desdeñados y disidentes en la corte [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l]"
 gdp_guelph_ghibelline_scheme.1020.intro.claim_leadership: "Parece que mi agente, [court_agent.Custom('ES_ElLa')] [court_agent.GetTitledFirstName|l], ha encontrado oídos simpatizantes entre el descontento de los [target.Custom('GetGuelphsGhibellines')|l] con el liderazgo [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l]."
 gdp_guelph_ghibelline_scheme.1020.intro: "Parece que mi agente, [court_agent.Custom('ES_ElLa')] [court_agent.GetTitledFirstName|l], se ha ganado la atención [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l]."
 gdp_guelph_ghibelline_scheme.1020.segway: "\n\nLlevo retraso en mi correspondencia más reciente con [court_agent.Custom('ES_ElLa')] [court_agent.GetTitledFirstNameNoTooltip|l], ¿qué sería mejor?;"
 gdp_guelph_ghibelline_scheme.1020.outro.replace_ruler: "¿hablar con estos agitadores locales para impulsar nuestros planes?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_character: "¿enviar[court_agent.Custom('ES_LoLa')] a azuzar las dudas de los agitadores sobre [target.GetFirstNameNoTooltip]?"
 gdp_guelph_ghibelline_scheme.1020.outro.promote_scheme: "¿aprovechar la oportunidad y que [court_agent.GetSheHe] abogue por los [ROOT.Char.Custom('GetGuelphsGhibellines')|l] ante [target.Custom('ES_ElLa')] [target.GetTitleAsNameNoTooltip|l]?"
 gdp_guelph_ghibelline_scheme.1020.a: "Mejor aprovechar mis ventajas."
 gdp_guelph_ghibelline_scheme.1020.b: "Empleemos a estos… truhanes."
 gdp_guelph_ghibelline_scheme.1020.c: "[court_agent.Custom('ES_ElLa')|U] [court_agent.GetTitledFirstNameNoTooltip|l] debe ganarse la manutención."
 gdp_guelph_ghibelline_scheme.1020.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1020.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1020.c.desc.success: "[court_agent.GetShortUIName] tiene éxito a la hora de fomentar tus planes"
 gdp_guelph_ghibelline_scheme.1020.c.desc.failure: "[court_agent.GetShortUIName] no es muy convincente"
 gdp_guelph_ghibelline_scheme.1020.d: "[court_agent.GetSheHe|U] debe centrarse en mi reputación."
 gdp_guelph_ghibelline_scheme.1020.prestige: "Prestigio empañado"
 gdp_guelph_ghibelline_scheme.1020.prestige.desc: "Tu prestigio ha quedado algo empañado."
 gdp_guelph_ghibelline_scheme.1020.piety: "Piedad empañada"
 gdp_guelph_ghibelline_scheme.1020.piety.desc: "Tu piedad ha quedado algo empañada."
 gdp_guelph_ghibelline_scheme.1020.e: "¡Mi devoción habla por sí misma!"
 gdp_guelph_ghibelline_scheme.1020.f: "No debería intervenir."
 #Tarnish target's reputation
 gdp_guelph_ghibelline_scheme.1030.t: "[scheme.GetNameNoTooltip]: untando los engranajes"
 gdp_guelph_ghibelline_scheme.1030.desc: "Un asistente de toda la vida se apresura hacia mí mientras doy mi paseo matutino:\n\n«Mi [ROOT.Char.GetTitleAsNameNoTooltip|l], nuestros informadores en la corte [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l] nos cuentan que la habilidad de [ROOT.Char.Custom('DescribeTargetSkill')|l] [target.Custom('ES_DelDela')] [target.GetTitleAsNameNoTooltip|l] es risible, como poco.\n\n¿Hay algún modo de convertir esto en una ventaja…?"
 gdp_guelph_ghibelline_scheme.1030.desc.sly_character: "Mi [ROOT.Char.Custom2('RelationToMe', sly_character )], [sly_character.Custom('ES_ElLa')] [sly_character.GetTitledFirstName|l], se me acerca discret[sly_character.Custom('ES_OA')] mientras doy mi paseo matutino:\n\n«En nuestro intento por #EMP salvar#! [target.GetPrimaryTitle.GetDefinitiveName] de los necios [target.Custom('GetGuelphsGhibellines')|l]… ¿y si cuestionamos la habilidad de [ROOT.Char.Custom('DescribeTargetSkill')|l] de es[target.Custom('ES_EA')] [target.GetTitledFirstName|l]?\n\nPor lo que me han contado, parece bastante mediocre en ese aspecto»."
 gdp_guelph_ghibelline_scheme.1030.a: "«El trabajo se impondrá a los rumores»."
 gdp_guelph_ghibelline_scheme.1030.a.tt: "Las probabilidades de éxito están modificadas por tu [gg_involvement|El] @gg_involvement_icon! (#V [THIS.Char.MakeScope.Var('gg_involvement').GetValue]#!)"
 gdp_guelph_ghibelline_scheme.1030.t.success: "$board_games.0001.tt.success$"
 gdp_guelph_ghibelline_scheme.1030.t.failure: "$board_games.0001.tt.failure$"
 gdp_guelph_ghibelline_scheme.1030.b.desc.success: "Consigues socavar a [target.GetShortUIName|l]"
 gdp_guelph_ghibelline_scheme.1030.b.desc.failure: "Tus esfuerzos son en vano"
 gdp_guelph_ghibelline_scheme.1030.b: "«Debemos usar esto para socavar[target.GetHerHim] en su corte»."
 gdp_guelph_ghibelline_scheme.1030.c: "«Alimentemos esos rumores»."
 gdp_guelph_ghibelline_scheme.1030.d: "«No veo que debamos»."
 #Coax Side Switch Outcomes
 scheme_critical_moments.1262.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.1262.desc: "¡Qué gran éxito! [target.Custom('ES_ElLa')|U] [target.GetTitledFirstName|l] al fin ha entrado en razón y ahora se pone de nuestra parte como un[target.Custom('ES_XA')] integrante más del bando [owner.Custom('GetGuelphGhibelline')|l].\n\nSabía que al final recapacitaría."
 scheme_critical_moments.1262.a: "¡Espectacular!"
 scheme_critical_moments.1263.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.1263.desc: "#EMP Qué gente.#! Para nuestra frustración compartida, por mucho que he intentado razonar, debatir y convencer [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l], insiste en que los [target.Custom('GetGuelphsGhibellines')|l] tienen razón.\n\nNi que decir tiene que esta vez #EMP no#! nos separamos amistosamente."
 scheme_critical_moments.1263.a: "¡#EMP [owner.Custom('InsultNounDumb')]#!!"
 #Claim Leadership Outcomes
 scheme_critical_moments.1272.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.1272.desc: "¡Toca celebrarlo! Uno a uno, los [owner.Custom('GetGuelphsGhibellines')|l] están retirando su apoyo [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l], y en lugar de ello, me buscan a mí para que los guíe.\n\n[target.GetSheHe|U] no puede hacer otra cosa que apartarse a un lado."
 scheme_critical_moments.1272.a: "¡Espléndido!"
 scheme_critical_moments.1273.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.1273.desc: "A pesar de nuestros esfuerzos, [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] sigue firmemente al frente de los [owner.Custom('GetGuelphsGhibellines')|l], y todo el apoyo que yo había conseguido reunir se ha marchitado y desvanecido."
 scheme_critical_moments.1273.desc.secret: "\n\nAl menos, todavía no sabe nada de mis planes."
 scheme_critical_moments.1273.desc.discovered: "\n\nPeor aún, sabe que estuve detrás de ello, y probablemente no se le olvide."
 scheme_critical_moments.1273.a: "Tch, tch…"
 #Align Undecided Outcomes
 scheme_critical_moments.1282.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.1282.desc: "¡Qué gran éxito! [target.Custom('ES_ElLa')|U] [target.GetTitledFirstName|l] al fin ha entrado en razón y ahora se pone de nuestra parte como un[target.Custom('ES_XA')] integrante más del bando [owner.Custom('GetGuelphGhibelline')|l].\n\nSabía que al final recapacitaría."
 scheme_critical_moments.1282.a: "¡Espectacular!"
 scheme_critical_moments.1283.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.1283.desc: "#EMP Qué gente.#! Para nuestra frustración compartida, por mucho que he intentado razonar, debatir y convencer [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l], insiste en que los [target.Custom('GetGuelphsGhibellines')|l] tienen razón.\n\nNi que decir tiene que esta vez #EMP no#! nos separamos amistosamente."
 scheme_critical_moments.1283.a: "¡#EMP [owner.Custom('InsultNounDumb')]#!!"
 #Replace Ruler Outcomes
 scheme_critical_moments.1292.t: "[scheme.GetNameNoTooltip]: éxito"
 scheme_critical_moments.1292.desc.intro: "Noticias excelentes: ¡se reemplazará [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l] por un[target_character.Custom('ES_XA')] [target_character.GetTitledFirstName|l], más complaciente!"
 scheme_critical_moments.1292.desc.intro.unknown: "Noticias excelentes: ¡se reemplazará [target.Custom('ES_AlAla')] [target.GetTitledFirstName|l] por alguien más leal a la causa!"
 scheme_critical_moments.1292.desc: "\n\nUna muesca más en el arma de los [ROOT.Char.Custom('GetGuelphsGhibellines')|l], ahora podemos descansar tranquilos sabiendo que se gobernará [target.GetPrimaryTitle.GetDefinitiveName] con justicia y rectitud."
 scheme_critical_moments.1292.desc.discovered: "\n\nSin embargo, mi implicación no ha pasado desapercibida, así que a partir de ahora tendré que cuidarme las espaldas…"
 scheme_critical_moments.1292.a: "¡Así se habla!"
 scheme_critical_moments.1293.t: "[scheme.GetNameNoTooltip]: fracaso"
 scheme_critical_moments.1293.desc: "Tanto planificar…\n\n#EMP Alguien cometió un error en alguna parte.#! Descubriré quién fue, pero entre tanto es innegable que [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] se me ha escapado esta vez. Tendremos que conformarnos con el delirante gobierno [target.Custom('GetGuelphGhibelline')|l] de [target.GetPrimaryTitle.GetDefinitiveName] durante un poco más."
 scheme_critical_moments.1293.a: "¡#EMP Maldición#!!"
