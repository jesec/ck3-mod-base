l_spanish:
 gdp_republic_unrest.0001.t: "Levantamiento capital: los agravios"
 gdp_republic_unrest.0001.desc: "Un grupo de trabajadores y jornaleros de los gremios se ha reunido en el patio. Uno de ellos da un paso adelante: «Mi [ROOT.Char.GetLadyLord], los impuestos nos arruinan…».\n\nYa lo he oído antes. No son los primeros, ni los últimos en traer estas quejas a mi puerta."
 # Option A: Disperse
 gdp_republic_unrest.0001.a: "¡Guardias! Libraos de esta… gente."
 # Option B: Refuse demands
 gdp_republic_unrest.0001.b: "No negociaré con campesinos."
 gdp_republic_unrest.0001.b.success: "Se dispersan sin mayores problemas"
 gdp_republic_unrest.0001.b.success.toast: "$gdp_republic_unrest.0001.b.success$"
 gdp_republic_unrest.0001.b.fail: "El rechazo les enfurece"
 gdp_republic_unrest.0001.b.fail.toast: "$gdp_republic_unrest.0001.b.fail$"
 # Option C: Refer to council
 gdp_republic_unrest.0001.c: "Que el consejo se ocupe."
 gdp_republic_unrest.0001.c.success: "Quedan convencidos, por ahora"
 gdp_republic_unrest.0001.c.success.toast: "$gdp_republic_unrest.0001.c.success$"
 gdp_republic_unrest.0001.c.fail: "El retraso es evidente para todos"
 gdp_republic_unrest.0001.c.fail.toast: "$gdp_republic_unrest.0001.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0001.d: "Esta vez haré una concesión."
 ### 0011 - The Cold Reception
 gdp_republic_unrest.0011.t: "Levantamiento capital: la fría recepción"
 gdp_republic_unrest.0011.desc: "Cuando recorro los mercados oigo la cháchara ruidosa de siempre, pero algo parece distinto de lo normal. Los puestos se quedan en silencio, igual que la gente, que se limita a mirarme de forma incómoda.\n\nLlevo años recorriendo estas calles y jamás había sido así."
 gdp_republic_unrest.0011.a: "Seguramente todo esté en mi cabeza."
 gdp_republic_unrest.0011.b: "Enviad a alguien a rastrear los rumores."
 gdp_republic_unrest.0011.b.success: "Mi gente rastrea el origen"
 gdp_republic_unrest.0011.b.success.toast: "$gdp_republic_unrest.0011.b.success$"
 gdp_republic_unrest.0011.b.fail: "Los rumores continúan"
 gdp_republic_unrest.0011.b.fail.toast: "$gdp_republic_unrest.0011.b.fail$"
 gdp_republic_unrest.0011.c: "Me pararé a hablar con la gente."
 gdp_republic_unrest.0011.c.success: "La gente agradece el gesto"
 gdp_republic_unrest.0011.c.success.toast: "$gdp_republic_unrest.0011.c.success$"
 gdp_republic_unrest.0011.c.fail: "Nadie quiere hablar"
 gdp_republic_unrest.0011.c.fail.toast: "$gdp_republic_unrest.0011.c.fail$"
 gdp_republic_unrest.0011.d: "Repartid comida y vino, lo que haga falta."
 ### 0021 - The Anonymous Letter
 gdp_republic_unrest.0021.t: "Levantamiento capital: el anónimo"
 gdp_republic_unrest.0021.desc: "Una carta me espera en el escritorio cuando llego esta mañana. Sin sello ni nombre. Quien sea se toma gran cuidado en describirme cuánto ha empeorado [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] desde que me convertí en [ROOT.Char.GetTitleAsName|l]"
 gdp_republic_unrest.0021.a: "Al fuego va."
 gdp_republic_unrest.0021.b: "Alguien ha trabajado para hacer esto. Encontrad quién fue."
 gdp_republic_unrest.0021.b.success: "Se ha identificado al autor"
 gdp_republic_unrest.0021.b.success.toast: "$gdp_republic_unrest.0021.b.success$"
 gdp_republic_unrest.0021.b.fail: "El autor sigue siendo desconocido"
 gdp_republic_unrest.0021.b.fail.toast: "$gdp_republic_unrest.0021.b.fail$"
 gdp_republic_unrest.0021.c: "Daré una respuesta pública."
 gdp_republic_unrest.0021.c.success: "La respuesta es bien recibida"
 gdp_republic_unrest.0021.c.success.toast: "$gdp_republic_unrest.0021.c.success$"
 gdp_republic_unrest.0021.c.fail: "Aborrecen la respuesta"
 gdp_republic_unrest.0021.c.fail.toast: "$gdp_republic_unrest.0021.c.fail$"
 ###
 # Severity 2: The Market Square is Occupied
 ###
 gdp_republic_unrest.0101.t: "Levantamiento capital: ahora la plaza les pertenece"
 gdp_republic_unrest.0101.desc: "«Mi [ROOT.Char.GetLadyLord], algunos ciudadanos han tomado el control de la plaza del mercado… desde hace días», me informa uno de mis guardias. «Parece que un[demagogue.Custom('ES_XA')] [demagogue.GetWomanMan] llamad[demagogue.Custom('ES_OA')] [demagogue.GetFirstName] incita a la gente a gritos».\n\n¿Para qué pago a estos necios si el mercado cierra durante días y nadie me lo cuenta?"
 # Option A: Disperse
 gdp_republic_unrest.0101.a: "¡Despejad la plaza ahora mismo!"
 # Option B: Discredit the ringleader (Intrigue)
 gdp_republic_unrest.0101.b: "Desacredita [demagogue.Custom('ES_AlAla')] demagog[demagogue.Custom('ES_OA')]."
 gdp_republic_unrest.0101.b.success: "[demagogue.GetFirstName] queda desprestigiad[demagogue.Custom('ES_OA')]"
 gdp_republic_unrest.0101.b.success.toast: "$gdp_republic_unrest.0101.b.success$"
 gdp_republic_unrest.0101.b.fail: "Mis intentos fracasan"
 gdp_republic_unrest.0101.b.fail.toast: "$gdp_republic_unrest.0101.b.fail$"
 # Option C: Address the crowd directly (Diplomacy)
 gdp_republic_unrest.0101.c: "Hablaré con [demagogue.GetSheHe] en persona."
 gdp_republic_unrest.0101.c.success: "La muchedumbre se dispersa"
 gdp_republic_unrest.0101.c.success.toast: "$gdp_republic_unrest.0101.c.success$"
 gdp_republic_unrest.0101.c.fail: "Me enfrento a burlas sonoras"
 gdp_republic_unrest.0101.c.fail.toast: "$gdp_republic_unrest.0101.c.fail$"
 # Option D: Make concessions
 gdp_republic_unrest.0101.d: "Les daré lo que quieren."
 ### 0111 - The Closed Quarter
 gdp_republic_unrest.0111.t: "Levantamiento capital: el barrio cerrado"
 gdp_republic_unrest.0111.desc: "Me informan de que [closed_district.GetType.CalcTriggeredName( ROOT.Char.GetCapitalLocation )] ha cerrado todo contacto. Se niegan a aceptar a nuestros recaudadores de impuestos y no escuchan a nuestros guardias."
 gdp_republic_unrest.0111.a: "Enviad unos guardias con los recaudadores."
 gdp_republic_unrest.0111.b: "Les pagaremos para que se vayan."
 gdp_republic_unrest.0111.b.success: "Consiguen lo que quieren"
 gdp_republic_unrest.0111.b.success.toast: "$gdp_republic_unrest.0111.b.success$"
 gdp_republic_unrest.0111.b.fail: "Se niegan a negociar"
 gdp_republic_unrest.0111.b.fail.toast: "$gdp_republic_unrest.0111.b.fail$"
 gdp_republic_unrest.0111.c: "Iré a hablar con ellos en persona."
 gdp_republic_unrest.0111.c.success: "Te escuchan"
 gdp_republic_unrest.0111.c.success.toast: "$gdp_republic_unrest.0111.c.success$"
 gdp_republic_unrest.0111.c.fail: "Se niegan a escuchar"
 gdp_republic_unrest.0111.c.fail.toast: "$gdp_republic_unrest.0111.c.fail$"
 gdp_republic_unrest.0111.d: "Ya se cansarán. Espero."
 ### 0121 - The Effigy
 gdp_republic_unrest.0121.t: "Levantamiento capital: el monigote"
 gdp_republic_unrest.0121.desc: "Cuando caminaba por la calle, me paro en seco ante una efigie fea vestida con algo que parecen mis ropas, colgada para que todos la vean. La muchedumbre guarda silencio; mira a la efigie y luego a mí.\n\n«¡Igualit[ROOT.Char.Custom('ES_OA')] que [ROOT.Char.Custom('ES_ElLa')] original!», grita alguien desde atrás y desde la multitud salen burlas ruidosas."
 gdp_republic_unrest.0121.a: "¡Bajadla! ¡AHORA!"
 gdp_republic_unrest.0121.a.flavor: "Me ocuparé de que nadie de aquí hable de lo que ha visto."
 gdp_republic_unrest.0121.b: "Encontrad quién está detrás."
 gdp_republic_unrest.0121.b.success: "Te has encargado de los organizadores"
 gdp_republic_unrest.0121.b.success.toast: "$gdp_republic_unrest.0121.b.success$"
 gdp_republic_unrest.0121.b.fail: "Eres incapaz de encontrar a los organizadores"
 gdp_republic_unrest.0121.b.fail.toast: "$gdp_republic_unrest.0121.b.fail$"
 gdp_republic_unrest.0121.c: "Me ocuparé públicamente de esto."
 gdp_republic_unrest.0121.c.success: "La gente escucha"
 gdp_republic_unrest.0121.c.success.toast: "$gdp_republic_unrest.0121.c.success$"
 gdp_republic_unrest.0121.c.fail: "La muchedumbre se burla y abuchea"
 gdp_republic_unrest.0121.c.fail.toast: "$gdp_republic_unrest.0121.c.fail$"
 gdp_republic_unrest.0121.d: "No se merece darle una respuesta."
 ###
 # Severity 3: The City is Burning
 ###
 gdp_republic_unrest.0201.t: "Levantamiento capital: la ciudad en llamas"
 gdp_republic_unrest.0201.desc: "Veo surgir el humo antes de que lleguen los guardias. «Mi [ROOT.Char.GetLadyLord], un[demagogue.Custom('ES_XA')] demagog[demagogue.Custom('ES_OA')] llamad[demagogue.Custom('ES_OA')] [demagogue.GetFirstName] ha convencido al pueblo para que le prenda fuego a uno de los distritos de la urbe».\n\n¿Qué le pasa a mi ciudad?"
 # Option A: Military crackdown
 gdp_republic_unrest.0201.a: "Despertad a toda la guarnición. Encargaos de esto."
 # Option B: Lead personally into the streets (Martial)
 gdp_republic_unrest.0201.b: "¡Preparad mi caballo!"
 gdp_republic_unrest.0201.b.success: "Los saqueadores se dispersan"
 gdp_republic_unrest.0201.b.success.toast: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.b.fail: "Tengo que volver corriendo al palacio"
 gdp_republic_unrest.0201.b.fail.toast: "$gdp_republic_unrest.0201.b.fail$"
 # Option C: Ride out alone and address the crowd (Diplomacy)
 gdp_republic_unrest.0201.c: "Me veré con ellos en la plaza."
 gdp_republic_unrest.0201.c.success: "$gdp_republic_unrest.0201.b.success$"
 gdp_republic_unrest.0201.c.success.toast: "$gdp_republic_unrest.0201.c.success$"
 gdp_republic_unrest.0201.c.fail: "La muchedumbre se vuelve contra mí"
 gdp_republic_unrest.0201.c.fail.toast: "$gdp_republic_unrest.0201.c.fail$"
 # Option D: Empty the treasury
 gdp_republic_unrest.0201.d: "Pagadles con el tesoro entero, si hace falta."
 ### 0211 - The Strike
 gdp_republic_unrest.0211.t: "Levantamiento capital: la huelga"
 gdp_republic_unrest.0211.desc: "Cuando paso por los mercados, la huelga es evidente. Nadie anuncia sus artículos, los puestos están vacíos y los talleres, en silencio.\n\nEstá claro que los gremios han tomado una decisión entre ellos y todos los trabajadores la secundan."
 gdp_republic_unrest.0211.a: "Traed a los maestros de los gremios para hablar."
 gdp_republic_unrest.0211.a.success: "Se llega a un acuerdo"
 gdp_republic_unrest.0211.a.success.toast: "$gdp_republic_unrest.0211.a.success$"
 gdp_republic_unrest.0211.a.fail: "Se niegan a presentarse"
 gdp_republic_unrest.0211.a.fail.toast: "$gdp_republic_unrest.0211.a.fail$"
 gdp_republic_unrest.0211.b: "Esta vez les untaremos."
 gdp_republic_unrest.0211.b.success: "Se acuerda un precio"
 gdp_republic_unrest.0211.b.success.toast: "$gdp_republic_unrest.0211.b.success$"
 gdp_republic_unrest.0211.b.fail: "Rechazan mi compromiso"
 gdp_republic_unrest.0211.b.fail.toast: "$gdp_republic_unrest.0211.b.fail$"
 gdp_republic_unrest.0211.c: "Haced que vuelvan al trabajo. Ya."
 gdp_republic_unrest.0211.d: "Cumplamos sus demandas."
 ### 0221 - The Manuscript
 gdp_republic_unrest.0221.t: "Levantamiento capital: el manuscrito"
 gdp_republic_unrest.0221.desc: "«Mi [ROOT.Char.GetLadyLord], ahora reparten… esto», me informa uno de mis guardias mientras me entrega un manuscrito. «Están por toda la ciudad».\n\nSe ha dedicado mucho trabajo tanto para insultarme personalmente como para acusarme de toda clase de pecados."
 gdp_republic_unrest.0221.a: "Encontrad y despachad a quien lo haya escrito."
 gdp_republic_unrest.0221.a.success: "Se encuentra a la fuente y se la silencia"
 gdp_republic_unrest.0221.a.success.toast: "$gdp_republic_unrest.0221.a.success$"
 gdp_republic_unrest.0221.a.fail: "El autor sigue siendo desconocido"
 gdp_republic_unrest.0221.a.fail.toast: "$gdp_republic_unrest.0221.a.fail$"
 gdp_republic_unrest.0221.b: "Lo rechazaré públicamente."
 gdp_republic_unrest.0221.b.success: "Las acusaciones empiezan a desvanecerse"
 gdp_republic_unrest.0221.b.success.toast: "$gdp_republic_unrest.0221.b.success$"
 gdp_republic_unrest.0221.b.fail: "La gente se mofa de mí"
 gdp_republic_unrest.0221.b.fail.toast: "$gdp_republic_unrest.0221.b.fail$"
 gdp_republic_unrest.0221.c: "Comprad todos los ejemplares."
 gdp_republic_unrest.0221.d: "Estas cosas acaban desapareciendo solas."
 ###
 # Severity 4: They Are at the Gates
 ###
 gdp_republic_unrest.0301.t: "Levantamiento capital: a las puertas"
 gdp_republic_unrest.0301.desc: "Despierto y varios guardias me informan de que hay una turba que viene hacia nosotros. Cuando recorro mis salones, contemplo lo vacíos que están… La mayoría de mis guardias me ha abandonado.\n\nMiro por la ventana y los veo acercarse lentamente; gritan y vitorean. La turba viene a por mí."
 # Option A: Last stand (Prowess)
 gdp_republic_unrest.0301.a: "Solo hay un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l]. ¡Venid a por [ROOT.Char.GetSheHe]!"
 gdp_republic_unrest.0301.a.success: "Los derribo hasta que todo lo que queda son mis manos temblorosas y un palacio silencioso manchado de sangre"
 gdp_republic_unrest.0301.a.fail: "Caigo ante la turba"
 # Option B: Fight your way out (Martial)
 gdp_republic_unrest.0301.b: "¡No me pillarán con vida!"
 gdp_republic_unrest.0301.b.success: "Mis hombres y yo nos abrimos paso a tajos"
 gdp_republic_unrest.0301.b.fail: "Nos superan en número"
 # Option C: Slip away in disguise (Intrigue)
 gdp_republic_unrest.0301.c: "Salir por la puerta de servicio."
 gdp_republic_unrest.0301.c.success: "Consigo escabullirme"
 gdp_republic_unrest.0301.c.fail: "Me han atrapado"
 # Option D: Retire publicly
 gdp_republic_unrest.0301.d: "Mi reinado ha acabado."
 gdp_republic_unrest.0301.d.flavor: "Salgo al balcón y anuncio mi retirada. Después salgo sin armas y rezo para que me dejen vivir."
 ###
 # 0302 - Survived the onslaught
 ###
 gdp_republic_unrest.0302.t: "Levantamiento capital: el gran silencio"
 gdp_republic_unrest.0302.desc: "El palacio está en silencio.\n\nNo se han llevado los cuerpos y las puertas siguen abiertas allá por donde huyeron los últimos rebeldes. Las manos casi ya no me tiemblan.\n\nSigo aquí."
 gdp_republic_unrest.0302.a: "Sigo… ¿con vida?"
 ###
 # 0303 - A merchant's new beginning
 ###
 gdp_republic_unrest.0303.t: "Levantamiento capital: un nombre nuevo, una vida nueva"
 gdp_republic_unrest.0303.desc: "Estoy viv[ROOT.Char.Custom('ES_OA')].\n\nAhora tengo la ciudad a mis espaldas y nadie en esta calle sabe quién soy. El título ha desaparecido, el palacio también y todo lo que me definió durante años ya no está.\n\nNo obstante, he sobrevivido y eso tiene que valer para algo. ¿Adónde voy ahora?"
 gdp_republic_unrest.0303.a: "A [destination_a.GetNameNoTierNoTooltip]. Aguarda un nuevo comienzo."
 gdp_republic_unrest.0303.a.tt: "Viajar y trasladar mi domicilio a [destination_a.GetNameNoTier]"
 gdp_republic_unrest.0303.b: "[destination_b.GetNameNoTierNoTooltip] está lo bastante lejos. Allí puedo recuperarme."
 gdp_republic_unrest.0303.b.tt: "Viajar y trasladar mi domicilio a [destination_b.GetNameNoTier]"
 gdp_republic_unrest.0303.c: "A algún lugar donde nadie sepa mi nombre. [destination_c.GetNameNoTierNoTooltip] servirá."
 gdp_republic_unrest.0303.c.tt: "Viajar y trasladar mi domicilio a [destination_c.GetNameNoTier]"
 gdp_republic_unrest.0303.d: "No tengo ningún sitio al que ir. Me quedaré e intentaré ser útil."
 gdp_republic_unrest.0303.tt: "Reembolsados todos los [domicile_buildings|El]"
 ###
 # 0304 - Patrician notification: the doge died
 ###
 gdp_republic_unrest.0304.t: "[old_doge.Custom('ES_ElLa')|U] [old_doge.GetTitleAsNameNoTooltip|l] ha caído"
 gdp_republic_unrest.0304.desc: "[old_doge.GetFirstName] ha muerto. Cayó durante la revuelta y el palacio ha quedado en silencio.\n\nA saber qué pasará después."
 gdp_republic_unrest.0304.a: "Esto lo cambia todo."
 ###
 # 0305 - Patrician notification: the doge vanished
 ###
 gdp_republic_unrest.0305.t: "[old_doge.Custom('ES_ElLa')|U] [old_doge.GetTitleAsNameNoTooltip|l] ha desaparecido"
 gdp_republic_unrest.0305.desc: "[old_doge.GetFirstName] se ha ido. Sin cuerpo, ni despedida, solo desapareció en la noche cuando la turba estaba a las puertas.\n\nA saber qué pasará después."
 gdp_republic_unrest.0305.a: "Esto lo cambia todo."
 gdp_republic_unrest.0306.t: "Levantamiento capital: una ciudad nueva, una vida nueva"
 gdp_republic_unrest.0306.desc: "El camino que hay a mis espaldas es largo e intento no mirar atrás.\n\nEste lugar aún no conoce mi nombre. Los mercados me resultan nuevos, los rostros más nuevos si cabe. Pero aquí hay monedas que ganar, alianzas que forjar y una vida que reconstruir a partir de lo poco que me ha quedado."
 gdp_republic_unrest.0306.a: "Es hora de ponerse a trabajar."
 ### 0311 - An Assassin in Broad Daylight
 gdp_republic_unrest.0311.t: "Levantamiento capital: un asesino en la plaza"
 gdp_republic_unrest.0311.desc: "Cuando recorro el mercado, la multitud se abre ante mí. La cháchara ruidosa enmudece. De repente veo una figura abalanzarse hacia mí, con un arma desenvainada.\n\nMis guardias están demasiado lejos para ayudar y solo tengo un momento para responder."
 gdp_republic_unrest.0311.a: "¡¿Dónde está mi espada?!"
 gdp_republic_unrest.0311.a.success: "Consigo defenderme a tiempo"
 gdp_republic_unrest.0311.a.fail: "Me alcanza antes de que lo hagan mis guardias"
 gdp_republic_unrest.0311.b: "Tengo que salir de aquí ya."
 gdp_republic_unrest.0311.b.success: "Consigo eludir [Select_CString(assassin.IsFemale, 'a la asesina', 'al asesino' )]"
 gdp_republic_unrest.0311.b.fail: "No hay donde escapar"
 ### 0312 - Survived the assassination attempt
 gdp_republic_unrest.0312.t: "Levantamiento capital: aún en pie"
 gdp_republic_unrest.0312.desc: "La muchedumbre ha huido en el caos y me encuentro, de algún modo, viv[ROOT.Char.Custom('ES_OA')].\n\nBajo la mirada al cadáver [assassin.Custom('ES_DelDela')] asesin[assassin.Custom('ES_OA')] después de que los guardias [assassin.GetHerHim] hayan atrapado y despachado. Parece un[assassin.Custom('ES_XA')] artesan[assassin.Custom('ES_OA')] más de la ciudad.\n\n¿Dónde estaré segur[ROOT.Char.Custom('ES_OA')] si hasta los ciudadanos normales intentan matarme?"
 gdp_republic_unrest.0312.a: "Tengo… tengo que ir a casa."
 ### 0321 - The Hostage
 gdp_republic_unrest.0321.t: "Levantamiento capital: sangre por sangre"
 gdp_republic_unrest.0321.desc: "Un mensajero se presenta en mi estudio de madrugada y me entrega una carta.\n\nUnos alborotadores de la ciudad han capturado a mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))], [heir.GetFirstName], y si no me he ido cuando llegue la mañana, mandarán su cadáver a la mansión."
 gdp_republic_unrest.0321.rival: "Que se [heir.GetHerHim] queden."
 gdp_republic_unrest.0321.a: "Movilizad a la guardia. Traed[heir.GetHerHim] de vuelta."
 gdp_republic_unrest.0321.heir_survives: "[heir.GetShortUIName|U] sobrevive"
 gdp_republic_unrest.0321.a.success: "Mis hombres [heir.GetHerHim] rescatan a tiempo"
 gdp_republic_unrest.0321.a.fail: "Llegan demasiado tarde"
 gdp_republic_unrest.0321.b: "Descubrid dónde [heir.GetHerHim] retienen."
 gdp_republic_unrest.0321.b.success: "Le siguen la pista"
 gdp_republic_unrest.0321.b.fail: "No consiguen encontrar[heir.GetHerHim]"
 gdp_republic_unrest.0321.c: "Tomad todas las monedas que tengo. Pero devolvédme[heir.GetHerHim]."
 gdp_republic_unrest.0321.d: "El título no significa nada sin [heir.GetFirstNameNoTooltip]."
 gdp_republic_unrest.0321.d.flavor: "Si le salva la vida, pagaré el precio."
 ### 0322 - Heir recovered
 gdp_republic_unrest.0322.t: "Levantamiento capital: a salvo"
 gdp_republic_unrest.0322.desc: "[heir.GetFirstNameNoTooltip] entra por la puerta de mi estudio, con una sonrisa algo temblorosa. Está bien, ha sobrevivido y eso es lo único que importa.\n\nDebo asegurarme de que esto no vuelva a pasar."
 gdp_republic_unrest.0322.desc.rival: "Un sirviente entra en mi estancia con noticias. [heir.GetFirstNameNoTooltip] ha regresado.\n\nBien, la sucesión sigue intacta, por ahora. Debo asegurarme de que esto no vuelva a pasar."
 gdp_republic_unrest.0322.a: "¡Oh, si has vuelto!"
 gdp_republic_unrest.0322.a.rival: "Bien. Ahora podemos volver al trabajo."
 ### 0323 - Heir died
 gdp_republic_unrest.0323.t: "Levantamiento capital: demasiado tarde"
 gdp_republic_unrest.0323.desc: "La llamada a la puerta llega después de anochecer. Oigo voces fuera, luego silencio.\n\nPara cuando llego al patio, ya lo sé. [heir.GetFirstNameNoTooltip] está allí, tendid[heir.Custom('ES_OA')] sobre la piedra. La turba ha enviado a casa lo que queda de [heir.GetSheHe]."
 gdp_republic_unrest.0323.desc.rival: "La llamada a la puerta llega después de anochecer. Para cuando llego al patio, ya lo sé.\n\n[heir.GetFirstNameNoTooltip] está allí, tendid[heir.Custom('ES_OA')] sobre la piedra. La turba ha enviado a casa lo que queda de [heir.GetSheHe]. Me quedo ahí un largo momento, mirando los restos de mi hereder[heir.Custom('ES_OA')]."
 gdp_republic_unrest.0323.a.child: "Mirad cómo han masacrado a mi [heir.Custom('GirlBoy')]…"
 gdp_republic_unrest.0323.a: "¿Qué te han hecho, [heir.GetFirstNameNoTooltip]?"
