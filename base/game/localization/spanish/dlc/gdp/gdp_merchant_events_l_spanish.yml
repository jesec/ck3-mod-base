l_spanish:
 gdp_merchant.0001.t: "Un camino pavimentado de oro"
 gdp_merchant.0001.desc: "Entro en el mercado local como un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] libre. Los gritos de los vendedores se oyen en cada rincón, mezclados con el repiqueteo y golpeteo de metales en los talleres vecinos. Allá donde miro hay carretas con cajas de [ROOT.Char.Custom('RegionalDrink')], rollos de [ROOT.Char.Custom('RegionalFabric')] y jaulas con una legión de ejemplares de [ROOT.Char.Custom('GetRandomRegionalBird')] trasladads de un lado a otro.\n\nEs aquí donde construiré mi dinastía."
 gdp_merchant.0001.heir: "$ep3_laamps.0030.heir$"
 gdp_merchant.0001.liege: "$ep3_laamps.0030.liege$"
 gdp_merchant.0001.new: "$ep3_laamps.0030.new$"
 gdp_merchant.0001.a: "¿Cuál será mi primera empresa comercial?"
 gdp_merchant.0002.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0002.desc: "Tras una cuidadosa reflexión, he elegido dedicarme a la vida de mercader. Estoy en los años más vigorosos de mi vida y mi ansia de viajar a tierras extranjeras me impulsa a actuar. Espero que un día podamos unirnos en un acuerdo comercial que nos beneficie a todos. Dejo [old_primary_title.GetBaseNameNoTierNoTooltip] en vuestras manos capaces."
 gdp_merchant.0002.a: "Un giro interesante de los acontecimientos."
 gdp_merchant.0010.t: "Asuntos familiares"
 gdp_merchant.0010.desc: "Tras terminar la reunión familiar de hoy, mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.Custom('ES_ElLa')] [associate.GetTitledFirstName|l], me hace señas con una mirada de determinación en su rostro.\n\n«¡Mi apreciad[ROOT.Char.Custom('ES_OA')] [associate.Custom2('RelationToMe', ROOT.Char)]!"
 gdp_merchant.0010.desc.starting: "He formado parte de esta compañía desde su nacimiento»,"
 gdp_merchant.0010.desc.starting_fallback: "Llevo ya un tiempo trabajando para esta familia»,"
 gdp_merchant.0010.desc.cont: "dice escogiendo las palabras con cuidado."
 gdp_merchant.0010.desc.children: "«Y como vuestr[heir.Custom('ES_OA')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] aún no es mayor de edad,"
 gdp_merchant.0010.desc.no_children: "«Y como no tenéis hijos adultos,"
 gdp_merchant.0010.desc.outro: "esperaba que pensaseis en adoptarme. Sería un honor para mí representar a la familia como miembr[associate.Custom('ES_OA')] de la casa»."
 gdp_merchant.0010.a: "«Siempre os he considerado como parte de mi gente»."
 merchant_adoption_event_tt: "[associate.GetShortUIName] pasa a formar parte de tu [house|El]"
 merchant_unity_adoption_loss: "asociado adoptado en la [house|El]"
 gdp_merchant.0010.b: "«Aún tenéis que demostrar vuestra valía»."
 gdp_merchant.0010.c: "«Ya os diré algo al respecto luego»."
 gdp_merchant.0015.t: "Un cara para el negocio"
 gdp_merchant.0015.desc: "Con la creación de mi [trade_route.GetNameNoTooltip|l], nuestro rumbo comercial ha quedado fijado.\n\nTodavía tengo que elegir a la persona que nos represente en nuestra nueva empresa. Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_1'))], [courtier_1.Custom('ES_ElLa')] [courtier_1.GetTitledFirstName|l], es un espíritu [courtier_1.Custom('quirk_pos_adjective')] de"
 gdp_merchant.0015.desc_good_intellect: "un intelecto razonable. Quién sabe, podría sorprendernos con algún talento oculto."
 gdp_merchant.0015.desc_excellent_intellect: "gran intelecto. Es fácil ver por qué la familia se siente tan orgullosa de [courtier_1.GetSheHe]."
 gdp_merchant.0015.desc_poor_intellect: "un intelecto escaso. Tal vez esta oportunidad sea un reto para que mejore sus habilidades."
 gdp_merchant.0015.a: "[courtier_1.GetFirstNameNoTooltip] podría ser la persona perfecta para la tarea…"
 gdp_merchant.0015.b: "… pero [courtier_2.GetFirstNameNoTooltip] podría ser más adecuad[courtier_2.Custom('ES_OA')]."
 gdp_merchant.0015.c: "Tengo que mantener mis talentos cerca."
 gdp_merchant.0015.c.fallback: "No. Debo tener aquí a todo el mundo."
 gdp_merchant.0015.c.tt: "Empiezas tu [trade_route|El] sin asignar un [trader|El]"
 gdp_merchant.0020.t: "Socio de negocios"
 gdp_merchant.0020.desc: "Quien dirige un negocio familiar vale tanto como el cuello que se estira para observar nuevas posibilidades."
 gdp_merchant.0020.desc.partner_exists: "Mi soci[old_holder.Custom('ES_OA')] [old_holder.GetFirstName], quien se supone que tiene que arrimar el hombro en esta tarea, ha estado malgastando sistemáticamente nuestro tiempo y oro en operaciones inútiles."
 gdp_merchant.0020.desc.fallback: "Ahora mismo no tengo contratado a nadie que cumpla esta función y ocupe un sitio a mi lado como socio."
 gdp_merchant.0020.desc.body: "La tensión en la compañía es palpable, lo que provoca discusiones y presunciones entre cualquiera con un ápice de ambición.\n\n"
 gdp_merchant.0020.desc.outro_three: "Entre estos están [candidate_2.Custom('ES_ElLa')] [candidate_2.GetTitledFirstName|l] y [candidate_3.Custom('ES_ElLa')] [candidate_3.GetTitledFirstName|l], quienes juran una lealtad inquebrantable para conseguir un asiento en la mesa.\n\nHarán lo que sea para abrirse paso por delante [candidate_1.Custom('ES_DelDela')] [candidate_1.GetTitledFirstName|l], que es obviamente superior."
 gdp_merchant.0020.desc.outro_two: "Entre estos está [candidate_2.Custom('ES_ElLa')] [candidate_2.GetTitledFirstName|l], quien jura una lealtad inquebrantable para conseguir un asiento en la mesa.\n\nHará lo que sea para abrirse paso por delante [candidate_1.Custom('ES_DelDela')] [candidate_1.GetTitledFirstName|l], que es obviamente superior."
 gdp_merchant.0020.desc.outro_one: "Entre estos está [candidate_1.Custom('ES_ElLa')] [candidate_1.GetTitledFirstName|l], quien ya juró una lealtad inquebrantable para conseguir un asiento en la mesa.\n\nHará lo que sea para abrirse paso por delante de cualquiera que se interponga entre el cargo y [candidate_1.GetSheHe]."
 gdp_merchant.0020.a: "[candidate_1.GetFirstNameNoTooltip] merece una oportunidad."
 gdp_merchant.0020.a.custom: "Los demás candidatos"
 gdp_merchant.0020.b: "[candidate_2.GetFirstNameNoTooltip] debería tener la oportunidad."
 gdp_merchant.0020.c: "[candidate_3.GetFirstNameNoTooltip] se lo merece más, es obvio."
 gdp_merchant.0020.d: "Esta gente ya tiene tareas de las que ocuparse…"
 gdp_merchant.0020.d.custom: "Todo candidato"
 merchant_unity_partner_gain: "asignación de un miembro de la casa como socio"
 merchant_unity_partner_loss: "asignación de alguien de fuera como compañero"
 gdp_merchant.0025.t: "Artesanos apreciados"
 gdp_merchant.0025.desc: "«Buen[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetFirstNameNoTooltip]», me llama una voz desconocida desde la curtiduría cercana. Sigo el sonido, con cuidado de no pisar en la mugre de las cubas de tinte.\n\nCuando me quiero dar cuenta, me doy de frente con… ¿un animal muerto? Su cazador[traveler.Custom('ES_XA')] me sonríe orgullos[traveler.Custom('ES_OA')] al enseñarme su trofeo.\n\n«[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] es célebre en todas partes por sus artesanos expertos. Sabréis entonces que la calidad del producto que vendéis depende del material disponible. Como cazador[traveler.Custom('ES_XA')], me gano la vida consiguiendo los mejores suministros para client[ROOT.Char.Custom('ES_EA')]s tan distinguid[ROOT.Char.Custom('ES_OA')]s como vos»."
 gdp_merchant.0025.a: "«¿Habéis pensado en un negocio a mayor escala?»."
 gdp_merchant.0025.b: "«Seguid, por favor…»."
 merchant_unity_artisan_recruit_loss: "reclutó a un extraño"
 merchant_unity_artisan_recruit_decline_gain: "aprendió sobre materiales de lujo"
 gdp_merchant.0030.t: "Una fuerza a tener en cuenta"
 gdp_merchant.0030.desc: "«[ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstNameNoTooltip], ¡mirad aquí!», oigo gritar a alguien.\n\nMe giro y veo a un[traveler.Custom('ES_XA')] herrer[traveler.Custom('ES_OA')] saludando con la mano desde su puesto. Cuando me acerco a [traveler.GetSheHe], no puedo evitar fijarme en cómo su cuerpo se gira y retuerce para dejar que el fuego de la forja ilumine sus músculos…\n\n«He esperado mucho para veros. Como vuestra compañía ha conseguido una reputación tan #EMP impresionante#! por dominar a vuestros competidores, me gustaría ofrecer mis puños a vuestra causa. Puedo romper cabezas, blandir una espada, lo que necesitéis»."
 gdp_merchant.0030.a: "«Me gusta vuestro entusiasmo»."
 gdp_merchant.0030.b: "«#EMP Em…#! Mostradme más de vuestro trabajo»."
 merchant_unity_creditor_recruit_loss: "reclutó a un extraño"
 merchant_unity_creditor_recruit_decline_gain: "rechazó a un fanático de la compañía adulador"
 gdp_merchant.0035.t: "Una reputación viajera"
 gdp_merchant.0035.desc: "Un alboroto poco normal distrae mi atención de los libros de cuentas que tengo delante.\n\nCuando salgo del despacho de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], me doy con un[traveler.Custom('ES_XA')] mercader de ojos astutos, con el polvo de días en sus ropas.\n\n«Saludos, [ROOT.Char.GetTitledFirstNameNoTooltip|l]», dice. «Todos en el camino saben vuestro nombre y toda la gente a la que he conocido me dice que sois a quien he de ver. Confiaba en que me dejarais cabalgar en vuestro nombre a partir de ahora»."
 gdp_merchant.0035.a: "«Vaya, parecéis totalmente capaz»."
 gdp_merchant.0035.b: "«Prefiero saber noticias sobre el comercio lejano»."
 merchant_unity_caravaneer_recruit_loss: "reclutó a un extraño"
 merchant_unity_caravaneer_recruit_decline_gain: "aprendió sobre mercados distantes"
 gdp_merchant.0101.t: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U]"
 gdp_merchant.0101.desc_republic: "Los [ROOT.Char.Custom('GetRegionalUrbanEliteTermPlural')|l] eran pesimistas, pero al fin hemos recibido la aprobación [recipient.Custom('ES_DelDela')] [recipient.GetTitledFirstName|l] a nuestra petición, ¡y el ambiente es de júbilo! Al fin tendremos una ciudad propia, ¡una república que gobernar como mejor nos parezca!\n\nSeré [Select_CString(ROOT.Char.IsFemale, 'la primera', 'el primer' )] [ROOT.Char.GetTitleAsNameNoTooltip|l] de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]"
 gdp_merchant.0101.liege: "para administrar [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] y sus alrededores como una ciudad súbdita, dependiente y en deuda con sus señores del país [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] a partes iguales."
 gdp_merchant.0101.independent: "para administrar [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] y sus alrededores junto con las otras familias notables del lugar, en nombre del pueblo."
 gdp_merchant.0101.republic: "\n\nTras muchos tratos y trabajo, la gran casa de [ROOT.Char.GetHouse.GetBaseNameNoTooltip] puede al fin construir un legado duradero…"
 gdp_merchant.0101.a: "¡Aquí comienza una nueva era para el pueblo de [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetBaseNameNoTierNoTooltip]!"
 gdp_merchant.0102.desc: "¡Cuánto me ha animado enterarme de que habéis aceptado nuestra petición!\n\nHemos enviado el oro y empezamos a redactar un privilegio para [new_primary_title.GetPreferredCapital.GetName],"
 gdp_merchant.0102.liege: "para gobernar como vuestros súbditos humildes."
 gdp_merchant.0102.top_liege: "para gobernar allí bajo el mando [new_liege.Custom('ES_DelDela')] [new_liege.GetTitledFirstName|l]."
 gdp_merchant.0102.independent: "para gobernar allí como una ciudad independiente."
 gdp_merchant.0103.desc: "Qué propuesta más ridícula. ¿De verdad creéis que mis títulos están a la venta? ¡¿Y para un[actor.Custom('ES_XA')] [actor.GetWomanMan] tan irrelevante como #EMP vos?!#!"
 gdp_merchant.0110.t: "$merge_company_interaction$: [actor.GetHouse.GetNameNoTooltip]-[recipient.GetHouse.GetNameNoTooltip]"
 gdp_merchant.0110.desc: "Tras mucho discutir, [recipient.Custom('ES_ElLa')] [recipient.GetTitledFirstName|l] no puede ocultar su interés en mi generosa oferta de unir nuestras dos compañías y casas.\n\n[recipient.GetSheHe|U] asiente,"
 gdp_merchant.0110.desc.personality.ai_honor: "«Parece que no tengo muchas opciones al respecto. Aun así, respetaré nuestra parte del trato y serviré a vuestros intereses con tanta diligencia como he hecho con los míos»."
 gdp_merchant.0110.desc.personality.ai_zeal: "«Confío en que [recipient.GetFaith.WealthGodName] nos haya mostrado el camino»."
 gdp_merchant.0110.desc.personality.ai_greed: "«He repasado vuestros libros de cuentas y los nuestros. Con estos números, no me queda otra que aceptar vuestra oferta.»"
 gdp_merchant.0110.desc.personality.ai_compassion: "«He consultado con la compañía y creemos que esta unión de nuestras compañías nos beneficiará a todos»."
 gdp_merchant.0110.desc.personality.ai_boldness: "«Acepto vuestra propuesta. Que no haya más obstáculos entre nosotros»."
 gdp_merchant.0110.desc.personality.ai_rationality: "«He sopesado nuestros beneficios frente al coste de rechazar vuestra oferta. Acepto»."
 gdp_merchant.0110.desc.personality.ai_vengefulness: "«No me dejáis alternativa. Habéis jugado bien y habéis ganado esta mano»."
 gdp_merchant.0110.desc.personality.ai_energy: "«Acepto. ¡Que vuestros escribanos redacten un contrato y me lo envíen con presteza!»."
 gdp_merchant.0110.desc.personality.ai_sociability: "«La compañía [recipient.GetHouse.GetBaseNameNoTooltip] acepta vuestras condiciones. Echaré de menos negociar bajo nuestro propio nombre, pero no es sensato aferrarse al orgullo»."
 gdp_merchant.0110.desc.personality.ai_personality_fallback: "«Tras mucha reflexión, acepto vuestra propuesta de combinar nuestros intereses»."
 gdp_merchant.0110.desc.closing: "\n\n«Nuestras rutas comerciales están siendo desmontadas, tal como prometimos, y los [recipient.GetHouse.GetBaseNameNoTooltip] servirán a vuestra compañía a partir de hoy»."
 gdp_merchant.0110.a: "¡Los mercados de [recipient.GetHouse.GetBaseNameNoTooltip] son nuestros!"
 gdp_merchant.0111.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_merchant.0111.desc: "Os habéis olvidado de vos mism[ROOT.Char.Custom('ES_OA')] y de la importancia de [actor.GetPrimaryTitle.GetDefinitiveNameNoTooltip]. [recipient.GetPrimaryTitle.GetDefinitiveNameNoTooltip] jamás cederá a vuestros mezquinos intereses."
 gdp_merchant.0111.a: "Esta empresa ha demostrado no ser buena idea."
 gdp_purpose_events.0001.opening: "[merchant.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0001.desc: "Corre el rumor de que el señorío de [indebted_ruler.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] necesita urgentemente ayuda financiera. Yo podría solucionar esta situación… a cambio de un favor, por supuesto."
 gdp_purpose_events.0001.a: "Podría ser un modo de librarme de esto…"
 gdp_purpose_events.0001.a.tt: "[merchant.GetFirstName] reflexionara sobre vuestra propuesta."
 gdp_purpose_events.0001.b: "¡Qué osadía!"
 gdp_purpose_events.0002.opening: "[indebted_ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0002.desc: "Os pido ayuda financiera en este momento de necesidad. Poned vuestras condiciones y no las rechazaré, siempre que las pongáis por escrito."
 gdp_purpose_events.0002.a: "Redacta el préstamo, intereses y todo."
 gdp_purpose_events.0002.a.sin: "Redacta el préstamo, con usura y todo."
 gdp_purpose_events.0002.c: "Redáctalo de manera que nadie pueda llamarlo usura."
 gdp_purpose_events.0002.d: "Envía el dinero y no pidas nada."
 gdp_purpose_events.0002.b: "He de negarme con educación…"
 gdp_purpose_events.0002_notification: "Éxito con el préstamo"
 gdp_purpose_events.0002_fail_notification: "Préstamo rechazado"
 fund_maa: "Financiar un [regiment|El] de [men_at_arms|El] @stationed_regiment_icon!"
 fund_mercenaries: "Financiar un contrato [mercenary|El] [mercenary_i|E]"
 gdp_purpose_events.0003.desc: "Es bien sabido que la guerra afecta a vuestro señorío. Estoy dispuest[ROOT.Char.Custom('ES_OA')] a patrocinar vuestras empresas si vos, mi [ruler.GetTitleAsNameNoTooltip|l], tuvieseis una gentileza conmigo en el futuro…"
 gdp_purpose_events.0003.a: "¡Preciso de toda la ayuda posible!"
 gdp_purpose_events.0003.b: "¿Gentileza? ¡Ni hablar de ello!"
 no_thanks.tt: "Dejas pasar esta oportunidad…"
 gdp_purpose_events.0004.opening: "[ruler.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_purpose_events.0004.desc: "Me indigna tener que escribiros, pero a mi señorío le vendría bien vuestro patrocinio en la guerra que libramos. Estoy preparad[ROOT.Char.Custom('ES_OA')] para tener una gentileza con vos en el futuro si me ayudáis."
 gdp_purpose_events.0004.a: "¡Os ofrezco un nuevo regimiento especializado!"
 gdp_purpose_events.0004.b: "Podría untar a alguien…"
 gdp_merchant.1002.t: "La fundación de una compañía"
 gdp_merchant.1002.desc: "Hay un libro de cuentas en la mesa que tengo delante. Desde la ventana abierta se cuelan sonidos del [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTerm')] local en el despacho de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l]: el regateo al comerciar, el crujido de las ruedas de los carros, los chillidos de los animales en sus jaulas.\n\nEl estudio es modesto, poco iluminado y sombrío; si quiero competir con los comerciantes de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], no puedo conformarme con hacerlo a solas. ¿Y si contrato gente para ayudar a la compañía?"
 gdp_merchant.1002.a: "Requiero individuos con cabeza para los negocios."
 gdp_merchant.1002.a.tt: "Comienzas con dos [associates|El] diestros en [stewardship|El]"
 gdp_merchant.1002.b: "Intimidaremos a nuestros oponentes."
 gdp_merchant.1002.b.tt: "Comienzas con dos [associates|El] diestros en [Concept('martial', 'marcialidad' )|E]"
 gdp_merchant.1002.c: "Los buenos negociadores hacen buenos tratos."
 gdp_merchant.1002.c.tt: "Comienzas con dos [associates|El] diestros en [diplomacy|El]"
 gdp_merchant.1002.d: "¡Aquí no carecemos de eruditos!"
 gdp_merchant.1002.d.tt: "Comienzas con dos [associates|El] diestros en [learning|El]"
 gdp_merchant.1002.e: "La astucia nos dará una ventaja."
 gdp_merchant.1002.e.tt: "Comienzas con dos [associates|El] diestros en [intrigue|El]"
 gdp_merchant.1002.f: "No, no me hace falta nadie."
 gdp_merchant.1002.f.tt.difficulty: "@alert_icon! #alert_trial Algunos [task_contracts|El] pueden resultar difíciles o imposibles hasta que consigas [associates|El]#!"
 gdp_merchant.1002.f.tt.associates: "Empiezas sin [associates|El] iniciales, solo la [family|El] y los [friends|El] que ya tengas"
 gdp_merchant.1003.t: "La fundación de una compañía"
 gdp_merchant.1003.desc: "El [ROOT.Char.GetCurrentLocation.Custom('GetRegionalMarketTermGloss')|l] de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], con sus multitudes innumerables, se presenta ante mí, y no pasa un segundo sin que se haga un trato y un puñado de [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] cambie de manos.\n\nEl murmullo del comercio está en todas partes: el crujir de las ruedas de los carros, animales que berrean desde sus corrales abarrotados, y tras el estrépito, están mis colegas mercaderes dando voces, con la esperanza de tomar la delantera a la competencia.\n\nAquí toda clase de mercaderías cambian de manos; si quiero competir con tantos comerciantes, ¿no tendría tal vez que centrar mis esfuerzos?"
 gdp_merchant.1003.a: "«Asegurar los transportes a granel es vital»."
 gdp_merchant.1003.b: "«Debemos aprovechar la forma en la que [ROOT.Char.GetSuzerain.Custom('ES_ElLa')] [ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip|l] nos percibe»."
 gdp_merchant.1003.b.tt: "Se creará un [patron_contract|El]"
 gdp_merchant.1003.c: "«Somos mercaderes, el beneficio lo es todo»."
 gdp_merchant.1100.t: "Una compañía abarrotada"
 gdp_merchant.1100.desc: "Mi [ROOT.Char.Custom2('RelationToMe', plaintiff)], [plaintiff.Custom('ES_ElLa')] [plaintiff.GetTitledFirstName|l], se me acerca en el estudio, midiendo sus palabras. «[ROOT.Char.GetFirstNameNoTooltip]… Se supone que este es un negocio familiar, pero cada vez dependemos más de extraños».\n\n«[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] debe quitar la paja si queremos conservar nuestra dignidad»."
 gdp_merchant.1100.a: "«Ya no necesitamos a [associate_2.GetFirstNameNoTooltip]»."
 gdp_merchant.1100.b: "«Es hora de despedirnos de [associate_1.GetFirstNameNoTooltip]»."
 gdp_merchant.1100.c: "«Sí, \"quitemos la paja\"…»."
 gdp_merchant.1100.d: "«Bobadas, nos hace falta toda la ayuda posible»."
 merchant_overcrowding_ignored_loss: "ignoró la aglomeración de la compañía"
 merchant_overcrowding_fired_gain: "despidió a un asociado para tratar la aglomeración"
 merchant_overcrowding_yeet_gain: "despidió a unos asociados para tratar la aglomeración"
 gdp_merchant.1200.t: "La solicitud de un asociado"
 gdp_merchant.1200.desc: "Después de un día largo entre los libros de cuentas, encuentro a mi [ROOT.Char.Custom2('RelationToMe', requester)], [requester.Custom('ES_ElLa')] [requester.GetTitledFirstName|l], rondando mi puerta, a la espera de encontrarme. «¡Oh, [ROOT.Char.Custom2('RelationToMeAddress', requester)]! Quería pediros…».\n\n"
 gdp_merchant.1200.desc.artifact: "«La compañía funciona muy bien bajo vuestro liderazgo, con muchos artículos valiosos que pasan por sus libros. Supongo que no podríais… ¿dejar que me quede uno?»."
 gdp_merchant.1200.desc.activity: "«La compañía trabaja duro y nos dirigís bien, pero ¿no será hora de celebrar nuestros logros con un evento digno de recordar?»."
 gdp_merchant.1200.desc.luxury_contract: "«Las rutas de la compañía rinden bien bajo vuestra dirección, pero debe de haber tantas maravillas a la espera de ser encontradas, ahí fuera en el mundo…»."
 gdp_merchant.1200.a: "«Está bien, veré lo que puedo hacer»."
 gdp_merchant.1200.b: "«Vamos, tengo cosas más importantes que hacer»."
 merchant_associate_request_fulfill_gain: "cumplió la petición de un [associate|El]"
 merchant_associate_request_reject_loss: "rechazó la petición de un [associate|El]"
