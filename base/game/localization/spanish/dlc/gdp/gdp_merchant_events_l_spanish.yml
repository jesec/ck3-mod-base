 gdp_merchant.3000.t: "El consejo de un traductor"
 gdp_merchant.3000.desc: "Mi traductor[translator.Custom('ES_XA')], [translator.Custom('ES_ElLa')] [translator.GetTitledFirstName|l], lleva un tiempo desaparecid[translator.Custom('ES_OA')], evidentemente, trabajando en algún que otro texto extranjero, cuando aparece por fin.\n\n«[ROOT.Char.GetTitleAsNameNoTooltip]», sonríe, «he estado leyendo unos informes adquiridos en [market.GetName|l]; las abreviaturas en [saved_culture.GetLanguage.GetName] fueron complicadas, ¡pero aquí hay mucho sobre movimientos de artículos locales!»."
 gdp_merchant.3000.a: "«¡Quiero hasta la última miga, [translator.GetFirstNameNoTooltip]!»."
 gdp_merchant.3000.a.tt: "La [company|El] gana [trade_expertise|El] en todas las [trade_categories_short|El] que se negocian en [market.GetName]"
 gdp_merchant.3000.b: "«¿Podríais enseñarme esta lengua?»."
 gdp_merchant.3000.b.tt: "Tu [scheme|El] gana [GetModifier('gdp_merchant_translator_buff_modifier').GetNameWithTooltip]"
 gdp_merchant.3000.c: "«Vended los descubrimientos al mejor postor»."
 gdp_merchant.3000.d: "«Centraos en vuestras habilidades lingüísticas»."
 gdp_merchant_translator_buff_modifier: "Tutor traductor"
 gdp_merchant.3010.t: "Los descubrimientos de un facilitador"
 gdp_merchant.3010.desc: "Mi facilitador[fixer.Custom('ES_XA')], [fixer.Custom('ES_ElLa')] [fixer.GetTitledFirstName|l], tras haber rondado por [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] durante un tiempo, por fin organiza una reunión con una nota ambigua sobre que ha encontrado los #EMP artículos#!.\n\nToma asiento misteriosamente,"
 gdp_merchant.3010.desc.secret: "antes de esbozar una sonrisa. «Me costado cierto trabajo, pero he aquí la prueba de que [secret_haver.GetName] tiene un secreto: ¡[secret.GetName]!»."
 gdp_merchant.3010.desc.scheme: "y su rostro revela preocupación. «Tengo malas noticias, [ROOT.Char.GetTitleAsNameNoTooltip|l]. He descubierto que [scheme_owner.GetName] ha estado conspirando contra vos, ¡contra la compañía!»."
 gdp_merchant.3010.a: "«Muy útil, ¡traedme más!»."
 gdp_merchant.3010.b: "«Estáis hecho tod[fixer.Custom('ES_OA')] un[fixer.Custom('ES_XA')] chivat[fixer.Custom('ES_OA')], ¿no, [fixer.GetFirstNameNoTooltip]?»."
 gdp_merchant.3010.c: "«Yo no trato con rumores de origen abyecto»."
 gdp_merchant.3010.d: "«Podría usar esto en el trabajo…»."
 gdp_merchant.3020.t: "La jactancia de un alguacil"
 gdp_merchant.3020.desc: "Mi alguacil[bailiff.Custom('ES_XA')], [bailiff.Custom('ES_ElLa')] [bailiff.GetTitledFirstName|l], ha estado rebuscando en la lista de deudores, dudando y vacilando sobre la presión que se podría aplicar para garantizar la rápida recuperación de la cantidad de [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] que nos deben.\n\n"
 gdp_merchant.3020.pressure: "«[pressure_debtor_1.Custom('ES_ElLa')|U] [pressure_debtor_1.GetTitledFirstName|l] carece de fondos, pero podría hacer un gesto de buena voluntad pagando al menos los intereses…», gruñe [bailiff.GetFirstNameNoTooltip].\n\n"
 gdp_merchant.3020.demand: "Suspira: «Sé de buena tinta que [demand_debtor_1.Custom('ES_ElLa')] [demand_debtor_1.GetTitledFirstName|l] puede pagar… ¡solo que cree que está por encima de nosotros!».\n\n"
 gdp_merchant.3020.third: "«Y luego está [portrait_3.Custom('ES_ElLa')] [portrait_3.GetTitledFirstName|l]…», murmura."
 gdp_merchant.3020.a: "«Sí, seguro que [pressure_debtor_1.GetFirstNameNoTooltip] se puede permitir unos intereses #EMP de nada#!, ¿no?»."
 gdp_merchant.3020.a.tt: "Te deberá #V -[THIS.Char.MakeScope.ScriptValue('minor_gold_value')]#! [gold_i] menos"
 gdp_merchant.3020.b: "«Apretad las clavijas [demand_debtor_1.Custom('ES_AlAla')] [demand_debtor_1.GetTitledFirstName|l]…»."
 gdp_merchant.3020.c: "«[pressure_debtor_2.GetFirstNameNoTooltip] se puede permitir una pequeña cuota»."
 gdp_merchant.3020.d: "«¡Está claro que [demand_debtor_2.GetFirstNameNoTooltip] nos está dando evasivas!»."
 gdp_merchant.3020.e: "«Recordad a [pressure_debtor_3.GetFirstNameNoTooltip] sus obligaciones»."
 gdp_merchant.3020.f: "«Es hora de mandarle a [demand_debtor_3.GetFirstNameNoTooltip] una señal clara»."
 gdp_merchant.3020.g: "«Prefiero que sigan en deuda conmigo»."
 ho_loan_demand_refused_title: "Exigencia de préstamo rechazada"
 gdp_merchant_3020_demand_refused_tt: "[THIS.Story.GetOwner.GetShortUIName] te sigue debiendo [outstanding|V0] [gold_i]"
 ho_loan_reduced_title: "Préstamo reducido"
 gdp_merchant_3020_pressure_tt: "[THIS.Story.GetOwner.GetShortUIName] ahora te debe [outstanding|V0] [gold_i]"
 gdp_merchant.3031.t: "La pasión de un agente"
 gdp_merchant.3031.desc: "Mi agente de mercados, [market_agent.Custom('ES_ElLa')] [market_agent.GetTitledFirstName|l], últimamente ha estado noches en vela, empapándose de libros de cuentas mientras la cera se fundía a su alrededor. [market_agent.GetSheHe|U] parpadea, adormilad[market_agent.Custom('ES_OA')] al entrar en mi estudio esta mañana.\n\n«¡[ROOT.Char.GetTitledFirstName]! He estado revisando nuestros libros de [market.GetName|l] y hay una clara posibilidad de que podamos…» #weak *bostezo*#! «¡Seríamos necios si no la aprovecháramos!»"
 gdp_merchant.3031.a: "«Buen trabajo, [market_agent.GetFirstNameNoTooltip], ¡ahora id a dormir un poco!»."
 gdp_merchant.3031.a.tt: "Aparece una [trade_opportunity|El] [trade_opportunity.GetType.GetName|V] en [market.GetName|l]"
 gdp_merchant.3031.b: "«Eso da igual, ¡centraos en nuestras preocupaciones actuales!»."
 gdp_merchant.3040.t: "La preocupación de un conservador"
 gdp_merchant.3040.desc: "Mi conservador[antiquarian.Custom('ES_XA')], [antiquarian.Custom('ES_ElLa')] [antiquarian.GetTitledFirstName|l], no pierde de vista la colección de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], asegurándose de que está sana y salva, y proporcionando anécdotas interesantes a los visitantes ocasionales.\n\nUna mañana, cuando me paro a admirar mi [artifact.GetName], aparece en el momento justo: «Ah, [ROOT.Char.GetTitleAsNameNoTooltip|l], una pieza muy especial es esta, pero a veces me pregunto si no hace de menos al resto de la colección»."
 gdp_merchant.3040.b: "«Es hora de desprendernos de ella. Buscad un comprador»."
 gdp_merchant.3040.c: "«A lo mejor le vendría bien una renovación»."
 gdp_merchant.3040.c.tt: "[artifact.GetName] ya está en un estado prístino"
 gdp_merchant.3040.c.tt.creature: "[artifact.GetName] es una #V criatura#!"
 gdp_merchant.3040.d: "«Necedades; la colección es perfecta»."
 gdp_merchant.8000.t: "$merchant_caravaneer_capstone_decision$"
 gdp_merchant.8000.desc: "A un sencillo habitante de la ciudad le parecería increíble el viaje que puede haber realizado un simple retazo de tela, a través de desiertos abrasadores y mares sinuosos, hasta aparecer en el puesto de un mercado.\n\nEstas penalidades de comerciante, bestia y nave son el día a día de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Hasta ciudades lejanas donde no se habla una palabra de [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] dependen de nuestras entregas."
 gdp_merchant.8000.a: "¡Una reputación digna de la compañía!"
 gdp_merchant.8000.b: "Pero no debo olvidar mis raíces."
 gdp_merchant.8001.t: "$merchant_artisan_capstone_decision$"
 gdp_merchant.8001.desc: "Más valiosas que los fardos y rollos de los productos comerciados o las piedras y metales preciosos de la tierra, son las maravillas que, con talento, se pueden sacar de todos ellos con manos humanas.\n\nArtilugios ingeniosos, adornos pasmosos y artesanías delicadas son el alma de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] y de nuestra fama como creadores de calidad y confianza."
 gdp_merchant.8001.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8001.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8002.t: "$merchant_creditor_capstone_decision$"
 gdp_merchant.8002.desc: "Hasta el mayor de los reyes puede quedar desvalido como un mendigo si el vil metal deja de fluir, pero las líneas de crédito lo rodean como los muchos hilos de una telaraña.\n\nEl nombre de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] se oye en cortes por todo el territorio como alguien de confianza para negociar y llegar a tratos, siempre dispuesto a ayudar en momentos de necesidad, pero de quien no hay que aprovecharse a la ligera."
 gdp_merchant.8002.a: "$gdp_merchant.8000.a$"
 gdp_merchant.8002.b: "$gdp_merchant.8000.b$"
 gdp_merchant.8010.t: "Un libro de viajes"
 gdp_merchant.8010.desc: "Pocos han visto tanto como yo y nadie ha llegado a experimentar todo lo que vivido. Del pobre al potentado, las tierras lejanas de este mundo son, como mucho, algo difuso, y desean ideas y entretenimiento que despejen la neblina.\n\nAl sentarme, mientras dudo entre bocados sabrosos de mis viajes por [poi.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetBaseNameNoTier], me pregunto qué les interesará más a los extraños y a mis descendientes."
 gdp_merchant.8010.a: "Me centraré en las costumbres y la etiqueta extranjeras."
 gdp_merchant.8010.a.tt: "La calidad de este libro dependerá mucho de tu [GetTrait( 'lifestyle_merchant' ).GetTraitTrackByKey( 'caravaneer' ).GetName|Vl] #weak ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )|l])#! y [trait_level_track_xp|El] de [GetTrait( 'lifestyle_traveler' ).GetTraitTrackByKey( 'travel' ).GetName|Vl] #weak ([GetTrait('lifestyle_traveler').GetName( GetNullCharacter )|l])#!"
 gdp_merchant.8010.b: "Los lectores buscan consejos sobre comercio e ideas sobre mercados."
 gdp_merchant.8010.c: "Mi obra describirá ciudades y maravillas extranjeras."
 gdp_merchant.8011.t: "$gdp_merchant.8010.t$"
 gdp_merchant.8011.intro: "Me ha llevado más de lo que esperaba, pero al fin estoy más o menos satisfech[ROOT.Char.Custom('ES_OA')] con mis garabatos. He explicado al detalle mi viaje a [poi.GetName], adornado con anécdotas del viaje y haciendo énfasis en el exotismo de sus [author.Custom('GetTravelogueTopic')].\n\n"
 gdp_merchant.8011.weak: "Al hojearlo, me siento algo decepcionad[ROOT.Char.Custom('ES_OA')] y me pregunto si tal vez podría haberme esforzado más, pero, ay, es hora de soltar la pluma."
 gdp_merchant.8011.mid: "Al hojearlo, me siento orgullos[ROOT.Char.Custom('ES_OA')] de mi trabajo, pero, sin embargo, siento que tal vez le falte algo, una chispa especial."
 gdp_merchant.8011.great: "Al hojearlo, me descubro riéndome de mis propias palabras y emocionad[ROOT.Char.Custom('ES_OA')] con ciertos párrafos como si lo experimentase todo de nuevo. ¡Es una obra digna de recordar!"
 gdp_merchant.8011.a: "Me aferraré a esto por ahora."
 gdp_merchant.8011.b: "Irá a la biblioteca de la compañía."
 travelogue_description_full: "Se trata de un diario de viaje entretenido de las tierras de [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTier], escrito por [author.Custom('ES_ElLa')] mercader [author.GetTitledFirstName|l]. Proporciona ideas a partir de su experiencia con [author.Custom('GetTravelogueTopic')] en el extranjero.\n\n[SCOPE.Custom('GetTravelogueQuality')]"
 travelogue_name_1: "Los viajes de [author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]"
 travelogue_name_2: "La ruta a [poi.GetCounty.GetName]"
 travelogue_name_3: "[author.GetFirstNameNoTooltip] [author.GetHouse.GetNameNoTooltip]: [author.Custom('ES_ElLa')] Viajer[author.Custom('ES_OA')]"
 travelogue_name_4: "A [poi.GetCounty.GetName]"
 travelogue_name_5: "Aventuras en [author.MakeScope.Var('poi_title').Title.GetBaseNameNoTierNoTooltip]"
 travelogue_name_6: "Viajes por el paisaje [author.MakeScope.Var('poi_title').Title.GetAdjectiveNoTooltip]"
 travelogue_name_7: "Tierras lejanas"
 travelogue_name_8: "Ida y vuelta"
 travelogue_name_9: "Sobre los [poi.GetCulture.GetCollectiveNounNoTooltip]"
 travelogue_name_10: "[poi.GetNameNoTierNoTooltip], [poi.GetTitle.Custom('BaronyTownType')|l] de misterios"
 travelogue_name_11: "El millar"
 travelogue_name_12: "Los viajes"
 travelogue_name_13: "El trayecto"
 travelogue_name_14: "La aventura de [author.GetFirstNameNoTooltip]"
 travelogue_topic_customs: "costumbres"
 travelogue_topic_markets: "mercados"
 travelogue_topic_places: "lugares"
 travelogue_description_quality_weak: "Es un libro mal escrito y decididamente fantástico."
 travelogue_description_quality_mid: "El libro contiene varios párrafos reveladores."
 travelogue_description_quality_great: "El libro es absorbente, escrito con drama y talento."
 gdp_merchant.8021.t: "$merchant_company_caravaneer_capstone_01_domicile_building$: visitante curios[visitor.Custom('ES_OA')]"
 gdp_merchant.8021.suzerain: "Es un honor cuando mi [Select_CString(visitor.IsFemale, 'patrona', 'patrón' )], [visitor.Custom('ES_ElLa')] [visitor.GetTitledFirstName|l],"
 gdp_merchant.8021.merchant: "[visitor.Custom('ES_ElLa')|U] [visitor.GetTitledFirstName|l], otr[visitor.Custom('ES_OA')] mercader y propietari[visitor.Custom('ES_OA')] de [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.laamp: "[visitor.Custom('ES_ElLa')|U] [visitor.GetTitledFirstName|l], líder de una banda itinerante que se hace llamar [visitor.GetPrimaryTitle.GetDefinitiveName],"
 gdp_merchant.8021.ruler: "Es una sorpresa agradable cuando [visitor.Custom('ES_ElLa')] [visitor.GetTitledFirstName|l], un[visitor.Custom('ES_XA')] gobernante local,"
 gdp_merchant.8021.fallback: "[visitor.Custom('ES_ElLa')] [visitor.GetTitledFirstName|l], un[visitor.Custom('ES_XA')] viajer[visitor.Custom('ES_OA')] humilde,"
 gdp_merchant.8021.desc: "acude a mi residencia.\n\nSonríe encantad[visitor.Custom('ES_OA')] cuando se le lleva a ver nuestra colección y lo examina todo, algo afectad[visitor.Custom('ES_OA')] por la sorpresa.\n\n«¡Saludos, [ROOT.Char.GetTitledFirstNameNoTooltip|l]! He oído historias sobre los logros de vuestra compañía y vuestra exótica colección… ¿Os importaría contarme cosas sobre…», da un grito ahogado, atraíd[visitor.Custom('ES_OA')] hacia mi [artifact.GetName].\n\n«¡Oh! ¿Pero qué tenéis aquí…?»."
 gdp_merchant.8021.curio: "Estudia el artefacto desde todos los ángulos, decidid[visitor.Custom('ES_OA')] a escuchar su historia entera antes de quedar satisfech[visitor.Custom('ES_OA')]."
 gdp_merchant.8021.library: "Hojea cuidadosamente las páginas mientras no deja de hacer preguntas."
 gdp_merchant.8021.creature: "Se maravilla con su gracia y observa con regocijo cómo se le alimenta."
 gdp_merchant.8021.a: "Sí, no está mal."
 gdp_merchant.8021.b: "¿Os gustaría tenerlo?"
 gdp_merchant.9021.opening: "Saludos, buen[merchant.Custom('ES_XA')] [merchant.GetTitledFirstNameNoTooltip|l],"
 gdp_merchant.9021.diarch.desc: "Como [commissioner.GetDiarchTitle|l] de [commissioner.GetName], aspiro a contratar los servicios de [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.9021.no_diarch.desc: "Aspiro a contratar los servicios de [merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.9021.desc: "\n\nHay escasez de [target.GetName] en [trade_market.GetName|l]. Traed ese artículo a esta zona y se os recompensará con generosidad."
 gdp_merchant.9021.a: "Se acepta tu encargo."
 gdp_merchant.9021.b: "Con todo respeto, he de negarme."
 gdp_merchant.9021.b.cooldown_tt: "No recibirás más [Concept('commission', 'encargos')|E] durante #V [EmptyScope.ScriptValue('commission_trade_route_merchant_cooldown_years_value')]#! años"
 gdp_merchant.9005.t: "Sacados a la fuerza"
 gdp_merchant.9005.desc_intro: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))], [courtier.Custom('ES_ElLa')] [courtier.GetTitledFirstName|l], irrumpe en el despacho de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], con el rostro enrojecido.\n\n«Traigo noticias de [Select_CString(expeller.IsFemale, 'nuestra patrona', 'nuestro patrón' )], [expeller.Custom('ES_ElLa')] [expeller.GetTitledFirstName|l]», dice. «¡Nuestra compañía debe cerrar sus cuentas y salir de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] de inmediato!».\n\n"
 gdp_merchant.9005.desc_intro.fallback: "[expeller.Custom('ES_ElLa')|U] [expeller.GetTitledFirstName|l] ha ordenado a [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] abandonar [expeller.GetPrimaryTitle.GetDefinitiveNameNoTooltip].\n\n"
 gdp_merchant.9005.desc_body.dealbreaker: "Se ha agotado la confianza que [expeller.Custom('ES_ElLa')] [expeller.GetTitledFirstNameNoTooltip|l] tenía en nosotros."
 gdp_merchant.9005.desc_body.enemies: "¿Es que no tiene límites la animadversión [expeller.Custom('ES_DelDela')] [expeller.GetTitledFirstNameNoTooltip|l]?"
 gdp_merchant.9005.desc_body.fallback: "Con todo lo que hemos hecho aquí…"
 gdp_merchant.9005.a: "Así que a esto hemos llegado."
 gdp_merchant.9005.a.tt: "Tu [company|El] abandonará el [realm|El] de [expeller.GetShortUIName]"
 gdp_merchant.9100.t: "La casa patricia de [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9100.desc: "Tras haber probado nuestra valía ante las familias más altivas de [new_patrician_liege.GetPrimaryTitle.GetNameNoTier] y proporcionado [new_patrician_liege.Custom('ES_AlAla')] [new_patrician_liege.GetTitledFirstName|l] los #emp incentivos#! adecuados, mi petición para que nos eleven tiene su resultado asegurado.\n\nAl fin poseo los documentos que reafirman sin lugar a duda que [ROOT.Char.GetHouse.GetBaseName] no es una simple casa mercante, sino que se sienta con las otras apreciadas familias patricias en la asamblea de [new_patrician_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l], ¡igual incluso a los [new_patrician_liege.GetHouse.GetBaseName] ante la ley!"
 gdp_merchant.9100.a: "Aguardo con ansia mi primera sesión en la asamblea."
 merchant_patrician_transition_domicile_tt: "Se han conservado tus [domicile_buildings|El]"
 gdp_merchant.9110.t: "La casa mercante de [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant.9110.desc: "Con la destrucción de la antigua república, los [ROOT.Char.GetHouse.GetBaseName] y otras familias patricias orgullosas de [new_merchant_location.GetBaronyNameExplicitly] han sido reducidas a simples casas mercantes, sometidas a los caprichos de la fortuna y del gobernante local, en este caso, [ROOT.Char.GetSuzerain.Custom('ES_ElLa')] [ROOT.Char.GetSuzerain.GetTitledFirstName|l].\n\nDespojado de nuestra asamblea y de la protección de nuestra república, hemos de emplazar nuestra confianza en las leyes de [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTier] si queremos mantener cierta apariencia de nuestra anterior talla."
 gdp_merchant.9110.a: "¿Cómo hemos llegado a esto…?"
 broke_deal_opinion: "Trato roto"
 gdp_repudiated_my_loan_opinion: "Rechazó mi préstamo"
 gdp_interest_free_loan_opinion: "Préstamo sin intereses"
 gdp_usurious_loan_opinion: "Me prestó dinero con usura"
 gdp_merchant_unity_intermarriage_desc: "se casó con otra [house|El] [Concept('merchant', 'mercante')|E]"
 gdp_merchant_unity_noble_marriage_desc: "se casó con una [house|El] noble"
 gdp_merchant.2000.t: "Mercado mínimo: [needed_good.GetNameNoTooltip]"
 gdp_merchant.2000.desc.intro: "Mientras recorro las calles "
 gdp_merchant.2000.desc.disaster: "golpeadas por la catástrofe "
 gdp_merchant.2000.desc.war: "destrozadas por la guerra "
 gdp_merchant.2000.desc.plague: "plagadas por la peste "
 gdp_merchant.2000.desc.unrest: "ingobernables "
 gdp_merchant.2000.desc.stalls: "de [starving_province.GetNameNoTooltip], me fijo en que el antaño ruidoso [starving_province.Custom('GetRegionalMarketTermGloss')] ha quedado en silencio.\n\nLos puestos de comida están casi vacíos, salvo por un puñado de [ROOT.Char.Custom('GetLocalStreetFoodPlural')] que desprenden un olor a rancio y [ROOT.Char.Custom('RegionalRootVegetablePlural')] de aspecto putrefacto. Gentes escuálidas husmean en los montones de basura que bordean las calles."
 gdp_merchant.2000.a: "Debo aferrarme a lo que quede."
 gdp_merchant.2000.b: "La gente buscará a alguien a quien culpar."
 gdp_merchant.2000.c: "No es problema mío."
 gdp_merchant.2010.t: "Monopolio de [craft_monopoly.GetTradeGoodCategoryType.GetNameNoTooltip|l]:"
 gdp_merchant.2010.t.smith: "[craftsman.Custom('ES_ElLa')|U] herrer[craftsman.Custom('ES_OA')]"
 gdp_merchant.2010.t.goldsmith: "[craftsman.Custom('ES_ElLa')|U] orfebre"
 gdp_merchant.2010.t.carpenter: "[craftsman.Custom('ES_ElLa')|U] carpinter[craftsman.Custom('ES_OA')]"
 gdp_merchant.2010.t.tanner: "[craftsman.Custom('ES_ElLa')|U] curtidor[craftsman.Custom('ES_XA')]"
 gdp_merchant.2010.t.potter: "[craftsman.Custom('ES_ElLa')|U] alfarer[craftsman.Custom('ES_OA')]"
 gdp_merchant.2010.desc.intro: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] no deja de hablar sobre la maestría de est[craftsman.Custom('ES_EA')] artesan[craftsman.Custom('ES_OA')], [craftsman.GetFirstName] de [workshop_province.GetName]. Ahora que me encuentro ante sus creaciones, entiendo por qué tanta cantinela.\n\n[craftsman.GetFirstNameNoTooltip] me recibe sin levantar la vista de su trabajo «Por favor, examinad mis obras cuanto gustéis».\n\nMe fascina"
 gdp_merchant.2010.desc.weapon: "un arma magnífica."
 gdp_merchant.2010.desc.chalice: "un cáliz de factura intricada."
 gdp_merchant.2010.desc.box: "una caja de madera de talla intricada."
 gdp_merchant.2010.desc.saddle: "una silla de montar perfectamente repujada."
 gdp_merchant.2010.desc.vase: "un jarrón de cerámica delicadamente pintado."
 gdp_merchant.2010.desc.craftsmanship: "No es una artesanía cualquiera."
 gdp_merchant.2010.a: "Un talento como este no se puede desperdiciar."
 gdp_merchant.2010.b: "A lo mejor podríais enseñar un par de cosas a [associate.GetFirstNameNoTooltip]."
 gdp_merchant.2010.c: "Me gustaría quedarme y observar vuestro trabajo."
 gdp_merchant.2015.t: "El precio de [counsel_good.GetNameNoTooltip|l]"
 gdp_merchant.2015.desc: "He recibido una convocatoria inesperada de mi [Select_CString(patron.IsFemale, 'patrona', 'patrón' )], [patron.Custom('ES_ElLa')] [patron.GetTitledFirstName|l]. Dada su naturaleza [patron.Custom('quirk_neg_adjective')], entro en la sala del trono con inquietud.\n\n«[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip], concededme esto; ¿qué me podéis decir de las cualidades y el valor de mercado de [counsel_good.GetNameNoTooltip|l]?»."
 gdp_merchant.2015.a: "«Resulta que soy un[ROOT.Char.Custom('ES_XA')] expert[ROOT.Char.Custom('ES_OA')] en el tema»."
 gdp_merchant.2015.a.tt: "Debes haber alcanzado al menos un [expertise_level|El] #V [GetPlayer.MakeScope.ScriptValue('merchant_monopoly_trade_expertise_level_medium_value')|0]#! en la [trade_category_short|El] de [counsel_category.GetName|l]"
 gdp_merchant.2015.b: "«Sé alguna que otra cosa…»."
 gdp_merchant.2015.a.monopoly.tt: "Aceptación de [trade_monopoly|El] [monopoly_i]: [monopoly_opinion_acceptance|=+0]"
 gdp_merchant.2015.b.success: "[patron.GetFirstNameNoTooltip] te considera una autoridad"
 gdp_merchant.2015.b.failure: "[patron.GetFirstNameNoTooltip] descubre que mientes"
 gdp_merchant.2015.b.monopoly.tt: "Aceptación de [trade_monopoly|El] [monopoly_i]: [monopoly_acceptance|=+0]"
 gdp_merchant.2015.c: "«Aspiro a algo más en la vida que únicamente a comerciar»."
 gdp_merchant.2020.t: "Un asiento en la mesa"
 gdp_merchant.2020.desc: "Tengo el honor de cenar en el/la [patron.GetCapitalLocation.GetHolding.GetType.GetName|l] de mi [Select_CString(patron.IsFemale, 'patrona', 'patrón' )], [patron.Custom('ES_ElLa')] [patron.GetTitledFirstName|l], en [patron.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. [courtier_1.Custom('ES_ElLa')|U] [courtier_1.GetTitledFirstName|l], un[courtier_1.Custom('ES_XA')] [courtier_1.Custom('NoblewomanNobleman')], me sigue con una mirada abrasadora mientras me dirijo a mi sitio. Sus susurros con los otros invitados son casi inaudibles, pero puedo distinguir las palabras «chusma» y «sobornos de un[ROOT.Char.Custom('ES_XA')] vulgar vendedor[ROOT.Char.Custom('ES_XA')] ambulante». Las voces enmudecen cuando [patron.GetFirstNameNoTooltip] se levanta para hablar:\n\n«Compañeros de confianza, amigos recién conocidos y hermanos perdidos, os he reunido aquí esta noche para disfrutar de mi hospitalidad. ¡Que empiece el festín!»."
 gdp_merchant.2020.a: "«Espléndido, ¡tendríamos que hacerlo más a menudo!»"
 gdp_merchant.2020.a.feast.tt: "[patron.GetShortUIName] [Select_CString( patron.IsLocalPlayer, 'comenzarás', 'comenzará' )] un [GetActivityType('activity_feast').GetName|l] [GetActivityType('activity_feast').GetTextIcon] lo antes posible #weak (entre 1 y 3 meses)#!"
 gdp_merchant.2020.b: "La casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] recibirá el reconocimiento que nos merecemos."
 gdp_merchant.2020.b.unity_gain.desc: "reclamación de un asiento entre la nobleza en nombre de nuestra casa."
 gdp_merchant.2020.c: "«Bien dicho, ¡y ahora hablemos de negocios!»."
 gdp_merchant.2020.c.unity_loss.desc: "centrarse en lo que de verdad importa: los negocios"
 gdp_merchant.2025.t: "El mercader menor"
 gdp_merchant.2025.desc: "[charter_rival.Custom('ES_ElLa')|U] [charter_rival.GetTitledFirstName|l] no está, para variar, cuando el deber llama. Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('patron'))] —[patron.Custom('ES_ElLa')] [patron.GetTitledFirstName|l]— y yo esperamos pacientes su llegada hasta que decidimos pasar a las cuentas mensuales sin [charter_rival.GetSheHe].\n\nAún hay tratos comerciales sin verificar tirados por la mesa cuando [patron.GetFirstNameNoTooltip] los echa a un lado y vuelve su atención hacia mí:\n\n«[ROOT.Char.GetFirstNameNoTooltip], entre [Select_CString(And(ROOT.Char.IsFemale, patron.IsFemale), 'nosotras', 'nosotros')], ¿qué pensáis #EMP de verdad#! de [charter_rival.GetFirstNameNoTooltip]? ¿Tomé la decisión correcta cuando le concedí mi privilegio?»."
 gdp_merchant.2025.a: "«Tal vez fuera más útil en mis manos»."
 gdp_merchant.2025.a.charter.tt: "Aceptación de [request_merchant_charter|El] [charter_i]: [charter_opinion_acceptance|=+0]"
 gdp_merchant.2025.b: "«Confío en vuestro juicio superior, [patron.Custom('FormOfAddressForLiege')]»."
 gdp_merchant.2025.b.unity_gain.desc: "se mostró al patrón que confiamos en su juicio"
 gdp_merchant.4000.t: "Nuestro lugar fuera de la senda"
 gdp_merchant.4000.desc.intro: "Entro en el mercado de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] para encontrar a mis vendedores expulsados a un callejón remoto, sus mesas plantadas en el estiércol de una pocilga cercana.\n\n"
 gdp_merchant.4000.desc.patron: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('market_character'))]"
 gdp_merchant.4000.desc.patron_representative: "[market_character.GetName], [patron.Custom2('RelationToMe', SCOPE.sC('market_character'))] [patron.Custom('ES_DelDela')] [patron.GetTitledFirstName|l],"
 gdp_merchant.4000.desc.body: "se encuentra lejos y contra el viento, sonriendo al observar a mis asociados colmarme de quejas.\n\nCuando me acerco, [market_character.GetFirstNameNoTooltip] dice:"
 gdp_merchant.4000.desc.body.patron: "«Un lugar adecuado para los negocios de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], ¿no os parece?», y señala a los puercos."
 gdp_merchant.4000.desc.body.patron_representative: "«Estoy aquí en nombre de [Select_CString(patron.IsFemale, 'vuestra patrona', 'vuestro patrón' )]». A juzgar por cómo alza la barbilla y el brillo de sus ojos, dar estas noticias le proporciona bastante alegría."
 gdp_merchant.4000.desc.outro: "«No os adherís a nuestras costumbres ni escucháis la palabra de [Glossary( 'Kǒngzǐ', 'CONFUCIUS_GLOSS' )]. Hasta que lo hagáis, este será vuestro lugar»."
 gdp_merchant.4000.b: "Debería aprender sobre el Camino."
 gdp_merchant.4000.b.tt: "Tu próxima [GetActivityType('activity_adult_education').GetName|l] cuesta un #P [EmptyScope.ScriptValue('gdp_merchant_confucian_university_visit_discount_loc')] %#! menos de [gold|El] si la celebras en un centro de [GetTrait('confucian_education').GetName(GetNullCharacter)|l]"
 gdp_merchant.4000.c: "Se van a enterar…"
 gdp_merchant.4010.t: "Las puertas del conocimiento"
 gdp_merchant.4010.desc: "Disfruto de un té al final de un largo día de mercado. De vez en cuando noto que un erudito local me mira con curiosidad.\n\n«Los de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] son despreciables», oigo murmurar a su amigo. «Se creen mejores que nosotros, que seguimos los ritos correctos. Nosotros aprobamos los exámenes con diligencia. Aparte de explotar a los demás, ¿qué ha logrado nunca [ROOT.Char.GetFirstNameNoTooltip]?»."
 gdp_merchant.4010.a: "Muy difícil no será ese examen."
 gdp_merchant.4010.b: "«¿Y de quién es el té que bebéis?»."
 gdp_merchant.4010.c: "«¿Y cuál negocio os podéis permitir perder?»."
 gdp_merchant.4020.t: "La Ruta de la Seda"
 gdp_merchant.4020.desc: "Entro en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] y me atrapa una muchedumbre de cuerpos de hombres y bestias, que se desborda por las puertas de [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')] para unirse a procesión interminable de caravanas. Aquí los dromedarios son tan altos como elefantes por la abundancia de su cargamento, que se sacude de un lado a otro a causa del volumen de carga que llevan sobre los lomos.\n\n"
 gdp_merchant.4020.desc.exceptional_bounty: "En cada rincón del mercado hay comerciantes que descargan tales cantidades de artículos que resulta difícil de creer.\n\nVeo puestos con comida tirada a un lado, pues hay tanta producción que sencillamente es imposible venderla toda antes de que se eche a perder."
 gdp_merchant.4020.desc.steady_trading: "Nunca antes había visto tanta prodigalidad en un solo sitio. Aquí hay tanta gente que nos convertimos en una masa chillona, reducida a una sola unidad.\n\nCuando una caravana flaquea, siempre hay un jefe dispuesto a hacer restallar el látigo."
 gdp_merchant.4020.desc.hardship: "Por lo que consigo entender de fragmentos de conversaciones en lenguas extranjeras, este mercado se encuentra en dificultades.\n\nLo que debió ser en épocas más prósperas, las meras cantidades de artículos debieron superar todos los cálculos…"
 gdp_merchant.4020.a: "Este es el camino hacia el futuro."
 gdp_merchant.4030.t: "Fortunas lejanas"
 gdp_merchant.4030.desc.intro: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName] entra en la oficina de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], con ojos iluminados que solo he visto cuando admiraba un montón de oro.\n\nMe entrega una caja y la abro para encontrar"
 gdp_merchant.4030.desc.silk: "la seda más elegante que haya visto jamás, del grosor de un suspiro e imposiblemente ligera.\n\n"
 gdp_merchant.4030.desc.spice: "un polvo fragante, molido hace poco.\n\n«Lo llaman [rumoured_market_owner.Custom('RegionalSpice')]», dice."
 gdp_merchant.4030.desc.jade: "una piedra de jade, tan pulida que la superficie es lisa como el cristal.\n\n"
 gdp_merchant.4030.desc.ivory: "una pieza de marfil, tallada en forma de una ciudadela en miniatura.\n\n"
 gdp_merchant.4030.desc.outro: "«Compré este artículo a un mercader que me habló de su conexión [rumoured_market_owner.GetCulture.GetNameNoTooltip|l] con la Ruta de la Seda. El oro que ganamos aquí en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] no es nada comparado con lo que se obtiene en los [rumoured_market_location.Custom('GetRegionalMarketTermGlossPlural')] de [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]»."
 gdp_merchant.4030.a: "«¿La Ruta de la Seda, decís?»."
 gdp_merchant_4030_a_tt: "Si trasladas tu [company|El] a [rumoured_market.GetName] en los próximos #V 5#! años, ganarás [GetModifier('gdp_silk_road_market_foothold_modifier').GetNameWithTooltip] en ese [market|El] durante #V 10 años#!"
 gdp_merchant.4030.b: "«Gracias, qué obsequio más considerado»."
 gdp_merchant.4030.c: "«Aquí tenemos asuntos importantes, [associate.GetFirstNameNoTooltip]»."
 merchant_unity_local_business: "prioridad a los negocios cercanos por encima de la [silk_road|E]"
 gdp_merchant.4030.artifact.silk: "Seda de [rumoured_market_location.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant.4030.artifact.silk.desc: "Muestras de seda fina como un suspiro traídas de los mercados de la Ruta de la Seda, imposiblemente ligera y de tacto liso."
 gdp_merchant.4030.artifact.spice: "Saquito de especias"
 gdp_merchant.4030.artifact.spice.desc: "Un saquito de fragantes especias, transportado desde los mercados de la Ruta de la Seda."
 gdp_merchant.4030.artifact.jade: "Piedra de jade pulida"
 gdp_merchant.4030.artifact.jade.desc: "Una piedra de jade de los mercados de la Ruta de la Seda, pulida hasta que su superficie es tan lisa como el cristal."
 gdp_merchant.4030.artifact.ivory: "Ciudadela de marfil"
 gdp_merchant.4030.artifact.ivory.desc: "Una pieza de marfil de los mercados de la Ruta de la Seda, minuciosamente tallada en forma de una ciudadela en miniatura."
 gdp_merchant.5000.t: "Interés expuesto"
 gdp_merchant.5000.desc.debtor: "La puerta de la oficina de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] se abre de golpe y mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] entra, flanquead[accuser.Custom('ES_OA')] por mis propios asociados."
 gdp_merchant.5000.desc.debtor_paranoid: "Un chirrido de la puerta es todo lo que anuncia la llegada de mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetFirstName] al entrar silenciosamente en la oficina de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]."
 gdp_merchant.5000.desc.bishop: "Figuras encapuchadas oscurecen el umbral de la puerta de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]. No pasa mucho hasta que [accuser.Custom('ES_ElLa')] [accuser.Custom('GetActualBishopTitle')|l] [accuser.GetFirstName] está ante mí, conducid[accuser.Custom('ES_OA')] por mis propios asociados."
 gdp_merchant.5000.desc.clergy: "Figuras encapuchadas oscurecen el umbral de la puerta de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]. No pasa mucho hasta que [accuser.Custom('ES_ElLa')] [accuser.Custom('PriestTitle')|l] [accuser.GetFirstName] está ante mí, conducid[accuser.Custom('ES_OA')] por mis propios asociados."
 gdp_merchant.5000.desc.steward: "La puerta de la oficina de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] se abre de golpe y [accuser.Custom('ES_ElLa')] [debtor.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] de [debtor.GetFirstName] entra, flanquead[accuser.Custom('ES_OA')] por mis propios asociados."
 gdp_merchant.5000.desc.break: "\n\n«[ROOT.Char.GetTitledFirstNameNoTooltip], parece haber una discrepancia en el préstamo realizado a [SelectLocalization( ROOT.Char.MakeScope.Var('gdp_usury_penance_accuser_is_debtor').IsSet, 'mi persona', debtor.GetTitledFirstName )|l]», dice."
 gdp_merchant.5000.desc.accepted: "«No me gusta que se me informe de falsedades. Mostradme los libros de vuestra compañía y dejemos los registros claros»."
 gdp_merchant.5000.desc.discouraged.debtor: "«Sabéis que mi [accuser.GetFaith.Custom('HouseOfWorshipBase')] desaprueba la usura. Solucionemos esto aquí y el asunto no tendrá que ir más allá»."
 gdp_merchant.5000.desc.shunned.debtor: "«En cuanto los [accuser.Custom('DefaultPriestTitlePlural')] se enteren de esto, caerán con vehemencia sobre vos y vuestro negocio. Estoy aquí para daros una oportunidad para salvaros»."
 gdp_merchant.5000.desc.accepted.steward: "«A vuestro patrón no le gusta que se le informe de falsedades. Mostradme los libros de vuestra compañía y corrijamos los números»."
 gdp_merchant.5000.desc.discouraged.steward: "$gdp_merchant.5000.desc.discouraged.debtor$"
 gdp_merchant.5000.desc.shunned.steward: "$gdp_merchant.5000.desc.shunned.debtor$"
 gdp_merchant.5000.desc.discouraged: "«Como mercader, entendéis que no se puede ganar algo a cambio de nada, ¿verdad? Y, sin embargo… Bueno, esperamos que este asunto se pueda resolver ahora, discretamente, para evitar que vuestro negocio sufra por este error, lo que también dañaría al comercio»."
 gdp_merchant.5000.desc.shunned: "«El modo en que habéis conducido vuestro negocio es despreciable. Vos, como mercader, ¿estáis vendiendo algo que no existe? Lo llevaremos al tribunal a menos que supliquéis perdón»."
 gdp_merchant.5000.a: "«¿No sabéis que actúo en nombre [ROOT.Char.GetSuzerain.Custom('ES_DelDela')] [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip|l]?»."
 gdp_merchant.5000.a.debtor: "«No querréis dañar nuestro comercio, ¿verdad?»."
 gdp_merchant.5000.b: "«Podéis tomar nuestros activos en compensación»."
 gdp_merchant.5000.c: "«Vamos, mirad aquí, en la letra pequeña»."
 gdp_merchant.5000.c.success: "Tus cuentas están impolutas"
 gdp_merchant.5000.c.failure: "Los números son chapuceros"
 gdp_merchant.5000.c.critical: "Los intereses están mal ocultados"
 gdp_merchant.5000.d: "«Supongo que podría renunciar a los intereses…»."
 gdp_merchant.5000.e: "«Considerad el préstamo olvidado»."
 gdp_usury_penance_seized_goods_modifier: "Caravanas embargadas"
 gdp_usury_penance_seized_goods_modifier_desc: "Los negocios de este personaje sufren por el descubrimiento de los intereses ocultos de sus préstamos."
 gdp_usury_penance_same_faith_scandal_modifier: "Usurero conocido"
 gdp_usury_penance_same_faith_scandal_modifier_desc: "Este personaje sufre por haberse descubierto su turbia usura."
 gdp_usury_penance_forgive_interest_tt: "Se perdonan los [Concept('interest', 'intereses')|E] ocultados #weak ([TARGET_CHARACTER.GetShortUIName] debe $VALUE|0V$) [gold_i]#!"
 gdp_usury_penance_forgive_interest_tt_first: "$gdp_usury_penance_forgive_interest_tt$"
 gdp_usury_penance_loan_stands_tt: "El [loan|El] oculto permanece"
 gdp_merchant.5010.t: "La letra pequeña"
 gdp_merchant.5010.desc: "Se me ha informado de que mi acreedor[lender.Custom('ES_XA')] [lender.GetFirstName] no ha sido totalmente sincer[lender.Custom('ES_OA')] en la resolución de mi préstamo.\n\nAl volver a revisar los números, veo que hay cláusulas en letra pequeña que dan una suma mayor de la que acordamos en un principio.\n\nLa discrepancia en nuestro acuerdo es evidente para todos, si deseo actuar al respecto."
 gdp_merchant.5010.a: "Mantener el secreto."
 gdp_merchant.5010.b: "Me devolverá los intereses."
 gdp_merchant.5010.b.wipe: "[lender.GetSheHe|U] no recibirá ningún interés."
 gdp_merchant.5010.c: "Rechazar el préstamo."
 gdp_usury_debtor_discover_interest_tt: "Los [Concept('interest', 'intereses')|E] ocultos son #weak ($VALUE|0V$ [gold_i])#!"
 gdp_usury_debtor_keep_secret_tt: "Los [Concept('interest', 'intereses')|E] ocultos siguen siendo un secreto"
 gdp_usury_debtor_demand_repayment_tt: "Exigir que se devuelvan los [Concept('interest', 'intereses')|E] ocultos"
 gdp_usury_debtor_inform_creditor_tt: "Se ha enviado una carta a [Select_CString(lender.IsLocalPlayer,'tu personaje', lender.GetShortUINameNoTooltip)]"
 gdp_merchant.5020.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5020.desc: "$gdp_merchant.5020.desc_intro$ Os exijo que devolváis los intereses ocultos y con presteza. Ni se os ocurra volver a engañarme."
 gdp_merchant.5020.a: "Qué lástima."
 gdp_merchant.5020.a.tt: "Intereses ocultos devueltos"
 gdp_usury_penance_interest_paid_back_tt: "Ya no se deben los [Concept('interest', 'intereses')|E] ocultos"
 gdp_merchant.5020.desc_intro: "¡He revisado el contrato de nuestro préstamo y está más que claro que habéis intentado engañarme!"
 gdp_usury_debtor_kept_secret_message: "Secreto guardado"
 gdp_usury_debtor_kept_secret_message_desc: "[debtor.Custom('ES_ElLa')|U] [debtor.GetTitledFirstName|l] sabe de los [Concept('interest', 'intereses')|E] ocultos y mantendrá el secreto."
 gdp_merchant.5040.opening: "[debtor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 gdp_merchant.5040.desc: "Considero el préstamo que me concedisteis nulo y sin efecto. Me lo pensaré mucho mejor la próxima vez que me ofrezcáis nada."
 gdp_merchant.5040.a: "¡Qué osadía!"
 gdp_merchant.0060.opening: "[associate.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant.0060.desc: "Me duele escribiros y admitir que el precio de la vía libre y las discusiones constantes en los mercados han demostrado ser demasiado difíciles de soportar para mí.\n\n¿Podríais pedir a la compañía que me dejara regresar a casa, aunque fuera por un tiempo?"
 gdp_merchant.0060.a: "Si no queda más remedio."
 gdp_merchant.0060.a.tt: "Prometes tomar la decisión [GetDecisionWithKey('gdp_return_trade_envoys_decision').GetName] en dos años."
