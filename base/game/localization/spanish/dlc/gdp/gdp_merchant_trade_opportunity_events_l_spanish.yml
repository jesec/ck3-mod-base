 gdp_merchant_trade_opportunity.9020.t: "Oportunidad comercial: [task_contract.GetType.GetName|l]"
 gdp_merchant_trade_opportunity.9020.intro: "Mi [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l], [partner.GetFirstName], ha regresado al fin de [task_contract_location.GetBaronyNameExplicitly] con noticias de su progreso.\n\n"
 gdp_merchant_trade_opportunity.9020.success: "[partner.GetSheHe|U] explica feliz cómo solucionó con destreza el asunto para beneficio de la compañía y para mérito suyo, a pesar de las muchas dificultades…"
 gdp_merchant_trade_opportunity.9020.failure: "[partner.GetSheHe|U] explica con cierta reticencia lo difícil que fue su misión, y que, a pesar de sus enormes esfuerzos, la compañía ha sufrido…"
 gdp_merchant_trade_opportunity.9020.a.success: "Muy bien, [partner.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.9020.a.failure: "Debería haberme encargado yo…"
 gdp_merchant_trade_opportunity.9050.t: "Una oportunidad perdida"
 gdp_merchant_trade_opportunity.9050.desc_opening: "Una posibilidad prometedora se ha echado a perder.\n\nHemos perdido la oportunidad comercial de [trade_destination.GetBaronyNameExplicitlyNoTooltip], aquello que le daba sentido a este viaje."
 gdp_merchant_trade_opportunity.9050.desc_closing: "\n\nLa única cuestión es si tiene sentido continuar por esta senda de mal agüero."
 gdp_merchant_trade_opportunity.9050.reason_route_destroyed: "La ruta comercial de la que dependía ya no existe."
 gdp_merchant_trade_opportunity.9050.reason_market_left_route: "[trade_destination.GetBaronyNameExplicitlyNoTooltip] ya no está en [trade_opportunity_route.GetName]."
 gdp_merchant_trade_opportunity.9050.reason_trader_changed: "[trade_opportunity_route.GetName] ya no tiene al comerciante del que dependía esta oportunidad."
 gdp_merchant_trade_opportunity.9050.reason_upheaval_ended: "Por lo que parece, los disturbios en [trade_opportunity_route.GetName] se han resuelto solos."
 gdp_merchant_trade_opportunity.9050.reason_purpose_artisan: "Como ya no nos consideramos artesanos, no tiene sentido involucrarnos en negocios semejantes."
 gdp_merchant_trade_opportunity.9050.reason_purpose_creditor: "Como ya no nos consideramos acreedores, no tiene sentido involucrarnos en negocios semejantes."
 gdp_merchant_trade_opportunity.9050.reason_competitor_gone: "Nuestra compañía rival está desapareciendo, según lo que nos cuentan los comerciantes errantes."
 gdp_merchant_trade_opportunity.9050.reason_entrepot_gone: "El centro de intercambio de nuestro destino ya no está disponible para nosotros, según parece."
 gdp_merchant_trade_opportunity.9050.reason_tolls_ended: "Según parece, ya no pagamos los cánones que nos propusimos administrar."
 gdp_merchant_trade_opportunity.9050.reason_silk_road: "Como suele suceder cuando la situación cambia, la Ruta de la Seda ya no es la misma que al comienzo de nuestro viaje, y con ello hemos perdido nuestra oportunidad de manipular su curso."
 gdp_merchant_trade_opportunity.9050.reason_unknown: "No está claro qué es lo que ha cambiado esta vez."
 gdp_merchant_trade_opportunity.9050.a: "No hay nada más que hacer aquí."
 gdp_merchant_trade_opportunity.9050.b: "Veamos qué nos ofrece [trade_destination.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.9050.b.tt: "Seguir el viaje y #weak visitar [trade_destination.GetBaronyNameExplicitly]#! a la llegada"
