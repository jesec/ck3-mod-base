l_spanish:
 gdp_merchant_trade_opportunity.0001.t: "Retar a un competidor: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0001.desc: "La presencia de [task_contract_target.GetPrimaryTitle.GetName] es un incordio constante que daña nuestras previsiones y beneficios, y en ningún lugar ocurre eso con más fuerza que en [local_market.GetShortName].\n\nHay que lidiar con esos alborotadores de un modo u otro y demostrarles que somos los verdaderos dueños de los mercados locales."
 gdp_merchant_trade_opportunity.0001.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0001.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0001.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0002.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0002.desc: "Tras días y noches de sermonear a los vendedores locales y averiguar todo lo posible sobre los mercados de [trade_market.GetShortName], hemos descubierto el punto débil de [target_title.GetName].\n\nCon los medios para socavar sus relaciones locales, ofrecer precios más baratos y superar sus ofertas, ¡muy pronto podremos echar abajo sus beneficios, junto con su reputación!"
 gdp_merchant_trade_opportunity.0002.a: "Le enseñaremos a no interponerse en nuestro camino."
 gdp_merchant_trade_opportunity.0002.b: "Mostrar nuestra jugada nos ganará su respeto."
 gdp_merchant_trade_opportunity.0002.b.tt: "Debes tener [Concept('friend', 'amistad')|E], ser [spouse|El] o poseer una [diplomacy|E] de al menos [SCOPE.ScriptValue('high_skill_rating')|V0] y no tener una [relation|El] negativa ni una [Concept('house_feuding', 'enemistad con su casa')|E]"
 gdp_merchant_trade_opportunity.0003.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0003.desc: "Nuestros esfuerzos para trazar las redes de [target_title.GetName] en [trade_market.GetShortName] y más allá han dado poco fruto. Hasta parece que hemos dañado nuestra reputación en su [task_contract.GetLocation.Custom('GetRegionalMarketTermGloss')].\n\nNuestra torpeza al actuar solo ha reforzado la posición de los [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip], y en las cadenas que sujetan sus rutas comerciales no aparece ni una sola grieta…"
 gdp_merchant_trade_opportunity.0003.a: "¡Voto a [ROOT.Char.GetFaith.WealthGodName]! ¡Esto se comerá los beneficios!"
 gdp_merchant_trade_opportunity.0011.t: "Promocionar artículos: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0011.desc: "Los bulliciosos [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] de [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] son testigos de una competencia feroz entre vendedores y comerciantes de artículos de todas clases.\n\nEntre el barullo y el roce de los transeúntes, se pone claramente de relieve la cuestión de cómo nuestras mercancías y artículos destacarán entre la multitud, cómo captarán la atención de clientes y tenderos por igual…"
 gdp_merchant_trade_opportunity.0011.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0011.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0011.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0012.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0012.desc: "Nuestros intentos por promocionar la venta de [trade_good_type.GetNameNoTooltip|l] en [target_title.GetBaseNameNoTierNoTooltip] parecen haber triunfado; muchos buscan nuestros productos «excelentes» y las ventas han ido aumentando constantemente en toda la zona.\n\n¡Parece que nuestra insistencia y promoción han servido para que aflojen la bolsa!"
 gdp_merchant_trade_opportunity.0012.a: "No desperdiciaremos esta oportunidad."
 gdp_merchant_trade_opportunity.0012.b: "¡Ya casi huelo los [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationPlural')]!"
 gdp_merchant_trade_opportunity.0013.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0013.desc: "Va quedando claro que nuestros esfuerzos por atraer a los clientes con, lo reconozco, algunas exageraciones sobre la calidad de nuestros artículos no han conseguido el efecto deseado…\n\nLas ventas, como poco, están cayendo y la demanda de [trade_good_type.GetNameNoTooltip|l] en [target_title.GetBaseNameNoTierNoTooltip] parece agotarse al tiempo que decae la confianza entre los clientes."
 gdp_merchant_trade_opportunity.0013.a: "¡Pero si #EMP son#! mi mejor ejemplo de [trade_good_type.GetNameNoTooltip|l]!"
 gdp_merchant_trade_opportunity.0021.t: "Incentivar la inversión: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0021.desc: "Recorrer [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] resalta las muchas deficiencias de sus infraestructuras; desde la calidad de sus caminos y las míseras instalaciones de almacenamiento hasta el [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGloss')|l] en sí.\n\nHay que hacer que los gobernantes locales vean cómo les compensan unas pequeñas inversiones. De lo contrario, tendremos que hacerlo nosotros mismos si queremos aprovechar al máximo nuestras conexiones aquí…"
 gdp_merchant_trade_opportunity.0021.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0021.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0021.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0022.t: "$scheme_critical_moments.8002.t$"
 gdp_merchant_trade_opportunity.0022.desc: "Diagnosticar certeramente las deficiencias de las infraestructuras del país [target_title.GetAdjectiveNoTooltip] y los beneficios que se podrían ganar con su mejora nos ha granjeado la atención de la gente adecuada.\n\nLas semillas aún tienen que dar fruto, pero parece que nos hemos ganado [local_ruler.Custom('ES_AlAla')] [local_ruler.GetTitledFirstName|l] y las obras van a empezar. Al saber que el flujo de comercio va a comenzar, los comerciantes y vecinos de la zona ya quieren felicitarnos."
 gdp_merchant_trade_opportunity.0022.a: "Para que algo salga bien, hay que hacerlo uno mismo."
 gdp_merchant_trade_opportunity.0023.t: "$scheme_critical_moments.8003.t$"
 gdp_merchant_trade_opportunity.0023.desc: "Nuestros intentos por convencer a los de aquí de las innumerables deficiencias de las infraestructuras del país [target_title.GetAdjectiveNoTooltip] han producido unos resultados bochornosamente escasos y parece improbable que contemos con la atención de estos necios.\n\nUna pifia tras otra, las cosas quedarán prácticamente iguales a como nos las encontramos y lo único que nuestro trabajo habrá conseguido serán unos funcionarios y comerciantes locales confusos, a menos que nos ocupemos personalmente…"
 gdp_merchant_trade_opportunity.0023.a: "El comercio debe fluir, de un modo u otro."
 gdp_merchant_trade_opportunity.0023.b: "Los lugareños son unos necios…"
 gdp_merchant_trade_opportunity.0031.t: "$exploit_upheaval_contract$: [local_market.GetShortNameNoTooltip]"
 gdp_merchant_trade_opportunity.0031.desc: "Las cicatrices de la desgracia son visibles en los [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] de [local_market.GetShortName], cuyas tiendas cerradas con tablones y abandonadas nos hablan del flujo de comercio malogrado después del éxodo de los comerciantes en estos momentos tan complicados.\n\nSin embargo, deben aprender que quedarse de brazos cruzados o huir no ayuda en nada al comercio y la paz nunca está garantizada. Sobre nosotros recae traer el orden y ocupar el lugar vacante."
 gdp_merchant_trade_opportunity.0031.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0031.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0031.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0032.t: "$exploit_upheaval_contract$: éxito"
 gdp_merchant_trade_opportunity.0032.desc: "Mientras espiaban desde detrás de sus puertas cerradas, los habitantes de [target_title.GetBaseNameNoTierNoTooltip] entendieron rápidamente lo que queríamos hacer y hemos consolidado un dominio firme sobre el mercado y el almacenamiento.\n\nQuienes perdieron en este reajuste han tenido que aceptar de mala gana los beneficios del regreso del orden y el lento rejuvenecimiento del comercio."
 gdp_merchant_trade_opportunity.0032.a: "Solo es bueno para el negocio…"
 gdp_merchant_trade_opportunity.0032.b: "Hemos terminado el trabajo aquí."
 every_county_province_custom: "Toda [holding|El] con el modificador $recently_looted_modifier$ en [saved_county.GetName]."
 gdp_merchant_trade_opportunity.0033.t: "$exploit_upheaval_contract$: fracaso"
 gdp_merchant_trade_opportunity.0033.desc: "Nuestra presencia agresiva en [target_title.GetBaseNameNoTierNoTooltip] y los intentos de empujar a sus residentes hacia nuestras metas se han recibido con una hostilidad muy extendida y un rechazo terco a cooperar.\n\nEl populacho y los vendedores locales se han agrupado contra nosotros; ¡consideran que imponer nuestra dominación es un precio demasiado alto por la restauración del orden y el comercio!"
 gdp_merchant_trade_opportunity.0033.a: "¡Necios testarudos!"
 gdp_merchant_trade_opportunity.0041.t: "$support_guilds_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0041.desc: "Los [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] de [local_market.GetShortName] albergan una serie de agrupaciones artesanales, cuyos miembros rigurosamente regulados producen de todo, desde cuerdas a vajillas, para responder a las necesidades de lugareños y compradores.\n\nCon las presentaciones adecuadas accederíamos a estas redes de artesanos diestros, nos crearíamos una reputación como patrones y puede que averiguásemos algunos métodos o tendencias rentables."
 gdp_merchant_trade_opportunity.0041.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0041.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0041.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0042.t: "$support_guilds_contract$: éxito"
 gdp_merchant_trade_opportunity.0042.desc: "Nuestras monedas nos han creado unas conexiones provechosas en [target_title.GetBaseNameNoTierNoTooltip] al financiar agrupaciones de artesanos talentosos de toda clase, con miembros que producen en silencio artículos tanto sencillos como maravillosos.\n\nQue se nos reconozca como patrones conlleva una cálida bienvenida en todos los barrios y la atención de un[inspired_artisan.Custom('ES_XA')] artesan[inspired_artisan.Custom('ES_OA')] bien conocid[inspired_artisan.Custom('ES_OA')], [inspired_artisan.GetFirstName], que busca financiación para producir su [inspired_artisan.Custom('InspirationArtisanType')]."
 gdp_merchant_trade_opportunity.0042.a: "Nuestras inversiones han alcanzado su objetivo."
 gdp_merchant_trade_opportunity.0042.b: "¡No podemos desperdiciar esta oportunidad!"
 gdp_merchant_trade_opportunity.0043.t: "$support_guilds_contract$: fracaso"
 gdp_merchant_trade_opportunity.0043.desc: "Nuestros intentos de acceder a las redes de los artesanos locales de [target_title.GetBaseNameNoTierNoTooltip] han sido rechazados en cada instancia, nuestras monedas e intereses aceptados de mala gana y con poca gratitud.\n\n¿Nuestra reputación se ha estropeado por algún malentendido, la manipulación de nuestros rivales o sencillamente por la osadía de meter las narices? Nunca lo sabremos…"
 gdp_merchant_trade_opportunity.0043.a: "Bah, de todas maneras sus artículos eran escoria…"
 gdp_merchant_trade_opportunity.0051.t: "$seek_debtors_contract$: [task_contract_title.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0051.desc: "Los [task_contract_title.GetProvince.Custom('GetRegionalMarketTermGlossPlural')|l] de [task_contract_title.GetProvince.GetBaronyNameExplicitlyNoTooltip] laten con la llamada del lucro, que se palpa en cada mirada y gesto. El lugar reclama nuestras monedas y atrae a futuros clientes, incapaces de resistir su promesa.\n\nEs más fácil encontrar gente que quiere [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] que gente que los dé, pero debemos tener cautela. Hemos echado el cebo para que pique la flor y nata de [local_market.GetShortName], y una presa meritoria requiere astucia y paciencia."
 gdp_merchant_trade_opportunity.0051.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0051.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0051.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0052.t: "$seek_debtors_contract$: éxito"
 gdp_merchant_trade_opportunity.0052.desc: "Tras haber hecho saber por [target_title.GetBaseNameNoTierNoTooltip] sobre nuestras líneas de crédito abiertas, no pasa mucho antes de recibir una invitación curiosamente humilde, y nada menos que [debtor.Custom('ES_DelDela')] [debtor.GetTitledFirstName|l].\n\nSe ve que [debtor.Custom('ES_ElLa')] buen[debtor.Custom('ES_XA')] [debtor.Custom('LadyLordWomanMan')] precisa de cierta «flexibilidad» en sus cuentas. No corresponde a unos simples mercaderes cuestionar los recursos de alguien tan valorado…"
 gdp_merchant_trade_opportunity.0052.a: "«Ajustemos los libros de cuentas aquí… #EMP [debtor.GetFirstNameNoTooltip]. [debtor.GetTitleAsNameNoTooltip] de [debtor.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]…#!»."
 gdp_merchant_trade_opportunity.0052.b: "«Témome que esta vez no será posible, mi [debtor.GetLadyLord]»."
 gdp_merchant_trade_opportunity.0053.t: "$seek_debtors_contract$: fracaso"
 gdp_merchant_trade_opportunity.0053.desc: "Después de haber hecho saber sobre nuestras líneas de crédito abiertas, tenemos muy pocos resultados. Nuestras ofertas generosas han sido rechazadas con rotundidad por los notables de [target_title.GetBaseNameNoTierNoTooltip].\n\nCuesta saber si es que no supimos llevar nuestros tratos, otros mercaderes interfirieron o los potentados de la región disfrutan de una prosperidad general poco común."
 gdp_merchant_trade_opportunity.0053.a: "Da igual, ya vendrán suplicando. Como siempre…"
 gdp_merchant_trade_opportunity.0061.t: "$sabotage_competition_contract$: [task_contract_target.GetHouse.GetBaseNameNoTooltip]"
 gdp_merchant_trade_opportunity.0061.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))] [contract_employer.GetFirstName] llega con noticias interesantes: [market_owner.GetName] precisa de [trade_good_type.GetNameNoTooltip|l] y busca a un mercader que le proporcione un gran cargamento. \n\n[task_contract_target.Custom('ES_ElLa')|U] presuntuos[task_contract_target.Custom('ES_OA')] [task_contract_target.GetTitledFirstName|l] de la compañía [task_contract_target.GetHouse.GetBaseName] ha afirmado orgullos[task_contract_target.Custom('ES_OA')] que [task_contract_target.GetSheHe], sin duda alguna, conseguirá cerrar el trato. Creo que con astucia e ingenio podemos superar su oferta y ponerle en su sitio."
 gdp_merchant_trade_opportunity.0061.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0061.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0061.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0062.t: "$sabotage_competition_contract$: éxito"
 gdp_merchant_trade_opportunity.0062.desc: "Nuestros intentos sutiles por socavar el comercio de [target_title.GetName] han funcionado en nuestro favor. Cuando llegó el día de pujar, lo único que pudo hacer [target_title.GetHolder.Custom('ES_ElLa')] [target_title.GetHolder.GetTitledFirstName|l] fue contemplar con pasmo y horror cómo nos hacíamos con la victoria en su lugar.\n\nLa reputación de [target_title.GetNameNoTooltip] ha quedado gravemente dañada y lo sensato sería aprovechar este vacío de poder en nuestro beneficio."
 gdp_merchant_trade_opportunity.0062.a: "Todo va según lo planeado…"
 gdp_merchant_trade_opportunity.0063.t: "$sabotage_competition_contract$: fracaso"
 gdp_merchant_trade_opportunity.0063.desc: "A pesar de nuestros esfuerzos por usar subterfugios, [target_title.GetHolder.Custom('ES_ElLa')] [target_title.GetHolder.GetTitledFirstName|l] nos ha vuelto a superar. Con humillación, debemos admitir una derrota aplastante contra [target_title.GetNameNoTier].\n\nPuede que nunca sepamos las causas de nuestro traspiés: ¿nos pudo el orgullo o fue tal vez falta de finura financiera? Por ahora todo lo que sabemos es que hemos acabado en el bando perdedor con la cabeza embotada y la bolsa vacía."
 gdp_merchant_trade_opportunity.0063.a: "Ya les pillaremos la próxima vez…"
 gdp_merchant_trade_opportunity.0071.t: "$build_category_connections_contract$: [trade_good_category.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0071.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], examina un envío de [trade_good_type.Custom('GetTradeGood')|l] y se vuelca sobre tales [trade_good_type.Custom('GetTradeGoodUnitPlural')|l] en busca de cualquier marca de maltrato, comprobando cada cierre.\n\nUn artículo no siempre se usa al máximo de su potencial y puede echarse a perder por descuido o ignorancia. Del vendedor ambulante más humilde al comerciante al por mayor más elevado, se puede aprender mucho."
 gdp_merchant_trade_opportunity.0071.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0071.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0071.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0072.t: "$build_category_connections_contract$: éxito"
 gdp_merchant_trade_opportunity.0072.desc: "Revoloteando entre los tenderetes del pueblo [destination.Custom('GetProvinceAdjective')] del concurrido [destination.Custom('GetRegionalMarketTermGloss')] de [destination.GetTitle.GetNameNoTierNoTooltip] y sus silenciosos salones de comercio, hemos reunido muchos chismes, cuentos y consejos sobre el arte del comercio de [trade_good_type.Custom('GetTradeGood')].\n\nDesde el almacenamiento y transporte de [trade_good_type.Custom('GetTradeGoodUnitPlural')], a la demanda y apreciación estacional de la calidad, seguro que nuestros conocimientos beneficiarán a nuestro comercio en [local_market.GetName|l] y más allá."
 gdp_merchant_trade_opportunity.0072.a: "¿Quién hubiera imaginado que comerciar con [trade_good_type.Custom('GetTradeGood')] tuviera tantos matices?"
 gdp_merchant_trade_opportunity.0073.t: "$build_category_connections_contract$: fracaso"
 gdp_merchant_trade_opportunity.0073.desc: "Pasamos días incontables y horas interminables circulando entre los tenderetes del pueblo [destination.Custom('GetProvinceAdjective')] del concurrido [destination.Custom('GetRegionalMarketTermGloss')] de [destination.GetTitle.GetNameNoTierNoTooltip] y sus silenciosos salones de comercio, pero parece que no nos hemos enterado del arte del comercio de [trade_good_type.Custom('GetTradeGood')].\n\nLos mercachifles taciturnos y los agentes desdeñosos raramente respondían a nuestras preguntas con más que desprecio desconcertado o silencio cauteloso, y los chismes que compartieron eran triviales o innecesariamente liosos. "
 gdp_merchant_trade_opportunity.0073.a: "¡Bah, no necesitamos su ayuda!"
 gdp_merchant_trade_opportunity.0081.t: "$disrupt_charter_contract$: [contract_target.GetPrimaryTitle.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0081.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_employer'))], [contract_employer.GetFirstName], pone los ojos en blanco mientras nos lamentamos de las últimas hazañas de [contract_target.GetPrimaryTitle.GetDefinitiveName|l] en [market.GetName|l].\n\nHay que hacer algo con es[contract_target.Custom('ES_EA')] [contract_target.GetTitledFirstName|l] y el apoyo que recibe [contract_target.GetSuzerain.Custom('ES_DelDela')] [contract_target.GetSuzerain.GetTitledFirstName|l], si no queremos morder el polvo…"
 gdp_merchant_trade_opportunity.0081.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0081.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0081.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0082.t: "$disrupt_charter_contract$: éxito"
 gdp_merchant_trade_opportunity.0082.desc: "Nuestro trabajo incansable en lisonjear a los intermediarios y difundir difamaciones sobre [target_title.GetDefinitiveName|l] y sus condenados privilegios parecen haber dado fruto, y ahora muchos se lo pensarán dos veces antes de aceptar la palabra [target_title.GetHolder.Custom('ES_DelDela')] [target_title.GetHolder.GetTitledFirstName|l] de buenas a primeras.\n\nIncluso se pone en duda la veracidad del sello [target_title.GetHolder.GetSuzerain.Custom('ES_DelDela')] [target_title.GetHolder.GetSuzerain.GetTitledFirstName|l] en los papeles [target_title.GetHolder.Custom('ES_DelDela')] [target_title.GetHolder.GetTitledFirstNameNoTooltip|l], algo que seguramente no haga muy feliz cuando lo escuchen en alguna de sus sedes."
 gdp_merchant_trade_opportunity.0082.a: "¡El destino perfecto de sus papeles es el/la [ROOT.Char.GetRite.NegativeAfterLife]!"
 gdp_merchant_trade_opportunity.0083.t: "$disrupt_charter_contract$: fracaso"
 gdp_merchant_trade_opportunity.0083.desc: "Nuestra infatigable tarea de crear redes y conspirar contra los condenados agentes de [target_title.GetDefinitiveName|l] no ha servido para nada, pues pocos desean considerar nuestro enfoque a la vista de un privilegio que lleva el mismísimo sello [target_title.GetHolder.GetSuzerain.Custom('ES_DelDela')] [target_title.GetHolder.GetSuzerain.GetTitledFirstName|l].\n\nLa reputación [target_title.GetHolder.Custom('ES_DelDela')] [target_title.GetHolder.GetTitledFirstName|l] sigue tan inmaculada como siempre y solo hemos conseguido manchar nuestro nombre al rebajarnos a tales bajezas…"
 gdp_merchant_trade_opportunity.0083.a: "[target_title.GetHolder.GetRite.FateGodName] aún sonríe a los [target_title.GetHolder.GetHouse.GetBaseNameNoTooltip]…"
 gdp_merchant_trade_opportunity.0091.t: "$alleviate_upheaval_contract$: [local_market.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.0091.desc: "Cuando mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] y yo recorríamos el [destination.Custom('GetRegionalMarketTermGloss')] encapotado, el pésimo estado de [destination.GetBaronyNameExplicitlyNoTooltip], provocado por los desastres de la guerra y las hambrunas, es evidente.\n\nUna cantidad preocupante de mendigos, ya sean viudas, huérfanos o tullidos, abarrota los callejones, y la fatalidad flota sobre los puestos abandonados como una segunda cortina de nubes."
 gdp_merchant_trade_opportunity.0091.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0091.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0091.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0092.t: "$alleviate_upheaval_contract$: éxito"
 gdp_merchant_trade_opportunity.0092.desc: "Abriéndonos paso por la zona, conseguimos encontrar a los vendedores ambulantes y comerciantes locales que aún operan a pesar de"
 gdp_merchant_trade_opportunity.0092.war: "los expolios de la guerra,"
 gdp_merchant_trade_opportunity.0092.disaster: "la cercanía de la calamidad,"
 gdp_merchant_trade_opportunity.0092.epidemic: "los brotes de enfermedades recientes,"
 gdp_merchant_trade_opportunity.0092.closing: "e incluso han devuelto algo de vigor a sus libros de contabilidad. Aunque poco, todo trabajo ayuda.\n\nDía a día, el [destination.Custom('GetRegionalMarketTermGloss')] de [destination.GetBaronyNameExplicitlyNoTooltip] parece resonar con unas cuantas voces más; sus puestos refulgen con unos cuantos artículos más y sus posadas se llenan con unos cuantos visitantes más.\n\n"
 gdp_merchant_trade_opportunity.0092.a: "[destination.GetBaronyNameExplicitlyNoTooltip] volverá a prosperar pronto."
 gdp_merchant_trade_opportunity.0093.t: "$alleviate_upheaval_contract$: fracaso"
 gdp_merchant_trade_opportunity.0093.desc: "Hemos recorrido [destination.GetBaronyNameExplicitlyNoTooltip] de lado a lado, en busca de oportunidades que pongan monedas en las manos de aquellos que pueden sacar lo mejor y restaurar la vida comercial de la zona, pero en su mayor parte ha sido en vano.\n\nAquellos que encontramos son mayormente especuladores indignos de nuestra generosidad o, si no es así, no les va especialmente bien. Cuesta mantener el optimismo a la vista de nuestros reveses y caemos en la desesperación y la frustración."
 gdp_merchant_trade_opportunity.0093.a: "No podemos hacer más…"
 gdp_merchant_trade_opportunity.0101.t: "$silk_road_network_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0101.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))] [associate.GetFirstName] y yo nos admiramos con los bulliciosos puestos del gran [destination.Custom('GetRegionalMarketTermGloss')] de [destination.GetTitle.GetNameNoTier]. Aquí el flujo del comercio no es algo abstracto, sino palpable, como [ROOT.Char.Custom('GroundType')] a nuestros pies.\n\nEn semejante lugar, abarrotado de mercaderes que aspiran a hacer tratos como [Select_CString(And(ROOT.Char.IsFemale, associate.IsFemale), 'nosotras', 'nosotros')], ¿cómo hemos podido fallar en encontrar una ventaja o favor?"
 gdp_merchant_trade_opportunity.0101.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0101.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0101.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0102.t: "$disrupt_charter_contract$: éxito"
 gdp_merchant_trade_opportunity.0102.desc: "Hemos pasado estas últimas semanas sin dejar de movernos, corriendo por [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] cada día en pos de reuniones y en busca de contactos, pero gracias a una diplomacia astuta y unos negocios aún más astutos, hemos construido una notable agenda de acuerdos con negociantes e intermediarios locales.\n\nEstá claro que nuestros esfuerzos no han sido en vano y nuestro trabajo nos ha puesto en buena situación para la próxima temporada."
 gdp_merchant_trade_opportunity.0102.a: "¡Ojalá nuestras semillas den fruto!"
 gdp_merchant_trade_opportunity.0103.t: "$silk_road_network_contract$: fracaso"
 gdp_merchant_trade_opportunity.0103.desc: "A pesar de nuestros intentos de congraciarnos con los negociantes e intermediarios locales, cruzando todos los días la extensión de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] en pos de reuniones y en busca de contactos, no hemos acabado mejor de lo que empezamos.\n\nDesde luego, esto augura problemas para la próxima temporada…"
 gdp_merchant_trade_opportunity.0103.a: "Por [ROOT.Char.GetRite.WealthGodName]…"
 gdp_merchant_trade_opportunity.0111.t: "$silk_road_caravan_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0111.desc: "$gdp_merchant_trade_opportunity.0101.desc$"
 gdp_merchant_trade_opportunity.0111.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0111.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0111.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0112.t: "$silk_road_caravan_contract$: éxito"
 gdp_merchant_trade_opportunity.0112.desc: "Hemos trabajado con diligencia, echando nuestras redes en la ciudad de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] en busca de puntos que nos concedan un favor o permitan un soborno. Enseguida se confirmaron nuestras esperanzas con unas cuantas subastas y acuerdos favorables, y la salud de las rutas quedó garantizada.\n\nPodemos sentarnos en paz, seguros de saber que nuestro trabajo ha garantizado una corriente constante de artículos durante algún tiempo."
 gdp_merchant_trade_opportunity.0112.a: "¡[ROOT.Char.GetRite.WealthGodName] nos sonríe!"
 gdp_merchant_trade_opportunity.0113.t: "$silk_road_caravan_contract$: fracaso"
 gdp_merchant_trade_opportunity.0113.desc: "Tanto trabajo diligente, echando nuestras redes en la ciudad de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] en busca de puntos que nos concedan un favor o permitan un soborno, ha quedado en nada, tragados como una gota de lluvia en este mar agitado del comercio.\n\nEstá claro que no hay modo de garantizar el espacio que la caravana necesita para cumplir las cuotas que deseamos, ni lo tendremos durante algún tiempo…"
 gdp_merchant_trade_opportunity.0113.a: "¿Qué es un comerciante sin una caravana…?"
 gdp_merchant_trade_opportunity.0121.t: "$entrepot_buy_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0121.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], y yo caminamos por el almacén de [destination.GetBaronyNameExplicitly], un centro de venta y reventa, donde mercaderes de todo pelaje se cruzan, haciendo llegar artículos de paso a destinos desconocidos y remotos.\n\nEn tal lugar, con tantos bienes que cambian de manos, son los tratos de escala, el negociar con precios a granel, lo que hace triunfar o fracasar la fortuna de un mercader…"
 gdp_merchant_trade_opportunity.0121.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0121.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0121.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0122.t: "$entrepot_buy_contract$: éxito"
 gdp_merchant_trade_opportunity.0122.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nNo sé cómo hemos salido sanos y salvos del nido de víboras, ¡y con una notable agenda de pagarés que aseguran precios de venta competitivos de [trade_good_type.Custom('GetTradeGoodUnitPlural')] de [trade_good_type.Custom('GetTradeGood')] en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] para la próxima temporada!"
 gdp_merchant_trade_opportunity.0122.intro: "Los días han sido un borrón de regateos, brega y lisonjas sin fin; los ojos me volaban entre el agitar de lenguas y el rechinar de dientes según se chillaban los precios en los patios de subasta, con recibos desechados, pagarés y fortunas perdidas llenos de [ROOT.Char.Custom('GroundType')]."
 gdp_merchant_trade_opportunity.0122.a: "¡Es un mercado de compradores!"
 gdp_merchant_trade_opportunity.0123.t: "$entrepot_buy_contract$: fracaso"
 gdp_merchant_trade_opportunity.0123.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nHemos salido del nido de víboras apaleados y agotados, privados de los precios de venta que intentamos garantizar para los cargamentos de [trade_good_type.Custom('GetTradeGood')] y superados por nuestros rivales…"
 gdp_merchant_trade_opportunity.0123.a: "Es un mercado de vendedores…"
 gdp_merchant_trade_opportunity.0131.t: "$entrepot_sell_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0131.desc: "$gdp_merchant_trade_opportunity.0121.desc$"
 gdp_merchant_trade_opportunity.0131.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0131.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0131.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0132.t: "$entrepot_sell_contract$: éxito"
 gdp_merchant_trade_opportunity.0132.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nNo sé cómo hemos salido sanos y salvos del nido de víboras, ¡y con una notable agenda de pagarés que aseguran precios de compra competitivos en [trade_good_type.Custom('GetTradeGoodUnitPlural')] de [trade_good_type.Custom('GetTradeGood')] en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] para la próxima temporada!"
 gdp_merchant_trade_opportunity.0132.a: "¡Es un mercado de vendedores!"
 gdp_merchant_trade_opportunity.0133.t: "$entrepot_sell_contract$: fracaso"
 gdp_merchant_trade_opportunity.0133.desc: "$gdp_merchant_trade_opportunity.0122.intro$\n\nHemos salido del nido de víboras apaleados y agotados, privados de los precios de compra que intentamos garantizar para los cargamentos de [trade_good_type.Custom('GetTradeGood')] y superados por nuestros rivales…"
 gdp_merchant_trade_opportunity.0133.a: "Es un mercado de compradores…"
 gdp_merchant_trade_opportunity.0141.t: "$negotiate_tolls_contract$: [task_contract_target.GetTitledFirstNameNoTooltip|l]"
 gdp_merchant_trade_opportunity.0141.desc: "Puede que sea justo que [task_contract_target.Custom('ES_ElLa')] [task_contract_target.GetTitledFirstName|l] se quede con una parte de las ventas de [local_market.GetName|l], como [Select_CString(task_contract_target.IsFemale, 'guardiana', 'guardián' )] de la paz y [Select_CString(task_contract_target.IsFemale, 'defensora', 'defensor' )] de la ley.\n\nSin embargo, #EMP siempre#! hay sitio para negociar. Tan solo necesitamos que vea el valor de nuestras rutas y explicarle la carga que sitúa sobre nuestras pobres espaldas…"
 gdp_merchant_trade_opportunity.0141.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0141.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0141.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0142.t: "$negotiate_tolls_contract$: éxito"
 gdp_merchant_trade_opportunity.0142.desc: "Han sido muchos días de regateos, adulación y exhortación en los salones [task_contract_target.Custom('ES_DelDela')] [task_contract_target.GetTitledFirstName|l] y nos siguen doliendo las mejillas de tanto sonreír, pero nuestros esfuerzos no han sido en vano.\n\nHemos garantizado una tasa de peaje reducida, lo que nos garantiza márgenes mejores durante un tiempo."
 gdp_merchant_trade_opportunity.0142.a: "Es el precio de los buenos negocios."
 gdp_merchant_trade_opportunity.0143.t: "$negotiate_tolls_contract$: fracaso"
 gdp_merchant_trade_opportunity.0143.desc: "Después de muchos días de regateos, adulación y exhortación en los salones [target.Custom('ES_DelDela')] [target.GetTitledFirstName|l], con las mejillas doloridas de tanto sonreír y las piernas débiles de tanto estar de pie, tenemos que regresar sin nada que mostrar después de tanto trabajo…\n\nHoy, cuando aguardábamos audiencia, los guardias [target.Custom('ES_DelDela')] [target.GetTitleAsNameNoTooltip|l] nos han informado con delicadeza de que, por desgracia, [target.GetSheHe] no podría ayudarnos y que tenía asuntos urgentes de los que ocuparse…"
 gdp_merchant_trade_opportunity.0143.a: "Pero parecía tan complaciente…"
 gdp_merchant_trade_opportunity.0151.t: "$smuggle_goods_contract$: [destination.GetTitle.GetNameNoTierNoTooltip]"
 gdp_merchant_trade_opportunity.0151.desc: "Distribuidores y cobradores de [local_market.GetName|l] caminan pavoneándose por la zona. Estos chacales se burlan mientras alforjas de [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] les cuelgan de los costados, llenas de oro ganado honradamente y sacado de las bolsas de los mercaderes, como [associate.GetFirstName] y yo…\n\nLos tributos [owner.Custom('ES_DelDela')] [owner.GetTitledFirstName|l] son la ruina de los negocios aquí y su ambición nos ha obligado a hacer tratos turbios."
 gdp_merchant_trade_opportunity.0151.a: "$merchant_base_trade_opportunity_schemes.0000.generic_option.success_chance$"
 gdp_merchant_trade_opportunity.0151.b: "$merchant_base_trade_opportunity_schemes.0000.generic_option.speed$"
 gdp_merchant_trade_opportunity.0151.c: "$merchant_base_trade_opportunity_schemes.0000.generic_option.secrecy$"
 gdp_merchant_trade_opportunity.0151.d: "$merchant_base_trade_opportunity_schemes.0000.generic_option.nothing$"
 gdp_merchant_trade_opportunity.0152.t: "$smuggle_goods_contract$: éxito"
 gdp_merchant_trade_opportunity.0152.desc: "Después de mucho trabajo duro, hemos creado buenos contactos entre los ociosos locales y hemos asegurado rutas #EMP alternativas#! fiables para los artículos que salen de [trade_market.GetName|l].\n\nCaja a caja, con cada cargamento que pasa por debajo de las crédulas narices de los guardias, pronto acumularemos ahorros…"
 gdp_merchant_trade_opportunity.0152.a: "Es #EMP nuestro#! el dinero que guardamos."
 gdp_merchant_trade_opportunity.0153.t: "$smuggle_goods_contract$: fracaso"
 gdp_merchant_trade_opportunity.0153.desc: "Nuestros intentos por crear una red de contrabando en [trade_market.GetName|l] se han visto frustrados en cada ocasión, por la incompetencia de nuestros agentes, la vigilancia de las autoridades locales y la deshonestidad de los ociosos locales…\n\nNo nos queda más remedio que seguir pagando, y todo este esfuerzo solo ha manchado nuestra reputación como agentes honrados."
 gdp_merchant_trade_opportunity.0153.a: "Deberíamos haber pagado los peajes sin más…"
 gdp_merchant_trade_opportunity.1001.t: "Untando los engranajes"
 gdp_merchant_trade_opportunity.1001.desc: "Nuestros contactos en el país [task_contract_location.GetTitle.GetDeJureLiege.GetAdjectiveNoTooltip] han mostrado una reticencia poco común a la hora de los tratos y ha quedado claro que [local_ruler.Custom('ES_ElLa')] gobernante local, [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstName|l], está en el meollo de todo.\n\nNo me cabe duda de que pronto recibiremos un mensaje de [local_ruler.GetSheHe] en persona para exigir una «#EMP muestra de las posibilidades#!» de sus tierras…"
 gdp_merchant_trade_opportunity.1001.a: "#weak *suspiro*#! Dadle sus [local_ruler.CustomFixedRandom('GetCurrencyDenominationPlural')]…"
 gdp_merchant_trade_opportunity.1001.b: "Seguramente una mente tan #EMP apreciada#! entenderá la situación."
 gdp_merchant_trade_opportunity.1001.b.good: "[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] queda encantad[local_ruler.Custom('ES_OA')]"
 gdp_merchant_trade_opportunity.1001.b.bad: "[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] se irrita"
 gdp_merchant_trade_opportunity.1001.c: "«Sabéis, [other_merchant.GetPrimaryTitle.GetNameNoTooltip|l] #EMP sí#! que se toma libertades»."
 gdp_merchant_trade_opportunity.1001.c.good: "[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] muerde el anzuelo"
 gdp_merchant_trade_opportunity.1001.c.bad: "[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] se siente agraviad[local_ruler.Custom('ES_OA')]"
 gdp_merchant_trade_opportunity.1001.d: "Bah, sobreviviremos."
 gdp_merchant_trade_opportunity.1011.t: "Munificencia mutua"
 gdp_merchant_trade_opportunity.1011.desc: "Nuestros tratos en [local_market.GetShortName] parecen haber captado la atención [local_ruler.Custom('ES_DelDela')] gobernante local, [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitledFirstName|l], quien ha invitado a la compañía a una audiencia privada.\n\nAl encontrarme frente a [local_ruler.GetSheHe], [local_ruler.Custom('ES_ElLa')] [local_ruler.GetTitleAsNameNoTooltip|l] sonríe. «El comercio trae grandes beneficios: al pueblo, a los nobles, ¡a la totalidad de [local_ruler.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! Compartid vuestros problemas conmigo y haré cuanto pueda»."
 gdp_merchant_trade_opportunity.1011.a: "#weak *ejem*#! «Las rutas han sido #EMP muy#! duras, eminencia…»."
 gdp_merchant_trade_opportunity.1011.b: "«Tengo ciertas ideas sobre el [task_contract_location.Custom('GetRegionalMarketTerm')|l] local»."
 gdp_merchant_trade_opportunity.1011.b.good: "Tu consejo es sensato"
 gdp_merchant_trade_opportunity.1011.b.bad: "Tu consejo es absurdo"
 gdp_merchant_trade_opportunity.1011.c: "«[other_merchant.GetPrimaryTitle.GetNameNoTooltip] puede poner las cosas muy difíciles»."
 gdp_merchant_trade_opportunity.1011.c.fallback: "«La competencia pone las cosas muy difíciles»."
 gdp_merchant_trade_opportunity.1011.c.good: "[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] te apoya"
 gdp_merchant_trade_opportunity.1011.c.bad: "[local_ruler.Custom('ES_ElLa')|U] [local_ruler.GetTitledFirstNameNoTooltip|l] apoya a los [other_merchant.GetHouse.GetNameNoTooltip]"
 gdp_merchant_trade_opportunity.1011.c.flavor: "Una competición de popularidad basada en la [diplomacy|El] [diplomacy_i|E] y la [opinion|El] [opinion_i|E]"
 gdp_merchant_trade_opportunity.1011.d: "«Bendit[local_ruler.Custom('ES_OA')] seáis vos y vuestro gobierno benevolente, [local_ruler.GetTitleAsNameNoTooltip|l]»."
 gdp_merchant_trade_opportunity.1021.t: "Competidor en común"
 gdp_merchant_trade_opportunity.1021.desc: "Obsesionad[ROOT.Char.Custom('ES_OA')] con esos canallas de [target.GetPrimaryTitle.GetName], me pilla por sorpresa el acercamiento [other_merchant.Custom('ES_DelDela')] [other_merchant.GetTitledFirstName|l] de [other_merchant.GetPrimaryTitle.GetName], otr[other_merchant.Custom('ES_OA')] competidor[other_merchant.Custom('ES_XA')] en los [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] de [local_market.GetShortName].\n\n«Os saludo, [ROOT.Char.GetTitledFirstNameNoTooltip|l]», comienza. «Me han contado vuestros problemas con es[target.Custom('ES_EA')] mercachifle [target.GetHouse.GetNameNoTooltip], [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l]. ¿Creéis que podríamos ayudarnos mutuamente?»."
 gdp_merchant_trade_opportunity.1021.a: "«¡Muy bien! He aquí el plan…»."
 gdp_merchant_trade_opportunity.1021.b: "«¿Cómo sé que sois de fiar?»."
 gdp_merchant_trade_opportunity.1021.b.good: "Llegáis a un acuerdo"
 gdp_merchant_trade_opportunity.1021.b.bad: "Llegáis a las manos"
 gdp_merchant_trade_opportunity.1021.c: "«Vos y yo les podemos poner las cosas muy difíciles»."
 gdp_merchant_trade_opportunity.1021.d: "«¡Jamás! ¡Vosotros los [other_merchant.GetHouse.GetNameNoTooltip] sois peores incluso!»."
 gdp_merchant_trade_opportunity.1031.t: "Secreto comercial"
 gdp_merchant_trade_opportunity.1031.desc: "Mientras rebuscaba en algunos registros de [task_contract_location.GetBaronyNameExplicitlyNoTooltip], unas cuantas hojas de papel se sueltan y caen al suelo. Me agacho a recogerlas y cuando me giro me topo con mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName], con ceño fruncido y respiración entrecortada.\n\nAl examinar los documentos, no puedo evitar asombrarme, pues ya me ha quedado claro por qué sufre. ¡[associate.GetFirstNameNoTooltip] ha estado ocultando información vital para el negocio que llevamos aquí! ¿Y todo por despecho?"
 gdp_merchant_trade_opportunity.1031.a: "«¡Maldita sea, [associate.GetFirstNameNoTooltip]! ¿A quién sois leal?»."
 gdp_merchant_trade_opportunity.1031.b: "«Vamos, ¿cuáles son vuestros agravios?»,"
 gdp_merchant_trade_opportunity.1031.c: "«#EMP ¡FUERA!#! ¡Ya no servís a los intereses de esta compañía!»."
 gdp_merchant_trade_opportunity.1041.t: "Un trabajo en familia"
 gdp_merchant_trade_opportunity.1041.desc: "La moral está por todo lo alto y en toda la compañía solo se habla de los últimos éxitos en [task_contract_location.GetBaronyNameExplicitlyNoTooltip] que, por casualidad, han sido dirigidos por mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.GetFirstName].\n\nSe cantan sus alabanzas como un[associate.Custom('ES_XA')] geni[associate.Custom('ES_OA')] del comercio, pero la verdad es que cada empresa se ha apoyado en el trabajo duro de muchas manos y bocas en toda la red [ROOT.Char.GetHouse.GetNameNoTooltip]."
 gdp_merchant_trade_opportunity.1041.a: "¡Buen trabajo, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1041.b: "Está claro que aún no os hemos aprovechado al máximo."
 gdp_merchant_trade_opportunity.1041.c: "¡Vuestro trabajo es increíble, un ejemplo para todos nosotros!"
 gdp_merchant_trade_opportunity.1051.t: "Buscando un acuerdo"
 gdp_merchant_trade_opportunity.1051.desc: "Cuando caminaba por el [task_contract_location.Custom('GetRegionalMarketTermGloss')|l], ¡se presenta de repente ante mí nuestr[target.Custom('ES_OA')] competidor[target.Custom('ES_XA')], [target.Custom('ES_ElLa')] [target.GetTitledFirstName|l] de [target.GetPrimaryTitle.GetName]! Aunque hay que decir que su deferencia me pilla algo desprevenid[ROOT.Char.Custom('ES_OA')].\n\n«Mirad, [ROOT.Char.GetTitledFirstNameNoTooltip|l]», suspira. «Seré franc[target.Custom('ES_OA')]. Nuestros respectivos intereses están enfrentados en este lugar y nada bueno saldrá de un choque entre nosotros. Os pido que desistáis."
 gdp_merchant_trade_opportunity.1051.desc.gold: "A cambio os pagaré unas monedas por las molestias»."
 gdp_merchant_trade_opportunity.1051.desc.luxury: "A cambio os daré un consejo para una adquisición maravillosa en una tierra lejana»."
 gdp_merchant_trade_opportunity.1051.a: "«Decís la verdad. Sea, acepto»."
 gdp_merchant_trade_opportunity.1051.b: "«Aquí hay algo…, negociemos»."
 gdp_merchant_trade_opportunity.1051.b.good: "[target.Custom('ES_ElLa')|U] [target.GetTitledFirstNameNoTooltip|l] acepta"
 gdp_merchant_trade_opportunity.1051.b.bad: "[target.Custom('ES_ElLa')|U] [target.GetTitledFirstNameNoTooltip|l] se niega"
 trade_opportunity_accept_feast_tt: "[target.GetShortUIName] celebrará una [activity|El] de tipo [GetActivityType('activity_feast').GetName|l] en tu honor"
 gdp_merchant_trade_opportunity.1052.t: "Banquete invalidado"
 trade_opportunity_gain_luxury_contract_tt: "Recibirás un [luxury_contract|El]"
 gdp_merchant_trade_opportunity.1051.d: "«Ja, ¡qué #EMP mal#! debe de ir el negocio! Ni pensarlo»."
 gdp_merchant_trade_opportunity.1061.t: "Apurando demasiado"
 gdp_merchant_trade_opportunity.1061.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.Custom('ES_ElLa')] [associate.GetTitledFirstName|l], se ha estado quejando de que al centrar los esfuerzos en cumplir con nuestros negocios en [task_contract_location.GetBaronyNameExplicitlyNoTooltip], nuestra capacidad de seguir el ritmo cotidiano de los [task_contract_location.Custom('GetRegionalMarketTermGlossPlural')|l] renquea.\n\n«Algo tiene que cambiar, [ROOT.Char.GetTitleAsNameNoTooltip|l]; ni el día tiene tantas horas ni la compañía tantas manos como para controlar los asuntos aquí, si esto sigue igual»."
 gdp_merchant_trade_opportunity.1061.a: "¡[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] no evita los desafíos!"
 gdp_merchant_trade_opportunity.1061.a.good: "Todo va como debe"
 gdp_merchant_trade_opportunity.1061.a.bad: "Te exiges demasiado"
 gdp_merchant_trade_opportunity.1061.b: "Los beneficios no caerán mientras yo esté aquí."
 gdp_merchant_trade_opportunity.1061.already_tt: "Ya obtenido: [associate.GetShortUIName] #N [EmptyScope.ScriptValue('minor_stress_gain')|V0]#! de [stress|El], [scheme|El] #P +1#! de [scheme_opportunity_opportunity|El] [scheme_opportunity_i|E]"
 gdp_merchant_trade_opportunity.1071.t: "Cuello de botella"
 gdp_merchant_trade_opportunity.1071.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.Custom('ES_ElLa')] [associate.GetTitledFirstName|l], camina de arriba abajo y pierde la paciencia con el zumbido perezoso de una mosca. «¡Agh!», se queja, «Mirad esto, [ROOT.Char.GetTitleAsNameNoTooltip|l]; ¡vuestro trabajo aquí en [task_contract_location.GetBaronyNameExplicitlyNoTooltip] está agotando mis recursos!».\n\nAl mirar más de cerca los recibos y los libros de cuentas, es difícil no darle la razón. [associate.GetFirstNameNoTooltip] suspira, «Tendremos que llegar a un compromiso o nuestra oficina se vendrá abajo ante esta tensión…»."
 gdp_merchant_trade_opportunity.1071.a: "Nos dedicaremos a una meta única."
 gdp_merchant_trade_opportunity.1071.d: "Dejadme este asunto a mí y centraos en vuestras tareas."
 gdp_merchant_trade_opportunity.1081.t: "En buenas manos"
 gdp_merchant_trade_opportunity.1081.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.Custom('ES_ElLa')] [associate.GetTitledFirstName|l], ha estado gestionando la mayoría de los detalles de nuestros negocios actuales en [task_contract_location.GetBaronyNameExplicitlyNoTooltip], ¡y se nota! [associate.GetFirstName] posee la atención al detalle y otras cualidades de un[associate.Custom('ES_XA')] comerciante con talento.\n\nDesde que empezamos a trabajar aquí, prácticamente no he tenido que comprobar un libro de cuentas ni hacer seguimiento de un pedido."
 gdp_merchant_trade_opportunity.1081.a: "¡Seguid así, [associate.GetFirstNameNoTooltip]!"
 gdp_merchant_trade_opportunity.1081.b: "Hay que recompensar tanta iniciativa."
 gdp_merchant_trade_opportunity.1081.c: "¡Toda la compañía debe fijarse en este ejemplo!"
 gdp_merchant_trade_opportunity.1081.c.title: "[associate.GetFirstNameNoTooltip] da ejemplo"
 gdp_merchant_trade_opportunity.1081.c.trigger: "Cualquier otro [associate|El] tiene menos de [EmptyScope.ScriptValue('medium_skill_rating')|V0] [stewardship_i|E]"
 gdp_merchant_trade_opportunity.1081.c.tt: "La [stewardship|lE] de otro [associate|El] aumenta en #P 1#! [stewardship_i]"
 gdp_merchant_trade_opportunity.1081.d: "Los [ROOT.Char.GetHouse.GetNameNoTooltip] son los mejores, claro."
 gdp_merchant_trade_opportunity.1091.t: "Un asociado tosco"
 gdp_merchant_trade_opportunity.1091.desc: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('associate'))], [associate.Custom('ES_ElLa')] [associate.GetTitledFirstName|l], ha asumido el mando de los tratos en curso en [task_contract_location.GetBaronyNameExplicitlyNoTooltip], si bien hay quien desearía que no lo hubiera hecho…\n\nParece que no hay día en el que no descubra una suma mal hecha por pereza o no tenga que sufrir las quejas de un contacto al que se le ha hecho esperar sin necesidad. ¡No se pueden llevar los negocios con tanta dejadez!"
 gdp_merchant_trade_opportunity.1091.b: "[associate.GetFirstNameNoTooltip], vamos a ver los libros."
 gdp_merchant_trade_opportunity.1091.b.good: "[associate.GetFirstNameNoTooltip] aprende un par de cosas"
 gdp_merchant_trade_opportunity.1091.b.bad: "[associate.GetFirstNameNoTooltip] es un caso perdido"
 gdp_merchant_trade_opportunity.1091.c: "La compañía tendrá que compensar la negligencia."
 gdp_merchant_trade_opportunity.1091.d: "Supongo que lo hace lo mejor que puede."
 gdp_merchant_trade_opportunity.1101.t: "Inversión de capital"
 gdp_merchant_trade_opportunity.1101.desc: "Los préstamos pueden ser una empresa para quienes tienen [ROOT.Char.CustomFixedRandom('GetCurrencyDenominationGlossPlural')] de sobra y paciencia para esperar el momento. En relación a esto, un[investor.Custom('ES_XA')] inversor[investor.Custom('ES_XA')] ansios[investor.Custom('ES_OA')] ha pedido verme en [task_contract_location.GetBaronyNameExplicitlyNoTooltip].\n\nMe recibe [investor.Custom('ES_ElLa')|l] [investor.GetTitledFirstName|l],"
 gdp_merchant_trade_opportunity.1101.ruler: "un[investor.Custom('ES_XA')] gobernante local de [investor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.1101.courtier: "cortesan[investor.Custom('ES_OA')] de un aristócrata de la zona."
 gdp_merchant_trade_opportunity.1101.adventurer: "una persona mundana con un séquito de seguidores."
 gdp_merchant_trade_opportunity.1101.fallback: "un[investor.Custom('ES_XA')] [investor.GetWomanMan] sin historia previa."
 gdp_merchant_trade_opportunity.1101.end: "«¡Saludos, [ROOT.Char.GetTitledFirstNameNoTooltip|l]!», sonríe con entusiasmo. «Desearía patrocinar libremente a [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip|l]. ¿Y qué esperaría yo a cambio? No nos preocupemos de eso ahora»."
 gdp_merchant_trade_opportunity.1101.a: "Podéis confiar en nosotros, [investor.GetFirstNameNoTooltip]."
 gdp_merchant_trade_opportunity.1101.c: "Un poco más rendiría mucho, lo garantizo por mi honor."
 gdp_merchant_trade_opportunity.1101.d: "Me halagáis, pero esta vez vamos a mantenernos austeros."
 gdp_merchant_trade_opportunity_1101_calling_tt: "[investor.GetShortUIName] escribirá para recaudar [interest|0V] [gold_i|E] (#M 20 % de interés#!) dentro de #V 5#! años"
 gdp_merchant_trade_opportunity.1102.opening: "[investor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 gdp_merchant_trade_opportunity.1102.desc: "Ha llegado al fin la hora de cosechar los frutos de mi inversión con vuestra apreciada compañía comercial.\n\nAguardo paciente la recepción de mis [investor.CustomFixedRandom('GetCurrencyDenominationGlossPlural')]."
 gdp_merchant_trade_opportunity.1102.a: "Sea, espero que os encontréis bien a la recepción de los fondos."
 gdp_merchant_trade_opportunity.1102.b: "Ya, veréis, ha sido un periodo de vacas flacas, [investor.GetFirstNameNoTooltip]…"
 gdp_merchant_trade_opportunity.1102.b.good: "[investor.GetFirstNameNoTooltip] acepta tus excusas"
 gdp_merchant_trade_opportunity.1102.b.bad: "[investor.GetFirstNameNoTooltip] se huele algo"
 gdp_merchant_trade_opportunity.1102.d: "No tenéis ninguna inversión con nosotros y se acabó."
 gdp_merchant_trade_opportunity.9000.t: "Negocios apremiantes en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]"
 gdp_merchant_trade_opportunity.9000.desc: "Solventado ese asunto, hay otro tema que requiere nuestra atención aquí en [ROOT.Char.GetCurrentLocation.GetTitle.GetTradeMarket.GetName|l].\n\n¿Deberíamos arreglar nuestros asuntos en [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] antes de regresar a [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]?"
 gdp_merchant_trade_opportunity.9000.a: "Habría que echarle un vistazo."
 gdp_merchant_trade_opportunity.9000.b: "Liquidemos este asunto."
 gdp_merchant_trade_opportunity.9000.c: "Me encargaré de este asunto."
 gdp_merchant_trade_opportunity.9000.d: "No, se nos necesita de vuelta en [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 gdp_merchant_trade_opportunity.9000.accept_tt: "Aceptas y empiezas la [trade_opportunity|El] de [trade_opportunity_tier_tier|El] [THIS.TaskContract.GetTaskContractTierValue|V] de [THIS.TaskContract.GetEmployer.GetUIName] de tipo [THIS.TaskContract.GetType.GetName|Vl] en [THIS.TaskContract.GetLocation.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.t: "Oportunidad comercial: [task_contract.GetType.GetName|l]"
 gdp_merchant_trade_opportunity.9010.intro_elsewhere: "Un negocio importante para la compañía aguarda en [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.intro: "Un negocio importante para la compañía aguarda aquí en [task_contract_location.GetBaronyNameExplicitly],"
 gdp_merchant_trade_opportunity.9010.desc: "y mis tareas deben quedar en manos de mis asociados hasta que regrese.\n\n"
 gdp_merchant_trade_opportunity.9010.partner: "A mi [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l], [partner.GetFirstName], se le podría dar la responsabilidad de este asunto mientras yo me ocupo de otras cuestiones."
 gdp_merchant_trade_opportunity.9010.partner_busy: "Mi [GetCourtPositionType('partner_court_position').GetNameNoTooltip|l], [partner.GetFirstName], se encuentra indispuest[partner.Custom('ES_OA')]. A lo mejor debería encargarme yo…"
 gdp_merchant_trade_opportunity.9010.candidate: "A menos que encuentre a alguien a quien confiar una cuestión tan importante, tendré que ocuparme yo personalmente."
 gdp_merchant_trade_opportunity.9010.no_partner: "Como no hay nadie más a quien confiar una cuestión tan importante, tendré que ocuparme yo personalmente."
 gdp_merchant_trade_opportunity.9010.a: "No hay tiempo que perder."
 gdp_merchant_trade_opportunity.9010.c: "Sí, [partner.GetFirstNameNoTooltip] puede ocuparse de ello."
 gdp_merchant_trade_opportunity.9010.c.no_partner: "Mi socio se encargará."
 gdp_merchant_trade_opportunity.9010.c.involved.tt: "[partner.GetShortUIName] ya está involucrad[partner.Custom('ES_OA')] en la [trade_opportunity|El]"
 gdp_merchant_trade_opportunity.9010.c.involved_other.tt: "Tu socio está ocupad[partner.Custom('ES_OA')] tratando con otra [trade_opportunity|El]"
 gdp_merchant_trade_opportunity.9010.tt.partner_assign: "Se ha asignado a tu [trade_opportunity|El] [task_contract.GetType.GetName|V]"
 gdp_merchant_trade_opportunity.9010.tt.partner_away: "@alert_icon! #M No estará disponible hasta que se termine el [task_contract|El]#!"
 gdp_merchant_trade_opportunity.9010.tt.partner_outcome: "@alert_icon! #M Probabilidad de éxito según su [aptitude|El] ([THIS.Char.GetCourtPositionAptitude( GetCourtPositionType( 'partner_court_position' ) )] )#!"
