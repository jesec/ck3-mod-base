 gdp_merchant_trade_opportunity.9010.tt.partner_assigned: "Se ha asignado a [THIS.Char.GetShortUIName] a tu [trade_opportunity|El] [task_contract.GetType.GetName] en [task_contract_location.GetBaronyNameExplicitly]"
 gdp_merchant_trade_opportunity.9010.d: "A lo mejor [candidate.GetFirstNameNoTooltip] está a la altura."
 gdp_merchant_trade_opportunity.9010.d.no_candidate: "A lo mejor hay alguien a la altura."
 gdp_merchant_trade_opportunity.9010.d.tt: "Tienes [associates|El] que:\n$EFFECT_LIST_BULLET$No son [traders|El]\n$EFFECT_LIST_BULLET$Pueden ser tu [GetCourtPositionType('partner_court_position').GetName|l]"
 gdp_merchant_trade_opportunity.9010.e: "Olvidadlo, otro negocio llama."
 gdp_merchant_trade_opportunity.9010.e.tt: "Se descartará el [task_contract|El]"
 gdp_merchant_trade_opportunity.9010.tt.destination_list: "Empiezas inmediatamente el [Concept('traveling', 'viaje')|E] a [task_contract_location.GetBaronyNameExplicitly]"
