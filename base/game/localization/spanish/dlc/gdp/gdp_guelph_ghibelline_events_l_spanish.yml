l_spanish:
 guelphs_ghibellines_prefix: "Güelfos y gibelinos:"
 gdp_guelph_ghibelline.0500.t: "Los güelfos y los gibelinos"
 gdp_guelph_ghibelline.0500.intro.all: "Una mirada sospechosa, un resoplido de desdén… El conflicto entre [pope_scope.Custom('ES_ElLa')] [pope_scope.GetTitledFirstName|l] y [ghibelline_leader.Custom('ES_ElLa')] [ghibelline_leader.GetTitledFirstName|l] ha creado una brecha creciente en las comunidades del norte de Italia, que antes estaban tan estrechamente unidas.\n\nQuienes apoyan a los gibelinos [ghibelline_leader.Custom('ES_DelDela')] [ghibelline_leader.GetTitleAsNameNoTooltip|l] por su imperialismo y protección se enfrentan contra aquellos que buscan una mayor independencia con su respaldo a los güelfos del papado."
 gdp_guelph_ghibelline.0500.desc.guelph_leader: "Una mirada sospechosa, un resoplido de desdén… Este absurdo conflicto entre [ghibelline_leader.Custom('ES_ElLa')] apóstata [ghibelline_leader.GetTitleAsName|l] y mis devotos oficiales por desgracia ha creado una brecha creciente en las comunidades del norte de Italia, que antes estaban tan estrechamente unidas.\n\nQuienes apoyan a los gibelinos imperialistas por seguridad y protección se enfrentan a los güelfos temerosos de dios, que únicamente defienden su soberanía ante este tirano.\n\nJuntos, obligaremos [ghibelline_leader.Custom('ES_AlAla')] [ghibelline_leader.GetTitleAsNameNoTooltip|l] a entrar en razón. Es hora de que trabaje en mi [ROOT.Char.Custom('GetHighestSkillAdjective')|l]."
 gdp_guelph_ghibelline.0500.desc.ghibelline_leader: "Una mirada sospechosa, un resoplido de desdén… Mi absurdo conflicto contra los necios del papado al parecer ha creado una brecha creciente en las comunidades del norte de Italia, que antes estaban tan estrechamente unidas.\n\nQuienes apoyan a #EMP mis#! gibelinos por su seguridad y protección se enfrentan contra quienes quieren la inseguridad y una frágil independencia al ofrecer su apoyo a los ingenuos güelfos del papado.\n\nAl igual que [ghibelline_leader.Custom('ES_ElLa')] [ghibelline_leader.GetTitleAsNameNoTooltip|l], he empezado a desconfiar de estos entrometidos güelfos eclesiásticos. Llevan mucho tiempo socavando mi autoridad, pero terminarán por someterse, sea como sea…"
 gdp_guelph_ghibelline.0500.desc.guelph_member: "\n\nBenditos seamos, pues nuestr[guelph_leader.Custom('ES_OA')] devot[guelph_leader.Custom('ES_OA')] líder, [guelph_leader.Custom('ES_ElLa')] [guelph_leader.GetTitledFirstName|l], será nuestra voz y dirigirá la lucha contra nuestro imperialista opresor. Y yo haré mi parte."
 gdp_guelph_ghibelline.0500.desc.ghibelline_member: "\n\nEntiendo que nuestr[ghibelline_leader.Custom('ES_OA')] [ghibelline_leader.GetTitleAsNameNoTooltip|l] es [ghibelline_leader.Custom('ES_ElLa')] únic[ghibelline_leader.Custom('ES_OA')] y verdader[ghibelline_leader.Custom('ES_OA')] defensor[ghibelline_leader.Custom('ES_XA')] de nuestra gente y nuestros señoríos contra aquellos que buscan dañarnos. A cambio, yo apoyaré a sus gibelinos incondicionalmente."
 gdp_guelph_ghibelline.0500.desc.unaligned: "\n\nComo aún no he elegido a quién dar mi lealtad, tendré que sopesar los bandos enfrentados cuidadosamente para actuar teniendo en cuenta lo mejor para la casa [ROOT.Char.GetHouse.GetBaseName]."
 gdp_guelph_ghibelline.0500.a: "¡Adelante!"
 gdp_guelph_ghibelline.1000.opening: "[gg_leader.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 gdp_guelph_ghibelline.1000.desc: "Se me ha hecho saber que habéis estado difundiendo y reforzando sin descanso la posición de poder [ROOT.Char.Custom('GetGuelphGhibellinePossessive')] en ese conflicto irritante.\n\nPor lo tanto, contáis con mi agradecimiento inquebrantable."
 gdp_guelph_ghibelline.1000.a: "Os lo agradezco."
 gdp_guelph_ghibelline.5000.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.5000.desc: "No me uniré a la causa perdida de los [actor.Custom('GetGuelphsGhibellines')|l] a corto plazo."
 gdp_guelph_ghibelline.5000.a: "Muy poco sensato."
 gg_recruit_partisan_interaction_cooldown_tt: "[actor.GetShortUIName|U] no [Select_CString(actor.IsLocalPlayer, 'podrás', 'podrá')] pedir a [Select_CString(recipient.IsLocalPlayer,'tu personaje', recipient.GetShortUIName)] que se una a los [actor.Custom('GetGuelphsGhibellines')|l] durante varios años"
 gdp_guelph_ghibelline.6500.t: "$guelphs_ghibellines_prefix$ el concordato de Worms"
 gdp_guelph_ghibelline.6500.desc: "Este conflicto se ha prolongado demasiado. Tras mucho reflexionar, los escribanos me presentan un acuerdo escrito:\n\nSe limitará la influencia [ghibelline_leader.Custom('ES_DelDela')] [ghibelline_leader.GetTitleAsName|l] en nombramientos eclesiásticos, pero se le permitirá volver a observar las elecciones y juzgar los resultados discutidos.\n\nMe acaricio la barbilla mientras cavilo con cuidado cómo esto nos afectará a todos."
 gdp_guelph_ghibelline.6500.a: "Así es como debe ser."
 gdp_guelph_ghibelline.6500.b: "¡El poder del papado es #EMP absoluto#!!"
 concordat_of_worms_fulfilled.t: "Concordato de Worms cumplido"
 concordat_of_worms_abandoned.t: "Concordato de Worms abandonado"
 hre_decides_the_outcome.tt: "El [GetTitleByKey('e_hre').GetHolder.GetShortUIName] decide si aceptar el acuerdo"
 cow_phase_moves_to_agitation.tt: "El choque entre [GetSituation('guelph_ghibelline').GetName|l] deja la fase de preludio y pasa a [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName|l]"
 cow_phase_moves_to_repose.tt: "El choque entre [GetSituation('guelph_ghibelline').GetName|l] deja la fase de preludio y pasa a [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName|l]"
 gdp_guelph_ghibelline.6505.opening: "[guelph_leader.Custom2('AppropriateGreeting', ROOT.Char )]"
 gdp_guelph_ghibelline.6505.desc: "Dejemos a un lado nuestras diferencias por un instante y lleguemos a un acuerdo sobre el modo correcto de regir vuestros nombramientos eclesiásticos.\n\nA cambio, [ROOT.Char.Custom('ES_ElLa')] [ROOT.Char.GetTitleAsNameNoTooltip|l] podrá acudir a las elecciones y gestionar los resultados discutidos."
 gdp_guelph_ghibelline.6505.a: "Supongo que servirá con esto…"
 gdp_guelph_ghibelline.6505.b: "¡Esto es inaceptable!"
 gdp_guelph_ghibelline.7000.t: "$guelphs_ghibellines_prefix$ la $lombard_league_name$"
 gdp_guelph_ghibelline.7000.desc: "Se cuenta que [hre_kaiser.Custom('ES_ElLa')] [hre_kaiser.GetTitleAsName|l] tiene la vista puesta en el norte de Italia, con la intención de centralizar y reforzar su poder en la región; mis mensajeros han regresado:"
 gdp_guelph_ghibelline.7000.desc.all: "\n\nTodos a los que se les ha preguntado se han unido a la Liga Lombarda a instancia mía.\n\n¡Ahora somos lo bastante fuertes para resistirnos a cualquier movimiento repentino [hre_kaiser.Custom('ES_DelDela')] [hre_kaiser.GetTitleAsName|l]!"
 gdp_guelph_ghibelline.7000.desc.more_than_half: "\n\nMás de la mitad de aquellos a los que se les ha preguntado se han unido a la Liga Lombarda a instancia mía.\n\nEsto nos debería permitir resistirnos [hre_kaiser.Custom('ES_AlAla')] [hre_kaiser.GetTitleAsName|l] y, con suerte, podríamos recibir una ayuda extra de nuestros amigos santos…"
 gdp_guelph_ghibelline.7000.desc.less_than_half: "\n\nSolo un puñado de aquellos a los que se les ha preguntado se han unido a la Liga Lombarda, lo que desde luego me causa preocupación.\n\n#EMP ¡No importa!#! Con un poco de ayuda divina, bien podríamos defender nuestra independencia recién descubierta."
 gdp_guelph_ghibelline.7000.a: "¡Es hora de un cambio!"
 gdp_guelph_ghibelline.7000.b: "¡Este es nuestro momento!"
 gdp_guelph_ghibelline.7005.t: "$guelphs_ghibellines_prefix$ ¿unirse a la $lombard_league_name$?"
 gdp_guelph_ghibelline.7005.desc: "Parecería que, después de todo, [league_creator.Custom('ES_ElLa')] [league_creator.GetTitledFirstName|l] es un[league_creator.Custom('ES_XA')] [league_creator.GetWomanMan] de honor.\n\nMe llega la noticia de que ha formado la [lombard_league_conf.GetName], una iniciativa para impedir el avance [hre_kaiser.Custom('ES_DelDela')] [hre_kaiser.GetTitleAsName|l].\n\nParece una idea sensata, si uno se siente inclinado a escapar de los grilletes del imperio…"
 gdp_guelph_ghibelline.7005.a: "$gdp_guelph_ghibelline.7000.a$"
 gdp_guelph_ghibelline.7005.b: "$gdp_guelph_ghibelline.7000.b$"
 gdp_guelph_ghibelline.7005.c: "No tengamos tanta prisa…"
 gdp_guelph_ghibelline.7010.t: "$guelphs_ghibellines_prefix$ la $lombard_league_name$"
 gdp_guelph_ghibelline.7010.desc: "Mis mensajeros me informan de que [league_creator.Custom('ES_ElLa')] controvertid[league_creator.Custom('ES_OA')] [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] [league_creator.Custom('ES_DelDela')]#EMP [league_creator.GetTitledFirstName|l]#! no se siente feliz con la situación en [league_creator.GetCapitalLocation.GetTitle.GetNameNoTier] ¡y esa especie de [ROOT.Char.Custom2( 'InsultNoun', SCOPE.sC('league_creator' ))] traicioner[league_creator.Custom('ES_OA')] ha convencido a otras ovejas de poco seso para que se unan a [league_creator.GetSheHe]!\n\n¡¿Pero se puede saber qué es una #EMP Liga Lombarda#!?!"
 gdp_guelph_ghibelline.7010.a: "¡Su insolencia no quedará sin castigo!"
 gdp_guelph_ghibelline.7010.b: "Tengo otros objetivos ahora mismo."
 league_creator_created_lombard_league.tt: "[league_creator.GetShortUIName] ha creado la [league_creator.GetConfederation.GetName] #weak (ahora mismo cuenta con #V [lombard_league_conf.GetMemberCount]#! miembros)#!"
 gdp_guelph_ghibelline.7015.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 gdp_guelph_ghibelline.7015.desc: "Me temo que la Liga Lombarda se las arreglará sin vuestras #EMP gentiles#! contribuciones."
 gdp_guelph_ghibelline.7015.a: "Hum."
 gdp_guelph_ghibelline.8500.t: "$guelphs_ghibellines_prefix$ se llega a un compromiso"
 gdp_guelph_ghibelline.8500.desc: "Un murmullo surge del público cuando los dos representantes de los güelfos y los gibelinos, [guelph_leader.GetName] y [ghibelline_leader.GetName], se encuentran para firmar el tratado.\n\nAlgunos más alegres, otros claramente más inquietos con la idea de llegar a un compromiso, obligados a ceder en sus creencias de lo que es correcto de las que tanto se enorgullecen.\n\nDespués, se producen conversaciones apagadas mientras la multitud se dispersa para participar en los preparativos de la habitual cena."
 gdp_guelph_ghibelline.8500.a: "Por fin se acabó."
 gdp_guelph_ghibelline.8510.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 gdp_guelph_ghibelline.8510.desc: "Observo que no habéis visto cómo erráis. ¿Por qué deberíamos hacer unas concesiones tan inmensas cuando vosotros, los [actor.Custom('GetGuelphsGhibellines')|l], estáis tan equivocados?\n\nMe resultaría divertido de no ser tan flagrante."
 gdp_guelph_ghibelline.8510.a: "¡Qué insolencia!"
 gdp_guelph_ghibelline.8510.tt: "[recipient.GetShortUIName|U] rechazó tu propuesta de poner fin a la [situation|El] de [GetSituation('guelph_ghibelline').GetName|l]"
 gdp_guelph_ghibelline.8520.t: "$gdp_guelph_ghibelline.8500.t$"
 gdp_guelph_ghibelline.8520.desc: "El acuerdo fue toda una demostración de diplomacia, eso está claro.\n\n[guelph_leader.GetName] y [ghibelline_leader.GetName] llegaron a un acuerdo con el que ganaban pequeñas victorias pero perdían opinión popular.\n\nAlcanzar un tratado que soportará el paso del tiempo no es poca cosa; y veremos cuántos de nosotros pueden dejar el pasado atrás y mirar hacia delante, hacia un futuro brillante."
 gdp_guelph_ghibelline.8520.a: "Supongo que es lo mejor."
 gdp_guelph_ghibelline.9000.t: "$guelphs_ghibellines_prefix$ triunfo [ROOT.Char.Custom('GetGuelphGhibelline')|l]"
 gdp_guelph_ghibelline.9000.desc.guelph: "Está hecho. Hemos defendido los derechos de lo más santo: la suma autoridad que permite al papa seguir salvaguardando y eligiendo a nuestros pastores sagrados.\n\nY así se limitará la influencia del [GetTitleByKey('e_hre').GetName], cuya ambición al final nos amenaza a todos.\n\nEsas almas gibelinas #EMP descarriadas#! no saben ni lo que les ha pasado."
 gdp_guelph_ghibelline.9000.desc.ghibelline: "Al fin hemos demostrado nuestro derecho soberano a gobernar el imperio tal como [ROOT.Char.GetFaith.HighGodName] quiere: con mano firme y mente racional.\n\n¿Cómo un instrumento sagrado desplazado puede decidir quién es el mejor para gobernar las tierras del [GetTitleByKey('e_hre').GetName] después de todo?\n\nQue esos güelfos apoyapapas se ocupen de nuestras almas, que nosotros nos encargaremos de lo que importa #EMP de verdad#!."
 gdp_guelph_ghibelline.9000.a: "Creo que lo suyo es celebrarlo."
 gdp_guelph_ghibelline.9010.t: "$gdp_guelph_ghibelline.9000.t$"
 gdp_guelph_ghibelline.9010.t.defeat: "$guelphs_ghibellines_prefix$ fracaso [ROOT.Char.Custom('GetGuelphGhibelline')]"
 gdp_guelph_ghibelline.9010.desc.win: "Cada vez ganamos más apoyo popular frente a la débil oposición del bando [ROOT.Char.Custom('GuelphGhibellineGetOpposite')|l].\n\nNuestr[victorious_leader.Custom('ES_OA')] distinguid[victorious_leader.Custom('ES_OA')] líder, [victorious_leader.Custom('ES_ElLa')] [victorious_leader.GetTitledFirstName|l], así como los legisladores independientes han proclamado que los [ROOT.Char.Custom('GetGuelphsGhibellines')|l] tienen razón y, de este modo, han dado fin a esta #EMP situación#! de una vez por todas.\n\n¡Por fin reina la razón en esta parte del mundo!"
 gdp_guelph_ghibelline.9010.desc.lose: "Nuestros apoyos menguan, es un hecho.\n\nNi el poder ni la influencia de los [ROOT.Char.Custom('GetGuelphsGhibellines')|l] alcanzan hasta donde deberían y esos necios gobernantes del bando [ROOT.Char.Custom('GuelphGhibellineGetOpposite')|l] se han buscado legisladores #EMP independientes#! prepotentes que les apoyen.\n\nEs hora de que los [ROOT.Char.Custom('GetGuelphsGhibellines')|l] abandonen esta lucha y se centren en metas más alcanzables."
 gdp_guelph_ghibelline.9010.a.win: "Disfrutemos del momento."
 gdp_guelph_ghibelline.9010.a.lose: "¡Serán #EMP víboras#!!"
