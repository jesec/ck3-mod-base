l_spanish:
 merchant_house_unity: "Dirección de la compañía"
 rapacious_cs: "Voraz"
 rapacious_cs_desc: "#weak Las responsabilidades familiares se olvidaron mucho tiempo atrás, sepultadas por el resentimiento y la ambición. Las necesidades de la compañía están por encima de las necesidades de sus miembros. Los beneficios están por encima de todo.#!"
 opportunistic_cs: "Oportunista"
 opportunistic_cs_desc: "#weak Los parientes díscolos se rebelan contra las jerarquías de sangre, ya que consideran el deber como secundario frente a los intereses individuales.#!"
 balanced_cs: "Equilibrada"
 balanced_cs_desc: "#weak Aunque una familia necesita una cabeza visible, sus miembros deben ser libres para llevar a cabo sus negocios sin interferencias ni juicios.#!"
 grasping_cs: "Ávida"
 grasping_cs_desc: "#weak La reputación de la compañía y la de sus miembros están al mismo nivel. Para ser un miembro valioso de la compañía, uno debe esforzarse para mejorar su imagen, así como pulir su posición social.#!"
 ennobled_cs: "Ennoblecida"
 ennobled_cs_desc: "#weak Con una lealtad inquebrantable fruto del deber y del respeto, los intereses del grupo son los del líder. Como unidad estrechamente ligada por lazos familiares, la compañía se encuentra en una posición semejante a la de las familias más nobles.#!"
