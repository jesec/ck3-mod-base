l_spanish:
 gdp_tgf_heavier_loads_modifier: "Cargas más pesadas"
 gdp_tgf_seven_storehouses_modifier: "Siete almacenes"
 gdp_tgf_seven_storehouses_modifier_desc: "Este mercader construyó almacenes para los años de vacas flacas y los mantiene todos llenos."
 gdp_tgf_sweet_reputation_modifier: "Una reputación dulce"
 gdp_tgf_sweet_reputation_modifier_desc: "Este mercader envió en el pasado un ave de azúcar enorme al festín de un príncipe. Nadie que lo probase ha dejado de hablar de él."
 gdp_tgf_beekeeper_modifier: "Apicultor"
 gdp_tgf_beekeeper_modifier_desc: "Este mercader guarda abejas en las vigas del techo del almacén. Las abejas pagan el alquiler en miel y el mercader ha aprendido más sobre ellas de lo que podría enseñar libro alguno."
 gdp_tgf_alcohol_opportunist_modifier: "Vinicultor por accidente"
 gdp_tgf_alcohol_opportunist_modifier_desc: "Este mercader dejó en el pasado que un cargamento de fruta se descompusiera hasta hacerse vino y desde entonces siempre busca barriles baratos."
 gdp_tgf_two_grades_modifier: "Dos tipos de aceite"
 gdp_tgf_two_grades_modifier_desc: "Este mercader vende los posos turbios para lámparas y el aceite claro para la cocina, y cobra por la diferencia."
 gdp_tgf_road_millet_modifier: "Mijo para el camino"
 gdp_tgf_road_millet_modifier_desc: "Este mercader nunca viaja sin un saco de mijo. Se conserva durante años, igual que todo el que lo lleva."
 gdp_tgf_cheap_rice_modifier: "Arroz barato"
 gdp_tgf_cheap_rice_modifier_desc: "El arroz marrón es barato en los mercados de este condado y gracias a ello aquí nadie pasa hambre."
 gdp_tgf_keeps_the_fast_modifier: "Mantener el ayuno"
 gdp_tgf_keeps_the_fast_modifier_desc: "Este mercader vende carne todo el año y ayuna con los demás. Nadie sabe mejor cuánto pagarán los hambrientos."
 gdp_tgf_parchment_supplier_modifier: "Proveedor de pergamino"
 gdp_tgf_parchment_supplier_modifier_desc: "El mejor cuero de este mercader acaba en forma de páginas. En algún lugar se escriben palabras sagradas sobre este."
 gdp_tgf_temple_supplier_modifier: "Proveedor de templos"
 gdp_tgf_temple_supplier_modifier_desc: "Primero los templos compran el incienso a este mercader, y de vez en cuando, rezan por el vendedor."
 gdp_tgf_chancery_stationer_modifier: "Proveedor de la cancillería"
 gdp_tgf_chancery_stationer_modifier_desc: "Este mercader suministra papel a la cancillería y todo escribano que se entera quiere el mismo."
 gdp_tgf_tall_mast_modifier: "Mástil alto"
 gdp_tgf_tall_mast_modifier_desc: "La nave de este mercader tiene el mejor mástil de la costa y eso le hace llegar más lejos."
 gdp_tgf_our_timber_modifier: "Construido con nuestra madera"
 gdp_tgf_our_timber_modifier_desc: "Los barcos con mástiles de la madera de esta ruta llevan sus artículos más lejos que nunca antes."
 gdp_tgf_our_timber_renowned_modifier: "$gdp_tgf_our_timber_modifier$"
