l_spanish:
 schmooze_intent: "Codearse"
 schmooze_intent_desc: "Aspiras a engrasar las engranajes de los negocios y mejorar la [competitiveness|El]."
 gdp_merchant_schmooze_modifier: "Codearse con nobles"
 gdp_merchant_schmooze_modifier_desc: "Este personaje ha hecho progresos con la nobleza local de este mercado durante un banquete."
 gdp_schmooze_successful_title: "[CHARACTER.GetShortUINameNoTooltip|U] [Select_CString( CHARACTER.IsLocalPlayer, 'te has', 'se ha' )] codeado con [TARGET_CHARACTER.LocalPlayerString( 'tu personaje', TARGET_CHARACTER.GetShortUIName )]."
 gdp_schmooze_successful: "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] aprovechó la oportunidad de codearse con [Select_CString(TARGET_CHARACTER.IsLocalPlayer,'tu personaje', TARGET_CHARACTER.GetShortUIName)]"
 gdp_schmooze_successful_empty_title: "[CHARACTER.GetShortUINameNoTooltip|U] [Select_CString( CHARACTER.IsLocalPlayer, 'te has', 'se ha' )] codeado con la nobleza"
 gdp_schmooze_successful_empty: "[CHARACTER.Custom('ES_ElLa')|U] [CHARACTER.GetTitledFirstName|l] aprovechó la oportunidad para codearse con la nobleza"
 gdp_schmooze_events.1000.t: "Codeándose con [schmoozee.GetFirstNameNoTooltip]"
 gdp_schmooze_events.1000.desc: "Nosotros, los mercaderes, debemos aprovechar las oportunidades de alternar con la nobleza. Con una palabra inteligente o un buen regalo, uno puede asegurarse que no se interpongan en una empresa o apoyen la de un rival.\n\nCon cuidado, sorteando el valle entre la adulación repulsiva y la osadía excesiva, lo doy todo para ganarme a mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee'))], [schmoozee.Custom('ES_ElLa')] [schmoozee.GetTitledFirstName|l]."
 gdp_schmooze_events.1000.a: "«Por favor, buen[schmoozee.Custom('ES_XA')] [schmoozee.GetTitleAsNameNoTooltip|l], aceptad este regalo»."
 gdp_schmooze_events.1000.b: "«Un[ROOT.Char.Custom('ES_XA')] humilde mercader como yo debe fijarse en sus superiores»."
 gdp_schmooze_events.1000.b.success: "[schmoozee.GetFirstNameNoTooltip] se siente halagad[schmoozee.Custom('ES_OA')]"
 gdp_schmooze_events.1000.b.failure: "[schmoozee.GetFirstNameNoTooltip] pone los ojos en blanco"
 gdp_schmooze_events.1000.c: "«Conversar con vos ha sido un honor»."
 gdp_schmooze_events.1000.d: "«¡Comercio con muchos artículos dignos de un[schmoozee.Custom('ES_XA')] [schmoozee.GetTitleAsNameNoTooltip|l]!»."
 gdp_schmooze_events.1010.t: "Competencia amistosa"
 gdp_schmooze_events.1010.feast: "[schmoozee.GetName] y yo compartimos el pan y alardeamos de los logros de nuestras respectivas compañías mientras reflexionamos sobre nuestras copas de [ROOT.Char.Custom('RegionalDrink')] y platos de [ROOT.Char.Custom('GetExpensiveMeal')]."
 gdp_schmooze_events.1010.hunt: "[schmoozee.GetName] y yo compartimos la sombra de un ejemplar de [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')]mientras alardeamos de los éxitos de nuestras respectivas compañías."
 gdp_schmooze_events.1010.outro: "\n\nA pesar de nuestras bravatas, somos del mismo parecer en muchas cosas. Tal vez esta persona me pueda ser útil, y yo a [schmoozee.GetSheHe]."
 gdp_schmooze_events.1010.a: "«A cambio de una cantidad, podría daros algo de espacio»."
 gdp_schmooze_events.1010.b: "«Tomad esto y manteneos fuera de nuestro camino»."
 gdp_schmooze_events.1010.c: "«Vos cantáis mis alabanzas, yo cantaré las vuestras»."
 gdp_schmooze_events.1010.c.success: "[schmoozee.GetFirstNameNoTooltip] se apunta"
 gdp_schmooze_events.1010.c.failure: "A [schmoozee.GetFirstNameNoTooltip] no le interesa"
 gdp_schmooze_events.1010.d: "Este no es el momento."
 gdp_schmooze_events.1030.t: "Atención dividida"
 gdp_schmooze_events.1030.feast: "Según avanza la velada, me encuentro entre mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], [schmoozee_1.Custom('ES_ElLa')] [schmoozee_1.GetTitledFirstName|l], y mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], [schmoozee_2.Custom('ES_ElLa')] [schmoozee_2.GetTitledFirstName|l]. [Select_CString(And(schmoozee_1.IsFemale, schmoozee_2.IsFemale), 'Ambas', 'Ambos')] nobles debaten lánguidamente sobre los principios hipotéticos de los negocios y el comercio tomando algo de [schmoozer.Custom('GetRegionalFish')] a la parrilla."
 gdp_schmooze_events.1030.hunt: "Según avanza la cacería, me encuentro entre mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_1'))], [schmoozee_1.Custom('ES_ElLa')] [schmoozee_1.GetTitledFirstName|l], y mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('schmoozee_2'))], [schmoozee_2.Custom('ES_ElLa')] [schmoozee_2.GetTitledFirstName|l]. [Select_CString(And(schmoozee_1.IsFemale, schmoozee_2.IsFemale), 'Ambas', 'Ambos')] nobles debaten lánguidamente sobre los principios hipotético de los negocios y el comercio mientras los sabuesos buscan un rastro."
 gdp_schmooze_events.1030.outro: "\n\nAl final, [schmoozee_1.GetFirstNameNoTooltip] se vuelve hacia mí para solventar el asunto: «Vamos, por favor, [schmoozer.GetTitledFirstNameNoTooltip|l], vos sois mercader, tendréis alguna opinión al respecto, ¿no?»."
 gdp_schmooze_events.1030.a: "«Sabéis darle el toque justo, buen[schmoozee_1.Custom('ES_XA')] [schmoozee_1.GetTitleAsNameNoTooltip|l]»."
 gdp_schmooze_events.1030.b: "«[schmoozee_2.Custom('ES_ElLa')|U] [schmoozee_2.GetTitledFirstNameNoTooltip|l] sabe medir la situación»."
 gdp_schmooze_events.1030.c: "«En verdad, vuestras perspectivas me inspiran»."
 gdp_schmooze_events.1030.c.success: "Se sienten [Select_CString(And(schmoozee_1.IsFemale, schmoozee_2.IsFemale), 'halagadas', 'halagados')]"
 gdp_schmooze_events.1030.c.failure: "[Select_CString(And(schmoozee_1.IsFemale, schmoozee_2.IsFemale), 'Ambas', 'Ambos')] ponen los ojos en blanco"
 gdp_schmooze_events.1030.d: "«No creo que pueda comentar nada»."
 gdp_schmooze_events.1050.t: "Movimiento de mercado"
 gdp_schmooze_events.1050.feast: "Los festejos se detienen un momento para permitir a los invitados entremezclarse, y a los sirvientes recuperar terreno,"
 gdp_schmooze_events.1050.hunt: "Hacemos un descanso para investigar el terreno de [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')] del país [ROOT.Char.GetCurrentLocation.Custom('GetProvinceAdjective')] mientras los sabuesos y batidores siguen adelante,"
 gdp_schmooze_events.1050.outro: "y me encuentro seleccionando inconscientemente a jugadores clave en nuestros mercados.\n\n[schmoozee_1.Custom('ES_ElLa')|U] [schmoozee_1.GetTitledFirstName|l] es alguien útil a quien conocer en [market_1.GetLocationTitle.GetNameNoTier] y [schmoozee_2.Custom('ES_ElLa')] [schmoozee_2.GetTitledFirstName|l] lo mismo en [market_2.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.three: "también me fijo en [schmoozee_3.Custom('ES_ElLa')] [schmoozee_3.GetTitledFirstName|l], establecid[schmoozee_3.Custom('ES_OA')] en [market_3.GetLocationTitle.GetNameNoTier]."
 gdp_schmooze_events.1050.a: "«¡[schmoozee_1.GetFirstNameNoTooltip], tenía ganas de hablar con vos!»."
 gdp_schmooze_events.1050.b: "«He oído cosas muy interesantes, [schmoozee_2.GetFirstNameNoTooltip]»."
 gdp_schmooze_events.1050.c: "«Oh, [schmoozee_3.GetFirstNameNoTooltip], ¡charlemos un poco!»."
 gdp_schmooze_events.1050.d: "Los mercados van bien."
 gdp_schmooze_events.1060.t: "Compitiendo por la atención"
 gdp_schmooze_events.1060.feast: "Mientras los sirvientes dan vueltas en torno a las mesas, rellenando copas y poniendo otro plato,"
 gdp_schmooze_events.1060.hunt: "Según nos paramos a beber de nuestras botas y a estirar las piernas,"
 gdp_schmooze_events.1060.outro: "veo a mi competidor[rival.Custom('ES_XA')], [rival.GetName], alabar sin pudor alguno a [schmoozee.GetName].\n\n[schmoozee_1.Custom('ES_ElLa')|U] muy adulador[schmoozee_1.Custom('ES_XA')] habla sobre los beneficios que traen sus comerciantes, ¡al tiempo que desdeña a los míos como tunantes y presuntuosos!"
 gdp_schmooze_events.1060.a: "«Vamos, ¡las míseras operaciones de los [rival.GetHouse.GetBaseNameNoTooltip] son un chiste!»."
 gdp_schmooze_events.1060.a.success: "[rival.GetFirstNameNoTooltip] queda como un[rival.Custom('ES_XA')] idiota"
 gdp_schmooze_events.1060.a.failure: "Quedas en ridículo"
 gdp_schmooze_events.1060.b: "«¡Calma todos! Nuestro libro de cuentas es muy sólido»."
 gdp_schmooze_events.1060.b.success: "[schmoozee.GetFirstNameNoTooltip] queda convencid[schmoozee.Custom('ES_OA')]"
 gdp_schmooze_events.1060.b.failure: "Presentas unos argumentos endebles"
 gdp_schmooze_events.1060.c: "Que parloteen."
 activity_used_trade_market_luxury_items_modifier: "Demanda social"
 activity_used_trade_market_luxury_items_modifier_desc: "Los artículos de lujo de este mercado han sido desviados por un mercader para usarlos en una actividad."
 activity_used_trade_market_comforts_modifier: "Demanda social"
 activity_used_trade_market_comforts_modifier_desc: "Las comodidades de este mercado han sido desviadas por un mercader para usarlas en una actividad."
