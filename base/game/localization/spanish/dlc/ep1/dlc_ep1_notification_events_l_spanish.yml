l_spanish:
 ep1_notifications.0011.t: "Idioma de la corte cambiado"
 ep1_notifications.0011.desc: "El [Concept('court_language', 'idioma de nuestra corte')|E] ha cambiado al [target_character.GetCourtLanguage.GetName]. ¡Que nuestra corte se haga aún más grande!"
 ep1_notifications.0012.t: "Idioma de la corte abandonado"
 ep1_notifications.0012.desc: "La corte de [target_character.GetShortUIName] ha cambiado su [Concept('court_language', 'idioma')|E] de [observer.GetCourtLanguage.GetName] al [target_character.GetCourtLanguage.GetName]. ¡Que su decisión demuestre ser absurda!"
 ep1_notifications.0013.t: "Idioma de la corte adoptado"
 ep1_notifications.0013.desc: "La corte de [target_character.GetShortUIName] ha cambiado su [Concept('court_language', 'idioma')|E] al [target_character.GetCourtLanguage.GetName]. ¡Una decisión muy sabia!"
