l_spanish:
 HISTORICAL_CHARACTER_TOOLTIP: "#T Personaje histórico#!\n\n#high [Character.Custom('HistoricalCharacterDesc')]#!\n\n#weak Este personaje es histórico, pero puede desviarse de su equivalente de la vida real en función de la [culture|lE] y [faith|lE] de su lugar de origen. También puede aparecer ligeramente fuera de su fecha histórica de relevancia de 1 a 5 años.#!"
 danger_dynasty_abandon_tt: "#X @warning_icon! ¡Abandonarás tu [dynasty|lE] y no podrás seguir jugando como miembro de esta!#!"
 will_wander_tt: "[historical_character.GetFullName] se convertirá en [wanderer|lE]"
 historical_char_creation_events.t: "Ecos de la historia: [historical_character.GetFullNameNicknamedNoTooltip]"
 historical_char_creation_events.desc: "Se dice que [historical_character.Custom('HistoricalCharacterJobDesc')], más conocid[historical_character.Custom('ES_OA')] como [historical_character.GetFullNameNicknamed], recorre mi señorío en busca de empleo. Proviene de [birth_location.GetName] y tiene un cierto aire en torno a sí… [historical_character.Custom('DescriptorPositiveStandalone')], pero algo [historical_character.Custom('DescriptorNegativeStandalone')].\n\n\n@historical_character_icon! #weak Este personaje es histórico:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events_alternative.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')], más conocid[historical_character.Custom('ES_OA')] como [historical_character.GetFullNameNicknamed], se ha ganado fama en la corte. Es [historical_character.Custom('DescriptorPositiveStandalone')] y, si bien no sé decir el qué, hay algo extraordinario en [historical_character.GetSheHe]…\n\n\n@historical_character_icon! #weak Este personaje es histórico:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events.1.a: "Me pregunto qué destino le aguarda…"
 historical_char_creation_events.1.b: "¡Semejante [historical_character.GetWomanMan] podría serme útil!"
 historical_char_creation_events.1.c: "¿[historical_character.GetFullNameNoTooltip]? ¿A quién le importa?"
 historical_char_creation_events.2.t: "Reforma religiosa: éxito"
 historical_char_creation_events.2.desc: "[inspiration_owner.GetFullName] ha pasado innumerables días leyendo detenidamente libros y escrituras, y ha compuesto incontables documentos y tesis. Según leo que ha escrito, su genio es incuestionable…\n\nIncreíble. Esto podría cambiarlo #EMP todo.#!"
 historical_char_creation_events.2.a: "¡Debemos compartir estas palabras sagradas!"
 religious_reformer_modifier: "Reformador religioso"
 religious_reformer_modifier_desc: "Ayudado por una gran mente, este personaje está en posición de crear una nueva fe.\n\nEste modificador se eliminará si se crea una nueva [faith|lE]"
 mass_conversion_tt: "Concede el uso de la [decision|lE] #V $legendary_conversion$#!"
 religious_inspiration: "Inspiración religiosa"
 religious_inspiration_desc: "Un personaje que tiene una inspiración religiosa está [inspired|lE] para volcar corazón y mente en la investigación de las complejidades y misterios de la [faith|lE]. A menudo estos suelen ser grandes reformistas o líderes de movimientos religiosos. Esta inspiración es #EMP muy infrecuente#!."
 historical_character.karunakara: "Karunakara fue un general famoso del rey chola Kulottunga y aplastó a enemigos y traidores a la causa chola por igual. La vida de Karunakara está narrada en el poema Kalinkkattuparani, donde se venera cómo sometió Kalinga y posteriormente rindió homenaje a Kulottunga."
 historical_character.sekkilhar: "Al ser un niño prodigio, Sekkilhar fue reclutado a muy temprana edad por el rajá Kulothunga como estadista y ministro valorado. A Sekkilhar se le conoce sobre todo por haber escrito el Periya Puranam, las vidas de 63 nayanars shivaístas en 4 253 versos. Con el tiempo, el mismo Sekkilhar se convirtió en una deidad en cuyo honor se celebran procesiones en la región."
 historical_character.omar_khayyam: "Omar Jayam fue un polímata, poeta, matemático y astrónomo persa del siglo XI. Conocido por su obra poética, recopilada en el «Rubaiyat», realizó contribuciones significativas al álgebra y la astronomía persas. Su obra académica sobre la clasificación y solución de ecuaciones cúbicas constituye un logro monumental en las matemáticas."
 historical_character.bhaskaracharya: "Bhaskaracharya fue un matemático y astrónomo indio del siglo XII que escribió la obra fundamental «Siddhanta shiromani». Este tratado exhaustivo incluye temas como la aritmética, el álgebra, las matemáticas de los planetas y la trigonometría esférica. Su trabajo sobre el cálculo precede a Newton y Leibiniz en cinco siglos."
 historical_character.joseph_rabban: "Joseph Rabban fue una figura prestigiosa de la comunidad judía del Malabar del siglo IX. El rey Chera le concedió derechos y privilegios para la comunidad judía de Cochín, y el liderazago de Rabban ayudó a consolidar la presencia e influencia judía en el sur de la India. Sus acciones garantizaron autonomía y respeto por las contribuciones comerciales y culturales de la comunidad."
 historical_character.atisha: "Atisha, uno de los mayores nombres del budismo medieval, fue un líder religioso originario de Bengala, pero con una fuerte asociación con el monasterio Vikramashila, en Bihar. Mediante sus obras, fue el responsable de la difusión del budismo mahayana, así como del vajrayana, por todo el sudeste de Asia y el Tíbet."
 historical_character.hemachandra: "Hemachandra fue un monje jainista y un erudito y polímata indio del siglo XII. Contribuyó significativamente a las matemáticas, la gramática, la prosodia y la filosofía. Su «Siddhahem» es una obra clave en la literatura jainista y sus enseñanzas influyeron considerablemente en la educación y las prácticas jainistas."
 historical_character.kshemendra: "Kshemendra fue un poeta y erudito de la Cachemira del siglo XI, versátil en sus creaciones literarias y que generó obras satíricas, parodias y textos religiosos. Sus obras más notables incluyen «Samaya matrika» y «Darpadalana», que criticaban con humor las costumbres y convenciones de su tiempo, las cuales lo convirtieron en una figura única de la literatura sánscrita clásica."
 historical_character.akka_mahadevi: "Akka Mahadevi fue una poetisa kannada del siglo XII y una figura prestigiosa del movimiento Lingayat bhakti. Célebre por sus vachanas —composiciones poéticas—, siguió un camino de devoción espiritual y liberación, pues desafió las normas sociales al renunciar a la vida terrenal y abogar por la igualdad y por dar poder a la mujer en las prácticas espirituales."
 historical_character.namdev: "Namdev fue un santo y poeta marati del siglo XIII, famoso por sus cánticos devotos dedicados a Vithoba, y una figura importante del movimiento bhakti de Maharashtra. Popular entre el pueblo llano, sus trabajos también aumentaron considerablemente la difusión y el prestigio del idioma marati como una lengua de poesía y religión."
 historical_character.madhvacharya: "Madhvacharya fue un filósofo indio del siglo XIII y el defensor principal de la escuela Dvaita de vedanta. Enseñaba que el alma (atman) y la realidad superior (Brahman) son diferentes, en claro contraste a las filosofías no dualistas que predominaban en ese momento. Sus escritos y debates determinaron de manera notable la teología hindú."
 historical_character.vidyapati: "Vidyapati fue un poeta y erudito del siglo XIV de Bihar, en la India. Es reconocido por sus canciones de amor e himnos devotos dedicados a Shiva, que influyeron profundamente en el movimiento bhakti. Sus obras son célebres por su belleza lírica y su profunda expresión emocional."
 historical_character.abhinavagupta: "Abhinavagupta fue un filósofo y místico indio de Cachemira que vivió entre los siglos X y XI. Se le considera uno de los mayores eruditos del shivaísmo no dualista. Las obras de Abhinavagupta influyeron en la filosofía hindú, en especial sus teorías sobre estética y espiritualidad en su comentario «Abhinavabharati»."
 historical_character.basava: "Basava fue un filósofo y reformador social indio del siglo XII que fundó el lingayatismo. Sus enseñanzas cuestionaban el sistema tradicional de castas y hacían hincapié en la devoción a Shiva. Las vachanas —composiciones poéticas— de Basava abogaban por la igualdad espiritual y dieron forma al movimiento bhakti. Y sus ideas tuvieron un impacto significativo en la sociedad y religión indias medievales."
 historical_character.hildegard: "Hildegarda de Bingen fue una abadesa, mística, escritora y compositora innovadora, famosa por sus visiones religiosas y sus obras académicas. Fue autora de textos sobre teología, medicina y música que contribuyeron al pensamiento cristiano medieval. Hildegarda también es conocida por sus composiciones litúrgicas y obras de teatro, que hacían hincapié en la curación espiritual y holística."
 historical_character.bernard_of_clairvaux: "Bernardo de Claraval fue un abad, predicador y teólogo cisterciense, famoso por haber fundado la abadía de Claraval y por sus sermones y cartas que dieron forma a la cristiandad latina. Defendió la reforma cisterciense, predicó la Segunda Cruzada y escribió «Elogio de la nueva milicia templaria» en defensa de los templarios."
 historical_character.thomas_aquinas: "Tomás de Aquino fue un filósofo y teólogo dominico, famoso por unir la filosofía aristotélica con la teología cristiana en su «Summa Theologica». Defendió la compatibilidad entre razón y fe, lo que tuvo un impacto significativo en la doctrina cristiana, la ley natural y la ética. El legado de Tomás de Aquino perdura al ser canonizado como santo y nombrado doctor de la Iglesia."
 historical_character.dante_alighieri: "Dante Alighieri fue un poeta italiano renombrado por «La Divina Comedia», un viaje épico a través del Infierno, el Purgatorio y el Paraíso. Su obra tuvo un impacto permanente en la literatura occidental y la teología cristiana. La exploración de la moralidad y la naturaleza humana de Dante le ganaron el título de «Padre del idioma italiano»."
 historical_character.thomas_becket: "Tomás Becket fue un arzobispo y mártir inglés, especialmente conocido por su conflicto con el rey Enrique II por los derechos de la Iglesia. Su defensa incondicional de la autoridad eclesiástica llevó a su asesinato en la catedral de Canterbury en 1170. El martirio de Becket y su canonización como santo consolidaron su prestigio, y su santuario de Canterbury se convirtió en un lugar de peregrinación significativo."
 historical_character.maimonides: "Maimónides fue un erudito y filósofo judío del siglo XII. Se le conoce sobre todo por su «Mishné Torá», una recopilación de la ley judaica, y «Guía de los perplejos», que encara la relación entre religión y filosofía. Se le considera uno de los pensadores judíos más influyentes de la historia."
 historical_character.chretien_de_troyes: "Las historias de Chrétien, escritas en francés antiguo, desempeñaron un papel fundamental en el desarrollo de la leyenda artúrica. Su presentación del amor cortesano y el Santo Grial en obras como «Lanzarote, el caballero de la carreta» y «Perceval o el cuento del Grial» influyeron en la literatura caballeresca. Sus escritos hacen hincapié en los temas de la caballerosidad, el heroísmo y el amor cortesano."
 historical_character.egil_skallagrimrsson: "Egil Skallagrímsson, un famoso poeta guerrero islandés, es la figura central de la «Saga de Egil». Célebre por su temperamento feroz y su talento poético, se le recuerda por sus actos violentos, sus poderosos versos y su importante papel en los primeros asentamientos de Islandia y las incursiones vikingas en Inglaterra."
 historical_character.gunnlaug_ormstunga: "Gunnlaug Ormstunga, el protagonista de «Gunnlaugs saga ormstungu» fue un poeta guerrero vikingo célebre por sus viajes y rivalidades poéticas. La susodicha saga cuenta su trágica historia de amor y su pugna con un rival poético, y refleja las dinámicas del honor y la fama en la sociedad vikinga."
 historical_character.torbjorg_the_seeress: "Þorbjörg la Vidente es una figura profética que aparece en la «Saga de Erik el Rojo». Conocida por practicar la spá (profecía) y el seiðr (magia nórdica), tuvo un papel vital en la predicción de acontecimientos futuros, y su aparición ceremonial en la saga reflejó la creencia nórdica en el poder de la profecía."
 historical_character.erik_rode: "Erik Röde, también conocido como Erik el Rojo, fue un explorador vikingo y el fundador de los primeros asentamientos nórdicos en Groenlandia. Se le conoce por su espíritu aventurero y por haber dirigido un esfuerzo de colonización al fundar una comunidad que duraría varios siglos."
 historical_character.alhazen: "Hasan al-Haytham fue un matemático y físico árabe del siglo XI, célebre por su trabajo en la óptica. Su libro «Kitab al-Manazir» («El libro de la óptica») sentó los principios de la óptica moderna e influyó en la ciencia occidental durante la Edad Media. Se le recuerda por su enfoque experimental riguroso y sus contribuciones significativas a la Edad de Oro del islam."
 historical_character.ibn_battuta: "Ibn Battuta fue un explorador marroquí del siglo XIV, célebre por sus larguísimos viajes, que abarcaron más de 120 000 kilómetros por el mundo islámico y más allá. Su diario de viajes, «Rihla», ofrece unas visiones detalladas de las culturas y sociedades medievales, que le convierten en un de los viajeros más famosos de la historia."
 historical_character.william_of_ockham: "Guillermo de Ockham fue un filósofo y teólogo inglés del siglo XIV, reconocido por la «navaja de Ockham», el principio de preferir las explicaciones sencillas. Figura clave en la tradición escolástica, Ockham desafió la autoridad de la Iglesia y abogó por la separación del poder secular y el religioso. Sus ideas influyeron en el desarrollo de la lógica, la ciencia y el pensamiento político."
 historical_character.geoffrey_chaucer: "Geoffrey Chaucer fue un poeta y autor inglés del siglo XIV, conocido sobre todo por los «Cuentos de Canterbury», una colección de historias que describen una peregrinación a Canterbury. Su obra es apreciada por sus personajes llenos de vitalidad, su humor y la exploración de la sociedad medieval. La contribución de Chaucer a la literatura inglesa le merecieron el título de «Padre de la de la poesía inglesa»."
 historical_character.aaron_of_lincoln: "Aarón de Lincoln fue un financiero y prestamista inglés del siglo XII, conocido por ser uno de los judíos más ricos de la Inglaterra medieval. Proporcionó préstamos importantes a la nobleza y la Iglesia para proyectos de construcción, incluyendo catedrales. A su muerte, el rey Enrique II confiscó sus inmensos activos."
 historical_character.john_wycliffe: "John Wycliffe fue un teólogo y reformador inglés del siglo XIV, conocido por sus críticas de las prácticas de la Iglesia católica. Abogó por traducir la Biblia al inglés, sentando las bases de la Reforma protestante. Las enseñanzas de Wycliffe, que cuestionaron la autoridad de la Iglesia católica, influyeron en el movimiento lolardo y en reformadores posteriores como Martín Lutero."
 historical_character.jan_hus: "Jan Hus fue sacerdote de Bohemia y rector de la Universidad Carolina de Praga. Sus denuncias de las indulgencias papales y su exigencia de la predicación en lengua vernácula desencadenó un movimiento reformista nacional. Fue convocado al Concilio de Constanza bajo salvoconducto imperial, y condenado y quemado en la hoguera en 1415. Su muerte desató las guerras husitas que dieron lugar a varias cruzadas."
 historical_character.john_oldcastle: "Sir John Oldcastle, el barón de Cobham, fue un caballero inglés y compañero cercano del joven rey Enrique V, que abrazó abiertamente el lolardismo de Wycliffe. Fue condenado por herejía y confinado a la Torre de Londres, de la que escapó para liderar una revuelta lolarda destinada al fracaso en dicha ciudad en 1414. Tras esto, fue capturado una vez más y condenado a morir lentamente en la hoguera."
 historical_character.jerome_of_prague: "Jerónimo de Praga fue un polemista y académico bohemio que estudió en Oxford, llevó la Biblia de Wycliffe a Praga y apoyó a Jan Hus como erudito del partido reformista. Fue convocado al Concilio de Constanza para que se retractara y, aunque al principio lo aceptó, más adelante reafirmó públicamente su fidelidad a las enseñanzas de Hus, motivo por el que fue quemado en la misma hoguera que su amigo un año después."
 historical_character.gerardo_of_borgo_san_donnino: "Gerardo de Borgo San Donnino fue un joven fraile franciscano que, en torno al año 1254, reunió las escrituras proféticas de Joaquín de Fiore en el Liber Introductorius del Evangelium Aeternum, el «evangelio eterno». Proclamó que la era del Espíritu Santo había llegado y que la Iglesia institucional pronto sería sustituida por una orden contemplativa constituida por los más pobres. El papa Alejandro IV condenó el libro en 1255; Gerardo se negó a retractarse y fue condenado al encarcelamiento de por vida. Veinte años más tarde, murió en su celda."
 historical_character.durand_of_huesca: "Durán de Huesca fue un sabio predicador valdense de origen aragonés cuyas disputas con los teólogos cátaros y romanos culminó con su reconciliación con el papa Inocencio III. Tras concederle permiso para que predicara en la Iglesia, fundó los Pobres Católicos, una comunidad que practicaba la pobreza apostólica valdense a la vez que profesaba la ortodoxia católica."
 historical_character.niketas_of_constantinople: "Nicetas fue un obispo bogomilo de Constantinopla que viajó a occidente para presidir el Concilio cátaro de Saint-Félix-de-Caraman en torno al año 1167. Estableció la jerarquía dual del Languedoc y concedió el consolamentum a sus primeros obispos, además de consolidar la iglesia cátara como una tradición disidente oriental mayor."
 historical_character.guilhabert_de_castres: "Guilhabert de Castres fue un prefecto cátaro y obispo de Toulouse que pasó décadas predicando de manera itinerante para extender la fe dualista tanto en las cortes nobles como entre los campesinos. Sobrevivió a los peores años de la cruzada albigense en el castillo de montaña de Montségur, y organizó su iglesia en el exilio hasta su muerte."
 historical_character.priest_bogomil: "El sacerdote búlgaro Bogomil fue un clérigo de pueblo que vivió durante el siglo X. Sus enseñanzas sobre la pobreza apostólica y el rechazo de la Iglesia visible y sus sacramentos dieron origen a uno de los movimientos dualistas más duraderos de la Europa medieval. Desde los Balcanes, sus discípulos llevaron la doctrina por todo el Imperio bizantino y al oeste, llegando hasta el Languedoc."
 historical_character.vasili_the_bogomil: "Basilio el Médico fue un líder bogomilo en la Constantinopla de Alejo I Comneno, el principal objetivo de la campaña antiherejías del emperador descrita en la Alexiada. Convencido para que se confesara por el propio Alejo, se negó a retractarse y fue quemado en el Hipódromo. Su ejecución supuso el comienzo de una larga persecución imperial sobre las comunidades bogomilas diseminadas por los Balcanes."
 historical_character.roger_bacon: "Roger Bacon fue un filósofo inglés y monje franciscano del siglo XIII, célebre por ser de los primeros en defender el método científico. En sus estudios hizo énfasis en la observación y la experimentación, con lo que contribuyó al desarrollo de la ciencia empírica. El trabajo de Bacon en la óptica y la alquimia influyeron en eruditos posteriores durante el periodo medieval."
 historical_character.heloise_dargenteuil: "Eloísa de Argenteuil fue una abadesa y erudita francesa del siglo XII, más conocida por su correspondencia con Pedro Abelardo. Sus cartas son renombradas por su contenido apasionado e intelectual que ilustran el enorme intelecto y profundidad emocional de Eloísa. Más adelante, Eloísa se convirtió en abadesa de la abadía de Paraclete, donde demostró un liderazgo fuerte."
 historical_character.peter_abelard: "Pedro Abelardo fue un filósofo y teólogo francés del siglo XII, célebre por su enfoque escolástico y su relación controvertida con Eloísa. Su libro «Sic et non» usó el razonamiento dialéctico para explorar cuestiones teológicas. La vida y la obra de Abelardo tuvieron un impacto significativo en la filosofía medieval, mientras que su historia de amor con Eloísa sigue siendo un clásico de la narrativa medieval."
 historical_character.petrarch: "Petrarca fue un poeta y erudito italiano del siglo XIV a quien se le considera el «padre del humanismo». Se le conoce por sus sonetos y poemas, en especial, el «Canzoniere», centrado en su amor no correspondido por Laura. Las obras de Petrarca fueron fundamentales para desarrollar el humanismo renacentista, al hacer hincapié en el aprendizaje de los clásicos y en el individuo."
 historical_character.christine_pizan: "Christine de Pizan fue una escritora y poetisa francesa del siglo XIV, célebre por sus obras en defensa de los derechos y la educación de las mujeres. Escribió «La ciudad de las damas», donde desafiaba la misoginia de su tiempo y celebraba los logros de las mujeres. Los escritos de Christine fueron de los primeros en afrontar la igualdad de sexos, lo que la convirtieron en una feminista pionera en la Europa medieval."
 historical_character.giotto_di_bondone: "Giotto di Bondone fue un pintor y arquitecto italiano de los siglos XIII y XIV, célebre por su uso innovador de la perspectiva y el realismo en su arte. Su obra significó un alejamiento de la estilizada tradición bizantina y sentó las bases del Renacimiento. Los frescos de Giotto en la capilla Scrovegni de Padua se consideran obras maestras e influyeron en generaciones de artistas."
 historical_character.fibonacci: "Leonardo Fibonacci fue un matemático italiano de los siglos XII y XIII, más conocido por introducir el sistema numeral indoraábigo en Europa. Su libro «Liber abaci» popularizó el uso de los numerales y la aritmética arábiga en el mundo occidental. Fibonacci también es reconocido por la secuencia de Fibonacci, un concepto matemático que describe una pauta que se encuentra en la naturaleza y diversos campos de estudio."
 historical_character.giovanni_boccaccio: "Giovanni Boccaccio fue un escritor y poeta italiano del siglo XIV, más conocido por su obra «El decamerón», una colección de historias narradas por diez personas que escapan de la peste negra. La viva narrativa de Boccaccio y su exploración del comportamiento humano lo convirtieron en una figura clave de la literatura de principios del Renacimiento. Sus obras influyeron en escritores posteriores como Chaucer y contribuyeron a dar forma a la tradición literaria italiana."
 historical_character.snorri_sturluson: "Snorri Sturluson fue un político, poeta e historiador islandés del siglo XIII, renombrado por ser autor de la «Edda Prosaica», una obra fundacional de la mitología nórdica. Sus textos son fuentes vitales para el conocimiento moderno de la herencia nórdica. Las obras de Snorri también incluyen el «Heimskringla», una crónica de los reyes noruegos que aúna historia con folclore."
 historical_character.hrotsvitha: "Hrotsvitha fue una autora teatral, poeta y canonesa alemana del siglo X, conocida por ser la primera autora de obras de teatro de la era cristiana. Desde la abadía de Gandersheim compuso obras, poemas y leyendas que incorporaban temas cristianos con influencias clásicas, celebrando a menudo la fuerza y el intelecto de las mujeres."
 historical_character.ramanuja: "Ramanuja fue un teólogo indio del siglo XI, conocido por su papel fundador de la tradición sri visnuista. Abogaba por la devoción a Visnú, promoviendo un enfoque personal y compasivo hacia la espiritualidad. Sus interpretaciones del vedanta hacían hincapié en un no dualismo cualificado, un cambio significativo respecto a otras escuelas de pensamiento."
 historical_character.arnaldus_de_villa_nova: "Arnaldus de Vilanova fue un médico, alquimista y erudito catalán del siglo XIII, célebre por sus contribuciones a la medicina y la química. Fue uno de los primeros en proponer el método científico en la práctica de la medicina con numerosos textos médicos y escritos alquímicos. Su trabajo influyó notablemente en el pensamiento médico europeo y el campo emergente de la química."
 historical_character.ibn_khaldun: "Ibn Jaldún fue un erudito árabe del siglo XIV de Túnez, considerado uno de los padres de la sociología, la historiografía y la economía moderna. Su obra más famosa, la «Muqaddima» (Introducción), es un primer intento de despojar a los fenómenos históricos y sociales de mitos y cimentarlos en el análisis de causas y efectos, conflictos sociales y factores económicos."
 historical_character.rumi: "Rumi fue un poeta, teólogo y místico sufí persa del siglo XIII. Su profundo legado espiritual está encapsulado en su obra poética, en especial el «Masnavi», que se suele considerar como el «Corán en persa». Las enseñanzas de Rumi hacen énfasis en el amor incondicional, la tolerancia y la búsqueda de la verdad divina mediante experiencias espirituales personales."
 historical_character.avicenna: "Avicena, también conocido como Ibn Sina, fue un polímata persa a quien se le considera uno de los médicos, astrónomos, escritores y pensadores más significativos de la Edad de Oro del islam. Se le conoce sobre todo por sus obras monumentales «El libro de la curación» y «El canon de medicina», que se emplearon como textos médicos básicos del mundo islámico y de Europa durante siglos."
 historical_character.averroes: "Averroes (Ibn Rushd) fue un polímata andalusí del siglo XII reconocido por sus escritos sobre la filosofía aristotélica. Su trabajo se centró en integrar las tradiciones islámicas con la filosofía griega clásica. Sus esfuerzos por racionalizar la filosofía lo convirtieron en una figura central, tanto en la historia intelectual europea como en la islámica, y contribuyeron considerablemente al Renacimiento."
 historical_character.al_biruni: "Al-Biruni fue un erudito y polímata persa del siglo XI que hizo contribuciones significativas en distintas disciplinas científicas, incluyendo la astronomía, las matemáticas y la geografía. Escribió exhaustivamente sobre el radio de la Tierra y recopiló un estudio integral sobre las religiones y filosofías de la India tras seguir la invasión gaznávida."
 historical_character.rashi: "Rashi (Shlomo Yitzchaki) fue un rabino francés y célebre erudito judío del siglo XI, reconocido por sus comentarios exhaustivos del Talmud y la Biblia hebrea. Sus obras tuvieron un impacto profundo y duradero en los estudios y la ley judía y son parte integral de la educación judía tradicional."
 historical_character.yehuda_halevi: "Yehuda Halevi fue un poeta y filósofo judío español del siglo XII, célebre por su conmovedora poesía y diálogos filosóficos. En su «El Kuzari», Halevi defiende las verdades filosóficas del judaísmo y expresa su profundo anhelo por Sion. Sus escritos mezclan devoción religiosa con una rica tradición literaria, lo que lo convierten en una figura central de la literatura hebrea medieval."
 historical_character.shaprut: "Hasday ibn Shaprut fue un erudito, diplomático y médico judío en la España musulmana del siglo X. Sirvió como confidente del califa Abderramán III, tuvo un papel vital en la corte intelectual y diplomática de Córdoba e impulsó los intercambios culturales entre los estudiosos judíos e islámicos."
 historical_character.gersonides: "Levi ben Gershon (Gersónides) fue un matemático, astrónomo y filósofo judío francés del siglo XIV. Renombrado por su enfoque científico, fue autor de varios tratados influyentes sobre matemáticas y astronomía. También tiene fama por sus trabajos para la mejora del diseño de los instrumentos astronómicos y por su exploración filosófica del libre albedrío y la presciencia divina."
 historical_character.ezra: "Abraham ibn Ezra fue un polímata, poeta y erudito judío de España del siglo XII. Conocido por sus profundas contribuciones a los comentarios bíblicos, la astrología y las matemáticas, Ibn Ezra viajó exhaustivamente por el Mediterráneo e influyó en los círculos intelectuales con sus escritos."
 historical_character.gabriol: "Salomón ibn Gabirol fue un filósofo y poeta judío del siglo XI en la España musulmana. Conocido por sus obras neoplatónicas, en especial, «Fons Vitae» (La fuente de la vida), exploró la naturaleza de Dios y el universo, influyendo significativamente en el pensamiento judío y cristiano. Ibn Gabirol también fue un escritor prolífico de literatura en hebreo."
 historical_character.nachmanides: "Najmánides, también conocido como Moisés ben Najmán o Rambán, fue un erudito y teólogo judío del siglo XIII. Célebre por sus profundos comentarios sobre la Torá y su dirección de la comunidad judía de Gerona, Najmánides se hizo famoso por su defensa de las creencias judías en la Disputa de Barcelona de 1263. Sus escritos y enseñanzas aunaron la ley judía, el misticismo y las enseñanzas éticas."
 historical_character.crescas: "Hasdai Crescas fue un filósofo judío del siglo XIV, célebre por cuestionar la filosofía aristotélica imperante en su época. Se le conoce sobre todo por su obra «Or Adonai» (La luz del Señor), que rebatía los puntos de vista aristotélicos y sentaba los cimientos de la filosofía judía moderna, influyendo en pensadores como Spinoza."
 historical_character.saadia: "Saadia Gaon fue un erudito, teólogo y filósofo judío del siglo X. Presidió la famosa Academia Sura y es reconocido por sus obras sobre la ley judaica y su tratado filosófico «Emunoth ve-deoth» (El libro de creencias y opiniones), el primer intento sistemático de integrar la teología judía con elementos de la filosofía griega."
 historical_character.awkal: "Yusuf ibn 'Awkal fue un mercader y viajero judío en el mundo islámico del siglo X, conocido por sus detalladas narraciones de sus viajes comerciales por el Mediterráneo, Oriente Próximo y partes de África. Sus escritos ofrecen una valiosa visión de las prácticas comerciales, las interacciones culturales y la vibrante vida de las comunidades judías a lo largo de sus rutas comerciales."
 historical_character.benjamin_of_tudela: "Benjamín de Tudela fue un viajero y explorador judío del siglo XII. Se le conoce sobre todo por su diario de viaje, «Los viajes de Benjamín», donde documenta sus viajes por Europa, Asia y África. Benjamín proporcionó explicaciones detalladas de las comunidades judías a lo largo de todo el mundo medieval."
 historical_character.marco_polo: "Marco Polo fue un comerciante, explorador y escritor veneciano que viajó por Asia a lo largo de la Ruta de la Seda entre 1271 y 1295. Sus explicaciones exhaustivas de sus viajes a China bajo el reinado de Kublai Kan se publicaron en «Los viajes de Marco Polo», que proporcionaron a los europeos una visión integral de las tierras y culturas asiáticas."
 historical_character.bridget_of_sweden: "Brígida de Suecia fue una santa y mística del siglo XIV, famosa por sus profundas visiones religiosas y por fundar la Orden Brigidina. A la muerte de su marido, dedicó su vida al servicio religioso e hizo muchas peregrinaciones a lugares sagrados."
 historical_character.meister_eckhart: "Meister Eckhart fue un teólogo, filósofo y místico del siglo XIII, conocido por sus enseñanzas influyentes sobre la naturaleza de Dios y la relación del alma humana con lo divino. Sus sermones y escrituras exploran los temas del distanciamiento, el nacimiento divino en el alma y la identidad del ser."
 historical_character.jangar: "Jangar es el héroe legendario de la epopeya oirate con su nombre, «La epopeya de Jangar». Es famoso por haber construido la fantástica ciudad de Shambala y dirigir a su pueblo con sabiduría y valor. Sus batallas contra los enemigos y su empeño por devolver la paz y la prosperidad a su tierra compendian las luchas y los ideales del pueblo oirate."
 historical_character.zawisza: "Zawisza el Negro fue un caballero y comandante militar polaco del siglo XV, célebre por su valor y caballerosidad. Zawisza se distinguió en la batalla de Grünwald de 1410 y serviría más tarde en varias cortes reales. Murió heroicamente en el asedio de la fortaleza de Golubac en 1428, durante una cruzada contra el Imperio otomano."
 historical_character.theophanes_the_greek: "Teófanes el Griego fue un famoso pintor bizantino. Aportó profundidad expresiva y emocional al desarrollo de la iconografía rusa, que se alejó del estilo bizantino más formal. Sus contribuciones más notables incluyen los frescos de la iglesia de la Transfiguración en Nóvgorod y la catedral de la Anunciación en Moscú."
 historical_character.nicetas_choniates: "Nicetas Choniates fue un funcionario gubernamental bizantino e historiador de finales del siglo XII y principios del XIII. Célebre por su «Crónica», proporciona un relato detallado de la vida y la política bizantina de 1118 a 1207, que abarca el declive del Imperio bizantino y los eventos de la Cuarta Cruzada."
 historical_character.michael_psellos: "Miguel Pselo fue un filósofo, político e historiador bizantino del siglo XI. Sirvió en la corte de varios emperadores y contribuyó decisivamente al renacimiento de la filosofía y las ciencias griegas en la corte bizantina. Su obra más notable, «Chronographia», proporciona un relato agudo y detallado de la política y la vida cortesana bizantina."
 historical_character.john_tzetzes: "Ioannes Tzetzes fue un erudito bizantino del siglo XII conocido por su extensa producción literaria y su conocimiento de la literatura clásica. Escribió extensamente sobre temas gramaticales, históricos y mitológicos, siendo sus obras más famosas «Chiliades» o «Libro de historias», una recopilación de anécdotas históricas y mitológicas en verso."
 historical_character.theophylact_of_ohrid: "Teofilacto de Ohrid fue un erudito y arzobispo bizantino del siglo XI. Durante su ejercicio como arzobispo de Ohrid, desempeñó un papel vital en la vida religiosa y cultural de la región, y ejerció una influencia significativa en la teología ortodoxa oriental."
 historical_character.eustathius_of_thessalonica: "Eustaquio de Tesalónica fue un erudito y teólogo bizantino del siglo XII, arzobispo de Tesalónica. Célebre por sus textos prolíficos, Eustaquio fue autor de comentarios detallados de las obras de Homero. Su periodo como arzobispo estuvo señalado por sus intentos por reconstruir y reformar el papel de la Iglesia en la sociedad después de la invasión siciliana de Tesalónica."
 historical_character.nicephorus_blemmydes: "Nicéforo Blemides fue un erudito y teólogo bizantino del siglo XIII. Fundó una escuela y un monasterio donde dio clases y vivió la mayor parte de su vida. Blemides escribió exhaustivamente sobre filosofía, teología y ciencia y se esforzó por reconciliar las ideas filosóficas clásicas con la doctrina cristiana."
 historical_character.georgius_pachymeres: "Georgios Pachymeres fue un historiador y erudito bizantino del siglo XIII, conocido por su obra exhaustiva, «Historia byzantina», que narra la historia del Imperio bizantino de 1255 a 1308. Sus escritos proporcionan un relato detallado del reinado de la dinastía Paleólogos y el impacto de la ocupación latina."
 historical_character.manuel_moschopoulos: "Manuel Moscópulo fue un erudito y gramático bizantino de finales del siglo XIII y principios del XIV, conocido sobre todo por su trabajo de recuperación del saber y la literatura griegos clásicos. Escribió exhaustivamente sobre asuntos gramaticales y realizó comentarios sobre autores clásicos con el fin de conservar y aclarar los textos antiguos."
 historical_character.theodore_metochites: "Metochites, renacentista antes del Renacimiento, fue un polímata que destacó en la filosofía, la astronomía, las matemáticas y el arte y sirvió como ministro principal bajo el emperador Andrónico II Paleólogos. Se le conoce principalmente por su patronazgo de la iglesia de Chora en Constantinopla, para la que encargó extensos mosaicos y frescos."
 historical_character.michael_choniates: "Miguel Choniates fue un erudito, poeta y figura eclesiástica bizantina del siglo XII, reconocido por su ejercicio como arzobispo de Atenas de 1182 a 1204. En una era de declive del control bizantino, Choniates luchó por conservar las tradiciones culturales e intelectuales de Atenas."
 historical_character.joseph_tarchaneiotes: "José Tarchaneiotes fue un general bizantino activo a finales del siglo XI, principalmente conocido por su papel en las campañas militares bizantinas contra los turcos selyúcidas. Bajo el mando el emperador Alejo I Comneno, Tarchaneiotes tuvo un papel vital en diversas batallas fundamentales, incluyendo la exitosa defensa de Nicea."
 historical_character.gemistus_pletho: "Gemisto Pletón fue un filósofo del siglo XV. Un defensor incondicional del neoplatonismo, tuvo un papel fundamental en el renacimiento intelectual que presagió la caída de Constantinopla. Tuvo una aportación vital durante el concilio de Florencia, cuando abogó por la reunión de las iglesias ortodoxa y católica."
 historical_character.arethas_of_caesarea: "Aretas de Cesarea fue un erudito, arzobispo y coleccionista prolífico de manuscritos griegos antiguos. Al servir como arzobispo de Cesarea de Capadocia, Aretas hizo contribuciones significativas a la vida intelectual y cultural de Bizancio, y garantizó la supervivencia del conocimiento clásico que más tarde influiría en el Renacimiento."
 historical_character.basil_lekapenos: "Basilio Lekapenos fue un eunuco y administrador poderoso que sirvió como ministro principal durante el reinado de distintos emperadores bizantinos de finales del siglo X y principios del XI. Basilio, hijo ilegítimo del emperador Romano I, ejerció una influencia sustancial en la corte bizantina en su papel como paraikomomenos (chambelán)."
 historical_character.john_the_orphanotrophos: "Juan el Orfanotrofos fue un eunuco y funcionario de la corte influyente a principios del siglo XI durante el reinado del emperador Miguel IV. Juan, como jefe del orfanotrofos, el funcionario responsable del bienestar de huérfanos y pobres, acumuló un poder y una influencia considerables."
 historical_character.samonas: "Samonas fue un eunuco notorio y funcionario de la corte influyente a finales del siglo IX y principios del X bajo el emperador León VI el Sabio. Originario de Samosata, saltó a la fama en su puesto de parakoimomenos —chambelán del emperador—, desde el cual ostentó un poder considerable en la corte bizantina."
 historical_character.peter_the_eunuch: "Pedro el Eunuco fue un importante funcionario de la corte bizantina y consejero de confianza durante el reinado del emperador Miguel IV en el siglo XI. Desde su puesto de parakoimomenos, Pedro desempeñó un papel vital al apoyar el ascenso al trono de Miguel IV e impulsó los intereses del monasterio de Studion."
 historical_character.constantine_the_paphlagonian: "Constantino el Paflagonio fue un eunuco bizantino y funcionario de corte influyente en el siglo IX. Sirvió como parakoimomenos (chambelán) del emperador León VI el Sabio. Es célebre por sus intentos por mantener la estabilidad en la corte durante un periodo de intriga política y faccionalismo."
 historical_character.peter_the_stratopedarches: "Pedro «el Estratopedarca» fue un comandante militar y eunuco notorio del siglo X que «abundaba en fuerza corporal». Desempeñó un papel vital durante el reinado del emperador Basilio II, en especial durante la revuelta dirigida por el general Bardas Esclero."
 historical_character.basilios_bessarion: "Basilio Besarión fue un erudito, filósofo y cardenal del siglo XV. Se convirtió al catolicismo y abogó por la unión de las iglesias ortodoxa y católica durante el Concilio de Florencia, argumentando que tal movimiento reforzaría la unidad cristiana contra la amenaza otomana en ascenso."
 historical_character.demetrios_kydones: "Demetrios Kydones fue un erudito, traductor y diplomático, célebre por abogar en favor de las tradiciones latinas y católicas romanas en el ortodoxo Imperio bizantino. Tradujo al griego muchas obras de Tomás de Aquino y otros filósofos escolásticos latinos."
 historical_character.manuel_holobolos: "Manuel Holobolos fue un erudito y funcionario del siglo XIII, conocido por su talento literario y retórico. Sirvió en distintos papeles administrativos bajo muchos emperadores bizantinos y se le recuerda especialmente por sus cartas y discursos elocuentes."
 historical_character.john_axuch: "Juan Axuch fue un comandante militar bizantino del siglo XII y ministro principal bajo el emperador Juan II Comnenos. Originalmente un turco selyúcida capturado de niño y criado en la casa imperial, Axuch ascendió hasta llegar a ser el consejero de mayor confianza del emperador y su amigo."
 historical_character.mkhitar_gosh: "Mkhitar Gosh fue un erudito, clérigo y jurista armenio del siglo XII, reconocido por sus contribuciones a las leyes y la literatura armenias. También fue el autor de la primera compilación de la ley armenia, el «Datastanagirk» (Libro de la ley)."
 historical_character.shota_rustaveli: "Shota Rustaveli fue un poeta georgiano del siglo XII y uno de los mayores contribuidores a la literatura georgiana. Es conocido sobre todo por su poema épico «El caballero de la piel de tigre», que se considera una obra maestra de la literatura nacional georgiana."
 historical_character.grigor_tatevatsi: "Gregorio Tatevatsi fue un filósofo, teólogo y erudito armenio del siglo XIV, más conocido por su papel como maestro y rector de la escuela del monasterio de Tatev en la Armenia medieval."
 historical_character.sargis_pitsak: "Sargis Pitsak fue un escriba e ilustrador de manuscritos armenio del siglo XIV, reconocido por sus contribuciones al arte de la encuadernación medieval armenia."
 historical_character.medici: "Averardo de' Medici, también conocido como Bicci, fue un antepasado lejano de la ilustre familia Medici, que saltó a la fama en Florencia durante el Renacimiento. Averardo fue vital para crear la riqueza y la posición de la familia en los círculos políticos y sociales de Florencia."
 historical_character.borgia: "Alfonso de Borja fue un cardenal y diplomático español que en 1455 se convirtió en el papa Calixto III. Antes de su papado, actuó como jurista y administrador respetado y tuvo un papel clave en la reconciliación de los bandos enfrentados en el compromiso de Caspe."
 historical_character.william_wallace: "William Wallace fue un caballero y un líder escocés destacado durante las guerras de independencia escocesa contra Inglaterra a finales del siglo XIII. Célebre por sus tácticas audaces y un patriotismo feroz, Wallace se hizo famoso por derrotar al ejército inglés en la batalla del puente de Stirling en 1297 y fue nombrado guardián de Escocia."
 historical_character.la_hire: "Étienne de Vignolles, más famoso como La Hire, fue un comandante militar clave durante las últimas fases de la Guerra de los Cien Años. Célebre por su valor y destreza en combate, La Hire fue uno de los principales comandantes al servicio de Juana de Arco."
 historical_character.bar_sauma: "Rabban Bar Sauma fue un monje nestoriano convertido en diplomático de la China de la dinastía Yuan. Al principio emprendió sin éxito una peregrinación a Jerusalén y acabó pasando varios años en Bagdad. Posteriormente sirvió como embajador mongol en Europa, se reunió con monarcas europeos, el emperador de Bizancio y el papa para negociar una posible alianza francomongola."
 historical_character.hodja: "Nasreddin «el Hodja» es un héroe popular y una figura literaria icónica en las culturas turcas, que a menudo aparece como un anciano sabio e ingenioso que da consejos crípticos o sufre desgracias, y lo resuelve todo con su agudeza y humor."
 historical_character.widukind_of_corvey: "Widukind de Corvey fue un monje e historiador sajón del siglo X, célebre por su obra «Res gestae Saxonicae», una crónica donde describía las obras de los sajones, centrada en especial en el reinado del emperador Otón I."
 historical_character.roger_de_flor: "Roger de Flor fue un capitán mercenario y aventurero destacado de finales del siglo XIII y principios XIV. Al principio fue caballero templario, pero después se convirtió en el líder de los almogávares y formó la Compañía catalana. Luchó por Andrónico II y Miguel IX, quien le hizo asesinar por miedo a su influencia cada vez mayor en el Imperio bizantino."
 historical_character.regino_of_prum: "Regino of Prüm fue un monje benedictino, historiador y teórico musical notable del siglo IX. Sirvió como abad en la abadía de Prüm hasta que se le expulsó en el 899, tras lo cual se convirtió en abad de la abadía de san Martín en Tréveris. Se le conoce principalmente por su crónica, el «Chronicon»."
 historical_character.geoffrey_of_monmouth: "Geoffrey de Monmouth fue un clérigo galés del siglo XII y una de las figuras más significativas en el desarrollo de la historiografía británica y la literatura artúrica. Su obra fundamental, «Historia Regum Britanniae» (Historia de los reyes de Britania), es una crónica pseudohistórica que narra las vidas de los reyes de Gran Bretaña."
 historical_character.raiktor: "En 1081, en plena conmoción tras el ascenso de Alejo I Comneno al poder, un monje llamado Raiktor afirmó falsamente ser el depuesto emperador Miguel VII. Viendo la oportunidad, el duque normando Roberto Guiscard aprovechó la proclamación de Raiktor para justificar una invasión de los Balcanes. A pesar de haberse descubierto el engaño, Roberto siguió con la campaña e hizo desfilar a Raiktor por Dirraquio para conseguir apoyos. Al final, el duque abandonó a Raiktor cuando la estratagema fracasó, y seguramente el monje fue eliminado en silencio una vez dejó de ser útil."
 historical_character.nichiren: "El inflexible $Nichiren$, un reformista radical del budismo japonés, declaró su devoción al sutra del loto como único camino hacia la salvación. Duramente crítico con las sectas rivales y su complacencia política, aguantó el exilio y los intentos de asesinarlo por sus enseñanzas. Su legado avivó la creación de una escuela budista nacionalista que a día de hoy sigue en pie."
 historical_character.dogen: "Fundador de la escuela sōtō del budismo zen en Japón. Es célebre por sus enseñanzas sobre meditación y su principal obra, Shōbōgenzō, que dio forma a la filosofía zen japonesa."
 historical_character.kokan_shiren: "El monje Rinzai Zen, poeta e historiador del periodo Kamakura, compiló Zenrin Kokuhōki (un célebre texto histórico budista) y antologías poéticas que integran la filosofía zen con la elegancia literaria."
 historical_character.jeong_mong_ju: "Como erudito, hombre de estado y poeta de finales del periodo Goryeo, Chŏng Mong-ju fue alabado por su férrea fidelidad hacia la dinastía en sus últimos días. Fue un maestro del neoconfucianismo y la diplomacia, se opuso al alzamiento del régimen Joseon y fue asesinado por sus principios. Su último poema, en el que expresaba su firme lealtad, sigue incluyendo algunos de los versos más conocidos de Corea."
 historical_character.yi_saek: "Yi Saek fue un erudito clave del confucianismo del último periodo Goryeo, que introdujo el neoconfucianismo de Zhu Xi en Corea e instruyó a toda una generación de futuros reformistas Joseon. Aunque aprobaba la reforma educativa, se mantuvo leal a la dinastía Goryeo y rechazó ejercer el cargo con sus sucesores. Su influencia hizo de puente entre las dos dinastías y moldeó el pensamiento coreano durante siglos."
 historical_character.jinul: "$Ji_nul$ fue un monje seon visionario del periodo Goryeo, que trató de reformar el budismo coreano a través de la práctica de la meditación y el estudio de las doctrinas. Mediante la fundación de la orden Jogye en Songgwangsa, subrayó la importancia de la iluminación personal dentro de la disciplina monástica. Sus enseñanzas sentaron las bases del seon coreano tal como se practica en la actualidad, combinando el pensamiento zen con el conocimiento académico."
 historical_character.prapanca: "Poeta cortesano, historiógrafo de la Java mayapahit y autor del poema épico Nagarakretagama (1365), en el que se detalla la gloria de Mayapahit y su geografía; su obra es clave en la historia de Java y su forma de gobernar."
 historical_character.tantular: "Mpu Tantular fue un célebre poeta javanés, autor de Kakawin Sutasoma, en el que aparece la frase «Bhinneka Tunggal Ika» («Unidad en la diversidad»), que más tarde fue adoptada como lema nacional de Indonesia."
 historical_character.kanwa: "Como poeta de la corte del rey Airlangga, Mpu Kanwa compuso Kakawin Arjunawiwaha, un poema épico que une la mitología hindú con el ideario javanés."
 historical_character.sedah: "Por encargo del rey Jayabaya, Mpu Sedah comenzó a componer Kakawin Bhāratayuddha, una adaptación del Mahábharata, que más tarde completó Mpu Panuluh."
 historical_character.panuluh: "Mpu Panuluh completó Kakawin Bhāratayuddha y escribió Kakawin Hariwangsa, contribuyendo enormemente a la tradición literaria javanesa."
 historical_character.dharmaja: "Como poeta del reinado de Airlangga, Mpu Dharmaja es conocido por haber compuesto Kakawin Smaradahana, un poema que influyó en la literatura javanesa posterior."
 historical_character.monaguna: "A Mpu Monaguna se le atribuye haber compuesto Kakawin Sumanasantaka, una obra poética que refleja la fusión de la narrativa hindú con la cultura javanesa."
 historical_character.kuturan: "Mpu Kuturan es una figura religiosa célebre en la historia balinesa, a quien se le atribuye haber unificado varias sectas del hinduismo en Bali y haber establecido el sistema Desa Adat, que integra leyes religiosas y tradicionales."
 historical_character.dwijendra: "El líder espiritual Mpu Dwijendra tuvo un papel muy significativo en la expansión del hinduismo en Lombok y Bali, donde es conocido por sus enseñanzas y por los templos que erigió en las islas."
 historical_character.kavindrarimathana: "Kavindrarimathana fue un prolífico arquitecto e ingeniero durante el reinado de Rajendravarman II. Se le atribuye haber diseñado templos muy importantes, como el Pre Rup y el Mebon oriental, dos grandes exponentes arquitectónicos del imperio jemer."
 historical_character.daun_penh: "Daun Penh fue una famosa viuda del s. XIV, de quien se dice que descubrió las estatuas sagradas de Buda dentro de un árbol koki a la deriva durante una inundación en el lago Tonlé Sap. Interpretándolo como una señal divina, erigió un santuario en la cima de una montaña, el Wat Phnom, donde guardó las reliquias. Su acto de devoción dio fama a la ciudad de Phnom Penh que lleva su nombre."
 historical_character.yue_fei: "Yue Fei fue uno de los más célebres generales de China. De origen humilde, se convirtió en el baluarte de los Song del sur contra la invasora dinastía Jin de los Jurchen. Implacable en su lealtad al emperador y su ideal de unidad nacional, fue traicionado por oficiales corruptos y ejecutado injustamente. Su legado sigue siendo un símbolo de patriotismo e integridad."
 historical_character.wen_tianxiang: "Wen Tianxiang fue un aclamado general y erudito de los últimos Song del sur, que resistió como última esperanza ante la conquista mongol. Finalmente, no consiguió defender a la dinastía y fue capturado, se negó a servir a los Yuan y murió como mártir. Su poesía, que compuso durante su encarcelamiento, y en particular la «Canción de la justicia», consagró su legado como modelo de virtud y lealtad."
 historical_character.fan_zhongyan: "Un erudito del neoconfucianismo, canciller y hombre de estado de los Song del norte, conocido por su célebre máxima: «Sé el primero en preocuparte y el último en disfrutar». Implementó reformas históricas para mejorar el bienestar social y la gobernabilidad."
 historical_character.li_qingzhao: "Una de las mayores poetas chinas, famosa por su poesía ci (lírica) en la dinastía Song, donde expresaba con una gran elegancia y un estilo conmovedor su pérdida personal y el recuerdo de una época pasada."
 historical_character.qiu_chuji: "Célebre maestro taoísta (uno de los Siete Verdaderos Taoístas del Norte) y consejero de Gengis Kan. Viajó desde el norte de China hasta Asia central para aconsejar al kan sobre gobernanza y longevidad, y ayudó a establecer la primera política religiosa Yuan."
 historical_character.wang_chongyang: "Wang Chongyang, el sabio taoísta reformista de los últimos Song del Norte, fundó la escuela Quanzhen. Tras abandonar la carrera militar, se retiró a una ermita en las montañas de Zhongnan, y en sus últimos años, regresó para predicar una disciplina sincrética que fusionaba la alquimia interna taoísta con la meditación budista y la ética confuciana. Sus siete discípulos principales propagaron la orden por el norte de China y en las cortes mongolas."
 historical_character.chu_van_an: "Célebre maestro del confucianismo de la dinastía Tran, director de la academia imperial en Thăng Long. Conocido por su integridad, sus reformas educativas y la famosa petición de las «Siete decapitaciones», en las que urgía al rey a eliminar a los funcionarios corruptos."
 historical_character.nguyen_thuyen: "Oficial poeta del siglo XIII, al que se le atribuye haber sido el primero en usar el sistema de escritura Nôm (lengua vietnamita vernácula escrita) en la literatura. Es recordado por componer versos legendarios que expulsaban a los cocodrilos, un símbolo del poder del aprendizaje y el idioma vietnamita."
 historical_character.pham_ngu_lao: "Famoso general de la dinastía Tran que ayudó a expulsar varias invasiones mongolas en el siglo XIII. De origen campesino, fue ascendiendo gracias a su valor y se convirtió en un símbolo de patriotismo (además de ser homenajeado con un célebre poema que destaca su dedicación)."
 historical_character.sakata_kintoki: "Se dice que el poderoso guerrero $dynn_Satake$ $Kin_toki$, originario de las montañas de Sagami, sirvió a $dynn_Minamoto$ $Yorimitsu$ con gran ímpetu y lealtad. Entre las hazañas legendarias de «Kintarō» se incluye luchar contra osos, arrancar árboles de raíz y cargar sin miedo hacia la batalla."
 historical_character.takezaki_suenaga: "$dynn_Takezaki$ $Suenaga$ fue un valiente y leal samurái del sogunato Kamakura, que se ganó su reputación durante las invasiones mongolas de Japón. Decidido a obtener un justo reconocimiento por sus servicios, encargó unos pergaminos ilustrados para dejar constancia de sus hazañas."
 historical_character.eisai: "$Eisai$ nació en el seno de una familia monástica y se convirtió en monje, pero estaba disconforme con las escuelas pundarika (o tenda) dominantes del budismo, y viajó a China para estudiar las enseñanzas de los pensadores dhyana o chan. A su regreso, las introdujo en Japón y fundó la escuela zen Rinzai, erigió su primer templo y volvió a popularizar el té verde."
 historical_character.ippen: "$Ippen$ estudió las escrituras desde una temprana edad antes de regresar a la vida secular. Durante una peregrinación en Kumano, los kami le revelaron el camino a la iluminación, que consistía en recitar el [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] en estado de éxtasis. Tras recibir la inspiración divina, $Ippen$ regresó a los hábitos como maestro y monje devoto de la Tierra Pura, y viajó por todo Japón con un grupo de fervorosos seguidores, con los que fundó la escuela ji-shū."
 historical_character.myoe: "Huérfano desde pequeño, $MyO_e$ estudió en una gran variedad de escuelas y tuvo a $Mongaku$ y a $Eisai$ entre sus profesores, pero lo acabaron dejando de lado. Buscando la soledad lejos de los debates de los monasterios, regresó a las antaño populares enseñanzas kegon y las revitalizó infundiéndolas de pensamiento shingon y tendai. También rechazó la fascinación por el [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]."
 historical_character.honen: "Tras el asesinato de su padre cuando aún era un niño, $HO_nen$ se inició en el sacerdocio tendai y escaló entre sus filas. Insatisfecho con las grandes comodidades de las que disfrutaban los monjes en comparación con la miseria de la gente común, $HO_nen$ reconoció el [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] como doctrina inclusiva y se convirtió en uno de los principales maestros de la Tierra Pura. Sus ideas radicales provocaron la ira de otras sectas, lo que lo obligó a exiliarse en la Persecución Jogen."
 historical_character.shinran: "Huérfano desde niño, $Shinran$ se ordenó a una temprana edad, pero tuvo problemas con el sacerdocio. En una visión, recibió la orientación de seguir al monje $HO_nen$, tras lo cual se convirtió en su principal discípulo y sufrió la Persecución Jogen. En su afán por predicar las enseñanzas de la Tierra Pura del [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] a la gente, acabó fundando su propia escuela, la Jōdo Shinshū, o Verdadera Escuela de la Tierra Pura, que es ahora la que más adeptos tiene en Japón."
 historical_character.mibu_tadamine: "A pesar de sus humildes orígenes, $Tadamine$ ganó renombre por su poesía waka tras participar en una competición. El emperador solicitó sus servicios y consiguió el patronazgo de la familia Fujiwara. Junto con su hijo $Tadami$, se encuentra entre los Treinta y Seis Poetas Inmortales de Japón, y se cree que cuenta con más de ochenta y un poemas incluidos en las antologías imperiales."
 historical_character.murasaki: "La dama Murasaki, bisnieta del célebre poeta Fujiwara Kanesuke, nació en la erudita familia Yoshikado y sirvió como dama de compañía de la emperatriz del emperador Ichijo, Fujiwara Shōshi. Pronto se descubrió su talento para la poesía y se la situó entre las Treinta y seis poetisas inmortales. Hoy se la conoce por su diario, su rivalidad con la también poetisa #EMP Sei Shōnagon#! y #EMP La historia de Genji#!, tal vez la primera novela de la historia."
 historical_character.francis_of_assisi: "Francisco de Asís fue un fraile italiano del s. XIII que renunció a la riqueza de su familia —era hijo de un rico comerciante— para abrazar la pobreza absoluta y predicar para los pobres. Fundó la orden franciscana y trató de imitar la vida de Cristo de manera humilde y literal, convirtiéndose en uno de los santos más queridos del cristianismo medieval y en el primero de quien se tiene registro histórico de haber recibido las estigmatizaciones."
 historical_character.bonaventure: "Buenaventura fue un franciscano italiano del s. XIII, teólogo y filósofo, llamado «el Doctor Seráfico» por su síntesis del misticismo y la razón escolástica. Sirvió como ministro general de la Orden de los Frailes Menores y fue una figura central en el Segundo Concilio de Lyon, donde intentó reconciliar las iglesias latina y griega."
 historical_character.peter_waldo: "Pedro Valdo fue un rico comerciante de Lyon que, tras su despertar religioso, entregó toda su fortuna y comenzó a predicar la pobreza apostólica en la lengua vernácula. Sus fieles, los valdenses, finalmente fueron condenados por la Iglesia de Roma, pero sobrevivieron en los valles alpinos, siendo uno de los movimientos protoprotestantes más duraderos."
 historical_character.joachim_of_fiore: "Joaquín de Fiore fue un abad y místico calabrense del siglo XII, cuya visión tripartita de la historia —distinguía entre la Edad del Padre, la Edad del Hijo y la Edad del Espíritu Santo— influyó profundamente en el pensamiento apocalíptico medieval. Sus escrituras dieron forma a los franciscanos espirituales e inspiraron siglos de especulación milenaria por toda la Europa latina."
 historical_character.catherine_of_siena: "Catalina de Siena fue una mística dominica del siglo XIV cuyas visiones y cartas políticas tuvieron una gran influencia en la Iglesia de la Baja Edad Media. Se le atribuye haber persuadido al papa Gregorio XI para que restaurara la sede papal en Roma desde Aviñón, y posteriormente fue nombrada santa y doctora de la Iglesia."
 historical_character.suger: "Suger fue un abad franco del s. XII a cargo de Saint-Denis y consejero de los reyes Luis VI y Luis VII, y del regente de Francia durante la Segunda Cruzada. Las ambiciosas reformas de la iglesia de su abadía —elevadas bóvedas bañadas por la luz de las vidrieras— se consideran el nacimiento del estilo arquitectónico gótico."
 historical_character.matthew_paris: "Mateo de París fue un monje benedictino inglés del s. XIII, cronista en la abadía de St. Albans. Su «Chronica Majora», donde combina la mordaz crítica política con coloridos mapas e ilustraciones dibujados de su propia mano, proporcionan uno de los registros más vívidos y detallados de la época."
 historical_character.ramon_llull: "Ramón Llull fue un polímata mallorquín del siglo XIII, un misionero que desarrolló un «arte demostrativo» que pretendía convertir a todas las personas al cristianismo a partir de razonamientos lógicos. Escribió prolíficamente en catalán, latín y árabe, siendo pionero de la filosofía en lengua vernácula y de la lógica combinatoria que inspiró a Leibniz siglos más tarde."
 historical_character.walther: "Walther von der Vogelweide fue el minnesänger alemán más famoso de la Edad Media, un trovador cuyas canciones abarcaban temas desde el amor cortesano hasta la sátira política dirigida al emperador y el papa. Sirvió a varios príncipes en el Sacro Imperio Romano y fue una de las voces medievales más destacadas en la lengua alemana."
 historical_character.jacopone: "Jacopone da Todi fue un fraile franciscano y poeta italiano del siglo XIII. Sus «laudes» místicas, compuestas en la lengua vernácula umbra, se consideran unas de las primeras obras maestras de la lírica religiosa. Feroz crítico del papa Bonifacio VIII, pasó años encarcelado por ponerse de lado de los franciscanos espirituales en contra del papa."
 historical_character.cimabue: "Cimabue, seudónimo de Cenni di Pepo, fue un pintor florentino cuyos retablos y frescos rompieron con las rígidas convenciones bizantinas para abrazar un estilo más naturalista a finales del s. XIII. Se le atribuye haber descubierto al joven Giotto y haber iniciado el Trecento italiano."
 historical_character.andrea_pisano: "Andrea Pisano fue un escultor y arquitecto italiano del s. XIV, conocido por haber realizado el magistral relieve de bronce de la puerta sur del Baptisterio de Florencia. Sucedió a Giotto como maestro de la catedral florentina."
 historical_character.joan_of_arc: "De origen campesino, Juana de Arco, nacida en Lorraine, afirmaba haber tenido visiones divinas que la instaban a expulsar a los ingleses de Francia. Dirigió a las tropas del rey en la liberación de Orléans y coronó al delfín en Reims, cambiando las tornas en la Guerra de los Cien Años antes de ser capturada, condenada por herejía y quemada en Ruan a la edad de 19 años."
 historical_character.paul_vladimiri: "Paweł Włodkowic fue un teólogo, jurista y rector polaco de la Universidad Jaguelónica. En el Concilio de Constanza, fue famosa su afirmación de que los pueblos paganos tenían derecho a la pobreza y al autogobierno, y su denuncia de que las conversiones forzadas provocadas por las guerras de la Orden Teutónica eran ilegítimas incluso ante los ojos de Dios."
 historical_character.peter_the_hermit: "Pedro el Ermitaño fue un predicador asceta francés cuyos apasionados sermones convocaron a decenas de miles de campesinos para unirse a la Cruzada Popular en 1096. Sus indisciplinadas huestes fueron masacradas en Anatolia, pero él sobrevivió para formar parte en la captura de Jerusalén tres años más tarde."
 historical_character.margery_kempe: "Margery Kempe fue una mística y peregrina inglesa quien, tras una serie de desgarradoras visiones, abandonó su negocio de elaboración de cerveza y viajó a Roma, Jerusalén y Compostela. El «Libro de Margery Kempe», que dictó a una edad avanzada, se considera la primera autobiografía escrita en inglés."
 historical_character.robert_of_st_albans: "Robert de St. Albans fue un templario inglés que alrededor del año 1185 desertó de su orden y se convirtió al islam, pasando a estar al servicio de Saladino. Dirigió los asaltos de la dinastía ayubí a los estados cruzados y, según se dice, contrajo matrimonio con una mujer de la familia del sultán, lo que provocó un escándalo en las crónicas de Occidente."
 historical_character.werner_of_urslingen: "Werner de Urslingen fue un noble alemán, que se convirtió en uno de los primeros grandes condotieros italianos y fundó la formidable Gran Compañía que devastó la península italiana en la década de 1340. Tiene la fama de haber escrito en la coraza de su armadura las palabras: «Enemigo de Dios, de la misericordia y de la compasión»."
 historical_character.leif_erikson: "Leif Erikson fue un explorador nórdico a quien se le atribuye haber liderado a los primeros europeos que desembarcaron en América del Norte, en torno al año 1000. Desde la colonia de Groenlandia fundada por su padre, Erik el Rojo, navegó hacia el oeste y llamó Vinlandia a la costa llena de bosques que encontró allí, donde pasó el invierno antes de regresar a casa cargado con madera y uvas."
 historical_character.saxo_grammaticus: "Sajón Gramático fue un historiador y clérigo danés que sirvió en la casa del arzobispo Absalón de Lund en el s. XII. Su extensa «Gesta Danorum», que combina leyendas, mitos y crónicas contemporáneas, preservó la leyenda perdida de Hamlet que siglos después inspiró a Shakespeare."
 historical_character.thorkell_the_tall: "Thorkell el Alto fue un jarl jomsvikingo que lideró el gran ejército vikingo que atacó Inglaterra entre 1009 y 1012. Capturó al arzobispo Elfego de Canterbury, pero no pudo impedir que finalmente muriera a mano de sus propios guerreros. Tras ello, entró al servicio del rey Etelredo, y luego de Canuto el Grande, convirtiéndose en uno de los jarls más poderosos del imperio del mar del Norte."
 historical_character.botond: "Botond fue un legendario guerrero magiar de mediados del s. X. En la crónicas húngaras se dice que destrozó la puerta de hierro de Constantinopla de un solo golpe con su hacha y que derrotó a un campeón bizantino en combate singular. Sea real o no su existencia, su nombre se ha convertido en sinónimo del poderío magiar."
 historical_character.anonymus_belae_regis: "Conocido como «Magister P.» o Anonymus, el notario anónimo del rey Béla III compuso la «Gesta Hungarorum» a finales del siglo XIII. Su crónica en latín de la conquista magiar, donde combina genealogías con leyendas inventadas, sentó la base narrativa de los orígenes de Hungría."
 historical_character.friar_julianus: "El monje Julianus fue un dominico húngaro que llevó a cabo dos viajes extraordinarios a Oriente en el s. XIII, en búsqueda del hogar de los magiares. Fundó una comunidad hablante de húngaro en Baskiria, pero su segundo viaje se vio interrumpido por las noticias del avance mongol, una amenaza que pronto se haría con el control de toda Hungría."
 historical_character.simon_of_keza: "Simón de Kéza fue un clérigo húngaro en la corte del rey Ladislao IV que compuso la «Gesta Hunnorum et Hungarorum» en torno al año 1283. Sus crónicas elaboraron el mito del linaje magiar-huno, sentando a Atila como rey ancestral de los húngaros, una idea que daría forma a la identidad nacional durante siglos."
 historical_character.miklos_toldi: "Nicolás Toldi fue un legendario noble húngaro durante el reinado de Luis el Grande. Las canciones y las crónicas lo inmortalizaron como un héroe de origen humilde y fuerza prodigiosa que se ganó el favor de la corte gracias a sus hazañas bélicas. En el siglo XIX, el poeta János Arany elevó su historia a épica nacional en la cultura húngara."
 historical_character.gallus_anonymus: "Gallus Anonymus fue un monje benedictino anónimo —probablemente fuera franco o veneciano— que compuso las primeras crónicas narrativas de Polonia a principios del siglo XII en la corte de Boleslao III el Bocatorcida. Su «Gesta principum Polonorum» es el texto fundacional de la historiografía polaca."
 historical_character.benedict_the_pole: "Benedicto de Polonia fue un monje franciscano del siglo XIII que acompañó a Giovanni da Pian del Carpine en la peligrosa embajada papal que hizo a la corte del gran kan Guyuk en Karakórum. Su breve pero detallado informe en latín sobre el mundo mongol es uno de los documentos europeos más fiables sobre las estepas orientales."
 historical_character.nestor_chronicler: "A Néstor, el monje del monasterio de las Cuevas de Kiev, se le atribuye haber compilado las «Primeras Crónicas», un registro fundacional de los primeros rus. Sus escritos ayudaron a dar forma a la concepción rusa de su historia, su fe y de la dinastía Ruríkida, que gobernó durante siglos."
 historical_character.andrei_rublev: "Andréi Rubliov fue un monje ortodoxo ruso, el pintor más célebre del Moscú medieval. Su luminosa «Trinidad», que pintó para el monasterio Laura de la Trinidad y San Sergio, es considerada una de las mayores obras maestras del arte religioso ruso."
 historical_character.muireadhach_albanach: "Muireadhach Albanach Ó Dálaigh fue un poeta irlandés de principios del siglo XIII al servicio de la prestigiosa familia Ó Dálaigh. Tras matar a un mayordomo de su patrón, huyó a Escocia —donde se ganó el apodo de «Albanach» o «el Escocés»— y marchó a las cruzadas antes de regresar y componer para los lores gaélicos a ambos lados del mar de Irlanda."
 historical_character.dafydd_ap_gwilym: "Dafydd ap Gwilym fue uno de los principales poetas galeses medievales, maestro de la forma métrica del «cywydd» en el siglo XIV. Sus versos alternan temas cómicos, devotos y eróticos, combinando la tradición clásica galesa con las costumbres cortesanas de la Europa continental."
 historical_character.stephen_hagiochristophorites: "Esteban Hagiocristoforites fue un célebre miembro de la corte y principal ejecutor al servicio del emperador Andrónico I Comneno. Se hizo conocido por sus brutales extorsiones y asesinatos políticos, y por su intento de arrestar a Isaac Ángelo en 1185, que no tuvo el resultado esperado y acabó en catástrofe, provocando la revuelta que depuso a Andrónico y acabó con su gobierno."
 historical_character.george_akropolites: "Jorge Acropolita fue un estadista, erudito e historiador bizantino del siglo XIII en las cortes del Imperio de Nicea y el restaurado Imperio Paleólogo. La crónica que elaboró de los años que siguieron a la toma de Constantinopla y su recuperación son la principal fuente de conocimiento de aquella era de grandes cambios."
 historical_character.al_farabi: "Abū Naṣr al-Fārābī fue un filósofo de la Edad de Oro del islam del siglo X, llamado el «segundo maestro» en honor a sus exhaustivos comentarios sobre el pensamiento de Aristóteles. Vivió en Bagdad, Alepo y Damasco, donde escribió sobre lógica, metafísica, teoría musical y el orden político ideal."
 historical_character.al_mutanabbi: "Al-Mutanabbi fue un poeta árabe del siglo X, a menudo considerado el mayor autor en esa lengua. Nació en Kufa de origen humilde, y con sus despiadados panegíricos y mordaces sátiras obtuvo el patrocinio del príncipe hamdánida Sayf al-Dawla. Sin embargo, su arrogancia también le hizo ganarse muchos enemigos y finalmente murió acuchillado en un camino desértico."
 historical_character.munis_al_muzaffar: "Mu'nis al-Muzáffar fue un esclavo eunuco de origen griego que llegó a convertirse en el general más poderoso y en el regente de facto del último califato abasida. Durante tres décadas mantuvo al imperio unido y resistió a las rebeliones y las invasiones extranjeras, pero finalmente fue depuesto y ejecutado por el propio califa al que había ayudado a sentarse en el trono."
 historical_character.ibn_zaydun: "Ibn Zaydún fue un poeta y estadista del siglo XI en al-Ándalus, nacido en el seno de una familia noble de Córdoba. Su tormentoso romance con una princesa omeya, la poetisa Wallada bint al-Mustakfi, inspiró algunos de los poemas amorosos más famosos escritos en lengua árabe."
 historical_character.al_razi: "Abū Bakr al-Rāzī, conocido en la Europa medieval como Rhazes, fue un polímata persa que vivió entre los siglos IX y X y uno de los principales físicos de esta época. Sus observaciones clínicas permitieron distinguir la viruela del sarampión por primera vez, y su vasta enciclopedia médica, el «Kitāb al-Ḥāwī», fue uno de los principales libros de consulta en la Europa latina durante siglos."
 historical_character.ibn_tufail: "Ibn Tufail fue un polímata andalusí del siglo XII —físico, filósofo y visir de los califas almohades—, conocido por su novela filosófica «Hayy ibn Yaqẓān». La historia de un niño salvaje que alcanza la iluminación espiritual en una isla desértica influyó en pensadores europeos tales como Spinoza y en escritores como Defoe con su «Robinson Crusoe»."
 historical_character.ibn_hazm: "Ibn Hazm, o Abén Házam, fue un pensador andalusí del s. XI y jurista de la escuela literaria zahirí, autor de «El collar de la paloma», el tratado sobre el amor más famoso escrito en lengua árabe clásica. Desolado por la caída del califato omeya de Córdoba para el que servía, dedicó los últimos años de su vida a escribir polémicos e incisivos textos sobre temas religiosos."
 historical_character.attar: "Farīd al-Dīn Attār fue un poeta sufí persa y boticario de Nishapur. Su obra «La conferencia de los pájaros» es una alegoría del viaje del alma hacia lo divino. Sus versos fueron una de las principales fuentes del posterior misticismo persa, que influyó profundamente en Rumi y en la tradición sufí."
 historical_character.saadi_shirazi: "Saadi de Shiraz fue un poeta persa del siglo XIII, que durante décadas peregrinó entre Anatolia y la India a causa de la invasión mongola. Sus obras más conocidas, el «Bustán» y el «Gulistán», combinan ingenio, calidez y sabiduría mundana, y lo convirtieron en el poeta de lengua persa más leído del mundo durante siglos."
 historical_character.hafez: "Hafez de Shiraz fue un poeta lírico persa del siglo XIV cuyos gazales, que alternan momentos de gran euforia con la ironía y la devoción calmada, son considerados el culmen de la poesía persa. A día de hoy, su «Diván» sigue siendo un libro de consulta en las casas iraníes."
 historical_character.nizami_ganjavi: "Nezamí Ganyaví fue un poeta persa del s. XII oriundo de Ganyá. Sus cinco grandes romances —el «Khamsa»— son considerados los pilares de la literatura persa clásica. Las aventuras de Layla y Majnún, y las de Cosroes y Shirin, sentaron las bases a partir de las cuales la poesía narrativa se estandarizó en el mundo persa."
 historical_character.chishti: "Mu'in al-Din Chishti fue un místico sufí nacido en Persia que, en torno al año 1192, se asentó en Ajmer, Rajastán, y fundó la orden Chishti en la India. Conocido por su ética de la compasión universal, su santuario es uno de los lugares de peregrinación más queridos del subcontinente y atrae a devotos de todas las fes."
 historical_character.auliya: "Nizamuddin Auliya fue un maestro sufí de la orden Chishti en Delhi en los siglos XIII y XIV, querido en todo el sultanato por dar la bienvenida a personas de todas las fes y condiciones sociales. Sus enseñanzas, centradas en la devoción y el servicio altruista, moldearon la vida espiritual en la India durante siglos e inspiraron los versos de su discípulo, Jursan Amir."
 historical_character.amir_khusrau: "Jursan Amir fue un poeta en lengua persa, cortesano y músico, que prestó servicio a siete sultanes de Delhi. Como discípulo de Nizamuddin Auliya, se le atribuye haber ayudado a dar forma a la lengua vernácula hindavi y haber sentado las bases de la tradición musical hindustaní."
 historical_character.ferdowsi: "Ferdousí fue un poeta persa que vivió entre los siglos X y XI, y cuya monumental obra, el «Shahnamé», unos cincuenta mil pareados compuestos a lo largo de tres décadas, conserva el pasado mítico y heroico de Irán en la lengua de sus antepasados. Aunque no se le reconoció demasiado el mérito en vida, ahora es considerado el salvador de la lengua persa."
 historical_character.ibn_fadlan: "Ibn Faḍlān fue un embajador abasida enviado por el califa al-Muqtadir en el siglo X a la corte búlgara del Volga. Su vívido relato del viaje —que incluía una descripción presencial del funeral de un cacique rus en el Volga— sigue siendo una de las fuentes más valiosas sobre la estepa y el este nórdico de principios de la Edad Media."
 historical_character.nizam_al_mulk: "Nizam al-Mulk fue un imponente visir persa que, durante casi treinta años, gobernó de facto el imperio selyúcida bajo el mando de los sultanes Alp Arslan y Malik Shah. Su «Siyāsatnāma» definió la teoría persa medieval del linaje, y la red de madrasas que fundó —la Niẓāmiyya— dio forma al aprendizaje suní durante siglos."
 historical_character.yusuf_khass_hajib: "Yūsuf Khāṣṣ Ḥājib fue un erudito karajánida de Balasagun que en el siglo XI compuso «Kutadgu Bilig», la gran obra escrita en la lengua túrquica más antigua que se ha conservado. Sus versos alegóricos sobre la forma de gobernar, la justicia y la buena vida le hicieron ganarse el título cortesano de «Khāṣṣ Ḥājib», o asesor del monarca."
 historical_character.kashgari: "Mahmud al-Kashgari fue un lexicógrafo karajánida del siglo XI que viajó por todo el mundo de lengua túrquica compilando su «Dīwān Lughāt al-Turk», un extenso diccionario y una etnografía árabe-túrquicos. Su cuidada colección de dialectos, canciones, proverbios y el mapa más antiguo que se conoce del mundo túrquico son un recurso de incalculable valor sobre la estepa medieval."
 historical_character.yunus_emre: "Yunus Emre fue un poeta y místico sufí que vivió entre los siglos XIII y XIV en Anatolia. Escribió versos sencillos y devotos en lengua vernácula turca que ayudaron a convertirla en un vehículo para la alta literatura. Con su mensaje tolerante y humano, es una de las figuras más queridas en la tradición religiosa turca."
 historical_character.ahmad_yasawi: "Aḥmad Yasawī fue un poeta místico sufí de Sayram que fundó la orden yasavita en el s. XII, la primera gran tariqa sufí que se extendió entre los pueblos túrquicos de Asia Central. Sus versos devotos en túrquico, el «Diwan-i Hikmet», llevaron el islam al corazón de las estepas y moldearon la espiritualidad de la región durante siglos."
 historical_character.haji_bektash: "Hajji Bektash Veli fue un místico sufí que viajó desde Jorasán a Anatolia a causa de las invasiones mongolas en el siglo XIII. Sus enseñanzas sobre devoción interior y tolerancia propiciaron el surgimiento de la orden bektashí, que más tarde se convirtió en el corazón espiritual del cuerpo de jenízaros y en los cimientos de la tradición alevita anatolia."
 historical_character.yelu_chucai: "Yelü Chucai fue un estadista y erudito kitán que ejerció como consejero de Gengis Kan y Ögedei Kan. Como devoto practicante del confucianismo y del budismo, sus persistentes consejos ayudaron a que buena parte del norte de China se salvara de ser arrasado para convertirse en pastizales. Para ello, persuadió a los kanes mongoles de que un imperio asentado y basado en impuestos era más rentable que una tierra calcinada."
 historical_character.su_shi: "Su Shi, conocido por el nombre artístico de Dongpo, fue un polímata de la dinastía Song del Norte que destacó como poeta, pintor, calígrafo, estadista y gourmet. Sus versos, sus ensayos en prosa y la autocrítica que escribió en forma de cartas desde el exilio en las pantanosas tierras del sur del Yangtsé lo convirtieron en una de las figuras literarias más populares de la historia china."
 historical_character.zhu_xi: "Zhu Xi fue un filósofo de la dinastía Song cuya síntesis de las ideas confucianas, budistas y taoístas reformuló el pensamiento de Asia Oriental en el siglo XII. Sus comentarios sobre los «Cuatro Libros» sentaron la base del sistema de examinación imperial en China, Corea y Vietnam en los siete siglos siguientes."
 historical_character.jayadeva: "Jayadeva fue un poeta de la región de Bengala en el siglo XII. Su obra lírica escrita en sánscrito, el «Gītagovinda», reformula el amor entre Krishna y Radha como una sublime alegoría religiosa. Sus versos fueron un elemento central del movimiento devoto bhakti y todavía se recitan en los templos desde Odisha hasta Kerala."
