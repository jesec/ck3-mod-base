 ## GLOSS
 carnival_GLOSS: "Carnaval proviene de la frase latina «carnis levare» —que significa «retirar la carne»—, una indicación del último festín antes de la abstinencia de la cuaresma."
 carnival_patria_GLOSS: "#EMP Patria#!: una palabra del latín para lugar o país. En la Edad Media, #EMP patria#! expresaba el sentimiento de orgullo y de pertenencia a una provincia, una ciudad o una república."
 murder_bow_name: "[murder_bow.GetName]"
 normal_bow_name: "arco de caza"
