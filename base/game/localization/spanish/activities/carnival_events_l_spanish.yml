 ## Event - Dead End
 carnival.1111.t: "Final del camino"
 carnival.1111.desc: "Mientras forcejeo con uno de los asesinos, siento un dolor en el cuello cuando su compañero me apuñala por detrás. La tierra corre a recibirme al caer. Mis miembros pierden fuerza y mi aliento irregular me deja burbujas sangrientas en los labios."
 carnival.1111.a: "No tenía que acabar así."
