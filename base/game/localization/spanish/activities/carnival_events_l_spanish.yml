 ## Event - the duel
 carnival.1010.t: "El duelo"
 carnival.1010.desc: "Dos desconocidos enmascarados se miden mientras la multitud hace sitio para que los combatientes tracen círculos… ¡con las espadas desenvainadas! El odio en sus miradas indica que piensan en algo más que verter un poco de sangre."
 carnival.1010.a.desc: "\n\nMe mantengo como una máscara más entre la muchedumbre."
 carnival.1010.b.desc: "Al fijarse en mí, la muchedumbre espera a ver si intervengo."
 carnival.1010.a: "Llamar a los guardias para que interrumpan el duelo."
 carnival.1010.b: "Convencerlos para que se detengan."
 carnival.1010.c: "Ordenar que se detengan."
 carnival.1010.d: "Que el duelo prosiga."
 cooltip.carnival.1010_duel_diplomacy_success: "Detienes el duelo"
 cooltip.carnival.1010_duel_diplomacy_fail: "No consigues detener el duelo"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName] pierde el duelo y podría sufrir heridas o morir."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName] pierde el duelo y podría sufrir heridas o morir."
 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName] gana el duelo"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName] gana el duelo"
 carnival.1010_duel_guards_success.desc: "Los guardias llegan corriendo"
 carnival.1010_duel_guards_fail.desc: "Los guardias llegan demasiado tarde"
 carnival.1010_duel_guards_success_toast: "Los guardias interrumpen el duelo"
 carnival.1010_duel_guards_failure_toast: "Los guardias llegan demasiado tarde para detener el duelo"
 carnival.1010_duel_diplomacy_success_toast: "Detienes el duelo"
 carnival.1010_duel_diplomacy_fail_toast: "No logras detener el duelo"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName] resultó herid[duelist_01.Custom('ES_OA')] en el duelo"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName] murió en el duelo"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName] resultó herid[duelist_02.Custom('ES_OA')] en el duelo"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName] murió en el duelo"
 carnival.1010.duel_stop.log_title: "Duelo detenido"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip] detuvo un duelo entre [duelist_01.GetFirstNameNoTooltip] y[duelist_02.GetFirstNameNoTooltip]"
 carnival.1010.duel_continue.log_title: "Fracaso al detener un duelo"
 carnival.1010.duel_continue.log: "[carnival_main.GetShortUIName|U] [Select_CString(carnival_main.IsLocalPlayer, 'intentaste', 'intentó')] sin éxito detener un duelo entre [duelist_01.GetShortUIName] y [duelist_02.GetShortUIName]"
 ## Event - Gracious Host
 carnival.1011.t: "Anfitrión gentil"
 carnival.1011.desc: "Un carnaval es una oportunidad excelente para exhibir mi riqueza y gusto al abrir las puertas de mi palacio al pueblo. Al hablar de esto con [house_member01.GetFirstNameNoTooltip], me pregunto a quién debería invitar. [house_member01.GetFirstNameNoTooltip] ha hecho buenas sugerencias, pero la decisión final es mía. "
 carnival.1011.a: "Decorad el palacio entero, ¡no reparéis en gastos!"
 carnival.1011.b: "¡Abrid las puertas a los pobres!"
 carnival.1011.c: "¡Invitad solo a los personajes más eminentes!"
 carnival.1011.d: "Que sea solo para los parientes lejanos."
 ## Event - Puppet theater
 carnival.1012.t: "Teatro de marionetas"
 carnival.1012.desc: "Al pueblo llano le encanta el teatro de marionetas, se queda embobado con sus obras disparatadas y lascivas. Marionetas grotescas se entregan a parodiar todos los aspectos de la vida: fornicar, pelear, reñir y meterse en toda clase de situaciones improbables.\n\nEl carnaval de [carnival_location.GetName] ha atraído a un grupo de estos marionetistas y, si bien el pueblo los adora, a los [carnival_host.GetFaith.PriestNeuterPlural] les preocupa la naturaleza vulgar del espectáculo."
 carnival.1012.a: "Acudiré a los espectáculos en secreto."
 carnival.1012.b: "¡Sobornaré a un grupo para que represente mi propia obra!"
 carnival.1012.c: "¡Acudiré a los espectáculos abiertamente!"
 carnival.1012.d: "Reprobaré a los artistas discretamente entre bastidores."
 carnival.1012.e: "Prohibiré semejantes obras vulgares."
 ## Event - The Mask Maker
 carnival.1013.t: "El arte de hacer máscaras"
 carnival.1013.desc: "Al pasar por un patio prácticamente vacío, me topo por casualidad con [Select_CString(mask_maker.IsFemale, 'una anciana', 'un anciano' )] que talla una máscara. A su lado hay un puesto lleno con sus obras: una fila tras otra de toda clase de máscaras.\n\nLa manufactura es ciertamente exquisita."
 carnival.1013.a: "¡Las compraré todas y las repartiré a todos los que me encuentre!"
 carnival.1013.b: "Darle [Select_CString(mask_maker.IsFemale, 'a la artesana', 'al artesano' )] de máscaras los fondos para que abra un taller."
 carnival.1013.c: "Comprar una máscara excelente para mí."
 carnival.1013.d: "Comprar una máscara aterradora para mí."
 carnival.1013.maskmaker_workshop.log_title: "Inversión en un taller de máscaras"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName] [Select_CString(carnival_main.IsLocalPlayer, 'ayudaste', 'ayudó')] a un artesano de máscaras a abrir un taller"
 ## Event - Holy Fools
 carnival.1014.t: "Santos necios"
 carnival.1014.desc: "Una parodia de una procesión sagrada baja por la calle. Disfraces que caricaturan a sacerdotes, monjes ¡e incluso a los líderes sagrados de nuestra fe! Se burlan claramente del clero."
 carnival.1014_2.a.desc: "\n\nMe oculto entre la multitud."
 carnival.1014_2.b.desc: "\n\nLa gente se fija en mí esperando una reacción."
 carnival.1014.a: "Llamar discretamente a los guardias para que dispersen esta pantomima."
 carnival.1014.b: "¡Los condeno por sus pecados!"
 carnival.1014.c: "Unirse a la burla."
 carnival.1014.d: "Escabullirse entre la multitud."
 carnival.1014.e: "¡Hace años que no me reía tanto!"
 cooltip.carnival.1014.non_believer: "#weak #EMP Pérdida de [stress|El] por tu [secret|El] de no creyente#!#!"
 carnival.1014.secret.tt.toast: "Te das cuenta en el fondo de que jamás has creído"
 carnival.1014.mockery.tt.toast: "Te sientes culpable y aliviad[ROOT.Char.Custom('ES_OA')] a la vez"
 ## Event - The Cat
 carnival.1015.t: "El gato"
 carnival.1015.desc: "Una pequeña sombra lleva siguiéndome toda la tarde. Cada vez que tuerzo una esquina, me aguardan dos ojos brillantes y un #EMP «miau»#! rasposo.\n\n«Parece que habéis hecho un amigo», [family_member01.Custom('ES_ElLa')] [observer_01.GetTitledFirstName|l] me señala y ríe mientras el gato vuelve a rozarse contra mi pierna."
 carnival.1015.a: "¡Parece que era cosa del destino!"
 carnival.1015.b: "Seguro que prefiere quedarse contigo."
 carnival.1015.c: "[family_member01.Custom('ES_AlAla')|U] [family_member01.GetTitledFirstName|l] le vendría bien su compañía."
 carnival.1015.adopt_cat.log_title: "Adopción de un gato"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName] [Select_CString(carnival_main.IsLocalPlayer, 'adoptaste', 'adoptó')] un gato"
 ## Event - Lover's mask
 carnival.1016.t: "La máscara de un amante"
 carnival.1016.desc: "Cuando deambulo por las calles de [carnival_location.GetName], entre tanta celebración oigo la música resonar por los callejones según los grupos se desparraman por las vías al salir de las tabernas. Por doquier se codean plebeyos y patricios; rango y privilegio se ven reemplazados por una máscara.\n\nSiento un toque en el hombro y detrás de mí hay un[woo_character.Custom('ES_XA')] [woo_character.GetWomanMan] con una máscara. Hace una pose dramática para luego reírse. Cuando [woo_character.Custom('ES_ElLa')] desconocid[woo_character.Custom('ES_OA')] se aparta la máscara, reconozco a [woo_character.GetNameNoTooltip].\n\n #EMP «Saludos, mi [ROOT.Char.GetLadyLord]. ¿Os apetecería pasar la velada conmigo? Dos [Select_CString(And(ROOT.Char.IsFemale, woo_character.IsFemale), 'desconocidas enmascaradas', 'desconocidos enmascarados')] que disfrutan sin más del carnaval»#!, dice con una inclinación cortesana exagerada."
 carnival.1016.a: "¡Qué sorpresa más deliciosa! Guiadme, #EMP «desconocid[woo_character.Custom('ES_OA')]»#!."
 carnival.1016.b: "Me encantaría la compañía de un[woo_character.Custom('ES_XA')] #BOLD amig[woo_character.Custom('ES_OA')]#!."
 carnival.1016.c: "Y [Select_CString(And(ROOT.Char.IsFemale, woo_character.IsFemale), 'desconocidas', 'desconocidos')] debemos seguir siendo."
 ## Event - In candle light
 carnival.1017.t: "A la luz de las velas"
 carnival.1017.desc: "Me encuentro con [intent_target.GetNameNoTooltip] en una taberna tranquila. Afuera, el carnaval se hace sentir, pero el interior es acogedor y está iluminado por velas. [intent_target.GetNameNoTooltip] está leyendo cuando entro, con el ceño fruncido por la concentración.\n\nEstoy segur[ROOT.Char.Custom('ES_OA')] de que una conversación ingeniosa atraerá su atención a mis encantos."
 carnival.1017.a: "Impresionar[intent_target.GetHerHim] con mis conocimiento de literatura."
 carnival.1017.b: "Hacerle olvidar el libro con unas bromas ingeniosas."
 carnival.1017.c: "Le preguntaré si puedo leer el libro después de [intent_target.GetSheHe]."
 carnival.1017.a.tt.failure.desc: "Ah, un buen libro para una persona sencilla"
 carnival.1017.a.tt.success.desc: "Eso me recuerda a otro libro"
 carnival.1017.b.tt.success.desc: "Alejar su atención del libro"
 carnival.1017.a.tt.success.toast: "Tus extensos conocimientos llaman la atención [intent_target.Custom('ES_DelDela')] [intent_target.GetTitledFirstName|l]"
 carnival.1017.a.tt.failure.toast: "[intent_target.Custom('ES_AlAla')|U] [intent_target.GetTitledFirstName|l] le pareces aburrid[ROOT.Char.Custom('ES_OA')] y pedante"
 carnival.1017.b.tt.success.toast: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] se olvida del libro"
 carnival.1017.b.tt.failure: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] sigue con la nariz metida en su libro"
 carnival.1017.b.tt.failure.toast: "[intent_target.Custom('ES_AlAla')|U] [intent_target.GetTitledFirstName|l] tu ingenio le resulta menos atractivo que su libro"
 carnival.1017.c.tt.toast: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] y tú congeniáis al hablar de un libro interesante"
 ## Event - Flowers & song
 carnival.1018.t: "Amor y juegos"
 carnival.1018.desc: "Una muchedumbre se ha reunido en la plaza para ver una competición de fuerza y habilidad. Se juega a la soga, la lucha y las carreras a pie mientras el público anima. La atmósfera es jovial y amistosa.\n\n[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] parece impresionad[intent_target.Custom('ES_OA')] por la maña mostrada y no hace más que desviar la mirada hacia [contender.Custom('ES_ElLa')] [contender.GetTitledFirstName|l]. Si quiero ganarme su favor, tendré que superar de algún modo a [contender.GetFirstNameNoTootip]."
 carnival.1018.a: "¡[contender.GetHerHim|U] aplastaré en el recinto de lucha!"
 carnival.1018.b: "Igual puedo convencer[contender.GetHerHim] para que caiga, ¿no?"
 carnival.1018.c: "Ridiculizar[contender.GetHerHim] delante [intent_target.Custom('ES_DelDela')] [intent_target.GetTitledFirstNameNoTooltip|l]"
 carnival.1018.d: "No me apetece participar en esta competición."
 carnival.1018.a.success.desc: "Superas [contender.Custom('ES_AlAla')] [contender.GetTitledFirstNameNoTooltip|l]"
 carnival.1018.a.success.toast: "[intent_target.Custom('ES_AlAla')|U] [intent_target.GetTitledFirstName|l] le impresiona tu destreza"
 carnival.1018.a.failure: "Te derriban fácilmente"
 carnival.1018.a.failure.toast: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] se olvida de que existes"
 carnival.1018.b.success: "Consigues hacer que parezca de verdad"
 carnival.1018.b.success.toast: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] te saluda como [Select_CString(ROOT.Char.IsFemale, 'la campeona', 'el campeón' )]"
 carnival.1018.b.failure: "Es obvio que la competición está amañada"
 carnival.1018.b.failure.toast: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstName|l] te llama farsante"
 carnival.1018.c.toast: "[intent_target.Custom('ES_ElLa')|U] [intent_target.GetTitledFirstNameNoTooltip|l] queda deleitad[intent_target.Custom('ES_OA')] y encantad[intent_target.Custom('ES_OA')]"
 ## Event - A mask in the crowd
 carnival.1019.t: "Máscaras entre la multitud"
 carnival.1019.desc: "No hago más que ver la misma máscara entre la multitud. Cuando avanzo por la calle, el mismo semblante helado de un bufón sonriente parece aparecer por el rabillo del ojo. Surge una y otra vez en el mar de máscaras. ¿Me están siguiendo? La idea me hiela las venas.\n\nSalgo de la vía pública y los enmascarados me siguen. ¡Seguro que quieren hacerme mal!"
 carnival.1019.a: "Preparar una emboscada."
 carnival.1019.b: "Atraerlos hasta una patrulla de la guardia."
 carnival.1019.c: "Gritar pidiendo ayuda."
 cooltip.carnival.1019.tt.assassination_success: "Matas a tu atacante"
 cooltip.carnival.1019.tt.assassination_fended: "Hieres a tu atacante"
 cooltip.carnival.1019.tt.assassination_captured: "El atacante es encarcelado"
 cooltip.carnival.1019.tt.assassination_scream: "Tus gritos hacen que los asesinos se dispersen"
 carnival.1019.tt.assassination_success.desc: "Matas al atacante"
 carnival.1019.tt.assassination_fended.desc: "Rechazas al atacante"
 carnival.1019.tt.assassination_wounded.desc: "Te hieren"
 carnival.1019.tt.assassination_killed.desc: "El atacante te mata"
 carnival.1019.tt.assassination_gotaway.desc: "Logras escapar"
 carnival.1019.tt.assassination_cornered.desc: "Te acorralan"
 carnival.1019.tt.assassination_captured.desc: "Tus guardias capturan al asesino"
 carnival.1019.tt.assassination_fended_toast: "Apuñalas a quien te perseguía y escapas por los callejones"
 carnival.1019.tt.assassination_wounded_toast: "El atacante te hiere y se pierde de nuevo en las sombras"
 carnival.1019.tt.assassination_success_toast: "[murder_01.Custom('ES_ElLa')|U] aspirante a asesin[murder_01.Custom('ES_OA')], [murder_01.GetFirstNameNoTooltip], ha muerto"
 carnival.1019.tt.assassination_gotaway_toast: "Te escabulles de tus atacantes"
 carnival.1019.tt.assassination_captured_toast: "Arrojan a una celda [murder_01.Custom('ES_AlAla')] asesin[murder_01.Custom('ES_OA')] [murder_01.GetFirstNameNoTooltip]."
 ## Event - Thundering hooves
 carnival.1020.t: "Retumbar de cascos"
 carnival.1020.desc: "[murder_victim.GetNameNoTooltip] abandona un banquete cuando [murder_victim.GetHerHim] veo a [murder_victim.GetSheHe] y a su [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip].\n\nTiro de las rindas de mi caballo a la espera de que [murder_victim.GetFirstNameNoTooltip] se despida del anfitrión. Mi objetivo no es consciente del peligro que hace resonar sus cascos al otro lado de la calle.\n\nEs un momento oportuno, pero viene con el riesgo de que también salgan heridos inocentes."
 carnival.1020.a: "Los partiré por la mitad al pasar."
 carnival.1020.b: "¡Arre, [ROOT.Char.Custom('WarhorseStoryName')]! Sabrán que soy un[ROOT.Char.Custom('ES_XA')] [ROOT.Char.GetWomanMan] a quien temer."
 carnival.1020.c: "Atropellas a [murder_victim.GetFirstNameNoTooltip]. Un desgraciado accidente."
 carnival.1020.d: "Hago una señal a los hombres que he contratado para que acaben con mi presa."
 carnival.1020.e: "Hoy no, el riesgo es demasiado grande."
 carnival.1020.tt.horse.hit.desc: "La víctima queda aplastada bajo los cascos"
 carnival.1020.tt.horse.miss.desc: "El caballo falla el blanco"
 carnival.1020.tt.horse.hit.toast: "La víctima quedó aplastada bajo los cascos"
 carnival.1020.tt.horse.miss.toast: "El caballo falló el blanco"
 carnival.1020.murder_horse.log_title: "Caballo de guerra desbocado"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName] [Select_CString(carnival_main.IsLocalPlayer, 'cabalgaste', 'cabalgó')] sobre [murder_victim.GetShortUIName] con [Select_CString(carnival_main.IsLocalPlayer, 'tu', 'su')] caballo de guerra, [carnival_main.Custom('WarhorseStoryName')]"
 carnival.1020.accident.log_title: "Horrible accidente"
 carnival.1020.accident.log: "[murder_victim.GetShortUIName] murió arrollad[murder_victim.Custom('ES_OA')] por un caballo en un accidente horrible."
 carnival.1020.both_accident.log_title: "Horrible accidente"
 carnival.1020.both_accident.log: "En un horrible accidente, [murder_victim.GetShortUIName] y [bystander.GetShortUIName] murieron [Select_CString(And(murder_victim.IsFemale, bystander.IsFemale), 'arrolladas', 'arrollados')] por un caballo"
 carnival.1020.bystander_accident.log_title: "Horrible accidente"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName] murió arrollad[bystander.Custom('ES_OA')] por un caballo en un accidente horrible."
 carnival.1020.sword.log_title: "Asesinato a caballo"
 carnival.1020.sword.log: "Un jinete partió en dos a [murder_victim.GetShortUIName] y [bystander.GetShortUIName]"
 carnival.1020.miss.log_title: "A [murder_victim.GetShortUIName] casi [murder_victim.GetHerHim] aplasta un caballo"
 carnival.1020.miss.log: "¡[murder_victim.GetShortUIName] afirma que [carnival_main.GetShortUIName] [Select_CString(carnival_main.IsLocalPlayer, 'trataste', 'trató')] de arrollar[murder_victim.GetHerHim] en un intento de asesinato!"
 ## Event - The Arrow
 carnival.1021.t: "La flecha"
 carnival.1021.desc: "Mi atalaya está en silencio, salvo por el crujido de la manera y el sonido de la calle que se cuela suavemente por los postigos. Afuera, en el patio de abajo, mi objetivo, [murder_victim.GetFirstNameNoTooltip], no es consciente de mi mirada ni del [SCOPE.Custom('UniqueBowOrJustBow')] a mi costado.\n\nHe traído conmigo a un sicario de alquiler, [bandit_01.GetFirstNameNoTooltip], por si necesitase otro par de manos.\n\nCuando estiro la cuerda del arco, [murder_victim.GetFirstNameNoTooltip] levanta la vista, ¡sus ojos inspeccionan las ventanas!"
 carnival.1021.a: "Hacer el tiro antes de que me vea."
 carnival.1021.b: "Tira tú, [bandit_01.GetFirstNameNoTooltip], yo aseguraré la ruta de huida."
 carnival.1021.c: "Abajo. Habrá que esperar una oportunidad mejor."
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip] mata a la persona equivocada"
 carnival.1021.tt.arrow.hit.desc: "La flecha impacta en el objetivo"
 carnival.1021.tt.arrow.miss.desc: "La flecha falla y el objetivo te ve"
 carnival.1021.tt.thug.arrow.hit.desc: "La flecha impacta en el objetivo"
 carnival.1021.tt.thug.arrow.miss.desc: "La flecha impacta en el objetivo equivocado"
 carnival.1021.tt.arrow.hit.toast: "La flecha alcanza el objetivo"
 carnival.1021.tt.arrow.miss.toast: "¡La flecha falla el objetivo y te descubren!"
 carnival.1021.tt.thug.arrow.hit.toast: "La flecha del sicario alcanza al objetivo"
 carnival.1021.tt.thug.arrow.miss.toast: "¡La flecha del sicario alcanza al objetivo equivocado!"
 carnival.1021.arrow.log_title: "Arquero desconocido"
 carnival.1021.arrow.log: "A [murder_victim.GetFirstNameNoTooltip] [murder_victim.GetHerHim] mató la flecha de un arquero desconocido"
 ## Event - Procession of My Own
 carnival.1022.t: "Una procesión propia"
 carnival.1022.desc: "La ciudad paga el carnaval para beneficio de todos y, si bien hay oro de sobra para unas diversiones aceptables, un ciudadano emprendedor con posibles podría impulsar el esplendor de nuestros festejos.\n\nSi contribuyese, mis iguales me contemplarían verdes de la envidia, y a los ojos de mis inferiores, reluciría como los patricios de antaño. Sí, pensadlo, ¡los poderosos de las antiguas ciudades-estado daban a conocer su riqueza! Si patrocinase una procesión gloriosa, ¡mi nombre estaría en boca de todos!\n\n #BOLD Pero ¿cuál debería ser el tema?#!"
 carnival.1022.a: "¡Una procesión #BOLD hermosa#! que honre mis logros!"
 carnival.1022.b: "¡Una procesión #BOLD intimidante#! que infunda miedo y respeto!"
 carnival.1022.c: "¡Una procesión #BOLD religiosa#! que muestre mi piedad!"
 carnival.1022.d: "Pensándolo mejor, hay modos mejores de gastar mi oro."
 custom.carnival.1022.guestopinion: "Todo invitado en el carnaval"
 custom.zealot_carnival.1022.guestopinion: "Todo invitado [GetVassalStance( 'zealot' ).GetTextIcon] en el carnaval"
 ## Event - Legacy in marble
 carnival.1023.t: "Un legado en mármol"
 carnival.1023.desc: "Desde mi infancia he oído historias sobre las antiguas ciudades-estado, donde los patricios eran grandes mecenas de las artes. Si bien los grandes edificios del pasado glorioso ahora yacen en ruinas, su arte y hermosura aún inspiran. Si patrocino artistas podré elevar mi nombre al nivel de esta augusta compañía.\n\nImaginad, ¡mi reputación continuaría más allá de este cascarón mortal!\n\n¡Que el pueblo contemple la belleza en mármol, piedra y madera, pintada en todos los colores del arco iris! ¡Por la gloria de la [Glossary( '#bold patria#!', 'carnival_patria_GLOSS' )], la veneración de nuestros antepasados y el prestigio de la casa de [ROOT.Char.GetDynastyHouseName]!"
 carnival.1023.a: "Patrocinar una competición de artistas jóvenes"
 carnival.1023.b: "Encargar nuevos frescos y adornos para una plaza pública."
 carnival.1023.c: "Ordenar un conjunto de estatuas que muestren a los fundadores de la ciudad."
 carnival.1023.d: "Un momento, ¡¿tan caro es el arte?!"
 ## Event - Whispers behind the mask
 carnival.1024.t: "Susurros tras la máscara"
 carnival.1024.desc: "En el jolgorio bullicioso del carnaval, las líneas se difuminan y la gente pierde el sentido del decoro. No se puede saber quién es en realidad el enmascarado que tenemos al lado o qué recordará.\n\n[hook_target.Custom('ES_ElLa')|U] [hook_target.GetTitledFirstNameNoTooltip|l] se ha perdido en el exceso. Se pasa la noche bailando con cualquiera que le llame la atención y bebe y come como si no hubiera un mañana. Ríe y habla sin preocuparse por quién escucha. Realiza bailes que rozan el escándalo absoluto, sin ser consciente de que [hook_target.Custom('ES_LoLa')] #BOLD observo detrás de mi máscara.#!\n\n #BOLD Podría ahorrarle el bochorno o usarlo contra [hook_target.GetSheHe] para que [hook_target.Custom('ES_ElLa')] [hook_target.GetTitledFirstNameNoTooltip|l] esté en deuda conmigo.#!"
 carnival.1024.a: "[hook_target.GetHerHim|U] observaré de modo amigable."
 carnival.1024.b: "Sería una lástima que alguien usase esto contra [hook_target.GetSheHe] luego."
 carnival.1024.c: "Mejor enviar una advertencia amistosa a su casa."
 carnival.1024.d: "Que [hook_target.Custom('ES_ElLa')] [hook_target.GetTitledFirstNameNoTooltip|l] cometa sus propios errores."
 carnival.1025.t: "Alhajas y animales fantásticos"
 carnival.1025.into_desc: "Me encuentro ante el puesto de un[merchant_character.Custom('ES_XA')] mercader extranjer[merchant_character.Custom('ES_OA')]. Se exponen objetos extraños de todos los lugares, por no mencionar las jaulas que se exhiben que contienen bestias exóticas. Los sonidos y olores que provienen de esta casa de fieras son algo notable.\n\n«¡Venid y mirad todos! ¡Tengo a la venta cosas prodigiosas!», grita [merchant_character.Custom('ES_ElLa')] mercader y señala a sus mercancías.\n\n«[merchant_trinket.GetName] de alta calidad y [merchant_creature.Custom('GetCarnival1025PitchArticle')] [merchant_creature.GetName]…"
 carnival_1025_creature_lion_desc: "la mantícora africana, la legendaria devoradora de hombres»."
 carnival_1025_creature_caracal_desc: "¡de talla pequeña, pero feroz!»."
 carnival_1025_creature_lynx_desc: "¡se sube a un árbol en tres segundos y su orina crea cristales con poderes mágicos!»."
 carnival_1025_creature_tiger_desc: "¡la feroz criatura devorahombres de la leyenda persa!»."
 carnival_1025_creature_leopard_desc: "¡tal como se describía en textos antiguos!»."
 carnival_1025_creature_bear_desc: "¡capaz de ponerse de pie y hacer malabares con piedras del tamaño de la cabeza de un hombre!»."
 carnival_1025_creature_elephant_desc: "¡la creación de un alquimista loco!»."
 carnival_1025_creature_peacock_desc: "¡que nació de las llamas!»."
 carnival_1025_creature_parrot_desc: "¡capaz de hablar y cantar himnos!»."
 carnival_1025_creature_cockatoo_desc: "¡una auténtica rareza!»."
 carnival_1025_creature_crane_desc: "¡observad la gracia de sus movimientos!»."
 carnival_1025_creature_monkey_desc: "¡de las mismas simas del infierno!»."
 carnival.1025.a: "«Asombroso, me quedaré con la alhaja»."
 carnival.1025.b_1: "«Milagroso, adquiriré la bestia»."
 carnival.1025.b_2: "«Y yo que creo que no es más que [merchant_creature.Custom('GetCarnival1025RealBeastArticle')] [merchant_creature.Custom('GetCarnival1025RealBeastName')]»."
 carnival.1025.c: "Al menos mirar es gratis."
 carnival.1025.embarrassed_merchant: "[merchant_character.Custom('ES_ElLa')|U] mercader te da un descuento por vergüenza."
