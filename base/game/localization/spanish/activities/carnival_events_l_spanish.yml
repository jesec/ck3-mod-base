l_spanish:
 ## Event - Carnival Opening
 carnival.1001.t: "Momento de maravillas"
 carnival.1001.desc: "Los preparativos están terminados.\n\nEstandartes coloridos llenan los bulevares, las procesiones serpentean por los callejones y calles de [carnival_location.GetName]. Muchedumbres se agolpan en plazas; ricos o pobres, todos somos uno e iguales en este mar de rostros enmascarados.\n\n¡Menudo espectáculo vamos a tener!"
 carnival.1001.a: "Es hora de ponerse la máscara. [Glossary( '#bold ¡Carnis levare!#!', 'carnival_GLOSS' )]"
 carnival.1001.b: "¡A ver si me encontráis ahora, asesinos!"
 carnival.1001.c: "Una máscara oculta fallos y cicatrices por igual…"
 ## Event - Carnival Closing
 carnival.1002.t: "Regreso a lo mundano"
 carnival.1002.desc: "Las calles están repletas de los restos del carnaval; máscaras desechadas y decoraciones colman las alcantarillas mientras los juerguistas se arrastran a sus hogares. Al dejar a un lado nuestras diferencias, hemos comido, bailado, jugado y reído como una ciudad unida.\n\nEl glamur del carnaval aún seguirá en el aire durante un tiempo para recordarnos quiénes somos; luego hay que volver a nuestras vidas normales, a la jerarquía, al trabajo y a las obligaciones… hasta que el carnaval regrese de nuevo."
 carnival.1002.a: "Hora de volver al trabajo."
 carnival.1002.b: "¿Y si todos los días fueran así?"
 carnival.1002.c: "Sienta bien volver al orden."
 ## Event - A chance for mischief
 carnival.1003.t: "Una oportunidad para portarse mal"
 carnival.1003.desc: "Al visitar la morada extravagante de la casa [house_target.GetDynastyHouseName], veo elegantes tejidos de [house_target.Custom('RegionalFabric')], centenares de [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')], sirvientes por doquier y a [house_target.GetName] sentar cátedra a sus clientes… y siento el impulso de humillarlos a todos un poco.\n\nSemejante travesura encaja con el espíritu del carnaval, ¿verdad?\n\nPodría pagar en secreto a algunos rufianes para:"
 carnival.1003.a: "¡Tirar huevos podridos a [house_target.GetFirstNameNoTooltip]!"
 carnival.1003.b: "Arrasar su palacio disfrazados de diablos."
 carnival.1003.c: "Hacer pintadas obscenas de su familia por los bulevares."
 carnival.1003.d: "Pensándolo mejor, no."
 carnival.1003.tt.reclusive_toast: "A [house_member.GetShortUIName] le da demasiada vergüenza salir a la calle"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName] se vuelve majara"
 carnival.1003.tt.irritable_toast: "A [house_member.GetShortUIName] se [house_member.GetHerHim] llevan los demonios"
 carnival.1003.throw_eggs_log_title: "Andanadas de huevos"
 carnival.1003.throw_eggs_log: "La mansión de la casa [house_target.GetDynastyHouseName] recibió varias andanadas de huevos"
 carnival.1003.mischief.insanity.log_title: "Desmadre diabólico"
 carnival.1003.mischief.insanity.log: "Una turba de bellacos vestidos de diablos volvieron majara a [house_member.GetShortUIName]"
 carnival.1003.mischief.irritable.log_title: "Desmadre diabólico"
 carnival.1003.mischief.irritable.log: "Una turba de bellacos disfrazados de diablos ha encolerizado a [house_member.GetShortUIName] y ahora está irritad[house_member.Custom('ES_OA')] con todos los que le rodean"
 carnival.1003.mischief.reclusive.log_title: "Desmadre diabólico"
 carnival.1003.mischief.reclusive.log: "Una turba de bellacos disfrazados de diablos ha impulsado a [house_member.GetShortUIName] a esconderse"
 ## Event - House Relations
 carnival.1004.t: "Relación de casa"
 carnival.1004.desc: "Una ciudad dividida no se puede sostener, así que a mí me corresponde hacer causa común con las casas poderosas involucradas en la política de [carnival_location.GetName].\n\nDurante un banquete, me llevo aparte a [other_house_leader01.GetName] e intento que vea los beneficios de que haya buenas relaciones entre mi casa —los [ROOT.Char.GetDynastyHouseName]— y su casa —los [other_house_leader01.GetDynastyHouseName]—."
 carnival.1004.a: "¡Nuestros libros de cuentas están llenos y nuestras bolsas resuenan!"
 carnival.1004.b: "La cooperación en negocios beneficia a ambas casas."
 carnival.1004.c: "Tu casa está muy por debajo de la casa [ROOT.Char.GetDynastyHouseNameNoTooltip]"
 carnival.1004.d: "La relación entre nuestras casas debe permanecer igual."
 ## Event - Prank a friend
 carnival.1005.t: "Divertirse con un amigo"
 carnival.1005.desc: "El carnaval es la oportunidad perfecta para gastarle una broma a un amigo; todo con ánimo alegre, por supuesto.\n\nVeo a mi amig[friend.Custom('ES_OA')] [friend.GetName] hablar con [friend.GetName], ¡y algunas divertidas posibilidades me vienen a la mente al momento!"
 carnival.1005.a: "¡Les desafiaré a un duelo con un palo de madera!"
 carnival.1005.b: "Chocar con [friend.GetSheHe] disfrazad[ROOT.Char.Custom('ES_OA')] y hablando un idioma inventado."
 carnival.1005.c: "¡Les tiraré huevos pintados llenos de perfume!"
 carnival.1005.d: "No, no impondré mi humor a otros."
 carnival.1005.tt.stick_success.desc: "Disfrutas con el duelo de palos"
 carnival.1005.tt.stick_failure.desc: "Empleas demasiada violencia al jugar"
 carnival.1005.tt.success.desc: "Todos se ríen con tu floritura"
 carnival.1005.tt.failure.desc: "Tus víctimas te llaman asno torpe"
 carnival.1005.tt.disguise_success.desc: "Entretienes a tu audiencia"
 carnival.1005.tt.disguise_failure.desc: "Confundes e irritas a tu audiencia."
 carnival.1005.tt.success.toast: "Todos se rieron con tu floritura"
 carnival.1005.tt.failure.toast: "Tus víctimas te llamaron asno torpe"
 carnival.1005.tt.egg_success.toast: "A tu amig[friend.Custom('ES_OA')] le encantó la aromática sorpresa"
 carnival.1005.tt.egg_failure.toast: "Tu amig[friend.Custom('ES_OA')] odió el olor."
 ## Event - The entertainer
 carnival.1006.t: "Los artistas"
 carnival.1006.desc: "Los carnavales son temporada alta para artistas de todo pelaje. Me encuentro oyendo a una troupe de músicos de gran talento que cuentan historias con voces, versos e instrumentos."
 carnival.1006.a: "¡Pagaré a los artistas para que canten canciones sobre mi grandeza!"
 carnival.1006.b: "Haré que un intermediario reclute a los mejores."
 carnival.1006.c: "Podría pedir una melodía popular."
 carnival.1006.d: "¡Invitaré a bailar a un[dancer_character.Custom('ES_XA')] [dancer_character.GetWomanMan] cercan[dancer_character.Custom('ES_OA')]!"
 cooltip.carnival.1006.bawdy_song.tt: "Pide una canción picante"
 cooltip.carnival.1006.patriotic_song.tt: "¡Pide una canción sobre la [Glossary( '#bold patria!#!', 'carnival_patria_GLOSS' )]"
 cooltip.carnival.1006.spiritual_song.tt: "Pide una canción espiritual"
 carnival.1006.tt.dance_success.desc: "[dancer_character.Custom('ES_ElLa')|U] [dancer_character.GetWomanMan] acepta la invitación a bailar"
 carnival.1006.tt.dance_failure.desc: "[dancer_character.Custom('ES_ElLa')|U] [dancer_character.GetWomanMan] rechaza la invitación a bailar"
 carnival.1006.tt.dance_success.toast: "Bailas con [dancer_character.GetFirstNameNoTooltip]"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip] rechaza bailar contigo."
 carnival.1006.bawdy_song.tt.toast: "¡Consigues una canción picante!"
 carnival.1006.patriotic_song.tt.toast: "¡Consigues una canción sobre la [Glossary( '#bold patria#!', 'carnival_patria_GLOSS' )]!"
 carnival.1006.spiritual_song.tt.toast: "¡Consigues una canción espiritual!"
 carnival.1006.recruit_entertainer.log_title: "Artista reclutado"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip] reclutó a [entertainer_character.GetFirstNameNoTooltip]"
 ## Event - Learning to juggle
 carnival.1007.t: "Aprendiendo malabares"
 carnival.1007.desc: "Juglares, malabaristas y bufones entretienen al pueblo en el bulevar de [carnival_location.GetName]. Los malabaristas en especial me llaman la atención. Resulta difícil no admirar el control que tienen sobre los cuchillos y pelotas que mantienen en el aire.\n\nUno de los malabaristas da un paso adelante y me pregunta si quiero intentarlo, solo porque sí.\n\n«Una, dos o tres, ¿cuántas bolas podéis mantener en el aire, [ROOT.Char.Custom('MistressMaster')|l]?»."
 carnival.1007.a: "¡Apuesto contra todos que puedo mantener tres bolas en el aire!"
 carnival.1007.b: "Dos bolas son más que suficiente."
 carnival.1007.c: "¿Y qué tal dos cuchillos de esos?"
 carnival.1007.d: "No me rebajo a semejantes frivolidades."
 carnival.1007.juggling_success.tt.toast: "Malabares exitosos"
 carnival.1007.juggling_fail.tt.toast: "Bolas caídas"
 carnival.1007.juggling_athletic.tt.toast: "Los malabares son un buen modo de entrenar el cuerpo y los sentidos"
 carnival.1007.juggling_k.success.tt.toast: "Malabares con cuchillos exitosos"
 carnival.1007.juggling_k.fail.tt.toast: "Te cortas al hacer malabares con cuchillos"
 carnival.1007.blademaster.log_title: "Fascinación con los cuchillos"
 carnival.1007.blademaster.log: "[carnival_main.GetFirstNameNoTooltip] ha ganado una fascinación por jugar con hojas afiladas después de hacer malabares con cuchillos"
 ## Event - A wild dance
 carnival.1008.t: "Una danza salvaje"
 carnival.1008.desc: "La plaza central es un mar de bailarines enmascarados; la música se mezcla con las risas. Desconocidos se encuentran y se separan de nuevo mientras las parejas vienen y van en los giros del baile.\n\n¡Y como me encuentro en el borde de la plaza, la atmósfera es contagiosa!"
 carnival.1008.a: "«¡Recompensaré con oro a los mejores bailarines!»."
 carnival.1008.b: "BAILARÉ, BAILARÉ, ¡hasta que las piernas no puedan más!"
 carnival.1008.c: "Que el baile me lleve allá donde sea."
 carnival.1008.d: "Disfrutar el momento sin más."
 carnival.1008.strong.tt.toast: "Piernas bailarinas"
 carnival.1008.exhausted.tt.toast: "¡El baile te agota!"
 carnival.1008.hurt.tt.toast: "¡Te has hecho daño al bailar!"
 ## Event - A drink with a craftsman
 carnival.1009.t: "Una bebida con un[craftsman_character.Custom('ES_XA')] maestr[craftsman_character.Custom('ES_OA')] de [craftsman_character.Custom('CraftsmanDescOption')|l]"
 carnival.1009.desc: "En uno de los mejores establecimientos de la calle de las [craftsman_character.Custom('CraftsmanDescOption')|l]s, entablo conversación con [Select_CString(craftsman_character.GetTopLiege.IsFemale, 'una maestra artesana', 'un maestro artesano' )].\n\n"
 carnival.1009.1_a.desc: "Se sorprende al conocer [carnival_host.Custom('ES_AlAla')] [carnival_host.GetTitleAsNameNoTooltip|l] en persona."
 carnival.1009.1_b.desc: "A salvo tras mi máscara, estoy segur[ROOT.Char.Custom('ES_OA')] de que no se da cuenta de quién soy."
 carnival.1009.2_a.desc: "Escucho atentamente cómo se queja de lo mal llevada que está la ciudad y culpa [carnival_host.Custom('ES_AlAla')] [carnival_host.GetTitleAsNameNoTooltip|l] del estado de su oficio."
 carnival.1009.2_b.desc: "Escucho atentamente cómo alaba [carnival_host.Custom('ES_AlAla')] [carnival_host.GetTitleAsNameNoTooltip|l] por lo bien llevada que está la ciudad y alza su jarra a su salud."
 carnival.1009.2_c.desc: "Al estar bastante feliz con la buena gestión de la ciudad, se prodiga en alabanzas a mi persona."
 carnival.1009.2_d.desc: "Se queda callad[craftsman_character.Custom('ES_OA')] y solo dice hosc[craftsman_character.Custom('ES_OA')] que las cosas han sido algo duras de un tiempo a esta parte."
 carnival.1009.a: "Me lo tomaré en serio y redoblaré mis esfuerzos."
 carnival.1009.b: "Enviaré a los guardias a dar ejemplo con [Select_CString(craftsman_character.GetTopLiege.IsFemale, 'esta paleta', 'este patán' )]."
 carnival.1009.c: "«¡Pues ocupaos vos, [Select_CString(craftsman_character.GetTopLiege.IsFemale, 'consejera', 'consejero' )]!"
 carnival.1009.d: "Tengo que revelar quién soy y prometer mejorar por la ciudad."
 carnival.1009.e: "La primera alabanza sincera que he oído en meses."
 carnival.1009.f: "¡Lo sabía! No tenía que preocuparme por los asuntos de la ciudad."
 carnival.1009.g: "Tal y como me imaginaba. Tendría que erigir una estatua en mi honor."
 carnival.1009.h: "Convencer [craftsman_character.Custom('ES_AlAla')|U] maestr[craftsman_character.Custom('ES_OA')] de [craftsman_character.Custom('CraftsmanDescOption')|l] para que diga lo que piensa"
 carnival.1009.i: "«Fuerzas ocultas socavan esta república, amig[ROOT.Char.Custom('ES_OA')]»."
 carnival.1009.j: "«Digo yo que me merezco una recompensa por todo mi trabajo»."
 carnival.1009.k: "«¡La república entera se atribuye nuestra buena fortuna!»."
 carnival.1009.l: "Asiento y sigo bebiendo mi [ROOT.Char.Custom('RegionalDrink')]."
 carnival.1009.m: "¡No he venido aquí para parlotear, sino para luchar!"
 carnival.1009.n: "«¡Enseñadme algo de vuestro oficio de [craftsman_character.Custom('CraftsmanDescOption')|l] buen[craftsman_character.Custom('ES_XA')] amig[craftsman_character.Custom('ES_OA')]!»."
 carnival.1009.o: "Reclutar [Select_CString(craftsman_character.GetTopLiege.IsFemale, 'a la maestra', 'al maestro' )] a través de un intermediario."
 carnival.1009.p: "«A este trago invito yo, amig[craftsman_character.Custom('ES_OA')]»."
 custom.carnival.1009.spreading_ill_rumors: "Todo [courtier|El] de [culture|El] o [faith|El] distinta"
 custom.carnival.1009.shared_praise: "Todo [courtier|El]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U] ganó una [inspiration|El] #V artesana#!"
 carnival.1009.drunk.tt.toast: "Te das a la bebida"
 carnival.1009.tasty.tt.toast: "¡Qué delicia!"
 carnival.1009.skillup.tt.toast: "Aprendiste [Select_CString(craftsman_character.GetTopLiege.IsFemale, 'de la maestra artesana', 'del maestro artesano' )]"
 carnival.1009.patron.tt.toast: "Conseguido un asociado"
 carnival.1009.councilor.log_title: "Nuevo consejero"
 carnival.1009.councilor.log: "A [craftsman_character.GetShortUIName|U] se le nombró [councillor|El]"
 carnival.1009.recruiting.log_title: "Maestr[craftsman_character.Custom('ES_OA')] de [craftsman_character.Custom('CraftsmanDescOption')|l] reclutad[craftsman_character.Custom('ES_OA')]"
 carnival.1009.recruiting.log: "[craftsman_character.GetShortUIName|U] fue reclutad[craftsman_character.Custom('ES_OA')] por [carnival_main.GetFirstNameNoTooltip]"
 carnival.1009.learning_trade.log_title: "Aprendizaje de un maestro artesano"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip] obtuvo algo de conocimiento de un[craftsman_character.Custom('ES_XA')] maestr[craftsman_character.Custom('ES_OA')] de [craftsman_character.Custom('CraftsmanDescOption')|l]"
 ## A drink with a craftsman - Different Craftsmen nick
 carnival.1009.customloc01: "Herrería"
 carnival.1009.customloc02: "Carpintería"
