l_spanish:
 activity_carnival: "Carnaval"
 activity_carnival_name: "Carnaval de [Select_CString( ACTIVITY.GetOwner.IsLocalPlayer, 'tu personaje', ACTIVITY.GetOwner.GetName )]"
 activity_carnival_owner: "Anfitrión"
 activity_carnival_desc: "¡Apacigua y entretiene a tus ciudadanos con un carnaval deslumbrante! Da a tus súbditos y a ti mism[ROOT.Char.Custom('ES_OA')] la oportunidad de dejar de lado grado y distinciones, ¡entregaos a una juerga enmascarada de diversión y comida!\n\nTodos estarán ansiosos por celebrar la historia y la cultura de tu república. Es una buena oportunidad para exhibir tu riqueza con objeto de avivar la envidia de tus rivales o moverte entre la muchedumbre sin que te vean para experimentar sus ideas y preocupaciones sin restricciones."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$Se puede ganar [prestige|El] [prestige_i]\n$BULLET_WITH_TAB$Se puede ganar [piety|El] [piety_i]\n$BULLET_WITH_TAB$Los participantes pueden mejorar la [opinion|El] [opinion_i|E] de otros [Concept('activity_guest_short', 'invitados')|E]\n$BULLET_WITH_TAB$Los participantes pueden perder [stress|El] [stress_loss_i]\n$BULLET_WITH_TAB$Puede mejorar el [control|El] [control_i|E] en el [county|El]\n$BULLET_WITH_TAB$Puede mejorar la [prosperity|El] [prosperity_i|E] en el [county|El]\n$BULLET_WITH_TAB$Puede mejorar la [popular_opinion|El] [popular_opinion_i|E]\n"
 activity_carnival_guest_help_text: "Un carnaval es una oportunidad excelente para encontrar a nuevos plebeyos con talento, hacer conexiones comerciales o perder [stress|El] [stress_loss_i] sin más."
 activity_carnival_province_desc: "Organizas un carnaval en [ROOT.Province.GetName]."
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Los participantes pueden ganar [prestige|El]\n$BULLET_WITH_TAB$ Los participantes pueden ganar [opinion|El] sobre otros participantes\n$BULLET_WITH_TAB$ Los participantes pueden perder [stress|El] [stress_loss_i]"
 activity_carnival_conclusion_desc: "El [GetActivityType( 'activity_carnival' ).GetName|l] ha terminado."
 activity_carnival_selection_tooltip: "Deleita a tu pueblo con celebraciones enmascaradas\n\nRecompensas previstas:\n$BULLET_WITH_TAB$[prestige|E] [prestige_i|E]\n$BULLET_WITH_TAB$[piety|E] [piety_i|E]\n$BULLET_WITH_TAB$[stress_loss|E] [stress_loss_i|E]\n$BULLET_WITH_TAB$[opinion|E] [opinion_i|E]\n$BULLET_WITH_TAB$[control|E] [control_i|E]\n$BULLET_WITH_TAB$[prosperity|E] [prosperity_i|E]\n$BULLET_WITH_TAB$[popular_opinion|E] [popular_opinion_i|E]"
 carnival_decoration_basic: "Decoraciones básicas"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ Ganancia de [prestige|El] reducida\n\n#weak La ciudad ya es bastante bonita como está, ¿verdad?#!"
 carnival_decoration_extensive: "Decoraciones profusas"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$ Ganancia de [prestige|El] moderada\n\n#weak Adorna la ciudad con flores, telas y conjuntos que transporten a los ciudadanos a un mundo maravilloso más allá de lo ordinario.#!"
 carnival_decoration_extravagant: "Decoraciones extravagantes"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ Gran ganancia de [prestige|El]\n\n#weak Pon la ciudad entera patas arriba, no repares en gastos para adornar las calles y plazas para convertirlos en lugares maravillosos de la imaginación.#!"
 carnival_entertainment_basic: "Entretenimiento básico"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ Ganancia de [popular_opinion|El] reducida\n\n#weak Basta con unos cuantos malabaristas y algún cantante.#!"
 carnival_entertainment_extensive: "Entretenimiento amplio"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ Ganancia de [popular_opinion|El] moderada\n\n#weak Contrata una troupe de actores, malabaristas y bardos para entretener y asombrar a la muchedumbre.#!"
 carnival_entertainment_extravagant: "Entretenimiento extravagante"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ Gran ganancia de [popular_opinion|El]\n\n#weak Llena las plazas con artistas de todo el mundo para que la población quede entusiasmada con actuaciones exóticas de todo tipo.#!"
 go_incognito_intent: "Ir de incógnito"
 go_incognito_intent_desc: "Participa en el carnaval ocult[ROOT.Char.Custom('ES_XA')] con una máscara para mezclarte de forma anónima con la muchedumbre.\n#EMP #low Descubre [secrets|El] [secrets_i] y actúa bajo el velo del anonimato."
 flaunt_wealth_intent: "Alarde de riqueza"
 flaunt_wealth_intent_desc: "Viste un disfraz llamativo y busca oportunidades para gastar dinero generosamente.\n#EMP #low Gana [prestige|El] [prestige_i] y [popular_opinion|El] [popular_opinion_i]."
 activity_carnival_host_an_a: "$host_activity_a$"
 carnival_base_cost: "Coste base"
 activity_carnival_destination_selection: ""
 carnival_option_decoration: "Adornos de carnaval"
 carnival_option_entertainment: "Entretenimiento de carnaval"
 carnival_phase: "$activity_carnival$"
 carnival_phase_desc: "Ver a mi gente sonriente y feliz me produce una alegría inmensa."
 carnival_conc_reward_title: "El carnaval termina"
 carnival_conc_reward: "[ROOT.Char.GetShortUINameNoTooltip] [Select_CString( ROOT.Char.IsPlayer, 'celebraste', 'celebró' )] un carnaval exitoso"
