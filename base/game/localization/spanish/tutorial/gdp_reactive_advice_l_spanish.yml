l_spanish:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "Necesidades de construcción"
 action_reactive_advice_building_needs: "Consejo: $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "Tus [buildings|El] tienen [needs|El] de [trade_goods|El] suministradas por el [market|El] local. Abre para saber cómo cubrir estas necesidades."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "Si quieres aprovechar al máximo los [buildings|El] de tu [domain|El], deberías asegurarte de que tienen acceso a las [trade_goods|El] que necesitan.\n\n¡Echemos un vistazo a cómo hacerlo!"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "Primero, echemos un vistazo a tu [domain|El]."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Abre la pestaña «Dominio» en la pantalla «Señoríos» (resaltada)"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "Estas son todas las [holdings|El] de tu [domain|El].\n\nEl [county|El] de cada posesión es parte de un [market|El]. Todos los [goods|El] producidos y consumidos por los [buildings|El] se intercambian en estos mercados."
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "Ahora, echemos un vistazo a una de tus [holdings|El]."
 reactive_advice_building_needs_step_open_county_view_prompt: "Haz clic en una de tus posesiones (resaltada)"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "Estos son los [districts|El] de tu [holding|El]. Dentro de cada distrito están los [buildings|El] que producen y consumen [goods|El]."
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "Como ejemplo, podemos echar un vistazo a las [needs|El] de tu [holding_district|El]."
 reactive_advice_building_needs_step_open_district_view_prompt: "Haz clic en el $game_concept_holding_district$ (resaltado)#!"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "Aquí puedes ver los efectos de cada [building|El] del [district|El].\n\nCiertos efectos requieren consumir [trade_goods|El] del [market|El] del [county|El] para estar activos.\n\nPor ejemplo, el [holding_district|El] proporciona [food_supply|El] a la [holding|El], si puede consumir [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l] y [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon|l].\n\nSi no se satisface una [need|El], no hay efectos negativos, y todos los $game_concept_buildings$ proporcionarán beneficio incluso si no tienen acceso a los $game_concept_trade_goods$ que necesitan."
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "A menudo, una determinada [trade_good|El] no es necesaria, sino que, en lugar de ello, cualquier combinación de $game_concept_goods$ de una determinada [trade_category_short|El] es suficiente. Por ejemplo, un [building|El] puede necesitar [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon|l], lo que significa que podría valer con [GetTradeGoodType('trade_good_grain').GetNameWithIcon|l], [GetTradeGoodType('trade_good_millet').GetNameWithIcon|l] o [GetTradeGoodType('trade_good_rice').GetNameWithIcon|l].\n\nAdemás, algunas [needs|El] se pueden satisfacer varias veces; cada vez que la cantidad se satisface, se concede el efecto de nuevo."
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "Ya hemos visto que los [buildings|El] necesitan [trade_goods|El], pero ¿de dónde proceden? \n\nCada mercadería consumida en un [county|El] viene del [market|El] de ese condado."
 reactive_advice_building_needs_step_open_market_view_prompt: "Abre el mercado del condado (resaltado)#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "Este es el [market|El] del [county|El]. Normalmente, el mercado abarca los mismos [counties|El] que un [duchy|El]."
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "Aquí puedes ver cada [trade_good|El], y si hay [surplus|El] o una [need|El] no cubierta.\n\nSi hay una necesidad sin cubrir (#N balance negativo#!), no todos los [buildings|El] del [market|El] reciben sus [needs|El].\n\nSi hay excedente (#P balance positivo#!), todos los [buildings|El] del mercado tendrán sus necesidades cubiertas para esa mercadería, y la mercadería se podrá exportar a través de las [trade_routes|El].\n\n#I Puedes hacer clic en una $game_concept_trade_good$ para ver su estado en el mercado y en el mapa.#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "Si hay una [need|El] sin satisfacer, puedes intentar hacerlo de las siguientes maneras:\n\n$BULLET_WITH_TAB$Construye [buildings|El] en el [market|El] que produce la [trade_good|El].\n$BULLET_WITH_TAB$Establece una [distribution_route|El] entre dos $game_concept_markets$ de tu [realm|El].\n$BULLET_WITH_TAB$Encarga a uno de tus [client_merchants|El] que importe la $game_concept_trade_good$.\n\nSin embargo, no todas las $game_concept_needs$ se pueden satisfacer fácilmente, y a veces es mejor dejar la $game_concept_need$ sin satisfacer."
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Poner construcciones en cola"
 action_reactive_advice_construction_queue: "Consejo: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "Tienes una construcción en cola. Abre esto para saber cómo manejar todas tus construcciones."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "¡Tienes una construcción en cola!\n\nIncluso si no puedes permitirte un [building|El] ahora, puedes ponerlo en cola para construirlo cuando puedas.\n\nEchemos un vistazo a la cola."
 reactive_advice_construction_queue_intro_prompt: "Abre la pantalla «$BUILD_QUEUE_WINDOW_TITLE$» (resaltada)"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "Estas son todas las construcciones que has puesto en cola hasta ahora en todas tus [holdings|El].\n\nUna vez puedas pagar sus costes y todos los demás requisitos se cumplan, el coste se pagará automáticamente y comenzará la construcción.\n\nLas construcciones se iniciarán según el orden de la cola, pero puedes arrastrar y soltar para reordenarlas."
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "Si quieres reservar [gold|El] u otros recursos, puedes hacerlo aquí.\n\nEsta cantidad no se usará para iniciar las construcciones en cola, para que siempre tengas una reserva para gastar en caso de emergencia."
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "¡Eso es todo lo que tienes que saber sobre las construcciones en cola! ¡Que te diviertas construyendo!"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Rutas comerciales"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "Mientras otros trabajan en los campos o cobran impuestos a los pobres, tú te beneficias del flujo de [goods|El].\n\nLas [trade_routes|El] son la principal forma en que los [merchants|El] y las [republics|El] ganan [gold|El]."
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "Primero, debes decidir con qué [trade_good|El] comerciar.\n\nEstas son las recomendadas, pero también puedes ver todas las mercaderías si estás buscando algo en concreto."
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "En el mapa, puedes ver todos los [markets|El] que comercian con tu [trade_good|El] seleccionada.\n\nPara comerciar, necesitas conectar un mercado que tenga un [surplus|El] de artículos (#trade_surplus verde azulado#!) con un lugar que tenga una [need|El] de ello (#trade_need dorado#!).\n\nSi un mercado ya tiene varios [merchants|El], solo podrás comerciar con una porción de los artículos allí, limitada por tu [competitiveness|El].\n\nAl comprar barato y vender caro, podrás generar un beneficio mayor.\n\n#I Haz clic en los mercados para añadirlos o eliminarlos de la ruta.#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "Cuando añades [markets|El] a tu [route|El], el [good|El] seleccionado se transportará por la ruta y se mostrará aquí.\n\nEl artículo más a la izquierda es el [primary_good|El]; obtienes [trade_expertise|El] al comerciar con él. Con el tiempo, esto te concederá varios beneficios dependiendo de su [trade_category|El].\n\n#I Si llevas más de un artículo, puedes arrastrar otro a la primera posición para convertirlo en el $game_concept_primary_good$.#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "Solo puedes llevar cierto número de [goods|El] distintos, y hasta una determinada [capacity|El] total.\n\nEstos límites pueden mejorarse al construir [company_buildings_short|El] en tu [company|El]."
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "De manera similar, las rutas están limitadas por la [trade_route_length|El], y solo puedes parar en un número limitado de [markets|El]."
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "Por último, puedes asignar uno de tus [associates|El] como [trader|El]. En función de qué tarea le des, mejorará distintos aspectos de la [route|El]."
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "A medida que desarrolles tu [company|El], ganarás acceso a más [routes|El], y mejorarás lo lejos que pueden llegar y cuánto puedes comerciar.\n\n¡De esta forma, harás más y más [gold|El]!"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Ser un mercader"
 action_reactive_advice_merchant_introduction: "Consejo: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "¡Eres [merchant|El]! Abre aquí para aprender los fundamentos del negocio."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "¡Eres [merchant|El]!\n\nAunque el [trade|El] es la savia de tu [company|El], el negocio consiste en mucho más que hacer dinero."
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "Deberíamos empezar echando un vistazo a cómo puede crecer la [company|El] a largo plazo."
 reactive_advice_merchant_introduction_open_overview_prompt: "Abre la pestaña Resumen en la pantalla Señorío (resaltada)"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "Este es el [company_size|El], el principal indicador del poder de tu $game_concept_company$.\n\nA medida que tu $game_concept_company$ crezca, los [rulers|El] de [rank|El] más alto, como los [kings|El] y los [emperors|El], notarán tu presencia."
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "Este es el [domicile|El] de tu [company|El], tu base de operaciones.\n\nAquí puedes gastar [gold|El] y [prestige|El] para construir [domicile_buildings|El] que pueden mejorar aún más tu $game_concept_company$."
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "Este es el [company_purpose|El], que determina el enfoque de tu $game_concept_company$.\n\nEl propósito de comerciante es el predeterminado, pero puedes cambiarlo para centrarte en [artifacts|El], lujos o prestar dinero en su lugar."
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "Incluso como [merchant|El], no estás libre del gobierno de los señores locales."
 reactive_advice_merchant_introduction_open_patronage_prompt: "Abre la pestaña $MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$ (resaltada)"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "Este es tu [merchant_patron|El], el [ruler|El] de la [holding|El] donde se ubica tu [domicile|El].\n\nAunque tienes que pagar impuestos a tu $game_concept_merchant_patron$, también puedes beneficiarte de esta relación.\n\nPor ejemplo, puedes cambiar tu [client_contract|El] para pedir a tu $game_concept_merchant_patron$ que apoye tus empresas comerciales o que facilite proponer [marriages|El] a los nobles."
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "Normalmente no eres el único [merchant|El] [client|El] de tu [merchant_patron|El].\n\nOtros $game_concept_clients$ también comerciarán en la ubicación donde te encuentras, y solo un $game_concept_client$ ostentará el [charter|El] especial. Tener el $game_concept_charter$ mejorará tu actividad comercial, en forma de [decisions|El] especiales."
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "Finalmente, es hora de hablar del elefante de oro en la habitación: cómo hacer dinero."
 reactive_advice_merchant_introduction_open_trade_prompt: "Abre la pestaña Rutas comerciales en el panel Comercio (resaltado)"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "Estas son tus [trade_routes|El], tu principal forma de obtener [gold|El].\n\nA medida que desarrolles tu $game_concept_company$, podrás tener más $game_concept_routes$, que llegarán más lejos y moverán más [goods|El]. Esto, a cambio, te concederá más $game_concept_gold$."
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "Este es el estilo del [merchant|El]: obtener [gold|El] a partir de tus [trade_routes|El] y gastarlo para aumentar tu [prestige|El] y [company_size|El].\n\n¡Los negocios en manos de $game_concept_merchants$ responsables y organizados acabarán sobrepasando a los de los [rulers|El] ricos!"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "Dirección de la compañía"
 action_reactive_advice_company_direction: "Consejo: $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "Con el tiempo, la [Concept('company_direction', 'dirección de tu compañía')|E] podría cambiar. Abre esto para saber más al respecto."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "No todos los [merchants|El] tienen los mismos objetivos. Aunque el [gold|El] es poder en sí mismo, algunos valoran más la familia y la nobleza."
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "La [Concept('company_direction', 'dirección de tu compañía')|E] forma parte de tu [house|El], así que echémosle un vistazo."
 reactive_advice_company_direction_open_house_prompt: "Selecciona tu casa (resaltada)"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "Continúa a la pestaña [sentiment|E]."
 reactive_advice_company_direction_open_direction_tab_prompt: "Abre la pestaña Dirección (resaltada)"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "Esta es la [Concept('company_direction', 'dirección de tu compañía')|E]. Aunque comienza siendo [company_sentiment_independent|El], puede tender hacia [company_sentiment_divided|El] o [company_sentiment_concerted|El].\n\nCasarse con [houses|El] [Concept('noble', 'nobles')|E] hará que tienda hacia $game_concept_company_sentiment_concerted$, mientras que casarse con [merchants|El] hará que tienda hacia $game_concept_company_sentiment_divided$."
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Patrocinar construcción"
 action_reactive_advice_sponsor_construction: "Consejo: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "Puedes patrocinar [buildings|El] en las [holdings|El] de otros [characters|El]. Abre para saber cómo hacerlo."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "Ahora puedes patrocinar la mejora de [buildings|El] en las [holdings|El] de otros [characters|El]."
 reactive_advice_sponsor_construction_select_holding_prompt: "Selecciona cualquier posesión en el mapa"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "Ahora, selecciona uno de sus [districts|El]."
 reactive_advice_sponsor_construction_open_district_prompt: "Selecciona un distrito (resaltado)"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "¡Aquí puedes patrocinar una construcción! Ten en cuenta que solo puedes #EMP mejorar#! [buildings|El], y solo en los [districts|El] estándar.\n\nEl principal motivo para patrocinar es aumentar el [surplus|El] o la [need|El] de una [trade_good|El] en el [market|El] de la [holding|El]. De esta forma, puedes conectar los $game_concept_market$ a una de tus [profit_routes|El] y aumentar la cantidad de [gold|El] que obtienes."
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Política republicana"
 action_reactive_advice_republican_politics: "Consejo: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "Eres parte de una [republic|El]. Abre para conocer los entresijos de su política."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "¡Tú, como [house_head|El], eres parte de una [republic|El] virtuosa!\n\nComo líder de una [patrician_family|El], gobiernas junto a otras $game_concept_patrician_families$ en un proceso relativamente democrático. Aunque actualmente no seas [ruler|El] de la $game_concept_republic$, siempre puedes participar, mientras tengas el [gold|El] y la influencia."
 reactive_advice_republican_politics_intro_prompt: "Abre la pestaña Resumen en la pantalla República (resaltada)"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "Al igual que sus ciudadanos, no todas las [republics|El] son iguales. Cada $game_concept_republic$ tiene un [title_tier|El] y una [republic_administration|El], como se muestra aquí.\n\nAl gastar [prestige|El] y [treasury|El], el [ruler|El] puede aumentar el $game_concept_title_tier$ de la $game_concept_republic$, y con ello su poder.\n\nEl $game_concept_ruler$ actual también puede cambiar la $game_concept_republic_administration$, lo que determina la dirección general de la $game_concept_republic$."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "Hablando del [ruler|El], ¡aquí lo tienes!\n\nEn contraste con la tiranía de otros [governments|El], el $game_concept_ruler$ de una [republic|El] es elegido, y solo durante un mandato limitado.\n\nSin embargo, el mismo $game_concept_ruler$ puede ser reelegido, por lo que no es extraño que también sea el candidato principal."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "La [assembly|El] es un sistema de control del poder del [ruler|El]. Echémosle un vistazo."
 reactive_advice_republican_politics_open_assembly_prompt: "Abre la pestaña Asamblea (resaltada)"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "El [ruler|El] no es todopoderoso; cualquier cambio de [law|El] o [republic_decree_short|El] debe ser aprobado por la [assembly|El]. Los miembros de la $game_concept_assembly$ pueden incluso proponer sus propios cambios a una $game_concept_law$.\n\nLa $game_concept_assembly$ normalmente incluye a las [patrician_families|El] de la [republic|El]. Aunque no tienen ideología en el sentido moderno, tienen una [house_ambition|El] que afecta a cómo votan.\n\nTen en cuenta que no se requiere una $game_concept_republic$ para someterse a la diversidad y el desorden de una democracia. A medida que se aprueben las $game_concept_laws$, el equilibrio de poder entre la $game_concept_assembly$ y el $game_concept_ruler$ puede cambiar."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "Como la [assembly|El] a menudo está constituida por [patrician_families|El], sigamos con ellas."
 reactive_advice_republican_politics_open_families_prompt: "Abre la pestaña Familias (resaltada)"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "Estas son las [patrician_families|El] de la [republic|El].\n\nCada familia, incluida la tuya, tiene un [patrician_rating|El]. Al aumentar tus ingresos procedentes del [trade|El] y obtener asientos en la [assembly|El] o en el [council|El] del [ruler|El], tu $game_concept_patrician_rating$ aumenta.\n\nTener un $game_concept_patrician_rating$ alto aumenta los efectos de tu [house_ambition|El], ¡e incluso puede permitirte derrocar al gobierno!"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "El destino de la [republic|El] está en tus manos.\n\nDepende de ti darle forma. ¿Mantendrás el poder solo en manos de tu familia o lo compartirás con los demás?\n\nA medida que tu [patrician_rating|El] crezca con tus [trade_routes|El], también lo hará tu poder e influencia."
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "Aquí es donde puedes crear tus propias [distribution_routes|El].\n\nLas rutas de distribución te permiten transportar [trade_goods|El] para satisfacer [needs|El] en [markets|El] dentro de tu mismo [realm|El]."
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "Si bien una [distribution_route|El] puede transportar cualquier volumen de [trade_goods|El], solo puede transportar los artículos que se consideren [basic_trade_goods|El], que aparecen aquí.\n\nPor lo tanto, no tienes que elegir qué $game_concept_trade_good$ transportar.\n\n#I Puedes elegir cualquier mercadería básica para ver su [market_balance|El] en el mapa#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "En el mapa, bajo el nombre de cada [market|El], puedes ver qué [basic_trade_goods|El] tienen [surplus|El]. Lo cual significa que puedes sacar artículos de ahí."
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "Y, a su vez, también se ven todas las [needs|El] no satisfechas. Lo cual significa que puedes transportar [basic_trade_goods|El] a este [market|El]."
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "Una [distribution_route|El] solo puede conectar dos [markets|El], y los [goods|El] viajan en ambas direcciones.\n\nEn cuanto hayas añadido dos mercados a la ruta, verás en la ventana resaltada cómo se satisfacen las [needs|El].\n\nDado que la ruta discurre por tu [realm|El], no tienes que pagar ni el [buy_price|El] ni tampoco [tolls|El].\n\n#I Para añadir o quitar un mercado de la ruta, haz clic en el mapa#!"
