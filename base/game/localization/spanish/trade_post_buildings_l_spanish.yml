 building_type_trade_mercenary_office_01_desc: "Los capitanes de las compañías de mercenarios acuden a esta oficina para regatear por los salarios, las condiciones y su parte del saqueo. Toda cláusula queda por escrito, ya que nadie se fía de nadie."
