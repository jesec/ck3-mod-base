 building_type_trade_watchtower_01: "Atalaya"
 building_type_trade_watchtower_01_desc: "Desde lo alto de esta atalaya, los guardias pueden ver a muchos kilómetros de distancia. Principalmente vigilan las puertas de los almacenes."
