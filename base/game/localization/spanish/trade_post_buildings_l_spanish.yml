 building_type_trade_secure_storeroom_01_desc: "Las celdas de almacenamiento guardan los artículos más valiosos del puesto comercial, y a los guardias se les paga bien para mantener a los ladrones alejados. Incluso un poco más para que no sean demasiado curiosos."
