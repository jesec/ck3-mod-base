 ##### Trade Post District #####
 trade_post_location_district: "Distrito de puesto comercial"
 trade_post_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E] [trade_goods_i]\n$BULLET_WITH_TAB$[trade_market|E] @trade_market_icon!\n$BULLET_WITH_TAB$[gold|E] [gold_i]\n$BULLET_WITH_TAB$[alliance|E] [alliance_i]\n\n#low Desbloquea#!\n$BULLET_WITH_TAB$Permite que las [trade_routes|El] @trade_route_icon! comiencen en este [trade_market|El] @trade_market_icon!"
 trade_post_location_district_desc_flavor: "Un enorme complejo para el comercio, que sirve para que los ciudadanos de la república y los patricios ricos comercien con sus artículos y servicios."
 # Trade Office #
 building_type_pb_trade_office_01: "Oficina de comercio"
 building_type_pb_trade_office_01_desc: "Los funcionarios de la oficina de comercio registran cada carga, sellan cada contrato y envían informes a casa en cada barco."
