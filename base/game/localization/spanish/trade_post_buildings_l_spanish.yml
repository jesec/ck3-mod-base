 # Treasury #
 building_type_trade_treasury_01: "Oficina de tesorería"
 building_type_trade_treasury_01_desc: "Las monedas de decenas de territorios pasan por esta oficina de tesorería, donde se pesan y se tasan comparándolas con el resto. El tesorero sabe si una moneda es falsa solo por su tintineo."
