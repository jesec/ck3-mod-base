 doctrine_parameter_tenet_reincarnation_piety_level_courage: "Con un [piety_level|El] 3 o superior, ganas el rasgo [GetTrait('brave').GetName( GetNullCharacter )] o pierdes el de [GetTrait('craven').GetName( GetNullCharacter )]"
