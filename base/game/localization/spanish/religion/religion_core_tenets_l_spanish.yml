 tenet_sacred_shadows_name: "Mentiras sagradas"
 tenet_sacred_shadows_desc: "Mentir es el arte más profundo que existe. Quienes convencen a otros de sus mentiras son sagrados. Aquellos que consiguen engañarse a sí mismos son imparables."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Los practicantes ganan piedad por completar [schemes|lE] de [intrigue|lE]"
 doctrine_parameter_adherents_more_likely_to_join_schemes: "Los practicantes están más dispuestos a convertirse en agentes en las [schemes|lE] de otros personajes"
 doctrine_parameter_tenet_sacred_shadows_fabricate_hook: "Puedes usar la [scheme|El] [GetScheme('fabricate_hook').GetTypeName]"
 doctrine_parameter_tenet_sacred_shadows_intrigue_scheme_fulfillment: "Ganas [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por completar con éxito [schemes|El] de [intrigue|El]"
 tenet_pursuit_of_power_name: "Búsqueda del poder"
 tenet_pursuit_of_power_desc: "Lo justo o injusto de algo es pasajero, definido por aquellos que tienen el poder en cada momento. Esto significa que la búsqueda del poder es la única causa verdaderamente justa."
 doctrine_parameter_tenet_pursuit_of_power_war_victory_fulfillment: "Ganar guerras proporciona [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_pursuit_of_power_become_conqueror: "Desbloquea la [decision|El] $pursue_conquerors_mantle_decision$"
 tenet_pastoral_isolation_name: "Aislamiento pastoral"
 tenet_pastoral_isolation_desc: "Solo queremos que nos dejen en paz. Nuestras prácticas son nuestras y no son más asunto de nadie que las suyas de nosotros."
 doctrine_parameter_unattractive_for_character_conversions: "Los [characters|lE] están más dispuestos a dejarse convertir desde esta [faith|lE]"
 tenet_natural_primitivism_name: "Primitivismo natural"
 tenet_natural_primitivism_desc: "La civilización es antinatural, un intento inútil y blasfemo del hombre de imponer orden en una creación inherentemente anárquica. Nos despojamos de vestiduras, rangos, leyes y vanidades cortesanas para vivir como [ROOT.Rite.GetFaith.PantheonTerm] nos quiso: salvajes, sencillos y libres."
 doctrine_parameter_naked_adherents_active: "Los practicantes no llevan ropa"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Coste de leyes: #N +50%#!"
 doctrine_parameter_tenet_natural_primitivism_promote_naturism_decision: "Desbloquea la [decision|El] #V Adoptar la libertad natural#!"
 doctrine_parameter_unlock_jizya_contract: "Desbloquea el [vassal_contract|lE] y [tax_decree|lE] de yizia"
 #FP3 tenets
 tenet_communal_possessions_name: "Posesiones comunales"
 tenet_communal_possessions_desc: "[ROOT.Rite.GetFaith.HighGodName] quiso que todos nosotros tuviéramos una parte equitativa en los recursos de la tierra. Deberíamos tener todas las cosas en común y redistribuir la riqueza robada de los poderosos."
 doctrine_parameter_piety_from_gifts_active: "Gana [piety|El] @piety_icon! al enviar [gifts|El] y regalar [artifacts|El]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Los gobernantes ganan [piety|El] @piety_icon! al casarse con [characters|El] [lowborn|El] y no pierden [legitimacy|El] @legitimacy_icon! por ello"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "Desbloquea la [decision|El] $redistribute_realm_wealth_decision$"
 tenet_sacrificial_ceremonies_name: "Ceremonias de sacrificios"
 tenet_sacrificial_ceremonies_desc: "El sacrificio humano, tanto voluntario como involuntario, nos acerca a lo divino. Es tradicional y virtuoso que alguien se ofrezca voluntario para sacrificarse en la ceremonia. Igualmente virtuoso es sacrificar a quienes han cometido crímenes imperdonables contra los dioses."
 tenet_megaliths_name: "Construcciones megalíticas"
 tenet_megaliths_desc: "El culto no debe confinarse solo a los templos, construcciones primitivas de los hombres que los distraen de las creaciones divinas que nos rodean a todos. Abrazamos la piedra y el aire libre disponiendo las rocas que el Creador nos dio, de forma que le complazca y nos acerque a la divinidad."
 doctrine_parameter_can_build_megaliths: "Permite la construcción de megalitos en posesiones [Concept( 'temple', 'consagradas' )|E] y grandes megalitos en las capitales ducales."
 doctrine_parameter_tenet_megaliths_building_poi_double_rewards: "Duplica las recompensas de experiencia por visitar [points_of_interest|El] que son [buildings|El]"
 doctrine_parameter_tenet_megaliths_rough_terrain_construction_fulfillment: "Ganas [spiritual_fulfillment|El] @spiritual_fulfillment_icon! al completar construcciones en [GetTerrain( 'hills' ).GetName|l], [GetTerrain( 'terraced_hills' ).GetName|l], [GetTerrain( 'mountains' ).GetName|l] o [GetTerrain( 'desert_mountains' ).GetName|l]"
 pam_megaliths_rough_terrain_construction_toast: "Por tu dogma personal [GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )]"
 province_is_of_a_megalith_faith_tt: "Este [county|lE] debe seguir una [faith|lE] que crea en la importancia de los megalitos."
 tenet_fp3_fedayeen_name: "Fedaiyín"
 tenet_fp3_sacred_murder_name: "Asesinato sagrado"
 tenet_fp3_fedayeen_desc: "Cuando la guerra ordinaria no es posible, es nuestro deber ante [ROOT.Rite.GetFaith.HighGodNameAlternate] destruir a Sus enemigos mediante infiltración y engaño. No hemos de temer la muerte ni el dolor, y entregaremos nuestras vidas con entusiasmo por una causa mayor."
 doctrine_parameter_master_assassin_court_position_unlocked: "Desbloquea el [court_position|lE] #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()|l]#!"
 master_assassin_court_position_unlocked_name: "$tenet_fp3_fedayeen_name$"
 doctrine_parameter_death_is_glory: "Probabilidad de muerte o heridas en [battle|lE]: #N +10 %#!"
 doctrine_parameter_sanctioned_assassinations: "No se pierde [piety|lE] por matar personajes de una [faith|lE] diferente mediante las [schemes|lE] de [GetScheme('murder').GetTypeName|l]"
 doctrine_parameter_tenet_fp3_fedayeen_other_faith_kill_fulfillment: "Ganas [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por matar [characters|El] de otra [faith|El]"
 #EP3 Tenets
 tenet_household_gods_name: "Dioses de la casa"
 tenet_household_gods_desc: "Veneramos a nuestros #EMP lares#! y los #EMP genii#!: los espíritus protectores que cuidan de nuestras moradas. Por encima de todo, honramos a nuestro glorioso emperador, cuya alma está encargada de cuidar del señorío."
 #BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ para [temple_holdings|lE]"
 #TGP
 immaterial_harmony_name: "Armonía inmaterial"
 special_doctrine_immaterial_harmony_name: "Armonía inmaterial"
 special_doctrine_immaterial_harmony_desc: "No hay conflicto entre nuestras tradiciones y las enseñanzas de Buda o los sabios. Uno puede practicar cualquiera de ellas, o incluso todas a la vez, sin problema espiritual alguno."
 tenet_extinction_of_dharma_name: "Extinción del dharma"
 tenet_extinction_of_dharma_desc: "Los demonios recorren la tierra bajo el disfraz de piadosos y devotos; quien mate a uno dará un paso para convertirse en Buda, quien mate a diez dará diez pasos para convertirse en Buda."
 tenet_cranial_trophies_name: "Trofeos de cráneos"
 tenet_cranial_trophies_desc: "La cabeza contiene la quintaesencia de su propietario. Si la cortamos y extraemos sus contenidos, podemos reclamar para nosotros su poderosa energía espiritual."
 doctrine_parameter_killing_bestows_heads: "Es posible conseguir un [artifact|lE] trofeo craneal al [executing|lE] a otro personaje, matarlo en un [single_combat_duel|lE] o abatirlo en [battle|lE]"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "Cuando se gane un [artifact|El] de trofeo craneal, el asesino obtendrá [piety|El] @piety_icon! adicional en proporción al [prestige|El] @prestige_icon! del difunto"
 doctrine_parameter_tenet_cranial_trophies_spiritual_fulfillment_from_trophies: "Cuando ganas un [artifact|El] de trofeo craneal, también obtienes [spiritual_fulfillment|El] @spiritual_fulfillment_icon! en proporción al [prestige|El] @prestige_icon! del difunto"
 tenet_benevolent_governance_name: "Gobernanza benevolente"
 tenet_benevolent_governance_desc: "Quienes gobiernan sobre las masas tienen el deber moral de promover lo bueno y abjurar de lo malo. Solo adhiriéndose a este principio puede ser un gobernante justo de verdad."
 tenet_filial_piety_name: "Piedad filial"
