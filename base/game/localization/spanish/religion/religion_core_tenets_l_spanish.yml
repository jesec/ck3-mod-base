 tenet_religious_legal_pronouncements_halakha: "Halajá"
 tenet_religious_legal_pronouncements_desc: "La frontera entre argumentos legales y teológicos es fina y en los acuerdos seculares pueden y deben ser tenidas en cuenta las cualidades espirituales. Un gobernante puede buscar la condena religiosa de cualquier [vassal|El] directo adulto de la misma [religion|El], pero el resultado depende del [learning|El] del gobernante y el historial moral del vasallo."
