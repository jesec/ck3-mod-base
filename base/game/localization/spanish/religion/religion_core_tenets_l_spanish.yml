 doctrine_parameter_tenet_esotericism_eccentric_bonuses: "El [trait|El] [GetTrait('eccentric').GetName( GetNullCharacter )] otorga [piety|El] @piety_icon! extra y [opinion|El], y cuesta menos [stress|El]"
