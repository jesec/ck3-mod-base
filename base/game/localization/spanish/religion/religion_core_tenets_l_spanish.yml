 tenet_islamic_syncretism_name: "Sincretismo islámico"
 tenet_islamic_syncretism_desc: "Las palabras del Profeta son indudablemente sabias y, independientemente de nuestras otras dudas, deberíamos tener en cuenta sus palabras y actos."
 doctrine_parameter_islamic_syncretic_actor_opinion_active: "Bonificación mutua de $VALUE|=+0$ de [opinion|El] con [faiths|El] que tienen el [core_tenet|El] $tenet_islamic_syncretism_name$"
