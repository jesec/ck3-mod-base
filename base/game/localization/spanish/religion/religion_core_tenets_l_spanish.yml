 doctrine_parameter_tenet_mystical_birthright_blessed_marks_grave: "Los [characters|El] con los rasgos [GetTrait('bleeder').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )] o [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] ganan #P +4#! de [learning|El], #P +20 %#! de [toughness|El] de [men_at_arms|El], #P +30 %#! de [legitimacy|El] @legitimacy_icon!, #P +20#! de [dread|El] y #P +15#! de [opinion|El] del [clergy|El]"
