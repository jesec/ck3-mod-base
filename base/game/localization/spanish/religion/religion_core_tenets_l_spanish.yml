 tenet_sinitic_syncretism_name: "Sincretismo sinítico"
 tenet_sinitic_syncretism_desc: "Podemos aprender de las antiguas religiones siníticas. Durante siglos y milenios han inspirado un estilo de vida noble y un buen sentido moral."
