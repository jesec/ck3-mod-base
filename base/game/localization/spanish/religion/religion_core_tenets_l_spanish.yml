l_spanish:
 doctrine_core_tenets_name: "Dogmas"
 tenets_name: "Dogmas"
 #Abrahamic Tenets
 tenet_communion_name: "Comunión"
 tenet_communion_desc: "Nuestros rituales no son meramente simbólicos, sino que invocan la presencia misma de lo divinidad. Quienes no pueden o no se unen a nosotros en la práctica de estos no pueden ser verdaderos creyentes."
 doctrine_parameter_tenet_communion_denied_sacrament: "Los [characters|El] [Concept('excommunicated', 'excomulgados')|El] de este [rite|El] sufren un #N -25 %#! de ganancia de [piety|El] @piety_icon! y #N -10#! de [opinion|El] de la misma fe"
 doctrine_parameter_tenet_communion_shared_table: "Celebrar un [GetActivityType('activity_feast').GetName|l] proporciona #P +10#! de [opinion|El] con cada invitado de la misma [faith|El]"
 doctrine_parameter_excommunication_active: "Los [heads_of_faith|lE] espirituales pueden [excommunicate|lE] a otros personajes de su [faith|lE]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "Los personajes de este [rite|lE] pueden tomar la [decision|El] [GetDecisionWithKey('pam_decision_last_rites').GetName]"
 doctrine_parameter_seek_indulgences_active: "Los personajes de este [rite|El] pueden usar la [interaction|El] #high $seek_indulgences_interaction$#!, siempre que la [faith|El] tenga un [head_of_faith|El] o [clerical_regions|El]"
 tenet_armed_pilgrimages_name: "Peregrinaciones armadas"
 tenet_armed_pilgrimages_desc: "Nuestros peregrinos atraviesan el mundo para visitar nuestros lugares sagrados y nosotros tomaremos la espada con mucho gusto para protegerlos de quienes quieran hacerles daño."
 doctrine_parameter_cheaper_holy_wars_active: "A los [rulers|El] de este [rite|El] les cuesta #P -20 %#! menos [piety|El] @piety_icon! declarar [holy_wars|El]."
 doctrine_parameter_great_holy_wars_active: "Si existe, el [head_of_faith|lE] puede declarar una [great_holy_war|lE]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "A falta de [head_of_faith|lE], los practicantes obtienen una bonificación a la [councillor_task|lE] de [convert_county|lE] por cada [holy_site|lE] que se controla"
 doctrine_parameter_pilgrimage_decision_active: "Los personajes de este [rite|El] ganan una bonificación extra al terminar con éxito una [pilgrimage|lE]"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[Concept('leasing', 'Arrendar')|E] [holdings|El] a [holy_orders|El] da [spiritual_fulfillment|El] @spiritual_fulfillment_icon! adicional"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "Monacato"
 tenet_monasticism_desc: "Los placeres de la buena comida y bebida solo sirven para distraernos de servir a la divinidad. Aislarnos en monasterios remotos es el mejor modo de evitar tales tentaciones."
 doctrine_parameter_take_vows_active: "Los [courtiers|lE] pueden hacer los votos y convertirse en [GetTrait('devoted').GetName( GetNullCharacter )]."
 doctrine_parameter_devoted_trait_criminal: "El rasgo [GetTrait('devoted').GetName( GetNullCharacter )] es [Concept('criminal', 'delictivo')|E]"
 doctrine_parameter_cannot_take_the_vows: "Los personajes de este [rite|El] no pueden usar la [character_interaction|El] #high $take_vows_interaction$#!"
 tenet_divine_marriage_name: "Matrimonio divino"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "Al casarnos con parientes cercanos, imitamos las uniones sagradas de los primeros seres de la creación. Las buenas cualidades se transmitirán por linaje familiar y así ganaremos pureza y favor en la eterna batalla contra el mal."
 doctrine_parameter_divine_marriage_opinion: "Los practicantes casados con un miembro de su [close_family|lE] tienen [opinion|lE] $VALUE|0+=$ de [vassals|lE] con la misma [faith|lE]."
 doctrine_parameter_divine_marriage_piety_gain_active: "La bonificación matrimonial [GetDoctrineType('doctrine_monogamy').GetBaseName] también proporciona una gran cantidad de [piety|El] @piety_icon! si te casas con un miembro de tu [close_family|El]"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "Contribución de [skills|El] por [Concept( 'councillor_tasks', 'tareas como consejero' )|E] de [spouse|lE]: #P +25 %#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Los practicantes son menos propensos a crear o unirse a [factions|El] contra un [liege|El] que esté casado con su [close_family|El] o su [extended_family|El]"
 tenet_pacifism_name: "Pacifismo"
 tenet_pacifism_desc: "La violencia es un acto abominable que solo lleva al sufrimiento, dolor y remordimiento. Si intentamos evitarla siempre que sea posible, podremos construir sociedades más fuertes y seguras donde vivan los fieles. Los condados pacifistas crecen y prosperan bajo esta pacífica orden."
 doctrine_parameter_holy_wars_forbidden: "No puede declarar ningún tipo de [Concept( 'holy_wars', 'guerra santa' )|E] ni [raid|lE]"
 doctrine_parameter_pacifist_opinion_active: "Opinión pacifista: $VALUE|+=0$"
 pacifist_opinion_name: "Compañero pacifista"
 pacifist_county_opinion_name: "Condado pacifista aliado"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[opinion|E] de otros pacifistas: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Los gobernantes en paz durante al menos dos años verán cambiar su [piety|El] @piety_icon! en $VALUE|+$ al mes"
 PIETY_LONG_PEACE: "Paz larga"
 tenet_vows_of_poverty_name: "Votos de pobreza"
 tenet_vows_of_poverty_desc: "El dinero corrompe los corazones de la gente y la aparta de la fe verdadera. Debemos rechazar la adquisición de riqueza material si queremos centrarnos en lo que de verdad importa, eligiendo actividades humildes y encontrando la piedad al llevarlas a cabo."
 doctrine_parameter_vows_of_poverty_active: "Los [rulers|El] pueden [decide|El] tomar el voto de pobreza, lo que reduce los ingresos de [tax|El], pero aumenta la ganancia mensual de [piety|El] @piety_icon!"
 tenet_human_sacrifice_name: "Sacrificio humano"
 tenet_human_sacrifice_desc: "El mejor modo de demostrar nuestra devoción es mediante el acto del sacrificio y lo más valioso que podemos sacrificar es la vida humana."
 doctrine_parameter_human_sacrifice_active: "Las [executions|El] proporcionan [piety|El] @piety_icon! en lugar de costar [piety|El] @piety_icon!"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "Las [executions|El] jamás cuestan [prestige|El] @prestige_icon! al [sharing_power|El]"
 doctrine_parameter_flower_war_cb_active: "Otorga el [casus_belli|lE] de [flowery_war|lE] contra señoríos vecinos de esta [faith|lE]"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "Las [executions|El] otorgan [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon! adicionales en función del [rank|El] y la [nobility|El] de la persona sacrificada"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Probabilidad notablemente mayor de capturar personajes durante [sieges|El]"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Mayor probabilidad de [imprison|El] a personajes sin tierras"
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Festivales truculentos"
 tenet_gruesome_festivals_desc: "Todos nacemos entre sangre. Sobrevivimos con la sangre de nuestro ganado, nuestra familia, nuestros enemigos. Es natural pues que [ROOT.Rite.GetFaith.PantheonTerm] reclame/n su parte."
 gruesome_festivals_active_name: "capacidad para celebrar grandes sacrificios"
 doctrine_parameter_gruesome_festivals_active: "Desbloquea la [activity|El] [GetActivityType('activity_gruesome_festival').GetName] una vez por década, lo que da [piety|El]@piety_icon! más [county_opinion|El] para súbditos de la misma [faith|El]"
 tenet_volcanic_veneration_name: "Veneración volcánica"
 tenet_volcanic_veneration_desc: "Pocas cosas hay más divinas que la tierra recién nacida que brota de las fosas ardientes de nuestro hogar. Nos pasamos la vida al borde del desastre, siempre a merced de [ROOT.Rite.GetFaith.PantheonTerm]."
 tenet_cthonic_redoubts_name: "Reductos ctónicos"
 tenet_cthonic_redoubts_desc: "No hay mejor refugio que las raíces de la Tierra, ni fortaleza más dura que sus espinas proyectadas, ni peregrinación más sagrada que sus senderos ocultos. Contemplamos la Creación desde estas elevadas cumbres y sentimos el verdadero peso de lo Divino."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Velocidad de [convert_county|lE] en ([terrain|lE]) de montaña: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0] %#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "Velocidad de [promote_culture|lE] en ([terrain|lE]) de montaña de la misma [faith|lE]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0] %#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Velocidad de [convert_county|lE] hostil en ([terrain|lE]) de montaña: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0] %#!"
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Suicidio ritual"
 tenet_consolamentum_desc: "Cuando envejecemos o enfermamos, realizamos un ritual para limpiar nuestras almas de pecados. Una vez hecho, terminamos nuestras vidas rápida y definitivamente para que el pecado no tenga la oportunidad de volver a infectarnos."
 doctrine_parameter_consolamentum_active: "Los practicantes pueden [decide|lE] terminar con sus vidas cuando sean ancianos, se vean incapaces o estén a punto de morir; hacerlo no acarreará ninguna de las penalizaciones normales del suicidio"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "Cuando un practicante muere por la [decision|El] [GetDecisionWithKey('initiate_consolamentum_decision').GetName], su heredero gana #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! de [piety|El] @piety_icon!"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Tu heredero gana #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! de [piety|El]@piety_icon! extra y $pam_blessed_passing_modifier$ durante #P 10#! años si mueres por la [decision|El] [GetDecisionWithKey('initiate_consolamentum_decision').GetName]"
 tenet_gnosticism_name: "Gnosticismo"
 tenet_gnosticism_desc: "Mediante el conocimiento, la chispa divina que reside dentro de todos los humanos puede liberarse y volver a su fuente celestial en el reino de los espíritus."
 doctrine_parameter_granting_titles_gives_stress: "Conceder [titles|lE] alivia [stress|lE]"
 tenet_mendicant_preachers_name: "Predicación mendicante"
 tenet_mendicant_preachers_desc: "Nuestros misioneros viajan por todas partes sin nada más que la ropa que llevan puesta. Viven de la generosidad de aquellos a los que visitan y, a cambio, comparten el conocimiento de la fe verdadera."
 doctrine_parameter_mendicant_preachers_conversion_active: "Velocidad de conversión del condado: #P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Convertir a un [character|El] otorga [spiritual_fulfillment|El] @spiritual_fulfillment_icon! adicional"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "Es más probable que se tenga éxito al influir en [characters|El] de otra [faith|El]"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Los invitados de otra [faith|El] a tus [activities|El] se pueden convertir a la tuya"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Activa la [interaction|El] #V $attempt_conversion_of_local_ruler_interaction$#! con [rulers|El] en tu [location|El] actual"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Permite la [travel_option|El] [GetTravelOption('adventurers_proselytize_zealously_option').GetName] sin el [perk|El] [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)]"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U] se convierte al [first.GetFaith.GetName|l]"
 must_be_in_same_county_tt: "Debes estar en un [county|E] que posea"
 tenet_communal_identity_name: "Identidad comunal"
 tenet_communal_identity_desc: "Nuestra fe y cultura están intrínsecamente unidas. Esta práctica refuerza los vínculos de nuestra comunidad, aunque tiende a excluir a los extranjeros."
 doctrine_parameter_same_communal_identity_opinion_active: "#P +10#! de [opinion|lE] con personajes de la misma [faith|lE]"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "Convencer a una facción en un [ecumenical_council|El] no cuesta [prestige|El] @prestige_icon!"
 doctrine_parameter_tenet_communal_identity_sway_piety: "#P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! de [piety|El] [piety_i] cada vez que tengas éxito al [GetScheme('sway').GetTypeName|l] a alguien de tu mismo [rite|El]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "[scheme_success_chance|E] de [GetScheme('learn_language').GetTypeName] contra objetivos de tu mismo [rite|El]: #P +20 %#! [success_chance_i]"
 doctrine_parameter_tenet_communal_identity_language_reward: "Aprender el [language|El] de alguien de tu mismo [rite|El] concede [piety|El] @piety_icon! y [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 doctrine_parameter_same_culture_conversion_bonus_active: "Velocidad de conversión en [counties|lE] de mi [culture|lE]: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Velocidad al promover cultura en [counties|lE] de mi [faith|lE]: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Velocidad de conversión en [counties|lE] de una [culture|lE] distinta: #N -50%#!"
 tenet_pentarchy_name: "Eclesiarquía"
 tenet_pentarchy_alternate_name: "La pentarquía"
 tenet_pentarchy_desc: "Nuestros lugares sagrados son más que meros sitios santos: son las sedes de poder desde las cuales gobiernan nuestros líderes religiosos."
 tenet_aniconism_name: "Aniconismo"
 tenet_aniconism_desc: "Adorar imágenes talladas ha cegado a demasiada gente de la verdad divina. Desterraremos todos los iconos de nuestros lugares sagrados para que nuestros fieles no caigan en esa trampa."
 doctrine_parameter_reforging_artifacts_costs_piety: "Los [rulers|El] de este [rite|El] deben gastar [piety|El] @piety_icon! para [reforge|El] o [repair|El] [artifacts|El]"
 doctrine_parameter_destroying_artifacts_is_pious: "Los [rulers|El] de este [rite|El] pueden destruir [artifacts|El] a cambio de [piety|El] @piety_icon!"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Puedes destruir [artifacts|El] a cambio de [piety|El] @piety_icon!"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Al asediar, los [rulers|El] de una [faith|El] sin este [core_tenet|El] destruyen más [development|El], dañan [artifacts|El] más a menudo y reciben [piety|El] @piety_icon!"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Ganas [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por destruir [artifacts|El] y por asedios contra una [faith|El] sin este [core_tenet|El]"
 pam_aniconism_siege_toast: "Por tu [personal_tenet|El] [GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]"
 destroying_artifacts_is_not_pious_tt: "Tu [rite|El] no puede destruir [artifacts|El] a cambio de [piety|El]"
 artifact_is_rarer_than_masterwork_tt: "Este [artifact|lE] tiene una [rarity|lE] mayor que obra maestra"
 tenet_alexandrian_catechism_name: "Catecismo alejandrino"
 tenet_alexandrian_catechism_desc: "La escuela catequística de Alejandría tenía una vasta tradición de alentar a los teólogos a pensar de manera crítica y cuestionar el statu quo.\n\nY nosotros, pese la destrucción física de la escuela, continuamos con estas tradiciones."
 tenet_islamic_rationalism_name: "Racionalismo islámico"
 tenet_islamic_rationalism_desc: "Dado que [ROOT.Rite.GetFaith.HighGodNameAlternate] es justicia y sabiduría, no puede ir en contra de la razón ni desatender el bienestar de Su creación. Solo mediante una razón sin ayudas podremos esperar comprender nuestra parte en Su gran obra y distinguir el bien del mal."
 doctrine_parameter_scholasticism_is_holy: "El [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] otorga bonificaciones adicionales"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Los niños educados con el [education_focus|El] [learning|E] pueden alcanzar la mayoría de edad con [experience|El] en [learning_lifestyle|El], y más a menudo cuanto mayor sea tu nivel de estudios"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "Velocidad de conversión del condado: #P +25 %#!"
 tenet_hedonistic_name: "Hedonismo"
 tenet_hedonistic_desc: "La divinidad llenó este mundo con un abundancia de placeres para que nos entreguemos y disfrutemos. No participar de tales cosas es rechazar la obra misma de la Creación."
 doctrine_parameter_piety_from_feasts_active: "Celebrar un [GetActivityType('activity_feast').GetName|l] gana [piety|El] @piety_icon!"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" #Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "Celebrar un [GetActivityType('activity_festival').GetName|l] gana [piety|El] @piety_icon!"
 tenet_carnal_exaltation_name: "Exaltación carnal"
 tenet_carnal_exaltation_desc: "Los placeres de la carne son sublimes de un modo que transciende otras experiencias terrenales y nos acerca a la divinidad. Debemos glorificar nuestros deseos sexuales y buscar oportunidades para realizarlos."
 doctrine_parameter_piety_from_seduction_active: "Ganas [piety|El] @piety_icon! por [schemes|El] de [GetScheme('seduce').GetTypeName|l] exitosas"
 doctrine_parameter_tenet_carnal_exaltation_clergy_no_continence: "No se espera que el [clergy|El] de este [rite|El] se abstenga de las relaciones carnales"
 doctrine_parameter_tenet_carnal_exaltation_deviancy_virtuous: "Permite a la [faith|El] elegir la [doctrine|El] [GetDoctrineType('doctrine_deviancy_virtuous').GetBaseName]"
 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "Los [characters|El] con los rasgos [GetTrait('lustful').GetName( GetNullCharacter )], [GetTrait('rakish').GetName( GetNullCharacter )] o [GetTrait('deviant').GetName( GetNullCharacter )] ganan #P +2#! de [intrigue|El], #P +2#! de [diplomacy|El] y #P +25 %#! de [fertility|El] por rasgo"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "Los [characters|El] con los rasgos [GetTrait('lustful').GetName( GetNullCharacter )], [GetTrait('rakish').GetName( GetNullCharacter )] o [GetTrait('deviant').GetName( GetNullCharacter )|l] terminan las [schemes|El] de [GetScheme('seduce').GetTypeName|l] #P 20#! días más rápido por rasgo"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "Puedes crear artefactos depravados usando la [decision|El] [GetDecisionWithKey('commission_artifact_decision').GetName]"
 tenet_polyamory_name: "Poliamor"
 tenet_polyamory_desc: "Nuestro amor mutuo debe ser tan incondicional como el amor de [ROOT.Rite.GetFaith.FertilityGodName] hacia nosotros. Debemos expulsar las anticuadas ideas de que una persona es dueña del afecto de otra."
 doctrine_parameter_no_unfaithfulness_penalty_active: "Los practicantes no reciben penalizaciones de [opinion|lE] ni [imprisonment_reasons|lE] para su cónyuge o los amantes de su cónyuge por tener relaciones extramaritales"
 doctrine_parameter_tenet_polyamory_romance_seduction_scheme_bonus: "[scheme_success_chance|E] de [GetScheme('courting').GetTypeName|l] y [GetScheme('seduce').GetTypeName|l]: #P +35 %#! [success_chance_i]"
 doctrine_parameter_tenet_polyamory_romance_seduction_fulfillment: "Pierdes [stress|El] y ganas [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por tener éxito en [schemes|El] de [GetScheme('courting').GetTypeName|l] y [GetScheme('seduce').GetTypeName|l]"
 doctrine_parameter_tenet_polyamory_new_beloved: "Conseguir un [lover|El] o un [soulmate|El] concede #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! de [spiritual_fulfillment|El] @spiritual_fulfillment_icon!, #P 20#! menos de [stress|El] y #V 5#! años de [GetModifier('tenet_polyamory_new_beloved_modifier').GetNameWithTooltip], al menos una vez al año"
 tenet_polyamory_new_beloved_toast: "Por tu [personal_tenet|El] de [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )|l]"
 doctrine_parameter_tenet_carnal_exaltation_seduction_fulfillment: "Pierdes [stress|El] y ganas [spiritual_fulfillment|El] @spiritual_fulfillment_icon! por tener éxito en [schemes|El] de [GetScheme('seduce').GetTypeName|l]"
 tenet_unrelenting_faith_name: "Fe constante"
 tenet_unrelenting_faith_desc: "Nuestras convicciones son fuertes y con placer lucharemos y moriremos por nuestra fe. No importa lo malas que sean las oportunidades en nuestra contra, no nos rendiremos."
 tenet_unrelenting_faith_zandik_name: "Rebelión justa"
 tenet_unrelenting_faith_zandik_desc: "No deseamos dañar a nada ni a nadie, pero si nuestras costumbres se ven amenazas, las defenderemos con una ferocidad implacable."
 tenet_rite_name: "Rito"
 tenet_rite_desc: "Nuestras creencias no son muy diferentes de las de nuestra fe materna… ¿Por qué deberíamos discutir sobre los detalles cuando estamos de acuerdo en los principales puntos de la doctrina y, sobre todo, en la autoridad final de arbitraje?"
 doctrine_parameter_maintains_head_of_faith_on_creation: "Al crearse, las nuevas [faiths|lE] mantienen al antiguo [head_of_faith|lE]"
 doctrine_parameter_ecumenical_christians_keep_ecumenism: "[GetPlayer.Custom('GetRiteEcumenismFullOrEmpty')]"
 GetRiteEcumenismFullOrEmpty_full: "Las [faiths|El] cristianas con la doctrina [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName] la conservan al crearse"
 GetRiteEcumenismMiaphysiteFullOrEmpty_full: "Las [faiths|El] cristianas con la doctrina [GetDoctrineType('special_doctrine_ecumenical_miaphysite').GetBaseName] la conservan al crearse"
 GetRiteEcumenismFullOrEmpty_empty: ""
 #Muslim Tenets
 tenet_struggle_submission_name: "Lucha y sumisión"
 tenet_struggle_submission_desc: "La voluntad divina es la fuente de todo bien, así que una buena existencia se basa en la sumisión a esta voluntad, expresada mediante la lucha para ejecutarla."
