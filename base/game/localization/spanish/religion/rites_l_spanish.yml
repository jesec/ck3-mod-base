 roman_rite: "Rito romano"
 roman_rite_adj: "cristiana romana"
 roman_rite_adherent: "cristiano romano"
 roman_rite_adherent_plural: "cristianos romanos"
 roman_rite_desc: "El rito romano es la tradición litúrgica de la Iglesia de Roma, moldeada por la teología latina y la autoridad jurídica, y que pone el foco en la disciplina sacramental, la jerarquía eclesiástica y la unidad institucional."
 insular_celtic: "Insularismo"
 insular_celtic_adj: "insular"
 insular_celtic_adherent: "insularista"
 insular_celtic_adherent_plural: "insularistas"
 insular_celtic_desc: "Una iglesia rural que se alejó de la ortodoxia católica romana hace siglos, el rito insular ha perdido muchas de sus antiguas características únicas por presión de la Iglesia madre. Sin embargo, sigue dando gran importancia a la penitencia y el monacato e incorpora muchas costumbres matrimoniales tradicionales celtas ajenas a la cristiandad más extendida."
 insular_celtic_religious_head_title: "Archiabad"
