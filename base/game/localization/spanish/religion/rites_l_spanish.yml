 mozarabic_church: "Mozarabismo"
 mozarabic_church_adj: "mozárabe"
 mozarabic_church_adherent: "mozárabe"
 mozarabic_church_adherent_plural: "mozárabes"
 mozarabic_church_desc: "Descendiente de los primeros ritos ibéricos, el rito mozárabe ha mantenido una cierta independencia respecto a Roma debido a los siglos bajo dominio islámico. Su larga convivencia con otros credos ha hecho que sus miembros acepten más las diferencias que las sectas más fundamentalistas."
 ambrosian_rite: "Rito ambrosiano"
 ambrosian_rite_adj: "ambrosiana"
 ambrosian_rite_adherent: "cristiano ambrosiano"
 ambrosian_rite_adherent_plural: "cristianos ambrosianos"
 ambrosian_rite_desc: "El rito ambrosiano, propio de la archidiócesis de Milán desde los tiempos de su gran obispo, san Ambrosio, conserva su propia liturgia y canto litúrgico, así como una tradición teológica que valora el pensamiento de san Agustín de Hipona."
 beneventan_rite: "Rito beneventino"
 beneventan_rite_adj: "beneventina"
 beneventan_rite_adherent: "cristiano beneventino"
 beneventan_rite_adherent_plural: "cristianos beneventinos"
 beneventan_rite_desc: "La tradición litúrgica del sur lombardo, centrada en Benevento y en la gran abadía de Montecassino. Su canto y ritos característicos la diferencian de la práctica romana, que observa este rito con creciente recelo."
 carolingian_christianity: "Cristianismo carolingio"
 carolingian_christianity_adj: "carolingia"
 carolingian_christianity_adherent: "carolingio"
 carolingian_christianity_adherent_plural: "carolingios"
 carolingian_christianity_desc: "Una forma de cristianismo que se desarrolló bajo el reinado de la dinastía carolingia, caracterizado por su énfasis en el monacato y el trabajo misionero."
 byzantine_rite: "Rito griego"
 byzantine_rite_adj: "cristiana griega"
 byzantine_rite_adherent: "cristiano griego"
 byzantine_rite_adherent_plural: "cristianos griegos"
 byzantine_rite_desc: "El patriarcado de Constantinopla es uno de los centros más significativos del cristianismo ortodoxo oriental, famoso por sus ricas tradiciones teológicas y su influencia histórica. El rito griego es producto directo del patriarcado."
 antiochian_rite: "Rito antioqueno"
 antiochian_rite_adj: "antioquena"
 antiochian_rite_adherent: "cristiano antioqueno"
 antiochian_rite_adherent_plural: "cristianos antioquenos"
 antiochian_rite_desc: "El patriarcado de Antioquía es una de las comunidades cristianas más antiguas, fundada por los apóstoles san Pedro y san Pablo. Su tradición siríaca oriental, denominada «jacobita» en honor a Jacobo Baradeo, quien reorganizó la Iglesia, defiende la doctrina miafisista y la antigua liturgia de Santiago."
 slavic_rite: "Rito eslavo"
 slavic_rite_adj: "eslava"
 slavic_rite_adherent: "cristiano eslavo"
 slavic_rite_adherent_plural: "cristianos eslavos"
 slavic_rite_desc: "Este rito, llevado al pueblo eslavo por Cirilo y Metodio, incorpora elementos de la liturgia bizantina adaptados a los idiomas y la cultura eslavos mediante el alfabeto glagolítico."
 georgian_rite: "Rito georgiano"
 georgian_rite_adj: "georgiana"
 georgian_rite_adherent: "georgiano"
 georgian_rite_adherent_plural: "georgianos"
 georgian_rite_desc: "El rito georgiano representa las tradiciones cristianas de Georgia, caracterizadas por su liturgia diferenciada, su herencia eclesiástica y sus fuertes vínculos con la teología y la práctica ortodoxa oriental."
 coptic_rite: "Coptismo"
 coptic_rite_adj: "copta"
 coptic_rite_adherent: "copto"
 coptic_rite_adherent_plural: "coptos"
 coptic_rite_desc: "La Iglesia copta, cuyos orígenes se remontan a san Marcos Evangelista, es famosa tanto por ser la cuna del monacato cristiano como por mantener una larga tradición promoviendo la educación y la filosofía."
 ethiopian_rite: "Ge'ez"
 ethiopian_rite_adj: "ge'ez"
 ethiopian_rite_adherent: "ge'ez"
 ethiopian_rite_adherent_plural: "cristianos ge'ez"
 ethiopian_rite_desc: "Concentrada en las tierras altas de Etiopía y basada en el legado de Aksum, esta antigua tradición cristiana se diferencia de otras iglesias alejandrinas por mantener un canon más extenso de escrituras, sus potentes tradiciones monásticas y una alianza conformada por una herencia real salomónica."
 armenian_rite: "Apostolismo"
 armenian_rite_adj: "apostólica"
 armenian_rite_adherent: "apostólico"
 armenian_rite_adherent_plural: "apostólicos"
 armenian_rite_desc: "Fundada por los apóstoles Bartolomé y Tadeo, la Iglesia apostólica armenia ganó rápidamente seguidores en la región y llevó al reino de Armenia a convertirse en el primer estado que adoptó el cristianismo como religión oficial."
 apostolic_religious_head_title: "Catolicós"
 apostolic_religious_head_title_plural: "Catolicói"
 apostolic_religious_head_title_name: "Iglesia"
 # Nabi
 nabi: "Nabi"
 nabi_adj: "nabi"
 nabi_adherent: "nabi"
 nabi_adherent_plural: "nabíes"
 nabi_desc: "Como se afirma explícitamente en el Sagrado Corán, nabi es aquel elegido por el Todopoderoso para entregar Su mensaje y recordar al pueblo el día en el que serán llamados a Su presencia y se les hará responsables de sus acciones. Según su creencia central, el profeta Mahoma fue el último de ellos."
 # Pre madhabs
 sahabah: "Sahaba"
 sahabah_adj: "sahaba"
 sahabah_adherent: "sahabi"
 sahabah_adherent_plural: "sahabíes"
 sahabah_desc: "También conocidos como los compañeros de Mahoma, fueron seguidores musulmanes que se encontraron con él o lo vieron en vida. Los compañeros desempeñaron un papel significativo en las primeras luchas, sociedad, narración de los hadices y gobernanza de los musulmanes."
 tabiun: "Tabi'un"
 tabiun_adj: "tabi'un"
 tabiun_adherent: "tabí"
 tabiun_adherent_plural: "tabi'un"
 tabiun_desc: "Se les describe como la generación de musulmanes que siguieron a los compañeros (sahaba) del profeta Mahoma y, por tanto, recibieron sus enseñanzas de segunda mano antes de la llegada de las escuelas suníes en siglos posteriores."
 # Sunni
 hanafi: "Hanafí"
 hanafi_adj: "hanafí"
 hanafi_adherent: "hanafí"
 hanafi_adherent_plural: "hanafíes"
 hanafi_desc: "Desarrollado a partir de las enseñanzas del jurista y teólogo Abu Hanifa, que sistematizó el uso del razonamiento. La teoría legal hanafí deriva principalmente de la ley de Corán, la sunna, el consenso erudito y el razonamiento analógico."
 hanbali: "Hanbalismo"
 hanbali_adj: "hanbalí"
 hanbali_adherent: "hanbalí"
 hanbali_adherent_plural: "hanbalíes"
 hanbali_desc: "La escuela hanbalí es la más pequeña de las cuatro escuelas principales de jurisprudencia islámica suní, basada en las enseñanzas de Ahmad ibn Hanbal. Al contrario que las otras, los hanbalíes se oponen a codificar la ley en un sistema integral, y recalca el Corán y los hadices como las fuentes superiores."
 maliki: "Malikismo"
 maliki_adj: "malikí"
 maliki_adherent: "malikí"
 maliki_adherent_plural: "malikíes"
 maliki_desc: "Una de las cuatro escuelas principales de jurisprudencia islámica del ámbito suní. Fue fundada por Malik ibn Anas en el siglo VIII. La malikí se diferencia de las otras escuelas de derecho suníes en las fuentes que emplea como origen para la resoluciones."
 shafii: "Shafi'i"
 shafii_adj: "shāfi‘í"
 shafii_adherent: "shāfi‘í"
 shafii_adherent_plural: "shāfi‘íes"
 shafii_desc: "Llamada así por al-Shafi'i, un erudito y jurista musulmán conocido como «el padre de la jurisprudencia musulmana» a principios del siglo IX. El núcleo de la escuela shāfi‘í es que a todo acto de un creyente sujeto a la ley le corresponde un estatuto en la Ley revelada o sharía."
 #Ismaili
 ismaili: "Ismailismo"
 ismaili_adj: "ismailí"
 ismaili_adherent: "ismailí"
 ismaili_adherent_plural: "ismailíes"
 ismaili_desc: "Un rito chií que considera que el linaje de los imanes verdaderos —aquellos imbuidos con conocimiento divino e infalibilidad— pasa por Ismail ibn Ya'far. También conocidos como septimanos, pues Ismail fue el séptimo imán tras Mahoma."
 #Qarmatians
 qarmatian: "Carmatanismo"
 qarmatian_adj: "cármata"
 qarmatian_adherent: "cármata"
 qarmatian_adherent_plural: "cármatas"
 qarmatian_desc: "Una rama del ismailismo que incorporó elementos del zoroastrismo. Dios predestinó el número de imanes a siete y por lo tanto no puede haber más imanes a partir del séptimo -Muhammad ibn Ismail- regresado para guiar a los fieles."
 #Nizari
 nizari: "Nizarismo"
 nizari_adj: "nizarí"
 nizari_adherent: "nizarí"
 nizari_adherent_plural: "nizaríes"
 nizari_desc: "Un rito racionalista que pone el énfasis en el razonamiento para interpretar el Corán y los hadices. Ser imán es hereditario y remontan la línea de sucesión hasta Alí."
 #Zayidi
 zayidi: "Zaidismo"
 zayidi_adj: "zaidiana"
 zayidi_adherent: "zaidiano"
 zayidi_adherent_plural: "zaidianos"
 zayidi_desc: "Un verdadero imán no es infalible, sino que se define por su lucha contra la corrupción y el mal. Por lo tanto, los zaidianos se definen por su creencia de que Zayd ibn Ali fue el legítimo sucesor del imanato, debido a su rebelión contra los omeyas."
 #Imamism (Twelver)
 imami: "Imamismo"
 imami_adj: "imaní"
 imami_adherent: "imaní"
 imami_adherent_plural: "imaníes"
 imami_desc: "Los imaníes creen que se profetizaron Doce imanes que guiarían a la umma y que el duodécimo, el Imán Zaman, está esperando para volver a dirigir a los musulmanes el Día del Juicio Final."
 islam_ayatollah: "ayatolá"
 islam_ayatollah_plural: "ayatolás"
 ghulat: "Ikhtilafismo"
 ghulat_adj: "ikhtilafí"
 ghulat_adherent: "ikhtilafí"
 ghulat_adherent_plural: "ikhtilafíes"
 ghulat_desc: "Los ikhtilafíes creen en la naturaleza divina de los imanes infalibles, empezando por Alí. Dios no solo los ha nombrado e inspirado, sino que habita en ellos parcialmente para guiar sus actos y, por extensión, a la umma."
 alawite: "Alauismo"
 alawite_adj: "alauita"
 alawite_adherent: "alauí"
 alawite_adherent_plural: "alauíes"
 alawite_desc: "Las enseñanzas religiosas alauitas son secretas, y el Corán es solo uno de sus textos sagrados. Además de la creencia en la sucesión de imanes a través de Ali, los alauíes también creen en la reencarnación, y que todos los seres son estrellas expulsadas del cielo que ahora deben volver a ganarse su lugar viviendo vidas sucesivas buenas y fieles."
 #Alevis
 alevi: "Alevismo"
 alevi_adj: "alevita"
 alevi_adherent: "alevita"
 alevi_adherent_plural: "alevíes"
 alevi_desc: "Los alevíes creen en la sucesión de los Doce imanes, pero también siguen muchas otras tradiciones, como se describe en su colección de textos sagrados, los buyruks. En la tradición alevita, Dios es la Verdad, y Mahoma y Ali son manifestaciones Suyas en el mundo."
 alevi_house_of_worship: "cemvi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural: "cemvis"
 alevi_religious_text: "Buyruks"
 alevi_religious_text_2: "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3: "$alevi_religious_text$" # Optional translation alt
 #Ibadi (Muhakkima)
 ibadi: "Harurí"
 ibadi_adj: "harurí"
 ibadi_adherent: "harurí"
 ibadi_adherent_plural: "harurís"
 ibadi_desc: "Los harurís creen que la comunidad islámica no necesita un califa o un imán si no hay un candidato apropiado. Rechazan la línea de sucesión de Alí y Abu Bakr como líderes legítimos y enfatizan una conducta y un consenso justos."
 #Azariqa
 azariqa: "Azraquismo"
 azariqa_adj: "azraquita"
 azariqa_adherent: "azraquita"
 azariqa_adherent_plural: "azraquitas"
 azariqa_desc: "Al reconocer que no había sucesores dignos de Mahoma, los azraquitas consideran su deber y derecho luchar contra cualquier líder que no respete y defienda los valores de su fe. De hecho, cualquier diferencia de interpretación de la fe será señal de ser infieles."
 #Najdat
 najdat: "Najdatismo"
 najdat_adj: "najdat"
 najdat_adherent: "najdatí"
 najdat_adherent_plural: "najdatíes"
 najdat_desc: "Los seguidores de la rama najdatí del jariyismo creen firmemente en el establecimiento del liderazgo musulmán mediante el consenso de los fieles. El líder no es infalible, sino que es elegido por Dios a través de la comunidad."
 #Sufri
 sufri: "Sufrismo"
 sufri_adj: "sufrí"
 sufri_adherent: "sufrí"
 sufri_adherent_plural: "sufríes"
 sufri_desc: "Los sufríes creen en la guía y el liderazgo divinos mediante la interpretación de la palabra de Dios, en lugar de la herencia. La voluntad de Dios se conoce como una expresión de la voluntad de la umma, siempre y cuando la gente de la umma esté bien versada en el Corán."
 #Hafizi
 hafizi: "Hafizismo"
 hafizi_adj: "hafizí"
 hafizi_adherent: "hafizí"
 hafizi_adherent_plural: "hafizíes"
 hafizi_desc: "Los hafizíes priorizan apoyar a quien consideran el verdadero califa por encima de todos los demás, así como resistir contra cualquier intento de destituirlo o destronarlo. Se definen en la derrota por haberse rebelado por una causa digna y, en la victoria, por su orgullosa adhesión a la voluntad de su líder."
