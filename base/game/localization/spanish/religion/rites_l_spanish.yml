 generic_tenet_focus_tenet_mystical_birthright: "[GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )] sostiene que el destino marca ciertas almas desde la cuna para el poder sagrado y la grandeza espiritual."
 generic_tenet_focus_tenet_ritual_celebrations: "[GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )] exalta las juergas comunales y los festejos santos como la más completa expresión del culto."
 generic_tenet_focus_tenet_sacred_childbirth: "[GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )] envuelve la llegada de los niños con respeto y trata la maternidad y la nueva vida como actos de significancia sagrada."
 generic_tenet_focus_tenet_sanctity_of_nature: "[GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )] halla lo divino en el mundo viviente y venera el crecimiento, la fertilidad y la creación indómita."
 generic_tenet_focus_tenet_sun_worship: "[GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )] venera el disco llameante del cielo como símbolo vital inspirador de orden, esplendor y favor divino."
 generic_tenet_focus_tenet_warmonger: "[GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )] glorifica la conquista y el vigor marcial y espera que los fieles se pongan a prueba en la batalla."
 generic_tenet_focus_tenet_gruesome_festivals: "[GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )] abraza unos festivales horribles que convierten el miedo, la sangre y el espectáculo en una manifestación sagrada."
 generic_tenet_focus_tenet_cthonic_redoubts: "[GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )] venera las alturas y los refugios ocultos de la tierra como lugares de santidad poco común."
 generic_tenet_focus_tenet_household_gods: "[GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )] se centra en la casa y sitúa el hogar, la familia y la devoción cotidiana bajo la tutela divina."
 generic_tenet_focus_tenet_sinitic_syncretism: "[GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )] entreteje su tradición junto con el pensamiento chino en busca de la armonía, más que de la ruptura."
 generic_tenet_focus_tenet_eastern_syncretism: "[GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )] absorbe enseñanzas distantes con facilidad al entender la sabiduría extranjera como ecos de la verdad sagrada."
 generic_tenet_focus_tenet_unreformed_syncretism: "[GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )] se basa libremente en prácticas antiguas e incorpora rituales ancestrales a un conjunto sagrado nuevo."
 generic_tenet_focus_tenet_christian_syncretism: "[GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )] reinterpreta las enseñanzas cristianas en un marco sagrado propio en lugar de rechazarlas directamente."
 generic_tenet_focus_tenet_islamic_syncretism: "[GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )] toma prestados elementos de las creencias y costumbres musulmanas y encuentra una verdad que pueda usar dentro de una revelación vecina."
 generic_tenet_focus_tenet_jewish_syncretism: "[GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )] incorpora la ley, tradición y memoria hebreas en su comprensión de lo sagrado."
 generic_tenet_focus_tenet_exaltation_of_pain: "[GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )] considera la angustia corporal como una devoción purificadora y reveladora mediante la fortaleza y la aceptación del sufrimiento."
 generic_tenet_focus_tenet_natural_primitivism: "[GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )] desconfía del exceso de civilización al enaltecer un modo de vida más duro y elemental."
 generic_tenet_focus_tenet_pursuit_of_power: "[GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )] bendice la ambición y el dominio temporal al considerar el poder como un auténtico instrumento de lo sagrado."
 generic_tenet_focus_tenet_ritual_cannibalism: "[GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )] incorpora el consumo de carne humana a la adoración tabú y el terror sagrado."
 generic_tenet_focus_tenet_sacred_shadows: "[GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )] se envuelve en el secretismo, santifica la ocultación, el crepúsculo y lo que está escondido a las multitudes."
 generic_tenet_focus_tenet_polyamory: "[GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )] bendice los amores múltiples simultáneos y se niega a reducir la intimidad sagrada a un solo vínculo."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "[GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )] hace de la ofrenda solemne el centro del culto, vinculándolo a la alianza y al favor divino."
 generic_tenet_focus_tenet_megaliths: "[GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )] señala lo sagrado con piedra imperecedera al confiar a los monumentos para que anclen la conmemoración y la devoción."
 generic_tenet_focus_tenet_fp3_fedayeen: "[GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )] santifica el sigilo, la infiltración y la violencia del sacrificio propio al servicio de una causa superior."
 generic_tenet_focus_tenet_communal_possessions: "[GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )] resta importancia a la riqueza privada y urge a los fieles a colectivizar los recursos."
 generic_tenet_focus_tenet_pure_land: "[GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )] establece la esperanza en un reino bendito más allá del sufrimiento al que se llega mediante la confianza, el recuerdo y la devoción."
 generic_tenet_focus_tenet_no_mind: "[GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )] busca la claridad más allá de los confines del pensamiento al disciplinarse a uno mismo en una consciencia vacía y lúcida."
 generic_tenet_focus_tenet_mountain_worship: "[GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )] se fija en los lugares elevados como los más cercanos a la divinidad y convierte picos y elevaciones en objetos de veneración."
 generic_tenet_focus_tenet_extinction_of_dharma: "[GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )] considera que el mundo está dominado por la corrupción y justifica la violencia implacable en defensa de la verdad."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] considera los restos de los enemigos como una prueba sagrada de triunfo y prestigio aterrador."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "[GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )] exalta el aprendizaje como una labor sagrada que busca la verdad mediante el estudio, el debate y el cuestionamiento disciplinado."
 generic_tenet_focus_tenet_benevolent_governance: "[GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )] mide la santidad parcialmente por un gobierno justo, una administración ordenada y el cuidado del señorío."
 generic_tenet_focus_tenet_filial_piety: "[GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )] enseña a venerar a los padres y mayores como los cimientos de la moral y el orden sagrado."
 generic_tenet_focus_tenet_harmonious_society: "[GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )] valora el equilibrio, el decoro y la concordia pública como reflejos del orden cósmico."
 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )] considera la ruina sagrada como una purificación y convierte la devastación misma en instrumento de renovación."
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )] valora la fortaleza, la continuidad y la salvaguarda cuidadosa de lo que ha sido confiado."
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )] trata al oso y a los poderes similares de la naturaleza con veneración, admiración y un respeto cuidadoso."
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )] busca restringir la violencia para poner límites sagrados a cuándo se puede derramar sangre."
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] enaltece a los muertos benditos y los modelos sagrados al atesorar su recuerdo sin igualarlos a la divinidad."
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )] trata los misterios sagrados como auténticamente transformadores, lo que convierte el sacramento en el núcleo de la presencia divina."
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )] combina devoción y esfuerzo, partiendo de la idea de que el trabajo honrado puede convertirse en sí mismo en un acto de veneración."
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )] impulsa una veneración excepcional del más santo intercesor por encima de las filas normales de santos."
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )] acepta que no es fácil separar cargo sagrado, patrocinio y riqueza terrenal."
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )] proclama la unidad de la naturaleza de Cristo y rechaza dividir el misterio divino muy nítidamente."
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )] se organiza según la comunidad apostólica, la caridad y la vida en común de los primeros fieles."
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )] enseña que muchas almas se purifican tras la muerte antes de que puedan entrar en la dicha perfecta."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )] eleva la familia, la procreación y el engendrar nueva vida como deberes santos."
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )] cimienta la autoridad en la cadena de transmisión ininterrumpida que se remonta a los primeros discípulos."
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )] valora el arrepentimiento y la absolución públicos y confía en que expresar el pecado sea el comienzo de la curación."
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )] considera que la debilidad humana es primordial e insiste en que ningún alma entra en el mundo intacta."
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )] imagina el cosmos organizado en filas sagradas y cada estación refleja el diseño divino."
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )] asigna a los fieles como guerreros de lo sagrado y los llama a defender la fe con un fervor disciplinado."
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )] agudiza la creencia mediante la argumentación, los comentarios y la reconciliación de razón y fe."
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] recalca la exaltación y la condición divina de hijo de un modo que quita importancia a la distinción eterna."
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )] coloca la misericordia y la caridad en el centro de la vida religiosa cotidiana."
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )] exalta los ritos solemne y considera la adoración ordenada la ventana más despejada a lo sagrado."
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )] enseña la unión inseparable de divinidad y humanidad dentro del misterio único de Cristo."
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )] busca la unión mediante el silencio, la quietud y la repetición interna de la oración sagrada."
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )] enaltece el alejamiento del mundo al buscar la santidad en la soledad, las privaciones y la distancia."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )] persigue la santidad mediante privaciones corporales al doblegar los apetitos básicos ante una meta espiritual."
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )] da una importancia especial al rito de la unción y trata los óleos sagrados como una señal de la gracia divina."
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )] santifica las cruces de piedra tallada y los monumentos permanentes como testigos públicos de lo santo."
