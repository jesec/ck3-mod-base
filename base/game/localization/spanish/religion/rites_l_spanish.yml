l_spanish:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "El [Rite.GetNameNoTooltip|l] fue fundado por [Character.GetFullName] en el país [Character.GetCurrentLocation.GetTitle.GetAdjective|l] el [GetCurrentDate.GetStringLong], como un rito de la fe [Faith.GetAdjective]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "El [Rite.GetNameNoTooltip|l] fue fundado por [Character.GetFullName] el [GetCurrentDate.GetStringLong], como un rito de la fe [Faith.GetAdjective]. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "Este rito recalca un aspecto devoto distintivo dentro de su fe matriz."
 generic_rite_focus_tenet_aniconism: "Este rito rechaza las imágenes sagradas y busca la adoración a través de la ausencia, la compostura y la santidad de la divinidad no representada."
 generic_rite_focus_tenet_alexandrian_catechism: "Este rito valora la enseñanza, la doctrina sutil y la instrucción paciente de los fieles."
 generic_rite_focus_tenet_armed_pilgrimages: "Este rito considera la guerra santa y las peregrinaciones armadas deberes sagrados de los devotos."
 generic_rite_focus_tenet_carnal_exaltation: "Este rito enaltece el deseo y el placer encarnado como regalos tocados por lo sagrado."
 generic_rite_focus_tenet_communal_identity: "Este rito vincula estrechamente el culto con las costumbres compartidas, la vida en común y una identidad comunal protegida."
 generic_rite_focus_tenet_communion: "Este rito se mantiene unido por una devoción compartida, la dación de limosnas y la comunión con su líder espiritual."
 generic_rite_focus_tenet_consolamentum: "Este rito aspira a una purificación final mediante la renuncia y una preparación inquebrantable para la muerte."
 generic_rite_focus_tenet_divine_marriage: "Este rito consagra juntos la unión y el liderazgo, y considera el matrimonio sagrado un reflejo del orden divino."
 generic_rite_focus_tenet_gnosticism: "Este rito busca las verdades ocultas tras el velo del mundo y confía la salvación al conocimiento sagrado."
 generic_rite_focus_tenet_mendicant_preachers: "Este rito difunde la fe mediante predicadores errantes, testigos humildes y una enseñanza infatigable."
 generic_rite_focus_tenet_pacifism: "Este rito eleva la compostura y la paz y considera el derramamiento de sangre innecesario un grave fallo del alma."
 generic_rite_focus_tenet_pentarchy: "Este rito aprecia las antiguas sedes de autoridad y la administración ordenada del conjunto general de la fe."
 generic_rite_focus_tenet_unrelenting_faith: "Este rito alaba el fervor perseverante, la resolución firme y la disposición a luchar por lo sagrado."
 generic_rite_focus_tenet_vows_of_poverty: "Este rito enaltece la pobreza santa y exhorta a los fieles a liberarse de los excesos y vivir con menos."
 generic_rite_focus_tenet_pastoral_isolation: "Este rito prefiere un rebaño guardado y favorece la separación del extenso mundo por encima de los compromisos."
 generic_rite_focus_tenet_rite: "Este rito da una gran importancia a la liturgia, el orden clerical y el mantenimiento de la tradición sagrada."
 generic_rite_focus_tenet_adaptive: "Este rito se dobla sin romperse; absorbe las tradiciones locales al tiempo que conserva su núcleo sagrado."
 generic_rite_focus_tenet_esotericism: "Este rito valora el conocimiento oculto, la iniciación y las verdades reveladas solo a los preparados."
 generic_rite_focus_tenet_legalism: "Este rito fundamenta la santidad en la ley clara, el buen juicio y el orden disciplinado de la vida."
 generic_rite_focus_tenet_literalism: "Este rito es rigurosamente fiel a las palabras santas y desconfía de las interpretaciones laxas y el compromiso heredado."
 generic_rite_focus_tenet_reincarnation: "Este rito contempla el viaje del alma como un ciclo y cada vida da forma a la siguiente."
 generic_rite_focus_tenet_religious_legal_pronouncements: "Este rito confiere una autoridad espiritual permanente a la ley sagrada y las resoluciones formales."
 generic_rite_focus_tenet_struggle_submission: "Este rito enseña que la fe se prueba mediante la lucha, la conquista y la sumisión de los impíos."
 generic_rite_focus_tenet_false_conversion_sanction: "Este rito tolera la conformidad oculta y el enmascaramiento exterior cuando la supervivencia o la ventaja lo exigen."
 generic_rite_focus_tenet_tax_nonbelievers: "Este rito señala la falta de fe como una carga que debe ser tasada para reforzar la jerarquía sagrada mediante obligaciones mundanas."
 generic_rite_focus_tenet_asceticism: "Este rito busca la santidad mediante la abnegación, la disciplina y el dominio paciente del deseo."
 generic_rite_focus_tenet_bhakti: "Este rito se centra en la devoción sincera y enseña que la entrega amorosa es lo que más acerca el alma a lo divino."
 generic_rite_focus_tenet_dharmic_pacifism: "Este rito valora la inocuidad y el dominio de uno mismo y trata la paz como una disciplina superior a la ira."
 generic_rite_focus_tenet_inner_journey: "Este rito vuelve su mirada hacia el interior; busca el despertar mediante la meditación, la disciplina y la transformación de uno mismo."
 generic_rite_focus_tenet_ritual_hospitality: "Este rito considera la hospitalidad como una obligación sagrada que une a anfitriones e invitados bajo una costumbre sagrada."
 generic_rite_focus_tenet_adorcism: "Este rito corteja a los espíritus con veneración a la espera de ganar su favor y conjurar su ira."
 generic_rite_focus_tenet_ancestor_worship: "Este rito se fija en los difuntos enaltecidos para su guía, bendición y continuidad con los vivos."
 generic_rite_focus_tenet_astrology: "Este rito busca sentido en los cielos; confía en que las estrellas revelen orden, destino y oportunidad."
 generic_rite_focus_tenet_hedonistic: "Este rito abraza el jolgorio, los excesos y la santificación del placer en el culto comunal."
 generic_rite_focus_tenet_human_sacrifice: "Este rito considera las ofrendas de sangre como un acuerdo temible, pero sagrado, entre los mortales y la divinidad."
 generic_rite_focus_tenet_mystical_birthright: "Este rito sostiene que el destino marca ciertas almas desde el nacimiento para el poder sagrado y la grandeza espiritual."
 generic_rite_focus_tenet_ritual_celebrations: "Este rito exalta las juergas comunales y los festejos santos como la más completa expresión del culto."
 generic_rite_focus_tenet_sacred_childbirth: "Este rito envuelve el parto con respeto y trata la maternidad y la nueva vida como actos de significancia sagrada."
 generic_rite_focus_tenet_sanctity_of_nature: "Este rito halla lo sagrado en el mundo viviente y venera el crecimiento, la fertilidad y la creación indómita."
 generic_rite_focus_tenet_sun_worship: "Este rito venera el sol como símbolo vital inspirador de orden, esplendor y favor divino."
 generic_rite_focus_tenet_warmonger: "Este rito glorifica la conquista y el vigor marcial y espera que los fieles se pongan a prueba mediante la guerra."
 generic_rite_focus_tenet_gruesome_festivals: "Este rito abraza unos festivales horribles que convierten el miedo, la sangre y el espectáculo en una manifestación sagrada."
 generic_rite_focus_tenet_cthonic_redoubts: "Este rito venera las alturas y los refugios ocultos de la tierra como lugares de santidad poco común."
 generic_rite_focus_tenet_household_gods: "Este rito se centra en la casa y sitúa el hogar, la familia y la devoción cotidiana bajo la tutela divina."
 generic_rite_focus_tenet_sinitic_syncretism: "Este rito entreteje su tradición junto con el pensamiento sinítico en busca de la armonía, más que de la ruptura."
 generic_rite_focus_tenet_eastern_syncretism: "Este rito absorbe enseñanzas orientales con facilidad al entender la sabiduría extranjera como ecos de la verdad sagrada."
 generic_rite_focus_tenet_unreformed_syncretism: "Este rito se basa libremente en prácticas antiguas e incorpora rituales ancestrales a un conjunto sagrado nuevo."
 generic_rite_focus_tenet_christian_syncretism: "Este rito reinterpreta las enseñanzas cristianas en un marco sagrado propio en lugar de rechazarlas directamente."
 generic_rite_focus_tenet_islamic_syncretism: "Este rito toma prestados elementos de las creencias y costumbres islámicas y encuentra una verdad que pueda usar dentro de una revelación vecina."
 generic_rite_focus_tenet_jewish_syncretism: "Este rito incorpora la ley, tradición y memoria judaicas en su comprensión de lo sagrado."
 generic_rite_focus_tenet_exaltation_of_pain: "Este rito considera el sufrimiento una devoción purificadora y reveladora mediante la fortaleza y la aceptación del sufrimiento."
 generic_rite_focus_tenet_natural_primitivism: "Este rito desconfía del exceso de civilización al enaltecer un modo de vida más duro y elemental."
 generic_rite_focus_tenet_pursuit_of_power: "Este rito bendice la ambición y el dominio temporal al considera el poder como un auténtico instrumento de lo sagrado."
 generic_rite_focus_tenet_ritual_cannibalism: "Este rito incorpora el consumo de carne humana a la adoración tabú y el terror sagrado."
 generic_rite_focus_tenet_sacred_shadows: "Este rito se envuelve en el secretismo, santifica la ocultación, el crepúsculo y lo que está escondido a las multitudes."
 generic_rite_focus_tenet_polyamory: "Este rito bendice los amores múltiples simultáneos y se niega a reducir la intimidad sagrada a un solo vínculo."
 generic_rite_focus_tenet_sacrificial_ceremonies: "Este rito sitúa las ofrendas solemnes en el centro del culto al unir los sacrificios con el pacto y los favores."
 generic_rite_focus_tenet_megaliths: "Este rito señala lo sagrado con piedra imperecedera al confiar a los monumentos para que anclen la conmemoración y la devoción."
 generic_rite_focus_tenet_fp3_fedayeen: "Este rito santifica el sigilo, la infiltración y la violencia del sacrificio propio al servicio de una causa superior."
 generic_rite_focus_tenet_communal_possessions: "Este rito quita importancia a la riqueza privada y urge a los fieles a poner recursos en común."
 generic_rite_focus_tenet_pure_land: "Este rito establece la esperanza en un reino bendito más allá del sufrimiento al que se llega mediante la confianza, el recuerdo y la devoción."
 generic_rite_focus_tenet_no_mind: "Este rito busca la claridad más allá de los confines del pensamiento al disciplinarse a uno mismo en una consciencia vacía y lúcida."
 generic_rite_focus_tenet_mountain_worship: "Este rito se fija en los lugares elevados como los más cercanos a la divinidad y convierte picos y elevaciones en objetos de veneración."
 generic_rite_focus_tenet_extinction_of_dharma: "Este rito considera que el mundo está dominado por la corrupción y justifica la violencia implacable en defensa de la verdad."
 generic_rite_focus_tenet_cranial_trophies: "Este rito considera los restos de los enemigos como una prueba sagrada de triunfo y prestigio aterrador."
 generic_rite_focus_tenet_pursuit_of_knowledge: "Este rito exalta el aprendizaje como una labor sagrada que busca la verdad mediante el estudio, el debate y el cuestionamiento disciplinado."
 generic_rite_focus_tenet_benevolent_governance: "Este rito mide la santidad parcialmente por un gobierno justo, una administración ordenada y el cuidado del señorío."
 generic_rite_focus_tenet_filial_piety: "Este rito enseña a venerar a los padres y mayores como los cimientos de la moral y el orden sagrado."
 generic_rite_focus_tenet_harmonious_society: "Este rito valora al equilibrio, el decoro y la armonía social como reflejos del orden cósmico."
 generic_rite_focus_tenet_sacred_destruction: "Este rito considera la destrucción sagrada una purificación y convierte la devastación misma en instrumento de la renovación sagrada."
 generic_rite_focus_tenet_preservation: "Este rito valora la fortaleza, la continuidad y la salvaguarda cuidadosa de lo que ha sido confiado."
 generic_rite_focus_tenet_takamin: "Este rito trata al oso y los poderes similares de la naturaleza con veneración, admiración y un respeto cuidadoso."
 generic_rite_focus_tenet_peace_of_god: "Este rito busca restringir la violencia para poner límites sagrados a cuándo se puede derramar sangre."
 generic_rite_focus_tenet_dulia: "Este rito enaltece a los santos y los modelos sagrados al venerar su recuerdo sin igualarlos a la divinidad."
 generic_rite_focus_tenet_transubstantiation: "Este rito trata los misterios sagrados como auténticamente transformadores, lo que convierte el sacramento en el núcleo de la presencia divina."
 generic_rite_focus_tenet_ora_et_labora: "Este rito une la oración a la tarea y enseña que el trabajo disciplinado puede convertirse en devoción de por sí."
 generic_rite_focus_tenet_hyperdulia: "Este rito impulsa una veneración excepcional del más santo intercesor por encima de las filas normales de santos."
 generic_rite_focus_tenet_simony: "Este rito acepta que no es fácil separar cargo sagrado, patrocinio y riqueza terrenal."
 generic_rite_focus_tenet_monophysitism: "Este rito proclama la unidad de la naturaleza de Cristo y rechaza dividir el misterio divino muy nítidamente."
 generic_rite_focus_tenet_acts_of_apostles: "Este rito se organiza según la comunidad apostólica, la caridad y la vida en común de los primeros fieles."
 generic_rite_focus_tenet_purgatory: "Este rito enseña que muchas almas se purifican tras la muerte antes de que puedan entrar en la dicha perfecta."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "Este rito eleva la familia, la procreación y el engendrar nueva vida como deberes santos."
 generic_rite_focus_tenet_apostolic_succession: "Este rito cimienta la autoridad en la cadena de transmisión ininterrumpida que se remonta a los apóstoles."
 generic_rite_focus_tenet_confession: "Este rito valora el arrepentimiento y la absolución públicos y confía en que expresar el pecado sea el comienzo de la curación."
 generic_rite_focus_tenet_original_sin: "Este rito considera que la debilidad humana es primordial e insiste en que ningún alma entra en el mundo intacta."
 generic_rite_focus_tenet_celestial_hierarchy: "Este rito imagina el cosmos organizado en filas sagradas y cada estación refleja el diseño divino."
 generic_rite_focus_tenet_miles_christi: "Este rito asigna a los fieles como soldados de lo sagrado y los llama a defender la fe con un fervor disciplinado."
 generic_rite_focus_tenet_scholasticism: "Este rito agudiza la creencia mediante la argumentación, los comentarios y la reconciliación de razón y fe."
 generic_rite_focus_tenet_adoptionism: "Este rito recalca la exaltación y la condición divina de hijo de un modo que quita importancia a la distinción eterna."
 generic_rite_focus_tenet_love_thy_neighbour: "Este rito coloca la misericordia y el amor al prójimo en el corazón de la vida religiosa cotidiana."
 generic_rite_focus_tenet_divine_liturgy: "Este rito exalta la liturgia solemne y considera la adoración ordenada la ventana más despejada a la divinidad."
 generic_rite_focus_tenet_miaphysitism: "Este rito enseña la unión inseparable de divinidad y humanidad dentro del misterio único de Cristo."
 generic_rite_focus_tenet_hesychasm: "Este rito busca la unión mediante el silencio, la quietud y la repetición interna de la oración sagrada."
 generic_rite_focus_tenet_anachoresis: "Este rito enaltece el alejamiento del mundo al buscar la santidad en la soledad, las privaciones y la distancia."
 generic_rite_focus_tenet_mortification_of_the_flesh: "Este rito persigue la santidad mediante privaciones corporales al doblegar la carne ante una meta espiritual."
 generic_rite_focus_tenet_holy_myron: "Este rito da una importancia especial a la unción santa y trata los óleos sagrados como una señal de la gracia divina."
 generic_rite_focus_tenet_khachkar: "Este rito santifica las cruces de piedra tallada y los monumentos permanentes como testigos públicos de lo santo."
