 #Ṣadr al-Islām
 sadr_al_islam: "Sadr al-Islam"
 sadr_al_islam_adj: "musulmana"
 sadr_al_islam_adherent: "musulmán"
 sadr_al_islam_adherent_plural: "musulmanes"
 sadr_al_islam_desc: "En su forma más pura, antes de la aparición de las escuelas de pensamiento en años posteriores, los musulmanes eran dirigidos por el Profeta en persona con la revelación divina. Su sunna fue seguida por los compañeros y los tabi'un de las primeras generaciones."
 #Sunni
 sunni: "Sunismo"
 sunni_adj: "suní"
 sunni_adherent: "suní"
 sunni_adherent_plural: "suníes"
 sunni_desc: "Sunismo se refiere a los seguidores de las prácticas de Mahoma, que se conocen como sunna. La jurisprudencia islámica suní se basa principalmente en el Corán, los hadices y el ijma (consenso erudito) como fuentes fundacionales."
 #Shia
 shia: "Chiismo"
 shia_adj: "chií"
 shia_adherent: "chií"
 shia_adherent_plural: "chiíes"
 shia_desc: "Una rama del islam que cree que el liderazgo debe conservarse en la familia del profeta Mahoma y trasmitirse mediante imanes guiados por la divinidad. Se centra en la devoción a la casa del Profeta."
 islam_shia_priest: "mulá"
 islam_shia_priest_plural: "mulás"
 islam_shia_religious_head_title: "Imán"
 islam_shia_religious_head_title_name: "Imanato"
 #Kharijite
 kharijite: "Jariyismo"
 kharijite_adj: "jariyita"
 kharijite_adherent: "jariyí"
 kharijite_adherent_plural: "jariyíes"
 kharijite_desc: "Un grupo islámico primitivo que creía que el liderazgo se debía basar en la piedad, no el linaje, y que se podía sustituir a los gobernantes pecadores. Sus miembros aparecieron durante las agitaciones chiíes, rechazaron a ambos bandos y los declararon grandes pecadores fuera del islam."
 #Masmudism
 masmudi: "Almohadismo"
 masmudi_adj: "almohade"
 masmudi_adherent: "almohade"
 masmudi_adherent_plural: "almohades"
 masmudi_desc: "Una rama reformista del islam suní surgido entre las tribus bereberes del Norte de África. El movimiento almohade se veía a sí mismo como unitario y predicaba una doctrina de monoteísmo purificado."
 masmudi_religious_head_title: "Califa"
 masmudi_religious_head_title_name: "califato"
 #Quranism
 quranist: "Coranismo"
 quranist_adj: "coranista"
 quranist_adherent: "coranista"
 quranist_adherent_plural: "coranista"
 quranist_desc: "Una interpretación literal del islam que enfatiza que el Corán es la única fuente de sabiduría divina y debe seguirse al pie de la letra, haciendo caso omiso de hadices y fetuas."
 #Druze
 druze: "Druso"
 druze_adj: "drusa"
 druze_adherent: "druso"
 druze_adherent_plural: "drusos"
 druze_desc: "Proveniente del monte Druso, la fe drusa sigue muchos de los principios del ismailismo, pero también incluye creencias gnósticas de una teología esotérica centrada en la Verdad de la existencia."
 druze_religious_text: "Epístolas de Sabiduría"
 druze_religious_text_2: "$druze_religious_text$" #Optional translation alt
 druze_religious_text_3: "$druze_religious_text$" #Optional translation alt
