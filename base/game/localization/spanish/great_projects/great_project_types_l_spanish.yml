 great_project_type_great_wall_extend_to_shanhai_pass: "Prolongar la Gran Muralla hasta el paso Shanhai"
 great_project_type_great_wall_extend_to_shanhai_pass_desc: "La Gran Muralla ya es bastante impresionante, pero aún podría serlo más aún y ofrecer una protección mejor. Si la extendemos más hacia el este, hasta el paso Shanhai y la costa, podremos bloquear todo acceso desde el norte."
