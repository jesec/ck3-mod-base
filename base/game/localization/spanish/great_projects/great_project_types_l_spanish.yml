 great_project_type_construct_great_barracks_desc: "Nuestro poderío militar se podría exhibir con la construcción de una gran fortaleza que albergue a innumerables soldados. Los comandantes militares podrán reclutar más tropas y grandes guarniciones, lo que beneficiará enormemente a la fuerza defensiva de la zona."
