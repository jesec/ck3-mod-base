 great_project_type_strengthen_capital: "Reforzar la capital"
 great_project_type_strengthen_capital_desc: "La capital no es solo la sede de mi gobierno. Es el mismísimo centro del señorío y debería ser un símbolo majestuoso de mi reinado. Si renuevo la ciudad entera, mejoro las calles, fundo una universidad, levanto estatuas y otros monumentos, esta hermosa urbe se convertirá en un reflejo de mi dinastía."
 great_project_type_strengthen_capital_possessive: "$great_project_type_strengthen_capital$"
 great_project_type_strengthen_capital_contribution_materials: "Materiales de construcción"
 great_project_type_strengthen_capital_contribution_workforce: "Mano de obra"
 great_project_type_strengthen_capital_contribution_architects: "Arquitectos diestros"
 great_project_type_strengthen_capital_contribution_engineers: "Ingenieros con talento"
 great_project_type_strengthen_capital_contribution_sculptors: "Escultores maravillosos"
 great_project_type_strengthen_capital_contribution_forbidden_city: "La Ciudad Prohibida"
