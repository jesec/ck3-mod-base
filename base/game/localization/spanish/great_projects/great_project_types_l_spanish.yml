 great_project_type_great_wall_extend_to_liaodong: "Prolongar la Gran Muralla hasta Liaodong"
 great_project_type_great_wall_extend_to_liaodong_desc: "A medida que ampliamos nuestras fronteras, también hemos de extender la Gran Muralla para que rodee la costa. Todos los rincones de nuestro señorío, ya estén en tierra o en el mar, han de ser protegidos."
