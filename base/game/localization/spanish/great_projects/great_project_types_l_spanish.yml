l_spanish:
 great_project_type_great_wall: "Mejorar la Gran Muralla"
 great_project_type_great_wall_desc: "La Gran Muralla se alza como un testimonio de la habilidad de ingeniería de nuestros predecesores y de la inventiva para disuadir a posibles invasores. No obstante, como con todo, el tiempo le ha pasado factura. A la muralla le hace falta una mejora urgente."
 great_project_type_great_wall_province_has_great_wall: "[province.GetNameNoTooltip] contiene una sección de [GetBuildingType('the_great_wall_01').GetName|l]"
 great_project_type_great_wall_province_gains_great_wall: "Las [holdings|El] que hayan logrado financiar sus [great_project_contributions|lE] verán mejoradas sus secciones del [building|lE] de [GetBuildingType('the_great_wall_04').GetName|l]"
 great_project_type_great_wall_possessive: "de la Gran Muralla"
 great_project_type_great_wall_contribution_master_builder: "Contratar a un maestro constructor e iniciar la construcción"
 great_project_type_great_wall_contribution_master_builder_desc: "¡Hay que tomarse en serio las fortificaciones! Hemos de poner a las mentes más capaces a la tarea de supervisar este [great_project|lE], para asegurarnos así de que se usan los mejores materiales, se emplea a los peones más duros y se levantan las murallas más poderosas."
