l_spanish:
 great_project_type_pam_cathedral_01: "Erigir una $building_type_great_project_cathedral_01$"
 great_project_type_pam_cathedral_01_desc: "¡Fijad la cruz reluciente sobre firmes muros de piedra, por encima de cúpulas majestuosas y torres altas! Traed la maravillosa luz del cielo a la tierra y que luzca sobre el trono y el altar de un prelado santo.\n\nTras años de noble trabajo, un gran faro iluminará a los fieles de cerca y de lejos."
 great_project_type_pam_cathedral_02: "Erigir una $building_type_great_project_cathedral_02$"
 great_project_type_pam_cathedral_02_desc: "¡Que se eleven los arcos apuntados y resplandezcan las vidrieras!\n\nComo Lázaro, esta noble catedral renacerá para guiarnos hacia una nueva era."
 great_project_type_pam_cathedral_03: "Erigir una $building_type_great_project_cathedral_03$"
 great_project_type_pam_cathedral_03_desc: "¡Que los ornamentos de tracería y piedra rizada sean una corona de fuego sagrado que simbolice un nuevo reinado para este edificio glorioso!\n\nUna gran ampliación coronará una [GetBuilding('great_project_cathedral_02').GetName|Vl] existente como [GetBuilding('great_project_cathedral_03').GetName|Vl], y sus torres guiarán a los fieles hasta el final de los tiempos."
