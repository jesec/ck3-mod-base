 great_project_type_pam_mass_rite_conversion_desc_christian: "Con los recursos suficientes podemos traer a la luz del Señor no solo a los paganos individuales, sino a [realms|El] paganos enteros. Merced a nuestra tutela, aprenderán el [rite|El] más recto y, a cambio, la [christendom|El] crecerá."
 great_project_type_pam_mass_rite_conversion_desc_generic: "Con bastantes recursos podemos portar las creencias de nuestra fe más allá de unos cuantos conversos, hasta [realms|El] enteros donde las [faiths|El] hostiles aún ejercen poder. Merced a nuestra tutela, su pueblo aprenderá el [rite|El] correcto, lo que nos reforzará por toda la tierra."
