 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$: frescos sacros para [province.GetNameNoTooltip]"
 pam_great_projects_events.0002.desc: "Mientras los sacerdotes consultan la palabra de Dios, son las imágenes divinas las que ilustran al rebaño con la verdad y la gloria del Señor.\n\nAhora que hemos reunido los fondos necesarios y a los pintores iconográficos, decidiré qué escenas de las escrituras adornarán las cámaras, las paredes y las bóvedas."
 pam_great_projects_events.0002.a: "Los tres Reyes Magos en el nacimiento de Cristo."
 pam_great_projects_events.0002.b: "San Jerónimo en el desierto con su león."
 pam_great_projects_events.0002.c: "Abraham y Lot parten de Egipto hacia Canaán."
 pam_great_projects_events.0002.d: "Anunciación a la Virgen María."
 pam_great_projects_events.0002.e: "La llama de San Agustín arde con el conocimiento del Señor."
 pam_great_projects_events.0002.f: "Cristo lava los pies de los apóstoles."
 pam_great_projects_events.0002.mystic_xp: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará mayor [trait_level_track_xp|El] a quienes posean el [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.scholar_xp: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [trait_level_track_xp|El] a quienes posean el [trait|El] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.pilgrim_xp: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [trait_level_track_xp|El] a quienes posean el [trait|El] [GetTrait('pilgrim').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.piety: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [piety|El] @piety_icon!"
 pam_great_projects_events.0002.learning_xp: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [lifestyle_experience|El] de [learning|El] @skill_learning_icon! y [spiritual_fulfillment|lE] a los fieles"
 pam_great_projects_events.0002.stress_loss: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [stress_loss|El] @stress_loss_icon!"
 cathedral_stained_glass_contributor_tt: "Tienes un [prestige_level|El] [GetPrestigeLevelName('(int32)2')] o superior, un [piety_level|El] [GetPietyLevelName('(int32)3')] o superior, o un [title|El] de nivel [kingdom|lE]"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: luz pintada sobre [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.desc: "«#EMP Brillante es aquello que se une brillantemente con lo brillante, y brillante será la noble obra que se impregne de la nueva luz»#!, expresa [religion_buddy.Custom('ES_ElLA')] [religion_buddy.GetTitledFirstName|l] al posar los ojos sobre el vidrio cortado que resplandece con el sol.\n\n[glazier.Custom('ES_ElLa')|U] vidrier[glazier.Custom('ES_OA')], [glazier.Custom('ES_ElLa')] [glazier.GetTitledFirstName|l], ha puesto fragmentos de [Glossary('vidrio de crisol','POT_METAL_GLOSS')] sobre mesas encaladas para que pudiéramos examinar mejor los posibles diseños.\n\nEntonces declaro: «Este ventanal se verá tanto desde la nave como desde la totalidad de [province.GetNameNoTooltip], debe representar…»."
 pam_great_projects_events.0003.a: "Un Árbol de Jesé que confirme la legitimidad de la casa [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.a.flavor: "[Glossary('Árbol de Jesé','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [dynasty_prestige|El] @dynasty_prestige_icon! a los miembros de la [dynasty|El] que la visiten como líderes de [Concept('travel', 'viaje')|E]"
 pam_great_projects_events.0003.b: "Un panel de donantes con tu retrato y escudo de armas."
 pam_great_projects_events.0003.b.tt: "Una vez terminada la [grand_cathedral|El], su [point_of_interest|El] proporcionará [prestige|El] @prestige_icon! a los visitantes"
 pam_great_projects_events.0003.c: "Escenas de milagros para los peregrinos, para atraer a los fieles desde lejanos territorios."
 pam_great_projects_events.0003.c.tt: "Una vez terminada la [grand_cathedral|El], su [point_of_interest|El] proporcionará más [trait_level_track_xp|El] a quienes posean el [trait|El] [GetTrait('pilgrim').GetName( GetNullCharacter )]"
 pam_great_projects_events.0003.d: "Una vidriera mariana, con una lámpara perpetua delante."
 pam_great_projects_events.0003.d.flavor: "Mantendremos encendida una lámpara de aceite y cirios delante de la imagen [blessed_mary.Custom('ES_DelDela')] [blessed_mary.GetTitledFirstName] en la vidriera."
 pam_great_projects_events.0003.d.tt: "Una vez que se haya terminado la [grand_cathedral|El], su [point_of_interest|El] proporcionará [stress_loss|El] @stress_loss_icon! y [spiritual_fulfillment|lE]"
 pam_great_projects_events.0003.d.dulia.tt: "El hecho de tener [GetTenetType('tenet_dulia').GetBaseName] como [personal_tenet|El] otorga mayor [spiritual_fulfillment|El] durante la visita"
 pam_great_projects_events.0003.e: "Un ciclo de martirio a manos de un rey."
 pam_great_projects_events.0003.e.tt: "Una vez terminada la [grand_cathedral|El], su [point_of_interest|El] concede a los visitantes fervientes [piety|El] @piety_icon! y [stress_loss|El] @stress_loss_icon!."
 pam_great_projects_events.0003.e.owner_msg.title: "Martirio en vidrio"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.Custom('ES_ElLa')|U] [contributor.GetTitledFirstName|l] ha encargado un ciclo de vidrieras sobre el martirio para la [grand_cathedral|El]. El tema te inspira aún mayor devoción."
 TREE_OF_JESSE_GLOSS: "El Árbol de Jesé representa la genealogía de Cristo, que surge de la figura recostada de Jesé, padre de David. Las vidrieras de las iglesias solían representar el linaje real bíblico en relación con una dinastía reinante, lo que denotaba realeza divina. Se pueden ver ejemplos destacados en Chartres y Saint-Denis."
 POT_METAL_GLOSS: "El vidrio de crisol se tiñe en el propio crisol fundido, removiendo óxidos metálicos en la mezcla inicial; así, el color recorre todo el espesor de la pieza en lugar de quedarse solo en la superficie. Los maestros vidrieros o «vitrearii» cortaban las láminas ya enfriadas en piezas y las disponían sobre tablas encaladas para comprobar cómo incidía la luz antes de emplomar la vidriera."
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: la primera piedra"
 pam_great_projects_events.0005.desc.intro: "¡Se ha colocado la primera piedra! Como la bellota que germina y se convierte en roble, la sede [owner.Custom('ES_DelDela')] [owner.GetTitledFirstName|l] crecerá hasta convertirse en un monumento edificante. Cada piedra y tablón de madera que se coloquen irradiarán la gloria de [ROOT.Char.GetFaith.HighGodName] a todos los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] de [owner.GetPrimaryTitle.GetNameNoTier] y a toda la cristiandad.\n\nLa magnanimidad de [CharMyFirstNames(founder)|U], quien ha financiado la construcción, resonará con cada repique de campanas y estará en boca de todos los fieles."
 pam_great_projects_events.0005.desc.contributor: "\n\nEn concreto, la contribución de [contribution.GetName|l] [optional_contributor.Custom('ES_DelDela')] [optional_contributor.GetTitledFirstName|l] ayudará a inmortalizar aún más nuestra [cathedral_building.GetName|l]."
 pam_great_projects_events.0005.desc.outro: "¡Que comience nuestra gran labor!"
 pam_great_projects_events.0005.a: "«Nuestros hijos lo verán completado»."
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: dispuesta según el orden divino"
 pam_great_projects_events.0006.desc.intro_architect: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] me señala"
 pam_great_projects_events.0006.desc.intro_no_architect: "Contemplo"
 pam_great_projects_events.0006.desc.intro: "una serie de estacas de madera, con una cuerda tensada entre ellas formando el contorno de una enorme cruz: una visión del futuro edificio cruciforme."
 pam_great_projects_events.0006.desc.steward_founder: "\n\n¡No he visto este proceso en mis estudios!\n\n«Debes de estar $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n«Pero ¿cómo se planifica un edificio tan grandioso?», pregunto."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n«Estamos $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "empleando [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]. El Señor nos ha concedido el orden divino; con la ayuda de una escuadra podemos extrapolar las proporciones de un edificio más grandioso que cualquier [ROOT.Char.Custom('ResidenceBuilding')]»."
 pam_great_projects_events.0006.desc.foundations: "\n\nVeo que pronto empezarán a excavarse los cimientos."
 pam_great_projects_events.0006.a: "Cavad una cripta para los antepasados de la casa [founder.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0006.a.tt: "Se construye una [GetDomicileBuilding('cathedral_crypt_01').GetName|V|l] en el [cathedral_complex|El] de [owner.GetShortUIName], en honor a la [dynasty|El] [founder.GetDynastyName]"
 pam_great_projects_events.0006.b: "Ampliad la nave para dar cabida a los peregrinos."
 pam_great_projects_events.0006.b.tt: "Una vez terminada la [grand_cathedral|El], su [point_of_interest|El] proporcionará [trait_level_track_xp|El] de [GetTrait('pilgrim').GetName( GetNullCharacter )|l] y [piety|El] @piety_icon! a los peregrinos que la visiten"
 pam_great_projects_events.0006.c: "Solo Dios puede dirigir el curso de los acontecimientos."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#!: del latín «según el cuadrado» o «por el cuadrado». Los maestros constructores medievales trazaban el solar de un edificio mediante sistemas de proporción simples: empleaban la razón entre el lado de un cuadrado y su diagonal. Se consideraba que un rectángulo cuyos lados equivalían a esas dos longitudes tenía una forma armoniosa. A partir de esta única unidad base, el constructor podía derivar una sucesión de cuadrados y rectángulos, mayores y menores, y cerciorarse así de que cada parte del plano encajara con la siguiente."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: las nervaduras ondulantes del Cielo"
 pam_great_projects_events.0007.desc.intro_architect: "Mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] me guía entre un gran bosque de vigas. Los andamios de la catedral se alzan como si fueran una iglesia de madera en sí mismos, sosteniendo a los mamposteros que trabajan sin descanso en las bóvedas de piedra."
 pam_great_projects_events.0007.desc.intro_no_architect: "Camino entre un gran bosque de vigas. Los andamios de la catedral se alzan como si fueran una iglesia de madera en sí mismos, mientras sostienen a los mamposteros que trabajan en las bóvedas."
 pam_great_projects_events.0007.desc.architect: "\n\n«Estas bóvedas, una vez terminadas, protegerán a los fieles de las inclemencias del tiempo y elevarán nuestras plegarias hasta los cielos»."
 pam_great_projects_events.0007.desc.architect_says: "Dice [architect.GetSheHe|l]."
 pam_great_projects_events.0007.desc.outro: "\n\nAl posar la vista en una bóveda ya terminada, me recuerdan las costillas del gran pez que se tragó a Jonás. Tal es la gloria de la Casa de Dios, que uno puede sentirse transportado al fondo del mar o a las estrellas."
 pam_great_projects_events.0007.a: "Adornad las bóvedas con el cielo estrellado."
 pam_great_projects_events.0007.a.tt: "Una vez terminada la [grand_cathedral|El], su [point_of_interest|El] mejorará el [trait_level_track_xp|El] a quienes posean el [trait|El] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0007.b: "Predicad un sermón sobre el arrepentimiento, como el de Jonás."
 pam_great_projects_events.0007.b.tt: "Tu [faith|El] gana #P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! de [fervor|El] @fervor_icon!"
 pam_great_projects_events.0007.c: "Que los albañiles sigan con su trabajo."
 fervor_gain_cathedral_jonah_sermon: "Sermón sobre el arrepentimiento dado en la obra de la [grand_cathedral|El]"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: proyectando la voz de Dios"
 pam_great_projects_events.0008.desc.intro: "La construcción progresa bien, pero la catedral carece de una voz que convoque a los fieles desde cada rincón de [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.architect: "\n\n¡[architect.GetFirstName] me dice que debemos fundir una gran campana de bronce!"
 pam_great_projects_events.0008.desc.no_architect: "\n\n¡Debemos forjar una campana!"
 pam_great_projects_events.0008.desc.need_bell: "Una empresa arriesgada y costosa; las arcas de [founder.GetPrimaryTitle.GetNameNoTier] aún se están recuperando del coste de la materia prima sola."
 pam_great_projects_events.0008.desc.plague_named: "\n\nLamentablemente, el campanero falleció en la última epidemia de [epidemic.GetName|l]."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nLamentablemente, el campanero falleció en la reciente peste."
 pam_great_projects_events.0008.desc.outro: "Su hijo, [bell_maker_son.GetFirstName], me asegura que su padre le transmitió el secreto en su lecho de muerte y que puede fundir la campana."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName], un joven y ambicioso artista del bronce que ha aprendido de un maestro local, se presenta ante nosotros. Ansía probar su valía forjando una campana digna de [owner.GetPrimaryTitle.GetNameNoTier] y su [cathedral_building.GetName|l]."
 pam_great_projects_events.0008.a: "Si no lo consigue, lo mataré."
 pam_great_projects_events.0008.a.tt: "Si la fundición de la campana sale mal, ejecutarás a [bell_maker_son.GetShortUIName]"
 pam_great_projects_events.0008.belltower_may.tt: "Puede construirse una [GetDomicileBuilding('cathedral_belltower_02').GetName|V|l] en el [cathedral_complex|El] de [owner.GetShortUIName]"
 pam_great_projects_events.0008.aa: "Si fracasa, lo desollaré vivo."
 pam_great_projects_events.0008.b: "Podría ser un instrumento del Señor."
 pam_great_projects_events.0008.b.tt: "Depositas tu confianza en [bell_maker_son.GetShortUIName] para que funda la campana"
 pam_great_projects_events.0008.b.flavor: "¿Acaso David no era un joven pastor cuando mató a Goliat?"
 pam_great_projects_events.0008.c: "Busca una apuesta más segura, aunque no sea el hijo de un maestro."
 pam_great_projects_events.0008.duel.success: "¡La fundición ha salido bien! Podrá construirse una [GetDomicileBuilding('cathedral_belltower_02').GetName|Vl] en el [cathedral_complex|El] de [owner.GetShortUIName]"
 pam_great_projects_events.0008.duel.failure: "La fundición sale mal… Debes decidir cómo actuar ahora"
 pam_cathedral_bell_casting_duel: "[learning|E] de [CHARACTER.GetShortUIName]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: y Dios habló"
 pam_great_projects_events.0009.desc.body: "Observo a [bell_maker_son.GetFirstName] corriendo de un lado para otro, organizando a los trabajadores.\n\nDesafía constantemente a la vieja cuadrilla de su padre, insistiendo a su manera en elegir el emplazamiento para el hoyo, la arcilla adecuada para el molde y el fuego de los hornos."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] y yo observamos a [bell_maker_son.GetFirstName] corriendo de un lado para otro, organizando a los trabajadores.\n\nContradice y desafía constantemente a la vieja cuadrilla de su padre, insistiendo a su manera en elegir el emplazamiento para el hoyo, la arcilla adecuada para el molde y el fuego de los hornos."
 pam_great_projects_events.0009.desc.success_end: "\n\nEl bronce fundido se escurre suavemente dentro del molde, como guiado por la mano de Dios, y emerge completo. A continuación, se iza y lanza un llamamiento claro y rotundo a todos los [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n«¡Acudid a la casa del Señor!»."
 pam_great_projects_events.0009.a: "Que [province.GetNameNoTooltip] y sus terrenos de [province.Custom('GetTerrainType')|l] oigan la voz de Dios."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: ¡un presagio de fatalidad!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nEl bronce fundido chilla en el molde, pero sale intacto. A continuación, se iza y se tira hacia atrás, pero cuando el badajo golpea el pie de la campana, solo se oye un ruido sordo, seguido de un crujido. ¡Un presagio de fatalidad!"
 pam_great_projects_events.0010.a: "Las promesas deben cumplirse."
 pam_great_projects_events.0010.a.tt: "Se ejecuta a [bell_maker_son.GetShortUIName]"
 pam_great_projects_events.0010.b: "Las grietas en la campana son castigo suficiente."
 pam_great_projects_events.0010.b.faith: "El Señor aún tiene planes para él."
 pam_great_projects_events.0010.c: "Fundid el bronce. Forjad algo más afilado."
 pam_great_projects_events.0010.c.tt: "Reconvierten la campana agrietada en un mecanismo de tortura; [bell_maker_son.GetShortUIName] es su primera víctima. Los futuros artesanos de [founder.GetCapitalLocation.GetNameNoTooltip] aprenderán lo que es la obediencia."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Ganas en cambio [experience|El] de [intrigue_lifestyle|El]"
 pam_great_projects_events.0010.d: "Que sea una lección de humildad."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: como si fuera obra del Señor"
 pam_great_projects_events.0011.desc.intro: "Al inspeccionar el progreso de la [cathedral_building.GetName|l] de [province.GetNameNoTooltip], me ataca los oídos un chirrido agudo de una enorme estructura de madera girando."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] señala la gigantesca rueda con un par de obreros caminando en su interior."
 pam_great_projects_events.0011.desc.no_architect: "\n\nLocalizo el origen del ruido, una gigantesca rueda con un par de obreros caminando en su interior."
 pam_great_projects_events.0011.desc.outro: "\n\nComo por obra de Dios, sus cuerdas y poleas izan enormes [Glossary('sillares','ASHLAR_GLOSS')] de piedra recién cortada y cubos de mortero hasta el tejado, aún en construcción. Contemplo con asombro esa carga que habría partido la espalda a los peones que trabajaban en el patio de abajo."
 pam_great_projects_events.0011.a: "Los [founder.GetCulture.GetCollectiveNounNoTooltip] debemos averiguar lo que podamos de la gran rueda."
 pam_great_projects_events.0011.a.tt: "Tu [culture|El] gana #P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! @culture_icon! de progreso hacia su [cultural_fascination|El] actual"
 pam_great_projects_events.0011.b: "¡De esto podrían beneficiarse muchos proyectos de [founder.GetCapitalLocation.GetNameNoTooltip]!"
 pam_great_projects_events.0011.c: "Impresionante, pero yo dejaría esas proezas al Señor."
 ASHLAR_GLOSS: "El sillar es una piedra cortada y labrada con precisión, escuadrada y pulida en el suelo. En la construcción de catedrales, hacía falta una planificación minuciosa para que las piedras encajaran una vez izadas a la altura necesaria."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: un llamamiento superior"
 pam_great_projects_events.0013.desc: "El golpe sordo de los mazos del carpintero resuena sobre nosotros, presagio de la acústica que pronto bañará a los fieles en la Palabra de Dios.\n\n[architect.GetFirstName] explica: «Será un coro elevado y modesto, desde el que los canónigos dirigirán la liturgia, ¡nuestra propia [Glossary('cantoría','CANTORIA_GLOSS')]! En efecto, hemos de emplear una voz distinta cuando nos dirigimos a nuestro Señor que cuando lo hacemos a los hombres». Luego, llama a un niño del coro, [choir_boy.GetFirstName].\n\nEl chiquillo se sube de un salto al andamio y exhala una nota angelical; mientras esta resuena por los muros y penetra en mi cuerpo, es como si Dios hubiera pasado a través de mí."
 pam_great_projects_events.0013.a: "Ampliad ese espacio, cuantas más voces mejor."
 pam_great_projects_events.0013.b: "Este ángel debe honrar mi corte."
 pam_great_projects_events.0013.castrato: "Reserva esta voz para la cantoría del Señor."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U] es castrado para que su voz no se quiebre"
 pam_great_projects_events.0013.c: "¡Estas teatralidades son una artimaña para exprimirme aún más!"
 pam_great_projects_events.0013.d: "Esto me abruma, debo marcharme."
 CANTORIA_GLOSS: "Una cantoría es una galería elevada para cantar en una iglesia, a menudo situada sobre el coro o cerca del crucero, donde cantantes, y más tarde órganos, dirigían la liturgia."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: su amor inquebrantable"
 pam_great_projects_events.0012.desc: "¡La fachada oeste está terminada! Su portada está lista para recibir a los fieles a través del [Glossary('nártex','NARTHEX_GLOSS')]. Puede llevar toda una vida acabar semejante [cathedral_building.GetName|l], pero los buenos cristianos de [owner.GetPrimaryTitle.GetNameNoTier] deben tener fe en el futuro del amor inquebrantable del Señor. Comienza mi sermón…\n\n#EMP «[ROOT.Char.Custom('RandomBibleQuote')]»#!\n\n… y les dejaré esta lección de las Escrituras."
 NARTHEX_GLOSS: "El nártex es el vestíbulo situado a la entrada de una iglesia, entre las puertas occidentales y la nave. Acogía a los fieles en un espacio sagrado y, en ritos más estrictos, mantenía a los penitentes y catecúmenos apartados de la congregación en la misa."
 pam_great_projects_events.0012.a: "«Bienaventurados los que trabajan por la paz…»."
 pam_great_projects_events.0012.a.flavor: "«[Glossary('… porque ellos serán llamados hijos de Dios.','MATTHEW_5_9_GLOSS')]»."
 pam_great_projects_events.0012.a.tt: "Cada [county|El] [owner.GetFaith.GetAdherentName] de [owner.GetPrimaryTitle.GetNameNoTier] gana [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V] durante #V 10 años#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "«Ve a observar a la hormiga, perezoso…»."
 pam_great_projects_events.0012.b.flavor: "«[Glossary('… fíjate en sus costumbres y aprende.','PROVERBS_6_6_GLOSS')]»."
 pam_great_projects_events.0012.b.tt: "Cada [county|El] [owner.GetFaith.GetAdherentName] de [owner.GetPrimaryTitle.GetNameNoTier] gana [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V] durante #V 10 años#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "«Os ruego, hermanos…»."
 pam_great_projects_events.0012.c.flavor: "«[Glossary('… en nombre de nuestro Señor Jesucristo, que digáis todos lo mismo y que no haya divisiones entre vosotros. Estad bien unidos con un mismo pensar y un mismo sentir.','1_CORINTHIANS_1_10_GLOSS')]»."
 pam_great_projects_events.0012.c.tt: "Cada [county|El] [owner.GetFaith.GetAdherentName] de [owner.GetPrimaryTitle.GetNameNoTier] gana [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V] durante #V 10 años#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "«Estad siempre alegres. Sed constantes en orar…»."
 pam_great_projects_events.0012.d.flavor: "«[Glossary('… Dad gracias en toda ocasión: esta es la voluntad de Dios en Cristo Jesús respecto de vosotros. No apaguéis el espíritu, no despreciéis las profecías.','1_THESSALONIANS_5_16_20_GLOSS')]»."
 pam_great_projects_events.0012.d.tt: "Cada [county|El] [owner.GetFaith.GetAdherentName] de [owner.GetPrimaryTitle.GetNameNoTier] gana [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V] durante #V 10 años#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "«Corramos, con constancia, en la carrera que nos toca…»."
 pam_great_projects_events.0012.e.flavor: "«[Glossary('… renunciando a todo lo que nos estorba y al pecado que nos asedia.','HEBREWS_12_1_GLOSS')]»."
 pam_great_projects_events.0012.e.tt: "Cada [county|El] [owner.GetFaith.GetAdherentName] de [owner.GetPrimaryTitle.GetNameNoTier] gana [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V] durante #V 10 años#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "«Abre sus manos al necesitado…»."
 pam_great_projects_events.0012.f.flavor: "«[Glossary('… y tiende sus brazos al pobre.','PROVERBS_31_20_GLOSS')]»."
 pam_great_projects_events.0012.f.tt: "Cada [county|El] [owner.GetFaith.GetAdherentName] de [owner.GetPrimaryTitle.GetNameNoTier] gana [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V] durante #V 10 años#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak Los [rulers|El] [owner.GetFaith.GetAdherentNamePlural] de la [archdiocese|El] se [Concept('behave', 'comportarán')|E] de forma más honrada y compasiva#!#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak Los [rulers|El] [owner.GetFaith.GetAdherentNamePlural] de la [archdiocese|El] se [Concept('behave', 'comportarán')|E] de forma más diligente y enérgica#!#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak Los [rulers|El] [owner.GetFaith.GetAdherentNamePlural] de la [archdiocese|El] se [Concept('behave', 'comportarán')|E] de forma más sociable y honorable#!#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak Los [rulers|El] [owner.GetFaith.GetAdherentNamePlural] de la [archdiocese|El] se [Concept('behave', 'comportarán')|E] de forma más compasiva y menos codiciosa#!#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak Los [rulers|El] [owner.GetFaith.GetAdherentNamePlural] de la [archdiocese|El] se [Concept('behave', 'comportarán')|E] de forma más ferviente y con fe más decidida#!#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak Los [rulers|El] [owner.GetFaith.GetAdherentNamePlural] de la [archdiocese|El] se [Concept('behave', 'comportarán')|E] de forma más ferviente y enérgica#!#!"
 pam_cathedral_west_portal_sermon_toast: "Un sermón en la catedral de [owner.GetPrimaryTitle.GetNameNoTier]"
 #Grand Cathedral is completed
 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: la coronación de las torres"
 pam_great_projects_events.0020.desc: "Por fin hay una cruz rematando cada torre, un símbolo de cómo se encontraba Cristo hace años en aquella colina del [Glossary('Gólgota','GOLGOTHA_GLOSS')]. Allí permanecen, como testimonio de Su sufrimiento a cambio de nuestra salvación, con la promesa de Su sangre fluyendo cada sabbat, para purgarnos de nuestros pecados.\n\nDesde que comenzó la construcción, los hijos se convirtieron en padres, y los padres en ancianos que murieron y fueron enterrados. Y sin embargo, su trabajo duro, su sudor y su sangre han quedado inmortalizados en la piedra.\n\nLos imperios pueden caer, pero la [cathedral_building.GetName|l] en [province.GetName] será eterna como el amor de Dios."
 pam_great_projects_events.0020.a: "¡Venid de todas partes para rendir culto a nuestro lado!"
 GOLGOTHA_GLOSS: "Gólgota, que deriva del latín #EMP Calvariae locus#! o «lugar de la calavera», fue una colina con forma de cráneo en el Jerusalén romano y el lugar donde se crucificó a Jesús. La ejecución tuvo lugar fuera de los muros de la ciudad, no muy lejos de donde estaba la tumba donde fue enterrado. El lugar se encuentra ahora en la Basílica del Santo Sepulcro, cerca de la [GetBuilding('dome_of_the_rock_01').GetName|V]"
 poi_grand_cathedral_visit: "Visitada la catedral de [province.GetNameNoTooltip]"
