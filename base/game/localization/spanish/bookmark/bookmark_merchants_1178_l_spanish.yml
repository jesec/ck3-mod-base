l_spanish:
 bm_1178_merchants: "Güelfos y gibelinos"
 bm_1178_merchants_desc: "El conflicto entre güelfos y gibelinos viene de largo. Comenzó con la crisis de las investiduras del siglo XI y lleva un siglo bullendo.\n\nCon Federico Barbarroja como káiser, el enfrentamiento ha aumentado e Italia entera elige bando. Los gibelinos están con el káiser y los güelfos se ponen de parte del papa de Roma.\n\n#bold El choque se propaga dentro de las repúblicas italianas y entre ellas. Elige tu bando en el conflicto y llévalo a la victoria.#!"
 bookmark_merchants_1178_marco_sanudo: "Marco Sanudo"
 bookmark_merchants_1178_marco_sanudo_subheading: "Patricio de Venecia"
 bookmark_merchants_1178_enrico_dandolo: "Enrico Dandolo"
 bookmark_merchants_1178_marco_sanudo_desc: "Los Sanudo son una de las familias nobles más antiguas de Venecia, supuestamente emparentadas con la legendaria familia Candiano que ocupó varias veces el puesto de dux en la cima de su poder.\n\nMarco es el vástago joven a la cabeza de la casa tras la muerte de su padre y está próximo a su tío Enrico Dandolo, el hombre que pasaría a la historia como el artífice de la Cuarta cruzada.\n\n#bold ¿Cumplirás tu destino y te convertirás en duque del Archipiélago?#!"
 bookmark_merchants_1178_humbert_savoy: "Humberto III de Saboya"
 bookmark_merchants_1178_humbert_savoy_subheading: "Duque de Saboya #b #bol (güelfo)#!#!"
 bookmark_merchants_1178_thomas_savoy: "Tomás"
 bookmark_merchants_1178_humbert_savoy_desc: "Como duque de Saboya, Humberto ha demostrado ser un hombre piadoso al donar con generosidad a los monasterios locales y retirarse totalmente de la vida secular durante un tiempo tras el fallecimiento de su tercera esposa.\n\nAl ponerse del lado de los güelfos, ha estado a malas con Federico Barbarroja y sus tierras han sido conquistadas y saqueadas.\n\n#bold ¿Podrás defender las tierras saboyardas frente al káiser?#!"
 bookmark_merchants_1178_guido_guerra: "Guido Guerra III"
 bookmark_merchants_1178_guido_guerra_subheading: "Conde de Casentino #color_yellow #bol (gibelino)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "Rinaldo"
 bookmark_merchants_1178_guido_guerra_desc: "Los Guidi han sido condes en la parte alta del valle del Arno desde hace siglos, y pocas casas de la Toscana pueden presumir de un linaje tan extenso.\n\nGuido Guerra ha dedicado su vida al servicio imperial: resistió en el asedio de Milán y el privilegio de Barbarroja confirma sus castillos, derechos y minas en ambas laderas de los Apeninos.\n\n#bold ¿Podrás hacer que tu condado pase a la historia?#!"
 bookmark_merchants_1178_speronella_dalesmanni: "Speronella Dalesmanni"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Patricia de Padua #b #bol (güelfa)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "Ezzelino da Romano"
 bookmark_merchants_1178_pietro_iii: "Pietro Traversari"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "Cuando era adolescente, Speronella fue secuestrada por el vicario imperial de Padua, Pagano della Torre. Cuando al final fue liberada por su hermano, el vicario fue derrocado, y con su caída, la ciudad de Padua se convirtió en una comuna libre.\n\n#bold Ahora que eres una mujer libre, ¿podrás aprovechar tu posición legendaria y convertirla en poder político o en una fortuna?#!"
 bookmark_merchants_1178_konrad_urslingen: "Konrad von Urslingen"
 bookmark_merchants_1178_konrad_urslingen_subheading: "Duque de Spoleto #color_yellow #bol (gibelino)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "Jutta"
 bookmark_merchants_1178_konrad_urslingen_desc: "Como joven duque alemán que gobierna un ducado italiano a discreción del emperador, Konrad mantiene Spoleto en el corazón de la península, donde se cruzan todos los caminos desde el norte hasta el sur. Su autoridad depende del favor imperial, pero el emperador está lejos, al otro lado de los Alpes.\n\n#bold ¿Podrás hacer tuyas las tierras centrales de la península italiana o el pueblo rechazará tu poder?#!"
