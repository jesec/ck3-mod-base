l_spanish:
 bm_1066_merchants: "Canales de comercio"
 bm_1066_merchants_desc: "Para que un señorío sobreviva no necesita solo sustentarse, sino mantener en movimiento el flujo de bienes. Después de todo, un gobernante no triunfa en grandes campañas solo por sus derechos de nacimiento; es el oro el que proporciona las armas, provisiones y ayuda extranjera que refuerzan a sus ejércitos.\n\nHay mercaderes detrás de cada intercambio, de cada trato hecho, trasladando caravanas y barcos por rutas legendarias. Y si no consiguen el reconocimiento que se merecen, se harán un lugar a sí mismos y darán pie a un nuevo tipo de ciudad, gobernada por sus propios ciudadanos.\n\n#bold Cuando la riqueza se convierte en la medida del poder, ¿podrás liderar a tu familia hasta dominar el mercado y conseguir un imperio comercial duradero?"
 bookmark_merchants_domenico_contarini: "Domenico Contarini"
 bookmark_merchants_domenico_contarini_subheading: "Dux de Venecia"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "ibn Jarada"
 bookmark_merchants_ibn_jarada_subheading: "Mercader de Bagdad"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "Sūn Zhōng"
 bookmark_merchants_sun_zhong_subheading: "Mercader de Mingzhou"
 bookmark_merchants_sun_zhong_desc: "El puerto de Mingzhou es donde el Song se encuentra con el mar oriental y donde Sūn Zhōng se convirtió en el hombre que mantiene el lugar ocupado. Seda y porcelana salen de sus almacenes hacia Japón y Goryeo; el incienso y la plata van en la dirección opuesta. Los funcionarios que gravan el tráfico han aprendido que un regalo a tiempo es más barato que un informe.\n\n#bold El extremo oriental de la Ruta de la Seda es un puerto, no una pista de caravanas. ¿Podrás convertir el nombre Sūn en una corriente que ninguna corte pueda desviar?#!"
 bookmark_merchants_vitale_faliero: "Vitale Faliero"
 bookmark_merchants_vitale_faliero_subheading: "Patricio de Venecia"
 bookmark_merchants_vitale_faliero_desc: "Los Faliero son una de las casas de mercaderes más ambiciosas de Venecia, y Vitale ha conducido su compañía más al este de lo que se atreven sus rivales. Rutas comerciales bizantinas, presión normanda en el Adriático y rivales en el consejo de la ciudad le presionan por todas partes.\n\n#bold Venecia se encuentran en una encrucijada entre dos mundos. ¿Llevarás a los Faliero a dominar ambos?#!"
 bookmark_merchants_wuhsha_al_dallala: "Whusha «la Negociante»"
 bookmark_merchants_wuhsha_al_dallala_subheading: "Negociante cairota"
 bookmark_merchants_wuhsha_al_dallala_desc: "Como mujer de una riqueza inmensa, Whusha al-Dallala guarda registros de sus fortunas, así como de sus enemigos.\n\nSu naturaleza independiente le ha costado ser expulsada de la sinagoga. Pero Wuhsha sabe ser paciente y aguarda el momento para buscar venganza sobre aquellos que la perjudicaron.\n\n#bold ¿Tendrás lo que hace falta para aprovechar los préstamos para humillar a tus oponentes?#!"
 bookmark_merchants_greek_salvidi_1: "Hillel Salvidi"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "Abu Sa'id"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "Hijo de Whusha"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "Nattal Sahu"
 bookmark_merchants_nattal_sahu_subheading: "Príncipe-mercader de Delhi"
 bookmark_merchants_nattal_sahu_desc: "En los mercados de Yoginipur, el nombre de Sahu infunde respeto. Jefe de la comunidad de mercaderes jainistas de Delhi y consejero de confianza del rey Tomara Anangapal II, Nattal ha tejido una red comercial que se extiende desde los puertos occidentales a los mercados de Bengala.\n\n#bold Con la confianza de un rey y el ingenio de un mercader, ¿podrás construir algo que sobreviva a ambos?#!"
 bookmark_merchants_new_merchant_company: "Personalizar personaje"
 bookmark_merchants_new_merchant_company_subheading: "Mercader de la Ruta de la Seda"
 bookmark_merchants_new_merchant_company_desc: "La Ruta de la Seda no pertenece ni a reyes ni a emperadores. Pertenece a aquellos lo bastante osados para recorrerla.\n\nFunda tu propia compañía de mercaderes en la encrucijada de Oriente y Occidente. Construye un imperio comercial caravana a caravana y forja conexiones desde los bazares de Samarcanda a los puertos mediterráneos.\n\n#bold ¿Resonará el nombre de tu familia en un centenar de ciudades?#!"
