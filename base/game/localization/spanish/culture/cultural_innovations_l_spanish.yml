 unlock_maa_mangonel: "Puede reclutar [GetMaA('mangonel').GetName|l] como [men_at_arms|lE]"
 innovation_heavy_plow: "Arado pesado"
 innovation_heavy_plow_desc: "Hasta los arados de hierro más pesados se pueden arrastrar fácilmente usando bueyes o caballos si se montan sobre ruedas y tiran de ellos varios animales. Esta innovación nos permite labrar terrenos que, de otro modo, serían difíciles o hasta imposibles de cultivar."
 innovation_heavy_plow_eri: "Sistema de eri"
 innovation_heavy_plow_eri_desc: "Una serie de depósitos en terraplenes recogen el monzón y lo conservan durante los meses secos, lo que nos permite plantar, cultivar y sembrar todo el año."
 innovation_heavy_plow_transplanting: "Trasplante e injertos"
 innovation_heavy_plow_transplanting_desc: "Al utilizar técnicas de cuidado y propagación de plantas, aumentaremos enormemente nuestra cosecha."
 culture_parameter_stone_forts: "[GetBuildingType('wall_wardens_offices_1').GetName] precisa [GetTradeGoodType('trade_good_stone').GetNameWithIcon] en lugar de [GetTradeGoodCategory('trade_category_carpentry_supplies').GetName|l]"
 culture_parameter_heavy_plow: "[GetDistrictType('grain_district').GetName] ahora necesitará [GetTradeGoodType('trade_good_iron').GetNameWithIcon] y [GetTradeGoodCategory('trade_category_beasts_of_burden').GetName|l] en lugar de solo [GetTradeGoodType('trade_good_cattle').GetNameWithIcon]"
 innovation_prospecting: "Prospección"
 innovation_prospecting_desc: "Al buscar activa y metódicamente nuevas vetas de mineral podemos ampliar extensamente la industria minera en nuestro señorío."
 innovation_coppicing: "Vástagos"
 innovation_coppicing_desc: "Si conservamos y talamos árboles de un modo metódico y organizado, aumentaremos enormemente nuestra producción silvicultora para llevar a cabo operaciones derivadas, como la producción de carbón vegetal y leña."
 innovation_monasticism: "Monacato"
 innovation_monasticism_desc: "Si bien los monasterios no son nuevos, se han vuelto más grandes y corrientes. Comunidades religiosas enteras ahora surgen en torno a lo que en el pasado fueron retiros aislados, con su propia economía y sus correspondientes asentamientos seculares."
 innovation_craft_ordinances: "Ordenanzas de oficios"
 innovation_craft_ordinances_desc: "Si bien puede que a los artesanos no les hagan mucha gracia las regulaciones, sí aprecian que se les dé el derecho a crear normas para sus oficios especializados. Es mejor para todos que se controlen la calidad y los precios."
 innovation_merchant_law: "Derecho mercantil"
 innovation_merchant_law_desc: "Al poner por escrito las costumbres que han surgido para regular el comercio y hacer que se cumplan al pie de la letra, nos aseguraremos de que en nuestras tierras el comercio fluya libre y ordenadamente."
 innovation_vaulting: "Construcción de bóvedas"
 innovation_vaulting_desc: "Las bóvedas altas y esbeltas son a la vez inspiradoras de ver y un modo más seguro de poner techo a grandes edificios. Las bóvedas que ahora construyen nuestros albañiles emplean menos piedra y crean edificios que durarán más."
 innovation_putting_out_system: "Sistema de producción a destajo"
 innovation_putting_out_system_desc: "Al tener una organización global para la producción diaria en cada cabaña o granja de nuestro señorío, conseguiremos una mayor eficiencia. Los mercaderes se ocuparán de comprar la materia prima, así como de la compra del producto final."
 innovation_deep_mining: "Minería profunda"
 innovation_deep_mining_desc: "Para crear minas más profundas que antes, se nos ha ocurrido una serie de soluciones técnicas, galerías apuntaladas, mejor drenaje y molinetes. Estas mejoras nos permiten seguir vetas a mayor profundidad de lo que nadie lo ha hecho antes que nosotros."
 innovation_pilot_books: "Libros de práctico"
 innovation_pilot_books_desc: "La navegación es un asunto peligroso, y sin prácticos locales, la mayoría de los barcos estarían perdidos hasta en una costa relativamente segura pero desconocida. Al trazar cartas de todo cabo, bajío y fondeadero, con sus demoras y distancias, podremos conservar para la eternidad lo que de otro modo moriría con una sola persona."
 innovation_pilot_books_portolan: "Cartas portulanas"
 innovation_pilot_books_portolan_desc: "La navegación es un asunto peligroso, y sin prácticos locales, la mayoría de los barcos estarían perdidos hasta en una costa relativamente segura pero desconocida. Al trazar cartas con líneas de demora, marcadas con la rosa de los vientos, y poner por escrito todo cabo, bajío y fondeadero entre ellas, podremos conservar para la eternidad lo que de otro modo moriría con una sola persona."
 innovation_agronomy: "Agronomía"
 innovation_agronomy_desc: "Trabajar la tierra puede ser duro, y a menudo, solo se enseña de un granjero a otro. Al recopilar tal conocimiento y poner por escrito tratados sobre cosechas y la cría de animales, podemos extender un conocimiento de eficacia demostrada y convertir tradiciones en métodos."
 innovation_bricks: "Ladrillos"
 innovation_bricks_desc: "Si bien a nuestros antepasados no les eran extraños los ladrillos, su conocimiento no está tan difundido como antes. La tecnología para la fabricación de un modo fiable y uso de este sencillo material de construcción creado por el hombre permite construir cualquier casa de un modo más rápido y eficaz."
