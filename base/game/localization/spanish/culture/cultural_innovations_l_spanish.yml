 unlock_maa_cannon: "Puede reclutar [GetMaA('cannon').GetName|l] como [men_at_arms|lE]"
 unlock_maa_bombard: "Puede reclutar [GetMaA('bombard').GetName|l] como [men_at_arms|lE]"
