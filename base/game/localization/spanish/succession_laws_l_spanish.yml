 clerical_appointment_law_effects: "\nUn tipo de [appointment_succession_law|lE] usado por [governments|lE] [Concept('ecclesiastical', 'eclesiásticos')|E] y [Concept('theocratic', 'teocráticos')|E] [Concept('christian', 'cristianos')|E]. Según el $clerical_appointment_law$, la candidatura con la mayor [Concept('candidate_score', 'puntuación')|E] heredará el [title|lE] y sus [holdings|lE] asociadas.\n\nTodo [adult|lE] de la misma [faith|lE] entre la [close_family|lE], [house|lE], [councillors|lE], titulares de [Concept('court_position', 'puestos en la corte')|E], [vassals|lE] o [clergy|lE] de la [clerical_region|E] del [holder|El] puede luchar por conseguir el [title|El] gastando [piety|lE].\n"
