 male_only_law_effects: "$EFFECT_LIST_BULLET$A las mujeres no se les permite heredar\n$EFFECT_LIST_BULLET$Las mujeres no pueden heredar [claims|El]\n$EFFECT_LIST_BULLET$Los [rulers|El] varones pueden tener [concubines|El] o múltiples [spouses|El] si su [faith|El] tiene la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName] o [GetDoctrineType('doctrine_polygamy').GetBaseName]"
 male_preference_law_effects: "$EFFECT_LIST_BULLET$La mujer tiene primacía sobre el varón a la hora de la sucesión\n$EFFECT_LIST_BULLET$Los [rulers|El] masculinos pueden tener [concubines|El] o múltiples [spouses|El] si su [faith|El] tiene la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName] o [GetDoctrineType('doctrine_polygamy').GetBaseName]"
 equal_law_effects: "$EFFECT_LIST_BULLET$Hombres y mujeres son iguales en la sucesión\n$EFFECT_LIST_BULLET$Todos los [rulers|El] pueden tener [concubines|El] o múltiples [spouses|El] si su [faith|El] tiene las [Concept( 'doctrine', 'doctrinas' )|E] [GetDoctrineType('doctrine_concubines').GetBaseName] o [GetDoctrineType('doctrine_polygamy').GetBaseName]"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$La mujer tiene primacía sobre el varón a la hora de la sucesión\n$EFFECT_LIST_BULLET$Los [rulers|El] femeninos pueden tener [concubines|El] o múltiples [spouses|El] si su [faith|El] tiene la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName] o [GetDoctrineType('doctrine_polygamy').GetBaseName]"
 female_only_law_effects: "$EFFECT_LIST_BULLET$A los varones no se les permite heredar\n$EFFECT_LIST_BULLET$Los varones no pueden heredar [claims|El].\n$EFFECT_LIST_BULLET$Los [rulers|El] femeninos pueden tener [concubines|El] o múltiples [spouses|El] si su [faith|El] tiene la [doctrine|El] [GetDoctrineType('doctrine_concubines').GetBaseName] o [GetDoctrineType('doctrine_polygamy').GetBaseName]"
 gender_preference_law_not_for_clergy_tt: "Los [rulers|El] eclesiásticos y teocráticos solo pueden usar la [gender_law|El] [GetLaw('male_only_law').GetName], [GetLaw('female_only_law').GetName] o [GetLaw('equal_law').GetName], como dicta la [doctrine|El] de género de miembros del clero de su [rite|El]"
 SUCCESSION_FORM_NAME: "[Character.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName] [Character.GetActiveLawInGroupWithFlag('succession_order_laws').GetName]"
 feudal_elective_succession_law: "Electiva feudal"
 princely_elective_succession_law: "Electiva principesca"
 feudal_elective_succession_law_effects: "El [ruler|lE] y todos los [vassals|lE] directos [de_jure|lE] de uno o dos [ranks|lE] por debajo del [title|lE] pueden proponer un [title_heir|lE] de entre ellos y los [Concept( 'close_family', 'familiares cercanos' )|E] del gobernante."
 princely_elective_succession_law_effects: "El emperador y los #V 7#! [prince_electors|lE] pueden proponer un [title_heir|lE] de entre ellos, cualquier hijo [legitimate|lE] y hermanos del emperador, así como grandes [vassals|lE] [de_jure|lE] del imperio.\n\nSi un [title|lE] de [elector|lE] preferido está en manos de infieles, fuera del [realm|lE] o ha sido destruido, otro vasallo de iure asumirá su lugar. Esta [succession_law|lE] da gran importancia a la [faith|lE] y a la [piety|lE]."
 gaelic_elective_succession_law: "Electiva de tanistry"
 gaelic_elective_succession_law_effects: "El [ruler|lE] y todos los [vassals|lE] por encima del [rank|lE] de [baron|lE] y uno o dos niveles por debajo del [title|lE] pueden proponer un [title_heir|lE] (el tanista) entre los miembros de la [dynasty|lE] del gobernante. Los vasallos suelen favorecer a parientes más mayores y lejanos por encima de la [Concept( 'close_family', 'familia cercana' )|E]."
 saxon_elective_succession_law: "Electiva sajona"
 saxon_elective_succession_law_subname: "Witenagemot"
 saxon_elective_succession_law_effects: "El [ruler|lE] y todos los vasallos directos y adultos [de_jure|lE] de uno o dos [ranks|lE] por debajo del [title|lE] pueden proponer como [title_heir|lE] al [powerful_vassal|lE] más fuerte, a los hijos [Concept( 'legitimate', 'legítimos' )|E] del gobernante o a cualquier otro [claimant|lE]."
 scandinavian_elective_succession_law: "Electiva escandinava"
 scandinavian_elective_succession_law_subname: "Thing"
 scandinavian_elective_succession_law_effects: "El [ruler|lE] y todos los [vassals|lE] [de_jure|lE] (salvo los barones) pueden proponer un [title_heir|lE] de entre los [Concept( 'extended_family', 'parientes lejanos' )|E] del gobernante y otros [claimants|lE] disponibles. El [voting_power|lE] en esta [succession_law|lE] está influido por el [county_development|lE] total del [domain|lE] del [elector|lE] y la [county_opinion|lE] de la [capital|lE]."
 feudal_elective_candidates: "Familia cercana, pretendientes y electores"
 feudal_elective_candidates_tooltip: "Para ser un candidato válido en la electiva feudal, un personaje debe cumplir una de estas condiciones:\n$EFFECT_LIST_BULLET$Ser [Concept( 'close_family', 'familiar cercano' )|E] legítimo del gobernante actual sin estar en la línea para heredar una teocracia o república. No se puede nombrar a los vástagos de un candidato\n$EFFECT_LIST_BULLET$Ser [claimant|lE] al título, sin estar en la línea para heredar una teocracia o república\n$EFFECT_LIST_BULLET$Ser [elector|lE] feudal válido al título"
 feudal_elective_electors: "Gobernante y vasallos"
 feudal_elective_electors_tooltip: "Para ser un [elector|lE] válido en la electiva feudal, un vasallo debe cumplir todas estas condiciones:\n$EFFECT_LIST_BULLET$Ser vasallo [de_jure|lE] al título\n$EFFECT_LIST_BULLET$Ser vasallo directo del título\n$EFFECT_LIST_BULLET$Estar solo uno o dos [ranks|lE] por debajo del título"
 princely_elective_candidates: "$feudal_elective_candidates$"
 princely_elective_candidates_tooltip: "Para ser un candidato válido en la electiva principesca, un personaje debe cumplir una de estas condiciones:\n$EFFECT_LIST_BULLET$Ser [Concept( 'close_family', 'familiar cercano' )|E] legítimo del gobernante actual sin estar en la línea para heredar una teocracia o república. No se puede nombrar a los vástagos de un candidato\n$EFFECT_LIST_BULLET$Ser [claimant|lE] al título, sin estar en la línea para heredar una teocracia o república\n$EFFECT_LIST_BULLET$Ser [elector|lE] feudal válido al título"
 princely_elective_electors: "Príncipes electores"
 princely_elective_electors_tooltip: "Además de tal [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsName|l], los [holders|lE] de los siguientes [titles|lE] se prefieren como [prince_electors|E] bajo [SuccessionElectionWindow.GetSuccessionLaw.GetName|l]:[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nSi alguno de estos no está creado, no está en posesión de un [vassal|lE] imperial [de_jure|lE], ya está en posesión de otro elector, o la [religion|lE] del [holder|lE] es distinta de la del emperador, se seleccionará otro título de iure que posea un vasallo imperial directo o [independent_ruler|lE] de acuerdo a estos criterios:\n$EFFECT_LIST_BULLET$Se favorece a [rulers|lE] de la [faith|lE] y [culture|lE] del emperador\n$EFFECT_LIST_BULLET$Se favorece a gobernantes de tipo [theocratic|lE] y [feudal|lE]"
 gaelic_elective_candidates: "Miembros de la dinastía"
 gaelic_elective_candidates_tooltip: "Todos los miembros legítimos de la [dynasty|lE] del gobernante actual que no estén en la línea sucesoria de una teocracia o república son candidatos válidos de acuerdo con la tanistría. No se puede nombrar a los vástagos de un candidato."
 gaelic_elective_electors: "$feudal_elective_electors$"
 gaelic_elective_electors_tooltip: "Para ser un [elector|lE] válido bajo la tanistría, un vasallo debe cumplir todas estas condiciones:\n$EFFECT_LIST_BULLET$Ser vasallo [de_jure|lE] del título\n$EFFECT_LIST_BULLET$Estar solo uno o dos [ranks|lE] por debajo del título"
 saxon_elective_candidates: "Niños, pretendientes y vasallos"
 saxon_elective_candidates_tooltip: "Para ser un candidato válido en el Witenagemot, un personaje debe cumplir una de estas condiciones:\n$EFFECT_LIST_BULLET$Ser hijo legítimo del gobernante actual, sin estar en la línea de sucesión de una teocracia o república\n$EFFECT_LIST_BULLET$Ser [claimant|lE] al título, sin estar en la línea de sucesión de una teocracia o república. No se puede nombrar a los vástagos de un candidato\n$EFFECT_LIST_BULLET$Ser un [Concept( 'powerful_vassal_powerful', 'vasallo feudal poderoso' )|E] [de_jure|lE] del título"
 saxon_elective_electors: "$feudal_elective_electors$"
 saxon_elective_electors_tooltip: "Para ser un [elector|lE] válido en el Witenagemot, un vasallo debe cumplir todas estas condiciones:\n$EFFECT_LIST_BULLET$Ser vasallo [de_jure|lE] del título\n$EFFECT_LIST_BULLET$Ser vasallo directo del título\n$EFFECT_LIST_BULLET$Ser adulto\n$EFFECT_LIST_BULLET$No estar incapacitado"
 scandinavian_elective_candidates: "Parientes y pretendientes"
 scandinavian_elective_candidates_tooltip: "Para ser un candidato válido en el Thing, un personaje debe cumplir una de estas condiciones:\n$EFFECT_LIST_BULLET$Ser [Concept( 'extended_family', 'pariente lejano' )|E] y legítimo del gobernante, sin estar en la línea para heredar una teocracia o república. No se puede nombrar a los vástagos de un candidato\n$EFFECT_LIST_BULLET$Ser [claimant|lE] al título, sin estar en la línea para heredar una teocracia o república"
 scandinavian_elective_electors: "$feudal_elective_electors$"
 scandinavian_elective_electors_tooltip: "Para ser un [elector|lE] válido en el Thing, un vasallo debe cumplir todas estas condiciones:\n$EFFECT_LIST_BULLET$Ser vasallo directo del título\n$EFFECT_LIST_BULLET$No ser barón"
