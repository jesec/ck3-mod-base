 empire_faith_gate.0002.t: "El verdadero emperador"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUIName] reclama la dignidad imperial que debe ser solamente mía. Si lo dejo pasar, los fieles empezarán a dudar de mi [legitimacy|El]."
