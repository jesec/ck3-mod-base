 # Gem Exchange #
 building_type_trade_gem_exchange_01: "Edelsteinbörse"
 building_type_trade_gem_exchange_01_desc: "Schätzer in dieser Edelsteinbörse bewerten Steine nur zur Mittagszeit, und zwar an Fenstern, die von der Sonne wegweisen, denn dort ist das Licht am gleichmäßigsten."
 trade_gem_exchange_01: "$building_type_trade_gem_exchange_01$"
 trade_gem_exchange_02: "$building_type_trade_gem_exchange_01$ II"
