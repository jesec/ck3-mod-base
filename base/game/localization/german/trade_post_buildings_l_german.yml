 # Blacksmith Quarter #
 building_type_trade_blacksmith_quarter_01: "Schmiedehof"
 building_type_trade_blacksmith_quarter_01_desc: "Das Metall ist nur so viel wert, wie seine Reinheit vorgibt, weswegen jeder Barren, der auf diesen Schmiedeplatz gelangt, gewogen, geprüft und gestempelt wird."
 trade_blacksmith_quarter_01: "$building_type_trade_blacksmith_quarter_01$"
