 trade_secure_storeroom_05: "$building_type_trade_secure_storeroom_01$ V"
 # Granary #
 building_type_trade_granary_01: "Getreideschütten"
 building_type_trade_granary_01_desc: "Getreide wird nach einer guten Ernte günstig gekauft und in diesen Schütten gelagert, bis die Preise wieder steigen. Früher oder später steigen sie immer."
 trade_granary_01: "$building_type_trade_granary_01$"
