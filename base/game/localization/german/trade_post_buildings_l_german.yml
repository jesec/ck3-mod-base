 building_type_trade_apothecary_guild_01_desc: "Mitglieder dieser Apothekerzunft bewerten Gewürze, Weihrauch und Heilmittel, die den Handelsposten passieren, anhand von Geruch und Geschmack und danach, wie sie sich anfühlen."
