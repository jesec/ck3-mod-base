 trade_warehouse_05: "$building_type_trade_warehouse_01$ V"
 # Secure Storeroom #
 building_type_trade_secure_storeroom_01: "Lagerzellen"
 building_type_trade_secure_storeroom_01_desc: "In den Lagerzellen befinden sich die wertvollsten Waren, und ihre Wachen werden gut bezahlt, um Diebe abzuhalten. Sie werden sogar noch besser bezahlt, um nicht neugierig zu sein."
 trade_secure_storeroom_01: "$building_type_trade_secure_storeroom_01$"
 trade_secure_storeroom_02: "$building_type_trade_secure_storeroom_01$ II"
