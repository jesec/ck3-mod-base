 trade_granary_05: "$building_type_trade_granary_01$ V"
 # Cellar #
 building_type_trade_cellar_01: "Keller"
 building_type_trade_cellar_01_desc: "Wein aus der Heimat wird in diesem Keller neben dem einheimischen Getränk aufbewahrt, was ein Trost für Kaufleute mit Sehnsucht nach Heimat ist und Luxus für alle anderen."
 trade_cellar_01: "$building_type_trade_cellar_01$"
 trade_cellar_02: "$building_type_trade_cellar_01$ II"
