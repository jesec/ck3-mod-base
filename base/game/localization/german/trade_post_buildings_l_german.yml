 building_type_trade_cloth_hall_01: "Webstuhlhalle"
 building_type_trade_cloth_hall_01_desc: "Ballen an Wolle, Leinen und Seide werden gekauft, inspiziert und in dieser Webstuhlhalle gelagert, bevor man sie in die Ferne verschifft."
 trade_cloth_hall_01: "$building_type_trade_cloth_hall_01$"
 trade_cloth_hall_02: "$building_type_trade_cloth_hall_01$ II"
