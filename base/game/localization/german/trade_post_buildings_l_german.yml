 # Food Depot #
 building_type_trade_food_depot_01: "Einmachraum"
 building_type_trade_food_depot_01_desc: "Pökelfleisch, Käse, Öl und Honig werden in diesem Einmachraum gelagert und sollen für eine lange Reise oder eine magere Saison sein."
 trade_food_depot_01: "$building_type_trade_food_depot_01$"
