 building_type_trade_consulate_01: "Konsulat"
 building_type_trade_consulate_01_desc: "Die Kaufleute wählen in diesem Konsulat ihren eigenen Konsul, der ihre Streitigkeiten nach heimischem Recht und nicht auf Grundlage des Landesrechts beilegt."
