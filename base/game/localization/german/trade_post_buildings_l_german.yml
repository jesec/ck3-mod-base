 ##### Trade Post District #####
 trade_post_location_district: "Handelspostenbezirk"
 trade_post_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods_i][trade_goods|E]\n$BULLET_WITH_TAB$@trade_market_icon![trade_market|E]\n$BULLET_WITH_TAB$[gold_i][gold|E]\n$BULLET_WITH_TAB$[alliance_i][alliance|E]\n\n#low Schaltet frei#!\n$BULLET_WITH_TAB$Erlaubt @trade_route_icon![trade_routes|E], auf diesem @trade_market_icon![trade_market|E] zu beginnen"
 trade_post_location_district_desc_flavor: "Eien große Handelsanlage, die als Platz für die Republik und für reiche Patrizier dient, um ihre Waren und Dienste feilzubieten."
 # Trade Office #
 building_type_pb_trade_office_01: "Handelsstube"
 building_type_pb_trade_office_01_desc: "Angestellte in dieser Handelsstube vermerken jede Fracht, besiegeln jeden Vertrag und schicken mit jedem Schiff Berichte nach Hause."
 pb_trade_office_01: "$building_type_pb_trade_office_01$"
 pb_trade_office_02: "$building_type_pb_trade_office_01$ II"
 pb_trade_office_03: "$building_type_pb_trade_office_01$ III"
 pb_trade_office_04: "$building_type_pb_trade_office_01$ IV"
 # Counting House #
 building_type_trade_counting_house_01: "Zählhaus"
 building_type_trade_counting_house_01_desc: "Angestellte in diesem Zählhaus vermerken jede Münze, die dieser Handelsposten verdient, besitzt oder schuldet."
 trade_counting_house_01: "$building_type_trade_counting_house_01$"
 trade_counting_house_02: "$building_type_trade_counting_house_01$ II"
 trade_counting_house_03: "$building_type_trade_counting_house_01$ III"
 trade_counting_house_04: "$building_type_trade_counting_house_01$ IV"
 trade_counting_house_05: "$building_type_trade_counting_house_01$ V"
 # Treasury #
 building_type_trade_treasury_01: "Schatzmeisteramt"
 building_type_trade_treasury_01_desc: "Münzen aus einem Dutzend Länder gehen durch dieses Schatzmeisteramt, und jede wird gewogen und ihr Wert geschätzt. Der Schatzmeister kann eine falsche Münze anhand ihres Klangs erkennen."
 trade_treasury_01: "$building_type_trade_treasury_01$"
 trade_treasury_02: "$building_type_trade_treasury_01$ II"
 trade_treasury_03: "$building_type_trade_treasury_01$ III"
 trade_treasury_04: "$building_type_trade_treasury_01$ IV"
 trade_treasury_05: "$building_type_trade_treasury_01$ V"
 # Recruitment Office #
 building_type_trade_recruitment_office_01: "Anwerbeamt"
 building_type_trade_recruitment_office_01_desc: "Soldaten, Seeleute und Wachen verpflichten sich in diesem Anwerbeamt, dem Handelsposten für eine Saison oder ein Jahr zu dienen."
 trade_recruitment_office_01: "$building_type_trade_recruitment_office_01$"
 trade_recruitment_office_02: "$building_type_trade_recruitment_office_01$ II"
 trade_recruitment_office_03: "$building_type_trade_recruitment_office_01$ III"
 trade_recruitment_office_04: "$building_type_trade_recruitment_office_01$ IV"
 trade_recruitment_office_05: "$building_type_trade_recruitment_office_01$ V"
 # Office of Foreign Stipendiaries #
 building_type_trade_mercenary_office_01: "Amt für Fremdstipendien"
 building_type_trade_mercenary_office_01_desc: "Hauptleute von Söldnergesellschaften kommen zu diesem Amt, um über ihre Löhne und Bedingungen zu feilschen oder um die Beute zu teilen. Alles wird aufgeschrieben, denn niemand vertraut den jeweils anderen."
 trade_mercenary_office_01: "$building_type_trade_mercenary_office_01$"
 trade_mercenary_office_02: "$building_type_trade_mercenary_office_01$ II"
 trade_mercenary_office_03: "$building_type_trade_mercenary_office_01$ III"
 trade_mercenary_office_04: "$building_type_trade_mercenary_office_01$ IV"
 trade_mercenary_office_05: "$building_type_trade_mercenary_office_01$ V"
 # Watchtower #
 building_type_trade_watchtower_01: "Wachturm"
 building_type_trade_watchtower_01_desc: "Von diesem Wachturm aus können die Wachen über Meilen hinweg sehen. Meistens beobachten sie die Türen der Warenlager."
 trade_watchtower_01: "$building_type_trade_watchtower_01$"
 trade_watchtower_02: "$building_type_trade_watchtower_01$ II"
