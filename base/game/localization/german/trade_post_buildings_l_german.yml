 trade_watchtower_04: "$building_type_trade_watchtower_01$ IV"
 trade_watchtower_05: "$building_type_trade_watchtower_01$ V"
 # Shipyard #
 building_type_trade_shipyard_01: "Schiffswerft"
 building_type_trade_shipyard_01_desc: "Schiffsbauer auf dieser Werft setzen beschädigte Schiffe mit allem instand, was der heimische Markt gerade bietet. Deshalb ähneln sich zwei Reparaturen auch fast nie."
 trade_shipyard_01: "$building_type_trade_shipyard_01$"
 trade_shipyard_02: "$building_type_trade_shipyard_01$ II"
 trade_shipyard_03: "$building_type_trade_shipyard_01$ III"
 trade_shipyard_04: "$building_type_trade_shipyard_01$ IV"
 trade_shipyard_05: "$building_type_trade_shipyard_01$ V"
 # Merchant Guesthouse #
 building_type_trade_lodgings_01: "Kaufleutegästehaus"
 building_type_trade_lodgings_01_desc: "Dieses Gästehaus bietet Kaufleuten auf Besuch ein sauberes Bett, eine verschlossene Truhe und eine warme Mahlzeit. Freunde der Gesellschaft zahlen einen angemessenen Preis, alle anderen das Doppelte."
 trade_lodgings_01: "$building_type_trade_lodgings_01$"
 trade_lodgings_02: "$building_type_trade_lodgings_01$ II"
 trade_lodgings_03: "$building_type_trade_lodgings_01$ III"
 trade_lodgings_04: "$building_type_trade_lodgings_01$ IV"
 trade_lodgings_05: "$building_type_trade_lodgings_01$ V"
 # Warehouse #
 building_type_trade_warehouse_01: "Warenhaus"
 building_type_trade_warehouse_01_desc: "Jede Kiste in diesem Warenhaus wird mit dem Zeichen des Besitzers markiert, und nichts geht durch die Tore hinaus, ohne dass es das Siegel des Warenhausmeisters trägt."
 trade_warehouse_01: "$building_type_trade_warehouse_01$"
 trade_warehouse_02: "$building_type_trade_warehouse_01$ II"
 trade_warehouse_03: "$building_type_trade_warehouse_01$ III"
