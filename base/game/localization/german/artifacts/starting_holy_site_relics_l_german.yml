l_german:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################
 # Christian
 artifact_relic_peter_bones_name: "Gebeine Petri"
 artifact_relic_peter_bones_desc: "Die Gebeine des Apostels Petrus, Apostelfürst und erster Bischof von Rom."
 artifact_relic_paul_bones_name: "Gebeine des Heiligen Paulus"
 artifact_relic_paul_bones_desc: "Die Gebeine des Apostels Paulus, der in Aquae Salviae den Märtyrertod starb."
 artifact_relic_crown_of_thorns_name: "Dornenkrone"
 artifact_relic_crown_of_thorns_desc: "Jene Dornenkrone, die man Christus vor der Kreuzigung auf das Haupt drückte."
 artifact_relic_baptist_arm_name: "Rechter Arm von Johannes dem Täufer"
 artifact_relic_baptist_arm_desc: "Der rechte Unterarm von Johannes dem Täufer und der Überlieferung nach jene Hand, die Christus im Jordan taufte."
 artifact_relic_true_cross_name: "Stück vom Wahren Kreuz"
 artifact_relic_true_cross_desc: "Ein Splitter von jenem Kreuz, an das man Christus schlug, eingelassen in ein vergoldetes Reliquiar."
 artifact_relic_bones_of_james_name: "Gebeine des Heiligen Jakobus"
 artifact_relic_bones_of_james_desc: "Die Gebeine des Apostels Jakobus des Älteren, die Pilger aus der gesamten Christenheit anlocken."
 artifact_relic_mark_name: "Kopf des Heiligen Markus"
 artifact_relic_mark_desc: "Das abgetrennte Haupt des Evangelisten Markus, Gründer der Kirche von Alexandria."
 artifact_relic_lance_antioch_name: "Heilige Lanze von Antiochia"
 artifact_relic_lance_antioch_desc: "Eine eiserne Lanzenspitze, die Christi Seite durchbohrt haben soll."
 artifact_relic_tabot_name: "Tabot des Bundes"
 artifact_relic_tabot_desc: "Eine geweihte Steintafel, die für die Bundeslade steht und als die heiligste der äthiopischen Reliquien verehrt wird."
 artifact_relic_nine_saints_name: "Gebeine der Neun Heiligen"
 artifact_relic_nine_saints_desc: "Gebeine der Neun Heiligen – syrische Mönche, die vor den chalcedonischen Kontroversen nach Axum flohen und die ersten Klöster in Äthiopien gründeten und so die Saat des miaphystischen Christentums im ganzen Hochland ausbrachten."
 artifact_relic_thomas_name: "Reliquien des Apostels Thomas"
 artifact_relic_thomas_desc: "Die Gebeine und die blutbefleckte Speerspitze des Apostels Thomas, der den Glauben nach Kerala gebracht und dort den Märtyrertod erlitten haben soll."
 artifact_relic_augustine_pallium_name: "Pallium des Heiligen Augustinus"
 artifact_relic_augustine_pallium_desc: "Das Pallium von Augustinus von Canterbury, dem ersten Erzbischof und Apostel der Engländer."
 artifact_relic_three_magi_name: "Reliquien der drei Weisen"
 artifact_relic_three_magi_desc: "Die Gebeine der drei Weisen, die dem Stern nach Bethlehem folgten."
 artifact_relic_becket_name: "Reliquien des Heiligen Thomas Becket"
 artifact_relic_becket_desc: "Die blutgetränkten Gewänder und der Schädel von Thomas Becket, der 1170 in seiner eigenen Kathedrale den Märtyrertod erlitt und rasch zum größten Heiligen des englischen Christentums erklärt wurde."
 artifact_relic_ursula_name: "Gebeine der Heiligen Ursula"
 artifact_relic_ursula_desc: "Die Gebeine von Ursula und ihren Gefährtinnen, den Jungfrauenmärtyrerinnen, die auf den Friedhöfen Kölns geborgen wurden."
 artifact_relic_ignatius_name: "Gebeine des Heiligen Ignatius"
 artifact_relic_ignatius_desc: "Die Gebeine des Ignatius, zweiter Patriarch von Antiochia und Jünger des Apostels Johannes, der unter der Herrschaft Trajans in Rom den Märtyrertod starb."
 # Islamic
 artifact_relic_black_stone_name: "Bruchstück des Schwarzen Steins"
 artifact_relic_black_stone_desc: "Ein poliertes schwarzes Fragment vom Schwarzen Stein der Kaaba, die vom Propheten selbst geküsst wurde und von jedem Hadsch-Pilger verehrt wird."
 artifact_relic_dhulfiqar_name: "Zulfiqar"
 artifact_relic_dhulfiqar_desc: "Das gespaltene Schwert des Propheten, das er der Überlieferung nach Ali schenkte und in der gesamten Umma als Zeichen göttlich legitimierter Herrschaft verehrt wird."
 artifact_relic_buraq_footprint_name: "Hufabdruck des Buraq"
 artifact_relic_buraq_footprint_desc: "Ein Stein mit jenem Hufabdruck, den der Buraq hinterließ, als der Prophet vom Gründungsfels in Jerusalem in den Himmel auffuhr."
 artifact_relic_sword_of_ali_name: "Schwert Alis"
 artifact_relic_sword_of_ali_desc: "Eine Klinge, von der man annimmt, sie sei von Ali ibn Abi Talib in den Schlachten von Badr und Siffin geführt worden."
 artifact_relic_abu_hanifa_turban_name: "Turban von Abu Hanifa"
 artifact_relic_abu_hanifa_turban_desc: "Der Gelehrtenturban von Abu Hanifa an-Nu’man, dem Begründer der hanafitischen Rechtsschule – ein Leuchtturm sunnitischer Rechtswissenschaft für jeden hanafitischen Pilger."
 artifact_relic_prophet_sandals_name: "Sandalen des Propheten"
 artifact_relic_prophet_sandals_desc: "Ledersandalen, die angeblich der Prophet trug. Fromme Handwerker aus der gesamten Umma kopierten ihre Na’l-Form schon unzählige Male."
 # Jewish
 artifact_relic_western_wall_name: "Stein der Westmauer"
 artifact_relic_western_wall_desc: "Ein bearbeiteter Stein, der von der westlichen Stützmauer der Plattform des Zweiten Tempels stammt, eines der wenigen Überbleibsel, die nach der Zerstörung des Tempels durch die Römer im Jahr 70 erhalten blieben."
 artifact_relic_tablets_name: "Fragmente der Tafeln"
 artifact_relic_tablets_desc: "Ein Steinsplitter, der der Legende nach von den Gesetzestafeln abgebrochen sein soll, als Moses sie auf dem Berg Sinai im Zorn zu Boden warf."
 # Buddhist
 artifact_relic_bodhi_leaf_name: "Blatt des Bodhi-Baums"
 artifact_relic_bodhi_leaf_desc: "Ein konserviertes Blatt des Bodhi-Baums in Bodh Gaya, unter dem Buddha die Erleuchtung erlangte."
 artifact_relic_vajrasana_name: "Fragment des Vajrasana"
 artifact_relic_vajrasana_desc: "Ein poliertes Fragment des Vajrasana oder Diamantthrons unter dem Bodhi-Baum, auf dem der Buddha unbeweglich saß, bis er die Erleuchtung erlangte."
 artifact_relic_dhamek_name: "Sarira der Dhamek-Stupa"
 artifact_relic_dhamek_desc: "Eine heilige Reliquie des Buddha aus Sarnath, wo er seinen ersten Schülern den Dharma lehrte."
 artifact_relic_jowo_name: "Jowo Shakyamuni"
 artifact_relic_jowo_desc: "Ein geweihtes Bildnis des jungen Buddha, das aus China gebracht wurde und bei den Tibetern als die heiligste aller Statuen gilt."
 artifact_relic_sacred_tooth_name: "Heiliger Zahn Buddhas"
 artifact_relic_sacred_tooth_desc: "Der linke Eckzahn Buddhas, der im 4. Jahrhundert aus Kalinga gebracht wurde – ein Palladium der Königsherrschaft, dessen Besitz den Herrscher über alle anderen legitimiert."
 # Hindu
 artifact_relic_lingam_name: "Vishvanath Lingam"
 artifact_relic_lingam_desc: "Ein heiliges Fragment des Shiva-Lingam aus dem großen Tempel in Varanasi, der heiligsten Stadt am Ganges."
 artifact_relic_trishul_name: "Trishul von Shiva"
 artifact_relic_trishul_desc: "Ein Dreizack, der angeblich von Shiva selbst geführt wurde: ein Symbol für die Herrschaft des Gottes über Schöpfung, Erhaltung und Zerstörung."
 artifact_relic_krishna_stone_name: "Stein der Geburt Krishnas"
 artifact_relic_krishna_stone_desc: "Ein abgenutzter Stein aus dem Krishna-Janmabhoomi in Mathura, jenem Ort, den die Überlieferung als Krishnas Geburtsort nennt."
 artifact_relic_rama_footprint_name: "Fußabdruck Ramas"
 artifact_relic_rama_footprint_desc: "Ein Stein mit dem Fußabdruck von Rama selbst, der aus seinem Geburtsort Ayodhya gebracht wurde."
 # Jain
 artifact_relic_palitana_tirtha_name: "Tirtha von Palitana"
 artifact_relic_palitana_tirtha_desc: "Ein heiliger Reliquienstein aus den Hügeln von Shatrunjaya bei Palitana, dem heiligsten Tirtha in der Jain-Tradition."
 artifact_relic_parshvanatha_paduka_name: "Charan Paduka von Parshvanatha"
 artifact_relic_parshvanatha_paduka_desc: "Der Charan Paduka, ein Stein mit dem Abdruck der Füße des dreiundzwanzigsten Tirthankara Parshvanatha."
 artifact_relic_shikharji_nishidhi_name: "Nishidhi der Tirthankaras"
 artifact_relic_shikharji_nishidhi_desc: "Nishidhi-Gedenksteine von den Gipfeln des Berges Sammed-Shikhar, wo zwanzig der vierundzwanzig Tirthankaras Moksha erlangten – dem heiligsten Tirtha des Jainismus."
 # Zoroastrian
 artifact_relic_atash_bahram_name: "Glut des Adur Farnbag"
 artifact_relic_atash_bahram_desc: "Glühende Glut, die vom großen Atash Bahram, dem heiligen Feuer der Priester, stammt und noch immer im Feuertempel gehütet wird."
 # Norse
 artifact_relic_yggdrasil_branch_name: "Zweig Yggdrasils"
 artifact_relic_yggdrasil_branch_desc: "Ein Zweig, der angeblich vom heiligen Baum im Tempel von Uppsala abfiel, an dem noch immer die Leiber geschlachteter Opfer hängen."
 # Slavic
 artifact_relic_perun_idol_name: "Götze von Perun"
 artifact_relic_perun_idol_desc: "Eine hölzerne Götzenfigur des Donnergottes Perun, des Herrn der slawischen Götter, die von Fürst Wladimir errichtet wurde."
 # Tengri
 artifact_relic_suldetug_name: "Sülde-tug-Banner"
 artifact_relic_suldetug_desc: "Ein schwarzes Banner aus Yak-Schwanz als Geistergefäß des Kriegsgottes, das vor den Khanen der Steppe hergetragen wurde."
 # Shinto
 artifact_relic_yata_kagami_name: "Yata no Kagami"
 artifact_relic_yata_kagami_desc: "Ein bronzener Spiegel, der traditionell als eines der drei Reichsinsignien Japans gilt. Der Legende nach soll er die Sonnengöttin Amaterasu aus ihrer Höhle gelockt haben."
 artifact_relic_shin_no_mihashira_name: "Shin no Mihashira"
 artifact_relic_shin_no_mihashira_desc: "Ein Splitter des Shin no Mihashira: die heilige Zentralsäule, die unter dem innersten Heiligtum des Naikū begraben liegt, als das verborgenste und heiligste der Mysterien von Ise gilt und bei jedem Wiederaufbau der Shikinen Sengū erneuert wird."
 # Confucian
 artifact_relic_kong_tomb_name: "Stele des Kong-Grabmals"
 artifact_relic_kong_tomb_desc: "Eine aus Stein gehauene Tafel aus dem Grab des Konfuzius in Qufu, das von der Familie Kong über Generationen hinweg verehrt wurde."
 artifact_relic_analects_name: "Analekten des Konfuzius"
 artifact_relic_analects_desc: "Eine frühe Abschrift der Analekten – der gesammelten Aussprüche des Meisters Kong – auf Bambusstreifen, die von Generationen chinesischer Gelehrter studiert wurde."
 # Hellenic
 artifact_relic_athena_promachos_name: "Fragment der Athena Promachos"
 artifact_relic_athena_promachos_desc: "Ein Bronzefragment jener Kolossalstatue der Athena, die einst über die Akropolis wachte."
 # West African
 artifact_relic_opa_oranmiyan_name: "Opa Oranmiyan"
 artifact_relic_opa_oranmiyan_desc: "Der Granitstab des legendären Königs Oranmiyan, eingelassen in die heilige Erde von Ife, der Ahnenwiege der Yoruba."
 artifact_relic_oshe_shango_name: "Oshe Shango"
 artifact_relic_oshe_shango_desc: "Oshe Shango – eine doppelköpfige Axt, die den beiden Donnersteinen des Sturmgottes Shango nachempfunden ist – wird von seinen Priestern in ekstatischem Tanz emporgehalten."
 # Generic misc archetypes used for religions without a branch-tree tradition
 artifact_misc_relic_idol_name: "Heiliger Götze"
 artifact_misc_relic_idol_desc: "Ein geschnitzter Götze: Bei Ritualen ist er der stofflich fassbare Sitz des Gottes."
 artifact_misc_relic_stele_name: "Ahnenstele"
 artifact_misc_relic_stele_desc: "Eine gravierte Steintafel, auf der die Abstammungslinie der Priesterschaft aufgeführt ist: ein generationenüberspannendes Zeugnis."
 artifact_misc_relic_mask_name: "Ritualmaske"
 artifact_misc_relic_mask_desc: "Eine Zeremonienmaske, die bei den höchsten Riten getragen wird: ein Gefäß für die göttliche Gegenwart."
 artifact_misc_relic_banner_name: "Heiliges Banner"
 artifact_misc_relic_banner_desc: "Ein geweihtes Banner, das bei jedem großen Ritus an der heiligen Stätte zugegen war. Sein Tuch ist schwer vom Rauch der Opfergaben."
