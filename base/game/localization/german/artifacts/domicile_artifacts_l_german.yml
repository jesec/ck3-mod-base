 creature_type_lion_desc: "König der Tiere, Symbol der Tapferkeit – nun in erzwungener Unterwerfung. Er streift in seinem Gehege hin und her, so weit es seine Fesseln zulassen."
 creature_type_caracal_desc: "Eine große, katzenartige Kreatur. Sie schleicht in ihrem Gehege umher und zerfetzt alles, was man hineinlegt, um den Käfig zu schmücken."
 creature_type_lynx_desc: "Eine scheue, gedrungene Katze. Sie hält sich dicht am Boden, die Ohren flach angelegt, während ihr Blick aufgeregt die Umgebung im Auge behält."
 creature_type_tiger_desc: "Eine furchterregende Kreatur, der König der Bergtiere. Man kann sie leicht erzürnen und dazu bringen, ihre Reißzähne zu blecken, was die Besucher in Angst und Schrecken versetzt."
 creature_type_leopard_desc: "Ein geschmeidiges, anmutiges und zugleich tödliches Tier. Es ist ein geduldiges und kluges Geschöpf mit einem beeindruckenden Sprungvermögen."
 creature_type_bear_desc: "Ein gewaltiger Bär, der schwerfällig umherstreift und unablässig nach Nahrung sucht. Seine mächtigen Tatzen könnten Knochen brechen wie dünne Zweige."
 creature_type_elephant_desc: "Ein täuschend sanfter Riese. Sein Rüssel ist äußerst geschickt – zur Überraschung und Begeisterung eines jeden Besuchers."
 creature_type_peacock_desc: "Ein stolzer und würdevoller Vogel mit unverwechselbarem Ruf. Er ist die Krönung eines jeden Gartens."
 creature_type_parrot_desc: "Ein lebhaftes Geschöpf, das menschliche Laute nachahmen kann: ein netter Trick, um Gäste zu unterhalten."
 creature_type_crane_desc: "Ein leichtflügeliges und edles Tier. Es ist das Symbol für Glück und ewige Jugend."
 creature_type_cockatoo_desc: "Ein bunter Vogel mit strahlendem Gefieder und huschendem, aufmerksamem Blick."
 creature_type_monkey_desc: "Dieser gesellige Menschenaffe ist ein entzückender Gefährte mit herrlich menschlichen Verhaltensweisen und Gesichtsausdrücken."
 creature_type_lion_reforged_desc: "Der König der Tiere, das Symbol der Tapferkeit. $creature_history_entry$"
 creature_type_caracal_reforged_desc: "Eine wilde Kreatur. $creature_history_entry$"
 creature_type_lynx_reforged_desc: "Ein großes Katzentier mit Pinseln an den Ohren. $creature_history_entry$"
 creature_type_tiger_reforged_desc: "Eine furchterregende Kreatur, der König der Bergtiere. $creature_history_entry$"
 creature_type_leopard_reforged_desc: "Eine große Katze mit fleckigem Fell. $creature_history_entry$"
 creature_type_bear_reforged_desc: "Ein wilder Bär. $creature_history_entry$"
