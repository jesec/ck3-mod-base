l_german:
 #Pilgrim Badges
 maria_conch_name: "Marienmuschel"
 maria_conch_description: "Ein Pilgerabzeichen, das man beim Unternehmen einer Pilgerreise erhält."
 maria_conch_description_protection: "Ein schützendes Pilgerabzeichen, das man beim Unternehmen einer Pilgerreise nach [badge_location.GetProvince.GetBaronyNameExplicitly] erhält."
 maria_conch_description_prosperity: "Ein Wohlstand bringendes Pilgerabzeichen, das man beim Unternehmen einer Pilgerreise nach [badge_location.GetProvince.GetBaronyNameExplicitly] erhält."
 santiago_badge_name: "Jakobsmuschel"
 santiago_badge_description: "Ein Pilgerzeichen in Form einer Muschel, das an eine Pilgerreise auf dem Jakobsweg erinnert. Man unternimmt sie im Andenken an den Weg des Heiligen Jakobus und sie führt über die Camino Francés zur Heiligen Stätte in Santiago de Compostela."
 jerusalem_badge_name: "Jerusalemkreuz"
 jerusalem_badge_description: "Ein Pilgerabzeichen in Form eines quadratischen Kreuzes mit feinen Verzierungen. Es ist ein Andenken an eine Pilgerreise in die heilige Stadt Jerusalem."
 rome_badge_name: "Schlüssel Petri"
 rome_badge_description: "Ein Pilgerabzeichen in Form eines Schlüsselbunds, das die Heiligen Petrus und Paulus samt Heiligenschein darstellt. Es ist ein Andenken an eine Pilgerreise in die heilige Stadt Rom."
 generic_badge_name_1: "Winziges [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip]-Abzeichen"
