 generic_badge_protection_desc: "Ein robustes Pilgerabzeichen, das in [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] erworben wurde und gerüchteweise seinem Träger Schutz gewähren soll."
 generic_badge_prosperity_desc: "Ein glänzendes Pilgerabzeichen, das in [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] erworben wurde und gerüchteweise seinem Träger Wohlstand bringen soll."
 generic_badge_virility_desc: "Ein Pilgerabzeichen, das vor Eifer glänzt. Es wurde in [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] erworben und soll seinem Träger gerüchteweise mehr Männlichkeit schenken."
 generic_badge_wisdom_desc: "Ein rätselhaftes Pilgerabzeichen, das in [newly_created_artifact.MakeScope.Var('pilgrim_badge_location').GetProvince.GetNameNoTooltip] erworben wurde und gerüchteweise seinem Träger Weisheit und Bedachtheit gewähren soll."
