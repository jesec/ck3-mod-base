 trade_category_non_construction: "Nicht-Bauwaren"
 trade_category_non_construction_desc: "Alle Handelsgüter mit Ausnahme von Baumaterialien; Holz, Hanf und Stein sind davon ausgenommen."
 trade_category_non_food: "Nicht-Lebensmittel"
 trade_category_non_food_desc: "Alle Handelsgüter mit Ausnahme von Grundnahrungsmitteln; Getreide, Hirse, Reis, Obst, Fleisch, Fisch und Käse sind davon ausgenommen."
 trade_category_non_medicinal: "Nicht-Arzneimittel"
 trade_category_non_medicinal_desc: "Alle Handelswaren mit Ausnahme von Arzneimitteln."
 trade_category_non_luxury: "Nicht-Luxuswaren"
 trade_category_non_luxury_desc: "Alle Handelswaren mit Ausnahme von Luxusgütern und Genussmitteln wie Seide, Gewürzen, Schmuck, Käse, Obst, Öl, Honig und Tee."
 trade_category_food: "Grundnahrung"
 trade_category_food_desc: "Die grundlegenden Nahrungsmittel, die eine Bevölkerung ernähren, darunter Getreide, Hirse, Reis, Obst, Fleisch, Fisch und Käse. Eine stetige Versorgung ist die erste Anforderung jeder Siedlung, jeder Armee und jedes Haushalts."
 trade_category_beasts_of_burden: "Lasttiere"
 trade_category_beasts_of_burden_desc: "Für Landwirtschaft und Transport unverzichtbares Vieh, darunter Pferde und Rinder. Sie treiben landwirtschaftliche Betriebe an, befördern Güter und stützen die ländliche Wirtschaft eines jeden Reiches."
 trade_category_minerals: "Mineralien"
 trade_category_minerals_desc: "Waren, die man der Erde durch Bergbau und Steinbrüche entnimmt, darunter Metalle, Edelsteine, Salz und Alaun. Sie versorgen die Schmieden, Münzstätten und Handwerkswerkstätten, von denen die gesamte Industrie abhängt."
 trade_category_luxury: "Luxus"
 trade_category_luxury_desc: "Seltene und kostbare Waren, nach denen sich die Reichen und Mächtigen sehnen: von Seide und Gewürzen bis hin zu Elfenbein und Schmuck. Sie verleihen eine Aura von Prestige und Raffinesse und sind nur für die wohlhabendsten Höfe erschwinglich."
 trade_category_refined_goods: "Veredlungswaren"
 trade_category_alcohol: "Alkohol"
 trade_category_alcohol_desc: "Bier und Wein sind weit mehr als bloße Genussmittel. Sie dienen als sichere Alternative zu verunreinigtem Wasser, als religiöse Sakramente sowie als gesellschaftliche Notwendigkeit in Schankstuben und bei Hofe."
 trade_category_liqour_raw_materials: "Destilierbares"
 trade_category_precious_metals: "Edelmetalle"
 trade_category_precious_metals_desc: "Silber und Gold: das Lebenselixier von Münzprägeanstalten und Schatzkammern. Über ihre Verwendung als Zahlungsmittel hinaus sind Edelmetalle unverzichtbar für edle Handwerkskunst und Statussymbole."
 trade_category_jewelry_materials: "Edelsteine"
 trade_category_jewelry_materials_desc: "Seltene und exotische Rohstoffe, die man aufgrund ihrer Schönheit schätzt, darunter Edelsteine, Bernstein, Elfenbein und Jade. Sie erzielen hohe Preise und sind für luxuriöses Kunsthandwerk sowie religiösen Schmuck unverzichtbar."
 trade_category_crops: "Feldfrüchte"
 trade_category_crops_desc: "Zu den angebauten Feldfrüchten zählen Getreide, Zucker, Baumwolle und Flachs. In gepflegten Beeten angebaut und künstlich bewässert bilden sie jenen natürlichen Reichtum, auf dem sich landwirtschaftliche Gemeinden gründen."
 trade_category_base_metals: "Unedelmetalle"
 trade_category_base_metals_desc: "Eisen und Kupfer: die praktischen Metalle, auf denen Industrie und Kriegführung beruhen. Aus Eisen entstehen Waffen, Werkzeuge und Rüstungen. Kupfer ist unverzichtbar für Legierungen und die alltägliche Metallverarbeitung."
 trade_category_cereals: "Getreide"
 trade_category_cereals_desc: "Grundnahrungsmittel wie Getreide, Hirse und Reis. Getreide bildet die Grundlage jeder Ernährung und gehört zu den am häufigsten gehandelten Waren. Es ist unerlässlich für die Versorgung von Städten und Armeen."
 trade_category_meat: "Fleisch"
 trade_category_meat_desc: "Fleisch und Fisch, gepökelt oder anderweitig haltbar gemacht. Diese proteinreichen Vorräte versorgen Haushalte und Garnisonen und ermöglichen lange Reisen fernab von frischem Nachschub."
 trade_category_comforts: "Annehmlichkeiten"
 trade_category_comforts_desc: "Alltägliche Lebensmittel, die über die reine Grundversorgung hinausgehen, darunter Käse, Obst, Olivenöl, Honig und Tee. Solche Annehmlichkeiten steigern die Lebensqualität und sind in allen Siedlungen durchgehend gefragt."
 trade_category_clothes: "Kleidung"
 trade_category_clothes_desc: "Fertige Kleidungsstücke und Bekleidungsmaterialien, einschließlich Textilien, Pelzen und Leder. Von robuster Arbeitskleidung bis hin zu feiner Garderobe: Kleidung ist ein Grundbedürfnis für jeden Menschen in einem Reich."
 trade_category_luxury_consumption: "Luxusverbrauchswaren"
 trade_category_luxury_consumption_desc: "Kostbare und begehrte Waren aus fernen Ländern, darunter Zucker und Gewürze. Sie verfeinern Speisen, finden in der Medizin Verwendung und sind nur für wenige Privilegierte erschwinglich."
 trade_category_luxury_items: "Luxusgegenstände"
 trade_category_luxury_items_desc: "Erlesene Gegenstände von Status und Kultur, darunter Keramik, Glas, Schmuck, Lackarbeiten und Seide. Sie sind die Kennzeichen eines wohlhabenden und kultivierten Hofes."
 trade_category_construction_materials: "Baumaterialien"
 trade_category_mandala_arms: "Einfache Waffen"
 trade_category_mandala_arms_desc: "Einfache Materialien zur Ausrüstung eines Heeres, vornehmlich Kupfer und Holz. Sie liefern die Speere, Schilde und grundlegendes Kriegszeug für Reiche, denen der Zugang zu weitaus mächtigeren geschmiedeten Waffen verwehrt bleibt."
 trade_category_carpentry_supplies: "Tischlerwaren"
 trade_category_carpentry_supplies_desc: "Holz und Hanf: die Rohstoffe für Schiffbaus und Seefahrt. Holz bildet das Gerüst für Gebäude ebenso wie für Schiffe, während Hanf die für den Seehandel unerlässlichen Taue und Takelagen liefert."
 trade_category_rural_goods: "Ländliche Waren"
 trade_category_rural_goods_desc: "Der reiche Ertrag des Landes: von Feldfrüchten über Vieh bis hin zu Holz und jenen wertvollen Erzen, die man der Erde abringt. Dies sind die Rohstoffe, die vom Land in die Städte und Gemeinden fließen, wo man sie anschließend weiterverarbeitet."
 trade_category_agricultural_goods: "Ackerbauwaren"
 trade_category_agricultural_goods_desc: "Die gesamte Erzeugnispalette aus Landwirtschaft und Ackerbau: von Getreide und Faserpflanzen bis hin zu Wein, Honig und Vieh. Diese Waren stellen das vielfältige Erzeugnisangebot einer sesshaften Agrarwirtschaft dar."
 trade_category_bast_fibres: "Bastfasern"
 trade_category_fabrics: "Stoff"
 trade_category_fabrics_desc: "Unverarbeitete Textilfasern, darunter Wolle, Baumwolle und Flachs. Sie bilden das Zwischenerzeugnis zwischen landwirtschaftlichem Rohstoff und fertigem Gewebe und beliefern Webstühle im ganzen Reich."
 trade_category_guild_goods: "Zunftwaren"
 trade_category_guild_goods_desc: "Hochwertige Erzeugnisse aus den Werkstätten städtischer Zünfte, darunter Bier, Textilien, Glas und Schmuck, geschaffen von fähigen Handwerkern."
 trade_category_cheap_common: "Gemeinwaren"
 trade_category_cheap_common_desc: "Preiswerte und weitverbreitete Waren, die auf fast jedem Markt zu finden sind: von Getreide und Fisch bis hin zu Holz und Stein. Ihr geringer Wert und ihre große Verfügbarkeit machen sie zur alltäglichen Grundlage des örtlichen Handels."
 trade_category_fine_goods: "Edelwaren"
 trade_category_fine_goods_desc: "Hochwertige Waren, die über die großen Handelsplätze der Welt strömen. Sie sind die Währung von Reichtum, Status und des zivilisierten Lebens."
 trade_category_staple_goods: "Gebrauchswaren"
 trade_category_staple_goods_desc: "Die Massengüter, die Städte und Armeen versorgen. Überall dort, wo Menschen in großer Zahl leben, müssen diese Waren fließen."
 trade_category_stone: "Stein"
 trade_category_stone_desc: "Abgebauter Naturstein für Befestigungsanlagen, Kirchen und öffentliche Infrastruktur. Wo örtliche Vorkommen knapp sind, muss das Material für jedes größere Bauvorhaben eingeführt werden."
 trade_category_salt: "Salz"
 trade_category_salt_desc: "Ein unverzichtbares mineralisches Konservierungsmittel und ein lebensnotwendiger Nahrungsbestandteil. Salz ermöglicht die Haltbarmachung von Fleisch und Fisch sowie das Gerben von Häuten und treibt seit der Antike den Fernhandel an."
 trade_category_alum: "Alaun"
 trade_category_alum_desc: "Ein vielseitiges Mineralsalz, das man vorwiegend als Beizmittel zur Fixierung von Farbstoffen auf Stoffen verwendet. Da es auch in der Gerberei und der Medizin zum Einsatz kommt, macht seine Knappheit es zu einem strategisch wertvollen Rohstoff."
 trade_category_dyes: "Färbemittel"
 trade_category_dyes_desc: "Leuchtende Farbstoffe, die man aus Pflanzen, Mineralien und Insekten gewinnt. Diese Farbstoffe finden in zahlreichen Handwerken Verwendung: beim Fixieren von Farben auf Stoffen, beim Glasieren von Keramik und bei der Illumination von Handschriften mit kräftigen Tinten."
 trade_category_books: "Bücher"
 trade_category_books_desc: "Handschriften sowie das Papier oder Pergament, auf dem man sie verfasst. Bücher sind von zentraler Bedeutung für Bildung, Verwaltung und Wissensvermittlung und überall dort gefragt, wo sich die Schriftlichkeit ausbreitet."
 trade_category_incense: "Weihrauch"
 trade_category_incense_desc: "Aromatische Harze und Mischungen werden weltweit bei religiösen Zeremonien verbrannt. Ein stetiger Nachschub ist für Kirchen, Tempel und Schreine in jeder gläubigen Gemeinschaft unerlässlich."
 trade_category_medicaments: "Arzneimittel"
 trade_category_medicaments_desc: "Heilmittel, Kräuter und Arzneimischungen, die Ärzte und Heiler verwenden. Der Zugang zu Medikamenten verringert die Auswirkungen von Krankheiten und Verletzungen, was für jede wachsende Siedlung unerlässlich ist."
 trade_good_wood: "Holz"
 trade_good_wood_desc: "Bauholz ist ein unverzichtbarer Baustoff für Häuser, Schiffe und Möbel. Hochwertiges Hartholz ist nicht immer vor Ort verfügbar und muss unter Umständen aus waldreichen Regionen eingeführt werden."
 trade_good_stone: "Stein"
 trade_good_stone_desc: "Stein (gewonnen aus Kalkstein-, Sandstein- oder Marmorvorkommen) ist für anspruchsvolle Bauvorhaben unverzichtbar. Da er schwer und teuer im Transport ist, herrscht abseits natürlicher Gesteinsaufschlüsse oft Mangel daran."
 trade_good_wool: "Wolle"
 trade_good_wool_desc: "Von Schafen geschoren und gereinigt ist Wolle die wichtigste Textilfaser im mittelalterlichen Europa. Sie wird zu Garn gesponnen und zu Tuch gewebt und liefert so den Rohstoff für ein umfangreiches Webereigewerbe."
 trade_good_cotton: "Baumwolle"
 trade_good_cotton_desc: "Baumwolle, die man in warmen Regionen von Indien bis Ägypten anbaut, liefert eine leichtere und atmungsaktivere Faser als Wolle. Versponnen und verwebt bildet sie die Grundlage eines Großteils des Textilhandels in der islamischen Welt und darüber hinaus."
 trade_good_leather: "Leder"
 trade_good_leather_desc: "Durch Gerbung werden Tierhäute zu einem strapazierfähigen und gut zu verarbeitenden Material. Da man Leder für Stiefel, Gürtel, Sättel, Rüstungen und Bucheinbände nutzt, ist es ein grundlegendes Handwerksmaterial in allen Kulturen."
 trade_good_flax: "Flachs"
 trade_good_flax_desc: "Flachs, der sowohl wegen seiner Leinenfasern als auch wegen des aus seinen Samen gewonnenen Leinöls angebaut wird, gehört zu den ältesten vom Menschen kultivierten Nutzpflanzen. Auch wenn die Ernte arbeitsintensiv sein kann, ist Flachs nicht so anspruchsvoll wie andere Faserpflanzen und lässt sich fast überall anbauen."
 trade_good_hemp: "Hanf"
 trade_good_hemp_desc: "Diese vielseitige Pflanze wird wegen ihrer widerstandsfähigen Fasern angebaut: Diese werden zu Seilen gedreht, zu Segeltuch gewebt oder zum Kalfatern verwendet. Hanf ist für die maritime Wirtschaft und das Bauwesen weltweit unverzichtbar."
 trade_good_salt: "Salz"
 trade_good_salt_desc: "Ob aus Meerwassersalinen, Steinsalzbergwerken oder Solequellen gewonnen: Salz ist ein unverzichtbares Konservierungsmittel und ein lebenswichtiger Mineralstoff. Da es das Verderben verhindert, wurde es zu einer der beständigsten Handelswaren der Menschheitsgeschichte."
 trade_good_grain: "Getreide"
 trade_good_grain_desc: "Zu Mehl für Brot oder Brei vermahlen ist Getreide die wichtigste Nutzpflanze der mittelalterlichen Welt. Vom Weizen im Westen bis zum Roggen im Norden ernährt es Bauern und Adlige gleichermaßen."
 trade_good_fruit: "Früchte"
 trade_good_fruit_desc: "Frisches und getrocknetes Obst verleiht mittelalterlichen Speisen Süße und Abwechslung. Obstsorten wie Äpfel, Birnen und Feigen werden aus wärmeren Regionen herangeführt, um die Nachfrage im Norden zu decken."
 trade_good_meat: "Dörrfleisch"
 trade_good_meat_desc: "Ob gesalzen, geräuchert oder getrocknet, um es zu konservieren: Haltbar gemachtes Fleisch ist eine unverzichtbare Proteinquelle. Es versorgt Armeen auf Feldzügen ebenso wie Familien während der kargen Wintermonate."
 trade_good_fish: "Fisch"
 trade_good_fish_desc: "Getrockneter, gesalzener oder geräucherter Fisch lässt sich über weite Strecken transportieren, ohne zu verderben, was ihn zu einer wichtigen Proteinquelle auch fernab von Küsten oder Flüssen macht. Insbesondere Hering und Kabeljau versorgen den Seehandel über große Entfernungen."
 trade_good_cattle: "Rinder"
 trade_good_cattle_desc: "Neben Milch, Fleisch und Häuten liefern Rinder Zugkraft für das Pflügen der Felder. Sie sind die vielseitigsten Nutztiere, und der Zugang zu gutem Zuchtvieh stärkt jeden landwirtschaftlichen Betrieb."
 trade_good_horses: "Pferde"
 trade_good_horses_desc: "Pferde sind die wichtigsten Zug- und Reittiere der mittelalterlichen Welt und für Landwirtschaft, Transport und Kriegführung unverzichtbar. Besonders geschätzt werden edle Rassen aus der Steppe und von der Iberischen Halbinsel."
 trade_good_cheese: "Käse"
 trade_good_cheese_desc: "Diese haltbare Molkereiware entsteht durch Gerinnung und Reifung von Milch: Käse ist wesentlich länger haltbar als Frischmilch und stellt eine zuverlässige Quelle für Fett und Eiweiß unabhängig von der Jahreszeit dar."
 trade_good_beer: "Bier"
 trade_good_beer_desc: "Aus vergorenem Getreide gebraut ist Bier das Alltagsgetränk Nordeuropas. Es ist alkoholarm, aber nahrhaft, in vielen Städten sicherer zu trinken als Wasser und wird von allen gesellschaftlichen Schichten getrunken."
 trade_good_wine: "Wein"
 trade_good_wine_desc: "Wein entsteht durch das Vergären von Trauben und hat in der mittelalterlichen Kultur als Getränk von Kirche, Adel und wohlhabenden Schichten eine herausgehobene Stellung. Er wird ausgehend von Anbaugebieten im Mittelmeerraum und im Rheintal weithin gehandelt."
 trade_good_oil: "Olivenöl"
 trade_good_oil_desc: "Dieses aus Oliven gewonnene Öl dient im gesamten Mittelmeerraum als Kochfett, Brennstoff für Lampen und Rohstoff für die Seifenherstellung. Seine Bedeutung nimmt nach Norden hin ab, wo tierische Fette und Butter an seine Stelle treten."
 trade_good_honey: "Honig"
 trade_good_honey_desc: "Honig, das wichtigste Süßungsmittel der mittelalterlichen Welt, findet auch bei der Herstellung von Met, in der Medizin und bei der Haltbarmachung von Lebensmitteln Verwendung. Bienen werden zwar weltweit gehalten, doch für hochwertigen Honig erzielt man Spitzenpreise."
 trade_good_rice: "Reis"
 trade_good_rice_desc: "Reis, das vorherrschende Getreide Süd- und Ostasiens, benötigt überflutete Felder und Wärme, liefert jedoch reiche Erträge. Er bildet die Ernährungsgrundlage für riesige Bevölkerungen."
 trade_good_millet: "Hirse"
 trade_good_millet_desc: "Hirse ist eine widerstandsfähige Getreideart, die auf kargen Böden und in trockenen Klimazonen gedeiht – dort, wo andere Getreidesorten versagen. Sie ist ein Grundnahrungsmittel in weiten Teilen Afrikas, Zentralasiens und den trockeneren Regionen Indiens."
 trade_good_iron: "Eisen"
 trade_good_iron_desc: "Eisen – das unverzichtbarste Metall der mittelalterlichen Welt – wird aus Erz gewonnen, um daraus Werkzeuge, Waffen, Hufeisen und Nägel zu fertigen. Keine Siedlung kann wachsen, ohne ihre Handwerker und Soldaten beständig damit zu versorgen."
 trade_good_alum: "Alaun"
 trade_good_alum_desc: "Alaun ist ein seltenes Salz mit blutstillenden Eigenschaften, das unter anderem bei der Glasveredelung und beim Gerben von Leder zum Einsatz kommt. Es wird vor allem als Beizmittel verwendet, das Textilien bleicht und gleichzeitig dafür sorgt, dass Farbstoffe besser daran haften.\n\nAlaun kommt in seiner natürlichen Form in warmen Regionen wie dem Nahen Osten vor, kann aber auch aus Alunitstein gewonnen werden."
 trade_good_jade: "Jade"
 trade_good_jade_desc: "Jade, ein harter und wunderschöner Stein von großer kultureller Bedeutung in Ostasien, wird zu Werkzeugen, Schmuckstücken und Ritualgegenständen verarbeitet. An chinesischen Höfen erzielt sie enorme Preise und gilt als Symbol für Tugend und Rang."
 trade_good_gold: "Gold"
 trade_good_gold_desc: "Gold, das kostbarste aller Metalle, bildet die Grundlage königlicher Schatzkammern und der wertvollsten Münzprägungen. Seine Seltenheit und sein Glanz machen es zum bevorzugten Material für Kronen, Reliquien und Prunkgegenstände."
 trade_good_silver: "Silber"
 trade_good_silver_desc: "Silber, das am weitesten verbreitete Münzmetall, wird zu Münzen geprägt, die in der gesamten bekannten Welt in Umlauf sind. Neben seiner Verwendung als Zahlungsmittel wird es auch zu Schmuck, Tafelgeschirr und religiösen Gegenständen von großer Schönheit verarbeitet."
 trade_good_amber: "Bernstein"
 trade_good_amber_desc: "Bernstein, ein fossiles Baumharz, das vorwiegend an den Küsten der Ostsee vorkommt, wird bereits seit der Antike gehandelt. Aufgrund seiner warmen, goldenen Farbe und seiner guten Bearbeitbarkeit ist er als Material für Perlen, Anhänger und Ziergegenstände sehr geschätzt."
 trade_good_copper: "Kupfer"
 trade_good_copper_desc: "Als ein weiches, gut zu verarbeitendes Metall wird Kupfer für Kochgeschirr, Kirchenglocken sowie für Legierungen wie Bronze und Messing verwendet. Aufgrund seiner warmen Farbe ist es auch bei dekorativen Metallarbeiten beliebt."
 trade_good_gems: "Edelsteine"
 trade_good_gems_desc: "Edelsteine wie Rubine, Saphire und Smaragde zählen zu den wertvollsten Gütern auf allen Handelsrouten. Geschliffen und poliert schmücken sie Kronen, Reliquiare und den Geschmeidebesitz der Mächtigen."
 trade_good_silk: "Seide"
 trade_good_silk_desc: "Seide, die edelste aller Textilfasern, wird aus den Kokons von Seidenraupen gewonnen und zu Stoffen von außergewöhnlicher Weichheit und besonderem Glanz verwebt. Sie stammt ursprünglich aus China und zählt zu den wertvollsten Handelsgütern der Welt."
 trade_good_textiles: "Stoffe"
 trade_good_textiles_desc: "Gewebte Stoffe aus Wolle, Baumwolle, Leinen oder Mischfasern. Hochwertige Stoffe zählten zu den meistgehandelten Gütern der mittelalterlichen Welt. Namhafte Werkstätten befanden sich in Flandern, Italien und im Nahen Osten."
 trade_good_furs: "Felle"
 trade_good_furs_desc: "Felle von Fuchs, Hermelin, Zobel, Biber und anderen Tieren, die man in den nördlichen Wäldern fängt. Pelzgewänder sind ein Zeichen von Reichtum und Rang, und die Nachfrage an den Höfen des Adels treibt einen lukrativen Handel an."
 trade_good_books_paper: "Bücher & Papier"
 trade_good_books_paper_desc: "Handschriftliche Manuskripte sowie das Pergament oder Papier, auf dem sie festgehalten werden. Bücher bewahren Gesetzestexte, religiöse Schriften und angesammeltes Wissen und sind überall dort gefragt, wo Verwaltung und Gelehrsamkeit aufblühen."
 trade_good_spices: "Gewürze"
 trade_good_spices_desc: "Pfeffer, Zimt, Nelken, Muskatnuss und andere Gewürze aus Süd- und Südostasien gehören zu den wertvollsten Waren der Welt. Sie konservieren Lebensmittel, verleihen ihnen Geschmack und zeugen von Reichtum."
 trade_good_tea: "Tee"
 trade_good_tea_desc: "Tee, der aus den getrockneten und verarbeiteten Blättern der Teepflanze gewonnen wird, ist das prägende Getränk des Fernen Ostens. Er verbreitete sich entlang der Seidenstraße nach Westen und gewann dabei als eigenständige Handelsware an Bedeutung."
 trade_good_dyes: "Färbemittel"
 trade_good_dyes_desc: "Farbstoffe, die aus Pflanzen wie Färberwaid und Färberkrapp, Insekten wie der Kermeslaus sowie Mineralien gewonnen werden. Sie verleihen Stoffen, Keramik und Buchmalereien ihre leuchtenden Farben und sind für die darauf angewiesenen Handwerkszweige unverzichtbar."
 trade_good_jewelry: "Schmuck"
 trade_good_jewelry_desc: "Fertige Schmuckstücke, die Edelmetalle mit Edelsteinen, Emaille oder Glas verbinden. Schmuck ist das sichtbarste Zeichen eigenen Reichtums in der mittelalterlichen Welt und wird als Geschenk sowie als diplomatisches Zeichen ausgetauscht."
 trade_good_ivory: "Elfenbein"
 trade_good_ivory_desc: "Elfenbein, das aus Elefantenstoßzähnen geschnitzt wird, ist ein Material, das von Prestige und Hingabe zeugt. Es findet Verwendung für Zierschnitzereien, Schachfiguren, Reliquienplatten und prunkvollste Dekorationsgegenstände."
 trade_good_glass: "Glas"
 trade_good_glass_desc: "Geblasene und geformte Glasgefäße, Fensterscheiben und Ziergegenstände. Feine Glasarbeiten aus Venedig und der islamischen Welt erzielen hohe Preise, während einfacheres Glas zunehmend in Kirchen und wohlhabenden Haushalten Verwendung findet."
 trade_good_sugar: "Zucker"
 trade_good_sugar_desc: "Der aus Zuckerrohr, das man in warmen südlichen Regionen anbaut, gewonnene Zucker ist ein seltenes und kostspieliges Luxusgut. Er findet Verwendung als Süßungsmittel, als Heilmittel sowie als prestigeträchtige Zutat in den Küchen der Wohlhabenden."
 trade_good_incense: "Weihrauch"
 trade_good_incense_desc: "Duftende Harze wie Weihrauch und Myrrhe wurden in religiösen Zeremonien unterschiedlichster Glaubensrichtungen verbrannt. Für die Gewinnung von Räucherwerk sind Wärme und besondere Baumarten erforderlich. Es wird aus Arabien, Äthiopien und Indien ausgeführt."
 trade_good_ceramics: "Keramik"
 trade_good_ceramics_desc: "Feine Keramik und Porzellan, gefertigt nach hohen handwerklichen und künstlerischen Maßstäben. Hochwertige Keramikerzeugnisse aus China und der islamischen Welt sind begehrte Luxusgüter und Dekorationsgegenstände."
 trade_good_lacquerware: "Lackwaren"
 trade_good_lacquerware_desc: "Mit mehreren Schichten Lackharz überzogene Gegenstände, die man in Ostasien für ihre Haltbarkeit und ihre glänzende Oberfläche schätzt. Lackierte Kästen, Tabletts und Möbelstücke sind Luxusexportgüter, die weite Strecken entlang der Seidenstraßen zurücklegen."
 trade_good_medicaments: "Arzneimittel"
 trade_good_medicaments_desc: "Eine breite Palette an getrockneten Kräutern, Mineralmischungen und verarbeiteten Heilmitteln, die Ärzte und Apotheker verwenden. Der Zugang zu Arzneimitteln ist entscheidend für die Wundversorgung, die Behandlung von Krankheiten und die Bewahrung einer gesunden Bevölkerung."
