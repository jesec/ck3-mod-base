 pam_great_projects_events.0002.t: "$game_concept_grand_cathedral$: Heilige Fresken für [province.GetNameNoTooltip]"
 pam_great_projects_events.0002.desc: "Während Priester das Wort Gottes zurate ziehen können, sind es heilige Bilder, die den Schäflein die Wahrheit und die Herrlichkeit des Herrn vor Augen führen.\n\nDa die nötigen Mittel beschafft und Ikonenmaler versammelt sind, muss ich nun entscheiden, welche Szenen aus der Heiligen Schrift die Gewölbe, Wände und Decken schmücken sollen."
 pam_great_projects_events.0002.a: "Die Heiligen Drei Könige bei der Geburt Christi."
 pam_great_projects_events.0002.b: "Sankt Hieronymus in der Wüste mit dem Löwen."
 pam_great_projects_events.0002.c: "Abraham und Lot, wie sie Ägypten auf dem Weg nach Kanaan verlassen."
 pam_great_projects_events.0002.d: "Mariä Verkündigung."
 pam_great_projects_events.0002.e: "Der Heilige Augustinus mit einem vom Wissen des Herrn entflammten Herz."
 pam_great_projects_events.0002.f: "Christus, wie er die Füße der Apostel wäscht."
 pam_great_projects_events.0002.mystic_xp: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] mehr [trait_level_track_xp|E] gewähren, wenn man die [trait|E] „[GetTrait('lifestyle_mystic').GetName(GetNullCharacter)]“ hat"
 pam_great_projects_events.0002.scholar_xp: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] [trait_level_track_xp|E] gewähren, wenn man die [trait|E] „[GetTrait('lifestyle_scholar').GetName(GetNullCharacter)]“ hat"
 pam_great_projects_events.0002.pilgrim_xp: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] [trait_level_track_xp|E] gewähren, wenn man die [trait|E] „[GetTrait('pilgrim').GetName(GetNullCharacter)]“ hat"
 pam_great_projects_events.0002.piety: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] @piety_icon![piety|E] gewähren"
 pam_great_projects_events.0002.learning_xp: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] @skill_learning_icon![Concept('learning', 'Bildungs')|E]-[lifestyle_experience|E] gewähren und den Gläubigen [spiritual_fulfillment|El]"
