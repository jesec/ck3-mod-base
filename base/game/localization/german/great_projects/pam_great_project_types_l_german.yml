l_german:
 great_project_type_pam_cathedral_01: "Errichtet eine $building_type_great_project_cathedral_01$"
 great_project_type_pam_cathedral_01_desc: "Setzt das strahlende Kreuz auf feste Steinmauern, auf stattliche Kuppeln und hohe Türme! Bringt das wundersame Licht des Himmels auf die Erde und lasst es auf dem Thron und dem Altar eines heiligen Prälaten erstrahlen.\n\nNach Jahren edler Mühen wird ein großes Leuchtfeuer für die Gläubigen in nah und fern erstrahlen."
 great_project_type_pam_cathedral_02: "Errichtet eine $building_type_great_project_cathedral_02$"
 great_project_type_pam_cathedral_02_desc: "Lasst Spitzbögen emporragen und Buntglas erstrahlen!\n\nWie ein Lazarus wird diese edle Kathedrale neu geboren werden, um uns in ein neues Zeitalter zu führen."
 great_project_type_pam_cathedral_03: "Errichtet eine extravagante Großkathedrale"
 great_project_type_pam_cathedral_03_desc: "Mögen die Verzierungen aus Maßwerk und Schleifsteinen eine Krone aus heiligem Feuer sein, die eine neue Herrschaft für dieses glorreiche Bauwerk symbolisiert!\n\nEine große Erweiterung wird die [GetBuilding('great_project_cathedral_02').GetName|V] als [GetBuilding('great_project_cathedral_03').GetName|Vl] krönen und ihre Türme werden die Gläubigen hüten und durch die Endzeit führen."
