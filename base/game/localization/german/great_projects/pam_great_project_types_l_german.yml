 cathedral_stained_glass_contributor_tt: "Ihr habt die [prestige_level|E] [GetPrestigeLevelName('(int32)2')] oder höher, die [piety_level|E] [GetPietyLevelName('(int32)3')] oder höher oder einen [title|E] im [kingdom|E]-Rang"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: Gemaltes Licht in [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.desc: "„#EMP Hell ist, was hell mit Hellem verbunden ist, und hell wird das edle Werk sein, das vom neuen Licht durchdrungen ist.#!“ [religion_buddy.GetTitledFirstName|U] sagt dies beim Anblick des in der Sonne glänzenden Kristallglases.\n\nDer Glaser [glazier.GetTitledFirstName] hat Teile aus [Glossary('Schmelzfarben','POT_METAL_GLOSS')] auf weiß getünchten Tischen ausgebreitet, damit wir die Entwürfe besser studieren können.\n\nIch erkläre: „Dieses Fenster wird sowohl vom Kirchenschiff als auch in [province.GetNameNoTooltip] zu sehen sein. Es muss daher Folgendes zeigen …“"
 pam_great_projects_events.0003.a: "Eine Wurzel Jesse, die die Legitimität der [ROOT.Char.GetDynastyNameNoTooltip] stärkt."
 pam_great_projects_events.0003.a.flavor: "[Glossary('Wurzel Jesse','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] [dynasty|E]-Mitgliedern, die als Anführer einer [travel|E] zu Besuch kommen, @dynasty_prestige_icon![dynasty_prestige|E] gewähren"
 pam_great_projects_events.0003.b: "Eine Spendentafel mit Eurem Porträt und Wappen."
 pam_great_projects_events.0003.b.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] Besuchern @prestige_icon![prestige|E] gewähren."
 pam_great_projects_events.0003.c: "Pilgerwunderszenen, die Anbeter aus der Ferne anlocken."
 pam_great_projects_events.0003.c.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] erhöhte [trait_level_track_xp|E] gewähren, wenn man die [trait|E] [GetTrait('pilgrim').GetName(GetNullCharacter)] hat."
 pam_great_projects_events.0003.d: "Ein Marienfenster, vor dem eine immerwährende Lampe brennt."
 pam_great_projects_events.0003.d.flavor: "Er soll eine Öllampe und Kerzen vor dem gläsernen Bildnis von [blessed_mary.GetTitledFirstName] entzünden."
 pam_great_projects_events.0003.d.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] @stress_loss_icon![stress_loss|E] und [spiritual_fulfillment|El] gewähren"
 pam_great_projects_events.0003.d.dulia.tt: "[GetTenetType('tenet_dulia').GetBaseName] als einen [Concept('personal_tenet', 'persönlichen Grundsatz')|E] zu haben, gewährt [spiritual_fulfillment|El] beim Besuch"
 pam_great_projects_events.0003.e: "Ein Zyklus des Märtyrertums durch das Wirken eines Königs."
 pam_great_projects_events.0003.e.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] eifernden Besuchern zusätzliche @piety_icon![piety|E] und @stress_loss_icon![stress_loss|E] gewähren."
 pam_great_projects_events.0003.e.owner_msg.title: "Märtyrertum in Glas"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName|U] gab ein Buntglasfenster mit einem Zyklus des Märtyrertums für die [grand_cathedral|E] in Auftrag. Dieses Thema sorgt für eine größere Hingabe."
 TREE_OF_JESSE_GLOSS: "Die Wurzel Jesse veranschaulicht die Abstammung Christi, der aus der liegenden Figur Jesse, dem Vater Davids, hervorgeht. Kirchenfenster aus Buntglas stellten die biblische Königslinie mit einem Bezug auf die herrschende Dynastie dar und symbolisierten so das königliche Gottesgnadentum. Bedeutende Beispiele hierfür finden sich in Chartres und Saint-Denis."
 POT_METAL_GLOSS: "Schmelzfarben entstehen durch das Einrühren von Metalloxiden in im Schmelztiegel Hergestelltes. So durchdringt die Farbe die gesamte Scheibe und verbleibt nicht nur auf der Oberfläche. Glasermeister schnitten die abgekühlten Platten in Stücke und legten sie auf weiß getünchte Bretter, um den Lichteinfall zu prüfen, bevor sie das Fenster einsetzten."
 #Grand Cathedral is funded and started
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: Der erste Stein ist gesetzt"
 pam_great_projects_events.0005.desc.intro: "Der Grundstein ist gelegt! Wie aus einer Eichel eine Eiche erwächst, so wird sich der Sitz von [owner.GetTitledFirstName] zu einem erbaulichen Monument entwickeln. Jeder Stein und jeder Balken wird die Herrlichkeit der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) für alle [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] in [owner.GetPrimaryTitle.GetNameNoTier] und der gesamten Christenheit ausstrahlen.\n\nDie Großmut von [CharMyFirstNames(founder)] bei der Finanzierung des Baus wird im Klang der Glocken widerhallen und auf den Lippen eines jeden Gläubigen liegen."
 pam_great_projects_events.0005.desc.contributor: "\n\nInsbesondere muss man den Beitrag von [optional_contributor.GetTitledFirstName] ([contribution.GetName]) erwähnen, der unser Vorhaben ([cathedral_building.GetName]) unsterblich machen wird."
 pam_great_projects_events.0005.desc.outro: "Lasst das große Werk beginnen!"
 pam_great_projects_events.0005.a: "„Unsere Kinder werden seine Vollendung erleben.“"
 #Grand Cathedral Progress Events
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: In göttlicher Ordnung ausgelegt"
 pam_great_projects_events.0006.desc.intro_architect: "Mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] deutet auf"
 pam_great_projects_events.0006.desc.intro_no_architect: "Ich blicke auf"
 pam_great_projects_events.0006.desc.intro: "eine Reihe von Holzpfählen, zwischen denen ein straff gespanntes Seil die Umrisse eines riesigen Kreuzes bildet: eine Vorahnung des kreuzförmigen Gebäudes, das folgen wird."
 pam_great_projects_events.0006.desc.steward_founder: "\n\nIch las von diesem Vorgang schon während meiner Studien!\n\n„Ihr baut also $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n„Aber wie plant man ein solch prächtiges Bauwerk?“, frage ich."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n„Wir bauen $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "[Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! Der Herr schenkte uns eine göttliche Ordnung: Mithilfe eines Winkelmaßes können wir die Proportionen für ein Gebäude extrapolieren, das prächtiger ist als jede Residenz ([ROOT.Char.Custom('ResidenceBuilding')]).“"
 pam_great_projects_events.0006.desc.foundations: "\n\nIch sehe, dass bald mit den Fundamenten begonnen werden wird."
 pam_great_projects_events.0006.a: "Grabt eine Krypta für die Ahnen der [founder.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0006.a.tt: "Eine [GetDomicileBuilding('cathedral_crypt_01').GetName|V] wird in der [cathedral_complex|E] von [owner.GetShortUIName] gebaut, um die [founder.GetDynastyName]-[dynasty|E] zu ehren"
 pam_great_projects_events.0006.b: "Erweitert das Kirchenschiff, um Pilgern Platz zu bieten."
 pam_great_projects_events.0006.b.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] Pilgern auf Besuch erhöhte [GetTrait('pilgrim').GetName(GetNullCharacter)]-[trait_level_track_xp|E] und @piety_icon![piety|E] gewähren"
 pam_great_projects_events.0006.c: "Gott allein führt das Vorgehen."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#!: Lateinisch für „nach dem Quadrat“. Mittelalterliche Baumeister planten Baustellen mithilfe einfacher Proportionen. Sie nutzten das Verhältnis der Seitenlänge eines Quadrats zu seiner Diagonalen. Ein Rechteck mit diesen beiden Seitenlängen galt als harmonisch. Aus dieser Grundeinheit konnte der Maurer eine Kette größerer und kleinerer Quadrate und Rechtecke ableiten und sicherstellen, dass jeder Teil des Plans nahtlos an den nächsten anschloss."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: Die sich hebenden Rippen des Himmels"
 pam_great_projects_events.0007.desc.intro_architect: "Mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] führt mich durch einen dichten Wald aus Balken. Das Gerüst der Kathedrale steht wie eine eigene Holzkirche da und stützt die Steinmetze, die fleißig am Steingewölbe arbeiten."
 pam_great_projects_events.0007.desc.intro_no_architect: "Ich wandle durch einen dichten Wald aus Balken. Das Gerüst der Kathedrale steht wie eine eigene Holzkirche da und stützt die Steinmetze, die am Steingewölbe arbeiten."
 pam_great_projects_events.0007.desc.architect: "\n\n„Sobald diese Gewölbe fertiggestellt sind, werden sie die Gläubigen vor den Elementen schützen und unsere Gebete zum Himmel leiten.“"
 pam_great_projects_events.0007.desc.architect_says: "[architect.Custom('DE_PRO_PER_S_3P_N')|U] nickt zufrieden."
 pam_great_projects_events.0007.desc.outro: "\n\nAls mein Blick auf die vollendete Gewölbekonstruktion fällt, erinnert sie mich an die Rippen des großen Fisches, der Jona verschluckte. So groß ist die Herrlichkeit des Hauses Gottes, dass man sich in die Tiefen des Meeres oder hinauf zu den Sternen versetzt fühlt."
 pam_great_projects_events.0007.a: "Schmückt das Gewölbe mit dem Nachthimmel."
 pam_great_projects_events.0007.a.tt: "Sobald die [grand_cathedral|E] abgeschlossen ist, wird ihre [point_of_interest|E] verbesserte [trait_level_track_xp|E] gewähren, wenn man die [trait|E] [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)] hat"
 pam_great_projects_events.0007.b: "Haltet eine Predigt über Jonas Buße."
 pam_great_projects_events.0007.b.tt: "Euer [faith|E] erhält @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [fervor|E]"
 pam_great_projects_events.0007.c: "Lasst die Steinmetze weiter arbeiten."
 fervor_gain_cathedral_jonah_sermon: "Buße beim Bau der [grand_cathedral|E] gepredigt"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: Wenn Gottes Stimme ertönt"
 pam_great_projects_events.0008.desc.intro: "Der Bau schreitet gut voran, doch der Kathedrale fehlt eine Stimme, um Gläubige aus ganz [owner.GetPrimaryTitle.GetNameNoTier] zusammenzurufen."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName|U] meint, wir müssten eine große Bronzeglocke gießen!"
 pam_great_projects_events.0008.desc.no_architect: "\n\nWir müssen eine Glocke gießen!"
 pam_great_projects_events.0008.desc.need_bell: "Ein gewagtes und teures Unterfangen: Die Schatzkammer von [founder.GetPrimaryTitle.GetNameNoTier] muss sich allein schon von den Kosten des Rohmaterials erholen."
 pam_great_projects_events.0008.desc.plague_named: "\n\nBedauerlicherweise starb der Glockenmacher bei einer Seuche ([epidemic.GetName])."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nBedauerlicherweise starb der Glockenmacher bei der jüngsten Seuche."
 pam_great_projects_events.0008.desc.outro: "[bell_maker_son.GetFirstName|U], [Select_CString(bell_maker_son.IsFemale, 'seine Tochter', 'sein Sohn')], versichert mir, dass das geheime Wissen auf dem Sterbebett von [bell_maker_son.Custom('DE_PRO_POS_S_3P')]em Vater an [bell_maker_son.Custom('DE_PRO_PER_S_3P_A')] weitergegeben wurde und dass [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')] die Glocke gießen kann."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName|U], [Select_CString(bell_maker_son.IsFemale, 'ein ehrgeiziger junger Bronzeschmied, der', 'eine ehrgeizige junge Bronzeschmiedin, die')] von einheimischen Meistern gelehrt wurde, trat an uns heran. [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')|U] sehnt sich danach, [bell_maker_son.Custom('DE_PRO_POS_S_3P')]en Wert zu beweisen, indem [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')|U] eine Glocke gießt, die dem Gotteshaus ([cathedral_building.GetName]) von [owner.GetPrimaryTitle.GetNameNoTier] würdig ist."
 pam_great_projects_events.0008.a: "Wenn er scheitert, bringe ich [bell_maker_son.Custom('DE_PRO_PER_S_3P_A')] um."
 pam_great_projects_events.0008.a.tt: "Wenn der Guss scheitert, lasst Ihr [bell_maker_son.GetShortUIName] hinrichten"
 pam_great_projects_events.0008.belltower_may.tt: "Ein [GetDomicileBuilding('cathedral_belltower_02').GetName|V] kann in der [cathedral_complex|E] von [owner.GetShortUIName] gebaut werden"
 pam_great_projects_events.0008.aa: "Wenn [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')] scheitert, lasse ich [bell_maker_son.Custom('DE_PRO_PER_S_3P_D')] die Haut abziehen."
 pam_great_projects_events.0008.b: "[bell_maker_son.Custom('DE_PRO_PER_S_3P_N')|U] könnte ein Werkzeug des Herrn sein."
 pam_great_projects_events.0008.b.tt: "Ihr vertraut darauf, dass [bell_maker_son.GetShortUIName] die Glocke gießen kann."
 pam_great_projects_events.0008.b.flavor: "War David nicht auch nur ein junger Schafhirte, als er Goliath niederstreckte?"
 pam_great_projects_events.0008.c: "Suchen wir einen sichereren Anwärter, auch wenn [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')] nicht [Select_CString(bell_maker_son.IsFemale, 'die Tochter', 'der Sohn')] eines Meisters ist."
 pam_great_projects_events.0008.duel.success: "Der Guss gelingt! Ein [GetDomicileBuilding('cathedral_belltower_02').GetName|V] wird in der [cathedral_complex|E] von [owner.GetShortUIName] gebaut"
 pam_great_projects_events.0008.duel.failure: "Der Guß misslingt … Ihr müsst entscheiden, wie Ihr weiter verfahren wollt"
 pam_cathedral_bell_casting_duel: "[learning|E] von [CHARACTER.GetShortUIName|U]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: Und Gott sprach"
 pam_great_projects_events.0009.desc.body: "Ich schaue zu, während [bell_maker_son.GetFirstName] hin und her läuft, um die Arbeiter anzuweisen.\n\nStändig stellt [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')] die alte Mannschaft [bell_maker_son.Custom('DE_PRO_POS_S_3P')]es Vaters infrage und besteht auf einem eigenen Vorgehen bei der Auswahl der Grube, dem richtigen Ton für die Gussform und dem Anfeuern der Schmelzöfen."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] und ich schauen zu, während [bell_maker_son.GetFirstName] hin und her läuft, um die Arbeiter anzuweisen.\n\nStändig stellt [bell_maker_son.Custom('DE_PRO_PER_S_3P_N')] die alte Mannschaft [bell_maker_son.Custom('DE_PRO_POS_S_3P')]es Vaters infrage und besteht auf einem eigenen Vorgehen bei der Auswahl der Grube, dem richtigen Ton für die Gussform und dem Anfeuern der Schmelzöfen."
 pam_great_projects_events.0009.desc.success_end: "\n\nDie geschmolzene Bronze läuft in die Form, als würde Gottes Hand selbst sie führen, und so kommt die Glocke schließlich vollständig zum Vorschein. Dann wird sie angehoben, und erstmals erklingt ihr klarer Ruf für alle [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n„Kommt ins Haus des Herren!“"
 pam_great_projects_events.0009.a: "Mögen die ganze Landschaft ([province.Custom('GetTerrainType')]) von [province.GetNameNoTooltip] Gottes Stimme vernehmen."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: Ein Vorbote des Untergangs!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nDie geschmolzene Bronze kreischt in der Form, die Glocke scheint aber vollständig zu sein. Sie wird hoch- und herausgezogen, doch als der Klöppel auf den Klangbogen trifft, ist nur ein dumpfer Schlag zu hören, gefolgt von einem Knall. Ein Vorbote des Untergangs!"
 pam_great_projects_events.0010.a: "Versprechen müssen gehalten werden."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U] wird hingerichtet"
 pam_great_projects_events.0010.b: "Die gesprungene Glocke ist schon Strafe genug."
 pam_great_projects_events.0010.b.faith: "Das Herr hat noch einen Plan für [bell_maker_son.Custom('DE_PRO_PER_S_3P_A')]."
 pam_great_projects_events.0010.c: "Schmelzt die Bronze wieder ein. Gießt etwas Schärferes."
 pam_great_projects_events.0010.c.tt: "Die gesprungene Glocke wird zu etwas Schärferem umgegossen: Dessen erstes Opfer ist [bell_maker_son.GetShortUIName]. In Zukunft werden Handwerker in [founder.GetCapitalLocation.GetNameNoTooltip] gehorsamer sein."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Ihr erhaltet stattdessen [intrigue_lifestyle|E]-[experience|E]"
 pam_great_projects_events.0010.d: "Möge dies eine Lektion in Bescheidenheit sein."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: Als ob es die Hand des Herrn wäre"
 pam_great_projects_events.0011.desc.intro: "Als ich den Baufortschritt in Sachen [cathedral_building.GetName] in [province.GetNameNoTooltip] begutachte, werden meine Ohren vom knirschenden Kreischen eines gewaltigen, sich drehenden Holzgebildes angegriffen."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName|U] zeigt mir die riesige Tretmühle, die zwei Arbeiter antreiben."
 pam_great_projects_events.0011.desc.no_architect: "\n\nIch entdecke die Quelle des Lärms: eine riesige Tretmühle, die zwei Arbeiter antreiben."
 pam_great_projects_events.0011.desc.outro: "\n\nAls ob es die Hand des Herrn wäre, ziehen Seile und Flaschenzüge gewaltige, frisch geschnittene [Glossary('Quadersteine','ASHLAR_GLOSS')] und Eimer mit Mörtel zum im Bau befindlichen Dach. In Ehrfurcht sehe ich mir die Ladung an, die den Trägern im Hof darunter zweifelsohne das Rückgrat gebrochen hätte."
 pam_great_projects_events.0011.a: "Wir [founder.GetCulture.GetCollectiveNounNoTooltip] müssen so viel über dieses große Rad erfahren, wie wir nur können."
 pam_great_projects_events.0011.a.tt: "Eure [culture|E] erhält @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! Fortschritt zum derzeitigen [cultural_fascination|E]"
 pam_great_projects_events.0011.b: "Viele Vorhaben in [founder.GetCapitalLocation.GetNameNoTooltip] könnten Gewinn daraus ziehen …"
 pam_great_projects_events.0011.c: "Eindrucksvoll, doch solche Taten würde ich lieber dem Herrn überlassen."
 ASHLAR_GLOSS: "Quadersteine ​​sind präzise behauene und bearbeitete Steine, die am Boden begradigt und geglättet werden. Eine genaue Planung ist notwendig, damit die Steine nach dem Anheben auf die für den Bau von Kathedralen erforderlichen Höhen genau zusammenpassten."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: Eine höhere Berufung"
 pam_great_projects_events.0013.desc: "Das dumpfe Pochen der Zimmermannshämmer hallt über uns wider, eine Vorahnung jener Akustik, mit der die Gläubigen bald das Wort Gottes erleben werden.\n\n[architect.GetFirstName|U] erklärt: „Es soll ein bescheidener Emporiumsraum werden, wo die Kanoniker die Liturgie leiten werden – unsere eigene [Glossary('Cantoria','CANTORIA_GLOSS')]! Wir müssen wahrlich mit anderer Stimme zum Herrn sprechen als zu unseren Mitmenschen.“ [architect.Custom('DE_PRO_PER_S_3P_N')|U] winkt dann einen jungen Chorknaben namens [choir_boy.GetFirstName] nach vorn.\n\nDas Kind huscht das Gerüst hinauf und haucht einen engelsgleichen Ton: Als dieser von den Wänden widerhallt und in meinen Körper eindringt, ist es, als ob Gott durch mich hindurchgefahren wäre."
 pam_great_projects_events.0013.a: "Erweitert die Empore – je mehr Stimmen, desto besser."
 pam_great_projects_events.0013.b: "Dieser Engel muss meinen Hof zieren."
 pam_great_projects_events.0013.castrato: "Bewahrt diese Stimme für die Cantoria des Herrn."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U] wurde kastriert, damit [choir_boy.Custom('DE_PRO_PER_S_3P_N')] nicht in den Stimmbruch kommt"
 pam_great_projects_events.0013.c: "Dieses Theater ist doch nur ein Aufwand, um mir mehr Geld abzuknöpfen!"
 pam_great_projects_events.0013.d: "Ich bin überwältigt und muss mich entschuldigen."
 CANTORIA_GLOSS: "Eine Cantoria ist eine erhöhte Gesangsgallerie, die oft über dem Chor oder unweit der Vierung liegt, wo Sänger (und später die Orgeln) die Liturgie führen."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: Seine unerschütterliche Liebe"
 pam_great_projects_events.0012.desc: "Die Westfassade ist fertig! Ihr Portal ist bereit, die Gläubigen durch den [Glossary('Narthex','NARTHEX_GLOSS')] willkommen zu heißen. Dieses Vorhaben ([cathedral_building.GetName]) mag ein Leben lang dauern, bis es vollständig abgeschlossen ist, doch die guten Christen von [owner.GetPrimaryTitle.GetNameNoTier] müssen Vertrauen in die Zukunft der unerschütterlichen Liebe des Herrn haben. Meine Predigt beginnt …\n\n#EMP „[ROOT.Char.Custom('RandomBibleQuote')]“#!\n\n… und mit dieser Lektion aus der Heiligen Schrift ziehe ich mich zurück."
 NARTHEX_GLOSS: "Der Narthex ist die Eingangshalle einer Kirche, die sich zwischen den Westtüren und dem Kirchenschiff befindet. Er hieß die Gläubigen im sakralen Raum willkommen und diente in strengeren Riten als Ort, an dem Büßer und Katechumenen während der Messe von der Gemeinde getrennt waren."
 pam_great_projects_events.0012.a: "„Gesegnet seien die Friedensstifter …“"
 pam_great_projects_events.0012.a.flavor: "„[Glossary('… denn sie werden Kinder Gottes genannt werden.','MATTHEW_5_9_GLOSS')]“"
 pam_great_projects_events.0012.a.tt: "Jede [owner.GetFaith.GetAdjective|l]e [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] erhält für #V 10 Jahre#!: [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "„Geh zur Ameise, du Fauler …“"
 pam_great_projects_events.0012.b.flavor: "„[Glossary('… betrachte ihr Verhalten und werde weise!','PROVERBS_6_6_GLOSS')]“"
 pam_great_projects_events.0012.b.tt: "Jede [owner.GetFaith.GetAdjective|l]e [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] erhält für #V 10 Jahre#!: [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "„Ich ermahne euch aber, Brüder und Schwestern …“"
 pam_great_projects_events.0012.c.flavor: "„[Glossary('… im Namen unseres Herrn Jesus Christus: Seid alle einmütig und duldet keine Spaltungen unter euch; seid vielmehr eines Sinnes und einer Meinung!','1_CORINTHIANS_1_10_GLOSS')]“"
 pam_great_projects_events.0012.c.tt: "Jede [owner.GetFaith.GetAdjective|l]e [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] erhält für #V 10 Jahre#!: [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "„Freut euch zu jeder Zeit! Betet ohne Unterlass!“"
 pam_great_projects_events.0012.d.flavor: "„[Glossary('… Dankt für alles; denn das ist der Wille Gottes für euch in Christus Jesus. Löscht den Geist nicht aus! Verachtet prophetisches Reden nicht!','1_THESSALONIANS_5_16_20_GLOSS')]“"
 pam_great_projects_events.0012.d.tt: "Jede [owner.GetFaith.GetAdjective|l]e [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] erhält für #V 10 Jahre#!: [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "„Lasst uns mit Ausdauer in dem Wettkampf laufen, der vor uns liegt …“"
