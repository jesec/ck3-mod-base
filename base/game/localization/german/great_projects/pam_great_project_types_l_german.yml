 great_project_type_pam_mass_rite_conversion_desc_christian: "Mit ausreichend Mitteln können wir das Licht des Herrn nicht nur einzelnen Heiden bringen, sondern ganzen heidnischen [Concept('realms', 'Reichen')|E]. Unter unserer Anleitung werden sie den rechtschaffensten [rite|E] kennenlernen und so die [christendom|E] wachsen lassen."
 great_project_type_pam_mass_rite_conversion_desc_generic: "Mit ausreichend Mitteln können wir unseren Glauben nicht nur durch verstreute Bekehrungen verbreiten, sondern in ganze [realms|E] tragen, in denen noch feindliche [faiths|E] vorherrschen. Unter unserer Anleitung werden sie den rechtschaffensten [rite|E] kennenlernen und so die [christendom|E] wachsen lassen."
