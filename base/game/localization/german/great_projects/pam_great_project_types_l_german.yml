 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: Die Krönung der Türme"
 pam_great_projects_events.0020.desc: "Endlich sind die Kreuze an den Turmspitzen angebracht – jedes einzelne wie jenes, das für Christus vor so langer Zeit auf dem Hügel von [Glossary('Golgatha','GOLGOTHA_GLOSS')] stand. Sie sind ein Mahnmal seines Leidens für unser Heil und ein Versprechen, dass sein Blut an jedem Sabbat fließt, um uns von unseren Sünden zu reinigen.\n\nSeit Beginn des Baus wurden aus Söhnen Väter und aus Vätern alte Männer, die nun im Grab ruhen. Doch ihr edles Werk, ihr Schweiß und ihr Blut wurden in Stein verewigt.\n\nReiche mögen untergehen, doch das große Vorhaben ([cathedral_building.GetName]) von [province.GetName] wird ewiglich Bestand haben wie Gottes Liebe."
 pam_great_projects_events.0020.a: "Kommt aus nah und fern, um an unserer Seite zu beten!"
 GOLGOTHA_GLOSS: "Golgatha – abgeleitet vom lateinischen #EMP Calvariae locus#! oder „Schädelstätte“ – war ein schädelförmiger Hügel im römischen Jerusalem und der Ort der Kreuzigung Jesu. Die Hinrichtung fand außerhalb der Stadtmauern statt, unweit des Grabes, in dem er beigesetzt wurde. Heute befindet sich die Stätte innerhalb der Grabeskirche nahe dem [GetBuilding('dome_of_the_rock_01').GetName|V]."
