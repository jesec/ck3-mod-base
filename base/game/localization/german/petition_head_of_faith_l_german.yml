 # Invalidation event
 petition_head_of_faith.0601.t: "Petition aufgegeben"
 petition_head_of_faith.0601.desc.no_head: "Als ich bereit bin, meinen Fall vorzutragen, gibt es keinen passenden Hirten mehr, der meine Petition in Empfang nehmen könnte."
 petition_head_of_faith.0601.desc.head_dead: "[recipient.GetTitledFirstName|U] starb, bevor meine Petition angehört werden konnte."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName|U] wurde eingekerkert und kann keine formellen Petitionen annehmen."
 petition_head_of_faith.0601.desc.head_changed: "Das Oberhaupt meines Glaubens änderte sich und meine Petition kann nicht mehr [recipient.GetTitledFirstName] präsentiert werden."
 petition_head_of_faith.0601.desc.at_war: "Ich kann keine formelle Petition vortragen, während ich im Krieg mit [recipient.GetTitledFirstName] liege."
 petition_head_of_faith.0601.desc.repentance_resolved: "Es gibt keine Exkommunikation, die ich aufheben lassen könnte."
 petition_head_of_faith.0601.desc.repentance_too_soon: "Meine Buße würde nicht so früh nach meiner letzten Rüge angehört werden."
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.GetTitledFirstName|U] starb, bevor die Petition angehört werden konnte."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName|U] gehört nicht mehr zu meinem Glauben, weswegen keine formelle Exkommunikation erbeten werden kann."
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName|U] ist kein König oder höherer Herrscher und liegt daher außerhalb dieser formellen Petition."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName|U] wurde bereits exkommuniziert."
 petition_head_of_faith.0601.desc.fallback: "Meine Petition kann nicht weiter verfolgt werden und die Reise ist bedeutungslos."
 petition_head_of_faith.0601.desc.refund.piety: "Die frommen Opfergaben, die ich für diese Petition zur Seite gelegt hatte, werden wiederhergestellt."
 petition_head_of_faith.0601.desc.refund.none: "Zumindest hatte noch nichts den Besitzer gewechselt."
 petition_head_of_faith.0601.a: "So sei es."
 # Arrival event (shared by 1000 and 3000)
 petition_head_of_faith.1000.t.repentance: "Petition: Buße"
 petition_head_of_faith.1000.t.excommunication: "Petition: Exkommunikation"
 petition_head_of_faith.1000.desc.court_low_grandeur: "Der einst prächtige Palast liegt nun in Trümmern um mich herum. Ich bete, dass dies nicht widerspiegelt, wie spirituell verarmt [Select_CString(recipient.GetFaith.ReligiousHead.IsFemale, 'die', 'der')] [recipient.GetFaith.ReligiousHeadName] ist.\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "Der Palast, berühmt für seine prächtigen Hallen, flößt einem beim Betreten wahrlich Ehrfurcht ein. Ich bete, dass die himmlische Vergoldung die Gerechtigkeit und den geistlichen Reichtum im Innern widerspiegelt.\n\n"
 petition_head_of_faith.1000.desc.intro: "Dort sitzt Gottes Stellvertreter auf Erden. "
 petition_head_of_faith.1000.desc.recipient_sinful: "Auch wenn es wohlbekannt ist, dass [recipient.Custom('DE_PRO_PER_S_3P_N')] sündig ist ([petition_hof_gravest_sin.GetName(recipient)]), fand [recipient.Custom('DE_PRO_PER_S_3P_N')] durch irgendeine Teufelei doch den Weg zum Petrusthron."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Sicher wird [recipient.Custom('DE_PRO_POS_S_3P')] Urteil durch sein [petition_hof_gravest_virtue.GetName(recipient)|l]es Wesen gelenkt werden."
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.Custom('DE_PRO_POS_S_3P')|U]e versagende Gesundheit ist eindeutig das Ergebnis eines Lebens voll edlen Wirkens."
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.Custom('DE_PRO_POS_S_3P')|U]e versagende Gesundheit ist eindeutig das Ergebnis eines Lebens voll verheerender Ausschweifungen."
 petition_head_of_faith.1000.desc.address: "\n\nIch trage meine Bitte bei [recipient.Custom('DE_PRO_PER_S_3P_D')] vor: „Heilig[recipient.Custom('DE_END_ADJ_IND_S_N')] [recipient.GetMotherFather|U], "
 petition_head_of_faith.1000.desc.repentance: "Ich komme in Demut und bitte um Befreiung von jenem Tadel, der auf meiner Seele lastet, und bete um die Wiederaufnahme in die Gemeinschaft der Gläubigen.“"
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName|U] beging Verbrechen gegen Gott. Ich trete nun als [Select_CString(ROOT.Char.IsFemale, 'demütige Botin', 'demütiger Bote')] vor Euch: Denn es steht selbstverständlich nur Euch zu, über [petition_target.Custom('DE_PRO_POS_S_3P')]e unsterbliche Seele zu urteilen.“"
 petition_head_of_faith.1000.a.argue: "Ich werde meinen Fall vortragen."
 petition_head_of_faith.1000.a.argue_tt: "Versuchen, [recipient.GetShortUINameNoTooltip] während der Audienz zu überzeugen"
 # Disposition indicators in arrival desc
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n„Wir haben Euch gehört, mein Kind. Sprecht über die Einzelheiten Eurer Bitte und wir werden sie mit Wohlwollen bedenken.“"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n„Eure Petition liegt uns vor. Wir werden urteilen, wie der Kanon und die heilige Mutter Kirche es erfordern.“"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n„Schöne Worte sind leicht ausgesprochen. Wir empfangen Eure Petition mit der Skepsis, die des Herrn würdig ist.“"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\nIhr maßt Euch allein schon mit der Reise hierher viel an. Wählt Eure nächsten Worte mit Bedacht.“"
 petition_head_of_faith.1000.desc.conclusion: "[recipient.Custom('DE_PRO_PER_S_3P_N')|U] blickt mich nach diesen Worten erwartungsvoll an."
 # Human Head of Faith decision events (1310/1320)
 petition_head_of_faith.1310.t: "Petition: Buße von [actor.GetTitledFirstNameNoTooltip]"
 petition_head_of_faith.1310.desc.intro: "„[Select_CString(ROOT.Char.IsFemale, 'Heilige Mutter', 'Heiliger Vater')], ich wurde exkommuniziert und bin ausgeschlossen von den Sakramenten und der Gemeinschaft der Gläubigen. Ich bitte Euch, nehmt dieses Mal von meiner Seele und lasst mich wieder in die Gemeinschaft der Heiligen aufgenommen sein“, sagt [actor.Custom('DE_ART_DEF_S_N')] knieende [actor.GetTitledFirstName]. „Beweist Eure Reue vor Gott“, antworte ich."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n„Ihr habt Euch mir gegenüber schon als mildtätig erwiesen, [Select_CString(ROOT.Char.IsFemale, 'Heilige Mutter', 'Heiliger Vater')]. Ich bitte um keine irdische Gunst, sondern nur darum, dass Gott und die Heilige Kirche erkennen, wie wahrhaftig meine Buße ist.“"
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n„Vor Gott stehe ich da wie jeder Büßer und bitte nur um Gerechtigkeit nach dem Kanon.“"
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n„Haltet mich nicht für [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], die mit süßen Worten andere vom Weg abführt. Ich schwöre vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und [Select_CString(ROOT.Char.IsFemale, 'ihrer Stellvertreterin', 'seinem Stellvertreter')] auf Erden, dass ich bußfertig bin.“"
 petition_head_of_faith.1310.serpent.christian: "die Schlange im Garten"
 petition_head_of_faith.1310.serpent.generic: "eine Schlange"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n„In der Welt mögen wir Feinde sein, doch ich bitte Euch nicht, gut von mir in weltlichen Belangen zu sprechen, sondern meine Buße anzuerkennen und meine Seele nicht in Gefahr zu bringen.“"
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n„Es drang an unser Ohr, dass Ihr sündig ([petition_gravest_sin.GetName(actor)]) seid. Eitle Worte waschen keine befleckte Seele rein. Welche Buße bietet Ihr an?“"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n„An Eurem Namen haften kaum noch Laster. Vielleicht hat der Bann schon sein heilsames Werk getan. Wir werden sehen, ob Eure Seele auch zu Eurer Haltung passt.“"
 petition_head_of_faith.1310.a: "„Erhebt Euch, mein Kind. Ihr seid wieder in die Gemeinschaft der Heiligen aufgenommen.“"
 petition_head_of_faith.1310.b: "„Die Maßregelung bleibt bestehen. Kehrt wieder, wenn Eure Buße ersichtlicher ist.“"
 petition_head_of_faith.1320.t: "Petition: Exkommunikation von [petition_target.GetTitledFirstNameNoTooltip]"
 petition_head_of_faith.1320.desc.intro: "„[Select_CString(ROOT.Char.IsFemale, 'Heilige Mutter', 'Heiliger Vater')], [petition_target.GetTitledFirstName] beging Verbrechen gegen Gott. Wenn diese Fäulnis nicht herausgeschnitten wird, sind unser aller Seelen in Gefahr“, sagt [actor.GetTitledFirstName].\n\n„Wir führen die Exkommunikation nicht wie das Schwert eines Fürsten. Sprecht klar und deutlich Eure Anschuldigungen vor Gott aus“, antworte ich."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n„Ihr habt Euch mir gegenüber stets als gerecht erwiesen, [Select_CString(ROOT.Char.IsFemale, 'Heilige Mutter', 'Heiliger Vater')]. Ich bitte um keine irdische Gunst, sondern nur darum, dass Gott und die Heilige Kirche erkennen, wie schwer die Verstöße von [petition_target.GetTitledFirstNameNoTooltip] wiegen.“"
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n„Vor Gott trage ich diese Anschuldigung als einfacher Untertan des Herrn Jesu Christi vor und bitte nur darum, was die Gerechtigkeit der Heiligen Kirche erfordert."
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n„Haltet mich nicht für die Schlange im Garten, die mit süßen Worten andere zur Schlichtung privater Streitigkeiten verleitet. Ich schwöre vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und [Select_CString(ROOT.Char.IsFemale, 'ihrer Stellvertreterin', 'seinem Stellvertreter')] auf Erden, dass diese Anschuldigung rechtschaffen sind."
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n„In der Welt mögen wir Feinde sein, doch ich bitte Euch, die Seele von [petition_target.GetTitledFirstNameNoTooltip] so zu bewerten, wie der Kanon es verlangt."
 petition_head_of_faith.1320.desc.target_sinful: "Die Fäulnis der Sünde von [petition_target.GetTitledFirstNameNoTooltip] entspringt einem ganz bestimmten Wesen ([petition_gravest_sin.GetName(petition_target)]).“"
 petition_head_of_faith.1320.desc.finish: "[actor.GetTitledFirstName|U] schließt seine Ausführungen mit diesen Worten."
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNameNoTooltip|U] mag die eigene Verderbtheit gut verbergen, doch ich vertraue darauf, dass diese Sünden offenbar werden, wenn Ihr Euch vom Herrn führen lasst.“"
 petition_head_of_faith.1320.a: "„Ich entferne [petition_target.Custom('DE_PRO_PER_S_3P_A')] aus der Gemeinschaft der Heiligen.\""
 petition_head_of_faith.1320.b: "„Euer Fall ist nicht überzeugend. Keine Rüge soll [petition_target.Custom('DE_PRO_PER_S_3P_A')] treffen.“"
 # Excommunication success result event (2020/4020)
 petition_head_of_faith.2020.t: "Exkommunikation verkündet"
 petition_head_of_faith.2020.desc: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] erhebt sich, um die Gerechtigkeit des Herrn zu verkünden:\n\n„[petition_target.GetTitledFirstName|U] wird exkommuniziert und aus der Gemeinschaft der Heiligen ausgeschlossen. [petition_target.Custom('DE_PRO_POS_S_3P')|U]e Seele schwebt in höchster Gefahr, bis wahre Buße geleistet wird.“"
 petition_head_of_faith.2020.a: "Die höchste Macht ([recipient.GetFaith.HighGodName]) sprach durch ihre Diener."
 # Excommunication failure result event (2030/4030, argument-specific)
 petition_head_of_faith.2030.t: "Die Petition wird abgelehnt"
 petition_head_of_faith.2030.desc.intro: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] erhebt sich, um die Gerechtigkeit des Herrn zu verkünden:"
 petition_head_of_faith.2030.desc.cite_sins: "„Die Sünden, die Ihr nennt, sind nicht schwer genug für einen solch schrecklichen Richtspruch. [petition_target.GetTitledFirstName|U] wird nicht exkommuniziert.“"
 petition_head_of_faith.2030.desc.finesse: "„Wir werden nicht die Gläubigen für ein paar Münzen aus dem Säckel eines Fürsten verstoßen. Alles, was des Kaisers ist, kann doch nicht den Richtspruch von [recipient.GetFaith.HighGodName] kaufen.“"
 petition_head_of_faith.2030.desc.learning_duel: "„[Select_CString(petition_target.IsFemale, 'Eine', 'Ein')] [petition_target.GetTitleAsNameNoTooltip] würde von Euch in eine absichtliche Verzerrung kanonischen Rechts verstrickt? [petition_target.GetTitledFirstName|U] wird nicht durch die … Stärke Eurer Gelehrsamkeit exkommuniziert.“"
 petition_head_of_faith.2030.desc.fallback: "„Ihr maßt Euch zu viel an! Ich sehe keinen Grund, [petition_target.GetTitledFirstName] zu exkommunizieren.“"
 petition_head_of_faith.2030.a: "Ich schätze, die höchste Macht ([recipient.GetFaith.HighGodName]) hat durch ihren Stellvertreter gesprochen."
 # Excommunication argument event (2000/4000, AI Head of Faith)
 petition_head_of_faith.2000.t: "Der Streit"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "„Wollt Ihr die Verbrechen von [petition_target.GetTitledFirstNameNoTooltip] mit der Heiligen Schrift und den Kanones der Kirche beweisen? Hat [petition_target.Custom('DE_PRO_PER_S_3P_N')] sich vor Götzenbildern verneigt?“"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "„Wollt Ihr Eure Anschuldigungen gegenüber [petition_target.GetTitledFirstNameNoTooltip] dem steinernen Kreuz zu Füßen legen?“"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "„Verdient nicht auch [petition_target.GetTitledFirstNameNoTooltip] die Gnade der Gottesmutter? Steht Ihr hier mit unbeflecktem Gewand?“"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "„Wollt Ihr denn, dass wir [petition_target.GetTitledFirstNameNoTooltip] ob einer privaten Fehde von der heiligen Liturgie ausschließen – anstatt eines Beweises für schwere Sünden?“"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "„Wollt Ihr denn [petition_target.GetTitledFirstNameNoTooltip] den Weg zum Altar Christi verwehren? [petition_target.Custom('DE_PRO_PER_S_3P_D')|U] die Nährung vom Fleisch unseres Herrn nehmen? Soll [petition_target.Custom('DE_PRO_PER_S_3P_N')] denn nicht von seinem Blut trinken dürfen?“"
 petition_head_of_faith.2000.desc.atmosphere_communion: "„Wollt Ihr [petition_target.GetTitledFirstNameNoTooltip] wirklich aus der Gemeinschaft der Heiligen ausschließen?“"
 petition_head_of_faith.2000.desc.atmosphere_confession: "„Wollt Ihr, dass wir gegen [petition_target.GetTitledFirstNameNoTooltip] vorgehen aufgrund von etwas, was unter dem Siegel der Beichte gesagt wurde?“"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "„Wollt Ihr, dass wir [petition_target.GetTitledFirstNameNoTooltip] ausstoßen, wenn nicht auch sanftere Mittel bewirken könnten, dass [petition_target.Custom('DE_PRO_PER_S_3P_N')] der Sünde den Rücken kehrt?“"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "„Wollt Ihr Euch auf die Autorität der Apostel berufen, damit wir [petition_target.GetTitledFirstNameNoTooltip] auf Erden und im Himmel verdammen?“"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "„Ihr stört uns beim Studium der Kanones, um [petition_target.GetTitledFirstNameNoTooltip] zu verdammen. Mag sich denn Eure Rhetorik auch mit den Schriften der Kirchenväter und der Heiligen Schrift selbst begründen lassen?“"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "„Wollt Ihr, dass wir gegen [petition_target.GetTitledFirstNameNoTooltip] handeln aufgrund von an Feiertagen vergossenem Blut oder Gewalt auf Kirchenlanden? Hat [petition_target.Custom('DE_PRO_PER_S_3P_N')] den Gottesfrieden und den Waffenstillstand Gottes gebrochen?“"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "„Ist hier denn wirklich der beste Ort, um Euren Unbill wider [petition_target.GetTitledFirstNameNoTooltip] zu beurteilen? Wäre es nicht besser, wenn Ihr beide zum Kreuz greifen und Krieg wider die Feinde Christi führen würdet?“"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "„Ihr kommt zu uns, damit [petition_target.GetTitledFirstNameNoTooltip] ausgestoßen wird, während wir fünf Patriarchenthrone versuchen, die zersplitternde Christenheit zusammenzuhalten? Glaubt Ihr, die [Glossary('Oikumene', 'OIKOUMENE_GLOSS')] würde ob Eures Ansturms einfach beiseitetreten?“"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "„Hat [petition_target.GetTitledFirstNameNoTooltip] die Verehrung der Märtyrer durch offene Abscheu geschändet?“"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "„Ihr wollt, dass wir [petition_target.GetTitledFirstNameNoTooltip] verstoßen. Gebt uns einen Hinweis darauf, dass [petition_target.Custom('DE_PRO_PER_S_3P_N')] in Ungehorsam und Faulheit lebte, denn die Untätigkeit ist der Feind der Seele.“"
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "„Wollt Ihr denn, dass wir [petition_target.GetTitledFirstNameNoTooltip] verdammen, als hätte [petition_target.Custom('DE_PRO_PER_S_3P_N')] allein Adams Schuld geerbt? Jede Seele kommt mit der Wunde des Sündenfalls in die Welt, doch die Kirche verstößt nur jene, die sich in sündigen Neigungen ergehen.“"
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "„Ihr kommt gehüllt in allerlei edle Gewänder, während Ihr nach Gerechtigkeit gegen [petition_target.GetTitledFirstNameNoTooltip] verlangt. Währenddessen leben unsere Brüder unter den Armen und besitzen nicht mehr als die Kleider, die sie am Leib tragen. Würde ein Bettelgeschwister nicht eher zur Geduld raten? Oder ist die Sünde zu groß dafür?“"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "„Ihr wollt [petition_target.GetTitledFirstNameNoTooltip] die Sakramente verweigern. Ihr wollt [petition_target.Custom('DE_PRO_POS_S_3P')]en Anteil am Reichtum des ewigen Lebens mit Christus im Himmel in Gefahr bringen? Es ist nur auf Erden, dass wir nach Armutsgelübden streben.“"
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "„Ihr wollt, dass wir einen Soldaten Christi nur ob der Worte [petition_target.Custom('DE_PRO_POS_S_3P')]es Feindes verstoßen?“"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "„Wie wollt Ihr, dass die Heilige Mutter Kirche Euren Streit mit [petition_target.GetTitledFirstNameNoTooltip] schlichtet?“"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n„Ihr müsst doch wissen, dass wir die Exkommunikation nicht wie das eigene Schwert eines Fürsten führen. Wir entscheiden selbst, was Gerechtigkeit ist und wie ihr Genüge getan werden kann. Tragt Euren Fall Gott vor!“, fordert [Select_CString(ROOT.Char.IsFemale, 'die Heilige Mutter', 'der Heilige Vater')]."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nAuch wenn die Worte von [recipient.GetFaith.GetReligiousHeadTitle.GetName] unparteiisch klingen mögen, drang auch bis in diese Hallen vor, wie sündhaft das Wesen von [petition_target.GetTitledFirstNameNoTooltip] sein muss. Ich kann daher [petition_target.Custom('DE_PRO_POS_S_3P')]e Übertretungen nur bestätigen."
 petition_head_of_faith.2000.desc.target_clean: "\n\nEs erscheint, als wüsste [recipient.GetTitledFirstName], dass [petition_target.GetTitledFirstNameNoTooltip] gar nicht in Sünde gehüllt ist. Ohne Beweise für dessen Niederträchtigkeit, die dem Hof vorgelegt werden können, werde ich andere Wege zur Gerechtigkeit finden müssen."
 OIKOUMENE_GLOSS: "Griechisch für „bewohnte Welt“. In der oströmischen Sprache meint #bold Oikumene#! die zivilisierte Welt: das Kaiserreich und die weitere christliche Ordnung, der die Kirche vorsteht."
 # Argument options
 petition_head_of_faith.2000.a.cite_sins: "Ruft [petition_target.GetTitledFirstNameNoTooltip] als sündig ([petition_gravest_sin.GetName(petition_target)]) vor Gott aus."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Benennt die Sünden von [petition_target.GetTitledFirstNameNoTooltip] vor Gott."
 petition_head_of_faith.2000.b.finesse: "„Die Kirche hat viele Bedürfnisse. Erlaubt mir, mich um einige zu kümmern.“"
 petition_head_of_faith.2000.c.learning_duel: "Ich werde randständige Teile der Heiligen Schrift zitieren, um [Select_CString(petition_target.IsFemale, 'die', 'den')] [petition_target.GetTitleAsNameNoTooltip], in die Ecke zu drängen."
 petition_head_of_faith.2000.d.hook: "[Select_CString(recipient.GetFaith.ReligiousHead.IsFemale, 'Die', 'Der')] [recipient.GetFaith.ReligiousHeadName] sollte an gewisse … private Angelegenheiten erinnert werden."
 petition_head_of_faith.2000.e.withdraw: "… vielleicht ist dies eine Angelegenheit zwischen der höchste Macht ([petition_target.GetFaith.HighGodName]) und [petition_target.GetTitledFirstNameNoTooltip]."
 petition_head_of_faith.5000.e.withdraw: "… vielleicht bin ich noch nicht ganz bereit dafür."
 petition_head_of_faith_hook_committed_tt: "Ihr setzt ein [hook|E] ein, um es so einzurichten"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip|U] ist eher tugendhaft als sündhaft"
 # Duel outcome descriptions
 petition_head_of_faith_duel_success: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] wird überredet"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] wird überzeugt"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] bleibt unüberzeugt"
 petition_head_of_faith_argument_affronted: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] ist beleidigt"
 petition_head_of_faith_argument_dismissed: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] verwirft Euer Argument"
 petition_head_of_faith_affronted_opinion: "Beleidigt durch Bestechung"
 petition_head_of_faith_affronted_opinion_desc: "Dieser Charakter fühlte sich beleidigt durch einen Bittsteller, der meinte, sich ein religiöses Urteil mit Gold kaufen zu können."
 petition_head_of_faith_dismissed_debate_opinion: "Unbewegt von Argument"
 petition_head_of_faith_dismissed_debate_opinion_desc: "Dieser Charakter wies einen Bittsteller ab, dessen Verzerrung des kanonischen Rechts ihn nicht zu überzeugen vermochte."
 # Setup interaction strings
 petition_head_of_faith_repentance_setup_interaction: "Nach Absolution streben"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Zu Eurem [head_of_faith|E] reisen und darum flehen, dass Eure [excommunication|E] aufgehoben wird"
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Ihr werdet nach [recipient.GetCapitalLocation.GetName] reisen und [recipient.GetTitledFirstName] formell eine Petition zur [excommunication|E] von [secondary_recipient.GetTitledFirstName] vorlegen"
 #####################################################################
 # REPENTANCE: argument events (5000/7000)
 #####################################################################
 petition_head_of_faith.5000.t: "Die Beichte"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "„Ihr kommt zu mir, um die Absolution zu erhalten. Habt Ihr Euch vor Götzenbildern verneigt trotz des Wissens, dass nur die Heilige Schrift und Buße Euch läutern können?“"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "„Ich hoffe, dass Ihr kommt, um die Absolution am Fuß des steinernen Kreuzes zu erflehen.“"
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "„Die Mutter Gottes ist voller Gnade, doch wir können die Rüge nicht allein um ihretwillen aufheben.“"
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "„Und wieder sucht Ihr nach der göttlichen Liturgie. Bedenkt doch, was Euch vom Altar und den Gläubigen fernhält.“"
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "„Euch werden der Altar Christi und die Nährung durch sein Fleisch und Blut verweigert.“"
 petition_head_of_faith.5000.desc.atmosphere_communion: "„Ihr steht getrennt von der Gemeinschaft der Gläubigen da.\""
 petition_head_of_faith.5000.desc.atmosphere_confession: "„Das Bußsakrament erfordert einen vollständigen und wahrhaftigen Bericht.“"
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "„Exkommunikation ist die Arznei der Kirche. Ein Geschenk, damit Ihr Euer Leben ändern und die Zeit im Fegefeuer verkürzen könnt.“"
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "„Wir besitzen die Schlüssel Petri. Diese Autorität kann Euch entbinden, wenn Ihr in der Tat bußfertig seid.“"
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "„Ihr strebt nach Versöhnung. Genügt daher dem Recht anhand des Kapitels und nach der Unterscheidung des Decretum.“"
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "„War Eure Sünde der Bruch des Gottesfriedens und des Waffenstillstands Gottes? Habt Ihr an Feiertagen Blut vergossen?“"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "„Wenn Ihr das Kreuz annahmt und doch der Christenheit geschadet habt, so habt Ihr ganz klar das Gesetz gebrochen.“"
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "„Die fünf Patriarchenthrone blicken auf uns. Wir werden die Absolution nicht zu einer billigen Farce machen, während die [Glossary('Oikumene', 'OIKOUMENE_GLOSS')] uns zuschaut.“"
 petition_head_of_faith.5000.desc.atmosphere_dulia: "„Die Märtyrer verdienten sich ihren Platz im Himmel mit ihrem Blut.“"
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "„Untätigkeit ist der Feind der Seele. Kniet nicht in Reue nieder, sondern in der Bereitschaft, Buße zu tun, zu beten und zu arbeiten.“"
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "„Ihr wurdet in Sünde geboren wie wir alle. Warum noch Eurem Vermächtnis neue Ruchlosigkeit hinzufügen?“"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "„Unsere Geschwister leben unter den Armen mit nicht mehr als ihren zerschlissenen Ordenstrachten.“"
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "„Wir streben auf Erden nach Armutsgelübden. Mit Reichtum und Rang kann man sich keine Sakramente erkaufen.“"
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "„Ihr trugt das Kreuz auf der Brust und beleidigtet doch die Christenheit.“"
 petition_head_of_faith.5000.desc.atmosphere_fallback: "„Absolution verdient man sich nicht nur über Eure langen Pilgerreisen.“"
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n„Ihr sollt wissen, dass wir eine Rüge nicht nur zur Schau oder als Schmeichelei aufheben. Sprecht deutlich Eure Buße vor Gott aus!“, verlangt [Select_CString(recipient.IsFemale, 'die Heilige Mutter', 'der Heilige Vater')]."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nDie Kunde von meinem sündigen Wesen ([petition_gravest_sin.GetName(actor)]) ist sicher schon in diese heiligen Hallen vorgedrungen."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nAuch wenn keine große Ruchlosigkeit offenbart wird, wird der Hof sicher verstehen, dass der Verbannte sein gutes Werk getan hat."
 # Repentance argument options
 petition_head_of_faith.5000.a.confess: "Ich gestehe meine Sünden und halte nichts zurück."
 petition_head_of_faith.5000.b.canon_law: "Ich argumentiere, dass das Kirchenrecht Versöhnung verlangt."
 petition_head_of_faith.5000.c.weep: "Ich unterwerfe mich der Gnade des Hofs."
 # Repentance duel outcomes
 petition_head_of_faith_repentance_duel_success: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] ist gerührt"
 petition_head_of_faith_repentance_duel_failure: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] ist ungerührt"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] nimmt Eure Buße an"
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] ist unüberzeugt von Euren Worten"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] ist gerührt von Eurer Demut"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] ist ungerührt von Eurer Zurschaustellung"
 # Repentance success result event (5020/7020)
 petition_head_of_faith.5020.t: "Absolution gewährt"
 petition_head_of_faith.5020.desc: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] erhebt sich und verkündet die Gnade des Herrn:\n\n„Erhebt Euch, mein Kind. Ihr seid wieder in die Gemeinschaft der Heiligen aufgenommen. Der Bann auf Eurer Seele wird aufgehoben.“"
 petition_head_of_faith.5020.a: "Gepriesen sei die höchste Macht ([recipient.GetFaith.HighGodName])."
 # Repentance failure result event (5030/7030, argument-specific)
 petition_head_of_faith.5030.t: "Keine Absolution"
 petition_head_of_faith.5030.desc.intro: "[recipient.Custom('DE_ART_DEF_S_N')|U] [recipient.GetFaith.ReligiousHeadName] erhebt sich, um die Gerechtigkeit des Herrn zu verkünden:"
 petition_head_of_faith.5030.desc.confess: "„Eure Beichte klingt leer."
 petition_head_of_faith.5030.desc.canon_law: "„Eure schwache Gelehrsamkeit ist Spiegel Eurer Seele."
 petition_head_of_faith.5030.desc.weep: "„Tränen sind keine Buße."
 petition_head_of_faith.5030.desc.fallback: "„Ihr maßt Euch viel an."
 petition_head_of_faith.5030.desc.conclusion: " Die Rüge bleibt bestehen.“"
 petition_head_of_faith.5030.a: "Ich schätze, die höchste Macht ([recipient.GetFaith.HighGodName]) hat durch ihren Stellvertreter gesprochen."
