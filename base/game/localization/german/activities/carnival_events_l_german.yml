 ## Event - the duel
 carnival.1010.t: "Das Duell"
 carnival.1010.desc: "Zwei maskierte Fremde machen sich zum Kampf bereit, während die Menge Platz schafft, damit sich die beiden Käpfer umkreisen können – mit gezückten Messern! Der Hass in ihren Augen verspricht, dass sie mehr als nur etwas Blut sehen wollen."
 carnival.1010.a.desc: "\n\nIch bleibe einfach eine weitere Maske in der Menge."
 carnival.1010.b.desc: "Als man mich bemerkt, wartet die Menge ab, ob ich wohl eingreifen werde."
 carnival.1010.a: "Ruft nach den Wachen, um das Duell zu beenden."
 carnival.1010.b: "Überzeugt sie, damit aufzuhören."
 carnival.1010.c: "Befehlt, dass sie aufhören."
 carnival.1010.d: "Lasst sie das Duell fortsetzen."
 cooltip.carnival.1010_duel_diplomacy_success: "Ihr beendet das Duell"
 cooltip.carnival.1010_duel_diplomacy_fail: "Ihr scheitert daran, das Duell zu beenden"
 cooltip.carnival.1010.duelist01_wins.tt: "[duelist_02.GetShortUIName|U] verliert das Duell und könnte verletzt oder getötet werden."
 cooltip.carnival.1010.duelist02_wins.tt: "[duelist_01.GetShortUIName|U] verliert das Duell und könnte verletzt oder getötet werden."
 carnival.1010.duel_d01_win.desc: "[duelist_01.GetShortUIName|U] gewinnt das Duell"
 carnival.1010_duel_d02_win.desc: "[duelist_02.GetShortUIName|U|] gewinnt das Duell"
 carnival.1010_duel_guards_success.desc: "Wachen kommen angelaufen"
 carnival.1010_duel_guards_fail.desc: "Die Wachen kommen zu spät"
 carnival.1010_duel_guards_success_toast: "Die Wachen unterbinden das Duell"
 carnival.1010_duel_guards_failure_toast: "Die Wachen kommen zu spät, um das Duell zu beenden"
 carnival.1010_duel_diplomacy_success_toast: "Ihr beendetet das Duell"
 carnival.1010_duel_diplomacy_fail_toast: "Ihr scheitertet daran, das Duell zu beenden"
 carnival.1010.duelist01_wounded.tt.toast: "[duelist_01.GetShortUIName|U] wurde während des Duells verwundet"
 carnival.1010duelist01_killed.tt.toast: "[duelist_01.GetShortUIName|U] wurde während des Duells getötet"
 carnival.1010.duelist02_wounded.tt.toast: "[duelist_02.GetShortUIName|U] wurde während des Duells verwundet"
 carnival.1010.duelist02_killed.tt.toast: "[duelist_02.GetShortUIName|U] wurde während des Duells getötet"
 carnival.1010.duel_stop.log_title: "Beendete ein Duell"
 carnival.1010.duel_stop.log: "[carnival_main.GetFirstNameNoTooltip|U] beendete ein Duell zwischen [duelist_01.GetFirstNameNoTooltip] und [duelist_02.GetFirstNameNoTooltip]"
 carnival.1010.duel_continue.log_title: "Scheiterte daran, ein Duell zu beenden"
 carnival.1010.duel_continue.log: "[carnival_main.GetShortUIName|U] versuchte, aber scheiterte daran, ein Duell zwischen [duelist_01.GetShortUIName] und [duelist_02.GetShortUIName] zu beenden"
 ## Event - Gracious Host
 carnival.1011.t: "Huldvoller Gastgeber"
 carnival.1011.desc: "Der Karneval ist eine hervorragende Gelegenheit, um mit meinem Reichtum und meinem Geschmack zu prahlen, indem ich die Türen zu meinem Palast öffne. Während ich dies mit [house_member01.GetFirstNameNoTooltip] bespreche, überlege ich, wen ich einlade. [house_member01.Custom('DE_PRO_PER_S_3P_N')|U] hat ein paar gute Vorschläge. Die endgültige Entscheidung liegt jedoch bei mir."
 carnival.1011.a: "Schmückt den ganzen Palast. Scheut keine Kosten!"
 carnival.1011.b: "Öffnet die Türen für die Armen!"
 carnival.1011.c: "Ladet nur die angesehensten Gäste ein!"
 carnival.1011.d: "Belasst es bei der weiteren Verwandtschaft."
 ## Event - Puppet theater
 carnival.1012.t: "Puppentheater"
 carnival.1012.desc: "Die Gemeinen lieben ihre Puppentheater und starren mit offenem Mund auf Klamauk und zotige Stücke. Groteske Puppen, die voll Spott alle Lebenslagen darstellen: wie sie Unzucht treiben, kämpfen, sich streiten und die verrücktesten Dinge tun.\n\nDer Karneval von [carnival_location.GetName] lockte eine ganze Reihe dieser Puppenspieler an, und obgleich die Leute sie anbeten, sind die [carnival_host.GetFaith.PriestNeuterPlural] ob der vulgären Art dieser Unterhaltung besorgt."
 carnival.1012.a: "Ich werde diese Veranstaltungen heimlich besuchen."
 carnival.1012.b: "Ich besteche eine solche Veranstaltung, um mein eigenes Stück aufführen zu lassen!"
 carnival.1012.c: "Ich werde ganz offen die Veranstaltungen besuchen!"
 carnival.1012.d: "Zensiert die Unterhalter hinter dem Vorhang diskret."
 carnival.1012.e: "Verbietet solch vulgäre Zurschaustellungen."
 ## Event - The Mask Maker
 carnival.1013.t: "[Select_CString(mask_maker.IsFemale, 'Die Maskenmacherin', 'Der Maskenmacher')]"
 carnival.1013.desc: "Als ich über einen größtenteils verlassenen Hof gehe, treffe ich auf [Select_CString(mask_maker.IsFemale, 'eine alte Frau, die', 'einen alten Mann, der')] eine Maske schnitzt. Neben [mask_maker.Custom('DE_PRO_PER_S_3P_D')] ist ein Stand voll mit [mask_maker.Custom('DE_PRO_POS_S_3P')]en Arbeiten: Reihe um Reihe voll Masken jeglicher Art.\n\nDiese Handwerkskunst ist wahrlich erlesen."
 carnival.1013.a: "Kauft alles und verteilt sie an alle, die ich treffe!"
 carnival.1013.b: "Gebt dem Maskenmacher das Geld, um eine Werkstatt einzurichten."
 carnival.1013.c: "Kauft eine erlesene Maske für mich selbst."
 carnival.1013.d: "Kauft eine furchterregende Maske für mich selbst."
 carnival.1013.maskmaker_workshop.log_title: "Investierte in eine Maskenmacherwerkstatt"
 carnival.1013.maskmaker_workshop.log: "[carnival_main.GetShortUIName|U] half einem Maskenmacher, eine Werkstatt einzurichten"
 ## Event - Holy Fools
 carnival.1014.t: "Heilige Narren"
 carnival.1014.desc: "Eine Parodie einer heiligen Prozession bewegt sich die Straße hinunter. Mit Kostümen, die Priester, Mönche und sogar die höchsten Oberhäupter unseres Glaubens verunglimpfen! Der Klerus wird öffentlich lächerlich gemacht."
 carnival.1014_2.a.desc: "\n\nIch bleibe in der Menge verborgen."
 carnival.1014_2.b.desc: "\n\nDie Leute erwarten eine Antwort von mir."
 carnival.1014.a: "Ruft diskret nach den Wachen, um diese Farce aufzulösen."
 carnival.1014.b: "Verurteilt sie für ihre Sündhaftigkeit!"
 carnival.1014.c: "Schließt Euch dem Spott an."
 carnival.1014.d: "Taucht in der Menge unter."
 carnival.1014.e: "So sehr habe ich seit Jahren nicht mehr gelacht!"
 cooltip.carnival.1014.non_believer: "#weak #EMP Verlust von [stress|E] aufgrund Eures Ungläubigen-[Concept('secret', 'Geheimnisses')|E]#!#!"
 carnival.1014.secret.tt.toast: "Ihr erkennt, dass in Ihr Eurem Herzen nie geglaubt habt"
 carnival.1014.mockery.tt.toast: "Ihr fühlt Euch sowohl schuldig als auch erleichtert"
 ## Event - The Cat
 carnival.1015.t: "Die Katze"
 carnival.1015.desc: "Ein kleiner Schatten folgt mir schon den ganzen Tag. An jeder Ecke warten zwei leuchtende Augen und ein rauhes #EMP Miau#! auf mich.\n\n„Es scheint, als hättet Ihr einen Freund gefunden“, sagt [observer_01.GetTitledFirstName] und lacht, als sich die Katze wieder an meinem Bein reibt."
 carnival.1015.a: "Scheint, als soll es so sein!"
 carnival.1015.b: "Ich bin mir sicher, sie würde gern mehr Zeit mit Euch verbringen."
 carnival.1015.c: "[family_member01.GetTitledFirstName|U] könnte einen Gefährten gebrauchen."
 carnival.1015.adopt_cat.log_title: "Adoptierte eine Katze"
 carnival.1015.adopt_cat.log: "[carnival_main.GetShortUIName|U] adoptierte eine Katze"
 ## Event - Lover's mask
 carnival.1016.t: "Die Maske einer Affäre"
 carnival.1016.desc: "Von der Feierstimmung erfasst ziehe ich durch die Straßen von [carnival_location.GetName] und höre Musik durch die Gassen klingen, als sich die Feiernden aus den Tavernen auf die Straßen ergießen. Überall sind Gemeine und Patrizier auf engstem Raum beieinander, Rang und Privilegien durch Masken ersetzt.\n\nJemand klopft mir auf die Schulter und ich sehe hinter mir [Select_CString(woo_character.IsFemale, 'eine maskierte Frau', 'einen maskierten Mann')]. [woo_character.Custom('DE_PRO_PER_S_3P_N')|U] nimmt eine dramatische Haltung ein und kichert. Als [woo_character.Custom('DE_PRO_PER_S_3P_N')] die Maske für einen Moment zur Seite schiebt, ekenne ich [woo_character.GetNameNoTooltip].\n\n#EMP „Seid gegrüßt, mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.GetLadyLord]. Möchtet Ihr den Abend mit mir verbringen? Nur zwei maskierte Fremde, die den Karneval genießen#!“, sagt [woo_character.Custom('DE_PRO_PER_S_3P_N')] und verbeugt sich übertrieben höfisch."
 carnival.1016.a: "Was für eine reizende Überraschung! Zeigt mir den Weg, #EMP „[Select_CString(woo_character.IsFemale, 'Fremde', 'Fremder')].“#!"
 carnival.1016.b: "Ich würde mich über die Begleitung [Select_CString(woo_character.IsFemale, 'einer', 'eines')] #BOLD [Select_CString(woo_character.IsFemale, 'Freundin', 'Freundes')]#!freuen."
 carnival.1016.c: "Und Fremde sollten wir auch bleiben."
 ## Event - In candle light
 carnival.1017.t: "Im Kerzenschein"
 carnival.1017.desc: "Ich entdecke [intent_target.GetNameNoTooltip] in einer ruhigen Taverne. Draußen tobt der Karneval, doch drinnen ist es behaglich – und durch Kerzen erhellt. [intent_target.GetNameNoTooltip] liest, als ich eintrete, und [intent_target.Custom('DE_PRO_POS_S_3P')]e Augenbrauen sind vor lauter Konzentration eng zusammengezogen.\n\nIch bin mir sicher, dass ein geistreiches Gespräch [intent_target.Custom('DE_PRO_POS_S_3P')]e Aufmerksamkeit auf meine Reize lenken kann."
 carnival.1017.a: "Ich beeindrucke [intent_target.Custom('DE_PRO_PER_S_3P_A')] mit meinem Wissen über Literatur."
 carnival.1017.b: "Ich lasse [intent_target.Custom('DE_PRO_PER_S_3P_A')] das Buch über einem geistreichen Austausch vergessen."
 carnival.1017.c: "Ich frage [intent_target.Custom('DE_PRO_PER_S_3P_A')], ob ich das Buch nach [intent_target.Custom('DE_PRO_PER_S_3P_D')] lesen kann."
 carnival.1017.a.tt.failure.desc: "Ah, ein gutes Buch für eine schlichte Person"
 carnival.1017.a.tt.success.desc: "Das erinnert mich an ein anderes Buch"
 carnival.1017.b.tt.success.desc: "Ich lenke [intent_target.Custom('DE_PRO_POS_S_3P')]e Aufmerksamkeit von dem Buch weg"
 carnival.1017.a.tt.success.toast: "Euer breit gefächertes Wissen erlangt die Aufmerksamkeit von [intent_target.GetTitledFirstName]"
 carnival.1017.a.tt.failure.toast: "[intent_target.GetTitledFirstName|U] fand Euch langweilig und aufgeblasen"
 carnival.1017.b.tt.success.toast: "[intent_target.GetTitledFirstName|U] vergaß das Buch völlig"
 carnival.1017.b.tt.failure: "Die Nase von [intent_target.GetTitledFirstName] bleibt in [intent_target.Custom('DE_PRO_POS_S_3P')]em Buch vergraben"
 carnival.1017.b.tt.failure.toast: "[intent_target.GetTitledFirstName|U] fand Euren Witz weniger anziehend als [intent_target.Custom('DE_PRO_POS_S_3P')] Buch"
 carnival.1017.c.tt.toast: "Ihr und [intent_target.GetTitledFirstName] kommt Euch näher, als Ihr über ein spannendes Buch sprecht"
 ## Event - Flowers & song
 carnival.1018.t: "Liebe und Spiele"
 carnival.1018.desc: "Eine Menge hat sich auf dem Platz versammelt, um sich Wettbewerbe in Sachen Stärke und Können anzuschauen. Wettkämpfe wie Ringen, Rennen und Tauziehen finden unter dem Jubel der Zuschauer statt. Die Atmosphäre ist heiter und fröhlich.\n\n[intent_target.GetTitledFirstName|U] scheint von den gezeigten Fähigkeiten beeindruckt zu sein. [intent_target.Custom('DE_PRO_POS_S_3P')]e Blicke gelten immer wieder [contender.GetTitledFirstName]. Wenn ich [intent_target.Custom('DE_PRO_POS_S_3P')]e Gunst gewinnen will, muss ich [contender.Custom('DE_PRO_PER_S_3P_A')] irgendwie ausstechen."
 carnival.1018.a: "Ich werde [contender.Custom('DE_PRO_PER_S_3P_A')] im Ringkampf zermalmen!"
 carnival.1018.b: "Vielleicht könnte [contender.Custom('DE_PRO_PER_S_3P_N')] überzeugt werden, einen Sturz vorzutäuschen?"
 carnival.1018.c: "Ich mache [contender.Custom('DE_PRO_PER_S_3P_A')] vor [intent_target.GetTitledFirstNameNoTooltip] lächerlich"
 carnival.1018.d: "Ich denke nicht, dass ich an diesem Wettkampf teilnehmen sollte."
 carnival.1018.a.success.desc: "Ihr besiegt [contender.GetTitledFirstNameNoTooltip]"
 carnival.1018.a.success.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] ist von Eurem Können beeindruckt"
 carnival.1018.a.failure: "Ihr landet auf Eurem Allerwertesten "
 carnival.1018.a.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] vergisst Euch völlig"
 carnival.1018.b.success: "Ihr schafft es, dass es echt wirkt"
 carnival.1018.b.success.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] feiert Euch als [Select_CString(ROOT.Char.IsFemale, 'Siegerin', 'Sieger')]"
 carnival.1018.b.failure: "Der Wettbewerb ist offenkundig gestellt"
 carnival.1018.b.failure.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] heißt Euch [Select_CString(ROOT.Char.IsFemale, 'eine Betrügerin', 'einen Betrüger')]"
 carnival.1018.c.toast: "[intent_target.GetTitledFirstNameNoTooltip|U] ist belustigt und entzückt"
 ## Event - A mask in the crowd
 carnival.1019.t: "Masken in der Menge"
 carnival.1019.desc: "Ich sehe immer wieder die gleiche Maske in der Menge. Während ich mich durch die Straßen bewege, erblicke ich das gleiche erstarrte Gesicht eines grinsenden Narren ein ums andere Mal in der Masse aus Masken. Werde ich verfolgt? Allein der Gedanke lässt mir das Blut in den Adern gefrieren.\n\nIch verlasse den Durchgang und die maskierten Mannen folgen mir. Ich bin mir sicher, dass sie mir etwas antun wollen!"
 carnival.1019.a: "Bereitet einen Hinterhalt vor."
 carnival.1019.b: "Lockt sie zu einer Gruppe von Wachen."
 carnival.1019.c: "Schreit um Hilfe."
 cooltip.carnival.1019.tt.assassination_success: "Ihr tötet Euren Angreifer"
 cooltip.carnival.1019.tt.assassination_fended: "Ihr verletzt Euren Angreifer"
 cooltip.carnival.1019.tt.assassination_captured: "Der Angreifer wird eingekerkert"
 cooltip.carnival.1019.tt.assassination_scream: "Ihr schlagt die Meuchler mit Euren Schreien in die Flucht"
 carnival.1019.tt.assassination_success.desc: "Ihr erschlagt Euren Angreifer"
 carnival.1019.tt.assassination_fended.desc: "Ihr wehrt Euren Angreifer ab"
 carnival.1019.tt.assassination_wounded.desc: "Ihr seid verletzt"
 carnival.1019.tt.assassination_killed.desc: "Euer Angreifer tötet Euch"
 carnival.1019.tt.assassination_gotaway.desc: "Ihr könnt entkommen"
 carnival.1019.tt.assassination_cornered.desc: "Ihr seid umzingelt"
 carnival.1019.tt.assassination_captured.desc: "Die Wachen ergreifen den Meuchler"
 carnival.1019.tt.assassination_fended_toast: "Ihr stacht Euren Verfolger nieder und entkamt in den Gassen"
 carnival.1019.tt.assassination_wounded_toast: "Euer Angreifer verletzt Euch und schleicht zurück in die Schatten"
 carnival.1019.tt.assassination_success_toast: "[Select_CString(murder_01.IsFemale, 'Die Möchtegern-Meuchlerin', 'Der Möchtegern-Meuchler')] [murder_01.GetFirstNameNoTooltip] ist tot"
 carnival.1019.tt.assassination_gotaway_toast: "Ihr entwischtet Euren Angreifern"
 carnival.1019.tt.assassination_captured_toast: "[Select_CString(murder_01.IsFemale, 'Die Meuchlerin', 'Der Meuchler')] [murderer_01.GetFirstNameNoTooltip] wird in eine Zelle geworfen."
 ## Event - Thundering hooves
 carnival.1020.t: "Donnernde Hufe"
 carnival.1020.desc: "[murder_victim.GetNameNoTooltip|U] verlässt gerade ein Festmahl, als [murder_victim.Custom('DE_PRO_PER_S_3P_N')] und [murder_victim.Custom('DE_PRO_POS_S_3P')] [murder_victim.Custom2('RelationToMe', SCOPE.sC('bystander'))] [bystander.GetFirstNameNoTooltip] mir ins Auge fallen.\n\nIch zügle mein Pferd und warte darauf, dass [murder_victim.GetFirstNameNoTooltip] sich von [Select_CString(bystander.IsFemale, 'der Gastgeberin', 'dem Gastgeber')] verabschiedet. Mein Ziel erkennt die Gefahr nicht, die die Straße hinab lauert.\n\nEs ist ein günstiger Moment, doch es besteht das Risiko, dass auch Unschuldige verletzt werden."
 carnival.1020.a: "Ich werde beide im Vorbeireiten aufschlitzen."
 carnival.1020.b: "Vorwärts, [ROOT.Char.Custom('WarhorseStoryName')]! Sie sollen lernen, dass ich [Select_CString(ROOT.Char.IsFemale, 'eine Frau bin, die', 'ein Mann bin, den')] man fürchten muss."
 carnival.1020.c: "Reitet [murder_victim.GetFirstNameNoTooltip] nieder. Ein schrecklicher Unfall."
 carnival.1020.d: "Ich gebe den Mannen, die ich angeworben habe, um meine Beute niederzureiten, ein Zeichen."
 carnival.1020.e: "Nicht heute. Das Risiko ist zu groß."
 carnival.1020.tt.horse.hit.desc: "Das Opfer wird unter den Hufen zermalmt"
 carnival.1020.tt.horse.miss.desc: "Das Pferd verfehlt sein Ziel"
 carnival.1020.tt.horse.hit.toast: "Das Opfer wurde unter den Hufen zermalmt"
 carnival.1020.tt.horse.miss.toast: "Das Pferd verfehlte sein Ziel"
 carnival.1020.murder_horse.log_title: "Zerstörungszug eines Schlachtrosses"
 carnival.1020.murder_horse.log: "[carnival_main.GetShortUIName|U] ritt [murder_victim.GetShortUIName] mit [carnival_main.Custom('DE_PRO_POS_S_3P')]em Schlachtross [carnival_main.Custom('WarhorseStoryName')] nieder"
 carnival.1020.accident.log_title: "Schrecklicher Unfall"
 carnival.1020.accident.log: "[murder_victim.GetShortUIName|U] starb, nachdem [murder_victim.Custom('DE_PRO_PER_S_3P_N')] bei einem schrecklichen Unfall von einem Pferd niedergetrampelt wurde"
 carnival.1020.both_accident.log_title: "Schrecklicher Unfall"
 carnival.1020.both_accident.log: "Bei einem schrecklichen Unfall wurden [murder_victim.GetShortUIName] und [bystander.GetShortUIName] von einem Pferd zu Tode getrampelt"
 carnival.1020.bystander_accident.log_title: "Schrecklicher Unfall"
 carnival.1020.bystander_accident.log: "[bystander.GetShortUIName|U] starb, nachdem [bystander.Custom('DE_PRO_PER_S_3P_N')] bei einem schrecklichen Unfall von einem Pferd niedergetrampelt wurde"
 carnival.1020.sword.log_title: "Mord vom Pferderücken aus"
 carnival.1020.sword.log: "[murder_victim.GetShortUIName|U] und [bystander.GetShortUIName] wurden von einem Reiter in zwei Teile geschlitzt."
 carnival.1020.miss.log_title: "[murder_victim.GetShortUIName|U] wurde fast von einem Pferd zerquetscht"
 carnival.1020.miss.log: "[murder_victim.GetShortUIName|U] behauptet, dass [carnival_main.GetShortUIName] versuchte, [murder_victim.Custom('DE_PRO_PER_S_3P_A')] niederzureiten: ein Mordanschlag!"
 ## Event - The Arrow
 carnival.1021.t: "Der Pfeil"
 carnival.1021.desc: "Mein Beobachtungsposten ist ruhig, bis auf das Knacken von Holz und den Geräuschen der Straße, die sanft durch die Fensterläden dringen. Draußen im Hof unter mir ahnt mein Ziel [murder_victim.GetFirstNameNoTooltip] nichts von meinen Blicken – oder dem [SCOPE.Custom('UniqueBowOrJustBow')] an meiner Seite.\n\nIch habe [Select_CString(bandit_01.IsFemale, 'eine angeworbene Banditin', 'einen angeworbenen Banditen')] namens [bandit_01.GetFirstNameNoTooltip] mitgebracht, für den Fall, dass ich ein weiteres Paar Hände brauche.\n\nAls ich die Bogensehne spanne, schaut [murder_victim.GetFirstNameNoTooltip] auf und [murder_victim.Custom('DE_PRO_POS_S_3P')]e Blicke suchen die Fenster ab!"
 carnival.1021.a: "Ich schieße, bevor [murder_victim.Custom('DE_PRO_PER_S_3P_N')] mich noch sieht."
 carnival.1021.b: "[bandit_01.GetFirstNameNoTooltip|U], Ihr schießt. Ich sichere den Fluchtweg."
 carnival.1021.c: "Versteckt Euch. Wir müssen auf eine bessere Gelegenheit warten."
 cooltip.carnival.1021.wrong.victim: "[bandit_01.GetFirstNameNoTooltip|U] tötet die falsche Person"
 carnival.1021.tt.arrow.hit.desc: "Der Pfeil trifft Euer Ziel"
 carnival.1021.tt.arrow.miss.desc: "Der Pfeil geht daneben und das Ziel entdeckt Euch"
 carnival.1021.tt.thug.arrow.hit.desc: "Der Pfeil trifft Euer Ziel"
 carnival.1021.tt.thug.arrow.miss.desc: "Der Pfeil traf das falsche Ziel"
 carnival.1021.tt.arrow.hit.toast: "Der Pfeil traf das Ziel"
 carnival.1021.tt.arrow.miss.toast: "Der Pfeil ging daneben und Ihr wurdet entdeckt!"
 carnival.1021.tt.thug.arrow.hit.toast: "Der Pfeil [Select_CString(bandit_01.IsFemale, 'der Banditin', 'des Banditen')] traf das Ziel"
 carnival.1021.tt.thug.arrow.miss.toast: "Der Pfeil [Select_CString(bandit_01.IsFemale, 'der Banditin', 'des Banditen')] traf das falsche Ziel!"
 carnival.1021.arrow.log_title: "Unbekannter Bogenschütze"
 carnival.1021.arrow.log: "[murder_victim.GetFirstNameNoTooltip|U] wurde vom Pfeil eines unbekannten Bogenschützen getötet"
 ## Event - Procession of My Own
 carnival.1022.t: "Meine eigene Prozession"
 carnival.1022.desc: "Die Stadt bezahlt den Karneval zum Nutzen aller, und obwohl es ausreichend Gold für angemessene Zerstreuungen gibt, könnte ein tatkräftiger Bürger mit Vermögen die Pracht unserer Festlichkeiten unterstützen.\n\nWürde ich einen Beitrag leisten, würde meinesgleichen grün vor Neid und in den Augen der unter mir Stehenden würde ich wie ein Patrizier aus alten Zeiten glänzen. Ja, denkt nur, die Granden der alten Stadtstaaten zeigten ihren Reichtum! Würde ich eine glorreiche Prozession bezahlen, wäre mein Name in aller Munde!\n\n #BOLD Doch was sollte das Thema sein?#!"
 carnival.1022.a: "Eine #BOLD wunderschöne#! Prozession, die meine Errungenschaften ehrt!"
 carnival.1022.b: "Eine #BOLD einschüchternde#! Prozession, um Angst und Schrecken zu verbreiten!"
 carnival.1022.c: "Eine #BOLD religiöse#! Prozession, um meine Frömmigkeit zu zeigen!"
 carnival.1022.d: "Wenn ich es recht überdenke, habe ich bessere Möglichkeiten, um mein Gold auszugeben."
 custom.carnival.1022.guestopinion: "Jeder Gast beim Karneval"
 custom.zealot_carnival.1022.guestopinion: "Jeder [GetVassalStance('zealot').GetTextIcon]-Gast beim Karneval"
 ## Event - Legacy in marble
 carnival.1023.t: "Ein Vermächtnis aus Marmor"
 carnival.1023.desc: "In der Kindheit hörte ich Geschichten über die alten Stadtstaaten. Die Patrizier waren große Mäzene der Künste. Obwohl die prächtigen Gebäude dieser glorreichen Vergangenheit nun in Ruinen liegen, sind Kunst und Schönheit immer inspirierend. Wenn ich Künstler finanziere, kann ich meinen Namen in diese erlauchte Gesellschaft einbringen.\n\nMan stelle sich nur vor: Mein Ruf überdauert die Last des irdischen Daseins!\n\nLasst die Leute Schönheit in Marmor, Stein und Holz und in allen Farben des Regenbogens gewandet betrachten! Für den Ruhm der [Glossary('#bold Patria#!','carnival_patria_GLOSS')], die Verehrung unserer Ahnen und das Ansehen von Haus [ROOT.Char.GetDynastyHouseName]!"
 carnival.1023.a: "Finanziert einen Wettbewerb für junge Künstler."
 carnival.1023.b: "Gebt neue Fresken und Zierden für einen öffentlichen Platz in Auftrag."
 carnival.1023.c: "Gebt einen Satz Statuen in Auftrag, der die Gründer der Stadt zeigt."
 carnival.1023.d: "Augenblick! Ist Kunst so teuer?!"
 ## Event - Whispers behind the mask
 carnival.1024.t: "Geflüster hinter der Maske"
 carnival.1024.desc: "Im fröhlichen Treiben des Karnevals verschwimmen die Grenzen, und die Leute verlieren ihren Sinn für Anstand. Man weiß nie, wer die maskierte Person neben einem wirklich ist oder was ihr in Erinnerung bleibt.\n\n[hook_target.GetTitledFirstNameNoTooltip|U] hat sich ganz der Ausschweifung hingegeben. [hook_target.Custom('DE_PRO_PER_S_3P_N')|U] verbringt den gesamten Abend damit, mit jedem zu tanzen, der [hook_target.Custom('DE_PRO_PER_S_3P_D')] ins Auge fällt; und trinkt und isst, als gäbe es kein Morgen, und lacht und spricht, ohne auf die Zuhörer zu achten. So kurz vor einem richtigen Skandal und nichtsahnend, dass ich #BOLD hinter meiner Maske#! alles beobachte.\n\n#BOLD Ich könnte [hook_target.Custom('DE_PRO_PER_S_3P_D')] die Peinlichkeit ersparen oder dies alles gegen [hook_target.Custom('DE_PRO_PER_S_3P_A')] verwenden und [hook_target.GetTitledFirstNameNoTooltip] in meine Schuld bringen.#!"
 carnival.1024.a: "Ich werde ein wohlwollendes Auge auf [hook_target.Custom('DE_PRO_PER_S_3P_A')] haben."
 carnival.1024.b: "Sicher, es wäre eine Schande, wenn [hook_target.Custom('DE_PRO_PER_S_3P_D')] das jemand später vorhalten würde."
 carnival.1024.c: "Es wird besser sein, eine freundliche Warnung an [hook_target.Custom('DE_PRO_POS_S_3P')] Haus zu schicken."
 carnival.1024.d: "Lasst [hook_target.GetTitledFirstNameNoTooltip] [hook_target.Custom('DE_PRO_POS_S_3P')]e eigenen Fehler machen."
 carnival.1025.t: "Schmuckstücke und fantastische Tiere"
 carnival.1025.into_desc: "Ich stehe vor dem Stand [Select_CString(merchant_character.IsFemale, 'einer fremdändischen Händlerin', 'eines fremdländischen Händlers')]. Merkwürdige Dinge von nah und fern liegen dort aus, ganz zu schweigen von den Käfigen, in denen sich exotische Tiere befinden. Die Geräusche und der Geruch dieser Menagerie sind beachtlich.\n\n„Kommt und schaut, Ihr alle! Wundersame Dinge biete ich feil!“, ruft [Select_CString(merchant_character.IsFemale, 'dieHändlerin', 'der Händler')] und deutet auf [merchant_character.Custom('DE_PRO_POS_S_3P')]e Waren.\n\n„Schmuck ([merchant_trinket.GetName]) von hoher Güte; und diese Kreatur namens [merchant_creature.GetName] –"
 carnival_1025_creature_lion_desc: "ein gefürchteter Menschenfresser aus den Legenden.“"
 carnival_1025_creature_caracal_desc: "winzig, aber wild!“"
 carnival_1025_creature_lynx_desc: "er kann in nur einem Wimpernschlag einen Baum hinauflaufen und sein Harn macht Kristalle mit magischen Zauberkräften!“"
 carnival_1025_creature_tiger_desc: "ein wilder Menschenfresser aus persischen Legenden!“"
 carnival_1025_creature_leopard_desc: "wie er schon in antiken Texten Erwähnung fand!“"
 carnival_1025_creature_bear_desc: "er kann auf seinen Vorderbeinen stehen und mit Steinen jonglieren, die so groß sind wie der Kopf eines Mannes!“"
 carnival_1025_creature_elephant_desc: "erschaffen von einem verrückten Alchemisten!“"
 carnival_1025_creature_peacock_desc: "aus den Flammen geboren!“"
 carnival_1025_creature_parrot_desc: "er kann sprechen und Hymnen singen!“"
