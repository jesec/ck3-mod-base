 ## Event - Dead End
 carnival.1111.t: "Sackgasse"
 carnival.1111.desc: "Ich kämpfe mit einem der Meuchler und spüre plötzlich einen Schmerz im Nacken, als sein Partner von hinten auf mich einsticht. Ich stürze zu Boden. Die Kraft verlässt meine Glieder, und mein keuchender Atem hinterlässt blutige Blasen auf meinen Lippen."
 carnival.1111.a: "So hätte es nicht enden sollen."
