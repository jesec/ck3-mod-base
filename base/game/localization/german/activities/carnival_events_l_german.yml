l_german:
 ## Event - Carnival Opening
 carnival.1001.t: "Eine Zeit voller Wunder"
 carnival.1001.desc: "Die Vorbereitungen sind beendet.\n\nFarbenfrohe Banner säumen die Prachtstraßen, und Prozessionen schlängeln sich durch die Alleen und Straßen von [carnival_location.GetName]. Die Massen versammeln sich an den Plätzen. Ob reich oder arm, hässlich oder schön: Wir alle sind eins in diesem Meer von maskierten Gesichtern.\n\nWas für ein Spektakel wird das werden!"
 carnival.1001.a: "Es ist an der Zeit, die Masken aufzusetzen. [Glossary('#bold Carnis levare!#!','carnival_GLOSS')]"
 carnival.1001.b: "Versucht doch, mich zu finden, Meuchler!"
 carnival.1001.c: "Eine Maske verbirgt Makel und Narben gleichermaßen …"
 ## Event - Carnival Closing
 carnival.1002.t: "Rückkehr zum Alltäglichen"
 carnival.1002.desc: "Auf den Straßen liegen die Überreste des Karnevals verstreut. Weggeworfene Masken und Straßenschmuck vermüllen die Rinnsteine, während sich die Feiernden zurück nach Hause schleppen. Wir ließen unsere Unstimmigkeiten beiseite, um als vereinte Stadt gemeinsam zu schlemmen, zu tanzen, Spiele zu spielen und zu lachen.\n\nDer Glanz des Karnevals wird noch eine Weile in der Luft hängen und uns daran erinnern, wer wir sind. Danach wird es Zeit werden, zu unserem üblichen Leben zurückzukehren: zu der Hierarchie, den Mühen und den Verpflichtungen. Bis der Karneval erneut wiederkehrt …"
 carnival.1002.a: "Zeit, sich an die Arbeit zu machen."
 carnival.1002.b: "Was, wenn jeder Tag so sein könnte?"
 carnival.1002.c: "Es fühlt sich gut an, zur Ordnung zurückzukehren."
 ## Event - A chance for mischief
 carnival.1003.t: "Eine Gelegenheit für etwas Schabernack"
 carnival.1003.desc: "Als ich die protzige Behausung von Haus [house_target.GetDynastyHouseName] besuche, sehe ich feine [house_target.Custom('RegionalFabric')|U]-Vorhänge, Hunderte [house_target.GetCurrentLocation.Custom('get_region_flower_type_plural')], Bedienstete in Hülle und Fülle sowie [house_target.GetName], wie [house_target.Custom('DE_PRO_PER_S_3P_N')] [house_target.Custom('DE_PRO_POS_S_3P')]er Klientel wichtigtuerisch Vorträge hält – ich spüre das Verlangen, ihnen allen ein wenig Bescheidenheit beizubringen.\n\nEin solcher Schabernack entspricht doch gewiss dem Geist des Karnevals?\n\nIch sollte heimlich ein paar Raufbolde anheuern, um:"
 carnival.1003.a: "Faule Eier auf [house_target.GetFirstNameNoTooltip] zu schmeißen!"
 carnival.1003.b: "Als Teufel verkleidet durch [house_target.Custom('DE_PRO_POS_S_3P')]en Palast zu toben."
 carnival.1003.c: "Ungehörige Schmierereien über [house_target.Custom('DE_PRO_POS_S_3P')]e Familie auf die Prachtstraßen zu malen."
 carnival.1003.d: "Wenn ich es mir recht überlege: Nein."
 carnival.1003.tt.reclusive_toast: "[house_member.GetShortUIName|U] ist zu beschämt, um das Haus zu verlassen"
 carnival.1003.tt.lunatic_toast: "[house_member.GetShortUIName|U] verliert den Verstand"
 carnival.1003.tt.irritable_toast: "Das Blut von [house_member.GetShortUIName] kocht"
 carnival.1003.throw_eggs_log_title: "Mit Eiern beworfen"
 carnival.1003.throw_eggs_log: "Das Gutshaus von Haus [house_target.GetDynastyHouseName] wurde mit Eiern beworfen"
 carnival.1003.mischief.insanity.log_title: "Teuflische Randale"
 carnival.1003.mischief.insanity.log: "Ein Mob von Randalierern, die als Teufel verkleidet waren, ließ [house_member.GetShortUIName] den Verstand verlieren"
 carnival.1003.mischief.irritable.log_title: "Teuflische Randale"
 carnival.1003.mischief.irritable.log: "Ein Mob von Randalierern, die als Teufel verkleidet waren, führte dazu, dass [house_member.GetShortUIName] wütend und zornig auf jedem um [house_member.Custom('DE_PRO_PER_S_3P_A')] herum ist"
 carnival.1003.mischief.reclusive.log_title: "Teuflische Randale"
 carnival.1003.mischief.reclusive.log: "Ein Mob von Randalierern, die als Teufel verkleidet waren, führte dazu, dass sich [house_member.GetShortUIName] versteckt"
 ## Event - House Relations
 carnival.1004.t: "Hausbeziehung"
 carnival.1004.desc: "Eine geteilte Stadt bleibt nicht lange bestehen. Daher obliegt es mir, mit den mächtigen Häusern, die die Politik von [carnival_location.GetName] bestimmen, gemeinsame Sache zu machen.\n\nWährend eines Banketts nehme ich [other_house_leader01.GetName] zur Seite und versuche, [other_house_leader01.Custom('DE_PRO_PER_S_3P_D')] die Vorteile einer guten Beziehung zwischen meinem Haus [ROOT.Char.GetDynastyHouseName] und [other_house_leader01.Custom('DE_PRO_POS_S_3P')]em Haus [other_house_leader01.GetDynastyHouseName] klarzumachen."
 carnival.1004.a: "Unsere Hauptbücher sind voll, unsere Taschen tief!"
 carnival.1004.b: "Eine geschäftliche Zusammenarbeit ist für uns beide von Vorteil."
 carnival.1004.c: "Euer Haus steht deutlich unter Haus [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 carnival.1004.d: "Die Beziehung zwischen unseren Häusern sollte so bleiben, wie sie ist."
 ## Event - Prank a friend
 carnival.1005.t: "Mit [Select_CString(friend.IsFemale, 'einer Freundin', 'einem Freund')] herumalbern"
 carnival.1005.desc: "Der Karneval ist die perfekte Zeit, um [Select_CString(friend.IsFemale, 'einer Freundin', 'einem Freund')] einen Streich zu spielen – auf eine gutmütige Art natürlich.\n\nIch sehe, wie [Select_CString(friend.IsFemale, 'meine Freundin', 'mein Freund')] [friend.GetName] mit [bystander.GetName] spricht, und mir kommen sofort ein paar Ideen!"
 carnival.1005.a: "Fordert sie beide zu einem Duell mit einem hölzernen Stock auf!"
 carnival.1005.b: "Rempelt [friend.Custom('DE_PRO_PER_S_3P_A')] verkleidet an und sprecht in einer ausgedachten Sprache."
 carnival.1005.c: "Ich werde sie mit bemalten Eiern voller Parfum bewerfen!"
 carnival.1005.d: "Nein. Ich sollte anderen nicht meine Scherze aufzwingen."
 carnival.1005.tt.stick_success.desc: "Ihr habt einen vergnüglichen Stockkampf"
 carnival.1005.tt.stick_failure.desc: "Ihr werdet zu grob während des Herumspielens"
 carnival.1005.tt.success.desc: "Alle lachen über Eure Geste"
 carnival.1005.tt.failure.desc: "Eure Opfer bezeichnen Euch als einen langweiligen Esel"
 carnival.1005.tt.disguise_success.desc: "Ihr belustigt Eure Zuschauer"
 carnival.1005.tt.disguise_failure.desc: "Ihr verwirrt und verärgert Eure Zuschauer"
 carnival.1005.tt.success.toast: "Alle lachten über Eure Geste"
 carnival.1005.tt.failure.toast: "Eure Opfer bezeichneten Euch als einen langweiligen Esel"
 carnival.1005.tt.egg_success.toast: "[Select_CString(friend.IsFemale, 'Eure Freundin', 'Euer Freund')] liebte die duftende Überraschung"
 carnival.1005.tt.egg_failure.toast: "[Select_CString(friend.IsFemale, 'Eure Freundin', 'Euer Freund')] hasste den Geruch."
 ## Event - The entertainer
 carnival.1006.t: "Die Unterhalter"
 carnival.1006.desc: "Der Karneval ist die Hochzeit für Unterhalter jedweder Couleur. Ich höre einer begabten Gruppe von Musikanten zu, die mit ihren Stimmen, Versen und Instrumenten Geschichten erzählen."
 carnival.1006.a: "Bezahlt die Musikanten, damit sie Lieder über meine Größe singen!"
 carnival.1006.b: "Ich werde einen Vermittler den Besten unter ihnen anwerben lassen."
 carnival.1006.c: "Ich sollte eine beliebte Melodie fordern."
 carnival.1006.d: "Ladet [Select_CString(dancer_character.IsFemale, 'eine Tänzerin', 'einen Tänzer')] in der Nähe zum Tanz ein!"
 cooltip.carnival.1006.bawdy_song.tt: "Fragt nach einem unzüchtigen Lied"
 cooltip.carnival.1006.patriotic_song.tt: "Fragt nach einem Lied über die [Glossary('#bold Patria#!', 'carnival_patria_GLOSS')]!"
 cooltip.carnival.1006.spiritual_song.tt: "Fragt nach einem spirituellen Lied"
 carnival.1006.tt.dance_success.desc: "[Select_CString(dancer_character.IsFemale, 'Die Tänzerin', 'Der Tänzer')] nimmt die Einladung zum Tanz an"
 carnival.1006.tt.dance_failure.desc: "[Select_CString(dancer_character.IsFemale, 'Die Tänzerin', 'Der Tänzer')] lehnt die Einladung zum Tanz ab"
 carnival.1006.tt.dance_success.toast: "Ihr tanzt mit [dancer_character.GetFirstNameNoTooltip]"
 carnival.1006.tt.dance_failure.toast: "[dancer_character.GetFirstNameNoTooltip|U] lehnt es ab, mit Euch zu tanzen."
 carnival.1006.bawdy_song.tt.toast: "Ihr bekamt ein unzüchtiges Lied!"
 carnival.1006.patriotic_song.tt.toast: "Ihr bekamt ein Lied, das von der [Glossary('#bold Patria#!', 'carnival_patria_GLOSS')] handelte!"
 carnival.1006.spiritual_song.tt.toast: "Ihr bekamt ein spirituelles Lied!"
 carnival.1006.recruit_entertainer.log_title: "Angeworbener Unterhalter"
 carnival.1006.recruit_entertainer.log: "[carnival_main.GetFirstNameNoTooltip|U] warb [entertainer_character.GetFirstNameNoTooltip] an"
 ## Event - Learning to juggle
 carnival.1007.t: "Jonglieren lernen"
 carnival.1007.desc: "Minnesänger, Jongleure und Narren unterhalten die Leute entlang der Prachstraße von [carnival_location.GetName]. Insbesondere die Jongleure fallen mir ins Auge. Es ist schwer, nicht die Kontrolle zu bewundern, die sie über die in der Luft schwebenden Messer und Bälle haben.\n\nEiner der Jongleure tritt vor und fragt, ob ich es aus Spaß probieren möchte.\n\n„Einen, zwei oder drei Bälle: Wie viele könnt Ihr in der Luft halten, [ROOT.Char.Custom('MistressMaster')]?“"
 carnival.1007.a: "Ich wette mit jedem, dass ich drei Bälle in der Luft halten kann!"
 carnival.1007.b: "Zwei Bälle sind mehr als genug."
 carnival.1007.c: "Wie wäre es mit zweien dieser Messer?"
 carnival.1007.d: "Ich lasse mich nicht zu solchen Frivolitäten herab."
 carnival.1007.juggling_success.tt.toast: "Erfolgreich jongliert"
 carnival.1007.juggling_fail.tt.toast: "Die Bälle fallen gelassen"
 carnival.1007.juggling_athletic.tt.toast: "Jonglieren ist ein guter Weg, um den Leib und die Sinne zu ertüchtigen"
 carnival.1007.juggling_k.success.tt.toast: "Erfolgreich mit Messern jongliert"
 carnival.1007.juggling_k.fail.tt.toast: "Sich selbst beim Jonglieren mit Messern geschnitten"
 carnival.1007.blademaster.log_title: "Interesse an Klingen"
 carnival.1007.blademaster.log: "Nach dem Jonglieren mit Messern gewann [carnival_main.GetFirstNameNoTooltip] ein Interesse daran, mit scharfen Klingen zu spielen"
 ## Event - A wild dance
 carnival.1008.t: "Ein wilder Tanz"
 carnival.1008.desc: "Der große Platz ist ein Meer aus maskierten Tänzern, und Musik vermischt sich mit Gelächter. Fremde treffen sich und werden wieder voneinander getrennt, während sie als Partner beim wirbelnden Tanz kommen und gehen.\n\nIch stehe am Rand des Platzes, doch die Atmosphäre ist ansteckend!"
 carnival.1008.a: "„Ich werde die besten Tänzer mit Gold belohnen!“"
 carnival.1008.b: "TANZEN, TANZEN – bis mir die Beine versagen!"
 carnival.1008.c: "Soll mich der Tanz führen, wohin auch immer er will."
 carnival.1008.d: "Genießt einfach nur den Augenblick."
 carnival.1008.strong.tt.toast: "Tanzende Beine"
 carnival.1008.exhausted.tt.toast: "Der Tanz hat Euch erschöpft!"
 carnival.1008.hurt.tt.toast: "Während des Tanzens verletzt!"
 ## Event - A drink with a craftsman
 carnival.1009.t: "Auf einen Schluck mit einem Meister seines Fachs ([craftsman_character.Custom('CraftsmanDescOption')|U])"
 carnival.1009.desc: "In einem der feinen Geschäfte in jener Straße, wo man als [craftsman_character.Custom('CraftsmanDescOption')] ansässig ist, führe ich ein Gespräch mit [Select_CString(craftsman_character.IsFemale, 'einer Meisterwerkerin', 'einem Meisterwerker')].\n\n"
 carnival.1009.1_a.desc: "[craftsman_character.Custom('DE_PRO_PER_S_3P_N')|U] ist regelrecht bestürzt darüber, mich als [carnival_host.GetTitleAsNameNoTooltip] persönlich zu treffen."
 carnival.1009.1_b.desc: "Sicher hinter meiner Maske verborgen bin ich sicher, dass [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] nicht erkennt, wer ich bin."
 carnival.1009.2_a.desc: "Ich höre interessiert zu, während [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] sich darüber beschwert, wie schlecht die Stadt geführt wird, und mir verrät, wem [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] die Schuld für den Zustand [craftsman_character.Custom('DE_PRO_POS_S_3P')]es Geschäfts gibt: [Select_CString(carnival_host.IsFemale, 'der', 'dem')] [carnival_host.GetTitleAsNameNoTooltip]."
 carnival.1009.2_b.desc: "Interessiert höre ich zu, wie [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] [Select_CString(carnival_host.IsFemale, 'der', 'dem')] [carnival_host.GetTitleAsNameNoTooltip] Lob für die gute Führung der Stadt ausspricht und den Krug auf [carnival_host.Custom('DE_PRO_POS_S_3P')]e Gesundheit erhebt."
 carnival.1009.2_c.desc: "Da [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] mit der Führung der Stadt sehr zufrieden ist, überschüttet [craftsman_character.Custom('DE_PRO_PER_S_3P_N')] mich mit Lob."
 carnival.1009.2_d.desc: "[craftsman_character.Custom('DE_PRO_PER_S_3P_N')|U] verstummt und sagt dann missmutig, die Dinge seien in letzter Zeit etwas schwierig gewesen."
 carnival.1009.a: "Ich werde mir das zu Herzen nehmen und meine Bemühungen verdoppeln."
 carnival.1009.b: "Ich werde die Wachen schicken und ein Exempel an diesem Schandmaul statuieren."
 carnival.1009.c: "„Dann müsst Ihr Euch eben darum kümmern, Ratsmitglied!“"
 carnival.1009.d: "Ich muss aufdecken, wer ich bin, und versprechen, mehr für die Stadt zu tun."
 carnival.1009.e: "Das erste ehrliche Lob, das ich seit Monaten höre."
 carnival.1009.f: "Ich wusste es! Kein Grund, sich über die Belange der Stadt Gedanken zu machen."
 carnival.1009.g: "Wie ich es erwartet hatte. Ich sollte zu meinen Ehren eine Statue aufstellen."
 carnival.1009.h: "Überzeugt den guten Menschen, frei zu sprechen."
 carnival.1009.i: "„Verborgene Kräfte unterwandern unsere Stadt, [Select_CString(ROOT.Char.IsFemale, 'meine Freundin', 'mein Freund')].“"
 carnival.1009.j: "„Ich verdiene doch sicherlich eine Belohnung für all meine harte Arbeit?“"
 carnival.1009.k: "„Die gesamte Republik verdient die Lorbeeren für unser großes Glück!“"
 carnival.1009.l: "Ich nicke und stürze mein Getränk ([ROOT.Char.Custom('RegionalDrink')]) herunter."
 carnival.1009.m: "Ich bin nicht hergekommen, um zu plappern, sondern um zu kämpfen!"
 carnival.1009.n: "„Lehrt mich etwas über Euer Handwerk, o [craftsman_character.Custom('CraftsmanDescOption')]!“"
 carnival.1009.o: "Werbt [Select_CString(craftsman_character.IsFemale, 'die Meisterin', 'den Meister')] über einen Mittelsmann an."
 carnival.1009.p: "„Das Getränk geht auf mich, [Select_CString(craftsman_character.IsFemale, 'meine Freundin', 'mein Freund')].“"
 custom.carnival.1009.spreading_ill_rumors: "Jeder [courtier|E] mit einer anderen [culture|E] oder einem anderen [Concept('faith', 'Glauben')|E]"
 custom.carnival.1009.shared_praise: "Jeder [courtier|E]"
 cooltip.carnival.1009.inspired_artisan: "[craftsman_character.GetShortUIName|U] erhielt eine #V Handwerks#!-[inspiration|E]"
 carnival.1009.drunk.tt.toast: "Ihr gebt Euch dem Trinken hin"
 carnival.1009.tasty.tt.toast: "Mmm, lecker!"
 carnival.1009.skillup.tt.toast: "Ihr lerntet etwas von [Select_CString(craftsman_character.IsFemale, 'der Meisterwerkerin', 'dem Meisterwerker')]"
 carnival.1009.patron.tt.toast: "Erhielt einen Mitarbeiter"
 carnival.1009.councilor.log_title: "Neues Ratsmitglied"
 carnival.1009.councilor.log: "[craftsman_character.GetShortUIName|U] wurde zum [councillor|E] ernannt"
 carnival.1009.recruiting.log_title: "Warb Meister-[craftsman_character.Custom('CraftsmanDescOption')|U] an"
 carnival.1009.recruiting.log: "[craftsman_character.GetShortUIName|U] wurde von [carnival_main.GetFirstNameNoTooltip] angeworben"
 carnival.1009.learning_trade.log_title: "Von einem Meisterwerker gelernt"
 carnival.1009.learning_trade.log: "[carnival_main.GetFirstNameNoTooltip|U] gewann einiges Wissen von einem Meister-[craftsman_character.Custom('CraftsmanDescOption')|U]"
