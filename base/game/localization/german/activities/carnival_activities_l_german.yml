l_german:
 activity_carnival: "Karneval"
 activity_carnival_name: "Karneval von [ACTIVITY.GetOwner.GetName]"
 activity_carnival_owner: "Gastgeber"
 activity_carnival_desc: "Besänftigt und unterhaltet Eure Bürger mit einem prachtvollen Karneval! Gönnt Euch und Euren Untertanen eine Gelegenheit, Standesunterschiede und Rangordnungen für einen Augenblick zu vergessen und sich ganz dem maskierten Treiben, der Unterhaltung und den Speisen hinzugeben!\n\nAlle werden voller Eifer Geschichte und Kultur Eurer Republik feiern. Nutzt die Gelegenheit, um Euren Reichtum zur Schau zu stellen und den Neid Eurer Rivalen zu schüren – oder mischt Euch unerkannt unter die Menge, um deren Gedanken und Sorgen ohne Mittelsmänner zu erfahren."
 activity_carnival_host_desc: "$BULLET_WITH_TAB$Ihr könnt [prestige_i][prestige|E] erhalten\n$BULLET_WITH_TAB$Ihr könnt [piety_i][piety|E] erhalten\n$BULLET_WITH_TAB$Teilnehmer können vielleicht die [opinion_i|E] [opinion|E] eines anderen [Concept('activity_guest_short_possessive', 'Gasts')|E] verbessern\n$BULLET_WITH_TAB$Teilnehmer können [stress_loss_i][stress|E] abbauen\n$BULLET_WITH_TAB$Kann [control_i|E] [control|E] in der [county|E] verbessern\n$BULLET_WITH_TAB$Kann [prosperity_i|E] [prosperity|E] in der [county|E] verbessern\n$BULLET_WITH_TAB$Kann [popular_opinion_i|E] [popular_opinion|E]\n verbessern"
 activity_carnival_guest_help_text: "Ein Karneval ist eine hervorragende Gelegenheit, neue, talentierte Gemeine zu entdecken, Geschäftsverbindungen zu knüpfen oder einfach [stress_loss_i][stress|E] abzubauen."
 activity_carnival_province_desc: "Ihr richtet einen Karneval in [ROOT.Province.GetName] aus."
 activity_carnival_guest_desc: "$BULLET_WITH_TAB$ Teilnehmer können [prestige|E] erhalten\n$BULLET_WITH_TAB$ Teilnehmer können [opinion|E] von anderen Teilnehmern erhalten\n$BULLET_WITH_TAB$ Teilnehmer können [stress_loss_i][stress|E] abbauen"
 activity_carnival_conclusion_desc: "Der [GetActivityType('activity_carnival').GetName] ist zu Ende."
 activity_carnival_selection_tooltip: "Eure Leute mit maskierter Feierei erfreuen\n\nErwartete Belohnungen:\n$BULLET_WITH_TAB$[prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$[piety_i|E] [piety|E]\n$BULLET_WITH_TAB$[stress_loss_i|E] [stress_loss|E]\n$BULLET_WITH_TAB$[opinion_i|E] [opinion|E]\n$BULLET_WITH_TAB$[control_i|E] [control|E]\n$BULLET_WITH_TAB$[prosperity_i|E] [prosperity|E]\n$BULLET_WITH_TAB$[popular_opinion_i|E] [popular_opinion|E]"
 carnival_decoration_basic: "Schlichter Schmuck"
 carnival_decoration_basic_desc: "$EFFECT_LIST_BULLET$ Verringerter [prestige|E]-Zugewinn\n\n#weak Die Stadt ist doch schon schön genug, oder nicht?#!"
 carnival_decoration_extensive: "Ausgedehnter Schmuck"
 carnival_decoration_extensive_desc: "$EFFECT_LIST_BULLET$ Maßvoller [prestige|E]-Zugewinn\n\n#weak Schmückt die Stadt mit Blumen und Tüchern, sodass die Bürger in eine wunderbare Welt jenseits des Gewöhnlichen geholt werden.#!"
 carnival_decoration_extravagant: "Herausragender Schmuck"
 carnival_decoration_extravagant_desc: "$EFFECT_LIST_BULLET$ Sehr großer [prestige|E]-Zugewinn\n\n#weak Stellt die ganze Stadt auf den Kopf und scheut keine Kosten, um Straßen und Plätze in ein Wunderland der Fantasie zu verwandeln.#!"
 carnival_entertainment_basic: "Schlichte Unterhaltung"
 carnival_entertainment_basic_desc: "$EFFECT_LIST_BULLET$ Verringerter Zugewinn an [popular_opinion|E]\n\n#weak Ein paar Jongleure und ein Sänger reichen.#!"
 carnival_entertainment_extensive: "Ausgedehnte Unterhaltung"
 carnival_entertainment_extensive_desc: "$EFFECT_LIST_BULLET$ Maßvoller Zugewinn an [popular_opinion|E]\n\n#weak Werbt eine Truppe von Gauklern, Jongleuren, Narren und Barden an, damit die Menge unterhalten und zum Staunen gebracht wird.#!"
 carnival_entertainment_extravagant: "Herausragende Unterhaltung"
 carnival_entertainment_extravagant_desc: "$EFFECT_LIST_BULLET$ Sehr großer Zugewinn an [popular_opinion|E]\n\n#weak Füllt die Plätze mit Gauklern aus der ganzen Welt, damit die Bevölkerung sich an ihren exotischen Auftritten erfreuen und begeistern kann.#!"
 go_incognito_intent: "Inkognito bleiben"
 go_incognito_intent_desc: "Sich dem Karneval als maskierter Teilnehmer anschließen, um sich unerkannt unter die Massen zu mischen.\n#EMP #low [secret_i] [secrets|E] erfahren und unter dem Schleier der Anonymität agieren."
 flaunt_wealth_intent: "Mit Reichtum protzen"
 flaunt_wealth_intent_desc: "Sich in ein atemberaubendes Kostüm werfen und nach Gelegenheiten suchen, großzügig Geld auszugeben.\n#EMP #low [prestige_i] [prestige|E] und [popular_opinion_i] [popular_opinion|E] erhalten."
 activity_carnival_host_an_a: "$host_activity_a$"
 carnival_base_cost: "Grundkosten"
 activity_carnival_destination_selection: ""
 carnival_option_decoration: "Karneval-Schmuck"
 carnival_option_entertainment: "Karneval-Unterhaltung"
 carnival_phase: "$activity_carnival$"
 carnival_phase_desc: "Die eigenen Leute heiter zu sehen, lächelnd und lachend, ist eine unermessliche Freude."
 carnival_conc_reward_title: "Karneval abgeschlossen"
