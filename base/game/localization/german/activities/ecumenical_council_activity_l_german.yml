 activity_ecumenical_council: "Ökumenisches Konzil"
 activity_ecumenical_council_desc: "Ruft die großen Prälaten und Herrscher der Christenheit zusammen! Unser Ziel soll es sein, die Überzeugungen und die Praktiken zu vereinen, um die höchste Macht ([GetPlayer.GetFaith.HighGodName|U]) noch besser zu preisen.\n\nWerden wir, wie es die Apostel in Jerusalem taten, unter einem Glauben zusammenkommen, oder zerbricht die Kirche unter der Last unseres Stolzes?"
 activity_ecumenical_council_destination_selection: "Das [holding|E] muss ein wichtiges sakrales Zentrum sein."
 activity_ecumenical_council_host_desc: "$BULLET_WITH_TAB$[core_tenets|E] können entdeckt, bestätigt, verboten oder geändert werden\n$BULLET_WITH_TAB$[doctrines|E] können geändert werden\n$BULLET_WITH_TAB$@fervor_icon![fervor|E] kann erhöht werden\n$BULLET_WITH_TAB$@piety_icon![piety|E] kann erlangt werden\n$BULLET_WITH_TAB$@opinion_icon![opinion|E] bei teilnehmenden Charakteren kann erlangt werden\n$BULLET_WITH_TAB$[trait|E] oder [trait_level_track_xp|E] in Sachen [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)]"
 activity_ecumenical_council_guest_desc: "$activity_ecumenical_council_host_desc$"
 activity_ecumenical_council_selection_tooltip: "Laden wir die einflussreichsten und gelehrtesten Teile der Christenheit ein, um sowohl über theologische als auch weltliche Dinge zu debattieren.\n\nErwartete Belohnungen:\n$BULLET_WITH_TAB$[core_tenet|E] ändert sich\n$BULLET_WITH_TAB$[doctrine|E] ändert sich\n$BULLET_WITH_TAB$@fervor_icon![fervor|E]\n$BULLET_WITH_TAB$@piety_icon![piety|E]\n$BULLET_WITH_TAB$@opinion_icon![opinion|E]\n$BULLET_WITH_TAB$ [trait|E] oder [trait_level_track_xp|E] in Sachen [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] "
