 situation_guelph_ghibelline_phase_repose_desc_short: "Diese [situation_phase|E] in Sachen [GetSituation('guelph_ghibelline').GetName] erlaubt der Region, etwas Frieden und Erholung zu genießen, wenn auch nur für kurze Zeit.\n\nDas Anstiften von Scharmützeln und Kriegen ist schwierig und nicht gern gesehen."
