 #Glossary
 IN_NOMINE_DOMINI_GLOSS: "In nomine Domini: Eine päpstliche Bulle, die am 13. April 1059 von $religiousheadname_pope$ Nikolaus II. verfasst wurde. Sie bildete die Grundlage für bedeutende Reformen der Papstwahl – die wichtigste davon war der Ausschluss von Monarchen aus dem Wahl- und Bestätigungsverfahren, wodurch die Kardinalbischöfe zu den alleinigen Wahlberechtigten wurden."
 DICTATUS_PAPAE_GLOSS: "Dictatus Papae: Eine Zusammenstellung von 27 Machtansprüchen des $religiousheadname_pope$s. Sie wurde im Jahr 1075 von $religiousheadname_pope$ Gregor VII. diktiert, etwa gleichzeitig zum Ausbruch des Investiturstreits."
