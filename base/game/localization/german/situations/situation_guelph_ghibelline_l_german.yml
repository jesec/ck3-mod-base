 gg_history_key_treaty_of_melfi: "Im Vertrag von Melfi wird [SituationHistoryEntry.GetVariable('robert_guiscard').Char.GetShortUIName] von [SituationHistoryEntry.GetVariable('nicolaus_ii').Char.GetShortUIName] der [GetTitleByKey('d_calabria').GetName]-[title|E] verliehen. Im Gegenzug schwört er dem $religiousheadname_pope$ die Treue"
