 #Situation Regions
 guelph_ghibelline_sub_region_core: "Reichslande"
 guelph_ghibelline_sub_region_core_desc: "Alle [counties|E] in italienischen und deutschen [Concept('kingdoms', 'Königreichen')|E] des HRR ([GetTitleByKey('e_hre').GetName]), in denen [guelphs|E] und [ghibellines|E] miteinander ringen"
 #Participant Groups
 gg_leader_group_help: "#help \n\nDas Fehlen eines Anführers auf einer der beiden Seiten beendet die Lage zugunsten der gegnerischen Seite.#!"
 guelph_ghibelline_participant_group_guelph_leader: "$guelph$en-Anführer"
 guelph_ghibelline_participant_group_guelph_leader_desc: "[SelectLocalization(GetSituation('guelph_ghibelline').GetTopCurrentPhase.GetType.HasParameter('gg_precursor_phase'),'guelph_ghibelline_participant_group_guelph_leader_desc_prelude', 'guelph_ghibelline_participant_group_guelph_leader_desc_main')]"
 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "Der Anführer der [guelphs|E] in der [situation|E] [GetSituation('guelph_ghibelline').GetName].\n\nWährend der Vorspiel-[Concept('situation_phase', 'Phasen')|E] [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] und [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] führt der $religiousheadname_pope$ die [guelphs|E] und das Ringen eskaliert entsprechend der historischen Linien. Die Anführer-[decisions|E] werden erst verfügbar, wenn das Vorspiel dem offenen Streit weicht.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "Der Anführer der [guelphs|E] in der [situation|E] [GetSituation('guelph_ghibelline').GetName].\n\nDieser Anführer verfügt über einzigartige [decisions|E], um den Streit zu steuern:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! und #V $guelph_ghibelline_conflict_decision$#!, um die [situation|E] zwischen ruhigeren und konfliktgetriebeneren [Concept('situation_phase', 'Phasen')|E] zu lenken\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#!, um die Lage zugunsten der [guelphs|E] zu beenden, während sie im Vorteil sind\n$BULLET_WITH_TAB$Eine Entscheidung, um zurückzutreten und die Führung an einen passenden Unterstützer weiterzugeben$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader: "$ghibelline$en-Anführer"
 guelph_ghibelline_participant_group_ghibelline_leader_desc: "[SelectLocalization(GetSituation('guelph_ghibelline').GetTopCurrentPhase.GetType.HasParameter('gg_precursor_phase'), 'guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude', 'guelph_ghibelline_participant_group_ghibelline_leader_desc_main')]"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "Der Anführer der [ghibellines|E] in der [situation|E][GetSituation('guelph_ghibelline').GetName].\n\nWährend der Vorspiel-[Concept('situation_phase', 'Phasen')|E] [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] und [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] führt der Herrscher des HRR ([GetTitleByKey('e_hre').GetName]) die [ghibellines|E] und das Ringen eskaliert entsprechend der historischen Linien. Die Anführer-[decisions|E] werden erst verfügbar, wenn das Vorspiel dem offenen Streit weicht.$gg_leader_group_help$"
 guelph_ghibelline_participant_group_ghibelline_leader_desc_main: "Der Anführer der [ghibellines|E] in der [situation|E] [GetSituation('guelph_ghibelline').GetName].\n\nDieser Anführer verfügt über einzigartige [decisions|E], um den Streit zu steuern:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! und #V $guelph_ghibelline_conflict_decision$#!, um die [situation|E] zwischen ruhigeren und konfliktgetriebeneren [Concept('situation_phase', 'Phasen')|E] zu lenken\n$BULLET_WITH_TAB$#V $ghibelline_victory_decision$#!, um die Lage zugunsten der [ghibellines|E] zu beenden, während sie im Vorteil sind\n$BULLET_WITH_TAB$Eine Entscheidung, um zurückzutreten und die Führung an einen passenden Unterstützer weiterzugeben$gg_leader_group_help$"
 guelph_ghibelline_participant_group_guelph_member: "$guelph$en-Unterstützer"
 guelph_ghibelline_participant_group_guelph_member_desc: "Ein Unterstützer der [Concept('guelph', 'Guelfen')|E]-Seite der [situation|E] [GetSituation('guelph_ghibelline').GetName]."
 guelph_ghibelline_participant_group_ghibelline_member: "$ghibelline$en-Unterstützer"
 guelph_ghibelline_participant_group_ghibelline_member_desc: "Ein Unterstützer der [Concept('ghibelline', 'Ghibellinen')|E]-Seite der [situation|E] [GetSituation('guelph_ghibelline').GetName]."
 guelph_ghibelline_participant_group_undecided: "Unentschieden"
 guelph_ghibelline_participant_group_undecided_desc: "Eine unentschiedene Partei in der [situation|E] [GetSituation('guelph_ghibelline').GetName]. Könnte mit den richtigen Mittel vielleicht überzeugt werden, sich einer der beiden Seiten anzuschließen.\n\nKann #BOL keine#! [situation_catalysts|E] auslösen und erhält weniger wahrscheinlich [gg_involvement|E]."
 guelph_ghibelline_participant_group_outsider: "Außenseiter"
 guelph_ghibelline_participant_group_outsider_desc: "Ein Außenseiter in der [situation|E] [GetSituation('guelph_ghibelline').GetName]. Üblicherweise landlose Abenteurer oder andere Arten von Söldnern.\n\nKann #BOL weder#! [situation_catalysts|E] auslösen #BOL noch#! [gg_involvement|E] erhalten."
 guelph_ghibelline_all: "Derzeitige [situation_phase_phase|E] ([guelph_ghibelline_situation|E])"
 guelph_ghibelline_guelph_leader: "„[guelph_ghibelline_situation|E]“-[situation_phase_phase|E] #weak ($PARTICIPANT_GROUP$)#!"
 guelph_ghibelline_guelph_member: "„[guelph_ghibelline_situation|E]“-[situation_phase_phase|E] #weak ($PARTICIPANT_GROUP$)#!"
 guelph_ghibelline_ghibelline_leader: "„[guelph_ghibelline_situation|E]“-[situation_phase_phase|E] #weak ($PARTICIPANT_GROUP$)#!"
 guelph_ghibelline_ghibelline_member: "„[guelph_ghibelline_situation|E]“-[situation_phase_phase|E] #weak ($PARTICIPANT_GROUP$)#!"
