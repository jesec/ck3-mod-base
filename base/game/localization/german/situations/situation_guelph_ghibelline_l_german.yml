 in_nomine_domini: "$situation_guelph_ghibelline_phase_in_nomine_domini$"
 in_nomine_domini_desc: "$situation_guelph_ghibelline_phase_in_nomine_domini_desc_short$"
 precursor_situation_leader_help: "#help In dieser [situation_phase_phase|E] muss der Herrscher des HRR ([GetTitleByKey('e_hre').GetDefinitiveName]) [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('ghibelline_leader').GetName] sein und der $religiousheadname_pope$ [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('guelph_leader').GetName].#!"
 situation_guelph_ghibelline_phase_in_nomine_domini: "Aufschwung des Papstums"
 situation_guelph_ghibelline_phase_in_nomine_domini_desc_short: "Diese [situation_phase|E] in Sachen [GetSituation('guelph_ghibelline').GetName] ist eine recht ruhige, mit wenigen unmittelbaren Auswirkungen.\n\n$precursor_situation_leader_help$"
 gg_nomine_domini_transition: "In ungefähr [Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12'), EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), EmptyScope.ScriptValue('gg_months_until_dictatus_papae'))|0V] [Select_CString(GreaterThanOrEqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)12'), Select_CString(EqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_years_until_dictatus_papae'), '(CFixedPoint)1'), 'Jahr', 'Jahren'), Select_CString(EqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1'), 'Monat', 'Monaten'))] wird die Lage eskalieren und in die [situation_phase_phase|E] [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] übergehen"
 gg_nomine_domini_transition_desc: "Während die meisten Prinzipien des Dictatus Papae (…)"
 dictatus_papae: "$situation_guelph_ghibelline_phase_dictatus_papae$"
 dictatus_papae_desc: "$situation_guelph_ghibelline_phase_dictatus_papae_desc_short$"
 situation_guelph_ghibelline_phase_dictatus_papae: "Dictatus Papae"
 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "Diese [situation_phase|E] in Sachen [GetSituation('guelph_ghibelline').GetName] ist eine Eskalation der vorherigen Phase [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName].\n\nNun verhärtet sich die Beziehung zwischen den Monarchen und ihren kirchlichen Vasallen, da Letztere hin und her gerissen sind zwischen dem $religiousheadname_pope$, der universelle Macht beansprucht, und ihren Lehnsherren, die ihre Souveränität wahren wollen.\n\n$precursor_situation_leader_help$"
 gg_dictatus_papae_transition: "In ungefähr [Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12'), EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'))|0V] [Select_CString(GreaterThanOrEqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_months_until_concordat_of_worms'), '(CFixedPoint)12'), Select_CString(EqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_years_until_concordat_of_worms'), '(CFixedPoint)1'), 'Jahr', 'Jahren'), Select_CString(EqualTo_CFixedPoint(EmptyScope.ScriptValue('gg_months_until_dictatus_papae'), '(CFixedPoint)1'), 'Monat', 'Monaten'))] wird die Lage eskalieren und in die [situation_phase_phase|E] [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] oder [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName] übergehen"
 gg_dictatus_papae_transition_desc: "Während die meisten Prinzipien des Dictatus Papae (…)"
 ad_interim: "$situation_guelph_ghibelline_phase_ad_interim$"
 ad_interim_desc: "$situation_guelph_ghibelline_phase_ad_interim_desc_short$"
 situation_guelph_ghibelline_phase_ad_interim: "Wormser Konkordat"
 situation_guelph_ghibelline_phase_ad_interim_desc_short: "Diese [GetSituation('guelph_ghibelline').GetName]-[situation_phase|E] ist der Wendepunkt, an dem sich [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('guelph_leader').GetName] und [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey('ghibelline_leader').GetName] entscheiden, ob die nächste Phase [GetSituationType('guelph_ghibelline').GetPhaseType('repose').GetName] oder [GetSituationType('guelph_ghibelline').GetPhaseType('agitation').GetName] wird …\n\n$precursor_situation_leader_help$"
 agitation: "$situation_guelph_ghibelline_phase_agitation$"
 agitation_desc: "$situation_guelph_ghibelline_phase_agitation_desc_short$"
 situation_guelph_ghibelline_phase_agitation: "Aufwiegelung"
 situation_guelph_ghibelline_phase_agitation_desc_short: "Diese Art von [situation_phase|E] in Sachen [GetSituation('guelph_ghibelline').GetName] ist geprägt durch wachsende und eskalierende Streitigkeiten, wobei Schlachten und Kriege ausgefochten werden, um die Macht der siegreichen Seite zu mehren.\n\nHat eine der beiden Seiten des Zwists ≥ 70 % Macht, geht diese Phase unmittelbar in eine der beiden folgenden Phasen über:\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('guelph_advantage').GetName]\n$EFFECT_LIST_BULLET$[GetSituationType('guelph_ghibelline').GetPhaseType('ghibelline_advantage').GetName]"
 guelph_advantage: "$situation_guelph_ghibelline_phase_guelph_advantage$"
 guelph_advantage_desc: "$situation_guelph_ghibelline_phase_guelph_advantage_desc_short$"
 situation_guelph_ghibelline_phase_guelph_advantage: "Guelfen-Vorteil"
 situation_guelph_ghibelline_phase_guelph_advantage_desc_short: "Diese [situation_phase|E] in Sachen [GetSituation('guelph_ghibelline').GetName] zeigt an, dass die [guelphs|E] die Oberhand in dieser konfliktbeladenen [situation_phase_phase|E] erlangt haben.\n\nDadurch kommen die $guelphs$ in den Genuss weiterer Boni, doch wer große Macht genießt, muss damit leben, dass diese Macht auch manchmal auf die Probe gestellt wird …"
 ghibelline_advantage: "$situation_guelph_ghibelline_phase_ghibelline_advantage$"
 ghibelline_advantage_desc: "$situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short$"
 situation_guelph_ghibelline_phase_ghibelline_advantage: "Ghibellinen-Vorteil"
 situation_guelph_ghibelline_phase_ghibelline_advantage_desc_short: "Diese [situation_phase|E] in Sachen [ghibellines|E] zeigt an, dass die [ghibellines|E] die Oberhand in dieser konfliktbeladenen [situation_phase_phase|E] erlangt haben.\n\nDadurch kommen die $ghibellines$ in den Genuss weiterer Boni, doch wer große Macht genießt, muss damit leben, dass diese Macht auch manchmal auf die Probe gestellt wird …"
 repose: "$situation_guelph_ghibelline_phase_repose$"
 repose_desc: "$situation_guelph_ghibelline_phase_repose_desc_short$"
