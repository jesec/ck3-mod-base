 theocratic_elective_pious: "Der Fromme"
 theocratic_elective_pious_desc: "#flavor Das Kollegium muss einen Namen nennen, den niemand als unwürdig abweisen kann, ein Kardinal, dessen Leben sich bereits jetzt wie das eines Heiligen liest.#!\n\nUm #EMP der Fromme#! zu werden, muss man über jedem anderen [cardinal|E] in Sachen Heiligkeit stehen. Die [piety_level|E] wiegt am schwersten, gefolgt von [learning|E] und einem Leben als [GetTrait('lifestyle_scholar').GetName(GetPlayer)], [GetTrait('pilgrim').GetName(GetPlayer)] oder [GetTrait('lifestyle_mystic').GetName(GetPlayer)]. Eine einzige [sin|E], die Euren Namen befleckt, kostet mehr, als eine [virtue|E] einbringt.[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "Der Populist"
 theocratic_elective_populist_desc: "#flavor Ein Papst, dem die Gläubigen nicht folgen, ist kein Papst. Daher nennt das Kollegium einen Namen, der in den Straßen bereits bejubelt wird.#!\n\nUm #EMP der Populist#! zu werden, muss man über jedem anderen [cardinal|E] stehen, was den Ruhm anbelangt. Erhöht Eure [prestige_level|E] und Eure [diplomacy|E], behaltet [friends|E] innerhalb des [Concept('college_of_cardinals', 'Kardinalskollegiums')|E], habt [personal_tenets|E] mit hoher [tenet_popularity|E] und nutzt die [decision|E] „[GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName]“.[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "Der Mächtige"
 theocratic_elective_powerful_desc: "#flavor Der Thron des heiligen Petrus hat Feinde wie auch Anhänger. Daher nennt das Kollegium einen Prälaten, der diesen Thron auch halten kann.#!\n\nUm #EMP der Mächtige#! zu werden, muss man über jedem anderen [cardinal|E] stehen, was den weltlichen Einfluss anbelangt. Lasst Euren [rite|E] in mehr [counties|E] verbreiten, bewahrt [holy_sites|El] und erhebt Eure [dynasty_prestige_level|E] – oder nutzt die [character_interaction|E] #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#!, um Euren Weg nach vorn zu kaufen.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
 CARDINALS_VIEW_VOTER_BUTTON: "Unterstützer"
 CARDINALS_VIEW_VOTER_MISSING: "Keine Wahlleute stimmten bisher für diesen Kandidaten."
