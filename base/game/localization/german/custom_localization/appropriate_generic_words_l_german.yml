 #Food and drink glosses
 ABALONE_GLOSS: "Eine geschätzte Muschelart mit festem Fleisch."
 SEA_CUCUMBER_GLOSS: "Eine weiche Meeresfrucht, die als Delikatesse in der gehobenen Küche Chinas zubereitet wird."
 SWALLOW_NEST_GLOSS: "Ein seltenes Vogelnest, das in eine erlesene Suppe aufgelöst wird."
 ENTREMETS_GLOSS: "Eine kunstvolle Süßigkeit oder ein Überraschungsgericht, das zwischen zwei Gängen serviert wird."
 MOCHI_GLOSS: "Ein bissfester Kuchen aus gestampftem Klebereis."
 DURIAN_GLOSS: "Eine große Tropenfrucht, die bekannt für ihren starken Geruch und ihr vollmundiges, weiches Fleisch ist."
 AQUA_VITAE_GLOSS: "Stark gebrannter Schnaps, der als Arzneimittel geschätzt wird."
 TRIBUTE_CHILLED_TEA_GLOSS: "Feiner Tee, der mit Eis oder Schnee gekühlt und als höfisches Geschenk verschickt wird."
 EMPEROR_TEA_GLOSS: "Die Blätter des feinsten Kaisertees, die für den Hof vorbehalten sind."
 BAIJIU_GLOSS: "Ein starker Schnaps aus China, der aus Getreide gebrannt wird."
 HANAKUSA_GLOSS: "Ein Sud aus einer Kräutermischung aus japanischen Blumen und Blättern."
 PEARL_POWDER_GLOSS: "Zermahlene Perlen, aus denen man ein kostspielieges Tonikum herstellt."
 CHRYSANTHEMUM_BEER_GLOSS: "Ein leichtes Bier, das mit Chrysanthemen gewürzt wird."
 SHARBAT_GLOSS: "Ein gesüßter Fruchttrunk, der oft gekühlt und gewürzt wird."
 SAMBUSA_GLOSS: "Eine gebackene Pastete gefüllt mit gewürztem Fleisch und Gemüse."
 PAKHALA_GLOSS: "Ein erfrischendes Gericht aus fermentiertem Reiswasser aus Ostindien."
 PILAU_GLOSS: "Gewürzter Reis, der mit Gewürzen und Fleisch oder Gemüse gekocht wird."
 PASTILLA_GLOSS: "Eine Pastete aus dem Maghreb: gewürztes Fleisch, das in dünnen Blätterteig gewickelt wurde."
 BOTUO_GLOSS: "Eine dicke Suppe aus China mit Weizenklößen oder Nudeln."
 SPHOUNGATA_GLOSS: "Ein Eierkuchen im byzantinischen Stil aus Rührei."
 TARICHOS_GLOSS: "Gesalzener und getrockneter Fisch – ein übliches byzantinisches Gericht."
 BING_GLOSS: "Ein Fladen oder Pfannkuchen aus China."
 MANTOU_GLOSS: "Ein sanft gedämpftes Weizenbrötchen aus China."
 ZOSUI_GLOSS: "Ein Reisbrei aus Japan, der in Brühe gekocht wird."
 KIMCHI_GLOSS: "Gemüse aus Korea, das mit Salz und Gewürzen fermentiert wurde."
 BUBUR_GLOSS: "Ein Reisbrei aus dem malaiischen Archipel."
