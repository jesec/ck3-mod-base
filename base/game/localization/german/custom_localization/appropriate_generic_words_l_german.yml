 #Food and drink glosses
 ABALONE_GLOSS: "Eine geschätzte Muschelart mit festem Fleisch."
 SEA_CUCUMBER_GLOSS: "Eine weiche Meeresfrucht, die als Delikatesse in der gehobenen Küche Chinas zubereitet wird."
 SWALLOW_NEST_GLOSS: "Ein seltenes Vogelnest, das in eine erlesene Suppe aufgelöst wird."
 ENTREMETS_GLOSS: "Eine kunstvolle Süßigkeit oder ein Überraschungsgericht, das zwischen zwei Gängen serviert wird."
 MOCHI_GLOSS: "Ein bissfester Kuchen aus gestampftem Klebereis."
 DURIAN_GLOSS: "Eine große Tropenfrucht, die bekannt für ihren starken Geruch und ihr vollmundiges, weiches Fleisch ist."
 AQUA_VITAE_GLOSS: "Stark gebrannter Schnaps, der als Arzneimittel geschätzt wird."
 TRIBUTE_CHILLED_TEA_GLOSS: "Feiner Tee, der mit Eis oder Schnee gekühlt und als höfisches Geschenk verschickt wird."
 EMPEROR_TEA_GLOSS: "Die Blätter des feinsten Kaisertees, die für den Hof vorbehalten sind."
 BAIJIU_GLOSS: "Ein starker Schnaps aus China, der aus Getreide gebrannt wird."
 HANAKUSA_GLOSS: "Ein Sud aus einer Kräutermischung aus japanischen Blumen und Blättern."
 PEARL_POWDER_GLOSS: "Zermahlene Perlen, aus denen man ein kostspielieges Tonikum herstellt."
 CHRYSANTHEMUM_BEER_GLOSS: "Ein leichtes Bier, das mit Chrysanthemen gewürzt wird."
 SHARBAT_GLOSS: "Ein gesüßter Fruchttrunk, der oft gekühlt und gewürzt wird."
 SAMBUSA_GLOSS: "Eine gebackene Pastete gefüllt mit gewürztem Fleisch und Gemüse."
 PAKHALA_GLOSS: "Ein erfrischendes Gericht aus fermentiertem Reiswasser aus Ostindien."
 PILAU_GLOSS: "Gewürzter Reis, der mit Gewürzen und Fleisch oder Gemüse gekocht wird."
 PASTILLA_GLOSS: "Eine Pastete aus dem Maghreb: gewürztes Fleisch, das in dünnen Blätterteig gewickelt wurde."
 BOTUO_GLOSS: "Eine dicke Suppe aus China mit Weizenklößen oder Nudeln."
 SPHOUNGATA_GLOSS: "Ein Eierkuchen im byzantinischen Stil aus Rührei."
 TARICHOS_GLOSS: "Gesalzener und getrockneter Fisch – ein übliches byzantinisches Gericht."
 BING_GLOSS: "Ein Fladen oder Pfannkuchen aus China."
 MANTOU_GLOSS: "Ein sanft gedämpftes Weizenbrötchen aus China."
 ZOSUI_GLOSS: "Ein Reisbrei aus Japan, der in Brühe gekocht wird."
 KIMCHI_GLOSS: "Gemüse aus Korea, das mit Salz und Gewürzen fermentiert wurde."
 BUBUR_GLOSS: "Ein Reisbrei aus dem malaiischen Archipel."
 #Oldest record of the word: Codex diplomaticus Caietanus, 997 - https://en.wikipedia.org/wiki/History_of_pizza
 PIZZA_GLOSS: "Ein flaches, rundes Brot aus Süditalien, das lange vor der Ankunft der Tomaten aus Amerika dort hergestellt wurde. Laut einem Pachtvertrag mit Gaeta aus dem Jahr 997 schuldete ein Pächter dem Bischof zwölf Stück zu Weihnachten und zwölf Stück zu Ostern."
 #Vaddaradhane, c. 920 - https://en.wikipedia.org/wiki/Idli
 IDLI_GLOSS: "Ein kleiner Kuchen aus schwarzem Linsenmehlteig aus Südindien. Ein Buch mit Erzählungen aus Kannada aus der Zeit um 920 erwähnt ihn bereits unter der Bezeichnung „Iddalige“."
 #Etienne Boileau, Livre des metiers - https://en.wikipedia.org/wiki/Oublie
 OUBLIE_GLOSS: "Eine dünne Oblate, die zwischen heißen Eisen gebacken und gerollt wird. In Paris gab es bereits in den 1260ern eine Zunft von Oblatenbäckern, die nachts auf den Straßen ihre Waren lautstark anpriesen."
 BLIN_GLOSS: "Ein dünner Pfannkuchen, heiß vom Grill gegessen, der in großen Mengen für das Festmahl vor der Fastenzeit zubereitet wird."
 #https://en.wikipedia.org/wiki/Obwarzanek_krakowski
 OBWARZANEK_GLOSS: "Ein Teigring, der gekocht, anschließend gebacken und danach aufgefädelt verkauft wird. In Krakau nennt man sie „Obwarzanki“, und der königliche Hof kaufte sie bereits 1394."
 #Pogača, from Latin focacia - https://en.wikipedia.org/wiki/Poga%C4%8Da
 POGACA_GLOSS: "Ein rundes Fladenbrot, das in der Asche des Herds gebacken wird. Der Name stammt vom lateinischen Wort „focacius“, was so viel wie „in der Herdasche gebacken“ bedeutet."
 FUL_GLOSS: "Saubohnen, die lange und langsam geköchelt wurden – das alltägliche Essen in den Städten Ägyptens."
 INJERA_GLOSS: "Ein breites, schwammiges Fladenbrot aus fermentierter Zwerghirse, das gleichzeitig als Teller und Löffel dient."
 #Narezushi, the fermented form of sushi before the Edo period - https://en.wikipedia.org/wiki/Narezushi
 NAREZUSHI_GLOSS: "Fisch wird in gesalzenen Reis eingewickelt und darf monatelang versauern. Der Reis wird anschließend abgekratzt und nur der Fisch gegessen."
 AKARA_GLOSS: "Gemahlene Kuhbohnen werden in Palmöl frittiert."
 FURA_GLOSS: "Hirse-Teig wird gedämpft, zu Kugeln geformt und in Sauermilch eingerührt."
 TSAMPA_GLOSS: "Geröstetes Gerstenmehl, mit Butter zu einem Teig verknetet und mit den Fingern gegessen."
 #William of Rubruck, Itinerarium (1253-1255), on the dried curds he calls grut - https://en.wikipedia.org/wiki/Aaruul
 AARUUL_GLOSS: "Der Quark wird in der Sonne hart getrocknet und auf jede Reise mitgenommen. Wilhelm von Rubruk begegnete ihm 1253 bei den Mongolen."
