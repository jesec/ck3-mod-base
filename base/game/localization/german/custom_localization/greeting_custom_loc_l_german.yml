 greeting_supplimentary.negative: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.negative.tales: "von Euren Missetaten erzählt man sich von Irland bis China!"
 greeting_supplimentary.negative.greek: "Euer niederer Charakter ist Kern und Thema griechischer Theaterstücke!"
 greeting_supplimentary.negative.insult.1: "mögen Euch die Säfte bei lebendigem Leib austrocknen!"
 greeting_supplimentary.negative.insult.2: "mögen Eure Jahre kurz und elend sein!"
 greeting_supplimentary.negative.insult.3: "möge Euch Weisheit stets fremd bleiben!"
 greeting_supplimentary.negative.insult_muslim.1: "verflucht sei Euer siebter Großvater!"
 greeting_supplimentary.negative.insult_muslim.2: "möget Ihr lebendig im Bauch eines toten Kamels eingenäht werden!"
 greeting_supplimentary.negative.insult_muslim.3: "möge Allah Euer Haus vernichten!"
 greeting_supplimentary.negative.insult_muslim.4: "Ihr Bastard eines räudigen Hundes!"
 greeting_supplimentary.negative.insult_muslim.5: "Mögen sich Schakale über Eure unbegrabenen Knochen streiten."
 greeting_supplimentary.negative.insult_muslim.6: "Mögen Eure Brunnen sich mit Sand füllen und Eure Zelte mit Skorpionen."
 greeting_supplimentary.negative.insult_christian.1: "Mögen die Heiligen Eure Sache im Stich lassen."
 greeting_supplimentary.negative.insult_christian.2: "Euer Name soll aus jedem Gebet getilgt werden."
 greeting_supplimentary.negative.insult_norse.1: "Mögen Eure Ahnen auf Euren Schatten spucken."
 greeting_supplimentary.negative.insult_norse.2: "Euer Mut ist zerbrechlicher als Wintereis."
 greeting_supplimentary.negative.insult_byzantine.1: "Selbst die Ratten von Konstantinopel flüchten vor Eurem Gestank."
 greeting_supplimentary.negative.insult.4: "Mögen Eure Felder brach liegen und Eure Brunnen austrocknen."
 greeting_supplimentary.negative.insult.unreliable_swine: "Ihr unzuverlässiges Schwein."
 greeting_supplimentary.negative.insult.oathbreaker: "Ihr seid ein Lügner und Eidbrecher."
 greeting_supplimentary.negative.insult_jewish.1: "Möge Euer Name aus dem Buch der Lebenden getilgt werden."
 greeting_supplimentary.negative.insult_zoroastrian.1: "Möge Finsternis das Feuer ersticken, das Ihr angeblich hütet."
 greeting_supplimentary.negative.insult_hindu.1: "Ihr wandelt weitab des rechtschaffenen Pfads – und ich werde Euch noch weiter von ihm abbringen."
 greeting_supplimentary.negative.insult_christian.3: "Möge die Hölle sich weit auftun, um Euch zu verschlingen."
 greeting_supplimentary.negative.insult_norse.3: "Die Raben erwartet mit Eurer Leiche ein reichhaltiges Mahl."
 greeting_supplimentary.positive: "[ROOT.Char.Custom2('NegativeSupplimentaryGreeting', second)]"
 greeting_supplimentary.positive.flattery.1: "Ihr und Euer Haus mögen gesegnet sein!"
 greeting_supplimentary.positive.flattery.2: "Eure Weisheit und Gnade sind legendär!"
 greeting_supplimentary.positive.flattery.3: "Friede sei mit Euch!"
 greeting_supplimentary.positive.flattery.4: "möget Ihr in Harmonie und Zufriedenheit leben!"
 greeting_supplimentary.positive.flattery.5: "Eure Unbarmherzigkeit ist beneidenswert!"
 greeting_supplimentary.positive.flattery.6: "Eure schier unstillbaren Gelüste sind auf der ganzen Welt bekannt!"
 greeting_supplimentary.positive.flattery.7: "Eure Bekanntheit reicht weit über alle Grenzen hinweg."
 greeting_supplimentary.positive.flattery.8: "Möge Eure Linie tausend Jahre überdauern."
 greeting_supplimentary.positive.flattery.9: "Möge Gott Euren Schwertarm stark halten."
 greeting_supplimentary.positive.flattery.10: "Frieden und Überfluss mögen Eurem Haus gehören."
 greeting_supplimentary.positive.flattery.11: "Möge das Schicksal Euren Bannern hold sein."
 greeting_supplimentary.positive.flattery_chinese.1: "Die Segen des Himmels seien mit Euch."
 greeting_supplimentary.positive.flattery_chinese.2: "Möge Euer Land stets gedeihen."
 greeting_supplimentary.positive.flattery_chinese.3: "Mögen Stärke und Lebenskraft Eure Herrschaft segnen."
 greeting_supplimentary.positive.flattery_norse.1: "Mögen die Götter Euch gute Winde und fettes Vieh gewähren."
