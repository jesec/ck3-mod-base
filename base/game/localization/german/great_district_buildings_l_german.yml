 building_type_republic_fountain_01: "Springbrunnen"
 building_type_republic_fountain_01_desc: "Brunnen, Bäder und Aquädukte sind Symbole für die Schönheit und den Wohlstand der Stadt. Darüber hinaus stellen sie eine wichtige Wasserquelle dar."
