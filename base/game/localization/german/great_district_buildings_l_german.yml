 building_type_republic_weigh_house_01: "Öffentliches Waaghaus"
 building_type_republic_weigh_house_01_desc: "Die stadteigenen Waagen und versiegelten Maßeinheiten werden unter Verschluss gehalten und von vereidigten Beamten überprüft. Jeder Ballen, der hier durchgeht, wird gegen eine Gebühr gewogen und das Ergebnis kann von keinem Kaufmann angefochten werden."
