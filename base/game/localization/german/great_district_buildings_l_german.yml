 building_type_republic_league_chapter_house_01_desc: "Unterkünfte, ein Tresorraum und ein Versammlungssaal für die Delegierten der verbündeten Städte. Wenn sich die Liga versammelt, trifft sie sich hier, und die geschlossenen Vereinbarungen binden Häfen, die tausend Meilen voneinander entfernt sind."
