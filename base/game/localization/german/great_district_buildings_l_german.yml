 building_type_republic_loggia_01: "Gemeindeloggia"
 building_type_republic_loggia_01_desc: "Eine Arkadengalerie am Rand des Platzes. Im Schatten der Arkaden handeln Kaufleute ihre Geschäfte aus, Notare stellen ihre Schreibtische zwischen den Säulen auf, und die ganze Stadt sucht dort Schutz, wenn es regnet."
