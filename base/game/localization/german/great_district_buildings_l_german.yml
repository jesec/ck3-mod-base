 building_type_republic_council_chamber_01: "Große Ratskammer"
 building_type_republic_council_chamber_01_desc: "Es gibt genügend Sitzbänke für alle eingetragenen Bürger von Rang. Hier berät der Stadtrat über die Steuerverzeichnisse, genehmigt den Jahresabschluss und vergibt die Ämter der Stadt."
