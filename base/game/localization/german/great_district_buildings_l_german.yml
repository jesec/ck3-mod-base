 building_type_republic_civic_ward_01: "Stadtplanung"
 building_type_republic_civic_ward_01_desc: "Eine Abteilung, die die Bauvorhaben der Stadt überwacht, Materialien beschafft, Genehmigungen und den Papierkram verwaltet und dafür sorgt, dass jedes Vorhaben im Zeitplan und im Rahmen des Budgets bleibt."
