 building_type_republic_podesta_residence_01_desc: "Ein bezahlter Magistrat, der für eine bestimmte Zeit aus einer anderen Stadt angeheuert wurde, auf Kosten der öffentlichen Hand untergebracht ist und hier keinen Grundbesitz besitzen darf. Da er keine Verwandten in der Stadt hat, kann er in deren Streitigkeiten keine Partei ergreifen."
