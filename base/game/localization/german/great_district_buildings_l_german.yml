 building_type_republic_civic_hospital_01: "Städtisches Krankenhaus"
 building_type_republic_civic_hospital_01_desc: "Von der Gemeinde finanzierte und auf ihre Kosten betriebenen Stationen, in denen arme Kranke aufgenommen werden, anstatt dass man sie auf der Straße sterben lässt. Ein gesunder Bürger ist ein produktiver Bürger."
