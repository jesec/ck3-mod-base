 building_type_republic_basilica_01_desc: "Diese prächtige Großbasilika bildet den Mittelpunkt des religiösen Lebens der Stadt. Sie wird jedoch nicht vom Klerus, sondern von der Stadt selbst verwaltet. Am meisten profitieren davon die wohlhabenden Patrizierfamilien, die den Bau finanzierten."
