 building_type_republic_statute_hall_01: "Statutenhalle"
 building_type_republic_statute_hall_01_desc: "Die Kammer, in der die Gesetze der Gemeinde aufbewahrt, abgeschrieben und jedes Jahr vorgelesen werden, damit sich kein Richter auf Unkenntnis berufen und kein Bürger behaupten kann, ihm sei eine Sache nie mitgeteilt worden."
