 building_type_republic_debt_office_01: "Amt für öffentliche Schulden"
 building_type_republic_debt_office_01_desc: "Die Stadt leiht sich Geld von ihren Bürgern und zahlt ihnen dafür Zinsen. Die Anteile wechseln wie jede andere Ware den Besitzer, und die Erlöse sorgen dafür, dass die Stadtkasse liquide bleibt und die beauftragten Gesellschaften bezahlt werden können."
