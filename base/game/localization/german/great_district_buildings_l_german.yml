 building_type_republic_clock_tower_01: "Städtischer Uhrenturm"
 building_type_republic_clock_tower_01_desc: "Ein mechanisches Wunderwerk, das über den Dächern zu jeder vollen Stunde schlägt. Es ist der Stolz der Gemeinde, den sie jedem Besucher präsentiert, und es unterwirft den Arbeitstag der Kaufleute eher der Stadt als der Sonne."
