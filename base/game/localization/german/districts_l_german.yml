l_german:
 DISTRICT_DEBUG_KEY: "#D DEBUG KEY:#! [DistrictType.GetKey]"
 DISTRICT_DEBUG_FULL: "#D DEBUG KEY AND DESC:#!\n[District.GetKey]\n[District.GetDescKey]"
 bureacratic_district_capital_trigger: "[root_scope.GetName|U] ist Euer [realm_capital|E]"
 civic_district_capital_trigger: "[root_scope.GetName|U] ist Euer [capital|E]"
 household_district_government_trigger: "Eure [government|E] ist [feudal|E], [clan|E], [administrative|E], [celestial|E], [meritocratic|E], [ritsuryo|E] oder [soryo|E]"
 household_district_top_liege_trigger: "Ihr seid ein [independent_ruler|El], wie es für [Concept('administrative', 'Verwaltungs')|E]-, [Concept('celestial', 'himmlische')|E] und [Concept('meritocratic', 'meritokratische')|E] [Concept('governments', 'Regierungen')|E] notwendig ist"
 bureaucratic_district_ledger_or_administrative_trigger: "Der Träger hat eine [Concept('administrative', 'Verwaltungs')|E]-[government|E] oder die [culture|E] dieser [barony|E] hat die [innovation|E] #V $innovation_ledger$#! entdeckt"
 port_district_water_trigger: "Diese [barony|E] liegt #bol nicht#! an einer Küste oder einem Fluss"
 temple_district_trigger: "Dies ist weder ein [county_capital|E], ein [temple|E] noch eine [temple_citadel|E]"
 metropolitan_district_city_trigger: "Dies ist ein [city_holding|E]"
 ### Holdings ###
 castle_holding_district: "Burgbesitztumsbezirk"
 castle_holding_district_desc_flavor: "$building_type_castle_01_desc$"
 tribal_holding_district: "Stammesbesitztumsbezirk"
 tribal_holding_district_desc_flavor: "$building_type_tribe_01_desc$"
 city_holding_district: "Stadtbesitztumsbezirk"
 city_holding_district_desc_flavor: "$building_type_city_01_desc$"
 temple_holding_district: "Tempelbesitztumsbezirk"
 temple_holding_district_desc_flavor: "$building_type_temple_01_desc$"
 nomad_holding_district: "Nomadenbesitztumsbezirk"
 nomad_holding_district_desc_flavor: "$building_type_nomadic_camp_01_desc$"
 herder_holding_district: "Hirtenbesitztumsbezirk"
 herder_holding_district_desc_flavor: "$building_type_herder_camp_01_desc$"
 temple_citadel_holding_district: "Tempelzitadellen-Besitztumsbezirk"
 temple_citadel_holding_district_desc_flavor: "$building_type_temple_citadel_01_desc$"
 DISTRICT_FOCUS_HEADING: "#low Bezirksschwerpunkt\n#!"
 UNLOCKS_DISTRICTS: "#low Freigeschaltete [districts|E]#!"
 ### Economy ###
 guild_district: "Zunftbezirk"
 guild_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]"
 guild_district_desc_flavor: "In den Zunfthäusern hier arbeiten die besten Handwerker der Stadt, die ihre Geheimnisse eifersüchtig hüten. Ihre Arbeiten sind exzellent, ihre Preise hoch und ihre Lehrlinge überarbeitet."
 market_district: "Marktbezirk"
 market_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[gold_i][buy_prices|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax_short|E] & [artisan_tax_i][artisan_tax|E]"
 market_district_desc_flavor: "Einheimische Bauern, Handwerker und Händler drängen sich von Sonnenaufgang bis Sonnenuntergang auf diesem belebten Platz. Was die Stadt selbst nicht herstellen kann, ist hier zu einem ‚angemessenen‘ Preis erhältlich."
 port_district: "Hafenbezirk"
 port_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]"
 port_district_desc_flavor: "An der Uferpromenade reihen sich Anleger und Lagerhallen aneinander, wo Hafenarbeiter Fracht von Schiffen jeder Größe entladen. Was auch immer vom Meer kommt: Es kommt hier an Land."
 entrepot_location_district: "Zwischenlagerbezirk"
 entrepot_location_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[trade_goods|E]\n$BULLET_WITH_TAB$[commerce_tax_i][commerce_tax|E]"
 entrepot_location_district_desc_flavor: "[Concept('entrepot', 'Erlaubt über seine Gebäude den Wiederverkauf von Waren über große Entfernungen')|E]\n\nEingeführte Waren werden in diesen Lagerhäusern gezählt, sortiert und zum Markt weitergeleitet. Die Händler hier wissen stets, welche Waren knapp sind, und passen ihre Preise entsprechend an."
 entrepot_holding_district_level_2_tt: "Erfordert Stufe #V 2#! im [holding_district|E]"
 entrepot_holding_district_level_3_tt: "Erfordert Stufe #V 3#! im [holding_district|E]"
 entrepot_holding_district_level_4_tt: "Erfordert Stufe #V 4#! im [holding_district|E]"
 holding_district_level_2_tt: "Erfordert Stufe #V 2#! im [holding_district|E]"
 holding_district_level_3_tt: "Erfordert Stufe #V 3#! im [holding_district|E]"
 holding_district_level_4_tt: "Erfordert Stufe #V 4#! im [holding_district|E]"
 ### Fortification ###
 border_forts_district: "Grenzfestungsbezirk"
 border_forts_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[control_i][control|E]"
 border_forts_district_desc_flavor: "Eine Kette von Festen bewacht die Ränder der Baronie: Jede ist mit Soldaten besetzt, die jeden Weg und jede Furt kennen. Angreifer, die hier entlang vorrücken, kommen selten weit."
 walls_district: "Mauerbezirk"
 walls_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]"
 walls_district_desc_flavor: "Die Stadt ist von massiven Steinmauern umgeben, die einen hervorragenden Schutz vor Plünderern bieten. Die Stadtbewohner murren zwar über den Zoll am Stadttor, doch er ist immer noch billiger, als ausgeraubt zu werden."
 ### Military ###
 military_district: "Militärbezirk"
 military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[siege_weapon_i][siege_weapons|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 military_district_desc_flavor: "In robusten Kasernen sind die Soldaten des Reiches untergebracht, wo man sie verpflegt, ausbildet und jederzeit marschbereit hält. Sie nüchtern zu halten, ist deutlich schwieriger."
 ### Civic ###
 bureaucratic_district: "Bürokratiebezirk"
 bureaucratic_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[vassal_i][vassals|E]\n$BULLET_WITH_TAB$[realm|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[tax_collector|E] & [governor_efficiency|E]"
 bureaucratic_district_desc_flavor: "In diesen Hallen kopieren, besiegeln und archivieren Beamte aller Ränge die Angelegenheiten des Reiches. Ihre Arbeit wird selten gelobt, doch ohne sie würde das Reich bald zum Stillstand kommen."
 household_district: "Königshaushalt"
 imperial_household_district: "Kaiserhaushalt"
 household_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[court_grandeur|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 household_district_desc_flavor: "In diesen prunkvollen Hallen hält der Herrscher Hof. Hinter hohen Mauern wird die Majestät des Reiches von Dienern, geschickten Handwerkern und Ratgebern gleichermaßen gewahrt. Manche verbringen ihr ganzes Leben, ohne diesen Bezirk je zu verlassen."
 mandala_district: "Mandala-Bezirk"
 mandala_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[dynasty_prestige_i][dynasty_prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]\n$BULLET_WITH_TAB$[opinion_i][opinion|E]"
 mandala_district_desc_flavor: "Jeder Tempel, jede Statue und jede Zeremonie in diesem heiligen Viertel erzählt dieselbe Geschichte: Der König regiert nach dem Willen der Götter. Sie wird oft und sehr laut verkündet."
 temple_district: "Glaubensenklaven-Bezirk"
 temple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 temple_district_desc_flavor: "Heilige Stätten drängen sich in diesem Viertel, und ihre Glocken, Gesänge und Gebetsrufe prägen jede Stunde des Tages. Hier hat der Klerus fast ebenso viel Einfluss wie der Herr selbst."
 temple_district_christian: "Kirchenenklaven-Bezirk"
 temple_district_islamic: "Moscheebezirk"
 ### Metropolitan ###
 entertainment_district: "Unterhaltungsbezirk"
 entertainment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_tax|E]"
 entertainment_district_desc_flavor: "Musik, Spiele und Spektakel aller Art locken Stadtbewohner aller Stände in dieses Viertel. Die Adligen tun so, als würden sie nichts davon genießen, und die Bauern tun so, als ob sie sie nicht bemerkten."
 patrician_district: "Patrizierbezirk"
 patrician_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 patrician_district_desc_flavor: "Marmor, Seide und eingeführte Gewürze gehören in diesem Viertel der wohlhabenden Haushalte zum alltäglichen Bild. Die Familien hier heiraten untereinander, leihen einander Geld und schmieden Intrigen gegeneinander."
 urban_housing_district: "Wohnbezirk"
 urban_housing_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i][settlement_size|E] & [settlement_size_growth_short|E]\n$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$Schaltet [urban_districts|E] frei"
 urban_housing_district_desc_flavor: "Die meisten Stadtbewohner leben in diesen überfüllten Straßen – mit mehreren Familien unter einem Dach. Für Neuankömmlinge vom Land ist es der erste Schritt in Richtung eines besseren Lebens."
 ### Rural ###
 manor_houses_district: "Herrenhäuserbezirk"
 manor_houses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[fort_level_i][fort_level|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]"
 manor_houses_district_desc_flavor: "Überall auf dem Land stehen Herrenhäuser, die von niederen Adelsfamilien bewohnt werden und über die umliegenden Ländereien wachen. Getreide und Geld fließen nach oben – und mit ihnen die Beschwerden."
 religious_community_district: "Glaubensgemeinschaftsbezirk"
 religious_community_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 religious_community_district_desc_flavor: "Die Gläubigen versammeln sich in dieser stillen Gemeinschaft, um abgeschieden von der Welt zu leben, zu beten, Landwirtschaft zu betreiben und heilige Schriften abzuschreiben. Doch die Welt schickt ihnen immer wieder ihre Ärgernisse."
 villages_district: "Dörferbezirk"
 villages_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[settlement_size_i]Verringerte [settlement_size|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[supply_i][supply|E]\n$BULLET_WITH_TAB$Schaltet [rural_districts|E] frei"
 villages_district_desc_flavor: "Jenseits der Stadtmauern erstrecken sich verstreute Dörfer über die Landschaft, jedes mit eigenen Feldern und Brunnen. Die Bauern hier bauen jene Lebensmittel an, die für die Stadtbewohner so selbstverständlich sind."
 ### Tribal ###
 tribal_economy_prestige_district: "Festsälebezirk"
 tribal_economy_prestige_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[gold_i][tax|E]"
 tribal_economy_prestige_district_desc_flavor: "In diesen Festsälen versammelt sich der Stamm, um zu speisen, zu trinken und mit den eigenen Taten zu prahlen. Mit jedem Becher werden die Geschichten ein wenig fantastischer."
 tribal_military_district: "Kriegshüttenbezirk"
 tribal_military_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 tribal_military_district_desc_flavor: "In diesen Hütten schärfen die Krieger des Stammes ihre Waffen und tauschen Geschichten über vergangene Raubzüge aus. Die Jungen hören aufmerksam zu und planen bereits ihre eigenen Raubzüge."
 tribal_wanua_district: "Wantilanbezirk"
 tribal_wanua_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[barter_goods_i][barter_goods|E]\n$BULLET_WITH_TAB$[vassal_limit_i][vassal_limit|E]\n$BULLET_WITH_TAB$[domain_limit_i][domain_limit|E]"
 tribal_wanua_district_desc_flavor: "In diesen offenen Hallen versammeln sich die Menschen, um ihre Beschwerden den Ältesten vorzutragen, und die Ältesten wiederum sorgen dafür, dass auch der Häuptling sie hört."
 ### Duchy ###
 bailiwick_district: "Balleibezirk"
 bailiwick_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax_short|E] & [woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[trade_goods_i][trade_goods_production|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]"
 bailiwick_district_desc_flavor: "Das Land finanziert alles, was das Herzogtum tut, und in diesem Bezirk sorgen die Vögte dafür, dass dies auch geschieht: Feld für Feld, Herde für Herde, Dorf für Dorf."
 staple_district: "Anlaufbezirk"
 staple_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[urban_tax_i][urban_taxes_short|E], [commerce_tax_i][commerce_tax_short|E], [artisan_tax_i][artisan_tax_short|E] & [maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[gold_i][sell_prices|E]\n$BULLET_WITH_TAB$[trade_route_capacity_i][trade_route_capacity_short|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 staple_district_desc_flavor: "Lagerhäuser, Waagen und Zählräume drängen sich im Hauptviertel, wo der wertvollste Handel des Herzogtums gewogen, besteuert und geschützt wird."
 endowment_district: "Stiftungsbezirk"
 endowment_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[religious_tax_i][religious_tax|E]\n$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[epidemic_resistance_i][epidemic_resistance|E]\n$BULLET_WITH_TAB$[travel_danger_i][travel_danger|E]"
 endowment_district_desc_flavor: "Jede Spende an diese Stiftung erfolgt unbegrenzt, und die Geistlichen hier besitzen Urkunden von Herrschern, an deren Namen sich sonst niemand mehr erinnert."
 assay_district: "Prüfbezirk"
 assay_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E] & [civic_tax_i][civic_tax|E]\n$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[vassal_i][vassals|E]"
 assay_district_desc_flavor: "Einige Münzen aus jeder in diesem Bezirk geprägten Charge werden in einer Truhe weggeschlossen, um sie später zu prüfen. So werden die Prägemeister nicht zu gierig."
 military_duchy_capital_district: "Antrittsplatzbezirk"
 military_duchy_capital_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[levies_i][levies|E]\n$BULLET_WITH_TAB$[stationed_regiment_i][stationed_regiment|E]\n$BULLET_WITH_TAB$[garrison_i][garrison|E] & [fort_level|E]\n$BULLET_WITH_TAB$[knight_i][knights|E]"
 military_duchy_capital_district_desc_flavor: "Jeder Soldat, der sich in diesem Bezirk zur Musterung meldet, wird mit Namen, Waffengattung und Pferd in die Musterrolle eingetragen. Doch auch jene, die nicht erscheinen, werden vermerkt."
 ducal_residence_district: "Herzogsresidenzbezirk"
 ducal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 ducal_residence_district_desc_flavor: "Die Gäste in diesem Bezirk werden in Sälen und Gärten empfangen, die eines Herzogs würdig sind. Beim Abendessen bespricht man dann weitere Angelegenheiten des Herzogtums – mehr noch als bei Hofe."
 royal_residence_district: "Königsresidenzbezirk"
 royal_residence_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[prosperity_i][prosperity|E]\n$BULLET_WITH_TAB$[stress_i][stress|E]"
 royal_residence_district_desc_flavor: "Die Gäste in diesem Bezirk werden in Sälen und Gärten empfangen, die eines Königs würdig sind. Beim Abendessen bespricht man dann weitere Angelegenheiten des Reichs – mehr noch als bei Hofe"
 governance_district: "Regierungsbezirk"
 governance_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[control_i][control|E]\n$BULLET_WITH_TAB$[influence_i][influence|E]\n$BULLET_WITH_TAB$[popular_opinion_i][popular_opinion|E]\n$BULLET_WITH_TAB$[men_at_arms_i][men_at_arms|E]"
 governance_district_desc_flavor: "Beamte aller Ränge arbeiten in den Hallen dieses Bezirks. Dort werden die Steuern der Provinz gezählt, ihre Getreidespeicher inspiziert und ihre Garnisonen bezahlt."
 forestry_district: "Waldwirtschaftsbezirk"
 forestry_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wood').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_glass').GetNameWithIcon], [GetTradeGoodType('trade_good_lacquerware').GetNameWithIcon] & [GetTradeGoodType('trade_good_meat').GetNameWithIcon]"
 forestry_district_desc_flavor: "Die Wälder hier liefern Holz für Häuser, Schiffe und Feuer, und das Recht, es zu schlagen, wird streng durchgesetzt. Holzdiebstahl wird fast genauso hart bestraft wie Wilderei."
 grain_district: "Getreideanbaubezirk"
 grain_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_grain').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 grain_district_desc_flavor: "Getreide ist das Rückgrat jeder Wirtschaft, und die Felder dieses Bezirks liefern es im Überfluss. Was nicht zu Brot verarbeitet wird, wird gebraut, destilliert oder verkauft."
 wool_district: "Schafzuchtbezirk"
 wool_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wool').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon], [GetTradeGoodType('trade_good_leather').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon], [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon] & [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 wool_district_desc_flavor: "Schafherden grasen auf den Weiden dieses Bezirks, und ihre Wolle wird säckeweise an Weber im ganzen Reich verkauft. So manches große Kaufmannsvermögen begann mit einer einzigen Schafherde."
 cattle_district: "Rinderzuchtbezirk"
 cattle_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cattle').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_meat').GetNameWithIcon], [GetTradeGoodType('trade_good_cheese').GetNameWithIcon] & [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 cattle_district_desc_flavor: "Auf den Weiden dieser Gegend grasen Rinder, die wegen ihres Fleisches, ihrer Milch und ihrer Zugkraft beim Pflügen geschätzt werden. Vielerorts wird die Mitgift einer Braut noch immer in Kühen bemessen."
 cotton_district: "Baumwollanbaubezirk"
 cotton_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_cotton').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] & [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 cotton_district_desc_flavor: "Weiße Baumwollkapseln reifen auf den Feldern dieses Bezirks, werden von Hand gepflückt und ballenweise verkauft. Manche Völker in fernen Ländern glauben, Baumwolle wachse an Pflanzen, aus denen winzige Schafe schlüpfen."
 stone_district: "Steinbruchbezirk"
 stone_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_stone').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 stone_district_desc_flavor: "Steinbrüche überziehen die Hügel dieser Gegend, wo man Stein für Mauern, Tempel und Burgen im ganzen Reich abbaut. Einige der schönsten Gebäude nahmen hier an einem Berghang ihren Anfang."
 fish_district: "Fischereibezirk"
 fish_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fish').GetNameWithIcon]\n$BULLET_WITH_TAB$[maritime_tax_i][maritime_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 fish_district_desc_flavor: "Fische aus dieser Gegend werden frisch, gesalzen, geräuchert oder getrocknet verzehrt und bis weit ins Landesinnere gehandelt, wo das Wasser fern ist. Ein guter Fang kann ein Dorf einen Monat lang ernähren."
 wine_district: "Weinbergbezirk"
 wine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_wine').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 wine_district_desc_flavor: "In den Weinbergen dieses Bezirks wachsen Tafeltrauben, Trockentrauben und vor allem Weintrauben. Ein guter Jahrgang bleibt jahrzehntelang in Erinnerung, ein schlechter noch viel länger."
 oil_district: "Olivenanbaubezirk"
 oil_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_oil').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 oil_district_desc_flavor: "Das Öl aus diesem Bezirk dient als Lampenbrennstoff, zum Kochen, zur Salbung der Gläubigen und zur Hautpflege der Reichen. Es gibt kaum etwas, was es nicht vermag, und nur wenige Haushalte kommen ohne es aus."
 rice_district: "Reisanbaubezirk"
 rice_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_rice').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] & [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 rice_district_desc_flavor: "Überflutete Reisfelder erstrecken sich hier über das Land, gemeinsam bewirtschaftet von ganzen Dörfern, die säen, jäten und ernten. Der Reisanbau ist für eine einzelne Familie allein zu viel Arbeit."
 millet_district: "Hirseanbaubezirk"
 millet_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_millet').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_wood').GetNameWithIcon]"
 millet_district_desc_flavor: "Hirse- und Sorghumfelder bedecken hier die trockenen Ebenen und wachsen hoch genug, um einen Reiter zu verbergen. Ihre kleinen, harten Körner sind jahrelang haltbar."
 mine_district: "Bergbaubezirk"
 mine_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodCategory('trade_category_minerals').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_jewelry').GetNameWithIcon]"
 mine_district_desc_flavor: "Was auch immer unter diesem Bezirk liegt, sei es Eisen, Silber oder Salz, wird von Bergleuten abgebaut, die mehr Zeit ihres Lebens unter der Erde als an der Oberfläche verbringen."
 salt_district: "Salzgewinnungsbezirk"
 salt_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_salt').GetNameWithIcon]\n$BULLET_WITH_TAB$[mining_tax_i][mining_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 salt_district_desc_flavor: "Ohne Salz lassen sich Fleisch und Fisch für die mageren Monate nicht haltbar machen, und auch keine Armee lässt sich ohne Salz versorgen. Diese Gegend liefert große Mengen davon und weiß das auch."
 amber_district: "Bernsteinsammelbezirk"
 amber_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_amber').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 amber_district_desc_flavor: "Bernstein wird nach Stürmen hierher gespült und im Landesinneren aus Sand und Sümpfen ausgegraben. Ein Stück, in dem ein Insekt gefangen ist, soll Glück bringen."
 silk_district: "Seidegewinnungsbezirk"
 silk_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_silk').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] & [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 silk_district_desc_flavor: "Die Seide dieses Bezirks beginnt mit winzigen Raupen, die sich Tag und Nacht von Maulbeerblättern ernähren. Für ein einziges Gewand benötigt man die Kokons von Tausenden dieser Raupen."
 furs_district: "Pelzwirtschaftsbezirk"
 furs_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_furs').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_leather').GetNameWithIcon]"
 furs_district_desc_flavor: "Die Fallensteller dieses Bezirks ziehen in den kältesten Monaten los, wenn das Fell der Tiere am dichtesten und wertvollsten ist. Ein einziger schöner Pelz kann den Lohn einer ganzen Saison einbringen."
 spices_district: "Gewürzanbaubezirk"
 spices_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_spices').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 spices_district_desc_flavor: "Die Gewürze hier stammen aus allen Teilen der Pflanze: Rinde, Knospen, Beeren, Wurzeln und Blütenfäden. Alles wird von Hand geerntet und sorgfältig getrocknet."
 tea_district: "Teeanbaubezirk"
 tea_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_tea').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 tea_district_desc_flavor: "An den steilen Hängen dieses Bezirks, wo morgens Nebel hängt, wachsen Teesträucher. Die schönsten Blätter werden jung gepflückt, jeweils eine Knospe und zwei Blätter zur Zeit."
 dyes_district: "Färbemittelbezirk"
 dyes_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_dyes').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 dyes_district_desc_flavor: "Die Färbemittel dieses Bezirks werden aus Wurzeln, Blättern, Beeren und sogar zerquetschten Insekten gewonnen. Um eine intensive, dauerhafte Farbe zu schaffen, braucht es mitunter zwölf Einweichvorgänge."
 ivory_district: "Elfenbeingewinnungsbezirk"
 ivory_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ivory').GetNameWithIcon]\n$BULLET_WITH_TAB$[woodland_tax_i][woodland_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 ivory_district_desc_flavor: "In diesem Bezirk werden Elefanten gefangen, gezähmt und für Krieg, Arbeit und Verehrung abgerichtet. Ihr Elfenbein ist nur ein Teil ihres Wertes."
 sugar_district: "Zuckeranbaubezirk"
 sugar_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_sugar').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 sugar_district_desc_flavor: "In dieser Gegend wächst hohes Zuckerrohr und wird wegen seines süßen Saftes ausgepresst, den man dann zu harten „Hüten“ einkocht. In der Ferne ist ein einziger Hut mehr wert als eine Kuh."
 incense_district: "Weihrauchsammelbezirk"
 incense_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_incense').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 incense_district_desc_flavor: "Der Weihrauch dieser Gegend besteht aus Harz, das aus der Rinde von Bäumen gewonnen und in der Sonne ausgehärtet wird. Sein Rauch steigt in Tempeln in der ganzen bekannten Welt auf."
 medicaments_district: "Arzneipflanzensammelbezirk"
 medicaments_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 medicaments_district_desc_flavor: "In den Gärten und wilden Gebieten dieser Gegend wachsen Heilkräuter, die von Menschen gesammelt werden, die wissen, welche Blätter heilen und welche schaden."
 ceramics_district: "Töpfereibezirk"
 ceramics_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_ceramics').GetNameWithIcon]\n$BULLET_WITH_TAB$[artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_glass').GetNameWithIcon]"
 ceramics_district_desc_flavor: "Der Ton dieser Gegend ist so fein, dass Töpfer wochenlang reisen, um ihn abzubauen. Die besten hier gebrannten Stücke klingen wie eine Glocke, wenn man sie anschlägt."
 hemp_district: "Hanfanbaubezirk"
 hemp_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_hemp').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon]"
 hemp_district_desc_flavor: "In diesem Bezirk erstrecken sich Felder von Hanf, der geschnitten, eingeweicht und geklopft wird, um aus den Fasern Seile, Stoffe und Segeltuch herzustellen."
 flax_district: "Flachsanbaubezirk"
 flax_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_flax').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_textiles').GetNameWithIcon] & [GetTradeGoodType('trade_good_books_paper').GetNameWithIcon]"
 flax_district_desc_flavor: "Flachs wird hier an den Wurzeln geerntet statt geschnitten, damit jede Faser erhalten bleibt. Die Samen werden gepresst, und der Presskuchen wird an die Tiere verfüttert."
 honey_district: "Imkereibezirk"
 honey_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_honey').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_beer').GetNameWithIcon] & [GetTradeGoodType('trade_good_medicaments').GetNameWithIcon]"
 honey_district_desc_flavor: "Die Bienen werden hier in Stöcken aus Stroh, Lehm oder hohlen Baumstämmen gehalten und mit Rauch beruhigt, wenn man den Honig erntet. Für die meisten Menschen ist er die einzige Süße, die sie jemals schmecken."
 fruit_district: "Obstanbaubezirk"
 fruit_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_fruit').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E] & [artisan_tax_i][artisan_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]\n$BULLET_WITH_TAB$[trade_goods_i]Mögliche Herstellung: [GetTradeGoodType('trade_good_beer').GetNameWithIcon]"
 fruit_district_desc_flavor: "Obsthaine bedecken die Hänge und Täler dieses Bezirks, und ihre Früchte werden frisch gegessen, in der Sonne getrocknet oder ausgepresst."
 horses_district: "Pferdezuchtbezirk"
 horses_district_desc: "$DISTRICT_FOCUS_HEADING$$BULLET_WITH_TAB$[GetTradeGoodType('trade_good_horses').GetNameWithIcon]\n$BULLET_WITH_TAB$[agricultural_tax_i][agricultural_tax|E]\n$BULLET_WITH_TAB$[settlement_size_i][settlement_size_baseline|E]"
 horses_district_desc_flavor: "Offene Weiden, Verschläge und Ställe prägen diesen Bezirk. Hier werden Pferde gezüchtet, eingeritten und an Reiter aus dem ganzen Reich verkauft."
