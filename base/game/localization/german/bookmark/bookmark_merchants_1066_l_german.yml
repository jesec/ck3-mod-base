l_german:
 bm_1066_merchants: "Kanäle des Handels"
 bm_1066_merchants_desc: "Damit ein Reich gedeihen kann, muss es nicht nur den eigenen Fortbestand sichern, sondern auch den Strom der Waren aufrechterhalten. Schließlich gewinnt ein Herrscher große Feldzüge nicht allein durch sein Geburtsrecht: Es sind Gold, Waffen, Proviant und fremdländische Hilfe, die Armeen stark machen.\n\nHinter jedem Handel und jedem Geschäftsabschluss stehen Kaufleute, die Karawanen und Schiffe über legendäre Routen lenken. Und wenn ihnen die gebührende Anerkennung verwehrt bleibt, erkämpfen sie sich selbst einen Platz und erschaffen eine neue Art von Stadt, die die Bürger regieren.\n\n#bold Wird Eure Familie den Markt beherrschen und ein dauerhaftes Handelsreich verwalten, wenn Reichtum zum Maßstab für Macht wird?"
 bookmark_merchants_domenico_contarini: "Domenico Contarini"
 bookmark_merchants_domenico_contarini_subheading: "Doge von Venedig"
 bookmark_merchants_domenico_contarini_desc: ""
 bookmark_merchants_ibn_jarada: "ibn Jarada"
 bookmark_merchants_ibn_jarada_subheading: "Kaufmann aus Bagdad"
 bookmark_merchants_ibn_jarada_desc: ""
 bookmark_merchants_sun_zhong: "Sūn Zhōng"
 bookmark_merchants_sun_zhong_subheading: "Kaufmann aus Mingzhou"
 bookmark_merchants_sun_zhong_desc: "Am Hafen von Mingzhou trifft Song auf das Ostmeer, und Sūn Zhōng ist derjenige, der dafür sorgt, dass es hier weiter geschäftig bleibt. Seide und Porzellan verlassen seine Lagerhäuser in Richtung Japan und Goryeo; Weihrauch und Silber kommen aus der entgegengesetzten Richtung. Die Beamten, die den Warenverkehr besteuern, haben gelernt, dass ein wohlüberlegtes Geschenk billiger ist als eine Anzeige.\n\n#bold Die Ostküste der Seidenstraße ist ein Hafen, keine Karawanenroute. Könnt Ihr den Namen Sūn zu einer unumstößlichen Macht machen, die kein Hof aufhalten kann?#!"
 bookmark_merchants_vitale_faliero: "Vitale Faliero"
 bookmark_merchants_vitale_faliero_subheading: "Patrizier aus Venedig"
 bookmark_merchants_vitale_faliero_desc: "Die Faliero zählen zu den ehrgeizigsten Handelshäusern Venedigs, und Vitale dehnte seine Gesellschaft weiter in den Osten aus, als es seine Rivalen wagten. Byzantinische Handelsrouten, der Druck der Normannen in der Adria und missgünstige Konkurrenten in den Räten der Stadt setzen das Haus von allen Seiten unter Druck.\n\n#bold Venedig liegt am Schnittpunkt zweier Welten. Werdet Ihr den Namen Faliero zur Vorherrschaft über beide führen?#!"
 bookmark_merchants_wuhsha_al_dallala: "Wuhsha die Pfandleiherin"
 bookmark_merchants_wuhsha_al_dallala_subheading: "Pfandleiherin aus Kairo"
 bookmark_merchants_wuhsha_al_dallala_desc: "Als Frau von immensem Reichtum führt Wuhsha al-Dallala genauestens Buch über ihren Besitz – und ihre Feinde.\n\nIhre Unabhängigkeit führte zum Ausschluss aus der Synagoge. Doch Wuhsha ist geduldig und wartet ab, um sich an jenen zu rächen, die ihr Unrecht taten.\n\n#bold Habt Ihr das nötige Geschick, Anleihen zu nutzen, um Eure Gegner zu demütigen?#!"
 bookmark_merchants_greek_salvidi_1: "Hillel Salvidi"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5: "Abu Sa’id"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_subheading: "Wuhshas Sohn"
 bookmark_merchants_bookmark_wuhsha_al_dallala_5_desc: ""
 bookmark_merchants_nattal_sahu: "Nattal Sahu"
 bookmark_merchants_nattal_sahu_subheading: "Kaufmannsfürst aus Delhi"
 bookmark_merchants_nattal_sahu_desc: "Auf den Märkten von Yoginipur genießt der Name Sahu hohes Ansehen. Als Oberhaupt der Jain-Kaufmannsgemeinde von Delhi und vertrauter Berater des Tomara-Königs Anangapal II. knüpfte Nattal ein Handelsnetz, das von den westlichen Häfen bis zu den Märkten Bengalens reicht.\n\n#bold Vermögt Ihr mit dem Vertrauen eines Königs und der Gerissenheit eines Kaufmanns etwas zu erschaffen, was beide überdauert?#!"
 bookmark_merchants_new_merchant_company: "Angepasster Charakter"
 bookmark_merchants_new_merchant_company_subheading: "Seidenstraßen-Kaufmann"
 bookmark_merchants_new_merchant_company_desc: "Die Seidenstraße gehört nicht Kaisern und Königen. Sie gehört jenen, die mutig genug sind, sie zu beschreiten.\n\nGründet Eure eigene Handelsgesellschaft am Schnittpunkt von Ost und West. Errichtet Karawane um Karawane ein Handelsreich und knüpft Verbindungen von den Basaren Samarkands bis zu den Häfen des Mittelmeers.\n\n#bold Wird Euer Familienname in hundert Städten widerhallen?#!"
