l_german:
 bm_1178_merchants: "Guelfen und Ghibellinen"
 bm_1178_merchants_desc: "Der Zwist zwischen den Guelfen und den Ghibellinen bahnte sich lange an. Seit dem Investiturstreit Ende des 11. Jahrhunderts schwelt er nun schon ein ganzes Jahrhundert.\n\nMit Friedrich Barbarossa als Kaiser spitzte sich die Lage zu, und ganz Italien muss nun Partei ergreifen.\n\n#bold Die Ghibellinen stehen an der Seite des Kaisers, die Guelfen an der Seite des Papstes in Rom. Der Streit tobt sowohl innerhalb der italienischen Republiken als auch zwischen ihnen. Wählt Eure Seite und führt sie zum Sieg.#!"
 bookmark_merchants_1178_marco_sanudo: "Marco Sanudo"
 bookmark_merchants_1178_marco_sanudo_subheading: "Patrizier aus Venedig"
 bookmark_merchants_1178_enrico_dandolo: "Enrico Dandolo"
 bookmark_merchants_1178_marco_sanudo_desc: "Die Familie Sanudo zählt zu den ältesten Adelsfamilien Venedigs und soll mit der legendären Familie Candiano verwandt sein, die auf dem Höhepunkt ihrer Macht mehrfach das Amt des Dogen innehatte.\n\nMarco ist nach dem Tod seines Vaters der junge Spross an der Spitze des Hauses und steht seinem Onkel Enrico Dandolo, dem späteren Strippenzieher des Vierten Kreuzzugs, sehr nahe.\n\n#bold Könnt Ihr Euer Schicksal erfüllen und Herzog des Archipels werden?#!"
 bookmark_merchants_1178_humbert_savoy: "Humbert III. von Savoyen"
 bookmark_merchants_1178_humbert_savoy_subheading: "Herzog von Savoyen#b #bol (Guelfe)#!#!"
 bookmark_merchants_1178_thomas_savoy: "Thomas"
 bookmark_merchants_1178_humbert_savoy_desc: "Als Herzog von Savoyen bewies Humbert seine Frömmigkeit, indem er die örtlichen Klöster großzügig unterstützte und sich nach dem Tod seiner dritten Gattin eine Zeit lang völlig aus dem weltlichen Leben zurückzog.\n\nNachdem er sich mit den Guelfen verbündet hatte, geriet er in Streit mit Friedrich Barbarossa und musste mitansehen, wie seine Ländereien sowohl erobert als auch geplündert wurden.\n\n#bold Könnt Ihr die savoyischen Ländereien vor dem Kaiser schützen?#!"
 bookmark_merchants_1178_guido_guerra: "Guido Guerra III."
 bookmark_merchants_1178_guido_guerra_subheading: "Graf von Casentino #color_yellow #bol (Ghibelline)#!#!"
 bookmark_merchants_1178_rinaldo_guidi: "Rinaldo"
 bookmark_merchants_1178_guido_guerra_desc: "Die Guidi sind seit Jahrhunderten Grafen am oberen Arno, und nur wenige Häuser in der Toskana können auf eine längere Dynastie zurückblicken.\n\nGuido Guerra verbrachte sein Leben im kaiserlichen Dienst: Er kämpfte bei der Belagerung Mailands, und Barbarossas Privileg bestätigt seine Burgen, seine Rechte und seine Bergwerke an beiden Hängen des Apennins.\n\n#bold Könnt Ihr aus Eurer Grafschaft eine machen, die in die Geschichte eingehen wird?#!"
 bookmark_merchants_1178_speronella_dalesmanni: "Speronella Dalesmanni"
 bookmark_merchants_1178_speronella_dalesmanni_subheading: "Patrizierin aus Padua #b #bol (Guelfin)#!#!"
 bookmark_merchants_1178_ezzelino_ii: "Ezzelino da Romano"
 bookmark_merchants_1178_pietro_iii: "Pietro Traversari"
 bookmark_merchants_1178_speronella_dalesmanni_desc: "Als Jugendliche wurde Speronella vom kaiserlichen Vikar von Padua, Pagano della Torre, entführt. Nachdem ihr Bruder sie schließlich befreit hatte, wurde der Vikar gestürzt, und mit seinem Fall wurde Padua eine freie Gemeinde.\n\n#bold Könnt Ihr als freie Frau Euren legendären Status nutzen, um politische Macht oder ein Vermögen zu erlangen?#!"
 bookmark_merchants_1178_konrad_urslingen: "Konrad von Urslingen"
 bookmark_merchants_1178_konrad_urslingen_subheading: "Herzog von Spoleto #color_yellow #bol (Ghibelline)#!#!"
 bookmark_merchants_1178_jutta_urslingen: "Jutta"
 bookmark_merchants_1178_konrad_urslingen_desc: "Konrad, ein junger deutscher Herzog, regiert ein italienisches Herzogtum im Auftrag des Kaisers. Spoleto liegt im Herzen der Halbinsel, am Schnittpunkt aller Straßen von Nord nach Süd. Seine Macht beruht auf der Gunst des Kaisers, aber der Kaiser ist weit weg auf der anderen Seite der Alpen.\n\n#bold Könnt Ihr Euch das Herzland der italienischen Halbinseln aneignen oder wird das Volk Eure Herrschaft ablehnen?#!"
