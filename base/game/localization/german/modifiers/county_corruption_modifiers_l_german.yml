l_german:
 county_corruption_inefficient_tax_collection_modifier: "Inkompetente Steuereintreiber"
 county_corruption_inefficient_tax_collection_modifier_desc: "[county_corruption|E]\nDie Steuer konnte in der Grafschaft nicht eingetrieben werden"
 county_corruption_inefficient_tax_collection_modifier_2: "Systemischer Steuerbetrug"
 county_corruption_inefficient_tax_collection_modifier_2_desc: "[county_corruption|E]\nSteuerbetrug hat in dieser Gemeinde weit um sich gegriffen"
 county_corruption_inefficient_tax_collection_modifier_3: "Steuerzusammenbruch"
 county_corruption_inefficient_tax_collection_modifier_3_desc: "[county_corruption|E]\nJedwede wirksame Steuereintreibung in dieser Gemeinde ist zusammengebrochen"
 county_corruption_deserting_levies_modifier: "Desertierende Aufgebote"
 county_corruption_deserting_levies_modifier_desc: "[county_corruption|E]\nIn dieser Grafschaft desertieren enorme Mengen an Aufgeboten"
 county_corruption_deserting_levies_modifier_2: "Massenhafte Fahnenflucht"
 county_corruption_deserting_levies_modifier_2_desc: "[county_corruption|E]\nAufgebote in dieser Gemeinde begehen in erschütterndem Maß Fahnenflucht"
 county_corruption_deserting_levies_modifier_3: "Aufgebotezusammenbruch"
 county_corruption_deserting_levies_modifier_3_desc: "[county_corruption|E]\nDas Aufgebotssystem in dieser Gemeinde ist vollständig zusammengebrochen"
 county_corruption_smuggling_ring_modifier: "Schmugglerring"
 county_corruption_smuggling_ring_modifier_desc: "[county_corruption|E]\nIn der Grafschaft treiben Schmuggler ihr Unwesen"
 county_corruption_smuggling_ring_modifier_2: "Verwurzelte Schmuggler"
 county_corruption_smuggling_ring_modifier_2_desc: "[county_corruption|E]\nSchmuggler bauten sich in dieser Gemeinde ein ausgedehntes Netz auf"
 county_corruption_smuggling_ring_modifier_3: "Umfassender Schmuggel"
 county_corruption_smuggling_ring_modifier_3_desc: "[county_corruption|E]\nKaum etwas in dieser Gemeinde wird von den Zöllnern begutachtet"
 county_corruption_bandits_rampant_modifier: "Verbreitetes Banditentum"
 county_corruption_bandits_rampant_modifier_desc: "[county_corruption|E]\nIn der Grafschaft treiben Banditen ihr Unwesen"
 county_corruption_bandits_rampant_modifier_2: "Räuberbanden"
 county_corruption_bandits_rampant_modifier_2_desc: "[county_corruption|E]\nMächtige Räuberbanden steckten eigene Territorien in dieser Gemeinde ab"
 county_corruption_bandits_rampant_modifier_3: "Banditenhorden"
 county_corruption_bandits_rampant_modifier_3_desc: "[county_corruption|E]\nDie Banden in dieser Gemeinde benehmen sich, als wären sie ein eigenes Reich"
 county_corruption_inefficient_census_modifier: "Ineffiziente Volkszählung"
 county_corruption_inefficient_census_modifier_desc: "Der Herrscher dieser Grafschaft weiß nicht, wer oder wie viele Menschen hier leben"
 county_corruption_inefficient_census_modifier_2: "Volkszählungszusammenbruch"
 county_corruption_inefficient_census_modifier_2_desc: "Die Verwaltung dieser Gemeinde verlor den Großteil der Bevölkerung und Besitztümer aus den Augen"
 county_corruption_inefficient_census_modifier_3: "Blinde Verwaltung"
 county_corruption_inefficient_census_modifier_3_desc: "Niemand weiß, wer hier lebt, was die Leute besitzen und was noch schlimmer ist: was sie zu zahlen haben."
 county_corruption_lack_of_sheriffs_modifier: "Mangel an Schultheißen"
 county_corruption_lack_of_sheriffs_modifier_desc: "[county_corruption|E]\nIn dieser Grafschaft gibt es nicht genug Schultheißen für das gesamte Gebiet"
 county_corruption_lack_of_sheriffs_modifier_2: "Gesetzloses Territorium"
 county_corruption_lack_of_sheriffs_modifier_2_desc: "[county_corruption|E]\nDie Gesetzeshüter haben in dieser Gemeinde schlichtweg aufgegeben"
 county_corruption_lack_of_sheriffs_modifier_3: "Unregierbare Gemeinde"
 county_corruption_lack_of_sheriffs_modifier_3_desc: "[county_corruption|E]\nDie Obrigkeit existiert in dieser Gemeinde nur dem Namen nach"
 county_corruption_lack_of_courts_modifier: "Misstrauen gegenüber dem Gericht"
 county_corruption_lack_of_courts_modifier_desc: "[county_corruption|E]\nIn dieser Grafschaft gibt es nicht genug Gerichte für alle Fälle, die Bauern vorbringen möchten"
 county_corruption_lack_of_courts_modifier_2: "Verachtung für Recht und Ordnung"
 county_corruption_lack_of_courts_modifier_2_desc: "[county_corruption|E]\nDie Menschen in dieser Gemeinde haben es aufgegeben, von ihren Herrschern Gerechtigkeit zu erwarten"
 county_corruption_lack_of_courts_modifier_3: "Rechtszusammenbruch"
 county_corruption_lack_of_courts_modifier_3_desc: "[county_corruption|E]\nJeglicher Respekt für das Recht und seine Gerichte ging in dieser Gemeinde verloren"
 county_corruption_thieves_guild_modifier: "Verbreitete Diebereien"
 county_corruption_thieves_guild_modifier_desc: "[county_corruption|E]\nDiebe wirken nach Belieben in dieser Gemeinde"
 county_corruption_thieves_guild_modifier_2: "Räuberbanden"
 county_corruption_thieves_guild_modifier_2_desc: "[county_corruption|E]\nVerbrecher haben sich überall in dieser Gemeinde verbreitet"
 county_corruption_thieves_guild_modifier_3: "Diebesgilde"
 county_corruption_thieves_guild_modifier_3_desc: "[county_corruption|E]\nDie Diebesgilde kontrolliert de facto Geschäfte und Bewegungen in dieser Gemeinde"
 county_corruption_unsafe_highways_modifier: "Unsichere Straßen"
 county_corruption_unsafe_highways_modifier_desc: "[county_corruption|E]\nDie Straßen dieser Grafschaft sind gefährlicher als ein nächtlicher Spaziergang durch den Wald"
 county_corruption_unsafe_highways_modifier_2: "Gefährliche Pfade"
 county_corruption_unsafe_highways_modifier_2_desc: "[county_corruption|E]\nDie Straßen dieser Gemeinde sind zu Orten des Schreckens für all jene geworden, die sie bereisen"
 county_corruption_unsafe_highways_modifier_3: "Unzugängliche Straßen"
 county_corruption_unsafe_highways_modifier_3_desc: "[county_corruption|E]\nDie Straßen dieser Gemeinde sind für ehrliche Leute so gut wie unpassierbar"
 county_corruption_uncooperative_guilds_modifier: "Unkooperative Zünfte"
 county_corruption_uncooperative_guilds_modifier_desc: "[county_corruption|E]\nDie örtlichen Zünfte kooperieren nur widerwillig mit dem Herrscher dieser Grafschaft"
 county_corruption_uncooperative_guilds_modifier_2: "Hinderliche Zünfte"
 county_corruption_uncooperative_guilds_modifier_2_desc: "[county_corruption|E]\nDie Zünfte behindern tatkräftig alle offiziellen Bemühungen in dieser Gemeinde"
 county_corruption_uncooperative_guilds_modifier_3: "Aufständische Zünfte"
 county_corruption_uncooperative_guilds_modifier_3_desc: "[county_corruption|E]\nDie Zünfte begehren offen gegen den Herrscher dieser Gemeinde auf"
 county_corruption_lackluster_administration_modifier: "Unzureichende Verwaltung"
 county_corruption_lackluster_administration_modifier_desc: "[county_corruption|E]\nDer Herrscher dieser Gemeinde kann keine angemessene Verwaltung mehr für sie finanzieren"
 county_corruption_lackluster_administration_modifier_2: "Strauchelnde Verwaltung"
 county_corruption_lackluster_administration_modifier_2_desc: "[county_corruption|E]\nDie Verwaltung in dieser Gemeinde ist in weiten Teilen gescheitert"
 county_corruption_lackluster_administration_modifier_3: "Verwaltungszusammenbruch"
 county_corruption_lackluster_administration_modifier_3_desc: "[county_corruption|E]\nDie wenige Verwaltung, die es noch in dieser Gemeinde gab, wurde gänzlich aufgegeben"
 county_corruption_roaming_bandits_modifier: "Herumstreifende Räuber"
 county_corruption_roaming_bandits_modifier_desc: "[county_corruption|E]\nBanditen suchen jeden heim, der diese Gemeinde bereist!"
 county_corruption_roaming_bandits_modifier_2: "Banditenbefall"
 county_corruption_roaming_bandits_modifier_2_desc: "[county_corruption|E]\nGnadenlose Banditen nisteten sich in allen Ecken dieser Gemeinde ein"
 county_corruption_roaming_bandits_modifier_3: "Besetzung durch Banditen"
 county_corruption_roaming_bandits_modifier_3_desc: "[county_corruption|E]\nGrässliche Banditen streifen frei durch diese Gemeinde und versetzen alle ehrlichen Menschen, die dort leben, in Angst und Schrecken"
 county_corruption_wild_beast_attacks_modifier: "Wildtierangriffe"
 county_corruption_wild_beast_attacks_modifier_desc: "[county_corruption|E]\nRudel von Wildtieren fressen in dieser Gemeinde Schafe und Hirten gleichermaßen!"
 county_corruption_wild_beast_attacks_modifier_2: "Wildtierbefall"
 county_corruption_wild_beast_attacks_modifier_2_desc: "[county_corruption|E]\nWilde Bestien sind überall in dieser Gemeinde allzu zahlreich geworden"
 county_corruption_wild_beast_attacks_modifier_3: "Von Raubtieren geplagt"
 county_corruption_wild_beast_attacks_modifier_3_desc: "[county_corruption|E]\nGroße Raubtiere streifen frei durch diese Gemeinde und reißen Vieh und dessen Halter gleichermaßen"
 county_corruption_upset_shepherds_modifier: "Aufgebrachte Schäfer"
 county_corruption_upset_shepherds_modifier_desc: "[county_corruption|E]\nDie Schäfer dieser Gemeinde sind aufgebracht und misshandeln ihre Herden!"
 county_corruption_upset_shepherds_modifier_2: "Meuternde Schäfer"
 county_corruption_upset_shepherds_modifier_2_desc: "[county_corruption|E]\nDie Schäfer dieser Gemeinde widersetzen sich offen ihrem Herrscher"
 county_corruption_upset_shepherds_modifier_3: "Hirtenzusammenbruch"
 county_corruption_upset_shepherds_modifier_3_desc: "[county_corruption|E]\nDie Lebensweise der Hirten ist in dieser Gemeinde vollkommen zusammengebrochen"
 county_corruption_rogue_warriors_modifier: "Abtrünnige Krieger"
 county_corruption_rogue_warriors_modifier_desc: "[county_corruption|E]\nHorden von Kriegern bekämpfen und erpressen jeden in dieser Gemeinde!"
 county_corruption_rogue_warriors_modifier_2: "Abtrünnige Kriegstrupps"
 county_corruption_rogue_warriors_modifier_2_desc: "[county_corruption|E]\nAbtrünnige Krieger fanden sich zu Kriegstrupps zusammen, die diese Gemeinde heimsuchen"
 county_corruption_rogue_warriors_modifier_3: "Abtrünnige Kriegsfürsten"
 county_corruption_rogue_warriors_modifier_3_desc: "[county_corruption|E]\nDiese Gemeinde wurde von niederen örtlichen Kriegsfürsten zerteilt und leistet niemandem Rechenschaft"
 county_corruption_unruly_nomads_modifier: "Aufmüpfige Nomaden"
 county_corruption_unruly_nomads_modifier_desc: "[county_corruption|E]\nDie in dieser Gemeinde lebenden Nomaden sind aufmüpfig und streiten sich oft!"
 county_corruption_unruly_nomads_modifier_2: "Ungehorsame Nomaden"
 county_corruption_unruly_nomads_modifier_2_desc: "[county_corruption|E]\nNomaden in dieser Gemeinde achten kaum auf andere, die nicht ihres Geblüts sind"
 county_corruption_unruly_nomads_modifier_3: "Aufständische Nomaden"
 county_corruption_unruly_nomads_modifier_3_desc: "[county_corruption|E]\nNomaden überall dieser Gemeinde stehen kurz vor dem offenen Aufstand"
