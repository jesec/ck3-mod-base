 clerical_chastity_vow_modifier: "Kirchliches Keuschheitsgelübde"
 clerical_chastity_vow_modifier_desc: "Diesem Charakter wurde ein Keuschheitsgelübde von einem Priester abgerungen, anstatt dass er es aus freien Stücken ablegte. Solange das Gelübde besteht, kann er niemanden verführen oder ihm den Hof machen."
 clerical_chastity_renounced_vow_clergy_disapproval_modifier: "Gebrochener heiliger Schwur"
 clerical_chastity_renounced_vow_clergy_disapproval_modifier_desc: "Nachdem er einem öffentlichen Keuschheitsgelübde abschwor, wird dieser Charakter misstrauisch vom [clergy|E] beäugt."
