l_german:
 unity_antagonistic_maa_modifier: "Treue Armeeoffiziere"
 unity_antagonistic_maa_modifier_desc: "Die Mitglieder dieses Hauses haben ihre Ressourcen zusammengelegt, um die Truppen ihrer Armeen zu stärken.\n\n"
 unity_competitive_spies_modifier: "Ränkespielnetz"
 unity_competitive_spies_modifier_desc: "Die Mitglieder dieses Hauses tauschen Komplotte miteinander und bauen ein Spitzelnetz auf, das ausschließlich ihrem Haus dient.\n\n"
 unity_competitive_spies_landless_merchant_modifier: "Ränkespielnetz"
 unity_competitive_spies_landless_merchant_modifier_desc: "Die Mitglieder dieses Hauses tauschen Komplotte miteinander und bauen ein Spitzelnetz auf, das ausschließlich ihrem Haus dient.\n\n"
 unity_impassive_tax_modifier: "Verbesserte Verwaltung"
 unity_impassive_tax_modifier_desc: "Die Mitglieder dieses Hauses erfreuen sich einer verbesserten Effektivität ihrer Verwaltung.\n\n"
 unity_friendly_bailiff_modifier: "Durchgesetzte Landvögte"
 unity_friendly_bailiff_modifier_desc: "Die Mitglieder dieses Hauses arbeiten mit ihrem Lehnsherrn zusammen, um die Korruption im ganzen Reich einzudämmen.\n\n"
 unity_harmonious_placation_modifier: "Beschwichtigt"
 unity_harmonious_placation_modifier_desc: "Die Mitglieder dieses Hauses bekräftigten, dass ihr Lehnsherr das Recht hat, in Harmonie zu regieren.\n\n"
 unity_house_organized_for_war_modifier: "Für den Krieg organisiert"
 unity_house_organized_for_war_modifier_desc: "Die Mitglieder dieses Hauses haben sich allesamt der Kriegsführung verschrieben.\n[rulers|E] werden den [economical_archetype|E] „[warlike_i|E][ai_warlike_personality|L]“ annehmen"
 unity_house_focused_on_economy_modifier: "Befeuerte Wirtschaft"
 unity_house_focused_on_economy_modifier_desc: "Die Mitglieder dieses Hauses verbessern aktiv und mit großem Eifer ihre Wirtschaft.\n[rulers|E] werden den [economical_archetype|E] [builder_i][ai_economical_boom_personality|L] annehmen"
 unity_house_focused_on_diplomacy_modifier: "Diplomatische Bemühungen"
 unity_house_focused_on_diplomacy_modifier_desc: "Die Mitglieder dieses Hauses arbeiten zusammen, um ihren Einfluss effektiv geltend zu machen."
 fp3_unity_promoted_prosperity_modifier: "Geförderter Wohlstand"
 fp3_unity_promoted_prosperity_modifier_desc: "Die Mitglieder dieses Hauses arbeiten zusammen, um ihre Ländereien zu entwickeln."
 fp3_unity_improved_logistics_modifier: "Geteilte Armeeversorgung"
 fp3_unity_improved_logistics_modifier_desc: "Die Mitglieder dieses Hauses teilen sich ihre Armeeversorgung und ihren Nachschub."
 unity_family_business_landless_merchant_modifier: "Organisiertes Familiengeschäft"
 unity_family_business_landless_merchant_modifier_desc: "Im Gutshaus, wo Anweisungen pflichtbewusst von den Mitgliedern dieses Hauses erfüllt werden, herrscht reges Treiben.\n\n"
 unity_regional_networks_landless_merchant_modifier: "Regionalnetze"
 unity_regional_networks_landless_merchant_modifier_desc: "Die unterschiedlichen Geschäftsinteressen der Mitglieder dieses Hauses wurden vom Hausoberhaupt anerkannt.\n\n"
 unity_merchant_development_modifier: "Geförderte Entwicklung"
 unity_merchant_development_modifier_desc: "Händler aus dieser Gemeinde fördern deren städtische Entwicklung.\n\n"
 unity_merchant_bailiffs_modifier: "Stadtvögte"
 unity_merchant_bailiffs_modifier_desc: "Händler aus dieser Gemeinde fördern Gesetz und Ordnung.\n\n"
 unity_merchant_prosperity_modifier: "Gemeinde unterstützen"
 unity_merchant_prosperity_modifier_desc: "Örtliche Herrscher zeigen sich in dieser Gemeide menschenfreundlich, was allen zugutekommt."
 MODIFIER_DEFINITION_VALUE_PER_MERCHANT_UNITY_MEMBER: " \t#weak Erhöht durch [house|E]-Mitglieder#!"
 MODIFIER_DEFINITION_MAIN_DESC_HOUSE_UNITY_LANDESS_MERCHANT: "Dieser Modifikator erhöht sich pro [house|E]-Mitglied, das ein unabhängiger [merchant|E] oder [court_position|E]-Halter ist (#bold $MULTIPLIER|0$#!/#bold 10#!)"
 unity_promoting_diligence_modifier: "Fördert Sorgfalt"
 unity_promoting_diligence_modifier_desc: "Von den Mitgliedern dieses Hauses wird erwartet, dass sie unermüdlich arbeiten – Bücher führen und jedem Vorteil nachjagen –, um ihr Geschäft und den Gewinn ihrer Gesellschaft zu steigern.\n\n"
 unity_promoting_excess_modifier: "Fördert Ausschweifung"
 unity_promoting_excess_modifier_desc: "Die Mitglieder dieses Hauses geben ihr Geld freigiebig für die schönen Dinge des Lebens aus und pflegen so ihren Ruf und das Prestige ihrer Gesellschaft.\n\n"
