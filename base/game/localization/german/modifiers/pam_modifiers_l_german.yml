l_german:
 christian_fulfillment_level_0: "Verdammt"
 christian_fulfillment_level_1: "Verloren"
 christian_fulfillment_level_2: "Gestört"
 christian_fulfillment_level_3: "Bußfertig"
 christian_fulfillment_level_4: "Vergeben"
 christian_fulfillment_level_5: "Beständig"
 christian_fulfillment_level_6: "Gnadensreich"
 default_fulfillment_level_0: "Ziellos"
 default_fulfillment_level_1: "Suchend"
 default_fulfillment_level_2: "Achtsam"
 default_fulfillment_level_3: "Andachtsvoll"
 default_fulfillment_level_4: "Friedvoll"
 industrious_junior_members_modifier: "Fleißige Novizen"
 foolish_convert_modifier: "Törichter Konvertit"
 foolish_convert_modifier_desc: "Dieser Narr entschloss sich übereilt dazu, zu einem [rite|E] mit einem gänzlich anderen Glaubenssystem überzutreten, und hat große Schwierigkeiten, sich an sein neues spirituelles Leben zu gewöhnen."
 reckless_convert_modifier: "Leichtsinniger Konvertit"
 reckless_convert_modifier_desc: "Dieser Charakter entschloss sich, ohne große Vorbereitung zu einem [rite|E] mit einem anderen Glaubenssystem überzutreten, und hat Schwierigkeiten, sich an sein neues spirituelles Leben anzupassen."
 informed_convert_modifier: "Kenntnisreicher Konvertit"
 informed_convert_modifier_desc: "Dieser Charakter entschloss sich, zu einem [rite|E] mit einem anderen Glaubenssystem überzutreten, und bereitete sich ausgiebig auf die Herausforderungen vor, die diese Entscheidung mit sich bringt."
 study_faith_learning_mannerism: "Verhaltensweisen lernen"
 study_faith_learning_mannerism_desc: "Auch wenn es weniger wirkungsvoll ist, kann das Erlernen der Verhaltensweisen und äußeren Rituale eines [rite|E] langfristig auch sinnvolle Ergebnisse zeigen."
 study_faith_newfound_coherence: "Neu gefundene Kohärenz"
 study_faith_newfound_coherence_desc: "Die beim Studium dieses [rite|E] bislang festgestellten Unstimmigkeiten erwiesen sich als Bereicherung statt als Hindernis. Durch das Zusammenführen der Unterschiede zweier Glaubenssystemen entstand ein tieferes Verständnis für die wahre Bedeutung hinter den [Concept('core_tenets', 'Glaubensätzen')|E] und [doctrines|E] des Ziels."
 study_faith_cautious_studies: "Bedachte Studien"
 study_faith_cautious_studies_desc: "Diesen [rite|E] studiert man besser langsamer und nimmt sich reichlich Zeit, um unbequeme Ansichten in verdaubarere Happen zu unterteilen und sich an die fremde Denkweise zu gewöhnen."
 study_faith_slow_and_steady: "Langsamer Lerner"
 study_faith_slow_and_steady_desc: "Dieser Charakter wurde von der schieren Menge an unbekannten Praktiken überwältigt, denen er ausgesetzt wurde. Die Mühen, um dieses Wissen zu verdauen, strapazieren sein geistiges Leistungsvermögen."
 study_faith_cramming_side_studies: "Hineingequetschte Zusatzstunden"
 study_faith_cramming_side_studies_desc: "Dieser Schüler ist so vertieft in die inneren Abläufe dieses [rite|E], dass er sich oft Notizen zu seinen Studien macht … auch wenn er anderweitig beschäftigt ist."
 followers_of_dead_faith_scheme_modifier: "Verschollenes Wissen"
 followers_of_dead_faith_scheme_modifier_desc: "Der [faith|E] wird nicht länger offen praktiziert, was es außerordentlich schwierig macht, Anhänger zu finden."
 appealing_theology_modifier: "Anziehende Theologie"
 appealing_theology_modifier_desc: "Dieser Charakter entdeckte einen fremdländischen theologischen Text, den er besonders anziehend findet."
 suspicions_of_heresy_modifier: "Ketzereiverdacht"
 suspicions_of_heresy_modifier_desc: "Oft sieht man diesen Charakter, wie er fremdländische theologische Texte liest, sodass andere Gläubige seiner Hingabe misstrauen."
 monastic_onslaught_modifier: "Klostergrundlagen"
 monastic_onslaught_modifier_desc: "Ein Klosterorden, der von einem weltlichen Gönner reichlich versorgt wird, treibt die örtliche Wirtschaft an."
 pam_monastic_order_improvement_modifier: "Klosterhilfe"
 pam_monastic_order_improvement_modifier_desc: "Ein Klosterorden hilft dieser Gemeide mit Rat und Tat."
 pam_military_order_improvement_modifier: "Gesegnete Waffen"
 pam_military_order_improvement_modifier_desc: "Mitglieder des Kriegerordens bilden örtliche Aufgebote aus und stärken die Disziplin in dieser Gemeinde."
 pam_tithes_or_mercy_harsh_tithes_modifier: "Erzwungener Zehnt"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "Zehnten werden grausam erhoben, sodass die örtlichen Gemeinden verbittert bezüglich ihres Oberherren sind."
 pam_tithes_or_mercy_show_mercy_modifier: "Gnädiger Zehnt"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "Kulanz beim Steuereintreiben stärkte das Vertrauen und das Wohlwollen in den örtlichen Gemeinden."
 pam_blissful_harmony_gospel_modifier: "Frohe Botschaft des guten Lebens"
 pam_blissful_harmony_gospel_modifier_desc: "Die Predigten des Herrschers feiern Frieden, Frömmigkeit und ordentliches Leben."
 pam_blissful_harmony_restless_ambition_modifier: "Ruheloser Ehrgeiz"
 pam_blissful_harmony_restless_ambition_modifier_desc: "Ein Augenblick der Glückseligkeit ließ diesen Charakter ruhelos zurück. Denn nun will er mehr davon."
 pam_stone_for_god_estate_build_discount_modifier: "Stein für Gottes Haus"
 pam_stone_for_god_estate_build_discount_modifier_desc: "Das scharfe Architektenauge dieses Charakters verschaffte ihm Zugang zu Stein."
 pam_relocating_faithfuls_to_frontiers: "Umsiedlung von Gläubigen in Grenzregionen"
 pam_relocating_faithfuls_to_frontiers_desc: "Diese Gemeinde ermutigt Menschen desselben [rite|E], in ein anderes [realm|E] umzuziehen, um zu bekehren."
 pam_moving_faithfuls_to_frontiers: "Einzug von Gläubigen"
 pam_moving_faithfuls_to_frontiers_desc: "In diese Gemeinde ziehen Menschen anderen [Concept('faith', 'Glaubens')|E] und bekehren.\n#weak Dies macht die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! billiger.#!"
 pam_building_new_shrines: "Bau von neuen Schreinen"
 pam_building_new_shrines_desc: "In diese Gemeinde ziehen Menschen anderen [Concept('faith', 'Glaubens')|E] und bauen neue Schreine.\n#weak Dies macht die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#! billiger.#!"
 pam_grand_cathedral_started_modifier: "Begonnener Großkathedralenbau"
 pam_grand_cathedral_started_modifier_desc: "Dieser Charakter sammelte die nötigen Ressourcen, um mit dem Bau einer Großkathedrale zu beginnen. Dieses Generationen überspannende Vorhaben ist schon jetzt ein Beleg seiner Hingabe an Gott."
 pam_grand_cathedral_completed_modifier: "Abgeschlossener Großkathedralenbau"
 pam_grand_cathedral_completed_modifier_desc: "Dieser Charakter hatte die nötigen Ressourcen gesammelt, um den Bau einer Großkathedrale abzuschließen. Dieses Generationen überspannende Vorhaben ist ein Beleg seiner Hingabe an Gott."
 pam_grand_cathedral_02_started_modifier: "Bau der Großkathedralenerweiterung"
 pam_grand_cathedral_02_started_modifier_desc: "Dieser Charakter sammelte die nötigen Ressourcen, um eine bestehende Großkathedrale zu noch größeren Höhen zu führen. Dieses Generationen überspannende Vorhaben ist schon jetzt ein großer Beleg für seine Hingabe an Gott."
 pam_grand_cathedral_02_completed_modifier: "Abgeschlossene Großkathedralenerweiterung"
 pam_grand_cathedral_02_completed_modifier_desc: "Dieser Charakter beaufsichtigte die Erweiterung einer Großkathedrale."
 pam_grand_cathedral_family_contributed_south_modifier: "Finanzierte Großkathedralenkapelle"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "Diese Dynastie hat ein Mitglied, das den Bau einer Kapelle für eine Großkathedrale finanzierte. Dieses Generationen überspannende Vorhaben ist ein Beleg seiner Hingabe an Gott."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Kathedralenkrypta-Gönner"
 pam_cathedral_founder_crypt_modifier_desc: "Dieser Charakter finanzierte eine Krypta für seine Dynastie unter einer Großkathedrale."
 pam_cathedral_bell_cracked_lesson_modifier: "Lektionen der gesprungenen Glocke"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Steinmetze in dieser Gemeinde arbeiten genauer, um die Schmach eines gescheiterten Glockengusses wettzumachen."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Bronzene Folterinstrumente"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Bronzeschrott aus einer falsch gegossenen Kathedralenglocke wurde zu Instrumenten des Schreckens umgegossen. Der Glockengießer war ihr erstes Opfer. Kunsthandwerker kennen nun den Preis des Scheiterns."
 pam_cathedral_treadwheel_crane_modifier: "Tretmühlenkran"
 pam_cathedral_treadwheel_crane_modifier_desc: "Ein gewaltiger Tretmühlenkran vom Bau einer Kathedrale wurde im Hauptsitz errichtet."
 pam_cathedral_cantoria_scam_modifier: "Entdeckte Täuschung"
 pam_cathedral_cantoria_scam_modifier_desc: "Nach dem Aufdecken einer betrügerischen Täuschung sind die Bauarbeiter erfüllt von neuem Eifer und sputen sich entsprechend."
 pam_cathedral_famed_choir_boy_modifier: "Engelsgleiche Stimme am Hof"
 pam_cathedral_famed_choir_boy_modifier_desc: "Ein Chorknabe mit überirdischer Stimme verleiht diesem Hof Anmut."
 pam_cathedral_sermon_peace_county_modifier: "Predigt des Friedens"
 pam_cathedral_sermon_peace_county_modifier_desc: "Durch die Predigt eines Herrschers am neuen Portal der Kathedrale ist diese Gemeinde zufriedener und Pilger reisen sicherer über ihre Straßen."
 pam_cathedral_sermon_peace_ruler_modifier: "Zum Frieden gehütet"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "Dieser Herrscher wurde von einer Kathedralenpredigt über den Frieden Jesu angerührt."
 pam_cathedral_sermon_diligence_county_modifier: "Predigt des Fleißes"
 pam_cathedral_sermon_diligence_county_modifier_desc: "Durch die Predigt eines Herrschers am neuen Portal der Kathedrale wurden die Kirchenbauleute und Steinmetze angespornt, fleißiger zu arbeiten."
 pam_cathedral_sermon_diligence_ruler_modifier: "Zur Geschäftigkeit gehütet"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "Dieser Herrscher wurde von einer Kathedralenpredigt über gottgefällige Arbeit angerührt."
 pam_cathedral_sermon_unity_county_modifier: "Predigt der Einigkeit"
 pam_cathedral_sermon_unity_county_modifier_desc: "Durch die Predigt eines Herrschers an einem neuen Kathedralenportal wurde der Gemeindegehorsam gefestigt."
 pam_cathedral_sermon_unity_ruler_modifier: "Zur Eintracht gehütet"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "Dieser Herrscher wurde von einer Kathedralenpredigt über die christliche Gemeinschaft angerührt."
 pam_cathedral_sermon_charity_county_modifier: "Predigt der Wohltätigkeit"
 pam_cathedral_sermon_charity_county_modifier_desc: "Durch die Predigt eines Herrschers an einem neuen Kathedralenportal taten sich die Säckel dieser Gemeinde auf und ihre Herzen wurden erwärmt."
 pam_cathedral_sermon_charity_ruler_modifier: "Zur Wohltätigkeit gehütet"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "Dieser Herrscher wurde von einer Kathedralenpredigt über die gütige Gnade angerührt."
 pam_cathedral_sermon_perseverance_county_modifier: "Predigt der Beharrlichkeit"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "Durch die Predigt eines Herrschers an einem neuen Kathedralenportal wurden das fromme Streben und das ordentliche Wachstum in dieser Gemeinde erneuert."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Zum Eifer gehütet"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "Dieser Herrscher wurde von einer Kathedralenpredigt über den Wettlauf des Glaubens angerührt."
 pam_cathedral_sermon_rejoice_county_modifier: "Predigt des Frohlockens"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "Durch die Predigt eines Herrschers an einem neuen Kathedralenportal wurden die Gläubigen mit Hoffnung auf die unfehlbare Liebe des Herrns erfüllt."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Zur Freude gehütet"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "Dieser Herrscher wurde von einer Kathedralenpredigt über die Freude am Herrn angerührt."
 pam_cardinal_order_improve_development_modifier: "Entwicklungssteigerung (Kardinalsbefehl)"
 pam_cardinal_order_improve_development_modifier_desc: "Auf Befehl seines Oberen arbeitet ein Kardinal daran, die Entwicklung in der örtlichen Erzdiözese zu fördern."
 pam_cardinal_order_convert_faith_modifier: "Glaubensbekehrung (Kardinalsbefehl)"
 pam_cardinal_order_convert_faith_modifier_desc: "Auf Befehl seines Oberen arbeitet ein Kardinal daran, die Bekehrung in der örtlichen Erzdiözese und in angrenzenden Landen zu fördern.\n\n$EFFECT_LIST_BULLET$[convert_county|E] in dieser [county|E]: #P +25 %#!"
 pam_cardinal_order_increase_control_modifier: "Erhöhung der Gemeindekontrolle (Kardinalsbefehl)"
 pam_cardinal_order_increase_control_modifier_desc: "Auf Befehl seines Oberen arbeitet ein Kardinal daran, die Bevölkerung der örtlichen Erzdiözese ruhigzustellen."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Kulturinteresse-Fortschritt beschleunigen (Kardinalsbefehl)"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "Auf Befehl seines Oberen arbeitet ein Kardinal daran, die Erforschung neuer Technologien zu beschleunigen."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Erhöhung des Seuchenwiderstands (Kardinalsbefehl)"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "Auf Befehl seines Oberen nutzt ein Kardinal die Ressourcen der Kirche, um die Auswirkungen von Seuchen zu lindern."
 pam_cardinal_order_improve_legitimacy_modifier: "Legitimitätserhöhung (Kardinalsbefehl)"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "Auf Befehl seines Oberen arbeitet ein Kardinal daran, die Legitimität der Herrscher in der örtlichen Erzdiözese zu fördern."
 pam_cardinal_order_undermine_legitimacy_modifier: "Legitimität untergraben (Kardinalsbefehl)"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "Auf Befehl seines Oberen arbeitet ein Kardinal daran, die Legitimität der Herrscher in der örtlichen Erzdiözese zu untergraben."
 heathen_mandate_modifier: "Heiden predigen Legitimität"
 heathen_mandate_modifier_desc: "Die Götzendiener eines heidnischen Herrschers beanspruchen die Seelen dieses Landes, und ihre abscheulichen Ansprüche werden durch ihren falschen Glauben gedeckt."
 pam_recently_baptized_at_domicile_modifier: "Unlängst getauft"
 pam_recently_baptized_at_domicile_modifier_desc: "Dieser Charakter wurde im Baptisterium der Kathedralenanlage der eigenen Erzdiözese getauft."
 pam_khachkar_ancestral_county: "Ahnen-Chatschkar"
 pam_khachkar_ancestral_county_custom_desc: "Aufgestellt für: [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstName] (durch [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)])"
 pam_denied_new_pope_modifier: "Lehnte den neuen Papst ab"
 pam_denied_new_pope_modifier_desc: "Dieser Charakter weigerte sich, den neu gewählten Papst anzuerkennen."
 # Veneration of Saints (Dulia) - relic blessings (one is rolled onto each relic drawn by a Dulia faith)
 pam_dulia_relic_piety_level_impact_modifier: "Gesegnetes Ansehen"
 pam_dulia_relic_piety_per_dread_modifier: "Aura des Märtyrers"
 pam_dulia_relic_piety_per_knight_modifier: "Segen der Schar"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Tröstende Gnade"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Gesalbt von Heiligen"
 pam_dulia_relic_learning_per_piety_modifier: "Erleuchtete Hingabe"
 pam_dulia_relic_monthly_piety_modifier: "Urquell der Gnade"
 # Ecumenical Council rite quarrels
 pam_ecumenical_council_creed_arbiter_modifier: "Schlichter des Bekenntnisses"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "Dieser Charakter schlichtete einen Streit über den Wortlaut des Bekenntnisses, noch ehe das ökumenische Konzil überhaupt seine Debatten eröffnen konnte."
 pam_ecumenical_council_primacy_upheld_modifier: "Aufrechterhaltener Primat"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "Dieser Charakter wurde im offenen Konzil gefragt, welcher Obrigkeit die Kirchen des Glaubens Rechenschaft schulden, und legte die Frage vom Stuhl aus bei."
 # Veneration of Saints (Dulia) - shared by the whole faith for a few years after each canonization
 pam_dulia_new_saint_modifier: "Ein neuer Fürsprecher"
 pam_dulia_new_saint_modifier_desc: "Dieser Charakter ist inspiriert von der jüngsten Verkündung eines neuen Heiligen."
 # The Pentarchy - granted for completing a pilgrimage to every holy site of one's own faith
 pam_pilgrim_of_every_holy_site_modifier: "Pilger aller Sitze"
 pam_pilgrim_of_every_holy_site_modifier_desc: "Dieser Charakter hielt Wacht an allen heiligen Stätten, die der eigene Glaube anerkennt."
 # Harmonious Society - one instance for each of the five relationships currently kept in good standing
 tenet_harmonious_society_five_bonds_modifier: "Ein gewahrtes Band"
 tenet_harmonious_society_five_bonds_modifier_desc: "Herrscher und Untertäniger, Elternteil und Kind, Ehemann und Ehefrau, Älterer und Jüngerer, Freund und Freund. Dieser Charakter hält diese fünf Beziehungen in guter Ordnung."
 # Apostolic Succession - scales with the ruler's theocratic vassals, retallied yearly
 tenet_apostolic_succession_episcopate_modifier: "Ordinationskette"
 tenet_apostolic_succession_episcopate_modifier_desc: "Dieser Charakter gehört zu einem Glauben, in dem jeder Bischof von einem ordiniert wurde, der wiederum von einem ordiniert wurde, was ihn mit Legitimität erfüllt."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Erhöhung pro [Concept('theocratic_vassal','theokratischem Vasall')|E] (max. [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 # Divine Liturgy - scales with the temples the character holds, retallied yearly
 tenet_divine_liturgy_choirs_modifier: "Chöre der Gläubigen"
 tenet_divine_liturgy_choirs_modifier_desc: "In jeder Kirche, die dieser Charakter hält, werden dieselben Worte zu denselben Zeiten gesungen, und zwar schon seit der Zeit vor der Geburt der heute Lebenden."
 modifier_definition_value_per_held_temple: "\t#weak Erhöhung pro gehaltenem [temple_holding|E] (max. [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 # Divine Liturgy personal tenet - scales with the court chaplain's learning, retallied yearly
 tenet_divine_liturgy_officiant_modifier: "Würdig abgehalten"
 tenet_divine_liturgy_officiant_modifier_desc: "Dieser Charakter nimmt die Göttliche Liturgie des eigenen Glaubens außerordentlich ernst."
 tenet_divine_liturgy_schola_cantorum_modifier: "Schola Cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "Ein Lehnsherr, der eine Schule des heiligen Sangs unterhält, hat einen Liturgen, den es sich zu hören lohnt."
 tenet_pentarchy_holy_site_modifier: "Patriarchatssitz"
 tenet_pentarchy_holy_site_modifier_desc: "Die heilige Stätte dieser Gemeinde gedeiht unter der Verwaltung der Gläubigen."
 tenet_polyamory_new_beloved_modifier: "Erstrahlt mit neuer Liebe"
 tenet_polyamory_new_beloved_modifier_desc: "Durch eine neue Liebe wandelt dieser Charakter wie auf Wolken."
 modifier_definition_value_per_chaplain_learning: "\t#weak Erhöhung pro [learning|E] des [Concept('court_chaplain','Ratspredigers')|E] (max. [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 # Purgatory - one instance for each sinful trait the character currently carries
 tenet_purgatory_sin_penalty_modifier: "Geschuldete Strafe"
 tenet_purgatory_sin_penalty_modifier_desc: "Eine gebeichtete Sünde ist eine vergebene Sünde, doch die dafür geschuldete Strafe wird dadurch nicht getilgt. Was in diesem Leben nicht beglichen wird, wird im Jenseits eingefordert, und die Gläubigen erkennen deutlich, welchen der beiden Wege diese Person wählte."
 tenet_original_sin_sinners_insight_modifier: "Einblicke eines Sünders"
 tenet_original_sin_sinners_insight_modifier_desc: "Wer auch immer die Last der Sünden trägt, weiß genau, wo sie sich in anderen versteckt."
 # Holy weapons - each tier is earned by winning further battles against another religion while equipped
 pam_holy_weapon_1_artifact_modifier: "Feuergetauft"
 pam_holy_weapon_1_artifact_modifier_desc: "Diese [holy_relic|E] wurde zum Sieg gegen die Feinde des [Concept('faith', 'Glaubens')|E] getragen. Die Frommen sind darauf aufmerksam geworden."
 pam_holy_weapon_2_artifact_modifier: "Bewährt im Krieg"
 pam_holy_weapon_2_artifact_modifier_desc: "Es wurden so viele Schlachten gegen andere [religions|E] gewonnen, dass die Gläubigen es nicht mehr nur Glück nennen."
 pam_holy_weapon_3_artifact_modifier: "Bekannte Reliquie"
 pam_holy_weapon_3_artifact_modifier_desc: "Ihr Name eilt ihr voraus. Die Eifrigen fassen sich ein Herz bei ihrem Anblick."
 pam_holy_weapon_4_artifact_modifier: "Werkzeug der Vorsehung"
 pam_holy_weapon_4_artifact_modifier_desc: "Wer auch immer dies vor sich herträgt, dem sagt man nach, er vollstrecke den Willen Gottes, und jene, die neben ihm reiten, kämpfen daher umso härter."
 # Challenge Head of Faith war aftermath
 pam_house_schismatic_sponsor_modifier: "Schisma-Gönner"
 pam_house_schismatic_sponsor_modifier_desc: "Dieses Haus unterstützte ein gescheitertes [challenger_hof|E]."
 pam_house_martyred_pontiff_modifier: "Haus-Märtyrer"
 pam_house_martyred_pontiff_modifier_desc: "Ein Mitglied dieses Hauses starb nach einem Krieg um das [head_of_faith|E]."
 pam_deposed_pontiff_modifier: "Abgesetztes Glaubensoberhaupt"
 pam_deposed_pontiff_modifier_desc: "Dieser Charakter wurde als [head_of_faith|E] abgesetzt."
 pam_ch_hof_sacred_bloodguilt_modifier: "Blutschuld"
 pam_ch_hof_sacred_bloodguilt_modifier_desc: "Dieser Charakter tötete jemanden in einem Krieg um das [head_of_faith|E]."
 pam_ch_hof_penitent_road_modifier: "Bußeschwur"
 pam_ch_hof_penitent_road_modifier_desc: "Dieser Charakter schwor, Buße zu tun, nachdem in einem Krieg um das [head_of_faith|E] über ihn geurteilt wurde."
