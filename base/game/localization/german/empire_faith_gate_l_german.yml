 dissolve_empire_war_defeat_desc: "Die versuchte Auflösung des [Concept('empire', 'Großreichs')|E] schlug fehl."
 dissolve_empire_war_defeat_desc_attacker: "Unsere versuchte Auflösung des [Concept('empire', 'Großreichs')|E] schlug fehl. Wir tragen die Konsequenzen."
 dissolve_empire_war_defeat_desc_defender: "Die versuchte Auflösung des [Concept('empire', 'Großreichs')|E] wurde abgewehrt."
 dissolve_empire_war_invalidated_no_excommunication: "Der Verteidiger ist nicht länger [excommunicated|El]."
 dissolve_empire_war_invalidated_no_empire: "Der Verteidiger hält keinen [empire|E]-[title|E] mehr."
 game_concept_dissolve_empire_casus_belli: "$dissolve_empire_war$"
 game_concept_dissolve_empire_casus_belli_desc: "Ein [casus_belli|E], der es einem [ruler|E] desselben [Concept('faith', 'Glaubens')|E] erlaubt, einem [Concept('excommunicated', 'exkommunizierten')|E] [emperor|E] den [war|E] zu erklären, um dessen [empire|E]-[title|E] bei einem Sieg zu vernichten."
 multi_empire_same_faith_penalty_1: "Umkämpfte Vorherrschaft"
 multi_empire_same_faith_penalty_1_desc: "Ein anderer [emperor|E] desselben [Concept('faith', 'Glaubens')|E] stellt die Vorherrschaft unseres [Concept('empire', 'Großreichs')|E] infrage"
 multi_empire_same_faith_penalty_2: "Herausgeforderte Vorherrschaft"
 multi_empire_same_faith_penalty_2_desc: "Mehrere [emperor|E] desselben [Concept('faith', 'Glaubens')|E] stellen die Vorherrschaft unseres [Concept('empire', 'Großreichs')|E] infrage"
 multi_empire_same_faith_penalty_3: "Geteilte Vorherrschaft"
