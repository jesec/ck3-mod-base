 action_efg_request_excommunication: "@hof_icon! Es gibt zu viele Großreiche Eures Glaubens"
 action_efg_request_excommunication_label: "@hof_icon! Es gibt zu viele Großreiche Eures Glaubens"
 action_efg_request_excommunication_desc: "[recipient.GetShortUIName|U] regiert ein rivalisierendes [empire|E] Eures [Concept('faith', 'Glaubens')|E] und stellt damit Euren Anspruch infrage, der einzig wahre [emperor|E] zu sein.\n\n#help Bittet [secondary_recipient.GetShortUIName], Euer [head_of_faith|E], darum, [recipient.Custom('DE_PRO_PER_S_3P_A')] zu exkommunizieren. Ein [Concept('excommunicated', 'exkommunizierter')|E] Kaiser kann mit dem [casus_belli|E] „[dissolve_empire_casus_belli|E]“ angegriffen werden, wodurch sich sein [empire|E] zerstören lässt.#!"
 action_efg_request_excommunication_click: "#I Klicken, um $request_excommunication_interaction$ zu öffnen#!"
 action_efg_request_excommunication_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')] [recipient.GetShortUINameNoTooltip]"
 action_efg_request_excommunication_combined_group_name: "@hof_icon! Es gibt zu viele Großreiche Eures Glaubens"
 action_efg_request_excommunication_combined_group_label: "@hof_icon! Es gibt zu viele Großreiche Eures Glaubens"
 action_efg_request_excommunication_combined_group_description: "Mehrere rivalisierende [emperors|E] Eures [Concept('faith', 'Glaubens')|E] stellen Euren Anspruch infrage, der einzig wahre [emperor|E] zu sein.\n\n#help Bittet [secondary_recipient.GetShortUIName], Euer [head_of_faith|E], darum, sie zu exkommunizieren. Ein [Concept('excommunicated', 'exkommunizierter')|E] Kaiser kann mit dem [casus_belli|E] „[dissolve_empire_casus_belli|E]“ angegriffen werden, wodurch sich sein [empire|E] zerstören lässt.#!"
 empire_faith_gate_panel_organized_faith: "Ihr gehört zu einem [Concept('organized', 'organisierten')|E] [Concept('faith', 'Glauben')|E]"
 empire_faith_gate_panel_hof_approval: "Ihr habt die Unterstützung des [Concept('head_of_faith', 'Glaubensoberhaupts')|E]"
 empire_faith_gate_panel_vassals_approve: "Ein Großteil Eurer [Concept('powerful_vassals', 'mächtigen Vasallen')|E] unterstützt Euch"
 empire_faith_gate_reformation_piety_level: "[piety_level|E] muss mindestens [GetModifier('piety_level_2').GetNameWithTooltip|L] sein"
 empire_faith_gate_reformation_tribal_authority: "Muss $game_concept_absolute_tribal_authority$ haben"
 empire_faith_gate_reformation_holy_site: "Mindestens drei [holy_sites|E] werden von Charakteren dieses [Concept('faith', 'Glaubens')|E] gehalten"
 empire_faith_gate.0002.t: "Der wahre Kaiser"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetShortUIName] beansprucht die Kaiserwürde, die mir allein zusteht. Wenn ich das so stehen lasse, werden die Gläubigen bald meine [legitimacy|E] infrage stellen."
 empire_faith_gate.0002.a: "Sagt es allen weiter: [efg_primary_rival.Custom('DE_PRO_POS_S_3P')|U] Großreich wird meines nicht überdauern."
 empire_faith_gate.0002.b: "Unser Glaube kennt nur einen wahren Kaiser: mich."
 empire_faith_gate.0002.c: "Ich schlage zu, wenn die rechte Zeit kommt."
 efg_contested_wrath: "Ritterliche Propaganda"
 efg_contested_wrath_desc: "Der Einsatz unserer Ritter zur Verkündung unserer kaiserlichen Legitimität gegenüber einem rivalisierenden Kaiser treibt unsere Krieger an und bringt uns den Respekt der Massen ein."
 efg_divine_mandate: "Göttliche Ansprüche"
 efg_divine_mandate_desc: "Nachdem wir eine göttliche Autorität über alle irdischen Rivalen verkündete, sammeln sich die Gläubigen hinter uns."
 efg_contested_patience: "Geduldige Konsolidierung"
 efg_contested_patience_desc: "Wenn wir unsere Aufmerksamkeit nach innen richten, wird unser Reich stärker, während wir auf den richtigen Augenblick zum Zuschlagen warten."
