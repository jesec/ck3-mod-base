 dissolve_empire_war_desc: "Krieg erklären, um das [empire|E] eines [Concept('excommunicated', 'exkommunizierten')|E] [Concept('ruler', 'Herrschers')|E] unseres [Concept('faith', 'Glaubens')|E] aufzulösen."
 dissolve_empire_war_victory_desc: "Der [Concept('excommunicated', 'exkommunizierte')|E] [|emperor|E] wird seines [empire|E]-[Concept('title', 'Titels')|E] beraubt, der zerstört wird."
 dissolve_empire_war_victory_desc_defender: "Das [empire|E] wurde aufgelöst. Der [empire|E]-[title|E] wird zerstört."
 dissolve_empire_war_white_peace_desc: "Der Krieg endet unentschieden. Keine Seite erlangt einen Vorteil."
