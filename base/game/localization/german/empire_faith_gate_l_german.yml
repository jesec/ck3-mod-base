l_german:
 rule_empire_faith_gate: "Großreichstitel eingeschränkt durch organisierten Glauben"
 setting_empire_faith_gate_on: "#high Aktiviert#!"
 setting_empire_faith_gate_no_hof_exempt: "#high Aktiviert#!, Oberhauptsbefreiung"
 setting_empire_faith_gate_off: "Deaktiviert"
 setting_empire_faith_gate_on_desc: "Für die Schaffung von [empire|E]-[Concept('titles','Titeln')|E] ist ein [Concept('organized', 'organisierter')|E] [faith|E] sowie die Zustimmung des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] nötig. Betrifft [feudal|E]-, [clan|E]- und [Concept('tribal', 'Stammes')|E]-[rulers|E]."
 setting_empire_faith_gate_no_hof_exempt_desc: "Für die Schaffung von [empire|E]-[Concept('titles','Titeln')|E] ist ein [Concept('organized', 'organisierter')|E] [faith|E] sowie die Zustimmung des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] nötig, aber [faiths|E] ohne ein [head_of_faith|E] sind von der Zustimmungsanforderung befreit. Betrifft [feudal|E]-, [clan|E]- und [Concept('tribal', 'Stammes')|E]-[rulers|E]."
 setting_empire_faith_gate_off_desc: "[empire|E]-[titles|E] können mit den üblichen Anforderungen geschaffen werden."
 empire_faith_gate_organized_faith_required: "Euer [faith|E] muss [organized|El] sein, um ein [empire|E] zu schaffen"
 empire_faith_gate_hof_spiritual_good_terms: "Muss sich mit dem [head_of_faith|E] gut gestellt haben"
 empire_faith_gate_hof_temporal_is_hof: "Ihr seid das [head_of_faith|E]"
 empire_faith_gate_hof_temporal_good_terms: "[head_of_faith|E] muss eine gute Meinung von Euch haben"
 empire_faith_gate_powerful_vassals_approve: "Ein Großteil der [Concept('powerful_vassals', 'mächtigen Vasallen')|E] muss eine positive [opinion|E] von Euch haben #weak ([THIS.Char.MakeScope.ScriptValue('powerful_vassals_positive_opinion_value')|0]/[THIS.Char.MakeScope.ScriptValue('powerful_vassals_count_value')|0])#!"
 empire_faith_gate_contested_legitimacy_applied: "Umstrittenes Großreich"
 empire_faith_gate_contested_legitimacy_applied_desc: "[empires|E] von [THIS.Char.GetShortUIName|U] und [SCOPE.sC('efg_other_emperor').GetShortUIName] streiten nun um die Vorherrschaft."
 empire_faith_gate_create_title_contested_warning_1: "@warning_icon! #warning Die Schaffung dieses [Concept('empire', 'Großreichs')|E] gewährt Euch in 3 Jahren den [modifier|E] „[GetModifier('multi_empire_same_faith_penalty_1').GetNameWithTooltip|L]“, da es schon ein anderes unabhängiges [empire|E] Eures [Concept('faith', 'Glaubens')|E] gibt.#!"
 empire_faith_gate_create_title_contested_warning_2: "@warning_icon! #warning Die Schaffung dieses [Concept('empire', 'Großreichs')|E] gewährt Euch in 3 Jahren den [modifier|E] „[GetModifier('multi_empire_same_faith_penalty_2').GetNameWithTooltip|L]“, da es schon mehrere andere unabhängige [empires|E] Eures [Concept('faith', 'Glaubens')|E] gibt.#!"
 empire_faith_gate_create_title_contested_warning_3: "@warning_icon! #warning Die Schaffung dieses [Concept('empire', 'Großreichs')|E] gewährt Euch in 3 Jahren den [modifier|E] „[GetModifier('multi_empire_same_faith_penalty_3').GetNameWithTooltip|L]“, da es schon mehrere andere unabhängige [empires|E] Eures [Concept('faith', 'Glaubens')|E] gibt.#!"
