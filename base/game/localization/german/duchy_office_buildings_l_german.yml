 building_type_court_of_the_towns_01_desc: "Jede Stadt entsendet ihre eigenen Vertreter zu diesem Gericht, die einen versiegelten Brief mit sich führen, in dem genau festgelegt ist, wozu sie sich verpflichten dürfen – und zu nichts anderem."
