 building_type_survey_office_01_desc: "Vermesser dieses Amtes durchstreifen die Felder des Herzogtums mit Seilen und Messstäben und vermessen jeden Streifen, damit er entsprechend seinem tatsächlichen Ertrag besteuert werden kann."
