 ### Staple District ###
 building_type_staple_district_01: "Herzogliche Handelsstelle"
 building_type_staple_district_01_desc: "Jeder an dieser herzoglichen Handelsstelle verkaufte Ballen wird gewogen und mit einem Siegel versehen. Waren ohne Siegel, die im Herzogtum an anderer Stelle aufgefunden werden, werden sofort beschlagnahmt."
