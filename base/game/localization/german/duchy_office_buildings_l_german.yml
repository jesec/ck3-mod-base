 ### Bailiwick District ###
 building_type_bailiwick_01: "Balleigericht"
 building_type_bailiwick_01_desc: "Jeder vor diesem Balleigericht verhandelte Fall wird in dessen Akten vermerkt. So kann der Ballei einen Streit um ein Feld beilegen, indem er vorliest, wie vor Jahrzehnten über einen ähnlichen Fall entschieden wurde."
