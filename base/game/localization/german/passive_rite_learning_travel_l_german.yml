l_german:
 msg_passive_learned_tenet_abroad_desc: "Durch Beobachtung von [passive_learn_source.GetTitledFirstName] vom [passive_learn_source.GetRite.GetName] in [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] erlangtet Ihr [agnostic_knowledge|E] über einen [core_tenet|E] ([passive_learn_tenet.GetBaseName])."
 msg_passive_learned_doctrine_abroad_desc: "Durch Beobachtung von [passive_learn_source.GetTitledFirstName] vom [passive_learn_source.GetRite.GetName] in [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] erlangtet Ihr [agnostic_knowledge|E] über eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_source.GetFaith.Self)])."
 msg_passive_learned_rite_abroad_desc: "Durch [passive_learn_source.GetTitledFirstNameNoTooltip] erlangtet Ihr [agnostic_knowledge|E] über die [core_tenets|E] und [doctrines|E] des [passive_learn_source.GetRite.GetAdjective|l]en [rite|E]."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "In [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] erlangtet Ihr [agnostic_knowledge|E] über einen der [Concept('core_tenet', 'Grundsätze')|E] ([passive_learn_tenet.GetBaseName]) des [passive_learn_rite.GetAdjective|l]en [rite|E]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "In [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] erlangtet Ihr [agnostic_knowledge|E] über eine [doctrine|E] ([passive_learn_doctrine.GetDescriptiveName(passive_learn_rite.GetFaith.Self)]) des [passive_learn_rite.GetAdjective|l]en [rite|E]."
 rite_travel_events.1000.t: "Ein reisender [passive_learn_rite.GetAdherentNameNoTooltip]"
 rite_travel_events.1000.desc: "Die Dämmerung setzt ein, und ein reisender [passive_learn_rite.GetAdherentName] schließt sich uns am Feuer an.\n\nIm Laufe des Abends teilen wir [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')] und Geschichten. Er spricht von den heiligen Lehren seines Volks und wie man den [passive_learn_rite.GetNameNoTooltip] lebt und praktiziert. In jedem Wort liegt tiefe Überzeugung."
 rite_travel_events.1000.a: "Äußerst aufschlussreich."
 rite_travel_events.1000.b: "[passive_learn_source.Custom('DE_PRO_PER_S_3P_N')|U] sollte sich mir anschließen."
 rite_travel_events.1000.c: "Ich will solche Ketzerei gar nicht hören."
 rite_travel_events.2000.t: "Offenbarung"
 rite_travel_events.2000.desc: "Während ich die Landschaft ([location.GetTerrain.GetNameNoTooltip]) von [location.GetName] bereise, treffe ich auf eine Menschenmenge.\n\nEin Prediger spricht über etwas, was er „[passive_learn_tenet.GetBaseName]“ nennt. Ich habe noch nie davon gehört, doch [passive_learn_source.Custom('DE_PRO_POS_S_3P')]e Worte fühle ich.\n\nIch will vorbeigehen, doch stattdessen höre ich zu.\n\nDies … Dies ist wahr."
 rite_travel_events.2000.a: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) erwartet dies von mir."
 rite_travel_events.2000.b: "Ich bin [Select_CString(ROOT.Char.IsFemale, 'keine Heidin', 'kein Heide')]!"
