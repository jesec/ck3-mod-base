 generic_tenet_focus_tenet_asceticism: "[GetTenetType('tenet_asceticism').GetName(GetPlayer.GetRite)]: Strebt nach Heiligkeit durch Entsagung, Disziplin und das geduldige Meistern des Verlangens."
 generic_tenet_focus_tenet_bhakti: "[GetTenetType('tenet_bhakti').GetName(GetPlayer.GetRite)]: Legt seinen Schwerpunkt auf die Hingabe von Herzen. Lehrt, dass die liebevolle Unterwerfung die Seele dem Göttlichen näherbringt."
 generic_tenet_focus_tenet_dharmic_pacifism: "[GetTenetType('tenet_dharmic_pacifism').GetName(GetPlayer.GetRite)]: Schätzt die Harmlosigkeit und die Selbstbeherrschung, wobei Frieden als höhere Disziplin als der Zorn gilt."
 generic_tenet_focus_tenet_inner_journey: "[GetTenetType('tenet_inner_journey').GetName(GetPlayer.GetRite)]: Blickt nach innen und strebt nach der Erweckung durch Reflexion, Disziplin und die Verwandlung des Selbst."
 generic_tenet_focus_tenet_ritual_hospitality: "[GetTenetType('tenet_ritual_hospitality').GetName(GetPlayer.GetRite)]: Behandelt Gastfreundschaft als sakrale Pflicht, die Gastgeber und Gast in einem heiligen Brauch verbindet."
 generic_tenet_focus_tenet_adorcism: "[GetTenetType('tenet_adorcism').GetName(GetPlayer.GetRite)]: Macht Geistern durch Verehrung den Hof, wobei man darauf hofft, ihre Gunst zu gewinnen und ihren Zorn abzuwenden."
 generic_tenet_focus_tenet_ancestor_worship: "[GetTenetType('tenet_ancestor_worship').GetName(GetPlayer.GetRite)]: Wendet sich an die geehrten Toten, um Führung, Segen und Beständigkeit für die Lebenden zu erlangen."
 generic_tenet_focus_tenet_astrology: "[GetTenetType('tenet_astrology').GetName(GetPlayer.GetRite)]: Sieht tiefere Bedeutung im Himmel, wobei man darauf vertraut, dass die Sterne die Ordnung, das Schicksal und die rechte Zeit offenbaren."
 generic_tenet_focus_tenet_hedonistic: "[GetTenetType('tenet_hedonistic').GetName(GetPlayer.GetRite)]: Begrüßt das Feiern, Ausschweifungen und die Heiligung der Freuden in der gemeinschaftlichen Verehrung."
 generic_tenet_focus_tenet_human_sacrifice: "[GetTenetType('tenet_human_sacrifice').GetName(GetPlayer.GetRite)]: Blutopfer sind ein furchteinflößender, aber heiliger Austausch zwischen dem Sterblichen und dem Göttlichen."
 generic_tenet_focus_tenet_mystical_birthright: "[GetTenetType('tenet_mystical_birthright').GetName(GetPlayer.GetRite)]: Das Schicksal mancher Seelen ist schon von Geburt an für heilige Macht und spirituelle Größe auserkoren."
 generic_tenet_focus_tenet_ritual_celebrations: "[GetTenetType('tenet_ritual_celebrations').GetName(GetPlayer.GetRite)]: Erhebt gemeinschaftliche Feiern und heilige Feste zur höchsten Form der Verehrung."
 generic_tenet_focus_tenet_sacred_childbirth: "[GetTenetType('tenet_sacred_childbirth').GetName(GetPlayer.GetRite)]: Erfüllt die Geburt mit Ehrerbietung, wobei Mutterschaft und neues Leben als Akte von heiliger Bedeutung gelten."
 generic_tenet_focus_tenet_sanctity_of_nature: "[GetTenetType('tenet_sanctity_of_nature').GetName(GetPlayer.GetRite)]: Findet das Heilige in der lebendigen Welt; Wachstum, Fruchtbarkeit und die ungezähmte Schöpfung werden verehrt."
 generic_tenet_focus_tenet_sun_worship: "[GetTenetType('tenet_sun_worship').GetName(GetPlayer.GetRite)]: Ehrt die Sonne als lebensspendendes Zeichen für Ordnung, Strahlkraft und göttliche Gunst."
 generic_tenet_focus_tenet_warmonger: "[GetTenetType('tenet_warmonger').GetName(GetPlayer.GetRite)]: Verherrlicht Eroberung und kriegerisches Können und von den Gläubigen wird erwartet, dass sie sich im Krieg beweisen."
 generic_tenet_focus_tenet_gruesome_festivals: "[GetTenetType('tenet_gruesome_festivals').GetName(GetPlayer.GetRite)]: Ergeht sich in schrecklichen Feiern, bei denen Angst, Blut und Spektakel zu heiligen Zurschaustellungen werden."
 generic_tenet_focus_tenet_cthonic_redoubts: "[GetTenetType('tenet_cthonic_redoubts').GetName(GetPlayer.GetRite)]: Verehrt die Höhen und die verborgenen Festungen der Erde als Orte ungewöhnlicher Heiligkeit."
 generic_tenet_focus_tenet_household_gods: "[GetTenetType('tenet_household_gods').GetName(GetPlayer.GetRite)]: Dreht sich um das Heim – Herd, Familie und tägliche Gebete werden von höheren Mächten behütet."
 generic_tenet_focus_tenet_sinitic_syncretism: "[GetTenetType('tenet_sinitic_syncretism').GetName(GetPlayer.GetRite)]: Verflicht die eigenen Traditionen mit chinesischem Denken, um Harmonie anstelle von Brüchen zu schaffen."
 generic_tenet_focus_tenet_eastern_syncretism: "[GetTenetType('tenet_eastern_syncretism').GetName(GetPlayer.GetRite)]: Nimmt bereitwillig östliche Lehren auf und sieht fremde Weisheiten als Nachhall heiliger Wahrheiten."
 generic_tenet_focus_tenet_unreformed_syncretism: "[GetTenetType('tenet_unreformed_syncretism').GetName(GetPlayer.GetRite)]: Beruft sich freimütig auf ältere Praktiken und vereint uralte Gebräuche zu einem neuen heiligen Ganzen."
 generic_tenet_focus_tenet_christian_syncretism: "[GetTenetType('tenet_christian_syncretism').GetName(GetPlayer.GetRite)]: Deutet christliche Lehren neu, indem sie in einen eigenen heiligen Rahmen eingebunden werden, anstatt sie ganz abzulehnen."
 generic_tenet_focus_tenet_islamic_syncretism: "[GetTenetType('tenet_islamic_syncretism').GetName(GetPlayer.GetRite)]: Bedient sich bei islamischen Glaubensvorstellungen und Bräuchen und findet nützliche Wahrheiten in benachbarten Offenbarungen."
 generic_tenet_focus_tenet_jewish_syncretism: "[GetTenetType('tenet_jewish_syncretism').GetName(GetPlayer.GetRite)]: Nimmt jüdische Traditionen, Gesetze und Erinnerungen in das eigene Verständnis des Heiligen auf."
 generic_tenet_focus_tenet_exaltation_of_pain: "[GetTenetType('tenet_exaltation_of_pain').GetName(GetPlayer.GetRite)]: Betrachtet Schmerz als läuternde, offenbarende Hingabe, die man durch Ausdauer und angenommenes Leiden zeigt."
 generic_tenet_focus_tenet_natural_primitivism: "[GetTenetType('tenet_natural_primitivism').GetName(GetPlayer.GetRite)]: Misstraut dem Zivilisierten und ehrt eine härtere Lebensweise, die den Elementen näher ist."
 generic_tenet_focus_tenet_pursuit_of_power: "[GetTenetType('tenet_pursuit_of_power').GetName(GetPlayer.GetRite)]: Segnet Ehrgeiz und weltliche Meisterschaft, denn Vorherrschaft gilt als Werkzeug des Heiligen."
 generic_tenet_focus_tenet_ritual_cannibalism: "[GetTenetType('tenet_ritual_cannibalism').GetName(GetPlayer.GetRite)]: Vereint den Verzehr von Menschenfleisch mit Tabuverehrung und heiligem Schrecken."
 generic_tenet_focus_tenet_sacred_shadows: "[GetTenetType('tenet_sacred_shadows').GetName(GetPlayer.GetRite)]: Hüllt sich selbst in einen Schleier der Geheimhaltung, sodass Verstecktes, Zwielichtiges und das, was vor vielen verborgen bleibt, als heilig gilt."
 generic_tenet_focus_tenet_polyamory: "[GetTenetType('tenet_polyamory').GetName(GetPlayer.GetRite)]: Segnet die Polyamorie und weigert sich, die heilige Intimität auf einen Bund zu beschränken."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "[GetTenetType('tenet_sacrificial_ceremonies').GetName(GetPlayer.GetRite)]: Stellt das feierliche Opfer in den Mittelpunkt der Anbetung und bindet es an Bund und Gunst."
 generic_tenet_focus_tenet_megaliths: "[GetTenetType('tenet_megaliths').GetName(GetPlayer.GetRite)]: Hält das Heilige in beständigem Stein fest und vertraut darauf, dass Monumente die Erinnerung und die Hingabe verankern."
 generic_tenet_focus_tenet_fp3_fedayeen: "[GetTenetType('tenet_fp3_fedayeen').GetName(GetPlayer.GetRite)]: Heiligt Heimlichkeit, Unterwanderung und selbstaufopfernde Gewalt im Dienst einer höheren Sache."
 generic_tenet_focus_tenet_communal_possessions: "[GetTenetType('tenet_communal_possessions').GetName(GetPlayer.GetRite)]: Spielt eigenen Reichtum herunter und drängt die Gläubigen, ihre Mittel gemeinsam zu nutzen."
 generic_tenet_focus_tenet_pure_land: "[GetTenetType('tenet_pure_land').GetName(GetPlayer.GetRite)]: Legt seine Hoffnung auf ein gesegnetes Reich jenseits des Leidens, das man durch Vertrauen, Erinnerung und Hingabe erreichen kann."
 generic_tenet_focus_tenet_no_mind: "[GetTenetType('tenet_no_mind').GetName(GetPlayer.GetRite)]: Strebt nach Klarheit durch das Begreifen von Gedanken, die das Selbst hin zu einem leeren Bewusstsein führen."
 generic_tenet_focus_tenet_mountain_worship: "[GetTenetType('tenet_mountain_worship').GetName(GetPlayer.GetRite)]: Hohe Orte gelten als dem Himmlischen näher, sodass Gipfel und Hocherhobenes zu Gegenständen der Verehrung werden."
 generic_tenet_focus_tenet_extinction_of_dharma: "[GetTenetType('tenet_extinction_of_dharma').GetName(GetPlayer.GetRite)]: Die Welt ist überlaufen von Verderbnis, was unbarmherzige Gewalt zur Verteidigung der Wahrheit erlaubt."
 generic_tenet_focus_tenet_cranial_trophies: "[GetTenetType('tenet_cranial_trophies').GetName(GetPlayer.GetRite)]: Behandelt die Überreste der Feinde als heilige Belege für den eigenen Triumph und eine schaurige Form des Ansehens."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "[GetTenetType('tenet_pursuit_of_knowledge').GetName(GetPlayer.GetRite)]: Erhebt das Lernen zu einem heiligen Werk und strebt durch Studium, Debatte und disziplinierte Forschung nach Wahrheit."
 generic_tenet_focus_tenet_benevolent_governance: "[GetTenetType('tenet_benevolent_governance').GetName(GetPlayer.GetRite)]: Bemisst Heiligkeit in Teilen durch gerechte Herrschaft, ordentliche Verwaltung und Sorge für das Reich."
 generic_tenet_focus_tenet_filial_piety: "[GetTenetType('tenet_filial_piety').GetName(GetPlayer.GetRite)]: Lehrt, dass die Verehrung von Eltern und Älteren die Grundlage der moralischen und heiligen Ordnung ist."
 generic_tenet_focus_tenet_harmonious_society: "[GetTenetType('tenet_harmonious_society').GetName(GetPlayer.GetRite)]: Schätzt Ausgewogenheit, Anstand und gesellschaftliche Harmonie als Spiegel der kosmischen Ordnung."
 generic_tenet_focus_tenet_sacred_destruction: "[GetTenetType('tenet_sacred_destruction').GetName(GetPlayer.GetRite)]: Sieht heilige Zerstörung als eine Läuterung an, die aus Ruinen ein Werkzeug der Erneuerung macht."
 generic_tenet_focus_tenet_preservation: "[GetTenetType('tenet_preservation').GetName(GetPlayer.GetRite)]: Preist Ausdauer, Beständigkeit und die sorgfältige Bewahrung dessen, was einem anvertraut wurde."
 generic_tenet_focus_tenet_takamin: "[GetTenetType('tenet_takamin').GetName(GetPlayer.GetRite)]: Bringt Bären und verwandten Mächten der Wildnis Verehrung, Ehrfurcht und sorgsamen Respekt entgegen."
 generic_tenet_focus_tenet_peace_of_god: "[GetTenetType('tenet_peace_of_god').GetName(GetPlayer.GetRite)]: Strebt danach, Gewalt einzuschränken, und legt heilige Grenzen dafür fest, wann Blut rechtmäßig vergossen werden kann."
 generic_tenet_focus_tenet_dulia: "[GetTenetType('tenet_dulia').GetName(GetPlayer.GetRite)]: Ehrt Heilige und heilige Vorbilder, indem man sich ihrer erinnert, ohne sie aber mit dem Göttlichen gleichzusetzen."
 generic_tenet_focus_tenet_transubstantiation: "[GetTenetType('tenet_transubstantiation').GetName(GetPlayer.GetRite)]: Behandelt die meisten Mysterien als etwas wahrhaft Transformatives, was Sakramente zu einem zentralen Teil der göttlichen Präsenz macht."
 generic_tenet_focus_tenet_ora_et_labora: "[GetTenetType('tenet_ora_et_labora').GetName(GetPlayer.GetRite)]: Vereint Hingabe und Arbeit, denn ehrliche Arbeit ist allein schon eine Form der Verehrung."
 generic_tenet_focus_tenet_hyperdulia: "[GetTenetType('tenet_hyperdulia').GetName(GetPlayer.GetRite)]: Bringt der heiligsten Fürsprecherin außergewöhnliche Verehrung entgegen, sodass sie noch über die einfachen Heiligen erhoben wird."
 generic_tenet_focus_tenet_simony: "[GetTenetType('tenet_simony').GetName(GetPlayer.GetRite)]: Nimmt in Kauf, dass heilige Ämter, Patronate und weltlicher Reichtum sich nur schwerlich trennen lassen."
 generic_tenet_focus_tenet_monophysitism: "[GetTenetType('tenet_monophysitism').GetName(GetPlayer.GetRite)]: Verkündet die Einheit des Wesens Christi und verweigert sich scharf der Teilung des Mysteriums Gottes."
 generic_tenet_focus_tenet_acts_of_apostles: "[GetTenetType('tenet_acts_of_apostles').GetName(GetPlayer.GetRite)]: Folgt dem Vorbild der apostolischen Gemeinden früher Christen mit ihrer Wohltätigkeit und dem Leben in einer Gemeinschaft."
 generic_tenet_focus_tenet_purgatory: "[GetTenetType('tenet_purgatory').GetName(GetPlayer.GetRite)]: Lehrt, dass viele Seelen nach dem Tod geläutert werden müssen, ehe sie in die vollkommene Seligkeit übergehen können."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "[GetTenetType('tenet_be_fruitful_and_multiply').GetName(GetPlayer.GetRite)]: Erhebt Familie, Fortpflanzung und das Zeugen oder Gebären von neuem Leben zur heiligen Pflicht."
 generic_tenet_focus_tenet_apostolic_succession: "[GetTenetType('tenet_apostolic_succession').GetName(GetPlayer.GetRite)]: Begründet Autorität mit einer ungebrochenen Weitergabe, die zurück bis zu den Aposteln reicht."
 generic_tenet_focus_tenet_confession: "[GetTenetType('tenet_confession').GetName(GetPlayer.GetRite)]: Schätzt offene Buße und Absolution im Glauben daran, dass ausgesprochene Sünden den Anfang der Heilung darstellen."
 generic_tenet_focus_tenet_original_sin: "[GetTenetType('tenet_original_sin').GetName(GetPlayer.GetRite)]: Betrachtet menschliche Schwäche als etwas Urtümliches und besteht darauf, dass keine Seele unbefleckt in die Welt kommt."
 generic_tenet_focus_tenet_celestial_hierarchy: "[GetTenetType('tenet_celestial_hierarchy').GetName(GetPlayer.GetRite)]: Sieht den Kosmos als in heilige Ränge unterteilt an, sodass die jeweilige Stellung auch einen Platz im göttlichen Entwurf darstellt."
 generic_tenet_focus_tenet_miles_christi: "[GetTenetType('tenet_miles_christi').GetName(GetPlayer.GetRite)]: Macht die Gläubigen zu heiligen Kriegern, die aufgerufen sind, die Wahrheit mit diszipliniertem Eifer zu verbreiten."
 generic_tenet_focus_tenet_scholasticism: "[GetTenetType('tenet_scholasticism').GetName(GetPlayer.GetRite)]: Schärft den Glauben durch Argumentationen, Kommentare und die Versöhnung von Vernunft und Glauben."
 generic_tenet_focus_tenet_adoptionism: "[GetTenetType('tenet_adoptionism').GetName(GetPlayer.GetRite)]: Betont die Erhabenheit und Stellung als Gottes Sohn dergestalt, dass eine ewige Unterscheidung heruntergespielt wird."
 generic_tenet_focus_tenet_love_thy_neighbour: "[GetTenetType('tenet_love_thy_neighbour').GetName(GetPlayer.GetRite)]: Rückt Gnade und nachbarschaftliche Liebe ins Herz des alltäglichen religiösen Lebens."
 generic_tenet_focus_tenet_divine_liturgy: "[GetTenetType('tenet_divine_liturgy').GetName(GetPlayer.GetRite)]: Preist die andächtige Liturgie, denn geordnete Verehrung ist das klarste Fenster zum Göttlichen."
 generic_tenet_focus_tenet_miaphysitism: "[GetTenetType('tenet_miaphysitism').GetName(GetPlayer.GetRite)]: Lehrt die untrennbare Einheit von Göttlichkeit und Menschlichkeit in dem einen Mysterium Christi."
 generic_tenet_focus_tenet_hesychasm: "[GetTenetType('tenet_hesychasm').GetName(GetPlayer.GetRite)]: Strebt nach Einigkeit durch Schweigen, Stille und die innere Wiederholung heiliger Gebete."
 generic_tenet_focus_tenet_anachoresis: "[GetTenetType('tenet_anachoresis').GetName(GetPlayer.GetRite)]: Ehrt den Rückzug aus der Welt und sucht nach Heiligkeit in Einsamkeit, Entbehrung und Abgeschiedenheit."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "[GetTenetType('tenet_mortification_of_the_flesh').GetName(GetPlayer.GetRite)]: Verfolgt Heiligkeit durch körperliche Härte, damit das Fleisch sich spirituellen Zielen beugt."
 generic_tenet_focus_tenet_holy_myron: "[GetTenetType('tenet_holy_myron').GetName(GetPlayer.GetRite)]: Gewährt heiligen Salbungen ein besonderes Gewicht, indem heilige Öle als Siegel göttlicher Vergebung dienen."
 generic_tenet_focus_tenet_khachkar: "[GetTenetType('tenet_khachkar').GetName(GetPlayer.GetRite)]: Segnet behauene Steinkreuze und die Zeit überdauernde Monumente als öffentliche Zeugnisse des Heiligen."
