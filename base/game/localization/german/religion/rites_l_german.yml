 mozarabic_church: "Mozarabismus"
 mozarabic_church_adj: "Mozarabisch"
 mozarabic_church_adherent: "Mozaraber"
 mozarabic_church_adherent_plural: "Mozaraber"
 mozarabic_church_desc: "Als Auswuchs der frühen iberischen Riten bewahrte sich der mozarabische Ritus ein gewisses Maß an Unabhängigkeit von Rom, da die Region jahrhundertelang unter islamischer Herrschaft stand. Dieses Zusammenleben mit anderen Religionen sorgt für eine größere Akzeptanz der Unterschiede zwischen ihnen, als es unter fundamentalistischeren Sekten der Fall ist."
 ambrosian_rite: "Ritus nach ambrosischer Art"
 ambrosian_rite_adj: "Ambrosisch"
 ambrosian_rite_adherent: "Ambrosia-Christ"
 ambrosian_rite_adherent_plural: "Ambrosia-Christen"
 ambrosian_rite_desc: "Der Ritus nach ambrosischer Art, der seit den Tagen seines großen Bischofs, des heiligen Ambrosius, zur Erzdiözese Mailand gehört, pflegt eine eigene Liturgie und Gesang sowie eine theologische Tradition, die das Gedankengut des heiligen Augustinus von Hippo hochhält."
 beneventan_rite: "Ritus nach beneventischer Art"
 beneventan_rite_adj: "Beneventisch"
 beneventan_rite_adherent: "Benevent-Christ"
 beneventan_rite_adherent_plural: "Benevent-Christen"
 beneventan_rite_desc: "Die liturgische Tradition des lombardischen Südens, mit Benevent und der großen Abtei Montecassino als Zentrum, zeichnet sich durch ihren unverwechselbaren Gesang und ihre besonderen Bräuche aus, die sie von der römischen Praxis unterscheiden, welche dem Ritus mit wachsendem Misstrauen begegnet."
 carolingian_christianity: "Karolinger-Christen-Ritus"
 carolingian_christianity_adj: "Karolingisch"
 carolingian_christianity_adherent: "Karolinger"
 carolingian_christianity_adherent_plural: "Karolinger"
 carolingian_christianity_desc: "Diese Form des Christentums entwickelte sich unter der Herrschaft der Karolinger-Dynastie und zeichnet sich durch eine Betonung des Mönchstum und der Missionierung aus."
 byzantine_rite: "Ritus nach griechischer Art"
 byzantine_rite_adj: "Griechisch"
 byzantine_rite_adherent: "Griechen-Christ"
 byzantine_rite_adherent_plural: "Griechen-Christen"
 byzantine_rite_desc: "Das Patriarchat von Konstantinopel ist eines der bedeutendsten Zentren des orthodoxen Christentums, das bekannt für seine reichen theologischen Traditionen und seinen historischen Einfluss ist. Der Ritus nach griechischer Art geht unmittelbar auf das Patriarchat zurück."
 antiochian_rite: "Ritus nach antiochischer Art"
 antiochian_rite_adj: "Antiochisch"
 antiochian_rite_adherent: "Antiocher-Christ"
 antiochian_rite_adherent_plural: "Antiocher-Christen"
 antiochian_rite_desc: "Das Patriarchat von Antiochia ist eine der ältesten christlichen Gemeinden und wurde noch vom Heiligen Petrus und dem Apostel Paulus gegründet. Ihre westsyrische Tradition, die nach Jakob Baradaeus, dem Reorganisator der Kirche, „jakobitisch“ genannt wird, hält an der miaphysitischen Lehre und der alten Liturgie des Heiligen Jakobus fest."
 slavic_rite: "Ritus nach slawischer Art"
 slavic_rite_adj: "Slawisch"
 slavic_rite_adherent: "Slawen-Christ"
 slavic_rite_adherent_plural: "Slawen-Christen"
 slavic_rite_desc: "Dieser von Kyrill und Methodius zum slawischen Volk gebrachte Ritus umfasst Elemente der Byzantiner-Liturgie, die man mittels des glagolitischen Alphabets an die slawischen Sprachen und die slawische Kultur anpasste."
 georgian_rite: "Ritus nach georgischer Art"
 georgian_rite_adj: "Georgisch"
 georgian_rite_adherent: "Georgischer Christ"
 georgian_rite_adherent_plural: "Georgische Christen"
 georgian_rite_desc: "Der georgische Ritus stellt die christliche Tradition Georgiens dar, die sich durch eine getrennte Liturgie, ein eigenes kirchliches Erbe und starke Bande zur orthodoxen östlichen Theologie und deren Praktiken auszeichnet."
 coptic_rite: "Ritus nach koptischer Art"
 coptic_rite_adj: "Koptisch"
 coptic_rite_adherent: "Kopte"
 coptic_rite_adherent_plural: "Kopten"
 coptic_rite_desc: "Die Koptische Kirche, die ihre Ursprünge bis zum Evangelisten Markus zurückverfolgt, ist berühmt für zwei Dinge: als Geburtsstätte des christlichen Mönchstums sowie für ihre lange Tradition, Bildung und Philosophie zu fördern."
 ethiopian_rite: "Ge’ez-Ritus"
 ethiopian_rite_adj: "Ge’ezisch"
 ethiopian_rite_adherent: "Ge’ez-Christ"
 ethiopian_rite_adherent_plural: "Ge’ez-Christen"
 ethiopian_rite_desc: "Im äthiopischen Hochland beheimatet und im Erbe Aksums verwurzelt unterscheidet sich diese alte christliche Tradition von anderen alexandrinischen Kirchen durch die Bewahrung eines umfassenderen Schriftkanons, starke Klostertraditionen sowie einen Bund, der vom salomonischen Königserbe geprägt ist."
 armenian_rite: "Ritus nach apostolischer Art"
 armenian_rite_adj: "Apostolisch"
 armenian_rite_adherent: "Apostole"
 armenian_rite_adherent_plural: "Apostolen"
 armenian_rite_desc: "Nach ihrer Gründung durch die Apostel Bartholomäus und Thaddäus erlebte die Armenische Apostolische Kirche einen regen Zulauf in der Region und geleitete Armenien an jenen Punkt, an dem es zum ersten Staat überhaupt wurde, der das Christentum als seine offizielle Religion annahm."
 apostolic_religious_head_title: "Katholikos"
 apostolic_religious_head_title_plural: "Katholikoi"
 apostolic_religious_head_title_name: "Kirche"
 # Nabi
 nabi: "Nabi-Ritus"
 nabi_adj: "Nabiisch"
 nabi_adherent: "Nabit"
 nabi_adherent_plural: "Nabiten"
 nabi_desc: "Wie im heiligen Koran ausdrücklich dargelegt, bedeutet „Nabi“, ein Auserwählter des Allmächtigen zu sein, um Seine Botschaft zu überbringen und die Menschen an jenen Tag zu erinnern, an dem sie vor Ihn gerufen und für ihre Taten zur Rechenschaft gezogen werden. Dem zentralen Glaubensgrundsatz zufolge war der Prophet Mohammed der Letzte von ihnen."
 # Pre madhabs
 sahabah: "Sahāba-Ritus"
 sahabah_adj: "Sahābaisch"
 sahabah_adherent: "Sahābi"
 sahabah_adherent_plural: "Sahāba"
 sahabah_desc: "Auch bekannt als die „Gefährten Mohammeds“ waren die Sahāba muslimische Anhänger, die den Propheten zu seinen Lebzeiten trafen oder sahen. Die Gefährten spielten eine bedeutende Rolle in den frühen muslimischen Auseinandersetzungen, in der Gesellschaft, bei der Überlieferung der Hadithe sowie in der Staatsführung."
 tabiun: "Tabi’un-Ritus"
 tabiun_adj: "Tabi’unisch"
 tabiun_adherent: "Tabi"
 tabiun_adherent_plural: "Tabi’un"
 tabiun_desc: "Beschrieben als jene Generation von Muslimen, die den Gefährten („Sahāba“) des Propheten Mohammed nachfolgte und somit deren Lehren aus zweiter Hand empfing – noch vor dem Aufkommen der sunnitischen Rechtsschulen in späteren Jahrhunderten."
 # Sunni
 hanafi: "Hanafi-Ritus"
 hanafi_adj: "Hanafitisch"
 hanafi_adherent: "Hanafit"
 hanafi_adherent_plural: "Hanafiten"
 hanafi_desc: "Entwickelt aus den Lehren des Juristen und Theologen Abu Hanifa, der das vernünftige Denken systematisierte, leitet die hanafitische Rechtstheorie Gesetze primär aus dem Koran, der Sunna, dem Gelehrtenkonsens und dem Analogieschluss ab."
 hanbali: "Hanbali-Ritus"
 hanbali_adj: "Hanbalitisch"
 hanbali_adherent: "Hanbalit"
 hanbali_adherent_plural: "Hanbaliten"
 hanbali_desc: "Die hanbalitische Rechtsschule ist die kleinste der vier großen sunnitischen Rechtsschulen des Islam und beruht auf den Lehren von Ahmad ibn Hanbal. Im Gegensatz zu den anderen Schulen lehnen die Hanbaliten die Kodifizierung des Rechts zu einem umfassenden System ab und betonen den Koran sowie die Hadithe als die wichtigsten Quellen."
 maliki: "Maliki-Ritus"
 maliki_adj: "Malikitisch"
 maliki_adherent: "Malikit"
 maliki_adherent_plural: "Malikiten"
 maliki_desc: "Eine der vier bedeutenden Rechtsschulen des sunnitischen Islams. Sie wurde im 8. Jahrhundert von Malik ibn Anas gegründet. Die malikitische Rechtsschule unterscheidet sich von den anderen sunnitischen Rechtsschulen insbesondere durch die Quellen, die sie zur Ableitung der Rechtssprechung heranzieht."
 shafii: "Shafi’i-Ritus"
 shafii_adj: "Shafi’itisch"
 shafii_adherent: "Shafi’it"
 shafii_adherent_plural: "Shafi’iten"
 shafii_desc: "Benannt nach al-Schafi’i – einem muslimischen Gelehrten und Juristen aus dem frühen 9. Jahrhundert, der als „Vater der muslimischen Rechtswissenschaft“ bezeichnet wird. Der Kern des schafi’itischen Denkens besteht darin, dass jede Handlung eines dem Gesetz unterworfenen Gläubigen eine entsprechende Bestimmung im Offenbarungsgesetz, der Scharia, besitzt."
 #Ismaili
 ismaili: "Ismailismus"
 ismaili_adj: "Ismailitisch"
 ismaili_adherent: "Ismailitisch"
 ismaili_adherent_plural: "Ismailiten"
 ismaili_desc: "Ein schiitischer Ritus, der eine Linie wahrer Imame achtet – also jener Menschen, die von göttlichem Wissen durchdrungen und unfehlbar waren –, welche über Isma’il ibn Dscha’far verläuft. Sie sind auch als Siebener bekannt, da Isma’il der siebte Imam nach Mohammed war."
 #Qarmatians
 qarmatian: "Qarmatismus"
 qarmatian_adj: "Qarmatitisch"
 qarmatian_adherent: "Qarmatitisch"
 qarmatian_adherent_plural: "Qarmaten"
 qarmatian_desc: "Ein Zweig des Ismailismus, der Elemente des Zoroastrismus aufgriff. Die Zahl der Imame war durch Gott mit sieben vorherbestimmt, und daher konnte es keine weiteren Imame geben, bis nicht der siebte Imam – Muhammad ibn Isma’il – wiederkehrte, um die Gläubigen anzuleiten."
 #Nizari
 nizari: "Nizarismus"
 nizari_adj: "Nizaritisch"
 nizari_adherent: "Nizaritisch"
 nizari_adherent_plural: "Nizariten"
 nizari_desc: "Ein rationalistischer Ritus, der bei der Auslegung des Korans und der Hadithe die Vernunft betont. Der Imamstatus wird weitervererbt und die Abstammungslinie bis zu Ali zurückverfolgt."
 #Zayidi
 zayidi: "Zaiditen-Ritus"
 zayidi_adj: "Zaiditisch"
 zayidi_adherent: "Zaiditisch"
 zayidi_adherent_plural: "Zaiditen"
 zayidi_desc: "Ein wahrer Imam ist nicht unfehlbar, sondern über seinen Kampf gegen die Verderbnis und das Böse definiert. Dementsprechend definieren sich die Zaiditen wiederum über ihren Glauben daran, dass es sich bei Zaid ibn Ali wegen seines Aufstands gegen die Umayyaden um den rechtmäßigen Anwärter auf das Imamat handelte."
 #Imamism (Twelver)
 imami: "Imamismus"
 imami_adj: "Imamitisch"
 imami_adherent: "Imamitisch"
 imami_adherent_plural: "Imamiten"
 imami_desc: "Imamiten glauben, dass Zwölf Imame dazu ausersehen waren, die Umma anzuführen, und dass der zwölfte Imam – Imam Zaman – auf seine Rückkehr wartet, um die Muslime zum Tag des Jüngsten Gerichts zu geleiten."
 islam_ayatollah: "Ayatollah"
 islam_ayatollah_plural: "Ayatollahs"
 ghulat: "Ichtilafismus"
 ghulat_adj: "Ichtilafistisch"
 ghulat_adherent: "Ichtilafistisch"
 ghulat_adherent_plural: "Ichtilafisten"
 ghulat_desc: "Ichtilafisten glauben an die göttliche Natur der unfehlbaren Imame, deren Linie mit Ali beginnt. Gott hat sie nicht nur ernannt und beflügelt, sondern wohnt ihnen teilweise inne, um sie und damit auch in ihrer Erweiterung die gesamte Umma in ihrem Handeln anzuleiten."
 alawite: "Alawismus"
 alawite_adj: "Alawitisch"
 alawite_adherent: "Alawit"
 alawite_adherent_plural: "Alawiten"
 alawite_desc: "Die religiösen Lehren der Alawiten sind geheim, und der Koran ist nur eine ihrer heiligen Schriften. Zusätzlich zur Abstammungslinie der Imame über Ali glauben die Alawiten auch an die Wiedergeburt und dass sämtliche Wesen aus dem Himmel ausgestoßene Sterne sind, die sich ihren alten Platz nun neu verdienen müssen, indem sie ein gutes und frommes Leben führen."
 #Alevis
 alevi: "Alevismus"
 alevi_adj: "Alevitisch"
 alevi_adherent: "Alevitisch"
 alevi_adherent_plural: "Aleviten"
 alevi_desc: "Aleviten glauben an die Abstammungslinie der Zwölf Imame, folgen aber auch vielen anderen Traditionen, wie sie in ihrer Sammlung von heiligen Schriften – dem Buyruk – umrissen sind. Gemäß der alevitischen Tradition ist Gott die Wahrheit, und Mohammed und Ali sind seine Manifestationen in der Welt."
 alevi_house_of_worship: "Cemevi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural: "Cemevi"
 alevi_religious_text: "Buyruk"
 alevi_religious_text_2: "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3: "$alevi_religious_text$" # Optional translation alt
 #Ibadi (Muhakkima)
 ibadi: "Muhakkima-Ritus"
 ibadi_adj: "Muhakkimisch"
 ibadi_adherent: "Muhakkima"
 ibadi_adherent_plural: "Muhakkima"
 ibadi_desc: "Die Muhakkima sind der Ansicht, dass die islamische Gemeinschaft keinen Kalifen oder Imam braucht, wenn kein geeigneter Kandidat vorhanden ist. Sie lehnen die Nachfolger von Ali und Abu Bakr als per se rechtmäßige Führungspersönlichkeiten ab und betonen stattdessen rechtschaffenes Handeln sowie den Konsens."
 #Azariqa
 azariqa: "Azraqismus"
 azariqa_adj: "Azraqitisch"
 azariqa_adherent: "Azraqitisch"
 azariqa_adherent_plural: "Azraqiten"
 azariqa_desc: "Da sie keinen würdigen Nachfolger Mohammeds anerkennen, erachten es die Azraqiten als ihr Recht und ihre Pflicht, gegen jeden Anführer anzukämpfen, der nicht die Werte ihres Glaubens vertritt. Jeder noch so kleine Unterschied in der Auslegung des Glaubens markiert einen für sie bereits als Ungläubigen."
 #Najdat
 najdat: "Najdatismus"
 najdat_adj: "Najdatisch"
 najdat_adherent: "Najdat"
 najdat_adherent_plural: "Najdaten"
 najdat_desc: "Anhänger des najdatischen Zweigs der Charidschiten glauben fest daran, dass sich die Führerschaft über die Muslime aus dem Konsens der Gläubigen zu ergeben hat. Der Anführer ist zwar nicht unfehlbar, wird aber über die Glaubensgemeinschaft durch Gott auserwählt."
 #Sufri
 sufri: "Sufrismus"
 sufri_adj: "Sufritisch"
 sufri_adherent: "Sufritisch"
 sufri_adherent_plural: "Sufriten"
 sufri_desc: "Die Sufriten glauben an die göttliche Anleitung und Führung durch die Auslegung von Gottes Wort und nicht durch reine Vererbung. Der Wille Gottes verschafft sich als Wille der Umma Ausdruck, solange die Menschen der Umma nur ausreichend mit dem Koran vertraut sind."
 #Hafizi
 hafizi: "Hafizi-Ritus"
 hafizi_adj: "Hafizi"
 hafizi_adherent: "Hafizi"
 hafizi_adherent_plural: "Hafiziten"
 hafizi_desc: "Hafiziten legen ihren Schwerpunkt auf die Unterstützung jener Person, die sie vor allen anderen für den wahren Kalifen halten. Sie werden sich jedem Versuch entgegenstellen, ihn abzusetzen oder vom Thron zu stoßen. In Niederlagen betrachten sie den Aufstand als ein würdiges Anliegen. Im Sieg sind sie stolze Anhänger des Willens ihres Anführers."
