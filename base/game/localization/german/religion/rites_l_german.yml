l_german:
 # used by code as ultimate fallback.
 rite_no_name: "#D Rite Name#!"
 rite_no_name_adj: "#D Unnamed#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D This Rite should have a name #!"
 generic_rite_description: "Der [Rite.GetNameNoTooltip] wurde von [Character.GetFullName] am [GetCurrentDate.GetStringLong] in [Character.GetCurrentLocation] als Ritus innerhalb des [Faith.GetAdjective|l]en Glaubens gegründet. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "Der [Rite.GetNameNoTooltip] wurde von [Character.GetFullName] am [GetCurrentDate.GetStringLong] als Ritus innerhalb des [Faith.GetAdjective|l]en Glaubens gegründet. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "Dieser Ritus bewahrt einen unverwechselbaren Anbetungsschwerpunkt innerhalb des Mutterglaubens."
 generic_rite_focus_tenet_aniconism: "Dieser Ritus lehnt heilige Bildnisse ab und strebt nach Hingabe durch Abwesenheit, Zurückhaltung und Heiligkeit des nicht-abgebildeten Göttlichen."
 generic_rite_focus_tenet_alexandrian_catechism: "Dieser Ritus schätzt Bildung, unterschwellige Doktrinen und die geduldige Unterweisung der Gläubigen."
 generic_rite_focus_tenet_armed_pilgrimages: "Dieser Ritus behandelt Religionskriege und bewaffnete Pilgerfahrten als heilige Pflicht der Gläubigen."
 generic_rite_focus_tenet_carnal_exaltation: "Dieser Ritus ehrt das Verlangen und verkörperte Genüsse als vom Heiligen berührte Gaben."
 generic_rite_focus_tenet_communal_identity: "Dieser Ritus verknüpft die Verehrung eng mit gemeinsamen Bräuchen, dem alltäglichen Leben und einer behüteten Gemeindeverflechtung."
 generic_rite_focus_tenet_communion: "Dieser Ritus wird durch gemeinsame Anbetung, Almosen und die Kommunion mit seinem spirituellen Oberhaupt zusammengehalten."
 generic_rite_focus_tenet_consolamentum: "Dieser Ritus strebt nach einer endgültigen Läuterung durch Verzicht und einer entschlossenen Vorbereitung auf den Tod."
 generic_rite_focus_tenet_divine_marriage: "Dieser Ritus verheiligt die Einigkeit und Herrschaft zugleich, wobei das Sakrament der Ehe als Spiegelbild der göttlichen Ordnung gilt."
 generic_rite_focus_tenet_gnosticism: "Dieser Ritus sucht nach verborgenen Wahrheiten jenseits des Schleiers der Welt, denn in heiligem Wissen liegt die Erlösung."
 generic_rite_focus_tenet_mendicant_preachers: "Dieser Ritus verbreitet den Glauben durch Wanderprediger, bescheidene Zeugen und unermüdliche Unterweisung."
 generic_rite_focus_tenet_pacifism: "Dieser Ritus hebt Zurückhaltung und Frieden hervor, und sinnloses Blutvergießen gilt als schweres Versagen der Seele."
 generic_rite_focus_tenet_pentarchy: "Dieser Ritus schätzt uralte Amtssitze und die geordnete Verwaltung des breiteren Glaubens."
 generic_rite_focus_tenet_unrelenting_faith: "Dieser Ritus preist standhaften Eifer, harte Entschlossenheit und eine Bereitschaft, für das zu kämpfen, was heilig ist."
 generic_rite_focus_tenet_vows_of_poverty: "Dieser Ritus ehrt heilige Armut und drängt die Gläubigen, sich vom Übermaß zu trennen und mit weniger zu leben."
 generic_rite_focus_tenet_pastoral_isolation: "Dieser Ritus zieht eine behütete Herde vor und trennt sie daher von der weiteren Welt, anstatt Kompromisse einzugehen."
 generic_rite_focus_tenet_rite: "Dieser Ritus legt besonderes Gewicht auf die Liturgie, die kirchliche Ordnung und die Bewahrung sakraler Traditionen."
 generic_rite_focus_tenet_adaptive: "Dieser Ritus beugt sich, ohne zu brechen, und nimmt örtliche Bräuche auf, während sein heiliger Kern bewahrt wird."
 generic_rite_focus_tenet_esotericism: "Dieser Ritus schätzt verborgene Weisheit, Initiation und Wahrheit, die nur den Vorbereiteten offenbart wird."
 generic_rite_focus_tenet_legalism: "Dieser Ritus gründet Heiligkeit auf klarem Recht, ordentlicher Rechtsprechung und einer disziplinierten Ordnung des Lebens."
 generic_rite_focus_tenet_literalism: "Dieser Ritus hält sich eng an das heilige Wort, während man lockeren Auslegungen und damit einhergehenden Kompromissen misstraut."
 generic_rite_focus_tenet_reincarnation: "Dieser Ritus sieht die Reise der Seele als Kreislauf, wobei jedes Leben das nächste beeinflusst."
 generic_rite_focus_tenet_religious_legal_pronouncements: "Dieser Ritus erfüllt heilige Gesetze und die formelle Rechtsprechung mit einer dauerhaften spirituellen Autorität."
 generic_rite_focus_tenet_struggle_submission: "Dieser Ritus lehrt, dass man den Glaube durch Kampf, Eroberung und die Unterwerfung der Gottlosen beweist."
 generic_rite_focus_tenet_false_conversion_sanction: "Dieser Ritus duldet scheinbare Anpassung und äußere Täuschung, wenn das eigene Überleben oder ein Vorteil davon abhängen."
 generic_rite_focus_tenet_tax_nonbelievers: "Diesem Ritus zufolge ist der Unglaube eine Last, für die man Tribut schuldet, sodass die heilige Hierarchie durch weltliche Abgaben gefestigt wird."
 generic_rite_focus_tenet_asceticism: "Dieser Ritus strebt nach Heiligkeit durch Entsagung, Disziplin und das geduldige Meistern des Verlangens."
 generic_rite_focus_tenet_bhakti: "Im Mittelpunkt dieses Ritus steht die Hingabe von Herzen: Er lehrt, dass die liebevolle Unterwerfung die Seele dem Göttlichen näherbringt."
 generic_rite_focus_tenet_dharmic_pacifism: "Dieser Ritus schätzt die Harmlosigkeit und die Selbstbeherrschung, wobei Frieden als höhere Disziplin als der Zorn gilt."
 generic_rite_focus_tenet_inner_journey: "Dieser Ritus blickt nach innen und strebt nach der Erweckung durch Reflexion, Disziplin und die Verwandlung des Selbst."
 generic_rite_focus_tenet_ritual_hospitality: "Dieser Ritus behandelt Gastlichkeit als sakrale Pflicht, die Gastgeber und Gast in einem heiligen Brauch verbindet."
 generic_rite_focus_tenet_adorcism: "Dieser Ritus macht Geistern durch Verehrung den Hof, wobei man darauf hofft, ihre Gunst zu gewinnen und ihren Zorn abzuwenden."
 generic_rite_focus_tenet_ancestor_worship: "Dieser Ritus wendet sich an die geehrten Toten, um Führung, Segen und die Beständigkeit der Lebenden zu erlangen."
 generic_rite_focus_tenet_astrology: "Dieser Ritus sieht tiefere Bedeutung im Himmel, wobei man darauf vertraut, dass die Sterne die Ordnung, das Schicksal und die rechte Zeit offenbaren."
 generic_rite_focus_tenet_hedonistic: "Dieser Ritus begrüßt das Feiern, Ausschweifungen und die Heiligung der Freuden in der gemeinschaftlichen Verehrung."
 generic_rite_focus_tenet_human_sacrifice: "Diesem Ritus zufolge sind Blutopfer ein furchteinflößender, aber heiliger Austausch zwischen dem Sterblichen und dem Göttlichen."
 generic_rite_focus_tenet_mystical_birthright: "Diesem Ritus zufolge zeichnet das Schicksal mancher Seelen sie schon von Geburt an für heilige Macht und spirituelle Größe aus."
 generic_rite_focus_tenet_ritual_celebrations: "Dieser Ritus erhebt gemeinschaftliche Feiern und heilige Feste zur höchsten Form der Verehrung."
 generic_rite_focus_tenet_sacred_childbirth: "Dieser Ritus erfüllt die Geburt mit Ehrerbietung, wobei Mutterschaft und neues Leben als Akte von heiliger Bedeutung gelten."
 generic_rite_focus_tenet_sanctity_of_nature: "Für diesen Ritus liegt das Heilige in der lebendigen Welt: Wachstum, Fruchtbarkeit und die ungezähmte Schöpfung werden verehrt."
 generic_rite_focus_tenet_sun_worship: "Dieser Ritus ehrt die Sonne als lebensspendendes Zeichen für Ordnung, Strahlkraft und göttliche Gunst."
 generic_rite_focus_tenet_warmonger: "Dieser Ritus verherrlicht Eroberung und kriegerisches Können, und von den Gläubigen wird erwartet, dass sie sich im Krieg beweisen."
 generic_rite_focus_tenet_gruesome_festivals: "Dieser Ritus ergeht sich in schrecklichen Feiern, bei denen Angst, Blut und Spektakel zu heiligen Zurschaustellungen werden."
 generic_rite_focus_tenet_cthonic_redoubts: "Dieser Ritus verehrt die Höhen und die verborgenen Festungen der Erde als Orte ungewöhnlicher Heiligkeit."
 generic_rite_focus_tenet_household_gods: "Im Mittelpunkt dieses Ritus stehen das Heim: Herd, Familie und tägliche Gebete werden von höheren Mächten behütet."
 generic_rite_focus_tenet_sinitic_syncretism: "Dieser Ritus verflicht Traditionen mit sinitischen Gedanken, um Harmonie anstelle von Brüchen zu schaffen."
 generic_rite_focus_tenet_eastern_syncretism: "Dieser Ritus nimmt bereitwillig östliche Lehren auf und sieht fremde Weisheiten als Nachhall heiliger Wahrheiten."
 generic_rite_focus_tenet_unreformed_syncretism: "Dieser Ritus beruft sich freimütig auf ältere Praktiken und vereint uralte Praktiken zu einem neuen heiligen Ganzen."
 generic_rite_focus_tenet_christian_syncretism: "Dieser Ritus deutet christliche Lehren neu, indem sie in einen eigenen heiligen Rahmen eingebunden werden, anstatt sie ganz abzulehnen."
 generic_rite_focus_tenet_islamic_syncretism: "Dieser Ritus bedient sich bei islamischen Glaubensvorstellungen und Bräuchen und findet nützliche Wahrheiten in benachbarten Offenbarungen."
 generic_rite_focus_tenet_jewish_syncretism: "Dieser Ritus nimmt jüdische Traditionen, Gesetze und Erinnerungen in sein Verständnis des Heiligen auf."
 generic_rite_focus_tenet_exaltation_of_pain: "Dieser Ritus betrachtet Schmerz als läuternde, offenbarende Hingabe, die man durch Ausdauer und angenommenes Leiden erlangen kann."
 generic_rite_focus_tenet_natural_primitivism: "Dieser Ritus misstraut dem Zivilisierten und ehrt eine härtere Lebensweise, die den Elementen näher ist."
 generic_rite_focus_tenet_pursuit_of_power: "Dieser Ritus segnet Ehrgeiz und weltliche Meisterschaft, denn Macht gilt als Werkzeug des Heiligen."
 generic_rite_focus_tenet_ritual_cannibalism: "Bei diesem Ritus wird der Verzehr von Menschenfleisch mit Tabuverehrung und heiligem Schrecken vereint."
 generic_rite_focus_tenet_sacred_shadows: "Dieser Ritus hüllt sich selbst in einen Schleier der Geheimhaltung, sodass Verborgenes, das Zwielichtige und das, was vor vielen verborgen bleibt, als heilig gilt."
 generic_rite_focus_tenet_polyamory: "Dieser Ritus segnet die Polyamorie und weigert sich, die heilige Intimität auf einen Bund zu beschränken."
 generic_rite_focus_tenet_sacrificial_ceremonies: "Dieser Ritus stellt andächtge Opfer in den Mittelpunkt der Verehrung, um einen Bund mit dem Göttlichen und dessen Gunst zu erlangen."
 generic_rite_focus_tenet_megaliths: "Dieser Ritus hält das Heilige in beständigem Stein fest und vertraut darauf, dass Monumente die Erinnerung und die Hingabe verankern."
 generic_rite_focus_tenet_fp3_fedayeen: "Dieser Ritus heiligt Heimlichkeit, Unterwanderung und selbstaufopfernde Gewalt im Dienst einer höheren Sache."
 generic_rite_focus_tenet_communal_possessions: "Dieser Ritus spielt eigenen Reichtum herunter und drängt die Gläubigen, Mittel gemeinsam zu nutzen."
 generic_rite_focus_tenet_pure_land: "Dieser Ritus legt seine Hoffnung auf ein gesegnetes Reich jenseits des Leidens, das man durch Vertrauen, Erinnerung und Hingabe erreichen kann."
 generic_rite_focus_tenet_no_mind: "Dieser Ritus strebt nach Klarheit durch das Begreifen von Gedanken, die das Selbst hin zu einem leeren Bewusstsein führen."
 generic_rite_focus_tenet_mountain_worship: "Diesem Ritus gelten hohe Orte als dem Himmlischen näher, sodass Gipfel und Hocherhobenes zu Gegenständen der Verehrung werden."
 generic_rite_focus_tenet_extinction_of_dharma: "Diesem Ritus zufolge ist die Welt überlaufen von Verderbnis, was unbarmherzige Gewalt zur Verteidigung der Wahrheit erlaubt."
 generic_rite_focus_tenet_cranial_trophies: "Dieser Ritus behandelt die Überreste der Feinde als heilige Belege für den eigenen Triumph und ein schaurige Form des Ansehens."
 generic_rite_focus_tenet_pursuit_of_knowledge: "Dieser Ritus erhebt das Lernen zu einem heiligen Werk und strebt durch Studium, Debatte und disziplinierte Forschung nach Wahrheit."
 generic_rite_focus_tenet_benevolent_governance: "Dieser Ritus bemisst Heiligkeit in Teilen durch gerechte Herrschaft, ordentliche Verwaltung und Sorge für das Reich."
 generic_rite_focus_tenet_filial_piety: "Dieser Ritus lehrt, dass die Verehrung von Eltern und Älteren die Grundlage der moralischen und heiligen Ordnung ist."
 generic_rite_focus_tenet_harmonious_society: "Dieser Ritus schätzt Ausgewogenheit, Anstand und gesellschaftliche Harmonie als Spiegel der kosmischen Ordnung."
 generic_rite_focus_tenet_sacred_destruction: "Dieser Ritus sieht heilige Zerstörung als eine Läuterung an, die aus Ruinen ein Werkzeug der heiligen Erneuerung macht."
 generic_rite_focus_tenet_preservation: "Dieser Ritus preist Ausdauer, Beständigkeit und die sorgfältige Bewahrung dessen, was einem anvertraut wurde."
 generic_rite_focus_tenet_takamin: "Dieser Ritus bringt Bären und verwandten Mächten der Wildnis Verehrung, Ehrfurcht und sorgsamen Respekt entgegen."
 generic_rite_focus_tenet_peace_of_god: "Dieser Ritus strebt danach, Gewalt einzuschränken, und legt heilige Grenzen dafür fest, wann Blut rechtmäßig vergossen werden kann."
 generic_rite_focus_tenet_dulia: "Dieser Ritus ehrt Heilige und heilige Vorbilder, indem man sich ihrer erinnert, ohne sie aber mit dem Göttlichen gleichzusetzen."
 generic_rite_focus_tenet_transubstantiation: "Dieser Ritus behandelt die meisten Mysterien als etwas wirklich Transformatives, was Sakramente zu einem zentralen Teil der göttlichen Präsenz macht."
 generic_rite_focus_tenet_ora_et_labora: "Dieser Ritus vereint Gebet und Arbeit durch die Lehre, dass disziplinierte Arbeit allein schon eine Art der Hingabe sein kann."
 generic_rite_focus_tenet_hyperdulia: "Dieser Ritus bringt der heiligsten Fürsprecherin außergewöhnliche Verehrung entgegen, sodass sie noch über die einfachen Heiligen erhoben wird."
 generic_rite_focus_tenet_simony: "Dieser Ritus nimmt in Kauf, dass heilige Ämter, Patronate und weltlicher Reichtum sich nur schwerlich trennen lassen."
 generic_rite_focus_tenet_monophysitism: "Dieser Ritus verkündet die Einigkeit des Wesen Christi und verweigert sich scharf der Teilung des Mysteriums Gottes."
 generic_rite_focus_tenet_acts_of_apostles: "Dieser Ritus folgt dem Vorbild der apostolischen Gemeinden früher Christen mit ihrer Wohltätigkeit und dem Leben in einer Gemeinschaft."
 generic_rite_focus_tenet_purgatory: "Dieser Ritus lehrt, dass viele Seelen nach dem Tod geläutert werden müssen, ehe sie in die vollkommene Seligkeit übergehen können."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "Dieser Ritus erhebt Familie, Fortpflanzung und das Zeugen oder Gebären von neuem Leben zur heiligen Pflicht."
 generic_rite_focus_tenet_apostolic_succession: "Dieser Ritus begründet Autorität mit einer ungebrochenen Weitergabe, die zurück bis zu den Aposteln reicht."
 generic_rite_focus_tenet_confession: "Dieser Ritus schätzt offene Buße und Absolution im Glauben daran, dass ausgesprochene Sünden den Anfang der Heilung darstellen."
 generic_rite_focus_tenet_original_sin: "Dieser Ritus betrachtet menschliche Schwäche als etwas Urtümliches und besteht darauf, dass keine Seele unbefleckt in die Welt kommt."
 generic_rite_focus_tenet_celestial_hierarchy: "Dieser Ritus sieht den Kosmos als in heilige Ränge unterteilt an, sodass die jeweilige Stellung auch einem Platz im göttlichen Entwurf darstellt."
 generic_rite_focus_tenet_miles_christi: "Dieser Ritus macht die Gläubigen zu heiligen Kriegern, die aufgerufen sind, die Wahrheit mit diszipliniertem Eifer zu verbreiten."
 generic_rite_focus_tenet_scholasticism: "Dieser Ritus schärft den Glauben durch Argumentationen, Kommentare und die Versöhnung von Vernunft und Glauben."
 generic_rite_focus_tenet_adoptionism: "Dieser Ritus betont die Erhabenheit und Stellung als Gottes Sohn dergestalt, dass eine ewige Unterscheidung heruntergespielt wird."
 generic_rite_focus_tenet_love_thy_neighbour: "Bei diesem Ritus stehen Gnade und nachbarschaftliche Liebe im Herzen des alltäglichen religiösen Lebens."
 generic_rite_focus_tenet_divine_liturgy: "Dieser Ritus preist die andächtige Liturgie, denn geordnete Verehrung ist das klarste Fenster zum Göttlichen."
 generic_rite_focus_tenet_miaphysitism: "Dieser Ritus lehrt die untrennbare Einheit von Göttlichkeit und Menschlichkeit in dem einen Mysterium Christi."
 generic_rite_focus_tenet_hesychasm: "Dieser Ritus strebt nach Einigkeit durch Schweigen, Stille und die innere Wiederholung heiliger Gebete."
 generic_rite_focus_tenet_anachoresis: "Dieser Ritus ehrt den Rückzug aus der Welt und sucht nach Heiligkeit in Einsamkeit, Entbehrung und Abgeschiedenheit."
 generic_rite_focus_tenet_mortification_of_the_flesh: "Dieser Ritus verfolgt Heiligkeit durch körperliche Härte, damit das Fleisch sich spirituellen Zielen beugt."
 generic_rite_focus_tenet_holy_myron: "Dieser Ritus gewährt heiligen Salbungen ein besonderes Gewicht, indem heilige Öle als Siegel göttlicher Vergebung dienen."
 generic_rite_focus_tenet_khachkar: "Dieser Ritus segnet behauene Steinkreuze und überdauernde Monumente als öffentliche Zeugnisse des Heiligen."
