 roman_rite: "Ritus nach römischer Art"
 roman_rite_adj: "Römisch"
 roman_rite_adherent: "Römischer Christ"
 roman_rite_adherent_plural: "Römische Christen"
 roman_rite_desc: "Der römische Ritus ist die liturgische Tradition der Kirche Roms, geprägt von der lateinischen Theologie, der rechtlichen Autorität sowie einer Betonung der sakramentalen Disziplin, der klerikalen Hierarchie und der institutionellen Einigkeit."
 insular_celtic: "Inselchristentum"
 insular_celtic_adj: "Inselchristlich"
 insular_celtic_adherent: "Inselchrist"
 insular_celtic_adherent_plural: "Inselchristen"
 insular_celtic_desc: "Das Inselchristentum, das sich vor Jahrhunderten aufgrund seiner Abgeschiedenheit von der römisch-katholischen Orthodoxie fortentwickelte, verlor auf beharrliches Drängen seiner Ursprungskirche inzwischen wieder viele jener Eigenschaften, die es einst so einzigartig machten. Es legt aber nach wie vor einen großen Schwerpunkt auf Buße und Mönchstum und gliedert viele traditionelle Heiratsriten der Kelten, die weiten Teilen des Christentums fremd sind, in die eigenen Bräuche ein."
 insular_celtic_religious_head_title: "Erzabt"
 insular_celtic_religious_head_title_female: "Erzäbtissin"
 insular_celtic_religious_head_title_name: "Kirchenrat"
 #^"Congress" would be better, but it reads oddly in a medieval context.
