 doctrine_homosexuality_shunned_desc: "Es ist unnatürlich, wenn zwei Männer eine körperliche Beziehung miteinander haben, ungeachtet der Umstände."
 doctrine_homosexuality_accepted_name: "Akzeptiert"
 doctrine_homosexuality_accepted_descriptive_name: "Akzeptierte gleichgeschlechtliche Beziehungen"
 doctrine_homosexuality_accepted_desc: "Liebe geht über das Körperliche hinaus und ist etwas derart Weitreichendes und Wunderbares, dass es sich nicht durch einfache Geschlechter einschränken lässt."
