 global_religion.1000.t: "Verbannte [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]"
 global_religion.1000.desc_same_faith_counties: "Mehr als [local_character.MakeScope.Var('loc_number').GetValue|0] Anhänger des [target_rite.GetName], die aus [target_rite_associated_county.GetName] verbannt wurden, wollen Teil unseres Reichs werden. Ihr Anführer [local_character.GetFirstName] ersucht um eine Audienz. „Wir suchen nach einem besseren, sicheren Leben, [ROOT.Char.GetTitleAsNameNoTooltip]“, sagt [local_character.Custom('DE_PRO_PER_S_3P_N')]. „Lasst uns in Eurem ganzen Reich ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) siedeln.“"
 global_religion.1000.desc_same_faith_counties_alt: "Religiöse Verfolgung ist weitverbreitet in [target_rite_associated_county.GetName], wo der [target_rite_associated_county_rite.GetAdjective|l]e Adel unter Zwang Anhänger des [target_rite.GetName] bekehrt.\n\nNun wollen mehr als [local_character.MakeScope.Var('loc_number').GetValue|0] Verbannte in unser Reich kommen. [local_character.GetFirstName|U], ihr Oberhaupt, bittet um eine Audienz. „Wir suchen nach einem besseren, sichereren Leben, [ROOT.Char.GetTitleAsNameNoTooltip]“, sagt [local_character.Custom('DE_PRO_PER_S_3P_N')|U]. „Lasst uns in Eurem ganzen Reich ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) siedeln.“"
 global_religion.1000.desc_any_counties: "Religiöse Verfolgung ist weitverbreitet in [target_rite_associated_county.GetName], wo der [target_rite_associated_county_rite.GetAdjective|l]e Adel unter Zwang Anhänger des [target_rite.GetName] bekehrt.\n\nNun wollen mehr als [local_character.MakeScope.Var('loc_number').GetValue|0] Verbannte in unser Reich kommen. [local_character.GetFirstName|U], ihr Oberhaupt, bittet um eine Audienz. „Wir suchen nach einem besseren, sichereren Leben, [ROOT.Char.GetTitleAsNameNoTooltip]“, fleht [local_character.Custom('DE_PRO_PER_S_3P_N')|U]. „Lasst uns in [initial_county_target.GetNameNoTier] siedeln.“\n\nWenn ich ihnen dies erlaube, wird sich der [local_character.GetFaith.GetAdjective|l]e Glaube im Reich ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) verbreiten."
 global_religion.1000.desc_any_counties_alt: "Mehr als [local_character.MakeScope.Var('loc_number').GetValue|0] Anhänger des [target_rite.GetName], verbannt aus [target_rite_associated_county.GetName], wollen in unser Reich kommen. [local_character.GetFirstName|U], ihr Oberhaupt, bittet um eine Audienz. „Wir suchen nach einem besseren, sichereren Leben, [ROOT.Char.GetTitleAsNameNoTooltip]“, fleht [local_character.Custom('DE_PRO_PER_S_3P_N')|U]. „Lasst uns in [initial_county_target.GetNameNoTier] siedeln.“\n\nWenn ich ihnen dies erlaube, wird sich der [local_character.GetFaith.GetAdjective|l]e Glaube im Reich ([ROOT.Char.GetPrimaryTitle.GetDefinitiveName]) verbreiten."
