 doctrine_homosexuality_crime_descriptive_name: "Verbrecherische gleichgeschlechtliche Beziehungen"
 doctrine_homosexuality_crime_desc: "Das sündige Verlangen der Sodomiten ist eine Gefahr für die Gesellschaft selbst. Deshalb sollten sie bestraft und für ihre Verstöße eingekerkert werden."
 doctrine_homosexuality_shunned_name: "Verpönt"
