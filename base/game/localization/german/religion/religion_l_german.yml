 doctrine_funeral_name: "Begräbnistradition"
 doctrine_funeral_stoic_name: "Stoische Bestattung"
 doctrine_funeral_stoic_desc: "Der Leib mag gestorben sein, doch die Seele lebt weiter. Der Tod ist keine Zeit für Trauer und Wehklagen, sondern eine Beerdigung dient dazu, den Toten zu ehren, indem sein Leichnam in einer ruhigen, bescheidenen Zeremonie der Erde übergeben wird."
 doctrine_funeral_bewailment_name: "Beklagende Bestattung"
 doctrine_funeral_bewailment_desc: "Die Seele hat ihre lange Reise ins Jenseits ([ROOT.Faith.PositiveAfterLife]) angetreten, und wir werden sie in der Welt der Lebenden nie wiedersehen. Es ist unerlässlich, dass alle, die den Verstorbenen kannten, sich versammeln und ihre Trauer in einem öffentlichen Akt der Klage zum Ausdruck bringen. Dies ehrt den Verstorbenen und reinigt unsere Seelen von der Trauer über seinen Tod."
 doctrine_funeral_cremation_name: "Einäscherung"
 doctrine_funeral_cremation_desc: "Aus Asche kamen wir, zur Asche kehren wir zurück. Der Leichnam unseres Verstorbenen wird auf einem großen Scheiterhaufen verbrannt, und die Asche wird verstreut, damit der Tote seine Reise fortsetzen kann."
 doctrine_funeral_sky_burial_name: "$tenet_sky_burials_name$"
 doctrine_funeral_sky_burial_desc: "$tenet_sky_burials_desc$"
 doctrine_funeral_mummification_name: "Mumifizierung"
 mummification_funeral_name: "Mumifizierung"
 doctrine_funeral_mummification_desc: "Der Leib mag nicht mehr lebendig sein, doch er ist noch immer das Gefäß, durch das der Geist ins Jenseits ([ROOT.Faith.PositiveAfterLife]) reisen wird. Die körperliche Form muss daher so beständig sein wie die Seele, um auf das Urteil höherer Mächte ([ROOT.Faith.FateGodName]) warten zu können."
 doctrine_family_rites_name: "Familienriten"
 doctrine_family_rites_descriptive_name: "Familienbegräbnisriten"
 doctrine_family_rites_desc: "Der Tod ist eine Zeit der Trauer und der Rituale für die Lebenden. Hierarchie und Alter spielen im Tod eine ebenso große Rolle wie im Leben. Daher ist es wichtig, die Älteren auch nach ihrem Verscheiden zu ehren – und bei der richtigen Verehrung gesehen zu werden."
