 doctrine_pilgrimage_forbidden_name: "Verboten"
 doctrine_pilgrimage_forbidden_descriptive_name: "Verbotene Pilgerreisen"
 doctrine_pilgrimage_forbidden_desc: "Die Präsenz der höchsten Macht ([ROOT.Faith.HighGodName]) ist überall zu spüren, und der Gedanke, dass manche Orte heiliger als andere sein könnten, ist schlichtweg Ketzerei."
 doctrine_pilgrimage_encouraged_name: "Ermutigt"
 doctrine_pilgrimage_encouraged_descriptive_name: "Ermutigte Pilgerreisen"
 doctrine_pilgrimage_encouraged_desc: "Dieser Glaube ermutigt seine Mitglieder, irdische Orte aufzusuchen, denen eine spirituelle Bedeutung zugeschrieben wird, um so die eigene Verehrung höherer Mächte ([ROOT.Faith.PantheonTerm]) zum Ausdruck zu bringen."
 doctrine_pilgrimage_mandatory_name: "Erforderlich"
 doctrine_pilgrimage_mandatory_descriptive_name: "Zwingende Pilgerreisen"
 doctrine_pilgrimage_mandatory_desc: "Es wird erwartet, dass alle körperlich dazu fähigen [ROOT.Faith.GetAdherentNamePlural] eine religiöse Reise an eine heilige Stätte abschließen, sobald sie dazu in der Lage sind. Wer dies nicht tut, zeigt keine angemessene Hingabe an die höchste Macht ([ROOT.Faith.HighGodName])."
 doctrine_pilgrimage_mandatory_hajj_name: "Hadsch"
 doctrine_pilgrimage_mandatory_hajj_desc: "Es wird erwartet, dass alle körperlich dazu fähigen Muslime im Lauf ihres Lebens einen Hadsch nach Mekka unternehmen. Auch wenn es oft besondere Ausnahmen gibt, wird jeder [ROOT.Faith.GetAdherentNameNoTooltip], der keinen Hadsch unternommen hat, mit Skepsis betrachtet."
