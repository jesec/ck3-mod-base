 doctrine_pilgrimage_local_rites_name: "Örtliche Riten"
 doctrine_pilgrimage_local_rites_desc: "Anhänger dieses Glaubens ziehen den Trost und Beständigkeit verlässlicher Rituale an örtlichen Schreinen den Gefahren und Strapazen langer Pilgerreisen vor."
 doctrine_parameter_local_shrine_offering: "Erlaubt die [decision|E] „[GetDecisionWithKey('visit_local_shrine_decision').GetName]“, doch die [pilgrimage|E]-[activity|E] ist kostspieliger"
