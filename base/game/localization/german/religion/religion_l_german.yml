 doctrine_pluralism_name: "Haltung zu anderen Glauben"
 doctrine_parameter_hostility_towards_us_mult: "Anhänger anderer [faiths|E] haben einen Meinungsmalus von $VALUE|%V0$"
 doctrine_pluralism_fundamentalist_name: "Fundamentalistisch"
 doctrine_pluralism_fundamentalist_descriptive_name: "Fundamentalistische Einstellung"
 doctrine_pluralism_fundamentalist_desc: "Unser Glaube ist der einzig wahre Glaube, unser Wort das einzig wahre Wort. Jede Abweichung von unseren heiligen Schriften ist grundlegend blasphemisch."
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus: "Gemeindebekehrungstempo: #P +20 %#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "Kann #P Titel mit Landbesitz#! von $hostility_hostile_tooltippable$en und $hostility_evil_tooltippable$n Ungläubigen aberkennen, ohne [tyranny|E] zu erhalten"
 doctrine_parameter_pluralism_fundamentalist_faction_join_chance: "[counties|E] mit anderem [faiths|E] treten #N sehr viel wahrscheinlicher#! [factions|E] bei"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "#N Erhöhte Gefahr#! von Ketzereien, wenn der [fervor|E] niedrig ist"
 doctrine_pluralism_righteous_name: "Rechtschaffen"
 doctrine_pluralism_righteous_descriptive_name: "Rechtschaffene Einstellung"
 doctrine_pluralism_righteous_desc: "Als Sterbliche können wir den Willen von [ROOT.Faith.HighGodName] nicht völlig verstehen, aber unsere [ROOT.Faith.PriestNeuterPlural] haben zumindest eine gute Vorstellung davon, was heilig und was profan ist."
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "Kann #P Titel mit Landbesitz#! von $hostility_evil_tooltippable$en Ungläubigen aberkennen, ohne [tyranny|E] zu erhalten"
 doctrine_pluralism_pluralistic_name: "Pluralistisch"
 doctrine_pluralism_pluralistic_descriptive_name: "Pluralistische Einstellung"
 doctrine_pluralism_pluralistic_desc: "Es wäre töricht, ernsthaft zu behaupten, es gäbe nur eine richtige Auslegung des göttlichen Willens und dass alle anderen Ansichten falsch sind. Jeder von uns hat seinen eigenen Zugang zur Verehrung von [ROOT.Faith.HighGodName]."
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "Gemeindebekehrungstempo: #N -20 %#!"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "[counties|E] mit anderem [faiths|E] treten #P sehr viel unwahrscheinlicher#! [factions|E] bei"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "#P Verringerte Gefahr#! von Ketzereien, wenn der [fervor|E] niedrig ist"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "Einen [Concept('holy_war', 'Religionskrieg')|E] zu gewinnen, wird ungläubige [rulers|E] im Zielgebiet zu Vasallen machen, anstatt sich die Titel direkt anzueignen"
 doctrine_theocracy_name: "Klerikale Tradition"
 doctrine_theocracy_temporal_name: "Theokratisch"
 doctrine_theocracy_temporal_descriptive_name: "Theokratischer Klerus"
 doctrine_theocracy_temporal_desc: "Nur sanktionierten [ROOT.Faith.PriestNeuterPlural] kann man die Aufrechterhaltung der Doktrinen des Glaubens anvertrauen und damit auch die Verwaltung und die Pflege unserer heiligen Stätten."
 doctrine_parameter_theocracy_temple_lease: "Tempel-[holdings|E] werden an den [realm_priest|E] ihres Trägers verpachtet, der dann als [theocratic|E] [vassal|E] fungiert"
 doctrine_theocracy_lay_clergy_name: "Laienpriester"
 doctrine_theocracy_lay_clergy_descriptive_name: "$doctrine_theocracy_lay_clergy_name$"
 doctrine_theocracy_lay_clergy_desc: "Auch ein hingebungsvoller Anhänger ist durchaus in der Lage, die Doktrinen unseres Glaubens zu verstehen, ihnen zu folgen und sie zu predigen."
 doctrine_parameter_theocracy_temple_ownership: "Weltliche [rulers|E] kontrollieren ihre eigenen Tempel-[holdings|E] direkt und erhalten alle damit einhergehenden Vorzüge."
 #Intentionally left blank:
 doctrine_parameter_lay_clergy: ""
 doctrine_parameter_allowed_holding_type_church_holding: ""
 doctrine_clerical_function_name: "Klerikale Funktion"
 doctrine_clerical_function_taxation_name: "Kontrolle"
 doctrine_clerical_function_taxation_descriptive_name: "Kontrollaufgabe des Klerus"
 doctrine_clerical_function_taxation_desc: "[ROOT.Faith.AltPriestTermPlural] leiten ihre Autorität direkt von [ROOT.Faith.HighGodName] selbst her, und das gilt auch hier auf Erden."
 doctrine_clerical_function_alms_and_pacification_name: "Almosen und Beschwichtigung"
 doctrine_clerical_function_alms_and_pacification_descriptive_name: "Kirchliche Almosen und Beschwichtigung"
 doctrine_clerical_function_alms_and_pacification_desc: "[ROOT.Faith.PriestNeuterPlural] sind damit betraut, dafür zu sorgen, dass die Armen und Gebeutelten genug zu essen und Unterkunft haben, falls sie sich nicht selbst versorgen können."
 doctrine_clerical_function_recruitment_name: "Rekrutierung"
 doctrine_clerical_function_recruitment_descriptive_name: "Militärische Aufgabe des Klerus"
 doctrine_clerical_function_recruitment_desc: "Unsere [ROOT.Faith.PriestNeuterPlural] können zu den Waffen greifen und unseren Glauben verteidigen. Die Verantwortung, mit gutem Beispiel voranzugehen, verleiht ihnen besondere Stärke im Kampf."
 doctrine_parameter_clergy_can_fight: "Mitglieder des [clergy|E] können als [commanders|E] or $knight_culture_player_plural$ dienen"
 doctrine_clerical_gender_name: "Klerikales Geschlecht"
 doctrine_clerical_gender_male_only_name: "Nur Männer"
 doctrine_clerical_gender_male_only_descriptive_name: "Auf Männer beschränkter Klerus"
 doctrine_clerical_gender_male_only_desc: "Nur Männer können die große Verantwortung schultern, als [ROOT.Faith.PriestMalePlural] unseres Glaubens zu dienen."
 doctrine_parameter_clergy_must_be_male: "Nur Männer können Tempel-[holdings|E] verliehen bekommen oder als [court_chaplains|E] dienen"
 clergy_must_be_male_name: "$doctrine_clerical_gender_male_only_name$"
 doctrine_clerical_gender_female_only_name: "Nur Frauen"
 doctrine_clerical_gender_female_only_descriptive_name: "Auf Frauen beschränkter Klerus"
 doctrine_clerical_gender_female_only_desc: "Nur Frauen sind weise genug, den Willen von [ROOT.Faith.HighGodName] zu deuten und als [ROOT.Faith.PriestFemalePlural] unseres Glaubens zu dienen."
 doctrine_parameter_clergy_must_be_female: "Nur Frauen können Tempel-[holdings|E] verliehen bekommen oder als [court_chaplains|E] dienen"
 clergy_must_be_female_name: "$doctrine_clerical_gender_female_only_name$"
 doctrine_clerical_gender_either_name: "Beide"
 doctrine_clerical_gender_either_descriptive_name: "Geschlechtlich unbeschränkter Klerus"
 doctrine_clerical_gender_either_desc: "Wer den Ruf des Göttlichen vernommen hat, sollte auch als [ROOT.Faith.PriestNeuterPlural] dienen können, ungeachtet des Geschlechts."
 doctrine_parameter_clergy_can_be_either_gender: "Das Geschlecht hat keinen Einfluss darauf, wer Tempel-[holdings|E] verliehen bekommen oder als [court_chaplain|E] dienen kann"
 clergy_can_be_either_gender_name: "$doctrine_clerical_gender_either_name$"
 doctrine_clerical_marriage_name: "Klerikale Ehen"
 doctrine_clerical_marriage_allowed_name: "Erlaubt"
 doctrine_clerical_marriage_allowed_descriptive_name: "Erlaubte klerikale Ehen"
 doctrine_clerical_marriage_allowed_desc: "Die Ehe ist eine heilige Institution, und [ROOT.Faith.PriestNeuterPlural] sollten daran teilhaben können wie alle anderen gläubigen Anhänger."
 doctrine_parameter_clergy_can_marry: "Mitglieder des [clergy|E] dürfen [marry|E]"
 doctrine_clerical_marriage_disallowed_name: "Verboten"
 doctrine_clerical_marriage_disallowed_descriptive_name: "Verbotene klerikale Ehen"
 doctrine_clerical_marriage_disallowed_desc: "Ein [ROOT.Faith.PriestNeuter] zu werden, heißt, sein Leben ganz [ROOT.Faith.HighGodName] zu verschreiben. Allein der Gedanke, einen sterblichen Ehepartner zu heiraten, ist zwangsläufig treulos."
 doctrine_parameter_clergy_can_marry_disabled: "Mitgliedern des [clergy|E] ist es verboten zu [marry|El]\n$EFFECT_LIST_BULLET$[scheme_success_chance|E] für [GetScheme('seduce').GetTypeName] und [GetScheme('courting').GetTypeName] gegen ihren [clergy|E]: [success_chance_i]#N -25 %#!"
 doctrine_clerical_succession_name: "Klerikale Ernennung"
 doctrine_clerical_succession_temporal_appointment_name: "Weltlich, widerruflich"
 doctrine_clerical_succession_temporal_appointment_descriptive_name: "Weltlicher Widerruf von Kirchenernennungen"
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] sind schlussendlich Diener des Reichs, sodass ihr Lehnsherr sie mit sehr geringen Einschränkungen ernennen und entlassen können sollte, wie er dies möchte."
 doctrine_clerical_succession_spiritual_appointment_name: "Klerikal, widerruflich"
 doctrine_clerical_succession_spiritual_appointment_descriptive_name: "Spiritueller Widerruf von Kirchenernennungen"
 doctrine_clerical_succession_spiritual_appointment_desc: "Während die [ROOT.Faith.AltPriestTermPlural] alle [ROOT.Faith.BishopNeuterPlural] ernennen sollten, sollten weltliche Herrscher doch jene entlassen können, die sie enttäuschen."
 doctrine_clerical_succession_temporal_fixed_appointment_name: "Weltlich, auf Lebenszeit"
 doctrine_clerical_succession_temporal_fixed_appointment_descriptive_name: "Weltliche Kirchenernennungen auf Lebenszeit"
 doctrine_clerical_succession_temporal_fixed_appointment_desc: "Ein Herrscher sollte zwar die eigenen [ROOT.Faith.BishopNeuterPlural] auswählen dürfen, doch ihre Pflichten sind heilig und sakral, weswegen sie keiner Abberufung unterliegen dürfen."
 doctrine_clerical_succession_spiritual_fixed_appointment_name: "Klerikal, auf Lebenszeit"
 doctrine_clerical_succession_spiritual_fixed_appointment_descriptive_name: "Spirituelle Kirchenernennung auf Lebenszeit"
 doctrine_clerical_succession_spiritual_fixed_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] sind Diener des Göttlichen, und als dessen Repräsentanten sollte die Wahl, die die [ROOT.Faith.AltPriestTermPlural] für eine Position treffen, endgültig und absolut sein."
 doctrine_clerical_succession_conditional_name: "Fallbezogene"
 doctrine_clerical_succession_conditional_descriptive_name: "Fallbezogene Kirchenernennung"
 doctrine_clerical_succession_conditional_desc: "Das Recht, Kirchentitel-Träger zu ersetzen, bleibt ungeklärt. Eine solch umstrittene Vereinbarung treibt den Glauben zwangsläufig in einen [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 doctrine_clerical_succession_conditional_can_pick_tt: "Diese [doctrine|E] kann nicht frei gewählt werden: Sie kann nur durch ein ökumenisches Konzil erneut festgelegt werden"
 doctrine_parameter_clerical_appointment_ruler: "[rulers|E] ernennen den eigenen [realm_priest|E] oder [court_chaplain|E]"
 doctrine_parameter_clerical_appointment_head_of_faith: "[realm_priests|E] oder [court_chaplains|E] stammen aus dem Klerus und werden [Concept('rulers','Herrschern')|E] nach Bedarf zugewiesen"
 doctrine_parameter_clerical_appointment_fixed_disabled: "Der [realm_priest|E] oder [court_chaplain|E] kann entlassen und durch einen neuen ersetzt werden"
 doctrine_parameter_clerical_appointment_fixed: "Der [realm_priest|E] oder [court_chaplain|E] hält seinen Sitz bis zum Tod"
 doctrine_parameter_clerical_appointment_ruler_can_replace_ecc: "Weltliche [rulers|E] können [clerical_title|E]-[holders|E] in ihrem [realm|E] ersetzen"
 doctrine_parameter_clerical_appointment_hof_can_replace_ecc: "Das [head_of_faith|E] kann [clerical_title|E]-[holders|E] ersetzen"
 doctrine_theism_name: "Theismus"
 doctrine_monotheist_name: "Monotheismus"
 doctrine_monotheist_descriptive_name: "Monotheismus"
 doctrine_monotheist_desc: "Es wird nur ein Gott verehrt. Andere sogenannte „Götter“ sind bestenfalls leere Götzen und schlimmstenfalls Versuche böswilliger Betrüger, die Gläubigen von der richtigen Verehrung der höchsten Macht ([ROOT.Faith.HighGodName]) abzubringen.[AddLocalizationIf(GetPlayer.GetGovernment.HasGovernmentFlag('government_is_mandala'), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning: "\n\n$FAITH_MANDALA_MONOTHEIST_WARNING$"
 mandala_monotheist_warning_tt_global: "[AddLocalizationIf(GetPlayer.GetGovernment.HasGovernmentFlag('government_is_mandala'), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning_tt_first: "$mandala_monotheist_warning_tt_global$"
 mandala_monotheist_warning_tt_third: "$mandala_monotheist_warning_tt_global$"
 doctrine_polytheist_name: "Polytheismus"
 doctrine_polytheist_descriptive_name: "Polytheismus"
 doctrine_polytheist_desc: "Der Kosmos ist voll mächtiger Gottheiten und Geister. Es mag zwar eine Reihe von Göttern geben, die in einem klar umrissenen Pantheon etabliert sind, doch es kann auch sein, dass die spirituelle Welt unzählbar ist, alles um uns herum durchdringt und nicht einmal benannte Götter hat."
 unreformed_faith_doctrine_name: "Unreformiert"
 unreformed_faith_doctrine_descriptive_name: "Unreformierter Glaube"
 unreformed_faith_name: "Doktrin"
 unreformed_faith_doctrine_desc: "Einem unreformierten Glauben fehlt ein organisierter Klerus und etablierte kanonische Doktrinen: Unterschiedliche Gemeinden folgen nominell demselben Glauben, haben allerdings weit auseinander klaffende Praktiken und Glaubensvorstellungen."
 doctrine_parameter_unreformed: "Hindert Stammes-[rulers|E] daran, die [Concept('government', 'Regierungs')|E]-Art zu ändern\n$EFFECT_LIST_BULLET$Gewährt [unreformed_pagan_combat_bonus|E]"
 west_african_unreformed_faith_doctrine_name: "$unreformed_faith_doctrine_name$"
 west_african_unreformed_faith_doctrine_descriptive_name: "$unreformed_faith_doctrine_descriptive_name$"
 west_african_unreformed_faith_doctrine_desc: "$unreformed_faith_doctrine_desc$"
 heresy_hostility_name: "Haltung zur Ketzerei"
 heresy_hostility_doctrine_name: "Ketzerei"
 heresy_hostility_doctrine_desc: "Hütet Euch vor falschen Propheten, die die Worte des Glaubens für ihre eigenen Zwecke verdrehen und verzerren. Jene, die solches tun, sind Ketzer und müssen vernichtet werden."
 divine_destiny_name: "Göttliches Schicksal"
 divine_destiny_doctrine_name: "Rechtmäßige Herrscher der Welt"
 divine_destiny_doctrine_descriptive_name: "$divine_destiny_doctrine_name$"
 divine_destiny_doctrine_desc: "Wir sind jene, die eine neue Epoche des Friedens und des Wohlstands für alle Menschen einläuten werden. Wir sind die rechtmäßigen Herrscher der Welt."
 doctrine_parameter_divine_destiny_holy_war_cost_reduction: "Religionskrieg-[Concept('piety', 'Frömmigkeits')|E]-Kosten: #P -50 %#!"
 adoptionist_school_name: "Adoptianisten-Bekenntnis"
 special_doctrine_adoptionist_school_elipandic_doctrine_name: "Elipandische Schule"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc: "Die Elipandische Variante der $adoptionist_adherent_plural$ zieht es vor, sich auf subtile Variationen der Christologie zu konzentrieren, und betont die Bedeutung #EMP präziser#! Differenzen zum trinitarischen Dogma. Eine komplexe Unterscheidung, die gut vorgetragen wurde, wird als unendlich viel besser als eine einfache, aber schlecht begründete Erklärung erachtet."
 special_doctrine_adoptionist_school_felicitous_doctrine_name: "Felixianische Schule"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc: "Felixianische $adoptionist_adherent_plural$ glauben daran, dass Praktikabilität wichtiger als Reinheit ist – in dem Wissen, dass ein Glaube innerhalb feindlicher Systeme lebbar sein muss, um diese zu unterminieren. Eine grässliche Lüge beim Verfolgen edler Ziele wird als wertvoller betrachtet als tausend platte Wahrheiten."
 special_doctrine_adoptionist_school_radical_doctrine_name: "Radikale Schule"
 special_doctrine_adoptionist_school_radical_doctrine_desc: "Radikale $adoptionist_adherent_plural$ gestehen ein, dass es keinen Gott außer dem Vater gibt, und akzeptieren daher keine Göttlichkeit in sterblichem Fleisch – und sie erkennen keine $christianity_religion_adherent_plural$ außer sich selbst an. Um Christus zu empfangen, muss man mit dem #EMP vollständigen#! Wortlaut des Kanons übereinstimmen. Sonst riskiert man Ketzerei."
 doctrine_parameter_has_clerical_regions: "Hat [clerical_region|E]"
 special_doctrine_is_christian_faith_name: "Die Lehren Jesu"
 is_christian_faith_name: "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc: "Es gibt jene in der Welt, die sich an die Lehren Jesu halten, ohne ihn als göttlich zu betrachten. Es mag Blasphemie sein, doch wir sollten diesen fehlgeleiteten Seelen Mitgefühl entgegenbringen, da sie doch eines Tages zum wahren Glauben konvertieren könnten."
 special_doctrine_is_islamic_faith_name: "Die Lehren des Propheten"
 is_islamic_faith_name: "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc: "Obgleich sie nicht den Gesetzen des Propheten folgen, gibt es Menschen auf dieser Welt, die mehr von Allahs Willen geleitet sind, als sie wissen. Mit der Zeit könnten diese Halbkonvertiten sich sogar abwenden von ihren bösen Wegen und wahre Mitglieder der Umma werden!"
 special_doctrine_is_jewish_faith_name: "Die Lehren Mose"
 is_jewish_faith_name: "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc: "Nicht alle Gojim leben in Sünde. Es gibt auch jene, die Gottes auserwähltes Volk respektieren, und diese verdienen ihrerseits Respekt."
 prophecy_of_malachi_name: "Malachiasweissagung"
 special_doctrine_not_allowed_to_hof_name: "Priesterschaft zerschlagen"
 not_allowed_to_hof_name: "$special_doctrine_not_allowed_to_hof_name$"
 prophecy_of_malachi_desc: "Nach der traditionellen jüdischen Lehre kann ein neuer Hohepriester nur dann ernannt werden, wenn entweder der Prophet kommt oder wenn ein Nachkomme Aarons gefunden wird, der als Priester geeignet ist."
 special_doctrine_not_allowed_to_hof_desc: "Das Hohepriestertum dieses Glaubens wurde vollständig zerschlagen. Jeder Versuch, einen Hohepriester zu benennen, würde zunächst eine gründliche Wiederherstellung der traditionellen Kirchenstruktur erfordern."
 doctrine_parameter_block_from_create_hof_parameter: "Dieser Glaube kann sein [head_of_faith|E] unter gewöhnlichen Umständen nicht neu erschaffen."
 special_doctrine_is_eastern_faith_name: "Mehrreligiöse Verflechtungen"
 is_eastern_faith_name: "$special_doctrine_is_eastern_faith_name$"
 special_doctrine_is_eastern_faith_desc: "Zusammen sind wir nicht durch einen Glauben geeint, sondern durch viele Glauben, die das religiöse Geflecht unserer Gesellschaft bilden. Auch wenn wir uns viele verschiedene Namen geben und unterschiedlichen Pfaden folgen, haben doch einige von außerhalb unseres Glaubenssystem gelernt, in unserer Gesellschaft zu leben, als ob sie zu uns gehören würden."
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "Nicht-östliche [faiths|E] mit dem Grundsatz $tenet_eastern_syncretism_name$ gelten als [GetHostilityLevelName(TOKEN_PARAMETER.GetIntValue)|V] und nicht als $hostility_evil_tooltippable$"
 special_doctrine_is_sinitic_faith_name: "Sinitische Kosmologie"
 is_sinitic_faith_name: "$special_doctrine_is_sinitic_faith_name$"
 special_doctrine_is_sinitic_faith_desc: "$special_doctrine_is_eastern_faith_desc$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "Nicht-sinitische [faiths|E] mit dem Grundsatz $tenet_sinitic_syncretism_name$ gelten als [GetHostilityLevelName(TOKEN_PARAMETER.GetIntValue)|V] und nicht als $hostility_evil_tooltippable$"
 special_doctrine_is_gnostic_faith_name: "$tenet_gnosticism_name$"
 is_gnostic_faith_name: "$special_doctrine_is_gnostic_faith_name$"
 special_doctrine_is_gnostic_faith_desc: "$tenet_gnosticism_desc$"
 special_doctrine_fire_worship_name: "Heiliges Feuer"
 fire_worship_name: "$special_doctrine_fire_worship_name$"
 special_doctrine_fire_worship_desc: "Uns alle eint die Verehrung des Feuers, des reinsten Elements und Trägers der göttlichen Herrlichkeit. Es ist unsere heilige Pflicht, das ewige Feuer in der Welt am Leben zu halten, um Falschheit und Böses zu vertreiben."
 doctrine_parameter_same_hof_hostility_override: "Betrachtet andere [faiths|E], die ihr [head_of_faith|E] haben, als [GetHostilityLevelName(TOKEN_PARAMETER.GetIntValue)|V]"
 is_hostile_to_maitreya_name: "$maitreya$-Feindseligkeit"
 special_doctrine_maitreya_hostility_name: "Feindselig gegenüber $maitreya_adherent_plural$"
 special_doctrine_maitreya_hostility_descriptive_name: "Feindselig gegenüber $maitreya_adherent_plural$"
 special_doctrine_maitreya_hostility_desc: "Die $maitreya_adherent_plural$ wollen alle anderen Anhänger von Buddhas Lehren ausmerzen. Auch wenn nicht alle demselben Pfad folgen, ist die Lebensart der $maitreya$ unerträglich."
 special_doctrine_is_maitreya_name: "Ist $maitreya$"
 special_doctrine_is_maitreya_descriptive_name: "$maitreya_adj$e Ansicht zu Buddhas Lehren"
 special_doctrine_is_maitreya_desc: "Es ist unsere feierliche Pflicht, die Welt wiederaufzubauen und das Zeitalter des Maitreya-Buddha einzuleiten."
 #Internal, invisible classification doctrines used by portrait/appearance triggers.
 special_doctrine_is_western_christian_faith_name: "West-christlich"
 special_doctrine_is_western_christian_faith_desc: "Gehört zur westlichen (lateinischen) Tradition des Christentums."
 special_doctrine_is_eastern_christian_faith_name: "Ost-christlich"
 special_doctrine_is_eastern_christian_faith_desc: "Gehört zur östlichen Tradition des Christentums (orthodox, miaphysitisch, Kirche des Ostens, etc.)."
 christian_tradition_classification_name: "Christliche Tradition"
 preservation_name: "Bewahrung"
 doctrine_scriptural_name: "Heiligschriftlich"
 doctrine_scriptural_descriptive_name: "Heiligschriftliche Bewahrung"
 doctrine_scriptural_desc: "Die Reinheit der Doktrinen wird über Generationen hinweg bewahrt, indem man sich an eine zentrale Liste heiliger Schriften hält."
 doctrine_mythic_literary_name: "Mythisch-literarisch"
 doctrine_mythic_literary_descriptive_name: "Mythisch-literarische Bewahrung"
 doctrine_mythic_literary_desc: "Der Glaube verbreitet sich und hat Bestand durch Geschichten göttlichen Wirkens, von denen viele in literarischen Werken gesammelt werden."
 doctrine_oral_storytelling_name: "Mündliche Erzählungen"
 doctrine_oral_storytelling_desc: "Schöpfungsmythen und moralische Lektionen werden in beliebten Erzählungen verschlüsselt, die über Generationen und Kulturen hinweg erzählt werden."
 doctrine_monasticism_name: "$tenet_monasticism_name$"
 doctrine_monasticism_encouraged_name: "Ermutigt"
 doctrine_monasticism_encouraged_descriptive_name: "Mönchstum fördern"
 doctrine_monasticism_encouraged_desc: "$doctrine_monasticism_general_desc$"
 doctrine_monasticism_accepted_name: "Akzeptiert"
 doctrine_monasticism_accepted_descriptive_name: "Mönchstum annehmen"
 doctrine_monasticism_accepted_desc: "Ein Leben im Kloster ist erlaubt, aber kein zentraler Teil des Glaubens. Gläubige können Gelübde ablegen und sich in Häuser des Glaubens zurückziehen, doch die Tradition betont das Mönchstum nicht als idealen Weg."
 doctrine_monasticism_absent_name: "Abwesend"
 doctrine_monasticism_absent_descriptive_name: "Kein Mönchstum"
 doctrine_monasticism_absent_desc: "In dieser Tradition wurde ein Mönchstum nie eingeführt. Das religiöse Leben wird in der Welt geführt, und es gibt keinen formellen Weg, sich zurückzuziehen oder lebenslange Gelübde abzulegen."
 doctrine_monasticism_forbidden_name: "Verboten"
 doctrine_monasticism_forbidden_descriptive_name: "Mönchstum verbieten"
 doctrine_monasticism_forbidden_desc: "Dieser Glaube lehnt das Klosterleben ausdrücklich ab. Das Ablegen von Gelübden ist verboten, und jene mit der Eigenschaft „Klösterlich“ gelten in den Augen des Glaubens als Verbrecher."
 monasticism_group_name: "Mönchstum"
 doctrine_christianity_monasticism_latin_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Historischer Hintergrund für Mönchstum','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_greek_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Historischer Hintergrund für Mönchstum','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_default_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_default$\n\n[Glossary('Historischer Hintergrund für Mönchstum','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_monasticism_general_desc: "$tenet_monasticism_desc$\n\n[Glossary('Historischer Hintergrund für chstum','doctrine_monasticism_general_historical_desc')]"
 doctrine_monasticism_christianity_historical_desc: "Das Mönchstum verbreitete sich im Mittelalter durch die ganze katholische Welt, wobei Klöster überall in Europa, Nordafrika und dem Nahen Osten gegründet wurden. Mönche und Nonnen legten Gelübde der Armut, der Keuschheit und des Gehorsams ab und lebten entweder als Einsiedler in abgeschiedenen „Zellen“ oder nach strengen Regeln in klösterlichen Gemeinschaften. Diese Institutionen erfüllten vielfältige Aufgaben: die Bewahrung von Handschriften und antiken Texten, die Vermittlung von Bildung, den Unterhalt von Krankenhäusern und Hospizen, die Verwaltung landwirtschaftlicher Güter sowie die Gewährung von Gastfreundschaft für Reisende. Klosterorden wie die Benediktiner, Zisterzienser und Kartäuser entwickelten jeweils eigene Traditionen zu Gebet, Arbeit und gemeinschaftlichem Leben."
 doctrine_monasticism_general_historical_desc: "Klostergemeinschaften gibt es in vielen religiösen Traditionen, nicht nur im Christentum, sondern auch im Buddhismus, Hinduismus und Jainismus. Diese Institutionen zeichnen sich üblicherweise dadurch aus, dass sich Einzelpersonen aus der weltlichen Gesellschaft zurückziehen, um sich durch Gebet, Meditation, Studium und asketische Praktiken der religiösen Hingabe zu widmen.\n\nKlöster dienen häufig als Bildungszentren, indem sie heilige Texte bewahren und Wissen vermitteln. Dabei können sie entweder vollständig von der umliegenden Bevölkerung abgeschottet sein oder aber durch wohltätige Werke, medizinische Versorgung und landwirtschaftlichen Anbau tatkräftig am gesellschaftlichen Leben teilhaben. Die spezifischen Regeln, die das Klosterleben bestimmen, unterscheiden sich je nach Tradition und einzelner Gemeinschaft erheblich."
 sacraments_group_name: "Sakramente"
 doctrine_sacraments_central_name: "Zentral"
 doctrine_sacraments_central_desc: "$doctrine_sacraments_general_desc$"
 doctrine_sacraments_central_latin_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_latin$"
 doctrine_sacraments_central_greek_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_greek$"
 doctrine_sacraments_absent_name: "Keine Sakramente"
 doctrine_sacraments_absent_desc: "Diese Tradition betont weder die Sakramente noch ein formales System heiliger Riten. Das religiöse Leben dreht sich weder um die rituelle Verwaltung durch den Klerus noch um die Bedeutung bestimmter Zeremonien."
 doctrine_communion_historical_desc: "In der Nacht vor seiner Kreuzigung versammelte Christus seine Jünger zum Pessachmahl und verwandelte es. Er nahm das Brot, segnete es, brach es und reichte es ihnen mit den Worten: #weak Das ist mein Leib, der für euch hingegeben wird. Tut dies zu meinem Gedächtnis.#! Danach nahm er den Kelch mit Wein und erklärte ihn zu seinem Blut des Neuen Bundes, das zur Vergebung der Sünden vergossen werde.\n\nDiese Verwendung der Eucharistie beim Letzten Abendmahl wurde zum zentralen Akt des christlichen Gottesdienstes, der in jeder Messe und göttlichen Liturgie wiederholt wird. Für die Gläubigen ist die Kommunion nicht bloß ein Gedächtnismahl, sondern eine Teilhabe am Opfer Christi, bei der die Gläubigen mit ihrem Erlöser sowie untereinander vereint werden."
 doctrine_sacraments_general_desc: "Der Glaube misst den Sakramenten und heiligen Riten zentrale Bedeutung bei. Rituale sind nicht bloß symbolisch, sondern beschwören die Gegenwart des Göttlichen herauf. Der Klerus spendet sie, und Gläubige können exkommuniziert werden."
