 doctrine_deviancy_crime_name: "Verboten"
 doctrine_deviancy_crime_descriptive_name: "Verbrecherische Perversion"
 doctrine_deviancy_crime_desc: "Es ist doch klar, dass es nur eine richtige Art zu lieben gibt. Alle Perversionen dieses Ideals sind sündig und sollten bestraft werden."
 doctrine_deviancy_shunned_name: "Verpönt"
 doctrine_deviancy_shunned_descriptive_name: "Verpönte Perversion"
 doctrine_deviancy_shunned_desc: "Es gibt viele sexuelle Praktiken, die einfach abnorm und merkwürdig sind. Daraus folgt dann, dass Menschen, die solche Triebe haben, ebenfalls abnorm und merkwürdig sein müssen."
 doctrine_deviancy_accepted_name: "Akzeptiert"
 doctrine_deviancy_accepted_descriptive_name: "Akzeptierte Perversion"
 doctrine_deviancy_accepted_desc: "Liebe ist etwas Wunderschönes und Heiliges, ganz gleich, welche Form sie auch hat. Jeder sollte lieben und tun können, was er will."
 doctrine_deviancy_virtuous_name: "Tugendhaft"
 doctrine_deviancy_virtuous_descriptive_name: "Tugendhafte Perversion"
 doctrine_deviancy_virtuous_desc: "Die Freuden des Fleisches bringen uns dem Göttlichen näher, und so sind diejenigen, die nicht von herkömmlichen Begierden gefesselt sind, der Gipfel der Tugend in unserem Glauben."
 doctrine_parameter_deviancy_illegal: "Charaktere mit der [trait|E] [GetTrait('deviant').GetName(GetPlayer)] sind [criminals|E]"
 doctrine_parameter_deviancy_shunned: "Charaktere mit der [trait|E] [GetTrait('deviant').GetName(GetPlayer)] sind [shunned|E]"
 doctrine_parameter_deviancy_accepted: "Charaktere mit der [trait|E] [GetTrait('deviant').GetName(GetPlayer)] werden voll akzeptiert"
 doctrine_witchcraft_name: "Hexerei"
 doctrine_witchcraft_crime_name: "Verboten"
 doctrine_witchcraft_crime_descriptive_name: "Verbrecherische Hexerei"
 doctrine_witchcraft_crime_desc: "Nur das Göttliche hat das Recht, Wunder auf Erden zu wirken. Jeder, der den lästerlichen Versuch unternimmt, es ihm gleichzutun, soll für diese Anmaßung und Hoffart bestraft werden."
 doctrine_witchcraft_shunned_name: "Verpönt"
 doctrine_witchcraft_shunned_descriptive_name: "Verpönte Hexerei"
 doctrine_witchcraft_shunned_desc: "Das Göttliche hat die rechtmäßige Herrschaft über die übernatürlichen Kräfte dieser Welt. Daher ist jeder Versuch, diese Kräfte dem Willen eines Sterblichen zu unterwerfen, von Grund auf fehlgeleitet."
 doctrine_witchcraft_accepted_name: "Akzeptiert"
 doctrine_witchcraft_accepted_descriptive_name: "Akzeptierte Hexerei"
 doctrine_witchcraft_accepted_desc: "Magie erfüllt die Welt um uns herum, und es ist unser Recht und unser Privileg, uns ihr so zuzuwenden, wie es unsere Ahnen taten."
 doctrine_witchcraft_virtuous_name: "Tugendhaft"
 doctrine_witchcraft_virtuous_descriptive_name: "Tugendhafte Hexerei"
 doctrine_witchcraft_virtuous_desc: "Die Ausübung der Hexerei bedeutet, die eigene Seele vor bösen Geistern in Gefahr zu bringen. Für ihre Tapferkeit in diesem notwendigen Aspekt der Reinhaltung unserer eigenen Seelen sind Hexen verehrenswert."
 doctrine_parameter_witchcraft_illegal: "Charaktere mit der [trait|E] [GetTrait('witch').GetName(GetPlayer)] sind [criminals|E]"
 doctrine_parameter_witchcraft_shunned: "Charaktere mit der [trait|E] [GetTrait('witch').GetName(GetPlayer)] sind [shunned|E]"
 doctrine_parameter_witchcraft_accepted: "Charaktere mit der [trait|E] [GetTrait('witch').GetName(GetPlayer)] werden voll akzeptiert"
 witchcraft_illegal_name: "Doktrin „Verbrecherische Hexerei“"
 witchcraft_shunned_name: "Doktrin „Verpönte Hexerei“"
 doctrine_head_of_faith_name: "Glaubensoberhaupt"
 doctrine_head_of_faith_desc: "Das [head_of_faith|E] ist der Anführer eines [Concept('faith', 'Glaubens')|E]."
 doctrine_no_head_name: "Keines"
 doctrine_no_head_descriptive_name: "Kein Glaubensoberhaupt"
 doctrine_no_head_desc: "Es ist eine große Torheit, davon auszugehen, dass ein einziger Mensch den Willen von [ROOT.Faith.HighGodName] wirklich verstehen kann. Wir müssen daher in allem, was das Göttliche für uns geplant hat, unseren eigenen Herzen folgen."
 doctrine_parameter_no_head_of_faith: "Hat kein [head_of_faith|E]"
 no_head_of_faith_name: "Keine [head_of_faith|E]-[doctrine|E]"
 doctrine_parameter_minimum_fervor: "Eifer kann nicht unter #V $VALUE|0$ %#! sinken"
 doctrine_spiritual_head_name: "Klerikal"
 doctrine_spiritual_head_descriptive_name: "Spirituelle Führung"
 doctrine_spiritual_head_desc: "Die körperliche und die spirituelle Welt unterscheiden sich. Wir müssen sicherstellen, dass die spirituelle Welt einen eigenen Anführer hat, der uns führt und unseren Glauben davor schützt, durch körperliche Triebe profan zu werden."
 doctrine_parameter_spiritual_head_of_faith: "Die Position des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] wird einem herausragenden Mitglied des Klerus übertragen"
 doctrine_parameter_spiritual_head_of_faith_claims: "Das [head_of_faith|E] kann [claims|E] auf landbesitzende Titel an fromme Anhänger vergeben"
 doctrine_parameter_spiritual_head_of_faith_gold: "Das [head_of_faith|E] kann [gold|E] an fromme Anhänger vergeben"
 doctrine_temporal_head_name: "Weltlich"
 doctrine_temporal_head_descriptive_name: "Weltliche Führung"
 doctrine_parameter_temporal_head_of_faith: "Die Position des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] wird dem Gründer des [Concept('faiths', 'Glaubens')|E] verliehen und dann beim Tode an seinen [Concept('primary_heir', 'Haupterben')|E] weitergegeben."
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Wenn der Glaube [great_holy_wars|E] führt, kann das Glaubensoberhaupt diese lenken und das jeweilige Kriegsziel auswählen."
 doctrine_temporal_head_desc: "Das Spirituelle und das Körperliche sind untrennbar miteinander verbunden, gänzlich und unteilbar. Es wäre töricht, zwei Anführer für ein Reich zu haben."
 doctrine_marriage_type_name: "Heiratsarten"
 doctrine_monogamy_name: "Monogam"
 doctrine_monogamy_descriptive_name: "Monogamie"
 doctrine_monogamy_desc: "Ehen sind ein heiliges Band zwischen zwei Individuen. Ein solches Band zwischen mehreren Personen gleichzeitig zu knüpfen, wäre ein Sakrileg."
 doctrine_polygamy_name: "Polygam"
 doctrine_polygamy_descriptive_name: "Polygamie"
 doctrine_polygamy_desc: "Da die Ehe eine heilige Vereinigung ist, sind mehrere Ehen zwangsläufig heiliger als nur eine einzelne - zumindest wenn jede dieser Ehen auch selbst heilig ist."
 doctrine_concubines_name: "Konkubinen"
 doctrine_concubines_descriptive_name: "Konkubinat"
 doctrine_concubines_desc: "Die Ehe ist ein heiliger Bund, doch solange der Ehepartner klar Vorrang hat, darf man auch mit Konkubinen das Bett teilen."
 hostility_group_name: "Feindseligkeiten"
 abrahamic_hostility_doctrine_name: "Abrahamitisch"
 abrahamic_hostility_doctrine_descriptive_name: "Buchreligions-Feindseligkeit"
 abrahamic_hostility_doctrine_desc: "Die folgenden Religionen gelten als Abrahamitisch:\n[GetReligionFamily('rf_abrahamic').GetReligions]"
 pagan_hostility_doctrine_name: "Heidnisch"
 pagan_hostility_doctrine_descriptive_name: "Heidnische Feindseligkeit"
 pagan_hostility_doctrine_desc: "Die folgenden Religionen gelten als Heidnisch:\n[GetReligionFamily('rf_pagan').GetReligions]"
 eastern_hostility_doctrine_name: "Dharmisch"
 eastern_hostility_doctrine_descriptive_name: "Dharmische Feindseligkeit"
 eastern_hostility_doctrine_desc: "Die folgenden Religionen gelten als dharmisch:\n[GetReligionFamily('rf_eastern').GetReligions]"
 sinitic_hostility_doctrine_name: "Sinitisch"
 sinitic_hostility_doctrine_descriptive_name: "Sinitische Feindseligkeit"
 sinitic_hostility_doctrine_desc: "Die folgenden Religionen gelten als sinitisch:\n[GetReligionFamily('rf_sinitic').GetReligions]"
 special_tolerance_name: "Sondertoleranz"
 special_doctrine_ecumenical_christian_name: "Ökumene"
 special_doctrine_ecumenical_christian_desc: "Unsere religiösen Führer haben sich historisch um den glaubensübergreifenden Austausch bemüht und so das Zusammenwirken verschiedener christlicher Konfessionen gestärkt."
 special_doctrine_ecumenical_miaphysite_name: "Miaphysitische Kommunion"
 special_doctrine_ecumenical_miaphysite_desc: "Trotz ihrer getrennten Hierarchien bleiben die miaphysitischen Kirchen in voller Kommunion und erkennen Sakramente und Klerus der jeweils anderen an."
 #Doctrine is invisible, but still needs these keys
 special_doctrine_has_clerical_electors_name: "Kirchenwahlleute"
 special_doctrine_has_clerical_electors_desc: "Dieser [faith|E] wählt sein [head_of_faith|E] durch [cardinals|E]."
 has_clerical_electors_name: "Kirchenwahlleute"
 special_doctrine_full_tolerance_name: "Volle Toleranz"
 full_tolerance_name: "$special_doctrine_full_tolerance_name$"
 special_doctrine_full_tolerance_desc: "Jeder kann sich frei den eigenen Glauben auswählen. Unsere Unterschiede teilen uns nicht, sondern machen uns stärker."
 nudity_doctrine_name: "Haltung zur Nacktheit"
 special_doctrine_naked_priests_name: "Nackte Priester"
 special_doctrine_naked_priests_descriptive_name: "$special_doctrine_naked_priests_name$"
 special_doctrine_naked_priests_desc: "Unsere Priester wissen, dass Kleidung den Geist gefangen hält und uns daran hindert, wahre Erleuchtung zu erlangen. Erst wenn wir unsere Kluft ablegen, können wir unsere Seelen erwecken und die wahre Liebe von [ROOT.Faith.HighGodName] erfahren."
 doctrine_parameter_naked_priests_active: "Priester und religiös eifernde Charaktere tragen keine Kleidung."
 doctrine_gender_name: "Geschlechterrollen"
 doctrine_gender_male_dominated_name: "Männlich dominiert"
 doctrine_gender_male_dominated_descriptive_name: "Männlich dominierte Gesellschaft"
 doctrine_gender_male_dominated_desc: "Männer sind stärker und besser gerüstet, um uns in dieser harten und gnadenlosen Welt zu führen. Daher sollten wir ihnen die Herrschaft über unsere Gesellschaft anvertrauen."
 doctrine_gender_equal_name: "Gleichberechtigt"
 doctrine_gender_equal_descriptive_name: "Geschlechtergleichheit"
 doctrine_gender_equal_desc: "Es wäre eine Torheit, bestreiten zu wollen, dass eine Begabung für die Regierungsgeschäfte sich nur im Geschlecht gründet. Wir sollten allen, die dazu in der Lage sind, erlauben, unsere Gesellschaft zu regieren."
 doctrine_gender_female_dominated_name: "Weiblich dominiert"
 doctrine_gender_female_dominated_descriptive_name: "Weiblich dominierte Gesellschaft"
 doctrine_gender_female_dominated_desc: "Frauen haben immer wieder bewiesen, dass sie die nötige Weisheit und Umsicht haben, um unsere Gesellschaft vernünftig zu führen."
 doctrine_divorce_name: "Haltung zur Ehescheidung"
 doctrine_divorce_disallowed_name: "Verboten"
 doctrine_divorce_disallowed_descriptive_name: "Verbotene Ehescheidung"
 doctrine_divorce_disallowed_desc: "Das Ehegelübde ist endgültig und bindend. Nur der Tod kann es scheiden."
 doctrine_divorce_approval_name: "Erfordert Zustimmung"
 doctrine_divorce_approval_descriptive_name: "Bedingte Ehescheidungserlaubnis"
 doctrine_divorce_approval_desc: "Die Bande der Ehe sollte man nicht leichtfertig eingehen, doch außerordentliche Umstände können eine Ehescheidung notwendig machen."
 doctrine_divorce_allowed_name: "Erlaubt"
 doctrine_divorce_allowed_descriptive_name: "Durchgängig erlaubte Ehescheidung"
 doctrine_divorce_allowed_desc: "Die Heirat ist nur eine Partnerschaft zwischen zwei Menschen, und wie jede Partnerschaft kann man sie nach Belieben beenden."
 doctrine_parameter_divorce_disallowed: "Charaktere können sich niemals von ihrem [spouse|E] [divorce|E] lassen"
 doctrine_parameter_divorce_approval: "Charaktere dürfen sich von ihrem [spouse|E] [divorce|E] lassen, wenn das spirituelle [head_of_faith|E] zustimmt (oder das [house_head|E], wenn es kein klerikales Glaubensoberhaupt gibt)"
 doctrine_parameter_divorce_allowed: "Charaktere dürfen sich jederzeit von [Concept('spouse', 'Ehepartnern')|E] [Concept('divorce', 'Scheiden')|E] lassen, wenn sie [piety|E] dafür bezahlen"
 doctrine_bastardry_name: "Haltung zu Bastarden"
 doctrine_bastardry_none_name: "Keine Bastarde"
 doctrine_bastardry_none_descriptive_name: "Durchgängig legitime Bastarde"
 doctrine_bastardry_none_desc: "Das Blut bestimmt die Abstammung, nicht die Heirat. Kinder, die außerhalb einer Ehe geboren werden, sind ebenso legitim wie alle anderen auch."
 doctrine_bastardry_legitimization_name: "Legitimierung"
 doctrine_bastardry_legitimization_descriptive_name: "Legitimierung von Bastarden"
 doctrine_bastardry_legitimization_desc: "Die Ehe ist heilig. Daher müssen Kinder, die außerehelich geboren werden, erst eigens gesegnet werden, damit sie als legitim gelten."
 doctrine_bastardry_all_name: "Keine Legitimierung"
 doctrine_bastardry_all_descriptive_name: "Illegitimes Bastarddasein"
 doctrine_bastardry_all_desc: "Die Bande der Ehe sind unantastbar und außerehelich geborene Kinder immer illegitim."
 doctrine_parameter_bastards_none: "Es gibt keine [bastards|E]; alle Kinder sind gleichermaßen [legitimate|E]"
 doctrine_parameter_bastards_legitimize: "[bastards|E] können legitimiert werden, wenn das [house_head|E] oder [dynast|E] zustimmt"
 doctrine_parameter_bastards_always: "[bastards|E] können nie legitimiert werden"
 doctrine_adultery_men_name: "Männlicher Ehebruch"
 doctrine_adultery_men_crime_name: "Verboten"
 doctrine_adultery_men_crime_descriptive_name: "Verbrecherischer männlicher Ehebruch"
 doctrine_adultery_men_crime_desc: "Es ist ein Verbrechen, wenn Männer außerehelichen Verkehr haben - und dafür sollten sie auch entsprechend bestraft werden."
 doctrine_adultery_men_shunned_name: "Verpönt"
 doctrine_adultery_men_shunned_descriptive_name: "Verpönter männlicher Ehebruch"
 doctrine_adultery_men_shunned_desc: "Es mag sündig sein, wenn Männer außerehelichen Verkehr haben, doch wie bei allen Sünden muss doch schlussendlich das Göttliche über solche Fehler richten."
 doctrine_adultery_men_accepted_name: "Akzeptiert"
 doctrine_adultery_men_accepted_descriptive_name: "Akzeptierter männlicher Ehebruch"
 doctrine_adultery_men_accepted_desc: "Es ist nichts grundsätzlich Falsches daran, wenn Männer außerehelichen Verkehr haben. Die Entscheidung liegt folglich nur bei ihnen."
 doctrine_parameter_adultery_male_crime: "Männer mit der [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] sind [criminals|E]"
 doctrine_parameter_adultery_male_shunned: "Männer mit der [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] werden [shunned|E]"
 doctrine_parameter_adultery_male_accepted: "Männer mit der [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] werden voll akzeptiert"
 doctrine_adultery_women_name: "Weiblicher Ehebruch"
 doctrine_adultery_women_crime_name: "Verboten"
 doctrine_adultery_women_crime_descriptive_name: "Verbrecherischer weiblicher Ehebruch"
 doctrine_adultery_women_crime_desc: "Es ist ein Verbrechen, wenn Frauen außerehelichen Verkehr haben - und dafür sollten sie auch entsprechend bestraft werden."
 doctrine_adultery_women_shunned_name: "Verpönt"
 doctrine_adultery_women_shunned_descriptive_name: "Verpönter weiblicher Ehebruch"
 doctrine_adultery_women_shunned_desc: "Es mag sündig sein, wenn Frauen außerehelichen Verkehr haben, doch wie bei allen Sünden muss doch schlussendlich das Göttliche über solche Fehler richten."
 doctrine_adultery_women_accepted_name: "Akzeptiert"
 doctrine_adultery_women_accepted_descriptive_name: "Akzeptierter weiblicher Ehebruch"
 doctrine_adultery_women_accepted_desc: "Es ist nichts grundsätzlich Falsches daran, wenn Frauen außerehelichen Verkehr haben. Die Entscheidung liegt folglich nur bei ihnen."
 doctrine_parameter_adultery_female_crime: "Frauen mit der [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] sind [criminals|E]"
 doctrine_parameter_adultery_female_shunned: "Frauen mit der [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] werden [shunned|E]"
 doctrine_parameter_adultery_female_accepted: "Frauen mit der [trait|E] [GetTrait('adulterer').GetName(GetNullCharacter)] oder [GetTrait('fornicator').GetName(GetNullCharacter)] werden voll akzeptiert"
 doctrine_kinslaying_name: "Verwandtenmord"
 doctrine_kinslaying_any_dynasty_member_crime_name: "Dynastisch ist verboten"
 doctrine_kinslaying_any_dynasty_member_crime_descriptive_name: "Verbrecherischer Verwandtenmord in der Dynastie"
 doctrine_kinslaying_any_dynasty_member_crime_desc: "Alle Verwandten sind durch Blut verbunden, und selbst einen weiteren Verwandten zu töten, ist ein schweres Verbrechen gegen die ganze Dynastie. Solche Vergehen werden nicht vergessen werden."
 doctrine_parameter_kinslaying_any_dynasty_member_crime: "[kinslayers|E] mit der [trait|E] [GetTrait('kinslayer_1').GetName(GetPlayer)] oder schlimmer sind [criminals|E] in den Augen ihrer [dynasty|E]"
 doctrine_parameter_kinslaying_extended_family_crime: "[kinslayers|E] mit der [trait|E] [GetTrait('kinslayer_2').GetName(GetPlayer)] oder schlimmer sind [criminals|E] in den Augen ihrer [dynasty|E]"
 doctrine_parameter_kinslaying_close_kin_crime: "[kinslayers|E] mit der [trait|E] [GetTrait('kinslayer_3').GetName(GetPlayer)] sind [criminals|E] in den Augen ihrer [dynasty|E]"
 doctrine_parameter_kinslaying_shunned: "[kinslayers|E] sind [shunned|E]"
 doctrine_parameter_kinslaying_accepted: "Charaktere, die Verwandte töten, gelten nicht als [kinslayers|E]"
 doctrine_kinslaying_extended_family_crime_name: "Familiär ist verboten"
 doctrine_kinslaying_extended_family_crime_descriptive_name: "Verbrecherischer Verwandtenmord in der Familie"
 doctrine_kinslaying_extended_family_crime_desc: "Ein Mord an der eigenen Familie ist das abscheulichste Verbrechen, das man begehen kann. Wer so etwas tut, muss schwer bestraft werden."
 doctrine_kinslaying_close_kin_crime_name: "Keine nahen Verwandten"
 doctrine_kinslaying_close_kin_crime_descriptive_name: "Verbrecherischer Verwandtenmord an engen Verwandten"
 doctrine_kinslaying_close_kin_crime_desc: "Brudermorde und ähnliche Taten kann eine gerechte und rechtschaffene Gesellschaft nicht dulden. Wer eine solche Tat begeht, muss bestraft werden."
 doctrine_kinslaying_shunned_name: "Verpönt"
 doctrine_kinslaying_shunned_descriptive_name: "Verpönter Verwandtenmord"
 doctrine_kinslaying_shunned_desc: "Auch wenn ein Mord an den eigenen Verwandten schrecklich ist, ist es doch keine Tat, die grundsätzlich verbrecherischer als jeder andere Mord wäre."
 doctrine_kinslaying_accepted_name: "Akzeptiert"
 doctrine_kinslaying_accepted_descriptive_name: "Akzeptierter Verwandtenmord"
 doctrine_kinslaying_accepted_desc: "Der Mord an der eigenen Familie unterscheidet sich nicht von jedem anderen Mord und sollte auch genauso behandelt werden."
 kinslayer_crime_dynasty: "Verwandtenmörder"
 doctrine_consanguinity_name: "Haltung zum Inzest"
 doctrine_consanguinity_dynastic_name: "Linienverbot"
 doctrine_consanguinity_dynastic_descriptive_name: "Verbotene Heirat in der Dynastie"
 doctrine_consanguinity_dynastic_desc: "Es ist streng verboten, jemanden zu heiraten, mit dem man einen Nachnamen oder Vorfahren teilt, ungeachtet dessen, wie fern man auch verwandt sein mag. Zudem ist es nicht erlaubt, jene zu heiraten, die einen anderen Nachnamen, aber enge Blutsbande zu einem haben."
 doctrine_consanguinity_restricted_name: "Nahe Verwandte sind verboten"
 doctrine_consanguinity_restricted_descriptive_name: "Verbotene Heirat von engen Verwandten"
 doctrine_consanguinity_restricted_desc: "Es ist eine Sünde wider [ROOT.Faith.HighGodName], wenn zwei Verwandte einander heiraten oder einander beiwohnen."
 doctrine_parameter_consanguinity_restricted_marriage: "Die Ehe zwischen [extended_family_members|E] und [close_family_members|E] ist verboten"
 doctrine_parameter_consanguinity_restricted_close_kin_incest: "Der Beischlaf zwischen [extended_family_members|E] und [close_family_members|E] sorgt für das Inzest-[secret|E]"
 doctrine_consanguinity_cousins_name: "Vetternehen"
 doctrine_consanguinity_cousins_descriptive_name: "$doctrine_consanguinity_cousins_name$"
 doctrine_consanguinity_cousins_desc: "Cousins und Vettern sind zwar verwandt, doch ausreichend weit entfernt, dass sie heiraten können, um die Abstammung zu bewahren."
 doctrine_parameter_consanguinity_cousins_marriage: "Ehen zwischen Cousins sind erlaubt"
 doctrine_parameter_consanguinity_cousins_incest: "Der Beischlaf zwischen Cousins sorgt nicht für das Inzest-[secret|E]"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_name: "Onkelehen"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_descriptive_name: "$doctrine_consanguinity_aunt_nephew_and_uncle_niece_name$"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_desc: "Wenn sie nicht direkt verwandt sind, dürfen Familienmitglieder einander heiraten, solange es dem Wohl der Dynastie dient."
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_marriage: "Ehen zwischen Cousins, Tanten/Neffen und Onkel/Nichten sind erlaubt"
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_incest: "Der Beischlaf zwischen Cousins, Tanten/Neffen und Onkel/Nichten sorgt nicht für das Inzest-[secret|E]"
 doctrine_consanguinity_unrestricted_name: "Unbeschränkt"
 doctrine_consanguinity_unrestricted_descriptive_name: "$doctrine_consanguinity_unrestricted_name$"
 doctrine_consanguinity_unrestricted_desc: "Es ist ganz natürlich und gesund, dass Familienmitglieder einander lieben. Es wäre töricht, den Beischlaf davon auszuschließen."
 doctrine_parameter_consanguinity_unrestricted_marriage: "Ehen zwischen allen Familienmitgliedern sind erlaubt"
 doctrine_parameter_consanguinity_unrestricted_incest: "Der Beischlaf zwischen Familienmitgliedern sorgt nicht für das Inzest-[secret|E]"
 doctrine_parameter_consanguinity_restricted_dynastic_marriage: "Heiraten zwischen Mitgliedern derselben [dynasty|E] sind verboten"
