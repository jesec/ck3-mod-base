 #Ṣadr al-Islām
 sadr_al_islam: "Sadr al-Islam"
 sadr_al_islam_adj: "Muslimisch"
 sadr_al_islam_adherent: "Muslim"
 sadr_al_islam_adherent_plural: "Muslime"
 sadr_al_islam_desc: "In ihrer reinsten Form – noch vor dem Aufkommen der Denkschulen in den darauffolgenden Jahren – wurden die Muslime vom Propheten selbst geleitet, gestützt auf göttliche Offenbarung. Seiner Sunna folgten die Gefährten und die Tabi’un der ersten Generationen."
 #Sunni
 sunni: "Sunni"
 sunni_adj: "Sunnitisch"
 sunni_adherent: "Sunnit"
 sunni_adherent_plural: "Sunniten"
 sunni_desc: "Als Sunniten bezeichnet man die Anhänger der Praktiken Mohammeds, die als Sunna bekannt sind. Die sunnitische islamische Rechtswissenschaft stützt sich als grundlegende Quellen vorrangig auf den Koran, die Hadithe und das Idschmā’ (den Gelehrtenkonsens)."
 #Shia
 shia: "Schia"
 shia_adj: "Schiitisch"
 shia_adherent: "Schiit"
 shia_adherent_plural: "Schiiten"
 shia_desc: "Laut dieser Strömung des Islam soll die Führung innerhalb der Familie des Propheten Mohammed verbleiben und durch göttlich geleitete Imame weitergegeben werden. Sie konzentriert sich auf die Ergebenheit gegenüber dem Haus des Propheten."
 islam_shia_priest: "Mullah"
 islam_shia_priest_plural: "Mullahs"
 islam_shia_religious_head_title: "Imam"
 islam_shia_religious_head_title_name: "Imamat"
 #Kharijite
 kharijite: "Charidschitentum"
 kharijite_adj: "Charidschitisch"
 kharijite_adherent: "Charidschit"
 kharijite_adherent_plural: "Charidschiten"
 kharijite_desc: "Diese frühislamische Gruppe vertrat die Ansicht, Führung solle auf Frömmigkeit und nicht auf Abstammung beruhen und dass sündhafte Herrscher abgesetzt werden könnten. Sie trat während der schiitischen Unruhen in Erscheinung, lehnte beide Seiten ab und erklärte schwere Sünder für außerhalb des Islam stehend."
 #Masmudism
 masmudi: "Almohadismus"
 masmudi_adj: "Almohadisch"
 masmudi_adherent: "Almohade"
 masmudi_adherent_plural: "Almohaden"
 masmudi_desc: "Ein reformistischer Zweig des sunnitischen Islam, dessen Ursprünge bei den Berberstämmen Nordafrikas liegen. Die almohadische Bewegung wollte ihre Religion einen und predigte eine Doktrin des strengen, reinen Monotheismus."
 masmudi_religious_head_title: "Kalif"
 masmudi_religious_head_title_name: "Kalifat"
 #Quranism
 quranist: "Koranismus"
 quranist_adj: "Koranitisch"
 quranist_adherent: "Koranist"
 quranist_adherent_plural: "Koranisten"
 quranist_desc: "Eine schriftgläubige Auslegung des Islams, die betont, dass man den Koran als einzige Quelle göttlicher Weisheit strengstens befolgen und Hadithe und Fatwas ignorieren sollte."
 #Druze
 druze: "Drusentum"
 druze_adj: "Drusisch"
 druze_adherent: "Druse"
 druze_adherent_plural: "Drusen"
 druze_desc: "Der drusische Glauben, der der Gegend um den Berg Dschabal ad-Duruz entstammt, folgt vielen Prinzipien des Ismailismus, birgt jedoch auch gnostische Überzeugen in seiner esoterischen Theologie in sich, die sich um die Wahrheit der Existenz dreht."
 druze_religious_text: "Sendschreiben der Weisheit"
 druze_religious_text_2: "$druze_religious_text$" #Optional translation alt
 druze_religious_text_3: "$druze_religious_text$" #Optional translation alt
