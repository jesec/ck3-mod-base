 islam_religion_adherent_plural: "Muslime"
 islam_religion_desc: "Der Islam ist die letzte Offenbarung des abrahamitischen Glaubens, wie sie durch das Wort Gottes gelenkt und durch den Propheten Mohammed enthüllt wurde. Der Islam dreht sich darum, in Diensten des einen und einzigen gnädigen Gottes ein gutes Leben zu führen."
