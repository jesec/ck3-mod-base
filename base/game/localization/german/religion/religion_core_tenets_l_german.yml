 tenet_eastern_syncretism_name: "$rf_eastern$er Synkretismus"
 tenet_eastern_syncretism_desc: "Der tolerante Umgang, den die unterschiedlichen dharmischen Religionen miteinander pflegen, kann uns durchaus als Vorbild dienen. Sie mögen nicht dem wahren Glauben folgen, doch dies macht sie nicht zwangsläufig böse."
