 tenet_islamic_syncretism_name: "Islamischer Synkretismus"
 tenet_islamic_syncretism_desc: "Die Worte des Propheten sind unbestreitbar weise und gerecht, und wie immer unsere anderen Zweifel auch aussehen mögen: Sein Denken und Handeln sollten wir achten."
