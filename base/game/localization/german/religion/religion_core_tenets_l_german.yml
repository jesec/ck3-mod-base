 tenet_religious_fatwa_cost_tooltip: "Fatwa: #P -10 %#!"
 tenet_religious_halakha_cost_tooltip: "Halacha: #P -10 %#!"
 tenet_false_conversion_sanction_name: "Gebilligte Scheinbekehrung"
 tenet_temporal_condemnation_taqiya: "Taqiya"
 tenet_anusim: "Anusim"
 tenet_false_conversion_sanction_desc: "Wenn das eigene Leben bedroht wird, ist es hinnehmbar, sich zu einem falschen Glauben zu bekennen, solange man die Wahrheit im Herzen bewahrt."
 doctrine_parameter_sanctioned_false_conversion_county_resistance: "Bekehrungswiderstand von Gemeinden: #P +30 %#!"
 doctrine_parameter_sanctioned_false_conversion: "[characters|E] und [counties|E] können manchmal zu diesem [Concept('faith', 'Glauben')|E] zurückkonvertieren, wenn sie fehlgeleitet werden"
 doctrine_parameter_tenet_false_conversion_sanction_elusive: "Ihr seid schwerer [Concept('imprison', 'einzukerkern')|E] und entkommt sehr viel wahrscheinlicher aus dem [prison|E]"
 tenet_tax_nonbelievers_name: "Besteuerung der Ungläubigen"
 tenet_tax_nonbelievers_desc: "Der Wehrdienst ist den Gläubigen vorbehalten, wohingegen alle Ungläubigen eine Steuer für den Schutz zu entrichten haben, der ihnen gewährt wird."
 tenet_tax_nonbelievers_jizya_name: "Dschizya"
 tenet_literalism_name: "Literalsinn"
 tenet_literalism_desc: "Unsere heiligen Texte geben ganz klar den göttlichen Willen wieder; menschliche Auslegungen haben daher nur einen begrenzten Wert."
 doctrine_parameter_literalist_debate_enabled: "Kann mit den Fürsten des Reichs debattieren, was [opinion|E] kostet, wodurch man aber @piety_icon![piety|E] gewinnen oder verlieren kann"
 doctrine_parameter_tenet_literalism_conversion_resistance: "[characters|E] dieses [Concept('faith', 'Glaubens')|E] werden weniger wahrscheinlich von ihm weg bekehrt"
 doctrine_parameter_literalism_holy_war_cb_active: "Gewährt einen [holy_war|E]-[casus_belli|E] gegen [characters|E] derselben [religion|E], deren [rite|E] diesen Grundsatz nicht hat"
 doctrine_parameter_tenet_literalism_debate_experience: "Eine Debatte zu gewinnen, gewährt [Concept('learning', 'Bildungs')|E]-[experience|E]"
 doctrine_parameter_tenet_literalism_scholar_conversion: "Während Ihr die [trait|E] [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] habt, ist „[convert_county|E]“ schneller und [characters|E] nehmen wahrscheinlicher die Bekehrung an"
 doctrine_parameter_tenet_literalism_scholar_trait: "Erhält die [trait|E]: [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)]"
 tenet_legalism_name: "Rechtfertigungslehre"
 tenet_legalism_desc: "Unsere Gesetze entstanden durch Generationen der Weisheit und Hingabe. Sich an sie zu halten, ist von Natur aus fromm. Ein Sünder, wer er auch sein mag, wird daher nie über dem Gesetz stehen können."
 doctrine_parameter_legalism_reduced_faction_virtues: "[vassals|E] und [counties|E] schließen sich mit kleiner Wahrscheinlichkeit [factions|E] gegen einen [Concept('virtuous', 'tugendhaften')|E] Herrscher an"
 doctrine_parameter_legalism_increased_faction_sins: "[vassals|E] und [counties|E] schließen sich mit größerer Wahrscheinlichkeit [factions|E] gegen einen [Concept('sinful', 'sündhaften')|E] Herrscher an"
 doctrine_parameter_tenet_legalism_sinful_revocation: "Das Aberkennen von Titeln bei [Concept('sinful', 'sündhaften')|E] [vassals|E] verursacht keine [tyranny|E]"
 doctrine_parameter_tenet_legalism_title_integration: "[councillor_tasks|E]-Tempo von „$task_promote_culture$“: #P +100 %#!"
 doctrine_parameter_tenet_legalism_lawful_authority: "Eure Forderungen zum Widerruf von [Concept('titles','Titeln')|E], [imprison|EU] oder [retract|EU] von [vassals|E] werden wahrscheinlicher angenommen"
