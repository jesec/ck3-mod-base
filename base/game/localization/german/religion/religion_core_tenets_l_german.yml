 doctrine_parameter_tenet_sacred_shadows_intrigue_scheme_fulfillment: "Zuwachs der @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','spirituellen Erfüllung')|El] durch den erfolgreichen Abschluss von [intrigue|E]-[Concept('schemes', 'Komplotten')|E]"
 tenet_pursuit_of_power_name: "Machtstreben"
 tenet_pursuit_of_power_desc: "Was gerecht oder ungerecht ist, ist wandelbar und wird nur von jenen bestimmt, die an der Macht sind. Daraus folgt, dass nur das Streben nach Macht wirklich gerecht sein kann."
 doctrine_parameter_tenet_pursuit_of_power_war_victory_fulfillment: "Kriege zu gewinnen, gewährt @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_pursuit_of_power_become_conqueror: "Erlaubt die [decision|E]: $pursue_conquerors_mantle_decision$"
 tenet_pastoral_isolation_name: "Ländliche Abgeschiedenheit"
 tenet_pastoral_isolation_desc: "Wir wollen nur in Ruhe gelassen werden. Unsere Praktiken sind unser und gehen niemand anderen etwas an, ebenso wie deren Praktiken uns nichts angehen."
 doctrine_parameter_unattractive_for_character_conversions: "[characters|E] lassen sich leichter zu diesem [Concept('faith', 'Glauben')|E] bekehren"
 tenet_natural_primitivism_name: "Natürlicher Primitivismus"
 tenet_natural_primitivism_desc: "Zivilisation ist ein unnatürlicher, nutzloser und blasphemischer Versuch des Menschen, der an sich ungeordneten Schöpfung eine Ordnung aufzuzwingen. Wir legen Gewand, Rank, Gesetz und höfische Eitelkeit ab, um zu leben wie unsere höchsten Mächte ([ROOT.Rite.GetFaith.PantheonTerm]) es wollten: wild, schlicht und frei."
 doctrine_parameter_naked_adherents_active: "Anhänger tragen keine Kleidung"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Kosten für Gesetze: #N +50 %#!"
 doctrine_parameter_tenet_natural_primitivism_promote_naturism_decision: "Erlaubt die [decision|E]: #V Natürliche Freiheit annehmen#!"
 doctrine_parameter_unlock_jizya_contract: "Schaltet Dschizya-[vassal_contract|E] und -[tax_decree|E] frei"
 #FP3 tenets
 tenet_communal_possessions_name: "Kommunaler Besitz"
 tenet_communal_possessions_desc: "Die höchste Macht ([ROOT.Rite.GetFaith.HighGodName]) hat für uns alle einen gleichen Anteil an den Reichtümern der Erde vorgesehen. Wir sollten alle Dinge gemeinsam besitzen und den gestohlenen Reichtum der Mächtigen umverteilen."
 doctrine_parameter_piety_from_gifts_active: "@piety_icon![piety|E] erhalten, wenn man [gifts|E] schickt und [artifacts|E] verschenkt"
 doctrine_parameter_piety_from_marrying_lowborn_active: "Herrscher erhalten @piety_icon![piety|E] durch die Heirat mit [Concept('characters','Charakteren')|E] von [Concept('lowborn', 'niederer Geburt')|E] und verlieren keine @legitimacy_icon![legitimacy|E] dafür"
