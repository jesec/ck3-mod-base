 tenet_jewish_syncretism_desc: "Obwohl wir ihren Behauptungen nicht zustimmen, was das auserwählte Volk Gottes anbelangt, ist die Weisheit der jüdischen Tora unbestritten, und es gibt vieles, was die Schrift uns lehren kann."
 doctrine_parameter_jewish_syncretic_actor_opinion_active: "Gegenseitiger [Concept('opinion', 'Meinungs')|E]-Bonus von $VALUE|=+0$ bei [faiths|E], die den [core_tenet|E] $tenet_jewish_syncretism_name$ haben"
