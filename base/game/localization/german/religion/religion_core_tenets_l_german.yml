 doctrine_parameter_tenet_astrology_albino_omen: "[GetTrait('albino').GetName(GetNullCharacter)]-[characters|E]: #P +10#! allgemeine [opinion|E], #P +20#! [opinion|E] beim selben Glauben, #P +30 %#! @piety_icon![Concept('piety', 'Frömmigkeits')|E]-Zuwachs"
 doctrine_parameter_tenet_astrology_scaly_omen: "[GetTrait('scary').GetName(GetNullCharacter)|U]e [characters|E]: #P +15#! [Concept('attraction', 'Anziehungs')|E]-[opinion|E], #P +10#! [Concept('vassal', 'Vasallen')|E]-[opinion|E], #P +30 %#! @piety_icon![Concept('piety', 'Frömmigkeits')|E]-Zuwachs"
