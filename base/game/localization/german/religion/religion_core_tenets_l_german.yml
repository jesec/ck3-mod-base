 LEGALISM_LAWFUL_AUTHORITY_REASON: "$tenet_legalism_name$: $VALUE|=+$"
 tenet_reincarnation_name: "Reinkarnation"
 tenet_reincarnation_desc: "Wir haben viele Leben vor diesem geführt und werden auch viele Leben nach diesem führen. Jeder Tod ist nur der Anfang von etwas Neuem."
 tenet_reincarnation_zoroastrian_name: "Raj’a"
 tenet_reincarnation_zoroastrian_desc: "Ebenso wie Götter in menschlichen Körpern inkarnieren können, können auch wir wiedergeboren werden. Die Guten werden mit einer Gestalt voller Schönheit und Reinheit belohnt und können schließlich zu Engeln aus reinem Licht werden."
 doctrine_parameter_reincarnation_resistance_to_conversion: "Bekehrungswiderstand von Gemeinden: #P +20 %#!"
 doctrine_parameter_reincarnation_events_active: "Kinder haben die Chance, als Reinkarnation eines Ahnen erkannt zu werden, wodurch sie die [trait|E] [GetTrait('reincarnation').GetName(GetNullCharacter)] erhalten"
 doctrine_parameter_tenet_reincarnation_trigger_decision: "Erlaubt die [decision|E]: $tgp_divine_reincarnation_decision$ "
 doctrine_parameter_tenet_reincarnation_piety_level_courage: "Auf [piety_level|E] 3 oder höher, erhaltet Ihr [GetTrait('brave').GetName(GetNullCharacter)|l] oder verliert [GetTrait('craven').GetName(GetNullCharacter)|l]"
 pam_reincarnation_courage_toast: "$tenet_reincarnation_name$"
 doctrine_parameter_tenet_reincarnation_ancestral_trait_decision: "Erlaubt die [decision|E]: $inherit_ancestral_trait_decision$"
 tenet_esotericism_name: "Esoterik"
 tenet_esotericism_kabbalah: "Kabbala"
 tenet_esotericism_desc: "Die großen Mysterien des Göttlichen mögen das menschliche Verständnis übersteigen, doch das ist keine Entschuldigung für Unwissen. Allein ihre Existenz fordert uns schon heraus, die Welt um uns herum besser zu verstehen und zu kennen."
 doctrine_parameter_tenet_esotericism_mystic_education: "Kinder, die mit dem [education_focus|E] [learning|E] unterrichtet werden, können mit einer großen Menge an [learning_lifestyle|E]s-[experience|E] erwachsen werden, wenn sie gut in ihrem Studium sind"
 doctrine_parameter_tenet_esotericism_eccentric_education: "Kinder mit dem [education_focus|E] [learning|E] können [GetTrait('eccentric').GetName(GetNullCharacter)|l] werden"
 doctrine_parameter_tenet_esotericism_eccentric_bonuses: "Die [trait|E] [GetTrait('eccentric').GetName(GetNullCharacter)|U] gewährt zusätzliche @piety_icon![piety|E] und [opinion|E] und kostet weniger [stress|E]"
 doctrine_parameter_tenet_esotericism_seek_spiritual_mysteries: "Erlaubt die [decision|E]: $seek_spiritual_mysteries_decision$"
 tenet_esotericism_kabbalah_desc: "Die Lehren der Kabbala setzen den ewigen Gott, das Wesen der Unendlichkeit – bekannt als Ein Sof – sowie Gottes Schöpfung in eine für Sterbliche begreifliche Beziehung zueinander. Die Kabbala bildet die Grundlage sämtlicher jüdischer Mystik, und ihre Anhänger arbeiten oft mit anderen jüdischen Schulen zusammen."
 tenet_religious_kabbalah_cost_tooltip: "Kabbala: #P -10 %#!"
 #Eastern Tenets
 tenet_adaptive_name: "Anpassungsfähigkeit"
 tenet_adaptive_desc: "Das dogmatische Befolgen althergebrachter Einschränkungen schadet den Gläubigen nur. Solange wir den Kernüberzeugungen unseres Glaubens treu bleiben, können wir unsere Rechte und Gesetze der Welt um uns herum anpassen."
 doctrine_parameter_tenet_adaptive_conversion_resistance: "Bekehrungswiderstand von Gemeinden: #P +30 %#!"
 doctrine_parameter_reduced_vassal_religion_discontent: "Ungläubige [vassals|E] schließen sich mit kleiner Wahrscheinlichkeit Unabhängigkeits- und Volks-[factions|E]"
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "@piety_icon![Concept('piety', 'Frömmigkeits')|E]-Kosten für die Konvertiertung zu einem anderen [Concept('faith', 'Glauben')|E] mit dieser [doctrine|E]: #P -50 %#!"
 doctrine_parameter_immaterial_harmony_no_holy_orders: "Kann keine [military_holy_orders|E] schaffen"
 tenet_inner_journey_name: "Innere Reisen"
 tenet_inner_journey_desc: "Nur wenn wir das eigene Selbst verstehen, können wir die Welt verstehen. Die Reise der Selbsterfahrung ist ebenso wichtig, wie sie lang und beschwerlich ist."
 doctrine_parameter_meditation_mechanics_active: "Charaktere können sich [Concept('decide', 'entscheiden')|E], abgeschieden zu meditieren, was [stress|E] verringert und theologische Einsichten ermöglicht"
 doctrine_parameter_tenet_inner_journey_meditation_bonus: "@piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El] für das Fällen der [decision|E]: [GetDecisionWithKey('meditate_in_seclusion_decision').GetName]"
 doctrine_parameter_tenet_inner_journey_humble_pilgrimage_bonus: "[pilgrimages|E] mit der [activity_option|E] #V $pilgrimage_pomp_humble$#! gewähren zusätzliche @piety_icon![piety|E]"
 pam_inner_journey_meditation_toast: "Durch Euren [Concept('personal_tenet', 'persönlichen Grundsatz')|E] namens [GetTenetType('tenet_inner_journey').GetName(GetPlayer.GetRite)]"
 tenet_dharmic_pacifism_name: "Dharmischer Pazifismus"
 tenet_dharmic_pacifism_desc: "Wir sind alle Teil der kosmischen Ordnung. Gewalt gegen eine Sache ist Gewalt gegen alle Dinge – einschließlich dem eigenen Selbst."
 tenet_bhakti_name: "Bhakti"
 tenet_bhakti_patron_god_name: "Schutzpatrone"
 tenet_bhakti_desc: "Sterbliche können zwar nie die wahre Pracht des Göttlichen erleben, doch indem wir uns einen Aspekt des Göttlichen aussuchen, dem wir nacheifern, den wir anbeten und dem wir uns verschreiben wollen, können wir ihm näher kommen, als es anderweitig möglich wäre."
 doctrine_parameter_select_personal_god_active: "Herrscher können sich für einen persönlichen Avatar [decide|E], den sie anbeten, um einen entsprechenden Bonus zu erhalten"
 doctrine_parameter_select_personal_god_active_personal: "Kann sich für einen persönlichen Avatar zum Anbeten [decide|El], und die Kosten, um den persönlichen Avatar zu ersetzen, sind verringert"
 tenet_asceticism_name: "Askese"
 tenet_asceticism_desc: "Materialistisches Streben macht uns blind für die göttliche Wahrheit. Nur wenn wir uns einem einfachen Leben ohne Luxus verschreiben, erlangen wir spirituelle Erleuchtung."
 doctrine_parameter_tenet_asceticism_inappetetic_trait: "Erhält die [trait|E]: [GetTrait('inappetetic').GetName(GetNullCharacter)|U]"
 doctrine_parameter_tenet_asceticism_inappetetic_bonus: "[GetTrait('inappetetic').GetName( GetNullCharacter )|U]e [characters|E] erhalten #P +1#! [diplomacy|E], #P +2#! [learning|E], #P +10 %#! Zuwachs an @spiritual_fulfillment_icon![spiritual_fulfillment|E] und #P +10 %#! Abbau von [stress|E]"
 doctrine_parameter_tenet_asceticism_comfort_eater_penalty: "[GetTrait('comfort_eater').GetName(GetNullCharacter)]-[characters|E] verlieren #N 0,1#! monatliche @piety_icon![piety|E] und #N 5#! [opinion|E] beim selben [Concept('faith', 'Glauben')|E]"
 tenet_ritual_hospitality_name: "Rituelle Gastfreundschaft"
 tenet_ritual_hospitality_alternate_name: "Pūjā"
 tenet_ritual_hospitality_desc: "Gastfreundschaft ist eine der wichtigsten menschlichen Tugenden, die man zeigen kann. Gäste in unserem Heim, ganz gleich, ob sie nun Sterbliche oder Götter sind, sollten stets mit größter Ehre und höchstem Respekt behandelt werden."
 doctrine_parameter_host_honored_guests_active: "[rulers|E] können andere Charaktere als geehrte Gäste willkommen heißen und @piety_icon![piety|E] gegen eine erhöhte [opinion|E] eintauschen"
 doctrine_parameter_tenet_ritual_hospitality_artifact_theft_risk: "[artifacts|E] in Eurem Reich werden wahrscheinlicher gestohlen"
 doctrine_parameter_tenet_ritual_hospitality_court_position_event_discount: "[court_positions|E] durch [Concept('decision', 'Entscheidungs')|E]-Ereignisse anzuwerben, kostet #P 25 %#! weniger @gold_icon![gold|E]"
 doctrine_parameter_tenet_ritual_hospitality_invite_to_court_acceptance: "[characters|E] nehmen wahrscheinlicher eine Einladung an Euren Hof an"
 doctrine_parameter_tenet_ritual_hospitality_free_guest_recruitment: "Gäste an Euren Hof zu holen, ist kostenfrei"
 doctrine_parameter_tenet_ritual_hospitality_feast_toast_friendship: "Bei einem Trinkspruch auf Ehrengäste anlässlich eines [Concept('feast','Festmahls')|E] besteht immer die Wahrscheinlichkeit, sich mit ihnen anzufreunden"
 #Pagan tenets
 tenet_warmonger_name: "Kriegstreiberei"
 tenet_warmonger_desc: "Glaube und Krieg gehen Hand in Hand. Wer sich weigert, im Namen des Göttlichen zu kämpfen, kann kein wahrer Gläubiger sein."
 doctrine_parameter_conquest_cb_enabled: "[rulers|E] haben einen Eroberungs-[casus_belli|E] gegen benachbarte Herrscher"
 doctrine_parameter_faith_can_raid: "Erlaubt das [raiding|E] fremdländischer [counties|E], um Beute zu machen"
 doctrine_parameter_invasion_cb_enabled: "[rulers|E] mit entsprechendem Prestige können einmal im Leben einen Invasions-[casus_belli|E] einsetzen"
 doctrine_parameter_great_holy_wars_active_if_reformed: "Wenn es ein [head_of_faith|E] gibt, kann es [great_holy_wars|E] erklären, wenn der [faith|E] [organized|E] ist"
 doctrine_parameter_clergy_can_fight_personal: "Kann als [commanders|E] oder $knight_culture_player_plural$ trotz Zugehörigkeit zum [clergy|E] dienen, sofern der [rite|E] keine $tenet_pacifism_name$-[core_tenets|E] hat"
 tenet_ancestor_worship_name: "Ahnenverehrung"
 tenet_ancestor_worship_desc: "Unsere Ahnen wachen aus dem Jenseits über uns. Sie führen uns und zeigen uns den Weg voran. Dafür müssen wir sie respektieren und ehren."
 doctrine_parameter_tenet_ancestor_worship_renown_on_death: "[ruler|E] dieses [Concept('faith', 'Glaubens')|E] gewähren ihrer [dynasty|E] beim Tod [dynasty_prestige|E], was auf ihrer [prestige_level|E] und [piety_level|E] beruht"
 doctrine_parameter_tenet_ancestor_worship_seek_ancestral_guidance: "Erlaubt die [decision|E]: $seek_ancestral_guidance_decision$"
 tenet_adorcism_name: "Willentliche Besessenheit"
 tenet_adorcism_desc: "Die Geister dieser Welt können Großes bewirken, im Guten wie im Schlechten. Indem wir sie ehren und respektieren, können wir darauf hoffen, dass sie uns Gutes und unseren Feinden Schlechtes tun werden."
 doctrine_parameter_spirit_possession_active: "Erlaubt die [decision|E] „Die Hilfe der Geister suchen“"
 doctrine_parameter_tenet_adorcism_curse_enemy: "Ihr könnt die [decision|E] „$pam_curse_enemy_decision$“ gegen [rivals|E], [nemeses|E] und Gegner in Euren [Concept('wars','Kriegen')|E] einsetzen"
 doctrine_parameter_tenet_adorcism_seek_war_aid: "Ihr könnt die [decision|E] „$pam_seek_war_aid_decision$“ im [war|E] nutzen"
 tenet_ritual_celebrations_name: "Ritualfeste"
 tenet_ritual_celebrations_desc: "Die Verehrung des Göttlichen ist etwas, was mit unserer Gemeinde gefeiert und gepriesen werden muss. Indem wir große Feste organisieren, um das Göttliche zu feiern und zu preisen, werden wir alle zusammengeführt."
 doctrine_parameter_mandatory_feast_attendance: "[vassals|E] nehmen mit größerer Wahrscheinlichkeit an Festmahlen des Lehnsherrn teil; wenn sie sich weigern, verlieren sie @piety_icon![piety|E]"
 tenet_sky_burials_name: "Himmelsbestattungen"
 tenet_sky_burials_desc: "Die Toten sollten nicht unter der Erde eingesperrt sein: Es ist besser, wenn sie von aasfressenden Vögeln gefressen werden. Mit diesem letzten Akt der Großzügigkeit können sie die Welt nähren, die sie genährt hat."
 doctrine_parameter_sky_burials_active: "[rulers|E] können ihre Ahnen mit einer Himmelsbestattung beisetzen. So erhalten sie @piety_icon![piety|E] und erfreuen ihre [vassals|E]"
 doctrine_parameter_sky_burials_charnel_grounds: "Das [duchy_building|E] [GetBuilding('charnel_grounds_01').GetName] kann gebaut werden"
 can_build_towers_of_silence_active_name: "Bau von [duchy_building|E] „[GetBuilding('tower_of_silence_01').GetName]“"
 doctrine_parameter_can_build_towers_of_silence_active: "[vassals|E] können das [duchy_building|E] „[GetBuilding('tower_of_silence_01').GetName]“ bauen, um den [county|E]-Eifer zu stärken – #EMP wenn#! der [faith|E] des eigenen [Concept('liege', 'Lehnsherrn')|E] keine $tenet_sky_burials_name$ kennt."
 tenet_sacred_childbirth_name: "Heiliges Kindbett"
 tenet_sacred_childbirth_alternate_name: "Kūdikis Lemti"
 tenet_sacred_childbirth_desc: "Die Badehäuser, in denen Mütter gebären, müssen gereinigt und mit den richtigen Ritualen vorbereitet werden, damit das Göttliche die Geburt auch segnen kann."
 doctrine_parameter_safer_childbirths_active: "Mütter sterben mit #P geringerer#! Wahrscheinlichkeit im Kindbett oder während der Schwangerschaft"
 doctrine_parameter_healthier_children_active: "Kinder werden #P weniger#! oft kränklich oder tot geboren"
 doctrine_parameter_piety_from_childbirth_active: "Mütter und Väter erhalten @piety_icon![piety|E], wenn ihr Kind geboren wird"
 doctrine_parameter_free_wet_nurse_court_position: "Erlaubt das [court_position|E] #V [GetCourtPositionType('wet_nurse_court_position').GetName()]#!, das #P kostenlos#! beschäftigt werden kann"
 doctrine_parameter_tenet_sacred_childbirth_offer_bedside_support: "Erlaubt die [interaction|E]: $offer_bedside_support_interaction$"
 doctrine_parameter_tenet_sacred_childbirth_birthing_building_discount: "Der Bau von Badehäusern kostet #P 25 %#! weniger @gold_icon![gold|E]"
 tenet_sacred_childbirth_birthing_building_discount_cost_desc: "$tenet_sacred_childbirth_name$"
 piety_from_childbirth_toast: "Heiliges Kindbett"
 tenet_sanctity_of_nature_name: "Geheiligte Natur"
 tenet_sanctity_of_nature_desc: "Die natürliche Welt ist eine Schöpfung des Göttlichen, und wir sind nur einfache Gäste darin. Wir müssen jeden Baum, jedes Tier und sogar den Erdboden selbst ehren."
 #This parameter does nothing; it's just here to flag the tenet's nature silently so we can reference it without directly tagging the tenet.
