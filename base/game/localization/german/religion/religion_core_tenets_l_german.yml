 doctrine_parameter_death_is_glory: "Wahrscheinlichkeit, in der [battle|E] zu sterben oder verwundet zu werden: #N +10 %#!"
 doctrine_parameter_sanctioned_assassinations: "Kein [Concept('piety', 'Frömmigkeitsverlust')|E] beim Ermorden von Charakteren von anderem [Concept('faith', 'Glauben')|E] bei [GetScheme('murder').GetTypeName]-[schemes|E]"
 doctrine_parameter_tenet_fp3_fedayeen_other_faith_kill_fulfillment: "Erhält @spiritual_fulfillment_icon![spiritual_fulfillment|El] durch das Töten von [Concept('characters','Charakteren')|E] anderen [Concept('faith', 'Glaubens')|E]"
 #EP3 Tenets
 tenet_household_gods_name: "Hausgötter"
 tenet_household_gods_desc: "Wir verehren unsere #EMP Laren#! und die #EMP Genii#! – jene Schutzgeister, die über unsere Wohnstätten wachen. Vor allem ehren wir unseren glorreichen Kaiser, dessen Seele mit dem Schutz des gesamten Reiches beauftragt ist."
 #BP3 Parameter
 doctrine_parameter_allows_brewery: "$allows_brewery$ (für [temple_holdings|E])"
 #TGP
 immaterial_harmony_name: "Immaterielle Harmonie"
 special_doctrine_immaterial_harmony_name: "Immaterielle Harmonie"
 special_doctrine_immaterial_harmony_desc: "Es gibt keinen Widerspruch zwischen unseren Traditionen und den Lehren von Buddha oder den Weisen. Man kann mühelos jede dieser drei Überzeugungen praktizieren (oder gar alle drei auf einmal), ohne dass sich daraus spirituelle Schwierigkeiten ergeben."
 tenet_extinction_of_dharma_name: "Auslöschung des Dharma"
 tenet_extinction_of_dharma_desc: "Dämonen wandeln in Gestalt von Frommen und Gottesfürchtigen auf Erden. Wer einen tötet, macht einen Schritt in Richtung eines Daseins als Buddha. Wer zehn tötet, macht zehn Schritte in Richtung eines Daseins als Buddha."
 tenet_cranial_trophies_name: "Schädeltrophäen"
 tenet_cranial_trophies_desc: "Der Kopf ist das Gefäß der Quintessenz seines Besitzers. Indem wir ihn abtrennen und seinen Inhalt entnehmen, beanspruchen wir die kraftvolle spirituelle Energie für uns."
 doctrine_parameter_killing_bestows_heads: "Es ist möglich, ein Schädeltrophäen-[artifact|E] zu erhalten, wenn ein anderer Charakter [executed|El], im [single_combat_duel|E] erschlagen oder in der [battle|E] getötet wird."
 doctrine_parameter_decapitation_steals_prestige_as_piety: "Beim Erhalt eines Schädeltrophäen-[Concept('artifact', 'Artefakts')|E] gewinnt der Tötende zusätzliche @piety_icon![piety|E] entsprechend des @prestige_icon![Concept('prestige','Prestiges')|E] des Verstorbenen"
 doctrine_parameter_tenet_cranial_trophies_spiritual_fulfillment_from_trophies: "Wenn Ihr ein Schädeltrophäen-[artifact|E] erhaltet, erhaltet Ihr auch @spiritual_fulfillment_icon![spiritual_fulfillment|El] skalierend mit dem @prestige_icon![prestige|E] des Verstorbenen"
 tenet_benevolent_governance_name: "Wohlmeinende Regierungskunst"
 tenet_benevolent_governance_desc: "Wer die Massen regiert, hat die moralische Pflicht, das zu fördern, was gut ist, und dem zu entsagen, was böse ist. Nur wer sich an diesen Grundsatz hält, kann wirklich gerecht herrschen."
 tenet_filial_piety_name: "Elterntreue"
 tenet_filial_piety_desc: "Treue und Gehorsam gegenüber Eltern und Ältesten sind die Grundlage menschlicher Güte. Solange unsere Eltern leben, dienen wir ihnen mit Anstand, unterstützen sie mit unseren Mitteln und lernen durch ihre Führung. Wenn sie sterben, begraben wir sie mit Anstand – um sie dann mit Anstand zu verehren."
 tenet_harmonious_society_name: "Harmonische Gesellschaft"
 tenet_harmonious_society_desc: "Alles muss im Gleichgewicht sein: Menschen, Natur, Gesellschaft. Der Himmelssohn gibt den Rhythmus vor und wir folgen seinem Sang."
