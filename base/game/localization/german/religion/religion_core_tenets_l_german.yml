l_german:
 doctrine_core_tenets_name: "Grundsätze"
 tenets_name: "Grundsätze"
 #Abrahamic Tenets
 tenet_communion_name: "Kommunion"
 tenet_communion_desc: "Unsere Rituale sind nicht nur einfach symbolisch: Vielmehr finden sie in unmittelbarer Anwesenheit des Göttlichen statt. Wer sich uns nicht bei diesen Praktiken anschließen kann oder will, kann auch kein wahrer Gläubiger sein."
 doctrine_parameter_tenet_communion_denied_sacrament: "[Concept('excommunicated', 'Exkommunizierte')|E] [characters|E] dieses [rite|E] erleiden #N -25 %#! @piety_icon![Concept('piety', 'Frömmigkeits')|E]-Zuwachs und #N -10#! [opinion|E] beim selben Glauben"
 doctrine_parameter_tenet_communion_shared_table: "Ein [GetActivityType('activity_feast').GetName] auszurichten, gewährt #P +10#! [opinion|E] bei jedem Gast desselben [Concept('faith', 'Glaubens')|E]"
 doctrine_parameter_excommunication_active: "Klerikale [heads_of_faith|E] können andere Charaktere ihres [Concept('faith', 'Glaubens')|E] [excommunicate|E]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName(GetNullCharacter)]"
 doctrine_parameter_last_rites_active: "Charaktere dieses [rite|E] können die [decision|E] „[GetDecisionWithKey('pam_decision_last_rites').GetName]“ treffen"
 doctrine_parameter_seek_indulgences_active: "Charaktere dieses [rite|E] können die [interaction|E] #high $seek_indulgences_interaction$#! einsetzen, wenn der [faith|E] ein [head_of_faith|E] oder [clerical_regions|E] hat"
 tenet_armed_pilgrimages_name: "Wehrhafte Pilgerreisen"
 tenet_armed_pilgrimages_desc: "Unsere Pilger bereisen die Welt, um unsere heiligen Stätten zu besuchen – wir greifen auch zum Schwert, um sie vor jenen zu schützen, die ihnen ein Leid tun wollen."
 doctrine_parameter_cheaper_holy_wars_active: "Es kostet [rulers|E] dieses [rite|E] #P -20 %#! weniger @piety_icon![piety|E], [Concept('holy_wars', 'Religionskriege')|E] zu erklären"
 doctrine_parameter_great_holy_wars_active: "Wenn es ein [head_of_faith|E] gibt, kann es einen [Concept('great_holy_war', 'großen Religionskrieg')|E] erklären"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Wenn es keinen [head_of_faith|E] gibt, erhalten Anhänger einen Bonus zur [councillor_task|E] [convert_county|E] pro kontrollierter [Concept('holy_site', 'Heiliger Stätte')|E]"
 doctrine_parameter_pilgrimage_decision_active: "Charaktere dieses [rite|E] erhalten einen zusätzlichen Bonus nach erfolgreichem Abschluss einer [pilgrimage|E]"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[holdings|E] an [holy_orders|E] zu [Concept('leasing', 'verpachten')|E], gibt zusätzliche @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "Mönchstum"
 tenet_monasticism_desc: "Die Freuden von Speis und Trank lenken uns nur vom Dienst am Göttlichen ab. In abgelegenen Klöstern fernab der Welt zu leben, ist der beste Weg, um solchen Verlockungen zu entgehen."
 doctrine_parameter_take_vows_active: "[courtiers|E] können „Gelübde ablegen“ und [GetTrait('devoted').GetName(GetNullCharacter)] werden"
 doctrine_parameter_devoted_trait_criminal: "Die Eigenschaft „[GetTrait('devoted').GetName(GetNullCharacter)]“ ist [Concept('criminal', 'verbrecherisch')|E]"
 doctrine_parameter_cannot_take_the_vows: "Charaktere dieses [rite|E] können die [character_interaction|E] #high $take_vows_interaction$#! nicht nutzen"
 tenet_divine_marriage_name: "Göttliche Vermählung"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "Indem wir nahe Verwandte miteinander verheiraten, vollziehen wir die heiligen Bünde der ersten Wesen der Schöpfung nach. Gute Eigenschaften werden in unserer Familie weitergegeben, und so gewinnen wir Reinheit und Gunst im ewigen Kampf gegen das Böse."
 doctrine_parameter_divine_marriage_opinion: "Anhänger, die mit [Concept('close_family', 'nahen Verwandten')|E] verheiratet sind, erhalten $VALUE|0+=$ [opinion|E] bei [vassals|E] desselben [Concept('faith', 'Glaubens')|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Der [GetDoctrineType('doctrine_monogamy').GetBaseName]-Hochzeitsbonus gewährt auch einen hohen Betrag an @piety_icon![piety|E], wenn man [close_family|El] heiratet"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "[skills|E]-Beitrag durch [spouse|E]-[councillor_tasks|E]: #P +25 %#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Anhänger schaffen oder schließen sich sehr viel seltener [factions|E] gegen einen [Concept('liege', 'Lehnsherrn')|E] an, der mit [Concept('close_family', 'naher Verwandtschaft')|El] oder [Concept('extended_family', 'weiterer Verwandtschaft')|El]verheiratet ist"
 tenet_pacifism_name: "Pazifismus"
 tenet_pacifism_desc: "Gewalt ist eine abscheuliche Tat, die nur zu Leid, Schmerz und Reue führen kann. Indem wir versuchen, sie zu vermeiden, errichten wir stärkere, sicherere Gesellschaften, in denen die Gläubigen leben können. Pazifistische Gemeinden wachsen und gedeihen unter einer friedlichen Ordnung."
 doctrine_parameter_holy_wars_forbidden: "Kann keine [Concept('holy_wars', 'Religionskriege')|E] ausrufen oder einen [raid|E] anordnen"
 doctrine_parameter_pacifist_opinion_active: "Pazifistenmeinung: $VALUE|+=0$"
 pacifist_opinion_name: "Mit-Pazifist"
 pacifist_county_opinion_name: "Andere pazifistische Gemeinde"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[opinion|E] anderer Pazifisten: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Wenn ein Frieden mindestens zwei Jahre lang anhält, steigt die @piety_icon![piety|E] eines Herrschers jeden Monat um $VALUE|+$"
 PIETY_LONG_PEACE: "Langer Friede"
 tenet_vows_of_poverty_name: "Armutsgelübde"
 tenet_vows_of_poverty_desc: "Geld verdirbt die Herzen der Menschen und entfernt sie immer weiter vom wahren Glauben. Wir müssen die Anhäufung von materiellem Reichtum scheuen, um uns ganz dem zu widmen, was wirklich wichtig ist: der Suche nach bescheidenen Beschäftigungen und das Erlangen von Frömmigkeit durch ihren Abschluss."
 doctrine_parameter_vows_of_poverty_active: "[rulers|E] können [decide|El], ein Armutsgelübde abzulegen, wodurch die monatlichen [tax|E]-Einnahmen verringert werden, aber die monatliche @piety_icon![piety|E] ansteigt"
 tenet_human_sacrifice_name: "Menschenopfer"
 tenet_human_sacrifice_desc: "Unsere Ergebenheit können wir am besten durch Opfer zur Schau stellen. Das kostbarste Opfer, das wir bringen können, ist natürlich ein menschliches Leben."
 doctrine_parameter_human_sacrifice_active: "[executions|E] kosten keine @piety_icon![piety|E], sondern bringen @piety_icon![piety|E] ein"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[executions|E] kosten keine @prestige_icon![prestige|E], wenn man [Concept('sharing_power', 'Macht teilt')|E]"
 doctrine_parameter_flower_war_cb_active: "Gewährt den [flowery_war|E]-[casus_belli|E] gegen benachbarte Reiche"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "[executions|E] gewähren zusätzliche @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El] beruhend auf dem [nobility|E] und dem [rank|E] der Opfergabe"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Deutlich höhere Wahrscheinlichkeit, Charaktere während [sieges|E] gefangen zu nehmen"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Erhöhte Wahrscheinlichkeit, Charaktere ohne Besitztümer [Concept('imprison', 'einzukerkern')|E]"
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Grausige Feste"
 tenet_gruesome_festivals_desc: "Wir alle werden in Blut geboren. Wir überleben durch das Blut unseres Viehs, unserer Familien, unserer Feinde. Da ist es nur natürlich, dass auch unser Pantheon ([ROOT.Rite.GetFaith.PantheonTerm]) seinen Anteil verlangt."
 gruesome_festivals_active_name: "Befähigung zu Großopfern"
 doctrine_parameter_gruesome_festivals_active: "Schaltet die [activity|E] [GetActivityType('activity_gruesome_festival').GetName] ungefähr einmal im Jahrzehnt frei, die @piety_icon![piety|E], Meinung bei Untertänigen desselben [Concept('faith', 'Glaubens')|E] sowie [county_opinion|E] gewährt"
 tenet_volcanic_veneration_name: "Vulkanverehrung"
 tenet_volcanic_veneration_desc: "Es gibt kaum etwas Göttlicheres als die neugeborene Erde, die aus den feurigen Gruben unserer Heimat hervorquillt. Wir fristen unser Dasein am Rand des Untergangs und sind beständig der Gnade höherer Mächte ([ROOT.Rite.GetFaith.PantheonTerm]) ausgeliefert."
 tenet_cthonic_redoubts_name: "Unterirdische Zufluchten"
 tenet_cthonic_redoubts_desc: "Es gibt keine besseren Zufluchten als die Wurzeln der Erde. Keine Festung ist unbezwingbarer als ihre schroffen Grate, keine Pilgerreise heiliger als die auf ihren verborgenen Wegen. Wir blicken von diesen hohen Gipfeln auf die Schöpfung herab und spüren die wahre Last des Göttlichen."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "„[convert_county|E]“-Tempo in gebirgigem [terrain|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0] %#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "„[promote_culture|E]“-Tempo in gebirgigem [terrain|E] desselben [Concept('faith', 'Glaubens')|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0] %#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Feindliches „[convert_county|E]“-Tempo in gebirgigem [terrain|E]: #P +[EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0] %#!"
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Ritueller Selbstmord"
 tenet_consolamentum_desc: "Wenn wir alt oder krank werden, führen wir ein Ritual durch, um unsere Seelen von der Sünde zu befreien. Sobald dies geschafft ist, machen wir unserem Leben rasch und entschieden ein Ende, sodass die Sünde keine Möglichkeit mehr hat, uns von Neuem zu befallen."
 doctrine_parameter_consolamentum_active: "Anhänger können [decide|E], ihr Leben freiwillig zu beenden, wenn sie alt, untauglich oder dem Tode nahe sind. Es gibt keinen der üblichen Nachteile für einen Suizid"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "Wenn ein Anhänger bei der [decision|E] „[GetDecisionWithKey('initiate_consolamentum_decision').GetName]“ stirbt, erhält sein Erbe #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! @piety_icon![piety|E]"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Euer Erbe erhält weitere #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! @piety_icon![piety|E] und für #P 10#! Jahre $pam_blessed_passing_modifier$, wenn Ihr bei der [decision|E] „[GetDecisionWithKey('initiate_consolamentum_decision').GetName]“ sterbt"
 tenet_gnosticism_name: "Gnostizismus"
 tenet_gnosticism_desc: "Durch Wissen kann der göttliche Funke, der in allen Menschen schlummert, befreit werden und zu seinem himmlischen Ursprung im Geistreich zurückkehren."
 doctrine_parameter_granting_titles_gives_stress: "[titles|E] zu verleihen, verringert die [stress|E]"
 tenet_mendicant_preachers_name: "Bettelgeschwister predigen"
 tenet_mendicant_preachers_desc: "Unsere Missionare reisen nach nah und fern mit nichts als den Kleidern, die sie am Leib tragen. Sie verlassen sich ganz auf die Großzügigkeit jener, die sie besuchen, und teilen im Gegenzug das Wissen um den wahren Glauben."
 doctrine_parameter_mendicant_preachers_conversion_active: "Gemeindebekehrungstempo: #P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Einen [character|E] zu bekehren, gewährt zusätzliche @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "[characters|E] eines anderen [Concept('faith', 'Glaubens')|E] umzustimmen, gelingt wahrscheinlicher"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Gäste eines anderen [Concept('faith', 'Glaubens')|E] bei Euren [activities|E] können zu Eurem konvertiert werden"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Erlaubt die [interaction|E] #V $attempt_conversion_of_local_ruler_interaction$#! mit [Concept('rulers','Herrschern')|E] an unserem derzeitigen [location|E]"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Ermöglicht die [travel_option|E] „[GetTravelOption('adventurers_proselytize_zealously_option').GetName]“ ohne den [perk|E]: [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)]"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U] konvertiert zu: [first.GetFaith.GetName|U]"
 must_be_in_same_county_tt: "Ihr müsst in einer [county|E] sein, die sie besitzen"
 tenet_communal_identity_name: "Gemeindeverflechtung"
 tenet_communal_identity_desc: "Unser Glaube und unsere Kultur sind untrennbar miteinander verbunden. Diese Praktik stärkt die Bande in unserer Gemeinschaft, schließt aber Fremde aus."
 doctrine_parameter_same_communal_identity_opinion_active: "#P +10#! [opinion|E] bei Charakteren desselben [Concept('faith', 'Glaubens')|E]"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "Die Beeinflussung einer Fraktion beim [Concept('ecumenical_council', 'ökumenischen Konzil')|E] kostet kein @prestige_icon![prestige|E]"
 doctrine_parameter_tenet_communal_identity_sway_piety: "[piety_i]#P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! [piety|E] bei jedem erfolgreichen [GetScheme('sway').GetTypeName] von jemandem Eures eigenen [rite|E]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "[GetScheme('learn_language').GetTypeName]-[scheme_success_chance|E] gegen Ziele Eures eigenen [rite|E]: [success_chance_i]#P +20 %#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "Die [language|E] von jemandem Eures eigenen [rite|E] zu erlernen, gewährt @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_same_culture_conversion_bonus_active: "Bekehrungstempo in [counties|E] meiner [culture|E]: #P +50 %#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Kulturförderungstempo in [counties|E] meines [Concept('faith', 'Glaubens')|E]: #P +50 %#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Bekehrungstempo in [counties|E] einer anderen [culture|E]: #N -50 %#!"
 tenet_pentarchy_name: "Glaubensfürsten"
 tenet_pentarchy_alternate_name: "Pentarchie"
 tenet_pentarchy_desc: "Unsere heiligen Stätten sind mehr als nur besonders heilige Orte: Sie sind vielmehr die Amtssitze, von denen aus unsere religiösen Anführer herrschen."
 tenet_aniconism_name: "Bilderverbot"
 tenet_aniconism_desc: "Die Verehrung von Abbildungen und Darstellungen hat viel zu viele blind gemacht für die göttliche Wahrheit. Wir werden alle Ikonen von unseren heiligen Orten verbannen, auf dass unseren Gläubigen dieser Fehltritt erspart bleiben möge."
 doctrine_parameter_reforging_artifacts_costs_piety: "[rulers|E] dieses [rite|E] müssen @piety_icon![piety|E] ausgeben, um [artifacts|E] [Concept('reforge', 'neu zu schmieden')|E] oder zu [repair|El]"
 doctrine_parameter_destroying_artifacts_is_pious: "[rulers|E] dieses [rite|E] können [artifacts|E] für @piety_icon![piety|E] zerstören"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Kann [artifacts|E] für @piety_icon![piety|E] zerstören"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Wenn Ihr [rulers|E] eines [Concept('faith', 'Glaubens')|E] ohne diesen [core_tenet|E] belagert, vernichtet Ihr mehr [development|E], beschädigt mit höherer Wahrscheinlichkeit [artifacts|E] und erhaltet @piety_icon![piety|E]"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Erhaltet @spiritual_fulfillment_icon![spiritual_fulfillment|El] für das Zerstören von [artifacts|E] und für das Abschließen bei Belagerungen gegen einen [Concept('faith', 'Glauben')|E] ohne diesen [core_tenet|E]"
 pam_aniconism_siege_toast: "Durch Euren [Concept('personal_tenet', 'persönlichen Grundsatz')|E] namens [GetTenetType('tenet_aniconism').GetName(GetPlayer.GetRite)]"
 destroying_artifacts_is_not_pious_tt: "Euer [rite|E] kann keine [artifacts|E] gegen [piety|E] zerstören"
 artifact_is_rarer_than_masterwork_tt: "Dieses [artifact|E] hat eine höhere [rarity|E] als „Meisterlich“"
 tenet_alexandrian_catechism_name: "Alexandrinischer Katechismus"
 tenet_alexandrian_catechism_desc: "Die Katechetische Schule von Alexandria hat eine lange Tradition darin, Theologen zu ermutigen, kritisch zu denken und den Status quo zu hinterfragen.\n\nTrotz der physischen Zerstörung der Schule tragen wir diese Tradition unbeirrt weiter."
 tenet_islamic_rationalism_name: "Vernünftiger Islam"
 tenet_islamic_rationalism_desc: "Da die höchste Instanz ([ROOT.Rite.GetFaith.HighGodNameAlternate]) gerecht und weise ist, kann sie nicht unvernünftig handeln oder das Wohlergehen der eigenen Schöpfung missachten. Nur mit Hilfe der Vernunft können wir hoffen, unseren Anteil an ihrem großem Werk zu begreifen und das Gute vom Bösen zu unterscheiden."
 doctrine_parameter_scholasticism_is_holy: "Die [trait|E] [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] gewährt zusätzliche Boni"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Mit dem [education_focus|E] [learning|E] unterrichtete Kinder können mit [learning_lifestyle|E]-[experience|E] erwachsen werden und sind öfter besser gebildet"
 doctrine_parameter_tenet_alexandrian_catechism_catechesis_conversion: "Gemeindebekehrungstempo: #P +25 %#!"
 tenet_hedonistic_name: "Hedonismus"
 tenet_hedonistic_desc: "Das Göttliche will die Welt mit einem Füllhorn der Freuden überschütten, an denen wir teilhaben und die wir genießen sollen: Sich ihrem Genuss zu verweigern, hieße, die Schöpfung selbst zu missachten."
 doctrine_parameter_piety_from_feasts_active: "Ein [GetActivityType('activity_feast').GetName] auszurichten, erhöht die @piety_icon![piety|E]"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf(HasDlcFeature('all_under_heaven'), 'doctrine_parameter_piety_from_festivals_active_auh')]" #Only show if you have AUH
 doctrine_parameter_piety_from_festivals_active_auh: "Ein [GetActivityType('activity_festival').GetName] auszurichten, erhöht die @piety_icon![piety|E]"
 tenet_carnal_exaltation_name: "Fleischliche Erhabenheit"
 tenet_carnal_exaltation_desc: "Die Genüsse des Fleisches sind in einer Art und Weise erhaben, die andere irdische Erfahrungen übersteigt, sodass wir durch sie dem Göttlichen näherkommen. Wir sollten daher unsere geschlechtlichen Triebe feiern und jede Gelegenheit nutzen, ihnen nachzugeben."
 doctrine_parameter_piety_from_seduction_active: "Erfolgreiche [schemes|E] der Art [GetScheme('seduce').GetTypeName] gewähren @piety_icon![piety|E]"
 doctrine_parameter_tenet_carnal_exaltation_clergy_no_continence: "[clergy|E] dieses [rite|E] müssen fleischlichen Beziehungen nicht entsagen"
 doctrine_parameter_tenet_carnal_exaltation_deviancy_virtuous: "Erlaubt es dem [Concept('faith', 'Glauben')|E], die [doctrine|E] [GetDoctrineType('doctrine_deviancy_virtuous').GetBaseName] auszuwählen"
 doctrine_parameter_tenet_carnal_exaltation_sensual_bonus: "[characters|E] mit [GetTrait('lustful').GetName(GetNullCharacter)|U], [GetTrait('rakish').GetName(GetNullCharacter)|U] oder [GetTrait('deviant').GetName(GetNullCharacter)|U] erhalten #P +2#! [intrigue|E], #P +2#! [diplomacy|E] und #P +25 %#! [fertility|E] pro Eigenschaft"
 doctrine_parameter_tenet_carnal_exaltation_sensual_seduction: "[characters|E] mit [GetTrait('lustful').GetName(GetNullCharacter)|U], [GetTrait('rakish').GetName(GetNullCharacter)|U] oder [GetTrait('deviant').GetName(GetNullCharacter)|U] schließen [schemes|E] der Art [GetScheme('seduce').GetTypeName] pro Eigenschaft #P 20#! Tage schneller ab"
 doctrine_parameter_tenet_carnal_exaltation_commission_artifacts_debauched: "Kann verderbte Artefakte mit der [decision|E] „[GetDecisionWithKey('commission_artifact_decision').GetName]“ erschaffen"
 tenet_polyamory_name: "Polyamorie"
 tenet_polyamory_desc: "Unsere Liebe füreinander sollte so bedingungslos sein wie die Liebe der fruchtbaren Mächte ([ROOT.Rite.GetFaith.FertilityGodName]) zu uns. Wir müssen die überholte Vorstellung abstreifen, dass ein Mensch die Zuneigung eines anderen Menschen ganz besitzen kann."
 doctrine_parameter_no_unfaithfulness_penalty_active: "Anhänger erhalten keinen [Concept('opinion', 'Meinungs')|E]-Abzug oder [imprisonment_reasons|E] bei ihrem Ehepartner oder den Affären des Ehepartners für außereheliche Beziehungen"
 doctrine_parameter_tenet_polyamory_romance_seduction_scheme_bonus: "[scheme_success_chance|E] für [GetScheme('courting').GetTypeName] und [GetScheme('seduce').GetTypeName]: [success_chance_i]#P +35 %#!"
 doctrine_parameter_tenet_polyamory_romance_seduction_fulfillment: "[stress|E] verlieren und @spiritual_fulfillment_icon![spiritual_fulfillment|El] erhalten durch erfolgreiche [schemes|E] in Sachen [GetScheme('courting').GetTypeName] und [GetScheme('seduce').GetTypeName]"
 doctrine_parameter_tenet_polyamory_new_beloved: "Eine [lover|E] oder einen [Concept('soulmate', 'Seelengefährten')|E] zu gewinnen, gewährt #P [EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![spiritual_fulfillment|El], #P 20#! weniger [stress|E] und #V 5#! Jahre: [GetModifier('tenet_polyamory_new_beloved_modifier').GetNameWithTooltip] (höchstens einmal im Jahr)"
 tenet_polyamory_new_beloved_toast: "Durch Euren [Concept('personal_tenet', 'persönlichen Grundsatz')|E] namens [GetTenetType('tenet_polyamory').GetName(GetPlayer.GetRite)]"
 doctrine_parameter_tenet_carnal_exaltation_seduction_fulfillment: "[stress|E] verlieren und @spiritual_fulfillment_icon![spiritual_fulfillment|El] erhalten durch erfolgreiche [schemes|E] der Art [GetScheme('seduce').GetTypeName]"
 tenet_unrelenting_faith_name: "Unaufhaltsamer Glaube"
 tenet_unrelenting_faith_desc: "Unsere Überzeugung ist stark, und allzu gern kämpfen und sterben wir für unseren Glauben. Ganz gleich, wie schlecht unsere Chancen stehen: Wir werden nicht aufgeben."
 tenet_unrelenting_faith_zandik_name: "Rechtschaffener Aufstand"
 tenet_unrelenting_faith_zandik_desc: "Wir wollen weder einer Seele noch sonst etwas Schaden zufügen, doch wenn unsere Lebensart bedroht wird, verteidigen wir sie mit unerbittlicher Wildheit."
 tenet_rite_name: "Ritus"
 tenet_rite_desc: "Unsere Vorstellungen unterscheiden sich gar nicht so sehr von jenen unseres Mutterglaubens … Warum sollten wir uns über Feinheiten streiten, wenn wir uns bei den Hauptpunkten der Doktrinen einig sind – und vor allem bei der obersten Autorität für die Schlichtung?"
