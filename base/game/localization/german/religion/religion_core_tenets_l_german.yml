 doctrine_parameter_sway_scheme_piety: "Erfolgreiche [GetScheme('sway').GetTypeName]-[schemes|E], die auf den eigenen [Concept('liege', 'Lehnsherrn')|E] oder [vassals|E] abzielen, gewähren [piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [piety|E]"
 doctrine_parameter_more_often_zealots: "[vassals|E] haben wahrscheinlicher die [GetVassalStance('zealot').GetTextIcon][GetVassalStance('zealot').GetName]-[vassal_stance|E]"
