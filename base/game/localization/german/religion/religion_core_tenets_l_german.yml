 tenet_sinitic_syncretism_name: "Sinitischer Synkretismus"
 tenet_sinitic_syncretism_desc: "Wir können viel von den uralten sinitischen Religionen lernen. Über Jahrhunderte und Jahrtausende förderten sie rechtschaffenes Leben und gute Moral."
 doctrine_parameter_sinitic_syncretic_actor_opinion_active: "Gegenseitiger [Concept('opinion', 'Meinungs')|E]-Bonus von $VALUE|=+0$ bei [faiths|E], die den [core_tenet|E] $tenet_sinitic_syncretism_name$ haben"
