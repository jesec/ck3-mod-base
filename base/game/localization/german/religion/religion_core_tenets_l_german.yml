 tenet_pursuit_of_knowledge_desc: "Wer von Geburt an mit Wissen gesegnet ist, ist allen anderen überlegen. Wer nach Wissen sucht, steht an zweiter Stelle. Wer stumpfsinnig ist und nichts dazulernen will, ist der Niederste."
