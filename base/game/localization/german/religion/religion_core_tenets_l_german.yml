 #Additional Tenets
 tenet_ritual_cannibalism_name: "Ritueller Kannibalismus"
 tenet_ritual_cannibalism_desc: "Die Menschheit wurde damit gesegnet, von einem Funken des Göttlichen erfüllt zu sein. Menschenfleisch ist dementsprechend heilig, und man sollte es genießen, anstatt es zu verbrennen oder zu begraben."
 doctrine_parameter_cannibalism_legal: "Die Eigenschaft [GetTrait('cannibal').GetName(GetNullCharacter)] wird nicht mehr als [criminal|E] betrachtet"
 doctrine_parameter_tenet_ritual_cannibalism_devour_reward: "Kann [prisoners|E] essen, um [stress|E] abzubauen und @spiritual_fulfillment_icon![spiritual_fulfillment|El] zu erhalten"
 doctrine_parameter_tenet_ritual_cannibalism_feast_toast: "[honorary_guest|E] kann am Ende des [GetActivityType('activity_feast').GetName]s gegessen werden"
 tenet_exaltation_of_pain_name: "Schmerzliche Erhabenheit"
 tenet_exaltation_of_pain_desc: "Schmerz ist etwas, was jeder empfindet; Gewalt ist etwas, was jeder versteht. Anderen Schmerz zuzufügen, heißt, sie zu segnen; Schmerz zu erleiden, heißt, Vergebung zu erfahren."
 doctrine_parameter_torturing_prisoners_grants_piety: "[prisoners|E] zu foltern, kostet keine @piety_icon![piety|E], sondern bringt @piety_icon![piety|E] ein"
 doctrine_parameter_reduced_stress_from_torture: "Anhänger erleiden keine [stress|E], wenn sie gefoltert werden, und erhalten @spiritual_fulfillment_icon![spiritual_fulfillment|El] durch ihr Leid"
 doctrine_parameter_self_mutilation_active: "Man kann sich für eine Selbstgeißelung [decide|El], wodurch man @piety_icon![piety|E], aber auch die [trait|E] [GetTrait('wounded_1').GetName(GetPlayer)|U] erhält"
 doctrine_parameter_no_epidemic_fulfillment_loss_active: "Anhänger erleiden keinen Verlust von @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'spiritueller Erfüllung')|E] durch [Concept('epidemic', 'Seuchen')|E]"
 doctrine_parameter_no_epidemic_fulfillment_loss_personal_active: "Dieser Charakter erleidet keinen Verlust von @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'spiritueller Erfüllung')|E] durch [Concept('epidemic', 'Seuchen')|E]"
 doctrine_parameter_tenet_exaltation_of_pain_flagellant_trait: "Erhält die [trait|E] [GetTrait('flagellant').GetName(GetPlayer)] bei der Auswahl dieses [Concept('personal_tenet', 'persönlichen Grundsatzes')|E]"
