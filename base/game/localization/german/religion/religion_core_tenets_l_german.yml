 #Muslim Tenets
 tenet_struggle_submission_name: "Streiter und Untertan"
 tenet_struggle_submission_desc: "Der göttliche Wille ist der Quell des Guten, und daher gründet sich ein gutes Leben auch darauf, diesem Willen untertan zu sein und zugleich dafür zu streiten, dass er umgesetzt wird."
 doctrine_parameter_bonus_holy_war_piety_active: "@piety_icon![piety|E] und [piety_experience|E] durch das Gewinnen von [Concept('holy_wars', 'Religionskriegen')|E] wird um #P 50 %#! erhöht"
 tenet_religious_legal_pronouncements_name: "Kirchenrecht"
 tenet_religious_legal_pronouncements_hisbah: "Hisba"
 tenet_religious_legal_pronouncements_fatwa: "Fatwa"
 tenet_religious_legal_pronouncements_halakha: "Halacha"
 tenet_religious_legal_pronouncements_desc: "Der Grat zwischen theologischen und juristischen Argumenten ist schmal, und das Spirituelle kann und sollte auch bei weltlichen Entscheidungen bedacht werden. Ein Herrscher kann nach der Sakralverdammung eines erwachsenen direkten [Concept('vassal', 'Vasallen')|E] desselben Glaubens streben, doch der Ausgang hängt von der [learning|E] und dem moralischen Verhalten des Vasallen ab."
 doctrine_parameter_temporal_condemnation_enabled: "Herrscher können versuchen, erwachsene direkte [vassals|E] derselben [religion|E] zu verdammen. Je [Concept('sinful', 'sündhafter')|E] ein Vasall ist, desto weniger [learning|E] brauchen seine Herrscher, während [Concept('virtuous', 'tugendhafte')|E] Eigenschaften den Erfolg erschweren."
 doctrine_parameter_temporal_condemnation_criminal: "Eine erfolgreiche Verdammung macht den Vasallen zum [criminal|E] und kann es erlauben, seine Titel zu widerrufen"
 doctrine_parameter_tenet_religious_law_scholar_trait: "Erhält die [trait|E]: [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)]"
 doctrine_parameter_tenet_religious_law_condemnation_bonus: "[success_chance|E] der Verdammungs-[interaction|E]: #P +25#!"
