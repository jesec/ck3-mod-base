l_german:
 # Building Needs
 REACTIVE_ADVICE_BUILDING_NEEDS: "Gebäudebedarfe"
 action_reactive_advice_building_needs: "Ratschlag: $REACTIVE_ADVICE_BUILDING_NEEDS$"
 action_reactive_advice_building_needs_desc: "Eure [buildings|E] haben [needs|E] an [trade_goods|E], die vom örtlichen [market|E] versorgt werden. Öffnet dies, um zu erfahren, wie Ihr diese Bedarfe befriedigen könnt."
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$"
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_intro_desc: "Wenn Ihr möglichst viel aus den [Concept('buildings', 'Gebäuden')|E] in Eurer [domain|E] herausholen wollt, solltet Ihr dafür sorgen, dass sie die [trade_goods|E] haben, die sie brauchen.\n\nWerfen wir einen Blick darauf, wie man das macht!"
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_domain_tab_desc: "Als Erstes sollten wir uns Eure [domain|E] ansehen."
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Öffnet den Domänen-Reiter auf der Reichs-Tafel (hervorgehoben)"
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_domain_tab_desc: "Dies sind all Eure [holdings|E] in Eurer [domain|E].\n\nDie [county|E] jedes Besitztums ist Teil eines [Concept('market','Markts')|E]. Alle [goods|E], die [buildings|E] herstellen und verbrauchten, werden an diesen Märkten eingetauscht."
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_county_view_desc: "Werfen wir jetzt einen Blick auf Eure [holdings|E]."
 reactive_advice_building_needs_step_open_county_view_prompt: "Klickt auf eines Eurer Besitztümer (hervorgehoben)"
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_county_view_desc: "Dies sind die [districts|E] Eures [Concept('holding', 'Besitztums')|E]. In jedem Bezirk gibt es [buildings|E], die [goods|E] herstellen und verbrauchen."
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_district_view_desc: "Als Beispiel können wir uns die [needs|E] Eures [Concept('holding_district', 'Besitztumsbezirks')|E] ansehen."
 reactive_advice_building_needs_step_open_district_view_prompt: "Klickt auf den $game_concept_holding_district$ (hervorgehoben)"
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_desc: "Hier sieht man die Auswirkungen jedes [Concept('building', 'Gebäudes')|E] im [district|E].\n\nGewisse Auswirkungen müssen [trade_goods|E] vom [market|E] der [county|E] verbrauchen, um aktiv zu sein.\n\nDer [holding_district|E] bietet dem [holding|E] [food_supply|E], wenn es [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon] und [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon] verbrauchen kann.\n\nEs hat keine abträglichen Auswirkungen, wenn ein [need|E] nicht gedeckt wird, und alle $game_concept_buildings$ haben gewisse Vorteile selbst dann, wenn sie keinen Zugang zu den $game_concept_trade_goods$ haben, die sie brauchen."
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_district_view_2_desc: "Oft braucht es keine bestimmte [trade_good|E], sondern eine Kombination aus $game_concept_goods$ aus einer bestimmten [trade_category_short|E] reicht bereits aus. Ein [building|E] könnte zum Beispiel [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon] brauchen, was bedeutet, dass entweder [GetTradeGoodType('trade_good_grain').GetNameWithIcon], [GetTradeGoodType('trade_good_millet').GetNameWithIcon] oder [GetTradeGoodType('trade_good_rice').GetNameWithIcon] ausreichen.\n\nZusätzlich können einige [needs|E] auch mehrfach gedeckt werden, und jedes Mal, wenn sie erfüllt werden, werden die Auswirkungen wieder angewendet."
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_step_open_market_view_desc: "[buildings|E] brauchen also [trade_goods|E], doch woher kommen die?\n\nJede in einer [county|E] verbrauchte Handelsware stammt vom [market|E] der Gemeinde."
 reactive_advice_building_needs_step_open_market_view_prompt: "Öffnet den Markt der Gemeinde (hervorgehoben)#!"
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_desc: "Dies ist der [market|E] der [county|E]. Meist deckt der Markt dieselben [counties|E] wie ein [duchy|E] ab."
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_balances_desc: "Hier könnt Ihr jede [trade_good|E] sehen und ob es einen [surplus|E] oder einen unerfüllten [need|E] für sie gibt.\n\nGibt es einen unerfüllten Bedarf (#N negativer Saldo#!), erhalten nicht alle [buildings|E] auf dem [market|E] ihre [needs|E].\n\nGibt es einen Überschuss (#P positiver Saldo#!), wurden die Bedarfe aller [buildings|E] auf dem Markt für diese Handelsware erfüllt und die Ware kann über [trade_routes|E] ausgeführt werden.\n\n#I Ihr könnt auf eine $game_concept_trade_good$ klicken, um deren Status auf dem Markt und auf der Karte zu sehen.#!"
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$"
 reactive_advice_building_needs_market_view_unmet_need_desc: "Gibt es einen unerfüllten [need|E], könnt Ihr auf verschiedene Arten versuchen, ihn zu erfüllen:\n\n$BULLET_WITH_TAB$Bau von [Concept('buildings', 'Gebäuden')|E] auf dem [market|E], die diese [trade_good|E] herstellen.\n$BULLET_WITH_TAB$Einrichten einer [distribution_route|E] zwischen zwei $game_concept_markets$n in Eurem [realm|E].\n$BULLET_WITH_TAB$Kommisionierung eines Eurer [client_merchants|E], um die $game_concept_trade_good$ einzuführen.\n\nDoch nicht alle $game_concept_needs$ lassen sich leicht erfüllen, und manchmal ist es besser, den $game_concept_need$ unerfüllt zu lassen."
 # Construction Queue
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Bau einreihen"
 action_reactive_advice_construction_queue: "Ratschlag: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 action_reactive_advice_construction_queue_desc: "Ihr habt einen eingereihten Bau. Öffnet dies, um zu erfahren, wie Ihr all Eure Bauarbeiten verwaltet."
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$"
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_intro_desc: "Ihr habt einen Bau eingereiht!\n\nSelbst wenn Ihr Euch ein [building|E] derzeit nicht leisten könnt, könnt Ihr es immer noch einreihen, damit es gebaut wird, sobald Ihr das könnt.\n\nWerfen wir einen Blick auf die Reihe."
 reactive_advice_construction_queue_intro_prompt: "Öffnet die $BUILD_QUEUE_WINDOW_TITLE$-Tafel (hervorgehoben)"
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_queue_desc: "Dies sind die bisher eingereihten Bauarbeiten all Eurer [holdings|E].\n\nSobald Ihr ihre Kosten bezahlen könnt und alle Anforderungen erfüllt sind, werden die Kosten automatisch beglichen und der Bau beginnt.\n\nBauarbeiten werden in der aufgelisteten Reihenfolge begonnen, doch Ihr könnt sie ziehen und so neu ordnen."
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_reserve_desc: "Falls Ihr etwas [gold|E] oder andere Rohstoffe sparen wollt, könnt Ihr sie hier reservieren.\n\nDiese Menge wird nicht verwendet, um eingereihte Bauvorhaben zu beginnen, sodass Ihr einen zusätzlichen Puffer für Notfälle habt."
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$"
 reactive_advice_construction_queue_summary_desc: "Das ist alles, was Ihr über das Einreihen von Bauvorhaben wissen müsst. Viel Spaß beim Bauen!"
 # Profit Route Planner (auto-opens with the Route Planner, no important_action)
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Handelsrouten"
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_intro_desc: "Während andere auf Feldern schuften oder die Armen besteuern, profitiert Ihr vom Strom der [goods|E].\n\n[trade_routes|E] sind der Hauptweg für [merchants|E] und [republics|E], um [gold|E] zu verdienen."
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_recommended_goods_desc: "Zunächst müsst Ihr entscheiden, welche [trade_good|E] Ihr handeln wollt.\n\nDiese sind Empfehlungen für Euch, doch Ihr könnt auch alle Handelswaren sehen, falls Ihr nach etwas Bestimmten sucht."
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_adding_markets_desc: "Auf der Karte könnt Ihr alle [markets|E] sehen, die die ausgewählte [trade_good|E] handeln.\n\nUm einen Handel zu machen, müsst Ihr einen Markt mit einem [surplus|E] an Waren (#trade_surplus blaugrün#!), mit einem Ort verbinden, der [need|E] an ihnen hat (#trade_need golden#!).\n\nDrängen sich auf einem Markt zu viele andere [merchants|E], könnt Ihr nur einen Anteil der Waren dort handeln, der durch Eure [competitiveness|E] beschränkt wird.\n\nDurch billiges Einkaufen und teures Verkaufen kann man hohe Gewinne erzielen.\n\n#I Klickt auf Märkte, um sie der Route hinzuzufügen oder sie zu entfernen.#!"
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_carried_goods_desc: "Fügt Ihr [markets|E] zu Eurer [route|E] hin, wird die ausgewählte [good|E] durch die Route hierher befördert und angezeigt.\n\nDie linke Ware ist die [primary_good|E]: Ihr erhaltet [trade_expertise|E], wenn Ihr sie handelt. Im Lauf der Zeit gewährt Euch dies verschiedene Vorteile abhängig von der [trade_category|E].\n\n#I Befördert Ihr mehr als eine Ware, könnt Ihr eine andere an die erste Stelle ziehen, um sie zur $game_concept_primary_good$ zu machen.#!"
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_capacity_desc: "Man kann nur eine gewisse Zahl an [goods|E] befördern und dies nur mit einer gewissen Gesamt-[capacity|E]\n\nDiese Schwellen lassen sich durch den Bau von [Concept('company_buildings_short', 'Gebäuden')|e] in Eurer [company|E] verbessern."
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_path_desc: "In ähnlicher Weise werden Routen durch die [trade_route_length|E] beschränkt, und Ihr könnt nur an einer begrenzten Zahl von [Concept('markets', 'Märkten')|E] haltmachen."
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_trader_desc: "Schlussendlich könnt Ihr einen Eurer [associates|E] als [trader|E] zuweisen. Abhängig von der erteilten Aufgabe kann er unterschiedliche Aspekte der [route|E] verbessern."
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$"
 reactive_advice_trade_route_planner_summary_desc: "Wenn Ihr die eigene [company|E] entwickelt, erhaltet Ihr Zugriff auf weitere [routes|E] und verbessert, wie weit sie reichen und wie viel Ihr handeln könnt.\n\nSo könnt Ihr immer mehr [gold|E] verdienen!"
 # Merchant Government introduction
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Ein Kaufmann sein"
 action_reactive_advice_merchant_introduction: "Ratschlag: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 action_reactive_advice_merchant_introduction_desc: "Ihr seid [merchant|E]! Öffnet dies, um mehr über die Grundlagen des Geschäfts zu erfahren."
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$"
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_intro_desc: "Ihr seid [merchant|E]!\n\n[trade|E] mag der Lebenssaft Eurer [company|E] sein, doch es steckt mehr im Geschäft als nur das Geldverdienen."
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_overview_desc: "Wir sollten uns als Erstes ansehen, wie Ihr Eure [company|E] langfristig wachsen lassen könnt."
 reactive_advice_merchant_introduction_open_overview_prompt: "Öffnet den Übersichtsreiter auf der Reichs-Tafel (hervorgehoben)"
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_size_desc: "Dies ist Eure [company_size|E], das Hauptmaß für die Macht $game_concept_company_possessive$.\n\nWenn Eure $game_concept_company$ wächst, werden [rulers|E] mit höherem [rank|E] wie [kings|E] und [emperors|E] auf Euch aufmerksam."
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_domicile_desc: "Dies ist der [domicile|E] Eurer [company|E], Euer Ausgangspunkt.\n\nHier könnt Ihr [gold|E] und [prestige|E] ausgeben, um [domicile_buildings|E] zu bauen, die Eure $game_concept_company$ weiter verbessern."
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_company_purpose_desc: "Dies ist Euer [company_purpose|E], der den Schwerpunkt Eurer $game_concept_company$ festlegt.\n\nDer Händlerzweck ist der Standard, doch Ihr könnt ihn stattdessen auf [artifacts|E], Luxusgüter oder Geldverleih ändern."
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_patronage_desc: "Doch selbst als [merchant|E] ist man nicht frei von der Herrschaft örtlicher Fürsten."
 reactive_advice_merchant_introduction_open_patronage_prompt: "Öffnet den $MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$s-Rreiter (hervorgehoben)"
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_patron_desc: "Dies ist Euer [merchant_patron|E], der [ruler|E] des [Concept('holding', 'Besitztums')|E], wo Euer [domicile|E] liegt.\n\nIhr müsst zwar Steuern an Euren $game_concept_merchant_patron$ zahlen, Ihr könnt aber auch Vorteile aus dieser Beziehung ziehen.\n\nIhr könnt zum Beispiel Eure [client_contract|E] ändern, um Euren $game_concept_merchant_patron$ zu bitten, Eure Handelsbemühungen zu unterstützen oder vorgeschlagene [marriages|E] mit Adligen zu erleichtern."
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_clients_desc: "Ihr seid üblicherweise nicht der einzige [Concept('client', 'Klienten')|E]-[merchant|E] Eures [Concept('merchant_patron', 'Gönners')|E].\n\nAndere $game_concept_clients$ werden vom selben Ort aus handeln wie Ihr, und nur ein $game_concept_client$ kann die Sonder-[charter|E] halten. Die $game_concept_charter$ zu halten, verbessert Euren Handel durch Sonder-[decisions|E]."
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_open_trade_desc: "Endlich wird es Zeit, über den goldenen Elefanten im Raum zu sprechen: das Geldverdienen."
 reactive_advice_merchant_introduction_open_trade_prompt: "Öffnet den Handelsrouten-Reiter auf der Handelstafel (hervorgehoben)"
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_create_route_desc: "Dies sind Eure [trade_routes|E], der Hauptweg, um [gold|E] zu verdienen.\n\nWenn Ihr Eure $game_concept_company$ entwickelt, könnt Ihr mehr $game_concept_routes$ haben, die weiter reichen und mehr [goods|E] verlegen. Dies wiederum wird Euch mehr $game_concept_gold$ einbringen."
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$"
 reactive_advice_merchant_introduction_succeed_desc: "So leben die [merchant|E]: Man verdient [gold|E] durch die eigenen [trade_routes|E] und gibt es aus, um [prestige|E] und [company_size|E] voranzubringen.\n\nUnternehmen im Besitz von verantwortungsbewussten und organisierten $game_concept_merchants$n werden schließlich jene im Besitz von reichen [Concept('rulers','Herrschern')|E] übertreffen!"
 # Company Direction
 REACTIVE_ADVICE_COMPANY_DIRECTION: "Gesellschaftsausrichtung"
 action_reactive_advice_company_direction: "Ratschlag: $REACTIVE_ADVICE_COMPANY_DIRECTION$"
 action_reactive_advice_company_direction_desc: "Im Verlauf der Zeit kann sich Eure [company_direction|E] verschieben. Öffnet dies, um mehr darüber zu erfahren."
 action_reactive_advice_company_direction_click: "$click_to_open_lesson$"
 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_intro_desc: "Nicht alle [merchants|E] haben die gleichen Ziele. [gold|E] mag an sich schon Macht bedeuten, doch für manche sind Familie und Adel wichtiger."
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_house_desc: "Eure [company_direction|E] ist ein Teil Eures [Concept('house', 'Hauses')|E]. Also werfen wir einen Blick darauf."
 reactive_advice_company_direction_open_house_prompt: "Wählt Euer Haus aus (hervorgehoben)"
 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_open_direction_tab_desc: "Fahrt mit dem [Concept('sentiment','Ausrichtungsreiter')|E] fort."
 reactive_advice_company_direction_open_direction_tab_prompt: "Öffnet den Ausrichtungsreiter (hervorgehoben)"
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$"
 reactive_advice_company_direction_panel_desc: "Dies ist Eure [company_direction|E]. Ihr beginnt zwar als [company_sentiment_independent|El], sie neigt im Anschluss aber zu [company_sentiment_divided|El] oder [company_sentiment_concerted|El].\n\nDas Einheiraten in [Concept('noble', 'Adels')|E]-[houses|E] sorgt für eine Neigung zu geadelt, wohingegen die Heirat mit anderen [Concept('merchants', 'Kaufleuten')|E] für eine Tendenz in Richtung raubgierig sorgt."
 # Sponsor Construction
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Gönnerbau"
 action_reactive_advice_sponsor_construction: "Ratschlag: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 action_reactive_advice_sponsor_construction_desc: "Ihr könnt [buildings|E] in den [Concept('holdings', 'Besitztümern')|E] anderer [Concept('characters', 'Charaktere')|E] finanzieren. Öffnet dies, um zu erfahren, wie das geht."
 action_reactive_advice_sponsor_construction_click: "$click_to_open_lesson$"
 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_select_holding_desc: "Ihr könnt jetzt die Verbesserung von [Concept('buildings', 'Gebäuden')|E] in den [Concept('holdings', 'Besitztümern')|E] anderer [Concept('characters', 'Charaktere')|E] finanzieren."
 reactive_advice_sponsor_construction_select_holding_prompt: "Wählt ein beliebiges Besitztum auf der Karte aus"
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_open_district_desc: "Nun wählt einen seiner [districts|E] aus."
 reactive_advice_sponsor_construction_open_district_prompt: "Wählt einen Bezirk aus (hervorgehoben)"
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$"
 reactive_advice_sponsor_construction_button_desc: "Hier könnt Ihr einen Bau finanzieren! Beachtet, dass Ihr nur [buildings|E] #EMP aufwerten#! könnt und dies nur in üblichen [Concept('districts', 'Bezirken')|E].\n\nDer Hauptgrund für eine Finanzierung besteht darin, den [surplus|E] oder [need|E] an einer [trade_good|E] auf dem [market|E] [holding_possessive|E] zu erhöhen. So kann man den $game_concept_market$ mit einer [profit_routes|E] verbinden und die Menge an verdientem [gold|E] steigern."
 # Republican Politics
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Republikpolitik"
 action_reactive_advice_republican_politics: "Ratschlag: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 action_reactive_advice_republican_politics_desc: "Ihr seid Teil einer [republic|E]. Öffnet dies, um mehr über die Feinheiten ihrer Politik zu erfahren."
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$"
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_intro_desc: "Ihr als [house_head|E] seid Teil einer tugendhaften [republic|E]!\n\nAls Anführer einer [patrician_family|E] herrscht Ihr mit anderen $game_concept_patrician_families$ in einem einigermaßen demokratischen Prozess. Selbst wenn Ihr derzeit nicht [ruler|E] der $game_concept_republic$ seid, könnt Ihr immer an der Politik teilnehmen, solange Ihr [gold|E] und Einfluss habt."
 reactive_advice_republican_politics_intro_prompt: "Öffnet den Übersichtsreiter auf der Republik-Tafel (hervorgehoben)"
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_overview_desc: "Wie ihre Bürger sind auch nicht alle [republics|E] gleich. Jede $game_concept_republic$ hat einen [title_tier|E] und eine [republic_administration|E], die hier angezeigt wird.\n\nDurch das Ausgeben von [prestige|E] und [treasury|E] kann der [ruler|E] den $game_concept_title_tier$ der $game_concept_republic$ erhöhen und damit ihre Macht.\n\nDer derzeitige $game_concept_ruler$ kann auch die $game_concept_republic_administration$ ändern, die über die allgemeine Ausrichtung der $game_concept_republic$ bestimmt."
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_election_desc: "Da wir gerade vom [ruler|E] sprachen: Hier ist er!\n\nIm Gegensatz zur Tyrannei anderer [governments|E] wird der $game_concept_ruler$ einer [republic|E] gewählt und dies auch nur für eine begrenzte Amtszeit.\n\nDoch derselbe $game_concept_ruler$ kann wiedergewählt werden; es ist also auch nicht ungewöhnlich, dass er der führende Kandidat ist."
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_assembly_desc: "Die Macht des [Concept('ruler', 'Herrschers')|E] wird durch die [assembly|E] gebändigt. Werfen wir nun einen Blick darauf."
 reactive_advice_republican_politics_open_assembly_prompt: "Öffnet den Versammlungsreiter (hervorgehoben)"
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_assembly_desc: "Der [ruler|E] ist nicht allmächtig: Jede [Concept('law', 'Gesetzesänderung')|E] und jeder [republic_decree_short|E] muss von der [assembly|E] bestätigt werden. $game_concept_assembly$smitglieder können sogar eigene $game_concept_law$esänderungen vorschlagen.\n\nDie $game_concept_assembly$ besteht meist aus den [patrician_families|E] der [republic|E]. Sie haben zwar keine Ideologien im modernen Sinn, besitzen allerdings jeweils eine [house_ambition|E], die sich darauf auswirkt, wie sie wählen.\n\nBeachtet jedoch, dass eine $game_concept_republic$ sich nicht der Vielfalt und Unordnung einer Demokratie unterwerfen muss. Wenn $game_concept_laws$ beschlossen werden, kann sich das Machtgleichgewicht zwischen $game_concept_assembly$ und $game_concept_ruler$ ändern."
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_open_families_desc: "Da die [assembly|E] oft aus [patrician_families|E] besteht, fahren wir mit ihnen fort."
 reactive_advice_republican_politics_open_families_prompt: "Öffnet den Familienreiter (hervorgehoben)"
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_families_desc: "Dies sind die [patrician_families|E] der [republic|E].\n\nJede Familie (einschließlich Eurer) hat eine [patrician_rating|E]. Wenn Eure Einnahmen durch [trade|E] steigen und Ihr Sitze in der [assembly|E] oder dem Rat des [Concept('ruler', 'Herrschers')|E] erlangt, verbessert sich Eure $game_concept_patrician_rating$.\n\nEine hohe $game_concept_patrician_rating$ zu haben, erhöht die Auswirkungen Eurer [house_ambition|E] und kann es Euch sogar erlauben, die Regierung zu stürzen!"
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$"
 reactive_advice_republican_politics_summary_desc: "Das Schicksal der [republic|E] liegt in Euren Händen.\n\nIhr müsst entscheiden, wie Ihr sie gestalten wollt. Werdet Ihr die Macht nur für Eure Familie bewahren oder sie mit anderen teilen?\n\nWenn Eure [patrician_rating|E] durch Eure [trade_routes|E] wächst, wachsen auch Eure Macht und Euer Einfluss."
 # Distribution Route Planner reactive advice
 reactive_advice_distribution_route_planner: "$game_concept_distribution_routes$"
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_intro_desc: "Hier könnt Ihr Eure eigenen [distribution_routes|E] schaffen.\n\nVerteilungsrouten erlauben es Euch [trade_goods|E] zu verlegen, um [needs|E] auf [Concept('markets', 'Märkten')|E] in Eurem eigenen [realm|E] zu erfüllen."
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_basic_goods_desc: "Während eine [distribution_route|E] eine beliebige Menge an [trade_goods|E] mit sich führen kann, kann sie doch nur die Waren verlegen, die als [basic_trade_goods|E] gelten und die hier angezeigt werden.\n\nDaher müsst Ihr nicht entscheiden, welche $game_concept_trade_good$ verlegt wird.\n\n#I Ihr könnt eine beliebige Grundware auswählen, um ihren [market_balance|E] auf der Karte zu sehen.#!"
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "Auf der Karte seht Ihr unter dem Namen jedes [Concept('market','Markts')|E], welche [basic_trade_goods|E] einen [surplus|E] haben. Das heißt, dass Ihr Waren von hier wegbewegen könnt."
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_unmet_needs_desc: "Ebenso werden unerfüllte [needs|E] angezeigt. Dies bedeutet, dass Ihr [basic_trade_goods|E] auf diesen [market|E] verlegen könnt."
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$"
 reactive_advice_distribution_route_planner_needs_desc: "Eine [distribution_route|E] kann nur zwei [markets|E] verbinden, und [goods|E] reisen in beide Richtungen.\n\nSobald Ihr dieser Route zwei Märkte hinzugefügt habt, könnt Ihr sehen, wie die [needs|E] im hervorgehobenen Fenster erfüllt werden.\n\nDa die Routen durch Euer eigenes [realm|E] führen, müsst Ihr weder den [buy_price|E] noch etwaige [tolls|E] bezahlen.\n\n#I Um einen Markt zur Route hinzuzufügen, klickt Ihr auf der Karte auf ihn.#!"
