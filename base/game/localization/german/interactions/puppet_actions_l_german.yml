 skilled_puppeteer_modifier_general_desc: "Irgendeine meisterhafte Gestalt lenkt die Aktionen dieses Charakters aus dem Schatten heraus."
 spiritual_puppeteer_modifier_cleric: "Zur Marionette gemacht zwecks Erlösung"
 spiritual_puppeteer_modifier_cleric_desc: "Dieser Charakter ist zutiefst überzeugt, dass er dazu angeleitet wird, das Richtige zu tun … durch irgendeinen unbekannten spirituellen Meister."
