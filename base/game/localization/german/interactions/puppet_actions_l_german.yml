 dreadful_puppeteer_modifier: "Verzaubert von ruchlosem Meister"
 dreadful_puppeteer_modifier_desc: "Die Seele dieses Charakters ist von bösen Launen verdunkelt. Vielleicht sind es seine eigenen … oder vielleicht wurden sie ihm aufgezwungen."
 beloved_puppeteer_modifier: "Einem anderen anvertraut"
 beloved_puppeteer_modifier_desc: "Ein eigensinniger Meister lenkt das Herz dieses Charakters, und die Liebe lässt ihn glauben, es sei das Beste so."
 deranging_puppeteer_modifier: "In den Wahnsinn manipuliert"
 deranging_puppeteer_modifier_desc: "Der wirre Geist dieses Charakters ist das gequälte Spielzeug einer höheren Macht. Er wird zu merkwürdigen Taten getrieben."
