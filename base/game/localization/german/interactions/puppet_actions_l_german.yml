 pam_interactions_events.0120.opening: "An den [recipient.GetFaith.GetReligion.GetAdjective|l]en Leitstern [recipient.GetFirstName],"
 pam_interactions_events.0120.desc_religious_head_actor: "Seit die schöpferischen Kräfte ([recipient.GetFaith.CreatorName]) die ersten Menschen schufen, hatten wir niemals ein Oberhaupt ([recipient.GetTitleAsName]) wie Euch! Mein Wunsch sei Euer Befehl.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "Ich kann die Gläubigen nicht allein führen. Sogar der Ersten unter den Leuten der höchsten Macht ([recipient.GetFaith.HighGodName]), das Oberhaupt ([recipient.GetTitleAsName]) höchstpersönlich, musste sich den Wegen dieser Welt beugen. Daher werde ich Euch helfen und gehorchen, o [actor.GetTitleAsName].\n\n"
 pam_interactions_events.0120.desc: "Gesegnet bin ich in meinem Dienst, denn auf den Befehl der höchsten Macht ([recipient.GetFaith.HighGodName]) hin soll ich den Seelen dienen – und auf Euren Befehl? Ich werde mich bemühen, alles zu tun, was ich kann.\n\n"
 pam_interactions_events.0120.desc_lunacy: "Ich fürchte, mein Geist selbst stirbt … und kein Rat außer dem Euren spendet irgendeinen Trost …\n\n"
 pam_interactions_events.0120.desc_dread: "Lasst uns vernichten, was vernichtet werden muss: jene, die die höchste Macht ([recipient.GetFaith.HighGodName]) verließ … so wie sie mich verließ.\n\n"
 pam_interactions_events.0120.desc_piety: "Denn die höchste Macht ([recipient.GetFaith.HighGodName|U]) selbst wies uns einen heiligen Auftrag zu!\n\n"
 pam_interactions_events.0120.desc_friendly: "Meine Liebe, die mein[actor.Custom('DE_END_PRO_S_N')] [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] hat, und mein absolutes Vertrauen sollen mich führen durch was immer auch da kommen mag.\n\n"
 pam_interactions_events.0120.desc_skill: "Unter Eurer geschickten Führung … erwarte ich Teil von großen Dingen zu sein.\n\n"
 pam_interactions_events.0120.outro: "Welche Eurer Gebete sollen beantwortet werden?"
 pam_interactions_events.0120.a: "Jedes Gebet, das ich habe, o [recipient.GetTitleAsNameNoTooltip]!"
 pam_interactions_events.0121.opening: "O [Select_CString(ROOT.Char.IsFemale, 'verehrungswürdige', 'verehrungswürdiger')] [ROOT.Char.GetTitleAsName],"
 pam_interactions_events.0121.desc_honor: "Hiermit lege ich jenen Stolz ab, den ich als [recipient.GetTitleAsName] von [recipient.GetPrimaryTitle.GetNameNoTier] kannte und werde Eurem Rat innig folgen.\n\n"
 pam_interactions_events.0121.desc: "[Select_CString(recipient.IsFemale, 'Die', 'Der')] [recipient.GetTitleAsName] von [recipient.GetPrimaryTitle.GetNameNoTier] wird [recipient.Custom('DE_PRO_POS_S_3P')]e Rolle in Euren Machtspielen spielen und Euch dabei helfen, Euch in diese sterbliche Welt einzumischen.\n\n"
 pam_interactions_events.0121.desc_lunacy: "Es ist, wie Ihr sagt: Mein Hof ist ein Ort der Plapperer und Lügner. Ich habe dunkle Träume. Nur Eure Worte ergeben für mich Sinn, und nur Eure Medizin verspricht Linderung …\n\n"
 pam_interactions_events.0121.desc_dread: "In Eurer Hand bin ich eine Waffe. Ohne Zweifel, ohne Skrupel.\n\n"
 pam_interactions_events.0121.desc_piety: "Befreit mich von meinen Zweifeln und zeigt mir die Wege, auf denen ich mir die Liebe der höchsten Macht ([recipient.GetFaith.HighGodName]) verdienen kann!\n\n"
 pam_interactions_events.0121.desc_friendly: "O [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], ich vertraue Euch völlig, und ich schwöre, dass ich Euch nicht enttäuschen werde.\n\n"
 pam_interactions_events.0121.desc_skill: "Ich vertraue darauf, dass Ihr mir ein Scheitern nicht erlauben werdet, da Ihr die Angelegenheiten meines Reichs doch so genau beobachtet.\n\n"
 pam_interactions_events.0121.outro: "Lasst uns uns um Eure Pläne kümmern."
 pam_interactions_events.0121.a: "[recipient.Custom('DE_PRO_PER_S_3P_N')|U] mag zwar [recipient.GetTitleAsNameNoTooltip|U] sein, doch [recipient.Custom('DE_PRO_PER_S_3P_N')] dient [recipient.Custom('DE_PRO_POS_S_3P')]er Kirche."
