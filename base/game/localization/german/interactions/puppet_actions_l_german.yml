l_german:
 puppet_excommunicate_interaction: "#D Excommunicate via your Puppet#!"
 actor_secondary_puppet_excommunicate_interaction: "$theological_agent_puppet$"
 theological_agent_puppet: "Reichspriester-Marionette"
 theological_agent_puppet_desc: "Die [realm_priest|E]-[puppet|E] handelt als Eure Stimme innerhalb der Kirche und erlaubt es Euch, bei [Concept('ecumenical_councils', 'ökumenischen Konzilen')|E] abzustimmen und [rites|E] zu gründen."
 puppet_type_no_candidates: "Ihr habt keine verfügbaren [PuppetType.GetName|V]-[puppets|E]"
 puppet_action_description_puppet_action_give_gift: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('gift_interaction')]#! nutzen, um [gold|E] für eine bessere [opinion|E] bei einem anderen [character|E] auszugeben"
 puppet_action_description_puppet_action_ask_excommunicate_character: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_excommunication_interaction')]#! nutzen, damit das [head_of_faith|E] einen sündigen [character|E] [Concept('excommunicate', 'exkommuniziert')|El]"
 puppet_action_description_puppet_trigger_can_create_faith: "Einen neuen [Concept('faith', 'Glauben')|E] schaffen"
 puppet_action_description_puppet_trigger_can_create_rite: "Einen neuen [rite|E] schaffen"
 puppet_action_description_puppet_action_command_murder: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('start_murder_interaction')]#! gegen einen Ziel-[character|E] einsetzen"
 puppet_action_description_puppet_action_request_elevation: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_elevation_interaction')]#! einsetzen, um beim [head_of_faith|E] per Petition einen prestigeträchtigeren [clerical_title|E] zu erlangen"
 request_clerical_region_title_cannot_request_hof_see_tt: "Kann keinen [clerical_title|E] erbitten, der vom [head_of_faith|E] gehalten wird"
 request_clerical_region_title_capital_region_tt: "Euer [capital|E] muss in der [clerical_region|E] liegen, die Ihr erbittet"
 higher_piety_level_than_hof: "[piety_level|E] ist höher als die [head_of_faith_possessive|e]"
 lower_piety_level_than_hof: "[piety_level|E] ist niedriger als die [head_of_faith_possessive|e]"
 is_puppet_action_valid_first: "Ihr habt eine [puppet|E], die Folgendes erlaubt: [PUPPET_ACTION_TYPE.GetName(CHARACTER.Self)]"
 is_puppet_action_valid_third: "[CHARACTER.GetShortUIName|U] hat eine [puppet|E], die Folgendes erlaubt: [PUPPET_ACTION_TYPE.GetName(CHARACTER.Self)]"
 is_puppet_action_valid_global: "Hat eine [puppet|E], die Folgendes erlaubt: [PUPPET_ACTION_TYPE.GetName(GetPlayer.Self)]"
 not_is_puppet_action_valid_first: "Ihr habt #bold keine#! [puppet|E], die Folgendes erlaubt: [PUPPET_ACTION_TYPE.GetName(CHARACTER.Self)]"
 not_is_puppet_action_valid_third: "[CHARACTER.GetShortUIName|U] hat #bold keine#! [puppet|E], die Folgendes erlaubt: [PUPPET_ACTION_TYPE.GetName(CHARACTER.Self)]"
 not_is_puppet_action_valid_global: "Hat #bold keine#! [puppet|E], die Folgendes erlaubt: [PUPPET_ACTION_TYPE.GetName(GetPlayer.Self)]"
 request_elevation_interaction: "Erhebung erbitten"
 request_elevation_interaction_desc: "Das [head_of_faith|E] um den [clerical_title|E] Eurer [clerical_region|E] bitten, unabhängig davon, ob er frei ist oder von Eurem [Concept('superior', 'Oberen')|E] gehalten wird"
 request_elevation_interaction_notification: "[target.GetNameNoTier|U] braucht einen Hirten, der seiner würdig ist. Setzt mich auf diesen Sitz und die Herde wird wissen, dass sie nicht vom Weg abkommt."
 request_elevation_cannot_unseat_player_tt: "Kann nicht den [holder|E] eines [Concept('clerical_title', 'Kirchentitels')|E] absetzen, der von einem anderen Spieler beherrscht wird"
 request_elevation_interaction_toast_title: "Erhoben!"
 request_elevation_interaction_toast_title_puppeteer: "[puppet_or_actor.GetShortUIName|U] wurde erhoben!"
 request_ecclesiastical_title_expansion_interaction: "Kirchentitelausweitung erbitten"
 request_ecclesiastical_title_expansion_interaction_desc: "Euch an Euer [head_of_faith|E] wenden, um Eure [clerical_region|E] in eine angrenzende [duchy|E] auszuweiten\n\nAlle [Concept('de_jure', 'De-jure')|E]-Gemeinden des ausgewählten [Concept('duchy', 'Herzogtums')|E] werden zu Eurer [clerical_region|E] hinzugefügt"
 request_ecclesiastical_title_expansion_interaction_notification: "Den Gläubigen von [target.GetNameNoTier] fehlt geistliche Führung. Macht diese Lande zum Ruhm der höchsten Macht ([actor.GetFaith.HighGodName]) zu einem Teil meiner Erzdiözese."
 request_ecclesiastical_title_expansion_accepted_tt: "Kirchentitel ausgeweitet"
 recipient_secondary_request_ecclesiastical_title_expansion_interaction: "Träger"
 puppet_action_description_puppet_action_request_ecclesiastical_title_expansion: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_expansion_interaction')]#! einsetzen, um Euch an Euer [head_of_faith|E] zu wenden, um Eure [clerical_region|E] in ein angrenzendes [duchy|E] auszuweiten"
 request_ecclesiastical_title_merger_interaction: "Kirchentitelzusammenfassung erbitten"
 request_ecclesiastical_title_merger_interaction_desc: "Euch an Euer [head_of_faith|E] wenden, um zu billigen, dass die [clerical_region|E] Eures [Concept('capital_possessive', 'Hauptsitzes')|E] die eines Nachbarn schluckt"
 request_ecclesiastical_title_merger_interaction_notification: "Die Herde von [target.GetNameNoTier] kam mangels einer festen Hand vom rechten Weg ab, wohingegen die meine gedeiht. Lasst diesen Sitz auf mich übergehen, und ein gläubiger Hirte wird das pflegen, was zwei getrennt haben."
 request_ecclesiastical_title_merger_accepted_tt: "Kirchentitel zusammengefasst"
 request_ecclesiastical_title_merger_absorbed_tt: "Kirchentitel verloren"
 pam_request_ecclesiastical_title_merger_no_eligible_neighbor_tt: "Keine zulässige benachbarte [clerical_region|E]: Eure [clerical_region|E] muss an mindestens eine [clerical_region|E] desselben Glaubens grenzen"
 puppet_action_description_puppet_action_request_ecclesiastical_title_merger: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_merger_interaction')]#! einsetzen, um Euch an Euer [head_of_faith|E] zu wenden, um eine benachbarte [clerical_region|E] mit Eurer zusammenzufassen"
 rival_ecclesiastical_title_merged: "[CHARACTER.GetShortUIName] schluckte den [clerical_title|E] von [TARGET_CHARACTER.GetShortUIName]."
 request_ecclesiastical_title_creation_interaction: "Kirchentitelschaffung erbitten"
 request_ecclesiastical_title_creation_interaction_desc: "Euer [head_of_faith|E] bitten, einen neuen [clerical_title|E] in Eurem [realm|E] einzurichten\n\nIhr wählt den [title|E], an dem er sitzt, und seinen ersten [holder|E]\n\n#weak Die neue [clerical_region|E] deckt alle [Concept('de_jure', 'De-jure')|E]-[Concept('county', 'Gemeinden')|E] im [Concept('de_jure', 'De-jure')|E]-[kingdom|E] des Sitzes ab, die noch nicht Teil einer [clerical_region|E] sind#!"
 request_ecclesiastical_title_creation_interaction_notification: "Die Gläubigen meiner Lande werden aus weiter Ferne gehütet, von Fremden, die sie nicht kennen. Erschafft einen neuen Sitz im von mir benannten Sitz, und es soll ihm an nichts mangeln."
 request_ecclesiastical_title_creation_accepted_tt: "[new_title.GetNameNoTooltip|U] geschaffen"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt: "Ihr haltet kein [duchy|E] oder höheren [title|E], dessen [Concept('de_jure', 'De-jure')|E]-[capital|E] Sitz einer neuen [clerical_region|E] sein kann"
 pam_request_ecclesiastical_title_creation_no_eligible_anchor_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip] hält kein [duchy|E] oder höheren [title|E], dessen [Concept('de_jure', 'De-jure')|E]-[capital|E] Sitz einer neuen [clerical_region|E] sein kann"
 pam_new_clerical_region_invalid_anchor_tt: "Der [Concept('de_jure', 'De-jure')|E]-[capital|E] dieses [Concept('title', 'Titels')|E] muss dem [Concept('faith', 'Glauben')|E] des Bittstellers anhängen und in seinem [realm|E] gehalten werden und darf nicht bereits in einer [clerical_region|E] sein"
 pam_request_ecclesiastical_title_creation_needs_free_cleric_tt: "Erfordert einen [clergy|E]-Kandidaten, der noch keine [clerical_region|E] hält"
 recipient_secondary_request_ecclesiastical_title_creation_interaction: "Träger"
 puppet_action_description_puppet_action_request_ecclesiastical_title_creation: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_creation_interaction')]#! nutzen, um Euer [head_of_faith|E] zu bitten, einen neuen [Concept('clerical_region', 'Kirchenregions')|E]-[title|E] zu schaffen, der in einem [title|E] Eurer Wahl verankert ist"
 request_create_new_ecclesiastical_title_effect_tt: "Ein neuer [clerical_title|E] wird im [Concept('de_jure', 'De-jure')|E]-[capital|E] von [target_kingdom.GetName] geschaffen, der alle [Concept('de_jure', 'De-jure')|E]-[Concept('county', 'Gemeinden')|E] des [Concept('de_jure', 'De-jure')|E]-[Concept('kingdom', 'Königreichs')|E] des Sitzes abdeckt, die noch nicht in einer [clerical_region|E] liegen, und [new_ecclesiastical_holder.GetShortUIName] gewährt"
 request_ecclesiastical_title_split_interaction: "Kirchentitelspaltung erbitten"
 request_ecclesiastical_title_split_interaction_desc: "Euer [head_of_faith|E] bitten, einen neuen Kirchen-[title|E] aus einer bestehenden [clerical_region|E] zu schaffen\n\nWenn Ihr ein weltlicher [ruler|E] seid, wird sie in Eurem [capital|E] gegründet und einem [holder|E] Eurer Wahl gewährt. Wenn Ihr Klerus mit Landbesitz seid, werdet Ihr als erster [holder|E] eingesetzt\n\n#weak Die Spaltung folgt Reichsgrenzen: Der neue [title|E] deckt nur die [counties|E] in dieser [clerical_region|E] ab, die von Euch gehalten werden (oder falls Ihr Klerus seid, die von Eurem [Concept('liege', 'Lehnsherrn')|E]); ein größeres [realm|E] kann also mehr abspalten#!"
 request_ecclesiastical_title_split_interaction_notification: "Kein einzelner Hirte kann über eine Herde wachen, die so groß ist. Spaltet aus diesen Landen einen neuen Sitz ab, und keine Seele in Not muss jemals wieder unbeachtet bleiben."
 clerical_title_split_tt: "Ein neuer Kirchentitel, der das [realm|E] von [puppet_liege.GetTitledFirstName] abdeckt, wird abgespalten und aus der [clerical_region|E] von [puppet_superior.GetName] geschaffen. [new_ecclesiastical_holder.GetName|U] wird der erste [holder|E]"
 request_ecclesiastical_title_split_effect_tt: "Ein neuer [clerical_title|E], der das [realm|E] von [puppet_or_actor.GetTitledFirstName] abdeckt, wird von [split_source_clerical_region.GetName] abgespalten und [new_ecclesiastical_holder.GetShortUIName] gewährt"
 request_ecclesiastical_title_split_accepted_tt: "Kirchentitel abgespalten"
 request_ecclesiastical_title_split_lost_tt: "Kirchenregion verringert"
 actor_secondary_request_ecclesiastical_title_split_interaction: "Neuer Träger"
 recipient_secondary_request_ecclesiastical_title_split_interaction: "Derzeitiger Träger"
 pam_split_no_region_to_split_tt: "Es muss einen Teil einer [clerical_region|E] in Eurem [realm|E] geben, der abgespalten werden kann"
 pam_split_no_region_to_split_tt_puppeteer: "Es muss einen Teil einer [clerical_region|E] im [realm|E] von [puppet_or_actor.GetShortUINameNoTooltip] geben, der abgespalten werden kann"
 pam_split_capital_is_region_seat_tt: "[capital|E] von [puppet_or_actor.GetShortUINameNoTooltip] kann nicht der [clerical_region_capital|E] der abgespaltenen [clerical_region|E] sein"
 pam_split_no_eligible_holder_tt: "Es muss einen zulässigen [holder|E] für den neuen [clerical_title|E] geben"
 pam_split_too_small_tt: "Die neue [clerical_region|E] wäre zu klein: Sie muss mindestens #V 3#! [counties|E] enthalten"
 pam_split_liege_capital_is_region_seat_tt: "Der [capital|E] Eures [Concept('liege', 'Lehnsherrn')|E] kann nicht der [clerical_region_capital|E] der abgespaltenen [clerical_region|E] sein"
 pam_split_larger_than_superior_tt: "Die neue [clerical_region|E] darf nicht größer als der Anteil sein, den der derzeitige [holder|E] behält"
 pam_split_region_is_religious_head_seat_tt: "Die gespaltene [clerical_region|E] kann nicht der Sitz eines [Concept('head_of_faith', 'Glaubensoberhaupts')|E] oder [Concept('head_of_rite', 'Ritus-Oberhaupts')|E] sein"
 request_clerical_elector_title_interaction: "Kardinalat erbitten"
 request_clerical_elector_title_interaction_desc: "Eine Petition an Euer [head_of_faith|E] richten, um Euch zum [cardinal|E] zu ernennen. Euer [head_of_faith|E] wird Euer [superior|e]"
 request_clerical_elector_title_interaction_notification: "Ich wahrte den Glauben in Wort und Tat und bitte nun darum, ihm aus größerer Nähe zu dienen. Gewährt mir den roten Hut, und wenn das Kollegium sich äußert, sollt Ihr nie daran zweifeln, für wen meine Stimme spricht."
 request_clerical_elector_title_interaction_toast: "Kardinalat gewährt"
 request_clerical_elector_title_interaction_decline_toast: "[recipient.GetShortUINameNoTooltip|U] verweigerte sich der Bitte von [puppet_or_actor.GetShortUINameNoTooltip] um ein [cardinalate|E]"
 request_clerical_elector_title_interaction_accept_tt: "[recipient.GetShortUINameNoTooltip|U] nahm die Bitte von [puppet_or_actor.GetShortUINameNoTooltip] um ein [cardinalate|E] an"
 external_theological_agent_puppet: "Klerusherrscher-Marionette"
 external_clerical_puppet: "[external_clerical_puppet|E]"
 has_relation_external_clerical_puppet: "Ist bereits eine [external_clerical_puppet|E]"
 external_theological_agent_puppet_desc: "Die Klerus-[puppet|E] ist außerhalb Eures [Concept('realm', 'Reichs')|E]; [archbishops|E], [cardinals|E] oder das [head_of_faith|E]. Sie ist mächtig und kann [excommunicate|El]."
 external_ruler_puppet: "Weltliche Herrscher-Marionette"
 external_ruler_puppet_desc: "Ein [ruler|E], der durch Liebe, Furcht oder eine Verpflichtung an Euch gebunden ist. Befehlt ihm, für Euch zu [Concept('scheme','Komplotte zu schmieden')|E], und sein [realm|E] wird dem Euren dienen."
 # Religious - PAM (additions)
 puppet_action_description_puppet_action_request_ecclesiastical_title_split: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_ecclesiastical_title_split_interaction')]#! nutzen, um Euer [head_of_faith|E] zu bitten, einen neuen [clerical_title|E] von einer bestehenden [clerical_region|E] abzuspalten"
 puppet_action_description_puppet_action_demand_church_succession_hof: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('demand_church_succession_religious_head_interaction')]#! als [head_of_faith|E] nutzen, um einen Haupt-[title|E] [rulerpossessive|E] mit demselben [Concept('faith', 'Glauben')|E] als Ersatzerbschaft einzusetzen"
 puppet_action_description_puppet_action_give_cardinal_order: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('give_cardinal_order_interaction')]#! einsetzen, um Regional-[modifiers|E] in ihren [baronies|E] anzuwenden"
 puppet_action_description_puppet_action_appoint_cardinal: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('appoint_cardinal_interaction')]#! einsetzen, um ein [clergy|E]-Mitglieder desselben [Concept('faith', 'Glaubens')|E] zum [cardinal|E] zu erheben"
 puppet_action_description_puppet_action_destroy_cardinalate: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('destroy_cardinalate_interaction')]#! einsetzen, um ein [cardinalate|E] aufzulösen und den Träger aus dem [college_of_cardinals|E] zu entfernen"
 puppet_action_description_puppet_action_ecclesiastic_grant_claim: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('ecclesiastic_grant_claim_interaction')]#! bei einem [Concept('pressed_claim', 'durchgesetzten Anspruch')|E] eines [Concept('title', 'Titels')|E] [rulerpossessive|E] desselben [Concept('faith', 'Glaubens')|E] nutzen"
 puppet_action_description_puppet_action_sway_ruler_to_my_rite: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('sway_ruler_to_my_rite_interaction')]#! nutzen, um einen [ruler|E] desselben [Concept('faith', 'Glaubens')|E] für Euch zu gewinnen"
 # Religious
 puppet_action_description_puppet_action_demand_conversion: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('demand_conversion_interaction')]#! nutzen, um einen [ruler|E] desselben [Concept('house', 'Hauses')|E] zu zwingen, Euren [Concept('faith', 'Glauben')|E] anzunehmen"
 puppet_action_description_puppet_action_demand_conversion_vassal_ruler: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('demand_conversion_vassal_ruler_interaction')]#! nutzen, um einen [Concept('vassal', 'Vasallen')|E] oder [tributary|E] zu zwingen, Euren [Concept('faith', 'Glauben')|E] anzunehmen"
 puppet_action_description_puppet_action_request_clerical_chastity: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('request_clerical_chastity_interaction')]#! nutzen, um einen Erwachsenen desselben Glaubens zu einem Kirchengelübde zu nötigen"
 puppet_action_description_puppet_action_take_vows: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('take_vows_interaction')]#! nutzen, um einen [courtier|E] zum Klerus zu schicken"
 puppet_action_description_puppet_action_take_monastic_vows: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('take_monastic_vows_interaction')]#! nutzen, um einen [courtier|E] zu einem [monastic_holy_order|E] zu schicken"
 puppet_action_description_puppet_action_send_to_holy_order: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('send_to_holy_order_interaction')]#! nutzen, um einen [courtier|E] oder ein [child|E] in den Dienst am Glauben zu entsenden"
 puppet_action_description_puppet_action_monastic_donation: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('monastic_donation_interaction')]#! nutzen, um [gold|E] für [spiritual_fulfillment|El] zu zahlen"
 puppet_action_description_puppet_action_lease_monastic: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('lease_title_to_existing_monastic_order_interaction')]#! nutzen, um eine [church_holding|E]-[barony|E] an einen [holy_order|E] zu verpachten"
 puppet_action_description_puppet_action_declaration_of_repentance: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('declaration_of_repentance_interaction')]#! nutzen, um eine Petition an Euer [head_of_faith|E] zur Aufhebung Eurer [excommunication|E] zu schicken"
 puppet_action_description_puppet_action_inspire_conversion: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('inspire_conversion_interaction')]#! nutzen, um einen [Concept('nomadic', 'nomadischen')|E] [Concept('vassal', 'Vasallen')|E] (und dessen Gemeinden) in Euren Wohnsitz-[Concept('faith', 'Glauben')|E] zu holen"
 puppet_action_description_puppet_action_literalist_debate: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('literalist_debate_interaction')]#! nutzen, um mit einem Gleichgestellten desselben Glaubens einen Übungskampf um [piety|E] auszufechten"
 puppet_action_description_puppet_action_strengthen_claim: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('strengthen_claim_interaction')]#! nutzen, um einen schwachen [claim|E] mit Billigung [bishop_possessive|E] durchzusetzen"
 puppet_action_description_puppet_action_convert_to_religion: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('convert_to_religion_interaction')]#! nutzen, um freiwillig den [Concept('faith', 'Glauben')|E] Eures [Concept('liege', 'Lehnsherrn')|E] oder [Concept('suzerain', 'Suzeräns')|E] anzunehmen"
 puppet_action_description_puppet_action_designate_theocratic_heir: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('designate_theocratic_heir_interaction')]#! nutzen, um einen [courtier|E] desselben Glaubens zu Eurem Nachfolger zu machen"
 puppet_action_description_puppet_action_demand_church_succession: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('demand_church_succession_interaction')]#! als [clerical_title|E]-[holder|E] nutzen, um die Ersatzerbschaft eines benachbarten [Concept('title', 'Titels')|E] zu übernehmen"
 puppet_action_description_puppet_action_increase_theocratic_heir_candidacy: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('declaration_of_repentance_interaction')]#! nutzen, um die [appointment_level|E] eines Kandidaten auf einen [clerical_title|E] zu steigern"
 puppet_action_description_puppet_action_excommunicate: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('excommunicate_interaction')]#! gegen einen [Concept('sinful', 'sündhaften')|E] [character|E] desselben [Concept('faith', 'Glaubens')|E] nutzen"
 puppet_action_description_puppet_action_lift_excommunication: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('lift_excommunication_interaction')]#! nutzen, um einem [character|E] die Absolution zu erteilen"
 puppet_action_description_puppet_action_temporal_condemnation: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('temporal_condemnation_interaction')]#! einsetzen, um zu versuchen, einen erwachsenen [Concept('vassal', 'Vasallen')|E] derselben [religion|E] zu verdammen"
 puppet_action_description_puppet_action_select_ghw_beneficiary: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('select_ghw_beneficiary_interaction')]#! nutzen, um Euren [Concept('beneficiary', 'Begünstigten')|E] für einen geschworenen [Concept('great_holy_war', 'Großen Religionskrieg')|E] auszuwählen"
 puppet_action_description_puppet_action_attempt_conversion_local_ruler: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('attempt_conversion_of_local_ruler_interaction')]#! als [adventurer|E] bei einem örtlichen [ruler|E] in Eurer [domicile|E]-[county|E] nutzen"
 puppet_action_description_puppet_action_demand_conversion_player_ruler: "Die [interaction|E] #V [GetPlayer.GetPlayerInteractionName('demand_conversion_player_ruler_interaction')]#! nutzen, um einen [Concept('vassal', 'Vasallen')|E] zu zwingen, Euren [Concept('faith', 'Glauben')|E] anzunehmen"
