l_german:
 demand_church_succession_interaction: "Kirchen-Nachfolge verlangen"
 demand_church_succession_religious_head_interaction: "Kirchen-Nachfolge erlassen"
 demand_church_succession_interaction_desc: "Sollte [recipient.GetTitledFirstName] diese Welt ohne einen rechtmäßigen Erben verlassen, wird das von [recipient.Custom('DE_PRO_PER_S_3P_D')] gehaltene Land an den Träger von [actor.GetPrimaryTitle.GetName] als [Concept('fallback_heir', 'Ersatzerben')|E] zurückfallen."
 demand_church_succession_religious_head_interaction_desc: "Als [head_of_faith|E] des [actor.GetFaith.GetAdjective|l]en [Concept('faith', 'Glaubens')|E] erlassen, dass das Reich von [recipient.GetTitledFirstName] an [actor.GetPrimaryTitle.GetName] fällt, sollte [recipient.Custom('DE_PRO_PER_S_3P_N')] ohne Erben versterben."
 demand_church_succession_target_in_reach: "[realm|E] von [recipient.GetShortUIName] grenzt nicht an [realm|E] von [actor.GetShortUIName] und liegt nicht in [archdiocese|E] von [actor.GetShortUIName]"
 demand_church_succession_no_existing_fallback: "[recipient.GetTitledFirstName|U] hat die eigene Nachfolge bereits einem anderen Kleriker oder [Concept('fallback_heir', 'Ersatzerben')|E] versprochen"
 demand_church_succession_no_elective: "[recipient.GetTitledFirstName|U] hält [recipient.Custom('DE_PRO_POS_S_3P')]en [primary_title|E] unter einer [elective_succession|E] oder [advanced_succession|E]"
 demand_church_succession_recently_refused_tt: "[recipient.GetTitledFirstName|U] widersetzte sich vor kurzem der Forderung einer Kirchennachfolge und ist für 10 Jahre vor solchen Forderungen geschützt"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Kirchen-Nachfolge verlangen"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.GetTitledFirstName|U] verlangt, dass [recipient.GetTitledFirstName] das eigene Reich an [actor.GetPrimaryTitle.GetName] weitergeben soll, sollte [recipient.Custom('DE_PRO_PER_S_3P_N')] ohne Erben versterben."
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName|U] ist an den [Concept('faith', 'Glauben')|E] gebunden"
 demand_church_succession_actor_toast_desc: "Sollte [recipient.Custom('DE_PRO_PER_S_3P_N')] ohne Erben versterben, wird [actor.GetPrimaryTitle.GetName] [recipient.Custom('DE_PRO_POS_S_3P')] Reich erben."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName|U] band [recipient.GetTitledFirstName] an den [Concept('faith', 'Glauben')|E]"
 demand_church_succession_actor_toast_desc_puppeteer: "Sollte [recipient.Custom('DE_PRO_PER_S_3P_N')] ohne Erben versterben, wird [puppet_or_actor.GetPrimaryTitle.GetName] [recipient.Custom('DE_PRO_POS_S_3P')] Reich erben."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "Mit dem Segen [actor.GetFaith.HighGodNamePossessive] schreiben wir Euch in einer Erbangelegenheit."
 demand_church_succession.0001.desc.archbishop: "Von meiner Erzdiözese aus, die über Eure Lande wacht, schreibe ich Euch in einer Erbangelegenheit."
 demand_church_succession.0001.desc.bishop: "Euer Schäfer schreibt Euch in einer Erbangelegenheit."
 demand_church_succession.0001.desc.head_of_faith_generic: "Als [actor.GetTitleAsNameNoTooltip] des Glaubens schreibe ich Euch in einer Erbangelegenheit."
 demand_church_succession.0001.desc.theocrat_generic: "Von meinem Altar [actor.GetFaith.HighGodNamePossessive] aus schreibe ich Euch in einer Erbangelegenheit."
 demand_church_succession.0001.flavour.zealous: "\n\nIrrt Euch nicht:"
 demand_church_succession.0001.flavour.ambitious: "\n\nLasst uns zu klaren Worten greifen:"
 demand_church_succession.0001.flavour.deceitful: "\n\nZweifelsohne wird Euch Folgendes ein Trost sein:"
 demand_church_succession.0001.flavour.greedy: "\n\nIch will mich klar ausdrücken:"
 demand_church_succession.0001.flavour.compassionate: "\n\nVergebt mir diese Notwendigkeit, [recipient.GetTitledFirstName]:"
 demand_church_succession.0001.flavour.default: "\n\nIch sage es klar heraus:"
 demand_church_succession.0001.recipient.elderly_childless: "Die Wiege an Eurem Herd ist leer und Eure Linie endet mit Euch. Die Gläubigen werden warten … und beizeiten erben."
 demand_church_succession.0001.recipient.childless: "Ihr habt keine lebenden Kinder. Sollte die höchste Macht ([actor.GetFaith.HighGodName]) dies nicht ändern, werden Eure Lande dem Glauben dienen."
 demand_church_succession.0001.recipient.one_child: "Nur ein einziges Kind steht zwischen Euch und dem Ende. Sollte die höchste Macht ([actor.GetFaith.HighGodName]) Euch holen, stehen die Gläubigen zum Regieren bereit."
 demand_church_succession.0001.recipient.default: "Die Jahre sind neidisch auf jedes Versprechen. Sollte Eures versagen, werden Eure Lande an uns übergehen, damit sie im Namen [actor.GetFaith.HighGodNamePossessive] regiert werden können."
 demand_church_succession.0001.a: "So steht es geschrieben. So soll es geschehen."
 demand_church_succession.0001.b: "Dann sollte ich lieber einen Erben [Select_CString(ROOT.Char.IsFemale, 'gebären', 'zeugen')]."
 demand_church_succession.0001.c: "[defector.GetTitledFirstNameNoTooltip|U] maßt sich zu viel an"
 demand_church_succession.0001.c.tt: "Ihr räumt die [fallback_heir_title|E]-Regelung aus dem Weg und seid für 10 Jahre vor weiteren Forderungen der Kirchennachfolge geschützt, doch [actor.GetTitledFirstName] wird diese Schmach lange nicht vergeben"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "Eure Forderung wurde gelesen und abgelehnt. Mein Reich wird niemals an die Kirche fallen. Kümmert Ihr Euch um Euren Altar, [actor.GetTitledFirstName] … und ich mich um meine Lande."
 demand_church_succession.0002.a: "An diese Anmaßung wird man sich erinnern."
 demand_church_succession_fertility_modifier: "Entschlossen, einen Erben zu bekommen"
 demand_church_succession_fertility_modifier_desc: "Entschlossen, das eigene Reich aus den Händen des Klerus zu halten, gibt dieser Charakter sich umso mehr Mühe im Ehebett."
 defied_church_succession_opinion: "Verweigerte meinen Nachfolgeanspruch"
 meddling_church_opinion: "Mischte sich in meine Nachfolge ein"
