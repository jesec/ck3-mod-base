l_german:
 request_clerical_chastity_interaction: "Keuschheit verlangen"
 request_clerical_chastity_interaction_desc: "Verlangen, dass [recipient.GetShortUINameNoTooltip] ein Keuschheitsgelübde gegenüber der höchsten Macht ([recipient.GetFaith.HighGodName]) ablegt. Falls [recipient.Custom('DE_PRO_PER_S_3P_N')] annimmt, erleidet [recipient.Custom('DE_PRO_PER_S_3P_N')] einen langfristigen [Concept('fertility', 'Fruchtbarkeitsmalus')|E] und kann niemanden verführen oder ihm den Hof machen, bis der Eid endet oder widerrufen wird."
 request_clerical_chastity_notification_text: "Dieses Gelübde ablegen und Euer Fleisch vor der höchsten Macht [actor.GetFaith.HighGodName] der Enthaltsamkeit verpflichten. Euer Gehorsm wird den [actor.GetFaith.GetAdjectiveNoTooltip|l]en Glauben ehren."
 clerical_chastity_offer_piety: "Frömmigkeit anbieten"
 clerical_chastity_recipient_must_be_in_reach_tt: "Ihr müsst ein [head_of_faith|E] sein oder ein [duchy|E] oder höheren [title|E] halten, sofern [recipient.GetShortUINameNoTooltip] nicht persönlich eine [county|E] hält, die an eine der Euren grenzt"
 clerical_chastity_recipient_must_be_in_reach_tt_puppeteer: "[puppet_or_actor.GetShortUINameNoTooltip|U] muss ein [head_of_faith|E] sein oder ein [duchy|E] oder höheren [title|E] halten, sofern [recipient.GetShortUINameNoTooltip] nicht persönlich eine [county|E] hält, die an eine von [puppet_or_actor.GetShortUINameNoTooltip] grenzt"
 clerical_chastity_vow_blocks_scheme_tt: "Ihr dürft nicht an ein [GetModifier('clerical_chastity_vow_modifier').GetNameWithTooltip|L] gebunden sein"
 request_clerical_chastity_actor_toast: "Nahm Forderung an"
 request_clerical_chastity_actor_toast_puppeteer: "[recipient.GetShortUIName|U] stimmte der Forderung von [puppet_or_actor.GetShortUIName] zu"
 request_clerical_chastity_recipient_toast: "Schwor Keuschheit"
 request_clerical_chastity_decline_actor_toast: "Lehnte Forderung ab"
 request_clerical_chastity_decline_actor_toast_puppeteer: "[recipient.GetShortUIName|U] lehnte die Forderung von [puppet_or_actor.GetShortUIName] ab"
 request_clerical_chastity_interaction_extra_icon: "$hook_extra_icon$"
 clerical_chastity_ai_virtuous_chaste: "[GetTrait('chaste').GetName(recipient.Self)|U] ist eine Tugend in meinem [faith|E]: $VALUE|=+0$"
 clerical_chastity_ai_rival: "Rivale von [actor.GetShortUINameNoTooltip|U]: $VALUE|=+0$"
 clerical_chastity_ai_clerical_region: "[realm_capital|E] in meiner [clerical_region|E]: $VALUE|=+0$"
 clerical_chastity_ai_piety_stipend: "Zusätzliche [piety|E] angeboten: $VALUE|=+0$"
 clerical_chastity_ai_tier_rank: "[recipient.Custom('DE_PRO_PER_S_3P_N')|U] ist [recipient.GetTitleAsNameNoTooltip]: $VALUE|=+0$"
 renounce_clerical_chastity_vow_decision: "Armutsgelübde widerrufen"
 renounce_clerical_chastity_vow_decision_confirm: "Abschwören"
 renounce_clerical_chastity_vow_decision_desc: "Ich legte dieses Gelübde ab, weil ein Priester Frömmigkeit von mir verlangte. Ich kann es hinter mir lassen, doch das Brechen eines heiligen Schwurs wird mich [piety|E] kosten und mein Gewissen belasten."
 renounce_clerical_chastity_vow_decision_tooltip: "Den Schwur beenden, bevor er abläuft. Ihr verliert [piety|E], erleidet [stress|E] und verringert für 10 Jahre Eure [clergy_opinion|E]."
 renounce_clerical_chastity_vow_toast: "Eid abgeschworen"
 renounce_clerical_chastity_vow_toast_desc: "Ihr widerruft Euer Keuschheitsgelübde."
 clerical_chastity_vow.0001.toast_released: "Gelübde endete"
 clerical_chastity_vow.0001.toast_released_desc: "Das Gelübde, das Ihr geschworen habt, ist abgelaufen."
