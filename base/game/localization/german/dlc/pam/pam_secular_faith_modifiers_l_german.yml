l_german:
 pam_sf_devotion_modifier: "Hingabe an Wohlstand"
 pam_sf_devotion_modifier_desc: "Dieser Charakter verpflichtete sich einer privaten Hingabe und wurde insgeheim mit Frömmigkeit und Geld."
 pam_sf_grace_modifier: "Empfangener Segen"
 pam_sf_grace_modifier_desc: "Dieser Charakter empfing einen Segen, ein Dankgeschenk oder einen stummen Eid, der seinen Geist erhebt."
 pam_sf_consolation_modifier: "Gemachter Frieden"
 pam_sf_consolation_modifier_desc: "Dieser Charakter hat seinen Frieden gemacht."
 pam_sf_visionary_renown_modifier: "Eine verkündete Vision"
 pam_sf_visionary_renown_modifier_desc: "Dieser Charakter verkündete dem Hof eine himmlische Vision und polierte seinen Stand auf."
 pam_sf_consecrated_arms_modifier: "Geweihtes Wappen"
 pam_sf_consecrated_arms_modifier_desc: "Dieser Charakter ließ die Wappen des eigenen Hauses an einem Feiertag segnen."
 pam_sf_serenity_modifier: "Gelobte öffentliche Rituale"
 pam_sf_serenity_modifier_desc: "Die öffentliche Hingabe dieses Charakters macht ihn bei Klerus und Hof beliebt."
 pam_sf_humiliated_modifier: "Demütigendes Gelübde"
 pam_sf_humiliated_modifier_desc: "Dieser Charakter wurde gezwungen, ein heiliges Gelübde abzulegen, und in einem Kloster weggesperrt."
 pam_sf_promised_acclaim_modifier: "Ein Pilgerversprechen"
 pam_sf_promised_acclaim_modifier_desc: "Der Reichspriester dieses Charakters versprach, seine nächste abgeschlossene Pilgerreise beim Volk des Hauptsitzes zu verkünden.\n\nBeim Abschluss einer Pilgerreise erhält sein [capital|E] für #V 15#! Jahre: [GetModifier('pam_sf_extolled_pilgrimage_county_modifier').GetNameWithTooltip]."
 pam_sf_extolled_pilgrimage_county_modifier: "Ein Pilgergruß"
 pam_sf_extolled_pilgrimage_county_modifier_desc: "Überall in dieser Gemeinde erfuhr man von der Pilgerreise des Herrschers, und die Leute genießen den Stolz darauf."
 pam_sf_free_feast_discount_desc: "Ein Festmahl in der Mache"
 pam_sf_free_feast_modifier: "Sehnsucht nach einem Festmahl"
 pam_sf_free_feast_modifier_desc: "Ein Ausblick auf einen heiligen Ablass machte diesem Charakter besonders viel Appetit:\n$EFFECT_LIST_BULLET$Kosten für das nächste [GetActivityType('activity_feast').GetName]: [gold_i]#P -100 %#!\n#weak Werden ausgegeben, wenn das Festmahl beginnt.#!"
 pam_sf_pilgrimage_funded_modifier: "Finanzierte Pilgerreise"
 pam_sf_pilgrimage_funded_modifier_desc: "Ein Gönner versprach, einen Teil der Kosten der nächsten Pilgerreise zu übernehmen:\n$EFFECT_LIST_BULLET$[GetActivityType('activity_pilgrimage').GetName]-Kosten: [gold_i]#P -50 %#!"
 pam_sf_pilgrimage_funded_discount_desc: "Finanzierte Pilgerreise"
 pam_sf_ear_of_clergy_modifier: "Das Ohr des Klerus"
 pam_sf_ear_of_clergy_modifier_desc: "Die Kirche nimmt wahrscheinlicher Petitionen dieses Charakters an:\n$EFFECT_LIST_BULLET$Annahme #V $hof_ask_for_claim_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $hof_ask_for_gold_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $request_excommunication_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $request_legitimacy_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $ecclesiastic_grant_claim_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $strengthen_claim_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $request_enforce_succession_interaction$#!: #P +25#!\n$EFFECT_LIST_BULLET$Annahme #V $request_white_peace_interaction$#!: #P +25#!"
 pam_religious_delirium_modifier: "Religiöses Delirium"
 pam_religious_delirium_modifier_desc: "Dieser Charakter ist sicher, dass der Himmel selbst mit ihm spricht:\n$EFFECT_LIST_BULLET$Zuwachs in Sachen [spiritual_fulfillment|El]: #P +50 %#!\n$EFFECT_LIST_BULLET$Verlust in Sachen [spiritual_fulfillment|El]: #N +50 %#!"
 pam_sf_church_builder_modifier: "Erbauer der Kirchen"
 pam_sf_church_builder_modifier_desc: "Nach dem Errichten eines erstens Gotteshauses baut dieser Charakter Kirchen etwas günstiger und gewinnt einen steten Strom von Frömmigkeit."
 pam_sf_scriptorium_county_modifier: "Schreiber bei der Arbeit"
 pam_sf_scriptorium_county_modifier_desc: "Niedergelassene Gelehrte kopieren und führen die Hauptbücher dieses Besitztums."
 pam_sf_doctrine_clarity_modifier: "Epiphanie"
 pam_sf_doctrine_clarity_modifier_desc: "Dieser Charakter hatte einen seltenen Augenblick der Klarheit: eine Epiphanie."
 pam_sf_favorable_omen_modifier: "Günstige Omen"
 pam_sf_favorable_omen_modifier_desc: "Dieser Charakter liest das Firmament als Zeichen der göttlichen Gunst, und die Gläubigen nehmen sich den Segen zu Herzen."
 pam_sf_omen_of_victory_modifier: "Omen des Siegs"
 pam_sf_omen_of_victory_modifier_desc: "Sicher, dass die Himmel den Sieg versprochen haben, marschieren dieser Charakter und seine Schar ohne Furcht."
 pam_sf_demon_torment_modifier: "Dämonische Qualen"
 pam_sf_demon_torment_modifier_desc: "Dieser Charakter ist überzeugt, dass er von einem Dämon heimgesucht wird und ein [GetBuilding('temple_01').GetName]-[holding|E] errichten oder auf eine [GetActivityType('activity_pilgrimage').GetName] gehen muss."
 pam_sf_besieged_by_demons_modifier: "Belagert von Dämonen"
 pam_sf_besieged_by_demons_modifier_desc: "Der Geist dieses Charakters wird von Dämonen belagert: Er spricht wie von Sinnen, verkrampft und verliert von Tag zu Tag mehr von seinem Verstand."
 pam_sf_grief_solace_modifier: "Von Geist getröstet"
 pam_sf_grief_solace_modifier_desc: "Diese Charakter fand stillen Trost im angeblichen Besuch eines Geists."
 pam_sf_grief_warning_modifier: "Von Geist gewarnt"
 pam_sf_grief_warning_modifier_desc: "Dieser Charakter glaubt, dass er von einer Erscheinung gewarnt wurde."
 pam_sf_peace_of_god_modifier: "Gottesfriede"
 pam_sf_peace_of_god_modifier_desc: "Dieser Charakter schwor den Gottesfrieden und setzte ihn im ganzen Reich durch."
 pam_sf_immured_anchorite_modifier: "Eingemauerter Anachoret"
 pam_sf_immured_anchorite_modifier_desc: "In den Mauern dieses Tempels wurde ein Anachoret eingemauert."
 pam_sf_voice_of_jesus_modifier: "Stimme Gottes"
 pam_sf_voice_of_jesus_modifier_desc: "Dieser Charakter wurde von einer himmlischen Stimme angesprochen und erhob sich verwandelt, alle Sinne geschärft, als ob ihn die Hand Gottes berührt hätte."
 pam_sf_stroke_of_god_modifier: "Gottesschlag"
 pam_sf_stroke_of_god_modifier_desc: "Ein plötzlicher Schlaganfall traf diesen Charakter, was die Ärzte einen „Gottesschlag“ nennen: ein himmlischer Schlag, der das Gehirn überflutet, sodass Körper und Geist verkrüppelt zurückbleiben."
 pam_sf_lingering_stench_modifier: "Anhaltender Gestank"
 pam_sf_lingering_stench_modifier_desc: "So sehr sich dieser Charakter auch müht: Er wird den Gestank der Füße des Bettlers, die er wusch, nicht mehr los."
 pam_sf_site_of_miracle_county_modifier: "Schauplatz eines Wunders"
 pam_sf_site_of_miracle_county_modifier_desc: "Diese Gemeinde ist der Schauplatz eines Wunders, das Pilger wie Banditen anzieht."
 pam_sf_consecrated_county_modifier: "Neu geweiht"
 pam_sf_consecrated_county_modifier_desc: "Diese Gemeinde hat eine neu geweihte Kirche."
 pam_sf_flagellant_cults_county_modifier: "Flagellantenkulte"
 pam_sf_flagellant_cults_county_modifier_desc: "Trupps von Büßern geißeln sich selbst auf den Straßen dieser Gemeinde."
 pam_sf_relic_procession_county_modifier: "Der Heilige zog aus"
 pam_sf_relic_procession_county_modifier_desc: "Die Reliquie eines Heiligen wurde in einer feierlichen Prozession durch diese Gemeinde getragen, und das Volk steht etwas aufrechter deswegen."
 pam_sf_blessed_bell_county_modifier: "Eine getaufte Glocke"
 pam_sf_blessed_bell_county_modifier_desc: "Die Kirchenglocke dieser Gemeinde wurde gewaschen, gesalbt und benannt. Das Volk vertraut darauf, dass sie Stürme wie Unholde verstreuen wird."
 pam_sf_church_ale_county_modifier: "Kirchenbier"
 pam_sf_church_ale_county_modifier_desc: "Der Herrscher dieser Gemeinde trank mit der Gemeinde das Kirchenbier, und nun redet man über nichts anderes."
 pam_sf_safe_passage_modifier: "Sicheres Geleit"
 pam_sf_safe_passage_modifier_desc: "Diesem Reisenden wurde nach einer Rettung auf der Straße eine Eskorte und sicheres Geleit gewährt."
 pam_sf_waylaid_road_modifier: "Auf der Straße überfallen"
 pam_sf_waylaid_road_modifier_desc: "Der Weg dieses Reisenden wurde nach einem Angriff auf der Straße gefährlich."
 pam_sf_penance_lustful_modifier: "Unterdrückte Wollust"
 pam_sf_penance_lustful_modifier_desc: "Dieser Charakter büßt für seine Wollust und bezwingt seine Triebe, was zulasten von weniger Kindern geht."
 pam_sf_penance_chaste_modifier: "Abgestreifte Zurückhaltung"
 pam_sf_penance_chaste_modifier_desc: "Dieser Charakter lässt wider das eigene Wesen eine Keuschheit hinter sich, die sein Glaube für sündhaft hält."
 pam_sf_penance_gluttonous_modifier: "Fastentage"
 pam_sf_penance_gluttonous_modifier_desc: "Dieser Charakter fastet als Buße für Völlerei, was den Leib auslaugt, aber die Seele nährt."
 pam_sf_penance_temperate_modifier: "Brechen des langen Fastens"
 pam_sf_penance_temperate_modifier_desc: "Dieser Charakter gibt eine Mäßigung auf, die sein Glaube für sündhaft hält. Herz und Geldbörse sitzen nun bei ihm lockerer."
 pam_sf_penance_greedy_modifier: "Bußfertige Almosenverteilung"
 pam_sf_penance_greedy_modifier_desc: "Dieser Charakter gibt Almosten als Buße für Gier, was sein Säckel und sein Gewissen erleichtert."
 pam_sf_penance_generous_modifier: "Schließen der Börse"
 pam_sf_penance_generous_modifier_desc: "Dieser Charakter zügelt eine Großzügigkeit, die sein Glaube für sündhaft hält, was ihn reicher, aber auch weniger beliebt macht."
 pam_sf_penance_lazy_modifier: "Bußfertige Arbeit"
 pam_sf_penance_lazy_modifier_desc: "Dieser Charakter erledigt ermüdende Arbeiten als Buße für Faulheit."
 pam_sf_penance_diligent_modifier: "Erzwungenes Ausruhen"
 pam_sf_penance_diligent_modifier_desc: "Dieser Charakter lässt eine Sorgfalt beiseite, die sein Glaube für sündhaft hält, und wird ruhiger, aber weniger schaffenskräftig."
 pam_sf_penance_wrathful_modifier: "Gebändigter Zorn"
 pam_sf_penance_wrathful_modifier_desc: "Dieser Charakter zügelt als Buße den eigenen Zorn und gewinnt eine ruhigere Hand und eine stumpfere Klinge."
 pam_sf_penance_calm_modifier: "Erhebt den Geist"
 pam_sf_penance_calm_modifier_desc: "Dieser Charakter befreit sich aus einer Ruhe, die sein Glaube für sündhaft hält, und wird wilder, aber weniger zurückhaltend."
 pam_sf_penance_patient_modifier: "Erzwungenes Schritthalten"
 pam_sf_penance_patient_modifier_desc: "Dieser Charakter streifte eine Geduld ab, die sein Glaube für sündhaft hält, und wurde gehetzter und unwohler."
 pam_sf_penance_impatient_modifier: "Kultivierte Geduld"
 pam_sf_penance_impatient_modifier_desc: "Dieser Charakter übt sich als Buße in gezügelter Ungeduld, doch das Warten zehrt an ihm."
 pam_sf_penance_arrogant_modifier: "Geübte Bescheidenheit"
 pam_sf_penance_arrogant_modifier_desc: "Dieser Charakter übt sein stolzes Wesen als Buße in Bescheidenheit, doch damit vergeht auch seine Bekanntheit."
 pam_sf_penance_humble_modifier: "Zeigt ein stolzes Wesen"
 pam_sf_penance_humble_modifier_desc: "Dieser Charakter zeigt seinen Stolz statt Demut, wie sein Glaube es verlangt. Er wird dadurch bekannt, aber gilt auch als eitel."
 pam_sf_penance_deceitful_modifier: "Eid der Aufrichtigkeit"
 pam_sf_penance_deceitful_modifier_desc: "Dieser Charakter hält sich als Buße für Täuschungen an einen Eid des ehrlichen Umgangs, was seinen Scharfsinn abstumpfen lässt."
 pam_sf_penance_honest_modifier: "Lernt das Heucheln"
 pam_sf_penance_honest_modifier_desc: "Dieser Charakter lernt eine Hinterlist, die sein Glaube der Ehrlichkeit vorzieht, was ihn gerissener, aber auch weniger vertrauenswürdig macht."
 pam_sf_penance_craven_modifier: "Gestellte Angst"
 pam_sf_penance_craven_modifier_desc: "Dieser Charakter stellt sich Dingen als Buße für Feigheit und fürchtet sich vor jedem einzelnen Augenblick."
 pam_sf_penance_brave_modifier: "Gebändigte Tapferkeit"
 pam_sf_penance_brave_modifier_desc: "Dieser Charakter zügelt seine Tapferkeit, die sein Glaube für sündhaft hält, mit Vorsicht und wird dadurch ein stumpferer Krieger."
 pam_sf_penance_shy_modifier: "Erzwungene Kühnheit"
 pam_sf_penance_shy_modifier_desc: "Dieser Charakter zwingt sich als Buße, eine tapfere Miene zu zeigen, auch wenn er sich eigentlich zurückziehen möchte. Jede Versammlung ist eine Prüfung."
 pam_sf_penance_gregarious_modifier: "Rückzug ins Schweigen"
 pam_sf_penance_gregarious_modifier_desc: "Dieser Charakter zieht sich vom sündigen Feiern ins Schweigen zurück, wodurch er weniger Freunde hat."
 pam_sf_penance_ambitious_modifier: "Gezügelter Ehrgeiz"
 pam_sf_penance_ambitious_modifier_desc: "Dieser Charakter senkt als Buße seinen ehrgeizigen Blick, wodurch auch seine Bekanntheit sinkt."
 pam_sf_penance_content_modifier: "Schwelendes Verlangen"
 pam_sf_penance_content_modifier_desc: "Dieser Charakter facht sein Verlangen entgegen einer Zufriedenheit an, die sein Glaube für sündhaft hält, und wird ruhelos und ständig nach etwas strebend."
 pam_sf_penance_arbitrary_modifier: "Herrscht nach dem Recht"
 pam_sf_penance_arbitrary_modifier_desc: "Dieser Charakter herrscht als Buße für eine willkürliche Hand mit Gerechtigkeit, und wird dadurch gerechter, aber ärmer."
 pam_sf_penance_just_modifier: "Herrscht nach Gutdünken"
 pam_sf_penance_just_modifier_desc: "Dieser Charakter herrscht nach jenem Gutdünken, das sein Glaube statt einer echten Gerechtigkeit verlangt, und wird dadurch reicher, aber weniger beliebt."
 pam_sf_penance_cynical_modifier: "Schwelender Glaube"
 pam_sf_penance_cynical_modifier_desc: "Dieser Charakter facht als Buße für Zynismus seinen Glauben wieder an, auch wenn dieser sich wie ein unvertrauter Mantel anfühlt."
 pam_sf_penance_zealous_modifier: "Gebändigter Eifer"
 pam_sf_penance_zealous_modifier_desc: "Dieser Charakter kühlt seinen Eifer, den sein Glaube für Übermaß hält, woraufhin die Frommen ihm gegenüber auch etwas kühler werden."
 pam_sf_penance_paranoid_modifier: "Lernt Vertrauen"
 pam_sf_penance_paranoid_modifier_desc: "Dieser Charakter lernt als Buße Vertrauen statt Misstrauen. Türen öffnen sich, doch die Wachsamkeit schläft ein."
 pam_sf_penance_trusting_modifier: "Hüten des Herzens"
 pam_sf_penance_trusting_modifier_desc: "Dieser Charakter hütet ein Herz, das sein Glaube für zu vertrauensvoll hält, und wird wachsamer, aber auch für kälter gehalten."
 pam_sf_penance_compassionate_modifier: "Gezähmte Gnade"
 pam_sf_penance_compassionate_modifier_desc: "Dieser Charakter zähmt seine Gnade, die sein Glaube für sündhaft hält, und zeigt ein härteres Antlitz, das andere zu fürchten lernen."
 pam_sf_penance_callous_modifier: "Kultivierte Gnade"
 pam_sf_penance_callous_modifier_desc: "Dieser Charakter kultiviert als Buße für kaltherziges Verhalten seine Gnade und zeigt eine weichere Hand, sodass der Schrecken schwindet, den er auslöste."
 pam_sf_penance_sadistic_modifier: "Lossagung von Grausamkeit"
 pam_sf_penance_sadistic_modifier_desc: "Dieser Charakter sagt sich als Buße von der Grausamkeit los, und der durch sie erkaufte Schrecken schwindet langsam."
 pam_sf_penance_stubborn_modifier: "Beugen des Willens"
 pam_sf_penance_stubborn_modifier_desc: "Dieser Charakter beugt als Buße einen sturen Willen gegenüber Richtigstellungen und gibt nach, wo andere es nicht tun."
 pam_sf_penance_fickle_modifier: "Festigung der Seele"
 pam_sf_penance_fickle_modifier_desc: "Dieser Charakter hält als Buße für eine wankelmütige Seele einen festen Kurs, und es ist mühsam."
 pam_sf_penance_eccentric_modifier: "Annahme von Konventionen"
 pam_sf_penance_eccentric_modifier_desc: "Dieser Charakter legt als Buße für Verschrobenheit seltsamere Gedanken beiseite."
 pam_sf_penance_vengeful_modifier: "Lebt Vergebung"
 pam_sf_penance_vengeful_modifier_desc: "Dieser Charakter gibt als Buße für Rachsucht bei altem Groll nach. Er geht sanftmütiger mit Gefangenen um, ist aber auch langsamer beim Zurückschlagen."
 pam_sf_penance_forgiving_modifier: "Pflegt Groll"
 pam_sf_penance_forgiving_modifier_desc: "Dieser Charakter pflegt einen Groll, was sein Glaube statt Vergebung fordert, und wird dadurch kälter und gefürchteter."
 pam_mystical_birthright_spiritual_leader_modifier: "Verheißungsvolles Geburtsrecht"
 pam_mystical_birthright_spiritual_leader_modifier_desc: "Ein ererbtes Geburtsmal formte das spirituelle Aufwachsen dieses Charakters."
 pam_personal_sacrifice_of_wealth_county_modifier: "Hingabe-Investition"
 pam_personal_sacrifice_of_wealth_county_modifier_desc: "Die fromme Gabe eines Herrschers fördert das Wachstum dieses Landes."
 pam_sf_grinding_modifier: "Seelenlose Arbeit"
 pam_sf_grinding_modifier_desc: "Dieser Charakter schuftet vor sich hin, und seine Seele leidet darunter."
