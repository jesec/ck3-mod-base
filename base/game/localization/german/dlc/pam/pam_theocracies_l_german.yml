l_german:
 only_theocratic_tt: "Die [government|E] dieses Charakters erlaubt keine [Concept('theocratic', 'theokratischen')|E] Ernennungen #weak ([THIS.Char.GetGovernment.GetAdjective])#!"
 can_be_appointed_interaction_clergy_tt: "[THIS.Char.GetWomenMen|U] müssen Mitglied des [clergy|E] sein oder [THIS.Char.GetFaith.GetName] muss die [doctrine|E] „$doctrine_theocracy_lay_clergy_name$“ haben"
 can_be_appointed_interaction_can_inherit_tt: "Die [THIS.Char.GetWomenMen|U] müssen [titles|E] erben können#weak (nicht [GetTrait('disinherited').GetName(THIS.Char)], [GetTrait('gallivanter').GetName(THIS.Char)] oder [GetTrait('order_member').GetName(THIS.Char)])#!"
 theocracy_lease: "Theokratische Pacht"
 theocracy_lease_desc: "Dieses Besitztum ist an einen [realm_priest|E] des [Concept('faith', 'Glaubens')|E] des Trägers [leased|El].\n\nDer Reichspriester tritt [Concept('tax', 'Steuern')|E] und [levies|E] sowohl an den eigenen [Concept('liege', 'Lehnsherrn')|E] (sofern er Zustimmung findet) als auch an den eigenen [religious_superior|E] ab.\n\nSein Glaubensoberer ist der [realm_priest|E] seines [Concept('liege', 'Lehnsherrn')|E], falls sie denselben Glauben haben. Ansonsten ist es das [head_of_faith|E] seines Glaubens."
 ecclesiastical_lease: "Kirchenpacht"
 ecclesiastical_lease_desc: "Dieses Besitztum ist an einen [realm_priest|E] des [Concept('ecclesiastical', 'kirchlichen')|E] [Concept('faith', 'Glaubens')|E] des Trägers [leased|El].\n\nDer Reichspriester tritt [Concept('tax', 'Steuern')|E] und [levies|E] sowohl an den eigenen [Concept('liege', 'Lehnsherrn')|E] (sofern er Zustimmung findet) als auch an den eigenen [religious_superior|E] sowie direkt an sein [head_of_faith|E] ab.\n\nSein Glaubensoberer ist der [holder|E] des kirchlichen [Concept('clerical_title', 'Kirchentitels')|E], zu dem der Hauptsitz seines Lehnsherrn gehört. Ansonsten ist es das [head_of_faith|E] seines Glaubens."
