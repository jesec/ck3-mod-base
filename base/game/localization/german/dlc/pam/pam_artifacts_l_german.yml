l_german:
 artifact_pedestal_bible_name: "Bibel $artifact_name_prefix$"
 artifact_pedestal_bible_description: "Eine bemalte Bibel mit juwelenbesetzten Buchdeckeln, in der jeder Vers geduldig von Hand abgeschrieben wurde – eine fromme Arbeit."
 artifact_pedestal_thurible_name: "Weihrauchfass $artifact_name_prefix$"
 artifact_pedestal_thurible_description: "Ein kunstvoll gefertigtes Weihrauchgefäß an glänzenden Ketten – wird es entzündet, füllt es die Hallen mit duftenden Weihrauchwolken und trägt Gebete in Richtung des Himmels."
 artifact_pedestal_situla_name: "Situla $artifact_name_prefix$"
 artifact_pedestal_situla_description: "Ein reich verziertes Gefäß für Weihwasser, das während der Prozession so getragen wird, dass der Segen auf die Glaubigen gesprenkelt werden kann."
 artifact_pedestal_crozier_name: "Krummstab $artifact_name_prefix$"
 artifact_pedestal_crozier_description: "Der Hirtenstab eines Bischofs, der wie der Stab eines Schäfers geformt ist, um die Glaubigen zu führen und die Abtrünnigen zurückzugeleiten."
