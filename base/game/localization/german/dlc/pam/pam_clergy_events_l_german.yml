l_german:
 pam_clergy_events.0001.t: "Quo Nomine Vis Vocari?"
 pam_clergy_events.0001.desc: "Mein [chaplain.GetCouncilTitle] [chaplain.GetFirstName] wendet sich der nächsten leeren Zeile im Register der Nachfolger des Heiligen Petrus zu, dem lebendigen Zeugnis in Sachen [GetTenetType('tenet_apostolic_succession').GetName(GetPlayer.GetRite)].\n\n#emp „Der Name, den Ihr aussucht, wird über tausend Generationen hinweg Eure Herrschaft überdauern.“#!\n\n[chaplain.Custom('DE_PRO_POS_S_3P')|U]e Schreibfeder markiert die Stelle, an der die Tinte aufzutragen ist.\n\n#emp „Mit welchem Namen möchtet Ihr gerufen werden?“#!"
 pam_clergy_events.0001.a: "Lasst es für alle Zeiten jeden wissen."
 pam_clergy_events.0003.t: "Ein neu gegossener Grundsatz"
 pam_clergy_events.0003.desc: "Ein Grundsatz des [pam_recast_rite.GetNameNoTooltip] wurde unter [pam_recast_pope.GetTitledFirstName] geändert: [tenet_to_remove.GetBaseName] macht Platz für [tenet_to_add.GetBaseName]."
 pam_clergy_events.0010.t: "Welchen Willen man als [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] zeigt"
 pam_clergy_events.0010.desc.intro: "Als [cardinalate.GetHolder.GetTitleAsNameNoTooltip] bin ich die Erweiterung des Willens [Select_CString(actor.IsFemale, 'der', 'des')] heiligen [actor.Custom('GetMotherFather')|U][Select_CString(TARGET_CHARACTER.IsFemale, '', 's')].\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "Mein[actor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))], [actor.Custom('DE_ART_DEF_S_A')] ich mehr als alle anderen schätze, führt meine Hand bei der Erfüllung meiner Pflichten als [cardinalate.GetHolder.GetTitleAsNameNoTooltip].\n\n"
 pam_clergy_events.0010.desc: "In [actor.Custom('DE_PRO_POS_S_3P')]er unendlichen Weisheit spricht [actor.GetTitledFirstName], was [actor.Custom('DE_PRO_PER_S_3P_N')] für notwendig erachtet, und so verfolge ich"
 pam_clergy_events.0010.desc.develop: "die Entwicklung der öffentlichen Arbeit für den Wohlstand aller [recipient.GetFaith.GetAdherentNamePlural] in [archdiocese.GetName]."
 pam_clergy_events.0010.desc.convert_faith: "eine Mission, um die Bekehrung [ROOT.Char.Custom('GetUnbelieverNamePlural')] in und um [archdiocese.GetName] zu unterfüttern."
 pam_clergy_events.0010.desc.increase_control: "eine Mission, um die Bevölkerung in [archdiocese.GetName] zu befrieden."
 pam_clergy_events.0010.desc.cultural_fascination: "eine Mission, um die Erforschung neuer Technologien für [actor.Custom('DE_PRO_POS_S_3P')]e [actor.GetCulture.GetCollectiveNoun] zu beschleunigen."
 pam_clergy_events.0010.desc.epidemic_resistance: "das Verteilen von Kirchenressourcen, um bei der Eindämmung der Pest in [archdiocese.GetName] zu helfen."
 pam_clergy_events.0010.desc.improve_legitimacy: "eine Mission, um die Legitimität der [recipient.GetFaith.GetAdjective|l]en Monarchen in [archdiocese.GetName] zu fördern."
 pam_clergy_events.0010.desc.undermine_legitimacy: "eine Mission, um die Legitimität der [recipient.GetFaith.GetAdjective|l]en Monarchen in [archdiocese.GetName] zu untergraben."
 pam_clergy_events.0010.a: "„Ich werde es geschehen lassen, [actor.Custom('FormOfAddressForLiege')]!“"
 pam_clergy_events.0010.b: "Der Zehnt kann besser ausgegeben werden …"
 pam_clergy_events.0030.t: "Habemus Papam"
 pam_clergy_events.0030.t.female: "Habemus Mamam"
 pam_clergy_events.0030.desc: "Weißer Rauch verkündet [Select_CString(new_pope.IsFemale, 'die neue', 'den neuen')] [new_pope.GetTitledFirstName] inmitten von [new_pope.GetCurrentLocation.GetName]:\n\n„Mögen die heiligen Apostel Peter und Paul, auf deren Macht und Autorität wir vertrauen, für uns vor dem Herrn vorsprechen. Und möge der Segen des allmächtigen Gottes, des Vaters und des Sohnes und des Heiligen Gottes auf Euch niederkommen und auf ewig auf Euch liegen.\n\nAmen."
 pam_clergy_events.0030.a: "Ruhm sei dem Throne Petri."
 pam_clergy_events.0030.b: "Offenbar ist ein falscher Prophet erschienen."
 pam_clergy_events.0030.b.tt: "Die [decision|E] „[GetDecisionWithKey('declare_antipope_decision').GetName]“ ist für #V 15 Jahre#! günstiger"
 pam_clergy_events.0030.aa: "Wen scheren schon die Angelegenheiten der Kirche?"
 pam_clergy_events.0030.aa.tt: "Zukünfttige „Habemus Papam“-Ereignisse tauchen stattdessen als Benachrichtigungen auf"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName] wurde zum [head_of_faith|E] gewählt."
 pam_clergy_events.0040.opening: "An [ROOT.Char.Custom('DE_ART_DEF_S_A')] fromm[ROOT.Char.Custom('DE_END_ADJ_IND_S_A')] [ROOT.Char.GetTitledFirstName],"
 pam_clergy_events.0040.desc: "Ob der Verkleinerung des heiligen Kollegs halte ich es für angemessen, Euch in ein Kardinalat zu erheben. Mögen Eure Frömmigkeit und Weisheit die Kirche in dieser Stunde der Not stärken."
 pam_clergy_events.0040.appoint_tt: "Ihr werdet als [cardinal|E] eingesetzt"
 pam_clergy_events.0040.a: "Ich schultere diese heilige Bürde."
 pam_clergy_events.0041.opening: "An den Stuhl Petri,"
 pam_clergy_events.0041.desc: "Das Kardinalskollegium ist unvollständig, und Ihr habt noch nicht die leeren Sitze gefüllt, die unsere frommsten Geschwister hinterließen.\n\nIch werde die Kirche nicht ungeschützt lassen! Ich werde die rote Kalotte selbst aufsetzen."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U] ruft sich selbst zum [cardinal|E] aus"
 pam_clergy_events.0041.a: "Diese Anmaßung wird nicht vergessen werden."
 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "Die Sitze des Kollegiums waren verwaist, doch die Kirche kann nicht des Zeremoniells wegen warten. Mehrere unser frommsten Brüder nahmen gemeinsam den roten Hut, und das Kollegium ist einmal mehr vollständig.\n\nWir vertrauen darauf, dass Ihr uns unsere Eile verzeiht."
 pam_clergy_events.0042.a: "Ein vollständiges Kollegium ist mir dienlicher als ein leeres."
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "Eine gewaltige Erschütterung des Glaubens"
 pam_clergy_events.0051.desc: "Mein [county.GetAdjective|l]er Sitz erzittert unter mir. Die Seelen, denen ich mein Leben widmete, um ihnen zu dienen, beten nun als [new_faith.GetAdherentNamePlural].\n\nKonvertiere ich und behalte die Kontrolle? Ich könnte dann für die [title.GetAdjective|l]en Leute sorgen, doch kann ich wirklich jenen helfen, die nicht länger [old_faith.GetAdherentNamePlural] sind? Kann irgendetwas Gutes daraus erwachsen, wenn wir alle gezwungen werden, den neuen Glauben ([new_faith.GetNameNoTooltip]) zu praktizieren?!"
 pam_clergy_events.0051.a: "Was immer auch nötig ist, um meiner Herde zu dienen."
 pam_clergy_events.0051.a.keep_see_tt: "Ihr behaltet die Kontrolle über [title.GetName]"
 pam_clergy_events.0051.b: "[old_faith.GetAdherentNamePluralNoTooltip] sind die einzigen, denen ich dienen kann."
 pam_clergy_events.0051.b.tt: "Alle Eure [Concept('landed', 'landbesitzenden')|E] [titles|E] werden vernichtet"
 pam_clergy_events.0051.c: "Ich akzeptiere das Ende meines Amts."
 pam_clergy_events.0051.c.tt: "[SelectLocalization(HasDlcFeature('roads_to_power'), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3')]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER Ihr werdet ein [adventurer|E]-[camp|E] errichten#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER Ihr erreicht das [game_over|E]#!#!"
 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "Das Ende von [title.GetNameNoTooltip]"
 pam_clergy_events.0052.desc: "Wie auch immer es dazu kam: Ich kann nicht länger der Hirte in Sachen [title.GetName] sein. Was mir die Kirche einst in die Hände gab, rinnt nun aus ihnen heraus."
 pam_clergy_events.0052.a: "So sei es."
 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "Ein [new_prelate.GetDynasty.GetNameNoTooltip] auf dem Thron des Heiligen Petrus"
 pam_clergy_events.0060.t.head_of_faith: "Ein [new_prelate.GetDynasty.GetNameNoTooltip] als [new_prelate.GetFaith.ReligiousHeadName]"
 pam_clergy_events.0060.t.antipope: "Ein [new_prelate.GetDynasty.GetNameNoTooltip] beansprucht den Titel als [new_prelate.GetFaith.ReligiousHeadTitleName]"
 pam_clergy_events.0060.t.archbishop: "Ein [new_prelate.GetDynasty.GetNameNoTooltip] nimmt den Bischofsstab"
 pam_clergy_events.0060.desc.intro: "Wir mühten uns, die Christenheit zu führen, sei es vom Thron oder der Kanzel aus. Nun scheint es die höchste Macht ([new_prelate.GetFaith.HighGodName|U]) für angemessen zu halten, die [new_prelate.GetDynasty.GetName]-Dynastie zu neuen Höhen zu führen.\n\n"
 pam_clergy_events.0060.desc.pope: "Mein[new_prelate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] wurde auf den Thron des Heiligen Petrus erhoben, als [Select_CString(new_prelate.IsFemale, 'Stellvertreterin', 'Stellvertreter')] der höchsten Macht ([new_prelate.GetFaith.HighGodName]) auf Erden."
 pam_clergy_events.0060.desc.head_of_faith: "Mein[new_prelate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] hält [prelate_title.GetName]."
 pam_clergy_events.0060.desc.hof_outro: "Könige und Kaiser sind lediglich Kinder im Schatten des Willens der höchsten Macht ([new_prelate.Custom('GetMotherFather')]). [new_prelate.GetFaith.BishopMalePlural] in der Zahl einer regelrechten Armee unterstehen nun dem Befehl von jemandem aus dem Hause [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope: "Mein[new_prelate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] wurde als [new_prelate.GetFaith.ReligiousHeadName] ausgerufen, obwohl bereits jemand dieses Amt bekleidet. Jeder [new_prelate.GetFaith.GetAdherentName] muss nun wählen, wer der Vertreter der höchsten Macht ([new_prelate.GetFaith.HighGodName|U]) ist. Bis all dies geregelt ist, schweben unsere Seelen in Gefahr."
 pam_clergy_events.0060.desc.archbishop: "Mein[new_prelate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] erhielt [prelate_title.GetName]. Der Zehnt, Abteien und die Weihe für jeden [new_prelate.GetFaith.BishopNeuter] unter [new_prelate.Custom('DE_PRO_PER_S_3P_D')] gehören nun jemandem aus dem Hause [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.Custom('DE_PRO_POS_S_3P')|U] Glaube ([new_prelate.GetFaith.GetNameNoTooltip]) ist nicht meiner ([ROOT.Char.GetFaith.GetNameNoTooltip]), aber wir sind dennoch eine Familie."
 pam_clergy_events.0060.a: "Ein Segen für die Kirche und Haus [new_prelate.GetDynasty.GetNameNoTooltip] gleichermaßen."
 pam_clergy_events.0060.a.antipope: "Diesen Streit werde ich nicht erben."
 pam_clergy_events.0060.b: "Ich würde mir gern [prelate_title.GetNameNoTooltip] genauer ansehen."
 pam_clergy_events.0060.b.antipope: "Nur ich kann diese Krise lösen."
 pam_clergy_events.0060.b.tt: "@warning_icon! Ihr werdet Euren derzeitigen Charakter aufgeben und könnt später nicht wieder als dieser weiterspielen. \n\n#TUT Sobald [new_prelate.GetShortUINameNoTooltip] stirbt, spielt Ihr als Euer [player_heir|E], der dieses [Concept('ecclesiastical', 'kirchliche')|E] Amt durch [appointment|E] oder Wahl geerbt hat, nicht durch [dynasty|E]-Nachfolge.#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U] teilt nicht Euren Glauben. Ihr würdet als [new_prelate.GetFaith.GetAdherentName] fortfahren."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U] behält das Amt eher durch Trotz als durch eine Wahl. Jeder, der diesen Anspruch zurückweist, wird danach greifen."
