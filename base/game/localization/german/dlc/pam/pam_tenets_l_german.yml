 pam_luke_5_16_default_short: "[Glossary('Doch er zog sich an einen einsamen Ort zurück, um zu beten …','LUKE_5_16_GLOSS')]"
 pam_luke_1_42_english: "Gebenedeit bist du unter den Weibern und gebenedeit ist die Frucht deines Leibes."
 pam_luke_1_79_english: "Um allen zu leuchten, die in Finsternis sitzen und im Schatten des Todes, und unsre Schritte zu lenken auf den Weg des Friedens."
 pam_colossians_3_15_english: "Und der Friede Christi triumphiere in euren Herzen. Dazu seid ihr berufen als Glieder des einen Leibes. Seid dankbar!"
 pam_matthew_5_9_english: "Selig, die Frieden stiften; denn sie werden Kinder Gottes genannt werden."
 pam_philippians_4_21_english: "Grüßt jeden Heiligen in Christus Jesus! Es grüßen euch die Brüder, die bei mir sind."
 pam_hebrews_12_1_english: "Darum wollen auch wir, die wir eine solche Wolke von Zeugen um uns haben, alle Last und die Sünde abwerfen, die uns so leicht umstrickt. Lasst uns mit Ausdauer in dem Wettkampf laufen, der vor uns liegt, und dabei auf Jesus blicken, den Urheber und Vollender des Glaubens."
 pam_acts_7_59_english: "So steinigten sie Stephanus; er aber betete und rief: Herr Jesus, nimm meinen Geist auf!"
 pam_luke_22_19_english: "Und er nahm Brot, sprach das Dankgebet, brach es und reichte es ihnen mit den Worten: Das ist mein Leib, der für euch hingegeben wird. Tut dies zu meinem Gedächtnis!"
 pam_1_corinthians_1_10_english: "Ich ermahne euch aber, Brüder und Schwestern, im Namen unseres Herrn Jesus Christus: Seid alle einmütig und #bold duldet keine Spaltungen unter euch#!; seid vielmehr eines Sinnes und einer Meinung!"
 pam_1_corinthians_10_16_english: "Ist der Kelch des Segens, über den wir den Segen sprechen, nicht Teilhabe am Blut Christi? Ist das Brot, das wir brechen, nicht Teilhabe am Leib Christi?"
 pam_1_corinthians_10_17_english: "Weil es ein einziges Brot gibt, sind wir, die wir viele sind, ein Leib; denn wir alle haben Anteil an dem einen Brot."
 pam_john_6_41_english: "Da murrten die Juden gegen ihn, weil er gesagt hatte: Ich bin das Brot, das vom Himmel herabgekommen ist."
 pam_1_thessalonians_5_16_20_english: "Freut euch zu jeder Zeit! Betet ohne Unterlass! Dankt für alles; denn das ist der Wille Gottes für euch in Christus Jesus. Löscht den Geist nicht aus! Verachtet prophetisches Reden nicht!"
 pam_1_thessalonians_4_11_english: "Setzt eure Ehre darein, ruhig zu leben, euch um die eigenen Aufgaben zu kümmern und mit euren Händen zu arbeiten, wie wir euch aufgetragen haben."
 pam_proverbs_6_6_english: "Geh zur Ameise, du Fauler, betrachte ihr Verhalten und werde weise!"
 pam_john_19_26_27_english: "Als Jesus die Mutter sah und bei ihr den Jünger, den er liebte, sagte er zur Mutter: Frau, siehe, dein Sohn! Dann sagte er zu dem Jünger: Siehe, deine Mutter! Und von jener Stunde an nahm sie der Jünger zu sich."
 pam_isaiah_7_14_english: "Darum wird der Herr selbst euch ein Zeichen geben: Siehe, die Jungfrau hat empfangen, sie gebiert einen Sohn und wird ihm den Namen Immanuel geben."
 pam_proverbs_31_20_english: "Sie öffnet ihre Hand für den Bedürftigen und reicht ihre Hände dem Armen."
 pam_revelation_12_1_english: "Dann erschien ein großes Zeichen am Himmel: eine Frau, mit der Sonne bekleidet; der Mond war unter ihren Füßen und ein Kranz von zwölf Sternen auf ihrem Haupt."
 pam_acts_8_18_english: "Als Simon sah, dass durch die Handauflegung der Apostel der Geist verliehen wird, brachte er ihnen Geld."
 pam_proverbs_21_20_english: "Ein kostbarer Schatz und Salböl sind in der Wohnung des Weisen, aber ein törichter Mensch vergeudet es."
 pam_luke_16_11_english: "Wenn ihr nun im Umgang mit dem ungerechten Mammon nicht zuverlässig gewesen seid, wer wird euch dann das wahre Gut anvertrauen?"
 pam_john_10_30_english: "Ich und der Vater sind eins."
 pam_john_1_1_english: "Im Anfang war das Wort und das Wort war bei Gott und das Wort war Gott."
 pam_hebrews_1_3_english: "Er ist der Abglanz seiner Herrlichkeit und das Abbild seines Wesens; er trägt das All durch sein machtvolles Wort, hat die Reinigung von den Sünden bewirkt und sich dann zur Rechten der Majestät in der Höhe gesetzt."
 pam_acts_1_8_english: "Aber ihr werdet Kraft empfangen, wenn der Heilige Geist auf euch herabkommen wird; und ihr werdet meine Zeugen sein in Jerusalem und in ganz Judäa und Samarien und bis an die Grenzen der Erde."
 pam_acts_2_4_english: "Und alle wurden vom Heiligen Geist erfüllt und begannen, in anderen Sprachen zu reden, wie es der Geist ihnen eingab."
 pam_acts_2_38_english: "Petrus antwortete ihnen: „Kehrt um und jeder von euch lasse sich auf den Namen Jesu Christi taufen zur Vergebung eurer Sünden; dann werdet ihr die Gabe des Heiligen Geistes empfangen.“"
 pam_2_macabees_12_44_english: "Denn hätte er nicht erwartet, dass die Gefallenen auferstehen werden, wäre es überflüssig und sinnlos gewesen, für die Toten zu beten."
 pam_matthew_12_25_english: "Jedes gegen sich selbst geteilte Königreich geht zugrunde, und keine gegen sich selbst geteilte Stadt und kein solches Haus kann bestehen."
 pam_matthew_12_32_english: "Auch wer ein Wort gegen den Menschensohn sagt, dem wird vergeben werden; wer aber etwas gegen den Heiligen Geist sagt, dem wird nicht vergeben, weder in dieser noch in der zukünftigen Welt."
 pam_hebrews_12_29_english: "Denn unser Gott ist verzehrendes Feuer."
 pam_genesis_1_28_english: "Gott segnete sie und Gott sprach zu ihnen: Seid fruchtbar und mehret euch, füllt die Erde und unterwerft sie und waltet über die Fische des Meeres, über die Vögel des Himmels und über alle Tiere, die auf der Erde kriechen!"
 pam_matthew_19_5_english: "Darum wird der Mann Vater und Mutter verlassen und sich an seine Frau binden und die zwei werden ein Fleisch sein."
 pam_ephesians_4_3_6_english: "Bemüht Euch mit aller Kraft, die Einheit des Geistes im Band des Friedens zu bewahren: Es gibt einen Leib und einen Geist, wie Ihr auch berufen seid zu einer Hoffnung Eurer Berufung, einem Herrn, einem Glauben, einer Taufe."
 pam_ephesians_5_25_english: "Ihr Männer, liebt eure Frauen, wie auch Christus die Kirche geliebt und sich für sie hingegeben hat."
 pam_matthew_16_18_english: "Ich aber sage dir: Du bist Petrus und auf diesen Felsen werde ich meine Kirche bauen und die Pforten der Unterwelt werden sie nicht überwältigen."
 pam_2_timothy_2_2_english: "Was du vor vielen Zeugen von mir gehört hast, das vertraue zuverlässigen Menschen an, die fähig sein werden, auch andere zu lehren!"
 pam_titus_1_5_english: "Ich habe dich in Kreta deswegen zurückgelassen, damit du das, was noch zu tun ist, zu Ende führst und in den einzelnen Städten Älteste einsetzt, wie ich dir aufgetragen habe."
 pam_james_5_16_english: "Darum bekennt einander eure Sünden und betet füreinander, damit ihr geheilt werdet! Viel vermag das inständige Gebet eines Gerechten."
 pam_1_john_1_9_english: "Wenn wir unsere Sünden bekennen, ist er treu und gerecht; er vergibt uns die Sünden und reinigt uns von allem Unrecht."
 pam_john_20_23_english: "Denen ihr die Sünden erlasst, denen sind sie erlassen; denen ihr sie behaltet, sind sie behalten."
 pam_romans_5_12_english: "Deshalb: Wie durch einen einzigen Menschen die Sünde in die Welt kam und durch die Sünde der Tod und auf diese Weise der Tod zu allen Menschen gelangte, weil alle sündigten."
 pam_psalm_51_5_english: "Denn ich erkenne meine bösen Taten, meine Sünde steht mir immer vor Augen."
 pam_genesis_3_6_english: "Da sah die Frau, dass es köstlich wäre, von dem Baum zu essen, dass der Baum eine Augenweide war und begehrenswert war, um klug zu werden. Sie nahm von seinen Früchten und aß; sie gab auch ihrem Mann, der bei ihr war, und auch er aß."
 # Celestial Hierarchy Tenet
 pam_hebrews_1_14_english: "Sind sie nicht alle nur dienende Geister, ausgesandt, um denen zu helfen, die das Heil erben sollen?"
 pam_psalm_91_11_english: "Denn er befiehlt seinen Engeln, dich zu behüten auf all deinen Wegen."
 pam_matthew_18_10_english: "Hütet euch davor, einen von diesen Kleinen zu verachten! Denn ich sage euch: Ihre Engel im Himmel sehen stets das Angesicht meines himmlischen Vaters."
 # Miles Christi Tenet
 pam_ephesians_6_11_english: "Zieht an die Waffenrüstung Gottes, um den listigen Anschlägen des Teufels zu widerstehen!"
 pam_2_timothy_2_3_english: "Leide mit mir als guter Soldat Christi Jesu!"
 pam_1_timothy_6_12_english: "Kämpfe den guten Kampf des Glaubens, ergreife das ewige Leben, zu dem du berufen worden bist und für das du vor vielen Zeugen das gute Bekenntnis abgelegt hast!"
 # Scholasticism Tenet
 pam_proverbs_1_7_english: "Die Furcht des HERRN ist Anfang der Erkenntnis, nur Toren verachten Weisheit und Erziehung."
 pam_colossians_2_3_english: "In ihm sind alle Schätze der Weisheit und Erkenntnis verborgen."
 pam_james_1_5_english: "Fehlt es aber einem von euch an Weisheit, dann soll er sie von Gott erbitten; Gott wird sie ihm geben, denn er gibt allen gern und macht niemandem einen Vorwurf."
 # Alexandrian Catechism Tenet
 pam_1_corinthians_1_30_english: "Von ihm her seid ihr in Christus Jesus, den Gott für uns zur Weisheit gemacht hat, zur Gerechtigkeit, Heiligung und Erlösung."
 # Adoptionism Tenet
 pam_mark_1_11_english: "Und eine Stimme aus dem Himmel sprach: Du bist mein geliebter Sohn, an dir habe ich Wohlgefallen gefunden."
 pam_romans_1_4_english: "Der dem Geist der Heiligkeit nach eingesetzt ist als Sohn Gottes in Macht seit der Auferstehung von den Toten, das Evangelium von Jesus Christus, unserem Herrn."
 pam_acts_13_33_english: "Gott hat die Verheißung, die an die Väter ergangen ist, an uns, ihren Kindern, erfüllt, indem er Jesus auferweckt hat, wie es im zweiten Psalm heißt: Mein Sohn bist du, heute habe ich dich gezeugt."
 # Love Thy Neighbour Tenet
 pam_matthew_22_39_english: "Ebenso wichtig ist das zweite: Du sollst deinen Nächsten lieben wie dich selbst."
 pam_luke_10_27_english: "Er antwortete: Du sollst den Herrn, deinen Gott, lieben mit deinem ganzen Herzen und deiner ganzen Seele, mit deiner ganzen Kraft und deinem ganzen Denken, und deinen Nächsten wie dich selbst."
 pam_galatians_5_14_english: "Denn das ganze Gesetz ist in dem einen Wort erfüllt: Du sollst deinen Nächsten lieben wie dich selbst!"
 # Divine Liturgy Tenet
 pam_isaiah_6_3_english: "Und einer rief dem anderen zu und sagte: Heilig, heilig, heilig ist der HERR der Heerscharen. Erfüllt ist die ganze Erde von seiner Herrlichkeit."
 pam_psalm_134_2_english: "Erhebt eure Hände zum Heiligtum und preist den HERRN!"
 pam_malachi_1_11_english: "Ja, vom Aufgang der Sonne bis zu ihrem Untergang steht mein Name groß da bei den Völkern und an jedem Ort wird meinem Namen ein Rauchopfer dargebracht und eine reine Opfergabe; ja, mein Name steht groß da bei den Völkern, spricht der HERR der Heerscharen."
 # Aniconism Tenet
 pam_exodus_20_4_english: "Du sollst dir kein Kultbild machen und keine Gestalt von irgendetwas am Himmel droben, auf der Erde unten oder im Wasser unter der Erde."
 # Armed Pilgrimages Tenet
 pam_matthew_16_24_english: "Darauf sagte Jesus zu seinen Jüngern: Wenn einer hinter mir hergehen will, verleugne er sich selbst, nehme sein Kreuz auf sich und folge mir nach."
 # Communal Identity Tenet
 pam_1_peter_2_9_english: "Ihr aber seid ein auserwähltes Geschlecht, eine königliche Priesterschaft, ein heiliger Stamm, ein Volk, das sein besonderes Eigentum wurde, damit ihr die großen Taten dessen verkündet, der euch aus der Finsternis in sein wunderbares Licht gerufen hat."
 # Consolamentum Tenet
 pam_2_timothy_4_7_english: "Ich habe den guten Kampf gekämpft, den Lauf vollendet, die Treue bewahrt."
 # Divine Marriage Tenet
 pam_tobit_8_7_english: "Und jetzt nehme ich diese meine Schwester nicht in Unzucht zur Frau, sondern in wahrer Liebe. Befiehl, dass wir beide Erbarmen finden und gemeinsam alt werden!"
 # Gnosticism Tenet
 pam_1_corinthians_2_7_english: "Vielmehr verkünden wir das Geheimnis der verborgenen Weisheit Gottes, die Gott vor allen Zeiten vorausbestimmt hat zu unserer Verherrlichung."
 # Mendicant Preachers Tenet
 pam_matthew_10_9_english: "Steckt nicht Gold, Silber und Kupfermünzen in euren Gürtel!"
 # Pentarchy Tenet
 pam_matthew_18_20_english: "Denn wo zwei oder drei in meinem Namen versammelt sind, da bin ich mitten unter ihnen."
 # Unrelenting Faith Tenet
 pam_hebrews_11_1_english: "Glaube aber ist: Grundlage dessen, was man erhofft, ein Zutagetreten von Tatsachen, die man nicht sieht."
 # Hesychasm Tenet
 pam_psalm_46_10_english: "Lasst ab und erkennt, dass ich Gott bin, erhaben über die Völker, erhaben auf Erden!"
 pam_matthew_6_6_english: "Du aber, wenn du betest, geh in deine Kammer, schließ die Tür zu; dann bete zu deinem Vater, der im Verborgenen ist! Dein Vater, der auch das Verborgene sieht, wird es dir vergelten."
 pam_1_kings_19_12_english: "Nach dem Beben kam ein Feuer. Doch der HERR war nicht im Feuer. Nach dem Feuer kam ein sanftes, leises Säuseln."
 # Anachoresis Tenet
 pam_matthew_4_1_2_english: "Dann wurde Jesus vom Geist in die Wüste geführt; dort sollte er vom Teufel versucht werden. Als er vierzig Tage und vierzig Nächte gefastet hatte, hungerte ihn."
 pam_hebrews_11_38_english: "Sie, deren die Welt nicht wert war, irrten umher in Wüsten und Gebirgen, in den Höhlen und Schluchten des Landes."
 pam_luke_5_16_english: "Doch er zog sich an einen einsamen Ort zurück, um zu beten."
 # Mortification of the Flesh Tenet
 pam_1_corinthians_9_27_english: "Vielmehr züchtige und unterwerfe ich meinen Leib, damit ich nicht anderen verkünde und selbst verworfen werde."
 pam_galatians_5_24_english: "Die zu Christus Jesus gehören, haben das Fleisch und damit ihre Leidenschaften und Begierden gekreuzigt."
 pam_romans_8_13_english: "Denn wenn ihr nach dem Fleisch lebt, müsst ihr sterben; wenn ihr aber durch den Geist die sündigen Taten des Leibes tötet, werdet ihr leben."
 # Holy Myron Tenet
 pam_john_3_5_english: "Jesus antwortete: Amen, amen, ich sage dir: Wenn jemand nicht aus dem Wasser und dem Geist geboren wird, kann er nicht in das Reich Gottes kommen."
 pam_acts_10_38_english: "Wie Gott Jesus von Nazareth gesalbt hat mit dem Heiligen Geist und mit Kraft, wie dieser umherzog, Gutes tat und alle heilte, die in der Gewalt des Teufels waren; denn Gott war mit ihm."
 pam_2_corinthians_1_21_22_english: "Gott aber ist es, der uns mit euch auf Christus hin stärkt und der uns gesalbt hat. Er hat uns auch sein Siegel aufgedrückt und als ersten Anteil den Geist in unsere Herzen gegeben."
 # Khachkar Tenet
 pam_galatians_6_14_english: "Ich aber will mich allein des Kreuzes Jesu Christi, unseres Herrn, rühmen, durch das mir die Welt gekreuzigt ist und ich der Welt."
 pam_1_corinthians_1_18_english: "Denn das Wort vom Kreuz ist denen, die verloren gehen, Torheit; uns aber, die gerettet werden, ist es Gottes Kraft."
 pam_isaiah_19_19_english: "An jenem Tag wird es einen Altar für den HERRN mitten im Land Ägypten geben und ein Steinmal an seiner Grenze für den HERRN."
 # Miaphysitism Tenet
 pam_john_1_14_english: "Und das Wort ist Fleisch geworden und hat unter uns gewohnt und wir haben seine Herrlichkeit geschaut, die Herrlichkeit des einzigen Sohnes vom Vater, voll Gnade und Wahrheit."
 pam_colossians_2_9_english: "Denn in ihm wohnt die ganze Fülle der Gottheit leibhaftig."
 pam_philippians_2_6_7_english: "Er war Gott gleich, hielt aber nicht daran fest, Gott gleich zu sein, sondern er entäußerte sich und wurde wie ein Sklave und den Menschen gleich."
 # Philanthropia Tenet
 pam_matthew_25_40_english: "Amen, ich sage euch: Was ihr für einen meiner geringsten Brüder getan habt, das habt ihr mir getan."
 # Sanctity of Nature Tenet
 pam_psalm_24_1_english: "Dem HERRN gehört die Erde und was sie erfüllt, der Erdkreis und seine Bewohner."
 # Literalism Tenet
 pam_2_timothy_3_16_english: "Jede Schrift ist, als von Gott eingegeben, auch nützlich zur Belehrung, zur Widerlegung, zur Besserung, zur Erziehung in der Gerechtigkeit."
 # Legalism Tenet
 pam_romans_2_13_english: "Denn nicht die sind vor Gott gerecht, die das Gesetz hören, sondern die das Gesetz tun; die werden für gerecht erklärt werden."
 # Religious Law Tenet
 pam_matthew_18_18_english: "Amen, ich sage euch: Alles, was ihr auf Erden binden werdet, das wird auch im Himmel gebunden sein, und alles, was ihr auf Erden lösen werdet, das wird auch im Himmel gelöst sein."
 # Communal Possessions Tenet
 pam_acts_4_32_english: "Die Menge derer, die gläubig geworden waren, war ein Herz und eine Seele. Keiner nannte etwas von dem, was er hatte, sein Eigentum, sondern sie hatten alles gemeinsam."
 # Ritual Hospitality Tenet
 pam_hebrews_13_2_english: "Vergesst die Gastfreundschaft nicht; denn durch sie haben einige, ohne es zu ahnen, Engel beherbergt!"
 # Ritual Celebrations Tenet
 pam_psalm_150_3_4_english: "Lobt ihn mit dem Schall des Widderhorns, lobt ihn mit Harfe und Leier! Lobt ihn mit Trommel und Reigentanz, lobt ihn mit Saiten und Flöte!"
 # Adaptability Tenet
 pam_1_corinthians_9_22_english: "Allen bin ich alles geworden, um auf jeden Fall einige zu retten."
 # Astrology Tenet
 pam_matthew_2_2_english: "Wo ist der neugeborene König der Juden? Wir haben seinen Stern aufgehen sehen und sind gekommen, um ihm zu huldigen."
 # Warmongering Tenet
 pam_psalm_144_1_english: "Gepriesen sei der HERR, mein Fels, der meine Hände den Kampf lehrt, meine Finger den Krieg!"
 # Natural Primitivism Tenet
 pam_genesis_2_25_english: "Beide, der Mensch und seine Frau, waren nackt, aber sie schämten sich nicht voreinander."
 # Auspicious Birthright Tenet
 pam_jeremiah_1_5_english: "Noch ehe ich dich im Mutterleib formte, habe ich dich ausersehen, noch ehe du aus dem Mutterschoß hervorkamst, habe ich dich geheiligt."
 # Sacred Childbirth Tenet
 pam_psalm_127_3_english: "Siehe, ein Erbteil vom HERRN sind Söhne, ein Lohn ist die Frucht des Leibes."
 # Hedonism Tenet
 pam_ecclesiastes_8_15_english: "Da pries ich die Freude; denn es gibt für den Menschen kein Glück unter der Sonne, es sei denn, er isst und trinkt und freut sich."
 # Pursuit of Power Tenet
 pam_psalm_2_8_english: "Fordere von mir und ich gebe dir die Völker zum Erbe und zum Eigentum die Enden der Erde."
 # Sanctioned False Conversions Tenet
 pam_2_kings_5_18_19_english: "Wenn mein Herr zur Anbetung in den Tempel Rimmons geht, stützt er sich dort auf meinen Arm. Ich muss mich dann im Tempel Rimmons niederwerfen, wenn er sich dort niederwirft. Dann möge das der HERR deinem Knecht verzeihen. Er antwortete: Geh in Frieden!"
