 # Miles Christi tenet
 tenet_miles_christi_latin_name: "Miles Christi" # DO NOT TRANSLATE
 tenet_miles_christi_greek_name: "Stratiōtēs Christoũ" # DO NOT TRANSLATE
 tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
 tenet_miles_christi_default_name: "Miles christianus"
 tenet_miles_christi_latin_desc: "So steht nun fest, eure Lenden umgürtet mit Wahrheit und angetan mit dem Brustpanzer der Gerechtigkeit. Kämpft den guten Kampf des Glaubens wie ein wahrer Streiter Christi.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Historischer Hintergrund für Miles Christi','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_greek_desc: "Jeder gläubige Christ muss bereit sein, um Christi willen zu leiden, standhaft gegen die geistlichen Mächte der Bosheit zu bestehen und mit dem Mut eines Soldaten Bedrängnisse zu ertragen.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Historischer Hintergrund für Stratiōtēs Christoũ','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_default_desc: "Die Gläubigen sind dazu berufen, geistliche Streiter zu sein, die mit der Waffenrüstung Gottes gegen Sünde und das Böse kämpfen und bereit sind, für Christus zu leiden, wie Soldaten für ihren Befehlshaber leiden.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Historischer Hintergrund des Miles christianus','tenet_miles_christi_historical_desc')]"
 tenet_miles_christi_historical_desc: "Das Konzept der „Soldaten Christi“ (Miles Christi) ist in der christlichen Tradition tief verwurzelt und gründet sich auf die Episteln des heiligen Paulus, in denen er militärische Metaphern nutzt, um das klerikale Leben zu beschreiben. Im Mittelalter wurde dieses Konzept auf sowohl den tatsächlichen als auch den klerikalen Kampf angewendet.\n\nDie Kriegerorden wie die Tempelritter und die Malteser verinnerlichten dieses Ideal und verbanden klösterliche Disziplin mit Kriegskunst. Bernhard von Clairvaux’ „De Laude Novae Militiae“ pries diese Kriegermönche als Beispiel christlicher Tugend, die nicht für weltliche Bereicherung, sondern für die Verteidigung des Christentums kämpften."
 doctrine_parameter_tenet_miles_christi_white_peace_defender_bonus: "Als Verteidiger einen [war|E] mit einem [Concept('white_peace', 'Weißen Frieden')|E] gegen denselben [Concept('faith', 'Glauben')|E] zu beenden, gewährt #P 100#! @piety_icon! [piety|E] und @legitimacy_icon![legitimacy|E] skalierend mit dem [title|E]-Rang sowie #P 5#! @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_miles_christi_combat_fulfillment: "Eine gewonnene [battle|E] oder [siege|E] zu befehligen, gewährt #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_miles_christi_holy_weapon_blessing: "[battles|E] gegen eine andere [religion|E] zu gewinnen, während man eine [Concept('holy_relic', 'Sakralreliquien')|E]-Waffe trägt, verbessert diese mit bis zu vier Segen (bei bis zu #P 50#! Siegen)"
 # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter
 tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
 tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
 tenet_philanthropia_default_name: "Menschenliebe"
 tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
 tenet_philanthropia_latin_desc: "Was ihr für einen meiner geringsten Brüder und Schwestern getan habt, das habt ihr für mich getan. Das Geben von Almosen und die Sorge für die Armen sind nicht bloße bürgerliche Pflichten, sondern ein Weg, Christus selbst nahe zu kommen.\n\n[Glossary('Historischer Hintergrund für Caritas','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_greek_desc: "Die Philanthropie – die Menschenliebe – fand ihren vollsten Ausdruck in den kaiserlichen und kirchlichen Krankenhäusern, Hospizen und Almosen des Neuen Rom. Die Hungrigen zu speisen und die Gefangenen freizukaufen, heißt, Christus nachzuahmen, der sich um unseretwillen entäußerte.\n\n[Glossary('Historischer Hintergrund für Philanthrōpía','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_default_desc: "Der Glaube schätzt das großzügige Geben von Almosen, die Sorge für die Armen und die institutionelle Nächstenliebe als zentrale christliche Pflicht, in Nachfolge der Kirchenväter und des Vorbilds der frühen Hospize und Krankenhäuser.\n\n[Glossary('Historischer Hintergrund für Nächstenliebe','tenet_philanthropia_historical_desc')]"
 tenet_philanthropia_historical_desc: "Im byzantinischen Christentum bezeichnete Philanthrōpia sowohl die Tugend der allumfassenden Liebe als auch die tatsächlichen Einrichtungen wie Krankenhäuser, Fremdenherbergen, Waisenhäuser und Almosen, die von Kaisern, Bischöfen und den Gläubigen unterstützt wurden. Basilius von Caesarea, Johannes Chrysostomos und spätere Kaiser wie Justinian verbanden die kaiserliche Legitimität mit der Fürsorge für die Bedürftigen. Die Kirche verherrlichte Krieg nicht als den Weg zur Heiligkeit, sondern sie betonte, dass Reichtum und Macht in Teilen dadurch gerechtfertigt seien, wie sie den Armen dienten."
 doctrine_parameter_tenet_philanthropia_high_almoner_court_position: "Kann schon im [county|E]-Rang und höher einen [GetCourtPositionType('high_almoner_court_position').GetName] ernennen"
 doctrine_parameter_tenet_philanthropia_ransom_captives: "Einen anderen [character|E] freizukaufen, gewährt @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El], die mit dem bezahlten @gold_icon![gold|E] skaliert"
 doctrine_parameter_tenet_philanthropia_generous_bonus: "[GetTrait('generous').GetName(GetNullCharacter)|U]e [characters|E]: #P +10#! [opinion|E] beim selben Glauben, #P +20 %#! [development_growth|E]"
 doctrine_parameter_tenet_philanthropia_greedy_penalty: "[GetTrait('greedy').GetName(GetNullCharacter)|U]e [characters|E]: #N -10#! [opinion|E] beim gleichen Glauben, #N -25 %#! Zuwachs an @piety_icon![piety|E]"
 doctrine_parameter_tenet_philanthropia_alms_to_the_destitute: "Ein [gift|E] an einen [Concept('debt', 'verschuldeten')|E] [character|E] zu schicken, gewährt @prestige_icon![prestige|E] und @piety_icon![piety|E]"
 pam_philanthropia_ransom_toast: "Durch Euren persönlichen Grundsatz namens [GetTenetType('tenet_philanthropia').GetName(GetPlayer.GetRite)]"
 # Scholasticism tenet
 tenet_scholasticism_latin_name: "Sacra Doctrina" # DO NOT TRANSLATE
 tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
 tenet_scholasticism_default_name: "Scholastik"
 tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_latin_desc: "Das Streben nach Erkenntnis ist eine Form der Anbetung, denn im Verstehen der Schöpfung kommen wir dem Schöpfer näher. Suchet die Weisheit, so wird sie euch gegeben werden.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Historischer Hintergrund für Sacra Doctrina','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_greek_desc: "Glaube und Vernunft stehen nicht im Gegensatz zueinander, sondern ergänzen sich, denn Gott hat uns den Verstand gegeben, um die Wahrheit zu suchen, und das Herz, um ihn zu lieben. Durch Studium und Kontemplation steigen wir zu höherer Erkenntnis auf.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Historischer Hintergrund für Skholastikē','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_default_desc: "Durch strenge intellektuelle Untersuchung und die dialektische Methode können Glaube und Vernunft miteinander versöhnt und ein tieferes Verständnis der göttlichen Wahrheit erreicht werden.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Historischer Hintergrund für Scholastik','tenet_scholasticism_historical_desc')]"
 tenet_scholasticism_historical_desc: "Die Scholastik war die vorherrschende Bildungsmethode an den mittelalterlichen europäischen Universitäten und erreichte ihren Höhepunkt im 12. und 13. Jahrhundert. Sie wollte die christliche Theologie mit der antiken Philosophie zusammenführen und dabei insbesondere mit den Werken des Aristoteles.\n\nHerausragende scholastische Denker wie Anselm von Canterbury, Petrus Abaelardus, Albertus Magnus und Thomas von Aquin entwickelten systematische Ansätze der Theologie, die logische Strenge und Disputation betonten. Die „Summa Theologica“ von Thomas von Aquin, die versucht, das gesamte menschliche Wissen in einen christlichen Rahmen einzufügen, bleibt der überragende Erfolg der scholastischen Methode."
 doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Eine [points_of_interest|E] in [GetReligionByKey('judaism_religion').GetAdjective|l]en, [GetReligionByKey('islam_religion').GetAdjective|l]en und [GetReligionByKey('zoroastrianism_religion').GetAdjective|l]en [counties|E] zu besuchen, gewährt zusätzliche @piety_icon![piety|E], [Concept('learning', 'Bildungs')|E]-[experience|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_scholasticism_university_bonus: "[GetActivityType('activity_adult_education').GetName] abzuschließen, gewährt einen lang anhaltenden [modifier|E]: [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_scholasticism_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName]s-[scheme_success_chance|E]: [success_chance_i]#P +10 %#!"
 doctrine_parameter_tenet_scholasticism_university_chance: "Jährliche Chance, [GetModifier('tenet_scholasticism_modifier').GetNameWithTooltip] zu erhalten, ohne zu studieren (verbessert durch [learning|E], [piety_level|E] und bekannte Sprachen)"
 doctrine_parameter_tenet_scholasticism_cheaper_adult_education: "Teilnahme an einem [GetActivityType('activity_adult_education').GetName] kostet #P [EmptyScope.ScriptValue('pam_scholasticism_adult_education_discount_loc')] %#! weniger @gold_icon![gold|E]"
 doctrine_parameter_tenet_scholasticism_court_scholar: "[SelectLocalization(HasDlcFeature('legacy_of_persia'), 'tenet_scholasticism_court_scholar_effect', 'blank_line')]"
 tenet_scholasticism_court_scholar_name: "$tenet_scholasticism_name$"
 tenet_scholasticism_court_scholar_effect: "[GetCourtPositionType('court_scholar_court_position').GetName] kann ohne die [culture_tradition|E] $tradition_fp3_beacon_of_learning_name$ und ohne #P Salär#! ernannt werden"
 tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
 tenet_scholasticism_modifier_desc: "Das Streben nach Erkenntnis ist eine Form der Anbetung, denn im Verständnis der Schöpfung kommen wir dem Schöpfer näher."
 pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"
 pam_tenet_scholasticism_studium_toast_title: "Ein Reisestudium"
 pam_tenet_scholasticism_studium_toast_desc: "[pam_studium_scholar.GetTitledFirstName|U] verbrachte das letzte Stück des Weges damit, mit Euch über diese Sache zu diskutieren. Doch irgendwann zwischen einer [barony|E] und der nächsten entschied er, dass sich dies besser schriftlich klären lässt."
 court_position_scholasticism_free: "$tenet_scholasticism_default_name$"
 # Love Thy Neighbour tenet
 tenet_love_thy_neighbour_latin_name: "Diliges Proximum" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon" # DO NOT TRANSLATE
 tenet_love_thy_neighbour_default_name: "Liebe deinen Nächsten"
 tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_latin_desc: "Mögen wir auf andere blicken, als sähen wir sie durch Deine Augen – weniger richtend, mehr liebend und sie wie uns selbst als ein Werk erkennend, das zu seiner Zeit von Deinen Händen vollendet wird.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Historischer Hintergrund für Diliges Proximum','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_greek_desc: "Was kann süßer und schöner sein als die Liebe zum Nächsten? Liebe ist Seligkeit, und Hass ist Qual. An diesen beiden Geboten hängen das ganze Gesetz und die Propheten: Liebe den Herrn, deinen Gott, von ganzem Herzen, und liebe deinen Nächsten wie dich selbst.\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Historischer Hintergrund für Agapēseis tòn Plēsíon','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_default_desc: "Die Liebe zum Nächsten ist untrennbar von der Liebe zu Gott, und durch Werke der Nächstenliebe und Barmherzigkeit erfüllen wir das gesamte göttliche Gesetz.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Historischer Hintergrund für Liebe deinen Nächsten','tenet_love_thy_neighbour_historical_desc')]"
 tenet_love_thy_neighbour_historical_desc: "Das Gebot, den Nächsten zu lieben, steht im Zentrum der christlichen Ethik. Es entstammt Levitikus 19,18 und wurde von Christus erhöht, sodass es neben der Gottesliebe als Zusammenfassung des gesamten göttlichen Gesetzes gilt. Frühe Kirchenväter wie Clemens von Alexandria und Johannes Chrysostomos betonten, dass sich die wahre Liebe über Familie und Freunde hinaus erstrecken und die gesamte Menschheit umfassen müsse, Fremde und Feinde eingeschlossen. Diese Lehre inspirierte die Entwicklung der christlichen Wohltätigkeitsorganisationen und Krankenhäuser sowie die Praxis des Almosengebens durch das Mittelalter hindurch."
 doctrine_parameter_tenet_love_thy_neighbour_county_bonus: "[counties|E] mit #P 60+#! [county_opinion|E], die diesem [Concept('faith', 'Glauben')|E] folgen, können einen „[GetModifier('tenet_love_thy_neighbour_modifier').GetNameWithTooltip]“-[modifier|E] erhalten"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_shelter: "$building_type_hospices_01$-[buildings|E] verringern die [travel_danger|E] in der [county|E] um #P 3#! bis #P 10#!, was mit jeder Stufe steigt"
 doctrine_parameter_tenet_love_thy_neighbour_hospital_care: "$building_type_hospices_01$-[buildings|E] gewähren #P +2#! bis #P +10#! [epidemic_resistance|E] in der [province|E], was mit jeder Stufe steigt"
 doctrine_parameter_tenet_love_thy_neighbour_foreign_sway: "[GetScheme('sway').GetTypeName]-[scheme_success_chance|E] gegen [characters|E] außerhalb Eures [Concept('realm', 'Reichs')|E]: [success_chance_i]#P +20 %#!"
 doctrine_parameter_tenet_love_thy_neighbour_vassalage_acceptance: "Annahme (#high $offer_vassalization_interaction$#!): #P +15#!"
 tenet_love_thy_neighbour_boon_reason: "$tenet_love_thy_neighbour_name$: $VALUE|=+0$"
 tenet_love_thy_neighbour_modifier: "$tenet_love_thy_neighbour_default_name$"
 tenet_love_thy_neighbour_modifier_desc: "Die Liebe zum Nächsten ist untrennbar von der Liebe zu Gott; durch Werke der Nächstenliebe und Barmherzigkeit gehorchen wir dem göttlichen Gesetz."
 pam_love_thy_neighbor_toast_title: "$tenet_love_thy_neighbour_default_name$"
 # Divine Liturgy tenet
 tenet_divine_liturgy_latin_name: "Divinum Officium" # DO NOT TRANSLATE
 tenet_divine_liturgy_greek_name: "Theía Leitourgía" # DO NOT TRANSLATE
 tenet_divine_liturgy_default_name: "Göttliche Liturgie"
 tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
 tenet_divine_liturgy_latin_desc: "Die heilige Liturgie ist der Himmel auf Erden, wo wir uns mit Engeln und Heiligen in der ewigen Anbetung vereinen. Heilig, heilig, heilig ist der Herr der Heerscharen; erfüllt ist die ganze Erde von seiner Herrlichkeit.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Historischer Hintergrund für Divinum Officium','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_greek_desc: "In der göttlichen Liturgie nehmen die Gläubigen an der himmlischen Anbetung teil, überschreiten Zeit und Raum und treten mit den Cherubim und Seraphim vor den Thron Gottes.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Historischer Hintergrund für Theía Leitourgía','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_default_desc: "Die Liturgie ist der grundlegende Ausdruck des Glaubens, in dem Himmel und Erde sich begegnen und die Gläubigen gemeinsam mit Engeln und Heiligen an der ewigen Anbetung Gottes teilnehmen.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Historischer Hintergrund für Göttliche Liturgie','tenet_divine_liturgy_historical_desc')]"
 tenet_divine_liturgy_historical_desc: "Die göttliche Liturgie entwickelte sich aus den frühesten christlichen Gottesdiensten, wobei die Liturgie des heiligen Basilius sowie die Liturgie des heiligen Johannes Chrysostomos zu den maßgeblichen Formen im östlichen Christentum wurden. Mit aufwendigen Zeremonien, Weihrauch, Ikonen und Gesängen, die eine sinnliche Erfahrung des Göttlichen erzeugen, betonten diese Liturgien die mystische Teilnahme der Gläubigen an der himmlischen Anbetung. Die Liturgie wurde dabei nicht einfach nur als die menschliche Verehrung Gottes angesehen, sondern als der Eintritt der Gläubigen in die ewige himmlische Anbetung, die die Grenzen von Raum und Zeit übersteigt."
 doctrine_parameter_tenet_divine_liturgy_temple_piety: "Gewährt: [GetModifier('tenet_divine_liturgy_choirs_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_divine_liturgy_well_sung_liturgy: "Gewährt: [GetModifier('tenet_divine_liturgy_officiant_modifier').GetNameWithTooltip]\n$modifier_definition_value_per_chaplain_learning$"
 doctrine_parameter_tenet_divine_liturgy_schola_cantorum: "Euer [court_chaplain|E] erhält #P +2#! [learning|E]"
 tenet_aniconism_latin_name: "Iconomachia" # DO NOT TRANSLATE
 tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
 tenet_aniconism_default_name: "$tenet_aniconism_name$"
 tenet_aniconism_latin_desc: "O Herr, Du allein bist der Anbetung würdig. Bewahre uns vor der Falle der Götzen, damit wir Dich in Geist und Wahrheit anbeten, nicht durch Bilder, die von Menschenhand gemacht sind, sondern mit reinen Herzen, die zu Dir erhoben sind.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Historischer Hintergrund für Iconomachia','tenet_aniconism_historical_desc')]"
 tenet_aniconism_greek_desc: "Die Verehrung von Bildern wird weder durch die Heilige Schrift noch durch die Tradition der Kirchenväter gestützt. Der Bildersturm ist die wahre Lehre der Kirche und reinigt die Gläubigen von der Götzendienstlichkeit der Bilder.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Historischer Hintergrund für Eikonomakhía','tenet_aniconism_historical_desc')]"
 tenet_aniconism_default_desc: "Du sollst dir kein Götzenbild noch irgendein Abbild von irgendetwas machen. Die Verehrung von Bildern ist eine Verfälschung des wahren Glaubens.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Historischer Hintergrund für Bilderverbot','tenet_aniconism_historical_desc')]"
 tenet_aniconism_historical_desc: "Die Vermeidung, das Verbot und die Zerstörung religiöser Bilder haben in den abrahamitischen Traditionen tiefe Wurzeln. Im Christentum war der bedeutendste Ausdruck dessen der Erste Byzantinische Bilderstreit (726-843), der durch Kaiser Leo III. eingeleitet und von Konstantin V. fortgesetzt wurde – eine Phase großflächiger Zerstörung religiöser Bilder und der Verfolgung jener, die Ikonen verehrten.\n\nBilderstürmer argumentieren, die Verehrung von Ikonen verstoße gegen das biblische Verbot von Götzenbildern. Das Zweite Konzil von Nicäa im Jahr 787 verurteilte Bilderstürmerei. Dabei wies man auf die Ähnlichkeiten zwischen der Verehrung durch Ikonen und durch das geschriebene Evangelium hin. Der Bildersturm erfuhr unter Leo V. im Jahr 814 eine Wiederbelebung. Ähnliche anikonische Tendenzen traten später in verschiedenen protestantischen Bewegungen auf."
 # Alexandrian Catechism tenet
 tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis" # DO NOT TRANSLATE
 tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
 tenet_alexandrian_catechism_latin_desc: "O Christus, ewige Weisheit Gottes, erleuchte unsere Gedanken, damit wir die verborgenen Geheimnisse Deiner Heiligen Schrift erkennen. Schenke uns Augen, die über den Buchstaben hinaus auf den Geist schauen, der Leben gibt.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Historischer Hintergrund für Catechesis Alexandrina','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_greek_desc: "Die alexandrinische Tradition lehrt, dass die göttliche Weisheit durch die allegorische Auslegung der Schrift offenbart wird. Christus ist der Logos, das göttliche Wort, durch den alle Wahrheit kundgetan wird.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Historischer Hintergrund für Alexandrinē Katēkhēsis','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_default_desc: "Die alexandrinische Schule betont die allegorische Auslegung der Heiligen Schrift sowie die Synthese der christlichen Theologie mit der griechischen Philosophie und sucht nach tieferen geistlichen Bedeutungen unterhalb des wörtlichen Textes.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Historischer Hintergrund für Alexandrinischen Katechismus','tenet_alexandrian_catechism_historical_desc')]"
 tenet_alexandrian_catechism_historical_desc: "Die Katechetenschule von Alexandria, die im späten 2. Jahrhundert gegründet wurde, war die früheste christliche Einrichtung für höhere Bildung. Unter Lehrern wie Clemens von Alexandria and Origenes entwickelte sie eine anspruchsvolle Methode der Bibelauslegung, die nach allegorischen und spirituellen Bedeutungen in der Schrift suchte. Die Schule verband christliche Theologie mit platonischer Philosophie und argumentierte, dass die griechische Bildung den Weg für die Heilsbotschaft bereitete.\n\nOrigenes exegetische Methoden und theologische Spekulationen beeinflussten das östliche Christentum nachhaltig, während die Betonung der allegorischen Methode durch diese Schule im Kontrast zum eher wörtlichen Ansatz der Schule von Antiochia stand."
 # Adoptionism Tenet
 tenet_adoptionism_latin_name: "Filius Adoptivus" # DO NOT TRANSLATE
 tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
 tenet_adoptionism_default_name: "Adoptianismus"
 tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
 tenet_adoptionism_latin_desc: "O Vater, der du auf den gerechten Menschen Jesus schautest und ihn für dich erwähltest, gewähre, dass auch wir der Annahme als deine Kinder würdig befunden werden. Wie du ihn aus den Wassern erhobst und als deinen Geliebten bezeichnetest, so erhebe uns aus unserer Niedrigkeit in deine göttliche Familie.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Historischer Hintergrund für Filius Adoptivus','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_greek_desc: "O Gott, der du die Demütigen erhöhst und die Gerechten für dich erwählst, wir preisen dich für das Mysterium der Annahme an Kindes Statt. Wie Christus durch deine Gnade zur göttlichen Sohnschaft erhoben wurde, so mögen auch wir zu deinen Kindern gezählt werden.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Historischer Hintergrund für Hyiothesía','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_default_desc: "O Herr, hilf uns, das Geheimnis der Erhöhung deines Sohnes zu verstehen. Mögen wir seinem Beispiel der Gerechtigkeit folgen, damit auch wir Kinder Gottes genannt werden.\n\n$pam_mark_1_11_default$\n\n[Glossary('Historischer Hintergrund für Adoptianismus','tenet_adoptionism_historical_desc')]"
 tenet_adoptionism_historical_desc: "Der Adoptianismus besagt, dass Jesus als ein gewöhnlicher Mensch geboren und dann später als Gottes Sohn „adoptiert“ wurde, üblicherweise zu seiner Taufe, als der Heilige Geist über ihn kam. Frühe Formen dieser Annahme erschienen erstmals im 2. Jahrhundert, als Theodotus von Byzanz, der einen dynamischen Monarchismus lehrte, die Einheit Gottes betonte.\n\nIm Spanien des 8. Jahrhunderts lebte diese Lehre durch Erzbischof Elipandus von Toledo und Bischof Felix von Urgell wieder auf, die zwischen der göttlichen Natur Christi als in Ewigkeit gezeugt und seiner menschlichen als adoptiert unterschieden. Das Konzil von Frankfurt im Jahre 794 verurteilte den spanischen Adoptianismus als Ketzerei. Trotz dieser Verurteilung beeinflussten adoptianistische Ideen später antitrinitarische Bewegungen."
 doctrine_parameter_tenet_adoptionism_adoption_always_possible: "Die [interaction|E] [adopt|EU] ist immer ohne die üblichen Anforderungen verfügbar (das Ziel muss aber trotzdem zulässig sein und ein untergebener Heiratspartner kann nicht adoptieren)"
 doctrine_parameter_tenet_adoptionism_adoption_accepted: "[vassals|E] und Kinder, die diesem [rite|E] folgen, verabscheuen keine [Concept('adopt', 'Adoptionen')|E] (#N -10#! bis #N -25#! [opinion|E] vermieden)"
 doctrine_parameter_tenet_adoptionism_adoption_personal_active: "Die [interaction|E] [adopt|EU] ist immer ohne die üblichen Anforderungen für Euch verfügbar (das Ziel muss aber trotzdem zulässig sein)"
 doctrine_parameter_tenet_adoptionism_sp_on_adopt: "@legitimacy_icon![legitimacy|E], @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El] beim [Concept('adopt', 'Adoptieren')|E] eines [Concept('character', 'Charakters')|E]"
 pam_adoptionism_adopt_sp_toast: "Persönlicher Grundsatz [GetTenetType('tenet_adoptionism').GetName(GetPlayer.GetRite)]"
 doctrine_parameter_tenet_adoptionism_legitimize_bastards: "Die [interaction|E] [Concept('legitimized_bastard', 'Legitimierung eines Bastards')|E] kostet #P 50 %#! weniger @prestige_icon![prestige|E], sofern Euer [faith|E] sie erlaubt"
 doctrine_parameter_tenet_adoptionism_legitimize_own_children: "Die [interaction|E] „[Concept('legitimized_bastard', 'Bastard legitimieren')|E]“ kann bei Euren eigenen [Concept('children','Kindern')|E] verwendet werden, auch wenn sie zu einem anderen [house|E] gehören, sofern Euer [faith|E] dies erlaubt"
 # Armed Pilgrimages Tenet
 tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma" # DO NOT TRANSLATE
 tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
 tenet_armed_pilgrimages_latin_desc: "O Herr, stärke uns, wenn wir das Kreuz in deinem heiligen Namen auf uns nehmen. Führe unsere Schritte auf dem heiligen Weg, damit wir den Glauben verteidigen und die heiligen Stätten aus den Händen der Ungläubigen befreien können.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Historischer Hintergrund für Peregrinatio Armata','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_greek_desc: "Die Gläubigen sind dazu berufen, Christus nachzufolgen, indem sie das Kreuz auf sich nehmen – nicht nur im geistlichen Sinn, sondern auch zur Verteidigung der heiligen Stätten. Wehrhafte Pilgerschaft ist ein Akt der Hingabe, eine Glaubensreise, die durch das Schwert beschützt wird.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Historischer Hintergrund für Énoplon Proskýnēma','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_default_desc: "Pilgerreisen zu den heiligen Stätten sind eine heilige Pflicht, und die Gläubigen sind aufgerufen, diese Stätten und andere Pilger zu beschützen – auch mit Waffengewalt, wenn es notwendig ist.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Historischer Hintergrund für Wehrhafte Pilgerreisen','tenet_armed_pilgrimages_historical_desc')]"
 tenet_armed_pilgrimages_historical_desc: "Ein Zusammenspiel aus einer spiritueller Praxis, um die heiligen Stätten zu besuchen, und einer militärischen Handlung, um diese Stätten zu verteidigen oder zurückzuerobern. Die Kreuzzüge, die 1095 mit dem Aufruf Papst Urbans II. auf der Synode von Clermont begannen, stehen für die organisierteste Form der bewaffneten Pilgerreise. Kreuzfahrern wurde der vollständige Ablass gewährt und ihr Militärdienst als ein Akt der Buße und Hingabe angesehen.\n\nDas Konzept bezog sich auf frühere Traditionen des Bußkriegs und der Verteidigung des Christentums gegen Bedrohungen von außen, und es transformierte die Pilgerfahrt von einer friedlichen Reise in einen militanten Ausdruck des Glaubens."
 # Communal Identity Tenet
 tenet_communal_identity_latin_name: "Populus Dei" # DO NOT TRANSLATE
 tenet_communal_identity_greek_name: "Laòs Theoũ" # DO NOT TRANSLATE
 tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
 tenet_communal_identity_latin_desc: "Wir sind das auserwählte Geschlecht, ein königliches Priestertum, eine heilige Nation, von Gott auserkoren. Mögen wir seine mächtigen Taten verkünden und würdig unserer Berufung als sein Volk wandeln.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Historischer Hintergrund für Populus Dei','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_greek_desc: "Aus der Finsternis zu Seinem wunderbaren Licht berufen bilden die Gläubigen eine heilige Nation, ein Volk zu Gottes eigenem Eigentum. Unsere Identität findet sich in Christus, der uns zu einem Leib machte.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Historischer Hintergrund für Laòs Theoũ','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_default_desc: "Die Gläubigen sind als Gottes auserwähltes Volk geeint, eine von der Welt abgesonderte Gemeinschaft, die in Christus eine gemeinsame Identität und Bestimmung teilt.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Historischer Hintergrund für Gemeindeverflechtung','tenet_communal_identity_historical_desc')]"
 tenet_communal_identity_historical_desc: "Das Konzept der Kirche als das „Volk Gottes“ bezieht sich auf das Alte Testament, das Israel als das von Gott auserwählte Volk darstellt, und wird durch den Blickwinkel des neuen Bundes neu ausgelegt. Die frühen Christen verstanden sich selbst als ein neues Israel, das nicht durch Blut oder Ethnizität, sondern durch den Glauben an Christus vereint ist.\n\nDiese Gemeindeverflechtung überstieg gesellschaftliche, ethnische und nationale Grenzen und schuf eine universelle Geschwisterlichkeit. Die Lumen gentium des Zweiten Vatikanischen Konzils stellte das „Volk Gottes“ deutlich als ein zentrales ekklesiologisches Bild heraus und betonte die Pilgernatur der Kirche sowie die gemeinsame Würde aller Getauften."
 # Consolamentum Tenet
 tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
 tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
 tenet_consolamentum_default_name: "Consolamentum"
 tenet_consolamentum_latin_desc: "O Herr, wir kämpften den guten Kampf, wir beendeten den Lauf, wir bewahrten den Glauben. Nimm nun deinen Diener auf in den Trost des Geistes, damit die Seele von den Fesseln dieser stofflichen Welt befreit werde.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Historischer Hintergrund für Consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_greek_desc: "Durch die Handauflegung und das Gebet der Gläubigen empfängt der Geist göttlichen Trost. Der gute Kampf ist gekämpft, der Lauf vollendet und der Glaube bis ans Ende bewahrt worden.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Historischer Hintergrund für Paráklēsis','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_default_desc: "Durch den heiligen Ritus der geistlichen Tröstung empfangen die Gläubigen den Heiligen Geist und werden auf ihre Reise von dieser Welt in die nächste vorbereitet.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Historischer Hintergrund für Consolamentum','tenet_consolamentum_historical_desc')]"
 tenet_consolamentum_historical_desc: "Das Consolamentum war das zentrale Sakrament des katharischen Glaubens und verband Elemente der Taufe, der Konfirmation, der Weihe und der letzten Ölung. Durch das Auflegen der Hände sollte der Heilige Geist übergehen und die Seele von der stofflichen Welt befreit werden, so die Annahme.\n\nDie meisten Gläubigen erhielten das Consolamentum nur auf dem Totenbett, wohingegen jene, die es bei bester Gesundheit erhielten, zu „Perfecti“ oder „Bons Hommes“ wurden und sich zu einem Leben strenger Askese verpflichteten. Der Ritus hatte seine Wurzeln in frühen christlichen Praktiken der Geisttaufe und zeigt mögliche Einflüsse aus der östlichen Bogomilentradition."
 # Divine Marriage Tenet
 tenet_divine_marriage_latin_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
 tenet_divine_marriage_greek_name: "Hieròs Gámos" # DO NOT TRANSLATE
 tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
 tenet_divine_marriage_latin_desc: "O Herr, nicht aus Begierde sind wir in dieser heiligen Verbindung vereint worden, sondern in Aufrichtigkeit und Wahrheit. Gewähre uns, dass wir Barmherzigkeit finden und gemeinsam alt werden, indem wir die Heiligkeit unseres Bundes bewahren.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Historischer Hintergrund für Matrimonium Sacrum','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_greek_desc: "Eheschließungen innerhalb derselben Glaubensgemeinschaft erhalten die heilige Blutlinie und bewahren die Reinheit vor Gott. Nicht in der Begierde, sondern in der Wahrheit sind diese Verbindungen gesegnet, sodass Gnade für Mann und Frau gefunden werden kann.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Historischer Hintergrund für Hieròs Gámos','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_default_desc: "Die heilige Ehe innerhalb der Gemeinschaft erhält die spirituelle Reinheit und bewahrt die Heiligkeit der religiösen Blutlinie über Generationen hinweg.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Historischer Hintergrund für Göttliche Vermählung','tenet_divine_marriage_historical_desc')]"
 tenet_divine_marriage_historical_desc: "Das Konzept der heiligen Ehe oder der Endogamie, also der Eheschließung ausschließlich innerhalb der eigenen Gruppe, wurzelt in vielen Traditionen. Im Zoroastrismus wurde die Xwedodah (Verwandtenehe) praktiziert, um die spirituellen Verdienste und den Familienbesitz zu wahren. Diese Praxis sollte die religiöse Reinheit erhalten, die spirituelle Macht festigen und heilige und königliche Blutlinien sichern.\n\nVon Außenstehenden wurde sie oft kontrovers gesehen und falsch verstanden, wohingegen ihre Anhänger solche Ehen als die Erfüllung göttlicher Befehle ansahen, die dazu dienten, die Heiligkeit ihrer Gemeinschaft zu erhalten."
 # Gnosticism Tenet
 tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
 tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
 tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
 tenet_gnosticism_latin_desc: "O göttliche Weisheit, die du den Zeitaltern verborgen bist, offenbare uns die Geheimnisse der geistigen Welt. Befreie unsere Seelen aus dem Gefängnis der Stofflichkeit, damit wir zur Fülle des Lichts und der Erkenntnis aufsteigen.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Historischer Hintergrund für Gnosis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_greek_desc: "Wahre Erlösung kommt durch die Gnosis, die verborgene Erkenntnis göttlicher Dinge, die der stofflichen Welt entzogen ist. Wir verkünden Gottes Weisheit im Geheimnis, die verborgene Weisheit, die vor allen Zeiten für unsere Herrlichkeit bestimmt wurde.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Historischer Hintergrund für Gnõsis','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_default_desc: "Erlösung wird durch geheimes geistliches Wissen erlangt, das den göttlichen Funken in uns offenbart und den Weg zur Befreiung aus der stofflichen Welt weist, die der Demiurg schuf.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Historischer Hintergrund für Gnostizismus','tenet_gnosticism_historical_desc')]"
 tenet_gnosticism_historical_desc: "Der Gnostizismus umfasst diverse religiöse Bewegungen der frühen Christenzeit, die Erlösung durch Gnosis oder esoterisches Wissen predigten. Gnostiker sahen die stoffliche Welt üblicherweise als eine fehlerhafte Schöpfung einer niederen Gottheit – der Demiurg genannt –, wohingegen der wahre Gott versteckt und nicht greifbar blieb. Menschliche Seelen, so die Überzeugung, waren in Materie gefangene göttliche Funken, die sich durch geheimes Wissen befreien ließen.\n\nZu den bedeutenden gnostischen Lehrern zählten Valentinus, Basilides und Marcion. Kirchenväter wie Irenaeus und Tertullius schrieben sehr umfänglich gegen die gnostische Lehre, die sie als eine ketzerische Abkehr vom apostolischen Christentum begriffen."
 # Mendicant Preachers Tenet
 tenet_mendicant_preachers_latin_name: "Pax et Bonum" # DO NOT TRANSLATE
 tenet_mendicant_preachers_greek_name: "Ptōkhoì Kērykes" # DO NOT TRANSLATE
 tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
 tenet_mendicant_preachers_latin_desc: "O Herr, wie du deine Apostel ohne Gold und Silber aussandtest, so gehen auch wir in Armut hinaus und vertrauen allein auf deine Vorsehung. Gewähre uns die Gnade, dein Evangelium in Einfachheit und Wahrheit zu verkünden.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Historischer Hintergrund für Pax et Bonum','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_greek_desc: "Nach dem Beispiel Christi, der keinen Ort hatte, an den er sein Haupt betten konnte, nehmen die Bettelprediger freiwillige Armut an. Nichts für den Weg mitnehmend vertrauen sie auf Gottes Fürsorge, während sie das Evangelium verkünden.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Historischer Hintergrund für Ptōkhoì Kērykes','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_default_desc: "Religiöse Orden, die sich der Armut und der Predigt hingeben, ziehen ohne Besitz umher, um den Glauben zu verbreiten, und vertrauen für ihre täglichen Bedürfnisse auf die göttliche Vorsehung.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Historischer Hintergrund für Wanderprediger','tenet_mendicant_preachers_historical_desc')]"
 tenet_mendicant_preachers_historical_desc: "Bettelorden traten erstmalig im 13. Jahrhundert auf, als eine Antwort auf den Reichtum und die Weltlichkeit der etablierten Kirche.Das Zweite Konzil von Lyon 1274 erkannte vier wesentliche Bettelorden an: die Karmeliten, die Franziskaner von Franz von Assisi, die Dominikaner von Dominikus de Guzmán und die Augustiner.\n\nAnders als Klosterorden, die über gemeinsamen Besitz verfügten, befürworteten die Bettelgeschwister die persönliche und kollektive Armut und lebten fast ausschließlich von Spenden. Sie konzentrierten sich auf größere Siedlungen, predigten in Städten und betonten Bildung und Gelehrsamkeit. Das Bettelideal bezog sich direkt auf die Anweisungen Christi an die Apostel, nichts auf ihre Reise mitzunehmen (Matthäus 10,9-10)."
 # Pentarchy Tenet
 tenet_pentarchy_latin_name: "Quinque Sedes" # DO NOT TRANSLATE
 tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
 tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
 tenet_pentarchy_latin_desc: "Wo die Gläubigen sich in Christi Namen versammeln, da ist er mitten unter ihnen. Die fünf großen Sitze von Rom, Konstantinopel, Alexandria, Antiochia und Jerusalem stehen als Säulen der Kirche.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Historischer Hintergrund für Quinque Sedes','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_greek_desc: "Die Kirche wird von den fünf Patriarchaten geleitet, die in apostolischer Zeit gegründet wurden. Wo zwei oder drei in seinem Namen versammelt sind, da ist Christus gegenwärtig, und durch die Pentarchie wird seine Autorität in der ganzen Welt ausgeübt.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Historischer Hintergrund für Pentarkhía','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_default_desc: "Die Kirche als Ganzes wird von fünf alten patriarchalen Sitzen geleitet, von denen jeder Autorität über seine Region besitzt und die gemeinsam die Einheit durch eine konziliare Gemeinschaft bewahren.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Historischer Hintergrund für Pentarchie','tenet_pentarchy_historical_desc')]"
 tenet_pentarchy_historical_desc: "Die Pentarchie war das Modell der Kirchenregierung, das fünf große Patriarchalsitze anerkannte: Rom, Konstantinopel, Alexandria, Antiochia und Jerusalem. 451 wurde es auf dem Konzil von Chalcedon festgelegt, um die politische Bedeutung dieser Städte im Römischen Reich hervorzuheben. Jeder Patriarch hatte die Autorität über seine Region, und Streitigkeiten wurden durch ökumenische Konzile gelöst.\n\nDas System wurde von Rom nie gänzlich akzeptiert, weil die Stadt die päpstliche Vorherrschaft beanspruchte; die Belagerung Alexandrias im Jahr 641 erschütterte es und nach dem Großen Schisma 1054 schließlich brach es zusammen. Die östliche orthodoxe Christenheit ehrte weiterhin das pentarchische Ideal, indem neue Patriarchate in Russland, Serbien und andernorts etabliert wurden."
 # Unrelenting Faith Tenet
 tenet_unrelenting_faith_latin_name: "Fides Indefessa" # DO NOT TRANSLATE
 tenet_unrelenting_faith_greek_name: "Pístis Akatapónētos" # DO NOT TRANSLATE
 tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
 tenet_unrelenting_faith_latin_desc: "O Herr, stärke unseren Glauben, die Zuversicht dessen, was man erhofft, die Überzeugung von Dingen, die man nicht sieht. Lass uns fest stehen gegen alle Widerstände und niemals wanken in unserer Hingabe an dich.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Historischer Hintergrund für Fides Indefessa','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_greek_desc: "Der Glaube ist die Zuversicht dessen, was man erhofft, die Überzeugung von Dingen, die man nicht sieht. Durch unerschütterlichen Glauben überwinden die Gläubigen alle Prüfungen und Verfolgungen und stehen bis in den Tod fest.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Historischer Hintergrund für Pístis Akatapónētos','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_default_desc: "Ein Glaube, der durch Verfolgung, Not oder Zweifel nicht erschüttert werden kann. Die Gläubigen sind berufen, fest zu ihren Überzeugungen zu stehen, ungeachtet weltlicher Konsequenzen.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Historischer Hintergrund für Unaufhaltsamen Glauben','tenet_unrelenting_faith_historical_desc')]"
 tenet_unrelenting_faith_historical_desc: "Die Beispiele von Märtyrern und Bekennern dienten durch die gesamte christliche Geschichte hindurch als Vorbilder. Von den frühesten Verfolgungen unter Nero und Diokletian an und über spätere Prozesse bis hin zu den reisenden Missionaren, die wie etwa Adalbert von Prag bei dem Versuch starben, feindliche Völker zu bekehren, waren Christen gehalten, ihren Glauben bis in den Tod zu bewahren.\n\nDie Überzeugung, der Glaube müsse um jeden Preis verteidigt, beibehalten und verbreitet werden, inspirierte viele klösterliche Bewegungen und missionarische Unternehmungen. Die Geschichten von Heiligen, die wegen ihres Glaubens Folter und Hinrichtung erlitten, dienten dazu, die Entschlossenheit der Gläubigen zu stärken, und boten einen Weg der Erlösung an."
 # Miaphysitism tenet
 tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
 tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
 tenet_miaphysitism_default_name: "Miaphysitismus"
 tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
 tenet_miaphysitism_latin_desc: "Das Konzil von Ephesos war kein Latrocinium. Der Irrtum von Chalcedon muss korrigiert werden. Die göttliche und die menschliche Natur sind in der einen Person Christi ohne Vermischung, ohne Veränderung, ohne Teilung und ohne Trennung vereint.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Historischer Hintergrund für Miaphysitismus','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_greek_desc: "Das Konzil von Ephesos lag nicht falsch darin, Eutyches zu rehabilitieren und Flavian zu verurteilen. Christus besitzt eine einzige vereinte göttlich-menschliche Natur, ganz Gott und ganz Mensch, ohne Vermischung und ohne Trennung geeint.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Historischer Hintergrund für Miaphysitismós','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_default_desc: "Christus hat eine einzige geeinte Natur, die zugleich göttlich und menschlich ist, untrennbar vereint in der Menschwerdung.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Historischer Hintergrund für Miaphysitismus','tenet_miaphysitism_historical_desc')]"
 tenet_miaphysitism_historical_desc: "Vom griechischen Mia oder #weak eins#! und Physis oder #weak Natur#! herrührend bedeutet Miaphysitismus, dass in Christus die göttliche und die menschliche Natur vereint sind zu einer zusammengesetzten Natur ohne Verwirrung oder Trennung. Voran trieb diese Christologie Kyrill von Alexandria mit der Formel #weak mia physis tou theou logou sesarkōménē#! (eine fleischgewordene Natur des göttlichen Logos): Sie unterscheidet sich vom Monophysitismus durch den Erhalt der vollständigen Realität beider Naturen in der Einigkeit.\n\n451 wurde auf dem Konzil von Chalcedon diese Formel zugunsten des Dyophysitismus (oder zwei Naturen) verworfen und die orientalisch-orthodoxen Kirchen (die koptische, armenische, äthiopische und syrische) trennten sich von der byzantinischen Kirche und behielten ihre miaphysitische Theologie bis heute bei."
 doctrine_parameter_tenet_miaphysitism_honest_bonus: "[GetTrait('honest').GetName(GetNullCharacter)|U]e [characters|E]: #P +10 %#! Zuwachs an @piety_icon![piety|E], #P +10#! [clergy|E]-[opinion|E]"
 doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[GetTrait('deceitful').GetName(GetNullCharacter)|U]e [characters|E]: #N -10 %#! Zuwachs an @piety_icon![piety|E], #N -10#! [clergy|E]-[opinion|E]"
 doctrine_parameter_tenet_miaphysitism_open_confession: "[piety|E] [piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! pro Jahr, während Euer [liege|E] nicht Euren [Concept('faith', 'Glauben')|E] teilt"
 pam_miaphysitism_open_confession_toast_title: "$tenet_miaphysitism_default_name$"
 # Hesychasm tenet
 tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
 tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
 tenet_hesychasm_default_name: "Hesychasmus"
 tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
 tenet_hesychasm_latin_desc: "O Herr, gewähre uns die Gnade der heiligen Stille. Lass uns dich finden, der du im unzugänglichen Licht wohnst. Lehre uns, ohne Unterlass zu beten, damit unsere Herzen zu Tempeln deiner Gegenwart werden.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Historischer Hintergrund für Hesychasmus','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_greek_desc: "Herr Jesus Christus, Sohn Gottes, erbarme Dich meiner, eines Sünders. Durch die Stille von Leib und Geist, durch das unablässige Wiederholen des Herzensgebets, lass mich zur Theoria aufsteigen, zur Schau des ungeschaffenen göttlichen Lichts.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Historischer Hintergrund für Hēsykhasmós','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_default_desc: "Durch innere Stille, kontemplatives Gebet und die Wiederholung des Jesusgebets können die Gläubigen eine unmittelbare Gemeinschaft mit Gott erfahren und sein ungeschaffenes Licht schauen.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Historischer Hintergrund für Hesychasmus','tenet_hesychasm_historical_desc')]"
 tenet_hesychasm_historical_desc: "Hesychasmus, vom Griechischen #weak hēsykhía#!, meint Stille oder innere Ruhe und ist eine kontemplative Tradition in der östlichen Christenheit, die Herzensgebete betont und in den Praktiken der ägyptischen Wüstenväter des 4. Jahrhunderts fußt. Das wiederholte Jesusgebet (#weak Herr Jesus Christus, Sohn Gottes, hab Gnade mit mir, einem Sünder#!), das oft auf die eigene Atmung und den eigenen Herzschlag abgestimmt wurde, wurde zu seiner zentralen Praktik.\n\nIm 14. Jahrhundert verteidigte der heilige Gregorios Palamas die hesychastischen Mönche vom Berg Athos und ihre Visionen des ungeschaffenen Lichts von Tabor der Transfiguration gegen Anschuldigungen der Ketzerei durch Barlaam von Kalabrien. Die Konzile von Konstantinopel 1341 und 1351 verteidigten Palamas und etablierten den Hesychasmus als orthodoxe Doktrin."
 doctrine_parameter_tenet_hesychasm_meditation_bonus: "#P Erhöhte#! @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El] für das Treffen der [decision|E]: [GetDecisionWithKey('meditate_in_seclusion_decision').GetName]"
 doctrine_parameter_tenet_hesychasm_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! durch [clergy|E] dieses [rite|E] gewährt mehr @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_hesychasm_patient_bonus: "[GetTrait('honest').GetName(GetNullCharacter)|U]e [characters|E]: #P +10 %#! Zuwachs an @piety_icon![piety|E], #P +10#! @spiritual_fulfillment_icon! Zuwachs an [Concept('spiritual_fulfillment', 'spiritueller Erfüllung')|E]"
 doctrine_parameter_tenet_hesychasm_impatient_penalty: "[GetTrait('impatient').GetName(GetNullCharacter)|U]e [characters|E]: #N -10 %#! Zuwachs an @piety_icon![piety|E]"
 doctrine_parameter_tenet_hesychasm_prayer_of_the_heart: "[GetTrait('journaller').GetName(GetNullCharacter)]-, [GetTrait('contrite').GetName(GetNullCharacter)|l]e, [GetTrait('confider').GetName(GetNullCharacter)]s- und [GetTrait('flagellant').GetName(GetNullCharacter)]en-[characters|E]: #P +10 %#! Verlust von [stress|E], #P +5 %#! Zuwachs an @spiritual_fulfillment_icon![Concept('spiritual_fulfillment', 'spiritueller Erfüllung')|E]"
 doctrine_parameter_tenet_hesychasm_losing_stress_grants_piety: "Erhält @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El] nach dem Abstreifen einer Stufe [stress|E] (maximal einmal im Jahr)"
 pam_hesychasm_meditation_toast: "Durch Euren Grundsatz [GetTenetType('tenet_hesychasm').GetName(GetPlayer.GetRite)]: Bonus durch Meditation in der Stille des eigenen Zuhauses"
 pam_hesychasm_stillness_toast: "Durch Euren Grundsatz [GetTenetType('tenet_hesychasm').GetName(GetPlayer.GetRite)]: Stille des Herzens"
 hesychasm_anachoresis_mortification_exclusivity_desc: "Charaktere können nur einen dieser [core_tenets|E] zur Zeit haben: [GetTenetType('tenet_hesychasm').GetName(GetPlayer.GetPlayer.GetRite)], [GetTenetType('tenet_anachoresis').GetName(GetPlayer.GetPlayer.GetRite)], [GetTenetType('tenet_mortification_of_the_flesh').GetName(GetPlayer.GetRite)], [GetTenetType('tenet_asceticism').GetName(GetPlayer.GetRite)]"
 # Anachoresis tenet
 tenet_anachoresis_latin_name: "Vita Eremitica" # DO NOT TRANSLATE
 tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
 tenet_anachoresis_default_name: "Anachorese"
 tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
 tenet_anachoresis_latin_desc: "O Herr, wie du deinen Sohn in die Wüste führtest, um ihn auf seinen Dienst vorzubereiten, so führe auch uns in die Wüste unseres Herzens. In Einsamkeit und Stille lass uns den Ablenkungen der Welt entfliehen und dich allein finden.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Historischer Hintergrund für Vita Eremitica','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_greek_desc: "Selig sind jene, die sich von der Welt zurückziehen, denn sie werden Gott in der Stille der Wüste finden. Wie die Propheten in Höhlen und Erdspalten wohnten, so suchen auch die Diener Christi die Einsamkeit, um den Kampf gegen die Leidenschaften zu führen.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Historischer Hintergrund für Anakhōrēsis','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_default_desc: "Durch den Rückzug aus der weltlichen Gesellschaft in die Wüste können die Gläubigen geistliche Reinheit erlangen, ihre Leidenschaften überwinden und Gott durch einsames Gebet und asketische Disziplin näherkommen.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Historischer Hintergrund für Anachorese','tenet_anachoresis_historical_desc')]"
 tenet_anachoresis_historical_desc: "Anachorese, vom griechischen #weak anakhorēsis#! (Rückzug) abgeleitet, bezeichnet die Lebensweise von Eremiten, die sich aus der Gesellschaft in die Wildnis zurückzogen, um ein Leben des Gebets, des Fastens und des geistigen Kampfes gegen dämonische Mächte zu führen. Die Bewegung nahm ihren Anfang im Ägypten des 3. Jahrhunderts mit dem heiligen Paulus von Theben, der traditionell als erster christlicher Eremit gilt. Er floh um 250 vor der Christenverfolgung unter Kaiser Decius in die Wüste von Theben.\n\nAuch im weiteren Verlauf des Mittelalters waren Anachoreten verbreitet: Sie lebten in abgeschiedenen, an Klöster angegliederten Zellen und empfingen die Eucharistie durch ein kleines Fenster, das sogenannte „Hagioskop“. Anleitungen wie die englische „Ancrene Wisse“ aus dem 13. Jahrhundert legten die Regeln für diese männlichen und weiblichen Klausner fest."
 doctrine_parameter_tenet_anachoresis_mystic_trait: "Erhält die [trait|E]: [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)]"
 doctrine_parameter_tenet_anachoresis_meditation_bonus: "#P Erhöhte#! @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El] für das Treffen der [decision|E] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName] abseits Eures [Concept('capital', 'Hauptsitzes')|E]"
 religious_decision.0211_anachoresis_tt: "#EMP Aufgrund Eures [Concept('personal_tenet', 'persönlichen Grundsatzes')|E] der [GetTenetType('tenet_anachoresis').GetName(GetPlayer.GetRite)]:#!"
 doctrine_parameter_tenet_anachoresis_always_cave_hermit: "Schaltet folgende [court_position|E] frei: [GetCourtPositionType('cave_hermit_court_position').GetName()]"
 tenet_anachoresis_always_cave_hermit_name: "das [court_position|E] [GetCourtPositionType('cave_hermit_court_position').GetName()]"
 pam_anachoresis_meditation_toast: "Durch Eure [GetTenetType('tenet_anachoresis').GetName(GetPlayer.GetRite)]: Bonus durch Meditation in Abgeschiedenheit"
 pam_anachoresis_tenet_title: "[core_tenet|E] „$tenet_anachoresis_default_name$“"
 # Mortification of the Flesh tenet
 tenet_mortification_of_the_flesh_latin_name: "Mortificatio Carnis" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós" # DO NOT TRANSLATE
 tenet_mortification_of_the_flesh_default_name: "Kasteiung des Fleisches"
 tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
 tenet_mortification_of_the_flesh_latin_desc: "O Herr, gewähre uns die Gnade, unser Fleisch mit seinen Leidenschaften und Begierden zu kreuzigen. Durch heiliges Leiden lass uns Anteil haben am Leiden Christi und die Werke des Leibes abtöten, damit wir wahrhaft leben.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Historischer Hintergrund für Mortificatio Carnis','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_greek_desc: "Durch Fasten, Nachtwachen und leibliche Kasteiung zügeln die Diener Gottes das Fleisch und unterwerfen es, damit der Geist sich zum Himmel erheben kann.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Historischer Hintergrund für Nékrōsis tẽs Sarkós','tenet_mortification_of_the_flesh_historical_desc')]"
 tenet_mortification_of_the_flesh_default_desc: "Die Gläubigen kasteien das Fleisch und seine sündigen Begierden und nehmen Anteil am Leiden Christi, um die Seele zu reinigen und geistliche Vollkommenheit zu erlangen.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Historischer Hintergrund für Kasteiung des Fleisches','tenet_mortification_of_the_flesh_historical_desc')]"
 doctrine_parameter_tenet_mortification_scars_are_holy: "Die [trait|E] [GetTrait('scarred').GetName(GetNullCharacter)|U] gewährt @piety_icon![piety|E] und [opinion|E] bei den Gläubigen"
 doctrine_parameter_tenet_mortification_revel_bonus: "@spiritual_fulfillment_icon!Zuwachs an [Concept('spiritual_fulfillment', 'spiritueller Erfüllung')|E] und Erhalt der [GetTrait('flagellant').GetName(GetNullCharacter)]en-[trait|E], wenn Ihr die [decision|E] [GetDecisionWithKey('stress_loss_flagellant_decision').GetName] trefft"
 doctrine_parameter_tenet_mortification_holy_scars: "Erhaltet die [trait|E] „[GetTrait('scarred').GetName(GetNullCharacter)]“ bei Annahme dieses [Concept('personal_tenet', 'persönlichen Grundsatzes')|E]"
 doctrine_parameter_tenet_mortification_suffering_sanctifies: "Erhaltet @piety_icon![piety|E] und verliert [stress|E], jedes Mal, wenn Ihr eine Wunde habt"
 doctrine_parameter_tenet_mortification_mortify_flesh: "Kann die folgende [decision|E] treffen: [GetDecisionWithKey('stress_loss_flagellant_decision').GetName]"
 pam_mortification_revel_toast: "[personal_tenet|E] [GetTenetType('tenet_mortification_of_the_flesh').GetName(GetPlayer.GetRite)]"
 pam_mortification_flagellant_gain_toast: "Durch [GetTenetType('tenet_mortification_of_the_flesh').GetName(GetPlayer.GetRite)] von Euch: Ihr habt den Weg als [GetTrait('flagellant').GetName(GetPlayer.Self)|E] eingeschlagen"
 pam_mortification_holy_scars_toast: "Durch Eure [GetTenetType('tenet_mortification_of_the_flesh').GetName(GetPlayer.GetRite)]: Die Geißel hinterlässt heilige Narben auf Eurem Fleisch"
 pam_mortification_suffering_sanctifies_toast: "Durch Eure [GetTenetType('tenet_mortification_of_the_flesh').GetName(GetPlayer.GetRite)]: Ihr opfert das Leiden des Fleisches Gott"
 tenet_mortification_of_the_flesh_historical_desc: "Die Selbstkasteiung, die auf Paulus’ Aufruf zurückgeht, #weak die Werke des Leibes zu töten#! (Römer 8,13) und #weak den Leib zu bestrafen und zu unterwerfen#! (1. Korinther 9,27), war von den frühesten Jahrhunderten an ein zentraler Bestandteil der christlichen Askese. Ihre extremsten Vertreter waren die Säulenheiligen: St. Simeon der Ältere verbrachte 37 Jahre auf einer Säule nahe Aleppo im unaufhörlichen Gebet, trotz sengender Hitze und eisiger Kälte.\n\nDie Selbstgeißelung verbreitete sich im mittelalterlichen westlichen Christentum und wurde unter dem Klerus von Petrus Damiani (1007–1072) gefördert. Die Flagellantenbewegung des 13. und 14. Jahrhunderts sah Laien in Prozessionen durch Städte ziehen und sich in Zeiten von Seuchen und Katastrophen als Buße geißeln."
 # Holy Myron tenet
 tenet_holy_myron_ethiopic_name: "Qeddus Meron" # DO NOT TRANSLATE
 tenet_holy_myron_latin_name: "Sanctum Chrisma" # DO NOT TRANSLATE
 tenet_holy_myron_greek_name: "Hágion Mýron" # DO NOT TRANSLATE
 tenet_holy_myron_default_name: "Heiliges Myron"
 tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
 tenet_holy_myron_ethiopic_desc: "Durch das heilige Myron, das vom Abuna geweiht wurde, empfangen die Gläubigen das Siegel des Heiligen Geistes. Wie die Taube bei der Taufe Christi im Jordan auf ihn herabkam, so kommt auch der Geist durch diese heilige Salbung auf die Neugetauften herab und zeichnet sie als Kinder Gottes.\n\n$pam_john_3_5_default$\n\n[Glossary('Historischer Hintergrund für Qeddus Meron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_latin_desc: "Durch das heilige Chrisam, das vom Bischof geweiht wurde, empfangen die Gläubigen das Siegel der Gabe des Heiligen Geistes. Die Salbung vollendet die Gnade der Taufe.\n\n$pam_john_3_5_latin$\n\n[Glossary('Historischer Hintergrund für Sanctum Chrisma','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_greek_desc: "Das heilige Myron, das vom Patriarchen geweiht wurde, ist das Siegel der Gabe des Heiligen Geistes. Durch diese heilige Salbung empfangen die Neu-Erleuchteten die Fülle der Gnadengaben des Geistes und werden zu Tempeln des lebendigen Gottes.\n\n$pam_john_3_5_greek$\n\n[Glossary('Historischer Hintergrund für Hágion Mýron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_default_desc: "Das heilige Myron oder heilige Chrisam ist ein besonders geweihtes Öl, das man beim Sakrament der Firmung nutzt, um die Neugetauften mit der Gabe des Heiligen Geistes zu besiegeln und ihre Eingliederung in die Kirche zu vollenden.\n\n$pam_john_3_5_default$\n\n[Glossary('Historischer Hintergrund für Heiliges Myron','tenet_holy_myron_historical_desc')]"
 tenet_holy_myron_historical_desc: "Heiliges Myron, vom griechischen Wort #weak mýron#! für duftendes Öl, wird im Sakrament der Chrisamsalbung, der Firmung , verwendet. Im Osten folgt es unmittelbar auf die Taufe, auch bei Säuglingen; im Westen wird es separat von einem Bischof gespendet. Die Salbung hat tiefe biblische Wurzeln: Sowohl #weak Christus#! als auch #weak Messias#! bedeuten #weak der Gesalbte#!.\n\nDie Weihe von neuem Myron ist ein seltenes und feierliches Ereignis: Ein Teil der vorherigen Charge wird stets der neuen beigemischt – eine ununterbrochene Kette, die sich bis zu den Aposteln zurückverfolgen lässt. Die äthiopische Tradition besagt, dass das Rezept für #weak Meron#! von den Neun Heiligen, syrischen Missionaren des 5. Jahrhunderts, eingeführt wurde und die Weihe dem Patriarchen (Abuna) vorbehalten ist."
 doctrine_parameter_tenet_holy_myron_artifact: "Kann den [court_chaplain|E] über die [decision|E] [GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName] entsenden, um ein #V Heiliges Myron#!-[artifact|E] zu erschaffen; seine Portionen werden verbraucht, um [artifacts|E] zu segnen[AddLocalizationIf(HasDlcFeature('coronations'), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf(HasDlcFeature('legends_of_the_dead'), 'pam_holy_myron_param_funeral_append')]"
 pam_holy_myron_param_coronation_append: "sowie Eure [coronation|E]"
 pam_holy_myron_param_funeral_append: "sowie die Toten bei [funerals|E]"
 doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Kann Portionen Eures #V Heiligen Myron#!-[Concept('artifact', 'Artefakts')|E] an andere Herrscher verschenken, was @piety_icon![piety|E] und [opinion|E] einbringt"
 doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Eure neugeborenen Kinder erhalten für #V 16#! Jahre den [modifier|E]: [GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip]; eine Ladung des #V Heiligen Myron#!-[Concept('artifact', 'Artefakts')|E] gewährt dauerhaft den [modifier|E]: [GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_holy_myron_unction_bonus: "Im [Concept('ill', 'Krankheitsfall')|E]: @spiritual_fulfillment_icon!Zuwachs an [Concept('spiritual_fulfillment', 'spiritueller Erfüllung')|E], Verlust von [stress|E] und für #V 2#! Jahre den [modifier|E]: [GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip]"
 # Khachkar tenet
 tenet_khachkar_armenian_name: "Chatschkar" # DO NOT TRANSLATE
 tenet_khachkar_latin_name: "Crux Lapidea" # DO NOT TRANSLATE
 tenet_khachkar_greek_name: "Líthinos Staurós" # DO NOT TRANSLATE
 tenet_khachkar_default_name: "Chatschkare"
 tenet_khachkar_name: "$tenet_khachkar_default_name$"
 tenet_khachkar_armenian_desc: "Die Chatschkare stehen als ewige Zeugen unseres Glaubens. Mit kunstvollen Darstellungen von Kreuzen, Ranken und heiligen Symbolen versehen ist jeder Chatschkar ein Gebet in Stein, das das Kreuz verherrlicht, durch das die Welt gerettet wurde.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Historischer Hintergrund für Chatschkar','tenet_khachkar_historical_desc')]"
 tenet_khachkar_latin_desc: "Wie die Armenier ihre steinernen Kreuze zum Himmel erheben, so wollen wir diese Erde mit den Zeichen des Heils, dem Kreuz unseres Herrn Jesus Christus, versehen.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Historischer Hintergrund für Crux Lapidea','tenet_khachkar_historical_desc')]"
 tenet_khachkar_greek_desc: "Steinerne Denkmäler, in die heilige Symbole gemeißelt sind, legen Zeugnis von Christi Sieg ab und stehen als ewige Gedenkstätten für die Gläubigen.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Historischer Hintergrund für Líthinos Staurós','tenet_khachkar_historical_desc')]"
 tenet_khachkar_default_desc: "Steinerne Kreuze, in die kunstvolle religiöse Darstellungen gemeißelt sind, dienen als heilige Denkmäler zur Markierung heiliger Stätten, zur Erinnerung an die Verstorbenen und zur Feier der göttlichen Vorsehung.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Historischer Hintergrund für Chatschkare','tenet_khachkar_historical_desc')]"
 tenet_khachkar_historical_desc: "Chatschkare – vom Armenischen #weak khach#! (Kreuz) und #weak k’ar#! (Stein) – sind kunstvoll behauene Steinstelen mit einem Kreuz, das oft auf eine Rosette oder ein Ewigkeitsrad aufgesetzt ist. Sie sind einzigartig für die armenisch-christliche Kultur und markieren heilige Stätten, wichtige Ereignisse und Siege. Zugleich dienen sie als Denkmale für die Verstorbenen.\n\nDie Tradition entstand ab dem 9. Jahrhundert, wobei man auf die frühen Holzkreuze aufbaute, die Sankt Gregor der Erleuchter nach der Bekehrung Armeniens im Jahr 301 über heidnischen Tempeln errichtete. Ihren Höhepunkt erreichte die Tradition im 12. und 13. Jahrhundert unter den Zakaridenfürsten. Jedes von ihnen ist das einzigartige Werk von Meistersteinmetzen wie Momik von Noravank, und manchen spricht man wundersame Kräfte zu, weshalb sie zu Pilgerstätten wurden."
