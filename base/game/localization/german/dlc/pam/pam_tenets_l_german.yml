 tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
 tenet_peace_of_god_irish_desc: "Dieses auch als das Gesetz der Unschuldigen bekannte Regelwerk diente der Sicherheit von Zivilisten im Krieg. Missetäter wie auch Schaulustige, die nichts unternahmen, um Verbrechen zu verhindern, unterlagen weltlichen Geldstrafen und rituellen Flüchen.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Historischer Hintergrund für Cáin Adomnáin','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_latin_desc: "Waffenstillstände sind vom Advent bis zur Oktav der Erscheinung des Herrn unverletzlich einzuhalten. Wenn jemand versucht, den Waffenstillstand zu brechen, möge sein Bischof die Strafe der Exkommunikation verkünden.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Historischer Hintergrund für Pax et Treuga Dei','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_greek_desc: "Zöglinge Christi, die alles unternahmen, um Frieden zu erreichen, sollen als Gestalter des Friedens wirken. Denn wer Frieden sucht, sucht Christus. Ohne Nächstenliebe, ohne eine friedliche Haltung allen Menschen gegenüber, kann niemand ein wahrer Diener Christi sein.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Historischer Hintergrund für Ekekheiría Theoũ','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "Sinnlose Gewalt gegenüber unseren Brüdern und Schwestern sind ein Angriff auf Gott.\n\n[Glossary('Historischer Hintergrund für Gottesfrieden','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "Während des Mittelalters versuchten verschiedene christliche Bewegungen, das Blutvergießen einzuschränken, auch in der Hoffnung, es durch formelle Gefechtsregeln eingrenzen zu können. Vom irischen Cáin Adomnáin im 7. Jahrhundert bis zur Gottesfriedensbewegung im Frankreich des 10. Jahrhunderts konzentrierten sich diese Bemühungen darauf, Kirchengut und Kirchenangehörige zu schützen, Gewalt gegenüber Zivilisten einzudämmen und Krieg zwischen Adligen auf bestimmte Zeiten und Orte zu beschränken.\n\nDiese Regeln weitete man häufig auch auf Ungläubige aus. Canon XXI. des Dritten Laterankonzils im Jahr 1179 weitete zeitweilige Waffenstillstände auf die gesamte Christenheit aus, wohingegen Canon XXVII. dazu aufrief, die Waffen gegen Kartharer, Basken und andere Ketzer zu erheben."
 doctrine_parameter_tenet_peace_of_god_same_faith_war_piety_penalty: "Einem [ruler|E] desselben [Concept('faith', 'Glaubens')|E] den [war|E] zu erklären, kostet @piety_icon![piety|E]"
 doctrine_parameter_tenet_peace_of_god_coreligionist_war_reluctance: "[GetTrait('zealous').GetName(GetNullCharacter)|U]e [rulers|E] erklären viel seltener innerhalb desselben [Concept('faith', 'Glaubens')|E] den [war|E]"
 doctrine_parameter_tenet_peace_of_god_holy_war_call_reluctance: "[rulers|E] dieses [rite|E] werden sehr viel unwahrscheinlicher auf die [interaction|E] #high $ecclesiastic_incite_holy_war_interaction$#! antworten"
 doctrine_parameter_tenet_peace_of_god_cheaper_truce_purchase: "Die [interaction|E] #high $purchase_truce_interaction$#! kostet #P 50 %#! weniger und wird wahrscheinlich angenommmen"
 doctrine_parameter_tenet_peace_of_god_raid_ban: "Kann nicht [Concept('raid', 'überfallen')|E]"
 doctrine_parameter_tenet_peace_of_god_at_peace_yearly_effects: "Je #V 5 Jahre#! [Concept('peace','Frieden')|E] gewähren [Concept('rulers','Herrschern')|E] eine Belohnung, meistens @legitimacy_icon![legitimacy|E]"
 doctrine_parameter_tenet_peace_of_god_personal_yearly_effects: "Je #V 5 Jahre#! [Concept('peace','Frieden')|E] gewähren #P 1#! zufälligen [Concept('skill', 'Werte')|E]-Punkt"
 doctrine_parameter_tenet_peace_of_god_excommunication: "Hauptverteidiger bezahlen keine @piety_icon![piety|E] für das [excommunicate|EU] von Angreifern desselben [Concept('faith', 'Glaubens')|E]"
 doctrine_parameter_tenet_peace_of_god_excommunication_truce: "Einen [truce|E] im [Concept('faith', 'Glauben')|E] zu brechen, führt zu einer direkten [excommunication|E]"
 doctrine_parameter_tenet_peace_of_god_clergy_peacemaking: "Der [clergy|E] legt Streitigkeiten über Landbesitz und Titel weit leichter bei und verlangt #P 25 %#! weniger @piety_icon![piety|E], @gold_icon![gold|E] und @prestige_icon![prestige|E]"
 pam_peace_of_god_tenet_title: "$tenet_peace_of_god_default_name$: Ihr hattet Frieden"
 # Dulia tenet
 tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
 tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
 tenet_dulia_default_name: "Heiligenverehrung"
 tenet_dulia_name: "$tenet_dulia_default_name$"
 tenet_dulia_latin_desc: "Jene, die den Herrn zu ihrem Felsen erwählt haben, sind zu verehren. Heilig ist ihr ewiger Leib, heilig seine Reliquien und heilig ihr Andenken.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Historischer Hintergrund für Dulia','tenet_dulia_historical_desc')]"
 tenet_dulia_greek_desc: "Von den Hierokonfessoren und Myrrhenträgern bis hin zu den Narren um Christi willen ehrte die Kirche jene, die außergewöhnliche Hingabe an Gott zeigten, mit einem besonderen Titel und einer Gedenkfeier an einem bestimmten Tag des liturgischen Kalenders.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Historischer Hintergrund für Hagiokatátaxis','tenet_dulia_historical_desc')]"
 tenet_dulia_default_desc: "Alle, die die Fürsprache der Heiligen suchen, sollen ihnen mit Ehrfurcht und Andacht nahen.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Historischer Hintergrund für Verehrung der Heiligen','tenet_dulia_historical_desc')]"
 tenet_dulia_historical_desc: "Im frühem Christentum wurden Märtyrer, also jene, die für den Glauben in den Tod gegangen waren, verehrt und ihre Reliquien als heilige Objekte aufbewahrt. Ab dem 4. Jahrhundert geehrte man auch Bekenner, also solche, die sich durch Worte und Taten zu ihrem Glauben bekannt hatten, nicht aber durch den Tod.\n\nUrsprünglich gewährte man die Anerkennung ihres Status nach einer Untersuchung zu ihrem Leben und ihren Wundertaten durch einen örtlichen Bischof. Der heilige Ulrich, Bischof von Augsburg und 993 durch Papst Johannes XV. bestätigt, war der erste Heilige außerhalb Roms, der eine päpstliche Heiligsprechung erhielt. Ein Dekret Papst Alexanders III. aus dem Jahr 1170 schließlich übertrug das Vorrecht der Heiligsprechung ausschließlich auf den Papst."
 doctrine_parameter_tenet_dulia_cheaper_saint_costs: "Die [decisions|E] „[GetDecisionWithKey('pam_canonize_saint_decision').GetName]“ und „[GetDecisionWithKey('pam_extract_relic_decision').GetName]“ kosten #P 15 %#! weniger @piety_icon![piety|E] und @gold_icon![gold|E]"
 doctrine_parameter_tenet_dulia_extra_relic_modifier: "[artifacts|E] aus der [decision|E] „[GetDecisionWithKey('pam_extract_relic_decision').GetName]“ haben #P 1#! zusätzlichen zufälligen Segen"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics: "Die [decision|E] „[GetDecisionWithKey('pam_extract_relic_decision').GetName]“ bei einem [dynasty|E]-Mitglied gewährt #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! [dynasty_prestige|E]"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Einen Heiligen heiligzusprechen, gewährt jedem [ruler|E] des [Concept('faith', 'Glaubens')|E] für #EMP 5#! Jahre: $pam_dulia_new_saint_modifier$"
 # Transubstantiation tenet
 tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
 tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
 tenet_transubstantiation_default_name: "Transsubstantiation"
 tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
 tenet_transubstantiation_latin_desc: "Im Sakrament der Eucharistie jedoch endet die Konsekration des Brotes nicht im Nichts, sondern im Leib Christi. Andernfalls gäbe es keine Erklärung dafür, wie der Leib Christi im Sakrament zu existieren beginnt. Denn er beginnt dort nicht durch eine örtliche Bewegung zu existieren, da er sonst im Himmel aufhören würde zu existieren.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Historischer Hintergrund für Transubstantiatio','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_greek_desc: "Doch er ist wahrhaft und wirklich gegenwärtig, sodass nach der Konsekration von Brot und Wein das Brot in den wahren Leib des Herrn selbst verwandelt, transsubstanziiert, umgewandelt und umgeformt wird.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Historischer Hintergrund für Metousíōsis','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_default_desc: "Vor der Konsekration hat es einen anderen Namen, danach wird es Blut genannt. Und Ihr sagt, Amen, das heißt: Es ist wahr.\n\n$pam_luke_22_19_default$\n\n[Glossary('Historischer Hintergrund für Transubstantiation','tenet_transubstantiation_historical_desc')]"
 tenet_transubstantiation_historical_desc: "Das Wesen der Gegenwart Christi in der Eucharistie ist seit der frühen Kirche Gegenstand theologischer Debatten. Obgleich die Göttlichkeit von Brot und Wein als Leib und Blut Christi nur selten bestritten wurde, war ihr genaues Wesen Anlass mannigfaltiger Debatten, Sekten und Schismen. Die katholische Auslegung wurde im 13. Jahrhundert durch Thomas von Aquin weiterentwickelt. 1215 wurde sie offiziell durch das Vierte Laterankonzil ausgestaltet. Während der Messe verwandeln sich Brot und Wein in den Leib und das Blut Christi, während die Akzidentien (Erscheinungsformen) von Brot und Wein erhalten bleiben."
 doctrine_parameter_tenet_transubstantiation_faster_bishop_claims: "Tempo für „[fabricate_claim|E]“: #p +20%#!"
 FABRICATE_CLAIM_TRANSUBSTANTIATION_BONUS: "$tenet_transubstantiation_default_name$"
 # Ora et labora tenet
 tenet_ora_et_labora_latin_name: "Ora et Labora"
 tenet_ora_et_labora_greek_name: "Akoímētoi"
 tenet_ora_et_labora_default_name: "Arbeiten heißt beten"
 tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
 tenet_ora_et_labora_latin_desc: "Sei gehorsam gegenüber deinem Oberen. Sei geduldig in der Not. Nimm die niedrigsten Aufgaben an und halte dich selbst für einen unwürdigen Arbeiter.\n#weak Kapitel VII der Benediktsregel#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Historischer Hintergrund für Ora et Labora','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_greek_desc: "Tag und Nacht und ohne Unterbrechung müssen Mönche den Gottesdienst feiern. Ihr Wechselgesang und ihre endlosen Psalmen verherrlichen ihren Orden und Gott.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Historischer Hintergrund für Akoímētoi','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_default_desc: "Arbeiten heißt beten und beten heißt arbeiten. Müßiggang ist der Feind der Seele, daher muss ein jeder tüchtig in sowohl Gedanken als auch Taten bleiben.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('Historical Background für Arbeiten heißt beten','tenet_ora_et_labora_historical_desc')]"
 tenet_ora_et_labora_historical_desc: "Das Motto #weak Ora et labora#!, das ursprünglich aus der Benediktsregel stammt, beschreibt das klösterliche Ideal von Gebet und Arbeit. Von Mönchen wurde erwartet, dass sie täglich eine bestimmte Anzahl an Stunden dem gemeinschaftlichen Gebet, persönlicher Versenkung und körperlicher Arbeit widmeten. Diese Balance erachtete man als wesentlich für geistiges Wachstum und Disziplin. Die Benediktinerklöster wurden damit zu Zentren der Bildung, der Landwirtschaft und der Handwerkskunst und trugen erheblich zum kulturellen und wirtschaftlichen Leben im Europa des Mittelalters bei."
 # Hyperdulia tenet
 tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
 tenet_hyperdulia_greek_name: "Theotókos" # DO NOT TRANSLATE
 tenet_hyperdulia_default_name: "Mutter Gottes"
 tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
 tenet_hyperdulia_latin_desc: "Unter deinen Schutz und Schirm fliehen wir, o heilige Gottesgebärerin. Verschmähe nicht unser Gebet in unsern Nöten, sondern erlöse uns jederzeit von allen Gefahren, o du glorreiche und gebenedeite Jungfrau.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Historischer Hintergrund für Hyperdulia','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_greek_desc: "Nimm unsere Gebete an und bringe sie deinem Sohn und unserem Gott dar, damit er um deinetwillen unsere Seelen erleuchte und rette. Allheilige Gottesgebärerin, rette uns!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Historischer Hintergrund für Theotókos','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_default_desc: "Gebenedeite Jungfrau Maria, Gottesmutter, Mutter der Barmherzigkeit, Madonna.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Historischer Hintergrund für die Mutter Gottes','tenet_hyperdulia_historical_desc')]"
 tenet_hyperdulia_historical_desc: "Seit den frühesten Tagen des Christentums hat Maria, die Mutter Jesu, einen besonderen Platz der Ehrerbietung und der Verehrung inne. Im Jahr 431 bestätigte das Konzil von Ephesos ihren Titel als Theotokos oder #weak Gottgebärerin#!, während es gleichzeitig die nestorianische Bevorzugung des Titels Christotokos oder #weak Christusgebärerin#! verdammte. Im 8. Jahrhundert schrieb der heilige Johannes von Damaskus, dass Maria aufgrund ihrer einzigartigen Rolle in der Heilsgeschichte über allen anderen Heiligen stehe. Über die Jahrhunderte hinweg entstanden verschiedene Doktrinen zu Maria wie etwa ihre Unbefleckte Empfängnis und ihre Himmelfahrt, die die christlichen Kirchen verbindlich festlegten."
 doctrine_parameter_tenet_hyperdulia_female_claims_are_strong: "Die [claims|E] von Frauen werden nicht mehr durch [gender_laws|E] geschwächt"
 doctrine_parameter_tenet_hyperdulia_female_preference_law: "Ermöglicht [laws|E]: [GetLaw('female_preference_law').GetName]-Nachfolge"
 # Simony tenet
 tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
 tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
 tenet_simony_default_name: "Simonie"
 tenet_simony_name: "$tenet_simony_default_name$"
 tenet_simony_latin_desc: "Gott schuf das Gold unter der Erde, die er uns gab, als Gunst für seine Auserwählten.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Historischer Hintergrund für Simonia','tenet_simony_historical_desc')]"
 tenet_simony_greek_desc: "Gott schuf das Gold unter der Erde, die er uns gab, als Gunst für seine Auserwählten.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Historisscher Hintergrund für Simōnía','tenet_simony_historical_desc')]"
 tenet_simony_default_desc: "Gott schuf das Gold unter der Erde, die er uns gab, als Gunst für seine Auserwählten.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Historischer Hintergrund für Simonie','tenet_simony_historical_desc')]"
 tenet_simony_historical_desc: "Die Praxis des Verkaufs von Kirchenämtern, Reliquien und religiösen Handlungen. Benannt nach Simon Magus, einem Samariter, der die Leute #weak verhexte#! und den Aposteln Geld für die Taufe anbot.\n\nMehrere Synoden von der Synode von Elvira im Jahr 305 bis zum Konzil von Trient 1545 verurteilten die Simonie aufs Schärfste und belegten sie mit den stärksten geistlichen und Laienstrafen. Wenn eine Handlung so oft und über so viele Jahrhunderte hinweg verurteilt wird, bedeutet dies zugleich, dass sie äußerst üblich war. Auch in den 95 Thesen Martin Luthers und in Dantes Göttlicher Komödie im Lied 19 wird sie kritisiert: #weak O Zaubrer Simon, o ihr schmachbeladnen Nachfolger, die die heil’gen Dinge, welche der Tugend sich allein vermählen sollten, um Gold und Silber räub’risch ihr verkuppelt!#!"
 doctrine_parameter_tenet_tax_increase_per_piety_level: "[castle_holdings|E] und [church_holdings|E]: [tax|E] je @piety_icon![Concept('piety', 'Frömmigkeits')|E]-Stufe: #P +0,1 [gold_i]#!"
 doctrine_parameter_tenet_simony_paid_vows: "Kann @gold_icon![gold|E] bezahlen, um die Akzeptanz der [character_interaction|E] #high $take_monastic_vows_interaction$#! zu garantieren"
 doctrine_parameter_tenet_simony_ecclesiastical_purchase: "Kann @gold_icon![gold|E] für Kirchen-[titles|E] mit der [interaction|E] #high $buy_ecclesiastical_title_interaction$#! bezahlen"
 tenet_simony_ecclesiastical_purchase_name: "die [interaction|E] #high $buy_ecclesiastical_title_interaction$#!"
 doctrine_parameter_tenet_simony_gold_donations: "@gold_icon![gold|E]-Spenden sind #P x5#! so überzeugend, wenn sie sich an den [clergy|E] richten"
 doctrine_parameter_tenet_simony_wealth_fulfillment: "Jährliche Chance von #P 25 %#! bis #P 75 %#! (bei Reichtum wahrscheinlicher) auf #P +[EmptyScope.ScriptValue('minor_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_simony_venal_head_of_faith: "Das [head_of_faith|E] akzeptiert immer @gold_icon![gold|E], das für die Aufhebung einer [excommunication|E] angeboten wird"
 doctrine_parameter_tenet_simony_personal_gifts: "Geschenke verringern [stress|E], gewähren etwas @spiritual_fulfillment_icon![spiritual_fulfillment|El] und führen zu doppelt so viel [opinion|E]"
 pam_simony_tenet_msg_title: "$tenet_simony_default_name$"
 pam_personal_syncretism_county_modifier: "Einladender Synkretismus"
 pam_personal_syncretism_county_modifier_desc: "Die einheimische Bevölkerung respektiert die persönlichen synkretischen Traditionen des Herrschers und gedeiht unter ihrer Herrschaft."
 # Monophysitism tenet
 tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
 tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
 tenet_monophysitism_default_name: "Monophysitismus"
 tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
 tenet_monophysitism_latin_desc: "Der Sohn ist einer und seine Natur ist eine, auch wenn er als jener aufgefasst wird, der Fleisch mit einer vernunftbegabten Seele annahm.\n\n$pam_john_1_1_latin$\n\n[Glossary('Historischer Hintergrund für Monophysitismus','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_greek_desc: "Eine Physis des fleischgewordenen Wortes.\n\n$pam_john_1_1_greek$\n\n[Glossary('Historischer Hintergrund für Monophysitismós','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_default_desc: "Christus hat nur eine Natur, die gänzlich göttlich ist.\n\n$pam_john_1_1_default$\n\n[Glossary('Historischer Hintergrund für Monophysitismus','tenet_monophysitism_historical_desc')]"
 tenet_monophysitism_historical_desc: "Vom griechischen „monos“ für #weak einzig#! und „physis“ für #weak Natur#! herrührend besagt diese Lehre, dass Jesus Christus nur eine göttliche Natur besitzt: das fleischgewordene Wort Gottes. Obwohl der Monopyhsitismus 451 auf dem Konzil von Chalcedon verurteilt wurde, fand er dennoch Unterstützung durch Kaiser Basileios und erhielt Schutz unter Kaiser Justinian I. Dies führte zu Schismen, wie dem unter der Beteiligung der Autokephalen, die die Autorität des Patriarchen von Alexandria ablehnten, oder den Doketisten, die glaubten, die menschliche Gestalt Jesu sei nur ein Scheinleib."
 doctrine_parameter_tenet_monophysitism_theologian_bonus: "[GetTrait('theologian').GetName(GetNullCharacter)]n-[characters|E]: #P +10 %#! Zuwachs an @piety_icon![piety|E], #P +5#! Eiferer-[opinion|E], #P +10 %#! [lifestyle|E]-Erfahrung"
 doctrine_parameter_tenet_monophysitism_stubborn_bonus: "[GetTrait('stubborn').GetName(GetNullCharacter)|U]e [characters|E]: #P +10 %#! Zuwachs an @piety_icon![piety|E], #P +10#! [clergy|E]-[opinion|E]"
 doctrine_parameter_tenet_monophysitism_trusting_penalty: "[GetTrait('trusting').GetName(GetNullCharacter)|U]e [characters|E]: #N -10 %#! Zuwachs an @piety_icon![piety|E], #N -10#! [clergy|E]-[opinion|E]"
 doctrine_parameter_tenet_monophysitism_conversion_conviction: "Gegen andere [faiths|E] Eurer [religion|E]: [convert_county|E] #P +25 %#! schneller, #P +20#! höhere Wahrscheinlichkeit auf Annahme einer Bekehrung für [characters|E]"
 # Acts of Apostles tenet
 tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
 tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # DO NOT TRANSLATE
 tenet_acts_of_apostles_default_name: "Eifriger Proselytismus"
 tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
 tenet_acts_of_apostles_latin_desc: "So wie Mose vor dem Pharao stand und kühn Deinen Auftrag an ihn verkündete, so stehen unsere Missionare vor den Menschen.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Historischer Hintergrund für Actus Apostolorum','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_greek_desc: "Ich kehre zu Dir zurück, zu Deinem Volk, zu Deiner Gabe an mich. Lenke sie mit Deiner mächtigen rechten Hand und schütze sie unter dem Schatten Deiner Flügel.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Historischer Hintergrund für Práxeis tõn Apostólōn','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_default_desc: "Bringe himmlisches Licht zu denen in der Finsternis und Hoffnung zu denen in der Verzweiflung.\n\n$pam_acts_1_8_default$\n\n[Glossary('Historischer Hintergrund für eifrigen Proselytismus','tenet_acts_of_apostles_historical_desc')]"
 tenet_acts_of_apostles_historical_desc: "In den ersten Jahrhunderten nach Christus breitete sich das Christentum rasend schnell aus, was vor allem auf die missionarischen Anstrengungen der Apostel und ihrer frühen Zöglinge zurückging. Ihre Reisen führten sie quer durch das Römische Reich, wo sie christliche Gemeinden gründeten und Personen verschiedenster Herkunft bekehrten. Der missionarische Eifer speiste sich aus der tiefen Überzeugung der Heilsbotschaft Jesu Christi und ließ das Christentum von einer kleinen jüdischen Sekte zu einer bedeutenden Weltreligion anwachsen.\n\nIm Mittelalter wiederum unternahmen diverse spätere Heilige und Märtyrer Missionarsreisen in heidnische Gebiete und verbreiteten unermüdlich den christlichen Glauben."
 doctrine_parameter_tenet_acts_of_apostles_laamp_missionary_bonus: "Weniger Anforderungen für die [decision|E] „[GetDecisionWithKey('zealous_missionary_prep_decision').GetName]“, die von mehr [Concept('adventurers', 'Abenteurern')|E] gefällt wird"
 doctrine_parameter_tenet_acts_of_apostles_legitimacy_from_converts: "Einen [character|E] zu bekehren, gewährt #P 50#! @legitimacy_icon!. Wenn Euer [court_chaplain|E] eine [county|E] bekehrt, gewährt dies #P 100#! @legitimacy_icon! und #P 5#! @spiritual_fulfillment_icon!"
 doctrine_parameter_tenet_acts_of_apostles_fulfillment_from_converts: "Einen [character|E] zu bekehren, gewährt #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|El] oder #P 10#! für die Bekehrung eines landbesitzenden [Concept('ruler', 'Herrschers')|E]"
 doctrine_parameter_tenet_acts_of_apostles_head_of_rite_sway: "Euer [head_of_rite|E] erhält #P +25#! Akzeptanz, wenn [characters|E] zu diesem [rite|E] beeinflusst werden"
 doctrine_parameter_tenet_acts_of_apostles_conversion_learning: "Euer [Concept('learning', 'Bildungs')|E]-Vorteil zählt #P doppelt#!, wenn Ihr verlangt, dass [characters|E] konvertieren"
 doctrine_parameter_tenet_acts_of_apostles_piety_from_converts: "Einen [ruler|E] zu bekehren, gewährt #P 25#! bis #P 1.500#! @piety_icon![piety|E], was stark mit dem [title|E]-Rang skaliert"
 conversion_tenet_acts_of_the_apostles_effect_piety_tt: "Durch den Grundsatz [GetTenetType('tenet_acts_of_apostles').GetName(GetPlayer.GetRite)]"
 tenet_acts_of_apostles_toast_conversion_title: "$tenet_acts_of_apostles_default_name$"
 # Purgatory tenet
 tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
 tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
 tenet_purgatory_default_name: "Fegefeuer"
 tenet_purgatory_name: "$tenet_purgatory_default_name$"
 tenet_purgatory_latin_desc: "Viel größre Furcht indes hält meine Seele befangen vor der Qual im vor’gen Kreise und drücken fühl’ ich schon die Last dort unten.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Historischer Hintergrund für Purgatorium','tenet_purgatory_historical_desc')]"
 tenet_purgatory_greek_desc: "Und da die Menschen im Himmel ohne Leib sind, können sie nicht in der Theosis fortschreiten; unsere Gebete helfen ihnen daher, darin zu wachsen.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Historischer Hintergrund für Kathartērion','tenet_purgatory_historical_desc')]"
 tenet_purgatory_default_desc: "Die abschließende Läuterung jener, die im Stand der Gnade gestorben sind, sodass in ihnen nur die zur himmlischen Freude erforderliche Heiligkeit bleibt.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Historischer Hintergrund für Fegefeuer','tenet_purgatory_historical_desc')]"
 tenet_purgatory_historical_desc: "Obwohl die Vorstellung, dass Seelen einen Zwischenzustand erreichen und darauf warten, in den Himmel aufzusteigen, allgemein akzeptiert war, wurde die konkrete Natur dieses Zustands oft diskutiert. Ob es ein tatsächlicher Ort, ein Geisteszustand, eine simple Metapher oder eine körperliche Reinigung darstellte, unterschied sich von Theologe zu Theologe und von Glaubensgemeinschaft zu Glaubensgemeinschaft. Die heilige Katharina von Genua schrieb, es sei ein Zustand der Freude als auch der freiwilligen Schmerzen wegen der eigenen Sünden, wohingegen Origenes von Alexandria über Gott als ein verzehrendes Feuer schrieb.\n\nDie katholische Kirche formulierte die Lehre vom Fegefeuer in den Konzilen von Florenz (1439) und Trient (1545-63) offiziell und definierte es als einen zeitweiligen Zustand der Läuterung, ehe die Seele in den Himmel aufsteigt. Und sie legte fest, dass die Gebete und guten Taten der Lebenden den Seelen dort helfen können."
 doctrine_parameter_tenet_purgatory_sinful_characters_less_likely_to_rebel: "[Concept('sinful', 'Sündhafte')|E] [characters|E] treten unwahrscheinlicher [factions|E] bei (#N -15#! pro [sin|E], die sie tragen)"
 doctrine_parameter_tenet_purgatory_sinful_characters_gain_less_piety: "[Concept('sinful', 'Sündhafte')|E] [rulers|E] erhalten #N 10 %#! weniger @piety_icon![piety|E] für jede [sin|E], die sie tragen"
 doctrine_parameter_tenet_purgatory_stress_breaks_remove_sins: "[Concept('stress', 'Anspannungs')|E]-Zusammenbrüche können [Concept('sinful', 'sündhafte')|E] [traits|E] durch [Concept('virtues', 'Tugenden')|E] ersetzen, was wahrscheinlicher ist, je größer der Zusammenbruch ist"
 doctrine_parameter_tenet_purgatory_excommunication_penance: "[Concept('excommunicated', 'Exkommunizierte')|E] [characters|E] dieses [rite|E] sühnen durch Buße: #P +25 %#! Zuwachs an @piety_icon![piety|E] und #P +10#! [opinion|E] beim selben Glauben"
 doctrine_parameter_tenet_purgatory_absolution_costs_less_prestige: "[excommunicated_recovery|EU] kostet weniger @prestige_icon![prestige|E] und senkt nicht Eure [prestige_level|E]"
 doctrine_parameter_tenet_purgatory_prayers_for_the_dead: "#P 50#! @piety_icon![piety|E] für jede [sin|E] erhalten, die von einem Mitglied der nahen [family|E] getragen wird, das stirbt"
 pam_purgatory_prayers_for_the_dead_toast: "Durch Euren Grundsatz [GetTenetType('tenet_purgatory').GetName(GetPlayer.GetRite)]: Gebete für die Toten"
 # Be Fruitful and Multiply tenet
 tenet_be_fruitful_and_multiply_latin_name: "Crescite et Multiplicamini" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì Plēthýnesthe" # DO NOT TRANSLATE
 tenet_be_fruitful_and_multiply_default_name: "Seid fruchtbar und mehrt euch"
 tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
 tenet_be_fruitful_and_multiply_latin_desc: "Während sich die Eheleute einander schenken, schenken sie über sich selbst hinaus die Wirklichkeit des Kindes: lebender Widerschein ihrer Liebe, bleibendes Zeichen ihrer ehelichen Gemeinschaft, lebendige und unauflösliche Einheit ihres Vater- und Mutterseins.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Historischer Hintergrund für Crescite et Multiplicamini','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_greek_desc: "Siehe, Kinder sind eine Gabe des Herrn, und Leibesfrucht ist ein Geschenk.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Historischer Hintergrund für Auxánesthe kaì Plēthýnesthe','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_default_desc: "Nach Gottes Plan ist die Familie eine intime Gemeinschaft von Leben und Liebe, ein Streben, das – wie alles Geschaffene und Erlöste – im Reich Gottes zur Erfüllung gelangen wird.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Historischer Hintergrund für Seid fruchtbar und mehrt euch','tenet_be_fruitful_and_multiply_historical_desc')]"
 tenet_be_fruitful_and_multiply_historical_desc: "„Seid fruchtbar und mehret euch!“ ist eine biblische Weisung und findet sich in Genesis 1, 28, wo Gott Adam und Eva befiehlt, sich zu vermehren und die Erde zu füllen."
 doctrine_parameter_tenet_be_fruitful_and_multiply_easy_spouse_romance: "Liebesdinge beim eigenen Ehepartner ist beträchtlich einfacher und gewährt einen großen [Concept('fertility', 'Fruchtbarkeits')|E]-Bonus"
 doctrine_parameter_tenet_be_fruitful_and_multiply_low_fertility_divorce: "Kann sich von einem Ehepartner mit niedriger [fertility|E] scheiden lassen"
 doctrine_parameter_tenet_be_fruitful_and_multiply_fruitful_upbringing: "Neugeborene erhalten einen [Concept('health', 'Gesundheits')|E]-Bonus entsprechend der Nähe der Beziehung ihrer Eltern"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond: "Mit Zuneigung aufgezogen"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_fond_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close: "Mit Liebe aufgezogen"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_close_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted: "Mit Hingabe aufgezogen"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_devoted_desc: "$tenet_be_fruitful_and_multiply_fruitful_upbringing_desc$"
 tenet_be_fruitful_and_multiply_fruitful_upbringing_desc: "Ein Kind aus einer liebevollen Beziehung, das in der Wärme beider Eltern aufwächst und deshalb gedeiht"
 doctrine_parameter_tenet_be_fruitful_and_multiply_health_boost_after_child: "Von der Geburt bis zur Volljährigkeit:\n$BULLET_WITH_TAB$#V Kinder#! erhalten für 2 Jahre: [GetModifier('tenet_be_fruitful_and_multiply_child_modifier').GetNameWithTooltip].\n$BULLET_WITH_TAB$#V Eltern#! erhalten für 2 Jahre: [GetModifier('tenet_be_fruitful_and_multiply_parent_modifier').GetNameWithTooltip]."
 tenet_be_fruitful_and_multiply_child_modifier: "Verhätschelt"
 tenet_be_fruitful_and_multiply_child_modifier_desc: "Die inbrünstige Verehrung der Fruchtbarkeit führt dazu, dass alle Gläubigen den Jugendlichen und ihren Eltern mehr Fürsorge und Aufmerksamkeit widmen."
 tenet_be_fruitful_and_multiply_parent_modifier: "Für Fruchtbarkeit gepriesen"
 tenet_be_fruitful_and_multiply_parent_modifier_desc: "$tenet_be_fruitful_and_multiply_child_modifier_desc$"
 tenet_be_fruitful_and_multiply_birthday_title: "$tenet_be_fruitful_and_multiply_default_name$"
 # Apostolic Succession tenet
 tenet_apostolic_succession_latin_name: "Successio Apostolica" # DO NOT TRANSLATE
 tenet_apostolic_succession_greek_name: "Apostolikē Diadokhē" # DO NOT TRANSLATE
 tenet_apostolic_succession_default_name: "Apostolische Sukzession"
 tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
 tenet_apostolic_succession_latin_desc: "Der Vorrang an Ehre und Jurisdiktion, den Christus dem Apostel Petrus verlieh und der von seinen Nachfolgern, den Päpsten, ererbt wird.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Historischer Hintergrund für Successio Apostolica','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_greek_desc: "In der römischen Kirche war Linus, der Sohn der Claudia, der Erste, den Petrus zum Bischof weihte.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Historischer Hintegrund für Apostolikē Diadokhē','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_default_desc: "Die ununterbrochene Linie von Bischöfen seit den Aposteln bis zum heutigen Tag stellt die authentische Weitergabe des Glaubens sicher.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Historischer Hintergrund für Apostolische Sukzession','tenet_apostolic_succession_historical_desc')]"
 tenet_apostolic_succession_historical_desc: "Die Lehre der apostolischen Sukzession legt fest, dass die Bischöfe ihre Autorität aus jener ununterbrochenen Weihekette ziehen, die bis zu den Aposteln höchstselbst zurückreicht. Irenäus von Lyon nutzte im 2. Jahrhundert die apostolische Sukzession als Argument gegen die gnostischen Irrlehren und zeigte damit, dass die wahren Lehren Christi durch die legitimen Bischöfe der Kirche gewahrt werden.\n\nSeit dem 13. Jahrhundert tragen die Päpste einen Fischerring, der sie als Nachfolger des heiligen Petrus ausweist. Die orthodoxen Christen im Osten erkennen die Abstammung westlicher Päpste und deren Bedeutung für das frühe Christentum an, sehen jedoch Petrus nicht als höherrangig über die anderen Apostel, sondern erachten Papst Linus als den ersten Bischof von Rom."
 tenet_apostolic_succession_requires_head_of_faith_tt: "Euer [faith|E] muss einen [head_of_faith|E] haben"
 doctrine_parameter_tenet_apostolic_succession_bishop_legitimacy: "[theocratic_vassals|E] desselben [Concept('faith', 'Glaubens')|E] haben niedrigere [legitimacy_expectations|E] gegenüber ihrem [Concept('liege', 'Lehnsherrn')|E]"
 doctrine_parameter_tenet_apostolic_succession_legitimacy_per_theocratic_vassal: "Gewährt: [GetModifier('tenet_apostolic_succession_episcopate_modifier').GetNameWithTooltip]"
 doctrine_parameter_tenet_apostolic_succession_papabile_influence: "Einen [cardinal|E] zu erheben, steigert den eigenen [papabile_score|E] um weitere #P 10#!"
 doctrine_parameter_tenet_apostolic_succession_papal_legitimacy: "Wenn die eigene @legitimacy_icon![legitimacy|E] vom [head_of_faith|E] persönlich gepredigt wird, erhält man zusätzliche @legitimacy_icon![legitimacy|E]"
 doctrine_parameter_tenet_apostolic_succession_antipope_opposition: "Das Absetzen eines [Concept('antipope', 'Gegenpapsts')|E] gewährt @legitimacy_icon![legitimacy|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 # Confession tenet
 tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
 tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
 tenet_confession_default_name: "Bußsakrament"
 tenet_confession_name: "$tenet_confession_default_name$"
 tenet_confession_latin_desc: "Segne mich, Vater, denn ich habe gesündigt. O allbarmherziger Gott! Zu deinen Füßen niedergeworfen flehe ich um deine Vergebung. Ich bekenne dir und deinem Priester meine Sünden in aller Aufrichtigkeit.\n\n$pam_james_5_16_latin$\n\n[Glossary('Historischer Hintergrund für Confessio','tenet_confession_historical_desc')]"
 tenet_confession_greek_desc: "Erhöre das Gebet von mir, dem Elenden, und vernichte die Schlange, die in mir nistet, o Herr!\n\n$pam_james_5_16_greek$\n\n[Glossary('Historischer Hintergrund für Exomológēsis','tenet_confession_historical_desc')]"
 tenet_confession_default_desc: "Durch die Beichte können Sünder die Absolution empfangen und mit Gott und der Kirche versöhnt werden.\n\n$pam_james_5_16_default$\n\n[Glossary('Historischer Hintergrund für Bußsakrament','tenet_confession_historical_desc')]"
 tenet_confession_historical_desc: "Die Praxis des Sündenbekenntnisses durchlief im Lauf der christlichen Geschichte erhebliche Veränderungen. In der frühen Kirche war öffentliche Buße üblich für schwerwiegende Sünden. Die private Beichte gegenüber einem Priester hingegen verbreitete sich während des 6. Jahrhunderts mehr und mehr in den keltischen Kirchen und fand danach Eingang in die westliche Christenheit. 1215 schließlich verfügte das Vierte Laterankonzil die jährliche Beichte für alle Christen. Das Beichtgeheimnis, die absolute Vertraulichkeit der gebeichteten Sünden, wurde zu einem charakteristischen Merkmal des Sakraments und führte dazu, dass Priester eher gewillt waren, als Märtyrer zu sterben, anstatt dieses Geheimnis zu verletzen."
 doctrine_parameter_tenet_confession_priests_secrets: "Ein [court_chaplain|E] Eures [Concept('faith', 'Glaubens')|E], der auch die Beichte abnimmt und Euch entweder mag oder durch ein starkes Druckmittel gehalten wird, hat eine erhöhte Effektivität der [councillor_task|E] $task_find_secrets$"
 doctrine_parameter_tenet_confession_spiritual_counsel_bonus: "#high $spiritual_counsel_interaction$#! durch [clergy|E] dieses [rite|E] gewährt mehr @piety_icon![piety|E] und @spiritual_fulfillment_icon![spiritual_fulfillment|El]"
 doctrine_parameter_tenet_confession_study_scripture_bonus: "[GetScheme('study_scripture').GetTypeName]s-[schemes|E] senken die [stress|E] mehr"
 doctrine_parameter_tenet_confession_confess_sins_decision: "Kann die folgende [decision|E] nutzen: [GetDecisionWithKey('pam_decision_confession').GetName]"
 # Original Sin tenet
 tenet_original_sin_latin_name: "Peccatum Originale" # DO NOT TRANSLATE
 tenet_original_sin_greek_name: "Propatorikē Hamartía" # DO NOT TRANSLATE
 tenet_original_sin_default_name: "Erbsünde"
 tenet_original_sin_name: "$tenet_original_sin_default_name$"
 tenet_original_sin_latin_desc: "Alle Menschen hatten ihre Unschuld durch die Verfehlung Adams verloren. Die Folgen für die Natur, die geschwächt und zum Bösen geneigt ist, verbleiben im Menschen und verpflichten ihn zum geistlichen Kampf.\n\n$pam_romans_5_12_latin$\n\n[Glossary('Historischer Hintergrund für Peccatum Originale','tenet_original_sin_historical_desc')]"
 tenet_original_sin_greek_desc: "Unser Schöpfer und Erschaffer, unser ist die Schuld. Adam und Eva lästerten auf Satan hörend. Aus Selbstsucht ließen sie sich verführen. Sie schwächten die Natur der Menschheit. Das Trachten unseres Herzens ist böse.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Historischer Hintergrund für Propatorikē Hamartía','tenet_original_sin_historical_desc')]"
 tenet_original_sin_default_desc: "Die gesamte Menschheit erbt den Makel der ersten Sünde Adams, von dem uns nur die göttliche Gnade durch Christus erlösen kann.\n\n$pam_romans_5_12_default$\n\n[Glossary('Historischer Hintergrund für Erbsünde','tenet_original_sin_historical_desc')]"
 tenet_original_sin_historical_desc: "Weitestgehend durch den heiligen Augustinus von Hippo wurde die Lehre der Erbsünde im frühen 5. Jahrhundert entwickelt, vor allem als Antwort auf die pelagianische Häresie, die eine ererbte Sündhaftigkeit bestritt. Augustinus lehrte, dass Adams Sünde auf all seine Nachkommen übertragen worden war, was damit die menschliche Natur verdorben und Erlösung ohne göttliche Gnade unmöglich gemacht habe. 418 bestätigte die Synode von Karthago diese Lehre, die dadurch ein Eckpfeiler der Theologie des westlichen Christentums wurde. Das östliche Christentum entwickelte eine etwas anders gelagerte Ansicht und betonte eher die Sünde der Vorfahren als die direkt ererbte Schuld."
 doctrine_parameter_tenet_original_sin_county_conversion_bonus: "Die [councillor_task|E] [promote_culture|E] ist in [counties|E] desselben [rite|E] #P 25 %#! schneller"
 doctrine_parameter_tenet_original_sin_county_conversion_resistance: "[counties|E] mit diesem [Concept('faith', 'Glauben')|E] benötigen #N 50 %#! länger für einen [Concept('promote_culture', 'Kulturwandel')|E], wenn der [liege|E] einen anderen [Concept('faith', 'Glauben')|E] hat"
 doctrine_parameter_tenet_original_sin_sinners_insight: "Ihr erhaltet #P +10#! maximale Erfolgschance für feindselige [schemes|E] pro [sin|E], die Ihr tragt"
 doctrine_parameter_tenet_original_sin_baptism_piety: "Wenn Euer Kind geboren wird, erhaltet Ihr #P 50#! @piety_icon![piety|E]. Mit der Taufe des Neugeborenen erhaltete weitere #P 250#! @piety_icon![piety|E]"
 pam_original_sin_baptism_toast: "Durch Euren Grundsatz [GetTenetType('tenet_original_sin').GetName(GetPlayer.GetRite)]: Der Makel des Neugeborenen wird fortgewaschen"
 PAM_ORIGINAL_SIN_EASIER_TO_CONVERT_CULTURE_MODIFIER: "[GetTenetType('tenet_original_sin').GetName(GetPlayer.GetRite)]"
 # Celestial Hierarchy tenet
 tenet_celestial_hierarchy_latin_name: "Hierarchia Caelestis" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía" # DO NOT TRANSLATE
 tenet_celestial_hierarchy_default_name: "Himmlische Hierarchie"
 tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
 tenet_celestial_hierarchy_latin_desc: "Heilige Engel, umgebt meinen Thron und meine Familie. Himmlischer Vater, lass deine Engel jede Stimme der Verurteilung und der Angst, die gegen mich spricht, zum Schweigen bringen und meine Gebete rasch zu deinem Thron tragen.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Historischer Hintergrund für Hierarchia Caelestis','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_greek_desc: "Sei ein Schutzengel, ein weiser Ratgeber und Begleiter der Christenmenschen, der ihnen Erleuchtung, Kraft, Freude, Frieden und Trost bringt.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Historischer Hintergrund für Ouranía Hierarkhía','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_default_desc: "Die Engel sind in neun Chöre gegliedert, von den Seraphim bis zu den einfachen Engeln, die jeweils Gott in ihrer zugewiesenen Aufgabe dienen und den Menschen ihren Dienst erweisen.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Historischer Hintergrund für Himmlische Hierarchie','tenet_celestial_hierarchy_historical_desc')]"
 tenet_celestial_hierarchy_historical_desc: "Das Konzept der himmlischen Hierarchie wurde im 5. oder 6. Jahrhundert von Pseudo-Dionysios dem Areopagiten in seinem Werk „De Coelesti Hierarchia“ systematisiert. Er ordnete die Engel drei verschiedenen Gruppen zu: In der höchsten sind die Seraphim, Cherubim und die Ophanim; in der mittleren die Herrschaften, Mächte und Gewalten; und in der untersten die Fürsten, Erzengel und Engel.\n\nDiese Hierarchie beeinflusste die mittelalterliche christliche Theologie nachhaltig und wurde sowohl vom östlichen als auch vom westlichen Christentum angenommen. Thomas von Aquin übernahm diese Lehre von den Engeln in seine „Summa Theologica“, wodurch sie die künstlerischen Darstellungen des Himmels das gesamte Mittelalter hindurch prägen sollte."
 doctrine_parameter_tenet_celestial_hierarchy_sp_from_court_position: "Das Besetzen von [Concept('court_positions', 'Hofämtern')|E] mit Charakteren von hoher [aptitude|E] gewährt #P 3#! @spiritual_fulfillment_icon![spiritual_fulfillment|El]; Entlassung oder Widerruf jedes Trägers kostet #N 3#!"
 pam_celestial_hierarchy_hire_sp_toast: "Persönlicher Grundsatz [GetTenetType('tenet_celestial_hierarchy').GetName(GetPlayer.GetRite)]"
 doctrine_parameter_tenet_celestial_hierarchy_court_aptitude_bonus: "Inhaber von [Concept('court_positions', 'Hofämtern')|E] desselben [Concept('faith', 'Glaubens')|E] wie ihr [liege|E] erhalten [aptitude|E] durch ihre [piety_level|E]"
