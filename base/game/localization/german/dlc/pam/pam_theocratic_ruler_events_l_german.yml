l_german:
 pam_theocratic_ruler_events.0001.t: "Ein Erbe für die Kirche"
 pam_theocratic_ruler_events.0001.desc: "Ein reicher Kaufmann hinterließ der Kirche sein Erbe, und die Summe ist nicht geringfügig.\n\nMein[subordinate_priest.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('subordinate_priest'))] [subordinate_priest.GetFirstName] brachte mir die entsprechenden Verzeichnisse und die Absichtserklärungen. [subordinate_priest.Custom('DE_PRO_PER_S_3P_N')|U] schaut mich an und bittet um mein Urteil.\n\n„Das Testament sagt, die Gelder sollen genutzt werden, um den Glauben an die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zu stärken.“"
 pam_theocratic_ruler_events.0001.a: "Ich finde Beweise dafür, dass [subordinate_priest.Custom('DE_PRO_PER_S_3P_N')] Kirchengelder veruntreute …"
 pam_theocratic_ruler_events.0001.b: "„Lasst uns als Geistliche gemeinsam vernünftig beraten.“"
 pam_theocratic_ruler_events.0001.c: "In die Schatzkammer, mit Dankbarkeit und Sorgfalt."
 pam_theocratic_ruler_events.0001.b.success: "Gottes Wege sind unergründlich"
 pam_theocratic_ruler_events.0001.b.failure: "Der Priester kommt nicht zur Vernunft"
 pam_theocratic_ruler_events.0001.b.toast.success: "Ihr überzeugt [subordinate_priest.Custom('DE_PRO_PER_S_3P_A')] und nehmt das Erbe an."
 pam_theocratic_ruler_events.0001.b.toast.failure: "[subordinate_priest.Custom('DE_PRO_PER_S_3P_N')|U] behält die Spende für die höchste Macht ([ROOT.Char.GetFaith.HighGodName])."
 pam_theocratic_ruler_events.0002.t: "[Select_CString(foreign_ruler.IsFemale, 'Eine Reisende', 'Ein Reisender')] von jenseits der Grenze"
 pam_theocratic_ruler_events.0002.desc: "Mich erreicht die Kunde, dass [foreign_ruler.GetTitledFirstName], [Select_CString(foreign_ruler.IsFemale, 'eine Nachbarin und Anhängerin', 'ein Nachbar und Anhänger')] des alten Glaubens ([foreign_ruler.GetFaith.GetName]), durch meine Lande zieht.\n\nDas kleine Gefolge will eigentlich anderswo hin, aber dennoch führt die Route nah genug vorbei, dass man eine formale Begrüßung an meinem Hof erwartet.\n\nWie soll ich sie empfangen?"
 pam_theocratic_ruler_events.0002.a: "Mit einem bescheidenenen Geschenk und einem Friedensangebot."
 pam_theocratic_ruler_events.0002.b: "„Ich suche nach ernsthafter Verständigung zwischen unseren Völkern.“"
 pam_theocratic_ruler_events.0002.b.success: "Meine Höflichkeit zieht sie in meinen Bann"
 pam_theocratic_ruler_events.0002.b.failure: "Meine Worte klingen leer"
 pam_theocratic_ruler_events.0002.b.toast.success: "Eure Höflichkeit gewinnt, und die Toleranz zwischen Euren Völkern wächst"
 pam_theocratic_ruler_events.0002.b.toast.failure: "[foreign_ruler.Custom('DE_PRO_PER_S_3P_N')|U] ist unbeeindruckt; Eure Worte klingen leer"
 pam_theocratic_ruler_events.0002.b.acceptance: "Höfische Gesandtschaft"
 pam_theocratic_ruler_events.0002.c: "Heiden haben keinen Platz in unseren Landen."
 TRUCE_PAM_NEIGHBOR_GIFT: "\nEin Waffenstillstand, der auf Geschenken und gegenseitigem Respekt zwischen Nachbarn fußt"
 pam_theocratic_ruler_events.0003.t: "Rat für eine umkämpfte Grenze"
 pam_theocratic_ruler_events.0003.desc: "Krieg und Räuber fordern mein Land zur Genüge heraus. Ich rufe [advisor.GetTitledFirstName] zu mir, [Select_CString(advisor.IsFemale, 'meine vertraute Beraterin', 'meinen vertrauten Berater')] als [advisor.GetCouncilTitle], und gemeinsam überlegen wir, was getan werden muss.\n\n„Wir könnten uns an [alliance_target.GetTitledFirstName] wenden. [alliance_target.Custom('DE_PRO_PER_S_3P_N')|U] ist ebenfalls [Select_CString(alliance_target.IsFemale, 'eine theokratische Herrscherin', 'ein theokratischer Herrscher')] und könnte uns zu Hilfe kommen.“\n\nOder sollte ich diese Bürde lieber auf meine eigenen Schultern nehmen?"
 pam_theocratic_ruler_events.0003.a: "Schickt Boten. Wir müssen zusammenstehen."
 pam_theocratic_ruler_events.0003.a.tt: "Ihr schmiedet ein [alliance|E] mit [alliance_target.GetShortUINameNoTooltip]"
 pam_theocratic_ruler_events.0003.b: "Hebt gläubige Bauern für die Grenzverteidigung aus."
 pam_theocratic_ruler_events.0003.b.army: "Gläubige Bauern"
 pam_theocratic_ruler_events.0003.c: "Schickt Unterstützung und setzt eine überfallene Gemeinde wieder instand."
 pam_theocratic_ruler_events.0003.d: "Ich gebe dies in die Hände von der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])."
 pam_theocratic_ruler_events.0004.t: "Brüder als Nachbarn"
 pam_theocratic_ruler_events.0004.desc: "Da ein gewisser Orden ([monastic_order_head.GetPrimaryTitle.GetName]) so nahe ist, lud ich [monastic_order_head.GetTitledFirstName] ein, um zu besprechen, wie wir unsere Zusammenarbeit vertiefen könnten.\n\n„Die höchste Macht ([monastic_order_head.GetFaith.HighGodName]) beurteilt uns nicht nach unserem Stolz, sondern nach unserer Bereitschaft, ihr zu dienen“, spricht [monastic_order_head.GetTitledFirstNameNoTooltip] sanft."
 pam_theocratic_ruler_events.0004.a: "Bitte lasst Eure Brüder meine Lande segnen."
 pam_theocratic_ruler_events.0004.b: "[Select_CString(monastic_monk.IsFemale, 'Eure Schülerin', 'Euer Schüler')] [monastic_monk.GetTitledFirstNameNoTooltip] würde meinen Hof stärken."
 pam_theocratic_ruler_events.0004.c: "Lasst uns gemeinsam beten."
 pam_theocratic_ruler_events.0005.t: "Schwerter für den Glauben"
 pam_theocratic_ruler_events.0005.desc: "Da sich ein gewisser Orden ([military_order_head.GetPrimaryTitle.GetName]) in meinem Reich niederließ, lade ich [military_order_head.GetTitledFirstName] ein, um zu besprechen, wie die Schwerter der Gläubigen einander dienen könnten.\n\n„Die höchste Macht ([military_order_head.GetFaith.HighGodName]) segnet keinen trägen Stahl, sondern Klingen, die zur Verteidigung der Gläubigen erhoben werden“, sagt [military_order_head.GetTitledFirstNameNoTooltip], während sich [military_order_head.Custom('DE_PRO_POS_S_3P')][Select_CString(order_knight.IsFemale, 'e Anhängerin', ' Anhänger')] [order_knight.GetTitledFirstName] neben [military_order_head.Custom('DE_PRO_PER_S_3P_D')] schweigend verbeugt."
 pam_theocratic_ruler_events.0005.a: "Bildet meine [ROOT.Char.Custom('GetFighterTermPlural')] nach der Ordensdisziplin aus."
 pam_theocratic_ruler_events.0005.b: "Lasst [order_knight.GetTitledFirstNameNoTooltip] meine Leibwache sein."
 pam_theocratic_ruler_events.0005.c: "Lasst uns über einen rechtschaffenen Krieg sprechen."
 pam_theocratic_ruler_events.0006.t: "Zehnt oder Barmherzigkeit"
 pam_theocratic_ruler_events.0006.desc: "[Select_CString(local_peasant_leader.IsFemale, 'Eine Dorfvorsteherin', 'Ein Dorfvorsteher')] namens [local_peasant_leader.GetTitledFirstName] wird zu mir gebracht. [local_peasant_leader.Custom('DE_PRO_POS_S_3P')|U]e Leute hielten Kirchensteuern zurück, und nun beruft [local_peasant_leader.Custom('DE_PRO_PER_S_3P_N')] sich auf eine Notlage.\n\n„Der Winter war grausam, Herr[ROOT.Char.Custom('DE_END_NOU_S_GS_N')], und unsere Speicher sind fast leer“, sagt [local_peasant_leader.Custom('DE_PRO_PER_S_3P_N')] mit zitternder Stimme.\n\nDie Sache ist einfach: entweder das Land durch Furcht disziplinieren oder den Frieden durch Gnade wahren."
 pam_theocratic_ruler_events.0006.a: "Keine Ausnahmen. Ergreift [Select_CString(local_peasant_leader.IsFemale, 'die Rädelsführerin', 'den Rädelsführer')]."
 pam_theocratic_ruler_events.0006.a.tt: "Ihr erhaltet [gold_i][EmptyScope.ScriptValue('minor_gold_value')|0], Ihr kerkert [local_peasant_leader.GetShortUINameNoTooltip] ein und [troubled_county.GetName] erhält für 5 Jahre: #N Erzwungener Zehnt#! (#N -20#! [county_opinion|E])"
 pam_theocratic_ruler_events.0006.b: "Lasst es geschehen. Gnade kann auch Gott dienen."
 pam_theocratic_ruler_events.0006.b.tt: "Ihr erhaltet [piety_i][EmptyScope.ScriptValue('minor_piety_gain')|0] und [troubled_county.GetName] erhält für 5 Jahre: #P Gnädiger Zehnt#! (#P +20#! [county_opinion|E])"
 pam_theocratic_ruler_events.0006.c: "Mein Ratsverwalter beging den Fehler. Es ist seine Schuld."
 pam_theocratic_ruler_events.0006.c.tt: "Wenn möglich, erhaltet Ihr ein [hook|E] gegenüber [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip] (ein stärkeres Pflichtdruckmittel wird verwendet, falls vorhanden). [ROOT.Char.GetCouncillor('councillor_steward').GetShortUINameNoTooltip|U] verliert [opinion|E] von Euch (#N -20#!, Verfall über 5 Jahre)"
 pam_theocratic_ruler_events.0007.t: "Gesegnete Harmonie"
 pam_theocratic_ruler_events.0007.desc: "Als die sanften Sonnenstrahlen den Morgennebel vertreiben und die Steine im Kirchhof erwärmen, erkenne ich: Ausnahmsweise zerrt die Pflicht nicht an meinem Ärmel. Sogar eine emsige Honigbiene scheint eine kleine Pause einzulegen, um ihren Rücken in den morgendlichen Strahlen zu wärmen.\n\nMeine Lande sind in friedlicher Ordnung. Es gibt Gold in den Schatzkammern, und meine Herde ist zufrieden und respektvoll. Sogar [Select_CString(ROOT.Char.GetLiege.IsFemale, 'meine Lehnsherrin', 'mein Lehnsherr')] [ROOT.Char.GetLiege.GetTitledFirstName] spricht anerkennend davon, wie ich [ROOT.Char.GetLiege.Custom('DE_PRO_POS_S_3P')]e Untertanen zu Christus führe."
 pam_theocratic_ruler_events.0007.a: "Frieden ist lieblich, doch die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) hat noch größere Aufgaben für mich."
 pam_theocratic_ruler_events.0007.b: "Verkündet die frohe Botschaft von einem geordneten und gottgefälligen Leben."
 pam_theocratic_ruler_events.0007.c: "Lasst mich einfach nur zuhören und seid leise."
 pam_theocratic_ruler_events.0008.t: "Stein auf Stein"
 pam_theocratic_ruler_events.0008.desc: "Seit ich [stone_province.GetName] erbte nebst einer Burg mit Wällen und Türmen, bestaune ich diese beeindruckenden Steinarbeiten, die für eine eher weltliche Herrschaft geschaffen wurden. Doch sind Verteidigungen wirklich notwendig für die Gläubigen?\n\nMein Anwesen hat keinen [GetDomicileBuilding('episcopal_palace_01').GetName], der meines Namens würdig wäre, dabei gibt es hier Steine, die bereits von weltlichen Händen bearbeitet wurden."
 pam_theocratic_ruler_events.0008.a: "Ich kann überzählige Steine von diesen primitiven Mauern verwenden."
 pam_theocratic_ruler_events.0008.b: "Reißt die Mauern nieder und errichtet meinen [GetDomicileBuilding('episcopal_palace_01').GetNameNoTooltip]."
 pam_theocratic_ruler_events.0008.c: "Eine jede Arbeit aus menschlicher Hand ist ein Gebet, das sichtbar wurde."
 pam_theocratic_ruler_events.0008.c.flavor: "Ihr habt den Grundsatz: [GetTenetType('tenet_ora_et_labora').GetName(ROOT.Char.GetRite)]"
 pam_theocratic_ruler_events.0008.d: "Sie könnten die Mauern brauchen."
 pam_theocratic_ruler_events.0009.t: "Versucht, der Hirte zu sein"
 pam_theocratic_ruler_events.0009.desc: "Ich erhielt tränennasse Berichte von meiner Gemeinde, dass [heir.GetTitledFirstName] während [heir.Custom('DE_PRO_POS_S_3P')]er letzten Predigt die Beherrschung verlor und man nicht in der Lage sei, jene strengen Regeln zu befolgen, die [heir.Custom('DE_PRO_PER_S_3P_N')] ihnen auferlegt.\n\nAls ich [heir.Custom('DE_PRO_PER_S_3P_A')] befrage, wird [heir.Custom('DE_PRO_PER_S_3P_N')] wütend.\n\n„Oh, diese niederträchtigen Sünder! Ich ertrage ihre jämmerlichen Versuche, zur Erlösung zu gelangen, einfach nicht.“"
 pam_theocratic_ruler_events.0009.a: "„Ein Hirte ist ruhig. Haltet Eure Leidenschaft im Zaum.“"
 pam_theocratic_ruler_events.0009.a.success: "Euer Rat erreicht [heir.Custom('DE_PRO_PER_S_3P_A')]"
 pam_theocratic_ruler_events.0009.a.failure: "Eure Worte können [heir.Custom('DE_PRO_PER_S_3P_A')] nicht beruhigen"
 pam_theocratic_ruler_events.0009.a.toast.success: "Erfolgreicher Rat"
 pam_theocratic_ruler_events.0009.a.toast.failure: "Gescheiterter Rat"
 pam_theocratic_ruler_events.0009.b: "Sanft schüttle ich den Kopf vor Enttäuschung."
 pam_theocratic_ruler_events.0009.b.flavor: "[heir.Custom('DE_PRO_PER_S_3P_N')|U] bekommt meinen Segen nicht und ist nicht in der Lage zu herrschen"
 pam_theocratic_ruler_events.0009.c: "„Betet. Diszipliniert Euch.“"
 pam_theocratic_ruler_events.0010.t: "Das Schwert oder der Bischofsstab"
 pam_theocratic_ruler_events.0010.desc: "Als [Select_CString(ROOT.Char.IsFemale, 'Herrscherin', 'Herrscher')] über meine Lande wurde ich gezwungen, der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) mit Schwert und Segen zu dienen.\n\nMit lebendiger Klarheit erinnere ich mich an Momente auf meiner Pilgerreise ([pilgrimage_memory.GetDescription]) und auf dem Schlachtfeld ([battle_memory.GetDescription]). Die Toten lagen zuhauf da – meine Anhänger wissen, dass ich vor anstehenden Aufgaben nicht zurückschrecke.\n\nWenn es um die Zukunft des Reichs geht, wollen mein [ROOT.Char.GetCouncillor('councillor_marshal').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_marshal').GetTitledFirstName] und mein [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetCouncilTitle] [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetTitledFirstName] beide, dass ich ihr Werkzeug in den Mittelpunkt unserer Bemühungen stelle."
 pam_theocratic_ruler_events.0010.a: "Ehrt das Schwert."
 pam_theocratic_ruler_events.0010.b: "Der Bischofsstab sollte führen."
 pam_theocratic_ruler_events.0010.c: "Lasst das Schwert und den Bischofsstab gemeinsam dienen."
 pam_theocratic_ruler_events.0011.t: "Ruhe für den gefallenen Ritter"
 pam_theocratic_ruler_events.0011.desc: "[landed_subject.GetTitledFirstName|U] kniet vor mir mit der Kunde von [landed_subject.Custom('DE_PRO_POS_S_3P')]em Verwandten, der bei der Verteidigung der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) fiel. \n\n„Er konnte sich gegen viele Heiden wehren, doch seine Wunden waren zu tief. Wenigstens konnten wir uns voneinander verabschieden.\n\nBitte gewährt ihm eine Begräbnisstätte neben dem Altargang, mit seinem Schwert an seiner Seite. Ich werde Euch auf ewig dankbar sein.“"
 pam_theocratic_ruler_events.0011.a: "Bezahlt für den Stein und er wird hier ruhen."
 pam_theocratic_ruler_events.0011.a.flavor: "Der Ritter wird im Inneren der Kirche ruhen."
 pam_theocratic_ruler_events.0011.b: "Wenn Ihr das Schwert spendet, können wir die Krypta nehmen."
 pam_theocratic_ruler_events.0011.b.flavor: "Der Ritter wird ohne sein Schwert ruhen."
 pam_theocratic_ruler_events.0011.c: "Kämpfende Mannen gehören unter den offenen Himmel."
 pam_theocratic_ruler_events.0011.c.flavor: "Der Ritter wird außerhalb der Kirche begraben."
 pam_fallen_knight_crusader_sword_name: "Das Schwert des Kreuzritters"
 pam_fallen_knight_crusader_sword_desc: "Ein Schwert, das von einem Ritter getragen wurde, der bei der Verteidigung des Glaubens starb. Gespickt mit Kerben, die von heidnischen Klingen stammen, und ein kleines Kreuz ist in den Griff eingraviert."
 pam_theocratic_ruler_events.0012.t: "Ein einstmals heiliger Hain"
 pam_theocratic_ruler_events.0012.desc: "Mein Gefolge wird langsamer, als der Wald den Weg zunehmend umschließt. [grove_subject.GetTitledFirstName|U], von den Gläubigen aus [grove_county.GetNameNoTier], tritt zwischen den Bäumen hervor und breitet die Hände zum Gruß aus.\n\n„Wenn Ihr wahrhaftig wünscht, die Schar in diesen Landen für Euch zu gewinnen, müsst Ihr lauschen und annehmen, was die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) hier bereits pflanzte. Erbaut einen Tempel neben den alten Hainen von [grove_province.GetName], und die Leute werden wissen, wessen Hirte Ihr seid.“"
 pam_theocratic_ruler_events.0012.a: "Lasst die Natur meinen Glauben führen."
 pam_theocratic_ruler_events.0012.b: "Zeigt mir diese Haine."
 pam_theocratic_ruler_events.0012.b.success: "Eure Mannen kehren später zurück, um das Holz einzusammeln"
 pam_theocratic_ruler_events.0012.b.failure: "[grove_subject.GetShortUINameNoTooltip|U] durchschaut Eure List"
 pam_theocratic_ruler_events.0012.b.toast.success: "Die alten Bäume werden gegen Geld fortgeschafft."
 pam_theocratic_ruler_events.0012.b.toast.failure: "[grove_subject.GetShortUINameNoTooltip|U] verbreitet die Kunde von Eurer Entweihung."
 pam_theocratic_ruler_events.0012.c: "Die Wildnis stinkt nach dem Teufel."
 pam_theocratic_ruler_events.0013.t: "Eine englische Eingebung"
 pam_theocratic_ruler_events.0013.desc: "Wie von göttlicher Eingebung ergriffen erklang heute in der Messe eine Stimme über der des Kantors, klar und nicht irdisch in ihrer Schönheit.\n\nDie Gläubigen verstummen, wenn [angelic_singer.GetTitledFirstName] singt, und noch lange nach dem letzten Ton sitze ich da und höre immer noch zu."
 pam_theocratic_ruler_events.0013.a: "„Eure Gabe gehört der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]). Legt das Gelübde ab und dient.“"
 pam_theocratic_ruler_events.0013.a.success: "Eure Worte bewegen [angelic_singer.Custom('DE_PRO_PER_S_3P_A')] zur Frömmigkeit"
 pam_theocratic_ruler_events.0013.a.failure: "[angelic_singer.GetShortUINameNoTooltip|U] lässt sich nicht überreden"
 pam_theocratic_ruler_events.0013.a.toast.success: "[angelic_singer.GetShortUINameNoTooltip|U] legt das Gelübde ab und kommt an Euren Hof."
 pam_theocratic_ruler_events.0013.a.toast.failure: "[angelic_singer.GetShortUINameNoTooltip|U] lehnt ab und geht."
 pam_theocratic_ruler_events.0013.b: "Bleibt als [Select_CString(angelic_singer.IsFemale, 'meine Gästin', 'mein Gast')]. Ich möchte diese Stimme erneut hören."
 pam_theocratic_ruler_events.0013.c: "Lasst unsere Kantoren das Singen übernehmen."
 pam_theocratic_ruler_events.0014.t: "Die Bitte [Select_CString(convert_peasant.IsFemale, 'einer', 'eines')] Bekehrten"
 pam_theocratic_ruler_events.0014.desc: "Während meiner Predigt drängt sich [convert_peasant.GetTitledFirstName] durch die Menge, [convert_peasant.Custom('DE_ART_DEF_S_N')] die alten Bräuche [convert_peasant.Custom('DE_PRO_POS_S_3P')]es [convert_peasant.GetCulture.GetNameNoTooltip|l]en Glaubens ([neighbour_faith.GetNameNoTooltip]) aufgab.\n\n„Mann kann von den alten Bräuchen noch immer viel lernen. Ich weiß, wenn Ihr es übers Herz brächtet, sie zu erwägen, so wüsste unser Volk, dass Ihr unsere Traditionen ehrt. Mein Volk wird an Eurer Seite stehen und jede Eurer Bemühungen unterstützen.“\n\n[convert_peasant.Custom('DE_PRO_PER_S_3P_N')|U] wartet auf meinen Segen und ein stummes Nicken als meine Antwort."
 pam_theocratic_ruler_events.0014.a: "Entfernt diesen Unrat aus meinem Blick."
 pam_theocratic_ruler_events.0014.a.flavor: "Ihr habe die [trait|E]: [GetTrait('arrogant').GetName(GetNullCharacter)|U]"
 pam_theocratic_ruler_events.0014.a.acceptance: "Lehnte die Bitte des Bekehrten ab"
 pam_theocratic_ruler_events.0014.b: "Ich nehme den Grundsatz namens [offered_tenet_a.GetBaseNameNoTooltip] als meinen eigenen an."
 pam_theocratic_ruler_events.0014.b.tt: "Euer nächster Beitrag in Sachen #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! für ein [GetGreatProjectType('pam_mass_rite_conversion').GetName|V]s-[great_project|E] ist umsonst."
 pam_theocratic_ruler_events.0014.c: "Ich nehme den Grundsatz namens [offered_tenet_b.GetBaseNameNoTooltip] als meinen eigenen an."
 pam_theocratic_ruler_events.0014.c.tt: "Euer nächster Beitrag in Sachen #V $great_project_type_pam_mass_rite_conversion_contribution_integrate_existing_rituals$#! für ein [GetGreatProjectType('pam_mass_rite_conversion').GetName|V]s-[great_project|E] ist umsonst."
 pam_theocratic_ruler_events.0014.d: "Leiten die Schafe den Hirten?"
 pam_theocratic_ruler_events_0014_mass_conversion_discount_desc: "Die Bitte eines Bekehrten"
 pam_theocratic_ruler_events.0015.t: "Die Nachfolger führen"
 pam_theocratic_ruler_events.0015.desc: "Nach mir wird das Bistum einen Hirten benötigen, der im Gebet wie auch im Urteil Führungsvermögen zeigt. [succession_heir_first.GetTitledFirstName|U] als Erstes in der Nachfolgelinie und [succession_heir_second.GetTitledFirstName], unmittelbar dahinter wurden aufgefordert, vor mir im Privaten die Schrift zu rezitieren.\n\nEiner von ihnen wird meine Bürde erben, doch ich kann sie heute nicht beide gleich formen.\n\n„Meine Kinder im Glauben. Zeigt mir nicht nur, was Ihr auswendig lerntet, sondern auch das, was Ihr selbst daraus machtet.“"
 pam_theocratic_ruler_events.0015.a: "Unterweist [succession_heir_first.GetFirstNameNoTooltip] in der Schrift."
 pam_theocratic_ruler_events.0015.b: "Führt [succession_heir_second.GetFirstNameNoTooltip] durch die heiligen Texte."
 pam_theocratic_ruler_events.0015.c: "Noch bin ich der Hirte. Ich übernehme den Vortrag."
 pam_theocratic_ruler_events.0015.c.success: "Eure Bildung überstrahlt ihre Vorträge"
 pam_theocratic_ruler_events.0015.c.failure: "Ihr stolpert über eine Textstelle, die sie auswendig können"
 pam_theocratic_ruler_events.0015.c.toast.success: "Sie sind bewegt ob Eurer Beherrschung der Doktrin."
 pam_theocratic_ruler_events.0015.c.toast.failure: "Eure Untergebenen tauschen Blicke aus, als Ihr einen Fehler macht."
