l_german:
 # Abbey of St Gall
 building_type_pam_abbey_of_st_gall_01: "$building_pam_abbey_of_st_gall_01$"
 building_type_pam_abbey_of_st_gall_01_desc: "$building_pam_abbey_of_st_gall_01_desc$"
 building_pam_abbey_of_st_gall_01: "Abtei St. Gallen"
 building_pam_abbey_of_st_gall_01_desc: "Die Abtei, die in der Nähe der Einsiedelei St. Gallen entstand, ist berühmt für ihre Schule, ihr Skriptorium und ihre Bibliothek. Innerhalb ihrer Mauern kopieren Mönche heilige Schriften und bilden Geistliche aus, deren Wissen weit über die Ufer des Bodensees hinausreicht."
 building_pam_abbey_of_st_gall_01_destination_desc: "Die [GetBuilding('pam_abbey_of_st_gall_01').GetName] versammelt Pilger und Gelehrte hinter ihren Mauern. Ihre Mönche bewahren Handschriften, lehren Geistliche und halten die Erinnerung an Sankt Gallus in den Alpenausläufern lebendig."
 # Palais des Papes
 building_type_pam_palais_de_papes_01: "$building_pam_palais_de_papes_01$"
 building_type_pam_palais_de_papes_01_desc: "$building_pam_palais_de_papes_01_desc$"
 building_pam_palais_de_papes_01: "Palais des Papes"
 building_pam_palais_de_papes_01_desc: "Hoch über Avignon gelegen dient dieser Palast sowohl als Festung als auch als Residenz und schützt den päpstlichen Hof hinter massiven Steinmauern. Kapellen, Audienzsäle und Verwaltungsräume machen die Stadt zu einem Zentrum kirchlicher Macht."
 building_pam_palais_de_papes_01_destination_desc: "Der [GetBuilding('pam_palais_de_papes_01').GetName] dominiert Avignon mit seinen Wehrmauern und feierlichen Kapellen: ein Palast, der für Geschäfte und Zeremonien der Kirche errichtet wurde."
 # Archbasilica of Saint John Lateran
 building_type_pam_lateran_basilica_01: "$building_pam_lateran_basilica_01$"
 building_type_pam_lateran_basilica_01_desc: "$building_pam_lateran_basilica_01_desc$"
 building_pam_lateran_basilica_01: "Lateranbasilika"
 building_pam_lateran_basilica_01_desc: "Die Kathedrale von Rom gilt als Mutter- und Hauptkirche der Stadt und der Welt. In ihrer Basilika und den angrenzenden Sälen tagen Konzilien, Lehrsätze werden beschlossen und die Autorität des römischen Papstes manifestiert."
 building_pam_lateran_basilica_01_destination_desc: "Die [GetBuilding('pam_lateran_basilica_01').GetName] empfängt Pilger und Prälaten am Bischofssitz Roms, wo unter ehrwürdigen Mauern feierliche Verehrung und Kirchenleitung zusammenfallen."
 # Reims Cathedral
 building_type_pam_reims_cathedral_01: "$building_pam_reims_cathedral_01$"
 building_type_pam_reims_cathedral_01_desc: "$building_pam_reims_cathedral_01_desc$"
 building_pam_reims_cathedral_01: "Kathedrale von Reims"
 building_pam_reims_cathedral_01_desc: "In Reims steht die Kathedrale als heilige Stätte der Taufe Chlodwigs und zur Krönung von Königen. Hier kann der Segen des Klerus die Ansprüche eines Herrschers in göttliche Autorität verwandeln und so ein Band zwischen Glauben und königlicher Macht knüpfen."
 building_pam_reims_cathedral_01_destination_desc: "Die [GetBuilding('pam_reims_cathedral_01').GetName] zieht Reisende in das heilige Herz der königlichen Weihe, wo fränkische Könige vor dem Altar niederknien und anschließend gesalbt vor das Reich treten."
