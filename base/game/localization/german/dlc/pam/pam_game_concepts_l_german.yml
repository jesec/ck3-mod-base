l_german:
 game_concept_puppet: "Marionette"
 game_concept_puppets: "Marionetten"
 game_concept_puppeted: "zur Marionette gemacht"
 game_concept_puppeting: "Marionette spielend"
 game_concept_puppet_type: "Marionettenart"
 game_concept_puppet_types: "Marionettenarten"
 game_concept_puppet_type_desc: "Eine [puppet|e] hat immer eine Art, die darüber bestimmt, welche Aktionen in Eurem Namen durchgeführt werden dürfen.\n\nObwohl sie sich die meisten ihrer Spezialaktionen teilen, besitzt jede $game_concept_puppet_type$ einzigartige Aktionen, die nur für sie verfügbar sind.\n\nBeispielsweise kann eine [clerical_puppet|e] jemanden in Eurem Namen [excommunicate|el] oder eine [external_ruler_puppet|e] kann genötigt werden, einen [tributary|e] freizulassen oder sich vom eigenen [spouse|e] scheiden zu lassen.\n\nIhr dürft nur eine $game_concept_puppet$ von jeder Art haben."
 game_concept_puppet_desc: "Eine Marionette ist ein [character|E] unter der Kontrolle eines [Concept('puppeteer', 'Puppenspielers')|E] steht, der besondere Marionettenaktionen über sie ausführen kann.\n\nÜber eine Marionette zu handeln, öffnet Türen, die ansonsten verschlossen bleiben würden: Eine [clerical_puppet|E] kann einen [clerical_titles|E] oder eine [excommunication|E] in Eurem Namen erbitten, während eine [external_ruler_puppet|E] genötigt werden kann, [tributaries|E] freizulassen, Unabhängigkeit zu gewähren oder sich vom eigenen [spouse|E] scheiden zu lassen.\n\nDie verfügbaren Aktionen werden durch die [puppet_type|E] bestimmt."
 game_concept_puppeteer: "Puppenspieler"
 game_concept_puppeteers: "Puppenspieler"
 game_concept_puppeteer_possessive: "des Puppenspielers"
 game_concept_puppeteers_possessive: "der Puppenspieler"
 game_concept_puppeteer_desc: "Ein Puppenspieler ist ein [character|E], der die Kontrolle über eine oder mehr [puppets|E] hat.\n\nBeim Handeln über die eigenen Marionetten verfügt ein Puppenspieler über Macht, die ihm der eigene Stand nicht einräumen würde, beispielsweise Zugriff auf den [clergy|E] oder die Autorität eines anderen [Concept('realm', 'Reichs')|E]."
 game_concept_clerical_puppet: "Reichspriester-Marionette"
 game_concept_clerical_puppets: "Reichspriester-Marionetten"
 game_concept_clerical_puppet_desc: "Ein [realm_priest|E], der die [puppet|E] des eigenen [Concept('liege', 'Lehnsherrn')|E] ist.\n\nDurch ihn kann der Puppenspieler in Angelegenheiten des [Concept('faith', 'Glaubens')|E] eingreifen: das [head_of_faith|E] um [clerical_titles|E] oder eine [excommunication|E] bitten, [holy_sites|El] verwalten, einen neuen [rite|E] gründen oder ein [Concept('ecumenical_council', 'Ökumenisches Konzil')|E] ausrichten."
 game_concept_external_clerical_puppet: "Klerusherrscher-Marionette"
 game_concept_external_clerical_puppets: "Klerusherrscher Marionetten"
 game_concept_external_clerical_puppet_desc: "Ein einflussreiches Mitglied des [clergy|E] (ein [archbishop|E] oder gar [head_of_faith|E]), das zur [puppet|E] eines anderen [Concept('ruler', 'Herrschers')|E] geworden ist.\n\nJe mächtiger der Kleriker, desto größer sein Einfluss: Ein als Marionette benutztes Glaubensoberhaupt kann Eure Feinde [excommunicate|El], [cardinals|E] ernennen, einen [Concept('pressed_claim', 'durchgesetzten Anspruch')|E] gewähren oder einen [holy_war|E] für Euch anzetteln."
 game_concept_external_ruler_puppet: "Weltliche Herrscher-Marionette"
 game_concept_external_ruler_puppets: "Weltliche Herrscher-Marionetten"
 game_concept_external_ruler_puppet_desc: "Ein Nicht-Klerus-[ruler|E], der zur [puppet|E] eines anderen [Concept('character', 'Charakters')|E] wurde.\n\nDurch diese Marionette könnt Ihr Euch in die Angelegenheiten anderer [realms|E] einmischen (beispielsweise durch [schemes|E] oder [imprisonment|E]).\n\n\nUm diese Art von Marionette zu erlangen, muss man die [interaction|E] #V $make_external_ruler_puppet_interaction$#! nutzen. Ihr schaltet die Interaktion frei, wenn mindestens eines der folgenden Dinge zutrifft:\n$BULLET_WITH_TAB$Ihr seid ein [clergy|E]-[vassal|E] des Ziels\n$BULLET_WITH_TAB$Ihr seid ein [GetTrait('seducer').GetName(GetNullCharacter)] und das Ziel ist Eure [lover|E] oder Euer [soulmate|E], wenn das Ziel den Rang [king|E] oder höher hat\n$BULLET_WITH_TAB$Ihr seid ein [GetTrait('torturer').GetName(GetNullCharacter)] und habt das Ziel in Eurem [dungeon|E]\n$BULLET_WITH_TAB$Ihr seid [GetTrait('family_first').GetName(GetNullCharacter)] und das Ziel ist [close_family|El]\n$BULLET_WITH_TAB$Ihr seid ein [GetTrait('diplomat').GetName(GetNullCharacter)] und das Ziel ist ein [independent_ruler|El]\n$BULLET_WITH_TAB$Ihr seid [GetTrait('gallant').GetName(GetNullCharacter)|l] und das Ziel ist Euer [spouse|E]\n$BULLET_WITH_TAB$Ihr seid ein [diarch|E] des Ziels in einer [Concept('entrenched_regency', 'verwurzelten Regentschaft')|E]"
 game_concept_ecumenical_council: "Ökumenisches Konzil"
 game_concept_ecumenical_council_desc: "Ein $game_concept_ecumenical_council$ ist eine [activity|E], bei der der oberste [clergy|E] der ganzen Christenheit sich versammelt, um die Zukunft der Kirche zu klären.\n\nIm Verlauf mehrerer aufeinanderfolgender Debatten entscheiden die versammelten Prälaten über den [tenet_status|E] umstrittener [core_tenets|E] (wodurch sie als [permitted_tenet_status|E] oder [prohibited_tenet_status|E] gelten oder zum [core_tenet_status|E] erhoben werden) sowie die [doctrines|E] des [Concept('faith', 'Glaubens')|E]."
 game_concept_ecumenical_councils: "Ökumenische Konzile"
 game_concept_ecumenical_councils_desc: "$game_concept_ecumenical_council_desc$"
 game_concept_schism: "Schisma"
 game_concept_schism_desc: "Das Große $game_concept_schism$ ist der Augenblick, in dem der geeinte christliche [faith|E] in den römischen und den griechischen [rite|E] zerbricht und sich in katholisch und orthodox aufteilt.\n\nEs droht, wenn die [situation|E] [the_christian_church|EU] in ein bestimmtes [the_christian_church_chapters_short|E] eintritt und Herrscher in der gesamten Christenheit sich auf eine der beiden Seiten schlagen müssen. Wenn die Spaltung durch [decisions|E] nicht geheilt wird (oder wenn sie sich sogar noch weiter verschlimmert), tritt sie dauerhaft in Kraft, sobald das Kapitel endet."
 game_concept_schisms: "Schismen"
 game_concept_schisms_desc: "$game_concept_schism_desc$"
 game_concept_clerical_title: "Kirchentitel"
 game_concept_clerical_titles: "Kirchentitel"
 game_concept_clerical_title_desc: "Ein $game_concept_clerical_title$ ist ein [Concept('ecclesiastical', 'kirchlicher')|E] [title|E], der von einem Mitglied des [clergy|E] gehalten wird, das eine [clerical_region|E] im [Concept('faith', 'Glauben')|E] regiert. Für die [Concept('christian', 'christlichen')|E] Glauben hat er die Form einer [archdiocese|E].\n\nIhr Träger ist der [religious_superior|E] des [clergy|E] in dieser Region und erhält seinen Titel üblicherweise vom [head_of_faith|E]."
 game_concept_the_christian_church: "Christliche Kirche"
 game_concept_the_christian_church_desc: "Die christliche Kirche ist eine kirchliche Institution, die die Anhänger von Jesus Christus leitet und führt, dargestellt als eine [situation|E], die durch eine Abfolge von [Concept('the_christian_church_chapters_short', 'Kapiteln')|E] voranschreitet.\n\nIhre Grenzen umfassen jede [archdiocese|E] in der Welt; jeder [Concept('christian', 'christliche')|E] [ruler|E] mit [county|E]-Rang oder höher, dessen [realm|E] zu einem beliebigen Anteil innerhalb einer Erzdiözese liebt, ist ein Mitglied, ob nun klerikal oder weltlich."
 game_concept_christendom: "Christenheit"
 game_concept_christendom_desc: "Die $game_concept_christendom$ umfasst die [Concept('realm', 'Reiche')|E] aller [Concept('independent', 'unabhängigen')|E] [Concept('christian', 'christlichen')|E] [ruler|E], die Mitglieder der [situation|E] namens [the_christian_church|EU] sind."
 game_concept_christian: "Christ"
 game_concept_christians: "Christen"
 game_concept_christian_possessive: "des Christen"
 game_concept_christian_desc: "Ein Anhänger der christlichen [religion|E]."
 game_concept_papal_bull: "Päpstliche Bulle"
 game_concept_papal_bulls: "Päpstliche Bullen"
 game_concept_bull: "Bulle"
 game_concept_bulls: "Bullen"
 game_concept_papal_bull_desc: "Eine päpstliche Bulle ist ein feierliches Dekret, das vom [head_of_faith|E] eines [Concept('christian', 'christlichen')|E] [Concept('faith', 'Glaubens')|E] herausgegeben wird. Hinter dem Willen des Autors steht die volle Autorität der [Concept('the_christian_church', 'christlichen Kirche')|E].\n\nEin christliches [head_of_faith|E], das über ausreichend [church_authority|E] verfügt, kann eine Bulle durch die [decision|E] [GetDecisionWithKey('enact_a_bull_decision').GetName] verkünden und gibt [piety|E] aus, um:\n\n$EFFECT_LIST_BULLET$Einen [Concept('great_holy_war', 'großen Religionskrieg')|E] auszurufen\n$EFFECT_LIST_BULLET$Einen [rite|E] als [heresy|E] zu verurteilen\n$EFFECT_LIST_BULLET$Einen [core_tenet|E] als [permitted_tenet_status|El] oder [prohibited_tenet_status|El] festlegen"
 game_concept_situation_the_christian_church_phase: "Kapitel der christlichen Kirche"
 game_concept_the_christian_church_chapter_short: "Kapitel"
 game_concept_the_christian_church_chapters_short: "Kapitel"
 game_concept_situation_the_christian_church_phases: "Kapitel der christlichen Kirche"
 game_concept_situation_the_christian_church_phase_desc: "Kapitel sind die [situation_phases|E] der [Concept('the_christian_church', 'christlichen Kirche')|E]. Es gibt insgesamt sieben Kapitel, die in vier [the_christian_church_chapter_types|E] organisiert sind."
 game_concept_the_christian_church_chapter_type: "Kapitelart"
 game_concept_the_christian_church_chapter_types: "Kapitelarten"
 game_concept_the_christian_church_chapter_type_desc: "Es gibt vier $game_concept_the_christian_church_chapter_types$ in der [Concept('the_christian_church', 'christlichen Kirche')|E]. Sie ordnen die [situation_the_christian_church_phases|E] ein.\n\n$game_concept_the_christian_church_chapter_types$: [the_christian_church_unstable_short|E], [the_christian_church_crisis_short|E], [the_christian_church_zeal_short|E] und [the_christian_church_stability_short|E]"
 game_concept_the_christian_church_unstable: "Instabilitätskapitel"
 game_concept_the_christian_church_unstable_short: "Instabilität"
 game_concept_the_christian_church_unstable_desc: "Ein #high $game_concept_the_christian_church_unstable$#! der [Concept('the_christian_church', 'christlichen Kirche')|E] ist eine Zeit, in der Gehorsam knapp wird:\n\n[rulers|E] können leicht zu einem anderen [rite|E] verlockt werden, es gibt öfter Exkommunikationen und [gold|E] kann zum eigenen Vorteil ausgegeben werden.\n\n#high $fragile_unity$#! und #high $reform_phase$#! sind $game_concept_the_christian_church_unstable_short$s-[the_christian_church_chapters_short|E]."
 game_concept_the_christian_church_zeal: "Eiferkapitel"
 game_concept_the_christian_church_zeal_short: "Eifer"
 game_concept_the_christian_church_zeal_desc: "Ein #high $game_concept_the_christian_church_zeal$#! ist immer hitzig:\n\nEs kann zu Massenbekehrungen kommen, [great_holy_wars|E] sind häufiger, [papal_bulls|El] werden öfter verkündet und die Bekehrung des [Concept('faith', 'Glaubens')|E] kann leichter sein.\n\n#high $conversion_phase$#! und #high $crusade_phase$#! sind $game_concept_the_christian_church_zeal_short$-[the_christian_church_chapters_short|E]."
 game_concept_the_christian_church_stability: "Stabilitätskapitel"
 game_concept_the_christian_church_stability_short: "Stabilität"
 game_concept_the_christian_church_stability_desc: "Ein #high $game_concept_the_christian_church_stability$#! ist ein seltener Lichtblick für die [the_christian_church|El]:\n\nDer Bau eines [Concept('temple_holding', 'Tempelbesitztums')|E] ist günstiger, Großkathedralen kommen schneller voran, [characters|E] werden wahrscheinlicher [GetTrait('devoted').GetName(GetNullCharacter)|l] und das Große Schisma kann geheilt werden.\n\n#high $concord$#! ist das einzige $game_concept_the_christian_church_stability$."
 game_concept_the_christian_church_crisis: "Krisenkapitel"
 game_concept_the_christian_church_crisis_short: "Krise"
 game_concept_the_christian_church_crisis_desc: "Eine #high $game_concept_the_christian_church_crisis$#! zeigt die [the_christian_church|El] zu ihren schwächsten Zeiten:\n\nAblässe können billiger sein, [ecumenical_councils|El] sind häufiger, [rulers|E] können ihren eigenen [court_chaplain|E] einsetzen, der [clergy|E] kann heiraten, das [head_of_faith|E] kann sich weigern, eine [anointment|E] auszurichten, und die [taxes|E] können leiden.\n\n#high $saeculum_obscurum$#! und #high $investiture_crisis$#! sind $game_concept_the_christian_church_crisis_short$n-[the_christian_church_chapters_short|E]."
 game_concept_head_of_rite: "Ritus-Oberhaupt"
 game_concept_head_of_rite_desc: "Der führende [character|E] eines [rite|E]: das [head_of_faith|E], wenn es ihm folgt; ansonsten der Träger der [clerical_region|E], in der der Ritus die stärkste Anhängerschaft hat, und falls dies auch nicht möglich ist, der [ruler|E], der die meisten [counties|E] [rite_possessive|E] regiert.\n\nNur das $game_concept_head_of_rite$ kann die [core_tenets|E] und [doctrines|E] [rite_possessive|E] anpasen und er spricht auch für die Gläubigen, wenn die Kirche auf ein [schism|E] zugeht."
 game_concept_ecclesiastical: "kirchlich"
 game_concept_ecclesiastical_government: "Kirchenregierung"
 game_concept_ecclesiastical_i: "@government_type_ecclesiastical!"
 game_concept_ecclesiastical_desc: "Die kirchliche [government_form|E] ist eine [Concept('theocratic', 'theokratische')|E], wie sie [Concept('christian', 'christliche')|E] [clergy|E]-[rulers|E] wie [bishops|E] und [archbishops|E] aufweisen.\n\nDie meisten kirchlichen Herrscher sind theokratische [vassals|E], die ihre [temple_holdings|E] von einem weltlichen [Concept('liege', 'Lehnsherrn')|E] [Concept('lease', 'pachten')|E] und dem [head_of_faith|E] unterstehen, obwohl ein [bishop|E], der [Concept('landed', 'landbesitzende')|E] [titles|E] besitzt, die nicht [leased|El] sind, als ein [Concept('independent', 'unabhängiger')|E] kirchlicher [ruler|E] aus eigenem Recht herrschen darf. Die Macht, die solch ein Herrscher über seine eigenen [vassals|E] hat, wird von der [church_authority|E] festgelegt."
 game_concept_lease_contract: "Pachtbande"
 game_concept_lease_contract_desc: "Dies sind die rechtlichen Bedingungen, unter denen ein Charakter einen Titel [Concept('leasing', 'pachtet')|E]. Sie bestimmen auch darüber, wer sein [religious_superior|E] ist."
 game_concept_church_obligations: "Kirchenpflichten"
 game_concept_church_obligations_desc: "Kirchenpflichten stellen die kombinierten Abgaben für die Einnahmen eines [Concept('church_holding', 'Kirchenbesitztums')|E] dar. Diese Pflichten werden an den [Concept('superior', 'Oberen')|E], das [head_of_faith|E] und/oder den örtlichen weltlichen [ruler|E] gezahlt. Beispiele finden sich unter [church_centralization|E] und [secular_obligations|E]."
 game_concept_church_centralization: "Kirchenzentralisierung"
 game_concept_minimal_centralization: "Minimale Zentralisierung"
 game_concept_mild_centralization: "Mäßige Zentralisierung"
 game_concept_strong_centralization: "Starke Zentralisierung"
 game_concept_church_centralization_desc: "$game_concept_church_centralization$ bildet ab, bis zu welchem Maß die Kirche eine zentralisierte Autorität und Finanzstrukturen eingeführt hat. Stärkere Zentralisierung sorgt für einen stärkeren Einnahmestrom nach oben in der Kirchenhierarchie.\n\nDie Arten sind:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_minimal_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_mild_centralization$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_strong_centralization$"
 game_concept_secular_obligations: "Weltliche Pflichten"
 game_concept_personal_obligations: "Persönliche Pflichten"
 game_concept_fixed_obligations: "Feste Pflichten"
 game_concept_secular_obligations_desc: "$game_concept_secular_obligations$ stellen dar, welche Menge der Einnahmen durch [church_holdings|E] dem örtlichen [Concept('secular_ruler', 'weltlichen Herrscher')|E] gehören.\n\nDie Arten sind:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_personal_secular_obligations$\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_fixed_secular_obligations$\n\nIn manchen Kapiteln üben weltliche Herrscher örtliche Macht über die Kirche aus:\n$EFFECT_LIST_BULLET$$situation_parameter_the_christian_church_local_secular_power$"
 game_concept_religious_superior: "Glaubensoberer"
 game_concept_religious_superiors: "Glaubensobere"
 game_concept_superior: "Oberer"
 game_concept_religious_superior_desc: "Ein Glaubensoberer ist ein [character|E], der innerhalb eines Glaubens für ein oder mehr [Concept('subordinate', 'untergebene')|E] Mitglieder des Klerus einer hierarchischen Religionsstruktur verantwortlich ist."
 game_concept_religious_subordinate: "Glaubensuntergebener"
 game_concept_religious_subordinates: "Glaubensuntergebene"
 game_concept_subordinate: "Untergebener"
 game_concept_subordinates: "Untergebene"
 game_concept_religious_subordinate_desc: "Ein Glaubensuntergebener ist ein [character|E], der einen [Concept('religious_superior', 'Glaubensoberen')|E] innerhalb einer hierarchischen Religionsstruktur besitzt."
 game_concept_clerical_region: "Kirchenregion"
 game_concept_clerical_regions: "Kirchenregionen"
 game_concept_clerical_region_possessive: "der Kirchenregion"
 game_concept_clerical_regions_possessive: "der Kirchenregionen"
 game_concept_clerical_region_desc: "Eine Kirchenregion ist eine geografische Region, die unter die Verantwortlichkeit eines [Concept('clerical_title', 'Kirchentitels')|E] fällt. Alle Mitglieder des Klerus in der Region sind automatisch [Concept('subordinate', 'Untergebene')|E] des [title|E]-Trägers der Region.\n\nEin [ruler|E] gehört der Kirchenregion an, die den [capital|E] der [county|E] umfasst, und eine neue Region beruht auf dem [capital|E] des [Concept('primary_title', 'Haupttitels')|E] des Gründers. Die Region kann mehrere [realms|E] abdecken und somit auch Untergebene aus verschiedenen Reichen aufweisen.\n\nEin $game_concept_ruler$ kann nur eine $game_concept_clerical_region$ zur Zeit halten. Wenn ihm eine neue Region gewährt wird, gibt der Herrscher alles gehaltene Land in der vorherigen auf."
 game_concept_clerical_region_capital: "Kirchenregionshauptsitz"
 game_concept_clerical_region_capitals: "Kirchenregionshauptsitze"
 game_concept_clerical_region_capital_desc: "Der Kirchenregionshauptsitz ist die [county|E], in der eine [clerical_region|E] mit einem [ecclesiastical_estate|E] gegründet wurde und die als der Sitz des [Concept('clerical_title', 'Kirchentitels')|E] dient, der die Region regiert. Anders als ein [de_jure_capital|E] ist er an die Region gebunden und kann nicht verlegt werden."
 clerical_electors: "Kirchenwahlleute"
 game_concept_archdiocese: "Erzdiözese"
 game_concept_archdioceses: "Erzdiözesen"
 game_concept_archdiocese_desc: "Eine Erzdiözese ist die [Concept('christian', 'christliche')|E] Form einer [clerical_region|E], eine kirchliche Domäne, die von einem [archbishop|E] durch seinen [clerical_title|E] regiert wird und die in einer Hauptsitz-[county|E] liegt, wo eine [grand_cathedral|E] errichtet werden kann.\n\nEin [Concept('christian', 'christlicher')|E] [ruler|E] folgt in spirituellen Angelegenheiten dem [archbishop|E] der Erzdiözese, die seine [capital|E]-[county|E] umfasst, und das den Erzdiözesen unterstehende Gebiet umfasst insgesamt die vollständige [situation|E] namens [the_christian_church|EU]."
 game_concept_grand_cathedral: "Großkathedrale"
 game_concept_grand_cathedrals: "Großkathedralen"
 game_concept_grand_cathedral_desc: "Eine Großkathedrale ist ein [great_building|E], das über ein [great_project|E] im Hauptsitz einer [archdiocese|E], dem Sitz ihres [Concept('archbishop', 'Erzbischofs')|E], errichtet wird.\n\nDie Errichtung der ersten Kathedrale ist ein denkwürdiger Akt der Frömmigkeit: Der Gründer erhält anhaltende [piety|E], [legitimacy|E] und [spiritual_fulfillment|El], einen Platz für einen weiteren [Concept('personal_tenet', 'persönlichen Grundsatz')|E] sowie einen dauerhaften Bonus in Sachen selber [Concept('faith', 'Glaubens')|E]-[opinion|E]. Sobald die Großkathedrale errichtet wurde, zieht sie christliche Pilger aus der ganzen [christendom|E] an und erweitert die [cathedral_complex|E]. Man kann sie später zu einer [GetBuilding('great_project_cathedral_02').GetName|V] oder [GetBuilding('great_project_cathedral_03').GetName|V] erweitern."
 game_concept_monastic_holy_order: "Klosterorden"
 game_concept_monastic_holy_orders: "Klosterorden"
 game_concept_monastic_holy_order_possessive: "des Klosterordens"
 game_concept_monastic_holy_orders_possessive: "der Klosterorden"
 game_concept_monastic: "klösterlich"
 game_concept_monastic_holy_order_i: "@government_type_monastic_holy_order!"
 game_concept_monastic_holy_order_desc: "Ein Klosterorden ist eine Unterart eines [Concept('holy_order', 'Ordens')|E], der sich dem Gebet, der Bildung und der Verbreitung eines einzelnen [Concept('core_tenet', 'Grundsatzes')|E] hingibt. Er gehört dem [rite|E] seines Gründers an, vertritt einen seiner [core_tenets|E] und verbreitet seine Praxis unter den Gläubigen.\n\nVon einem [archabbot|E] angeführt wird ein Klosterorden von den [Concept('temple_holdings', 'Tempelbesitztümern')|E] und dem [gold|E] unterhalten, das ihm seine [monastic_order_patrons|E] gewähren. Der Orden bietet dann im Gegenzug [spiritual_fulfillment|El] und [piety|E].\n\nJeder [ruler|E], dessen [Concept('faith', 'Glauben')|E] das Mönchstum erlaubt, kann einen solchen Orden mit der [decision|E] #high Klosterorden gründen#! erschaffen."
 game_concept_monastic_order_patron: "Klosterorden-Gönner"
 game_concept_monastic_order_patrons: "Klosterorden-Gönner"
 game_concept_monastic_order_patronize: "spenden"
 game_concept_monastic_order_patronized: "finanziert"
 game_concept_monastic_order_patronage: "Patronat"
 game_concept_monastic_order_patron_desc: "Ein Klosterorden-Gönner ist ein [Concept('ecclesiastical', 'kirchlicher')|E] oder weltlicher [ruler|E] des [Concept('title_tier', 'Titelrangs')|E] [duchy|E] oder höher, der einen [monastic_holy_order|E] unterstützt und zumeist der Herrscher ist, der ihn gegründet hat. Ein Gönner stattet den Orden mit weltlichem Reichtum aus, verpachtet ihm [temple_holdings|E] und spendet [gold|E] an seine Schatzkammern.\n\nIm Gegenzug für diese Großzügigkeit verdient sich der Gönner [piety|E] und [spiritual_fulfillment|El]. Er kann auch die Kontrolle über den Anführer des Ordens übernehmen und ihn als [puppet|E] [Concept('clerical', 'kirchliche')|E] Interaktionen ausführen lassen."
 game_concept_mendicant: "Bettelgeschwister"
 game_concept_rite: "Ritus"
 game_concept_rite_possessive: "des Ritus"
 game_concept_rites_possessive: "der Riten"
 game_concept_rite_desc: "Ein Ritus ist ein Zweig eines [Concept('faith', 'Glaubens')|E]: eine örtliche Spielart seiner religiösen Praktiken, die von einem [head_of_rite|E] angeführt wird und der [counties|E] und [characters|E] folgen können. Jeder Glaube hat einen [mainline_rite|E] und kann mehrere weitere entwickeln.\n\nEin Ritus bestimmt sich über die [core_tenets|E] und [doctrines|E], die er vor allem vertritt. Ob ein Grundsatz [permitted_tenet_status|El] oder [prohibited_tenet_status|El] ist, entscheidet der [faith|E] durch seinen [mainline_rite|E] – je deutlicher die Entscheidungen [rite_possessive|E] sich von diesem Urteil unterscheiden, desto höher ist seine [rite_divergence|E]: Abweichende Riten schwächen den [fervor|E] [faithpossessive|E] und können als [heresy|E] gesehen werden – und bei #V 100#! [divergence|E] lösen sie sich ganz als eigener [faith|E].\n\nNeue Riten können von frommen Menschen gegründet werden, und [rulers|E] können von einem Ritus zu einem anderen hin verlockt werden, doch nur das [head_of_rite|E] kann einen Ritus anpassen."
 game_concept_rites: "Riten"
 game_concept_archabbot: "Abt"
 game_concept_archabbot_desc: "Ein $game_concept_archabbot$ ist der [ruler|E] eines [Concept('monastic_holy_order', 'Klosterordens')|E] und das [head_of_rite|E] jenes [rite|E], für den sich sein Orden einsetzt. Er führt seine Mitglieder im Studium, in der Kontemplation und in der Verbreitung der [core_tenets|E].\n\nEin Orden kann durch einen [monastic_order_patron|E] unterstützt werden, dessen [monastic_order_patronage|E] seinen Reichtum und seinen Einfluss sicherstellt.\n\nStirbt ein $game_concept_archabbot$, gehen seine [titles|E] auf einen Nachfolger über, üblicherweise sein [courtier|E] mit der höchsten [learning|E]."
 game_concept_archbishop: "Erzbischof"
 game_concept_archbishops: "Erzbischöfe"
 game_concept_archbishop_possessive: "des Erzbischofs"
 game_concept_archbishops_possessive: "der Erzbischöfe"
 game_concept_archbishop_desc: "Ein Erzbischof ist der christliche Inhaber einer [archdiocese|E], ein [clerical_title|E] im Rang eines Herzogtums, dessen [clerical_region|E] mehrere [realms|E] umfassen kann.\n\nAls der [religious_superior|E] der [bishops|E] und des niederen [clergy|E] in der Region steht ein Erzbischof über einem gewöhnlichen [bishop|E] und untersteht selbst dem [head_of_faith|E]."
 game_concept_bishop: "Bischof"
 game_concept_bishops: "Bischöfe"
 game_concept_bishop_possessive: "des Bischofs"
 game_concept_bishops_possessive: "der Bischöfe"
 game_concept_bishop_desc: "Ein $game_concept_bishop$ ist ein Mitglied des [clergy|E] eines christlichen [Concept('faith', 'Glaubens')|E] und hält oder pachtet [temple_holdings|E].\n\nEin Bischof residiert in einer [archdiocese|E] und untersteht dem dortigen [archbishop|E] als seinem [Concept('religious_superior', 'Glaubensoberen')|E]. Ein landloser Bischof mit [leased|El] Titeln dient unter einem weltlichen [Concept('liege', 'Lehnsherrn')|E]; ein Bischof mit nicht gepachteten [Concept('landed', 'landbesitzenden')|E] [titles|E] darf als [Concept('ecclesiastical', 'kirchlicher')|E] [ruler|E] herrschen."
 game_concept_rite_divergence: "Abweichung"
 game_concept_rite_divergent: "abweichend"
 game_concept_divergence: "Abweichung"
 game_concept_divergence_desc: "$game_concept_rite_divergence_desc$"
 game_concept_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_i: "@divergence_icon!"
 game_concept_rite_divergence_desc: "Die Abweichung bemisst, wie stark sich [core_tenets|E] und [doctrines|E] [rite_possessive|E] vom Mutter-[Concept('faith', 'Glauben')|E] entfernt haben. Ein Ritus, der [Concept('prohibited_tenet_status', 'verbotene')|E] Grundsätze als [core_tenet_status|E] angenommen hat, ist abweichender.\n\nEine hohe Abweichung schwächt den [fervor|E] des Mutterglaubens, was Ausbrüche von [heresy|E] häufiger macht. Ein Ritus, der #V 100#! Abweichung erreicht, wird automatisch zur Ketzerei erklärt und ein neuer [faith|E]."
 game_concept_spiritual_fulfillment: "spirituelle Erfüllung"
 game_concept_spiritual_fulfillment_desc: "Die $game_concept_spiritual_fulfillment$ ist ein Maß dafür, wie sehr ein [character|E] meint, im Einklang mit seinem [faith|E] zu sein.\n\nDer Grundwert berechnet sich anhand der [traits|E], die er besitzt, und daran, ob er als [sinful|El] oder [virtuous|El] gilt.\n\n$game_concept_spiritual_fulfillment$ kann durch Taten erlangt oder verloren werden, die der [faith|E] für angemessen hält, und [personal_tenets|El] können angenommen werden, um schädliche Eigenschaften auszugleichen."
 game_concept_fulfillment: "Erfüllung"
 game_concept_spiritual_fulfillment_i: "@spiritual_fulfillment_icon!"
 game_concept_spiritual_fulfillment_level: "Spirituelle Erfüllungsstufe"
 game_concept_spiritual_fulfillment_levels: "Spirituelle Erfüllungsstufen"
 game_concept_spiritual_fulfillment_level_desc: "Die [spiritual_fulfillment|El] [character_possessive|E] unterteilt sich durch Schwellenwerte in $game_concept_spiritual_fulfillment_levels$, die jeweils eigene Auswirkungen aufweisen.\n\nNiedrige Stufen machen das Leben schwerer und sündige Taten günstiger. Hohe Stufen machen die Hingabe leichter und eröffnen neue religiöse Möglichkeiten."
 game_concept_personal_tenet: "persönlicher Grundsatz"
 game_concept_personal_tenet_desc: "Ein persönlicher Grundsatz ist ein [core_tenet|E], den ein [ruler|E] als wesentlichen Bestandteil seiner Spiritualität annimmt.\n\nDie Annahme eines persönlichen Grundsatzes, der im [core_tenet_status|E] seines [Concept('faith', 'Glaubens')|E] steht oder in selbigem [permitted_tenet_status|El] wurde, gewährt [spiritual_fulfillment|El], während die Annahme eines Grundsatzes, der [prohibited_tenet_status|E] ist, zu einem [secret|E] führt. Persönliche Grundsätze bieten auch zusätzliche Auswirkungen und freischaltbare Sondermechaniken.\n\nDie Zahl der persönlichen Grundsätze, denen ein Charakter anhängen kann, wird durch seine [piety_level|E] sowie die [GetTrait('theologian').GetName(GetNullCharacter)]-[trait|E] beeinflusst."
 game_concept_personal_tenets: "persönliche Grundsätze"
 game_concept_personal_tenets_desc: "$game_concept_personal_tenet_desc$"
 game_concept_cardinal: "Kardinal"
 game_concept_cardinals: "Kardinäle"
 game_concept_cardinal_possessive: "des Kardinals"
 game_concept_cardinals_possessive: "der Kardinäle"
 game_concept_cardinalate: "Kardinalat"
 game_concept_cardinalates: "Kardinalate"
 game_concept_cardinal_desc: "Ein Mitglied des [clergy|e], das vom Papst ausgewählt wird, um dabei zu helfen, den Willen der [Concept('the_christian_church', 'christlichen Kirche')|E] zu verbreiten. Alle Mitglieder des [Concept('college_of_cardinals', 'Kardinalskollegiums')|E] sind sowohl Kandidaten als auch Wahlleute für das Pontifikat und besitzen einen [papabile_score|E]."
 game_concept_college_of_cardinals: "Kardinalskollegium"
 game_concept_college_of_cardinals_desc: "Das $game_concept_college_of_cardinals$ ist die Institution von [Concept('cardinals', 'Kardinälen')|E], die den Papst berät und das nächste [head_of_faith|E] der [Concept('the_christian_church', 'christlichen Kirche')|E] wählt.\n\nJeder [cardinal|E] ist sowohl Kandidat als auch Wahlmann für das Pontifikat."
 game_concept_papabile_score: "Papabilewert"
 game_concept_papabile_scores: "Papabilewerte"
 game_concept_papabile_score_desc: "Alle Mitglieder des [Concept('college_of_cardinals', 'Kardinalskollegiums')|E] besitzen einen $game_concept_papabile_score$, der ihre [traits|E], ihre [piety_level|E], ihren [rite|E] und die [opinion|E] anderer Kardinäle berücksichtigt.\n\nDie [cardinals|E] mit dem höchsten $game_concept_papabile_score$ werden wahrscheinlich mehr Stimmen während einer Papstwahl erhalten.\n\nDer $game_concept_papabile_score$ kann durch die [character_interaction|E] #high $increase_papabile_score_interaction$#! und die [decision|E] „[GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName]“ gesteigert werden."
 game_concept_mainline_rite: "Hauptlinienritus"
 game_concept_mainline_rite_desc: "Der Hauptlinien-[rite|E] stellt die am weitesten verbreitete Reihe von Überzeugungen in einem [Concept('faith', 'Glauben')|E] dar. Ein Nicht-Hauptlinien-$game_concept_rite$ gilt als [rite_divergent|El] von diesem $game_concept_rite$.\n\nWelcher $game_concept_rite$ die Hauptlinie ist, hängt davon ab, ob ein $game_concept_faith$ ein [head_of_faith|E] hat.\n\nHat der $game_concept_faith$ ein $game_concept_head_of_faith$, ist der Hauptlinien-$game_concept_rite$ immer der, dem dieses Oberhaupt folgt. Das heißt auch, dass er sich ändern kann, wenn ein Nachfolger, der einem anderen $game_concept_rite$ folgt, seinen Platz einnimmt – einschließlich eines möglichen [Concept('challenger_hof', 'Herausforderer-Oberhaupts')|E].\n\nOhne ein $game_concept_head_of_faith$ ersetzt jeder $game_concept_rite$ ihn, der mehr Anhänger-[counties|E] als die Hauptlinie ansammelt, sofern er mindestens so viele [holy_sites|El] wie jener $game_concept_rite$ hält, die er ersetzt."
 game_concept_mainline_rites: "Hauptlinienriten"
 game_concept_mainline_rite_short: "Hauptlinie"
 # Tenet & Doctrine Status (Rite-side stance)
 game_concept_tenet_status: "Grundsatzstatus"
 game_concept_tenet_status_desc: "Der $game_concept_tenet_status$ beschreibt die Haltung eines [rite|E] zu einem [core_tenet|E] oder einer [doctrine|E]. Dieselbe fünfstufige Skala gilt für beide. Hier sind die Stufen nach ihrer wachsenden Bedeutung sortiert:\n\n$EFFECT_LIST_BULLET$[unknown_tenet_status|EU]: Der $game_concept_rite$ kennt diesen $game_concept_core_tenet$ oder diese $game_concept_doctrine$ nicht.\n$EFFECT_LIST_BULLET$[known_tenet_status|EU]: Der $game_concept_rite$ weiß von ihr, doch diese Praktik wird weder unterstützt noch abgelehnt.\n$EFFECT_LIST_BULLET$[permitted_tenet_status|EU]: Der $game_concept_rite$ heißt diese Praktik gut.\n$EFFECT_LIST_BULLET$[prohibited_tenet_status|EU]: Der $game_concept_rite$ untersagt diese Praktik ausdrücklich.\n$EFFECT_LIST_BULLET$ [core_tenet_status|E]: Der $game_concept_rite$ fördert das Praktizieren dieses $game_concept_core_tenet$es tatkräftig.\n\nDer Status bei einem $game_concept_rite$ in Bezug auf einen $game_concept_core_tenet$ oder eine $game_concept_doctrine$ bestimmt darüber, ob man sie beim Erstellen oder Ableiten eines $game_concept_rite$ auswählen kann und ob [followers|E] spirituelle Mali erleiden, wenn sie damit zu tun haben.\n\nDies ist etwas anderes als das [tenet_knowledge|E] eines [Concept('character', 'Charakters')], denn dabei handelt es sich um seine persönliche Kenntnis und nicht um die Haltung des $game_concept_rite$."
 game_concept_doctrine_status_desc: "$game_concept_tenet_status_desc$"
 game_concept_unknown_tenet_status: "unbekannt"
 game_concept_unknown_tenet_status_desc: "Ein $game_concept_unknown_tenet_status$er [tenet_status|E] bedeutet, dass der [rite|E] diesen [core_tenet|E] oder diese [doctrine|E] gar nicht kennt. [followers|E] des $game_concept_rite$ wissen nicht zwingend davon und dieses Element bei der Schaffung eines neuen $game_concept_rite$ oder als [Concept('personal_tenet', 'persönlichen Grundsatz')|E] nicht auswählen."
 game_concept_known_tenet_status: "bekannt"
 game_concept_known_tenet_status_desc: "Ein $game_concept_known_tenet_status$er [tenet_status|E] bedeutet, dass der [rite|E] von diesem [core_tenet|E] oder dieser [doctrine|E] weiß, aber die Praktik weder gutheißt noch erlaubt. Dieses Element kommt beim Verfassen oder Ableiten des $game_concept_rite$ infrage und kann auf einen höheren [tenet_status|E] angehoben werden."
 game_concept_permitted_tenet_status: "erlaubt"
 game_concept_permit_tenet_status: "erlauben"
 game_concept_permitted_tenet_status_desc: "Ein $game_concept_permitted_tenet_status$er [tenet_status|E] bedeutet, dass der [rite|E] diesen [core_tenet|E] oder diese [doctrine|E] gutheißt, ohne eine tatkräftige Förderung zu betreiben. Ein [character|E] des $game_concept_rite$ kann den $game_concept_core_tenet$ als [Concept('personal_tenet', 'persönlichen Grundsatz')|E] ohne spirituelle Mali annehmen."
 game_concept_prohibited_tenet_status: "verboten"
 game_concept_prohibit_tenet_status: "verbieten"
 game_concept_prohibited_tenet_status_desc: "Ein $game_concept_prohibited_tenet_status$er [tenet_status|E] bedeutet, dass der [rite|E] diesen [core_tenet|E] oder diese [doctrine|E] ausdrücklich verbietet. Ein [character|E] mit diesem $game_concept_rite$, der den $game_concept_core_tenet$ als einen [Concept('personal_tenet', 'persönlichen')|E] annimmt, behandelt ihn als [secret|E], und ein $game_concept_rite$, der [Concept('prohibited_tenet_status', 'verbotene')|E] [core_tenets|E] als [core_tenet_status|E] annimmt, erhält mehr [Concept('rite_divergent', 'Abweichung')|E] von seinem [Concept('faith', 'Glauben')|E]."
 game_concept_core_tenet_status: "Kern"
 game_concept_core_tenet_status_desc: "Ein $game_concept_core_tenet_status$-[tenet_status|E] bedeutet, dass der [rite|E] diesen [core_tenet|E] oder diese [doctrine|E] als eine seiner eigenen wesentlichen Praktiken tatkräftig fördert. Alle [followers|E] des $game_concept_rite$ unterliegen seinen Auswirkungen."
 # Character Knowledge of Tenets and Doctrines
 game_concept_tenet_knowledge: "Religionswissen"
 game_concept_doctrine_knowledge: "Doktrinwissen"
 game_concept_rite_knowledge: "Rituswissen"
 game_concept_agnostic_knowledge: "Wissen"
 game_concept_tenet_knowledge_desc: "Charaktere kennen nicht alle Einzelheiten jeder religiösen Praktik.\n\nBekannte Grundsätze und Doktrinen können bei der Erschaffung eines [Concept('rite_divergent', 'abweichenden')|E] $game_concept_rite$ verwendet und als [personal_tenets|El] angenommen werden. Alle $game_concept_core_tenets$ und $game_concept_doctrines$ eines $game_concept_rite$ zu kennen, macht das Konvertieren leicht.\n\nAlle [core_tenets|E] und [doctrines|E] in Eurem [Concept('faith', 'Glauben')|E] sind Euch bekannt. Neues Wissen kann durch Beziehungen wie [spouses|E] oder [friends|E], [traveling|EU], [activities|E] oder das Ritusstudium-[scheme|E] erlangt werden."
 game_concept_doctrine_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_rite_knowledge_desc: "$game_concept_tenet_knowledge_desc$"
 game_concept_enshrined: "verwahrt"
 game_concept_enshrine: "verwahren"
 game_concept_enshrined_desc: "Eine in einer [Concept('holy_site', 'heiligen Stätte')|E] verwahrtes [holy_relic|E] aktiviert die Boni der heiligen Stätte und verbessert auch die durch die Stätte gewährten Boni, was mit der Gesamt-[Concept('rarity', 'Seltenheitsstufe')|E] aller verwahrten Artefakte skaliert.\n\nEin verwahrtes Artefakt wird nicht länger von einem Charakter besessen, der [holder|E] der heiligen Stätte, der [Concept('top_liege', 'oberste Lehnsherr')|E] oder der Inhaber der [clerical_region|E] können allerdings nach wie vor damit interagieren. Das Artefakt verfällt nicht mehr. Ihr könnt nur Sakralreliquien Eures eigenen [Concept('faith', 'Glaubens')|E] verwahren; verwahrte Saklarreliquien anderer Glaubensrichtungen bieten keinen Vorteil.\n\nEs kann auch Belohnungen oder Kosten geben, die mit der Verwahrung oder Entfernung eines verwahrten Artefakts zusammenhängen."
 game_concept_holy_relic: "Sakralreliquie"
 game_concept_holy_relics: "Sakralreliquien"
 game_concept_holy_relic_desc: "Eine $game_concept_holy_relic$ ist ein [artifact|E], das eine religiöse Bedeutung für einen [Concept('faith', 'Glauben')|E] hat. Eine $game_concept_holy_relic$ kann in einer [Concept('holy_site', 'heiligen Stätte')|E] dieses Glaubens [enshrined|El] werden, um Vorteile zu erlangen.\n\nManche Artefakte sind von sich aus heilig für einen Glauben, doch Artefakte können auch [sanctified|El] werden, damit sie eine Sakralreliquie werden."
 game_concept_sanctified: "geweiht"
 game_concept_sanctify: "weihen"
 game_concept_sanctifying: "weihend"
 game_concept_sanctified_desc: "Ein [artifact|E] zu weihen, lässt es zu einer [holy_relic|E] für einen [Concept('faith', 'Glauben')|E] werden. Ein Artefakt kann auch von mehreren Glaubensrichtungen geweiht werden."
 # Ecclesiastical Estate
 game_concept_ecclesiastical_domicile: "$game_concept_ecclesiastical_estate$"
 game_concept_ecclesiastical_domiciles: "$game_concept_ecclesiastical_estates$"
 game_concept_ecclesiastical_domicile_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_ecclesiastical_domicile_building: "$game_concept_ecclesiastical_estate_building$"
 game_concept_ecclesiastical_domicile_buildings: "$game_concept_ecclesiastical_estate_buildings$"
 game_concept_ecclesiastical_domicile_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_ecclesiastical_estate: "Kirchenanwesen"
 game_concept_ecclesiastical_estates: "Kirchenanwesen"
 game_concept_ecclesiastical_estate_desc: "Ein $game_concept_ecclesiastical_estate$ (oder eine $game_concept_cathedral_complex$) ist eine Art von [domicile|E], das zu einem [clerical_title|E] gehört und den engsten Landbesitz eines [Concept('archbishop', 'Erzbischofs')|E] und seines Stuhls darstellt. Niederer [clergy|E] in einer [GetGovernment('ecclesiastical_government').GetName] muss zu so einem [title|E] aufsteigen, bevor er ihm gewährt werden kann.\n\n[ecclesiastical_estate_buildings|E] können hier gebaut werden, um Reichtum, [piety|E] und [spiritual_fulfillment|El] des Trägers zu mehren. Das $game_concept_ecclesiastical_estate$ ändert seinen Standort nicht und wird an den nächsten Titel-[holder|E] vererbt."
 game_concept_ecclesiastical_estate_building: "Kirchenanwesengebäude"
 game_concept_ecclesiastical_estate_buildings: "Kirchenanwesengebäude"
 game_concept_ecclesiastical_estate_building_desc: "$game_concept_ecclesiastical_estate_buildings$ sind einzigartige und dauerhafte Verbesserungen eines [Concept('ecclesiastical_estate', 'Kirchengebäudes')|E].\n\nDer Träger kann eine Vielzahl von Bauwerken errichten, um private Einnahmen, [piety|E] und [spiritual_fulfillment|El] zu erlangen sowie Zugriff auf eine Reihe von [decisions|E], [interactions|E] und noch weitere Dinge zu erhalten."
 game_concept_cathedral_complex: "Kathedralenanlage"
 game_concept_cathedral_complexes: "Kathedralenanlagen"
 game_concept_cathedral_complex_desc: "$game_concept_ecclesiastical_estate_desc$"
 game_concept_cathedral_complex_building: "$game_concept_cathedral_complex$-Gebäude"
 game_concept_cathedral_complex_buildings: "$game_concept_cathedral_complex$-Gebäude"
 game_concept_cathedral_complex_building_desc: "$game_concept_ecclesiastical_estate_building_desc$"
 game_concept_canonized: "kanonisiert"
 game_concept_canonized_desc: "Ein [character|E], der nach dem Tod zu einem Heiligen (oder dem entsprechenden Gegenstück in seinem Glauben) erklärt wird – beispielsweise ein Wali oder geehrter Ahne –, erhält die [trait|E] [GetTrait('saint').GetName(GetNullCharacter)].\n\nEin tugendhaftes Leben kann zu einer $game_concept_canonization$ führen: Dies wird durch eine [decision|E] erbeten, kann den Segen des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] erfordern und wird durch die Weihe der Begräbnisstätte des Heiligen besiegelt. Seine Ruhestätte wird im Anschluss fromme Reisende anziehen und seine Überreste können [holy_relics|E] ergeben."
 game_concept_canonization: "Kanonisierung"
 game_concept_canonization_desc: "$game_concept_canonized_desc$"
 game_concept_sainthood: "Heiligsprechung"
 game_concept_sainthood_desc: "$game_concept_canonized_desc$"
 game_concept_strengthen_claim_interaction: "$strengthen_claim_interaction$"
 game_concept_strengthen_claim_interaction_desc: "Eine [interaction|E], die einen [Concept('unpressed_claim', 'fallen gelassenen Anspruch')|E] zu einem [Concept('pressed_claim', 'durchgesetzten')|E] verstärkt, indem ein [Concept('ecclesiastical', 'kirchlicher')|E] oder [Concept('theocratic', 'theokratischer')|E] [ruler|E] ihn bestätigt."
 game_concept_ecclesiastic_grant_claim_interaction: "$ecclesiastic_grant_claim_interaction$"
 game_concept_ecclesiastic_grant_claim_interaction_desc: "Eine [interaction|E], die einen [claim|E] auf einen [title|E] verschafft, der einem anderen [ruler|E] gehört. Erfordert die Annahme des entsprechenden [Concept('ecclesiastical', 'kirchlichen')|E] oder [Concept('theocratic', 'theokratischen')|E] [Concept('character', 'Charakters')|E]."
 game_concept_ecclesiastic_transfer_land_interaction: "$ecclesiastic_transfer_land_interaction$"
 game_concept_ecclesiastic_transfer_land_interaction_desc: "Eine [interaction|E], die die friedliche Übertragung eines [Concept('title', 'Titels')|E] oder [Concept('vassal', 'Vasallen')|E] zwischen zwei [Concept('rulers','Herrschern')|E] erlaubt, wenn der Ziel-[ruler|E] und ein zweiter Eingreifender annehmen.\n\nEine Weigerung kostet den Empfänger [piety|E] und [legitimacy|E] und hat weitere Kosten, die vom Handelnden ausgewählt werden, um die Annahme zu fördern.\n\nDer Eingreifende, ein entsprechender [Concept('ecclesiastical', 'kirchlicher')|E] oder [Concept('theocratic', 'theokratischer')|E] Herrscher, kann einerseits untersagen, dass diese Interaktion überhaupt stattfindet, und anderseits die Annahme über das [law|E] „[GetLaw('church_authority_3').GetName]“ sogar erzwingen."
 game_concept_challenger_hof: "Herausforderer-Glaubensoberhaupt"
 game_concept_antipope: "Gegenpapst"
 game_concept_challenger_hof_desc: "Ein $game_concept_challenger_hof$ ist ein rivalisierendes [head_of_faith|E], dass sich gegen das $game_concept_head_of_faith$ des [mainline_rite|E] erhebt.\n\nEin [ruler|E] kann ein Mitglied des eigenen [clergy|E] als $game_concept_challenger_hof$ unterstützen. Ein [clergy|E]-[ruler|E] oder Herrscher eines [Concept('faith', 'Glaubens')|E] mit einem weltlichen Glaubensoberhaupt kann sich sogar selbst zum Herausforderer machen.\n\nEin finanziertes $game_concept_challenger_hof$ übernimmt den [rite|E] des Gönners, wird zu dessen [external_clerical_puppet|E] und schuldet ihm ein [weak_hook|El].\n\nDas $game_concept_mainline_rite$-$game_concept_head_of_faith$ kann niemanden [excommunicate|El], der dem $game_concept_challenger_hof$ folgt: den Gönner und seine [vassals|E].\n\nJeder, der einem $game_concept_challenger_hof$ folgt, trägt seine kirchlichen Bitten ihm vor statt dem $game_concept_head_of_faith$ des $game_concept_mainline_rite$. Darunter fallen auch diese [interactions|E]:\n$EFFECT_LIST_BULLET$[petition_antipope_indulgences_interaction|E]\n$EFFECT_LIST_BULLET$[petition_antipope_gold_interaction|E]\n\nEin $game_concept_challenger_hof$ oder sein Gönner können den [casus_belli|E] [pam_challenge_hof_cb|E] gegen das legitime $game_concept_head_of_faith$ einsetzen.\n\nRivalisierende [kings|E] oder darüber desselben [Concept('faith', 'Glaubens')|E] können stattdessen [pam_antiking_cb|E] gegen den Gönner einsetzen und so den rivalisierenden Anspruchsteller absetzen."
 game_concept_antipope_desc: "$game_concept_challenger_hof_desc$"
 game_concept_pam_challenge_hof_cb: "Glaubensoberhaupt-Herausforderung"
 game_concept_pam_challenge_hof_cb_desc: "Ein [casus_belli|E], der von einem [challenger_hof|E] oder seinem Gönner gegen ein legitimes [head_of_faith|E] ihres [Concept('faith', 'Glaubens')|E] genutzt wird. Der Sieg setzt den $game_concept_challenger_hof$ als [head_of_faith|E] ein und macht seinen [rite|E] zum [mainline_rite|E]. Ein Gönner, der den Krieg gewinnt, und einen höheren Rang als sein $game_concept_challenger_hof$ hat, macht diesen auch zum [Concept('vassal', 'Vasallen')|E]."
 game_concept_pam_antiking_cb: "Gegenpapst-Absetzung"
 game_concept_pam_antiking_cb_desc: "Ein [casus_belli|E], der für [Concept('christian', 'christliche')|E] [kings|E] und mächtigere Herrscher verfügbar ist, die weder einen [challenger_hof|E] finanzieren noch als einer dienen. Er ist gegen einen [Concept('independent', 'unabhängigen')|E] Gönner des eigenen [Concept('faith', 'Glaubens')|E] gerichtet, um dessen $game_concept_challenger_hof$ abzusetzen und die Dankbarkeit des rechtmäßigen [Concept('head_of_faith', 'Glaubensoberhaupts')|E] zu erlangen."
 game_concept_petition_antipope_indulgences_interaction: "Ablass vom Gegenpapst erbitten"
 game_concept_petition_antipope_indulgences_interaction_desc: "Eine [interaction|E], die jedem zur Verfügung steht, der einem [challenger_hof|E] folgt. Zahlt [gold|E] an Euren $game_concept_antipope$ für Vergebung und [piety|E], wobei Ihr den [mainline_rite|E] des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] umgeht. Vom Gönner kommend wird die Bitte automatisch angenommmen."
 game_concept_petition_antipope_gold_interaction: "Den Gegenpapst um Gold bitten"
 game_concept_petition_antipope_gold_interaction_desc: "Eine [interaction|E], die jedem zur Verfügung steht, der einem [challenger_hof|E] folgt. Erbittet [gold|E] von Eurem $game_concept_antipope$. Vom Gönner kommend wird die Bitte automatisch angenommmen."
 game_concept_pam_shape_the_christian_church_decision: "$pam_shape_the_christian_church_decision$"
 game_concept_pam_shape_the_christian_church_decision_desc: "Eine [decision|E], die Prälaten und mächtigen Herrschern zur Verfügung steht, um die [the_christian_church|El] hin zu einem Kapitel ihrer Wahl zu schieben."
 game_concept_tenet_popularity: "Grundsatzbeliebtheit"
 game_concept_tenet_popularity_desc: "Wenn sich [personal_tenets|El] in einem [Concept('faith', 'Glauben')|E] verbreiten, wird ihre Auslebung häufiger. Die $game_concept_tenet_popularity$ zeigt an, wie verbreitet ein [core_tenet|E] ist, und wirkt sich darauf aus, wie wahrscheinlich er im Rahmen eines [Concept('ecumenical_council', 'ökumenischen Konzils')|E] als Debattenthema oder als Ziel einer [Concept('papal_bull', 'päpstlichen Bulle')|E] ausgewählt wird.\n\nJe höher die $game_concept_tenet_popularity$ ist, desto größere Teile des [clergy|E] schlagen sich auf die Seite eines Grundsatzes, wenn er bei einem [Concept('ecumenical_council', 'ökumenischen Konzil')|E] diskutiert wird. Sobald ein Grundsatz #high [EmptyScope.ScriptValue('pam_tenet_popularity_ai_override_threshold')|0]#! $game_concept_tenet_popularity$ erreicht, wird das [head_of_faith|E] ihn wahrscheinlich für [permitted_tenet_status|El] erklären, ungeachtet der eigenen Überzeugungen."
 game_concept_ecumenical_council_innovator: "Innovator"
 game_concept_ec_innovator: "$game_concept_ecumenical_council_innovator$"
 game_concept_ecumenical_council_innovators: "Innovatoren"
 game_concept_ec_innovators: "$game_concept_ecumenical_council_innovators$"
 game_concept_ecumenical_council_innovator_desc: "Innovatoren sind [activity_guests_short|E] bei der [activity|E] [ecumenical_council|E] und stimmen mit dem [activity_host_short|E] bei dessen Vorschlag, den Status eines [Concept('core_tenet', 'Grundsatzes')|E] oder einer [doctrine|E] zu ändern.\n\nSie stehen im direkten Gegensatz zu den [Concept('ec_conservatives', 'Wahrern')|E], Gäste, die gegen jeden Wandel stimmen und die den Status quo beibehalten wollen.$game_concept_ecumenical_council_groups_help$"
 game_concept_ecumenical_council_groups_help: "\n\n#help [characters|E], die abstimmen dürfen, sind: [clergy|E], [rulers|E] mit [clerical_puppet|E] und der [activity_host|E]#!"
 game_concept_ecumenical_council_conservative: "Wahrer"
 game_concept_ec_conservative: "$game_concept_ecumenical_council_conservative$"
 game_concept_ecumenical_council_conservatives: "Wahrer"
 game_concept_ec_conservatives: "$game_concept_ecumenical_council_conservatives$"
 game_concept_ecumenical_council_conservative_desc: "Wahrer sind [activity_guests_short|E] bei der [activity|E] [ecumenical_council|E] und stimmen gegen den [activity_host_short|E] bei dessen Vorschlag, den Status eines [Concept('core_tenet', 'Grundsatzes')|E] oder einer [doctrine|E] zu ändern.\n\nSie stehen im direkten Gegensatz zu den [ec_innovators|E], Gäste, die den Wandel zu beschließen versuchen.$game_concept_ecumenical_council_groups_help$"
 game_concept_request_ecclesiastical_title_expansion_interaction: "$request_ecclesiastical_title_expansion_interaction$"
 game_concept_request_ecclesiastical_title_expansion_interaction_desc: "Eine [interaction|E], die [Concept('ecclesiastical', 'kirchliche')|E] [rulers|E] nutzen, um ihre [clerical_region|E] in die [Concept('de_jure', 'De-jure')|E]-[counties|E] eines angrenzenden [Concept('duchy', 'Herzogtums')|E] auszuweiten.\n\nDies ist nur möglich mit der Zustimmung des [Concept('head_of_faith', 'Glaubensoberhaupts')|E]."
 game_concept_ecclesiastic_incite_holy_war_interaction: "$ecclesiastic_incite_holy_war_interaction$"
 game_concept_ecclesiastic_incite_holy_war_interaction_desc: "Eine [interaction|E], durch die [Concept('ecclesiastical', 'kirchliche')|E] [rulers|E] weltliche Herrscher desselben [Concept('faith', 'Glaubens')|E] dazu bringen können, Herrschern eines feindlichen Glaubens einen [holy_war|E] zu erklären."
 game_concept_ecclesiastic_incite_claim_war_interaction: "$ecclesiastic_incite_claim_war_interaction$"
 game_concept_ecclesiastic_incite_claim_war_interaction_desc: "Eine [interaction|E], durch die [Concept('ecclesiastical', 'kirchliche')|E] [rulers|E] weltliche Herrscher desselben [Concept('faith', 'Glaubens')|E] dazu bringen können, Herrschern einen [war|E] zur Durchsetzung des [Concept('claim', 'Anspruchs')|E] auf einen weltlichen [ruler|E] durchzusetzen."
 game_concept_treasury_cardinal_budget: "Kardinalsetat"
 game_concept_treasury_cardinal_budget_short: "Kardinals"
 game_concept_treasury_cardinal_budget_benefices: "Kardinalspfründe"
 game_concept_treasury_cardinal_budget_desc: "Der Schatz, der [Concept('cardinals', 'Kardinälen')|E] von der zentralen Kirchenschatzkammer zugewiesen wird, stellt die direkten und indirekten [Glossary('Pfründe', 'CARDINAL_BENEFICES_GLOSS')] dar, die man ihnen zusprach."
 CARDINAL_BENEFICES_GLOSS: "Pfründe waren örtliche oder entfernte Besitztümer, Ämter oder päpstliche Einkünfte, die man einem Geistlichen #i in commendam#! (treuhänderisch) übertragen konnte. Sie erwirtschafteten ein Einkommen, in der Regel ohne direkte Verwaltungsverantwortung."
 game_concept_spiritual_counsel_interaction: "$spiritual_counsel_interaction$"
 game_concept_spiritual_counsel_interaction_desc: "Eine [interaction|E], bei der eine [Concept('clerical', 'kirchliche')|E] Autorität den Trost der [Concept('spiritual_fulfillment', 'spirituellen Erfüllung')|E] gegen ein [hook|E] eintauscht"
 game_concept_request_clerical_chastity_interaction: "$request_clerical_chastity_interaction$"
 game_concept_request_clerical_chastity_interaction_desc: "Eine [interaction|E], durch die verlangt wird, dass ein [character|E] ein Keuschheitsgelübde und damit einen langfristigen Malus auf die eigene [fertility|E] erleidet."
 game_concept_military_holy_order: "Kriegerorden"
 game_concept_military_holy_orders: "Kriegerorden"
 game_concept_military_holy_order_i: "@government_type_holy_order!"
 game_concept_military_holy_order_possessive: "des Kriegerordens"
 game_concept_military_holy_orders_possessive: "der Kriegerorden"
 game_concept_military_holy_order_desc: "Ein $game_concept_military_holy_order$ ist eine Art von [holy_order|E], die Krieger versammelt, welche schworen, die Lande ihres [Concept('faith', 'Glaubens')|E] auszuweiten.\n\nEin Herrscher derselben Religion kann den Orden anwerben, wenn er sich im [war|E] mit einem [Concept('faith_hostile', 'feindseligen')|E] oder [Concept('faith_evil', 'bösen')|E] $game_concept_faith$n befindet, wofür er [piety|E] bezahlt. Sobald dieser Krieg endet, kämpft der Orden nicht mehr für diesen Herrscher.\n\nEin $game_concept_holy_order$ kann einen [military_holy_order_patron|E] haben, der nicht dafür zahlen muss, wenn er seine Dienste in Anspruch nimmt."
 game_concept_military_holy_order_patron: "Kriegerorden-Gönner"
 game_concept_military_holy_order_patronage: "Kriegerorden-Patronat"
 game_concept_military_holy_order_patronize: "finanzieren"
 game_concept_military_holy_order_patron_desc: "Der $game_concept_holy_order_patron$ eines [Concept('military_holy_order', 'Kriegerordens')|E] ist ein [ruler|E] des [Concept('title_tier', 'Titelrangs')|E] [duke|E] oder höher, der den [Concept('faith', 'Glauben')|E] des Ordens teilt und dessen [realm|E] den Hauptsitz des Ordens in sich birgt.\n\nDer $game_concept_holy_order_patron$ kann kostenlos die Unterstützung des $game_concept_holy_order$s gegen Religionsfeinde einfordern, anstatt mit [piety|E] bezahlen zu müssen.\n\nDas Patronat kann an [vassals|E] des [Concept('title_tier', 'Titelrangs')|E] [duke|E] oder höher verloren gehen, wenn die Kontrolle über den Hauptsitz des Ordens abgegeben wird."
