 pam_tenet_events.0004.opening.hof: "Hochverehrt[diverged_rite.GetFaith.GetReligiousHead.Custom('DE_END_ADJ_IND_S_N')] [diverged_rite.GetFaith.GetReligiousHead.GetTitleAsNameNoTooltip],"
 pam_tenet_events.0004.opening.ruler: "[diverged_hor.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0004.desc.forward_tenet: "Ich schreibe Euch, um Euch mitzuteilen, dass der [diverged_rite.GetName] einen gewissen Grundsatz ([diverged_added_tenet.GetBaseName]) in seine Lehren aufnahm.\n\nEin Ritus, der sein Volk gut leitet, stärkt den [diverged_rite.GetFaith.GetAdjective|l]en Glauben als Ganzes. Das ist schlichtweg weise."
 pam_tenet_events.0004.desc.forward_doctrine: "Ich schreibe Euch, um Euch mitzuteilen, dass der [diverged_rite.GetName] nun formell eine bestimmte Doktrin ([diverged_added_doctrine.GetDescriptiveName(diverged_rite.GetFaith.Self)]) beachtet.\n\nEin Ritus, der sein Volk gut leitet, stärkt den [diverged_rite.GetFaith.GetAdjective|l]en Glauben als Ganzes. Das ist schlichtweg weise."
 pam_tenet_events.0004.desc.backward_tenet: "Ich schreibe Euch, um Euch mitzuteilen, dass der [diverged_rite.GetName] einen gewissen Grundsatz ([diverged_added_tenet.GetBaseName]) als eine seiner Lehren annahm.\n\nSo nähern wir uns dem [diverged_rite.GetFaith.GetName] an. Wenn Riten mit einer Stimme sprechen, gedeiht der [diverged_rite.GetFaith.GetAdjective|l]e Glaube!"
 pam_tenet_events.0004.desc.backward_doctrine: "Ich schreibe Euch, um Euch mitzuteilen, dass der [diverged_rite.GetName] nun eine gewisse Doktrin ([diverged_added_doctrine.GetDescriptiveName(diverged_rite.GetFaith.Self)]) beachtet.\n\nSo nähern wir uns dem [diverged_rite.GetFaith.GetName] an. Wenn Riten mit einer Stimme sprechen, gedeiht der [diverged_rite.GetFaith.GetAdjective|l]e Glaube!"
 pam_tenet_events.0004.a: "So sei es."
 pam_tenet_events.0004.a.tt.diverged: "Der [rite|E] [diverged_rite.GetName] hat sich weiter vom [mainline_rite|E] [diverged_rite.GetFaith.GetMainRite.GetName] entfernt, sodass der jährliche [fervor_i][fervor|E] schneller fällt"
 pam_tenet_events.0004.a.tt.consolidated: "Der [rite|E] [diverged_rite.GetName] ist näher an den [mainline_rite|E] [diverged_rite.GetFaith.GetMainRite.GetName] gerückt, sodass der jährliche [fervor_i][fervor|E] langsamer fällt"
 pam_tenet_events.0005.opening: "[redistributing_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_tenet_events.0005.desc: "Ich gab die Hälfte dessen, was ich besitze, für die Armen hin, und meine Seele ward reicher durch das Geben.\n\nNun bitte ich um die Hälfte dessen, was Euch gehört, um dasselbe zu tun. Leeren Händen wird vergeben. Volle Hände werden erinnert."
 pam_tenet_events.0005.a: "Wenn [Select_CString(redistributing_liege.IsFemale, 'meine', 'mein')] [redistributing_liege.GetTitleAsNameNoTooltip] dies ertragen kann, kann ich es auch."
 pam_tenet_events.0005.b: "Meine Hände sind voll, und sie werden es auch bleiben."
 pam_tenet_events.0005.b.tt: "Eure Schatztruhen bleiben, wie sie sind, und Eure [counties|E] erhalten nichts"
 pam_tenet_events.0006.t: "Die verborgenen Lehren"
 pam_tenet_events.0006.desc_intro: "Die unbeschrifteten Bücher liegen geöffnet vor mir, mit offengelegten Diagrammen und Namen, die keine Zunge aussprechen soll. Die ist die Lehre, vor der man die schlichten Frommen warnt, und ich werde mich damit eine Nacht beschäftigen."
 pam_tenet_events.0006.desc_witness: "\n\n[mystic_witness.GetTitledFirstName|U] tritt an die Türschwelle heran und bleibt stehen. „Es gibt einen Grund, weshalb diese Dinge hinter Schloss und Gebet bleiben“, mumelt [mystic_witness.Custom('DE_PRO_PER_S_3P_N')]. „Was Ihr darin lesen werdet, könnt Ihr nicht mehr aus Eurem Wissen entfernen.“"
 pam_tenet_events.0006.desc_alone: "\n\nNiemand an meinem Hof wird sich diese Seiten mit mir zusammen ansehen. Was auch immer auf ihnen steht: Ich werde es ohne Berater lesen müssen."
 pam_tenet_events.0006.a: "Nichts auf diesen Seiten ist zu hoch für mich. Lesen wir weiter."
 pam_tenet_events.0006.b: "Ich mache so lange, wie die Lampe brennt, und dann reicht es."
 pam_tenet_events.0007.t: "Rat der Toten"
 pam_tenet_events.0007.desc: "Die Türen sind versperrt und die Lampen erloschen. Die Welt wird immer kleiner, bis nur noch eine einzelne flackernde Flamme brennt und sich der Rauch dicht um mich legt. Ich spüre bereits die Gegenwart von [guiding_forebear.GetTitledFirstName], wie sie sich hinter dem rauchverhangenen Schleier windet.\n\nIn der Dunkelheit lege ich die beklagenswerten Nöte offen, über die ich bei Tageslicht nicht zu sprechen wage. Geister antworten nicht so, wie es die Streblichen tun, sondern mit düsterem Raunen, dem Knistern einer unruhigen Flamme, einem kaum merklichen Hauch unsichtbarer Luft und mit Schemen, die sich im Rauch bewegen.\n\nVerzweifelt auf der Suche nach Führung mühen sich meine Augen an jedem Zeichen ab, auf der Suche nach der Antwort, die ich am meisten brauche."
 pam_tenet_events.0007.a: "Leiht mir die Weisheit, die Euch führte."
 pam_tenet_events.0007.b: "Gewährt mir so viel Frieden, dass ich dem Morgen entgegentreten kann."
 pam_tenet_events.0008.t: "Ein erinnertes Selbst"
 pam_tenet_events.0008.desc: "Das Siegel, der Becher, der Ring, den mein[remembered_forebear.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('remembered_forebear'))] [remembered_forebear.GetTitledFirstName] trug. Sie liegen hier vor mir, und ich sitze schon so lange neben ihnen, dass sie sich nicht mehr geliehen anfühlen.\n\nNichts erscheint. Nichts wird gesagt. Ich erfahre nichts über [remembered_forebear.Custom('DE_PRO_PER_S_3P_A')], ich werde an mich selbst erinnert, und diese Erinnerung ist Teil eines Wesens, das ich mit jenem Leben eher ablegte, als dass ich es verlor."
 pam_tenet_events.0008.a: "Das war ich: [remembered_trait_1.GetNameNoTooltip(ROOT.Char)|l], durch und durch."
 pam_tenet_events.0008.b: "Ich erwache [remembered_trait_2.GetNameNoTooltip(ROOT.Char)|l] tief im Innersten und erkenne dies als meinen ureigenen Wesenszug."
 pam_tenet_events.0008.c: "Ja. Ich war [remembered_trait_3.GetNameNoTooltip(ROOT.Char)|l] damals, und ich kann es wieder sein."
 pam_tenet_events.0008.d: "Diese Leben sind vergangen. Ich bleibe ich selbst."
 pam_tenet_events.0009.t: "Öffnet die Truhen"
 pam_tenet_events.0009.desc_intro: "Sie trugen die Truhen in den Hof und drückten mir die Schlüssel in die Hand."
 pam_tenet_events.0009.desc_witness: "[redistribution_witness.GetTitledFirstName|U] tritt in die Schlange.\n\n„[Select_CString(ROOT.Char.IsFemale, 'Eine großzügige', 'Ein großzügiger')] [ROOT.Char.GetTitleAsNameNoTooltip] ist immer noch [Select_CString(ROOT.Char.IsFemale, 'eine', 'ein')] [ROOT.Char.GetTitleAsNameNoTooltip]“, sagt [redistribution_witness.Custom('DE_PRO_PER_S_3P_N')]. „Niemand wird dadurch gerettet, dass er großzügig gibt, sondern nur dadurch, dass er nichts mehr zu behalten hat.“"
 pam_tenet_events.0009.desc_alone: "Niemand kam, um an meiner Seite zu stehen. Die Ratsverwalter halten Abstand und warten."
 pam_tenet_events.0009.desc_end: "\n\nMeine eigene Truhe kann ich mit einer Drehung meines Handgelenks öffnen. Den Rest werde ich mir nehmen müssen."
 pam_tenet_events.0009.a: "Brecht die Schlösser auf. Lasst alle ihren Anteil nehmen."
 pam_tenet_events.0009.flavor: "Eure Vasallen, die über genügend Geld verfügen, werden gezwungen sein, ihre Schatztruhen zu öffnen, Eure Gemeinden werden freier werden und schwieriger zu kontrollieren, und jene, die diesen Grundsatz nicht mit Euch teilen, werden es Euch verübeln."
 pam_tenet_events.0009.b: "Einen Augenblick. Nur mein eigener Reichtum muss weg."
 pam_tenet_events.0009.b.tt: "Ihr teilt nur, was Euch gehört. Eure [vassals|E] halten ihre Schatztruhen verschlossen und und bringen Euch deswegen keinen Groll entgegen"
 pam_tenet_events.0010.t: "Was das Fleisch schuldet"
 pam_tenet_events.0010.desc_intro: "Die Geißel liegt, wo sie immer liegt. Daneben liegen heute die Eisen und das kurze Messer, leise geholt, von niemandes Hand außer der meinen."
 pam_tenet_events.0010.desc_alone: "\n\nNiemand wird heute für mich die Lampe halten. Was auch immer ich von diesem Tisch nehme, geschieht ohne Zeugen."
 pam_tenet_events.0010.a: "Die Geißel, bis mein Verstand zur Ruhe kommt."
 pam_tenet_events.0010.b: "Lasst mich mit dem Anblick der Welt abschließen."
 pam_tenet_events.0010.c: "Nehmt das Verlangen fort, und die Sünde geht mit ihm."
