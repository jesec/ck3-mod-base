 pam_harmonious_society_five_bonds_toast_desc: "Alles, was eine Gesellschaft ausmacht, beruht auf den fünf Banden, und das Urteil über die Euren hat sich verändert."
 pam_five_bonds_ruler_subject_tt: "Das Band zwischen #high Herrscher und Untertänigem#! wird bewahrt"
