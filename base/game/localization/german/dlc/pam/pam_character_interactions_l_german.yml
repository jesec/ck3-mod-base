 ECCLESIASTICAL_BESTOW_TITLE_NOTIFICATION: "Alle [recipient.GetFaith.GetReligion.GetAdjective|l]en Gläubigen Eures Reichs verdienen jenen Frieden und jenen Wohlstand, mit dem die höchste Macht ([recipient.GetFaith.HighGodName]) ein [recipient.GetFaith.GetReligion.GetAdjective|l]es Reich ([target.GetTierAsNameNoTooltip]) gemeinhin segnet. Zu diesem Zweck wünsche ich, ein Reich namens [target.GetName] zu verkünden und es unter Eure Obhut zu stellen."
