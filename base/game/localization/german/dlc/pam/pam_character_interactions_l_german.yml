 # Grant claim from clergy accept
 pam_interactions_events.0020.opening: "[actor.GetFirstName], o [actor.GetTitledFirstNameNoTooltip], so schmählich beraubt!"
 pam_interactions_events.0020_threatened: "Haltet die Strafdienste, die elenden Tadel und die verderbten Mächte zurück, die Ihr als Waffe gegen meine [secondary_recipient.GetFaith.GetReligion.GetAdjective|l]en [secondary_recipient.GetFaith.HouseOfWorshipPlural] ins Feld führen wollt! Eure schreckliche Entschlossenheit wird in kommenden Tagen noch gebraucht werden: Denn ein Anspruch auf [target.GetNameNoTier] soll Euer sein."
 pam_interactions_events.0020_offer_hook: "Euer Versprechen, [secondary_recipient.GetPrimaryTitle.GetNameNoTier] zu bevorzugen, gebot mir Einhalt, und daher habe ich Euer lang übersehenes Recht offenbart: einen Anspruch auf [target.GetNameNoTier]!"
 pam_interactions_events.0020_indebted: "Dieser bescheidene [secondary_recipient.GetFaith.PriestNeuter] steht in Eurer Schuld, und daher habe ich nach unbestreitbaren Beweisen gesucht – und gefunden –, dass [target.GetNameNoTier] rechtmäßig Euch gehört und Euch nur verweigert wird!"
 pam_interactions_events.0020: "Es ist Euer Recht, [target.GetNameNoTier] zu beanspruchen: ein uraltes Recht als Teil der himmlischen Vorsehung! Ich habe Euren Rat mit entsprechenden Belegen versorgt."
 pam_interactions_events.0020_end: "\n\n[recipient.GetNameRegnal|U] wird von dieser Offenbarung wohl kaum erfreut sein. Doch die Mächte des Schicksals ([secondary_recipient.GetFaith.FateGodName]) scheren sich nicht um die Gegenrede von Scharlatanen."
 pam_interactions_events.0020.a.low_zeal: "Und so wird die Geschichte umgeschrieben …"
 pam_interactions_events.0020.a.high_zeal: "[target.GetNameNoTierNoTooltip|U] ist nach heiligem Recht mein!"
 pam_interactions_events.0020.a: "Mein Anspruch ist gestellt. Verdammt sei [recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0020.toast_puppeteer: "[secondary_recipient.GetShortUIName|U] gewährte [puppet_or_actor.GetShortUIName] einen Anspruch auf: [target.GetNameNoTier]"
 # Grant claim from clergy refuse
 pam_interactions_events.0021.opening: "[actor.GetName|U],"
 pam_interactions_events.0021: "Wenn Ihr nicht dazu ausersehen wäret, [target.GetNameNoTier] zu regieren, warum hätte die höchste Macht ([secondary_recipient.GetFaith.HighGodName]) Euch dann dieses Geburtsrecht nicht geben sollen?\n\nNein, ich werde [recipient.GetTitledFirstNameRegnal] nicht schmähen – und unsterbliche Seelen wie Eure und meine verraten –, indem ich Falschheiten für Eure bösartigen Ziele verbreite.\n\nReflektiert betend über Euer fehlerhaftes Vorgehen."
 pam_interactions_events.0021.a: "Die Mauern der [secondary_recipient.GetFaith.HouseOfWorshipPlural] verleihen [secondary_recipient.Custom('DE_PRO_PER_S_3P_D')] törichten Mumm!"
 pam_interactions_events.0021.toast_puppeteer: "[secondary_recipient.GetShortUIName|U] lehnte die Bitte von [puppet_or_actor.GetShortUIName] auf einen Anspruch ab auf: [target.GetNameNoTier|U]"
 # Grant claim from clergy - claim's holder event
 pam_interactions_events.0022.opening: "Träger meines Geburtsrechts,"
 pam_interactions_events.0022_shrimp: "Ich mag nur ein[ROOT.Char.Custom('DE_END_PRO_S_N')] [actor.GetTitleAsName] sein, doch die [actor.GetFaith.GetAdjective|l]en [secondary_recipient.GetFaith.AltPriestTermPlural] entdeckten, dass mein Geblüt einen uralten Anspruch auf [target.GetName] in seiner Gänze hat."
 pam_interactions_events.0022_shark: "[target.GetName] gehört zu jenen Titeln, die die höchste Macht ([actor.GetFaith.HighGodName]) meiner [actor.Custom('GetTitleTierAdjective')|l]en Linie verlieh. Dies war schon immer so, auch wenn es bisher unbekannt war."
 pam_interactions_events.0022: "Unter den Gelehrten ist schon lange gekannt – und nun auch bewiesen –, dass [target.GetName] mein rechtmäßiger Anspruch ist."
 pam_interactions_events.0022_end: "\n\n[secondary_recipient.GetTitledFirstNameRegnal|U] ließ meinem Anspruch heilige Billigung zuteil werden. [secondary_recipient.GetPrimaryTitle.GetName|U] unterstützt mich bis zum Letzten.\n\nUnd so beginne ich, zu hoffen und zu beten, dass ich eines Tages über [target.GetNameNoTierNoTooltip] in voller Gänze regieren werde …"
 pam_interactions_events.0022.a: "Lügen! Ein falscher Anspruch unterstützt von einem falschen [secondary_recipient.GetFaith.PriestNeuter]!"
 # Grant claim from clergy - clergy event
 pam_interactions_events.0023.opening: "Heilig[ROOT.Char.Custom('DE_END_ADJ_IND_S_N')] [ROOT.Char.GetMotherFather],"
 pam_interactions_events.0023_shrimp: "Wenn ich einen rechtmäßigen Anspruch hätte, könnte ich dann nicht [target.GetName] tugendhafter führen als [recipient.Custom('DE_ART_DEF_S_N')] [actor.Custom2('InsultAdjective', recipient)][recipient.Custom('DE_END_ADJ_IND_S_N')] [recipient.GetFirstNameRegnal]? Bitte erlaubt dem Licht der höchsten Macht ([actor.GetFaith.HighGodName]), auf dies[recipient.Custom('DE_END_ADJ_IND_S_N')] einfach[recipient.Custom('DE_END_ADJ_IND_S_N')] [actor.GetTitleAsName] zu scheinen."
 pam_interactions_events.0023_shark: "Durch den Willen der höchsten Macht ([actor.GetFaith.HighGodName]) bin ich bereits Herr[actor.Char.Custom('DE_END_NOU_S_GS_N')] und Beschützer[actor.Char.Custom('DE_END_NOU_S_GS_N')] von allerlei Landen und Völkern. Und dennoch liegt [target.GetName] jenseits meines Reichs und meiner Rechte."
 pam_interactions_events.0023: "Es herrscht Verwirrung unter den Gläubigen. Während manche mir gern erlauben wollen, [target.GetName] zu beanspruchen, bestreiten andere hingegen jegliches Anrecht von mir auf den Titel."
 pam_interactions_events.0023_end: "\n\nSicher könnte jemand so Gelehrtes wie Ihr die nötigen Beweise in den Geschichtsaufzeichnungen #EMP entdecken#! … und mich daher mit einem gebilligten Anspruch auf [target.GetNameNoTierNoTooltip] versorgen, oder?"
 pam_interactions_events.0023.a: "Möge [target.GetNameNoTierNoTooltip] Euch gehören, mein[actor.Custom('DE_END_PRO_S_N')] [actor.Custom('GetDaughterSon')]."
 pam_interactions_events.0023.b: "Ein[secondary_recipient.Custom('DE_END_PRO_S_N')] [secondary_recipient.GetTitleAsNameNoTooltip] sollte die Finger von Unwahrheiten lassen."
