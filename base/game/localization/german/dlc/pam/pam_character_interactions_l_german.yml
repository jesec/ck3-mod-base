 pam_interactions_events.0072.opening: "[recipient.Custom2('GetUnbelieverTerm', puppet_or_actor)] voll Scheußlichkeit,"
 pam_interactions_events.0072.desc_joined_war: "Ich komme nun zu Euch. Als Missionar, um Eurer Finsternis Licht zu bringen. Als [puppet_or_actor.GetMotherFather], um Euch zu bestrafen.\n\nUnd an der Seite Eures Elternteils kommt [Select_CString(secondary_recipient.IsFemale, 'eine Kriegerin', 'ein Krieger')] der guten Mächte ([puppet_or_actor.GetFaith.GoodGodNames]): [secondary_recipient.GetName|U]. [secondary_recipient.Custom('DE_PRO_POS_S_3P')|U]e Armeen werden [target.GetNameNoTier] von seinem Übel befreien."
 pam_interactions_events.0072.desc: "Es ist zu spät für Euch. Es kann keine Buße geben.\n\nUnd siehe, das verderbte Land namens [recipient.GetPrimaryTitle.GetNameNoTier] soll zerschlagen werden! Und siehe, die Diener der bösen Mächte ([puppet_or_actor.GetFaith.DevilName]) sollen abgeschlachtet werden! Ich habe die Waffen der Gläubigen erhoben und [secondary_recipient.GetName] auf Eure Vernichtung angesetzt!"
 pam_interactions_events.0072.a: "Die höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) grausam sein, solche [puppet_or_actor.GetWomenMen] auf uns loszulassen!"
 incite_holy_war_past_tense_tt: "[puppet_or_actor.GetShortUIName|U] ließ [secondary_recipient.GetShortUIName] einen [holy_war|E] erklären gegen: [target.GetName|U]"
