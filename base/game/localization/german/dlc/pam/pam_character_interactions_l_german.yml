 pam_interactions_events.0097.opening: "Mein [ROOT.Char.Custom('GetTitleTierAdjective')|l]es Kind,"
 pam_interactions_events.0097.desc: "Eurer Petition wird stattgegeben. [target.GetName|U] war lange Zeit unbesetzt, während die Seelen der [ROOT.Char.GetFaith.GetAdherentName] ohne geistlichen Führer blieben. Das ist keine angemessene Art, die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zu ehren.\n\nTragt diesen Titel in Demut. Ein von der Kirche verliehener [title|E] bleibt der Kirche in Erinnerung."
 pam_interactions_events.0097.desc_holy_war: "Eure Petition wird gewährt und Euer Gelübde wird niedergeschrieben, auf dass es nicht in Vergessenheit gerät. [target.GetName|U] gehört Euch, doch ein Teil davon beugt sich noch immer denen, die die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) leugnen.\n\nGeht und nehmt Euch, was Euer Titel bereits als Euer Eigentum bezeichnet. Kein gläubiger [ROOT.Char.GetFaith.PriestNeuter] wird Euren Krieg infrage stellen. Doch in fünf Jahren werden wir fragen, was daraus wurde. Ein Gelübde, das unberücksichtigt bleibt, ist ein gebrochenes Gelübde."
