 pam_interactions_events.0039.desc: "Ich bedauere die Plötzlichkeit dieser Kunde, doch ich muss Euch über etwas in Kenntnis setzen: Ich überlasse [target.GetName] [Select_CString(TARGET_CHARACTER.IsFemale, 'der', 'dem')] [actor.GetTitleAsName] von [actor.GetPrimaryTitle.GetNameNoTier].\n\nSo lautet der Wille von [secondary_recipient.GetTitledFirstNameRegnal], [secondary_recipient.Custom('DE_ART_DEF_S_N')] die Verhandlungen über das Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsName]) leitete, welche [actor.GetTitledFirstNameNicknamed] und meine Wenigkeit führten. Kehrt nach [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] zurück, und schon bald werdet Ihr neu zugeteilt."
