 pam_interactions_events.0070.desc_intro_infidel: "„An die [recipient.GetFaith.GetReligion.GetAdjective|l]en Ungläubigen von [target.GetNameNoTier],"
 pam_interactions_events.0070.desc_intro_heathen: "„An die heidnischen [recipient.GetFaith.GetReligion.GetAdherentNamePlural] von [target.GetNameNoTier],"
 pam_interactions_events.0070.desc: "#EMP Verdammung, Ruin – Tod durch das Schwert!#!“, ruft [puppet_or_actor.GetTitledFirstNameRegnal], und [puppet_or_actor.Custom('DE_PRO_POS_S_3P')]e Botschaft wird zu den ruhelosen Massen von [secondary_recipient.GetPrimaryTitle.GetNameNoTier] getragen.\n\n„Erhebt die heilige Standarte der guten Mächte ([ROOT.Char.GetFaith.random_GoodGodNames]), [ROOT.Char.GetTitledFirstName]! Ich rufe Euch an, [recipient.GetTitledFirstName] aus dem Land [target.GetNameNoTierNoTooltip] auszuweisen! Und [recipient.Custom('DE_PRO_POS_S_3P')]e [recipient.GetPrimaryTitle.GetAdjective|l]en [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] in die Tiefen eines feurigen Jenseits ([ROOT.Char.GetFaith.NegativeAfterLife]) zu schleudern!“\n\n"
 pam_interactions_events.0070.desc_outro_joining_war: "[Select_CString(puppet_or_actor.IsFemale, 'Die', 'Der')] [puppet_or_actor.GetTitleAsNameNoTooltip] strebt wahrlich danach, die Vorherrschaft der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName]) auszuweiten! [puppet_or_actor.Custom('DE_PRO_PER_S_3P_N')|U] schwört, selbst in den Krieg zu reiten und mir [puppet_or_actor.Custom('DE_PRO_POS_S_3P')]e Streitkräfte zur Verfügung zu stellen."
 pam_interactions_events.0070.desc_outro_funding_war: "Münzen stützen diese Forderungen: [Select_CString(puppet_or_actor.IsFemale, 'Die', 'Der')] verspricht eine ganze Kriegskasse an Mitteln, damit meine [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]en [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] von mehr befeuert sein mögen als allein dem Glauben."
 pam_interactions_events.0070.a: "„Die streitenden Mächte ([ROOT.Char.GetFaith.WarGodName]) sind mit uns! #EMP Auf in den Krieg!#!“"
 pam_interactions_events.0070.b: "Lasst das Volk von [recipient.GetTitledFirstNameNoTooltip] in Frieden."
 cultural_acceptance_gain_refused_incited_holy_war: "Ein weltlicher Herrscher verhinderte einen Religionskrieg"
 pam_interactions_events.0071.t: "Feldzug in Sachen [target.GetNameNoTierNoTooltip|U] durch die höchste Macht ([ROOT.Char.GetFaith.HighGodName])"
 pam_interactions_events.0071.desc_intro: "In Schlachtrufen, in Liedern, in Gebeten für einen Sieg: Das heilige Wort der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) wird in ein Reich ([target.GetTierAsNameNoTooltip]) getragen, in dem nur [recipient.Custom2('GetUnbelieverTermPlural', puppet_or_actor)] leben! Vom großen Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) von [secondary_recipient.GetCapitalLocation.GetTitle.GetNameNoTier] aus verkündet [secondary_recipient.GetName] einen heiligen Krieg"
 pam_interactions_events.0071.desc_intro_pagan: "gegen die [recipient.GetPrimaryTitle.GetAdjective|l]en Heiden.\n\nWie grobe Tiere werden [recipient.GetTitledFirstName] und [recipient.Custom('DE_PRO_POS_S_3P')]e [recipient.GetCulture.GetCollectiveNoun] gewiss auseinanderstieben ob der rechtschaffenen Ankunft der [secondary_recipient.GetFaith.GetReligion.GetAdjective|l]en Heerscharen von [secondary_recipient.GetPrimaryTitle.GetNameNoTier]!"
 pam_interactions_events.0071.desc_intro_heretic: "gegen die [recipient.GetPrimaryTitle.GetAdjective|l]en Ketzer.\n\nIn einer großen Woge aus Blut werden [recipient.GetTitledFirstName] und [recipient.Custom('DE_PRO_POS_S_3P')]e schmutzigen [recipient.GetFaith.GetAdherentNamePlural] aus dem Land gespült werden! Und so wird es stets allen ergehen, die das Wort der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) verunstalten!"
 pam_interactions_events.0071.desc_intro_infidel: "jene Gestalt, die als [recipient.GetTitleAsName] von [recipient.GetPrimaryTitle.GetNameNoTier] bekannt ist.\n\nDie [recipient.GetFaith.GetReligion.GetAdjective|l]en Ungläubigen werden sich bald unterwerfen müssen – wie alle, die ob des #EMP Dschihads#! des Propheten scheiterten!"
 pam_interactions_events.0071.desc_intro_heathen: "jene Gestalt, die als [recipient.GetTitleAsName] von [recipient.GetPrimaryTitle.GetNameNoTier] bekannt ist.\n\nBei den streitenden Mächten ([ROOT.Char.GetFaith.WarGodName])! [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] wird die heidnischen Heerscharen zerschlagen! Und alle [ROOT.Char.GetFaith.GetReligion.GetAdjective|l]en Völker werden es staunend bewundern."
 pam_interactions_events.0071.desc_outro_joining_war: "\n\nMeine eigenen Truppen werden nicht untätig danebenstehen. Nein! Sie und die [secondary_recipient.Custom('KnightCulturePluralNoTooltip')] von [secondary_recipient.GetTitledFirstNameNoTooltip] werden gemeinsam nach [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] vordringen."
 pam_interactions_events.0071.desc_outro_rally_crusaders: "\n\nSchon jetzt sammeln sich eifrige Krieger aus [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] und Orten jenseits der Grenzen des Reichs unter dem Banner von [secondary_recipient.GetTitledFirstNameNoTooltip]."
 pam_interactions_events.0071.desc_outro_funding_war: "\n\nAllein schon die Gunst der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) verheißt [secondary_recipient.GetTitledFirstNameNoTooltip] den Sieg. Doch meine großzügige Spende bürgt für [secondary_recipient.Custom('DE_PRO_POS_S_3P')]e Zuversicht."
 pam_interactions_events.0071.a: "Mögen jene, die für diese Sache sterben, auf ewig beneidet werden."
