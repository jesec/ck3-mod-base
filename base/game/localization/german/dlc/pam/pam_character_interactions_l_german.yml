 JUSTIFY_DIVORCE_INTERACTION_OPTION: "Durch Kirchenrecht rechtfertigen"
 divorce_justified_tt: "Beliebige der folgenden Dinge:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] versuchte, Euch zu ermorden\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] ist ein [GetTrait('adulterer').GetName(secondary_recipient)]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] hat sehr wenig [fertility|E] und Eure Ehe ist kinderlos\n$EFFECT_LIST_BULLET$[faith|E] von [secondary_recipient.GetShortUIName] ist [faith_hostile|El] oder [faith_evil|El]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] hat verschiedene [spouses|E], obwohl Vielehe verboten ist\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] ist impotent\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] hat eine [Concept('incestuous', 'inzüchtige')|E] Affäre\n$EFFECT_LIST_BULLET$Eure Ehe mit [secondary_recipient.GetShortUIName] ist [incestuous|El]\n$EFFECT_LIST_BULLET$Eure Ehe mit [secondary_recipient.GetShortUIName] ist gleichgeschlechtlich und verboten"
 divorce_justified_secondary_tt: "Beliebige der folgenden Dinge:\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] versuchte, [secondary_actor.GetShortUIName] zu ermorden\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] ist ein [GetTrait('adulterer').GetName(secondary_recipient)]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] hat sehr wenig [fertility|E] und die Ehe ist kinderlos\n$EFFECT_LIST_BULLET$[faith|E] von [secondary_recipient.GetShortUIName] ist [faith_hostile|El] oder [faith_evil|El]\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] hat verschiedene [spouses|E], obwohl Vielehe verboten ist\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] ist impotent\n$EFFECT_LIST_BULLET$[secondary_recipient.GetShortUIName|U] hat eine [Concept('incestuous', 'inzüchtige')|E] Affäre\n$EFFECT_LIST_BULLET$Ehe von [secondary_actor.GetShortUIName] mit [secondary_recipient.GetShortUIName] ist [incestuous|El]\n$EFFECT_LIST_BULLET$Ehe von [secondary_actor.GetShortUIName] mit [secondary_recipient.GetShortUIName] ist gleichgeschlechtlich und verboten"
