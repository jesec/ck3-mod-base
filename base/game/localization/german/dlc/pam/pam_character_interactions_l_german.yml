 pam_interactions_events.0050.opening: "[recipient.GetTitledFirstNameRegnal|U],"
 pam_interactions_events.0050.desc: "In der heiligen Schrift ([puppet_or_actor.GetFaith.ReligiousText]) gilt die Ehe als heiliger Bund. In der lebendigen Welt von Männern und Frauen … ist sie nicht ganz so vollkommen.\n\nIhr weigertet Euch, [secondary_recipient.GetTitledFirstName] und mich voneinander zu scheiden. Was sollen wir nun mit den Scherben anfangen, die zurückbleiben …?"
 pam_interactions_events.0050.aa: "Es ist die fleischliche Begierde, die Euch unglücklich macht."
 pam_interactions_events.0050.aa.tt: "Lehrt diese lieblose Kreatur, dass sie alle Bedürfnisse und Erwartungen des Fleischs aufgeben muss …"
 pam_interactions_events.0050.a: "Die Wege in ein glückliches Jenseits ([recipient.GetFaith.PositiveAfterLife])? Liebe. Hingabe."
 pam_interactions_events.0050.a.tt: "Mit Eurer Führung kann dieses nahezu schon auseinandergegangene Paar Erlösung ineinander finden."
 pam_interactions_events.0050.b: "Ehrt die Gelübde, die Ihr einander vor den guten Mächten ([recipient.GetFaith.GoodGodNames]) schwort."
 pam_interactions_events.0050.c: "Diese Verachtung des heiligen Bunds der Ehe ist Blasphemie!"
 pam_interactions_events.0050.d: "Betet miteinander um Führung durch die höchste Macht ([recipient.GetFaith.HighGodName])."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nEs ist ein inzestuöser Bund, eine unnatürliche Einlassung, die Ihr beenden würdet!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nUnser [puppet_or_actor.GetFaith.GetAdjective|l]er Glaube nötigt mich, diesen Menschen aus meinem Bett zu werfen!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE: "\n\nBitte beachtet, dass man [secondary_recipient.GetFirstNameNoTooltip] bedauerliche Impotenz nachsagt …"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] begeht ganz offen widerliche Inzucht, voll Verachtung gegenüber unserem Bund! Es ist eine Schande!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING: "\n\n[secondary_recipient.GetFirstNameNoTooltip|l] war mir nicht treu, und alle wissen es!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH: "\n\nDie höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) will, dass ich mit einem Mann verheiratet bin! Und [secondary_recipient.GetFirstNameNoTooltip] … hat keinerlei nennenswerte Männlichkeit."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER: "\n\nBei der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName])! [Select_CString(secondary_recipient.IsFemale, 'Die Dämonin, die', 'Der Dämon, der')] sich als mein[secondary_recipient.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] ausgibt, versuchte, mich ermorden zu lassen!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] führt eine Vielehe! Ich bin nur ein Teil [secondary_recipient.Custom('DE_PRO_POS_S_3P')]er Herde von Zuchtvieh. Befreit mich!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH: "\n\nSicher will die höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) nicht, dass ich mein Bett weiter mit [Select_CString(secondary_recipient.IsFemale, 'einer', 'einem')] elenden [secondary_recipient.GetFaith.GetAdjective|l]en [Select_CString(secondary_recipient.IsFemale, 'Heidin', 'Heiden')] teile?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT: "\n\nWarum ich Euch darum anflehe, ist kein Geheimnis: [secondary_recipient.GetFirstNameNoTooltip|U], das lüsterne Schwein, war mir untreu."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY: "\n\nUnsere Ehe ist kinderlos, und ich habe keine Hoffnung mehr, jemals fruchtbar zu sein."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED: "\n\nIhr müsst Euch irgendeinen Anlass ausdenken, doch bei der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName]): Mein Hass auf [secondary_recipient.GetFirstNameNoTooltip] sollte allein schon reichen."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED: "\n\nIch habe keinen rechtlichen Anlass … aber vertraue darauf, dass Eure Meisterschaft des Kirchenrechts Euch helfen wird, Gründe für die Annullierung zu #EMP entdecken#!."
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_SECONDARY: "\n\nEs ist ein inzestuöser Bund, eine unnatürliche Einlassung, die Ihr beenden würdet!"
 ASK_FOR_DIVORCE_NOTIFICATION_SAME_SEX_SECONDARY: "\n\nUnser [actor.GetFaith.GetAdjective|l]er Glaube nötigt mich, diesen Menschen aus jenem Bett zu werfen, in dem mein[puppet_or_actor.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] schläft!"
 ASK_FOR_DIVORCE_NOTIFICATION_IMPOTENCE_SECONDARY: "\n\nBitte beachtet, dass man [secondary_recipient.GetFirstNameNoTooltip] bedauerliche Impotenz nachsagt …"
 ASK_FOR_DIVORCE_NOTIFICATION_INCESTUOUS_LOVER_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] begeht ganz offen widerliche Inzucht, voller Verachtung für ihren Bund! Es ist eine Schande!"
 ASK_FOR_DIVORCE_NOTIFICATION_EXPOSED_CHEATING_SECONDARY: "\n\nMein[secondary_actor.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] erfuhr keine Treue durch [secondary_recipient.GetFirstNameNoTooltip], und alle wissen es!"
 ASK_FOR_DIVORCE_NOTIFICATION_EUNUCH_SECONDARY: "\n\nDie höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) will, dass mein[puppet_or_actor.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] mit einem Mann verheiratet ist! Und [secondary_recipient.GetFirstNameNoTooltip] … hat keinerlei nennenswerte Männlichkeit."
 ASK_FOR_DIVORCE_NOTIFICATION_ATTEMPTED_MURDER_SECONDARY: "\n\nBei der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName])! [Select_CString(secondary_recipient.IsFemale, 'Diese Dämonin, die sich', 'Dieser Dämon, der sich')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))] schimpft, versuchte etwas Grauenhaftes: Mein[puppet_or_actor.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] sollte ermordet werden!"
 ASK_FOR_DIVORCE_NOTIFICATION_MULTIPLE_CONSORTS_SECONDARY: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] führt eine Vielehe! Mein[secondary_actor.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] ist nur ein Teil [secondary_recipient.Custom('DE_PRO_POS_S_3P')]er Herde von Zuchtvieh. Befreit [secondary_actor.Custom('DE_PRO_PER_S_3P_A')]!"
 ASK_FOR_DIVORCE_NOTIFICATION_HOSTILE_FAITH_SECONDARY: "\n\nSicher will die höchste Macht ([puppet_or_actor.GetFaith.HighGodName]) nicht, dass mein[secondary_actor.Custom('DE_END_PRO_S_N')] [puppet_or_actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))] das eigene Bett weiter mit [Select_CString(secondary_recipient.IsFemale, 'einer', 'einem')] elenden [secondary_recipient.GetFaith.GetAdjective|l]en [Select_CString(secondary_recipient.IsFemale, 'Heidin', 'Heiden')] teilt?"
 ASK_FOR_DIVORCE_NOTIFICATION_ADULTERY_TRAIT_SECONDARY: "\n\nWarum ich Euch darum anflehe, ist kein Geheimnis: [puppet_or_actor.GetFirstNameNoTooltip|U], das lüsterne Schwein, hat sich untreu gezeigt."
 ASK_FOR_DIVORCE_NOTIFICATION_INFERTILITY_SECONDARY: "\n\nIhre Ehe ist kinderlos, und ich habe keine Hoffnung, dass sie jemals fruchtbar sein wird."
 ASK_FOR_DIVORCE_NOTIFICATION_HATRED_SECONDARY: "\n\nIhr müsst Euch irgendeinen Anlass ausdenken, aber bei der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName]): Unser Hass auf [secondary_recipient.GetFirstNameNoTooltip] sollte allein schon reichen."
 ASK_FOR_DIVORCE_NOTIFICATION_NOT_JUSTIFIED_SECONDARY: "\n\nIch habe keinen rechtlichen Anlass … aber vertraue darauf, dass Eure Meisterschaft des Kirchenrechts Euch helfen wird, Gründe für die Annullierung zu #EMP entdecken#!."
