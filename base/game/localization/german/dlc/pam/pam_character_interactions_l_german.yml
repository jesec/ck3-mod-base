 # Clerical land transfer events
 # player Priest refuses event
 pam_interactions_events.0031.opening: "[Select_CString(actor.IsFemale, 'Meine eigensinnige Tochter', 'Mein eigensinniger Sohn')],"
 pam_interactions_events.0031.desc: "Die höchste Macht ([actor.GetFaith.HighGodName]) gab Euch Lippen, um gerechte Worte zu sprechen. Die höchste Macht ([actor.GetFaith.HighGodName]) gab Euch Hände, um ein Schwert zu führen. Und die höchste Macht ([actor.GetFaith.HighGodName]) gab der Welt [actor.GetFaith.PriestNeuterPlural], damit Ihr ihre Weisheit befolgen könnt.\n\nVon Gier zerfressen sprecht Ihr ungerechte Worte. Von fürchterlichen Zweifeln heimgesucht haltet Ihr das Schwert zurück, von dem Ihr wünscht, es gegen [target.GetNameNoTier] einzusetzen.\n\nUnd so kommt es dazu: Ihr müsst meiner Weisheit folgen ... und das Reich ([target.GetTierAsName]) sein lassen."
 pam_interactions_events.0031.a: "[secondary_recipient.GetTitleAsNameNoTooltip|U] lehnt meine Sache ab!"
 # Player clergy response event
 pam_interactions_events.0033.opening: "Wahrer der himmlischen und irdischen Ordnung,"
 pam_interactions_events.0033_de_jure: "Ich bitte um Eure Hilfe. Erklärt, dass sich meine Herrschaft rechtmäßig auch über [target.GetName] erstreckt – das mir von Rechts wegen zusteht. Bewaffnet mich mit Eurer Unterstützung, sodass ich [recipient.GetName] ohne Blutvergießen überzeugen kann.\n\n"
 pam_interactions_events.0033_claim: "Ich will meinen Anspruch auf [target.GetNameNoTier] durchsetzen. Gewährt mir Eure heilige Billigung, sodass [recipient.GetName] das Reich ([target.GetTierAsName]) übergeben kann, ohne dass [actor.GetFaith.GetAdjective|l]es Blut vergossen wird.\n\n"
 pam_interactions_events.0033_threaten: "Wenn Ihr mein Ansinnen zurückweist ... könnt #EMP Ihr#! der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) das große Schlachten und das Feuer erklären, das ich nach [target.GetNameNoTierNoTooltip] bringe."
 pam_interactions_events.0033_succession: "Solltet Ihr Euch in meinem Sinn äußern, gebe ich Euch folgendes Versprechen: Sollte ich als [actor.GetTitleAsName] von [actor.GetPrimaryTitle.GetNameNoTier] sterben – ohne Kinder meines Hauses –, wird [actor.GetPrimaryTitle.GetNameNoTier] an die Kirche übergehen."
 pam_interactions_events.0033_pilgrimage: "Im Austausch für Eure heilige Zustimmung in dieser irdischen Angelegenheit verspreche ich, eine Pilgerreise zu unternehmen: als Akt der Dankbarkeit für die Segnungen, die mir durch die höchste Macht ([actor.GetFaith.HighGodName]) zuteilwurden."
 pam_interactions_events.0033_use_hook: "Gewiss habt Ihr nicht vergessen … dass Euer Name auf meinen Befehl hin eingetragen wird und dass Eure Feder nur niederschreiben soll, was meinem Willen entspricht …?"
 pam_interactions_events.0033_offer_hook: "Dass Ihr Euren frommen Ruf meiner Sache leiht, ist kein kleiner Gefallen. Wenn Ihr mich in diesen sterblichen Angelegenheiten unterstützt, werde ich Euch in den Tagen, die da noch kommen, ebenfalls unterstützen."
 pam_interactions_events.0033_donate: "Gewährt mir Eure Hilfe, bereichert mein Reich mit Land, und ich werde mich glücklich schätzen, Eure frommen Kassen mit Spenden zu füllen."
 pam_interactions_events.0033_fallback: "Diese Verhandlungen über Land und Titel werden zu nichts führen, es sei denn, ein heiliger Mittler hilft. Werdet Ihr Eure heilige Autorität in den Dienst meiner Sache stellen?"
 pam_interactions_events.0033.aa: "Ja. Es ist vollbracht."
 pam_interactions_events.0033.a: "Meinem Erlass nach muss [target.GetNameNoTierNoTooltip] [actor.GetFirstNameNoTooltip] gehören."
 pam_interactions_events.0033.a.tt: "Schickt [recipient.GetTitledFirstNameNoTooltip] ein Schreiben: Sich an [recipient.Custom('DE_PRO_POS_S_3P')] unrechtmäßig gehaltenes Land zu klammern, verärgert die höchste Macht ([secondary_recipient.GetFaith.HighGodName]) und [Select_CString(secondary_recipient.IsFemale, 'die', 'den')] [secondary_recipient.GetTitleAsNameNoTooltip]!"
 pam_interactions_events.0033.b: "Ich kann diese dreiste Forderung nicht gutheißen."
 pam_interactions_events.0033.b.tt: "Die Welt ist gut geordnet, so wie sie ist. [recipient.GetTitledFirstNameNoTooltipRegnal|U] muss [target.GetNameNoTierNoTooltip] behalten."
 clergy_land_inform_priest_might_fail_tt: "@warning_icon! #X #bold [actor.GetShortUIName|U] wird versuchen, [recipient.GetShortUIName] zu überzeugen, [target.GetName] [actor.Custom('DE_PRO_PER_S_3P_D')] zu geben, und könnte scheitern#!#!"
 clergy_land_inform_priest_can_force_tt: "@alert_icon! #alert_trial #bold [actor.GetShortUIName|U] könnte [recipient.GetShortUIName] zwingen, [target.GetName] [actor.Custom('DE_PRO_PER_S_3P_D')] zu geben, könnte aber stattdessen auch das Scheitern riskieren#!#!"
 clergy_land_inform_priest_will_happen_tt: "#P #EMP #bold [recipient.GetShortUIName|U] gibt ohne Widerstand [target.GetName] an [actor.GetShortUIName]#!#!#!"
 high_church_authority_unlock_land_transfer_tt: "#P #EMP #bold Euer [law|E] „[GetLaw('church_authority_3').GetName]“ erlaubt es Euch, [recipient.GetShortUIName] zu zwingen, [target.GetName] ohne Widerstand an [actor.GetShortUIName] zu geben#!#!#!"
 # recipient receives letter and option to immediately accept
 pam_interactions_events.0032.opening: "Als göttlicher Schlichter beginne ich hiermit mit den Verhandlungen."
 pam_interactions_events.0032_intro: "Ihr habt Euch sehr fähig um [target.GetNameNoTier] gekümmert, doch es ist der Wille der höchsten Macht ([recipient.GetFaith.HighGodName]), dass dieses Reich ([target.GetTierAsNameNoTooltip]) [actor.GetName] gehört. Würdet Ihr [actor.Custom('DE_PRO_PER_S_3P_D')] das Land bitte ohne Blutvergießen überlassen?\n\n"
 pam_interactions_events.0032_de_jure: "Denn [target.GetNameNoTierNoTooltip] ist #EMP de jure#! [actor.Custom('DE_PRO_POS_S_3P')]es."
 pam_interactions_events.0032_claim: "Denn in den Augen des Allmächtigen ist [actor.Custom('DE_PRO_POS_S_3P')] Anspruch auf [target.GetNameNoTierNoTooltip] der wahrhaftigste von allen."
 pam_interactions_events.0032.aa: "Nun, wo ist mein Stift …"
 pam_interactions_events.0032.aa.flavor: "Ich werde es aller Welt beweisen: dass die höchste Macht ([recipient.GetFaith.HighGodName]) diesen sündhaften Scharlatanen jegliche [recipient.GetFaith.GetAdjectiveNoTooltip|l]e Tugend verwehrte. Alles, was sie besitzen – und jemals besitzen werden –, ist schamlose Frechheit."
 clergy_interaction_scholar_block_tt: "#P #bold #EMP Der Versuch von [actor.GetShortUIName], [target.GetName] zu erhalten, scheitert#!#!#!"
 pam_interactions_events.0032.a: "Wenn die höchste Macht ([actor.GetFaith.HighGodName]) es wünscht, gebe ich [target.GetNameNoTierNoTooltip] auf."
 pam_interactions_events.0032.b: "Nein. Ihr überzeugt mich beide nicht."
 pam_interactions_events.0032.b.tt: "Wenn doch nur [actor.GetTitledFirstNameNoTooltip] und [secondary_recipient.GetTitledFirstNameNoTooltip] so einfach zum Schweigen gebracht werden könnten …"
 clerical_land_transfer_actor_attempt_tt: "@alert_icon! #alert_trial #bold Könnte Euch veranlassen, [actor.Custom('DE_PRO_POS_S_3P')]e Einnahme von [target.GetName] mit einer der folgenden Methoden zu akzeptieren:#!#!"
 # Actor picks negotiation tactic after interaction
 pam_interactions_events.0030.t: "Verhandlungen um [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0030.desc_intro_envoy: "Auf heiligem Boden legt mein Bote [secondary_recipient.GetTitledFirstNameRegnal] meine Argumente in Sachen [target.GetNameNoTier] dar."
 pam_interactions_events.0030.desc_intro: "Mit dem Segen von [secondary_recipient.GetTitledFirstNameRegnal] und dem Schutz durch den heiligen Boden lege ich meine Argumente in Sachen [target.GetNameNoTier] dar."
 pam_interactions_events.0030.desc: "Worte eines friedlichen Übereinkommens, die gespickt sind mit Kriegsdrohungen. Erklärungen meiner mir verliehenen Rechte. Und so weiter und so fort …\n\n"
 pam_interactions_events.0030.desc_target: "[recipient.GetTitledFirstNameNicknamed|U] wird aus [recipient.Custom('DE_PRO_POS_S_3P')]em Reich ([target.GetTierAsNameNoTooltip]) nicht so einfach hinausgeworfen werden. Diese Landfrage muss mit irdischen Versprechen besiegelt werden – oder mit ruchlosen Drohungen."
 pam_interactions_events.0030.desc_vassal: "[recipient.GetTitledFirstNameNicknamed|U] wird [recipient.Custom('DE_PRO_POS_S_3P')]en Griff um [vassal.GetName] nicht so einfach lösen. Durch güldene Vorschläge oder mit fürchterlichen Drohungen: Meinen Vasall muss man sich verdienen."
 pam_interactions_events.0030.a: "Erinnert [recipient.GetFirstNameNoTooltip], dass [recipient.Custom('DE_PRO_PER_S_3P_N')] gewisse … Verpflichtungen hat."
 pam_interactions_events.0030.a.flavor: "Und das ist [Select_CString(actor.IsFemale, 'die', 'der')] [actor.GetTitleAsNameNoTooltip] von [actor.GetPrimaryTitle.GetNameNoTierNoTooltip], [Select_CString(actor.IsFemale, 'die', 'der')] sich an sie wenden kann!"
 pam_interactions_events.0030.b: "Ich brauche [Select_CString(recipient.IsFemale, 'keine', 'keinen')] [ROOT.Char.Custom2('RelationToMe', recipient)]. Ich brauche [target.GetNameNoTierNoTooltip]."
 pam_interactions_events.0030.b.flavor: "Macht es deutlich: Wenn [recipient.GetFirstNameNoTooltip] dies verweigert, bedeutet [recipient.Custom('DE_PRO_PER_S_3P_N')] Euch nichts mehr."
 pam_interactions_events.0030.c: "Falls [recipient.Custom('DE_PRO_PER_S_3P_N')] nicht nachgibt, dann schändet diesen heiligen Boden."
 pam_interactions_events.0030.c.tt: "Überzieht [Select_CString(recipient.IsFemale, 'die schmutzige Sünderin', 'den schmutzigen Sünder')] mit üblen Anschuldigungen! Ruft Verdammnis und Verachtung über Euch beide herab! [secondary_recipient.GetTitledFirstNameNoTooltip|U] und alle anderen [actor.GetFaith.PriestNeuterPlural] werden [recipient.GetFirstNameNoTooltip] zum Nachgeben bringen!"
 pam_interactions_events.0030.d: "Droht damit, daraus einen rufschädigenden Skandal zu machen."
 pam_interactions_events.0030.d.flavor: "[recipient.GetTitleAsNameNoTooltip], [Select_CString(recipient.IsFemale, 'die', 'der')] nur äußerst gering respektiert wird, kann schwerlich noch lange bestehen, wenn [Select_CString(recipient.IsFemale, 'ihr', 'sein')] Ruf und [Select_CString(recipient.IsFemale, 'ihr', 'sein')] Name auf dem Spiel stehen …"
 pam_interactions_events.0030.e: "Bietet einfach an, das Reich ([target.GetTierAsNameNoTooltip]) zu kaufen."
 pam_interactions_events.0030.f: "Ich überlasse das der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und dem Urteil von [recipient.GetFirstNameNoTooltip]."
 clergy_land_no_method_warning_tt: "@warning_icon!#X #bold Ohne Anreize ist es unwahrscheinlich, dass [recipient.GetShortUIName] annimmt!#!#!"
 clergy_land_no_method_warning_soft_tt: "@alert_icon! #alert_trial Ohne Anreize ist es weniger wahrscheinlich, dass [recipient.GetShortUIName] annimmt#!"
 # recipient receives actor's negotiation tactic
 pam_interactions_events.0034.t: "Der Streit um [target.GetNameNoTierNoTooltip]"
 pam_interactions_events.0034.desc_intro_envoy: "[secondary_recipient.GetTitledFirstNameRegnal|U] streitet weiter auf Geheiß von [actor.GetName] um [target.GetNameNoTier] – auch im Sinne der irdischen Ordnung der höchsten Macht ([recipient.GetFaith.HighGodName]) und des [recipient.GetFaith.GetAdjective|l]en Klerus, behauptet [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')]."
 pam_interactions_events.0034.desc_intro: "[actor.GetName|U] legt seine Ansichten in Sachen [target.GetNameNoTier] dar: [actor.Custom('DE_PRO_PER_S_3P_N')|U] erneuert die Forderungen, die vom [recipient.GetFaith.GetAdjective|l]en Glauben geschützt und unterstützt werden."
 pam_interactions_events.0034.desc_vassal: "Vergesst, dass mir [target.GetHolder.GetName] die ewige Treue schwor. Diese Treue, so scheint mir, ist verhandelbar."
 pam_interactions_events.0034.desc_target: "Vergesst, dass das Reich ([target.GetTierAsNameNoTooltip]) durch Blut und Eroberungen mir gehört. Alles auf dieser Welt ist Verhandlungsmasse."
 pam_interactions_events.0034.desc: "\n\nAuf heiligem Boden trete ich diesen Angriffen auf meine Rechte friedlich entgegen. Ich darf nur in Betracht ziehen, was mir geboten wird …\n\n"
 pam_interactions_events.0034.desc_method_hook: "Das Versprechen, dass die Verpflichtungen, die [actor.GetTitledFirstNameNoTooltip] mir auferlegte, für nichtig erklärt werden."
 pam_interactions_events.0034.desc_method_relation: "Ein ruinöses Ende für all die Wärme, das Vertrauen und die Liebe zwischen uns. Glaubt man [actor.GetFirstNameNoTooltip], hängt [actor.Custom('DE_PRO_POS_S_3P')] Herz an diesem Stück Land.\n\n[actor.Custom('DE_PRO_PER_S_3P_N')|U] wird mich für immer hassen, wenn ich es [actor.Custom('DE_PRO_PER_S_3P_D')] verweigere."
 pam_interactions_events.0034.desc_method_piety: "Die Gefahr, dass meine ohnehin schon brüchige Beziehung zum Glauben vollends zugrunde geht. Dies würde [actor.GetTitledFirstNameNoTooltip] auch bestreiten, doch [actor.Custom('DE_PRO_POS_S_3P')]e Frömmigkeit ist besser bekannt als die meine."
 pam_interactions_events.0034.desc_method_legitimacy: "Eine schwere Bedrohung meiner Legitimität. Ein hässlicher öffentlicher Streit um [target.GetNameNoTierNoTooltip], ein Skandal, der uns beide zum Gespött macht …"
 pam_interactions_events.0034.desc_method_gold: "Ein Haufen glitzernder Münzen. Ein angemessener Preis, den [actor.GetTitleAsNameNoTooltip] für ein solches Reich ([target.GetTierAsNameNoTooltip]) erhebt."
 pam_interactions_events.0034.desc_no_method: "… #EMP Gar nichts#!. Es gibt einfach nur die Forderung nach [target.GetNameNoTier] und die Annahme, dass ich den Zorn der [recipient.GetFaith.PriestNeuterPlural] und die Schrecken des Krieges fürchte."
 pam_interactions_events.0034.a: "[actor.Custom('DE_PRO_PER_S_3P_N')|U] mag [actor.Custom('DE_PRO_POS_S_3P')] Banner über [target.GetNameNoTierNoTooltip] wehen lassen."
 pam_interactions_events.0034.b: "Solang ich lebe, ist das Reich ([target.GetTierAsNameNoTooltip]) mein."
 pam_interactions_events.0035.t: "[target.GetNameNoTierNoTooltip] (Erworben)"
 pam_interactions_events.0035.desc_intro: "Nach etwas Bedenkzeit gibt [recipient.GetFirstNameNicknamed] nach! Die Verhandlungen für die Abtretung von [target.GetNameNoTier] sind rasch und erfolgreich.\n\nDem Erlass von [secondary_recipient.GetTitledFirstName] zu meinen Rechten wurde Rechnung getragen."
 pam_interactions_events.0035.desc_hook: "Die Verpflichtung, die ich [recipient.GetFirstNameNoTooltip] auferlegt hatte, wurde ehrenhaft erfüllt."
 pam_interactions_events.0035.desc_relation: "Ja, bittere Tränen werden vergossen, und Freude und Bewunderung enden. Ich fügte [recipient.GetFirstNameNoTooltip] schweres Leid zu, weil ich [target.GetNameNoTierNoTooltip] wollte. Aber …"
 pam_interactions_events.0035.desc_piety: "Und folglich müssen meine Drohungen, sowohl [recipient.GetFirstNameNoTooltip] als auch mich selbst in ruchloser Schmach zu ertränken … nicht umgesetzt werden."
 pam_interactions_events.0035.desc_legitimacy: "Und folglich müssen meine Drohungen, Streit und Verleumdung zu säen … nicht umgesetzt werden."
 pam_interactions_events.0035.desc_gold: "Nachdem meine Schatzmeister und Gläubiger benachrichtigt wurden – ein Preis, den ich bereitwillig zahle."
 pam_interactions_events.0035.desc_fallback: "Welch eine Macht, mit der die höchste Gottheit ([actor.GetFaith.HighGodName]) die [actor.GetFaith.GetAdjective|l]en [actor.GetFaith.PriestNeuterPlural] und mich versah! Ganz ohne Armeen oder Kriege: Die Welt wird durch unsere Befehle neu aufgestellt."
 pam_interactions_events.0035.desc_vassal: "\n\n[vassal.GetName|U] soll mir die Treue schwören."
 pam_interactions_events.0035.desc: "\n\nDas Reich ([target.GetTierAsNameNoTooltip]) gehört mir."
 pam_interactions_events.0035.a: "Über ganz [target.GetNameNoTierNoTooltip] sollen meine Banner im Wind wehen!"
 pam_interactions_events.0036.t: "[target.GetNameNoTierNoTooltip] (Abgelehnt)"
 pam_interactions_events.0036.desc_intro_afraid_admin: "Bewacht von mannhaften Soldaten gibt [recipient.GetTitledFirstName] [recipient.Custom('DE_PRO_POS_S_3P')]e Antwort, voll sichtlichem Unbehagen trotz der friedlichen Vermittlung von [secondary_recipient.GetTitledFirstName]:\n\n"
 pam_interactions_events.0036.desc_intro_afraid: "Kräftige [recipient.Custom('KnightCulturePluralNoTooltip')] bewachen [recipient.GetTitledFirstName], als [recipient.Custom('DE_PRO_PER_S_3P_N')] [recipient.Custom('DE_PRO_POS_S_3P')]e Antwort gibt, voll sichtlichem Unbehagen trotz der friedlichen Vermittlung von [secondary_recipient.GetTitledFirstName]:\n\n"
 pam_interactions_events.0036.desc_intro_pious: "Laut und ungebeugt gibt [recipient.GetTitledFirstName] [recipient.Custom('DE_PRO_POS_S_3P')]e Antwort, ermutigt durch die friedliche Vermittlung von [secondary_recipient.GetTitledFirstName]:\n\n"
 pam_interactions_events.0036.desc_intro_admin: "Von Leibwächtern flankiert gibt [recipient.GetTitledFirstName] [recipient.Custom('DE_PRO_POS_S_3P')]e Antwort, sichtlich verärgert wegen der friedlichen Vermittlung von [secondary_recipient.GetTitledFirstName]:\n\n"
 pam_interactions_events.0036.desc_intro: "Kräftige [recipient.Custom('KnightCulturePluralNoTooltip')] bewachen [recipient.GetTitledFirstName], als [recipient.Custom('DE_PRO_PER_S_3P_N')] [recipient.Custom('DE_PRO_POS_S_3P')]e Antwort gibt, sichtlich verärgert wegen der friedlichen Vermittlung von [secondary_recipient.GetTitledFirstName]:\n\n"
 pam_interactions_events.0036.desc_hook: "„Mein Herz gehört [target.GetNameNoTier] mehr als jeder Verpflichtung, die Ihr mir auferlegen könntet."
 pam_interactions_events.0036.desc_relation: "„[Select_CString(actor.IsFemale, 'Die', 'Der')] [actor.GetTitleAsName] von [actor.GetPrimaryTitle.GetNameNoTier] spuckt auf mein Herz und reißt mir die Seele in Stücke. Ich werde nichts mehr von [actor.Custom('DE_PRO_PER_S_3P_D')] hören."
 pam_interactions_events.0036.desc_piety: "„Wenn Euch [target.GetNameNoTier] verwehrt bleibt, befleckt Ihr uns beide mit Sünde und Verleumdung? Wohlan denn."
 pam_interactions_events.0036.desc_legitimacy: "„Verbreitet nur Eure giftigen Lügen. Wendet die Leute aus [target.GetNameNoTier] und alle anderen Völker gegen uns beide."
 pam_interactions_events.0036.desc_gold: "„Denkt Ihr, Ihr könntet [target.GetNameNoTier] mit Gold und Silber kaufen? Das ist viel zu gewöhnlich für ein derart nobles Reich ([target.GetTierAsNameNoTooltip])."
 pam_interactions_events.0036.desc_fallback: "„Können [Select_CString(actor.IsFemale, 'eine', 'ein')] [actor.GetTitleAsName] und [Select_CString(secondary_recipient.IsFemale, 'eine', 'ein')] [secondary_recipient.GetTitleAsNameNoTooltip] [target.GetNameNoTier] mit ein paar einfachen Worten gewinnen …? Nein."
 pam_interactions_events.0036.desc_afraid: "Sendet [recipient.GetFaith.PriestNeuterPlural] und ich werde sie willkommen heißen. Schickt Boten und ich werde mit ihnen verhandeln …\n\nDoch ich kann das Reich ([target.GetTierAsNameNoTooltip]) nicht einfach so aufgeben.“"
 pam_interactions_events.0036.desc_pious: "Sendet noch mehr korrupte [recipient.GetFaith.PriestNeuterPlural], sendet teuflische bewaffnete Scharen nach [target_capital.GetTitle.GetNameNoTier] …\n\nIch werde das Reich ([target.GetTierAsNameNoTooltip]), das die höchste Macht ([recipient.GetFaith.HighGodName]) mir schenkte, nicht aufgeben.“"
 pam_interactions_events.0036.desc: "Sendet noch mehr grölende [recipient.GetFaith.PriestNeuterPlural], sendet scharenweise bewaffnete [actor.Custom('GetFighterTermPlural')] nach [target_capital.GetTitle.GetNameNoTier] …\n\nIch werde das Reich ([target.GetTierAsNameNoTooltip]) nicht so einfach aufgeben.“"
 pam_interactions_events.0036.a_relation: "Wie konnte [recipient.Custom('DE_PRO_PER_S_3P_N')] sich mir verweigern?!?"
 pam_interactions_events.0036.a: "[Select_CString(secondary_recipient.IsFemale, 'Eine', 'Ein')] [secondary_recipient.GetTitleAsNameNoTooltip], [Select_CString(secondary_recipient.IsFemale, 'deren', 'dessen')] Wille man sich verweigert? Schändlich …"
 clergy_land_transfer_refusal_tt: "Weigerte sich, [target.GetName] [actor.GetShortUIName] zu überlassen"
 pam_interactions_events.0037.opening: "[ROOT.Char.GetFirstNameNicknamed], [ROOT.Char.GetTitleAsNameNoTooltip] von [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 pam_interactions_events.0037.desc: "Ich bedauere die Plötzlichkeit dieser Kunde, aber ich muss Euch über etwas in Kenntnis setzen: [Select_CString(actor.IsFemale, 'Die', 'Der')] [actor.GetTitleAsName] von [actor.GetPrimaryTitle.GetNameNoTier] ist fortan [Select_CString(actor.IsFemale, 'Eure Lehnsherrin', 'Euer Lehnsherr')].\n\nSo lautet der Wille von [secondary_recipient.GetTitledFirstNameRegnal], [secondary_recipient.Custom('DE_ART_DEF_S_N')] die Verhandlungen über Euer Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsName]) leitete, welche [actor.GetTitledFirstNameNicknamed] und meine Wenigkeit führten. So treu Ihr [recipient.GetPrimaryTitle.GetNameNoTier] gewesen seid, so treu seid auch gegenüber [Select_CString(actor.IsFemale, 'Eurer neuen Lehnsherrin', 'Eurem neuen Lehnsherrn')]."
 pam_interactions_events.0037_new_liege_tt: "[actor.GetShortUIName|U] wurde Euer [liege|E]"
 pam_interactions_events.0037.a: "Mein Eid ist nun hinfällig. Fortan kann mir niemand mehr Befehle erteilen."
 pam_interactions_events.0037.a.tt: "[recipient.GetTitledFirstNameNoTooltip|U] gab [recipient.Custom('DE_PRO_POS_S_3P')]e Suzeränität ab. Und wenn [actor.GetTitledFirstNameNoTooltip] wünscht, sie aufzunehmen … muss [actor.Custom('DE_PRO_PER_S_3P_N')] gut bewaffnet nach [target.GetNameNoTierNoTooltip] kommen."
 pam_interactions_events.0037.b: "[actor.GetPrimaryTitle.GetNameNoTierNoTooltip|U]? Wahrhaftig?"
 pam_interactions_events.0037.b.tt: "Wo meine Leute einst nach [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] blickten, schauen sie nun, so denke ich, nach [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
