 pam_interactions_events.0094.opening: "[Select_CString(ROOT.Char.IsFemale, 'Rechtmäßige', 'Rechtmäßiger')] [ROOT.Char.GetTitleAsName]!"
 pam_interactions_events.0094.desc_conversion: "Verbreitet das Wort der höchsten Macht ([cleric.GetFaith.HighGodName]) durch [target.GetNameNoTier]! Schont nicht die Rute gegenüber dem abtrünnigen Volk noch die Macht Eurer [ROOT.Char.Custom('GetFighterTermPlural')] zur Verteidigung der Tugenden des Landes.\n\nDieses Reich ([target.GetTierAsNameNoTooltip]) ist das Eure. Es wird der Vorsehung [Select_CString(ROOT.Char.IsFemale, 'einer', 'eines')] jeden [ROOT.Char.GetPrimaryTitle.GetAdjective|l]en [ROOT.Char.GetTitleAsName] anvertraut, #EMP de jure#! bis in alle Ewigkeit."
 pam_interactions_events.0094.desc: "Es ist ein gesegneter Tag für die [cleric.GetFaith.GetAdherentNamePlural] von [target.GetNameNoTooltip]! Oh, wie sie sich danach sehnten, eins mit ihren Brüdern und Schwestern in [ROOT.Char.GetPrimaryTitle.GetNameNoTier] zu werden!\n\nWas in den [target.GetAdjectiveNoTooltip|l]en Herzen lebte, ist nun durch [Select_CString(cleric.IsFemale, 'die', 'den')] [cleric.GetTitleAsName] der höchsten Macht ([cleric.GetFaith.HighGodName]) Recht geworden: Die Souveräne vieler Länder erkennen das Reich ([target.GetTierAsNameNoTooltip]) als ein #EMP De-jure#!-Reich von [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] an."
 pam_interactions_events.0094.a: "[target.GetNameNoTierNoTooltip|U] und [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sind auf ewig miteinander verbunden."
 pam_interactions_events.0095.opening: "[ROOT.Char.GetTitleAsName|U] und [target_county.GetNameNoTier] und verschiedener Länder,"
 pam_interactions_events.0095.desc: "Ihr untersteht dem Segen der höchsten Macht ([cleric.GetFaith.HighGodName])! In ihrer Weisheit hat sie alle [target.GetName] unter jenen ewigen Schutz gestellt, den [Select_CString(de_jure_master.IsFemale, 'die', 'der')] [de_jure_master.GetTitleAsName] von [de_jure_master.GetPrimaryTitle.GetName] bietet.\n\nAls [cleric.GetTitleAsName] verkünde ich diesen Erlass im Namen der [target.GetAdjectiveNoTooltip|l]en [cleric.GetFaith.GetAdherentNamePlural], im Namen des Menschen, der [de_jure_master.GetTitleAsNameNoTooltip] ist, und im Namen jener, die die Weisheit in dieser #EMP De-jure#!-Teilung der sterblichen Reiche der höchsten Macht ([cleric.GetFaith.HighGodName]) erkennen."
 pam_interactions_events.0095.a: "Die [de_jure_master.GetFaith.GetAdherentNamePluralNoTooltip] und ihre Gier sollen verdammt sein!"
