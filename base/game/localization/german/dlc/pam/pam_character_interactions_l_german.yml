 pam_interactions_events.0010.opening: "O [Select_CString(actor.IsFemale, 'rechtschaffene Beschützerin', 'rechtschaffener')] Beschützer von [target.GetNameNoTier],"
 pam_interactions_events.0010: "Wie lange schon wird die Vergabe von Land und Titeln durch die höchste Macht ([actor.GetFaith.HighGodName]) selbst übergangen? Wie lange schon schmachtet das Volk des Reichs ([target.GetTierAsNameNoTooltip]) ohne einen Hirten von [actor.GetHouse.GetName]-Geblüt?\n\nIch werde Euren Anspruch auf [target.GetNameNoTierNoTooltip] an jedem Hof, in jedem Rat und in jeder Schrift verfechten.\n\nEuer Anspruch soll nicht mit Euch sterben."
 pam_interactions_events.0010.a.low_zeal: "Und so wird ein Ahnenrecht geschmiedet …"
 pam_interactions_events.0010.a.high_zeal: "Möge die Erlösung von [target.GetNameNoTierNoTooltip] sehr viel früher als das kommen!"
 pam_interactions_events.0010.a: "Möge dies niemals vergessen werden."
