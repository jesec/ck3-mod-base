 DEMAND_DIVORCE_NOTIFICATION: "Es obliegt mir, von Euch zu verlangen, dass Ihr [Select_CString(secondary_recipient.IsFemale, 'Eure Ehepartnerin', 'Euren Ehepartner')] [secondary_recipient.GetTitledFirstName] verstoßt."
 DEMAND_DIVORCE_NOTIFICATION_INCESTUOUS: "\n\nIhr teilt dasselbe Blut mit [secondary_recipient.GetFirstNameNoTooltip], und die ganze Welt weiß es. Solch eine Inzucht darf keinen Bestand haben vor der höchsten Macht ([actor.GetFaith.HighGodName])."
 DEMAND_DIVORCE_NOTIFICATION_SAME_SEX: "\n\nEure Verbindung verspottet das Ehebett, so wie es die höchste Macht ([actor.GetFaith.HighGodName]) festlegte. Dieser Bund kann nicht bestehen bleiben."
 DEMAND_DIVORCE_NOTIFICATION_HEATHEN: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] beugt das Haupt vor fremden Göttern, doch teilt Euer Bett. Ich kann nicht dulden, dass eine solche Verbindung besteht."
 DEMAND_DIVORCE_NOTIFICATION_HERETIC: "\n\n[secondary_recipient.GetFirstNameNoTooltip|U] kam vom wahren Glauben ab und zieht Eure Seele mit sich. Dieser Bund kann nicht bestehen bleiben."
 DEMAND_DIVORCE_NOTIFICATION_INFIDELITY: "\n\nDie ganze Welt weiß, dass [secondary_recipient.GetFirstNameNoTooltip] die Treue des Ehebetts verriet. Was bereits zerbrochen ist, muss nun ein Ende finden."
 DEMAND_DIVORCE_NOTIFICATION_POLYGAMY: "\n\nIhr behaltet [secondary_recipient.GetFirstNameNoTooltip] als [Select_CString(secondary_recipient.IsFemale, 'eine Ehepartnerin', 'einen Ehepartner')] unter vielen, eine Übereinkunft, die die höchste Macht ([actor.GetFaith.HighGodName]) verabscheut. Dieser Bund kann nicht bestehen bleiben."
 DEMAND_DIVORCE_NOTIFICATION_PRETEXT: "\n\nGebildete Männer vollzogen Eure Blutlinie und die von [secondary_recipient.GetFirstNameNoTooltip] nach und fanden heraus, dass sie zu nahe miteinander verbunden sind. Blutsverwandtschaft – die Erkenntnisse sind recht eindeutig."
