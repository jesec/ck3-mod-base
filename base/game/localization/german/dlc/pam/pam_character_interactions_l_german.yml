 pam_interactions_events.0060.t: "Ehescheidung rechtfertigen"
 pam_interactions_events.0060.desc: "[puppet_or_actor.GetTitledFirstName|U] wünscht, die eigene Ehe zu beenden, ja, aber trotz all des bösen Willens, den [puppet_or_actor.Custom('DE_PRO_PER_S_3P_N')] und [secondary_recipient.GetTitledFirstName] füreinander hegen … so schlossen sie doch vor der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName]) einen heiligen Bund. Und sie haben keinen guten Grund, diesen aufzulösen.\n\nDaher muss ich mir ein paar Lügen ausdenken, um diese Annullierung zu rechtfertigen. Eine Blasphemie, die vielleicht auch eine gewisse Entschädigung verdient …"
 pam_interactions_events.0060.a: "Diese Trennung verdient … einen verdammten Skandal."
 pam_interactions_events.0060.a.tt: "Keine edlen Lügen werde ich von mir geben, sondern elende Anschuldigungen gegen [secondary_recipient.GetFirstNameNoTooltip]! [secondary_recipient.Custom('DE_PRO_POS_S_3P')|U]e Familie wird gezwungen sein, [secondary_recipient.Custom('DE_PRO_PER_S_3P_A')] zu verteidigen … ebenso wie die Verwandten von [puppet_or_actor.GetFirstNameNoTooltip] [puppet_or_actor.Custom('DE_PRO_PER_S_3P_A')]."
 pam_interactions_events.0060.b: "Lasst [Select_CString(puppet_or_actor.IsFemale, 'Die', 'Der')] [puppet_or_actor.GetTitleAsNameNoTooltip] den Gläubigen Land spenden."
 pam_interactions_events.0060.b.tt: "Einem gewissen Orden ([lease_order.GetName]) einen Titel zu verpachten, wird diese Last von unser aller Schultern nehmen …"
 pam_interactions_events.0060.c: "Ein Gefallen, der im Gegenzug einen Gefallen rechtfertigt."
 pam_interactions_events.0060.d: "Behaupten, dass [secondary_recipient.GetFirstNameNoTooltip] der Kirche versprochen wurde."
 pam_interactions_events.0060.d.tt: "Falls [secondary_recipient.Custom('DE_PRO_PER_S_3P_N')] vor langer Zeit einem gewissen Orden ([divorcee_joining_order.GetName]) gegenüber ein Gelübde abgelegt hätte, wäre diese Ehe ungültig! Und wer würde sich besser eignen, das neue Leben von [secondary_recipient.GetFirstNameNoTooltip] anzuleiten, als ich?"
 pam_interactions_events.0060.e: "Stellt keine Forderungen an das unglückliche Paar."
