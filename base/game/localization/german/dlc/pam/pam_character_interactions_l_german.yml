 pam_interactions_events.0100.t: "Kein Bastard mehr"
 pam_interactions_events.0100.desc: "Vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und den versammelten Gläubigen erklärte mich [actor.GetTitledFirstName] als rechtmäßig geboren. Was mir meine Geburt verweigerte, gewährte mir der Klerus mit heiligen Riten und einem Federstrich.\n\nKeine Zunge wird mich je wieder einen Bastard heißen."
 pam_interactions_events.0100.a: "Der Makel ist fortgewaschen!"
 pam_interactions_events.0101.opening: "Gesegnet sei Euer Haus,"
 pam_interactions_events.0101.desc: "Es freut mich, Euch frohe Kunde zu überbringen. [Select_CString(recipient.IsFemale, 'Eure', 'Euer')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstNameNoTooltip] wurde von mir vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) als rechtmäßig geboren erklärt.\n\nWeder Gesetz noch Gerücht können [recipient.Custom('DE_PRO_POS_S_3P')]e Geburt weiterhin gegen [recipient.Custom('DE_PRO_PER_S_3P_A')] verwenden."
 pam_interactions_events.0101.a: "In der Tat willkommene Neuigkeiten."
