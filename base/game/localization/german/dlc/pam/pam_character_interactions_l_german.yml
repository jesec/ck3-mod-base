 pam_interactions_events.0083.opening: "Mit der mir durch unseren Glauben ([recipient.GetFaith.GetReligion.GetNameNoTooltip]) verliehenen Autorität:"
 pam_interactions_events.0083.desc: "Wisset, dass ich Euren Krieg gegen [puppet_or_actor.GetTitledFirstName] abwog und ihn als entschieden betrachtete. Eine Fortsetzung der Kämpfe hätte bedeutet, christliches Leben für eine Sache zu opfern, die bereits verloren ist, und ich will dieses Blut nicht an meinen Händen sehen.\n\nIch erklärte den Krieg für gewonnen. Diejenigen, die die Entscheidung der Kirche mittragen, werden belohnt werden."
