 pam_interactions_events.0090.opening: "O [puppet_or_actor.GetMotherFather|U] des Reichs,"
 pam_interactions_events.0090.desc: "Die höchste Macht ([recipient.GetFaith.HighGodName]) blickt wahrlich voll liebevoller Gunst auf [recipient.GetPrimaryTitle.GetNameNoTier]! Durch Eure Verkündung bin ich nun [recipient.GetTitleAsName] des Landes, und den [recipient.GetFaith.GetAdjective|l]en Gläubigen wurde Freude geschenkt.\n\nIch werde diesen Besitz ([recipient.GetPrimaryTitle.GetTierAsName]) mit meinem Leben verteidigen. Mit meinen Gesetzen werde ich weise Urteile fällen. Mit Schwert und Zepter werde ich entschlossen herrschen. Und ich werde gut auf Euren Rat hören."
 pam_interactions_events.0090.a: "[Select_CString(recipient.IsFemale, 'Eine neue', 'Ein neuer')] [recipient.GetTitleAsNameNoTooltip] wurde uns von der höchsten Macht ([actor.GetFaith.HighGodName]) geschenkt."
 pam_interactions_events.0090.a.flavor: "Und dank ihrer Weisheit … ist [recipient.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale, 'eine', 'ein')] [recipient.GetTitleAsNameNoTooltip], [Select_CString(recipient.IsFemale, 'die', 'der')] tief in meiner Schuld steht."
 has_valid_exclave_duchy_tt: "Die [duchies|E], die zum [kingdom|E] von [recipient.GetShortUIName] hinzugefügt werden, müssen an ein beliebiges Herzogtum angrenzen, das nach der Erschaffung des Königreichs eine [Concept('de_jure', 'De-jure')|E]-Exklave wird: ein Herzogtum, das nicht der Haupsitz ist und das nicht länger die anderen Herzogtümer seines Königreichs berührt."
