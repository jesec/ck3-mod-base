 pam_interactions_events.0011.opening: "Stets unzufrieden[actor.Custom('DE_END_ADJ_IND_S_N')] [actor.GetTitleAsName],"
 pam_interactions_events.0011: "Ich sende dieses Schreiben mit Sorgfalt und Sorge. Mindert es nicht Eure Würde … derart schamlos auf etwas zu beharren, was Euch nicht zusteht? Sorgt Ihr Euch nicht darum, die höchste Macht ([actor.GetFaith.HighGodName]) zu beleidigen? Oder Eure [actor.GetFaith.GetReligion.GetAdjective|l]en Glaubensgeschwister?\n\nWenn Euer Geist im Jenseits ([actor.GetFaith.PositiveAfterLife]) seine ewige Ruhe findet – und sollte das Schicksal rachsüchtig sein an einem schlimmen Ort ([actor.GetFaith.NegativeAfterLife]), so lasst uns beten, dass [target.GetNameNoTier] dann Frieden findet."
