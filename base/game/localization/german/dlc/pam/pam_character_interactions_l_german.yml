 pam_interactions_events.0091.opening: "[Select_CString(ROOT.Char.IsFemale, 'Meine Wohltäterin', 'Mein Wohltäter')],"
 pam_interactions_events.0091.desc_hook_theocrat: "Euer Eingreifen lässt mich mit einer großen Verpflichtung zurück. In die eine Hand ist mir der Schäferstab gegeben, um die andere schließt sich der feste Griff der höchsten Macht ([recipient.GetFaith.HighGodName]) selbst. Und so muss es sein, da ich [Select_CString(recipient.IsFemale, 'ihre treue Dienerin', 'ihr treuer Diener')] bin! [target.GetNameNoTier|U] ist ein prächtiges Geschenk und ich [Select_CString(recipient.IsFemale, 'eine dankbare Begünstigte', 'ein dankbarer Begünstigter')].\n\nLasst es in allen Landen bekannt machen: Durch den Willen von [ROOT.Char.GetTitledFirstNameRegnal] gehört dieses Reich ([target.GetTierAsName]) dem Klerus!"
 pam_interactions_events.0091.desc_hook: "Euer Eingreifen lässt mich mit einer großen Verpflichtung zurück. In die eine Hand ist mir das Zepter der Herrschaft gegeben, um die andere schließt sich der feste Griff der höchsten Macht ([recipient.GetFaith.HighGodName]) selbst. Und so muss es sein, da ich [Select_CString(recipient.IsFemale, 'ihre treue Dienerin', 'ihr treuer Diener')] bin! [target.GetNameNoTier|U] ist ein prächtiges Geschenk und ich [Select_CString(recipient.IsFemale, 'eine dankbare Begünstigte', 'ein dankbarer Begünstigter')].\n\nLasst es in allen Landen bekannt machen: Durch den Willen von [ROOT.Char.GetTitledFirstNameRegnal] gehört dieses Reich ([target.GetTierAsName]) mir!"
 pam_interactions_events.0091.desc: "Euer Eingreifen ist ein Segen weit jenseits von allem, was ich für möglich hielt. Der Arm [Select_CString(ROOT.Char.IsFemale, 'des Heiligen Vaters', 'der Heiligen Mutter')] reicht weit, und er ist auch voller Güte – Dank sei der höchsten Macht ([recipient.GetFaith.HighGodName])!\n\n[target.GetName|U] ist ein edles Land. Voll Demut und Gnade werde ich seinen Titel halten und über seine [recipient.GetFaith.GetAdherentNamePlural] gebieten."
 pam_interactions_events.0091.a: "Ich werde [target.GetNameNoTierNoTooltip] scharf im Auge behalten."
 pam_interactions_events.0092.opening_theocratic: "Höchst verehrter [ROOT.Char.GetFaith.PriestNeuter],"
 pam_interactions_events.0092.opening: "Mein [ROOT.Char.Custom('GetTitleTierAdjective')|l]es Kind,"
 pam_interactions_events.0092.desc_hook: "Während Ihr über dem mächtigen Geschenk betet, mit dem die höchste Macht ([recipient.GetFaith.HighGodName]) und ihre Prälaten Euch überschütteten, bedenket gut, wie würdig Ihr dieses Reichs ([target.GetTierAsName]) seid. Womöglich verbleiben noch Akte der hingebungsvollen Verehrung, die Ihr zu leisten habt.\n\nIch werde Euch meinen Ratschlag in dieser Sache zuteilwerden lassen. Wir müssen Sorge dafür tragen, dass Eure Herrschaft in [target.GetNameNoTierNoTooltip] die höchste Macht ([recipient.GetFaith.HighGodName]) erfreut und ihr bestens dient."
 pam_interactions_events.0092.desc: "Euer Reich ([target.GetTierAsNameNoTooltip]) ist verkündet.\n\nAngeleitet durch meine Gebete zeigte ich tatsächlich ein besonderes Interesse an Eurem Vorankommen. Ich bitte nur darum, dass Ihr gut herrscht, auf dass die [recipient.GetFaith.GetAdherentNamePlural] von [target.GetNameNoTier] Euch als Segen empfinden mögen."
 pam_interactions_events.0092.a: "Ein Mandat direkt von einem Ort des Guten ([recipient.GetFaith.PositiveAfterLife])!"
 request_unformed_title_interaction: "Einen Titel erbitten"
 request_unformed_title_interaction_desc: "Bittet [recipient.GetShortUIName], einen noch nicht geschaffenen [Concept('de_jure', 'De-jure')|E]-[title|E] über Eure eigenen Ländereien zu verkünden und ihn Euch zu übergeben"
 REQUEST_UNFORMED_TITLE_NOTIFICATION: "[target.GetName|U] ist schon viel zu lange unbesetzt, obwohl mir diese Ländereien – bis auf den Namen – bereits gehören. Verkündet dies, und alle [puppet_or_actor.GetFaith.GetAdherentNamePlural] werden erkennen, dass ich sie durch Eure Gnade und die der höchsten Macht ([puppet_or_actor.GetFaith.HighGodName]) mein Eigen nennen darf."
 request_unformed_title_no_hegemony_tt: "[hegemony|E]-[title_tier|E]-[titles|E] können nicht vom [clergy|E] erbeten werden"
 request_unformed_title_tier_range_tt: "Ihr könnt nur [titles|E] Eures eigenen [Concept('title_tier', 'Titelrangs')|E] oder eines Rangs darüber erbitten"
