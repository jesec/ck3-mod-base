 target_char_must_be_clerical_subordinate_tt: "Als [Concept('ecclesiastical', 'kirchlicher')|E] oder [Concept('theocratic', 'theokratischer')|E] [ruler|E] muss [target_char.GetShortUIName] [vassal|E], oder [subordinate|E] von [excommunicator.GetShortUIName] sein oder [excommunicator.Custom('DE_PRO_PER_S_3P_D')] anderweitig unterstehen"
 bishop_excommunication_target_secular_tt: "[target_char.GetShortUIName|U] muss entweder:\n$EFFECT_LIST_BULLET$[vassal|E] oder noch Geringeres von [excommunicator.GetShortUIName] sein\n$EFFECT_LIST_BULLET$Ein benachbarter [ruler|E] von [excommunicator.GetShortUIName] oder in derselben [clerical_region|E] beheimatet sein\n$EFFECT_LIST_BULLET$Einen [court_chaplain|E] haben, der [subordinate|E] oder noch Geringeres von [excommunicator.GetShortUIName] ist\n$EFFECT_LIST_BULLET$[excommunicator.GetShortUIName] als [court_chaplain|E] haben und [excommunicator.GetShortUIName] besitzt keinen [Concept('superior', 'Oberen')|E]\n$EFFECT_LIST_BULLET$Ein [liege|E] oder jemand Höheres hat [excommunicator.GetShortUIName] als [court_chaplain|E]"
 bishop_excommunication_target_courtier_tt: "Der [liege|E] von [target_char.GetShortUIName|U] muss [excommunicator.GetShortUIName], ein [vassal|E] oder etwas noch Geringeres von [excommunicator.GetShortUIName] oder ein benachbarter [ruler|E] oder in der [clerical_region|E] von [excommunicator.GetShortUIName] beheimatet sein"
 bishop_excommunication_target_wanderer_tt: "[target_char.GetName|U] muss sich im [realm|E] von [excommunicator.GetShortUIName], einer benachbarten [county|E] oder in der [clerical_region|E] von [excommunicator.GetShortUIName] befinden"
 can_excommunicate_directly: "[puppet_or_actor.GetShortUIName|U] can [secondary_recipient.GetShortUIName] direkt [excommunicate|El]"
 no_valid_excommunicator_tt: "Da Euer [faith|E] kein [Concept('theocratic', 'theokratisches')|E] [head_of_faith|E] besitzt, kann [secondary_recipient.GetShortUIName] nur von einem mächtigen [Concept('ecclesiastical', 'kirchlichen')|E] [ruler|E] [excommunicated|El] werden, der entweder:\n$EFFECT_LIST_BULLET$[secondary_recipient.Custom('DE_PRO_POS_S_3P')] [liege|E] oder etwas noch Höheres ist\n$EFFECT_LIST_BULLET$Ein benachbarter [ruler|E] ist oder den [realm_capital|E] in derselben [clerical_region|E] hat\n$EFFECT_LIST_BULLET$Ein [superior|E] oder etwas noch Höheres des [Concept('court_chaplain','Ratspredigers')|E] des Ziels ist\n$EFFECT_LIST_BULLET$Der [court_chaplain|E] des Ziels ist und keinen [Concept('superior', 'Oberen')|E] hat"
