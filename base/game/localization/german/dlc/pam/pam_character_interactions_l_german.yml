 pam_reaffirm_doctrine_interaction_notification: "[recipient.GetRite.GetName|U] kommt ab von der kostbaren Orthodoxie der [actor.GetRite.GetAdjective|l]en Doktrin. [actor.GetTitleAsName|U] drängt Euch alle, Buße zu tun! Dient der höchsten Macht ([recipient.GetFaith.HighGodName]), und die [recipient.GetRite.GetAdherentNamePluralNoTooltip] sollen von Euch Predigten in Sachen [pam_reaffirm_doctrine.GetDescriptiveName(recipient.GetFaith)] hören."
