 pam_interactions_events.0001.opening: "[Select_CString(ROOT.Char.IsFemale, 'Edler', 'Edle')] [ROOT.Char.GetTitledFirstName],"
 pam_interactions_events.0001.hook_intro: "Natürlich! Ich muss Euch unterstützen."
 pam_interactions_events.0001.intro: "Es ist nur richtig und angemessen, dass Ihr die Zustimmung [recipient.GetTitleAsNamePossessive] sucht."
 pam_interactions_events.0001: "Alle [recipient.GetFaith.GetReligion.GetAdjective|l]en Titel dieser Welt werden schließlich allein durch den heiligen Willen der höchsten Macht ([recipient.GetFaith.HighGodName]) gehalten."
 pam_interactions_events.0001.mid: "Die [recipient.GetFaith.HouseOfWorshipPlural] Eures Reichs sollen ein hohes Lob auf Euer Mandat erklingen lassen und die höchste Macht ([recipient.GetFaith.HighGodName]) preisen, da sie [ROOT.Char.Custom('DE_ART_IND_A')] [ROOT.Char.GetTitleAsNameNoTooltip] wie Euch nach [actor.GetPrimaryTitle.GetNameNoTier] führte."
 pam_interactions_events.0001.tithe: "\n\nWährend der Zehnt ausgezahlt wird, soll Folgendes geschehen:"
 pam_interactions_events.0001.hook: "\n\nMein Gefallen für Euch:"
 pam_interactions_events.0001.monks: "\n\nDie Klöster sollen jauchzen."
 pam_interactions_events.0001.donate: "\n\nIn Dankbarkeit für Eure Spende soll Folgendes geschehen:"
 pam_interactions_events.0001.normal: "\n\nIch muss auf etwas bestehen:"
 pam_interactions_events.0001_disgust: "\n\nSchwärzt nur nicht diese Worte mit bösen Taten."
 pam_interactions_events.0001_disapprove: "\n\nWerdet bitte diesen lobenden Worten auch gerecht."
 pam_interactions_events.0001_approve: "\n\nUnser Lob wird wahrhaftig und dankbar sein."
 pam_interactions_events.0001_offer_hook_end: "\n\nMöge dieser Gefallen nicht vergessen werden."
 pam_interactions_events.0001.a.low_zeal: "Es ist gut, dass sich das Volk leichter überzeugen lässt als ich …"
 pam_interactions_events.0001.a.high_zeal: "Mich anzuzweifeln, heißt, das Wort der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) anzuzweifeln!"
 pam_interactions_events.0001.a: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) gab mir meinen Preis: [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 pam_interactions_events.0001.toast_puppeteer: "[puppet_or_actor.GetShortUIName|U] gewährte [recipient.GetShortUIName] klerikale [legitimacy|E]"
 pam_interactions_events.0002.opening: "[ROOT.Char.GetTitledFirstNameRegnal],"
 pam_interactions_events.0002: "Die Symbole Eurer Autorität liegen bereits in Euren Händen und schmücken Euren Leib … Warum braucht Ihr da noch die Stimmen jener, die der höchsten Macht ([recipient.GetFaith.HighGodName]) dienen? Brutale Gewalt, finstere Taten und grässliche Komplotte stehen Euch zur Verfügung.\n\nGebt gut Acht auf Eure [ROOT.Char.Custom('GetTitleTierAdjective')|l]en Gewänder, denn die Diener der höchsten Macht [recipient.GetFaith.HighGodName] werden in keiner Weise dazu beitragen, dass Ihr sie behaltet."
 pam_interactions_events.0002.a: "Verdammt seien die [recipient.GetFaith.PriestNeuterPlural] und ihr Hochmut!"
