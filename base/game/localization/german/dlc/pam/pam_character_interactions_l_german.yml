 pam_negotiate_land_possible_acceptance_tt: "Um [recipient.GetShortUIName] zu überzeugen, Euch einen [title|E] zu übergeben, erfordert von [actor.GetShortUIName] entweder:\n$BULLET_WITH_TAB$Ein [hook_i][hook|E] bei [recipient.GetShortUIName]\n$BULLET_WITH_TAB$Eine [Concept('friend', 'Freundes')|E]-, [Concept('disciple', 'Zöglings')|E]- oder [Concept('soulmate', 'Seelengefährten')|E]-[relation|E]\n$BULLET_WITH_TAB$Höhere @piety_icon![piety_level|E]\n$BULLET_WITH_TAB$Höhere @legitimacy_icon![legitimacy_level|E]\n$BULLET_WITH_TAB$#high [recipient.MakeScope.ScriptValue('pam_transfer_land_gold_value')]#! @gold_icon![gold|E] oder @treasury_icon![treasury|E]\n$BULLET_WITH_TAB$[recipient.GetShortUIName|U] ist @intimidated_icon![intimidated|El] und hat weniger als #high 25 %#! Eurer Militärstärke ([allies|E] mitgezählt)\n$BULLET_WITH_TAB$[recipient.GetShortUIName|U] ist @terrified_icon![cowed|El] und hat weniger als #high 50%#! Eurer Militärstärke ([allies|E] mitgezählt)"
