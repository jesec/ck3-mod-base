 ecclesiastical_de_jure_shifting_grant_interaction_notification: "So wie sich Eltern um ein geliebtes Kind kümmern, möchte ich [puppet_or_actor.GetPrimaryTitle.GetName] nähren und [target.GetName] für alle Ewigkeit beschützen. Lasst uns dies zu einem rechtmäßigen und heiligen Bund erklären."
 pam_interactions_events.0096.opening: "Umsichtig ist die Hand der höchsten Mächte ([ROOT.Char.GetFaith.random_GoodGodNames])!"
 pam_interactions_events.0096.desc: "[target.GetNameNoTier] von [former_de_jure_liege.GetNameNoTier] zu lösen, ist eine höchst weise und gesegnete Tat!\n\nLasst es so sein, wie Ihr es erließet: Für alle Zeiten soll [de_jure_master.GetPrimaryTitle.GetNameNoTier] ein Bollwerk sein, das zwischen dem Reich ([target.GetTierAsNameNoTooltip]) und dem Jenseits ([ROOT.Char.GetFaith.PositiveAfterLife]) steht, sodass gläubige [target.GetAdjectiveNoTooltip|l]e [ROOT.Char.GetFaith.GetAdherentNamePlural] auf ewig zum Licht der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) geführt werden.\n\nDies werde ich in meinen heiligen [de_jure_master.Custom('GetTitleTierAdjective')|l]en Eid aufnehmen."
 pam_interactions_events.0096.a: "Möge sich dies wahrlich als eine harmonische Verbindung erweisen."
