 pam_forced_negotiate_land_piety_level_2_tt: "Sorgt dafür, dass [actor.GetShortUIName] #N 500#! @piety_icon![piety_experience|E] und [recipient.GetShortUIName] #N 1#! @piety_icon![piety_level|E] verliert"
