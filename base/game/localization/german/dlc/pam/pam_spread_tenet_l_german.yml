l_german:
 # Spread the Word — activity intent, pulse actions, and per-activity events
 # Intent
 spread_personal_tenet_intent: "Grundsatz predigen"
 spread_personal_tenet_intent_desc: "Ihr wollt empfänglichen Gästen Euren [Concept('personal_tenet', 'persönlichen Grundsatz')|E] predigen, damit sie ihn selbst annehmen und seine [tenet_popularity|E] steigt."
 spread_personal_tenet_intent_not_valid_desc: "Ihr habt keinen [Concept('personal_tenet', 'persönlichen Grundsatz')|E] mehr"
 UNLOCK_SPREAD_PERSONAL_TENET_INTENT: "Erlaubt den [intent|E] #EMP $spread_personal_tenet_intent$#! bei [activities|E] mit Gästen, was es Euch erlaubt, die [tenet_popularity|E] zu erhöhen"
 # Pulse actions
 apa_pam_spread_tenet_host_title: "[first.GetShortUINameNoTooltip|U] gewinnt [second.GetShortUINameNoTooltip] für sich"
 apa_pam_spread_tenet_guest_title: "[first.GetShortUINameNoTooltip|U] gewinnt [second.GetShortUINameNoTooltip] für sich"
 # Shared event text
 pam_spread_tenet_events.forbidden.desc: "\n\nAber was mein Herz erfüllt, ist etwas namens [spread_tenet.GetBaseName] – eine Überzeugung, die mein eigener Glaube verdammt. Davon zu sprechen, heißt mein Schicksal in die Hände aller Zuhörer zu legen."
 pam_spread_tenet_option_scripture: "Die Heilige Schrift selbst spricht für mich."
 pam_spread_tenet_option_preach: "Hört, was ich für wahr halte!"
 pam_spread_tenet_option_forbidden: "Die Wahrheit ist das Wagnis wert. Kommt näher."
 pam_spread_tenet_option_decline: "Ein anderes Mal vielleicht."
 pam_spread_tenet_forbidden_flavor: "Nicht jedes gespitzte Ohr ist mir wohlgesonnen …"
 pam_spread_tenet_overheard_toast: "Unfreundliche Ohren"
 pam_spread_tenet_events.0001.t: "Tischgespräch"
 pam_spread_tenet_events.0001.desc: "Der Tisch ächzt unter der Last teurer Speisen ([ROOT.Char.Custom('GetExpensiveMeal')]) bester Güte, und in der Halle ertönen Trinksprüche unter Gelächter.\n\n„Ihr sprecht wie jemand, der lange über heilige Dinge nachdachte“, sagt [pam_spread_listener_1.GetTitledFirstName] und beugt sich zu einer Platte voll [ROOT.Char.GetCapitalLocation.Custom('get_region_fruit')] hinüber. „Sprecht weiter.“\n\nDer Tisch verstummt. Ein Zuhörerschaft voll offener Ohren …"
 pam_spread_tenet_events.0101.t: "Rund um das Feuer"
 pam_spread_tenet_events.0101.desc: "Eine kurze Pause auf der Jagd. Wir sitzen um das Feuer, am Drehspitz tropft [ROOT.Char.Custom('GetRandomRegionalSmallGame')].\n\n„Eine solche Verfolgungsjagd wendet die Seele zu erhabeneren Dingen“, murmelt [pam_spread_listener_1.GetTitledFirstName], den Blick starr auf die Flammen gerichtet.\n\nDas flackernde Licht des Feuers, Stille und Ohren, die dem Lauschen zugeneigt sind."
 pam_spread_tenet_events.0201.t: "Zwischen den Runden"
 pam_spread_tenet_events.0201.desc: "Zwischen den Wettkämpfen sind die Ränge leer. Knappen schleppen gesplitterte Lanzen weg, während die Menge im Schatten ihre Plaudereien genießt.\n\n„Jeder Sieger dankt der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]), und jeder Verlierer verflucht das Böse ([ROOT.Char.GetFaith.DevilName])“, scherzt [pam_spread_listener_1.GetTitledFirstName] neben mir. „Denkt einer von ihnen über das Warum nach?“\n\nEine Atempause, eine Bank voll Würdenträger und eine Frage, die in der Luft liegt."
 pam_spread_tenet_events.0301.t: "Stoßen wir auf die Überzeugung an"
 pam_spread_tenet_events.0301.desc: "Becher um Becher wird erhoben: auf die Neuvermählten, auf noch ungeborene Erben …\n\n„Und auf diue höchste Macht ([ROOT.Char.GetFaith.HighGodName]), die alle Seelen miteinander verbindet!“, fügt [pam_spread_listener_1.GetTitledFirstName] unter grummeliger Zustimmung hinzu.\n\nDie Herzen hier sind offen: für Liebe, Hoffnung und heilige Dinge. Nun Ausgesprochenes wird Wurzeln schlagen."
 pam_spread_tenet_events.0401.t: "Worte bei der Trauerfeier"
 pam_spread_tenet_events.0401.desc: "Die Trauernden versammeln sich in lockeren Grüppchen und tauschen leise Worte über die Verstorbenen und das Schicksal aus, das uns alle erwartet.\n\n„Es ereilt uns alle“, sagt [pam_spread_listener_1.GetTitledFirstName] leise an meiner Seite.\n\n„Und trotzdem streiten wir uns noch immer über Kleinigkeiten.“ Trauer bricht eine Seele auf …"
