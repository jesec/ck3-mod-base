 PAM_CHALLENGE_HOF_WAR_CB_NAME: "[head_of_faith|E]-Herausforderung"
 pam_challenge_hof_cb: "$PAM_CHALLENGE_HOF_WAR_CB_NAME$"
 pam_challenge_hof_cb_victory_desc_attacker_sponsor: "Das von Euch geförderte [challenger_hof|E] nimmt sich die Titel des [Concept('head_of_faith', 'Glaubensoberhaupts')|E] und der [attacker.GetRite.GetName] wird der [mainline_rite|E]."
 pam_challenge_hof_cb_victory_desc_attacker: "Ihr nehmt die Titel [head_of_faith_possessive|E] an Euch und der [attacker.GetRite.GetName] wird der [mainline_rite|E]."
 pam_challenge_hof_cb_victory_desc: "Das [challenger_hof|E] wird zum [head_of_faith|E]."
 pam_challenge_hof_cb_white_peace_desc: "[defender.GetShortUIName|U] bleibt das [head_of_faith|E]."
 pam_challenge_hof_cb_defeat_desc_attacker: "Eure Herausforderung gegenüber dem [head_of_faith|E] scheitert."
 pam_challenge_hof_cb_defeat_desc: "$pam_challenge_hof_cb_defeat_desc_attacker$"
 msg_pam_challenge_hof_cb_invalidated_message: "Der Krieg endete: Der Verteidiger ist nicht länger [head_of_faith|E]."
 msg_pam_challenge_hof_cb_invalidated_no_challenger_message: "Der Krieg endete: Es gibt keinen Anwärter mehr auf das Amt des Glaubensoberhaupts."
 pam_antipope_sponsor_vassalize_hof_tt: "[new_hof.GetShortUIName|U] [Select_CString(new_hof.IsLocalPlayer, 'werdet', 'wird')] [vassal|E] von [sponsor.GetShortUIName]"
 PAM_ANTIKING_WAR_CB_NAME: "[challenger_hof|E] absetzen"
 pam_antiking_cb: "$PAM_ANTIKING_WAR_CB_NAME$"
 pam_antiking_cb_victory_desc_attacker: "Ihr beseitigt das [challenger_hof|E] von [defender.GetShortUIName] und verdient Euch die Dankbarkeit von [attacker.GetFaith.GetReligiousHead.GetShortUIName]."
 pam_antiking_cb_victory_desc_attacker_no_gratitude: "Ihr entfernt das [challenger_hof|E] von [defender.GetShortUIName]."
 pam_antiking_cb_victory_desc: "Das [challenger_hof|E] ist abgesetzt."
 pam_antiking_cb_white_peace_desc: "Das [challenger_hof|E] bleibt im Amt."
 pam_antiking_cb_defeat_desc_attacker: "Euer Versuch, das [challenger_hof|E] zu beseitigen, scheitert."
 pam_antiking_cb_defeat_desc: "Das [challenger_hof|E] überlebt."
 msg_pam_antiking_cb_invalidated_message: "Der Krieg endete: Der Verteidiger fördert nicht länger einen [challenger_hof|E]."
 pam_humiliation_cb_papabile_score_loss_tt: "[papabile_score|E] von [defender.GetShortUIName|U] für die Papstnachfolge sinkt um #N -25#!"
 pam_humiliation_cb_papabile_score_loss_attacker_tt: "[papabile_score|E] von [attacker.GetShortUIName|U] für die Papstnachfolge sinkt um #N -25#!"
 pam_clerical_disgrace_modifier: "Eine Schande für den Klerus"
 pam_clerical_disgrace_modifier_desc: "Dieser Charakter wurde in einem Religionskrieg gedemütigt, wodurch sich sein [candidate_score|E] für [clerical_titles|E] verschlechterte."
 pam_clerical_disgrace_candidacy_penalty_desc: "In einem Religionskrieg gedemütigt"
 pam_antipope_events.0010.t: "Der Thronräuber wurde entlarvt"
 pam_antipope_events.0010.desc.christian: "[pam_ch_hof_challenger.Custom('DE_ART_DEF_S_N')|U] [pam_ch_hof_challenger.Custom('InsultAdjectiveGeneric')|l]e schismatische [pam_ch_hof_challenger.GetTitledFirstName] kniet vor mir, nun [pam_ch_hof_challenger.Custom('DE_PRO_POS_S_3P')]es falschen Titels als [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] entledigt.\n\nUnbeirrt erklärt [pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_N')]: „Die Arche ist dort, wo ich stehe. Nicht zu Euren Füßen.“\n\n[pam_ch_hof_challenger.Custom('DE_PRO_POS_S_3P')|U]e Zunge ist offenbar nach wie vor eine Dienerin Satans."
 pam_antipope_events.0010.desc: "Der Thronräuber [pam_ch_hof_challenger.GetTitledFirstName] kniet vor mir, [pam_ch_hof_challenger.Custom('DE_PRO_POS_S_3P')]es falschen Titels als [ROOT.Char.GetFaith.ReligiousHeadTitleName] entledigt.\n\nUnbeirrt antwortet [pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_N')]: „Ich bin [pam_ch_hof_challenger.Custom('DE_ART_DEF_S_N')] wahre [ROOT.Char.GetFaith.ReligiousHeadName].“"
 pam_antipope_events.0010.a.christian: "Eine Zelle kann [pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_A')] so reumütig machen wie Jona."
 pam_antipope_events.0010.a: "Sperrt [pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_A')] weg."
 pam_antipope_events.0010.b.christian: "Richtet [pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_A')] hin. Der Herr kennt die Seinen."
 pam_antipope_events.0010.b: "Richtet [pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_A')] hin. Die höchste Instanz ([ROOT.Char.GetFaith.HighGodName|U]) wird den Rest richten!"
 pam_antipope_events.0010.c: "Zeigt Gnade."
 pam_antipope_events.0010.d: "[pam_ch_hof_challenger.Custom('DE_PRO_PER_S_3P_N')|U] wird den Namen jener Person schreien, die der wahre [ROOT.Char.GetFaith.ReligiousHeadName|U] ist."
 pam_challenge_hof_war_random_permanent_harm_tt: "Erleidet eine zufällige bleibende Verletzung"
 pam_antipope_events.0011.t: "Der Preis des Patronats"
 pam_antipope_events.0011.desc.christian: "Die finanzielle Lage von [pam_ch_hof_sponsor.GetTitledFirstName] schürte diesen bösartigen Bruch und brachte einen rivalisierenden [ROOT.Char.GetFaith.ReligiousHeadName] gegen den [ROOT.Char.GetRite.GetName] auf.\n\nDie Heilige Schrift geht mit solchen Gönnern nicht zimperlich um: [Glossary('$pam_romans_1_32_english|q$','ROMANS_1_32_GLOSS')]\n\n[pam_ch_hof_sponsor.Custom('DE_PRO_PER_S_3P_N')|U] blickt bis zuletzt trotzig auf und sagt: „Ihr seid kein [ROOT.Char.GetFaith.ReligiousHeadName], sondern ein falscher Mönch. Steigt hinab, steigt hinab, um für alle Zeiten verdammt zu sein.“"
 pam_antipope_events.0011.desc: "Das Gold von [pam_ch_hof_sponsor.GetTitledFirstName] rief einen rivalisierenden [ROOT.Char.GetFaith.ReligiousHeadName|U] auf den Plan, um die [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] zu spalten.\n\n[pam_ch_hof_sponsor.Custom('DE_PRO_PER_S_3P_N')|U] blickt auf und sagt: „Ihr seid kein [ROOT.Char.GetFaith.ReligiousHeadName]. Ihr seid [Select_CString(ROOT.Char.IsFemale, 'eine Betrügerin', 'ein Betrüger')].“"
 pam_antipope_events.0011.a: "Entzieht die Mittel, die dies begünstigten."
 pam_antipope_events.0011.b: "Richtet [pam_ch_hof_sponsor.Custom('DE_PRO_PER_S_3P_A')] hin. Mein Schweigen hat einen Preis."
 pam_antipope_events.0011.c: "Die Schande, die auf [pam_ch_hof_sponsor.Custom('DE_PRO_POS_S_3P')]em Haus lastet, ist Strafe genug."
 pam_antipope_events.0011.d: "Geißelt [pam_ch_hof_sponsor.Custom('DE_PRO_PER_S_3P_A')] so lange, bis das Fleisch nachgibt."
 pam_romans_1_32_english: "Wer so handelt, verdient den Tod … Trotzdem tun sie es nicht nur selbst, sondern jubeln bereitwillig auch denen zu, die so handeln."
 ROMANS_1_32_GLOSS: "#weak Römer 1:32, EÜ#!"
 pam_antipope_events.0012.t: "Urteil über die Abgesetzten"
 pam_antipope_events.0012.t.christian: "Ein Urteil für Satans Soldaten"
 pam_antipope_events.0012.intro.christian: "Der [ROOT.Char.GetRite.GetName] gehorcht mir. [Select_CString(pam_ch_hof_old_hof.IsFemale, 'Die', 'Der')] falsche [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_old_hof.GetTitledFirstName] kniet zu meinen Füßen."
 pam_antipope_events.0012.intro: "Die [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] gehorchen mir. [pam_ch_hof_old_hof.GetTitledFirstName|U], [Select_CString(pam_ch_hof_old_hof.IsFemale, 'die', 'der')] falsche [ROOT.Char.GetFaith.ReligiousHeadName|U], kniet zu meinen Füßen."
 pam_antipope_events.0012.intro.sponsor: "[Select_CString(pam_ch_hof_new_hof.IsFemale, 'Meine', 'Mein')] [ROOT.Char.GetFaith.ReligiousHeadName|U] [pam_ch_hof_new_hof.GetFirstName] hat den Thron bestiegen. [Select_CString(pam_ch_hof_old_hof.IsFemale, 'Die Thronräuberin', 'Der Thronräuber')] [pam_ch_hof_old_hof.GetTitledFirstName] kniet vor mir."
 pam_antipope_events.0012.dialogue.christian: "\n\nUnbeirrt wie immer spottet [pam_ch_hof_old_hof.Custom('DE_PRO_PER_S_3P_N')]: „Mit dem Schwert habt Ihr den Thron des Friedens erobert.“\n\n„Der Herr hielt es für angebracht, mir die Mittel an die Hand zu geben, die zur Erfüllung Seines Plans erforderlich waren“, antworte ich."
 pam_antipope_events.0012.dialogue: "\n\n[pam_ch_hof_old_hof.Custom('DE_PRO_PER_S_3P_N')|U] sagt: Ihr habt dies mit dem Schwert erobert.“\n\n„Und mit dem Schwert werde ich es auch behalten“, antworte ich."
 pam_antipope_events.0012.a: "Eine Zelle könnte seinen Stolz dämpfen."
 pam_antipope_events.0012.b: "Zwei Köpfe schaffen ein Monstrum. Folglich muss einer weg."
 pam_antipope_events.0012.c: "Es gab genug Streit. Lasst [pam_ch_hof_old_hof.Custom('DE_PRO_PER_S_3P_A')] in Frieden gehen."
 pam_antipope_events.0012.d: "[pam_ch_hof_old_hof.Custom('DE_PRO_PER_S_3P_N')|U] wird den Namen jener Person schreien, die der wahre [ROOT.Char.GetFaith.ReligiousHeadName|U] ist."
 pam_antipope_events.0014.t: "Urteil über mich"
 pam_antipope_events.0014.intro.judge: "„Ich entbinde alle [pam_ch_hof_judge.GetFaith.GetAdherentNamePlural] von der Pflicht, Euch Gehorsam zu leisten“, sagt [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy.christian: "„Geht hin und sündigt nicht mehr“, sagt [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.intro.mercy: "„Geht. Kehrt nicht auf diesen Weg zurück“, sagt [pam_ch_hof_judge.GetTitledFirstName]."
 pam_antipope_events.0014.desc.condemned.christian: "\n\nIch liebte die Gerechtigkeit und hasste die Ungerechtigkeit, und so sterbe ich."
 pam_antipope_events.0014.desc.condemned: "\n\nIch sterbe für das, was ich für wahr hielt."
 pam_antipope_events.0014.desc.broken: "\n\n[pam_ch_hof_judge.Custom('DE_PRO_PER_S_3P_N')|U] und [pam_ch_hof_judge.Custom('DE_PRO_POS_S_3P')]e Männer verspotten mich mit Gelächter und geißeln meinen Körper. Ich bin nichts weiter als eine leere Hülle, aus der man das Korn gedroschen hat."
 pam_antipope_events.0014.desc.captive.christian: "\n\nMan gab mir eine Zelle. Mir wurde immer gesagt, dass eine Zelle für einen Heiligen ausreicht."
 pam_antipope_events.0014.desc.captive: "\n\nMan gab mir eine Zelle. Mehr steht man mir nicht zu."
 pam_antipope_events.0014.desc.spared.christian: "\n\nEs scheint, als würden die Steine in ihren Händen verbleiben und ich sollte als freier Mensch davonkommen. Diese Gnade sollte ich nicht verschwenden."
 pam_antipope_events.0014.desc.spared: "\n\nEs scheint, als würde ich als freier Mensch davonkommen. Diese Gnade sollte ich nicht verschwenden."
 pam_antipope_events.0014.desc.generic: "\n\nDas Urteil ist gefallen. Was nun folgt, liegt in meiner Hand."
 pam_antipope_events.0014.a: "Möge mein Haus als Ort der Treue zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) in Erinnerung bleiben."
 pam_antipope_events.0014.b: "Ihre Hände werden sich nicht sauber waschen lassen."
 pam_antipope_events.0014.b.toast: "Sie sind mit [GetModifier('pam_ch_hof_sacred_bloodguilt_modifier').GetName] befleckt."
 pam_antipope_events.0014.c: "Bewahrt mein Haus vor dieser Schande."
 pam_antipope_events.0014.d: "Ich werde mich mit dem wahren [ROOT.Char.GetFaith.ReligiousHeadName] aussöhnen."
 pam_antipope_events.0014.e: "Was mir [pam_ch_hof_judge.Custom('DE_ART_DEF_S_N')] schurkische [pam_ch_hof_judge.GetTitledFirstNameNoTooltip] beibrachte, werde ich in die Tat umsetzen."
 pam_antipope_events.0014.e.tt: "$prelude_events.0040.c.tt$"
 pam_antipope_events.0014.f: "Solange meine Buße nicht vollbracht ist, werde ich barfuß gehen."
 pam_antipope_events.0015.opening: "An [ROOT.Char.Custom('DE_ART_DEF_S_A')] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l][ROOT.Char.Custom('DE_END_ADJ_IND_S_A')] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_antipope_events.0015.desc.defender_victory.christian: "Wisset, dass die schismatische Herausforderung in Sachen [ROOT.Char.GetFaith.ReligiousHeadName|U] niedergeschlagen wurde. Das Amt des Thronräubers ist vernichtet, und der [ROOT.Char.GetRite.GetName] steht unerschütterlich fest. Kein Fürst und kein Prälat möge daran zweifeln, wem er seine Treue schuldet."
 pam_antipope_events.0015.desc.defender_victory: "Wisset, dass die Herausforderung in Sachen [ROOT.Char.GetFaith.ReligiousHeadName|U] niedergeschlagen wurde. Das Amt des Thronräubers ist vernichtet, und die [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] stehen unerschütterlich fest. Kein Herrscher möge daran zweifeln, wem er seine Treue schuldet."
 pam_antipope_events.0015.desc.attacker_victory.christian: "Wisset, dass der Krieg um den Titel als [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] beendet ist. Ich befreite den Thron vom Joch Satans, und der [ROOT.Char.GetRite.GetName] wird meinen Befehlen folgen."
 pam_antipope_events.0015.desc.attacker_victory: "Wisset, dass der Krieg um den Titel als [ROOT.Char.GetFaith.ReligiousHeadTitleName|U] beendet ist. Ich besteige den Thron, und die [ROOT.Char.GetRite.GetAdherentNamePluralNoTooltip] folgen mir. Teilt den Gläubigen mit, dass ein neuer [ROOT.Char.GetFaith.ReligiousHeadName] regiert."
 pam_antipope_events.0015.a: "So sei es."
