 pam_canonization_approved_petitioner_opinion_saint: "Genehmigte Heiligsprechung eines [dynasty|E]-Mitglieds"
 pam_canonization_approved_petitioner_opinion_va: "Genehmigte Ehrung eines [dynasty|E]-Mitglieds"
