 # Canonization approved
 pam_saint_events.0003.t: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_saint_events.0003.t_saint', 'pam_saint_events.0003.t_va')]"
 pam_saint_events.0003.t_saint: "Ein neuer Heiliger"
 pam_saint_events.0003.t_va: "Ein neuer besonderer Mensch ([GetPlayer.Custom('PamSaintOrAncestorTitleNoun')])"
 pam_saint_events.0003.desc_saint: "Es ist vollbracht. [saint_candidate.GetFirstName|U] zählt zu den Heiligen, die in [consecration_province.GetName] geweiht wurden. Möge [saint_candidate.Custom('DE_PRO_POS_S_3P')] Licht meine Mit-[saint_candidate.GetFaith.GetAdherentNamePluralNoTooltip] noch generationenlang segnen."
 pam_saint_events.0003.desc_va: "Es ist vollbracht. [saint_candidate.GetFirstName] wird als einer der besonderen Menschen ([saint_candidate.Custom('PamBlessedOnesOrAncestors')]) geehrt, die man in [consecration_province.GetName] [saint_candidate.Custom('PamConsecratedEnshrined')|l]. Möge [saint_candidate.Custom('DE_PRO_POS_S_3P')] Licht das Reich generationenlang segnen."
 pam_saint_events.0003.a: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_saint_events.0003.a_saint', 'pam_saint_events.0003.a_va')]"
 pam_saint_events.0003.a_saint: "Deo gratias."
 pam_saint_events.0003.a_va: "Wir danken."
 pam_saint_events.0003.a.dynasty_opinion_tt: "Mitglieder Eurer [dynasty|E], die Euren [Concept('faith', 'Glauben')|E] teilen, gewinnen für die nächsten 20 Jahre #P 20#! [Concept('opinion','Meinung')|E] über Euch hinzu"
 # Canonization denied
 pam_saint_events.0004.t: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_saint_events.0004.t_saint', 'pam_saint_events.0004.t_va')]"
 pam_saint_events.0004.t_saint: "Heiligsprechung abgelehnt"
 pam_saint_events.0004.t_va: "Ehrung abgelehnt"
 pam_saint_events.0004.desc: "Unsere Petition, dass man [saint_candidate.GetFirstName] [GetPlayer.Custom('PamCanonizeVenerateVerb')], wurde von [petition_recipient.GetTitledFirstName] abgelehnt. shall not be counted among [GetPlayer.Custom('PamBlessedOnesOrAncestors')|U] werden weiterhin auf [saint_candidate.GetFirstName] verzichten müssen."
 pam_saint_events.0004.a: "So sei es."
 # Relic extraction begun - awaiting the relic
 pam_saint_events.0005.t: "Das vorbereitete Reliquiar"
 pam_saint_events.0005.desc: "In [extract_site.GetName] machen sich ehrfüchtige Hände an ihre ernste Aufgabe, auf dass eine Sakralreliquie von [relic_saint.GetShortUIName] aus [relic_saint.Custom('DE_PRO_POS_S_3P')]en gesegneten sterblichen Überresten gewonnen werden möge.\n\nDie Vorbereitungen laufen, diese heilige Gelegenheit zu feiern."
 pam_saint_events.0005.a: "Lasst es mit allem gebotenen Respekt geschehen."
 pam_saint_events.0005.a.tt: "Bald wird in [extract_site.GetName] eine [Concept('artifact','Sakralreliquie')|E] von [relic_saint.GetShortUIName] gewonnen werden."
 # The relic is drawn
 pam_saint_events.0006.t: "Eine geheiligte Reliquie"
 pam_saint_events.0006.desc_relic: "Aus den geheiligten sterblichen Überresten von [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')|l] in [extract_site.GetName], gewannen wir eine Sakralreliquie: #EMP [relic_artifact.GetName]#!. Möge sie die Gläubigen meines Reichs generationenlang segnen."
 pam_saint_events.0006.desc: "Aus den geheilgten sterblichen Überresten von [relic_saint.GetFirstName], [GetPlayer.Custom('PamConsecratedEnshrined')|l] in [extract_site.GetName], wurde eine [Concept('artifact','Reliquie')|E] gewonnen, um unser Reich zu segnen."
 pam_saint_events.0006.a: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_saint_events.0006.a_saint', 'pam_saint_events.0006.a_va')]"
 pam_saint_events.0006.a_saint: "Gloria Deo!"
 pam_saint_events.0006.a_va: "Wir danken."
 pam_saint_events.0006.a.tt: "[relic_artifact.GetName|U] wurde gewonnen und befindet sich nun in Eurer Obhut."
 pam_dulia_relic_dynasty_prestige_tt: "Durch den [GetTenetType('tenet_dulia').GetName(GetPlayer.GetRite)]-Grundsatz:"
 # Dulia: the faith-wide reward for a canonization, and the message that carries the news to every other ruler of the faith.
 pam_dulia_canonization_faith_bonus_tt: "Durch den Grundsatz namens [GetTenetType('tenet_dulia').GetName(GetPlayer.GetRite)]: Jeder [ruler|E] Eures [Concept('faith', 'Glaubens')|E] erhält für #EMP 5#! Jahre: $pam_dulia_new_saint_modifier$"
 pam_dulia_new_saint_message_t: "[Select_CString(pam_new_saint.IsFemale, 'Eine neue Fürsprecherin', 'Ein neuer Fürsprecher')]"
 pam_dulia_new_saint_message_desc: "[pam_new_saint.GetTitledFirstName|U] wurde zu den Altären erhoben und die Gläubigen von [pam_new_saint.GetFaith.GetName] gewannen [Select_CString(pam_new_saint.IsFemale, 'eine Fürsprecherin', 'ein Fürsprecher')] vor Gott."
