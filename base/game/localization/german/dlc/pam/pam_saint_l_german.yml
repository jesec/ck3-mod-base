 # Drawn-relic descriptions - one per type so the description always matches the name
 pam_saint_relic_finger_desc: "Ein elegantes Reliquiar verwahrt einen heiligen Finger, den man aus den gesegneten sterblichen Überresten von [relic_creator_saint.GetShortUINameNotMe] gewann."
 pam_saint_relic_tooth_desc: "Ein elegantes Reliquiar verwahrt einen heiligen Zahn, den man aus den gesegneten sterblichen Überresten von [relic_creator_saint.GetShortUINameNotMe] gewann."
 pam_saint_relic_rib_desc: "Ein elegantes Reliquiar verwahrt eine heilige Rippe, die man aus den gesegneten sterblichen Überresten von [relic_creator_saint.GetShortUINameNotMe] gewann."
 pam_saint_relic_hair_desc: "Ein elegantes Reliquiar, das eine Locke des heiligen Haars von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_vestment_desc: "Ein elegantes Reliquiar, das einen Teil eines Gewandes verwahrt, welches [relic_creator_saint.GetShortUINameNotMe] einst trug."
 pam_saint_relic_hand_desc: "Ein elegantes Reliquiar verwahrt die heilige Hand, die man aus den gesegneten sterblichen Überresten von [relic_creator_saint.GetShortUINameNotMe] gewann."
 pam_saint_relic_arm_desc: "Ein elegantes Reliquiar verwahrt den heiligen Arm, den man aus den gesegneten sterblichen Überresten von [relic_creator_saint.GetShortUINameNotMe] gewann."
 pam_saint_relic_skull_desc: "Ein elegantes Reliquiar, das den verehrten Schädel von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_blood_desc: "Ein elegantes Reliquiar, das eine Phiole mit dem heiligen Blut von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_heart_desc: "Ein elegantes Reliquiar, das das heilige Herz von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_effigy_desc: "Ein verehrtes Abbild, das [relic_creator_saint.GetShortUINameNotMe] nachempfunden ist und von den Gläubigen geachtet wird."
 pam_saint_relic_letter_desc: "Ein elegantes Reliquiar, das einen von [relic_creator_saint.GetShortUINameNotMe] verfassten Brief verwahrt."
 pam_saint_relic_drawing_desc: "Ein berühmtes von [relic_creator_saint.GetShortUINameNotMe] gemaltes Bild."
 pam_saint_relic_stationery_desc: "Ein Satz Schreibwaren, der angeblich von [relic_creator_saint.GetShortUINameNotMe] verwendet wurde. Er soll seinem Träger angeblich Weisheit bringen."
 pam_saint_relic_ash_desc: "Ein elegantes Reliquiar, das die heilige Asche von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_canopic_jar_desc: "Eine Urne, die die inneren Organe von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_staff_desc: "Ein Stab, den [relic_creator_saint.GetShortUINameNotMe] bei den eigenen Pilgerreisen verwendete."
 pam_saint_relic_water_filter_desc: "Ein Tuch, das [relic_creator_saint.GetShortUINameNotMe] bei den eigenen Pilgerreisen als Wasserfilter verwendete."
 pam_saint_relic_bowl_desc: "Eine Schale, mit der [relic_creator_saint.GetShortUINameNotMe] um Nahrung bettelte."
 pam_saint_relic_robe_desc: "Ein elegantes Reliquiar, das die heilige Robe von [relic_creator_saint.GetShortUIName] verwahrt."
 pam_saint_relic_sword_desc: "Ein schartiges Schwert, das von [relic_creator_saint.GetShortUINameNotMe] geführt wurde. Es soll Gläubigen, die es tragen, Schutz und Stärke gewähren."
 pam_saint_relic_sarira_desc: "Ein elegantes Reliquiar, das eine Sarira von [relic_creator_saint.GetShortUINameNotMe] verwahrt."
 pam_saint_relic_skull_buddhism_desc: "Ein elegantes Reliquiar, das eine Sarira verwahrt: die Usnisa von [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_finger_buddhism_desc: "Ein elegantes Reliquiar, das eine Sarira verwahrt: einen Finger von [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_tooth_buddhism_desc: "Ein elegantes Reliquiar, das eine Sarira verwahrt: einen Zahn von [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_rib_buddhism_desc: "Ein elegantes Reliquiar, das eine Sarira verwahrt: eine Rippe von [relic_creator_saint.GetShortUINameNotMe]."
 pam_saint_relic_talisman_desc: "Ein von [relic_creator_saint.GetShortUINameNotMe] gezeichneter Talisman. Er soll das Böse bannen und den Träger heilen können."
 pam_saint_relic_pellet_desc: "Eine Flasche mit Unsterblichkeitspillen, die [relic_creator_saint.GetShortUINameNotMe] anmischte."
 pam_saint_relic_footprint_desc: "Ein elegantes Reliquiar, das den Fußabdruck von [relic_creator_saint.GetShortUIName] verwahrt."
 pam_saint_relic_afarganyu_desc: "Eine Afarganyu, die [relic_creator_saint.GetShortUINameNotMe] gehörte."
 pam_saint_relic_ring_desc: "Ein heiliger Ring, der [relic_creator_saint.GetShortUINameNotMe] gehörte."
 pam_saint_relic_bracelet_desc: "Ein heiliges Armband, das [relic_creator_saint.GetShortUINameNotMe] gehörte."
 pam_saint_relic_commentary_desc: "Eine Sammlung von Kommentaren, die [relic_creator_saint.GetShortUINameNotMe] verfasste: Sie enthalten [relic_creator_saint.Custom('DE_PRO_POS_S_3P')]e Deutung einer heiligen Schrift ([relic_creator_saint.GetFaith.ReligiousText])."
 pam_saint_relic_tzitzit_desc: "Eine heilige Faser der Zizit von [relic_creator_saint.GetShortUIName], die [relic_creator_saint.Custom('DE_PRO_POS_S_3P')]e Frömmigkeit zeigt."
 pam_saint_relic_relic_desc: "Ein elegantes Reliquiar, das die Sakralreliquie von [relic_creator_saint.GetShortUIName] verwahrt."
 # Buried-saint point of interest
 poi_buried_saint: "Grabmal eines besonderen Menschen [GetPlayer.Custom('PamVeneratedSaintOrAncestorTitle')]"
 poi_buried_saint.visit: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'poi_buried_saint.visit_saint', 'poi_buried_saint.visit_va')]"
 poi_buried_saint.visit_saint: "Heiligengrab-Besuch"
 poi_buried_saint.visit_va: "Ahnengrab-Besuch"
 poi_buried_saint.visit_desc: "Beim Besuch des Grabmals eines besonderen Menschen ([GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]) werdet Ihr von Hingabe erfüllt."
 poi_buried_saint.preset_visit_desc: "Ihr haltet am Grab von [visited_saint.GetShortUIName] inne und erweist Eure Ehrerbietung."
 poi_buried_saint.foreign_visit: "Besuch einer antiken Grabstätte"
 poi_buried_saint.foreign_visit_desc: "Euer Glaube verehrt [visited_saint.GetShortUIName] nicht, doch an diesem Grab gibt es viel zu lernen."
 pam_poi_buried_saint_on_visit_preset_relic_tt: "Erweist Euren Respekt für etwas [piety_i|E][piety|E], mit der Möglichkeit, eine heilige [Concept('artifact','Reliquie')|E] zu #EMP geringeren#! Kosten zu gewinnen, als es aus der Ferne kosten würde."
 pam_poi_buried_saint_on_visit_relic_tt: "Erweist [visited_saint.GetShortUIName] Euren Respekt mit der Möglichkeit, eine [Concept('artifact','Sakralrelquie')|E] zu #EMP günstigeren#! Bedingungen zu gewinnen, als es aus der Fern kosten würde."
 pam_poi_buried_saint_on_visit_no_relic_tt: "Erweist [visited_saint.GetShortUIName], der hier als [visited_saint.Custom('PamSaintOrAncestorNoun')] ruht, Euren Respekt."
 # Visiting a saint's tomb (player homage)
 pam_saint_events.0007.t: "Am Grabmal von [visited_saint.GetShortUINameNoTooltip]"
 pam_saint_events.0007.desc: "Meine Reisen führen mich an die Ruhestätte von [visited_saint.GetShortUIName], ein [visited_saint.Custom('PamVeneratedSaintOrAncestor')] meines Glaubens. Die Luft hier ist schwanger vor Heiligkeit, und überall im Grabmal knien Gläubige ins stille Gebet vertieft."
 pam_saint_events.0007.a: "Ich werde meinen Respekt erweisen und weiterziehen."
 pam_saint_events.0007.b: "Lasst uns eine Sakralreliquie gewinnen."
 pam_saint_events.0007.b.tt: "Eine [Concept('artifact','Sakralreliquie')|E] wird aus den sterblichen Überresten von [relic_saint.GetShortUIName] gewonnen."
 pam_saint_events.0007.b.toast: "Eine gewonnene Sakralreliquie"
 pam_saint_events.0007.b.toast_desc: "Mit ehrfürchtigen Händen gewinnt man ein Artefakt ([relic_artifact.GetName]) aus den sterblichen Überresten von [visited_saint.GetShortUINameNoTooltip], um mein [realm|E] zu segnen."
