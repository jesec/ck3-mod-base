 # Canonize decision - step 2: choose the consecration site (cathedral / holy-site barony)
 pam_choose_consecration_site_decision: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_choose_consecration_site_decision_saint', 'pam_choose_consecration_site_decision_va')]"
 pam_choose_consecration_site_decision_saint: "Den Heiligen weihen"
 pam_choose_consecration_site_decision_va: "[GetPlayer.Custom('PamSaintOrAncestorTitleNoun')] weihen"
 pam_choose_consecration_site_decision_desc: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_choose_consecration_site_decision_desc_saint', 'pam_choose_consecration_site_decision_desc_va')]"
 pam_choose_consecration_site_decision_desc_saint: "Ich werde die [Concept('ecclesiastical_domicile_building','Kathedrale')|E] in meinem [realm|E] auswählen, wo dieser [Concept('canonized','Heilige')|E] geweiht wird und wo man seine sterblichen Überreste zur Ruhe bettet, auf dass sie die Gläubigen anziehen mögen."
 pam_choose_consecration_site_decision_desc_va: "Ich werde den heiligen Ort in meinem [realm|E] auswählen, wo die sterblichen Überreste dieses besonderen Menschen ([GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]) zur Ruhe gebettet werden, auf dass sie die Gläubigen anziehen mögen."
 pam_choose_consecration_site_decision_desc_holy_site: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_choose_consecration_site_decision_desc_holy_site_saint', 'pam_choose_consecration_site_decision_desc_holy_site_va')]"
 pam_choose_consecration_site_decision_desc_holy_site_saint: "Ich werde die [Concept('holy_site','heilige Stätte')|E] meines [Concept('faith', 'Glaubens')|E] in meinem [realm|E] auswählen, wo dieser [Concept('canonized','Heilige')|E] geweiht wird und wo man seine sterblichen Überreste zur Ruhe bettet, auf dass sie die Gläubigen anziehen mögen."
 pam_choose_consecration_site_decision_desc_holy_site_va: "Ich werde die [Concept('holy_site','heilige Stätte')|E] meines [Concept('faith', 'Glaubens')|E] in meinem [realm|E] auswählen, wo dieser besondere Mensch ([GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]) geweiht wird und wo man seine sterblichen Überreste zur Ruhe bettet, auf dass sie die Gläubigen anziehen mögen."
 pam_choose_consecration_site_decision_tooltip: "Wählt aus, wo der ausgewählte besondere Mensch ([GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]) geweiht werden soll."
 pam_choose_consecration_site_decision_confirm: "Weihen"
 pam_choose_consecration_site_decision_select_tt: "Wählt eine Stätte aus, wo der besondere Mensch ([GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]) geweiht werden soll."
 # Shown on already-occupied sites in the picker (greyed) - one saint rests per site.
 pam_choose_consecration_site_occupied_tt: "[GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]"
 # Extract relic decision
 pam_extract_relic_decision: "Eine Reliquie gewinnen"
 pam_extract_relic_decision_desc: "Dieser Mensch [GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U] ruht [GetPlayer.Custom('PamConsecratedEnshrined')|l] in meinem Reich. Mit allem gebotenen Respekt ließe sich eine Reliquie aus seinen sterblichen Überresten gewinnen, um damit die Gläubigen zu segnen."
 pam_extract_relic_decision_tooltip: "Gewinnt eine Reliquie von einem Menschen ([GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')]), der in Landen bestattet ist, die Ihr kontrolliert."
 pam_extract_relic_decision_confirm: "Die Reliquie gewinnen"
 pam_extract_relic_decision_req_saint: "Ein besonderer Mensch ([GetPlayer.Custom('PamVeneratedSaintOrAncestorGeneric')|U]), von dem Ihr noch eine Reliquie gewinnen könntet, ruht in Eurem [realm|E]"
 pam_extract_relic_decision_req_saint_count: "Bislang [CHARACTER.MakeScope.ScriptValue('pam_saint_relics_extracted_value')] von [CHARACTER.MakeScope.ScriptValue('pam_saint_relic_max')] [Concept('artifact','Reliquien')|E] von [CHARACTER.GetShortUIName] gewonnen"
 pam_extract_relic_decision_extract_tt: "Eine [Concept('artifact','Sakralreliquie')|E] wird aus den sterblichen Überresten eines besonderen Menschen ([GetPlayer.Custom('PamSaintOrAncestorTitleNoun')]) gewonnen"
 pam_extract_relic_decision_choose_tt: "Wählt aus, von welchem beigesetzten besonderen Menschen ([GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]) eine [Concept('artifact','Reliquie')|E] gewonnen werden soll"
 pam_extract_relic_decision_item_valid_tt: "Von diesem besonderen Menschen ([GetPlayer.Custom('PamSaintOrAncestorNounGeneric')]) könnte noch eine [Concept('artifact','Reliquie')|E] gewonnen werden."
 # Canonization petition sent - awaiting the Head of Faith
 pam_saint_events.0001.t: "Die Petition ist auf dem Weg"
 pam_saint_events.0001.desc: "Die Angelegenheit in Sachen [saint_candidate.GetFirstName] wird in die Wege geleitet, und ein Ehrenplatz in [consecration_province.GetName] wartet schon auf seine gesegneten sterblichen Überreste.\n\nNun liegt dies alles nicht mehr in meiner Hand: Eine Petition ist unterwegs zu [petition_recipient.GetTitledFirstName], und ich kann nur beten, dass das Urteil günstig ausfällt."
 pam_saint_events.0001.a: "Dann warten wir und beten."
 pam_saint_events.0001.a.tt_saint: "Eine Petition, [saint_candidate.GetFirstName] als [Concept('canonized','Heiligen')|E] anzuerkennen und in [consecration_province.GetName] zu weihen, wurde an [petition_recipient.GetTitledFirstName] geschickt. Die Antwort wird zu gegebener Zeit eintreffen."
 pam_saint_events.0001.a.tt_va: "Eine Petition, [saint_candidate.GetFirstName] als besonderen Menschen ([saint_candidate.Custom('PamVeneratedSaintOrAncestor')]) zu ehren und in [consecration_province.GetName] [saint_candidate.Custom('PamConsecratedEnshrined')|l] zu werden, wurde an [petition_recipient.GetTitledFirstName] geschickt. Die Antwort wird zu gegebener Zeit eintreffen."
 # Head of Faith approval request
 pam_saint_events.0002.t: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_saint_events.0002.t_saint', 'pam_saint_events.0002.t_va')]"
 pam_saint_events.0002.t_saint: "Eine Petition in Sachen Heiligsprechung"
 pam_saint_events.0002.t_va: "Eine Petition in Sachen Ehrung"
 pam_saint_events.0002.desc_saint: "[canonizer.GetTitledFirstName|U] bittet uns inständig, [saint_candidate.GetFirstName] zu den gesegneten Heiligen zu zählen, die in [consecration_province.GetName] geweiht wurden."
 pam_saint_events.0002.desc_va: "[canonizer.GetTitledFirstName|U] bittet uns inständig, [saint_candidate.GetFirstName] als einen besonderen Menschen ([saint_candidate.Custom('PamBlessedOnesOrAncestors')]) zu erachten, der in [consecration_province.GetName] [saint_candidate.Custom('PamConsecratedEnshrined')|l] wird."
 pam_saint_events.0002.desc.traits_1: "\n\nZu Lebzeiten war [saint_candidate.GetFirstNameNoTooltip] als [pam_saint_ptrait_1.GetNameNoTooltip(saint_candidate.Self)|l]er Mensch bekannt."
 pam_saint_events.0002.desc.traits_2: "\n\nZu Lebzeiten war [saint_candidate.GetFirstNameNoTooltip] als [pam_saint_ptrait_1.GetNameNoTooltip(saint_candidate.Self)|l]er und [pam_saint_ptrait_2.GetNameNoTooltip(saint_candidate.Self)|l]er Mensch bekannt."
 pam_saint_events.0002.desc.traits_3: "\n\nZu Lebzeiten war [saint_candidate.GetFirstNameNoTooltip] als [pam_saint_ptrait_1.GetNameNoTooltip(saint_candidate.Self)|l]er und [pam_saint_ptrait_2.GetNameNoTooltip(saint_candidate.Self)|l]er und [pam_saint_ptrait_3.GetNameNoTooltip(saint_candidate.Self)|l]er Mensch bekannt."
 pam_saint_events.0002.desc.virtue_1: "[SelectLocalization(ObjectsEqual(GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey('christianity_religion').GetName), 'pam_saint_events.0002.desc.virtue_1_saint', 'pam_saint_events.0002.desc.virtue_1_va')]"
 pam_saint_events.0002.desc.virtue_1_saint: "Ein flackerndes Licht geht von dieser Seele aus: eine bescheidene Flamme, doch nicht jeder Heilige wurde in einem großen Feuer geschmiedet.\n\nDas Urteil liegt bei uns."
 pam_saint_events.0002.desc.virtue_1_va: "Ein flackerndes Licht geht von dieser Seele aus: eine bescheidene Flamme, doch nicht jede geehrte Seele wurde in einem großen Feuer geschmiedet.\n\nDas Urteil liegt bei uns."
 pam_saint_events.0002.desc.virtue_2: "Die Errungenschaften dieser Seele, um der höchsten Macht ([saint_candidate.GetFaith.HighGodName]) zu gefallen, sind nicht zu unterschätzen: das Zeichen eines klar erkennbaren, wenn auch unvollkommenenn Zustands der Gnade.\n\nDas Urteil liegt bei uns."
 pam_saint_events.0002.desc.virtue_3: "Die Tugend ist die Verkörperung dieser Seele: Selten kommt es vor, dass jemand Sterbliches das Göttlich so offenkundig in sich trägt.\n\nDas Urteil liegt bei uns."
 pam_saint_events.0002.a: "[saint_candidate.GetFirstName|U] ist wahrlich würdig."
 pam_saint_events.0002.a.dynasty_opinion_tt: "[canonizer.GetFaith.GetAdjective|U]e [Concept('dynasty','Dynastie')|E]-Mitglieder von [canonizer.GetShortUIName] erhalten für 20 Jahre eine um #P 10#! verbesserte [Concept('opinion','Meinung')|E] von Euch"
 pam_saint_events.0002.b: "Wir werden das nicht genehmigen."
 pam_saint_events.0002.b.dynasty_opinion_tt: "[canonizer.GetFaith.GetAdjective|U]e [Concept('dynasty','Dynastie')|E]-Mitglieder von [canonizer.GetShortUIName] erhalten für 20 Jahre eine um #N 10#! verschlechterte [Concept('opinion','Meinung')|E] von Euch"
