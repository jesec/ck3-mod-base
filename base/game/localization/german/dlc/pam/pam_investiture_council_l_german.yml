l_german:
 # Activity: The Investiture Council
 activity_investiture_council: "Das Investiturkonzil"
 activity_investiture_council_desc: "Ein Konzil trat zum Ende der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] zusammen, um ein für alle Mal zu klären, wer den Klerus einsetzen soll: die Kirche oder die Krone."
 activity_investiture_council_province_desc: "Lasst das Konzil hier stattfinden."
 activity_investiture_council_host_desc: "Das Investiturkonzil tritt zusammen, um die Ernennung des Klerus zu regeln."
 activity_investiture_council_guest_desc: "Nehmt am Investiturkonzil teil und gebt Eure Stimme für die Ernennung des Klerus."
 # Travel plan name (engine looks up TRAVEL_NAME_FOR_<activity key>); without it the raw key showed on travellers.
 TRAVEL_NAME_FOR_activity_investiture_council: "Die Reise von [Character.GetFirstNameNoTooltip] zum Investiturkonzil"
 # Reason shown on the guest invite-acceptance for the clergy summoned to the council.
 pam_investiture_council_summons_clergy_value: "Zum Investiturkonzil gerufen"
 pam_investiture_council_start_log_title: "Das Investiturkonzil tritt zusammen"
 pam_investiture_council_start_log: "[CHARACTER.GetTitledFirstName|U] eröffnete das Konzil, um die Frage nach der Ernennung des Klerus zu klären."
 # Conclusion-page log entries; their nested effect renders as the activity's "Effects from ..." section
 pam_investiture_council_concluded_spiritual_log_title: "Die Kirche obsiegt"
 pam_investiture_council_concluded_spiritual_log: "[CHARACTER.GetTitledFirstName|U] verkündete das Urteil des Konzils: Der Klerus wird von der Kirche allein eingesetzt und keine Krone kann ihn absetzen."
 pam_investiture_council_concluded_temporal_log_title: "Die Krone obsiegt"
 pam_investiture_council_concluded_temporal_log: "[CHARACTER.GetTitledFirstName|U] verkündete das Urteil des Konzils: Die Kirche setzt den Klerus ein, doch ein weltlicher Fürst kann Prälaten entmachten, die ihn enttäuschen."
 pam_investiture_council_conclusion.intro: "Das Investiturkonzil ist zu einem Urteil gelangt."
 pam_investiture_council_conclusion.spiritual: "Die versammelten Väter wahrten das alleinige Recht der Kirche, den Klerus einzusetzen, und entzogen es so dem Griff aller Kronen: Nach der Weihe wird ein Prälat sein Amt auf Lebenszeit halten.\n\nDie lange Phase namens [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet: Die Kirche geht als Siegerin hervor und wendet sich sogleich ihrer inneren Reform zu."
 pam_investiture_council_conclusion.temporal: "Die versammelten Väter ließen die Ernennung des Klerus der Kirche, doch wahren den weltlichen Fürsten das Recht, Prälaten zu entmachten, die sie enttäuschen. Die lange Phase namens [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet, doch die Autorität der Kirche wurde geschmälert und ihre Einheit bleibt zerbrechlich."
 # Activity window character labels (one key per window_characters slot)
 activity_window_character_prelate_guest_arrived: "Prälat\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_secular_guest_arrived: "[activity_guest_short|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_church_rep: "Wahrer\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_conclusion_crown_rep: "Innovator\n[Character.GetShortUINameNoTooltip|U]"
 # The ruling as a single line under the conclusion page's "Effects from ..." readout
 pam_investiture_resolution_spiritual_tt: "Ersetzte die [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l]e kirchliche Ernennungs-[doctrine|E] durch: [GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName]"
 pam_investiture_resolution_temporal_tt: "Ersetzte die [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l]e kirchliche Ernennungs-[doctrine|E] durch: [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName]"
 # Activity phase names + descriptions
 investiture_council_phase_summons: "Ruf"
 investiture_council_phase_summons_desc: "Die Gläubigen versammeln sich, als sich die Kunde von der bevorstehenden Auseinandersetzung um die Ernennung des Klerus verbreitet."
 investiture_council_phase_debate: "Die Debatte"
 investiture_council_phase_debate_desc: "Das Konzil debattiert, wer den Klerus einsetzen soll, die Kirche oder die Krone, und lässt darüber abstimmen."
 # Arrival flavour (guest) - the host welcomes me
 pam_investiture_council_events.0001.t: "Ankunft"
 pam_investiture_council_events.0001.desc: "[arrival_host.GetTitledFirstName|U] empfängt mich herzlich an der Türschwelle, als ich ankomme, und die Halle hinter [arrival_host.Custom('DE_PRO_PER_S_3P_D')] wimmelt bereits von Prälaten und Glaubensfürsten. Bald schon wird der Versammlung die große Frage nach der Ernennung des Klerus gestellt werden."
 pam_investiture_council_events.0001.a: "Ich fühle mich geehrt, unter ihnen zu sein."
 pam_investiture_council_events.0001.a.tt: "Die Debatte beginnt, sobald der Rest der Gäste angekommen ist."
 # The council convenes (host)
 pam_investiture_council_events.0002.t: "Eine Abrechnung für die Kirche"
 pam_investiture_council_events.0002.desc: "Die Zeit der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ging zu Ende. Nun müssen die versammelten Gläubigen entscheiden, wie der Klerus künftig ernannt werden soll, und ich gedenke, dafür zu sorgen, dass die Autorität der Kirche gewahrt bleibt."
 pam_investiture_council_events.0002.a: "So soll es sein."
 # Pre-debate flavour (guest)
 pam_investiture_council_events.0003.t: "Die Debatte beginnt"
 pam_investiture_council_events.0003.desc: "Die Versammlung verstummt, als sich das Konzil der Frage zuwendet, in der sich Kirch und Krone gegenüberstehen: Wer soll den Klerus einsetzen? Jede hier anwesende Stimme wird bei der Entscheidung helfen."
 pam_investiture_council_events.0003.a: "Es ist an der Zeit."
 # Post-choice persuasion (clergy voter): a single duel to sway the assembly
 pam_investiture_council_events.0032.t: "Ein Wort in das richtige Ohr"
 pam_investiture_council_events.0032.desc: "Die Abstimmung ist noch nicht endgültig gelaufen. Ein überzeugendes Wort im rechten Ohr könnte die Zauderer auf der anderen Seite dazu bringen, sich mir anzuschließen. Allerdings dürfte ein tollpatschiger Versuch teuer werden."
 pam_investiture_council_events.0032.a: "Versucht, die Versammlung auf meine Seite zu ziehen."
 pam_investiture_council_events.0032.b: "Lasst es sein."
 # Post-choice persuasion (secular attendee): back either side by bribe or conviction
 pam_investiture_council_events.0033.t: "Die Last einer Krone"
 pam_investiture_council_events.0033.desc: "Ich habe keine Stimme in dieser Versammlung von Kirchenmännern, und dennoch ist ein weltlicher Herrscher nicht ohne Mittel. Eine gut gefüllte Geldbörse erleichtert das Gewissen, und ein gutes Argument kann die Unentschiedenen bewegen. Ich könnte mich entweder hinter den Anspruch der Krone oder den der Kirche stellen – oder schlicht meinen Frieden wahren."
 pam_investiture_council_events.0033.a: "Lasst uns versuchen, durch Bestechung für die Kirche zu stimmen."
 pam_investiture_council_events.0033.b: "Lasst uns versuchen, durch Überzeugung für die Kirche zu stimmen."
 pam_investiture_council_events.0033.c: "Ich werde versuchen, durch Bestechung für die weltliche Seite zu stimmen."
 pam_investiture_council_events.0033.d: "Ich werde versuchen, durch Überzeugung für die weltliche Seite zu stimmen."
 pam_investiture_council_events.0033.e: "Halten wir uns da heraus."
 # Persuasion feedback toast: simple header, outcome in the tooltip (numbers coloured)
 pam_investiture_persuade_toast_title: "Der Versammlung antwortet"
 pam_investiture_persuade_toast_swayed_tt: "Ihr überzeugtet #P [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! Wähler."
 pam_investiture_persuade_toast_backfired_tt: "Euer Fehltritt trieb #N [investiture_persuader.MakeScope.Var('investiture_swayed_count').GetValue|0]#! Wähler in die andere Richtung."
 # Secular sway per-side availability (grays the option when there is no one left to win to that side)
 pam_investiture_persuade_target_spiritual_tt: "Es gibt Wähler, die noch nicht aufseiten der Kirche sind, aber gewonnen werden können"
 pam_investiture_persuade_target_temporal_tt: "Es gibt Wähler, die noch nicht aufseiten der Krone sind, aber gewonnen werden können"
 # Persuasion duel outcome tooltips (shared by 0032 clergy / 0033 secular). Side-specific (the key names the
 # destination camp) so both perspectives read naturally; only numbers coloured; counts must match the duel tiers.
 pam_investiture_persuade_tt_great_innovator: "Stimmt bis zu #P 10#! Wähler im Sinne der Kirche um."
 pam_investiture_persuade_tt_great_conservative: "Stimmt bis zu #P 10#! Wähler im Sinne der Krone um."
 pam_investiture_persuade_tt_good_innovator: "Stimmt bis zu #P 5#! Wähler im Sinne der Kirche um."
 pam_investiture_persuade_tt_good_conservative: "Stimmt bis zu #P 5#! Wähler im Sinne der Krone um."
 pam_investiture_persuade_tt_modest_innovator: "Stimmt bis zu #P 3#! Wähler im Sinne der Kirche um."
 pam_investiture_persuade_tt_modest_conservative: "Stimmt bis zu #P 3#! Wähler im Sinne der Krone um."
 pam_investiture_persuade_tt_backfire_innovator: "Ein Fehltritt treibt #N 5#! Wähler auf die Seite der Kirche."
 pam_investiture_persuade_tt_backfire_conservative: "Ein Fehltritt treibt #N 5#! Wähler auf die Seite der Krone."
 # Player interrupt: busy/travelling when the council convenes
 pam_investiture_council_events.0004.t: "Das Konzil ruft Euch"
 pam_investiture_council_events.0004.desc: "Mich erreicht die Kunde, dass das Investiturkonzil zusammenkommt, um in der Angelegenheit der Ernennung des Klerus eine Lösung zu finden. Allerdings bin ich noch sehr weit von jenem Ort entfernt, an dem ich mich nun eigentlich aufhalten sollte. Ich könnte alles stehen und liegen lassen und mein Reittier ordentlich anspornen, um meine Stimme abzugeben, oder ich lasse in der Angelegenheit ohne mich eine Lösung finden."
 pam_investiture_council_events.0004.a: "Lasst alles stehen und liegen und reitet zum Konzil."
 pam_investiture_council_events.0004.b: "Lasst sie ohne mich zu einer Entscheidung kommen."
 pam_investiture_council_haste_modifier: "In Eile zum Konzil"
 pam_investiture_council_haste_modifier_desc: "Dieser [ruler|E] ließ alles stehen und liegen, um zum Investiturkonzil zu gelangen, bevor es sein Urteil zur Ernennung des [clergy|E] fällt."
 # The debate opens (host)
 pam_investiture_council_events.0010.t: "Das Recht der Kirche"
 pam_investiture_council_events.0010.desc: "Ich lege die Angelegenheit vor dem Konzil dar: Das Recht, den Klerus einzusetzen, gehört der Kirche – und keine Krone kann entschaffen, was sie weihte. Lasst die Versammlung sprechen und ihre Stimmen entscheiden."
 pam_investiture_council_events.0010.a: "Setzen wir uns für die Kirchenautorität ein."
 # The debate: guest picks a side
 pam_investiture_council_events.0031.t: "Wo steht Ihr?"
 pam_investiture_council_events.0031.desc: "Das Glaubensoberhaupt verlangt, dass das Recht, den Klerus einzusetzen, alleinig der Kirche zusteht und vor jeder Macht der Krone bewahrt wird. Die weltlichen Fürsten werden das Recht behalten, Prälaten abzusetzen, die sie enttäuschen. Das Konzil erwartet Eure Stimme."
 pam_investiture_council_events.0031.a: "Unterstützt die Kirche: Ernennung durch die Kirche, widerrufbar und auf Lebenszeit."
 pam_investiture_council_events.0031.b: "Verteidigt die Kronen: Ernennung durch die Kirche, aber widerrufbar durch Fürsten."
 # Letter from the host to a non-attending player Head of Faith with the decided outcome
 pam_investiture_council_events.0060.opening: "Hochheiligster Vater,"
 pam_investiture_council_events.0060.desc.spiritual: "Das Konzil ist beendet, und da Ihr nicht unter uns wart, hielt ich das Ergebnis sogleich auf Pergament fest. Die versammelten Väter bestätigten das alleinige Recht der Kirche, den Klerus einzusetzen, sodass es der Macht jeder Krone entzogen wird, denn jene, die geweiht wurden, halten ihr Amt auf Lebenszeit. Die [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet."
 pam_investiture_council_events.0060.desc.temporal: "Das Konzil ist beendet, und da Ihr nicht unter uns wart, hielt ich das Ergebnis sogleich auf Pergament fest. Es schmerzt mich, Euch zu schreiben, dass die versammelten Väter das Recht der Ernennung des Klerus zwar in unseren Händen ließen, doch sie gewährten den weltlichen Fürsten die Freiheit, Prälaten abzusetzen, die sie enttäuschen. Der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet."
 pam_investiture_council_events.0060.a: "Lest den Erlass."
 # Letter from the court chaplain to a non-attending secular player relaying the council's outcome
 pam_investiture_council_events.0061.opening: "Mein Fürst,"
 pam_investiture_council_events.0061.desc.spiritual: "Eure Kapelle erreicht die Kunde vom großen Konzil. Die versammelten Väter bestätigten das alleinige Recht der Kirche, den Klerus einzusetzen, und jene, die sie einsetzt, können nicht mehr durch Eure Macht entthront werden. Der lange [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet, und der Bischofsstab bewahrt, was die Krone begehrte."
 pam_investiture_council_events.0061.desc.temporal: "Eure Kapelle erreicht die Kunde vom großen Konzil. Die versammelten Väter ließen die Ernennung des Klerus der Kirche, soch wenn Euch ein Prälat enttäuscht, könnt Ihr ihn seines Amts entheben. Der lange [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet, und die Krone gewann die Oberhand über den Bischofsstab."
 pam_investiture_council_events.0061.a: "So ist es entschieden."
 # Informs a player Head of Faith that an archbishop will host in their stead
 pam_investiture_council_events.0050.t: "Ein Konzil tritt zusammen"
 pam_investiture_council_events.0050.desc.named: "Der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] geht zu Ende, und ein Konzil wird über die Ernennung des Klerus entscheiden.\n\n[investiture_nominee_host.GetTitledFirstName|U] wird es ausrichten. Als Glaubensoberhaupt wird erwartet, dass Ihr teilnehmt und Eure Meinung zu der Entscheidung kundtut, obschon Ihr natürlich auch über das Ergebnis in Kenntnis gesetzt werdet, solltet Ihr nicht teilnehmen."
 pam_investiture_council_events.0050.desc: "Der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] geht zu Ende, und ein Konzil muss über die Frage der Ernennung des Klerus entscheiden. Da Ihr es nicht selbst ausrichtet, wird ein erfahrener Erzbischof des Glaubens diese Aufgabe an Eurer Statt übernehmen. Dennoch mögt Ihr natürlich teilnehmen und Eure Meinung kundtun."
 pam_investiture_council_events.0050.a: "Wohlan denn."
 # Deterministic backstop: the crisis lapses in the Church's favour if no council convenes
 pam_investiture_crisis_lapsed_toast: "Der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetNameNoTooltip] endet"
 pam_investiture_crisis_lapsed_tt: "Da kein Konzil zusammentrat, endete der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] im Sinne der Kirche: Von nun an wird der Klerus durch die Kirche ernannt und hält sein Amt auf Lebenszeit."
