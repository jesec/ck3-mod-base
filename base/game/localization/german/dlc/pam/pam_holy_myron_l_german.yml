l_german:
 ### Holy Myron - artifact
 pam_holy_myron_artifact_name: "Ampulle mit heiligem Myron"
 pam_holy_myron_artifact_desc_common: "Ein verschlossenes Gefäß mit geweihtem Chrisam: [Glossary('Balsamum Judaicum','pam_myron_gloss_balsam')] getränkt in reinem Olivenöl – mit einem Tropfen der vorherigen Menge versehen, sodass die Segenskette ununterbrochen bis zu den Aposteln zurückgeht."
 pam_holy_myron_artifact_desc_masterwork: "Ein verschlossenes Gefäß mit geweihtem Chrisam: [Glossary('Balsamum Judaicum','pam_myron_gloss_balsam')], [Glossary('Weihrauch','pam_myron_gloss_frankincense')] und [Glossary('Myrrhe','pam_myron_gloss_myrrh')] getränkt in reinem Olivenöl – mit einem Tropfen der vorherigen Menge versehen, sodass die Segenskette ununterbrochen bis zu den Aposteln zurückgeht."
 pam_holy_myron_artifact_desc_famed: "Ein verschlossenes Gefäß mit geweihtem Chrisam: [Glossary('Balsamum Judaicum','pam_myron_gloss_balsam')], [Glossary('Weihrauch','pam_myron_gloss_frankincense')], [Glossary('Myrrhe','pam_myron_gloss_myrrh')], [Glossary('Speik','pam_myron_gloss_spikenard')] und [Glossary('Zimt','pam_myron_gloss_cinnamon')] getränkt in reinem Olivenöl – mit einem Tropfen der vorherigen Menge versehen, sodass die Segenskette ununterbrochen bis zu den Aposteln zurückgeht."
 pam_holy_myron_artifact_desc_illustrious: "Ein verschlossenes Gefäß mit geweihtem Chrisam, getreu den ältesten Rezepten zu einer vollkommenen Mischung vereint: [Glossary('Balsam Judaicum','pam_myron_gloss_balsam')], [Glossary('Weihrauch','pam_myron_gloss_frankincense')], [Glossary('Myrrhe','pam_myron_gloss_myrrh')], [Glossary('Speik','pam_myron_gloss_spikenard')], [Glossary('Zimt','pam_myron_gloss_cinnamon')], [Glossary('Kalmus','pam_myron_gloss_calamus')] und [Glossary('Kassie','pam_myron_gloss_cassia')] getränkt in reinem Olivenöl – mit einem Tropfen der vorherigen Menge versehen, sodass die Segenskette ununterbrochen bis zu den Aposteln zurückgeht."
 pam_holy_myron_charges_line: "Verbleibende Salbungen: #V [pam_myron_vessel.MakeScope.Var('pam_holy_myron_charges').GetValue|V0]#!"
 pam_holy_myron_artifact_desc_charged_common: "$pam_holy_myron_artifact_desc_common$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_masterwork: "$pam_holy_myron_artifact_desc_masterwork$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_famed: "$pam_holy_myron_artifact_desc_famed$\n\n$pam_holy_myron_charges_line$"
 pam_holy_myron_artifact_desc_charged_illustrious: "$pam_holy_myron_artifact_desc_illustrious$\n\n$pam_holy_myron_charges_line$"
 ### Ingredient glosses
 pam_myron_gloss_balsam: "Der berühmte Balsam aus Judäa: ein duftendes Harz, das ein niedrig wachsender Strauch hervorweint, der in Jericho und En-Gedi am Toten Meer angebaut wird und Tropfen für Tropfen das teuerste Parfum der antiken Welt ist. Er ist das Herz des Salböls und seine eifersüchtig bewachten Haine wachsen nirgendwo sonst."
 pam_myron_gloss_frankincense: "Ein goldenes Harz, das knorrigen Bäumen des südlichen Arabiens entnommen wird und kaum irgendwo sonst auf der Welt. Seit Menschengedenken wird es auf den Altären verbrannt. Es versüßt das Salböl, während sein Rauch die Gebete gen Himmel trägt."
 pam_myron_gloss_myrrh: "Ein bitteres Harz, dunkel wie Blut, das aus dornigen Bäumen des südlichen Arabiens und am Horn von Afrika austritt. Im Buch Exodus wird es als Bestandteil des heiligen Salböls genannt. Es wurde dem Christuskind von den Heiligen Drei Königen gebracht und von den Gläubigen an Sein Grab."
 pam_myron_gloss_spikenard: "Ein schweres, süßes Öl, das aus den Wurzeln einer Pflanze gepresst wird, die nur in den östlichen Hochgebirgen wächst und zu den Häfen in Indien hinuntergetragen wird. Mit solch einem Nardenöl wurde der Herr in Bethanien gesalbt, zu einem Preis, der die Jünger bestürzte."
 pam_myron_gloss_cinnamon: "Die süße innere Baumrinde aus Indien und den dahinterliegenden Inseln, die im Buch Exodus als Bestandteil des heiligen Salböls genannt wird. Sie durchquert die halbe Welt, ehe sie einen christlichen Altar erreicht."
 pam_myron_gloss_calamus: "Das süße Rohr der Heiligen Schrift: ein aromatisches Schilfrohr, das in den östlichen Marschen gesammelt und im Buch Exodus als Bestandteil des heiligen Salböls genannt wird."
 pam_myron_gloss_cassia: "Ein gröberer Vetter des Zimts, der von Bäumen im fernen Osten geschält und im Buch Exodus als Bestandteil des heiligen Salböls genannt wird."
 ### Modifiers
 pam_holy_myron_vessel_modifier: "Gefäß des heiligen Myron"
 pam_holy_myron_vessel_modifier_desc: "In diesem Gefäß ist gesegnetes Chrisam, und der Duft von [Glossary('Balsamum Judaicum','pam_myron_gloss_balsam')] heiligt seinen Bewahrer."
 pam_holy_myron_vessel_potent_modifier: "Gefäß des mächtigen heiligen Myron"
 pam_holy_myron_vessel_potent_modifier_desc: "In diesem Gefäß ist Chrisam von seltener Stärke, voller [Glossary('Weihrauch','pam_myron_gloss_frankincense')] und [Glossary('Speik','pam_myron_gloss_spikenard')]; allein sein Duft zeugt von Heiligkeit."
 pam_chrismated_artifact_modifier: "Mit Chrisam gesalbt"
 pam_chrismated_artifact_modifier_desc: "Dieses Artefakt wurde mit dem heiligen Myron gesalbt, und der Duft von [Glossary('Myrrhe','pam_myron_gloss_myrrh')] haftet noch immer an ihm."
 pam_chrismated_regalia_modifier: "Mit Chrisam gesalbte Insignien"
 pam_chrismated_regalia_modifier_desc: "Dieses Artefakt wurde während der Krönung mit dem heiligen Myron berührt und der Segen ist geblieben."
 pam_holy_myron_pilgrim_modifier: "Träger des Balsams"
 pam_holy_myron_pilgrim_modifier_desc: "Dieser Charakter reist auf der Suche nach den Zutaten des heiligen Myron – [Glossary('Balsam','pam_myron_gloss_balsam')], [Glossary('Weihrauch','pam_myron_gloss_frankincense')] und seltenere Dinge – durch die Welt und überlässt auf der Reise nichts dem Zufall."
 pam_chrismated_child_modifier: "Mit Chrisam gesalbt"
 pam_chrismated_child_modifier_desc: "Dieser Charakter wurde schon bald nach der Geburt gesalbt, mit dem Geschenk des Heiligen Geists in gesegnetem Öl."
 pam_myron_chrismated_child_modifier: "Gesalbt mit dem heiligen Myron"
 pam_myron_chrismated_child_modifier_desc: "Dieser Charakter wurde unmittelbar nach seiner Geburt mit dem heiligen Myron gesalbt – mit [Glossary('Balsamicum Judaicum','pam_myron_gloss_balsam')] auf der Braue des Neugeborenen und damit mit einem Salbungsöl, das niemals schwindet."
 pam_anointed_with_holy_oil_modifier: "Mit heiligem Öl gesalbt"
 pam_anointed_with_holy_oil_modifier_desc: "Dieser Charakter erhielt die Salbung der Kranken: [Glossary('Balsam','pam_myron_gloss_balsam')]-Süßöl auf Braue und Hände, um Leib und Seele während der Prüfung zu stärken."
 ### Prepare the Holy Myron decision
 pam_prepare_holy_myron_decision: "Das heilige Myron vorbereiten"
 pam_prepare_holy_myron_decision_tooltip: "Entsendet Euren [court_chaplain|E], um seltene Balsame zusammenzutragen und eine #V Ampulle des heiligen Myron#! zu weihen, ein [artifact|E], das nur für heilige Salbungen verwendet wird"
 pam_prepare_holy_myron_decision_desc: "Das heilige Chrisam wird aus Zutaten gemischt, die Küchen erübrigen können. Die Heilige Schrift listet seine Bestandteile auf – [Glossary('Myrrhe','pam_myron_gloss_myrrh')], süßer [Glossary('Zimt','pam_myron_gloss_cinnamon')], [Glossary('Kalmus','pam_myron_gloss_calamus')] und [Glossary('Kassie','pam_myron_gloss_cassia')] in reinem Olivenöl –, und jedes davon muss in den Landen gesammelt werden, in denen es wächst.\n\nJe weiter die Expedition führt, desto reicher die Mischung, die zur Weihe nach Hause gelangt. Doch der Weg ist lang und selten freundlich: Räuber und Fieberkrankheiten können die Menge verringern oder dem Träger schaden."
 pam_prepare_holy_myron_decision_confirm: "Entsendet die Expedition"
 pam_prepare_holy_myron_decision_needs_chaplain: "Euer [court_chaplain|E] muss ein verfügbarer Erwachsener sein, der nicht bereits auf Reisen ist"
 pam_prepare_holy_myron_decision_already_owned: "Ihr dürft nichts bereits eine Ampulle mit heiligem Myron besitzen"
 pam_prepare_holy_myron_decision_journey_underway: "Euer [court_chaplain|E] trägt bereits die Balsame zusammen"
 pam_prepare_holy_myron_decision_levant_name: "Balsamum Judaicum"
 pam_prepare_holy_myron_decision_levant_desc: "Euer [court_chaplain|E] trägt [Glossary('Balsamum Judaicum','pam_myron_gloss_balsam')] in #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! zusammen – ein einziges Ziel und die schlichteste Mischung.\n\nErgibt eine [common|El]e Ampulle des heiligen Myron."
 pam_prepare_holy_myron_decision_arabia_name: "Balsam und Weihrauch"
 pam_prepare_holy_myron_decision_arabia_desc: "Euer [court_chaplain|E] sammelt [Glossary('Balsam','pam_myron_gloss_balsam')] in #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, danach [Glossary('Weihrauch','pam_myron_gloss_frankincense')] und [Glossary('Myrrhe','pam_myron_gloss_myrrh')] in #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! – zwei Ziele entlang der Weihrauchstraße.\n\nErgibt eine [masterwork|El]e Ampulle mit heiligem Myron."
 pam_prepare_holy_myron_decision_india_name: "Jede heilige Zutat"
 pam_prepare_holy_myron_decision_india_desc: "Euer [court_chaplain|E] sammelt [Glossary('Balsam','pam_myron_gloss_balsam')] in #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, [Glossary('Weihrauch','pam_myron_gloss_frankincense')] und [Glossary('Myrrhe','pam_myron_gloss_myrrh')] in #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! und [Glossary('Speik','pam_myron_gloss_spikenard')] und [Glossary('Zimt','pam_myron_gloss_cinnamon')] in #V [GetTitleByKey('c_kerala').GetNameNoTier]#!: eine lange Reise.\n\nErgibt eine [famed|El]e Ampulle mit heiligem Myron. Wenn sich Euer [court_chaplain|E] ganz genau an die alten Rezepte hält – mit einer Wahrscheinlichkeit von #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0] %#!, die mit [ROOT.Char.GetCouncillor('councillor_court_chaplain').Custom('DE_PRO_POS_S_3P')]er [learning|E] wächst –, ist die Menge stattdessen [illustrious|El]."
 pam_myron_levant_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_arabia_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_myron_india_journey_tooltip: "$DESC$\n\n$CLICK_TO_SELECT$"
 pam_prepare_holy_myron_decision_afford_arabia_tt: "Ihr müsst Euch [gold_i][GetPlayer.MakeScope.ScriptValue('major_gold_value')|0V] [gold|E] leisten können"
 pam_prepare_holy_myron_decision_afford_india_tt: "Ihr müsst Euch [gold_i][GetPlayer.MakeScope.ScriptValue('pam_holy_myron_india_journey_gold_value')|0V] [gold|E] leisten können"
 pam_prepare_holy_myron_journey_toast: "Die Expedition für das heilige Myron zieht los"
 pam_prepare_holy_myron_journey_toast_tt: "Euer [court_chaplain|E] zieht los, um die Zutaten für das heilige Myron zusammenzutragen"
 pam_prepare_holy_myron_decision_levant_effect_tt: "Euer [court_chaplain|E] zieht los nach #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!. Bei seiner [court_chaplain|E] wird eine [common|El]e Ampulle mit heiligem Myron geweiht werden – wenn sich die Straße ihm freundlich gesonnen zeigt"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Euer [court_chaplain|E] zieht los nach #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#! und #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. Bei der Rückkehr wird eine [masterwork|El]e Ampulle mit heiligem Myron geweiht werden – Räuber oder Unglücksschläge auf der Reise können die Menge verringern"
 pam_prepare_holy_myron_decision_india_effect_tt: "Euer [court_chaplain|E] zieht los nach #V [GetTitleByKey('c_jerusalem').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! und #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Bei der Rückkehr wird eine [famed|El]e Ampulle mit heiligem Myron geweiht werden, mit einer Wahrscheinlichkeit von #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0] %#!, dass es stattdessen eine [Concept('illustrious', 'illustere')|E] wird – Räuber oder Unglücksschläge auf der Reise können die Menge verringern"
 ### Journey events
 pam_holy_myron.0011.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0011.desc_levant: "Ich schreibe von den Küsten jenes salzigen Meeres, wo der [Glossary('Balsamum Judaicum','pam_myron_gloss_balsam')] aus angeschnittenen Rinden rinnt wie goldene Tränen. Die Bauern verhandelten hart, doch das Öl ist rein – ein einziger Tropfen auf dem Handgelenk parfümiert den ganzen Raum. Die erste der Zutaten ist gesichert."
 pam_holy_myron.0011.desc_arabia: "Die Weihrauchstraße war lang und die Brunnen lagen weit auseinander, doch Dhofar brachte uns, wofür wir kamen: [Glossary('Weihrauch','pam_myron_gloss_frankincense')], blass wie der morgendliche Reif, und [Glossary('Myrrhe','pam_myron_gloss_myrrh')], dunkel wie altes Blut. Die Karawanenführer sagen, es sei kein reineres Öl an irgendeinem Hafen der Welt zu finden. Ich glaubte ihnen und zahlte den geforderten Preis."
 pam_holy_myron.0011.desc_india: "Das Meer zu überqueren, war eine Prüfung für jede Seele an Bord, doch die Märkte der Malabarküste bergen Wunder: [Glossary('Speik','pam_myron_gloss_spikenard')] aus den Hochgebirgen und [Glossary('Zimt','pam_myron_gloss_cinnamon')], der süßer ist, als ich ihn jemals kennenlernte. Die letzte Zutat ist in unseren Händen. Wir kehren nach Hause zurück."
 pam_holy_myron.0011.a: "Möge das Ende der Reise zügig sein."
 pam_holy_myron.0012.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U], das Unglück schlug zu:"
 pam_holy_myron.0012.desc: "Bewaffnete Männer versperrten die Straße vor uns. Sie nannten sich Zollwächter, obgleich keine Krone ihnen je das Recht dazu gewährte. Sie zählten unsere Truhen und kennen nun ihren Wert. Zahlen wir ihnen nicht eine Summe, so werden sie uns nicht ungeplündert ziehen lassen.\n\nIch warte auf Kunde von Euch und behalte die Balsame dicht bei mir."
 pam_holy_myron.0012.a: "Bezahlt sie. Das Chrisam ist mehr wert als Gold."
 pam_holy_myron.0012.b: "Das Gold der Kirche ist nicht für Briganten."
 pam_holy_myron.0012.b.tt: "Die gesammelten Balsame werden geplündert und die letzte Menge an heiligem Myron wird von #N geringerer Güte#!sein"
 pam_holy_myron.0013.opening: "[ROOT.Char.Custom2('FormOfAddressForLiege', myron_chaplain)|U],"
 pam_holy_myron.0013.desc: "Ein Fieber packte mich auf der Reise. Meine Hände zittern, während ich dies schreibe, und die Gattin des Herbergswirts schwört auf drei verschiedene Heilmittel, eines schlimmer als das andere. Sorgt Euch nicht um die Balsame: Sie sind trocken und versiegelt verwahrt und besser geschützt, als ich es bin. Sobald ich wieder stehen kann, ziehen wir weiter."
 pam_holy_myron.0013.a: "Ich werde für [myron_chaplain.Custom('DE_PRO_PER_S_3P_A')] beten."
 pam_holy_myron_journey_abandoned_toast: "Die Expedition für das heilige Myron wird aufgegeben"
 pam_holy_myron.0020.t: "Die Reise endet"
 pam_holy_myron.0020.desc: "Der Brief eines Kaufmanns bringt neue Kunde: [myron_chaplain.GetTitledFirstName|U], [myron_chaplain.Custom('DE_ART_DEF_S_A')] ich schickte, um die Zutaten des heiligen Myron zusammenzutragen, starb fern der Heimat. Die Balsame sind unter den Fremden verteilt, und kein Chrisam wird aus meinem Gold oder [myron_chaplain.Custom('DE_PRO_POS_S_3P')]en Mühen entstehen."
 pam_holy_myron.0020.a: "Möge die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) [myron_chaplain.Custom('DE_PRO_PER_S_3P_D')] ewige Ruhe schenken."
 pam_holy_myron.0100.t: "Die Weihe des Myron"
 pam_holy_myron.0100.desc.intro: "[myron_chaplain.GetTitledFirstName|U], von der Reise erschöpft, kehrt endlich zu mir zurück, und mein Hof riecht die Fracht, noch ehe er sie sieht. Hinter verschlossenen Türen wird das Öl gemischt und ein Tropfen des alten Myron in das neue hineingegeben, so wie es seit den Aposteln geschieht.\n\n"
 pam_holy_myron.0100.desc_full: "Jede einzelne Zutat überstand die Reise. Goldglänzend und duftend wird das fertige Chrisam in die Ampulle gegeben und auf meinen Altar gelegt."
 pam_holy_myron.0100.desc_robbed: "Vieles ging auf der Reise verloren und die Mischung ist nun dünner, als ich es gehofft hatte – doch die Weihe macht wieder heil, was die Reise forderte, und die Ampulle wird dennoch auf meinen Altar gelegt."
 pam_holy_myron.0100.a: "Die Segenskette bleibt ungebrochen."
 ### Funeral: anoint the deceased
 pam_holy_myron.0200.t: "Eine letzte Ölung"
 pam_holy_myron.0200.desc: "Die Trauernden weichen zur Seite, als ich mich der Totenbahre nähere und das Öl ([pam_holy_myron_artifact.GetName]) vor mir hergetragen wird. Unter den Blicken des versammelten Hofs wird mit dem heiligen Chrisam ein Kreuz auf die Braue von [deceased.GetTitledFirstName] gezeichnet, damit [deceased.Custom('DE_PRO_PER_S_3P_N')], dann zu den Gesalbten gehörend, vor den Thron der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) gelangt – eine Ehre, die jede anwesende Seele bezeugen und weitergeben kann. Aber dennoch ist jeder Tropfen, den ich einem Toten gewähre, einer, den die Lebenden nicht mehr erhalten können."
 pam_holy_myron.0200.a: "Lasst [deceased.GetFirstNameNoTooltip] gesalbt gehen."
 pam_holy_myron.0200.a.saint_tt: "#V [deceased.GetFirstNameNoTooltip|U]#! wird bei der Prüfung der Heiligsprechung in einem günstigeren Licht erscheinen"
 pam_holy_myron.0200.b: "Das Chrisam ist für die Lebenden."
 pam_holy_myron.0200.b.tt: "Ihr verwaltet das heilige Chrisam für jene, die noch mit ihm gesegnet werden können"
 ### Spending the oil
 pam_holy_myron_spend_tt: "Ein Teil der Ampulle mit heiligem Myron wurde ausgegeben"
 pam_holy_myron_spend_last_tt: "Der #N letzte#! Rest Eurer Ampulle mit heiligem Myron wurde ausgegeben – das geleerte Gefäß wird #N verloren#!sein"
 pam_holy_myron_vessel_spent_toast: "Die Ampulle versiegt"
 pam_holy_myron_vessel_spent_tt: "Der letzte Teil des Chrisams wurde vergossen, das Gefäß wird nicht weiter verwendet"
 ### Coronation
 pam_holy_myron_coronation_option: "Möge das heilige Myron diese Krone besiegeln."
 pam_holy_myron_coronation_option.flavor: "Verwendet einen Teil des heiligen Chrisams für Eure eigene Salbung."
 pam_chrismated_regalia_desc: "[pam_regnal_artifact.GetDesc]\n\nWährend einer Krönung wurde dieses Artefakt mit dem heiligen Myron berührt, und der Segen ist seitdem geblieben."
 pam_holy_myron_coronation_memory: "wurde mit dem heiligen Myron gesalbt"
 pam_holy_myron_coronation_memory_desc: "Während meiner Krönung salbte mich [anointer.GetTitledFirstName] mit dem heiligen Chrisam."
 pam_holy_myron_coronation_memory_desc_second_perspective: "während Eurer Krönung salbte [anointer.GetTitledFirstName] Euch mit dem heiligen Chrisam."
 pam_holy_myron_coronation_memory_desc_third_perspective: "[owner.GetTitledFirstName|U] wurde während [owner.Custom('DE_PRO_POS_S_3P')]er Krönung mit dem heiligen Chrisam gesalbt."
 ### Anoint an Artifact decision
 pam_anoint_artifact_decision: "Ein Artefakt mit dem heiligen Myron salben"
 pam_anoint_artifact_decision_tooltip: "Verwendet einen Teil des heiligen Myron, um eines Eurer [artifacts|E] als [sanctified|El] zu markieren, unabhängig davon, was Eure Grundsätze für gewöhnlich erlauben"
 pam_anoint_artifact_decision_desc: "Das Chrisam fragt nicht nach der Erlaubnis des Klerus. Was auch immer es berührt – Klinge, Buch oder Tand –, wird vor der höchsten Macht ([ROOT.Char.GetFaith.GetName]) durch das Öl höchstselbst [sanctified|El] und kein Grundsatz oder Bischof kann dem trotzen."
 pam_anoint_artifact_decision_confirm: "Es salben"
 pam_anoint_artifact_decision_no_item_selected: "Kein [artifact|E] ausgewählt"
 pam_anoint_artifact_needs_myron_tt: "Muss eine #V Ampulle mit heiligem Myron#! besitzen, in der noch Öl ist"
 pam_anoint_artifact_has_eligible_artifact_tt: "Muss ein [artifact|E] besitzen, das nicht bereits [sanctified|El] ist"
 pam_anoint_artifact_not_myron_tt: "Das heilige Myron kann sich nicht selbst salben"
 pam_anoint_artifact_not_already_chrismated_tt: "Darf nicht bereits mit Chrisam gesalbt sein"
 pam_anoint_artifact_toast: "Mit Chrisam gesalbtes Artefakt"
 pam_chrismated_artifact_name: "Mit Chrisam gesalbt: [pam_anointed_artifact.GetNameNoTooltip]"
 pam_chrismated_artifact_desc: "[pam_anointed_artifact.GetDesc]\n\nDieses Artefakt wurde mit dem heiligen Myron gesalbt und glänzt ganz leicht durch das heilige Öl."
 ### Gift the Holy Myron interaction
 pam_give_holy_myron_interaction: "Das heilige Myron verschenken"
 pam_give_holy_myron_interaction_desc: "Füllt eine neue Ampulle mit Eurem eigenen heiligen Myron und schenkt es [recipient.GetShortUIName]. Euer Vorrat verliert einen Teil; Ihr erhaltet [piety|E] und die Dankbarkeit von [recipient.GetShortUIName]."
 pam_give_holy_myron_recipient_toast: "Heiliges Myron als Geschenk"
 pam_give_holy_myron_recipient_tt: "Ihr erhaltet ein [common|El]es [artifact|E] (Ampulle mit heiligem Myron), das eine Portion Salböl enthält"
 ### Personal tenet rituals
 pam_holy_myron_chrismation_toast: "Salbung des Neugeborenen mit Chrisam"
 pam_holy_myron_unction_toast: "Die Salbung der Kranken"
 pam_holy_myron.0300.t: "Das Siegel des Geistes"
 pam_holy_myron.0300.desc: "Mein[child.Custom('DE_END_PRO_S_N')] [child.Custom('GetDaughterSon')] [child.GetFirstName] schreit, als der [myron_officiant.GetFaith.PriestNeuter] das Chrisam aufbringt.\n\nDie Kirche besitzt ausreichend Öl für jedes Neugeborene – doch meine eigene Ampulle mit heiligem Myron ist in Reichweite und ein einziger glänzender Tropfen davon würde dieses Kind für sein ganzes Leben schützen."
 pam_holy_myron.0300.desc_twin: "\n\nUnd nicht nur eine Braue, sondern zwei – [pam_myron_twin.GetFirstName] liegt in Windeln neben [pam_myron_twin.Custom('DE_PRO_POS_S_3P')]em Zwilling und wartet auf denselben Schutz."
 pam_holy_myron.0300.a: "Das gesegnete Öl der Kirche genügt."
 pam_holy_myron.0300.b: "Nur das heilige Myron kommt infrage."
