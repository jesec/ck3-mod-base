l_german:
 # Religious Study scheme (study_scripture): a personal self-study scheme for theocratic rulers.
 study_scripture: "Religionsstudium"
 study_scripture_action: "Religionsstudium"
 study_scripture_desc: "Ich werde mich dem Erlernen des Heiligen hingeben: den heiligen Schriften ([GetPlayer.GetFaith.ReligiousText]), den Doktrinen meines Glauben und darüber hinausgehende Mysterien."
 study_scripture_desc_general: "$study_scripture$ ist ein [personal_scheme|El], in dem Ihr [piety|E], einen besseren [skill|E] und die [trait|E] [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] erwerben könnt."
 STUDY_SCRIPTURE_SCHEME_SUCCESS_DESC: "Ihr verbessert Eure Werte, erhaltet Frömmigkeit oder findet eine Gelegenheit"
 STUDY_SCRIPTURE_PURSUIT_OF_KNOWLEDGE: "Ihr nehmt den Grundsatz namens [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName] an: $VALUE|+0=$"
 STUDY_SCRIPTURE_SCHOLASTICISM: "Ihr nehmt den Grundsatz namens [GetTenetType('tenet_scholasticism').GetBaseName] an: $VALUE|+0=$"
 STUDY_SCRIPTURE_CLERICAL_SUPERIOR: "[learning|E] Eures Kirchenoberen: $VALUE|+0=$"
 STUDY_SCRIPTURE_RENEWED_ZEAL: "Ihr habt [GetModifier('pam_renewed_zeal_modifier').GetNameWithTooltip]: $VALUE|+0=$"
 STUDY_SCRIPTURE_STRESSED: "Eure [stress|E] lastet während des Studiums auf Euch: $VALUE|+0=$"
 STUDY_SCRIPTURE_ZEALOUS: "Ihr seid [GetTrait('zealous').GetName(owner)|l]: $VALUE|+0=$"
 STUDY_SCRIPTURE_CYNICAL: "Ihr seid [GetTrait('cynical').GetName(owner)|l]: $VALUE|+0=$"
 pam_study_scripture_decision: "[ROOT.Char.GetFaith.ReligiousText|U] studieren"
 pam_study_scripture_decision_desc: "Heilige Texte ([ROOT.Char.GetFaith.ReligiousText]) lesen sich nicht von selbst, ebenso wie sich die Doktrinen des Glaubens ([ROOT.Char.GetFaith.GetName]) nicht einfach im untätigen Geist entfalten. Ein paar Stunden, die die [ROOT.Char.Custom('StudyOfficesWord')] mir erlauben – zum Studieren und Sinnieren und damit die Herde sieht, dass auch ihr Hirte lernt."
 pam_study_scripture_decision_tooltip: "Beginnt ein [GetScheme('study_scripture').GetTypeName]s-[scheme|E] mit Euch selbst als Ziel"
 pam_study_scripture_decision_tt: "Ihr beginnt ein [GetScheme('study_scripture').GetTypeName]s-[scheme|E] mit Euch selbst als Ziel\n\nErwartete Belohnungen:\n$EFFECT_LIST_BULLET$[piety_i][piety|E]\n$EFFECT_LIST_BULLET$[GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] ([trait|E]/[trait_level_track_xp|E])\n$EFFECT_LIST_BULLET$[learning_i][stewardship_i][diplomacy_i] [skill|E] #weak (bis zu 8)#!\n$EFFECT_LIST_BULLET$Gelegenheiten beim [clergy|E]\n\nNachteile:\n$EFFECT_LIST_BULLET$Man kann [stress_i][stress|E] erhalten\n$EFFECT_LIST_BULLET$Verringerter [prestige_i][prestige|E]-Zuwachs"
 pam_study_scripture_decision_confirm: "Lasst die Lektion beginnen."
 pam_study_scripture_decision_req_tt: "Ihr führt nicht bereits ein [GetScheme('study_scripture').GetTypeName]s-[scheme|E] durch"
 pam_study_scripture_decision_end_scheme_tt: "@alert_icon!#alert_trial Euer laufendes [personal_scheme|El] wird enden#!"
 study_scripture_title: "$study_scripture$: "
 study_scripture_outcome_piety: "$study_scripture_title$ Hingabe belohnt"
 study_scripture_outcome_fragment_tt: "#EMP „[owner.Custom('RandomStudyVerseFragment')]“#!"
 study_scripture_outcome_scholarship: "$study_scripture_title$ Einblick in die Heiligen Schrift"
 study_scripture_outcome_mystery: "$study_scripture_title$ Ein Blick auf die Mysterien"
 study_scripture_outcome_stress: "$study_scripture_title$ Ermüdendes Studium"
 # Toast verse fragments: short plain-text lines; the full verses live in event text instead
 pam_ss_fragment_psalm_119_105: "Dein Wort ist meinem Fuß eine Leuchte, ein Licht für meine Pfade …"
 pam_ss_fragment_psalm_119_165: "Frieden in Fülle empfangen, die deine Weisung lieben …"
 pam_ss_fragment_proverbs_9_9: "Unterrichte den Weisen …"
 pam_ss_fragment_proverbs_4_7: "Der Anfang der Weisheit ist …"
 pam_ss_fragment_joshua_1_8: "Tag und Nacht darüber nachsinnen …"
 pam_ss_fragment_matthew_7_7: "Ihr werdet mich suchen und Ihr werdet mich finden …"
 pam_ss_fragment_james_1_5: "Fehlt es aber einem von Euch an Weisheit …"
 pam_ss_fragment_2_timothy_2_15: "Bemüht Euch darum, Euch vor Gott zu bewähren …"
 pam_ss_fragment_verbum_domini: "Verbum Domini manet in aeternum …"
 pam_ss_fragment_generic_1: "Das Mysterium vertieft sich …"
 pam_ss_fragment_generic_2: "Weisheit schlägt Wurzeln …"
 pam_ss_fragment_generic_3: "Die Schriften entfalten ihre Bedeutung …"
 # Faith-flavored vocabulary for StudyParishWord/StudyPulpitWord/StudySeminaryWord/StudyOfficesWord
 pam_ss_word_parish: "Pfarrbezirk"
 pam_ss_word_congregation: "Kongregation"
 pam_ss_word_pulpit: "Kanzel"
 pam_ss_word_minbar: "Minbar"
 pam_ss_word_lectern: "Rednerpult"
 pam_ss_word_seminary: "Priesterseminar"
 pam_ss_word_madrasa: "Madrasa"
 pam_ss_word_school: "Schule"
 pam_ss_word_offices: "die Offizien"
 pam_ss_word_daily_prayers: "die täglichen Gebete"
 pam_ss_word_daily_rites: "die täglichen Riten"
 # Scheme modifiers
 pam_lapsed_studies_modifier: "Aufgegebene Studien"
 pam_lapsed_studies_modifier_desc: "Dieser Charakter gab verzweifelt das heilige Lernen auf."
 pam_renewed_zeal_modifier: "Erneuter Eifer"
 pam_renewed_zeal_modifier_desc: "Streng ermahnt verschrieb sich dieser Charakter wieder seinen Studien.\n[success_chance|E] ([GetScheme('study_scripture').GetTypeName]): #P +10 %#!"
 pam_inspired_study_modifier: "Inspiriertes Studium"
 pam_inspired_study_modifier_desc: "Ein wohlüberlegtes Geschenk trägt diese Studien weiter."
 pam_cloistered_rigor_modifier: "Weltabgeschiedene Stringenz"
 pam_cloistered_rigor_modifier_desc: "Diese Studien werden hinter geschlossenen Türen mit weitreichender Stringenz durchgeführt."
 pam_cloistered_rigor_personal_modifier: "Weltabgeschiedenes Studium"
 pam_cloistered_rigor_personal_modifier_desc: "Dieser Charakter zog sich von weltlichen Angelegenheiten zurück und verfolgt das heilige Lernen mit weitreichender Stringenz."
 pam_measured_devotion_modifier: "Maßvolle Hingabe"
 pam_measured_devotion_modifier_desc: "Diese Studien kommen in den dafür vorgesehenen Stunden stetig voran."
 pam_measured_devotion_personal_modifier: "Hingebungsvoller Schüler der Heiligen Schrift"
 pam_measured_devotion_personal_modifier_desc: "Dieser Charakter verfolgt das heilige Studium mit stetiger, maßvoller Hingabe."
 pam_mortified_flesh_modifier: "Kasteiung des Fleisches"
 pam_mortified_flesh_modifier_desc: "Fasten und Wachen schärften den Geist für diese Studien."
 pam_divine_favor_modifier: "Göttliche Gunst"
 pam_divine_favor_modifier_desc: "Diese Studien wurden gesegnet."
 pam_devoted_acolyte_modifier: "Ergebener Akolyth"
 pam_devoted_acolyte_modifier_desc: "Ein ergebener Helfer, der sich um alle Bedürfnisse bei diesen Studien kümmert."
 pam_amanuensis_modifier: "Gläubiger Amanuensis"
 pam_amanuensis_modifier_desc: "Ein gläubiger Assistent verwahrt Notizen und Seiten in perfekter Ordnung."
 pam_persistent_devotions_modifier: "Anhaltende Hingabe"
 pam_persistent_devotions_modifier_desc: "Rückschläge vertieften die Disziplin dieser Studien nur noch weiter."
 pam_renowned_exegete_modifier: "Berühmter Exeget"
 pam_renowned_exegete_modifier_desc: "Das Lesen der heiligen Schriften mache diesen Charakter zu einem [Glossary('Exegeten', 'GLOSS_EXEGETE')]."
 pam_doctrinal_clarity_modifier: "Klarheit der Doktrinen"
 pam_doctrinal_clarity_modifier_desc: "Dieser Charakter sieht die Doktrinen des eigenen Glaubens mit seltener Klarheit.\n\nAnnahme ($sway_ruler_to_my_rite_interaction$): #p +20#!\nAnnahme ($pam_evangelize_personal_tenet_interaction$): #p +20#!\n[Concept('piety', 'Frömmigkeits')|E]-Kosten ($pam_evangelize_personal_tenet_interaction$): #p -50 %#!"
 pam_known_in_the_synod_modifier: "Bekannt in der Synode"
 pam_known_in_the_synod_modifier_desc: "Im Klerus spricht man über die Bildung dieses Charakters."
 pam_assisted_by_theologians_modifier: "Unterstützt von Theologen"
 pam_assisted_by_theologians_modifier_desc: "Gelehrte Theologen unterstützen diesen Charakter."
 pam_known_by_mystics_modifier: "Bekannt bei Mystikern"
 pam_known_by_mystics_modifier_desc: "Dieser Charakter ist hoch angesehen unter Mystikern und Denkern."
 pam_monastic_copyists_modifier: "Klosterkopisten"
 pam_monastic_copyists_modifier_desc: "Unermüdliche Klosterkopisten versorgen diese Studien mit frischen Texten."
 pam_charterhouse_silence_modifier: "Schweigen in der Kartause"
 pam_charterhouse_silence_modifier_desc: "Die Disziplin der schweigenden Denker stabilisiert diese Studien."
 pam_pastoral_letter_county_modifier: "Ein Hirtenbrief"
 pam_pastoral_letter_county_modifier_desc: "Ein tröstender und lehrreicher Brief von einem fernen Hirten des Glaubens wird laut bei jedem Gottesdienst verlesen."
