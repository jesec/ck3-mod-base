l_german:
 # Monastic funeral — the order's care when a funeral is held at one of its houses
 # Funeral planner province line (activity_funeral province_description / ai_will_select_province)
 activity_funeral_monastic: "#P +++ Kloster#!\n"
 pam_monastic_funeral.0001.t: "Gebete ohne Ende"
 pam_monastic_funeral.0001.desc.intro: "Die letzten Gesänge verklingen unter dem Gewölbe. Die Riten für [deceased.GetTitledFirstName] sind gehalten und Stille legt sich wieder über das Haus.\n\n"
 pam_monastic_funeral.0001.desc.brothers: "Die Brüder gehen in Zweierreihen hinaus, die Kapuzen tief ins Gesicht gezogen, und lassen uns alle in ehrfürchtiger Stille zurück."
 pam_monastic_funeral.0001.desc.sisters: "Die Schwestern gehen in Zweierreihen hinaus, die Schleier vor dem Gesicht, und lassen uns alle in ehrfürchtiger Stille zurück."
 pam_monastic_funeral.0001.desc.outro: "\n\n[abbot.GetTitledFirstName|U] bleibt an meiner Seite. „Die Toten sind hier in guten Händen, [ROOT.Char.Custom('FormOfAddressForLiege')]“, sagt [abbot.Custom('DE_PRO_PER_S_3P_N')]. „Und unsere Gebete enden nicht am Grab. [deceased.Custom('DE_PRO_POS_S_3P')|U] Name wird in [Glossary('unserem Nekrolog', 'PAM_NECROLOGY_GLOSS')] stehen, so lange es eine Stimme gibt, die es verliest.“"
 pam_monastic_funeral.0001.a: "Betet für mein Haus, jetzt und für immerdar."
 pam_monastic_funeral.0001.b: "Ladet Pilger dazu ein, für die Seele von [deceased.GetFirstNameNoTooltip] zu beten."
 pam_monastic_funeral.0001.c: "Die Toten sind in guten Händen. Das reicht mir."
 # Monastic register of the dead, read aloud in the daily office - https://en.wikipedia.org/wiki/Necrology
 PAM_NECROLOGY_GLOSS: "Das Register, in dem ein Kloster die Namen seiner Toten auflistete: Brüder, Gönner und Wohltäter gleichermaßen. Jeden Tag wurden die fälligen Namen laut im Kapitel vorgelesen, und die Gemeinschaft betete für diese Seelen. Eines Namens, der einmal eingetragen worden war, wurde so lange gedacht, wie das Haus bestand."
 pam_monastic_commemoration_modifier: "Dauerhaftes Gedenken"
 pam_monastic_commemoration_modifier_desc: "Das Haus dieses Charakters ist in den Nekrolog eines Mönchsordens eingetragen, und seiner Toten wird in den täglichen Gebeten des Ordens gedacht."
 pam_monastic_chronicle_modifier: "Grabstätte eines Adligen"
 pam_monastic_chronicle_modifier_desc: "Die Grabstätte eines Adligen zieht fromme Pilger an, die für ihn beten."
