l_german:
 # Secular Faith & Rite — ambient (yearly pool) events
 # Feed message — knowledge of a foreign tenet seeded by a dream or encounter (reuses the passive-learning feed type)
 pam_sf_seeded_tenet_desc: "Eine Praktik außerhalb Eures [Concept('faith', 'Glaubens')|E] nistete sich in Eure Gedanken ein, und Ihr erwarbt das [agnostic_knowledge|E] über den [core_tenet|E] [pam_sf_seeded_tenet.GetBaseName]."
 # Friendship reasons (set_relation_friend / set_relation_best_friend)
 pam_sf_friend_godparent: "[CHARACTER.GetShortUIName|U] stand als [Select_CString(CHARACTER.IsFemale, 'Patin', 'Pate')] an der Seite von [TARGET_CHARACTER.GetShortUIName], und die spirituelle Verwandtschaft wurde zu Freundschaft."
 pam_sf_friend_godparent_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] stand als [Select_CString(TARGET_CHARACTER.IsFemale, 'Patin', 'Pate')] an der Seite von [CHARACTER.GetShortUIName], und die spirituelle Verwandtschaft wurde zu Freundschaft."
 pam_sf_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] fühlten sich durch den gemeinsamen Glauben zueinander hingezogen."
 pam_sf_best_friend_shared_conviction: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] besitzen eine tiefe Bindung durch den gemeinsamen Glauben und wurden engste Freunde."
 pam_sf_friend_shielded: "[CHARACTER.GetShortUIName|U] schützte [TARGET_CHARACTER.GetShortUIName] vor religiöser Verfolgung."
 pam_sf_friend_shielded_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] schützte [CHARACTER.GetShortUIName] vor religiöser Verfolgung."
 # Lover reasons (set_relation_lover / set_relation_soulmate)
 pam_sf_lover_shared_conviction: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] wurden Geliebte, die sich durch den gemeinsamen Glauben zueinander hingezogen fühlten."
 pam_sf_lover_carnal_revelation: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] wurden Geliebte in einer Nacht der gemeinsamen, heiligen Hingabe."
 pam_sf_lover_confessional: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] fanden mehr in der Beichte als nur die Vergebung und wurden Geliebte."
 pam_sf_lover_two_faiths: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] wurden Geliebte, nachdem sie die Feinheiten des Glauben diskutiert hatten."
 pam_sf_soulmate_shared_conviction: "[CHARACTER.GetShortUIName|U] und [TARGET_CHARACTER.GetShortUIName] wurden Seelengefährten, und ihre Liebe vertiefte sich durch den gemeinsamen Glauben."
 # Rivalry / nemesis reasons (set_relation_potential_rival / progress_towards_nemesis_effect)
 pam_sf_rival_bought_office: "[CHARACTER.GetShortUIName|U] verkaufte das heilige Amt von [TARGET_CHARACTER.GetShortUINameNoTooltip] an einen Fremden, der es bezahlen konnte."
 pam_sf_rival_bought_office_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] verkaufte das heilige Amt von [CHARACTER.GetShortUINameNoTooltip] an einen Fremden, der es bezahlen konnte."
 pam_sf_nemesis_forced_to_cloister: "[TARGET_CHARACTER.GetShortUIName|U] zwang [CHARACTER.GetShortUIName] in ein Kloster und dazu, ein heiliges Gelübde abzulegen."
 pam_sf_nemesis_forced_to_cloister_corresponding: "[CHARACTER.GetShortUIName|U] zwang [TARGET_CHARACTER.GetShortUIName] in ein Kloster und dazu, ein heiliges Gelübde abzulegen."
 # Vocative address for a ruler in dialogue (used by FormOfAddressForLiege) - the whole phrase, including any leading "my"
 pam_my_liege_reverend_father: "ehrwürdiger Vater"
 pam_my_liege_reverend_mother: "ehrwürdige Mutter"
 pam_my_liege_captain: "Kapitän"
 pam_my_liege_khan: "Großkhan"
 pam_my_liege_khatun: "Großkhatun"
 pam_my_liege_chieftain: "mein Häuptling"
 pam_my_liege_serene_lord: "durchlauchtigster Fürst"
 pam_my_liege_serene_lady: "durchlauchtigste Fürstin"
 pam_my_liege_lord: "mein Fürst"
 pam_my_liege_lady: "meine Fürstin"
 pam_my_liege_liege: "mein Lehnsherr"
 pam_secular_faith_events.0001.t: "Heiliger Rauch"
 pam_secular_faith_events.0001.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] trägt das Weihrauchfass durch das Kirchenschiff. Heiliger Rauch weht in die Dachsparren und nimmt die gemurmelten Gebete der Gemeinde mit sich.\n\nFür einen Augenblick scheint die ganze Schöpfung nach einem gütigen Jenseits ([ROOT.Char.GetFaith.PositiveAfterLife]) zu greifen und ich mit ihr."
 pam_secular_faith_events.0001.a: "Ich verliere mich im Gebet."
 pam_secular_faith_events.0001.b: "Dieser Ritus sollte der höchsten Macht ([ROOT.Char.GetFaith.WealthGodName]) gewidmet werden."
 pam_secular_faith_events.0001.c: "Wir als [ROOT.Char.Custom('GetCourt')] sollten diese Hingabe teilen."
 pam_secular_faith_events.0002.t: "Pikuach Nefesch"
 pam_secular_faith_events.0002.desc: "[traveler_in_danger.GetTitledFirstName|U], [Select_CString(traveler_in_danger.IsFemale, 'eine Reisende, die', 'ein Reisender, der')] meine Lande durchquert, wurde im hiesiegen Gelände ([background_terrain_scope.GetName]) von Banditen überfallen!\n\n[traveler_in_danger.Custom('DE_PRO_POS_S_3P')|U] Leben ist in Gefahr, doch es ist verboten, am heiligen Tag der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) zu den Waffen zu greifen. Es ist nicht an mir, den Sabbat zu brechen ist nicht an mir. Wenn ich bis Sonnenuntergang warte, könnte es sein, dass ich nur ausreite, um [traveler_in_danger.Custom('DE_PRO_PER_S_3P_A')] zu begraben.\n\nDoch kann ich wirklich tatenlos zusehen, während ein Leben in Gefahr ist?"
 pam_secular_faith_events.0002.a: "Ein Leben überwiegt alles. Wir reiten los."
 pam_secular_faith_events.0002.b: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstNameNoTooltip] sollte diese Frage zu hören bekommen."
 pam_secular_faith_events.0002.c: "Ich werdenden Sabbat nicht brechen."
 pam_secular_faith_events.0003.t: "Eine Vision in der Nacht"
 pam_secular_faith_events.0003.desc: "Ich wache auf und fühle mich gepackt von mehr als nur einem Traum – eine Feuersäule, eine Stimme, die meinen Namen kannte, ein Gesicht, das ich nicht vergessen kann …\n\nWar es die höchste Macht ([ROOT.Char.GetFaith.HighGodName]), die zu mir sprach? [ROOT.Char.GetFaith.HealthGodName|U]? Oder das Böse ([ROOT.Char.GetFaith.DevilName]) in schöner Verkleidung …\n\nVielleicht war es nur ein fiebriges Temperament des Blutes."
 pam_secular_faith_events.0003.a: "Die Stimme flüsterte beglückende Wahrheiten …"
 pam_secular_faith_events.0003.b: "Fiebriges Temperament … Ich muss über solche Fälle nachlesen."
 pam_secular_faith_events.0003.c: "Als [ROOT.Char.Custom('GetCourt')] muss man erfahren, was ich sah!"
 pam_secular_faith_events.0004.t: "Verbotene Wahrheit"
 pam_secular_faith_events.0004.desc: "Ich bin schlaflos, stecke voller Zweifel, wandere durch die dunklen Hallen ([ROOT.Char.Custom('ResidenceBuildingHallsType')]) meiner Residenz ([ROOT.Char.Custom('ResidenceBuilding')]).\n\nMein Geist kehrt immer wieder zu etwas zurück, was mein Glaube verurteilt ([pam_sf_forbidden_tenet.GetBaseName]). Es sollte mich beunruhigen – doch es fühlt sich an, als stecke eine rechtschaffene Wahrheit hinter diesem Glauben, und ich werde diesen Gedanken nicht los."
 pam_secular_faith_events.0004.a: "Ich halte an dieser Wahrheit fest – stillschweigend."
 pam_secular_faith_events.0004.b: "Nein. Ich komme nicht vom rechten Pfad ab."
 pam_secular_faith_events.0005.t: "Bei Kerzenschein"
 pam_secular_faith_events.0005.desc_intro: "Das Abendstudium sollte meinen Geist beruhigen, doch eine Textstelle will mir nicht aus dem Kopf.\n\n"
 pam_secular_faith_events.0005.desc_tenet: "Es betrifft den Grundsatz, den man „[pam_sf_revelation_tenet.GetBaseName]“ nennen, eine Praxis, die mein eigener Glaube niemals billigen würde. Ich erkläre mir selbst, dass sie barbarisch ist."
 pam_secular_faith_events.0005.desc_doctrine: "Es betrifft die Doktrin namens „[pam_sf_revelation_doctrine.GetDescriptiveName(ROOT.Char.GetFaith.Self)]“, eine Lehre, die mein eigener Glaube niemals billigen würde. Ich erkläre mir selbst, dass sie falsch ist."
 pam_secular_faith_events.0005.desc_end: "Und dennoch – bei Kerzenschein stelle ich fest, dass ich verstehe, wie eine andere Seele daran festhalten kann."
 pam_secular_faith_events.0005.a: "Ich muss meine Gedanken zu Papier bringen."
 pam_secular_faith_events.0005.b: "Es schadet nicht, das zu verstehen."
 pam_secular_faith_events.0005.c: "Gebete werden diese Gedanken bereinigen."
 pam_secular_faith_events.0006.t: "Die Knochen eines Heiligen"
 pam_secular_faith_events.0006.desc: "Auf dem Markt fällt mein Blick auf [Select_CString(relic_seller.IsFemale, 'eine Pilgerin, der', 'einen Pilger, dem')] die Reise anzusehen ist. In [relic_seller.Custom('DE_PRO_POS_S_3P')]en zitternden Händen liegt ein gelblicher Fingerknochen.\n\n„Der Knochen von einem Heiligen“, schwört [Select_CString(relic_seller.IsFemale, 'die Frau', 'der Mann')]. „Ich fand ihn auf meinen Reisen nach [GetTitleByKey('c_jerusalem').GetNameNoTier], doch als [ROOT.Char.GetTitleAsNameNoTooltip] verwahrte man ihn gewiss sicherer.“\n\nEin geschultes Auge könnte die Behauptung beurteilen. Zum Glück ist die Reliquie zu verkaufen."
 pam_secular_faith_events.0006.a: "Lasst mich das untersuchen, bevor ich Geld dafür ausgebe."
 pam_secular_faith_events.0006.b: "Ich werde das bekommen."
 pam_secular_faith_events.0006.c: "Ich habe keine Verwendung für die Knochen eines Fremden. Hinfort."
 pam_sf_acquire_relic_tt: "Ihr erhaltet ein Reliquien-[artifact|E] von gewöhnlicher [rarity|E]"
 pam_sf_examine_relic_tt: "Ihr erhaltet ein Reliquien-[artifact|E] von einer [rarity|E], die von Eurem [learning_i]-[learning_skill|E] beeinflusst wird"
 pam_sf_acquire_relic_toast: "Ein heiliges Reliquienartifakt erworben"
 pam_sf_fingerbone_relic_name: "Fingerknochen eines heiligen Menschen ([SCOPE.Custom('PamFingerboneSaint')])"
 pam_sf_fingerbone_relic_desc: "Ein gelber Fingerknochen, der als Reliquie eines heiligen Menschen ([SCOPE.Custom('PamFingerboneSaint')]) verehrt und in einem kleinen Reliqiuar aufbewahrt wird."
 pam_secular_faith_events.0007.t: "Arroganter Bischof"
 pam_secular_faith_events.0007.desc: "[defiant_bishop.GetFirstName|U], [defiant_bishop.Custom('DE_ART_DEF_S_N')] mir als [defiant_bishop.GetTitleAsNameNoTooltip] dient, ist stolz, gut vernetzt und stillschweigend davon überzeugt, dass [defiant_bishop.Custom('DE_PRO_PER_S_3P_N')] mir überlegen ist. Mehrere Bedienstete erkrankten kürzlich und ich brauche [defiant_bishop.Custom('DE_PRO_PER_S_3P_A')], um meinen Haushalt zu segnen.\n\nNachdem [defiant_bishop.Custom('DE_PRO_PER_S_3P_N')] meine Rufe seit Tagen überhörte, kommt [defiant_bishop.Custom('DE_PRO_PER_S_3P_N')] nun endlich an. „Ich würde um Vergebung für die Verspätung bitten“, grinst [defiant_bishop.Custom('DE_PRO_PER_S_3P_N')], „doch ich antworte einer höheren Macht, als man es als [ROOT.Char.GetTitleAsNameNoTooltip] ist.“"
 pam_secular_faith_events.0007.a: "Lasst uns mit jener Würde forfahren, die Euer Amt verdient."
 pam_secular_faith_events.0007.b: "Bitte. Führt einfach den Ritus durch."
 pam_secular_faith_events.0007.c: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) mag zwar Eure Herrin sein, doch ich bin [Select_CString(ROOT.Char.IsFemale, 'EureLehnsherrin', 'Euer Lehnsherr')]. Hinaus!"
 pam_secular_faith_events.0008.t: "Die Last der Sünde"
 pam_secular_faith_events.0008.desc: "Die Kerzen brennen herunter, und derselbe Gedanke kehrt zurück. Ich betreibe etwas ([penance_sin.GetName(ROOT.Char)]), und mein Glaube zählt dieses Etwas zu den Sünden.\n\nGanz gleich, wie oft ich diesen Gedanken beiseiteschiebe: Die Schuld bleibt.\n\n„Diszipliniert Euch, und Eure Seele wird von ihrer Bürde befreit.“ Mein[confessor.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', confessor)] [confessor.GetFirstName] zürnt nicht und verdammt mein Handeln auch nicht. „Folgt dieser Buße. Schweift nicht ab.“"
 pam_secular_faith_events.0008.a: "Ich werde tun, was [confessor.GetFirstNameNoTooltip] rät."
 pam_secular_faith_events.0008.b: "Nicht jetzt. Ich bin nicht bereit."
 pam_secular_faith_events.0009.t: "[Select_CString(stranger.IsFemale, 'Eine christusgleiche Fremde', 'Ein christusgleicher Fremder')]"
 pam_secular_faith_events.0009.desc: "Vor meinen Toren steht [Select_CString(stranger.IsFemale, 'eine einsame, vernarbte Fremde', 'ein einsamer, vernarbter Fremder')], die Hände nach Almosen ausgestreckt.\n\n„Ich bitte Euch, ich bereite Euch keine Scherereien, [ROOT.Char.Custom('ComplimentAdjective')|l][ROOT.Char.Custom('DE_END_ADJ_IND_S_N')|l] [ROOT.Char.GetTitleAsNameNoTooltip]“, sagt [stranger.Custom('DE_PRO_PER_S_3P_N')] mit einer anmutigen Verbeugung. „Wenn es Euer Vermögen erlaubt, so bitte ich um einen kleinen Anteil.“\n\n[stranger.Custom('DE_PRO_PER_S_3P_N')|U] ist ungewöhnlich redegewandt für [Select_CString(stranger.IsFemale, 'eine Bettlerin', 'einen Bettler')]. Man weiß nie, wen man so abweist."
 pam_secular_faith_events.0009.a: "Kommt herein. Meine Residenz ([ROOT.Char.Custom('ResidenceBuilding')]) steht Euch offen."
 pam_secular_faith_events.0009.b: "Nehmt dieses Brot und geht in Frieden."
 pam_secular_faith_events.0010.t: "Wer aus der Kälte kam"
 pam_secular_faith_events.0010.desc_blessed: "[Select_CString(stranger.IsFemale, 'Die Frau, die', 'Der Mann, den')] ich durch meine Tore einließ, ist [Select_CString(stranger.IsFemale, 'keine einfache Landstreicherin', 'kein einfacher Landstreicher')]: [stranger.GetFirstName|U] spricht über die heilige Schrift und über Staatskunst mit einer derartigen Leichtigkeit, dass sogar meine gebildeten Mannen lieber schweigen und lauschen.\n\nEs scheint, als sei die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) endlich an meine Tore gekommen. Ich werde [stranger.Custom('DE_PRO_PER_S_3P_A')] nicht weiterziehen lassen."
 pam_secular_faith_events.0010.desc_thief: "Ich wache auf, und das wärmende Feuer ist erloschen und die Geldschatulle offen.\n\nBrot und Schutz wurden mit dem ältesten Verrat überhaupt bezahlt.\n\n[stranger.GetFirstName|U] ist mitten in der Nacht verschwunden und mein Reichtum mit [stranger.Custom('DE_PRO_PER_S_3P_D')].\n\nAls mein Haushalt endlich erwacht, ist [stranger.Custom('DE_PRO_PER_S_3P_N')] längst über alle Berge."
 pam_secular_faith_events.0010.a: "Ihr wurdet aus einem Grund hierhergeschickt."
 pam_secular_faith_events.0010.b: "Ich lud eine Schlange an meinen Tisch ein."
 pam_secular_faith_events.0011.t: "Die Büßer"
 pam_secular_faith_events.0011.desc: "Nicht zum Donner wache ich auf, sondern zum Knallen von Geißeln.\n\nEine Gruppe von Büßern versammelte sich außerhalb meiner Residenz ([ROOT.Char.Custom('ResidenceBuilding')]), und mit offenen und blutigen Rücken verkünden sie, die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) verlange diese [GetTenetType('tenet_mortification_of_the_flesh').GetName(GetNullCharacter.GetRite)].\n\nMein Haushalt blickt mich auf der Suche nach Führung an."
 pam_secular_faith_events.0011.a: "Gibt es eine tiefere Wahrheit dahinter?"
 pam_secular_faith_events.0011.b: "Gebt mir eine Peitsche – denn auch ich habe gesündigt."
 pam_secular_faith_events.0011.c: "Vertreibt diese Verrückten aus meinen Landen!"
 pam_secular_faith_events.0012.t: "Waffensegen"
 pam_secular_faith_events.0012.desc: "Frieden ist stets eine Leihgabe, niemals ein Geschenk.\n\nWährend des Festmahls zu Ehren der kriegerischen Mächte ([ROOT.Char.GetFaith.WarGodName]) bietet mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] an, die Waffen meines Haushalts zu segnen.\n\n„Gott, der du David die Kraft gegen Goliath schenktest, gewähre dieselbe Kraft dem Haus [ROOT.Char.GetHouse.GetBaseName] – möge es sich immer zur Verteidigung der Schwachen erheben“, betet [chaplain.Custom('DE_PRO_PER_S_3P_N')]."
 pam_secular_faith_events.0012.a: "Segnet meine Banner und Klingen für den Tag, an dem sie gebraucht werden."
 pam_secular_faith_events.0012.b: "Lasst uns stattdessen um Frieden beten."
 pam_secular_faith_events.0012.c: "Ein stiller Segen ist ausreichend."
 pam_secular_faith_events.0013.t: "Ein vorhergesagter Tod"
 pam_secular_faith_events.0013.desc: "[Select_CString(prophet.IsFemale, 'Eine Priesterin', 'Ein Priester')] mit weit aufgerissenen Augen wird vor mich gezerrt. Man wirft [prophet.Custom('DE_PRO_PER_S_3P_D')] vor, die Massen aufzuhetzen und Prophezeiungen zu sprechen, und [prophet.Custom('DE_PRO_PER_S_3P_N')] verschwendet keine Zeit, mein[doomed_soul.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', doomed_soul)] [doomed_soul.GetTitledFirstName] auch schon einen zitternden Finger auf sich gerichtet sieht.\n\n„Merkt [doomed_soul.Custom('DE_PRO_PER_S_3P_A')] Euch!“, ruft [prophet.Custom('DE_PRO_PER_S_3P_N')]. „Noch vor dem nächsten Mond wird [doomed_soul.Custom('DE_PRO_PER_S_3P_N')] kalt in der Erde liegen. Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zeigte mir die genaue Stunde!“\n\n[prophet.Custom('DE_PRO_POS_S_3P')|U]e selbstsichere Gewissheit ist beunruhigend. Die Furcht von [doomed_soul.GetFirstNameNoTooltip] noch viel mehr."
 pam_secular_faith_events.0013.a: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) spricht durch merkwürdige Münder …"
 pam_secular_faith_events.0013.b: "Hinfort mit Euch, [Select_CString(prophet.IsFemale, 'verrückte Närrin', 'verrückter Narr')]!"
 prophecy_foretold_tt: "Eine Prophezeiung wurde ausgesprochen. Was, wenn sie wahr ist?"
 prophecy_foretold_2_tt: "Eine Prophezeiung wurde ausgesprochen. Völliger Unsinn!"
 pam_secular_faith_events.0014.t: "Prophetische Vergeltung"
 pam_secular_faith_events.0014.desc_fulfilled: "Ein neuer Mond ist vergangen und [doomed_soul.GetTitledFirstName] tot – still im Schlaf gegangen.\n\n[Select_CString(prophet.IsFemale, 'Die zerlumpte Priesterin', 'Der zerlumpte Priester')] nannte die genaue Stunde. Ich kann das nicht vergessen.\n\nWar das eine Prophezeiung … oder Furcht, die wahr wurde?"
 pam_secular_faith_events.0014.desc_failed: "Ein neuer Mond ist vergangen, doch [doomed_soul.GetTitledFirstName] lebt noch immer. Die Stunde, die [Select_CString(prophet.IsFemale, 'die zerlumpte Priesterin', 'der zerlumpte Priester')] nannte, kam und nahm nichts mit sich, als sie verging.\n\n[prophet.Custom('DE_PRO_PER_S_3P_N')|U] ist [Select_CString(prophet.IsFemale, 'eine Betrügerin oder eine Närrin', 'ein Betrüger oder ein Narr')], aber ganz sicher keine Stimme der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])."
 pam_secular_faith_events.0014.desc_wrong_prediction: "\n\nIch fühle mich eher töricht."
 pam_secular_faith_events.0014.a: "[prophet.Custom('DE_PRO_PER_S_3P_N')|U] ist [Select_CString(prophet.IsFemale, 'eine wahre Prophetin', 'ein wahrer Prophet')]!"
 pam_secular_faith_events.0014.b: "Die Wege der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) sind unergründlich."
 pam_secular_faith_events.0014.c: "Warum habe ich [prophet.Custom('DE_PRO_POS_S_3P')]er vermaledeiten Prophezeiung nur geglaubt?!"
 pam_secular_faith_events.0014.d: "Ich hätte der Prophezeiung glauben sollen …"
 pam_secular_faith_events.0014.e: "[Select_CString(prophet.IsFemale, 'Die Priesterin war eine Betrügerin', 'Der Priester war ein Betrüger')] – genau so, wie ich es sagte!"
 gains_religious_inspiration_tt: "[prophet.GetShortUIName|U] erhält eine religiöse [inspiration|E]"
 pam_secular_faith_events.0015.t: "Die weinende Ikone"
 pam_secular_faith_events.0015.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] drängt mich in ein Gotteshaus ([miracle_church.GetName]). Drinnen weinen die gemalten Augen eines Heiligen duftendes Öl.\n\nDie Kunde eines Wunders ist schneller als jeder Bote, und ein Wunder ist ein mächtiges und gefährliches Ding."
 pam_secular_faith_events.0015.a: "Ein Wunder? Das muss untersucht werden."
 pam_secular_faith_events.0015.b: "Lasst die Gläubigen kommen. Wir werden sie empfangen."
 pam_secular_faith_events.0015.c: "Dieser Segen soll nicht geteilt werden."
 pam_secular_faith_events.0015.d: "Mein Reich ist gesegnet!"
 no_miracles_tt: "Dieses Wunder wirkt verdächtig …"
 pam_secular_faith_events.0016.t: "Ein Preis für die Kanzel"
 pam_secular_faith_events.0016.desc_intro: "[ROOT.Char.Custom2('DescriptorMixedArticle', SCOPE.sC('candidate'))|U] [candidate.GetWomanMan] betritt meine Residenz ([ROOT.Char.Custom('ResidenceBuilding')]) – nicht, um einen Gefallen zu erbitten, sondern vielmehr, um einen zu kaufen.\n\n„[old_realm_priest.GetCouncilTitle|U] [old_realm_priest.GetFirstName] ist [Select_CString(old_realm_priest.IsFemale, 'eine gute Hirtin', 'ein guter Hirte')]“, murmelt [candidate.Custom('DE_PRO_PER_S_3P_N')] und lässt eine pralle Geldbörse auf den Tisch fallen. „Allerdings würde ich mich als … dankbarer erweisen. Ernennt mich in [old_realm_priest.Custom('DE_PRO_POS_S_3P')] Amt und erntet den Segen der wohlhabenden Mächte ([ROOT.Char.GetFaith.WealthGodName]).“"
 pam_secular_faith_events.0016.desc_sanctioned: "\n\n[GetTenetType('tenet_simony').GetName(GetNullCharacter.GetRite)|U]: Das ist keine Schande, und das Silber ist gut."
 pam_secular_faith_events.0016.desc_sinful: "\n\n[GetTenetType('tenet_simony').GetName(GetNullCharacter.GetRite)|U]: Das ist eine Sünde. Das Gold anzunehmen, würde meine Seele schwarz werden lassen."
 pam_secular_faith_events.0016.a: "Immerhin wiegt Gold schwerer als jede Sünde …"
 pam_secular_faith_events.0016.b: "Ein guter Preis. Und angemessen bezahlt. Das Amt ist Euer."
 pam_secular_faith_events.0016.c: "Das Amt steht nicht zum Verkauf."
 pam_secular_faith_events.0017.t: "[Select_CString(accused.IsFemale, 'Eine Ketzerin', 'Ein Ketzer')] im Herzen der Macht ([ROOT.Char.Custom('GetCourt')|U])"
 pam_secular_faith_events.0017.desc: "„[Select_CString(accused.IsFemale, 'Ketzerin', 'Ketzer')]!“ Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName], deutet anklagend auf [accused.GetFirstName]. „Seht Ihr nicht den scheußlichen #L [accused.GetRite.GetAdjective|l]en#! Einfluss von [accused.GetFirstNameNoTooltip] auf uns als [ROOT.Char.Custom('GetCourt')]? [accused.Custom('DE_PRO_PER_S_3P_N')|U] muss Buße tun und die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) anerkennen!“\n\n[accused.GetFirstNameNoTooltip|U] lässt sich nichts anmerken, obwohl die Anschuldigung [accused.Custom('DE_PRO_PER_S_3P_A')] offenkundig verletzt."
 pam_secular_faith_events.0017.a: "[accused.GetFirstNameNoTooltip|U], lasst mich Euch zum Glauben führen."
 pam_secular_faith_events.0017.a.success: "[accused.GetFirstNameNoTooltip|U] wird bekehrt"
 pam_secular_faith_events.0017.a.failure: "[accused.GetFirstName|U] lässt sich nicht bewegen"
 pam_secular_faith_events.0017.b: "Dann tut Buße in einer Zelle. Ergreift [accused.Custom('DE_PRO_PER_S_3P_A')]."
 pam_secular_faith_events.0017.c: "[accused.GetFirstNameNoTooltip|U] steht unter meinem Schutz. Genug."
 pam_secular_faith_events.0018.t: "Ein Kind für Gott"
 pam_secular_faith_events.0018.desc: "Mein[pious_child.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', pious_child)] [pious_child.GetFirstName] ist anders als andere Kinder. Während die anderen spielen, verbringt [pious_child.Custom('DE_PRO_PER_S_3P_N')] [pious_child.Custom('DE_PRO_POS_S_3P')]e Tage in der Kapelle.\n\n„Ich sah noch nie ein Kind wie [pious_child.Custom('DE_PRO_PER_S_3P_A')] gesehen“, sagt mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] leise. „[pious_child.Custom('DE_PRO_PER_S_3P_N')|U] verbringt Stunden im Gebet und weint während der Messe. Für mich ist es völlig klar: [pious_child.GetFirstNameNoTooltip|U] wünscht ein Leben als [GetTrait('devoted').GetName(pious_child)].“"
 pam_secular_faith_events.0018.a: "Dient der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]), aber bleibt hier."
 pam_secular_faith_events.0018.b: "Die Kirche soll mein Kind haben."
 pam_secular_faith_events.0018.c: "Nein, [pious_child.Custom('DE_PRO_PER_S_3P_N')] gehört zum Haus [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 pam_secular_faith_events.0019.t: "Gottesfriede"
 pam_secular_faith_events.0019.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] kommt mit ernster Kunde.\n\n„Ein Bruder darf keinen anderen Bruder unter den Augen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) erschlagen“, erklärt [chaplain.Custom('DE_PRO_PER_S_3P_N')]. „[feud_attacker.GetTitledFirstName|U] und [feud_defender.GetTitledFirstName] zogen ihre Schwerter gegeneinander, und es sind die einfachen Leute, die für ihren Streit bluten!\n\nBeendet dies. Erinnert sie an den Grundsatz namens [GetTenetType('tenet_peace_of_god').GetName(GetNullCharacter.GetRite)].“"
 pam_secular_faith_events.0019.a: "Im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) wird Frieden herrschen."
 pam_secular_faith_events.0019.b: "Jeder Fürst, der seine Klinge zog, wird sich dafür verantworten müssen."
 pam_secular_faith_events.0019.c: "Nur ich urteile über die Streitigkeiten meiner Vasallen."
 pam_sf_peace_of_god_ends_wars_tt: "Jeder [war|E] zwischen Euren [vassals|E] endet mit einem [Concept('white_peace', 'Weißen Frieden')|E]"
 pam_secular_faith_events.0020.t: "Das Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship|U]) von [temple_location.GetNameNoTooltip]"
 pam_secular_faith_events.0020.desc: "Die Steinmetze setzen den letzten Stein auf das erste Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]), das ich je erbaute, hier in der Landschaft ([temple_location.Custom('TerrainTypeProvince')]) von [temple_location.GetName].\n\nMein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] schreitet mit Weihrauch in den Händen über das Gelände.\n\n„Man wird sich Eurer erinnern ob der [ROOT.Char.GetFaith.HouseOfWorshipPlural], die Ihr der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) weihtet“, sagt [chaplain.Custom('DE_PRO_PER_S_3P_N')]. „Möge dieses das erste dieser Gotteshäuser von vielen sein.“"
 pam_secular_faith_events.0020.a: "Führt uns im Gebet, [chaplain.GetFirstNameNoTooltip]."
 pam_secular_faith_events.0020.b: "Lasst [consecrated_county.GetNameNoTierNoTooltip] um das Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) erblühen."
 pam_secular_faith_events.0020.c: "Innerhalb dieser Mauern werde ich nach Weisheit streben."
 pam_secular_faith_events.0020.d: "Ich habe gerade erst mit der Arbeit der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) begonnen."
 pam_secular_faith_events.0021.t: "Ein himmlisches Zeichen"
 pam_secular_faith_events.0021.desc: "Der Schlaf will nicht kommen. Ich suche die stille Dunkelheit im [ROOT.Char.Custom('GetCourtyard')] auf und blicke in den Himmel. Heute schenkt mir der Himmel ein Zeichen: [ROOT.Char.Custom('GetPamCelestialOmen')].\n\nSolche Zeichen sind niemals ohne Bedeutung."
 pam_omen_blood_moon: "ein roter Mond"
 pam_omen_star_host: "eine Schar von Sternen, wo keine sein sollten"
 pam_omen_comet: "ein Komet mit Zwillingsschweif"
 pam_omen_falling_stars: "ein Regen vom Himmel herabfallender Sterne"
 pam_omen_moon_halo: "ein Ring fahlen Lichts um den Mond herum"
 pam_omen_eclipse: "ein Mond, der sich zu einer kupferfarbenen Sichel verfinstert hat"
 pam_omen_wandering_star: "ein heller Wanderstern"
 pam_secular_faith_events.0021.a: "Ich werde dieses Omen untersuchen."
 pam_secular_faith_events.0021.b: "Die Gunst der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) scheint durch dieses Zeichen hindurch."
 pam_secular_faith_events.0021.c: "Solch ein Zeichen kündigt Eroberungen an!"
 pam_secular_faith_events.0021.d: "Der Himmel schuldet mir keine Antworten."
 pam_secular_faith_events.0022.t: "Wen man als [ROOT.Char.GetTitleAsNameNoTooltip] berührt"
 pam_secular_faith_events.0022.desc_intro: "Mein[sick_courtier.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', sick_courtier)] [sick_courtier.GetFirstName] kommt auf mich zu, blass und unsicher.\n\n"
 pam_secular_faith_events.0022.desc_ill: "„Ich sieche dahin, [ROOT.Char.Custom('FormOfAddressForLiege')]. Mein Zustand ist grässlich, und es ist keine Heilung in Sicht. Nicht einmal [Select_CString(TARGET_CHARACTER.IsFemale, 'die Ärztin', 'der Arzt')], [physician.GetTitledFirstName], weiß, was mit mir nicht stimmt!“, jammert [sick_courtier.Custom('DE_PRO_PER_S_3P_N')].\n\n\n\n"
 pam_secular_faith_events.0022.desc_other: "„Ich sieche dahin. Etwas Schreckliches ([illness_trait.GetName]) hat mich fest im Griff, und es ist keine Heilung in Sicht. Nicht einmal [physician.GetTitledFirstName] weiß, was mit mir nicht stimmt!“, jammert [sick_courtier.Custom('DE_PRO_PER_S_3P_N')].\n\n"
 pam_secular_faith_events.0022.desc_end: "„Man sagt, eine gekrönte Hand trage die Gnade der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) in sich. Es ist die letzte Hoffnung, die mir bleibt.“"
 pam_secular_faith_events.0022.a: "Kommt. Lasst meine Hände auf Euch ruhen."
 pam_secular_faith_events.0022.b: "Nein … Ich werde Euch von hier aus segnen."
 pam_sf_kings_touch_gamble_tt: "Meine Berührung könnte [sick_courtier.GetFirstName] sich von der Krankheit erholen lassen. Oder die Krankheit geht auf mich über …"
 pam_sf_kings_touch_cured_toast: "[sick_courtier.GetFirstName|U] erhebt sich vom Krankenbett"
 pam_sf_kings_touch_infected_toast: "Die Krankheit geht stattdessen auf mich über"
 pam_sf_kings_touch_nothing_toast: "Meine Berührung bringt für [sick_courtier.GetFirstName] keine Veränderung"
 pam_secular_faith_events.0023.t: "[Select_CString(scholar.IsFemale, 'Eine wandernde Schreiberin', 'Ein wandernder Schreiber')]"
 pam_secular_faith_events.0023.desc: "[Select_CString(scholar.IsFemale, 'Eine ausgemergelte Frau', 'Ein ausgemergelter Mann')] wird zu mir gebracht, die Finger von Tinte verfärbt und Buchrollen unter den Arm gesteckt.\n\n„Ich bin [scholar.GetFirstName], [Select_CString(scholar.IsFemale, 'eine Schreiberin und Gelehrte', 'ein Schreiber und Gelehrter')]“, sagt [scholar.Custom('DE_PRO_PER_S_3P_N')]. „Ich habe kein Zuhause und kein Patronat. Diese Hände sind nicht für die Arbeit geschaffen, sondern um die Worte, die man als [ROOT.Char.GetTitleAsNameNoTooltip] auf etwas Unvergänglichem ([ROOT.Char.Custom('GetWritingMaterial')]) festzuhalten.\n\n„Ich bitte Euch: Gewährt mir Brot und ein Dach über dem Kopf, und ich werde Euch treu dienen.“"
 pam_secular_faith_events.0023.a: "[Select_CString(scholar.IsFemale, 'Eine Gelehrte', 'Ein Gelehrter')]? Bringt mir bei, was Ihr wisst."
 pam_secular_faith_events.0023.b: "Jemand ([scholar_church.GetNameNoTooltip]) braucht Euch."
 pam_secular_faith_events.0023.c: "Meine Hauptbücher brauchen eine ruhige Hand."
 pam_secular_faith_events.0023.d: "Ich habe keine Verwendung für Euch. Hinfort."
 pam_secular_faith_events.0024.t: "Ins Kloster"
 pam_secular_faith_events.0024.desc: "Mein[rival_character.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', rival_character)] [rival_character.GetFirstName] ist wie stets ein ungeschickter Trampel und ein liederliches Schwein, wie wir als [ROOT.Char.Custom('GetCourt')] es gar nicht zu schätzen wissen. Allerdings hebt sich meine Stimmung durch einen Brief von [archbishop.GetTitledFirstName] aus [archdiocese.GetName].\n\n„[rival_character.GetFirstName|U] würde der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) sehr gut dienen“, schreibt [archbishop.Custom('DE_PRO_PER_S_3P_N')]. „Das Kloster würde [rival_character.Custom('DE_PRO_PER_S_3P_A')] freudig empfangen.“\n\nSehr rasch vergisst die Welt jene, die dort knien."
 pam_secular_faith_events.0024.a: "Und so erhält die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) ein weiteres Paar „willig“ dienender Hände!"
 pam_secular_faith_events.0024.b: "Ich würde [Select_CString(rival_character.IsFemale, 'meine Feindin', 'meinen Feind')] lieber im Blick behalten."
 pam_secular_faith_events.0025.t: "[Select_CString(ROOT.Char.IsFemale, 'Patin', 'Pate')]"
 pam_secular_faith_events.0025.desc: "„Ich wünsche, dem [ROOT.Char.GetFaith.GetAdjective|l]en Glauben beizutreten, im Körper und im Geist“, sagt mein[converting_char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', converting_char)] [converting_char.GetFirstName] feierlich. „Ich wünsche, getauft und [ROOT.Char.GetRite.GetAdherentName] zu werden … und ich bitte Euch, als [Select_CString(ROOT.Char.IsFemale, 'meine Patin', 'mein Pate')] an meiner Seite am Taufbecken zu stehen.“"
 pam_secular_faith_events.0025.a: "Dann lasst alle unsere neue Verbindung sehen!"
 pam_secular_faith_events.0025.b: "Der Glaube braucht kein großes Spektakel."
 pam_secular_faith_events.0025.c: "Ich kann diese Ehre nicht annehmen."
 pam_secular_faith_events.0026.t: "Eine gepeinigte Seele"
 pam_secular_faith_events.0026.desc: "Mein[afflicted.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', afflicted)] [afflicted.GetFirstName] war nie bei klarem Verstand … doch nun ist [afflicted.Custom('DE_PRO_PER_S_3P_N')] nicht einmal mehr [afflicted.Custom('DE_PRO_PER_S_3P_N')] selbst.\n\n„[ROOT.Char.GetFaith.EvilGodNames|U]! Die Macht des Bösen ([ROOT.Char.GetFaith.EvilGodNames]) ist in mir!“, kreischt [afflicted.Custom('DE_PRO_PER_S_3P_N')] zuckend auf dem Boden des Gotteshauses ([ROOT.Char.GetFaith.HouseOfWorship]).\n\nMein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] wird bleich. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], ich fürchte, [afflicted.Custom('DE_PRO_POS_S_3P')]e Seele wird von Dämonen gequält. Der einzige Weg, [afflicted.Custom('DE_PRO_PER_S_3P_D')] zu helfen, besteht darin, einen Exorzismus durchzuführen.“"
 pam_secular_faith_events.0026.a: "[afflicted.Custom('DE_PRO_PER_S_3P_N')|U] braucht angemessene Hilfe."
 pam_secular_faith_events.0026.b: "Ich führe den Exorzismus selbst durch."
 pam_secular_faith_events.0026.c: "Das ist heilige Arbeit. Ihr kümmert Euch darum."
 pam_secular_faith_events.0026.d: "Hinaus mit [afflicted.Custom('DE_PRO_PER_S_3P_D')], bevor sich die Panik ausbreitet!"
 pam_sf_exorcism_success_toast: "Der Exorzismus ist erfolgreich"
 pam_sf_exorcism_failed_toast: "Der Exorzismus scheitert"
 pam_secular_faith_events.0027.t: "Glaubenskrise"
 pam_secular_faith_events.0027.desc: "„Hörst du mich, höchste Macht ([ROOT.Char.GetFaith.HighGodName])?“, flüstere ich. Doch tief in mir weiß ich, dass niemand [Select_CString(ROOT.Char.IsFemale, 'Sünderinnen', 'Sündern')] wie mir zuhört.\n\nHabe ich den Willen der höchsten Macht falsch gedeutet? Ist der Glaubenssatz namens [old_tenet.GetName(ROOT.Char.GetRite)] nicht die wahre Form ihrer Weisheit?\n\nLicht fällt auf das Kruzifix, und Hoffnung erwacht in mir."
 pam_secular_faith_events.0027.a: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName|U]) verlangt einen neuen Grundsatz: [new_tenet.GetNameNoTooltip(ROOT.Char.GetRite)]!"
 pam_secular_faith_events.0027.b: "Vielleicht … [forbidden_tenet.GetNameNoTooltip(ROOT.Char.GetRite)]?"
 pam_secular_faith_events.0027.c: "Ich bin verloren. Und alle anderen werden es auch sein …"
 pam_secular_faith_events.0028.t: "Meine Seele in Frieden"
 pam_secular_faith_events.0028.desc: "Ich knie im Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) und die Gegenwart der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) dringt in jede Faser meines Leibes.\n\nDen Glaubenssatz namens [old_tenet.GetName(ROOT.Char.GetRite)] zu ehren, zeigte mir die Wahrheit. Niemals erlebte ich solch einen Frieden. Wie könnte ich eine solche Freude für mich behalten? Sollte ich nicht auch die anderen dasselbe Licht erleben lassen, um ihnen die Wahrheit zu zeigen?"
 pam_secular_faith_events.0028.a: "Ich werde auf offene Ohren stoßen."
 pam_secular_faith_events.0028.b: "Doch meine wahre Leidenschaft gilt dem Grunsatz namens [forbidden_tenet.GetNameNoTooltip(ROOT.Char.GetRite)]!"
 pam_secular_faith_events.0028.c: "Ich sollte meine Gefühle auf etwas Beständigerem ([ROOT.Char.Custom('GetWritingMaterial')]) bannen."
 pam_secular_faith_events.0029.t: "Ein Besuch aus dem Reich der Toten"
 pam_secular_faith_events.0029.desc: "„Wacht auf, [ROOT.Char.GetFirstNameNoTooltip]“, erklingt eine vertraute Stimme. „Ich bin hier, [departed.Custom2('RelationToMeShort', root_scope)] … in Eurer Zeit der Not.“\n\nIch erwache, meine Stirn ist schweißnass. Die Erscheinung flackert kurz auf, ehe sie verschwindet.\n\nWar das … [ROOT.Char.Custom2('RelationToMeShort', departed)]?"
 pam_secular_faith_events.0029.a: "[departed.Custom('DE_PRO_PER_S_3P_N')|U] ist sicher und wacht nun über mich."
 pam_secular_faith_events.0029.b: "War es … eine Warnung?"
 pam_secular_faith_events.0029.c: "Meine Sinne spielten mir einen Streich. Mehr nicht."
 pam_secular_faith_events.0030.t: "[Select_CString(would_be_anchorite.IsFemale, 'Die Einsiedlerin', 'Der Einsiedler')]"
 pam_secular_faith_events.0030.desc: "„Ich wünsche, näher an die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zu gelangen“, sagt mein[would_be_anchorite.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', would_be_anchorite)] [would_be_anchorite.GetFirstName] feierlich. „Die Welt steckt voller Ablenkungen, und ich verzehre mich nach völliger Abgeschiedenheit.“\n\n[would_be_anchorite.Custom('DE_PRO_PER_S_3P_N')|U] blickt auf die Mauern meiner Residenz ([ROOT.Char.Custom('ResidenceBuilding')]) und fährt sachte mit den Fingern darüber.\n\n„Das Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) von [church_scope.GetName] ist wunderschön. Ich möchte in seinen Mauern eingeschlossen werden und den Rest meines Lebens in ununterbrochenem Gebet verbringen.“"
 pam_secular_faith_events.0030.a: "Wenn dies Euer Wunsch ist, stehen Euch meine Steinmetze zur Verfügung."
 pam_secular_faith_events.0030.b: "Nein, das werde ich Euch nicht gewähren."
 pam_secular_faith_events.0031.t: "Ein Gelehrtenstreit"
 pam_secular_faith_events.0031.desc: "„Wie kann jemand die Heiligkeit des Glaubenssatzes namens [tenet_1.GetBaseName] anzweifeln?“, ruft mein[disputant_one.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', disputant_one)] [disputant_one.GetFirstName].\n\n„Unsinn! Es ist völlig klar, dass es der Glaubenssatz, den man [tenet_2.GetBaseName] nennt, derjenige ist, der Euch dem Göttlichen näherbringt! Habt Ihr denn nichts gelernt?“, erwidert mein[disputant_two.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', disputant_two)] [disputant_two.GetFirstName]."
 pam_secular_faith_events.0031.a: "Eine Gelehrtendebatte? Lasst mich Notizen machen …"
 pam_secular_faith_events.0031.b: "Ich bin zum Glaubenssatz namens [tenet_1.GetBaseNameNoTooltip] hingezogen."
 pam_secular_faith_events.0031.c: "Der Glaubenssatz namens [tenet_2.GetBaseNameNoTooltip] klingt wahr."
 pam_secular_faith_events.0031.d: "Wenn wir als [ROOT.Char.Custom('GetCourt')] lebhaft sind, sind wir als [ROOT.Char.Custom('GetCourt')] auch gebildet."
 pam_secular_faith_events.0032.t: "Die Stunde der Versuchung"
 pam_secular_faith_events.0032.desc_food: "Ich erwache, und mein Kissen ist feucht von Speichel. Aus der Küche kommt der Geruch von gerösteten Leckereien ([ROOT.Char.Custom('RegionalEdibleMeat')]) und mit Köstlichkeiten ([ROOT.Char.Custom('GetFoodDetail')]) gefüllten Spezialitäten ([ROOT.Char.Custom('GetRandomRegionalSmallGame')]), während das Klirren von Bechern voll mit flüssigem Glück ([ROOT.Char.Custom('RegionalDrink')]) und fröhliche Stimmen durch die Hallen ([ROOT.Char.Custom('ResidenceBuildingHallsType')]) dringen.\n\nAls [vice_trait.GetName(GetNullCharacter)] trugen mir die [ROOT.Char.GetFaith.PriestNeuterPlural] auf, ich solle fasten … doch warum sollte die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) mich ausgerechnet heute Abend so auf die Probe stellen?\n\nIch spüre, wie mein Entschluss schwindet, je lauter mir der Magen knurrt."
 pam_secular_faith_events.0032.a: "Mein Drang ist von der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) gerechtfertigt!"
 pam_secular_faith_events.0032.b: "Nein. Das Fasten dauert an, und so werde ich es halten."
 pam_secular_faith_events.0032.c: "Ein kleiner Bissen … Wer soll das schon erfahren?"
 pam_secular_faith_events.0033.t: "Kissenpredigten"
 pam_secular_faith_events.0033.desc: "Mein[believing_spouse.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', believing_spouse)] [believing_spouse.GetFirstName] hängt dem [believing_spouse.GetRite.GetName] an, dessen Lehren [believing_spouse.Custom('DE_PRO_PER_S_3P_N')] mir glücklich des Nachts zuflüstert.\n\n„Treuester Schatz, [believing_spouse.Custom2('RelationToMeShort', root_scope)], kanntet Ihr den Glaubenssatz namens [new_tenet.Custom('GetGenericTenetSentence')]? Ist das nicht #EMP faszinierend?#!“, fragt [believing_spouse.Custom('DE_PRO_PER_S_3P_N')] und umarmt mich.\n\n[believing_spouse.Custom('DE_PRO_POS_S_3P')|U]e Leidenschaft ist so liebreizend wie [believing_spouse.Custom('DE_PRO_POS_S_3P')] Lächeln."
 pam_secular_faith_events.0033.a: "Hm. Erzählt mir mehr …"
 pam_secular_faith_events.0033.b: "#EMP Ihr#! seid faszinierend! Kommt her."
 pam_secular_faith_events.0033.c: "Bitte, treuester Schatz, ich muss schlafen."
 pam_secular_faith_events.0034.t: "Das Findelkind"
 pam_secular_faith_events.0034.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] ist niemand, der üblicherweise zu spät zu kommt. Die Stille des Gotteshauses ([ROOT.Char.GetFaith.HouseOfWorship]) wird durch das leise Weinen eines Kindes durchbrochen.\n\n„Gnädige höchste Macht ([ROOT.Char.GetFaith.HighGodName]) …“, flüstert [chaplain.GetFirstNameNoTooltip] und wiegt das Kind sanft in [chaplain.Custom('DE_PRO_POS_S_3P')]en Armen. „Als [trait_scope.GetName(GetNullCharacter)] wurde es verlassen … Niemand verdient ein solches Schicksal.“\n\nDie kleinen Finger des Kindes umfassen [chaplain.Custom('DE_PRO_POS_S_3P')]en Daumen."
 pam_secular_faith_events.0034.a: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) schenkte mir [Select_CString(foundling.IsFemale, 'eine Tochter', 'einen Sohn')]."
 pam_secular_faith_events.0034.b: "[archdiocese.GetNameNoTooltip] wird [foundling.Custom('DE_PRO_PER_S_3P_A')] nehmen."
 pam_secular_faith_events.0034.c: "[chaplain.GetFirstNameNoTooltip|U] wird das Kind aufziehen."
 pam_secular_faith_events.0034.d: "Es kümmert mich nicht, was mit dem Kind geschieht."
 pam_secular_faith_events.0035.t: "Die Kasteiung"
 pam_secular_faith_events.0035.desc: "Da ist Blut auf dem Boden. Als ich dem Klang von Peitschenhieben folge, wartet mein[sufferer.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', sufferer)] [sufferer.GetFirstName] auf mich. Eine rote Geißel liegt in [sufferer.Custom('DE_PRO_POS_S_3P')]en Händen, und Tränen strömen [sufferer.Custom('DE_PRO_POS_S_3P')]e Wangen hinunter.\n\n„Mein [sinful_trait.GetName(GetNullCharacter)|l]es Verlangen droht, mich zu verschlingen“, schluchzt [sufferer.Custom('DE_PRO_PER_S_3P_N')]. „Das Brennen der Peitsche ist allemal besser als das Feuer der Versuchung.\n\nDieser Schmerz endet. Die Strafe im Jenseits ([ROOT.Char.GetFaith.NegativeAfterLife]) tut dies nicht.“"
 pam_secular_faith_events.0035.a: "Faszinierend … Gebt mir die Geißel."
 pam_secular_faith_events.0035.b: "Lasst [sufferer.Custom('DE_PRO_PER_S_3P_A')] sich kasteien."
 pam_secular_faith_events.0035.c: "Um der guten Mächte ([ROOT.Char.GetFaith.HighGodName]) willen! Haltet ein mit diesem Irrsinn."
 pam_sf_scourge_abandoned_toast: "Die aufgegebene Geißel"
 pam_secular_faith_events.0036.t: "Weisheit [Select_CString(hermit.IsFemale, 'der Einsiedlerin', 'des Einsiedlers')]"
 pam_secular_faith_events.0036.desc: "[Select_CString(hermit.IsFemale, 'Eine zerlumpte Frau', 'Ein zerlumpter Mann')] ersucht eine Audienz und behauptet, [Select_CString(hermit.IsFemale, 'eine Einsiedlerin', 'ein Einsiedler')] aus den fernen Landen von [hermit_location.GetName] zu sein.\n\n„Seit sieben Nächten verwehrt mir die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) den Schlaf“, sagt [hermit.Custom('DE_PRO_PER_S_3P_N')] ernst. „Nicht, um mich zu bestrafen, sondern nur, um meine Gedanken mit Wahrheiten zu füllen, die für andere bestimmt sind. Für Euch.\n\nHört meine Worte und nehmt sie Euch zu Herzen. Danach werde ich in meine Einsamkeit zurückkehren.“"
 pam_secular_faith_events.0036.a: "Welche Geheimnisse könnt Ihr übermitteln?"
 pam_secular_faith_events.0036.b: "Ich bin gewillt, etwas zu lernen."
 pam_secular_faith_events.0036.c: "Hinfort mit Euch, [Select_CString(hermit.IsFemale, 'Bettlerin', 'Bettler')]."
 pam_secular_faith_events.0037.t: "Fleischliche Offenbarung"
 pam_secular_faith_events.0037.desc_wanderer: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] fließt noch zu später Stunde, und [Select_CString(reveler.IsFemale, 'eine durchreisende Wanderin', 'ein durchreisender Wanderer')], [reveler.GetFirstName] mit Namen, lehnt sich zu mir herüber."
 pam_secular_faith_events.0037.desc_normal: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] fließt noch zu später Stunde, und mein[reveler.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', reveler)] [reveler.GetFirstName] lehnt sich zu mir herüber."
 pam_secular_faith_events.0037.desc: "Bald schon fesselt nichts mehr meine Aufmerksamkeit außer dem höchsten Ausdruck [reveler.Custom('DE_PRO_POS_S_3P')]er Schönheit ([reveler.Custom('ObjectifiedFeature')]).\n\n„Es gibt Gebete, die man mit der Zunge spricht“, sagt [reveler.Custom('DE_PRO_PER_S_3P_N')] und entledigt sich langsam [reveler.Custom('DE_PRO_POS_S_3P')]es Gewands ([reveler.Custom('GetClothingArticle')]). „Und es gibt Gebete, die man mit dem Fleisch spricht. Lasst mich Euch die leibliche Kunst namens [reveler.Custom('pam_sf_carnal_art')] zeigen, [ROOT.Char.Custom('RaunchyComplimentNoun')].“\n\n[reveler.Custom('DE_PRO_PER_S_3P_N')|U] bietet mir die Hand. „Die Ekstase, die Ihr erfahren werdet, ähnelt der, wie sie uns an einem Ort jenseits des Todes ([ROOT.Char.GetFaith.PositiveAfterLife]) verheißen wird.“"
 pam_secular_faith_events.0037.a: "Zeigt mir das. Verriegelt die Tür hinter Euch."
 pam_secular_faith_events.0037.b: "Bedeckt Euch, [reveler.GetWomanMan]."
 # Geography-neutral (see pam_sf_carnal_art / pam_sf_carnal_art_indian_setting_trigger)
 pam_sf_carnal_art_1: "die sich windende Schlange"
 pam_sf_carnal_art_2: "der emporsteigende Fluss"
 pam_sf_carnal_art_3: "die gewundenen Ranken"
 pam_sf_carnal_art_4: "die innige Umarmung"
 # Kama Sutra / Indic - India-gated
 pam_sf_carnal_art_5: "das Spalten des Bambus"
 pam_sf_carnal_art_6: "die List der Stute"
 pam_sf_carnal_art_7: "der sich entfaltende Lotus"
 pam_sf_carnal_art_8: "die Gattin von Idra"
 pam_sf_carnal_art_9: "die aufgerichtete Kobra"
 # Courtly / troubadour - kept out of an Indian setting
 pam_sf_carnal_art_10: "der Liebesknoten"
 pam_sf_carnal_art_11: "die Rose und der Dorn"
 pam_sf_carnal_art_12: "das Geheimnis des Troubadours"
 pam_sf_carnal_art_13: "die behütete Flamme"
 pam_secular_faith_events.0038.t: "Ein Vorgeschmack auf das Paradies"
 pam_secular_faith_events.0038.desc: "Mein[reveler.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', reveler)] [reveler.GetFirstName] füllt einen weiteren Teller mit Köstlichkeiten ([ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_plural')]) und grinst mich vom anderen Ende der Tafel aus an.\n\n„Ihr jagt nach der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) mit einem knurrenden Magen und einem leeren Becher. Ich finde sie in reifen Früchten, zartem Fleisch, Gelächter und Gesang“, sagt [reveler.Custom('DE_PRO_PER_S_3P_N')] und hebt einen randvollen Kelch.\n\n„Die Geschenke der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) sind dafür gedacht, genossen zu werden, [ROOT.Char.Custom('FormOfAddressForLiege')]. Vergeuden, was uns gegeben wurde? Nun, das ist eine grauenhafte Sünde!“"
 pam_secular_faith_events.0038.a: "Vielleicht steckt die Heiligkeit ja wirklich im Becher …"
 pam_secular_faith_events.0038.b: "Dann sollte ich ein Festmahl in ihrem Namen auftischen."
 pam_secular_faith_events.0038.c: "Dekadenz verkleidet als Hingabe. Nein."
 pam_secular_faith_events.0039.t: "Ein Gebet in der Dunkelheit"
 pam_secular_faith_events.0039.desc: "Mein[spymaster_scope.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', spymaster_scope)] [spymaster_scope.GetFirstName] kommt zu mir, noch immer beunruhigt von den Früchten [spymaster_scope.Custom('DE_PRO_POS_S_3P')]er List.\n\n„Ich kniete neben [secret_keeper.GetTitledFirstName] zum Gebet, [ROOT.Char.Custom('FormOfAddressForLiege')], und ich log – eine kleine, fromme Unwahrheit, geflüstert, um [secret_keeper.Custom('DE_PRO_POS_S_3P')]e Zunge zu lockern.\n\n[secret_keeper.Custom('DE_PRO_PER_S_3P_N')|U] gestand, im Haus der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) etwas Verbotenes ([secret_keeper.Custom('GetSecretCrimeConfessionIndef')]) getan zu haben“, sagt [spymaster_scope.Custom('DE_PRO_PER_S_3P_N')] und senkt die Stimme. „Ich sprach über [GetTenetType('tenet_sacred_shadows').GetName(GetPlayer.GetRite)|l] … Vielleicht ist diese Täuschung eine Pflicht, die wir der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) schuldig sind?“"
 pam_secular_faith_events.0039.a: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) arbeitet im Verborgenen."
 pam_secular_faith_events.0039.b: "Eine bedauernswerte List … Verratet mir einfach das Geheimnis."
 pam_secular_faith_events.0040.t: "Fleisch der Gläubigen"
 pam_secular_faith_events.0040.desc: "Während des Abendessens öffnet mein[scholar.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', scholar)] [scholar.GetFirstName] einen zerlesenen Folianten. Ein weiterer Vortrag beginnt.\n\n„Die [Glossary('Issedonen', 'ISSEDONES_GLOSS')] begruben ihre Toten nicht, [ROOT.Char.Custom('FormOfAddressForLiege')]. Sie machten ein Festmahl aus ihnen!“, sagt [scholar.Custom('DE_PRO_PER_S_3P_N')] und holt kaum Luft. „Das Fleisch eines Vaters mit Hammel gemischt, sein Schädel geschmückt und verehrt als eine heilige Reliquie. Für sie war dies die wahrste Liebe, die ein Kind erweisen konnte.\n\nUnd das Beste?“, sagt [scholar.Custom('DE_PRO_PER_S_3P_N')] grinsend. „Herodot höchstpersönlich sah sie weder als böse noch als verrückt an. #EMP ‚Die Gewohnheit‘,#! sagte er, #EMP ‚ist Herrin über alles.‘#!“"
 pam_secular_faith_events.0040.a: "Oh, ich weiß alles darüber."
 pam_secular_faith_events.0040.b: "Ein düsterer Brauch … Erzählt mir mehr davon."
 pam_secular_faith_events.0040.c: "Bei den höchsten Mächten ([ROOT.Char.GetFaith.HighGodName]), [scholar.GetWomanMan]. Ich versuche, hier zu essen!"
 # Real historical grounding - Herodotus' Histories on the Issedones (funerary endocannibalism, gilded ancestor-skulls) and the Callatiae. https://en.wikipedia.org/wiki/Issedones
 ISSEDONES_GLOSS: "Der griechische Historiker Herodot beschrieb ein Volk der fernen nördlichen Steppe. Wenn der Vater eines Mannes starb, so schlachteten seine Verwandten Vieh und vermischten das Fleisch mit dem Fleisch des Toten, um es dann in einem feierlichen Begräbnisfestmahl zu verspeisen. Der Schädel wurde von Fleisch befreit, gereinigt und geschmückt und als eine heilige Reliquie aufbewahrt, die man mit einem jährlichen Opfer ehrte. Herodot stellte solche Riten neben die griechische Einäscherung – nicht um sie zu verdammen, sondern um zu zeigen, dass ‚die Gewohnheit Herrin über alles ist`und dass jedes Volk seine eigenen Bräuche für die rechtschaffensten hält."
 pam_secular_faith_events.0041.t: "Die nackte Wahrheit"
 pam_secular_faith_events.0041.desc: "Als ich durch meine Gärten spaziere, erblicke ich einen Fremdling zwischen den Blumenbeeten ([ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type')]), der Früchte von meinen Bäumen ([ROOT.Char.GetCapitalLocation.Custom('get_region_fruit_tree_type')]) pflückt – nackt wie zum Zeitpunkt seiner Geburt und die einzige Gewandung, die dieser Mensch trägt, sind die herabfallenden Blätter.\n\n„Oh, [ROOT.Char.GetTitleAsName]! Warum versteckt Ihr Euch hinter Kleidung und Krone?“, fragt [adamite.Custom('DE_PRO_PER_S_3P_N')] ganz schamlos vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und mir. „Ich gebe mich ganz der ersten Unschuld hin, als wir noch nackt und mutig lebten.“\n\n[adamite.Custom('DE_PRO_PER_S_3P_N')|U] beißt in eine weitere Frucht, und Saft läuft [adamite.Custom('DE_PRO_PER_S_3P_D')] die Haut hinunter. „Vielleicht solltet Ihr dies auch tun.“"
 pam_secular_faith_events.0041.a: "Ich sehne mich auch nach dieser Freiheit."
 pam_secular_faith_events.0041.b: "Esst meine Früchte, erzählt Eure Geschichte und dann geht."
 pam_secular_faith_events.0041.c: "Sperrt den Eindringling ein."
 pam_secular_faith_events.0042.t: "Ein leichter Weg"
 pam_secular_faith_events.0042.desc: "Mein[sponsor_character.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', sponsor_character)] [sponsor_character.GetFirstName] trifft mich im Garten mit einer geöffneten Geldbörse und einem warmen Lächeln.\n\n„Lasst mich die Kosten Eurer [GetActivityType('activity_pilgrimage').GetName] übernehmen, [ROOT.Char.Custom('FormOfAddressForLiege')]. Der Pilgerweg ist kein Ort, an dem man sein Geld zusammenhalten sollte – wandert frei davon und betet für uns beide.“\n\nDas Geld ist echt. Ebenso wie das Vertrauen dahinter."
 pam_secular_faith_events.0042.a: "Ich wandere den Weg mit Dankbarkeit im Herzen."
 pam_secular_faith_events.0042.b: "Ich werde das Geld nehmen und es behalten."
 pam_secular_faith_events.0042.c: "Behaltet Euer Geld, [Select_CString(sponsor_character.IsFemale, 'meine Freundin', 'mein Freund')]."
 pam_sf_pilgrimage_sponsor_tt: "Wenn Ihr innerhalb von #V 7#! Jahren eine [GetActivityType('activity_pilgrimage').GetName] beendet, wird [sponsor_character.GetFirstName] #P 50#! Meinung von Euch erhalten"
 pam_sf_pilgrimage_sponsor_toast: "[Select_CString(sponsor_character.IsFemale, 'Eine erfreute Gönnerin', 'Ein erfreuter Gönner')]"
 pam_secular_faith_events.0043.t: "Ein Pilgergruß"
 pam_secular_faith_events.0043.desc: "Mein[holy_man.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', holy_man)] [holy_man.GetFirstName] ergreift meine Hand vor dem Altar.\n\n„Beschreitet den Pilgerweg, [ROOT.Char.Custom('FormOfAddressForLiege')]. Sobald Ihr zurückkehrt, werde ich Eure [GetActivityType('activity_pilgrimage').GetName] auf jedem Platz von [capital_county.GetNameNoTier] verkünden. Eure Leute werden wissen, dass Ihr als [ROOT.Char.GetTitleAsNameNoTooltip] für sie niederknietet.“"
 pam_secular_faith_events.0043.a: "Dann werde ich auf den Pilgerweg gehen."
 pam_secular_faith_events.0043.b: "Ich habe weltlichere Dinge, um die ich mich kümmern muss."
 pam_sf_extolled_pilgrimage_toast: "Die Leute frohlocken"
 pam_secular_faith_events.0044.t: "Das Ohr des Klerus"
 pam_secular_faith_events.0044.desc: "Mein[friendly_bishop.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', friendly_bishop)] [friendly_bishop.GetFirstName] kommt erstaunlich gut gelaunt bei mir an.\n\n„Ich gewann in letzter Zeit die Gunst meiner Standesgenossen: Bischöfe, Äbte, die Stimmen, die Einfluss in der Kirche haben. Wenn Ihr deren fromme Weisheit einmal benötigt oder ihre moralische Autorität, kann ich für Euch sprechen.“\n\nDie Gunst, die machthungrige [ROOT.Char.GetFaith.PriestNeuterPlural] [friendly_bishop.GetFirstNameNoTooltip] erweisen, ist leicht ausgegeben."
 pam_secular_faith_events.0044.a: "Dann sprecht in meinem Namen."
 pam_secular_faith_events.0044.b: "Eure Freundschaft ist Segen genug."
 pam_secular_faith_events.0045.t: "Epiphanie"
 pam_secular_faith_events.0045.desc: "Sie schlägt ein wie der Blitz aus heiterem Himmel – die Klarheit.\n\nDoktrin. Grundsätze. Riten. Glaube. Was einst wie Tausende von verstreuten Gedanken wirkte, formt sich nun vor mir zu einer einzigen Wahrheit."
 pam_secular_faith_events.0045.a: "Die Zukunft ruft mich, eine Führungsrolle einzunehmen."
 pam_secular_faith_events.0045.b: "Ich werde diesen Augenblick genießen."
 pam_secular_faith_events.0046.t: "Geteilte Überzeugung"
 pam_secular_faith_events.0046.desc: "Mein[intimate.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', intimate)] [intimate.GetFirstName] kann [intimate.Custom('DE_PRO_POS_S_3P')]e Überzeugung nicht verbergen, während [intimate.Custom('DE_PRO_PER_S_3P_N')] von einem gemeinsamen Grundsatz namens [shared_tenet.GetName(intimate.GetRite)] spricht.\n\n„Es gibt allem, was ich tue, Bedeutung“, sagt [intimate.Custom('DE_PRO_PER_S_3P_N')]. „Nur eine Sache bedeutet mir ebenso viel … Ihr als mein besonderer Mensch, [intimate.Custom2('RelationToMe', SCOPE.sC('root_scope'))].“\n\nEine einzelne Träne rinnt [intimate.Custom('DE_PRO_PER_S_3P_D')] über die Wange. „Ich wollte Euch dies lediglich wissen lassen.“"
 pam_secular_faith_events.0046.a: "Lasst die gemeinsame Überzeugung unsere Verbindung vertiefen!"
 pam_secular_faith_events.0046.b: "Diese Überzeugung zu teilen … ist wie Liebe."
 pam_secular_faith_events.0046.c: "Danke für die Offenheit."
 pam_secular_faith_events.0047.t: "Geistliche Hingabe"
 pam_secular_faith_events.0047.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] schlägt ein Kreuz und beugt den Kopf.\n\n„Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) setzte die Krone aus einem bestimmten Grund auf Euer Haupt. Indem ich Euch treu diene, diene ich ihrem Willen“, erklärt [chaplain.Custom('DE_PRO_PER_S_3P_N')].\n\n„Ich schwor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) die Treue. Nun würde ich sie auch Euch schwören.“"
 pam_secular_faith_events.0047.a: "Dann dient mir vollständig."
 pam_secular_faith_events.0047.b: "Ihr müsst stets der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) zuerst dienen."
 pam_secular_faith_events.0048.t: "Dämonische Träume"
 pam_secular_faith_events.0048.desc: "Ich erwache, aber kann mich nicht bewegen.\n\nEine verzerrte Gestalt tanzt vor mir und kichert böse. Ein Dämon? Furcht erfüllt mich. „He … He … Eure Sünden wiegen schwer. Bald schon soll das Böse ([ROOT.Char.GetFaith.EvilGodNames]) Euch haben!“\n\nOb Traum oder Dämon: Ich kann einfach nicht abtun, was ich sah. Ich muss mit der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) Frieden schließen."
 pam_secular_faith_events.0048.a: "Dieser Traum … Er muss etwas bedeuten."
 pam_secular_faith_events.0048.b: "Nur ein Traum. Ich schlafe weiter."
 pam_secular_faith_events.0048.c: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) stehe mir bei! Ich muss Buße tun."
 pam_sf_demon_torment_modifier_tt: "Um den Modifikator loszuwerden, müsst Ihr ein [GetBuilding('temple_01').GetName]-[holding|E] errichten oder auf eine [GetActivityType('activity_pilgrimage').GetName] gehen"
 pam_sf_demon_torment_lifted_toast: "Die Qual lässt nach"
 pam_secular_faith_events.0049.t: "„Himmlische Hierarchie“"
 pam_secular_faith_events.0049.desc: "Die Geräusche, die aus meiner Kapelle dringen, gehören nicht zu einem Gebet.\n\n„Ja, #emp JA#!, Euer Gnaden! Zeigt [Select_CString(lustful_priest.IsFemale, 'dieser erbärmlichen Sünderin', 'diesem erbärmlichen Sünder')] [lustful_priest.Custom('DE_PRO_POS_S_3P')]en wahren Platz, was die [GetTenetType('tenet_celestial_hierarchy').GetName(GetNullCharacter.GetRite)] angeht!“, ruft mein[lustful_priest.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', lustful_priest)] [lustful_priest.GetFirstName] ekstatisch. „Ich bin ein Wurm, der sich im Dreck wälzt, voll irdischer Gelüste. #emp BESTRAFT MICH!#!“\n\nIm Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])! Was geschieht da in meiner Kapelle?"
 pam_secular_faith_events.0049.a: "Muss ein Ritual sein. Ich sollte … Notizen machen."
 pam_secular_faith_events.0049.b: "Wenn es in #EMP meiner#! Kapelle ist, dann werde #emp ich#! auch dabei sein!"
 pam_secular_faith_events.0049.c: "[lustful_priest.GetFirstNameNoTooltip|U] ist pervers?! Widerlich, aber nützlich."
 pam_secular_faith_events.0050.t: "#L [chaplain.Custom('RomanticComplimentAdjective')|U]er#! [chaplain.GetCouncilTitle]"
 pam_secular_faith_events.0050.desc: "Die flackernden Kerzen im Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) können mich kaum von den unreinen Gedanken ablenken, die meinen Geist beherrschen.\n\n„Folgt mir zum Beichtstuhl, [ROOT.Char.Custom('FormOfAddressForLiege')]“, flüstert mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)]. Mein Blick ruht auf [chaplain.Custom('DE_PRO_PER_S_3P_D')]. „Was auch immer Eure Seele quält: Sprecht ohne Furcht.“\n\nWas wir als [GetTenetType('tenet_confession')GetName(GetPlayer.GetRite)] kennen, ist heilig … doch eine Sünde wiegt schwerer als alle anderen: meine Gedanken über [chaplain.GetFirstName]."
 pam_secular_faith_events.0050.a: "… Gibt es in Eurem Beichtstuhl Platz für zwei?"
 pam_secular_faith_events.0050.b: "Vergebt mir, [chaplain.GetMotherFather], denn ich habe unreine Gedanken."
 pam_secular_faith_events.0051.t: "Der Herr, euer Gott"
 pam_secular_faith_events.0051.desc: "#EMP „Ich bin der Herr, Euer Gott“#!, erklingt eine dröhnende Stimme im Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]). #EMP „Beugt Euer Haupt vor mir.“#!\n\nIch falle auf die Knie, meine Sicht verschwimmt. Ich wische mir Blut aus dem Gesicht.\n\n#EMP „Ich, der Herr, Euer Gott, befehle Euch: Gehorcht mir mit Eurem ganzen Herzen und Eurer ganzen Seele.“#! Eine Stimme wird zu hunderten. Hunderte werden zu tausenden. #EMP „Folgt Ihr nicht, so werde ich Euch verfluchen, bis Ihr vernichtet seid, denn Ihr habt mich verlassen, den Herrn, Euren Gott.“#!"
 pam_secular_faith_events.0051.a: "Ich werde … gehorchen …"
 pam_sf_lord_your_god_effect_tt: "@alert_icon!#alert_trial Etwas Schreckliches oder Wunderschönes wird geschehen …#!"
 pam_sf_lord_your_god_tt: "Bitte, höchste Macht ([ROOT.Char.GetFaith.HighGodName]) … Habt Gnade."
 pam_sf_voice_of_jesus_toast: "Stimme Jesu"
 pam_sf_stroke_of_god_toast: "Eine Fügung Gottes"
 pam_secular_faith_events.0052.t: "Nachdem Ihr fort seid"
 pam_secular_faith_events.0052.desc: "Im Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) von [resting_church.GetNameNoTier] bleibt mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] vor den abgetretenen Grabplatten derer stehen, die vor mir herrschten.\n\n„Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) schenkte Euch mehr Winter als den meisten, [ROOT.Char.Custom('FormOfAddressForLiege')]. Es ist keine Sünde, darüber zu entscheiden, wie Ihr ruhen wollt.\n\nEuer vornehmes Antlitz in Stein gemeißelt oder in der [Glossary('schlichten Kutte', 'AD_SUCCURRENDUM_GLOSS')] eines Mönchs – die Wahl ist die Eure.“"
 pam_secular_faith_events.0052.a: "Meißelt mein Antlitz in Stein … aber jünger und besser aussehend."
 pam_secular_faith_events.0052.b: "Die schlichte Kutte ist ausreichend."
 pam_secular_faith_events.0052.c: "Das Grab ist geduldig."
 pam_sf_effigy_planned_tt: "Wenn eine [GetActivityType('activity_funeral').GetName] nach Eurem Tod für Euch abgehalten wird, erhält der Gastgeber [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E]"
 pam_sf_cowl_burial_planned_tt: "Wenn eine [GetActivityType( 'activity_funeral').GetName] nach Eurem Tod für Euch abgehalten wird, erhält der Gastgeber [piety_i]#P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! [piety|E]"
 pam_sf_effigy_unveiled_toast: "Das enthüllte Abbild"
 pam_sf_cowl_burial_toast: "In der Kutte zur Ruhe gebettet"
 # Deathbed monastic conversion (ad succurrendum) - https://en.wikipedia.org/wiki/Ad_succurrendum
 AD_SUCCURRENDUM_GLOSS: "#G Ad succurrendum#! sterben – auf dem Sterbebett das Mönchsgelübde ablegen und die Mönchskutte anlegen – war ein letztes Mittel großer Herrscher im gesamten mittelalterlichen Christentum. In der schlichten Kutte begraben zu werden und nicht in feiner Seide, bedeutete, dass der sterbende Herrscher hoffte, vor dem jüngsten Gericht zwischen den demütigen Brüdern erscheinen zu können und nicht unter den Mächtigen."
 pam_secular_faith_events.0053.t: "Der Heilige zieht aus"
 pam_secular_faith_events.0053.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] hebt den Deckel eines Reliquiars mit der Sorgfalt einer Hebamme an. In ihm liegt der Schatz meines Hauses ([procession_relic.GetName]).\n\n„Heiligkeit unter Verschluss zu behalten, hilft niemandem, [ROOT.Char.Custom('FormOfAddressForLiege')]“, sagt [chaplain.Custom('DE_PRO_PER_S_3P_N')]. „Gewährt Euren Leuten eine [Glossary('Ostension', 'OSTENSION_GLOSS')]: Lasst die Reliquie gesehen werden und jede Straße zwischen hier und den Toren segnen.“"
 pam_secular_faith_events.0053.a: "Ich werde das Reliquiar selbst tragen."
 pam_secular_faith_events.0053.b: "Ich werde diese Vigil allein abhalten."
 pam_secular_faith_events.0053.c: "Ich wage es nicht, sie zu bewegen."
 pam_sf_procession_gamble_tt: "Die Straßen sind keine Gruft. Das Artefakt könnte zu Schaden kommen …"
 pam_sf_relic_jostled_toast: "Angerempelt in der Menge"
 # Solemn showing and procession of relics (ostensio) - https://en.wikipedia.org/wiki/Translation_(relic)
 OSTENSION_GLOSS: "Die feierliche Zurschaustellung einer Reliquie eines Heiligen. An hohen Feiertagen wurden Reliquien aus ihren Behältnissen herausgenommen und in einer Prozession durch die Straßen und über die Felder getragen, sodass ein an einen einzigen Altar gebundener Segen jede Seele auf dem Weg berühren konnte. Eine Reliquie, die man zeigte, zog Menschenmengen, Geld und Bekanntheit an, wohin auch immer man sie trug."
 pam_secular_faith_events.0054.t: "Das Becken und das Tuch"
 pam_secular_faith_events.0054.desc: "Das Becken dampft zu meinen Füßen, und wir alle als ([ROOT.Char.Custom('GetCourt')]) haben uns als Zuschauerschaft versammelt. Auf einem Hocker neben mir sitzt [pauper.Custom2('dummy_peasant_profession', pauper)], sichtlich nervös und mit nackten, dreckverkrusteten Füßen. Der Geruch ist ... ausgeprägt.\n\nIn genau dieser Nacht kniete sich der Erlöser selbst mit einem Becken und einem Tuch nieder. Das ([Glossary('Mandatum', 'MANDATUM_GLOSS')]) ist vorbereitet, das Wasser warm und alle Blicke im Saal ruhen auf mir.\n\nAlles, was bleibt, ist, selbst niederzuknien – oder es sich anders zu überlegen."
 pam_secular_faith_events.0054.deviant: "#EMP Ich werde diese appetitlichen Füße mit meiner Zunge säubern.#!"
 pam_secular_faith_events.0054.a: "Kniet und nehmt das Tuch."
 pam_secular_faith_events.0054.b: "Kniet und küsst diese müden Füße."
 pam_secular_faith_events.0054.c: "Ich…… kann nicht. Schafft das Becken weg."
 pam_sf_odorous_feet_tt: "Die Heiligkeit möge über mich kommen, während ich niederknie … oder der Geruch der Bauernfüße wird mich nie wieder verlassen"
 pam_sf_odorous_feet_toast: "Der Gestank bleibt"
 # Maundy foot-washing (pedilavium / Royal Maundy) - https://en.wikipedia.org/wiki/Maundy_(foot_washing)
 MANDATUM_GLOSS: "Der Ritus der Fußwaschung wurde nach den Worten Christi während des letzten Abendmahls benannt: #G „Mandatum novum do vobis#! – ich gebe Euch ein neues Gebot.“ Jedes Jahr am Gründonnerstag knieten die Kaiser in Konstantinopel und die Könige im ganzen Westen mit einem Becken und einem Tuch vor ausgewählten Armen, wuschen deren Füße und drückten ihnen Silber in die Hände – für einen Abend beugte sich das mächstigste Haupt in der Halle am tiefsten."
 pam_secular_faith_events.0055.t: "Die bronzene Stimme"
 pam_secular_faith_events.0055.desc: "Die alte Glocke von [bell_church.GetName] zersprang und wurde daher neu gegossen. Heute hängt sie glänzend im Glockenturm. Unter ihr steht mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] mit Wasser, heiligem Öl und Salz.\n\n„Eine Glocke muss [Glossary('getauft', 'BELL_BAPTISM_GLOSS')] werden, bevor sie für die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) spricht“, beharrt [chaplain.Custom('DE_PRO_PER_S_3P_N')], die Ärmel bereits hochgekrempelt. „Gewaschen, gesalbt und benamt – und danach vermag weder Feind noch Sturm ihre Stimme zum Verstummen bringen.“"
 pam_secular_faith_events.0055.a: "Dann lasst sie uns waschen, salben und benamen."
 pam_secular_faith_events.0055.b: "Es ist Bronze und keine Seele – die Kapitularien sagen dasselbe."
 pam_secular_faith_events.0055.c: "Ein kurzer Segen ist ausreichend. Lasst sie läuten."
 # Baptism of bells; storm-dispelling bell lore - https://en.wikipedia.org/wiki/Baptism_of_bells
 BELL_BAPTISM_GLOSS: "Kirchenglocken wurden genauso gesegnet, wie man es Christenmenschen tat: Man wusch sie mit heiligem Wasser, salbte sie mit Öl und gab ihnen den Namen eines Heiligen – einige waren sogar Paten für Glocken. Die #G Admonitio Generalis#! Karls des Großen verbot 789 das Taufen von Glocken, doch der Brauch hielt sich dessen ungeachtet viele Jahrhunderte. Man glaubte, eine getaufte Glocke könne Stürme, Hagel und Dämonen vertreiben, so weit ihr Klang zu hören war. Spätere Gießer gossen in ihre Glocken das Motto #G Fulgura frango#!: „Ich breche die Blitze.“"
 pam_secular_faith_events.0056.t: "Ein Spatz im Saal"
 pam_secular_faith_events.0056.desc: "Ein Spatz flitzt aus der Dunkelheit des Winters herein, fliegt über die ganze Länge der Halle ([ROOT.Char.Custom('ResidenceBuildingHallType')]) durch Rauch und Gelächter hindurch und wieder durch das Fenster ([ROOT.Char.Custom('ResidenceBuildingWindowType')]) hinaus.\n\nWir als [ROOT.Char.Custom('GetCourt')] lachen schallend. Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] allerdings nicht.\n\n„[Glossary('So ist das Leben des Menschen', 'BEDE_SPARROW_GLOSS')], [ROOT.Char.Custom('FormOfAddressForLiege')] – ein Augenblick im Licht und in der Wärme, aus der einen Dunkelheit hinaus und hinein in die nächste. Was davor und danach kommt, weiß allein die höchste Macht ([ROOT.Char.GetFaith.HighGodName]).“"
 pam_secular_faith_events.0056.scholar: "Beda schrieb dasselbe, fast Wort für Wort."
 pam_secular_faith_events.0056.a: "Dann lasst uns den Augenblick im Licht gut nutzen."
 pam_secular_faith_events.0056.b: "Es war ein Vogel. Mehr Wein."
 # Bede's sparrow simile, from the conversion of King Edwin of Northumbria - https://en.wikipedia.org/wiki/Edwin_of_Northumbria
 BEDE_SPARROW_GLOSS: "In Bedas Erzählung vergleicht ein Berater von König Edwin von Northumbrien das Leben des Menschen mit dem eines Spatzen, der in einer Winternacht durch eine warme Festhalle fliegt: einen kurzen Augenblick durch Licht und Geborgenheit hindurch, aus dem Sturm hinaus und dann wieder in ihn zurück, wobei alles davor und danach unbekannt bleibt. Wenn der neue Glaube etwas dazu sagen könne, was hinter der Halle liegt, so argumentierte er, dann verdiene er es, dass man ihm folge – und Edwin war überzeugt."
 pam_secular_faith_events.0057.t: "Das Kirchenbier"
 pam_secular_faith_events.0057.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] steht im Kirchhof ([ale_church.GetName]) zwischen Tischen, an denen die halbe Gemeinde sitzt, und Fässern, die frisch aus der [GetBuilding('breweries_01').GetName] herübergerollt werden, und hat bereits einen randvollen Humpen in der Hand.\n\n„Durch das Dach dringt Regen, [ROOT.Char.Custom('FormOfAddressForLiege')], und der Zehnt reicht nicht aus. Daher brauen die Brüder das [Glossary('Kirchenbier', 'CHURCH_ALE_GLOSS')]. Wir verkaufen es und die Gemeinde trinkt es, bis das Dach vollständig bezahlt wurde.\n\nJeder Humpen ist eine gute Tat. Nehmt Ihr einen?“"
 pam_secular_faith_events.0057.a: "Dann reicht mir einen Becher. Für das Dach."
 pam_secular_faith_events.0057.b: "Hebt das Bier auf – ich werde selbst für das Dach zahlen."
 pam_secular_faith_events.0057.c: "Trinken? Auf heiligem Boden? Kippt das weg."
 pam_sf_church_ale_gamble_tt: "Jeder Becher ist für das Dach und die Gemeinde braut stark …"
 pam_sf_church_ale_toast: "Ein schwerer Kopf am Morgen"
 # Church ales / scot-ales - parish fundraising feasts, condemned by synods and merrily continued - https://en.wikipedia.org/wiki/Church_ale
 CHURCH_ALE_GLOSS: "Ein Gemeindefest, auf dem man Bier, das aus gespendetem Malz gebraut worden war, im Kirchhof verkaufte und die Einnahmen für den Unterhalt der Kirche verwendete: ein abgedichtetes Dach, eine neue Glocke, Brot für die Armen. Synode um Synode verurteilte das Trinken auf heiligem Boden, und Gemeinde für Gemeinde behielt das Brauen bei. Für so manch eine Dorfkirche zahlte das Bier mehr, als der Zehnt es jemals vermochte."
 pam_secular_faith_events.0058.t: "Quid Mus Sumit?"
 pam_secular_faith_events.0058.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] stürzt herein, blass wie ein Altartuch, und hält eine kleine silberne [Glossary('Pyxis', 'PYX_GLOSS')] so, als brenne sie in [chaplain.Custom('DE_PRO_POS_S_3P')]en Händen.\n\n„Eine Maus, [ROOT.Char.Custom('FormOfAddressForLiege')]. Sie gelangte heute Nacht in die Kiste und fraß die [Glossary('Hostien', 'RESERVED_HOST_GLOSS')]!\n\n[chaplain.Custom('DE_PRO_PER_S_3P_N')|U] kann kaum sprechen. „Die Gelehrten fragen: [Glossary('Quid mus sumit', 'QUID_MUS_SUMIT_GLOSS')]? Was also fraß die Maus? Was soll ich machen?“"
 pam_secular_faith_events.0058.scholar: "Beruhigt Euch. Die Maus fraß Brot. Sonst nichts."
 pam_secular_faith_events.0058.mean: "Ihr lasst eine #EMP Maus#! von der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) fressen?! Als [ROOT.Char.Custom('GetCourt')] können wir jemanden wie Euch nicht brauchen!"
 pam_secular_faith_events.0058.a: "Kauft eine Pyxis, die besser verschlossen ist."
 pam_secular_faith_events.0058.b: "So, die Maus ist dann also verdammt? Ha!"
 # 'Quid mus sumit?' - the scholastic question of the mouse and the Host; cf. the related digestion controversy - https://en.wikipedia.org/wiki/Stercoranism
 QUID_MUS_SUMIT_GLOSS: "#G Quid mus sumit?#! – „Was frisst die Maus?“. Eine Frage, die Gelehrte ernsthaft debattierten: Wenn eine Maus an einer geweihten Hostie knabberte, fraß sie dann den Leib Gottes? Das kanonische Recht beschrieb Strafen für Priester, die das Sakrament nachlässig aufbewahrten, und die großen Doktoren urteilten, die Maus nehme lediglich die Erscheinung des Brotes zu sich – und dass das Sakrament sich somit also selbst aus unwürdigen Zähnen rettete."
 # The pyx, a lidded vessel for the consecrated bread - https://en.wikipedia.org/wiki/Pyx
 PYX_GLOSS: "Eine kleine verschlossene Kiste, üblicherweise aus Silber oder Flitter, in der das geweihte Brot für die Messe aufbewahrt wird. Das kanonische Recht verlangte, dass man es trocken, verschlossen und sicher vor gottlosen Händen – oder hungrigen Besuchern – hält."
 # Reservation of the sacrament between masses - https://en.wikipedia.org/wiki/Reserved_sacrament
 RESERVED_HOST_GLOSS: "Brot, das man in der Messe weihte und danach beiseitelegte, wurde in der Kirche verwahrt, sodass die Kranken und Sterbenden es jederzeit erhalten konnten. Sobald es geweiht war, wurde das Brot als der tatsächliche Leib Gottes angesehen – was seine sichere Verwahrung zu einer ungemein wichtigen Angelegenheit werden ließ."
 pam_secular_faith_events.0059.t: "Der Tag des Herrn"
 pam_secular_faith_events.0059.desc: "Im Morgengrauen erreichte uns die Kunde, dass ein wildes Tier ([sighting_county.Custom('GetAnimalType')]) in der Gegend ([sighting_province.Custom('GetTerrainTypePlural')]) von [sighting_county.GetBaseNameNoTier] gesehen worden war. Die Jagdhunde bellen und die Pferde stampfen im Hof – doch mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] versperrt das Tor.\n\n„Es ist [Glossary('der Tag der Ruhe', 'LORDS_DAY_GLOSS')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Die Glocken haben geläutet und die Messe beginnt!\n\nSechs Tage gab die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) Euch, um zu reiten. Müsst Ihr diesen einen auch noch begehren?“"
 pam_secular_faith_events.0059.a: "Sattelt die Pferde ab. Wir gehen in die Messe."
 pam_secular_faith_events.0059.b: "Das Tier ([sighting_county.Custom('GetAnimalType')]) wird nicht warten. Reitet los!"
 # Sunday rest - councils and kings alike forbade work, markets, and the hunt on the Lord's Day - https://en.wikipedia.org/wiki/Lord%27s_Day
 LORDS_DAY_GLOSS: "Der erste Tag der Woche wurde im Gedenken an die Auferstehung heilig gehalten. Die Kirchenkonzilien verboten an ihm gewöhnliche Arbeit, Märkte sowie nutzlosen Zeitvertreib, und die christlichen Könige schrieben das Verbot in ihre Gesetze – obgleich so mancher Fürst die Hirschjagd genau wie die Predigt für eine Angelegenheit zwischen sich selbst und Gott hielt."
 pam_secular_faith_events.0060.t: "Ein unbeschwertes Leben"
 pam_secular_faith_events.0060.desc: "Während ich durch die Straßen von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] reite, sorgenvoll über meine leeren Schatzkammern nachdenke und innerlich aufgewühlt bin, erblicke ich [Select_CString(hermit.IsFemale, 'eine Bettlerin', 'einen Bettler')].\n\nUnbeschwert von weltlichen Besitztümern scheint [hermit.Custom('DE_PRO_PER_S_3P_N')] jemand zu sein, der Frieden mit sich geschlossen und seinen Platz in der Welt gefunden hat. Eine Seele, die frei ist von jenen Qualen, die ich erleide.\n\nVielleicht sieht [hermit.Custom('DE_PRO_PER_S_3P_N')] eine Wahrheit, die mich befreien könnte."
 pam_secular_faith_events.0060.a: "Je weniger ich besitze, desto mehr bin ich!"
 pam_secular_faith_events.0060.b: "Ich werde meinen Käfig einmal mehr vergolden!"
 pam_secular_faith_events.0060.c: "Holt mich aus diesem Regen heraus."
