 the_christian_church_participant_group_christian_clerical_main_power_rulers_desc: "Ein [ruler|E] mit [theocratic_government|E] oder [Concept('ecclesiastical_government', 'kirchlicher Regierung')|E], der mindestens den [title_tier|E] [county|E] besitzt und jenem christlichen [Concept('faith', 'Glauben')|E] anhängt, der derzeit die meisten [counties|E] in der Welt kontrolliert."
 the_christian_church_participant_group_christian_regular_main_power_rulers: "Hauptmacht (Weltlich)"
 the_christian_church_participant_group_christian_regular_main_power_rulers_desc: "Ein [secular_ruler|El], der mindestens den [title_tier|E] [county|E] besitzt und jenem christlichen [Concept('faith', 'Glauben')|E] anhängt, der derzeit die meisten [counties|E] in der Welt kontrolliert."
 the_christian_church_participant_group_christian_clerical_secondary_powers_rulers: "Nebenmächte (Klerikal)"
 the_christian_church_participant_group_christian_clerical_secondary_powers_rulers_desc: "Ein [ruler|E] mit [theocratic_government|E] oder [Concept('ecclesiastical_government', 'kirchlicher Regierung')|E], der mindestens den [title_tier|E] [county|E] besitzt und einem anderen ökumenischen [Concept('christian', 'christlichen')|E] [Concept('faith', 'Glauben')|E] als der Hauptmacht anhängt"
 the_christian_church_participant_group_christian_regular_secondary_powers_rulers: "Nebenmächte (Weltlich)"
 the_christian_church_participant_group_christian_regular_secondary_powers_rulers_desc: "Ein [secular_ruler|E], der mindestens den [title_tier|E] [county|E] besitzt und einem anderen ökumenischen [Concept('christian', 'christlichen')|E] [Concept('faith', 'Glauben')|E] als der Hauptmacht anhängt"
 the_christian_church_participant_group_christian_clerical_heretic_rulers: "Ketzer (Klerikal)"
 the_christian_church_participant_group_christian_clerical_heretic_rulers_desc: "Ein [ruler|E] mit [theocratic_government|E] oder [Concept('ecclesiastical_government', 'kirchlicher Regierung')|E], der mindestens den [title_tier|E] [county|E] besitzt und einem nicht-ökumenischen [Concept('christian', 'christlichen')|E] [Concept('faith', 'Glauben')|E] anhängt."
 the_christian_church_participant_group_christian_regular_heretic_rulers: "Ketzer (Weltlich)"
 the_christian_church_participant_group_christian_regular_heretic_rulers_desc: "Ein [secular_ruler|E], der mindestens den [title_tier|E] [county|E] besitzt und einem anderen ökumenischen [Concept('christian', 'christlichen')|E] [Concept('faith', 'Glauben')|E] als der Hauptmacht anhängt."
 the_christian_church_fragile_unity_situation_phase: "$fragile_unity$"
 fragile_unity: "Zerbrechliche Einigkeit"
 fragile_unity_icon: "@pam_the_christian_church_fragile_unity_icon! $fragile_unity$"
 fragile_unity_desc: "Der christlichen Welt fehlt ein einzelner Thron, dem alle gehorchen müssen. Könige, Bischöfe und Ketzer nehmen für sich in Anspruch, in Gottes Namen zu sprechen, doch niemand scheint auf sie zu hören."
 the_christian_church_saeculum_obscurum_situation_phase: "$saeculum_obscurum$"
 saeculum_obscurum: "Saeculum obscurum"
 saeculum_obscurum_icon: "@pam_the_christian_church_saeculum_obscurum_icon! $saeculum_obscurum$"
 saeculum_obscurum_desc: "Das finstere Zeitalter des Heiligen Stuhls: Ein Papsttum umgeben von Sünde, das in den Betten der Mächtigen gesichert wird."
 the_christian_church_conversion_phase_situation_phase: "$conversion_phase$"
 conversion_phase: "Bekehrung"
 conversion_phase_icon: "@pam_the_christian_church_conversion_phase_icon! $conversion_phase$"
 conversion_phase_desc: "Eine Zeit der neuen Taufen. Könige stellen Kreuze an Furten und auf Marktplätzen auf, Missionare und königliche Armeen überbieten einander um die Seelen in den Grenzlanden und die Bekehrung eines einzelnen Herrschers kann ganze Völker zum selben Taufbecken treiben."
 reform_phase: "Erneuerung"
 reform_phase_icon: "@pam_the_christian_church_reform_phase_icon! $reform_phase$"
 reform_phase_desc: "Disziplin, Recht und puritanischer Eifer ergreifen Besitz vom Klerus. Die innere Struktur des Christentums wird näher untersucht, und der Preis einer reinen Kirche wird allzu oft in Blut entrichtet."
 the_christian_church_reform_phase_situation_phase: "$reform_phase$"
 investiture_crisis: "Investiturstreit"
 investiture_crisis_icon: "@pam_the_christian_church_investiture_crisis_icon! $investiture_crisis$"
 investiture_crisis_desc: "Krone und Bischofsstab prallen aufeinander, wenn es darum geht, wer die Schlüssel zu Gottes Toren besitzt.\n\nWeltliche Gönner setzen Prälaten mit Stab und Ring ein, während die Kirche sich weigert, ihre Legitimität anzuerkennen."
 the_christian_church_investiture_crisis_situation_phase: "$investiture_crisis$"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING: "Nächstes Konzil: [GetGameTimeDifferenceForDiffDays(Situation.MakeScope.VarRemaining('investiture_council_countdown'))]"
 CHRISTIAN_CHURCH_INVESTITURE_TIME_REMAINING_TT: "Es bleibt noch etwas Zeit, bevor der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] seinen Höhepunkt erreicht und beigelegt wird.\n\nWenn die Zeit ausläuft, tritt ein Investiturkonzil zusammen, um die [GetDoctrineType('doctrine_clerical_succession_conditional').GetBaseName|l]e klerikale Ernennungs-[doctrine|E] zu debattieren und sie auf Grundlage der Stimmen zu ersetzen ([GetDoctrineType('doctrine_clerical_succession_spiritual_fixed_appointment').GetBaseName|l] oder [GetDoctrineType('doctrine_clerical_succession_spiritual_appointment').GetBaseName|l]). Weltliche [rulers|E] können den [clergy|E] zwingen, anders abzustimmen, indem sie den [casus_belli|E] $PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$ nutzen oder indem sie [puppets|E] erhalten."
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CHURCH_AHEAD: "#weak Die Kirche hat die Oberhand#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_CROWN_AHEAD: "#weak Die Krone hat die Oberhand#!"
 CHRISTIAN_CHURCH_INVESTITURE_VOTE_BALANCED: "#weak Die anstehende Abstimmung hängt in der Schwebe.#!"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS: "[schism|e]-Fortschritt: [Situation.MakeScope.ScriptValue('pam_great_schism_progress_value')|V0] / [Situation.MakeScope.ScriptValue('pam_great_schism_progress_threshold_value')|V0]"
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "Wie weit haben die Spaltungen, die [GetRiteByKey('roman_rite').GetAdherentNamePlural] und [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] erleben, das Christentum in Richtung des [Concept('schism', 'Großen Schisma')|E] getrieben?\n\nWenn sich genügend Missstände angesammelt haben, könnte es zu einer Spaltung der Kirche kommen. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey('christian_faith').GetName|U] kann erst dann ein [head_of_faith|E] etablieren, wenn das [Concept('schism', 'Große Schisma')|E] eintritt oder verhindert wird.#!\n\n#help Erhöht durch:\n$BULLET_WITH_TAB$Das [GetActivityType('activity_ecumenical_council').GetName|l] stimmt über die Streichung des [Concept('core_tenet', 'Grundsatzes')|E] oder der [doctrine|E] aus den [rites|E] ab\n$BULLET_WITH_TAB$Im Vorfeld der Debatten, wenn ein [GetActivityType('activity_ecumenical_council').GetName|l] stattfindet, kam es zu einem Streit zwischen den beiden Riten\n$BULLET_WITH_TAB$Ein [wars|E] zwischen [Concept('kings', 'Königen')|E] oder höheren Würdenträgern der beiden Riten, die die [GetSituation('the_christian_church').GetName] als ihre spirituelle Heimat sehen\n$BULLET_WITH_TAB$[holy_site|EU] wechselt vom einen Ritus zum anderen\n$BULLET_WITH_TAB$Herabstufung einer [Concept('holy_site', 'heiligen Stätte')|E] eines der beiden Riten\n$BULLET_WITH_TAB$[head_of_rite|E] wird vom anderen Ritus ermordet#!"
 GREAT_SCHISM_PROGRESS_EFFECT_TT: "Das nächste [GetSituationType('the_christian_church').GetPhaseType('saeculum_obscurum').GetName] schaltet den Zugang auf die [decisions|E] „[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]“ und „[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]“ sowie die [interaction|E] #V $pam_sway_schism_stance_interaction$#! frei"
 pam_great_schism_decision_taken: "Das [Concept('schism', 'Große Schisma')|E] ist eingetreten oder wurde verhindert"
 msg_pam_great_schism_progress_title: "Fortschritt in Richtung des Großen Schismas"
 crusade_phase: "Kreuzzug"
 crusade_phase_icon: "@pam_the_christian_church_crusade_phase_icon! $crusade_phase$"
 crusade_phase_desc: "Das Kreuz wird zum Schwert: Armeen von bußfertigen Fürsten strömen in Richtung der Heiligen Stadt, um jeden bedrohten Tempel zu verteidigen."
