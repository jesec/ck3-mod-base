 concord_desc: "Die Eintracht stellt eine stabile Phase der Christenheit dar: Die Tatkraft der Kirche wendet sich Rationalität, Recht und systematischer Theologie zu. Die Wiederentdeckung der antiken Klassiker fördert eine scholastische Gepflogenheit, auf Zweifel mit Argumenten statt nur allein mit Krisen zu antworten."
