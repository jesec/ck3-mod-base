l_german:
 pam_generic_events.0001.t: "Gelehrter des Glaubens"
 pam_generic_events.0001.desc: "Mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', chaplain)] [chaplain.GetFirstName] ist in die Predigt vertieft, als ich das Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) betrete.\n\n„Ah, [ROOT.Char.Custom('FormOfAddressForLiege')]“, sagt [chaplain.Custom('DE_PRO_PER_S_3P_N')], als [chaplain.Custom('DE_PRO_PER_S_3P_N')] mich endlich bemerkt. „Wächst Euer Interesse an den Worten der höchsten Instanz ([ROOT.Char.GetFaith.HighGodName])? Ich kann sie Euch lehren.“"
 pam_generic_events.0001.a: "Eine lohnenswerte Anstrengung."
 pam_generic_events.0001.b: "Das Herrschen bedarf schon meiner ganzen Aufmerksamkeit."
 pam_generic_events.0002.t: "Bin ich gut?"
 pam_generic_events.0002.desc.intro: "Mein[doubting_child.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', doubting_child)] [doubting_child.GetFirstName] schlüpft in mein Gemach, lange nachdem die Kerzen hätten gelöscht sein sollen. Tränen rinnen [doubting_child.Custom('DE_PRO_POS_S_3P')]e Wangen hinab.\n\n„Bin ich ein guter Mensch?“, flüstert [doubting_child.Custom('DE_PRO_PER_S_3P_N')]. „Was, wenn ich eine Sünde bin …"
 pam_generic_events.0002.desc.sin: "so #EMP widerlich#! [sinful_trait.GetName( ROOT.Char )|l] …"
 pam_generic_events.0002.desc.sp: "wenn meine Seele sich so leer anfühlt …"
 pam_generic_events.0002.desc.outro: "Wie kann die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) mich immer noch wollen?“"
 pam_generic_events.0002.a: "Streift ab, was Euch beschämt."
 pam_generic_events.0002.b: "Ihr werdet bereits geliebt."
 pam_generic_events.0002.c: "Dann wollen wir beten."
 friend_comforted_child_doubts: "[CHARACTER.GetShortUIName|U] tröstete [TARGET_CHARACTER.GetShortUIName], als [TARGET_CHARACTER.Custom('DE_PRO_PER_S_3P_N')] an [TARGET_CHARACTER.Custom('DE_PRO_POS_S_3P')]er eigenen Gutherzigkeit zweifelte."
 friend_comforted_child_doubts_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] tröstete [CHARACTER.GetShortUIName], als [CHARACTER.Custom('DE_PRO_PER_S_3P_N')] an [CHARACTER.Custom('DE_PRO_POS_S_3P')]er eigenen Gutherzigkeit zweifelte."
 pam_generic_events.0003.t: "Was Ihr seid"
 pam_generic_events.0003.desc: "Mein[worried_spouse.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', worried_spouse)] [worried_spouse.GetFirstName] wartet zwischen den Hecken in der Dunkelheit. [worried_spouse.Custom('DE_PRO_POS_S_3P')|U]e Hände liegen unruhig in [worried_spouse.Custom('DE_PRO_POS_S_3P')]em Schoß.\n\n„Ihr seid so #EMP [sinful_trait.GetName( ROOT.Char )|l]#!“, sagt [worried_spouse.Custom('DE_PRO_PER_S_3P_N')] mit leiser Stimme. „Es beschämt uns beide vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]). Wie könnt Ihr so nachlässig mit Eurem Glauben sein? Seht Ihr nicht, was das mit Euch macht?“"
 pam_generic_events.0003.a: "Für Euch? Ich werde es wiedergutmachen."
 pam_generic_events.0003.b: "Das ist, wie die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) mich schuf."
 pam_generic_events.0003.c: "Ihr sorgt Euch zu viel."
 lover_promised_to_change_ways: "[CHARACTER.GetShortUIName|U] versprach [TARGET_CHARACTER.GetShortUIName], sich zu bessern und auf eine Pilgerreise zu gehen."
 lover_promised_to_change_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] versprach [CHARACTER.GetShortUIName], sich zu bessern und auf eine Pilgerreise zu gehen."
 rival_embraced_sinful_ways: "[CHARACTER.GetShortUIName|U] weigerte sich, Buße zu tun, als [TARGET_CHARACTER.GetShortUIName] [CHARACTER.Custom('DE_PRO_PER_S_3P_A')] bat, sich zu ändern."
 rival_embraced_sinful_ways_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] weigerte sich, Buße zu tun, als [CHARACTER.GetShortUIName] [TARGET_CHARACTER.Custom('DE_PRO_PER_S_3P_A')] bat, sich zu ändern."
 pam_generic_events.0004.t: "Ein Licht im Dunkeln"
 pam_generic_events.0004.desc: "Das Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) ist völlig leer. Nebel wabert um die Säulen, und Kerzen flackern im Gedenken daran, dass mein[deceased.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', deceased)] [deceased.GetFirstName] erst unlängst verschied ([deceased.GetDeathReasonHideKiller]).\n\nMein[comforter.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', comforter)] [comforter.GetFirstName] sitzt so nahe bei mir, dass [comforter.Custom('DE_PRO_POS_S_3P')] Ärmel den meinen berührt. „Trauer ist eine Straße“, sagt [comforter.Custom('DE_PRO_PER_S_3P_N')] sanft. „Geht sie entlang und Ihr werdet womöglich feststellen, dass am Ende ein strahlendes Jenseits ([ROOT.Char.GetFaith.PositiveAfterLife]) auf Euch wartet.“"
 pam_generic_events.0004.a: "Ich war es! #EMP Ich#! habe es getan!"
 pam_generic_events.0004.b: "[Glossary('$pam_john_14_2_english|q$','JOHN_14_2_GLOSS')]"
 pam_john_14_2_english: "#EMP Im Haus meines Vaters gibt es viele Gemächer.#!"
 JOHN_14_2_GLOSS: "#weak John 14:2, EÜ#!"
 pam_generic_events.0004.c: "Dann wollen wir beten."
 pam_generic_events.0004.d: "Kommt. Trinken wir auf [deceased.Custom('DE_PRO_POS_S_3P')] Andenken."
 pam_generic_events.0005.t: "Eine treue Faust"
 pam_generic_events.0005.desc: "„Wie kann [clerical_holder.Custom('DE_PRO_PER_S_3P_N')] es #EMP wagen#!?!“\n\nMein[loyal_vassal.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', loyal_vassal)] [loyal_vassal.GetTitledFirstName] kommt in die Ratskammer und hat die Klinge bereits halb gezogen.\n\n„Wie kann [clerical_holder.GetTitledFirstName] es wagen, Euch auszustoßen?“ [loyal_vassal.Custom('DE_PRO_PER_S_3P_N')|U] spuckt auf den Boden. „Ich habe Männer in [clerical_region.GetName]. Gebt Kunde und wir werden [clerical_holder.Custom('DE_PRO_PER_S_3P_D')] einen Besuch abstatten.“"
 pam_generic_events.0005.a: "Wohlan denn. Macht Euch auf den Weg."
 pam_generic_events.0005.a.tt: "[loyal_vassal.GetTitledFirstName|U] reist nach [clerical_holder.GetCapitalLocation.GetName]. Bei [loyal_vassal.Custom('DE_PRO_POS_S_3P')]er Rückkehr erhaltet Ihr [dread|E] und eine höhere [opinion|E] bei [GetVassalStance('belligerent').GetTextIcon][GetVassalStance('belligerent').GetName|l]en [Concept('vassal', 'Vasallen')|E]"
 pam_generic_events.0005.b: "Es gibt klügere Wege."
 pam_generic_events.0005.b.tt: "Ihr erhaltet für #V 15 Jahre#! einen #P gewaltigen#! Bonus auf [GetScheme('murder').GetTypeName]-[schemes|E], die auf [clerical_holder.GetShortUIName] abzielen"
 pam_generic_events.0005.c: "Mir wurde beigebracht, die andere Wange hinzuhalten."
 pam_generic_events.0005.c.tt: "Die [character_interaction|E] #V $declaration_of_repentance_interaction$#! hat für #V 10 Jahre#! eine um #P +20#! erhöhte Akzeptanz"
 pam_generic_events.0005.c.tt2: "Die [character_interaction|E] #V $lift_excommunication_interaction$#! wird in den nächsten #V 10 Jahren#! mit einer höheren Wahrscheinlichkeit gegen Euch verwendet werden"
 pam_turned_the_other_cheek_accept_reason: "Hielt die andere Wange hin"
 PAM_GENERIC_0005_MURDER_BONUS: "Ein treuer Vasall hat Männer in der Domäne dieses Ziels: $VALUE|+0=$"
 pam_generic_events.0007.opening: "An [ROOT.Char.GetTitledFirstName]"
 pam_generic_events.0007.desc: "Es ist erledigt. Ich fand [clerical_holder.GetTitledFirstName] und hinterließ [clerical_holder.Custom('DE_PRO_PER_S_3P_A')] blutend."
 pam_generic_events.0007.a: "Gut."
 pam_generic_events.0008.t: "Eine Stimme im Dunkeln"
 pam_generic_events.0008.desc: "Das Abendessen liegt mir noch immer schwer im Magen, als ich in Richtung meiner Bettstatt stolpere. Mir verschwimmt alles vor den Augen und der Boden bewegt sich unter meinen Füßen.\n\nDann … eine Stimme. „So [virtuous_trait.GetName(ROOT.Char)|l] als [ROOT.Char.GetTitleAsNameNoTooltip] …“ sagt sie. „So rechtschaffen. Ihr gefallt Eurem Herrn.“\n\nIst das wahrhaftig die höchste Macht ([ROOT.Char.GetFaith.HighGodName])? Oder nur die Übelkeit, die ich spüre?"
 pam_generic_events.0008.a: "Ja. #EMP Ja!!#!"
 pam_generic_events.0008.b: "Das muss Er sein!"
 pam_generic_events.0008.c: "Die alten Mächte regen sich …"
 pam_generic_events.0008.d: "Manchmal hat Essen diese Auswirkungen."
 pam_generic_events.0008.e: "Vielleicht … ist es etwas, was ich aß?"
 pam_generic_events.0008.f: "Es ist besser, sicherheitshalber ein Gebet zu sprechen."
 pam_generic_events.0009.t: "Die Feuer der Hölle"
 pam_generic_events.0009.desc: "Ich erwache schweißgebadet, mein Herz hämmert mir gegen die Rippen.\n\nIn meinen Träumen verbrannte ich. Das Fleisch schmolz von meinen Knochen wie Butter. „[sinful_trait.GetNameNoTooltip(ROOT.Char)|U]! [sinful_trait.GetNameNoTooltip(ROOT.Char)|U]!“ Eine Horde Dämonen schrie mich an.\n\nDie Feuer eines finsteren Jenseits ([ROOT.Char.GetFaith.NegativeAfterLife]) griffen nach mir, und jeder Schrei war der meine."
 pam_generic_events.0009.a: "Die Geißel findet ihren Weg."
 pam_generic_events.0009.b: "Fleisch muss auf Fleisch antworten."
 pam_generic_events.0009.c: "[Glossary('$pam_james_4_8_english|q$','JAMES_4_8_GLOSS')]"
 pam_james_4_8_english: "#EMP Säubert Eure Hände, Ihr Sünder, und reinigt Eure Herzen.#!"
 JAMES_4_8_GLOSS: "#weak Jakobus 4:8, EÜ#!"
 pam_generic_events.0009.d: "Mit [comforting_courtier.GetTitledFirstName] zu sprechen, hilft immer."
 pam_generic_events.0009.e: "Ein Traum ist einfach ein Traum."
 friend_comforted_hell_nightmare_reason: "[CHARACTER.GetShortUIName|U] suchte nach einem Albtraum der Verdammnis Trost bei [TARGET_CHARACTER.GetShortUIName]."
 friend_comforted_hell_nightmare_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] suchte nach einem Albtraum der Verdammnis Trost bei [CHARACTER.GetShortUIName]."
 pam_generic_events.0010.t: "Gesegnete Beute"
 pam_generic_events.0010.desc: "Das Gelände ([ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')]) öffnet sich vor uns. Das donnernde Geräusch Tausender galoppierender Pferde folgt rasch, und [hunting_ruler.GetName] führt sie stolz an.\n\n#EMP „Haaaaaaaalt!“#! [hunting_ruler.Custom('DE_PRO_PER_S_3P_N')|U] erhebt die Hand zum Gruß und lässt [hunting_ruler.Custom('DE_PRO_POS_S_3P')] Gefolge anhalten. „Gelobt sei die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) für dieses Wetter!“, ruft [hunting_ruler.Custom('DE_PRO_PER_S_3P_N')], „Und für die Beute, die wir jagen!“"
 pam_generic_events.0010.a: "Ein Ratschlag, wenn Ihr ihn hören mögt …"
 pam_generic_events.0010.b: "Euer Auge ist so scharf wie Euer Speer."
 pam_generic_events.0010.b.success: "Euer Lob kommt gut an"
 pam_generic_events.0010.b.failure: "Euer Lob kommt nicht gut an"
 pam_generic_events.0010.b.toast.success: "[hunting_ruler.Custom('DE_PRO_PER_S_3P_N')|U] nimmt sich Euer Lob zu Herzen"
 pam_generic_events.0010.b.toast.failure: "[hunting_ruler.Custom('DE_PRO_PER_S_3P_N')|U] antwortet verärgert auf Eure leere Schmeichelei"
 pam_generic_events.0010.b.tt: "[hunting_ruler.GetTitledFirstName|U] wird für #V 10 Jahre#! eher eine [character_interaction|E] #high $negotiate_alliance_interaction$#! annehmen"
 pam_generic_events.0010.c: "Gelobt sei!"
 pam_generic_events.0010.d: "Leiht mir ein paar Eurer Reiter für den Weg aus."
 friend_praised_hunting_reason: "[CHARACTER.GetShortUIName|U] lobte die Fähigkeiten von [TARGET_CHARACTER.GetShortUIName] während der Jagd."
 friend_praised_hunting_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] lobte die Fähigkeiten von [CHARACTER.GetShortUIName] während der Jagd."
 pam_praised_hunting_alliance_accept_reason: "Lobte meine Jagd"
 pam_generic_events.0011.t: "Ein bisschen Sünde"
 pam_generic_events.0011.desc: "Die sündhaften Taten von [sinful_courtier.GetTitledFirstName] finden zu lange statt. Mein Hof schwirrt vor Gerüchten über [sinful_courtier.Custom('DE_PRO_POS_S_3P')] sündiges Verhalten, und ich sah, wie sich Bedienstete zurückziehen, wenn [sinful_courtier.Custom('DE_PRO_PER_S_3P_N')] vorbeigeht.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“, ruft [sinful_courtier.Custom('DE_PRO_PER_S_3P_N')], als ich das Studierzimmer betrete, [sinful_courtier.Custom('quirk_neg_pp')]. „Welch eine Ehre in Euer Gegenwart zu sein.“"
 pam_generic_events.0011.a: "Ihr werdet von Eurem [sinful_trait.GetNameNoTooltip(ROOT.Char)|l]en Treiben ablassen."
 pam_generic_events.0011.b: "Hört auf die Lektionen, die uns die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) lehrt."
 pam_generic_events.0011.b.success: "Die Lektion greift"
 pam_generic_events.0011.b.failure: "Man lässt sich nichts beibringen"
 pam_generic_events.0011.b.toast.success: "[sinful_courtier.Custom('DE_PRO_PER_S_3P_N')|U] begreift die Last [sinful_courtier.Custom('DE_PRO_POS_S_3P')]er Sünde"
 pam_generic_events.0011.b.toast.failure: "[sinful_courtier.Custom('DE_PRO_PER_S_3P_N')|U] schert sich nicht um Eure Lehren"
 pam_generic_events.0011.c: "Das ist nicht gut für Euch …"
 pam_generic_events.0011.c.success: "Sanfter Rat lässt [sinful_courtier.Custom('DE_PRO_PER_S_3P_A')] weich werden"
 pam_generic_events.0011.c.failure: "Eure Freundlichkeit erntet nur Abscheu"
 pam_generic_events.0011.c.toast.success: "[sinful_courtier.Custom('DE_PRO_PER_S_3P_N')|U] ist gerührt von Eurer Sorge"
 pam_generic_events.0011.c.toast.failure: "[sinful_courtier.Custom('DE_PRO_PER_S_3P_N')|U] hält Eure Freundlichkeit für Schwäche"
 pam_generic_events.0011.d: "Vielleicht ist es nicht so schlimm."
