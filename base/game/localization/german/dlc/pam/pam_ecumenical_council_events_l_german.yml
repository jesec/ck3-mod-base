 ecumenical_council_events.0126.innovators_custom: "[ec_innovators|E] unter Euren [rivals|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0129.t: "Furcht im Saal"
 ecumenical_council_events.0129.desc: "Jene, die vor mit zittern, verfolgen die Debatte mit Augen wie zitternde Sahnekleckse. [Select_CString(lead_conservative.IsFemale, 'Die', 'Der')] Niederste von ihnen, [lead_conservative.GetTitledFirstName], traut sich noch nicht einmal, meinem Blick zu begegnen.\n\n„Sagt, was Ihr zu sagen habt“, flüstert [lead_conservative.Custom('DE_PRO_PER_S_3P_N')]. „Ich kann mir schon vorstellen, was geschieht, wenn ich ablehne.“"
 ecumenical_council_events.0129.support: "Grausamkeit ließ mich noch nie im Stich."
 ecumenical_council_events.0129.support_duel: "Ich versichere Euch, andere wissen es auch."
 ecumenical_council_events.0129.support_duel.success: "Furcht sorgt dafür, dass sie sich Euch beugen"
 ecumenical_council_events.0129.support_duel.success_halved: "Furcht macht nur wenige zu Sklaven"
 ecumenical_council_events.0129.support_duel.failure: "Ihre Furcht verwandelt sich in Widerstand"
 ecumenical_council_events.0129.oppose: "Und so verschlingt der Schrecken die Hoffnung."
 ecumenical_council_events.0129.oppose_duel: "Ich werde es nicht zulassen, dass sich mir jemand widersetzt."
 ecumenical_council_events.0129.oppose_duel.success: "Die Furchtsamen gehorchen"
 ecumenical_council_events.0129.oppose_duel.success_halved: "Ein paar gehorchen"
