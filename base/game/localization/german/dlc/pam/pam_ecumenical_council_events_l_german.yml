 ecumenical_council_events.0106.t: "Geschuldete Treue"
 ecumenical_council_events.0106.desc: "Meine Vasallen und ich versammeln uns in einem der Gemächer.\n\n„Selbst hier ist [Select_CString(ROOT.Char.IsFemale, 'Eure Lehnsherrin Eure Meisterin', 'Euer Lehnsherr Euer Meister')]“, warnt [lead_conservative.GetTitledFirstName] die anderen. „Wenn sich [Select_CString(ROOT.Char.IsFemale, 'unsere', 'unser')] [ROOT.Char.GetTitleAsName] nicht für diese ketzerische Neuerung ausspricht, müsst auch Ihr schweigen.“\n\n„Wenn sich [Select_CString(ROOT.Char.IsFemale, 'Unsere', 'Unser')] hält uns überall auf Kurs. Aber nicht hier!“, entgegnet [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0106.desc_innovator: "Meine Vasallen und ich versammeln uns in einem der Gemächer.\n\n„[Select_CString(ROOT.Char.IsFemale, 'Unsere Lehnsherrin', 'Unser Lehnsherr')] verdient eine Antwort“, sagt [lead_conservative.GetTitledFirstName]. „Doch leider fürchte ich, dass diese Angelegenheit [ROOT.Char.Custom('DE_PRO_POS_S_3P')]e Fähigkeiten übersteigt. Nur die höchste Macht ([lead_conservative.GetFaith.HighGodName]) führt unsere Herzen und zieht die Grenze, die wir unfehlbar verteidigen müssen!“\n\n„Ah, aber die Wünsche, die [Select_CString(ROOT.Char.IsFemale, 'unsere', 'unser')] [ROOT.Char.GetTitleAsNameNoTooltip] hegt, stehen nicht im Widerspruch zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName])“, antwortet [lead_innovator.GetTitledFirstName]. „Bedenkt Eure Eide und achtet [ROOT.Char.Custom('DE_PRO_POS_S_3P')|l]e Weisheit!“"
 ecumenical_council_events.0106.support: "„Als [ROOT.Char.GetTitleAsNameNoTooltip] bin ich [Select_CString(ROOT.Char.IsFemale, 'die Stellvertreterin', 'der Stellvertreter')] der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]).“"
 ecumenical_council_events.0106.support_duel: "Verlangt die treuen Dienste, die diese Vasallen schworen."
 ecumenical_council_events.0106.support_duel.success: "Sie werden Euch gehorchen"
 ecumenical_council_events.0106.support_duel.success_halved: "Ein paar stimmen zu, Euch zu gehorchen"
 ecumenical_council_events.0106.support_duel.failure: "Eure Vasallen behalten ihre Treue der höchsten Macht ([lead_conservative.GetFaith.HighGodName]) vor"
 ecumenical_council_events.0106.oppose: "Unterstützt [lead_conservative.GetTitledFirstNameNoTooltip]: Das geht über die Fähigkeiten [Select_CString(ROOT.Char.IsFemale, 'einer Lehnsherrin', 'eines Lehnsherrn')] hinaus."
 ecumenical_council_events.0106.oppose_duel: "Bestreitet, dass die Wünsche eines Fürsten im Widerspruch zu Gott stehen."
 ecumenical_council_events.0106.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0106.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0106.oppose_duel.failure: "Ihre Antwort bleibt gleich"
