 ecumenical_council_events.0113.t: "Glaube unter Waffen"
 ecumenical_council_events.0113.desc: "Jene, deren Reiche unter den ruchlosen Waffen der Glaubensfeinde leiden, treten in wechselseitigem Mitgefühl gemeinsam beiseite.\n\n„Während Glaubensfeinde meine Felder niederbrennen“, erklärt [lead_conservative.GetTitledFirstName], „sollen wir uns über törichte Träume streiten? Als ob das Schwert nicht schon unsere Herzen durchbohren würde?“\n\n„Ein zerbrochenes Glaubensbekenntnis ist ein zerbrochener Schild“, antwortet [lead_innovator.GetTitledFirstName]. „Lasst uns den Kanon festlegen, und danach kämpfen wir zusammen. Erneuert!“"
 ecumenical_council_events.0113.support: "Es wäre gut, wieder etwas Hoffnung zu spüren."
 ecumenical_council_events.0113.support_duel: "Lasst uns die Kirche als unseren Schild verbessern!"
 ecumenical_council_events.0113.support_duel.success: "Sie nehmen an, und wir werden gemeinsam kämpfen"
 ecumenical_council_events.0113.support_duel.success_halved: "Ein paar lassen sich zur Reform bewegen"
 ecumenical_council_events.0113.support_duel.failure: "Sie können sich nicht an die Hoffnung erinnern"
 ecumenical_council_events.0113.oppose: "Gibt es nicht dringlichere Angelegenheiten als diese Törichtheit?"
 ecumenical_council_events.0113.oppose_duel: "Warnt sie vor dieser Leichtsinnigkeit."
 ecumenical_council_events.0113.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0113.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0113.oppose_duel.failure: "Sie hoffen immer noch vergebens"
