 ecumenical_council_events.0060.doctrine_consanguinity_unrestricted: "Das Konzil muss sich für [GetDoctrineType('doctrine_consanguinity_unrestricted').GetDescriptiveNameNoTooltip(ROOT.GetCharacter.GetFaith)|l]e Ehen aussprechen."
