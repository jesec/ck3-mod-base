 ecumenical_council_events.0112.t: "Krankheit im Reich"
 ecumenical_council_events.0112.desc: "„Die Toten stapeln sich in meinen Landen! Zunächste fragte ich mich, warum uns die höchste Macht ([lead_conservative.GetFaith.HighGodName]) bestraft, doch nun – ist es vollkommen klar! Die Menschheit leidet, weil unsere Welt diese Abart des kanonischen Rechts ablehnt“, sagt [lead_conservative.GetTitledFirstName].\n\n„Seid Ihr so verblendet von Eurem Hass auf dieses Konzil, dass Ihr Eure Erlösung nicht erkennen könnt?“, antwortet [lead_innovator.GetTitledFirstName]. „Unsere Reform soll den Zorn der höchsten Macht ([lead_innovator.GetFaith.HighGodName]) beschwichtigen!“"
 ecumenical_council_events.0112.support: "Ja. Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) verlangt, dass sich die Kirche wandelt."
 ecumenical_council_events.0112.support_duel: "Die Logik des Standhaften gegen [lead_conservative.Custom('DE_PRO_PER_S_3P_A')] zu verwenden, könnte gelingen!"
 ecumenical_council_events.0112.support_duel.success: "Viele glauben, dass der göttliche Zorn beendet ist"
 ecumenical_council_events.0112.support_duel.success_halved: "Ein paar werden versuchen, die höchste Macht ([lead_innovator.GetFaith.HighGodName]) zu beschwichtigen"
 ecumenical_council_events.0112.support_duel.failure: "Das kanonische Recht zu zerstören, ist ein zu großes Wagnis"
 ecumenical_council_events.0112.oppose: "Oder man verärgert die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) noch mehr!"
 ecumenical_council_events.0112.oppose_duel: "Warnt davor, dass dies das kanonische Recht zerstören könnte."
 ecumenical_council_events.0112.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0112.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0112.oppose_duel.failure: "Sie hoffen immer noch auf den Wandel"
