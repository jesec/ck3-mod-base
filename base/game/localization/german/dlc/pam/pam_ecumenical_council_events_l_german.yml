 ecumenical_council_events.0122.t: "Solange ich noch kann"
 ecumenical_council_events.0122.desc: "Ein paar kränkliche Priester sitzen abseits der Menge im Saal und wärmen sich in der Sonne auf.\n\n„Ich frage mich, ob ich das Ende des Konzils noch erlebe, bevor ich auf die höchste Macht ([lead_conservative.GetFaith.HighGodName]) treffe … und dazu verdammt sein werde, in einem finsteren Jenseits ([lead_conservative.GetFaith.NegativeAfterLife]) zu verweilen, wo der Gestank jüngster Schrecken wabert.“ [lead_conservative.GetTitledFirstName|U] seufzt schwer.\n\n„Ihr habt nur noch so wenig zu verlieren, [lead_conservative.GetFirstNameNoTooltip], doch gewiss bleibt etwas Hoffnung, die Ihr der Welt anbieten könnt, und daher zieht Ihr doch bestimmt glückselig in ein strahlendes Jenseits ([lead_innovator.GetFaith.PositiveAfterLife]) ein?“, antwortet [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0122.support: "„Bei der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])! Diese letzten Augenblicke sind kostbar!“"
 ecumenical_council_events.0122.support_duel: "Ich werde nicht auf die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) treffen und geschwiegen haben."
 ecumenical_council_events.0122.support_duel.success: "Sie werden zu einer letzten reformierenden Tat inspiriert"
 ecumenical_council_events.0122.support_duel.success_halved: "Ein paar werden zu einer letzten inspirierenden Tat inspiriert"
 ecumenical_council_events.0122.support_duel.failure: "Sie werden elendig dahinsiechen"
 ecumenical_council_events.0122.oppose: "Unsere verbliebene Kraft gehört der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) und ihrem Wort."
 ecumenical_council_events.0122.oppose_duel: "„Lasst uns unsere Lebzeiten nicht damit beflecken!“"
 ecumenical_council_events.0122.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0122.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0122.oppose_duel.failure: "Sie bleiben verdammt"
