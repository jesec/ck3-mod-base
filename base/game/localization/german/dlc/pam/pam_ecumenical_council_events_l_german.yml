 ecumenical_council_events.0011.desc.outro: "[Select_CString(host.IsFemale, 'Unsere Gastgeberin', 'Unser Gastgeber')] [host.GetTitledFirstName] erklärt:\n\n„Ich schlage vor, dass Folgendes ([ec_debate_topic_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)])"
 ecumenical_council_events.0011.desc.permit: "zugelassen wird.“"
 ecumenical_council_events.0011.desc.prohibit: "verboten wird.“"
 ecumenical_council_events.0011.desc.learn: "bekannt gemacht wird.“"
 ecumenical_council_events.0011.desc.make_core: "zum Kern wird. Ersetzt wird dementsprechend: [core_tenet_to_swap.GetName(ROOT.GetCharacter.GetRite)].“"
 ecumenical_council_events.0011.a: "Ich stimme für Wandel."
 ecumenical_council_events.0011.b: "Ich stimme nicht zu."
