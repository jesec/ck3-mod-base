 ecumenical_council_events.0126.t: "Unter Rivalen"
 ecumenical_council_events.0126.desc: "Dass mein[rival.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', rival)] [rival.GetTitledFirstName] in der Versammlung zu finden ist, stellt eine Prüfung dar.\n\n„Ich wisst sicherlich, warum ich hier bin“, knurrt [rival.Custom('DE_PRO_PER_S_3P_N')]. „Sagt, was Ihr zu sagen habt, und wählt Eure Seite … Ich warte nur darauf, gegen Euch zu stimmen.“"
 ecumenical_council_events.0126.a: "Lasst Euch von Eurem Gewissen leiten, nicht von Eurem Hass."
 ecumenical_council_events.0126.b: "Behaltet Eure Boshaftigkeit für Euch. Ich lasse mich darauf nicht ein."
 ecumenical_council_events.0126.c: "Das Konzil lenkt [rival.Custom('DE_PRO_PER_S_3P_A')] ab …"
 ecumenical_council_events.0126.c.tt: "Das [scheme|E] wird eine #P erhöhte#! [success_chance|E] haben"
