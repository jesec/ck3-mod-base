 ecumenical_council_events.0114.t: "Mit Glauben und Eisen bewaffnet"
 ecumenical_council_events.0114.desc.intro: "So wie es die Gepflogenheit von Männern ist, die den Krieg kennen, verbringen die alten Krieger unter uns viele Stunden miteinander.\n\n„Bei der höchsten Macht ([lead_innovator.GetFaith.HighGodName])! Es wird gut sein, wenn diese Veränderungen vereinbart werden. Die Gläubigen können erneut unter einem Banner zusammenkommen!“, sagt [lead_innovator.GetTitledFirstName]\n\n"
 ecumenical_council_events.0114.desc.conservative: "„Manch ein [ec_hostile_faith.GetAdherentName] wurde von uns schon niedergemäht“, sagt [lead_conservative.GetTitledFirstName]. „Haben die Mächte des Krieges ([lead_conservative.GetFaith.WarGodName]) unsere Banner nicht bereits gesegnet?“"
 ecumenical_council_events.0114.desc.conservative_generic: "„Wir haben schon so manchen Feind niedergemäht“, sagt [lead_conservative.GetTitledFirstName]. „Haben die Mächte des Krieges ([lead_conservative.GetFaith.WarGodName]) unsere Banner nicht bereits gesegnet?“"
 ecumenical_council_events.0114.support: "Lasst uns ein neues gesegnetes Banner hissen."
 ecumenical_council_events.0114.support_duel: "Rekrutiert die Furchtsamen an die gesegneten Banner der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])!"
 ecumenical_council_events.0114.support_duel.success: "Ein Soldat muss dienen"
 ecumenical_council_events.0114.support_duel.success_halved: "Ein paar werden rekrutiert"
 ecumenical_council_events.0114.support_duel.failure: "Sie behalten ihre Meinung stur bei"
 ecumenical_council_events.0114.oppose: "Unterstützt [lead_conservative.GetTitledFirstNameNoTooltip], [Select_CString(lead_conservative.IsFemale, 'die Verteidigerin', 'den Verteidiger')] der Orthodoxie."
 ecumenical_council_events.0114.oppose_duel: "Ein Duell der Worte – so sei es!"
 ecumenical_council_events.0114.oppose_duel.success: "Die Kohorten von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0114.oppose_duel.success_halved: "Ein paar aus den Kohorten von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0114.oppose_duel.failure: "Sie werden vergeblich voranstürmen"
