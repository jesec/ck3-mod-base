 ecumenical_council_events.0117.t: "Zu viele Änderungen"
 ecumenical_council_events.0117.desc: "Ich sehe, wie zwei geübte Verhandler ein Dekret am Rand bearbeiten und einen Satz streichen und umschreiben, als wäre es ein Vertrag.\n\n„Lasst es, wie es ist! Wir riskieren nur, dass die Hälfte von ihnen wieder geht, bevor wir die schwierigeren Angelegenheiten überhaupt angesprochen haben“, sagt [lead_conservative.GetTitledFirstName]. „Ich brachte Monate mit diesen Leuten an einem Tisch zu. Weicht das auf oder wir verlieren das Konzil an sich.“\n\n„Und dabei sollen wir dieses Durcheinander hinterlassen, das niemand durchsetzen wird, sobald das Konzil beendet ist?“, entgegnet [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0117.support: "Wir müssen überzeugend sein. Wir müssen deutlich sein."
 ecumenical_council_events.0117.support_duel: "Besser ein klares Dekret, als still zu sein, oder?"
 ecumenical_council_events.0117.support_duel.success: "Sie nehmen hin, dass ein Durcheinander nicht durchgesetzt wird"
 ecumenical_council_events.0117.support_duel.success_halved: "Ein paar nehmen hin, dass ein Durcheinander nicht durchgesetzt wird"
 ecumenical_council_events.0117.support_duel.failure: "Sie fürchten immer noch Entfremdung"
 ecumenical_council_events.0117.oppose: "Wir können es nicht riskieren, das Konzil zu verlieren!"
 ecumenical_council_events.0117.oppose_duel: "Das ist krude – das kann nicht verabschiedet werden!"
 ecumenical_council_events.0117.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0117.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
