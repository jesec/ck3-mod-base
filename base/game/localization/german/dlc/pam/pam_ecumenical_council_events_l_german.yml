 ecumenical_council_events.0108.t: "Unter Freunden"
 ecumenical_council_events.0108.desc: "Mein[friend.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMe', friend)] [friend.GetTitledFirstName] ist Teil der Versammlung, und [friend.Custom('DE_PRO_POS_S_3P')] Anblick ist ein wahrer Trost.\n\n„Ihr kennt sicherlich meine Haltung“, sagt [friend.Custom('DE_PRO_PER_S_3P_N')]. „Ich folge, wann immer Ihr es verlangt.“"
 ecumenical_council_events.0108.a: "Bleibt an meiner Seite, [friend.GetFirstNameNoTooltip]."
 ecumenical_council_events.0108.b: "Ihr könnt Eure eigenen Überzeugungen vertreten."
 ecumenical_council_events.0108.conservatives_custom: "[ec_conservatives|E] unter Euren [Concept('friends', 'Freunden')|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0108.innovators_custom: "[ec_innovators|E] unter Euren [Concept('friends', 'Freunden')|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0109.t: "Stumme Unzufriedenheiten"
 ecumenical_council_events.0109.desc: "Abseits des Geschehens scheint sich eine kleine Versammlung anzubahnen. Wer versucht da, ohne mich den Glauben zu erneuern?\n\n„Wenn diese eine Angelegenheit hinterfragt werden kann, warum dann nicht auch der ganze Rest?“, warnt [lead_conservative.GetTitledFirstName]. „Ich werde diese Tür nicht öffnen und die Ungewissheit in das Haus der höchsten Macht ([lead_conservative.GetFaith.HighGodName]) hereinbitten.“\n\n„Sehnt Ihr Euch nicht danach, Traditionen loszuwerden, die uns nicht länger dienlich sind?“, antwortet [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0109.support: "Ein offenes Ohr genügt."
 ecumenical_council_events.0109.support_duel: "Ich weiß schon, wie ich die Zauderer zum Zuhören bewegen kann …"
 ecumenical_council_events.0109.support_duel.success: "Sie werden sich nicht in den Weg stellen"
 ecumenical_council_events.0109.support_duel.success_halved: "Ein paar hören auf Euch"
 ecumenical_council_events.0109.support_duel.failure: "Sie schließen die Reihen gegen Euch"
 ecumenical_council_events.0109.oppose: "Schließt leise diese Tür."
 ecumenical_council_events.0109.oppose_duel: "„Handelt Ihr immer mit Chaos, [lead_innovator.GetFirstNameNoTooltip]?“"
 ecumenical_council_events.0109.oppose_duel.success: "Sie werden kein Chaos riskieren"
 ecumenical_council_events.0109.oppose_duel.success_halved: "Ein paar widerrufen ihre Unterstützung"
 ecumenical_council_events.0109.oppose_duel.failure: "Sie wünschen sich noch immer Zwietracht und Untergang"
