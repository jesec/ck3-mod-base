 ecumenical_council_events.doctrine.intro: "Folgendes ist das letzte Thema, das angehört wird: [ec_debate_topic_3.GetGroup.GetName(ROOT.GetCharacter.GetFaith)]. Die derzeitige Haltung des kanonischen Rechts ist wie folgt: [ec_debate_topic_3.GetDescriptiveName(ROOT.GetCharacter.GetFaith)]. [lead_portrait.GetTitledFirstName|U] beginnt:\n\n"
 ecumenical_council_events.doctrine.chaplain_suggestion: "\n\n„Am besten für die Bedürfnisse des Glaubens ([ROOT.Char.GetFaith.GetName]) geeignet ist: [ec_chaplain_pick.GetDescriptiveName(ROOT.GetCharacter.GetFaith)]“, erklärt [court_chaplain.GetName]."
