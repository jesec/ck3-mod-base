 pam_ecumenical_council_roman_guests_custom: "Jeder [GetRiteByKey('roman_rite').GetAdherentName] zu Gast auf dem Konzil"
 pam_ecumenical_council_greek_guests_custom: "Jeder [GetRiteByKey('byzantine_rite').GetAdherentName] zu Gast auf dem Konzil"
 pam_ecumenical_council_overruled_guests_custom: "Die Gäste des Ritus, gegen den entschieden wurde; ihnen wurde eher etwas befohlen, als dass man sie anhörte"
 pam_rite_quarrel_championed_opinion: "Stellte sich während eines ökumenischen Konzils auf die Seite meines Ritus"
 pam_rite_quarrel_slighted_opinion: "Stellte sich während eines ökumenischen Konzils auf die Seite eines anderen Ritus und damit gegen meinen"
 pam_rite_quarrel_overruled_opinion: "Überstimmte meinen Ritus während eines ökumenischen Konzils"
 ecumenical_council_summons_events.0060.t: "Erster unter Gleichen"
 ecumenical_council_summons_events.0060.desc: "[ec_roman_champion.GetTitledFirstName|U] spricht für den [GetRiteByKey('roman_rite').GetName] und gibt keine Ruhe:\n\n„Alle Kirchen legen Rom gegenüber Rechenschaft ab, doch Rom gegenüber niemandem!“\n\n[ec_greek_champion.GetTitledFirstName|U] zählt fünf Patriarchen an [ec_greek_champion.Custom('DE_PRO_POS_S_3P')]en Fingern ab.\n\n„Welcher von denen hat je gekniet?“"
 ecumenical_council_summons_events.0060.a: "„Seid friedlich. Alle beide. Das Konzil hat noch nicht einmal begonnen.“"
 ecumenical_council_summons_events.0060.a.success: "Die beiden werden beruhigt, noch ehe die Halle Partei ergreifen kann"
 ecumenical_council_summons_events.0060.a.failure: "Niemand will mich anhören und die Halle ergreift Partei"
 ecumenical_council_summons_events.0060.b: "Petrus wurde der Schlüssel gegeben und Rom verwahrt ihn."
 ecumenical_council_summons_events.0060.c: "Rom ist Erster unter Gleichen. Nicht mehr."
 ecumenical_council_summons_events.0060.d: "Ich habe dieses Amt inne. Die Frage ist beantwortet."
 ecumenical_council_summons_events.0061.t: "Und der Sohn"
 ecumenical_council_summons_events.0061.desc: "„Zwei Worte“, sagt [ec_greek_champion.GetTitledFirstName] vom [GetRiteByKey('byzantine_rite').GetName]. „Zwei Worte, die die [GetRiteByKey('roman_rite').GetAdherentNamePlural] in das Glaubensbekenntnis hineinschmuggelten, während der Osten nie gefragt wurde.“\n\n„Die Wahrheit braucht keines Menschen Erlaubnis, sondern nur die Gottes“, antwortet [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0061.a: "Das Glaubensbekenntnis überlebte schon Schlimmeres, als dass sich jemand über es streitet."
 ecumenical_council_summons_events.0061.a.success: "Die Wortwahl wird vertagt, bevor sich das Argument verhärten kann"
 ecumenical_council_summons_events.0061.a.failure: "Das Argument verhärtet sich auf beiden Seiten zur Doktrin"
 ecumenical_council_summons_events.0061.b: "Die Worte wurden hinzugefügt, weil sie wahr sind."
 ecumenical_council_summons_events.0061.c: "Ein Konzil schrieb das Glaubensbekenntnis. Nur ein Konzil vermag es zu ändern."
 ecumenical_council_summons_events.0061.d: "Das Glaubensbekenntnis wird hier so aufgesagt werden, wie ich es aufsage."
 ecumenical_council_summons_events.0062.t: "Das Brot auf dem Altar"
 ecumenical_council_summons_events.0062.desc: "[ec_roman_champion.GetTitledFirstName|U] hält eine Oblate in die Höhe, dünn und blass wie eine Münze, und sagt:\n\n„Die [GetRiteByKey('roman_rite').GetAdherentNamePlural] brauchten niemals mehr.“\n\n[ec_greek_champion.GetTitledFirstName|U] legt einen aufgegangenen Laib daneben und fragt:\n\n„Ob die [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] wohl seit den Aposteln falsch lagen?“"
 ecumenical_council_summons_events.0062.a: "Beide Laibe werden morgen an meinem Altar gesegnet werden, und wir werden von beiden essen."
 ecumenical_council_summons_events.0062.a.success: "Beide Laibe sind gegessen und der Streit mit ihnen"
 ecumenical_council_summons_events.0062.a.failure: "Zwei Altäre stehen an diesem Abend nebeneinander und niemand wechselt zwischen ihnen"
 ecumenical_council_summons_events.0062.b: "Ungesäuert, als wäre es das letzte Abendmahl."
 ecumenical_council_summons_events.0062.c: "Aufgegangenes Brot für einen auferstandenen Herrn."
 ecumenical_council_summons_events.0062.d: "Brot ist Brot. Es ist der Segen, der den Unterschied macht."
 ecumenical_council_summons_events.0063.t: "Eine Sache der Sprache"
 ecumenical_council_summons_events.0063.desc: "Die Gebete werden laut auf Latein gelesen. Die [GetRiteByKey('byzantine_rite').GetAdherentNamePlural] auf den vollen Bänken warten auf eine Übersetzung, und die, die sie bekommen, ist krumm und schief. [ec_greek_champion.GetTitledFirstName|U] murmelt:\n\n„Die Römer argumentieren wie Anwälte. Wortreich, aber ohne Substanz.“\n\n„Die Griechen argumentieren wie Philosophen. Sie entscheiden nichts“, antwortet [ec_roman_champion.GetTitledFirstName]."
 ecumenical_council_summons_events.0063.a: "Dann lasst uns Worte finden, die in beiden Sprachen eine Botschaft übermitteln."
 ecumenical_council_summons_events.0063.a.success: "Eine Formulierung wurde gefunden, die keine Seite verdrehen kann"
 ecumenical_council_summons_events.0063.a.failure: "Beide Seiten gehen mit der Überzeugung auseinander, dass die jeweils andere Seite in böser Absicht argumentierte"
 ecumenical_council_summons_events.0063.b: "Sagt es auf Latein, und sagt es deutlich."
 ecumenical_council_summons_events.0063.c: "Die Väter schrieben auf Griechisch. Wir können es lesen."
 ecumenical_council_summons_events.0063.d: "Unter meinem Namen wird es in beiden Sprachen geschrieben. Und nun Schluss damit."
