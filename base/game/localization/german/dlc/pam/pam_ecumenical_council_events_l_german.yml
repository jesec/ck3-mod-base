 ecumenical_council_events.0123.t: "Wenn bald Krieg sein sollte"
 ecumenical_council_events.0123.desc: "Meine Verbündeten zanken miteinander, als wären sie Divisionen, die sich auf dem Schlachtfeld gegenüberstehen. Das ist ein unheilvolles Vorzeichen.\n\n„Wir haben nur ein einziges gemeinsames Interesse! Verdammt sollt Ihr sein! Sagt mir nicht, wie ich stimmen soll, als wäre ich ein Schoßtier! Ein kläffender Köter an der Leine von [ROOT.Char.GetTitledFirstName]!“, giftet [lead_conservative.GetTitledFirstName].\n\n„Was soll ich mit [Select_CString(lead_conservative.IsFemale, 'einer', 'einem')] Verbündeten machen, [Select_CString(lead_conservative.IsFemale, 'die', 'der')] nicht einmal mit simplen Worten einlösen will, was [lead_innovator.Custom('DE_PRO_PER_S_3P_N')] dem Reich ([ROOT.Char.GetPrimaryTitle.GetNameNoTier]) an sterblichen Leben versprach?“, gibt [lead_innovator.GetTitledFirstName] zurück."
 ecumenical_council_events.0123.support: "„Ich muss an die Treue aller appellieren, ja.“"
 ecumenical_council_events.0123.support_duel: "Warnt, dass Ihr dies als eine Entehrung ansehen werdet."
 ecumenical_council_events.0123.support_duel.success: "Eure Verbündeten stehen an Eurer Seite"
 ecumenical_council_events.0123.support_duel.success_halved: "Ein paar Verbündete stehen an Eurer Seite"
 ecumenical_council_events.0123.support_duel.failure: "Eure Verbündeten lassen sich nicht schikanieren"
 ecumenical_council_events.0123.oppose: "„Hier gilt Eure Treue nur der Schrift.“"
 ecumenical_council_events.0123.oppose_duel: "Ich werde Treue verlangen … von Verbündeten wie [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0123.oppose_duel.success: "Eure Verbündeten geben nach"
