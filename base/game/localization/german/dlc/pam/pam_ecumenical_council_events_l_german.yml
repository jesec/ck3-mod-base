 ecumenical_council_events.0110.t: "Übersteigertes Streben"
 ecumenical_council_events.0110.desc: "„Es ist nur eine geringfügige Änderung!“, sagt [lead_innovator.GetTitledFirstName]. „Und wir bringen uns als vielversprechende Kandidaten als [lead_innovator.GetFaith.ReligiousHeadName] in Stellung, wenn wir dabei helfen, es durchzusetzen.“\n\n„Euer übersteigertes Streben geht zu weit und wird noch unser aller Untergang sein“, höhnt [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0110.support: "Ein wenig Streben hat durchaus seine Berechtigung"
 ecumenical_council_events.0110.support_duel: "Setzt Euch weiterhin für den Fortschritt ein!"
 ecumenical_council_events.0110.support_duel.success: "Sie nehmen an: Es ist nur eine geringfügige Änderung"
 ecumenical_council_events.0110.support_duel.success_halved: "Ein paar nehmen den Verdienst der Unterstützung an"
 ecumenical_council_events.0110.support_duel.failure: "Eure Gier ist eindeutig"
 ecumenical_council_events.0110.oppose: "Hochmut kommt vor dem Fall"
 ecumenical_council_events.0110.oppose_duel: "Warnt vor den Übeln des Ehrgeizes!"
 ecumenical_council_events.0110.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
