 ecumenical_council_events.0115.t: "Geflüster und Einflusshebel"
 ecumenical_council_events.0115.desc: "Es schmerzt mich, zuzugeben, dass nicht alle Kleriker ihre Gewänder ehrenhaft erhielten. Sogar inmitten dieser erhabenen Institution muss ich mir derer äußerst bewusst sein, die den Schatten dem reinen Licht der Schrift vorziehen. Es dauert nicht lange und ich höre geraunte Worte in der Dunkelheit.\n\n„Jede Seele hier hungert nach … etwas. Wir als Weise müssen uns fragen, wer den Preis für diesen Hunger zahlen wird“, flüstert [lead_conservative.GetTitledFirstName] in bereitwillige Ohren. „Schamlose Ideologie, leidenschaftliche Reform … Nichts kommt einen teurer zu stehen …“\n\nEine andere Natter, [lead_innovator.GetTitledFirstName], fordert [lead_conservative.Custom('DE_PRO_PER_S_3P_A')] heraus: „Meint Ihr, dass #EMP Ihr#! den Preis für das Chaos zahlen werdet? In der kommenden Zeit der Unordnung, wenn wir frei sind, das Spiel so zu spielen, wie wir es wollen …?“"
 ecumenical_council_events.0115.support: "Brüche haben durchaus ihren Nutzen."
 ecumenical_council_events.0115.support_duel: "Sprecht gegenüber jenen, die klug genug sind, um Euch zuzuhören, von all den Möglichkeiten."
 ecumenical_council_events.0115.support_duel.success: "Ihre Gier treibt sie zu Euch"
 ecumenical_council_events.0115.support_duel.success_halved: "Ein paar werden die Störung suchen"
 ecumenical_council_events.0115.support_duel.failure: "Sie erkennen die Gelegenheit nicht"
 ecumenical_council_events.0115.oppose: "Eine kleine Mahlzeit, und danach hungern wir als [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] auf ewig."
 ecumenical_council_events.0115.oppose_duel: "Sucht die Wahrheit in der Schrift oder Ihr seid verloren."
 ecumenical_council_events.0115.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0115.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0115.oppose_duel.failure: "Sie sind an dunkle Begierden verloren"
