 # Flavor Events
 ecumenical_council_summons_events.0001.t: "Die Sorgen von [guest_1.GetTitleAsNameNoTooltip]"
 ecumenical_council_summons_events.0001.desc: "„Und dieses Ärgernis, das ich habe … Im Namen der höchsten Macht ([guest_1.GetFaith.HighGodName]), es nagt an mir. Ich kann kaum schlafen …“, vertraut sich [guest_1.GetTitledFirstName] [guest_2.GetTitledFirstName] mit gequältem Flüstern an.\n\n„Ich verstehe …“, nickt [guest_2.GetFirstNameNoTooltip]. „Wenn [Select_CString(host.IsFemale, 'unsere Gastgeberin, die', 'unser Gastgeber, der')] [host.GetTitleAsNameNoTooltip], von Euch davon erführe, könnte [host.Custom('DE_PRO_PER_S_3P_N')] Euch womöglich einen spirituellen Ratschlag geben?“"
 ecumenical_council_summons_events.0001.a: "Was könnte [guest_1.Custom('DE_PRO_PER_S_3P_A')] so sehr besorgen …"
 ecumenical_council_summons_events.0001.a.learn_secret_tt: "Ihr erfahrt das Geheimnis von [guest_1.GetShortUIName]"
 ecumenical_council_summons_events.0001.b: "[guest_1.GetFirstNameNoTooltip|U] braucht lediglich etwas freundschaftlichen Trost."
 ecumenical_council_summons_events.0001.c: "Es ist besser, nichts davon zu wissen."
 friend_comforted_at_council_reason: "[CHARACTER.GetShortUIName|U] tröstete [TARGET_CHARACTER.GetShortUIName] wegen des Geheimnisses von [TARGET_CHARACTER.GetShortUIName] auf einem ökumenischen Konzil."
 friend_comforted_at_council_reason_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] tröstete [CHARACTER.GetShortUIName] wegen des Geheimnisses von [CHARACTER.GetShortUIName] auf einem ökumenischen Konzil."
 rival_eavesdropped_on_secret_reason: "[CHARACTER.GetShortUIName|U] wurde bei dem Versuch erwischt, auf einem Konzil das Geheimnis von [TARGET_CHARACTER.GetShortUIName] auszuspionieren."
 rival_eavesdropped_on_secret_reason_corresponding: "[CHARACTER.GetShortUIName|U] erwischte [TARGET_CHARACTER.GetShortUIName] auf einem Konzil dabei, [CHARACTER.Custom('DE_PRO_POS_S_3P')] Geheimnis ausspionieren zu wollen."
 ecumenical_council_summons_events.0010.t: "Das Geheimnis"
 ecumenical_council_summons_events.0010.desc: "[Select_CString(host.IsFemale, 'Unsere Gastgeberin', 'Unser Gastgeber')] [host.GetTitledFirstName] scheint meine Anwesenheit nicht zu bemerken, während [host.Custom('DE_PRO_PER_S_3P_D')] ein Bediensteter dabei hilft, [host.Custom('DE_PRO_POS_S_3P')]e Kleidung anzulegen.\n\n„Im Namen der höchsten Macht ([host.GetFaith.HighGodName]), verzeiht mir …“, murmelt [host.Custom('DE_PRO_PER_S_3P_N')]. „Solche Gerüchte über meine … Vorlieben. Zu glauben, dass ich, der Vikar Christi, mich derlei Neigungen hingebe! Solche Gerüchte dürfen niemals meinen Kardinälen zu Ohren kommen.“"
 ecumenical_council_summons_events.0010.a: "„Ich kann sehen, dass Ihr reumütig seid, [host.GetTitleAsNameNoTooltip].“"
 ecumenical_council_summons_events.0010.a.learn_secret_tt: "Ihr erfahrt von dem Geheimnis von [host.GetShortUIName]"
 ecumenical_council_summons_events.0010.b: "„[ROOT.Char.Custom('RandomBibleQuoteShort')]“"
 ecumenical_council_summons_events.0010.b.flavor: "[host.Custom('DE_PRO_PER_S_3P_N')|U] findet Trost in der Schrift!"
 ecumenical_council_summons_events.0010.c: "Manche Dinge sollte man besser nicht wissen."
 ecumenical_council_summons_events.0020.t: "Versorgungsscherereien"
 ecumenical_council_summons_events.0020.desc.intro: "„Wenn es denn sein muss …“, entlässt [host.GetTitledFirstName] einen Geistlichen gestenreich.\n\nMit einem „[ROOT.Char.GetTitledFirstNameNoTooltip]!“ sucht [host.Custom('DE_PRO_PER_S_3P_N')] nach meiner Aufmerksamkeit."
 ecumenical_council_summons_events.0020.desc.caravans: "„Die Karawanen, die unsere Vorräte befördern, sind noch nicht angekommen."
 ecumenical_council_summons_events.0020.desc.servants: "„Es gibt einfach nicht genügend Bedienstete, um sich all unserer Gäste anzunehmen."
 ecumenical_council_summons_events.0020.desc.overcrowded: "„Es gibt einfach zu viele Gäste für die Unterkünfte in [ROOT.Char.GetCurrentLocation.GetName], die für unser Konzil bereitgestellt wurden."
 ecumenical_council_summons_events.0020.desc.outro: "Ich nehme an, Ihr habt keine Lösung für unsere Scherereien?“"
 ecumenical_council_summons_events.0020.aaa: "„Dies hier sind meine Lande, Eure Heiligkeit. Ich werde mich darum kümmern.“"
 ecumenical_council_summons_events.0020.aa: "Ich weiß, dass #EMP viele#! Leute mir einen Gefallen schulden …"
 ecumenical_council_summons_events.0020.a: "„Nichts, was Gold nicht wieder geraderücken könnte, Eure Heiligkeit!“"
 ecumenical_council_summons_events.0020.b: "„Ich werde all meine Gefallen einfordern!“"
 ecumenical_council_summons_events.0020.b.flavor: "[host.GetShortUIName|U] behält mich als [Select_CString(ROOT.Char.IsFemale, 'einflussreiche Kandidatin', 'einflussreichen Kandidaten')] in Erinnerung behalten …"
 ecumenical_council_summons_events.0020.c: "Ich kann nur ein bescheidenes Gebet anbieten …"
 ecumenical_council_summons_events.0020.papabile_tt: "Euer [papabile_score|E] für die Papstnachfolge erhöht sich um #P +10#!"
 ecumenical_council_summons_events.0030.t: "Der Gnade der Elemente ausgeliefert"
 ecumenical_council_summons_events.0030.desc.intro: "Der Wind heult, und der Regen peitscht die Straße entlang, als das Konzil näherrückt."
 ecumenical_council_summons_events.0030.desc.dry_season: "Was unüblich für diese Jahreszeit ist."
 ecumenical_council_summons_events.0030.desc.wet_season: "Doch derart schlechtes Wetter ist zu dieser Jahreszeit nicht ungewöhnlich."
 ecumenical_council_summons_events.0030.desc.outro: "[chaplain.GetFirstName|U], mein [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))] zittert wie Espenlaub.\n\n„[Select_CString(ROOT.Char.IsFemale, 'Meine Lehnsherrin', 'Mein Lehnsherr')] … ich fürchte, ich werde nicht in der Lage sein, dem Konzil beizuwohnen. Dieser Sturm, diese Kälte … Beides tut meinem Leib nicht gut. Ich habe zu viel Schleim in mir …“"
 ecumenical_council_summons_events.0030.aa: "„Ich habe #EMP viel#! über dieses Leiden gelesen!“"
 ecumenical_council_summons_events.0030.a: "Ich muss die besten Ärzte rufen!"
 ecumenical_council_summons_events.0030.b: "„Ich werde Euch in meine Gebete einschließen.“"
 ecumenical_council_summons_events.0030.c: "Das Leben nimmt seinen Lauf."
 ecumenical_council_summons_events.0040.t: "Lampenfieber"
 ecumenical_council_summons_events.0040.desc: "Als der Zeitpunkt des Konzils näherrückt, sehe ich, wie mein[chaplain.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))] [chaplain.GetFirstName] angespannt im Hof auf und ab geht.\n\n„Da ist die Frage in Sachen [ROOT.Char.GetFaith.ReligiousSymbol], natürlich, natürlich … und was ist mit den Punkten in Sachen [chaplain.CustomFixedRandom('random_learning_topic')] …?“, höre ich [chaplain.Custom('DE_PRO_PER_S_3P_A')] vor sich hin murmeln."
 ecumenical_council_summons_events.0040.aa: "„Ihr müsst an die wissenden Mächte ([ROOT.Char.GetFaith.KnowledgeGodName]) denken, [chaplain.GetFirstNameNoTooltip].“"
 ecumenical_council_summons_events.0040.aa.flavor: "Ein wenig spirituelle Führung wirkt gewiss beruhigend."
 ecumenical_council_summons_events.0040.a: "[chaplain.Custom('DE_PRO_PER_S_3P_N')|U] sollte daran erinnert werden, dass [chaplain.Custom('DE_PRO_PER_S_3P_N')] auch mich repräsentiert."
 ecumenical_council_summons_events.0040.a.tt.success: "Eure Diplomatie trägt Früchte"
 ecumenical_council_summons_events.0040.a.tt.failure: "[chaplain.GetShortUIName|U] ist sich Eurer Absichten nicht sicher"
 ecumenical_council_summons_events.0040.b: "Ich kann meine Stellung immer zu [chaplain.Custom('DE_PRO_POS_S_3P')]en Gunsten einsetzen …"
 ecumenical_council_summons_events.0040.c: "Nichts, was ein Gebet nicht lindern könnte."
 friend_reassured_at_council: "[CHARACTER.GetShortUIName|U] beschwichtigte [TARGET_CHARACTER.GetShortUIName] während eines ökumenischen Konzils."
 friend_reassured_at_council_corresponding: "[CHARACTER.GetShortUIName|U] wurde von [TARGET_CHARACTER.GetShortUIName] während eines ökumenischen Konzils beschwichtigt."
 ecumenical_council_summons_events.0050.t: "Angezweifelter Glaube"
 ecumenical_council_summons_events.0050.desc.intro: "[pious_guest.GetTitledFirstName|U] kann [pious_guest.Custom('DE_PRO_POS_S_3P')]e Belustigung beim Anblick von [non_pious_guest.GetTitledFirstName] kaum zurückhalten.\n\n„Habt Ihr das gesehen, [ROOT.Char.GetTitleAsNameNoTooltip]?“, spricht [pious_guest.Custom('DE_PRO_PER_S_3P_N')] mich an. „[non_pious_guest.GetFirstNameNoTooltip|U] verdient Lob! Ich glaubte eigentlich, dass der einzige Sitz, den [non_pious_guest.Custom('DE_PRO_PER_S_3P_N')] kennt, jener in [Glossary('Badehäusern', 'BATHHOUSES_GLOSS')] wäre."
 ecumenical_council_summons_events.0050.desc.non_pious_host: "Kaum zu glauben, dass [non_pious_guest.Custom('DE_PRO_PER_S_3P_N')] sich selbst zum Oberhaupt der [ROOT.Char.GetFaith.GetAdherentNamePlural] erklärt hat.“"
 ecumenical_council_summons_events.0050.aaa: "[chaplain.GetTitledFirstNameNoTooltip|U] wäre [Select_CString(chaplain.IsFemale, 'die perfekte Frau', 'der perfekte Mann')] für die Aufgabe."
 ecumenical_council_summons_events.0050.desc.non_pious_fallback: "Es verblüfft mich, dass [non_pious_guest.Custom('DE_PRO_PER_S_3P_N')] sich entschieden hat, mit uns an diesem Konzil teilzunehmen.“"
 ecumenical_council_summons_events.0050.aa: "Ein guter Hirte muss aus der Mitte der eigenen Schäfchen hervorgehen …"
 ecumenical_council_summons_events.0050.a: "„Ich könnte dafür sorgen, dass #EMP alle#! davon erfahren … für eine gewisse Summe.“"
 ecumenical_council_summons_events.0050.b: "„Woher wisst #EMP Ihr#!, wer die Badehäuser regelmäßig besucht, [pious_guest.GetTitleAsNameNoTooltip]?“"
 ecumenical_council_summons_events.0050.c: "Dank sei der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) für etwas Unterhaltung."
 BATHHOUSES_GLOSS: "In vielen mittelalterlichen Städten erlangten die Badehäuser – einst für einfache Waschungen gedacht – einen zweifelhaften Ruf. Ihre verborgenen Räumlichkeiten boten ausreichend Privatsphäre, damit Lustknaben und Freudenmädchen ihren Tätigkeiten nachgehen konnten."
 friend_defended_piety_at_ec_reason: "[CHARACTER.GetShortUIName|U] verteidigte die Frömmigkeit von [TARGET_CHARACTER.GetShortUIName] bei einem ökumenischen Konzil."
 friend_defended_piety_at_ec_reason_corresponding: "Viele Zeugen erklärten, [TARGET_CHARACTER.GetShortUIName|U] hätte die Frömmigkeit von [CHARACTER.GetShortUIName] bei einem ökumenischen Konzil verteidigt."
 rival_accused_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] bezichtigte [CHARACTER.GetShortUIName], sich auf einem ökumenischen Konzil pietätlos verhalten zu haben."
 rival_accused_at_council_reason_corresponding: "[CHARACTER.GetShortUIName|U] wurde von [TARGET_CHARACTER.GetShortUIName] bezichtigt, sich auf einem ökumenischen Konzil pietätlos verhalten zu haben."
