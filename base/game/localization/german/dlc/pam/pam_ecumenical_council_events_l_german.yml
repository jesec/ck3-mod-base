l_german:
 ecumenical_council_events.0001: "Das Konzil von [my_location.GetBaronyNameExplicitlyNoTooltip]"
 ecumenical_council_events.0001.desc_intro: "Der Versammlungsort ([ROOT.Char.GetFaith.HouseOfWorshipPlural]) von [my_location.GetBaronyNameExplicitly] wurde für den Anlass wunderschön geschmückt. Die Edelsten der Christenheit folgten"
 ecumenical_council_events.0001.host: "meinem Ruf."
 ecumenical_council_events.0001.dislikes_host: "dem Ruf, den [Select_CString(theologian.IsFemale, 'die', 'der')] [host.Custom('InsultAdjective')|l]e [host.GetTitledFirstName] besitzt."
 ecumenical_council_events.0001.likes_host: "dem Ruf, den [Select_CString(theologian.IsFemale, 'die', 'der')] [host.Custom('ComplimentAdjective')|l]e [host.GetTitledFirstName] besitzt."
 ecumenical_council_events.0001.neutral: "dem Ruf von [host.GetTitledFirstName]."
 ecumenical_council_events.0001.intent_arrived: "\n\nUnd schon erblicke ich [intent_target.GetTitledFirstName] in der Versammlung. Perfekt!"
 ecumenical_council_events.0001.waiting_for_intent: "\n\nEs ist lediglich eine Frage der Zeit, bis [intent_target.GetTitledFirstName] erscheint …"
 ecumenical_council_events.0001.no_intent_target: "\n\nIch muss nur noch auf die Ankunft warten!"
 ecumenical_council_events.0001.a.bad: "Wenn wir denn keine andere Wahl haben."
 ecumenical_council_events.0001.a.good: "Geheiligt sei unsere Pflicht."
 ecumenical_council_events.0002.t: "Der Ruf"
 ecumenical_council_events.0002.desc_intro: "Die Türen des Gotteshauses ([host.GetFaith.HouseOfWorship]) können nun geöffnet werden und unser großes Werk kann beginnen! Es wird Zeit"
 ecumenical_council_events.0002.reformist: "Bündnisse zwischen Königen und Priestern gleichermaßen zu schmieden."
 ecumenical_council_events.schism_crisis_intro: "\n\nDie Begrüßung ist herzlich, das Schweigen zwischen ihnen nicht. Rom und Konstantinopel tauschen keine Höflichkeiten mehr aus, und jeder ungelöste Streit ist ein weiterer Riss im einen Leib Christi."
 ecumenical_council_events.0002.first_tenet: "\n\nDie Luft ist erfüllt von Geplapper. Die Zusammengerufenen beginnen eine Haltung in Sachen [ec_debate_topic_1.GetName(ROOT.GetCharacter.GetRite)] und anderen drängenden Fragen zu entwickeln."
 ecumenical_council_events.0002.host: "\n\nIch breite die Arme aus und heiße meine Kinder willkomen, damit wir uns gemeinsam dieser folgenschweren Aufgabe stellen."
 ecumenical_council_events.0002.guest: "\n\n„Willkommen, meine Kinder. Möge der Herr uns bei unserer folgenschweren Aufgabe leiten!“ [host.GetTitledFirstName|U] winkt uns herbei."
 ecumenical_council_events.0002.a: "Amen."
 ecumenical_council_events.0010.t: "Unsere Haltung in Sachen [ec_debate_topic_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]"
 ecumenical_council_events.0010.desc.intro: "Die erste Debatte wird geführt in Sachen [ec_debate_topic_2.GetName(ROOT.GetCharacter.GetRite)]. Das derzeitige kanonische Recht behauptet den Status als [host.Custom('GetEcumenicalDebateTenet2StatusText')|l]. [lead_portrait.GetTitledFirstName|U] bereitet die Bühne:\n\n"
 ecumenical_council_events.0010.desc.intro_permit_promote: "\n\n„Mehr und mehr Menschen halten dies für einen zentralen Teil ihrer Verehrung“, meldet mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_chaplain'))] [court_chaplain.GetFirstName]."
 ecumenical_council_events.0010.desc.intro_permit_demote: "\n\n„Das Verbot einer Praktik birgt ein gewisses Risiko, doch in diesem Fall ist es gerechtfertigt“, versichert mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_chaplain'))] [court_chaplain.GetName]."
 ecumenical_council_events.0010.desc.intro_core_demote_bad: "\n\n„Die Praktik ist immer noch beliebt. Sie verdammen zu lassen … birgt gewisse Risiken“, sorgt sich mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_chaplain'))] [court_chaplain.GetName]."
 ecumenical_council_events.0010.desc.intro_core_demote_good: "\n\n„Die Praktik verliert weiter Anhänger. Es wäre ein geeigneter Zeitpunkt, ihre Unterstützung zu beenden“, rät mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_chaplain'))] [court_chaplain.GetName]."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_good: "\n\n„Die Praktik gewinnt an Beliebtheit. Es könnte weise sein, sie gutzuheißen“, schlägt mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_chaplain'))] [court_chaplain.GetName] vor."
 ecumenical_council_events.0010.desc.intro_prohibited_promote_bad: "\n\n„Die Praktik ist kaum bekannt. Es wäre gefährlich, als Verfechter dieser Sache aufzutreten“, warnt mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_chaplain'))] [court_chaplain.GetName]."
 ecumenical_council_events.0010.desc.fallback.explanation: "„Dies ist eine Lehre, der unser Glaube noch keinen festen Platz zugewiesen hat. Es gilt diesen nun zu bedenken, da man die Angelegenheit diesem Konzil vorlegte.“"
 ecumenical_council_events.0010.desc.peace_of_god.explanation: "„Man fragt uns, ob wir einen Frieden und Waffenstillstand im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) aufrechterhalten sollen. Müssen unsere Völker Eide schwören, Kirchen, Geistliche und Unbewaffnete vor Plünderung und Blutvergießen zu schützen? Können wir dafür sorgen, dass niemand an Feiertagen zu den Waffen greift, unter Androhung einer Verbannung aus der [ROOT.Char.GetFaith.GetAdjective|l]en Kirche?“"
 ecumenical_council_events.0010.desc.dulia.explanation: "„Man fragt uns, ob die Heiligen hoch verehrt werden sollen. Können ihre Reliquien als heilig gelten, ihre Festtage begangen und ihre Fürsprache erbeten werden, während unsere Anbetung weiterhin allein der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) gilt?“"
 ecumenical_council_events.0010.desc.transubstantiation.explanation: "„Man fragt uns, ob durch die Weihe des Priesters Brot und Wein auf dem Altar tatsächlich in Leib und Blut Christi verwandelt werden.“"
 ecumenical_council_events.0010.desc.ora_et_labora.explanation: "„Man fragt uns, ob ein heiliges Leben Gebet und Arbeit in Einklang bringen muss. Ist Müßiggang der Feind der Seele? Sollte unsere Arbeit auf dem Feld oder im Skriptorium genauso verehrt werden wie die Stunden voller tätiger Hingabe ([ROOT.Char.Custom('GetReligiousRite')])?“"
 ecumenical_council_events.0010.desc.hyperdulia.explanation: "„Man fragt uns, ob die Heilige Mutter Maria, die Gottesgebärerin, über alle anderen Heiligen zu verehren sei.“"
 ecumenical_council_events.0010.desc.simony.explanation: "„Man fragt uns,, ob heilige Ämter, Segnungen oder Sakramente gegen Gold gekauft und verkauft werden können.“"
 ecumenical_council_events.0010.desc.monophysitism.explanation: "„Man fragt uns, ob Christus nur eine Natur hat, die gänzlich göttlich ist. Ob seine Menschlichkeit so weit im Göttlichen aufging, dass im fleischgewordenen Wort nichts als das Göttliche übrig blieb.“"
 ecumenical_council_events.0010.desc.acts_of_apostles.explanation: "„Man fragt uns, ob die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche so leben muss wie in der Apostelgeschichte. Sollen wir unsere Missionare mit apostolischem Eifer entsenden, um jenen, die noch in der Finsternis leben, das Wort zu bringen?“"
 ecumenical_council_events.0010.desc.purgatory.explanation: "„Man fragt uns, ob die meisten Seelen, die weder verdammt noch bereits rein sind, nach dem Tod geläutert werden. Können die Gebete und Riten der Lebenden ihnen helfen, bevor sie vor der höchsten Macht ([ROOT.Char.GetFaith.HighGodName|U]) stehen dürfen?“"
 ecumenical_council_events.0010.desc.be_fruitful_and_multiply.explanation: "„Man fragt uns, ob die Zeugung von Kindern eine heilige Aufgabe ist. Sollen die Gläubigen die Erde mit ihren Nachkommen füllen?“"
 ecumenical_council_events.0010.desc.apostolic_succession.explanation: "„Man fragt uns, ob die Autorität der Bischöfe tatsächlich auf ihrer nie gebrochenen Nachfolge von den Aposteln beruht.“"
 ecumenical_council_events.0010.desc.confession.explanation: "„Man fragt uns, ob jeder [ROOT.Char.GetFaith.GetAdherentName] seine Sünden einem Priester zur Absolution beichten muss. Ist das Beichtgeheimnis unantastbar zu wahren?“"
 ecumenical_council_events.0010.desc.original_sin.explanation: "„Man fragt uns, ob jede Seele Adams Sünde erbt. Sind wir von Geburt an befleckt und der Taufgnade bedürftig?“"
 ecumenical_council_events.0010.desc.celestial_hierarchy.explanation: "„Man fragt uns, ob die heiligen Engel in geordneten Rängen unter der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) stehen, wobei jeder Rang über dem nächsten verortet ist. Sollten die Ämter der [ROOT.Char.GetFaith.GetAdjective|l]e Kirche die himmlische Ordnung widerspiegeln?“"
 ecumenical_council_events.0010.desc.miles_christi.explanation: "„Man fragt uns, ob die Gläubigen Soldaten Christi sein sollen. Sind wir verpflichtet, zum Schwert zu greifen und die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche zu verteidigen, wenn wir dazu aufgerufen werden?“"
 ecumenical_council_events.0010.desc.scholasticism.explanation: "„Man fragt uns, ob der Glaube durch Vernunft nach Erkenntnis streben kann. Sollten die Schulen Dialektik und Philosophie zur Ordnung und Verteidigung der Lehre heranziehen?“"
 ecumenical_council_events.0010.desc.adoptionism.explanation: "„Man fragt uns, ob Christus in seiner Menschlichkeit durch Adoption der Sohn der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) wurde.“"
 ecumenical_council_events.0010.desc.love_thy_neighbour.explanation: "„Man fragt uns, ob die Nächstenliebe jeden, der sich [ROOT.Char.GetFaith.GetAdherentName] nennt, selbst den Fremden und den Feind, als sicheres Maß der Liebe zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) binden muss.“"
 ecumenical_council_events.0010.desc.divine_liturgy.explanation: "„Man fragt uns, ob die tätige Hingabe ([ROOT.Char.Custom('GetReligiousRite')]) mit Gesang, Weihrauch und geordnetem Ritus der Hauptweg sein sollte, über den sich Gläubige der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) nähern.“"
 ecumenical_council_events.0010.desc.miaphysitism.explanation: "„Man fragt uns, ob in Christus das Göttliche und das Menschliche eine einzige verkörperte Natur bilden, ohne Trennung und ohne Verwirrung.“"
 ecumenical_council_events.0010.desc.hesychasm.explanation: "„Man fragt uns, ob heilige Stille und das einfache Gebet des Herzens – endlos wiederholt – der Seele eine Vision des ungeschaffenen Lichts [ROOT.Char.GetFaith.HighGodNamePossessive|U] gewähren können.“"
 ecumenical_council_events.0010.desc.anachoresis.explanation: "„Wir werden gefragt, ob der Rückzug von der Welt heilig ist. Ist die Einsamkeit eines Eremiten der wahre Weg zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName])?“"
 ecumenical_council_events.0010.desc.mortification_of_the_flesh.explanation: "„Wir werden gefragt, ob der Geist erweitert wird, wenn der Leib den Einschränkungen des Fastens, dem Bußgewand und der Geißel ausgesetzt ist.“"
 ecumenical_council_events.0010.desc.holy_myron.explanation: "„Wir werden gefragt, ob das [Glossary('Chrisam', 'CHRISM_GLOSS')] die Taufe und die Krönung mit der Gabe des Heiligen Geistes besiegeln sollte.“"
 CHRISM_GLOSS: "Griechisch für „Salbung“. Das #bold Chrisam#! ist das wohlriechende heilige Öl, das von einem Bischof geweiht wurde und mit dem Gläubige man während der Taufe und der Konfirmation salbt. Manchmal findet es auch bei einer königlichen Krönung Verwendung."
 ecumenical_council_events.0010.desc.khachkar.explanation: "„Wir werden gefragt, ob aus Stein gemeißelte Kreuze als bleibende öffentliche Zeugnisse des Glaubens unter uns stehen dürfen – als Zeichen heiligen Bodens und der Toten.“"
 ecumenical_council_events.0010.desc.philanthropia.explanation: "„Wir werden gefragt, ob die Fürsorge für die Armen eine bindende Verpflichtung der #L [ROOT.Char.GetFaith.GetAdjective|l]en#! Kirche ist. Müssen wir Almosen sammeln und Hospitäler und Häuser der Barmherzigkeit errichten?“"
 ecumenical_council_events.0010.desc.aniconism.explanation: "„Wir werden gefragt, ob jedes heilige Bild aus unseren Kirchen verbannt werden muss. Ist deren Verehrung wahrhaftig Götzendienst an weltlichen Bildern, die unsere Blicke und unseren Verstand von der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) ablenken?“"
 ecumenical_council_events.0010.desc.alexandrian_catechism.explanation: "„Wir werden gefragt, ob die Schrift auf verborgene spirituelle Bedeutungen hin ausgelegt werden muss. Können griechische Bildung und Allegorien eröffnen, was der Buchstabe allein verbirgt?“"
 ecumenical_council_events.0010.desc.armed_pilgrimages.explanation: "„Wir werden gefragt, ob das Kreuz zu nehmen und unter einem heiligen Zweck zu marschieren, selbst schon eine Form der Hingabe zu Christus darstellt. Kann das Schwert die Pilgerreise beschützen und zurückerobern, was die Ungläubigen halten?“"
 ecumenical_council_events.0010.desc.carnal_exaltation.explanation: "„Wir werden gefragt, ob die Freuden des Fleischs die Seele dem Göttlichen näherbringen. Sollte man die Begierde dann nicht ehren und nach ihr streben, anstatt sie als Sünde zu verteufeln?“"
 ecumenical_council_events.0010.desc.communal_identity.explanation: "„Wir werden gefragt, ob Glaube und Volkszugehörigkeit eins sind unter der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]). Müssen dann Außenseiter außerhalb der echten Schar bleiben?“"
 ecumenical_council_events.0010.desc.communion.explanation: "„Wir werden gefragt, ob gemeinsam geteilte Riten die Gegenwart der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) heraufbeschwören. Müssen jene, die sich diesen nicht anschließen wollen, außerhalb der wahren Schar bleiben?“"
 ecumenical_council_events.0010.desc.consolamentum.explanation: "„Wir werden gefragt, ob eine letzte spirituelle Reinigung kurz vor dem Tod alle Sünden fortwäscht und ob die so Gereinigten dann Essen und das Leben verweigern müssen, damit die Sünde nicht zurückkehrt.“"
 ecumenical_council_events.0010.desc.divine_marriage.explanation: "„Wir werden gefragt, ob die Ehe innerhalb der heiligen Blutlinie bleiben muss, sogar bei Verwandten, deren Nähe die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche als verboten ansieht.“"
 ecumenical_council_events.0010.desc.gnosticism.explanation: "„Wir werden gefragt, ob das Heil in verborgenem Wissen liegt, das nur den Eingeweihten eröffnet wird und den göttlichen Funken befreit, um ihn zu seinem Ursprung zurückkehren zu lassen.“"
 ecumenical_council_events.0010.desc.mendicant_preachers.explanation: "„Wir werden gefragt, ob Mönche nichts besitzen sollten. Sollten sie von Ort zu Ort ziehen und von Almosen leben, um das Wort der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) zu predigen?“"
 ecumenical_council_events.0010.desc.pacifism.explanation: "„Wir werden gefragt, ob es im Leben als [ROOT.Char.GetFaith.GetAdherentName] keinen Platz für ein Schwert gibt. Ist die Vorstellung eines gerechten Kriegs falsch?“"
 ecumenical_council_events.0010.desc.pentarchy.explanation: "„Wir werden gefragt, ob die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche von fünf Patriarchalsitzen in kollegialer Herrschaft geführt werden muss. Leugnet das nicht die Vorherrschaft des obersten Fürsprechers der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])?“"
 ecumenical_council_events.0010.desc.unrelenting_faith.explanation: "„Wir werden gefragt, ob ohne Nachgeben am Glauben festgehalten werden muss, auch unter Verfolgung, Mühsal und Zweifel. Sind wir verpflichtet, fest zu glauben, was auch immer es kostet?“"
 ecumenical_council_events.0010.desc.vows_of_poverty.explanation: "„Wir werden gefragt, ob wir der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) am besten dienen, indem wir ein Armutsgelübde ablegen, so wie es die Apostel taten.“"
 ecumenical_council_events.0010.desc.pastoral_isolation.explanation: "„Wir werden gefragt, ob die Schar allein gelassen werden muss, um ihren eigenen Weg beizubehalten. Sollte die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche sich weder bei Außenseitern einmischen noch deren Einmischung herausfordern?“"
 ecumenical_council_events.0010.desc.adaptive.explanation: "„Wir werden gefragt, ob es der Schar schaden würde, wenn wir die uneingeschränkte Befolgung unserer Bräuche und Beschränkungen verlangen. Solange das Herzstück unseres Glaubens unverändert bleibt, können unsere Gesetze dann an die Welt angepasst werden, in der die Gläubigen bestehen müssen?“"
 ecumenical_council_events.0010.desc.esotericism.explanation: "„Wir werden gefragt, ob die Mysterien der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) uns dazu zwingen, Wissen in der Welt um uns herum zu suchen.“"
 ecumenical_council_events.0010.desc.legalism.explanation: "„Wir werden gefragt, ob das heilige Recht für jede Handlung eines [ROOT.Char.GetFaith.GetAdjective|l]en Lebens verbindlich ist. Steht kein Sünder, ob königlich oder kaiserlich, über dem Gesetz?“"
 ecumenical_council_events.0010.desc.literalism.explanation: "„Wir werden gefragt, ob die heilige Schrift unabänderlich und vollständig ist und die einzige Sammlung der Weisheit der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) darstellt.“"
 ecumenical_council_events.0010.desc.reincarnation.explanation: "„Wir werden gefragt, ob die Seele über viele Leben hinweg zurückkehrt und das Urteil der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) nicht nur einmal erfährt.“"
 ecumenical_council_events.0010.desc.religious_legal_pronouncements.explanation: "„Wir werden gefragt, ob die Doktoren der [ROOT.Char.GetFaith.GetAdjective|l]en Kirche verbindliche Regeln für jede Frage des Glaubens und des Rechts veranlassen können.“"
 ecumenical_council_events.0010.desc.struggle_submission.explanation: "„Wir werden gefragt, ob das [ROOT.Char.GetFaith.GetAdjective|l]e Leben sich selbst durch Kampf und Unterwerfung bilden muss. Muss der Gläubige völlig dem Willen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName|U]) folgen?“"
 ecumenical_council_events.0010.desc.false_conversion_sanction.explanation: "„Wir werden gefragt, ob man als [ROOT.Char.GetFaith.GetAdherentName] im Fall einer Verfolgung einen anderen Glauben vortäuschen darf.“"
 ecumenical_council_events.0010.desc.tax_nonbelievers.explanation: "„Wir werden gefragt, ob Ungläubige unter der [ROOT.Char.GetFaith.GetAdjective|l]en Herrschaft bleiben können, wenn sie eine Steuer für ihren Schutz zahlen.“"
 ecumenical_council_events.0010.desc.asceticism.explanation: "„Wir werden gefragt, ob man die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) durch Hunger, Entbehrung und Verzicht auf Bequemlichkeit erreichen kann.“"
 ecumenical_council_events.0010.desc.bhakti.explanation: "„Wir werden gefragt, ob sich jede Seele in liebevoller Hingabe an einen Aspekt des Göttlichen binden soll.“"
 ecumenical_council_events.0010.desc.dharmic_pacifism.explanation: "„Wir werden gefragt, ob jedwede Verletzung lebendiger Dinge verboten ist. Sollten wir es auch vermeiden, niederen Tieren und Insekten zu schaden?“"
 ecumenical_council_events.0010.desc.inner_journey.explanation: "„Wir werden gefragt, ob die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) hauptsächlich durch Kontemplation und Selbsterkenntnis angestrebt wird.“"
 ecumenical_council_events.0010.desc.ritual_hospitality.explanation: "„Wir werden gefragt, ob wir die heilige Pflicht haben, jeden Fremden an unseren Tisch einzuladen.“"
 ecumenical_council_events.0010.desc.adorcism.explanation: "„Wir werden gefragt, ob man die Geister dieser Welt ehren und willkommen heißen soll, auf dass sie uns helfen mögen, anstatt sie als unreine Mächte zu verstoßen.“"
 ecumenical_council_events.0010.desc.ancestor_worship.explanation: "„Wir werden gefragt, ob unsere Vorfahren mit Gebeten und Gaben geehrt werden müssen, sodass sie über uns wachen und uns führen.“"
 ecumenical_council_events.0010.desc.astrology.explanation: "„Wir werden gefragt, ob der Wille der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) in den Sternen steht. Hütet der Himmel die Geheimnisse unseres Schicksals?“"
 ecumenical_council_events.0010.desc.hedonistic.explanation: "„Wir werden gefragt, ob das Vergnügen ein Geschenk ist, das man als eine Form der Verehrung anstreben sollte.“"
 ecumenical_council_events.0010.desc.human_sacrifice.explanation: "„Wir werden gefragt, ob menschliches Leben auf dem Altar geopfert werden soll. Soll man Blut als ein heiliges Geschenk an die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) vergießen?“"
 ecumenical_council_events.0010.desc.mystical_birthright.explanation: "„Wir werden gefragt, ob bestimmte Seelen von Geburt an für heilige Macht und spirituelle Führung als Auserwählte auserkoren sind, noch ehe sie durch die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche auf irgendeine Weise gesalbt werden.“"
 ecumenical_council_events.0010.desc.ritual_celebrations.explanation: "„Wir werden gefragt, ob der [ROOT.Char.GetFaith.GetAdjective|l]e Kalender reichlich gefüllt sein sollte mit heiligen Festen, um die Gläubigen aneinander zu binden.“"
 ecumenical_council_events.0010.desc.sacred_childbirth.explanation: "„Wir werden gefragt, ob die Geburt mit heiligen Riten vorbereitet werden muss. Muss der Ort der Geburt gereinigt werden, damit die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) Mutter und Kind segnen kann?“"
 ecumenical_council_events.0010.desc.sanctity_of_nature.explanation: "„Wir werden gefragt, ob Haine, rauschende Flüsse und taugeküsste Täler heilig sind. Sollten wir in der Wildnis die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) suchen?“"
 ecumenical_council_events.0010.desc.sun_worship.explanation: "„Wir werden gefragt, ob wir unsere Gebete an die Sonne richten sollten. Ist das lebensspendende Licht unsere höchste Macht ([ROOT.Char.GetFaith.HighGodName])?“"
 ecumenical_council_events.0010.desc.warmonger.explanation: "„Wir werden gefragt, ob Krieg und Eroberung selbst ein heiliger Dienst sind. Ist das Schwert das beste Mittel, um das Wort der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) zu verbreiten?“"
 ecumenical_council_events.0010.desc.gruesome_festivals.explanation: "„Wir werden gefragt, ob heilige Tage von Blut und grausamem Spektakel gekennzeichnet sein sollten. Sind solch ausgelassene Feierlichkeiten die wahrhaftige Verehrung der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])?“"
 ecumenical_council_events.0010.desc.cthonic_redoubts.explanation: "„Wir werden gefragt, ob die hochgelegenen Orte und die Dächer der Welt heilig sind. Sollten wir die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) auf den Gipfeln und entlang versteckter Steinpfade suchen?“"
 ecumenical_council_events.0010.desc.household_gods.explanation: "„Wir werden gefragt, ob die Götter von Herd und Heim in [ROOT.Char.GetFaith.GetAdjective|l]en Haushalten bewahrt und verehrt werden können.“"
 ecumenical_council_events.0010.desc.sinitic_syncretism.explanation: "„Wir werden gefragt, ob man die Riten und der Kanon des fernen Ostens in unseren Glauben einbetten kann.“"
 ecumenical_council_events.0010.desc.eastern_syncretism.explanation: "„Wir werden gefragt, ob wir von den Glauben des Ostens lernen können – die nebeneinander leben ohne sich böse zu nennen –, obwohl wir nicht ihre östlichen Götter teilen.“"
 ecumenical_council_events.0010.desc.unreformed_syncretism.explanation: "„Wir werden gefragt, ob die alten Volksbräuche neuer Bekehrter unversehrt bleiben können. Ob man stillschweigend etwas von ihnen lernen kann, anstatt sie zu zerschlagen und zu verurteilen.“"
 ecumenical_council_events.0010.desc.christian_syncretism.explanation: "„Wir werden gefragt, ob jene, die Christus nicht folgen, Seinen Lehren und Seinem Beispiel dennoch folgen können, ohne zu gestehen, dass Er der einzig wahre Gott ist.“"
 ecumenical_council_events.0010.desc.islamic_syncretism.explanation: "„Wir werden gefragt, ob das Gesetz der Sarazenen in die [ROOT.Char.GetFaith.GetAdjective|l]e Kirche aufgenommen und ihre Lehre mit dem Evangelium verbunden werden kann.“"
 ecumenical_council_events.0010.desc.jewish_syncretism.explanation: "„Wir werden gefragt, ob das Gesetz und die Bildung der Juden in die [ROOT.Char.GetFaith.GetAdjective]e Kirche aufgenommen werden sollen, auch wenn wir nicht alle ihre Behauptungen teilen.“"
 ecumenical_council_events.0010.desc.exaltation_of_pain.explanation: "„Wir werden gefragt, ob der Schmerz selbst heilig ist. Ist es ein Segen, Schmerz zu geben, und eine Gnade der höchsten Macht ([ROOT.Char.GetFaith.HighGodName|U]), ihn zu empfangen?“"
 ecumenical_council_events.0010.desc.natural_primitivism.explanation: "„Wir werden gefragt, ob die Heiligkeit darin liegt, Städte aufzugeben und das Leben in der Wildnis anzunehmen – und so erneut im ersten Zustand des Seins zu existieren.“"
 ecumenical_council_events.0010.desc.pursuit_of_power.explanation: "„Wir werden gefragt, ob die Herrschaft über die lebendige Welt ein heiliges Ziel ist. Erfüllt das Ergreifen von Macht den Willen der höchsten Instanz ([ROOT.Char.GetFaith.HighGodName])?“"
 ecumenical_council_events.0010.desc.ritual_cannibalism.explanation: "„Wir werden gefragt, ob das Fleisch der Toten im Zuge eines heiligen Ritus verzehrt werden darf.“"
 ecumenical_council_events.0010.desc.sacred_shadows.explanation: "„Wir werden gefragt, ob Täuschung heilig sein kann. Sollen die Gläubigen lügen und sogar ihre eigenen Lügen glauben, wenn die Wahrheit ihren Glauben gefährden würde?“"
 ecumenical_council_events.0010.desc.polyamory.explanation: "„Wir werden gefragt, ob die Gläubigen ihre Liebe mit vielen teilen und die Behauptung abtun sollen, eine Seele könne die Zuneigung einer anderen besitzen.“"
 ecumenical_council_events.0010.desc.sacrificial_ceremonies.explanation: "„Wir werden gefragt, ob man das menschliche Leben in einer heiligen Zeremonie opfern kann. Sollten auf den [ROOT.Char.GetFaith.GetAdjective|l]en Altären die Willigen sich selbst opfern und die Schuldigen geopfert werden?“"
 ecumenical_council_events.0010.desc.megaliths.explanation: "„Wir werden gefragt, ob große Steinmonumente zum Ruhm der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) errichtet werden müssen.“"
 ecumenical_council_events.0010.desc.communal_possessions.explanation: "„Wir werden gefragt, ob die Gläubigen alles gemeinsam besitzen müssen.“"
 ecumenical_council_events.0010.desc.pure_land.explanation: "„Wir werden gefragt, ob man das gesegnete Reich jenseits des Leidens allein durch Vertrauen und Hingabe erreicht und nicht durch Reichtum, Studium oder die Beherrschung der Riten.“"
 ecumenical_council_events.0010.desc.no_mind.explanation: "„Wir werden gefragt, ob man die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) durch die Leere des Geistes und die Stille des Selbst sucht.“"
 ecumenical_council_events.0010.desc.mountain_worship.explanation: "„Wir werden gefragt, ob die höchsten Ort tatsächlich hoch und heilig sind. Sucht man die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) am besten auf den Gipfeln der Berge?“"
 ecumenical_council_events.0010.desc.extinction_of_dharma.explanation: "„Wir werden gefragt, ob sich dieses Zeitalter verfinstert und Dämonen in frommer Verkleidung umherwandeln. Müssen wir diese Feinde erschlagen, um das heilige Gesetz zu verteidigen, während es verfällt?“"
 ecumenical_council_events.0010.desc.cranial_trophies.explanation: "„Wir werden gefragt, ob die Häupter der Erschlagenen als heilige Trophäen mitgenommen werden sollen.“"
 ecumenical_council_events.0010.desc.pursuit_of_knowledge.explanation: "„Wir werden gefragt, ob die Suche nach Wissen eine heilige Pflicht ist.“"
 ecumenical_council_events.0010.desc.benevolent_governance.explanation: "„Wir werden gefragt, ob die gerechte Herrschaft eine heilige Pflicht ist, der [ROOT.Char.GetFaith.GetAdjective|l]e Fürsten nachkommen müssen.“"
 ecumenical_council_events.0010.desc.filial_piety.explanation: "„Wir werden gefragt, ob das Ehren der Eltern und Ältesten von der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) vorgeschrieben ist.“"
 ecumenical_council_events.0010.desc.harmonious_society.explanation: "„Wir werden gefragt, ob gesellschaftliche Harmonie – mit jeder Seele an ihrem Platz – das Herz der [ROOT.Char.GetFaith.GetAdjective|l]en Ordnung ist.“"
 ecumenical_council_events.0010.desc.sacred_destruction.explanation: "„Wir werden gefragt, ob die Zerstörung selbst heilig sein kann. Ist das Vernichten des Alten das, was die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) von uns verlangt?“"
 ecumenical_council_events.0010.desc.preservation.explanation: "„Wir werden gefragt, ob Heiligkeit darin liegt, zu errichten und zu bewahren, was erschaffen wurde. Müssen die [ROOT.Char.GetFaith.GetAdjective|l]en Tempel und Werke so umsorgt werden, dass sie auf ewig gedeihen?“"
 ecumenical_council_events.0010.desc.takamin.explanation: "„Wir werden gefragt, ob der mächtige Bär ein Gefäß des Heiligen ist. Muss die Jagd das große Tier als heilig ehren und sein Töten mit heiligem Respekt geschehen?“"
 ecumenical_council_events.0010.a_1: "Dies ersetzt: [current_core_1.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_2: "Ich schaffe Platz durch das Entfernen von: [current_core_2.GetNameNoTooltip(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0010.a_3: "[current_core_3.GetNameNoTooltip(ROOT.GetCharacter.GetRite)] – das muss weg."
 ecumenical_council_events.0010.b: "Verbietet die Praxis!"
 ecumenical_council_events.0010.c: "Fürs Erste werde ich Einhaltung einfach erlauben."
 ecumenical_council_events.0010.d: "Lasst uns diesen Grundsatz wenigstens anerkennen."
