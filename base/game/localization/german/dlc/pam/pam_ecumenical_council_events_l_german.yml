 # ecumenical_council_events.0111-0129 - Themed sway the group debate-phase pulse events
 ecumenical_council_events.0111.t: "Die nörgelnden Grauköpfe"
 ecumenical_council_events.0111.desc: "Die grauhaarigen Ältesten stehen streitend beieinander.\n\n„Wir haben Konzile kommen und gehen sehen. Fehler wurden in allen von ihnen gemacht. Doch anstatt diese Verdrehungen richtigzustellen, scheinen wir noch mehr einführen zu wollen!“, nörgelt [lead_conservative.GetTitledFirstName].\n\n„Ihr alter Esel! Das letzte Mal habt Ihr fast dasselbe gesagt und Ihr werdet so weiterreden, bis Ihr im Grab liegt!“, schimpft [lead_innovator.GetTitledFirstName] zurück."
 ecumenical_council_events.0111.support: "Dieser Wandel wird alte Verdrehungen richtigstellen!"
 ecumenical_council_events.0111.support_duel: "Wiederholt die Argumente noch einmal für die alten Ohren."
 ecumenical_council_events.0111.support_duel.success: "Grummelnd stimmen sie zu"
 ecumenical_council_events.0111.support_duel.success_halved: "Ein paar nehmen diese Richtigstellung an"
 ecumenical_council_events.0111.support_duel.failure: "Sie rufen immer noch: „Verdrehung!“"
 ecumenical_council_events.0111.oppose: "Unterstützt [lead_conservative.GetTitledFirstNameNoTooltip]: Keine Torheiten mehr."
 ecumenical_council_events.0111.oppose_duel: "Zermalmt die alten Träumer zu intellektuellem Staub!"
 ecumenical_council_events.0111.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0111.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0111.oppose_duel.failure: "Die Innovatoren bleiben unbeschmutzt"
