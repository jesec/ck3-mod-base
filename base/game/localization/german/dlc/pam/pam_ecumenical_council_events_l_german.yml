 ecumenical_council_events.0116.t: "Wer zahlt dafür?"
 ecumenical_council_events.0116.desc: "Ich sehe die Ratsverwalter verschiedener Sitze, wie sie sich über ein Pergament beugen und Zahlen diskutieren, als wäre der Saal ein Kontor.\n\n„Meine Diözese kann sich weitere Unruhen nicht leisten“, sagt [lead_conservative.GetTitledFirstName]. „Neue Bücher für jede Gemeinde. Reiter zu jedem Gotteshaus ([lead_conservative.GetFaith.HouseOfWorship]). Wenn das durchkommt, wird der Zehnt nicht ausreichen.“\n\n„Und wenn es scheitert?“, fragt [lead_innovator.GetTitledFirstName]. „Wir haben bereits Jahre des Zanks hinter uns. Das Silber ist ohnehin nicht mehr da. Es ist besser, das, was übrig ist, für ein Gesetz auszugeben, woran sich die Gläubigen halten werden.“"
 ecumenical_council_events.0116.support: "Ja, warum Silber nachweinen, das bereits ausgegeben wurde?"
 ecumenical_council_events.0116.support_duel: "Argumentiert folgendermaßen: Unterstützung ist eine Investition!"
 ecumenical_council_events.0116.support_duel.success: "Sie werden mit verlockenden Aussichten zur Reform bewegt"
 ecumenical_council_events.0116.support_duel.success_halved: "Ein paar nehmen diese Formulierung an"
 ecumenical_council_events.0116.support_duel.failure: "Sie stöhnen immer noch über die Ausgaben"
 ecumenical_council_events.0116.oppose: "Meine Diözese kann sich diese Unruhe nicht leisten."
 ecumenical_council_events.0116.oppose_duel: "„Bei der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])! Das ist fiskal unverantwortlich!“"
 ecumenical_council_events.0116.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] widerruft"
 ecumenical_council_events.0116.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] widerrufen"
 ecumenical_council_events.0116.oppose_duel.failure: "Sie stehen zu ihrer Investition"
