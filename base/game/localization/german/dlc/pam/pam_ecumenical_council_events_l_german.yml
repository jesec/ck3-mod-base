 ecumenical_council_events.0104.t: "Kleriker von meinem Blut"
 ecumenical_council_events.0104.desc: "Die Kleriker aus meiner Verwandtschaft diskutieren, ob das Haus [ROOT.Char.GetHouse.GetName] sein Gewicht in den Ring werfen sollte. [lead_conservative.GetTitledFirstName|U] sagt, „Unser Haus sollte nicht öffentlich gespalten werden; und ich werde nicht an der Seite von [host.GetTitledFirstName] stehen!“\n\n[lead_innovator.GetTitledFirstName|U] zeigt spöttische Gesten hinter dem Rücken von [lead_conservative.GetTitledFirstNameNoTooltip], was zeigt, dass nicht alle aus meinem Haus gegen Innovation sind."
 ecumenical_council_events.0104.support: "Fordert [ROOT.Char.GetHouse.GetNameNoTooltip] dazu auf, sich dafür einzusetzen."
 ecumenical_council_events.0104.support_duel: "Gewinnt jene, die sich der Innovation verweigern."
 ecumenical_council_events.0104.support_duel.success: "Euer Haus wird sich dafür einsetzen"
 ecumenical_council_events.0104.support_duel.success_halved: "Ein paar werden sich dafür einsetzen"
 ecumenical_council_events.0104.support_duel.failure: "Euer Haus ist gespalten"
 ecumenical_council_events.0104.oppose: "Steht an der Seite von [lead_conservative.GetFirstNameNoTooltip] gegen Innovation."
 ecumenical_council_events.0104.oppose_duel: "Warnt [lead_innovator.GetFirstNameNoTooltip]: Das Haus darf nicht gespalten werden."
 ecumenical_council_events.0104.oppose_duel.success: "Eure Verwandtschaft geht dazu über, den Wandel abzulehnen"
