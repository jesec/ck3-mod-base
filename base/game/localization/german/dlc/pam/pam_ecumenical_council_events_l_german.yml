 ecumenical_council_events.0105.t: "[ROOT.Char.GetCulture.GetNameNoTooltip|U]e Empfindsamkeiten"
 ecumenical_council_events.0105.desc: "Die vertrauten Klänge des [ROOT.Char.GetCulture.GetLanguage.GetName|U]en stechen aus den vielen hier gesprochenen Sprachen hervor. Es ist natürlich [lead_conservative.GetTitledFirstName], [lead_conservative.Custom('DE_ART_DEF_S_N')] unsere Verwandtschaft aufhetzt.\n\n„Wir [lead_conservative.GetCulture.GetCollectiveNounNoTooltip|U] wollen solche Neuerungen nicht!“, tobt [lead_conservative.Custom('DE_PRO_PER_S_3P_N')].\n\n„Doch wollt Ihr uns dafür verantwortlich machen, dass die Kirche auf der Stelle tritt?“, fragt [lead_innovator.GetTitledFirstName] fordernd."
 ecumenical_council_events.0105.support: "Ihr könnt nicht für uns alle sprechen, [lead_conservative.GetFirstNameNoTooltip]."
 ecumenical_council_events.0105.support_duel: "Wir [lead_conservative.GetCulture.GetCollectiveNounNoTooltip|U] haben eine Geschichte voller Neuerungen."
 ecumenical_council_events.0105.support_duel.success: "Alle Anwesenden stimmen zu, sich für die Sache einzusetzen"
 ecumenical_council_events.0105.support_duel.success_halved: "Ein paar stimmen zu, sich für die Sache einzusetzen"
 ecumenical_council_events.0105.support_duel.failure: "Sie lehnen Neuerungen nach wie vor ab"
