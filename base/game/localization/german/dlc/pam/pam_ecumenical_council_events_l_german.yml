 ecumenical_council_events.0118.t: "Traditionen eines fernen Sitzes"
 ecumenical_council_events.0118.desc: "[lead_conservative.GetTitledFirstName|U] ist ein bekanntes Konzilmitglied von [lead_conservative.GetCulture.GetNameNoTooltip|l]er Herkunft und steht mit einer Gruppe anderer Kleriker zusammen, die von weit her angereist sind, um die Traditionen der Kirche aufrechtzuerhalten.\n\n„Die [lead_conservative.GetFaith.GetAdjective|l]e Welt ist so gewaltig wie die Liebe der höchsten Macht ([lead_conservative.GetFaith.HighGodName])“, sagt [lead_conservative.Custom('DE_PRO_PER_S_3P_N')]. „Es ist unsere Hoffnung, dass wir diese Pilgerreise nicht auf uns nahmen, nur um Zeugen zu werden, wie [lead_innovator.GetTitledFirstName] davon predigt, die Taten der Kirchenväter zunichtezumachen.“"
 ecumenical_council_events.0118.support: "Die beschwerlichsten Pilgerreisen bergen die größten Offenbarungen."
 ecumenical_council_events.0118.support_duel: "Überzeugt sie von der Vision von [lead_innovator.GetFirstNameNoTooltip]."
 ecumenical_council_events.0118.support_duel.success: "Sie akzeptieren, dass die Traditionen der Väter sicher sind"
 ecumenical_council_events.0118.support_duel.success_halved: "Ein paar akzeptieren, dass die Traditionen der Väter sicher sind"
 ecumenical_council_events.0118.support_duel.failure: "Sie fürchten immeer noch die Gebete von [lead_innovator.GetTitledFirstNameNoTooltip]"
 ecumenical_council_events.0118.oppose: "„Lasst uns alle Euer Opfer ehren.“"
 ecumenical_council_events.0118.oppose_duel: "„Ich werde gegen [lead_innovator.GetTitledFirstNameNoTooltip] predigen.“"
 ecumenical_council_events.0118.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0118.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0118.oppose_duel.failure: "Die Schüler von [lead_innovator.GetTitledFirstNamePossessiveNoTooltip] sind unbeeindruckt"
