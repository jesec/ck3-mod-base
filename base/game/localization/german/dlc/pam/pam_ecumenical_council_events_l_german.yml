 ecumenical_council_events.0120.t: "Namen in der Chronik"
 ecumenical_council_events.0120.desc: "Ein paar der angesehensten Gäste halten sich abseits und wägen ab, wie ihr Ruf sein wird, sobald all dies niedergeschrieben ist.\n\n„Mein Name ist in jeder neueren Chronik zu finden. Warum sollte ich an ein Dekret gebunden sein, das auf ewig verspottet werden könnte?“, fragt [lead_conservative.GetTitledFirstName].\n\n„Die Leute werden sich daran erinnern, wer den Streit schlichtete, und nicht daran, wer sich aus allem heraushielt. Und genau so wird man sich an mich erinnern“, antwortet [lead_innovator.GetTitledFirstName]."
 ecumenical_council_events.0120.support: "„Sind wir nicht die Anführer der Kirche?“"
 ecumenical_council_events.0120.support_duel: "„Ihr werdet nicht allein sein!“"
 ecumenical_council_events.0120.support_duel.success: "Die Zweifler überlassen sich ganz der Geschichte"
 ecumenical_council_events.0120.support_duel.success_halved: "Ein paar überlassen sich ganz der Geschichte"
 ecumenical_council_events.0120.support_duel.failure: "Sie lassen sich weiter nicht greifen"
 ecumenical_council_events.0120.oppose: "Ich werde mich nicht zum Gespött machen."
 ecumenical_council_events.0120.oppose_duel: "„Narren schlichten Streit … indem sie Absurditäten durchsetzen.“"
 ecumenical_council_events.0120.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0120.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0120.oppose_duel.failure: "Sie nehmen Euch die Beleidigung übel"
