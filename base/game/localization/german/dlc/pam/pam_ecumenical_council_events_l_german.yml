 ecumenical_council_events.0107.t: "Ihr erstes Konzil"
 ecumenical_council_events.0107.desc: "Ein Gruppe junger Kleriker schnattert aufgeregt miteinander, denn für viele von ihnen ist es ihr erstes Konzil.\n\n„Hier entsteht eine Bewegung: Spürt Ihr das Wirken der höchsten Macht ([lead_innovator.GetFaith.HouseholdGodName])? Lasst uns der Kirche unseren Stempel aufdrücken, mit einer Kühnheit, die man seit Langem vermisst!“, sagt [lead_innovator.GetTitledFirstName].\n\n„Verächtliche Narren! Wir müssen zu den Kirchenvätern zurückkehren und diese widerlichen Neuerungen zurückweisen“, beharrt [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0107.support: "Ein Morgen für den Glauben!"
 ecumenical_council_events.0107.support_duel: "Weist diese konservative Feigheit zurück."
 ecumenical_council_events.0107.support_duel.success: "Ihre Augen strahlen verheißungsvoll"
 ecumenical_council_events.0107.support_duel.success_halved: "Ein paar versprechen Unterstützung"
