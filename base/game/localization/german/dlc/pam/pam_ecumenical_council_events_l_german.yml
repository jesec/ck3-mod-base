 ecumenical_council_events.0102.t: "Wetteifernde Gebete"
 ecumenical_council_events.0102.desc: "Die Frommsten unter den Versammelten teilten sich angesichts des Vorschlags in zwei Gebetskreise auf.\n\n[lead_innovator.GetTitledFirstName] ruft die höchste Macht ([lead_innovator.GetFaith.HighGodName]) an, um zu bekräftigen, dass ihre Offenbarungen ein Spiegelbild ihres Willens sind. Der Kreis von [lead_conservative.GetTitledFirstName] antwortet darauf sofort und bittet die guten Mächte ([lead_innovator.GetFaith.random_GoodGodNames]) flehentlich, die Traditionen beizubehalten, die so lange schon der Kirche dienlich waren."
 ecumenical_council_events.0102.support: "Schließt Euch den Gebeten für den Wandel an."
 ecumenical_council_events.0102.support_duel: "Predigt den Wandel, bis ihr Kreis nachgibt."
 ecumenical_council_events.0102.support_duel.success: "Eure Predigt stimmt die widerstrebenden Kleriker um"
 ecumenical_council_events.0102.support_duel.success_halved: "Eure Predigt stimmt ein paar der widerstrebenden Kleriker um"
 ecumenical_council_events.0102.support_duel.failure: "Ihre Gebete bleiben bestehen; Eure Predigt kommt nicht an"
 ecumenical_council_events.0102.oppose: "Schließt Euch den Gebeten für das alte Gesetz an."
 ecumenical_council_events.0102.oppose_duel: "Predigt das alte Gesetz, bis ihr Kreis nachgibt."
 ecumenical_council_events.0102.oppose_duel.success: "Eure Predigt stimmt die reformwilligen Kleriker um"
 ecumenical_council_events.0102.oppose_duel.success_halved: "Eure Predigt stimmt ein paar der reformwilligen Kleriker um"
 ecumenical_council_events.0102.oppose_duel.failure: "Ihre Gebete bleiben bestehen; Eure Predigt kommt nicht an"
 ecumenical_council_events.0102.conservatives_custom: "Gottesfürchtige [ec_conservatives|E] (#V [feature_conservatives_size]#!)"
 ecumenical_council_events.0102.conservatives_custom_halved: "Gottesfürchtige [ec_conservatives|E] (#V [feature_conservatives_size_halved]#!)"
 ecumenical_council_events.0102.innovators_custom: "Gottesfürchtige [ec_innovators|E] (#V [feature_innovators_size]#!)"
 ecumenical_council_events.0102.innovators_custom_halved: "Gottesfürchtige [ec_innovators|E] (#V [feature_innovators_size_halved]#!)"
 ecumenical_council_events.0103.t: "Der Preis des Wandels"
 ecumenical_council_events.0103.desc: "„Eure Uneinsichtigkeit wird unser aller Ende sein!“, schreit [lead_innovator.GetTitledFirstName].\n\n„Die Gläubigen von [lead_conservative.GetPrimaryTitle.GetNameNoTooltip] würden einem Gönner danken, der ihr Gebetshaus ([lead_conservative.Custom('GetFaithTemple')]) wieder aufbaut“, sagt [lead_conservative.GetTitledFirstName]."
 ecumenical_council_events.0103.support: "Bietet das Patronat an."
 ecumenical_council_events.0103.support_duel: "Legt dar, wie [lead_conservative.Custom('DE_PRO_POS_S_3P')]e Herde bereichert werden soll."
 ecumenical_council_events.0103.support_duel.success: "Sie erkennen den Wert der Innovation"
 ecumenical_council_events.0103.support_duel.success_halved: "Ein paar erkennen den Wert der Innovation an"
 ecumenical_council_events.0103.support_duel.failure: "Alle enthalten sich weiterhin der Stimme"
 ecumenical_council_events.0103.oppose: "Bietet das Patronat an."
