 # Debate vote resolution: guests
 ecumenical_council_events.0081.t: "Das Konzil stimmt ab"
 ecumenical_council_events.0081.desc.innovator_passed: "Wir, die wir für den Wandel waren, obsiegten. Unsere Argumente stimmten genügend Mitglieder des Konzils um, und so ist der neue Weg angenommen."
 ecumenical_council_events.0081.desc.innovator_failed: "Obgleich wir auf einen Wandel drängten, scheiterte unsere Abstimmung. Die alten Traditionen bleiben bestehen, und unsere Argumente sind fürs Erste beiseitegelegt."
 ecumenical_council_events.0081.desc.conservative_passed: "Trotz der Verteidigung unserer Traditionen gewannen die Erneuerer die Abstimmung. Der Wandel ist angenommen, ungeachtet unserer Bedenken."
 ecumenical_council_events.0081.desc.conservative_failed: "Wir, die wir für die Tradtionen einstehen, wichen nicht zurück. Der Vorschlag wurde abgelehnt und unser Ritus bewahrt."
 ecumenical_council_events.0081.desc.neutral: "Das Konzil verkündet sein Urteil, und die Angelegenheit ist geklärt."
 ecumenical_council_events.0081.a: "So ist es entschieden."
