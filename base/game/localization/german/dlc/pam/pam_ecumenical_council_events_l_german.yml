 ecumenical_council_events.0101.t: "Die erlernte Sprache"
 ecumenical_council_events.0101.desc: "Gelehrte werfen sich in der Halle Zitate zu, und jeder Vers verschärft das Streitgespräch.\n\n„Die Schrift ([lead_conservative.GetFaith.ReligiousText|U]) ist eindeutig,“ beharrt [lead_conservative.GetTitledFirstName]. „[ec_current_topic.GetName(activity.GetHost.GetRite)|U] – das sollte unverändert bleiben.“\n\n„Lest die vollständige Textstelle, die ich zitiere,“ antwortet [lead_innovator.GetTitledFirstName]. „Ihr werdet feststellen, dass sie im Grunde auf den Wandel besteht!“"
 ecumenical_council_events.0101.support: "Verweist auf den fehlenden Zusammenhang zu der Textstelle."
 ecumenical_council_events.0101.support_duel: "Übertrefft [lead_conservative.Custom('DE_PRO_PER_S_3P_A')] argumentativ mit tieferer Gelehrsamkeit."
 ecumenical_council_events.0101.support_duel.success: "Sie nehmen den Wandel an, der sich aus dem Text ergibt"
 ecumenical_council_events.0101.support_duel.success_halved: "Ein paar nehmen den Wandel an, der sich aus dem Text ergibt"
 ecumenical_council_events.0101.support_duel.failure: "Sie behaupten immer noch, der Text sei eindeutig dagegen"
 ecumenical_council_events.0101.oppose: "Unterstützt [lead_conservative.GetTitledFirstNameNoTooltip]: Der Text sollte unverändert bleiben."
 ecumenical_council_events.0101.oppose_duel: "Bestreitet, dass sich der Wandel aus der Textstelle ergibt."
 ecumenical_council_events.0101.oppose_duel.success: "Der Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] gibt nach"
 ecumenical_council_events.0101.oppose_duel.success_halved: "Ein paar aus dem Kreis von [lead_innovator.GetTitledFirstNameNoTooltip] geben nach"
 ecumenical_council_events.0101.oppose_duel.failure: "Ihre Lesart des Wandels bleibt bestehen"
