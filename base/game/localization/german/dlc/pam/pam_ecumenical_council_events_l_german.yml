 ecumenical_council_events.0063.desc.doctrine_head_of_faith_description: "„Wir müssen uns nun fragen, ob alle Gläubigen einem einzigen Oberhaupt unterstehen müssen und ob dieses Oberhaupt zwingend dem Klerus der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) angehören muss.“"
