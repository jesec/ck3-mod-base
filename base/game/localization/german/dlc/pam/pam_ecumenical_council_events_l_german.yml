 ecumenical_council_events.0040.t: "Das Ende des Konzils"
 ecumenical_council_events.0040.desc: "Nach einem beschwerlichen Prozess neigt sich das Konzil dem Ende entgegen."
 ecumenical_council_events.0040.desc.change: "Unter meiner Führung änderte unser Glaube ([ROOT.Char.GetFaith.GetName]) sein ureigenstes Fundament. Nun gilt es, diese frohe Kunde unter das einfache Volk zu bringen!"
 ecumenical_council_events.0040.desc.status_quo: "Ich bin daran gescheitert, meine versprochenen Änderungen umzusetzen. Unser Glaube ([ROOT.Char.GetFaith.GetName]) bleibt, wie er war."
 ecumenical_council_events.0040.a: "Es ist an der Zeit, nach Hause zu gehen."
 ecumenical_council_events.0041.t: "Das Ende des Konzils"
 ecumenical_council_events.0041.desc: "Nach einem beschwerlichen Prozess neigt sich das Konzil dem Ende entgegen."
 ecumenical_council_events.0041.desc.change: "Unter der Führung von [host.GetName] änderte unser Glaube ([ROOT.Char.GetFaith.GetName]) sein ureigenstes Fundament. Nun gilt es, diese frohe Kunde unter das einfache Volk zu bringen!"
 ecumenical_council_events.0041.desc.status_quo: "[host.GetName|U] scheiterte daran, [host.Custom('DE_PRO_POS_S_3P')]e versprochenen Änderungen umzusetzen. Der Glaube ([host.GetFaith.GetName]) bleibt, wie er war."
 ecumenical_council_events.0041.a: "$ecumenical_council_events.0040.a$"
 ecumenical_council_events.schism_crisis_end: "\n\nJede Gesandtschaft reitet mit ihrer eigenen Vorstellung davon, wer nachgab und wer Verrat beging, zurück in die Heimat. Ein Haus, das so gespalten ist, kann nicht für immer bestehen."
 # Debate vote resolution: host
 ecumenical_council_events.0080.t: "Das Konzil stimmt ab"
 ecumenical_council_events.0080.desc.passed: "Die Stimmen sind ausgezählt. [lead_portrait.GetTitledFirstName|U] tritt vor:\n\n„Der Heilige Geist leitete uns durch das Konzil, und wir trafen eine Entscheidung. Die Angelegenheit ist beigelegt – mit einer Zustimmung!“"
 ecumenical_council_events.0080.desc.failed: "Die Stimmen sind ausgezählt. [lead_portrait.GetTitledFirstName|U] tritt vor:\n\n„Der Heilige Geist leitete uns durch das Konzil, und wir trafen eine Entscheidung. Der Vorschlag scheitert. Der Glaube ([host.GetFaith.GetName]) bleibt, wie er war.“"
 ecumenical_council_events.0080.desc.outcome.passed: "\n\n[ec_current_topic.GetName(ROOT.GetCharacter.GetRite)|U] wird: [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.desc.outcome.passed.make_core: "\n\n[ec_current_topic.GetName(ROOT.GetCharacter.GetRite)|U] wird zum Kern, ersetzt wird dementsprechend: [core_tenet_to_swap.GetName(ROOT.GetCharacter.GetRite)]."
 ecumenical_council_events.0080.desc.outcome.failed: "\n\n[ec_current_topic.GetName(ROOT.GetCharacter.GetRite)|U] wird nicht: [activity.Custom('GetEcumenicalCouncilCurrentProposal')]."
 ecumenical_council_events.0080.a: "So ist es entschieden."
