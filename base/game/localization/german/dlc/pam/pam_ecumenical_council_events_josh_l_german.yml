l_german:
 ecumenical_council_events_josh.0001.t: "Mord zur Komplet"
 ecumenical_council_events_josh.0001.desc: "Die Gläubigen sind so berechenbar. Als sich [murder_target.GetTitledFirstName] während der [Glossary('Komplet', 'COMPLINE_GLOSS')] zum Gebet niederbeugt, lauere ich im Schatten.\n\n[murder_target.Custom('DE_PRO_POS_S_3P')|U]e langen Gebete lassen [murder_target.Custom('DE_PRO_PER_S_3P_A')] ungeschützt. Wenn wir allein sind, können auch edle Gewänder – Roben oder Samt – zur Schlinge werden."
 ecumenical_council_events_josh.0001.a: "Zieht [murder_target.Custom('DE_PRO_POS_S_3P')]e Gewänder enger."
 ecumenical_council_events_josh.0001.a.tt: "Etwas zu eng, um noch bequem zu sein"
 ecumenical_council_events_josh.0001.a.tt2: "[murder_target.Custom('DE_PRO_PER_S_3P_N')|U] erntkommt meinem Griff"
 ecumenical_council_events_josh.0001.a.toast.success: "Mord war erfolgreich"
 ecumenical_council_events_josh.0001.a.toast.failure: "Mordversuch schlug fehl"
 ecumenical_council_events_josh.0001.a.flavor: "Wer so viel betet, muss gesündigt haben …"
 ecumenical_council_events_josh.0001.b: "Nein, nicht während eines heiligen Akts …"
 COMPLINE_GLOSS: "Die Komplet ist das Nachtgebet. Genauer gesagt ist sie das letzte Gebet des Tages in der Stundenliturgie, der täglichen Abfolge an Gebeten im Christentum."
 ecumenical_council_events_josh.0010.t: "Eine Heiligenfeier"
 ecumenical_council_events_josh.0010.desc: "Der Klerus hat sich versammelt, und es gibt keine größere Freude, als einen unserer führenden Leitsterne zu feiern. In diesem Monat soll [monthly_saint.GetTitledFirstName] Verehrung erfahren.\n\n„Im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) werden wir die heutige Andacht leiten.“"
 ecumenical_council_events_josh.0010.a: "Widmet die Messe ganz dem Leitstern."
 ecumenical_council_events_josh.0010.b: "Haltet eine Predigt."
 ecumenical_council_events_josh.0010.c: "Fügt einfach nur einen weiteren Psalm oder eine Hymne hinzu."
 ecumenical_council_events_josh.0011.t: "Wie Donnerhall"
 ecumenical_council_events_josh.0011.desc: "Als ich die Gäste begrüße, komme ich nicht umhin, [guest_giant.GetTitledFirstName] zu bemerken, [giant_guest.Custom('DE_ART_DEF_S_N')] mit [guest_giant.Custom('DE_PRO_POS_S_3P')]er riesenhaften Gestalt aus der Menge heraussticht. Doch erst als [guest_giant.Custom('DE_PRO_PER_S_3P_N')] spricht, „Seid gegrüßt, meine Mitbewahrer des Glaubens!“, erkenne ich [guest_giant.Custom('DE_PRO_POS_S_3P')]e wahre Fähigkeit.\n\nMit einer Stimme wie Donnerhall könnte [guest_giant.Custom('DE_PRO_PER_S_3P_N')] äußerst nützlich sein. Die Psalmen zur [Glossary('Vesper', 'VESPER_GLOSS')] könnten einen weiteren Bass gebrauchen …"
 ecumenical_council_events_josh.0011.a: "Lasst [guest_giant.Custom('DE_PRO_POS_S_3P')]e Stimme unsere Gebete zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) tragen."
 ecumenical_council_events_josh.0011.a.flavor: "Die höchste Maccht ([ROOT.Char.GetFaith.HighGodName]) und alle Versammelten zeigen sich beeindruckt."
 ecumenical_council_events_josh.0011.b: "Ich könnte [guest_giant.Custom('DE_PRO_POS_S_3P')]e volltönende Unterstützung stattdessen in der Debatte nutzen."
 ecumenical_council_events_josh.0011.b.tt: "Auf [guest_giant.Custom('DE_PRO_PER_S_3P_A')] kann man sich verlassen"
 ecumenical_council_events_josh.0011.b.tt2: "[guest_giant.Custom('DE_PRO_PER_S_3P_D')|U] kann man nur vertrauen, wenn [guest_giant.Custom('DE_PRO_PER_S_3P_N')] [guest_giant.Custom('DE_PRO_POS_S_3P')]en Anteil bekommt"
 ecumenical_council_events_josh.0011.b.toast.success: "Ihr überzeugt [guest_giant.Custom('DE_PRO_PER_S_3P_A')], Euch zu unterstützen."
 ecumenical_council_events_josh.0011.b.toast.failure: "[guest_giant.Custom('DE_PRO_PER_S_3P_N')|U] möchte etwas im Gegenzug für die Unterstützung."
 ecumenical_council_events_josh.0011.b.flavor: "Wenn [guest_giant.GetTitledFirstName] im richtigen Augenblick lautstark Unterstützung bekundet, werde ich die Oberhand haben."
 ecumenical_council_events_josh.0011.c: "[guest_giant.Custom('DE_PRO_PER_S_3P_N')|U] ist [Select_CString(guest_giant.IsFemale, 'eine Gästin', 'ein Gast')], kein Instrument."
 ecumenical_council_events_josh.0011.c.flavor: "Lasst [guest_giant.Custom('DE_PRO_PER_S_3P_A')] [guest_giant.Custom('DE_PRO_POS_S_3P')]en Platz unter uns finden"
 ecumenical_council_events_josh.0011.c.tt: "Ihr zwingt [guest_giant.GetTitledFirstName] weder in den Chor noch eine Debatte"
 friend_giant_support_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] entschied, [CHARACTER.GetShortUIName] auf einem ökumenischen Konzil zu unterstützen."
 VESPER_GLOSS: "Die Vesper ist das Abendgebet, üblicherweise das Gebet vor dem Abendessen in der Stundenliturgie, der täglichen Abfolge an Gebeten im Christentum."
 ecumenical_council_events_josh.0012.t: "Ein Bischofsring"
 ecumenical_council_events_josh.0012.desc: "Mir fiel auf, dass [guest_bishoplover.GetTitledFirstName] und [guest_bishop.GetTitledFirstName] seit Beginn des Konzils unzertrennlich sind. Heute Morgen zu den [Glossary('Laudes', 'LAUD_GLOSS')] verspätet sich [guest_bishoplover.GetFirstName] und ist ganz zerzaust. Ist das der Ring von [guest_bishop.GetFirstName] an [guest_bishoplover.Custom('DE_PRO_POS_S_3P')]em Finger? Sanft lasse ich [guest_bishoplover.Custom('DE_PRO_PER_S_3P_A')] wissen, was ich entdeckt habe, und hebe eine Augenbraue.\n\nAls [guest_bishoplover.Custom('DE_PRO_PER_S_3P_N')] [guest_bishoplover.Custom('DE_PRO_POS_S_3P')]en Fehler bemerkt, errötet [guest_bishoplover.Custom('DE_PRO_PER_S_3P_N')] und stammelt:\n\n „Bitte! Das darf niemand wissen …“"
 ecumenical_council_events_josh.0012.b: "„Gebt mir den Ring und schweigt.“"
 ecumenical_council_events_josh.0012.c: "„Das ist eine Angelegenheit zwischen mir, Euch und der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]).“"
 ecumenical_council_events_josh.0012.bishopringname: "Bischofsring"
 ecumenical_council_events_josh.0012.bishopringdesc: "[newly_created_artifact.GetDesc]\n\nEin sichtbares Zeichen des apostolischen Amtes des Trägers."
 LAUD_GLOSS: "Die Laudes sind das Morgengebet, üblicherweise das Gebet vor dem Frühstück in der Stundenliturgie, der täglichen Abfolge an Gebeten im Christentum."
 ecumenical_council_events_josh.0013.t: "Ein Modeverbrechen"
 ecumenical_council_events_josh.0013.desc: "[fashion_criminal.GetTitledFirstName|U] ist prächtig gekleidet. [fashion_criminal.Custom('DE_PRO_PER_S_3P_N')|U] trägt ein neues Gewand, das eigens für diesen Anlass angefertigt wurde und zweifelsohne ein Geschenk [fashion_criminal.Custom('DE_PRO_POS_S_3P')]er von Bewunderung erfüllten Schäfchen ist. Eine Stickerei zu Ehren von der reichsten Mächte ([ROOT.Char.GetFaith.WealthGodName]) prangt auf der Seidenstola.\n\nDiese Unverfrorenheit! Verletzt [fashion_criminal.Custom('DE_PRO_PER_S_3P_N')] ganz offen die Grundsätze des Glaubens ([fashion_criminal.GetFaith.GetName]) oder ist [fashion_criminal.Custom('DE_PRO_PER_S_3P_N')] lediglich ein eitler Pfau?"
 ecumenical_council_events_josh.0013.a: "„Entfernt diese Schande aus meinem Blick.“"
 ecumenical_council_events_josh.0013.b: "„Hinfort! Ihr habt Euch als unwürdig erwiesen!“"
 ecumenical_council_events_josh.0013.b.toast.success: "Ihr erreicht, dass [fashion_criminal.Custom('DE_PRO_PER_S_3P_N')] ausgeschlossen wird."
 ecumenical_council_events_josh.0013.b.toast.failure: "[fashion_criminal.Custom('DE_PRO_PER_S_3P_N')|U] schafft es, auf dem Konzil bleiben."
 fashion_criminal_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] trug etwas Unangemessenes auf einem ökumenischen Konzil."
 ecumenical_council_events_josh.0020.t: "Das Leuchtfeuer des Eifers"
 ecumenical_council_events_josh.0020.desc.intro: "„Schaut diese Säule unseres Glaubens ([ROOT.Char.GetFaith.GetName]) an! Ein wahres Zeugnis, dass die Rechtschaffenen dem Kreuz folgen.“\n\n[host.GetTitledFirstName|U]"
 ecumenical_council_events_josh.0020.desc_battle_memory: "bezieht sich auf ein besonderes Ereignis ([faith_battle_memory.GetDescription]). Die Heiden müssen bei jeder sich bietenden Gelegenheit bekämpft werden. Ich erhebe mein Schwert und nehme sein Lob an. „Für die Gläubigen!“"
 ecumenical_council_events_josh.0020.desc.fallback: "erkennt meine jüngsten Beiträge zum Glauben an. Vor dem versammelten Klerus aufgerufen zu werden, lässt mich mit stolzgeschwellter Brust dastehen.“"
 ecumenical_council_events_josh.0020.a: "„Im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) werden wir siegen!“"
 ecumenical_council_events_josh.0020.a.flavor: "Meine Taten haben den anwesenden Klerus bewegt."
 ecumenical_council_events_josh.0020.b: "Ich werde einfach nur im Ruhm baden."
 ecumenical_council_events_josh.0021.t: "Im Licht"
 ecumenical_council_events_josh.0021.desc: "Ein Lichtstrahl wandert über den Boden, während sich die Debatte hinzieht. Ich trete in ihn hinein, und plötzlich blicken mich alle an.\n\nAls wären meine Worte nicht genug, verstärkt das göttliche Licht mein Anliegen. [council_opponent.GetFirstName|U], mein Gegenüber in der Debatte, bleibt im Schatten zurück. [council_opponent.Custom('DE_PRO_POS_S_3P')|U]e Argumente erscheinen noch undurchsichtiger."
 ecumenical_council_events_josh.0021.a: "Nutzt meinen Vorteil gegenüber [council_opponent.GetFirstName]."
 ecumenical_council_events_josh.0021.a.ct: "[council_opponent.GetShortUINameNoTooltip|U] verlässt die [ec_conservatives|E] und tritt den [ec_innovators|E] bei"
 ecumenical_council_events_josh.0021.b: "Lasst das Licht die Versammlung für sich gewinnen."
 ecumenical_council_events_josh.0021.b.ct: "Bis zu #V 3#! [ec_conservatives|E] treten den [ec_innovators|E] bei"
 ecumenical_council_events_josh.0021.c: "Lasst sie meine Pracht sehen."
 ecumenical_council_events_josh.0021.c.ct: "Fügt einem [clerical_title|E] #V 50#! [Concept('appointment', 'Ernennungs')|E]-Investition hinzu"
 ecumenical_council_events_josh.0022.t: "Vereint im Glauben"
 ecumenical_council_events_josh.0022.desc: "Als [host.GetTitledFirstName|U] Gespräche während des Konzils führt, erkennt [host.Custom('DE_PRO_PER_S_3P_N')] die Gelegenheit, [host.Custom('DE_PRO_POS_S_3P')]e Anhänger auf Bedrohungen von außen einzuschwören. [host.Custom('DE_PRO_PER_S_3P_N')|U] ruft mich und [alliance_target.GetTitledFirstName] zu sich.\n\n„Meine Getreuen, so wie Ihr fest im Glauben seid, so sollt Ihr auch im Angesicht des Feindes fest beieinanderstehen.“"
 ecumenical_council_events_josh.0022.a: "Die Kirche möge unser Bündnis segnen."
 ecumenical_council_events_josh.0022.a.flavor: "Ich werde meinen frommen Ruf nutzen, um das Bündnis zu besiegeln."
 ecumenical_council_events_josh.0022.b: "Das Bündnis wird auf wechselseitigem Verständnis beruhen."
 ecumenical_council_events_josh.0022.b.toast.success: "[alliance_target.Custom('DE_PRO_PER_S_3P_N')|U] stimmt dem Bündnis zu."
 ecumenical_council_events_josh.0022.b.toast.failure: "[alliance_target.Custom('DE_PRO_PER_S_3P_N')|U] fühlt sich beleidigt von Euren Avancen."
 ecumenical_council_events_josh.0022.b.flavor: "Mein charmanter Umgang mit Menschen ist gewiss ausreichend."
 ecumenical_council_events_josh.0022.c: "Ein Konzil ist nicht der richtige Ort."
 ecumenical_council_events_josh.0022.c.flavor: "Eine respektvolle Verbeugung ist ausreichend."
 alliance_target_at_council_reason: "[TARGET_CHARACTER.GetShortUIName|U] lehnte ein unangemessenes Bündnis ab."
 ecumenical_council_events_josh.0023.t: "Betet für mich"
 ecumenical_council_events_josh.0023.desc: "„Gnade und Friede seien mit Euch.“ [host.GetTitledFirstName|U] segnet die Gäste, als sie sich nähern. Ich könnte den Augenblick nutzen und mich vor diese Stütze des Glaubens werfen. Wenn ich [host.Custom('DE_PRO_PER_S_3P_A')] dazu bringen könnte, mich in [host.Custom('DE_PRO_POS_S_3P')]e [Glossary('Laudes', 'LAUD_GLOSS')]-Gebete einzubeziehen, würde ich gewiss näher an die Erlösung gelangen.\n\n „Geht zur Seite und stellt das Geifern ein. Ihr haltet alle auf“, flüstert [prayer_opponent.GetFirstName] als Nächstes in der Reihe hinter mir."
 ecumenical_council_events_josh.0023.a: "„Eine beachtliche Spende, um mich in Euren Gebeten zu behalten.“"
 ecumenical_council_events_josh.0023.b: "Küsst den Gewandsaum [Select_CString(host.IsFemale, 'der Gastgeberin', 'des Gastgebers')]"
 ecumenical_council_events_josh.0023.b.tt: "Ich stelle sicher, dass mein Anliegen gehört wird"
 ecumenical_council_events_josh.0023.b.tt2: "Ich verstoße gegen die Etikette und werde zur Seite gedrängt"
 ecumenical_council_events_josh.0023.b.toast.success: "[host.GetTitledFirstName|U] wird für Euch beten."
 ecumenical_council_events_josh.0023.b.toast.failure: "[host.GetTitledFirstName|U] wischt Euer Anliegen beiseite."
 ecumenical_council_events_josh.0023.c: "Es ist besser, zur Seite zu treten und fromm zu sein."
 ecumenical_council_events_josh.0024.t: "Die Schönheit der Mysterien"
 ecumenical_council_events_josh.0024.desc: "Manche kamen ganz begeistert hierher, um über die heiligen Mysterien zu sprechen, begierig darauf, neue Auslgegen zu hören und darüber zu streiten. [tenet_target_a.GetName|U] gehört zu eben diesen Teilnehmern.\n\n„[tenet_target_a_shareable_tenet.GetName(tenet_target_a.GetRite)]! [tenet_target_a_shareable_tenet.GetName(tenet_target_a.GetRite)], meine Geschwister. Ehrt diese Beschränkungen, die uns die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) auferlegte, sucht nach der Weisheit dieses Weges und Ihr werdet das Göttliche verstehen!“\n\nIn der Menge werden Stimmen laut und verstummen wieder. [tenet_target_b.Custom('DE_ART_DEF_S_N')|U] [tenet_target_b.Custom('FormalComplimentAdjective')|l]e [tenet_target_b.GetTitledFirstName] ist von einem unvertrauten Text in den Bann geschlagen. Das Einzige, was ich entschlüsseln kann, lautet: „[tenet_target_b_shareable_tenet.GetName(tenet_target_b.GetRite)]“."
 ecumenical_council_events_josh.0024.a: "„Weisheit, sagt Ihr, [tenet_target_a.GetFirstNameNoTooltip]?“"
 ecumenical_council_events_josh.0024.b: "Dieses Buch wirkt recht spannend."
 ecumenical_council_events_josh.0024.c: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zeigte mir bereits den wahren Weg auf."
 ecumenical_council_events_josh.0025.t: "[Select_CString(theologian.IsFemale, 'Eine Theologin', 'Ein Theologe')] zu viel"
 ecumenical_council_events_josh.0025.desc: "Am Rand der großen Versammlung kommt es zu Aufruhr: Einige ungewöhnliche Neuankömmlinge schütteln den Staub der Straße ab. Unsere Prälaten tuscheln und starren, ehe sie den Neuankömmlinge mit einem Wink zu verstehen geben, dass sie wieder abreisen sollen. [Select_CString(theologian.IsFemale, 'Die Theologin, die', 'Der Theologe, der')] sie anführt, ruft:\n\n„Ich bin so weit gereist, um das Wirken meiner Mit-[theologian.GetFaith.GetAdherentNamePlural] zu erleben. Unsere alten Väter, die heiligen Apostel, waren wie Brüder. Warum lasst Ihr uns dann nicht unter Euch weilen?“"
 ecumenical_council_events_josh.0025.a: "Der Zugang hat seinen Preis …"
 ecumenical_council_events_josh.0025.a.flavor: "Ich kann [theologian.Custom('DE_PRO_PER_S_3P_A')] mühelos ans Ende meiner Einladung setzen."
 ecumenical_council_events_josh.0025.b: "„Eure Lehren sind eine Schande!“"
 ecumenical_council_events_josh.0025.c: "„Faszinierend. Lasst uns später unser eigenes Konzil abhalten.“"
 ecumenical_council_events_josh.0025.d: "Geleiten wir [theologian.Custom('DE_PRO_PER_S_3P_A')] höflich hinaus."
