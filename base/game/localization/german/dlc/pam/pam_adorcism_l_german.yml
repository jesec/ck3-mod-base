l_german:
 pam_curse_enemy_decision: "Verfluchen eines Feindes"
 pam_curse_enemy_decision_desc: "#F Wer ist dieser Narr, der sich mir entgegenstellt? Ich werde ihn vor den Geistern beim Namen nennen und alle Kränkungen, Beleidigungen und Flüche über ihn hereinbrechen lassen. Er mag jetzt noch lachen, doch seine Abrechnung wird bald kommen.#!"
 pam_curse_enemy_decision_tooltip: "Führt in einem Eurer [wars|E] ein Ritual gegen einen Rivalen oder Gegner durch"
 pam_curse_enemy_decision_confirm: "Den Ritus beginnen"
 pam_curse_enemy_decision_valid_target: "Ihr habt einen lebenden erwachsenen [Concept('rival', 'Rivalen')|E], [nemesis|E] oder Kriegsfeind"
 pam_curse_enemy_decision_selected_target_valid: "Euer gewählter Feind ist ein lebender erwachsener [rival|E], [nemesis|E] oder Kriegsfeind"
 pam_curse_enemy_decision_no_item_selected: "Kein Feind ausgewählt"
 pam_seek_war_aid_decision: "Um Unterstützung für den Krieg bitten"
 pam_seek_war_aid_decision_desc: "#F Der Krieg stellt nicht nur Waffen und Truppenstärke auf die Probe. Ich werde die Geister um Einsicht, Kraft und Ausdauer bitten, um mein Anliegen durch die bevorstehenden Prüfungen zu tragen.#!"
 pam_seek_war_aid_decision_tooltip: "Die Geister um Unterstützung in Euren derzeitigen Kriegen bitten"
 pam_seek_war_aid_decision_confirm: "Die Geister bitten"
 pam_adorcism_events.0001.t: "Ein Name vor den Geistern"
 pam_adorcism_events.0001.desc: "An einem abgelegenen Ort ritze ich den Namen von [pam_adorcism_curse_target.GetTitledFirstName] in die Erde und spreche dabei jeden Groll laut aus. Dieser Ritus kann weder Knochen brechen noch Ernten verdorren lassen, doch das ist auch nicht sein Zweck.\n\nAls ich mich erhebe, hat sich mein Zorn in Entschlossenheit verwandelt. Jedes Gerücht über [pam_adorcism_curse_target.Custom('DE_PRO_PER_S_3P_A')] erscheint mir nun wie ein Faden, der nur darauf wartet, dass man an ihm zieht."
 pam_adorcism_events.0001.a: "Meine Bestimmung ist eindeutig."
 pam_adorcism_events.0002.opening: "[pam_adorcism_curser.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pam_adorcism_events.0002.desc.intro: "[pam_adorcism_curser.Custom2('NegativeSupplimentaryGreeting', ROOT.Char)]"
 pam_adorcism_events.0002.desc.christian: "\n\n[pam_adorcism_curser.Custom('christian_curse')|U], ich sprach Euren Namen vor den Geistern aus und verhängte einen Fluch über Euch. Wenn Ihr vom Unglück heimgesucht werdet, denkt daran: Es war mein Wille, der es herbeiführte."
 pam_adorcism_events.0002.desc.default: "\n\nIch sprach Euren Namen vor den Geistern aus und verhängte einen Fluch über Euch. Wenn Ihr vom Unglück heimgesucht werdet, denkt daran: Es war mein Wille, der dies herbeiführte."
 pam_adorcism_events.0002.a: "Schnell, ruft den [ROOT.Char.GetFaith.PriestNeuter] herbei!"
 pam_adorcism_events.0002.a.flavor: "Der Fluch nagt an Euren Gedanken und lässt Euch in jedem Schatten ein Omen sehen."
 pam_adorcism_events.0101.t: "Rat aus dem Verborgenen"
 pam_adorcism_events.0101.desc: "Jenseits des Scheins des letzten Lagerfeuers gieße ich eine Opfergabe aus und lausche, während die Geräusche des Heeres hinter mir verstummen. Der Wind wirbelt den Staub auf, doch ich höre keine klare Stimme. Dennoch bringt das Ritual meine Gedanken zur Ruhe.\n\nIch muss entscheiden, welche Unterstützung ich für den bevorstehenden Feldzug in Anspruch nehme."
 pam_adorcism_events.0101.a: "Zeigt mir den Weg zum Sieg."
 pam_adorcism_events.0101.b: "Stärkt meinen Schwertarm."
 pam_adorcism_events.0101.c: "Verleiht meinem Heer Ausdauer."
 pam_adorcism_curse_focus_modifier: "Umgelenkte Wut"
 pam_adorcism_curse_focus_modifier_desc: "Dieser Charakter hat den Gegenstand seines Zorns benannt und Letzteren mithilfe eines Rituals nach außen gelenkt."
 pam_adorcism_ill_omen_modifier: "Von einem bösen Omen gezeichnet"
 pam_adorcism_ill_omen_modifier_desc: "Gerüchte über einen Fluch führten dazu, dass die Mitglieder des Ritus dieses Charakters ihm mit Misstrauen begegnen."
 pam_adorcism_curse_anxiety_modifier: "Angst vor dem Fluch"
 pam_adorcism_curse_anxiety_modifier_desc: "Dieser Charakter wird den Gedanken nicht los, dass jedes Unglück, das ihn ereilt, auf ihn herabbeschworen wurde."
 pam_adorcism_battle_guidance_modifier: "Eine geistergeleitete Strategie"
 pam_adorcism_battle_guidance_modifier_desc: "Dieser Charakter ist davon überzeugt, dass die Geister ihm günstige Zeichen für die bevorstehende Schlacht offenbarten."
 pam_adorcism_personal_vigor_modifier: "Geistergeschenkte Kraft"
 pam_adorcism_personal_vigor_modifier_desc: "Dieser Charakter erhält durch das rituelle Selbstvertrauen Stärke im Nahkampf."
 pam_adorcism_campaign_endurance_modifier: "Geistererfülltes Heer"
 pam_adorcism_campaign_endurance_modifier_desc: "Die Armeen dieses Charakters durchstehen lange Feldzüge mit ungebrochener Überzeugung."
