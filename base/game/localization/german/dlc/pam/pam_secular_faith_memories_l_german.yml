l_german:
 # Character memories raised by the secular-faith flavor events.
 # Owner = the ruler who remembers; participant role names match the type definitions.
 pam_sf_kings_touch_healing_memory: "heilte die Kranken durch eine Berührung"
 pam_sf_kings_touch_healing_memory_desc: "Ich legte [healed_subject.GetTitledFirstName], [Select_CString(healed_subject.IsFemale, 'die', 'der')] schwer erkrankt war, die Hände auf und [healed_subject.Custom('DE_PRO_PER_S_3P_N')] genas."
 pam_sf_kings_touch_healing_memory_desc_second_perspective: "Ihr legtet [healed_subject.GetTitledFirstName], [Select_CString(healed_subject.IsFemale, 'die', 'der')] schwer erkrankt war, die Hände auf und [healed_subject.Custom('DE_PRO_PER_S_3P_N')] genas."
 pam_sf_kings_touch_healing_memory_desc_third_perspective: "[owner.GetTitledFirstName] legte [healed_subject.GetTitledFirstName], [Select_CString(healed_subject.IsFemale, 'die', 'der')] schwer erkrankt war, die Hände auf und [healed_subject.Custom('DE_PRO_PER_S_3P_N')] genas."
 pam_sf_deliverance_memory: "führte einen Exorzismus durch"
 pam_sf_deliverance_memory_desc: "[delivered_soul.GetTitledFirstName|U] wurde von einem gewalttätigen Geist ergriffen, und ich führte einen Exorzismus durch."
 pam_sf_deliverance_memory_desc_second_perspective: "[delivered_soul.GetTitledFirstName|U] wurde von einem gewalttätigen Geist ergriffen, und Ihr führtet einen Exorzismus durch."
 pam_sf_deliverance_memory_desc_third_perspective: "[delivered_soul.GetTitledFirstName|U] wurde von einem gewalttätigen Geist ergriffen, und [owner.GetTitledFirstName] führte einen Exorzismus durch."
 pam_sf_prophecy_fulfilled_memory: "sah eine Prophezeiung wahr werden"
 pam_sf_prophecy_fulfilled_memory_desc: "[prophet.GetTitledFirstName|U] warnte mich, dass [doomed.GetTitledFirstName] sterben würde, und das tat [doomed.Custom('DE_PRO_PER_S_3P_N')] dann auch."
 pam_sf_prophecy_fulfilled_memory_desc_second_perspective: "[prophet.GetTitledFirstName|U] warnte Euch, dass [doomed.GetTitledFirstName] sterben würde, und das tat [doomed.Custom('DE_PRO_PER_S_3P_N')] dann auch."
 pam_sf_prophecy_fulfilled_memory_desc_third_perspective: "[prophet.GetTitledFirstName|U] warnte [owner.GetTitledFirstName], dass [doomed.GetTitledFirstName] sterben würde, und das tat [doomed.Custom('DE_PRO_PER_S_3P_N')] dann auch."
