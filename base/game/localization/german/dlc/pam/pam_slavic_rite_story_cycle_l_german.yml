l_german:
 # MAIN EVENTS
 # Introduction by the realm priest
 slavic_rite.1000.t: "Die glagolitische Schrift"
 slavic_rite.1000.desc: "„Nur weiter, Bruder [greek_preacher.GetFirstName]“, führt mein [court_chaplain.GetActiveCouncilTask.GetPositionName] den [greek_preacher.Custom('MyPriestTitle')] herein, der ein Anhänger des [GetRiteByKey('byzantine_rite').GetAdjective|l]en Ritus ist.\n\n„Euer Reich möge gesegnet sein, o [ROOT.Char.GetTitleAsNameNoTooltip]. Meine Brüder machen gute Fortschritte mit der Schrift für Eure Leute. Doch leider arbeiten wir im Schatten und unter der Bedrohung der Priester der [GetRiteByKey('carolingian_christianity').GetAdherentName], die die kirchliche Autorität über Eure Lande erlangen wollen. [Glossary('Kyrill und Method', 'CYRIL_AND_METHODIUS_GLOSS')] baten mich, mehr Zeit anzufragen, damit wir eine Strategie entwickeln können, um Zwiste zu vermeiden und diplomatische Lösungen zu erarbeiten.“"
 slavic_rite.1000.a: "Wir sind schon so weit gekommen. Ich zähle auf sie."
 slavic_rite.1000.a_tt: "[Glossary('Kyrill und Method', 'CYRIL_AND_METHODIUS_GLOSS')], die Brüder, die eine neue slawische Schrift entwickelten, werden Euch schon bald über ihren nächsten Schritt in Kenntnis setzen, um einen neuen [court_chaplain.GetFaith.GetAdjective|l]en [rite|E] in Eurem Reich zu verbreiten."
 slavic_rite.1000.b: "Wir sollten diesen Weg besser aufgeben, als den Zorn der [GetRiteByKey('carolingian_christianity').GetAdherentNameNoTooltip] zu spüren bekommen."
 slavic_rite.1000.b_tt: "Alle Bemühungen, eine neue einheimische Schrift und einen neuen [rite|E] durch [Glossary('Kyrill und Method', 'CYRIL_AND_METHODIUS_GLOSS')] einzuführen, werden aufgegeben."
 slavic_rite.1000.b_tt_2: "[story_cycle|E] endet: $story_slavic_rite$."
 # Travel to Rome Initiation
 slavic_rite.0001.t: "Die mährische Mission"
 slavic_rite.0001.desc: "Ich bin erleichtert, [Glossary('Kyrill und Method', 'CYRIL_AND_METHODIUS_GLOSS')] wiederzusehen, und hoffe, dass sie einen Plan haben, wie wir mit der Einmischung der [GetRiteByKey('carolingian_christianity').GetAdherentName] umgehen sollen.\n\n„[Select_CString(ROOT.Char.IsFemale, 'Ehrwürdige', 'Ehrwürdiger')] [ROOT.Char.GetTitleAsNameNoTooltip], es scheint, als sei der einzige Weg, die Sicherheit Eures Volkes und ihrer Art der Verehrung sicherzustellen, nach [pope_scope.GetCapitalLocation.GetBaronyNameExplicitly] zu reisen und den Segen von [pope_scope.GetTitledFirstName] zu empfangen.“\n\nIch hoffe sehr, dass die Autorität des Throns Petri die tyrannischen [GetRiteByKey('carolingian_christianity').GetAdherentNamePluralNoTooltip] zügeln kann, doch es kommt mir so vor, als würden sie nur die eigene Obrigkeit achten."
 slavic_rite.0001.a: "Möge die höchste Macht Euch auf Eurer Reise behüten."
 slavic_rite.0001.a_tt: "[cyril_scope.GetFirstName|U] und [methodius_scope.GetFirstName] beginnen ihre Reise. Wenn sie erfolgreich verläuft, wird ihre Rückkehr eine neue religiöse Bewegung in Eurem Reich auslösen."
 slavic_rite.0001.b: "Ihr werdet nicht mit leeren Händen gehen."
 slavic_rite_travel_toast_title: "Kyrill und Method beginnen ihre Reise"
 slavic_rite_moravian_mission_gift_sent_tooltip: "Ein Geschenk wird nach [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] geschickt. Die Brüder werden Euch nach Ihrer Rückkehr in Kenntnis setzen, wie es ankam."
 # Archbishop of Salzburg informed of the Rite
 slavic_rite.0003.t: "Geburt des [methodius_scope.GetRite.GetName]"
 slavic_rite.0003.desc: "Ich erhielt Kunde, dass [methodius_scope.GetFirstNameNoTooltip] versucht, mit der Hilfe von [moravia_liege_scope.GetTitledFirstNameNoTooltip] eine neue Weise zu verbreiten, wie der Glaube ([methodius_scope.GetFaith.GetNameNoTooltip]) überall in den [moravia_liege_scope.GetCulture.GetNameNoTooltip|l]en Landen auszuleben sei. Meine Gelehrten nennen es den [methodius_scope.GetRite.GetName].\n\nTrotz unserer vorherigen Bemühungen, die Einheimischen uns gleichzusetzen, schaffte [methodius_scope.GetFirstNameNoTooltip] es, eine Erlaubnis von [pope_scope.GetTitledFirstName] zu erlangen, ihnen eine neu entwickelte Schrift angedeihen zu lassen."
 slavic_rite.0003.a: "Lasst uns abwarten, wie erfolgreich [methodius_scope.Custom('DE_PRO_POS_S_3P')]e Methoden sind."
 # Vassals of Moravia informed of the Rite
 slavic_rite.0004.t: "Der [ROOT.Char.GetCulture.GetNameNoTooltip|l]e [methodius_scope.GetRite.GetNameNoTooltip]"
 slavic_rite.0004.desc_pagan: "Spannende Neuigkeiten erreichen heute früh meinen Hof.\n\n[liege_scope.GetTitledFirstNameNoTooltip|U] erlaubte eds dem [methodius_scope.GetCulture.GetNameNoTooltip|l]en Priester, weiter [methodius_scope.Custom('DE_PRO_POS_S_3P')]e unchristlichen Praktiken in unseren Landen zu verbreiten. Der Glaube ([methodius_scope.GetFaith.GetNameNoTooltip]) wird so gestaltet sein, dass er für jene, die ihn ausüben wollen, den [ROOT.Char.GetCulture.GetNameNoTooltip|l]en Lebensstil erleichtert.\n\nIn letzter Zeit wurde viel zu viel Aufhebens um die spirituellen Gebräuche unserer Traditionen getrieben. Ich muss mir vielleicht endlich Gedanken darüber machen, wie ich mit all dem fortfahre."
 slavic_rite.0004.desc_chalcedonian: "[Select_CString(liege.IsFemale, 'Unsere', 'Unser')] [liege_scope.GetTitleAsNameNoTooltip] verfügte die Einführung des [methodius_scope.GetRite.GetNameNoTooltip] und dass dieser in [liege_scope.Custom('DE_PRO_POS_S_3P')]em gesamten Reich zu verbreiten ist. Meinen Gelehrten zufolge ist es ein angenehmerer Weg, den Glauben ([methodius_scope.GetFaith.GetNameNoTooltip]) zu praktizieren, ohne dabei unserem Lebensstil zu schaden.\n\nVielleicht lohnt sich die Aufmerksamkeit?"
 slavic_rite.0004.a_pagan: "Die Bräuche unserer Vorfahren sind überlegen."
 slavic_rite.0004.b_pagan: "Vielleicht liegt darin etwas Wahrheit …"
 slavic_rite.0004.a_chalcedonian: "Ich habe kein Verlangen, vom wahren Pfad abzuweichen."
 slavic_rite.0004.b_chalcedonian: "Bringt die Gelehrten herbei."
 # Return of Methodius and the Slavic Rite
 slavic_rite.0005.t: "Eine bittersüße Reise"
 slavic_rite.0005.desc: "[methodius_scope.GetFirstName|U] steht vor mir, dieses Mal allein nach [methodius_scope.Custom('DE_PRO_POS_S_3P')]er Rückkehr aus [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Als ich ihn nach [cyril_scope.GetFirstName] frage, verfinstert sich [methodius_scope.Custom('DE_PRO_POS_S_3P')]e Miene.\n\n„Die gute Nachricht, [Select_CString(ROOT.Char.IsFemale, 'barmherzige', 'barmherziger')] [ROOT.Char.GetTitleAsNameNoTooltip], ist, dass [pope_scope.GetTitledFirstName] uns [pope_scope.Custom('DE_PRO_POS_S_3P')]en Segen gab, mit unseren eigenen Methoden und Schriften den Glauben unter den [ROOT.Char.GetCulture.GetNameNoTooltip|l]en Leuten und überall in Eurem Reich zu verbreiten.“ Er holt tief Luft. „Doch leider war ich gezwungen, meinen Bruder zurückzulassen. Ich werde alles geben, damit unsere Bemühungen nicht umsonst waren. Möge die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) uns allen beistehen.“"
 slavic_rite.0005.a: "Gemeinsam werden wir Euren Bruder mit Stolz erfüllen!"
 slavic_rite.0005.b: "Das Mindeste, was ich tun kann, ist, sein Vermächtnis zu ehren."
 pam_cyril_statue_modifier: "Gedenken an Kyrill"
 pam_brothers_travel_safety_modifier: "Umsichtige Reise"
 slavic_rite.0005.c: "Viel Glück auf Eurer Mission."
 slavic_rite_mass_conversion_tooltip: "Eine Massenbekehrungs-[great_project|E] ist für alle [duchies|E] in [moravia_liege_scope.GetPrimaryTitle.GetNameNoTier] geplant, mit dem Ziel, dass alle ihre [counties|E] [methodius_scope.GetRite.GetName] folgen sollen"
 slavic_rite_moravian_mission_gift_received_tooltip: "Euer Geschenk an [pope_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] wurde mit Dankbarkeit empfangen."
 slavic_rite_ecclesiastical_title_creation_tooltip: "$slavic_rite_ecclesiastical_title$ wurde erschaffen und [methodius_scope.GetFirstName] wird der erste [holder|E]"
 slavic_rite_ecclesiastical_title: "$d_et_archdiocese_prefix$ von Mähren"
 slavic_rite_ecclesiastical_title_name: "Mähren"
 # Return of Methodius and the Slavic Rite
 slavic_rite.0006.t: "Ende der mährischen Mission"
 slavic_rite.0006.desc.brothers_are_dead: "Mit dem Tod der Brüder [Glossary('Kyrill und Method', 'CYRIL_AND_METHODIUS_GLOSS')] ist niemand mehr da, der gleichermaßen begabt ist, um ihre liturgische Arbeit fortzusetzen. Wir müssen unsere eigene Vorgehensweise entwickeln, um die vollständige Bekehrung meines Volkes zu erreichen – sofern wir dies denn noch wollen."
 slavic_rite.0006.desc.no_longer_christian: "Ich sah den Weg zum Ruhm. Was mich einst antrieb, meinem Volk und meinem Haus Glückseligkeit zu bringen, scheint nun völlig unbedeutend. Der Weg, der ihnen zugedacht war, war anders als der, den ich ihnen gewünscht hätte. Zum Glück zeigte uns die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) den richtigen Weg."
 slavic_rite.0006.desc.no_longer_king: "Die Ereignisse in letzter Zeit und der Verlust meiner mächtigen Stellung lehrten mich, nicht mehr Verantwortung zu übernehmen, als ich bewältigen kann. Derzeit können wir die mährische Mission nicht aufrechterhalten. Vielleicht können wir sie unter anderen Bedingungen wiederaufnehmen, sobald wir uns erholt haben.\n\nBis dahin muss [ROOT.Char.GetPrimaryTitle.GetNameNoTier] beschützt werden, damit ihm nicht das gleiche Schicksal widerfährt."
 slavic_rite.0006.desc.no_longer_slav: "Meine Ahnen wären vermutlich nicht sehr stolz darauf, was aus mir geworden ist.\n\nDoch so möge es eben sein. Es ist nicht an ihnen, darüber zu entscheiden, wie man über [ROOT.Char.GetPrimaryTitle.GetNameNoTier] herrscht. Allein ich vermag dies."
 slavic_rite.0006.a.brothers_are_dead: "Es hat nicht sein sollen …"
 slavic_rite.0006.a.no_longer_christian: "Die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) sei gepriesen!"
 slavic_rite.0006.a.no_longer_king: "Solche Ambitionen kann ich mir nicht mehr leisten."
 slavic_rite.0006.a.no_longer_slav: "Das glagolitische Alphabet war eine Last für mein Volk."
 slavic_rite.0006.a.tooltip: "$story_slavic_rite$, um das Reich zu evangelisieren, ist hinfällig."
 # All counties under the new archdiocese are successfully converted to Slavic Rite, and the story ends
 slavic_rite.0007.t: "Ein geeintes Reich dank der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])"
 slavic_rite.0007.desc: "„#italic … dass wir unter [ROOT.Char.Custom('DE_PRO_POS_S_3P')]er Herrschaft ein ruhiges und friedliches Leben\nin Gottesfurcht und Würde\nführen.\nDenn Dein ist das Reich und die Kraft und die Herrlichkeit,\njetzt und allezeit und in Ewigkeit. Amen.#!“\n\nAls [archdiocese_holder.GetTitledFirstName] das Gebet beschließt, legt sich ein Gefühl ewiger Glückseligkeit über meine Seele. Unsere Mission, unsere eigene himmlische Tradition zu haben, reicht in alle Ecken meines Reichs und erweist sich als siegreich. Möge die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) mein Haus, [Glossary('Kyrill und Method', 'CYRIL_AND_METHODIUS_GLOSS')] und die guten Menschen von [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] segnen."
 slavic_rite.0007.a: "Wir waren dazu bestimmt, den geweihten Weg zu beschreiten."
 pam_slavic_rite_clergy_opinion_modifier: "Gesegneter Monarch"
 slavic_rite.0007.b: "Es gibt nichts, was mein Volk nicht ertragen könnte."
 pam_slavic_rite_culture_opinion_modifier: "Volksmonarch"
 # RANDOM EVENTS
 # 0010 - Conflict with Frankish preachers
 slavic_rite.0010.t: "Heimliche Prediger"
 slavic_rite.0010.desc: "Begleitet von meinem Kaplan [court_chaplain.GetTitledFirstName] betreten mit unverschämten Mienen ein [undercover_preacher.GetCulture.GetNameNoTooltip|l]er [undercover_preacher.Custom('MyPriestTitle')] und [undercover_preacher.Custom('DE_PRO_POS_S_3P')] Gefolge von Predigern meine Hallen.\n\n„Seid gegrüßt, mein[ROOT.Char.Custom('DE_END_PRO_S_N')] [ROOT.Char.GetTitleAsNameNoTooltip]. Wir entdeckten diese Eindringlinge, die die Worte der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) predigen, ohne die Autorität von [court_chaplain_superior.GetTitledFirstName] oder die Eurige.“ [court_chaplain.Custom('DE_PRO_PER_S_3P_N')|U] unterbricht sich, um die Fremdländer von Kopf bis Fuß zu mustern, ehe er sich mir noch einmal zuwendet.\n\n„Es heißt, sie hätten schon eine ganze Weile im Verborgenen gelauert und versucht, die Seelen unserer arglosen Untertänigen zu verführen und zu beflecken. Wie wünscht Ihr, dass wir mit ihnen verfahren sollen?“"
 slavic_rite.0010.a: "Hinfort und kehrt nie wieder in meine Lande zurück."
 slavic_rite.0010.b: "Unsere früheren Warnungen waren offenbar nicht ausreichend."
 slavic_rite.0010.c: "Ihr müsst Euren enttäuschten Herren nicht gegenübertreten."
 slavic_rite.0010.c.success: "[undercover_preacher.Custom('DE_PRO_PER_S_3P_N')|U] will gern ein neues Leben an Eurem Hof beginnen"
 slavic_rite.0010.c.failure: "[undercover_preacher.Custom('DE_PRO_PER_S_3P_N')|U] ist nicht überzeugt"
 preacher_recruited.t: "Prediger angeworben"
 preacher_left.t: "Prediger ist gegangen"
 # 0020
 slavic_rite.0020.t: "Zuschuss für eine fromme Sache"
 slavic_rite.0020.desc: "„Sie wollen die Einheimischen nicht ausnutzen, m[ROOT.Char.Custom('DE_ART_IND_N')] [ROOT.Char.GetTitleAsNameNoTooltip]. Die umherwandernden Prediger von [court_chaplain_superior.GetTitledFirstName] sind dahingehend sehr rücksichtsvoll. Sie wollten sogar, dass ich mit Euch spreche, was eine anerkennenswerte Demut zeigt. Eine Bestätigung würde die gesamte Anstrengung für sie und Euer Volk viel einfacher machen.“\n\nDie Bemühungen von [court_chaplain.GetTitledFirstName], mich im Namen anderer zu überzeugen, ist beachtenswert, doch ich komme nicht umhin, mich zu fragen, ob [court_chaplain.Custom('DE_PRO_PER_S_3P_N')] sich stattdessen lieber ganz der Aufgabe widmen sollte, meinem Volk dabei zu helfen, seine alten Traditionen zu überwinden.\n\n„Ich habe das Gefühl, dass die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) damit versucht, Euch eine Möglichkeit zu schaffen, näher zu ihr zu gelangen.“"
 slavic_rite.0020.a: "Je schneller wir mein Volk von der Gottlosigkeit befreien, desto besser."
 pam_slavic_rite_great_project_speed_modifier: "Finanziertes Bekehrungsvorhaben"
 slavic_rite.0020.b: "Das ist alles, was wir erübrigen können."
 slavic_rite.0020.c: "Auf keinen Fall."
 # 0030
 slavic_rite.0030.t: "Eine Debatte zwischen Ost und West"
 slavic_rite.0030.desc: "Eine sanfte Brise weht durch das Laub des Klostergartens, als sich zwei Geistliche, die bei [court_chaplain_superior.GetTitledFirstName] zu Gast sind, in einer Debatte aufeinandertreffen. Einer von ihnen ist der östlichen Sitte nach gekleidet, der andere nach westlicher. Ihre zunächst demütigen Stimmen werden zunehmend selbstbewusster und leidenschaftlicher.\n\nSie diskutieren viele liturgische Sachverhalte, tauschen sich über gelehrte Streitigkeiten und faszinierende Argumente aus und jeder Satz vertieft mein Interesse.\n\nDas ist mehr als ein Gespräch: Dies steht für einen Wettbewerb zwischen zwei Welten und zeigt eine fragile Harmonie – oder eine tiefere Spaltung."
 slavic_rite.0030.a: "Der [visiting_byzantine_clergy.GetCulture.GetNameNoTooltip|l]e [visiting_byzantine_clergy.Custom('MyPriestTitle')] ist in seinen Argumenten sehr einleuchtend."
 slavic_rite.0030.b: "Die Argumente von [visiting_carolingian_clergy.GetNameNoTooltip] haben etwas Faszinierendes an sich."
 slavic_rite.0030.c: "Wissen ist Wissen – ich stimme beiden zu."
 slavic_rite.0030.d: "Unsere Wege sind diesen uralten Prinzipien überlegen."
