l_german:
 ##################################################
 # CHRISTIAN SITUATION EVENTS
 ##################################################
 #Fragile Unity Phase
 pam_the_christian_church.0051.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0051.desc.intro: "Die [GetSituation('the_christian_church').GetTopSubRegion.GetName] umfasst viele Reiche und besteht aus Myriaden unterschiedlicher Völker und deren Sprachen, Kulturen und Steitigkeiten.\n\nObgleich Meinungsverschiedenheiten über die Lehre so alt wie die Kirche selbst sind, wird in diesen Zeiten, in denen uns Seuchen, Kriege und Ketzerei plagen, unsere Einheit herausgefordert.\n\nSo wie [st_paul.GetName], der Apostel, die Korinther anwies, nach Einheit zu streben, so sollten alle [christians|E] [st_paul.Custom('DE_PRO_POS_S_3P')]em Rat folgen: [Glossary('non sint in vobis schismata', '1_CORINTHIANS_1_10_LATIN_GLOSS')]. Falls nicht, werden wir uns im Sumpf der Ketzerei wiederfinden und nichts anderes sein als Spielbälle des Antichristen.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Unsere weichleibigen Nachbarn, die [christians|E], folgen einem schwachen und eifersüchtigen Gott und streiten wie Kinder über die Beschaffenheit ihrer Puppe. Dabei ist ihre Wachsamkeit getrübt und ihre Schwerter darben, denn lange ist es her, dass sie sich an einem ehrlichen Blutvergießen labten.\n\nSie wollen uns heilige Männer schicken, um ihre Schwäche in unseren Landen zu verbreiten. Wir sollten unseren eigenen Besuch bei ihnen machen und ihnen die Schatzkammern plündern! Durch unser Beispiel lernen sie vielleicht, wieder stark zu sein."
 pam_the_christian_church.0051.desc.heathen_rulers: "Unsere [Concept('christian', 'christlichen')|El] Nachbarn sind grobe, zankende Leute. Sie sind wie Schlick im Wasser, ein angelaufener Spiegel für die höchste Macht ([ROOT.Char.GetFaith.HighGodName]). Da sie an der Vergangenheit hängen, werden ihre falschen Überzeugungen nur zu ihrem Untergang führen.\n\nIhre Reichtümer, so mager sie auch sein mögen, sind leicht zu haben. Ihre Leute, so undiszipliniert sie auch sein mögen, sind reif für die Unterwerfung."
 pam_the_christian_church.0051.desc.heretic_rulers: "Das Schwein auf dem Thron von [st_peter.GetName] heißt uns Ketzer, weil wir die wahren Gläubigen sind. Würde Christus wiedergeboren, würde er gewiss zu einem Pharisäer und die erneute Kreuzigung des Herrn fordern.\n\nSchaut auf die Spaltung zwischen uns, die wir Christus unseren Herrn nennen! Der falsche Priester in Rom ist es, der die Saat der Zwietracht ausbringt.\n\nDieser Stellvertreter Satans strebt danach, uns zu Märtyrern zu machen. Wahrhaftig, dieses Übel muss beseitigt werden, damit alle [christians|E] gerettet werden können!"
 pam_the_christian_church.0051.desc.western: "Nachdem die Macht des Bischofs von Rom geschwunden ist, müssen wir die Risse im Glauben kitten, während wir uns dem Jüngsten Gericht nähern."
 pam_the_christian_church.0051.desc.eastern: "Von den Feinden Christi umzingelt müssen wir uns mit dem Bischof von Rom verbünden, während wir uns dem Jüngsten Gericht nähern."
 pam_the_christian_church.0051.desc.investiture_temporal: "\n\nDas Konzil lässt die Kronen frei von der Kirche ernannte Prälaten absetzen."
 pam_the_christian_church.0051.desc.oriental_orthodox: "„[Glossary('Mia physis tou theou logou sesarkomene', 'MIAPHYSITISM_GLOSS')]“. Wir müssen unsere Brüder wieder ins Licht führen, während wir uns dem Jüngsten Gericht nähern."
 pam_the_christian_church.0051.a: "Unter der Führung Christi!"
 pam_the_christian_church.0051.b: "Wir müssen diese Anhänger Christi im Auge behalten."
 MIAPHYSITISM_GLOSS: "#bold „Es gibt eine volle Einheit der Natur des fleischgewordenen Wortes Gottes!“#!, verkündete Kyrill von Alexandria auf dem Konzil von Ephesos im Jahre 431. Diese christologische Lehre, auch bekannt als Miaphysitismus, wird gemeinhin von den orientalisch-orthodoxen Kirchen vertreten."
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0052.desc.intro: "Ein Chor von Stimmen ertönt in der Finsternis, die die [GetSituation('the_christian_church').GetTopSubRegion.GetName] umgibt.\n\n#EMP „Rom begibt sich in die Rolle eines Sodoms unserer Tage!“#!\n\n#EMP „Der Papst macht sich selbst zum Kuppler und zur Hure zugleich!“#!\n\nSelbst jene mit einer eher gemäßigten Sichtweise müssen zugeben, dass die Kirche in einer Krise steckt und dass Reformen notwendig sind."
 pam_the_christian_church.0052.desc.unreformed_pagan: "Unsere willensschwachen Nachbarn, die [christians|E], klagen: „Unser Ende ist nah! Unser Papst ist so wild wie ein Heide.“\n\nZumindest eines dieser Dinge ist wahr. Lasst uns ihnen dabei helfen, jenes Ende zu finden, das sie so oft herbeirufen!"
 pam_the_christian_church.0052.desc.heathen_rulers: "„Unsere Kirche erlebt eine Krise!“, klagen die [christians|E].\n\nGut von ihnen, dass sie aussprechen, was wir schon immer wussten. Diese heidnischen Narren können hoffen, eines Tages unserem Beispiel zu folgen und die Lehre der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) anzunehmen.\n\nIhre Reichtümer, so mager sie sein mögen, warten nur darauf, dass man sie sich nimmt. Ihre Leute, so undiszipliniert sie sein mögen, sind reif, unterworfen zu werden."
 pam_the_christian_church.0052.desc.heretic_rulers: "Dieser Antichrist im Gewand des Heiligen Petrus muss aufgehalten werden!"
 pam_the_christian_church.0052.desc.western: "Der Wandel muss in Rom geschehen, denn nur dann kann die [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip|l] heilen."
 pam_the_christian_church.0052.desc.eastern: "Von den Feinden Christi umzingelt müssen wir die Korruption in Rom beseitigen oder wir werden von ihr verschlungen."
 pam_the_christian_church.0052.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0052.a: "Möge der Herr unseren Pfad erhellen!"
 pam_the_christian_church.0052.b: "$pam_the_christian_church.0051.b$"
 #Conversion Phase
 pam_the_christian_church.0053.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0053.desc.intro: "Wir müssen frohlocken ob des großartigen Fortschritts unserer Mission! Die Grenzen der [GetSituation('the_christian_church').GetTopSubRegion.GetName] dehnen sich aus, denn die heidnischen Wilden lernen, den Pfad Christi zu beschreiten.\n\nLeider heißen nicht alle die Lehren der Kirche willkommen. Fürchtet euch nicht, denn wenn sie unsere Missionare ablehnen, werden sie unsere Gebete durch die Spitze eines Schwertes kennenlernen!\n\n"
 pam_the_christian_church.0053.desc.unreformed_pagan: "Die [christians|E] kommen mit ihren heiligen Männern in unsere Lande. Wenn wir sie zurückweisen, so kehren sie mit ihren Schwertern zurück.\n\nObgleich viele von uns versuchen, den Wegen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) treu zu bleiben, gibt es einige, die Vorteile darin erkennen, diesem Menschengott zu dienen, diesem Christus. Sobald unsere eigene Macht göttlich legitimiert ist, kann die Kirche als unser Bote dienen und, was noch verlockender ist, Steuern eintreiben."
 pam_the_christian_church.0053.desc.heathen_rulers: "Unsere Nachbarn, die [christians|E], bekehren die Götzenanbeter mit Gewalt, wenn Letztere doch kaum zu etwas mehr wert sind, als dass man sie erschlägt.\n\nObgleich ihre Schwerter nicht auf uns zeigen, schuf die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) eine günstige Gelegenheit für uns. Ihre Reichtümer, so gering sie auch sein mögen, sind zum Greifen nah. Ihre Leute, so undiszipliniert sie auch sein mögen, sind reif für die Unterwerfung."
 pam_the_christian_church.0053.desc.heretic_rulers: "Der Heuchler in Rom hofft, Heiden zu seiner falschen Verehrung zu bekehren! Dieser Antichrist wird sich nicht damit zufriedengeben, den Verstand der [christians|E] vergiftet zu haben, sondern sein perverser Hunger strebt danach, diese unerfahrenen Götzenanbeter in seine höllischen Arme zu treiben."
 pam_the_christian_church.0053.desc.western: "Wir müssen vorsichtig sein, denn diese neu geborenen Christen werden dahingehütet, den [ROOT.Char.GetRite.GetName] anzubeten, so wie man es vom Petersdom aus gutheißt."
 pam_the_christian_church.0053.desc.eastern: "Obwohl Rom behauptet, lediglich die Bekehrung derer zu wollen, die außerhalb einer bestimmten Region ([GetSituation('the_christian_church').GetTopSubRegion.GetName]) leben, müssen wir wachsam bleiben, sollte es uns unseren [ROOT.Char.GetRite.GetName] wegnehmen – oder noch schlimmer: seine von heidnischem Blut noch feuchten Schwerter gegen seine Mitchristen erheben."
 pam_the_christian_church.0053.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0053.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0053.b: "$pam_the_christian_church.0051.b$"
 #Reform Phase
 pam_the_christian_church.0054.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0054.desc.intro.head: "$pam_the_christian_church.0054.desc.intro.common$\n\n[christianity.GetReligiousHead.GetTitledFirstName] hat eine große Sache vor sich, doch die Kirche ist nicht verloren.\n\n"
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nDennoch ist die Kirche nicht unrettbar verloren!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Unser Glaube an Gott mag unerschütterlich sein, doch viele andere haben den Glauben an die Kirche verloren. Einst war der Klerus beispielhaft in seinen Handlungen, die denen Christi glichen, aber inzwischen büßte er einen großen Teil seiner Unabhängigkeit ein und wurde zu einem Werkzeug des Einflusses von Kaisern und Königen."
 pam_the_christian_church.0054.desc.unreformed_pagan: "Die [christianity.GetAdherentNamePlural] zerren an ihren geistlichen Prunkgewändern und hoffen, dass Gott die Flicken nicht bemerkt. Wenn sie damit beschäftigt sind, Messgewänder zu stopfen und Jahrbücher zu führen, schicken sie vielleicht weniger Kleriker, um unsere Haine und Flussheiligtümer zu behelligen."
 pam_the_christian_church.0054.desc.heathen_rulers: "Die [christianity.GetAdherentNamePlural] bereiten eine Erneuerung ihrer Gesetze und Altäre vor, und jede Fraktion verspricht einen reineren Dienst für einen Gott des Leidens. Wir nehmen ihre neuen Sprüche zur Kenntnis, doch die Klingen unserer Äxte antworten immer noch deutlicher als ihre Konzile."
 pam_the_christian_church.0054.desc.heretic_rulers: "Die Sektierer Roms zanken sich nun wegen einer Reformation! Was sie eine Umwälzung nennen, ist nur eine Neuanpassung desselben Jochs, verschärft durch eine tödlichere Selbstgerechtigkeit. Lasst die Reformation in ihren eigenen Kirchen Schädel zertrümmern, bevor sie sich an uns erinnern."
 pam_the_christian_church.0054.desc.western: "Obgleich einige diese Neausrichtung des Ruders eine Reformation nennen mögen, stehen die Leute Erneuerungen abwartend gegenüber, doch sie fühlen sich vielleicht eher angesprochen, wenn man dies alles als eine „Rückkehr zu früheren Zeiten“ bezeichnen würde."
 pam_the_christian_church.0054.desc.eastern: "Rom, oder welche Kurienkammer auch immer sich als Schiedsrichterin der gesamten Christenheit bezeichnet, arbeitet daran, die eigenen Riten aufzupolieren: ein neuer Kanon, neue Eide, neue Mahner gegen alte Laster. Wir beobachten, wir tadeln und wir stärken unsere eigenen Synoden, damit eine westliche Form der Mäßigung nicht mit einem universellen Joch verwechselt wird."
 pam_the_christian_church.0054.desc.investiture_spiritual: "\n\nDas Konzil entschied sich für das Ernennungsrecht der Kirche auf Lebenszeit."
 pam_the_christian_church.0054.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0054.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0054.b: "$pam_the_christian_church.0051.b$"
 #Investiture Crisis Phase
 pam_the_christian_church.0055.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0055.desc.intro.head: "$pam_the_christian_church.0055.desc.intro.common$\n\nWeltliche Fürsten verlangen von den Bischöfen [christianity.GetReligiousHeadTitle.GetNamePossessive] Eide, als wäre die Weihe nur wie ein weiterer Bauernhof, den es zu pachten gibt. Währenddessen verbietet [christianity.GetReligiousHeadTitle.GetName] gekrönten Händen, Mitren zu segnen, die sie nicht geweiht haben.\n\n"
 pam_the_christian_church.0055.desc.intro.no_head: "$pam_the_christian_church.0055.desc.intro.common$\n\nOhne einen eindeutigen Hirten beruft jeder Thron seine eigenen Bischöfe: Die Roben sind heilig, doch die Weihen riechen eher nach Geld als nach Weihrauch.\n\n"
 pam_the_christian_church.0055.desc.intro.common: "Über ein großes Gebiet ([GetSituation('the_christian_church').GetTopSubRegion.GetName]) hinweg ist die Fehde zwischen Altar und Thron nicht länger reines Gerede."
 pam_the_christian_church.0055.desc.unreformed_pagan: "Während die [christianity.GetAdherentNamePlural] darüber streiten, ob eine Krone oder ein liturgisches Gewand einen Bischof ernennt, blicken immer weniger missionarische Augen in unsere Richtung. Lasst Könige und Pontifexe an den Chartas des jeweils anderen ersticken. Ihre Spaltung lässt unsere Haine ruhiger werden."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "Rom beklagt die Tyrannei der Investitur, würde aber dennoch unsere Lehrer mit Fesseln belegen, wenn sie ihrer habhaft würden! Legt erst Eure eigenen Fesseln ab, Pharisäer, bevor Ihr uns belehrt!"
 pam_the_christian_church.0055.desc.western: "Wenn wir den Bischofsstab zu weit zum Zepter neigen, könnte man sie am Ende gar verwechseln.\n\n"
 pam_the_christian_church.0055.desc.eastern: "Westliche Könige streiten mit Rom über Ringe und Stäbe, und ihre sündigen Sitten befleckt die ganze Kirche.\n\n"
 pam_the_christian_church.0055.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0055.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0055.b: "$pam_the_christian_church.0051.b$"
 #Crusade Phase
 pam_the_christian_church.0056.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0056.desc.intro: "Über ein großes Gebiet ([GetSituation('the_christian_church').GetTopSubRegion.GetName]) hinweg fordern die Gläubigen die Befreiung des Heiligen Grabes. Kreuze werden für den Marsch poliert und Reliquien für Kriegskassen verpfändet.\n\nDer Eifer brennt leidenschaftlich, doch sollte er sich abkühlen, könnte er so rasch zu Zweifeln gerinnen, wie Asche von einem Scheiterhaufen verweht.\n\n"
 pam_the_christian_church.0056.desc.unreformed_pagan: "$pam_the_christian_church.0053.desc.unreformed_pagan$"
 pam_the_christian_church.0056.desc.heathen_rulers: "$pam_the_christian_church.0053.desc.heathen_rulers$"
 pam_the_christian_church.0056.desc.heretic_rulers: "Ihre Kriegstreiber rufen zum Kreuzzug, während sie ihre eigenen Lande vernachlässigen: Lasst die Römer sich in fernen Wüsten verausgaben."
 pam_the_christian_church.0056.desc.western: "Stahl gelingt womöglich, was die Predigt nicht vermag.\n\n"
 pam_the_christian_church.0056.desc.eastern: "Die westlichen Heerscharen marschieren in Richtung des Heiligen Landes.\n\n"
 pam_the_christian_church.0056.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0056.a: "$pam_the_christian_church.0052.a$"
 pam_the_christian_church.0056.b: "$pam_the_christian_church.0051.b$"
 #Concord Phase
 pam_the_christian_church.0057.t: "$situation_the_christian_church$ – [GetSituation('the_christian_church').GetTopCurrentPhase.GetType.GetNameNoTooltip]"
 pam_the_christian_church.0057.desc.intro.head: "$pam_the_christian_church.0057.desc.intro.common$ Es steht unter der aufmerksamen Wacht [christianity.GetReligiousHeadTitle.GetNamePossessive].\n\n"
 pam_the_christian_church.0057.desc.intro.no_head: "$pam_the_christian_church.0057.desc.intro.common$.\n\nAuch ohne einen unbestrittenen Hirten wird der Glaube wieder an die Vernunft gebunden.\n\n"
 pam_the_christian_church.0057.desc.intro.common: "Die Streitigkeiten der Kirche sind beendet. Eine ganze Region ([GetSituation('the_christian_church').GetTopSubRegion.GetName]) heißt ein Zeitalter des Friedens und der Gemeinschaft willkommen."
 pam_the_christian_church.0057.desc.unreformed_pagan: "$pam_the_christian_church.0054.desc.unreformed_pagan$"
 pam_the_christian_church.0057.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0057.desc.heretic_rulers: "$pam_the_christian_church.0054.desc.heretic_rulers$"
 pam_the_christian_church.0057.desc.western: "Die Schulen mögen Argument um Argument vorbringen, doch trotzdem erreicht das Wort Gottes die meisten Seelen immer noch durch einen Priester.\n\nWir dürfen nicht vergessen, dass die unsrige eine Religion der einfachen Menschen ist."
 pam_the_christian_church.0057.desc.eastern: "Wir beten noch immer mit Gesang, während sich westliche Tische unter schweren Traktaken biegen. Harmonie ist etwas Willkommenes, doch ihre gelehrten Streitigkeiten sollten nicht bis in unsere Kanzleien hineinreichen."
 pam_the_christian_church.0057.desc.oriental_orthodox: "$pam_the_christian_church.0051.desc.oriental_orthodox$"
 pam_the_christian_church.0057.a: "$pam_the_christian_church.0054.a$"
 pam_the_christian_church.0057.b: "$pam_the_christian_church.0051.b$"
 #Shared notification: a council is coming (fired when the crisis timer elapses)
 pam_the_christian_church.0058.t: "Ein Konzil wird einberufen"
 pam_the_christian_church.0058.desc: "Die langen Jahre des [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]s erreichen ihren Höhepunkt. Ein Konzil wird einberufen, um ein für alle Mal zu klären, wer den Klerus in Ämter einsetzen darf: die Kirche oder die Krone."
 pam_the_christian_church.0058.a: "So sei es entschieden."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.t: "Das Konzil kommt zusammen"
 pam_the_christian_church.0059.desc.located: "Die Einladungen sind verschickt, und die Kirchenväter versammeln sich nun zum Investiturkonzil, das von [investiture_convene_host.GetTitledFirstName] in [investiture_convene_location.GetName] einberufen wurde. Dessen Beschluss wird für die gesamte Christenheit regeln, ob die Kirche oder die Krone die Geistlichen in ihre Ämter einsetzt."
 pam_the_christian_church.0059.desc: "Die Einladungen sind verschickt, und die Kirchenväter versammeln sich nun zum Investiturkonzil. Dessen Beschluss wird für die gesamte Christenheit regeln, ob die Kirche oder die Krone die Geistlichen in ihre Ämter einsetzt."
 pam_the_christian_church.0059.a: "Sollen sie sich beraten."
 pam_the_christian_church_not_hof_trigger_tt: "Ihr seid nicht das Glaubensoberhaupt"
 #Shared option tooltip on the "council is coming" notifications (0058, and the HoF letter 0050)
 pam_investiture_upcoming_council_tt: "Ein Sonderkonzil der Kirche wurde einberufen, um über die nächste Kirchenernennungs-[doctrine|E] Eures [Concept('faith', 'Glaubens')|E] zu bestimmen."
 pam_the_christian_church.0060.t: "Keine Aufteilungen unter Euch"
 pam_the_christian_church.0060.desc: "Die Christenheit tanzt auf Messers Schneide. Der [schism_mainline_rite.GetName] beansprucht das Erbe der Apostel für sich, während der [schism_competitor_rite.GetName] nicht nachgeben will.\n\nChristus selbst warnte: [Glossary('Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS')]. Wenn man die Wunde durch diese Krise zu lange schwären lässt, spricht die Kirche womöglich nie wieder mit einer Stimme."
 pam_the_christian_church.0060.a: "Ich stehe zum [schism_mainline_rite.GetNameNoTooltip]."
 pam_the_christian_church.0060.a.tt: "Trägt zur [decision|E] „[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]“ bei"
 pam_the_christian_church.0060.b: "Ich stehe zum [schism_competitor_rite.GetNameNoTooltip]."
 pam_the_christian_church.0060.b.tt: "Trägt zur [decision|E] „[GetDecisionWithKey('pam_cause_great_schism_decision').GetName]“ bei"
 pam_the_christian_church.0060.c: "Ein Leib braucht zwei Arme."
 pam_the_christian_church.0060.c.tt: "Trägt zur [decision|E] „[GetDecisionWithKey('pam_prevent_great_schism_decision').GetName]“ bei"
 pam_the_christian_church.0061.t: "Das Große Schisma"
 pam_the_christian_church.0061.desc: "Gesandte aus [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] hinterließen ihren Richtspruch am Altar:\n\n„Mögen [schism_eastern_faith.GetReligiousHead.GetFirstName], fälschlich [schism_eastern_faith.ReligiousHeadName] genannt, und all seine Anhänger fortan Anathema sein. [Glossary('Maranatha', 'MARANATHA_GLOSS')] für alle Ketzer! Nein zum Teufel und seinen Engeln, es sei denn, sie tun Buße.“\n\n„Dieses pietätlose Dokument soll genauso mit dem Bann belegt werden, wie jene, die es bearbeiteten, schrieben oder sonst etwas damit zu schaffen hatten“, gibt [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] zurück.\n\nDie Gläubigen sind gespalten in [schism_western_faith.GetAdherentNamePlural] und [schism_eastern_faith.GetAdherentNamePlural]. Meine Seele ist jetzt [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l]."
 pam_the_christian_church.0061.desc.bystander: "Kunde erreicht uns aus [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip]: Die Gesandten sprachen am Altar den Kirchenbann aus, und [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] antwortete auf dieselbe Weise.\n\nWas sich selbst eine einzige Kirche nannte, teilt sich nun in [schism_western_faith.GetAdherentNamePlural] und [schism_eastern_faith.GetAdherentNamePlural]. Ihr Streit war niemals der meine, und der Glaube ([ROOT.Char.GetFaith.GetName]) ist davon nicht betroffen, aber dennoch ist es ein trauriger Anblick."
 pam_the_christian_church.0061.a: "So sei es."
 pam_the_christian_church.0061.a.shame: "Wahrlich eine Schande."
 pam_the_christian_church.0061.a.bystander: "Welch eine Schande, wenn Brüder miteinander kämpfen."
 MARANATHA_GLOSS: "Ein aramäischer Ausruf, der so viel bedeutet wie: #bold „Unser Herr komme!“#! Aus 1. Korinther 16,22 entnommen wurde er zu einer Bannformel: Die so Verfluchten sind bis zur Wiederkehr des Herrn verstoßen."
 pam_the_christian_church.0062.t: "Bewahrte Gemeinschaft"
 pam_the_christian_church.0062.desc: "Die Wunde, die die Christenheit zu spalten drohte, wurde wieder vernäht. Durch die Mühen von [schism_peacemaker.GetTitledFirstName] wurden die zankenden Sitze an einen Tisch zurückgerufen.\n\n[Glossary('Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus … Unus Dominus, una fides, unum baptisma.', 'EPHESIANS_4_3_6_LATIN_GLOSS')]\n\nUnser Glaube ([ROOT.Char.GetFaith.GetName]) bleibt in der Kommunion."
 pam_the_christian_church.0062.a: "Gesegnet sei der Herr."
 pam_the_christian_church.0062.a.peacemaker: "Kein einzelner Sitz soll über die anderen herrschen."
 pam_the_christian_church.0062.b: "Lasst [new_head_of_faith.GetTitledFirstNameNoTooltip] uns alle führen."
 pam_the_christian_church.0062.b.self: "Dann soll die ganze Schar mir antworten."
 pam_the_christian_church.0063.t: "[Select_CString(schism_dissenter.IsFemale, 'Die', 'Der')] Zurückgelassene"
 pam_the_christian_church.0063.desc: "Ich bin zum [ROOT.Char.GetRite.GetName] übergetreten. Allerdings ist [schism_dissenter.GetTitledFirstName] nicht gefolgt. [schism_dissenter.Custom('DE_PRO_PER_S_3P_N')|U] sorgt sich weiterhin um meine Seele und meine frühere Gemeinde:\n\n„Ihr habt uns verlassen“, sagt [schism_dissenter.Custom('DE_PRO_PER_S_3P_N')] leise. „Wenn sich die Kirche selbst entzweireißt … und das wird sie … dann werden wir beide auf entgegengesetzten Seiten stehen.“"
 pam_the_christian_church.0063.a: "Derselbe Gott hört uns beide."
 pam_the_christian_church.0063.b: "Lasst es mich Euch zeigen, warum ich übertrat."
 pam_the_christian_church.0063.b.success: "[schism_dissenter.GetTitledFirstNameNoTooltip|U] tritt mit mir über"
 pam_the_christian_church.0063.b.failure: "[schism_dissenter.GetTitledFirstNameNoTooltip|U] ist nicht umzustimmen"
 pam_the_christian_church.0063.c: "Behaltet Eure Sorgen für Euch."
 pam_the_christian_church.0064.t: "Die Wunde wird sich öffnen"
 pam_the_christian_church.0064.desc.opening.self_mainline: "Meine Stimme erhebt sich gegen die von [schism_competitor_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening.self_competitor: "Meine Stimme erhebt sich gegen die von [schism_mainline_head.GetTitledFirstName]."
 pam_the_christian_church.0064.desc.opening: "Die Stimmen von [schism_mainline_head.GetTitledFirstName] und [schism_competitor_head.GetTitledFirstName] erheben sich gegeneinander."
 pam_the_christian_church.0064.desc: "Ich sehe keinen Weg zurück zu einer Einheit, die der [schism_mainline_rite.GetName] und der [schism_competitor_rite.GetName] erreichen könnten.\n\nDie Warnung der Heiligen Schrift ist zu einem Urteil geworden: [Glossary('Omne regnum divisum contra se desolabitur', 'MATTHEW_12_25_LATIN_GLOSS')]. Die Kommunion innerhalb unserer Gemeinschaft ([christianity.GetName]) ist noch nicht zerbrochen, doch die Wunde wird sich öffnen. Es ist unabänderlich."
 pam_the_christian_church.0064.a: "Gott, verlass uns nicht."
 pam_the_christian_church.0064.a.tt: "Der Fortschritt für das Große Schisma hat seinen Schwellenwert erreicht"
