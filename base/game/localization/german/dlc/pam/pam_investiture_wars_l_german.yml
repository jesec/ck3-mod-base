l_german:
 # Investiture open-conflict CB
 PAM_INVESTITURE_CONFLICT_WAR_CB_NAME: "Investiturstreit"
 # The war view looks the CB up by its type key
 pam_investiture_conflict_cb: "$PAM_INVESTITURE_CONFLICT_WAR_CB_NAME$"
 pam_investiture_conflict_cb_victory_desc_attacker: "Euer Sieg zwingt [defender.GetShortUIName] und seine Seite, Eure Haltung zur Ernennung des Klerus anzunehmen."
 pam_investiture_conflict_cb_victory_desc_defender: "Der Sieg von [attacker.GetShortUIName|U] zwingt Euch und Eure Unterstützer, [attacker.Custom('DE_PRO_POS_S_3P')]e Haltung zur Ernennung des Klerus anzunehmen."
 pam_investiture_conflict_cb_victory_desc: "[attacker.GetShortUIName|U] obsiegt und zwingt [defender.GetShortUIName] und [defender.Custom('DE_PRO_POS_S_3P')]e Seite, die Haltung von [attacker.GetShortUIName] zur Ernennung des Klerus anzunehmen."
 pam_investiture_conflict_cb_white_peace_desc: "Der Streit um die Ernennung des Klerus endet ohne Entscheidung und keine Seite gewinnt."
 pam_investiture_conflict_cb_defeat_desc_attacker: "Eure Niederlage zwingt Euch und Eure Unterstützer, die Haltung von [defender.GetShortUIName] zur Ernennung des Klerus anzunehmen."
 pam_investiture_conflict_cb_defeat_desc_defender: "Ihr obsiegt und zwingt [attacker.GetShortUIName] und [attacker.Custom('DE_PRO_POS_S_3P')]e Seite, Eure Haltung zur Ernennung des Klerus anzunehmen."
 pam_investiture_conflict_cb_defeat_desc: "[defender.GetShortUIName|U] obsiegt und zwingt [attacker.GetShortUIName] und [attacker.Custom('DE_PRO_POS_S_3P')]e Seite, die Haltung von [defender.GetShortUIName] zur Ernennung des Klerus anzunehmen."
 msg_pam_investiture_conflict_cb_invalidated_message: "Der [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] ist beendet; der Investiturstreit als Kriegsgrund ist nicht länger gültig."
 # CB requirement line: no new Investiture Conflicts once the settling council has been summoned
 pam_investiture_cb_council_pending_tt: "Das Investiturkonzil wurde noch #EMP nicht#! zusammengerufen"
 # Toast sent to a defeated ruler forced onto the victor's Clerical Appointment stance
 pam_investiture_conflict_forced_stance_toast: "Zum Nachgeben gezwungen"
 pam_investiture_conflict_forced_stance_tt: "Da Ihr im Investiturstreit geschlagen wurdet, seid Ihr verpflichtet, auf dem kommenden Konzil die Haltung des Siegers zur Ernennung des Klerus anzunehmen."
