l_german:
 doctrine_parameter_tenet_ritual_celebrations_praise_the_gods: "Schaltet den [intent|E] $praise_the_gods_intent$ für [GetActivityType('activity_feast').GetName]-[activities|E] frei"
 praise_the_gods_intent: "Ehrung des Göttlichen"
 praise_the_gods_intent_desc: "Verwandelt gemeinschaftliche Feierlichkeiten in eine Form der Verehrung. Sucht religiöses Wissen, spirituelle Einsicht und Gemeinschaft während des Festmahls."
 praise_the_gods_intent_not_valid_desc: "Ihr folgt persönlich nicht mehr dem [tenet|E]: [GetTenetType('tenet_ritual_celebrations').GetName(GetPlayer.GetRite)] "
 pam_ritual_celebrations_events.0001.t: "Ein Festmahl der Offenbarung"
 pam_ritual_celebrations_events.0001.desc: "Während sich die Teller leeren und die Becher erneut gefüllt werden, führt ein Trinkspruch zu Ehren der höchsten Macht ([ROOT.Char.GetFaith.WealthGodName]) zum nächsten. Bald schon erklingen Gebete, heilige Geschichten und geistreiche theologische Debatten im Saal.\n\nInmitten der Wärme der Feierlichkeiten scheint Verständigung fast greifbar zu sein – sei es durch lebendige Gemeinschaft oder stilles Gebet."
 pam_ritual_celebrations_events.0001.a: "Lasst aus Festlichkeit Verehrung werden."
 pam_ritual_celebrations_events.0001.b: "Ich werde mich zurückziehen und in feierlicher Besinnung beten."
 pam_praise_the_gods_revelation_outcome_tt: "Eine heilige Wahrheit tritt aus dem Lärm der Feierlichkeiten hervor"
 pam_praise_the_gods_belief_outcome_tt: "Eine kaum erinnerte Lehre öffnet einen neuen Weg des Glaubens"
 pam_praise_the_gods_legend_outcome_tt: "Die heiligen Geschichten dieser Nacht schlagen Wurzeln als eine Legende, die man noch Generationen später weitererzählt"
 pam_praise_the_gods_clergy_outcome_tt: "Gemeinsame Lobpreisung bringt Euch dem [clergy|E] an Eurem Tisch näher"
 pam_praise_the_gods_scholar_outcome_tt: "Die abendliche Debatte erweckt einen anhaltenden Hunger für heilige Bildung"
 pam_praise_the_gods_scholar_xp_outcome_tt: "Jedes Gebet und jedes Gleichnis schärfen Eure Beherrschung der heiligen Bildung"
 pam_praise_the_gods_revelation_toast: "Offenbarung inmitten der Feierlichkeiten"
 pam_praise_the_gods_belief_toast: "Theologische Erkenntnis"
 pam_praise_the_gods_legend_toast: "Eine heilige Geschichte schlägt Wurzeln"
 pam_praise_the_gods_clergy_toast: "Verbunden durch das Preisen der höchsten Macht ([ROOT.Char.GetFaith.WealthGodName])"
 pam_praise_the_gods_scholar_toast: "Während des Festmahls gefundene Weisheit"
 pam_praise_the_gods_scholar_xp_toast: "Gelehrsamkeit vertieft"
 pam_praise_the_gods_clergy_bond_opinion: "Verbunden in göttlicher Feier"
 pam_praise_the_gods_log_title: "Ehrte das Göttliche"
 pam_praise_the_gods_log: "[CHARACTER.GetShortUIName|U] versuchte, göttliche Einsicht durch die Gebete, Geschichten und Debatten während des Festmahls zu erlangen"
 pam_praise_the_gods_quiet_log_title: "Betete in stiller Hingabe"
 pam_praise_the_gods_quiet_log: "[CHARACTER.GetShortUIName|U] zog sich von den Feierlichkeiten zurück, um im stillen Gebet göttlichen Frieden zu finden"
