 pam_secure_pilgrim_routes_incompatible_tenet_tt: "Ein pazifistischer [core_tenet|E] ist mit dem Grundsatz namens [GetTenetType('tenet_armed_pilgrimages').GetBaseName] nicht vereinbar und muss daher zunächst ersetzt werden"
