 pam_unite_miaphysite_churches_decision: "Die miaphysitischen Kirchen vereinen"
 pam_unite_miaphysite_churches_decision_desc: "Obwohl sie denselben Glauben teilen, beschritten die Kirchen der miaphysitischen Gemeinschaft seit Langem getrennte Wege – jede unter ihrem eigenen Oberhaupt. Würden sich ihre Oberhäupter einigen, stünde einer vollständigen Einheit der Gläubigen nichts mehr im Weg."
 pam_unite_miaphysite_churches_decision_tooltip: "Vereinigt die miaphysitische Gemeinschaft, indem Ihr alle ihre [rites|E] im [ROOT.Char.GetFaith.GetAdjective|l]en [Concept('faith', 'Glauben')|E] vereint"
