 pam_proclaim_living_word_decision_effect_tt: "Ihr werdet wählen zwischen:\n$BULLET_WITH_TAB$[GetModifier('pam_herald_shepherd_of_the_faithful_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$[GetModifier('pam_herald_fire_and_sword_modifier').GetNameWithTooltip]"
 pam_decision_events.0021.t: "Das lebendige Wort"
 pam_decision_events.0021.desc: "Es gibt keinen Platz zum Niederknien im Gotteshaus ([ROOT.Char.Custom('GetFaithTemple')]) mehr. Pilger und [ROOT.Char.GetFaith.PriestNeuterPlural] stehen dicht gedrängt Schulter an Schulter, Barone neben Bettlern, und die Menge an den Toren wächst noch immer.\n\nMeine Taten wurden sorgsamer aufgeführt, als jeder Chronist es vollbracht hätte: jede beschrittene Straße, jede gehaltene Wacht, jede im Namen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) gegebene Münze. Einer der [ROOT.Char.GetFaith.PriestNeuterPlural] nimmt meine Hand und presst sie auf seinen Altar. „Sprecht, und wir werden lauschen.“\n\nDas Schweigen, das sich über alles legt, gehört mir. Womit ich es fülle, wird weit jenseits dieser Mauern widerhallen."
 pam_decision_events.0021.a: "Lasst Gnade meine Predigt sein."
 pam_decision_events.0021.b: "Ich werde das Wort mit Feuer und Schwert in die Welt hinaustragen."
 pam_herald_shepherd_of_the_faithful_modifier: "Hirte der Gläubigen"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "Dieser Charakter verkündete seine heilige Berufung mit Worten der Gnade, und die Gläubigen lieben ihn dafür."
 pam_herald_fire_and_sword_modifier: "Feuer und Schwert"
 pam_herald_fire_and_sword_modifier_desc: "Dieser Charakter verkündete seine heilige Berufung als Ruf zu den Waffen, und Krieger des Glaubens strömen in Scharen unter sein Banner."
 pam_convert_to_theocracy_decision: "Theokratische Herrschaft annehmen"
 pam_convert_to_theocracy_decision_desc: "Die derzeitige Hierarchie ist eine Perversion jener Regeln, wie sie die höchste Macht ([ROOT.Char.GetFaith.GoodGodNames]) vorsah. Mir wurde der einzige Weg mitgeteilt, dies zu entwirrfen. Einer, der die höchste Macht preisen und zugleich meinen Pflichten dem Volk gegenüber gerecht wird. Dies sind die Worte der höchsten Macht ([ROOT.Char.GetFaith.GoodGodNames])."
 pam_convert_to_theocracy_decision_confirm: "Über die Autorität [ROOT.Char.GetFaith.HighGodNamePossessive] gebieten"
 pam_convert_to_theocracy_decision_tooltip: "Ändert Eure [government|E] zu einer [theocracy|E]"
 pam_convert_theocracy_to_feudal_decision: "Weltliche Herrschaft wiederherstellen"
 pam_convert_theocracy_to_feudal_decision_desc: "Als nominelle Autorität des Rechts [ROOT.Char.GetFaith.HighGodNamePossessive] suchen die [ROOT.Char.GetFaith.GetAdherentNamePlural] bei mir geistliche Führung. Doch ich fühle mich der Aufgabe nicht gewachsen und unterwerfe mich dem Urteil, zu dem mein [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName] gelangt.\n\nMeine Kenntnisse liegen beim Weltlichen, und es ist nur richtig, dass ich eine weltliche Krone trage! Lasst das Volk wissen, dass ich das Sagen habe – und nicht [ROOT.Char.GetFaith.PriestNeuterPlural] oder selbst die höchste Macht ([ROOT.Char.GetFaith.HighGodName])."
 pam_convert_theocracy_to_feudal_decision_tooltip: "Ändert Euer [realm|E] zu einem [Concept('feudal', 'feudalen')|E] statt einer [theocracy|E]"
 pam_convert_theocracy_to_feudal_decision_confirm: "Reich an Sterbliche zurückgeben"
 religious_head_is_not_ecclesiastical: "[head_of_faith|E] ist #bold nicht#! [ecclesiastical_government|El]"
 different_rite_than_hof: "Euer [rite|E] ist [ROOT.Char.GetFaith.GetHeresyThreshold|-0] oder stärker [rite_divergent|El] vom [rite|E] des [Concept('head_of_faith', 'Glaubensoberhaupts')|E]"
 pam_decision_events.0009.t: "Eine heilige Verwaltung"
 pam_decision_events.0009.desc: "Ich bewundere den Kopfschmuck ([ROOT.Char.Custom('ReligiousHeadHeadgear')]), setze ihn auf und trete vor meine frommen [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n„Die alten Wege der Lehen und der Bande dienten uns gut, bis sie uns vom Weg abbrachten. Angetrieben vom Wort der höchsten Macht [ROOT.Char.GetFaith.HighGodName], wie wir es sind, ist es letztlich eben auch genau jene Macht, die darüber bestimmt, wie wir über [ROOT.Char.GetPrimaryTitle.GetNameNoTier] herrschen sollen. Ich diene ihr nur voll Demut, so wie Ihr alle.“"
 pam_decision_events.0009.a: "[ROOT.Char.Custom('GetFaithTemple')] von [new_capital.GetNameNoTierNoTooltip] ist der neue Hauptsitz!"
 church_holding_as_new_capital: "[new_capital.GetName|U] als [realm_capital|E] festlegen"
 pam_decision_events.0009.b: "Es ist der Wille [ROOT.Char.GetFaith.HighGodNamePossessive]."
 pam_decision_events.0009.liege_msg_title: "Theokratie angenommen"
 pam_decision_events.0009.liege_msg_desc: "[ROOT.Char.GetShortUIName|U] formte das eigene Reich zu einer [theocracy|E] um."
 pam_decision_events.0010.opening: "[theocratic_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 pam_decision_events.0010.desc: "Ich machte mich auf den Weg, die Regierung nach heiligen Prinzipien zu ordnen. Es wird von Euren Landen erwartet, dem göttlichen Pfad zu folgen. So lautet der Wille der höchsten Macht ([theocratic_ruler.GetFaith.GoodGodNames])."
 pam_decision_events.0010.a: "Verstanden."
 pam_decision_events.0010.b: "Ich behalte den derzeitigen Aufbau bei."
 rejected_becoming_theocracy_opinion: "Theokratiewerdung abgelehnt"
 disapproves_of_wealth_redistribution_opinion: "Verteilte den Reichtum des Reichs um"
 refused_wealth_redistribution_opinion: "Hielt die Schatztruhen geschlossen"
 pam_prevent_great_schism_decision: "Das Große Schisma verhindern"
 pam_prevent_great_schism_decision_desc: "Die Spaltung der christlichen Gemeinde lässt sich noch überwinden, wenn wir handeln, ehe die Wunden tiefer werden."
 pam_prevent_great_schism_decision_tooltip: "Schub in Richtung Stabilität in der christlichen Lage."
 pam_prevent_great_schism_decision_confirm: "Die Einigkeit der Kirche bewahren"
 pam_prevent_great_schism_aftermath_tt: "Das [Concept('schism', 'Große Schisma')|E] ist abgewendet und die [GetSituation('the_christian_church').GetName|l] tritt in eine Phase der [GetSituationType('the_christian_church').GetPhaseType('concord').GetName] ein"
 pam_prevent_great_schism_choose_head_tt: "Ihr werdet entscheiden, ob die wiedervereinigte Kirche [new_head_of_faith_title.GetName] als ihr [GetDoctrineType('doctrine_spiritual_head').GetBaseName] anerkennt oder ohne ein [head_of_faith|E] bleibt"
 pam_schism_seat_head_of_faith_tt: "[new_head_of_faith.GetTitledFirstName] wird [head_of_faith|E] von [GetFaithByKey('christian_faith').GetName]"
 pam_schism_leave_faith_headless_tt: "@alert_icon! #alert_trial [GetFaithByKey('christian_faith').GetName] wird kein [head_of_faith|E] haben#!"
 pam_prevent_great_schism_clerical_support_tt: "#V $VALUE|0$/7#! [characters|E] (Ihr ausgenommen) in Sachen [GetSituation('the_christian_church').GetTopParticipantGroupByKey('christian_clerical_main_power_rulers').GetName] teilen Eure Haltung und sind entweder:\n$BULLET_WITH_TAB$Ihr$BULLET_WITH_TAB$[hooked|EU] durch #V Euch#!\n$BULLET_WITH_TAB$Eure [puppet|E]\n$BULLET_WITH_TAB$Euer [friend|E]\n$BULLET_WITH_TAB$Eure [lover|E]"
