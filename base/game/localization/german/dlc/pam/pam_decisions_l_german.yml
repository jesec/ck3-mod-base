 pam_proclaim_crusade_age_tenet_decision: "Das Zeitalter der Kreuzzüge ausrufen"
 pam_proclaim_crusade_age_tenet_decision_desc: "Die Gläubigen müssen zu den Waffen greifen, um die Christenheit zu verteidigen und zurückzuerobern, was verloren ging."
 pam_proclaim_crusade_age_tenet_decision_tooltip: "[GetTenetType('tenet_armed_pilgrimages').GetBaseName] oder [GetTenetType('tenet_struggle_submission').GetBaseName] als [core_tenet|E] Eures [mainline_rite|E] annehmen."
