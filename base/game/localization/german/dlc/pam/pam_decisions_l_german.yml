 consecrate_kingdom_exclave_kingdoms_available_tt: "Alle benachbarten [kingdoms|E] können Exklaven innerhalb ihres [Concept('de_jure', 'De-jure')|E]-[Concept('empire', 'Großreichs')|E] werden"
 consecrate_kingdom_decision: "Ein neues Königreich weihen"
 consecrate_kingdom_decision_desc_self: "Es ist die höchste Macht ([ROOT.Char.GetFaith.HighGodName]), die Monarchen erschafft, und ich spreche auf ihr Geheiß. Könnte es einen passenderen Souverän geben, um über die Lande der Gläubigen zu herrschen?"
 consecrate_kingdom_decision_desc: "Es ist die höchste Macht ([ROOT.Char.GetFaith.HighGodName]), die Monarchen erschafft. In Zeiten der Not erhebt sie sie sogar aus den Reihen des bescheidensten Adels.\n\nDies ist eine solche Zeit. Ich werde eine heilige Krone für mein bloßes Haupt erflehen."
 consecrate_kingdom_decision_confirm: "Ein königliches Mandat annehmen"
 consecrate_kingdom_decision_tooltip: "Einen neuen [kingdom|E]-[title|E] durch die Billigung einer hohen spirituellen Autorität und nicht auf Grundlage der Macht Eures [Concept('realm', 'Reichs')|E] schaffen"
 consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.GetShortUIName|U] könnte es noch immer ablehnen, Euer [kingdom|E] zu weihen, was diese [decision|E] ungültig machne würde!#!"
 consecrated_king_ai_behavior_large_tt: "#EMP #weak Wird sich eifriger und gerechter verhalten#!#!"
 consecrated_king_modifier: "Erster der geweihten Monarchen"
 consecrated_king_modifier_small: "$consecrated_king_modifier$"
 consecrated_king_modifier_desc: "Ein heiliges Königreich wurde gebildet, damit dieser Charakter ein Souverän werden konnte. Er hält ein Mandat, das unmittelbar vom Göttlichen stammt."
 consecrated_king_modifier_small_desc: "$consecrated_king_modifier_desc$"
 pam_decision_events.0030.b.decline: "[Select_CString(religious_authority.IsFemale, 'Die', 'Der')] [religious_authority.GetTitleAsName] verachtet Euer Königreich"
 pam_decision_events.0030.opening: "„Hochheilig[ROOT.Char.Custom('DE_END_ADJ_IND_S_N')] [religious_authority.GetMotherFather|U]!"
 pam_decision_events.0030.desc: "Die höchste Macht ([religious_authority.GetFaith.HighGodName]) weiht nur einige wenige Auserwählte dazu, als die hohen Hüter ihrer [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip|l]en Kinder zu dienen – als Souveräne, die sich um jene schönen Lande kümmern, die der Erde zugestanden sind.\n\nIch bitte darum, als einer aus diesem kleinen Kreis der Gesegneten dienen zu dürfen. Erschafft ein Königreich [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], und ich werde es gegen alle Übel verteidigen."
 pam_decision_events.0030.a: "Ein neues [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip|l]es Königreich wird hiermit geweiht."
 pam_decision_events.0030.b: "Die höchste Macht ([religious_authority.GetFaith.HighGodName]) hat keine solchen Pläne für Euch, [king_aspirant.GetFirstNameNoTooltip] …"
 pam_decision_events.0031.t: "Ein [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l]es Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip])"
 pam_decision_events.0031.desc.self_crowning: "Welches Land ist gesegneter als [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Welches Lehen hätte königliche Auspizien eher verdient? Behüteten die kriegerischen Kräfte ([ROOT.Char.GetFaith.WarGodName]) sein Volk nicht vor Nöten und bewahrten meinen heiligen Sitz innerhalb seiner Grenzen?\n\n Indem ich den Willen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) ausübte, weihte ich dieses Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]) namens [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Ich machte mich selbst [Select_CString(ROOT.Char.IsFemale, 'zur heiligen Hüterin', 'zum heiligen Hüter')] dieses Landes, und niemals wieder soll mein Wille missachtet werden.\n\nVasallen und Fromme zugleich – verneigt Euch tief! Gute [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural] wissen, welche Verehrung man als [ROOT.Char.GetTitleAsName] verdient."
 pam_decision_events.0031.desc_three_duchies: "[religious_authority.GetTitledFirstNameRegnal|U] erließ, dass die Lande meines Reichs ausgerichtet werden wie Schicksalsterne am beständig wirbelnden Firmament. Aus [duchy_1.GetName], [duchy_2.GetName] und [duchy_3.GetName] wird ein gesegnetes, geeintes Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]) gemacht.\n\nUnd aus einer rechtschaffenen und würdigen Seele erwächst [Select_CString(ROOT.Char.IsFemale, 'eine neue', 'ein neuer')] [ROOT.Char.GetTitleAsName]! Duch jenes Mandat, über das [Select_CString(religious_authority, 'die', 'der')] [religious_authority.GetTitleAsNameNoTooltip] gebietet, werde ich nun erhoben und muss nach [religious_authority.Custom('DE_PRO_POS_S_3P')]er Linie führen."
 pam_decision_events.0031.desc: "[religious_authority.GetTitledFirstNameRegnal|U] erließ, dass der Name eines neuen Reichs ([ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]) in den Annalen vermerkt wird. Die [ROOT.Char.GetFaith.PriestNeuterPlural] und das Volk erheben mich in ihrer Lobpreisung! Solange [ROOT.Char.GetPrimaryTitle.GetNameNoTier] dem Griff von Heide und Ketzer entgeht, werde ich [ROOT.Char.GetFaith.GetAdjective|l][ROOT.Char.Custom('DE_END_ADJ_IND_S_N')] [ROOT.Char.GetTitleAsName] bleiben.\n\n[Select_CString(religious_authority, 'Die', 'Der')] [religious_authority.GetTitleAsNameNoTooltip], [Select_CString(religious_authority, 'meine Erschafferin', 'mein Erschaffer')], hat dieses bescheidene Reich wahrlich gesegnet … und wird gewiss einiges an Interesse für mein royales Gebaren zeigen."
 pam_decision_events.0031.a: "Möge die höchste Instanz ([ROOT.Char.GetFaith.HighGodName]) mein Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]) für immer lieben!"
 any_landed_duchy_title_tt: "Mindestens ein [duchy|E], das Ihr haltet, ist ein [Concept('landed', 'landbesitzender')|E] [title|E] #weak #EMP (Keine [clerical_region|E] oder [noble_family|E])#!#!"
 head_of_faith_tt: "Euer [faith|E] hat ein [head_of_faith|E]"
 custom.every_empire_secular_ruler: "Alle weltlichen [ruler|E] desselben [Concept('faith', 'Glaubens')|E] im [Concept('de_jure', 'De-jure')|E]-[empire|E] Eures [Concept('realm', 'Reichs')|E]"
 NEW_CREATED_TITLE_NAME_LANDLESS: "[name_title.GetBaseNameNoTierNoTooltip]"
 head_of_rite_is_not_lieges_head_of_rite_tt: "Euer [head_of_rite|E] ist nicht auch [head_of_rite|E] Eures [Concept('liege', 'Lehnsherrn')|E]"
 recipient_head_of_rite_is_not_lieges_head_of_rite_tt: "Ihr seid das [head_of_rite|E] von [recipient.GetShortUIName], aber nicht der [head_of_rite|E] [recipient.Custom('DE_PRO_POS_S_3P')]es [Concept('liege', 'Lehnsherrn')|E]"
 pam_personal_sacrifice_of_wealth_decision: "Reichtum opfern"
 pam_personal_sacrifice_of_wealth_decision_desc: "Stellt einen Teil Eures Vermögens in den Dienst des Wohltätigkeitsgedankens und unterstützt damit die Entwicklung einer Gemeinde, die unter Eurem Schutz steht"
 pam_personal_sacrifice_of_wealth_decision_tooltip: "Gebt [gold|E] aus, um das [development_growth|E] einer ausgewählten [county|E] zu steigern und [spiritual_fulfillment|El] zu erlangen"
 pam_personal_sacrifice_of_wealth_decision_confirm: "Darbringung leisten"
 pam_personal_sacrifice_of_wealth_decision_toast: "Hingabe-Investition aufgebaut"
 pam_develop_clerical_court_decision: "Kirchlichen Hof ausbilden"
 pam_develop_clerical_court_decision_desc_christian: "Müßige Beamte sind schlechte Diener der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]). Lasst mich den Haushalt versammeln, die Würdigen weihen, die Geweihten unterweisen und Novizen an meine Pforten rufen."
 pam_develop_clerical_court_decision_desc: "Müßige Diener bringen der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) keine Ehre ein. Lasst mich den Haushalt versammeln, die Würdigen in den [clergy|E] erheben, die Dienenden unterweisen und Novizen an meine Pforten rufen."
 pam_develop_clerical_court_decision_tooltip: "Weiht, unterweist oder rekrutiert den [clergy|E] für Euren Hof"
 pam_develop_clerical_court_decision_confirm: "Den Haushalt versammeln"
 pam_develop_clerical_court_decision_tt: "Ihr versammelt Eure Familie und wählt #EMP eine#! der folgenden Möglichkeiten aus:\n$EFFECT_LIST_BULLET$ Bis zu [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] Laien-[courtiers|E] schließen sich dem [clergy|E] an, wobei jeder Euch zusätzlich [piety_i][piety|E] gewährt.\n$EFFECT_LIST_BULLET$ Bis zu [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] Hof-[Concept('clergy', 'Kleriker')|E] erhalten [learning_i][learning|E] sowie die [trait|E]/[trait_level_track_xp|E] in Sachen [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] oder [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$ Bis zu [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] Novizen aus den umliegenden Ländern schließen sich Eurem Hof und dem [clergy|E] an.\n\nWelchen Weg Ihr auch einschlagt: Ihr erhaltet [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][piety|E]\n\n#weak Die Belohnungen richten sich nach Eurer [learning|E], Eurer [piety_level|E] und Euren religiösen [traits|E]. Ab und an ergibt sich eine seltene Gelegenheit.#!"
 pam_develop_clerical_court_decision_candidates_tt: "Entweder habt Ihr einen [courtier|E], der andere weihen oder unterweisen kann, oder es wohnt ein würdiger Kandidat in der Nähe"
 pam_clerical_court_joins_clergy_tt: "Tritt dem [clergy|E] in Sachen [pam_clerical_patron.GetFaith.GetName] bei"
 pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName|U] tritt dem Klerus bei"
 pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName|U] wächst an Weisheit"
 pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName|U] folgt dem Aufruf"
 pam_oblate_patron_reason: "Ein berühmter Gönner von Novizen"
 pam_oblate_patron_modifier: "Gönner von Novizen"
 pam_oblate_patron_modifier_desc: "Dieser Charakter ist berühmt dafür, jene zu unterstützen, die in den religiösen Dienst gerufen wurden. Gelübde werden leichter abgelegt und Eltern trennen sich bereitwilliger von ihren Kindern."
 pam_scriptorium_modifier: "Schreiberhaus"
 pam_scriptorium_modifier_desc: "Dieser Charakter hat eine Halle von Schreibern, deren Arbeit die gebildeten Geister in den Hauptsitz zieht."
 pam_decision_events.0032.t: "Die Herde hüten"
 pam_decision_events.0032.desc.intro.christian: "Ich spreche die Schreibkräfte und den Klerus meines Haushalts an und wäge ab, wer geweiht werden soll und wer noch immer Führung bedarf."
 pam_decision_events.0032.desc.intro: "Ich spreche jene an, die an meinem Hof der höchsten Macht ([ROOT.Char.GetFaith.GetName]) dienen: Wer soll in seine Dienste treten und wer wünscht Führung?"
 pam_decision_events.0032.desc.pupil: "\n\n[pam_clerical_pupil.GetFirstName|U], [Select_CString(pam_clerical_pupil.IsFemale, 'meine Schülerin', 'mein Schüler')] verharrt im Gebet, eifrig bemüht, [pam_clerical_pupil.Custom('DE_PRO_POS_S_3P')]en Wert zu beweisen."
 pam_decision_events.0032.desc.no_pupil: "\n\nZu wenige von ihnen traten in den Dienst des Glaubens: ein Fehler, den ich zu beheben beabsichtige."
 pam_decision_events.0032.desc.novice: "\n\nÜber meinen Haushalt hinaus bittet [Select_CString(pam_clerical_novice.IsFemale, 'eine hoffnungsvolle Fremde', 'ein hoffnungsvoller Fremder')] namens [pam_clerical_novice.GetFirstName] um einen Platz im Dienst des Glaubens."
 pam_decision_events.0032.desc.outro.christian: "\n\nWie soll ich die Herde hüten, die mir die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) anvertraute?"
 pam_decision_events.0032.desc.outro: "\n\nWie soll ich jene erheben, die mir die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) anvertraute?"
 pam_decision_events.0032.prodigy: "Mein Schüler hat eine göttliche Gabe!"
 pam_decision_events.0032.oblates: "Lasst alle wissen, dass ich jene willkommen heiße, die in den Dienst gerufen wurden."
 pam_decision_events.0032.piety: "Ihre Hingabe stärkt meine eigene."
 pam_decision_events.0032.novice: "Eine vielversprechende Seele: Nehmt [pam_clerical_novice.Custom('DE_PRO_PER_S_3P_A')] unverzüglich auf."
 pam_decision_events.0032.miracle: "Man sagt, mein Schüler wirke Wunder."
 pam_decision_events.0032.relic.christian: "Dieser heilige Text gehört in meine Schatzkammer!"
 pam_decision_events.0032.relic: "Lasst diese Schriften meinen Hof bereichern."
 pam_decision_events.0032.language: "Weist meinen Schüler an, die heiligen Texte zu studieren."
 pam_decision_events.0032.scriptorium.christian: "Lasst jeden Federkiel in der Schreibstube arbeiten."
 pam_decision_events.0032.scriptorium: "Lasst jeden Schreiber an meinem Hof arbeiten."
 pam_decision_events.0032.a.christian: "Weiht die Würdigsten meines Haushalts."
 pam_decision_events.0032.a: "Erhebt die Würdigsten meines Haushalts in den Dienst des Glaubens."
 pam_decision_events.0032.a.tt: "Jeweils bis zu [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] Eurer gebildetsten Laien-[courtiers|E] #weak (Verwandtschaft eingeschlossen)#!:\n$EFFECT_LIST_BULLET$ Tritt dem [clergy|E] in Sachen [pam_clerical_patron.GetFaith.GetName] bei\n$EFFECT_LIST_BULLET$ Erhält [learning_i][learning|E] und [opinion|E] über Euch\n$EFFECT_LIST_BULLET$ Gewährt Euch [piety_i][piety|E]"
 pam_decision_events.0032.b: "Unterweist den Klerus, der bereits in meiner Obhut ist."
 pam_decision_events.0032.b.tt: "Jeweils bis zu [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] Eures Hof-[clergy|E] mit der besten Bildung:\n$EFFECT_LIST_BULLET$ Erhält [learning_i][learning|E] #weak (bis zu [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Erhält oder bringt die [trait|E] [GetTrait('lifestyle_scholar').GetName(GetNullCharacter)] oder [GetTrait('lifestyle_mystic').GetName(GetNullCharacter)] voran"
 pam_decision_events.0032.c.named: "Nehmt [pam_clerical_novice.GetFirstNameNoTooltip] auf und lasst die Kunde verbreiten, dass Novizen willkommen sind."
 pam_decision_events.0032.c: "Lasst die Kunde verbreiten, dass Novizen willkommen sind."
 pam_decision_events.0032.c.tt: "Jeweils bis zu [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] Novizen aus den umgebenden Landen:\n$EFFECT_LIST_BULLET$ Treten Eurem Hof und dem [clergy|E] in Sachen [pam_clerical_patron.GetFaith.GetName] bei\n$EFFECT_LIST_BULLET$ Konvertieren zu Eurem [rite|E]"
 pam_seize_capital_clerical_region_decision: "Die Kirchenregion in Besitz nehmen"
 pam_seize_capital_clerical_region_decision_desc: "Mein eigener Hauptsitz liegt in einer [clerical_region|E], die ich nicht halte. Kein [archbishop|E] sollte über dem Sitz sein, von dem aus ich herrsche: Dieser [title|E] gehört zum [head_of_faith|E]."
 pam_seize_capital_clerical_region_decision_tooltip: "Nehmt die [clerical_region|E], in der Euer Hauptsitz liegt, und setzt den [archbishop|E] ab, falls der Sitz nicht vakant ist"
 pam_seize_capital_clerical_region_decision_confirm: "Nehmt den Sitz"
 pam_seize_capital_clerical_region_decision_deposed_tt: "[pam_deposed_archbishop.GetShortUIName|U] ist abgesetzt"
 pam_seize_capital_clerical_region_decision_effect_tt: "[pam_seized_clerical_region.GetName|U] geht an Euch über"
