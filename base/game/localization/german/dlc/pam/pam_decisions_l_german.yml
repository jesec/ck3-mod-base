 pam_mend_great_schism_decision: "Das Große Schisma durch Diplomatie heilen"
 pam_mend_great_schism_decision_desc: "Es war ein Fehler, die alte Einheit zu zerschlagen. Die Christenheit muss wiedervereint werden! Einflussreiche spirituelle Anführer auf meine Seite zu ziehen, wird zweifelsohne eine Rückkehr zur alten Ordnung erzwingen."
