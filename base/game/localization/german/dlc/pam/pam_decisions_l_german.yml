l_german:
 pam_invite_syncretic_exiles_decision: "Synkretistische Verbannte einladen"
 pam_invite_syncretic_exiles_decision_desc: "Verbannte religiöse Gemeinschaften, die wir achten, sind auf der Suche nach einer sicheren Heimat. Ich lade sie ein, sich in meinem Reich niederzulassen und ihre Traditionen mit uns zu teilen."
 pam_invite_syncretic_exiles_decision_tooltip: "Ladet Verbannte aus einer religiösen Gemeinschaft ein, die von Eurem persönlichen Synkretismus anerkannt wird. Dadurch erhöht sich die [development|E], während sich der örtliche [faith|E] oder [rite|E] verändert.\n\nDies kostet eine große Menge an [piety|E]."
 pam_invite_syncretic_exiles_decision_confirm: "Die Verbannten einladen"
 pam_invite_syncretic_exiles_decision_effect: "Eine Gruppe Verbannte wird an Euch herantreten, die sich in Euren [counties|E] niederlassen, die [development|E] erhöhen und zugleich den örtlichen [Concept('faith', 'Glauben')|E] oder [rite|E] ändern wird."
 pam_invite_syncretic_exiles_no_pool: "Es sind keine passenden religiösen Verbannten verfügbar, die Ihr einladen könnt"
 SELECT_TENET: "Grundsatz auswählen"
 REPLACE_TENET: "Grundsatz ersetzen"
 SELECT_HOLY_SITE: "Heilige Stätte wählen"
