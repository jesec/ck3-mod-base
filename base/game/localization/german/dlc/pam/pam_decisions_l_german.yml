 pam_prevented_great_schism_dynasty_modifier: "Wächter der Einigkeit"
 pam_prevented_great_schism_dynasty_modifier_desc: "Diese Dynastie verhinderte den endgültigen Bruch in der christlichen Welt und bewahrte so die kirchliche Einigkeit für kommende Generationen."
 pam_prevented_great_schism_character_modifier: "$pam_prevented_great_schism_dynasty_modifier$"
 pam_prevented_great_schism_character_modifier_desc: "Dieser Charakter verhinderte den endgültigen Bruch in der christlichen Welt und bewahrte so die kirchliche Einigkeit für kommende Generationen."
 pam_caused_great_schism_dynasty_modifier: "Zerbrecher der Gemeinschaft"
 pam_caused_great_schism_dynasty_modifier_desc: "Diese Dynastie erzwang einen endgültigen Bruch in der christlichen Welt und brachte die Gläubigen für viele kommende Generationen auf voneinander abweichende Pfade."
 pam_caused_great_schism_character_modifier: "$pam_caused_great_schism_dynasty_modifier$"
 pam_caused_great_schism_character_modifier_desc: "Dieser Charakter erzwang einen endgültigen Bruch in der christlichen Welt und brachte die Gläubigen für viele kommende Generationen auf voneinander abweichende Pfade."
 pam_mended_great_schism_military_dynasty_modifier: "Restauratoren der Gemeinschaft"
 pam_mended_great_schism_military_dynasty_modifier_desc: "Diese Dynastie vereinte die alten Bistümer unter einem Banner und heilte den Bruch in der christlichen Welt mit Waffengewalt."
 pam_mended_great_schism_military_character_modifier: "$pam_mended_great_schism_military_dynasty_modifier$"
 pam_mended_great_schism_military_character_modifier_desc: "Dieser Charakter vereinte die alten Bistümer unter einem Banner und heilte den Bruch in der christlichen Welt mit Waffengewalt."
 pam_mended_great_schism_diplomatic_dynasty_modifier: "Friedensstifter der Christenheit"
 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "Diese Dynastie brachte die rivalisierenden Patriarchen dazu, wieder in die Gemeinschaft zurückzukehren. So wurde der Bruch in der christlichen Welt geheilt, ohne dass auch nur ein Tropfen Blut vergossen wurde."
 pam_mended_great_schism_diplomatic_character_modifier: "$pam_mended_great_schism_diplomatic_dynasty_modifier$"
 pam_mended_great_schism_diplomatic_character_modifier_desc: "Dieser Charakter brachte die rivalisierenden Patriarchen dazu, wieder in die Gemeinschaft zurückzukehren. So wurde der Bruch in der christlichen Welt geheilt, ohne dass auch nur ein Tropfen Blut vergossen wurde."
 nick_the_reconciler: "[CHARACTER.Custom('DE_ART_DEF_S_N')] Versöhnende"
 nick_the_reconciler_desc: "Dieser Charakter heilte den Bruch in der christlichen Welt und führte die alten Bistümer wieder in die Gemeinschaft zurück."
 nick_the_concordant: "[CHARACTER.Custom('DE_ART_DEF_S_N')] Einstimmige"
 nick_the_concordant_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] bewahrte die Eintracht in einem Zeitalter der Zerwürfnisse und Streitigkeiten."
 nick_the_schismat: "der Schismatiker"
 nick_the_schismat_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] zertrümmerte die Einigkeit der Christenheit und brachte die Gläubigen auf voneinander abweichende Pfade."
 pam_promulgate_word_of_pious_deeds_decision: "Geschichten über fromme Taten verbreiten"
 pam_promulgate_word_of_pious_deeds_decision_desc: "Meine Kanzlei verfasste eine Lobrede, die meine christusgleichen Taten preist. Auch wenn es sich nicht ziemt, die eigenen Tugenden hervorzuheben, so wünschen sich meine Vertrauten doch, Kunde von meiner Gottesfurcht unter allen [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] zu verbreiten.\n\nMit diesem Wissen könnten viele einsehen, dass ich am ehesten würdig bin, den Heiligen Stuhl zu besteigen … und noch mehr."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Wahlergebnis verbessern#! für [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)]: #P +30#! oder Aussichten auf eine [canonization|E] verbessern"
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Wählt zwischen:\n\t$EFFECT_LIST_BULLET$[piety|E] bezahlen, um das #V Wahlergebnis zu steigern#! für [praise_worthy_priest_superior_title.GetName] \n\t$EFFECT_LIST_BULLET$Eure Chance auf eine zukünftige [canonization|E] verbessern"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Lasst uns ihr Lob erlauben!"
 cardinal_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Ihr seid ein [cardinal|E]"
 domicile_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Euer [domicile|E] muss ein [domicile_building|E] „[GetDomicileBuilding('chancery_01').GetName]“ oder höher haben"
 pam_renounce_papal_candidacy_decision: "[ROOT.Char.GetFaith.ReligiousHeadTitleName] abschwören"
 pam_renounce_papal_candidacy_decision_embrace: "[ROOT.Char.GetFaith.ReligiousHeadTitleName] anstreben"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Manche verbringen ihr ganzes Leben damit, den Thron als [ROOT.Char.GetFaith.ReligiousHeadName] anzustreben, und ich habe beobachtet, welche Auswirkungen dieser Aufstieg auf sie hat.\n\nLasst die [Concept('cardinal', 'Kardinäle')|E] wissen, dass ich bei der nächsten Wahl nicht zur Verfügung stehe. Meine Aufgabe liegt hier: in meinem eigenen Bistum."
 pam_renounce_papal_candidacy_decision_desc_embrace: "Ich gab einst zu verstehen, dass ich nicht für den Thron als [ROOT.Char.GetFaith.ReligiousHeadName] kandidieren würde. Damals war ich noch jung und der Glaube ([ROOT.Char.GetFaith.GetName]) befand sich in sanfteren Händen.\n\nMögen die [Concept('cardinal', 'Kardinäle')|E] nun erfahren, dass ich doch bereit bin."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Die Kandidatur als nächstes [head_of_faith|E] zurückziehen"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "Stellt Euch erneut zur Wahl als nächstes [head_of_faith|E]"
 pam_renounce_papal_candidacy_decision_renounce_tt: "Ihr werdet bei der Wahl des nächsten [Concept('head_of_faith', 'Glaubensoberhaupts')|E] nicht als Kandidat berücksichtigt und behaltet Eure Stimme"
 pam_renounce_papal_candidacy_decision_embrace_tt: "Ihr werdet bei der Wahl des nächsten [Concept('head_of_faith', 'Glaubensoberhaupts')|E] möglicherweise als Kandidat berücksichtigt"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "Ein anderer [cardinal|E] muss dennoch zur Kandidatur bereit sein"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "Kandidatur zurückziehen"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "Ich bin gewillt"
 pam_decision_events.0015.t: "Geschichten über fromme Taten verbreiten"
 pam_decision_events.0015.desc.intro.no_praiser: "Meine treuen Priester tragen"
 pam_decision_events.0015.desc.intro.praiser: "[my_praiser.GetTitledFirstName|U], mein[my_praiser.Custom('DE_END_PRO_S_N')] einflussreich[my_praiser.Custom('DE_END_ADJ_IND_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], trägt"
 pam_decision_events.0015.desc.intro: "die von meiner [GetDomicileBuilding('chancery_01').GetName] gefertigte Lobrede vor:\n\n„Tugendhafte Taten sind wie Samen, die der Herr einpflanzt und die dann zu prächtiger Frömmigkeit erblühen. Alle sollen [praise_worthy_priest.GetName] kennen, denn [praise_worthy_priest.Custom('DE_PRO_POS_S_3P')]e edlen"
 pam_decision_events.0015.desc.virtuoustrait: "und [my_virtuous_trait.GetName(praise_worthy_priest)|l]en"
 pam_decision_events.0015.desc.mid: "Tugenden sind stets gelenkt von"
 pam_decision_events.0015.desc.virtuoustenet: "dem Grundsatz namens [my_virtuous_tenet.GetName(praise_worthy_priest.GetRite)] …“"
 pam_decision_events.0015.desc.novirtuoustenet: "Gott …“"
 pam_decision_events.0015.desc.bad: "\n\nTrotz der lobenden Worte fürchtet mein Herz doch den Kuss des Höllenfeuers."
 pam_decision_events.0015.desc.good: "\n\nIch bin wahrlich ein Werkzeug des Herrn, eine Manifestation seiner Schönheit auf Erden."
 pam_decision_events.0015.desc.neutral: "\n\nTrotz der lobenden Worte werde ich erst im Tode erfahren, ob meine Seele dem Herrn gefallen mag."
 pam_decision_events.0015.desc.outro: "\n\n„… und wahrlich: Durch die Rechtschaffenheit [praise_worthy_priest.Custom('DE_PRO_POS_S_3P')]es Handelns zeigte dieser Mensch, dass er eines Tages die Kirche führen könnte!“"
 pam_decision_events.0015.b: "„Ich habe so manches Wunder in meinem Namen vorzuweisen.“"
 pam_decision_events.0015.b.flavor: "Warum sich mit dem Pontifikat abgeben, wenn man auch heiliggesprochen werden könnte?"
 pam_decision_events.0015.b.tt: "#V Erhöht die Wahrscheinlichkeit für die Kanonisierung#! nach dem Tod\n#weak Erfordert eine [dynasty|E] zur Kanonisierung#!"
 pam_decision_events.0015.c: "Wenn der Herr will, dass ich sie führe …"
 pam_decision_events.0015.c.flavor: "… dann muss ich dem Folge leisten"
 pam_decision_events.0015.c.tt: "#V Wahlwert erhöht#! für [praise_worthy_priest_superior_title.GetName]: #P +30#!"
 pam_decision_events.0015.d: "Es möge kein anderer Name genannt werden."
 pam_decision_events.0015.d.flavor: "Leert die Schatzkammern meiner Hingabe, denn ich will nicht an zweiter Stelle stehen"
