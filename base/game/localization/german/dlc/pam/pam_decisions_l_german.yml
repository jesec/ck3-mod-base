 pam_raise_khachkar_decision: "Ein Chatschkar aufstellen"
 pam_raise_khachkar_decision_desc: "Der Grundsatz namens [GetTenetType('tenet_khachkar').GetName(ROOT.Char.GetRite)] lehrt, dass man der Toten am besten mit behauenem Stein gedenkt. Ich sollte ein verziertes Kreuz aufstellen, um an meine Verwandtschaft zu erinnern. So sind die Lebenden, die Toten und das Land aneinander gebunden."
 pam_raise_khachkar_decision_tooltip: "Ein [GetModifier('pam_khachkar_ancestral_county').GetName] in einer Eurer [counties|E] in Auftrag geben."
 pam_raise_khachkar_decision_confirm: "In Stein gedenken"
 pam_raise_khachkar_decision_warning: "@warning_icon! #X Der Chatschkar wird vernichtet, falls die [county|E] an jemanden von außerhalb Eurer [dynasty|E] fällt#!"
