 # HoF Tenet Stance — Forbid a Tenet decision
 pam_prohibit_tenet_decision: "Grundsatz verbieten"
 pam_prohibit_tenet_decision_desc: "Eine Lehre, die vom rechten Pfad abkommt, muss auch so benannt werden. Brandmarkt einen [core_tenet|E] als [prohibited_tenet_status|El], damit die Gläubigen sich davon fernhalten können."
 pam_prohibit_tenet_decision_tooltip: "Einen [core_tenet|E] als [prohibited_tenet_status|E] innerhalb des eigenen Glaubens ([ROOT.Char.GetFaith.GetName]) brandmarken und dies allen Herrschern des Glaubens verkünden."
