 pam_antipope_events.0001.t: "[ROOT.Char.GetFaith.ReligiousHeadName|U] als Rivale"
 pam_antipope_events.0001.desc.intro: "Der gesamte [ROOT.Char.GetRite.GetName] scheint in diesem Gotteshaus ([ROOT.Char.GetFaith.HouseOfWorship]) wiedervereint zu sein.\n\n"
 pam_antipope_events.0001.desc.self: "Ich recke meine Hand hoch in die Luft. Die falsche Herrschaft von [pope.GetTitledFirstName] neigt sich bald ihrem Ende entgegen. Es ist nun an mir, [pope.Custom('DE_PRO_POS_S_3P')]e geschundenen Schäfchen zu führen."
 pam_antipope_events.0001.desc.sponsor: "„Lasst Herolde verkünden, dass #EMP ich#! [Select_CString(antipope.IsFemale, 'die', 'der')] wahre [ROOT.Char.GetFaith.ReligiousHeadName|U] bin!“, brüllt [antipope.GetTitledFirstName]. „Lasst alle wissen, dass [Select_CString(pope.IsFemale, 'die', 'der')] falsche [pope.GetTitledFirstName] sich in [pope.Custom('DE_PRO_POS_S_3P')]em Palast in [pope_capital.GetName] versteckt, während die Gläubigen geschunden und ohne Führung sind!“\n\n[antipope.Custom('DE_PRO_PER_S_3P_N')|U] wendet sich mir zu. „Doch habt keine Angst mehr. [Select_CString(ROOT.Char.IsFemale, 'Die', 'Der')] fromme [ROOT.Char.GetTitledFirstName] hat beschlossen, Euren Sorgen ein Ende zu bereiten. Und ich mit [ROOT.Char.Custom('DE_PRO_PER_S_3P_D')].\""
 pam_antipope_events.0001.a: "Unser Glaube ([ROOT.Char.GetFaith.GetNameNoTooltip]) soll erbeben."
 pam_antipope_events.0002.opening: "An [ROOT.Char.Custom('DE_ART_DEF_S_A')] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|l][ROOT.Char.Custom('DE_END_ADJ_IND_S_A')] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_antipope_events.0002.desc.challenger_sponsor: "Wisset, dass ich, [sponsor.GetTitledFirstName] [antipope.GetTitledFirstName],"
 pam_antipope_events.0002.desc.antipope_self: "Wisset, dass ich, [sponsor.GetTitledFirstName], mich"
 pam_antipope_events.0002.desc.outro: "in den Stand als [ROOT.Char.GetFaith.ReligiousHeadName|U] erhob, um [Select_CString(pope.IsFemale, 'der', 'dem')] falschen [pope.GetTitledFirstName] als Rivale entgegenzutreten und die Gläubigen des [antipope.GetRite.GetName] so anzuleiten, wie es unsere Tradition verlangt."
 pam_antipope_events.0002.a: "Als $anti_religious_head_name$ und Rivale …?"
 rival_declared_antipope: "[TARGET_CHARACTER.GetShortUIName|U] wurde als [CHARACTER.GetFaith.ReligiousHeadName|U] ausgerufen, um der rechtmäßigen Autorität von [CHARACTER.GetShortUIName] rivalisierend entgegenzutreten."
