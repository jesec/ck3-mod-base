 # HoF Tenet Stance — Permit a Tenet decision
 pam_permit_tenet_decision: "Grundsatz erlauben"
 pam_permit_tenet_decision_desc: "Schon lange raunt man am Rand unseres Glaubens von einer Lehre, die das strahlende Licht der Zustimmung verdient. Gewähren wir einem [core_tenet|E] den Segen [ROOT.Char.GetFaith.HighGodNamePossessive] und erheben wir ihn in den Zustand des [Concept('permitted_tenet_status', 'Erlaubten')|E]."
 pam_permit_tenet_decision_tooltip: "Einen [core_tenet|E] innerhalb des eigenen Glaubens ([ROOT.Char.GetFaith.GetName]) als [permitted_tenet_status|E] billigen und dies allen Herrschern des Glaubens verkünden."
