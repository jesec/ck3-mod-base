 pam_bull_events.0001.t: "Die Bulle von [GetCurrentDate.GetYear]"
 pam_bull_events.0001.desc: "„Ich mahne Euch alle, den [title.GetAdjective|l]en Ungläubigen die Stirn zu bieten, das Land von ihrer Tyrannei zu befreien und ihnen viele Tausend Eurer gefangenen Geschwister zu entreißen.\n\nAuf dass die Würde dessen, was man christlich heißt, mit der Zeit gemehrt werden möge und dass Eure Tapferkeit, die man in aller Welt preist, heil und unerschüttert bleibt.“"
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!"
 pam_bull_events.0001.a.flavor: "#EMP Im Namen des Herrn.#!"
 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: "\"Alle unter Euch, die den Grundsatz namens [tenet_scope.GetName(ROOT.GetCharacter.GetRite)] verinnerlicht haben, sollen wissen, dass er fortan mit der Erlaubnis meines Reichs ([ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]) zulässig und gestattet ist.“"
 pam_bull_events.0002.desc.tenet_forbidden: "„Die Doktrin namens [tenet_scope.GetName(ROOT.GetCharacter.GetRite)] hat nun keinen Platz in unserem Haus mehr. Jeder, der sie praktiziert, soll wissen, dass sie die Heiligkeit der Kirche schänden und eine Todsünde begangen haben.“"
