 pam_proclaim_living_word_decision_desc: "Die Gläubigen wispern, die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) habe mich auserkoren. Pilger sprechen meinen Namen and Wegschreinen aus, und [ROOT.Char.GetFaith.PriestNeuterPlural] zitieren meine Schiedssprüche, als stammten sie aus der heiligen Schrift.\n\nLasst es von jedem Altar aus verkünden: Durch mich wird das lebendige Wort bekannt."
