 declare_yourself_antipope_decision_caliph: "Kalifen anfechten"
 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName|U] ist eine ferne, unwürdige Gestalt, die schlecht dafür gewappnet ist, den Glauben ([ROOT.Char.GetFaith.GetName]) zu führen. Trotz all der Gelehrsamkeit, die [ROOT.Char.GetFaith.GetReligiousHead.Custom('DE_PRO_PER_S_3P_N')] für sich beansprucht, #EMP begreift#! [ROOT.Char.GetFaith.GetReligiousHead.Custom('DE_PRO_PER_S_3P_N')] viele der feinsinnigen Wahrheiten des [ROOT.Char.GetFaith.GetAdjective|l]en Denkens schlichtweg nicht.\n\n[ROOT.Char.GetFaith.GetReligiousHead.Custom('DE_PRO_PER_S_3P_N')|U] womöglich nicht, doch #EMP ich#! schon …"
