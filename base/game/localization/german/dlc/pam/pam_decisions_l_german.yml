 pam_bull_events.0004.desc.crusade: "Ich ermahne Euch alle, den [title.GetAdjective|l]en Ungläubigen entgegenzutreten."
 pam_bull_events.0004.desc.heresy: "Lasst es alle wissen, dass der [heresy_rite.GetName] nun mit dem Kirchenbann belegt ist und seine Anhänger Ketzer sind."
 pam_bull_events.0004.desc.tenet_permitted: "„Alle unter Euch, die den Grundsatz namens [tenet_scope.GetName(ROOT.GetCharacter.GetRite)] verinnerlicht haben, sollen wissen, dass er fortan mit der Erlaubnis meines Reichs ([bull_issuer.GetPrimaryTitle.GetNameNoTierNoTooltip]) zulässig und gestattet ist.“"
