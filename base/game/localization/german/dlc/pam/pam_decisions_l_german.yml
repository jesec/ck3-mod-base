 pam_decision_events.0020.t: "[selected_item.GetNameNoTooltip(actor.GetRite)|U] predigen"
 pam_decision_events.0020.desc: "Nach einer Messe in [clerical_region.GetName] scharte ich eine Gruppe von Gläubigen um mich, damit sie das Wort der höchsten Macht ([ROOT.Char.GetFaith.HighGodName|U]) aus meinem Mund hören. Ich wählte einen Abschnitt aus der heiligen Schrift ([ROOT.Char.GetFaith.ReligiousText|U]) aus, der sie etwas über meinen Glauben in Sachen [selected_item.GetName(actor.GetRite)] lehren soll:\n\n„[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]“"
 pam_decision_events.0020.a: "Der Rest des Textes wird sich ganz um andere Fürsten drehen."
 pam_decision_events.0020.b: "Das nächste Gleichnis werde ich meinen Vasallen widmen."
 pam_decision_events.0020.c: "Verliert Euch in der heiligen Schrift ([ROOT.Char.GetFaith.ReligiousText|U])."
