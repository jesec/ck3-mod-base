 pam_secure_pilgrim_routes_decision: "Pilgerrouten sichern"
 pam_secure_pilgrim_routes_decision_desc: "Die Straßen zu den heiligen Orten sind gefährlich geworden. Indem wir verkünden, dass die Gläubigen auf Pilgerreisen Waffen tragen dürfen, schützen wir die Reisenden und wecken Hingabe in der gesamten Christenheit."
