 newly_exclaved_duchies_decision: "Reichs- & Exklaven-Herzogtümer"
 newly_exclaved_duchies_tooltip: "Neben Euren [Concept('realm', 'Reichs')|E]-[Concept('duchies', 'Herzogtümern')|E] hat Euer neues [kingdom|E] auch Anspruch auf [Concept('de_jure', 'De-jure')|E]-Rechte für Herzogtümer, die bei der Erschaffung des Königreichs zu Exklaven werden: Nicht-Hauptsitz-Herzogtümer, die die anderen Herzogtümer ihres Königreichs nicht länger berühren."
