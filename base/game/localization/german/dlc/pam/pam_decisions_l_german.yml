 pam_decision_events.0019.t: "Verteidiger der Pilger"
 pam_decision_events.0019.desc: "Ein Brief, der mein Wort verkündet, soll an alle [ROOT.Char.GetFaith.GetAdherentNamePlural] gehen:\n\n„Die Straßen zu den heiligen Orten sind gefährlich geworden. Alle sollen wissen, dass die Gläubigen auf Pilgerreise Waffen tragen und sich gegen jeder verteidigen dürfen, der zwischen ihnen und dem Paradies steht.“"
 pam_decision_events.0019.a: "O Herr, stärke unsere Waffen."
 pam_decision_events.0018.opening: "An die [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] aller Lande,"
 pam_decision_events.0018.desc.armed_pilgrimages: "Ich setzte mein Siegel unter diese Sache: Von diesem Tag an soll dieser Grundsatz ([GetTenetType('tenet_armed_pilgrimages').GetName(hof_scope.GetRite)]) zu den Kernlehren des [hof_scope.GetFaith.GetAdjective|l]en Glaubens zählen.\n\nMögen alle Herrscher des Glaubens davon Kenntnis nehmen."
 pam_decision_events.0018.desc.struggle_submission: "Ich setzte mein Siegel unter diese Sache: Von diesem Tag an soll dieser Grundsatz ([GetTenetType('tenet_struggle_submission').GetName(hof_scope.GetRite)]) zu den Kernlehren des [hof_scope.GetFaith.GetAdjective|l]en Glaubens zählen.\n\nMögen alle Herrscher des Glaubens davon Kenntnis nehmen."
 pam_decision_events.0018.a: "So sei es."
 pam_decision_events.0017.t: "Ein Ahnen-Chatschkar aufstellen"
 pam_decision_events.0017.desc: "Ich wählte einen hoch gelegenen Ort, der [khachkar_location.GetNameNoTier] überblickt, für das Steinkreuz aus.\n\nIch werde die Meister etwas wahrlich Demut Lehrendes schaffen lassen, um [khachkar_ancestor.GetTitledFirstName] zu gedenken. Ein Kreuz umringt von Rosetten, Ornamenten und einer Inschrift, die besagt, dass [khachkar_ancestor.Custom('DE_PRO_POS_S_3P')][khachkar_ancestor.Custom('DE_END_PRO_S_N')] [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] [khachkar_ancestor.Custom('DE_PRO_POS_S_3P')]e Erinnerung ehrte.\n\nLasst die örtlichen Pilger darunter beten, auf dass alle sehen, dass wir rechtmäßig über diese Lande herrschen."
 pam_decision_events.0017.a: "Lasst dieses Kreuz für ganze Zeitalter stehen."
 pam_decision_events.0017.b: "Das ist der falsche Zeitpunkt."
