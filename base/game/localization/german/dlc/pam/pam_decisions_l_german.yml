 pam_decision_events.0008.t: "Den Zehnten erheben"
 pam_decision_events.0008.desc.intro: "[ROOT.Char.GetFaith.HouseOfWorshipPlural] in meiner unmittelbaren Reichweite zeichnen sich durch überquellende Schatullen aus. Auf den Klang meiner Wachen, wie sie in die Tempel stapfen, folgt bald das Klimpern von Münzen.\n\n"
 pam_decision_events.0008.desc.chaplain: "„Erfreut sich [ROOT.Char.Custom('DE_ART_DEF_S_N')] [ROOT.Char.GetTitleAsNameNoTooltip] jetzt an der Demütigung der Diener der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])?“, widersetzt sich [chaplain.GetTitledFirstName]. „Bereitet es Euch Vergnügen, ihr Haus nackt wie eine #EMP dreckige#! Hure dastehen zu lassen?“"
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] wenden angewidert das Gesicht ab. Die Diener der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) scheinen schrecklich an ihrem Gold zu hängen."
 pam_decision_events.0008.a: "Ist Großzügigkeit nicht eine Tugend?"
