 pam_decision_last_rites_name: "Sterbesakrament empfangen"
 pam_decision_last_rites_name_low: "Sterbesakrament empfangen"
 pam_decision_last_rites_desc: "#EMP [ROOT.Char.GetFaith.HighGodName], sei mir gnädig nach deiner Huld, tilge meine Frevel nach deinem reichen Erbarmen! Wasch meine Schuld von mir ab und mach mich rein von meiner Sünde!#!\n\nIn Anbetracht meines bevorstehenden Ablebens aus diesem irdischen Dasein hege ich die Hoffnung, meine Seele in einen Zustand der Harmonie zu überführen. Geschützt vor dem Einfluss der Hölle möchte ich einen guten Tod finden, das ewige Leben erlangen und Aufnahme im Himmelreich erlangen."
 pam_decision_last_rites_tooltip: "Eure Seele auf den Abschied vorbereiten"
 pam_decision_last_rites_tooltip_sp_effect: "Ihr erhaltet etwas [spiritual_fulfillment|El] @spiritual_fulfillment_icon!"
 pam_decision_last_rites_confirm: "An meinem Bett versammeln"
 pam_decision_last_rites_sp_tooltip: "Eure [spiritual_fulfillment|El] liegt bei mindestens #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_last_rites_doctrine_tt: "[faith|E] muss die [doctrine|E] „[GetDoctrineType('doctrine_sacraments_central').GetBaseName]“ haben"
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X Wenn Ihr das Sterbesakrament nicht empfangt:\n$BULLET_WITH_TAB$Verliert Ihr [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$Jeder Eiferer-Vasall:\n$TAB$$BULLET_WITH_TAB$Verliert #N 30#! [opinion|E] über #V Euch#!#!"
 pam_decision_events.0005.secret_reveal: "@alert_icon! #alert_trial Ihr müsst möglicherweise ein [secret|E] preisgeben"
 pam_decision_events.0005.details: "Ihr habt die Möglichkeit, [titles|E] zu [Concept('lease', 'verpachten')|E], oder, falls Euch keine zur Verfügung stehen, [gold|E] an [monastic_holy_orders|E], [holy_orders|E] oder die [the_christian_church|El] zu spenden. Dies verschafft Eurem [Concept('player_heir', 'Spielererben')|E] vorteilhafte [modifiers|E]."
 pam_decision_events.0005.t: "Sterbesakrament: Meine letzte Stunde"
 pam_decision_events.0005.desc.healthtrait: "Sünde machte mich zu dem, was ich bin ([death_trait.GetName(soon_dead)]), und ist vermutlich der Grund für meinen bevorstehenden Tod."
 pam_decision_events.0005.desc.bad: "Es fiel mir schwer, die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zu ehren. In meinem Hochmut versuchte ich, meine Sünden vor seinen allsehenden Augen zu verbergen.\n\n"
 pam_decision_events.0005.desc.good: "Glücklicherweise habe ich das Gefühl, dass Engel um mich sind und meine Seele vor jenen Dämonen beschützen, die sie sie sich gern holen würden.\n\n"
 pam_decision_events.0005.desc.neutral: "Obwohl ich mich stets bemühte, die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) zu ehren, sorge ich mich nun, da ich mich der Schwelle zur Ewigkeit nähere, ob meine Seele für das Himmelreich als würdig erachtet wird.\n\n"
 pam_decision_events.0005.desc.notalone: "An meiner Seite stehen [fam_or_friend_1.GetFirstName], mein[fam_or_friend_1.Custom('DE_END_PRO_S_N')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))], und andere, die für meine Seele beten werden."
 pam_decision_events.0005.desc.alone: "Ich zittere vor Angst, ganz allein, ohne Angehörige um mich, die für meine Seele beten könnten."
 pam_decision_events.0005.desc.outro: "Mein Beichtvater hält das [Glossary('Sakramentar','SACRAMENTARY_GLOSS')] in der Hand und rät mir: „Tretet dem Antlitz der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) ohne Täuschung entgegen!“\n\nSelbst König David, der in Sünde gehüllt war, wurde nach seiner Beichte geläutert … [Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.a: "Das Sakrament der Buße steht bevor."
 pam_decision_events.0005.b: "Der Teufel soll mich holen! Befreit mich von diesem Priester!"
 pam_psalm_51_english: "„Gegen dich allein … habe ich gesündigt, ich habe getan, was böse ist in deinen Augen … So behältst du recht mit deinem Urteilsspruch, lauter stehst du da als Richter.“"
 SACRAMENTARY_GLOSS: "Sakramentarien oder #EMP Liturgika#! waren Bücher, die christliche Bischöfe oder Priester bei liturgischen Feiern verwendeten. Je nach Epoche und Region konnten sie Texte enthalten, die gesprochen oder gesungen wurden, sowie die Worte für die Sakramente."
 pam_decision_events.0006.t: "Sterbesakrament: Meine Sünde steht mir immer vor Augen"
 pam_decision_events.0006.intro: "„Irren ist menschlich. Doch ohne Beichte kann es keine Absolution geben“, sagt [confessor.GetTitledFirstName]."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\nMeine Sünden waren zahlreich und schwerwiegend. Meine Seele ist schwer und gefangen in den sengenden Fingern Satans. Er ist darauf aus, sich das anzueignen, was ihm so offensichtlich gehört.\n\n"
 pam_decision_events.0006.desc.good: "\n\nMein Herz ist leicht, denn mein Handeln stand im Einklang mit dem Willen des Herrn.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nIch bin nur ein Mensch, und trotz meiner besten Absichten holte mich die Sünde ein.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "Wie oft wurde ich schon von meiner [my_sinful_trait.GetName(soon_dead)|l]en Natur in die Irre geführt!"
 pam_decision_events.0006.desc.secret_sin: "Ich verbarg mein Dasein als [my_secret.GetName] in einem Hafen der Dunkelheit."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "Am schlimmsten ist vielleicht, dass ich als [my_criminal_trait.GetName(soon_dead)] gehe! Meine erdrückende Schuld erstickt jeden Atemzug."
 pam_decision_events.0006.desc.sin_default: "Meine Sünden, die zweifellos zahlreich sind, fallen mir nur schwer ein. Ich bin mir sicher, dass sie mir über die Lippen sprudeln wie das Wasser über einen überfluteten Deich, sobald ich mit [confessor.GetTitledFirstNameNoTooltip] spreche."
 pam_decision_events.0006.desc.sin_default_good_sp: "Möge die höchste Macht ([ROOT.Char.GetFaith.HighGodName]) meine Gebeine zermalmen und die Ungerechtigkeit auslöschen."
 pam_decision_events.0006.desc.outro: "Nur wenn ich meine Sünden mit aufrichtiger Reue bekenne, darf ich die Eucharistie empfangen."
 pam_decision_events.0006.a: "„Vergebt mir, [confessor.GetMotherFather] …“"
 pam_decision_events.0006.b: "Manche Sünden sollten mit mir ins Grab gehen."
 pam_decision_events.0006.b.flavor: "Ihr beichtet zwar einige Sünden, verschweigt jedoch Geheimnisse, die andere belasten könnten."
 pam_decision_events.0007.t: "Sterbesakrament: Fleisch, Blut und Öl"
 pam_decision_events.0007.intro: "So ist die Abrechnung meiner Sünden vorüber. Es ist etwas anderes, nur einen Pfennig zu schulden, als zehntausend Talente.\n\nMein Beichtvater reicht mir das geweihte Brot und den geweihten Wein."
 pam_decision_events.0007.desc.bad: "Selbst jetzt, da man mir das Fleisch und das Blut meines Herrn darreicht, höre ich das Wispern der Teufel. Sie flehen mich an, ihnen meine Seele zu überlassen, damit ich weiterleben und mich weltlichen Genüssen hingeben kann.\n\n"
 pam_decision_events.0007.desc.good: "Nachdem ich mich von meiner Last befreit habe, stürze ich mich in die Arme des Todes. Ich sehne mich danach, das Fleisch und Blut meines Herrn zu empfangen, an dessen Seite ich bald sein werde.\n\n"
 pam_decision_events.0007.desc.neutral: "Möge das Fleisch und Blut des Herrn mich vor jenen Dämonen bewahren, die wie Wölfe lauern, um mich vor meiner Zeit zu holen.\n\n"
 pam_decision_events.0007.desc.oil.intro: "Danach salbt [confessor.Custom('DE_PRO_PER_S_3P_N')] mir Stirn, Hände und Füße mit heiligem Öl."
 pam_decision_events.0007.desc.oil.bad: "Meine Seele ist nach wie vor in Unruhe.\n\n"
 pam_decision_events.0007.desc.oil.good: "Die Liebe des Herrn lässt meine Seele erstrahlen.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "Meine Seele fühlt sich für ihre Reise gut beschützt.\n\n"
 pam_decision_events.0007.desc.outro: "Nachdem das [Glossary('Viaticum','VIATICUM_GLOSS')] und die [Glossary('Letzte Ölung','UNCTION_GLOSS')] vollbracht sind, kann ich planen, wer für mich beten soll."
 VIATICUM_GLOSS: "Viaticum (lat. „Wegzehrung) ist die Bezeichnung für das Sakrament der Kommunion respektive der Eucharistie im Zusammenhang mit den Sterbesakramenten. Die Reise, auf die man sich begibt, ist der Übergang ins ewige Leben."
 UNCTION_GLOSS: "Die Letzte Ölung ist die Salbung von Kranken mit heiligem Öl, wenn sie „in extremis“, also kurz vor dem Tod, vollzogen wird. Sie soll die Betroffenen auf das ewige Leben vorbereiten."
 pam_decision_events.0007.a: "Möge der Orden ([monastic_order.GetName]) für mich beten."
 pam_decision_events.0007.b: "Ich möchte einen Orden ([military_order.GetName]) stärken."
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip|U] kann meine Reichtümer haben, und ich erhalte im Gegenzug [religious_head.Custom('DE_PRO_POS_S_3P')]e Gebete."
 pam_decision_events.0007.d: "Ein frommes Wort an [confessor.GetTitledFirstNameNoTooltip] sollte wohl reichen."
