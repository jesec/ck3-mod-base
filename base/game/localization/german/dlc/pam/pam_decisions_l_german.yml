 pam_cause_great_schism_decision: "Das Große Schisma verursachen"
 pam_cause_great_schism_decision_desc: "Die Gemeinschaft ist zerbrochen. Mit einem entscheidenden Schlag kann ich den Anbruch einer neuen Ordnung erzwingen."
