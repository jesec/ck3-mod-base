 pam_decision_confession_name: "Beichte abnehmen"
 pam_decision_confession_name_low: "Meine Sünden gestehen"
 pam_decision_confession_desc: "Wenn ein Mensch sich der Schuld bewusst wird, die er auf sich geladen hat, muss er seine Sünden gestehen."
 pam_decision_confession_tooltip: "Eure Sünden gestehen"
 pam_decision_confession_tooltip_sp_effect: "Ihr erhaltet etwas [spiritual_fulfillment|El]"
 pam_decision_confession_tooltip_stress_effect: "Ihr verliert etwas [stress|E]"
 pam_decision_confession_confirm: "Ruft den [ROOT.Char.GetFaith.PriestNeuter]"
 sp_confession_decision_tooltip: "Eure [spiritual_fulfillment|El] liegt bei mindestens #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 pam_decision_confession_sp_court_chaplain: "Ihr beschäftigt einen [court_chaplain|E]"
 pam_decision_events.0001.t: "Beichte"
 pam_decision_events.0001.desc.intro: "[chaplain.GetTitledFirstName|U] wartet geduldig in der leeren Kapelle.\n\n"
 pam_decision_events.0001.desc.bad: "[chaplain.Custom('DE_PRO_POS_S_3P')|U] strenger Blick erinnert mich an den meines Vaters."
 pam_decision_events.0001.desc.good: "Auch wenn die Last auf meinen Schultern nicht schwer ist, könnte sie dennoch leichter sein."
 pam_decision_events.0001.desc.neutral: "Wie ein verirrtes Stück Vieh und unsicher ob der Güte meines Herzens nähere ich mich [chaplain.Custom('DE_PRO_PER_S_3P_D')]."
 pam_decision_events.0001.desc.sin.preamble: "\n\nDie Schuld, die ich meiner Sünden wegen verspüre, ist mir nicht fremd."
 pam_decision_events.0001.desc.sin.lustful: "Ich ließ die Lust meinen Willen bezwingen."
 pam_decision_events.0001.desc.sin.chaste: "Meine Keuschheit wurde mir zu einer kalten Zuflucht vor meinen Pflichten."
 pam_decision_events.0001.desc.sin.gluttonous: "Ich habe mein Fleisch zügellos gefüttert."
 pam_decision_events.0001.desc.sin.temperate: "Meine Mäßigung erstarrte zu einer Verleugnung aller Bedürfnisse."
 pam_decision_events.0001.desc.sin.greedy: "Ich klammerte mich ans Gold, wo ich es doch hätte weggeben sollen."
 pam_decision_events.0001.desc.sin.generous: "Meine Großzügigkeit spottete jeder Weisheit und ließ mich leer zurück."
 pam_decision_events.0001.desc.sin.lazy: "Die Trägheit hielt mich vom Gebet und meinen Pflichten ab."
 pam_decision_events.0001.desc.sin.diligent: "Mein Eifer für die Arbeit verdrängte meine Gnade."
 pam_decision_events.0001.desc.sin.wrathful: "Der Zorn trieb mich zur Sünde."
 pam_decision_events.0001.desc.sin.calm: "Meine Ruhe war als Tugend verkleidete Gleichgültigkeit."
 pam_decision_events.0001.desc.sin.patient: "Meine Geduld gerann zu feigem Zaudern."
 pam_decision_events.0001.desc.sin.impatient: "Ungeduld machte mich barsch und unbesonnen."
 pam_decision_events.0001.desc.sin.arrogant: "Stolz ließ mein Herz anschwellen."
 pam_decision_events.0001.desc.sin.humble: "Falsche Bescheidenheit hielt mich von der Wahrheit fern."
 pam_decision_events.0001.desc.sin.deceitful: "Ich sprach Falschheiten aus und verbarg, was ich an Ehrlichkeit schuldete."
 pam_decision_events.0001.desc.sin.honest: "Meine stumpfe Ehrlichkeit schlug Wunden, wo Sanftheit gefragt gewesen wäre."
 pam_decision_events.0001.desc.sin.craven: "Furcht verleitete mich dazu, das aufzugeben, was richtig war."
 pam_decision_events.0001.desc.sin.brave: "Mein Wagemut lief meiner Umsicht davon und wurde zu Leichtsinnigkeit."
 pam_decision_events.0001.desc.sin.shy: "Schüchternheit hielt mich von dem Guten ab, das ich hätte tun sollen."
 pam_decision_events.0001.desc.sin.gregarious: "Mein Sinn für Geselligkeit übertönte mein Gewissen."
 pam_decision_events.0001.desc.sin.ambitious: "Mein Ehrgeiz rannte meinem Gewissen davon."
 pam_decision_events.0001.desc.sin.content: "Zufriedenheit stillte meinen Hunger auf das Rechtschaffene."
 pam_decision_events.0001.desc.sin.arbitrary: "Statt mit Gerechtigkeit herrschte ich mit Willkür."
 pam_decision_events.0001.desc.sin.just: "Meine Gerechtigkeit war gnadenlos und hochmütig."
 pam_decision_events.0001.desc.sin.cynical: "Zynismus zersetzte meinen Glauben."
 pam_decision_events.0001.desc.sin.zealous: "Eifer brannte heißer als die Mildtätigkeit."
 pam_decision_events.0001.desc.sin.paranoid: "Argwohn vergiftete meinen Umgang mit anderen."
 pam_decision_events.0001.desc.sin.trusting: "Vertrauen machte mich blind für Ruchlosigkeit."
 pam_decision_events.0001.desc.sin.compassionate: "Mitleid verleitete mich dazu, Dinge zu entschuldigen, die hätten verdammt werden sollen."
 pam_decision_events.0001.desc.sin.callous: "Ich härtete mein Herz gegen das Leid anderer ab."
 pam_decision_events.0001.desc.sin.stubborn: "Sturheit machte mich taub für jeden Verbesserungsvorschlag."
 pam_decision_events.0001.desc.sin.fickle: "Unbeständigkeit machte mein Wort unzuverlässig."
 pam_decision_events.0001.desc.sin.eccentric: "Meine exzentrischen Anflüge erregten Anstoß bei den Gläubigen."
 pam_decision_events.0001.desc.sin.vengeful: "Rachsucht verzehrte mich."
 pam_decision_events.0001.desc.sin.forgiving: "Vergebung fiel mir selbst bei schwersten Vergehen zu leicht."
 pam_decision_events.0001.desc.sin.sadistic: "Ich fand Freude in der Grausamkeit."
 pam_decision_events.0001.desc.outro: "\n\n„[Glossary('$pam_john_20_22_english|q$','JOHN_20_22_GLOSS')]“"
 pam_decision_events.0001.a: "Vergebt mir, [chaplain.GetMotherFather], denn ich habe gesündigt."
 pam_john_20_22_english: "Empfangt den Heiligen Geist. Denen Ihr die Sünden erlasst, denen sind sie erlassen; denen Ihr sie behaltet, sind sie behalten."
 JOHN_20_22_GLOSS: "#weak Johannes 20:22–23, EÜ#!"
 pam_decision_act_of_devotion: "Inszeniert einen Akt der Hingabe"
 pam_decision_act_of_devotion_desc: "Meine tiefe innere Verbundenheit zur höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) ist derart stark, dass ich sie nach außen tragen muss!\n\nRuft die [ROOT.Char.GetFaith.PriestNeuterPlural] herbei, haltet eine große Messe ab und trommelt alle im Reich zusammen. Lasst sie sehen, wie hingebungsvoll [Select_CString(ROOT.Char.IsFemale, 'ihre Lehnsherrin', 'ihr Lehnsherr')] ist."
 pam_decision_act_of_devotion_desc_tooltip: "[piety|E] gegen [prestige|E] eintauschen"
 pam_decision_act_of_devotion_tooltip_effect: "Ihr wählt zwischen:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! [prestige|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E] und einer [prestige_level|E] im Austausch für eine [piety_level|E]"
 pam_decision_act_of_devotion_confirm: "Lasst die Glocken läuten!"
 pam_decision_act_of_devotion_sp_tooltip: "Eure [spiritual_fulfillment|El] liegt bei mindestens #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 pam_decision_act_of_devotion_fame_tooltip: "Eure [prestige_level|E] muss unter [GetModifier('prestige_level_3').GetNameWithTooltip|L] liegen"
 pam_confession_penalty_modifier: "Beichtstrafe"
 pam_confession_penalty_modifier_desc: "Dieser Charakter muss auf Aufforderung seines Beichtvaters eine bestimmte Handlung ausführen."
 pam_meddled_in_clerical_appointments_modifier: "Einmischung in kirchliche Ernennungen"
 pam_meddled_in_clerical_appointments_modifier_desc: "Dieser [ruler|E] ersetzte per Zwang einen [clerical_title|E]-[holder|E] und verärgerte damit den [clergy|E]."
 pam_kowtowed_to_pope_modifier: "Vor der Kirche das Knie beugen"
 pam_kowtowed_to_pope_modifier_desc: "Dieser [ruler|E] beugte das Knie vor der Kirche und versprach, die #EMP klerikale, widerrufliche#! Doktrin auf jenem Konzil zu unterstützen, das den [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] beendet. Der Modifikator wird aufgehoben, sobald das Konzil die Kontroverse beigelegt hat."
 pam_kowtow_to_pope_decision: "Vor dem Oberhaupt ([ROOT.Char.GetFaith.ReligiousHeadName]) das Knie beugen"
 pam_kowtow_to_pope_decision_desc: "Krone und Bischofsstab bekriegen sich über die Frage, wer die kirchlichen Titelträger ernennen soll. Beugt das Knie vor der höchsten Macht ([ROOT.Char.GetFaith.ReligiousHeadName]), anstatt den offenen Widerstand zu riskieren, und steht an der Seite der Gläubigen, wenn das große Konzil einberufen wird, um die Angelegenheit beizulegen."
 pam_kowtow_to_pope_decision_tooltip: "Schwört, den Anspruch der Kirche zu unterstützen, Ernennungen durchzuführen"
 pam_kowtow_to_pope_decision_confirm: "Das Knie beugen"
 pam_kowtow_to_pope_effect_tt: "Ihr werdet die #EMP klerikale, widerrufliche#! Doktrin auf jenem Konzil unterstützen, das den [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName] beendet"
 pam_kowtow_to_pope_not_already_pledged_tt: "Ihr habt noch nicht geschworen, die Kirche zu unterstützen"
 pam_kowtow_to_pope_needs_head_of_faith_tt: "Euer [faith|E] muss ein [head_of_faith|E] haben"
 pam_kowtow_to_pope_toast: "Ihr beugt vor dem Oberhaupt ([ROOT.Char.GetFaith.ReligiousHeadName]) das Knie"
 pam_decision_events.0001.a.confession_random_outcome: "Euer [court_chaplain|E] wird Euch vielleicht um etwas bitten oder Ihr werdet während der Beichte womöglich etwas erfahren …"
 pam_decision_events.0001.a.piety: "Eure Beichte fühlte sich aufrichtig an"
 pam_decision_events.0001.a.hook: "[chaplain.GetShortUIName|U] erfuhr neues Wissen"
 pam_decision_events.0001.a.opinion_malus: "[chaplain.GetShortUIName|U] missbilligt Eure sündhaften Eigenschaften"
 pam_decision_events.0001.a.courtier_secret: "Ihr hört [my_courtier.GetShortUIName] die Beichte ablegen"
 pam_decision_events.0001.a.random_confession: "Ihr hört eine andere Person die Beichte ablegen"
 pam_decision_events.0001.a.pilgrimage: "[chaplain.GetShortUIName|U] fordert Euch auf, eine [pilgrimage|E] zu unternehmen"
 pam_decision_events.0001.a.high_almoner: "[chaplain.GetShortUIName|U] fordert Euch auf, einen [GetCourtPositionType('high_almoner_court_position').GetName()] anzuheuern"
 pam_decision_events.0001.a.no_war: "[chaplain.GetShortUIName|U] fordert Euch auf, in den nächsten #V 5 Jahren#! keine Angriffskriege zu erklären"
 pam_confession_penalty_var.no_war_toast: "Ihr verspracht, keine Kriege zu erklären"
 pam_decision_events.0001.a.conversion: "[chaplain.GetShortUIName|U] fordert Euch auf, [target.GetShortUIName] zu bekehren"
 pam_decision_events.0001.a.conversion.toast: "Ihr hieltet Euer Versprechen"
 pam_decision_events.0001.a.conversion.toast_puppeteer: "[puppet_or_actor.GetShortUIName|U] erfüllte das Versprechen"
 pam_decision_events.0002.t: "Eine Zurschaustellung der Hingabe"
 pam_decision_events.0002.desc.intro: "[my_chaplain.GetTitledFirstName|U] steht neben mir, neben dem Altar. Die sanften Sonnenstrahlen tauchen"
 pam_decision_events.0002.desc.uncrowned: "meine Gewänder in einen heiligen Schein."
 pam_decision_events.0002.desc.crowned: "meine Krone in ein Licht wie das eines Heiligenscheins."
 pam_decision_events.0002.desc.mid: "\n\n„[ROOT.Char.Custom('RandomBibleQuote')]“ [my_chaplain.Custom('DE_PRO_POS_S_3P')|U]e Predigt nimmt einfach kein Ende,"
 pam_decision_events.0002.desc.bad: "während ich mich bemühe, aufmerksam zu bleiben."
 pam_decision_events.0002.desc.good: "während die Zuhörer den Blick scheinbar ausschließlich auf mich gerichtet halten."
 pam_decision_events.0002.desc.neutral: "während ich die Zuhörer mustere, um beeindruckte Gesichter zu entdecken."
 pam_decision_events.0002.desc.outro: "\n\n„In dieser verhängnisvollen Zeit wird uns [Select_CString(ROOT.Char.IsFemale, 'unsere weise und tugendhafte', 'unser weiser und tugendhafter')] [ROOT.Char.GetNameNoTooltip] führen.“"
 pam_decision_events.0002.a: "Die Menge braucht meine persönliche Ansprache."
 pam_decision_events.0002.b: "Eine kurze Bestätigung reicht schon aus."
 pam_mentor_sp_decision: "Spirituelle Führung anbieten"
 pam_mentor_sp_decision_desc: "Wir, die wir im Licht der höchsten Macht ([ROOT.Char.GetFaith.HighGodName]) wandeln, haben die Pflicht, jene zu führen, die in der Dunkelheit verloren sind, und jene, deren Jugend sie dazu verleiten könnte, in Gedanke oder Tat vom rechten Weg abzuweichen."
 pam_mentor_sp_decision_desc_tooltip: "Einem Kind bei seiner [Concept('spiritual_fulfillment', 'spirituellen Erfüllung')|E] helfen"
 pam_mentor_sp_decision_confirm: "Sprecht und hört zu."
 pam_mentor_sp_decision_sp_tooltip: "Eure [spiritual_fulfillment|El] liegt bei mindestens #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 pam_mentor_sp_decision_tooltip_effect: "Ihr werdet die [spiritual_fulfillment|El] Eures [Concept('primary_heir','Haupterben')|E] oder Eures [Concept('favorite_child', 'Lieblingskindes')|E] erhöhen"
 pam_mentor_sp_decision_valid_child_tt: "Ihr braucht ein [child|E], das:\n$BULLET_WITH_TAB$Denselben [Concept('faith', 'Glauben')|E] hat wie Ihr\n$BULLET_WITH_TAB$Mindestens #V 16#! Jahre alt ist\n$BULLET_WITH_TAB$Entweder Euer [primary_heir|E] oder Euer [favorite_child|E] ist\n$BULLET_WITH_TAB$Eine [spiritual_fulfillment|El] unter #V 75#! hat\n$BULLET_WITH_TAB$Zuvor keine spirituelle Führung erhielt"
 pam_mentor_sp_decision_primary_heir_tt: "Euer [primary_heir|E] muss:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_heir_name: "Haupterbe"
 pam_mentor_sp_decision_primary_favorite_child_tt: "Euer [favorite_child|E] muss:$pam_mentor_sp_decision_primary_requirements_tt$"
 pam_mentor_sp_decision_primary_favorite_child_name: "Lieblingskind"
 pam_mentor_sp_decision_primary_requirements_tt: "\n$BULLET_WITH_TAB$Denselben [Concept('faith', 'Glauben')|E] haben wie Ihr\n$BULLET_WITH_TAB$Mindestens #V 16#! Jahre alt sein\n$BULLET_WITH_TAB$Eine [spiritual_fulfillment|El] unter #V 75#! haben\n$BULLET_WITH_TAB$Zuvor keine spirituelle Führung erhalten haben"
 pam_decision_events.0003.t: "Die wichtigste Lektion"
 pam_decision_events.0003.desc.intro: "Die Nacht ist hereingebrochen, und im Donjon herrscht Stille. Mein[target_child.Custom('DE_END_PRO_S_N')] [target_child.Custom('GetDaughterSon')] sitzt neben mir in der Privatkapelle.\n\nIch sehe [target_child.Custom('DE_PRO_PER_S_3P_A')] an."
 pam_decision_events.0003.desc.bad: "Mit eingefallenen Wangen, abwesendem Blick und fast schlafend steht [target_child.Custom('DE_PRO_PER_S_3P_N')] da.\n\n„[ROOT.Char.GetMotherFather]“, beginnt [target_child.Custom('DE_PRO_PER_S_3P_N')] seine Frage voller Ungeduld. „Warum rieft Ihr mich her?“"
 pam_decision_events.0003.desc.good: "[target_child.Custom('DE_PRO_POS_S_3P')|U]e Augen erstrahlen im Kerzenlicht. [target_child.Custom('DE_PRO_PER_S_3P_N')|U] ist [Select_CString(target_child.IsFemale, 'ein braves Mädchen', 'ein braver Junge')].\n\n„[ROOT.Char.GetMotherFather|U], tat ich Euch Unrecht?“, fragt [target_child.Custom('DE_PRO_PER_S_3P_N')]."
 pam_decision_events.0003.desc.neutral: "[target_child.Custom('ComplimentAdjective')|U]. Alt genug ist [target_child.Custom('DE_PRO_PER_S_3P_N')] jetzt.\n\n„[ROOT.Char.GetMotherFather|U], wie lebt man richtig?“, fragt [target_child.('DE_PRO_PER_S_3P_N')] leise."
 pam_decision_events.0003.a: "[Select_CString(ROOT.Char.GetTitle.IsFemale, 'Eine verderbte', 'Ein verderbter')] [ROOT.Char.GetTitleAsNameNoTooltip] wird [target_child.Custom('DE_PRO_POS_S_3P')] Reich ([ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]) rasch vergiften."
 pam_decision_events.0003.b: "Seid einfach … gutherzig."
 grudge_pressured_me_sp: "[CHARACTER.GetShortUIName|U] entwickelte einen Groll gegen [TARGET_CHARACTER.GetShortUIName], nachdem [TARGET_CHARACTER.GetShortUIName] [CHARACTER.Custom('DE_PRO_PER_S_3P_A')] hinsichtlich [CHARACTER.Custom('DE_PRO_POS_S_3P')]er spirituellen Erfüllung unter Druck gesetzt hatte."
 grudge_pressured_me_sp_corresponding: "[CHARACTER.GetShortUIName|U] war das Ziel des Grolls von [TARGET_CHARACTER.GetShortUIName], nachdem [CHARACTER.GetShortUIName] [TARGET_CHARACTER.Custom('DE_PRO_PER_S_3P_A')] hinsichtlich [TARGET_CHARACTER.Custom('DE_PRO_POS_S_3P')]er spirituellen Erfüllung unter Druck gesetzt hatte."
 pam_decision_events.0003.after_tt: "Möglicherweise wird etwas über [target_child.GetFirstName] enthüllt …"
 pam_decision_events.0003.secret: "[target_child.GetShortUIName|U] beichtet Euch etwas"
 pam_decision_events.0003.mystic: "[target_child.GetShortUIName|U] zeigt großes Interesse an dieser Angelegenheit"
