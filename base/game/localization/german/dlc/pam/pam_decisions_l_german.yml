 pam_kingdom_of_heaven.0001.t: "Königreich der Himmel"
 pam_kingdom_of_heaven.0001.desc: "„Mit dem Königreich der Himmel ist es so, als ob jemand Saat auf den Boden streut, schläft und aufsteht, bei Nacht und bei Tag, und die Saat keimt und wächst – er weiß nicht, wie.“\n\nIch wende mich der Christenheit zu. In meiner Faust halte ich Erde aus dem Heiligen Land.\n\n„Die Erde bringt von selbst zuerst den Halm hervor.“ Ich öffne die Faust, und die Erde zerstreut sich in der Luft. „Dann die Ähre.“ Ich deute auf mein Volk. „Dann das volle Korn in der Ähre.“ Ich hebe meinen Bischofsstab.\n\n„Doch wenn das Korn reif ist … legt er sogleich die Sichel an, denn die Erntezeit ist gekommen.“"
 pam_kingdom_of_heaven.0001.a: "Ich werde [previous_capital.GetNameNoTooltip] nicht aufgeben."
