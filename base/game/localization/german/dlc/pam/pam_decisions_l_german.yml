 pam_establish_theocratic_dynasty_decision: "Eine Dynastie gründen"
 pam_establish_theocratic_dynasty_decision_desc: "Selbst die bescheidensten Wurzeln können zu mächtigen Bäumen heranwachsen."
 pam_establish_theocratic_dynasty_decision_desc_tooltip: "Eure eigene [dynasty|E] ins Leben rufen"
