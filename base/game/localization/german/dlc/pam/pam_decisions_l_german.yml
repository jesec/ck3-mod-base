 pam_decision_events.0011.opening: "An die [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] aller Lande,"
 pam_decision_events.0011.desc.permitted: "Ich setzte mein Siegel unter diese Sache: Von diesem Tag an soll dieser Grundsatz ([pam_tenet_stance_tenet.GetName(pam_tenet_stance_issuer.GetRite)]) zu den angenommenen Lehren des Glaubens zählen.\n\nMögen jene, die ihn im Verborgenen praktizierten, aus der Finsternis treten."
 pam_decision_events.0011.desc.prohibited: "Ich setzte mein Siegel unter diese Sache: Von diesem Tag an soll dieser Grundsatz ([pam_tenet_stance_tenet.GetName(pam_tenet_stance_issuer.GetRite)]) unter dem Bannstrahl des Glaubens liegen. Wer daran festhält, stellt sich abseits des Glaubens."
 pam_decision_events.0011.desc.fallback: "Ich machte eine Verkündung bezüglich eines Grundsatzes ([pam_tenet_stance_tenet.GetName(pam_tenet_stance_issuer.GetRite)])."
 pam_decision_events.0011.b: "Und dennoch wahre ich den Glauben mit dieser Lehre …"
 pam_decision_events.0012.opening: "An die [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] aller Lande,"
 pam_decision_events.0012.desc: "[bull_issuer.GetTitledFirstName|U] erklärte den [heresy_rite.GetName] zur Ketzerei.\n\nJeder Herrscher des Glaubens sollte dies zur Kenntnis nehmen."
 pam_decision_events.0012.a: "So sei es."
 pam_decision_events.0013.opening: "An [ROOT.Char.GetTitledFirstNameNoTooltip], einst zu den Gläubigen gezählt,"
 pam_decision_events.0013.desc.intro: "Es ist erledigt. Der [heresy_rite.GetName] wurde zur Ketzerei erklärt und alle, die ihm anhängen, werden aus dem Glauben ([bull_issuer.GetFaith.GetName]) ausgestoßen, herausgeschnitten mit Stumpf und Stiel."
 pam_decision_events.0013.desc.outro: "\n\nAlso entscheidet Euch: Beugt das Knie und werdet wieder in der Herde aufgenommen oder hängt weiter Eurem Irrtum an und seid verdammt."
 pam_decision_events.0013.a: "Wir werden allein stehen – und zwar freudig."
 pam_decision_events.0013.b: "Ich werde nicht ausgestoßen werden. Nehmt mich wieder auf."
 pam_tenet_stance_judgement_personal_permit: "Meine Hingabe wurde erwidert!"
 pam_tenet_stance_judgement_personal_prohibit: "Ich muss meine Gebete vor allzu spitzen Ohren schützen …"
