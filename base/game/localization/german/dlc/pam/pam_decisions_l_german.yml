 pam_establish_theocratic_dynasty_decision_effects_tt: "Ihr gründet Eure eigene [dynasty|E]"
 pam_decision_events.0004.t: "Ein Neuanfang"
 pam_decision_events.0004.desc: "Seit Jahren trage ich Gewänder statt eines Banners. Dennoch wurden mir Rang und Macht zuteil.\n\nWarum sollte mein Vermächtnis mit mir untergehen, nur weil ich nicht in den Adelsstand erhoben wurde?"
 pam_decision_events.0004.a: "#EMP [ROOT.Char.GetHouse.GetMotto].#!"
 pam_decision_events.0004.tt: "#high Die [THIS.Char.GetDynasty.GetName]-Dynastie wird gegründet#!"
 pam_determine_patron_saint_decision: "Einen Schutzpatron auswählen"
 pam_determine_patron_saint_decision_desc: "Von ihren himmlischen Thronen aus beobachten die Heiligen die Kämpfe der sterblichen Herrscher und wägen den Charakter unserer Seelen ab.\n\nLasst mich einen Schutzpatron wählen, dessen Tugenden meinen Weg prägen sollen und dessen Fürsprache meine Hand vor der höchsten Macht ([ROOT.GetCharacter.GetFaith.HighGodName]) und dem Volk stärken möge."
 pam_determine_patron_saint_decision_tooltip: "Einen Schutzpatron auswählen, nach dessen Tugenden Ihr leben wollt"
 pam_determine_patron_saint_decision_confirm: "Meine Entscheidung steht."
