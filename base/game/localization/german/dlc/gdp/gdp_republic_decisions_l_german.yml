l_german:
 gdp_adopt_republic_government_decision: "Republikanische Ideale annehmen"
 gdp_adopt_republic_government_decision_desc: "Ich beobachte die Menge, wie sie durch die Straßen zieht, gezeichnet von ihrem täglichen Überlebenskampf. Ich frage mich, ob unsere [ROOT.Char.GetGovernment.GetAdjectiveNoTooltip|l]e Lebensweise tatsächlich der einzige Weg für einen Herrscher ist. Könnte ich mir Treue durch verdiente Anerkennung statt allein durch mein Geburtsrecht sichern? Vielleicht ist es an der Zeit, neue Ideale anzunehmen und unsere Lebensweise neu zu gestalten."
 gdp_adopt_republic_government_decision_tooltip: "Republikanische Ideale annehmen und eine [GetGovernment('republic_government').GetName] werden"
 gdp_adopt_republic_government_decision_confirm: "Republikanische Ideale annehmen"
 liege_has_granted_city_charter: "Euer [liege|E] gewährte Euch eine Stadt-Charta"
 liege_has_granted_city_charter_duration: "Euer [liege|E] gewährte Euch eine Stadt-Charta #weak (bis [GetCurrentDateWithDiff(GetVarTimeRemaining(founding_ruler.MakeScope, 'has_liege_permission_to_found_republic'))])#!"
 gdp_adopt_republic_government_decision_hre_warning_tt: "@warning_icon! #X Ihr werdet nicht länger ein [elector|E] im HRR ([GetTitleByKey('e_hre').GetName]) sein#!"
 gdp_adopt_republican_ways_decision: "Republikanische Lebensart annehmen"
 gdp_adopt_republican_ways_decision_desc: "Die Zusammenkünfte, die uns einst verbanden, ächzen nun unter der Last der Märkte und Mauern. Wenn [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] gedeihen soll, müssen wir die alten Stammesbräuche hinter uns lassen und die Stadt sich als Republik selbst regieren lassen."
 gdp_adopt_republican_ways_decision_tooltip: "Lasst die [Concept('tribal', 'Stammestraditionen')|E] hinter Euch und werdet eine [republic|E]"
 gdp_adopt_republican_ways_decision_confirm: "Republikanische Lebensart annehmen"
 gdp_tribal_capital_becomes_city_tt: "Euer [realm_capital|E] wird ein [city_holding|E]"
 gdp_other_tribal_holdings_become_castles_tt: "Alle anderen [tribal_holdings|E] im Reich werden [castle_holdings|E]"
 gdp_tribal_vassals_will_feudalize_tt: "Eure [Concept('tribal', 'Stammes')|E]-[vassals|E] nehmen eine [feudal|E]- oder [Concept('clan', 'Clans')|E]-[government|E] an"
 convert_to_feudalism_from_republic_decision: "[ROOT.Char.Custom('GetTribalReformGovernment')|U]-Lebensart annehmen"
 convert_to_feudalism_from_republic_decision_desc: "Versammlungen, Abläufe und Bürokratie verlangsamen die Wirksamkeit unserer Regierung. Wenn [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] gedeihen soll, müssen wir uns von diesen Lasten befreien."
 convert_to_feudalism_from_republic_decision_confirm: "[ROOT.Char.Custom('GetTribalReformGovernment')|U]-Lebensart annehmen"
 convert_to_feudalism_from_republic_decision_tooltip: "[Concept('government', 'Regierungsform')|E] ändern"
 patricians_becomes_merchants_desc: "[patrician|E]-[vassals|E] werden [merchants|E]"
 gdp_restore_roman_republic_decision: "Die Römische Republik wiederherstellen"
 gdp_restore_roman_republic_decision_desc: "Die Römische Republik war ein Symbol der Freiheit und des Wohlstands – ein Vorbild, dem alle nacheifern sollten. Doch wie so vieles auf dieser Welt fiel auch sie dem Niedergang anheim. Es ist an der Zeit, sie wieder zum Leben zu erwecken und ihren früheren Glanz wiederherzustellen!"
 gdp_restore_roman_republic_decision_tooltip: "Die Römische Republik wiederherstellen"
 gdp_restore_roman_republic_decision_confirm: "Die Römische Republik wiederherstellen"
 restore_roman_republic_make_rome_capital_desc: "Ihr könnt [GetTitleByKey('c_roma_urbs').GetName] als [realm_capital|E] festlegen"
 assembly_members_appointed_as_senators_desc: "Alle Mitglieder der [assembly|E] werden zu [republic_senators|E] ernannt"
 gdp_popular_mandate_decision: "Um Unterstützung durch das Volk bitten"
 gdp_popular_mandate_decision_desc: "Das Volk von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] liebt mich. Diese Gunst kann ich nutzen, um sie für meine Wiederwahl zu gewinnen. Die Stimme des Volkes hat in der Versammlung großes Gewicht, und [ROOT.Char.Custom('DE_ART_IND_N')] [ROOT.Char.GetTitleAsNameNoTooltip], [ROOT.Char.Custom('DE_ART_DEF_S_N')] das Volk hinter sich hat, verfügt bei der Stimmenauszählung über mehr Einfluss.\n\nEs wird mich zwar einen Teil dieser Gunst kosten, doch eine Abstimmung wird heute gewonnen, nicht morgen."
 gdp_popular_mandate_decision_tooltip: "Setzt [popular_opinion|E] in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ein, um bei der nächsten [election|E] eine zusätzliche Stimme zu erhalten"
 gdp_popular_mandate_decision_confirm: "Das Volk hinter mir versammeln"
 gdp_popular_mandate_no_active_mandate_desc: "Hat noch nicht die Unterstützung durch das Volk"
 gdp_civic_labor_decision: "Bürgerarbeit anordnen"
 gdp_civic_labor_decision_desc: "Das Wohlwollen von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ist eine ebenso verlässliche Ressource wie Gold. Ich werde Euch, die Bürger, dazu aufrufen, Eure Arbeitskraft und Euer Fachwissen für meine Bauvorhaben einzubringen – im Gegenzug erhaltet Ihr einen Teil des aufgewendeten Wohlwollens."
 gdp_civic_labor_decision_tooltip: "Setzt [popular_opinion|E] in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ein, um beim Bau des Herrscherwohnsitzes Boni zu erhalten"
 gdp_civic_labor_decision_confirm: "An die Bürger appellieren"
 gdp_popular_gifts_decision: "Patronat erbitten"
 gdp_popular_gifts_decision_desc: "Mein Ansehen unter den Bürgern von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] verschafft mir Einfluss. Ich werde bekannt geben, dass [ROOT.Char.GetTitle.Custom('DE_ART_DEF_S_N')] [ROOT.Char.GetTitleAsNameNoTooltip] Angebote von den großen Patrizierhäusern annimmt. Diese werden miteinander wetteifern, um sich gegenseitig zu übertrumpfen. Der Palast profitiert in jedem Fall davon."
 gdp_popular_gifts_decision_tooltip: "Setzt [popular_opinion|E] ein, um wohlhabende Patrizierfamilien dazu zu bringen, um Eure Gunst zu wetteifern. So erhaltet ihr [gold|E] und Geschenke für den Palast"
 gdp_popular_gifts_decision_confirm: "Das Wettbieten beginnen"
 gdp_popular_gifts_artifact_tt: "Ihr erhaltet ein zufälliges Geschenk-[artifact|E]"
 gdp_glorification_decision: "Verherrlichung annehmen"
 gdp_glorification_decision_desc: "Das Volk von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] schätzt mich auf eine Weise, die über Politik und Beliebtheit hinausgeht. Die Menschen wollen mich nicht als ihren Anführer ehren, sondern als Verkörperung der Stadt. Ich werde diesen Augenblick so akzeptieren, wie er ist."
 gdp_glorification_decision_tooltip: "Nehmt die Verherrlichung der Stadt entgegen. Das ist eine einmalige Ehre"
 gdp_glorification_decision_confirm: "Lasst sie feiern"
 gdp_glorification_artifact_tt: "Ihr erhaltet das [artifact|E] #V $gdp_glorification_artifact_name$#!"
 gdp_glorification_artifact_name: "Medaille für verdienstvolle Bürger"
 gdp_glorification_artifact_desc: "Eine Gedenkmedaille, die von den Bürgern von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] zu Ehren ihres geliebten Herrschers ([ROOT.Char.GetTitleAsNameNoTooltip]) überreicht wurde."
 gdp_popular_mandate_decision_toast: "Unterstützung durch das Volk gesichert"
 gdp_civic_labor_decision_toast: "Bürgerarbeit mobilisiert"
 gdp_popular_gifts_decision_toast: "Patrizier folgen dem Aufruf"
 gdp_glorification_decision_toast: "Die Stadt feiert"
 gdp_fund_alms_decree_decision: "Almosen im Hauptsitz verteilen"
 gdp_fund_alms_decree_decision_desc: "Als [ROOT.Char.GetTitleAsNameNoTooltip] obliegt es mir, für das Wohlergehen der Bürger von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] zu sorgen. Es gibt viele Gründe, Almosen zu verteilen: um Bedürftigen zu helfen, den Wohlstand der Stadt zu mehren und die Bande zu stärken, die unsere Gesellschaft zusammenhalten.\n\nGanz gleich, warum man es auch tut: Die Fürsorge für die Armen ist ein bewährtes Mittel, sich die Gunst der Massen zu sichern."
 gdp_fund_alms_decree_decision_tooltip: "Die Armen in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mit Almosen versorgen"
 gdp_fund_alms_decree_decision_confirm: "Für Almosen sorgen"
 gdp_tax_holiday_decree_decision: "Steuererleichterung"
 gdp_tax_holiday_decree_decision_desc: "In den kommenden Jahren sollen die Steuern, die man den Bürgern von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] auferlegt, gesenkt werden. Die Staatskasse wird die Kosten tragen, doch das Wohlwollen der Menschen ist diesen Preis wert."
 gdp_tax_holiday_decree_decision_tooltip: "Senkt die Stadtsteuern in [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], um die [popular_opinion|E] zu erhöhen"
 gdp_tax_holiday_decree_decision_confirm: "Stadtsteuern erlassen"
 gdp_debt_forgiveness_decree_decision: "Schuldenerlass"
 gdp_debt_forgiveness_decree_decision_desc: "Viele Bürger von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] sind hoch verschuldet und können ihre Schulden nicht zurückzahlen. Indem wir ihnen die Schulden gegenüber der Stadt erlassen, verschaffen wir ihnen Erleichterung und sichern uns im Gegenzug ihre Treue. Nicht jeder wird diese Verwendung der Staatskasse gutheißen, doch ein Herrscher, der das Volk hinter sich hat, steht auf festem Boden."
 gdp_debt_forgiveness_decree_decision_tooltip: "Erlasst die Schulden der Bürger von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], um einen beträchtlichen Bonus auf Eure [popular_opinion|E] zu erhalten"
 gdp_debt_forgiveness_decree_decision_confirm: "Schulden erlassen"
 gdp_debt_forgiveness_upset_patricians_tt: "Jeder [vassal|E] ohne die [house_ambition|E] [GetHouseAspiration('republic_communal').GetName|V]"
 gdp_debt_forgiveness_pleased_patricians_tt: "Jeder [vassal|E] mit der [house_ambition|E] [GetHouseAspiration('republic_communal').GetName|V]"
 gdp_finance_war_decree_decision: "Kriegsanstrengungen finanzieren"
 gdp_finance_war_decree_decision_desc: "Der Krieg ist eine schreckliche Angelegenheit und vor allem kostspielig. Sollte es notwendig werden, können wir zusätzliche Kriegssteuern erheben, um Mittel für die Kriegsanstrengungen sicherzustellen."
 gdp_finance_war_decree_decision_tooltip: "Zusätzliche Steuern erheben, um laufende Kriege zu finanzieren"
 gdp_finance_war_decree_decision_confirm: "Kriegssteuer erheben"
 finance_war_patrician_tax_name: "Patriziersteuer"
 finance_war_patrician_tax_desc: "$finance_war_patrician_tax_name$"
 finance_war_patrician_tax_tooltip: "Eine zusätzliche Steuer für [patricians|E] erheben"
 finance_war_citizen_tax_name: "Bürgersteuer"
 finance_war_citizen_tax_desc: "$finance_war_citizen_tax_name$"
 finance_war_citizen_tax_tooltip: "Eine zusätzliche Steuer auf [counties|E] erheben"
 every_patrician_tt: "Jeder [patrician|E]"
 gdp_war_approval_decree_decision: "Kriegszustimmung erbitten"
 gdp_war_approval_decree_decision_desc: "Nur durch den Willen der Versammlung dürfen wir [wars|E] erklären. Es mag nötig sein, hier und da ein wenig nachzuhelfen, um genügend Stimmen zu sichern, doch dies geschieht zum Wohl der Allgemeinheit."
 gdp_war_approval_decree_decision_tooltip: "Die [assembly|E] um Erlaubnis für eine [Concept('war', 'Kriegs')|E]-Erklärung bitten"
 gdp_war_approval_decree_decision_confirm: "Kriegszustimmung erbitten"
 gdp_war_approval_decree_decision_effect_desc: "Ihr erhaltet die Erlaubnis einen [war|E] zu erklären"
 must_have_assembly_approval_declare_war_desc: "Ihr habt #bold nicht#! die Zustimmung [assembly_possessive|E], um einen [war|E] zu erklären"
 gained_assembly_approval_declare_war_desc: "Ihr habt die Zustimmung [assembly_possessive|E] erlangt, einen [war|E] zu erklären"
 gdp_banishment_approval_decree_decision: "Erlaubnis zur Verbannung erbitten"
 gdp_banishment_approval_decree_decision_named: "Verbannung von [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat] erbitten"
 gdp_banishment_approval_decree_decision_desc: "Es gibt unter uns Leute, die unsere Herrschaft nicht ertragen können, und solche, die unsere Herrschaft nicht länger dulden kann. Mit Zustimmung der Versammlung können wir sie aus unserem Reich [Concept('banish', 'verbannen')|E] und so einen Gefahr beseitigen, ohne das Wagnis einer tödlichen Fehde einzugehen, die ein endgültigeres Ende mit sich brächte."
 gdp_banishment_approval_decree_decision_tooltip: "Die [assembly|E] um Erlaubnis für eine [Concept('banish', 'Verbannung')|E] des von Euch angeklagten Charakters bitten"
 gdp_banishment_approval_decree_decision_confirm: "Erlaubnis zur Verbannung erbitten"
 gdp_banishment_approval_decree_decision_effect_desc: "Ihr erhaltet die Erlaubnis, [indicted_character.GetShortUIName] zu [Concept('banish', 'verbannen')|E]."
 gdp_banishment_approval_decree_decision_effect_no_indicted_desc: "Ihr erhaltet die Erlaubnis, einen von Euch angeklagten Charakter zu [Concept('banish', 'verbannen')|E]."
 must_have_assembly_approval_banishment_desc: "Ihr habt #bold nicht#! die Zustimmung der [assembly|E], um diesen Charakter zu [Concept('banish', 'verbannen')|E]"
 gained_assembly_approval_banishment_desc: "Ihr habt bereits die Zustimmung der [assembly|E] erlangt, um [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName] zu [Concept('banish', 'verbannen')|E]"
 gdp_proscription_approval_decree_decision: "Genehmigung einer Ächtung erbitten"
 gdp_proscription_approval_decree_decision_named: "Genehmigung für eine Ächtung der [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetHouse.GetNameNoTooltip]-Familie erbitten"
 gdp_proscription_approval_decree_decision_desc: "Das Blut verrät einen immer. Die Verwandten eines Verräters sind von dessen Makel befallen und tragen dieselbe Bosheit in ihren hinterhältigen Herzen. Wenn die Versammlung zustimmt, können wir ihre gesamte Familie [Concept('banish', 'verbannen')|E] und uns von dieser feigen Blutlinie befreien."
 gdp_proscription_approval_decree_decision_tooltip: "Die [assembly|E] um Erlaubnis für eine [Concept('banish', 'Verbannung')|E] der gesamten Familie des von Euch angeklagten Charakters bitten"
 gdp_proscription_approval_decree_decision_confirm: "Genehmigung einer Ächtung erbitten"
 gdp_proscription_approval_decree_decision_effect_desc: "Ihr erhaltet die Erlaubnis, die gesamte Familie von [indicted_character.GetShortUIName] zu [Concept('banish', 'verbannen')|E]."
 gdp_proscription_approval_decree_decision_effect_no_indicted_desc: "Ihr erhaltet die Erlaubnis, die gesamte Familie eines von Euch angeklagten Charakters zu [Concept('banish', 'verbannen')|E]."
 must_have_assembly_approval_proscription_desc: "Ihr habt #bold nicht#! die Zustimmung der [assembly|E], um die gesamte Familie dieses Charakters zu [Concept('banish', 'verbannen')|E]"
 gained_assembly_approval_proscription_desc: "Ihr habt bereits die Zustimmung der [assembly|E] erlangt, um die gesamte Familie von [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName] zu [Concept('banish', 'verbannen')|E]"
 gdp_execution_approval_decree_decision: "Erlaubnis zur Hinrichtung erbitten"
 gdp_execution_approval_decree_decision_named: "Hinrichtung von [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUINameNoTooltipNoFormat] erbitten"
 gdp_execution_approval_decree_decision_desc: "Trotz der Güte unserer Herrschaft gibt es immer noch Menschen, die ihre Existenz bedrohen würden. Die von ihnen ausgehende Gefahr ist so groß, dass wir nicht ruhen können, solange sie noch atmen. Mit Zustimmung der Versammlung dürfen wir sie [execute|El] und so unserem Volk Sicherheit geben."
 gdp_execution_approval_decree_decision_tooltip: "Die [assembly|E] um Erlaubnis für eine [Concept('execute', 'Hinrichtung')|E] des von Euch angeklagten Charakters bitten"
 gdp_execution_approval_decree_decision_confirm: "Erlaubnis zur Hinrichtung erbitten"
 gdp_execution_approval_decree_decision_effect_desc: "Ihr erhaltet die Erlaubnis, [indicted_character.GetShortUIName] [Concept('execute', 'hinzurichten')|El]."
 gdp_execution_approval_decree_decision_effect_no_indicted_desc: "Ihr erhaltet die Erlaubnis, einen von Euch angeklagten Charakter [Concept('execute', 'hinzurichten')|El]."
 must_have_assembly_approval_execution_desc: "Ihr habt #bold nicht#! die Zustimmung der [assembly|E], um diesen Charakter zu [Concept('execute', 'hinzurichten')|El]"
 gained_assembly_approval_execution_desc: "Ihr habt bereits die Zustimmung der [assembly|E] erlangt, um [ROOT.Char.MakeScope.Var('gdp_indicted_character').Char.GetShortUIName] [Concept('execute', 'hinzurichten')|El]"
 gdp_has_no_valid_indicted_character_desc: "Ihr habt #bold niemanden#! vor der [assembly|E] angeklagt"
 gdp_has_no_valid_indicted_family_desc: "Ihr habt #bold nicht#! das Oberhaupt einer [patrician_family|E] vor der [assembly|E] angeklagt"
 gdp_indicted_family_head_is_player_desc: "Das angeklagte Oberhaupt der [patrician_family|E] darf #bold kein#! Spieler sein"
 gdp_overthrow_government_decision: "Regierung stürzen"
 gdp_overthrow_government_decision_desc: "Die Führung dieser Republik ist bis ins Mark verdorben. Es ist an der Zeit, das Staatsschiff wieder auf Kurs zu bringen und die Korrupten und Schwachen zu stürzen, damit in [ROOT.Char.GetLiege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] wieder die republikanische Tugend herrscht.\n\nIch werde Verbündete finden, und gemeinsam werden wir die Regierung von [ROOT.Char.GetLiege.GetNameNoTooltip] stürzen."
 gdp_overthrow_government_decision_tooltip: "Die derzeitige [republic|E]-Regierung stürzen und Euch selbst [Select_CString(ROOT.Char.IsFemale, 'zur Herrscherin', 'zum Herrscher')] machen"
 gdp_overthrow_government_decision_confirm: "Erlöse uns von Tyrannen!"
 you_are_patrician_desc: "Ihr seid ein landloser [patrician|E]."
 overthrow_government_effect_tooltip: "#WEAK Diese Entscheidung beginnt ein [hostile_scheme|El], um die Regierung zu stürzen.#!\n$EFFECT_LIST_BULLET$ Ihr könnt neuer [liege|E] werden\n$EFFECT_LIST_BULLET$ Eure [rivals|E] oder politischen Feinde könnten die [republic|E] verlassen\n$EFFECT_LIST_BULLET$ Die Gesetze der Republik ändern sich ohne Zustimmung [assembly_possessive|E], um sich an Eure Hausbestrebungen anzupassen\n@alert_icon! #alert_trial Eine Verschwörung gegen den Staat ist ein schweres [crime|E], wenn sie denn aufgedeckt wird#!"
 gdp_overthrow_agent_focus_balance: "Ausgewogene [Concept('agent', 'Agenten')|E]-Anordnung"
 gdp_overthrow_agent_focus_success: "Schwerpunkt der [agents|E] erhöht [scheme_potential|E]"
 gdp_overthrow_agent_focus_speed: "Schwerpunkt der [agents|E] verringert [scheme_speed|E]"
 gdp_overthrow_agent_focus_secrecy: "Schwerpunkt der [agents|E] erhöht [secrecy|E]"
