 # Renounce Family Title
 gdp_renounce_noble_family_title_decision: "Sich als Oberhaupt von Haus [ROOT.Char.GetHouse.GetBaseNameNoTooltip] zur Ruhe setzen"
 gdp_renounce_noble_family_title_decision_republic_desc: "Sich auf die Familien-[consortery|E] zurückziehen und aller [titles|E] entsagen, einschließlich jenes als [Concept('house_head', 'Hausoberhaupt')|E]. Alles wird [ROOT.Char.GetHouse.GetHeirOfHouse.GetTitledFirstName], [Select_CString(ROOT.Char.GetHouse.GetHeirOfHouse.IsFemale, 'der Erbin', 'dem Erben')] Eures [Concept('house_possessive', 'Hauses')|E], anvertraut und ermöglicht es [ROOT.Char.GetHouse.GetHeirOfHouse.Custom('DE_PRO_PER_S_3P_D')], [house|E] [ROOT.Char.GetHouse.GetName] zu neuen Höhen zu führen."
 gdp_renounce_noble_family_title_decision_republic_no_heir_desc: "Sich auf die Familien-[consortery|E] zurückziehen und aller [titles|E] entsagen, einschließlich jenes als [Concept('house_head', 'Hausoberhaupt')|E]. Alles wird dem Erben Eures [Concept('house_possessive', 'Hauses')|E] anvertraut und ermöglicht es ihm, [house|E] [ROOT.Char.GetHouse.GetName] in eine neue Richtung führen."
