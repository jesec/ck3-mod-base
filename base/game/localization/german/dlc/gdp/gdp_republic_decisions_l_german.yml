 agent_focus_success_tooltip: "$overthrow_government_interaction.tt.agent_focus_success$"
 agent_focus_speed_tooltip: "$overthrow_government_interaction.tt.agent_focus_speed$"
 agent_focus_secrecy_tooltip: "$overthrow_government_interaction.tt.agent_focus_secrecy$"
 gdp_quarantine_ship_decree_decision: "Trentina-Quarantäne"
 gdp_quarantine_ship_decree_decision_desc: "#bold Dies ist der Wille der Versammlung:#!\nEine dreißigtägige Quarantäne wird eingeführt, um die Ausbreitung schädlicher Dünste einzudämmen, die zu Seuchen und anderen Leiden führen."
 gdp_quarantine_ship_decree_decision_tooltip: "Eine Quarantäne für im Hafen einfahrende Schiffe erhöht die [epidemic_resistance|E], kostet aber [competitiveness|E] bei allen [trade_routes|E], die mit dem [trade_market|E] [capital_possessive|E] verbunden sind"
 gdp_quarantine_ship_decree_decision_confirm: "Trentina-Quarantäne eingeführt"
 gdp_quarantine_modifier_desc: "Jeder [character|E] mit einer [trade_route|E] auf dem [market|E] [capital_possessive|E]"
 DECREE_PLAGUE_APOCALYPTIC_DESC: "Ein apokalyptischer [Concept('epidemic', 'Seuchen')|E]-Ausbruch im [realm|E]"
 DECREE_PLAGUE_MAJOR_DESC: "Ein großer [Concept('epidemic', 'Seuchen')|E]-Ausbruch im [realm|E]"
 DECREE_PLAGUE_MINOR_DESC: "Ein kleiner [Concept('epidemic', 'Seuchen')|E]-Ausbruch im [realm|E]"
 DECREE_PLAGUE_NONE_DESC: "Es gibt keinen [Concept('epidemic', 'Seuchen')|E]-Ausbruch im [realm|E]"
 gdp_enforce_curfew_decree_decision: "Nächtliche Ausgangssperre"
 gdp_enforce_curfew_decree_decision_desc: "#bold Dies ist der Wille der Versammlung:#!\nEine strenge Ausgangssperre wird hiermit eingeführt und durchgesetzt, um verbrecherische Umtriebe in den Abendstunden einzudämmen."
 gdp_enforce_curfew_decree_decision_tooltip: "Nächtliche Ausgangssperre eingeführt, um verbotenes Verhalten und verbrecherische Komplotte zu unterbinden"
 gdp_enforce_curfew_decree_decision_confirm: "Nächtliche Ausgangssperre eingeführt"
 gdp_enforce_curfew_decree_decision_effect_desc: "Die nächtliche Ausgangssperre senkt die Effektivität [Concept('hostile_scheme', 'feindseliger Komplotte')|E] und steigert die [control|E]"
 gdp_republic_curfew_desc: "Alle [vassals|E] im [capital|E]"
 gdp_sponsor_craft_guild_decision: "Handwerkszunft unterstützen"
 gdp_sponsor_craft_guild_decision_desc: "In einer Republik bringt die Anerkennung als Handwerkszunft große Vorteile mit sich. Daher bemühen sich Handwerker vieler Berufe um eine offizielle Charta, die von der Versammlung ausgearbeitet und genehmigt wird. Sie bei diesem Prozess zu unterstützen, ist nicht nur gut für die Stadt, denn der Patrizier, der den Antrag der Versammlung vorlegt, wird von der neuen Zunft auch als Gönner angesehen."
 gdp_sponsor_craft_guild_decision_tooltip: "Wenn Ihr eine Handwerkszunft fördert, steigen [prosperity_growth|E] und [urban_tax|E] im [capital|e] der [county|E], und das Wachstum der [trade_competitiveness|E] und die [trade_expertise|E] Eures [Concept('house', 'Hauses')] werden gesteigert"
 gdp_sponsor_craft_guild_decision_confirm: "Eine neue Handwerkszunft unterstützen"
 gdp_request_noble_magistracy_decision: "Adelsmagistratentum erbitten"
 gdp_request_noble_magistracy_decision_desc: "Zwar sind die meisten Beamtenposten für Patrizier nicht zugänglich, doch es gibt Ämter, die Adelsmagistraten vorbehalten sind. Das ist das perfekte Amt für einen jungen, ehrgeizigen Patrizier, um die Fäden der Staatsführung kennenzulernen und sich einen Namen zu machen."
 gdp_request_noble_magistracy_decision_tooltip: "Das Adelsmagistratentum erhöht den Zuwachs in Sachen [dynasty_prestige|E] und [lifestyle_experience|E], die [opinion|E] Eures [Concept('heir_possessive', 'Erbens')|E] sowie dessen [stress_gain|E]"
