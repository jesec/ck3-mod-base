 gdp_gather_popular_support_decision: "Unterstützung durch das Volk gewinnen"
 gdp_gather_popular_support_decision_desc: "Die Bürger von [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] können unberechenbar sein und eine gefährliche Kraft darstellen, wenn Unruhen ausbrechen. Zieht man sie jedoch auf seine Seite, sind die Massen ein mächtiges Werkzeug, das sich nach unserem Willen lenken lässt."
