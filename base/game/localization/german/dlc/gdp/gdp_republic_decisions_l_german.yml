 gdp_petition_for_state_protection_decision: "Bitte um staatlichen Schutz"
 gdp_petition_for_state_protection_decision_desc: "Der Staat kann denjenigen, die er dafür als würdig erachtet, ein hohes Maß an Schutz gewähren."
