 gdp_improve_trade_post_market_decision: "Handelsposten auf dem Markt nutzen"
 gdp_improve_trade_post_market_decision_desc: "Unsere Handelsposten erweitern unsere Reichweite und festigen unseren Einfluss auf fernen Märkten. Je mehr Handelsposten wir besitzen, desto mehr Kontrolle können wir über die Märkte ausüben, auf denen wir Handel treiben."
