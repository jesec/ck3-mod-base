 gdp_republic_recruit_talent_decision_desc: "Ein Handelsreich erfordert viele Talente und helfende Hände. An erster Stelle stehen dabei die Händler, die unsere Handelsrouten verwalten, sowie auf fernen Märkten verhandeln und somit das Rückgrat unseres Reichtums bilden."
