 #City Stroll
 gdp_republic_city_stroll_decision: "Spaziergang durch [GetPlayer.GetCapitalLocation.GetNameNoTooltip]"
 gdp_republic_city_stroll_decision_desc: "Als Händler die Bedürfnisse des Marktes vorherzusehen und Reichtum anzuhäufen, ist so einfach, wie mit der Zeit zu gehen. Wie geht man mit der Zeit? Man lernt die Leute in der Stadt kennen und verschafft sich einen Eindruck von [GetPlayer.GetCapitalLocation.GetNameNoTooltip]!"
