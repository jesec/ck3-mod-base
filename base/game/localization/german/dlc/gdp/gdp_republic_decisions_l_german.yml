 gdp_request_relief_from_bankruptcy_decision: "Schutz vorm Bankrott erbitten"
 gdp_request_relief_from_bankruptcy_decision_desc: "Um zu verhindern, dass angesehene Familien in den Ruin geraten, kann die Versammlung die Staatskasse der Republik nutzen, um Geldgeber zu befriedigen und uneinbringliche Forderungen zu tilgen. Dadurch erhält der ruinierte Patrizier die Gelegenheit, sich vom Rand des Bankrotts wieder hochzukämpfen."
 gdp_request_relief_from_bankruptcy_decision_tooltip: "Ein Schutz vorm Bankrott tilgt Eure [gold|E]-Schulden mithilfe des [republic|E]-[Concept('treasury', 'Schatzes')|E]"
