 gdp_trade_post_charity_decision_desc: "Unsere Handelsposten sind kleine Handelszentren, in denen rund um die Uhr reges Treiben herrscht. Trotz aller Bemühungen werden manche Waren gelegentlich übersehen und verstauben dann in einer Ecke.\n\nDa es kaum Hoffnung gibt, sie zu verkaufen, nutzen wir sie besser, indem wir sie an Bedürftige verschenken."
