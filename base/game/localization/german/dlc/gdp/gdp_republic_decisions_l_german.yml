 gdp_republic_clear_great_plaza_decision_desc: "Auf dem Großen Platz gibt es zahlreiche Gebäude, Abteilungen und andere Einrichtungen. Nicht alle davon werden gebraucht, manche sind sogar überflüssig. Wenn man einige dieser Gebäude abbauen würde, könnte man Platz für neue schaffen."
