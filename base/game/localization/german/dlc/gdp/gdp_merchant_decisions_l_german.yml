 merchant_write_travelogue_decision_desc: "Ob als Bauer oder als [ROOT.Char.GetSuzerain.GetTopLiege.GetTitleAsNameNoTooltip]: Das Volk von [ROOT.Char.GetSuzerain.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] und die ganze Welt dürstet nach Geschichten aus fernen Landen und exotischen Völkern."
 merchant_write_travelogue_decision_tooltip: "Die Arbeit an einem Reisebericht-Buch-[artifact|E] auf Grundlage Eurer Erfahrungen beginnen"
