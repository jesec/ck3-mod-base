 gdp_decision.3000.opening: "[new_patron.Custom2('AppropriateGreetingPositive', new_client)]"
 gdp_decision.3000.desc: "Ich suche nach angesehenen und geschäftstüchtigen Kaufleuten wie Euch, um nach [new_patron.GetPrimaryTitle.GetName] umzuziehen.\n\nIm Gegenzug sorge ich dafür, dass Ihr auf unseren Märkten im Vorteil seid."
