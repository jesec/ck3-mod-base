 gdp_decision.3000.b: "Wir gehen nirgendwohin!"
 gdp_decision.3000.c: "[ROOT.Char.GetDomicile.GetLocation.GetBaronyNameExplicitlyNoTooltip|U] ist unser Zuhause, jetzt und für immer."
