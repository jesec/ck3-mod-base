 craft_artifact: "Artefakt erschaffen"
 craft_artifact_action: "Artefakt erschaffen"
 craft_artifact_desc: "Ich werde mich bemühen, ein [Concept('company', 'Gesellschafts')|E]-[domicile_artifact|E] zu erschaffen."
 craft_artifact_desc_general: "Das [scheme|E] „$craft_artifact$“ ist ein [Concept('personal_scheme', 'persönliches Komplott')|E], in dessen Rahmen Ihr und Eure [company|E] Euch bemüht, ein gänzlich neues [domicile_artifact|E] zu erschaffen. Dieses Komplott stützt sich vornehmlich auf Eure eigene [stewardship|E].\n\nDie [success_chance|E] wird von vielem beeinflusst, aber hauptsächlich Eurem [stewardship_skill|E] und der [aptitude|E] Eures $antiquarian_merchant$s."
 CRAFT_ARTIFACT_SUCCESS_DESC: "Neues [domicile_artifact|E] erstellen"
