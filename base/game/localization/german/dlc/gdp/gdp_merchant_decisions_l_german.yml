 gdp_sponsor_merchant_company_decision_candidate_tt: "Ihr habt einen erwachsenen, gesunden [courtier|E] in Eurem [capital|E], der nicht von [Concept('lowborn', 'niederer Geburt')|E], kein [heir|E] eines beliebigen [Concept('title', 'Titels')|E] und nicht Euer Elternteil, Kind, Geschwister, [spouse|E] oder [concubine|E] ist"
