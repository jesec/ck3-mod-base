l_german:
 gdp_repudiate_usurious_loan_decision: "Ein Wucherdarlehen denunzieren"
 gdp_repudiate_usurious_loan_decision_desc: "[ROOT.Var('loan_holder').Char.GetShortUINameNoTooltip] stellte die Anleihe gegen einen offenen Zinssatz aus, und unsere [ROOT.Char.GetRite.PriestNeuterPlural] vertreten die Auffassung, dass ein solcher Vertrag niemanden bindet. Die Schuld soll lieber erlassen als beglichen werden.\n\nEs handelt sich dabei nicht um Diebstahl. Es ist [ROOT.Char.GetRite.GetAdjectiveNoTooltip|l]es Recht, doch jeder Kaufmann zwischen hier und dem Meer wird es als Diebstahl bezeichnen."
 gdp_repudiate_usurious_loan_decision_tooltip: "Lasst Euren [clergy|E] die Schulden als [usury|E] erlassen und behaltet das [gold|E] auf Kosten Eures Rufs unter den [Concept('merchants', 'Kaufleuten')|E]"
 gdp_repudiate_usurious_loan_decision_confirm: "Kein in Sünde geschlossener Vertrag bindet mich!"
 gdp_repudiate_usurious_loan_decision_afford_repay_tt: "Ihr könnt es Euch nicht leisten, dieses [loan|E] zurückzuzahlen"
 gdp_repudiate_usurious_loan_not_repudiator_tt: "Ihr habt in jüngster Zeit keinen [creditor|E] denunziert"
 gdp_repudiate_usurious_loan_credit_tt: "@warning_icon! #X [merchants|E] werden Euch auf absehbare Zeit wohl keinen Kredit gewähren#!"
 gdp_repudiate_usurious_loan_needs_cleric_tt: "Euer [rite|E] muss das Darlehen als Sünde betrachten, und ein Klerus-Herrscher Eures [Concept('faith', 'Glaubens')|E] muss nah genug sein, um es für ungültig zu erklären: einer, dessen [rite|E] mit dem Euren übereinstimmt, der weder Euer [creditor|E] noch Euer [rival|E] ist und der sich nicht im Krieg mit Euch befindet.\n#weak Euer [head_of_faith|E], der Inhaber der [clerical_region|E] Eurer Hauptstadt oder Eures Standorts oder ein beliebiges Mitglied des [clergy|E] im Reich von Eurem [Concept('top_liege', 'obersten Lehnsherrn')|E].#!"
 gdp_repudiate_usurious_loan_needs_chaplain_tt: "[Concept('realm_priest', GetPlayer.GetCouncillorPosition('councillor_court_chaplain').GetPositionName)|E] von Euch muss entweder eine #P positive#! [opinion|E] von Euch haben oder muss Eure [puppet|E] mit einem [Concept('strong_hook', 'starken Druckmittel')|E] sein"
 become_merchant_decision: "Wird Kaufmann"
 become_merchant_decision_desc: "Was nützt der Dienst bei Hof, wenn man die Sitten der Menschen nicht kennt? Das Verlangen, in die Fremde zu ziehen und die Reiche der Welt zu verknüpfen – es ist zu stark, um es unbeachtet zu lassen."
 become_merchant_decision_tooltip: "Eure [titles|E] zurückziehen und eine [Concept('merchant', 'Kaufmanns')|E]-[company|E] gründen"
 become_merchant_decision_confirm: "Die Zeit des Handels ist da!"
 become_merchant_decision_house_head_tt: "Ihr müsst ein [house_head|E] sein"
 gdp_recently_became_adventurer_decision_cooldown_tt: "Ihr seid seit #V 5 Jahren#! [adventurer|E]"
 repudiate_loan_tt: "[repudiating_borrower.GetShortUIName|U] schuldet [repudiated_lender.GetShortUIName] das Darlehen nicht mehr"
 abuse_charter_authority_decision: "Charta-Autorität missbrauchen"
 abuse_charter_authority_decision_tooltip: "Eure [charter|E] nutzen, um [gold_i|E][gold|E] zu erlangen und Eure [competitiveness_i|E][competitiveness|E] zu steigern"
 abuse_charter_authority_decision_desc: "Ich trage eine Charta des Herrschers ([ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]) von [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip], sodass der Wille meiner Unternehmung ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) fast schon Gesetz ist. Mit dem Souverän des Reichs im Rücken wird es niemand wagen, sich unseren Interessen in den Weg zu stellen."
 abuse_charter_authority_decision_confirm: "Ich handle im Namen von [ROOT.Char.GetSuzerain.GetTitledFirstNameNoTooltip]!"
 abuse_charter_authority_decision.not_topdog_realm_or_steppe: "Die Autorität des [Concept('gurkhan', 'Gurkhans')|E] wird hier nicht anerkannt"
 abuse_charter_authority_decision.region_already_abused: "In diesen Landen wurde die Autorität des [Concept('gurkhan', 'Gurkhans')|E] bereits ausgenutzt"
 abuse_charter_authority_decision.nothing_to_abuse: "Es gibt an diesem [location|E] kein Land, das sich ausbeuten lässt"
 gdp_charter_abused_market_modifier: "Missbrauchte Charta-Autorität"
 gdp_charter_abused_market_modifier_desc: "Dieser Charakter missbrauchte jene Autorität, die ihm durch eine Charta zur Stärkung der eigenen Gesellschaft verliehen wurde."
 gdp_charter_abused_market_county_modifier: "Missbrauchte Charta-Autorität"
 gdp_charter_abused_market_county_modifier_desc: "Dieser Gemeinde wurde von einer Kaufmannsgesellschaft ausgenutzt, die ihre Charta missbrauchte, um sich selbst zu bereichern."
 gdp_charter_leveraged_market_modifier: "Von Charta-Träger verdrängt"
 gdp_charter_leveraged_market_modifier_desc: "Die Gesellschaft dieses Charakters ist auf dem absteigenden Ast, weil sie ein Rivale mit einer Charta des Reichsherrschers verdrängte."
 gdp_charter_charitable_market_county_modifier: "Chartaveranlasste Entwicklung"
 gdp_charter_charitable_market_county_modifier_desc: "Dieser Gemeinde wurde von einer Kaufmannsgesellschaft entwickelt, die ihre Charta nutzte, um direkt einzugreifen."
 gdp_decision.1000.t: "Verstimmung [Select_CString(patron.IsFemale, 'der Gönnerin', 'des Gönners')]"
 gdp_decision.1000.desc: "Ein Bote überbringt Nachricht aus den Hallen von [patron.GetTitledFirstNameNoTooltipRegnal], wo man [Select_CString(patron.IsFemale, 'meiner Gönnerin', 'meinem Gönner')] Vorwürfe wegen der Verfehlungen meiner Gesellschaft vorträgt, [Select_CString(patron.IsFemale, 'die', 'der')] diesen mit versteinertem Gesicht lauscht.\n\nMir wurde berichtet, dass Magistrate unser Fehlverhalten detailliert auflisteten und sich [patron.GetTitleAsNameNoTooltip] allmählich gegen mich wandte.\n\nNun verlangt [Select_CString(patron.IsFemale, 'meine Gönnerin', 'mein Gönner')] eine sofortige Stellungnahme, in der wir unsere Taten erklären …"
 gdp_decision.1000.a: "„Ich begrüße einen Urteilsspruch.“"
 gdp_decision.1000.b: "„Ihr versteht doch sicher, dass ich es für das Reich tat …“"
 gdp_decision.1000.b.success: "[Select_CString(patron.IsFemale, 'Eure Gönnerin', 'Euer Gönner')] ist gnädig"
 gdp_decision.1000.b.failure: "[Select_CString(patron.IsFemale, 'Eure Gönnerin', 'Euer Gönner')] ist empört"
 gdp_decision.1000.a.effects: "Euer [merchant_patron|E] erhält einen [imprisonment_reason|E] und einen [execute_reason|E], die auf Euch abzielen"
 gdp_decision.1000.a.severe_effects: "Euer [merchant_patron|E] erhält einen [imprisonment_reason|E] und einen [execute_reason|E], die auf Euch und Eure [close_family_members|El] abzielen"
 gdp_decision.1000.a.survived_patrons_wrath: "Auch wenn Ihr den Zorn Eures [Concept('merchant_patron_possessive', 'Gönners')|E] überstanden habt, werdet Ihr seine Autorität nicht wieder missbrauchen können"
 gdp_decision.1010.t: "$gdp_decision.1000.t$"
 gdp_decision.1010.intro: "Als [ROOT.Char.GetTitleAsNameNoTooltip] handeln die Kaufleute von [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] in meinem Namen und keine mehr als jene, die Chartas mit meinem Siegel tragen.\n\n"
 gdp_decision.1010.desc: "$gdp_decision.1010.intro$Es scheint, dass einer dieser Höker namens [merchant.GetName] meine Gnade ausnutzte und [merchant.Custom('DE_PRO_POS_S_3P')]e privilegierte Autorität missbrauchte, um sich selbst auf Kosten des Volks zu bereichern.\n\nDass dieser Mensch sich so etwas herausnimmt, ist eine Frechheit, doch ich muss auch abwägen, welchen Vorteil solche Händler dem Reichtum bringen."
 gdp_decision.1010.a: "Dafür wird [merchant.Custom('DE_PRO_PER_S_3P_N')] sich verantworten müssen!"
 gdp_decision.1010.a.tt: "Andere [clients|E] mit Euren [charters|E] werden weniger bereitwillig Eure Autorität missbrauchen, wenn [merchant.GetShortUIName] [imprisoned|El] wird"
 gdp_decision.1010.b: "Ich werde das durchgehen lassen … Fürs Erste."
 gdp_decision.1010.c: "Dieses Gezanke unter Krämern ist unter meiner Würde."
 gdp_decision.1010.c.flavor: "Ein weiterer Missbrauch Eurer Autorität könnte erfolgen, doch Ihr werdet nicht mehr benachrichtigt werden"
 gdp_decision.1010.d: "[merchant.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] …? Denen habe ich gar keine Charta ausgestellt!"
 gdp_decision.1020.t: "Im Namen [patron.GetTitleAsNamePossessiveNoTooltip]"
 gdp_decision.1020.opening: "Mit einem Wink mit meiner Charta tun sich die Tore von [market_province.GetBaronyNameExplicitly] und die Amsstuben seiner Magistrate im Namen von [patron.GetTitledFirstName] auf.\n\n"
 gdp_decision.1020.market_holder: "[market_holder.GetTitledFirstName|U], das örtliche hohe Tier, brachte [market_holder.Custom('DE_PRO_POS_S_3P')] Missvergnügen zum Ausdruck und blaffte, [Select_CString(patron.IsFemale, 'die', 'der')] [patron.GetTitleAsNameNoTooltip] würde davon erfahren. Doch [market_holder.Custom('DE_PRO_POS_S_3P')] Geplapper ist unbedeutend. Das Dokument lässt sich nicht anzweifeln.\n\n"
 gdp_decision.1020.closing: "Da die Stadt nach meiner Pfeife tanzt, können die Vertreter der Gesellschaft die Markteinrichtungen sichern, Waren ohne ordnungsgemäße Papiere beschlagnahmen und unsere Wettbewerber mit haltlosen Behauptungen und Anschuldigungen schikanieren."
 gdp_decision.1020.a: "Niemand kann sich uns in den Weg stellen."
 gdp_decision.1020.b: "Wir sollten [market_holder.GetTitledFirstNameNoTooltip] beteiligen."
 gdp_decision.1020.c: "Ich habe es mir anders überlegt."
 gdp_decision.1020.d: "„Meine #EMP Inspektion#! ist abgeschlossen. Für dieses Mal …“"
 gdp_decision.1020.b.success: "Kein Wort dringt [Select_CString(patron.IsFemale, 'zur', 'zum')] [patron.GetTitleAsNameNoTooltip] vor"
 gdp_decision.1020.b.failure: "[patron.Custom('DE_ART_DEF_S_N')|U] [patron.GetTitleAsNameNoTooltip] hört von Eurem Missbrauch"
 benevolent_charter_authority_decision: "Örtliche Direktinvestitionen"
 benevolent_charter_authority_decision_tooltip: "Eure [charter|E] nutzen, um ein [building_i|E][building|E] zu entwickeln und den örtlichen [prosperity_i|E][prosperity|E] zu steigern"
 benevolent_charter_authority_decision_desc: "Mit den Befugnissen des Herrschers ([ROOT.Char.GetSuzerain.GetTitleAsNameNoTooltip]) von [ROOT.Char.GetSuzerain.GetPrimaryTitle.GetNameNoTierNoTooltip] besitze ich ausreichend Druckmittel, um direkt in das Reich einzugreifen, was die Möglichkeiten einer schlichten Handelsgesellschaft sonst übersteigen würde."
 benevolent_charter_authority_decision_confirm: "Viel Gutes kann im Namen [ROOT.Char.GetSuzerain.GetTitleAsNamePossessiveNoTooltip] bewirkt werden."
 merchant_charter_intervention_county_cooldown: "Ihr habt in den letzten #V 5#! Jahren nicht in [THIS.Char.GetDomicile.GetLocation.GetName] eingegriffen#!"
 gdp_decision.1200.t: "Freude [Select_CString(patron.IsFemale, 'der Gönnerin', 'des Gönners')]"
 gdp_decision.1200.desc: "Aus den Hallen von [patron.GetTitledFirstNameNoTooltipRegnal] erfuhr ich, dass man die Initiative meiner Gesellschaft vor [Select_CString(patron.IsFemale, 'meiner begeisterten Gönnerin', 'meinem begeisterten Gönner')] ausgiebig lobte.\n\nMehrere Zeugen sprachen in höchsten Tönen von meiner Unternehmung ([ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip]) und ihrem jüngsten Eingreifen.\n\nDeshalb schickte [Select_CString(patron.IsFemale, 'die', 'der')] [patron.GetTitleAsNameNoTooltip] selbst eine Nachricht an die Gesellschaft geschickt: „Gut[ROOT.Char.Custom('DE_END_ADJ_IND_S_N')] [ROOT.Char.GetTitledFirstNameNoTooltip], Eure Bemühungen kommen dem ganzen Reich zugute!“"
 gdp_decision.1200.a: "„Die Gesellschaft freut sich, zu Diensten sein zu können.“"
 gdp_decision.1200.b: "„Anerkennung ist willkommen, doch Belohnungen sind dies auch.“"
 gdp_decision.1200.b.flavor: "Mit allem gebotenen Respekt …"
 gdp_decision.1200.b.success: "[Select_CString(patron.IsFemale, 'Eure Gönnerin', 'Euer Gönner')] ist großzügig"
 gdp_decision.1200.b.failure: "[Select_CString(patron.IsFemale, 'Eure Gönnerin', 'Euer Gönner')] ist enttäuscht"
 gdp_decision.1210.t: "$gdp_decision.1200.t$"
 gdp_decision.1210.desc: "$gdp_decision.1010.intro$Es scheint, dass [Select_CString(merchant.IsFemale, 'eine solche Hökerin', 'ein solcher Höker')] namens [merchant.GetName] [merchant.Custom('DE_PRO_POS_S_3P')]e privilegierte Autorität zum Wohl des Reichs nutzte und in die Entwicklung von [market_province.GetBaronyNameExplicitlyNoTooltip] investierte!\n\nEin solch verdienstreiches Verhalten muss dringend gelobt werden, und wenn man auch noch für Anreize sorgt, wird solches Wohlverhalten weiter ermutigt."
 gdp_decision.1210.a: "So viel Eigenantrieb sollte gefördert werden."
 gdp_decision.1210.a.tt: "Andere [clients|E] mit Euren [charters|E] werden bereitwilliger Eure Autorität wohlmeinend einsetzen"
 gdp_decision.1210.b: "Bei der höchsten Macht ([ROOT.Char.GetFaith.HighGodName])! Vielleicht gibt es also #EMP doch#! ehrliche Kaufleute!"
 gdp_decision.1210.c: "Belästigt mich nicht mit derlei Dingen."
 gdp_decision.1210.c.flavor: "Weitere wohlmeinende Nutzungen Eurer Autorität könnten erfolgen, doch Ihr werdet nicht mehr benachrichtigt werden"
 gdp_decision.1220.t: "Im Namen [patron.GetTitleAsNamePossessiveNoTooltip]"
 gdp_decision.1220.opening: "Meine Vorstellung in [market_province.GetBaronyNameExplicitly] mit der Charta in der Hand stieß bei den örtlichen Magistraten zunächst auf Bestürzung, doch schon bald konnte ich ihnen vermitteln, dass meine Gesellschaft es gut meint.\n\n"
 gdp_decision.1220.market_holder: "[market_holder.GetTitledFirstName], das örtliche hohe Tier, hört sich meinen Vorschlag aufmerksam an und hält es für vorteilig, Herstellung und Handel vor Ort bei [market_holder.Custom('DE_PRO_POS_S_3P')]en Untertanen zu ermutigen.\n\n"
 gdp_decision.1220.closing: "Bei einer Begehung des Ortes finden sich rasch Bereiche, in denen Reparaturen und Verbesserungen ganz offensichtlich nötig sind oder bei denen uns die Stadtbewohner auf solche aufmerksam machen."
 gdp_decision.1220.a: "„Worauf warten wir noch?“"
 gdp_decision.1220.d: "„Alles sehr interessant, doch andere Dinge sind wichtiger …“"
 press_the_advantage_decision: "Den Vorteil nutzen"
 press_the_advantage_decision_desc: "Unsere jüngsten Erfolge erwischten unsere Rivalen auf dem falschen Fuß und verunsicherten die Märkte. Nun ist es an der Zeit, Agenten, Gefallen und den hart erarbeiteten Vorteil für eine Route zu nutzen, sodass aus Druck Gewinn werden kann."
 press_the_advantage_decision_tooltip: "[competitive_pressure_i][competitive_pressure|E] einsetzen, um für eine gewisse Zeit eine bessere [competitiveness_i][trade_competitiveness|E] bei einer [trade_route|E] zu erlangen"
 press_the_advantage_decision_confirm: "Nutzen wir unseren Vorteil."
 merchant_competitive_pressure_gain_1_tt: "[competitive_pressure_i]#P 1#! [competitive_pressure|E] erhalten"
 merchant_competitive_pressure_gain_2_tt: "[competitive_pressure_i]#P [EmptyScope.ScriptValue('merchant_competitive_pressure_undercut_competition_gain_value')|0]#! [competitive_pressure|E] erhalten"
 merchant_competitive_pressure_spend_tt: "[competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [competitive_pressure|E] ausgeben"
 merchant_competitive_pressure_spend_cost_tt: "Ihr habt mindestens [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_spend_cost_value')|0]#! [competitive_pressure|E]"
 merchant_competitive_pressure_below_max_tt: "Ihr habt weniger als Euren maximalen [competitive_pressure_i][competitive_pressure|E] #weak ([GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_value')|0]/[GetPlayer.MakeScope.ScriptValue('merchant_competitive_pressure_current_max_value')|0])#!"
 press_the_advantage_route_not_already_pressed_tt: "Ihr habt eine aktive [trade_route|E], die nicht bereits davon profitiert, dass ein [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip] ist"
 press_the_advantage_selected_route_has_trader_tt: "Ausgewählte [trade_route|E] hat einen [trader|E]"
 press_the_advantage_selected_route_not_already_pressed_tt: "Ausgewählte [trade_route|E] profitiert nicht bereits davon, dass ein [GetModifier('merchant_competitive_pressure_route_modifier').GetNameWithTooltip] ist"
 merchant_competitive_pressure_route_modifier: "Vorteil durchgesetzt"
 merchant_competitive_pressure_route_modifier_desc: "Diese Handelsroute erhält konzentrierte Aufmerksamkeit von Agenten, die genau wissen, wo die Wettbewerber angreifbar sind."
 choose_specialized_market_decision: "Spezialisierten Markt auswählen"
 choose_specialized_market_decision_desc: "Ein Unternehmen, das die Gepflogenheiten, die Entscheidungsträger und die verborgenen Kanäle eines Marktes versteht, kann sich auch in fremden Straßen heimisch fühlen. Indem wir unsere Inspektoren auf einen bestimmten Markt entlang unserer Routen konzentrieren, verwandeln wir Ortskenntnis in einen Geschäftsvorteil."
 choose_specialized_market_decision_tooltip: "[market_i][market|E] an einer Eurer [route_i][trade_routes|E] auswählen, um Euren Inspektor-Spezialisierungsbonus zu erhalten"
 choose_specialized_market_decision_confirm: "Markt studieren"
 choose_specialized_market_decision_effect_tt: "Der ausgewählte [market_i][market|E] wird Euer spezialisierter [market_i][market|E]"
 choose_specialized_market_has_valid_market_tt: "Ihr habt einen gültigen [market_i][market|E] an einer [route_i][trade_route|E] oder an Eurem [domicile|E]-Standort"
 choose_specialized_market_selected_market_has_valid_route_tt: "Ausgewählter [market_i][market|E] ist an einer Eurer [route_i][trade_routes|E] oder an Eurem [domicile|E]-Standort"
 choose_specialized_market_selected_market_is_new_tt: "Ausgewählter [market_i][market|E] ist noch kein spezialisierter [market_i][market|E]"
 merchant_inspector_specialized_market_tier_1_modifier: "$mustering_the_troops_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_1_modifier_desc: "Diese Gesellschaft verschaffte sich einen Überblick über die örtlichen Bräuche und Beamten sowie das Geschäftsgebaren dieses Markts."
 merchant_inspector_specialized_market_tier_2_modifier: "$local_inspection_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_2_modifier_desc: "Diese Gesellschaft unterhält ein sorgfältiges Inspektionsregime auf diesem Markt."
 merchant_inspector_specialized_market_tier_3_modifier: "$no_stone_unturned_perk_merchant_name$"
 merchant_inspector_specialized_market_tier_3_modifier_desc: "Diese Gesellschaft kartierte die Stände, Warenhäuser und stillen Vereinbarungen dieses Markts bis ins letzte Detail."
 merchant_inspector_specialized_market_master_modifier: "$personal_touch_perk_merchant_name$"
 merchant_inspector_specialized_market_master_modifier_desc: "Diese Gesellschaft kennt diesen Markt, wie man es nur durch langjährige Meisterschaft kann."
 pious_patronage_decision: "Fromme Gönnerschaft"
 pious_patronage_decision_desc: "Der Glaube öffnet Türen, die allein mit Geld verschlossen bleiben. Indem wir Schreine, Geistliche und wohltätige Werke auf einem Markt fördern, der bereits an unsere Handelsrouten angebunden ist, verwandeln wir gemeinsame Hingabe in geschäftliches Vertrauen."
 pious_patronage_decision_tooltip: "[piety_i][piety|E] einsetzen, um Eure [competitiveness_i][trade_competitiveness|E] auf einem [market_i][market|E] zu verbessern"
 pious_patronage_decision_confirm: "Gläubige finanzieren"
 pious_patronage_has_valid_market_tt: "Ihr habt eine [route_i][trade_route|E], die durch einen gültigen [market_i][market|E] verläuft, der noch keine [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip|l] hat"
 pious_patronage_selected_market_valid_faith_tt: "[market_i][market|E] auswählen, der Eurem [Concept('faith', 'Glauben')|E] folgt #weak (oder Ihr habt [GetPerk('prophet_perk').GetName(GetPlayer)])#!"
 pious_patronage_selected_market_has_valid_route_tt: "Ihr habt eine [route_i][trade_route|E] durch den ausgewählten [market_i][market|E]"
 pious_patronage_selected_market_no_modifier_tt: "Ihr habt noch keine [GetModifier('pious_patronage_market_modifier').GetNameWithTooltip|l] auf dem ausgewählten [market_i][market|E]"
 pious_patronage_different_faith_cost_tt: "Ihr braucht mindestens [piety_i]#V [EmptyScope.ScriptValue('massive_piety_value')|0]#! [piety|E], um Gönnerschaft auf einem [market_i][market|E] außerhalb Eures [Concept('faith', 'Glaubens')|E] zu gewähren"
 pious_patronage_market_modifier: "Fromme Gönnerschaft"
 pious_patronage_market_modifier_desc: "Diese Gesellschaft kommt in den Genuss religiöser Gönnerschaft auf diesem Markt."
 organize_the_venture_decision: "Unterfangen organisieren"
 organize_the_venture_decision_desc: "Ein vielversprechendes Unterfangen ist bereits in Gang. Mit strengeren Plänen, besseren Anweisungen und dem Druck der Gesellschaft dahinter kann man es voranbringen."
 organize_the_venture_decision_tooltip: "[competitive_pressure_i][competitive_pressure|E] einsetzen, um ein laufendes [contract_scheme|E] schneller voranzubringen"
 organize_the_venture_decision_confirm: "Bringt das Werk in Ordnung"
 merchant_competitive_pressure_organize_venture_spend_tt: "[competitive_pressure_i]#N [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! [competitive_pressure|E] ausgeben"
 merchant_competitive_pressure_organize_venture_spend_cost_tt: "Ihr habt mindestens [competitive_pressure_i]#V [EmptyScope.ScriptValue('merchant_competitive_pressure_organize_venture_cost_value')|0]#! [competitive_pressure|E]"
 organize_the_venture_active_contract_scheme_tt: "Ihr habt ein laufendes [contract_scheme|E], das noch nicht organisiert wurde"
 undercut_the_competition_decision: "Wettbewerber unterbieten"
 undercut_the_competition_decision_desc: "Gewinne können sich erholen. Ein verlorener Markt kann das nicht. Indem wir die Preise verringern und niedrigere Margen in unserer Gesellschaft hinnehmen, zwingen wir Rivalen auf unsicheren Boden."
 undercut_the_competition_decision_tooltip: "[competitive_pressure_i][competitive_pressure|E] erhalten und [competitiveness_i][trade_competitiveness|E] verbessern, was für gewisse Zeit zulasten der Verkaufspreise geht"
 undercut_the_competition_decision_confirm: "Unsere Margen beschneiden"
 undercut_the_competition_no_modifier_tt: "Ihr unterbietet noch nicht die Konkurrenz"
 set_company_focus_decision: "Schwerpunkt der Gesellschaft festlegen"
